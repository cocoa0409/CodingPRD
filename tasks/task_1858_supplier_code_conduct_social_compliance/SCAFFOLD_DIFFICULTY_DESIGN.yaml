            - { call: "POST /code-acknowledgments", payload: { supplier_id: "${sup_id}", code_version_id: "${cv_id}", signer_name: "L May", signer_title: "CEO", expected_supplier_version: "${sup_v}" }, as: SupplierContact, as_user_id: "${sup_id}" }
            - { call: "POST /facilities", payload: { supplier_id: "${sup_id}", name: "Boise Plant", country_code: "US", worker_count: 10, processes: ["canning"] }, as: SourcingProgramAdmin, captures: { fac_id: $.data.id } }
            - { call: "POST /auditors", payload: { full_name: "Lead Auditor", firm_name: "AuditCo", certifications: ["SA8000"], country_codes_covered: ["US"] }, as: AuditCoordinator, captures: { aud_id: $.data.id } }
            - { call: "POST /auditors", payload: { full_name: "Verifier", firm_name: "VerifyCo", certifications: ["SMETA"], country_codes_covered: ["US"] }, as: AuditCoordinator, captures: { aud2_id: $.data.id } }
            - { call: "POST /audits", payload: { facility_id: "${fac_id}", auditor_id: "${aud_id}", audit_type: "ANNUAL", announcement: "ANNOUNCED", scheduled_start: "2026-09-01T00:00:00Z", scheduled_end: "2026-09-02T00:00:00Z" }, as: AuditCoordinator, captures: { au_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SourcingProgramAdmin }
            - { call: "POST /audits/${au_id}/start", payload: {}, as: Auditor, as_user_id: "${aud_id}" }
            - { call: "POST /audits/${au_id}/findings", payload: { classification: "MAJOR", category: "WAGES", description: "Wage issue A" }, as: Auditor, as_user_id: "${aud_id}", captures: { f1: $.data.id } }
            - { call: "POST /audits/${au_id}/findings", payload: { classification: "MAJOR", category: "WORKING_HOURS", description: "Hours issue B" }, as: Auditor, as_user_id: "${aud_id}", captures: { f2: $.data.id } }
            - { call: "POST /audits/${au_id}/findings", payload: { classification: "MAJOR", category: "HEALTH_SAFETY", description: "Safety issue C" }, as: Auditor, as_user_id: "${aud_id}", captures: { f3: $.data.id } }
            - { call: "POST /audits/${au_id}/findings", payload: { classification: "MINOR", category: "ENVIRONMENT", description: "Minor issue D" }, as: Auditor, as_user_id: "${aud_id}", captures: { f4: $.data.id } }
            - { call: "POST /grievances", payload: { facility_id: "${fac_id}", channel: "WORKER_COMMITTEE", category: "SAFETY", severity: "CRITICAL", description: "Ammonia leak unaddressed" }, as: WorkerHotline, captures: { g_id: $.data.id } }
            - { call: "POST /corrective-action-plans", payload: { finding_id: "${f1}", actions: [{ description: "Fix wage issue A", owner: "HR", due_date: "2026-10-01T00:00:00Z" }] }, as: SupplierContact, as_user_id: "${sup_id}", captures: { cap_id: $.data.id } }
            - { call: "POST /corrective-action-plans/${cap_id}/review", payload: { decision: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /corrective-action-plans/${cap_id}/request-verification", payload: {}, as: SupplierContact, as_user_id: "${sup_id}" }
          trigger:
            - { call: "POST /corrective-action-plans/${cap_id}/verify", payload: { outcome: "FAIL", verification_note: "Not remediated" }, as: Auditor, as_user_id: "${aud2_id}", captures: { esc1: $.data.escalation_count } }
            - { call: "GET /suppliers/${sup_id}/scorecard", payload: {}, as: ComplianceOfficer, captures: { ver_after1: $.data.verified_score, tier_after1: $.data.consequence_tier } }
