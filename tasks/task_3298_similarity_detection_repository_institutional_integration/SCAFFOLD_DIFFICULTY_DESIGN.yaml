scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1: dual_variant_calc — two dual-variant calculations, DIFFERENT entity
  # domains: SimilarityReport (similarity scoring) vs AiWritingAssessment (AI
  # writing indicator).
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: similarity_report_raw_vs_filtered_diverge
        grounds:
          - calculations.similarity_score
          - calculations.match_weighting
          - entities.SimilarityReport.fields.raw_score_bps
          - entities.SimilarityReport.fields.filtered_score_bps
        distinguishing_aspect: |
          Entity domain = SimilarityReport. Identical fragment set, two variant
          scores: raw_score_bps (no exclusions) MUST be 2950 while
          filtered_score_bps (exclude_quotes + exclude_bibliography +
          exclude_small_matches@8) MUST be 950 — divergence comes purely from
          the variant, not the data.
        test_recipe:
          setup:
            - "US institution with ACTIVE integration and one Instructor-owned assignment with exclude_quotes=true, exclude_bibliography=true, exclude_small_matches=true, small_match_threshold_words=8"
            - "One GRANTED-consent student submission of exactly 1000 words with four injected fragments: DIRECT_QUOTE 120w @0, PARAPHRASE 100w @200, BIBLIOGRAPHY_ENTRY 80w @400, BOILERPLATE 30w @600 (no overlaps)"
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "State U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "CANVAS", external_key: "k1" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "i@x.edu", full_name: "Prof I" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/students", payload: { external_lms_id: "s1", email: "s@x.edu", full_name: "Stu One", home_region: "US" }, as: PlatformAdmin, captures: { stu_id: $.data.id, stu_v: $.data.version } }
            - { call: "POST /integrity/students/${stu_id}/consents", payload: { expected_student_version: "${stu_v}", consent_action: "GRANT" }, as: Student, as_user_id: "${stu_id}" }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "Essay", due_at: "2027-01-01T00:00:00Z", exclude_quotes: true, exclude_bibliography: true, exclude_small_matches: true, small_match_threshold_words: 8 }, as: Instructor, as_user_id: "${instr_id}", captures: { asg_id: $.data.id } }
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "<BODY_1000_WORDS: exactly 1000 whitespace-separated tokens>" }, as: Student, as_user_id: "${stu_id}", captures: { sub_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/source-documents", payload: { source_type: "INTERNET", uri: "https://src/1", region: "US" }, as: PlatformAdmin, captures: { src1: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/source-documents", payload: { source_type: "PUBLICATION", uri: "https://src/2", region: "US" }, as: PlatformAdmin, captures: { src2: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/source-documents", payload: { source_type: "INTERNET", uri: "https://src/3", region: "US" }, as: PlatformAdmin, captures: { src3: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/source-documents", payload: { source_type: "PUBLICATION", uri: "https://src/4", region: "US" }, as: PlatformAdmin, captures: { src4: $.data.id } }
            - { call: "POST /integrity/_matches/inject", payload: { submission_id: "${sub_id}", source_document_id: "${src1}", matched_word_count: 120, match_category: "DIRECT_QUOTE", offset_start: 0 }, as: PlatformAdmin }
            - { call: "POST /integrity/_matches/inject", payload: { submission_id: "${sub_id}", source_document_id: "${src2}", matched_word_count: 100, match_category: "PARAPHRASE", offset_start: 200 }, as: PlatformAdmin }
            - { call: "POST /integrity/_matches/inject", payload: { submission_id: "${sub_id}", source_document_id: "${src3}", matched_word_count: 80, match_category: "BIBLIOGRAPHY_ENTRY", offset_start: 400 }, as: PlatformAdmin }
            - { call: "POST /integrity/_matches/inject", payload: { submission_id: "${sub_id}", source_document_id: "${src4}", matched_word_count: 30, match_category: "BOILERPLATE", offset_start: 600 }, as: PlatformAdmin }
          trigger:
            - { call: "POST /integrity/submissions/${sub_id}/process", payload: {}, as: Instructor, as_user_id: "${instr_id}" }
            - { call: "GET /integrity/submissions/${sub_id}/similarity-reports", payload: {}, as: Instructor, as_user_id: "${instr_id}", captures: { raw_bps: "$.data[0].raw_score_bps", filt_bps: "$.data[0].filtered_score_bps" } }
          assert:
            - "Submission.${sub_id}.word_count == 1000 (exactly 1000 whitespace-separated tokens)"
            - "raw weighted sum = 120*1.0 + round_half_up(100*0.8) + 80*1.0 + round_half_up(30*0.5) = 120+80+80+15 = 295 -> raw_score_bps == round_half_up(10000*295/1000) == 2950"
            - "filtered excludes DIRECT_QUOTE(120) and BIBLIOGRAPHY_ENTRY(80); BOILERPLATE 30 >= 8 stays: 80+15 = 95 -> filtered_score_bps == round_half_up(10000*95/1000) == 950"
            - "2950 != 950 proves the two variants diverge on identical fragment data"
            - "exclusion_snapshot == { exclude_quotes: true, exclude_bibliography: true, exclude_small_matches: true, small_match_threshold_words: 8 } and report_state == DRAFT"
      - name: ai_assessment_point_vs_conservative_diverge
        grounds:
          - calculations.ai_confidence_score
          - entities.AiWritingAssessment.fields.ai_score_bps
          - entities.AiWritingAssessment.fields.conservative_score_bps
          - entities.AiWritingAssessment.fields.confidence_band
        distinguishing_aspect: |
          Entity domain = AiWritingAssessment (different from SimilarityReport).
          Identical signals (0.62, 0.74, 0.50) yield point estimate 6320 bps but
          conservative bound 4820 bps because spread 0.24 lands in MEDIUM band
          (margin 1500) — the variant subtracts the band margin and floors at 0.
        test_recipe:
          setup:
            - "US institution (ai_detection_enabled default true), ACTIVE integration, instructor, GRANTED-consent student, default COMPARE_ONLY assignment"
            - "One submission with content_text of exactly 250 words (>= 250 minimum) and signals ai_burstiness=0.62, ai_perplexity=0.74, ai_stylometry=0.50"
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "AI U", residency_region: "EU" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "MOODLE", external_key: "k2" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "i2@x.edu", full_name: "Prof Two" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/students", payload: { external_lms_id: "s2", email: "s2@x.edu", full_name: "Stu Two", home_region: "EU" }, as: PlatformAdmin, captures: { stu_id: $.data.id, stu_v: $.data.version } }
            - { call: "POST /integrity/students/${stu_id}/consents", payload: { expected_student_version: "${stu_v}", consent_action: "GRANT" }, as: Student, as_user_id: "${stu_id}" }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "Paper", due_at: "2027-01-01T00:00:00Z" }, as: Instructor, as_user_id: "${instr_id}", captures: { asg_id: $.data.id } }
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "<BODY_250_WORDS: exactly 250 whitespace-separated tokens>", ai_burstiness: 0.62, ai_perplexity: 0.74, ai_stylometry: 0.50 }, as: Student, as_user_id: "${stu_id}", captures: { sub_id: $.data.id } }
          trigger:
            - { call: "POST /integrity/submissions/${sub_id}/process", payload: {}, as: Instructor, as_user_id: "${instr_id}" }
            - { call: "GET /integrity/submissions/${sub_id}/ai-writing-assessments", payload: {}, as: Instructor, as_user_id: "${instr_id}", captures: { ai_bps: "$.data[0].ai_score_bps", band: "$.data[0].confidence_band", cons_bps: "$.data[0].conservative_score_bps", st: "$.data[0].assessment_state" } }
          assert:
            - "assessment_state == COMPLETE (ai_detection_enabled default true and word_count == 250 >= 250)"
            - "ai_score_bps == round_half_up(10000 * (0.62*0.5 + 0.74*0.3 + 0.50*0.2)) == round_half_up(6320.0) == 6320"
            - "confidence_band == MEDIUM because spread = 0.74 - 0.50 = 0.24, and 0.15 < 0.24 <= 0.30"
            - "conservative_score_bps == 6320 - 1500 == 4820 != 6320, proving the two variants diverge on identical signal input"

  # ===========================================================================
  # Rule 2: combinatorial_formula — two instances in DIFFERENT modes:
  # (a) >=3 inputs with non-linear interaction (similarity_score filtered
  #     variant: clamp + category branches + threshold filter + dedup), and
  # (b) nested rounding order (match_weighting: per-fragment rounding before
  #     summation vs sum-then-round).
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: filtered_score_nonlinear_interaction
        grounds:
          - calculations.similarity_score
          - entities.Assignment.fields.exclude_quotes
          - entities.Assignment.fields.exclude_small_matches
          - entities.Assignment.fields.small_match_threshold_words
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — the filtered score
          combines (i) category-branch exclusion flags, (ii) a threshold filter
          with strict-below semantics, (iii) an overlap-dedup max-selection, and
          (iv) a min(1, ...) clamp. Pinning exclusion flags flips the result
          between 400 bps and 2950 bps on the same fragments.
        test_recipe:
          setup:
            - "US institution, ACTIVE integration, instructor, GRANTED student, assignment A1 with ALL exclusions OFF, and a 1000-word submission with two OVERLAPPING fragments on the same source: DIRECT_QUOTE 100w @0 and PARAPHRASE 60w @50 (intervals [0,100) and [50,110) overlap)"
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "NL U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "CANVAS", external_key: "k3" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "i3@x.edu", full_name: "Prof Three" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/students", payload: { external_lms_id: "s3", email: "s3@x.edu", full_name: "Stu Three", home_region: "US" }, as: PlatformAdmin, captures: { stu_id: $.data.id, stu_v: $.data.version } }
            - { call: "POST /integrity/students/${stu_id}/consents", payload: { expected_student_version: "${stu_v}", consent_action: "GRANT" }, as: Student, as_user_id: "${stu_id}" }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "NL Essay", due_at: "2027-01-01T00:00:00Z" }, as: Instructor, as_user_id: "${instr_id}", captures: { asg_id: $.data.id } }
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "<BODY_1000_WORDS: exactly 1000 whitespace-separated tokens>" }, as: Student, as_user_id: "${stu_id}", captures: { sub_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/source-documents", payload: { source_type: "INTERNET", uri: "https://src/nl", region: "US" }, as: PlatformAdmin, captures: { src1: $.data.id } }
            - { call: "POST /integrity/_matches/inject", payload: { submission_id: "${sub_id}", source_document_id: "${src1}", matched_word_count: 100, match_category: "DIRECT_QUOTE", offset_start: 0 }, as: PlatformAdmin }
            - { call: "POST /integrity/_matches/inject", payload: { submission_id: "${sub_id}", source_document_id: "${src1}", matched_word_count: 60, match_category: "PARAPHRASE", offset_start: 50 }, as: PlatformAdmin }
          trigger:
            - { call: "POST /integrity/submissions/${sub_id}/process", payload: {}, as: Instructor, as_user_id: "${instr_id}" }
            - { call: "GET /integrity/submissions/${sub_id}/similarity-reports", payload: {}, as: Instructor, as_user_id: "${instr_id}", captures: { raw_bps: "$.data[0].raw_score_bps", filt_bps: "$.data[0].filtered_score_bps" } }
          assert:
            - "overlap dedup keeps only the larger weighted fragment: DIRECT_QUOTE weighted_words=100 beats PARAPHRASE round_half_up(60*0.8)=48; matched=100"
            - "raw_score_bps == round_half_up(10000*100/1000) == 1000"
            - "with all exclusions OFF, filtered_score_bps == raw_score_bps == 1000 (non-linear branches present but inactive)"
            - "the same fragments under exclude_quotes=true would yield filtered 480 bps (48/1000), proving the branch interaction changes results — covered by similarity_report_raw_vs_filtered_diverge"
      - name: per_fragment_rounding_order_matters
        grounds:
          - calculations.match_weighting
          - calculations.similarity_score
          - entities.MatchFragment.fields.weighted_words
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — three 1-word PARAPHRASE
          fragments yield 3 * round_half_up(0.8) = 3 weighted words under the
          pinned per-fragment-first order, vs round_half_up(2.4) = 2 under the
          forbidden sum-then-round order. The 100-word body makes the
          difference observable: 300 bps vs 200 bps.
        test_recipe:
          setup:
            - "US institution, ACTIVE integration, instructor, GRANTED student, default assignment, one 100-word submission with three 1-word PARAPHRASE fragments at offsets 0, 10, 20 (no overlap)"
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "Round U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "CANVAS", external_key: "k4" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "i4@x.edu", full_name: "Prof Four" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/students", payload: { external_lms_id: "s4", email: "s4@x.edu", full_name: "Stu Four", home_region: "US" }, as: PlatformAdmin, captures: { stu_id: $.data.id, stu_v: $.data.version } }
            - { call: "POST /integrity/students/${stu_id}/consents", payload: { expected_student_version: "${stu_v}", consent_action: "GRANT" }, as: Student, as_user_id: "${stu_id}" }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "Round Essay", due_at: "2027-01-01T00:00:00Z" }, as: Instructor, as_user_id: "${instr_id}", captures: { asg_id: $.data.id } }
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "<BODY_100_WORDS: exactly 100 whitespace-separated tokens>" }, as: Student, as_user_id: "${stu_id}", captures: { sub_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/source-documents", payload: { source_type: "PUBLICATION", uri: "https://src/r1", region: "US" }, as: PlatformAdmin, captures: { src1: $.data.id } }
            - { call: "POST /integrity/_matches/inject", payload: { submission_id: "${sub_id}", source_document_id: "${src1}", matched_word_count: 1, match_category: "PARAPHRASE", offset_start: 0 }, as: PlatformAdmin }
            - { call: "POST /integrity/_matches/inject", payload: { submission_id: "${sub_id}", source_document_id: "${src1}", matched_word_count: 1, match_category: "PARAPHRASE", offset_start: 10 }, as: PlatformAdmin }
            - { call: "POST /integrity/_matches/inject", payload: { submission_id: "${sub_id}", source_document_id: "${src1}", matched_word_count: 1, match_category: "PARAPHRASE", offset_start: 20 }, as: PlatformAdmin }
          trigger:
            - { call: "POST /integrity/submissions/${sub_id}/process", payload: {}, as: Instructor, as_user_id: "${instr_id}" }
            - { call: "GET /integrity/submissions/${sub_id}/similarity-reports", payload: {}, as: Instructor, as_user_id: "${instr_id}", captures: { raw_bps: "$.data[0].raw_score_bps" } }
          assert:
            - "each fragment's weighted_words == round_half_up(1 * 0.8) == 1 (per-fragment rounding at injection)"
            - "raw_score_bps == round_half_up(10000 * (1+1+1)/100) == 300, NOT 200 (the sum-then-round order is forbidden)"
            - "GET /integrity/submissions/${sub_id}/match-fragments returns 3 fragments each with weighted_words == 1"

  # ===========================================================================
  # Rule 3: non_linear_state_machine — two non-linear machines on DIFFERENT
  # entities: Submission (cyclic pipeline) vs Student (consent grant/withdraw
  # cycle gating intake).
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: submission_pipeline_cycle_reprocess
        grounds:
          - state_machines.Submission.RECEIVED_to_PROCESSING
          - state_machines.Submission.REPORT_READY_to_PROCESSING
          - state_machines.Submission.FAILED_to_PROCESSING
        distinguishing_aspect: |
          Entity = Submission; shape = cyclic (RECEIVED->PROCESSING->REPORT_READY
          ->PROCESSING->REPORT_READY loop, plus FAILED->PROCESSING retry). A
          linear pipeline could never re-enter PROCESSING after REPORT_READY;
          here the re-run MUST succeed and regenerate the report.
        test_recipe:
          setup:
            - "US institution, ACTIVE integration, instructor, GRANTED student, default assignment, one processed submission in REPORT_READY"
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "Cyc U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "CANVAS", external_key: "k5" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "i5@x.edu", full_name: "Prof Five" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/students", payload: { external_lms_id: "s5", email: "s5@x.edu", full_name: "Stu Five", home_region: "US" }, as: PlatformAdmin, captures: { stu_id: $.data.id, stu_v: $.data.version } }
            - { call: "POST /integrity/students/${stu_id}/consents", payload: { expected_student_version: "${stu_v}", consent_action: "GRANT" }, as: Student, as_user_id: "${stu_id}" }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "Cyc Essay", due_at: "2027-01-01T00:00:00Z" }, as: Instructor, as_user_id: "${instr_id}", captures: { asg_id: $.data.id } }
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "alpha beta gamma" }, as: Student, as_user_id: "${stu_id}", captures: { sub_id: $.data.id } }
            - { call: "POST /integrity/submissions/${sub_id}/process", payload: {}, as: Instructor, as_user_id: "${instr_id}" }
          trigger:
            - { call: "POST /integrity/submissions/${sub_id}/process", payload: {}, as: Instructor, as_user_id: "${instr_id}", captures: { st2: $.data.pipeline_state } }
            - { call: "GET /integrity/submissions/${sub_id}", payload: {}, as: Instructor, as_user_id: "${instr_id}", captures: { st3: $.data.pipeline_state, wc: $.data.word_count } }
          assert:
            - "first process leaves pipeline_state == REPORT_READY with word_count == 3"
            - "second process (the cycle edge REPORT_READY -> PROCESSING -> REPORT_READY) succeeds: final pipeline_state == REPORT_READY"
            - "GET /integrity/submissions/${sub_id}/similarity-reports returns exactly 1 report (regeneration upserts; no duplicate report rows)"
      - name: consent_cycle_regrant_enables_intake
        grounds:
          - state_machines.Student.GRANTED_to_WITHDRAWN
          - state_machines.Student.WITHDRAWN_to_GRANTED
        distinguishing_aspect: |
          Entity = Student (different from Submission); shape = cyclic
          (NOT_GIVEN->GRANTED->WITHDRAWN->GRANTED). The re-grant edge is what
          re-enables STRICT intake after a withdrawal — a linear consent model
          could never return to GRANTED.
        test_recipe:
          setup:
            - "US institution with STRICT integration (default), instructor, assignment, and one student whose consent has cycled NOT_GIVEN -> GRANTED -> WITHDRAWN -> GRANTED"
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "Consent U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "CANVAS", external_key: "k6" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "i6@x.edu", full_name: "Prof Six" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/students", payload: { external_lms_id: "s6", email: "s6@x.edu", full_name: "Stu Six", home_region: "US" }, as: PlatformAdmin, captures: { stu_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "Consent Essay", due_at: "2027-01-01T00:00:00Z" }, as: Instructor, as_user_id: "${instr_id}", captures: { asg_id: $.data.id } }
            - { call: "GET /integrity/institutions/${inst_id}/students", payload: {}, as: InstitutionalAdmin, captures: { v1: "$.data[0].version" } }
            - { call: "POST /integrity/students/${stu_id}/consents", payload: { expected_student_version: "${v1}", consent_action: "GRANT" }, as: Student, as_user_id: "${stu_id}", captures: { v2: $.data.version } }
            - { call: "POST /integrity/students/${stu_id}/consents", payload: { expected_student_version: "${v2}", consent_action: "WITHDRAW" }, as: Student, as_user_id: "${stu_id}", captures: { v3: $.data.version, cyc_st: $.data.consent_status } }
            - { call: "POST /integrity/students/${stu_id}/consents", payload: { expected_student_version: "${v3}", consent_action: "GRANT" }, as: Student, as_user_id: "${stu_id}", captures: { cyc_st2: $.data.consent_status } }
          trigger:
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "regrant works" }, as: Student, as_user_id: "${stu_id}", captures: { sub_id: $.data.id } }
          assert:
            - "consent_status after the full cycle == GRANTED (WITHDRAWN -> GRANTED re-grant edge taken)"
            - "intake succeeds: response 201 with pipeline_state == RECEIVED and word_count == 2"
            - "intermediate state was WITHDRAWN — STRICT intake during WITHDRAWN would have failed with ERR_CONSENT_MISSING (see corner instance intake_strict_consent_missing_rejected)"

  # ===========================================================================
  # Rule 4: transitive_cascade — two cascades from DIFFERENT triggers:
  # (a) depth >= 3 from source retract; (b) depth >= 2 from assignment PATCH.
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: source_retract_depth3_cascade
        grounds:
          - state_machines.SourceDocument.ACTIVE_to_RETRACTED
          - state_machines.SimilarityReport.FINALIZED_to_STALE
          - state_machines.GradeEntry.RELEASED_to_PROVISIONAL
        distinguishing_aspect: |
          Depth-3 chain from trigger POST /integrity/source-documents/{id}/retract:
          retract (hop 0) excludes its MatchFragments (hop 1) -> dependent
          FINALIZED report goes STALE (hop 2) -> RELEASED GradeEntry flips back
          to PROVISIONAL (hop 3). Each hop is caused by the previous hop, not
          by the retract call directly.
        test_recipe:
          setup:
            - "US institution, ACTIVE integration, instructor, GRANTED student, default assignment, one 100-word submission with one DIRECT_QUOTE 10w fragment on source S; processed, grade entry created, report FINALIZED (grade auto-RELEASED)"
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "Casc U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "CANVAS", external_key: "k7" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "i7@x.edu", full_name: "Prof Seven" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/students", payload: { external_lms_id: "s7", email: "s7@x.edu", full_name: "Stu Seven", home_region: "US" }, as: PlatformAdmin, captures: { stu_id: $.data.id, stu_v: $.data.version } }
            - { call: "POST /integrity/students/${stu_id}/consents", payload: { expected_student_version: "${stu_v}", consent_action: "GRANT" }, as: Student, as_user_id: "${stu_id}" }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "Casc Essay", due_at: "2027-01-01T00:00:00Z" }, as: Instructor, as_user_id: "${instr_id}", captures: { asg_id: $.data.id } }
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "<BODY_100_WORDS: exactly 100 whitespace-separated tokens>" }, as: Student, as_user_id: "${stu_id}", captures: { sub_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/source-documents", payload: { source_type: "INTERNET", uri: "https://src/c7", region: "US" }, as: PlatformAdmin, captures: { src1: $.data.id } }
            - { call: "POST /integrity/_matches/inject", payload: { submission_id: "${sub_id}", source_document_id: "${src1}", matched_word_count: 10, match_category: "DIRECT_QUOTE", offset_start: 0 }, as: PlatformAdmin }
            - { call: "POST /integrity/submissions/${sub_id}/process", payload: {}, as: Instructor, as_user_id: "${instr_id}" }
            - { call: "POST /integrity/submissions/${sub_id}/grade-entries", payload: { score_points: 88.5, feedback_text: "good" }, as: Instructor, as_user_id: "${instr_id}", captures: { grade_id: $.data.id } }
            - { call: "GET /integrity/submissions/${sub_id}/similarity-reports", payload: {}, as: Instructor, as_user_id: "${instr_id}", captures: { rep_id: "$.data[0].id" } }
            - { call: "POST /integrity/similarity-reports/${rep_id}/finalize", payload: { instructor_interpretation: "NOT_MISCONDUCT" }, as: Instructor, as_user_id: "${instr_id}" }
          trigger:
            - { call: "POST /integrity/source-documents/${src1}/retract", payload: {}, as: InstitutionalAdmin }
            - { call: "GET /integrity/submissions/${sub_id}/similarity-reports", payload: {}, as: Instructor, as_user_id: "${instr_id}", captures: { rep_state: "$.data[0].report_state" } }
            - { call: "GET /integrity/submissions/${sub_id}/grade-entries", payload: {}, as: Instructor, as_user_id: "${instr_id}", captures: { grade_state: "$.data[0].grade_state" } }
            - { call: "GET /integrity/submissions/${sub_id}/match-fragments", payload: {}, as: Instructor, as_user_id: "${instr_id}", captures: { frag_excl: "$.data[0].excluded" } }
          assert:
            - "hop 1: MatchFragment.excluded == true after source retract"
            - "hop 2: SimilarityReport.report_state == STALE (was FINALIZED)"
            - "hop 3: GradeEntry.grade_state == PROVISIONAL (was RELEASED) — compensation of the finalize cascade"
            - "GradeEntry.pinned_report_version remains the pre-cascade report version (version-pinning keeps the stale pin visible)"
      - name: assignment_patch_depth2_cascade
        grounds:
          - state_machines.SimilarityReport.DRAFT_to_STALE
          - state_machines.GradeEntry.RELEASED_to_PROVISIONAL
          - endpoints.PATCH_/integrity/assignments/{id}
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (PATCH
          /integrity/assignments/{id} toggling exclude_quotes): settings change
          (hop 0) stales the FINALIZED report (hop 1) -> RELEASED grade flips to
          PROVISIONAL (hop 2). Cascade originates from a different transition
          than source_retract_depth3_cascade.
        test_recipe:
          setup:
            - "US institution, ACTIVE integration, instructor, GRANTED student, assignment with exclude_quotes=false, one processed+FINALIZED submission with a RELEASED grade entry"
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "Patch U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "CANVAS", external_key: "k8" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "i8@x.edu", full_name: "Prof Eight" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/students", payload: { external_lms_id: "s8", email: "s8@x.edu", full_name: "Stu Eight", home_region: "US" }, as: PlatformAdmin, captures: { stu_id: $.data.id, stu_v: $.data.version } }
            - { call: "POST /integrity/students/${stu_id}/consents", payload: { expected_student_version: "${stu_v}", consent_action: "GRANT" }, as: Student, as_user_id: "${stu_id}" }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "Patch Essay", due_at: "2027-01-01T00:00:00Z", exclude_quotes: false }, as: Instructor, as_user_id: "${instr_id}", captures: { asg_id: $.data.id } }
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "quote heavy text" }, as: Student, as_user_id: "${stu_id}", captures: { sub_id: $.data.id } }
            - { call: "POST /integrity/submissions/${sub_id}/process", payload: {}, as: Instructor, as_user_id: "${instr_id}" }
            - { call: "POST /integrity/submissions/${sub_id}/grade-entries", payload: { score_points: 70 }, as: Instructor, as_user_id: "${instr_id}" }
            - { call: "GET /integrity/submissions/${sub_id}/similarity-reports", payload: {}, as: Instructor, as_user_id: "${instr_id}", captures: { rep_id: "$.data[0].id" } }
            - { call: "POST /integrity/similarity-reports/${rep_id}/finalize", payload: { instructor_interpretation: "NEEDS_REVIEW" }, as: Instructor, as_user_id: "${instr_id}" }
            - { call: "GET /integrity/assignments/${asg_id}", payload: {}, as: Instructor, as_user_id: "${instr_id}", captures: { asg_v: $.data.version } }
          trigger:
            - { call: "PATCH /integrity/assignments/${asg_id}", payload: { expected_assignment_version: "${asg_v}", exclude_quotes: true }, as: Instructor, as_user_id: "${instr_id}" }
            - { call: "GET /integrity/submissions/${sub_id}/similarity-reports", payload: {}, as: Instructor, as_user_id: "${instr_id}", captures: { rep_state: "$.data[0].report_state" } }
            - { call: "GET /integrity/submissions/${sub_id}/grade-entries", payload: {}, as: Instructor, as_user_id: "${instr_id}", captures: { grade_state: "$.data[0].grade_state" } }
          assert:
            - "hop 1: SimilarityReport.report_state == STALE after exclusion settings change (exclusion_snapshot is now outdated)"
            - "hop 2: GradeEntry.grade_state == PROVISIONAL (was RELEASED)"
            - "Assignment.version incremented by exactly 1 by the PATCH itself"

  # ===========================================================================
  # Rule 5: priority_pair_validation_conflict — two dual-failure scenarios with
  # DIFFERENT error-category pairs: (state vs business_safety) and
  # (business_constraint vs business_referential).
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: intake_closed_and_consent_missing_state_wins
        grounds:
          - validations[priority=6]
          - validations[priority=9]
        distinguishing_aspect: |
          Category pair = state (priority 6, ERR_ASSIGNMENT_CLOSED) vs
          business_safety (priority 9, ERR_CONSENT_MISSING). One request
          violates both: assignment past due (lazy auto-close fires) AND student
          never consented on a STRICT integration. The lower priority number
          wins: ERR_ASSIGNMENT_CLOSED, not ERR_CONSENT_MISSING.
        test_recipe:
          setup:
            - "US institution with STRICT integration, instructor, assignment due 2027-01-01, student with consent_status == NOT_GIVEN; logical clock advanced to 2027-02-01 (past due_at)"
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "Prio U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "CANVAS", external_key: "k9" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "i9@x.edu", full_name: "Prof Nine" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/students", payload: { external_lms_id: "s9", email: "s9@x.edu", full_name: "Stu Nine", home_region: "US" }, as: PlatformAdmin, captures: { stu_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "Late Essay", due_at: "2027-01-01T00:00:00Z" }, as: Instructor, as_user_id: "${instr_id}", captures: { asg_id: $.data.id } }
            - { call: "POST /integrity/_clock/set_current_utc", payload: { to_iso8601: "2027-02-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "too late" }, as: Student, as_user_id: "${stu_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ASSIGNMENT_CLOSED with http 409 — state (priority 6) beats business_safety (priority 9)"
            - "the lazy auto-close fired: subsequent GET /integrity/assignments/${asg_id} shows accepting_state == CLOSED"
      - name: content_invalid_and_bad_supersede_constraint_wins
        grounds:
          - validations[priority=13]
          - validations[priority=17]
        distinguishing_aspect: |
          Category pair = business_constraint (priority 13, ERR_CONTENT_INVALID)
          vs business_referential (priority 17, ERR_INVALID_SUPERSEDE_TARGET) —
          a different pair than state-vs-safety. One resubmission request has
          both an empty body AND a supersede target belonging to another
          student; the constraint error wins.
        test_recipe:
          setup:
            - "US institution, ACTIVE integration, instructor, assignment, GRANTED students A and B; A has a REPORT_READY submission (the invalid supersede target for B)"
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "Prio2 U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "CANVAS", external_key: "k10" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "i10@x.edu", full_name: "Prof Ten" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/students", payload: { external_lms_id: "sa", email: "sa@x.edu", full_name: "Stu A", home_region: "US" }, as: PlatformAdmin, captures: { stu_a: $.data.id, stu_a_v: $.data.version } }
            - { call: "POST /integrity/students/${stu_a}/consents", payload: { expected_student_version: "${stu_a_v}", consent_action: "GRANT" }, as: Student, as_user_id: "${stu_a}" }
            - { call: "POST /integrity/institutions/${inst_id}/students", payload: { external_lms_id: "sb", email: "sb@x.edu", full_name: "Stu B", home_region: "US" }, as: PlatformAdmin, captures: { stu_b: $.data.id, stu_b_v: $.data.version } }
            - { call: "POST /integrity/students/${stu_b}/consents", payload: { expected_student_version: "${stu_b_v}", consent_action: "GRANT" }, as: Student, as_user_id: "${stu_b}" }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "Prio2 Essay", due_at: "2027-01-01T00:00:00Z" }, as: Instructor, as_user_id: "${instr_id}", captures: { asg_id: $.data.id } }
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_a}", content_text: "student a original" }, as: Student, as_user_id: "${stu_a}", captures: { sub_a: $.data.id } }
            - { call: "POST /integrity/submissions/${sub_a}/process", payload: {}, as: Instructor, as_user_id: "${instr_id}" }
          trigger:
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_b}", content_text: "", supersedes_submission_id: "${sub_a}" }, as: Student, as_user_id: "${stu_b}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CONTENT_INVALID with http 422 — business_constraint (priority 13) beats business_referential (priority 17)"
            - "no submission created for student B; GET /integrity/submissions?student_id=${stu_b} returns empty array"

  # ===========================================================================
  # Rule 6: boundary_precision_check — two boundaries on DIFFERENT metrics via
  # DIFFERENT endpoints: small-match word threshold (score metric, via process)
  # vs retention window half-open edge (purge-count metric, via run-purge).
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: small_match_threshold_boundary_kept_vs_dropped
        grounds:
          - calculations.similarity_score
          - entities.Assignment.fields.small_match_threshold_words
          - validations[priority=14]
        distinguishing_aspect: |
          Metric = filtered similarity score; endpoint = POST
          /integrity/submissions/{id}/process. Boundary is strict-below: a
          fragment with matched_word_count == threshold (8) is KEPT, one with 7
          is DROPPED. Pinned: kept-only score 800 bps, both-kept 1500 bps,
          both-dropped would be 0 bps on a 100-word body.
        test_recipe:
          setup:
            - "US institution, ACTIVE integration, instructor, GRANTED student, assignment with exclude_small_matches=true, small_match_threshold_words=8; one 100-word submission with BOILERPLATE fragments of exactly 8 words (@0) and exactly 7 words (@50)"
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "Bound U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "CANVAS", external_key: "k11" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "i11@x.edu", full_name: "Prof Eleven" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/students", payload: { external_lms_id: "s11", email: "s11@x.edu", full_name: "Stu Eleven", home_region: "US" }, as: PlatformAdmin, captures: { stu_id: $.data.id, stu_v: $.data.version } }
            - { call: "POST /integrity/students/${stu_id}/consents", payload: { expected_student_version: "${stu_v}", consent_action: "GRANT" }, as: Student, as_user_id: "${stu_id}" }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "Bound Essay", due_at: "2027-01-01T00:00:00Z", exclude_small_matches: true, small_match_threshold_words: 8 }, as: Instructor, as_user_id: "${instr_id}", captures: { asg_id: $.data.id } }
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "<BODY_100_WORDS: exactly 100 whitespace-separated tokens>" }, as: Student, as_user_id: "${stu_id}", captures: { sub_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/source-documents", payload: { source_type: "INTERNET", uri: "https://src/b1", region: "US" }, as: PlatformAdmin, captures: { src1: $.data.id } }
            - { call: "POST /integrity/_matches/inject", payload: { submission_id: "${sub_id}", source_document_id: "${src1}", matched_word_count: 8, match_category: "BOILERPLATE", offset_start: 0 }, as: PlatformAdmin }
            - { call: "POST /integrity/_matches/inject", payload: { submission_id: "${sub_id}", source_document_id: "${src1}", matched_word_count: 7, match_category: "BOILERPLATE", offset_start: 50 }, as: PlatformAdmin }
          trigger:
            - { call: "POST /integrity/submissions/${sub_id}/process", payload: {}, as: Instructor, as_user_id: "${instr_id}" }
            - { call: "GET /integrity/submissions/${sub_id}/similarity-reports", payload: {}, as: Instructor, as_user_id: "${instr_id}", captures: { raw_bps: "$.data[0].raw_score_bps", filt_bps: "$.data[0].filtered_score_bps" } }
          assert:
            - "raw variant: weighted = round_half_up(8*0.5) + round_half_up(7*0.5) = 4 + 4 = 8 -> raw_score_bps == round_half_up(10000*8/100) == 800"
            - "filtered variant: 8-word fragment KEPT (8 is not < 8), 7-word fragment DROPPED -> sum = 4 -> filtered_score_bps == 400"
            - "a >-style (rather than <-style) boundary would have produced 0 bps — the strict-below semantics is the pinned behavior"
      - name: retention_window_end_exclusive_boundary
        grounds:
          - calculations.purge_candidate_set
          - entities.DataRetentionPolicy.fields.retention_end
          - validations[priority=20]
        distinguishing_aspect: |
          Metric = purge candidate count; endpoint = POST
          /integrity/retention-policies/{id}/run-purge (different endpoint and
          different metric than the score boundary). Half-open window
          [2026-09-01, 2026-10-01): a submission at exactly 2026-10-01T00:00:00Z
          is NOT purged; one at 2026-09-30T23:59:59.999Z IS purged.
        test_recipe:
          setup:
            - "US institution, ACTIVE integration, instructor, GRANTED student, default assignment; submission OLD submitted at 2026-09-05 (inside window) and submission EDGE submitted at exactly 2026-10-01T00:00:00Z (window end, exclusive)"
          setup_api_calls:
            - { call: "POST /integrity/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /integrity/institutions", payload: { name: "Purge U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "CANVAS", external_key: "k12" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "i12@x.edu", full_name: "Prof Twelve" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/students", payload: { external_lms_id: "s12", email: "s12@x.edu", full_name: "Stu Twelve", home_region: "US" }, as: PlatformAdmin, captures: { stu_id: $.data.id, stu_v: $.data.version } }
            - { call: "POST /integrity/students/${stu_id}/consents", payload: { expected_student_version: "${stu_v}", consent_action: "GRANT" }, as: Student, as_user_id: "${stu_id}" }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "Purge Essay", due_at: "2027-06-01T00:00:00Z", max_submissions_per_student: 5 }, as: Instructor, as_user_id: "${instr_id}", captures: { asg_id: $.data.id } }
            - { call: "POST /integrity/_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "old inside window" }, as: Student, as_user_id: "${stu_id}", captures: { sub_old: $.data.id } }
            - { call: "POST /integrity/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "edge at window end" }, as: Student, as_user_id: "${stu_id}", captures: { sub_edge: $.data.id } }
            - { call: "POST /integrity/_clock/set_current_utc", payload: { to_iso8601: "2026-11-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/retention-policies", payload: { region: "US", applies_to: "SUBMISSIONS", retention_start: "2026-09-01T00:00:00Z", retention_end: "2026-10-01T00:00:00Z" }, as: PlatformAdmin, captures: { pol_id: $.data.id } }
          trigger:
            - { call: "POST /integrity/retention-policies/${pol_id}/run-purge", payload: {}, as: PlatformAdmin, captures: { purged: $.data.purged_count } }
          assert:
            - "purged_count == 1: only the 2026-09-05 submission is inside [2026-09-01, 2026-10-01)"
            - "submission ${sub_edge} (submitted_at == retention_end exactly) survives: GET /integrity/submissions/${sub_edge} returns 200 with pipeline_state == RECEIVED"
            - "GET /integrity/submissions/${sub_old} returns ERR_NOT_FOUND (purged)"

  # ===========================================================================
  # Rule 7: cross_entity_state_dependency — two dependencies across DIFFERENT
  # entity pairs: Assignment->LmsIntegration and GradeEntry->SimilarityReport.
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: assignment_creation_requires_integration_active
        grounds:
          - validations[priority=5]
          - state_machines.LmsIntegration
        distinguishing_aspect: |
          Pair = Assignment -> LmsIntegration: POST
          /integrity/lms-integrations/{id}/assignments is rejected while the
          integration is PENDING, succeeds after activation, and fails again
          after suspension — Assignment's creatability is gated by the
          integration's state, not by any Assignment field.
        test_recipe:
          setup:
            - "US institution, one instructor, one integration left in PENDING"
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "XDep U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "BLACKBOARD", external_key: "k13" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "i13@x.edu", full_name: "Prof Thirteen" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
          trigger:
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "Too Early", due_at: "2027-01-01T00:00:00Z" }, as: Instructor, as_user_id: "${instr_id}", captures: { err: $.data.error_id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "Now Fine", due_at: "2027-01-01T00:00:00Z" }, as: Instructor, as_user_id: "${instr_id}", captures: { asg_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/suspend", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "Too Late", due_at: "2027-01-01T00:00:00Z" }, as: Instructor, as_user_id: "${instr_id}", captures: { err2: $.data.error_id } }
          assert:
            - "PENDING integration: error_id == ERR_INTEGRATION_NOT_ACTIVE (409)"
            - "after activate: creation succeeds (201) and assignment id captured"
            - "after suspend: error_id == ERR_INTEGRATION_NOT_ACTIVE again"
            - "suspend side effect: the previously created assignment flips accepting_state OPEN -> CLOSED"
      - name: grade_entry_requires_similarity_report
        grounds:
          - validations[priority=18]
          - entities.GradeEntry.fields.pinned_report_version
        distinguishing_aspect: |
          Pair = GradeEntry -> SimilarityReport (different pair than
          Assignment->LmsIntegration): grade creation is rejected while the
          submission has no DRAFT/FINALIZED report, and the grade pins the
          report version it was created against.
        test_recipe:
          setup:
            - "US institution, ACTIVE integration, instructor, GRANTED student, assignment, one unprocessed submission (no report exists yet)"
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "Grade U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "CANVAS", external_key: "k14" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "i14@x.edu", full_name: "Prof Fourteen" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/students", payload: { external_lms_id: "s14", email: "s14@x.edu", full_name: "Stu Fourteen", home_region: "US" }, as: PlatformAdmin, captures: { stu_id: $.data.id, stu_v: $.data.version } }
            - { call: "POST /integrity/students/${stu_id}/consents", payload: { expected_student_version: "${stu_v}", consent_action: "GRANT" }, as: Student, as_user_id: "${stu_id}" }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "Grade Essay", due_at: "2027-01-01T00:00:00Z" }, as: Instructor, as_user_id: "${instr_id}", captures: { asg_id: $.data.id } }
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "unprocessed body" }, as: Student, as_user_id: "${stu_id}", captures: { sub_id: $.data.id } }
          trigger:
            - { call: "POST /integrity/submissions/${sub_id}/grade-entries", payload: { score_points: 50 }, as: Instructor, as_user_id: "${instr_id}", captures: { err: $.data.error_id } }
            - { call: "POST /integrity/submissions/${sub_id}/process", payload: {}, as: Instructor, as_user_id: "${instr_id}" }
            - { call: "GET /integrity/submissions/${sub_id}/similarity-reports", payload: {}, as: Instructor, as_user_id: "${instr_id}", captures: { rep_v: "$.data[0].version" } }
            - { call: "POST /integrity/submissions/${sub_id}/grade-entries", payload: { score_points: 50 }, as: Instructor, as_user_id: "${instr_id}", captures: { grade_id: $.data.id, pinned: $.data.pinned_report_version } }
          assert:
            - "before process: error_id == ERR_GRADE_REQUIRES_REPORT (409)"
            - "after process (report DRAFT): creation succeeds and pinned_report_version == the report's current version (1)"
            - "grade_state == PROVISIONAL until the report is finalized"

  # ===========================================================================
  # Rule 8: resource_temporal_overlap — two overlap rules with DIFFERENT
  # interval semantics on DIFFERENT resources: half-open policy windows on
  # DataRetentionPolicy vs closed grace interval on RepositoryDeposit.
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: retention_policy_window_overlap_adjacency_allowed
        grounds:
          - validations[priority=20]
          - entities.DataRetentionPolicy
        distinguishing_aspect: |
          Resource = DataRetentionPolicy; semantics = half-open [start, end):
          overlapping windows are rejected, but ADJACENT windows (end ==
          other.start) are allowed. Pinned: [2026-01-01, 2026-06-01) then
          [2026-03-01, 2026-09-01) conflicts; [2026-06-01, 2026-12-01) does not.
        test_recipe:
          setup:
            - "US institution with one ACTIVE SUBMISSIONS policy [2026-01-01, 2026-06-01)"
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "Overlap U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/retention-policies", payload: { region: "US", applies_to: "SUBMISSIONS", retention_start: "2026-01-01T00:00:00Z", retention_end: "2026-06-01T00:00:00Z" }, as: PlatformAdmin, captures: { pol1: $.data.id } }
          trigger:
            - { call: "POST /integrity/institutions/${inst_id}/retention-policies", payload: { region: "US", applies_to: "SUBMISSIONS", retention_start: "2026-03-01T00:00:00Z", retention_end: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /integrity/institutions/${inst_id}/retention-policies", payload: { region: "US", applies_to: "SUBMISSIONS", retention_start: "2026-06-01T00:00:00Z", retention_end: "2026-12-01T00:00:00Z" }, as: PlatformAdmin, captures: { pol2: $.data.id } }
          assert:
            - "overlapping window: error_id == ERR_RETENTION_WINDOW_OVERLAP (409)"
            - "adjacent window (start == existing end): succeeds with 201 — half-open semantics treats end == start as non-overlapping"
            - "GET /integrity/institutions/${inst_id}/retention-policies returns exactly 2 ACTIVE policies"
      - name: purge_grace_closed_interval_conflict
        grounds:
          - calculations.purge_candidate_set
          - validations[priority=21]
          - entities.RepositoryDeposit.fields.stored_at
        distinguishing_aspect: |
          Resource = RepositoryDeposit; semantics = CLOSED grace interval
          [retention_start - 7d, retention_end] where BOTH endpoints count as
          conflict — deliberately different from the half-open policy window: a
          deposit stored at exactly retention_end (which is EXCLUDED from the
          purge window itself) still blocks the purge.
        test_recipe:
          setup:
            - "US GLOBAL_SHARED institution, ACTIVE integration, instructor, GRANTED student, STORE_AND_COMPARE assignment; submission made at 2026-09-05 and processed at 2026-10-01T00:00:00Z exactly (deposit stored_at == policy retention_end); policy window [2026-09-01, 2026-10-01)"
          setup_api_calls:
            - { call: "POST /integrity/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /integrity/institutions", payload: { name: "Grace U", residency_region: "US", repository_participation: "GLOBAL_SHARED" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "CANVAS", external_key: "k15" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "i15@x.edu", full_name: "Prof Fifteen" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/students", payload: { external_lms_id: "s15", email: "s15@x.edu", full_name: "Stu Fifteen", home_region: "US" }, as: PlatformAdmin, captures: { stu_id: $.data.id, stu_v: $.data.version } }
            - { call: "POST /integrity/students/${stu_id}/consents", payload: { expected_student_version: "${stu_v}", consent_action: "GRANT" }, as: Student, as_user_id: "${stu_id}" }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "Grace Essay", due_at: "2027-06-01T00:00:00Z", repository_option: "STORE_AND_COMPARE" }, as: Instructor, as_user_id: "${instr_id}", captures: { asg_id: $.data.id } }
            - { call: "POST /integrity/_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "grace body text" }, as: Student, as_user_id: "${stu_id}", captures: { sub_id: $.data.id } }
            - { call: "POST /integrity/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /integrity/submissions/${sub_id}/process", payload: {}, as: Instructor, as_user_id: "${instr_id}" }
            - { call: "POST /integrity/_clock/set_current_utc", payload: { to_iso8601: "2026-11-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/retention-policies", payload: { region: "US", applies_to: "SUBMISSIONS", retention_start: "2026-09-01T00:00:00Z", retention_end: "2026-10-01T00:00:00Z" }, as: PlatformAdmin, captures: { pol_id: $.data.id } }
          trigger:
            - { call: "POST /integrity/retention-policies/${pol_id}/run-purge", payload: {}, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PURGE_GRACE_CONFLICT (409): the deposit's stored_at == 2026-10-01 == retention_end lies inside the CLOSED grace interval even though the purge window itself is end-exclusive"
            - "nothing purged: GET /integrity/submissions/${sub_id} still returns 200 with pipeline_state == REPORT_READY"
            - "Institution.comparable_submission_count remains 1 (no withdrawal happened)"

  # ===========================================================================
  # Rule 9: compensating_invariant — two invariants over DIFFERENT conserved
  # quantities: Institution.comparable_submission_count (repository corpus) vs
  # Assignment.submission_count (intake ledger).
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: deposit_create_withdraw_conserve_comparable_count
        grounds:
          - calculations.comparable_submission_count
          - state_machines.RepositoryDeposit.STORED_to_WITHDRAWN
          - entities.Institution.fields.comparable_submission_count
        distinguishing_aspect: |
          Conserved quantity = Institution.comparable_submission_count. Forward
          action: process a STORE_AND_COMPARE submission under GLOBAL_SHARED
          (+1). Compensating action: withdraw the deposit (-1). Invariant pinned:
          after the pair, count == the pre-pair value with zero drift.
        test_recipe:
          setup:
            - "GLOBAL_SHARED US institution, ACTIVE integration, instructor, GRANTED student, STORE_AND_COMPARE assignment; institution.comparable_submission_count == 0 before the pair"
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "Inv U", residency_region: "US", repository_participation: "GLOBAL_SHARED" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "CANVAS", external_key: "k16" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "i16@x.edu", full_name: "Prof Sixteen" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/students", payload: { external_lms_id: "s16", email: "s16@x.edu", full_name: "Stu Sixteen", home_region: "US" }, as: PlatformAdmin, captures: { stu_id: $.data.id, stu_v: $.data.version } }
            - { call: "POST /integrity/students/${stu_id}/consents", payload: { expected_student_version: "${stu_v}", consent_action: "GRANT" }, as: Student, as_user_id: "${stu_id}" }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "Inv Essay", due_at: "2027-01-01T00:00:00Z", repository_option: "STORE_AND_COMPARE" }, as: Instructor, as_user_id: "${instr_id}", captures: { asg_id: $.data.id } }
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "invariant body" }, as: Student, as_user_id: "${stu_id}", captures: { sub_id: $.data.id } }
          trigger:
            - { call: "POST /integrity/submissions/${sub_id}/process", payload: {}, as: Instructor, as_user_id: "${instr_id}" }
            - { call: "GET /integrity/institutions/${inst_id}", payload: {}, as: PlatformAdmin, captures: { cnt_mid: $.data.comparable_submission_count } }
            - { call: "GET /integrity/submissions/${sub_id}/repository-deposits", payload: {}, as: InstitutionalAdmin, captures: { dep_id: "$.data[0].id" } }
            - { call: "POST /integrity/repository-deposits/${dep_id}/withdraw", payload: {}, as: InstitutionalAdmin }
            - { call: "GET /integrity/institutions/${inst_id}", payload: {}, as: PlatformAdmin, captures: { cnt_end: $.data.comparable_submission_count } }
          assert:
            - "after process (forward): comparable_submission_count == 1 (STORED + GLOBAL_SHARED)"
            - "after withdraw (compensating): comparable_submission_count == 0 — the conserved quantity returns exactly to its pre-pair value"
            - "RepositoryDeposit.${dep_id}.deposit_state == WITHDRAWN and its auto STUDENT_REPOSITORY SourceDocument is RETRACTED"
      - name: resubmit_supersede_conserves_submission_count
        grounds:
          - calculations.submission_count_rollup
          - state_machines.Submission.REPORT_READY_to_SUPERSEDED
          - entities.Assignment.fields.submission_count
        distinguishing_aspect: |
          Conserved quantity = Assignment.submission_count (a different quantity
          than the repository corpus count). Forward: resubmission creates a new
          non-SUPERSEDED submission (+1) while flipping its target to SUPERSEDED
          (-1). Invariant: submission_count unchanged across a resubmission,
          while revision_number advances 1 -> 2.
        test_recipe:
          setup:
            - "US institution, ACTIVE integration, instructor, GRANTED student, default assignment with one processed REPORT_READY submission (submission_count == 1)"
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "Inv2 U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "CANVAS", external_key: "k17" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "i17@x.edu", full_name: "Prof Seventeen" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/students", payload: { external_lms_id: "s17", email: "s17@x.edu", full_name: "Stu Seventeen", home_region: "US" }, as: PlatformAdmin, captures: { stu_id: $.data.id, stu_v: $.data.version } }
            - { call: "POST /integrity/students/${stu_id}/consents", payload: { expected_student_version: "${stu_v}", consent_action: "GRANT" }, as: Student, as_user_id: "${stu_id}" }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "Inv2 Essay", due_at: "2027-01-01T00:00:00Z" }, as: Instructor, as_user_id: "${instr_id}", captures: { asg_id: $.data.id } }
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "first revision" }, as: Student, as_user_id: "${stu_id}", captures: { sub1: $.data.id } }
            - { call: "POST /integrity/submissions/${sub1}/process", payload: {}, as: Instructor, as_user_id: "${instr_id}" }
          trigger:
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "second revision body", supersedes_submission_id: "${sub1}" }, as: Student, as_user_id: "${stu_id}", captures: { sub2: $.data.id, rev2: $.data.revision_number } }
            - { call: "GET /integrity/assignments/${asg_id}", payload: {}, as: Instructor, as_user_id: "${instr_id}", captures: { scount: $.data.submission_count } }
          assert:
            - "Assignment.submission_count == 1 — unchanged by the resubmission pair (new non-SUPERSEDED +1, old SUPERSEDED -1)"
            - "old submission ${sub1}.pipeline_state == SUPERSEDED; new submission ${sub2}.revision_number == 2 and supersedes_submission_id == ${sub1}"
            - "GET /integrity/submissions?supersedes_submission_id=${sub1} returns exactly [${sub2}] (self-referential FK reverse lookup)"
