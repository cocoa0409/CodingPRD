      - name: deliverable_cure_round_pushes_the_on_release_due_date_by_the_cure_window
        claim_type: conditional_cascade
        grounds:
          - state_machines.DeliverablePackage.transitions.SUBMITTED_to_REJECTED
          - state_machines.PreSaleContract.transitions.SUBMITTED_to_CURED
          - calculations.deliverable_completeness
        distinguishing_aspect: |
          The ON_RELEASE push-out is applied ONLY on the revision_round >= 2 PASS branch: a FAIL at
          round 1 stamps cure_deadline 2027-07-14T00:00:00Z (submitted_at 2027-06-14 + 30 days), the
          resubmission inside the window becomes revision_round 2, and its PASS sets delivery_status
          CURED and moves ON_RELEASE from 2027-07-15T00:00:00Z to 2027-08-14T00:00:00Z while
