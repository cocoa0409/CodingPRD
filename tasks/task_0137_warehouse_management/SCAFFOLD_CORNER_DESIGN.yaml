  # =========================================================================
  # Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: asn_line_status_satisfied_at_exact_equality
        claim_type: Constants Applied
        grounds:
          - "calculations.asn_line_status"
          - "entities.AsnLine.fields.line_status"
        distinguishing_aspect: "When received_qty equals expected_qty exactly (5==5), line_status becomes SATISFIED (the exact-equality band), not OVER; received_qty<expected stays OPEN."
        test_recipe:
          setup: ["An ASN line expected_qty 5, received exactly 5 via one receipt."]
          setup_api_calls:
            - call: "POST /warehouse/skus"
              payload: { sku_code: "SKU-AL1", description: "al", abc_class: "C", each_volume_cm3: 1, min_qty: 1, max_qty: 100 }
              as: PlatformAdmin
              captures: { sid: "$.data.id" }
            - call: "POST /warehouse/inbound-asns"
              payload: { asn_number: "ASN-AL1", supplier_name: "Acme", handling_mode: "PUTAWAY" }
              as: ReceivingClerk
              captures: { aid: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${aid}/lines"
              payload: { sku_id: "${sid}", expected_qty: 5 }
              as: ReceivingClerk
              captures: { lnid: "$.data.id" }
          trigger:
            - call: "POST /warehouse/inbound-asns/${aid}/receipts"
              payload: { asn_line_id: "${lnid}", received_qty: 5 }
              as: ReceivingClerk
          assert:
            - "AsnLine.${lnid}.received_qty == 5"
            - "AsnLine.${lnid}.line_status == SATISFIED"

      - name: asn_line_status_over_when_exceeds_expected
        claim_type: Correct Result
        grounds:
          - "calculations.asn_line_status"
          - "calculations.asn_line_received"
        distinguishing_aspect: "Two receipts (4 then 3) against an expected_qty-5 line give received_qty 7 and line_status OVER (received > expected)."
        test_recipe:
          setup: ["An ASN line expected_qty 5 with two receipts (4, then 3)."]
          setup_api_calls:
            - call: "POST /warehouse/skus"
              payload: { sku_code: "SKU-AL2", description: "al2", abc_class: "C", each_volume_cm3: 1, min_qty: 1, max_qty: 100 }
              as: PlatformAdmin
              captures: { sid: "$.data.id" }
            - call: "POST /warehouse/inbound-asns"
              payload: { asn_number: "ASN-AL2", supplier_name: "Acme", handling_mode: "PUTAWAY" }
              as: ReceivingClerk
              captures: { aid: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${aid}/lines"
              payload: { sku_id: "${sid}", expected_qty: 5 }
              as: ReceivingClerk
              captures: { lnid: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${aid}/receipts"
              payload: { asn_line_id: "${lnid}", received_qty: 4 }
              as: ReceivingClerk
          trigger:
            - call: "POST /warehouse/inbound-asns/${aid}/receipts"
              payload: { asn_line_id: "${lnid}", received_qty: 3 }
              as: ReceivingClerk
          assert:
            - "AsnLine.${lnid}.received_qty == 7"
            - "AsnLine.${lnid}.line_status == OVER"

