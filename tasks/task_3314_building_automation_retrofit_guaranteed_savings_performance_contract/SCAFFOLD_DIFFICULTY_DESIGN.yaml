        as: ESCOEngineer
        as_user_id: ${eng_id}
      assert:
      - Measure.${wf_mc_id}.status == EXCLUDED and subsidy_draw_cents == 0
      - sum of subsidy_draw_cents over INCLUDED measures == 0 (A:0 + B:0)
      - MeasureBundle.${wf_bd_id}.subsidy_pool_cents == 50000 (pool conserved — the compensating exclusion returned the draw without drift)
      - MeasureBundle.${wf_bd_id}.blended_payback_years == 3.33 after exclusion
  - name: financing_drawn_conserved_across_approve_release_reject
    grounds:
    - state_machines.FinancingDraw
    - entities.FinancingFacility.fields.drawn_cents
    distinguishing_aspect: 'Different conserved quantity (financing principal): drawn_cents only

      moves on RELEASE. Forward+compensating pair: approve then reject a

      DIFFERENT draw leaves drawn_cents unchanged; approve+release of 400000

      followed by facility cancel of remaining REQUESTED draws leaves

      drawn_cents == 400000 exactly — no drift from the rejected draws.

      '
    test_recipe:
      setup:
      - Contract in CONSTRUCTION; facility FUNDING, principal 1000000; draws D1 (400000) and D2 (300000) REQUESTED.
      setup_api_calls:
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      - *id009
      - *id010
      - *id011
      - *id012
      - *id013
      - *id014
      - *id015
      - *id016
      - *id017
      - *id018
      - *id019
      - call: POST /performance-contracts/${c1_id}/financing-facilities/${f1_id}/draws
        payload:
          amount_cents: 400000
          purpose: mobilization
        as: ESCOEngineer
        as_user_id: ${eng_id}
        captures:
          ci_d1_id: $.data.id
      - call: POST /performance-contracts/${c1_id}/financing-facilities/${f1_id}/draws
        payload:
          amount_cents: 300000
          purpose: equipment deposit
        as: ESCOEngineer
        as_user_id: ${eng_id}
        captures:
          ci_d2_id: $.data.id
      trigger:
      - call: POST /performance-contracts/${c1_id}/financing-facilities/${f1_id}/draws/${ci_d1_id}/approve
        payload: {}
        as: LenderOfficer
      - call: POST /performance-contracts/${c1_id}/financing-facilities/${f1_id}/draws/${ci_d1_id}/release
        payload: {}
        as: LenderOfficer
      - call: POST /performance-contracts/${c1_id}/financing-facilities/${f1_id}/draws/${ci_d2_id}/reject
        payload: {}
        as: LenderOfficer
      assert:
      - FinancingFacility.${f1_id}.drawn_cents == 400000 exactly (D1 released 400000; D2 rejected contributes 0)
      - FinancingDraw.${ci_d1_id}.status == RELEASED and FinancingDraw.${ci_d2_id}.status == REJECTED
      - available headroom = principal - drawn - approved_not_released = 1000000 - 400000 - 0 == 600000 (a new draw of 600000 approves; 600001 is rejected with ERR_DRAW_EXCEEDS_AVAILABLE)
