  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_authorize_stale_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[authorize-supersede-stale-ro]", "errors[ERR_STALE_VERSION]", entities.RepairOrder.fields.version]
        distinguishing_aspect: |
          Reading RO at version v0, then adding a part line (a mutation that bumps
          RO.version), then authorizing with the stale expected_repair_order_version
          == v0 -> ERR_STALE_VERSION (412). Two strictly sequential requests.
        test_recipe:
          setup: ["RO ESTIMATE created (version captured); markup tier covers 8000"]
          setup_api_calls:
            - call: "POST /markup-tiers"
              payload: { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: 20000, markup_pct: 0.40 }
              as: PartsManager
            - call: "POST /customers"
              payload: { full_name: "Oc Owner", phone: "555-123", email: "oc@x.com" }
              as: ShopManager
              captures: { cid: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cid}", vin: "VINOCC1", make: "Toyota", model: "RAV4", model_year: 2021, odometer_miles: 9000 }
              as: ShopManager
              captures: { vid: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cid}", vehicle_id: "${vid}" }
              as: ShopManager
              captures: { ro_id: $.data.id, ro_v0: $.data.version }
            - call: "POST /repair-orders/${ro_id}/part-lines"
              payload: { part_number: "OCC-P", description: "Strut", quantity: 1, unit_cost_cents: 8000, markup_mode: "FLAT_BRACKET" }
              as: PartsManager
          trigger:
            - call: "POST /repair-orders/${ro_id}/authorize"
              payload: { expected_repair_order_version: "${ro_v0}" }
              as: Customer
              as_user_id: "${cid}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION (ro_v0 captured at create is stale: the part-line add bumped RepairOrder.version)"
            - "HTTP status == 412"
            - "RepairOrder.${ro_id}.status == ESTIMATE (authorize rejected)"

      - name: occ_version_increments_on_authorize_success
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[authorize-supersede-stale-ro]", entities.RepairOrder.fields.version, entities.RepairOrder.fields.authorized_total_cents]
        distinguishing_aspect: "A correct expected_repair_order_version on authorize succeeds, sets authorized_total_cents, and increments RepairOrder.version by 1."
        test_recipe:
          setup: ["RO ESTIMATE with one labor line (flat book 1.0 rate 10000 -> grand 10000); version captured"]
          setup_api_calls:
            - call: "POST /labor-operations"
              payload: { op_code: "OCV", description: "Inspect", book_hours: 1.0, default_rate_cents: 10000 }
              as: ShopManager
              captures: { op_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ov Owner", phone: "555-124", email: "ov@x.com" }
              as: ShopManager
              captures: { cid: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cid}", vin: "VINOCC2", make: "Toyota", model: "Corolla", model_year: 2020, odometer_miles: 11000 }
              as: ShopManager
              captures: { vid: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cid}", vehicle_id: "${vid}", tax_rate: 0.0 }
              as: ShopManager
              captures: { ro_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/labor-lines"
              payload: { labor_operation_id: "${op_id}", billing_method: "FLAT_RATE" }
              as: ShopManager
            - call: "GET /repair-orders/${ro_id}"
              payload: {}
              as: ShopManager
              captures: { ro_v: $.data.version }
          trigger:
            - call: "GET /repair-orders/${ro_id}"
              payload: {}
              as: ShopManager
              captures: { ro_id_ver8: $.data.version }
            - call: "POST /repair-orders/${ro_id}/authorize"
              payload: { expected_repair_order_version: "${ro_id_ver8}" }
              as: Customer
              as_user_id: "${cid}"
              captures: { st: $.data.status, at: $.data.authorized_total_cents, nv: $.data.version }
          assert:
            - "RepairOrder.${ro_id}.status == APPROVED"
            - "RepairOrder.${ro_id}.authorized_total_cents == 10000"
            - "RepairOrder.${ro_id}.version == ${ro_v} + 1"

      - name: cascade_partline_to_corecharge_on_approve
        claim_type: cascading_side_effects
        grounds: [state_machines.RecommendedJob.PENDING_to_APPROVED, entities.RepairOrder.fields.core_deposit_total_cents]
        excluded_because:
          difficulty_instance: transitive_cascade / approve_job_cascades_partline_corecharge_ro_deposit_depth3
          rationale: "The approve -> PartLine -> CoreCharge -> RO deposit cascade is the depth-3 §1.8 cascade instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_totals_visible_in_part_line_response
        claim_type: immediate
        grounds: [calculations.repair_order_total, entities.RepairOrder.fields.grand_total_cents]
        distinguishing_aspect: "Immediately after adding a part line, GET /repair-orders/{id} reflects the recomputed grand_total_cents in the same request cycle (no lag)."
        test_recipe:
          setup: ["markup tier [0,20000)@0.40; RO ESTIMATE tax 0.0; one FLAT_BRACKET part qty1 cost 8000 (sell 11200)"]
          setup_api_calls:
            - call: "POST /markup-tiers"
              payload: { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: 20000, markup_pct: 0.40 }
              as: PartsManager
            - call: "POST /customers"
              payload: { full_name: "Im Owner", phone: "555-125", email: "im@x.com" }
              as: ShopManager
              captures: { cid: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cid}", vin: "VINIMM1", make: "Honda", model: "HRV", model_year: 2022, odometer_miles: 4000 }
              as: ShopManager
              captures: { vid: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cid}", vehicle_id: "${vid}", tax_rate: 0.0 }
              as: ShopManager
              captures: { ro_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/part-lines"
              payload: { part_number: "IM-1", description: "Pad", quantity: 1, unit_cost_cents: 8000, markup_mode: "FLAT_BRACKET" }
              as: PartsManager
          trigger:
            - call: "GET /repair-orders/${ro_id}"
              payload: {}
              as: ShopManager
              captures: { gt: $.data.grand_total_cents, pt: $.data.parts_total_cents }
          assert:
            - "RepairOrder.${ro_id}.parts_total_cents == 11200"
            - "RepairOrder.${ro_id}.grand_total_cents == 11200"
