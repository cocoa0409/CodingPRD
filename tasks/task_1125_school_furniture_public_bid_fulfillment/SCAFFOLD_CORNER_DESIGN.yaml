            - { call: "POST /v1/spec-lines", payload: { bid_spec_id: "${specA}", manufacturer: "Acme", model: "Desk-100", qty: 500, max_unit_price_cents: 13000 }, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/bid-specs/${specA}/publish", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/bid-specs/${specA}/close", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/awards", payload: { bid_spec_id: "${specA}", district_id: "${d1}", pricing_mode: "COOP_TIERED", coop_agreement_id: "${coop1}", install_rate_cents: 25125, order_by_date: "2026-06-01", warranty_years: 5 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { awardA: $.data.id } }
            - { call: "POST /v1/awards/${awardA}/accept", payload: {}, as: ContractManager, captures: { award_v: $.data.version } }
            - { call: "POST /v1/bid-specs/${specA}/issue-addendum", payload: { addendum_note: "clarification" }, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/bid-specs/${specA}/publish", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
          trigger:
            - { call: "POST /v1/awards/${awardA}/issue-amendment", payload: { expected_award_version: "${award_v}", amendment_note: "ratify addendum 1" }, as: DistrictBuyer, as_user_id: "${d1}", captures: { pin: $.data.awarded_spec_version, v_after: $.data.version } }
            - { call: "POST /v1/awards/${awardA}/issue-amendment", payload: { expected_award_version: "${award_v}", amendment_note: "stale replay" }, as: DistrictBuyer, as_user_id: "${d1}", captures: { err: $.data.error_id } }
          assert:
            - "First amendment succeeds: pin == 2 and v_after == ${award_v} + 1"
            - "err == ERR_STALE_VERSION (http 412; stale expected_award_version rejected deterministically)"

      - name: occ_stale_version_on_backorder_supersede_returns_412
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[backorder-notice-supersede-stale-poline]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "The supersede-create endpoint is OCC-guarded on POLine.version: replaying the version observed before declare-backorder (which bumped it) is rejected with 412; re-reading the line and carrying the fresh version supersedes the OPEN notice (SUPERSEDED) and installs a new OPEN notice."
