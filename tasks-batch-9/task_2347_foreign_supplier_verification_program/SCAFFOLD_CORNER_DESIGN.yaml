          - validations[priority=35]
          - state_machines.SupplierFoodPair.exemption_status.transitions[CLAIMED→VERIFIED]
        distinguishing_aspect: "The identical CLAIM + VERIFY sequence that returns ERR_MODIFIED_REQUIREMENTS_NOT_AVAILABLE for a default importer now succeeds, sets modified_requirements_only true and lowers the adequacy floor to 30.00 — the flag changes program semantics, not just a stored boolean."
        test_recipe:
          setup:
            - "Importer created WITH small_importer_flag true and record_retention_months 36; ACTIVE QI Ada; supplier, food and pair P1 with exemption_status NONE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
