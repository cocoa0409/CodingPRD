              captures: { err_id: $.data.error_id }
            - call: "POST /production-jobs/${pj_id}/typeset-slot"
              payload: { slot_start: "2026-08-20", slot_end: "2026-08-22", expected_production_job_version: "${pj_v_new}" }
              as: ProductionStaff
          assert:
            - "the first call returns HTTP 412 with data.error_id == ERR_STALE_PRODUCTION_JOB_VERSION"
            - "data.error_id != ERR_STALE_MANUSCRIPT_VERSION"
            - "after the first call ProductionJob.${pj_id}.slot_start == 2026-08-10 and slot_end == 2026-08-12"
            - "the second call returns HTTP 200"
            - "after the second call ProductionJob.${pj_id}.slot_start == 2026-08-20 and slot_end == 2026-08-22"
            - "ProductionJob.${pj_id}.content_stage == COPYEDITING"

      - name: cascading_side_effects_of_a_reject_decision
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ReviewInvitation.ACCEPTED_to_WITHDRAWN
          - calculations.reviewer_reliability_score
          - entities.Reviewer.fields.open_invitation_count
        excluded_because:
          difficulty_instance: cascading_side_effects / reject_decision_cascade_withdraws_invitation_and_probates_reviewer
          rationale: "That §1.8 instance already drives the full decision cascade - assignment release, invitation withdrawal, reviewer counters and the probation flip - in one request."

      - name: dual_variant_consensus_index_selection
        claim_type: dual_variant_calculation
        grounds:
          - calculations.decision_consensus_index
          - entities.Decision.fields.consensus_mode
        excluded_because:
          difficulty_instance: dual_variant_calculation / consensus_index_unweighted_vs_reliability_weighted_category_flip
          rationale: "The two consensus variants, their disagreement on one review set and the mode that decides which is authoritative are the whole subject of that §1.8 instance."

      - name: reviewer_selector_tie_break_then_exclusion_on_the_second_invitation
        claim_type: selector_policy
        grounds:
          - calculations.reviewer_invitation_selection
          - entities.ReviewInvitation.fields.selected_by
          - entities.Reviewer.fields.open_invitation_count
        distinguishing_aspect: |
          Two reviewers tie on every ranking key - both sit at the 50.00 seed with 0 open
          invitations - so the created_at ASC tie-break decides, and the very next selector call on
          the same manuscript must exclude the reviewer it just invited (she now holds an open
          invitation on it) instead of returning her again or failing with an empty pool.
        test_recipe:
          setup:
            - "One journal with a manuscript UNDER_REVIEW and reviewer_concurrent_window_limit at the default 3."
            - "Two ACTIVE ONCOLOGY reviewers with no history: Reviewer D at Univ Delta created first, then Reviewer E at Univ Epsilon, both at the 50.00 seed score."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /journals"
              payload: { name: "Journal of Selector Ties", subject_areas: ["ONCOLOGY"] }
              as: SystemAdmin
              captures: { j_id: $.data.id }
            - call: "POST /editors"
              payload: { journal_id: "${j_id}", email: "chief@soc.org", full_name: "Chief Editor", affiliation: "Univ Alpha", subject_areas: ["ONCOLOGY"], role_level: "CHIEF" }
              as: SystemAdmin
              captures: { ed_chief_id: $.data.id }
            - call: "POST /editors"
              payload: { journal_id: "${j_id}", email: "he1@soc.org", full_name: "Handling One", affiliation: "Univ Beta", subject_areas: ["ONCOLOGY"], role_level: "HANDLING", max_concurrent_assignments: 3 }
              as: SystemAdmin
              captures: { ed_h1_id: $.data.id }
            - call: "POST /authors"
              payload: { email: "author1@x.org", full_name: "Author One", affiliation: "Univ Gamma" }
              as: SystemAdmin
              captures: { au_id: $.data.id }
            - call: "POST /manuscripts"
              payload: { journal_id: "${j_id}", corresponding_author_id: "${au_id}", title: "Selector Tie Paper", subject_area: "ONCOLOGY", oa_license: "CC_BY", page_count: 16, figure_count: 2, data_availability_statement: "Data at repository DOI 10.9999/st" }
              as: Author
              as_user_id: "${au_id}"
              captures: { m_id: $.data.id }
            - call: "POST /manuscripts/${m_id}/integrity-screenings"
              payload: { scan_type: "PLAGIARISM", similarity_pct: 5.0 }
              as: SystemAdmin
            - call: "GET /manuscripts/${m_id}"
              as: SystemAdmin
              captures: { m_v: $.data.version }
            - call: "POST /editor-assignments"
              payload: { manuscript_id: "${m_id}", editor_id: "${ed_h1_id}", expected_manuscript_version: "${m_v}" }
              as: EditorInChief
              as_user_id: "${ed_chief_id}"
              captures: { ea_id: $.data.id }
            - call: "POST /editor-assignments/${ea_id}/conflict-declaration"
              payload: { declared_conflict: false }
              as: HandlingEditor
              as_user_id: "${ed_h1_id}"
            - call: "POST /manuscripts/${m_id}/screening-decision"
              payload: { action: "ADVANCE_TO_REVIEW" }
              as: HandlingEditor
              as_user_id: "${ed_h1_id}"
            - call: "POST /reviewers"
              payload: { email: "rev_d@inst.org", full_name: "Reviewer D", affiliation: "Univ Delta", subject_areas: ["ONCOLOGY"] }
              as: SystemAdmin
              captures: { rv_id: $.data.id }
            - call: "POST /reviewers"
              payload: { email: "rev_e@inst.org", full_name: "Reviewer E", affiliation: "Univ Epsilon", subject_areas: ["ONCOLOGY"] }
              as: SystemAdmin
              captures: { rv_e_id: $.data.id }
          trigger:
            - call: "POST /review-invitations"
              payload: { manuscript_id: "${m_id}" }
              as: HandlingEditor
              as_user_id: "${ed_h1_id}"
              captures: { inv_first_id: $.data.id }
            - call: "POST /review-invitations"
              payload: { manuscript_id: "${m_id}" }
              as: HandlingEditor
              as_user_id: "${ed_h1_id}"
              captures: { inv_second_id: $.data.id }
          assert:
            - "both calls return HTTP 201"
            - "ReviewInvitation.${inv_first_id}.reviewer_id == ${rv_id}"
            - "ReviewInvitation.${inv_first_id}.selected_by == SELECTOR"
            - "ReviewInvitation.${inv_second_id}.reviewer_id == ${rv_e_id}"
            - "ReviewInvitation.${inv_second_id}.selected_by == SELECTOR"
            - "ReviewInvitation.${inv_first_id}.round == 0 and ReviewInvitation.${inv_second_id}.round == 0"
            - "Reviewer.${rv_id}.invited_count == 1 and Reviewer.${rv_id}.open_invitation_count == 1"
            - "Reviewer.${rv_e_id}.invited_count == 1 and Reviewer.${rv_e_id}.open_invitation_count == 1"
            - "Reviewer.${rv_id}.reliability_score_rolling == 50.00"
            - "Manuscript.${m_id}.submitted_review_count == 0"
  - section: consistency_model
    instances:
      - name: review_submission_shows_decision_pending_in_the_same_response
        claim_type: immediate
        grounds:
          - consistency_model.immediate
          - state_machines.Manuscript.UNDER_REVIEW_to_DECISION_PENDING
          - endpoints[POST /review-invitations/{id}/reviews]
        distinguishing_aspect: |
          Every derived value is visible in the first read after the write, with no queue or refresh step:
          the review submission that reaches the journal's threshold leaves the manuscript already in
          DECISION_PENDING with submitted_review_count 1 and the reviewer's rolling score already
          recomputed to 100.00 on the very next GET.
        test_recipe:
          setup:
            - "One journal with min_completed_reviews_for_decision 1 and a manuscript UNDER_REVIEW."
            - "One reviewer who has accepted her invitation and has no other closed invitation, so her score is still the 50.00 seed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /journals"
              payload: { name: "Journal of Immediate Reads", subject_areas: ["ONCOLOGY"] }
              as: SystemAdmin
              captures: { j_id: $.data.id }
            - call: "POST /editors"
              payload: { journal_id: "${j_id}", email: "chief@soc.org", full_name: "Chief Editor", affiliation: "Univ Alpha", subject_areas: ["ONCOLOGY"], role_level: "CHIEF" }
              as: SystemAdmin
              captures: { ed_chief_id: $.data.id }
            - call: "POST /editors"
              payload: { journal_id: "${j_id}", email: "he1@soc.org", full_name: "Handling One", affiliation: "Univ Beta", subject_areas: ["ONCOLOGY"], role_level: "HANDLING", max_concurrent_assignments: 3 }
              as: SystemAdmin
              captures: { ed_h1_id: $.data.id }
            - call: "POST /authors"
              payload: { email: "author1@x.org", full_name: "Author One", affiliation: "Univ Gamma" }
              as: SystemAdmin
              captures: { au_id: $.data.id }
            - call: "POST /manuscripts"
              payload: { journal_id: "${j_id}", corresponding_author_id: "${au_id}", title: "Immediate Read Paper", subject_area: "ONCOLOGY", oa_license: "CC_BY", page_count: 16, figure_count: 2, data_availability_statement: "Data at repository DOI 10.9999/ir" }
              as: Author
              as_user_id: "${au_id}"
              captures: { m_id: $.data.id }
            - call: "POST /manuscripts/${m_id}/integrity-screenings"
              payload: { scan_type: "PLAGIARISM", similarity_pct: 5.0 }
              as: SystemAdmin
            - call: "GET /manuscripts/${m_id}"
              as: SystemAdmin
              captures: { m_v: $.data.version }
            - call: "POST /editor-assignments"
              payload: { manuscript_id: "${m_id}", editor_id: "${ed_h1_id}", expected_manuscript_version: "${m_v}" }
              as: EditorInChief
              as_user_id: "${ed_chief_id}"
              captures: { ea_id: $.data.id }
            - call: "POST /editor-assignments/${ea_id}/conflict-declaration"
              payload: { declared_conflict: false }
              as: HandlingEditor
              as_user_id: "${ed_h1_id}"
            - call: "POST /manuscripts/${m_id}/screening-decision"
              payload: { action: "ADVANCE_TO_REVIEW" }
              as: HandlingEditor
              as_user_id: "${ed_h1_id}"
            - call: "POST /reviewers"
              payload: { email: "rev_d@inst.org", full_name: "Reviewer D", affiliation: "Univ Delta", subject_areas: ["ONCOLOGY"] }
              as: SystemAdmin
              captures: { rv_id: $.data.id }
            - call: "POST /review-invitations"
              payload: { manuscript_id: "${m_id}", reviewer_id: "${rv_id}" }
              as: HandlingEditor
              as_user_id: "${ed_h1_id}"
              captures: { inv_id: $.data.id }
            - call: "POST /review-invitations/${inv_id}/response"
              payload: { response: "ACCEPT" }
              as: Reviewer
              as_user_id: "${rv_id}"
          trigger:
            - call: "POST /review-invitations/${inv_id}/reviews"
              payload: { recommendation: "ACCEPT", novelty_score: 4, rigor_score: 4, clarity_score: 4, comments: "Publish as is" }
              as: Reviewer
              as_user_id: "${rv_id}"
              captures: { rev_id: $.data.id }
            - call: "GET /manuscripts/${m_id}"
              as: HandlingEditor
              as_user_id: "${ed_h1_id}"
            - call: "GET /reviewers/${rv_id}"
              as: HandlingEditor
              as_user_id: "${ed_h1_id}"
          assert:
            - "HTTP 201 on the review and HTTP 200 on both reads"
            - "Review.${rev_id}.days_late == 0"
            - "Review.${rev_id}.reliability_weight == 0.5"
            - "the GET /manuscripts/${m_id} response shows status DECISION_PENDING and submitted_review_count 1"
            - "the GET /reviewers/${rv_id} response shows reliability_score_rolling 100.00 and reliability_score_lifetime 100.00"
            - "the GET /reviewers/${rv_id} response shows open_invitation_count 0 and submitted_count 1"
            - "ReviewInvitation.${inv_id}.state == SUBMITTED"
