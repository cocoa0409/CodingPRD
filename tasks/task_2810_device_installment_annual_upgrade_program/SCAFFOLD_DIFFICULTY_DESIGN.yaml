            - "the first call returns HTTP 403 with error_id ERR_SEGREGATION_OF_DUTIES, NOT ERR_DOWN_PAYMENT_INSUFFICIENT and NOT ERR_CREDIT_LIMIT_EXCEEDED"
            - "the second call returns HTTP 422 with error_id ERR_DOWN_PAYMENT_INSUFFICIENT, NOT ERR_CREDIT_LIMIT_EXCEEDED (101 outranks 102)"
