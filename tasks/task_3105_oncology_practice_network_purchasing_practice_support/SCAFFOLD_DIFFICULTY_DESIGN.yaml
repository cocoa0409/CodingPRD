              captures: { n_epoch: $.data.allocation_epoch_index }
          assert:
            - "the departure notice reports affiliation_status == DEPARTING and departure_effective_epoch_index == 1, since ceil(30 / 30) is 1"
            - "advance-epoch returns allocation_epoch_index == 1"
            - "GET /networks/practices/${p_id} then returns affiliation_status == DEPARTED"
            - "GET /networks/affiliation-contracts/${c_id} returns status == UNWIND_IN_PROGRESS, a hop only the DEPARTED transition produces — advance-epoch never names the contract"
            - "the practice's PENDING rebate qualification was already driven to RECLAIMED at the notice with holdback_cents equal to its rebate amount"


