  # ---- Royalty statements ----
  - method: POST
    path: "/royalty-statements"
    description: "generate a PROVISIONAL royalty statement for a title over a period"
    roles: [PlatformAdmin]
    code: 201
    input: [title_id, period_start, period_end]
    output: RoyaltyStatement
    side_effects: ["RoyaltyStatement created in PROVISIONAL", "computes narrator_share_pct_applied, gross_sales_cents, statement_net_cents, narrator_royalty_cents, author_royalty_cents (PROVISIONAL variant)"]
  - method: GET
    path: "/royalty-statements/{id}"
    description: "read a royalty statement"
    roles: [PlatformAdmin, Author, Narrator]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects: []
  - method: GET
    path: "/royalty-statements"
    description: "list royalty statements filtered by title_id and/or status"
    roles: [PlatformAdmin, Author, Narrator]
    code: 200
    input: ["title_id?", "status?", "limit?", "offset?"]
    output: RoyaltyStatement[]
    side_effects: []
  - method: POST
    path: "/royalty-statements/{id}/finalize"
    description: "finalize a PROVISIONAL statement (recompute FINAL variant excluding returns)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects: ["RoyaltyStatement PROVISIONAL -> FINALIZED", "recomputes *_cents with FINAL variant, sets variant = FINAL", "increments RoyaltyStatement.version by 1"]
  - method: POST
    path: "/royalty-statements/{id}/pay"
    description: "pay a FINALIZED statement, crediting author and narrator balances"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects: ["RoyaltyStatement FINALIZED -> PAID", "credits Author/Narrator payout_balance_cents", "increments RoyaltyStatement.version by 1"]
  - method: POST
    path: "/royalty-statements/{id}/reverse"
    description: "reverse a PAID statement, debiting the previously credited balances (compensating)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects: ["RoyaltyStatement PAID -> REVERSED", "debits Author/Narrator payout_balance_cents by the same amounts", "increments RoyaltyStatement.version by 1"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "set the server logical clock (test harness). Server startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["sets the logical clock used for occurred_at defaulting and period windowing"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role or X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for the operation, or entity_backed user does not own the target resource"
  - id: ERR_VALIDATION
    http: 400
    condition: "malformed request body, missing required field, or bad type/enum value"
  - id: ERR_AUTHOR_NOT_FOUND
    http: 404
    condition: "referenced author_id does not exist"
  - id: ERR_NARRATOR_NOT_FOUND
    http: 404
    condition: "referenced narrator_id does not exist"
  - id: ERR_TITLE_NOT_FOUND
    http: 404
    condition: "referenced title_id does not exist"
  - id: ERR_AUDITION_NOT_FOUND
    http: 404
    condition: "referenced audition id does not exist"
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "referenced contract_id does not exist"
  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "referenced booking id does not exist"
  - id: ERR_MILESTONE_NOT_FOUND
    http: 404
    condition: "referenced milestone id does not exist"
  - id: ERR_CHANNEL_NOT_FOUND
    http: 404
    condition: "referenced channel_id does not exist"
  - id: ERR_LISTING_NOT_FOUND
    http: 404
    condition: "referenced listing id does not exist"
  - id: ERR_STATEMENT_NOT_FOUND
    http: 404
    condition: "referenced statement id does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "generic fallback for a state transition attempted from a state with no matching §1.2 transition (e.g. open on a non-DRAFT title)"
  - id: ERR_RIGHTS_REVERTED
    http: 409
    condition: "operation attempted on a title whose rights_status == REVERTED"
  - id: ERR_TITLE_NOT_OPEN
    http: 409
    condition: "audition/decision requires the title in OPEN_FOR_AUDITION"
  - id: ERR_TITLE_NOT_IN_QC
    http: 409
    condition: "publish requires the title in IN_QC"
  - id: ERR_TITLE_NOT_PUBLISHED
    http: 409
    condition: "creating a DistributionListing requires the title in PUBLISHED"
  - id: ERR_TITLE_NOT_REVERTABLE
    http: 409
    condition: "revert-rights requires the title in PUBLISHED"
  - id: ERR_AUDITION_NOT_SUBMITTED
    http: 409
    condition: "decision requires the audition in SUBMITTED"
  - id: ERR_AUDITION_NOT_ACCEPTED
    http: 409
    condition: "contract offer requires an ACCEPTED audition for (title, narrator)"
  - id: ERR_CONTRACT_NOT_OFFERED
    http: 409
    condition: "respond requires the contract in OFFERED"
  - id: ERR_CONTRACT_NOT_ACCEPTED
    http: 409
    condition: "milestone submit requires the contract in ACCEPTED"
  - id: ERR_DEAL_TYPE_FIELDS
    http: 422
    condition: "deal_type field coherence violated (ROYALTY_SHARE needs royalty_share_pct; PER_HOUR needs per_hour_rate_cents; opposite field must be null)"
  - id: ERR_MILESTONE_NOT_SUBMITTED
    http: 409
    condition: "qc-review requires the milestone in SUBMITTED"
  - id: ERR_MILESTONE_NOT_REVISABLE
    http: 409
    condition: "resubmit requires the milestone in REVISION_REQUESTED"
  - id: ERR_INVALID_FINISHED_HOURS
    http: 422
    condition: "FULL milestone submitted with finished_hours missing or <= 0"
  - id: ERR_INVALID_DATE_RANGE
    http: 422
    condition: "booking start_date >= end_date, or listing effective_from > effective_until"
  - id: ERR_SAMPLE_TOO_LONG
    http: 422
    condition: "retail sample length (end_sec - start_sec) <= 0 or > MAX_RETAIL_SAMPLE_SEC (300)"
  - id: ERR_TERRITORY_NOT_SUPPORTED
    http: 409
    condition: "listing territory not in channel.supported_territories, or outside the title's granted territory"
  - id: ERR_BOOKING_OVERLAP
    http: 409
    condition: "new booking overlaps an existing ACTIVE booking for the same narrator (half-open intervals)"
  - id: ERR_LISTING_GAP_CONFLICT
    http: 409
    condition: "new listing violates the DISTRIBUTION_GAP_DAYS=1 buffer on the same (title, channel): new.effective_from is not strictly greater than (max existing effective_until) + 1 day"
  - id: ERR_LISTING_NOT_ACTIVE
    http: 409
    condition: "withdraw or sales-event on a listing not in ACTIVE"
  - id: ERR_STATEMENT_NOT_PROVISIONAL
    http: 409
    condition: "finalize requires the statement in PROVISIONAL"
  - id: ERR_STATEMENT_NOT_FINALIZED
    http: 409
    condition: "pay requires the statement in FINALIZED"
  - id: ERR_STATEMENT_NOT_PAID
    http: 409
    condition: "reverse requires the statement in PAID"
  - id: ERR_NOTHING_TO_PAY
    http: 402
    condition: "pay attempted when narrator_royalty_cents + author_royalty_cents == 0"
  - id: ERR_STALE_TITLE_VERSION
    http: 412
    condition: "expected_title_version does not equal current Title.version on POST /contracts"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Author
    description: "rights holder; owns Titles, casts narrators, controls rights"
    identity: "entity_backed:Author"
    exclusive_operations:
      - "POST /titles"
      - "POST /titles/{id}/open"
      - "POST /titles/{id}/retail-sample"
      - "POST /titles/{id}/revert-rights"
      - "POST /auditions/{id}/decision"
      - "POST /contracts"
    shared_operations:
      - "GET /titles, /titles/{id}, /authors/{id}, /auditions, /auditions/{id}, /contracts, /contracts/{id}, /distribution-channels/{id}, /distribution-listings, /distribution-listings/{id}, /sales-events, /qc-reviews, /qc-reviews/{id}, /production-milestones, /production-milestones/{id}, /royalty-statements, /royalty-statements/{id}, /narrators/{id}"

  - name: Narrator
    description: "voice producer; auditions, accepts contracts, books time, delivers milestones"
    identity: "entity_backed:Narrator"
    exclusive_operations:
      - "POST /auditions"
      - "POST /contracts/{id}/respond"
      - "POST /production-bookings"
      - "POST /production-bookings/{id}/cancel"
      - "POST /production-milestones"
      - "POST /production-milestones/{id}/resubmit"
    shared_operations:
      - "GET /narrators/{id}, /titles/{id}, /auditions, /auditions/{id}, /contracts, /contracts/{id}, /production-bookings, /production-bookings/{id}, /production-milestones, /production-milestones/{id}, /royalty-statements, /royalty-statements/{id}"

  - name: QCReviewer
    description: "quality-control reviewer of production milestones"
    identity: "opaque"
    exclusive_operations:
      - "POST /production-milestones/{id}/qc-reviews"
    shared_operations:
      - "GET /production-milestones, /production-milestones/{id}, /qc-reviews, /qc-reviews/{id}"

  - name: PlatformAdmin
    description: "operator; onboarding, distribution, sales ingestion, royalty payout, clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /authors"
      - "POST /narrators"
      - "POST /titles/{id}/publish"
      - "POST /distribution-channels"
      - "POST /distribution-listings"
      - "POST /distribution-listings/{id}/withdraw"
      - "POST /sales-events"
      - "POST /royalty-statements"
      - "POST /royalty-statements/{id}/finalize"
      - "POST /royalty-statements/{id}/pay"
      - "POST /royalty-statements/{id}/reverse"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET on all collections and resources"
