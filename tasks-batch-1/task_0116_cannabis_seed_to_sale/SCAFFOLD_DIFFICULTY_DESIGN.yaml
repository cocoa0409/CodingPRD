              payload: { package_id: "${pkg_id}", counted_by_user_id: "audit-1", counted_grams: 99.5, counted_at: "2026-06-08T00:00:00Z" }
              as: InventoryAuditor
              as_user_id: "audit-1"
              captures: { outcome: $.data.outcome }
          assert:
            - "ReconciliationCount.variance_grams == -0.5 and outcome == MATCH (|var| == 0.5 inclusive)"
            - "Package.${pkg_id}.status == ACTIVE (no hold at the boundary)"

  # =================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # =================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: manifest_depart_requires_package_active
        grounds:
          - state_machines.Manifest.DRAFT_to_IN_TRANSIT
          - state_machines.Package.ON_HOLD_to_ACTIVE
          - validations[priority=4]
        distinguishing_aspect: |
          Entity pair Manifest→Package: a DRAFT manifest cannot depart while one of its line packages is
          ON_HOLD (not ACTIVE). Manifest's valid transition depends on the Package's state — a different
          pair than PlantBatch→License below.
        test_recipe:
          setup:
            - "A DISTRIBUTION origin license + a destination CULTIVATION license; one package that has been placed ON_HOLD by a reconciliation discrepancy; a DRAFT manifest with a line referencing that package."
          setup_api_calls:
            - call: "POST /compliance/licenses"
              payload: { license_number: "DIST-2", license_type: "DISTRIBUTION", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { dist_id: $.data.id }
            - call: "POST /compliance/licenses"
              payload: { license_number: "CUL-13", license_type: "CULTIVATION", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { dest_id: $.data.id }
            - call: "POST /compliance/licenses"
              payload: { license_number: "LAB-13", license_type: "TESTING", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { lab_id: $.data.id }
            - call: "POST /compliance/plant-batches"
              payload: { license_id: "${dist_id}", lot_tag: "LOT-M", strain: "Glue", plant_count: 10, planted_at: "2026-01-01T00:00:00Z" }
              as: Cultivator
              captures: { batch_id: $.data.id }
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/harvests"
              payload: { plant_batch_id: "${batch_id}", harvest_name: "H-M", wet_weight_grams: 1000 }
              as: Cultivator
              captures: { harv_id: $.data.id }
            - call: "POST /compliance/harvests/${harv_id}/cure"
              payload: { dry_weight_grams: 500 }
              as: Cultivator
            - call: "POST /compliance/packages"
              payload: { harvest_id: "${harv_id}", package_tag: "PKG-M", product_category: "FLOWER", quantity_grams: 100 }
              as: Cultivator
              captures: { pkg_id: $.data.id }
            - call: "POST /compliance/lab-results"
              payload: { package_id: "${pkg_id}", testing_license_id: "${lab_id}", thc_pct: 18.0, pesticide_pass: true, tested_at: "2026-05-01T00:00:00Z" }
              as: QALabUser
              as_user_id: "qa-1"
            - call: "POST /compliance/packages/${pkg_id}/release"
              payload: {}
              as: ComplianceManager
              as_user_id: "cm-1"
            - call: "POST /compliance/manifests"
              payload: { origin_license_id: "${dist_id}", destination_license_id: "${dest_id}" }
              as: DistributionAgent
              captures: { man_id: $.data.id }
            - call: "POST /compliance/manifests/${man_id}/lines"
              payload: { package_id: "${pkg_id}", grams: 100 }
              as: DistributionAgent
            - call: "POST /compliance/reconciliation-counts"
              payload: { package_id: "${pkg_id}", counted_by_user_id: "audit-1", counted_grams: 50.0, counted_at: "2026-06-09T00:00:00Z" }
              as: InventoryAuditor
              as_user_id: "audit-1"
          trigger:
            - call: "GET /compliance/manifests/${man_id}"
              as: DistributionAgent
              captures: { man_v: $.data.version }
            - call: "POST /compliance/manifests/${man_id}/depart"
              payload: { expected_manifest_version: "${man_v}" }
              as: DistributionAgent
              captures: { err: $.data.error_id }
          assert:
            - "depart returns 409 ERR_INVALID_STATE because Package.${pkg_id}.status == ON_HOLD (not ACTIVE)"
            - "Manifest.${man_id}.status remains DRAFT"

      - name: plant_batch_advance_requires_license_active
        grounds:
          - state_machines.PlantBatch.IMMATURE_to_VEGETATIVE
          - state_machines.License.ACTIVE_to_SUSPENDED
          - validations[priority=5]
        distinguishing_aspect: |
          Entity pair PlantBatch→License (different from Manifest→Package): an IMMATURE batch cannot
          advance while its owning License is SUSPENDED. The batch's valid transition depends on the
          License state, yielding ERR_LICENSE_NOT_ACTIVE.
        test_recipe:
          setup:
            - "A CULTIVATION license that is SUSPENDED; an IMMATURE batch under it (still in a valid advance state)."
          setup_api_calls:
            - call: "POST /compliance/licenses"
              payload: { license_number: "CUL-14", license_type: "CULTIVATION", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { cul_id: $.data.id }
            - call: "POST /compliance/plant-batches"
              payload: { license_id: "${cul_id}", lot_tag: "LOT-N", strain: "Sherb", plant_count: 10, planted_at: "2026-01-01T00:00:00Z" }
              as: Cultivator
              captures: { batch_id: $.data.id }
            - call: "POST /compliance/licenses/${cul_id}/suspend"
              payload: {}
              as: StateRegulator
          trigger:
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
              captures: { err: $.data.error_id }
          assert:
            - "advance returns 403 ERR_LICENSE_NOT_ACTIVE (batch state IMMATURE is valid, so license check governs)"
            - "PlantBatch.${batch_id}.status remains IMMATURE"

  # =================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics, different resources)
  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: package_single_open_manifest_membership
        grounds:
          - validations[priority=12]
          - entities.ManifestLine.fields.package_id
          - state_machines.Manifest.DRAFT_to_IN_TRANSIT
        distinguishing_aspect: |
          Resource Package, set-membership interval semantics: a package may belong to at most one OPEN
          (DRAFT or IN_TRANSIT) manifest at a time; attaching it to a second open manifest is rejected as
          a transfer-window overlap. The "interval" is open-manifest membership, distinct from the
          same-day uniqueness window below.
        test_recipe:
          setup:
            - "One ACTIVE package; two DRAFT manifests from the same DISTRIBUTION origin; the package already attached as a line on the first manifest."
          setup_api_calls:
            - call: "POST /compliance/licenses"
              payload: { license_number: "DIST-3", license_type: "DISTRIBUTION", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { dist_id: $.data.id }
            - call: "POST /compliance/licenses"
              payload: { license_number: "CUL-15", license_type: "CULTIVATION", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { dest_id: $.data.id }
            - call: "POST /compliance/licenses"
              payload: { license_number: "LAB-15", license_type: "TESTING", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { lab_id: $.data.id }
            - call: "POST /compliance/plant-batches"
              payload: { license_id: "${dist_id}", lot_tag: "LOT-O", strain: "Tahoe", plant_count: 10, planted_at: "2026-01-01T00:00:00Z" }
              as: Cultivator
              captures: { batch_id: $.data.id }
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/harvests"
              payload: { plant_batch_id: "${batch_id}", harvest_name: "H-O", wet_weight_grams: 1000 }
              as: Cultivator
              captures: { harv_id: $.data.id }
            - call: "POST /compliance/harvests/${harv_id}/cure"
              payload: { dry_weight_grams: 500 }
              as: Cultivator
            - call: "POST /compliance/packages"
              payload: { harvest_id: "${harv_id}", package_tag: "PKG-O", product_category: "FLOWER", quantity_grams: 100 }
              as: Cultivator
              captures: { pkg_id: $.data.id }
            - call: "POST /compliance/lab-results"
              payload: { package_id: "${pkg_id}", testing_license_id: "${lab_id}", thc_pct: 18.0, pesticide_pass: true, tested_at: "2026-05-01T00:00:00Z" }
              as: QALabUser
              as_user_id: "qa-1"
            - call: "POST /compliance/packages/${pkg_id}/release"
              payload: {}
              as: ComplianceManager
              as_user_id: "cm-1"
            - call: "POST /compliance/manifests"
              payload: { origin_license_id: "${dist_id}", destination_license_id: "${dest_id}" }
              as: DistributionAgent
              captures: { man1_id: $.data.id }
            - call: "POST /compliance/manifests/${man1_id}/lines"
              payload: { package_id: "${pkg_id}", grams: 100 }
              as: DistributionAgent
            - call: "POST /compliance/manifests"
              payload: { origin_license_id: "${dist_id}", destination_license_id: "${dest_id}" }
              as: DistributionAgent
              captures: { man2_id: $.data.id }
          trigger:
            - call: "POST /compliance/manifests/${man2_id}/lines"
              payload: { package_id: "${pkg_id}", grams: 50 }
              as: DistributionAgent
              captures: { err: $.data.error_id }
          assert:
            - "second attach returns 409 ERR_MANIFEST_OVERLAP (package already on an open manifest line)"

      - name: customer_single_open_sale_same_day
        grounds:
          - validations[priority=13]
          - entities.Sale.fields.sale_date
          - state_machines.Sale.OPEN_to_FINALIZED
        distinguishing_aspect: |
          Resource Customer×sale_date, calendar-day uniqueness interval semantics (different from the
          membership semantics above): a customer may have at most one OPEN sale per retail license per
          sale_date; opening a second OPEN sale for the same customer and sale_date is rejected.
        test_recipe:
          setup:
            - "A RETAIL license; an adult customer with one OPEN sale dated 2026-06-10."
          setup_api_calls:
            - call: "POST /compliance/licenses"
              payload: { license_number: "RET-6", license_type: "RETAIL", state_code: "CA", expires_on: "2027-01-01T00:00:00Z", daily_purchase_limit_grams: 28.5 }
              as: StateRegulator
              captures: { ret_id: $.data.id }
            - call: "POST /compliance/customers"
              payload: { birthdate: "1990-01-01T00:00:00Z", is_medical: false }
              as: Budtender
              captures: { cust_id: $.data.id }
            - call: "POST /compliance/sales"
              payload: { retail_license_id: "${ret_id}", customer_id: "${cust_id}", sale_date: "2026-06-10T00:00:00Z" }
              as: Budtender
          trigger:
            - call: "POST /compliance/sales"
              payload: { retail_license_id: "${ret_id}", customer_id: "${cust_id}", sale_date: "2026-06-10T00:00:00Z" }
              as: Budtender
              captures: { err: $.data.error_id }
          assert:
            - "second sale open returns 409 ERR_SALE_WINDOW_OVERLAP (one OPEN sale per customer per retail license per sale_date)"

  # =================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: manifest_depart_recall_conserves_origin_custody
        grounds:
          - state_machines.Manifest.DRAFT_to_IN_TRANSIT
          - state_machines.Manifest.IN_TRANSIT_to_DRAFT
          - entities.Package.fields.license_id
          - entities.Package.fields.status
        distinguishing_aspect: |
          Conserved quantity: total grams of packages in ACTIVE status custodied by the ORIGIN license.
          depart (forward) moves the line package to IN_TRANSIT; recall (compensating) returns it to
          ACTIVE under the SAME origin license — origin-active grams after recall == origin-active grams
          before depart (100.0 g), and license_id is unchanged.
        test_recipe:
          setup:
            - "A DISTRIBUTION origin license with one ACTIVE 100.0 g package; a DRAFT manifest with one line for that package; origin-active-grams = 100.0 before depart."
          setup_api_calls:
            - call: "POST /compliance/licenses"
              payload: { license_number: "DIST-4", license_type: "DISTRIBUTION", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { dist_id: $.data.id }
            - call: "POST /compliance/licenses"
              payload: { license_number: "CUL-16", license_type: "CULTIVATION", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { dest_id: $.data.id }
            - call: "POST /compliance/licenses"
              payload: { license_number: "LAB-16", license_type: "TESTING", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { lab_id: $.data.id }
            - call: "POST /compliance/plant-batches"
              payload: { license_id: "${dist_id}", lot_tag: "LOT-P", strain: "Wedding", plant_count: 10, planted_at: "2026-01-01T00:00:00Z" }
              as: Cultivator
              captures: { batch_id: $.data.id }
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/harvests"
              payload: { plant_batch_id: "${batch_id}", harvest_name: "H-P", wet_weight_grams: 1000 }
              as: Cultivator
              captures: { harv_id: $.data.id }
            - call: "POST /compliance/harvests/${harv_id}/cure"
              payload: { dry_weight_grams: 500 }
              as: Cultivator
            - call: "POST /compliance/packages"
              payload: { harvest_id: "${harv_id}", package_tag: "PKG-P", product_category: "FLOWER", quantity_grams: 100 }
              as: Cultivator
              captures: { pkg_id: $.data.id }
            - call: "POST /compliance/lab-results"
              payload: { package_id: "${pkg_id}", testing_license_id: "${lab_id}", thc_pct: 18.0, pesticide_pass: true, tested_at: "2026-05-01T00:00:00Z" }
              as: QALabUser
              as_user_id: "qa-1"
            - call: "POST /compliance/packages/${pkg_id}/release"
              payload: {}
              as: ComplianceManager
              as_user_id: "cm-1"
            - call: "POST /compliance/manifests"
              payload: { origin_license_id: "${dist_id}", destination_license_id: "${dest_id}" }
              as: DistributionAgent
              captures: { man_id: $.data.id }
            - call: "POST /compliance/manifests/${man_id}/lines"
              payload: { package_id: "${pkg_id}", grams: 100 }
              as: DistributionAgent
          trigger:
            - call: "GET /compliance/manifests/${man_id}"
              as: DistributionAgent
              captures: { man_v: $.data.version }
            - call: "POST /compliance/manifests/${man_id}/depart"
              payload: { expected_manifest_version: "${man_v}" }
              as: DistributionAgent
            - call: "POST /compliance/manifests/${man_id}/recall"
              payload: {}
              as: DistributionAgent
            - call: "GET /compliance/packages/${pkg_id}"
              as: DistributionAgent
              captures: { final_license: $.data.license_id, final_status: $.data.status, final_remaining: $.data.remaining_grams }
          assert:
            - "after recall Package.${pkg_id}.license_id == ${dist_id} (origin custody conserved)"
            - "after recall Package.${pkg_id}.status == ACTIVE and remaining_grams == 100.0 (origin-active grams unchanged at 100.0)"

      - name: sale_void_conserves_package_remaining
        grounds:
          - state_machines.Sale.OPEN_to_VOIDED
          - entities.Package.fields.remaining_grams
          - entities.SaleLine.fields.grams
        distinguishing_aspect: |
          Conserved quantity: Package.remaining_grams (a DIFFERENT conserved quantity than origin custody
          grams). Adding a SaleLine to an OPEN sale does NOT decrement inventory; voiding the OPEN sale is
          the compensating action and leaves Package.remaining_grams unchanged at its pre-line value (100.0),
          with zero drift.
        test_recipe:
          setup:
            - "A RETAIL license; an ACTIVE FLOWER package with remaining_grams 100.0; an OPEN sale with one 30.0 g line (no decrement yet)."
          setup_api_calls:
            - call: "POST /compliance/licenses"
              payload: { license_number: "RET-7", license_type: "RETAIL", state_code: "CA", expires_on: "2027-01-01T00:00:00Z", daily_purchase_limit_grams: 28.5 }
              as: StateRegulator
              captures: { ret_id: $.data.id }
            - call: "POST /compliance/licenses"
              payload: { license_number: "CUL-17", license_type: "CULTIVATION", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { cul_id: $.data.id }
            - call: "POST /compliance/licenses"
              payload: { license_number: "LAB-17", license_type: "TESTING", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { lab_id: $.data.id }
            - call: "POST /compliance/plant-batches"
              payload: { license_id: "${cul_id}", lot_tag: "LOT-Q", strain: "Biscotti", plant_count: 10, planted_at: "2026-01-01T00:00:00Z" }
              as: Cultivator
              captures: { batch_id: $.data.id }
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/harvests"
              payload: { plant_batch_id: "${batch_id}", harvest_name: "H-Q", wet_weight_grams: 1000 }
              as: Cultivator
              captures: { harv_id: $.data.id }
            - call: "POST /compliance/harvests/${harv_id}/cure"
              payload: { dry_weight_grams: 500 }
              as: Cultivator
            - call: "POST /compliance/packages"
              payload: { harvest_id: "${harv_id}", package_tag: "PKG-Q", product_category: "FLOWER", quantity_grams: 100 }
              as: Cultivator
              captures: { pkg_id: $.data.id }
            - call: "POST /compliance/lab-results"
              payload: { package_id: "${pkg_id}", testing_license_id: "${lab_id}", thc_pct: 18.0, pesticide_pass: true, tested_at: "2026-05-01T00:00:00Z" }
              as: QALabUser
              as_user_id: "qa-1"
            - call: "POST /compliance/packages/${pkg_id}/release"
              payload: {}
              as: ComplianceManager
              as_user_id: "cm-1"
            - call: "POST /compliance/customers"
              payload: { birthdate: "1990-01-01T00:00:00Z", is_medical: false }
              as: Budtender
              captures: { cust_id: $.data.id }
            - call: "POST /compliance/sales"
              payload: { retail_license_id: "${ret_id}", customer_id: "${cust_id}", sale_date: "2026-06-11T00:00:00Z" }
              as: Budtender
              captures: { sale_id: $.data.id }
            - call: "POST /compliance/sales/${sale_id}/lines"
              payload: { package_id: "${pkg_id}", grams: 30.0 }
              as: Budtender
          trigger:
            - call: "POST /compliance/sales/${sale_id}/void"
              payload: {}
              as: Budtender
            - call: "GET /compliance/packages/${pkg_id}"
              as: Budtender
              captures: { final_remaining: $.data.remaining_grams, final_status: $.data.status }
          assert:
            - "Sale.${sale_id}.status == VOIDED"
            - "Package.${pkg_id}.remaining_grams == 100.0 (unchanged — OPEN lines never decremented; zero drift)"
            - "Package.${pkg_id}.status == ACTIVE"
