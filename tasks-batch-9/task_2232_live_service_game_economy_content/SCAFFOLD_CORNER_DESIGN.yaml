              payload: { player_id: "${pt_id}" }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
          assert:
            - "T1 quote response data.tier_discount_bp == 0 and data.quote_minor == 1000"
            - "T2 quote response data.tier_discount_bp == 500 and data.quote_minor == 950"
            - "T3 quote response data.tier_discount_bp == 1200 and data.quote_minor == 880"
            - "T4 quote response data.tier_discount_bp == 2000 and data.quote_minor == 800"

      - name: corner_calc_precision_goodwill_half_up_rounding
        claim_type: Precision
        grounds:
          - calculations.refund_settlement_minor
          - entities.RefundRequest.fields.goodwill_credit_minor
        distinguishing_aspect: |
          A refund base of 1700 produces a restock fee of exactly 85, whose 50 percent goodwill
          share lands on 42.5 and must round HALF UP to 43 — banker's rounding would return 42,
          so the rounding mode itself is falsified by this single value.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; season S7 LIVE."
            - "Offer MID_1700 (LIMITED_TIME, T1, NA list 1700, declared 2100, grants 1700 HARD_GEM) is APPROVED and LIVE."
            - "Player pm (NA, adult) holds a HARD_GEM account and a SOFT_COIN account so the goodwill credit has somewhere to land."
            - "The purchase is settled with nothing consumed and a refund is requested the same day."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /seasons"
              payload: { code: "S7", title: "Season 7 Tidebreak", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-10-30T00:00:00Z", planned_episode_count: 6, target_xp_total: 9000, pass_price_minor: 1000 }
              as: ContentProducer
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/status"
              payload: { to_status: "LIVE" }
              as: ContentProducer
            - call: "POST /players"
              payload: { handle: "tide_pm", region_code: "NA", active_season_id: "${season_id}" }
              as: LiveOpsCommander
              captures: { pm_id: $.data.id }
            - call: "POST /players/${pm_id}/currency-accounts"
              payload: { currency_code: "HARD_GEM" }
              as: LiveOpsCommander
              captures: { pm_gem_id: $.data.id }
            - call: "POST /players/${pm_id}/currency-accounts"
              payload: { currency_code: "SOFT_COIN" }
              as: LiveOpsCommander
              captures: { pm_soft_id: $.data.id }
            - call: "POST /offers"
              payload: { season_id: "${season_id}", offer_type: "LIMITED_TIME", sku: "MID_1700", price_tier: "T1", list_price_minor: 1700, line_items: [{ sku: "MID_HOARD", base_price_minor: 1700, declared_value_minor: 2100, granted_currency_code: "HARD_GEM", granted_amount_minor: 1700 }], window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-20T00:00:00Z" }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
              captures: { mid_id: $.data.id }
            - call: "POST /offers/${mid_id}/submit"
              payload: {}
              as: EconomyDesigner
              as_user_id: "u_designer_1"
            - call: "POST /offers/${mid_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "u_compliance_1"
            - call: "GET /seasons/${season_id}"
              payload: {}
              as: LiveOpsCommander
              captures: { season_v1: $.data.version }
            - call: "POST /offers/${mid_id}/publish"
              payload: { expected_season_version: "${season_v1}" }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
              captures: { mid_v1: $.data.version }
            - call: "POST /purchases"
              payload: { player_id: "${pm_id}", offer_id: "${mid_id}", expected_offer_version: "${mid_v1}" }
              as: Player
              as_user_id: "${pm_id}"
              captures: { purm_id: $.data.id }
            - call: "POST /purchases/${purm_id}/settlement"
              payload: { outcome: "SETTLED" }
              as: LiveOpsCommander
            - call: "POST /refund-requests"
              payload: { purchase_id: "${purm_id}", reason_code: "ACCIDENTAL" }
              as: Player
              as_user_id: "${pm_id}"
              captures: { rrm_id: $.data.id }
          trigger:
            - call: "POST /refund-requests/${rrm_id}/decision"
              payload: { decision: "APPROVE", decision_note: "Accidental purchase" }
              as: ComplianceOfficer
              as_user_id: "u_compliance_1"
          assert:
            - "Purchase.${purm_id}.price_paid_minor == 1700"
