        grounds:
          - validations.priority_11_ERR_CONSIGNMENT_NOT_CATALOGED
          - state_machines.Consignment.INTAKE_ACCEPTED_to_CATALOGED
          - state_machines.Lot.CATALOG_READY_to_ASSIGNED
