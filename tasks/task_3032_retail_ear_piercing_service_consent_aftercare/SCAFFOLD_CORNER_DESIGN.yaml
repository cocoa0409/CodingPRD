        claim_type: Conditional Validation
        grounds:
          - validations[priority=8]
          - entities.Jurisdiction.fields.requires_guardian_presence
        distinguishing_aspect: "In a jurisdiction with requires_guardian_presence true, a GUARDIAN_NOTARIZED consent is refused even when the guardian identity was verified, so the rule only bites under that configuration."
