  - rule_id: compensating_invariant
    instances:
      - name: kit_issue_then_return_conserves_program_committed_cents
        grounds:
          - state_machines.EquipmentIssuance.ISSUED_to_RETURNED
          - entities.Program.fields.equipment_committed_cents
          - calculations.equipment_issuance_selection
          - concurrency_rules[issuance-create-stale-program]
        distinguishing_aspect: |
          Conserved quantity #1 is MONETARY: Program.equipment_committed_cents ==
          SUM(EquipmentAsset.unit_value_cents over assets whose issuance status is ISSUED). Issuing the kit
          raises it by exactly 17700 and the compensating return lowers it by exactly 17700, leaving the
          formula-defined total back at 0 with the asset restored to IN_STOCK.
