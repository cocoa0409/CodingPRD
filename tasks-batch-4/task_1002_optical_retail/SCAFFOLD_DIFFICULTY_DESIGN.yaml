  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: required_index_tier_fires_at_exactly_six_diopters
        grounds:
          - calculations.lens_upcharge
          - validations[priority=50]
          - errors[ERR_LENS_INCOMPATIBLE_WITH_RX]
        distinguishing_aspect: |
          Numeric-threshold boundary on the rx_power metric at POST /optical/orders: rx_power is
          EXACTLY 6.00, which lands in the [6.00, 8.00) tier requiring index >= 1.67. Index 1.60
          is rejected at 6.00 (the tier uses >=, not >), while 1.67 succeeds with
          lens_upcharge_cents == 17950.
        test_recipe:
          setup:
            - "VERIFIED prescription od_sphere -5.50 / od_cylinder -1.00 / os_sphere -5.00 / os_cylinder 0.00 → rx_power == 5.50 + 0.5*1.00 == 6.00 exactly."
            - "Two MATERIAL options in the catalog: M160 (index 1.60) and M167 (index 1.67); coatings AR and BLUE."
          setup_api_calls:
            - call: "POST /optical/frames"
              payload: { sku: "FRM-009", name: "Percey", brand: "WP", price_cents: 19500, tryon_stock: 1, min_pd_mm: 54.0, max_pd_mm: 70.0 }
              as: PlatformAdmin
              captures: { frame_id: $.data.id }
            - call: "POST /optical/lens-options"
              payload: { code: "M160", category: "MATERIAL", base_price_cents: 6000, material_index: 1.60 }
              as: PlatformAdmin
              captures: { m160_id: $.data.id }
            - call: "POST /optical/lens-options"
              payload: { code: "M167", category: "MATERIAL", base_price_cents: 12000, material_index: 1.67 }
