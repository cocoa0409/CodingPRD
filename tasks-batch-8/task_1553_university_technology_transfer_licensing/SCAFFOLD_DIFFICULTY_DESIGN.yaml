  - rule_id: resource_temporal_overlap
    instances:
      - name: coi_window_half_open_overlap
        grounds:
          - errors[ERR_COI_WINDOW_OVERLAP]
          - entities.ConflictOfInterestPlan.fields.coverage_start
        distinguishing_aspect: |
          Resource = (startup, inventor) COI coverage; HALF-OPEN semantics:
          adjacency is allowed — a plan starting exactly at the approved
          plan's coverage_end succeeds, while one starting a day earlier
          collides.
        test_recipe:
          setup:
            - "NON_FEDERAL disclosure PATENT_PURSUED; startup SpinCo; APPROVED plan P1 for inv1 [2026-01-01, 2027-01-01)"
          setup_api_calls:
            - { call: "POST /tlo/departments", payload: { name: "EECS", college_name: "Engineering" }, as: SystemAdmin, captures: { dept_id: "$.data.id" } }
            - { call: "POST /tlo/inventors", payload: { full_name: "Ada Lovelace", email: "ada@uni.edu", department_id: "${dept_id}", appointment_type: "FACULTY" }, as: SystemAdmin, captures: { inv_id: "$.data.id" } }
            - { call: "POST /tlo/disclosures", payload: { title: "Tensor Compiler", description: "Novel compiler", funding_source: "NON_FEDERAL" }, as: Inventor, as_user_id: "${inv_id}", captures: { disc_id: "$.data.id" } }
            - { call: "POST /tlo/disclosures/${disc_id}/inventors", payload: { inventor_id: "${inv_id}", share_bp: 10000 }, as: TechTransferOfficer, captures: { entry_id: "$.data.id" } }
            - { call: "POST /tlo/disclosure-entries/${entry_id}/confirm", payload: {}, as: Inventor, as_user_id: "${inv_id}" }
            - { call: "GET /tlo/disclosures/${disc_id}", payload: {}, as: Any, captures: { disc_v: "$.data.version" } }
            - { call: "POST /tlo/disclosures/${disc_id}/inventorship/finalize", payload: { expected_disclosure_version: "${disc_v}" }, as: TechTransferOfficer }
            - { call: "POST /tlo/disclosures/${disc_id}/assessment", payload: { patentability_rating: "HIGH", market_rating: "HIGH" }, as: TechTransferOfficer }
            - { call: "POST /tlo/disclosures/${disc_id}/decision", payload: { decision: "PURSUE_PATENT" }, as: TechTransferOfficer }
            - { call: "POST /tlo/disclosures/${disc_id}/startups", payload: { name: "SpinCo", founded_date: "2026-02-01T00:00:00Z", equity_model: "FIXED" }, as: TechTransferOfficer, captures: { su_id: "$.data.id" } }
            - { call: "POST /tlo/startups/${su_id}/coi-plans", payload: { inventor_id: "${inv_id}", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2027-01-01T00:00:00Z", management_plan_text: "Plan A" }, as: ComplianceOfficer, captures: { coi_id: "$.data.id" } }
            - { call: "POST /tlo/coi-plans/${coi_id}/approve", payload: {}, as: ComplianceDirector }
          trigger:
            - { call: "POST /tlo/startups/${su_id}/coi-plans", payload: { inventor_id: "${inv_id}", coverage_start: "2027-01-01T00:00:00Z", coverage_end: "2028-01-01T00:00:00Z", management_plan_text: "Adjacent renewal" }, as: ComplianceOfficer, captures: { coi2: "$.data.id" } }
            - { call: "POST /tlo/startups/${su_id}/coi-plans", payload: { inventor_id: "${inv_id}", coverage_start: "2026-12-31T00:00:00Z", coverage_end: "2027-12-31T00:00:00Z", management_plan_text: "Overlapping" }, as: ComplianceOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "Adjacent plan [2027-01-01, 2028-01-01) succeeds (201): half-open end is exclusive"
            - "Plan starting 2026-12-31 fails with ERR_COI_WINDOW_OVERLAP (one day inside the approved window)"
      - name: exclusive_license_closed_interval_overlap
        grounds:
          - errors[ERR_EXCLUSIVE_OVERLAP]
          - state_machines.LicenseAgreement.IN_NEGOTIATION_to_EXECUTED
        distinguishing_aspect: |
          Resource = disclosure exclusivity rights; CLOSED-interval semantics
          (different from the COI half-open rule): two EXCLUSIVE licenses
          touching at a single calendar day still conflict — L2 effective
          2027-12-31 vs L1 expiration 2027-12-31 is an overlap.
        test_recipe:
          setup:
            - "NON_FEDERAL disclosure PATENT_PURSUED; L1 EXCLUSIVE [2026-01-01, 2027-12-31] upfront 600000 EXECUTED; L2 EXCLUSIVE [2027-12-31, 2029-01-01] upfront 600000 IN_NEGOTIATION; L3 EXCLUSIVE [2028-01-01, 2029-01-01] upfront 600000 IN_NEGOTIATION"
          setup_api_calls:
            - { call: "POST /tlo/departments", payload: { name: "EECS", college_name: "Engineering" }, as: SystemAdmin, captures: { dept_id: "$.data.id" } }
            - { call: "POST /tlo/inventors", payload: { full_name: "Ada Lovelace", email: "ada@uni.edu", department_id: "${dept_id}", appointment_type: "FACULTY" }, as: SystemAdmin, captures: { inv_id: "$.data.id" } }
            - { call: "POST /tlo/disclosures", payload: { title: "Tensor Compiler", description: "Novel compiler", funding_source: "NON_FEDERAL" }, as: Inventor, as_user_id: "${inv_id}", captures: { disc_id: "$.data.id" } }
            - { call: "POST /tlo/disclosures/${disc_id}/inventors", payload: { inventor_id: "${inv_id}", share_bp: 10000 }, as: TechTransferOfficer, captures: { entry_id: "$.data.id" } }
            - { call: "POST /tlo/disclosure-entries/${entry_id}/confirm", payload: {}, as: Inventor, as_user_id: "${inv_id}" }
            - { call: "GET /tlo/disclosures/${disc_id}", payload: {}, as: Any, captures: { disc_v: "$.data.version" } }
            - { call: "POST /tlo/disclosures/${disc_id}/inventorship/finalize", payload: { expected_disclosure_version: "${disc_v}" }, as: TechTransferOfficer }
            - { call: "POST /tlo/disclosures/${disc_id}/assessment", payload: { patentability_rating: "HIGH", market_rating: "HIGH" }, as: TechTransferOfficer }
            - { call: "POST /tlo/disclosures/${disc_id}/decision", payload: { decision: "PURSUE_PATENT" }, as: TechTransferOfficer }
            - { call: "POST /tlo/disclosures/${disc_id}/licenses", payload: { licensee_name: "Alpha", exclusivity: "EXCLUSIVE", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2027-12-31T00:00:00Z", royalty_rate_bp: 500, minimum_annual_royalty_cents: 0, upfront_fee_cents: 600000 }, as: LicensingManager, captures: { l1: "$.data.id", l1_v: "$.data.version" } }
            - { call: "POST /tlo/licenses/${l1}/execute", payload: { expected_license_version: "${l1_v}" }, as: LicensingManager }
            - { call: "POST /tlo/disclosures/${disc_id}/licenses", payload: { licensee_name: "Beta", exclusivity: "EXCLUSIVE", effective_date: "2027-12-31T00:00:00Z", expiration_date: "2029-01-01T00:00:00Z", royalty_rate_bp: 500, minimum_annual_royalty_cents: 0, upfront_fee_cents: 600000 }, as: LicensingManager, captures: { l2: "$.data.id", l2_v: "$.data.version" } }
            - { call: "POST /tlo/disclosures/${disc_id}/licenses", payload: { licensee_name: "Gamma", exclusivity: "EXCLUSIVE", effective_date: "2028-01-01T00:00:00Z", expiration_date: "2029-01-01T00:00:00Z", royalty_rate_bp: 500, minimum_annual_royalty_cents: 0, upfront_fee_cents: 600000 }, as: LicensingManager, captures: { l3: "$.data.id", l3_v: "$.data.version" } }
          trigger:
            - { call: "POST /tlo/licenses/${l2}/execute", payload: { expected_license_version: "${l2_v}" }, as: LicensingManager, captures: { err: "$.data.error_id" } }
            - { call: "POST /tlo/licenses/${l3}/execute", payload: { expected_license_version: "${l3_v}" }, as: LicensingManager, captures: { l3_status: "$.data.status" } }
          assert:
            - "L2 execute fails with ERR_EXCLUSIVE_OVERLAP (closed interval: 2027-12-31 belongs to both)"
            - "L3 execute succeeds (2028-01-01 is strictly after L1 expiration)"
            - "NON_EXCLUSIVE licenses on the same disclosure are never blocked by this rule"

  - rule_id: compensating_invariant
    instances:
      - name: distribution_approve_cancel_cost_invariant
        grounds:
          - state_machines.RoyaltyDistribution.CALCULATED_to_APPROVED
          - state_machines.RoyaltyDistribution.APPROVED_to_CANCELLED
          - calculations.unreimbursed_cost_rollup
        distinguishing_aspect: |
          Conserved quantity: unreimbursed patent-cost cents. The approve ->
          cancel pair MUST leave disclosure.unreimbursed_cost_cents and every
          PatentCost.reimbursed_amount_cents exactly at their pre-approve
          values — zero drift in the cost ledger.
        test_recipe:
          setup:
            - "NON_FEDERAL disclosure PATENT_PURSUED; PROVISIONAL app with costs C1 400000 (incurred 2026-03-01) and C2 150000 (incurred 2026-03-02); license ACTIVE rate 500bp min 0; report sales 20000000 accepted (1000000); distribution CALCULATED with cost_offset 550000"
          setup_api_calls:
            - { call: "POST /tlo/departments", payload: { name: "EECS", college_name: "Engineering" }, as: SystemAdmin, captures: { dept_id: "$.data.id" } }
            - { call: "POST /tlo/inventors", payload: { full_name: "Ada Lovelace", email: "ada@uni.edu", department_id: "${dept_id}", appointment_type: "FACULTY" }, as: SystemAdmin, captures: { inv_id: "$.data.id" } }
            - { call: "POST /tlo/disclosures", payload: { title: "Tensor Compiler", description: "Novel compiler", funding_source: "NON_FEDERAL" }, as: Inventor, as_user_id: "${inv_id}", captures: { disc_id: "$.data.id" } }
