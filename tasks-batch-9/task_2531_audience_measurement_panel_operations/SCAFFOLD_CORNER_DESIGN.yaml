            - "The household reports no tuning at all, so compliance_rate_rolling_30 stays 0.0000 (< the 0.90 bonus threshold), it holds no PORTABLE_OOH meter and its tuner is HEALTHY - bonus, supplement and penalty are all zero throughout, which isolates the tenure multiplier."
