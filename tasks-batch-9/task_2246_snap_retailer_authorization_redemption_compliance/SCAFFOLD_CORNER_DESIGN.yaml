          - errors.ERR_ENFORCEMENT_NOT_DUE
          - calculations.depot_unit_ledger
        distinguishing_aspect: "A cascade that is refused at its entry gate must not land any of its levels: the premature enforcement leaves the deployment ACTIVE, the terminal DEPLOYED, the depot counters untouched and the store still AUTHORIZED even though the case is already SANCTION_FINAL - and the same request at the effective date then moves every level at once."
        test_recipe:
          setup:
            - "A finalized permanent-disqualification trafficking case at 2026-08-21 (effective_date 2026-09-20) with an ACTIVE deployment on the store."
          setup_api_calls:
            - *k_owner
            - *k_store
            - *k_app
