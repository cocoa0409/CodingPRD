        claim_type: violation_to_error
        grounds: [errors.ERR_ASSIGNMENT_OVERLAP]
        excluded_because:
          difficulty_instance: same_line_half_open_overlap
          rationale: "ERR_ASSIGNMENT_OVERLAP is the negative leg of the half-open overlap difficulty instance."

      - name: st_travel_buffer_error
        claim_type: violation_to_error
        grounds: [errors.ERR_TRAVEL_BUFFER_VIOLATION]
        excluded_because:
          difficulty_instance: cross_establishment_travel_buffer
          rationale: "ERR_TRAVEL_BUFFER_VIOLATION is the negative leg of the travel-buffer difficulty instance."

