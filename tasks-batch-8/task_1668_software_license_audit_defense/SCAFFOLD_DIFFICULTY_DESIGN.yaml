  - rule_id: boundary_precision_check
    instances:
      - name: gap_ratio_grace_boundary_105
        grounds:
          - calculations.gap_and_severity
          - entities.LicensePosition.fields.gap_severity
        distinguishing_aspect: |
          Numeric threshold boundary on the gap-ratio metric: deployed/entitled
          exactly 1.05 stays MINOR (strictly-greater rule), while 1.06 flips to
          MATERIAL — reached via the deployment confirm endpoint, distinct from
          the release endpoint used by the empty-package boundary.
        test_recipe:
          setup:
            - "Product entitled 100; 105 units CONFIRMED (ratio exactly 1.05, gap 5 < 10 -> MINOR)"
          setup_api_calls:
            - call: "POST /sam/vendors"
              payload: { name: "Vendor A", vendor_code: "VND-A", default_license_metric: "PER_INSTALL", notice_response_deadline_days: 30 }
              as: SAMPlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /sam/products"
              payload: { vendor_id: "${v_id}", name: "Prod", license_metric: "PER_INSTALL", unit_list_price_cents: 10000, support_rate_pct: 0.22 }
              as: SAMPlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /sam/entitlements"
              payload: { product_id: "${p_id}", purchase_order_number: "PO-1", quantity: 100, coverage_class: "PRODUCTION", effective_from: "2026-01-01T00:00:00Z", source: "MANUAL_IMPORT" }
              as: SAMManager
            - call: "POST /sam/deployments"
              payload: { product_id: "${p_id}", measured_quantity: 105, environment: "PRODUCTION", measurement_method: "SCAN", measured_on: "2026-07-15T00:00:00Z" }
              as: ITAnalyst
              captures: { d1: $.data.id }
            - call: "POST /sam/deployments/${d1}/confirm"
              payload: {}
              as: SAMManager
            - call: "GET /sam/products/${p_id}/license-positions"
              as: SAMManager
              captures: { pos_id: "$.data[0].id", sev_at_105: "$.data[0].gap_severity" }
          trigger:
            - call: "POST /sam/deployments"
              payload: { product_id: "${p_id}", measured_quantity: 1, environment: "PRODUCTION", measurement_method: "MANUAL_DECLARATION", measured_on: "2026-07-16T00:00:00Z" }
              as: ITAnalyst
              captures: { d2: $.data.id }
            - call: "POST /sam/deployments/${d2}/confirm"
              payload: {}
              as: SAMManager
            - call: "POST /sam/license-positions/${pos_id}/recalculate"
              payload: {}
              as: SAMManager
              captures: { sev_at_106: $.data.gap_severity }
          assert:
            - "sev_at_105 == MINOR (ratio exactly 1.05 is NOT > 1.05; gap 5 < 10)"
            - "sev_at_106 == MATERIAL (ratio 1.06 > 1.05)"

      - name: release_with_zero_confirmed_coverage_boundary
        grounds:
          - "validations[priority=10]"
          - "errors[ERR_EMPTY_SUBMISSION_PACKAGE]"
          - state_machines.DataSubmission.APPROVED_to_RELEASED
        distinguishing_aspect: |
          Different metric (empty collection, not a numeric threshold) and different
          endpoint (submission release): the covered set holds one item whose status
          is EXCLUDED at release time, so the covered-CONFIRMED count is exactly 0
          and release is rejected.
