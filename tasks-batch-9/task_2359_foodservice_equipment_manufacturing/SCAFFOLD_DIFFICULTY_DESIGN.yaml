          - state_machines.PerformanceValidation.FAILED_to_IN_PROGRESS
          - entities.PerformanceValidation.fields.failure_reason
        distinguishing_aspect: |
          A tolerance-band edge on a float measurement rather than a whole-day integer: the
          hold_temp gate is abs(delta) <= HOLD_TEMP_TOLERANCE_C, so a run at 177.1C (delta 2.1)
          fails the same series that a run at exactly 177.0C (delta exactly 2.0) passes, with
          throughput held above target in BOTH attempts so failure_reason must be
