  # ===========================================================================
  # 4. From Table 4 (Validations)
  # ===========================================================================
  - section: validations
    instances:

      - name: fee_terms_mismatch_on_contract_create_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 29].ERR_FEE_TERMS_INVALID
          - errors.ERR_FEE_TERMS_INVALID
          - endpoints[POST /client-contracts]
        distinguishing_aspect: |
          The fee-terms rule is symmetric and fires in both directions: a
          COST_PLUS contract without not_to_exceed_cents is 422
          ERR_FEE_TERMS_INVALID, and so is a MANAGEMENT_FEE contract that carries
          not_to_exceed_cents (or omits management_fee_cents). It is a
          business_fiscal rule at priority 29, not a shape rule — the payload is
          well-formed, so ERR_INVALID_REQUEST must not be returned.
        test_recipe:
          setup:
            - "Empty database; clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: OperatorAdmin
          trigger:
            - call: "POST /client-contracts"
              payload: { client_name: "Northwind Manufacturing", site_code: "NWM-01", fee_structure: "COST_PLUS", staffing_model: "OPERATOR_EMPLOYED", budgeted_staff_fte: 3.5, participation_target_pct: 35, term_start_on: "2026-07-01", term_end_on: "2027-06-30" }
              as: OperatorAdmin
              captures: { err_cp: $.data.error_id }
            - call: "POST /client-contracts"
              payload: { client_name: "Axle Logistics", site_code: "AXL-01", fee_structure: "MANAGEMENT_FEE", staffing_model: "HYBRID", budgeted_staff_fte: 2.0, participation_target_pct: 30, term_start_on: "2026-07-01", term_end_on: "2027-06-30", management_fee_cents: 40000, not_to_exceed_cents: 5000000 }
              as: OperatorAdmin
              captures: { err_mf: $.data.error_id }
            - call: "POST /client-contracts"
              payload: { client_name: "Axle Logistics", site_code: "AXL-01", fee_structure: "MANAGEMENT_FEE", staffing_model: "HYBRID", budgeted_staff_fte: 2.0, participation_target_pct: 30, term_start_on: "2026-07-01", term_end_on: "2027-06-30", management_fee_cents: 40000 }
              as: OperatorAdmin
              captures: { c_mf_id: $.data.id }
          assert:
            - "COST_PLUS without not_to_exceed_cents -> HTTP 422 AND data.error_id == \"ERR_FEE_TERMS_INVALID\" (NOT 400 / ERR_INVALID_REQUEST)"
            - "MANAGEMENT_FEE carrying not_to_exceed_cents -> HTTP 422 AND data.error_id == \"ERR_FEE_TERMS_INVALID\""
            - "Third call (MANAGEMENT_FEE with management_fee_cents 40000 and no not_to_exceed_cents) -> HTTP 201 AND ClientContract.${c_mf_id}.status == \"DRAFT\" AND management_fee_cents == 40000 AND not_to_exceed_cents == null"
            - "GET /client-contracts -> total_count == 1 (neither rejected request created a row)"

      - name: dependent_member_with_eligible_sponsor_succeeds
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority 21].ERR_SPONSOR_NOT_ELIGIBLE
          - errors.ERR_SPONSOR_NOT_ELIGIBLE
          - entities.Member.fields.sponsor_member_id
        distinguishing_aspect: |
          The sponsor rule has three arms and only one passing shape: a DEPENDENT
          naming an ELIGIBLE EMPLOYEE sponsor is created (201), a DEPENDENT with
          no sponsor_member_id is 422, and an EMPLOYEE that supplies a
          sponsor_member_id is also 422. The passing arm proves the rule checks
          the sponsor's eligibility_status rather than merely its existence.
        test_recipe:
          setup:
            - "ACTIVE-CONTRACT chain; one EMPLOYEE member (Iris Okafor, E-1001) verified to ELIGIBLE so she can sponsor."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: OperatorAdmin
            - call: "POST /client-contracts"
              payload: { client_name: "Northwind Manufacturing", site_code: "NWM-01", fee_structure: "COST_PLUS", staffing_model: "OPERATOR_EMPLOYED", budgeted_staff_fte: 3.5, participation_target_pct: 35, term_start_on: "2026-07-01", term_end_on: "2027-06-30", not_to_exceed_cents: 5000000 }
