# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Outdoor Gear & Sports Rental — Expert
# Breadth probe across claim-extraction-guide sections.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_gear_unit_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.GearUnit, endpoints]
        distinguishing_aspect: "POST /rental/gear-units with valid type+rate card returns 201, availability=AVAILABLE, condition=GOOD, version=1."
        test_recipe:
          setup: ["A GearType and RateCard exist."]
          setup_api_calls:
            - call: "POST /rental/gear-types"
              payload: { category: "KAYAK", name: "Rec K", size_label: "M" }
              as: ShopAdmin
              captures: { gt_id: $.data.id }
            - call: "POST /rental/rate-cards"
              payload: { gear_type_id: "${gt_id}", hourly_cents: 1000, daily_cents: 3000, seasonal_flat_cents: 20000, deposit_cents: 5000, damage_waiver_cents_per_day: 400, late_fee_cents_per_hour: 800, loss_fee_cents: 20000 }
              as: ShopAdmin
              captures: { rc_id: $.data.id }
          trigger:
            - call: "POST /rental/gear-units"
              payload: { gear_type_id: "${gt_id}", rate_card_id: "${rc_id}", asset_tag: "K-NEW" }
              as: ShopAdmin
              captures: { gu_id: $.data.id, av: $.data.availability, ver: $.data.version }
          assert:
            - "HTTP 201; GearUnit.${gu_id}.availability == AVAILABLE"
            - "GearUnit.${gu_id}.condition == GOOD"
            - "GearUnit.${gu_id}.version == 1"

      - name: get_reservation_not_found_returns_404
        claim_type: Not Found
        grounds:
          - "entities.Reservation"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /rental/reservations/{random-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /rental/reservations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RentalAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; error_id == ERR_NOT_FOUND"

      - name: create_rate_card_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds:
          - "entities.RateCard"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "POST /rental/rate-cards omitting hourly_cents (required input) returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A GearType exists."]
          setup_api_calls:
            - call: "POST /rental/gear-types"
              payload: { category: "SUP", name: "X", size_label: "10ft" }
              as: ShopAdmin
              captures: { gt_id: $.data.id }
          trigger:
            - call: "POST /rental/rate-cards"
              payload: { gear_type_id: "${gt_id}", daily_cents: 3000, seasonal_flat_cents: 20000, deposit_cents: 5000, damage_waiver_cents_per_day: 400, late_fee_cents_per_hour: 800, loss_fee_cents: 20000 }
              as: ShopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400; error_id == ERR_VALIDATION"

      - name: create_gear_type_default_active_true_applied
        claim_type: Defaults
        grounds: [entities.GearType.fields.active]
        distinguishing_aspect: "Omitting active on gear-type create applies default true."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /rental/gear-types"
              payload: { category: "SKI", name: "Default Ski", size_label: "170cm" }
              as: ShopAdmin
              captures: { gt_id: $.data.id, act: $.data.active, rl: $.data.requires_lesson_for_beginner }
          assert:
            - "GearType.${gt_id}.active == true"
            - "GearType.${gt_id}.requires_lesson_for_beginner == false"

      - name: reservation_system_fields_ignore_client_input
        claim_type: System Fields
        grounds: [entities.Reservation.fields.lifecycle_status, entities.Reservation.fields.version]
        distinguishing_aspect: "Client cannot set lifecycle_status/version on create; server forces QUOTED and version=1 (extra fields ignored or rejected)."
        test_recipe:
          setup: ["AVAILABLE unit and customer exist."]
          setup_api_calls:
            - call: "POST /rental/_clock/set"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: ShopAdmin
            - call: "POST /rental/gear-types"
              payload: { category: "SUP", name: "Sys", size_label: "10ft" }
              as: ShopAdmin
              captures: { gt_id: $.data.id }
            - call: "POST /rental/rate-cards"
              payload: { gear_type_id: "${gt_id}", hourly_cents: 1000, daily_cents: 3000, seasonal_flat_cents: 20000, deposit_cents: 5000, damage_waiver_cents_per_day: 400, late_fee_cents_per_hour: 800, loss_fee_cents: 20000 }
              as: ShopAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /rental/gear-units"
              payload: { gear_type_id: "${gt_id}", rate_card_id: "${rc_id}", asset_tag: "SYS-1" }
              as: ShopAdmin
              captures: { gu_id: $.data.id, gu_v: $.data.version }
            - call: "POST /rental/customers"
              payload: { full_name: "Pat Ek", email: "pat@x.com", skill_level: "EXPERT" }
              as: RentalAgent
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust_id}", gear_unit_id: "${gu_id}", pickup_at: "2026-06-01T08:00:00Z", due_at: "2026-06-01T10:00:00Z", expected_gear_unit_version: "${gu_v}" }
              as: RentalAgent
              captures: { res_id: $.data.id, lc: $.data.lifecycle_status, ver: $.data.version }
          assert:
            - "Reservation.${res_id}.lifecycle_status == QUOTED"
            - "Reservation.${res_id}.version == 1"

      - name: create_gear_type_invalid_category_enum_rejected
        claim_type: Type Constraints
        grounds:
          - "entities.GearType.fields.category"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "Invalid category enum value rejected with ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /rental/gear-types"
              payload: { category: "JETSKI", name: "Bad", size_label: "M" }
              as: ShopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400; error_id == ERR_VALIDATION"

      - name: reservation_create_wrong_gear_unit_not_found
        claim_type: Parent Relationships
        grounds:
          - "entities.Reservation.fields.gear_unit_id"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "Creating a reservation referencing a non-existent gear_unit_id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["A customer and a real gear unit exist; the reservation references a DIFFERENT, non-existent gear_unit_id (existence check fires before OCC)."]
          setup_api_calls:
            - call: "POST /rental/gear-types"
              payload: { category: "KAYAK", name: "NF", size_label: "M" }
              as: ShopAdmin
              captures: { gt_id: $.data.id }
            - call: "POST /rental/rate-cards"
              payload: { gear_type_id: "${gt_id}", hourly_cents: 1000, daily_cents: 3000, seasonal_flat_cents: 20000, deposit_cents: 5000, damage_waiver_cents_per_day: 400, late_fee_cents_per_hour: 800, loss_fee_cents: 20000 }
              as: ShopAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /rental/gear-units"
              payload: { gear_type_id: "${gt_id}", rate_card_id: "${rc_id}", asset_tag: "NF-1" }
              as: ShopAdmin
              captures: { gu_id: $.data.id, gu_v: $.data.version }
            - call: "POST /rental/customers"
              payload: { full_name: "Qi Lar", email: "qi@x.com", skill_level: "EXPERT" }
              as: RentalAgent
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust_id}", gear_unit_id: "00000000-0000-4000-8000-000000000abc", pickup_at: "2026-06-02T08:00:00Z", due_at: "2026-06-02T10:00:00Z", expected_gear_unit_version: "${gu_v}" }
              as: RentalAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; error_id == ERR_NOT_FOUND"

      - name: customer_computed_standing_good_on_create
        claim_type: Computed Fields
        grounds: [entities.Customer.fields.standing, entities.Customer.fields.strike_points]
        distinguishing_aspect: "A freshly created customer has computed standing=GOOD, strike_points=0, open_loss_balance_cents=0 regardless of input."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /rental/customers"
              payload: { full_name: "Ron Im", email: "ron@x.com" }
              as: Renter
              captures: { cust_id: $.data.id, st: $.data.standing, sp: $.data.strike_points }
          assert:
            - "Customer.${cust_id}.standing == GOOD"
            - "Customer.${cust_id}.strike_points == 0"
            - "Customer.${cust_id}.open_loss_balance_cents == 0"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: confirm_from_already_confirmed_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Reservation.QUOTED_to_CONFIRMED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Confirming a reservation already in CONFIRMED returns ERR_INVALID_STATE (409); no side effects fire."
        test_recipe:
          setup: ["A CONFIRMED reservation."]
          setup_api_calls:
            - call: "POST /rental/_clock/set"
              payload: { to_iso8601: "2026-06-03T08:00:00Z" }
              as: ShopAdmin
            - call: "POST /rental/gear-types"
              payload: { category: "KAYAK", name: "IS", size_label: "M" }
              as: ShopAdmin
              captures: { gt_id: $.data.id }
            - call: "POST /rental/rate-cards"
              payload: { gear_type_id: "${gt_id}", hourly_cents: 1000, daily_cents: 3000, seasonal_flat_cents: 20000, deposit_cents: 5000, damage_waiver_cents_per_day: 400, late_fee_cents_per_hour: 800, loss_fee_cents: 20000 }
              as: ShopAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /rental/gear-units"
              payload: { gear_type_id: "${gt_id}", rate_card_id: "${rc_id}", asset_tag: "IS-1" }
              as: ShopAdmin
              captures: { gu_id: $.data.id, gu_v: $.data.version }
            - call: "POST /rental/customers"
              payload: { full_name: "Sue Oh", email: "sue@x.com", skill_level: "EXPERT" }
              as: RentalAgent
              captures: { cust_id: $.data.id }
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust_id}", gear_unit_id: "${gu_id}", pickup_at: "2026-06-03T08:00:00Z", due_at: "2026-06-03T10:00:00Z", expected_gear_unit_version: "${gu_v}" }
              as: RentalAgent
              captures: { res_id: $.data.id }
            - call: "POST /rental/reservations/${res_id}/confirm"
              payload: {}
              as: RentalAgent
          trigger:
            - call: "POST /rental/reservations/${res_id}/confirm"
              payload: {}
              as: RentalAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE"

      - name: cancel_from_picked_up_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Reservation.CONFIRMED_to_CANCELLED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Cancel is only valid from QUOTED/CONFIRMED; cancelling a PICKED_UP reservation returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A PICKED_UP reservation."]
          setup_api_calls:
            - call: "POST /rental/_clock/set"
              payload: { to_iso8601: "2026-06-04T08:00:00Z" }
              as: ShopAdmin
            - call: "POST /rental/gear-types"
              payload: { category: "KAYAK", name: "PU", size_label: "M" }
              as: ShopAdmin
              captures: { gt_id: $.data.id }
            - call: "POST /rental/rate-cards"
              payload: { gear_type_id: "${gt_id}", hourly_cents: 1000, daily_cents: 3000, seasonal_flat_cents: 20000, deposit_cents: 5000, damage_waiver_cents_per_day: 400, late_fee_cents_per_hour: 800, loss_fee_cents: 20000 }
              as: ShopAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /rental/gear-units"
              payload: { gear_type_id: "${gt_id}", rate_card_id: "${rc_id}", asset_tag: "PU-1" }
              as: ShopAdmin
              captures: { gu_id: $.data.id, gu_v: $.data.version }
            - call: "POST /rental/customers"
              payload: { full_name: "Ty Uno", email: "ty@x.com", skill_level: "EXPERT" }
              as: RentalAgent
              captures: { cust_id: $.data.id }
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust_id}", gear_unit_id: "${gu_id}", pickup_at: "2026-06-04T08:00:00Z", due_at: "2026-06-04T10:00:00Z", expected_gear_unit_version: "${gu_v}" }
              as: RentalAgent
              captures: { res_id: $.data.id }
            - call: "POST /rental/reservations/${res_id}/confirm"
              payload: {}
              as: RentalAgent
            - call: "POST /rental/reservations/${res_id}/checkout"
              payload: { condition_rating: "GOOD" }
              as: RentalAgent
          trigger:
            - call: "POST /rental/reservations/${res_id}/cancel"
              payload: {}
              as: RentalAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE"

      - name: terminal_cancelled_reservation_rejects_confirm
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Reservation.CONFIRMED_to_CANCELLED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "CANCELLED is terminal; any subsequent confirm returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A CANCELLED reservation."]
          setup_api_calls:
            - call: "POST /rental/_clock/set"
              payload: { to_iso8601: "2026-06-05T08:00:00Z" }
              as: ShopAdmin
            - call: "POST /rental/gear-types"
              payload: { category: "KAYAK", name: "TC", size_label: "M" }
              as: ShopAdmin
              captures: { gt_id: $.data.id }
            - call: "POST /rental/rate-cards"
              payload: { gear_type_id: "${gt_id}", hourly_cents: 1000, daily_cents: 3000, seasonal_flat_cents: 20000, deposit_cents: 5000, damage_waiver_cents_per_day: 400, late_fee_cents_per_hour: 800, loss_fee_cents: 20000 }
              as: ShopAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /rental/gear-units"
              payload: { gear_type_id: "${gt_id}", rate_card_id: "${rc_id}", asset_tag: "TC-1" }
              as: ShopAdmin
              captures: { gu_id: $.data.id, gu_v: $.data.version }
            - call: "POST /rental/customers"
              payload: { full_name: "Uma Vid", email: "uma@x.com", skill_level: "EXPERT" }
              as: RentalAgent
              captures: { cust_id: $.data.id }
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust_id}", gear_unit_id: "${gu_id}", pickup_at: "2026-06-05T08:00:00Z", due_at: "2026-06-05T10:00:00Z", expected_gear_unit_version: "${gu_v}" }
              as: RentalAgent
              captures: { res_id: $.data.id }
            - call: "POST /rental/reservations/${res_id}/cancel"
              payload: {}
              as: RentalAgent
          trigger:
            - call: "POST /rental/reservations/${res_id}/confirm"
              payload: {}
              as: RentalAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE"

      - name: repair_returns_unit_from_maintenance_to_available
        claim_type: Valid Transition
        grounds: [state_machines.GearUnit.MAINTENANCE_to_AVAILABLE, entities.GearUnit.fields.condition]
        distinguishing_aspect: "After a DAMAGED settle puts a unit in MAINTENANCE, POST /repair moves it to AVAILABLE and condition DAMAGED->WORN."
        test_recipe:
          setup: ["A unit settled DAMAGED -> MAINTENANCE (condition DAMAGED)."]
          setup_api_calls:
            - call: "POST /rental/_clock/set"
              payload: { to_iso8601: "2026-06-06T08:00:00Z" }
              as: ShopAdmin
            - call: "POST /rental/gear-types"
              payload: { category: "SKI", name: "Rep", size_label: "170cm" }
              as: ShopAdmin
              captures: { gt_id: $.data.id }
            - call: "POST /rental/rate-cards"
              payload: { gear_type_id: "${gt_id}", hourly_cents: 1000, daily_cents: 3000, seasonal_flat_cents: 20000, deposit_cents: 5000, damage_waiver_cents_per_day: 400, late_fee_cents_per_hour: 800, loss_fee_cents: 20000 }
              as: ShopAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /rental/gear-units"
              payload: { gear_type_id: "${gt_id}", rate_card_id: "${rc_id}", asset_tag: "REP-1" }
              as: ShopAdmin
              captures: { gu_id: $.data.id, gu_v: $.data.version }
            - call: "POST /rental/customers"
              payload: { full_name: "Vic Wu", email: "vic@x.com", skill_level: "EXPERT" }
              as: RentalAgent
              captures: { cust_id: $.data.id }
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust_id}", gear_unit_id: "${gu_id}", pickup_at: "2026-06-06T08:00:00Z", due_at: "2026-06-06T10:00:00Z", damage_waiver_opted: false, expected_gear_unit_version: "${gu_v}" }
              as: RentalAgent
              captures: { res_id: $.data.id }
            - call: "POST /rental/reservations/${res_id}/confirm"
              payload: {}
              as: RentalAgent
            - call: "POST /rental/reservations/${res_id}/checkout"
              payload: { condition_rating: "GOOD" }
              as: RentalAgent
            - call: "POST /rental/_clock/set"
              payload: { to_iso8601: "2026-06-06T09:30:00Z" }
              as: ShopAdmin
            - call: "POST /rental/reservations/${res_id}/checkin"
              payload: { condition_rating: "DAMAGED" }
              as: RentalAgent
            - call: "POST /rental/reservations/${res_id}/settle"
              payload: {}
              as: RentalAgent
          trigger:
            - call: "POST /rental/gear-units/${gu_id}/repair"
              payload: {}
              as: ShopAdmin
              captures: { av: $.data.availability, cond: $.data.condition }
          assert:
            - "GearUnit.${gu_id}.availability == AVAILABLE"
            - "GearUnit.${gu_id}.condition == WORN"

      - name: damaged_settle_routes_unit_to_maintenance_conditional_cascade
        claim_type: Conditional cascade
        grounds: [state_machines.GearUnit.INSPECTING_to_MAINTENANCE, calculations.damage_charge]
        distinguishing_aspect: "On settle, the unit goes INSPECTING->MAINTENANCE only when checkin condition is DAMAGED (not GOOD/WORN); DAMAGE_FEE = round(20000*0.40)=8000 posted."
        test_recipe:
          setup: ["A reservation checked in DAMAGED, no waiver."]
          setup_api_calls:
            - call: "POST /rental/_clock/set"
              payload: { to_iso8601: "2026-06-07T08:00:00Z" }
              as: ShopAdmin
            - call: "POST /rental/gear-types"
              payload: { category: "SKI", name: "Dmg", size_label: "170cm" }
              as: ShopAdmin
              captures: { gt_id: $.data.id }
            - call: "POST /rental/rate-cards"
              payload: { gear_type_id: "${gt_id}", hourly_cents: 1000, daily_cents: 3000, seasonal_flat_cents: 20000, deposit_cents: 5000, damage_waiver_cents_per_day: 400, late_fee_cents_per_hour: 800, loss_fee_cents: 20000 }
              as: ShopAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /rental/gear-units"
              payload: { gear_type_id: "${gt_id}", rate_card_id: "${rc_id}", asset_tag: "DMG-1" }
              as: ShopAdmin
              captures: { gu_id: $.data.id, gu_v: $.data.version }
            - call: "POST /rental/customers"
              payload: { full_name: "Wei Xu", email: "wei@x.com", skill_level: "EXPERT" }
              as: RentalAgent
              captures: { cust_id: $.data.id }
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust_id}", gear_unit_id: "${gu_id}", pickup_at: "2026-06-07T08:00:00Z", due_at: "2026-06-07T10:00:00Z", damage_waiver_opted: false, expected_gear_unit_version: "${gu_v}" }
              as: RentalAgent
              captures: { res_id: $.data.id }
            - call: "POST /rental/reservations/${res_id}/confirm"
              payload: {}
              as: RentalAgent
            - call: "POST /rental/reservations/${res_id}/checkout"
              payload: { condition_rating: "GOOD" }
              as: RentalAgent
            - call: "POST /rental/_clock/set"
              payload: { to_iso8601: "2026-06-07T09:30:00Z" }
              as: ShopAdmin
            - call: "POST /rental/reservations/${res_id}/checkin"
              payload: { condition_rating: "DAMAGED" }
              as: RentalAgent
          trigger:
            - call: "POST /rental/reservations/${res_id}/settle"
              payload: {}
              as: RentalAgent
            - call: "GET /rental/gear-units/${gu_id}"
              payload: {}
              as: RentalAgent
              captures: { av: $.data.availability }
            - call: "GET /rental/damage-assessments?reservation_id=${res_id}"
              payload: {}
              as: RentalAgent
              captures: { charge: $.data.0.charge_cents }
          assert:
            - "GearUnit.${gu_id}.availability == MAINTENANCE"
            - "DamageAssessment for ${res_id} charge_cents == 8000, outcome == DAMAGE"

      - name: damage_waiver_suppresses_damage_charge
        claim_type: Side Effect Execution
        grounds: [calculations.damage_charge, entities.DamageAssessment.fields.waiver_applied, entities.Reservation.fields.damage_waiver_opted]
        distinguishing_aspect: "With damage_waiver_opted=true, a DAMAGED checkin yields charge_cents=0 and waiver_applied=true."
        test_recipe:
          setup: ["A reservation with damage_waiver_opted=true, checked in DAMAGED."]
          setup_api_calls:
            - call: "POST /rental/_clock/set"
              payload: { to_iso8601: "2026-06-08T08:00:00Z" }
              as: ShopAdmin
            - call: "POST /rental/gear-types"
              payload: { category: "SKI", name: "Wv", size_label: "170cm" }
              as: ShopAdmin
              captures: { gt_id: $.data.id }
            - call: "POST /rental/rate-cards"
              payload: { gear_type_id: "${gt_id}", hourly_cents: 1000, daily_cents: 3000, seasonal_flat_cents: 20000, deposit_cents: 5000, damage_waiver_cents_per_day: 400, late_fee_cents_per_hour: 800, loss_fee_cents: 20000 }
              as: ShopAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /rental/gear-units"
              payload: { gear_type_id: "${gt_id}", rate_card_id: "${rc_id}", asset_tag: "WV-1" }
              as: ShopAdmin
