        grounds:
          - calculations.staff_shift_occupation_window
          - constants.REST_BUFFER_MIN
          - constants.MAX_SHIFT_MINUTES
          - validations[priority 110].ERR_SHIFT_OVERLAP
          - validations[priority 110].ERR_SHIFT_TOO_LONG
