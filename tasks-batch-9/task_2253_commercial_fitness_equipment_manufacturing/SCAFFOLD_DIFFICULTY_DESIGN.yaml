# =============================================================================
# task_2253 — Commercial Fitness Equipment Manufacturing
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_id blocks / 24 instances. Every numeric assert literal was computed
# by executing the §1.3 formulas with exact decimal arithmetic (ROUND_HALF_UP).
# =============================================================================
scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: order_price_provisional_vs_final_variant_divergence
    grounds:
    - calculations.order_total_assembly
    - calculations.order_total_assembly.variants.PROVISIONAL
    - calculations.order_total_assembly.variants.FINAL
    - state_machines.Order.billing_status.QUOTED_to_INVOICED
    - entities.Order.fields.quoted_total_cents
    - entities.Order.fields.final_total_cents
    - entities.Order.fields.price_variant_applied
    - endpoints[POST /orders/{id}/quote]
    - endpoints[POST /install-jobs/{id}/complete]
    distinguishing_aspect: The same order is priced twice by order_total_assembly with only step 2 differing (PROVISIONAL install_hours = 3.0 estimated from INSTALL_HOURS_PER_UNIT[CARDIO] x 2 units, FINAL
      install_hours = 4.5 actual reported by the crew), so quoted_total_cents == 1120619 and final_total_cents == 1133932 must both persist on the same row with a delta of exactly 13313 cents.
    test_recipe:
      setup:
      - Logical clock at the default 2026-08-01T00:00:00Z throughout.
      - T900 Treadmill (CARDIO / FULL_COMMERCIAL / 479950 cents / 212.5 kg) has a RELEASED revision T900-R1.
      - Facility f1 is freight_zone Z1 with a 500000000-cent credit limit and no install blackout days.
      - 'Order o1 carries one ACTIVE line: 2 x T900-R1 in GRAPHITE (extended_price_cents 1017494).'
      - ServicePartner p1 is CARDIO-certified, training current until 2027-12-31, capacity 100.00 hours.
      - The order is QUOTED at the PROVISIONAL variant, CONFIRMED, produced and STAGED, and install job j1 is ON_SITE.
      setup_api_calls:
      - call: POST /equipment-models
        payload: {name: T900 Treadmill, category: CARDIO, duty_class: FULL_COMMERCIAL, unit_list_price_cents: 479950, shipping_weight_kg: 212.5, allowed_finish_codes: [GRAPHITE, ARCTIC_WHITE, CLUB_RED]}
        as: ProductEngineer
        captures: {m1: $.data.id, m1_v: $.data.version}
      - call: POST /model-revisions
        payload: {equipment_model_id: '${m1}', revision_code: T900-R1, target_cycle_count: 600000, expected_equipment_model_version: '${m1_v}'}
        as: ProductEngineer
        captures: {r1: $.data.id}
      - call: POST /model-revisions/${r1}/submit-for-testing
        payload: {}
        as: ProductEngineer
      - call: POST /test-rigs
        payload: {name: RIG-A, parallel_station_count: 2, supported_duty_classes: [FULL_COMMERCIAL, INSTITUTIONAL]}
        as: ProductEngineer
        captures: {g1: $.data.id}
      - call: POST /test-runs
        payload: {model_revision_id: '${r1}', test_rig_id: '${g1}', window_start: '2026-08-02T00:00:00Z', window_end: '2026-08-06T12:00:00Z', target_cycles: 300000}
        as: ProductEngineer
        captures: {x1: $.data.id}
      - call: POST /test-runs/${x1}/start
        payload: {}
        as: ProductEngineer
      - call: POST /test-runs/${x1}/complete
        payload: {outcome: PASSED, achieved_cycles: 300000}
        as: ProductEngineer
      - call: POST /test-runs
        payload: {model_revision_id: '${r1}', test_rig_id: '${g1}', window_start: '2026-08-06T00:00:00Z', window_end: '2026-08-10T12:00:00Z', target_cycles: 300000}
        as: ProductEngineer
        captures: {x2: $.data.id}
      - call: POST /test-runs/${x2}/start
        payload: {}
        as: ProductEngineer
      - call: POST /test-runs/${x2}/complete
        payload: {outcome: PASSED, achieved_cycles: 200000}
        as: ProductEngineer
      - call: POST /model-revisions/${r1}/qualify
        payload: {}
        as: ProductEngineer
      - call: POST /model-revisions/${r1}/release
        payload: {}
        as: ComplianceOfficer
        as_user_id: co-01
      - call: POST /facilities
        payload: {account_name: Northgate Athletic Club, freight_zone: Z1, credit_limit_cents: 500000000}
        as: OrderPlanner
        captures: {f1: $.data.id}
      - call: POST /orders
        payload: {facility_id: '${f1}', requested_install_window_start: '2026-09-10T08:00:00Z', requested_install_window_end: '2026-09-10T18:00:00Z'}
        as: OrderPlanner
        captures: {o1: $.data.id}
      - call: POST /orders/${o1}/lines
        payload: {model_revision_id: '${r1}', quantity: 2, finish_codes: [GRAPHITE], layout_zone_label: CARDIO-DECK}
        as: OrderPlanner
        captures: {l1: $.data.id}
      - call: GET /orders/${o1}
        payload: {}
        as: OrderPlanner
        captures: {o1_v: $.data.version}
      - call: POST /orders/${o1}/quote
        payload: {expected_order_version: '${o1_v}'}
        as: OrderPlanner
      - call: GET /orders/${o1}/price-breakdown
        payload: {}
        as: OrderPlanner
      - call: POST /orders/${o1}/confirm
        payload: {}
        as: OrderPlanner
      - call: POST /orders/${o1}/production/complete
        payload: {}
        as: OrderPlanner
      - call: POST /service-partners
        payload: {name: Northgate Service Co, region: R_NORTH, certified_categories: [CARDIO], certified_technician_count: 4, certified_hours_capacity: 100.0, training_current_until: '2027-12-31T00:00:00Z'}
        as: ServiceOpsAdmin
        captures: {p1: $.data.id}
      - call: POST /install-jobs
        payload: {order_id: '${o1}', service_partner_id: '${p1}', window_start: '2026-09-10T08:00:00Z', window_end: '2026-09-10T12:00:00Z', estimated_labor_hours: 3.0}
        as: OrderPlanner
        captures: {j1: $.data.id}
      - call: POST /install-jobs/${j1}/arrive
        payload: {}
        as: ServicePartnerTech
        as_user_id: ${p1}
      trigger:
      - call: POST /install-jobs/${j1}/complete
        payload: {actual_labor_hours: 4.5, punch_list_open_count: 0}
        as: ServicePartnerTech
        as_user_id: ${p1}
      - call: GET /orders/${o1}/price-breakdown
        payload: {}
        as: OrderPlanner
      assert:
      - POST /install-jobs/${j1}/complete returns 200 and InstallJob.${j1}.status == COMPLETED
      - Order.${o1}.fulfillment_status == INSTALLED and Order.${o1}.billing_status == INVOICED
      - Order.${o1}.line_subtotal_cents == 1017494 under both variants
      - Order.${o1}.quoted_total_cents == 1120619 (PROVISIONAL, retained unchanged by the FINAL write)
      - Order.${o1}.final_total_cents == 1133932
      - Order.${o1}.final_total_cents - Order.${o1}.quoted_total_cents == 13313
      - Order.${o1}.install_amount_cents == 39938 after the FINAL write (it was 26625 in the PROVISIONAL quote)
      - Order.${o1}.freight_cents == 76500 under both variants and Order.${o1}.volume_discount_cents == 0 under both
      - Order.${o1}.punch_list_credit_cents == 0 and Order.${o1}.price_variant_applied == FINAL
      - Order.${o1}.amount_due_cents == 1133932
      - GET /orders/${o1}/price-breakdown returns install_amount_cents 39938, discount_base_cents 1057432, discounted_base_cents 1057432, freight_cents 76500
  - name: revision_cycle_verified_vs_projected_variant_divergence
    grounds:
    - calculations.revision_cycle_qualification
    - calculations.revision_cycle_qualification.variants.VERIFIED_CHRONOLOGICAL
    - calculations.revision_cycle_qualification.variants.PROJECTED_EXTRAPOLATION
    - entities.ModelRevision.fields.verified_cycle_count
    - entities.ModelRevision.fields.projected_cycle_count
    - endpoints[GET /model-revisions/{id}/qualification-report]
    distinguishing_aspect: One identical run history (PASSED 180000, PASSED 240000, FAILED at 140000, PASSED 260000) yields verified_cycle_count == 560000 because VERIFIED_CHRONOLOGICAL halts at the first
      FAILED run, while PROJECTED_EXTRAPOLATION never halts and credits the failure at FAILURE_CREDIT_FACTOR, yielding projected_cycle_count == 750000 — a 190000-cycle divergence on the same rows.
    test_recipe:
      setup:
      - Logical clock at the default 2026-08-01T00:00:00Z throughout.
      - T900 Treadmill is FULL_COMMERCIAL, so revision T900-R1 has min_required_cycles 500000.
      - Revision T900-R1 is IN_TESTING with target_cycle_count 600000.
      - 'Four COMPLETED runs exist on rig RIG-A in window_end order: PASSED 180000, PASSED 240000, FAILED at 140000, PASSED 260000.'
      - No run is RESERVED or RUNNING and no rework has happened, so superseded_by_rework is false on all four.
      setup_api_calls:
      - call: POST /equipment-models
        payload: {name: T900 Treadmill, category: CARDIO, duty_class: FULL_COMMERCIAL, unit_list_price_cents: 479950, shipping_weight_kg: 212.5, allowed_finish_codes: [GRAPHITE, ARCTIC_WHITE, CLUB_RED]}
        as: ProductEngineer
        captures: {m1: $.data.id, m1_v: $.data.version}
      - call: POST /model-revisions
        payload: {equipment_model_id: '${m1}', revision_code: T900-R1, target_cycle_count: 600000, expected_equipment_model_version: '${m1_v}'}
        as: ProductEngineer
        captures: {r1: $.data.id}
      - call: POST /model-revisions/${r1}/submit-for-testing
        payload: {}
        as: ProductEngineer
      - call: POST /test-rigs
        payload: {name: RIG-A, parallel_station_count: 2, supported_duty_classes: [FULL_COMMERCIAL, INSTITUTIONAL]}
        as: ProductEngineer
        captures: {g1: $.data.id}
      - call: POST /test-runs
        payload: {model_revision_id: '${r1}', test_rig_id: '${g1}', window_start: '2026-08-02T00:00:00Z', window_end: '2026-08-06T12:00:00Z', target_cycles: 300000}
        as: ProductEngineer
        captures: {x1: $.data.id}
      - call: POST /test-runs/${x1}/start
        payload: {}
        as: ProductEngineer
      - call: POST /test-runs/${x1}/complete
        payload: {outcome: PASSED, achieved_cycles: 180000}
        as: ProductEngineer
      - call: POST /test-runs
        payload: {model_revision_id: '${r1}', test_rig_id: '${g1}', window_start: '2026-08-06T00:00:00Z', window_end: '2026-08-10T12:00:00Z', target_cycles: 300000}
        as: ProductEngineer
        captures: {x2: $.data.id}
      - call: POST /test-runs/${x2}/start
        payload: {}
        as: ProductEngineer
      - call: POST /test-runs/${x2}/complete
        payload: {outcome: PASSED, achieved_cycles: 240000}
        as: ProductEngineer
      - call: POST /test-runs
        payload: {model_revision_id: '${r1}', test_rig_id: '${g1}', window_start: '2026-08-10T00:00:00Z', window_end: '2026-08-14T12:00:00Z', target_cycles: 300000}
        as: ProductEngineer
        captures: {x3: $.data.id}
      - call: POST /test-runs/${x3}/start
        payload: {}
        as: ProductEngineer
      - call: POST /test-runs/${x3}/complete
        payload: {outcome: FAILED, failure_cycle_count: 140000}
        as: ProductEngineer
      - call: POST /test-runs
        payload: {model_revision_id: '${r1}', test_rig_id: '${g1}', window_start: '2026-08-14T00:00:00Z', window_end: '2026-08-18T12:00:00Z', target_cycles: 300000}
        as: ProductEngineer
        captures: {x4: $.data.id}
      - call: POST /test-runs/${x4}/start
        payload: {}
        as: ProductEngineer
      - call: POST /test-runs/${x4}/complete
        payload: {outcome: PASSED, achieved_cycles: 260000}
        as: ProductEngineer
      trigger:
      - call: GET /model-revisions/${r1}/qualification-report
        payload: {}
        as: ProductEngineer
      assert:
      - GET /model-revisions/${r1}/qualification-report returns 200
      - verified_cycle_count == 560000 (180000 + 240000 + 140000, then the walk STOPS at the FAILED run)
      - projected_cycle_count == 750000 (180000 + 240000 + floor(140000 * 0.5) + 260000)
      - projected_cycle_count - verified_cycle_count == 190000
      - min_required_cycles == 500000 and qualifies == true
      - completed_run_count == 4 and running_run_count == 0
      - ModelRevision.${r1}.verified_cycle_count == 560000 and ModelRevision.${r1}.projected_cycle_count == 750000
      - ModelRevision.${r1}.status == IN_TESTING (the FAILED run did not force TEST_FAILED because 560000 >= 500000)
      - DurabilityTestRun.${x4}.achieved_cycles == 260000 is excluded from verified_cycle_count even though it is COMPLETED and PASSED
- rule_id: combinatorial_formula
  instances:
  - name: pm_annual_hours_nested_usage_clamp_both_arms
    grounds:
    - calculations.pm_program_annual_labor_hours
    - entities.PMProgram.fields.annual_labor_hours_committed
    - entities.SerializedAsset.fields.annual_usage_hours
    - endpoints[POST /pm-programs/{id}/activate]
    - endpoints[POST /serialized-assets/{id}/usage-report]
    distinguishing_aspect: 'The nested clamp min(2.0, max(1.0, annual_usage_hours / 2000)) is exercised on all three of its arms for the same PLATINUM/180-day program over one STRENGTH asset: usage 0 hits
      the inner max floor (2.88 hours), usage 5000 hits the interior ratio capped by the outer min (5.76 hours), and usage 12000 stays at 5.76 — proving the cap, not a linear scale-up to 13.82.'
    test_recipe:
      setup:
      - Logical clock at the default 2026-08-01T00:00:00Z throughout.
      - S500 Selectorised Press (STRENGTH / INSTITUTIONAL / 324575 cents / 341.0 kg) has a RELEASED revision S500-R1.
      - Facility f1 (Z1) owns exactly one IN_SERVICE asset built from that revision (order total 443846 cents).
      - ServicePartner p1 is STRENGTH-certified with a 100.00-hour capacity and training current until 2027-12-31.
      - PMProgram pm1 is ACTIVE at tier PLATINUM with visit_interval_days 180, so visits_per_year == ceil(365/180) == 3.
      - The asset's annual_usage_hours is 0 at activation, then reported as 5000, then as 12000.
      setup_api_calls:
      - call: POST /equipment-models
        payload: {name: S500 Selectorised Press, category: STRENGTH, duty_class: INSTITUTIONAL, unit_list_price_cents: 324575, shipping_weight_kg: 341.0, allowed_finish_codes: [GRAPHITE, CLUB_RED, PREMIUM_UPHOLSTERY]}
        as: ProductEngineer
        captures: {m2: $.data.id, m2_v: $.data.version}
      - call: POST /model-revisions
        payload: {equipment_model_id: '${m2}', revision_code: S500-R1, target_cycle_count: 950000, expected_equipment_model_version: '${m2_v}'}
        as: ProductEngineer
        captures: {r2: $.data.id}
      - call: POST /model-revisions/${r2}/submit-for-testing
        payload: {}
        as: ProductEngineer
      - call: POST /test-rigs
        payload: {name: RIG-S, parallel_station_count: 2, supported_duty_classes: [INSTITUTIONAL]}
        as: ProductEngineer
        captures: {g1: $.data.id}
      - call: POST /test-runs
        payload: {model_revision_id: '${r2}', test_rig_id: '${g1}', window_start: '2026-08-02T00:00:00Z', window_end: '2026-08-06T12:00:00Z', target_cycles: 500000}
        as: ProductEngineer
        captures: {y1: $.data.id}
      - call: POST /test-runs/${y1}/start
        payload: {}
        as: ProductEngineer
      - call: POST /test-runs/${y1}/complete
        payload: {outcome: PASSED, achieved_cycles: 500000}
        as: ProductEngineer
      - call: POST /test-runs
        payload: {model_revision_id: '${r2}', test_rig_id: '${g1}', window_start: '2026-08-06T00:00:00Z', window_end: '2026-08-10T12:00:00Z', target_cycles: 500000}
        as: ProductEngineer
        captures: {y2: $.data.id}
      - call: POST /test-runs/${y2}/start
        payload: {}
        as: ProductEngineer
      - call: POST /test-runs/${y2}/complete
        payload: {outcome: PASSED, achieved_cycles: 400000}
        as: ProductEngineer
      - call: POST /model-revisions/${r2}/qualify
        payload: {}
        as: ProductEngineer
      - call: POST /model-revisions/${r2}/release
        payload: {}
        as: ComplianceOfficer
        as_user_id: co-01
      - call: POST /facilities
        payload: {account_name: Ironworks Strength Club, freight_zone: Z1, credit_limit_cents: 500000000}
        as: OrderPlanner
        captures: {f1: $.data.id}
      - call: POST /orders
        payload: {facility_id: '${f1}', requested_install_window_start: '2026-09-10T08:00:00Z', requested_install_window_end: '2026-09-10T18:00:00Z'}
        as: OrderPlanner
        captures: {o1: $.data.id}
      - call: POST /orders/${o1}/lines
        payload: {model_revision_id: '${r2}', quantity: 1, finish_codes: [GRAPHITE], layout_zone_label: PLATE-ROW}
        as: OrderPlanner
        captures: {l1: $.data.id}
      - call: GET /orders/${o1}
        payload: {}
        as: OrderPlanner
        captures: {o1_v: $.data.version}
      - call: POST /orders/${o1}/quote
        payload: {expected_order_version: '${o1_v}'}
        as: OrderPlanner
      - call: POST /orders/${o1}/confirm
        payload: {}
        as: OrderPlanner
      - call: POST /orders/${o1}/production/complete
        payload: {}
        as: OrderPlanner
      - call: POST /service-partners
        payload: {name: Ironworks Service Co, region: R_SOUTH, certified_categories: [STRENGTH], certified_technician_count: 3, certified_hours_capacity: 100.0, training_current_until: '2027-12-31T00:00:00Z'}
        as: ServiceOpsAdmin
        captures: {p1: $.data.id}
      - call: POST /install-jobs
        payload: {order_id: '${o1}', service_partner_id: '${p1}', window_start: '2026-09-10T08:00:00Z', window_end: '2026-09-10T12:00:00Z', estimated_labor_hours: 2.5}
        as: OrderPlanner
        captures: {j1: $.data.id}
      - call: POST /install-jobs/${j1}/arrive
        payload: {}
        as: ServicePartnerTech
        as_user_id: ${p1}
      - call: POST /install-jobs/${j1}/complete
        payload: {actual_labor_hours: 2.5, punch_list_open_count: 0}
        as: ServicePartnerTech
        as_user_id: ${p1}
      - call: GET /serialized-assets
        payload: {facility_id: '${f1}'}
        as: OrderPlanner
        captures: {a1: '$.data[0].id'}
      - call: POST /pm-programs
        payload: {facility_id: '${f1}', service_partner_id: '${p1}', tier: PLATINUM, visit_interval_days: 180}
        as: ServiceOpsAdmin
        captures: {pm1: $.data.id}
      - call: POST /pm-programs/${pm1}/activate
        payload: {}
        as: ServiceOpsAdmin
      - call: POST /serialized-assets/${a1}/usage-report
        payload: {annual_usage_hours: 5000}
        as: ServicePartnerTech
        as_user_id: ${p1}
      trigger:
      - call: POST /serialized-assets/${a1}/usage-report
        payload: {annual_usage_hours: 12000}
        as: ServicePartnerTech
        as_user_id: ${p1}
      - call: GET /pm-programs/${pm1}
        payload: {}
        as: ServiceOpsAdmin
      assert:
      - POST /serialized-assets/${a1}/usage-report returns 200 and SerializedAsset.${a1}.annual_usage_hours == 12000
      - PMProgram.${pm1}.covered_asset_count == 1
      - PMProgram.${pm1}.annual_labor_hours_committed == 5.76 (0.6 * 2.0 * 1.6 * 3), unchanged from the 5000-hour report
      - PMProgram.${pm1}.annual_labor_hours_committed was 2.88 at activation with annual_usage_hours 0 (inner max floor 1.0)
      - PMProgram.${pm1}.annual_labor_hours_committed was 5.76 after the 5000-hour report (ratio 2.5 clamped to 2.0 by the outer min)
      - PMProgram.${pm1}.annual_labor_hours_committed != 34.56 (the unclamped 12000/2000 = 6.0 factor)
      - ServicePartner.${p1}.committed_hours == 5.76 and ServicePartner.${p1}.coverage_status == ACTIVE
      - PMProgram.${pm1}.status == ACTIVE
