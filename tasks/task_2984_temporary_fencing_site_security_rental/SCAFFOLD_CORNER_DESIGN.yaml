      - name: void_of_a_paid_invoice_and_of_a_voided_invoice_rejected
        claim_type: triggerability
        grounds:
          - errors.ERR_INVOICE_STATE
          - validations.priority_9_ERR_INVOICE_STATE
          - state_machines.Invoice.ISSUED_to_VOID
          - entities.CustomerAccount.fields.lifetime_credited_cents
        distinguishing_aspect: |
          Both terminal invoice states lock the void action: a fully paid
          mobilization invoice refuses the void with ERR_INVOICE_STATE and keeps
          amount_paid_cents 85487, while a periodic invoice voided once for
          29403 refuses the replay with the same code — and the credit is
          recorded exactly once in lifetime_credited_cents.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "Municipality HRB-01 (rental_tax_rate_bp 890), account A (credit_limit_cents 100000000), product PANEL-CL-10, crew CRW-A, jobsite J1 (SOIL)."
            - "A 500 ft CONSTRUCTION term-3 contract CT1 mobilized at clock 2026-08-01, so the MOBILIZATION invoice of 85487 is ISSUED with issued_by_user_id dc-001."
            - "The mobilization invoice is paid in full, so it is PAID."
            - "The clock is advanced to 2026-08-29T00:00:00Z and a billing run over [2026-08-01, 2026-08-29) issues a 29403 PERIODIC invoice with issued_by_user_id am-001."
