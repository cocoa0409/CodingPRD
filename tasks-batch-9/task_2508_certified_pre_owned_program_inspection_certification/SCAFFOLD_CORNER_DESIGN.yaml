      - name: audit_run_ranks_pool_and_selects_one
        claim_type: threshold
        grounds:
          - calculations.audit_sample_selection
          - entities.AuditSample.fields.selection_rank
          - entities.Certification.fields.audit_sampled
        distinguishing_aspect: |
          A two-certification pool at identical risk_score 0 exercises the second sort key alone:
          ceil(0.2 * 2) == 1 is raised to max(1, 1) == 1 and clamped by the pool size, so exactly one
          of the two must be picked, and the activated_at ASC tie-break decides which. The clock is
          advanced between the two approvals so that the two activation instants are distinguishable
          and the expected winner is unambiguous.
        test_recipe:
          setup:
            - "One dealer, two technicians, two identical low-mileage vehicles; both certifications reach ACTIVE, C_A at 2026-08-01 and C_B a day later."
            - "Neither has ever been sampled and the dealer's privilege_status is ACTIVE, so both are pool-eligible."
