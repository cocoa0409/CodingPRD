  - rule_id: compensating_invariant
    instances:
      - name: revocation_appends_offsetting_retention_row_conserving_ack_ledger
        invariant: ack_ledger_balance
        grounds:
          - calculations.ack_ledger_balance
          - entities.RetentionRecord.fields.signed_delta
          - entities.RetentionRecord.fields.record_kind
          - calculations.retention_until
          - endpoints[POST /acknowledgments/{acknowledgment_id}/revoke]
        distinguishing_aspect: |
          The conserved quantity is an append-only signed ledger that must never be edited: a
          revocation may not delete or mutate the CAPTURE row, because the captured signature is
          the dispute evidence. Instead a second REVOCATION row with signed_delta -1 is appended,
          driving sum(signed_delta) back to 0 to match the zero EFFECTIVE acknowledgments, and the
          two rows carry DIFFERENT retention_until values because each is anchored on its own
          retained_from and the 1095-day dispute floor dominates CA's 2 calendar years.
        test_recipe:
          setup:
            - "Jurisdiction CA with retention_years 2 (so DISPUTE_FLOOR_DAYS dominates), esign_permitted true, ack_deadline_days 30."
            - "Two ACTIVE CA employees e1 and e2, so the package cannot auto-CLOSE when e1 acknowledges and stays RELEASED for the whole run."
            - "PolicyDocument CODE_OF_CONDUCT with max_ack_deadline_days 5; version v1 approved and translated; ReleasePackage P1 (effective_date 2026-08-15T00:00:00Z, scope [CA]) RELEASED at 2026-08-15T00:00:00Z."
            - "e1's assignment delivered and acknowledged by ESIGN at 2026-08-15T00:00:00Z, appending one CAPTURE RetentionRecord; the clock is then advanced to 2026-08-16T00:00:00Z."
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { state_code: "CA", display_name: "California", min_legal_review_days: 5, ack_deadline_days: 30, retention_years: 2, required_language_codes: ["en"], esign_permitted: true, proxy_ack_permitted: false, ack_window_buffer_days: 3 }, as: HRComplianceAdmin, captures: { j_ca: "$.data.id" } }
            - { call: "POST /legal-reviewers", payload: { jurisdiction_id: "${j_ca}", full_name: "Ada Counsel", bar_number: "CA-1", concurrent_review_limit: 3, is_active: true }, as: HRComplianceAdmin, captures: { r_ca: "$.data.id" } }
            - { call: "POST /employees", payload: { jurisdiction_id: "${j_ca}", work_email: "e1@ex.com", full_name: "Emp One", preferred_language_code: "en", needs_accessible_format: false, employment_status: "ACTIVE" }, as: HRComplianceAdmin, captures: { e1: "$.data.id" } }
            - { call: "POST /employees", payload: { jurisdiction_id: "${j_ca}", work_email: "e2@ex.com", full_name: "Emp Two", preferred_language_code: "en", needs_accessible_format: false, employment_status: "ACTIVE" }, as: HRComplianceAdmin, captures: { e2: "$.data.id" } }
            - { call: "POST /policy-documents", payload: { title: "Code of Conduct 2026", category: "CODE_OF_CONDUCT", max_ack_deadline_days: 5 }, as: PolicyAuthor, captures: { d1: "$.data.id", d1v: "$.data.version" } }
            - { call: "POST /policy-documents/${d1}/versions", payload: { body_text: "S1 S2 S3 S4", section_count: 4, required_jurisdiction_ids: ["${j_ca}"], expected_policy_document_version: "${d1v}" }, as: PolicyAuthor, captures: { v1: "$.data.id" } }
            - { call: "POST /policy-versions/${v1}/addenda", payload: { jurisdiction_id: "${j_ca}", body_text: "CA addendum" }, as: PolicyAuthor, captures: { a1: "$.data.id" } }
            - { call: "POST /policy-versions/${v1}/legal-reviews", payload: { jurisdiction_id: "${j_ca}", reviewer_id: "${r_ca}", due_at: "2026-08-06T00:00:00Z" }, as: PolicyAuthor, captures: { lr1: "$.data.id" } }
            - { call: "POST /addenda/${a1}/approve", payload: {}, as: LegalCounsel, as_user_id: "${r_ca}" }
            - { call: "POST /policy-versions/${v1}/submit-for-review", payload: {}, as: PolicyAuthor }
            - { call: "POST /legal-reviews/${lr1}/start", payload: {}, as: LegalCounsel, as_user_id: "${r_ca}" }
            - { call: "POST /legal-reviews/${lr1}/decision", payload: { verdict: "APPROVE" }, as: LegalCounsel, as_user_id: "${r_ca}" }
            - { call: "POST /policy-versions/${v1}/approve", payload: {}, as: HRComplianceAdmin }
            - { call: "POST /policy-versions/${v1}/translations", payload: { language_code: "en" }, as: LocalizationSpecialist, captures: { t1: "$.data.id" } }
            - { call: "POST /translations/${t1}/start", payload: {}, as: LocalizationSpecialist }
            - { call: "POST /translations/${t1}/submit-a11y", payload: { section_scores: [0.96, 0.96, 0.96, 0.96] }, as: LocalizationSpecialist }
            - { call: "POST /translations/${t1}/publish", payload: {}, as: LocalizationSpecialist }
            - { call: "POST /release-packages", payload: { name: "P1", effective_date: "2026-08-15T00:00:00Z", scope_jurisdiction_ids: ["${j_ca}"] }, as: HRComplianceAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /release-packages/${p1}/items", payload: { policy_version_id: "${v1}" }, as: HRComplianceAdmin }
            - { call: "POST /release-packages/${p1}/schedule", payload: {}, as: HRComplianceAdmin, captures: { p1v: "$.data.version" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: HRComplianceAdmin }
            - { call: "POST /release-packages/${p1}/release", payload: { expected_release_package_version: "${p1v}" }, as: HRComplianceAdmin }
            - { call: "GET /assignments", payload: { employee_id: "${e1}", release_package_id: "${p1}" }, as: HRComplianceAdmin, captures: { asg1: "$.data[0].id" } }
            - { call: "POST /assignments/${asg1}/deliver", payload: {}, as: HRComplianceAdmin }
            - { call: "POST /acknowledgments", payload: { assignment_id: "${asg1}", method: "ESIGN", language_code: "en", signature_text: "Emp One" }, as: Employee, as_user_id: "${e1}", captures: { ack1: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T00:00:00Z" }, as: HRComplianceAdmin }
          trigger:
            - { call: "POST /acknowledgments/${ack1}/revoke", payload: { reason: "Signature captured against the wrong rendition." }, as: HRComplianceAdmin }
          assert:
            - "Acknowledgment.${ack1}.status == REVOKED"
            - "Acknowledgment.${ack1}.captured_at == 2026-08-15T00:00:00.000Z"
            - "Acknowledgment.${ack1}.revoked_at == 2026-08-16T00:00:00.000Z"
            - "Acknowledgment.${ack1}.signature_text == Emp One (the captured evidence is never scrubbed)"
            - "GET /retention-records?employee_id=${e1} returns exactly 2 rows"
            - "the CAPTURE row has record_kind == CAPTURE, signed_delta == 1, retained_from == 2026-08-15T00:00:00.000Z, retention_until == 2029-08-14T00:00:00.000Z"
            - "the REVOCATION row has record_kind == REVOCATION, signed_delta == -1, retained_from == 2026-08-16T00:00:00.000Z, retention_until == 2029-08-15T00:00:00.000Z"
            - "sum of RetentionRecord.signed_delta for ${e1} == 0"
            - "count of Acknowledgment rows for ${e1} with status == EFFECTIVE == 0"
            - "ack_ledger_balance holds: 0 == 0"
            - "DistributionAssignment.${asg1}.ack_state == PENDING and acknowledged_at == null"
            - "Employee.${e1}.open_ack_count == 1"
            - "ReleasePackage.${p1}.status == RELEASED"
      - name: exception_revocation_restores_denormalized_open_ack_counter
        invariant: open_ack_count_reconciliation
        grounds:
          - calculations.open_ack_count_reconciliation
          - entities.Employee.fields.open_ack_count
          - state_machines.PolicyException[GRANTED -> REVOKED]
          - state_machines.DistributionAssignment[ack_state EXEMPT -> PENDING]
          - endpoints[POST /policy-exceptions/{policy_exception_id}/revoke]
        distinguishing_aspect: |
          A different conserved quantity and a different compensation mechanism: here the invariant
          is a DENORMALIZED counter that must always equal the recomputed count of assignments in
          {UNDELIVERED, PENDING}, and the compensation is an in-place reverse state transition
          (EXEMPT -> PENDING) rather than an offsetting append. Granting the exception drove
          open_ack_count to 0; revoking it must drive the counter back to 1 without touching the
          retention ledger at all, and expires_at must survive as the audit trail of the grant.
        test_recipe:
          setup:
            - "Jurisdiction CA (ack_deadline_days 30, retention_years 5, esign_permitted true); TWO active CA reviewers so segregation of duties can be satisfied."
            - "Manager e_mgr plus Employee e1 whose manager_id is e_mgr; both are ACTIVE CA employees so the package stays RELEASED throughout."
            - "PolicyDocument CODE_OF_CONDUCT with max_ack_deadline_days 5; version v1 approved via reviewer CA-1 (addendum and legal review) and translated; ReleasePackage P1 RELEASED at 2026-08-15T00:00:00Z; e1's assignment delivered and PENDING, so open_ack_count is 1."
            - "e1 files a MEDICAL exception for 90 days (risk_score_conservative 41.40, under the 70.00 grant ceiling); e_mgr approves it and reviewer CA-2 (who touched neither the addendum nor the approved review) grants it, so the assignment is EXEMPT and open_ack_count is 0 immediately before the trigger."
