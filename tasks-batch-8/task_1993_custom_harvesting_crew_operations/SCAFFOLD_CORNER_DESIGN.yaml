  # ===========================================================================
  # Section: cross_cutting_complexity_layers
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_season_close_stale_version_rejected
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[season-close-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Close season with stale expected_season_version (one behind current) is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Season in SETTLING with no outstanding settlements; client captured version before a no-op PATCH bumped it"]
          setup_api_calls:
            - call: "POST /harvest/seasons"
              payload: { season_year: 2026, diesel_baseline_per_gallon_cents: 300, current_diesel_per_gallon_cents: 300 }
              as: HarvestOperator
              captures: { season_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/machines"
              payload: { machine_kind: "COMBINE", label: "C1", daily_capacity_acres: 200 }
              as: HarvestOperator
            - call: "POST /harvest/seasons/${season_id}/activate"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest/seasons/${season_id}/open-settlement"
              payload: {}
              as: HarvestOperator
            - call: "GET /harvest/seasons/${season_id}"
              payload: {}
              as: HarvestOperator
              captures: { season_v: $.data.version }
            - call: "PATCH /harvest/seasons/${season_id}"
              payload: { current_diesel_per_gallon_cents: 305 }
              as: HarvestOperator
          trigger:
            - call: "POST /harvest/seasons/${season_id}/close"
              payload: { expected_season_version: "${season_v}" }
              as: HarvestOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION (captured ${err})"
            - "http status == 412"

      - name: occ_settlement_issue_stale_contract_version_rejected
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[settlement-issue-stale-contract]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Issuing a settlement with expected_contract_version that does not match current (because a delivery ticket was added after the read) is rejected with ERR_STALE_VERSION."
        test_recipe:
          setup: ["Contract HARVESTED, season SETTLING, settlement DRAFT; client read contract version BEFORE another ticket was posted (ticket posting bumps contract.version)"]
          setup_api_calls:
            - call: "POST /harvest/seasons"
              payload: { season_year: 2026, diesel_baseline_per_gallon_cents: 300, current_diesel_per_gallon_cents: 300 }
              as: HarvestOperator
              captures: { season_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/machines"
              payload: { machine_kind: "COMBINE", label: "C1", daily_capacity_acres: 200 }
              as: HarvestOperator
              captures: { machine_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/activate"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest/seasons/${season_id}/contracts"
              payload: { grower_name: "G", state_code: "KS", crop: "WHEAT", rate_basis: "PER_ACRE", rate_cents_per_acre: 3200, rate_cents_per_bushel: 0, committed_acres: 100 }
              as: GrowerLiaison
              captures: { contract_id: $.data.id }
            - call: "POST /harvest/contracts/${contract_id}/commit"
              payload: {}
              as: GrowerLiaison
            - call: "POST /harvest/contracts/${contract_id}/route-stops"
              payload: { planned_start_date: "2026-08-05", planned_end_date: "2026-08-06", planned_acres: 100, sequence_index: 1 }
              as: GrowerLiaison
              captures: { stop_id: $.data.id }
            - call: "POST /harvest/machine-assignments"
              payload: { route_stop_id: "${stop_id}", machine_id: "${machine_id}", assigned_start_date: "2026-08-05", assigned_end_date: "2026-08-07" }
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop_id}/depart"
              payload: {}
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop_id}/start-cutting"
              payload: {}
              as: CrewBoss
            - call: "PATCH /harvest/route-stops/${stop_id}"
              payload: { actual_acres: 100 }
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop_id}/complete"
              payload: {}
              as: CrewBoss
            - call: "POST /harvest/seasons/${season_id}/open-settlement"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest/contracts/${contract_id}/settlements"
              payload: {}
              as: BillingClerk
              captures: { settlement_id: $.data.id }
            - call: "GET /harvest/contracts/${contract_id}"
              payload: {}
              as: BillingClerk
              captures: { contract_v: $.data.version }
          trigger:
            - call: "POST /harvest/settlements/${settlement_id}/issue"
              payload: { expected_contract_version: "${contract_v} - 1" }
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION (captured ${err})"
            - "http status == 412"

      - name: pagination_defaults_on_list_endpoints
        claim_type: pagination_defaults
        grounds:
          - response_envelope
        distinguishing_aspect: "GET list without limit/offset returns limit=10 and offset=0 in envelope."
        test_recipe:
          setup: ["Empty DB, one season"]
          setup_api_calls:
            - call: "POST /harvest/seasons"
              payload: { season_year: 2026, diesel_baseline_per_gallon_cents: 300, current_diesel_per_gallon_cents: 300 }
              as: HarvestOperator
          trigger:
            - call: "GET /harvest/seasons"
              payload: {}
              as: HarvestOperator
          assert:
            - "envelope limit == 10 (default)"
            - "envelope offset == 0 (default)"
            - "envelope total_count == 1"
            - "envelope has_more == false"

  # ===========================================================================
