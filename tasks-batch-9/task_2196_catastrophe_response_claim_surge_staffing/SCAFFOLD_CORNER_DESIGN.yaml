            - call: "POST /claims"
              payload: { policy_number: "POL-235B", loss_state: "FL", loss_date_utc: "2026-07-30T00:00:00.000Z", reported_loss_amount: 120000, coverage_lines: [{ coverage_code: "DWELLING", limit_amount: 400000, deductible_amount: 5000, estimated_damage_amount: 150000 }], event_id: "${ev}", access_status: "ACCESSIBLE" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { cl_b: $.data.id }
            - call: "POST /claims/${cl_b}/triage"
