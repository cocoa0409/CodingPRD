            - *b_el_qi1
            - *b_publish
            - *b_plan
            - *b_scope
            - *b_app
            - *b_submit
            - *b_begin
            - *b_ev1
            - *b_appv2
            - *b_ev2
            - *b_appv3
            - *b_ev3
            - *b_appv4
            - *b_ev4
            - *b_acc1
            - call: "POST /accreditation/evidence-items/${ev2}/reject"
              payload: { review_note: "stale document" }
              as: AccreditationOfficer
            - *b_acc3
            - *b_acc4
          trigger:
