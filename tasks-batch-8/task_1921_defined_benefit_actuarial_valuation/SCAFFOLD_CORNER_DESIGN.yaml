        payload: {}
        as: PlanAdmin
        captures:
          plan_v: $.data.version
      - call: POST /v1/valuation-runs/${run_id}/certify
        payload:
          expected_plan_version: ${plan_v}
        as: SeniorActuary
        as_user_id: ${act_rev}
      trigger:
      - call: POST /v1/valuation-runs/${run_id}/void
        payload: {}
        as: Actuary
        as_user_id: ${act_prep}
        captures:
          err: $.data.error_id
      assert:
      - response error_id == ERR_INVALID_STATE with http 409
      - ValuationRun.${run_id}.status remains CERTIFIED
  - name: certify_twice_is_invalid_state
    claim_type: idempotency
    grounds:
    - state_machines.ValuationRun.transitions.COMPUTED_to_CERTIFIED
    - errors[ERR_INVALID_STATE]
