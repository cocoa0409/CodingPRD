  - rule_id: non_linear_state_machine
    instances:

      - name: appointment_clearance_dimension_blocks_and_reclears_independently
        grounds:
          - state_machines.Appointment.clearance_status
          - state_machines.Appointment.clearance_status.PENDING_CLEARED_to_BLOCKED
          - state_machines.Appointment.clearance_status.BLOCKED_to_CLEARED
          - state_machines.IntakeForm.SUBMITTED_to_SCREENED_FLAGGED
          - state_machines.IntakeForm.SCREENED_FLAGGED_to_OVERRIDDEN
          - entities.Appointment.fields.clearance_block_reason
          - validations[priority=10]
          - endpoints.POST_/intake-forms/{id}/screen
          - endpoints.POST_/intake-forms/{id}/override
        distinguishing_aspect: |
          Parallel shape: schedule_status stays pinned at CONFIRMED across three
          clearance_status changes (CLEARED -> BLOCKED -> CLEARED) driven entirely
          by a DIFFERENT entity's state machine (a newer IntakeForm reaching
          SCREENED_FLAGGED and then OVERRIDDEN). Nothing about the appointment
          itself is triggered, and check-in is refused mid-way with
          ERR_APPOINTMENT_NOT_CLEARED even though the schedule dimension is in a
          perfectly legal pre-check-in state. The other instance in this rule is
          a CYCLIC machine (licence review loop), not a parallel one.
