        Entity pair (Dispute, AuditVisit) reached through a third entity: the request names a
        ScoredItem, but the gate is the state of that item's grandparent visit. A SUBMITTED visit is
        still rescoreable, so scores are not yet appealable - the appeal window opens only at
        FINALIZED. The same payload must flip from 409 to 201 with no change to the ScoredItem.
