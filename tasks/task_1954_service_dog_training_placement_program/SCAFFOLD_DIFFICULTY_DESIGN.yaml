        grounds:
          - calculations.pat_scoring
          - state_machines.PublicAccessTest.SCHEDULED_to_SCORED_FAIL
        distinguishing_aspect: "Exact-precision boundary on the official_score metric via POST /api/public-access-tests/{id}/score (a different metric and endpoint than raised_cents): section sums 16/18, 8/12, 5/6 round per-section to 88.9/66.7/83.3 -> official 79.6 < 80.0 fails, although the forbidden sum-then-round order (29/36 = 80.6) would pass."
