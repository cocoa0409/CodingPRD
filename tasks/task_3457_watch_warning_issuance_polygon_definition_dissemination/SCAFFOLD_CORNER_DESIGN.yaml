              as_user_id: "${cu_fc}"
          assert:
            - "the first issue fails 422 ERR_ISSUANCE_CRITERIA_NOT_MET (wind 50 < 58) and the product stays DRAFT at version 1"
            - "the PUT returns version 2 and flips StormEvent.${cu_storm}.status to TRACKING"
            - "the second issue with the SAME expected_product_version 1 succeeds (the failed first attempt bumped nothing): the criteria now read wind 60"
            - "Product.${cu_w} is ISSUED with issued_at == 2026-09-01T10:00:00Z"

