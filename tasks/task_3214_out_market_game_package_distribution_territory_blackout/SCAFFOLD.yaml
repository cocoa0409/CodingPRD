      - { name: account_id, type: string, source: system, description: "FK -> Account.id; complainant account" }
      - { name: subscription_id, type: string, source: input, description: "FK -> Subscription.id; subscription the complaint concerns" }
      - { name: game_id, type: string, source: input, description: "FK -> Game.id; game the complaint concerns" }
