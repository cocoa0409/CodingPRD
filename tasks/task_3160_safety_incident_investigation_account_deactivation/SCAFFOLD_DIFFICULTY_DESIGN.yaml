              captures: { policy_id: $.data.id, policy_v: $.data.version }
            - call: "POST /safety/accounts"
              payload: { account_type: "DRIVER", home_region_code: "R1", legal_name: "Rafa Cordero", contact_email: "rafa.cordero@example.com" }
              as: PlatformAdmin
              captures: { acct_x: $.data.id }
            - call: "POST /safety/accounts"
