              as: OpsAdmin
              captures: { prod: $.data.id }
            - call: "POST /branches"
              payload: { branch_code: "BR-BOI", region_code: "PNW", species_preference: "DOUGLAS_FIR", target_stock_mbf: 500, activity_score: 90 }
              as: OpsAdmin
              captures: { br: $.data.id }
            - call: "POST /builders"
              payload: { legal_name: "Treeline Builders", lien_rights_state_code: "ID" }
              as: CreditManager
              captures: { b: $.data.id }
            - call: "POST /builders/${b}/credit-review"
              payload: { decision: "APPROVE", credit_limit_cents: 9000000 }
              as: CreditManager
            - call: "POST /builders/${b}/jobs"
              payload: { job_name: "Ridgeview Lot 7", access_window_start: "2026-09-01T00:00:00Z", access_window_end: "2026-12-31T23:59:59Z", job_exposure_cap_cents: 100000000 }
              as: AccountManager
              captures: { job: $.data.id }
            - call: "GET /builders/${b}"
              payload: {}
              as: AccountManager
              captures: { b_v: $.data.version }
          trigger:
            - call: "POST /jobs/${job}/sales-orders"
              payload: { branch_id: "${br}", pricing_week_mode: "LOCK_AT_ACCEPT", lines: [{ product_id: "${prod}", qty_mbf: 1, price_basis: "FIXED", fixed_unit_price_cents_per_mbf: 100000 }], expected_builder_version: "${b_v}" }
              as: AccountManager
              captures: { o1: $.data.id }
            - call: "POST /jobs/${job}/sales-orders"
              payload: { branch_id: "${br}", pricing_week_mode: "LOCK_AT_ACCEPT", lines: [{ product_id: "${prod}", qty_mbf: 2, price_basis: "FIXED", fixed_unit_price_cents_per_mbf: 100000 }], expected_builder_version: "${b_v}" }
              as: AccountManager
              captures: { err: $.data.error_id }
            - call: "GET /builders/${b}"
              payload: {}
              as: AccountManager
              captures: { b_v3: $.data.version }
            - call: "POST /jobs/${job}/sales-orders"
              payload: { branch_id: "${br}", pricing_week_mode: "LOCK_AT_ACCEPT", lines: [{ product_id: "${prod}", qty_mbf: 2, price_basis: "FIXED", fixed_unit_price_cents_per_mbf: 100000 }], expected_builder_version: "${b_v3}" }
              as: AccountManager
              captures: { o2: $.data.id }
          assert:
            - "order A created: SalesOrder.${o1} exists with order_status DRAFT"
            - "order B with stale version: the response status is 412 and error_id == ERR_STALE_VERSION"
            - "order B retry with fresh version succeeds: SalesOrder.${o2} exists with order_status DRAFT"
            - "Builder.${b}.version advanced by exactly 1 per successful order create"

