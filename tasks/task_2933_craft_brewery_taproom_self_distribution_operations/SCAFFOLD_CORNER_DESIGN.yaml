          assert:
            - "Both calls return 200"
            - "After the first call Tank.${tank_id}.status == OUT_OF_SERVICE"
            - "After the second call Tank.${tank_id}.status == IDLE"
            - "Tank.${tank_id}.cip_cycle_count == 0 and last_cip_utc is null across both calls"
            - "Tank.${tank_id}.occupying_batch_id is null"
            - "Tank.${tank_id}.version incremented twice"

