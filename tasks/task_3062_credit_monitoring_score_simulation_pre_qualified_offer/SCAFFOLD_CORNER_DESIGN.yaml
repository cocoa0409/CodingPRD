            - *k_item_loan
            - *k_item_act
            - *k_tier_good
            - *k_tier_act
            - *k_program_loan
            - *k_program_act
          trigger:
            - call: "GET /credit/catalog/items/${item_id}"
              payload: { card_balance_cents: 500000 }
              as: Consumer
              captures: { be_a: $.data.fee_breakeven_months }
            - call: "GET /credit/catalog/items/${item_id}"
              payload: {}
              as: Consumer
              captures: { be_b: $.data.fee_breakeven_months }
          assert:
            - "with a 500000-cent balance the breakeven is 2 months for ${be_a}"
            - "with no balance the breakeven is null for ${be_b}, not 0 and not an error"
            - "both reads return status 200"

