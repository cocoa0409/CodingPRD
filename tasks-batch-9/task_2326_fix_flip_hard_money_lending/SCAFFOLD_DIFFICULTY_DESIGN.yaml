      - name: extension_gate_reads_exit_watch_flag_derived_from_child_milestones
        grounds:
          - calculations.exit_monitoring
          - calculations.extension_repricing
          - entities.Loan.fields.exit_watch_flag
          - entities.Loan.fields.days_on_market
          - validations[priority=25]
          - validations[priority=24]
          - errors[ERR_EXTENSION_BLOCKED_BY_EXIT_WATCH]
          - errors[ERR_EXTENSION_LIMIT_REACHED]
        distinguishing_aspect: |
          Whether an extension may be granted depends on ExitMilestone child rows plus the
          clock, never on the Loan's own fields: the SAME extension request succeeds at clock
          2026-11-30 (days_on_market 90, strict >, flag false), is refused at 2026-12-01
          (days 91, flag true), and succeeds again the moment a PRICE_REDUCED milestone is
          filed even though days_on_market is STILL 91 — repricing clears the flag without
          resetting the clock. The fourth attempt then hits the separate MAX_EXTENSIONS gate.
        test_recipe:
          setup:
            - "TIER_A sponsor b1; loan closed 2026-08-10, term 9 months (maturity 2027-05-10), funded 13,151,375, note rate 1150 bps"
            - "no draws are funded and no accrual is filed, so funded_principal_cents stays 13,151,375 and the fee base never moves"
            - "one LISTED milestone effective 2026-09-01 at 32,000,000 and no PRICE_REDUCED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lending/borrowers"
              payload: { legal_entity_name: "Ridgeline Rehab LLC", entity_type: "LLC", guarantor_name: "D. Ruiz", flips_last_24mo: 6, flips_lifetime: 8, credit_score: 760, liquidity_cents: 30000000, prior_default_count: 0, declared_target_loan_cents: 30000000 }
              as: LoanOfficer
              captures: { b1: $.data.id }
            - call: "POST /lending/borrowers/${b1}/guarantee"
              payload: { guarantor_name: "D. Ruiz", signature_ref: "esign-b1", effective_date: "2026-08-10" }
