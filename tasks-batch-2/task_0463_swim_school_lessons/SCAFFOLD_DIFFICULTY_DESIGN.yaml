        distinguishing_aspect: "Conserved quantity = redeemable makeup-credit balance (a DIFFERENT quantity than seats): count(MakeupCredit in {ISSUED} for the student) is restored to its pre-redeem value after redeem (booking) then cancel; redeem followed by its compensating cancel leaves the ISSUED balance at 1 with no drift."
