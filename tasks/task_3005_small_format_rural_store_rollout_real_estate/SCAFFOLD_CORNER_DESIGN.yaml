            - call: "POST /rollouts/${rid}/activate"
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/trade-areas"
              payload: { rollout_program_id: "${rid}", name: "A", drive_time_minutes: 25, household_count: 800, median_household_income_cents: 4500000, grocery_gap_pct: 15 }
              as: PROGRAM_ADMIN
              captures: { taid: $.data.id, ta_v0: $.data.version }
            - call: "POST /rollouts/trade-areas/${taid}/screen"
              payload: { rollout_program_id: "${rid}", expected_trade_area_version: "${ta_v0}" }
              as: PROGRAM_ADMIN
          trigger:
            - call: "POST /rollouts/trade-areas/${taid}/screen"
              payload: { rollout_program_id: "${rid}", expected_trade_area_version: "${ta_v0}" }
              as: PROGRAM_ADMIN
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION (412): the first screen bumped TradeArea.version, so the replayed expected version is stale"
            - "TradeArea.${taid}.status remains REJECTED and screening_count == 1 (failed OCC does not consume a screening)"

      - name: occ_stale_store_version_on_format_select
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[format-select-stale-store]
        distinguishing_aspect: "A second select-format with the original expected_store_version after a volume PATCH bumped the store version is rejected 412 — OCC guards the store, not the trade area."
        test_recipe:
          setup: ["ACTIVE program; store S created; volume_index PATCHed (version advanced)"]
          setup_api_calls:
            - call: "POST /rollouts"
              payload: { name: "P", fiscal_year: 2027, new_build_capital_budget_cents: 2000000000 }
              as: PROGRAM_ADMIN
              captures: { rid: $.data.id }
            - call: "POST /rollouts/${rid}/activate"
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/trade-areas"
              payload: { rollout_program_id: "${rid}", name: "C", drive_time_minutes: 20, household_count: 1000, median_household_income_cents: 4500000, grocery_gap_pct: 20 }
              as: PROGRAM_ADMIN
              captures: { taid: $.data.id, ta_v0: $.data.version }
            - call: "POST /rollouts/trade-areas/${taid}/screen"
              payload: { rollout_program_id: "${rid}", expected_trade_area_version: "${ta_v0}" }
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/stores"
              payload: { rollout_program_id: "${rid}", trade_area_id: "${taid}", name: "S" }
              as: PROGRAM_ADMIN
              captures: { sid: $.data.id, s_v0: $.data.version }
            - call: "PATCH /rollouts/stores/${sid}"
              payload: { rollout_program_id: "${rid}", rollout_program_id: "${rid}", volume_index: 1.2 }
              as: NETWORK_PLANNER
          trigger:
            - call: "POST /rollouts/stores/${sid}/select-format"
              payload: { rollout_program_id: "${rid}", expected_store_version: "${s_v0}" }
              as: REAL_ESTATE_MANAGER
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION (412): PATCH bumped Store.version past the captured one"

      - name: cascade_opening_plan_supersede_on_new_study
        claim_type: cascading_side_effects
        grounds:
          - state_machines.CannibalizationStudy.FINAL_to_SUPERSEDED
        distinguishing_aspect: "Creating a second study for the same store supersedes the first FINAL study — capital gating re-targets the newest FINAL study only."
        test_recipe:
          setup: ["ACTIVE program; EXISTING X (200000000); store S DG_FRESH; study CS1 created and FINAL (X@0.20 PROCEED)"]
          setup_api_calls:
            - call: "POST /rollouts"
              payload: { name: "P", fiscal_year: 2027, new_build_capital_budget_cents: 2000000000 }
              as: PROGRAM_ADMIN
              captures: { rid: $.data.id }
            - call: "POST /rollouts/${rid}/activate"
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/trade-areas"
              payload: { rollout_program_id: "${rid}", name: "T0", drive_time_minutes: 12, household_count: 1000, median_household_income_cents: 4000000, grocery_gap_pct: 20 }
              as: PROGRAM_ADMIN
              captures: { t0: $.data.id }
            - call: "POST /rollouts/stores"
              payload: { rollout_program_id: "${rid}", trade_area_id: "${t0}", name: "X", is_existing: true, format_type: "TRADITIONAL", open_year_sales_cents: 200000000 }
              as: PROGRAM_ADMIN
              captures: { ex: $.data.id }
            - call: "POST /rollouts/trade-areas"
              payload: { rollout_program_id: "${rid}", name: "F", drive_time_minutes: 18, household_count: 2000, median_household_income_cents: 4500000, grocery_gap_pct: 30 }
              as: PROGRAM_ADMIN
              captures: { taf: $.data.id, taf_v0: $.data.version }
            - call: "POST /rollouts/trade-areas/${taf}/screen"
              payload: { rollout_program_id: "${rid}", expected_trade_area_version: "${taf_v0}" }
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/stores"
              payload: { rollout_program_id: "${rid}", trade_area_id: "${taf}", name: "S" }
              as: PROGRAM_ADMIN
              captures: { sid: $.data.id, s_v0: $.data.version }
            - call: "POST /rollouts/stores/${sid}/select-format"
              payload: { rollout_program_id: "${rid}", expected_store_version: "${s_v0}" }
              as: REAL_ESTATE_MANAGER
            - call: "POST /rollouts/cannibalization-studies"
              payload: { rollout_program_id: "${rid}", store_id: "${sid}", overlap_entries: [ { existing_store_id: "${ex}", overlap_weight: 0.20 } ] }
              as: FINANCE_ANALYST
              captures: { cs1: $.data.id }
            - call: "POST /rollouts/cannibalization-studies/${cs1}/finalize"
              payload: { rollout_program_id: "${rid}", rollout_program_id: "${rid}" }
              as: FINANCE_ANALYST
          trigger:
            - call: "POST /rollouts/cannibalization-studies"
              payload: { rollout_program_id: "${rid}", store_id: "${sid}", overlap_entries: [ { existing_store_id: "${ex}", overlap_weight: 0.30 } ] }
              as: FINANCE_ANALYST
              captures: { cs2: $.data.id }
          assert:
            - "CannibalizationStudy.${cs1}.status == SUPERSEDED"
            - "CannibalizationStudy.${cs2}.status == DRAFT with transfer_pct == 16.48 (24000000/145600000) and recommendation == BLOCKED (aggregate > 15)"
            - "a NEW_BUILD submit now fails ERR_STUDY_NOT_FINAL because the only FINAL study was superseded"

      - name: cannibalization_coefficient_change_rescores
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.cannibalization_transfer
        distinguishing_aspect: "Rate trigger on a configurable threshold input: patching the program coefficient from 0.40 to 0.60 while ACTIVE changes the same overlap data (X@0.30 on 200000000) from transfer_pct 16.48 to 24.73 — the recommendation banding re-derives from the new rate."
        test_recipe:
          setup: ["ACTIVE program; EXISTING X (200000000); store S DG_FRESH (145600000)"]
          setup_api_calls:
            - call: "POST /rollouts"
              payload: { name: "P", fiscal_year: 2027, new_build_capital_budget_cents: 2000000000 }
              as: PROGRAM_ADMIN
              captures: { rid: $.data.id }
            - call: "POST /rollouts/${rid}/activate"
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/trade-areas"
              payload: { rollout_program_id: "${rid}", name: "T0", drive_time_minutes: 12, household_count: 1000, median_household_income_cents: 4000000, grocery_gap_pct: 20 }
              as: PROGRAM_ADMIN
              captures: { t0: $.data.id }
            - call: "POST /rollouts/stores"
              payload: { rollout_program_id: "${rid}", trade_area_id: "${t0}", name: "X", is_existing: true, format_type: "TRADITIONAL", open_year_sales_cents: 200000000 }
              as: PROGRAM_ADMIN
              captures: { ex: $.data.id }
            - call: "POST /rollouts/trade-areas"
              payload: { rollout_program_id: "${rid}", name: "F", drive_time_minutes: 18, household_count: 2000, median_household_income_cents: 4500000, grocery_gap_pct: 30 }
              as: PROGRAM_ADMIN
              captures: { taf: $.data.id, taf_v0: $.data.version }
            - call: "POST /rollouts/trade-areas/${taf}/screen"
              payload: { rollout_program_id: "${rid}", expected_trade_area_version: "${taf_v0}" }
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/stores"
              payload: { rollout_program_id: "${rid}", trade_area_id: "${taf}", name: "S" }
              as: PROGRAM_ADMIN
              captures: { sid: $.data.id, s_v0: $.data.version }
            - call: "POST /rollouts/stores/${sid}/select-format"
              payload: { rollout_program_id: "${rid}", expected_store_version: "${s_v0}" }
              as: REAL_ESTATE_MANAGER
            - call: "POST /rollouts/cannibalization-studies"
              payload: { rollout_program_id: "${rid}", store_id: "${sid}", overlap_entries: [ { existing_store_id: "${ex}", overlap_weight: 0.30 } ] }
              as: FINANCE_ANALYST
              captures: { cs1: $.data.id }
          trigger:
            - call: "PATCH /rollouts/${rid}/settings"
              payload: { cannibalization_coefficient: 0.6 }
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/cannibalization-studies"
              payload: { rollout_program_id: "${rid}", store_id: "${sid}", overlap_entries: [ { existing_store_id: "${ex}", overlap_weight: 0.30 } ] }
              as: FINANCE_ANALYST
              captures: { cs2: $.data.id }
          assert:
            - "at coefficient 0.40: CannibalizationStudy.${cs1}.transfer_pct == 16.48 and recommendation == BLOCKED (24000000/145600000 > 15)"
            - "at coefficient 0.60: CannibalizationStudy.${cs2}.transfer_pct == 24.73 (36000000/145600000) and recommendation == BLOCKED; the same data yields observably different percentages as the rate threshold input moves"
            - "CannibalizationStudy.${cs1}.status == SUPERSEDED"

      - name: derived_available_capital_reconciliation
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.capital_commitment_reconciliation
        distinguishing_aspect: "stub — committed/available reconciliation asserted by the §1.8 invariant instance."
        excluded_because:
          difficulty_instance: compensating_invariant / capital_commit_release_invariant
          rationale: "Asserted as the invariant path of the named §1.8 instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_after_cascade
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "Consistency model is immediate: the GET following a mutation in the SAME test flow reflects all cascaded side effects (assignment supersede frees the DC slot synchronously) — no reconciliation lag."
        test_recipe:
          setup: ["ACTIVE program; store S (TRADITIONAL) assigned to DC D (capacity 2) then reassigned to DC D2"]
          setup_api_calls:
            - call: "POST /rollouts"
              payload: { name: "P", fiscal_year: 2027, new_build_capital_budget_cents: 2000000000 }
              as: PROGRAM_ADMIN
              captures: { rid: $.data.id }
            - call: "POST /rollouts/${rid}/activate"
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/trade-areas"
              payload: { rollout_program_id: "${rid}", name: "C", drive_time_minutes: 20, household_count: 1000, median_household_income_cents: 4500000, grocery_gap_pct: 20 }
              as: PROGRAM_ADMIN
              captures: { taid: $.data.id, ta_v0: $.data.version }
            - call: "POST /rollouts/trade-areas/${taid}/screen"
              payload: { rollout_program_id: "${rid}", expected_trade_area_version: "${ta_v0}" }
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/stores"
              payload: { rollout_program_id: "${rid}", trade_area_id: "${taid}", name: "S" }
              as: PROGRAM_ADMIN
              captures: { sid: $.data.id, s_v0: $.data.version }
            - call: "POST /rollouts/stores/${sid}/select-format"
              payload: { rollout_program_id: "${rid}", expected_store_version: "${s_v0}" }
              as: REAL_ESTATE_MANAGER
            - call: "POST /rollouts/distribution-centers"
              payload: { rollout_program_id: "${rid}", name: "D", store_capacity: 2 }
              as: NETWORK_PLANNER
              captures: { dc1: $.data.id }
            - call: "POST /rollouts/distribution-centers"
              payload: { rollout_program_id: "${rid}", name: "D2", store_capacity: 2 }
              as: NETWORK_PLANNER
              captures: { dc2: $.data.id }
            - call: "POST /rollouts/dc-assignments"
              payload: { store_id: "${sid}", rollout_program_id: "${rid}", distribution_center_id: "${dc1}", stem_miles: 90, deliveries_per_week: 1 }
              as: NETWORK_PLANNER
          trigger:
            - call: "POST /rollouts/dc-assignments"
              payload: { store_id: "${sid}", rollout_program_id: "${rid}", distribution_center_id: "${dc2}", stem_miles: 70, deliveries_per_week: 1 }
              as: NETWORK_PLANNER
            - call: "GET /rollouts/distribution-centers"
              as: NETWORK_PLANNER
          assert:
            - "immediately after reassignment: D.assigned_store_count == 0 and D2.assigned_store_count == 1 in the very next GET (no lag)"
