              as_user_id: "planner-1"
              captures: { gap1_error: $.data.error_id }
            - call: "POST /otb/localization-overlays"
              payload: { category_plan_id: "${plan_id}", store_cluster_id: "${cluster_id}", overlay_type: "CLIMATE", effective_start: "2027-03-17T00:00:00Z", effective_end: "2027-03-26T00:00:00Z", unit_multiplier_bps: 10800 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { gap7_error: $.data.error_id }
            - call: "POST /otb/localization-overlays"
              payload: { category_plan_id: "${plan_id}", store_cluster_id: "${cluster_id}", overlay_type: "CLIMATE", effective_start: "2027-03-18T00:00:00Z", effective_end: "2027-03-27T00:00:00Z", unit_multiplier_bps: 10800 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { ov4: $.data.id }
            - call: "POST /otb/localization-overlays"
              payload: { category_plan_id: "${plan_id}", store_cluster_id: "${cluster_id}", overlay_type: "CLIMATE", effective_start: "2027-03-28T00:00:00Z", effective_end: "2027-03-31T00:00:00Z", unit_multiplier_bps: 10800 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { draft_block_error: $.data.error_id }
            - call: "POST /otb/localization-overlays"
              payload: { category_plan_id: "${plan_id}", store_cluster_id: "${cluster_id}", overlay_type: "DEMOGRAPHIC", effective_start: "2027-03-01T00:00:00Z", effective_end: "2027-03-10T00:00:00Z", unit_multiplier_bps: 10500 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { ov5: $.data.id }
            - call: "POST /otb/localization-overlays/${ov1}/activate"
              payload: {}
              as: PlanningDirector
              as_user_id: "director-1"
            - call: "POST /otb/localization-overlays/${ov5}/activate"
              payload: {}
              as: PlanningDirector
              as_user_id: "director-1"
          assert:
            - "O1 CLIMATE [2027-03-01, 2027-03-10] is accepted with HTTP 201: LocalizationOverlay.${ov1}.status == DRAFT and unit_multiplier_bps == 11000"
            - "O2 CLIMATE [2027-03-11, 2027-03-20] returns HTTP 409 with ${gap1_error} == ERR_OVERLAY_WINDOW_CONFLICT even though it does not overlap O1 at all: the windows are disjoint but separated by only one day, and the rule demands more than eight days of clear air (2027-03-11 <= 2027-03-10 + 7 days holds)"
            - "O3 CLIMATE [2027-03-17, 2027-03-26] returns HTTP 409 with ${gap7_error} == ERR_OVERLAY_WINDOW_CONFLICT: its start is exactly O1.effective_end + 7 days, and the comparison is inclusive (<=), so a gap of exactly the buffer length is still a conflict"
            - "O4 CLIMATE [2027-03-18, 2027-03-27] is accepted with HTTP 201: 2027-03-18 > 2027-03-10 + 7 days by one day, so eight days of separation clears the buffer. O3 and O4 differ by a single day on one endpoint and land on opposite sides of the rule"
            - "O6 CLIMATE [2027-03-28, 2027-03-31] returns HTTP 409 with ${draft_block_error} == ERR_OVERLAY_WINDOW_CONFLICT, and the only row it conflicts with is ${ov4}, which is still DRAFT and was never activated: DRAFT rows reserve the calendar exactly as ACTIVE rows do"
            - "O5 DEMOGRAPHIC [2027-03-01, 2027-03-10] is accepted with HTTP 201 despite occupying byte-identical days to O1: the resource is partitioned by overlay_type, so a full overlap across types is legal while a one-day gap within a type is not"
            - "before any activation AssortmentItem.${item_n}.effective_overlay_multiplier_bps == 10000 and sell_through_bps == 6325 (NEW_ITEM_BASIS: BETTER benchmark 5500 * sales_index 11500 * 10000 / 1e8), because DRAFT overlays are excluded from calculations.overlay_effective_multiplier even when their windows contain the clock"
            - "activating O1 recomputes the adopted item: LocalizationOverlay.${ov1}.status == ACTIVE, AssortmentItem.${item_n}.effective_overlay_multiplier_bps == 11000 and sell_through_bps == 6958 (5500 * 11500 * 11000 / 1e8 = 6957.5, rounded half up)"
            - "activating O5 stacks in the pinned CLIMATE -> DEMOGRAPHIC order with a round after each step: effective_overlay_multiplier_bps == 11550 (10000 -> 11000 -> round(11000 * 10500 / 10000)) and sell_through_bps == 7305 (5500 * 11500 * 11550 / 1e8 = 7305.375)"
            - "O4 stays DRAFT and never affects the item even though its window is in the same month: it is excluded from the multiplier both because its status is DRAFT and because 2027-03-05 lies outside [2027-03-18, 2027-03-27]"

  - rule_id: compensating_invariant
    instances:
      - name: plan_month_otb_dollar_conservation
        grounds:
          - calculations.plan_month_open_to_buy
          - state_machines.ReceiptCommitment.COMMITTED_to_CANCELLED
          - state_machines.ReceiptCommitment.PARTIALLY_RECEIVED_flow
          - entities.PlanMonth.fields.otb_open_cents
          - entities.ReceiptCommitment.fields.open_cost_cents
        distinguishing_aspect: |
          The conserved quantity is MONEY in integer cents on a single PlanMonth: the identity
          otb_open_cents + otb_committed_cents + otb_received_cents == otb_planned_cents must hold
          after every write, with no rounding slack because every term is a product of integers. The
          test walks a full round trip - propose, commit, ship, partially receive, cancel - so the
          same dollars move open -> committed -> received and then partly back to open, and it pins
          the two non-obvious steps: a receipt moves cents between two subtracted buckets and must
          leave otb_open_cents untouched, and a cancellation after a partial receipt must release
          only the unreceived remainder, never the whole commitment.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "the canonical spine with CategoryPlan SPRING 2027 APPROVED and a single PlanMonth M1 LOCKED_PLAN whose otb_planned_cents and otb_open_cents are both 18,200,000"
            - "Vendor Aurora Mills AUTHORIZED with an ACTIVE DRSS authorization and cancel_cutoff_days 21"
            - "one CARRYOVER AssortmentItem W on OP1, status PROPOSED, unit_cost_cents 2600"
          setup_api_calls:
            - call: "POST /otb/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /otb/departments"
              payload: { name: "Womens Apparel", code: "WAPP", fiscal_year: 2027, sales_target_cents: 500000000, margin_target_bps: 5600, turn_target_x100: 320 }
              as: MerchOpsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /otb/categories"
              payload: { department_id: "${dept_id}", name: "Dresses", code: "DRSS", role: "DESTINATION", sales_share_bps: 3000 }
              as: MerchOpsAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /otb/store-clusters"
              payload: { name: "Cold-A", climate_zone: "COLD", demographic_index_bps: 10500, volume_tier: "A", store_count: 40, sales_index_bps: 11500 }
              as: MerchOpsAdmin
              captures: { cluster_id: $.data.id }
            - call: "POST /otb/vendors"
              payload: { name: "Aurora Mills", code: "AURM", lead_time_days: 45, weekly_unit_capacity: 12000, min_order_units: 200, cancel_cutoff_days: 21 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /otb/vendors/${vendor_id}/status"
              payload: { status: "AUTHORIZED" }
              as: MerchOpsAdmin
            - call: "POST /otb/vendor-authorizations"
              payload: { vendor_id: "${vendor_id}", category_id: "${cat_id}", max_open_units: 40000 }
              as: MerchOpsAdmin
            - call: "POST /otb/category-plans"
              payload: { category_id: "${cat_id}", season_code: "SPRING", fiscal_year: 2027, planned_sales_cents: 150000000, planned_margin_bps: 5500, planned_turn_x100: 320 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { plan_id: $.data.id }
            - call: "POST /otb/plan-months"
              payload: { category_plan_id: "${plan_id}", month_index: 1, fiscal_month_label: "2027-03", first_receipt_date: "2027-03-05T00:00:00Z", bom_inventory_cents: 20000000, planned_sales_cents: 30000000, planned_markdown_cents: 2000000, planned_eom_cents: 22000000 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { m1_id: $.data.id }
            - call: "POST /otb/option-plans"
              payload: { category_plan_id: "${plan_id}", store_cluster_id: "${cluster_id}", tier: "BETTER", breadth_target: 14, depth_units_per_option: 6, assumed_unit_cost_cents: 2400 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { op1_id: $.data.id }
            - call: "PUT /otb/option-plans/${op1_id}/size-curve"
              payload: { cells: [ { size_label: "OS", size_sort_order: 1, pct_bps: 10000 } ] }
              as: MerchandisePlanner
              as_user_id: "planner-1"
            - call: "POST /otb/category-plans/${plan_id}/submit"
              payload: { submission_note: "v1" }
              as: MerchandisePlanner
              as_user_id: "planner-1"
            - call: "POST /otb/category-plans/${plan_id}/approve"
              payload: { approval_note: "ok" }
              as: PlanningDirector
              as_user_id: "director-1"
            - call: "POST /otb/assortment-items"
              payload: { option_plan_id: "${op1_id}", vendor_id: "${vendor_id}", sku_code: "DRSS-CARRY-W", color_code: "NAVY", lifecycle_stage: "CARRYOVER", unit_cost_cents: 2600, retail_price_cents: 6900, prior_season_sell_through_bps: 7100 }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { item_w: $.data.id }
            - call: "GET /otb/plan-months/${m1_id}"
              payload: {}
              as: CategoryBuyer
              captures: { m1_v: $.data.version }
            - call: "POST /otb/receipt-commitments"
              payload: { plan_month_id: "${m1_id}", assortment_item_id: "${item_w}", vendor_id: "${vendor_id}", units: 7000, unit_cost_cents: 2600, ship_window_start: "2027-03-05T00:00:00Z", ship_window_end: "2027-03-19T00:00:00Z", expected_plan_month_version: "${m1_v}" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { rc_id: $.data.id }
          trigger:
            - call: "POST /otb/receipt-commitments/${rc_id}/commit"
              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
            - call: "POST /otb/receipt-commitments/${rc_id}/ship"
              payload: {}
              as: VendorRep
              as_user_id: "${vendor_id}"
            - call: "POST /otb/receipt-commitments/${rc_id}/receipts"
              payload: { received_units_delta: 3000 }
              as: VendorRep
              as_user_id: "${vendor_id}"
            - call: "POST /otb/receipt-commitments/${rc_id}/cancel"
              payload: { cancel_reason: "vendor quality hold on the balance" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
          assert:
            - "state 0, after the PROPOSED create: PlanMonth.${m1_id}.otb_planned_cents == 18200000, otb_open_cents == 18200000, otb_committed_cents == 0, otb_received_cents == 0 - the identity holds as 18200000 + 0 + 0 == 18200000, and a PROPOSED commitment of exactly 18200000 has not yet moved any money"
            - "state 1, after the commit: otb_open_cents == 0, otb_committed_cents == 18200000, otb_received_cents == 0; the identity still sums to 18200000, and ReceiptCommitment.${rc_id}.open_cost_cents == 18200000 with received_cost_cents == 0"
            - "state 1 side effect on the plan: CategoryPlan.${plan_id}.open_ratio_bps == 0 and otb_posture == FROZEN, and AssortmentItem.${item_w}.status flipped PROPOSED -> DEFERRED"
            - "state 2, after the ship: the fulfillment dimension moved to SHIPPED and NOT one cent moved - otb_open_cents == 0, otb_committed_cents == 18200000, otb_received_cents == 0 unchanged, and PlanMonth.${m1_id}.version did not advance"
            - "state 3, after the 3000-unit partial receipt: ReceiptCommitment.${rc_id}.received_units == 3000, received_cost_cents == 7800000 (3000 * 2600), open_cost_cents == 10400000 (4000 * 2600), fulfillment_status == PARTIALLY_RECEIVED and commit_status still COMMITTED"
            - "state 3 on the month: otb_committed_cents == 10400000 and otb_received_cents == 7800000, and crucially otb_open_cents is STILL 0 - the receipt moved cents between two subtracted buckets, so 0 + 10400000 + 7800000 == 18200000 with no change to the open balance and no double count"
            - "state 4, after the cancel: ReceiptCommitment.${rc_id}.commit_status == CANCELLED with cancelled_units == 4000 (units 7000 minus received_units 3000), open_cost_cents == 0 and received_cost_cents still 7800000; fulfillment_status stays PARTIALLY_RECEIVED and does NOT become VOID because received_units > 0"
            - "state 4 releases only the unreceived remainder: otb_committed_cents == 0, otb_received_cents == 7800000 and otb_open_cents == 10400000, so the identity holds as 10400000 + 0 + 7800000 == 18200000. Releasing the whole 18200000 would break the identity by exactly the 7800000 already received"
            - "the compensation is complete on the derived fields too: CategoryPlan.${plan_id}.open_ratio_bps == 5714 (round_half_up of 10000 * 10400000 / 18200000) with otb_posture == OPEN, and cascade-A link 4 restored AssortmentItem.${item_w}.status to PROPOSED because its lifecycle_stage is CARRYOVER"
            - "no drift anywhere in the walk: at each of the five observed states the sum of the three buckets equals otb_planned_cents exactly, otb_planned_cents itself never changed from 18200000, and no bucket is ever negative"
            - "the ledger is reconstructible from the commitment rows: otb_committed_cents equals the sum of open_cost_cents over PROPOSED-and-COMMITTED commitments (0 at state 4) and otb_received_cents equals the sum of received_cost_cents over all non-withdrawn commitments (7800000 at state 4), so the month's derived fields are not an independent accumulator that can silently diverge"

      - name: option_slot_count_conservation
        grounds:
          - entities.OptionPlan.fields.option_slots_total
          - state_machines.AssortmentItem.PROPOSED_to_ADOPTED
          - state_machines.AssortmentItem.ADOPTED_to_CLOSED
          - validations[priority=29].ERR_NO_OPTION_SLOT
          - calculations.option_slot_capacity
        distinguishing_aspect: |
          A different conserved quantity in different units on a different entity: a COUNT of option
          slots on one OptionPlan, where option_slots_total == option_slots_assigned +
          option_slots_open must survive every adopt and close. Unlike the cent ledger, the total is
          pinned once at slotting time and must never be recomputed by later item traffic, and the
          released slot must be genuinely reusable rather than merely decremented - a fourth adopt
          after a close proves the freed capacity is real. Failed writes must leave the count exactly
          where it was.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "the canonical spine with CategoryPlan SPRING 2027 APPROVED, PlanMonth M1 LOCKED_PLAN and OptionPlan OP1 SLOTTED with option_slots_total 14, option_slots_assigned 0, option_slots_open 14, target_units_per_option 276"
