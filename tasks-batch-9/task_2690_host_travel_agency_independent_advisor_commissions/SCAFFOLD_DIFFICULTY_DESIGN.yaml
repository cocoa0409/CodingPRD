# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Nine Difficulty Rules x >= 2 differentiated instances each.
# Every numeric literal in every `assert:` below was computed by executing the
# corresponding §1.3 formula against the constants pinned in that instance's setup.
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: production_ytd_provisional_vs_final_diverge_by_tier
        grounds:
          - calculations.advisor_production_ytd
          - calculations.split_tier_selection
          - entities.Advisor.fields.production_ytd_provisional_cents
          - entities.Advisor.fields.production_ytd_final_cents
          - entities.Advisor.fields.split_tier_provisional
          - entities.Advisor.fields.split_tier_final
        distinguishing_aspect: |
          This instance divides the SAME two bookings by three simultaneous differences between
          the PROVISIONAL and FINAL variants — membership filter (SUBMITTED counts in
          PROVISIONAL, never in FINAL), amount source (expected_commission_cents vs
          received_commission_cents) and date key (travel_start_date vs
          commission_received_on) — and the divergence is large enough to place the advisor in
          two different split tiers at once (provisional 2, final 1).
        test_recipe:
          setup:
            - "One SplitSchedule with tiers 1/2/3 at floors 0 / 5000000 / 15000000 and advisor_pct 0.70 / 0.80 / 0.90."
            - "One Consortium (accrual 0.02, channel bonus 0.01) and two suppliers: Aurora Cruises (PREFERRED, co-member, base 0.10, preferred override 0.15, ceiling 0.18, cap 500000) and Meridian Air (STANDARD, no consortium, base 0.10, ceiling 0.20, cap 9000000)."
            - "One ACTIVE advisor in NY (trust_account_required false) who is a consortium member, with VERIFIED seller-of-travel, E&O, training and both supplier accreditations."
            - "Booking B1 through Aurora on the CONSORTIUM channel, gross 1000000, travel 2026-06-01..2026-06-10, CONFIRMED and short-paid 120000 on 2026-07-20."
            - "Booking B2 through Meridian Air on the SUPPLIER_DIRECT channel, gross 60000000, travel 2026-09-01..2026-09-10, still SUBMITTED."
            - "Logical clock at the 2026-08-01T00:00:00Z default, so both bookings fall in calendar year 2026."
          setup_api_calls:
            - call: "POST /host-agency/split-schedules"
              payload: { name: "Standard 2026", tiers: [{ tier_level: 1, min_production_cents: 0, advisor_pct: 0.70 }, { tier_level: 2, min_production_cents: 5000000, advisor_pct: 0.80 }, { tier_level: 3, min_production_cents: 15000000, advisor_pct: 0.90 }], platform_fee_tiers: [{ min_share_cents: 0, fee_pct: 0.05 }, { min_share_cents: 1000000, fee_pct: 0.03 }], chargeback_retention_pct: 0.10 }
              as: HostOperations
              captures: { sched_id: $.data.id }
            - call: "POST /host-agency/consortiums"
              payload: { name: "Voyager Alliance", membership_fee_cents: 5000000, marketing_fund_accrual_pct: 0.02, consortium_channel_bonus_pct: 0.01 }
              as: HostOperations
              captures: { cons_id: $.data.id }
            - call: "POST /host-agency/suppliers"
              payload: { name: "Aurora Cruises", accreditation_scheme: "CLIA", base_commission_pct: 0.10, preferred_override_commission_pct: 0.15, rate_ceiling_pct: 0.18, max_commission_per_booking_cents: 500000, remit_terms_days: 30, consortium_id: "${cons_id}", program_status: "PREFERRED", probation_chargeback_threshold: 2 }
              as: HostOperations
              captures: { sup_aurora_id: $.data.id }
            - call: "POST /host-agency/suppliers"
              payload: { name: "Meridian Air", accreditation_scheme: "ARC", base_commission_pct: 0.10, preferred_override_commission_pct: 0.12, rate_ceiling_pct: 0.20, max_commission_per_booking_cents: 9000000, remit_terms_days: 30 }
              as: HostOperations
              captures: { sup_meridian_id: $.data.id }
            - call: "POST /host-agency/advisors"
              payload: { legal_name: "Dana Reyes", email: "dana.reyes@example.com", seller_of_travel_state: "NY", consortium_id: "${cons_id}" }
              as: HostOperations
              captures: { adv_id: $.data.id, adv_v0: $.data.version }
            - call: "POST /host-agency/advisors/${adv_id}/agreements"
              payload: { split_schedule_id: "${sched_id}", effective_date: "2026-01-01", post_departure_advisor_pct: 0.50, expected_advisor_version: "${adv_v0}" }
              as: HostOperations
              captures: { agr_id: $.data.id }
            - call: "POST /host-agency/advisors/${adv_id}/credentials"
              payload: { credential_type: "SELLER_OF_TRAVEL", credential_number: "NY-SOT-40118", effective_on: "2026-01-01", expires_on: "2027-01-01", jurisdiction_state_code: "NY" }
              as: HostOperations
              captures: { cr_sot_id: $.data.id }
            - call: "POST /host-agency/advisors/${adv_id}/credentials"
              payload: { credential_type: "EO_POLICY", credential_number: "EO-99881", effective_on: "2026-01-01", expires_on: "2027-01-01", coverage_amount_cents: 100000000 }
              as: HostOperations
              captures: { cr_eo_id: $.data.id }
            - call: "POST /host-agency/advisors/${adv_id}/credentials"
              payload: { credential_type: "TRAINING_CERT", credential_number: "TRN-2026-A", effective_on: "2026-01-01", expires_on: "2027-01-01" }
              as: HostOperations
              captures: { cr_trn_id: $.data.id }
            - call: "POST /host-agency/advisors/${adv_id}/credentials"
              payload: { credential_type: "SUPPLIER_ACCREDITATION", credential_number: "CLIA-77801", effective_on: "2026-01-01", expires_on: "2027-01-01", supplier_id: "${sup_aurora_id}" }
              as: HostOperations
              captures: { cr_acc_aurora_id: $.data.id }
            - call: "POST /host-agency/advisors/${adv_id}/credentials"
              payload: { credential_type: "SUPPLIER_ACCREDITATION", credential_number: "ARC-33290", effective_on: "2026-01-01", expires_on: "2027-01-01", supplier_id: "${sup_meridian_id}" }
              as: HostOperations
              captures: { cr_acc_meridian_id: $.data.id }
            - call: "POST /host-agency/compliance-credentials/${cr_sot_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /host-agency/compliance-credentials/${cr_eo_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /host-agency/compliance-credentials/${cr_trn_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /host-agency/compliance-credentials/${cr_acc_aurora_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /host-agency/compliance-credentials/${cr_acc_meridian_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /host-agency/advisors/${adv_id}/activate"
              payload: {}
              as: HostOperations
            - call: "POST /host-agency/clients"
              payload: { owner_advisor_id: "${adv_id}", full_name: "Nadia Okoye", home_state_code: "NY", ownership_mode: "ADVISOR_OWNED", max_concurrent_trips: 4 }
              as: Advisor
              as_user_id: "${adv_id}"
              captures: { cli_id: $.data.id }
            - call: "POST /host-agency/bookings"
              payload: { advisor_id: "${adv_id}", supplier_id: "${sup_aurora_id}", client_id: "${cli_id}", channel: "CONSORTIUM", payment_method: "MERCHANT_DIRECT", gross_sale_cents: 1000000, deposit_amount_cents: 0, travel_start_date: "2026-06-01", travel_end_date: "2026-06-10" }
              as: Advisor
              as_user_id: "${adv_id}"
              captures: { bk1_id: $.data.id }
            - call: "POST /host-agency/bookings/${bk1_id}/confirm"
              payload: {}
              as: SupplierPortal
              as_user_id: "${sup_aurora_id}"
            - call: "POST /host-agency/bookings"
              payload: { advisor_id: "${adv_id}", supplier_id: "${sup_meridian_id}", client_id: "${cli_id}", channel: "SUPPLIER_DIRECT", payment_method: "MERCHANT_DIRECT", gross_sale_cents: 60000000, deposit_amount_cents: 0, travel_start_date: "2026-09-01", travel_end_date: "2026-09-10" }
              as: Advisor
              as_user_id: "${adv_id}"
              captures: { bk2_id: $.data.id }
          trigger:
            - call: "POST /host-agency/bookings/${bk1_id}/commission-receipt"
              payload: { amount_cents: 120000, received_on: "2026-07-20" }
              as: SupplierPortal
              as_user_id: "${sup_aurora_id}"
          assert:
            - "Booking.${bk1_id}.expected_commission_cents == 160000"
            - "Booking.${bk1_id}.received_commission_cents == 120000"
            - "Booking.${bk1_id}.shortfall_cents == 40000"
            - "Booking.${bk2_id}.expected_commission_cents == 6000000"
            - "Advisor.${adv_id}.production_ytd_provisional_cents == 6160000"
            - "Advisor.${adv_id}.production_ytd_final_cents == 120000"
            - "Advisor.${adv_id}.split_tier_provisional == 2"
            - "Advisor.${adv_id}.split_tier_final == 1"
            - "Advisor.${adv_id}.production_ytd_provisional_cents != Advisor.${adv_id}.production_ytd_final_cents"

      - name: chargeback_gross_reversal_vs_net_of_retention_diverge
        grounds:
          - calculations.cancellation_chargeback
          - calculations.statement_advisor_share_rollup
          - state_machines.Booking.RECEIVED_to_CHARGED_BACK
          - entities.Booking.fields.chargeback_amount_cents
          - entities.SplitSchedule.fields.chargeback_retention_pct
        distinguishing_aspect: |
          Two bookings carrying the IDENTICAL settled_share_cents of 112000 are cancelled with
          different cancellation_reason values and the chargeback diverges by exactly 11200
          cents (112000 GROSS_REVERSAL vs 100800 NET_OF_RETENTION); the variant selector here
          is a request field on the trigger call, not an entity state, which is what separates
          this instance from the production-basis dual variant above.
        test_recipe:
