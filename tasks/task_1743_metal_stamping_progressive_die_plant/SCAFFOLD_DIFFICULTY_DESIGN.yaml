        grounds:
          - calculations.coil_consumption_reconciliation
          - state_machines.SteelCoil.APPROVED_to_DEPLETED
        distinguishing_aspect: |
          Numeric threshold boundary: remaining_weight_kg reaching EXACTLY 0 triggers
          DEPLETED (== 0, not < 0); a remainder of 0.001 leaves the coil APPROVED.
          Endpoint: POST /api/production-runs/{id}/complete.
        test_recipe:
          setup:
            - "Coil C with received_weight_kg = 85.000; run completes with 100 good parts at steel_content 0.85 (consumes exactly 85.000)"
            - "Coil D with received_weight_kg = 85.001; identical run leaves 0.001"
