              as: CurriculumSpecialist
            - call: "POST /lesson-plans"
              payload: { residency_id: "${r1_id}", title: "Story in Motion 1", session_sequence_no: 1, standard_codes: ["DA:Cr1.1.4"] }
              as: TeachingArtist
