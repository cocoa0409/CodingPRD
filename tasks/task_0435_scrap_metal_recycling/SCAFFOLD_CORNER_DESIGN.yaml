        grounds: [roles, endpoints, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "A PayoutClerk calling POST /yard/tickets (a WeighMaster-exclusive op) is denied with ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["One seller exists."]
          setup_api_calls:
            - call: "POST /yard/sellers"
              payload: { legal_name: "Rbac Co", id_type: "STATE_ID", id_number: "SID-RB" }
