        claim_type: priority_ordering
        grounds: ["validations[priority=6]", "validations[priority=7]", "errors[ERR_STALE_VERSION]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "OCC (priority 6) outranks state (priority 7): a note created on a CLOSED case with a stale expected_case_version returns ERR_STALE_VERSION, not ERR_INVALID_STATE."
        test_recipe:
          setup: ["Base chain; case walked IN_PROGRESS (version captured) -> RESOLVED -> CLOSED"]
          setup_api_calls:
            - { call: "POST /hotline/jurisdictions", payload: { code: "CA", name: "California", level: "STATE", eviction_notice_days: 3, habitability_repair_days: 14, deposit_cap_months: 1.0, deposit_interest_required: false, deposit_interest_rate_pct: 0.0 }, as: AgencyAdmin, captures: { jur: $.data.id } }
