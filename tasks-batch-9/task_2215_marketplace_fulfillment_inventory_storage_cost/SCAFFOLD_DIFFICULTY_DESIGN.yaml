  - rule_id: transitive_cascade
    instances:
      - name: partial_receipt_cascade_depth_four_shortfall_to_quota_downgrade
        grounds:
          - state_machines.InboundShipmentPlan.IN_TRANSIT_to_PARTIALLY_RECEIVED
          - state_machines.InventoryLot.reconciliation_status_RECONCILED_to_reconciliation_status_DISCREPANCY_OPEN
          - calculations.listing_health_recompute
          - calculations.iprs_and_restock_limit
          - entities.SellerAccount.fields.open_discrepancy_units
          - entities.RestockQuota.fields.restock_limit_units
        distinguishing_aspect: |
          Cascade originating from the FcOperator receive fork (branch B): link 1 writes the 600-unit
          shortfall, link 2 is caused by link 1 and opens the lot discrepancy plus
          SellerAccount.open_discrepancy_units 600, link 3 is caused by link 2 and suppresses the listing
          with MISSING_INVENTORY, link 4 is caused by link 2 crossing the 500-unit discrepancy penalty
          threshold and re-scores the quota from 545 to 495, dropping restock_limit_units 1500 -> 500.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Seller with an ACTIVE RestockQuota scored 545 (TIER_STANDARD, restock_limit_units 1500) and open_discrepancy_units 0."
            - "One plan of 600 declared units CONFIRMED then shipped, so it holds SellerAccount.restock_reserved_units 600 and FulfillmentCenter.committed_receiving_units 600."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MarketplaceAdmin
