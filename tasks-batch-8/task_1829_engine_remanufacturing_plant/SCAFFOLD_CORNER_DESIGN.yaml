              as: PlantAdmin
              captures: { wv3: $.data.version }
            - call: "POST /work-orders/${w1}/operations"
              payload: { op_type: "BORE", sequence: 2, expected_work_order_version: "${wv3}" }
              as: ShopTechnician
              captures: { o2: $.data.id }
          assert:
            - "captured err == ERR_STALE_VERSION (op-create bumped the work order version after the first add)"
            - "captured wv3 == ${wv2} + 1"
            - "second add with the fresh version succeeds and GET /work-orders/${w1}/operations lists 2 operations"

      - name: components_pagination_with_filtering
        claim_type: pagination_with_filtering
        grounds: [response_envelope, entities.Component]
        distinguishing_aspect: "Filter + paginate interaction on GET /work-orders/{id}/components: limit=2 returns 2 rows with has_more true; offset=2 returns the 3rd row with has_more false; part_type filter narrows the set before pagination."
        test_recipe:
          setup: ["Work order W in TEARDOWN with 3 salvaged components: 2 CRANKSHAFT + 1 CYLINDER_HEAD"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /distributors"
              payload: { distributor_code: "D-PG", name: "Page Cores", emissions_requirement: "FEDERAL", credit_limit_cents: 1000000, volume_discount_pct: 0.0 }
              as: PlantAdmin
              captures: { d1: $.data.id }
            - call: "POST /build-specs"
              payload: { engine_family: "SBC-350", application_code: "SONOMA-1995", emissions_tier: "FEDERAL", list_price_cents: 250000, core_deposit_cents: 200000, core_base_credit_cents: 100000, allowed_reuse_grades: ["REUSE_OK"], allowed_interchange_groups: ["CRANK-SBC-3.48"], dyno_min_horsepower: 300, dyno_min_oil_pressure_psi: 20.0, dyno_max_coolant_temp_f: 210, required_op_sequence: ["CRANK_GRIND"] }
              as: PlantAdmin
              captures: { s1: $.data.id }
            - call: "POST /build-specs/${s1}/activate"
              as: PlantAdmin
            - call: "POST /core-returns"
              payload: { distributor_id: "${d1}", build_spec_id: "${s1}" }
              as: Distributor
              as_user_id: "${d1}"
              captures: { r1: $.data.id }
            - call: "POST /core-returns/${r1}/grade"
              payload: { grade: "GRADE_A", missing_components: [] }
              as: CoreInspector
            - call: "POST /work-orders"
              payload: { core_return_id: "${r1}" }
              as: PlantAdmin
              captures: { w1: $.data.id }
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "TEARDOWN" }
              as: ShopTechnician
            - call: "POST /work-orders/${w1}/components"
              payload: { part_type: "CRANKSHAFT", interchange_group: "CRANK-SBC-3.48" }
              as: ShopTechnician
            - call: "POST /work-orders/${w1}/components"
              payload: { part_type: "CRANKSHAFT", interchange_group: "CRANK-SBC-3.48" }
              as: ShopTechnician
            - call: "POST /work-orders/${w1}/components"
              payload: { part_type: "CYLINDER_HEAD", interchange_group: "HEAD-SBC-VORTEC" }
              as: ShopTechnician
          trigger:
            - call: "GET /work-orders/${w1}/components"
              payload: { limit: 2, offset: 0 }
              as: PlantAdmin
            - call: "GET /work-orders/${w1}/components"
              payload: { limit: 2, offset: 2 }
              as: PlantAdmin
              captures: { last_id: $.data.0.id }
            - call: "GET /work-orders/${w1}/components"
              payload: { part_type: "CYLINDER_HEAD" }
              as: PlantAdmin
              captures: { head_id: $.data.0.id }
          assert:
            - "page 1 returns exactly 2 rows with total_count == 3 and has_more == true"
            - "page 2 (offset 2) returns exactly 1 row with has_more == false"
            - "part_type=CYLINDER_HEAD returns exactly 1 row (captured head_id), no CRANKSHAFT rows"

      - name: cascading_side_effects_covered
        claim_type: cascade_chain
        grounds: [state_machines.WarrantyClaim.TEARDOWN_COMPLETE_to_APPROVED_REPLACEMENT]
        excluded_because:
          difficulty_instance: replacement_adjudication_depth3_chain
          rationale: "The 3-link replacement cascade and the 2-link grade-deposit cascade (grade_closes_linked_deposit_chain) are asserted hop-by-hop in §1.8."

      - name: dual_variant_calculation_covered
        claim_type: variant_divergence
        grounds: [calculations.core_credit_calculation, calculations.warranty_settlement_calculation]
        excluded_because:
          difficulty_instance: core_credit_provisional_vs_final
          rationale: "Both variant pairs (core credit, warranty settlement) are asserted with literal divergent values in §1.8."

      - name: derived_ledger_reconciliation_covered
        claim_type: derived_field_reconciliation
        grounds: [calculations.distributor_ledger_reconciliation, entities.Distributor.fields.deposits_held_cents]
        excluded_because:
          difficulty_instance: grade_closes_linked_deposit_chain
          rationale: "deposits_held_cents and credit_balance_cents are asserted before/after the grading cascade with literal values."

  # =================================================================
  # Section: consistency model
  # =================================================================
  - section: consistency_model
    instances:
      - name: patch_immediately_visible
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model, entities.Distributor.fields.volume_discount_pct]
        distinguishing_aspect: "Immediate consistency: a PATCH response reflects the mutation in the same request, and a subsequent GET returns the same value (no lag)."
        test_recipe:
          setup: ["Distributor D-IC exists with volume_discount_pct 0.10"]
          setup_api_calls:
            - call: "POST /distributors"
              payload: { distributor_code: "D-IC", name: "Immediate Co", emissions_requirement: "FEDERAL", credit_limit_cents: 1000000, volume_discount_pct: 0.10 }
              as: PlantAdmin
              captures: { d1: $.data.id }
          trigger:
            - call: "PATCH /distributors/${d1}"
              payload: { volume_discount_pct: 0.25 }
              as: PlantAdmin
              captures: { patched: $.data.volume_discount_pct, patched_v: $.data.version }
            - call: "GET /distributors/${d1}"
              as: PlantAdmin
              captures: { reread: $.data.volume_discount_pct }
          assert:
            - "captured patched == 0.25"
            - "captured patched_v == 2 (version increments on mutation)"
            - "captured reread == 0.25"
