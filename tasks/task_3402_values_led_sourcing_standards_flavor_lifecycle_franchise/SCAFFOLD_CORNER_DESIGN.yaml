        claim_type: role_exclusive_denied
        grounds: ["roles.IndependentBoardMember", "roles.ParentOpsController", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "The mirror gate: a board member cannot run schedule-ops — operations belong to the parent company."
        test_recipe:
          setup: ["Campaign BOARD_APPROVED (proposed board-1, decided board-2)"]
