  - name: date_of_event_chain_pinned_evaluation_order
    grounds:
    - calculations.date_of_event_unit_attribution
    - entities.InfectionCase.fields.infection_window_start
    - entities.InfectionCase.fields.rit_blocked_until
    distinguishing_aspect: 'Mode (c) — circular-looking dependency with pinned evaluation order:

      IWP <- specimen date; DOE <- evidence validated against IWP; is_hai <-

      DOE vs admission; RIT <- DOE. Reordering any two steps (e.g. applying

      the day-3 rule to the specimen date instead of the DOE) changes the

      outcome: specimen 2026-08-10 vs admission 2026-08-06 passes trivially,

      but DOE 2026-08-08 vs admission+2 == 2026-08-08 passes by equality —

      and RIT lands on 2026-08-21 (from DOE), not 2026-08-23 (from specimen).

      '
    test_recipe:
      setup:
      - Facility + unit; patient admitted 2026-08-06T08:00 (admit+2 = 2026-08-08)
      - CENTRAL_LINE episode placed 2026-08-06T10:00 (placed date 08-06 <= DOE 08-08 - 2d = 08-06, equality allowed)
      - CLABSI case, specimen 2026-08-10T10:00 (IWP 2026-08-07 .. 2026-08-13)
      setup_api_calls:
      - call: POST /api/facilities
        payload:
          name: F1
          nhsn_org_id: ORG-1
          clabsi_baseline_per_1000: 2.0
          cauti_baseline_per_1000: 1.5
          ssi_baseline_per_procedure: 0.25
        as: PlatformAdmin
        captures:
          fac_id: $.data.id
      - call: POST /api/units
        payload:
          facility_id: ${fac_id}
          name: ICU-2
          unit_type: ICU
          nhsn_location_code: ICU2
        as: PlatformAdmin
        captures:
          unit_id: $.data.id
      - call: POST /api/patients
        payload:
          mrn: MRN-C
          admitted_at: '2026-08-06T08:00:00Z'
          unit_id: ${unit_id}
        as: UnitNurseManager
        captures:
          pat_id: $.data.id
      - call: POST /api/device-episodes
        payload:
          patient_id: ${pat_id}
          device_type: CENTRAL_LINE
          placed_at: '2026-08-06T10:00:00Z'
        as: UnitNurseManager
        captures:
          ep_id: $.data.id
      - call: POST /api/infection-cases
        payload:
          patient_id: ${pat_id}
          case_type: CLABSI
          suspected_organism: Klebsiella pneumoniae
          first_positive_specimen_at: '2026-08-10T10:00:00Z'
          linked_device_episode_id: ${ep_id}
        as: InfectionPreventionist
        captures:
          case_id: $.data.id
          iwp_start: $.data.infection_window_start
          iwp_end: $.data.infection_window_end
      - call: POST /api/infection-cases/${case_id}/begin-review
        payload: {}
        as: InfectionPreventionist
      trigger:
      - call: POST /api/infection-cases/${case_id}/adjudicate
        payload:
          outcome: ADJUDICATED_HAI
          date_of_event: '2026-08-08T00:00:00Z'
          rationale: fever onset documented 08-08
        as: InfectionPreventionist
      assert:
      - InfectionCase.${case_id}.infection_window_start == 2026-08-07T00:00:00Z (specimen date - 3 days)
      - InfectionCase.${case_id}.infection_window_end == 2026-08-13T23:59:59Z
      - InfectionCase.${case_id}.date_of_event == 2026-08-08T00:00:00Z
      - InfectionCase.${case_id}.is_hai == true (DOE 08-08 >= admission 08-06 + 2d, by equality)
      - InfectionCase.${case_id}.rit_blocked_until == 2026-08-21T23:59:59Z (DOE + 13 days — computed from DOE, not specimen)
      - InfectionCase.${case_id}.status == ADJUDICATED_HAI
- rule_id: non_linear_state_machine
  instances:
  - name: infection_case_cyclic_reopen_adjudicate_loop
    grounds:
    - state_machines.InfectionCase.ADJUDICATED_HAI_to_REOPENED
    - state_machines.InfectionCase.REOPENED_to_UNDER_REVIEW
    - state_machines.InfectionCase.UNDER_REVIEW_to_RULED_OUT
    distinguishing_aspect: 'Cyclic machine on InfectionCase (ADJUDICATED_HAI -> REOPENED ->

      UNDER_REVIEW -> RULED_OUT): the entity loops back through a prior

      state with derived fields cleared; the cycle must leave the covering

      summary''s observed count back at 0.

      '
    test_recipe:
      setup:
      - Facility + ICU unit; patient admitted 2026-08-01; CENTRAL_LINE placed 2026-08-01
      - CLABSI case adjudicated ADJUDICATED_HAI with DOE 2026-08-04; MonthlySummary (2026-08) created after adjudication (clabsi_count 1)
      setup_api_calls:
      - call: POST /api/facilities
        payload:
          name: F1
          nhsn_org_id: ORG-1
          clabsi_baseline_per_1000: 2.0
          cauti_baseline_per_1000: 1.5
          ssi_baseline_per_procedure: 0.25
        as: PlatformAdmin
        captures:
          fac_id: $.data.id
      - call: POST /api/units
        payload:
          facility_id: ${fac_id}
          name: ICU-3
          unit_type: ICU
          nhsn_location_code: ICU3
        as: PlatformAdmin
        captures:
