  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with no X-User-Role header is rejected 401 ERR_UNAUTHENTICATED before any role or existence check runs."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /titles"
              payload: { canonical_name: "NoAuth", release_year: 2026 }
              as: Unauthenticated
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 401 with error_id == ERR_UNAUTHENTICATED"

      - name: critic_cannot_run_board_accreditation_transition
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "A Critic-role caller attempting the board-only ACCREDIT action on another critic is rejected 403 ERR_UNAUTHORIZED (role-level denial, before ownership)."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; P1 exists; CA and CC exist (APPLIED) under P1."
          setup_api_calls:
            - *c_clock
            - *c_pub
            - *c_ca
            - *c_cc
          trigger:
            - call: "POST /critics/${cc}/transition"
              payload: { action: "ACCREDIT" }
              as: Critic
              as_user_id: "${ca}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 with error_id == ERR_UNAUTHORIZED or ERR_FORBIDDEN (Critic role may only REAPPLY its own record)"

      - name: critic_accredit_requires_accredited_publication
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_PUBLICATION_NOT_ACCREDITED]
        distinguishing_aspect: "ACCREDIT on a critic whose employing publication is still PENDING fails 409 ERR_PUBLICATION_NOT_ACCREDITED."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; P1 exists (PENDING, never accredited); CA exists under P1."
          setup_api_calls:
            - *c_clock
            - *c_pub
            - *c_ca
          trigger:
            - call: "POST /critics/${ca}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 with error_id == ERR_PUBLICATION_NOT_ACCREDITED"

      - name: duplicate_live_review_per_critic_release_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_DUPLICATE_REVIEW]
        distinguishing_aspect: "A second INGESTED review by the same critic on the same release while the first is live (not WITHDRAWN) fails 409 ERR_DUPLICATE_REVIEW."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; P1 ACCREDITED; CA ACCREDITED; R1 OPEN, embargo lifted; CA has one INGESTED review on R1."
          setup_api_calls:
            - *c_clock
            - *c_pub
            - call: "POST /publications/${pub1}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *c_ca
            - call: "POST /critics/${ca}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *c_title
            - call: "PATCH /titles/${t1}"
              payload: { posture: "OPEN" }
              as: PlatformAdmin
            - *c_rel
            - call: "POST /releases/${r1}/transition"
              payload: { action: "OPEN" }
              as: PlatformAdmin
            - *c_ra
          trigger:
            - call: "POST /releases/${r1}/reviews"
              payload: { critic_id: "${ca}", body_text: "Second take.", self_designation: "ROTTEN" }
              as: Critic
              as_user_id: "${ca}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 with error_id == ERR_DUPLICATE_REVIEW"

      - name: rating_verify_with_unverified_ticket_returns_ticket_not_verified
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - errors[ERR_TICKET_NOT_VERIFIED]
        distinguishing_aspect: "VERIFY on a rating whose ticket verification is still SUBMITTED fails 409 ERR_TICKET_NOT_VERIFIED."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; Title OPEN; R1 OPEN; M1 registered; TV1 SUBMITTED (not verified) with in-window showtime; M1 has an UNVERIFIED rating AR1."
          setup_api_calls:
            - *c_clock
            - *c_title
            - call: "PATCH /titles/${t1}"
              payload: { posture: "OPEN" }
              as: PlatformAdmin
            - *c_rel
            - call: "POST /releases/${r1}/transition"
              payload: { action: "OPEN" }
              as: PlatformAdmin
            - *c_m1
            - *c_tv1
            - *c_ar1
          trigger:
            - call: "POST /audience-ratings/${ar1}/transition"
              payload: { action: "VERIFY", ticket_verification_id: "${tv1}" }
              as: AudienceMember
              as_user_id: "${m1}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 with error_id == ERR_TICKET_NOT_VERIFIED"

      - name: duplicate_live_rating_per_member_release_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=13]
          - errors[ERR_DUPLICATE_VERIFIED_RATING]
        distinguishing_aspect: "A second rating by the same member on the same release while the first is non-INVALIDATED fails 409 ERR_DUPLICATE_VERIFIED_RATING."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; Title OPEN; R1 OPEN; M1 registered with an existing UNVERIFIED rating on R1."
          setup_api_calls:
            - *c_clock
            - *c_title
            - call: "PATCH /titles/${t1}"
              payload: { posture: "OPEN" }
              as: PlatformAdmin
            - *c_rel
            - call: "POST /releases/${r1}/transition"
              payload: { action: "OPEN" }
              as: PlatformAdmin
            - *c_m1
            - *c_ar1
          trigger:
            - call: "POST /releases/${r1}/audience-ratings"
              payload: { audience_member_id: "${m1}", stars: 2 }
              as: AudienceMember
              as_user_id: "${m1}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 with error_id == ERR_DUPLICATE_VERIFIED_RATING"

      - name: verify_rating_during_confirmed_bombing_suspension_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=15]
          - errors[ERR_BOMBING_SUSPENSION_ACTIVE]
        distinguishing_aspect: "VERIFY on a rating while the release has a CONFIRMED bombing incident fails 409 ERR_BOMBING_SUSPENSION_ACTIVE; after RESOLVE the same VERIFY succeeds."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; Title OPEN; R1 OPEN; M1 with VERIFIED ticket TV1 and UNVERIFIED rating AR1; incident BI opened and CONFIRMED."
          setup_api_calls:
            - *c_clock
            - *c_title
            - call: "PATCH /titles/${t1}"
              payload: { posture: "OPEN" }
              as: PlatformAdmin
            - *c_rel
            - call: "POST /releases/${r1}/transition"
              payload: { action: "OPEN" }
              as: PlatformAdmin
            - *c_m1
            - *c_tv1
            - call: "POST /ticket-verifications/${tv1}/transition"
              payload: { action: "VERIFY" }
              as: PlatformAdmin
            - *c_bi
            - call: "POST /bombing-incidents/${bi}/transition"
              payload: { action: "CONFIRM" }
              as: PlatformAdmin
            - *c_ar1
          trigger:
            - call: "POST /audience-ratings/${ar1}/transition"
              payload: { action: "VERIFY", ticket_verification_id: "${tv1}" }
              as: AudienceMember
              as_user_id: "${m1}"
              captures: { err: $.data.error_id }
            - call: "POST /bombing-incidents/${bi}/transition"
              payload: { action: "RESOLVE" }
              as: PlatformAdmin
            - call: "POST /audience-ratings/${ar1}/transition"
              payload: { action: "VERIFY", ticket_verification_id: "${tv1}" }
              as: AudienceMember
