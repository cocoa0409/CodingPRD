# §1.9 Scaffold Corner Design - the breadth probe over SCAFFOLD.yaml's §1.1-§1.7 surface.
#
# Taxonomy: every `section:` below is one of the nine sections of
# references/claim-extraction-guide.md, and every `claim_type:` is a row label from that
# section's own table. No category is invented here.
#
# Standard fixture (identical to SCAFFOLD_DIFFICULTY_DESIGN.yaml so both files share one
# property shape): room_count_total 100, standard_room_rate_amount 200.00,
# occupancy_tax_rate_pct 8.875, fb_tax_rate_pct 6.25, service_charge_pct 18.0,
# large_ticket_threshold_amount 472.00, large_party_discount_pct 5.0,
# allowance_manager_threshold_amount 250.00, allowance_controller_threshold_amount 1000.00,
# rate_variance_tolerance_pct 95.0, settlement_variance_tolerance_amount 5.00,
# city_ledger_fee_pct 1.5, late_checkout_grace_minutes 30, card_authorization_valid_days 7,
# no_show_charge_policy FIRST_NIGHT_PLUS_TAX. Opening clock 2026-08-01T09:00:00.000Z unless
# an instance states otherwise. Every `trigger:` is written as a single prose line naming the
# method, path, body and headers, because several triggers are deliberately malformed calls
# whose whole point is that they violate §1.5's declared input contract.

scaffold_corner_design:

  - section: entities
    instances:

      - name: entity_creation_property_echoes_every_configuration_field_and_common_fields
        claim_type: creation
        grounds: ["entities.HotelProperty", "endpoints[POST /night-audit/properties]", "response_envelope.success"]
        distinguishing_aspect: "A property created with every required field present returns 201 with the four common fields minted (version 1) and every configuration figure echoed at full declared precision - three decimals on the tax rates, two on the money."
        test_recipe:
          setup: ["Empty database; the logical clock is left at its default 2026-08-01T00:00:00.000Z."]
          setup_api_calls: []
          trigger: "POST /night-audit/properties with name Harbor Grand, room_count_total 100, standard_room_rate_amount 200.00, occupancy_tax_rate_pct 8.875, fb_tax_rate_pct 6.25, service_charge_pct 18.0, large_ticket_threshold_amount 472.00, large_party_discount_pct 5.0, allowance_manager_threshold_amount 250.00, allowance_controller_threshold_amount 1000.00, rate_variance_tolerance_pct 95.0, settlement_variance_tolerance_amount 5.00 and city_ledger_fee_pct 1.5, as PropertyAdmin (X-User-ID u_admin_1)."
          assert:
            - "HTTP 201 with meta.api_request_id and meta.api_request_timestamp present and response_type == \"object\"."
            - "data.id is a bare server-minted UUID with no type prefix, and data.created_at, data.updated_at and data.version == 1 are all present."
            - "data.name == \"Harbor Grand\", data.room_count_total == 100, data.standard_room_rate_amount == 200.00, data.occupancy_tax_rate_pct == 8.875, data.fb_tax_rate_pct == 6.25 and data.service_charge_pct == 18.0."
            - "data.allowance_manager_threshold_amount == 250.00, data.allowance_controller_threshold_amount == 1000.00, data.rate_variance_tolerance_pct == 95.0, data.settlement_variance_tolerance_amount == 5.00 and data.city_ledger_fee_pct == 1.5."
            - "GET /night-audit/properties/${the returned id} as Controller returns the identical row, so nothing was lost between write and read."

      - name: entity_defaults_omitted_optional_inputs_take_their_declared_defaults
        claim_type: defaults
        grounds: ["entities.HotelProperty.fields.late_checkout_grace_minutes", "entities.HotelProperty.fields.card_authorization_valid_days", "entities.HotelProperty.fields.no_show_charge_policy", "entities.Outlet.fields.requires_shift_settlement", "entities.BusinessDate.fields.out_of_order_room_count", "entities.Folio.fields.credit_limit_amount", "entities.Folio.fields.is_comp"]
        distinguishing_aspect: "Six optional inputs across four entities are omitted in one chain, and each lands on the exact default the scaffold declares rather than on null or zero - notably credit_limit_amount 500.00, which is a non-zero default a naive implementation leaves empty."
        test_recipe:
          setup: ["A property created with only the thirteen mandatory configuration fields, so its three optional fields fall back to their defaults."]
          setup_api_calls:
            - call: "POST /night-audit/properties"
              payload: { name: "Harbor Grand", room_count_total: 100, standard_room_rate_amount: 200.00, occupancy_tax_rate_pct: 8.875, fb_tax_rate_pct: 6.25, service_charge_pct: 18.0, large_ticket_threshold_amount: 472.00, large_party_discount_pct: 5.0, allowance_manager_threshold_amount: 250.00, allowance_controller_threshold_amount: 1000.00, rate_variance_tolerance_pct: 95.0, settlement_variance_tolerance_amount: 5.00, city_ledger_fee_pct: 1.5 }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { prop_id: "$.data.id" }
            - call: "POST /night-audit/outlets"
              payload: { property_id: "${prop_id}", outlet_code: "LOBBY", outlet_name: "Lobby Lounge", outlet_type: "FB_OUTLET" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { outlet_id: "$.data.id" }
            - call: "POST /night-audit/business-dates"
              payload: { property_id: "${prop_id}", business_date: "2026-08-01" }
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd1_id: "$.data.id" }
          trigger: "POST /night-audit/folios with property_id ${prop_id}, arrival_business_date_id ${bd1_id}, confirmation_code CF-DEF1, guest_name Ida Wren, room_number 100, nights_count 1, contracted_rate_amount 200.00, rate_plan_code BAR, market_segment TRANSIENT, settlement_method CASH and scheduled_checkout_at 2026-08-02T11:00:00.000Z - omitting is_comp and credit_limit_amount - as FrontDeskAgent (X-User-ID u_fd_1)."
          assert:
            - "The property reads back with late_checkout_grace_minutes == 30, card_authorization_valid_days == 7 and no_show_charge_policy == \"FIRST_NIGHT_PLUS_TAX\"."
            - "GET /night-audit/outlets/${outlet_id} returns requires_shift_settlement == true and status == \"ACTIVE\"."
            - "GET /night-audit/business-dates/${bd1_id} returns out_of_order_room_count == 0, benchmark_calendar_room_revenue_amount == 0.00, benchmark_weekday_room_revenue_amount == 0.00 and rooms_available_count == 100."
            - "The trigger returns 201 with is_comp == false and credit_limit_amount == 500.00, the declared non-zero default."
            - "The same folio reads back with stay_status == \"RESERVED\" and settlement_status == \"UNSETTLED\"."

      - name: entity_retrieval_folio_read_returns_both_dimensions_and_derived_money
        claim_type: retrieval
        grounds: ["endpoints[GET /night-audit/folios/{id}]", "entities.Folio.fields.stay_status", "entities.Folio.fields.settlement_status", "calculations.folio_balance"]
        distinguishing_aspect: "One GET must return the two independent state dimensions AND the four derived money fields consistently with the folio's single posted line; the read is not allowed to expose only stay_status."
        test_recipe:
          setup: ["Standard property; business date 2026-08-01; one CASH folio checked in and carrying one manual MISC_CHARGE line of 45.00."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00.000Z" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
            - call: "POST /night-audit/properties"
              payload: { name: "Harbor Grand", room_count_total: 100, standard_room_rate_amount: 200.00, occupancy_tax_rate_pct: 8.875, fb_tax_rate_pct: 6.25, service_charge_pct: 18.0, large_ticket_threshold_amount: 472.00, large_party_discount_pct: 5.0, allowance_manager_threshold_amount: 250.00, allowance_controller_threshold_amount: 1000.00, rate_variance_tolerance_pct: 95.0, settlement_variance_tolerance_amount: 5.00, city_ledger_fee_pct: 1.5, late_checkout_grace_minutes: 30, card_authorization_valid_days: 7, no_show_charge_policy: "FIRST_NIGHT_PLUS_TAX" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { prop_id: "$.data.id" }
            - call: "POST /night-audit/business-dates"
              payload: { property_id: "${prop_id}", business_date: "2026-08-01", out_of_order_room_count: 4 }
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd1_id: "$.data.id" }
            - call: "POST /night-audit/folios"
              payload: { property_id: "${prop_id}", arrival_business_date_id: "${bd1_id}", confirmation_code: "CF-RD1", guest_name: "Jai Bloom", room_number: "1601", nights_count: 1, contracted_rate_amount: 200.00, rate_plan_code: "BAR", market_segment: "TRANSIENT", settlement_method: "CASH", scheduled_checkout_at: "2026-08-02T11:00:00.000Z" }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
              captures: { folio_id: "$.data.id" }
            - call: "POST /night-audit/folios/${folio_id}/check-in"
              payload: {}
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
            - call: "POST /night-audit/journal-postings"
              payload: { business_date_id: "${bd1_id}", charge_type: "MISC_CHARGE", amount: 45.00, folio_id: "${folio_id}", memo: "Minibar" }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
          trigger: "GET /night-audit/folios/${folio_id} as RevenueManager (X-User-ID u_rm_1)."
          assert:
            - "HTTP 200 with data.stay_status == \"IN_HOUSE\" and data.settlement_status == \"UNSETTLED\" - both dimensions in one payload."
            - "data.charges_total_amount == 45.00, data.credits_total_amount == 0.00, data.balance_amount == 45.00 and data.settlement_hold == false."
            - "data.rate_variance_pct == 0.00, because contracted_rate_amount equals the property's standard_room_rate_amount."
            - "data.version == 2 (creation then check-in) and data.credit_limit_amount == 500.00; the MISC_CHARGE line is a JournalPosting append and does not itself bump the folio row's version."
            - "data.confirmation_code == \"CF-RD1\" and data.room_number == \"1601\", so stored input is returned verbatim."

      - name: entity_listing_business_dates_paginate_with_total_count_and_has_more
        claim_type: listing
        grounds: ["endpoints[GET /night-audit/business-dates]", "response_envelope.pagination_fields", "response_envelope.pagination_defaults"]
        distinguishing_aspect: "Pagination is probed at the page boundary of a three-row set: limit 2 offset 0 must report has_more true with the full total_count 3, and offset 2 must report has_more false - a total_count that reports the page size instead of the set size fails."
        test_recipe:
          setup: ["Standard property with three business dates 2026-08-01, 2026-08-02 and 2026-08-03, all OPEN."]
          setup_api_calls:
            - call: "POST /night-audit/properties"
              payload: { name: "Harbor Grand", room_count_total: 100, standard_room_rate_amount: 200.00, occupancy_tax_rate_pct: 8.875, fb_tax_rate_pct: 6.25, service_charge_pct: 18.0, large_ticket_threshold_amount: 472.00, large_party_discount_pct: 5.0, allowance_manager_threshold_amount: 250.00, allowance_controller_threshold_amount: 1000.00, rate_variance_tolerance_pct: 95.0, settlement_variance_tolerance_amount: 5.00, city_ledger_fee_pct: 1.5, late_checkout_grace_minutes: 30, card_authorization_valid_days: 7, no_show_charge_policy: "FIRST_NIGHT_PLUS_TAX" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { prop_id: "$.data.id" }
            - call: "POST /night-audit/business-dates"
              payload: { property_id: "${prop_id}", business_date: "2026-08-01", out_of_order_room_count: 4 }
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/business-dates"
              payload: { property_id: "${prop_id}", business_date: "2026-08-02", out_of_order_room_count: 4 }
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/business-dates"
              payload: { property_id: "${prop_id}", business_date: "2026-08-03", out_of_order_room_count: 4 }
              as: NightAuditor
              as_user_id: "u_na_1"
          trigger: "GET /night-audit/business-dates with property_id ${prop_id}, limit 2 and offset 0 as Controller (X-User-ID u_ctl_1)."
          assert:
            - "HTTP 200 with response_type == \"array\", exactly 2 rows in data, total_count == 3 and has_more == true."
            - "The same query with limit 2 and offset 2 returns exactly 1 row, total_count == 3 and has_more == false."
            - "The same query with no limit and no offset returns all 3 rows under the declared defaults limit 10 and offset 0."
            - "Adding business_date 2026-08-02 to the filter returns exactly 1 row with total_count == 1."
            - "Adding status OPEN returns all 3 rows, and status CLOSED returns 0 rows with total_count == 0 and has_more == false."
            - "limit 0 or limit 101 fails 400 ERR_INVALID_REQUEST, since the declared bounds are min 1 and max 100."

      - name: entity_not_found_unknown_folio_id_returns_folio_not_found
        claim_type: not_found
        grounds: ["validations[priority=12]", "errors[ERR_FOLIO_NOT_FOUND]", "response_envelope.error"]
        distinguishing_aspect: "A well-formed UUID that resolves to nothing returns the collection's own 404 code rather than a generic one, and the error envelope carries error_id inside data - not at the top level."
        test_recipe:
          setup: ["Empty database apart from a standard property."]
          setup_api_calls:
            - call: "POST /night-audit/properties"
              payload: { name: "Harbor Grand", room_count_total: 100, standard_room_rate_amount: 200.00, occupancy_tax_rate_pct: 8.875, fb_tax_rate_pct: 6.25, service_charge_pct: 18.0, large_ticket_threshold_amount: 472.00, large_party_discount_pct: 5.0, allowance_manager_threshold_amount: 250.00, allowance_controller_threshold_amount: 1000.00, rate_variance_tolerance_pct: 95.0, settlement_variance_tolerance_amount: 5.00, city_ledger_fee_pct: 1.5, late_checkout_grace_minutes: 30, card_authorization_valid_days: 7, no_show_charge_policy: "FIRST_NIGHT_PLUS_TAX" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { prop_id: "$.data.id" }
          trigger: "GET /night-audit/folios/00000000-0000-4000-8000-000000000000 as FrontDeskAgent (X-User-ID u_fd_1)."
          assert:
            - "HTTP 404 with response_type == \"error\" and data.error_id == \"ERR_FOLIO_NOT_FOUND\"; data.message is a non-empty string."
            - "GET /night-audit/business-dates/00000000-0000-4000-8000-000000000000 returns 404 ERR_BUSINESS_DATE_NOT_FOUND."
            - "GET /night-audit/outlet-tickets/00000000-0000-4000-8000-000000000000 returns 404 ERR_TICKET_NOT_FOUND."
            - "GET /night-audit/settlement-batches/00000000-0000-4000-8000-000000000000 returns 404 ERR_BATCH_NOT_FOUND, GET /night-audit/allowances/... returns ERR_ALLOWANCE_NOT_FOUND, GET /night-audit/authorization-documents/... returns ERR_DOCUMENT_NOT_FOUND, GET /night-audit/card-authorizations/... returns ERR_AUTHORIZATION_NOT_FOUND, GET /night-audit/revenue-reports/... returns ERR_REPORT_NOT_FOUND, GET /night-audit/journal-postings/... returns ERR_POSTING_NOT_FOUND, GET /night-audit/ledger-accounts/... returns ERR_LEDGER_ACCOUNT_NOT_FOUND, GET /night-audit/outlets/... returns ERR_OUTLET_NOT_FOUND and GET /night-audit/accounting-periods/... returns ERR_PERIOD_NOT_FOUND - each collection owns its code."
            - "GET /night-audit/properties/${prop_id} still returns 200, so the 404 path did not poison the happy path."

      - name: entity_required_fields_settlement_batch_without_declared_amount_is_refused
        claim_type: required_fields
        grounds: ["validations[priority=5]", "errors[ERR_INVALID_REQUEST]", "endpoints[POST /night-audit/settlement-batches]"]
        distinguishing_aspect: "Every field §1.5 lists without a trailing question mark is enforced at 400 before any state or ownership check runs, so a batch missing declared_amount fails even though the outlet, the date and the window are all valid."
        test_recipe:
          setup: ["Standard property; one ACTIVE outlet; business date 2026-08-01."]
          setup_api_calls:
            - call: "POST /night-audit/properties"
              payload: { name: "Harbor Grand", room_count_total: 100, standard_room_rate_amount: 200.00, occupancy_tax_rate_pct: 8.875, fb_tax_rate_pct: 6.25, service_charge_pct: 18.0, large_ticket_threshold_amount: 472.00, large_party_discount_pct: 5.0, allowance_manager_threshold_amount: 250.00, allowance_controller_threshold_amount: 1000.00, rate_variance_tolerance_pct: 95.0, settlement_variance_tolerance_amount: 5.00, city_ledger_fee_pct: 1.5, late_checkout_grace_minutes: 30, card_authorization_valid_days: 7, no_show_charge_policy: "FIRST_NIGHT_PLUS_TAX" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { prop_id: "$.data.id" }
            - call: "POST /night-audit/outlets"
              payload: { property_id: "${prop_id}", outlet_code: "LOBBY", outlet_name: "Lobby Lounge", outlet_type: "FB_OUTLET", requires_shift_settlement: true }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { lounge_id: "$.data.id" }
            - call: "POST /night-audit/business-dates"
              payload: { property_id: "${prop_id}", business_date: "2026-08-01", out_of_order_room_count: 4 }
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd1_id: "$.data.id" }
          trigger: "POST /night-audit/settlement-batches with business_date_id ${bd1_id}, outlet_id ${lounge_id}, tender_type CASH, shift_start_at 2026-08-01T14:00:00.000Z and shift_end_at 2026-08-01T22:00:00.000Z but NO declared_amount, as OutletManager (X-User-ID ${lounge_id})."
          assert:
            - "HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\"."
            - "GET /night-audit/settlement-batches?business_date_id=${bd1_id} returns 0 rows - nothing was half-written."
            - "GET /night-audit/business-dates/${bd1_id} still returns unresolved_settlement_batch_count == 0."
            - "POST /night-audit/folios missing guest_name, POST /night-audit/outlet-tickets missing gross_amount, POST /night-audit/allowances missing requested_amount and POST /night-audit/card-authorizations missing obtained_at each fail the same way with 400 ERR_INVALID_REQUEST."
            - "Re-sending the trigger with declared_amount 0.00 returns 201, because zero is a legal declared count while absence is not."

      - name: entity_computed_fields_rate_variance_is_derived_and_a_supplied_value_is_ignored
        claim_type: computed_fields
        grounds: ["entities.Folio.fields.rate_variance_pct", "calculations.rate_variance_pct", "validations[priority=5]"]
        distinguishing_aspect: "The computed field is signed and must be derived from the property's rack rate on both sides of it, and a client value smuggled into the body is ignored rather than stored or rejected - the discount case (-60.00) is the one a naive absolute-value implementation gets wrong."
        test_recipe:
          setup: ["Standard property whose standard_room_rate_amount is 200.00; business date 2026-08-01."]
          setup_api_calls:
            - call: "POST /night-audit/properties"
              payload: { name: "Harbor Grand", room_count_total: 100, standard_room_rate_amount: 200.00, occupancy_tax_rate_pct: 8.875, fb_tax_rate_pct: 6.25, service_charge_pct: 18.0, large_ticket_threshold_amount: 472.00, large_party_discount_pct: 5.0, allowance_manager_threshold_amount: 250.00, allowance_controller_threshold_amount: 1000.00, rate_variance_tolerance_pct: 95.0, settlement_variance_tolerance_amount: 5.00, city_ledger_fee_pct: 1.5, late_checkout_grace_minutes: 30, card_authorization_valid_days: 7, no_show_charge_policy: "FIRST_NIGHT_PLUS_TAX" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { prop_id: "$.data.id" }
            - call: "POST /night-audit/business-dates"
              payload: { property_id: "${prop_id}", business_date: "2026-08-01", out_of_order_room_count: 4 }
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd1_id: "$.data.id" }
            - call: "POST /night-audit/folios"
              payload: { property_id: "${prop_id}", arrival_business_date_id: "${bd1_id}", confirmation_code: "CF-UP1", guest_name: "Kip Doyle", room_number: "1701", nights_count: 1, contracted_rate_amount: 250.00, rate_plan_code: "SUITE", market_segment: "TRANSIENT", settlement_method: "CASH", scheduled_checkout_at: "2026-08-02T11:00:00.000Z" }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
              captures: { folio_up_id: "$.data.id" }
          trigger: "POST /night-audit/folios with the same property and date, confirmation_code CF-DN1, guest_name Lu Ferro, room_number 1702, nights_count 1, contracted_rate_amount 80.00, rate_plan_code STAFF, market_segment CORPORATE, settlement_method CASH, scheduled_checkout_at 2026-08-02T11:00:00.000Z and a smuggled rate_variance_pct of 999.99, as FrontDeskAgent (X-User-ID u_fd_1)."
          assert:
            - "The trigger returns 201 with rate_variance_pct == -60.00 - round((80.00 - 200.00) * 100 / 200.00, 2) - and never 999.99 or 60.00; the unknown body key is ignored rather than rejected."
            - "GET /night-audit/folios/${folio_up_id} returns rate_variance_pct == 25.00 - round((250.00 - 200.00) * 100 / 200.00, 2) - so the sign follows the direction of the deviation."
            - "A third folio at contracted_rate_amount 200.00 reads rate_variance_pct == 0.00, not null."
            - "A fourth folio at contracted_rate_amount 0.00 reads rate_variance_pct == -100.00."
            - "Both folios check in without paperwork, because abs(rate_variance_pct) never exceeds rate_variance_tolerance_pct 95.0 - the -100.00 folio would need a RATE_OVERRIDE document."

      - name: entity_system_fields_journal_posting_stamps_poster_and_source_channel
        claim_type: system_fields
        grounds: ["entities.JournalPosting.fields.posted_by_user_id", "entities.JournalPosting.fields.source_channel", "entities.JournalPosting.fields.night_index", "endpoints[POST /night-audit/journal-postings]"]
        distinguishing_aspect: "source_channel is derived from the caller's ROLE, not from the body: the identical payload posted by a FrontDeskAgent and by a NightAuditor must produce FRONT_DESK and NIGHT_AUDIT respectively, and both rows must leave night_index null."
        test_recipe:
          setup: ["Standard property; business date 2026-08-01; one CASH folio checked in with credit_limit_amount 500.00."]
          setup_api_calls:
            - call: "POST /night-audit/properties"
              payload: { name: "Harbor Grand", room_count_total: 100, standard_room_rate_amount: 200.00, occupancy_tax_rate_pct: 8.875, fb_tax_rate_pct: 6.25, service_charge_pct: 18.0, large_ticket_threshold_amount: 472.00, large_party_discount_pct: 5.0, allowance_manager_threshold_amount: 250.00, allowance_controller_threshold_amount: 1000.00, rate_variance_tolerance_pct: 95.0, settlement_variance_tolerance_amount: 5.00, city_ledger_fee_pct: 1.5, late_checkout_grace_minutes: 30, card_authorization_valid_days: 7, no_show_charge_policy: "FIRST_NIGHT_PLUS_TAX" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { prop_id: "$.data.id" }
            - call: "POST /night-audit/business-dates"
              payload: { property_id: "${prop_id}", business_date: "2026-08-01", out_of_order_room_count: 4 }
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd1_id: "$.data.id" }
            - call: "POST /night-audit/folios"
              payload: { property_id: "${prop_id}", arrival_business_date_id: "${bd1_id}", confirmation_code: "CF-SYS1", guest_name: "Mia Roth", room_number: "1801", nights_count: 1, contracted_rate_amount: 200.00, rate_plan_code: "BAR", market_segment: "TRANSIENT", settlement_method: "CASH", scheduled_checkout_at: "2026-08-02T11:00:00.000Z" }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
              captures: { folio_sys_id: "$.data.id" }
            - call: "POST /night-audit/folios/${folio_sys_id}/check-in"
              payload: {}
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
            - call: "POST /night-audit/journal-postings"
