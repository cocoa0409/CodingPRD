            - call: "GET /scheduling/reschedule-plans/${pl1_id}"
              payload: {}
              as: SchedulingManager
            - call: "GET /scheduling/engagement-phases/${ph1_id}"
              payload: {}
              as: SchedulingManager
            - call: "POST /scheduling/reschedule-plans/${pl1_id}/apply"
              payload: { expected_engagement_version: "${e_ver}" }
              as: SchedulingManager
          assert:
            - "setup: ${sim_ver} == ${e_ver} and the plan reports simulation_stale == false"
            - "first trigger: HTTP 412 and ${err_id} == 'ERR_STALE_ENGAGEMENT_VERSION' (not ERR_SIMULATION_STALE — the projection is current)"
            - "second trigger: response.data.status == 'SIMULATED' and simulation_stale == false"
            - "third trigger: window_start_date is still '2026-08-03' and window_end_date is still '2026-08-31'"
            - "fourth trigger: HTTP 200 with status == 'APPLIED'; the phase window is then 2026-08-10..2026-09-07 and Engagement.version has advanced past ${e_ver}"

      - name: four_hop_cascade_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - "state_machines.Engagement.status.IN_FIELDWORK_to_CLIENT_BLOCKED"
        excluded_because:
          difficulty_instance: transitive_cascade / client_block_releases_assignment_relaxes_workload_then_expires_waiver
          rationale: |
            The end-to-end chain claim for this layer is that §1.8 instance: one
            report-client-block call walks assignment release -> phase staffing re-derivation
            -> staff workload relaxation -> waiver expiry, and its sibling
            independence_restriction_release_downgrades_phase_and_reverts_engagement covers the
            second cascade root together with ordering sensitivity.

      - name: both_variants_and_the_switch_delta
        claim_type: dual_variant_calculation
        grounds:
          - "calculations.engagement_realization"
          - "calculations.burnout_risk_score"
        excluded_because:
          difficulty_instance: dual_variant_calc / realization_provisional_vs_final_diverges_on_same_engagement
          rationale: |
            Both dual-variant calculations are owned by §1.8 — realization
            (provisional_committed vs final_logged) in the cited instance and burnout
            (actual_trailing vs committed_forward) in
            burnout_actual_trailing_vs_committed_forward_diverges_for_same_staff — and the
            reconciliation delta on the provisional -> final switch is asserted by
            phase_complete_bubbles_active_assignment_to_completed_and_reconciles_realization
            in the state_machines section above.

  - section: consistency_model
    instances:
      - name: booking_response_and_every_dependent_read_are_immediately_consistent
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.phase_staffing_derivation
          - calculations.engagement_staffing_completion
          - calculations.weekly_committed_hours
        distinguishing_aspect: |
          One booking simultaneously moves four derived surfaces — the assignment's own
          computed fields, the phase's staffed/unstaffed split, the engagement's completion
          percentage and the staff member's weekly load — and all four are already correct in
          the creating response and in reads issued immediately afterwards, with no settling
          step anywhere.
        test_recipe:
          setup:
            - "Clock at 2026-08-03T09:00:00Z; MERIDIAN client, partner P1, DOMESTIC senior S1 (effective cap 50.00, daily capacity 10.00)."
            - "Engagement E1 with phase PH1 FIELDWORK expecting 40.00 hours in 2026-08-03..2026-08-31 and nothing booked yet."
