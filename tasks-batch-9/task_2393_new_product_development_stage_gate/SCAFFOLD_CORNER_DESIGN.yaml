# =============================================================================
# §1.9 Scaffold Corner Design — task_2393_new_product_development_stage_gate
# Breadth probe over §1.1-§1.7. Sections and claim_type values are taken from
# references/claim-extraction-guide.md; corners already asserted by §1.8 are
# emitted as excluded_because stubs. Every numeric assert is a literal produced
# by executing the §1.3 formulas as decimal round_half_up code.
# =============================================================================
scaffold_corner_design:

  # ------------------------------------------------------------ Entities ----
  - section: entities
    instances:
      - name: entity_create_innovation_project_returns_defaults_and_system_fields
        claim_type: creation
        grounds:
          - entities.InnovationProject
          - endpoints[POST /innovation-projects]
        distinguishing_aspect: |
          A bare create must return every default the entity declares and nothing computed:
          screening_score stays null until screen runs, screening_decision is PENDING,
          next_gate_number is already 2 and the two ledger fields are 0.00 — not absent keys.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortfolioAdmin
          trigger:
            - call: "POST /innovation-projects"
              payload: { name: "Toffee Crunch Bites", brand: "GrainWell", category: "SNACK", project_type: "LINE_EXTENSION", strategic_fit_score: 8, consumer_need_score: 7, target_gross_margin_pct: 36, category_attractiveness_score: 7, development_budget_cap_usd: 500000.00 }
              as: InnovationLead
              as_user_id: "lead-c1"
              captures: { c1_id: $.data.id }
          assert:
            - "the response code is 201 and meta.api_request_id and meta.api_request_timestamp are present"
            - "InnovationProject.${c1_id}.dev_status == IDEA and commercial_status == NOT_STARTED"
            - "InnovationProject.${c1_id}.screening_decision == PENDING and screening_score is null"
            - "InnovationProject.${c1_id}.next_gate_number == 2 and recycle_count == 0 and open_gate_conditions == false"
            - "InnovationProject.${c1_id}.development_budget_committed_usd == 0.00"
            - "InnovationProject.${c1_id}.launch_readiness_pct == 0.00 and authorized_acv_pct == 0.00"
            - "InnovationProject.${c1_id}.launch_date is null and shelf_reset_window_id is null and post_launch_decision is null"
            - "InnovationProject.${c1_id}.owner_user_id == lead-c1, taken from X-User-ID and not from the body"
            - "InnovationProject.${c1_id}.version == 1 and id is a bare UUID with no type prefix"

      - name: entity_get_stage_gate_returns_stored_configuration
        claim_type: retrieval
        grounds:
          - entities.StageGate
          - endpoints[GET /stage-gates/{gate_id}]
        distinguishing_aspect: |
          A gate is pure configuration with no computed fields, so GET must echo the array and
          decimal inputs exactly as stored, including an empty veto_functions array.
        test_recipe:
          setup:
            - "Empty database."
            - "One SNACK gate 2 requiring a concept test and a preliminary business case."
          setup_api_calls:
            - call: "POST /stage-gates"
              payload: { gate_number: 2, category: "SNACK", stage_from: "SCREENED", stage_to: "PILOT_QUALIFIED", required_deliverable_types: ["CONSUMER_CONCEPT_TEST", "PRELIM_BUSINESS_CASE"], quorum_size: 2, veto_functions: [], npv_hurdle_usd: 250000.00, payback_months_max: 24, gross_margin_floor_pct: 30.00, readiness_floor_index: 55.00 }
              as: PortfolioAdmin
              captures: { rg_id: $.data.id }
          trigger:
            - call: "GET /stage-gates/${rg_id}"
              as: GateChair
          assert:
            - "the response code is 200 and response_type is object"
            - "StageGate.${rg_id}.required_deliverable_types == [CONSUMER_CONCEPT_TEST, PRELIM_BUSINESS_CASE] in that order"
            - "StageGate.${rg_id}.veto_functions == [] and quorum_size == 2"
            - "StageGate.${rg_id}.npv_hurdle_usd == 250000.00 and gross_margin_floor_pct == 30.00 and readiness_floor_index == 55.00"
            - "StageGate.${rg_id}.version == 1"

      - name: entity_list_innovation_projects_paginates_and_filters_by_dev_status
        claim_type: listing
        grounds:
          - endpoints[GET /innovation-projects]
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          total_count must count the whole filtered set, not the returned page: three projects
          with limit 2 give total_count 3 with has_more true, and the dev_status filter narrows
          total_count to the single screened row.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-01T00:00:00Z."
            - "A SNACK gate 2 with an empty checklist."
            - "Three SNACK projects, exactly one of them screened to SCREENED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /stage-gates"
              payload: { gate_number: 2, category: "SNACK", stage_from: "SCREENED", stage_to: "PILOT_QUALIFIED", required_deliverable_types: [], quorum_size: 1, veto_functions: [], npv_hurdle_usd: 0.00, payback_months_max: 24, gross_margin_floor_pct: 0.00, readiness_floor_index: 0.00 }
              as: PortfolioAdmin
              captures: { lg_id: $.data.id }
            - call: "POST /innovation-projects"
              payload: { name: "Toffee Crunch Bites", brand: "GrainWell", category: "SNACK", project_type: "LINE_EXTENSION", strategic_fit_score: 8, consumer_need_score: 7, target_gross_margin_pct: 36, category_attractiveness_score: 7, development_budget_cap_usd: 500000.00 }
              as: InnovationLead
              as_user_id: "lead-l1"
              captures: { l1_id: $.data.id }
            - call: "POST /innovation-projects"
              payload: { name: "Toffee Crunch Minis", brand: "GrainWell", category: "SNACK", project_type: "LINE_EXTENSION", strategic_fit_score: 8, consumer_need_score: 7, target_gross_margin_pct: 36, category_attractiveness_score: 7, development_budget_cap_usd: 500000.00 }
              as: InnovationLead
              as_user_id: "lead-l1"
              captures: { l2_id: $.data.id }
            - call: "POST /innovation-projects"
              payload: { name: "Toffee Crunch Bars", brand: "GrainWell", category: "SNACK", project_type: "LINE_EXTENSION", strategic_fit_score: 8, consumer_need_score: 7, target_gross_margin_pct: 36, category_attractiveness_score: 7, development_budget_cap_usd: 500000.00 }
              as: InnovationLead
              as_user_id: "lead-l1"
              captures: { l3_id: $.data.id }
            - call: "POST /innovation-projects/${l3_id}/screen"
              payload: { screening_notes: "Fits the better-for-you platform." }
              as: GateChair
              as_user_id: "chair-l1"
          trigger:
            - call: "GET /innovation-projects?limit=2&offset=0"
              as: PortfolioAdmin
            - call: "GET /innovation-projects?dev_status=SCREENED"
              as: PortfolioAdmin
          assert:
            - "the first call returns 200 with response_type array, total_count == 3, has_more == true and exactly 2 rows"
            - "the second call returns total_count == 1, has_more == false and the single row is InnovationProject.${l3_id}"
            - "InnovationProject.${l3_id}.dev_status == SCREENED while ${l1_id} and ${l2_id} stay IDEA"
            - "the unfiltered list orders rows by created_at ascending, so ${l1_id} precedes ${l2_id}"

      - name: entity_get_unknown_project_id_not_found
        claim_type: not_found
        grounds:
          - validations[priority 3]
          - errors[ERR_PROJECT_NOT_FOUND]
        distinguishing_aspect: |
          A syntactically valid UUID that resolves to nothing must be a 404 with the resource's
          own error id, not a 400 and not an empty 200 body.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /innovation-projects/00000000-0000-0000-0000-000000009999"
              as: PortfolioAdmin
          assert:
            - "the response is 404 with data.error_id == ERR_PROJECT_NOT_FOUND"
            - "response_type == error and meta.api_request_id is present"

      - name: entity_create_project_missing_target_margin_rejected
        claim_type: required_fields
        grounds:
          - entities.InnovationProject.fields.target_gross_margin_pct
          - validations[priority 4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          target_gross_margin_pct has source input and no default, and screening_score cannot be
          derived without it, so omitting it is a 400 rather than a create with margin_norm 0.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /innovation-projects"
              payload: { name: "Toffee Crunch Bites", brand: "GrainWell", category: "SNACK", project_type: "LINE_EXTENSION", strategic_fit_score: 8, consumer_need_score: 7, category_attractiveness_score: 7, development_budget_cap_usd: 500000.00 }
              as: InnovationLead
          assert:
            - "the response is 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /innovation-projects returns total_count 0, so no partial row was stored"

      - name: entity_invalid_category_enum_and_out_of_range_score_rejected
        claim_type: type_constraints
        grounds:
          - entities.InnovationProject.fields.category
          - entities.InnovationProject.fields.strategic_fit_score
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Two distinct shape failures on the same endpoint: an out-of-enum category and a
          strategic_fit_score above the declared 0.00..10.00 range both stop at priority 4.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /innovation-projects"
              payload: { name: "Frozen Yuzu Pops", brand: "GrainWell", category: "FROZEN", project_type: "LINE_EXTENSION", strategic_fit_score: 8, consumer_need_score: 7, target_gross_margin_pct: 36, category_attractiveness_score: 7, development_budget_cap_usd: 500000.00 }
              as: InnovationLead
            - call: "POST /innovation-projects"
              payload: { name: "Toffee Crunch Bites", brand: "GrainWell", category: "SNACK", project_type: "LINE_EXTENSION", strategic_fit_score: 12.5, consumer_need_score: 7, target_gross_margin_pct: 36, category_attractiveness_score: 7, development_budget_cap_usd: 500000.00 }
              as: InnovationLead
          assert:
            - "both calls return 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /innovation-projects returns total_count 0"

      - name: entity_label_approval_defaults_unsupported_claims_to_empty_array
        claim_type: defaults
        grounds:
          - entities.LabelApproval.fields.unsupported_claims
          - entities.LabelApproval.fields.status
          - endpoints[POST /innovation-projects/{id}/label-approvals]
        distinguishing_aspect: |
          unsupported_claims declares default [] and is only populated by a CONDITIONAL decision,
          so a fresh DRAFT label must carry an empty array rather than null.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-01T00:00:00Z."
            - "One SNACK project in dev_status IDEA with one DRAFT formulation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /innovation-projects"
              payload: { name: "Toffee Crunch Bites", brand: "GrainWell", category: "SNACK", project_type: "LINE_EXTENSION", strategic_fit_score: 8, consumer_need_score: 7, target_gross_margin_pct: 36, category_attractiveness_score: 7, development_budget_cap_usd: 500000.00 }
              as: InnovationLead
              as_user_id: "lead-d1"
              captures: { d1_id: $.data.id, d1_v1: $.data.version }
            - call: "POST /innovation-projects/${d1_id}/formulations"
              payload: { expected_project_version: "${d1_v1}", spec_summary: "Toffee inclusion at 12 percent", allergen_regime: "NONE", target_shelf_life_days: 180, unit_cost_usd: 3.2000 }
              as: RnDLead
              captures: { d1_f_id: $.data.id }
          trigger:
            - call: "POST /innovation-projects/${d1_id}/label-approvals"
              payload: { formulation_id: "${d1_f_id}", label_version: "v1", claims: ["No artificial colors"] }
              as: InnovationLead
              captures: { d1_lab_id: $.data.id }
          assert:
            - "the response code is 201"
            - "LabelApproval.${d1_lab_id}.status == DRAFT and unsupported_claims == []"
            - "LabelApproval.${d1_lab_id}.decided_by_user_id is null"
            - "LabelApproval.${d1_lab_id}.formulation_id == ${d1_f_id} and version == 1"
            - "Formulation.${d1_f_id}.revision == 1 and status == DRAFT and best_pilot_yield_pct == 0.00"

      - name: entity_concept_test_computed_score_and_authoritative_flag
        claim_type: computed_fields
        grounds:
          - calculations.concept_score
          - entities.ConceptTest.fields.concept_score
          - entities.ConceptTest.fields.is_authoritative
        distinguishing_aspect: |
          concept_score is computed from three inputs through a confidence band the client never
          sends, and is_authoritative is a derived single-winner flag: three stored tests keep
          three different scores while only the latest fielded_at stays authoritative.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-01T00:00:00Z."
            - "One SNACK project in dev_status IDEA."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /innovation-projects"
              payload: { name: "Toffee Crunch Bites", brand: "GrainWell", category: "SNACK", project_type: "LINE_EXTENSION", strategic_fit_score: 8, consumer_need_score: 7, target_gross_margin_pct: 36, category_attractiveness_score: 7, development_budget_cap_usd: 500000.00 }
              as: InnovationLead
              as_user_id: "lead-k1"
              captures: { k1_id: $.data.id }
            - call: "POST /innovation-projects/${k1_id}/concept-tests"
              payload: { test_type: "MONADIC", sample_size: 400, purchase_intent_top2_pct: 62.00, uniqueness_pct: 48.00, fielded_at: "2026-07-05T00:00:00Z" }
              as: InnovationLead
              captures: { k1_t1_id: $.data.id }
            - call: "POST /innovation-projects/${k1_id}/concept-tests"
              payload: { test_type: "SEQUENTIAL_MONADIC", sample_size: 250, purchase_intent_top2_pct: 42.00, uniqueness_pct: 35.00, fielded_at: "2026-07-12T00:00:00Z" }
              as: InnovationLead
              captures: { k1_t2_id: $.data.id }
          trigger:
            - call: "POST /innovation-projects/${k1_id}/concept-tests"
              payload: { test_type: "IN_HOME_USE", sample_size: 90, purchase_intent_top2_pct: 70.00, uniqueness_pct: 55.00, fielded_at: "2026-07-19T00:00:00Z" }
              as: InnovationLead
              captures: { k1_t3_id: $.data.id }
          assert:
            - "ConceptTest.${k1_t1_id}.concept_score == 56.40, being 56.4000 at confidence 1.00 for sample_size 400"
            - "ConceptTest.${k1_t2_id}.concept_score == 37.24, being 39.2000 at confidence 0.95 for sample_size 250"
            - "ConceptTest.${k1_t3_id}.concept_score == 54.40, being 64.0000 at confidence 0.85 for sample_size 90"
            - "ConceptTest.${k1_t3_id}.is_authoritative == true"
            - "ConceptTest.${k1_t1_id}.is_authoritative == false and ConceptTest.${k1_t2_id}.is_authoritative == false"
            - "the highest raw score belongs to ${k1_t3_id} yet its confidence band still leaves it below ${k1_t1_id}, so the band is not cosmetic"
            - "GET /innovation-projects/${k1_id}/concept-tests returns total_count 3"

      - name: entity_project_system_fields_refresh_on_mutation
        claim_type: system_fields
        grounds:
          - entities.InnovationProject.fields.owner_user_id
          - entities.InnovationProject.fields.dev_status
          - complexity_profile.complexity_layers[optimistic_concurrency]
        distinguishing_aspect: |
          version and updated_at are server-owned: screening the project by a different user
          bumps version to 2 and moves updated_at while owner_user_id stays the creating lead
          and created_at is untouched.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-01T00:00:00Z."
            - "A SNACK gate 2 with an empty checklist and one SNACK project in dev_status IDEA."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /stage-gates"
              payload: { gate_number: 2, category: "SNACK", stage_from: "SCREENED", stage_to: "PILOT_QUALIFIED", required_deliverable_types: [], quorum_size: 1, veto_functions: [], npv_hurdle_usd: 0.00, payback_months_max: 24, gross_margin_floor_pct: 0.00, readiness_floor_index: 0.00 }
              as: PortfolioAdmin
            - call: "POST /innovation-projects"
              payload: { name: "Toffee Crunch Bites", brand: "GrainWell", category: "SNACK", project_type: "LINE_EXTENSION", strategic_fit_score: 8, consumer_need_score: 7, target_gross_margin_pct: 36, category_attractiveness_score: 7, development_budget_cap_usd: 500000.00 }
              as: InnovationLead
              as_user_id: "lead-s1"
              captures: { s1_id: $.data.id, s1_v1: $.data.version }
          trigger:
            - call: "POST /innovation-projects/${s1_id}/screen"
              payload: { screening_notes: "Approved into stage 2." }
              as: GateChair
              as_user_id: "chair-s1"
          assert:
            - "${s1_v1} == 1 and InnovationProject.${s1_id}.version == 2 after the trigger"
            - "InnovationProject.${s1_id}.updated_at is strictly after created_at"
            - "InnovationProject.${s1_id}.owner_user_id == lead-s1, unchanged by the chair's screen call"
            - "InnovationProject.${s1_id}.screening_score == 79.00 and screening_decision == PASSED"
            - "InnovationProject.${s1_id}.dev_status == SCREENED, a system field the client never sent"

      - name: entity_gate_vote_is_append_only_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.GateVote
          - endpoints[POST /gate-reviews/{id}/votes]
          - endpoints[GET /gate-reviews/{id}/votes]
        distinguishing_aspect: |
          GateVote declares common_fields false, so it carries id and created_at only: §1.5 offers
          no update or delete route and a second vote appends a new row instead of amending the
          first, whose fields must be byte-identical afterwards.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-01T00:00:00Z."
            - "A SNACK gate 2 with an empty checklist, quorum 2 and no veto functions."
            - "One screened SNACK project with an IN_SESSION gate 2 review."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /stage-gates"
              payload: { gate_number: 2, category: "SNACK", stage_from: "SCREENED", stage_to: "PILOT_QUALIFIED", required_deliverable_types: [], quorum_size: 2, veto_functions: [], npv_hurdle_usd: 0.00, payback_months_max: 24, gross_margin_floor_pct: 0.00, readiness_floor_index: 0.00 }
              as: PortfolioAdmin
              captures: { v_g2_id: $.data.id }
            - call: "POST /innovation-projects"
              payload: { name: "Toffee Crunch Bites", brand: "GrainWell", category: "SNACK", project_type: "LINE_EXTENSION", strategic_fit_score: 8, consumer_need_score: 7, target_gross_margin_pct: 36, category_attractiveness_score: 7, development_budget_cap_usd: 500000.00 }
              as: InnovationLead
              as_user_id: "lead-v1"
              captures: { v1_id: $.data.id }
            - call: "POST /innovation-projects/${v1_id}/screen"
              payload: { screening_notes: "Into stage 2." }
              as: GateChair
              as_user_id: "chair-v1"
            - call: "POST /innovation-projects/${v1_id}/gate-reviews"
              payload: { gate_id: "${v_g2_id}", scheduled_at: "2026-08-05T09:00:00Z" }
              as: GateChair
              as_user_id: "chair-v1"
              captures: { v1_gr_id: $.data.id }
            - call: "POST /gate-reviews/${v1_gr_id}/open"
              as: GateChair
              as_user_id: "chair-v1"
            - call: "POST /gate-reviews/${v1_gr_id}/votes"
              payload: { function: "OPERATIONS", vote: "APPROVE", rationale: "Line capacity confirmed." }
              as: FunctionalReviewer
              as_user_id: "rev-ops-v"
          trigger:
            - call: "POST /gate-reviews/${v1_gr_id}/votes"
              payload: { function: "MARKETING", vote: "APPROVE_WITH_CONDITIONS", rationale: "Copy pending." }
              as: FunctionalReviewer
              as_user_id: "rev-mkt-v"
            - call: "GET /gate-reviews/${v1_gr_id}/votes"
              as: GateChair
              as_user_id: "chair-v1"
          assert:
            - "the second vote returns 201 and GET /gate-reviews/${v1_gr_id}/votes returns total_count 2"
            - "the OPERATIONS row still reads function OPERATIONS, vote APPROVE, voter_user_id rev-ops-v and rationale Line capacity confirmed."
            - "no GateVote row exposes a version or updated_at field"
            - "§1.5 declares no PATCH, PUT or DELETE route for GateVote, so the only mutation is append"
            - "GateReview.${v1_gr_id}.vote_count == 2 and status == IN_SESSION"

      - name: entity_deliverable_requires_existing_parent_project_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Deliverable.parent
          - validations[priority 3]
          - errors[ERR_PROJECT_NOT_FOUND]
        distinguishing_aspect: |
          The nested create route resolves the path parent before it looks at the body, so an
          unknown project_id is ERR_PROJECT_NOT_FOUND even though the gate_id in the body exists.
        test_recipe:
          setup:
            - "Empty database."
            - "One SNACK gate 2 exists; no project exists."
          setup_api_calls:
            - call: "POST /stage-gates"
              payload: { gate_number: 2, category: "SNACK", stage_from: "SCREENED", stage_to: "PILOT_QUALIFIED", required_deliverable_types: [], quorum_size: 1, veto_functions: [], npv_hurdle_usd: 0.00, payback_months_max: 24, gross_margin_floor_pct: 0.00, readiness_floor_index: 0.00 }
              as: PortfolioAdmin
              captures: { np_g2_id: $.data.id }
          trigger:
            - call: "POST /innovation-projects/00000000-0000-0000-0000-000000009999/deliverables"
              payload: { gate_id: "${np_g2_id}", deliverable_type: "MANUFACTURING_READINESS", owner_function: "OPERATIONS" }
              as: GateChair
          assert:
            - "the response is 404 with data.error_id == ERR_PROJECT_NOT_FOUND"
            - "the error is not ERR_STAGE_GATE_NOT_FOUND, because the body FK does resolve"
            - "GET /deliverables returns total_count 0"

      - name: entity_deliverable_prerequisite_graph_is_reverse_queryable
        claim_type: graph
        grounds:
          - entities.Deliverable.fields.prerequisite_deliverable_id
          - endpoints[GET /deliverables]
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          The self-referential prerequisite edge is a real graph edge, not a comment: after
          linking a two-hop chain, the reverse lookup by prerequisite_deliverable_id must return
          exactly the one dependent row at each hop.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-01T00:00:00Z."
            - "A SNACK gate 2 with an empty checklist and one SNACK project in dev_status IDEA."
            - "Three manually created PENDING deliverables on that project and gate."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /stage-gates"
