              payload: { decision: "APPROVE", note: "Worth testing anyway" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { err: $.data.error_id }
            - call: "GET /pentest/scope-items/${si_a_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { st_mid: $.data.status }
            - call: "POST /pentest/scope-items/${si_a_id}/decision"
