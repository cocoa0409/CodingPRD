# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Every grounds ref resolves into SCAFFOLD.yaml §1.1–§1.7. Every setup_api_calls / trigger
# call is a declared §1.5 endpoint; formula-derived asserts are pre-computed literals.
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: di_valuation_sales_comparison_vs_assessment_equity
        grounds:
          - calculations.opinion_of_value
          - entities.Appeal.fields.valuation_method
          - entities.Appeal.fields.requested_value_cents
          - entities.Evidence.fields.adjusted_sale_value_cents
          - entities.Jurisdiction.fields.equalization_ratio
        distinguishing_aspect: |
          Same three comparables produce requested_value_cents 30000000 under SALES_COMPARISON
          (median of adjusted sale values) but 29000000 under ASSESSMENT_EQUITY
          (median of comp_assessed_value_cents / 0.90) — a dual-variant calc in the VALUATION
          entity domain (Appeal/Evidence), distinct from the fee/billing dual-variant.
        test_recipe:
          setup:
            - "One analyst, one client, one jurisdiction (equalization_ratio 0.90, filing_window_days 60)."
            - "Two parcels each with a 2026 assessment original_assessed_value_cents=30000000, millage 25.0, notice_date 2026-06-15."
            - "Appeal A uses SALES_COMPARISON, appeal B uses ASSESSMENT_EQUITY; both carry the identical 3 comps."
          setup_api_calls:
            - call: "POST /api/analysts"
              payload: { full_name: "Ana Lyst", email: "ana@firm.test", license_number: "LIC-1" }
              as: FirmAdmin
              captures: { an_id: $.data.id }
            - call: "POST /api/clients"
              payload: { full_name: "Tax Payer", email: "tp@x.test", entity_type: "INDIVIDUAL" }
              as: FirmAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /api/jurisdictions"
              payload: { name: "County A", state_code: "CA", filing_window_days: 60, equalization_ratio: 0.90 }
              as: FirmAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /api/fee-agreements"
              payload: { client_id: "${cl_id}" }
              as: FirmAdmin
              captures: { fa_id: $.data.id }
            - call: "POST /api/parcels"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${jur_id}", apn: "APN-A", address: "1 A St", property_class: "RESIDENTIAL" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /api/assessments"
              payload: { parcel_id: "${p1_id}", tax_year: 2026, original_assessed_value_cents: 30000000, millage_rate: 25.0, notice_date: "2026-06-15T00:00:00Z" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { as1_id: $.data.id }
            - call: "POST /api/appeals"
              payload: { assessment_id: "${as1_id}", analyst_id: "${an_id}", fee_agreement_id: "${fa_id}", valuation_method: "SALES_COMPARISON" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { ap1_id: $.data.id }
            - call: "POST /api/appeals/${ap1_id}/evidence"
              payload: { comp_address: "2 A St", sale_price_cents: 30000000, sale_date: "2025-06-01T00:00:00Z", comp_assessed_value_cents: 27900000, adjustment_pct: 0.00 }
              as: Analyst
              as_user_id: "${an_id}"
            - call: "POST /api/appeals/${ap1_id}/evidence"
              payload: { comp_address: "3 A St", sale_price_cents: 32000000, sale_date: "2025-06-01T00:00:00Z", comp_assessed_value_cents: 25200000, adjustment_pct: -0.05 }
              as: Analyst
              as_user_id: "${an_id}"
            - call: "POST /api/appeals/${ap1_id}/evidence"
              payload: { comp_address: "4 A St", sale_price_cents: 28000000, sale_date: "2025-06-01T00:00:00Z", comp_assessed_value_cents: 26100000, adjustment_pct: 0.05 }
              as: Analyst
              as_user_id: "${an_id}"
            - call: "POST /api/parcels"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${jur_id}", apn: "APN-B", address: "10 B St", property_class: "RESIDENTIAL" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { p2_id: $.data.id }
            - call: "POST /api/assessments"
              payload: { parcel_id: "${p2_id}", tax_year: 2026, original_assessed_value_cents: 30000000, millage_rate: 25.0, notice_date: "2026-06-15T00:00:00Z" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { as2_id: $.data.id }
            - call: "POST /api/appeals"
              payload: { assessment_id: "${as2_id}", analyst_id: "${an_id}", fee_agreement_id: "${fa_id}", valuation_method: "ASSESSMENT_EQUITY" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { ap2_id: $.data.id }
            - call: "POST /api/appeals/${ap2_id}/evidence"
              payload: { comp_address: "2 A St", sale_price_cents: 30000000, sale_date: "2025-06-01T00:00:00Z", comp_assessed_value_cents: 27900000, adjustment_pct: 0.00 }
              as: Analyst
              as_user_id: "${an_id}"
            - call: "POST /api/appeals/${ap2_id}/evidence"
              payload: { comp_address: "3 A St", sale_price_cents: 32000000, sale_date: "2025-06-01T00:00:00Z", comp_assessed_value_cents: 25200000, adjustment_pct: -0.05 }
              as: Analyst
              as_user_id: "${an_id}"
            - call: "POST /api/appeals/${ap2_id}/evidence"
              payload: { comp_address: "4 A St", sale_price_cents: 28000000, sale_date: "2025-06-01T00:00:00Z", comp_assessed_value_cents: 26100000, adjustment_pct: 0.05 }
              as: Analyst
              as_user_id: "${an_id}"
          trigger:
            - call: "POST /api/appeals/${ap1_id}/file"
              payload: {}
              as: Analyst
              as_user_id: "${an_id}"
              captures: { req1: $.data.requested_value_cents }
            - call: "POST /api/appeals/${ap2_id}/file"
              payload: {}
              as: Analyst
              as_user_id: "${an_id}"
              captures: { req2: $.data.requested_value_cents }
          assert:
            - "Appeal.${ap1_id}.requested_value_cents == 30000000"
            - "Appeal.${ap2_id}.requested_value_cents == 29000000"
            - "Appeal.${ap1_id}.requested_value_cents != Appeal.${ap2_id}.requested_value_cents"

      - name: di_fee_provisional_vs_final_diverge
        grounds:
          - calculations.contingency_fee
          - entities.Appeal.fields.projected_fee_cents
          - entities.Invoice.fields.fee_amount_cents
          - entities.Invoice.fields.gross_savings_cents
        distinguishing_aspect: |
          The contingency_fee calc (billing/Invoice domain) yields a PROVISIONAL fee of 15000
          on Appeal.projected_fee_cents (over projected_savings 25000, floored to minimum) but a
          FINAL fee of 28250 on Invoice.fee_amount_cents (over realized_savings 75000) — divergence
          on money/fee, a different entity domain from the valuation dual-variant.
        test_recipe:
          setup:
            - "Analyst, client, jurisdiction, ACTIVE fee agreement (default tiers 0.40/0.33/0.25, ceilings 50000/150000, min 15000)."
            - "Assessment original 30000000, millage 25.0. Appeal ASSESSMENT_EQUITY with the 3 comps -> requested 29000000 -> projected_savings 25000 -> projected_fee 15000."
            - "Schedule+hold a hearing, then record decision_value 27000000 -> realized_savings 75000 -> Invoice fee 28250."
          setup_api_calls:
            - call: "POST /api/analysts"
              payload: { full_name: "Ana", email: "ana2@firm.test", license_number: "LIC-2" }
              as: FirmAdmin
              captures: { an_id: $.data.id }
            - call: "POST /api/analysts"
              payload: { full_name: "Bea", email: "bea2@firm.test", license_number: "LIC-3" }
              as: FirmAdmin
              captures: { an2_id: $.data.id }
            - call: "POST /api/clients"
              payload: { full_name: "TP2", email: "tp2@x.test", entity_type: "BUSINESS" }
              as: FirmAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /api/jurisdictions"
              payload: { name: "County B", state_code: "CA", filing_window_days: 60, equalization_ratio: 0.90 }
              as: FirmAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /api/fee-agreements"
              payload: { client_id: "${cl_id}" }
              as: FirmAdmin
              captures: { fa_id: $.data.id }
            - call: "POST /api/fee-agreements/${fa_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
            - call: "POST /api/parcels"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${jur_id}", apn: "APN-C", address: "5 C St", property_class: "COMMERCIAL" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { p_id: $.data.id }
            - call: "POST /api/assessments"
              payload: { parcel_id: "${p_id}", tax_year: 2026, original_assessed_value_cents: 30000000, millage_rate: 25.0, notice_date: "2026-06-15T00:00:00Z" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { as_id: $.data.id }
            - call: "POST /api/appeals"
              payload: { assessment_id: "${as_id}", analyst_id: "${an_id}", fee_agreement_id: "${fa_id}", valuation_method: "ASSESSMENT_EQUITY" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { ap_id: $.data.id }
            - call: "POST /api/appeals/${ap_id}/evidence"
              payload: { comp_address: "6 C St", sale_price_cents: 30000000, sale_date: "2025-06-01T00:00:00Z", comp_assessed_value_cents: 27900000, adjustment_pct: 0.00 }
              as: Analyst
              as_user_id: "${an_id}"
            - call: "POST /api/appeals/${ap_id}/evidence"
              payload: { comp_address: "7 C St", sale_price_cents: 32000000, sale_date: "2025-06-01T00:00:00Z", comp_assessed_value_cents: 25200000, adjustment_pct: -0.05 }
              as: Analyst
              as_user_id: "${an_id}"
            - call: "POST /api/appeals/${ap_id}/evidence"
              payload: { comp_address: "8 C St", sale_price_cents: 28000000, sale_date: "2025-06-01T00:00:00Z", comp_assessed_value_cents: 26100000, adjustment_pct: 0.05 }
              as: Analyst
              as_user_id: "${an_id}"
            - call: "POST /api/appeals/${ap_id}/file"
              payload: {}
              as: Analyst
              as_user_id: "${an_id}"
              captures: { prov_fee: $.data.projected_fee_cents, prov_sav: $.data.projected_savings_cents }
            - call: "POST /api/appeals/${ap_id}/hearings"
              payload: { representative_id: "${an2_id}", docket_room: "R1", scheduled_start: "2026-08-01T10:00:00Z", scheduled_end: "2026-08-01T11:00:00Z" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { h_id: $.data.id }
            - call: "POST /api/hearings/${h_id}/hold"
              payload: { outcome_note: "heard" }
              as: Analyst
              as_user_id: "${an2_id}"
          trigger:
            - call: "POST /api/appeals/${ap_id}/record-decision"
              payload: { decision_value_cents: 27000000 }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { realized: $.data.realized_savings_cents }
          assert:
            - "Appeal.${ap_id}.projected_savings_cents == 25000"
            - "Appeal.${ap_id}.projected_fee_cents == 15000"
            - "Appeal.${ap_id}.realized_savings_cents == 75000"
            - "Invoice(appeal_id=${ap_id}).gross_savings_cents == 75000"
            - "Invoice(appeal_id=${ap_id}).fee_amount_cents == 28250"
            - "Appeal.${ap_id}.projected_fee_cents != Invoice(appeal_id=${ap_id}).fee_amount_cents"

  - rule_id: combinatorial_formula
    instances:
      - name: ci_fee_tiered_marginal_spans_two_tiers
        grounds:
          - calculations.contingency_fee
          - entities.FeeAgreement.fields.tier1_ceiling_cents
          - entities.FeeAgreement.fields.tier2_ceiling_cents
          - entities.FeeAgreement.fields.minimum_fee_cents
          - entities.Invoice.fields.fee_amount_cents
        distinguishing_aspect: |
          MODE (a) non-linear multi-input formula: realized_savings 75000 straddles tier1
          (first 50000 @0.40 = 20000) and tier2 (next 25000 @0.33 = 8250), summed then rounded
          once and floored by minimum 15000 -> fee_amount_cents == 28250 (marginal tiered-rate
          selection with min/clamp/max over >=3 inputs).
        test_recipe:
          setup:
            - "ACTIVE fee agreement (default tiers). Appeal SALES_COMPARISON requested 30000000, decision 27000000 -> realized 75000."
          setup_api_calls:
            - call: "POST /api/analysts"
              payload: { full_name: "A", email: "a3@f.test", license_number: "L4" }
              as: FirmAdmin
              captures: { an_id: $.data.id }
            - call: "POST /api/analysts"
              payload: { full_name: "B", email: "b3@f.test", license_number: "L5" }
              as: FirmAdmin
              captures: { an2_id: $.data.id }
            - call: "POST /api/clients"
