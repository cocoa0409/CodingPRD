              captures: { site_d_id: $.data.id }
            - call: "POST /stormwater/construction-sites/${site_d_id}/submit-esc-plan"
              payload: { esc_plan_reference: "ESC-D-1" }
              as: ConstructionInspector
              as_user_id: "insp-01"
            - call: "POST /stormwater/construction-sites/${site_d_id}/esc-review"
