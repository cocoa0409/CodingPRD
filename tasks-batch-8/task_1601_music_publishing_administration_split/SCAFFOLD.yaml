  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default (before any call): exactly 2026-08-01T00:00:00Z; the clock NEVER falls back to wall-clock time. All timestamp reads (paid_at, submitted_at, lazy expiry/window derivation) use this clock."
    roles: [PublisherAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Lazy time-based statuses (TerminationClaim NOTICE_WINDOW_OPEN/LAPSED, SubPublishingAgreement EXPIRED) are re-evaluated against the new clock value on subsequent reads/actions"]

  # --- Writer ---
