# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_2491_product_sampling_seeding_campaign
#
# Breadth probe over §1.1–§1.7. Section names and claim_type names are taken
# from references/claim-extraction-guide.md; nothing is invented here.
#
# Fixed actor ids used across instances (opaque roles carry X-User-ID):
#   MOD_A = 11111111-1111-4111-8111-111111111111   (ComplianceModerator A)
#   MOD_B = 22222222-2222-4222-8222-222222222222   (ComplianceModerator B)
#   NOBODY = 99999999-9999-4999-8999-999999999999  (never-persisted uuid,
#            used only as a guaranteed-absent id in 404 corners)
# The logical clock is pinned to 2026-08-01T00:00:00Z by the first call of every
# recipe, so every datetime assertion below is a literal.
#
# The canonical kit for most recipes is three ACTIVE lines
#   HERO-1  1417 x 1 @ 0.80 discount -> extended 283
#   ACC-2    388 x 2 @ 0.85 discount -> extended 116
#   INS-3    554 x 1 @ 0.90 discount -> extended  55
# summing (round-per-line, then sum) to kit_assembly_unit_cost_cents == 454 with
# kit_unit_total == 4; with freight_cents_per_kit 300 every shipment commits 754.
#
# ERROR-CATALOG COVERAGE MAP (§1.6 has 51 codes; every one is triggered by an
# instance in this file or by a named §1.8 instance):
#   ERR_UNAUTHENTICATED ..................... rbac/missing_user_id_header_is_unauthenticated
#   ERR_FORBIDDEN_ROLE ...................... validations/wrong_role_beats_existence_on_an_unknown_campaign
#   ERR_NOT_RESOURCE_OWNER .................. rbac/panelist_cannot_read_another_panelists_enrollment
#   ERR_INVALID_REQUEST ..................... entities/kit_line_missing_required_component_sku_is_rejected
#   ERR_CAMPAIGN_WINDOW_INVALID ............. validations/campaign_window_end_equal_to_start_is_rejected
#   ERR_WAVE_WINDOW_INVALID ................. validations/wave_window_end_before_start_is_rejected
#   ERR_CAMPAIGN_NOT_FOUND .................. entities/campaign_not_found_on_unknown_uuid
#   ERR_KIT_LINE_NOT_FOUND .................. errors/kit_line_receipt_on_unknown_line_not_found
#   ERR_FULFILLMENT_CENTER_NOT_FOUND ........ errors/wave_create_on_unknown_center_not_found
#   ERR_FULFILLMENT_WAVE_NOT_FOUND .......... errors/wave_lock_on_unknown_wave_not_found
#   ERR_PANELIST_NOT_FOUND .................. errors/enrollment_create_with_unknown_panelist_not_found
#   ERR_ENROLLMENT_NOT_FOUND ................ errors/purchase_match_with_unknown_enrollment_not_found
#   ERR_SHIPMENT_NOT_FOUND .................. entities/diversion_case_body_fks_validated_left_to_right_shipment_not_found
#   ERR_REVIEW_NOT_FOUND .................... errors/syndication_record_with_unknown_review_not_found
#   ERR_RETAILER_NOT_FOUND .................. errors/campaign_create_with_unknown_syndication_retailer_not_found
#   ERR_SYNDICATION_RECORD_NOT_FOUND ........ errors/dispatch_on_unknown_syndication_record_not_found
#   ERR_DIVERSION_CASE_NOT_FOUND ............ errors/investigate_on_unknown_diversion_case_not_found
#   ERR_LIFT_ANALYSIS_NOT_FOUND ............. errors/get_unknown_lift_analysis_not_found
#   ERR_PURCHASE_MATCH_NOT_FOUND ............ errors/get_unknown_purchase_match_not_found
#   ERR_INVALID_CAMPAIGN_TRANSITION ......... state_machines/activate_sampling_without_a_screen_passed_enrollment_is_rejected
#   ERR_INVALID_KIT_LINE_STATE .............. errors/retire_an_already_retired_kit_line_is_rejected
#   ERR_INVALID_WAVE_STATE .................. §1.8 cross_entity_state_dependency/shipment_allocation_requires_planned_wave
#   ERR_INVALID_SHIPMENT_STATE .............. endpoints/delivery_is_only_allowed_after_the_wave_has_been_released
#   ERR_INVALID_REVIEW_STATE ................ errors/submitting_the_same_review_twice_is_rejected
#   ERR_INVALID_SYNDICATION_STATE ........... errors/dispatching_an_already_syndicated_record_is_rejected
#   ERR_INVALID_DIVERSION_CASE_STATE ........ errors/dismissing_an_open_diversion_case_is_rejected
#   ERR_ENROLLMENT_NOT_SCREENABLE ........... state_machines/resubmit_screening_after_three_attempts_is_rejected
#   ERR_CAMPAIGN_NOT_ACCEPTING_ENROLLMENTS .. §1.8 priority_pair_validation_conflict/suspended_campaign_state_beats_exhausted_budget_on_allocation
#   ERR_STALE_CAMPAIGN_VERSION .............. cross_cutting_complexity_layers/occ_lift_analysis_rejects_stale_expected_campaign_version
#   ERR_STALE_ENROLLMENT_VERSION ............ cross_cutting_complexity_layers/occ_allocation_rejects_stale_expected_enrollment_version
#   ERR_PANELIST_BANNED ..................... errors/banned_panelist_cannot_enroll_again
#   ERR_PANELIST_INTEGRITY_HOLD ............. §1.8 priority_pair_validation_conflict/flagged_panelist_safety_beats_unregistered_retailer_referential_on_syndication
#   ERR_SEGREGATION_OF_DUTIES ............... errors/same_moderator_cannot_request_changes_then_approve
#   ERR_CAMPAIGN_POSTURE_FROZEN ............. state_machines/resume_is_guarded_by_compliance_posture_frozen
#   ERR_CAMPAIGN_POSTURE_RESTRICTED ......... errors/restricted_posture_blocks_syndication_dispatch
#   ERR_HONEST_OPINION_NOT_ATTESTED ......... validations/missing_attestation_outranks_missing_disclosure_and_a_short_body
#   ERR_DISCLOSURE_STATEMENT_MISSING ........ validations/missing_attestation_outranks_missing_disclosure_and_a_short_body
#   ERR_REVIEW_TOO_SHORT .................... validations/missing_attestation_outranks_missing_disclosure_and_a_short_body
#   ERR_RETAILER_NOT_IN_CAMPAIGN ............ validations/syndicating_to_a_retailer_outside_the_campaign_list_is_rejected
#   ERR_RETAILER_FEED_PAUSED ................ validations/dispatch_to_a_paused_retailer_feed_is_rejected
#   ERR_DUPLICATE_ENROLLMENT ................ validations/second_enrollment_for_the_same_campaign_and_panelist_is_rejected
#   ERR_DUPLICATE_SYNDICATION_TARGET ........ validations/second_syndication_record_for_the_same_review_and_retailer_is_rejected
#   ERR_HOLDOUT_ENROLLMENT_NOT_SAMPLEABLE ... validations/holdout_enrollment_cannot_be_allocated_a_sample
#   ERR_ENROLLMENT_NOT_ELIGIBLE_FOR_REVIEW .. validations/submitting_before_the_sample_is_delivered_is_rejected
#   ERR_CAMPAIGN_KIT_EMPTY .................. state_machines/open_screening_without_an_active_kit_line_is_rejected
#   ERR_WAVE_CAPACITY_EXCEEDED .............. validations/wave_planned_capacity_is_an_aggregate_ceiling_over_kit_units
#   ERR_CENTER_CAPACITY_EXCEEDED ............ §1.8 resource_temporal_overlap/center_aggregate_capacity_half_open_windows
#   ERR_KIT_STOCK_INSUFFICIENT .............. calculations/short_stock_on_one_line_leaves_every_kit_line_untouched
#   ERR_WRITE_OFF_EXCEEDS_AVAILABLE ......... validations/write_off_of_more_units_than_available_is_rejected
#   ERR_PURCHASE_MATCH_OUT_OF_WINDOW ........ validations/purchase_one_second_past_the_conversion_tail_is_rejected
#   ERR_CAMPAIGN_BUDGET_EXHAUSTED ........... validations/allocation_over_the_remaining_budget_is_rejected
#
# complexity_layers coverage: optimistic_concurrency and cascading_side_effects,
# dual_variant_calculation and rate_threshold_triggers are all handled in the
# cross_cutting_complexity_layers section; the scaffold's fifth declared layer,
# selector_policy, has no row in the claim-extraction guide and is covered by the
# calculations-section instances for kit_reservation_selector.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: campaign_creation_returns_the_full_declared_field_set
        claim_type: creation
        grounds:
          - entities.Campaign
          - endpoints[POST /campaigns]
        distinguishing_aspect: "A campaign created with every required input plus every optional input comes back 201 with all §1.1 Campaign fields present and every computed counter seeded at its declared default — not omitted from the envelope."
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /campaigns"
              payload: { name: "Full Field Campaign", objective_type: "REVIEW_ACQUISITION", target_segment_codes: ["URBAN_MILLENNIAL", "SUBURBAN_PARENT"], syndication_retailer_ids: [], sampling_window_start: "2026-07-01T00:00:00Z", sampling_window_end: "2026-09-30T00:00:00Z", budget_total_cents: 1000000, review_due_days: 21, min_review_word_count: 10, holdout_pct: 0.0 }
              as: CampaignManager
              captures: { camp_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "response_type == object and data.id is a uuid"
            - "Campaign.${camp_id}.name == Full Field Campaign"
            - "Campaign.${camp_id}.objective_type == REVIEW_ACQUISITION"
            - "Campaign.${camp_id}.target_segment_codes == [URBAN_MILLENNIAL, SUBURBAN_PARENT]"
            - "Campaign.${camp_id}.budget_total_cents == 1000000"
            - "Campaign.${camp_id}.status == DRAFT"
            - "Campaign.${camp_id}.compliance_posture == OPEN"
            - "Campaign.${camp_id}.kit_assembly_unit_cost_cents == 0"
            - "Campaign.${camp_id}.budget_committed_cents == 0"
            - "Campaign.${camp_id}.budget_available_cents == 1000000 (POST /campaigns seeds it to budget_total_cents while budget_committed_cents is 0)"
            - "Campaign.${camp_id}.enrollment_count == 0"
            - "Campaign.${camp_id}.holdout_enrollment_count == 0"
            - "Campaign.${camp_id}.allocated_sample_count == 0"
            - "Campaign.${camp_id}.delivered_sample_count == 0"
            - "Campaign.${camp_id}.approved_review_count == 0"
            - "Campaign.${camp_id}.syndicated_review_count == 0"
            - "Campaign.${camp_id}.disclosure_rejected_review_count == 0"
            - "Campaign.${camp_id}.substantiated_diversion_count == 0"
            - "Campaign.${camp_id}.write_off_cost_cents == 0"
            - "Campaign.${camp_id}.cost_per_sample_provisional_cents == 0"
            - "Campaign.${camp_id}.cost_per_sample_final_cents == 0"
            - "Campaign.${camp_id}.launched_by_user_id == null"
            - "Campaign.${camp_id}.closed_at == null"

      - name: panelist_retrieval_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - entities.Panelist
          - endpoints[GET /panelists/{panelist_id}]
        distinguishing_aspect: "A freshly registered panelist read back by id returns the stored inputs verbatim and the untouched risk fields — fraud_risk_score_audit is still null while fraud_risk_score_screening already carries its 0.0 default."
        test_recipe:
          setup:
            - "One panelist registered anonymously, never screened and never audited."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /panelists"
              payload: { email: "read.back@example.com", display_name: "Read Back", address_hash: "H-RB1", account_opened_at: "2026-01-01T00:00:00Z", segment_code: "URBAN_MILLENNIAL" }
              as: Anonymous
              captures: { p1_id: $.data.id }
          trigger:
            - call: "GET /panelists/${p1_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "HTTP status == 200"
            - "Panelist.${p1_id}.email == read.back@example.com"
            - "Panelist.${p1_id}.display_name == Read Back"
            - "Panelist.${p1_id}.address_hash == H-RB1"
            - "Panelist.${p1_id}.segment_code == URBAN_MILLENNIAL"
            - "Panelist.${p1_id}.referred_by_panelist_id == null"
            - "Panelist.${p1_id}.integrity_status == CLEAR"
            - "Panelist.${p1_id}.diversion_strikes == 0"
            - "Panelist.${p1_id}.fraud_risk_score_screening == 0.0"
            - "Panelist.${p1_id}.fraud_risk_score_audit == null"
            - "Panelist.${p1_id}.last_risk_scored_at == null"

      - name: campaign_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /campaigns]
          - response_envelope.pagination_fields
        distinguishing_aspect: "Three campaigns exist and limit is 2, so the first page carries exactly 2 rows with total_count 3 and has_more true; the status filter narrows the same list to the single SCREENING_OPEN row."
        test_recipe:
          setup:
            - "Three campaigns exist; the first has been moved to SCREENING_OPEN, the other two are still DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { name: "List One", objective_type: "TRIAL_GENERATION", target_segment_codes: ["URBAN_MILLENNIAL"], syndication_retailer_ids: [], sampling_window_start: "2026-07-01T00:00:00Z", sampling_window_end: "2026-09-30T00:00:00Z", budget_total_cents: 1000000, review_due_days: 21, min_review_word_count: 10, holdout_pct: 0.0 }
              as: CampaignManager
              captures: { c1_id: $.data.id }
            - call: "POST /kit-lines"
              payload: { campaign_id: "${c1_id}", component_sku: "HERO-1", component_role: "HERO_PRODUCT", unit_cost_cents: 1417, quantity_per_kit: 1, component_discount_pct: 0.8 }
              as: CampaignManager
            - call: "POST /campaigns/${c1_id}/open-screening"
              payload: {}
              as: CampaignManager
            - call: "POST /campaigns"
              payload: { name: "List Two", objective_type: "AWARENESS", target_segment_codes: ["URBAN_MILLENNIAL"], syndication_retailer_ids: [], sampling_window_start: "2026-07-01T00:00:00Z", sampling_window_end: "2026-09-30T00:00:00Z", budget_total_cents: 1000000, review_due_days: 21, min_review_word_count: 10, holdout_pct: 0.0 }
              as: CampaignManager
              captures: { c2_id: $.data.id }
            - call: "POST /campaigns"
              payload: { name: "List Three", objective_type: "AWARENESS", target_segment_codes: ["URBAN_MILLENNIAL"], syndication_retailer_ids: [], sampling_window_start: "2026-07-01T00:00:00Z", sampling_window_end: "2026-09-30T00:00:00Z", budget_total_cents: 1000000, review_due_days: 21, min_review_word_count: 10, holdout_pct: 0.0 }
              as: CampaignManager
              captures: { c3_id: $.data.id }
          trigger:
            - call: "GET /campaigns"
              payload: { limit: 2, offset: 0 }
              as: CampaignManager
          assert:
            - "HTTP status == 200"
            - "response_type == array and len(data) == 2"
            - "total_count == 3"
            - "has_more == true"
            - "limit == 2 and offset == 0"
            - "A follow-up GET /campaigns with { status: SCREENING_OPEN } returns total_count == 1, has_more == false and data[0].id == ${c1_id}"
            - "A follow-up GET /campaigns with { limit: 2, offset: 2 } returns len(data) == 1 and has_more == false"

      - name: campaign_not_found_on_unknown_uuid
        claim_type: not_found
        grounds:
          - errors[ERR_CAMPAIGN_NOT_FOUND]
          - validations[priority 7]
          - endpoints[GET /campaigns/{campaign_id}]
        distinguishing_aspect: "A syntactically valid but never-persisted uuid in the path resolves to nothing, so priority 7 answers 404 ERR_CAMPAIGN_NOT_FOUND rather than an empty 200 body."
        test_recipe:
          setup:
            - "Empty database apart from the clock pin; NOBODY is a uuid no row was ever created with."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /campaigns/99999999-9999-4999-8999-999999999999"
              payload: {}
              as: CampaignManager
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err_id} == ERR_CAMPAIGN_NOT_FOUND"
            - "response_type == error"

      - name: kit_line_missing_required_component_sku_is_rejected
        claim_type: required_fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations[priority 4]
          - endpoints[POST /kit-lines]
        distinguishing_aspect: "component_sku has source input and no default, so omitting it fails priority 4 with 400 ERR_INVALID_REQUEST before any campaign-state or cost logic runs."
        test_recipe:
          setup:
            - "One DRAFT campaign exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { name: "Missing Field", objective_type: "TRIAL_GENERATION", target_segment_codes: ["URBAN_MILLENNIAL"], syndication_retailer_ids: [], sampling_window_start: "2026-07-01T00:00:00Z", sampling_window_end: "2026-09-30T00:00:00Z", budget_total_cents: 1000000, review_due_days: 21, min_review_word_count: 10, holdout_pct: 0.0 }
              as: CampaignManager
              captures: { camp_id: $.data.id }
          trigger:
            - call: "POST /kit-lines"
              payload: { campaign_id: "${camp_id}", component_role: "HERO_PRODUCT", unit_cost_cents: 1417, quantity_per_kit: 1 }
              as: CampaignManager
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${err_id} == ERR_INVALID_REQUEST"
            - "Campaign.${camp_id}.kit_assembly_unit_cost_cents == 0"
            - "GET /kit-lines with { campaign_id: ${camp_id} } returns total_count == 0"

      - name: campaign_omitted_optional_inputs_take_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Campaign.fields.review_due_days
          - entities.Campaign.fields.min_review_word_count
          - entities.Campaign.fields.holdout_pct
          - entities.Campaign.fields.syndication_retailer_ids
        distinguishing_aspect: "Only the six required inputs are sent, so review_due_days lands on 21, min_review_word_count on 50 and holdout_pct on 0.2 — the §1.1 defaults, not zero and not null."
        test_recipe:
          setup:
            - "Empty database apart from the clock pin."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /campaigns"
              payload: { name: "Defaults Only", objective_type: "AWARENESS", target_segment_codes: ["URBAN_MILLENNIAL"], sampling_window_start: "2026-07-01T00:00:00Z", sampling_window_end: "2026-09-30T00:00:00Z", budget_total_cents: 1000000 }
              as: CampaignManager
              captures: { camp_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Campaign.${camp_id}.review_due_days == 21"
            - "Campaign.${camp_id}.min_review_word_count == 50"
            - "Campaign.${camp_id}.holdout_pct == 0.2"
            - "Campaign.${camp_id}.syndication_retailer_ids == []"
            - "Campaign.${camp_id}.status == DRAFT"

      - name: kit_line_extended_cost_cents_is_computed_per_line
        claim_type: computed_fields
        grounds:
          - entities.KitLine.fields.extended_cost_cents
          - calculations.kit_assembly_unit_cost
          - endpoints[POST /kit-lines]
        distinguishing_aspect: "Each line's extended_cost_cents is ROUND_HALF_UP(unit_cost_cents * quantity_per_kit * (1 - component_discount_pct)) at creation time: 283, 116 and 55 for the canonical kit, and the discount default of 0 leaves an undiscounted line at its raw product."
        test_recipe:
          setup:
            - "One DRAFT campaign with the three canonical kit lines plus a fourth line that omits component_discount_pct."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { name: "Computed Lines", objective_type: "TRIAL_GENERATION", target_segment_codes: ["URBAN_MILLENNIAL"], syndication_retailer_ids: [], sampling_window_start: "2026-07-01T00:00:00Z", sampling_window_end: "2026-09-30T00:00:00Z", budget_total_cents: 1000000, review_due_days: 21, min_review_word_count: 10, holdout_pct: 0.0 }
              as: CampaignManager
              captures: { camp_id: $.data.id }
          trigger:
            - call: "POST /kit-lines"
              payload: { campaign_id: "${camp_id}", component_sku: "HERO-1", component_role: "HERO_PRODUCT", unit_cost_cents: 1417, quantity_per_kit: 1, component_discount_pct: 0.8 }
              as: CampaignManager
              captures: { kl1_id: $.data.id }
            - call: "POST /kit-lines"
              payload: { campaign_id: "${camp_id}", component_sku: "ACC-2", component_role: "ACCESSORY", unit_cost_cents: 388, quantity_per_kit: 2, component_discount_pct: 0.85 }
              as: CampaignManager
              captures: { kl2_id: $.data.id }
            - call: "POST /kit-lines"
              payload: { campaign_id: "${camp_id}", component_sku: "INS-3", component_role: "INSERT_CARD", unit_cost_cents: 554, quantity_per_kit: 1, component_discount_pct: 0.9 }
              as: CampaignManager
              captures: { kl3_id: $.data.id }
            - call: "POST /kit-lines"
              payload: { campaign_id: "${camp_id}", component_sku: "DISC-4", component_role: "DISCLOSURE_INSERT", unit_cost_cents: 40, quantity_per_kit: 1 }
              as: CampaignManager
              captures: { kl4_id: $.data.id }
          assert:
            - "KitLine.${kl1_id}.extended_cost_cents == 283"
            - "KitLine.${kl2_id}.extended_cost_cents == 116"
            - "KitLine.${kl3_id}.extended_cost_cents == 55"
            - "KitLine.${kl4_id}.component_discount_pct == 0"
            - "KitLine.${kl4_id}.extended_cost_cents == 40"
            - "KitLine.${kl1_id}.status == ACTIVE"
            - "KitLine.${kl1_id}.units_received == 0 and units_available == 0 and units_reserved == 0 and units_shipped == 0 and units_written_off == 0"
            - "Campaign.${camp_id}.kit_assembly_unit_cost_cents == 494 (283 + 116 + 55 + 40)"

      - name: campaign_system_fields_are_server_generated_extra_field_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Campaign.fields.status
          - entities.Campaign.fields.closed_at
          - entities.Campaign.fields.launched_by_user_id
        distinguishing_aspect: "status, closed_at and launched_by_user_id carry source system, so client-supplied values for them are ignored: the row still comes back DRAFT with closed_at null even though the payload asked for CLOSED."
        test_recipe:
          setup:
            - "Empty database apart from the clock pin. The payload deliberately carries three system-source keys that §1.5 does not declare as input."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /campaigns"
              payload: { name: "System Fields", objective_type: "TRIAL_GENERATION", target_segment_codes: ["URBAN_MILLENNIAL"], sampling_window_start: "2026-07-01T00:00:00Z", sampling_window_end: "2026-09-30T00:00:00Z", budget_total_cents: 1000000, status: "CLOSED", closed_at: "2020-01-01T00:00:00Z", launched_by_user_id: "11111111-1111-4111-8111-111111111111" }
              as: CampaignManager
              captures: { camp_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Campaign.${camp_id}.status == DRAFT (the client-supplied CLOSED is ignored)"
            - "Campaign.${camp_id}.closed_at == null"
            - "Campaign.${camp_id}.launched_by_user_id == null"
            - "Campaign.${camp_id}.id is a server-generated uuid different from any value in the payload"
