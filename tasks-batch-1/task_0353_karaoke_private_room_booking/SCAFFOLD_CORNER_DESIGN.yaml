# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Karaoke & Private Room Booking — breadth probe over §1.1–§1.7 surface.
# Same venue config convention as §1.8 (timezone UTC, peak [1080,1380), mult 1.5,
# deposit_pct 0.2, cutoff 24h, grace 15, overage_grace 10) unless noted.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_venue_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Venue, endpoints]
        distinguishing_aspect: "POST /venues with all required fields returns 201; response carries server-minted id, created_at, version==1, and echoed config."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /venues"
              payload: { name: "Fresh", timezone: "UTC", peak_start_minute: 1080, peak_end_minute: 1380 }
              as: VenueManager
              captures: { v_id: $.data.id, ver: $.data.version }
          assert:
            - "HTTP status == 201"
            - "response.data.id is a non-empty UUID with no type prefix"
            - "response.data.version == 1"
            - "response.data.peak_multiplier == 1.5"

      - name: create_room_type_defaults_applied
        claim_type: Defaults
        grounds: [entities.RoomType.fields.fb_minimum_cents, entities.RoomType.fields.active]
        distinguishing_aspect: "Omitting fb_minimum_cents and active on room-type create yields fb_minimum_cents==0 and active==true (declared defaults)."
        test_recipe:
          setup: ["Venue exists"]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC", peak_start_minute: 1080, peak_end_minute: 1380 }
              as: VenueManager
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /room-types"
              payload: { venue_id: "${v_id}", name: "MEDIUM", capacity: 6, base_hourly_rate_cents: 5000 }
              as: VenueManager
              captures: { rt_id: $.data.id }
          assert:
            - "response.data.fb_minimum_cents == 0"
            - "response.data.active == true"

      - name: reservation_missing_required_field_rejected
        claim_type: Required Fields
        grounds: ["entities.Reservation.fields.slot_start_utc", "validations[priority=4]"]
        distinguishing_aspect: "POST /reservations omitting slot_start_utc returns ERR_INVALID_REQUEST (422) — required input with no default."
        test_recipe:
          setup: ["Venue, LARGE room-type, room, customer exist; room version captured"]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC", peak_start_minute: 1080, peak_end_minute: 1380 }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /room-types"
              payload: { venue_id: "${v_id}", name: "LARGE", capacity: 12, base_hourly_rate_cents: 6000 }
              as: VenueManager
              captures: { rt_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", room_type_id: "${rt_id}", label: "R1" }
              as: VenueManager
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /customers"
              payload: { full_name: "Z", email: "z@x.com", phone: "1" }
              as: Customer
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /reservations"
              payload: { venue_id: "${v_id}", room_id: "${room_id}", customer_id: "${cust_id}", party_size: 4, slot_end_utc: "2026-08-01T22:00:00.000Z", expected_room_version: "${room_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: reservation_invalid_interval_end_before_start_rejected
        claim_type: Type Constraints
        grounds: ["entities.Reservation.fields.slot_end_utc", "validations[priority=4]"]
        distinguishing_aspect: "slot_end_utc not strictly after slot_start_utc returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Venue, LARGE room, customer; room version captured"]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC", peak_start_minute: 1080, peak_end_minute: 1380 }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /room-types"
              payload: { venue_id: "${v_id}", name: "LARGE", capacity: 12, base_hourly_rate_cents: 6000 }
              as: VenueManager
              captures: { rt_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", room_type_id: "${rt_id}", label: "R1" }
              as: VenueManager
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /customers"
              payload: { full_name: "Z", email: "z@x.com", phone: "1" }
              as: Customer
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /reservations"
              payload: { venue_id: "${v_id}", room_id: "${room_id}", customer_id: "${cust_id}", party_size: 4, slot_start_utc: "2026-08-01T22:00:00.000Z", slot_end_utc: "2026-08-01T21:00:00.000Z", expected_room_version: "${room_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: song_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.Song]
        distinguishing_aspect: "Song has common_fields:false — its create response carries id and created_at but no version/updated_at; there is no Song update endpoint."
        test_recipe:
          setup: ["Venue exists"]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC", peak_start_minute: 1080, peak_end_minute: 1380 }
              as: VenueManager
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /songs"
              payload: { venue_id: "${v_id}", title: "T", artist: "A", duration_seconds: 200, language: "EN" }
              as: FrontDesk
              captures: { s_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "response.data.id is present"
            - "response.data has no 'version' key"

      - name: get_reservation_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["entities.Reservation", "validations[priority=3]"]
        distinguishing_aspect: "GET /venues/{id}/reservations/{random-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Venue exists; reservation id is a random non-existent UUID"]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC", peak_start_minute: 1080, peak_end_minute: 1380 }
              as: VenueManager
              captures: { v_id: $.data.id }
          trigger:
            - call: "GET /reservations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: confirm_from_already_confirmed_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Reservation.HELD_to_CONFIRMED", "validations[priority=5]"]
        distinguishing_aspect: "Confirming a CONFIRMED reservation (not HELD) returns ERR_INVALID_STATE (409); no second DEPOSIT payment appended."
        test_recipe:
          setup: ["Reservation 2026-08-02 20:00->22:00 confirmed; clock before slot"]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC", peak_start_minute: 1080, peak_end_minute: 1380, deposit_pct: 0.2 }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /room-types"
              payload: { venue_id: "${v_id}", name: "LARGE", capacity: 12, base_hourly_rate_cents: 6000 }
              as: VenueManager
              captures: { rt_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", room_type_id: "${rt_id}", label: "R1" }
              as: VenueManager
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /customers"
              payload: { full_name: "Z", email: "z@x.com", phone: "1" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /venues/${v_id}/_clock/set"
              payload: { now_utc: "2026-08-02T10:00:00.000Z" }
              as: FrontDesk
            - call: "POST /reservations"
              payload: { venue_id: "${v_id}", room_id: "${room_id}", customer_id: "${cust_id}", party_size: 4, slot_start_utc: "2026-08-02T20:00:00.000Z", slot_end_utc: "2026-08-02T22:00:00.000Z", expected_room_version: "${room_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: terminal_cancelled_reservation_cannot_cancel_again
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Reservation.HELD_to_CANCELLED", "validations[priority=5]"]
        distinguishing_aspect: "A CANCELLED reservation is terminal; a second cancel returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["HELD reservation cancelled (terminal CANCELLED)"]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC", peak_start_minute: 1080, peak_end_minute: 1380 }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /room-types"
              payload: { venue_id: "${v_id}", name: "LARGE", capacity: 12, base_hourly_rate_cents: 6000 }
              as: VenueManager
              captures: { rt_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", room_type_id: "${rt_id}", label: "R1" }
              as: VenueManager
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /customers"
              payload: { full_name: "Z", email: "z@x.com", phone: "1" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /venues/${v_id}/_clock/set"
              payload: { now_utc: "2026-08-03T10:00:00.000Z" }
              as: FrontDesk
            - call: "POST /reservations"
              payload: { venue_id: "${v_id}", room_id: "${room_id}", customer_id: "${cust_id}", party_size: 4, slot_start_utc: "2026-08-03T20:00:00.000Z", slot_end_utc: "2026-08-03T22:00:00.000Z", expected_room_version: "${room_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /reservations/${res_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: new_reservation_starts_in_held
        claim_type: Initial State
        grounds: [state_machines.Reservation, entities.Reservation.fields.status]
        distinguishing_aspect: "A freshly created reservation has status == HELD (declared initial_state)."
        test_recipe:
          setup: ["Venue, LARGE room, customer; clock before slot"]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC", peak_start_minute: 1080, peak_end_minute: 1380 }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /room-types"
              payload: { venue_id: "${v_id}", name: "LARGE", capacity: 12, base_hourly_rate_cents: 6000 }
              as: VenueManager
              captures: { rt_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", room_type_id: "${rt_id}", label: "R1" }
              as: VenueManager
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /customers"
              payload: { full_name: "Z", email: "z@x.com", phone: "1" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /venues/${v_id}/_clock/set"
              payload: { now_utc: "2026-08-04T10:00:00.000Z" }
              as: FrontDesk
          trigger:
            - call: "POST /reservations"
              payload: { venue_id: "${v_id}", room_id: "${room_id}", customer_id: "${cust_id}", party_size: 4, slot_start_utc: "2026-08-04T20:00:00.000Z", slot_end_utc: "2026-08-04T22:00:00.000Z", expected_room_version: "${room_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id }
          assert:
            - "response.data.status == HELD"

      - name: room_maintenance_blocked_when_occupied_invalid_transition
        claim_type: guarded transitions
        grounds: ["state_machines.Room.AVAILABLE_to_OUT_OF_SERVICE", "validations[priority=12]"]
        distinguishing_aspect: "Taking an OCCUPIED room OUT_OF_SERVICE is rejected ERR_ROOM_NOT_AVAILABLE (409)."
        test_recipe:
          setup: ["LARGE room OCCUPIED via a CHECKED_IN reservation at 20:00"]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC", peak_start_minute: 1080, peak_end_minute: 1380 }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /room-types"
              payload: { venue_id: "${v_id}", name: "LARGE", capacity: 12, base_hourly_rate_cents: 6000 }
              as: VenueManager
              captures: { rt_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", room_type_id: "${rt_id}", label: "R1" }
              as: VenueManager
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /customers"
              payload: { full_name: "Z", email: "z@x.com", phone: "1" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /venues/${v_id}/_clock/set"
              payload: { now_utc: "2026-08-05T19:00:00.000Z" }
              as: FrontDesk
            - call: "POST /reservations"
              payload: { venue_id: "${v_id}", room_id: "${room_id}", customer_id: "${cust_id}", party_size: 4, slot_start_utc: "2026-08-05T20:00:00.000Z", slot_end_utc: "2026-08-05T22:00:00.000Z", expected_room_version: "${room_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /venues/${v_id}/_clock/set"
              payload: { now_utc: "2026-08-05T20:00:00.000Z" }
              as: FrontDesk
            - call: "POST /reservations/${res_id}/check-in"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /rooms/${room_id}/maintenance"
              payload: { target: "OUT_OF_SERVICE" }
              as: VenueManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_ROOM_NOT_AVAILABLE"

      - name: cancel_held_reservation_no_payment_appended
        claim_type: Side Effect Execution
        grounds: [state_machines.Reservation.HELD_to_CANCELLED, entities.Payment]
        distinguishing_aspect: "Cancelling a HELD (never-confirmed) reservation appends NO Payment because no deposit was ever collected."
        test_recipe:
          setup: ["HELD reservation never confirmed"]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC", peak_start_minute: 1080, peak_end_minute: 1380 }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /room-types"
              payload: { venue_id: "${v_id}", name: "LARGE", capacity: 12, base_hourly_rate_cents: 6000 }
              as: VenueManager
              captures: { rt_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", room_type_id: "${rt_id}", label: "R1" }
              as: VenueManager
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /customers"
              payload: { full_name: "Z", email: "z@x.com", phone: "1" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /venues/${v_id}/_clock/set"
              payload: { now_utc: "2026-08-06T10:00:00.000Z" }
              as: FrontDesk
            - call: "POST /reservations"
              payload: { venue_id: "${v_id}", room_id: "${room_id}", customer_id: "${cust_id}", party_size: 4, slot_start_utc: "2026-08-06T20:00:00.000Z", slot_end_utc: "2026-08-06T22:00:00.000Z", expected_room_version: "${room_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /reservations/${res_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Reservation.${res_id}.status == CANCELLED"
            - "GET /venues/${v_id}/reservations/${res_id}/payments returns an array of length 0"

  # ===========================================================================
  - section: calculations
    instances:
      - name: settled_within_plan_no_overage_variant
        claim_type: Variant Selection
        grounds: [calculations.settled_room_subtotal, state_machines.Reservation.CHECKED_IN_to_CLOSED]
        distinguishing_aspect: "A LARGE session 20:00->21:30 (well within slot_end 22:00) closes with settled_room_subtotal_cents == 15000 (90 peak min * 100 * 1.5) and NO overage multiplier (within_plan variant)."
        test_recipe:
          setup: ["LARGE base 6000; reservation 2026-08-07 20:00->22:00 confirmed, checked in at 20:00"]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC", peak_start_minute: 1080, peak_end_minute: 1380, peak_multiplier: 1.5, overage_grace_minutes: 10 }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /room-types"
              payload: { venue_id: "${v_id}", name: "LARGE", capacity: 12, base_hourly_rate_cents: 6000 }
              as: VenueManager
              captures: { rt_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", room_type_id: "${rt_id}", label: "R1" }
              as: VenueManager
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /customers"
              payload: { full_name: "Z", email: "z@x.com", phone: "1" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /venues/${v_id}/_clock/set"
              payload: { now_utc: "2026-08-07T19:00:00.000Z" }
              as: FrontDesk
            - call: "POST /reservations"
              payload: { venue_id: "${v_id}", room_id: "${room_id}", customer_id: "${cust_id}", party_size: 4, slot_start_utc: "2026-08-07T20:00:00.000Z", slot_end_utc: "2026-08-07T22:00:00.000Z", expected_room_version: "${room_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /venues/${v_id}/_clock/set"
              payload: { now_utc: "2026-08-07T20:00:00.000Z" }
              as: FrontDesk
            - call: "POST /reservations/${res_id}/check-in"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /reservations/${res_id}/close"
              payload: { actual_end_utc: "2026-08-07T21:30:00.000Z" }
              as: FrontDesk
              captures: { settled: $.data.settled_room_subtotal_cents }
          assert:
            - "Reservation.${res_id}.settled_room_subtotal_cents == 15000"

      - name: package_quote_uses_flat_price_variant
        claim_type: Variant Selection
        grounds: [calculations.quoted_room_subtotal, entities.GroupPackage.fields.flat_price_cents, entities.Reservation.fields.group_package_id]
        distinguishing_aspect: "A reservation booked with a GroupPackage quotes quoted_room_subtotal_cents == flat_price_cents (20000), ignoring hourly peak/off-peak (package variant)."
        test_recipe:
          setup: ["LARGE room; GroupPackage flat 20000 included_hours 2.0 for LARGE; reservation booked with the package, confirmed"]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC", peak_start_minute: 1080, peak_end_minute: 1380, peak_multiplier: 1.5, deposit_pct: 0.2 }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /room-types"
              payload: { venue_id: "${v_id}", name: "LARGE", capacity: 12, base_hourly_rate_cents: 6000 }
              as: VenueManager
              captures: { rt_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", room_type_id: "${rt_id}", label: "R1" }
              as: VenueManager
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /group-packages"
              payload: { venue_id: "${v_id}", name: "Bash", flat_price_cents: 20000, included_hours: 2.0, included_room_type_id: "${rt_id}", included_fb_credit_cents: 4000 }
              as: VenueManager
              captures: { pkg_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Z", email: "z@x.com", phone: "1" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /venues/${v_id}/_clock/set"
              payload: { now_utc: "2026-08-08T10:00:00.000Z" }
              as: FrontDesk
            - call: "POST /reservations"
              payload: { venue_id: "${v_id}", room_id: "${room_id}", customer_id: "${cust_id}", party_size: 8, slot_start_utc: "2026-08-08T19:00:00.000Z", slot_end_utc: "2026-08-08T21:00:00.000Z", expected_room_version: "${room_v}", group_package_id: "${pkg_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
