scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: well_screening_variant_vs_remediation_variant_diverge_on_one_row
        grounds:
          - calculations.orphan_priority_score
          - entities.Well.fields.screening_score
          - entities.Well.fields.remediation_score
          - entities.Well.fields.population_within_1000ft
        distinguishing_aspect: |
          One Well row with methane_scfd 250, groundwater_depth_ft 40, population_within_1000ft 8 and
          surface_disturbance_acres 2.0 yields screening_score 59.90 but remediation_score 81.00,
          because the remediation variant forces population_component to 100 whenever
          population_within_1000ft >= 5 and then weights population at 0.40 instead of 0.20.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default"
            - "one Operator 'Permian Legacy LLC' in district TX, tier BLANKET, bond 5000000 cents, status ACTIVE with zero wells"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Permian Legacy LLC", region_code: "TX", financial_assurance_tier: "BLANKET", bond_amount_cents: 5000000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op_id: $.data.id }
          trigger:
            - call: "POST /wells"
              payload: { api_well_number: "42-001-00001", operator_id: "${op_id}", spud_year: 1974, total_depth_ft: 4200, casing_strings: 2, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w_std_id: $.data.id }
          assert:
            - "Well.${w_std_id}.screening_score == 59.90"
            - "Well.${w_std_id}.remediation_score == 81.00"
            - "Well.${w_std_id}.screening_score != Well.${w_std_id}.remediation_score"
            - "Well.${w_std_id}.status == PRODUCING"
      - name: assurance_blanket_cap_after_sum_vs_individual_cap_before_sum
        grounds:
          - calculations.operator_financial_assurance_requirement
          - entities.Operator.fields.financial_assurance_tier
          - entities.Operator.fields.required_bond_cents
          - state_machines.Operator.ACTIVE_to_DELINQUENT
        distinguishing_aspect: |
          Two Operators holding byte-identical well inventories (one 2500 ft well and one 8000 ft
          well) get required_bond_cents 1750000 under BLANKET but 1250000 under INDIVIDUAL, because
          BLANKET applies its 25000000 cap to the summed exposure while INDIVIDUAL applies the
          1000000 per-well cap before summing.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default"
            - "Operator BLK with tier BLANKET and bond 5000000; Operator IND with tier INDIVIDUAL and bond 5000000; both start with zero wells and status ACTIVE"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Blanket Bond Operating", region_code: "TX", financial_assurance_tier: "BLANKET", bond_amount_cents: 5000000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { blk_id: $.data.id }
            - call: "POST /operators"
              payload: { name: "Individual Bond Operating", region_code: "TX", financial_assurance_tier: "INDIVIDUAL", bond_amount_cents: 5000000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { ind_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "42-001-00010", operator_id: "${blk_id}", spud_year: 1981, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
            - call: "POST /wells"
              payload: { api_well_number: "42-001-00011", operator_id: "${ind_id}", spud_year: 1981, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
            - call: "POST /wells"
              payload: { api_well_number: "42-001-00012", operator_id: "${blk_id}", spud_year: 1969, total_depth_ft: 8000, casing_strings: 3, methane_scfd: 310, groundwater_depth_ft: 180, population_within_1000ft: 3, surface_disturbance_acres: 1.25 }
              as: FieldInspector
              as_user_id: "u_insp"
          trigger:
            - call: "POST /wells"
              payload: { api_well_number: "42-001-00013", operator_id: "${ind_id}", spud_year: 1969, total_depth_ft: 8000, casing_strings: 3, methane_scfd: 310, groundwater_depth_ft: 180, population_within_1000ft: 3, surface_disturbance_acres: 1.25 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w_ind_deep_id: $.data.id }
          assert:
            - "Operator.${blk_id}.required_bond_cents == 1750000"
            - "Operator.${ind_id}.required_bond_cents == 1250000"
            - "Operator.${blk_id}.active_well_count == 2"
            - "Operator.${ind_id}.active_well_count == 2"
            - "Operator.${blk_id}.status == ACTIVE"
            - "Operator.${ind_id}.status == ACTIVE"
            - "Well.${w_ind_deep_id}.screening_score == 50.35"
            - "Well.${w_ind_deep_id}.remediation_score == 39.70"

  - rule_id: combinatorial_formula
    instances:
      - name: admin_fee_rounded_per_line_then_summed_plus_remobilization_branch
        grounds:
          - calculations.plugging_actual_cost
          - calculations.plugging_cost_estimate
          - entities.PluggingJob.fields.last_round_cost_cents
          - entities.PluggingJob.fields.actual_cost_cents
          - entities.UnitCostContract.fields.obligated_cents
          - state_machines.PluggingJob.FIELD_REPORTED_to_REWORK_REQUIRED
        distinguishing_aspect: |
          The 4.25 percent administrative fee is rounded to whole cents PER LINE ITEM and then summed
          (20747 + 144500 + 32994 + 106250 = 304491), which differs by exactly 1 cent from rounding
          4.25 percent of the 7164481 line subtotal once (304490); the second round additionally
          bills only 50 percent of the 2499999 mobilization fee, so identical arithmetic on a
          different round number yields a different line 4.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default throughout"
            - "Operator 'Basin Orphan Holdings' tier INDIVIDUAL, bond 5000000, ACTIVE"
            - "Well 42-001-00100, 2500 ft, ORPHAN_CONFIRMED, access_status AGREEMENT_EXECUTED"
            - "Contractor 'Redbed Plugging Co' GOOD_STANDING"
            - "Solicitation AWARDED with ceiling_cents 20000000 and min_technical_score 70; UnitCostContract ACTIVE with rates cement 4137, rig day 849999, casing 1213, mobilization 2499999 and ceiling 20000000"
            - "PluggingJob MOBILIZED with planned 100 sacks / 3 rig days / 500 ft, so plugging_cost_estimate_cents == 6070196 and contract obligated_cents == 6070196"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Basin Orphan Holdings", region_code: "TX", financial_assurance_tier: "INDIVIDUAL", bond_amount_cents: 5000000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "42-001-00100", operator_id: "${op_id}", spud_year: 1974, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w1_id: $.data.id }
            - call: "GET /wells/${w1_id}"
              payload: {}
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w1_v: $.data.version }
            - call: "POST /wells/${w1_id}/orphan-determinations"
              payload: { inspector_notes: "no operator of record on site; wellhead corroded", expected_well_version: "${w1_v}" }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { det1_id: $.data.id }
            - call: "POST /orphan-determinations/${det1_id}/submit"
              payload: {}
              as: FieldInspector
              as_user_id: "u_insp"
            - call: "POST /orphan-determinations/${det1_id}/decision"
              payload: { action: "CONFIRM", rationale: "idle 999 months, zero de-minimis production, screening 59.90" }
              as: DeterminationReviewer
              as_user_id: "u_rev"
            - call: "POST /contractors"
              payload: { name: "Redbed Plugging Co", license_number: "P-40881", bond_amount_cents: 2500000, performance_score: 88 }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { c1_id: $.data.id }
            - call: "POST /solicitations"
              payload: { region_code: "TX", scope_description: "plug and abandon 1 orphan well, district TX", bid_due_at: "2026-08-20T00:00:00Z", ceiling_cents: 20000000, min_technical_score: 70 }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { sol_id: $.data.id }
            - call: "POST /solicitations/${sol_id}/lifecycle"
              payload: { action: "OPEN" }
              as: ProcurementOfficer
              as_user_id: "u_proc"
            - call: "POST /solicitations/${sol_id}/bids"
              payload: { contractor_id: "${c1_id}", cement_per_sack_cents: 4137, rig_day_rate_cents: 849999, casing_per_ft_cents: 1213, mobilization_fee_cents: 2499999, technical_score: 92 }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { bid_a_id: $.data.id }
            - call: "POST /solicitations/${sol_id}/lifecycle"
              payload: { action: "CLOSE" }
              as: ProcurementOfficer
              as_user_id: "u_proc"
            - call: "POST /bids/${bid_a_id}/evaluation"
              payload: { outcome: "RESPONSIVE" }
              as: ProcurementOfficer
              as_user_id: "u_proc"
            - call: "POST /solicitations/${sol_id}/award"
              payload: {}
              as: AwardAuthority
              as_user_id: "u_award"
              captures: { contract_id: $.data.id }
            - call: "POST /wells/${w1_id}/site-accesses"
              payload: { surface_owner_name: "Delia Marsh", mode: "AGREEMENT", compensation_cents: 150000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { sa1_id: $.data.id }
            - call: "POST /site-accesses/${sa1_id}/resolution"
              payload: { outcome: "EXECUTE_AGREEMENT" }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /plugging-jobs"
              payload: { well_id: "${w1_id}", contract_id: "${contract_id}", scheduled_start: "2026-09-01T00:00:00Z", planned_cement_sacks: 100, planned_rig_days: 3, planned_casing_ft: 500 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { job_id: $.data.id }
            - call: "POST /plugging-jobs/${job_id}/mobilize"
              payload: {}
              as: FieldInspector
              as_user_id: "u_insp"
          trigger:
            - call: "POST /plugging-jobs/${job_id}/field-report"
              payload: { cement_sacks_used: 118, rig_days_used: 4, casing_removed_ft: 640, downhole_conditions: "open annulus 3880-4200 ft; no casing collapse observed", plug_intervals: [ { top_ft: 3900, bottom_ft: 4200, sacks: 60 }, { top_ft: 0, bottom_ft: 120, sacks: 58 } ] }
              as: FieldInspector
              as_user_id: "u_insp"
            - call: "POST /plugging-jobs/${job_id}/review"
              payload: { action: "REWORK", findings: "surface plug top too deep; re-enter and re-cement" }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /plugging-jobs/${job_id}/field-report"
              payload: { cement_sacks_used: 20, rig_days_used: 1, casing_removed_ft: 0, downhole_conditions: "surface plug re-set 0-60 ft", plug_intervals: [ { top_ft: 0, bottom_ft: 60, sacks: 20 } ] }
              as: FieldInspector
              as_user_id: "u_insp"
          assert:
            - "PluggingJob.${job_id}.plugging_cost_estimate_cents == 6070196"
            - "after the first field report PluggingJob.${job_id}.last_round_cost_cents == 7468972 (subtotal 7164481 + per-line fee sum 304491), NOT 7468971 which the subtotal-based fee 304490 would give"
            - "after the first field report PluggingJob.${job_id}.actual_cost_cents == 7468972"
            - "after the first field report UnitCostContract.${contract_id}.obligated_cents == 7468972"
            - "PluggingJob.${job_id}.rework_round == 1 after the REWORK review"
            - "after the second field report PluggingJob.${job_id}.last_round_cost_cents == 2275505 (lines 82740 / 849999 / 0 / 1250000 with per-line fees 3516 / 36125 / 0 / 53125)"
            - "after the second field report PluggingJob.${job_id}.actual_cost_cents == 9744477"
            - "after the second field report UnitCostContract.${contract_id}.obligated_cents == 9744477"
            - "UnitCostContract.${contract_id}.status == ACTIVE (9744477 < ceiling 20000000)"
            - "PluggingJob.${job_id}.status == FIELD_REPORTED"

      - name: federal_match_cap_single_pass_no_retroactive_match_expansion
        grounds:
          - calculations.job_funding_waterfall
          - entities.FundingSource.fields.federal_match_required_pct
          - entities.FundingAllocation.fields.waterfall_rank
          - entities.PluggingJob.fields.funded_cents
          - state_machines.FundingSource.ACTIVE_to_EXHAUSTED
        distinguishing_aspect: |
          For a 6070196-cent need the federal grant is evaluated at waterfall rank 2, when only the
          1000000 cents of forfeited bond have been committed, so its 40-percent match cap is
          floor(1000000 * 60 / 40) = 1500000; the 3570196 cents of state fund committed afterwards at
          rank 3 do NOT retroactively raise that cap to 6855294, because the waterfall runs exactly
          one ordered pass.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default throughout"
            - "the same operator / well / contractor / solicitation / contract chain as the previous instance, with a SCHEDULED PluggingJob whose plugging_cost_estimate_cents == 6070196"
            - "three ACTIVE FundingSources allowing PLUGGING: a FORFEITED_BOND of 1000000 tied to this well's operator, a FEDERAL_GRANT of 10000000 requiring a 40 percent federal share, and a STATE_FUND of 10000000"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Basin Orphan Holdings", region_code: "TX", financial_assurance_tier: "INDIVIDUAL", bond_amount_cents: 5000000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "42-001-00200", operator_id: "${op_id}", spud_year: 1974, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w1_id: $.data.id }
            - call: "GET /wells/${w1_id}"
              payload: {}
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w1_v: $.data.version }
            - call: "POST /wells/${w1_id}/orphan-determinations"
              payload: { inspector_notes: "abandoned tank battery, no operator response", expected_well_version: "${w1_v}" }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { det1_id: $.data.id }
            - call: "POST /orphan-determinations/${det1_id}/submit"
              payload: {}
              as: FieldInspector
              as_user_id: "u_insp"
            - call: "POST /orphan-determinations/${det1_id}/decision"
              payload: { action: "CONFIRM", rationale: "criteria satisfied" }
              as: DeterminationReviewer
              as_user_id: "u_rev"
            - call: "POST /contractors"
              payload: { name: "Redbed Plugging Co", license_number: "P-40881", bond_amount_cents: 2500000, performance_score: 88 }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { c1_id: $.data.id }
            - call: "POST /solicitations"
              payload: { region_code: "TX", scope_description: "plug and abandon 1 orphan well, district TX", bid_due_at: "2026-08-20T00:00:00Z", ceiling_cents: 20000000, min_technical_score: 70 }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { sol_id: $.data.id }
            - call: "POST /solicitations/${sol_id}/lifecycle"
              payload: { action: "OPEN" }
              as: ProcurementOfficer
              as_user_id: "u_proc"
            - call: "POST /solicitations/${sol_id}/bids"
              payload: { contractor_id: "${c1_id}", cement_per_sack_cents: 4137, rig_day_rate_cents: 849999, casing_per_ft_cents: 1213, mobilization_fee_cents: 2499999, technical_score: 92 }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { bid_a_id: $.data.id }
            - call: "POST /solicitations/${sol_id}/lifecycle"
              payload: { action: "CLOSE" }
              as: ProcurementOfficer
              as_user_id: "u_proc"
            - call: "POST /bids/${bid_a_id}/evaluation"
              payload: { outcome: "RESPONSIVE" }
              as: ProcurementOfficer
              as_user_id: "u_proc"
            - call: "POST /solicitations/${sol_id}/award"
              payload: {}
              as: AwardAuthority
              as_user_id: "u_award"
              captures: { contract_id: $.data.id }
            - call: "POST /plugging-jobs"
              payload: { well_id: "${w1_id}", contract_id: "${contract_id}", scheduled_start: "2026-09-01T00:00:00Z", planned_cement_sacks: 100, planned_rig_days: 3, planned_casing_ft: 500 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { job_id: $.data.id }
            - call: "POST /funding-sources"
              payload: { kind: "FORFEITED_BOND", name: "Forfeited bond - Basin Orphan Holdings", authorized_cents: 1000000, expires_at: "2027-12-31T00:00:00Z", allowable_cost_categories: ["PLUGGING"], bond_operator_id: "${op_id}" }
              as: FundingOfficer
              as_user_id: "u_fund1"
              captures: { fs_bond_id: $.data.id }
            - call: "POST /funding-sources"
              payload: { kind: "FEDERAL_GRANT", name: "IIJA orphan well formula grant FY26", authorized_cents: 10000000, expires_at: "2027-06-30T00:00:00Z", allowable_cost_categories: ["PLUGGING"], federal_match_required_pct: 40 }
              as: FundingOfficer
              as_user_id: "u_fund1"
              captures: { fs_fed_id: $.data.id }
            - call: "POST /funding-sources"
              payload: { kind: "STATE_FUND", name: "Oilfield cleanup fund", authorized_cents: 10000000, expires_at: "2027-12-31T00:00:00Z", allowable_cost_categories: ["PLUGGING"] }
              as: FundingOfficer
              as_user_id: "u_fund1"
              captures: { fs_state_id: $.data.id }
          trigger:
            - call: "POST /plugging-jobs/${job_id}/funding-commitments"
              payload: {}
              as: FundingOfficer
              as_user_id: "u_fund1"
              captures: { alloc0_id: "$.data[0].id", alloc1_id: "$.data[1].id", alloc2_id: "$.data[2].id" }
          assert:
            - "exactly 3 FundingAllocation rows are created for PluggingJob.${job_id}"
            - "FundingAllocation.${alloc0_id}.source_id == ${fs_bond_id} and allocated_cents == 1000000 and waterfall_rank == 1"
            - "FundingAllocation.${alloc1_id}.source_id == ${fs_fed_id} and allocated_cents == 1500000 and waterfall_rank == 2"
            - "FundingAllocation.${alloc2_id}.source_id == ${fs_state_id} and allocated_cents == 3570196 and waterfall_rank == 3"
            - "FundingSource.${fs_fed_id}.committed_cents == 1500000, NOT 6855294 (the cap a second retroactive pass over the state-fund contribution would have produced)"
            - "FundingSource.${fs_bond_id}.committed_cents == 1000000 and status == EXHAUSTED"
            - "FundingSource.${fs_state_id}.committed_cents == 3570196 and status == ACTIVE"
            - "PluggingJob.${job_id}.funded_cents == 6070196"
            - "1000000 + 1500000 + 3570196 == 6070196"

  - rule_id: non_linear_state_machine
    instances:
      - name: determination_revision_cycle_reenters_submitted_twice_then_hits_limit
        grounds:
          - state_machines.OrphanDetermination.SUBMITTED_to_REVISION_REQUESTED
          - state_machines.OrphanDetermination.REVISION_REQUESTED_to_SUBMITTED
          - entities.OrphanDetermination.fields.revision_round
          - validations[priority=71]
        distinguishing_aspect: |
          OrphanDetermination re-enters SUBMITTED from REVISION_REQUESTED (not from DRAFT), so the
          same state is reached by two different edges; revision_round monotonically counts the
          cycles 0 -> 1 -> 2 and the third REQUEST_REVISION is rejected with
          ERR_REVISION_LIMIT_EXCEEDED while the row stays SUBMITTED.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default"
            - "Operator 'Sandhill Petroleum' tier INDIVIDUAL, bond 5000000, ACTIVE"
            - "Well 42-001-00300 PRODUCING with screening_score 59.90 and last_production_month null"
            - "one OrphanDetermination in status SUBMITTED with revision_round 0, authored by u_insp"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Sandhill Petroleum", region_code: "TX", financial_assurance_tier: "INDIVIDUAL", bond_amount_cents: 5000000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "42-001-00300", operator_id: "${op_id}", spud_year: 1972, total_depth_ft: 3100, casing_strings: 2, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w_id: $.data.id }
            - call: "GET /wells/${w_id}"
              payload: {}
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w_v: $.data.version }
            - call: "POST /wells/${w_id}/orphan-determinations"
              payload: { inspector_notes: "first pass field notes", expected_well_version: "${w_v}" }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { det_id: $.data.id }
            - call: "POST /orphan-determinations/${det_id}/submit"
              payload: {}
              as: FieldInspector
              as_user_id: "u_insp"
          trigger:
            - call: "POST /orphan-determinations/${det_id}/decision"
              payload: { action: "REQUEST_REVISION", rationale: "attach groundwater survey" }
              as: DeterminationReviewer
              as_user_id: "u_rev"
            - call: "POST /orphan-determinations/${det_id}/submit"
              payload: { inspector_notes: "groundwater survey attached" }
              as: FieldInspector
              as_user_id: "u_insp"
            - call: "POST /orphan-determinations/${det_id}/decision"
              payload: { action: "REQUEST_REVISION", rationale: "surface acreage still unmeasured" }
              as: DeterminationReviewer
              as_user_id: "u_rev"
            - call: "POST /orphan-determinations/${det_id}/submit"
              payload: { inspector_notes: "surface acreage measured at 2.0" }
              as: FieldInspector
              as_user_id: "u_insp"
            - call: "POST /orphan-determinations/${det_id}/decision"
              payload: { action: "REQUEST_REVISION", rationale: "third bite at the apple - must be rejected" }
              as: DeterminationReviewer
              as_user_id: "u_rev"
          assert:
            - "after the first REQUEST_REVISION OrphanDetermination.${det_id}.status == REVISION_REQUESTED and revision_round == 1"
            - "after the first re-submit OrphanDetermination.${det_id}.status == SUBMITTED and revision_round == 1"
            - "after the second REQUEST_REVISION OrphanDetermination.${det_id}.revision_round == 2"
            - "the third REQUEST_REVISION returns HTTP 422 with error_id ERR_REVISION_LIMIT_EXCEEDED"
            - "OrphanDetermination.${det_id}.status == SUBMITTED and revision_round == 2 after the rejected call"
            - "Well.${w_id}.status == ORPHAN_CANDIDATE"
