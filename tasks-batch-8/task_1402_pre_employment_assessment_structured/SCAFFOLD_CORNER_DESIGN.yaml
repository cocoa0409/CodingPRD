          assert:
            - "both snapshots flagged == true (FINAL: A 0.5000 vs B 0.0000 -> ratio 0.0000 < 0.8000)"
            - "monitor disabled (i_off): cy_off posture remains ACTIVE despite flagged FINAL"
            - "monitor enabled (i_on): cy_on posture == FROZEN, frozen_reason == ADVERSE_IMPACT, frozen_from_posture == ACTIVE (automatic freeze side effect)"
            - "unfreeze with note succeeds (a FINAL snapshot exists): posture restored to ACTIVE"

      - name: adverse_impact_unfreeze_requires_final_snapshot
        claim_type: conditional_action
        grounds: ["errors[ERR_ADVERSE_IMPACT_UNRESOLVED]", "state_machines.AssessmentCycle.FROZEN_to_ACTIVE"]
        distinguishing_aspect: "A manual ADVERSE_IMPACT freeze with no FINAL snapshot on file cannot be unfrozen even with a resolution note (ERR_ADVERSE_IMPACT_UNRESOLVED); after a FINAL snapshot is created (allowed while FROZEN), unfreeze succeeds."
        test_recipe:
          setup: ["cycle ACTIVE, frozen with freeze_reason ADVERSE_IMPACT; zero snapshots exist"]
          setup_api_calls:
            - { call: "POST /talent/vendors", payload: { name: "Acme Assessments" }, as: TalentAssessmentAdmin, captures: { v: $.data.id } }
            - { call: "POST /talent/instruments", payload: { vendor_id: "${v}", code: "COG-A", instrument_type: "COGNITIVE_ABILITY", title: "Cognitive Battery A", max_score: 100, pass_floor: 40 }, as: TalentAssessmentAdmin, captures: { i: $.data.id } }
            - { call: "POST /talent/instruments/${i}/evidence", payload: { evidence_type: "CRITERION", title: "Criterion validity study", issuer: "IO Psych Lab", effective_from: "2026-07-01T00:00:00Z", effective_until: "2027-08-01T00:00:00Z" }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/instruments/${i}/evidence", payload: { evidence_type: "CONTENT", title: "Content validity study", issuer: "IO Psych Lab", effective_from: "2026-07-01T00:00:00Z", effective_until: "2027-08-01T00:00:00Z" }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/instruments/${i}/submit-validation-review", as: TalentAssessmentAdmin }
            - { call: "POST /talent/instruments/${i}/validate", as: TalentAssessmentAdmin }
            - { call: "POST /talent/interview-guides", payload: { title: "Structured Guide v1", rubric_items: [{ competency_code: "COMM", weight: 0.6, scale_max: 5 }, { competency_code: "ANAL", weight: 0.4, scale_max: 5 }] }, as: TalentAssessmentAdmin, as_user_id: admin-1, captures: { g: $.data.id } }
            - { call: "POST /talent/interview-guides/${g}/pilot", as: TalentAssessmentAdmin, as_user_id: admin-1 }
            - { call: "POST /talent/interview-guides/${g}/approve", as: TalentAssessmentAdmin, as_user_id: admin-2 }
            - { call: "POST /talent/requisitions", payload: { title: "Senior Analyst", department: "Risk", openings_count: 2 }, as: HiringManager, as_user_id: hm-1, captures: { r: $.data.id } }
            - { call: "POST /talent/requisitions/${r}/cycles", payload: { instrument_id: "${i}", guide_id: "${g}", label: "Fall Cycle", administration_window_start: "2026-08-10T00:00:00Z", administration_window_end: "2026-08-20T00:00:00Z" }, as: HiringManager, as_user_id: hm-1, captures: { cy: $.data.id } }
            - { call: "POST /talent/cycles/${cy}/activate", as: HiringManager, as_user_id: hm-1 }
            - { call: "POST /talent/cycles/${cy}/freeze", payload: { freeze_reason: "ADVERSE_IMPACT", reason_note: "Proactive hold pending metrics." }, as: ComplianceOfficer, captures: { p1: $.data.posture, fr1: $.data.frozen_reason } }
          trigger:
            - { call: "POST /talent/cycles/${cy}/unfreeze", payload: { resolution_note: "Attempting release without any snapshot." }, as: ComplianceOfficer, captures: { err: $.data.error_id } }
            - { call: "POST /talent/cycles/${cy}/adverse-impact-snapshots", payload: { snapshot_type: "FINAL" }, as: ComplianceOfficer, captures: { snap: $.data.id } }
            - { call: "POST /talent/cycles/${cy}/unfreeze", payload: { resolution_note: "FINAL snapshot reviewed and documented." }, as: ComplianceOfficer, captures: { p2: $.data.posture } }
          assert:
            - "manual ADVERSE_IMPACT freeze works from ACTIVE: posture == FROZEN, frozen_reason == ADVERSE_IMPACT"
            - "unfreeze with note but no FINAL snapshot: err == ERR_ADVERSE_IMPACT_UNRESOLVED (422)"
            - "snapshot creation is allowed while FROZEN (snapshot ${snap} created, all groups INSUFFICIENT_N, flagged false)"
            - "unfreeze after FINAL exists: posture == ACTIVE"

