              captures: { crit_final: "$.data.status" }
          assert:
            - "A freshly issued criticism reads status == ISSUED, response_round == 0 and rebuttal_count == 0"
            - "rebut on an ISSUED criticism returns 409 ERR_CRITICISM_STATE_INVALID"
            - "finalize on an ISSUED criticism returns the same 409 ERR_CRITICISM_STATE_INVALID - the two endpoints share one precondition"
            - "The carrier answer returns 201 with round_number == 1 and drives the criticism to RESPONDED"
            - "rebut then returns 200 with status back to ISSUED, rebuttal_count == 1 and response_round still 1 - the counters are independent"
            - "A second consecutive rebut returns 409 ERR_CRITICISM_STATE_INVALID"
