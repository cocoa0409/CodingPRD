            - "RideRequest.${r1_id}.status remains CANCELLED and vehicle_id remains null"
      - name: if_match_curb_safety_outranks_fiscal_on_ride_match
        grounds:
          - validations[priority=10]
          - validations[priority=12]
          - errors[ERR_CURB_ACCESS_DENIED]
          - errors[ERR_NO_VEHICLE_AVAILABLE]
          - state_machines.RideRequest.transitions.REQUESTED_to_MATCHED
        distinguishing_aspect: "The conflicting pair is business_safety (priority 10) against business_fiscal (priority 12): with both no candidate vehicle and a forbidden curb, the match returns ERR_CURB_ACCESS_DENIED rather than ERR_NO_VEHICLE_AVAILABLE — a different pairing from the safety-versus-state instance."
