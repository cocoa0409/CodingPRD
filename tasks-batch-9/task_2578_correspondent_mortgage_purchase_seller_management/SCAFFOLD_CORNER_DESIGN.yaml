              as_user_id: "u-adm-1"
              captures: { p_conf: $.data.id }
            - call: "POST /correspondent/sellers"
              payload: { legal_name: "Harbor Point Mortgage LLC", tin: "823391045", seller_type: "NON_BANK_IMB" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
              captures: { s1: $.data.id }
            - call: "POST /correspondent/sellers/${s1}/financial-statements"
              payload: { fiscal_year_end: "2025-12-31", audited: true, tangible_net_worth_cents: 300000000, liquid_assets_cents: 80000000 }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
              captures: { fs1: $.data.id }
            - call: "POST /correspondent/financial-statements/${fs1}/review"
              payload: { decision: "ACCEPT" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
