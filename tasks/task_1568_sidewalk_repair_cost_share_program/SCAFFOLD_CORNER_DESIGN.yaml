            - { call: "POST /repair-notices/${notice_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
          trigger:
            - { call: "POST /cost-share-applications", payload: { notice_id: "${notice_id}", parcel_id: "${parcel_id}", cycle_id: "${cycle_id}", estimated_qty_sqft: 10.01 }, as: PropertyOwner, as_user_id: "${owner_id}", captures: { share: "$.data.share_pct", prov: "$.data.provisional_award_cents" } }
          assert:
            - "share == 70 (50 base + 20 ARTERIAL + 0 NONE)"
