      - name: corner_template_band_must_be_at_least_as_severe_as_the_complaint
        claim_type: violation_to_error
        grounds: ["validations[priority 43]", "errors[ERR_TEMPLATE_BAND_TOO_LOW]", entities.ResponseTemplate.max_band_allowed]
