# =============================================================================
# PRD Benchmark Scaffold — Nail Salon & Spa Services
# Expert tier (scaffold-generator §0.4 Expert band)
# =============================================================================

scenario: |
  Nail Salon & Spa Services: technician & station, service menu (mani/pedi/enhancement)
  & duration, walk-in vs appointment, sanitation/autoclave log & license, add-on & loyalty,
  gift card, commission/booth split, no-show/deposit

domain_name: nail-salon-spa
api_prefix: ""

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - rate_threshold_triggers          # no-show strike count crosses deposit-mandatory breakpoint
    - dual_variant_calculation         # technician earnings: commission model vs booth-rent model
    - cascading_side_effects           # checkout settles payment -> commission accrual -> loyalty award -> gift-card draw
    - optimistic_concurrency           # OCC on Appointment.version for slot rebooking; on GiftCard.version for redemption

  entity_topology: flat
  # Peer entities linked by FKs. Appointments reference Client/Technician/Station/ServiceMenuItem
  # by id in the body; SanitationLog references Station; AppointmentAddOn junctions Appointment<->AddOn.

  state_machine_shape: parallel
  # Appointment carries two independent dimensions:
  #   booking_status (REQUESTED -> CONFIRMED -> CHECKED_IN -> IN_SERVICE -> COMPLETED / CANCELLED / NO_SHOW)
  #   payment_status (UNPAID -> DEPOSIT_HELD -> SETTLED / REFUNDED / FORFEITED)
  # GiftCard and Technician carry their own cyclic / branching machines.

  relationship_patterns:
    - one_to_many        # Client -> Appointment, Station -> SanitationLog, Technician -> Appointment
    - many_to_many       # Appointment <-> AddOn via AppointmentAddOn junction
    - cross_aggregate    # Appointment.station_id references Station whose sanitation posture gates check-in

  role_model: peer_roles
  # FrontDesk owns booking/checkout, Technician owns own service lifecycle + sanitation logging,
  # SalonManager owns config + license + commission settlement, Client acts on own appointments.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Technician display name.
        constraints: non-empty
      - name: license_number
        type: string
        source: input
        description: State cosmetology/nail-tech license number.
        constraints: non-empty, unique across Technician
      - name: license_expiry
        type: datetime
        source: input
        description: ISO 8601 UTC instant the license lapses. Check-in is gated on license being non-expired.
      - name: pay_model
        type: enum
        source: input
        description: Earnings model for this technician.
        constraints: one of {COMMISSION, BOOTH_RENT}
      - name: commission_pct
        type: number
        source: input
        description: For COMMISSION techs, salon-retained fraction of service revenue (technician keeps 1 - commission_pct). Ignored for BOOTH_RENT.
        default: 0.40
        constraints: 0 <= commission_pct <= 1
      - name: booth_rent_cents
        type: integer
        source: input
        description: For BOOTH_RENT techs, flat per-statement booth rent in cents withheld from the period payout. Ignored for COMMISSION.
        default: 0
        constraints: integer >= 0
      - name: home_station_id
        type: string
        source: input
        description: "FK -> Station.id; the station this technician is normally assigned to."
      - name: status
        type: enum
        source: system
        description: Employment/availability lifecycle state.
        default: ACTIVE
        constraints: one of {ACTIVE, SUSPENDED, TERMINATED}
      - name: accrued_earnings_cents
        type: integer
        source: computed
        description: Running sum of unsettled technician earnings (in cents) from COMPLETED appointments since the last CommissionStatement; reset to 0 when a statement settles.
        default: 0
      - name: lifetime_no_show_strikes_attributed
        type: integer
        source: computed
        description: Count of appointments on this technician that ended NO_SHOW; informational, never gates anything.
        default: 0

  - name: Station
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Station/chair label (e.g., "Pedi-3").
        constraints: non-empty, unique across Station
      - name: requires_autoclave
        type: boolean
        source: input
        description: Whether services at this station require a passing autoclave sterilization cycle within the sanitation freshness window before check-in.
        default: true
      - name: sanitation_status
        type: enum
        source: computed
        description: "Derived sterilization posture, recomputed via §1.3 sanitation_freshness. CLEAN when the latest SanitationLog (by created_at DESC, ties by created_at then no further tie since logs are append-only) for this station has cycle_result==PASS AND (current_clock - that log.created_at) < SANITATION_VALID_HOURS (24h); DIRTY otherwise (no log, latest is FAIL, or the latest PASS is older than 24h)."
        default: DIRTY
        constraints: one of {CLEAN, DIRTY}
      - name: last_pass_sanitation_at
        type: datetime
        source: computed
        description: created_at of the most recent PASS SanitationLog for this station; null if none.
        default: null
      - name: in_service_appointment_id
        type: string
        source: computed
        description: "Denormalized pointer (not a stored FK) to the Appointment.id currently occupying this station (booking_status == IN_SERVICE), or null when the station is free. Discoverable in the reverse direction via GET /appointments?station_id=&booking_status=IN_SERVICE."
        default: null

  - name: SanitationLog
    parent: null
    common_fields: false
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> Station.id; the station that was serviced."
      - name: logged_by_technician_id
        type: string
        source: input
        description: "FK -> Technician.id; technician who ran the autoclave cycle."
      - name: cycle_result
        type: enum
        source: input
        description: Outcome of the autoclave cycle.
        constraints: one of {PASS, FAIL}
      - name: cycle_temp_c
        type: number
        source: input
        description: Peak chamber temperature in Celsius. A PASS requires cycle_temp_c >= 121.0 and hold_minutes >= 30; otherwise the log is rejected as inconsistent.
        constraints: number > 0
      - name: hold_minutes
        type: integer
        source: input
        description: Minutes held at sterilization temperature.
        constraints: integer >= 0

  - name: ServiceMenuItem
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Service name (e.g., "Gel Manicure").
        constraints: non-empty
      - name: category
        type: enum
        source: input
        description: Service family.
        constraints: one of {MANICURE, PEDICURE, ENHANCEMENT}
      - name: duration_minutes
        type: integer
        source: input
        description: Standard chair time in minutes; drives the appointment time window end.
        constraints: integer >= 5
      - name: base_price_cents
        type: integer
        source: input
        description: Service list price in cents.
        constraints: integer >= 0
      - name: loyalty_points_award
        type: integer
        source: input
        description: Loyalty points credited to the client when an appointment for this service COMPLETES.
        default: 0
        constraints: integer >= 0
      - name: requires_sterile_station
        type: boolean
        source: input
        description: Whether this service may only be performed at a station whose sanitation_status is CLEAN (true for ENHANCEMENT by convention, but pinned per item).
        default: true
      - name: is_active
        type: boolean
        source: system
        description: Whether the item is bookable. Retired items remain referenced by historical appointments but cannot be newly booked.
        default: true

  - name: AddOn
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Add-on name (e.g., "Paraffin Dip").
        constraints: non-empty
      - name: price_cents
        type: integer
        source: input
        description: Add-on price in cents, added to the appointment subtotal.
        constraints: integer >= 0
      - name: extra_minutes
        type: integer
        source: input
        description: Additional chair time the add-on contributes to the appointment window.
        default: 0
        constraints: integer >= 0
      - name: is_active
        type: boolean
        source: system
        description: Whether the add-on is currently offered.
        default: true

  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Client name.
        constraints: non-empty
      - name: email
        type: string
        source: input
        description: Contact email.
        constraints: non-empty, unique across Client
      - name: loyalty_points_balance
        type: integer
        source: computed
        description: Redeemable loyalty points; incremented on appointment COMPLETED, decremented when redeemed at checkout.
        default: 0
      - name: active_no_show_strikes
        type: integer
        source: computed
        description: Rolling count of unexpired no-show strikes; increments on NO_SHOW, decays per §1.3 strike-decay, and gates deposit-mandatory booking.
        default: 0
      - name: deposit_required
        type: boolean
        source: computed
        description: True when active_no_show_strikes >= NO_SHOW_STRIKE_DEPOSIT_THRESHOLD; forces a deposit on new bookings.
        default: false
      - name: last_no_show_at
        type: datetime
        source: computed
        description: created_at-equivalent clock instant of the most recent NO_SHOW; basis for strike decay. null if none.
        default: null

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the booked client."
      - name: technician_id
        type: string
        source: input
        description: "FK -> Technician.id; assigned technician."
      - name: station_id
        type: string
        source: input
        description: "FK -> Station.id; assigned station."
      - name: service_item_id
        type: string
        source: input
        description: "FK -> ServiceMenuItem.id; the primary service booked."
      - name: origin
        type: enum
        source: input
        description: Booking origin.
        constraints: one of {WALK_IN, APPOINTMENT}
      - name: start_at
        type: datetime
        source: input
        description: Scheduled window start (ISO 8601 UTC). For WALK_IN, defaults to the current logical clock if omitted.
      - name: end_at
        type: datetime
        source: computed
        description: Window end = start_at + (service.duration_minutes + sum of add-on extra_minutes) minutes. Half-open interval [start_at, end_at).
      - name: booking_status
        type: enum
        source: system
        description: Booking lifecycle dimension.
        default: REQUESTED
        constraints: one of {REQUESTED, CONFIRMED, CHECKED_IN, IN_SERVICE, COMPLETED, CANCELLED, NO_SHOW}
      - name: payment_status
        type: enum
        source: system
        description: Payment lifecycle dimension, independent of booking_status.
        default: UNPAID
        constraints: one of {UNPAID, DEPOSIT_HELD, SETTLED, REFUNDED, FORFEITED}
      - name: deposit_due_cents
        type: integer
        source: computed
        description: Deposit owed at booking time. DEPOSIT_FLAT_CENTS when client.deposit_required at booking, else 0.
        default: 0
      - name: deposit_paid_cents
        type: integer
        source: computed
        description: Deposit actually collected (set when payment_status -> DEPOSIT_HELD).
        default: 0
      - name: subtotal_cents
        type: integer
        source: computed
        description: service.base_price_cents + sum of selected add-on price_cents, snapshotted at confirmation.
        default: 0
      - name: loyalty_points_redeemed
        type: integer
        source: input
        description: Points the client elects to redeem at checkout (each worth LOYALTY_POINT_VALUE_CENTS). Supplied on the checkout call.
        default: 0
      - name: gift_card_id
        type: string
        source: input
        description: "FK -> GiftCard.id; optional gift card applied at checkout."
        default: null
      - name: total_charged_cents
        type: integer
        source: computed
        description: Final amount charged to the client at checkout after deposit credit, loyalty redemption, and gift-card draw; see §1.3 checkout_settlement.
        default: 0
      - name: technician_earning_cents
        type: integer
        source: computed
        description: Technician's share of this appointment's service revenue, computed at COMPLETED per the technician's pay_model (§1.3 technician_earning).
        default: 0
      - name: no_show_strike_charged
        type: boolean
        source: computed
        description: Whether this appointment's NO_SHOW transition incremented the client's strike counter (idempotency guard so a re-read or duplicate sweep cannot double-count).
        default: false

  - name: AppointmentAddOn
    parent: null
    common_fields: false
    fields:
      - name: appointment_id
        type: string
        source: input
        description: "FK -> Appointment.id; the appointment the add-on is attached to."
      - name: add_on_id
        type: string
        source: input
        description: "FK -> AddOn.id; the selected add-on."
      - name: price_cents_snapshot
        type: integer
        source: system
        description: AddOn.price_cents copied at attach time so later price edits do not change a confirmed appointment's subtotal.
      - name: extra_minutes_snapshot
        type: integer
        source: system
        description: AddOn.extra_minutes copied at attach time.

  - name: GiftCard
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Redemption code printed on the card.
        constraints: non-empty, unique across GiftCard
      - name: initial_balance_cents
        type: integer
        source: input
        description: Loaded value in cents at issuance.
        constraints: integer > 0
      - name: balance_cents
        type: integer
        source: computed
        description: Remaining redeemable balance; decremented at checkout, restored on appointment refund.
        default: 0
      - name: purchaser_client_id
        type: string
        source: input
        description: "FK -> Client.id; client who purchased the card (informational; any client may redeem)."
        default: null
      - name: status
        type: enum
        source: system
        description: Gift-card lifecycle.
        default: ACTIVE
        constraints: one of {ACTIVE, DEPLETED, VOID}

  - name: CommissionStatement
    parent: null
    common_fields: true
    fields:
      - name: technician_id
        type: string
        source: input
        description: "FK -> Technician.id; technician the statement settles."
      - name: period_start
        type: datetime
        source: input
        description: Inclusive lower bound of the settlement window (ISO 8601 UTC).
      - name: period_end
        type: datetime
        source: input
        description: Exclusive upper bound of the settlement window; appointments with COMPLETED clock instant in [period_start, period_end) are swept.
      - name: gross_service_cents
        type: integer
        source: computed
        description: Sum of subtotal_cents over swept COMPLETED appointments (add-ons included).
        default: 0
      - name: technician_payout_cents
        type: integer
        source: computed
        description: Final payout per §1.3 statement_payout; depends on pay_model (commission share vs gross-minus-booth-rent).
        default: 0
      - name: salon_retained_cents
        type: integer
        source: computed
        description: gross_service_cents - technician_payout_cents (the salon's retained portion), never negative.
        default: 0
      - name: swept_appointment_count
        type: integer
        source: computed
        description: Number of appointments folded into this statement.
        default: 0
      - name: status
        type: enum
        source: system
        description: Statement lifecycle.
        default: DRAFT
        constraints: one of {DRAFT, SETTLED, VOID}

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---- Appointment.booking_status (parallel dimension A) ------------------
  - entity: Appointment
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /appointments/{id}/confirm"
        actor: FrontDesk
        preconditions:
          - "Appointment.booking_status == REQUESTED"
          - "no other Appointment on the same technician_id with booking_status IN {CONFIRMED, CHECKED_IN, IN_SERVICE} has a half-open window [start_at, end_at) overlapping this one with zero buffer (technician double-book guard)"
          - "every other Appointment on the same station_id with booking_status IN {CONFIRMED, CHECKED_IN, IN_SERVICE} is separated from this window by a gap >= STATION_TURNOVER_MINUTES (10): new.start_at >= other.end_at + 10min OR new.end_at + 10min <= other.start_at (station turnover-buffer guard)"
          - "if Client.deposit_required at booking, payment_status == DEPOSIT_HELD (deposit must already be collected)"
        side_effects:
          - "snapshot subtotal_cents = service.base_price_cents + sum(AppointmentAddOn.price_cents_snapshot)"
          - "recompute end_at from duration + add-on extra minutes"
          - "increments Appointment.version by 1"
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /appointments/{id}/check-in"
        actor: FrontDesk
        preconditions:
          - "Appointment.booking_status == CONFIRMED"
          - "Technician.status == ACTIVE and Technician.license_expiry > current clock (cross-entity: technician license valid)"
          - "if service.requires_sterile_station OR Station.requires_autoclave, then Station.sanitation_status == CLEAN (cross-entity sanitation gate)"
        side_effects:
          - "increments Appointment.version by 1"
      - from: CHECKED_IN
        to: IN_SERVICE
        trigger: "POST /appointments/{id}/start-service"
        actor: Technician
        preconditions:
          - "Appointment.booking_status == CHECKED_IN"
          - "Station.in_service_appointment_id is null (station not already occupied)"
        side_effects:
          - "set Station.in_service_appointment_id = this Appointment.id (cross-entity occupancy)"
          - "increments Appointment.version by 1"
      - from: IN_SERVICE
        to: COMPLETED
        trigger: "POST /appointments/{id}/checkout"
        actor: FrontDesk
        preconditions:
          - "Appointment.booking_status == IN_SERVICE"
          - "payment_status IN {UNPAID, DEPOSIT_HELD} (not already settled)"
          - "if gift_card_id supplied, GiftCard.status == ACTIVE"
          - "loyalty_points_redeemed <= Client.loyalty_points_balance"
        side_effects:
          - "run §1.3 checkout_settlement: compute total_charged_cents, draw from gift card, redeem loyalty, credit deposit"
          - "set payment_status = SETTLED"
          - "compute technician_earning_cents via §1.3 technician_earning"
          - "add technician_earning_cents to Technician.accrued_earnings_cents (cross-entity ledger sync)"
          - "award service.loyalty_points_award to Client.loyalty_points_balance (cross-entity)"
          - "clear Station.in_service_appointment_id (free the station)"
          - "if gift card drawn to zero, GiftCard.status -> DEPLETED (cascade hop)"
          - "increments Appointment.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /appointments/{id}/cancel"
        actor: FrontDesk
        preconditions:
          - "Appointment.booking_status IN {REQUESTED, CONFIRMED}"
        side_effects:
          - "if current clock <= start_at - CANCEL_FREE_WINDOW_MINUTES (120) and payment_status == DEPOSIT_HELD, refund deposit: payment_status -> REFUNDED, deposit returned; else if payment_status == DEPOSIT_HELD, deposit forfeited: payment_status -> FORFEITED"
          - "increments Appointment.version by 1"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /appointments/{id}/cancel"
        actor: FrontDesk
        preconditions:
          - "Appointment.booking_status == REQUESTED"
        side_effects:
          - "if payment_status == DEPOSIT_HELD, refund deposit (REFUNDED) when current clock <= start_at - CANCEL_FREE_WINDOW_MINUTES (120) else FORFEITED"
          - "increments Appointment.version by 1"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /appointments/{id}/mark-no-show"
        actor: FrontDesk
        preconditions:
          - "Appointment.booking_status == CONFIRMED"
          - "current clock >= start_at + NO_SHOW_GRACE_MINUTES (15) (grace elapsed)"
          - "no_show_strike_charged == false"
        side_effects:
          - "increment Client.active_no_show_strikes by 1 (cross-entity); set Client.last_no_show_at = current clock; set no_show_strike_charged = true (idempotency guard)"
          - "if resulting Client.active_no_show_strikes >= NO_SHOW_STRIKE_DEPOSIT_THRESHOLD, set Client.deposit_required = true (cascade hop: strike bump -> deposit flag flip)"
          - "if payment_status == DEPOSIT_HELD, set payment_status = FORFEITED (deposit forfeited on no-show)"
          - "increment Technician.lifetime_no_show_strikes_attributed by 1"
          - "increments Appointment.version by 1"

  # ---- Appointment.payment_status (parallel dimension B) ------------------
  - entity: Appointment
    initial_state: UNPAID
    terminal_states: [SETTLED, REFUNDED, FORFEITED]
    transitions:
      - from: UNPAID
        to: DEPOSIT_HELD
        trigger: "POST /appointments/{id}/pay-deposit"
        actor: FrontDesk
        preconditions:
          - "Appointment.payment_status == UNPAID"
          - "deposit_due_cents > 0 (a deposit is actually owed)"
          - "Appointment.booking_status IN {REQUESTED, CONFIRMED}"
        side_effects:
          - "set deposit_paid_cents = deposit_due_cents"
          - "increments Appointment.version by 1"
        note: "Independent of booking_status; a REQUESTED appointment can hold a deposit before CONFIRMED."
      - from: SETTLED
        to: REFUNDED
        trigger: "POST /appointments/{id}/refund-settled"
        actor: SalonManager
        preconditions:
          - "Appointment.payment_status == SETTLED (booking_status remains COMPLETED)"
        side_effects:
          - "restore the gift-card draw to GiftCard.balance_cents (cross-entity); if the card was DEPLETED, GiftCard.status -> ACTIVE (cascade hop: balance restore -> status revert)"
          - "return redeemed loyalty points and remove awarded points on Client.loyalty_points_balance (cross-entity)"
          - "debit Technician.accrued_earnings_cents by this appointment's technician_earning_cents (cross-entity ledger reversal)"
          - "increments Appointment.version by 1"
        note: "Compensating action for checkout_settlement; leaves GiftCard.balance_cents and Client.loyalty_points_balance at their pre-checkout values."

  # ---- GiftCard (branching with revert) -----------------------------------
  - entity: GiftCard
    initial_state: ACTIVE
    terminal_states: [VOID]
    transitions:
      - from: ACTIVE
        to: DEPLETED
        trigger: "system: checkout draws balance to 0"
        actor: system
        preconditions:
          - "GiftCard.balance_cents == 0 after a checkout draw"
        side_effects:
          - "increments GiftCard.version by 1"
      - from: DEPLETED
        to: ACTIVE
        trigger: "system: appointment refund restores balance"
        actor: system
        preconditions:
          - "a previously-settled Appointment that drew this card is refunded, restoring balance_cents > 0 (cycle: ACTIVE->DEPLETED->ACTIVE)"
        side_effects:
          - "increments GiftCard.version by 1"
      - from: ACTIVE
        to: VOID
        trigger: "POST /gift-cards/{id}/void"
        actor: SalonManager
        preconditions:
          - "GiftCard.status == ACTIVE"
        side_effects:
          - "set balance_cents = 0"
          - "increments GiftCard.version by 1"

  # ---- Technician (branching with revert) ---------------------------------
  - entity: Technician
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /technicians/{id}/suspend"
        actor: SalonManager
        preconditions:
          - "Technician.status == ACTIVE"
          - "no Appointment on this technician with booking_status == IN_SERVICE"
        side_effects:
          - "increments Technician.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /technicians/{id}/reinstate"
        actor: SalonManager
        preconditions:
          - "Technician.status == SUSPENDED"
          - "Technician.license_expiry > current clock (cannot reinstate on an expired license)"
        side_effects:
          - "increments Technician.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /technicians/{id}/terminate"
        actor: SalonManager
        preconditions:
          - "Technician.status == SUSPENDED"
          - "Technician.accrued_earnings_cents == 0 (all earnings must be settled into a statement first)"
        side_effects:
          - "increments Technician.version by 1"

  # ---- CommissionStatement (linear w/ guarded settle) ---------------------
  - entity: CommissionStatement
    initial_state: DRAFT
    terminal_states: [SETTLED, VOID]
    transitions:
      - from: DRAFT
        to: SETTLED
        trigger: "POST /commission-statements/{id}/settle"
        actor: SalonManager
        preconditions:
          - "CommissionStatement.status == DRAFT"
          - "Technician referenced exists and Technician.status != TERMINATED"
        side_effects:
          - "compute gross_service_cents, technician_payout_cents, salon_retained_cents, swept_appointment_count via §1.3 statement_payout"
          - "reset Technician.accrued_earnings_cents to 0 (cross-entity ledger reset)"
          - "increments CommissionStatement.version by 1"
      - from: DRAFT
        to: VOID
        trigger: "POST /commission-statements/{id}/void"
        actor: SalonManager
        preconditions:
          - "CommissionStatement.status == DRAFT"
        side_effects:
          - "increments CommissionStatement.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: appointment-checkout-stale-version
    parent_entity: Appointment
    write_endpoint: "POST /appointments/{id}/checkout"
    occ_field: "expected_appointment_version"
    description: |
      Checkout settles an Appointment and runs the full §1.3 checkout_settlement
      cascade (gift-card draw, loyalty redemption, deposit credit, commission
      accrual). A checkout whose expected_appointment_version no longer equals
      the stored Appointment.version is rejected: an add-on attach, a deposit
      payment, or a re-confirm has advanced the appointment since the client
      last observed it, so the snapshotted subtotal the client is about to pay
      against is stale. This is a true CREATE-with-supersede shape because a
      checkout legitimately could succeed against the appointment in IN_SERVICE
      — the version guard is the only thing distinguishing the stale view.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: giftcard-redeem-stale-version
    parent_entity: GiftCard
    write_endpoint: "POST /gift-cards/{id}/redeem"
    occ_field: "expected_gift_card_version"
    description: |
      A standalone gift-card redemption (manual balance draw) against a GiftCard
      whose expected_gift_card_version no longer matches is rejected. A prior
      redemption or a checkout draw has lowered the balance and advanced the
      card's version; the current writer's view of the remaining balance is
      stale and the draw it computed could overdraw. OCC reduces this to a
      deterministic stale-version check.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: checkout_settlement
    trigger: "Appointment IN_SERVICE -> COMPLETED via POST /appointments/{id}/checkout"
    algorithm: waterfall_allocation
    formula: |
      # Evaluation order is PINNED (circular-looking dependency resolved):
      # subtotal -> deposit credit -> loyalty redemption -> gift-card draw -> client charge.
      gross = subtotal_cents                       # snapshot from CONFIRMED
      # 1. apply deposit already held against gross
      deposit_credit = deposit_paid_cents          # 0 if no deposit was held
      after_deposit = max(0, gross - deposit_credit)
      # 2. apply loyalty redemption (each point = LOYALTY_POINT_VALUE_CENTS), capped at after_deposit
      requested_loyalty_cents = loyalty_points_redeemed * LOYALTY_POINT_VALUE_CENTS
      loyalty_applied_cents = min(requested_loyalty_cents, after_deposit)
      # points actually consumed = ceil(loyalty_applied_cents / LOYALTY_POINT_VALUE_CENTS)
      points_consumed = ceil(loyalty_applied_cents / LOYALTY_POINT_VALUE_CENTS)
      after_loyalty = after_deposit - loyalty_applied_cents
      # 3. draw gift card (if supplied), capped at min(card.balance_cents, after_loyalty)
      gift_draw_cents = min(gift_card.balance_cents, after_loyalty) if gift_card_id else 0
      after_gift = after_loyalty - gift_draw_cents
      # 4. remainder is charged to the client
      total_charged_cents = after_gift
      # side ledgers:
      client.loyalty_points_balance -= points_consumed
      gift_card.balance_cents -= gift_draw_cents
    input_set: "single appointment in IN_SERVICE; its snapshotted subtotal_cents, deposit_paid_cents, the chosen gift card (if any), and loyalty_points_redeemed"
    constants:
      LOYALTY_POINT_VALUE_CENTS: 10
    precision: "all amounts integer cents; ceil() on points_consumed rounds toward more points consumed; no fractional cents"
    variants:
      - name: with_deposit_and_giftcard
        when: "deposit was held AND a gift card is supplied"
        difference: "deposit credit applied before loyalty and gift draw; gift draw never reduces below 0; order pinned deposit->loyalty->gift"
      - name: gift_only
        when: "no deposit, gift card supplied"
        difference: "after_deposit == gross; gift draw applies after loyalty against the full after_loyalty amount"

  - name: technician_earning
    trigger: "Appointment IN_SERVICE -> COMPLETED via POST /appointments/{id}/checkout (per-appointment technician share)"
    algorithm: threshold
    formula: |
      # Per-appointment technician earning, recorded on the appointment and accrued.
      # gross service revenue for this appointment = subtotal_cents (service + add-ons).
      if technician.pay_model == COMMISSION:
        # technician keeps (1 - commission_pct) of subtotal, salon keeps commission_pct.
        technician_earning_cents = round_half_up(subtotal_cents * (1 - technician.commission_pct))
      else:  # BOOTH_RENT
        # booth-rent techs keep 100% of per-appointment service revenue at the line;
        # the flat booth rent is withheld once per statement, not per appointment.
        technician_earning_cents = subtotal_cents
    input_set: "one COMPLETED appointment and its technician's pay_model + commission_pct"
    constants: {}
    precision: "integer cents, round_half_up on the commission multiplication"
    variants:
      - name: commission_model
        when: "technician.pay_model == COMMISSION"
        difference: "earning = round_half_up(subtotal * (1 - commission_pct)); salon retains commission_pct * subtotal"
      - name: booth_rent_model
        when: "technician.pay_model == BOOTH_RENT"
        difference: "earning = full subtotal at the line; rent withheld at statement time, so per-appointment salon retention is 0"

  - name: statement_payout
    trigger: "CommissionStatement DRAFT -> SETTLED via POST /commission-statements/{id}/settle"
    algorithm: aggregation
    formula: |
      # Sweep appointments for this technician COMPLETED within [period_start, period_end).
      # COMPLETED clock instant is the appointment's updated_at at the COMPLETED transition;
      # use updated_at as the sweep timestamp. Sort swept set by updated_at ASC, then created_at ASC
      # as deterministic tie-break (never id).
      swept = [a for a in Appointments
               if a.technician_id == stmt.technician_id
               and a.booking_status == COMPLETED
               and period_start <= a.updated_at < period_end]
      swept_appointment_count = len(swept)
      gross_service_cents = sum(a.subtotal_cents for a in swept)
      if technician.pay_model == COMMISSION:
        # SUM-THEN-ROUND is PINNED: aggregate the gross first, then apply the commission once.
        technician_payout_cents = round_half_up(gross_service_cents * (1 - technician.commission_pct))
      else:  # BOOTH_RENT
        technician_payout_cents = max(0, gross_service_cents - technician.booth_rent_cents)
      salon_retained_cents = gross_service_cents - technician_payout_cents
    input_set: "all COMPLETED appointments for the technician with updated_at in [period_start, period_end)"
    constants: {}
    precision: |
      integer cents. Rounding order PINNED to SUM-THEN-ROUND: aggregate gross over swept
      appointments first, then apply (1 - commission_pct) once. This deliberately differs
      from per-appointment technician_earning (ROUND-PER-LINE then accrue), so the statement
      total may differ from the sum of per-appointment technician_earning_cents by up to a cent.
    variants:
      - name: commission_sum_then_round
        when: "pay_model == COMMISSION"
        difference: "round once over the aggregate gross (sum-then-round), NOT the sum of per-line rounded earnings"
      - name: booth_rent_minus_flat
        when: "pay_model == BOOTH_RENT"
        difference: "payout = gross - flat booth_rent_cents, floored at 0; salon retains exactly booth_rent_cents (or gross if gross < rent)"

  - name: deposit_assessment
    trigger: "POST /appointments (booking) — determines deposit_due_cents"
    algorithm: threshold
    formula: |
      # At booking time, read the client's CURRENT active_no_show_strikes (after decay, see strike_decay).
      effective_strikes = client.active_no_show_strikes   # already decayed on read
      if effective_strikes >= NO_SHOW_STRIKE_DEPOSIT_THRESHOLD:
        deposit_due_cents = DEPOSIT_FLAT_CENTS
        client.deposit_required = true
      else:
        deposit_due_cents = 0
        client.deposit_required = false
    input_set: "the booking client's active_no_show_strikes at booking time"
    constants:
      NO_SHOW_STRIKE_DEPOSIT_THRESHOLD: 2
      DEPOSIT_FLAT_CENTS: 2000
    precision: "integer cents; threshold is >= (2 strikes triggers, 1 does not)"
    variants:
      - name: deposit_mandatory
        when: "active_no_show_strikes >= 2"
        difference: "deposit_due_cents = 2000; booking cannot CONFIRM until DEPOSIT_HELD"
      - name: deposit_waived
        when: "active_no_show_strikes < 2"
        difference: "deposit_due_cents = 0; booking may CONFIRM directly"

  - name: strike_decay
    trigger: "read of Client.active_no_show_strikes (booking, deposit_assessment, GET client)"
    algorithm: decay_function
    formula: |
      # Strikes decay one full step per STRIKE_DECAY_DAYS elapsed since last_no_show_at.
      # Step decay (not continuous): floor of elapsed days / window.
      if client.last_no_show_at is null:
        active_no_show_strikes = stored_raw_strikes
      else:
        elapsed_days = floor((current_clock - client.last_no_show_at) / 86400 seconds)
        decayed = floor(elapsed_days / STRIKE_DECAY_DAYS)
        active_no_show_strikes = max(0, stored_raw_strikes - decayed)
    input_set: "stored raw strike count and last_no_show_at vs current logical clock"
    constants:
      STRIKE_DECAY_DAYS: 30
    precision: "integer strikes; floor on elapsed-day division; decay clamped at 0"
    variants:
      - name: within_window_no_decay
        when: "elapsed < 30 days since last_no_show_at"
        difference: "no decay; effective == raw"
      - name: full_decay
        when: "elapsed >= 60 days (two windows)"
        difference: "two strikes decayed away; effective = max(0, raw - 2)"

  - name: sanitation_freshness
    trigger: "read of Station.sanitation_status (GET station, check-in gate)"
    algorithm: threshold
    formula: |
      latest = SanitationLog for this station ordered by created_at DESC, take first (append-only, no further tie)
      if latest is null or latest.cycle_result == FAIL:
        sanitation_status = DIRTY
      elif (current_clock - latest.created_at) < SANITATION_VALID_HOURS hours:
        sanitation_status = CLEAN
      else:
        sanitation_status = DIRTY    # PASS but stale
      last_pass_sanitation_at = created_at of the most recent PASS log (regardless of staleness), else null
    input_set: "the latest SanitationLog for the station vs current logical clock"
    constants:
      SANITATION_VALID_HOURS: 24
    precision: "boundary is strict <: a PASS exactly 24h old is stale (DIRTY); < 24h is CLEAN"
    variants:
      - name: fresh_pass
        when: "latest log PASS and age < 24h"
        difference: "CLEAN"
      - name: stale_pass
        when: "latest log PASS but age >= 24h"
        difference: "DIRTY despite a prior PASS"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role is permitted for this operation per §1.7; for entity_backed roles acting on own resource, X-User-ID matches the resource owner FK"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "every path id and every FK in the body references an existing resource, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"

  - priority: 4
    category: business_constraint
    check: "request body is well-formed: required fields present, enum values legal, integers in range, start_at parses as ISO 8601"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 5
    category: business_constraint
    check: "uniqueness: Technician.license_number, Station.name, ServiceMenuItem name within active set, Client.email, GiftCard.code are unique on create"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /technicians, POST /stations, POST /menu-items, POST /clients, POST /gift-cards"

  - priority: 6
    category: state
    check: "the target resource is in a state from which the requested transition is defined in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 7
    category: business_referential
    check: "the booked ServiceMenuItem.is_active == true and any selected AddOn.is_active == true at booking/attach time"
    error_id: ERR_ITEM_RETIRED
    http_status: 409
    applies_to: "POST /appointments, POST /appointments/{id}/add-ons"

  - priority: 8
    category: business_safety
    check: "on check-in, if service.requires_sterile_station OR station.requires_autoclave, station.sanitation_status must be CLEAN"
    error_id: ERR_STATION_NOT_STERILE
    http_status: 409
    applies_to: "POST /appointments/{id}/check-in"

  - priority: 9
    category: business_safety
    check: "on check-in, the assigned technician's license must be non-expired (license_expiry > current clock) and technician.status == ACTIVE"
    error_id: ERR_LICENSE_EXPIRED
    http_status: 409
    applies_to: "POST /appointments/{id}/check-in"

  - priority: 10
    category: business_safety
    check: "SanitationLog with cycle_result == PASS must have cycle_temp_c >= 121.0 AND hold_minutes >= 30; otherwise the PASS claim is rejected"
    error_id: ERR_STERILIZATION_INVALID
    http_status: 422
    applies_to: "POST /sanitation-logs"

  - priority: 11
    category: business_temporal
    check: "on confirm, the appointment's half-open window [start_at, end_at) must not overlap any CONFIRMED/CHECKED_IN/IN_SERVICE window on the same technician (technician overlap)"
    error_id: ERR_TECHNICIAN_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /appointments/{id}/confirm"

  - priority: 12
    category: business_temporal
    check: "on confirm, same-station appointments must be separated by a gap of at least STATION_TURNOVER_MINUTES (10): for every other CONFIRMED/CHECKED_IN/IN_SERVICE appointment on the same station, the new window must satisfy new.start_at >= other.end_at + 10min OR new.end_at + 10min <= other.start_at. A new start_at strictly less than other.end_at + 10min (and not entirely before) conflicts. Boundary: a gap of exactly 10min is allowed (>=)."
    error_id: ERR_STATION_TURNOVER_CONFLICT
    http_status: 409
    applies_to: "POST /appointments/{id}/confirm"

  - priority: 13
    category: business_temporal
    check: "mark-no-show only after start_at + NO_SHOW_GRACE_MINUTES (15) has elapsed on the logical clock"
    error_id: ERR_NO_SHOW_TOO_EARLY
    http_status: 409
    applies_to: "POST /appointments/{id}/mark-no-show"

  - priority: 14
    category: business_fiscal
    check: "deposit-required client (deposit_required == true) cannot CONFIRM until payment_status == DEPOSIT_HELD"
    error_id: ERR_DEPOSIT_REQUIRED
    http_status: 402
    applies_to: "POST /appointments/{id}/confirm"

  - priority: 15
    category: business_fiscal
    check: "loyalty_points_redeemed at checkout must not exceed client.loyalty_points_balance"
    error_id: ERR_INSUFFICIENT_LOYALTY
    http_status: 409
    applies_to: "POST /appointments/{id}/checkout"

  - priority: 16
    category: business_fiscal
    check: "gift-card redemption/draw must not exceed GiftCard.balance_cents (no overdraw) and the card must be ACTIVE"
    error_id: ERR_GIFT_CARD_OVERDRAW
    http_status: 409
    applies_to: "POST /gift-cards/{id}/redeem, POST /appointments/{id}/checkout"

  - priority: 17
    category: business_fiscal
    check: "OCC: expected_<parent>_version on checkout / gift-card redeem must equal the stored parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /appointments/{id}/checkout, POST /gift-cards/{id}/redeem"

  - priority: 18
    category: business_constraint
    check: "pagination params within bounds (limit 1..100, offset >= 0)"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- Technicians --------------------------------------------------------
  - method: POST
    path: "/technicians"
    description: "Create a technician."
    roles: [SalonManager]
    code: 201
    input: ["full_name", "license_number", "license_expiry", "pay_model", "commission_pct?", "booth_rent_cents?", "home_station_id"]
    output: Technician
    side_effects: ["status defaults ACTIVE; accrued_earnings_cents=0"]
  - method: GET
    path: "/technicians"
    description: "List technicians; optional filter by home_station_id or status."
    roles: [SalonManager, FrontDesk]
    code: 200
    input: ["home_station_id?", "status?", "limit?", "offset?"]
    output: Technician[]
    side_effects: []
  - method: GET
    path: "/technicians/{id}"
    description: "Fetch one technician."
    roles: [SalonManager, FrontDesk, Technician]
    code: 200
    input: []
    output: Technician
    side_effects: []
  - method: POST
    path: "/technicians/{id}/suspend"
    description: "Suspend an active technician."
    roles: [SalonManager]
    code: 200
    input: []
    output: Technician
    side_effects: ["status -> SUSPENDED"]
  - method: POST
    path: "/technicians/{id}/reinstate"
    description: "Reinstate a suspended technician (license must be valid)."
    roles: [SalonManager]
    code: 200
    input: []
    output: Technician
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/technicians/{id}/terminate"
    description: "Terminate a suspended technician with zero accrued earnings."
    roles: [SalonManager]
    code: 200
    input: []
    output: Technician
    side_effects: ["status -> TERMINATED"]
  - method: GET
    path: "/technicians/{id}/appointments"
    description: "Reverse-reachability: appointments assigned to this technician."
    roles: [SalonManager, FrontDesk, Technician]
    code: 200
    input: ["booking_status?", "limit?", "offset?"]
    output: Appointment[]
    side_effects: []
  - method: GET
    path: "/technicians/{id}/commission-statements"
    description: "Reverse-reachability: commission statements for this technician."
    roles: [SalonManager, Technician]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CommissionStatement[]
    side_effects: []

  # ---- Stations -----------------------------------------------------------
  - method: POST
    path: "/stations"
    description: "Create a station."
    roles: [SalonManager]
    code: 201
    input: ["name", "requires_autoclave?"]
    output: Station
    side_effects: ["sanitation_status defaults DIRTY"]
  - method: GET
    path: "/stations"
    description: "List stations."
    roles: [SalonManager, FrontDesk, Technician]
    code: 200
    input: ["sanitation_status?", "limit?", "offset?"]
    output: Station[]
    side_effects: []
  - method: GET
    path: "/stations/{id}"
    description: "Fetch one station with derived sanitation_status and occupancy."
    roles: [SalonManager, FrontDesk, Technician]
    code: 200
    input: []
    output: Station
    side_effects: []
  - method: GET
    path: "/stations/{id}/sanitation-logs"
    description: "Reverse-reachability: sanitation logs for this station (newest first)."
    roles: [SalonManager, FrontDesk, Technician]
    code: 200
    input: ["cycle_result?", "limit?", "offset?"]
    output: SanitationLog[]
    side_effects: []

  # ---- Sanitation logs ----------------------------------------------------
  - method: POST
    path: "/sanitation-logs"
    description: "Record an autoclave cycle for a station. A PASS recomputes the station's sanitation_status to CLEAN and stamps last_pass_sanitation_at."
    roles: [Technician, SalonManager]
    code: 201
    input: [station_id, logged_by_technician_id, cycle_result, cycle_temp_c, hold_minutes]
    output: SanitationLog
    side_effects: ["if PASS: Station.sanitation_status -> CLEAN, Station.last_pass_sanitation_at = created_at; if FAIL: Station.sanitation_status -> DIRTY"]
  - method: GET
    path: "/sanitation-logs"
    description: "List sanitation logs; reverse-reachability by station or logging technician."
    roles: [SalonManager, FrontDesk, Technician]
    code: 200
    input: ["station_id?", "logged_by_technician_id?", "cycle_result?", "limit?", "offset?"]
    output: SanitationLog[]
    side_effects: []
  - method: GET
    path: "/sanitation-logs/{id}"
    description: "Fetch one sanitation log."
    roles: [SalonManager, FrontDesk, Technician]
    code: 200
    input: []
    output: SanitationLog
    side_effects: []

  # ---- Menu items ---------------------------------------------------------
