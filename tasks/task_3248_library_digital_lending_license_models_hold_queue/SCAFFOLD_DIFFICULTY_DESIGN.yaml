  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: renew_patron_suspended_state_beats_hold_constraint
        grounds:
          - validations.priority_5_state
          - validations.priority_7_business_constraint
          - errors.ERR_PATRON_NOT_ACTIVE
          - errors.ERR_RENEWAL_BLOCKED_BY_HOLDS
        distinguishing_aspect: |
          Category pair state (5) vs business_constraint (7): a renewal
          violating BOTH (patron SUSPENDED; another patron's PLACED hold on
          the title) must return ERR_PATRON_NOT_ACTIVE — the state error wins
          because priority 5 precedes 7.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Library L, fund, title T, OCOU license copies 1."
            - "P0 has an ACTIVE loan of T; P1 has a PLACED hold on T; P0 is then SUSPENDED."
          setup_api_calls:
            - *d_clock
            - *d_cons
            - *d_lib
            - *d_fund
            - *d_p0
            - *d_p1
            - *d_title
            - *d_order
            - *d_propose
            - *d_approve
            - *d_fulfill
            - *d_checkout0
            - call: "POST /lending/holds"
              payload: { patron_id: "${pat1_id}", title_id: "${title_id}" }
              as: Patron
              as_user_id: "${pat1_id}"
            - call: "POST /lending/patrons/${pat0_id}/suspend"
              payload: {}
              as: LibraryAdmin
              as_user_id: "${lib_id}"
            - call: "GET /lending/loans"
              payload: { patron_id: "${pat0_id}", status: "ACTIVE" }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
              captures: { loan0_id: "$.data[0].id" }
          trigger:
            - call: "POST /lending/loans/${loan0_id}/renew"
              payload: {}
              as: Patron
              as_user_id: "${pat0_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_PATRON_NOT_ACTIVE"
            - "error_id is NOT ERR_RENEWAL_BLOCKED_BY_HOLDS even though a PLACED hold exists (state priority 5 beats constraint priority 7)"
            - "Loan.${loan0_id}.renewals_used == 0 and due_at unchanged"

      - name: order_approve_temporal_beats_fiscal
        grounds:
          - validations.priority_8_business_temporal
          - validations.priority_9_business_fiscal
          - errors.ERR_ORDER_OUTSIDE_FISCAL_PERIOD
          - errors.ERR_BUDGET_EXCEEDED
        distinguishing_aspect: |
          Category pair business_temporal (8) vs business_fiscal (9) — a
          different pair from state-vs-constraint: an approval violating BOTH
          (clock after the fund's period end; estimate exceeds availability)
          must return ERR_ORDER_OUTSIDE_FISCAL_PERIOD, because temporal checks
          precede fiscal checks.
        test_recipe:
          setup:
            - "Clock starts 2026-09-01T00:00:00Z. Library L, fund F (budget 1000000, period ends 2027-01-01T00:00:00Z exclusive), title T priced 2000000 per copy."
            - "An OCOU order (copies 1, estimated 2000000) created and proposed while the clock is inside the period."
            - "Clock advanced to 2027-01-02T00:00:00Z (outside the fund period) before approval."
          setup_api_calls:
            - *d_clock
            - *d_cons
            - *d_lib
            - *d_fund
            - call: "POST /lending/consortiums/${cons_id}/titles"
              payload: { isbn: "9780000000006", name: "Pricey Title", author: "Author F", price_ocou_cents: 2000000, metered_time_price_cents: 4000, metered_time_days: 365, metered_circ_price_cents: 3000, metered_circ_count: 26, cpc_price_per_circ_cents: 199, simultaneous_use_price_cents: 9000, simultaneous_use_days: 180 }
              as: ConsortiumAdmin
              captures: { titlep_id: $.data.id }
            - call: "POST /lending/acquisition-orders"
              payload: { library_id: "${lib_id}", budget_fund_id: "${fund_id}", title_id: "${titlep_id}", model: "OCOU", copies: 1, expected_budget_fund_version: "${fund_v}" }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
              captures: { orderp_id: $.data.id }
            - call: "POST /lending/acquisition-orders/${orderp_id}/propose"
              payload: {}
              as: LibraryAdmin
              as_user_id: "${lib_id}"
            - call: "POST /lending/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00Z" }
              as: ConsortiumAdmin
          trigger:
            - call: "POST /lending/acquisition-orders/${orderp_id}/approve"
              payload: {}
              as: LibraryAdmin
              as_user_id: "${lib_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_ORDER_OUTSIDE_FISCAL_PERIOD"
            - "error_id is NOT ERR_BUDGET_EXCEEDED even though estimated 2000000 > available_committed 1000000 (temporal priority 8 beats fiscal priority 9)"
            - "AcquisitionOrder.${orderp_id}.status == PROPOSED (unchanged)"

