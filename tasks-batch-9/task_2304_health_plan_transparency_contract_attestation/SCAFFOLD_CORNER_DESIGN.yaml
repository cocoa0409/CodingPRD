          - endpoints[GET /compliance/plan-years/{id}/penalty-projection]
        distinguishing_aspect: "The covered-lives tiers are half-open on the low side and inclusive at 500 and 5000: covered_lives 499 -> 1.0, 500 -> 1.5, 4999 -> 1.5, 5000 -> 2.0. The projection echoes size_multiplier even with an empty open-deficiency set, so the tier function is observable without any deficiency."
        test_recipe:
          setup:
            - "Clock at 2027-06-15T09:00:00Z."
            - "Four SETUP PlanYears spanning 2027-01-01..2027-12-31 differing only in covered_lives: 499, 500, 4999 and 5000."
