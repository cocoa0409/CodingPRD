              as: ProcessTechnician
          assert:
            - "the first trigger returns HTTP 409 with error_id ERR_GLASS_GRADE_UNSUITABLE"
            - "the first trigger does NOT return ERR_INSUFFICIENT_BLANKS"
            - "the second trigger returns HTTP 409 with error_id ERR_INSUFFICIENT_BLANKS"
            - "GlassLot.${gb}.effective_index_homogeneity_grade == H5"
            - "GlassLot.${gb}.effective_striae_grade == D"
            - "GlassLot.${gb}.reserved_blank_count == 0"
            - "GlassLot.${gb}.available_blank_count == 1"
            - "GlassLot.${gg}.effective_index_homogeneity_grade == H2"
            - "GlassLot.${gg}.reserved_blank_count == 0"
            - "GlassLot.${gg}.available_blank_count == 1"

  # =========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: capability_ratio_exactly_at_quarter_limit_is_admissible
        grounds:
          - calculations.metrology_capability_index
          - calculations.metrology_capability_index.constants.MAX_CAPABILITY_RATIO
          - validations.priority_17
          - entities.ProcessRun.fields.capability_ratio_at_scheduling
          - conventions.logical_clock
        distinguishing_aspect: |
          With base_uncertainty_waves 0.0050 against a 0.0800 budget the ratio is exactly 0.2500 on
          calibration day 0 and the booking is accepted, because the gate is inclusive; advancing the
          logical clock by exactly one day lifts effective_uncertainty_waves to 0.005100 and the ratio to
          0.2550, one ten-thousandth over the limit, and the identical booking is refused with
          ERR_METROLOGY_CAPABILITY_INSUFFICIENT.
        test_recipe:
          setup:
            - "A RELEASED design with tolerance_budget_waves 0.0800, a certified lot, a WorkOrder in BLANKS_RESERVED, and instrument IF-2540-1 with base_uncertainty_waves 0.0050, calibration_interval_days 90 and last_calibrated_utc 2026-08-01T00:00:00Z."
            - "The clock starts at 2026-08-01T00:00:00Z (days_since_calibration 0) and is moved to 2026-08-02T00:00:00Z (days_since_calibration 1) between the two attempts."
          setup_api_calls:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/release"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/glass-lots"
              payload: { lot_code: "GL-2540-1", glass_type: "N-BK7", melt_index_nd: 1.516800, total_blank_count: 20, declared_index_homogeneity_grade: "H2", declared_striae_grade: "A" }
              as: ProcurementOfficer
              captures: { g1: $.data.id }
            - call: "POST /optics/glass-lots/${g1}/certification"
              payload: { measured_index_homogeneity_grade: "H3", measured_striae_grade: "B", certificate_reference: "CERT-2540-1" }
              as: ProcurementOfficer
              captures: { g1v: $.data.version }
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-1", design_id: "${d1}", glass_lot_id: "${g1}", element_count: 2, expected_glass_lot_version: "${g1v}" }
              as: ProcessTechnician
              captures: { w1: $.data.id }
            - call: "POST /optics/metrology-instruments"
              payload: { instrument_code: "IF-2540-1", instrument_type: "PHASE_SHIFTING_INTERFEROMETER", base_uncertainty_waves: 0.0050, last_calibrated_utc: "2026-08-01T00:00:00Z", lateral_resolution_um: 5.0, calibration_interval_days: 90 }
              as: PlantAdmin
              captures: { i1: $.data.id }
          trigger:
            - call: "POST /optics/process-runs"
              payload: { work_order_id: "${w1}", metrology_instrument_id: "${i1}", run_stage: "POLISHING", metrology_window_start_utc: "2026-08-01T08:00:00Z", metrology_window_end_utc: "2026-08-01T10:00:00Z" }
              as: ProcessTechnician
              captures: { r1: $.data.id }
            - call: "POST /optics/process-runs/${r1}/cancel"
              payload: { cancel_reason: "RESCHEDULED_FOR_DRIFT_STUDY" }
              as: ProcessTechnician
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /optics/process-runs"
              payload: { work_order_id: "${w1}", metrology_instrument_id: "${i1}", run_stage: "POLISHING", metrology_window_start_utc: "2026-08-02T08:00:00Z", metrology_window_end_utc: "2026-08-02T10:00:00Z" }
              as: ProcessTechnician
          assert:
            - "the first trigger returns HTTP 201"
            - "MetrologyInstrument.${i1}.effective_uncertainty_waves == 0.005000 before the clock move"
            - "ProcessRun.${r1}.capability_ratio_at_scheduling == 0.2500"
            - "ProcessRun.${r1}.window_minutes == 120"
            - "MetrologyInstrument.${i1}.booked_minutes_total == 120 immediately after the first trigger"
            - "after the cancel: ProcessRun.${r1}.run_status == CANCELLED and MetrologyInstrument.${i1}.booked_minutes_total == 0"
            - "after the clock move: MetrologyInstrument.${i1}.days_since_calibration == 1 and MetrologyInstrument.${i1}.effective_uncertainty_waves == 0.005100"
            - "the last trigger returns HTTP 409 with error_id ERR_METROLOGY_CAPABILITY_INSUFFICIENT (ratio 0.2550 > 0.2500)"
            - "MetrologyInstrument.${i1}.booked_minutes_total == 0 after the refusal"

      - name: tolerance_analysis_on_empty_active_allocation_set_is_rejected
        grounds:
          - calculations.tolerance_stack_analysis.input_set
          - errors.ERR_TOLERANCE_STACK_EMPTY
          - endpoints.POST_/optics/tolerance-allocations/{id}/retire
          - entities.ToleranceAllocation.fields.allocation_status
          - entities.OpticalDesign.fields.tolerance_verdict
        distinguishing_aspect: |
          Retiring the design's only allocation empties the ACTIVE input set, and tolerance analysis on
          the empty set is refused with ERR_TOLERANCE_STACK_EMPTY (422) before any output is written — the
          design stays DRAFT with tolerance_verdict PENDING and all four stack fields null; adding one
          fresh 0.0050-wave allocation then makes the same call succeed with rss_stack_waves 0.0050.
        test_recipe:
          setup:
            - "One DRAFT OpticalDesign with tolerance_budget_waves 0.0800."
            - "One ToleranceAllocation created and then RETIRED, so no ACTIVE row remains."
            - "Logical clock untouched at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
              captures: { al1: $.data.id }
            - call: "POST /optics/tolerance-allocations/${al1}/retire"
              payload: {}
              as: OpticsEngineer
          trigger:
            - call: "POST /optics/optical-designs/${d1}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "INDEX_HOMOGENEITY", sensitivity_waves_per_unit: 0.5, manufacturing_tolerance_units: 0.0100 }
              as: OpticsEngineer
              captures: { al2: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
          assert:
            - "the first trigger returns HTTP 422 with error_id ERR_TOLERANCE_STACK_EMPTY"
            - "ToleranceAllocation.${al1}.allocation_status == RETIRED"
            - "after the refusal: OpticalDesign.${d1}.design_status == DRAFT"
            - "after the refusal: OpticalDesign.${d1}.tolerance_verdict == PENDING"
            - "after the refusal: OpticalDesign.${d1}.rss_stack_waves == null"
            - "after the refusal: OpticalDesign.${d1}.worst_case_stack_waves == null"
            - "after the refusal: OpticalDesign.${d1}.governing_stack_waves == null"
            - "ToleranceAllocation.${al2}.contribution_waves == 0.0050"
            - "the last trigger returns HTTP 200"
            - "OpticalDesign.${d1}.rss_stack_waves == 0.0050"
            - "OpticalDesign.${d1}.worst_case_stack_waves == 0.0050"
            - "OpticalDesign.${d1}.tolerance_verdict == PASS"
            - "OpticalDesign.${d1}.design_status == TOLERANCED"

      - name: spectral_sample_exactly_at_band_upper_bound_counts_as_in_band
        grounds:
          - calculations.spectral_performance_verification
          - calculations.spectral_performance_verification.constants.MIN_IN_BAND_SAMPLES
          - errors.ERR_SPECTRAL_SAMPLE_INSUFFICIENT
          - entities.OpticalDesign.fields.wavelength_max_nm
          - entities.CoatingRun.fields.in_band_sample_count
        distinguishing_aspect: |
          Band membership is inclusive at the upper bound: with the design band 450..700 nm a five-sample
          trace whose last point sits at 701 nm counts only four in-band samples and is refused with
          ERR_SPECTRAL_SAMPLE_INSUFFICIENT (422), while moving that one point to exactly 700 nm makes the
          count 5 and the verification succeed with band_average_reflectance_pct exactly 0.5000 — itself
          at the inclusive band-average limit — and worst_point_reflectance_pct 0.7000.
