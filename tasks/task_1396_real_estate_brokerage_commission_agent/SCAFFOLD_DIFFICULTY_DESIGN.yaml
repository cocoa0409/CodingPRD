  - rule_id: priority_pair_validation_conflict
    instances:
      - name: settle_state_error_beats_missing_enrollment_referential
        grounds:
          - validations[priority=8]
          - validations[priority=15]
          - errors[ERR_DEAL_INVALID_STATE]
          - errors[ERR_NO_PLAN_ENROLLMENT]
        distinguishing_aspect: |
          Category pair (state, business_referential): settle on a deal still
          in DRAFT, for an agent with NO enrollment covering the closing date,
          fails both priority 8 and priority 15 — the state error
          ERR_DEAL_INVALID_STATE wins.
        test_recipe:
          setup:
            - "Agent ACTIVE but never enrolled; deal created and left in DRAFT"
          setup_api_calls:
            - call: "POST /brokerage/agents"
              payload: { full_name: "NoPlan Nina", email: "nina@x.com", license_number: "LIC-N1", joined_at: "2025-09-01" }
              as: BrokerAdmin
