      - name: practice_squad_signing_of_an_ineligible_player_is_refused_at_approval
        claim_type: conditional_validation
        grounds:
          - validations[priority=34]
          - errors[ERR_PRACTICE_SQUAD_INELIGIBLE]
          - entities.Player.fields.practice_squad_eligible
          - entities.Contract.fields.is_practice_squad_contract
        distinguishing_aspect: "The rule is conditional on the filing's own configuration: the same FILED signing would be approved for any eligible player, but because is_practice_squad_contract is true and the subject has practice_squad_seasons_used 2 (== PRACTICE_SQUAD_MAX_SEASONS) the approval returns ERR_PRACTICE_SQUAD_INELIGIBLE."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z."
            - "Harbor Kings (cap 500000000, practice_squad_limit 6) is COMPLIANT with an empty roster."
            - "Nico Braun is registered with practice_squad_seasons_used 2 and no accrued days, so roster_service_days is 0 (<= PRACTICE_SQUAD_MAX_SERVICE_DAYS 340) but practice_squad_eligible is false because 2 < PRACTICE_SQUAD_MAX_SEASONS 2 fails."
            - "A 1-year / base 12000000 / bonus 0 practice-squad signing for him is FILED and backed by a PASSED entry physical."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
            - call: "POST /teams"
              payload: { name: "Harbor Kings", market_code: "HKG", salary_cap_limit_cents: 500000000, waiver_priority_rank: 1 }
              as: LeagueOfficer
              captures: { cv_team_id: $.data.id, cv_team_v1: $.data.version }
            - call: "POST /players"
              payload: { full_name: "Nico Braun", position: "WR", practice_squad_seasons_used: 2 }
              as: LeagueOfficer
              captures: { cv_p_id: $.data.id, cv_eligible: $.data.practice_squad_eligible, cv_service: $.data.roster_service_days }
            - call: "POST /transactions"
              payload: { team_id: "${cv_team_id}", player_id: "${cv_p_id}", transaction_type: "SIGNING", expected_team_version: "${cv_team_v1}", years: 1, base_salary_cents: 12000000, signing_bonus_cents: 0, start_season_year: 2026, is_practice_squad_contract: true }
              as: TeamCapAnalyst
              as_user_id: "${cv_team_id}"
              captures: { cv_txn_id: $.data.id, cv_c_id: $.data.contract_id }
            - call: "POST /physical-exams"
              payload: { player_id: "${cv_p_id}", team_id: "${cv_team_id}", exam_type: "ENTRY_PHYSICAL", window_start_at: "2026-08-10T13:00:00Z", window_end_at: "2026-08-10T20:00:00Z", transaction_id: "${cv_txn_id}" }
              as: TeamMedicalOfficer
              as_user_id: "${cv_team_id}"
              captures: { cv_ex_id: $.data.id }
            - call: "POST /physical-exams/${cv_ex_id}/record-result"
              payload: { result: "PASSED", performed_at: "2026-08-10T14:00:00Z" }
              as: TeamMedicalOfficer
              as_user_id: "${cv_team_id}"
            - call: "POST /transactions/${cv_txn_id}/file"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${cv_team_id}"
          trigger:
            - call: "POST /transactions/${cv_txn_id}/decide"
              payload: { decision: "APPROVE" }
              as: LeagueOfficer
              as_user_id: "league-officer-1"
              captures: { cv_err: $.data.error_id }
          assert:
            - "the captured ${cv_eligible} == false and ${cv_service} == 0"
            - "the captured ${cv_err} == ERR_PRACTICE_SQUAD_INELIGIBLE with HTTP 422"
            - "Transaction.${cv_txn_id}.status is still FILED with decided_at == null and prior_designation == null"
            - "Contract.${cv_c_id}.status == PENDING_APPROVAL with is_practice_squad_contract == true and current_season_cap_charge_cents == 12000000"
            - "Player.${cv_p_id}.roster_designation == UNROSTERED, current_team_id == null, contract_rights_class == NONE"
            - "Team.${cv_team_id}.practice_squad_count == 0, active_roster_count == 0, provisional_cap_committed_cents == 12000000, version == 2"

      - name: revise_of_a_filing_voided_at_the_revision_limit_returns_revision_limit_exceeded
        claim_type: cascading_validation
        grounds:
          - validations[priority=13]
          - validations[priority=14]
          - errors[ERR_REVISION_LIMIT_EXCEEDED]
          - state_machines.Transaction.REJECTED_to_VOIDED
        distinguishing_aspect: "Priority 13 would normally own an invalid-from rejection, but it deliberately defers the (VOIDED, revision_count == MAX_TRANSACTION_REVISIONS) pair to priority 14, so the later, more specific check runs and returns ERR_REVISION_LIMIT_EXCEEDED instead of ERR_INVALID_TRANSACTION_STATE."
        test_recipe:
          setup:
            - "Logical clock held at 2026-08-10T14:00:00Z throughout, so every file and revise stays inside the window and inside filing_deadline_at 2026-08-12T14:00:00Z."
            - "Harbor Kings (cap 500000000) with a SIGNING filing for Ray Alder at 3 years / base 80000000 / bonus 10000000."
            - "The filing has been rejected and revised twice (revision_count 2), rejected a third time, and a third revise has already pushed it REJECTED -> VOIDED while leaving revision_count at MAX_TRANSACTION_REVISIONS 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
            - call: "POST /teams"
