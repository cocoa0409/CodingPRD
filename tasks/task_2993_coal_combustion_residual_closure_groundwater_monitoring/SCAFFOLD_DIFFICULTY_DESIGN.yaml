              captures: { pe_civil_id: $.data.id }
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0006", unit_name: "Ash Pond 6", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /ccr/stability-assessments"
              payload: { unit_id: "${unit_id}", assessed_on: "2026-07-15", factor_of_safety_static: 1.60, factor_of_safety_seismic: 1.10, factor_of_safety_liquefaction: 1.30 }
              as: ProfessionalEngineer
              as_user_id: "${pe_geo_id}"
              captures: { assessment_id: $.data.id }
            - call: "POST /ccr/closure-plans"
              payload: { unit_id: "${unit_id}", plan_code: "CP-0003", selected_method: "CLOSURE_IN_PLACE", in_place_capital_usd_cents: 100000000, in_place_annual_care_usd_cents: 1000000, removal_capital_usd_cents: 900000000, removal_annual_care_usd_cents: 1000000, care_period_years: 30 }
              as: UtilityAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /ccr/closure-plans/${plan_id}/engineering-certification"
              payload: { certified_on: "2026-08-01", design_narrative: "Composite cap with 24-inch protective layer and perimeter toe drain regrade" }
              as: ProfessionalEngineer
              as_user_id: "${pe_geo_id}"
          trigger:
            - call: "POST /ccr/closure-plans/${plan_id}/approve"
              payload: { approved_on: "2026-08-01", permit_reference: "PERMIT-2026-A" }
              as: Regulator
            - call: "POST /ccr/closure-plans/${plan_id}/cost-certification"
              payload: { certified_on: "2026-08-01", cost_basis_note: "Unit-price bid tabulation, 2026 dollars, 3 percent discount basis" }
              as: ProfessionalEngineer
              as_user_id: "${pe_civil_id}"
            - call: "POST /ccr/closure-plans/${plan_id}/return-to-draft"
              payload: {}
              as: Regulator
            - call: "POST /ccr/closure-plans/${plan_id}/cost-certification"
              payload: { certified_on: "2026-08-01", cost_basis_note: "Re-issued cost basis after regulator return" }
              as: ProfessionalEngineer
              as_user_id: "${pe_civil_id}"
            - call: "POST /ccr/closure-plans/${plan_id}/engineering-certification"
              payload: { certified_on: "2026-08-01", design_narrative: "Re-issued design narrative after regulator return" }
              as: ProfessionalEngineer
              as_user_id: "${pe_geo_id}"
            - call: "POST /ccr/closure-plans/${plan_id}/approve"
              payload: { approved_on: "2026-08-01", permit_reference: "PERMIT-2026-B" }
              as: Regulator
          assert:
            - "trigger call 1 (approve from ENGINEERING_CERTIFIED) returns 409 with error_id ERR_INVALID_PLAN_STATE and leaves status ENGINEERING_CERTIFIED"
            - "after trigger call 2 the plan status == FULLY_CERTIFIED (join reached via the ENGINEERING_CERTIFIED -> FULLY_CERTIFIED edge)"
            - "after trigger call 3 the plan status == DRAFT, engineering_certified_by == null, engineering_certified_on == null, design_narrative == null, cost_certified_by == null, cost_certified_on == null, cost_basis_note == null, return_count == 1"
            - "after trigger call 4 the plan status == COST_CERTIFIED (the opposite fork branch is now taken first)"
            - "after trigger call 5 the plan status == FULLY_CERTIFIED (join reached via the COST_CERTIFIED -> FULLY_CERTIFIED edge)"
            - "ClosurePlan.${plan_id}.status == APPROVED"
            - "ClosurePlan.${plan_id}.permit_reference == PERMIT-2026-B"
            - "ClosurePlan.${plan_id}.engineering_certified_by == ${pe_geo_id}"
            - "ClosurePlan.${plan_id}.cost_certified_by == ${pe_civil_id}"
            - "ClosurePlan.${plan_id}.return_count == 1"
            - "ClosurePlan.${plan_id}.recommended_method == CLOSURE_IN_PLACE"
            - "DisposalUnit.${unit_id}.closure_state == CLOSURE_PLANNED"
            - "DisposalUnit.${unit_id}.closure_plan_posting_due_date == 2026-09-30"

  - rule_id: transitive_cascade
    instances:
      - name: ssi_cascade_depth_four_suspends_active_reuse_agreement
        grounds:
          - state_machines.MonitoringProgram.DETECTION_to_ASSESSMENT
          - state_machines.BeneficialReuseAgreement.ACTIVE_to_SUSPENDED
          - calculations.compliance_posture
          - calculations.posting_obligation_status
          - entities.DisposalUnit.fields.ssi_notice_due_date
        distinguishing_aspect: |
          One POST reaches four levels deep: (1) the evaluation is written with verdict SSI, (2) which
          moves its program to ASSESSMENT and escalates sampling to QUARTERLY, (3) which sets the unit's
          ssi_notice_due_date and recomputes compliance_posture to RESTRICTED, (4) which suspends every
          ACTIVE beneficial-reuse agreement of that unit. Hop 4 is caused by hop 3's posture change, not
          by the evaluation, so an implementation that stops at the program or the unit leaves the
          agreement ACTIVE.
        test_recipe:
          setup:
            - "Fast SSI-ready chain on one unit: certified network BG-01..BG-04 / DG-01..DG-03, window 2025-01-01..2025-12-31, one VALIDATED BACKGROUND round on 2025-06-01 (0.5000/0.6000/0.5500/0.5800) and one VALIDATED DETECTION round on 2026-06-15 with DG-01 sulfate 0.9000"
            - "No evaluation has been issued yet: the program is still DETECTION and the unit is COMPLIANT"
            - "One beneficial-reuse agreement for 30,000 tons over 2026-01-01..2026-12-31, qualified (score 70.30) and ACTIVE before the trigger"
          setup_api_calls:
            - call: "POST /ccr/professionals"
              payload: { full_name: "Mia Chen", license_number: "HG-33003", license_state: "NC", discipline: "HYDROGEOLOGY" }
