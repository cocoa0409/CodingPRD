# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3185_connected_vehicle_emergency_response_subscription_services
# Breadth probe over §1.1–§1.7 claims not already exercised by §1.8.
# Shared chains replayed per instance: default logical clock 2026-09-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: plan_tier_create_returns_system_fields_and_active_status
        claim_type: Creation
        grounds:
          - entities.PlanTier
          - endpoints.POST_/plan-tiers
        distinguishing_aspect: "A tier created with all six input fields comes back 201 with server-minted id, created_at, updated_at, version == 1, and status ACTIVE which was never client-supplied."
        test_recipe:
          setup:
            - "Empty database; default logical clock 2026-09-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /plan-tiers"
              payload: { code: "PREMIUM", monthly_fee_cents: 6000, allows_emergency: true, allows_remote_commands: true, allows_navigation: true, allows_data_gb: 10.0 }
              as: PlatformAdmin
              captures: { tier_p: $.data.id }
          assert:
            - "response status 201 and response_type object"
            - "PlanTier.${tier_p}.status == ACTIVE and version == 1"
            - "PlanTier.${tier_p}.code == PREMIUM and monthly_fee_cents == 6000"
            - "id, created_at, updated_at are non-null and server-stamped"

      - name: crash_event_get_round_trips_computed_severity_fields
        claim_type: Retrieval
        grounds:
          - entities.CrashEvent
          - endpoints.GET_/vehicles/{vehicleId}/crash-events/{eventId}
        distinguishing_aspect: "GET returns the stored crash event with computed severity_score 35.0 and severity_band MODERATE exactly as persisted at creation, plus the resolved subscription_id snapshot."
        test_recipe:
          setup:
            - "SAFETY tier, TX zone with cellular, account A1 with vehicle V1 and TRIAL subscription; one crash event created with delta_v 58.334, no flags."
          setup_api_calls:
            - call: "POST /plan-tiers"
              payload: { code: "SAFETY", monthly_fee_cents: 2000, allows_emergency: true, allows_remote_commands: false, allows_navigation: false, allows_data_gb: 0 }
              as: PlatformAdmin
            - call: "POST /coverage-zones"
              payload: { region_code: "TX", has_cellular: true, supports_data: true, supports_navigation: true }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { full_name: "Ana Alvarez", email: "ana@example.com", phone: "+15125550101", home_region_code: "TX" }
              as: PlatformAdmin
              captures: { acct_a1: $.data.id }
            - call: "POST /accounts/${acct_a1}/vehicles"
              payload: { vin: "1G1ZD5ST5JF000001", make: "Chevrolet", model: "Malibu", model_year: 2020, region_code: "TX", hardware_generation: 5 }
              as: Account
              as_user_id: "${acct_a1}"
              captures: { veh_v1: $.data.id }
            - call: "POST /accounts/${acct_a1}/subscriptions"
              payload: { vehicle_id: "${veh_v1}", tier_code: "SAFETY" }
              as: Account
              as_user_id: "${acct_a1}"
              captures: { sub_s1: $.data.id }
            - call: "POST /vehicles/${veh_v1}/crash-events"
              payload: { delta_v_kph: 58.334, rollover_detected: false, airbag_deployed: false, location_region_code: "TX" }
              as: SystemIngestion
              captures: { ce_1: $.data.id }
          trigger:
            - call: "GET /vehicles/${veh_v1}/crash-events/${ce_1}"
              payload: {}
              as: Advisor
          assert:
            - "response status 200"
            - "CrashEvent.${ce_1}.severity_score == 35.0 and severity_band == MODERATE"
            - "CrashEvent.${ce_1}.subscription_id == ${sub_s1} and status == RECEIVED"
            - "CrashEvent.${ce_1}.rollover_detected == false and airbag_deployed == false (input round-trip)"

      - name: subscriptions_list_paginates_with_envelope_fields
        claim_type: Listing
        grounds:
          - endpoints.GET_/accounts/{accountId}/subscriptions
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With two subscriptions on the account, limit=1 returns one row with total_count 2 and has_more true; offset=1 returns the second row with has_more false — total_count spans the whole filtered set."
        test_recipe:
          setup:
            - "SAFETY tier, TX zone, account A1 with two vehicles V1, V2 each holding a TRIAL subscription."
          setup_api_calls:
            - call: "POST /plan-tiers"
              payload: { code: "SAFETY", monthly_fee_cents: 2000, allows_emergency: true, allows_remote_commands: false, allows_navigation: false, allows_data_gb: 0 }
              as: PlatformAdmin
            - call: "POST /coverage-zones"
              payload: { region_code: "TX", has_cellular: true, supports_data: true, supports_navigation: true }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { full_name: "Ana Alvarez", email: "ana@example.com", phone: "+15125550101", home_region_code: "TX" }
              as: PlatformAdmin
              captures: { acct_a1: $.data.id }
            - call: "POST /accounts/${acct_a1}/vehicles"
              payload: { vin: "1G1ZD5ST5JF000001", make: "Chevrolet", model: "Malibu", model_year: 2020, region_code: "TX", hardware_generation: 5 }
              as: Account
              as_user_id: "${acct_a1}"
              captures: { veh_v1: $.data.id }
            - call: "POST /accounts/${acct_a1}/vehicles"
              payload: { vin: "1G1ZD5ST5JF000002", make: "Chevrolet", model: "Equinox", model_year: 2021, region_code: "TX", hardware_generation: 5 }
              as: Account
              as_user_id: "${acct_a1}"
              captures: { veh_v2: $.data.id }
            - call: "POST /accounts/${acct_a1}/subscriptions"
              payload: { vehicle_id: "${veh_v1}", tier_code: "SAFETY" }
              as: Account
              as_user_id: "${acct_a1}"
            - call: "POST /accounts/${acct_a1}/subscriptions"
              payload: { vehicle_id: "${veh_v2}", tier_code: "SAFETY" }
              as: Account
              as_user_id: "${acct_a1}"
          trigger:
            - call: "GET /accounts/${acct_a1}/subscriptions"
              payload: { limit: 1, offset: 0 }
              as: Account
              as_user_id: "${acct_a1}"
          assert:
            - "response_type == array and data has exactly 1 row"
            - "meta carries api_request_id and api_request_timestamp"
            - "pagination reports total_count == 2 and has_more == true"
            - "a second call with offset 1 returns 1 row and has_more == false"

      - name: vehicle_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/vehicles/{vehicleId}
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "A well-formed but never-registered vehicle id returns 404 ERR_NOT_FOUND, not a 400 — existence (priority 3) is what fails."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /vehicles/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: PlatformAdmin
              captures: { err_nf: $.data.error_id }
          assert:
            - "response status 404"
            - "error_id == ERR_NOT_FOUND"

      - name: vehicle_create_missing_vin_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Vehicle.fields.vin
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "vin is a required input with no default, so omitting it is a 400 ERR_INVALID_REQUEST from the body check — it is NOT a uniqueness ERR_DUPLICATE."
        test_recipe:
          setup:
            - "TX zone exists; account A1 exists."
          setup_api_calls:
            - call: "POST /coverage-zones"
              payload: { region_code: "TX", has_cellular: true, supports_data: true, supports_navigation: true }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { full_name: "Ana Alvarez", email: "ana@example.com", phone: "+15125550101", home_region_code: "TX" }
              as: PlatformAdmin
              captures: { acct_a1: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_a1}/vehicles"
              payload: { make: "Chevrolet", model: "Malibu", model_year: 2020, region_code: "TX", hardware_generation: 5 }
              as: Account
              as_user_id: "${acct_a1}"
              captures: { err_rq: $.data.error_id }
          assert:
            - "response status 400"
            - "error_id == ERR_INVALID_REQUEST"
            - "no Vehicle row is persisted for account ${acct_a1} (GET /accounts/${acct_a1}/vehicles returns total_count 0)"

      - name: crash_event_create_omitting_rollover_flag_defaults_false
        claim_type: Defaults
        grounds:
          - entities.CrashEvent.fields.rollover_detected
          - entities.CrashEvent.fields.airbag_deployed
        distinguishing_aspect: "rollover_detected and airbag_deployed each declare default false; omitting both yields severity purely from delta_v (45.0 at delta_v 75) rather than rejecting the payload."
        test_recipe:
          setup:
            - "SAFETY tier, TX zone, account A1, vehicle V1, TRIAL subscription."
          setup_api_calls:
            - call: "POST /plan-tiers"
              payload: { code: "SAFETY", monthly_fee_cents: 2000, allows_emergency: true, allows_remote_commands: false, allows_navigation: false, allows_data_gb: 0 }
              as: PlatformAdmin
            - call: "POST /coverage-zones"
              payload: { region_code: "TX", has_cellular: true, supports_data: true, supports_navigation: true }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { full_name: "Ana Alvarez", email: "ana@example.com", phone: "+15125550101", home_region_code: "TX" }
              as: PlatformAdmin
              captures: { acct_a1: $.data.id }
            - call: "POST /accounts/${acct_a1}/vehicles"
              payload: { vin: "1G1ZD5ST5JF000001", make: "Chevrolet", model: "Malibu", model_year: 2020, region_code: "TX", hardware_generation: 5 }
              as: Account
              as_user_id: "${acct_a1}"
              captures: { veh_v1: $.data.id }
            - call: "POST /accounts/${acct_a1}/subscriptions"
              payload: { vehicle_id: "${veh_v1}", tier_code: "SAFETY" }
              as: Account
              as_user_id: "${acct_a1}"
          trigger:
            - call: "POST /vehicles/${veh_v1}/crash-events"
              payload: { delta_v_kph: 75, location_region_code: "TX" }
              as: SystemIngestion
              captures: { ce_df: $.data.id }
          assert:
            - "CrashEvent.${ce_df}.rollover_detected == false and airbag_deployed == false"
            - "CrashEvent.${ce_df}.severity_score == 45.0 (0.6*75 with both flag defaults applied)"

      - name: subscription_trial_end_date_is_computed_and_client_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.Subscription.fields.trial_end_date
          - entities.Subscription.fields.next_renewal_date
        distinguishing_aspect: "trial_end_date is computed as trial_start + 30 days; a client-supplied trial_end_date in the create payload is not part of input schema and the stored value is 2026-10-01 for a 2026-09-01 start regardless."
        test_recipe:
          setup:
            - "SAFETY tier, TX zone, account A1, vehicle V1."
          setup_api_calls:
            - call: "POST /plan-tiers"
              payload: { code: "SAFETY", monthly_fee_cents: 2000, allows_emergency: true, allows_remote_commands: false, allows_navigation: false, allows_data_gb: 0 }
              as: PlatformAdmin
            - call: "POST /coverage-zones"
              payload: { region_code: "TX", has_cellular: true, supports_data: true, supports_navigation: true }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { full_name: "Ana Alvarez", email: "ana@example.com", phone: "+15125550101", home_region_code: "TX" }
              as: PlatformAdmin
              captures: { acct_a1: $.data.id }
            - call: "POST /accounts/${acct_a1}/vehicles"
              payload: { vin: "1G1ZD5ST5JF000001", make: "Chevrolet", model: "Malibu", model_year: 2020, region_code: "TX", hardware_generation: 5 }
              as: Account
              as_user_id: "${acct_a1}"
              captures: { veh_v1: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_a1}/subscriptions"
              payload: { vehicle_id: "${veh_v1}", tier_code: "SAFETY" }
              as: Account
              as_user_id: "${acct_a1}"
              captures: { sub_cp: $.data.id }
          assert:
            - "Subscription.${sub_cp}.trial_start_date == 2026-09-01 (logical clock date)"
            - "Subscription.${sub_cp}.trial_end_date == 2026-10-01 (computed +30 days)"
            - "Subscription.${sub_cp}.status == TRIAL and next_renewal_date is null while in TRIAL"

      - name: vehicle_vin_seventeen_chars_and_excluded_letters_enforced
        claim_type: Type Constraints
        grounds:
          - entities.Vehicle.fields.vin
          - validations[priority=4]
        distinguishing_aspect: "A 16-character VIN and a 17-character VIN containing the letter I both violate the declared constraint and return 400 ERR_INVALID_REQUEST before any uniqueness check runs."
        test_recipe:
          setup:
            - "TX zone, account A1."
          setup_api_calls:
            - call: "POST /coverage-zones"
              payload: { region_code: "TX", has_cellular: true, supports_data: true, supports_navigation: true }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { full_name: "Ana Alvarez", email: "ana@example.com", phone: "+15125550101", home_region_code: "TX" }
              as: PlatformAdmin
              captures: { acct_a1: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_a1}/vehicles"
              payload: { vin: "1G1ZD5ST5JF00001", make: "Chevrolet", model: "Malibu", model_year: 2020, region_code: "TX", hardware_generation: 5 }
              as: Account
              as_user_id: "${acct_a1}"
              captures: { err_v1: $.data.error_id }
            - call: "POST /accounts/${acct_a1}/vehicles"
              payload: { vin: "1G1ZD5ST5JF0000I1", make: "Chevrolet", model: "Malibu", model_year: 2020, region_code: "TX", hardware_generation: 5 }
              as: Account
              as_user_id: "${acct_a1}"
              captures: { err_v2: $.data.error_id }
          assert:
            - "both responses status 400 with ERR_INVALID_REQUEST"
            - "no vehicle persisted (account vehicle list stays empty)"

      - name: vehicle_create_requires_existing_account_parent
        claim_type: Parent Relationships
        grounds:
          - entities.Vehicle.parent
          - entities.Vehicle.fields.account_id
          - validations[priority=3]
        distinguishing_aspect: "Creating a vehicle under a non-existent account id fails 404 ERR_NOT_FOUND on the parent path segment before the body is even validated."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /accounts/00000000-0000-4000-8000-0000000000ee/vehicles"
              payload: { vin: "1G1ZD5ST5JF000001", make: "Chevrolet", model: "Malibu", model_year: 2020, region_code: "TX", hardware_generation: 5 }
              as: Account
              as_user_id: "00000000-0000-4000-8000-0000000000ee"
              captures: { err_pp: $.data.error_id }
          assert:
            - "response status 404"
            - "error_id == ERR_NOT_FOUND (parent account does not exist)"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: subscription_created_starts_in_trial_state
        claim_type: initial_state
        grounds:
          - state_machines.Subscription
        distinguishing_aspect: "A freshly created subscription reports status TRIAL with trial_start_date equal to the logical clock date before any transition call."
        test_recipe:
          setup:
            - "SAFETY tier, TX zone, account A1, vehicle V1."
          setup_api_calls:
            - call: "POST /plan-tiers"
              payload: { code: "SAFETY", monthly_fee_cents: 2000, allows_emergency: true, allows_remote_commands: false, allows_navigation: false, allows_data_gb: 0 }
              as: PlatformAdmin
            - call: "POST /coverage-zones"
              payload: { region_code: "TX", has_cellular: true, supports_data: true, supports_navigation: true }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { full_name: "Ana Alvarez", email: "ana@example.com", phone: "+15125550101", home_region_code: "TX" }
              as: PlatformAdmin
              captures: { acct_a1: $.data.id }
            - call: "POST /accounts/${acct_a1}/vehicles"
              payload: { vin: "1G1ZD5ST5JF000001", make: "Chevrolet", model: "Malibu", model_year: 2020, region_code: "TX", hardware_generation: 5 }
              as: Account
              as_user_id: "${acct_a1}"
              captures: { veh_v1: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_a1}/subscriptions"
              payload: { vehicle_id: "${veh_v1}", tier_code: "SAFETY" }
              as: Account
              as_user_id: "${acct_a1}"
              captures: { sub_i1: $.data.id }
          assert:
            - "Subscription.${sub_i1}.status == TRIAL (initial state)"
            - "Subscription.${sub_i1}.version == 1"

      - name: connect_advisor_on_received_event_moves_to_advisor_connected
        claim_type: valid_transition
        grounds:
          - state_machines.CrashEvent.RECEIVED_to_ADVISOR_CONNECTED
        distinguishing_aspect: "The advisor-connect transition succeeds from RECEIVED and stamps updated_at, advancing the event exactly one step."
        test_recipe:
          setup:
            - "SAFETY tier, TX zone, account A1, vehicle V1, TRIAL subscription; crash event created (delta_v 70, airbag true)."
          setup_api_calls:
            - call: "POST /plan-tiers"
              payload: { code: "SAFETY", monthly_fee_cents: 2000, allows_emergency: true, allows_remote_commands: false, allows_navigation: false, allows_data_gb: 0 }
              as: PlatformAdmin
            - call: "POST /coverage-zones"
              payload: { region_code: "TX", has_cellular: true, supports_data: true, supports_navigation: true }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { full_name: "Ana Alvarez", email: "ana@example.com", phone: "+15125550101", home_region_code: "TX" }
              as: PlatformAdmin
              captures: { acct_a1: $.data.id }
            - call: "POST /accounts/${acct_a1}/vehicles"
              payload: { vin: "1G1ZD5ST5JF000001", make: "Chevrolet", model: "Malibu", model_year: 2020, region_code: "TX", hardware_generation: 5 }
              as: Account
              as_user_id: "${acct_a1}"
              captures: { veh_v1: $.data.id }
            - call: "POST /accounts/${acct_a1}/subscriptions"
              payload: { vehicle_id: "${veh_v1}", tier_code: "SAFETY" }
              as: Account
              as_user_id: "${acct_a1}"
            - call: "POST /vehicles/${veh_v1}/crash-events"
              payload: { delta_v_kph: 70, rollover_detected: false, airbag_deployed: true, location_region_code: "TX" }
              as: SystemIngestion
              captures: { ce_v1: $.data.id }
          trigger:
            - call: "POST /vehicles/${veh_v1}/crash-events/${ce_v1}/connect-advisor"
              payload: {}
              as: Advisor
          assert:
            - "CrashEvent.${ce_v1}.status == ADVISOR_CONNECTED"
            - "CrashEvent.${ce_v1}.version == 2 (one transition, one increment)"

      - name: connect_advisor_twice_second_attempt_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.CrashEvent.RECEIVED_to_ADVISOR_CONNECTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "From ADVISOR_CONNECTED the connect-advisor trigger is not in the transition list, so the second call is 409 ERR_INVALID_STATE with no further version bump."
        test_recipe:
          setup:
            - "SAFETY tier, TX zone, account A1, vehicle V1, TRIAL subscription; crash event created and advisor already connected."
          setup_api_calls:
            - call: "POST /plan-tiers"
              payload: { code: "SAFETY", monthly_fee_cents: 2000, allows_emergency: true, allows_remote_commands: false, allows_navigation: false, allows_data_gb: 0 }
              as: PlatformAdmin
            - call: "POST /coverage-zones"
              payload: { region_code: "TX", has_cellular: true, supports_data: true, supports_navigation: true }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { full_name: "Ana Alvarez", email: "ana@example.com", phone: "+15125550101", home_region_code: "TX" }
              as: PlatformAdmin
              captures: { acct_a1: $.data.id }
            - call: "POST /accounts/${acct_a1}/vehicles"
              payload: { vin: "1G1ZD5ST5JF000001", make: "Chevrolet", model: "Malibu", model_year: 2020, region_code: "TX", hardware_generation: 5 }
              as: Account
              as_user_id: "${acct_a1}"
              captures: { veh_v1: $.data.id }
            - call: "POST /accounts/${acct_a1}/subscriptions"
              payload: { vehicle_id: "${veh_v1}", tier_code: "SAFETY" }
              as: Account
              as_user_id: "${acct_a1}"
            - call: "POST /vehicles/${veh_v1}/crash-events"
              payload: { delta_v_kph: 70, rollover_detected: false, airbag_deployed: true, location_region_code: "TX" }
              as: SystemIngestion
              captures: { ce_v2: $.data.id }
            - call: "POST /vehicles/${veh_v1}/crash-events/${ce_v2}/connect-advisor"
              payload: {}
              as: Advisor
          trigger:
            - call: "POST /vehicles/${veh_v1}/crash-events/${ce_v2}/connect-advisor"
              payload: {}
              as: Advisor
              captures: { err_iv: $.data.error_id }
          assert:
            - "response status 409 and error_id == ERR_INVALID_STATE"
            - "CrashEvent.${ce_v2}.status still == ADVISOR_CONNECTED and version == 2"

      - name: acknowledge_on_pending_dispatch_rejected_before_location_sent
        claim_type: precondition_enforcement
        grounds:
          - state_machines.DispatchRequest.PENDING_to_LOCATION_SENT
          - state_machines.DispatchRequest.LOCATION_SENT_to_ACKNOWLEDGED
        distinguishing_aspect: "DispatchRequest acknowledge is only declared from LOCATION_SENT; the PENDING -> LOCATION_SENT hop is system-immediate at creation, so by the time a client can call acknowledge the state is LOCATION_SENT — a cancel from PENDING is therefore unobservable and acknowledge succeeds only post-transfer."
        test_recipe:
          setup:
            - "SAFETY tier, TX zone, ACTIVE PSAP in TX, account A1, vehicle V1, TRIAL subscription; crash event advisor-connected and dispatch created (lands LOCATION_SENT immediately)."
          setup_api_calls:
            - call: "POST /plan-tiers"
              payload: { code: "SAFETY", monthly_fee_cents: 2000, allows_emergency: true, allows_remote_commands: false, allows_navigation: false, allows_data_gb: 0 }
              as: PlatformAdmin
            - call: "POST /coverage-zones"
              payload: { region_code: "TX", has_cellular: true, supports_data: true, supports_navigation: true }
              as: PlatformAdmin
            - call: "POST /psaps"
              payload: { name: "Austin PSAP", region_code: "TX", accepts_location_transfer: true }
              as: PlatformAdmin
              captures: { psap_1: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "Ana Alvarez", email: "ana@example.com", phone: "+15125550101", home_region_code: "TX" }
              as: PlatformAdmin
              captures: { acct_a1: $.data.id }
            - call: "POST /accounts/${acct_a1}/vehicles"
              payload: { vin: "1G1ZD5ST5JF000001", make: "Chevrolet", model: "Malibu", model_year: 2020, region_code: "TX", hardware_generation: 5 }
              as: Account
              as_user_id: "${acct_a1}"
              captures: { veh_v1: $.data.id }
            - call: "POST /accounts/${acct_a1}/subscriptions"
              payload: { vehicle_id: "${veh_v1}", tier_code: "SAFETY" }
              as: Account
              as_user_id: "${acct_a1}"
            - call: "POST /vehicles/${veh_v1}/crash-events"
              payload: { delta_v_kph: 70, rollover_detected: false, airbag_deployed: true, location_region_code: "TX" }
              as: SystemIngestion
              captures: { ce_v3: $.data.id }
