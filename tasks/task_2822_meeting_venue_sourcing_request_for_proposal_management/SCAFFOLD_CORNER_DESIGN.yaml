      - validations[priority=1]
      - errors[ERR_UNAUTHENTICATED]
      - roles
      distinguishing_aspect: 'Rule 1 is the outermost gate: a request with no X-User-Role / X-User-ID at all AND a request carrying a role string outside the five declared roles both return HTTP 401 ERR_UNAUTHENTICATED - not the 403 ERR_FORBIDDEN_ROLE of rule 2, and not the 422 of rule 20, even though the same body is otherwise perfectly valid and would be accepted as SourcingManager.'
