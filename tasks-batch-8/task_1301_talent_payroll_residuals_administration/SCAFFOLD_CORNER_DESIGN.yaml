            - call: "POST /payroll/timecards"
              payload: { engagement_id: "${eng}", work_date: "2026-08-11", jurisdiction_code: "CA", call_time: "2026-08-11T08:00:00Z", first_meal_out: "2026-08-11T14:01:00Z", first_meal_in: "2026-08-11T14:31:00Z", wrap_time: "2026-08-11T17:00:00Z", scheduled_hours: 8 }
