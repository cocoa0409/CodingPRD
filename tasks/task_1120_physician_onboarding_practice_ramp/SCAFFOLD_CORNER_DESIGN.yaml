            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. Mentor", specialty: "FAMILY_MEDICINE", email: "mentor@x.com", hire_type: "LEADERSHIP" }, as: Recruiter, captures: { mentor_id: "$.data.id" } }
            - { call: "POST /onboarding/physicians/${mentor_id}/mark-active", payload: {}, as: OnboardingDirector }
            - { call: "GET /onboarding/onboarding-cases/${case_id}", payload: {}, as: OnboardingDirector, captures: { v1: "$.data.version" } }
            - { call: "POST /onboarding/mentorship-assignments", payload: { onboarding_case_id: "${case_id}", mentor_physician_id: "${mentor_id}", expected_onboarding_case_version: "${v1}" }, as: OnboardingDirector, captures: { ma_id: "$.data.id" } }
            - { call: "POST /onboarding/mentorship-assignments/${ma_id}/check-ins", payload: { day_marker: "D30", sentiment: "POSITIVE" }, as: MentorPhysician, as_user_id: "${mentor_id}" }
          trigger:
            - { call: "POST /onboarding/mentorship-assignments/${ma_id}/check-ins", payload: { day_marker: "D180", sentiment: "NEUTRAL" }, as: MentorPhysician, as_user_id: "${mentor_id}", captures: { err1: "$.data.error_id" } }
            - { call: "POST /onboarding/mentorship-assignments/${ma_id}/check-ins", payload: { day_marker: "D30", sentiment: "NEUTRAL" }, as: MentorPhysician, as_user_id: "${mentor_id}", captures: { err2: "$.data.error_id" } }
            - { call: "POST /onboarding/mentorship-assignments/${ma_id}/check-ins", payload: { day_marker: "D90", sentiment: "NEUTRAL" }, as: MentorPhysician, as_user_id: "${mentor_id}", captures: { ci_id: "$.data.id" } }
          assert:
            - "D180 while only D30 is recorded: error_id == ERR_CHECKIN_OUT_OF_ORDER (HTTP 422)"
            - "D30 again: error_id == ERR_CHECKIN_ALREADY_RECORDED (HTTP 409) even though it is also not the next marker"
            - "D90 (the immediate next) succeeds; assignment.checkins_recorded == 2"

      - name: mentor_validation_order_trio
