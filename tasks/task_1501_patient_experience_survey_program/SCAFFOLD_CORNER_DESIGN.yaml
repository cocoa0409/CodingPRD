            - { call: "POST /api/responses/import", payload: { case_ids: "${k2b[0:2]}", mode_used: "MAIL", nurse_comm_score: 3, doctor_comm_score: 3, cleanliness_score: 3, overall_rating_score: 3 }, as: VendorOperator, as_user_id: "${vn}" }
            - { call: "POST /api/responses", payload: { case_id: "${k2b[2]}", mode_used: "MAIL", nurse_comm_score: 3, doctor_comm_score: 3, cleanliness_score: 3, overall_rating_score: 3, comment_text: "Floor was sticky" }, as: VendorOperator, as_user_id: "${vn}", captures: { rsp: "$.data.id" } }
            - { call: "POST /api/service-recovery-tickets", payload: { unit_id: "${un}", response_id: "${rsp}", domain: "CLEANLINESS", priority: "LOW" }, as: UnitManager, as_user_id: "${un}", captures: { tkt: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-30T00:00:00Z" }, as: ProgramAdmin }
