  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: inspector_planned_windows_half_open_adjacency
        grounds:
          - errors.ERR_INSPECTOR_DOUBLE_BOOKED
          - entities.Inspection.fields.planned_start_at
          - entities.Inspection.fields.planned_end_at
        distinguishing_aspect: |
          Resource = Inspector, semantics = half-open intervals
          [planned_start_at, planned_end_at): a window beginning exactly at
          another's end is NOT a conflict (adjacency allowed), while a one-minute
          overlap is ERR_INSPECTOR_DOUBLE_BOOKED; and a CANCELLED inspection's
          window is released, so a later window inside it succeeds.
        test_recipe:
          setup:
            - "One inspector; inspection A planned [2026-05-10T08:00, 2026-05-10T12:00)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-01T08:00:00Z" }
              as: MSHAAdmin
            - call: "POST /msha/operators"
              payload: { legal_name: "Canyon Coal Co", annual_tonnage_tons: 1000, home_district: "D-11" }
              as: MSHAAdmin
              captures: { op_id: $.data.id }
            - call: "POST /msha/mines"
              payload: { operator_id: "${op_id}", mine_name: "Canyon No 20", mine_type: "UNDERGROUND", activation_date: "2026-01-01" }
              as: MSHAAdmin
              captures: { m_id: $.data.id }
            - call: "POST /msha/inspectors"
              payload: { full_name: "R. Alvarez", badge_number: "INSP-100", district_code: "D-11", certification: "BOTH", conflicted_operator_ids: [] }
              as: MSHAAdmin
              captures: { i1: $.data.id }
            - call: "POST /msha/inspections"
              payload: { mine_id: "${m_id}", inspector_id: "${i1}", kind: "SPOT", planned_start_at: "2026-05-10T08:00:00Z", planned_end_at: "2026-05-10T12:00:00Z" }
              as: DistrictManager
              captures: { inspA: $.data.id }
          trigger:
            - call: "POST /msha/inspections"
              payload: { mine_id: "${m_id}", inspector_id: "${i1}", kind: "SPOT", planned_start_at: "2026-05-10T12:00:00Z", planned_end_at: "2026-05-10T17:00:00Z" }
              as: DistrictManager
              captures: { inspB: $.data.id }
            - call: "POST /msha/inspections"
              payload: { mine_id: "${m_id}", inspector_id: "${i1}", kind: "SPOT", planned_start_at: "2026-05-10T11:59:00Z", planned_end_at: "2026-05-10T13:00:00Z" }
              as: DistrictManager
              captures: { errC: $.data.error_id }
            - call: "POST /msha/inspections/${inspA}/cancel"
              payload: {}
              as: DistrictManager
            - call: "POST /msha/inspections"
              payload: { mine_id: "${m_id}", inspector_id: "${i1}", kind: "SPOT", planned_start_at: "2026-05-10T08:30:00Z", planned_end_at: "2026-05-10T09:30:00Z" }
              as: DistrictManager
              captures: { inspD: $.data.id }
          assert:
            - "inspection B (12:00 start == A's 12:00 end) is created (201): half-open adjacency is allowed"
            - "inspection C (11:59 start overlaps A by one minute) answers 409 ERR_INSPECTOR_DOUBLE_BOOKED"
            - "after cancelling A, inspection D inside A's former window is created (201): CANCELLED releases the interval"
            - "Inspection.${inspA}.status == CANCELLED"

      - name: ido_closed_interval_rejects_termination_instant_reuse
        grounds:
          - errors.ERR_IDO_ACTIVE_EXISTS
          - entities.ImminentDangerOrder.fields.terminated_at
          - state_machines.ImminentDangerOrder
        distinguishing_aspect: |
          Resource = Mine, semantics = CLOSED interval [issued_at,
          terminated_at] — geometrically different from the inspector's
          half-open rule: a new order whose issued_at equals the prior order's
          terminated_at SHARES that instant and is rejected; only a strictly
          later issuance (one second after) succeeds.
