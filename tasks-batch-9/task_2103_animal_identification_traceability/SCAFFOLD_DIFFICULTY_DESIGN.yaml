              as: ProgramAdmin
              as_user_id: "admin-reg"
            - call: "POST /movement-events"
              payload: { animal_id: "${an_n}", origin_premises_id: "${n1}", destination_premises_id: "${n2}", departed_at: "2026-08-09T00:00:00Z" }
              as: Producer
