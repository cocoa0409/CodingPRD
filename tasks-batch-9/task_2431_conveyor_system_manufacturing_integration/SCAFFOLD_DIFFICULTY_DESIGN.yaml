scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — dual_variant_calc
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: simulation_method_variants_diverge_on_same_topology
        grounds:
          - calculations.line_throughput_simulation
          - entities.SimulationRun.fields.effective_throughput_cph
          - entities.SimulationRun.fields.shortfall_cph
          - entities.ConveyorSegment.fields.derated_capacity_cph
        distinguishing_aspect: |
          Both variants run against one identical 7-segment DAG: DETERMINISTIC_STEADY_STATE skips substep 2a
          entirely and yields effective_throughput_cph 1400 with shortfall_cph 0, while DEGRADED_AVAILABILITY
          multiplies each segment by availability_pct first and yields 1260 with shortfall_cph 40 — a throughput
          quantity on SimulationRun, a different entity domain from the money variant instance.
        test_recipe:
          setup:
            - "One Project with required_throughput_cph 1300, delivery_status DESIGN, design_version 7 after six design mutations."
            - "Seven ConveyorSegment rows forming a DAG: two sources IB-A (BELT 1600 cph, 95% avail, 8000 bps) and IB-B (ROLLER 280 cph, 90% avail, 2000 bps) feeding MERGE MG-C (2000 cph, 96%), which feeds SORTATION SX-D (1800 cph, 92%), which fans out to OT-E (BELT 1800, 97%, 5000 bps), OT-F (ROLLER 2000, 98%, 3000 bps) and OT-G (BELT 1200, 99%, 2000 bps)."
            - "No SimulationRun exists yet."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Meridian Fulfilment", facility_code: "DC-DFW-11", customer_rep_user_id: "cust-rep-21", required_throughput_cph: 1300, contract_base_cents: 240000000, authorized_ceiling_cents: 300000000, spares_budget_cents: 5000000, service_tier: "PREMIUM" }
              as: ProjectDirector
              as_user_id: "pd-001"
              captures: { proj_b: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_b}", segment_code: "IB-A", equipment_class: "BELT", rated_capacity_cph: 1600, availability_pct: 95, source_share_bps: 8000 }
              as: DesignEngineer
              captures: { seg_iba: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_b}", segment_code: "IB-B", equipment_class: "ROLLER", rated_capacity_cph: 280, availability_pct: 90, source_share_bps: 2000 }
              as: DesignEngineer
              captures: { seg_ibb: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_b}", segment_code: "MG-C", equipment_class: "MERGE", rated_capacity_cph: 2000, availability_pct: 96 }
              as: DesignEngineer
              captures: { seg_mgc: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_b}", segment_code: "SX-D", equipment_class: "SORTATION", rated_capacity_cph: 1800, availability_pct: 92 }
              as: DesignEngineer
              captures: { seg_sxd: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_b}", segment_code: "OT-E", equipment_class: "BELT", rated_capacity_cph: 1800, availability_pct: 97 }
              as: DesignEngineer
              captures: { seg_ote: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_b}", segment_code: "OT-F", equipment_class: "ROLLER", rated_capacity_cph: 2000, availability_pct: 98 }
              as: DesignEngineer
              captures: { seg_otf: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_b}", segment_code: "OT-G", equipment_class: "BELT", rated_capacity_cph: 1200, availability_pct: 99 }
              as: DesignEngineer
              captures: { seg_otg: $.data.id }
            - call: "POST /flow-links"
              payload: { project_id: "${proj_b}", from_segment_id: "${seg_iba}", to_segment_id: "${seg_mgc}", split_share_bps: 10000 }
              as: DesignEngineer
            - call: "POST /flow-links"
              payload: { project_id: "${proj_b}", from_segment_id: "${seg_ibb}", to_segment_id: "${seg_mgc}", split_share_bps: 10000 }
              as: DesignEngineer
            - call: "POST /flow-links"
              payload: { project_id: "${proj_b}", from_segment_id: "${seg_mgc}", to_segment_id: "${seg_sxd}", split_share_bps: 10000 }
              as: DesignEngineer
            - call: "POST /flow-links"
              payload: { project_id: "${proj_b}", from_segment_id: "${seg_sxd}", to_segment_id: "${seg_ote}", split_share_bps: 5000 }
              as: DesignEngineer
            - call: "POST /flow-links"
              payload: { project_id: "${proj_b}", from_segment_id: "${seg_sxd}", to_segment_id: "${seg_otf}", split_share_bps: 3000 }
              as: DesignEngineer
            - call: "POST /flow-links"
              payload: { project_id: "${proj_b}", from_segment_id: "${seg_sxd}", to_segment_id: "${seg_otg}", split_share_bps: 2000 }
              as: DesignEngineer
          trigger:
            - call: "POST /projects/${proj_b}/simulations"
              payload: { method: "DETERMINISTIC_STEADY_STATE" }
              as: DesignEngineer
              captures: { sim_det: $.data.id }
            - call: "POST /projects/${proj_b}/simulations"
              payload: { method: "DEGRADED_AVAILABILITY" }
              as: DesignEngineer
              captures: { sim_deg: $.data.id }
          assert:
            - "SimulationRun.${sim_det}.effective_throughput_cph == 1400"
            - "SimulationRun.${sim_det}.shortfall_cph == 0"
            - "SimulationRun.${sim_det}.bottleneck_segment_code == 'IB-B'"
            - "SimulationRun.${sim_deg}.effective_throughput_cph == 1260"
            - "SimulationRun.${sim_deg}.shortfall_cph == 40"
            - "SimulationRun.${sim_deg}.bottleneck_segment_code == 'IB-B'"
            - "SimulationRun.${sim_deg}.bottleneck_availability_pct == 90"
            - "SimulationRun.${sim_det}.status == COMPLETE and SimulationRun.${sim_deg}.status == COMPLETE (different methods never supersede each other)"
            - "ConveyorSegment.${seg_mgc}.derated_capacity_cph == 1843 (reflects the most recent run, the DEGRADED one)"
            - "ConveyorSegment.${seg_sxd}.derated_capacity_cph == 1606"
            - "ConveyorSegment.${seg_ibb}.flow_share_bps == 2000 and ConveyorSegment.${seg_ote}.flow_share_bps == 5000"

      - name: liquidated_damages_nameplate_vs_observed_availability
        grounds:
          - calculations.liquidated_damages
          - entities.PerformanceDispute.fields.provisional_nameplate_cents
          - entities.PerformanceDispute.fields.provisional_observed_cents
          - entities.PerformanceDispute.fields.bound_provisional_cents
        distinguishing_aspect: |
          One filing computes both money variants from the same claimed_cph 1150: NAMEPLATE charges the raw
          8-point shortfall for 9,744,000 cents while OBSERVED_AVAILABILITY grosses the rate up by the
          certificate's 95% bottleneck availability to 1210 cph, collapsing the shortfall to 3 points and
          3,654,000 cents — a cents-denominated ledger figure on PerformanceDispute, a different entity domain
          from the throughput variant instance.
        test_recipe:
          setup:
            - "Project ACCEPTED with required_throughput_cph 1250, contract_value_cents 243600000 and service_tier PREMIUM."
            - "AcceptanceCertificate ISSUED with retention_amount_cents 12180000 and bottleneck_availability_pct 95, issued at logical clock 2026-08-10T20:00:00Z."
            - "No PerformanceDispute exists yet."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Northstar Grocers", facility_code: "DC-ATL-04", customer_rep_user_id: "cust-rep-77", required_throughput_cph: 1250, contract_base_cents: 240000000, authorized_ceiling_cents: 300000000, spares_budget_cents: 5000000, service_tier: "PREMIUM" }
              as: ProjectDirector
              as_user_id: "pd-001"
              captures: { proj_a: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_a}", segment_code: "IB-01", equipment_class: "BELT", rated_capacity_cph: 1500, availability_pct: 96, source_share_bps: 10000 }
              as: DesignEngineer
              captures: { seg_ib01: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_a}", segment_code: "TR-02", equipment_class: "ROLLER", rated_capacity_cph: 1400, availability_pct: 95 }
              as: DesignEngineer
              captures: { seg_tr02: $.data.id }
            - call: "POST /flow-links"
              payload: { project_id: "${proj_a}", from_segment_id: "${seg_ib01}", to_segment_id: "${seg_tr02}", split_share_bps: 10000 }
              as: DesignEngineer
            - call: "POST /projects/${proj_a}/simulations"
              payload: { method: "DEGRADED_AVAILABILITY" }
              as: DesignEngineer
            - call: "POST /projects/${proj_a}/design-freeze"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-001"
            - call: "POST /staging-bays"
              payload: { bay_code: "BAY-1", concurrent_capacity: 2 }
              as: ShopSupervisor
              captures: { bay_1: $.data.id }
            - call: "POST /fabrication-lots"
              payload: { project_id: "${proj_a}", lot_code: "LOT-100", staging_bay_id: "${bay_1}", segment_codes: ["IB-01", "TR-02"], occupancy_start_utc: "2026-08-03T00:00:00Z", occupancy_end_utc: "2026-08-07T00:00:00Z" }
              as: ShopSupervisor
              captures: { lot_1: $.data.id }
            - call: "POST /fabrication-lots/${lot_1}/start-fabrication"
              payload: {}
              as: ShopSupervisor
            - call: "POST /fabrication-lots/${lot_1}/stage"
              payload: {}
              as: ShopSupervisor
              captures: { lot_1_v: $.data.version }
            - call: "POST /fat-tests"
              payload: { fabrication_lot_id: "${lot_1}", expected_fabrication_lot_version: "${lot_1_v}", measured_cph: 1320, defect_count: 1 }
              as: ShopSupervisor
            - call: "POST /site-zones"
              payload: { project_id: "${proj_a}", zone_code: "Z-INBOUND", throughput_share_bps: 10000, protected_shift_start_minute: 480, protected_shift_end_minute: 1080, buffer_minutes: 60 }
              as: SiteManager
              captures: { zone_1: $.data.id }
            - call: "POST /cutover-windows"
              payload: { project_id: "${proj_a}", site_zone_id: "${zone_1}", fabrication_lot_id: "${lot_1}", start_utc: "2026-08-10T19:00:00Z", end_utc: "2026-08-10T23:00:00Z" }
              as: SiteManager
              captures: { win_1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T20:00:00Z" }
              as: ProjectDirector
              as_user_id: "pd-001"
            - call: "POST /cutover-windows/${win_1}/start"
              payload: {}
              as: SiteManager
              as_user_id: "sm-001"
            - call: "POST /cutover-windows/${win_1}/complete"
              payload: {}
              as: SiteManager
              as_user_id: "sm-001"
            - call: "POST /commissioning-ramps"
              payload: { project_id: "${proj_a}", step_pct: 50, measured_cph: 700, sustained_minutes: 30 }
              as: SiteManager
              as_user_id: "sm-001"
            - call: "POST /commissioning-ramps"
              payload: { project_id: "${proj_a}", step_pct: 75, measured_cph: 940, sustained_minutes: 60 }
              as: SiteManager
              as_user_id: "sm-001"
            - call: "POST /commissioning-ramps"
              payload: { project_id: "${proj_a}", step_pct: 100, measured_cph: 1300, sustained_minutes: 120 }
              as: SiteManager
              as_user_id: "sm-001"
            - call: "POST /acceptance-certificates"
              payload: { project_id: "${proj_a}" }
              as: ProjectDirector
              as_user_id: "pd-001"
              captures: { cert_1: $.data.id }
          trigger:
            - call: "POST /performance-disputes"
              payload: { acceptance_certificate_id: "${cert_1}", claimed_cph: 1150, damages_basis: "NAMEPLATE" }
              as: CustomerRep
              as_user_id: "cust-rep-77"
              captures: { disp_1: $.data.id }
          assert:
            - "AcceptanceCertificate.${cert_1}.retention_amount_cents == 12180000"
            - "AcceptanceCertificate.${cert_1}.bottleneck_availability_pct == 95"
            - "PerformanceDispute.${disp_1}.provisional_nameplate_cents == 9744000"
            - "PerformanceDispute.${disp_1}.provisional_observed_cents == 3654000"
            - "PerformanceDispute.${disp_1}.bound_provisional_cents == 9744000"
            - "PerformanceDispute.${disp_1}.provisional_nameplate_cents != PerformanceDispute.${disp_1}.provisional_observed_cents"
            - "AcceptanceCertificate.${cert_1}.status == DISPUTED and Project.${proj_a}.commercial_status == DISPUTED"
            - "Project.${proj_a}.delivery_status == ACCEPTED (the delivery dimension is untouched by the dispute)"

  # =========================================================================
  # Rule 2 — combinatorial_formula
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: merge_and_sortation_derate_nesting_order_pinned
        grounds:
          - calculations.line_throughput_simulation
          - entities.ConveyorSegment.fields.derated_capacity_cph
          - entities.ConveyorSegment.fields.inbound_link_count
          - entities.ConveyorSegment.fields.outbound_link_count
        distinguishing_aspect: |
          Mode (a): derated_capacity_cph composes four inputs (rated_capacity_cph, availability_pct,
          inbound_link_count, equipment_class) through two nested floors whose ORDER is observable — the
          three-input MERGE MG-X (1751 cph, 89%) yields 1433 when availability is applied before the 1200 bps
          merge derate and 1432 when the two are swapped — and the class branch is exclusive, so SORTATION SX-Y
          with only two outbound links takes no derate at all (1600 stays 1600).
        test_recipe:
          setup:
            - "One Project with required_throughput_cph 1200 in delivery_status DESIGN."
            - "Three source segments SR-1 (BELT 900 cph, 99%, 4000 bps), SR-2 (BELT 900 cph, 99%, 3000 bps), SR-3 (ROLLER 900 cph, 99%, 3000 bps) all feeding the same MERGE."
            - "MERGE MG-X rated 1751 cph at 89% availability with inbound_link_count 3, feeding SORTATION SX-Y rated 1600 cph at 95% availability with outbound_link_count 2 (below the SORTATION_DIVERT_MIN_OUTBOUND of 3)."
            - "Two outfeeds OT-1 (BELT 1000 cph, 99%, 6000 bps of the sorter) and OT-2 (BELT 1000 cph, 99%, 4000 bps)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Harborline Parcel", facility_code: "DC-SEA-02", customer_rep_user_id: "cust-rep-33", required_throughput_cph: 1200, contract_base_cents: 200000000, authorized_ceiling_cents: 260000000, spares_budget_cents: 4000000, service_tier: "BASIC" }
              as: ProjectDirector
              as_user_id: "pd-002"
              captures: { proj_c: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_c}", segment_code: "SR-1", equipment_class: "BELT", rated_capacity_cph: 900, availability_pct: 99, source_share_bps: 4000 }
              as: DesignEngineer
              captures: { seg_sr1: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_c}", segment_code: "SR-2", equipment_class: "BELT", rated_capacity_cph: 900, availability_pct: 99, source_share_bps: 3000 }
              as: DesignEngineer
              captures: { seg_sr2: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_c}", segment_code: "SR-3", equipment_class: "ROLLER", rated_capacity_cph: 900, availability_pct: 99, source_share_bps: 3000 }
              as: DesignEngineer
              captures: { seg_sr3: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_c}", segment_code: "MG-X", equipment_class: "MERGE", rated_capacity_cph: 1751, availability_pct: 89 }
              as: DesignEngineer
              captures: { seg_mgx: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_c}", segment_code: "SX-Y", equipment_class: "SORTATION", rated_capacity_cph: 1600, availability_pct: 95 }
              as: DesignEngineer
              captures: { seg_sxy: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_c}", segment_code: "OT-1", equipment_class: "BELT", rated_capacity_cph: 1000, availability_pct: 99 }
              as: DesignEngineer
              captures: { seg_ot1: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_c}", segment_code: "OT-2", equipment_class: "BELT", rated_capacity_cph: 1000, availability_pct: 99 }
              as: DesignEngineer
              captures: { seg_ot2: $.data.id }
            - call: "POST /flow-links"
              payload: { project_id: "${proj_c}", from_segment_id: "${seg_sr1}", to_segment_id: "${seg_mgx}", split_share_bps: 10000 }
              as: DesignEngineer
            - call: "POST /flow-links"
              payload: { project_id: "${proj_c}", from_segment_id: "${seg_sr2}", to_segment_id: "${seg_mgx}", split_share_bps: 10000 }
              as: DesignEngineer
            - call: "POST /flow-links"
              payload: { project_id: "${proj_c}", from_segment_id: "${seg_sr3}", to_segment_id: "${seg_mgx}", split_share_bps: 10000 }
              as: DesignEngineer
            - call: "POST /flow-links"
              payload: { project_id: "${proj_c}", from_segment_id: "${seg_mgx}", to_segment_id: "${seg_sxy}", split_share_bps: 10000 }
              as: DesignEngineer
            - call: "POST /flow-links"
              payload: { project_id: "${proj_c}", from_segment_id: "${seg_sxy}", to_segment_id: "${seg_ot1}", split_share_bps: 6000 }
              as: DesignEngineer
            - call: "POST /flow-links"
              payload: { project_id: "${proj_c}", from_segment_id: "${seg_sxy}", to_segment_id: "${seg_ot2}", split_share_bps: 4000 }
              as: DesignEngineer
          trigger:
            - call: "POST /projects/${proj_c}/simulations"
              payload: { method: "DETERMINISTIC_STEADY_STATE" }
              as: DesignEngineer
              captures: { sim_c_det: $.data.id }
            - call: "GET /projects/${proj_c}/segments"
              payload: {}
              as: DesignEngineer
            - call: "POST /projects/${proj_c}/simulations"
              payload: { method: "DEGRADED_AVAILABILITY" }
              as: DesignEngineer
              captures: { sim_c_deg: $.data.id }
          assert:
            - "ConveyorSegment.${seg_mgx}.inbound_link_count == 3 and ConveyorSegment.${seg_mgx}.outbound_link_count == 1"
            - "ConveyorSegment.${seg_sxy}.outbound_link_count == 2"
            - "SimulationRun.${sim_c_det}.effective_throughput_cph == 1600"
            - "SimulationRun.${sim_c_det}.bottleneck_segment_code == 'SX-Y'"
            - "ConveyorSegment.${seg_mgx}.derated_capacity_cph == 1433 (availability floor first, then the 1200 bps merge derate; the swapped order would give 1432)"
            - "ConveyorSegment.${seg_sxy}.derated_capacity_cph == 1520 (availability only — no SORTATION derate below 3 outbound links)"
            - "SimulationRun.${sim_c_deg}.effective_throughput_cph == 1433"
            - "SimulationRun.${sim_c_deg}.bottleneck_segment_code == 'MG-X'"
            - "ConveyorSegment.${seg_mgx}.flow_share_bps == 10000 and ConveyorSegment.${seg_ot1}.flow_share_bps == 6000"

      - name: spares_weighted_target_rounds_per_line_before_summation
        grounds:
          - calculations.spares_budget_waterfall
          - entities.SparePartLine.fields.weighted_target_cents
          - entities.SparePartLine.fields.allocated_cents
          - entities.Project.fields.spares_allocated_cents
        distinguishing_aspect: |
          Mode (b): the two MAJOR lines each request 1,290,006 cents, so rounding each line's 6000 bps coverage
          to whole cents BEFORE summation gives 774,004 + 774,004 = 1,548,008, whereas summing first and
          rounding once gives 1,548,007 — a one-cent divergence that pins the rounding order, and the project
          ledger lands on 4,754,008 allocated with 245,992 unallocated.
        test_recipe:
          setup:
            - "One Project with spares_budget_cents 5000000, spares_allocated_cents 0 and spares_unallocated_cents 5000000."
            - "Five DRAFT SparePartLine rows: MOTOR-3KW (CRITICAL, 850000 x 2, lead 45), SORT-SHOE (CRITICAL, 125500 x 12, lead 30), BELT-24IN (MAJOR, 215001 x 6, lead 60), PHOTO-EYE (MAJOR, 430002 x 3, lead 21), LABEL-STK (MINOR, 4000 x 50, lead 7)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Northstar Grocers", facility_code: "DC-ATL-04", customer_rep_user_id: "cust-rep-77", required_throughput_cph: 1250, contract_base_cents: 240000000, authorized_ceiling_cents: 300000000, spares_budget_cents: 5000000, service_tier: "PREMIUM" }
              as: ProjectDirector
              as_user_id: "pd-001"
              captures: { proj_s: $.data.id, proj_s_v0: $.data.version }
            - call: "POST /spare-part-lines"
              payload: { project_id: "${proj_s}", part_no: "MOTOR-3KW", criticality: "CRITICAL", unit_cost_cents: 850000, min_stock_qty: 2, lead_time_days: 45 }
              as: ProjectDirector
              as_user_id: "pd-001"
              captures: { line_motor: $.data.id }
            - call: "POST /spare-part-lines"
              payload: { project_id: "${proj_s}", part_no: "SORT-SHOE", criticality: "CRITICAL", unit_cost_cents: 125500, min_stock_qty: 12, lead_time_days: 30 }
              as: ProjectDirector
              as_user_id: "pd-001"
              captures: { line_shoe: $.data.id }
            - call: "POST /spare-part-lines"
              payload: { project_id: "${proj_s}", part_no: "BELT-24IN", criticality: "MAJOR", unit_cost_cents: 215001, min_stock_qty: 6, lead_time_days: 60 }
              as: ProjectDirector
              as_user_id: "pd-001"
              captures: { line_belt: $.data.id }
            - call: "POST /spare-part-lines"
              payload: { project_id: "${proj_s}", part_no: "PHOTO-EYE", criticality: "MAJOR", unit_cost_cents: 430002, min_stock_qty: 3, lead_time_days: 21 }
              as: ProjectDirector
              as_user_id: "pd-001"
              captures: { line_eye: $.data.id }
            - call: "POST /spare-part-lines"
              payload: { project_id: "${proj_s}", part_no: "LABEL-STK", criticality: "MINOR", unit_cost_cents: 4000, min_stock_qty: 50, lead_time_days: 7 }
              as: ProjectDirector
              as_user_id: "pd-001"
              captures: { line_label: $.data.id }
            - call: "GET /projects/${proj_s}"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-001"
              captures: { proj_s_v1: $.data.version }
          trigger:
            - call: "POST /projects/${proj_s}/spares-provisioning"
              payload: { expected_project_version: "${proj_s_v1}" }
              as: ProjectDirector
              as_user_id: "pd-001"
          assert:
            - "SparePartLine.${line_belt}.requested_cents == 1290006 and SparePartLine.${line_belt}.weighted_target_cents == 774004"
            - "SparePartLine.${line_eye}.requested_cents == 1290006 and SparePartLine.${line_eye}.weighted_target_cents == 774004"
            - "SparePartLine.${line_belt}.allocated_cents + SparePartLine.${line_eye}.allocated_cents == 1548008 (not 1548007)"
            - "SparePartLine.${line_motor}.allocated_cents == 1700000 and SparePartLine.${line_motor}.status == ALLOCATED"
            - "SparePartLine.${line_shoe}.allocated_cents == 1506000 and SparePartLine.${line_shoe}.status == ALLOCATED"
            - "SparePartLine.${line_label}.allocated_cents == 0 and SparePartLine.${line_label}.status == DRAFT"
            - "Project.${proj_s}.spares_allocated_cents == 4754008"
            - "Project.${proj_s}.spares_unallocated_cents == 245992"

      - name: escalation_tier_keyed_on_pre_fee_subtotal
        grounds:
          - calculations.contract_value_recompute
          - entities.Project.fields.escalation_fee_cents
          - entities.Project.fields.contract_value_cents
          - state_machines.ChangeOrder.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Mode (c): approving a +10,000,000 cent change order lands the pre-fee subtotal on exactly the
          250,000,000 cent tier-1 ceiling, so the fee is 150 bps for 253,750,000 total; keying the tier on the
          post-fee contract_value_cents instead would push it into the 220 bps tier and produce 255,500,000, so
