      - name: lead_cycles_back_to_displacement_review_on_peak_increase
        grounds:
          - state_machines.Lead.QUOTED_to_DISPLACEMENT_REVIEW
          - state_machines.RateQuote.COUNTERED_to_DRAFT
          - state_machines.Lead.DISPLACEMENT_REVIEW_to_DISPLACEMENT_REVIEW
          - state_machines.Lead.CLEARED_to_QUOTED
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          The lead re-enters a state it already left: QUALIFIED -> DISPLACEMENT_REVIEW -> CLEARED ->
          QUOTED -> DISPLACEMENT_REVIEW -> CLEARED -> QUOTED, driven by a revise whose quoted_peak_rooms
          (5) exceeds the previous value (4). The loop is observable in three ways at once — the quote
          falls back PROPOSED -> COUNTERED -> DRAFT, negotiation_round increments to 1, and the soft
          hold drops to 0 on every occupied date and comes back at the new size of 5.
