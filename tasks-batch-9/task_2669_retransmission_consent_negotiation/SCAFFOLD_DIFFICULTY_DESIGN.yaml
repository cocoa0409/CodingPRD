      - name: audit_substantiation_cascades_three_levels_to_true_up_flag
        grounds:
          - state_machines.AuditFinding.OPEN_to_SUBSTANTIATED
          - state_machines.SubscriberReport.UNDER_AUDIT_to_ADJUSTED
          - calculations.subscriber_basis_determination
          - entities.SubscriberReport.fields.audit_adjustment_subscribers
          - entities.FeeSettlement.fields.true_up_required
          - entities.Distributor.fields.open_true_up_count
        distinguishing_aspect: |
          Depth 3 from a single audit resolution, a different trigger and a different chain from the
          rights-exclusion instance: AuditFinding.status (1) -> SubscriberReport.audit_adjustment_subscribers,
          adjusted_subscriber_count, billable_subscriber_basis and status ADJUSTED (2) -> every ISSUED
          FeeSettlement.true_up_required plus Distributor.open_true_up_count (3). The cascade flags the
          settlement without re-pricing it, so net_retained_cents stays at its AS_REPORTED value.
        test_recipe:
          setup:
            - "The same station / affiliation / distributor / election / report / offer / agreement chain, executed"
            - "One settlement ISSUED for 2027-01 against the 100000 AS_REPORTED basis, netting 11,250,000"
            - "Clock advanced to 2027-03-01, inside the audit window closing 2027-07-31"
            - "One OPEN audit finding asserting +6000 subscribers"
