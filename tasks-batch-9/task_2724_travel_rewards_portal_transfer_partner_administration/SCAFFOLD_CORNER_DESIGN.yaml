      - name: earning_legs_are_floored_independently_before_summing
        claim_type: precision
        excluded_because:
          difficulty_instance: combinatorial_earning_two_legs_floored_independently_then_summed
          rationale: "The pinned floor-per-leg-then-sum rounding order of transaction_points_award, and the divergence from floor-of-the-sum, are asserted with pre-computed literals by that §1.8 instance; a second corner test would duplicate its arithmetic."

      - name: rotation_cap_splits_a_transaction_across_the_headroom_threshold
        claim_type: threshold_boundary
        excluded_because:
          difficulty_instance: boundary_rotation_cap_headroom_exhausts_mid_transaction
          rationale: "The threshold algorithm's crossing case — a transaction whose amount straddles the remaining capped_spend_cents headroom, plus the transaction that finds zero headroom — is covered end to end by that §1.8 instance."

      - name: transfer_units_floor_per_block_rather_than_once_on_the_total
        claim_type: precision
        excluded_because:
          difficulty_instance: combinatorial_transfer_units_floored_per_1000_point_block
          rationale: "The waterfall_allocation rounding order, including the bonus leg floored against the already-floored units_per_block, is asserted with pre-computed literals by that §1.8 instance."

      - name: issuer_cost_variant_selection_follows_settlement_status
        claim_type: variant_selection
        excluded_because:
          difficulty_instance: dual_variant_redemption_issuer_cost_provisional_vs_final
          rationale: "Variant divergence, variant selection by settlement_status and the payable_cents reconciliation delta are all asserted by that §1.8 instance on one order."

      - name: ato_score_variant_divergence_between_instant_and_review_legs
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: dual_variant_ato_score_instant_vs_review
          rationale: "Both legs of ato_risk_score on identical case data, and the device-stability decay that makes them diverge without crossing the lock threshold, are asserted by that §1.8 instance."

      - name: liability_snapshot_dormancy_split_and_tier_pinning
        claim_type: input_set_filtering
        excluded_because:
          difficulty_instance: combinatorial_liability_tier_pinned_to_step_one_gross
          rationale: "The seven-step pinned order — gross-driven tier selection, dormancy bucketing at DORMANCY_LOOKBACK_DAYS, per-bucket rounding and the COST_BASIS/FAIR_VALUE cost sets — is asserted with pre-computed cent literals by that §1.8 instance."

