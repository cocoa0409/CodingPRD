            - call: "POST /jda/solicitations/${sol_a}/proposals"
              payload: { developer_id: "${dev_b}", proposed_structure: "FEE_DISPOSITION", proposed_purchase_price_cents: 42000000, affordable_units: 36, total_units: 180, transit_ridership_uplift: 1200, design_compliance_score: 70, joint_use_committed: false }
