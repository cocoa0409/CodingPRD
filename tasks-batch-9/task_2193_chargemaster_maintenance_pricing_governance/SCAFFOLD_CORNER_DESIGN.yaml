          assert:
            - "the first page returns total_count 3, has_more true, ${a0} == ${i1} and ${a1} == ${i2}"
            - "offset 2 returns 1 row, has_more false and ${b0} == ${i3}"
            - "after appending ${i4}: total_count 4 with ${c0} == ${i1} and ${c1} == ${i2} — page 0 is unchanged by the append"
            - "offset 2 now returns 2 rows with has_more false, ${d0} == ${i3} and ${d1} == ${i4}"
            - "after ${i1} leaves the DRAFT set: the DRAFT listing reports total_count 3 with ${e0} == ${i2} and ${e1} == ${i3} — every row shifted one window left"
            - "the DRAFT listing at offset 2 now returns exactly 1 row (${i4}) with has_more false"
            - "the unfiltered listing still reports total_count 4, so nothing was deleted"
            - "the ACTIVE listing reports total_count 1 with ${f0} == ${i1}, and 3 + 1 == 4 partitions the facility exactly"

      - name: cascade_chain_from_request_implementation_through_file_supersession_to_facility_recount
        claim_type: cascading_side_effects
        grounds:
          - cross_cutting_complexity_layers[cascading_side_effects]
          - endpoints[POST /chargemaster/change-requests/{request_id}/implement]
          - entities.TransparencyFile
          - entities.Facility
        excluded_because:
          difficulty_instance: transitive_cascade__implement_item_supersedes_file_clears_facility_voids_sibling_request
          rationale: "The §1.8 instance already drives the identical four-level chain end to end (implement rewrites the item's cost basis and gross, the PUBLISHED transparency file is superseded and the facility's transparency_status drops to NEEDS_REFRESH, the facility aggregates are recomputed, and the sibling open request on the same item is voided) and additionally checks ordering sensitivity by re-reading each level in turn. A breadth duplicate here would assert the same observables on the same endpoint sequence with nothing new distinguishing it."
      - name: payer_impact_projection_mode_switch_changes_only_the_unit_basis
        claim_type: dual_variant_calculation
        grounds:
          - cross_cutting_complexity_layers[dual_variant_calculation]
          - calculations[payer_impact_delta]
          - endpoints[POST /chargemaster/price-change-analyses]
        excluded_because:
          difficulty_instance: dual_variant_calc__payer_impact_forward_vs_historical_on_payer_contract_domain
          rationale: "Both projection variants are already run against the same trailing volume in the §1.8 instance, which pins FORWARD_PROJECTED units at round_half_up(100 * 10500 / 10000) == 105 against HISTORICAL_TRAILING units at 100 and shows the resulting delta divergence on the same PERCENT_OF_CHARGE contract. The corner-design duplicate would add no new endpoint, error or branch."
      - name: pricing_posture_flips_to_restricted_on_the_fifth_stale_active_item
        claim_type: rate_threshold_triggers
        grounds:
          - cross_cutting_complexity_layers[rate_threshold_triggers]
          - entities.Facility
          - calculations[pricing_change_posture]
          - errors[ERR_FACILITY_RESTRICTED]
        excluded_because:
          difficulty_instance: transitive_cascade__price_rule_supersession_stales_five_items_restricts_facility
          rationale: "The cumulative threshold is already tested at its boundary there: superseding one price rule stales exactly five ACTIVE items, stale_price_item_count reaches 5 and the posture flips OPEN -> RESTRICTED, after which repricing one item back to PRICED_CURRENT (count 4) restores OPEN. Re-running the 4-versus-5 boundary as a breadth instance would repeat that instance's setup verbatim."

  - section: consistency_model
    instances:
      - name: every_write_response_already_carries_the_recomputed_derived_state_with_no_read_lag
        claim_type: immediate
        grounds:
          - consistency_model[immediate]
          - entities.Facility
          - entities.ChargeItem
          - entities.TransparencyFile
          - errors[ERR_FACILITY_FROZEN]
        distinguishing_aspect: "Immediate consistency is asserted at the hardest point: a cross-entity derived field. The transparency-file create response itself reports BUILDING, and the very next call — with no delay, retry or re-fetch loop — sees the facility already FROZEN and a charge-item create already rejected with ERR_FACILITY_FROZEN. Likewise the ACTIVATE response's own body carries the new lifecycle_status and version, and the facility read taken immediately afterwards already carries the recomputed count and aggregate, so no observable is allowed to lag behind the write that caused it."
        test_recipe:
          setup:
            - "Clock 2026-09-01; facility CCN-0001 (NEAREST_CENT); revenue code 0300; department CC-100 (mgr_cath); one COST_PLUS_MARKUP rule; item CDM-1001 priced at 240000 and APPROVED but not yet ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /chargemaster/facilities"
              payload: { name: "Mercy General", cms_certification_number: "CCN-0001", rounding_mode: "NEAREST_CENT" }
              as: SystemAdmin
              captures: { fac: $.data.id, fv1: $.data.version }
            - call: "POST /chargemaster/revenue-codes"
              payload: { code: "0300", description: "Laboratory", requires_hcpcs: false, allowed_code_types: ["CPT"], pricing_class: "PROCEDURE" }
              as: SystemAdmin
              captures: { rc300: $.data.id }
            - call: "POST /chargemaster/departments"
              payload: { facility_id: "${fac}", name: "Cardiac Cath Lab", cost_center_code: "CC-100", manager_user_id: "mgr_cath" }
              as: SystemAdmin
              captures: { dept: $.data.id }
            - call: "POST /chargemaster/price-rules"
              payload: { facility_id: "${fac}", revenue_code_id: "${rc300}", pricing_method: "COST_PLUS_MARKUP", effective_from: "2026-01-01T00:00:00Z", markup_tiers: [{ min_cost_basis_cents: 0, markup_bp: 32000 }, { min_cost_basis_cents: 50000, markup_bp: 24000 }] }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_1"
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac}", department_id: "${dept}", revenue_code_id: "${rc300}", cdm_number: "CDM-1001", description: "CARDIAC CATH BASIC", code_type: "CPT", code_value: "93458", cost_basis_cents: 100000, medicare_rate_cents: 50000, market_p75_cents: 900000, effective_from: "2026-09-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_1"
              captures: { item: $.data.id }
            - call: "POST /chargemaster/charge-items/${item}/reprice"
              payload: {}
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_1"
              captures: { g_write: $.data.gross_charge_cents, ps_write: $.data.price_status }
            - call: "POST /chargemaster/charge-items/${item}/lifecycle"
              payload: { action: "SUBMIT_FOR_REVIEW" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_1"
            - call: "POST /chargemaster/charge-items/${item}/lifecycle"
              payload: { action: "APPROVE" }
              as: PricingCommitteeApprover
              as_user_id: "pca_1"
              captures: { appr_status: $.data.lifecycle_status }
          trigger:
            - call: "GET /chargemaster/charge-items/${item}"
              payload: {}
              as: RevenueIntegrityAnalyst
              captures: { g_read: $.data.gross_charge_cents, ps_read: $.data.price_status }
            - call: "POST /chargemaster/charge-items/${item}/lifecycle"
              payload: { action: "ACTIVATE" }
              as: PricingCommitteeApprover
              as_user_id: "pca_1"
              captures: { act_status: $.data.lifecycle_status, act_version: $.data.version }
            - call: "GET /chargemaster/facilities/${fac}"
              payload: {}
              as: SystemAdmin
              captures: { cnt: $.data.active_item_count, agg: $.data.aggregate_gross_charge_cents, posture1: $.data.chargemaster_posture, tstat1: $.data.transparency_status }
            - call: "POST /chargemaster/transparency-files"
              payload: { facility_id: "${fac}", file_format: "CSV", expected_facility_version: "${fv1}" }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { file: $.data.id, f_write_status: $.data.status }
            - call: "GET /chargemaster/facilities/${fac}"
              payload: {}
              as: SystemAdmin
              captures: { posture2: $.data.chargemaster_posture }
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac}", department_id: "${dept}", revenue_code_id: "${rc300}", cdm_number: "CDM-2002", description: "CARDIAC CATH COMPLEX", code_type: "CPT", code_value: "93460", cost_basis_cents: 100000, medicare_rate_cents: 50000, market_p75_cents: 900000, effective_from: "2026-09-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_1"
            - call: "GET /chargemaster/transparency-files/${file}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { f_read_status: $.data.status }
            - call: "POST /chargemaster/transparency-files/${file}/lifecycle"
              payload: { action: "VALIDATE" }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { f_validated: $.data.status, f_included: $.data.included_item_count }
            - call: "GET /chargemaster/facilities/${fac}"
              payload: {}
              as: SystemAdmin
              captures: { posture3: $.data.chargemaster_posture }
            - call: "POST /chargemaster/transparency-files/${file}/lifecycle"
              payload: { action: "PUBLISH" }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { f_published: $.data.status }
            - call: "GET /chargemaster/facilities/${fac}"
              payload: {}
              as: SystemAdmin
              captures: { posture4: $.data.chargemaster_posture, tstat4: $.data.transparency_status }
          assert:
            - "${g_write} == 240000 and ${ps_write} == PRICED_CURRENT — the reprice response itself carries the computed price"
            - "${g_read} == ${g_write} and ${ps_read} == ${ps_write} on the immediate re-read"
            - "${appr_status} == APPROVED and ${act_status} == ACTIVE with ${act_version} == 5 in the write response"
            - "${cnt} == 1, ${agg} == 240000, ${posture1} == OPEN and ${tstat1} == NEEDS_REFRESH on the very next read"
            - "${f_write_status} == BUILDING in the create response and ${f_read_status} == BUILDING on re-read"
            - "${posture2} == FROZEN immediately after the file create, with no intervening call"
            - "the CDM-2002 create returns 409 with error_id ERR_FACILITY_FROZEN, so the derived posture is enforced without any lag window"
            - "${f_validated} == VALIDATED with ${f_included} == 1, and ${posture3} == FROZEN — VALIDATED still freezes, so the posture read tracks the exact state and not merely 'a file exists'"
            - "${f_published} == PUBLISHED, ${posture4} == OPEN and ${tstat4} == CURRENT — the thaw is equally immediate"

      - name: a_rejected_write_leaves_no_partially_applied_state_visible_to_the_next_read
        claim_type: immediate
        grounds:
          - consistency_model[immediate]
          - validations[priority=54]
          - errors[ERR_AGGREGATE_MARKUP_LIMIT]
          - endpoints[POST /chargemaster/charge-items/{item_id}/lifecycle]
          - endpoints[PATCH /chargemaster/facilities/{facility_id}]
        distinguishing_aspect: "The mirror image of the previous instance: the rejected APPROVE is a call whose success would have written the item's lifecycle_status, bumped its version and moved three facility counters at once, and after the 409 not one of those observables has moved — the item is still PENDING_REVIEW at the same version, the facility still reports 0 / 0 at the same version, and the very same call succeeds the instant the limit is raised to 30000, which proves the rejection was a guard rather than a lost write."
        test_recipe:
          setup:
            - "Clock 2026-09-01; facility CCN-0001 (NEAREST_CENT) created with aggregate_markup_limit_bp 20000; revenue code 0300; department CC-100 (mgr_cath); one COST_PLUS_MARKUP rule."
            - "Item CDM-1001 (cost 100000) repriced to 240000, i.e. a 24000 bp markup, and submitted for review."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /chargemaster/facilities"
              payload: { name: "Mercy General", cms_certification_number: "CCN-0001", rounding_mode: "NEAREST_CENT", aggregate_markup_limit_bp: 20000 }
              as: SystemAdmin
              captures: { fac: $.data.id, fv1: $.data.version }
            - call: "POST /chargemaster/revenue-codes"
              payload: { code: "0300", description: "Laboratory", requires_hcpcs: false, allowed_code_types: ["CPT"], pricing_class: "PROCEDURE" }
              as: SystemAdmin
              captures: { rc300: $.data.id }
            - call: "POST /chargemaster/departments"
              payload: { facility_id: "${fac}", name: "Cardiac Cath Lab", cost_center_code: "CC-100", manager_user_id: "mgr_cath" }
              as: SystemAdmin
              captures: { dept: $.data.id }
            - call: "POST /chargemaster/price-rules"
              payload: { facility_id: "${fac}", revenue_code_id: "${rc300}", pricing_method: "COST_PLUS_MARKUP", effective_from: "2026-01-01T00:00:00Z", markup_tiers: [{ min_cost_basis_cents: 0, markup_bp: 32000 }, { min_cost_basis_cents: 50000, markup_bp: 24000 }] }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_1"
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac}", department_id: "${dept}", revenue_code_id: "${rc300}", cdm_number: "CDM-1001", description: "CARDIAC CATH BASIC", code_type: "CPT", code_value: "93458", cost_basis_cents: 100000, medicare_rate_cents: 50000, market_p75_cents: 900000, effective_from: "2026-09-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_1"
              captures: { item: $.data.id }
            - call: "POST /chargemaster/charge-items/${item}/reprice"
              payload: {}
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_1"
              captures: { gross: $.data.gross_charge_cents }
            - call: "POST /chargemaster/charge-items/${item}/lifecycle"
              payload: { action: "SUBMIT_FOR_REVIEW" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_1"
              captures: { pending: $.data.lifecycle_status, v_before: $.data.version }
          trigger:
            - call: "POST /chargemaster/charge-items/${item}/lifecycle"
              payload: { action: "APPROVE" }
              as: PricingCommitteeApprover
              as_user_id: "pca_1"
            - call: "GET /chargemaster/charge-items/${item}"
              payload: {}
              as: PricingCommitteeApprover
              captures: { status_after_fail: $.data.lifecycle_status, v_after_fail: $.data.version, gross_after_fail: $.data.gross_charge_cents }
            - call: "GET /chargemaster/facilities/${fac}"
              payload: {}
              as: SystemAdmin
              captures: { cnt_after_fail: $.data.active_item_count, agg_after_fail: $.data.aggregate_gross_charge_cents, fv_after_fail: $.data.version }
            - call: "PATCH /chargemaster/facilities/${fac}"
              payload: { expected_facility_version: "${fv1}", aggregate_markup_limit_bp: 30000 }
              as: SystemAdmin
              captures: { fv2: $.data.version, limit2: $.data.aggregate_markup_limit_bp }
            - call: "POST /chargemaster/charge-items/${item}/lifecycle"
              payload: { action: "APPROVE" }
              as: PricingCommitteeApprover
              as_user_id: "pca_1"
              captures: { status_ok: $.data.lifecycle_status, v_ok: $.data.version }
            - call: "POST /chargemaster/charge-items/${item}/lifecycle"
              payload: { action: "ACTIVATE" }
              as: PricingCommitteeApprover
              as_user_id: "pca_1"
              captures: { status_active: $.data.lifecycle_status }
            - call: "GET /chargemaster/facilities/${fac}"
              payload: {}
              as: SystemAdmin
              captures: { cnt_final: $.data.active_item_count, agg_final: $.data.aggregate_gross_charge_cents }
          assert:
            - "${gross} == 240000 and ${pending} == PENDING_REVIEW with ${v_before} == 3"
            - "the first APPROVE returns 409 with error_id ERR_AGGREGATE_MARKUP_LIMIT (24000 bp exceeds the facility's 20000 bp ceiling)"
            - "${status_after_fail} == PENDING_REVIEW, ${v_after_fail} == ${v_before} and ${gross_after_fail} == 240000 — nothing about the item moved"
            - "${cnt_after_fail} == 0, ${agg_after_fail} == 0 and ${fv_after_fail} == ${fv1} — no counter or version was touched by the rejected call"
            - "${fv2} == 2 and ${limit2} == 30000"
            - "the identical APPROVE now succeeds: ${status_ok} == APPROVED with ${v_ok} == 4"
            - "${status_active} == ACTIVE, ${cnt_final} == 1 and ${agg_final} == 240000"
