            - "After submit-validation: Issue.${iss7}.status == VALIDATION_SUBMITTED (hop 2)"
            - "Examination.${ex7}.status == VALIDATION (hop 3: auto-transition REMEDIATION -> VALIDATION fired because the only issue is VALIDATION_SUBMITTED)"

      - name: document_accept_cascades_item_submitted_to_posture_relaxation
        grounds:
          - state_machines.DocumentSubmission.PENDING_REVIEW_to_ACCEPTED
          - state_machines.FirstDayLetterItem.PENDING_to_SUBMITTED
          - calculations.exam_posture
          - calculations.overdue_item_count
        distinguishing_aspect: |
          Depth >= 2 cascade triggered by document submission accept: accept -> item.SUBMITTED
          -> overdue_item_count recomputed -> exam.posture relaxes from RESTRICTED/FROZEN.
          Different trigger (document QC action) than milestone-complete cascade.
        test_recipe:
          setup:
            - "Exam with 1 first-day item overdue (so posture == RESTRICTED); a PENDING_REVIEW document submission against it"
            - "Logical clock advanced past the item's due_date"
          setup_api_calls:
            - call: "POST /regulatory-exams/agencies"
              payload: { agency_code: "OCC3", agency_name: "OCC3", jurisdiction: "FEDERAL", escalation_threshold_days: 30, repeat_finding_multiplier_bp: 20000 }
