              as_user_id: "${dlr_g_id}"
              captures: { err_state: $.data.error_id }
            - call: "POST /bin-designs/${d1_id}/seal"
              payload: {}
              as: SealingEngineer
              as_user_id: "${eng_s_id}"
              captures: { sealed_status: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-22T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /dealer-orders/${o_g_id}/confirm"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlr_g_id}"
              captures: { err_credit: $.data.error_id }
          assert:
            - "the first confirm returns HTTP 409 with error_id ERR_DESIGN_NOT_SEALED, not HTTP 402 ERR_CREDIT_LIMIT_EXCEEDED, even though Dealer.${dlr_g_id}.credit_available_cents is 0 and DealerOrder.${o_g_id}.credit_hold_cents is 1999734"
            - "after the first confirm DealerOrder.${o_g_id}.production_status is still DRAFT and Dealer.${dlr_g_id}.credit_committed_cents is still 0"
            - "the seal succeeds: BinDesign.${d1_id}.status == SEALED, sealed_by_engineer_id == ${eng_s_id}, sealed_at == 2026-08-01T00:00:00Z and permit_ready_at == 2026-08-22T00:00:00Z (21 whole days)"
            - "the clock move to 2026-08-22T00:00:00Z satisfies priority 24, so ERR_PERMIT_REVIEW_PENDING does not mask the fiscal check"
            - "the second confirm returns HTTP 402 with error_id ERR_CREDIT_LIMIT_EXCEEDED - the state defect was the only thing hiding it"
            - "after the second confirm DealerOrder.${o_g_id}.production_status is still DRAFT and Dealer.${dlr_g_id}.status is still ACTIVE - a rejected confirm commits nothing"
            - "BinDesign.${d1_id}.seal_required == true, copied from Jurisdiction.${j_s_id} at design creation"

      - name: crew_tier_safety_error_precedes_crew_dealer_referential_error_on_installation_assignment
        grounds:
