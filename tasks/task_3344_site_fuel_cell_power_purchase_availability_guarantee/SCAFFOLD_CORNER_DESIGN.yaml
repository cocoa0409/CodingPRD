        distinguishing_aspect: "The reversal step compensates the settle step end to end: the accruals the settle had reconciled return to ACCRUAL_OPEN, so a line created after the reversal reads the same cap_side_pool_cents the pre-settle draft had read."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-10T00:00:00Z. One site with one active PPA carrying a 100000-cent charge accrual, an applied settlement line and an issued capacity allowance."
          setup_api_calls:
