  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: early_return_copy_hold_ready_wait_cascade
        grounds:
          - state_machines.Loan.ACTIVE_to_RETURNED
          - state_machines.Hold.PLACED_to_READY
          - calculations.wait_estimate
          - entities.CirculationEvent
        distinguishing_aspect: |
          Depth-3 chain triggered by POST /loans/{id}/return: return frees the
          OCOU copy (License.copies_on_loan 1->0), the freed copy promotes the
          oldest PLACED hold (Hold -> READY with ready_until stamped), and the
          promotion recomputes the remaining hold's wait estimates — each hop
          caused by the previous one, not by the return itself.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; pickup_window_hours 72. Library L, fund, title T, OCOU license copies 1."
            - "P0 has the ACTIVE loan; H1 (P1) then H2 (P2) are PLACED."
          setup_api_calls:
            - *d_clock
            - *d_cons
            - *d_lib
            - *d_fund
            - *d_p0
            - *d_p1
            - *d_p2
            - *d_title
            - *d_order
            - *d_propose
            - *d_approve
            - *d_fulfill
            - *d_checkout0
            - call: "POST /lending/holds"
              payload: { patron_id: "${pat1_id}", title_id: "${title_id}" }
              as: Patron
              as_user_id: "${pat1_id}"
              captures: { h1_id: $.data.id }
            - call: "POST /lending/holds"
              payload: { patron_id: "${pat2_id}", title_id: "${title_id}" }
              as: Patron
              as_user_id: "${pat2_id}"
              captures: { h2_id: $.data.id }
            - call: "GET /lending/loans"
              payload: { patron_id: "${pat0_id}", status: "ACTIVE" }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
              captures: { loan0_id: "$.data[0].id" }
          trigger:
            - call: "POST /lending/loans/${loan0_id}/return"
              payload: {}
              as: Patron
              as_user_id: "${pat0_id}"
          assert:
            - "Loan.${loan0_id}.status == RETURNED and returned_at == 2026-09-01T00:00:00Z"
            - "License copies_on_loan == 0 (copy freed by hop 1)"
            - "Hold.${h1_id}.status == READY, ready_since == 2026-09-01T00:00:00Z, ready_until == 2026-09-04T00:00:00Z (hop 2)"
            - "Hold.${h2_id}.status == PLACED and Hold.${h2_id}.optimistic_wait_days == 21 (one ahead, one copy; hop 3 recompute)"
            - "CirculationEvents exist in order: RETURN (loan ${loan0_id}) then HOLD_READY (hold ${h1_id}) with identical occurred_at"

      - name: epoch_license_expiry_autopurchase_fulfill_promotion_cascade
        grounds:
          - state_machines.License.ACTIVE_to_EXPIRED
          - calculations.auto_purchase_decision
          - state_machines.AcquisitionOrder.APPROVED_to_FULFILLED
          - state_machines.Hold.PLACED_to_READY
        distinguishing_aspect: |
          Depth-4 chain triggered by POST /_ops/run_epoch (different trigger
          from the return cascade): epoch expires the only METERED_TIME
          license, the availability drop breaches the auto-purchase ratio and
          wait target, the sweep creates+fulfills an AUTO_RATIO OCOU order,
          and the new license promotes the oldest hold — license, order,
          license, hold in one epoch.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Library L2 with auto_purchase_enabled true, holds_per_copy_ratio 4, wait_target_days 28, auto_purchase_max_cents 100000, loan 21d, renewals 2x21d."
            - "Title TM (metered_time_days 30, price_ocou_cents 5000); one METERED_TIME license activated 2026-09-01 (expires 2026-10-01)."
            - "The METERED_TIME license is on loan to P0; P1..P4 each placed a hold (4 holds)."
            - "Clock advanced to 2026-10-02T00:00:00Z (past expiry) before the epoch."
          setup_api_calls:
            - *d_clock
            - *d_cons
            - call: "POST /lending/consortiums/${cons_id}/libraries"
              payload: { name: "Library L2", residency_region_codes: ["94301"], loan_period_days: 21, renewal_period_days: 21, max_renewals: 2, pickup_window_hours: 72, max_concurrent_loans: 10, max_concurrent_holds: 15, auto_purchase_enabled: true, holds_per_copy_ratio: 4, wait_target_days: 28, auto_purchase_max_cents: 100000 }
              as: ConsortiumAdmin
              captures: { lib2_id: $.data.id }
            - call: "POST /lending/libraries/${lib2_id}/budget-funds"
              payload: { fiscal_year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", budget_cents: 1000000 }
              as: LibraryAdmin
