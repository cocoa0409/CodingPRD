          A zero-length window is refused: scheduled_end_at equal to scheduled_start_at
          gives 400 ERR_INVALID_DATE_RANGE at G8 and leaves fulfillment_status DRAFT,
          while the same window widened by one minute is accepted and moves the work
          order to SCHEDULED with both instants stored. An implementation using a
          non-strict comparison accepts the zero-length window.
