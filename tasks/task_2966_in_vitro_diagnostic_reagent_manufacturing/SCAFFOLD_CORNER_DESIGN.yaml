      - name: complaint_reportability_applies_the_thirty_day_deadline_and_the_inclusive_lateness_test
        claim_type: Constants Applied
        grounds:
          - calculations.complaint_reportability
          - entities.Complaint.fields.report_due_at
          - entities.Complaint.fields.report_late
        distinguishing_aspect: "Three declared behaviours in one fixture, all driven by MALFUNCTION_DUE_DAYS 30 rather than the 5-day path: a HIGH-severity malfunction with NO alleged death or injury is reportable on the 30-day clock; report_late uses a STRICT >, so filing exactly at the deadline is on time; and a non-reportable complaint gets a null report_due_at instead of a far-future one."
        test_recipe:
          setup:
            - "Clock at 2026-09-06T00:00:00Z. One PLANNED ReagentLot CA-LOT-3 of IVD-CA-3 and three Complaints intaken at that instant, all with device_related_death_or_injury omitted so it defaults to false."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /product-specifications"
              payload: { product_code: "IVD-CA-3", reference_material_code: "REF-CA3", required_material_codes: [], release_test_codes: ["ACTIVITY"], max_reference_bias_pct: 5.0, shelf_life_months_claim: 12, storage_condition: "TWO_TO_EIGHT_C", min_shelf_life_days_at_ship: 90 }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { ps_id: $.data.id }
            - call: "POST /reagent-lots"
              payload: { product_specification_id: "${ps_id}", lot_code: "CA-LOT-3", planned_units: 100 }
              as: ProductionOperator
              captures: { rl_id: $.data.id }
            - call: "POST /complaints"
              payload: { reagent_lot_id: "${rl_id}", complaint_code: "CPL-CA-3A", narrative: "Assay flagged a control failure at the customer site." }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { cp_a_id: $.data.id, cp_a_received: $.data.received_at, cp_a_dri: $.data.device_related_death_or_injury }
            - call: "POST /complaints"
              payload: { reagent_lot_id: "${rl_id}", complaint_code: "CPL-CA-3B", narrative: "Second site reports the same control failure." }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { cp_b_id: $.data.id }
            - call: "POST /complaints"
              payload: { reagent_lot_id: "${rl_id}", complaint_code: "CPL-CA-3C", narrative: "Outer carton dented in transit." }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { cp_c_id: $.data.id }
          trigger:
            - call: "POST /complaints/${cp_a_id}/triage"
              payload: { severity: "HIGH", malfunction_suspected: true }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { a_reportable: $.data.reportable, a_due: $.data.report_due_at }
            - call: "POST /complaints/${cp_b_id}/triage"
              payload: { severity: "HIGH", malfunction_suspected: true }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { b_due: $.data.report_due_at }
            - call: "POST /complaints/${cp_c_id}/triage"
              payload: { severity: "MEDIUM", malfunction_suspected: true }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { c_reportable: $.data.reportable, c_due: $.data.report_due_at }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /complaints/${cp_a_id}/malfunction-report"
              payload: { report_ref: "MDR-CA-3A" }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { a_reported: $.data.reported_at, a_late: $.data.report_late, a_status: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-07T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /complaints/${cp_b_id}/malfunction-report"
              payload: { report_ref: "MDR-CA-3B" }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { b_reported: $.data.reported_at, b_late: $.data.report_late }
            - call: "POST /complaints/${cp_c_id}/malfunction-report"
              payload: { report_ref: "MDR-CA-3C" }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { err_c: $.data.error_id }
          assert:
            - "all three complaints carry received_at 2026-09-06T00:00:00.000Z and device_related_death_or_injury false from the declared default"
            - "complaint A is reportable true with report_due_at 2026-10-06T00:00:00.000Z, i.e. received_at + MALFUNCTION_DUE_DAYS 30 days and NOT the 5-day death-or-injury deadline"
            - "complaint C is reportable false with report_due_at null, because severity MEDIUM is neither HIGH nor accompanied by an alleged death or injury"
            - "filing A exactly at 2026-10-06T00:00:00.000Z gives report_late false, since the comparison is a strict reported_at > report_due_at"
            - "filing B one day later at 2026-10-07T00:00:00.000Z gives report_late true, and both complaints reach status MALFUNCTION_REPORTED"
            - "the report on non-reportable complaint C returns HTTP 409 ERR_COMPLAINT_STATE_INVALID, because the TRIAGED -> MALFUNCTION_REPORTED hop requires reportable true"

      - name: design_trace_completeness_needs_an_approved_verification_and_an_approved_validation_at_depth_three
        claim_type: Correct Result
        grounds:
          - calculations.design_trace_completeness
          - errors.ERR_DESIGN_TRACE_INCOMPLETE
          - validations.priority_115_ERR_INVALID_TRACE_LINK
        distinguishing_aspect: "The flag is a CONJUNCTION of two depth-3 record types; a design history file with an approved VERIFICATION but no VALIDATION is the exact half-complete state that a single count(depth == 3) >= 2 shortcut accepts. The same fixture also pins the depth arithmetic and the trace-link shape rule that keeps the graph acyclic."
        test_recipe:
          setup:
            - "One ProductSpecification IVD-CA-4 in clearance_status DESIGN with an APPROVED DESIGN_INPUT, an APPROVED DESIGN_OUTPUT and an APPROVED VERIFICATION — but no VALIDATION yet."
          setup_api_calls:
            - call: "POST /product-specifications"
              payload: { product_code: "IVD-CA-4", reference_material_code: "REF-CA4", required_material_codes: [], release_test_codes: ["ACTIVITY"], max_reference_bias_pct: 5.0, shelf_life_months_claim: 12, storage_condition: "TWO_TO_EIGHT_C", min_shelf_life_days_at_ship: 90 }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { ps_id: $.data.id, ps_v1: $.data.version }
            - call: "POST /design-control-records"
              payload: { product_specification_id: "${ps_id}", record_type: "DESIGN_INPUT", document_ref: "DHF-IN-CA4", expected_product_specification_version: "${ps_v1}" }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { dcr_in_id: $.data.id, d1: $.data.trace_depth }
            - call: "GET /product-specifications/${ps_id}"
              payload: {}
              as: RegulatoryAffairs
              captures: { ps_v2: $.data.version }
            - call: "POST /design-control-records"
