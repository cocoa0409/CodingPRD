              as_user_id: "eng-001"
          assert:
            - "First trigger call: HTTP 409 with error_id == ERR_SPRINT_NOT_ACTIVE"
            - "Ticket.${t1_id}.status == TODO immediately after the first trigger call"
            - "After the sprint is activated, the identical transition succeeds: Ticket.${t1_id}.status == IN_PROGRESS"
            - "Sprint.${sprint_id}.status == ACTIVE"

      - name: milestone_invoice_issue_requires_completed_milestone_cross_entity_invoice_milestone
        grounds:
          - state_machines.Invoice.DRAFT_to_ISSUED
          - state_machines.Milestone.PLANNED_to_COMPLETED
          - validations[priority=46]
          - errors[ERR_MILESTONE_NOT_COMPLETED]
        distinguishing_aspect: |
          Entity pair = Invoice -> Milestone (a different pair from Ticket -> Sprint). The Invoice's
          DRAFT -> ISSUED transition is blocked because the Milestone it bills is still PLANNED; the
          Invoice's own state is perfectly valid for issue.
        test_recipe:
          setup:
            - "FIXED Engagement ACTIVE, contract_value 50000.00, with Milestone M1 (amount 5000.00) still PLANNED (no release accepted)."
            - "A manually created DRAFT MILESTONE invoice for M1 (lines = [5000.00], subtotal 5000.00, tax 412.50, total 5412.50)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Vandelay", billing_email: "ap@vandelay.test", country_code: "US" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "Vandelay Imports Site", source_channel: "OUTBOUND" }
              as: AccountManager
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/qualify"
              payload: { outcome: "QUALIFY" }
              as: AccountManager
            - call: "POST /engagements/${eng_id}/sow"
              payload: { billing_model: "FIXED", contract_value: 50000.00, budget_hours_cap: 200, standard_hourly_rate: 200.00, start_date: "2026-05-01", end_date: "2026-08-31" }
              as: AccountManager
            - call: "POST /engagements/${eng_id}/sign"
              payload: { signed_by_name: "Ned Client" }
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /milestones"
              payload: { engagement_id: "${eng_id}", sequence: 1, title: "Phase 1 - Design", amount: 5000.00, due_date: "2026-06-01" }
              as: DeliveryLead
              captures: { m1_id: $.data.id }
            - call: "GET /engagements/${eng_id}"
              payload: {}
              as: FinanceOfficer
              captures: { e_v: $.data.version }
            - call: "POST /invoices"
              payload: { engagement_id: "${eng_id}", kind: "MILESTONE", milestone_id: "${m1_id}", expected_engagement_version: "${e_v}" }
              as: FinanceOfficer
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: FinanceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_MILESTONE_NOT_COMPLETED"
            - "Invoice.${inv_id}.status == DRAFT"
            - "Milestone.${m1_id}.status == PLANNED"
            - "Engagement.${eng_id}.invoiced_amount == 0.00"
            - "Engagement.${eng_id}.billing_status == UNBILLED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: sprint_half_open_interval_adjacency_allowed_overlap_rejected
        grounds:
          - validations[priority=61]
          - errors[ERR_SPRINT_OVERLAP]
          - entities.Sprint.fields.start_date
          - entities.Sprint.fields.end_date
        distinguishing_aspect: |
          Resource = Engagement's sprint calendar, interval semantics = HALF-OPEN [start, end). A
          sprint starting exactly on an existing sprint's end_date (2026-05-18) is ACCEPTED because
          the intervals only touch; a sprint starting one day earlier (2026-05-17) is REJECTED.
        test_recipe:
          setup:
            - "T&M Engagement ACTIVE with exactly one PLANNED sprint spanning [2026-05-04, 2026-05-18)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Dunder Mifflin", billing_email: "ap@dundermifflin.test", country_code: "US" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "Paper Ordering Portal", source_channel: "INBOUND" }
              as: AccountManager
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/qualify"
              payload: { outcome: "QUALIFY" }
              as: AccountManager
            - call: "POST /engagements/${eng_id}/sow"
              payload: { billing_model: "TIME_AND_MATERIALS", contract_value: 100000.00, budget_hours_cap: 500, standard_hourly_rate: 200.00, start_date: "2026-05-01", end_date: "2026-08-31" }
              as: AccountManager
            - call: "POST /engagements/${eng_id}/sign"
              payload: { signed_by_name: "Oz Client" }
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /sprints"
              payload: { engagement_id: "${eng_id}", name: "Sprint 1", start_date: "2026-05-04", end_date: "2026-05-18" }
              as: DeliveryLead
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /sprints"
              payload: { engagement_id: "${eng_id}", name: "Sprint 2", start_date: "2026-05-18", end_date: "2026-06-01" }
              as: DeliveryLead
              captures: { s2_id: $.data.id }
            - call: "POST /sprints"
              payload: { engagement_id: "${eng_id}", name: "Sprint 3", start_date: "2026-05-17", end_date: "2026-05-31" }
              as: DeliveryLead
              captures: { err: $.data.error_id }
          assert:
            - "First trigger call: HTTP 201 — adjacency at the exclusive end_date is NOT an overlap"
            - "Sprint.${s2_id}.status == PLANNED"
            - "Second trigger call: HTTP 409 with error_id == ERR_SPRINT_OVERLAP   (2026-05-17 < 2026-05-18)"
            - "GET /sprints?engagement_id=${eng_id} returns exactly 2 sprints"

      - name: retainer_closed_interval_with_cooldown_buffer_conflict_rejected
        grounds:
          - validations[priority=62]
          - errors[ERR_RETAINER_WINDOW_CONFLICT]
          - entities.RetainerContract.fields.start_date
          - entities.RetainerContract.fields.end_date
        distinguishing_aspect: |
          Resource = Client's retainer calendar (a different resource entity from Sprint), interval
          semantics = CLOSED [start, end] PLUS a 7-day cooldown buffer. Against an existing retainer
          ending 2026-07-31, a new one starting 2026-08-05 is REJECTED (inside the buffer that runs
          through 2026-08-07) while 2026-08-08 is ACCEPTED — adjacency alone is not enough here,
          unlike the sprint rule.
        test_recipe:
          setup:
            - "Client with a signed FIXED engagement and one existing GOLD retainer covering [2026-05-01, 2026-07-31]."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Bluth Company", billing_email: "ap@bluth.test", country_code: "US" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "Banana Stand POS", source_channel: "REFERRAL" }
              as: AccountManager
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/qualify"
              payload: { outcome: "QUALIFY" }
              as: AccountManager
            - call: "POST /engagements/${eng_id}/sow"
              payload: { billing_model: "FIXED", contract_value: 50000.00, budget_hours_cap: 200, standard_hourly_rate: 200.00, start_date: "2026-05-01", end_date: "2026-08-31" }
              as: AccountManager
            - call: "POST /engagements/${eng_id}/sign"
              payload: { signed_by_name: "Pat Client" }
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /retainers"
              payload: { client_id: "${client_id}", engagement_id: "${eng_id}", start_date: "2026-05-01", end_date: "2026-07-31", monthly_fee: 4000.00, included_hours: 10, sla_tier: "GOLD" }
              as: AccountManager
              captures: { r1_id: $.data.id }
          trigger:
            - call: "POST /retainers"
              payload: { client_id: "${client_id}", engagement_id: "${eng_id}", start_date: "2026-08-05", end_date: "2026-10-31", monthly_fee: 4000.00, included_hours: 10, sla_tier: "SILVER" }
              as: AccountManager
              captures: { err: $.data.error_id }
            - call: "POST /retainers"
              payload: { client_id: "${client_id}", engagement_id: "${eng_id}", start_date: "2026-08-08", end_date: "2026-10-31", monthly_fee: 4000.00, included_hours: 10, sla_tier: "SILVER" }
              as: AccountManager
              captures: { r2_id: $.data.id }
          assert:
            - "First trigger call: HTTP 409 with error_id == ERR_RETAINER_WINDOW_CONFLICT   (2026-08-05 <= 2026-07-31 + 7 days = 2026-08-07)"
            - "Second trigger call: HTTP 201   (2026-08-08 > 2026-08-07, the buffer has elapsed)"
            - "RetainerContract.${r2_id}.sla_tier == SILVER"
            - "GET /retainers?client_id=${client_id} returns exactly 2 retainers"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: time_entry_reverse_restores_hours_ledger_with_zero_drift
        grounds:
          - state_machines.TimeEntry.APPROVED_to_REVERSED
          - calculations.hours_ledger_invariant
          - entities.Ticket.fields.actual_hours
          - entities.Sprint.fields.spend_frozen
        distinguishing_aspect: |
          Conserved quantity = HOURS (Engagement.approved_hours == sum of APPROVED billable
          TimeEntry.hours). Approving 9.0h drives the engagement to AT_RISK and freezes the sprint;
          reversing that same entry must return approved_hours, burned_cost, burn_ratio, posture,
          Ticket.actual_hours AND Sprint.spend_frozen to their exact pre-approval values.
        test_recipe:
          setup:
            - "T&M Engagement ACTIVE, contract_value 2000.00, budget_hours_cap 10, rate 200.00."
            - "One ACTIVE sprint, ticket t1 (estimated_hours 8) IN_PROGRESS."
            - "One APPROVED billable TimeEntry of 9.0h -> burn_ratio 0.9, posture AT_RISK, sprint spend_frozen true."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Oceanic", billing_email: "ap@oceanic.test", country_code: "US" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "Oceanic Booking", source_channel: "PARTNER" }
              as: AccountManager
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/qualify"
              payload: { outcome: "QUALIFY" }
              as: AccountManager
            - call: "POST /engagements/${eng_id}/sow"
              payload: { billing_model: "TIME_AND_MATERIALS", contract_value: 2000.00, budget_hours_cap: 10, standard_hourly_rate: 200.00, start_date: "2026-05-01", end_date: "2026-08-31" }
              as: AccountManager
            - call: "POST /engagements/${eng_id}/sign"
              payload: { signed_by_name: "Quinn Client" }
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /sprints"
              payload: { engagement_id: "${eng_id}", name: "Sprint 1", start_date: "2026-05-04", end_date: "2026-05-18" }
              as: DeliveryLead
              captures: { sprint_id: $.data.id }
            - call: "POST /sprints/${sprint_id}/transition"
              payload: { target_status: "ACTIVE" }
              as: DeliveryLead
            - call: "POST /tickets"
              payload: { sprint_id: "${sprint_id}", title: "Seat map", estimated_hours: 8, assignee_user_id: "eng-001" }
              as: DeliveryLead
              captures: { t1_id: $.data.id }
            - call: "POST /tickets/${t1_id}/transition"
              payload: { target_status: "IN_PROGRESS" }
              as: Engineer
              as_user_id: "eng-001"
            - call: "POST /time-entries"
              payload: { ticket_id: "${t1_id}", work_date: "2026-05-05", hours: 9.0 }
              as: Engineer
              as_user_id: "eng-001"
              captures: { te_id: $.data.id }
            - call: "POST /time-entries/${te_id}/review"
              payload: { decision: "APPROVE" }
              as: DeliveryLead
              as_user_id: "pm-001"
          trigger:
            - call: "POST /time-entries/${te_id}/reverse"
              payload: { reason: "Logged against the wrong ticket" }
              as: DeliveryLead
              as_user_id: "pm-001"
          assert:
            - "TimeEntry.${te_id}.status == REVERSED"
            - "Ticket.${t1_id}.actual_hours == 0"
            - "Ticket.${t1_id}.variance_ratio == 0.0"
            - "Engagement.${eng_id}.approved_hours == 0"
            - "Engagement.${eng_id}.burned_cost == 0.00"
            - "Engagement.${eng_id}.burn_ratio == 0.0"
            - "Engagement.${eng_id}.budget_posture == HEALTHY"
            - "Sprint.${sprint_id}.spend_frozen == false"
            - "Engagement.${eng_id}.approved_hours == sum(TimeEntry.hours where status == APPROVED) == 0 (hours_ledger_invariant holds with zero drift)"

      - name: invoice_void_restores_money_ledger_and_milestone_status_with_zero_drift
        grounds:
          - state_machines.Invoice.ISSUED_to_VOID
          - state_machines.Milestone.BILLED_to_COMPLETED
          - calculations.money_ledger_invariant
          - entities.Engagement.fields.invoiced_amount
          - entities.Engagement.fields.billing_status
        distinguishing_aspect: |
          Conserved quantity = INVOICED CURRENCY (Engagement.invoiced_amount == sum of
          Invoice.subtotal where status IN {ISSUED, PAID}) — a different conserved quantity from the
          hours ledger. Issuing the 5000.00 milestone invoice takes invoiced_amount to 5000.00,
          billing_status to PARTIALLY_BILLED and the milestone to BILLED; voiding it must return all
          three to 0.00 / UNBILLED / COMPLETED.
        test_recipe:
          setup:
            - "FIXED Engagement ACTIVE, contract_value 50000.00; Milestone M1 (amount 5000.00) COMPLETED via an accepted release."
            - "The cascade-created DRAFT MILESTONE invoice for M1 has been ISSUED: invoiced_amount 5000.00, billing_status PARTIALLY_BILLED, milestone BILLED."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Gekko Capital", billing_email: "ap@gekko.test", country_code: "US" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "Gekko Trading UI", source_channel: "OUTBOUND" }
              as: AccountManager
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/qualify"
              payload: { outcome: "QUALIFY" }
              as: AccountManager
            - call: "POST /engagements/${eng_id}/sow"
              payload: { billing_model: "FIXED", contract_value: 50000.00, budget_hours_cap: 200, standard_hourly_rate: 200.00, start_date: "2026-05-01", end_date: "2026-08-31" }
              as: AccountManager
            - call: "POST /engagements/${eng_id}/sign"
              payload: { signed_by_name: "Rae Client" }
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /milestones"
              payload: { engagement_id: "${eng_id}", sequence: 1, title: "Phase 1 - Design", amount: 5000.00, due_date: "2026-06-01" }
              as: DeliveryLead
              captures: { m1_id: $.data.id }
            - call: "POST /releases"
              payload: { engagement_id: "${eng_id}", milestone_id: "${m1_id}", version_label: "v1.0.0" }
              as: Engineer
              as_user_id: "eng-001"
              captures: { rel_id: $.data.id }
            - call: "POST /releases/${rel_id}/qa-result"
              payload: { outcome: "PASS", defect_count: 0 }
              as: Engineer
              as_user_id: "eng-002"
            - call: "POST /releases/${rel_id}/acceptance"
              payload: { action: "ACCEPT" }
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "GET /invoices"
              payload: { milestone_id: "${m1_id}" }
              as: FinanceOfficer
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: FinanceOfficer
          trigger:
            - call: "POST /invoices/${inv_id}/void"
              payload: { reason: "Client disputed the scope of Phase 1" }
              as: FinanceOfficer
          assert:
            - "Invoice.${inv_id}.status == VOID"
            - "Milestone.${m1_id}.status == COMPLETED   (reverted from BILLED)"
            - "Engagement.${eng_id}.invoiced_amount == 0.00"
            - "Engagement.${eng_id}.billing_status == UNBILLED"
            - "Engagement.${eng_id}.invoiced_amount == sum(Invoice.subtotal where status IN {ISSUED, PAID}) == 0.00 (money_ledger_invariant holds with zero drift)"
            - "Release.${rel_id}.status == ACCEPTED   (voiding the invoice does NOT un-accept the release)"
