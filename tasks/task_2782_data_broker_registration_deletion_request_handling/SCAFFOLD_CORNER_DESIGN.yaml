  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_broker_version_on_registration_create_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.registration-create-stale-broker
          - validations.priority_16.ERR_STALE_BROKER_VERSION
        distinguishing_aspect: >
          A fee deposit moves DataBroker.version from 1 to 2, so a filing that still presents
          expected_broker_version 1 must return ERR_STALE_BROKER_VERSION at HTTP 412 and create
          nothing; re-presenting version 2 creates the filing and leaves the broker at version 2,
          because the create reads rather than writes the broker.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z and one DataBroker operating in CA, created at version 1 and then moved to version 2 by a 500000-cent fee deposit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brokers"
              payload: { legal_name: "Silverleaf Data Exchange", primary_contact_email: "compliance@silverleaf.example", home_state_code: "CA", operating_state_codes: ["CA"], business_description: "Resells licensed automotive and household ownership attributes to lead generators." }
              as: PlatformAdmin
              captures: { broker_id: $.data.id, broker_v1: $.data.version }
            - call: "POST /brokers/${broker_id}/fee-deposits"
              payload: { amount_cents: 500000 }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
              captures: { broker_v2: $.data.version }
          trigger:
            - call: "POST /registrations"
              payload: { broker_id: "${broker_id}", state_code: "CA", coverage_period_start: "2026-09-01T00:00:00Z", coverage_period_end: "2027-03-01T00:00:00Z", business_description: "California registry filing for the automotive and household attribute resale business.", expected_broker_version: "${broker_v1}" }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
              expect_error: { error_id: ERR_STALE_BROKER_VERSION, http_status: 412 }
            - call: "POST /registrations"
              payload: { broker_id: "${broker_id}", state_code: "CA", coverage_period_start: "2026-09-01T00:00:00Z", coverage_period_end: "2027-03-01T00:00:00Z", business_description: "California registry filing for the automotive and household attribute resale business.", expected_broker_version: "${broker_v2}" }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
              captures: { reg_id: $.data.id }
          assert:
            - "${broker_v1} == 1 and ${broker_v2} == 2"
            - "the stale attempt carries data.error_id == ERR_STALE_BROKER_VERSION with HTTP 412"
            - "after the stale attempt, GET /registrations?broker_id=${broker_id} reports total_count == 0"
            - "the fresh attempt returns HTTP 201 with Registration.${reg_id}.status == DRAFT"
            - "Registration.${reg_id}.disclosure_completeness_score == 0.00"
            - "Registration.${reg_id}.version == 1"
            - "DataBroker.${broker_id}.version == 2"

      - name: stale_consumer_version_on_deletion_request_create_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.deletion-request-create-stale-consumer
          - validations.priority_17.ERR_STALE_CONSUMER_VERSION
        distinguishing_aspect: >
          A recorded collection event moves Consumer.version from 1 to 2, so a request presenting
          expected_consumer_version 1 must return ERR_STALE_CONSUMER_VERSION at HTTP 412 with no
