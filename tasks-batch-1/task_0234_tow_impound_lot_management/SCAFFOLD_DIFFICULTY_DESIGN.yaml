# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# 9 Difficulty Rules (§0.5) x 2 instances = 18 instances.
# Lot config used throughout (unless a recipe overrides):
#   daily_storage_rate_cents=5000, admin_fee_cents=7500,
#   lien_processing_fee_cents=3000, statutory_hold_days=30, notice_grace_days=10
# All formula-derived asserts are precomputed literals (contract item 7).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: storage_estimate_vs_accrued_diverge
        grounds:
          - calculations.storage_fee_accrual
          - entities.TowOrder.fields.estimated_storage_cents
          - entities.TowOrder.fields.accrued_storage_cents
        distinguishing_aspect: |
          ESTIMATE (daily_rate*statutory_hold_days, fixed at intake) and ACCRUED
          (chronological day-count to freeze) produce different cents on the SAME
          TowOrder when stored days != statutory_hold_days: 150000 vs 25000.
        test_recipe:
          setup:
            - "Lot with daily=5000, statutory_hold_days=30; clock 2026-01-01T00:00:00Z; order intaken and STORED at intake; clock advanced to 2026-01-06T00:00:00Z (exactly 5 days)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LotOperator
            - call: "POST /impound-lots"
              payload: { name: "Lot A", jurisdiction_code: "CA", daily_storage_rate_cents: 5000, admin_fee_cents: 7500, lien_processing_fee_cents: 3000, statutory_hold_days: 30, notice_grace_days: 10 }
              as: LotOperator
              captures: { lot_id: $.data.id }
            - call: "POST /tow-orders"
              payload: { lot_id: "${lot_id}", tow_type: "POLICE", vin: "VIN1", plate: "P1", owner_name: "O1", owner_address: "Addr1" }
              as: LotOperator
              captures: { order_id: $.data.id, est: $.data.estimated_storage_cents }
            - call: "POST /tow-orders/${order_id}/inventory-items"
              payload: { category: "EXTERIOR_PHOTO", description: "front", photo_ref: "ref1" }
              as: LotOperator
            - call: "POST /tow-orders/${order_id}/store"
              payload: {}
              as: LotOperator
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-06T00:00:00Z" }
              as: LotOperator
          trigger:
            - call: "GET /tow-orders/${order_id}"
              payload: {}
              as: LotOperator
              captures: { est2: $.data.estimated_storage_cents, accrued: $.data.accrued_storage_cents }
          assert:
            - "TowOrder.${order_id}.estimated_storage_cents == 150000"
            - "TowOrder.${order_id}.accrued_storage_cents == 25000"
            - "TowOrder.${order_id}.estimated_storage_cents != TowOrder.${order_id}.accrued_storage_cents"

      - name: provider_standing_raw_vs_trailing_diverge
        grounds:
          - calculations.provider_standing
          - entities.TowProvider.fields.raw_standing_pct
          - entities.TowProvider.fields.effective_standing_pct
        distinguishing_aspect: |
          On the TowProvider entity (different domain from storage cost), RAW
          all-time standing (1/3 -> 33.33) and EFFECTIVE trailing-window standing
          (last 2 offers, 0 accepted -> 0.00) diverge for identical history.
        test_recipe:
          setup:
            - "Single provider P, trailing_window_size=2, on a lot with max_provider_concurrent_offers=5. Three dispatches each bump P's received count; P ACCEPTS only the first; offers #2 and #3 stay OFFERED. All-time 1/3 -> raw 33.33; trailing last-2 (both unaccepted) -> effective 0.00."
          setup_api_calls:
            - call: "POST /impound-lots"
              payload: { name: "Lot B", jurisdiction_code: "CA", daily_storage_rate_cents: 5000, admin_fee_cents: 7500, lien_processing_fee_cents: 3000, statutory_hold_days: 30, notice_grace_days: 10, max_provider_concurrent_offers: 5 }
              as: LotOperator
              captures: { lot_id: $.data.id, lot_v0: $.data.version }
            - call: "POST /tow-providers"
              payload: { company_name: "P", license_number: "L-P", rotation_rank: 1, trailing_window_size: 2 }
              as: LotOperator
              captures: { p_id: $.data.id }
            - call: "POST /impound-lots/${lot_id}/dispatch-rotation"
              payload: { expected_lot_version: "${lot_v0}" }
              as: LotOperator
              captures: { ra1: $.data.id }
            - call: "POST /rotation-assignments/${ra1}/accept"
              payload: {}
              as: TowProvider
              as_user_id: "${p_id}"
            - call: "GET /impound-lots/${lot_id}"
              payload: {}
              as: LotOperator
              captures: { lot_v1: "$.data.version" }
            - call: "POST /impound-lots/${lot_id}/dispatch-rotation"
              payload: { expected_lot_version: "${lot_v1}" }
              as: LotOperator
              captures: { ra2: $.data.id }
            - call: "GET /impound-lots/${lot_id}"
              payload: {}
              as: LotOperator
              captures: { lot_v2: "$.data.version" }
            - call: "POST /impound-lots/${lot_id}/dispatch-rotation"
              payload: { expected_lot_version: "${lot_v2}" }
              as: LotOperator
              captures: { ra3: $.data.id }
          trigger:
            - call: "GET /tow-providers/${p_id}"
              payload: {}
              as: LotOperator
              captures: { raw: $.data.raw_standing_pct, eff: $.data.effective_standing_pct }
          assert:
            - "TowProvider.${p_id}.raw_standing_pct == 33.33"
            - "TowProvider.${p_id}.effective_standing_pct == 0.00"
            - "TowProvider.${p_id}.raw_standing_pct != TowProvider.${p_id}.effective_standing_pct"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: release_fee_per_component_round_then_sum
        grounds:
          - calculations.release_fee_breakdown
          - entities.TowOrder.fields.balance_due_cents
          - entities.ImpoundLot.fields.lien_processing_fee_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: balance is computed by rounding each component
          (storage, admin, lien) to whole cents independently THEN summing
          (pinned order). 5-day lien order: 25000 + 7500 + 3000 = 35500.
        test_recipe:
          setup:
            - "Lot (daily=5000, admin=7500, lien=3000); order WITH lienholder; stored at intake; clock +5 days; lien component included because lienholder_id set."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: LotOperator
            - call: "POST /impound-lots"
              payload: { name: "Lot C", jurisdiction_code: "CA", daily_storage_rate_cents: 5000, admin_fee_cents: 7500, lien_processing_fee_cents: 3000, statutory_hold_days: 30, notice_grace_days: 10 }
              as: LotOperator
              captures: { lot_id: $.data.id }
            - call: "POST /lienholders"
              payload: { name: "Bank", mailing_address: "1 Bank St", state_code: "CA" }
              as: LotOperator
              captures: { lh_id: $.data.id }
            - call: "POST /tow-orders"
              payload: { lot_id: "${lot_id}", tow_type: "PRIVATE", vin: "VIN2", plate: "P2", owner_name: "O2", owner_address: "Addr2", lienholder_id: "${lh_id}" }
              as: LotOperator
              captures: { order_id: $.data.id }
            - call: "POST /tow-orders/${order_id}/inventory-items"
              payload: { category: "EXTERIOR_PHOTO", description: "rear", photo_ref: "ref2" }
              as: LotOperator
            - call: "POST /tow-orders/${order_id}/store"
              payload: {}
              as: LotOperator
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-06T00:00:00Z" }
              as: LotOperator
          trigger:
            - call: "GET /tow-orders/${order_id}"
              payload: {}
              as: LotOperator
              captures: { bal: $.data.balance_due_cents }
          assert:
            - "TowOrder.${order_id}.accrued_storage_cents == 25000"
            - "TowOrder.${order_id}.balance_due_cents == 35500"

      - name: waiver_credit_tier_keyed_on_pre_waiver_balance
        grounds:
          - calculations.waiver_credit
          - entities.FeeWaiver.fields.approved_amount_cents
          - entities.TowOrder.fields.net_due_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the waiver cap percentage is keyed
          on the PRE-waiver balance tier (pinned order), not the post-waiver value.
          Pre-waiver 110500 (tier2, 50%) -> cap 55250; request 80000 -> approved
          55250; net_due 110500-55250 = 55250.
        test_recipe:
          setup:
            - "Lot order with lien, stored 20 days -> balance 110500 (tier2). Claimant files waiver requested 80000; operator reviews and approves with a DIFFERENT user id (segregation ok)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: LotOperator
            - call: "POST /impound-lots"
              payload: { name: "Lot D", jurisdiction_code: "CA", daily_storage_rate_cents: 5000, admin_fee_cents: 7500, lien_processing_fee_cents: 3000, statutory_hold_days: 30, notice_grace_days: 10 }
              as: LotOperator
              captures: { lot_id: $.data.id }
            - call: "POST /lienholders"
              payload: { name: "Bank2", mailing_address: "2 Bank St", state_code: "CA" }
              as: LotOperator
              captures: { lh_id: $.data.id }
            - call: "POST /tow-orders"
              payload: { lot_id: "${lot_id}", tow_type: "PRIVATE", vin: "VIN3", plate: "P3", owner_name: "O3", owner_address: "Addr3", lienholder_id: "${lh_id}" }
              as: LotOperator
              captures: { order_id: $.data.id }
            - call: "POST /tow-orders/${order_id}/inventory-items"
              payload: { category: "EXTERIOR_PHOTO", description: "side", photo_ref: "ref3" }
              as: LotOperator
            - call: "POST /tow-orders/${order_id}/store"
              payload: {}
              as: LotOperator
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-03-21T00:00:00Z" }
              as: LotOperator
            - call: "POST /tow-orders/${order_id}/fee-waivers"
              payload: { reason: "BILLING_DISPUTE", requested_amount_cents: 80000 }
              as: Claimant
              as_user_id: "claimant-1"
              captures: { wid: $.data.id }
            - call: "POST /tow-orders/${order_id}/fee-waivers/${wid}/start-review"
              payload: {}
              as: LotOperator
          trigger:
            - call: "POST /tow-orders/${order_id}/fee-waivers/${wid}/approve"
              payload: {}
              as: LotOperator
              as_user_id: "operator-9"
              captures: { approved: $.data.approved_amount_cents }
          assert:
            - "FeeWaiver.${wid}.approved_amount_cents == 55250"
            - "TowOrder.${order_id}.net_due_cents == 55250"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: tow_order_cyclic_auction_eligible_back_to_stored
        grounds:
          - state_machines.TowOrder.AUCTION_ELIGIBLE_to_STORED
          - state_machines.TowOrder.STORED_to_AUCTION_ELIGIBLE
        distinguishing_aspect: |
          TowOrder lifecycle is cyclic: STORED -> AUCTION_ELIGIBLE -> STORED
          (reclaim) re-enters a prior state, proving non-linear shape on TowOrder.
        test_recipe:
          setup:
            - "Order STORED, statutory period + notice grace elapsed, marked AUCTION_ELIGIBLE, then reclaimed back to STORED before any auction sweep."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: LotOperator
            - call: "POST /impound-lots"
              payload: { name: "Lot E", jurisdiction_code: "CA", daily_storage_rate_cents: 5000, admin_fee_cents: 7500, lien_processing_fee_cents: 3000, statutory_hold_days: 30, notice_grace_days: 10 }
              as: LotOperator
              captures: { lot_id: $.data.id }
            - call: "POST /tow-orders"
              payload: { lot_id: "${lot_id}", tow_type: "ABANDONED", vin: "VIN4", plate: "P4", owner_name: "O4", owner_address: "Addr4" }
              as: LotOperator
              captures: { order_id: $.data.id }
            - call: "POST /tow-orders/${order_id}/inventory-items"
              payload: { category: "EXTERIOR_PHOTO", description: "vin plate", photo_ref: "ref4" }
              as: LotOperator
            - call: "POST /tow-orders/${order_id}/store"
              payload: {}
              as: LotOperator
            - call: "POST /tow-orders/${order_id}/notifications"
              payload: { recipient_type: "OWNER", method: "CERTIFIED_MAIL" }
              as: LotOperator
              captures: { nid: $.data.id }
            - call: "POST /tow-orders/${order_id}/notifications/${nid}/send"
              payload: {}
              as: LotOperator
            - call: "POST /tow-orders/${order_id}/notifications/${nid}/confirm-delivery"
              payload: {}
              as: LotOperator
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: LotOperator
            - call: "POST /tow-orders/${order_id}/mark-auction-eligible"
              payload: {}
              as: LotOperator
          trigger:
            - call: "POST /tow-orders/${order_id}/reclaim"
              payload: {}
              as: LotOperator
              captures: { st: $.data.status }
          assert:
            - "TowOrder.${order_id}.status == STORED"
            - "TowOrder.${order_id}.accrual_frozen_at == null"

      - name: notification_branching_sent_to_three_terminals
        grounds:
          - state_machines.Notification.SENT_to_DELIVERY_CONFIRMED
          - state_machines.Notification.SENT_to_CERTIFIED_RETURNED
          - state_machines.Notification.SENT_to_UNDELIVERABLE
        distinguishing_aspect: |
          On the Notification entity (different from TowOrder), SENT forks to
          three distinct branches with divergent side-effects; here the
          UNDELIVERABLE branch does NOT start the grace clock (resolved but
          statutory eligibility unaffected), unlike DELIVERY_CONFIRMED.
        test_recipe:
          setup:
            - "Order STORED with one notice SENT then marked UNDELIVERABLE; statutory hold days elapsed but no delivered notice -> mark-auction-eligible must fail."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: LotOperator
            - call: "POST /impound-lots"
              payload: { name: "Lot F", jurisdiction_code: "CA", daily_storage_rate_cents: 5000, admin_fee_cents: 7500, lien_processing_fee_cents: 3000, statutory_hold_days: 30, notice_grace_days: 10 }
              as: LotOperator
              captures: { lot_id: $.data.id }
            - call: "POST /tow-orders"
              payload: { lot_id: "${lot_id}", tow_type: "ABANDONED", vin: "VIN5", plate: "P5", owner_name: "O5", owner_address: "Addr5" }
              as: LotOperator
              captures: { order_id: $.data.id }
            - call: "POST /tow-orders/${order_id}/inventory-items"
              payload: { category: "EXTERIOR_PHOTO", description: "doc", photo_ref: "ref5" }
              as: LotOperator
            - call: "POST /tow-orders/${order_id}/store"
              payload: {}
              as: LotOperator
            - call: "POST /tow-orders/${order_id}/notifications"
              payload: { recipient_type: "OWNER", method: "CERTIFIED_MAIL" }
              as: LotOperator
              captures: { nid: $.data.id }
            - call: "POST /tow-orders/${order_id}/notifications/${nid}/send"
              payload: {}
              as: LotOperator
            - call: "POST /tow-orders/${order_id}/notifications/${nid}/mark-undeliverable"
              payload: {}
              as: LotOperator
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: LotOperator
          trigger:
            - call: "POST /tow-orders/${order_id}/mark-auction-eligible"
              payload: {}
              as: LotOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_STATUTORY_PERIOD_NOT_ELAPSED"
            - "Notification.${nid}.status == UNDELIVERABLE"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: confirm_delivery_cascades_to_statutory_eligibility
        grounds:
          - state_machines.Notification.SENT_to_DELIVERY_CONFIRMED
          - calculations.statutory_eligibility
          - state_machines.TowOrder.STORED_to_AUCTION_ELIGIBLE
        distinguishing_aspect: |
          Depth-3 chain from one trigger (confirm-delivery): (1) Notification ->
          DELIVERY_CONFIRMED sets resolved_at; (2) that mutation flips TowOrder
          statutory_eligibility true once grace elapses; (3) which unblocks
          TowOrder STORED -> AUCTION_ELIGIBLE. Each hop is caused by the prior.
        test_recipe:
          setup:
            - "Order STORED, statutory_hold_days elapsed; notice SENT; confirm delivery, then advance past notice grace; mark-auction-eligible now succeeds."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LotOperator
            - call: "POST /impound-lots"
              payload: { name: "Lot G", jurisdiction_code: "CA", daily_storage_rate_cents: 5000, admin_fee_cents: 7500, lien_processing_fee_cents: 3000, statutory_hold_days: 30, notice_grace_days: 10 }
              as: LotOperator
              captures: { lot_id: $.data.id }
            - call: "POST /tow-orders"
              payload: { lot_id: "${lot_id}", tow_type: "ABANDONED", vin: "VIN6", plate: "P6", owner_name: "O6", owner_address: "Addr6" }
              as: LotOperator
              captures: { order_id: $.data.id }
            - call: "POST /tow-orders/${order_id}/inventory-items"
              payload: { category: "EXTERIOR_PHOTO", description: "doc6", photo_ref: "ref6" }
              as: LotOperator
            - call: "POST /tow-orders/${order_id}/store"
              payload: {}
              as: LotOperator
            - call: "POST /tow-orders/${order_id}/notifications"
              payload: { recipient_type: "OWNER", method: "CERTIFIED_MAIL" }
              as: LotOperator
              captures: { nid: $.data.id }
            - call: "POST /tow-orders/${order_id}/notifications/${nid}/send"
              payload: {}
              as: LotOperator
            - call: "POST /tow-orders/${order_id}/notifications/${nid}/confirm-delivery"
              payload: {}
              as: LotOperator
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: LotOperator
          trigger:
            - call: "POST /tow-orders/${order_id}/mark-auction-eligible"
              payload: {}
              as: LotOperator
              captures: { st: $.data.status }
          assert:
            - "TowOrder.${order_id}.status == AUCTION_ELIGIBLE"
            - "Notification.${nid}.status == DELIVERY_CONFIRMED"

      - name: decline_cascades_reoffer_and_counter_bump
        grounds:
          - state_machines.RotationAssignment.OFFERED_to_DECLINED
          - calculations.rotation_selection
          - entities.TowProvider.fields.offers_received_count
        distinguishing_aspect: |
          Depth-3 chain from a DIFFERENT trigger (decline): (1) RotationAssignment
          -> DECLINED; (2) that mutation dispatches a new OFFERED assignment to the
          next provider; (3) which bumps that next provider's offers_received_count.
        test_recipe:
          setup:
            - "Lot with two ACTIVE providers (rank 1, rank 2). Dispatch offers rank-1; rank-1 declines; server re-offers to rank-2 and bumps rank-2 received count to 1."
          setup_api_calls:
            - call: "POST /impound-lots"
              payload: { name: "Lot H", jurisdiction_code: "CA", daily_storage_rate_cents: 5000, admin_fee_cents: 7500, lien_processing_fee_cents: 3000, statutory_hold_days: 30, notice_grace_days: 10, max_provider_concurrent_offers: 5 }
              as: LotOperator
              captures: { lot_id: $.data.id, lot_v0: $.data.version }
            - call: "POST /tow-providers"
              payload: { company_name: "P1", license_number: "L1", rotation_rank: 1 }
              as: LotOperator
              captures: { p1_id: $.data.id }
            - call: "POST /tow-providers"
              payload: { company_name: "P2", license_number: "L2", rotation_rank: 2 }
              as: LotOperator
              captures: { p2_id: $.data.id }
            - call: "POST /impound-lots/${lot_id}/dispatch-rotation"
              payload: { expected_lot_version: "${lot_v0}" }
              as: LotOperator
              captures: { ra1: $.data.id, ra1_provider: $.data.provider_id }
          trigger:
            - call: "POST /rotation-assignments/${ra1}/decline"
              payload: {}
              as: TowProvider
              as_user_id: "${p1_id}"
              captures: { superseded_by: $.data.superseded_by_id }
          assert:
            - "RotationAssignment.${ra1}.status == DECLINED"
            - "RotationAssignment.${ra1}.superseded_by_id != null"
            - "TowProvider.${p2_id}.offers_received_count == 1"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: hold_active_beats_balance_unpaid_on_authorize_release
        grounds:
          - validations[priority=8]
          - validations[priority=12]
        distinguishing_aspect: |
          Error-category pair business_safety (priority 8 ERR_HOLD_ACTIVE) vs
          business_fiscal (priority 12 ERR_BALANCE_UNPAID): an order with BOTH an
          active police hold AND an unpaid balance returns ERR_HOLD_ACTIVE (lower
          priority number wins).
        test_recipe:
          setup:
            - "Order STORED, balance unpaid AND a POLICE_HOLD placed; authorize-release violates both rules."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LotOperator
            - call: "POST /impound-lots"
              payload: { name: "Lot I", jurisdiction_code: "CA", daily_storage_rate_cents: 5000, admin_fee_cents: 7500, lien_processing_fee_cents: 3000, statutory_hold_days: 30, notice_grace_days: 10 }
              as: LotOperator
              captures: { lot_id: $.data.id }
            - call: "POST /tow-orders"
              payload: { lot_id: "${lot_id}", tow_type: "POLICE", vin: "VIN7", plate: "P7", owner_name: "O7", owner_address: "Addr7" }
              as: LotOperator
              captures: { order_id: $.data.id }
            - call: "POST /tow-orders/${order_id}/inventory-items"
              payload: { category: "EXTERIOR_PHOTO", description: "doc7", photo_ref: "ref7" }
              as: LotOperator
            - call: "POST /tow-orders/${order_id}/store"
              payload: {}
              as: LotOperator
            - call: "POST /tow-orders/${order_id}/place-hold"
              payload: { hold_status: "POLICE_HOLD" }
              as: PoliceOfficer
          trigger:
            - call: "POST /tow-orders/${order_id}/authorize-release"
              payload: {}
              as: LotOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_HOLD_ACTIVE"

      - name: invalid_state_beats_waiver_pending_on_authorize_release
        grounds:
          - validations[priority=6]
          - validations[priority=11]
        distinguishing_aspect: |
          Error-category pair state (priority 6 ERR_INVALID_STATE) vs
          business_constraint (priority 11 ERR_WAIVER_PENDING): a TOWED (not yet
          STORED) order with a pending waiver returns ERR_INVALID_STATE, since the
          state precondition is checked before the waiver-pending business rule.
        test_recipe:
          setup:
            - "Order still TOWED (never stored) but a Claimant has filed a REQUESTED fee waiver; authorize-release violates state (not STORED) and waiver-pending."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: LotOperator
            - call: "POST /impound-lots"
              payload: { name: "Lot J", jurisdiction_code: "CA", daily_storage_rate_cents: 5000, admin_fee_cents: 7500, lien_processing_fee_cents: 3000, statutory_hold_days: 30, notice_grace_days: 10 }
              as: LotOperator
              captures: { lot_id: $.data.id }
            - call: "POST /tow-orders"
              payload: { lot_id: "${lot_id}", tow_type: "POLICE", vin: "VIN8", plate: "P8", owner_name: "O8", owner_address: "Addr8" }
              as: LotOperator
              captures: { order_id: $.data.id }
            - call: "POST /tow-orders/${order_id}/fee-waivers"
              payload: { reason: "WRONGFUL_TOW", requested_amount_cents: 1000 }
              as: Claimant
              as_user_id: "claimant-2"
              captures: { wid: $.data.id }
          trigger:
            - call: "POST /tow-orders/${order_id}/authorize-release"
              payload: {}
              as: LotOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: storage_day_boundary_exactly_24h_counts_one_day
        grounds:
          - calculations.storage_fee_accrual
          - entities.TowOrder.fields.accrued_days
        distinguishing_aspect: |
          Numeric day-count boundary on accrued_days via GET /tow-orders/{id}:
          exactly 24.0 hours stored counts as 1 day (ceil(24/24)=1), not 2.
        test_recipe:
          setup:
            - "Order stored at 2026-09-01T00:00:00Z; clock advanced to exactly 2026-09-02T00:00:00Z (24.0h)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: LotOperator
            - call: "POST /impound-lots"
              payload: { name: "Lot K", jurisdiction_code: "CA", daily_storage_rate_cents: 5000, admin_fee_cents: 7500, lien_processing_fee_cents: 3000, statutory_hold_days: 30, notice_grace_days: 10 }
              as: LotOperator
              captures: { lot_id: $.data.id }
            - call: "POST /tow-orders"
              payload: { lot_id: "${lot_id}", tow_type: "POLICE", vin: "VIN9", plate: "P9", owner_name: "O9", owner_address: "Addr9" }
              as: LotOperator
              captures: { order_id: $.data.id }
            - call: "POST /tow-orders/${order_id}/inventory-items"
              payload: { category: "EXTERIOR_PHOTO", description: "doc9", photo_ref: "ref9" }
              as: LotOperator
            - call: "POST /tow-orders/${order_id}/store"
              payload: {}
              as: LotOperator
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: LotOperator
          trigger:
            - call: "GET /tow-orders/${order_id}"
              payload: {}
              as: LotOperator
              captures: { days: $.data.accrued_days }
          assert:
            - "TowOrder.${order_id}.accrued_days == 1"
            - "TowOrder.${order_id}.accrued_storage_cents == 5000"

      - name: statutory_eligibility_empty_notification_set_blocks
        grounds:
          - calculations.statutory_eligibility
          - validations[priority=9]
        distinguishing_aspect: |
          Empty-set boundary on a different metric/endpoint
          (POST /mark-auction-eligible): even after the statutory hold days
          elapse, an order with ZERO delivered notices is ineligible
          (notice grace condition unsatisfiable over an empty notice set).
        test_recipe:
          setup:
            - "Order STORED, clock advanced well past statutory_hold_days, but NO notifications created at all."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: LotOperator
            - call: "POST /impound-lots"
              payload: { name: "Lot L", jurisdiction_code: "CA", daily_storage_rate_cents: 5000, admin_fee_cents: 7500, lien_processing_fee_cents: 3000, statutory_hold_days: 30, notice_grace_days: 10 }
              as: LotOperator
              captures: { lot_id: $.data.id }
            - call: "POST /tow-orders"
              payload: { lot_id: "${lot_id}", tow_type: "ABANDONED", vin: "VIN10", plate: "P10", owner_name: "O10", owner_address: "Addr10" }
              as: LotOperator
              captures: { order_id: $.data.id }
            - call: "POST /tow-orders/${order_id}/inventory-items"
              payload: { category: "EXTERIOR_PHOTO", description: "doc10", photo_ref: "ref10" }
              as: LotOperator
            - call: "POST /tow-orders/${order_id}/store"
              payload: {}
              as: LotOperator
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: LotOperator
          trigger:
            - call: "POST /tow-orders/${order_id}/mark-auction-eligible"
              payload: {}
              as: LotOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_STATUTORY_PERIOD_NOT_ELAPSED"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: authorize_release_blocked_by_pending_feewaiver
        grounds:
          - state_machines.TowOrder.STORED_to_RELEASE_AUTHORIZED
          - entities.FeeWaiver.fields.status
          - validations[priority=11]
        distinguishing_aspect: |
          Entity pair TowOrder <- FeeWaiver: a STORED order with a fully-paid
          balance still cannot move to RELEASE_AUTHORIZED while any FeeWaiver on
          it is REQUESTED/UNDER_REVIEW.
        test_recipe:
          setup:
            - "Order STORED 5 days, lien -> net_due 35500; Claimant pays 35500; Claimant also files a REQUESTED fee waiver; authorize-release blocked by pending waiver."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: LotOperator
            - call: "POST /impound-lots"
              payload: { name: "Lot M", jurisdiction_code: "CA", daily_storage_rate_cents: 5000, admin_fee_cents: 7500, lien_processing_fee_cents: 3000, statutory_hold_days: 30, notice_grace_days: 10 }
              as: LotOperator
              captures: { lot_id: $.data.id }
            - call: "POST /lienholders"
              payload: { name: "Bank3", mailing_address: "3 Bank St", state_code: "CA" }
              as: LotOperator
              captures: { lh_id: $.data.id }
            - call: "POST /tow-orders"
              payload: { lot_id: "${lot_id}", tow_type: "PRIVATE", vin: "VIN11", plate: "P11", owner_name: "O11", owner_address: "Addr11", lienholder_id: "${lh_id}" }
              as: LotOperator
              captures: { order_id: $.data.id }
            - call: "POST /tow-orders/${order_id}/inventory-items"
              payload: { category: "EXTERIOR_PHOTO", description: "doc11", photo_ref: "ref11" }
              as: LotOperator
            - call: "POST /tow-orders/${order_id}/store"
              payload: {}
              as: LotOperator
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-10-06T00:00:00Z" }
              as: LotOperator
            - call: "POST /tow-orders/${order_id}/payments"
              payload: { amount_cents: 35500 }
              as: Claimant
              as_user_id: "claimant-3"
            - call: "POST /tow-orders/${order_id}/fee-waivers"
              payload: { reason: "BILLING_DISPUTE", requested_amount_cents: 1000 }
              as: Claimant
              as_user_id: "claimant-3"
              captures: { wid: $.data.id }
          trigger:
            - call: "POST /tow-orders/${order_id}/authorize-release"
              payload: {}
              as: LotOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_WAIVER_PENDING"

      - name: rotation_accept_blocked_by_suspended_provider
        grounds:
          - state_machines.RotationAssignment.OFFERED_to_ACCEPTED
          - entities.TowProvider.fields.status
        distinguishing_aspect: |
          Different entity pair RotationAssignment <- TowProvider: an OFFERED
          assignment cannot move to ACCEPTED while the offered provider's status
          is SUSPENDED (ERR_PROVIDER_NOT_ACTIVE).
        test_recipe:
          setup:
            - "Provider offered a rotation call, then suspended before accepting; accept rejected."
          setup_api_calls:
            - call: "POST /impound-lots"
              payload: { name: "Lot N", jurisdiction_code: "CA", daily_storage_rate_cents: 5000, admin_fee_cents: 7500, lien_processing_fee_cents: 3000, statutory_hold_days: 30, notice_grace_days: 10, max_provider_concurrent_offers: 5 }
              as: LotOperator
              captures: { lot_id: $.data.id, lot_v0: $.data.version }
            - call: "POST /tow-providers"
              payload: { company_name: "PA", license_number: "LA", rotation_rank: 1 }
              as: LotOperator
              captures: { p_id: $.data.id }
            - call: "POST /impound-lots/${lot_id}/dispatch-rotation"
              payload: { expected_lot_version: "${lot_v0}" }
              as: LotOperator
              captures: { ra: $.data.id }
            - call: "POST /tow-providers/${p_id}/suspend"
              payload: {}
              as: LotOperator
          trigger:
            - call: "POST /rotation-assignments/${ra}/accept"
              payload: {}
              as: TowProvider
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_PROVIDER_NOT_ACTIVE"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: auction_window_overlap_on_same_lot_rejected
        grounds:
          - validations[priority=14]
          - entities.Auction.fields.window_start
          - entities.Auction.fields.window_end
        distinguishing_aspect: |
          Interval semantics: geometric overlap of two [window_start, window_end]
          intervals on the SAME ImpoundLot resource. A second auction overlapping
          an existing one is rejected (ERR_AUCTION_WINDOW_OVERLAP); pure interval
          intersection, no aggregate capacity.
        test_recipe:
          setup:
            - "Lot has one auction scheduled [2026-12-01T00:00:00Z, 2026-12-01T06:00:00Z]; a second auction [2026-12-01T03:00:00Z, 2026-12-01T09:00:00Z] overlaps."
          setup_api_calls:
            - call: "POST /impound-lots"
              payload: { name: "Lot O", jurisdiction_code: "CA", daily_storage_rate_cents: 5000, admin_fee_cents: 7500, lien_processing_fee_cents: 3000, statutory_hold_days: 30, notice_grace_days: 10 }
              as: LotOperator
              captures: { lot_id: $.data.id }
            - call: "POST /auctions"
              payload: { lot_id: "${lot_id}", window_start: "2026-12-01T00:00:00Z", window_end: "2026-12-01T06:00:00Z" }
              as: AuctionOfficial
              captures: { auc1: $.data.id }
          trigger:
            - call: "POST /auctions"
              payload: { lot_id: "${lot_id}", window_start: "2026-12-01T03:00:00Z", window_end: "2026-12-01T09:00:00Z" }
              as: AuctionOfficial
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_AUCTION_WINDOW_OVERLAP"

      - name: provider_concurrent_offer_capacity_exceeded
        grounds:
          - calculations.rotation_selection
          - entities.ImpoundLot.fields.max_provider_concurrent_offers
          - errors[ERR_NO_ELIGIBLE_PROVIDER]
        distinguishing_aspect: |
          Different interval semantics — aggregate capacity over overlapping
          active-offer intervals on the TowProvider resource: with a single
          provider and max_provider_concurrent_offers=1, a second dispatch finds
          the provider already at one concurrent OFFERED assignment and returns
          ERR_NO_ELIGIBLE_PROVIDER (capacity count, not geometric overlap).
        test_recipe:
          setup:
            - "Lot with max_provider_concurrent_offers=1 and a single ACTIVE provider; first dispatch fills the provider's one slot; second dispatch has no eligible provider."
          setup_api_calls:
            - call: "POST /impound-lots"
              payload: { name: "Lot P", jurisdiction_code: "CA", daily_storage_rate_cents: 5000, admin_fee_cents: 7500, lien_processing_fee_cents: 3000, statutory_hold_days: 30, notice_grace_days: 10, max_provider_concurrent_offers: 1 }
              as: LotOperator
              captures: { lot_id: $.data.id, lot_v0: $.data.version }
            - call: "POST /tow-providers"
              payload: { company_name: "PB", license_number: "LB", rotation_rank: 1 }
              as: LotOperator
              captures: { p_id: $.data.id }
            - call: "POST /impound-lots/${lot_id}/dispatch-rotation"
              payload: { expected_lot_version: "${lot_v0}" }
              as: LotOperator
              captures: { ra1: $.data.id }
            - call: "GET /impound-lots/${lot_id}"
              payload: {}
              as: LotOperator
              captures: { lot_v1: "$.data.version" }
          trigger:
            - call: "POST /impound-lots/${lot_id}/dispatch-rotation"
              payload: { expected_lot_version: "${lot_v1}" }
              as: LotOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_NO_ELIGIBLE_PROVIDER"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: void_sale_restores_auction_proceeds_money_conservation
        grounds:
          - state_machines.TowOrder.AUCTION_ELIGIBLE_to_AUCTIONED
          - calculations.auction_proceeds_distribution
          - entities.Auction.fields.gross_proceeds_cents
        distinguishing_aspect: |
          Conserved quantity = MONEY (cents). record-sale then void-sale must
          leave Auction.gross_proceeds_cents back at 0 and the order back to
          AUCTION_ELIGIBLE, with no distribution drift (forward + compensating).
        test_recipe:
          setup:
            - "Order AUCTION_ELIGIBLE swept into an OPEN auction, sale recorded at 40000, then voided."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: LotOperator
            - call: "POST /impound-lots"
              payload: { name: "Lot Q", jurisdiction_code: "CA", daily_storage_rate_cents: 5000, admin_fee_cents: 7500, lien_processing_fee_cents: 3000, statutory_hold_days: 30, notice_grace_days: 10 }
              as: LotOperator
              captures: { lot_id: $.data.id }
            - call: "POST /tow-orders"
              payload: { lot_id: "${lot_id}", tow_type: "ABANDONED", vin: "VIN12", plate: "P12", owner_name: "O12", owner_address: "Addr12" }
              as: LotOperator
              captures: { order_id: $.data.id }
            - call: "POST /tow-orders/${order_id}/inventory-items"
              payload: { category: "EXTERIOR_PHOTO", description: "doc12", photo_ref: "ref12" }
              as: LotOperator
            - call: "POST /tow-orders/${order_id}/store"
              payload: {}
              as: LotOperator
            - call: "POST /tow-orders/${order_id}/notifications"
              payload: { recipient_type: "OWNER", method: "CERTIFIED_MAIL" }
              as: LotOperator
              captures: { nid: $.data.id }
            - call: "POST /tow-orders/${order_id}/notifications/${nid}/send"
              payload: {}
              as: LotOperator
            - call: "POST /tow-orders/${order_id}/notifications/${nid}/confirm-delivery"
              payload: {}
              as: LotOperator
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2027-02-15T00:00:00Z" }
              as: LotOperator
            - call: "POST /tow-orders/${order_id}/mark-auction-eligible"
              payload: {}
              as: LotOperator
            - call: "POST /auctions"
              payload: { lot_id: "${lot_id}", window_start: "2027-02-15T00:00:00Z", window_end: "2027-02-15T06:00:00Z" }
              as: AuctionOfficial
              captures: { auc_id: $.data.id }
            - call: "POST /auctions/${auc_id}/open"
              payload: {}
              as: AuctionOfficial
            - call: "POST /auctions/${auc_id}/sweep"
              payload: { tow_order_id: "${order_id}" }
              as: AuctionOfficial
            - call: "POST /auctions/${auc_id}/record-sale"
              payload: { tow_order_id: "${order_id}", sale_price_cents: 40000 }
              as: AuctionOfficial
          trigger:
            - call: "POST /auctions/${auc_id}/void-sale"
              payload: { tow_order_id: "${order_id}" }
              as: AuctionOfficial
              captures: { st: $.data.status }
          assert:
            - "TowOrder.${order_id}.status == AUCTION_ELIGIBLE"
            - "Auction.${auc_id}.gross_proceeds_cents == 0"
            - "Auction.${auc_id}.distributed_cents == 0"
            - "Auction.${auc_id}.surplus_to_owner_cents == 0"

      - name: freeze_resume_conserves_accrued_storage_days
        grounds:
          - state_machines.TowOrder.AUCTION_ELIGIBLE_to_STORED
          - state_machines.TowOrder.STORED_to_AUCTION_ELIGIBLE
          - calculations.storage_fee_accrual
        distinguishing_aspect: |
          Conserved quantity = ACCRUED STORAGE DAYS/CENTS (different type from
          money). Freeze at 3 days (mark-eligible) then resume (reclaim) and run 2
          more days yields accrued 25000 — identical to 5 continuous days, with no
          day double-counted or dropped across the FREEZE/RESUME boundary.
        test_recipe:
          setup:
            - "Order stored at 2027-03-01; mark-eligible at +3 days (freeze, 15000); reclaim back to STORED; clock +2 more days; final accrued = 25000 (5 days)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: LotOperator
            - call: "POST /impound-lots"
              payload: { name: "Lot R", jurisdiction_code: "CA", daily_storage_rate_cents: 5000, admin_fee_cents: 7500, lien_processing_fee_cents: 3000, statutory_hold_days: 3, notice_grace_days: 0 }
              as: LotOperator
              captures: { lot_id: $.data.id }
            - call: "POST /tow-orders"
              payload: { lot_id: "${lot_id}", tow_type: "ABANDONED", vin: "VIN13", plate: "P13", owner_name: "O13", owner_address: "Addr13" }
              as: LotOperator
              captures: { order_id: $.data.id }
            - call: "POST /tow-orders/${order_id}/inventory-items"
              payload: { category: "EXTERIOR_PHOTO", description: "doc13", photo_ref: "ref13" }
              as: LotOperator
            - call: "POST /tow-orders/${order_id}/store"
              payload: {}
              as: LotOperator
            - call: "POST /tow-orders/${order_id}/notifications"
              payload: { recipient_type: "OWNER", method: "CERTIFIED_MAIL" }
              as: LotOperator
              captures: { nid: $.data.id }
            - call: "POST /tow-orders/${order_id}/notifications/${nid}/send"
              payload: {}
              as: LotOperator
            - call: "POST /tow-orders/${order_id}/notifications/${nid}/confirm-delivery"
              payload: {}
              as: LotOperator
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2027-03-04T00:00:00Z" }
              as: LotOperator
            - call: "POST /tow-orders/${order_id}/mark-auction-eligible"
              payload: {}
              as: LotOperator
            - call: "POST /tow-orders/${order_id}/reclaim"
              payload: {}
              as: LotOperator
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2027-03-06T00:00:00Z" }
              as: LotOperator
          trigger:
            - call: "GET /tow-orders/${order_id}"
              payload: {}
              as: LotOperator
              captures: { days: $.data.accrued_days, accrued: $.data.accrued_storage_cents }
          assert:
            - "TowOrder.${order_id}.accrued_days == 5"
            - "TowOrder.${order_id}.accrued_storage_cents == 25000"
