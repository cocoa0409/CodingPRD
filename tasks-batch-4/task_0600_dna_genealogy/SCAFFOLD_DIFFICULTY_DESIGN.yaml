          (p24, ERR_SUBSCRIPTION_LOCKED) — a DIFFERENT pair from the state/business_safety
          conflict above. A DNA_READY customer with a LOCKED subscription and no
          HEALTH_TRAITS grant must get ERR_CONSENT_REQUIRED (403), not ERR_SUBSCRIPTION_LOCKED (402).
        test_recipe:
          setup:
