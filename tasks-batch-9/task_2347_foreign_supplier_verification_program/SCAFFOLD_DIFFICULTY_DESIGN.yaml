  # ---------------------------------------------------------------------------
  # RULE 6 — boundary_precision_check
  # Three different metrics on three different endpoints: the 12.00 significant-
  # hazard threshold (POST hazards), the 60.00 suspension threshold (POST
  # attestation), the retention date boundary (GET records-package).
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: hazard_score_exactly_twelve_is_significant
        grounds:
          - calculations.hazard_risk_score.constants.significant_hazard_threshold
          - entities.Hazard.fields.requires_control
          - endpoints["POST /fsvp/hazard-analyses/{id}/hazards"]
        distinguishing_aspect: "Metric = Hazard.risk_score against the 12.00 significant-hazard threshold, tested at the exact boundary: 4 x 3 on a GENERAL non-RAC non-ready-to-eat food gives exactly 12.00 and MUST set requires_control = true (`>=`), while 2 x 5 x 1.10 gives 11.00 and MUST set it false."
        test_recipe:
          setup:
            - "Importer with one designated QI, an approved supplier and a plain food (GENERAL, non-RAC, not ready-to-eat) so every multiplier in hazard_risk_score is 1.00 except control_factor."
            - "A DRAFT hazard analysis on the pair, created with the pair's current version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fsvp/importers"
              payload: { legal_name: "Northbrook Foods Import LLC", dnb_number: "123456789", unique_facility_identifier: "UFI-NB-0001" }
              as: ComplianceOfficer
              captures: { imp: $.data.id }
            - call: "POST /fsvp/qualified-individuals"
              payload: { importer_id: "${imp}", full_name: "Ada Ruiz", email: "ada@northbrook.example", qualification_summary: "PCQI and FSVP training plus eight years of supplier audit experience", training_completed_at: "2025-06-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { qi_a: $.data.id }
            - call: "POST /fsvp/qualified-individuals/${qi_a}/designation"
              payload: { action: "DESIGNATE" }
              as: ComplianceOfficer
            - call: "POST /fsvp/foreign-suppliers"
              payload: { importer_id: "${imp}", name: "Rio Verde SA", country_code: "PE", facility_registration_number: "FRN-PE-77001", regulatory_compliance_status: "NO_ADVERSE_FINDINGS" }
              as: ComplianceOfficer
              captures: { sup: $.data.id }
            - call: "POST /fsvp/foods"
              payload: { importer_id: "${imp}", food_name: "Dried yellow peas", fda_product_code: "23-PEA-04", is_raw_agricultural_commodity: false, intended_consumer_group: "GENERAL", ready_to_eat: false }
              as: ComplianceOfficer
              captures: { food2: $.data.id }
            - call: "POST /fsvp/supplier-food-pairs"
              payload: { importer_id: "${imp}", supplier_id: "${sup}", food_id: "${food2}", designated_qi_id: "${qi_a}" }
              as: ComplianceOfficer
              captures: { pair2: $.data.id, pair2_v: $.data.version }
            - call: "POST /fsvp/hazard-analyses"
              payload: { pair_id: "${pair2}", expected_pair_version: "${pair2_v}", methodology_note: "Hazard identification for a dry non-ready-to-eat commodity" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
              captures: { ha2: $.data.id }
          trigger:
            - call: "POST /fsvp/hazard-analyses/${ha2}/hazards"
              payload: { hazard_type: "BIOLOGICAL", hazard_name: "Salmonella in dry commodity", severity: 4, probability: 3, control_owner: "FOREIGN_SUPPLIER" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
              captures: { hz_at: $.data.id }
            - call: "POST /fsvp/hazard-analyses/${ha2}/hazards"
              payload: { hazard_type: "PHYSICAL", hazard_name: "Metal fragments from milling", severity: 2, probability: 5, control_owner: "SUPPLIER_OF_SUPPLIER" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
              captures: { hz_below: $.data.id }
          assert:
            - "AT boundary — Hazard.${hz_at}.risk_score == 12.00"
            - "AT boundary — Hazard.${hz_at}.requires_control == true"
            - "BELOW boundary — Hazard.${hz_below}.risk_score == 11.00"
            - "BELOW boundary — Hazard.${hz_below}.requires_control == false"
            - "HazardAnalysis.${ha2}.hazard_count == 2"
            - "HazardAnalysis.${ha2}.significant_hazard_count == 1"
            - "HazardAnalysis.${ha2}.risk_total == 23.00"

      - name: performance_score_exactly_sixty_does_not_suspend
        grounds:
          - calculations.supplier_performance_score.constants.suspension_threshold
          - state_machines.ForeignSupplier.transitions.APPROVED_to_SUSPENDED_PENDING_REVIEW
          - endpoints["POST /fsvp/verification-records/{id}/attestation"]
        distinguishing_aspect: "Metric = ForeignSupplier.performance_score_final against the 60.00 suspension threshold on a different endpoint: one PASS and one FAIL sampling record give weighted_sum 240.00 over weight_total 4.00 = exactly 60.00, and because the cascade requires STRICTLY below 60.00 the supplier must stay APPROVED with no CorrectiveAction."
