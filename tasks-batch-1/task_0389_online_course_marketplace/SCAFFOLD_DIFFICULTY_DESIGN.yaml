              captures: { err: $.data.error_id }
          assert:
            - "response status code == 422"
            - "data.error_id == ERR_INSUFFICIENT_BALANCE (approve blocked by Instructor.payout_balance_cents == 0)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: coupon_window_halfopen_overlap_rejected
        grounds:
          - validations[priority=9]
          - entities.Coupon.fields.valid_from
          - entities.Coupon.fields.valid_until
          - errors[ERR_COUPON_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Coupon resource, HALF-OPEN [valid_from, valid_until) semantics with adjacency
          ALLOWED: a second coupon for the same (instructor, course) whose window
          [2026-03-01, 2026-09-01) overlaps the first [2026-01-01, 2026-06-01) is rejected;
          a touching window [2026-06-01, ...) would be allowed.
