scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: payout_estimated_vs_settled_net
        grounds:
          - calculations.payout_net
          - entities.Payout.fields.estimated_net_cents
          - entities.Payout.fields.settled_net_cents
          - state_machines.Payout.SCHEDULED_to_PAID
        distinguishing_aspect: |
          On the Payout domain: estimated_net_cents (Variant A, at create) counts a
          COMPLETED order that is later refunded via a case, while settled_net_cents
          (Variant B, at mark-paid) drops it — 90 vs 45 for two 100-cent orders.
        test_recipe:
          setup:
            - "Shop ACTIVE; ShippingProfile with free_shipping_threshold_cents=100; READY_TO_SHIP listing price 100, quantity 10, published."
            - "Two orders A and B (quantity 1) placed by buyer_1, each order_total_cents=100, each COMPLETED."
            - "Payout created (sweeps A and B) -> estimated_net_cents=90; then a case is opened on B and resolved REFUND; the ON_HOLD payout is released."
          setup_api_calls:
            - call: "POST /seller/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /seller/shops"
              payload: { owner_seller_id: "seller_1", name: "Handmade Co", max_concurrent_production: 3 }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /seller/shipping-profiles"
              payload: { shop_id: "${shop_id}", name: "US", base_cost_cents: 500, per_item_cost_cents: 150, free_shipping_threshold_cents: 100, processing_time_days: 1 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { sp_id: $.data.id }
            - call: "POST /seller/listings"
              payload: { shop_id: "${shop_id}", shipping_profile_id: "${sp_id}", title: "Mini Mug", fulfillment_type: "READY_TO_SHIP", processing_time_days: 1, price_cents: 100, quantity: 10 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /seller/listings/${listing_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/orders"
              payload: { shop_id: "${shop_id}", listing_id: "${listing_id}", quantity: 1 }
              as: Buyer
              as_user_id: "buyer_1"
              captures: { order_a: $.data.id }
            - call: "POST /seller/orders/${order_a}/pay"
              payload: {}
              as: Buyer
              as_user_id: "buyer_1"
            - call: "POST /seller/orders/${order_a}/ship"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/orders/${order_a}/deliver"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/orders/${order_a}/complete"
              payload: {}
              as: Buyer
              as_user_id: "buyer_1"
            - call: "POST /seller/orders"
              payload: { shop_id: "${shop_id}", listing_id: "${listing_id}", quantity: 1 }
              as: Buyer
              as_user_id: "buyer_1"
              captures: { order_b: $.data.id }
            - call: "POST /seller/orders/${order_b}/pay"
              payload: {}
              as: Buyer
              as_user_id: "buyer_1"
            - call: "POST /seller/orders/${order_b}/ship"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/orders/${order_b}/deliver"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/orders/${order_b}/complete"
              payload: {}
              as: Buyer
              as_user_id: "buyer_1"
            - call: "GET /seller/shops/${shop_id}"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
              captures: { shop_v: $.data.version }
            - call: "POST /seller/payouts"
              payload: { shop_id: "${shop_id}", expected_shop_version: "${shop_v}" }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { payout_id: $.data.id, est_net: $.data.estimated_net_cents }
            - call: "POST /seller/cases"
              payload: { order_id: "${order_b}", type: "NOT_AS_DESCRIBED" }
              as: Buyer
              as_user_id: "buyer_1"
              captures: { case_b: $.data.id }
            - call: "POST /seller/cases/${case_b}/respond"
              payload: { message: "Looking into it" }
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/cases/${case_b}/resolve"
              payload: { decision: "REFUND", resolution: "full refund" }
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/payouts/${payout_id}/release-hold"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /seller/payouts/${payout_id}/mark-paid"
              payload: {}
              as: PlatformAdmin
              captures: { settled: $.data.settled_net_cents, netc: $.data.net_cents }
          assert:
            - "Payout.${payout_id}.estimated_net_cents == 90"
            - "Payout.${payout_id}.settled_net_cents == 45"
            - "Payout.${payout_id}.net_cents == 45"

      - name: shop_rating_simple_vs_bayesian
        grounds:
          - calculations.shop_rating
          - entities.Shop.fields.simple_avg_rating
          - entities.Shop.fields.weighted_shop_rating
        distinguishing_aspect: |
          On the Shop domain (different entity domain from payout_net): two 5-star reviews
          give simple_avg_rating 5.00 but weighted_shop_rating (10+5*4.0)/(2+5)=4.29.
        test_recipe:
          setup:
            - "Shop ACTIVE with a published listing and two COMPLETED orders by buyer_1."
            - "Both orders reviewed 5 stars -> published_review_count=2."
          setup_api_calls:
            - call: "POST /seller/shops"
              payload: { owner_seller_id: "seller_1", name: "Handmade Co" }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /seller/shipping-profiles"
              payload: { shop_id: "${shop_id}", name: "US", base_cost_cents: 0, per_item_cost_cents: 0 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { sp_id: $.data.id }
            - call: "POST /seller/listings"
              payload: { shop_id: "${shop_id}", shipping_profile_id: "${sp_id}", title: "Bowl", fulfillment_type: "READY_TO_SHIP", processing_time_days: 1, price_cents: 2000, quantity: 10 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /seller/listings/${listing_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/orders"
              payload: { shop_id: "${shop_id}", listing_id: "${listing_id}", quantity: 1 }
              as: Buyer
              as_user_id: "buyer_1"
              captures: { order_a: $.data.id }
            - call: "POST /seller/orders/${order_a}/pay"
              payload: {}
              as: Buyer
              as_user_id: "buyer_1"
            - call: "POST /seller/orders/${order_a}/ship"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/orders/${order_a}/deliver"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/orders/${order_a}/complete"
              payload: {}
              as: Buyer
              as_user_id: "buyer_1"
            - call: "POST /seller/orders"
              payload: { shop_id: "${shop_id}", listing_id: "${listing_id}", quantity: 1 }
              as: Buyer
              as_user_id: "buyer_1"
              captures: { order_b: $.data.id }
            - call: "POST /seller/orders/${order_b}/pay"
              payload: {}
              as: Buyer
              as_user_id: "buyer_1"
            - call: "POST /seller/orders/${order_b}/ship"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/orders/${order_b}/deliver"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/orders/${order_b}/complete"
              payload: {}
              as: Buyer
              as_user_id: "buyer_1"
            - call: "POST /seller/reviews"
              payload: { order_id: "${order_a}", rating: 5, body: "Lovely" }
              as: Buyer
              as_user_id: "buyer_1"
            - call: "POST /seller/reviews"
              payload: { order_id: "${order_b}", rating: 5 }
              as: Buyer
              as_user_id: "buyer_1"
          trigger:
            - call: "GET /seller/shops/${shop_id}"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
              captures: { simple: $.data.simple_avg_rating, weighted: $.data.weighted_shop_rating, n: $.data.published_review_count }
          assert:
            - "Shop.${shop_id}.simple_avg_rating == 5.0"
            - "Shop.${shop_id}.weighted_shop_rating == 4.29"
            - "Shop.${shop_id}.published_review_count == 2"

  # =========================================================================
  # Rule 2 — combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: shipping_nonlinear_base_plus_per_item
        grounds:
          - calculations.order_shipping_cost
          - entities.Order.fields.shipping_cents
          - entities.ShippingProfile.fields.per_item_cost_cents
        distinguishing_aspect: |
          Mode (a): shipping_cents = base_cost + per_item_cost * max(0, quantity-1) with a
          free-shipping conditional — >=3 inputs and a non-linear max(); for base 500,
          per_item 150, quantity 3, threshold 10000 -> 500 + 150*2 = 800.
        test_recipe:
          setup:
            - "Shop ACTIVE; ShippingProfile base_cost_cents=500, per_item_cost_cents=150, free_shipping_threshold_cents=10000; listing price 2000 published."
          setup_api_calls:
            - call: "POST /seller/shops"
              payload: { owner_seller_id: "seller_1", name: "Handmade Co" }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /seller/shipping-profiles"
              payload: { shop_id: "${shop_id}", name: "US", base_cost_cents: 500, per_item_cost_cents: 150, free_shipping_threshold_cents: 10000 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { sp_id: $.data.id }
            - call: "POST /seller/listings"
              payload: { shop_id: "${shop_id}", shipping_profile_id: "${sp_id}", title: "Scarf", fulfillment_type: "READY_TO_SHIP", processing_time_days: 1, price_cents: 2000, quantity: 10 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /seller/listings/${listing_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
          trigger:
            - call: "POST /seller/orders"
              payload: { shop_id: "${shop_id}", listing_id: "${listing_id}", quantity: 3 }
              as: Buyer
              as_user_id: "buyer_1"
              captures: { order_id: $.data.id, ship: $.data.shipping_cents, sub: $.data.item_subtotal_cents, tot: $.data.order_total_cents }
          assert:
            - "Order.${order_id}.item_subtotal_cents == 6000"
            - "Order.${order_id}.shipping_cents == 800"
            - "Order.${order_id}.order_total_cents == 6800"

      - name: payout_fees_round_per_order_then_sum
        grounds:
          - calculations.payout_net
          - calculations.order_fees
          - entities.Payout.fields.fees_cents
        distinguishing_aspect: |
          Mode (b): fees are rounded per order then summed — two 100-cent orders give
          fees_cents=110 (55+55), NOT the sum-then-round value 109 (round on aggregate gross).
        test_recipe:
          setup:
            - "Shop ACTIVE; free-shipping listing price 100 published; two COMPLETED orders (quantity 1) each order_total_cents=100, order_fee_cents=55."
          setup_api_calls:
            - call: "POST /seller/shops"
              payload: { owner_seller_id: "seller_1", name: "Handmade Co" }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /seller/shipping-profiles"
              payload: { shop_id: "${shop_id}", name: "US", base_cost_cents: 500, per_item_cost_cents: 150, free_shipping_threshold_cents: 100 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { sp_id: $.data.id }
            - call: "POST /seller/listings"
              payload: { shop_id: "${shop_id}", shipping_profile_id: "${sp_id}", title: "Charm", fulfillment_type: "READY_TO_SHIP", processing_time_days: 1, price_cents: 100, quantity: 10 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /seller/listings/${listing_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/orders"
              payload: { shop_id: "${shop_id}", listing_id: "${listing_id}", quantity: 1 }
              as: Buyer
              as_user_id: "buyer_1"
              captures: { order_a: $.data.id }
            - call: "POST /seller/orders/${order_a}/pay"
              payload: {}
              as: Buyer
              as_user_id: "buyer_1"
            - call: "POST /seller/orders/${order_a}/ship"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/orders/${order_a}/deliver"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/orders/${order_a}/complete"
              payload: {}
              as: Buyer
              as_user_id: "buyer_1"
            - call: "POST /seller/orders"
              payload: { shop_id: "${shop_id}", listing_id: "${listing_id}", quantity: 1 }
              as: Buyer
              as_user_id: "buyer_1"
              captures: { order_b: $.data.id }
            - call: "POST /seller/orders/${order_b}/pay"
              payload: {}
              as: Buyer
              as_user_id: "buyer_1"
            - call: "POST /seller/orders/${order_b}/ship"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/orders/${order_b}/deliver"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/orders/${order_b}/complete"
              payload: {}
              as: Buyer
              as_user_id: "buyer_1"
            - call: "GET /seller/shops/${shop_id}"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
              captures: { shop_v: $.data.version }
          trigger:
            - call: "POST /seller/payouts"
              payload: { shop_id: "${shop_id}", expected_shop_version: "${shop_v}" }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { payout_id: $.data.id, fees: $.data.fees_cents, gross: $.data.gross_cents, est: $.data.estimated_net_cents }
          assert:
            - "Payout.${payout_id}.gross_cents == 200"
            - "Payout.${payout_id}.fees_cents == 110"
            - "Payout.${payout_id}.estimated_net_cents == 90"

  # =========================================================================
  # Rule 3 — non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: shop_vacation_cycle
        grounds:
          - state_machines.Shop.ACTIVE_to_VACATION
          - state_machines.Shop.VACATION_to_ACTIVE
          - entities.Shop.fields.status
        distinguishing_aspect: |
          Shop cycles ACTIVE->VACATION->ACTIVE->VACATION via enable/return endpoints —
          a genuine cycle (A->B->A->B), not a linear pipeline. Entity: Shop.
        test_recipe:
          setup:
            - "Shop ACTIVE."
          setup_api_calls:
            - call: "POST /seller/shops"
              payload: { owner_seller_id: "seller_1", name: "Handmade Co" }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
          trigger:
            - call: "POST /seller/shops/${shop_id}/enable-vacation"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
              captures: { s1: $.data.status }
            - call: "POST /seller/shops/${shop_id}/return-from-vacation"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
              captures: { s2: $.data.status }
            - call: "POST /seller/shops/${shop_id}/enable-vacation"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
              captures: { s3: $.data.status }
          assert:
            - "after step 1 Shop.${shop_id}.status == VACATION"
            - "after step 2 Shop.${shop_id}.status == ACTIVE"
            - "after step 3 Shop.${shop_id}.status == VACATION"

      - name: order_parallel_payment_and_fulfillment_axes
        grounds:
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
          - state_machines.Order.UNPAID_to_PAID
          - state_machines.Order.IN_PRODUCTION_to_SHIPPED
        distinguishing_aspect: |
          Order carries two independent axes: pay moves payment_status UNPAID->PAID and
          fulfillment_status NOT_STARTED->IN_PRODUCTION; ship moves only fulfillment
          IN_PRODUCTION->SHIPPED while payment_status stays PAID. Entity: Order (parallel dims).
        test_recipe:
          setup:
            - "Shop ACTIVE; MADE_TO_ORDER listing (no material) published; one UNPAID order."
          setup_api_calls:
            - call: "POST /seller/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /seller/shops"
              payload: { owner_seller_id: "seller_1", name: "Handmade Co", max_concurrent_production: 5 }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /seller/shipping-profiles"
              payload: { shop_id: "${shop_id}", name: "US", base_cost_cents: 0, per_item_cost_cents: 0 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { sp_id: $.data.id }
            - call: "POST /seller/listings"
              payload: { shop_id: "${shop_id}", shipping_profile_id: "${sp_id}", title: "Custom Ring", fulfillment_type: "MADE_TO_ORDER", processing_time_days: 7, price_cents: 5000 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /seller/listings/${listing_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/orders"
              payload: { shop_id: "${shop_id}", listing_id: "${listing_id}", quantity: 1 }
              as: Buyer
              as_user_id: "buyer_1"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /seller/orders/${order_id}/pay"
              payload: {}
              as: Buyer
              as_user_id: "buyer_1"
              captures: { pay_ps: $.data.payment_status, pay_fs: $.data.fulfillment_status }
            - call: "POST /seller/orders/${order_id}/ship"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
              captures: { ship_ps: $.data.payment_status, ship_fs: $.data.fulfillment_status }
          assert:
            - "after pay Order.${order_id}.payment_status == PAID"
            - "after pay Order.${order_id}.fulfillment_status == IN_PRODUCTION"
            - "after ship Order.${order_id}.payment_status == PAID"
            - "after ship Order.${order_id}.fulfillment_status == SHIPPED"

  # =========================================================================
  # Rule 4 — transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: pay_material_stockout_listing_soldout
        grounds:
          - state_machines.Order.UNPAID_to_PAID
          - calculations.material_stock_status
          - state_machines.Listing.ACTIVE_to_SOLD_OUT
          - entities.Material.fields.stock_qty
        distinguishing_aspect: |
          Depth-3 chain Order->Material->Listing: paying the MTO order decrements the
          Material to 0 (link 1), which flips it OUT_OF_STOCK (link 2), which flips the
          dependent Listing ACTIVE->SOLD_OUT (link 3). Trigger: order pay.
        test_recipe:
          setup:
            - "Shop ACTIVE; Material stock_qty=2, reorder_threshold=0 (IN_STOCK); MADE_TO_ORDER listing with primary_material_id and material_qty_per_unit=2, published; one UNPAID order quantity 1."
          setup_api_calls:
            - call: "POST /seller/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /seller/shops"
              payload: { owner_seller_id: "seller_1", name: "Handmade Co", max_concurrent_production: 5 }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /seller/shipping-profiles"
              payload: { shop_id: "${shop_id}", name: "US", base_cost_cents: 0, per_item_cost_cents: 0 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { sp_id: $.data.id }
            - call: "POST /seller/materials"
              payload: { shop_id: "${shop_id}", name: "Walnut blank", stock_qty: 2, reorder_threshold: 0 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { mat_id: $.data.id }
            - call: "POST /seller/listings"
              payload: { shop_id: "${shop_id}", shipping_profile_id: "${sp_id}", primary_material_id: "${mat_id}", material_qty_per_unit: 2, title: "Carved Box", fulfillment_type: "MADE_TO_ORDER", processing_time_days: 7, price_cents: 8000 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /seller/listings/${listing_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/orders"
              payload: { shop_id: "${shop_id}", listing_id: "${listing_id}", quantity: 1 }
              as: Buyer
              as_user_id: "buyer_1"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /seller/orders/${order_id}/pay"
              payload: {}
              as: Buyer
              as_user_id: "buyer_1"
            - call: "GET /seller/materials/${mat_id}"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
              captures: { mat_status: $.data.status, mat_stock: $.data.stock_qty }
            - call: "GET /seller/listings/${listing_id}"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
              captures: { lst_status: $.data.status }
          assert:
            - "Material.${mat_id}.stock_qty == 0"
            - "Material.${mat_id}.status == OUT_OF_STOCK"
            - "Listing.${listing_id}.status == SOLD_OUT"

      - name: case_open_flags_order_and_holds_payout
        grounds:
          - state_machines.Case.OPEN
          - entities.Order.fields.has_open_case
          - state_machines.Payout.SCHEDULED_to_ON_HOLD
        distinguishing_aspect: |
          Depth chain Case->Order->Payout from a different trigger (case create): opening a
          case sets order.has_open_case=true (link 1), which freezes the containing payout
          SCHEDULED->ON_HOLD (link 2).
        test_recipe:
          setup:
            - "Shop ACTIVE; free-shipping listing price 100 published; one COMPLETED order swept into a SCHEDULED payout."
          setup_api_calls:
            - call: "POST /seller/shops"
              payload: { owner_seller_id: "seller_1", name: "Handmade Co" }
