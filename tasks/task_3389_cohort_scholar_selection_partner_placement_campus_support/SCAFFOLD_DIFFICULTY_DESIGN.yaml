  - rule_id: priority_pair_validation_conflict
    instances:
      - name: offer_create_state_error_beats_capacity_error
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_COHORT_FULL]
        distinguishing_aspect: |
          Error-category pair (state, business_fiscal): the request violates the
          nominee state gate (X is DROPPED, not SELECTED -> ERR_INVALID_STATE at
          priority 8) AND the capacity gate (cohort FORMING with
          seats_remaining == 0 -> ERR_COHORT_FULL at priority 11). The state
          error must win because 8 < 11.
        test_recipe:
          setup:
            - "Cohort size 3 FORMING with seats_committed 1, offers_outstanding 2 (seats_remaining == 0)"
            - "Nominee X DROPPED (dropped straight from NOMINATED; never SELECTED)"
          setup_api_calls:
            - { call: "POST /api/city-programs", payload: { code: "ATL", name: "Atlanta", admissions_cycle: "2027", nomination_window_opens_at: "2026-09-01T00:00:00Z", nomination_window_closes_at: "2026-11-30T23:59:59Z" }, as: ProgramAdmin, captures: { cp: $.data.id } }
