      - name: job_start_requires_active_window
        grounds:
          - state_machines.TestJob.PLANNED_to_IN_PROGRESS
          - validations[priority=12]
        distinguishing_aspect: |
          Entity pair TestJob x OutageWindow: starting a PLANNED job while its window is
          merely APPROVED (clock before window_start) fails ERR_WINDOW_NOT_ACTIVE; after
          activation the same call succeeds. Different pair from the other two instances.
        test_recipe:
          setup:
            - "Circuit, window [2026-08-10T08:00Z, 2026-08-12T12:00Z] APPROVED; job PLANNED; logical clock still at default 2026-08-01T00:00Z (window not yet entered)."
