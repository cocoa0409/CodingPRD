          - entities.InterchangeEvent.fields.odometer_miles
          - entities.RepairBill.fields.material_cents
          - entities.Railroad.fields.reporting_mark
        distinguishing_aspect: "ERR_INVALID_REQUEST is not only about ABSENT fields: a present field of the wrong JSON type (integer sent as a string), a present field outside its declared non-negative range, a present but unparseable ISO-8601 instant, and a reporting_mark that fails its ^[A-Z]{2,4}$ pattern all land on the same 400 — while a system or computed field supplied in the body is silently IGNORED rather than rejected, which is the opposite behaviour on the same endpoint."
