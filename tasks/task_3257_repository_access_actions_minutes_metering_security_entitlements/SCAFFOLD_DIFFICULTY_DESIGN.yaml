              captures: { used_mid: $.data.used_seats, avail_mid: $.data.available_seats }
            - call: "POST /users/${u1_id}/transition"
              payload: { action: "SUSPEND" }
              as: EnterpriseAdmin
            - call: "GET /enterprises/${ent_id}/seat-usage"
              payload: { mode: "CYCLE" }
              as: EnterpriseAdmin
              captures: { used_end: $.data.used_seats, avail_end: $.data.available_seats }
          assert:
            - "used_mid == 1"
            - "avail_mid == 2"
            - "used_mid + avail_mid == 3   # invariant holds after consumption"
            - "used_end == 0   # suspension reclaimed the seat"
            - "avail_end == 3"
            - "used_end + avail_end == 3   # invariant holds after compensation"

      - name: storage_upload_delete_invariant
        grounds:
          - calculations.storage_billing
          - entities.Organization.fields.consumed_storage_gb
          - state_machines.StorageArtifact.RETAINED_to_DELETED
        distinguishing_aspect: |
          Conserved quantity: storage bytes (different from seats). Uploading an
          artifact then deleting it returns Organization.consumed_storage_gb to
          exactly its pre-upload value — no drift from the 1024-divisor
          conversion across the forward/compensating pair.
        test_recipe:
          setup:
            - "Enterprise + TEAM Organization + Repository; clock at default"
          setup_api_calls:
            - call: "POST /enterprises"
              payload: { name: "E1", purchased_seats: 5 }
              as: EnterpriseAdmin
              captures: { ent_id: $.data.id }
            - call: "POST /organizations"
              payload: { enterprise_id: "${ent_id}", login: "org1", plan_tier: "TEAM" }
              as: EnterpriseAdmin
              captures: { org_id: $.data.id }
            - call: "POST /repositories"
              payload: { organization_id: "${org_id}", name: "repo1" }
              as: OrgAdmin
              captures: { repo_id: $.data.id }
            - call: "POST /repositories/${repo_id}/artifacts"
              payload: { name: "a1", size_mb: 512, retention_days: 90 }
              as: OrgAdmin
              captures: { art_id: $.data.id }
          trigger:
            - call: "GET /organizations/${org_id}"
              as: Any
              captures: { gb_mid: $.data.consumed_storage_gb }
            - call: "DELETE /artifacts/${art_id}"
              as: OrgAdmin
            - call: "GET /organizations/${org_id}"
              as: Any
              captures: { gb_end: $.data.consumed_storage_gb }
          assert:
            - "gb_mid == 0.5   # 512 MB / 1024, 3-decimal round_half_up"
            - "gb_end == 0.0   # compensating delete returns the ledger to its pre-upload value"
