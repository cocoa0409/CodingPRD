scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_membership_level_returns_all_fields
        claim_type: creation
        grounds: [entities.MembershipLevel, endpoints."POST /station/membership-levels"]
        distinguishing_aspect: "POST with all required fields returns 201 with server-minted id, created_at, version=1 and premium_eligible default true."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /station/membership-levels"
              payload: { code: "BASIC", min_annual_cents: 6000, min_monthly_sustainer_cents: 500 }
              as: StationAdmin
              captures: { lvl_id: $.data.id, lvl_pe: $.data.premium_eligible, lvl_v: $.data.version, lvl_active: $.data.active }
          trigger: []
          assert:
            - "${lvl_id} is a non-empty UUID"
            - "${lvl_pe} == true (default applied when omitted)"
            - "${lvl_active} == true (default applied)"
            - "${lvl_v} == 1"

      - name: create_membership_level_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.MembershipLevel.fields.min_annual_cents, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required min_annual_cents yields ERR_INVALID_REQUEST (400); no level persisted."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /station/membership-levels"
              payload: { code: "BASIC", min_monthly_sustainer_cents: 500 }
              as: StationAdmin
              captures: { err_code: $.data.error_id }
          assert:
            - "${err_code} == ERR_INVALID_REQUEST"

      - name: get_donor_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Donor, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /station/donors/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: MembershipCoordinator
              captures: { err_code: $.data.error_id }
          assert:
            - "${err_code} == ERR_NOT_FOUND"

      - name: donor_computed_lifetime_given_accumulates_paid_net
        claim_type: computed_fields
        grounds: [entities.Donor.fields.lifetime_given_cents, calculations.pledge_net_collected]
        distinguishing_aspect: "Donor.lifetime_given_cents is computed: it equals the paid pledge's net (gross minus premium FMV) and rejects client-supplied values."
        test_recipe:
          setup:
            - "Level BASIC; premium MUG FMV 2500 in stock; donor D; membership M; drive DRV ON_AIR"
            - "Pledge P 12000 with MUG, paid in full"
          setup_api_calls:
            - call: "POST /station/membership-levels"
              payload: { code: "BASIC", min_annual_cents: 6000, min_monthly_sustainer_cents: 500 }
              as: StationAdmin
            - call: "POST /station/premiums"
              payload: { sku: "MUG", title: "Station Mug", fair_market_value_cents: 2500, membership_level_code: "BASIC" }
              as: StationAdmin
              captures: { prem_id: $.data.id }
            - call: "POST /station/premiums/${prem_id}/lots"
              payload: { received_at: "2026-07-15T00:00:00Z", unit_cost_cents: 800, total_qty: 10 }
              as: MembershipCoordinator
            - call: "POST /station/donors"
              payload: { email: "ce1@x.com", full_name: "Donor CE1", postal_code: "97001" }
              as: MembershipCoordinator
              captures: { d_id: $.data.id }
            - call: "POST /station/memberships"
              payload: { donor_id: "${d_id}", level_code: "BASIC" }
              as: MembershipCoordinator
              captures: { m_id: $.data.id }
            - call: "POST /station/pledge-drives"
              payload: { name: "Fall 2026", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-15T00:00:00Z", goal_cents: 100000 }
              as: StationAdmin
              captures: { drv_id: $.data.id, drv_v: $.data.version }
            - call: "POST /station/pledge-drives/${drv_id}/breaks"
              payload: { starts_at: "2026-08-02T18:00:00Z", ends_at: "2026-08-02T18:20:00Z", program_title: "Evening Pledge", pitch_level_code: "BASIC", expected_drive_version: "${drv_v}" }
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv_id}/schedule"
              payload: {}
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv_id}/go-live"
              payload: {}
              as: StationAdmin
            - call: "POST /station/pledges"
              payload: { donor_id: "${d_id}", membership_id: "${m_id}", drive_id: "${drv_id}", channel: "PHONE", kind: "ONE_TIME", amount_cents: 12000, premium_id: "${prem_id}" }
              as: PhoneVolunteer
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /station/pledges/${p_id}/payments"
              payload: { amount_cents: 12000, expected_pledge_version: "${p_v}" }
              as: PhoneVolunteer
          trigger:
            - call: "GET /station/donors/${d_id}"
              payload: {}
              as: MembershipCoordinator
              captures: { d_lifetime: $.data.lifetime_given_cents }
          assert:
            - "${d_lifetime} == 9500 (12000 gross - 2500 FMV, premium RESERVED at payment time)"

      - name: list_membership_levels_pagination_envelope
        claim_type: listing
        grounds: [endpoints."GET /station/membership-levels", response_envelope]
        distinguishing_aspect: "List endpoint returns envelope with limit/offset/total_count/has_more; defaults limit=10."
        test_recipe:
          setup: ["two levels exist"]
          setup_api_calls:
            - call: "POST /station/membership-levels"
              payload: { code: "BASIC", min_annual_cents: 6000, min_monthly_sustainer_cents: 500 }
              as: StationAdmin
            - call: "POST /station/membership-levels"
              payload: { code: "LEADERSHIP", min_annual_cents: 120000, min_monthly_sustainer_cents: 10000 }
              as: StationAdmin
          trigger:
            - call: "GET /station/membership-levels"
              payload: {}
              as: StationAdmin
          assert:
            - "response envelope has meta.api_request_id and meta.api_request_timestamp"
            - "response_type == 'array'; data is a list of 2 levels"
            - "pagination: total_count == 2, has_more == false, limit == 10, offset == 0"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: pledge_created_in_initial_state_pledged
        claim_type: initial_state
        grounds: [state_machines.Pledge]
        distinguishing_aspect: "A newly captured pledge without premium has payment_status PLEDGED and fulfillment_status NO_PREMIUM."
        test_recipe:
          setup: ["Level BASIC; donor D; membership M; drive DRV ON_AIR"]
          setup_api_calls:
            - call: "POST /station/membership-levels"
              payload: { code: "BASIC", min_annual_cents: 6000, min_monthly_sustainer_cents: 500 }
              as: StationAdmin
            - call: "POST /station/donors"
              payload: { email: "sm1@x.com", full_name: "Donor SM1", postal_code: "97011" }
              as: MembershipCoordinator
              captures: { d_id: $.data.id }
            - call: "POST /station/memberships"
              payload: { donor_id: "${d_id}", level_code: "BASIC" }
              as: MembershipCoordinator
              captures: { m_id: $.data.id }
            - call: "POST /station/pledge-drives"
              payload: { name: "Fall 2026", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-15T00:00:00Z", goal_cents: 100000 }
              as: StationAdmin
              captures: { drv_id: $.data.id, drv_v: $.data.version }
            - call: "POST /station/pledge-drives/${drv_id}/breaks"
              payload: { starts_at: "2026-08-02T18:00:00Z", ends_at: "2026-08-02T18:20:00Z", program_title: "Evening Pledge", pitch_level_code: "BASIC", expected_drive_version: "${drv_v}" }
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv_id}/schedule"
              payload: {}
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv_id}/go-live"
              payload: {}
              as: StationAdmin
          trigger:
            - call: "POST /station/pledges"
              payload: { donor_id: "${d_id}", membership_id: "${m_id}", drive_id: "${drv_id}", channel: "WEB", kind: "ONE_TIME", amount_cents: 6000 }
              as: PhoneVolunteer
              captures: { p_pay: $.data.payment_status, p_ful: $.data.fulfillment_status }
          assert:
            - "${p_pay} == PLEDGED"
            - "${p_ful} == NO_PREMIUM"

      - name: ship_premium_from_reserved_succeeds_and_updates_lot
        claim_type: valid_transition
        grounds: [state_machines.Pledge."fulfillment_status=RESERVED_to_SHIPPED", state_machines.PremiumReservation.HELD_to_COMMITTED]
        distinguishing_aspect: "Shipping a paid pledge's premium moves fulfillment RESERVED->SHIPPED and reservation HELD->COMMITTED; lot counters transfer reserved->committed keeping available unchanged."
        test_recipe:
          setup: ["Level BASIC; premium MUG lot of 3; donor D; membership M; drive ON_AIR; pledge 12000 with MUG, PAID"]
          setup_api_calls:
            - call: "POST /station/membership-levels"
              payload: { code: "BASIC", min_annual_cents: 6000, min_monthly_sustainer_cents: 500 }
              as: StationAdmin
            - call: "POST /station/premiums"
              payload: { sku: "MUG", title: "Station Mug", fair_market_value_cents: 2500, membership_level_code: "BASIC" }
              as: StationAdmin
              captures: { prem_id: $.data.id }
            - call: "POST /station/premiums/${prem_id}/lots"
              payload: { received_at: "2026-07-15T00:00:00Z", unit_cost_cents: 800, total_qty: 3 }
              as: MembershipCoordinator
            - call: "POST /station/donors"
              payload: { email: "sm2@x.com", full_name: "Donor SM2", postal_code: "97012" }
              as: MembershipCoordinator
              captures: { d_id: $.data.id }
            - call: "POST /station/memberships"
              payload: { donor_id: "${d_id}", level_code: "BASIC" }
              as: MembershipCoordinator
              captures: { m_id: $.data.id }
            - call: "POST /station/pledge-drives"
              payload: { name: "Fall 2026", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-15T00:00:00Z", goal_cents: 100000 }
              as: StationAdmin
              captures: { drv_id: $.data.id, drv_v: $.data.version }
            - call: "POST /station/pledge-drives/${drv_id}/breaks"
              payload: { starts_at: "2026-08-02T18:00:00Z", ends_at: "2026-08-02T18:20:00Z", program_title: "Evening Pledge", pitch_level_code: "BASIC", expected_drive_version: "${drv_v}" }
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv_id}/schedule"
              payload: {}
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv_id}/go-live"
              payload: {}
              as: StationAdmin
            - call: "POST /station/pledges"
              payload: { donor_id: "${d_id}", membership_id: "${m_id}", drive_id: "${drv_id}", channel: "PHONE", kind: "ONE_TIME", amount_cents: 12000, premium_id: "${prem_id}" }
              as: PhoneVolunteer
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /station/pledges/${p_id}/payments"
              payload: { amount_cents: 12000, expected_pledge_version: "${p_v}" }
              as: PhoneVolunteer
          trigger:
            - call: "POST /station/pledges/${p_id}/ship-premium"
              payload: {}
              as: MembershipCoordinator
              captures: { p_ful: $.data.fulfillment_status }
            - call: "GET /station/premiums/${prem_id}/lots"
              payload: {}
              as: MembershipCoordinator
              captures: { lot_av: "$.data[0].available_qty", lot_rv: "$.data[0].reserved_qty", lot_cm: "$.data[0].committed_qty" }
          assert:
            - "${p_ful} == SHIPPED"
            - "${lot_av} == 2 and ${lot_rv} == 0 and ${lot_cm} == 1"

      - name: ship_premium_before_payment_rejected_cross_dimension_guard
        claim_type: precondition_enforcement
        grounds: [state_machines.Pledge."fulfillment_status=RESERVED_to_SHIPPED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cross-dimension guard: shipping while payment_status is PLEDGED (not PAID) is rejected with ERR_INVALID_STATE even though fulfillment_status is RESERVED."
        test_recipe:
          setup: ["Level BASIC; premium MUG in stock; donor D; membership M; drive ON_AIR; pledge 12000 with MUG captured but NOT paid"]
          setup_api_calls:
            - call: "POST /station/membership-levels"
              payload: { code: "BASIC", min_annual_cents: 6000, min_monthly_sustainer_cents: 500 }
              as: StationAdmin
            - call: "POST /station/premiums"
              payload: { sku: "MUG", title: "Station Mug", fair_market_value_cents: 2500, membership_level_code: "BASIC" }
              as: StationAdmin
              captures: { prem_id: $.data.id }
            - call: "POST /station/premiums/${prem_id}/lots"
              payload: { received_at: "2026-07-15T00:00:00Z", unit_cost_cents: 800, total_qty: 5 }
              as: MembershipCoordinator
            - call: "POST /station/donors"
              payload: { email: "sm3@x.com", full_name: "Donor SM3", postal_code: "97013" }
              as: MembershipCoordinator
              captures: { d_id: $.data.id }
            - call: "POST /station/memberships"
              payload: { donor_id: "${d_id}", level_code: "BASIC" }
              as: MembershipCoordinator
              captures: { m_id: $.data.id }
            - call: "POST /station/pledge-drives"
              payload: { name: "Fall 2026", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-15T00:00:00Z", goal_cents: 100000 }
              as: StationAdmin
              captures: { drv_id: $.data.id, drv_v: $.data.version }
            - call: "POST /station/pledge-drives/${drv_id}/breaks"
              payload: { starts_at: "2026-08-02T18:00:00Z", ends_at: "2026-08-02T18:20:00Z", program_title: "Evening Pledge", pitch_level_code: "BASIC", expected_drive_version: "${drv_v}" }
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv_id}/schedule"
              payload: {}
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv_id}/go-live"
              payload: {}
              as: StationAdmin
            - call: "POST /station/pledges"
              payload: { donor_id: "${d_id}", membership_id: "${m_id}", drive_id: "${drv_id}", channel: "PHONE", kind: "ONE_TIME", amount_cents: 12000, premium_id: "${prem_id}" }
              as: PhoneVolunteer
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /station/pledges/${p_id}/ship-premium"
              payload: {}
              as: MembershipCoordinator
              captures: { err_code: $.data.error_id }
          assert:
            - "${err_code} == ERR_INVALID_STATE"
            - "Pledge.${p_id}.fulfillment_status remains RESERVED"

      - name: decline_on_written_off_pledge_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Pledge, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "WRITTEN_OFF is terminal: a subsequent decline attempt is rejected with ERR_INVALID_STATE; no side effects fire twice."
        test_recipe:
          setup: ["Level BASIC; donor D; membership M; drive ON_AIR; pledge 6000 captured; clock advanced 61 days; pledge written off"]
          setup_api_calls:
            - call: "POST /station/membership-levels"
              payload: { code: "BASIC", min_annual_cents: 6000, min_monthly_sustainer_cents: 500 }
              as: StationAdmin
            - call: "POST /station/donors"
              payload: { email: "sm4@x.com", full_name: "Donor SM4", postal_code: "97014" }
              as: MembershipCoordinator
              captures: { d_id: $.data.id }
            - call: "POST /station/memberships"
              payload: { donor_id: "${d_id}", level_code: "BASIC" }
              as: MembershipCoordinator
              captures: { m_id: $.data.id }
            - call: "POST /station/pledge-drives"
              payload: { name: "Fall 2026", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-15T00:00:00Z", goal_cents: 100000 }
              as: StationAdmin
              captures: { drv_id: $.data.id, drv_v: $.data.version }
            - call: "POST /station/pledge-drives/${drv_id}/breaks"
              payload: { starts_at: "2026-08-02T18:00:00Z", ends_at: "2026-08-02T18:20:00Z", program_title: "Evening Pledge", pitch_level_code: "BASIC", expected_drive_version: "${drv_v}" }
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv_id}/schedule"
              payload: {}
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv_id}/go-live"
              payload: {}
              as: StationAdmin
            - call: "POST /station/pledges"
              payload: { donor_id: "${d_id}", membership_id: "${m_id}", drive_id: "${drv_id}", channel: "PHONE", kind: "ONE_TIME", amount_cents: 6000 }
              as: PhoneVolunteer
              captures: { p_id: $.data.id }
            - call: "POST /station/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: StationAdmin
            - call: "POST /station/pledges/${p_id}/write-off"
              payload: { reason: "unreachable donor" }
              as: MembershipCoordinator
          trigger:
            - call: "POST /station/pledges/${p_id}/decline"
              payload: { reason: "late dispute" }
              as: PhoneVolunteer
              captures: { err_code: $.data.error_id }
          assert:
            - "${err_code} == ERR_INVALID_STATE"
            - "Pledge.${p_id}.payment_status remains WRITTEN_OFF"

      - name: drive_close_cascades_breaks_aired_and_challenges_expired
        claim_type: side_effect_execution
        grounds: [state_machines.PledgeDrive.ON_AIR_to_CLOSED]
        distinguishing_aspect: "Closing the drive cascades: every still-SCHEDULED break becomes AIRED and every OPEN challenge becomes EXPIRED (cascade-down pattern)."
        test_recipe:
          setup: ["Level BASIC; drive ON_AIR with break B1 SCHEDULED and challenge MC OPEN"]
          setup_api_calls:
            - call: "POST /station/membership-levels"
              payload: { code: "BASIC", min_annual_cents: 6000, min_monthly_sustainer_cents: 500 }
              as: StationAdmin
            - call: "POST /station/pledge-drives"
              payload: { name: "Fall 2026", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-15T00:00:00Z", goal_cents: 100000 }
              as: StationAdmin
              captures: { drv_id: $.data.id, drv_v: $.data.version }
            - call: "POST /station/pledge-drives/${drv_id}/breaks"
              payload: { starts_at: "2026-08-02T18:00:00Z", ends_at: "2026-08-02T18:20:00Z", program_title: "Evening Pledge", pitch_level_code: "BASIC", expected_drive_version: "${drv_v}" }
              as: StationAdmin
              captures: { brk_id: $.data.id }
            - call: "POST /station/pledge-drives/${drv_id}/matching-challenges"
              payload: { sponsor_name: "Acme", goal_cents: 999999, match_cents: 1000 }
              as: StationAdmin
              captures: { mc_id: $.data.id }
            - call: "POST /station/pledge-drives/${drv_id}/schedule"
              payload: {}
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv_id}/go-live"
              payload: {}
              as: StationAdmin
          trigger:
            - call: "POST /station/pledge-drives/${drv_id}/close"
              payload: {}
              as: StationAdmin
              captures: { drv_status: $.data.status }
            - call: "GET /station/pledge-drives/${drv_id}/breaks"
              payload: {}
              as: StationAdmin
              captures: { brk_status: "$.data[0].status" }
            - call: "GET /station/matching-challenges/${mc_id}"
              payload: {}
              as: StationAdmin
              captures: { mc_status: $.data.status }
          assert:
            - "${drv_status} == CLOSED"
            - "${brk_status} == AIRED (cascade)"
            - "${mc_status} == EXPIRED (cascade)"

      - name: reconcile_rejected_while_pledges_unresolved
        claim_type: precondition_enforcement
        grounds: [state_machines.PledgeDrive.CLOSED_to_RECONCILED, "errors[ERR_UNRESOLVED_PLEDGES]"]
        distinguishing_aspect: "Reconcile requires all drive pledges terminal; a PLEDGED pledge blocks with ERR_UNRESOLVED_PLEDGES."
        test_recipe:
          setup: ["Level BASIC; donor D; membership M; drive ON_AIR->CLOSED with one pledge still PLEDGED"]
          setup_api_calls:
            - call: "POST /station/membership-levels"
              payload: { code: "BASIC", min_annual_cents: 6000, min_monthly_sustainer_cents: 500 }
              as: StationAdmin
            - call: "POST /station/donors"
              payload: { email: "sm5@x.com", full_name: "Donor SM5", postal_code: "97015" }
              as: MembershipCoordinator
              captures: { d_id: $.data.id }
            - call: "POST /station/memberships"
              payload: { donor_id: "${d_id}", level_code: "BASIC" }
              as: MembershipCoordinator
              captures: { m_id: $.data.id }
            - call: "POST /station/pledge-drives"
              payload: { name: "Fall 2026", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-15T00:00:00Z", goal_cents: 100000 }
              as: StationAdmin
              captures: { drv_id: $.data.id, drv_v: $.data.version }
            - call: "POST /station/pledge-drives/${drv_id}/breaks"
              payload: { starts_at: "2026-08-02T18:00:00Z", ends_at: "2026-08-02T18:20:00Z", program_title: "Evening Pledge", pitch_level_code: "BASIC", expected_drive_version: "${drv_v}" }
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv_id}/schedule"
              payload: {}
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv_id}/go-live"
              payload: {}
              as: StationAdmin
            - call: "POST /station/pledges"
              payload: { donor_id: "${d_id}", membership_id: "${m_id}", drive_id: "${drv_id}", channel: "PHONE", kind: "ONE_TIME", amount_cents: 6000 }
              as: PhoneVolunteer
            - call: "POST /station/pledge-drives/${drv_id}/close"
              payload: {}
              as: StationAdmin
          trigger:
            - call: "POST /station/pledge-drives/${drv_id}/reconcile"
              payload: {}
              as: MembershipCoordinator
              captures: { err_code: $.data.error_id }
          assert:
            - "${err_code} == ERR_UNRESOLVED_PLEDGES"
            - "PledgeDrive.${drv_id}.status remains CLOSED"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: drive_totals_rollup_input_set_filtering
        claim_type: input_set_filtering
        grounds: [calculations.drive_totals_rollup]
        distinguishing_aspect: "pledged_cents counts only pledges NOT IN (DECLINED, WRITTEN_OFF); collected_cents counts only PAID/PARTIAL net — a declined pledge contributes to neither."
        test_recipe:
          setup: ["Level BASIC; donor D; membership M; drive ON_AIR; pledge A 6000 PAID; pledge B 4000 DECLINED"]
          setup_api_calls:
            - call: "POST /station/membership-levels"
              payload: { code: "BASIC", min_annual_cents: 6000, min_monthly_sustainer_cents: 500 }
              as: StationAdmin
            - call: "POST /station/donors"
              payload: { email: "cl1@x.com", full_name: "Donor CL1", postal_code: "97021" }
              as: MembershipCoordinator
              captures: { d_id: $.data.id }
            - call: "POST /station/memberships"
