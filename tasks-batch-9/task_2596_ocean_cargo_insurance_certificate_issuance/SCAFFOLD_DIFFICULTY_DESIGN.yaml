  - rule_id: boundary_precision_check
    instances:
      - name: port_accumulation_exact_limit_accepted_one_cent_over_rejected
        metric: "money: discharge-port accumulated exposure vs port_accumulation_limit_amount (strict `>` comparison)"
        endpoint: "POST /certificates/{id}/issue"
        grounds:
          - calculations.accumulation_exposure_check
          - calculations.accumulation_exposure_check.precision
          - validations.priority_23_ERR_PORT_ACCUMULATION_EXCEEDED
          - entities.Port.fields.port_accumulation_limit_amount
        distinguishing_aspect: |
          The port ledger comparison is strictly greater-than, so exposure
          landing EXACTLY on the limit must be accepted. With NLRTM limited to
          2310000.00, issuing two certificates of 1155000.00 each fills the
          ledger to exactly 2310000.00 and the second issue succeeds; a third
          certificate worth one cent then makes 2310000.01 and is rejected with
