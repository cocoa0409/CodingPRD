              captures: { prop_i_ver: "$.data.version" }
            - call: "POST /network/dues-proposals/${prop_i_id}/enact"
              payload: { expected_proposal_version: "${prop_i_ver}" }
              as: NetworkGovernanceOfficer
          assert:
            - "The first enact returns error_id ERR_INVALID_STATE with http 409 because the proposal is still DRAFT"
            - "The first enact does NOT return ERR_POOL_OVER_ALLOCATED even though the batch now owes 360001 against the 240001 pool, so the priority 7 state error outranks the priority 26 fiscal error"
            - "The second enact, sent after the proposal reaches PASSED, returns error_id ERR_POOL_OVER_ALLOCATED with http 422"
      - name: priority_safety_over_compliance
        grounds:
          - validations[priority=24]
          - validations[priority=11]
          - errors[ERR_ACK_LANGUAGE_VIOLATION]
        distinguishing_aspect: "A suspended station submitting a violating acknowledgment script must surface the safety failure rather than the state failure, reversing the outcome of the previous instance: the business_safety-versus-state pair resolves in favour of priority 23."
