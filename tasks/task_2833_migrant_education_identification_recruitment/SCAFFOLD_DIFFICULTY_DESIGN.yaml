              as: StateProgramAdmin
          assert:
            - "before the trigger: AgriculturalArea.${area_id}.assigned_primary_slots_used == 1 and RecruiterAssignment.${asg_a_id}.status == PLANNED"
            - "HTTP status is 422 and error.error_id == ERR_PEAK_SEASON_NOT_COVERED"
            - "error.error_id != ERR_AREA_COVERAGE_CAPACITY_EXCEEDED and the status is not 409"
            - "AgriculturalArea.${area_id}.assigned_primary_slots_used is still 1 and version is still ${area_v2} (the rejected write bumped nothing)"
            - "GET /mep/recruiter-assignments filtered by area_id ${area_id} still returns exactly one row"

  # =========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: pfs_flag_is_inclusive_at_exactly_the_60_point_threshold
        grounds:
          - calculations.pfs_priority_score
          - calculations.pfs_priority_score.constants.PFS_SCORE_THRESHOLD
          - endpoints[GET /mep/students/{student_id}/pfs-assessment]
          - endpoints[PATCH /mep/students/{student_id}]
          - entities.Student.fields.pfs_flag
        distinguishing_aspect: |
          The PFS threshold comparison is `pfs_score >= 60`, not `> 60`, and this instance pins the
          score to exactly 59 and then exactly 60 - never a value comfortably inside a band. With
          one verified move (18), 5 interrupted days (ceil(5/5)*4 = 4), both placement flags (28)
          and credit_deficit 3 (min(18, 9) = 9) the raw score is exactly 59 with pfs_flag false;
          moving to 10 interrupted days (8) and credit_deficit 2 (6) lands exactly on 60 and the
          flag must flip to true. An implementation using `>` fails only at this single point.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z startup default"
            - "one OPEN AgriculturalArea and one ACTIVE Recruiter"
            - "one ENROLLED Student with school_days_interrupted 5, math_below_grade true, reading_below_grade true and credit_deficit 3"
            - "one VERIFIED QualifyingMove dated 2026-06-15, inside the inclusive 365-day recency window ending 2026-08-01"
          setup_api_calls:
            - call: "POST /mep/areas"
              payload: { name: "Yakima Valley", state_code: "WA", primary_activity: "AGRICULTURE", peak_season_start_date: "2026-06-01", peak_season_end_date: "2026-09-30", recruiter_capacity: 3 }
              as: StateProgramAdmin
              captures: { area_id: $.data.id }
            - call: "POST /mep/recruiters"
              payload: { full_name: "Rosa Aguilar", state_code: "WA", credential_level: "BASIC", status: "ACTIVE" }
              as: StateProgramAdmin
              captures: { rec_a_id: $.data.id }
            - call: "POST /mep/students"
              payload: { full_name: "Mateo Reyes", birth_date: "2010-03-20", current_state_code: "WA", area_id: "${area_id}", schooling_status: "ENROLLED", grade_level: 9, school_days_interrupted: 5, math_below_grade: true, reading_below_grade: true, credit_deficit: 3 }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { stu_id: $.data.id }
            - call: "POST /mep/qualifying-moves"
              payload: { student_id: "${stu_id}", from_state_code: "CA", to_state_code: "WA", move_date: "2026-06-15", work_type: "AGRICULTURAL", worker_relationship: "PARENT", purpose: "SEEK_OR_OBTAIN_QUALIFYING_WORK", distance_miles: 820.50 }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { move_id: $.data.id }
            - call: "POST /mep/qualifying-moves/${move_id}/adjudicate"
              payload: { decision: "VERIFIED" }
              as: StateProgramAdmin
              captures: { move_status: $.data.status }
          trigger:
            - call: "GET /mep/students/${stu_id}/pfs-assessment"
              payload: {}
              as: ServiceCoordinator
              captures: { score_59: $.data.pfs_score, flag_59: $.data.pfs_flag, raw_59: $.data.raw_score }
            - call: "PATCH /mep/students/${stu_id}"
              payload: { school_days_interrupted: 10, credit_deficit: 2 }
              as: ServiceCoordinator
              captures: { score_60: $.data.pfs_score, flag_60: $.data.pfs_flag }
            - call: "GET /mep/students/${stu_id}/pfs-assessment"
              payload: {}
              as: ServiceCoordinator
              captures: { score_60_again: $.data.pfs_score, floor_60: $.data.floor_applied }
          assert:
            - "at 59 points the assessment returns pfs_variant == INTERRUPTION_WEIGHTED, recent_verified_moves == 1, move_band_points == 18, interruption_points == 4, academic_points == 28, credit_points == 9, credential_points == 0, language_points == 0"
            - "at 59 points raw_score == 59, pfs_score == 59 and pfs_flag == false (59 is one point below the threshold)"
            - "after the PATCH: Student.${stu_id}.pfs_score == 60 and Student.${stu_id}.pfs_flag == true - equality at the threshold sets the flag"
            - "after the PATCH the second assessment returns interruption_points == 8, credit_points == 6, raw_score == 60, pfs_score == 60, pfs_flag == true, floor_applied == false"
            - "the flag flipped on a one-point move, so an implementation comparing with `>` is distinguished"

      - name: term_end_on_is_the_inclusive_last_eligible_day_of_the_sweep
        grounds:
          - calculations.eligibility_term_sweep
          - calculations.eligibility_term_sweep.constants.EXPIRING_WINDOW_DAYS
          - calculations.eligibility_term_sweep.constants.REIDENTIFICATION_GRACE_DAYS
          - state_machines.EligibilityTerm.ACTIVE_to_EXPIRING
          - state_machines.EligibilityTerm.EXPIRING_to_EXPIRED
          - endpoints[POST /mep/eligibility-terms/sweep]
        distinguishing_aspect: |
          A DIFFERENT boundary in a DIFFERENT unit - whole calendar dates rather than integer
          points - and with the OPPOSITE strictness: expiry uses strictly-greater
          (now_date > term_end_on), so a sweep run on 2029-06-30 must leave the term un-expired
          while a sweep run one day later on 2029-07-01 must expire it and stamp
          reidentification_due_on = 2029-06-30 + 45 = 2029-08-14. An off-by-one implementation
          expires the student on their last eligible day.
        test_recipe:
          setup:
            - "one Student certified end-to-end at the 2026-08-01T00:00:00Z clock default, producing an ACTIVE EligibilityTerm 2026-07-01..2029-06-30"
            - "no other EligibilityTerm rows exist, so the sweep counters are unambiguous"
          setup_api_calls:
