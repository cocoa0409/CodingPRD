# =============================================================================
# §1.8 TEST TARGETING INDEX (Difficulty Design)
# Task: task_2634 — Labor & Delivery Unit Staffing and Perinatal Safety Bundles
# Companion to SCAFFOLD.yaml §1.0–§1.7. Nine §0.5 Difficulty Rules × 2 instances.
# Every instance grounds only in elements already declared in §1.1–§1.7.
# Logical clock is driven exclusively through POST /_clock/set_current_utc.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 — dual_variant_calc
  # Two calculations that each declare `variants:`, in DIFFERENT entity domains:
  #   (a) bundle_intervention_timeliness on SafetyBundleActivation
  #   (b) quality_measure_rates          on QualityMeasureSnapshot
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: hypertension_bundle_activation_anchored_100_vs_sequence_anchored_87_50
        grounds:
          - calculations.bundle_intervention_timeliness
          - calculations.bundle_intervention_timeliness.variants.activation_anchored
          - calculations.bundle_intervention_timeliness.variants.sequence_anchored
          - calculations.bundle_checklist_template
          - entities.SafetyBundleActivation.fields.timeliness_score
          - entities.SafetyBundleActivation.fields.sequence_adjusted_score
          - entities.SafetyBundleActivation.fields.on_time_step_count
          - entities.SafetyBundleActivation.fields.late_step_count
          - entities.BundleChecklistItem.fields.due_at_activation_anchored
          - entities.BundleChecklistItem.fields.due_at_sequence_anchored
          - state_machines.BundleChecklistItem.PENDING_to_COMPLETED
          - state_machines.SafetyBundleActivation.STAGE_2_ESCALATED_to_CONTROLLED
          - state_machines.SafetyBundleActivation.CONTROLLED_to_DEBRIEF_PENDING
        distinguishing_aspect: |
          The two variants differ ONLY in DUE(item): the authoritative
          activation_anchored variant uses the CUMULATIVE allowance measured from
          activated_at (+30/+90/+105/+125 for SEVERE_HYPERTENSION), while the
          advisory sequence_anchored variant chains each due date off the
          PREDECESSOR's actual completed_at. This fixture completes step 2
          (MAGNESIUM_LOADED) at activated_at+88 minutes, which is inside the
          cumulative deadline activated_at+90 but 3 minutes past the chained
          deadline completed_at(1)+60 = activated_at+85. Steps 1, 3 and 4 are
          on time under BOTH anchors. So the SAME four rows yield
          timeliness_score = 100.00 (4 on time / 4 applicable) and
          sequence_adjusted_score = 87.50 (100.0*(3 + 0.5*1)/4). An
          implementation that computes only one anchor, or that reuses the
          activation-anchored due dates for both, produces 100.00 in both fields
          — and the authoritative counters on_time_step_count/late_step_count
          must still follow the ACTIVATION anchor (4/0), never the sequence
          anchor (3/1). BundleChecklistItem.status likewise follows the
          authoritative anchor, so item 2 lands COMPLETED, not LATE_COMPLETED.
        test_recipe:
          setup: |
            One unit (4 licensed LDR beds, 1 OR room) with a single LDR bed, one
            RN staff member holding an ACTIVE CHARGE shift (which is what
            satisfies validation 12 ERR_PERFORMER_NOT_ON_CASE for every
            checklist completion), and one ANTEPARTUM singleton encounter at
            38 weeks. A SEVERE_HYPERTENSION bundle is activated at
            2026-08-01T06:00:00Z on a BP_THRESHOLD trigger (166/112, both above
            the 160/110 activation criteria of validation 11.5), minting the
            four-row template ANTIHYPERTENSIVE_GIVEN(30)/MAGNESIUM_LOADED(60)/
            REPEAT_BP(15)/OB_AT_BEDSIDE(20) with stage_gates 1/1/2/2. All four
            rows are completed, the clock being advanced to each completion
            instant first; the stage-2 escalation between step 2 and step 3 is
            what opens the stage_gate == 2 rows.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
            - call: POST /obstetric-units
              payload: { unit_name: "Ridgeview Womens Pavilion LDR", licensed_ldr_beds: 4, licensed_or_rooms: 1, max_daily_induction_bed_minutes: 2880 }
              as: PerinatalSafetyOfficer
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              captures: { bed_ldr_1: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Nadia Okonkwo RN", staff_role: "RN_LABOR_DELIVERY", fetal_monitoring_cert_level: "ADVANCED", credential_expires_at: "2027-06-30T00:00:00Z", or_circulating_qualified: false }
              as: PerinatalSafetyOfficer
              captures: { charge_staff_id: $.data.id }
            - call: POST /shift-assignments
              payload: { unit_id: "${unit_id}", staff_id: "${charge_staff_id}", role_slot: "CHARGE", shift_start_utc: "2026-08-01T05:00:00Z", shift_end_utc: "2026-08-01T15:00:00Z" }
              as: ChargeNurse
              as_user_id: "${charge_staff_id}"
              captures: { charge_shift_id: $.data.id }
            - call: POST /shift-assignments/${charge_shift_id}/activate
              payload: {}
              as: ChargeNurse
              as_user_id: "${charge_staff_id}"
            - call: POST /labor-encounters
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-HTN-4471", parity: 1, gestational_age_weeks: 38, prior_cesarean: false, fetus_count: 1, presentation: "VERTEX" }
              as: ChargeNurse
              as_user_id: "${charge_staff_id}"
              captures: { encounter_id: $.data.id }
            - call: POST /bundle-activations
              payload: { encounter_id: "${encounter_id}", bundle_type: "SEVERE_HYPERTENSION", activation_trigger: "BP_THRESHOLD", systolic_mmhg: 166, diastolic_mmhg: 112 }
              as: BedsideNurse
              as_user_id: "${charge_staff_id}"
              captures: { activation_id: $.data.id, activated_at: $.data.activated_at }
            - call: GET /bundle-activations/${activation_id}/checklist-items
              payload: { limit: 10, offset: 0 }
              as: ChargeNurse
              as_user_id: "${charge_staff_id}"
              captures: { item1_id: "$.data[0].id", item2_id: "$.data[1].id", item3_id: "$.data[2].id", item4_id: "$.data[3].id" }
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:25:00Z" }
              as: PerinatalSafetyOfficer
            - call: POST /bundle-activations/${activation_id}/checklist-items/${item1_id}/complete
              payload: { completed_at: "2026-08-01T06:25:00Z", performed_by_staff_id: "${charge_staff_id}" }
              as: BedsideNurse
              as_user_id: "${charge_staff_id}"
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T07:28:00Z" }
              as: PerinatalSafetyOfficer
            - call: POST /bundle-activations/${activation_id}/checklist-items/${item2_id}/complete
              payload: { completed_at: "2026-08-01T07:28:00Z", performed_by_staff_id: "${charge_staff_id}" }
              as: BedsideNurse
              as_user_id: "${charge_staff_id}"
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T07:30:00Z" }
              as: PerinatalSafetyOfficer
            - call: POST /bundle-activations/${activation_id}/escalate-stage
              payload: { target_stage: 2, systolic_mmhg: 168, diastolic_mmhg: 114 }
              as: ObstetricianAttending
              as_user_id: "${charge_staff_id}"
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T07:40:00Z" }
              as: PerinatalSafetyOfficer
            - call: POST /bundle-activations/${activation_id}/checklist-items/${item3_id}/complete
              payload: { completed_at: "2026-08-01T07:40:00Z", performed_by_staff_id: "${charge_staff_id}" }
              as: BedsideNurse
              as_user_id: "${charge_staff_id}"
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T07:58:00Z" }
              as: PerinatalSafetyOfficer
            - call: POST /bundle-activations/${activation_id}/checklist-items/${item4_id}/complete
              payload: { completed_at: "2026-08-01T07:58:00Z", performed_by_staff_id: "${charge_staff_id}" }
              as: BedsideNurse
              as_user_id: "${charge_staff_id}"
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: PerinatalSafetyOfficer
          trigger:
            - call: POST /bundle-activations/${activation_id}/resolve
              payload: {}
              as: ObstetricianAttending
              as_user_id: "${charge_staff_id}"
              captures: { resolved_timeliness: $.data.timeliness_score, resolved_sequence: $.data.sequence_adjusted_score }
          assert:
            - "SafetyBundleActivation.${activation_id}.timeliness_score == 100.00"
            - "SafetyBundleActivation.${activation_id}.sequence_adjusted_score == 87.50"
            - "SafetyBundleActivation.${activation_id}.on_time_step_count == 4"
            - "SafetyBundleActivation.${activation_id}.late_step_count == 0"
            - "SafetyBundleActivation.${activation_id}.missed_step_count == 0"
            - "SafetyBundleActivation.${activation_id}.highest_stage_reached == 2"
            - "SafetyBundleActivation.${activation_id}.status == DEBRIEF_PENDING"
            - "BundleChecklistItem.${item2_id}.status == COMPLETED"
            - "BundleChecklistItem.${item2_id}.due_at_activation_anchored == 2026-08-01T07:30:00Z"
            - "BundleChecklistItem.${item2_id}.due_at_sequence_anchored == 2026-08-01T07:25:00Z"
            - "BundleChecklistItem.${item2_id}.minutes_from_activation == 88"
            - "BundleChecklistItem.${item4_id}.due_at_activation_anchored == 2026-08-01T08:05:00Z"
            - "BundleChecklistItem.${item4_id}.due_at_sequence_anchored == 2026-08-01T08:00:00Z"
            - "ObstetricUnit.${unit_id}.bundle_breach_count == 0"

      - name: september_snapshot_delivery_cohort_33_3333_vs_admission_shadow_0_0000
        grounds:
          - calculations.quality_measure_rates
          - calculations.quality_measure_rates.variants.delivery_cohort
          - calculations.quality_measure_rates.variants.admission_cohort
          - entities.QualityMeasureSnapshot.fields.ntsv_cesarean_rate_pct
          - entities.QualityMeasureSnapshot.fields.shadow_ntsv_rate_pct
          - entities.QualityMeasureSnapshot.fields.composite_quality_index
          - entities.QualityMeasureSnapshot.fields.attribution_basis
          - entities.LaborEncounter.fields.admitted_at
          - entities.LaborEncounter.fields.delivery_recorded_at
          - entities.LaborEncounter.fields.is_ntsv
          - state_machines.LaborEncounter.SECOND_STAGE_to_THIRD_STAGE_DELIVERED
          - state_machines.EmergencyCesareanEvent.INCISION_RECORDED_to_DELIVERED
          - concurrency_rules[snapshot-create-stale-unit]
        distinguishing_aspect: |
          The two variants of quality_measure_rates differ ONLY in
          ATTRIBUTION_KEY: delivery_cohort keys the half-open window on
          delivery_recorded_at, admission_cohort keys it on admitted_at. One
          NTSV patient straddles the boundary — admitted 2026-08-31T22:00Z,
          cesarean delivery recorded 2026-09-01T03:00Z — so she is in the
          September DELIVERY cohort but not the September ADMISSION cohort. She
          is also the only cesarean. The authoritative
          ntsv_cesarean_rate_pct is therefore 1/3 -> 33.3333 while
          shadow_ntsv_rate_pct over the same snapshot is 0/2 -> 0.0000. An
          implementation that computes one cohort and copies it into both fields
          reports 33.3333 twice; one that keys the authoritative cohort on
          admitted_at reports 0.0000 as authoritative and silently loses a
          cesarean from the submitted measure. The instance simultaneously pins
          the ROUND-THEN-AVERAGE order: the 4dp components are 33.3333 and
          50.0000, so composite_quality_index = round_half_up(83.3333/2, 2) =
          round_half_up(41.66665, 2) = 41.67 — computed from the ALREADY-rounded
          components, and denominators are 3 and 2 respectively, never a single
          shared denominator.
        test_recipe:
          setup: |
            One unit with 3 LDR beds plus 1 OR bed and 7 staff members. A
            DECISION_TO_INCISION drill is documented at 18 measured minutes and
            validated by a second user, which lifts cesarean_readiness_state off
            NOT_READY to DEGRADED (no OR_STANDBY shift is staffed, and the
            rolling event window is still empty) — DEGRADED is what unblocks both
            mobilize-team for a CATEGORY_2_URGENT event and the SECOND_STAGE
            advance. Three NTSV-eligible encounters (parity 0, no prior cesarean,
            39 weeks, singleton, vertex) are then delivered inside the September
            1 window: E1 by emergency cesarean (admitted 2026-08-31T22:00Z,
            delivery_at 2026-09-01T03:00Z, decision-to-incision 22 minutes so
            met_target is true and the event closes without review), E2
            spontaneous vaginal WITH episiotomy, E3 spontaneous vaginal WITHOUT
            episiotomy. E2 and E3 each get their own BEDSIDE 1:1 nurse (a
            ONE_TO_ONE CareAssignment consumes the whole 4.0 capacity of its
            shift, so one nurse cannot cover both) and their own fresh
            CATEGORY_I assessment before each guarded advance.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-31T21:00:00Z" }
              as: PerinatalSafetyOfficer
            - call: POST /obstetric-units
              payload: { unit_name: "Harborline Perinatal Center LDR", licensed_ldr_beds: 4, licensed_or_rooms: 2, max_daily_induction_bed_minutes: 2880 }
              as: PerinatalSafetyOfficer
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
