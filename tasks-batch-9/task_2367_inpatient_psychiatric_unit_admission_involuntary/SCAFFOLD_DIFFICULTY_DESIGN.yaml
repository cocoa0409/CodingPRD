  - rule_id: transitive_cascade
    instances:
      - name: discharge_frees_bed_reopens_posture_and_promotes_queued_admission
        grounds:
          - state_machines.Admission.placement_status_PLACED_to_placement_status_DISCHARGED
          - state_machines.Unit.posture_CLOSED_to_posture_RESTRICTED_or_OPEN
          - calculations.unit_posture_and_effective_availability
          - calculations.queued_admission_promotion
          - entities.Bed.fields.status
        distinguishing_aspect: |
          Depth-4 chain rooted at Admission discharge: Admission -> DISCHARGED causes Bed ->
          AVAILABLE, which causes Unit.posture CLOSED -> RESTRICTED, which causes the queued
          admission to be promoted to PLACED, which flips the same Bed back to OCCUPIED and the
          Unit back to CLOSED — four distinct entities change and the fourth link is only reachable
          because promotion is exempt from the posture gate and the safety reserve.
        test_recipe:
          setup:
            - "Unit with exactly one LIGATURE_RESISTANT_OBSERVATION bed (701-A); licensed_placement_bed_count 1, restricted_threshold max(1, floor(1 * 0.20)) = 1, so with the bed free the posture is RESTRICTED and effective_available_bed_count is 0."
            - "Admission D1: adult MALE, evaluation scoring 12 (HIGH, recommended INVOLUNTARY_HOLD), opened VOLUNTARY, safety search COMPLETED, PLACED in 701-A under a psychiatrist posture override; the unit is then CLOSED with occupied_bed_count 1."
            - "Admission D1 has a secured discharge plan with follow_up_appointment_at 2026-09-12T13:00:00Z (inside the 14-day voluntary guarantee window ending 2026-09-17T08:00:00.000Z) and no restraint episodes."
            - "Admission D2: adult MALE, evaluation scoring 7 (MODERATE), opened VOLUNTARY, safety search COMPLETED, still PENDING_PLACEMENT because the unit is CLOSED."
            - "Logical clock fixed at 2026-09-03T08:00:00Z for the whole scenario."
