        grounds:
          - calculations.entitlement_ledger
          - state_machines.TroubleshootingSession.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity = call entitlements (count). Forward action: booking a
          session decrements remaining_calls 1 -> 0; compensating action: cancelling
          that session while the package is ACTIVE increments it back 0 -> 1.
          Invariant remaining_calls + count(sessions in {SCHEDULED, COMPLETED})
          == included_calls holds after every step.
        test_recipe:
