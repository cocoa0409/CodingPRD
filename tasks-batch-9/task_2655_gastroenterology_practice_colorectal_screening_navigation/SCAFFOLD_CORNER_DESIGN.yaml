scaffold_corner_design:
  - section: entities
    instances:
      - name: insurance_plan_creation_returns_full_row_and_envelope
        claim_type: creation
        grounds:
          - entities.InsurancePlan
          - endpoints.POST_/insurance-plans
          - response_envelope
        distinguishing_aspect: "A plan created with every optional term supplied echoes all nine business fields plus the four common fields, wrapped in the declared success envelope with response_type object and version 1."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PracticeAdmin
          trigger:
            - call: "POST /insurance-plans"
              payload: { plan_code: "P9", payer_name: "Northline Benefit", preventive_coverage_pct: 0.90, diagnostic_coinsurance_pct: 0.30, deductible_cents: 250000, out_of_pocket_max_cents: 600000, polypectomy_carveout: "PREVENTIVE_RETAINED", modifier_33_honored: false, anesthesia_bundled: true }
              as: PracticeAdmin
              captures: { plan_id: $.data.id, plan_v: $.data.version }
          assert:
            - "HTTP 201"
            - "the envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == object"
            - "InsurancePlan.${plan_id}.plan_code == P9 and payer_name == Northline Benefit"
            - "InsurancePlan.${plan_id}.preventive_coverage_pct == 0.90 and diagnostic_coinsurance_pct == 0.30"
            - "InsurancePlan.${plan_id}.deductible_cents == 250000 and out_of_pocket_max_cents == 600000"
            - "InsurancePlan.${plan_id}.polypectomy_carveout == PREVENTIVE_RETAINED, modifier_33_honored == false, anesthesia_bundled == true"
            - "${plan_v} == 1 and created_at == 2026-09-01T00:00:00.000Z"
      - name: patient_retrieval_returns_stored_row
        claim_type: retrieval
        grounds:
          - entities.Patient
          - endpoints.GET_/patients/{patient_id}
        distinguishing_aspect: "GET on a patient returns the stored row including the two money ledgers at 0 and the stratified risk_tier, not a recomputation from the request."
        test_recipe:
          setup:
            - "One plan and one patient with family_history_crc true"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /insurance-plans"
              payload: { plan_code: "P1", payer_name: "Meridian Health" }
              as: PracticeAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", birth_date: "1975-04-10", insurance_plan_id: "${plan_id}", family_history_crc: true, asa_class: 2 }
              as: PracticeAdmin
              captures: { pt_id: $.data.id }
          trigger:
            - call: "GET /patients/${pt_id}"
              payload: {}
              as: PracticeAdmin
              captures: { got_mrn: $.data.mrn, got_tier: $.data.risk_tier, got_d: $.data.deductible_applied_cents, got_o: $.data.oop_applied_cents, got_prio: $.data.navigation_priority }
          assert:
            - "HTTP 200"
            - "${got_mrn} == MRN-0001"
            - "${got_tier} == INCREASED"
            - "${got_d} == 0 and ${got_o} == 0"
            - "${got_prio} == ROUTINE"
            - "Patient.${pt_id}.insurance_plan_id == ${plan_id} and open_episode_count == 0"
      - name: patient_listing_filters_and_paginates
        claim_type: listing
        grounds:
          - endpoints.GET_/patients
          - response_envelope.pagination_fields
          - entities.Patient.fields.risk_tier
        distinguishing_aspect: "Three patients exist, two of them HIGH risk; filtering by risk_tier HIGH with limit 1 must report total_count 2 and has_more true rather than paginating the unfiltered set of three."
        test_recipe:
          setup:
            - "One plan and three patients - two with prior_crc_history true (HIGH) and one plain (AVERAGE)"
          setup_api_calls:
            - call: "POST /insurance-plans"
              payload: { plan_code: "P1", payer_name: "Meridian Health" }
              as: PracticeAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", birth_date: "1975-04-10", insurance_plan_id: "${plan_id}", prior_crc_history: true }
              as: PracticeAdmin
              captures: { pt_a: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0002", birth_date: "1972-06-22", insurance_plan_id: "${plan_id}", ibd_diagnosis: true }
              as: PracticeAdmin
              captures: { pt_b: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0003", birth_date: "1970-02-14", insurance_plan_id: "${plan_id}" }
              as: PracticeAdmin
              captures: { pt_c: $.data.id }
          trigger:
            - call: "GET /patients"
              payload: { risk_tier: "HIGH", limit: 1, offset: 0 }
              as: PatientNavigator
              captures: { first_id: "$.data[0].id" }
            - call: "GET /patients"
              payload: { risk_tier: "HIGH", limit: 1, offset: 1 }
              as: PatientNavigator
              captures: { second_id: "$.data[0].id" }
          assert:
            - "both calls return HTTP 200 with response_type == array"
            - "the first call reports limit 1, offset 0, total_count 2 and has_more true"
            - "the second call reports limit 1, offset 1, total_count 2 and has_more false"
            - "${first_id} and ${second_id} are the two HIGH patients ${pt_a} and ${pt_b} in created_at ascending order"
            - "${pt_c} appears in neither page"
      - name: unknown_booking_id_returns_booking_not_found
        claim_type: not_found
        grounds:
          - endpoints.GET_/procedure-bookings/{booking_id}
          - errors.ERR_BOOKING_NOT_FOUND
          - validations.priority_4
        distinguishing_aspect: "A syntactically valid UUID that matches no ProcedureBooking row returns ERR_BOOKING_NOT_FOUND with HTTP 404 and the error envelope, not an empty 200."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "GET /procedure-bookings/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PracticeAdmin
              captures: { eid: $.data.error_id, emsg: $.data.message }
          assert:
            - "HTTP 404"
            - "${eid} == ERR_BOOKING_NOT_FOUND"
            - "response_type == error and ${emsg} is a non-empty string"
      - name: session_create_missing_window_end_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints.POST_/endoscopy-sessions
          - validations.priority_3_ERR_INVALID_REQUEST
        distinguishing_aspect: "window_end_utc has source input with no default, so omitting it must be rejected at priority 3 before the lead-endoscopist FK at priority 5 is consulted - the request also names a non-existent lead to prove the ordering."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /endoscopy-sessions"
              payload: { room_code: "ENDO-1", session_date: "2026-09-15", window_start_utc: "2026-09-15T13:00:00Z", lead_endoscopist_id: "00000000-0000-4000-8000-000000000000" }
              as: PracticeAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "HTTP 400"
            - "${eid} == ERR_INVALID_REQUEST, not ERR_CLINICIAN_NOT_FOUND"
            - "no EndoscopySession row was created"
      - name: session_and_plan_defaults_applied_when_omitted
        claim_type: defaults
        grounds:
          - entities.EndoscopySession.fields.anesthesia_mode
          - entities.EndoscopySession.fields.turnover_minutes
          - entities.QualityPeriod.fields.attribution_basis
          - entities.Patient.fields.anticoagulant_therapy
        distinguishing_aspect: "Omitting every optional field yields the declared defaults - session status DRAFT, the default anesthesia mode and turnover, patient ledgers 0 with navigation_priority ROUTINE, and QualityPeriod.attribution_basis PROCEDURE_DATE - and the resulting capacity_minutes is still computed from the window."
        test_recipe:
          setup:
            - "One plan, one endoscopist"
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { npi: "1000000001", full_name: "Dr Ada Ng", clinician_type: "ENDOSCOPIST" }
              as: PracticeAdmin
              captures: { endo_id: $.data.id, bench0: $.data.adr_benchmark_pct, cred0: $.data.credential_status }
          trigger:
            - call: "POST /endoscopy-sessions"
              payload: { room_code: "ENDO-1", session_date: "2026-09-15", window_start_utc: "2026-09-15T13:00:00Z", window_end_utc: "2026-09-15T21:00:00Z", lead_endoscopist_id: "${endo_id}" }
              as: PracticeAdmin
              captures: { sess_id: $.data.id, mode: $.data.anesthesia_mode, turn: $.data.turnover_minutes, st: $.data.status, cap: $.data.capacity_minutes, booked: $.data.booked_minutes }
            - call: "POST /quality-periods"
              payload: { endoscopist_id: "${endo_id}", period_start_date: "2026-09-01", period_end_date: "2026-09-30" }
              as: QualityOfficer
              captures: { qp_id: $.data.id, basis: $.data.attribution_basis, qp_st: $.data.status }
          assert:
            - "${cred0} == ACTIVE and ${bench0} == 0.25 (Clinician defaults)"
            - "${st} == DRAFT and ${cap} == 480 and ${booked} == 0"
            - "${mode} == MODERATE_SEDATION and ${turn} == 15"
            - "${basis} == PROCEDURE_DATE and ${qp_st} == OPEN"
            - "QualityPeriod.${qp_id}.screening_colonoscopy_count == 0 and remediation_required == false"
      - name: pathology_report_findings_fields_are_computed_from_specimens
        claim_type: computed_fields
        grounds:
          - entities.PathologyReport.fields.adenoma_count
          - entities.PathologyReport.fields.largest_adenoma_mm
          - entities.PathologyReport.fields.villous_component
          - entities.PathologyReport.fields.adenocarcinoma_present
        distinguishing_aspect: "All five findings fields are derived from the specimens array alone - one tubulovillous adenoma at 9mm, one hyperplastic polyp and one sessile serrated lesion give adenoma_count 1, largest_adenoma_mm 9 (the hyperplastic 14mm specimen is not an adenoma), sessile_serrated_count 1, villous_component true and adenocarcinoma_present false."
        setup_note: "Reuses the completed-booking chain; only the specimens payload is unusual."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z"
            - "A MODERATE_SEDATION block on 2026-09-15 with one 45-minute booking whose exam is COMPLETED with 3 specimens"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /insurance-plans"
              payload: { plan_code: "P1", payer_name: "Meridian Health", deductible_cents: 150000, diagnostic_coinsurance_pct: 0.20 }
              as: PracticeAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /clinicians"
              payload: { npi: "1000000001", full_name: "Dr Ada Ng", clinician_type: "ENDOSCOPIST", adr_benchmark_pct: 0.25 }
              as: PracticeAdmin
              captures: { endo_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", birth_date: "1975-04-10", insurance_plan_id: "${plan_id}", asa_class: 2 }
              as: PracticeAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /endoscopy-sessions"
              payload: { room_code: "ENDO-1", session_date: "2026-09-15", window_start_utc: "2026-09-15T13:00:00Z", window_end_utc: "2026-09-15T21:00:00Z", lead_endoscopist_id: "${endo_id}", anesthesia_mode: "MODERATE_SEDATION", turnover_minutes: 15, max_procedures: 8 }
              as: PracticeAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /endoscopy-sessions/${sess_id}/status-actions"
              payload: { action: "PUBLISH" }
              as: PracticeAdmin
              captures: { sess_v: $.data.version }
            - call: "POST /screening-episodes"
              payload: { patient_id: "${pt_id}", indication: "SCREENING_AVERAGE_RISK" }
              as: ReferralCoordinator
              captures: { ep_id: $.data.id }
            - call: "POST /endoscopy-sessions/${sess_id}/procedure-bookings"
              payload: { episode_id: "${ep_id}", performing_endoscopist_id: "${endo_id}", slot_start_utc: "2026-09-15T13:00:00Z", duration_minutes: 45, expected_session_version: "${sess_v}" }
              as: ReferralCoordinator
              captures: { bk_id: $.data.id }
            - call: "POST /screening-episodes/${ep_id}/outreach"
              payload: { channel: "PHONE", acknowledged: true }
              as: PatientNavigator
            - call: "POST /screening-episodes/${ep_id}/prep-attestation"
              payload: { regimen_completed: true }
              as: Patient
              as_user_id: "${pt_id}"
            - call: "POST /procedure-bookings/${bk_id}/check-in"
              payload: {}
              as: PatientNavigator
            - call: "POST /procedure-bookings/${bk_id}/start"
              payload: {}
              as: Endoscopist
              as_user_id: "${endo_id}"
            - call: "POST /procedure-bookings/${bk_id}/complete"
              payload: { prep_quality_bbps: 8, polyps_removed_count: 3, largest_polyp_mm: 14, specimen_count: 3 }
              as: Endoscopist
              as_user_id: "${endo_id}"
          trigger:
            - call: "POST /procedure-bookings/${bk_id}/pathology-reports"
              payload: { accession_number: "ACC-0001", specimens: [ { label: "A", histology: "TUBULOVILLOUS_ADENOMA", size_mm: 9 }, { label: "B", histology: "HYPERPLASTIC", size_mm: 14 }, { label: "C", histology: "SESSILE_SERRATED_LESION", size_mm: 6 } ] }
              as: Pathologist
              captures: { rep_id: $.data.id, ad: $.data.adenoma_count, ssl: $.data.sessile_serrated_count, big: $.data.largest_adenoma_mm, vil: $.data.villous_component, ca: $.data.adenocarcinoma_present, hgd: $.data.high_grade_dysplasia, st: $.data.status }
          assert:
            - "HTTP 201 and ${st} == RECEIVED"
            - "${ad} == 1 and ${ssl} == 1"
            - "${big} == 9 - the 14mm hyperplastic specimen is not an adenoma"
            - "${vil} == true and ${ca} == false"
            - "${hgd} == false (default applied)"
            - "PathologyReport.${rep_id}.amendment_count == 0, finalized_at is null and routed_to_endoscopist_id is null"
      - name: referral_system_fields_ignore_client_supplied_values
        claim_type: system_fields
        grounds:
          - entities.Referral.fields.status
          - entities.Referral.fields.info_request_rounds
          - entities.Referral.fields.risk_screen_result
          - endpoints.POST_/referrals
        distinguishing_aspect: "status, info_request_rounds, risk_screen_result and triage_decision_note are source system, and POST /referrals declares none of them as input - the row is always born SUBMITTED / 0 / PENDING / null with a server-minted UUID id and version 1."
        test_recipe:
          setup:
            - "One plan and one patient"
          setup_api_calls:
            - call: "POST /insurance-plans"
              payload: { plan_code: "P1", payer_name: "Meridian Health" }
              as: PracticeAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", birth_date: "1975-04-10", insurance_plan_id: "${plan_id}", asa_class: 2 }
              as: PracticeAdmin
              captures: { pt_id: $.data.id }
          trigger:
            - call: "POST /referrals"
              payload: { patient_id: "${pt_id}", referring_provider_npi: "3000000001", reason: "FAMILY_HISTORY", asa_class_reported: 2 }
              as: ReferralCoordinator
              captures: { ref_id: $.data.id, st: $.data.status, rounds: $.data.info_request_rounds, screen: $.data.risk_screen_result, ver: $.data.version }
          assert:
            - "HTTP 201"
            - "${st} == SUBMITTED, ${rounds} == 0, ${screen} == PENDING and ${ver} == 1"
            - "Referral.${ref_id}.triage_decision_note is null and anticoagulant_reported == false (default)"
            - "${ref_id} is a server-minted UUID with no type prefix"
      - name: enum_and_range_constraints_are_enforced
        claim_type: type_constraints
        grounds:
          - entities.Patient.fields.asa_class
          - entities.ScreeningEpisode.fields.indication
          - response_envelope.pagination_defaults
          - validations.priority_3_ERR_INVALID_REQUEST
        distinguishing_aspect: "Three distinct constraint families all collapse to ERR_INVALID_REQUEST at priority 3 - an integer outside its declared 1-5 bound, an enum member that is not declared, and a limit outside the 1-100 pagination bound."
        test_recipe:
          setup:
            - "One plan and one patient"
          setup_api_calls:
            - call: "POST /insurance-plans"
              payload: { plan_code: "P1", payer_name: "Meridian Health" }
              as: PracticeAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", birth_date: "1975-04-10", insurance_plan_id: "${plan_id}", asa_class: 2 }
              as: PracticeAdmin
              captures: { pt_id: $.data.id }
          trigger:
            - call: "POST /patients"
              payload: { mrn: "MRN-0002", birth_date: "1972-06-22", insurance_plan_id: "${plan_id}", asa_class: 6 }
              as: PracticeAdmin
            - call: "POST /screening-episodes"
              payload: { patient_id: "${pt_id}", indication: "SCREENING_LOW_RISK" }
              as: ReferralCoordinator
            - call: "GET /patients"
              payload: { limit: 101 }
              as: PracticeAdmin
          assert:
            - "all three calls return HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "no second Patient row and no ScreeningEpisode row were created"
      - name: booking_requires_an_existing_parent_session_in_the_path
        claim_type: parent_relationships
        grounds:
          - entities.ProcedureBooking.parent
          - validations.priority_4
          - errors.ERR_SESSION_NOT_FOUND
        distinguishing_aspect: "ProcedureBooking is parented by EndoscopySession through the URL, so an unknown session_id is rejected at priority 4 with ERR_SESSION_NOT_FOUND before the body's episode_id FK (priority 5) or the OCC version (priority 16) are examined - the body deliberately carries a bad episode_id and a nonsense version too."
        test_recipe:
          setup:
            - "One plan, one endoscopist, one patient, no sessions"
          setup_api_calls:
            - call: "POST /insurance-plans"
              payload: { plan_code: "P1", payer_name: "Meridian Health" }
              as: PracticeAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /clinicians"
              payload: { npi: "1000000001", full_name: "Dr Ada Ng", clinician_type: "ENDOSCOPIST" }
              as: PracticeAdmin
              captures: { endo_id: $.data.id }
          trigger:
            - call: "POST /endoscopy-sessions/00000000-0000-4000-8000-000000000000/procedure-bookings"
              payload: { episode_id: "00000000-0000-4000-8000-000000000001", performing_endoscopist_id: "${endo_id}", slot_start_utc: "2026-09-15T13:00:00Z", duration_minutes: 45, expected_session_version: "${plan_id}" }
              as: ReferralCoordinator
              captures: { eid: $.data.error_id }
          assert:
            - "HTTP 404"
            - "${eid} == ERR_SESSION_NOT_FOUND, not ERR_EPISODE_NOT_FOUND and not ERR_STALE_SESSION_VERSION"
      - name: self_referential_episode_edge_is_validated
        claim_type: graph_topology
        grounds:
          - entities.ScreeningEpisode.fields.preceding_episode_id
          - entities.ScreeningEpisode.fields.origin
          - validations.priority_5
        distinguishing_aspect: "ScreeningEpisode carries a self-referential FK, which is what makes the topology a graph: a valid preceding_episode_id derives origin SURVEILLANCE_RECALL, while an unknown one is refused at priority 5 with ERR_EPISODE_NOT_FOUND before the duplicate-open-episode rule at priority 34 can fire."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z"
            - "One plan, one patient aged 51, one OPEN SCREENING_AVERAGE_RISK episode"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /insurance-plans"
              payload: { plan_code: "P1", payer_name: "Meridian Health" }
              as: PracticeAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", birth_date: "1975-04-10", insurance_plan_id: "${plan_id}", asa_class: 2 }
              as: PracticeAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /screening-episodes"
              payload: { patient_id: "${pt_id}", indication: "SCREENING_AVERAGE_RISK" }
              as: ReferralCoordinator
              captures: { ep1: $.data.id }
          trigger:
            - call: "POST /screening-episodes"
              payload: { patient_id: "${pt_id}", indication: "SURVEILLANCE", preceding_episode_id: "${ep1}" }
              as: ReferralCoordinator
              captures: { ep2: $.data.id, origin2: $.data.origin, elig2: $.data.eligibility_status }
            - call: "POST /screening-episodes"
              payload: { patient_id: "${pt_id}", indication: "SURVEILLANCE", preceding_episode_id: "00000000-0000-4000-8000-000000000000" }
              as: ReferralCoordinator
              captures: { eid: $.data.error_id }
          assert:
            - "the first trigger call returns 201 with ${origin2} == SURVEILLANCE_RECALL and ${elig2} == ELIGIBLE"
            - "ScreeningEpisode.${ep2}.preceding_episode_id == ${ep1} and ScreeningEpisode.${ep1}.preceding_episode_id is null"
            - "the second trigger call returns HTTP 404 with ${eid} == ERR_EPISODE_NOT_FOUND, not ERR_DUPLICATE_OPEN_EPISODE"
            - "Patient.${pt_id}.open_episode_count == 2 and navigation_priority == HIGH after the first trigger call"
      - name: coverage_children_are_reachable_from_their_session
        claim_type: parent_relationships
        grounds:
          - endpoints.GET_/anesthesia-coverage
          - entities.AnesthesiaCoverage.fields.session_id
          - endpoints.GET_/endoscopy-sessions/{session_id}
        distinguishing_aspect: "The AnesthesiaCoverage-to-EndoscopySession edge is traversable in reverse through the filtered list endpoint, and a released row is still listed with status RELEASED rather than disappearing - the FK stays valid after release."
        test_recipe:
          setup:
            - "Two PUBLISHED MAC blocks on 2026-09-15 with disjoint windows, each staffed once by the same anesthesia clinician whose max_overlapping_rooms is 1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /clinicians"
              payload: { npi: "1000000001", full_name: "Dr Ada Ng", clinician_type: "ENDOSCOPIST" }
              as: PracticeAdmin
              captures: { endo_id: $.data.id }
            - call: "POST /clinicians"
              payload: { npi: "2000000001", full_name: "Dr Bo Reyes", clinician_type: "ANESTHESIA", max_overlapping_rooms: 1 }
              as: PracticeAdmin
              captures: { anes_id: $.data.id }
            - call: "POST /endoscopy-sessions"
              payload: { room_code: "ENDO-1", session_date: "2026-09-15", window_start_utc: "2026-09-15T13:00:00Z", window_end_utc: "2026-09-15T17:00:00Z", lead_endoscopist_id: "${endo_id}", anesthesia_mode: "MAC" }
              as: PracticeAdmin
              captures: { s1: $.data.id }
            - call: "POST /endoscopy-sessions/${s1}/status-actions"
              payload: { action: "PUBLISH" }
              as: PracticeAdmin
            - call: "POST /endoscopy-sessions"
              payload: { room_code: "ENDO-2", session_date: "2026-09-15", window_start_utc: "2026-09-15T17:00:00Z", window_end_utc: "2026-09-15T21:00:00Z", lead_endoscopist_id: "${endo_id}", anesthesia_mode: "MAC" }
              as: PracticeAdmin
              captures: { s2: $.data.id }
            - call: "POST /endoscopy-sessions/${s2}/status-actions"
              payload: { action: "PUBLISH" }
              as: PracticeAdmin
            - call: "POST /endoscopy-sessions/${s1}/anesthesia-coverage"
              payload: { anesthesia_clinician_id: "${anes_id}", coverage_start_utc: "2026-09-15T13:00:00Z", coverage_end_utc: "2026-09-15T17:00:00Z" }
              as: PracticeAdmin
