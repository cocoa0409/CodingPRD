              as: AssetRecoveryAnalyst
              as_user_id: "analyst-2"
            - call: "POST /loss-assessments/${la1_id}/chargeback-resolution"
              payload: { action: "REVERSE", resolution_notes: "Keg recovered by the distributor; charge withdrawn." }
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-2"
          assert:
            - "PRE: Brewer.${b1_id}.chargeback_balance_cents == 0, status == ACTIVE, status_reason == null; FloatAgreement.${fa1_id}.float_posture == HEALTHY with billed_amount_cents == 15136"
            - "MID: after the UPHELD, LossAssessment.${la1_id}.net_chargeback_cents == 28200 with chargeback_status == ISSUED"
            - "MID: Brewer.${b1_id}.chargeback_balance_cents == 28200, status == PROBATION, status_reason == CHARGEBACK_BALANCE_THRESHOLD"
            - "MID: FloatAgreement.${fa1_id}.float_posture == SUSPENDED while KegPool.${p1_id}.posture == OPEN at available_pct 30.00"
