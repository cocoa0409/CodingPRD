              as: PlatformAdmin
            - call: "POST /rescue/contributions"
              payload: { donor_person_id: "${donor_id}", amount_cents: 20000, donor_reference: "SPON-R", designated_animal_id: "${animal_id}", designated_program: "NONE", restriction_category: "UNRESTRICTED" }
              as: FinanceOfficer
              captures: { contrib_id: $.data.id, avail_at_create: $.data.available_cents }
            - call: "GET /rescue/organizations/${org_id}"
              payload: {}
              as: PlatformAdmin
              captures: { unrestricted_before: $.data.unrestricted_balance_cents }
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rescue/adoption-applications"
              payload: { animal_id: "${animal_id}", applicant_person_id: "${adopter_id}" }
              as: PlatformAdmin
              captures: { app_id: $.data.id }
            - call: "POST /rescue/adoption-applications/${app_id}/screen"
              payload: { decision: "APPROVE" }
              as: AdoptionCounselor
              as_user_id: "counselor-1"
            - call: "GET /rescue/animals/${animal_id}"
              payload: {}
              as: PlatformAdmin
              captures: { animal_v: $.data.version }
          trigger:
            - call: "POST /rescue/adoptions"
              payload: { adoption_application_id: "${app_id}", expected_animal_version: "${animal_v}", credit_application_order: "WAIVER_FIRST", refund_basis: "FEE_PAID", deposit_basis: "FLAT" }
              as: AdoptionCounselor
              as_user_id: "counselor-2"
              captures: { adopt_id: $.data.id, residual: $.data.residual_credit_cents }
            - call: "GET /rescue/contributions/${contrib_id}"
              payload: {}
              as: FinanceOfficer
              captures: { applied: $.data.applied_cents, released: $.data.released_cents, available: $.data.available_cents, contrib_status: $.data.status }
            - call: "GET /rescue/organizations/${org_id}"
              payload: {}
              as: PlatformAdmin
              captures: { unrestricted_after: $.data.unrestricted_balance_cents }
          assert:
            - "avail_at_create == 20000"
            - "unrestricted_before == 20000"
            - "residual == 10000"
            - "applied == 10000"
            - "released == 10000"
            - "available == 0"
            - "applied + released + available == 20000"
            - "contrib_status == RELEASED"
            - "unrestricted_after == 10000"
            - "Adoption.${adopt_id}.adopter_charged_cents == 0"

