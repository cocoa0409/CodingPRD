            - call: "POST /api/auction-items/${item_1}/close"
              payload: {}
              as: AuctionManager
              as_user_id: "auc-1"
            - call: "POST /api/events/${ev_id}/start-settlement"
              payload: {}
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { ev_posture: $.data.posture }
          trigger:
            - call: "POST /api/auction-items/${item_1}/bids"
              payload: { bidder_id: "${b_a}", amount_cents: 20000 }
              as: Bidder
              as_user_id: "${b_a}"
              captures: { err_id: $.data.error_id }
          assert:
            - "${ev_posture} == RESTRICTED"
            - "${err_id} == ERR_EVENT_RESTRICTED"
            - "HTTP status == 409"
            - "AuctionItem.${item_1}.listing_status == PASSED"

      - name: ad_approval_rejected_because_sponsor_still_pending
        grounds:
          - state_machines.ProgramAd.IN_REVIEW_to_APPROVED
          - validations[priority=16]
          - entities.Sponsor.fields.status
          - errors[ERR_SPONSOR_NOT_CONFIRMED]
        distinguishing_aspect: |
          Entity pair ProgramAd -> Sponsor (a different pair from Bid -> GalaEvent): the
          IN_REVIEW -> APPROVED transition is legal only when the ad's Sponsor.status is
          CONFIRMED; approving under a PENDING sponsor returns ERR_SPONSOR_NOT_CONFIRMED, and
          the same call succeeds once the sponsorship cash is recorded.
        test_recipe:
          setup:
            - "Clock at 2026-07-05T00:00:00Z; event in DRAFT."
            - "Sponsor Acme with commitment 250000 still PENDING (no cash recorded)."
            - "One ProgramAd for that sponsor in IN_REVIEW."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/events"
              payload: { name: "Harbor Light Gala", event_start_utc: "2026-09-12T23:00:00Z", event_end_utc: "2026-09-13T04:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
            - call: "POST /api/sponsors"
              payload: { event_id: "${ev_id}", org_name: "Acme Foundry", tier: "GOLD", commitment_cents: 250000 }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { sp_1: $.data.id }
            - call: "POST /api/program-ads"
              payload: { sponsor_id: "${sp_1}", event_id: "${ev_id}", ad_size: "FULL_PAGE", artwork_ref: "art-v1" }
              as: Sponsor
              as_user_id: "${sp_1}"
              captures: { ad_1: $.data.id }
            - call: "POST /api/program-ads/${ad_1}/review"
              payload: { decision: "BEGIN_REVIEW" }
              as: EventOrganizer
              as_user_id: "org-1"
          trigger:
            - call: "POST /api/program-ads/${ad_1}/review"
              payload: { decision: "APPROVE" }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { err_id: $.data.error_id }
            - call: "POST /api/sponsors/${sp_1}/confirm"
              payload: { paid_amount_cents: 250000 }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { sp_status: $.data.status }
            - call: "POST /api/program-ads/${ad_1}/review"
              payload: { decision: "APPROVE" }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { ad_status: $.data.status }
          assert:
            - "${err_id} == ERR_SPONSOR_NOT_CONFIRMED"
            - "${sp_status} == CONFIRMED"
            - "${ad_status} == APPROVED"
            - "Sponsor.${sp_1}.paid_amount_cents == 250000"

  - rule_id: resource_temporal_overlap
    instances:
      - name: live_channel_windows_are_half_open_adjacency_allowed
        grounds:
          - validations[priority=22]
          - state_machines.AuctionItem.DRAFT_to_OPEN
          - entities.AuctionItem.fields.live_lot_sequence
          - errors[ERR_LOT_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Interval semantics on the AuctionItem stage-channel resource are HALF-OPEN
          [open_at_utc, close_at_utc) with no buffer: a lot starting exactly when another ends
          opens cleanly, while a lot whose window strictly straddles the other is rejected.
        test_recipe:
          setup:
            - "Clock at 2026-07-05T19:30:00Z; event PUBLISHED with posture OPEN."
            - "Three LIVE lots on live_lot_sequence 1: A [18:00,20:00), C [19:00,21:00), B [20:00,22:00) on 2026-07-05."
            - "Lot A is already OPEN."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T19:30:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/events"
              payload: { name: "Harbor Light Gala", event_start_utc: "2026-09-12T23:00:00Z", event_end_utc: "2026-09-13T04:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
            - call: "POST /api/events/${ev_id}/tables"
              payload: { table_name: "T1", seat_count: 10, table_price_cents: 1250000, seat_price_cents: 12533 }
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/events/${ev_id}/publish"
              payload: {}
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/auction-items"
              payload: { event_id: "${ev_id}", title: "Lot A", item_type: "LIVE", starting_bid_cents: 10000, min_increment_cents: 500, estimated_fmv_cents: 4000, open_at_utc: "2026-07-05T18:00:00Z", close_at_utc: "2026-07-05T20:00:00Z", live_lot_sequence: 1 }
              as: AuctionManager
              as_user_id: "auc-1"
              captures: { item_a: $.data.id }
            - call: "POST /api/auction-items"
              payload: { event_id: "${ev_id}", title: "Lot C", item_type: "LIVE", starting_bid_cents: 10000, min_increment_cents: 500, estimated_fmv_cents: 4000, open_at_utc: "2026-07-05T19:00:00Z", close_at_utc: "2026-07-05T21:00:00Z", live_lot_sequence: 1 }
              as: AuctionManager
              as_user_id: "auc-1"
              captures: { item_c: $.data.id }
            - call: "POST /api/auction-items"
              payload: { event_id: "${ev_id}", title: "Lot B", item_type: "LIVE", starting_bid_cents: 10000, min_increment_cents: 500, estimated_fmv_cents: 4000, open_at_utc: "2026-07-05T20:00:00Z", close_at_utc: "2026-07-05T22:00:00Z", live_lot_sequence: 1 }
              as: AuctionManager
              as_user_id: "auc-1"
              captures: { item_b: $.data.id }
            - call: "POST /api/auction-items/${item_a}/open"
              payload: {}
              as: AuctionManager
              as_user_id: "auc-1"
          trigger:
            - call: "POST /api/auction-items/${item_c}/open"
              payload: {}
              as: AuctionManager
              as_user_id: "auc-1"
              captures: { err_id: $.data.error_id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T20:00:00Z" }
              as: AuctionManager
              as_user_id: "auc-1"
            - call: "POST /api/auction-items/${item_b}/open"
              payload: {}
              as: AuctionManager
              as_user_id: "auc-1"
              captures: { b_status: $.data.listing_status }
          assert:
            - "${err_id} == ERR_LOT_WINDOW_CONFLICT"
            - "${b_status} == OPEN"
            - "AuctionItem.${item_c}.listing_status == DRAFT"
            - "GalaEvent.${ev_id}.open_lot_count == 2"

      - name: table_hold_buffer_accepts_exactly_fifteen_minute_gap
        grounds:
          - validations[priority=23]
          - entities.TableHold.fields.hold_start_utc
          - entities.TableHold.fields.hold_end_utc
          - errors[ERR_TABLE_HOLD_CONFLICT]
        distinguishing_aspect: |
          Interval semantics on the TicketTable resource are CLOSED intervals plus a
          15-minute turnover buffer on both sides: a hold starting 10 minutes after the
          incumbent ends is rejected, while a hold starting exactly 15 minutes after it
          ends is accepted - a different geometry from the buffer-free half-open lot windows.
        test_recipe:
          setup:
            - "Clock at 2026-07-05T00:00:00Z; event PUBLISHED with posture OPEN."
            - "Table T1 carries one HELD hold for bidder A over [2026-07-05T18:00:00Z, 2026-07-05T20:00:00Z]."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/events"
              payload: { name: "Harbor Light Gala", event_start_utc: "2026-09-12T23:00:00Z", event_end_utc: "2026-09-13T04:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
            - call: "POST /api/events/${ev_id}/tables"
              payload: { table_name: "T1", seat_count: 10, table_price_cents: 1250000, seat_price_cents: 12533 }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { tbl_id: $.data.id }
            - call: "POST /api/bidders"
              payload: { event_id: "${ev_id}", display_name: "Ada Lovelace", email: "ada@example.org", paddle_number: 101, payment_method_on_file: true }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { b_a: $.data.id }
            - call: "POST /api/bidders"
              payload: { event_id: "${ev_id}", display_name: "Grace Hopper", email: "grace@example.org", paddle_number: 102, payment_method_on_file: true }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { b_b: $.data.id }
            - call: "POST /api/events/${ev_id}/publish"
              payload: {}
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/table-holds"
              payload: { table_id: "${tbl_id}", bidder_id: "${b_a}", hold_start_utc: "2026-07-05T18:00:00Z", hold_end_utc: "2026-07-05T20:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { hold_1: $.data.id }
          trigger:
            - call: "POST /api/table-holds"
              payload: { table_id: "${tbl_id}", bidder_id: "${b_b}", hold_start_utc: "2026-07-05T20:10:00Z", hold_end_utc: "2026-07-05T21:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { err_id: $.data.error_id }
            - call: "POST /api/table-holds"
              payload: { table_id: "${tbl_id}", bidder_id: "${b_b}", hold_start_utc: "2026-07-05T20:15:00Z", hold_end_utc: "2026-07-05T21:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { hold_2: $.data.id, hold_2_status: $.data.status }
          assert:
            - "${err_id} == ERR_TABLE_HOLD_CONFLICT"
            - "${hold_2_status} == HELD"
            - "TableHold.${hold_1}.status == HELD"
            - "TicketTable.${tbl_id}.seats_reserved == 0"

  - rule_id: compensating_invariant
    instances:
      - name: payment_void_restores_event_gross_collected_to_zero
        grounds:
          - state_machines.PaymentTransaction.CAPTURED_to_VOIDED
          - state_machines.CheckoutInvoice.PAID_to_PENDING_PAYMENT
          - entities.GalaEvent.fields.gross_collected_cents
          - entities.CheckoutInvoice.fields.amount_paid_cents
        distinguishing_aspect: |
          Conserved quantity = MONEY. The invariant
          GalaEvent.gross_collected_cents == sum(CheckoutInvoice.amount_paid_cents over the
          event) == sum(PaymentTransaction.amount_cents where status == CAPTURED)
          holds both before the capture (0) and after the compensating void (0), with no drift.
        test_recipe:
          setup:
            - "Clock at 2026-07-05T00:00:00Z; event PUBLISHED; bidder A with a card on file."
            - "One AWARDED lot at hammer 12500 on a finalized invoice paid in full by finance user fin-1, so gross_collected_cents == 12500."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/events"
              payload: { name: "Harbor Light Gala", event_start_utc: "2026-09-12T23:00:00Z", event_end_utc: "2026-09-13T04:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
            - call: "POST /api/events/${ev_id}/tables"
              payload: { table_name: "T1", seat_count: 10, table_price_cents: 1250000, seat_price_cents: 12533 }
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/bidders"
              payload: { event_id: "${ev_id}", display_name: "Ada Lovelace", email: "ada@example.org", paddle_number: 101, payment_method_on_file: true }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { b_a: $.data.id }
            - call: "POST /api/events/${ev_id}/publish"
              payload: {}
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/auction-items"
              payload: { event_id: "${ev_id}", title: "Napa Weekend", item_type: "SILENT", starting_bid_cents: 10000, min_increment_cents: 500, estimated_fmv_cents: 4000, open_at_utc: "2026-07-04T00:00:00Z", close_at_utc: "2026-07-30T00:00:00Z" }
              as: AuctionManager
              as_user_id: "auc-1"
              captures: { item_1: $.data.id }
            - call: "POST /api/auction-items/${item_1}/open"
              payload: {}
              as: AuctionManager
              as_user_id: "auc-1"
            - call: "POST /api/auction-items/${item_1}/bids"
              payload: { bidder_id: "${b_a}", amount_cents: 12500 }
              as: Bidder
              as_user_id: "${b_a}"
            - call: "POST /api/auction-items/${item_1}/close"
              payload: {}
              as: AuctionManager
              as_user_id: "auc-1"
              captures: { inv_1: $.data.invoice_id }
            - call: "POST /api/invoices/${inv_1}/finalize"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-1"
            - call: "POST /api/payments"
              payload: { invoice_id: "${inv_1}", amount_cents: 12500, method: "CARD" }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { pay_1: $.data.id }
          trigger:
            - call: "POST /api/payments/${pay_1}/void"
              payload: { reason: "Card chargeback received from processor." }
              as: FinanceOfficer
              as_user_id: "fin-2"
              captures: { pay_status: $.data.status }
            - call: "GET /api/events/${ev_id}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-2"
              captures: { gross_after: $.data.gross_collected_cents, unpaid_after: $.data.unpaid_invoice_count }
          assert:
            - "${pay_status} == VOIDED"
            - "${gross_after} == 0"
            - "${unpaid_after} == 1"
            - "CheckoutInvoice.${inv_1}.amount_paid_cents == 0"
            - "CheckoutInvoice.${inv_1}.status == PENDING_PAYMENT"
            - "CheckoutInvoice.${inv_1}.balance_due_cents == 12500"
            - "AuctionItem.${item_1}.settlement_status == INVOICED"
            - "PaymentTransaction.${pay_1}.voided_by_user_id == fin-2"

      - name: ticket_order_cancel_restores_table_seat_inventory
        grounds:
          - state_machines.TicketOrder.UNBILLED_to_REFUNDED
          - entities.TicketTable.fields.seats_reserved
          - entities.TicketOrder.fields.seating_status
          - calculations.ticket_order_total
        distinguishing_aspect: |
          Conserved quantity = SEAT INVENTORY (a different conserved quantity from money):
          the invariant TicketTable.seats_reserved == sum(TicketOrder.seat_count where
          payment_status != REFUNDED and seating_status != RELEASED) equals 3 after the order
          and returns to exactly 0 after the compensating cancel.
        test_recipe:
          setup:
            - "Clock at 2026-07-05T00:00:00Z; event PUBLISHED; table T1 with 10 seats; bidder A registered."
            - "One SEAT ticket order for 3 seats priced at 33840 cents, so seats_reserved == 3."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/events"
              payload: { name: "Harbor Light Gala", event_start_utc: "2026-09-12T23:00:00Z", event_end_utc: "2026-09-13T04:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
            - call: "POST /api/events/${ev_id}/tables"
              payload: { table_name: "T1", seat_count: 10, table_price_cents: 1250000, seat_price_cents: 12533 }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { tbl_id: $.data.id }
            - call: "POST /api/bidders"
              payload: { event_id: "${ev_id}", display_name: "Ada Lovelace", email: "ada@example.org", paddle_number: 101, payment_method_on_file: true }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { b_a: $.data.id }
            - call: "POST /api/events/${ev_id}/publish"
              payload: {}
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/ticket-orders"
              payload: { event_id: "${ev_id}", bidder_id: "${b_a}", table_id: "${tbl_id}", order_type: "SEAT", seat_count: 3 }
              as: Bidder
              as_user_id: "${b_a}"
              captures: { to_1: $.data.id, to_sub: $.data.subtotal_cents }
            - call: "GET /api/tables/${tbl_id}"
              payload: {}
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { seats_before: $.data.seats_reserved }
          trigger:
            - call: "POST /api/ticket-orders/${to_1}/cancel"
              payload: {}
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { pay_status: $.data.payment_status, seat_status: $.data.seating_status }
            - call: "GET /api/tables/${tbl_id}"
              payload: {}
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { seats_after: $.data.seats_reserved, tbl_status: $.data.status }
          assert:
            - "${to_sub} == 33840"
            - "${seats_before} == 3"
            - "${pay_status} == REFUNDED"
            - "${seat_status} == RELEASED"
            - "${seats_after} == 0"
            - "${tbl_status} == AVAILABLE"
