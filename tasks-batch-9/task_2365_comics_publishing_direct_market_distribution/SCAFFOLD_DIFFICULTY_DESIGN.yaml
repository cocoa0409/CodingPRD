  - rule_id: transitive_cascade
    instances:
      - name: late_delivery_cascades_stage_to_issue_to_solicitation_to_order_to_retailer_tier
        grounds:
          - state_machines.ProductionStage.IN_PROGRESS_to_DELIVERED
          - state_machines.Solicitation.ACCEPTED_to_WITHDRAWN
          - state_machines.Issue.commercial_status.FOC_LOCKED_to_UNSOLICITED
          - state_machines.RetailerOrder.FOC_LOCKED_to_CANCELLED
          - calculations.stage_slip_days
          - calculations.schedule_health_posture
          - calculations.retailer_discount_tier
          - calculations.catalog_slot_rollup
        distinguishing_aspect: |
          A depth-4 chain from a single deliver call, where every hop exists only because the previous
          one fired: (1) slip_days 83 makes issue.total_slip_days 83, which flips schedule_health to
          SLIPPED; (2) because it became SLIPPED this request, the ACCEPTED solicitation is withdrawn and
          the issue's commercial dimension falls FOC_LOCKED -> UNSOLICITED; (3) because that solicitation
          was withdrawn, the catalog's accepted_slot_count drops to 0 and the FOC_LOCKED retailer order
          is cancelled; (4) because that order was cancelled, the retailer's cumulative_units_ytd falls
          back to 2440 and its discount_tier demotes BASIC -> ENTRY. A slip of 21 days instead of 83
          stops the chain at hop 1.
        test_recipe:
          setup:
            - "logical clock advanced 2026-08-01 -> 2026-08-21 -> 2026-11-11"
            - "creator 'Wanda Writer' (SCRIPT) with an ACCEPTED assignment on a GREENLIT title"
            - "Issue #1 target on sale 2026-12-02, one SCRIPT stage due 2026-08-20 left IN_PROGRESS (production_status SCRIPTING)"
            - "covers: STANDARD 399, 1:10 incentive 399, 1:25 incentive 599 capped at 4"
            - "catalog 2026-08 (deadline 2026-08-20, on sale 2026-12, max_slots 5) with the issue's solicitation ACCEPTED and the catalog PUBLISHED, so commercial_status == SOLICITED"
            - "retailer 'Panel Palace' opening_units_ytd 2440 (ENTRY), credit_limit 1000000, ack true"
            - "that retailer's 100-copy order FOC_LOCKED at the 2026-11-11 cut-off, so total_units == 114, retailer cumulative_units_ytd == 2554 and discount_tier == BASIC"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ManagingEditor
            - call: "POST /comics/creators"
              payload: { full_name: "Wanda Writer", crafts: ["SCRIPT"], default_page_rate_cents: 12000 }
              as: EditorInChief
              captures: { cr_w: $.data.id }
            - call: "POST /comics/titles"
              payload: { name: "Nebula Knights", planned_issue_count: 6, royalty_pool_bps: 1200, cover_participation_bps: 1500 }
              as: EditorInChief
              captures: { t1: $.data.id }
            - call: "POST /comics/titles/${t1}/greenlight"
              payload: {}
              as: EditorInChief
              captures: { tv1: $.data.version }
            - call: "POST /comics/titles/${t1}/creative-assignments"
              payload: { creator_id: "${cr_w}", craft: "SCRIPT", page_rate_cents: 12000, royalty_share_bps: 4000, booking_start_date: "2026-08-01", booking_end_date: "2026-12-01", expected_title_version: "${tv1}" }
              as: EditorInChief
              captures: { a_w: $.data.id }
            - call: "POST /comics/creative-assignments/${a_w}/accept"
              payload: {}
              as: Creator
              as_user_id: "${cr_w}"
            - call: "POST /comics/titles/${t1}/issues"
              payload: { issue_number: 1, page_count: 22, cover_price_cents: 399, target_on_sale_date: "2026-12-02" }
              as: ManagingEditor
              captures: { i1: $.data.id }
            - call: "POST /comics/issues/${i1}/production-stages"
              payload: { assignment_id: "${a_w}", craft: "SCRIPT", planned_start_date: "2026-08-01", planned_due_date: "2026-08-20" }
