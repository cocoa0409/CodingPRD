            - { call: "POST /surveillance/employees", payload: { full_name: "Pg 09", employee_ref: "EMP-P09", department: "TRADING", attestation_due_at: "2027-01-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /surveillance/employees", payload: { full_name: "Pg 10", employee_ref: "EMP-P10", department: "TRADING", attestation_due_at: "2027-01-01T00:00:00Z" }, as: ComplianceAdmin }
