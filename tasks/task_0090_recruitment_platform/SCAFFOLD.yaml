scenario: |
  Vertical recruitment platform: company verification with business-license verification, authorized-HR-account binding, industry-and-size tagging, verification-tier (basic/premium), periodic re-verification, and blacklist handling; job posting and review with job-information template, salary-range and benefit fields, posting-quota by package, prohibited-content review (discriminatory wording/illegal terms), on-shelf and off-shelf workflow, and duplicate-posting detection; resume submission with candidate profile and attachment, one-click apply, anti-spam rate-limiting, application-status feedback (read/forwarded/interview/rejected/closed), and candidate-side privacy controls on resume visibility; interview scheduling (multi-round / multi-interviewer) with interview-round configuration, interviewer-panel assembly, interviewer-availability matching, candidate-side time selection, conflict detection, interview-mode (onsite/phone/video) configuration, and interview-feedback collection per round; offer management with offer-letter template, internal approval workflow (hiring manager / HR / finance), offer-issuance to candidate, candidate-acceptance window, offer-rescission rules, and competing-offer handling notes; onboarding tracking with start-date confirmation, pre-onboarding checklist (background-check/medical), no-show handling, probation-period and conversion-decision tracking, and onboarding-feedback survey for both sides; headhunter commission with headhunter contract and fee model (success-fee/retainer/hybrid), commission-trigger event (offer-acceptance/onboarding/probation-pass), clawback rules on early departure, tax handling, and periodic settlement; event-driven synchronization with calendar, IM, video-conferencing, and background-check service systems; audit logging for status changes and commission records.

domain_name: recruitment-platform
api_prefix: /recruitment

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - cascading_side_effects
    - scheduled_deferred_actions
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Company
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Legal company name as on business license.
      - name: business_license_number
        type: string
        source: input
        description: Government-issued business-license identifier.
        constraints: unique across all Company rows
      - name: industry
        type: enum
        source: input
        description: Industry tag.
        constraints: one of {TECH, FINANCE, MANUFACTURING, RETAIL, HEALTHCARE, EDUCATION, OTHER}
      - name: size_band
        type: enum
        source: input
        description: Headcount band.
        constraints: one of {SMALL, MEDIUM, LARGE, ENTERPRISE}
      - name: verification_status
        type: enum
        source: computed
        description: Verification lifecycle state.
        constraints: one of {DRAFT, PENDING, VERIFIED, EXPIRED, BLACKLISTED}
        default: DRAFT
      - name: verification_tier
        type: enum
        source: input
        description: Service tier selected at verification.
        constraints: one of {BASIC, PREMIUM}
        default: BASIC
      - name: verified_at
        type: datetime
        source: computed
        description: Timestamp of last successful verification.
      - name: reverification_due_at
        type: datetime
        source: computed
        description: When current verification expires (verified_at + 365 days).
      - name: authorized_hr_user_ids
        type: array
        source: computed
        description: Currently bound HR user ids (subset of HrUser rows).
      - name: active_job_posting_count
        type: integer
        source: computed
        description: Count of JobPosting rows owned by this Company with status in {LIVE}.
      - name: posting_quota_limit
        type: integer
        source: computed
        description: Maximum concurrent LIVE postings allowed; derived from verification_tier (BASIC=5, PREMIUM=25).
      - name: blacklist_reason
        type: string
        source: input
        description: Reason for blacklisting (admin-supplied).

  - name: HrUser
    parent: null
    common_fields: true
    fields:
      - name: company_id
        type: string
        source: input
        description: Foreign key to Company.id this HR account is bound to.
      - name: email
        type: string
        source: input
        description: HR contact email.
        constraints: unique across all HrUser rows
      - name: display_name
        type: string
        source: input
        description: Visible HR name.
      - name: binding_status
        type: enum
        source: computed
        description: Binding lifecycle on the Company.
        constraints: one of {PENDING, ACTIVE, REVOKED}
        default: PENDING

  - name: JobPosting
    parent: null
    common_fields: true
    fields:
      - name: company_id
        type: string
        source: input
        description: Owning Company.id.
      - name: title
        type: string
        source: input
        description: Job title.
      - name: description
        type: string
        source: input
        description: Free-form job description body.
      - name: salary_min_cents
        type: integer
        source: input
        description: Minimum monthly salary in cents.
      - name: salary_max_cents
        type: integer
        source: input
        description: Maximum monthly salary in cents.
      - name: benefits
        type: array
        source: input
        description: Array of benefit string tags (e.g., MEAL, HOUSING, EQUITY).
      - name: posting_status
        type: enum
        source: computed
        description: Posting lifecycle.
        constraints: one of {DRAFT, UNDER_REVIEW, REJECTED, LIVE, OFF_SHELF, EXPIRED}
        default: DRAFT
      - name: review_rejection_reason
        type: enum
        source: computed
        description: If REJECTED, the categorized reason.
        constraints: one of {DISCRIMINATORY_WORDING, ILLEGAL_TERMS, DUPLICATE, OTHER}
      - name: content_fingerprint
        type: string
        source: computed
        description: lowercase(title) || "|" || sha256(lowercase(description)); used for duplicate-posting detection.
      - name: listed_at
        type: datetime
        source: computed
        description: When the posting first transitioned to LIVE.
      - name: off_shelf_at
        type: datetime
        source: computed
        description: When the posting moved to OFF_SHELF or EXPIRED.
      - name: application_count
        type: integer
        source: computed
        description: Count of Application rows referencing this posting.

  - name: Candidate
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Candidate display name.
      - name: email
        type: string
        source: input
        description: Candidate contact email.
        constraints: unique across all Candidate rows
      - name: resume_attachment_url
        type: string
        source: input
        description: Pointer to uploaded resume attachment.
      - name: visibility_mode
        type: enum
        source: input
        description: Resume visibility control.
        constraints: one of {PUBLIC, COMPANY_ONLY, HIDDEN}
        default: PUBLIC
      - name: visible_to_company_ids
        type: array
        source: input
        description: When visibility_mode=COMPANY_ONLY, the whitelisted Company.id list.
      - name: last_application_at
        type: datetime
        source: computed
        description: Timestamp of most recent Application creation by this candidate.
      - name: applications_last_60s_count
        type: integer
        source: computed
        description: Number of Application rows by this candidate created in last 60 seconds (rolling).

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: candidate_id
        type: string
        source: input
        description: Foreign key to Candidate.id.
      - name: job_posting_id
        type: string
        source: input
        description: Foreign key to JobPosting.id.
      - name: company_id
        type: string
        source: computed
        description: Denormalized from JobPosting.company_id at creation; never recomputed.
      - name: application_status
        type: enum
        source: computed
        description: Application lifecycle.
        constraints: one of {SUBMITTED, READ, FORWARDED, INTERVIEW, REJECTED, CLOSED}
        default: SUBMITTED
      - name: read_at
        type: datetime
        source: computed
        description: When status first moved to READ.
      - name: forwarded_at
        type: datetime
        source: computed
        description: When status first moved to FORWARDED.
      - name: source_channel
        type: enum
        source: input
        description: How the application was created.
        constraints: one of {DIRECT, ONE_CLICK, HEADHUNTER}
        default: DIRECT
      - name: headhunter_contract_id
        type: string
        source: input
        description: When source_channel=HEADHUNTER, the originating HeadhunterContract.id.

  - name: InterviewRound
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: Foreign key to Application.id.
      - name: round_index
        type: integer
        source: input
        description: 1-based round ordinal within the Application.
        constraints: unique together with application_id
      - name: mode
        type: enum
        source: input
        description: Interview mode.
        constraints: one of {ONSITE, PHONE, VIDEO}
      - name: interviewer_user_ids
        type: array
        source: input
        description: HrUser.id list comprising the interviewer panel.
      - name: candidate_time_slot_options
        type: array
        source: input
        description: Array of ISO8601 datetime strings offered to the candidate.
      - name: scheduled_start_at
        type: datetime
        source: computed
        description: Selected slot once candidate confirms.
      - name: scheduled_end_at
        type: datetime
        source: computed
        description: scheduled_start_at + 60 minutes (fixed for all modes).
      - name: round_status
        type: enum
        source: computed
        description: Round lifecycle.
        constraints: one of {DRAFT, AWAITING_CANDIDATE, SCHEDULED, FEEDBACK_PENDING, PASSED, FAILED, CANCELLED}
        default: DRAFT
      - name: feedback_decision
        type: enum
        source: computed
        description: Panel decision once feedback is collected.
        constraints: one of {PASS, FAIL, HOLD}

  - name: Offer
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: Foreign key to Application.id (1:1).
        constraints: unique across all Offer rows
      - name: company_id
        type: string
        source: computed
        description: Denormalized from Application at creation.
      - name: base_salary_cents
        type: integer
        source: input
        description: Annual base salary in cents.
      - name: sign_on_bonus_cents
        type: integer
        source: input
        description: One-off sign-on bonus in cents (>= 0).
      - name: offer_status
        type: enum
        source: computed
        description: Offer lifecycle.
        constraints: one of {DRAFT, PENDING_HM, PENDING_HR, PENDING_FINANCE, ISSUED, ACCEPTED, DECLINED, EXPIRED, RESCINDED}
        default: DRAFT
      - name: hm_approver_user_id
        type: string
        source: computed
        description: HrUser.id of the hiring manager who approved.
      - name: hr_approver_user_id
        type: string
        source: computed
        description: HrUser.id of the HR approver.
      - name: finance_approver_user_id
        type: string
        source: computed
        description: HrUser.id of the finance approver.
      - name: issued_at
        type: datetime
        source: computed
        description: When the offer transitioned to ISSUED.
      - name: acceptance_deadline_at
        type: datetime
        source: computed
        description: issued_at + 168 hours (7 days). Hard expiry boundary.
      - name: accepted_at
        type: datetime
        source: computed
        description: When candidate accepted.
      - name: competing_offer_note
        type: string
        source: input
        description: Free-form note from candidate about a competing offer.
      - name: rescission_reason
        type: enum
        source: computed
        description: Categorized rescission reason.
        constraints: one of {BUSINESS_NEED, BACKGROUND_FAIL, CANDIDATE_MISREP, OTHER}

  - name: Onboarding
    parent: null
    common_fields: true
    fields:
      - name: offer_id
        type: string
        source: input
        description: Foreign key to Offer.id (1:1).
        constraints: unique across all Onboarding rows
      - name: start_date
        type: datetime
        source: input
        description: Confirmed first-day date.
      - name: background_check_status
        type: enum
        source: computed
        description: Background-check sub-state.
        constraints: one of {PENDING, PASSED, FAILED, WAIVED}
        default: PENDING
      - name: medical_check_status
        type: enum
        source: computed
        description: Medical-check sub-state.
        constraints: one of {PENDING, PASSED, FAILED, WAIVED}
        default: PENDING
      - name: onboarding_status
        type: enum
        source: computed
        description: Onboarding lifecycle.
        constraints: one of {SCHEDULED, CHECKS_RUNNING, READY, ONBOARDED, NO_SHOW, PROBATION_PASSED, PROBATION_FAILED}
        default: SCHEDULED
      - name: probation_end_at
        type: datetime
        source: computed
        description: start_date + 90 days. Probation conversion decision must be recorded by this time.
      - name: candidate_feedback_score
        type: integer
        source: input
        description: Candidate-side 1-5 onboarding feedback score.
      - name: employer_feedback_score
        type: integer
        source: input
        description: Employer-side 1-5 onboarding feedback score.

  - name: HeadhunterContract
    parent: null
    common_fields: true
    fields:
      - name: headhunter_user_id
        type: string
        source: input
        description: HeadhunterUser.id signing the contract.
      - name: company_id
        type: string
        source: input
        description: Counterparty Company.id.
      - name: fee_model
        type: enum
        source: input
        description: Commercial model.
        constraints: one of {SUCCESS_FEE, RETAINER, HYBRID}
      - name: success_fee_pct_bps
        type: integer
        source: input
        description: Success-fee percentage in basis points (e.g., 2000 = 20%). Used by SUCCESS_FEE and HYBRID.
      - name: retainer_amount_cents
        type: integer
        source: input
        description: Flat retainer amount in cents. Used by RETAINER and HYBRID.
      - name: trigger_event
        type: enum
        source: input
        description: Commission-trigger event.
        constraints: one of {OFFER_ACCEPTED, ONBOARDED, PROBATION_PASSED}
      - name: clawback_window_days
        type: integer
        source: input
        description: Number of days post-trigger during which clawback applies if candidate departs.
        default: 90
      - name: tax_withholding_pct_bps
        type: integer
        source: input
        description: Tax withholding on commission in basis points.
        default: 1000
      - name: contract_status
        type: enum
        source: computed
        description: Contract lifecycle.
        constraints: one of {ACTIVE, SUSPENDED, TERMINATED}
        default: ACTIVE

  - name: CommissionRecord
    parent: null
    common_fields: false
    fields:
      - name: headhunter_contract_id
        type: string
        source: input
        description: Foreign key to HeadhunterContract.id.
      - name: application_id
        type: string
        source: input
        description: Foreign key to Application.id (the placement).
      - name: gross_commission_cents
        type: integer
        source: computed
        description: Pre-tax commission amount (see calc commission_gross_amount).
      - name: tax_withheld_cents
        type: integer
        source: computed
        description: Tax withheld (see calc commission_tax_withheld).
      - name: net_settlement_cents
        type: integer
        source: computed
        description: gross_commission_cents - tax_withheld_cents - any clawback applied.
      - name: settlement_status
        type: enum
        source: computed
        description: Settlement lifecycle.
        constraints: one of {ACCRUED, SETTLED, CLAWED_BACK}
        default: ACCRUED
      - name: trigger_kind
        type: enum
        source: computed
        description: Echo of HeadhunterContract.trigger_event at the moment of accrual.
        constraints: one of {OFFER_ACCEPTED, ONBOARDED, PROBATION_PASSED}
      - name: settled_at
        type: datetime
        source: computed
        description: When settlement_status flipped to SETTLED (during sweep).
      - name: clawback_amount_cents
        type: integer
        source: computed
        description: Amount returned if early departure; 0 otherwise.

  - name: AuditEvent
    parent: null
    common_fields: false
    fields:
      - name: subject_entity
        type: enum
        source: system
        description: Entity type whose state changed.
        constraints: one of {Company, JobPosting, Application, InterviewRound, Offer, Onboarding, CommissionRecord}
      - name: subject_id
        type: string
        source: system
        description: Id of the subject entity row.
      - name: event_kind
        type: enum
        source: system
        description: Why this audit row was written.
        constraints: one of {STATE_TRANSITION, COMMISSION_ACCRUED, COMMISSION_SETTLED, COMMISSION_CLAWBACK}
      - name: from_state
        type: string
        source: system
        description: Pre-transition state (null when event_kind != STATE_TRANSITION).
      - name: to_state
        type: string
        source: system
        description: Post-transition state (null when event_kind != STATE_TRANSITION).
      - name: actor_role
        type: string
        source: system
        description: X-User-Role of the actor (or "system" for auto-transitions).
      - name: actor_user_id
        type: string
        source: system
        description: X-User-ID of the actor (or "system").

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Company
    initial_state: DRAFT
    terminal_states: [BLACKLISTED]
    transitions:
      - from: DRAFT
        to: PENDING
        trigger: "POST /recruitment/companies/{id}/submit-verification"
        actor: HrUser
        preconditions:
          - "business_license_number is set"
          - "industry and size_band are set"
          - "verification_tier is set"
        side_effects:
          - "Write AuditEvent{kind=STATE_TRANSITION}"
      - from: PENDING
        to: VERIFIED
        trigger: "POST /recruitment/companies/{id}/approve-verification"
        actor: PlatformAdmin
        preconditions:
          - "company.verification_status == PENDING"
        side_effects:
          - "Set verified_at = now(); set reverification_due_at = verified_at + 365 days"
          - "Recompute posting_quota_limit from verification_tier (BASIC=5, PREMIUM=25)"
          - "Write AuditEvent{kind=STATE_TRANSITION}"
      - from: PENDING
        to: DRAFT
        trigger: "POST /recruitment/companies/{id}/reject-verification"
        actor: PlatformAdmin
        preconditions:
          - "company.verification_status == PENDING"
        side_effects:
          - "Write AuditEvent{kind=STATE_TRANSITION}"
        note: "Revert to DRAFT for HR to fix and resubmit (cyclic loop)."
      - from: VERIFIED
        to: EXPIRED
        trigger: "POST /recruitment/_clock/advance (auto when now() >= reverification_due_at)"
        actor: system
        preconditions:
          - "now() >= reverification_due_at"
        side_effects:
          - "Cascade: every JobPosting owned by this Company with posting_status==LIVE moves to OFF_SHELF (which itself triggers the JobPosting OFF_SHELF side-effects, including the Application closure cascade)"
          - "Write AuditEvent{kind=STATE_TRANSITION}"
      - from: EXPIRED
        to: PENDING
        trigger: "POST /recruitment/companies/{id}/submit-verification"
        actor: HrUser
        preconditions:
          - "company.verification_status == EXPIRED"
        side_effects:
          - "Write AuditEvent{kind=STATE_TRANSITION}"
      - from: VERIFIED
        to: BLACKLISTED
        trigger: "POST /recruitment/companies/{id}/blacklist"
        actor: PlatformAdmin
        preconditions:
          - "blacklist_reason is supplied"
        side_effects:
          - "Cascade: every JobPosting owned by this Company with posting_status in {DRAFT, UNDER_REVIEW, LIVE} moves to OFF_SHELF (recursively triggering Application closures)"
          - "Cascade: every active HeadhunterContract for this Company moves to TERMINATED"
          - "Write AuditEvent{kind=STATE_TRANSITION}"
      - from: DRAFT
        to: BLACKLISTED
        trigger: "POST /recruitment/companies/{id}/blacklist"
        actor: PlatformAdmin
        preconditions:
          - "blacklist_reason is supplied"
        side_effects:
          - "Write AuditEvent{kind=STATE_TRANSITION}"
      - from: PENDING
        to: BLACKLISTED
        trigger: "POST /recruitment/companies/{id}/blacklist"
        actor: PlatformAdmin
        preconditions:
          - "blacklist_reason is supplied"
        side_effects:
          - "Write AuditEvent{kind=STATE_TRANSITION}"

  - entity: JobPosting
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /recruitment/job-postings/{id}/submit-review"
        actor: HrUser
        preconditions:
          - "owning Company.verification_status == VERIFIED"
          - "salary_min_cents <= salary_max_cents and both > 0"
        side_effects:
          - "Compute content_fingerprint"
          - "Write AuditEvent{kind=STATE_TRANSITION}"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /recruitment/job-postings/{id}/reject"
        actor: PlatformAdmin
        preconditions:
          - "review_rejection_reason supplied"
        side_effects:
          - "Set review_rejection_reason"
          - "Write AuditEvent{kind=STATE_TRANSITION}"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /recruitment/job-postings/{id}/revise"
        actor: HrUser
        preconditions: []
        side_effects:
          - "Clear review_rejection_reason"
          - "Write AuditEvent{kind=STATE_TRANSITION}"
        note: "Cyclic: REJECTED → DRAFT → UNDER_REVIEW loop for revisions."
      - from: UNDER_REVIEW
        to: LIVE
        trigger: "POST /recruitment/job-postings/{id}/approve"
        actor: PlatformAdmin
        preconditions:
          - "owning Company.active_job_posting_count < posting_quota_limit"
          - "no other JobPosting with posting_status==LIVE and identical content_fingerprint for the same company_id"
        side_effects:
          - "Set listed_at = now()"
          - "Increment Company.active_job_posting_count (derived field reconciliation)"
          - "Write AuditEvent{kind=STATE_TRANSITION}"
      - from: LIVE
        to: OFF_SHELF
        trigger: "POST /recruitment/job-postings/{id}/take-off-shelf  OR  cascade from Company"
        actor: HrUser | system
        preconditions: []
        side_effects:
          - "Set off_shelf_at = now()"
          - "Decrement Company.active_job_posting_count"
          - "Cascade: every Application referencing this posting whose application_status is in {SUBMITTED, READ, FORWARDED} moves to CLOSED — that closure itself cancels any InterviewRound rows in non-terminal states (a depth-3 transitive chain originating at JobPosting OFF_SHELF)"
          - "Write AuditEvent{kind=STATE_TRANSITION}"
      - from: LIVE
        to: EXPIRED
        trigger: "POST /recruitment/_clock/advance (auto when now() >= listed_at + 30 days)"
        actor: system
        preconditions:
          - "now() >= listed_at + 30 days"
        side_effects:
          - "Set off_shelf_at = now()"
          - "Decrement Company.active_job_posting_count"
          - "Cascade: same as OFF_SHELF — Applications in {SUBMITTED, READ, FORWARDED} close, cancelling non-terminal InterviewRound rows"
          - "Write AuditEvent{kind=STATE_TRANSITION}"

  - entity: Application
    initial_state: SUBMITTED
    terminal_states: [REJECTED, CLOSED]
    transitions:
      - from: SUBMITTED
        to: READ
        trigger: "POST /recruitment/applications/{id}/mark-read"
        actor: HrUser
        preconditions:
          - "JobPosting.posting_status == LIVE"
        side_effects:
          - "Set read_at = now()"
          - "Write AuditEvent{kind=STATE_TRANSITION}"
      - from: READ
        to: FORWARDED
        trigger: "POST /recruitment/applications/{id}/forward"
        actor: HrUser
        preconditions:
          - "Candidate.visibility_mode allows acting Company (PUBLIC, or COMPANY_ONLY with company in visible_to_company_ids)"
        side_effects:
          - "Set forwarded_at = now()"
          - "Write AuditEvent{kind=STATE_TRANSITION}"
      - from: FORWARDED
        to: INTERVIEW
        trigger: "POST /recruitment/applications/{id}/interview-rounds  (first round creation)"
        actor: HrUser
        preconditions:
          - "no existing InterviewRound for this application"
        side_effects:
          - "Create InterviewRound{round_index=1, round_status=DRAFT}"
          - "Write AuditEvent{kind=STATE_TRANSITION}"
      - from: INTERVIEW
        to: REJECTED
        trigger: "POST /recruitment/applications/{id}/reject"
        actor: HrUser
        preconditions: []
        side_effects:
          - "Cascade: every InterviewRound with round_status in {DRAFT, AWAITING_CANDIDATE, SCHEDULED, FEEDBACK_PENDING} moves to CANCELLED"
          - "Write AuditEvent{kind=STATE_TRANSITION}"
      - from: SUBMITTED
        to: CLOSED
        trigger: "Cascade from JobPosting OFF_SHELF or EXPIRED"
        actor: system
        preconditions: []
        side_effects:
          - "Write AuditEvent{kind=STATE_TRANSITION}"
      - from: READ
        to: CLOSED
        trigger: "Cascade from JobPosting OFF_SHELF or EXPIRED"
        actor: system
        preconditions: []
        side_effects:
          - "Write AuditEvent{kind=STATE_TRANSITION}"
      - from: FORWARDED
        to: CLOSED
        trigger: "Cascade from JobPosting OFF_SHELF or EXPIRED"
        actor: system
        preconditions: []
        side_effects:
          - "Cancel any InterviewRound rows in non-terminal states"
          - "Write AuditEvent{kind=STATE_TRANSITION}"

  - entity: InterviewRound
    initial_state: DRAFT
    terminal_states: [PASSED, FAILED, CANCELLED]
    transitions:
      - from: DRAFT
        to: AWAITING_CANDIDATE
        trigger: "POST /recruitment/interview-rounds/{id}/publish-slots"
        actor: HrUser
        preconditions:
          - "interviewer_user_ids has >= 1 entry"
          - "candidate_time_slot_options has >= 1 ISO8601 entry, all in the future"
          - "mode is set"
          - "for each interviewer_user_id, no SCHEDULED InterviewRound overlaps any candidate_time_slot_options slot (the candidate-selectable window is [slot, slot+60min); two rounds collide iff their windows share any instant, i.e., a.start < b.end and b.start < a.end)"
        side_effects:
          - "Write AuditEvent{kind=STATE_TRANSITION}"
      - from: AWAITING_CANDIDATE
        to: SCHEDULED
        trigger: "POST /recruitment/interview-rounds/{id}/candidate-confirm"
        actor: Candidate
        preconditions:
          - "selected_slot must be one of candidate_time_slot_options"
          - "for each interviewer_user_id, no other SCHEDULED InterviewRound overlaps [selected_slot, selected_slot+60min) — overlap test uses strict-instant rule above"
        side_effects:
          - "Set scheduled_start_at, scheduled_end_at"
          - "Emit synchronization event for calendar+IM+video-conferencing systems"
          - "Write AuditEvent{kind=STATE_TRANSITION}"
      - from: SCHEDULED
        to: FEEDBACK_PENDING
        trigger: "POST /recruitment/_clock/advance (auto when now() >= scheduled_end_at)"
        actor: system
        preconditions:
          - "now() >= scheduled_end_at"
        side_effects:
          - "Write AuditEvent{kind=STATE_TRANSITION}"
      - from: FEEDBACK_PENDING
        to: PASSED
        trigger: "POST /recruitment/interview-rounds/{id}/submit-feedback"
        actor: HrUser
        preconditions:
          - "feedback_decision == PASS"
        side_effects:
          - "Set feedback_decision=PASS"
          - "Write AuditEvent{kind=STATE_TRANSITION}"
      - from: FEEDBACK_PENDING
        to: FAILED
        trigger: "POST /recruitment/interview-rounds/{id}/submit-feedback"
        actor: HrUser
        preconditions:
          - "feedback_decision == FAIL"
        side_effects:
          - "Set feedback_decision=FAIL"
          - "Cascade: parent Application moves to REJECTED (which itself cancels any other non-terminal InterviewRound rows on that application)"
          - "Write AuditEvent{kind=STATE_TRANSITION}"
      - from: DRAFT
        to: CANCELLED
        trigger: "Cascade from Application REJECTED/CLOSED"
        actor: system
        preconditions: []
        side_effects:
          - "Write AuditEvent{kind=STATE_TRANSITION}"
      - from: AWAITING_CANDIDATE
        to: CANCELLED
        trigger: "Cascade from Application REJECTED/CLOSED"
        actor: system
        preconditions: []
        side_effects:
          - "Write AuditEvent{kind=STATE_TRANSITION}"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "Cascade from Application REJECTED/CLOSED"
        actor: system
        preconditions: []
        side_effects:
          - "Emit synchronization event for calendar+IM+video-conferencing systems (cancellation)"
          - "Write AuditEvent{kind=STATE_TRANSITION}"
      - from: FEEDBACK_PENDING
        to: CANCELLED
        trigger: "Cascade from Application REJECTED/CLOSED"
        actor: system
        preconditions: []
        side_effects:
          - "Write AuditEvent{kind=STATE_TRANSITION}"

  - entity: Offer
    initial_state: DRAFT
    terminal_states: [ACCEPTED, DECLINED, EXPIRED, RESCINDED]
    transitions:
      - from: DRAFT
        to: PENDING_HM
        trigger: "POST /recruitment/offers/{id}/submit-approval"
        actor: HrUser
        preconditions:
          - "Application.application_status == INTERVIEW"
          - "at least one InterviewRound on the Application has round_status == PASSED"
          - "base_salary_cents > 0; sign_on_bonus_cents >= 0"
        side_effects:
          - "Write AuditEvent{kind=STATE_TRANSITION}"
      - from: PENDING_HM
        to: PENDING_HR
        trigger: "POST /recruitment/offers/{id}/approve"
        actor: HiringManager
        preconditions:
          - "acting HrUser is bound (binding_status==ACTIVE) to Offer.company_id"
        side_effects:
          - "Set hm_approver_user_id = actor"
          - "Write AuditEvent{kind=STATE_TRANSITION}"
      - from: PENDING_HR
        to: PENDING_FINANCE
        trigger: "POST /recruitment/offers/{id}/approve"
        actor: HrApprover
        preconditions:
          - "actor != hm_approver_user_id (segregation of duties)"
          - "acting HrUser is bound to Offer.company_id"
        side_effects:
          - "Set hr_approver_user_id = actor"
          - "Write AuditEvent{kind=STATE_TRANSITION}"
      - from: PENDING_FINANCE
        to: ISSUED
        trigger: "POST /recruitment/offers/{id}/approve"
        actor: FinanceApprover
        preconditions:
          - "actor != hm_approver_user_id and actor != hr_approver_user_id (segregation of duties)"
          - "acting HrUser is bound to Offer.company_id"
        side_effects:
          - "Set finance_approver_user_id = actor"
          - "Set issued_at = now(); acceptance_deadline_at = issued_at + 168h"
          - "Write AuditEvent{kind=STATE_TRANSITION}"
      - from: PENDING_HM
        to: DRAFT
        trigger: "POST /recruitment/offers/{id}/reject-approval"
        actor: HiringManager
        preconditions: []
        side_effects:
          - "Write AuditEvent{kind=STATE_TRANSITION}"
        note: "Branching reject path; can re-submit (cyclic loop DRAFT↔PENDING_HM)."
      - from: PENDING_HR
        to: DRAFT
        trigger: "POST /recruitment/offers/{id}/reject-approval"
        actor: HrApprover
        preconditions: []
        side_effects:
          - "Clear hm_approver_user_id"
          - "Write AuditEvent{kind=STATE_TRANSITION}"
      - from: PENDING_FINANCE
        to: DRAFT
        trigger: "POST /recruitment/offers/{id}/reject-approval"
        actor: FinanceApprover
        preconditions: []
        side_effects:
          - "Clear hm_approver_user_id and hr_approver_user_id"
          - "Write AuditEvent{kind=STATE_TRANSITION}"
      - from: ISSUED
        to: ACCEPTED
        trigger: "POST /recruitment/offers/{id}/accept"
        actor: Candidate
        preconditions:
          - "now() < acceptance_deadline_at (strictly less; equality means EXPIRED)"
        side_effects:
          - "Set accepted_at = now()"
          - "If Application has source_channel==HEADHUNTER and its HeadhunterContract.trigger_event==OFFER_ACCEPTED, create CommissionRecord{settlement_status=ACCRUED, trigger_kind=OFFER_ACCEPTED}"
          - "Write AuditEvent{kind=STATE_TRANSITION}"
      - from: ISSUED
        to: DECLINED
        trigger: "POST /recruitment/offers/{id}/decline"
        actor: Candidate
        preconditions: []
        side_effects:
          - "Write AuditEvent{kind=STATE_TRANSITION}"
      - from: ISSUED
        to: EXPIRED
        trigger: "POST /recruitment/_clock/advance (auto when now() >= acceptance_deadline_at)"
        actor: system
        preconditions:
          - "now() >= acceptance_deadline_at"
        side_effects:
          - "Write AuditEvent{kind=STATE_TRANSITION}"
      - from: ISSUED
        to: RESCINDED
        trigger: "POST /recruitment/offers/{id}/rescind"
        actor: HrUser
        preconditions:
          - "rescission_reason supplied"
        side_effects:
          - "Set rescission_reason"
          - "Write AuditEvent{kind=STATE_TRANSITION}"
      - from: ACCEPTED
        to: RESCINDED
        trigger: "POST /recruitment/offers/{id}/rescind"
        actor: HrUser
        preconditions:
          - "rescission_reason supplied"
          - "no Onboarding row exists for this Offer yet"
        side_effects:
          - "Cascade: if a CommissionRecord with settlement_status==ACCRUED exists for the application_id and trigger_kind==OFFER_ACCEPTED, flip it to CLAWED_BACK with clawback_amount_cents = gross_commission_cents - tax_withheld_cents and net_settlement_cents = 0. This is a second-link cascade originating in the Offer RESCINDED transition."
          - "Write AuditEvent{kind=STATE_TRANSITION}"
          - "Write AuditEvent{kind=COMMISSION_CLAWBACK} for the flipped CommissionRecord"

  - entity: Onboarding
    initial_state: SCHEDULED
    terminal_states: [NO_SHOW, PROBATION_PASSED, PROBATION_FAILED]
    transitions:
      - from: SCHEDULED
        to: CHECKS_RUNNING
        trigger: "POST /recruitment/onboardings/{id}/start-checks"
        actor: HrUser
        preconditions: []
        side_effects:
          - "Emit synchronization event for background-check service"
          - "Write AuditEvent{kind=STATE_TRANSITION}"
      - from: CHECKS_RUNNING
        to: READY
        trigger: "POST /recruitment/onboardings/{id}/record-check"
        actor: HrUser
        preconditions:
          - "background_check_status in {PASSED, WAIVED} AND medical_check_status in {PASSED, WAIVED}"
        side_effects:
          - "Write AuditEvent{kind=STATE_TRANSITION}"
      - from: CHECKS_RUNNING
        to: NO_SHOW
        trigger: "POST /recruitment/onboardings/{id}/record-no-show"
        actor: HrUser
        preconditions:
          - "now() >= start_date"
        side_effects:
          - "Cascade: parent Offer moves to RESCINDED with rescission_reason=BACKGROUND_FAIL (when a check returned FAILED) or OTHER (no-show without failed check); rescission of Offer itself triggers CommissionRecord clawback per the Offer state machine"
          - "Write AuditEvent{kind=STATE_TRANSITION}"
      - from: READY
        to: ONBOARDED
        trigger: "POST /recruitment/onboardings/{id}/confirm-onboarded"
        actor: HrUser
        preconditions:
          - "now() >= start_date"
        side_effects:
          - "Set probation_end_at = start_date + 90 days"
          - "If Application has source_channel==HEADHUNTER and HeadhunterContract.trigger_event==ONBOARDED, create CommissionRecord{settlement_status=ACCRUED, trigger_kind=ONBOARDED}"
          - "Write AuditEvent{kind=STATE_TRANSITION}"
      - from: READY
        to: NO_SHOW
        trigger: "POST /recruitment/onboardings/{id}/record-no-show"
        actor: HrUser
        preconditions:
          - "now() >= start_date"
        side_effects:
          - "Cascade: parent Offer moves to RESCINDED with rescission_reason=OTHER"
          - "Write AuditEvent{kind=STATE_TRANSITION}"
      - from: ONBOARDED
        to: PROBATION_PASSED
        trigger: "POST /recruitment/onboardings/{id}/conversion-decision"
        actor: HrUser
        preconditions:
          - "decision == PASS"
          - "now() >= probation_end_at - 30 days (allow up to 30 days early decision)"
        side_effects:
          - "If Application has source_channel==HEADHUNTER and HeadhunterContract.trigger_event==PROBATION_PASSED, create CommissionRecord{settlement_status=ACCRUED, trigger_kind=PROBATION_PASSED}"
          - "Write AuditEvent{kind=STATE_TRANSITION}"
      - from: ONBOARDED
        to: PROBATION_FAILED
        trigger: "POST /recruitment/onboardings/{id}/conversion-decision"
        actor: HrUser
        preconditions:
          - "decision == FAIL"
        side_effects:
          - "Cascade: any CommissionRecord on the same application_id with settlement_status==ACCRUED and accrual age < HeadhunterContract.clawback_window_days flips to CLAWED_BACK (clawback_amount_cents = gross_commission_cents - tax_withheld_cents; net_settlement_cents = 0). For records older than the window, settlement_status is unchanged."
          - "Write AuditEvent{kind=COMMISSION_CLAWBACK} per affected CommissionRecord"
          - "Write AuditEvent{kind=STATE_TRANSITION}"

  - entity: CommissionRecord
    initial_state: ACCRUED
    terminal_states: [SETTLED, CLAWED_BACK]
    transitions:
      - from: ACCRUED
        to: SETTLED
        trigger: "POST /recruitment/_settlement-sweep/run"
        actor: system
        preconditions:
          - "now() >= record.created_at + 30 days (settlement holdback)"
          - "no clawback condition active"
        side_effects:
          - "Set settled_at = now()"
          - "Compute net_settlement_cents = gross_commission_cents - tax_withheld_cents (clawback not applied because record never moved to CLAWED_BACK)"
          - "Write AuditEvent{kind=COMMISSION_SETTLED}"
      - from: ACCRUED
        to: CLAWED_BACK
        trigger: "Cascade from Offer RESCINDED or Onboarding PROBATION_FAILED"
        actor: system
        preconditions: []
        side_effects:
          - "Set clawback_amount_cents = gross_commission_cents - tax_withheld_cents; net_settlement_cents = 0"
          - "Write AuditEvent{kind=COMMISSION_CLAWBACK}"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two candidates simultaneously confirm the same time slot, where confirming both would create overlapping schedules for a shared interviewer"
    guarantee: "At most one InterviewRound transitions to SCHEDULED; the other is rejected."
    error_id: ERR_INTERVIEWER_BUSY
    http_status: 409
    serialization: "First-writer-wins on InterviewRound.round_status transition to SCHEDULED."

  - scenario: "Two HR approvers attempt to approve the same Offer at the same approval stage simultaneously"
    guarantee: "Exactly one approve succeeds; loser is rejected because the offer has already advanced."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Offer.offer_status."

  - scenario: "Candidate accepts and HR rescinds the same ISSUED Offer simultaneously"
    guarantee: "Exactly one of accept/rescind succeeds based on offer_status at write time; the other is rejected."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Offer.offer_status."

  - scenario: "Two HR users attempt to create a second Onboarding for the same Offer"
    guarantee: "At most one Onboarding per Offer; second creation rejected."
    error_id: ERR_ONBOARDING_ALREADY_EXISTS
    http_status: 409
    serialization: "First-writer-wins on Onboarding.offer_id uniqueness."

  - scenario: "Two HR users attempt to publish a new JobPosting that produces identical content_fingerprint for the same Company at the same time"
    guarantee: "Only one posting can be LIVE with a given fingerprint per company."
    error_id: ERR_DUPLICATE_POSTING
    http_status: 409
    serialization: "First-writer-wins on (company_id, content_fingerprint, posting_status==LIVE)."

  - scenario: "Two applications race to occupy the last available slot under Company.posting_quota_limit"
    guarantee: "Approval succeeds only while active_job_posting_count < posting_quota_limit; loser receives quota error."
    error_id: ERR_POSTING_QUOTA_EXCEEDED
    http_status: 409
    serialization: "Read-then-write under serializable isolation on Company.active_job_posting_count."

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: commission_gross_amount
    trigger: "Computed when a CommissionRecord is created (Offer ACCEPTED, Onboarding ONBOARDED, or Onboarding PROBATION_PASSED, conditional on contract.trigger_event match)"
    algorithm: tiered_pricing
    formula: |
      # Inputs are pinned at CommissionRecord creation time and never recomputed.
      # base_annual_cents = Offer.base_salary_cents at the moment of CommissionRecord creation
      # bonus_cents = Offer.sign_on_bonus_cents at the moment of CommissionRecord creation
      # contract = HeadhunterContract row pointed to by Application.headhunter_contract_id
      #
      # The success fee uses two slices to make per-part rounding meaningful:
      #   - first_slice_raw  = min(base_annual_cents, FIRST_SLICE_CAP_CENTS) * success_fee_pct_bps / 10000
      #   - remainder_slice_raw = max(0, base_annual_cents - FIRST_SLICE_CAP_CENTS) * success_fee_pct_bps / 10000 * REMAINDER_DISCOUNT_FACTOR
      #     (REMAINDER_DISCOUNT_FACTOR pins the marginal rate above the cap to half the headline rate)
      #   - bonus_share_raw = bonus_cents * success_fee_pct_bps / 10000 * BONUS_SHARE_FACTOR
      #
      # Evaluation order (FIXED — sum-then-round, NOT per-part-then-sum):
      #   1. compute first_slice_raw, remainder_slice_raw, bonus_share_raw, retainer_part_raw
      #   2. raw_total = first_slice_raw + remainder_slice_raw + bonus_share_raw + retainer_part_raw
      #   3. gross_commission_cents = round_half_up(raw_total)   # ONE rounding step, at the end
      #
      if contract.fee_model == SUCCESS_FEE:
          first_slice_raw    = min(base_annual_cents, 10_000_000) * contract.success_fee_pct_bps / 10000
          remainder_slice_raw = max(0, base_annual_cents - 10_000_000) * contract.success_fee_pct_bps / 10000 * 0.5
          bonus_share_raw    = bonus_cents * contract.success_fee_pct_bps / 10000 * 0.25
          retainer_part_raw  = 0
      elif contract.fee_model == RETAINER:
          first_slice_raw    = 0
          remainder_slice_raw = 0
          bonus_share_raw    = 0
          retainer_part_raw  = contract.retainer_amount_cents
      else:  # HYBRID
          first_slice_raw    = min(base_annual_cents, 10_000_000) * contract.success_fee_pct_bps / 10000
          remainder_slice_raw = max(0, base_annual_cents - 10_000_000) * contract.success_fee_pct_bps / 10000 * 0.5
          bonus_share_raw    = bonus_cents * contract.success_fee_pct_bps / 10000 * 0.25
          retainer_part_raw  = contract.retainer_amount_cents
      raw_total = first_slice_raw + remainder_slice_raw + bonus_share_raw + retainer_part_raw
      gross_commission_cents = round_half_up(raw_total)
    input_set: |
      Inputs are snapshotted at the moment of CommissionRecord creation:
      Offer.base_salary_cents, Offer.sign_on_bonus_cents, and the HeadhunterContract row's
      fee_model, success_fee_pct_bps, retainer_amount_cents.
      No retroactive recomputation if contract terms later change.
    constants:
      BPS_DENOMINATOR: 10000
      FIRST_SLICE_CAP_CENTS: 10000000          # 100,000.00 monetary units
      REMAINDER_DISCOUNT_FACTOR: 0.5
      BONUS_SHARE_FACTOR: 0.25
    precision: |
      Integer cents. round_half_up applied ONCE to raw_total (sum-then-round).
      An implementation that rounds first_slice_raw, remainder_slice_raw, bonus_share_raw,
      and retainer_part_raw each to integer cents and then sums (per-part-then-sum)
      produces a different cent value for any input whose three sliced fractional parts
      do not all coincidentally round in the same direction.
    variants:
      - name: success_only_branch
        when: "contract.fee_model == SUCCESS_FEE"
        difference: "Gross omits retainer; bonus_share and remainder slice still contribute fractional cents that must be summed before the single round_half_up."
      - name: hybrid_branch
        when: "contract.fee_model == HYBRID"
        difference: "Gross adds retainer_amount_cents (integer) on top of the three fractional success slices. Round-order matters: sum-then-round vs per-part-then-sum diverge whenever the sliced fractions do not all carry the same sign past the half-cent boundary."

  - name: commission_tax_withheld
    trigger: "Computed alongside gross_commission_cents at CommissionRecord creation"
    algorithm: aggregation
    formula: |
      tax_withheld_cents = round_half_up(gross_commission_cents * contract.tax_withholding_pct_bps / 10000)
    input_set: "gross_commission_cents (already rounded), contract.tax_withholding_pct_bps."
    constants:
      BPS_DENOMINATOR: 10000
    precision: "integer cents, round_half_up"

  - name: company_posting_quota_limit
    trigger: "Re-derived whenever Company.verification_tier or Company.verification_status changes"
    algorithm: threshold
    formula: |
      if verification_status != VERIFIED:
          posting_quota_limit = 0
      elif verification_tier == BASIC:
          posting_quota_limit = 5
      elif verification_tier == PREMIUM:
          posting_quota_limit = 25
    input_set: "Company.verification_status, Company.verification_tier."
    constants:
      BASIC_LIMIT: 5
      PREMIUM_LIMIT: 25
    precision: "integer"

  - name: candidate_rate_limit_window
    trigger: "Evaluated on every POST /recruitment/applications"
    algorithm: threshold
    formula: |
      # Count applications by this candidate created in the last 60 seconds (rolling).
      # The window is half-open: [now() - 60s, now()).
      # A new application is BLOCKED iff applications_in_window >= 5.
      # Boundary: applications_in_window == 5 → REJECT (>=, not >).
      window_lo = now() - 60s
      window_hi = now()                       # half-open upper bound
      applications_in_window = count(
          Application a
          where a.candidate_id == requesting_candidate.id
            and window_lo <= a.created_at < window_hi
      )
      if applications_in_window >= 5:
          reject with ERR_CANDIDATE_RATE_LIMIT
    input_set: "Application rows for the requesting Candidate in the half-open [now()-60s, now()) window."
    constants:
      MAX_PER_WINDOW: 5
      WINDOW_SECONDS: 60
    precision: "integer counts; strict boundary semantics"

  - name: offer_acceptance_deadline
    trigger: "Set on Offer ISSUED transition; consulted on accept/decline/rescind/clock-advance"
    algorithm: forward_looking
    formula: |
      acceptance_deadline_at = issued_at + 168 hours (7 days)
      Boundary on accept: succeeds iff now() < acceptance_deadline_at (strictly less).
      Clock-advance auto-expiry: triggers iff now() >= acceptance_deadline_at.
    input_set: "Offer.issued_at."
    constants:
      ACCEPTANCE_WINDOW_HOURS: 168
    precision: "datetime; strict comparison (>= vs <)"
    variants:
      - name: provisional_remaining_seconds
        when: "GET /recruitment/offers/{id} returns the response while the offer is ISSUED"
        difference: "Includes a 'seconds_remaining' projected as acceptance_deadline_at - now(), clamped at 0. This is forward_looking: snapshot at READ time, not stored."
      - name: final_acceptance_window_consumed
        when: "Offer transitions to ACCEPTED, DECLINED, or EXPIRED"
        difference: "Once terminal, the projected value freezes (chronological): subsequent reads return the exact (terminal_event_time - issued_at). Same inputs produce a different number than the live projection because terminal_event_time may be earlier than acceptance_deadline_at."

  - name: interview_slot_overlap
    trigger: "Evaluated on POST /recruitment/interview-rounds/{id}/publish-slots and on candidate-confirm"
    algorithm: interval_merge
    formula: |
      # For each interviewer in InterviewRound.interviewer_user_ids:
      #   Build the set of half-open windows [start, start+60min) over all candidate_time_slot_options.
      #   For each existing SCHEDULED InterviewRound r2 where interviewer in r2.interviewer_user_ids:
      #       existing_window = [r2.scheduled_start_at, r2.scheduled_end_at)
      #       Two windows collide iff (a.start < b.end) AND (b.start < a.end).
      #       Touching at a boundary (a.end == b.start) is NOT a collision (half-open semantics).
      # On publish-slots: reject if ANY proposed slot collides for ANY interviewer.
      # On candidate-confirm: reject if the chosen slot collides for ANY interviewer.
    input_set: "InterviewRound.interviewer_user_ids, candidate_time_slot_options (or selected_slot), all SCHEDULED InterviewRound rows."
    constants:
      ROUND_DURATION_MINUTES: 60
    precision: "datetime arithmetic; half-open interval semantics; touching-boundary is NOT overlap"

  - name: posting_quota_consumed
    trigger: "Recomputed on JobPosting transitions into and out of LIVE; serves as denormalized counter on Company"
    algorithm: aggregation
    formula: |
      active_job_posting_count = count(
          JobPosting j
          where j.company_id == this.id
            and j.posting_status == LIVE
      )
      Quota gate on approve transition: active_job_posting_count < posting_quota_limit (strict less-than).
      Boundary: equality means quota exceeded (reject).
    input_set: "All JobPosting rows with company_id == Company.id and posting_status == LIVE."
    constants: {}
    precision: "integer; strict less-than gate"

  - name: net_settlement_amount
    trigger: "Computed at settlement sweep (ACCRUED → SETTLED) and at clawback (ACCRUED → CLAWED_BACK)"
    algorithm: chronological
    formula: |
      # Process CommissionRecord events in chronological order (created_at ascending).
      # The same set of events can yield two different net_settlement_cents values
      # depending on whether you evaluate at sweep time (chronological) or
      # forward-projected at accrual time (forward_looking).
      if settlement_status == SETTLED:
          net_settlement_cents = gross_commission_cents - tax_withheld_cents
          clawback_amount_cents = 0
      elif settlement_status == CLAWED_BACK:
          net_settlement_cents = 0
          clawback_amount_cents = gross_commission_cents - tax_withheld_cents
      # Invariant at any terminal state:
      #   net_settlement_cents + clawback_amount_cents == gross_commission_cents - tax_withheld_cents
    input_set: "CommissionRecord rows in ACCRUED status whose age is >= 30 days at sweep time; processed in created_at ASC order."
    constants:
      SETTLEMENT_HOLDBACK_DAYS: 30
    precision: "integer cents; chronological processing"
    variants:
      - name: projected_net_at_accrual
        when: "GET /recruitment/commission-records/{id} while status is ACCRUED"
        difference: "Returns gross - tax as a forward-looking projection assuming no clawback. May differ from final net if a clawback intervenes before the sweep."
      - name: final_net_at_sweep
        when: "Sweep runs and the record transitions to SETTLED"
        difference: "Chronological: locks the value at sweep time. If a clawback was triggered between accrual and sweep, the record is CLAWED_BACK (net=0) rather than SETTLED — same gross/tax inputs, different final net."

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and non-empty"
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the declared roles in the RBAC matrix"
    error_id: ERR_AUTH_INVALID_ROLE
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "Acting role has permission for this operation (RBAC)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 4
    category: existence
    check: "Path-referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: existence
    check: "Body-referenced foreign keys exist (e.g., company_id, candidate_id, job_posting_id)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "all POST/PATCH"

  - priority: 6
    category: business_referential
    check: "Acting HrUser must be bound (binding_status==ACTIVE) to the target Company for any HR-side operation"
    error_id: ERR_HR_NOT_BOUND
    http_status: 403
    applies_to: "all HrUser-actor endpoints"

  - priority: 7
    category: business_referential
    check: "Candidate.visibility_mode permits the acting Company: PUBLIC always; COMPANY_ONLY requires Company.id in visible_to_company_ids; HIDDEN blocks all HR reads/writes on Candidate.resume_attachment_url"
    error_id: ERR_RESUME_NOT_VISIBLE
    http_status: 403
    applies_to: "GET /recruitment/candidates/{id}, POST /recruitment/applications/{id}/forward, POST /recruitment/applications/{id}/interview-rounds"

  - priority: 8
    category: state
    check: "Target resource is in a state from which the requested transition is declared"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 9
    category: business_safety
    check: "JobPosting submitted for review must not contain prohibited content (discriminatory wording or illegal terms detected against the prohibited-content dictionary)"
    error_id: ERR_PROHIBITED_CONTENT
    http_status: 422
    applies_to: "POST /recruitment/job-postings/{id}/approve"

  - priority: 10
    category: business_constraint
    check: "No other JobPosting with posting_status==LIVE and identical content_fingerprint exists for the same company_id (duplicate-posting detection)"
    error_id: ERR_DUPLICATE_POSTING
    http_status: 409
    applies_to: "POST /recruitment/job-postings/{id}/approve"

  - priority: 11
    category: business_constraint
    check: "Offer approval segregation of duties: hm_approver, hr_approver, and finance_approver MUST be three distinct HrUser ids"
    error_id: ERR_SEGREGATION_VIOLATION
    http_status: 422
    applies_to: "POST /recruitment/offers/{id}/approve"

  - priority: 12
    category: business_temporal
    check: "Offer accept requires now() < acceptance_deadline_at (strictly less; equality means EXPIRED)"
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /recruitment/offers/{id}/accept"

  - priority: 13
    category: business_temporal
    check: "InterviewRound slot proposals: every entry in candidate_time_slot_options must be > now() at publish time"
    error_id: ERR_SLOT_IN_PAST
    http_status: 422
    applies_to: "POST /recruitment/interview-rounds/{id}/publish-slots"

  - priority: 14
    category: business_temporal
    check: "Selected slot on candidate-confirm must not collide with any interviewer's existing SCHEDULED InterviewRound (half-open interval semantics)"
    error_id: ERR_INTERVIEWER_BUSY
    http_status: 409
    applies_to: "POST /recruitment/interview-rounds/{id}/candidate-confirm, POST /recruitment/interview-rounds/{id}/publish-slots"

  - priority: 15
    category: business_constraint
    check: "Candidate anti-spam: at most 5 Application creations per Candidate in the half-open [now()-60s, now()) window. Sixth attempt (count==5 at evaluation, with new write making it 6) rejected."
    error_id: ERR_CANDIDATE_RATE_LIMIT
    http_status: 429
    applies_to: "POST /recruitment/applications"

  - priority: 16
    category: business_fiscal
    check: "Company.active_job_posting_count < Company.posting_quota_limit (strict <; equality means quota exceeded)"
    error_id: ERR_POSTING_QUOTA_EXCEEDED
    http_status: 409
    applies_to: "POST /recruitment/job-postings/{id}/approve"

  - priority: 17
    category: business_fiscal
    check: "Offer base_salary_cents > 0 and sign_on_bonus_cents >= 0"
    error_id: ERR_INVALID_AMOUNT
    http_status: 422
    applies_to: "POST /recruitment/offers, POST /recruitment/offers/{id}/submit-approval"

  - priority: 18
    category: business_constraint
    check: "Salary range sanity: salary_min_cents <= salary_max_cents and both > 0"
    error_id: ERR_INVALID_SALARY_RANGE
    http_status: 422
    applies_to: "POST /recruitment/job-postings, POST /recruitment/job-postings/{id}/submit-review"

  - priority: 19
    category: business_referential
    check: "Onboarding may only be created once per Offer (Onboarding.offer_id unique)"
    error_id: ERR_ONBOARDING_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /recruitment/onboardings"

  - priority: 20
    category: business_constraint
    check: "OCC version mismatch on PATCH/PUT/action endpoints when ?version is supplied"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all mutation endpoints accepting version"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Company verification ----
  - method: POST
    path: /recruitment/companies
    description: Create a Company in DRAFT state (HR self-service onboarding).
    roles: [HrUser]
    code: 201
    input: [legal_name, business_license_number, industry, size_band, verification_tier]
    output: Company
    side_effects: []

  - method: GET
    path: /recruitment/companies/{id}
    description: Read a Company.
    roles: [HrUser, PlatformAdmin]
    code: 200
    input: []
    output: Company
    side_effects: []

  - method: POST
    path: /recruitment/companies/{id}/submit-verification
    description: Submit Company for platform verification (DRAFT|EXPIRED → PENDING).
    roles: [HrUser]
    code: 200
    input: []
    output: Company
    side_effects: [AuditEvent]

  - method: POST
    path: /recruitment/companies/{id}/approve-verification
    description: Admin approves verification (PENDING → VERIFIED).
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Company
    side_effects: [recompute_company_posting_quota_limit, AuditEvent]

  - method: POST
    path: /recruitment/companies/{id}/reject-verification
    description: Admin rejects verification (PENDING → DRAFT).
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Company
    side_effects: [AuditEvent]

  - method: POST
    path: /recruitment/companies/{id}/blacklist
    description: Admin blacklists Company; cascades to postings and headhunter contracts.
    roles: [PlatformAdmin]
    code: 200
    input: [blacklist_reason]
    output: Company
    side_effects: [cascade_jobpostings_off_shelf, cascade_headhuntercontract_terminate, AuditEvent]

  - method: POST
    path: /recruitment/companies/{id}/hr-bindings
    description: Bind a new HrUser to the Company (HrUser PENDING → ACTIVE upon admin approval; for simplicity creation creates ACTIVE in this scaffold's surface).
    roles: [PlatformAdmin]
    code: 201
    input: [email, display_name]
    output: HrUser
    side_effects: []

  # ---- Job postings ----
  - method: POST
    path: /recruitment/job-postings
    description: Create a JobPosting in DRAFT.
    roles: [HrUser]
    code: 201
    input: [company_id, title, description, salary_min_cents, salary_max_cents, benefits]
    output: JobPosting
    side_effects: []

  - method: GET
    path: /recruitment/job-postings/{id}
    description: Read a JobPosting.
    roles: [HrUser, PlatformAdmin, Candidate]
    code: 200
    input: []
    output: JobPosting
    side_effects: []

  - method: GET
    path: /recruitment/job-postings
    description: List job postings with filtering (company_id, posting_status, industry).
    roles: [HrUser, PlatformAdmin, Candidate]
    code: 200
    input: ["company_id?", "posting_status?", "industry?", "limit?", "offset?"]
    output: JobPosting[]
    side_effects: []

  - method: POST
    path: /recruitment/job-postings/{id}/submit-review
    description: Submit posting for review (DRAFT → UNDER_REVIEW).
    roles: [HrUser]
    code: 200
    input: []
    output: JobPosting
    side_effects: [compute_content_fingerprint, AuditEvent]

  - method: POST
    path: /recruitment/job-postings/{id}/approve
    description: Admin approves posting (UNDER_REVIEW → LIVE).
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: JobPosting
    side_effects: [increment_company_active_count, AuditEvent]

  - method: POST
    path: /recruitment/job-postings/{id}/reject
    description: Admin rejects posting (UNDER_REVIEW → REJECTED).
    roles: [PlatformAdmin]
    code: 200
    input: [review_rejection_reason]
    output: JobPosting
    side_effects: [AuditEvent]

  - method: POST
    path: /recruitment/job-postings/{id}/revise
    description: HR moves a rejected posting back to DRAFT to revise (REJECTED → DRAFT).
    roles: [HrUser]
    code: 200
    input: []
    output: JobPosting
    side_effects: [AuditEvent]

  - method: POST
    path: /recruitment/job-postings/{id}/take-off-shelf
    description: HR takes a LIVE posting off shelf (LIVE → OFF_SHELF).
    roles: [HrUser]
    code: 200
    input: []
    output: JobPosting
    side_effects: [decrement_company_active_count, cascade_close_applications, AuditEvent]

  # ---- Candidates and applications ----
  - method: POST
    path: /recruitment/candidates
    description: Register a Candidate.
    roles: [Candidate]
    code: 201
    input: [full_name, email, resume_attachment_url, visibility_mode, "visible_to_company_ids?"]
    output: Candidate
    side_effects: []

  - method: PATCH
    path: /recruitment/candidates/{id}
    description: Update Candidate fields (e.g., visibility_mode, attachment, visible_to_company_ids). Supports ?version.
    roles: [Candidate]
    code: 200
    input: ["visibility_mode?", "visible_to_company_ids?", "resume_attachment_url?", "version?"]
    output: Candidate
    side_effects: []

  - method: GET
    path: /recruitment/candidates/{id}
    description: Read a Candidate (visibility-gated for HrUser callers).
    roles: [Candidate, HrUser]
    code: 200
    input: []
    output: Candidate
    side_effects: []

  - method: POST
    path: /recruitment/applications
    description: Submit a job application (Candidate). Includes one-click apply (source_channel=ONE_CLICK). Subject to anti-spam rate limit.
    roles: [Candidate]
    code: 201
    input: [candidate_id, job_posting_id, source_channel, "headhunter_contract_id?"]
    output: Application
    side_effects: [evaluate_candidate_rate_limit, AuditEvent]

  - method: GET
    path: /recruitment/applications/{id}
    description: Read an Application.
    roles: [HrUser, Candidate]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: POST
    path: /recruitment/applications/{id}/mark-read
    description: HR marks application as read (SUBMITTED → READ).
    roles: [HrUser]
    code: 200
    input: []
    output: Application
    side_effects: [AuditEvent]

  - method: POST
    path: /recruitment/applications/{id}/forward
    description: HR forwards application internally (READ → FORWARDED).
    roles: [HrUser]
    code: 200
    input: []
    output: Application
    side_effects: [AuditEvent]

  - method: POST
    path: /recruitment/applications/{id}/reject
    description: HR rejects an application (any non-terminal → REJECTED).
    roles: [HrUser]
    code: 200
    input: []
    output: Application
    side_effects: [cascade_cancel_interview_rounds, AuditEvent]

  - method: POST
    path: /recruitment/applications/{id}/interview-rounds
    description: Create a new InterviewRound on an Application (round_index auto-incremented). First round advances Application FORWARDED→INTERVIEW.
    roles: [HrUser]
    code: 201
    input: [mode, interviewer_user_ids]
    output: InterviewRound
    side_effects: [AuditEvent]

  # ---- Interview rounds ----
  - method: POST
    path: /recruitment/interview-rounds/{id}/publish-slots
    description: HR publishes candidate-selectable time slots (DRAFT → AWAITING_CANDIDATE).
    roles: [HrUser]
    code: 200
    input: [candidate_time_slot_options]
    output: InterviewRound
    side_effects: [check_interview_slot_overlap, AuditEvent]

  - method: POST
    path: /recruitment/interview-rounds/{id}/candidate-confirm
    description: Candidate picks one of the offered slots (AWAITING_CANDIDATE → SCHEDULED).
    roles: [Candidate]
    code: 200
    input: [selected_slot]
    output: InterviewRound
    side_effects: [check_interview_slot_overlap, sync_calendar_im_video, AuditEvent]

  - method: POST
    path: /recruitment/interview-rounds/{id}/submit-feedback
    description: HR submits per-round feedback (FEEDBACK_PENDING → PASSED|FAILED).
    roles: [HrUser]
    code: 200
    input: [feedback_decision]
    output: InterviewRound
    side_effects: [maybe_cascade_application_reject, AuditEvent]

  - method: GET
    path: /recruitment/interview-rounds/{id}
    description: Read an InterviewRound.
    roles: [HrUser, Candidate]
    code: 200
    input: []
    output: InterviewRound
    side_effects: []

  # ---- Offers ----
  - method: POST
    path: /recruitment/offers
    description: Create a DRAFT Offer for an Application.
    roles: [HrUser]
    code: 201
    input: [application_id, base_salary_cents, sign_on_bonus_cents]
    output: Offer
    side_effects: []

  - method: POST
    path: /recruitment/offers/{id}/submit-approval
    description: Move an Offer into the approval pipeline (DRAFT → PENDING_HM).
    roles: [HrUser]
    code: 200
    input: []
    output: Offer
    side_effects: [AuditEvent]

  - method: POST
    path: /recruitment/offers/{id}/approve
    description: Advance one approval stage. Role of caller (HiringManager / HrApprover / FinanceApprover) determines which stage advances. Segregation of duties enforced.
    roles: [HiringManager, HrApprover, FinanceApprover]
    code: 200
    input: []
    output: Offer
    side_effects: [AuditEvent]

  - method: POST
    path: /recruitment/offers/{id}/reject-approval
    description: Reject at the current approval stage (PENDING_* → DRAFT).
    roles: [HiringManager, HrApprover, FinanceApprover]
    code: 200
    input: []
    output: Offer
    side_effects: [AuditEvent]

  - method: POST
    path: /recruitment/offers/{id}/accept
    description: Candidate accepts (ISSUED → ACCEPTED).
    roles: [Candidate]
    code: 200
    input: ["competing_offer_note?"]
    output: Offer
    side_effects: [maybe_create_commission_record, AuditEvent]

  - method: POST
    path: /recruitment/offers/{id}/decline
    description: Candidate declines (ISSUED → DECLINED).
    roles: [Candidate]
    code: 200
    input: []
    output: Offer
    side_effects: [AuditEvent]

  - method: POST
    path: /recruitment/offers/{id}/rescind
    description: HR rescinds an ISSUED or ACCEPTED offer (no Onboarding yet).
    roles: [HrUser]
    code: 200
    input: [rescission_reason]
    output: Offer
    side_effects: [maybe_commission_clawback, AuditEvent]

  - method: GET
    path: /recruitment/offers/{id}
    description: Read an Offer (returns provisional seconds_remaining while ISSUED).
    roles: [HrUser, Candidate]
    code: 200
    input: []
    output: Offer
    side_effects: []

  # ---- Onboarding ----
  - method: POST
    path: /recruitment/onboardings
    description: Create Onboarding for an ACCEPTED Offer (SCHEDULED initial state).
    roles: [HrUser]
    code: 201
    input: [offer_id, start_date]
    output: Onboarding
    side_effects: []

  - method: POST
    path: /recruitment/onboardings/{id}/start-checks
    description: Move SCHEDULED → CHECKS_RUNNING.
    roles: [HrUser]
    code: 200
    input: []
    output: Onboarding
    side_effects: [sync_background_check_service, AuditEvent]

  - method: POST
    path: /recruitment/onboardings/{id}/record-check
    description: Record outcome for background_check_status or medical_check_status.
    roles: [HrUser]
    code: 200
    input: [check_kind, outcome]
    output: Onboarding
    side_effects: [maybe_advance_to_ready, AuditEvent]

  - method: POST
    path: /recruitment/onboardings/{id}/confirm-onboarded
    description: Move READY → ONBOARDED on or after start_date.
    roles: [HrUser]
    code: 200
    input: []
    output: Onboarding
    side_effects: [maybe_create_commission_record, AuditEvent]

  - method: POST
    path: /recruitment/onboardings/{id}/record-no-show
    description: Mark candidate no-show (CHECKS_RUNNING|READY → NO_SHOW); cascades to Offer.
    roles: [HrUser]
    code: 200
    input: []
    output: Onboarding
    side_effects: [cascade_offer_rescind, AuditEvent]

  - method: POST
    path: /recruitment/onboardings/{id}/conversion-decision
    description: Record probation conversion decision (ONBOARDED → PROBATION_PASSED|PROBATION_FAILED).
    roles: [HrUser]
    code: 200
    input: [decision]
    output: Onboarding
    side_effects: [maybe_create_or_clawback_commission_record, AuditEvent]

  - method: POST
    path: /recruitment/onboardings/{id}/feedback
    description: Submit candidate-side or employer-side onboarding feedback score (1-5).
    roles: [HrUser, Candidate]
    code: 200
    input: [side, score]
    output: Onboarding
    side_effects: []

  - method: GET
    path: /recruitment/onboardings/{id}
    description: Read an Onboarding.
    roles: [HrUser, Candidate]
    code: 200
    input: []
    output: Onboarding
    side_effects: []

  # ---- Headhunter contracts and commission ----
  - method: POST
    path: /recruitment/headhunter-contracts
    description: Create a HeadhunterContract.
    roles: [PlatformAdmin]
    code: 201
    input: [headhunter_user_id, company_id, fee_model, "success_fee_pct_bps?", "retainer_amount_cents?", trigger_event, "clawback_window_days?", "tax_withholding_pct_bps?"]
    output: HeadhunterContract
    side_effects: []

  - method: GET
    path: /recruitment/commission-records/{id}
    description: Read a CommissionRecord (returns projected_net while ACCRUED).
    roles: [PlatformAdmin, HeadhunterUser]
    code: 200
    input: []
    output: CommissionRecord
    side_effects: []

  - method: GET
    path: /recruitment/commission-records
    description: List CommissionRecords with filtering (headhunter_contract_id, settlement_status).
    roles: [PlatformAdmin, HeadhunterUser]
    code: 200
    input: ["headhunter_contract_id?", "settlement_status?", "limit?", "offset?"]
    output: CommissionRecord[]
    side_effects: []

  # ---- Audit, sweeps, clock, sync ----
  - method: GET
    path: /recruitment/audit-events
    description: List AuditEvent rows with filtering (subject_entity, subject_id, event_kind).
    roles: [PlatformAdmin]
    code: 200
    input: ["subject_entity?", "subject_id?", "event_kind?", "limit?", "offset?"]
    output: AuditEvent[]
    side_effects: []

  - method: POST
    path: /recruitment/_clock/advance
    description: Test-driver — advance wall clock; triggers auto-transitions (Company EXPIRED, JobPosting EXPIRED, InterviewRound FEEDBACK_PENDING, Offer EXPIRED).
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: [run_auto_transitions, AuditEvent]

  - method: POST
    path: /recruitment/_settlement-sweep/run
    description: Test-driver — run the periodic settlement sweep; flips eligible ACCRUED CommissionRecord rows to SETTLED.
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: null
    side_effects: [advance_commission_records, AuditEvent]

  - method: POST
    path: /recruitment/_events/emit
    description: Test-driver — emit an external synchronization event (calendar/im/video/background-check). Asserts the platform replays/acks correctly without state regression.
    roles: [PlatformAdmin]
    code: 200
    input: [system, kind, subject_id]
    output: null
    side_effects: [AuditEvent]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_MISSING
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty"
  - id: ERR_AUTH_INVALID_ROLE
    http: 401
    condition: "X-User-Role is not a recognized role"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Acting role lacks RBAC permission for this operation"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-referenced resource does not exist"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "Body-referenced foreign key (e.g., job_posting_id, candidate_id, company_id, headhunter_contract_id) does not exist"
  - id: ERR_HR_NOT_BOUND
    http: 403
    condition: "Acting HrUser is not bound (binding_status==ACTIVE) to the target Company"
  - id: ERR_RESUME_NOT_VISIBLE
    http: 403
    condition: "Candidate visibility settings block the acting Company"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is not declared from the resource's current state"
  - id: ERR_PROHIBITED_CONTENT
    http: 422
    condition: "Job posting body contains discriminatory wording or illegal terms"
  - id: ERR_DUPLICATE_POSTING
    http: 409
    condition: "Another LIVE JobPosting with identical content_fingerprint exists for the same Company"
  - id: ERR_SEGREGATION_VIOLATION
    http: 422
    condition: "Offer approver duplicates an earlier approver (HM/HR/finance must be three distinct users)"
  - id: ERR_OFFER_EXPIRED
    http: 409
    condition: "now() >= acceptance_deadline_at on Offer.accept"
  - id: ERR_SLOT_IN_PAST
    http: 422
    condition: "candidate_time_slot_options contains a slot at or before now() at publish time"
  - id: ERR_INTERVIEWER_BUSY
    http: 409
    condition: "Proposed or selected interview slot collides with an existing SCHEDULED InterviewRound for one of the interviewer_user_ids"
  - id: ERR_CANDIDATE_RATE_LIMIT
    http: 429
    condition: "Candidate exceeded 5 applications in the half-open [now()-60s, now()) window"
  - id: ERR_POSTING_QUOTA_EXCEEDED
    http: 409
    condition: "Company.active_job_posting_count >= Company.posting_quota_limit at approval time"
  - id: ERR_INVALID_AMOUNT
    http: 422
    condition: "Offer base_salary_cents <= 0 or sign_on_bonus_cents < 0"
  - id: ERR_INVALID_SALARY_RANGE
    http: 422
    condition: "JobPosting salary_min_cents > salary_max_cents, or either is <= 0"
  - id: ERR_ONBOARDING_ALREADY_EXISTS
    http: 409
    condition: "Onboarding already exists for the given Offer.id"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "?version supplied on a mutation does not match the current resource version"
  - id: ERR_VALIDATION
    http: 422
    condition: "Generic request-body schema/type/required-field violation not covered by a more specific error"
  - id: ERR_FEEDBACK_INVALID
    http: 422
    condition: "InterviewRound feedback_decision is not one of {PASS, FAIL, HOLD}"
  - id: ERR_CHECK_INVALID
    http: 422
    condition: "Onboarding record-check called with unknown check_kind or outcome"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: HrUser
    description: HR account bound to a Company. Posts jobs, manages applications, runs interviews, creates offers, drives onboarding.
    identity: "entity_backed:HrUser"
    exclusive_operations:
      - "POST /recruitment/companies"
      - "POST /recruitment/companies/{id}/submit-verification"
      - "POST /recruitment/job-postings"
      - "POST /recruitment/job-postings/{id}/submit-review"
      - "POST /recruitment/job-postings/{id}/revise"
      - "POST /recruitment/job-postings/{id}/take-off-shelf"
      - "POST /recruitment/applications/{id}/mark-read"
      - "POST /recruitment/applications/{id}/forward"
      - "POST /recruitment/applications/{id}/reject"
      - "POST /recruitment/applications/{id}/interview-rounds"
      - "POST /recruitment/interview-rounds/{id}/publish-slots"
      - "POST /recruitment/interview-rounds/{id}/submit-feedback"
      - "POST /recruitment/offers"
      - "POST /recruitment/offers/{id}/submit-approval"
      - "POST /recruitment/offers/{id}/rescind"
      - "POST /recruitment/onboardings"
      - "POST /recruitment/onboardings/{id}/start-checks"
      - "POST /recruitment/onboardings/{id}/record-check"
      - "POST /recruitment/onboardings/{id}/confirm-onboarded"
      - "POST /recruitment/onboardings/{id}/record-no-show"
      - "POST /recruitment/onboardings/{id}/conversion-decision"
    shared_operations:
      - "GET /recruitment/companies/{id}"
      - "GET /recruitment/job-postings, GET /recruitment/job-postings/{id}"
      - "GET /recruitment/applications/{id}"
      - "GET /recruitment/interview-rounds/{id}"
      - "GET /recruitment/offers/{id}"
      - "GET /recruitment/onboardings/{id}"
      - "GET /recruitment/candidates/{id} (visibility-gated)"
      - "POST /recruitment/onboardings/{id}/feedback"

  - name: HiringManager
    description: HR-side role authorised for the first stage of offer approval. Same persisted HrUser entity, distinguished by X-User-Role header.
    identity: "entity_backed:HrUser"
    exclusive_operations: []
    shared_operations:
      - "POST /recruitment/offers/{id}/approve (advances PENDING_HM → PENDING_HR)"
      - "POST /recruitment/offers/{id}/reject-approval (from PENDING_HM)"

  - name: HrApprover
    description: HR-side role authorised for the second stage of offer approval. Same persisted HrUser entity. Must differ from HiringManager.
    identity: "entity_backed:HrUser"
    exclusive_operations: []
    shared_operations:
      - "POST /recruitment/offers/{id}/approve (advances PENDING_HR → PENDING_FINANCE)"
      - "POST /recruitment/offers/{id}/reject-approval (from PENDING_HR)"

  - name: FinanceApprover
    description: HR-side role authorised for the third (terminal) stage of offer approval. Same persisted HrUser entity. Must differ from HiringManager and HrApprover.
    identity: "entity_backed:HrUser"
    exclusive_operations: []
    shared_operations:
      - "POST /recruitment/offers/{id}/approve (advances PENDING_FINANCE → ISSUED)"
      - "POST /recruitment/offers/{id}/reject-approval (from PENDING_FINANCE)"

  - name: Candidate
    description: Job seeker. Creates own profile, submits applications, confirms interview slots, accepts/declines offers.
    identity: "entity_backed:Candidate"
    exclusive_operations:
      - "POST /recruitment/candidates"
      - "PATCH /recruitment/candidates/{id}"
      - "POST /recruitment/applications"
      - "POST /recruitment/interview-rounds/{id}/candidate-confirm"
      - "POST /recruitment/offers/{id}/accept"
      - "POST /recruitment/offers/{id}/decline"
    shared_operations:
      - "GET /recruitment/candidates/{id} (own row)"
      - "GET /recruitment/job-postings, GET /recruitment/job-postings/{id}"
      - "GET /recruitment/applications/{id} (own application)"
      - "GET /recruitment/interview-rounds/{id} (own application)"
      - "GET /recruitment/offers/{id} (own application)"
      - "GET /recruitment/onboardings/{id} (own application)"
      - "POST /recruitment/onboardings/{id}/feedback (candidate side)"

  - name: HeadhunterUser
    description: Headhunter operator. Authors HEADHUNTER-channel applications, reads own commission records.
    identity: "entity_backed:HeadhunterContract"
    exclusive_operations: []
    shared_operations:
      - "GET /recruitment/commission-records, GET /recruitment/commission-records/{id} (own contract)"
    note: "X-User-ID equals a HeadhunterContract.id; the headhunter acts under a specific contract."

  - name: PlatformAdmin
    description: Platform-side operator. Verifies companies, reviews postings, manages contracts, runs sweeps and clock.
    identity: "opaque"
    exclusive_operations:
      - "POST /recruitment/companies/{id}/approve-verification"
      - "POST /recruitment/companies/{id}/reject-verification"
      - "POST /recruitment/companies/{id}/blacklist"
      - "POST /recruitment/companies/{id}/hr-bindings"
      - "POST /recruitment/job-postings/{id}/approve"
      - "POST /recruitment/job-postings/{id}/reject"
      - "POST /recruitment/headhunter-contracts"
      - "GET /recruitment/audit-events"
      - "POST /recruitment/_clock/advance"
      - "POST /recruitment/_settlement-sweep/run"
      - "POST /recruitment/_events/emit"
    shared_operations:
      - "GET /recruitment/commission-records, GET /recruitment/commission-records/{id}"
      - "GET /recruitment/companies/{id}"
      - "GET /recruitment/job-postings, GET /recruitment/job-postings/{id}"
