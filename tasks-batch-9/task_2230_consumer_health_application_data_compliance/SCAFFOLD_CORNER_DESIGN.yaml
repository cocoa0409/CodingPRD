      - name: temporal_validation_resubmit_identity_after_the_verification_window_rejected
        claim_type: temporal_validation
        grounds: ["validations[priority=40]", "errors[ERR_VERIFICATION_WINDOW_EXPIRED]", "calculations.request_response_deadline.constants.VERIFICATION_WINDOW_DAYS"]
        distinguishing_aspect: "request-more-info stamps verification_window_ends_at at clock + 10 days, so a resubmit-identity one day past 2026-08-22T00:00:00Z is refused while verification_rounds_used stays at 1."
        test_recipe:
          setup:
            - "logical clock advanced to 2026-08-23T00:00:00Z"
            - "one ADULT Consumer with an ACCESS ConsumerRequest received at 2026-08-12T00:00:00Z and moved to VERIFICATION_PENDING the same day"
