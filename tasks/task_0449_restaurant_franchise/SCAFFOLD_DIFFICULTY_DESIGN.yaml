              payload: { brand_id: "${brand_id}", code: "DL", name: "DL" }
              as: Franchisor
              captures: { terr_id: $.data.id }
            - call: "POST /franchise/franchisees"
              payload: { brand_id: "${brand_id}", legal_name: "FZ", owner_user_id: "u_fz" }
              as: Franchisor
              captures: { fz_id: $.data.id }
            - call: "POST /franchise/franchisees/${fz_id}/approve"
              payload: {}
              as: Franchisor
            - call: "POST /franchise/territories/${terr_id}/assign"
              payload: { franchisee_id: "${fz_id}" }
              as: Franchisor
            - call: "POST /franchise/units"
              payload: { franchisee_id: "${fz_id}", territory_id: "${terr_id}", address: "U1" }
              as: Franchisor
              captures: { unit_id: $.data.id }
            - call: "POST /franchise/units/${unit_id}/open"
              payload: {}
              as: Franchisee
              as_user_id: "u_fz"
            - call: "POST /franchise/vendor-authorizations"
              payload: { unit_id: "${unit_id}", vendor_id: "${vendor_id}", qualifying_purchase_cents: 500000 }
              as: Franchisor
              captures: { auth_id: $.data.id }
          trigger:
            - call: "POST /franchise/vendors/${vendor_id}/revoke"
              payload: {}
              as: ComplianceAuditor
          assert:
            - "Vendor.${vendor_id}.approval_status == REVOKED   # hop 1"
            - "VendorAuthorization.${auth_id}.status == DISABLED   # hop 2, caused by the revocation"

  # -------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: agreement_transfer_state_vs_outstanding_obligations
        grounds:
          - validations[priority=5]
          - validations[priority=14]
          - state_machines.FranchiseAgreement.RENEWAL_PENDING_to_TRANSFERRED
        distinguishing_aspect: |
          Calling transfer on an EXECUTED (not RENEWAL_PENDING) agreement whose seller franchisee ALSO has
          an OVERDUE royalty statement violates both the state check (p5, ERR_INVALID_STATE) and the fiscal
          obligation check (p14, ERR_OUTSTANDING_OBLIGATIONS); the lower-priority state error wins — category
          pair state vs business_fiscal.
        test_recipe:
          setup:
            - "Brand; ACTIVE franchisee with one OPEN unit; an EXECUTED agreement (NOT begun-renewal, so status==EXECUTED)."
            - "An ISSUED royalty statement for the unit driven OVERDUE by two close-periods (current_period_index=2, due_period_index=1)."
            - "A second APPROVED buyer franchisee exists to populate buyer_franchisee_id."
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { name: "Cafe" }
              as: Franchisor
              captures: { brand_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { brand_id: "${brand_id}", code: "CF", name: "CF" }
              as: Franchisor
              captures: { terr_id: $.data.id }
            - call: "POST /franchise/franchisees"
              payload: { brand_id: "${brand_id}", legal_name: "Seller", owner_user_id: "u_seller" }
              as: Franchisor
              captures: { fz_id: $.data.id }
            - call: "POST /franchise/franchisees/${fz_id}/approve"
              payload: {}
              as: Franchisor
            - call: "POST /franchise/franchisees"
              payload: { brand_id: "${brand_id}", legal_name: "Buyer", owner_user_id: "u_buyer", is_existing_operator: true }
              as: Franchisor
              captures: { buyer_id: $.data.id }
            - call: "POST /franchise/franchisees/${buyer_id}/approve"
              payload: {}
              as: Franchisor
            - call: "POST /franchise/territories/${terr_id}/assign"
              payload: { franchisee_id: "${fz_id}" }
              as: Franchisor
            - call: "POST /franchise/units"
              payload: { franchisee_id: "${fz_id}", territory_id: "${terr_id}", address: "U1" }
              as: Franchisor
              captures: { unit_id: $.data.id }
            - call: "POST /franchise/units/${unit_id}/open"
              payload: {}
              as: Franchisee
              as_user_id: "u_seller"
            - call: "POST /franchise/agreements"
              payload: { franchisee_id: "${fz_id}", fdd_version: "2026.1", term_end_period_index: 5 }
              as: Franchisor
              captures: { ag_id: $.data.id }
            - call: "POST /franchise/agreements/${ag_id}/execute"
              payload: {}
              as: Franchisor
            - call: "POST /franchise/sales-reports"
              payload: { unit_id: "${unit_id}", period_index: 0, gross_sales_cents: 1000000, discounts_cents: 0 }
              as: Franchisor
              captures: { sr_id: $.data.id }
            - call: "POST /franchise/sales-reports/${sr_id}/accept"
              payload: {}
              as: FinanceClerk
            - call: "POST /franchise/royalty-statements"
              payload: { unit_id: "${unit_id}", period_index: 0 }
              as: FinanceClerk
              captures: { rs_id: $.data.id }
            - call: "POST /franchise/royalty-statements/${rs_id}/issue"
              payload: {}
              as: FinanceClerk
            - call: "POST /franchise/brands/${brand_id}/close-period"
              payload: {}
              as: Franchisor
            - call: "POST /franchise/brands/${brand_id}/close-period"
              payload: {}
              as: Franchisor
          trigger:
            - call: "POST /franchise/agreements/${ag_id}/transfer"
              payload: { buyer_franchisee_id: "${buyer_id}" }
              as: Franchisor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE   # p5 (state: agreement is EXECUTED not RENEWAL_PENDING) wins over p14 (outstanding obligations)"
            - "FranchiseAgreement.${ag_id}.status == EXECUTED   # unchanged"

      - name: vendor_authorization_owner_vs_vendor_not_approved
        grounds:
          - validations[priority=4]
          - validations[priority=12]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - errors[ERR_VENDOR_NOT_APPROVED]
        distinguishing_aspect: |
          A Franchisee whose X-User-ID does NOT own the target unit creates a VendorAuthorization for a
          PENDING (unapproved) vendor: violates ownership (p4, ERR_NOT_RESOURCE_OWNER) and vendor-approval
          (p12, ERR_VENDOR_NOT_APPROVED); the lower-priority ownership error wins — category pair
          business_referential(ownership) vs business_referential(vendor approval), distinct from the
          state-vs-fiscal pair above.
        test_recipe:
          setup:
            - "Brand; APPROVED franchisee F1 (owner u_f1) with an OPEN unit; a PENDING (unapproved) vendor; a second franchisee principal u_intruder who does NOT own the unit."
          setup_api_calls:
