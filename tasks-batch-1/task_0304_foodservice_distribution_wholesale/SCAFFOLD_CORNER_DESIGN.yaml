  # =========================================================================
  # Endpoints — listing/pagination, computed read, duplicate constraints.
  # =========================================================================
  - section: endpoints
    instances:
      - name: list_products_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /products?distributor_id&limit=1 returns a paginated array with total_count and has_more in the envelope; data is an array of length 1."
        test_recipe:
          setup:
            - "Distributor with two products."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "FreshCo" }
              as: DistributorAdmin
              captures: { dist: $.data.id }
            - call: "POST /products"
              payload: { distributor_id: "${dist}", sku: "P-1", name: "A", category: "DRY", splits_per_case: 12, case_cost_cents: 1000 }
              as: DistributorAdmin
            - call: "POST /products"
              payload: { distributor_id: "${dist}", sku: "P-2", name: "B", category: "DRY", splits_per_case: 12, case_cost_cents: 1000 }
              as: DistributorAdmin
          trigger:
            - call: "GET /products"
              payload: { distributor_id: "${dist}", limit: 1, offset: 0 }
              as: DistributorAdmin
          assert:
            - "response.status == 200"
            - "meta.total_count == 2"
            - "meta.has_more == true"
            - "len(data) == 1"

      - name: duplicate_sku_rejected
        claim_type: Cross-reference link
        grounds:
          - errors[ERR_DUPLICATE_SKU]
          - entities.Product.fields.sku
        distinguishing_aspect: "Creating a second Product with an sku already used in the distributor is rejected ERR_DUPLICATE_SKU (409)."
        test_recipe:
          setup:
            - "Distributor with product sku 'P-1'."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "FreshCo" }
              as: DistributorAdmin
              captures: { dist: $.data.id }
            - call: "POST /products"
              payload: { distributor_id: "${dist}", sku: "P-1", name: "A", category: "DRY", splits_per_case: 12, case_cost_cents: 1000 }
              as: DistributorAdmin
          trigger:
            - call: "POST /products"
              payload: { distributor_id: "${dist}", sku: "P-1", name: "Dup", category: "DRY", splits_per_case: 6, case_cost_cents: 800 }
              as: DistributorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_DUPLICATE_SKU"

      - name: duplicate_price_tier_min_cases_rejected
        claim_type: Cross-reference link
        grounds:
          - errors[ERR_DUPLICATE_TIER]
          - entities.PriceTier.fields.min_cases
        distinguishing_aspect: "Adding a second PriceTier with min_cases already present on the product is rejected ERR_DUPLICATE_TIER (409)."
        test_recipe:
          setup:
            - "Product P with a tier at min_cases 1."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "FreshCo" }
              as: DistributorAdmin
              captures: { dist: $.data.id }
            - call: "POST /products"
              payload: { distributor_id: "${dist}", sku: "P-1", name: "A", category: "DRY", splits_per_case: 12, case_cost_cents: 1000 }
              as: DistributorAdmin
              captures: { prod: $.data.id }
            - call: "POST /price-tiers"
              payload: { product_id: "${prod}", min_cases: 1, case_price_cents: 2400 }
              as: DistributorAdmin
          trigger:
            - call: "POST /price-tiers"
              payload: { product_id: "${prod}", min_cases: 1, case_price_cents: 2200 }
              as: DistributorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_DUPLICATE_TIER"

      - name: duplicate_warehouse_code_rejected
        claim_type: Cross-reference link
        grounds:
          - errors[ERR_DUPLICATE_CODE]
          - entities.Warehouse.fields.code
        distinguishing_aspect: "Creating a second Warehouse with a code already used in the distributor is rejected ERR_DUPLICATE_CODE (409)."
        test_recipe:
          setup:
            - "Distributor with warehouse code 'WH1'."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "FreshCo" }
              as: DistributorAdmin
              captures: { dist: $.data.id }
            - call: "POST /warehouses"
              payload: { distributor_id: "${dist}", code: "WH1", name: "Main" }
              as: DistributorAdmin
          trigger:
            - call: "POST /warehouses"
              payload: { distributor_id: "${dist}", code: "WH1", name: "Dup" }
              as: DistributorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_DUPLICATE_CODE"

      - name: pagination_limit_out_of_bounds_rejected
        claim_type: Listing
        grounds:
          - errors[ERR_VALIDATION_LIMIT]
          - response_envelope.pagination_defaults
        distinguishing_aspect: "GET /products with limit=101 (> max 100) is rejected ERR_VALIDATION_LIMIT (422)."
        test_recipe:
          setup:
            - "A distributor exists."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "FreshCo" }
              as: DistributorAdmin
              captures: { dist: $.data.id }
          trigger:
            - call: "GET /products"
              payload: { distributor_id: "${dist}", limit: 101 }
              as: DistributorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "data.error_id == ERR_VALIDATION_LIMIT"

