            - call: "POST /peer-reviews/${pr_a_id}/reviewer-assignment"
              payload: { reviewer_id: "${rv1_id}" }
              as: PeerReviewCommittee
            - call: "POST /firms/${firm_b_id}/peer-reviews"
              payload: { review_type: "SYSTEM_REVIEW", year_end: "2026-12-31", scheduled_window_start: "2026-09-15", scheduled_window_end: "2026-09-25" }
              as: PeerReviewCommittee
              captures: { pr_b_id: $.data.id }
            - call: "POST /firms/${firm_c_id}/peer-reviews"
              payload: { review_type: "SYSTEM_REVIEW", year_end: "2026-12-31", scheduled_window_start: "2026-09-20", scheduled_window_end: "2026-09-30" }
