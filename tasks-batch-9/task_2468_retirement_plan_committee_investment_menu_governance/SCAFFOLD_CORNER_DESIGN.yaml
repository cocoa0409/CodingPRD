            - "IPS-2026-R (identical thresholds and weights, scoring_variant ROLLING_SINCE_WATCH) is then adopted by a carried motion with approved minutes, the plan is advanced to fiscal quarter 1, and a quarter-1 review is opened which pins the rolling variant."
