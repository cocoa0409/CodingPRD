      - name: approving_a_zero_benefit_amendment_raises_no_net_conservation_benefit_while_rejecting_it_succeeds
        claim_type: Error triggerable
        grounds:
          - validations[priority=23]
          - errors[ERR_NO_NET_CONSERVATION_BENEFIT]
          - state_machines.Amendment[UNDER_REVIEW -> APPROVED]
          - state_machines.Amendment[UNDER_REVIEW -> REJECTED]
        distinguishing_aspect: "net_conservation_benefit_cents has input domain >= 0, so a zero-benefit amendment is a legal draft and a legal submission; the benefit test binds only at the decision. APPROVE on a zero-benefit UNDER_REVIEW amendment returns ERR_NO_NET_CONSERVATION_BENEFIT and leaves the easement RECORDED with amendment_count 0, while REJECT on the very same amendment succeeds — the code is reachable only through this decision-time path."
        test_recipe:
          setup:
            - "Easement EA1 was recorded from application AP1 at clock 2026-12-15 on parcel PA1, is COMPLIANT with stewardship_hold false, and has no amendments."
          setup_api_calls:
            - *k_prog1
            - *k_src_local
            - *k_src_state
            - *k_src_fed
            - *k_round1
            - *k_round1_open
            - *k_lo_a
            - *k_clk_0810
            - *k_parcel_a
            - *k_app_a
            - *k_appraisal_a
