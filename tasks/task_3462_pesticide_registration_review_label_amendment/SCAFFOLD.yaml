          - "If study.data_call_in_id set: recompute DCI satisfied/pending/outstanding; if DCI in RESPONDED or DEFICIENT and every required study type is now satisfied -> DCI SATISFIED; if that DCI's case was DCI_PENDING and all of the case's DCIs are SATISFIED -> case UNDER_REVIEW"
      - from: RECEIVED
        to: REJECTED
        trigger: "POST .../study-submissions/{id}/review-decisions with decision=REJECT"
        actor: RiskAssessor
        preconditions: ["Study in RECEIVED (ERR_STUDY_NOT_DECIDABLE otherwise)"]
        side_effects:
          - "decided_by_ref := X-User-ID; decided_at := clock"
          - "If study.data_call_in_id set and that DCI is RESPONDED -> DCI DEFICIENT"

  - entity: UseSite
    initial_state: PROPOSED
    terminal_states: [REMOVED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "system (owning application APPROVED)"
        actor: system
        preconditions: []
        side_effects: []
        note: "NEW_USE amendment approvals mint UseSite rows directly in ACTIVE (origin AMENDMENT) — documented exception to initial_state"
      - from: PROPOSED
        to: REMOVED
        trigger: "system (owning application DENIED/WITHDRAWN; or cancellation cascade on the product)"
        actor: system
        preconditions: []
        side_effects: ["pre_removal_status set to PROPOSED ONLY on the cancellation-cascade path; deny/withdraw leave it null"]
      - from: ACTIVE
        to: REMOVED
        trigger: "system (cancellation-order cascade on the product)"
        actor: system
        preconditions: []
        side_effects: ["pre_removal_status := ACTIVE; removed_at := clock"]
      - from: REMOVED
        to: ACTIVE
        trigger: "system (vacatur restore of an EFFECTIVE CANCELLATION)"
        actor: system
        preconditions: ["pre_removal_status == ACTIVE and removed_at == the vacated proceeding's effective_at"]
        side_effects: ["pre_removal_status cleared"]
        note: "Restore-only transition; rows removed by deny/withdraw (pre_removal_status null) never restore"

  - entity: Tolerance
    initial_state: PROPOSED
    terminal_states: [REVOKED]
    transitions:
      - from: PROPOSED
        to: ESTABLISHED
        trigger: "system (owning product's application APPROVED)"
        actor: system
        preconditions: ["Latest RiskAssessment of the application has level_of_concern_exceeded == false (enforced at the APPROVE gate)"]
        side_effects: ["established_at := clock"]
        note: "NEW_USE amendment approvals with payload.tolerance_ppm mint Tolerance rows directly in ESTABLISHED (origin AMENDMENT) — documented exception to initial_state"
      - from: PROPOSED
        to: REVOKED
        trigger: "system (application DENIED/WITHDRAWN; or cancellation-order cascade)"
        actor: system
        preconditions: []
        side_effects: ["pre_revocation_status set to PROPOSED ONLY on the cancellation-cascade path; deny/withdraw leave it null; revoked_at := clock"]
      - from: ESTABLISHED
        to: REVOKED
        trigger: "system (cancellation-order cascade)"
        actor: system
        preconditions: []
        side_effects: ["pre_revocation_status := ESTABLISHED; revoked_at := clock"]
      - from: REVOKED
        to: ESTABLISHED
        trigger: "system (vacatur restore) when pre_revocation_status == ESTABLISHED"
        actor: system
        preconditions: ["revoked_at == the vacated proceeding's effective_at"]
        side_effects: ["pre_revocation_status cleared"]
      - from: REVOKED
        to: PROPOSED
        trigger: "system (vacatur restore) when pre_revocation_status == PROPOSED"
        actor: system
        preconditions: ["revoked_at == the vacated proceeding's effective_at"]
        side_effects: ["pre_revocation_status cleared"]

  - entity: LabelAmendment
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST .../label-amendments/{id}/review-decisions with decision=APPROVE"
        actor: RegistrationReviewer
        preconditions:
          - "Amendment in SUBMITTED (ERR_AMENDMENT_NOT_PENDING otherwise)"
          - "Product in REGISTERED or UNDER_REVIEW (ERR_PRODUCT_TERMINAL when CANCELLED; ERR_PRODUCT_NOT_REGISTERED when UNREGISTERED/SUSPENDED)"
        side_effects:
          - "decided_at := clock"
          - "NEW_USE: mint UseSite in ACTIVE (origin AMENDMENT) from payload.use_site; when payload.tolerance_ppm present, mint Tolerance in ESTABLISHED (origin AMENDMENT, established_at := clock)"
          - "RATE_CHANGE: target UseSite.max_application_rate_lbs_acre := payload.new_max_application_rate_lbs_acre"
          - "METHOD_CHANGE: target UseSite.application_method := payload.new_application_method"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST .../label-amendments/{id}/review-decisions with decision=REJECT, or system auto-rejection from the cancellation cascade (hop 3: commodity-matched NEW_USE amendments)"
        actor: RegistrationReviewer | system
        preconditions: ["Amendment in SUBMITTED"]
        side_effects: ["decided_at := clock"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST .../label-amendments/{id}/withdraw"
        actor: RegistrantRepresentative
        preconditions: ["Amendment in SUBMITTED (ERR_AMENDMENT_NOT_PENDING otherwise)"]
        side_effects: []

  - entity: ApplicatorCertification
