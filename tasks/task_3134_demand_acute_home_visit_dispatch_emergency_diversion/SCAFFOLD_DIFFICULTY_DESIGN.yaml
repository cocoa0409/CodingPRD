          - validations[priority=7]
          - errors.ERR_VR_INVALID_STATE
          - errors.ERR_MARKET_INACTIVE
        distinguishing_aspect: |
          Pair = state vs business_safety. VisitRequest is in TRIAGED (correct
          state) but its MarketCoverageArea.is_active has been flipped to false:
          both a state precondition (must be TRIAGED — satisfied) AND a market
          safety check could fire; the safety check (priority 7) is hit because
          state passed. If the visit were ALSO not TRIAGED, ERR_VR_INVALID_STATE
          (priority 6) wins.
        test_recipe:
          setup:
            - "VisitRequest in TRIAGED in an active market; then PlatformAdmin flips the market inactive via a market update (or recreates the scenario by directly seeding an inactive market — modelled here by an additional market row)."
            - "A second visit is left in INTAKE (no triage yet) — wrong state — in the same now-inactive market."
