  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict across DIFFERENT error-category pairs.
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_fiscal_on_rate_adopt
        grounds:
          - validations[priority=5]
          - validations[priority=14]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_FISCAL_GATE]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: a rate schedule that is both in the
          WRONG state (DRAFT, never proposed) AND below the discount floor must surface
          ERR_INVALID_STATE (priority 5), not ERR_FISCAL_GATE (priority 11).
        test_recipe:
          setup:
            - "Authority ACTIVE with rate_setting_policy == DISCOUNT_TO_INCUMBENT, discount_floor_bps == 100"
            - "Schedule S1 in DRAFT with comparison_margin_bps == 50 (below the 100 floor) — never proposed"
          setup_api_calls:
            - call: "POST /cca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BoardDirector
            - call: "POST /cca/authority"
              payload: { display_name: "Valley Clean Alliance", utility_territory_code: "PGE", er_balancing_authority: "CISO", rate_setting_policy: "DISCOUNT_TO_INCUMBENT", discount_floor_bps: 100, rps_target_pct: 0.60, bad_debt_trueup_cap_pct: 0.01 }
              as: BoardDirector
            - call: "POST /cca/products"
              payload: { product_code: "STANDARD50", election_key: "DEFAULT", renewable_pct: 0.50 }
              as: RateAnalyst
              captures: { prod_std: $.data.id }
            - call: "POST /cca/rate-schedules"
              payload: { product_id: "${prod_std}", period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", energy_rate_cents_per_kwh: 11.94, pcia_rate_cents_per_kwh: 1.50, incumbent_benchmark_rate_cents_per_kwh: 12.00 }
              as: RateAnalyst
              captures: { rs_low: $.data.id }
          trigger:
            - call: "POST /cca/rate-schedules/${rs_low}/adopt"
              payload: {}
              as: BoardDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (state priority 5 beats business_fiscal priority 11 — the margin shortfall is never evaluated)"
      - name: safety_sod_vs_referential_on_rec_review
        grounds:
          - validations[priority=10]
          - validations[priority=12]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_REFERENTIAL_STATE]
        distinguishing_aspect: |
          Category pair business_constraint (segregation-of-duties, priority 8) vs
          business_referential (priority 10) — a different pair than state-vs-fiscal:
          a review attempted by the SAME officer who prepared the filing, where the
          filing would also fail a referential check downstream, must surface
