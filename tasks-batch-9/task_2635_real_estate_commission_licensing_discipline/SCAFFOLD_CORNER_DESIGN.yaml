            - call: "POST /commission/course-completions"
              payload: { licensee_id: "00000000-0000-0000-0000-0000000000ff", instructor_id: "${inst_id}", education_provider_id: "${prov_id}", course_type: "CE_CORE", credit_hours: 12, completed_on: "2026-08-01" }
              as: LicensingAnalyst
              captures: { e3: $.data.error_id }
          assert:
            - "the trust-account call returns 404 ERR_BROKERAGE_NOT_FOUND (the parent's code, not ERR_TRUST_ACCOUNT_NOT_FOUND)"
            - "the instructor call returns 404 ERR_EDUCATION_PROVIDER_NOT_FOUND and GET /commission/instructors returns total_count == 1 (only Ivy Teach)"
            - "the completion call returns 404 ERR_LICENSEE_NOT_FOUND and GET /commission/course-completions returns total_count == 0"
            - "no orphan child row exists for any of the three families"
      - name: course_completion_is_the_many_to_many_junction_of_licensee_instructor_and_provider
        claim_type: graph
        grounds:
          - complexity_profile.entity_topology
          - entities.CourseCompletion.fields.instructor_id
          - endpoints[GET /commission/course-completions]
          - endpoints[GET /commission/licensees]
        distinguishing_aspect: |
          The topology is a graph, not a tree: CourseCompletion is a junction carrying three foreign
          keys at once (student, instructor, provider) and must be reachable through each of them
          independently, while Licensee is self-referential, so filtering licensees by
