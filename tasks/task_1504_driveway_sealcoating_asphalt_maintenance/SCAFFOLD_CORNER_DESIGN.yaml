        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_ASSESSMENT_NOT_USABLE]"]
        distinguishing_aspect: "Assessment never submitted (DRAFT) cannot back a quote: ERR_ASSESSMENT_NOT_USABLE."
