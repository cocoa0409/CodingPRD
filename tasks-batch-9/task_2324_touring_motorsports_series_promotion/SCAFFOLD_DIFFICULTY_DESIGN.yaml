  - rule_id: resource_temporal_overlap
    instances:
      - name: venue_occupancy_is_closed_and_turnaround_padded_so_an_exact_touch_collides
        grounds:
          - calculations.venue_occupancy_conflict
          - validations[order=30]
          - entities.Venue.fields.turnaround_hours
          - entities.VenueBooking.fields.load_in_start_utc
          - errors.ERR_VENUE_DATE_CONFLICT
        distinguishing_aspect: |
          Resource: the physical Venue building. Interval semantics: CLOSED at both ends AND widened
          symmetrically by the venue's turnaround_hours, so a candidate whose load-in lands on the
          exact second the padded window ends is a conflict; one second later it is not. Only
          CONFIRMED bookings block, and the two candidates are placed in a SECOND season so the
          market-rotation rule cannot contribute to the outcome.
        test_recipe:
          setup:
            - "Two Seasons, S1 and S2, both spanning 2026-10-01..2027-03-31, so bookings in S2 cannot trip the same-season market-rotation rule"
            - "Venue 'Atlanta Dome' with turnaround_hours 12"
            - "Booking B1 in season S1 CONFIRMED with occupancy [2026-11-13T14:00:00Z, 2026-11-15T06:00:00Z]; padded, the blocked window is [2026-11-13T02:00:00Z, 2026-11-15T18:00:00Z]"
            - "Logical clock at its 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 Thunder Tour", year: 2026, season_start_date: "2026-10-01", season_end_date: "2027-03-31", total_marketing_budget_cents: 40000000 }
              as: SeriesPromoter
              captures: { season1: "$.data.id" }
            - call: "POST /seasons"
              payload: { name: "2026-27 Iron Giants Tour", year: 2026, season_start_date: "2026-10-01", season_end_date: "2027-03-31", total_marketing_budget_cents: 20000000 }
              as: SeriesPromoter
              captures: { season2: "$.data.id" }
            - call: "POST /venues"
              payload: { name: "Atlanta Dome", market_code: "ATL", city: "Atlanta", state_code: "GA", seat_capacity: 9000, floor_type: "DIRT", catch_fence_max_height_ft: 10, medical_bay_count: 2, load_in_hours_required: 10, staging_bay_count: 4, turnaround_hours: 12 }
              as: SeriesPromoter
              captures: { venue_atl: "$.data.id" }
            - call: "POST /venue-bookings"
              payload: { season_id: "${season1}", venue_id: "${venue_atl}", tour_date: "2026-11-14", rental_base_cents: 3000000, revenue_share_pct: 0.12, per_ticket_facility_fee_cents: 350, load_in_start_utc: "2026-11-13T14:00:00Z", tear_down_end_utc: "2026-11-15T06:00:00Z" }
              as: SeriesPromoter
              captures: { b1: "$.data.id" }
            - call: "POST /venue-bookings/${b1}/accept"
              payload: {}
              as: SeriesPromoter
          trigger:
            - call: "POST /venue-bookings"
              payload: { season_id: "${season2}", venue_id: "${venue_atl}", tour_date: "2026-11-16", rental_base_cents: 2800000, revenue_share_pct: 0.11, per_ticket_facility_fee_cents: 300, load_in_start_utc: "2026-11-15T18:00:00Z", tear_down_end_utc: "2026-11-16T22:00:00Z" }
              as: SeriesPromoter
              captures: { err_touch: "$.data.error_id" }
            - call: "POST /venue-bookings"
              payload: { season_id: "${season2}", venue_id: "${venue_atl}", tour_date: "2026-11-16", rental_base_cents: 2800000, revenue_share_pct: 0.11, per_ticket_facility_fee_cents: 300, load_in_start_utc: "2026-11-15T18:00:01Z", tear_down_end_utc: "2026-11-16T22:00:00Z" }
              as: SeriesPromoter
              captures: { b2: "$.data.id" }
            - call: "POST /venue-bookings/${b2}/accept"
              payload: {}
              as: SeriesPromoter
            - call: "POST /venue-bookings"
              payload: { season_id: "${season2}", venue_id: "${venue_atl}", tour_date: "2026-11-14", rental_base_cents: 2800000, revenue_share_pct: 0.11, per_ticket_facility_fee_cents: 300, load_in_start_utc: "2026-11-14T20:00:00Z", tear_down_end_utc: "2026-11-14T10:00:00Z" }
              as: SeriesPromoter
              captures: { err_inverted: "$.data.error_id" }
          assert:
            - "exact touch: trigger call 1's candidate starts at 2026-11-15T18:00:00Z, exactly the end of B1's padded blocked window, and returns HTTP 409 with ${err_touch} == ERR_VENUE_DATE_CONFLICT"
            - "one second clear: trigger call 2 returns HTTP 201 and VenueBooking.${b2}.state == TERMS_PROPOSED, proving the boundary is at whole-second resolution"
            - "the pad is symmetric and re-checked at acceptance: trigger call 3 returns HTTP 200 and VenueBooking.${b2}.state == CONFIRMED, since B1's window is the only CONFIRMED occupancy in play"
            - "inverted interval: trigger call 4 has load_in_start_utc after tear_down_end_utc and returns HTTP 409 with ${err_inverted} == ERR_VENUE_DATE_CONFLICT under the same rule"
            - "cross-season isolation: trigger calls 1 and 2 cannot trip ERR_MARKET_ROTATION_COOLDOWN at all, because B1 belongs to ${season1} while every candidate belongs to ${season2}, so the 409 on call 1 is attributable to the occupancy pad alone"
            - "contrast with calculations.run_order_timeline, where segment.start == previous.end is legal: the same numeric relation is a conflict here and an exact fit there"

      - name: haul_buffer_is_a_one_sided_distance_derived_window_between_consecutive_stops
        grounds:
          - calculations.haul_buffer_requirement
          - validations[order=31]
          - entities.TourStop.fields.preceding_stop_id
          - entities.TourStop.fields.haul_distance_miles
          - errors.ERR_HAUL_BUFFER_VIOLATION
        distinguishing_aspect: |
          A different resource (the touring fleet's transport chain, expressed as TourStop.preceding_stop_id)
          and a genuinely different interval semantic from venue occupancy: the required window is
          ONE-SIDED, anchored only at the preceding stop's tear-down, and its LENGTH is derived from a
          distance quotient rather than being a fixed pad. 1200 miles demands
          CEIL(1200/50) + 10 == 34 hours against an available 33; re-declaring the leg as 1150 miles
          demands exactly 33 and is admitted, so the boundary moves with the input rather than with the
          calendar.
        test_recipe:
          setup:
            - "One Season and two Venues in different markets: 'Atlanta Dome' (ATL) and 'Dallas Coliseum' (DAL)"
            - "Stop 1 at Atlanta Dome for 2026-11-14 with tear_down_end_utc 2026-11-15T06:00:00Z"
            - "Stop 2 at Dallas Coliseum for 2026-11-17 whose booking load_in_start_utc is 2026-11-16T15:00:00Z — exactly 33 hours after stop 1's tear-down"
            - "Stop 2's show timing already patched, so the temporal show-timing rule cannot interfere with the chain patch"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 Thunder Tour", year: 2026, season_start_date: "2026-10-01", season_end_date: "2027-03-31", total_marketing_budget_cents: 40000000 }
              as: SeriesPromoter
              captures: { season: "$.data.id" }
            - call: "POST /venues"
              payload: { name: "Atlanta Dome", market_code: "ATL", city: "Atlanta", state_code: "GA", seat_capacity: 9000, floor_type: "DIRT", catch_fence_max_height_ft: 10, medical_bay_count: 2, load_in_hours_required: 10, staging_bay_count: 4, turnaround_hours: 12 }
              as: SeriesPromoter
              captures: { venue_atl: "$.data.id" }
            - call: "POST /venues"
              payload: { name: "Dallas Coliseum", market_code: "DAL", city: "Dallas", state_code: "TX", seat_capacity: 9000, floor_type: "DIRT", catch_fence_max_height_ft: 10, medical_bay_count: 2, load_in_hours_required: 10, staging_bay_count: 4, turnaround_hours: 12 }
              as: SeriesPromoter
              captures: { venue_dal: "$.data.id" }
            - call: "POST /venue-bookings"
              payload: { season_id: "${season}", venue_id: "${venue_atl}", tour_date: "2026-11-14", rental_base_cents: 3000000, revenue_share_pct: 0.12, per_ticket_facility_fee_cents: 350, load_in_start_utc: "2026-11-13T14:00:00Z", tear_down_end_utc: "2026-11-15T06:00:00Z" }
              as: SeriesPromoter
              captures: { b1: "$.data.id" }
            - call: "POST /venue-bookings/${b1}/accept"
              payload: {}
              as: SeriesPromoter
            - call: "GET /tour-stops"
              payload: { venue_booking_id: "${b1}" }
              as: SeriesPromoter
              captures: { stop1: "$.data[0].id" }
            - call: "POST /venue-bookings"
              payload: { season_id: "${season}", venue_id: "${venue_dal}", tour_date: "2026-11-17", rental_base_cents: 2900000, revenue_share_pct: 0.11, per_ticket_facility_fee_cents: 400, load_in_start_utc: "2026-11-16T15:00:00Z", tear_down_end_utc: "2026-11-18T02:00:00Z" }
              as: SeriesPromoter
              captures: { b2: "$.data.id" }
            - call: "POST /venue-bookings/${b2}/accept"
              payload: {}
              as: SeriesPromoter
            - call: "GET /tour-stops"
              payload: { venue_booking_id: "${b2}" }
              as: SeriesPromoter
              captures: { stop2: "$.data[0].id" }
            - call: "PATCH /tour-stops/${stop2}/logistics"
              payload: { doors_open_utc: "2026-11-17T22:00:00Z", show_start_utc: "2026-11-17T23:00:00Z", show_window_minutes: 150 }
              as: SeriesPromoter
          trigger:
            - call: "PATCH /tour-stops/${stop2}/logistics"
              payload: { preceding_stop_id: "${stop1}", haul_distance_miles: 1200 }
              as: SeriesPromoter
              captures: { err_haul: "$.data.error_id" }
            - call: "PATCH /tour-stops/${stop2}/logistics"
              payload: { preceding_stop_id: "${stop1}", haul_distance_miles: 1150 }
              as: SeriesPromoter
            - call: "PATCH /tour-stops/${stop2}/logistics"
              payload: { preceding_stop_id: "${stop2}", haul_distance_miles: 1150 }
              as: SeriesPromoter
              captures: { err_chain: "$.data.error_id" }
          assert:
            - "the available window is fixed by the calendar: stop 1's tear-down is 2026-11-15T06:00:00Z and stop 2's load-in is 2026-11-16T15:00:00Z, exactly 33 hours apart"
            - "trigger call 1 demands CEIL(1200/50) + 10 == 34 hours and returns HTTP 409 with ${err_haul} == ERR_HAUL_BUFFER_VIOLATION; TourStop.${stop2}.preceding_stop_id is still null and haul_distance_miles is still 0"
            - "trigger call 2 demands CEIL(1150/50) + 10 == 33 hours, which the strict `<` comparison admits at exact equality, and returns HTTP 200"
            - "after trigger call 2: TourStop.${stop2}.preceding_stop_id == \"${stop1}\" and haul_distance_miles == 1150"
            - "the window is one-sided: nothing about stop 2's tear-down or stop 1's load-in enters the rule, and no padding is applied to either end"
            - "trigger call 3 makes the chain self-referential and returns HTTP 422 with ${err_chain} == ERR_ROTATION_CHAIN_INVALID, leaving preceding_stop_id at \"${stop1}\""

  - rule_id: compensating_invariant
    instances:
      - name: ticket_tier_seat_pool_is_conserved_across_reserve_hold_pay_and_refund
        grounds:
          - entities.TicketTier.fields.available_seat_count
          - entities.TicketTier.fields.reserved_seat_count
          - entities.TicketTier.fields.sold_seat_count
          - entities.TicketTier.fields.held_seat_count
          - state_machines.TicketOrder.PAID_to_REFUNDED
          - state_machines.SponsorshipActivation.PROPOSED_to_ACTIVATED
        distinguishing_aspect: |
          Conserved quantity: SEATS. The identity
          allotment == reserved_seat_count + sold_seat_count + held_seat_count + available_seat_count
          must hold after every single write, even though three different aggregates move the
          summands — TicketOrder creation moves seats into reserved, payment moves them from reserved
          to sold, sponsorship activation moves them into held, and refund returns them to available.
          The refund is the compensating operation and must restore the pre-order distribution exactly,
          not merely the total.
        test_recipe:
          setup:
            - "A CONFIRMED ATL booking and its TourStop, ON_SALE, with a single tier UPPER priced 2500 and allotment 100"
            - "A CERTIFIED safety plan at 1200 / 6 / 1 ALS / 2 BLS / 1 ambulance / 1 lane (expected_attendance is only 100) and RADIO marketing 500000"
            - "A Sponsor 'Redline Fuel' with a PROPOSED activation holding 10 hospitality seats on UPPER"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 Thunder Tour", year: 2026, season_start_date: "2026-10-01", season_end_date: "2027-03-31", total_marketing_budget_cents: 40000000 }
              as: SeriesPromoter
              captures: { season: "$.data.id" }
            - call: "POST /venues"
              payload: { name: "Atlanta Dome", market_code: "ATL", city: "Atlanta", state_code: "GA", seat_capacity: 9000, floor_type: "DIRT", catch_fence_max_height_ft: 10, medical_bay_count: 2, load_in_hours_required: 10, staging_bay_count: 4, turnaround_hours: 12 }
              as: SeriesPromoter
              captures: { venue_atl: "$.data.id" }
            - call: "POST /venue-bookings"
              payload: { season_id: "${season}", venue_id: "${venue_atl}", tour_date: "2026-11-14", rental_base_cents: 3000000, revenue_share_pct: 0.12, per_ticket_facility_fee_cents: 350, load_in_start_utc: "2026-11-13T14:00:00Z", tear_down_end_utc: "2026-11-15T06:00:00Z" }
              as: SeriesPromoter
              captures: { b_atl: "$.data.id" }
            - call: "POST /venue-bookings/${b_atl}/accept"
              payload: {}
              as: SeriesPromoter
            - call: "GET /tour-stops"
              payload: { venue_booking_id: "${b_atl}" }
              as: SeriesPromoter
              captures: { stop_atl: "$.data[0].id" }
            - call: "PATCH /tour-stops/${stop_atl}/logistics"
              payload: { doors_open_utc: "2026-11-14T22:00:00Z", show_start_utc: "2026-11-14T23:00:00Z", show_window_minutes: 150 }
              as: SeriesPromoter
            - call: "POST /tour-stops/${stop_atl}/show-segments"
              payload: { segment_type: "COMPETITION", title: "Heat 1", run_order_position: 1, duration_minutes: 30 }
              as: SeriesPromoter
            - call: "POST /tour-stops/${stop_atl}/ticket-tiers"
              payload: { tier_code: "UPPER", price_cents: 2500, allotment: 100, on_sale_start_utc: "2026-08-01T00:00:00Z", on_sale_end_utc: "2026-11-14T18:00:00Z" }
              as: TicketingManager
              captures: { tier_upper: "$.data.id" }
            - call: "POST /tour-stops/${stop_atl}/safety-plan"
              payload: { barrier_linear_feet: 1200, catch_fence_height_ft: 6, medical_als_staff_count: 1, medical_bls_staff_count: 2, ambulance_count: 1, emergency_access_lanes: 1 }
              as: SafetyOfficial
              as_user_id: "so-author-1"
              captures: { plan_atl: "$.data.id" }
            - call: "POST /safety-plans/${plan_atl}/submit"
              payload: {}
              as: SafetyOfficial
              as_user_id: "so-author-1"
            - call: "POST /safety-plans/${plan_atl}/certify"
              payload: { note: "certified" }
              as: SafetyOfficial
              as_user_id: "so-certifier-2"
            - call: "GET /seasons/${season}"
              payload: {}
              as: SeriesPromoter
              captures: { season_v1: "$.data.version" }
            - call: "POST /tour-stops/${stop_atl}/marketing-allocations"
              payload: { channel: "RADIO", amount_cents: 500000, expected_season_version: "${season_v1}" }
              as: SeriesPromoter
            - call: "POST /tour-stops/${stop_atl}/on-sale"
              payload: {}
              as: TicketingManager
            - call: "POST /sponsors"
              payload: { company_name: "Redline Fuel", category: "FUEL", contact_email: "rep@redline.example" }
              as: SeriesPromoter
              captures: { sponsor1: "$.data.id" }
            - call: "POST /sponsorship-activations"
              payload: { sponsor_id: "${sponsor1}", tour_stop_id: "${stop_atl}", fee_cents: 300000, vehicle_branding_slots: 0, signage_units: 4, hospitality_seat_count: 10, hospitality_tier_id: "${tier_upper}" }
              as: SeriesPromoter
              captures: { act1: "$.data.id" }
            - call: "GET /ticket-tiers/${tier_upper}"
              payload: {}
              as: TicketingManager
              captures: { up_v1: "$.data.version" }
          trigger:
            - call: "POST /ticket-orders"
              payload: { tour_stop_id: "${stop_atl}", ticket_tier_id: "${tier_upper}", purchaser_name: "Conservation Test", purchaser_email: "conserve@example.com", qty: 30, expected_ticket_tier_version: "${up_v1}" }
              as: TicketingManager
              captures: { order_x: "$.data.id" }
            - call: "POST /sponsorship-activations/${act1}/activate"
              payload: {}
              as: SeriesPromoter
            - call: "POST /ticket-orders/${order_x}/pay"
              payload: {}
              as: TicketingManager
            - call: "POST /ticket-orders/${order_x}/refund"
              payload: { reason: "purchaser cancelled the block" }
              as: TicketingManager
          assert:
            - "baseline: TicketTier.${tier_upper}.reserved_seat_count == 0, sold_seat_count == 0, held_seat_count == 0, available_seat_count == 100 (sum 100)"
            - "after trigger call 1: reserved_seat_count == 30, sold_seat_count == 0, held_seat_count == 0, available_seat_count == 70 (sum 100)"
            - "after trigger call 2: reserved_seat_count == 30, sold_seat_count == 0, held_seat_count == 10, available_seat_count == 60 (sum 100); TourStop.${stop_atl}.held_hospitality_seat_count == 10 and sponsorship_committed_cents == 300000"
            - "after trigger call 3: reserved_seat_count == 0, sold_seat_count == 30, held_seat_count == 10, available_seat_count == 60 (sum 100) — payment moves seats between summands without changing the total"
            - "after trigger call 3: TourStop.${stop_atl}.tickets_sold_count == 30, gross_ticket_revenue_cents == 75000, facility_fee_collected_cents == 10500"
            - "after trigger call 4 (the compensating operation): reserved_seat_count == 0, sold_seat_count == 0, held_seat_count == 10, available_seat_count == 90 (sum 100) — the distribution is restored, not just the total"
            - "after trigger call 4: TourStop.${stop_atl}.tickets_sold_count == 0, gross_ticket_revenue_cents == 0, facility_fee_collected_cents == 0, while held_hospitality_seat_count stays at 10"
            - "TicketOrder.${order_x}.status == REFUNDED with refunded_at set, and total_cents is unchanged at 85500 (the money record is preserved even though the counters reversed)"
            - "invariant restated: at every one of the five observation points, allotment 100 == reserved + sold + held + available"

      - name: season_marketing_budget_is_conserved_across_allocate_and_release
        grounds:
          - calculations.marketing_allocation_admission
          - entities.Season.fields.marketing_allocated_cents
          - entities.Season.fields.marketing_unallocated_cents
          - entities.MarketingAllocation.fields.state
          - endpoints.DELETE_/marketing-allocations/{id}
        distinguishing_aspect: |
          A different conserved quantity — MONEY in the season marketing ledger — and a different
          compensating operation, DELETE /marketing-allocations/{id}, which moves an allocation to
          RELEASED rather than deleting a row. The identity
          total_marketing_budget_cents == marketing_allocated_cents + marketing_unallocated_cents
          must hold across allocate and release, and the release must apply the exact inverse deltas
          to the stop's running total and to the per-channel cap ledger, so the freed RADIO headroom
          becomes re-usable at its original size.
        test_recipe:
          setup:
            - "Season with total_marketing_budget_cents 40000000, so the stop cap is 8000000 and the RADIO channel cap is 3200000"
            - "A CONFIRMED ATL booking and its TourStop with no allocations yet"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 Thunder Tour", year: 2026, season_start_date: "2026-10-01", season_end_date: "2027-03-31", total_marketing_budget_cents: 40000000 }
              as: SeriesPromoter
              captures: { season: "$.data.id" }
            - call: "POST /venues"
              payload: { name: "Atlanta Dome", market_code: "ATL", city: "Atlanta", state_code: "GA", seat_capacity: 9000, floor_type: "DIRT", catch_fence_max_height_ft: 10, medical_bay_count: 2, load_in_hours_required: 10, staging_bay_count: 4, turnaround_hours: 12 }
              as: SeriesPromoter
              captures: { venue_atl: "$.data.id" }
            - call: "POST /venue-bookings"
              payload: { season_id: "${season}", venue_id: "${venue_atl}", tour_date: "2026-11-14", rental_base_cents: 3000000, revenue_share_pct: 0.12, per_ticket_facility_fee_cents: 350, load_in_start_utc: "2026-11-13T14:00:00Z", tear_down_end_utc: "2026-11-15T06:00:00Z" }
              as: SeriesPromoter
              captures: { b_atl: "$.data.id" }
            - call: "POST /venue-bookings/${b_atl}/accept"
              payload: {}
              as: SeriesPromoter
            - call: "GET /tour-stops"
              payload: { venue_booking_id: "${b_atl}" }
              as: SeriesPromoter
              captures: { stop_atl: "$.data[0].id" }
            - call: "GET /seasons/${season}"
              payload: {}
              as: SeriesPromoter
              captures: { season_v1: "$.data.version" }
          trigger:
            - call: "POST /tour-stops/${stop_atl}/marketing-allocations"
              payload: { channel: "RADIO", amount_cents: 3200000, expected_season_version: "${season_v1}" }
              as: SeriesPromoter
              captures: { alloc_radio: "$.data.id" }
            - call: "GET /seasons/${season}"
              payload: {}
              as: SeriesPromoter
              captures: { season_v2: "$.data.version" }
            - call: "POST /tour-stops/${stop_atl}/marketing-allocations"
              payload: { channel: "DIGITAL", amount_cents: 1200000, expected_season_version: "${season_v2}" }
              as: SeriesPromoter
              captures: { alloc_digital: "$.data.id" }
            - call: "DELETE /marketing-allocations/${alloc_radio}"
              payload: {}
              as: SeriesPromoter
            - call: "GET /seasons/${season}"
              payload: {}
              as: SeriesPromoter
              captures: { season_v4: "$.data.version" }
            - call: "POST /tour-stops/${stop_atl}/marketing-allocations"
              payload: { channel: "RADIO", amount_cents: 3200000, expected_season_version: "${season_v4}" }
              as: SeriesPromoter
              captures: { alloc_radio2: "$.data.id" }
          assert:
            - "baseline: Season.${season}.marketing_allocated_cents == 0 and marketing_unallocated_cents == 40000000 (sum 40000000)"
            - "after trigger call 1: Season.${season}.marketing_allocated_cents == 3200000, marketing_unallocated_cents == 36800000 (sum 40000000), TourStop.${stop_atl}.marketing_spend_committed_cents == 3200000"
            - "after trigger call 3: Season.${season}.marketing_allocated_cents == 4400000, marketing_unallocated_cents == 35600000 (sum 40000000), TourStop.${stop_atl}.marketing_spend_committed_cents == 4400000"
            - "after trigger call 4 (the compensating operation): MarketingAllocation.${alloc_radio}.state == RELEASED with released_at set, and the row is still readable via GET /marketing-allocations/${alloc_radio}"
            - "after trigger call 4: Season.${season}.marketing_allocated_cents == 1200000, marketing_unallocated_cents == 38800000 (sum 40000000), TourStop.${stop_atl}.marketing_spend_committed_cents == 1200000"
            - "the per-channel ledger reversed too: trigger call 6 re-commits the full 3200000 RADIO cap and returns HTTP 201, which is only possible if the RELEASED row was removed from the channel running total"
            - "after trigger call 6: Season.${season}.marketing_allocated_cents == 4400000 and marketing_unallocated_cents == 35600000 (sum 40000000); GET /tour-stops/${stop_atl}/marketing-allocations returns 3 rows, one RELEASED and two COMMITTED"
            - "MarketingAllocation.${alloc_digital}.state == COMMITTED and amount_cents == 1200000, untouched by the RADIO release"
            - "Season.${season}.version strictly increases at trigger calls 1, 3, 4 and 6, so the release participates in the same optimistic-concurrency ledger as the allocations"
