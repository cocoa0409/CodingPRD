          - state_machines.Stop.PLANNED_to_CANCELLED
          - entities.Route.fields.committed_bottles
        distinguishing_aspect: |
          Route.cancel -> all PLANNED Stops CANCELLED -> Route.committed_bottles
          reset to 0. Depth = 2 (Route -> Stop -> committed_bottles). Distinct
          trigger from customer_suspend (different originating transition).
        test_recipe:
          setup:
