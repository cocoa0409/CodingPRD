  # ===========================================================================
  # From Table 7 (RBAC) — §1.7 roles, and the segregation_of_duties role model
  # ===========================================================================
  - section: rbac
    instances:

      - name: shared_operations_open_to_both_owners_while_exclusive_ones_stay_closed
        claim_type: Exclusive Operations
        grounds:
          - roles.CommunityBenefitOfficer.exclusive_operations
          - roles.DataSteward.exclusive_operations
          - validations.priority_2.ERR_UNAUTHORIZED
        distinguishing_aspect: "POST /health-indicators is the one write both the officer and the steward may issue, while the observations underneath it are the steward's alone and the cycle above it is the officer's alone — so a single indicator can be created by either role and still refuse an officer's data point."
        test_recipe:
          setup:
            - "AssessmentCycle in DATA_COLLECTION with one HealthIndicator created by the officer"
          setup_api_calls:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
              as: CommunityBenefitOfficer
              captures: { cyc: $.data.id }
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "DATA_COLLECTION" }
              as: CommunityBenefitOfficer
            - call: "POST /health-indicators"
              payload: { cycle_id: "${cyc}", domain: "BEHAVIORAL_HEALTH", name: "Adult depression prevalence", benchmark_value: 12.0 }
              as: CommunityBenefitOfficer
              captures: { ind_bh: $.data.id }
          trigger:
            - call: "POST /health-indicators"
              payload: { cycle_id: "${cyc}", domain: "ACCESS_TO_CARE", name: "Uninsured adult rate", benchmark_value: 8.0 }
              as: DataSteward
              captures: { ind_ac: $.data.id }
            - call: "POST /health-indicators/${ind_ac}/data-points"
              payload: { population_subgroup: "OVERALL", source_type: "PUBLIC_DATASET", value: 14.0, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "GET /health-indicators/${ind_bh}"
              payload: {}
              as: DataSteward
          assert:
            - "trigger call 1: HTTP 201 — POST /health-indicators is a shared operation, so DataSteward creates it exactly as the officer did"
            - "trigger call 2: HTTP 201, and GET /health-indicators/${ind_ac} reports evidence_count == 1 with subgroup_count == 0"
            - "trigger call 3: HTTP 200 — the steward's read surface covers indicators"
            - "the following denials all return HTTP 403 with data.error_id == ERR_UNAUTHORIZED because the acting role is absent from the endpoint's §1.5 roles list: POST /assessment-cycles as DataSteward, BoardChair, PartnerRepresentative, ComplianceOfficer or PublicViewer; POST /health-indicators/{indicator_id}/data-points and POST /indicator-data-points/{data_point_id}/void as CommunityBenefitOfficer; POST /assessment-cycles/{cycle_id}/board-action as CommunityBenefitOfficer or ComplianceOfficer; POST /community-benefit-reports/{report_id}/finalize and POST /assessment-cycles/{cycle_id}/file-return as CommunityBenefitOfficer; POST /priority-candidates/{candidate_id}/select as BoardChair; POST /responsible-parties as PartnerRepresentative"
            - "the denials leave no rows behind: GET /health-indicators?cycle_id=${cyc} still totals 2"

      - name: missing_or_unknown_role_header_precedes_every_authorization_check
        claim_type: Denied Operations
        grounds:
          - validations.priority_1.ERR_UNAUTHENTICATED
          - validations.priority_2.ERR_UNAUTHORIZED
        distinguishing_aspect: "Authentication at priority 1 is decided before authorization at priority 2 and before the priority-3 path lookup, so a request with no role header against a non-existent cycle answers ERR_UNAUTHENTICATED rather than ERR_UNAUTHORIZED or ERR_CYCLE_NOT_FOUND."
        test_recipe:
          setup:
            - "empty database; no rows are needed because the checks that fire precede every lookup"
          setup_api_calls:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
              as: CommunityBenefitOfficer
              captures: { cyc: $.data.id }
          trigger:
            - call: "GET /assessment-cycles/${cyc}"
              payload: {}
              as: CommunityBenefitOfficer
          assert:
            - "trigger call: HTTP 200 — the baseline with both headers present and a known role succeeds"
            - "the same GET with the X-User-Role header omitted returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "the same GET with the X-User-ID header omitted returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "the same GET with X-User-Role: CommunityBenefitOffice (not one of the six declared roles) returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED, not 403"
            - "POST /assessment-cycles/00000000-0000-0000-0000-000000000000/advance with no headers at all returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED, not ERR_CYCLE_NOT_FOUND"

      - name: advance_actor_refinement_splits_the_close_from_every_other_transition
        claim_type: Denied Operations
        grounds:
          - validations.priority_2.advance_actor_refinement
          - endpoints["POST /assessment-cycles/{cycle_id}/advance"].roles
        distinguishing_aspect: "Both the officer and the compliance officer appear in the advance endpoint's roles list, so authorization is decided per requested to_status: the officer is refused CLOSED and the compliance officer is refused DATA_COLLECTION, each with ERR_UNAUTHORIZED ahead of the priority-12 state check that would otherwise reject the same call."
        test_recipe:
          setup:
            - "AssessmentCycle in DRAFT"
          setup_api_calls:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
              as: CommunityBenefitOfficer
              captures: { cyc: $.data.id }
          trigger:
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "CLOSED" }
              as: CommunityBenefitOfficer
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "DATA_COLLECTION" }
              as: ComplianceOfficer
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "DATA_COLLECTION" }
              as: CommunityBenefitOfficer
          assert:
            - "trigger call 1: HTTP 403 with data.error_id == ERR_UNAUTHORIZED — priority 2 answers before priority 12, so the illegal DRAFT -> CLOSED shape never reports ERR_INVALID_STATE"
            - "trigger call 2: HTTP 403 with data.error_id == ERR_UNAUTHORIZED even though DRAFT -> DATA_COLLECTION is a legal transition"
            - "trigger call 3: HTTP 200 with data.status == DATA_COLLECTION and data.posture == OPEN"

      - name: partner_signature_is_bound_to_both_the_side_and_the_counterparty
        claim_type: Denied Operations
        grounds:
          - validations.priority_2.sign_side_refinement
          - validations.priority_6.ERR_NOT_AGREEMENT_PARTY
          - roles.PartnerRepresentative.identity
        distinguishing_aspect: "The sign endpoint carries two authorization gates in order: the priority-2 side refinement rejects a PartnerRepresentative claiming the HOSPITAL side even when its X-User-ID is the correct party, and only then does priority 6 reject a PartnerRepresentative whose X-User-ID is a different PARTNER party."
        test_recipe:
          setup:
            - "AssessmentCycle in DRAFT with two PARTNER parties and one NEGOTIATING PartnershipAgreement held by the first of them"
          setup_api_calls:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
              as: CommunityBenefitOfficer
              captures: { cyc: $.data.id }
            - call: "POST /responsible-parties"
              payload: { name: "Northside Housing Trust", party_type: "PARTNER", fte_capacity_bp: 5000 }
              as: CommunityBenefitOfficer
              captures: { p1: $.data.id }
            - call: "POST /responsible-parties"
              payload: { name: "Riverbend Food Bank", party_type: "PARTNER", fte_capacity_bp: 5000 }
              as: CommunityBenefitOfficer
              captures: { p2: $.data.id }
            - call: "POST /partnership-agreements"
              payload: { cycle_id: "${cyc}", party_id: "${p1}", pledged_cents: 800000, accountability_metric: "Households receiving housing navigation", shared_accountability_pct: 40.00, term_start: "2026-10-01", term_end: "2027-09-30" }
              as: CommunityBenefitOfficer
              captures: { agr: $.data.id }
          trigger:
            - call: "POST /partnership-agreements/${agr}/sign"
              payload: { signatory_side: "HOSPITAL" }
              as: PartnerRepresentative
              as_user_id: "${p1}"
            - call: "POST /partnership-agreements/${agr}/sign"
              payload: { signatory_side: "PARTNER" }
              as: PartnerRepresentative
              as_user_id: "${p2}"
            - call: "POST /partnership-agreements/${agr}/sign"
              payload: { signatory_side: "PARTNER" }
              as: PartnerRepresentative
              as_user_id: "${p1}"
            - call: "GET /partnership-agreements/${agr}"
              payload: {}
              as: PartnerRepresentative
              as_user_id: "${p1}"
          assert:
            - "trigger call 1: HTTP 403 with data.error_id == ERR_UNAUTHORIZED — the priority-2 side refinement fires even though X-User-ID is the agreement's own party"
            - "trigger call 2: HTTP 403 with data.error_id == ERR_NOT_AGREEMENT_PARTY — right side, wrong counterparty"
            - "trigger call 3: HTTP 200 with partner_signed_at stamped, partner_signatory_user_id == ${p1}, and signature_state still PARTNER_SIGNED because the hospital side has not signed"
            - "trigger call 4: data.hospital_signed_at == null and data.funding_state == UNFUNDED — the two rejected attempts stamped nothing"
            - "POST /partnership-agreements/${agr}/sign with signatory_side PARTNER as CommunityBenefitOfficer returns HTTP 403 with data.error_id == ERR_UNAUTHORIZED (the mirror image of trigger call 1)"

      - name: paired_report_steps_refuse_the_user_who_performed_the_first_half
        claim_type: Segregation of duties
        grounds:
          - validations.priority_7.ERR_SEGREGATION_OF_DUTIES
          - endpoints["POST /community-benefit-reports"].side_effects.created_by_user_id
          - endpoints["POST /expense-postings"].side_effects.posted_by_user_id
        distinguishing_aspect: "Both segregated pairs compare X-User-ID rather than role: the void refuses the officer who posted (u_officer_1) and the finalize refuses a compliance officer presenting the report creator's user id, while a second user id clears each of them in turn."
        test_recipe:
          setup:
            - "AssessmentCycle in DRAFT with an OPEN CommunityBenefitReport created by u_officer_1 and one POSTED posting posted by u_officer_1"
          setup_api_calls:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
              captures: { cyc: $.data.id }
            - call: "POST /community-benefit-reports"
              payload: { cycle_id: "${cyc}", fiscal_year: 2026 }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
              captures: { rep: $.data.id, rep_v: $.data.version }
            - call: "POST /expense-postings"
              payload: { report_id: "${rep}", category: "FINANCIAL_ASSISTANCE", charges_cents: 1005, direct_cost_cents: 0, expected_report_version: "${rep_v}" }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
              captures: { post1: $.data.id }
          trigger:
            - call: "POST /expense-postings/${post1}/void"
              payload: { reason: "Duplicate charge extract" }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
            - call: "POST /expense-postings/${post1}/void"
              payload: { reason: "Duplicate charge extract" }
              as: ComplianceOfficer
              as_user_id: "u_compliance_1"
            - call: "POST /community-benefit-reports/${rep}/finalize"
              payload: { audited_cost_to_charge_ratio: 0.3200 }
              as: ComplianceOfficer
              as_user_id: "u_officer_1"
            - call: "POST /community-benefit-reports/${rep}/finalize"
              payload: { audited_cost_to_charge_ratio: 0.3200 }
              as: ComplianceOfficer
              as_user_id: "u_compliance_1"
          assert:
            - "trigger call 1: HTTP 403 with data.error_id == ERR_SEGREGATION_OF_DUTIES — the officer is in the void endpoint's roles list, so the refusal is the user-id comparison, not ERR_UNAUTHORIZED"
            - "trigger call 2: HTTP 200 with data.status == VOID, voided_by_user_id == u_compliance_1, and the report back to financial_assistance_total_cents == 0 and grand_total_cents == 0"
            - "trigger call 3: HTTP 403 with data.error_id == ERR_SEGREGATION_OF_DUTIES — the role is right but X-User-ID equals report.created_by_user_id"
            - "trigger call 4: HTTP 200 with data.status == LOCKED, valuation_basis == FINAL and finalized_by_user_id == u_compliance_1"

      - name: public_viewer_reaches_the_availability_surface_and_nothing_else
        claim_type: Denied Operations
        grounds:
          - roles.PublicViewer.shared_operations
          - validations.priority_2.ERR_UNAUTHORIZED
        distinguishing_aspect: "PublicViewer appears in exactly four §1.5 roles lists, so the two cycle reads and the two evaluation reads answer 200 while every other read — indicators, interviews, candidates, strategies, agreements, reports and postings — and every write answer ERR_UNAUTHORIZED."
        test_recipe:
          setup:
            - "AssessmentCycle in DRAFT with one DRAFT ProgressEvaluation"
          setup_api_calls:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
              as: CommunityBenefitOfficer
              captures: { cyc: $.data.id }
            - call: "POST /progress-evaluations"
              payload: { cycle_id: "${cyc}", eval_type: "MID_CYCLE", period_year: 2027, findings_summary: "Interim scan of implementation progress" }
              as: CommunityBenefitOfficer
              captures: { ev: $.data.id }
          trigger:
            - call: "GET /assessment-cycles"
              payload: {}
              as: PublicViewer
            - call: "GET /assessment-cycles/${cyc}"
              payload: {}
              as: PublicViewer
            - call: "GET /assessment-cycles/${cyc}/progress-evaluations"
              payload: {}
              as: PublicViewer
            - call: "GET /progress-evaluations/${ev}"
              payload: {}
              as: PublicViewer
          assert:
            - "trigger call 1: HTTP 200 with data.total_count == 1"
            - "trigger call 2: HTTP 200 with data.id == ${cyc}, data.status == DRAFT and data.public_availability_met == false"
            - "trigger call 3: HTTP 200 with data.total_count == 1 — no §1.4 rule filters unpublished evaluations out of the public list, so the DRAFT row is visible"
            - "trigger call 4: HTTP 200 with data.status == DRAFT"
            - "each of GET /health-indicators, GET /stakeholder-interviews, GET /priority-candidates, GET /implementation-strategies, GET /partnership-agreements, GET /community-benefit-reports, GET /expense-postings and GET /responsible-parties as PublicViewer returns HTTP 403 with data.error_id == ERR_UNAUTHORIZED"
            - "POST /assessment-cycles and POST /progress-evaluations as PublicViewer return HTTP 403 with data.error_id == ERR_UNAUTHORIZED; PublicViewer.exclusive_operations is empty"

  # ===========================================================================
  # From Cross-Cutting Complexity Layers — the five layers declared in
  # complexity_profile.complexity_layers, with one instance per §1.2.1
  # concurrency rule as the guide's optimistic_concurrency row demands.
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_expected_candidate_version_rejects_the_strategy_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.strategy-create-stale-candidate
          - endpoints["POST /implementation-strategies"].input.expected_candidate_version
          - errors[ERR_STALE_CANDIDATE_VERSION]
        distinguishing_aspect: "The version the client observed at score time is one behind the version select left, so the strategy create is refused with 412; the refreshed version succeeds and is itself consumed by that success, so replaying it is refused again — PriorityCandidate.version increments on every write, including the strategy create's own strategy_count bump."
        test_recipe:
          setup:
            - "AssessmentCycle in STRATEGY_DEVELOPMENT with one SELECTED PriorityCandidate, holding both the pre-select and the current candidate version"
          setup_api_calls:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
              as: CommunityBenefitOfficer
              captures: { cyc: $.data.id }
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "DATA_COLLECTION" }
              as: CommunityBenefitOfficer
            - call: "POST /health-indicators"
              payload: { cycle_id: "${cyc}", domain: "BEHAVIORAL_HEALTH", name: "Adult depression prevalence", benchmark_value: 12.0 }
              as: CommunityBenefitOfficer
              captures: { ind: $.data.id }
            - call: "POST /health-indicators/${ind}/data-points"
              payload: { population_subgroup: "OVERALL", source_type: "PUBLIC_DATASET", value: 18.6, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "POST /health-indicators/${ind}/data-points"
              payload: { population_subgroup: "BLACK_NH", source_type: "PUBLIC_DATASET", value: 24.8, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "POST /health-indicators/${ind}/data-points"
              payload: { population_subgroup: "WHITE_NH", source_type: "PUBLIC_DATASET", value: 15.5, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "POST /responsible-parties"
              payload: { name: "Community Health Office", party_type: "INTERNAL", fte_capacity_bp: 10000 }
              as: CommunityBenefitOfficer
              captures: { fac: $.data.id }
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "INPUT_GATHERING" }
              as: CommunityBenefitOfficer
            - call: "POST /stakeholder-interviews"
              payload: { cycle_id: "${cyc}", facilitator_party_id: "${fac}", organization_name: "Riverbend Free Clinic", sector: "SAFETY_NET_PROVIDER", starts_at: "2026-04-06T14:00:00Z", ends_at: "2026-04-06T15:00:00Z" }
              as: CommunityBenefitOfficer
              captures: { iv1: $.data.id }
            - call: "POST /stakeholder-interviews/${iv1}/complete"
              payload: { concern_ratings: { BEHAVIORAL_HEALTH: 5 }, attendee_count: 12 }
              as: CommunityBenefitOfficer
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "PRIORITIZATION" }
              as: CommunityBenefitOfficer
            - call: "POST /priority-candidates"
              payload: { cycle_id: "${cyc}", indicator_id: "${ind}", hospital_capacity_score: 70 }
              as: CommunityBenefitOfficer
              captures: { cand: $.data.id }
            - call: "POST /priority-candidates/${cand}/score"
              payload: { scoring_variant: "EQUAL_WEIGHT" }
              as: CommunityBenefitOfficer
              captures: { cand_v_at_score: $.data.version }
            - call: "POST /priority-candidates/${cand}/select"
              payload: { selection_rationale: "Highest composite need with hospital capacity to act" }
              as: CommunityBenefitOfficer
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "STRATEGY_DEVELOPMENT" }
              as: CommunityBenefitOfficer
            - call: "GET /priority-candidates/${cand}"
              payload: {}
              as: CommunityBenefitOfficer
              captures: { cand_v_now: $.data.version }
          trigger:
            - call: "POST /implementation-strategies"
              payload: { candidate_id: "${cand}", title: "Integrated behavioural health access", authorized_budget_cents: 5000000, expected_candidate_version: "${cand_v_at_score}" }
              as: CommunityBenefitOfficer
            - call: "POST /implementation-strategies"
              payload: { candidate_id: "${cand}", title: "Integrated behavioural health access", authorized_budget_cents: 5000000, expected_candidate_version: "${cand_v_now}" }
              as: CommunityBenefitOfficer
              captures: { strat: $.data.id }
            - call: "POST /implementation-strategies"
              payload: { candidate_id: "${cand}", title: "Integrated behavioural health access, revision 2", authorized_budget_cents: 4000000, expected_candidate_version: "${cand_v_now}" }
              as: CommunityBenefitOfficer
            - call: "GET /priority-candidates/${cand}"
              payload: {}
              as: CommunityBenefitOfficer
          assert:
            - "trigger call 1: HTTP 412 with data.error_id == ERR_STALE_CANDIDATE_VERSION — ${cand_v_at_score} is the version select superseded"
            - "trigger call 1 leaves nothing behind: GET /implementation-strategies?candidate_id=${cand} totals 0 and the candidate's strategy_count is still 0"
            - "trigger call 2: HTTP 201 with approval_state == DRAFT, execution_state == NOT_STARTED and budget_available_cents == 5000000"
            - "trigger call 3: HTTP 412 with data.error_id == ERR_STALE_CANDIDATE_VERSION — the successful create bumped the candidate past ${cand_v_now}, so no strategy is superseded and GET /implementation-strategies?candidate_id=${cand} still totals 1 with ${strat} in approval_state DRAFT"
            - "trigger call 4: data.version == ${cand_v_now} + 1 and data.strategy_count == 1"

      - name: stale_expected_report_version_rejects_the_expense_posting
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.posting-create-stale-report
          - endpoints["POST /expense-postings"].input.expected_report_version
          - errors[ERR_STALE_REPORT_VERSION]
        distinguishing_aspect: "Every accepted posting bumps CommunityBenefitReport.version, so the version observed at report creation is already stale after the first posting; the 412 is raised before valuation, leaving financial_assistance_total_cents at 395061 rather than adding the rejected posting's 160000."
        test_recipe:
          setup:
            - "AssessmentCycle in DRAFT with an OPEN CommunityBenefitReport carrying one POSTED charge-based posting, holding both the creation-time and the current report version"
          setup_api_calls:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
              captures: { cyc: $.data.id }
            - call: "POST /community-benefit-reports"
              payload: { cycle_id: "${cyc}", fiscal_year: 2026 }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
              captures: { rep: $.data.id, rep_v_at_create: $.data.version }
            - call: "POST /expense-postings"
              payload: { report_id: "${rep}", category: "FINANCIAL_ASSISTANCE", charges_cents: 1234567, direct_cost_cents: 0, expected_report_version: "${rep_v_at_create}" }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
            - call: "GET /community-benefit-reports/${rep}"
              payload: {}
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
              captures: { rep_v_now: $.data.version }
          trigger:
            - call: "POST /expense-postings"
              payload: { report_id: "${rep}", category: "FINANCIAL_ASSISTANCE", charges_cents: 500000, direct_cost_cents: 0, expected_report_version: "${rep_v_at_create}" }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
            - call: "GET /community-benefit-reports/${rep}"
              payload: {}
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
            - call: "POST /expense-postings"
              payload: { report_id: "${rep}", category: "FINANCIAL_ASSISTANCE", charges_cents: 500000, direct_cost_cents: 0, expected_report_version: "${rep_v_now}" }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
            - call: "POST /expense-postings"
              payload: { report_id: "${rep}", category: "SUBSIDIZED_SERVICES", charges_cents: 500000, direct_cost_cents: 0, expected_report_version: "${rep_v_now}" }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
          assert:
            - "trigger call 1: HTTP 412 with data.error_id == ERR_STALE_REPORT_VERSION"
            - "trigger call 2: data.version == ${rep_v_now}, data.financial_assistance_total_cents == 395061 and GET /expense-postings?report_id=${rep} totals 1 — the rejected posting was never valued"
            - "trigger call 3: HTTP 201 with valued_cents == 160000 and the report at financial_assistance_total_cents == 555061"
            - "trigger call 4: HTTP 412 with data.error_id == ERR_STALE_REPORT_VERSION — trigger call 3 consumed ${rep_v_now}, so subsidized_services_total_cents stays 0"

      - name: cycle_child_counters_reconcile_after_create_change_and_removal
        claim_type: derived_field_reconciliation
        grounds:
          - entities.AssessmentCycle.fields.completed_interview_count
          - entities.AssessmentCycle.fields.selected_priority_count
          - state_machines.PriorityCandidate.transitions[SCORED->DEFERRED]
        distinguishing_aspect: "Both cycle counters are recomputed on every child state change in either direction: completing one of two interviews puts completed_interview_count at 1 and cancelling the other leaves it at 1, while selecting two candidates puts selected_priority_count at 2 and deferring one takes it back to 1."
        test_recipe:
          setup:
            - "AssessmentCycle in INPUT_GATHERING with two SCHEDULED interviews and two SUFFICIENT BEHAVIORAL_HEALTH indicators"
          setup_api_calls:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
              as: CommunityBenefitOfficer
              captures: { cyc: $.data.id }
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "DATA_COLLECTION" }
              as: CommunityBenefitOfficer
            - call: "POST /health-indicators"
              payload: { cycle_id: "${cyc}", domain: "BEHAVIORAL_HEALTH", name: "Adult depression prevalence", benchmark_value: 12.0 }
              as: CommunityBenefitOfficer
              captures: { ind_a: $.data.id }
            - call: "POST /health-indicators/${ind_a}/data-points"
              payload: { population_subgroup: "OVERALL", source_type: "PUBLIC_DATASET", value: 18.6, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "POST /health-indicators/${ind_a}/data-points"
              payload: { population_subgroup: "BLACK_NH", source_type: "PUBLIC_DATASET", value: 24.8, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "POST /health-indicators/${ind_a}/data-points"
              payload: { population_subgroup: "WHITE_NH", source_type: "PUBLIC_DATASET", value: 15.5, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "POST /health-indicators"
              payload: { cycle_id: "${cyc}", domain: "BEHAVIORAL_HEALTH", name: "Youth suicidal ideation rate", benchmark_value: 12.0 }
              as: CommunityBenefitOfficer
              captures: { ind_b: $.data.id }
            - call: "POST /health-indicators/${ind_b}/data-points"
              payload: { population_subgroup: "OVERALL", source_type: "PUBLIC_DATASET", value: 18.6, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "POST /health-indicators/${ind_b}/data-points"
              payload: { population_subgroup: "BLACK_NH", source_type: "PUBLIC_DATASET", value: 24.8, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "POST /health-indicators/${ind_b}/data-points"
              payload: { population_subgroup: "WHITE_NH", source_type: "PUBLIC_DATASET", value: 15.5, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "POST /responsible-parties"
              payload: { name: "Community Health Office", party_type: "INTERNAL", fte_capacity_bp: 10000 }
              as: CommunityBenefitOfficer
              captures: { fac: $.data.id }
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "INPUT_GATHERING" }
              as: CommunityBenefitOfficer
            - call: "POST /stakeholder-interviews"
              payload: { cycle_id: "${cyc}", facilitator_party_id: "${fac}", organization_name: "Riverbend Free Clinic", sector: "SAFETY_NET_PROVIDER", starts_at: "2026-04-06T14:00:00Z", ends_at: "2026-04-06T15:00:00Z" }
              as: CommunityBenefitOfficer
              captures: { iv1: $.data.id }
            - call: "POST /stakeholder-interviews"
              payload: { cycle_id: "${cyc}", facilitator_party_id: "${fac}", organization_name: "Northside Housing Trust", sector: "HOUSING", starts_at: "2026-04-08T14:00:00Z", ends_at: "2026-04-08T15:00:00Z" }
              as: CommunityBenefitOfficer
              captures: { iv2: $.data.id }
          trigger:
            - call: "POST /stakeholder-interviews/${iv1}/complete"
              payload: { concern_ratings: { BEHAVIORAL_HEALTH: 5 }, attendee_count: 12 }
