  - section: validations
    instances:
      - name: missing_auth_headers_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role / X-User-ID headers is rejected 401 ERR_UNAUTHENTICATED before any role, existence, or state logic runs."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /farm-network/farms"
              payload: { name: "No Auth Farm", region: "IA", pasture_sqft: 21600, barn_sqft: 180, nest_box_count: 30, declared_bird_count: 140 }
              captures: { err: $.data.error_id }
          assert:
            - "http status == 401 and error_id == ERR_UNAUTHENTICATED (call sent with no auth headers)"

      - name: unknown_role_header_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A well-formed request whose X-User-Role value is not one of the six declared roles is an authentication failure (401), not an authorization failure (403)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /farm-network/farms"
              payload: { name: "Wrong Role Farm", region: "IA", pasture_sqft: 21600, barn_sqft: 180, nest_box_count: 30, declared_bird_count: 140 }
              as: SuperUser
              captures: { err: $.data.error_id }
          assert:
            - "http status == 401 and error_id == ERR_UNAUTHENTICATED (unknown role is unauthenticated, not merely forbidden)"

      - name: role_check_precedes_existence_returns_403
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=5]"]
        distinguishing_aspect: "Authorization (priority 2) runs before existence (priority 5): a RetailerBuyer requesting a non-existent farm id gets 403 ERR_FORBIDDEN, never a 404."
        test_recipe:
          setup: ["one retailer exists so the entity_backed role has a valid identity"]
          setup_api_calls:
            - call: "POST /farm-network/retailers"
              payload: { name: "Heartland Grocers", banner: "Heartland", terms_net_days: 60 }
              as: PlatformAdmin
              captures: { r_tailer_id: $.data.id }
          trigger:
            - call: "GET /farm-network/farms/00000000-0000-0000-0000-000000000000"
              as: RetailerBuyer
              as_user_id: "${r_tailer_id}"
              captures: { err: $.data.error_id }
          assert:
            - "http status == 403 and error_id == ERR_FORBIDDEN (role check fires before the farm-not-found check)"

      - name: activate_without_prereqs_reports_certification_first
        claim_type: priority_ordering
        grounds: ["validations[priority=9]", "validations[priority=10]", "errors[ERR_CERTIFICATION_REQUIRED]"]
        distinguishing_aspect: "When activation lacks BOTH certification and contract, the safety gate (priority 9) beats the referential gate (priority 10): ERR_CERTIFICATION_REQUIRED is returned."
        test_recipe:
          setup: ["farm F in ONBOARDING with declared 140 <= effective 150 but no audit and no contract"]
          setup_api_calls:
            - call: "POST /farm-network/farms"
              payload: { name: "Unready Farm", region: "IA", pasture_sqft: 21600, barn_sqft: 180, nest_box_count: 30, declared_bird_count: 140 }
              as: NetworkManager
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /farm-network/farms/${f_id}/activate"
              as: NetworkManager
              captures: { err: $.data.error_id }
          assert:
            - "http status == 422 and error_id == ERR_CERTIFICATION_REQUIRED (not ERR_CONTRACT_REQUIRED, although both are missing)"

      - name: commitment_without_forecast_returns_forecast_required
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_FORECAST_REQUIRED]"]
        distinguishing_aspect: "Commitment creation short-circuits on the referential gate when no ProductionForecast exists for the (farm, week_start) pair — before any cap arithmetic."
        test_recipe:
          setup: ["ACTIVE farm F (CERTIFIED, contract covering 2026-09-07), retailer R; NO forecast for week 2026-09-07"]
          setup_api_calls:
            - call: "POST /farm-network/farms"
              payload: { name: "No Forecast Farm", region: "IA", pasture_sqft: 21600, barn_sqft: 180, nest_box_count: 30, declared_bird_count: 140 }
              as: NetworkManager
              captures: { f_id: $.data.id }
            - call: "POST /farm-network/farms/${f_id}/audits"
              payload: { audit_type: "INITIAL", scheduled_for: "2026-09-03T00:00:00Z" }
              as: NetworkManager
              captures: { a_id: $.data.id }
            - call: "POST /farm-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /farm-network/audits/${a_id}/complete"
              payload: { outcome: "PASSED" }
              as: Auditor
              as_user_id: "auditor-a"
            - call: "GET /farm-network/farms/${f_id}"
              as: NetworkManager
              captures: { f_v2: $.data.version }
            - call: "POST /farm-network/farms/${f_id}/contracts"
              payload: { commodity_base_cents_per_dozen: 150, premium_cents_per_dozen: 90, start_date: "2026-09-01", end_date: "2027-08-31", expected_farm_version: "${f_v2}" }
              as: NetworkManager
            - call: "POST /farm-network/farms/${f_id}/activate"
              as: NetworkManager
            - call: "POST /farm-network/retailers"
              payload: { name: "Heartland Grocers", banner: "Heartland", terms_net_days: 60 }
              as: PlatformAdmin
              captures: { r_tailer_id: $.data.id }
          trigger:
            - call: "POST /farm-network/commitments"
              payload: { retailer_id: "${r_tailer_id}", farm_id: "${f_id}", week_start: "2026-09-07", committed_dozens: 10 }
              as: NetworkManager
              captures: { err: $.data.error_id }
          assert:
            - "http status == 422 and error_id == ERR_FORECAST_REQUIRED"

      - name: commitment_on_probation_farm_returns_not_active
        claim_type: cross_entity_validation
        grounds: ["validations[priority=7]", "errors[ERR_FARM_NOT_ACTIVE]", "state_machines.Farm"]
        distinguishing_aspect: "A FAILED audit pushes the farm to PROBATION, and commitment creation against that farm is then rejected ERR_FARM_NOT_ACTIVE — commitment validity depends on the farm's operational state."
        test_recipe:
          setup: ["farm F activated, then FAILED annual audit (no findings) at 2026-10-05 moves it to PROBATION; retailer R exists"]
          setup_api_calls:
            - call: "POST /farm-network/farms"
              payload: { name: "Probation Farm", region: "IA", pasture_sqft: 21600, barn_sqft: 180, nest_box_count: 30, declared_bird_count: 140 }
              as: NetworkManager
