            - "${wst} == REQUESTED - the window's initial_state; ${wclo} == false by default and ${wden} == null"
            - "${wpre} == 0 and ${wset} == 0 for work_class QUIET, so ${wes} == 2026-09-10T08:00:00Z and ${wee} == 2026-09-10T10:00:00Z exactly equal the nominal instants"
