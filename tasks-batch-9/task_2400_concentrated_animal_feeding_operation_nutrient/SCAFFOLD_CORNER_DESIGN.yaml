  # =====================================================================
  # State Machines (§1.2)
  # =====================================================================
  - section: state_machines
    instances:
      - name: every_lifecycle_starts_in_its_declared_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.Permit
          - state_machines.NutrientManagementPlan
          - state_machines.ManureStorage
          - state_machines.IncidentReport
          - state_machines.Inspection
          - state_machines.AnnualReport
        distinguishing_aspect: |
          Six lifecycles are created in one chain and each must sit in its own declared
          initial_state with its stamps still null — including the Permit's SECOND dimension,
          compliance_status, which starts IN_GOOD_STANDING independently of coverage_status.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /cafo/operations"
              payload: { name: "Willow Creek Dairy", county: "Linn", animal_type: "DAIRY_COW", head_count: 300, manure_handling: "LIQUID", open_lot_area_sqft: 40000, discharge_potential: "CONTINUOUS", has_conservation_plan: true }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { op_id: $.data.id }
            - call: "POST /cafo/manure-storages"
              payload: { operation_id: "${op_id}", structure_name: "Lagoon 1", structure_type: "EARTHEN_LAGOON", surface_area_sqft: 60000, total_depth_in: 144, required_freeboard_in: 24 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { st_id: $.data.id }
            - call: "POST /cafo/fields"
              payload: { operation_id: "${op_id}", field_name: "North 40", total_acres: 42.5, distance_to_water_ft: 150, has_tile_inlet: false, slope_pct: 4.0, water_frontage_ft: 900 }
              as: CertifiedPlanner
              as_user_id: "planner-1"
              captures: { fld_id: $.data.id }
            - call: "GET /cafo/operations/${op_id}"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { op_v: $.data.version }
          trigger:
            - call: "POST /cafo/permits"
              payload: { operation_id: "${op_id}", permit_type: "GENERAL", effective_on: "2026-01-01T00:00:00Z" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { pm_id: $.data.id }
            - call: "POST /cafo/nutrient-plans"
              payload: { operation_id: "${op_id}", permit_id: "${pm_id}", plan_year: 2026, allowed_application_methods: ["INJECTION"], winter_application_allowed: false, expected_operation_version: "${op_v}" }
              as: CertifiedPlanner
              as_user_id: "planner-1"
              captures: { pl_id: $.data.id }
            - call: "POST /cafo/incident-reports"
              payload: { operation_id: "${op_id}", incident_type: "MORTALITY", subject_field_id: "${fld_id}", discovered_at: "2026-07-31T12:00:00Z", description: "One head lost to heat stress", mortality_head_count: 1, disposal_method: "COMPOSTING" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { inc_id: $.data.id }
            - call: "POST /cafo/inspections"
              payload: { operation_id: "${op_id}", permit_id: "${pm_id}", scheduled_on: "2026-08-15T00:00:00Z", inspection_kind: "ROUTINE" }
              as: StateReviewer
              as_user_id: "reviewer-1"
              captures: { insp_id: $.data.id }
            - call: "POST /cafo/annual-reports"
              payload: { operation_id: "${op_id}", plan_id: "${pl_id}", report_year: 2026, beginning_storage_gallons: 0, ending_storage_gallons: 0 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { rp_id: $.data.id }
          assert:
            - "Permit.${pm_id}.coverage_status == DRAFT_APPLICATION and compliance_status == IN_GOOD_STANDING, with expiration_on, renewal_window_opens_on and renewal_due_on all null"
            - "NutrientManagementPlan.${pl_id}.plan_status == DRAFT with revision_count == 0, certified_at == null, approved_at == null and certifying_planner_user_id == null"
            - "ManureStorage.${st_id}.storage_status == IN_SERVICE with current_volume_gallons == 0.00 and last_inspected_on == null"
            - "IncidentReport.${inc_id}.incident_status == OPEN with requires_oral_notification == false, oral_notification_deadline_at == null and written_report_deadline_at == null"
            - "Inspection.${insp_id}.inspection_status == SCHEDULED with inspector_user_id == null, conducted_on == null and findings_count == 0"
            - "AnnualReport.${rp_id}.report_status == DRAFT with submitted_at == null, recorded_total_gallons == 0.00, mass_balance_expected_gallons == 3374298.00, variance_pct == -100.00 and variance_classification == EXCEEDS_TOLERANCE"
            - "Operation.${op_id}.compliance_posture == OPEN, because a MORTALITY incident is not a DISCHARGE or SPILL"
      - name: permit_coverage_transitions_from_wrong_state_are_rejected
        claim_type: invalid_transitions
        grounds:
          - validations[priority=9]
          - errors.ERR_PERMIT_STATE_INVALID
          - state_machines.Permit
        distinguishing_aspect: |
          From DRAFT_APPLICATION only submit is declared, so issue-coverage, initiate-renewal and
          complete-renewal must all fail with ERR_PERMIT_STATE_INVALID, and a second submit after
          the first must fail the same way — four rejections against one row.
        test_recipe:
          setup:
            - "One Willow Creek Dairy operation with permit_required true"
            - "One GENERAL permit in coverage_status DRAFT_APPLICATION"
          setup_api_calls:
            - call: "POST /cafo/operations"
              payload: { name: "Willow Creek Dairy", county: "Linn", animal_type: "DAIRY_COW", head_count: 300, manure_handling: "LIQUID", open_lot_area_sqft: 40000, discharge_potential: "CONTINUOUS", has_conservation_plan: true }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { op_id: $.data.id }
            - call: "POST /cafo/permits"
              payload: { operation_id: "${op_id}", permit_type: "GENERAL", effective_on: "2026-01-01T00:00:00Z" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { pm_id: $.data.id }
          trigger:
            - call: "POST /cafo/permits/${pm_id}/issue-coverage"
              payload: {}
              as: StateReviewer
              as_user_id: "reviewer-1"
              captures: { err_issue: $.data.error_id }
            - call: "POST /cafo/permits/${pm_id}/initiate-renewal"
              payload: {}
              as: Operator
              as_user_id: "${op_id}"
              captures: { err_renew: $.data.error_id }
            - call: "POST /cafo/permits/${pm_id}/complete-renewal"
              payload: {}
              as: StateReviewer
              as_user_id: "reviewer-1"
              captures: { err_complete: $.data.error_id }
            - call: "POST /cafo/permits/${pm_id}/submit"
              payload: {}
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /cafo/permits/${pm_id}/submit"
              payload: {}
              as: Operator
              as_user_id: "${op_id}"
              captures: { err_resubmit: $.data.error_id }
          assert:
            - "err_issue, err_renew, err_complete and err_resubmit are each ERR_PERMIT_STATE_INVALID with status 409"
            - "the fourth trigger call returns 200 and Permit.${pm_id}.coverage_status == SUBMITTED"
            - "Permit.${pm_id}.expiration_on == null and renewal_submitted_at == null after all five calls"
            - "Permit.${pm_id}.compliance_status is STILL IN_GOOD_STANDING, untouched by the coverage dimension"
      - name: plan_submit_before_certification_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=10]
          - errors.ERR_PLAN_STATE_INVALID
          - state_machines.NutrientManagementPlan.CERTIFIED_to_SUBMITTED
        distinguishing_aspect: |
          CERTIFIED -> SUBMITTED is the only declared submit edge, so submitting a DRAFT plan is
          rejected even though the operator is the correct role and owns the operation.
        test_recipe:
          setup:
            - "One Willow Creek Dairy operation with a COVERED permit"
