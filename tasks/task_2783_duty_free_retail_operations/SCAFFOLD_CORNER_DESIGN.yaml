          assert:
            - "every call in the trigger chain returns a 2xx status"
            - "PreOrder.${po_150}.status == CONVERTED and converted_sale_id == ${sale_150}"
            - "Sale.${sale_150}.channel == PRE_ORDER and fulfillment_status == PICKED_UP and gross_amount_cents == 16000"
            - "BondedStockItem.${si_whisky}.on_hand_qty == 18 and reserved_qty == 0"
            - "ConcessionAgreement.${ag_sin}.status == CLOSED and gross_sales_cents == 16000 and final_rent_cents == 10000"
            - "CustomsAudit.${au_150}.status == CLOSED_CLEAN and shrinkage_qty == 0 and assessed_duty_cents == 0"
            - "ExclusivityGrant.${g_aurora}.status == REVOKED and revoked_at == 2026-09-01T00:00:00Z"
            - "Brand.${b_aurora}.status == SUSPENDED and suspended_at == 2026-09-01T00:00:00Z"

      - name: another_roles_exclusive_operation_is_unauthorized_for_every_peer_role
        claim_type: role_cannot_perform_others_exclusive_operations
        grounds:
          - errors.ERR_UNAUTHORIZED
          - complexity_profile.role_model
          - roles.TerminalAdmin.exclusive_operations
          - roles.StockController.exclusive_operations
          - roles.CustomsAuditor.exclusive_operations
        distinguishing_aspect: |
          The five roles are PEERS, not a hierarchy: TerminalAdmin owns the estate but MUST NOT post
          bonded movements, StockController MUST NOT open a sale, SalesAssociate MUST NOT create a
          brand nor read the rent projection, CustomsAuditor MUST NOT submit the count it will
