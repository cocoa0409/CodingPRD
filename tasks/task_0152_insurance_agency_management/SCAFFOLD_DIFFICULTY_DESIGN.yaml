              as: AgencyAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /producers"
              payload: { full_name: "Prod C8b", npn: "NPN882", default_split_pct: 1.0 }
              as: AgencyAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /licenses"
              payload: { producer_id: "${prod_id}", state_code: "CA", line_of_business: "AUTO", effective_date: "2025-01-01T00:00:00Z", expiration_date: "2030-01-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /appointments"
              payload: { carrier_id: "${car_id}", producer_id: "${prod_id}", state_code: "CA" }
              as: AgencyAdmin
              captures: { appt_id: $.data.id, appt_v: $.data.version }
            - call: "POST /appointments/${appt_id}/approve"
              payload: { expected_appointment_version: "${appt_v}" }
              as: AgencyAdmin
              captures: { appt_v2: $.data.version }
            - call: "POST /appointments/${appt_id}/activate"
              payload: { expected_appointment_version: "${appt_v2}" }
              as: AgencyAdmin
            - call: "POST /accounts"
              payload: { name: "Acct C8b", servicing_producer_id: "${prod_id}", account_type: "PERSONAL" }
              as: AgencyAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /policies"
              payload: { account_id: "${acct_id}", product_id: "${prod_id}", writing_producer_id: "${prod_id}", state_code: "CA", annual_premium_cents: 1200000, effective_date: "2026-01-01T00:00:00Z", expiration_date: "2027-01-01T00:00:00Z" }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { pol_id: $.data.id, pol_v: $.data.version }
            - call: "POST /policies/${pol_id}/bind"
              payload: { expected_policy_version: "${pol_v}" }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { pol_v2: $.data.version }
            - call: "POST /policies/${pol_id}/activate"
              payload: { expected_policy_version: "${pol_v2}" }
              as: AccountManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /renewal-tasks"
              payload: { policy_id: "${pol_id}", target_effective_date: "2027-01-01T00:00:00Z" }
              as: AccountManager
              captures: { rt_id: $.data.id, rt_v: $.data.version }
            - call: "POST /renewal-tasks/${rt_id}/advance"
              payload: { expected_renewaltask_version: "${rt_v}" }
              as: AccountManager
              captures: { rt_v2: $.data.version }
            - call: "POST /renewal-tasks/${rt_id}/advance"
              payload: { expected_renewaltask_version: "${rt_v2}" }
              as: AccountManager
              captures: { rt_v3: $.data.version }
            - call: "POST /renewal-tasks/${rt_id}/advance"
              payload: { expected_renewaltask_version: "${rt_v3}" }
              as: AccountManager
              captures: { rt_v4: $.data.version }
          trigger:
            - call: "POST /renewal-tasks/${rt_id}/complete"
              payload: { expected_renewaltask_version: "${rt_v4}", annual_premium_cents: 1250000, effective_date: "2027-01-02T00:00:00Z", expiration_date: "2028-01-02T00:00:00Z" }
              as: AccountManager
