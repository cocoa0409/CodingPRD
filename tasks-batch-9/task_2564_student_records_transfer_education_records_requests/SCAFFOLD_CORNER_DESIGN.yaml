              captures: { withdrawal_id: "$.data.id" }
          trigger:
            - call: "POST /records-office/students/${student_id}/withdrawals"
              payload: { effective_date: "2026-08-20", destination_district_code: "TXD-9", withdrawal_reason: "MOVED" }
              as: RecordsClerk
            - call: "POST /records-office/withdrawals/${withdrawal_id}/complete"
              payload: {}
              as: RecordsOfficer
              as_user_id: "officer-1"
            - call: "POST /records-office/students/${student_id}/withdrawals"
