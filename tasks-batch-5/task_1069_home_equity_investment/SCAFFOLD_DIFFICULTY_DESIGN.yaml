  - rule_id: compensating_invariant
    instances:
      - name: fund_capital_conserved_present_then_withdraw
        grounds:
          - calculations.fund_committed_capital
          - state_machines.Offer.PRESENTED_to_WITHDRAWN
          - entities.Fund.fields.committed_capital_cents
          - entities.Fund.fields.available_capital_cents
        distinguishing_aspect: |
          Conserved quantity = Fund capital. Presenting an offer moves 10000000 into committed_capital_cents;
          withdrawing it moves the same 10000000 back. Across the forward+compensating pair,
          committed + available == total_capital == 50000000 holds, ending at committed 0 / available 50000000.
        test_recipe:
          setup:
            - "Fund total 50000000; Application APPROVED; one Offer PRESENTED for investment 10000000 (committed 10000000)"
          setup_api_calls:
            - call: "POST /hei/funds"
              payload: { name: "F17", total_capital_cents: 50000000 }
              as: InvestmentAnalyst
              captures: { fund_id: $.data.id }
            - call: "POST /hei/homeowners"
              payload: { email: "ho17@x.com", full_name: "Ho Seventeen" }
              as: InvestmentAnalyst
              captures: { ho_id: $.data.id }
            - call: "POST /hei/applications"
              payload: { homeowner_id: "${ho_id}", fund_id: "${fund_id}", property_address: "17 Main St", property_type: "SINGLE_FAMILY", homeowner_estimated_value_cents: 80000000, existing_mortgage_balance_cents: 40000000, requested_investment_cents: 10000000 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { app_id: $.data.id }
            - call: "POST /hei/applications/${app_id}/valuations"
              payload: { method: "AVM", valued_amount_cents: 80000000, confidence_score: 0.9 }
              as: InvestmentAnalyst
              captures: { val_id: $.data.id }
            - call: "POST /hei/applications/${app_id}/submit"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
            - call: "POST /hei/applications/${app_id}/decision"
              payload: { decision: "APPROVE" }
              as: InvestmentAnalyst
            - call: "POST /hei/applications/${app_id}/offers"
              payload: { valuation_id: "${val_id}", investment_amount_cents: 10000000, option_percentage: 0.25, risk_adjustment_pct: 0.10, term_months: 120, capped_annual_rate: 0.19, expires_at: "2027-01-01T00:00:00Z" }
              as: InvestmentAnalyst
              captures: { offer_id: $.data.id }
          trigger:
            - call: "POST /hei/offers/${offer_id}/withdraw"
              payload: {}
              as: InvestmentAnalyst
            - call: "GET /hei/funds/${fund_id}"
              payload: {}
              as: InvestmentAnalyst
              captures: { committed_after: $.data.committed_capital_cents, available_after: $.data.available_capital_cents }
          assert:
            - "Fund.${fund_id}.committed_capital_cents == 0"
            - "Fund.${fund_id}.available_capital_cents == 50000000"

      - name: settlement_proceeds_conserved_waterfall
        grounds:
          - calculations.settlement_waterfall
          - entities.Settlement.fields.homeowner_payout_cents
          - entities.Settlement.fields.net_proceeds_cents
        distinguishing_aspect: |
          Conserved quantity = settlement gross proceeds (a different quantity than Fund capital). For the SALE
          settlement (ending 120000000): mortgage_payoff 40000000 + settlement_fee 1550000 + investment 10000000
          + appreciation_share 3800000 + homeowner_payout 64650000 == 120000000 exactly.
        test_recipe:
          setup:
