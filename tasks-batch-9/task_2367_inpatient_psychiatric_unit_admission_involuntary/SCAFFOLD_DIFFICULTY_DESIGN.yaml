      - name: petition_hold_state_precedes_filing_window
        grounds:
          - validations[priority=15]
          - validations[priority=31]
          - errors[ERR_HOLD_NOT_ACTIVE]
          - errors[ERR_PETITION_WINDOW_CLOSED]
        distinguishing_aspect: |
          A different error-category pair from the placement conflict: one petition request violates
          a state rule (priority 15, hold still PENDING_CERTIFICATION -> 409) and a business_temporal
          rule (priority 31, clock past petition_filing_deadline_at -> 422) at once and must return
          ERR_HOLD_NOT_ACTIVE, while an otherwise identical request against a certified ACTIVE hold
          past the same deadline returns ERR_PETITION_WINDOW_CLOSED.
        test_recipe:
          setup:
            - "Two patients, each with an evaluation signed at 2026-09-03T08:00:00Z scoring 7 (MODERATE, recommended INVOLUNTARY_HOLD)."
            - "Hold W1 is initiated and left PENDING_CERTIFICATION; hold W2 is initiated and certified at 2026-09-03T08:00:00Z, so it is ACTIVE."
            - "Both holds share petition_filing_deadline_at 2026-09-08T09:00:00.000Z (raw +72h lands Sunday 2026-09-06, rolled past the 2026-09-07 holiday)."
            - "The logical clock is then advanced to 2026-09-09T10:00:00Z, past that deadline; no compliance sweep is run, so hold W2 remains ACTIVE."
