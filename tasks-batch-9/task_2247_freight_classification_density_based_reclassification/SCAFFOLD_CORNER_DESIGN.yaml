              payload: { shipment_id: "${cust1}", device_type: "NOT_A_DEVICE", measured_total_weight_lb: -5, line_measurements: [] }
              as: TerminalOperator
              captures: { e_no_user2: "$.data.error_id" }
          assert:
            - "trigger[1] returns 401 ERR_UNAUTHENTICATED (X-Role header omitted entirely)"
            - "trigger[2] returns 401 ERR_UNAUTHENTICATED (X-Role TariffClerk is not a declared role) and no Customer row named GHOST exists"
            - "trigger[3] returns 401 ERR_UNAUTHENTICATED (Shipper is entity_backed and X-User-ID is omitted) and no Shipment row exists"
            - "trigger[4] returns 401 ERR_UNAUTHENTICATED, not 400 ERR_INVALID_REQUEST -- authentication precedes body validation"
            - "exactly one Customer row and one Terminal row exist after all four calls"

      - name: shipper_and_operator_ownership_is_enforced_across_tenants
        claim_type: peer_roles
        grounds:
          - errors.ERR_NOT_RESOURCE_OWNER
          - roles[Shipper].identity
          - roles[TerminalOperator].identity
          - endpoints[GET /ltl/shipments]
        distinguishing_aspect: "The entity-backed roles are scoped to their own row: shipper ACME cannot read, extend or tender against BETA's shipment and terminal TRM2 cannot capture a shipment that originated at TRM1, all with ERR_NOT_RESOURCE_OWNER, while the scoped collection read silently returns only the caller's own shipment instead of erroring."
