          - calculations.penalty_assessment_amount
        dependency_pair: "PenaltyAssessment depends on AuditCase (the evidentiary finding)"
        distinguishing_aspect: |
          Entity pair PenaltyAssessment -> AuditCase, a third distinct pair. The
          dependency is on a compound property of the other row — status in
          {DISCREPANCY, CLOSED} AND a material finding — so an audit that reached a
          legitimate terminal outcome (RECONCILED / IMMATERIAL) still cannot support an
