      - name: waitlist_offer_run_exact_pool_equality_at_the_boundary
        grounds:
          - calculations.waitlist_offer_selection
          - calculations.bedroom_eligibility_determination
          - calculations.rank_category_derivation
          - entities.Installation.fields.offer_run_epoch
          - endpoints.POST_/installations/{id}/waitlist-offer-run
        distinguishing_aspect: |
          The metric is the candidate-pool membership predicate, which is EXACT
          equality on both bedroom_count and designated_rank_category, never
          `>=` and never a nearest-fit. The same PENDING application is offered
          nothing against a 3-bedroom SENIOR_ENLISTED unit (both keys wrong),
          still nothing against a 2-bedroom SENIOR_ENLISTED unit (bedroom key
          now exactly right, rank key still wrong — the one-attribute boundary),
          and is offered the 2-bedroom JUNIOR_ENLISTED unit only when both keys
          match exactly. The empty-pool runs are successes, not errors, and they
          still advance offer_run_epoch. Different endpoint and different metric
          from every other instance of this rule.
        test_recipe:
          setup:
            - "One installation with offer_response_hours set explicitly to 48."
            - "One 3-bedroom SFH unit designated SENIOR_ENLISTED (B-200) is the only unit at first, status AVAILABLE."
            - "One E5 sponsor with three full-time-custody dependents (spouse plus two boys born 2018-04-10 and 2022-03-15), so bedroom_eligibility is 2 and rank_category is JUNIOR_ENLISTED."
            - "The clock stands at 2026-08-25T00:00:00Z and the application is PENDING with effective_control_date 2026-08-25."
