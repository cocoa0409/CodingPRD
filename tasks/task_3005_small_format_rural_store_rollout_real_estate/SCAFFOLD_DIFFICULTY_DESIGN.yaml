  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: capital_commit_release_invariant
        grounds:
          - calculations.capital_commitment_reconciliation
          - state_machines.SiteControlAgreement.ACTIVE_to_TERMINATED
        distinguishing_aspect: |
          Conserved quantity: program capital. committed_capital_cents rises by
          exactly store.build_cost_cents at agreement ACTIVATE and falls by
          exactly the same amount at TERMINATE — forward + compensating action
          leave committed + available == budget with zero drift.
        test_recipe:
          setup:
            - "ACTIVE program with budget 1000000000; store S UNDER_CONSTRUCTION (TRADITIONAL, build 350000000) with ACTIVE agreement"
          setup_api_calls:
            - call: "POST /rollouts"
              payload: { name: "P", fiscal_year: 2027, new_build_capital_budget_cents: 1000000000 }
              as: PROGRAM_ADMIN
              captures: { rid: $.data.id }
            - call: "POST /rollouts/${rid}/activate"
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/trade-areas"
              payload: { rollout_program_id: "${rid}", name: "C", drive_time_minutes: 20, household_count: 1000, median_household_income_cents: 4500000, grocery_gap_pct: 20 }
              as: PROGRAM_ADMIN
              captures: { taid: $.data.id, ta_v0: $.data.version }
            - call: "POST /rollouts/trade-areas/${taid}/screen"
              payload: { rollout_program_id: "${rid}", expected_trade_area_version: "${ta_v0}" }
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/stores"
              payload: { rollout_program_id: "${rid}", trade_area_id: "${taid}", name: "S" }
              as: PROGRAM_ADMIN
              captures: { sid: $.data.id, s_v0: $.data.version }
            - call: "POST /rollouts/stores/${sid}/select-format"
              payload: { rollout_program_id: "${rid}", expected_store_version: "${s_v0}" }
              as: REAL_ESTATE_MANAGER
            - call: "POST /rollouts/developers"
              payload: { rollout_program_id: "${rid}", name: "DevCo" }
              as: PROGRAM_ADMIN
              captures: { dev: $.data.id }
            - call: "POST /rollouts/site-agreements"
              payload: { store_id: "${sid}", rollout_program_id: "${rid}", developer_id: "${dev}", committed_delivery_date: "2026-11-01T00:00:00Z", base_price_cents: 24000000, earnest_money_cents: 2400000 }
              as: REAL_ESTATE_MANAGER
              captures: { agid: $.data.id }
            - call: "POST /rollouts/site-agreements/${agid}/execute"
              payload: { rollout_program_id: "${rid}" }
              as: REAL_ESTATE_MANAGER
            - call: "POST /rollouts/site-agreements/${agid}/activate"
              payload: { rollout_program_id: "${rid}" }
              as: REAL_ESTATE_MANAGER
          trigger:
            - call: "GET /rollouts/${rid}"
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/site-agreements/${agid}/terminate"
              payload: { rollout_program_id: "${rid}" }
              as: REAL_ESTATE_MANAGER
            - call: "GET /rollouts/${rid}"
              as: PROGRAM_ADMIN
          assert:
            - "after activate: Rollout.committed_capital_cents == 350000000 and available_capital_cents == 650000000"
            - "after terminate: Rollout.committed_capital_cents == 0 and available_capital_cents == 1000000000 (committed + available == budget conserved)"

      - name: developer_slot_release_invariant
        grounds:
          - entities.Developer.fields.active_agreement_count
          - state_machines.SiteControlAgreement.ACTIVE_to_DELIVERED
        distinguishing_aspect: |
          Different conserved quantity: developer agreement slots. activate
          consumes exactly one slot (count +1), delivery releases exactly one
          (count -1) — a full activate->deliver round trip returns
          active_agreement_count to its pre-activation value with no leak.
        test_recipe:
          setup:
            - "ACTIVE program; developer DevCo at 0; store S with agreement AG EXECUTED"
          setup_api_calls:
            - call: "POST /rollouts"
              payload: { name: "P", fiscal_year: 2027, new_build_capital_budget_cents: 2000000000 }
              as: PROGRAM_ADMIN
              captures: { rid: $.data.id }
            - call: "POST /rollouts/${rid}/activate"
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/trade-areas"
              payload: { rollout_program_id: "${rid}", name: "C", drive_time_minutes: 20, household_count: 1000, median_household_income_cents: 4500000, grocery_gap_pct: 20 }
              as: PROGRAM_ADMIN
              captures: { taid: $.data.id, ta_v0: $.data.version }
            - call: "POST /rollouts/trade-areas/${taid}/screen"
              payload: { rollout_program_id: "${rid}", expected_trade_area_version: "${ta_v0}" }
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/stores"
              payload: { rollout_program_id: "${rid}", trade_area_id: "${taid}", name: "S" }
              as: PROGRAM_ADMIN
              captures: { sid: $.data.id, s_v0: $.data.version }
            - call: "POST /rollouts/stores/${sid}/select-format"
              payload: { rollout_program_id: "${rid}", expected_store_version: "${s_v0}" }
              as: REAL_ESTATE_MANAGER
            - call: "POST /rollouts/developers"
              payload: { rollout_program_id: "${rid}", name: "DevCo" }
              as: PROGRAM_ADMIN
              captures: { dev: $.data.id }
            - call: "POST /rollouts/site-agreements"
              payload: { store_id: "${sid}", rollout_program_id: "${rid}", developer_id: "${dev}", committed_delivery_date: "2026-11-01T00:00:00Z", base_price_cents: 24000000, earnest_money_cents: 2400000 }
              as: REAL_ESTATE_MANAGER
              captures: { agid: $.data.id }
            - call: "POST /rollouts/site-agreements/${agid}/execute"
              payload: { rollout_program_id: "${rid}" }
              as: REAL_ESTATE_MANAGER
          trigger:
            - call: "POST /rollouts/site-agreements/${agid}/activate"
              payload: { rollout_program_id: "${rid}" }
              as: REAL_ESTATE_MANAGER
            - call: "POST /rollouts/site-agreements/${agid}/deliveries"
              payload: { rollout_program_id: "${rid}", actual_delivery_date: "2026-11-01T00:00:00Z" }
              as: REAL_ESTATE_MANAGER
            - call: "GET /rollouts/developers"
              as: PROGRAM_ADMIN
          assert:
            - "after activate: Developer.${dev}.active_agreement_count == 1"
            - "after on-time delivery (late_days == 0, penalty_cents == 0): Developer.${dev}.active_agreement_count == 0 — slot conserved across activate+deliver"
