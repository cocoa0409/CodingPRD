            - call: "POST /policies"
              payload: { policyholder_id: "${ph_ci}", coverage_type: "ALL_RISK", valuation_basis: "AGREED_VALUE", deductible_option: "STANDARD" }
              as: Underwriter
              captures: { pol_ci: $.data.id }
            - call: "POST /policies/${pol_ci}/scheduled-items"
              payload: { description: "Ring", category: "RING", location_zip: "10001", scheduled_value_cents: 1000000 }
              as: Underwriter
            - call: "POST /policies/${pol_ci}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_ci}/payments"
              payload: { amount_cents: 5000000 }
              as: Policyholder
              as_user_id: "${ph_ci}"
            - call: "POST /policies/${pol_ci}/scheduled-items"
              payload: { description: "Ring 2", category: "RING", location_zip: "10001", scheduled_value_cents: 800000 }
              as: Underwriter
              captures: { it_ci2: $.data.id }
            - call: "POST /policies/${pol_ci}/endorsements"
              payload: { endorsement_type: "ADD_ITEM", target_item_id: "${it_ci2}" }
              as: Underwriter
              captures: { end_ci: $.data.id }
          trigger:
            - call: "POST /policies/${pol_ci}/endorsements/${end_ci}/reject"
              payload: {}
              as: Underwriter
          assert:
            - "Endorsement.${end_ci}.status == REJECTED"
            - "Policy.${pol_ci}.annual_premium_cents == 3947"

      # --- Claim deny conserves total_insured_value_cents (item returns to ACTIVE) ---
      - name: claim_deny_conserves_total_insured_value
        grounds:
          - state_machines.Claim.UNDER_REVIEW_to_DENIED
          - state_machines.ScheduledItem.SUSPENDED_to_ACTIVE
          - entities.Policy.fields.total_insured_value_cents
        distinguishing_aspect: |
          start_review SUSPENDS the item (forward action) and deny returns it to ACTIVE (compensating
          action); the conserved quantity is Policy.total_insured_value_cents, which equals 1,000,000
          both before review and after deny — a different conserved quantity (insured value) than the
          annual-premium invariant.
        test_recipe:
          setup:
            - "ACTIVE policy with one RING (total_insured_value_cents 1,000,000); a TOTAL_LOSS claim filed and UNDER_REVIEW (item SUSPENDED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Underwriter
            - call: "POST /risk-zones"
              payload: { zip_prefix: "100", risk_band: "MODERATE", rate_per_thousand_cents: 300 }
              as: Underwriter
            - call: "POST /policyholders"
              payload: { email: "cd@x.com", full_name: "Cd H", residence_zip: "10001" }
              as: Underwriter
              captures: { ph_cd: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_cd}", coverage_type: "ALL_RISK", valuation_basis: "AGREED_VALUE", deductible_option: "STANDARD" }
              as: Underwriter
              captures: { pol_cd: $.data.id }
            - call: "POST /policies/${pol_cd}/scheduled-items"
              payload: { description: "Ring", category: "RING", location_zip: "10001", scheduled_value_cents: 1000000 }
              as: Underwriter
              captures: { it_cd: $.data.id }
            - call: "POST /policies/${pol_cd}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_cd}/payments"
              payload: { amount_cents: 5000000 }
              as: Policyholder
              as_user_id: "${ph_cd}"
            - call: "POST /policies/${pol_cd}/claims"
              payload: { scheduled_item_id: "${it_cd}", peril: "THEFT", loss_type: "TOTAL_LOSS", claimed_amount_cents: 1000000 }
              as: ClaimsAdjuster
              captures: { cl_cd: $.data.id }
            - call: "POST /policies/${pol_cd}/claims/${cl_cd}/start_review"
              payload: {}
              as: ClaimsAdjuster
          trigger:
            - call: "POST /policies/${pol_cd}/claims/${cl_cd}/deny"
              payload: {}
              as: ClaimsAdjuster
          assert:
            - "Claim.${cl_cd}.status == DENIED"
            - "ScheduledItem.${it_cd}.item_status == ACTIVE"
            - "Policy.${pol_cd}.total_insured_value_cents == 1000000"
