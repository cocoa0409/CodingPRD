# =============================================================================
# §1.9 Scaffold Corner Design (breadth probe)
# Commercial Real Estate Brokerage & Leasing
# Enumerates testable claims from §1.1–§1.7 NOT already covered by §1.8.
# Each active instance carries an executable setup_api_calls chain (same gates as §1.8).
# excluded_because stubs cite a §1.8 instance by exact name (no test_recipe).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_brokerage_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Brokerage, endpoints]
        distinguishing_aspect: "POST /brokerages with name+side+default_commission_pct returns 201 and echoes all input fields plus id/version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /brokerages"
              payload: { name: "Skyline CRE", side: "DUAL", default_commission_pct: 0.05 }
              as: BrokerageAdmin
              captures: { bkrg_id: $.data.id, v: $.data.version }
          assert:
            - "response code == 201"
            - "Brokerage.${bkrg_id}.name == 'Skyline CRE'"
            - "Brokerage.${bkrg_id}.side == DUAL"
            - "Brokerage.${bkrg_id}.default_commission_pct == 0.05"
            - "Brokerage.${bkrg_id}.version == 1"

      - name: create_brokerage_default_commission_applied
        claim_type: Defaults
        grounds: [entities.Brokerage.fields.default_commission_pct]
        distinguishing_aspect: "Omitting default_commission_pct yields the declared default 0.06."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /brokerages"
              payload: { name: "Default Firm", side: "LISTING" }
              as: BrokerageAdmin
              captures: { bkrg_id: $.data.id }
          assert:
            - "Brokerage.${bkrg_id}.default_commission_pct == 0.06"

      - name: create_space_default_free_rent_and_ti
        claim_type: Defaults
        grounds: [entities.Space.fields.free_rent_months, entities.Space.fields.ti_allowance_psf, entities.Space.fields.status]
        distinguishing_aspect: "Omitting free_rent_months and ti_allowance_psf yields 0 and 0; status defaults to DRAFT."
        test_recipe:
          setup: ["A property owned by a listing broker."]
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "DefSpace Firm", side: "LISTING" }
              as: BrokerageAdmin
              captures: { bkrg_id: $.data.id }
            - call: "POST /brokers"
              payload: { brokerage_id: "${bkrg_id}", full_name: "LB Def", license_no: "L-3101", role: "LISTING_BROKER" }
              as: BrokerageAdmin
              captures: { lb_id: $.data.id }
            - call: "POST /properties"
              payload: { listing_broker_id: "${lb_id}", name: "DefBldg", market: "SOMA-SF", asset_class: "OFFICE", total_sf: 10000 }
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /spaces"
              payload: { property_id: "${prop_id}", suite_no: "D1", rentable_sf: 2000, asking_rent_psf_yr: 45 }
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { space_id: $.data.id }
          assert:
            - "Space.${space_id}.free_rent_months == 0"
            - "Space.${space_id}.ti_allowance_psf == 0"
            - "Space.${space_id}.status == DRAFT"

      - name: create_broker_missing_required_license_no
        claim_type: Required Fields
        grounds:
          - "entities.Broker.fields.license_no"
          - "validations[priority=5]"
        distinguishing_aspect: "Omitting required license_no on POST /brokers returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A brokerage exists."]
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "NoLic Firm", side: "LISTING" }
              as: BrokerageAdmin
              captures: { bkrg_id: $.data.id }
          trigger:
            - call: "POST /brokers"
              payload: { brokerage_id: "${bkrg_id}", full_name: "No License", role: "LISTING_BROKER" }
              as: BrokerageAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "http_status == 422"

      - name: create_broker_duplicate_license_no_rejected
        claim_type: Type Constraints
        grounds:
          - "entities.Broker.fields.license_no"
          - "validations[priority=5]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "A second broker with an already-used license_no returns ERR_INVALID_REQUEST (uniqueness)."
        test_recipe:
          setup: ["A brokerage with one broker holding license_no L-DUP."]
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "Dup Firm", side: "LISTING" }
              as: BrokerageAdmin
              captures: { bkrg_id: $.data.id }
            - call: "POST /brokers"
              payload: { brokerage_id: "${bkrg_id}", full_name: "First", license_no: "L-DUP", role: "LISTING_BROKER" }
              as: BrokerageAdmin
          trigger:
            - call: "POST /brokers"
              payload: { brokerage_id: "${bkrg_id}", full_name: "Second", license_no: "L-DUP", role: "TENANT_BROKER" }
              as: BrokerageAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: create_requirement_min_gt_max_rejected
        claim_type: Type Constraints
        grounds:
          - "entities.Requirement.fields.min_sf"
          - "entities.Requirement.fields.max_sf"
          - "validations[priority=5]"
        distinguishing_aspect: "min_sf > max_sf on POST /requirements returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A tenant broker exists."]
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "Req Firm", side: "TENANT_REP" }
              as: BrokerageAdmin
              captures: { bkrg_id: $.data.id }
            - call: "POST /brokers"
              payload: { brokerage_id: "${bkrg_id}", full_name: "TB Req", license_no: "T-3201", role: "TENANT_BROKER" }
              as: BrokerageAdmin
              captures: { tb_id: $.data.id }
          trigger:
            - call: "POST /requirements"
              payload: { tenant_broker_id: "${tb_id}", tenant_name: "BadRange", market: "SOMA-SF", asset_class: "OFFICE", min_sf: 8000, max_sf: 2000, max_rent_psf_yr: 60 }
              as: TenantBroker
              as_user_id: "${tb_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "http_status == 422"

      - name: create_tour_window_end_before_start_rejected
        claim_type: Type Constraints
        grounds:
          - "entities.Tour.fields.window_start"
          - "entities.Tour.fields.window_end"
          - "validations[priority=5]"
        distinguishing_aspect: "window_start >= window_end on POST /tours returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A published space and an OPEN requirement."]
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "TW List", side: "LISTING" }
              as: BrokerageAdmin
              captures: { bkrg_a_id: $.data.id }
            - call: "POST /brokerages"
              payload: { name: "TW Rep", side: "TENANT_REP" }
              as: BrokerageAdmin
              captures: { bkrg_b_id: $.data.id }
            - call: "POST /brokers"
              payload: { brokerage_id: "${bkrg_a_id}", full_name: "LB TW", license_no: "L-3301", role: "LISTING_BROKER" }
              as: BrokerageAdmin
              captures: { lb_id: $.data.id }
            - call: "POST /brokers"
              payload: { brokerage_id: "${bkrg_b_id}", full_name: "TB TW", license_no: "T-3302", role: "TENANT_BROKER" }
              as: BrokerageAdmin
              captures: { tb_id: $.data.id }
            - call: "POST /properties"
              payload: { listing_broker_id: "${lb_id}", name: "TW Bldg", market: "SOMA-SF", asset_class: "OFFICE", total_sf: 10000 }
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /spaces"
              payload: { property_id: "${prop_id}", suite_no: "TW1", rentable_sf: 2000, asking_rent_psf_yr: 45 }
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { space_id: $.data.id }
            - call: "POST /spaces/${space_id}/publish"
              payload: {}
              as: ListingBroker
              as_user_id: "${lb_id}"
            - call: "POST /requirements"
              payload: { tenant_broker_id: "${tb_id}", tenant_name: "TW Tenant", market: "SOMA-SF", asset_class: "OFFICE", min_sf: 1000, max_sf: 5000, max_rent_psf_yr: 60 }
              as: TenantBroker
              as_user_id: "${tb_id}"
              captures: { req_id: $.data.id }
          trigger:
            - call: "POST /tours"
              payload: { requirement_id: "${req_id}", tenant_broker_id: "${tb_id}", space_id: "${space_id}", window_start: "2026-07-01T12:00:00Z", window_end: "2026-07-01T11:00:00Z" }
              as: TenantBroker
              as_user_id: "${tb_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "http_status == 422"

      - name: get_space_not_found
        claim_type: Not Found
        grounds:
          - "entities.Space"
          - "errors[ERR_NOT_FOUND]"
          - "validations[priority=3]"
        distinguishing_aspect: "GET /spaces/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /spaces/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BrokerageAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "http_status == 404"

      - name: create_deal_unknown_listing_fk_not_found
        claim_type: Parent Relationships
        grounds:
          - "entities.Deal.fields.listing_id"
          - "validations[priority=3]"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "POST /deals with a non-existent listing_id FK returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["A tenant broker and a valid requirement exist; listing_id is bogus."]
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "FKD Rep", side: "TENANT_REP" }
              as: BrokerageAdmin
              captures: { bkrg_b_id: $.data.id }
            - call: "POST /brokers"
              payload: { brokerage_id: "${bkrg_b_id}", full_name: "TB FKD", license_no: "T-3401", role: "TENANT_BROKER" }
              as: BrokerageAdmin
              captures: { tb_id: $.data.id }
            - call: "POST /requirements"
              payload: { tenant_broker_id: "${tb_id}", tenant_name: "FKD Tenant", market: "SOMA-SF", asset_class: "OFFICE", min_sf: 1000, max_sf: 5000, max_rent_psf_yr: 60 }
              as: TenantBroker
              as_user_id: "${tb_id}"
              captures: { req_id: $.data.id }
          trigger:
            - call: "POST /deals"
              payload: { listing_id: "00000000-0000-4000-8000-0000000000aa", requirement_id: "${req_id}" }
              as: TenantBroker
              as_user_id: "${tb_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "http_status == 404"

      - name: deal_is_co_broke_computed_true_cross_brokerage
        claim_type: Computed Fields
        grounds: [entities.Deal.fields.is_co_broke]
        distinguishing_aspect: "When listing broker and procuring broker belong to DIFFERENT brokerages, Deal.is_co_broke is computed true; client cannot set it."
        test_recipe:
          setup: ["Listing in brokerage A, requirement (tenant broker) in brokerage B."]
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "CB A", side: "LISTING" }
              as: BrokerageAdmin
              captures: { bkrg_a_id: $.data.id }
            - call: "POST /brokerages"
              payload: { name: "CB B", side: "TENANT_REP" }
              as: BrokerageAdmin
              captures: { bkrg_b_id: $.data.id }
            - call: "POST /brokers"
              payload: { brokerage_id: "${bkrg_a_id}", full_name: "LB CB", license_no: "L-3501", role: "LISTING_BROKER" }
              as: BrokerageAdmin
              captures: { lb_id: $.data.id }
            - call: "POST /brokers"
              payload: { brokerage_id: "${bkrg_b_id}", full_name: "TB CB", license_no: "T-3502", role: "TENANT_BROKER" }
              as: BrokerageAdmin
              captures: { tb_id: $.data.id }
            - call: "POST /properties"
              payload: { listing_broker_id: "${lb_id}", name: "CB Bldg", market: "SOMA-SF", asset_class: "OFFICE", total_sf: 10000 }
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /spaces"
              payload: { property_id: "${prop_id}", suite_no: "CB1", rentable_sf: 3000, asking_rent_psf_yr: 50 }
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { space_id: $.data.id }
            - call: "POST /spaces/${space_id}/publish"
              payload: {}
              as: ListingBroker
              as_user_id: "${lb_id}"
            - call: "POST /listings"
              payload: { space_id: "${space_id}", listing_broker_id: "${lb_id}", term_months: 60 }
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/activate"
              payload: {}
              as: ListingBroker
              as_user_id: "${lb_id}"
            - call: "POST /requirements"
              payload: { tenant_broker_id: "${tb_id}", tenant_name: "CB Tenant", market: "SOMA-SF", asset_class: "OFFICE", min_sf: 1000, max_sf: 6000, max_rent_psf_yr: 70 }
              as: TenantBroker
              as_user_id: "${tb_id}"
              captures: { req_id: $.data.id }
          trigger:
            - call: "POST /deals"
              payload: { listing_id: "${listing_id}", requirement_id: "${req_id}" }
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { deal_id: $.data.id }
          assert:
            - "Deal.${deal_id}.is_co_broke == true"
            - "Deal.${deal_id}.listing_broker_id == ${lb_id}"
            - "Deal.${deal_id}.procuring_broker_id == ${tb_id}"

      - name: list_brokers_pagination_envelope
        claim_type: Listing
        grounds: [endpoints, response_envelope]
        distinguishing_aspect: "GET /brokers returns response_type=array with pagination fields total_count and has_more."
        test_recipe:
          setup: ["A brokerage with two brokers."]
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "List Firm", side: "DUAL" }
              as: BrokerageAdmin
              captures: { bkrg_id: $.data.id }
            - call: "POST /brokers"
              payload: { brokerage_id: "${bkrg_id}", full_name: "B One", license_no: "L-3601", role: "LISTING_BROKER" }
              as: BrokerageAdmin
            - call: "POST /brokers"
              payload: { brokerage_id: "${bkrg_id}", full_name: "B Two", license_no: "T-3602", role: "TENANT_BROKER" }
              as: BrokerageAdmin
          trigger:
            - call: "GET /brokers"
              payload: { brokerage_id: "${bkrg_id}", limit: 1, offset: 0 }
              as: BrokerageAdmin
          assert:
            - "response_type == array"
            - "meta.total_count == 2"
            - "meta.has_more == true"
            - "len(data) == 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: publish_space_starts_available_initial_state
        claim_type: Initial State
        grounds: [state_machines.Space.DRAFT_to_AVAILABLE, entities.Space.fields.status]
        distinguishing_aspect: "A freshly created Space is DRAFT; publish moves it to AVAILABLE and increments parent available_sf."
        test_recipe:
          setup: ["A property with one DRAFT space (rentable_sf 2000)."]
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "Pub Firm", side: "LISTING" }
              as: BrokerageAdmin
              captures: { bkrg_id: $.data.id }
            - call: "POST /brokers"
              payload: { brokerage_id: "${bkrg_id}", full_name: "LB Pub", license_no: "L-3701", role: "LISTING_BROKER" }
              as: BrokerageAdmin
              captures: { lb_id: $.data.id }
            - call: "POST /properties"
              payload: { listing_broker_id: "${lb_id}", name: "Pub Bldg", market: "SOMA-SF", asset_class: "OFFICE", total_sf: 10000 }
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /spaces"
              payload: { property_id: "${prop_id}", suite_no: "P1", rentable_sf: 2000, asking_rent_psf_yr: 45 }
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { space_id: $.data.id }
          trigger:
            - call: "POST /spaces/${space_id}/publish"
              payload: {}
              as: ListingBroker
              as_user_id: "${lb_id}"
          assert:
            - "Space.${space_id}.status == AVAILABLE"
            - "Property.${prop_id}.available_sf == 2000"

      - name: activate_listing_from_withdrawn_terminal_rejected
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Listing.DRAFT_to_WITHDRAWN"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "WITHDRAWN is terminal for Listing; activating a WITHDRAWN listing returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A DRAFT listing that is then withdrawn (DRAFT->WITHDRAWN)."]
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "Term Firm", side: "LISTING" }
              as: BrokerageAdmin
              captures: { bkrg_id: $.data.id }
            - call: "POST /brokers"
              payload: { brokerage_id: "${bkrg_id}", full_name: "LB Term", license_no: "L-3801", role: "LISTING_BROKER" }
              as: BrokerageAdmin
              captures: { lb_id: $.data.id }
            - call: "POST /properties"
              payload: { listing_broker_id: "${lb_id}", name: "Term Bldg", market: "SOMA-SF", asset_class: "OFFICE", total_sf: 10000 }
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /spaces"
              payload: { property_id: "${prop_id}", suite_no: "T1", rentable_sf: 3000, asking_rent_psf_yr: 50 }
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { space_id: $.data.id }
            - call: "POST /spaces/${space_id}/publish"
              payload: {}
              as: ListingBroker
              as_user_id: "${lb_id}"
            - call: "POST /listings"
              payload: { space_id: "${space_id}", listing_broker_id: "${lb_id}", term_months: 60 }
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/withdraw"
              payload: {}
              as: ListingBroker
              as_user_id: "${lb_id}"
          trigger:
            - call: "POST /listings/${listing_id}/activate"
              payload: {}
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http_status == 409"
            - "Listing.${listing_id}.status == WITHDRAWN"

      - name: tour_complete_before_window_start_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Tour.CONFIRMED_to_COMPLETED"
          - "errors[ERR_TOUR_NOT_STARTED]"
          - "validations[priority=13]"
        distinguishing_aspect: "Completing a CONFIRMED tour before current_clock >= window_start returns ERR_TOUR_NOT_STARTED (409)."
        test_recipe:
          setup: ["Server clock at 2026-12-01T09:00:00Z; a CONFIRMED tour with window 10:00-11:00 same day."]
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "TC List", side: "LISTING" }
              as: BrokerageAdmin
              captures: { bkrg_a_id: $.data.id }
            - call: "POST /brokerages"
              payload: { name: "TC Rep", side: "TENANT_REP" }
              as: BrokerageAdmin
              captures: { bkrg_b_id: $.data.id }
            - call: "POST /brokers"
              payload: { brokerage_id: "${bkrg_a_id}", full_name: "LB TC", license_no: "L-3901", role: "LISTING_BROKER" }
              as: BrokerageAdmin
              captures: { lb_id: $.data.id }
            - call: "POST /brokers"
              payload: { brokerage_id: "${bkrg_b_id}", full_name: "TB TC", license_no: "T-3902", role: "TENANT_BROKER" }
              as: BrokerageAdmin
              captures: { tb_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T09:00:00Z" }
              as: BrokerageAdmin
            - call: "POST /properties"
              payload: { listing_broker_id: "${lb_id}", name: "TC Bldg", market: "SOMA-SF", asset_class: "OFFICE", total_sf: 10000 }
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /spaces"
              payload: { property_id: "${prop_id}", suite_no: "TC1", rentable_sf: 2500, asking_rent_psf_yr: 45 }
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { space_id: $.data.id }
            - call: "POST /spaces/${space_id}/publish"
              payload: {}
              as: ListingBroker
              as_user_id: "${lb_id}"
            - call: "POST /requirements"
              payload: { tenant_broker_id: "${tb_id}", tenant_name: "TC Tenant", market: "SOMA-SF", asset_class: "OFFICE", min_sf: 1000, max_sf: 5000, max_rent_psf_yr: 60 }
              as: TenantBroker
              as_user_id: "${tb_id}"
              captures: { req_id: $.data.id }
            - call: "POST /tours"
              payload: { requirement_id: "${req_id}", tenant_broker_id: "${tb_id}", space_id: "${space_id}", window_start: "2026-12-01T10:00:00Z", window_end: "2026-12-01T11:00:00Z" }
              as: TenantBroker
              as_user_id: "${tb_id}"
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/confirm"
              payload: { hold: false }
              as: ListingBroker
              as_user_id: "${lb_id}"
          trigger:
            - call: "POST /tours/${tour_id}/complete"
              payload: {}
              as: TenantBroker
              as_user_id: "${tb_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_TOUR_NOT_STARTED"
            - "Tour.${tour_id}.status == CONFIRMED"

      - name: tour_no_show_before_window_end_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Tour.CONFIRMED_to_NO_SHOW"
          - "errors[ERR_TOUR_NOT_ENDED]"
          - "validations[priority=13]"
