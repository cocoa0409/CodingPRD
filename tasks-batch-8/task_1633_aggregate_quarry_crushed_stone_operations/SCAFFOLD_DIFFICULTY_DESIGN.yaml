            - { call: "POST /product-specs", payload: { spec_code: "A57", category: "COARSE", gradation_bands: [ { sieve: "1.5in", min_pct: 90, max_pct: 100 } ], base_price_per_ton: 12.50 }, as: QuarryAdmin, captures: { spec: $.data.id } }
            - { call: "POST /stockpiles", payload: { site_id: "${site}", product_spec_id: "${spec}", capacity_tons: 5000 }, as: SiteManager, captures: { pile: $.data.id } }
            - { call: "POST /scales", payload: { site_id: "${site}", scale_code: "BELT-01", scale_type: "BELT" }, as: QuarryAdmin, captures: { belt: $.data.id } }
            - { call: "POST /scale-calibrations", payload: { scale_id: "${belt}", calibrated_on: "2026-02-02", as_found_error_pct: 0.10, as_left_error_pct: 0.05 }, as: QuarryAdmin }
            - { call: "POST /plant-runs", payload: { site_id: "${site}", muckpile_id: "${mp}", belt_scale_id: "${belt}", circuit_line: "PRIMARY" }, as: PlantOperator, as_user_id: "po-1", captures: { run: $.data.id } }
