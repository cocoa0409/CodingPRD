scaffold_corner_design:
  # ============================================================
  # Section: entities (creation, defaults, computed, not-found, required, enum, immutability)
  # ============================================================
  - section: entities
    instances:
      - name: meet_creation_defaults_applied
        claim_type: creation_defaults
        grounds: [entities.Meet.fields.lane_count, entities.Meet.fields.points_table, entities.Meet.fields.scoring_tie_policy]
        distinguishing_aspect: "Omitting every optional config applies documented defaults and initial state SETUP with version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /meets", payload: { meet_name: "Defs", course: "SCY", start_date: "2026-08-15", entry_deadline_utc: "2026-08-10T00:00:00Z" }, as: MeetDirector, captures: { m: "$.data" } }
          trigger: []
          assert:
            - "Meet lane_count == 6, relay_points_multiplier == 2, max_individual_entries_per_swimmer == 4"
            - "dq_protest_window_minutes == 30, min_recovery_minutes == 20, timing_delta_threshold_cs == 30"
            - "points_table == [9,7,6,5,4,3,2,1], scoring_tie_policy == SPLIT"
            - "status == SETUP and version == 1"
      - name: swimmer_age_birthday_on_start_date_computed
        claim_type: computed_field
        grounds: [entities.Swimmer.fields.age_on_meet_start, calculations.age_group_derivation]
        distinguishing_aspect: "Born 2014-08-15 with meet start 2026-08-15 computes age exactly 12 -> ELEVEN_TWELVE (birthday on start date counts); any client-supplied age value is absent from the accepted input schema."
        test_recipe:
          setup: ["meet exists"]
          setup_api_calls:
            - { call: "POST /meets", payload: { meet_name: "AgeM", course: "SCY", start_date: "2026-08-15", entry_deadline_utc: "2026-08-10T00:00:00Z" }, as: MeetDirector, captures: { meet_id: "$.data.id" } }
            - { call: "POST /teams", payload: { meet_id: "${meet_id}", team_code: "AAA", team_name: "Aquatics" }, as: MeetDirector, captures: { team_id: "$.data.id" } }
          trigger:
            - { call: "POST /swimmers", payload: { team_id: "${team_id}", full_name: "B Day", birth_date: "2014-08-15", gender: "F" }, as: TeamCoach, as_user_id: "${team_id}", captures: { age: "$.data.age_on_meet_start", grp: "$.data.age_group" } }
          assert:
            - "${age} == 12"
            - "${grp} == ELEVEN_TWELVE"
      - name: relay_leg_immutability_and_replace
        claim_type: immutability
        grounds: [entities.RelayLeg]
        distinguishing_aspect: "RelayLeg has common_fields false (no version/updated_at); re-POSTing leg_number 1 while DECLARED replaces the swimmer instead of updating in place."
        test_recipe:
          setup: ["meet ENTRIES_OPEN; relay team DECLARED"]
          setup_api_calls:
            - { call: "POST /meets", payload: { meet_name: "LegM", course: "SCY", start_date: "2026-08-15", entry_deadline_utc: "2026-08-10T00:00:00Z" }, as: MeetDirector, captures: { meet_id: "$.data.id" } }
            - { call: "POST /meets/${meet_id}/open-entries", payload: {}, as: MeetDirector }
            - { call: "POST /teams", payload: { meet_id: "${meet_id}", team_code: "AAA", team_name: "Aquatics" }, as: MeetDirector, captures: { team_id: "$.data.id" } }
            - { call: "POST /swimmers", payload: { team_id: "${team_id}", full_name: "L One", birth_date: "2014-01-01", gender: "M" }, as: TeamCoach, as_user_id: "${team_id}", captures: { sw1: "$.data.id" } }
            - { call: "POST /swimmers", payload: { team_id: "${team_id}", full_name: "L Sub", birth_date: "2014-02-02", gender: "M" }, as: TeamCoach, as_user_id: "${team_id}", captures: { sw2: "$.data.id" } }
            - { call: "POST /events", payload: { meet_id: "${meet_id}", event_number: 7, gender: "M", age_group: "ELEVEN_TWELVE", stroke: "FREESTYLE_RELAY", distance_meters: 200, is_relay: true, session_date: "2026-08-15", scheduled_start_minute: 600, scheduled_end_minute: 630 }, as: MeetDirector, captures: { ev_r: "$.data.id" } }
            - { call: "POST /relay-teams", payload: { team_id: "${team_id}", event_id: "${ev_r}", relay_name: "A", seed_time_cs: 9500 }, as: TeamCoach, as_user_id: "${team_id}", captures: { rl: "$.data.id" } }
          trigger:
            - { call: "POST /relay-teams/${rl}/legs", payload: { leg_number: 1, swimmer_id: "${sw1}" }, as: TeamCoach, as_user_id: "${team_id}", captures: { leg1: "$.data.id" } }
            - { call: "POST /relay-teams/${rl}/legs", payload: { leg_number: 1, swimmer_id: "${sw2}" }, as: TeamCoach, as_user_id: "${team_id}" }
            - { call: "GET /relay-teams/${rl}/legs", payload: {}, as: Any, captures: { leg_now: "$.data[0].swimmer_id" } }
          assert:
            - "RelayLeg create response contains id and created_at only (no version, no updated_at)"
            - "${leg_now} == ${sw2}  # replace semantics, exactly one leg row with leg_number 1"
      - name: meet_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_MEET_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent meet UUID returns ERR_MEET_NOT_FOUND with http 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /meets/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: Any, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_MEET_NOT_FOUND"
      - name: team_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["errors[ERR_INVALID_REQUEST]", entities.Team.fields.team_code]
        distinguishing_aspect: "POST /teams without team_code is rejected with ERR_INVALID_REQUEST (400) before any state check."
        test_recipe:
          setup: ["meet exists"]
          setup_api_calls:
            - { call: "POST /meets", payload: { meet_name: "ReqM", course: "SCY", start_date: "2026-08-15", entry_deadline_utc: "2026-08-10T00:00:00Z" }, as: MeetDirector, captures: { meet_id: "$.data.id" } }
          trigger:
            - { call: "POST /teams", payload: { meet_id: "${meet_id}", team_name: "No Code" }, as: MeetDirector, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
      - name: event_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: ["errors[ERR_INVALID_REQUEST]", entities.SwimEvent.fields.stroke, entities.SwimEvent.fields.scheduled_end_minute]
        distinguishing_aspect: "An unknown stroke enum and an end minute <= start minute are both rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["meet exists"]
          setup_api_calls:
            - { call: "POST /meets", payload: { meet_name: "EnumM", course: "SCY", start_date: "2026-08-15", entry_deadline_utc: "2026-08-10T00:00:00Z" }, as: MeetDirector, captures: { meet_id: "$.data.id" } }
          trigger:
            - { call: "POST /events", payload: { meet_id: "${meet_id}", event_number: 1, gender: "M", age_group: "ELEVEN_TWELVE", stroke: "DOGGY_PADDLE", distance_meters: 50, is_relay: false, session_date: "2026-08-15", scheduled_start_minute: 540, scheduled_end_minute: 570 }, as: MeetDirector, captures: { err_enum: "$.data.error_id" } }
            - { call: "POST /events", payload: { meet_id: "${meet_id}", event_number: 2, gender: "M", age_group: "ELEVEN_TWELVE", stroke: "FREESTYLE", distance_meters: 50, is_relay: false, session_date: "2026-08-15", scheduled_start_minute: 570, scheduled_end_minute: 540 }, as: MeetDirector, captures: { err_win: "$.data.error_id" } }
          assert:
            - "${err_enum} == ERR_INVALID_REQUEST"
            - "${err_win} == ERR_INVALID_REQUEST"

  # ============================================================
  # Section: state_machines
  # ============================================================
  - section: state_machines
    instances:
      - name: dq_terminal_lockdown_overturned
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Disqualification.PROTESTED_to_OVERTURNED, "errors[ERR_DQ_INVALID_STATE]"]
        distinguishing_aspect: "Once OVERTURNED, a DQ is terminal: a subsequent uphold attempt is rejected with ERR_DQ_INVALID_STATE and no cascade fires."
        test_recipe:
          setup:
            - "Event IN_PROGRESS; lane reconciled; DQ recorded by the confirmed judge, coach notified, protest lodged within the window, then OVERTURNED by the referee"
          setup_api_calls:
            - { call: "POST /meets", payload: { meet_name: "TL1", course: "SCY", start_date: "2026-08-15", entry_deadline_utc: "2026-08-10T00:00:00Z" }, as: MeetDirector, captures: { meet_id: "$.data.id" } }
            - { call: "POST /meets/${meet_id}/open-entries", payload: {}, as: MeetDirector }
            - { call: "POST /teams", payload: { meet_id: "${meet_id}", team_code: "AAA", team_name: "Aquatics" }, as: MeetDirector, captures: { team_id: "$.data.id" } }
            - { call: "POST /swimmers", payload: { team_id: "${team_id}", full_name: "Sw A", birth_date: "2014-03-10", gender: "M" }, as: TeamCoach, as_user_id: "${team_id}", captures: { sw_a: "$.data.id" } }
            - { call: "POST /events", payload: { meet_id: "${meet_id}", event_number: 1, gender: "M", age_group: "ELEVEN_TWELVE", stroke: "FREESTYLE", distance_meters: 50, is_relay: false, qualifying_time_cs: 3000, session_date: "2026-08-15", scheduled_start_minute: 540, scheduled_end_minute: 570 }, as: MeetDirector, captures: { ev1: "$.data.id" } }
            - { call: "POST /entries", payload: { event_id: "${ev1}", swimmer_id: "${sw_a}", seed_time_cs: 2900 }, as: TeamCoach, as_user_id: "${team_id}", captures: { en_a: "$.data.id" } }
            - { call: "POST /entries/${en_a}/verify", payload: {}, as: MeetDirector }
            - { call: "POST /officials", payload: { meet_id: "${meet_id}", full_name: "Ref R", lsc_membership_id: "LSC-R1", certifications: ["REFEREE"], certification_expires_on: "2027-01-01" }, as: MeetDirector, captures: { off_ref: "$.data.id" } }
            - { call: "POST /officials", payload: { meet_id: "${meet_id}", full_name: "Jud J", lsc_membership_id: "LSC-J1", certifications: ["STROKE_TURN_JUDGE"], certification_expires_on: "2027-01-01" }, as: MeetDirector, captures: { off_jud: "$.data.id" } }
            - { call: "POST /events/${ev1}/official-assignments", payload: { official_id: "${off_ref}", role_on_deck: "REFEREE" }, as: MeetDirector, captures: { oa_ref: "$.data.id" } }
            - { call: "POST /official-assignments/${oa_ref}/confirm", payload: {}, as: MeetReferee, as_user_id: "${off_ref}" }
            - { call: "POST /events/${ev1}/official-assignments", payload: { official_id: "${off_jud}", role_on_deck: "STROKE_TURN_JUDGE" }, as: MeetDirector, captures: { oa_jud: "$.data.id" } }
            - { call: "POST /official-assignments/${oa_jud}/confirm", payload: {}, as: DeckOfficial, as_user_id: "${off_jud}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: Any }
            - { call: "POST /meets/${meet_id}/close-entries", payload: {}, as: MeetDirector, captures: { meet_v: "$.data.version" } }
            - { call: "POST /meets/${meet_id}/seed", payload: { expected_meet_version: "${meet_v}" }, as: MeetDirector }
            - { call: "POST /events/${ev1}/start", payload: {}, as: MeetDirector }
            - { call: "GET /lane-assignments", payload: { entry_id: "${en_a}" }, as: Any, captures: { lane_a: "$.data[0].id" } }
            - { call: "POST /lane-assignments/${lane_a}/readings", payload: { pad_cs: 2500, backup1_cs: 2505, backup2_cs: 2507 }, as: TimingOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T10:00:00Z" }, as: Any }
            - { call: "POST /lane-assignments/${lane_a}/disqualifications", payload: { dq_code: "TURN_NO_TOUCH", call_notes: "missed wall" }, as: DeckOfficial, as_user_id: "${off_jud}", captures: { dq: "$.data.id" } }
            - { call: "POST /disqualifications/${dq}/notify-coach", payload: {}, as: MeetReferee, as_user_id: "${off_ref}" }
            - { call: "POST /disqualifications/${dq}/protest", payload: {}, as: TeamCoach, as_user_id: "${team_id}" }
            - { call: "POST /disqualifications/${dq}/overturn", payload: {}, as: MeetReferee, as_user_id: "${off_ref}", captures: { dq_st: "$.data.status" } }
          trigger:
            - { call: "POST /disqualifications/${dq}/uphold", payload: {}, as: MeetReferee, as_user_id: "${off_ref}", captures: { err: "$.data.error_id" } }
          assert:
            - "${dq_st} == OVERTURNED"
            - "${err} == ERR_DQ_INVALID_STATE  # terminal lockdown"
      - name: entry_initial_state_entered_unverified
        claim_type: initial_state
        grounds: [state_machines.EventEntry, entities.EventEntry.fields.qualification_status]
        distinguishing_aspect: "A new entry starts ENTERED with qualification_status UNVERIFIED on the parallel axis."
        test_recipe:
          setup: ["meet ENTRIES_OPEN, swimmer and event exist"]
          setup_api_calls:
            - { call: "POST /meets", payload: { meet_name: "IS1", course: "SCY", start_date: "2026-08-15", entry_deadline_utc: "2026-08-10T00:00:00Z" }, as: MeetDirector, captures: { meet_id: "$.data.id" } }
            - { call: "POST /meets/${meet_id}/open-entries", payload: {}, as: MeetDirector }
            - { call: "POST /teams", payload: { meet_id: "${meet_id}", team_code: "AAA", team_name: "Aquatics" }, as: MeetDirector, captures: { team_id: "$.data.id" } }
            - { call: "POST /swimmers", payload: { team_id: "${team_id}", full_name: "Sw A", birth_date: "2014-03-10", gender: "M" }, as: TeamCoach, as_user_id: "${team_id}", captures: { sw_a: "$.data.id" } }
            - { call: "POST /events", payload: { meet_id: "${meet_id}", event_number: 1, gender: "M", age_group: "ELEVEN_TWELVE", stroke: "FREESTYLE", distance_meters: 50, is_relay: false, qualifying_time_cs: 3000, session_date: "2026-08-15", scheduled_start_minute: 540, scheduled_end_minute: 570 }, as: MeetDirector, captures: { ev1: "$.data.id" } }
          trigger:
            - { call: "POST /entries", payload: { event_id: "${ev1}", swimmer_id: "${sw_a}", seed_time_cs: 2900 }, as: TeamCoach, as_user_id: "${team_id}", captures: { st: "$.data.status", qs: "$.data.qualification_status" } }
          assert:
            - "${st} == ENTERED and ${qs} == UNVERIFIED"
      - name: publish_requires_completed_event
        claim_type: invalid_transition
        grounds: [state_machines.SwimEvent.COMPLETED_to_OFFICIAL, "errors[ERR_EVENT_NOT_COMPLETED]"]
        distinguishing_aspect: "publish from IN_PROGRESS is rejected with ERR_EVENT_NOT_COMPLETED; the event must pass through COMPLETED first."
        test_recipe:
          setup: ["event IN_PROGRESS with coverage and one reconciled lane"]
          setup_api_calls:
            - { call: "POST /meets", payload: { meet_name: "PB1", course: "SCY", start_date: "2026-08-15", entry_deadline_utc: "2026-08-10T00:00:00Z" }, as: MeetDirector, captures: { meet_id: "$.data.id" } }
            - { call: "POST /meets/${meet_id}/open-entries", payload: {}, as: MeetDirector }
            - { call: "POST /teams", payload: { meet_id: "${meet_id}", team_code: "AAA", team_name: "Aquatics" }, as: MeetDirector, captures: { team_id: "$.data.id" } }
            - { call: "POST /swimmers", payload: { team_id: "${team_id}", full_name: "Sw A", birth_date: "2014-03-10", gender: "M" }, as: TeamCoach, as_user_id: "${team_id}", captures: { sw_a: "$.data.id" } }
            - { call: "POST /events", payload: { meet_id: "${meet_id}", event_number: 1, gender: "M", age_group: "ELEVEN_TWELVE", stroke: "FREESTYLE", distance_meters: 50, is_relay: false, qualifying_time_cs: 3000, session_date: "2026-08-15", scheduled_start_minute: 540, scheduled_end_minute: 570 }, as: MeetDirector, captures: { ev1: "$.data.id" } }
            - { call: "POST /entries", payload: { event_id: "${ev1}", swimmer_id: "${sw_a}", seed_time_cs: 2900 }, as: TeamCoach, as_user_id: "${team_id}", captures: { en_a: "$.data.id" } }
            - { call: "POST /entries/${en_a}/verify", payload: {}, as: MeetDirector }
            - { call: "POST /officials", payload: { meet_id: "${meet_id}", full_name: "Ref R", lsc_membership_id: "LSC-R1", certifications: ["REFEREE"], certification_expires_on: "2027-01-01" }, as: MeetDirector, captures: { off_ref: "$.data.id" } }
            - { call: "POST /officials", payload: { meet_id: "${meet_id}", full_name: "Jud J", lsc_membership_id: "LSC-J1", certifications: ["STROKE_TURN_JUDGE"], certification_expires_on: "2027-01-01" }, as: MeetDirector, captures: { off_jud: "$.data.id" } }
            - { call: "POST /events/${ev1}/official-assignments", payload: { official_id: "${off_ref}", role_on_deck: "REFEREE" }, as: MeetDirector, captures: { oa_ref: "$.data.id" } }
            - { call: "POST /official-assignments/${oa_ref}/confirm", payload: {}, as: MeetReferee, as_user_id: "${off_ref}" }
            - { call: "POST /events/${ev1}/official-assignments", payload: { official_id: "${off_jud}", role_on_deck: "STROKE_TURN_JUDGE" }, as: MeetDirector, captures: { oa_jud: "$.data.id" } }
            - { call: "POST /official-assignments/${oa_jud}/confirm", payload: {}, as: DeckOfficial, as_user_id: "${off_jud}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: Any }
            - { call: "POST /meets/${meet_id}/close-entries", payload: {}, as: MeetDirector, captures: { meet_v: "$.data.version" } }
            - { call: "POST /meets/${meet_id}/seed", payload: { expected_meet_version: "${meet_v}" }, as: MeetDirector }
            - { call: "POST /events/${ev1}/start", payload: {}, as: MeetDirector }
          trigger:
            - { call: "POST /events/${ev1}/publish", payload: {}, as: MeetDirector, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_EVENT_NOT_COMPLETED"
      - name: meet_open_entries_twice_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Meet.SETUP_to_ENTRIES_OPEN, "errors[ERR_MEET_INVALID_STATE]"]
        distinguishing_aspect: "open-entries from ENTRIES_OPEN (not SETUP) is rejected with ERR_MEET_INVALID_STATE; idempotent re-fire is not allowed."
        test_recipe:
          setup: ["meet ENTRIES_OPEN"]
          setup_api_calls:
            - { call: "POST /meets", payload: { meet_name: "MM1", course: "SCY", start_date: "2026-08-15", entry_deadline_utc: "2026-08-10T00:00:00Z" }, as: MeetDirector, captures: { meet_id: "$.data.id" } }
            - { call: "POST /meets/${meet_id}/open-entries", payload: {}, as: MeetDirector }
          trigger:
            - { call: "POST /meets/${meet_id}/open-entries", payload: {}, as: MeetDirector, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_MEET_INVALID_STATE"
      - name: close_entries_before_deadline_returns_window_open
        claim_type: precondition_enforcement
        grounds: [state_machines.Meet.ENTRIES_OPEN_to_ENTRIES_CLOSED, "errors[ERR_ENTRY_WINDOW_STILL_OPEN]"]
        distinguishing_aspect: "close-entries while the logical clock (default 2026-08-01) is still before the 2026-08-10 deadline is rejected with ERR_ENTRY_WINDOW_STILL_OPEN."
        test_recipe:
          setup: ["meet ENTRIES_OPEN; clock untouched at the fixed default"]
          setup_api_calls:
            - { call: "POST /meets", payload: { meet_name: "MM2", course: "SCY", start_date: "2026-08-15", entry_deadline_utc: "2026-08-10T00:00:00Z" }, as: MeetDirector, captures: { meet_id: "$.data.id" } }
            - { call: "POST /meets/${meet_id}/open-entries", payload: {}, as: MeetDirector }
          trigger:
            - { call: "POST /meets/${meet_id}/close-entries", payload: {}, as: MeetDirector, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_ENTRY_WINDOW_STILL_OPEN  # deterministic because the unset clock reads 2026-08-01T00:00:00Z"
      - name: no_show_marks_entry_and_voids_lane
        claim_type: valid_transition
        grounds: [state_machines.EventEntry.SEEDED_to_NO_SHOW, entities.LaneAssignment.fields.lane_status]
        distinguishing_aspect: "mark-no-show at IN_PROGRESS moves the entry SEEDED -> NO_SHOW and its lane ACTIVE -> VOIDED in one atomic call."
        test_recipe:
          setup: ["event IN_PROGRESS; one seeded entry with an ACTIVE lane"]
          setup_api_calls:
            - { call: "POST /meets", payload: { meet_name: "NS1", course: "SCY", start_date: "2026-08-15", entry_deadline_utc: "2026-08-10T00:00:00Z" }, as: MeetDirector, captures: { meet_id: "$.data.id" } }
            - { call: "POST /meets/${meet_id}/open-entries", payload: {}, as: MeetDirector }
            - { call: "POST /teams", payload: { meet_id: "${meet_id}", team_code: "AAA", team_name: "Aquatics" }, as: MeetDirector, captures: { team_id: "$.data.id" } }
            - { call: "POST /swimmers", payload: { team_id: "${team_id}", full_name: "Sw A", birth_date: "2014-03-10", gender: "M" }, as: TeamCoach, as_user_id: "${team_id}", captures: { sw_a: "$.data.id" } }
            - { call: "POST /events", payload: { meet_id: "${meet_id}", event_number: 1, gender: "M", age_group: "ELEVEN_TWELVE", stroke: "FREESTYLE", distance_meters: 50, is_relay: false, qualifying_time_cs: 3000, session_date: "2026-08-15", scheduled_start_minute: 540, scheduled_end_minute: 570 }, as: MeetDirector, captures: { ev1: "$.data.id" } }
            - { call: "POST /entries", payload: { event_id: "${ev1}", swimmer_id: "${sw_a}", seed_time_cs: 2900 }, as: TeamCoach, as_user_id: "${team_id}", captures: { en_a: "$.data.id" } }
            - { call: "POST /entries/${en_a}/verify", payload: {}, as: MeetDirector }
            - { call: "POST /officials", payload: { meet_id: "${meet_id}", full_name: "Ref R", lsc_membership_id: "LSC-R1", certifications: ["REFEREE"], certification_expires_on: "2027-01-01" }, as: MeetDirector, captures: { off_ref: "$.data.id" } }
            - { call: "POST /officials", payload: { meet_id: "${meet_id}", full_name: "Jud J", lsc_membership_id: "LSC-J1", certifications: ["STROKE_TURN_JUDGE"], certification_expires_on: "2027-01-01" }, as: MeetDirector, captures: { off_jud: "$.data.id" } }
            - { call: "POST /events/${ev1}/official-assignments", payload: { official_id: "${off_ref}", role_on_deck: "REFEREE" }, as: MeetDirector, captures: { oa_ref: "$.data.id" } }
            - { call: "POST /official-assignments/${oa_ref}/confirm", payload: {}, as: MeetReferee, as_user_id: "${off_ref}" }
            - { call: "POST /events/${ev1}/official-assignments", payload: { official_id: "${off_jud}", role_on_deck: "STROKE_TURN_JUDGE" }, as: MeetDirector, captures: { oa_jud: "$.data.id" } }
            - { call: "POST /official-assignments/${oa_jud}/confirm", payload: {}, as: DeckOfficial, as_user_id: "${off_jud}" }
