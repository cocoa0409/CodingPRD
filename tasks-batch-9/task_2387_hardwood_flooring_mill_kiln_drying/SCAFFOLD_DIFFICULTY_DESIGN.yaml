  - rule_id: boundary_precision_check
    rule_summary: "Two independent boundaries where the inclusive edge must pass and the next representable step must fail: the moisture gradient ceiling in tenths of a percentage point, and the tongue-and-groove width tolerance in thousandths of an inch."
    instances:
      - name: moisture_gradient_exactly_at_ceiling_releases_charge
        summary: "A stress test giving a gradient of exactly 2.0 pp (the species maximum) releases the charge; 2.1 pp would force REDRY."
        mechanism: "Inclusive comparison moisture_gradient_pp <= max_moisture_gradient_pp evaluated at 1 decimal place after ROUND_HALF_UP."
        entities_touched: [KilnCharge, SpeciesProfile]
        rules_referenced: [moisture_gradient_assessment, dry_yield_conversion]
        test_recipe:
          setup: "A charge with a single 4000 bf accepted receipt at 45.0 pct, taken to CONDITIONING; the species maximum gradient is 2.0 pp and the target moisture is 7.0 pct."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { species_id: "$.data.id", species_v: "$.data.version" } }
            - { call: "POST /mill/drying-schedules", payload: { species_profile_id: "${species_id}", schedule_code: "RO-100", thickness_in: 1.00, initial_moisture_pct: 45.0, final_moisture_pct: 7.0, conditioning_hours: 24, stress_relief_hours: 12, expected_species_profile_version: "${species_v}" }, as: MillAdmin, captures: { sched_id: "$.data.id" } }
            - { call: "POST /mill/kiln-chambers", payload: { chamber_code: "K1", capacity_board_feet: 12000 }, as: MillAdmin, captures: { chamber_id: "$.data.id" } }
            - { call: "POST /mill/kiln-charges", payload: { drying_schedule_id: "${sched_id}", kiln_chamber_id: "${chamber_id}", planned_start_utc: "2026-08-05T00:00:00.000Z" }, as: KilnOperator, captures: { charge_a: "$.data.id" } }
            - { call: "POST /mill/green-receipts", payload: { species_profile_id: "${species_id}", supplier_name: "Ridgeline Logging", received_board_feet: 4200, receipt_grade: "FAS", moisture_pct_at_receipt: 45.0 }, as: ProcurementClerk, captures: { r1: "$.data.id" } }
            - { call: "POST /mill/green-receipts/${r1}/accept", payload: { accepted_board_feet: 4000 }, as: ProcurementClerk }
            - { call: "POST /mill/kiln-charges/${charge_a}/allocate_receipt", payload: { green_receipt_id: "${r1}" }, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/load", payload: {}, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/start_drying", payload: {}, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/begin_conditioning", payload: {}, as: KilnOperator }
          trigger:
            - { call: "POST /mill/kiln-charges/${charge_a}/record_stress_test", payload: { shell_moisture_pct: 6.0, core_moisture_pct: 8.0 }, as: KilnOperator }
          assert:
            - "Response status 200 with data.status == \"RELEASED\" (not REDRY)."
            - "data.moisture_gradient_pp == 2.0, exactly equal to the species ceiling."
            - "data.average_moisture_pct == 7.0, exactly on the target, so the band check passes with a deviation of 0.0."
            - "data.dry_bf_out == 3700.00 (4000 * 0.925) and data.remaining_dry_bf == 3700.00."
            - "data.redry_count == 0."
            - "The companion 2.1 pp case in kiln_charge_conditioning_redry_cycle shows the next tenth failing, so the boundary is inclusive on exactly one side."

      - name: profile_tolerance_exactly_at_limit_passes_next_thousandth_fails
