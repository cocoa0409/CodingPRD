  # ============================================================ cross_cutting_layers
  - section: cross_cutting_layers
    instances:
      - name: occ_shipment_amend_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[shipment-amend-stale-version]", entities.Shipment.fields.status]
        distinguishing_aspect: "OCC on Shipment.version: amending with a stale expected_shipment_version fails 412 ERR_STALE_VERSION; the same body with the current version succeeds and bumps version; classification-relevant edits revert status to DRAFT while value-only edits keep it."
        test_recipe:
          setup: ["Carrier APPROVED_ACTIVE, fees paid; shipment in DRAFT at version 1"]
          setup_api_calls:
            - call: "POST /hazmat/carriers"
              payload: { legal_name: "Acme Hazmat LLC", usdot_number: "USDOT-3032", fleet_size_declared: 5, hazmat_categories: ["FLAMMABLE_LIQUID"] }
              as: CarrierAdmin
              captures: { c_id: "$.data.id", c_v: "$.data.version" }
            - call: "POST /hazmat/carriers/${c_id}/registration/submit"
              payload: { expected_carrier_version: "${c_v}" }
              as: CarrierAdmin
            - call: "POST /hazmat/carriers/${c_id}/registration/approve"
              payload: { verified_fleet_size: 5 }
              as: Regulator
            - call: "POST /hazmat/carriers/${c_id}/payments"
              payload: { amount_cents: 26250 }
              as: CarrierAdmin
            - call: "POST /hazmat/hazmat-materials"
              payload: { un_na_number: "UN1993", proper_shipping_name: "FLAMMABLE LIQUID, N.O.S.", hazard_class: "CLASS_3", packing_group: "PG_II", placard_table: "TABLE_2", transport_category: "FLAMMABLE_LIQUID", reportable_quantity_lbs: 100, is_inhalation_hazard: false, segregation_group: "SG_NONE", erg_guide_number: "128" }
              as: Regulator
              captures: { m_id: "$.data.id" }
            - call: "POST /hazmat/packaging-specs"
              payload: { spec_code: "UN4G", authorized_hazard_classes: ["CLASS_3"], max_packing_group: "PG_II", max_net_quantity_kg: 500.0 }
              as: Regulator
              captures: { s_id: "$.data.id" }
            - call: "POST /hazmat/carriers/${c_id}/shipments"
              payload: { material_id: "${m_id}", packaging_spec_id: "${s_id}", declared_shipping_name: "FLAMMABLE LIQUID, N.O.S.", quantity_kg: 100.0, declared_value_cents: 1000 }
              as: ShipperComplianceOfficer
              captures: { sh_id: "$.data.id", sh_v1: "$.data.version" }
          trigger:
            - call: "PATCH /hazmat/shipments/${sh_id}"
              payload: { expected_shipment_version: "${sh_v1} - 1", declared_value_cents: 2000 }
              as: ShipperComplianceOfficer
              captures: { err1: "$.data.error_id" }
            - call: "PATCH /hazmat/shipments/${sh_id}"
              payload: { expected_shipment_version: "${sh_v1}", declared_value_cents: 2000 }
              as: ShipperComplianceOfficer
              captures: { sh_v2: "$.data.version", st2: "$.data.status" }
            - call: "PATCH /hazmat/shipments/${sh_id}"
              payload: { expected_shipment_version: "${sh_v2}", quantity_kg: 150.0 }
              as: ShipperComplianceOfficer
              captures: { st3: "$.data.status", sh_v3: "$.data.version" }
          assert:
            - "captured err1 == 'ERR_STALE_VERSION' (412; stale expression ${sh_v1} - 1)"
            - "captured sh_v2 == sh_v1 + 1 and st2 == 'DRAFT' (value-only edit keeps status)"
            - "captured st3 == 'DRAFT' and sh_v3 == sh_v2 + 1 (classification-relevant edit in DRAFT stays DRAFT, version still bumps)"
      - name: occ_carrier_submit_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[carrier-submit-stale-version]"]
        distinguishing_aspect: "OCC on Carrier.version at registration submit: after a successful submit (version advanced), a second submit carrying the previously observed version fails 412 ERR_STALE_VERSION — OCC (priority 6) fires before the state precondition (priority 8, ERR_CARRIER_NOT_SUBMITTABLE)."
        test_recipe:
          setup: ["Carrier created (version 1)"]
          setup_api_calls:
            - call: "POST /hazmat/carriers"
              payload: { legal_name: "Acme Hazmat LLC", usdot_number: "USDOT-3033", fleet_size_declared: 5, hazmat_categories: ["MISC"] }
              as: CarrierAdmin
              captures: { c_id: "$.data.id", c_v1: "$.data.version" }
          trigger:
            - call: "POST /hazmat/carriers/${c_id}/registration/submit"
              payload: { expected_carrier_version: "${c_v1}" }
              as: CarrierAdmin
              captures: { inv_prov: "$.data.provisional_total_cents" }
            - call: "POST /hazmat/carriers/${c_id}/registration/submit"
              payload: { expected_carrier_version: "${c_v1}" }
              as: CarrierAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "captured inv_prov == 27500 (first submit succeeded: SMALL fleet 5, MISC => no surcharge)"
            - "captured err == 'ERR_STALE_VERSION' (second submit with the pre-submit version; OCC precedes the SUBMITTED-state rejection)"

