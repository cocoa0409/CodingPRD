# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Task 2955 — Developer Relations & API Program
#
# 9 rule_ids x >= 2 instances = 25 instances. Every `grounds:` reference
# resolves into SCAFFOLD.yaml §1.1-§1.7; every numeric assert literal below was
# produced by executing the referenced §1.3 formula with its declared constants.
#
# Recurring fixture literals (used verbatim across instances):
#   docs version                = 2      (calculations.developer_trust_score.CURRENT_DOCS_VERSION)
#   trust with PROFESSIONAL cert = 71    -> TRUST_MULTIPLIER 1.00
#   trust without certification  = 56    -> TRUST_MULTIPLIER 0.75
#   PARTNER justification literal must be >= 120 chars, STANDARD >= 40.
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: trust_score_snapshot_vs_audited_diverge_on_pending_case
        grounds:
          - calculations.developer_trust_score
          - entities.Developer.fields.trust_score
          - entities.Developer.fields.audited_trust_score
          - entities.Developer.fields.throttled_window_count
          - endpoints.POST /program-checkpoints
        distinguishing_aspect: |
          The dual variant here is risk scoring on the Developer entity: the onboarding_snapshot
          variant ignores the 60 penalty points of the still-INVESTIGATING ViolationCase and ignores
          throttling, yielding 71, while the enforcement_audit variant charges 50% of those pending
          points (30) plus the 5-point throttling penalty, yielding 36 on identical stored data.
        test_recipe:
          setup:
            - "Developer D1 is DOCS_ACKNOWLEDGED with docs_version_acknowledged 2, certification_level PROFESSIONAL unexpired, hackathon_award_count 0"
            - "D1 holds one ACTIVE PARTNER QuotaAssignment with monthly_call_allowance 500000 and burst_credit_balance 90000"
            - "four usage windows have been recorded, the last two throttling, so clean_window_count is 0 and throttled_window_count is 2"
            - "one ViolationCase of category DATA_RETENTION severity HIGH (penalty_points 60) sits in state INVESTIGATING"
            - "logical clock is 2026-08-02T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /api-products"
              payload: { name: "Catalog API", data_sensitivity: "PUBLIC", scope_catalog: [{ scope: "catalog.read", sensitivity: "PUBLIC" }, { scope: "profile.read", sensitivity: "PERSONAL" }, { scope: "ledger.read", sensitivity: "FINANCIAL" }], sample_app_slugs: ["quickstart-node"], sustained_rpm_pool: 20000, monthly_call_pool: 50000000, required_tos_version: 1 }
              as: PlatformAdmin
              as_user_id: "adm-1"
              captures: { p1_id: $.data.id }
            - call: "POST /api-products/${p1_id}/versions"
              payload: { semver: "1.0.0", breaking_change: false }
              as: PlatformAdmin
              as_user_id: "adm-1"
              captures: { v1_id: $.data.id }
            - call: "POST /api-versions/${v1_id}/promote"
              payload: {}
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /developers"
              payload: { org_name: "Northwind Labs", contact_email: "dev1@northwind.example", region_code: "EU" }
              as: DevRelManager
              as_user_id: "drm-1"
              captures: { d1_id: $.data.id }
            - call: "POST /developers/${d1_id}/onboarding-acknowledgement"
              payload: { docs_version: 2, tos_version: 1 }
              as: Developer
              as_user_id: "${d1_id}"
            - call: "POST /developers/${d1_id}/ecosystem-participations"
              payload: { certification_level: "PROFESSIONAL", certification_expires_at: "2027-08-01T00:00:00Z" }
              as: DevRelManager
              as_user_id: "drm-1"
            - call: "POST /access-applications"
              payload: { developer_id: "${d1_id}", target_api_version_id: "${v1_id}", requested_tier: "PARTNER", requested_scopes: ["catalog.read"], requested_monthly_calls: 500000, justification_text: "We operate a regulated settlement reconciliation product and require partner-tier sustained throughput for nightly batch windows across twelve markets, with burst headroom for month-end close." }
              as: Developer
              as_user_id: "${d1_id}"
              captures: { app1_id: $.data.id }
            - call: "POST /access-applications/${app1_id}/submit"
              payload: {}
              as: Developer
              as_user_id: "${d1_id}"
            - call: "POST /access-applications/${app1_id}/claim-review"
              payload: {}
              as: DevRelManager
              as_user_id: "drm-1"
            - call: "POST /access-applications/${app1_id}/decide"
              payload: { decision: "APPROVE", approved_tier: "PARTNER", granted_scopes: ["catalog.read"] }
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "GET /api-products/${p1_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "adm-1"
