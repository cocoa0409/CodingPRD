        claim_type: standard_crud
        grounds: ["endpoints.GET./lift-plans", "entities.LiftPlan.fields.plan_status"]
        distinguishing_aspect: "GET /lift-plans?plan_status=SURVEYED over one DRAFT and one SURVEYED plan returns exactly the SURVEYED one with total_count 1."
        test_recipe:
          setup: ["One DRAFT plan and one SURVEYED plan exist on the same site."]
          setup_api_calls:
            - call: "POST /customers"
