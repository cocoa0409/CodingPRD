  - section: rbac
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role/X-User-ID headers is rejected with ERR_UNAUTHENTICATED (401) before any role or existence check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /coop/seasons"
              payload: { year: 2026, harvest_window_start: "2026-09-15", harvest_window_end: "2026-11-15", baseline_barrels_per_acre: 200 }
              as: CoopAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "TRIGGER NOTE: this call is sent WITHOUT the X-User-Role and X-User-ID headers"
            - "error_id == ERR_UNAUTHENTICATED (http 401)"

      - name: grower_cannot_create_pool_forbidden
        claim_type: violation_to_error
        grounds: ["roles[PoolManager].exclusive_operations", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Pool creation is PoolManager-exclusive; a GrowerMember caller gets ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["ACTIVE member and SETUP season exist"]
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { member_code: "M100", full_name: "Alice Grower" }
              as: CoopAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /coop/members/${m1}/transition"
              payload: { to: "ACTIVE" }
              as: CoopAdmin
            - call: "POST /coop/seasons"
              payload: { year: 2026, harvest_window_start: "2026-09-15", harvest_window_end: "2026-11-15", baseline_barrels_per_acre: 200 }
              as: CoopAdmin
              captures: { s1: "$.data.id" }
          trigger:
            - call: "POST /coop/pools"
              payload: { season_id: "${s1}", code: "MAIN", provisional_advance_rate_per_barrel: 0.50, retain_pct: 0.20 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_FORBIDDEN (http 403)"

      - name: grower_cannot_approve_own_estimate_forbidden
        claim_type: violation_to_error
        grounds: ["roles[FieldOfficer].exclusive_operations", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Estimate approval is FieldOfficer-only even for the owning grower (peer-role segregation) -> ERR_FORBIDDEN."
        test_recipe:
          setup: ["ACTIVE member, ACTIVE bog, SETUP season, SUBMITTED estimate owned by the caller"]
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { member_code: "M100", full_name: "Alice Grower" }
              as: CoopAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /coop/members/${m1}/transition"
              payload: { to: "ACTIVE" }
              as: CoopAdmin
            - call: "POST /coop/bogs"
              payload: { name: "North Bog", acres: 10, variety: "STEVENS", sprinkler_demand_gpm: 500 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { b1: "$.data.id" }
            - call: "POST /coop/seasons"
              payload: { year: 2026, harvest_window_start: "2026-09-15", harvest_window_end: "2026-11-15", baseline_barrels_per_acre: 200 }
              as: CoopAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /coop/yield-estimates"
              payload: { bog_id: "${b1}", season_id: "${s1}", estimated_barrels: 2300 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { e1: "$.data.id" }
          trigger:
            - call: "POST /coop/yield-estimates/${e1}/transition"
              payload: { to: "APPROVED" }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_FORBIDDEN"
            - "YieldEstimate.${e1}.status remains SUBMITTED"

      - name: station_operator_cannot_grade_other_stations_delivery
        claim_type: violation_to_error
        grounds: ["roles[StationOperator]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Entity-backed identity: StationOperator X-User-ID must equal the delivery's receiving_station_id; grading a delivery booked at station A while acting as station B -> ERR_FORBIDDEN."
        test_recipe:
          setup: ["stations A and B; delivery at station A in RECEIVED state"]
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { member_code: "M100", full_name: "Alice Grower" }
              as: CoopAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /coop/members/${m1}/transition"
              payload: { to: "ACTIVE" }
              as: CoopAdmin
            - call: "POST /coop/bogs"
              payload: { name: "North Bog", acres: 10, variety: "STEVENS", sprinkler_demand_gpm: 500 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { b1: "$.data.id" }
            - call: "POST /coop/seasons"
              payload: { year: 2026, harvest_window_start: "2026-09-15", harvest_window_end: "2026-11-15", baseline_barrels_per_acre: 200 }
              as: CoopAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /coop/seasons/${s1}/open"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/stations"
              payload: { name: "Station A", daily_capacity_barrels: 5000 }
              as: CoopAdmin
              captures: { st_a: "$.data.id" }
            - call: "POST /coop/stations"
              payload: { name: "Station B", daily_capacity_barrels: 5000 }
              as: CoopAdmin
              captures: { st_b: "$.data.id" }
            - call: "POST /coop/deliveries"
              payload: { season_id: "${s1}", bog_id: "${b1}", receiving_station_id: "${st_a}", scheduled_date: "2026-10-10", expected_barrels: 150 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { d1: "$.data.id" }
            - call: "POST /coop/deliveries/${d1}/receive"
              payload: { gross_barrels: 150, tare_barrels: 50 }
              as: StationOperator
              as_user_id: "${st_a}"
          trigger:
            - call: "POST /coop/deliveries/${d1}/grade"
              payload: { color_score: 9.0, firmness_score: 9.0, foreign_matter_pct: 1.0 }
              as: StationOperator
              as_user_id: "${st_b}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_FORBIDDEN (cross-station grading denied)"
            - "Delivery.${d1}.status remains RECEIVED"

  # ==========================================================================
  # Section: cross_cutting_layers
  # ==========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_pool_version_rejected_then_fresh_accepted
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[pool-rate-update-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH pool with expected_pool_version one behind the observed version -> ERR_STALE_VERSION (412); the same PATCH with the current version succeeds and increments version."
        test_recipe:
          setup: ["season SETUP, MAIN pool created (version observed)"]
          setup_api_calls:
            - call: "POST /coop/seasons"
              payload: { year: 2026, harvest_window_start: "2026-09-15", harvest_window_end: "2026-11-15", baseline_barrels_per_acre: 200 }
              as: CoopAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /coop/pools"
              payload: { season_id: "${s1}", code: "MAIN", provisional_advance_rate_per_barrel: 0.50, retain_pct: 0.20 }
              as: PoolManager
              captures: { p1: "$.data.id", p_v: "$.data.version" }
          trigger:
            - call: "PATCH /coop/pools/${p1}"
              payload: { provisional_advance_rate_per_barrel: 0.60, expected_pool_version: "${p_v} - 1" }
              as: PoolManager
              captures: { err: "$.data.error_id" }
            - call: "PATCH /coop/pools/${p1}"
              payload: { provisional_advance_rate_per_barrel: 0.60, expected_pool_version: "${p_v}" }
              as: PoolManager
              captures: { p_rate: "$.data.provisional_advance_rate_per_barrel", p_v2: "$.data.version" }
          assert:
            - "stale PATCH -> error_id == ERR_STALE_VERSION (http 412)"
            - "fresh PATCH -> 200, provisional_advance_rate_per_barrel == 0.60, version incremented by exactly 1 from ${p_v}"

      - name: occ_stale_quota_version_rejected_then_fresh_accepted
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[quota-adjust-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Same OCC shape on MemberQuota: stale expected_quota_version -> 412; fresh version applies base_quota_override (base 500) and recomputes posture."
        test_recipe:
          setup: ["ACTIVE member, season OPEN (quota exists, version observed)"]
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { member_code: "M100", full_name: "Alice Grower" }
              as: CoopAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /coop/members/${m1}/transition"
              payload: { to: "ACTIVE" }
              as: CoopAdmin
            - call: "POST /coop/seasons"
              payload: { year: 2026, harvest_window_start: "2026-09-15", harvest_window_end: "2026-11-15", baseline_barrels_per_acre: 200 }
              as: CoopAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /coop/seasons/${s1}/open"
              payload: {}
              as: CoopAdmin
            - call: "GET /coop/quotas"
              payload: { member_id: "${m1}", season_id: "${s1}" }
              as: CoopAdmin
              captures: { q1: "$.data[0].id", q_v: "$.data[0].version" }
          trigger:
            - call: "PATCH /coop/quotas/${q1}"
              payload: { base_quota_barrels: 500, expected_quota_version: "${q_v} - 1" }
              as: CoopAdmin
              captures: { err: "$.data.error_id" }
            - call: "PATCH /coop/quotas/${q1}"
              payload: { base_quota_barrels: 500, expected_quota_version: "${q_v}" }
              as: CoopAdmin
              captures: { q_base: "$.data.base_quota_barrels", q_v2: "$.data.version" }
          assert:
            - "stale PATCH -> error_id == ERR_STALE_VERSION (http 412)"
            - "fresh PATCH -> 200, base_quota_barrels == 500, version incremented by exactly 1"

      - name: deliveries_list_pagination_and_envelope_shape
        claim_type: pagination_with_filtering
        grounds: ["response_envelope", "endpoints[\"GET /coop/deliveries\"]"]
        distinguishing_aspect: "List responses carry the fixed envelope (meta.api_request_id, response_type array, limit/offset/total_count/has_more); filtering by member_id + status returns exactly the matching rows and honors limit."
        test_recipe:
          setup: ["ACTIVE member with bog, OPEN season, station; three SCHEDULED deliveries on different dates (10-10, 10-11, 10-12)"]
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { member_code: "M100", full_name: "Alice Grower" }
              as: CoopAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /coop/members/${m1}/transition"
              payload: { to: "ACTIVE" }
              as: CoopAdmin
            - call: "POST /coop/bogs"
              payload: { name: "North Bog", acres: 10, variety: "STEVENS", sprinkler_demand_gpm: 500 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { b1: "$.data.id" }
            - call: "POST /coop/seasons"
              payload: { year: 2026, harvest_window_start: "2026-09-15", harvest_window_end: "2026-11-15", baseline_barrels_per_acre: 200 }
              as: CoopAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /coop/seasons/${s1}/open"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/stations"
              payload: { name: "Station A", daily_capacity_barrels: 5000 }
              as: CoopAdmin
              captures: { st1: "$.data.id" }
            - call: "POST /coop/deliveries"
              payload: { season_id: "${s1}", bog_id: "${b1}", receiving_station_id: "${st1}", scheduled_date: "2026-10-10", expected_barrels: 100 }
              as: GrowerMember
              as_user_id: "${m1}"
            - call: "POST /coop/deliveries"
              payload: { season_id: "${s1}", bog_id: "${b1}", receiving_station_id: "${st1}", scheduled_date: "2026-10-11", expected_barrels: 100 }
              as: GrowerMember
              as_user_id: "${m1}"
            - call: "POST /coop/deliveries"
              payload: { season_id: "${s1}", bog_id: "${b1}", receiving_station_id: "${st1}", scheduled_date: "2026-10-12", expected_barrels: 100 }
              as: GrowerMember
              as_user_id: "${m1}"
          trigger:
            - call: "GET /coop/deliveries"
              payload: { member_id: "${m1}", status: "SCHEDULED", limit: 2, offset: 0 }
              as: PoolManager
          assert:
            - "response envelope contains meta.api_request_id, response_type == \"array\""
            - "data has 2 rows (limit honored), all with member_id == ${m1} and status == SCHEDULED"
            - "total_count == 3 and has_more == true"

      - name: derived_quota_fields_reconciled_on_accept_and_void
        claim_type: derived_field_reconciliation
        grounds: ["entities.MemberQuota.fields.delivered_barrels", "calculations.over_quota_split"]
        distinguishing_aspect: "Covered by the compensating-invariant difficulty instances: delivered_barrels/over_quota_barrels are re-derived on both the forward (accept) and compensating (void) mutations."
        excluded_because:
          difficulty_instance: compensating_invariant / accept_void_roundtrip_conserves_quota_barrels
          rationale: "That instance asserts the derived quota fields after accept (950) and after void (0), which is the reconciliation claim."

      - name: multi_hop_cascade_end_to_end
        claim_type: cascading_side_effects
        grounds: ["state_machines.FrostEvent.ACTIVE_to_COMPLETED"]
        distinguishing_aspect: "Covered by the depth-3 frost cascade difficulty instance."
        excluded_because:
          difficulty_instance: transitive_cascade / frost_damage_flags_estimate_recomputes_quota_flips_posture
          rationale: "That instance verifies all three cascade hops end-to-end."

      - name: dual_variant_layer_coverage
        claim_type: dual_variant_calculation
        grounds: ["calculations.quota_base_barrels", "calculations.pool_settlement_pricing"]
        distinguishing_aspect: "Covered by both rule-1 difficulty instances (quota variants; advance vs settlement variants)."
        excluded_because:
          difficulty_instance: dual_variant_calc / delivery_provisional_advance_vs_final_settlement
          rationale: "Asserts the two money variants diverge for identical delivery data."

  # ==========================================================================
  # Section: consistency_model
  # ==========================================================================
  - section: consistency_model
    instances:
      - name: accept_effects_immediately_visible_on_quota_and_pool
        claim_type: immediate_consistency
        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "Immediate consistency: the accept response and a follow-up GET in the same test show quota and pool totals already updated — covered by the invariant instances' interleaved GETs."
        excluded_because:
          difficulty_instance: compensating_invariant / accept_void_roundtrip_conserves_pool_advances
          rationale: "That instance GETs the pool immediately after accept and asserts advances_outstanding == 522.50, proving same-request visibility."

  # ==========================================================================
  # Section: endpoints / errors — residual triggerability stubs
  # ==========================================================================
  - section: endpoints
    instances:
      - name: harvest_overlap_error_triggerability
        claim_type: violation_to_error
        grounds: ["errors[ERR_HARVEST_WINDOW_OVERLAP]"]
        distinguishing_aspect: "Covered by the half-open overlap difficulty instance."
        excluded_because:
          difficulty_instance: resource_temporal_overlap / harvest_ticket_half_open_overlap_on_bog
          rationale: "Triggers ERR_HARVEST_WINDOW_OVERLAP on the overlapping window and proves adjacency acceptance."

      - name: station_capacity_error_triggerability
        claim_type: violation_to_error
        grounds: ["errors[ERR_STATION_CAPACITY_EXCEEDED]"]
        distinguishing_aspect: "Covered by the aggregate-capacity difficulty instance."
        excluded_because:
          difficulty_instance: resource_temporal_overlap / station_daily_aggregate_capacity_bucket
          rationale: "Triggers ERR_STATION_CAPACITY_EXCEEDED at 501 > 500 and proves the 500 == 500 inclusive boundary."

      - name: pool_not_open_error_triggerability
        claim_type: violation_to_error
        grounds: ["errors[ERR_POOL_NOT_OPEN]"]
        distinguishing_aspect: "Covered by the cross-entity difficulty instance for Delivery -> Pool."
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / delivery_accept_blocked_when_main_pool_closed
          rationale: "Triggers ERR_POOL_NOT_OPEN on accept with MAIN pool CLOSED."

      - name: bog_not_active_error_triggerability
        claim_type: violation_to_error
        grounds: ["errors[ERR_BOG_NOT_ACTIVE]"]
        distinguishing_aspect: "Covered by the cross-entity difficulty instance for HarvestTicket -> Bog."
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / ticket_approve_blocked_when_bog_not_active
          rationale: "Triggers ERR_BOG_NOT_ACTIVE on ticket approval after renovation planning."

      - name: ticket_invalid_error_triggerability
        claim_type: violation_to_error
        grounds: ["errors[ERR_TICKET_INVALID]"]
        distinguishing_aspect: "A delivery referencing a harvest ticket that belongs to a DIFFERENT bog is rejected with ERR_TICKET_INVALID (referential consistency across aggregates)."
        test_recipe:
          setup: ["ACTIVE member with bogs B1 and B2, season 2026, APPROVED ticket on B1, station; delivery created against B2 but citing B1's ticket"]
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { member_code: "M100", full_name: "Alice Grower" }
              as: CoopAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /coop/members/${m1}/transition"
              payload: { to: "ACTIVE" }
              as: CoopAdmin
            - call: "POST /coop/bogs"
              payload: { name: "North Bog", acres: 10, variety: "STEVENS", sprinkler_demand_gpm: 500 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { b1: "$.data.id" }
            - call: "POST /coop/bogs"
              payload: { name: "South Bog", acres: 8, variety: "BEN_LEAR", sprinkler_demand_gpm: 400 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { b2: "$.data.id" }
            - call: "POST /coop/seasons"
              payload: { year: 2026, harvest_window_start: "2026-09-15", harvest_window_end: "2026-11-15", baseline_barrels_per_acre: 200 }
              as: CoopAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /coop/harvest-tickets"
              payload: { bog_id: "${b1}", season_id: "${s1}", method: "DRY", window_start: "2026-10-01T00:00:00Z", window_end: "2026-10-05T00:00:00Z" }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { t1: "$.data.id" }
            - call: "POST /coop/harvest-tickets/${t1}/transition"
              payload: { to: "APPROVED" }
              as: FieldOfficer
            - call: "POST /coop/seasons/${s1}/open"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/stations"
              payload: { name: "Station A", daily_capacity_barrels: 5000 }
              as: CoopAdmin
              captures: { st1: "$.data.id" }
          trigger:
            - call: "POST /coop/deliveries"
              payload: { season_id: "${s1}", bog_id: "${b2}", receiving_station_id: "${st1}", harvest_ticket_id: "${t1}", scheduled_date: "2026-10-10", expected_barrels: 100 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_TICKET_INVALID (ticket APPROVED but ticket.bog_id != delivery.bog_id)"
