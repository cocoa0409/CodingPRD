            - { call: "POST /audit-findings/${f2}/resolve", payload: { resolution: "APPLY" }, as: Auditor, as_user_id: "${auditor_id}" }
          trigger:
            - { call: "POST /audits/${audit1}/complete", payload: {}, as: Auditor, as_user_id: "${auditor_id}" }
            - { call: "POST /audits/${audit2}/complete", payload: {}, as: Auditor, as_user_id: "${auditor_id}" }
          assert:
            - "CodingAudit.${audit1}.accuracy_code_based == 0.9500 (1 - 1/20)"
            - "Coder.${s1_id}.credential_review_required == false (0.9500 is not < 0.9500)"
            - "CodingAudit.${audit2}.accuracy_code_based == 0.7500 (1 - 1/4)"
            - "Coder.${s2_id}.credential_review_required == true (0.7500 < 0.9500)"

  # ------------------------------------------------------------------ Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: bill_finalize_requires_chart_coded
        grounds:
          - state_machines.Bill.READY_to_FINAL_BILLED
          - errors[ERR_CHART_NOT_CODED]
        distinguishing_aspect: |
          Entity pair Bill -> Chart: finalize is rejected with ERR_CHART_NOT_CODED
          while the chart is SUBMITTED (assignment accepted never happened); the Bill's
          own state (READY) is insufficient without the linked Chart's state.
        test_recipe:
          setup:
            - "Chart coded through SUBMITTED (never accepted, so chart not CODED); bill created while chart SUBMITTED sits DRAFT; manager then... bill cannot be READY without chart CODED, so finalize is attempted on the DRAFT bill — both the chart gate and readiness derive from the Chart entity"
            - "Note: the chart gate (ERR_CHART_NOT_CODED) is the cross-entity dependency under test"
          setup_api_calls:
            - { call: "POST /coders", payload: { employee_no: "E-CE1", full_name: "Cross One", credential: "CCS" }, as: CodingManager, captures: { coder_id: $.data.id } }
            - { call: "POST /patient-accounts", payload: { mrn: "MRN-CE1", admit_at: "2026-04-20T08:00:00Z", patient_class: "INPATIENT", financial_class: "MEDICARE", total_charges_cents: 900000 }, as: CodingManager, captures: { acct_id: $.data.id } }
            - { call: "POST /charts", payload: { account_id: "${acct_id}", acuity: "MEDICAL_LOW" }, as: CodingManager, captures: { chart_id: $.data.id } }
            - { call: "POST /patient-accounts/${acct_id}/discharge", payload: { discharge_at: "2026-04-25T10:00:00Z", discharge_disposition: "HOME" }, as: CodingManager }
            - { call: "POST /assignments", payload: { chart_id: "${chart_id}", coder_id: "${coder_id}", due_at: "2026-05-10T00:00:00Z" }, as: CodingManager, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/start", payload: {}, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /diagnosis-lines", payload: { chart_id: "${chart_id}", icd_code: "I21.09", poa: "Y", sequence: 1, is_principal: true }, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /assignments/${asg_id}/submit", payload: {}, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /bills", payload: { account_id: "${acct_id}" }, as: BillingClerk, captures: { bill_id: $.data.id } }
          trigger:
            - { call: "POST /bills/${bill_id}/finalize", payload: {}, as: BillingClerk, captures: { err: $.data.error_id } }
          assert:
            - "Trigger response error_id == ERR_CHART_NOT_CODED (409): Chart.${chart_id}.status == SUBMITTED, not CODED"
            - "Bill.${bill_id}.status == DRAFT (unchanged)"

      - name: assignment_start_requires_active_coder
        grounds:
          - state_machines.CodingAssignment.ASSIGNED_to_IN_PROGRESS
          - errors[ERR_CODER_INACTIVE]
        distinguishing_aspect: |
          Entity pair CodingAssignment -> Coder: start is rejected with
          ERR_CODER_INACTIVE when the linked Coder entity is INACTIVE even though the
          assignment itself is in the valid ASSIGNED from-state — a cross-entity state
          dependency on a different entity pair than the sibling's Bill -> Chart.
        test_recipe:
          setup:
            - "READY chart assigned to a CCS coder; the coder is then patched INACTIVE"
          setup_api_calls:
            - { call: "POST /coders", payload: { employee_no: "E-CE2", full_name: "Cross Two", credential: "CCS" }, as: CodingManager, captures: { coder_id: $.data.id } }
            - { call: "POST /patient-accounts", payload: { mrn: "MRN-CE2", admit_at: "2026-04-20T08:00:00Z", patient_class: "INPATIENT", financial_class: "MEDICARE", total_charges_cents: 900000 }, as: CodingManager, captures: { acct_id: $.data.id } }
            - { call: "POST /charts", payload: { account_id: "${acct_id}", acuity: "MEDICAL_LOW" }, as: CodingManager, captures: { chart_id: $.data.id } }
            - { call: "POST /patient-accounts/${acct_id}/discharge", payload: { discharge_at: "2026-04-25T10:00:00Z", discharge_disposition: "HOME" }, as: CodingManager }
            - { call: "POST /assignments", payload: { chart_id: "${chart_id}", coder_id: "${coder_id}", due_at: "2026-05-10T00:00:00Z" }, as: CodingManager, captures: { asg_id: $.data.id } }
            - { call: "PATCH /coders/${coder_id}", payload: { status: "INACTIVE" }, as: CodingManager }
          trigger:
            - { call: "POST /assignments/${asg_id}/start", payload: {}, as: Coder, as_user_id: "${coder_id}", captures: { err: $.data.error_id } }
          assert:
            - "Trigger response http_status == 409 and error_id == ERR_CODER_INACTIVE"
            - "CodingAssignment.${asg_id}.status == ASSIGNED (unchanged)"

  # ------------------------------------------------------------------ Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: coder_single_in_progress_capacity
        grounds:
          - validations[priority=8]
          - errors[ERR_WORKLOAD_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: aggregate capacity — a Coder resource may carry at most
          one IN_PROGRESS assignment (occupation of the [started_at, due_at] window);
          starting a second assignment on a different chart collides with the in-flight
          one -> ERR_WORKLOAD_OVERLAP. Resource entity: Coder.
        test_recipe:
          setup:
            - "One ACTIVE CCS coder; two READY MEDICAL_HIGH charts on two discharged accounts; assignment A1 started (IN_PROGRESS), assignment A2 ASSIGNED to the same coder"
          setup_api_calls:
            - { call: "POST /coders", payload: { employee_no: "E-TO1", full_name: "Cap Acity", credential: "CCS" }, as: CodingManager, captures: { coder_id: $.data.id } }
            - { call: "POST /patient-accounts", payload: { mrn: "MRN-TO1A", admit_at: "2026-04-20T08:00:00Z", patient_class: "INPATIENT", financial_class: "MEDICARE", total_charges_cents: 900000 }, as: CodingManager, captures: { acct_a: $.data.id } }
            - { call: "POST /patient-accounts", payload: { mrn: "MRN-TO1B", admit_at: "2026-04-20T08:00:00Z", patient_class: "INPATIENT", financial_class: "MEDICARE", total_charges_cents: 900000 }, as: CodingManager, captures: { acct_b: $.data.id } }
            - { call: "POST /charts", payload: { account_id: "${acct_a}", acuity: "MEDICAL_HIGH" }, as: CodingManager, captures: { chart_a: $.data.id } }
            - { call: "POST /charts", payload: { account_id: "${acct_b}", acuity: "MEDICAL_HIGH" }, as: CodingManager, captures: { chart_b: $.data.id } }
            - { call: "POST /patient-accounts/${acct_a}/discharge", payload: { discharge_at: "2026-04-25T10:00:00Z", discharge_disposition: "HOME" }, as: CodingManager }
            - { call: "POST /patient-accounts/${acct_b}/discharge", payload: { discharge_at: "2026-04-25T10:00:00Z", discharge_disposition: "HOME" }, as: CodingManager }
            - { call: "POST /assignments", payload: { chart_id: "${chart_a}", coder_id: "${coder_id}", due_at: "2026-05-10T00:00:00Z" }, as: CodingManager, captures: { asg_a: $.data.id } }
            - { call: "POST /assignments", payload: { chart_id: "${chart_b}", coder_id: "${coder_id}", due_at: "2026-05-10T00:00:00Z" }, as: CodingManager, captures: { asg_b: $.data.id } }
            - { call: "POST /assignments/${asg_a}/start", payload: {}, as: Coder, as_user_id: "${coder_id}" }
          trigger:
            - { call: "POST /assignments/${asg_b}/start", payload: {}, as: Coder, as_user_id: "${coder_id}", captures: { err: $.data.error_id } }
          assert:
            - "Trigger response http_status == 409 and error_id == ERR_WORKLOAD_OVERLAP"
            - "CodingAssignment.${asg_b}.status == ASSIGNED (unchanged); ${asg_a} remains IN_PROGRESS"

      - name: audit_window_half_open_adjacency
        grounds:
          - validations[priority=8]
          - errors[ERR_AUDIT_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: half-open [window_start, window_end) — an audit window
          whose start equals the existing window's end (adjacent, zero gap) is ALLOWED,
          while a window overlapping by 15 days is rejected with
          ERR_AUDIT_WINDOW_OVERLAP. Resource entity: CodingAudit windows over a subject
          coder — different interval arithmetic (half-open adjacency) than the sibling's
          aggregate-capacity rule.
        test_recipe:
          setup:
            - "Subject coder (CCS) and a distinct RHIA auditor; audit A on the subject occupies [2026-03-01, 2026-04-01)"
          setup_api_calls:
            - { call: "POST /coders", payload: { employee_no: "E-TO2A", full_name: "Sub Ject", credential: "CCS" }, as: CodingManager, captures: { subj_id: $.data.id } }
            - { call: "POST /coders", payload: { employee_no: "E-TO2B", full_name: "Aud Itor", credential: "RHIA" }, as: CodingManager, captures: { auditor_id: $.data.id } }
            - { call: "POST /audits", payload: { subject_coder_id: "${subj_id}", window_start: "2026-03-01T00:00:00Z", window_end: "2026-04-01T00:00:00Z", sample_size: 3 }, as: Auditor, as_user_id: "${auditor_id}", captures: { audit_a: $.data.id } }
          trigger:
            - { call: "POST /audits", payload: { subject_coder_id: "${subj_id}", window_start: "2026-04-01T00:00:00Z", window_end: "2026-05-01T00:00:00Z", sample_size: 3 }, as: Auditor, as_user_id: "${auditor_id}", captures: { audit_b: $.data.id } }
            - { call: "POST /audits", payload: { subject_coder_id: "${subj_id}", window_start: "2026-03-15T00:00:00Z", window_end: "2026-04-15T00:00:00Z", sample_size: 3 }, as: Auditor, as_user_id: "${auditor_id}", captures: { err: $.data.error_id } }
          assert:
            - "Adjacent window [2026-04-01, 2026-05-01) succeeds: audit_b created (201) — half-open adjacency is not overlap"
            - "Overlapping window [2026-03-15, 2026-04-15) rejected: http_status == 409 and error_id == ERR_AUDIT_WINDOW_OVERLAP"

  # ------------------------------------------------------------------ Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: rebill_create_cancel_conserves_net_receivable
        grounds:
          - state_machines.Bill.REBILL_REQUIRED_to_PAID
          - state_machines.RebillRequest.PENDING_to_CANCELLED
          - entities.Bill.fields.net_receivable_cents
        distinguishing_aspect: |
          Conserved quantity: money. Pairing the forward action (rebill create,
          delta -200000) with its compensating action (rebill cancel) MUST leave
          Bill.net_receivable_cents == billed_amount_cents - paid_amount_cents == 0
          exactly as before the pair — pinned as net_receivable_cents ==
          billed_amount_cents - paid_amount_cents (+0 pending delta).
        test_recipe:
          setup:
            - "Coded+accepted chart (principal + MCC poa=Y; expected 1365000); bill READY -> FINAL_BILLED (billed 1365000) -> PAID in full at 2026-05-01 (net_receivable 0); review PR-CI1 claims -200000"
          setup_api_calls:
            - { call: "POST /coders", payload: { employee_no: "E-CI1", full_name: "Con Serve", credential: "RHIA" }, as: CodingManager, captures: { coder_id: $.data.id } }
            - { call: "POST /patient-accounts", payload: { mrn: "MRN-CI1", admit_at: "2026-04-20T08:00:00Z", patient_class: "INPATIENT", financial_class: "MEDICARE", total_charges_cents: 2000000 }, as: CodingManager, captures: { acct_id: $.data.id } }
            - { call: "POST /charts", payload: { account_id: "${acct_id}", acuity: "MEDICAL_HIGH" }, as: CodingManager, captures: { chart_id: $.data.id } }
            - { call: "POST /patient-accounts/${acct_id}/discharge", payload: { discharge_at: "2026-04-25T10:00:00Z", discharge_disposition: "HOME" }, as: CodingManager }
            - { call: "POST /assignments", payload: { chart_id: "${chart_id}", coder_id: "${coder_id}", due_at: "2026-05-10T00:00:00Z" }, as: CodingManager, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/start", payload: {}, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /diagnosis-lines", payload: { chart_id: "${chart_id}", icd_code: "I21.09", poa: "Y", sequence: 1, is_principal: true }, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /diagnosis-lines", payload: { chart_id: "${chart_id}", icd_code: "N18.6", poa: "Y", sequence: 2, cc_level: "MCC" }, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /assignments/${asg_id}/submit", payload: {}, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /assignments/${asg_id}/accept", payload: {}, as: CodingManager }
            - { call: "POST /bills", payload: { account_id: "${acct_id}" }, as: BillingClerk, captures: { bill_id: $.data.id } }
            - { call: "POST /bills/${bill_id}/finalize", payload: {}, as: BillingClerk }
            - { call: "POST /bills/${bill_id}/record-payment", payload: { paid_amount_cents: 1365000, paid_at: "2026-05-01T00:00:00Z" }, as: BillingClerk }
            - { call: "POST /bills/${bill_id}/post-payment-reviews", payload: { payer_ref: "PR-CI1", claimed_delta_cents: -200000 }, as: BillingClerk, captures: { review_id: $.data.id } }
            - { call: "GET /bills/${bill_id}", payload: {}, as: BillingClerk, captures: { bill_v: $.data.version } }
            - { call: "POST /rebill-requests", payload: { review_id: "${review_id}", delta_cents: -200000, expected_bill_version: "${bill_v}" }, as: BillingClerk, as_user_id: "clerk-ci1", captures: { rebill_id: $.data.id } }
          trigger:
            - { call: "POST /rebill-requests/${rebill_id}/cancel", payload: {}, as: ComplianceOfficer, as_user_id: "officer-ci1" }
          assert:
            - "Before pair: Bill.${bill_id}.net_receivable_cents == 0 (1365000 - 1365000)"
            - "After rebill create (PENDING): Bill.net_receivable_cents == 0 (pending delta does not drift the ledger)"
            - "After compensating cancel: Bill.net_receivable_cents == 0 — forward + compensating pair conserves the money invariant"
            - "Bill.${bill_id}.status == PAID and RebillRequest.${rebill_id}.status == CANCELLED"

      - name: assignment_assign_release_conserves_workload
        grounds:
          - state_machines.CodingAssignment.ASSIGNED_to_QUEUED
          - entities.Coder.fields.workload_units
          - calculations.coder_productivity
        distinguishing_aspect: |
          Conserved quantity: coder workload units (a count-like resource, not money).
          Pairing the forward action (assign SURGICAL chart, weight 3) with its
          compensating action (release) MUST leave Coder.workload_units == 0 exactly as
          before the pair — pinned as workload_units ==
          sum(acuity weight over ASSIGNED + IN_PROGRESS) == 0 after compensation.
        test_recipe:
          setup:
            - "RHIA coder with workload_units 0; DISCHARGED account with a SURGICAL chart READY_FOR_CODING"
          setup_api_calls:
            - { call: "POST /coders", payload: { employee_no: "E-CI2", full_name: "Work Load", credential: "RHIA" }, as: CodingManager, captures: { coder_id: $.data.id } }
            - { call: "POST /patient-accounts", payload: { mrn: "MRN-CI2", admit_at: "2026-04-20T08:00:00Z", patient_class: "INPATIENT", financial_class: "COMMERCIAL", total_charges_cents: 900000 }, as: CodingManager, captures: { acct_id: $.data.id } }
            - { call: "POST /charts", payload: { account_id: "${acct_id}", acuity: "SURGICAL" }, as: CodingManager, captures: { chart_id: $.data.id } }
            - { call: "POST /patient-accounts/${acct_id}/discharge", payload: { discharge_at: "2026-04-25T10:00:00Z", discharge_disposition: "HOME" }, as: CodingManager }
            - { call: "POST /assignments", payload: { chart_id: "${chart_id}", coder_id: "${coder_id}", due_at: "2026-05-10T00:00:00Z" }, as: CodingManager, captures: { asg_id: $.data.id } }
            - { call: "GET /coders/${coder_id}", payload: {}, as: CodingManager, captures: { w_after_assign: $.data.workload_units } }
          trigger:
            - { call: "POST /assignments/${asg_id}/release", payload: {}, as: CodingManager }
            - { call: "GET /coders/${coder_id}", payload: {}, as: CodingManager, captures: { w_after_release: $.data.workload_units } }
          assert:
            - "After assign (forward): Coder.${coder_id}.workload_units == 3 (SURGICAL weight)"
            - "After release (compensating): Coder.${coder_id}.workload_units == 0 — pair conserves the workload invariant"
            - "CodingAssignment.${asg_id}.status == QUEUED and coder_id == null"
