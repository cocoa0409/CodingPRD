          - errors[ERR_AGREEMENT_INVALID_STATE]
          - errors[ERR_INCENTIVE_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair state x business_fiscal: the request violates both
          (agreement already CANCELLED; amount 2000000 exceeds the remaining
          budget 1000000) and the state check (priority 7) must win over the
          fiscal check (priority 11).
