# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3410_oilseed_crush_margin_management_origination_contracts
# 2 instances per Difficulty Rule (§0.5), 18 instances total.
# Every instance is self-contained from empty-DB; the logical clock defaults to
# 2026-09-01T00:00:00Z and is only ever moved by POST /api/_clock/set_current_utc.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc: two dual-variant calculations on DIFFERENT
  # entity domains (farmer settlement money vs plant crush economics).
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_farmer_settlement_diverge_on_market_move
        grounds:
          - calculations.contract_settlement
          - entities.OriginationContract.fields.estimated_settlement_cents
          - entities.OriginationContract.fields.settlement_net_payable_cents
          - entities.OriginationContract.fields.accrued_storage_cents
        distinguishing_aspect: |
          Farmer-payment domain: the PROVISIONAL estimated_settlement_cents values unpriced
          bushels at the as-of futures quote and accrues storage only through 'now', while the
          FINAL variant at settle values every bushel at its actual election price and freezes
          accrual — identical deliveries, different dollars (1200000 provisional vs 1230000 final).
        test_recipe:
          setup:
            - "DEFERRED contract: 1000 bu, storage rate 2 cents/bu/day, deadline 2026-12-15, futures month 2026-12."
            - "BEAN 2026-12 futures quote 1200 as-of 2026-09-01; one clean ticket (1000 gross, moisture 13.0) applied on 2026-09-10 -> net 1000.000, discount 0."
            - "After the apply, estimated_settlement_cents == 1200000 (1000 bu x 1200, zero accrued days)."
          setup_api_calls:
            - &d_clock_0901
              call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &d_sched
              call: "POST /api/quality-discount-schedules"
              payload: { name: "Fall Std", moisture_base_pct: 13.0, moisture_shrink_pct_per_point: 1.3, moisture_discount_cents_per_point: 4, damage_free_pct: 2.0, damage_discount_cents_per_point: 3, fm_free_pct: 1.0, fm_discount_cents_per_point: 3, reject_moisture_pct: 18.0 }
              as: PlatformAdmin
              captures: { d_sched_id: $.data.id }
            - &d_sched_pub
              call: "POST /api/quality-discount-schedules/${d_sched_id}/publish"
              payload: {}
              as: PlatformAdmin
            - &d_elev
              call: "POST /api/elevators"
              payload: { name: "Riverbend", region: "IL", storage_capacity_bushels: 100000, active_discount_schedule_id: "${d_sched_id}" }
              as: PlatformAdmin
              captures: { d_elev_id: $.data.id }
            - &d_farm
              call: "POST /api/farmers"
              payload: { legal_name: "A. Farmer", county: "Macoupin" }
              as: PlatformAdmin
              captures: { d_farm_id: $.data.id }
            - &d_q_beans_1200
              call: "POST /api/market-quotes"
              payload: { commodity: "BEAN", quote_month: "2026-12", price_cents: 1200, quote_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &d_ctr_def
              call: "POST /api/origination-contracts"
              payload: { farmer_id: "${d_farm_id}", elevator_id: "${d_elev_id}", contract_type: "DEFERRED", quantity_bushels: 1000, futures_month: "2026-12", pricing_deadline: "2026-12-15T00:00:00Z", storage_rate_cents_per_bushel_day: 2 }
              as: OriginationMerchandiser
              captures: { d_ctr_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - &d_tkt
              call: "POST /api/delivery-tickets"
              payload: { contract_id: "${d_ctr_id}", gross_bushels: 1000, moisture_pct: 13.0, damage_pct: 0, foreign_material_pct: 0 }
              as: OriginationMerchandiser
              captures: { d_tkt_id: $.data.id }
            - call: "POST /api/delivery-tickets/${d_tkt_id}/apply"
              payload: {}
              as: OriginationMerchandiser
            - call: "GET /api/origination-contracts/${d_ctr_id}"
              payload: {}
              as: OriginationMerchandiser
              captures: { d_est_prov: $.data.estimated_settlement_cents, d_cv: $.data.version }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/market-quotes"
              payload: { commodity: "BEAN", quote_month: "2026-12", price_cents: 1250, quote_date: "2026-09-20T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/origination-contracts/${d_ctr_id}/pricing-elections"
              payload: { bushels: 1000, expected_contract_version: "${d_cv}" }
              as: OriginationMerchandiser
            - call: "POST /api/origination-contracts/${d_ctr_id}/settle"
              payload: {}
              as: OriginationMerchandiser
          assert:
            - "provisional OriginationContract.${d_ctr_id}.estimated_settlement_cents == 1200000 right after the apply (futures 1200, zero accrued days)"
            - "final OriginationContract.${d_ctr_id}.settlement_line_total_cents == 1250000 (1000 bu x election price 1250)"
            - "final OriginationContract.${d_ctr_id}.settlement_accrual_deduction_cents == 20000 (2 cents x 1000 bu x 10 days, 2026-09-10 -> 2026-09-20)"
            - "final OriginationContract.${d_ctr_id}.settlement_net_payable_cents == 1230000 — differs from the 1200000 provisional estimate on identical deliveries"
            - "OriginationContract.${d_ctr_id}.pricing_status == PRICED and fulfillment_status == SETTLED"

      - name: planned_vs_realized_crush_margin_diverge_on_quote_shift
        grounds:
          - calculations.crush_margin
          - entities.CrushRun.fields.planned_margin_cents
          - entities.CrushRun.fields.realized_margin_cents
          - state_machines.CrushRun.RUNNING_to_COMPLETE
        distinguishing_aspect: |
          Plant-economics domain: the PLANNED variant locks the crush spread from quotes as-of
          run creation (spread 204.00, margin 2040000 on 10000 bu), while the REALIZED variant at
          COMPLETE recomputes from quotes as-of completion (bean leg 1200 -> 1180 lifts the spread
          to 224.00, margin 2240000) — same run, different margin; unrelated to farmer settlement.
        test_recipe:
          setup:
            - "Plant with 10000 bu of bean inventory (delivered by truck); BEAN/OIL/MEAL 2026-11 quotes 1200/55/17 as-of 2026-09-01 -> spread 204.00."
            - "Crush run created on 2026-09-04 for run_date 2026-09-06, planned_bushels 10000 -> planned_margin_cents 2040000; run SCHEDULED."
            - "New BEAN 2026-11 quote 1180 as-of 2026-09-05 -> spread becomes 224.00."
          setup_api_calls:
            - *d_clock_0901
            - *d_sched
            - *d_sched_pub
            - *d_elev
            - *d_farm
            - call: "POST /api/market-quotes"
              payload: { commodity: "BEAN", quote_month: "2026-11", price_cents: 1200, quote_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/market-quotes"
              payload: { commodity: "OIL", quote_month: "2026-11", price_cents: 55, quote_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/market-quotes"
              payload: { commodity: "MEAL", quote_month: "2026-11", price_cents: 17, quote_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &d_plant
              call: "POST /api/crush-plants"
              payload: { name: "Decatur", daily_crush_capacity_bushels: 50000, daily_refinery_capacity_lbs: 1000000, biodiesel_feedstock_share_pct: 10 }
              as: PlatformAdmin
              captures: { d_plant_id: $.data.id }
            - call: "POST /api/origination-contracts"
              payload: { farmer_id: "${d_farm_id}", elevator_id: "${d_elev_id}", contract_type: "CASH", quantity_bushels: 10000, cash_price_cents_per_bushel: 1000 }
              as: OriginationMerchandiser
              captures: { d_ctr2_id: $.data.id }
            - call: "POST /api/delivery-tickets"
              payload: { contract_id: "${d_ctr2_id}", gross_bushels: 10000, moisture_pct: 13.0, damage_pct: 0, foreign_material_pct: 0 }
              as: OriginationMerchandiser
              captures: { d_tkt2_id: $.data.id }
            - call: "POST /api/delivery-tickets/${d_tkt2_id}/apply"
              payload: {}
              as: OriginationMerchandiser
            - &d_lane
              call: "POST /api/freight-lanes"
              payload: { origin_elevator_id: "${d_elev_id}", destination_plant_id: "${d_plant_id}", mode: "TRUCK", freight_cents_per_bushel: 12, transit_days: 2, daily_capacity_bushels: 50000 }
              as: LogisticsCoordinator
              captures: { d_lane_id: $.data.id }
            - call: "POST /api/shipments"
              payload: { lane_id: "${d_lane_id}", bushels: 10000, departure_date: "2026-09-02T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { d_ship_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/shipments/${d_ship_id}/deliver"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /api/crush-runs"
              payload: { plant_id: "${d_plant_id}", run_date: "2026-09-06T00:00:00Z", planned_bushels: 10000, futures_month: "2026-11" }
              as: PlantScheduler
              captures: { d_run_id: $.data.id, d_run_v: $.data.version }
            - call: "POST /api/crush-runs/${d_run_id}/schedule"
              payload: { expected_run_version: "${d_run_v}" }
              as: PlantScheduler
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/market-quotes"
              payload: { commodity: "BEAN", quote_month: "2026-11", price_cents: 1180, quote_date: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/crush-runs/${d_run_id}/transitions"
              payload: { to_status: "RUNNING" }
              as: PlantScheduler
            - call: "POST /api/crush-runs/${d_run_id}/transitions"
              payload: { to_status: "COMPLETE" }
              as: PlantScheduler
            - call: "GET /api/crush-runs/${d_run_id}"
              payload: {}
              as: PlantScheduler
          assert:
            - "CrushRun.${d_run_id}.planned_margin_cents == 2040000 (10000 x 204.00 spread locked at creation)"
            - "CrushRun.${d_run_id}.spread_cents_per_bushel == 204.0 (55x11 + 17x47 - 1200)"
            - "CrushRun.${d_run_id}.realized_margin_cents == 2240000 (10000 x 224.00 after the bean leg fell to 1180)"
            - "realized_margin_cents exceeds planned_margin_cents by exactly 200000 — the two variants diverge on identical run inputs"
            - "CrushRun.${d_run_id}.status == COMPLETE"

  # ===========================================================================
  # Rule 2 — combinatorial_formula: mode (a) multi-input non-linear with nested
  # max/branches (quality grading) vs mode (b) pinned nested-rounding order
  # (settlement lines). Different modes, per §0.5.
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: quality_discount_multifactor_nested_max
        grounds:
          - calculations.quality_grade_factors
          - entities.DeliveryTicket.fields.shrink_bushels
          - entities.DeliveryTicket.fields.discount_cents_per_bushel
        distinguishing_aspect: |
          Mode (a): three nested max(0, actual - free_allowance) factors (moisture 15.5 vs base
          13.0, damage 4.0 vs free 2.0, foreign material 3.0 vs free 1.0) feed both a
          multiplicative weight shrink and an additive per-point discount; each factor
          independently clamps at zero, so the formula is non-linear in all three inputs.
        test_recipe:
          setup:
            - "Elevator pinned to the standard schedule (base 13.0, shrink 1.3%/pt, 4c/pt moisture, damage free 2.0 at 3c/pt, FM free 1.0 at 3c/pt, reject 18.0)."
            - "CASH contract for 2000 bu at 1000 cents; one ticket gross 1000, moisture 15.5, damage 4.0, FM 3.0."
          setup_api_calls:
            - *d_clock_0901
            - *d_sched
            - *d_sched_pub
            - *d_elev
            - *d_farm
            - call: "POST /api/origination-contracts"
              payload: { farmer_id: "${d_farm_id}", elevator_id: "${d_elev_id}", contract_type: "CASH", quantity_bushels: 2000, cash_price_cents_per_bushel: 1000 }
              as: OriginationMerchandiser
              captures: { d_ctr_q_id: $.data.id }
            - call: "POST /api/delivery-tickets"
              payload: { contract_id: "${d_ctr_q_id}", gross_bushels: 1000, moisture_pct: 15.5, damage_pct: 4.0, foreign_material_pct: 3.0 }
              as: OriginationMerchandiser
              captures: { d_tkt_q_id: $.data.id }
          trigger:
            - call: "POST /api/delivery-tickets/${d_tkt_q_id}/apply"
              payload: {}
              as: OriginationMerchandiser
            - call: "GET /api/delivery-tickets/${d_tkt_q_id}"
              payload: {}
              as: OriginationMerchandiser
          assert:
            - "DeliveryTicket.${d_tkt_q_id}.shrink_bushels == 32.5 (1000 x 2.5 excess points x 1.3% )"
            - "DeliveryTicket.${d_tkt_q_id}.net_bushels == 967.5"
            - "DeliveryTicket.${d_tkt_q_id}.discount_cents_per_bushel == 22 (2.5x4 moisture + 2.0x3 damage + 2.0x3 foreign material)"
            - "DeliveryTicket.${d_tkt_q_id}.premium_cents_per_bushel == 0 (no program) and status == APPLIED"
            - "OriginationContract.${d_ctr_q_id}.delivered_bushels == 967.5 with fulfillment_status == DELIVERING"

      - name: settlement_rounding_per_line_then_sum
        grounds:
          - calculations.contract_settlement
          - entities.OriginationContract.fields.settlement_line_total_cents
        distinguishing_aspect: |
          Mode (b): the scaffold pins round-per-ticket-line-THEN-sum; two 0.001-bu tickets at 500
          cents each produce 0.5-cent lines that round up to 1 cent apiece -> total 2, whereas the
          forbidden sum-then-round order yields round(1.0) == 1. A one-cent divergence proves the order.
        test_recipe:
          setup:
            - "CASH contract quantity 0.002 bu at 500 cents/bu (born PRICED); two tickets of exactly 0.001 net bu each (moisture 13.0 -> no shrink)."
          setup_api_calls:
            - *d_clock_0901
            - *d_sched
            - *d_sched_pub
            - *d_elev
            - *d_farm
            - call: "POST /api/origination-contracts"
              payload: { farmer_id: "${d_farm_id}", elevator_id: "${d_elev_id}", contract_type: "CASH", quantity_bushels: 0.002, cash_price_cents_per_bushel: 500 }
              as: OriginationMerchandiser
              captures: { d_ctr_r_id: $.data.id }
            - call: "POST /api/delivery-tickets"
              payload: { contract_id: "${d_ctr_r_id}", gross_bushels: 0.001, moisture_pct: 13.0, damage_pct: 0, foreign_material_pct: 0 }
              as: OriginationMerchandiser
              captures: { d_tkt_r1: $.data.id }
            - call: "POST /api/delivery-tickets/${d_tkt_r1}/apply"
              payload: {}
              as: OriginationMerchandiser
            - call: "POST /api/delivery-tickets"
              payload: { contract_id: "${d_ctr_r_id}", gross_bushels: 0.001, moisture_pct: 13.0, damage_pct: 0, foreign_material_pct: 0 }
              as: OriginationMerchandiser
              captures: { d_tkt_r2: $.data.id }
            - call: "POST /api/delivery-tickets/${d_tkt_r2}/apply"
              payload: {}
              as: OriginationMerchandiser
          trigger:
            - call: "POST /api/origination-contracts/${d_ctr_r_id}/settle"
              payload: {}
              as: OriginationMerchandiser
          assert:
            - "OriginationContract.${d_ctr_r_id}.settlement_line_total_cents == 2 — round_half_up(0.001 x 500) = round_half_up(0.5) = 1 per ticket, summed to 2"
            - "OriginationContract.${d_ctr_r_id}.settlement_net_payable_cents == 2 (zero accrual on CASH)"
            - "the forbidden sum-then-round order would give round_half_up(0.002 x 500) = 1; observing 2 proves per-line-then-sum"
            - "OriginationContract.${d_ctr_r_id}.fulfillment_status == SETTLED"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine on DIFFERENT entities: parallel state
  # dimensions on OriginationContract vs branching fork on ProductSalesContract.
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: contract_parallel_pricing_and_fulfillment_dimensions
        grounds:
          - state_machines.OriginationContract.pricing_status
          - state_machines.OriginationContract.fulfillment_status
          - entities.OriginationContract.fields.pricing_status
          - entities.OriginationContract.fields.fulfillment_status
        distinguishing_aspect: |
          OriginationContract carries two INDEPENDENT state axes on one row: a ticket apply moves
          fulfillment OPEN->DELIVERING while pricing stays UNPRICED; a pricing election then moves
          pricing UNPRICED->PARTIALLY_PRICED while fulfillment stays DELIVERING — each dimension
          mutates without touching the other, which a single linear pipeline cannot express.
        test_recipe:
          setup:
            - "DEFERRED contract 2000 bu (deadline 2026-12-15, rate 1, futures 2026-12 quoted 1100); one 500-bu clean ticket applied; then an 800-bu pricing election."
          setup_api_calls:
            - *d_clock_0901
            - *d_sched
            - *d_sched_pub
            - *d_elev
            - *d_farm
            - call: "POST /api/market-quotes"
              payload: { commodity: "BEAN", quote_month: "2026-12", price_cents: 1100, quote_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/origination-contracts"
              payload: { farmer_id: "${d_farm_id}", elevator_id: "${d_elev_id}", contract_type: "DEFERRED", quantity_bushels: 2000, futures_month: "2026-12", pricing_deadline: "2026-12-15T00:00:00Z", storage_rate_cents_per_bushel_day: 1 }
              as: OriginationMerchandiser
              captures: { d_ctr_p_id: $.data.id }
            - call: "POST /api/delivery-tickets"
              payload: { contract_id: "${d_ctr_p_id}", gross_bushels: 500, moisture_pct: 13.0, damage_pct: 0, foreign_material_pct: 0 }
              as: OriginationMerchandiser
              captures: { d_tkt_p_id: $.data.id }
            - call: "POST /api/delivery-tickets/${d_tkt_p_id}/apply"
              payload: {}
              as: OriginationMerchandiser
            - call: "GET /api/origination-contracts/${d_ctr_p_id}"
              payload: {}
              as: OriginationMerchandiser
              captures: { d_ctr_p_v: $.data.version }
          trigger:
            - call: "POST /api/origination-contracts/${d_ctr_p_id}/pricing-elections"
              payload: { bushels: 800, expected_contract_version: "${d_ctr_p_v}" }
              as: OriginationMerchandiser
            - call: "GET /api/origination-contracts/${d_ctr_p_id}"
              payload: {}
              as: OriginationMerchandiser
          assert:
            - "after the apply: pricing_status == UNPRICED while fulfillment_status == DELIVERING (first axis moved, second untouched)"
            - "after the election: pricing_status == PARTIALLY_PRICED while fulfillment_status == DELIVERING (second axis moved, first untouched)"
            - "delivered_bushels == 500 and priced_bushels == 800 — the two counters are driven by different triggers and deliberately disagree"
      - name: sales_contract_branching_fulfilled_vs_defaulted
        grounds:
          - state_machines.ProductSalesContract
          - entities.ProductSalesContract.fields.claim_cents
          - calculations.default_claim_and_suspension
        distinguishing_aspect: |
          ProductSalesContract forks out of DELIVERING: a delivery reaching quantity_lbs takes the
          FULFILLED branch with no claim, while a clock sweep past delivery_window_end with a
          shortfall takes the DEFAULTED branch and materializes claim_cents — two divergent
          terminal branches with disjoint side-effect sets, on a different entity than Rule 3's
          first instance.
        test_recipe:
          setup:
            - "Buyer and plant; two identical SOY_OIL contracts A and B (1000 lbs at 20 cents, window 2026-09-15..2026-09-30, max_ffa 0.5)."
            - "Contract A receives one full 1000-lb delivery on 2026-09-20 (ffa 0.3, inside the window)."
          setup_api_calls:
            - *d_clock_0901
            - *d_plant
            - &d_buyer
              call: "POST /api/buyers"
              payload: { company_name: "Continental Oils Co" }
              as: PlatformAdmin
              captures: { d_buyer_id: $.data.id }
            - &d_sale_a
              call: "POST /api/product-sales-contracts"
              payload: { buyer_id: "${d_buyer_id}", plant_id: "${d_plant_id}", product: "SOY_OIL", quantity_lbs: 1000, price_cents_per_lb: 20, delivery_window_start: "2026-09-15T00:00:00Z", delivery_window_end: "2026-09-30T00:00:00Z", max_ffa_pct: 0.5 }
              as: ProductMerchandiser
              captures: { d_sale_a_id: $.data.id }
            - &d_sale_b
              call: "POST /api/product-sales-contracts"
              payload: { buyer_id: "${d_buyer_id}", plant_id: "${d_plant_id}", product: "SOY_OIL", quantity_lbs: 1000, price_cents_per_lb: 20, delivery_window_start: "2026-09-15T00:00:00Z", delivery_window_end: "2026-09-30T00:00:00Z", max_ffa_pct: 0.5 }
              as: ProductMerchandiser
              captures: { d_sale_b_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/product-sales-contracts/${d_sale_a_id}/deliver"
              payload: { delivery_date: "2026-09-20T00:00:00Z", quantity_lbs: 1000, actual_ffa_pct: 0.3 }
              as: ProductMerchandiser
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /api/product-sales-contracts/${d_sale_a_id}"
              payload: {}
              as: ProductMerchandiser
            - call: "GET /api/product-sales-contracts/${d_sale_b_id}"
              payload: {}
              as: ProductMerchandiser
          assert:
            - "ProductSalesContract.${d_sale_a_id}.status == FULFILLED with delivered_lbs == 1000 and claim_cents is null"
            - "ProductSalesContract.${d_sale_b_id}.status == DEFAULTED with delivered_lbs == 0"
            - "ProductSalesContract.${d_sale_b_id}.claim_cents == 2000 ((1000 - 0) x 20 x 0.10) — the DEFAULTED branch's unique side effect"
            - "Buyer.${d_buyer_id}.open_claims_count == 1 (only the DEFAULTED branch mutates the buyer)"

  # ===========================================================================
  # Rule 4 — transitive_cascade: depth >= 3 from a ticket apply vs depth >= 2
  # from the clock sweep — different triggering transitions.
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: ticket_apply_cascades_through_position_to_elevator_gate
        grounds:
          - state_machines.DeliveryTicket.RECEIVED_to_APPLIED
          - entities.StoragePosition
          - entities.Elevator.fields.stored_bushels
          - entities.Elevator.fields.receiving_open
        distinguishing_aspect: |
          Trigger: POST apply. Hop 1 mutates the contract's delivered pool; hop 2 (caused by the
          apply's grading, not the request directly) creates a StoragePosition; hop 3 the position
          creation recomputes Elevator.stored_bushels; hop 4 the stored mutation re-derives
          receiving_open to false at exactly capacity — observable as a rejection of the NEXT
          ticket create. Four caused hops ending in a behavioral gate.
        test_recipe:
          setup:
            - "Elevator capacity exactly 1000 bu; CASH contract for 1000 bu; one clean 1000-bu ticket."
          setup_api_calls:
            - *d_clock_0901
            - *d_sched
            - *d_sched_pub
            - call: "POST /api/elevators"
              payload: { name: "Tighthouse", region: "IA", storage_capacity_bushels: 1000, active_discount_schedule_id: "${d_sched_id}" }
              as: PlatformAdmin
              captures: { d_elev_c_id: $.data.id }
            - *d_farm
            - call: "POST /api/origination-contracts"
              payload: { farmer_id: "${d_farm_id}", elevator_id: "${d_elev_c_id}", contract_type: "CASH", quantity_bushels: 1000, cash_price_cents_per_bushel: 1000 }
              as: OriginationMerchandiser
              captures: { d_ctr_c_id: $.data.id }
            - call: "POST /api/delivery-tickets"
              payload: { contract_id: "${d_ctr_c_id}", gross_bushels: 1000, moisture_pct: 13.0, damage_pct: 0, foreign_material_pct: 0 }
              as: OriginationMerchandiser
              captures: { d_tkt_c_id: $.data.id }
            - call: "POST /api/origination-contracts"
              payload: { farmer_id: "${d_farm_id}", elevator_id: "${d_elev_c_id}", contract_type: "CASH", quantity_bushels: 10, cash_price_cents_per_bushel: 1000 }
              as: OriginationMerchandiser
              captures: { d_ctr_c2_id: $.data.id }
          trigger:
            - call: "POST /api/delivery-tickets/${d_tkt_c_id}/apply"
              payload: {}
              as: OriginationMerchandiser
            - call: "GET /api/storage-positions"
              payload: { elevator_id: "${d_elev_c_id}" }
              as: OriginationMerchandiser
              captures: { d_pos_cur: "$.data[0].current_bushels" }
            - call: "GET /api/elevators/${d_elev_c_id}"
              payload: {}
              as: OriginationMerchandiser
            - call: "POST /api/delivery-tickets"
              payload: { contract_id: "${d_ctr_c2_id}", gross_bushels: 1, moisture_pct: 13.0, damage_pct: 0, foreign_material_pct: 0 }
              as: OriginationMerchandiser
              captures: { d_gate_err: $.data.error_id }
          assert:
            - "StoragePosition created by the apply has current_bushels == 1000 (hop 2)"
            - "Elevator.${d_elev_c_id}.stored_bushels == 1000 (hop 3)"
            - "Elevator.${d_elev_c_id}.receiving_open == false (hop 4: 1000 >= 1000 capacity)"
            - "the next POST /api/delivery-tickets against that elevator fails with ERR_ELEVATOR_AT_CAPACITY (the cascade's terminal behavioral effect)"

      - name: clock_sweep_defaults_contract_suspends_buyer
        grounds:
          - state_machines.ProductSalesContract.DELIVERING_to_DEFAULTED
          - calculations.default_claim_and_suspension
          - state_machines.Buyer.ACTIVE_to_SUSPENDED
          - entities.Buyer.fields.open_claims_count
        distinguishing_aspect: |
          Trigger: POST /api/_clock/set_current_utc (a different trigger than instance 1). The sweep
          defaults three sales contracts; each default (hop 1) writes claim_cents and increments
          Buyer.open_claims_count (hop 2); the third increment crossing the threshold of 3 flips
          Buyer.status to SUSPENDED (hop 3), which then blocks new sales contracts — a cascade
          through two entities plus a threshold gate, caused link-by-link.
        test_recipe:
          setup:
            - "One buyer with three SOY_OIL contracts (1000 lbs at 20 cents each, windows all ending 2026-09-30), no deliveries."
          setup_api_calls:
            - *d_clock_0901
            - *d_plant
            - *d_buyer
            - *d_sale_a
            - *d_sale_b
            - call: "POST /api/product-sales-contracts"
              payload: { buyer_id: "${d_buyer_id}", plant_id: "${d_plant_id}", product: "SOY_OIL", quantity_lbs: 1000, price_cents_per_lb: 20, delivery_window_start: "2026-09-15T00:00:00Z", delivery_window_end: "2026-09-30T00:00:00Z", max_ffa_pct: 0.5 }
              as: ProductMerchandiser
              captures: { d_sale_c_id: $.data.id }
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /api/buyers/${d_buyer_id}"
              payload: {}
              as: ProductMerchandiser
            - call: "POST /api/product-sales-contracts"
              payload: { buyer_id: "${d_buyer_id}", plant_id: "${d_plant_id}", product: "SOY_OIL", quantity_lbs: 500, price_cents_per_lb: 20, delivery_window_start: "2026-10-05T00:00:00Z", delivery_window_end: "2026-10-20T00:00:00Z", max_ffa_pct: 0.5 }
              as: ProductMerchandiser
              captures: { d_susp_err: $.data.error_id }
          assert:
            - "all three contracts (${d_sale_a_id}, ${d_sale_b_id}, ${d_sale_c_id}) are DEFAULTED with claim_cents == 2000 each (hop 1)"
            - "Buyer.${d_buyer_id}.open_claims_count == 3 (hop 2)"
            - "Buyer.${d_buyer_id}.status == SUSPENDED (hop 3: count reached threshold 3)"
            - "a new POST /api/product-sales-contracts for this buyer fails with ERR_BUYER_NOT_ACTIVE (the cascade's terminal gate)"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict: (state vs business_constraint)
  # and (business_temporal vs business_fiscal) — two different category pairs.
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_constraint_on_settled_contract_election
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - errors.ERR_CONTRACT_NOT_PRICABLE
          - errors.ERR_PRICING_EXCEEDS_QUANTITY
        distinguishing_aspect: |
          Category pair state vs business_constraint: an election for 10 bu on a SETTLED contract
          violates both the pricing-state gate (already PRICED/SETTLED) and the quantity constraint
          (priced_bushels + 10 > quantity 100); priority 6 state beats priority 9 constraint, so
          the error must be ERR_CONTRACT_NOT_PRICABLE, never ERR_PRICING_EXCEEDS_QUANTITY.
        test_recipe:
          setup:
            - "DEFERRED contract for 100 bu, fully delivered, fully priced, and SETTLED (so 0 bushels remain pricable)."
          setup_api_calls:
            - *d_clock_0901
            - *d_sched
            - *d_sched_pub
            - *d_elev
            - *d_farm
            - call: "POST /api/market-quotes"
              payload: { commodity: "BEAN", quote_month: "2026-12", price_cents: 1100, quote_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/origination-contracts"
              payload: { farmer_id: "${d_farm_id}", elevator_id: "${d_elev_id}", contract_type: "DEFERRED", quantity_bushels: 100, futures_month: "2026-12", pricing_deadline: "2026-12-15T00:00:00Z", storage_rate_cents_per_bushel_day: 0 }
              as: OriginationMerchandiser
              captures: { d_ctr_s_id: $.data.id }
            - call: "POST /api/delivery-tickets"
              payload: { contract_id: "${d_ctr_s_id}", gross_bushels: 100, moisture_pct: 13.0, damage_pct: 0, foreign_material_pct: 0 }
              as: OriginationMerchandiser
              captures: { d_tkt_s_id: $.data.id }
            - call: "POST /api/delivery-tickets/${d_tkt_s_id}/apply"
              payload: {}
              as: OriginationMerchandiser
            - call: "GET /api/origination-contracts/${d_ctr_s_id}"
              payload: {}
              as: OriginationMerchandiser
              captures: { d_ctr_s_v0: $.data.version }
            - call: "POST /api/origination-contracts/${d_ctr_s_id}/pricing-elections"
              payload: { bushels: 100, expected_contract_version: "${d_ctr_s_v0}" }
              as: OriginationMerchandiser
            - call: "POST /api/origination-contracts/${d_ctr_s_id}/settle"
              payload: {}
              as: OriginationMerchandiser
            - call: "GET /api/origination-contracts/${d_ctr_s_id}"
              payload: {}
              as: OriginationMerchandiser
              captures: { d_ctr_s_v1: $.data.version }
          trigger:
            - call: "POST /api/origination-contracts/${d_ctr_s_id}/pricing-elections"
              payload: { bushels: 10, expected_contract_version: "${d_ctr_s_v1}" }
              as: OriginationMerchandiser
              captures: { d_prio_err: $.data.error_id }
          assert:
            - "the response is 409 with error_id ERR_CONTRACT_NOT_PRICABLE (state, priority 6)"
            - "the response is NOT ERR_PRICING_EXCEEDS_QUANTITY even though 100 + 10 > 100 also holds (constraint, priority 9)"
            - "OriginationContract.${d_ctr_s_id} remains SETTLED with priced_bushels == 100 (no mutation from the rejected election)"

      - name: temporal_beats_fiscal_on_past_dated_negative_margin_schedule
        grounds:
          - validations[priority=7]
          - validations[priority=12]
          - errors.ERR_RUN_DATE_IN_PAST
          - errors.ERR_NEGATIVE_CRUSH_MARGIN
        distinguishing_aspect: |
          Category pair business_temporal vs business_fiscal: scheduling a run whose run_date is
          in the past AND whose planned margin is negative violates both rules; priority 7 temporal
          beats priority 12 fiscal, so the error must be ERR_RUN_DATE_IN_PAST, never
          ERR_NEGATIVE_CRUSH_MARGIN.
        test_recipe:
          setup:
            - "Quotes BEAN/OIL/MEAL 2026-11 at 1500/55/17 -> spread 605 + 799 - 1500 = -96.00 -> planned margin -9600 on 100 bu."
            - "Run created (creation permits past dates) with run_date 2026-08-01 while the clock reads 2026-09-01."
          setup_api_calls:
            - *d_clock_0901
            - *d_plant
            - call: "POST /api/market-quotes"
              payload: { commodity: "BEAN", quote_month: "2026-11", price_cents: 1500, quote_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/market-quotes"
              payload: { commodity: "OIL", quote_month: "2026-11", price_cents: 55, quote_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/market-quotes"
              payload: { commodity: "MEAL", quote_month: "2026-11", price_cents: 17, quote_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/crush-runs"
              payload: { plant_id: "${d_plant_id}", run_date: "2026-08-01T00:00:00Z", planned_bushels: 100, futures_month: "2026-11" }
              as: PlantScheduler
              captures: { d_run_n_id: $.data.id, d_run_n_v: $.data.version }
          trigger:
            - call: "POST /api/crush-runs/${d_run_n_id}/schedule"
              payload: { expected_run_version: "${d_run_n_v}" }
              as: PlantScheduler
              captures: { d_prio2_err: $.data.error_id }
          assert:
            - "the response is 422 with error_id ERR_RUN_DATE_IN_PAST (business_temporal, priority 7)"
            - "the response is NOT ERR_NEGATIVE_CRUSH_MARGIN even though planned_margin_cents == -9600 also holds (business_fiscal, priority 12)"
            - "CrushRun.${d_run_n_id}.status remains PLANNED"

  # ===========================================================================
  # Rule 6 — boundary_precision_check: exact-fill bushel capacity (ticket apply
  # endpoint) vs zero crossing of a price signal (carry-assessment endpoint) —
  # different metrics, different endpoints.
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: elevator_capacity_exact_fill_then_gate
        grounds:
          - entities.Elevator.fields.receiving_open
          - state_machines.DeliveryTicket.RECEIVED_to_APPLIED
          - errors.ERR_ELEVATOR_AT_CAPACITY
          - validations[priority=10]
        distinguishing_aspect: |
          Bushel-capacity metric on POST apply / POST create: stored 999.999 keeps the gate open
          (999.999 < 1000), and applying the exact 0.001-bu remainder lands stored_bushels ==
          capacity 1000 — accepted because the check is stored + net <= capacity with equality
          allowed — and only THEN does receiving_open flip false. The boundary sits exactly at ==.
        test_recipe:
          setup:
            - "Elevator capacity 1000 bu; CASH contract for 1000 bu; ticket A gross 999.999; ticket B gross 0.001 (both clean, moisture 13.0)."
          setup_api_calls:
            - *d_clock_0901
            - *d_sched
            - *d_sched_pub
            - call: "POST /api/elevators"
              payload: { name: "Edgecase", region: "MO", storage_capacity_bushels: 1000, active_discount_schedule_id: "${d_sched_id}" }
              as: PlatformAdmin
              captures: { d_elev_b_id: $.data.id }
            - *d_farm
            - call: "POST /api/origination-contracts"
              payload: { farmer_id: "${d_farm_id}", elevator_id: "${d_elev_b_id}", contract_type: "CASH", quantity_bushels: 1000, cash_price_cents_per_bushel: 1000 }
              as: OriginationMerchandiser
              captures: { d_ctr_b_id: $.data.id }
            - call: "POST /api/delivery-tickets"
              payload: { contract_id: "${d_ctr_b_id}", gross_bushels: 999.999, moisture_pct: 13.0, damage_pct: 0, foreign_material_pct: 0 }
              as: OriginationMerchandiser
              captures: { d_tkt_b1: $.data.id }
            - call: "POST /api/delivery-tickets"
              payload: { contract_id: "${d_ctr_b_id}", gross_bushels: 0.001, moisture_pct: 13.0, damage_pct: 0, foreign_material_pct: 0 }
              as: OriginationMerchandiser
              captures: { d_tkt_b2: $.data.id }
          trigger:
            - call: "POST /api/delivery-tickets/${d_tkt_b1}/apply"
              payload: {}
              as: OriginationMerchandiser
            - call: "GET /api/elevators/${d_elev_b_id}"
              payload: {}
              as: OriginationMerchandiser
              captures: { d_gate_mid: $.data.receiving_open }
            - call: "POST /api/delivery-tickets/${d_tkt_b2}/apply"
              payload: {}
              as: OriginationMerchandiser
            - call: "GET /api/elevators/${d_elev_b_id}"
              payload: {}
              as: OriginationMerchandiser
          assert:
            - "ticket A applies successfully: status APPLIED, net 999.999"
            - "after A: Elevator.${d_elev_b_id}.stored_bushels == 999.999 and receiving_open == true (strictly below capacity keeps the gate open)"
            - "ticket B applies successfully: the exact 0.001 remainder is accepted (stored + net == capacity is allowed, not rejected)"
            - "after B: stored_bushels == 1000 and receiving_open == false (gate flips at exact equality)"
            - "OriginationContract.${d_ctr_b_id}.fulfillment_status == DELIVERED (delivered == quantity == 1000)"

      - name: carry_signal_zero_is_flat_not_carry
        grounds:
          - calculations.carry_assessment
          - endpoints.GET_/api/elevators/{id}/carry-assessment
        distinguishing_aspect: |
          Price-signal metric on GET carry-assessment: a signal of exactly 0 cents/bu (deferred
          premium 10 exactly covers the 2-month storage cost of 10) yields decision FLAT because
          the rule is signal > 0; only when the deferred quote rises one cent to 1211 does the
          signal become 1 and the decision CARRY. The boundary sits at strict-greater-than zero.
        test_recipe:
          setup:
            - "Elevator with bushels in store; BEAN futures 2026-11 = 1200 and 2027-01 = 1210 as-of 2026-09-01 (2 months apart x 5 cents = 10 cost; signal 10 - 10 = 0)."
            - "A second 2027-01 quote of 1211 lands as-of 2026-09-02 (signal 11 - 10 = 1)."
          setup_api_calls:
            - *d_clock_0901
            - *d_sched
            - *d_sched_pub
            - *d_elev
            - call: "POST /api/market-quotes"
              payload: { commodity: "BEAN", quote_month: "2026-11", price_cents: 1200, quote_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/market-quotes"
              payload: { commodity: "BEAN", quote_month: "2027-01", price_cents: 1210, quote_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/elevators/${d_elev_id}/carry-assessment"
              payload: { nearby_month: "2026-11", deferred_month: "2027-01" }
              as: CrushTrader
              captures: { d_sig0: $.data.signal_cents_per_bushel, d_dec0: $.data.decision }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/market-quotes"
              payload: { commodity: "BEAN", quote_month: "2027-01", price_cents: 1211, quote_date: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /api/elevators/${d_elev_id}/carry-assessment"
              payload: { nearby_month: "2026-11", deferred_month: "2027-01" }
              as: CrushTrader
              captures: { d_sig1: $.data.signal_cents_per_bushel, d_dec1: $.data.decision }
          assert:
            - "first read: signal_cents_per_bushel == 0 (1210 - 1200 - 2 months x 5) and decision == FLAT — exactly zero does NOT pay for storage"
            - "second read: signal_cents_per_bushel == 1 and decision == CARRY (one cent above breakeven flips the decision)"
            - "first read storage_cost_cents_per_bushel == 10 with nearby_price_cents == 1200 and deferred_price_cents == 1210"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency: CrushRun x CrushPlant vs
  # OriginationContract x SustainabilityProgram — different entity pairs.
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: run_schedule_requires_plant_active
        grounds:
          - state_machines.CrushRun.PLANNED_to_SCHEDULED
          - entities.CrushPlant.fields.status
          - errors.ERR_PLANT_NOT_ACTIVE
        distinguishing_aspect: |
          Entity pair CrushRun -> CrushPlant: the run's PLANNED->SCHEDULED transition is gated by
          a DIFFERENT entity's state — a plant in MAINTENANCE rejects scheduling with
          ERR_PLANT_NOT_ACTIVE even though the run itself is in the correct from-state with a
          positive margin.
        test_recipe:
          setup:
            - "Plant created directly in MAINTENANCE; quotes 1200/55/17 give a healthy +204.00 spread; run PLANNED for 2026-09-10."
          setup_api_calls:
            - *d_clock_0901
            - call: "POST /api/crush-plants"
              payload: { name: "Mothballed", daily_crush_capacity_bushels: 50000, daily_refinery_capacity_lbs: 1000000, biodiesel_feedstock_share_pct: 10, status: "MAINTENANCE" }
              as: PlatformAdmin
              captures: { d_plant_m_id: $.data.id }
            - call: "POST /api/market-quotes"
              payload: { commodity: "BEAN", quote_month: "2026-11", price_cents: 1200, quote_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/market-quotes"
              payload: { commodity: "OIL", quote_month: "2026-11", price_cents: 55, quote_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/market-quotes"
              payload: { commodity: "MEAL", quote_month: "2026-11", price_cents: 17, quote_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/crush-runs"
              payload: { plant_id: "${d_plant_m_id}", run_date: "2026-09-10T00:00:00Z", planned_bushels: 1000, futures_month: "2026-11" }
              as: PlantScheduler
              captures: { d_run_m_id: $.data.id, d_run_m_v: $.data.version }
          trigger:
            - call: "POST /api/crush-runs/${d_run_m_id}/schedule"
              payload: { expected_run_version: "${d_run_m_v}" }
              as: PlantScheduler
              captures: { d_xerr1: $.data.error_id }
          assert:
            - "the schedule call fails 422 with error_id ERR_PLANT_NOT_ACTIVE — the plant's state, not the run's, blocks the transition"
            - "CrushRun.${d_run_m_id}.status remains PLANNED and planned_margin_cents == 204000 (margin was fine; the gate is purely cross-entity)"

      - name: contract_create_requires_program_active
        grounds:
          - state_machines.SustainabilityProgram.ACTIVE_to_CLOSED
          - entities.OriginationContract.fields.program_id
          - errors.ERR_PROGRAM_CLOSED
        distinguishing_aspect: |
          Entity pair OriginationContract -> SustainabilityProgram: contract creation is gated by
          the referenced program's state — closing the program flips an otherwise identical create
          from 201 to ERR_PROGRAM_CLOSED. Different pair than CrushRun x CrushPlant.
        test_recipe:
          setup:
            - "Elevator, farmer, and an ISCC program with a 25-cent premium; the auditor closes the program before the second create."
          setup_api_calls:
            - *d_clock_0901
            - *d_sched
            - *d_sched_pub
            - *d_elev
            - *d_farm
            - &d_prog
              call: "POST /api/sustainability-programs"
              payload: { name: "Regen Prairies", cert_standard: "REGEN", premium_cents_per_bushel: 25 }
              as: PlatformAdmin
              captures: { d_prog_id: $.data.id }
            - call: "POST /api/origination-contracts"
              payload: { farmer_id: "${d_farm_id}", elevator_id: "${d_elev_id}", program_id: "${d_prog_id}", contract_type: "CASH", quantity_bushels: 100, cash_price_cents_per_bushel: 1000 }
              as: OriginationMerchandiser
              captures: { d_ctr_ok_id: $.data.id }
            - call: "POST /api/sustainability-programs/${d_prog_id}/close"
              payload: {}
              as: SustainabilityAuditor
          trigger:
            - call: "POST /api/origination-contracts"
              payload: { farmer_id: "${d_farm_id}", elevator_id: "${d_elev_id}", program_id: "${d_prog_id}", contract_type: "CASH", quantity_bushels: 100, cash_price_cents_per_bushel: 1000 }
              as: OriginationMerchandiser
              captures: { d_xerr2: $.data.error_id }
          assert:
            - "the first create (program ACTIVE) returns 201 with program_id set"
            - "the second create (program CLOSED) fails 422 with error_id ERR_PROGRAM_CLOSED"
            - "OriginationContract.${d_ctr_ok_id} is unaffected: still OPEN with its certified enrollment intact"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap: aggregate-per-day capacity on CrushPlant
  # vs half-open interval occupancy on a BARGE FreightLane — different resources,
  # different interval semantics.
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: plant_daily_aggregate_capacity
        grounds:
          - state_machines.CrushRun.PLANNED_to_SCHEDULED
          - entities.CrushPlant.fields.daily_crush_capacity_bushels
          - errors.ERR_PLANT_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          Resource CrushPlant, aggregate-capacity semantics: scheduling sums planned_bushels over
          the plant's {SCHEDULED, RUNNING, COMPLETE} runs sharing a calendar run_date and rejects
          the schedule that would push the aggregate above daily_crush_capacity_bushels; runs on
          adjacent dates never interact, however close. 30000 + 30000 over a 50000 cap fails on
          one day and succeeds on the next.
        test_recipe:
          setup:
            - "ACTIVE plant, daily crush capacity 50000; quotes 1200/55/17 (positive margin); three runs of 30000 bu each."
          setup_api_calls:
            - *d_clock_0901
            - *d_plant
            - call: "POST /api/market-quotes"
              payload: { commodity: "BEAN", quote_month: "2026-11", price_cents: 1200, quote_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/market-quotes"
              payload: { commodity: "OIL", quote_month: "2026-11", price_cents: 55, quote_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/market-quotes"
              payload: { commodity: "MEAL", quote_month: "2026-11", price_cents: 17, quote_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/crush-runs"
              payload: { plant_id: "${d_plant_id}", run_date: "2026-09-10T00:00:00Z", planned_bushels: 30000, futures_month: "2026-11" }
              as: PlantScheduler
              captures: { d_run_a_id: $.data.id, d_run_a_v: $.data.version }
            - call: "POST /api/crush-runs"
              payload: { plant_id: "${d_plant_id}", run_date: "2026-09-10T00:00:00Z", planned_bushels: 30000, futures_month: "2026-11" }
              as: PlantScheduler
              captures: { d_run_b_id: $.data.id, d_run_b_v: $.data.version }
            - call: "POST /api/crush-runs"
              payload: { plant_id: "${d_plant_id}", run_date: "2026-09-11T00:00:00Z", planned_bushels: 30000, futures_month: "2026-11" }
              as: PlantScheduler
              captures: { d_run_c_id: $.data.id, d_run_c_v: $.data.version }
          trigger:
            - call: "POST /api/crush-runs/${d_run_a_id}/schedule"
              payload: { expected_run_version: "${d_run_a_v}" }
              as: PlantScheduler
            - call: "POST /api/crush-runs/${d_run_b_id}/schedule"
              payload: { expected_run_version: "${d_run_b_v}" }
              as: PlantScheduler
              captures: { d_cap_err: $.data.error_id }
            - call: "POST /api/crush-runs/${d_run_c_id}/schedule"
              payload: { expected_run_version: "${d_run_c_v}" }
              as: PlantScheduler
          assert:
            - "run A schedules: 30000 <= 50000 aggregate on 2026-09-10"
            - "run B is rejected ERR_PLANT_CAPACITY_EXCEEDED: 30000 + 30000 = 60000 > 50000 on the SAME date"
            - "run C schedules on 2026-09-11: adjacent-day intervals do not interact under aggregate-per-day semantics"
            - "CrushRun.${d_run_b_id}.status remains PLANNED"

      - name: barge_lane_half_open_interval_overlap
        grounds:
          - entities.FreightLane.fields.mode
          - state_machines.Shipment
          - errors.ERR_BARGE_SCHEDULE_OVERLAP
          - validations[priority=10]
        distinguishing_aspect: |
          Resource FreightLane (BARGE mode), half-open interval semantics: each BOOKED barge
          shipment occupies [departure_date, arrival_date); a second barge departing inside that
          window is rejected, yet one departing exactly at the first's arrival is accepted
          (back-to-back allowed) — and the lane's daily_capacity_bushels is ignored entirely for
          BARGE, unlike the aggregate semantics of Rule 8's first instance.
        test_recipe:
          setup:
            - "Elevator holding 20000 bu; BARGE lane to the plant, transit 5 days, daily_capacity 1 (ignored for barges)."
            - "Shipment 1: 5000 bu departing 2026-09-10 -> occupies [09-10, 09-15)."
          setup_api_calls:
            - *d_clock_0901
            - *d_sched
            - *d_sched_pub
            - *d_elev
            - *d_farm
            - *d_plant
            - call: "POST /api/origination-contracts"
              payload: { farmer_id: "${d_farm_id}", elevator_id: "${d_elev_id}", contract_type: "CASH", quantity_bushels: 20000, cash_price_cents_per_bushel: 1000 }
              as: OriginationMerchandiser
              captures: { d_ctr_bg_id: $.data.id }
            - call: "POST /api/delivery-tickets"
              payload: { contract_id: "${d_ctr_bg_id}", gross_bushels: 20000, moisture_pct: 13.0, damage_pct: 0, foreign_material_pct: 0 }
              as: OriginationMerchandiser
              captures: { d_tkt_bg_id: $.data.id }
            - call: "POST /api/delivery-tickets/${d_tkt_bg_id}/apply"
              payload: {}
              as: OriginationMerchandiser
            - call: "POST /api/freight-lanes"
              payload: { origin_elevator_id: "${d_elev_id}", destination_plant_id: "${d_plant_id}", mode: "BARGE", freight_cents_per_bushel: 8, transit_days: 5, daily_capacity_bushels: 1 }
              as: LogisticsCoordinator
              captures: { d_lane_bg_id: $.data.id }
            - call: "POST /api/shipments"
              payload: { lane_id: "${d_lane_bg_id}", bushels: 5000, departure_date: "2026-09-10T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { d_ship_bg1: $.data.id }
          trigger:
            - call: "POST /api/shipments"
              payload: { lane_id: "${d_lane_bg_id}", bushels: 5000, departure_date: "2026-09-14T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { d_ov_err: $.data.error_id }
            - call: "POST /api/shipments"
              payload: { lane_id: "${d_lane_bg_id}", bushels: 5000, departure_date: "2026-09-15T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { d_ship_bg2: $.data.id }
          assert:
            - "shipment 1 books 201 even though 5000 bu >> daily_capacity_bushels 1 — BARGE ignores the per-day aggregate"
            - "shipment 2 (depart 2026-09-14, inside [09-10, 09-15)) fails 409 ERR_BARGE_SCHEDULE_OVERLAP"
            - "shipment 3 (depart 2026-09-15, exactly shipment 1's arrival) books 201 — half-open adjacency is allowed"
            - "Shipment.${d_ship_bg1}.arrival_date == 2026-09-15T00:00:00Z (departure + 5 transit days)"

  # ===========================================================================
  # Rule 9 — compensating_invariant: physical bushel mass across book/deliver/
  # cancel vs monetary cents across accrue/settle — different conserved quantities.
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: bushel_mass_conserved_across_book_deliver_cancel
        grounds:
          - state_machines.Shipment.BOOKED_to_DELIVERED
          - state_machines.Shipment.BOOKED_to_CANCELLED
          - entities.Elevator.fields.stored_bushels
          - entities.CrushPlant.fields.bean_inventory_bushels
        distinguishing_aspect: |
          Conserved quantity: physical bushels. Invariant: elevator.stored_bushels + plant.bean_
          inventory_bushels + in-transit booked bushels == total applied net bushels, at every step.
          Booking moves 2000 into transit, delivery moves exactly those 2000 into the plant, and
          cancelling a second 1000-bu booking restores the origin lot bushel-for-bushel — the
          forward book and its compensating cancel leave stored_bushels exactly unchanged.
        test_recipe:
          setup:
            - "Elevator with one 5000-bu applied lot (stored 5000); TRUCK lane (freight 12, transit 2) to the plant."
          setup_api_calls:
            - *d_clock_0901
            - *d_sched
            - *d_sched_pub
            - *d_elev
            - *d_farm
            - *d_plant
            - call: "POST /api/origination-contracts"
              payload: { farmer_id: "${d_farm_id}", elevator_id: "${d_elev_id}", contract_type: "CASH", quantity_bushels: 5000, cash_price_cents_per_bushel: 1000 }
              as: OriginationMerchandiser
              captures: { d_ctr_m_id: $.data.id }
            - call: "POST /api/delivery-tickets"
              payload: { contract_id: "${d_ctr_m_id}", gross_bushels: 5000, moisture_pct: 13.0, damage_pct: 0, foreign_material_pct: 0 }
              as: OriginationMerchandiser
              captures: { d_tkt_m_id: $.data.id }
            - call: "POST /api/delivery-tickets/${d_tkt_m_id}/apply"
              payload: {}
              as: OriginationMerchandiser
            - *d_lane
            - call: "POST /api/shipments"
              payload: { lane_id: "${d_lane_id}", bushels: 2000, departure_date: "2026-09-10T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { d_ship_a_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/shipments/${d_ship_a_id}/deliver"
              payload: {}
              as: LogisticsCoordinator
          trigger:
            - call: "POST /api/shipments"
              payload: { lane_id: "${d_lane_id}", bushels: 1000, departure_date: "2026-09-13T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { d_ship_b_id: $.data.id }
            - call: "GET /api/elevators/${d_elev_id}"
              payload: {}
              as: LogisticsCoordinator
              captures: { d_stored_mid: $.data.stored_bushels }
            - call: "POST /api/shipments/${d_ship_b_id}/cancel"
              payload: {}
              as: LogisticsCoordinator
            - call: "GET /api/elevators/${d_elev_id}"
              payload: {}
              as: LogisticsCoordinator
            - call: "GET /api/crush-plants/${d_plant_id}"
              payload: {}
              as: LogisticsCoordinator
            - call: "GET /api/storage-positions"
              payload: { elevator_id: "${d_elev_id}" }
              as: LogisticsCoordinator
          assert:
            - "after delivering shipment A: stored_bushels == 3000 and plant.bean_inventory_bushels == 2000 (3000 + 2000 == 5000 applied)"
            - "after booking shipment B: stored_bushels == 2000 (2000 in plant + 1000 in transit + 2000 stored == 5000)"
            - "after cancelling B: stored_bushels == 3000 — exactly the pre-booking value; the book/cancel pair conserves bushel mass with zero drift"
            - "the source StoragePosition.current_bushels is restored to 3000 and its status is OPEN"
            - "plant.bean_inventory_bushels == 2000 still (cancellation never touches delivered bushels)"

      - name: settlement_money_conserved_lines_minus_accrual
        grounds:
          - calculations.contract_settlement
          - calculations.dp_storage_accrual
          - entities.OriginationContract.fields.settlement_net_payable_cents
        distinguishing_aspect: |
          Conserved quantity: monetary cents. Invariant: settlement_line_total_cents
          - settlement_accrual_deduction_cents - settlement_net_payable_cents == 0 — the accrual
          is moved out of the payable, never created or destroyed; and once frozen at settle, a
          later clock advance leaves accrued_storage_cents exactly unchanged (no drift after the
          accrual's compensating cutoff at pricing).
        test_recipe:
          setup:
            - "Same DEFERRED fixture as the settlement dual-variant instance: 1000 bu, rate 2 cents/bu/day, delivered 2026-09-10, priced 2026-09-20 at 1250."
          setup_api_calls:
            - *d_clock_0901
            - *d_sched
            - *d_sched_pub
            - *d_elev
            - *d_farm
            - *d_q_beans_1200
            - *d_ctr_def
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - *d_tkt
            - call: "POST /api/delivery-tickets/${d_tkt_id}/apply"
              payload: {}
              as: OriginationMerchandiser
            - call: "GET /api/origination-contracts/${d_ctr_id}"
              payload: {}
              as: OriginationMerchandiser
              captures: { d_cv_m: $.data.version }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/market-quotes"
              payload: { commodity: "BEAN", quote_month: "2026-12", price_cents: 1250, quote_date: "2026-09-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/origination-contracts/${d_ctr_id}/pricing-elections"
              payload: { bushels: 1000, expected_contract_version: "${d_cv_m}" }
              as: OriginationMerchandiser
          trigger:
            - call: "POST /api/origination-contracts/${d_ctr_id}/settle"
              payload: {}
              as: OriginationMerchandiser
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-25T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /api/origination-contracts/${d_ctr_id}"
              payload: {}
              as: OriginationMerchandiser
          assert:
            - "settlement_line_total_cents == 1250000 and settlement_accrual_deduction_cents == 20000 and settlement_net_payable_cents == 1230000"
            - "1250000 - 20000 - 1230000 == 0 — the accrual is exactly the amount moved out of the payable; nothing created, nothing lost"
            - "after the clock advances to 2026-09-25: accrued_storage_cents is still 20000 (the pricing election stopped the meter; the forward accrual and its cutoff compensation net to zero drift)"
