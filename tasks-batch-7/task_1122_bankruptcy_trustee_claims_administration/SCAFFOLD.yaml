    roles: [Trustee]
    code: 201
    input: []
    output: DistributionPlan
    side_effects: ["reserve_for_objected_cents computed", "distributable_cents computed"]

  - method: GET
    path: "/trustee/cases/{id}/plans"
    description: "List distribution plans of a case"
    roles: [Trustee, Clerk, Court, Creditor]
    code: 200
    input: ["status?"]
    output: "DistributionPlan[]"
    side_effects: []

  - method: GET
    path: "/trustee/plans/{id}"
    description: "Get a distribution plan"
    roles: [Trustee, Clerk, Court, Creditor]
    code: 200
    input: []
    output: DistributionPlan
    side_effects: []

  - method: POST
    path: "/trustee/plans/{id}/confirm"
