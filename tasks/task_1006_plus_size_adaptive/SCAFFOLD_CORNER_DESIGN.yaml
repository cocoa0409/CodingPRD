              captures: { ship_id: $.data.id }
          assert:
            - "response.status == 201"
            - "BoxShipment.${ship_id}.status == CURATED"

  # ===========================================================================
  - section: cross_cutting
    instances:
      - name: occ_stale_subscription_version_on_curate_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[shipment-create-stale-subscription]
          - entities.BoxSubscription.fields.version
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Curating a shipment with expected_subscription_version equal to the pre-pause version (now stale after a status change bumped it) is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A subscription created at version 1, then PAUSED (version advanced to 2); the client still holds version 1."]
          setup_api_calls:
            - call: "POST /customers/register"
              payload: { email: "cc1@x.com", full_name: "CC One", size_code: 24 }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Everyday Tee", category: "TOPS", base_price_cents: 6805, size_min: 10, size_max: 34 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_code: 24, color: "Navy", inventory_on_hand: 20 }
              as: StoreManager
              captures: { vb1: $.data.id }
            - call: "POST /box-subscriptions"
              payload: { plan_tier: "SIGNATURE" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id, sub_ver: $.data.version }
            - call: "POST /box-subscriptions/${sub_id}/status"
              payload: { to_status: "PAUSED" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /box-subscriptions/${sub_id}/shipments"
              payload: { expected_subscription_version: "${sub_ver}", item_variant_ids: ["${vb1}"] }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_VERSION"
            - "response.status == 412"

      - name: subscription_status_change_increments_version
        claim_type: optimistic_concurrency
        grounds:
          - entities.BoxSubscription.fields.version
          - state_machines.BoxSubscription.ACTIVE_to_PAUSED
        distinguishing_aspect: "A PAUSE status change increments BoxSubscription.version from 1 to 2 (version advances on every mutation)."
        test_recipe:
          setup: ["A newly created ACTIVE subscription at version 1."]
          setup_api_calls:
            - call: "POST /customers/register"
              payload: { email: "cc2@x.com", full_name: "CC Two", size_code: 24 }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /box-subscriptions"
              payload: { plan_tier: "ESSENTIALS" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /box-subscriptions/${sub_id}/status"
              payload: { to_status: "PAUSED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ver: $.data.version }
          assert:
            - "BoxSubscription.${sub_id}.version == 2"
            - "BoxSubscription.${sub_id}.status == PAUSED"

      - name: box_curation_reserves_inventory
        claim_type: derived_field_reconciliation
        grounds:
          - state_machines.BoxShipment.CURATED_to_SHIPPED
          - entities.ProductVariant.fields.inventory_reserved
        distinguishing_aspect: "Curating a box holding one unit of vb1 raises that variant's inventory_reserved from 0 to 1 (reservation before shipment)."
        test_recipe:
          setup: ["A variant with inventory_on_hand 20 and an ACTIVE subscription."]
          setup_api_calls:
            - call: "POST /customers/register"
              payload: { email: "cc3@x.com", full_name: "CC Three", size_code: 24 }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Everyday Tee", category: "TOPS", base_price_cents: 6805, size_min: 10, size_max: 34 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_code: 24, color: "Navy", inventory_on_hand: 20 }
              as: StoreManager
              captures: { vb1: $.data.id }
            - call: "POST /box-subscriptions"
              payload: { plan_tier: "ESSENTIALS" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id, sub_ver: $.data.version }
          trigger:
            - call: "POST /box-subscriptions/${sub_id}/shipments"
              payload: { expected_subscription_version: "${sub_ver}", item_variant_ids: ["${vb1}"] }
              as: StoreManager
          assert:
            - "ProductVariant.${vb1}.inventory_reserved == 1"
            - "ProductVariant.${vb1}.inventory_available == 19"

  # ===========================================================================
  # excluded_because stubs — corners already exercised by a §1.8 instance
  # ===========================================================================
  - section: calculations
    instances:
      - name: box_provisional_charge_pinned_on_ship
        claim_type: Variant Selection
        grounds:
          - calculations.box_charge
          - entities.BoxShipment.fields.provisional_charge_cents
        excluded_because:
          difficulty_instance: dual_variant_calc / box_provisional_vs_final_charge
          rationale: "The SHIP-time provisional charge (20415) is asserted as part of the named §1.8 dual-variant instance."

      - name: order_total_redemption_cap_applied
        claim_type: Constants Applied
        grounds:
          - calculations.order_total
          - entities.Order.fields.loyalty_redeemed_cents
        excluded_because:
          difficulty_instance: combinatorial_formula / order_total_nonlinear_min_stack
          rationale: "REDEEM_CAP_PCT / REDEEM_VALUE_CENTS_PER_POINT interaction is asserted by the named §1.8 order-total instance."

  - section: consistency_model
    instances:
      - name: inventory_release_on_cancel_immediate
        claim_type: immediate
        grounds:
          - calculations.inventory_availability
          - state_machines.Order.UNFULFILLED_to_CANCELLED
        excluded_because:
          difficulty_instance: compensating_invariant / order_cancel_restores_inventory_reserved
          rationale: "Immediate visibility of the reservation release is asserted by the named §1.8 compensating-invariant instance."
