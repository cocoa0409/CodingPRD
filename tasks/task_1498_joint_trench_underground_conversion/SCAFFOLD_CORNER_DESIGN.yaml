        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Missing X-User-Role header yields 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["empty DB; request sent with no X-User-Role header"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/projects", payload: {}, as: "__no_role_header__", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_UNAUTHENTICATED (401)"
      - name: wrong_role_create_project_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "ConversionContractor may not create projects — ERR_FORBIDDEN 403."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/projects", payload: { name: "X", rule20_credit_cents: 0, estimated_total_cost_cents: 1000, target_cutover_on: "2026-12-31T00:00:00Z" }, as: ConversionContractor, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_FORBIDDEN"
