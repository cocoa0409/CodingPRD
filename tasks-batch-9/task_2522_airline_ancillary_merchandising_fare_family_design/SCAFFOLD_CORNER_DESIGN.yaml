# =============================================================================
# 1.9 Scaffold Corner Design (Breadth Probe)
# Task 2522 - Airline Ancillary Merchandising & Fare Family Design
#
# Walked row-by-row against references/claim-extraction-guide.md's nine
# sections. Every `section:` is one of the guide's nine sections and every
# `claim_type:` is one of that section's table rows - nothing invented.
#
# Shared fixture conventions (identical to SCAFFOLD_DIFFICULTY_DESIGN.yaml):
#   - the logical clock starts at 2026-08-01T00:00:00Z per
#     endpoints[POST /_clock/set_current_utc] and is only moved when a window
#     or an expiry sweep matters
#   - opaque operator ids: ma-001 (MerchandisingAnalyst), pa-001
#     (PricingApprover), dm-001 (DistributionManager), oc-001
#     (OperationsController), ra-001 (RevenueAccountant)
#   - the ChannelPartner X-User-ID is always the DistributionChannel.id it
#     sells for (roles.ChannelPartner.identity == entity_backed:DistributionChannel),
#     so `as_user_id: "${ch_*_id}"` throughout
#   - ma-001 designs every family and pa-001 reviews it, so
#     validations.priority_7 (segregation of duties) passes unless the instance
#     is specifically probing it
#   - every numeric literal in `assert:` was produced by executing the pinned
#     1.3 formulas with exact integer / Fraction arithmetic and round-half-up
#
# Canonical "ticket chain" reused by several instances below (13 calls from an
# empty DB): product -> family -> attribute -> submit -> approve -> channel ->
# publication -> flight -> booking -> disclosure -> disclosure-ack -> ticket.
# With ECONOMY base_fare 12000 / bundle 14000 and one INCLUDED BAG_CHECKED_1
# (3500) attribute it pins fare_component_cents 14000 and the
# ancillary_revenue_split rows BAGGAGE 3161/126/3035 and
# AIR_TRANSPORT 10839/813/10026.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: create_ancillary_product_returns_201_with_every_declared_field
        claim_type: creation
        grounds:
          - endpoints[POST /ancillary-products]
          - entities.AncillaryProduct.fields.sku
          - entities.AncillaryProduct.fields.category
          - entities.AncillaryProduct.fields.list_price_cents
          - entities.AncillaryProduct.fields.tax_treatment
          - entities.AncillaryProduct.fields.revenue_class
          - entities.AncillaryProduct.fields.revenue_account_code
          - response_envelope.success
        distinguishing_aspect: "A single POST with all seven required inputs answers 201 and the envelope's data carries every declared AncillaryProduct field, including the server-minted id and version 1."
        test_recipe:
          setup:
            - "empty database; the logical clock still reads its default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
          trigger:
            - call: "POST /ancillary-products"
              payload: { sku: "BAG_CHECKED_1", name: "First checked bag", category: "BAGGAGE", list_price_cents: 3500, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4100", refundable: false, disclosable_fee: true, product_state: "ACTIVE" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_bag_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "AncillaryProduct.sku == \"BAG_CHECKED_1\" and AncillaryProduct.category == \"BAGGAGE\""
            - "AncillaryProduct.list_price_cents == 3500, tax_treatment == \"TAXABLE_SERVICE\", revenue_class == \"NON_AIR\", revenue_account_code == \"4100\""
            - "AncillaryProduct.id is a non-empty server-minted string and AncillaryProduct.version == 1"
            - "response meta carries api_request_id and api_request_timestamp and response_type == \"object\""

      - name: retrieve_fare_family_returns_stored_valuation_fields
        claim_type: retrieval
        grounds:
          - endpoints[GET /fare-families/{id}]
          - entities.FareFamily.fields.unbundled_value_cents
          - entities.FareFamily.fields.a_la_carte_total_cents
          - entities.FareFamily.fields.bundle_discount_bp
          - entities.FareFamily.fields.fee_fingerprint
          - calculations.fare_family_bundle_valuation
        distinguishing_aspect: "A GET by id returns the same computed valuation triple (3500 / 15500 / 968) and fee_fingerprint that the attribute-creation response persisted - the read is not recomputed differently from the write."
        test_recipe:
          setup:
            - "catalog holds BAG_CHECKED_1 at list_price_cents 3500"
            - "DRAFT family ECO_LITE (ECONOMY, base_fare 12000, bundle 14000) carries one ACTIVE INCLUDED attribute for BAG_CHECKED_1 quantity 1 at list price"
          setup_api_calls:
            - call: "POST /ancillary-products"
              payload: { sku: "BAG_CHECKED_1", name: "First checked bag", category: "BAGGAGE", list_price_cents: 3500, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4100", refundable: false, disclosable_fee: true, product_state: "ACTIVE" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_bag_id: $.data.id }
            - call: "POST /fare-families"
              payload: { code: "ECO_LITE", name: "Economy Lite", cabin_class: "ECONOMY", base_fare_cents: 12000, bundle_price_cents: 14000, refundability: "NON_REFUNDABLE", change_fee_cents: 7500, boarding_priority_tier: 4 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { f_lite_id: $.data.id }
            - call: "POST /fare-families/${f_lite_id}/attributes"
              payload: { ancillary_product_id: "${p_bag_id}", inclusion: "INCLUDED", included_quantity: 1, waiver_eligible: true }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { a_bag_id: $.data.id }
          trigger:
            - call: "GET /fare-families/${f_lite_id}"
              payload: {}
              as: PricingApprover
              as_user_id: "pa-001"
          assert:
            - "FareFamily.unbundled_value_cents == 3500"
            - "FareFamily.a_la_carte_total_cents == 15500"
            - "FareFamily.bundle_discount_bp == 968"
            - "FareFamily.included_attribute_count == 1"
            - "FareFamily.fee_fingerprint == \"ECO_LITE|1|BAG_CHECKED_1:INCLUDED:1:3500\""
            - "FareFamily.status == \"DRAFT\" and FareFamily.revision_no == 1"

      - name: list_ancillary_products_paginated_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /ancillary-products]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
          - validations.priority_3
        distinguishing_aspect: "With three stored products, limit 2 offset 0 returns 2 rows with total_count 3 and has_more true, while limit 2 offset 2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "catalog holds exactly three ACTIVE products: BAG_CHECKED_1, SEAT_STANDARD and WIFI_FULL_FLIGHT"
          setup_api_calls:
            - call: "POST /ancillary-products"
              payload: { sku: "BAG_CHECKED_1", name: "First checked bag", category: "BAGGAGE", list_price_cents: 3500, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4100" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_bag_id: $.data.id }
            - call: "POST /ancillary-products"
              payload: { sku: "SEAT_STANDARD", name: "Standard seat", category: "SEAT", list_price_cents: 1900, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4200", refundable: true }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_seat_std_id: $.data.id }
            - call: "POST /ancillary-products"
              payload: { sku: "WIFI_FULL_FLIGHT", name: "Full-flight wifi", category: "ONBOARD", list_price_cents: 750, tax_treatment: "EXEMPT", revenue_class: "NON_AIR", revenue_account_code: "4500", refundable: true }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_wifi_id: $.data.id }
            - call: "GET /ancillary-products"
              payload: { limit: 2, offset: 0 }
              as: RevenueAccountant
              as_user_id: "ra-001"
          trigger:
            - call: "GET /ancillary-products"
              payload: { limit: 2, offset: 2 }
              as: RevenueAccountant
              as_user_id: "ra-001"
          assert:
            - "the first list call returned exactly 2 AncillaryProduct rows with total_count == 3 and has_more == true"
            - "the trigger call returns exactly 1 AncillaryProduct row with total_count == 3 and has_more == false"
            - "response_type == \"array\" on both calls"
            - "no product appears in both pages"

      - name: get_seat_segment_with_unknown_id_returns_seat_segment_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /seat-segments/{id}]
          - validations.priority_4
          - errors[ERR_SEAT_SEGMENT_NOT_FOUND]
        distinguishing_aspect: "A GET against a syntactically valid but unstored segment id answers 404 with ERR_SEAT_SEGMENT_NOT_FOUND, not with a generic not-found id."
        test_recipe:
          setup:
            - "empty database; no SeatInventorySegment has ever been created"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsController
              as_user_id: "oc-001"
          trigger:
            - call: "GET /seat-segments/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: OperationsController
              as_user_id: "oc-001"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "data.error_id == \"ERR_SEAT_SEGMENT_NOT_FOUND\""
            - "response_type == \"error\" and data.message is a non-empty string"

      - name: create_booking_missing_required_passenger_name_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /bookings]
          - validations.priority_3
          - errors[ERR_INVALID_REQUEST]
          - entities.Booking.fields.passenger_name
        distinguishing_aspect: "Omitting passenger_name - an input field with no declared default - is refused with ERR_INVALID_REQUEST (400) and no Booking row is stored."
        test_recipe:
          setup:
            - "flight AC500, family ECO_LITE and channel DIRECT_WEB all exist; no booking has been created"
          setup_api_calls:
            - call: "POST /distribution-channels"
              payload: { channel_code: "DIRECT_WEB", channel_type: "DIRECT", commission_bp: 0, markup_bp: 0, max_ancillary_price_cents: 20000, supported_categories: ["BAGGAGE", "SEAT", "CHANGE", "BOARDING", "ONBOARD"], parity_required: true }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { ch_direct_id: $.data.id }
            - call: "POST /fare-families"
              payload: { code: "ECO_LITE", name: "Economy Lite", cabin_class: "ECONOMY", base_fare_cents: 12000, bundle_price_cents: 14000, refundability: "NON_REFUNDABLE", change_fee_cents: 7500, boarding_priority_tier: 4 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { f_lite_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "AC500", origin: "SFO", destination: "JFK", scheduled_departure_utc: "2026-09-01T15:00:00Z", cabin_seat_total: 120 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { fl_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { record_locator: "REQ001", flight_id: "${fl_id}", fare_family_id: "${f_lite_id}", distribution_channel_id: "${ch_direct_id}" }
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 400"
            - "data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /bookings as the same ChannelPartner returns total_count == 0"

      - name: create_ancillary_product_omitting_optional_flags_applies_declared_defaults
        claim_type: defaults
        grounds:
          - endpoints[POST /ancillary-products]
          - entities.AncillaryProduct.fields.refundable
          - entities.AncillaryProduct.fields.disclosable_fee
          - entities.AncillaryProduct.fields.product_state
        distinguishing_aspect: "Omitting refundable, disclosable_fee and product_state yields exactly the declared defaults false / true / ACTIVE - not null and not the opposite booleans."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
          trigger:
            - call: "POST /ancillary-products"
              payload: { sku: "PRIORITY_BOARDING", name: "Priority boarding", category: "BOARDING", list_price_cents: 1250, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4400" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_board_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "AncillaryProduct.refundable == false"
            - "AncillaryProduct.disclosable_fee == true"
            - "AncillaryProduct.product_state == \"ACTIVE\""

      - name: family_attribute_computed_effective_unit_and_attr_value_from_override
        claim_type: computed_fields
        grounds:
          - endpoints[POST /fare-families/{id}/attributes]
          - entities.FamilyAttribute.fields.effective_unit_cents
          - entities.FamilyAttribute.fields.attr_value_cents
          - calculations.fare_family_bundle_valuation
          - global_constants.CABIN_UPLIFT_BP
        distinguishing_aspect: "On a BUSINESS family, override_price_cents 4000 with quantity 2 yields effective_unit_cents 4000 and attr_value_cents 10400 (the 3000bp cabin uplift applied once to the extended value), never 8000 and never the 4200 list price."
        test_recipe:
          setup:
            - "catalog holds SEAT_EXTRA_LEGROOM at list_price_cents 4200"
            - "DRAFT family BIZ_FLEX (BUSINESS, base_fare 60000, bundle 68000) has no attributes yet"
          setup_api_calls:
            - call: "POST /ancillary-products"
              payload: { sku: "SEAT_EXTRA_LEGROOM", name: "Extra legroom seat", category: "SEAT", list_price_cents: 4200, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4200", refundable: true }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_legroom_id: $.data.id }
            - call: "POST /fare-families"
              payload: { code: "BIZ_FLEX", name: "Business Flex", cabin_class: "BUSINESS", base_fare_cents: 60000, bundle_price_cents: 68000, refundability: "FULLY_REFUNDABLE", change_fee_cents: 0, boarding_priority_tier: 1 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { f_biz_id: $.data.id }
          trigger:
            - call: "POST /fare-families/${f_biz_id}/attributes"
              payload: { ancillary_product_id: "${p_legroom_id}", inclusion: "INCLUDED", included_quantity: 2, override_price_cents: 4000, waiver_eligible: false }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { a_legroom_id: $.data.id }
          assert:
            - "FamilyAttribute.effective_unit_cents == 4000"
            - "FamilyAttribute.attr_value_cents == 10400"
            - "GET /fare-families/${f_biz_id} shows unbundled_value_cents == 10400, a_la_carte_total_cents == 70400 and bundle_discount_bp == 341"
            - "GET /fare-families/${f_biz_id} shows fee_fingerprint == \"BIZ_FLEX|1|SEAT_EXTRA_LEGROOM:INCLUDED:2:4000\""

      - name: booking_system_fields_generated_and_client_supplied_status_rejected
        claim_type: system_fields
        grounds:
          - endpoints[POST /bookings]
          - entities.Booking.fields.booking_status
          - entities.Booking.fields.disclosure_state
          - validations.priority_3
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "booking_status is source: system, so a request that tries to seed it is refused with ERR_INVALID_REQUEST as an unknown field, while the accepted request stamps booking_status HELD and disclosure_state NOT_ISSUED by itself."
        test_recipe:
          setup:
            - "flight AC501, family ECO_LITE and channel DIRECT_WEB exist"
            - "a first booking SYS001 was accepted without any system field in its payload"
          setup_api_calls:
            - call: "POST /distribution-channels"
              payload: { channel_code: "DIRECT_WEB", channel_type: "DIRECT", commission_bp: 0, markup_bp: 0, max_ancillary_price_cents: 20000, supported_categories: ["BAGGAGE", "SEAT", "CHANGE", "BOARDING", "ONBOARD"], parity_required: true }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { ch_direct_id: $.data.id }
            - call: "POST /fare-families"
              payload: { code: "ECO_LITE", name: "Economy Lite", cabin_class: "ECONOMY", base_fare_cents: 12000, bundle_price_cents: 14000, refundability: "NON_REFUNDABLE", change_fee_cents: 7500, boarding_priority_tier: 4 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { f_lite_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "AC501", origin: "SFO", destination: "JFK", scheduled_departure_utc: "2026-09-01T15:00:00Z", cabin_seat_total: 120 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { fl_id: $.data.id }
            - call: "POST /bookings"
              payload: { record_locator: "SYS001", flight_id: "${fl_id}", fare_family_id: "${f_lite_id}", distribution_channel_id: "${ch_direct_id}", passenger_name: "Ada Lovelace" }
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
              captures: { bk_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { record_locator: "SYS002", flight_id: "${fl_id}", fare_family_id: "${f_lite_id}", distribution_channel_id: "${ch_direct_id}", passenger_name: "Grace Hopper", booking_status: "TICKETED" }
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 400 and data.error_id == \"ERR_INVALID_REQUEST\""
            - "booking SYS001 has booking_status == \"HELD\", disclosure_state == \"NOT_ISSUED\", version == 1"
            - "booking SYS001 has fare_component_cents == null, disclosed_fee_fingerprint == null and ancillary_gross_cents == 0"
            - "GET /bookings as the ChannelPartner returns total_count == 1 (SYS002 was never stored)"

      - name: create_flight_with_destination_equal_to_origin_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - endpoints[POST /flights]
          - entities.Flight.fields.destination
          - validations.priority_3
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "destination carries the declared constraint \"exactly 3 uppercase letters, different from origin\", so SFO -> SFO is refused with ERR_INVALID_REQUEST even though both codes are individually well formed."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsController
              as_user_id: "oc-001"
          trigger:
            - call: "POST /flights"
              payload: { flight_no: "AC502", origin: "SFO", destination: "SFO", scheduled_departure_utc: "2026-09-01T15:00:00Z", cabin_seat_total: 120 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 400 and data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /flights returns total_count == 0"

      - name: revenue_entry_is_immutable_with_no_version_field_and_no_write_endpoint
        claim_type: immutability
        grounds:
          - entities.RevenueEntry.common_fields
          - entities.RevenueEntry.entity_kind
          - endpoints[GET /bookings/{id}/revenue-entries]
          - endpoints[GET /revenue-entries/{id}]
        distinguishing_aspect: "RevenueEntry declares common_fields: false, so its rows expose id and created_at but no version and no updated_at, and 1.5 declares no POST, PATCH or DELETE for /revenue-entries."
        test_recipe:
          setup:
            - "catalog holds BAG_CHECKED_1 (3500) and channel DIRECT_WEB (commission 0, markup 0, max 20000) exists"
            - "one HELD booking IMMUT1 on flight AC503 accepted a BAGGAGE offer, so exactly one SALE RevenueEntry exists"
          setup_api_calls:
            - call: "POST /ancillary-products"
              payload: { sku: "BAG_CHECKED_1", name: "First checked bag", category: "BAGGAGE", list_price_cents: 3500, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4100" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_bag_id: $.data.id }
            - call: "POST /fare-families"
              payload: { code: "ECO_LITE", name: "Economy Lite", cabin_class: "ECONOMY", base_fare_cents: 12000, bundle_price_cents: 14000, refundability: "NON_REFUNDABLE", change_fee_cents: 7500, boarding_priority_tier: 4 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { f_lite_id: $.data.id }
            - call: "POST /distribution-channels"
              payload: { channel_code: "DIRECT_WEB", channel_type: "DIRECT", commission_bp: 0, markup_bp: 0, max_ancillary_price_cents: 20000, supported_categories: ["BAGGAGE", "SEAT", "CHANGE", "BOARDING", "ONBOARD"], parity_required: true }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { ch_direct_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "AC503", origin: "SFO", destination: "JFK", scheduled_departure_utc: "2026-09-01T15:00:00Z", cabin_seat_total: 120 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { fl_id: $.data.id }
            - call: "POST /flights/${fl_id}/demand-snapshot"
              payload: { booked_load_factor_pct: 50, demand_index_bp: 0 }
              as: OperationsController
              as_user_id: "oc-001"
            - call: "POST /bookings"
              payload: { record_locator: "IMMUT1", flight_id: "${fl_id}", fare_family_id: "${f_lite_id}", distribution_channel_id: "${ch_direct_id}", passenger_name: "Ada Lovelace" }
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/offer-sessions"
              payload: { touchpoint: "BOOKING", requested_product_ids: ["${p_bag_id}"] }
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
            - call: "GET /ancillary-offers"
              payload: { booking_id: "${bk_id}", offer_status: "PRESENTED" }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { off_bag_id: "$.data[0].id" }
            - call: "GET /bookings/${bk_id}"
              payload: {}
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
              captures: { bk_ver: $.data.version }
            - call: "POST /ancillary-offers/${off_bag_id}/accept"
              payload: { expected_booking_version: "${bk_ver}" }
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
          trigger:
            - call: "GET /bookings/${bk_id}/revenue-entries"
              payload: {}
              as: RevenueAccountant
              as_user_id: "ra-001"
              captures: { re_id: "$.data[0].id" }
          assert:
            - "exactly 1 RevenueEntry row is returned, with entry_type == \"SALE\", category == \"BAGGAGE\", gross_cents == 3500, tax_cents == 140 and net_cents == 3360"
            - "the row exposes id, created_at and source_ref but carries no version field and no updated_at field"
            - "RevenueEntry.source_ref == \"offer:\" + the accepted AncillaryOffer.id"
            - "GET /revenue-entries/${re_id} returns the byte-identical row"

      - name: create_attribute_under_unknown_family_returns_not_found
        claim_type: parent_relationships
        grounds:
          - endpoints[POST /fare-families/{id}/attributes]
          - entities.FamilyAttribute.parent
          - validations.priority_4
          - errors[ERR_FARE_FAMILY_NOT_FOUND]
        distinguishing_aspect: "FamilyAttribute declares parent: FareFamily, so a nested POST under an unstored family_id answers 404 ERR_FARE_FAMILY_NOT_FOUND before any product-existence or quantity rule is evaluated."
        test_recipe:
          setup:
            - "catalog holds BAG_CHECKED_1; no FareFamily has ever been created"
          setup_api_calls:
            - call: "POST /ancillary-products"
              payload: { sku: "BAG_CHECKED_1", name: "First checked bag", category: "BAGGAGE", list_price_cents: 3500, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4100" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_bag_id: $.data.id }
          trigger:
            - call: "POST /fare-families/00000000-0000-4000-8000-00000000ffff/attributes"
              payload: { ancillary_product_id: "${p_bag_id}", inclusion: "INCLUDED", included_quantity: 0 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "data.error_id == \"ERR_FARE_FAMILY_NOT_FOUND\" (not ERR_INVALID_ATTRIBUTE_QUANTITY, even though included_quantity 0 with INCLUDED also violates validations.priority_36)"
            - "GET /family-attributes returns total_count == 0"

      - name: publication_junction_links_one_family_to_two_channels_independently
        claim_type: many_to_many_junction
        grounds:
          - complexity_profile.entity_topology
          - entities.ChannelPublication.fields.fare_family_id
          - entities.ChannelPublication.fields.distribution_channel_id
          - endpoints[POST /channel-publications]
          - endpoints[GET /channel-publications]
          - entities.FareFamily.fields.publication_count
        distinguishing_aspect: "ChannelPublication is the (FareFamily, DistributionChannel) junction: one DRAFT family publishes to two distinct channels as two PENDING rows, and FareFamily.publication_count reads 2."
        test_recipe:
          setup:
            - "DRAFT family ECO_LITE exists with one ACTIVE INCLUDED BAG_CHECKED_1 attribute"
            - "two channels exist: DIRECT_WEB and OTA_SKYDEAL"
          setup_api_calls:
            - call: "POST /ancillary-products"
              payload: { sku: "BAG_CHECKED_1", name: "First checked bag", category: "BAGGAGE", list_price_cents: 3500, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4100" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_bag_id: $.data.id }
            - call: "POST /fare-families"
              payload: { code: "ECO_LITE", name: "Economy Lite", cabin_class: "ECONOMY", base_fare_cents: 12000, bundle_price_cents: 14000, refundability: "NON_REFUNDABLE", change_fee_cents: 7500, boarding_priority_tier: 4 }
