      - name: calendar_nights_conservation_on_cancel
        grounds:
          - calculations.calendar_availability
          - calculations.occupancy_pct
          - state_machines.Booking.HOLD_to_CANCELLED
        distinguishing_aspect: "Booking then cancelling 3 nights leaves the calendar-nights partition intact: quote occupancy_pct returns 0 -> 10 -> 0 across before-book / after-book / after-cancel, so booked_nights returns to its pre-booking value with no drift — conserved quantity is calendar nights (not money)."
        test_recipe:
          setup:
            - "LISTED property, no bookings. Compute a quote (occupancy 0), create a 3-night HOLD booking, compute a quote (occupancy 10), cancel, compute a quote (occupancy 0)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
