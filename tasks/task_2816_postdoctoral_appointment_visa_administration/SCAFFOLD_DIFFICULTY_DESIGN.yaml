              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_4"
              captures: { a4_full_id: "$.data.id" }
            - call: "POST /appointments"
              payload: { postdoc_id: "${p4b_id}", mentor_id: "${m4_id}", funding_source_id: "${f4_trunc_id}", title_classification: "POSTDOC_SCHOLAR_EMPLOYEE", employment_class: "EMPLOYEE", term_start_date: "2026-10-01", term_end_date: "2027-09-30", annual_salary_usd: 68000.00 }
              as: PostdocAffairsOfficer
