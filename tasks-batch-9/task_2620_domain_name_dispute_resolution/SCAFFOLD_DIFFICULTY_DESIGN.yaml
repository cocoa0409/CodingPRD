            - "The respondent answers with requests_three_member_panel true, so required_seat_count becomes 3 and assessed_fee_cents 400000; the shortfall is then settled with FILING_FEE 125000 COMPLAINANT and PANEL_SUPPLEMENT 125000 RESPONDENT."
