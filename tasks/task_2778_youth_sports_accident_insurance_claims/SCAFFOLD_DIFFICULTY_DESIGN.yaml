  - rule_id: compensating_invariant
    instances:

      - name: benefit_payment_void_restores_paid_loss_and_reserve_money_invariant
        grounds:
          - state_machines.BenefitPayment.ISSUED_to_VOIDED
          - state_machines.Claim.APPROVED_to_PAID
          - state_machines.Claim.PAID_to_APPROVED
          - calculations.policy_loss_experience
          - calculations.policy_coverage_posture
          - entities.LeaguePolicy.fields.paid_loss_cents
        distinguishing_aspect: |
          MONEY invariant: LeaguePolicy.paid_loss_cents must always equal the sum of amount_cents over the
          ISSUED BenefitPayment rows of every Claim on the policy, and incurred_loss_cents must always equal
          paid_loss_cents + the reserve of the open set. Issuing a payment of exactly benefit_payable_cents
          moves the claim APPROVED -> PAID, which drops it out of the open set and swaps 1500000 of reserve
          for 335000 of paid loss; voiding that payment must undo BOTH halves, restoring paid_loss_cents to
          0 AND the reserve to 1500000, and driving the claim PAID -> APPROVED. An implementation that
          reverses the payment ledger but forgets that the claim re-enters the open set leaves
          incurred_loss_cents at 0 and coverage_posture at OPEN instead of CLAIMS_REVIEW.
        test_recipe:
          setup:
            - "One BASEBALL_U12 classification and one ACTIVE FULL_EXCESS_PERMITTED policy with 404 participants, annual_premium_cents 822840, aggregate_limit_cents 25000000."
            - "One ENROLLED athlete with a VERIFIED SEVERE injury report, so the claim's reserve_amount_cents is 1500000."
            - "One repriced IN_NETWORK EMERGENCY_ROOM bill billed 620000 against a fee schedule of 385000 (allowed 385000 under the SEVERE-adjusted cap of 575000), a FULL_EXCESS footing with a doubled deductible of 50000, and the claim already adjudicated APPROVED with benefit_payable_cents 335000 and paid_to_date_cents 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /leagues"
              payload: { name: "Mill Creek Baseball Council", league_code: "MCB-060", state_code: "IN", governing_body_code: "USYSA", contact_email: "admin@mcb.example" }
              as: ProgramAdministrator
              captures: { league_id: "$.data.id" }
            - call: "POST /sport-classifications"
              payload: { sport_code: "BASEBALL_U12", sport_name: "Baseball U12", hazard_class: "CLASS_2_MODERATE", base_rate_per_participant_cents: 1850, deductible_cents: 25000, per_injury_limit_cents: 2500000, cat_attachment_point_cents: 2500000, aggregate_limit_cents: 25000000, cat_lifetime_max_cents: 100000000, minimum_participants: 25, travel_buffer_minutes: 60, service_category_caps: { EMERGENCY_ROOM: 500000, SURGERY: 3000000, DIAGNOSTIC_IMAGING: 300000, PHYSICAL_THERAPY: 20000, DENTAL: 350000, AMBULANCE: 200000, PHYSICIAN_OFFICE: 50000 } }
              as: ProgramAdministrator
              captures: { sport_id: "$.data.id" }
            - call: "POST /league-policies"
              payload: { league_id: "${league_id}", sport_classification_id: "${sport_id}", term_effective_date: "2026-03-01", term_expiration_date: "2027-03-01", enrolled_participant_count: 404, coverage_basis_election: "FULL_EXCESS_PERMITTED", cat_layer_elected: true }
              as: ProgramAdministrator
              captures: { pol_id: "$.data.id" }
            - call: "POST /league-policies/${pol_id}/bind"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /league-policies/${pol_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /participants"
              payload: { league_id: "${league_id}", first_name: "Priya", last_name: "Raghunathan", date_of_birth: "2014-03-27", guardian_email: "g18@mcb.example" }
              as: LeagueAdministrator
              as_user_id: "${league_id}"
              captures: { p1_id: "$.data.id" }
            - call: "POST /enrollments"
              payload: { participant_id: "${p1_id}", league_policy_id: "${pol_id}", enrolled_on_date: "2026-03-05" }
              as: LeagueAdministrator
              as_user_id: "${league_id}"
              captures: { enr1_id: "$.data.id" }
            - call: "POST /sanctioned-activities"
              payload: { league_policy_id: "${pol_id}", activity_type: "GAME", venue_name: "Mill Creek Field 4", starts_at: "2026-07-11T18:00:00Z", ends_at: "2026-07-11T20:30:00Z" }
              as: LeagueAdministrator
              as_user_id: "${league_id}"
              captures: { act_id: "$.data.id" }
            - call: "POST /sanctioned-activities/${act_id}/sanction-decision"
              payload: { decision: "SANCTION" }
              as: LeagueOfficial
              as_user_id: "official-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-12T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /injury-reports"
              payload: { enrollment_id: "${enr1_id}", sanctioned_activity_id: "${act_id}", injury_datetime: "2026-07-11T19:15:00Z", body_part: "KNEE", injury_description: "outfield collision, suspected meniscus tear", severity_tier: "SEVERE" }
              as: LeagueAdministrator
              as_user_id: "${league_id}"
              captures: { ir_id: "$.data.id" }
            - call: "POST /injury-reports/${ir_id}/verification-decision"
              payload: { decision: "VERIFY", official_attestation: "field umpire witnessed the collision" }
              as: LeagueOfficial
              as_user_id: "official-2"
            - call: "GET /claims"
              payload: { injury_report_id: "${ir_id}" }
              as: ClaimsExaminer
              captures: { claim_id: "$.data[0].id" }
            - call: "POST /provider-bills"
              payload: { claim_id: "${claim_id}", provider_npi: "1639072284", provider_name: "Mill Creek Emergency Associates", network_status: "IN_NETWORK", service_category: "EMERGENCY_ROOM", service_date: "2026-07-11", billed_charge_cents: 620000, fee_schedule_amount_cents: 385000 }
              as: ClaimsExaminer
              captures: { bill_id: "$.data.id" }
            - call: "POST /provider-bills/${bill_id}/reprice"
              payload: {}
              as: ClaimsExaminer
            - call: "POST /claims/${claim_id}/confirm-no-other-coverage"
              payload: { attestation_note: "no other health coverage in force for this athlete" }
              as: ClaimsExaminer
            - call: "POST /claims/${claim_id}/adjudicate"
              payload: { examiner_note: "program primary on a full-excess footing" }
              as: ClaimsExaminer
          trigger:
            - call: "POST /benefit-payments"
              payload: { claim_id: "${claim_id}", provider_bill_id: "${bill_id}", payee_type: "PROVIDER", layer: "BASE", amount_cents: 335000 }
              as: ClaimsExaminer
              captures: { pay_id: "$.data.id" }
            - call: "POST /benefit-payments/${pay_id}/void"
              payload: { void_reason: "payment issued against the wrong remittance batch and was recalled by the bank" }
              as: ClaimsExaminer
          assert:
            - "checkpoint 0 (before the triggers): Claim.${claim_id}.adjudication_status == APPROVED, benefit_payable_cents == 335000, paid_base_cents == 0, paid_to_date_cents == 0"
            - "checkpoint 0: LeaguePolicy.${pol_id}.paid_loss_cents == 0, reserve_cents == 1500000, incurred_loss_cents == 1500000, open_claim_count == 1, incurred_loss_ratio_bps == 18230, paid_loss_ratio_bps == 0, experience_tier == DECLINE, coverage_posture == CLAIMS_REVIEW"
            - "checkpoint 1 (after the forward call): BenefitPayment.${pay_id}.status == ISSUED with amount_cents 335000 and layer BASE"
            - "checkpoint 1: Claim.${claim_id}.paid_base_cents == 335000, paid_cat_cents == 0, paid_to_date_cents == 335000, adjudication_status == PAID"
            - "checkpoint 1: LeaguePolicy.${pol_id}.paid_loss_cents == 335000, reserve_cents == 0 (the PAID claim left the open set), incurred_loss_cents == 335000, open_claim_count == 0, incurred_loss_ratio_bps == 4071, paid_loss_ratio_bps == 4071, experience_tier == STANDARD, coverage_posture == OPEN"
            - "checkpoint 2 (after the compensating call): BenefitPayment.${pay_id}.status == VOIDED with voided_at set and void_reason recorded; the row is NOT deleted"
            - "checkpoint 2: Claim.${claim_id}.paid_base_cents == 0, paid_to_date_cents == 0, adjudication_status == APPROVED, and benefit_payable_cents is still 335000 (the frozen determination is untouched)"
            - "checkpoint 2: LeaguePolicy.${pol_id}.paid_loss_cents == 0, reserve_cents == 1500000, incurred_loss_cents == 1500000, open_claim_count == 1, incurred_loss_ratio_bps == 18230, paid_loss_ratio_bps == 0, experience_tier == DECLINE, coverage_posture == CLAIMS_REVIEW - byte-identical to checkpoint 0"
            - "invariant at all three checkpoints: LeaguePolicy.paid_loss_cents == sum of amount_cents over GET /benefit-payments?claim_id=${claim_id}&status=ISSUED, and incurred_loss_cents == paid_loss_cents + reserve_cents"
            - "ProviderBill.${bill_id}.status == ADJUDICATED at all three checkpoints: voiding a payment does not revert the bill"

      - name: claim_withdrawal_restores_open_claim_cardinality_and_voids_its_bills
        grounds:
          - state_machines.Claim.PENDING_COORDINATION_to_WITHDRAWN
          - state_machines.InjuryReport.PENDING_VERIFICATION_to_VERIFIED
          - state_machines.ProviderBill.REPRICED_to_VOIDED
          - calculations.policy_loss_experience
          - entities.LeaguePolicy.fields.open_claim_count
          - entities.ProviderBill.fields.void_reason
        distinguishing_aspect: |
          CARDINALITY invariant rather than a money one: LeaguePolicy.open_claim_count must always equal the
          number of Claims whose adjudication_status is in {PENDING_COORDINATION, UNDER_ADJUDICATION,
          APPROVED}, and reserve_cents must equal the sum of exactly those claims' reserve_amount_cents.
          Verifying the injury report creates the claim (0 -> 1 open, 0 -> 1500000 reserve); withdrawing it
          must take the counter back to 0 and the reserve back to 0 while additionally voiding the claim's
          REPRICED bill with void_reason CLAIM_WITHDRAWN. The compensation is deliberately asymmetric: the
          InjuryReport stays VERIFIED, so the test proves the compensation is scoped to the derived
          aggregates and the bills, not a wholesale rollback of the forward transition.
        test_recipe:
          setup:
            - "One BASEBALL_U12 classification and one ACTIVE policy with 404 participants, annual_premium_cents 822840, and no claims at all - open_claim_count 0, reserve_cents 0, incurred_loss_ratio_bps 0."
            - "One ENROLLED athlete and one SANCTIONED GAME on 2026-07-11."
