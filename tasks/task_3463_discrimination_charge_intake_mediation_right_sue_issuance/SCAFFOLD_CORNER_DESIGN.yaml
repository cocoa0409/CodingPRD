  - section: cross_cutting_layers
    instances:
      - name: amend_stale_version_returns_412
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[charge-amend-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Charge.version: after a first successful amend bumps the version, a second amend carrying the stale captured version is rejected 412 ERR_STALE_VERSION — two strictly sequential requests, no concurrency theater."
        test_recipe:
          setup: ["DOCKETED charge, version 1 captured at creation"]
          setup_api_calls:
            - call: "POST /eeoc/employers"
              payload: { legal_name: "Occ Co", state_code: "FL", employee_count_current: 40 }
              as: IntakeOfficer
              captures: { emp_oc: $.data.id }
            - call: "POST /eeoc/complainants"
              payload: { full_name: "Gale Nine", email: "g9@x.com" }
              as: IntakeOfficer
              captures: { cmp_g9: $.data.id }
            - call: "POST /eeoc/charges"
              payload: { complainant_id: "${cmp_g9}", employer_id: "${emp_oc}", basis_codes: ["RACE"], incident_date: "2026-06-01", harm_description: "fired", employee_count_at_incident: 40 }
              as: IntakeOfficer
              captures: { chg_oc: $.data.id, chg_oc_v: $.data.version }
          trigger:
            - call: "POST /eeoc/charges/${chg_oc}/amend"
              payload: { expected_charge_version: "${chg_oc_v}", harm_description: "first amendment" }
              as: ChargingParty
              as_user_id: "${cmp_g9}"
              captures: { chg_oc_v2: $.data.version }
            - call: "POST /eeoc/charges/${chg_oc}/amend"
              payload: { expected_charge_version: "${chg_oc_v}", harm_description: "stale amendment" }
              as: ChargingParty
              as_user_id: "${cmp_g9}"
              captures: { err_occ1: $.data.error_id }
          assert:
            - "first amend succeeded with version 2"
            - "second amend with the stale version 1: err_occ1 == ERR_STALE_VERSION (412); harm_description still reads 'first amendment'"
      - name: offer_stale_version_returns_412
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[conciliation-offer-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on ConciliationProcess.version: a counter-offer carrying the pre-first-offer version is rejected 412 even though the turn alternation would otherwise allow it — stale reads lose to the version check."
        test_recipe:
          setup: ["charge at CONCILIATION; conciliation version captured before any offer"]
          setup_api_calls:
            - call: "POST /eeoc/employers"
              payload: { legal_name: "Occ2 Co", state_code: "FL", employee_count_current: 40 }
              as: IntakeOfficer
              captures: { emp_oc2: $.data.id }
            - call: "POST /eeoc/complainants"
              payload: { full_name: "Gale Ten", email: "g10@x.com" }
              as: IntakeOfficer
              captures: { cmp_g10: $.data.id }
            - call: "POST /eeoc/charges"
              payload: { complainant_id: "${cmp_g10}", employer_id: "${emp_oc2}", basis_codes: ["RACE"], incident_date: "2026-06-01", harm_description: "fired", employee_count_at_incident: 40 }
              as: IntakeOfficer
              captures: { chg_oc2: $.data.id }
            - call: "POST /eeoc/charges/${chg_oc2}/mediation-cases"
              as: IntakeOfficer
              captures: { med_oc2: $.data.id }
            - call: "POST /eeoc/mediation-cases/${med_oc2}/respond"
              payload: { response: "DECLINED" }
              as: ChargingParty
              as_user_id: "${cmp_g10}"
            - call: "GET /eeoc/charges/${chg_oc2}"
              as: Director
              captures: { inv_oc2: $.data.investigation_case_id }
            - call: "POST /eeoc/investigation-cases/${inv_oc2}/assign"
              payload: { investigator_user_id: "inv-037" }
              as: Director
            - call: "POST /eeoc/investigation-cases/${inv_oc2}/evidence-requests"
              payload: { request_type: "RFI" }
              as: Investigator
              as_user_id: "inv-037"
            - call: "POST /eeoc/investigation-cases/${inv_oc2}/determinations"
              payload: { outcome: "CAUSE", rationale: "docs", back_pay_cents: 100000, front_pay_cents: 0, compensatory_damages_cents: 0, punitive_damages_cents: 0, harm_start_date: "2026-06-01" }
              as: Investigator
              as_user_id: "inv-037"
              captures: { det_oc2: $.data.id }
            - call: "POST /eeoc/determinations/${det_oc2}/submit"
              as: Investigator
              as_user_id: "inv-037"
            - call: "POST /eeoc/determinations/${det_oc2}/review"
              payload: { decision: "APPROVE" }
              as: Director
              as_user_id: "dir-011"
            - call: "GET /eeoc/charges/${chg_oc2}/conciliation-processes"
              as: Director
              captures: { conc_oc2: "$.data[0].id", conc_oc2_v: "$.data[0].version" }
          trigger:
            - call: "POST /eeoc/conciliation-processes/${conc_oc2}/offers"
              payload: { amount_cents: 200000, expected_conciliation_version: "${conc_oc2_v}" }
              as: Director
              as_user_id: "dir-011"
              captures: { conc_oc2_v2: $.data.version }
            - call: "POST /eeoc/conciliation-processes/${conc_oc2}/offers"
              payload: { amount_cents: 150000, expected_conciliation_version: "${conc_oc2_v}" }
              as: RespondentRep
              as_user_id: "${emp_oc2}"
              captures: { err_occ2: $.data.error_id }
          assert:
            - "first offer (COMMISSION) succeeded, version advanced"
            - "respondent's counter-offer with the stale pre-offer version: err_occ2 == ERR_STALE_VERSION (412); current_offer_cents remains 200000 and last_offer_by remains COMMISSION"
      - name: cascade_immediate_visibility
        claim_type: cascade_chain
        grounds: [state_machines.Charge.DETERMINATION_REVIEW_to_CONCILIATION]
        excluded_because:
          difficulty_instance: cause_approval_cascade_depth3
          rationale: "The depth-3 cascade recipe reads every cascade hop immediately after the single APPROVE call, which is exactly the immediate-consistency claim."
      - name: overdue_priority_recompute
        claim_type: derived_field_reconciliation
        grounds: [calculations.investigation_priority_score, entities.InvestigationCase.fields.priority_score]
        excluded_because:
          difficulty_instance: evidence_overdue_escalation_cascade
          rationale: "The escalation cascade asserts the recomputed priority_score (80) and the latched priority_escalated flag after the overdue flip."
