  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: surge_window_halfopen_touching_allowed
        grounds:
          - validations[priority=20]
          - entities.SurgeWindow.starts_at
          - entities.SurgeWindow.ends_at
          - errors[ERR_WINDOW_OVERLAP]
        distinguishing_aspect: |
          SurgeWindow uses HALF-OPEN [starts_at, ends_at): an interior overlap [2026-06-05,2026-06-15) against an
          existing [2026-06-01,2026-06-10) is rejected, but a touching window [2026-06-10,2026-06-20) (prev end == next
          start) is ACCEPTED. Interval semantics: adjacency allowed.
        test_recipe:
          setup:
            - "One existing surge window [2026-06-01,2026-06-10)."
          setup_api_calls:
            - call: "POST /surge-windows"
              payload: { name: "W1", starts_at: "2026-06-01T00:00:00Z", ends_at: "2026-06-10T00:00:00Z", turnaround_extra_days: 2, capacity_per_day: 100 }
              as: CatalogAdmin
          trigger:
            - call: "POST /surge-windows"
              payload: { name: "W2", starts_at: "2026-06-05T00:00:00Z", ends_at: "2026-06-15T00:00:00Z", turnaround_extra_days: 2, capacity_per_day: 100 }
              as: CatalogAdmin
              captures: { err: $.data.error_id }
            - call: "POST /surge-windows"
              payload: { name: "W3", starts_at: "2026-06-10T00:00:00Z", ends_at: "2026-06-20T00:00:00Z", turnaround_extra_days: 2, capacity_per_day: 100 }
              as: CatalogAdmin
              captures: { w3: $.data.id }
          assert:
            - "W2 create -> error_id == ERR_WINDOW_OVERLAP, http 409 (interior overlap)"
            - "W3 create -> 201 with a new id (touching at 2026-06-10 is allowed under half-open semantics)"

      - name: promo_window_closed_buffered
        grounds:
          - validations[priority=19]
          - entities.PromoWindow.starts_at
          - entities.PromoWindow.ends_at
          - errors[ERR_WINDOW_OVERLAP]
        distinguishing_aspect: |
          PromoWindow uses CLOSED [starts_at, ends_at] with a 2-day buffer: a window starting just 1 day after an
          existing window's end [2026-06-11,2026-06-20] is rejected (buffer < 2 days), while [2026-06-13,2026-06-20]
          (3-day gap) is accepted — stricter interval semantics than SurgeWindow's touching-allowed half-open, on a different entity.
        test_recipe:
          setup:
            - "A promotion with one existing window [2026-06-01,2026-06-10]."
          setup_api_calls:
            - call: "POST /promotions"
              payload: { code: "FALL", kind: "PERCENT", value: 15, min_subtotal_cents: 0, stackable: true, per_customer_limit: 5 }
              as: CatalogAdmin
              captures: { promo: $.data.id }
            - call: "POST /promotions/${promo}/windows"
              payload: { starts_at: "2026-06-01T00:00:00Z", ends_at: "2026-06-10T00:00:00Z" }
              as: CatalogAdmin
          trigger:
            - call: "POST /promotions/${promo}/windows"
              payload: { starts_at: "2026-06-05T00:00:00Z", ends_at: "2026-06-08T00:00:00Z" }
              as: CatalogAdmin
              captures: { err_overlap: $.data.error_id }
            - call: "POST /promotions/${promo}/windows"
              payload: { starts_at: "2026-06-11T00:00:00Z", ends_at: "2026-06-20T00:00:00Z" }
              as: CatalogAdmin
              captures: { err_buffer: $.data.error_id }
            - call: "POST /promotions/${promo}/windows"
              payload: { starts_at: "2026-06-13T00:00:00Z", ends_at: "2026-06-20T00:00:00Z" }
              as: CatalogAdmin
              captures: { ok_win: $.data.id }
          assert:
            - "overlap [2026-06-05,2026-06-08] -> error_id == ERR_WINDOW_OVERLAP, http 409"
            - "adjacent-within-buffer [2026-06-11,2026-06-20] (1-day gap) -> error_id == ERR_WINDOW_OVERLAP, http 409"
            - "buffered [2026-06-13,2026-06-20] (3-day gap) -> 201 with a new id"

