              as: PlatformAdmin
              captures: { venue_o1a: $.data.id }
            - call: "POST /venues"
              payload: { jurisdiction_id: "${jur_o1}", name: "Union County Fairgrounds", city: "Marysville", lot_area_sqft: 200000, power_amps_available: 1000, expected_attendance: 10001, lot_surface: "PAVED" }
              as: PlatformAdmin
              captures: { venue_o1b: $.data.id }
            - call: "POST /rides"
              payload: { name: "Tilt-A-Whirl", ride_class: "FLAT", footprint_sqft: 2003, power_amps: 120, crew_size_setup: 4, setup_hours: 5, axle_count: 2, requires_state_inspection: false }
              as: PlatformAdmin
              captures: { ride_o1: $.data.id }
            - call: "POST /routes"
              payload: { name: "2026 Midwest Swing", season_year: 2026, home_base_state: "OH" }
              as: RouteManager
              captures: { route_o1a: $.data.id }
            - call: "POST /route-stops"
              payload: { route_id: "${route_o1a}", venue_id: "${venue_o1a}", load_in_start: "2026-09-01T06:00:00Z", open_date: "2026-09-04T12:00:00Z", close_date: "2026-09-07T12:00:00Z", teardown_deadline: "2026-09-08T12:00:00Z" }
