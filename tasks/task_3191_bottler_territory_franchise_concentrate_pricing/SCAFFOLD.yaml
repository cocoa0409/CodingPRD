# =============================================================================
# SCAFFOLD — Bottler Territory Franchise & Concentrate Pricing
# Task: task_3191_bottler_territory_franchise_concentrate_pricing
# §1.0–§1.7 only. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Bottler Territory Franchise & Concentrate Pricing (Coca-Cola Consolidated): exclusive territory franchise rights for packaging and distributing branded beverages with product line obligations, concentrate purchase from the brand owner with pricing formulas and marketing funding arrangements, national customer agreements negotiated by the brand owner that bind local bottlers on price and service, direct store delivery execution with cold drink equipment placement and service, fountain customer supply with syrup delivery and equipment maintenance, territory transfer and refranchising transactions with valuation of distribution rights, package and flavor innovation launches with production line changeover and minimum volume commitments, cooperative advertising and local marketing fund administration

domain_name: bottler-territory-franchise
api_prefix: /bottler

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: branching   # dominant; also cyclic (TerritoryTransfer, BottlerAgreement) and parallel (ConcentratePurchaseOrder)
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: BrandOwner
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, required: true, description: "Brand owner legal name" }
      - { name: home_country, type: string, source: input, required: true, description: "ISO country code of brand owner HQ" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED", default: ACTIVE, constraints: "enum {ACTIVE, RETIRED}" }

  - name: Territory
    parent: null
    common_fields: true
    fields:
      - { name: brand_owner_id, type: string, source: input, required: true, description: "FK -> BrandOwner.id; owning brand" }
      - { name: code, type: string, source: input, required: true, description: "Unique territory code, e.g. SO-ATL-07", constraints: "unique across all territories" }
      - { name: region_label, type: string, source: input, required: true, description: "Human label for the geography" }
      - { name: status, type: enum, source: system, description: "OPEN | FRANCHISED | REFRANCHISED", default: OPEN, constraints: "enum {OPEN, FRANCHISED, REFRANCHISED}" }

  - name: BottlerAgreement
    parent: Territory
    common_fields: true
    fields:
      - { name: territory_id, type: string, source: input, required: true, description: "FK -> Territory.id; franchised territory" }
      - { name: bottler_name, type: string, source: input, required: true, description: "Bottling company legal name" }
      - { name: concentrate_base_index, type: number, source: input, required: true, description: "Fixed index baseline (e.g. 100.00) for concentrate pricing formula; immutable after creation" }
      - { name: marketing_accrual_basis, type: enum, source: input, required: true, description: "CASE_VOLUME | NET_REVENUE; selects marketing fund accrual variant", constraints: "enum {CASE_VOLUME, NET_REVENUE}" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED | TERMINATED | REFRANCHISED", default: DRAFT, constraints: "enum {DRAFT, ACTIVE, SUSPENDED, TERMINATED, REFRANCHISED}" }
      - { name: marketing_fund_balance_cents, type: integer, source: computed, description: "Derived: sum(ACCRUAL) - sum(DISBURSEMENT) - sum(CLAWBACK) over MarketingFundEntry rows for this agreement; starts 0" }
      - { name: service_budget_cents, type: integer, source: input, required: true, description: "Annual cold-drink-equipment service budget in cents" }
      - { name: service_spent_cents, type: integer, source: computed, description: "Derived: sum of ServiceWindow.cost_cents for equipment owned by this agreement; starts 0" }
      - { name: margin_ledger_cents, type: integer, source: computed, description: "Derived running margin adjustments driven by NCA publish cascade; starts 0" }

  - name: ProductLine
    parent: null
    common_fields: true
    fields:
      - { name: brand_owner_id, type: string, source: input, required: true, description: "FK -> BrandOwner.id" }
      - { name: line_code, type: string, source: input, required: true, description: "Package+flavor code, e.g. COLA-12OZ-CAN", constraints: "unique per brand_owner_id" }
      - { name: concentrate_base_price_per_gallon, type: number, source: input, required: true, description: "Base concentrate price in dollars, 4 decimal places, > 0" }
      - { name: is_mandatory, type: boolean, source: input, required: true, description: "True if every ACTIVE agreement for this brand must carry this line (line obligation)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED", default: ACTIVE, constraints: "enum {ACTIVE, RETIRED}" }

  - name: ConcentratePriceIndex
    parent: null
    common_fields: false
    fields:
      - { name: brand_owner_id, type: string, source: input, required: true, description: "FK -> BrandOwner.id" }
      - { name: quarter, type: string, source: input, required: true, description: "Quarter label YYYY-Qn, e.g. 2026-Q3" }
      - { name: index_value, type: number, source: input, required: true, description: "Commodity index value, 2 decimal places, > 0", constraints: "at most one entry per (brand_owner_id, quarter)" }

  - name: ConcentratePurchaseOrder
    parent: BottlerAgreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, required: true, description: "FK -> BottlerAgreement.id" }
      - { name: product_line_id, type: string, source: input, required: true, description: "FK -> ProductLine.id" }
      - { name: quantity_gallons, type: integer, source: input, required: true, description: "Ordered gallons, >= 1000 minimum order quantity" }
      - { name: delivery_quarter, type: string, source: input, required: true, description: "YYYY-Qn quarter the order delivers in" }
      - { name: fulfillment_status, type: enum, source: system, description: "PLACED | RECEIVED | CANCELLED", default: PLACED, constraints: "enum {PLACED, RECEIVED, CANCELLED}" }
      - { name: pricing_status, type: enum, source: system, description: "PROVISIONAL | FINALIZED", default: PROVISIONAL, constraints: "enum {PROVISIONAL, FINALIZED}; parallel dimension to fulfillment_status" }
      - { name: provisional_unit_price, type: number, source: computed, description: "Dollars/gallon, 4dp, from concentrate pricing provisional variant at placement" }
      - { name: provisional_amount_cents, type: integer, source: computed, description: "round_half_up(provisional_unit_price * quantity_gallons * 100)" }
      - { name: final_unit_price, type: number, source: computed, description: "Dollars/gallon, 4dp, from final variant at finalize; null until FINALIZED" }
      - { name: final_amount_cents, type: integer, source: computed, description: "null until FINALIZED" }
      - { name: price_delta_cents, type: integer, source: computed, description: "final_amount_cents - provisional_amount_cents; null until FINALIZED" }

  - name: NationalCustomerAgreement
    parent: null
    common_fields: true
    fields:
      - { name: brand_owner_id, type: string, source: input, required: true, description: "FK -> BrandOwner.id" }
      - { name: nca_code, type: string, source: input, required: true, description: "Unique NCA code", constraints: "unique" }
      - { name: national_price_cents, type: integer, source: input, required: true, description: "Nationally negotiated per-case price in cents" }
      - { name: effective_start, type: string, source: input, required: true, description: "ISO date, inclusive" }
      - { name: effective_end, type: string, source: input, required: true, description: "ISO date, inclusive (closed interval)" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | SUSPENDED | EXPIRED", default: DRAFT, constraints: "enum {DRAFT, PUBLISHED, SUSPENDED, EXPIRED}" }

  - name: Customer
    parent: BottlerAgreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, required: true, description: "FK -> BottlerAgreement.id; serving bottler agreement" }
      - { name: nca_id, type: string, source: system, description: "FK -> NationalCustomerAgreement.id; set by enroll-nca, null when not NCA-bound" }
      - { name: name, type: string, source: input, required: true, description: "Customer business name" }
      - { name: channel, type: enum, source: input, required: true, description: "RETAIL | FOUNTAIN", constraints: "enum {RETAIL, FOUNTAIN}" }
      - { name: local_price_cents, type: integer, source: input, required: true, description: "Per-case local list price in cents" }
      - { name: bound_price_cents, type: integer, source: computed, description: "Effective per-case price: NCA national price when NCA-bound and NCA PUBLISHED, else local_price_cents" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISPUTED | INACTIVE", default: ACTIVE, constraints: "enum {ACTIVE, DISPUTED, INACTIVE}" }

  - name: DsdOrder
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, required: true, description: "FK -> Customer.id" }
      - { name: lines, type: array, source: input, required: true, description: "Array of { product_line_id, quantity_cases, discount_pct } objects; quantity_cases >= 1; 0 <= discount_pct <= 0.30" }
      - { name: fulfillment_status, type: enum, source: system, description: "BOOKED | DELIVERED | VOIDED", default: BOOKED, constraints: "enum {BOOKED, DELIVERED, VOIDED}" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | PAID", default: UNPAID, constraints: "enum {UNPAID, PAID}; parallel dimension" }
      - { name: invoice_total_cents, type: integer, source: computed, description: "Per-line nested rounding per calc dsd_invoice_total" }

  - name: ColdDrinkEquipment
    parent: BottlerAgreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, required: true, description: "FK -> BottlerAgreement.id; owning bottler" }
      - { name: asset_tag, type: string, source: input, required: true, description: "Unique asset tag", constraints: "unique" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; current placement site, null when IN_WAREHOUSE" }
      - { name: placed_from, type: string, source: system, description: "ISO date of current placement start, null when IN_WAREHOUSE" }
      - { name: placed_until, type: string, source: system, description: "ISO date of current placement end (closed interval), null when IN_WAREHOUSE" }
      - { name: status, type: enum, source: system, description: "IN_WAREHOUSE | PLACED | UNDER_SERVICE", default: IN_WAREHOUSE, constraints: "enum {IN_WAREHOUSE, PLACED, UNDER_SERVICE}" }

  - name: ServiceWindow
    parent: ColdDrinkEquipment
    common_fields: false
    fields:
      - { name: equipment_id, type: string, source: input, required: true, description: "FK -> ColdDrinkEquipment.id" }
      - { name: technician_label, type: string, source: input, required: true, description: "Technician schedule bucket label; windows on the same label must not overlap (half-open)" }
      - { name: window_start, type: string, source: input, required: true, description: "ISO datetime, inclusive" }
      - { name: window_end, type: string, source: input, required: true, description: "ISO datetime, exclusive (half-open [start, end))" }
      - { name: cost_cents, type: integer, source: input, required: true, description: "Service cost charged to agreement service budget, >= 0" }

  - name: FountainAccount
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, required: true, description: "FK -> Customer.id; must have channel == FOUNTAIN" }
      - { name: syrup_on_hand_gallons, type: number, source: computed, description: "Derived: sum(SyrupDelivery.gallons) - maintenance-adjusted waste; starts 0" }
      - { name: maintenance_overdue, type: boolean, source: computed, description: "True when no maintenance visit recorded in the trailing 90 days at the logical clock" }

  - name: SyrupDelivery
    parent: FountainAccount
    common_fields: false
    fields:
      - { name: fountain_account_id, type: string, source: input, required: true, description: "FK -> FountainAccount.id" }
      - { name: gallons, type: number, source: input, required: true, description: "Delivered gallons, must be > 0", constraints: "> 0; zero rejected with ERR_ZERO_QUANTITY" }
      - { name: delivered_at, type: string, source: system, description: "Logical-clock ISO timestamp of the delivery" }

  - name: TerritoryTransfer
    parent: Territory
    common_fields: true
    fields:
      - { name: territory_id, type: string, source: input, required: true, description: "FK -> Territory.id" }
      - { name: buyer_name, type: string, source: input, required: true, description: "Prospective buyer legal name" }
      - { name: reported_ebitda_cents, type: integer, source: input, required: true, description: "Seller-reported normalized-basis EBITDA in cents, > 0" }
      - { name: valuation_cents, type: integer, source: computed, description: "Set by valuate per calc territory_transfer_valuation; null until first valuation" }
      - { name: valuation_round, type: integer, source: computed, description: "Number of valuations performed; increments on each valuate" }
      - { name: status, type: enum, source: system, description: "PROPOSED | VALUED | NEGOTIATING | APPROVED | EXECUTED | REJECTED", default: PROPOSED, constraints: "enum {PROPOSED, VALUED, NEGOTIATING, APPROVED, EXECUTED, REJECTED}" }

  - name: InnovationLaunch
    parent: BottlerAgreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, required: true, description: "FK -> BottlerAgreement.id" }
      - { name: product_line_id, type: string, source: input, required: true, description: "FK -> ProductLine.id; line being launched" }
      - { name: committed_cases, type: integer, source: input, required: true, description: "Minimum volume commitment in cases, > 0" }
      - { name: launch_start, type: string, source: input, required: true, description: "ISO date commitment window start, inclusive" }
      - { name: launch_end, type: string, source: input, required: true, description: "ISO date commitment window end, inclusive" }
      - { name: cases_sold, type: integer, source: computed, description: "Accumulated via record-sales; starts 0" }
      - { name: changeover_completed, type: boolean, source: computed, description: "Set true by complete-changeover; starts false" }
      - { name: penalty_cents, type: integer, source: computed, description: "Set at COMMIT_REVIEW per calc innovation_min_volume_penalty; null until reviewed" }
      - { name: status, type: enum, source: system, description: "PLANNED | CHANGEOVER_SCHEDULED | IN_PRODUCTION | COMMIT_REVIEW | MET | PENALIZED | EXTENDED", default: PLANNED, constraints: "enum {PLANNED, CHANGEOVER_SCHEDULED, IN_PRODUCTION, COMMIT_REVIEW, MET, PENALIZED, EXTENDED}" }

  - name: MarketingFundEntry
    parent: BottlerAgreement
    common_fields: false
    fields:
      - { name: agreement_id, type: string, source: input, required: true, description: "FK -> BottlerAgreement.id" }
      - { name: entry_type, type: enum, source: input, required: true, description: "ACCRUAL | DISBURSEMENT | CLAWBACK", constraints: "enum {ACCRUAL, DISBURSEMENT, CLAWBACK}" }
      - { name: period, type: string, source: input, required: true, description: "Month label YYYY-MM" }
      - { name: cases_sold, type: integer, source: input, required: false, description: "Required when entry_type == ACCRUAL and basis CASE_VOLUME" }
      - { name: net_revenue_cents, type: integer, source: input, required: false, description: "Required when entry_type == ACCRUAL and basis NET_REVENUE" }
      - { name: amount_cents, type: integer, source: computed, description: "ACCRUAL: computed per marketing_fund_accrual variant; DISBURSEMENT/CLAWBACK: taken from requested_amount_cents" }
      - { name: requested_amount_cents, type: integer, source: input, required: false, description: "Required for DISBURSEMENT and CLAWBACK, > 0" }
      - { name: reference_entry_id, type: string, source: input, required: false, description: "FK -> MarketingFundEntry.id; required for CLAWBACK, must reference an ACCRUAL entry of the same agreement" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: BottlerAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED, REFRANCHISED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /bottler/bottler-agreements/{id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "status == DRAFT"
          - "Every ProductLine of the territory's brand_owner_id with is_mandatory == true and status == ACTIVE must be coverable: at least one ConcentratePriceIndex exists for the brand (else ERR_LINE_OBLIGATION_UNMET)"
        side_effects:
          - "Territory.status OPEN -> FRANCHISED (only when territory was OPEN)"
          - "increments BottlerAgreement.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /bottler/bottler-agreements/{id}/suspend"
        actor: BrandOwnerAdmin
        preconditions: ["status == ACTIVE"]
        side_effects: ["increments BottlerAgreement.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /bottler/bottler-agreements/{id}/reinstate"
        actor: BrandOwnerAdmin
        preconditions: ["status == SUSPENDED"]
        side_effects: ["increments BottlerAgreement.version by 1"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /bottler/bottler-agreements/{id}/terminate"
        actor: BrandOwnerAdmin
        preconditions:
          - "status == ACTIVE"
          - "no ConcentratePurchaseOrder with agreement_id == id and fulfillment_status == PLACED"
        side_effects:
          - "Territory.status -> OPEN"
          - "increments BottlerAgreement.version by 1"
      - from: ACTIVE
        to: REFRANCHISED
        trigger: "system: TerritoryTransfer EXECUTED cascade"
        actor: system
        preconditions: ["TerritoryTransfer.status transitions to EXECUTED for this agreement's territory"]
        side_effects:
          - "Territory.status -> REFRANCHISED"
          - "cascade: every Customer with agreement_id == id is reassigned to the transfer's successor agreement (created by execute) and Customer.version increments"
          - "cascade: every ColdDrinkEquipment with agreement_id == id flips agreement_id to the successor agreement; placement fields unchanged"
          - "increments BottlerAgreement.version by 1"

  - entity: ConcentratePurchaseOrder
    initial_state: "fulfillment_status=PLACED, pricing_status=PROVISIONAL"
    terminal_states: ["fulfillment_status=CANCELLED"]
    transitions:
      - from: "fulfillment_status=PLACED"
        to: "fulfillment_status=RECEIVED"
        trigger: "POST /bottler/concentrate-purchase-orders/{id}/receive"
        actor: BottlerOps
        preconditions: ["fulfillment_status == PLACED"]
        side_effects: ["increments ConcentratePurchaseOrder.version by 1"]
        note: "receive does not touch pricing_status (parallel dimension)"
      - from: "fulfillment_status=PLACED"
        to: "fulfillment_status=CANCELLED"
        trigger: "POST /bottler/concentrate-purchase-orders/{id}/cancel"
        actor: BottlerOps
        preconditions: ["fulfillment_status == PLACED", "pricing_status == PROVISIONAL"]
        side_effects: ["increments ConcentratePurchaseOrder.version by 1"]
      - from: "pricing_status=PROVISIONAL"
        to: "pricing_status=FINALIZED"
        trigger: "POST /bottler/concentrate-purchase-orders/{id}/finalize"
        actor: BottlerOps
        preconditions:
          - "pricing_status == PROVISIONAL"
          - "fulfillment_status == RECEIVED (finalize requires physical receipt; ERR_INVALID_STATE otherwise)"
        side_effects:
          - "computes final_unit_price / final_amount_cents / price_delta_cents per concentrate pricing final variant"
          - "increments ConcentratePurchaseOrder.version by 1"

  - entity: NationalCustomerAgreement
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /bottler/national-customer-agreements/{id}/publish"
        actor: BrandOwnerAdmin
        preconditions:
          - "status == DRAFT"
          - "no other PUBLISHED NCA for the same brand_owner_id whose [effective_start, effective_end] closed interval overlaps this one (ERR_NCA_WINDOW_OVERLAP)"
        side_effects: []
      - from: PUBLISHED
        to: SUSPENDED
        trigger: "POST /bottler/national-customer-agreements/{id}/suspend"
        actor: BrandOwnerAdmin
        preconditions: ["status == PUBLISHED"]
        side_effects: ["bound customers keep last bound_price_cents (no recompute)"]
      - from: SUSPENDED
        to: PUBLISHED
        trigger: "POST /bottler/national-customer-agreements/{id}/publish"
        actor: BrandOwnerAdmin
        preconditions: ["status == SUSPENDED", "no overlapping PUBLISHED NCA for same brand (ERR_NCA_WINDOW_OVERLAP)"]
        side_effects: []
      - from: PUBLISHED
        to: EXPIRED
        trigger: "POST /bottler/national-customer-agreements/{id}/expire"
        actor: BrandOwnerAdmin
        preconditions: ["status IN {PUBLISHED, SUSPENDED}", "logical clock current date > effective_end"]
        side_effects: ["Customer.bound_price_cents reverts to local_price_cents for customers with nca_id == id"]

  - entity: Customer
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: DISPUTED
        trigger: "POST /bottler/customers/{id}/dispute"
        actor: CustomerManager
        preconditions: ["status == ACTIVE"]
        side_effects: ["increments Customer.version by 1"]
      - from: DISPUTED
        to: ACTIVE
        trigger: "POST /bottler/customers/{id}/resolve-dispute"
        actor: CustomerManager
        preconditions: ["status == DISPUTED"]
        side_effects: ["increments Customer.version by 1"]

  - entity: DsdOrder
    initial_state: "fulfillment_status=BOOKED, payment_status=UNPAID"
    terminal_states: ["fulfillment_status=VOIDED", "fulfillment_status=DELIVERED & payment_status=PAID"]
    transitions:
      - from: "fulfillment_status=BOOKED"
        to: "fulfillment_status=DELIVERED"
        trigger: "POST /bottler/dsd-orders/{id}/deliver"
        actor: BottlerOps
        preconditions:
          - "fulfillment_status == BOOKED"
          - "Customer.status == ACTIVE (ERR_CUSTOMER_DISPUTED otherwise)"
        side_effects: ["increments DsdOrder.version by 1"]
      - from: "fulfillment_status=BOOKED"
        to: "fulfillment_status=VOIDED"
        trigger: "POST /bottler/dsd-orders/{id}/void"
        actor: BottlerOps
        preconditions: ["fulfillment_status == BOOKED"]
        side_effects: ["increments DsdOrder.version by 1"]
      - from: "payment_status=UNPAID"
        to: "payment_status=PAID"
        trigger: "POST /bottler/dsd-orders/{id}/pay"
        actor: CustomerManager
        preconditions:
          - "payment_status == UNPAID"
          - "fulfillment_status == DELIVERED (ERR_DSD_ORDER_NOT_DELIVERED otherwise)"
        side_effects: ["increments DsdOrder.version by 1"]

  - entity: ColdDrinkEquipment
    initial_state: IN_WAREHOUSE
    terminal_states: []
    transitions:
      - from: IN_WAREHOUSE
        to: PLACED
        trigger: "POST /bottler/cold-drink-equipment/{id}/place"
        actor: BottlerOps
        preconditions:
          - "status == IN_WAREHOUSE (ERR_EQUIPMENT_NOT_IN_WAREHOUSE otherwise)"
          - "target Customer.status == ACTIVE"
          - "closed-interval [placed_from, placed_until] must not overlap any other placement of the SAME equipment asset history; adjacency (prior placed_until == new placed_from) counts as OVERLAP for placements (ERR_EQUIPMENT_PLACEMENT_OVERLAP)"
        side_effects:
          - "sets customer_id, placed_from, placed_until"
          - "increments ColdDrinkEquipment.version by 1"
      - from: PLACED
        to: UNDER_SERVICE
        trigger: "POST /bottler/cold-drink-equipment/{id}/service-windows (first window created)"
        actor: FieldTechnician
        preconditions:
          - "status == PLACED"
          - "new ServiceWindow half-open [window_start, window_end) must not overlap any existing window with the same technician_label; adjacency (end == start) is ALLOWED (ERR_SERVICE_WINDOW_OVERLAP otherwise)"
          - "agreement.service_spent_cents + cost_cents <= agreement.service_budget_cents (ERR_SERVICE_BUDGET_EXCEEDED)"
        side_effects:
          - "creates ServiceWindow"
          - "agreement.service_spent_cents += cost_cents"
          - "increments ColdDrinkEquipment.version by 1"
      - from: UNDER_SERVICE
        to: PLACED
        trigger: "system: last open service window end reached"
        actor: system
        preconditions: ["status == UNDER_SERVICE"]
        side_effects: ["increments ColdDrinkEquipment.version by 1"]
      - from: PLACED
        to: IN_WAREHOUSE
        trigger: "POST /bottler/cold-drink-equipment/{id}/uninstall"
        actor: BottlerOps
        preconditions: ["status == PLACED"]
        side_effects:
          - "clears customer_id, placed_from, placed_until"
          - "increments ColdDrinkEquipment.version by 1"
        note: "place + uninstall pair conserves the equipment pool invariant (Rule 9)"

  - entity: TerritoryTransfer
    initial_state: PROPOSED
    terminal_states: [EXECUTED, REJECTED]
    transitions:
      - from: PROPOSED
        to: VALUED
        trigger: "POST /bottler/territory-transfers/{id}/valuate"
        actor: BrandOwnerAdmin
        preconditions: ["status IN {PROPOSED, NEGOTIATING}"]
        side_effects:
          - "computes valuation_cents per territory_transfer_valuation; increments valuation_round"
          - "increments TerritoryTransfer.version by 1"
      - from: VALUED
        to: NEGOTIATING
        trigger: "POST /bottler/territory-transfers/{id}/counter"
        actor: PlatformAdmin
        preconditions: ["status == VALUED"]
        side_effects: ["increments TerritoryTransfer.version by 1"]
      - from: NEGOTIATING
        to: VALUED
        trigger: "POST /bottler/territory-transfers/{id}/valuate (re-valuation after counter)"
        actor: BrandOwnerAdmin
        preconditions: ["status IN {PROPOSED, NEGOTIATING}"]
        side_effects:
          - "recomputes valuation_cents (may use updated reported_ebitda_cents); increments valuation_round"
          - "increments TerritoryTransfer.version by 1"
        note: "cyclic negotiation loop VALUED -> NEGOTIATING -> VALUED"
      - from: VALUED
        to: APPROVED
        trigger: "POST /bottler/territory-transfers/{id}/approve"
        actor: BrandOwnerAdmin
        preconditions:
          - "status == VALUED"
          - "no Customer of the territory's current agreement has status == DISPUTED (ERR_TRANSFER_CUSTOMERS_DISPUTED)"
        side_effects: ["increments TerritoryTransfer.version by 1"]
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /bottler/territory-transfers/{id}/execute"
        actor: PlatformAdmin
        preconditions: ["status == APPROVED"]
        side_effects:
          - "creates successor BottlerAgreement for the same territory with status ACTIVE, bottler_name == buyer_name, copying concentrate_base_index and marketing_accrual_basis"
          - "triggers BottlerAgreement ACTIVE -> REFRANCHISED cascade chain (see that machine)"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /bottler/territory-transfers/{id}/reject"
        actor: BrandOwnerAdmin
        preconditions: ["status IN {PROPOSED, VALUED, NEGOTIATING, APPROVED}"]
        side_effects: ["increments TerritoryTransfer.version by 1"]

  - entity: InnovationLaunch
    initial_state: PLANNED
    terminal_states: [MET, PENALIZED]
    transitions:
      - from: PLANNED
        to: CHANGEOVER_SCHEDULED
        trigger: "POST /bottler/innovation-launches/{id}/schedule-changeover"
        actor: BottlerOps
        preconditions:
          - "status == PLANNED"
          - "ProductLine.status == ACTIVE (ERR_LAUNCH_PRODUCT_INACTIVE otherwise)"
          - "BottlerAgreement.status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE otherwise)"
        side_effects: ["increments InnovationLaunch.version by 1"]
      - from: CHANGEOVER_SCHEDULED
        to: IN_PRODUCTION
        trigger: "POST /bottler/innovation-launches/{id}/complete-changeover"
        actor: BottlerOps
        preconditions: ["status == CHANGEOVER_SCHEDULED"]
        side_effects:
          - "changeover_completed := true"
          - "increments InnovationLaunch.version by 1"
      - from: IN_PRODUCTION
        to: COMMIT_REVIEW
        trigger: "POST /bottler/innovation-launches/{id}/review-commitment"
        actor: BrandOwnerAdmin
        preconditions:
          - "status IN {IN_PRODUCTION, EXTENDED}"
          - "logical clock current date > launch_end (ERR_COMMITMENT_WINDOW_OPEN otherwise)"
        side_effects:
          - "if cases_sold >= committed_cases: next state MET, penalty_cents := 0 (branch A)"
          - "else: penalty_cents computed per innovation_min_volume_penalty and next state PENALIZED (branch B)"
          - "increments InnovationLaunch.version by 1"
        note: "branching fork: MET vs PENALIZED with divergent side effects"
      - from: COMMIT_REVIEW
        to: MET
        trigger: "system: branch A of review-commitment"
        actor: system
        preconditions: ["cases_sold >= committed_cases"]
        side_effects: ["penalty_cents := 0"]
      - from: COMMIT_REVIEW
        to: PENALIZED
        trigger: "system: branch B of review-commitment"
        actor: system
        preconditions: ["cases_sold < committed_cases"]
        side_effects:
          - "penalty_cents per innovation_min_volume_penalty"
          - "BottlerAgreement.margin_ledger_cents -= penalty_cents"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: cpo-create-stale-agreement
    parent_entity: BottlerAgreement
    write_endpoint: "POST /bottler/concentrate-purchase-orders"
    occ_field: expected_agreement_version
    description: |
      Creating a ConcentratePurchaseOrder against a BottlerAgreement whose
      version has advanced beyond the caller's expected_agreement_version is
      rejected with ERR_STALE_VERSION, because pricing inputs (base index,
      accrual basis) may have shifted under the caller's view.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: transfer-valuate-stale-transfer
    parent_entity: TerritoryTransfer
    write_endpoint: "POST /bottler/territory-transfers/{id}/valuate"
    occ_field: expected_transfer_version
    description: |
      Valuating a TerritoryTransfer whose version has advanced beyond the
      caller's expected_transfer_version is rejected with ERR_STALE_VERSION,
      because a prior valuation or counter has already moved the negotiation.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: concentrate_unit_price
    description: "Concentrate price per gallon for a purchase order"
    trigger: "CPO creation (provisional variant); CPO finalize (final variant)"
    inputs: [product_line.concentrate_base_price_per_gallon, agreement.concentrate_base_index, ConcentratePriceIndex rows for the brand, quantity_gallons, delivery_quarter]
    algorithm: tiered_pricing
    formula: |
      base = ProductLine.concentrate_base_price_per_gallon          # dollars, 4dp
      # variant index selection (see variants)
      unit_raw = base * (selected_index / agreement.concentrate_base_index)
      # tiered volume discount with cap — combinatorial mode (a):
      #   inputs: quantity_gallons, tier table, MAX_DISCOUNT cap (non-linear interaction)
      tier_pct = 0.00  if quantity_gallons < 25000
                 0.02  if 25000 <= quantity_gallons < 50000
                 0.035 if quantity_gallons >= 50000
      discount_pct = min(0.03, tier_pct)                            # MAX_DISCOUNT = 3.0%
      unit = round(unit_raw * (1 - discount_pct), 4)                # round_half_up, 4dp
      amount_cents = round(unit * quantity_gallons * 100, 0)        # round_half_up to cents
    constants:
      MAX_DISCOUNT: 0.03
      TIER1_MIN_GAL: 25000
      TIER2_MIN_GAL: 50000
      TIER1_PCT: 0.02
      TIER2_PCT: 0.035
      MIN_ORDER_GALLONS: 1000
    precision: "unit 4dp round_half_up; amount integer cents round_half_up"
    variants:
      - name: provisional
        when: "at CPO creation"
        difference: "selected_index = index_value of the most recent ConcentratePriceIndex for the brand with quarter <= delivery_quarter (chronological; ties impossible due to per-quarter uniqueness). If none exists, selected_index = agreement.concentrate_base_index."
      - name: final
        when: "at CPO finalize"
        difference: "selected_index = arithmetic mean (4dp round_half_up) of index_value over ALL ConcentratePriceIndex rows for the brand recorded up to finalize time (per-quarter uniqueness makes this a mean over distinct quarters). If only the provisional row exists, final may still diverge once later quarters are recorded; if no later row exists, final == provisional."

  - name: marketing_fund_accrual
    description: "Cooperative advertising accrual for one agreement-month"
    trigger: "POST /bottler/marketing-fund-ledger with entry_type == ACCRUAL"
    inputs: [agreement.marketing_accrual_basis, cases_sold, net_revenue_cents]
    algorithm: aggregation
    formula: |
      if agreement.marketing_accrual_basis == CASE_VOLUME:
        amount_cents = cases_sold * PER_CASE_RATE_CENTS
      else:  # NET_REVENUE
        amount_cents = round_half_up(net_revenue_cents * REVENUE_ACCRUAL_PCT)
      # entry.amount_cents stored; agreement.marketing_fund_balance_cents += amount_cents
    constants:
      PER_CASE_RATE_CENTS: 40
      REVENUE_ACCRUAL_PCT: 0.025
    precision: "integer cents"
    variants:
      - name: case_volume_basis
        when: "agreement.marketing_accrual_basis == CASE_VOLUME"
        difference: "pure per-case rate; ignores net_revenue_cents"
      - name: net_revenue_basis
        when: "agreement.marketing_accrual_basis == NET_REVENUE"
        difference: "percentage of net revenue; ignores cases_sold. Same period data yields a different amount than case_volume_basis."

  - name: dsd_invoice_total
    description: "DSD order invoice total with pinned nested rounding order"
    trigger: "DsdOrder creation; recompute on enroll-nca cascade for BOOKED orders"
    inputs: ["lines (array of line objects)", "customer.bound_price_cents"]
    algorithm: aggregation
    formula: |
      # combinatorial mode (b): PINNED rounding order — round per line, THEN sum.
      total = 0
      for each line in lines:                                        # processed in request array order
        unit_cents = customer.bound_price_cents                      # NCA-bound or local price
        line_raw = unit_cents * line.quantity_cases * (1 - line.discount_pct)
        line_cents = round_half_up(line_raw, 0)                      # per-line rounding FIRST
        total += line_cents                                          # then sum
      invoice_total_cents = total
      # NOTE: sum-then-round is FORBIDDEN and yields different cents
      # (e.g. two lines of raw 100.7 each: per-line => 202; sum-first => 201).
    constants: {}
    precision: "integer cents, round_half_up per line, then integer sum"

  - name: territory_transfer_valuation
    description: "Valuation of distribution rights for a territory transfer"
    trigger: "POST /bottler/territory-transfers/{id}/valuate"
    inputs: [reported_ebitda_cents]
    algorithm: threshold
    formula: |
      # combinatorial mode (c): circular-looking dependency, PINNED evaluation order.
      # reserve band depends on reported_ebitda; valuation depends on normalized
      # ebitda which deducts the reserve. Evaluate strictly top-down:
      #   (1) reserve_rate from reported_ebitda band
      reserve_rate = 0.04 if reported_ebitda_cents < 500000000 else 0.06
      #   (2) reserve from reported (NOT normalized) ebitda
      equipment_reserve_cents = round_half_up(reported_ebitda_cents * reserve_rate, 0)
      #   (3) normalized ebitda
      normalized_ebitda_cents = reported_ebitda_cents - equipment_reserve_cents
      #   (4) valuation
      valuation_cents = EBITDA_MULTIPLE * normalized_ebitda_cents
    constants:
      EBITDA_MULTIPLE: 7
      LOW_BAND_RATE: 0.04
      HIGH_BAND_RATE: 0.06
      BAND_THRESHOLD_CENTS: 500000000
    precision: "integer cents, round_half_up at step (2) only"

  - name: nca_price_band_check
    description: "Local price must sit within +/-5% of the NCA national price at enrollment"
    trigger: "POST /bottler/customers/{id}/enroll-nca"
    inputs: [customer.local_price_cents, nca.national_price_cents]
    algorithm: threshold
    formula: |
      deviation = abs(local_price_cents - national_price_cents) / national_price_cents
      if deviation > 0.05: reject ERR_PRICE_DEVIATION_EXCEEDS_BAND
      # boundary: deviation == 0.05 exactly is ALLOWED (strict > comparison)
    constants:
      MAX_DEVIATION: 0.05
    precision: "deviation computed in exact rational arithmetic over integer cents; compare against 0.05 without float rounding"

  - name: innovation_min_volume_penalty
    description: "Shortfall penalty at innovation launch commitment review"
    trigger: "InnovationLaunch review-commitment branch B"
    inputs: [committed_cases, cases_sold]
    algorithm: tiered_pricing
    formula: |
      shortfall = committed_cases - cases_sold                       # > 0 in branch B
      shortfall_pct = shortfall / committed_cases
      # average-rate tiers over the WHOLE shortfall (not marginal):
      rate_per_case_cents = 5   if shortfall_pct <= 0.10
                            12  if shortfall_pct <= 0.25
                            25  otherwise
      penalty_cents = shortfall * rate_per_case_cents
      # boundary: shortfall_pct == 0.10 exactly uses the 5-cent tier (<=)
    constants:
      TIER1_MAX_PCT: 0.10
      TIER2_MAX_PCT: 0.25
      TIER1_RATE_CENTS: 5
      TIER2_RATE_CENTS: 12
      TIER3_RATE_CENTS: 25
    precision: "integer cents; shortfall_pct compared in exact rational arithmetic"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and a declared role; X-User-ID present", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "acting role is in the endpoint's roles list", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "every path id and every FK id in the body exists (validated left-to-right: path first, then body fields in declared order)", error_id: ERR_RESOURCE_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: state, check: "target entity in a state from which the requested transition is defined (covers ERR_INVALID_STATE, ERR_AGREEMENT_NOT_ACTIVE, ERR_AGREEMENT_ALREADY_ACTIVE, ERR_CPO_ALREADY_FINALIZED, ERR_NCA_NOT_PUBLISHED, ERR_EQUIPMENT_NOT_IN_WAREHOUSE, ERR_CUSTOMER_DISPUTED, ERR_DSD_ORDER_NOT_DELIVERED, ERR_TRANSFER_CUSTOMERS_DISPUTED, ERR_LAUNCH_PRODUCT_INACTIVE, ERR_TERRITORY_HAS_ACTIVE_AGREEMENT, ERR_ALREADY_TERMINAL)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 5, category: business_temporal, check: "interval rules: NCA window overlap, service-window half-open overlap, equipment placement closed-interval overlap, commitment window closed, launch/quarter window sanity", error_id: ERR_NCA_WINDOW_OVERLAP, http_status: 409, applies_to: "publish, service-windows, place, review-commitment" }
  - { priority: 6, category: business_referential, check: "cross-reference consistency: customer channel FOUNTAIN for fountain accounts; customer belongs to the acting agreement; CLAWBACK reference_entry_id references an ACCRUAL of the same agreement; product line belongs to agreement's brand", error_id: ERR_REFERENTIAL_INTEGRITY, http_status: 422, applies_to: "fountain-accounts, enroll-nca, dsd-orders, marketing-fund-ledger, innovation-launches" }
  - { priority: 7, category: business_constraint, check: "shape rules: required fields present and typed, enums valid, discount_pct within [0, 0.30], territory code / line code / nca_code / asset_tag uniqueness", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all POST endpoints" }
  - { priority: 8, category: business_constraint, check: "domain quantity rules: quantity_gallons >= 1000 (ERR_MIN_ORDER_QUANTITY), gallons/cases > 0 (ERR_ZERO_QUANTITY), one index row per (brand, quarter) (ERR_INDEX_QUARTER_DUPLICATE), mandatory line obligations at activation (ERR_LINE_OBLIGATION_UNMET)", error_id: ERR_MIN_ORDER_QUANTITY, http_status: 422, applies_to: "concentrate-purchase-orders, syrup-deliveries, record-sales, concentrate-price-indices, activate" }
  - { priority: 9, category: business_fiscal, check: "money rules: service budget remaining (ERR_SERVICE_BUDGET_EXCEEDED), marketing fund sufficient balance (ERR_FUND_INSUFFICIENT_BALANCE), clawback <= referenced accrual amount (ERR_CLAWBACK_EXCEEDS_ACCRUAL), NCA price band (ERR_PRICE_DEVIATION_EXCEEDS_BAND)", error_id: ERR_SERVICE_BUDGET_EXCEEDED, http_status: 422, applies_to: "service-windows, marketing-fund-ledger, enroll-nca" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- clock (test-driving) ---
  - method: POST
    path: "/bottler/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is 2026-09-01T00:00:00Z; before any set call the clock reads exactly that default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["re-evaluates time-gated rules (NCA expire eligibility, maintenance_overdue, commitment window closure)"]

  # --- BrandOwner ---
  - method: POST
    path: "/bottler/brand-owners"
    description: "Create a brand owner"
    roles: [PlatformAdmin]
    code: 201
    input: [name, home_country]
    output: BrandOwner
    side_effects: []
  - method: GET
    path: "/bottler/brand-owners/{id}"
    description: "Fetch one brand owner"
    roles: [PlatformAdmin, BrandOwnerAdmin, BottlerOps]
    code: 200
    input: []
    output: BrandOwner
    side_effects: []
  - method: GET
    path: "/bottler/brand-owners"
    description: "List brand owners"
    roles: [PlatformAdmin, BrandOwnerAdmin, BottlerOps]
    code: 200
    input: ["limit?", "offset?"]
    output: BrandOwner[]
    side_effects: []

  # --- Territory ---
  - method: POST
    path: "/bottler/territories"
    description: "Create a territory for a brand"
