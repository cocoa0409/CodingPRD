# =============================================================================
# Task 2228 — Livestock Mandatory Price Reporting
# Scaffold seed tables (§1.0–§1.7). Difficulty design (§1.8) and corner design
# (§1.9) live in the two sibling files.
# =============================================================================

scenario: |
  2228. Livestock Mandatory Price Reporting (livestock market reporting program): reporting entity determination by slaughter volume thresholds with registration requirements, transaction reporting by purchase type including negotiated, formula and forward contract with required data elements, daily and weekly submission deadlines with correction and resubmission procedures, confidentiality protections using publication guidelines that prevent identification of individual reporters, market report publication with weighted average prices, volumes and price ranges by category, audit and compliance verification against plant records with penalties for late or inaccurate reporting, boxed beef and wholesale product reporting distinct from live animal categories, methodology changes with public comment and industry notification

domain_name: "livestock-mandatory-price-reporting"
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - rate_threshold_triggers
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation

  entity_topology: flat
  # Every entity is a top-level collection joined by explicit foreign keys.
  # Only two sub-resource paths exist (submission line items, methodology
  # comments) because those children are created strictly inside their
  # parent's editing context; all other relations are flat FK references.

  state_machine_shape: cyclic
  # Submission: ACCEPTED -> UNDER_CORRECTION -> RESUBMITTED -> ACCEPTED (bounded
  #   revision loop, resubmission_count <= 2).
  # Registration: ACTIVE -> SUSPENDED -> ACTIVE (delinquency breach / waiver) and
  #   DETERMINED -> UNDER_APPEAL -> DETERMINED (bounded appeal loop, <= 2).
  # ReportingWindow: LOCKED -> PUBLISHED -> LOCKED (publication withdrawal).
  # MarketReport: three independent parallel dimensions
  #   (aggregation_state x disclosure_state x publication_state).
  # AuditCase: branching fork-join FIELDWORK -> {RECONCILED | DISCREPANCY} -> CLOSED
  #   with divergent side-effect sets per branch.

  relationship_patterns:
    - one_to_many          # ReportingEntity -> Plant / Registration / PenaltyAssessment
    - self_referential     # Submission.supersedes_submission_id -> Submission.id
    - cross_aggregate      # AuditCase -> Submission, PenaltyAssessment -> AuditCase
    - polymorphic_optional # PenaltyAssessment attaches to an AuditCase or a Submission or neither

  role_model: segregation_of_duties
  # ComplianceAuditor finalizes an audit; the PenaltyOfficer who assesses the
  # resulting penalty MUST be a different X-User-ID. MarketAnalyst owns
  # publication and can neither audit nor penalize; ReporterAgent may only touch
  # its own ReportingEntity's plants and submissions.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 12 entities / 52 endpoints / 48 error codes / 10 calculations / 6 state
  # machines. Density comes from: two dual-variant calculations on different
  # subjects, two deliberately OPPOSITE rounding orders on the same underlying
  # transaction data, a self-superseding submission ledger, and four-hop
  # cascades that cross five entities.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: ReportingEntity
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Legal name of the packer / importer firm."
        constraints: "1..200 chars, non-blank"
      - name: entity_type
        type: enum
        source: input
        description: "Kind of regulated firm."
        constraints: "PACKER | PACKER_PROCESSOR | IMPORTER"
      - name: species_scope
        type: enum
        source: input
        description: "Species program the firm reports under; selects the head threshold constant."
        constraints: "CATTLE | SWINE | LAMB"
      - name: delinquency_points
        type: integer
        source: computed
        description: "Sum of PenaltyAssessment.points over assessments of this entity whose status IN {ASSESSED, PAID}; WAIVED assessments are excluded."
        default: 0
        constraints: ">= 0; recomputed on every penalty create / pay / waive"
      - name: assessed_penalty_cents
        type: integer
        source: computed
        description: "Sum of PenaltyAssessment.assessed_amount_cents over ALL assessments of this entity regardless of status."
        default: 0
      - name: paid_penalty_cents
        type: integer
        source: computed
        description: "Sum of PenaltyAssessment.assessed_amount_cents where status == PAID."
        default: 0
      - name: waived_penalty_cents
        type: integer
        source: computed
        description: "Sum of PenaltyAssessment.assessed_amount_cents where status == WAIVED."
        default: 0
      - name: outstanding_penalty_cents
        type: integer
        source: computed
        description: "Sum of PenaltyAssessment.assessed_amount_cents where status == ASSESSED."
        default: 0
        constraints: "invariant: assessed_penalty_cents == paid_penalty_cents + waived_penalty_cents + outstanding_penalty_cents"

  - name: Plant
    parent: null
    common_fields: true
    fields:
      - name: reporting_entity_id
        type: string
        source: input
        description: "FK -> ReportingEntity.id; owning firm of this federally inspected establishment."
      - name: plant_code
        type: string
        source: input
        description: "Establishment code."
        constraints: "unique per reporting_entity_id"
      - name: species
        type: enum
        source: input
        description: "Species slaughtered at this plant."
        constraints: "CATTLE | SWINE | LAMB; must equal owning ReportingEntity.species_scope"
      - name: annual_head_history
        type: object
        source: input
        description: "Prior-year slaughter volumes keyed by 4-digit year string, e.g. {\"2021\": 120000, \"2025\": 132000}."
        constraints: "values integer >= 0; must contain every year in [determination_year-5, determination_year-1] at determination time"
      - name: boxed_beef_volume_lbs_prior_year
        type: integer
        source: input
        description: "Prior-year boxed beef / wholesale product volume in pounds."
        constraints: ">= 0"
      - name: forward_commitment_cap_head
        type: integer
        source: input
        description: "Maximum head this plant may hold under overlapping forward-contract delivery commitments on any single day."
        constraints: ">= 0"
      - name: status
        type: enum
        source: input
        description: "Operating status; CLOSED plants are excluded from threshold determination."
        default: ACTIVE
        constraints: "ACTIVE | IDLE | CLOSED"
      - name: wholesale_reporting_required
        type: boolean
        source: computed
        description: "true when boxed_beef_volume_lbs_prior_year >= BOXED_BEEF_THRESHOLD_LBS (2000000); gates wholesale-lot reporting."

  - name: Registration
    parent: null
    common_fields: true
    fields:
      - name: reporting_entity_id
        type: string
        source: input
        description: "FK -> ReportingEntity.id; firm this determination/registration record belongs to."
      - name: determination_year
        type: integer
        source: input
        description: "Program year the determination applies to."
        constraints: "2000..2100; unique per (reporting_entity_id, determination_year) across records whose status != REVOKED"
      - name: basis_variant
        type: enum
        source: input
        description: "Which measurement basis the determination uses."
        constraints: "FIVE_YEAR_AVERAGE | PRIOR_YEAR_ACTUAL"
      - name: measured_head
        type: integer
        source: computed
        description: "Slaughter volume measured by calculation reporter_threshold_determination under basis_variant."
        default: 0
      - name: threshold_head
        type: integer
        source: computed
        description: "Species head threshold copied from THRESHOLD_HEAD_BY_SPECIES at determination time."
        default: 0
      - name: determination_outcome
        type: enum
        source: computed
        description: "MANDATORY when measured_head >= threshold_head, else EXEMPT; null while status == DRAFT."
        constraints: "MANDATORY | EXEMPT | null"
      - name: registration_number
        type: string
        source: computed
        description: "Minted on activation as MPR-{determination_year}-{N:04d}; null before activation."
      - name: status
        type: enum
        source: system
        description: "Registration lifecycle state."
        default: DRAFT
        constraints: "DRAFT | DETERMINED | UNDER_APPEAL | ACTIVE | SUSPENDED | REVOKED"
      - name: appeal_count
        type: integer
        source: computed
        description: "Number of appeals opened on this record; hard ceiling APPEAL_LIMIT (2)."
        default: 0
      - name: suspended_reason
        type: enum
        source: computed
        description: "Why the registration is suspended; null unless status == SUSPENDED."
        constraints: "ADMIN_ACTION | DELINQUENCY_TIER_BREACH | null"
      - name: effective_from
        type: datetime
        source: computed
        description: "Logical-clock instant at which the registration was activated; null before activation."

  - name: ReportingWindow
    parent: null
    common_fields: true
    fields:
      - name: species
        type: enum
        source: input
        description: "Species this window collects."
        constraints: "CATTLE | SWINE | LAMB"
      - name: report_class
        type: enum
        source: input
        description: "Live-animal versus wholesale/boxed product reporting class."
        constraints: "LIVE_ANIMAL | BOXED_BEEF | WHOLESALE_CUTS"
      - name: frequency
        type: enum
        source: input
        description: "Submission cadence."
        constraints: "DAILY | WEEKLY"
      - name: period_start
        type: datetime
        source: input
        description: "Inclusive start of the covered trade period."
      - name: period_end
        type: datetime
        source: input
        description: "Exclusive end of the covered trade period; window intervals are half-open [period_start, period_end)."
        constraints: "period_end > period_start"
      - name: submission_deadline_utc
        type: datetime
        source: input
        description: "Instant after which a submission is late (lateness is measured, not blocked)."
      - name: correction_deadline_utc
        type: datetime
        source: input
        description: "Last instant at which a correction/supersede may be filed."
      - name: publication_release_utc
        type: datetime
        source: input
        description: "Earliest instant a MarketReport for this window may be published."
      - name: min_reporter_count
        type: integer
        source: input
        description: "Confidentiality guideline: minimum distinct reporting entities required to publish."
        default: 3
        constraints: ">= 1"
      - name: max_single_reporter_share_pct
        type: number
        source: input
        description: "Confidentiality guideline: maximum share of window volume one reporting entity may hold, in percent with 2 decimals."
        default: 70.00
        constraints: "0.01..100.00"
      - name: min_reported_head
        type: integer
        source: input
        description: "Confidentiality guideline: minimum aggregate volume (head for LIVE_ANIMAL, pounds for BOXED_BEEF/WHOLESALE_CUTS) required to publish."
        default: 2000
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Window lifecycle state."
        default: OPEN
        constraints: "OPEN | LOCKED | PUBLISHED"
      - name: accepted_submission_count
        type: integer
        source: computed
        description: "Count of Submissions with reporting_window_id == this.id and status == ACCEPTED."
        default: 0
      - name: total_head_reported
        type: integer
        source: computed
        description: "Sum of Submission.reported_head over Submissions with reporting_window_id == this.id and status == ACCEPTED."
        default: 0

  - name: Submission
    parent: null
    common_fields: true
    fields:
      - name: plant_id
        type: string
        source: input
        description: "FK -> Plant.id; establishment filing the report."
      - name: reporting_window_id
        type: string
        source: input
        description: "FK -> ReportingWindow.id; period being reported."
      - name: supersedes_submission_id
        type: string
        source: input
        description: "FK -> Submission.id; the ACCEPTED submission this filing replaces (self-referential), null for an original filing."
      - name: status
        type: enum
        source: system
        description: "Submission lifecycle state."
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | ACCEPTED | REJECTED | UNDER_CORRECTION | RESUBMITTED | SUPERSEDED | VOIDED"
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent submit/resubmit; null while DRAFT."
      - name: accepted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent acceptance; null until first acceptance."
      - name: lateness_minutes
        type: integer
        source: computed
        description: "Whole minutes the most recent submit ran past ReportingWindow.submission_deadline_utc, floored at 0."
        default: 0
      - name: is_late
        type: boolean
        source: computed
        description: "true when lateness_minutes > 0."
        default: false
      - name: days_late
        type: integer
        source: computed
        description: "ceil(lateness_minutes / 1440); feeds the late-filing penalty day tier."
        default: 0
      - name: reported_head
        type: integer
        source: computed
        description: "Sum of TransactionRecord.head_count over this submission's line items, all purchase types included."
        default: 0
      - name: reported_cwt
        type: number
        source: computed
        description: "Sum of per-record round_half_up(head_count * avg_carcass_weight_cwt, 2) over this submission's TransactionRecords."
        default: 0
      - name: reported_value_dollars
        type: number
        source: computed
        description: "Sum of TransactionRecord.line_value_dollars (each already rounded per record) — round-then-sum order is pinned."
        default: 0
      - name: reported_pounds
        type: number
        source: computed
        description: "Sum of WholesaleLot.total_pounds over this submission's wholesale lots."
        default: 0
      - name: reported_load_count
        type: integer
        source: computed
        description: "Sum of WholesaleLot.load_count over this submission's wholesale lots."
        default: 0
      - name: resubmission_count
        type: integer
        source: computed
        description: "Number of completed correction rounds on this submission; ceiling RESUBMISSION_LIMIT (2)."
        default: 0
      - name: correction_reason
        type: string
        source: computed
        description: "Reason recorded by the most recent open-correction call; null if never corrected."
      - name: review_note
        type: string
        source: computed
        description: "Reviewer note recorded by the most recent review call; null if never reviewed."

  - name: TransactionRecord
    parent: null
    common_fields: false
    fields:
      - name: submission_id
        type: string
        source: input
        description: "FK -> Submission.id; owning filing. Records are immutable once written."
      - name: purchase_type
        type: enum
        source: input
        description: "Purchase arrangement for the lot of animals."
        constraints: "NEGOTIATED | NEGOTIATED_GRID | FORMULA | FORWARD_CONTRACT | PACKER_OWNED"
      - name: head_count
        type: integer
        source: input
        description: "Head of livestock in this transaction."
        constraints: ">= 1"
      - name: avg_net_price_per_cwt
        type: number
        source: input
        description: "Average net price per hundredweight, 2 decimals."
        constraints: "> 0, exactly 2 decimals"
      - name: avg_carcass_weight_cwt
        type: number
        source: input
        description: "Average carcass weight per head in hundredweight, 2 decimals."
        constraints: "> 0, exactly 2 decimals"
      - name: formula_base_reference
        type: string
        source: input
        description: "Required data element for purchase_type == FORMULA (the base the formula references); MUST be absent for every other purchase type."
      - name: grid_premium_discount_per_cwt
        type: number
        source: input
        description: "Required data element for purchase_type == NEGOTIATED_GRID; MUST be absent for every other purchase type."
      - name: forward_delivery_start
        type: datetime
        source: input
        description: "Required data element for purchase_type == FORWARD_CONTRACT: first delivery day (closed interval start); MUST be absent otherwise."
      - name: forward_delivery_end
        type: datetime
        source: input
        description: "Required data element for purchase_type == FORWARD_CONTRACT: last delivery day (closed interval end, inclusive); MUST be absent otherwise."
      - name: line_value_dollars
        type: number
        source: computed
        description: "round_half_up(head_count * avg_carcass_weight_cwt * avg_net_price_per_cwt, 2) — rounded at the record, before any sum."

  - name: WholesaleLot
    parent: null
    common_fields: false
    fields:
      - name: submission_id
        type: string
        source: input
        description: "FK -> Submission.id; owning filing. Lots are immutable once written."
      - name: product_class
        type: enum
        source: input
        description: "Wholesale product category, distinct from live-animal categories."
        constraints: "BOXED_BEEF_CHOICE_CUTOUT | BOXED_BEEF_SELECT_CUTOUT | GROUND_BEEF | TRIMMINGS"
      - name: sale_type
        type: enum
        source: input
        description: "Sale arrangement for the product lot."
        constraints: "NEGOTIATED | FORMULA_NET | DELIVERED"
      - name: load_count
        type: integer
        source: input
        description: "Number of loads in the lot."
        constraints: ">= 1"
      - name: total_pounds
        type: number
        source: input
        description: "Total product pounds in the lot, 2 decimals."
        constraints: "> 0"
      - name: price_per_cwt
        type: number
        source: input
        description: "Price per hundredweight of product, 2 decimals."
        constraints: "> 0"
      - name: lot_value_dollars
        type: number
        source: computed
        description: "round_half_up(total_pounds / 100 * price_per_cwt, 2)."

  - name: MarketReport
    parent: null
    common_fields: true
    fields:
      - name: reporting_window_id
        type: string
        source: input
        description: "FK -> ReportingWindow.id; window whose accepted submissions feed this report."
      - name: category
        type: enum
        source: input
        description: "Published market category."
        constraints: "LIVE_STEER_HEIFER | LIVE_COW_BULL | BOXED_BEEF_CUTOUT | WHOLESALE_PORK_CUTS"
      - name: weighting_variant
        type: enum
        source: input
        description: "Which weighted-average algorithm this report publishes."
        constraints: "HEAD_WEIGHTED | WEIGHT_WEIGHTED"
      - name: purchase_type_filter
        type: enum
        source: input
        description: "Which priced purchase types enter the price statistics."
        default: ALL_PRICED
        constraints: "ALL_PRICED | NEGOTIATED_ONLY"
      - name: aggregation_state
        type: enum
        source: system
        description: "Aggregation dimension of the report's parallel state."
        default: PENDING
        constraints: "PENDING | COMPUTED | STALE"
      - name: disclosure_state
        type: enum
        source: system
        description: "Confidentiality-review dimension of the report's parallel state."
        default: UNREVIEWED
        constraints: "UNREVIEWED | CLEARED | WITHHELD"
      - name: publication_state
        type: enum
        source: system
        description: "Publication dimension of the report's parallel state."
        default: UNPUBLISHED
        constraints: "UNPUBLISHED | PUBLISHED | WITHDRAWN"
      - name: weighted_average_price_per_cwt
        type: number
        source: computed
        description: "Weighted average price from calculation market_report_aggregation; null when the priced set is empty or the report is WITHHELD."
      - name: price_low_per_cwt
        type: number
        source: computed
        description: "Minimum price in the priced set; null when empty or WITHHELD."
      - name: price_high_per_cwt
        type: number
        source: computed
        description: "Maximum price in the priced set; null when empty or WITHHELD."
      - name: total_head
        type: integer
        source: computed
        description: "Volume in head over eligible submissions (all purchase types); null when WITHHELD."
      - name: total_pounds
        type: number
        source: computed
        description: "Volume in pounds over eligible wholesale lots; null when WITHHELD."
      - name: reporter_count
        type: integer
        source: computed
        description: "Count of DISTINCT Plant.reporting_entity_id across the eligible submissions; retained even when WITHHELD."
        default: 0
      - name: max_reporter_share_pct
        type: number
        source: computed
        description: "Largest single reporting entity's share of the volume metric, percent with 2 decimals."
        default: 0
      - name: source_submission_count
        type: integer
        source: computed
        description: "Count of eligible (ACCEPTED, class-matching) submissions folded into the last computation."
        default: 0
      - name: suppression_reason
        type: enum
        source: computed
        description: "First failing confidentiality guideline; null when disclosure_state != WITHHELD."
        constraints: "NO_ELIGIBLE_DATA | INSUFFICIENT_REPORTERS | DOMINANT_REPORTER | INSUFFICIENT_VOLUME | null"
      - name: computed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the last (re)computation; null while PENDING."
      - name: published_at
        type: datetime
        source: system
        description: "Logical-clock instant of publication; retained after withdrawal."

  - name: AuditCase
    parent: null
    common_fields: true
    fields:
      - name: submission_id
        type: string
        source: input
        description: "FK -> Submission.id; the accepted filing being verified against plant records."
      - name: materiality_pct
        type: number
        source: input
        description: "Per-case materiality threshold in percent, 2 decimals; a discrepancy is material only when the rate is strictly greater."
        default: 2.00
        constraints: "0.01..100.00"
      - name: status
        type: enum
        source: system
        description: "Audit lifecycle state; RECONCILED and DISCREPANCY are the two fork branches that join at CLOSED."
        default: OPEN
        constraints: "OPEN | FIELDWORK | RECONCILED | DISCREPANCY | CLOSED"
      - name: opened_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceAuditor who opened the case."
      - name: finalized_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceAuditor who finalized the case; segregation-of-duties comparand for penalty assessment."
      - name: verified_head
        type: integer
        source: input
        description: "Head count read from the plant's own records at finalize time."
        constraints: ">= 0"
      - name: verified_value_dollars
        type: number
        source: input
        description: "Transaction value read from the plant's own records at finalize time, 2 decimals."
        constraints: ">= 0"
      - name: head_discrepancy_rate_pct
        type: number
        source: computed
        description: "Percent deviation of reported head from verified head, 2 decimals."
      - name: value_discrepancy_rate_pct
        type: number
        source: computed
        description: "Percent deviation of reported value from verified value, 2 decimals."
      - name: finding
        type: enum
        source: computed
        description: "Materiality classification produced at finalize; null before finalize."
        constraints: "IMMATERIAL | MATERIAL_HEAD | MATERIAL_VALUE | MATERIAL_BOTH | null"
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant the case was closed; null until CLOSED."

  - name: PenaltyAssessment
    parent: null
    common_fields: true
    fields:
      - name: reporting_entity_id
        type: string
        source: input
        description: "FK -> ReportingEntity.id; firm being penalized."
      - name: audit_case_id
        type: string
        source: input
        description: "FK -> AuditCase.id; the audit that substantiates an INACCURATE_DATA violation, null otherwise."
      - name: submission_id
        type: string
        source: input
        description: "FK -> Submission.id; the late filing that substantiates a LATE_FILING violation, null otherwise."
      - name: violation_type
        type: enum
        source: input
        description: "Violation class being assessed."
        constraints: "LATE_FILING | INACCURATE_DATA | NON_REGISTRATION"
      - name: days_late
        type: integer
        source: computed
        description: "Copied from Submission.days_late for LATE_FILING; 0 otherwise."
        default: 0
      - name: base_amount_cents
        type: integer
        source: computed
        description: "Base penalty constant selected by violation_type."
        default: 0
      - name: repeat_index
        type: integer
        source: computed
        description: "Count of prior PenaltyAssessments of the SAME violation_type for this entity whose status IN {ASSESSED, PAID}, measured before this row is written."
        default: 0
      - name: day_tier_multiplier
        type: number
        source: computed
        description: "Late-day tier multiplier; 1.00 for non-LATE_FILING violations."
        default: 1.00
      - name: repeat_multiplier
        type: number
        source: computed
        description: "Recidivism multiplier selected by repeat_index."
        default: 1.00
      - name: volume_factor
        type: number
        source: computed
        description: "1 + min(0.50, governing Registration.measured_head / 1000000), 3 decimals; 1.000 when no governing registration exists."
        default: 1.000
      - name: suspension_surcharge
        type: number
        source: computed
        description: "1.25 when the governing Registration.status was SUSPENDED before this assessment, else 1.00."
        default: 1.00
      - name: assessed_amount_cents
        type: integer
        source: computed
        description: "Final penalty in cents after the multiplier chain, rounding, and the per-assessment cap."
        default: 0
      - name: points
        type: integer
        source: computed
        description: "Delinquency points contributed by this assessment, doubled when delinquency_tier_at_assessment == TIER_2."
        default: 0
      - name: delinquency_tier_at_assessment
        type: enum
        source: computed
        description: "Entity delinquency tier read BEFORE this assessment's points were added."
        constraints: "TIER_0 | TIER_1 | TIER_2"
      - name: status
        type: enum
        source: system
        description: "Settlement state."
        default: ASSESSED
        constraints: "ASSESSED | PAID | WAIVED"
      - name: assessed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the PenaltyOfficer who assessed the penalty."
      - name: waiver_reason
        type: string
        source: computed
        description: "Reason recorded at waiver; null unless status == WAIVED."
      - name: settled_at
        type: datetime
        source: system
        description: "Logical-clock instant of payment or waiver; null while ASSESSED."

  - name: MethodologyChange
    parent: null
    common_fields: true
    fields:
      - name: change_code
        type: string
        source: input
        description: "Public docket code for the methodology change."
        constraints: "unique across MethodologyChange"
      - name: affected_category
        type: enum
        source: input
        description: "MarketReport category whose weighting the change alters."
        constraints: "LIVE_STEER_HEIFER | LIVE_COW_BULL | BOXED_BEEF_CUTOUT | WHOLESALE_PORK_CUTS"
      - name: proposed_weighting_variant
        type: enum
        source: input
        description: "Weighting the affected category switches to on adoption."
        constraints: "HEAD_WEIGHTED | WEIGHT_WEIGHTED"
      - name: comment_period_end
        type: datetime
        source: input
        description: "Instant the public comment period closes; must be >= created_at + MIN_COMMENT_DAYS (30)."
      - name: effective_from
        type: datetime
        source: input
        description: "Instant the new methodology takes effect; must be >= comment_period_end + MIN_NOTICE_DAYS (30)."
      - name: status
        type: enum
        source: system
        description: "Rulemaking state."
        default: COMMENT_OPEN
        constraints: "COMMENT_OPEN | COMMENT_CLOSED | ADOPTED"
      - name: comment_count
        type: integer
        source: computed
        description: "Count of PublicComments filed against this change."
        default: 0
      - name: industry_notice_issued_at
        type: datetime
        source: system
        description: "Logical-clock instant the industry notification was issued (set at adoption); null before."
      - name: restated_report_count
        type: integer
        source: computed
        description: "Number of MarketReports re-weighted and marked STALE by the adoption cascade."
        default: 0

  - name: PublicComment
    parent: null
    common_fields: false
    fields:
      - name: methodology_change_id
        type: string
        source: input
        description: "FK -> MethodologyChange.id; docket the comment was filed against."
      - name: commenter_reference
        type: string
        source: input
        description: "Public identifier of the commenter."
        constraints: "1..120 chars"
      - name: comment_text
        type: string
        source: input
        description: "Comment body."
        constraints: "1..4000 chars"
      - name: stance
        type: enum
        source: input
        description: "Commenter position."
        constraints: "SUPPORT | OPPOSE | NEUTRAL"
      - name: received_at
        type: datetime
        source: system
        description: "Logical-clock instant the comment was received."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Registration
    initial_state: DRAFT
    terminal_states: [REVOKED]
    transitions:
      - from: DRAFT
        to: DETERMINED
        trigger: "POST /registrations/{id}/determine"
        actor: ProgramAdmin
        preconditions:
          - "registration.status == DRAFT"
          - "at least one Plant with reporting_entity_id == registration.reporting_entity_id and status IN {ACTIVE, IDLE} exists, else ERR_NO_ELIGIBLE_PLANTS"
          - "every such Plant's annual_head_history contains all years in [determination_year-5, determination_year-1], else ERR_INCOMPLETE_SLAUGHTER_HISTORY"
        side_effects:
          - "runs calculation reporter_threshold_determination -> sets measured_head, threshold_head, determination_outcome"
          - "sets Registration.basis_variant to the request's basis_variant when supplied, otherwise leaves the value chosen at creation"
      - from: DETERMINED
        to: UNDER_APPEAL
        trigger: "POST /registrations/{id}/appeal"
        actor: ReporterAgent
        preconditions:
          - "registration.status == DETERMINED"
          - "X-User-ID == registration.reporting_entity_id, else ERR_FOREIGN_REPORTING_ENTITY"
          - "registration.appeal_count < APPEAL_LIMIT (2), else ERR_APPEAL_LIMIT_REACHED"
        side_effects:
          - "increments Registration.appeal_count by 1"
      - from: UNDER_APPEAL
        to: DETERMINED
        trigger: "POST /registrations/{id}/redetermine"
        actor: ProgramAdmin
        preconditions:
          - "registration.status == UNDER_APPEAL"
        side_effects:
          - "overwrites Registration.basis_variant with the request value"
          - "re-runs calculation reporter_threshold_determination -> may flip determination_outcome between MANDATORY and EXEMPT for identical plant data"
        note: "Closes the bounded appeal cycle DETERMINED -> UNDER_APPEAL -> DETERMINED."
      - from: DETERMINED
        to: ACTIVE
        trigger: "POST /registrations/{id}/activate"
        actor: ProgramAdmin
        preconditions:
          - "registration.status == DETERMINED"
          - "registration.determination_outcome == MANDATORY, else ERR_ENTITY_EXEMPT"
          - "ReportingEntity.outstanding_penalty_cents == 0, else ERR_OUTSTANDING_PENALTY_BLOCKS_ACTIVATION"
        side_effects:
          - "mints registration_number as MPR-{determination_year}-{N:04d} where N = 1 + count of Registrations with the same determination_year and registration_number IS NOT NULL, counted before this assignment (ordering by created_at ASC)"
          - "sets effective_from to the logical clock"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /registrations/{id}/suspend"
        actor: ProgramAdmin
        preconditions:
          - "registration.status == ACTIVE"
        side_effects:
          - "sets suspended_reason = ADMIN_ACTION (the endpoint accepts only this value)"
          - "cascades: every Submission whose plant belongs to this reporting entity and whose status IN {DRAFT, SUBMITTED} transitions to VOIDED"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: POST /penalty-assessments raises ReportingEntity.delinquency_points into TIER_2"
        actor: system
        preconditions:
          - "tier(delinquency_points before the assessment) != TIER_2 AND tier(delinquency_points after the assessment) == TIER_2"
        side_effects:
          - "sets suspended_reason = DELINQUENCY_TIER_BREACH"
          - "cascades: every Submission whose plant belongs to this reporting entity and whose status IN {DRAFT, SUBMITTED} transitions to VOIDED"
        note: "Hop 2 of cascade chain penalty_tier_breach_chain."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system: POST /penalty-assessments/{id}/waive drops ReportingEntity.delinquency_points out of TIER_2"
        actor: system
        preconditions:
          - "registration.suspended_reason == DELINQUENCY_TIER_BREACH"
          - "tier(delinquency_points after the waiver) != TIER_2"
        side_effects:
          - "clears suspended_reason to null"
          - "leaves registration_number and effective_from unchanged"
        note: "Compensating hop; an ADMIN_ACTION suspension is NOT reinstated by a waiver (conditional cascade)."
      - from: SUSPENDED
        to: REVOKED
        trigger: "system: POST /penalty-assessments while the governing registration is already SUSPENDED and the post-assessment tier is TIER_2"
        actor: system
        preconditions:
          - "registration.status == SUSPENDED"
          - "tier(delinquency_points after the assessment) == TIER_2"
        side_effects:
          - "clears suspended_reason to null"
          - "cascades: every Submission whose plant belongs to this reporting entity and whose status IN {DRAFT, SUBMITTED} transitions to VOIDED"

  - entity: ReportingWindow
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /reporting-windows/{id}/lock"
        actor: ProgramAdmin
        preconditions:
          - "window.status == OPEN"
          - "logical clock >= window.period_end, else ERR_WINDOW_PERIOD_NOT_ENDED"
          - "no Submission for this window has status IN {SUBMITTED, RESUBMITTED}, else ERR_PENDING_SUBMISSIONS_EXIST"
        side_effects:
          - "no further Submission may be created for this window (POST /submissions requires status == OPEN)"
      - from: LOCKED
        to: PUBLISHED
        trigger: "system: POST /market-reports/{id}/publish"
        actor: system
        preconditions:
          - "the publishing MarketReport belongs to this window"
        side_effects: []
      - from: PUBLISHED
        to: LOCKED
        trigger: "system: the last MarketReport of this window with publication_state == PUBLISHED transitions to WITHDRAWN"
        actor: system
        preconditions:
          - "no remaining MarketReport of this window has publication_state == PUBLISHED"
        side_effects: []
        note: "Closes the publication cycle LOCKED -> PUBLISHED -> LOCKED; hop 4 of cascade chain audit_discrepancy_chain."

  - entity: Submission
    initial_state: DRAFT
    terminal_states: [REJECTED, SUPERSEDED, VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /submissions/{id}/submit"
        actor: ReporterAgent
        preconditions:
          - "submission.status == DRAFT"
          - "X-User-ID == Plant.reporting_entity_id for submission.plant_id, else ERR_FOREIGN_REPORTING_ENTITY"
          - "window.status == OPEN, else ERR_WINDOW_NOT_OPEN"
          - "a Registration exists for the plant's reporting entity with determination_year == calendar year of window.period_start, determination_outcome == MANDATORY and status == ACTIVE, else ERR_REGISTRATION_NOT_ACTIVE"
          - "submission has at least one TransactionRecord (LIVE_ANIMAL windows) or at least one WholesaleLot (BOXED_BEEF / WHOLESALE_CUTS windows), else ERR_EMPTY_SUBMISSION"
        side_effects:
          - "sets submitted_at to the logical clock"
          - "runs calculation submission_lateness -> lateness_minutes, is_late, days_late"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /submissions/{id}/review with decision == ACCEPT"
        actor: ProgramAdmin
        preconditions:
          - "submission.status IN {SUBMITTED, RESUBMITTED}"
          - "when supersedes_submission_id != null: the target submission's status == ACCEPTED, else ERR_SUPERSEDE_TARGET_NOT_ACCEPTED"
        side_effects:
          - "sets accepted_at and review_note"
          - "when supersedes_submission_id != null: target Submission ACCEPTED -> SUPERSEDED"
          - "recomputes ReportingWindow.accepted_submission_count and total_head_reported (calculation window_head_ledger)"
          - "every MarketReport of this window with aggregation_state == COMPUTED transitions to AGG_STALE, which forces its disclosure_state back to UNREVIEWED and withdraws it when PUBLISHED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /submissions/{id}/review with decision == REJECT"
        actor: ProgramAdmin
        preconditions:
          - "submission.status IN {SUBMITTED, RESUBMITTED}"
        side_effects:
          - "sets review_note; leaves the window ledger untouched (a rejected filing was never counted)"
      - from: ACCEPTED
        to: UNDER_CORRECTION
        trigger: "POST /submissions/{id}/open-correction"
        actor: ProgramAdmin
        preconditions:
          - "submission.status == ACCEPTED"
          - "submission.resubmission_count < RESUBMISSION_LIMIT (2), else ERR_RESUBMISSION_LIMIT_REACHED"
          - "logical clock <= window.correction_deadline_utc, else ERR_CORRECTION_WINDOW_CLOSED"
        side_effects:
          - "sets correction_reason"
          - "recomputes ReportingWindow.accepted_submission_count and total_head_reported (this submission's head leaves the ledger)"
          - "every MarketReport of this window with aggregation_state == COMPUTED transitions to AGG_STALE"
      - from: ACCEPTED
        to: UNDER_CORRECTION
        trigger: "system: POST /audit-cases/{id}/finalize produces a material finding"
        actor: system
        preconditions:
          - "audit_case.submission_id == submission.id"
          - "audit_case.finding IN {MATERIAL_HEAD, MATERIAL_VALUE, MATERIAL_BOTH}"
        side_effects:
          - "sets correction_reason = 'AUDIT_' + audit_case.finding"
          - "recomputes ReportingWindow.accepted_submission_count and total_head_reported"
          - "every MarketReport of this window with aggregation_state == COMPUTED transitions to AGG_STALE (hop 3 of audit_discrepancy_chain)"
        note: "Hop 2 of cascade chain audit_discrepancy_chain; bypasses the correction-deadline precondition because the trigger is regulatory, not voluntary."
      - from: UNDER_CORRECTION
        to: RESUBMITTED
        trigger: "POST /submissions/{id}/resubmit"
        actor: ReporterAgent
        preconditions:
          - "submission.status == UNDER_CORRECTION"
          - "X-User-ID == Plant.reporting_entity_id for submission.plant_id, else ERR_FOREIGN_REPORTING_ENTITY"
        side_effects:
          - "increments resubmission_count by 1"
          - "sets submitted_at to the logical clock and re-runs calculation submission_lateness"
      - from: RESUBMITTED
        to: ACCEPTED
        trigger: "POST /submissions/{id}/review with decision == ACCEPT"
        actor: ProgramAdmin
        preconditions:
          - "submission.status == RESUBMITTED"
        side_effects:
          - "sets accepted_at and review_note"
          - "recomputes ReportingWindow.accepted_submission_count and total_head_reported (this submission's head re-enters the ledger)"
          - "every MarketReport of this window with aggregation_state == COMPUTED transitions to AGG_STALE"
        note: "Closes the bounded correction cycle ACCEPTED -> UNDER_CORRECTION -> RESUBMITTED -> ACCEPTED."
      - from: RESUBMITTED
        to: REJECTED
        trigger: "POST /submissions/{id}/review with decision == REJECT"
        actor: ProgramAdmin
        preconditions:
          - "submission.status == RESUBMITTED"
        side_effects:
          - "sets review_note; the head stays out of the window ledger"
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system: another Submission carrying supersedes_submission_id == this.id is ACCEPTED"
        actor: system
        preconditions:
          - "submission.status == ACCEPTED"
        side_effects:
          - "recomputes ReportingWindow.accepted_submission_count and total_head_reported so the superseded head is counted exactly once"
      - from: DRAFT
        to: VOIDED
        trigger: "system: the reporting entity's Registration transitions to SUSPENDED or REVOKED"
        actor: system
        preconditions:
          - "submission.status IN {DRAFT, SUBMITTED}"
        side_effects:
          - "no ledger change (neither DRAFT nor SUBMITTED head was ever counted)"
        note: "Hop 3 of cascade chain penalty_tier_breach_chain; SUBMITTED -> VOIDED follows the same rule."
      - from: SUBMITTED
        to: VOIDED
        trigger: "system: the reporting entity's Registration transitions to SUSPENDED or REVOKED"
        actor: system
        preconditions:
          - "submission.status == SUBMITTED"
        side_effects:
          - "no ledger change"

  - entity: MarketReport
    initial_state: "AGG_PENDING + DISC_UNREVIEWED + PUB_UNPUBLISHED"
    terminal_states: []
    transitions:
      - from: AGG_PENDING
        to: AGG_COMPUTED
        trigger: "POST /market-reports/{id}/compute"
        actor: MarketAnalyst
        preconditions:
          - "report.aggregation_state IN {PENDING, STALE}"
          - "report.category is compatible with window.species and window.report_class, else ERR_SPECIES_CLASS_MISMATCH"
        side_effects:
          - "runs calculation market_report_aggregation -> weighted_average_price_per_cwt, price_low_per_cwt, price_high_per_cwt, total_head, total_pounds, reporter_count, max_reporter_share_pct, source_submission_count, computed_at"
      - from: AGG_STALE
        to: AGG_COMPUTED
        trigger: "POST /market-reports/{id}/compute"
        actor: MarketAnalyst
        preconditions:
          - "report.aggregation_state == STALE"
        side_effects:
          - "re-runs calculation market_report_aggregation over the CURRENT set of ACCEPTED submissions"
          - "forces disclosure_state back to UNREVIEWED (a recomputed aggregate must be re-reviewed)"
      - from: AGG_COMPUTED
        to: AGG_STALE
        trigger: "system: any Submission of this window enters or leaves status ACCEPTED, or MethodologyChange adoption re-weights this category"
        actor: system
        preconditions:
          - "report.aggregation_state == COMPUTED"
        side_effects:
          - "forces disclosure_state from CLEARED or WITHHELD back to UNREVIEWED and clears suppression_reason"
          - "when publication_state == PUBLISHED it transitions to WITHDRAWN"
      - from: DISC_UNREVIEWED
        to: DISC_CLEARED
        trigger: "POST /market-reports/{id}/disclosure-review"
        actor: MarketAnalyst
        preconditions:
          - "report.aggregation_state == COMPUTED, else ERR_REPORT_NOT_COMPUTED"
          - "report.disclosure_state == UNREVIEWED"
          - "calculation confidentiality_suppression finds no failing guideline"
        side_effects:
          - "leaves suppression_reason null and all price/volume metrics intact"
      - from: DISC_UNREVIEWED
        to: DISC_WITHHELD
        trigger: "POST /market-reports/{id}/disclosure-review"
        actor: MarketAnalyst
        preconditions:
          - "report.aggregation_state == COMPUTED, else ERR_REPORT_NOT_COMPUTED"
          - "report.disclosure_state == UNREVIEWED"
          - "calculation confidentiality_suppression finds a failing guideline"
        side_effects:
          - "sets suppression_reason to the FIRST failing guideline"
          - "masks weighted_average_price_per_cwt, price_low_per_cwt, price_high_per_cwt, total_head and total_pounds to null; reporter_count and max_reporter_share_pct are retained"
      - from: PUB_UNPUBLISHED
        to: PUB_PUBLISHED
        trigger: "POST /market-reports/{id}/publish"
        actor: MarketAnalyst
        preconditions:
          - "report.publication_state == UNPUBLISHED, else ERR_REPORT_ALREADY_PUBLISHED"
          - "report.aggregation_state == COMPUTED, else ERR_REPORT_NOT_COMPUTED"
          - "report.disclosure_state != UNREVIEWED, else ERR_DISCLOSURE_NOT_REVIEWED"
          - "report.disclosure_state == CLEARED, else ERR_CONFIDENTIALITY_SUPPRESSION_REQUIRED"
          - "logical clock >= window.publication_release_utc, else ERR_PUBLICATION_BEFORE_RELEASE_TIME"
          - "window.status IN {LOCKED, PUBLISHED}, else ERR_WINDOW_NOT_LOCKED"
        side_effects:
          - "sets published_at to the logical clock"
          - "ReportingWindow LOCKED -> PUBLISHED"
      - from: PUB_PUBLISHED
        to: PUB_WITHDRAWN
        trigger: "system: aggregation_state COMPUTED -> STALE while publication_state == PUBLISHED"
        actor: system
        preconditions:
          - "report.publication_state == PUBLISHED"
        side_effects:
          - "retains published_at"
          - "when no other MarketReport of the window remains PUBLISHED, ReportingWindow PUBLISHED -> LOCKED"
        note: "Hop 4 of cascade chain audit_discrepancy_chain."

  - entity: AuditCase
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: FIELDWORK
        trigger: "POST /audit-cases/{id}/start-fieldwork"
        actor: ComplianceAuditor
        preconditions:
          - "audit_case.status == OPEN"
        side_effects: []
      - from: FIELDWORK
        to: RECONCILED
        trigger: "POST /audit-cases/{id}/finalize with an immaterial result"
        actor: ComplianceAuditor
        preconditions:
          - "audit_case.status == FIELDWORK"
          - "calculation audit_discrepancy yields finding == IMMATERIAL"
        side_effects:
          - "sets finalized_by_user_id, head_discrepancy_rate_pct, value_discrepancy_rate_pct, finding = IMMATERIAL"
          - "the audited Submission is left ACCEPTED and no MarketReport is invalidated"
        note: "Branch A of the fork; side-effect set is deliberately disjoint from branch B."
      - from: FIELDWORK
        to: DISCREPANCY
        trigger: "POST /audit-cases/{id}/finalize with a material result"
        actor: ComplianceAuditor
        preconditions:
          - "audit_case.status == FIELDWORK"
          - "calculation audit_discrepancy yields finding IN {MATERIAL_HEAD, MATERIAL_VALUE, MATERIAL_BOTH}"
        side_effects:
          - "sets finalized_by_user_id, head_discrepancy_rate_pct, value_discrepancy_rate_pct, finding"
          - "the audited Submission ACCEPTED -> UNDER_CORRECTION (hop 2 of audit_discrepancy_chain)"
        note: "Branch B of the fork; only this branch unlocks POST /penalty-assessments with audit_case_id."
      - from: RECONCILED
        to: CLOSED
        trigger: "POST /audit-cases/{id}/close"
        actor: ComplianceAuditor
        preconditions:
          - "audit_case.status IN {RECONCILED, DISCREPANCY}"
        side_effects:
          - "sets closed_at"
      - from: DISCREPANCY
        to: CLOSED
        trigger: "POST /audit-cases/{id}/close"
        actor: ComplianceAuditor
        preconditions:
          - "audit_case.status IN {RECONCILED, DISCREPANCY}"
        side_effects:
          - "sets closed_at; a penalty may still be assessed against a CLOSED discrepant case"
        note: "Join point of the fork."

  - entity: PenaltyAssessment
    initial_state: ASSESSED
    terminal_states: [PAID, WAIVED]
    transitions:
      - from: ASSESSED
        to: PAID
        trigger: "POST /penalty-assessments/{id}/pay"
        actor: PenaltyOfficer
        preconditions:
          - "assessment.status == ASSESSED, else ERR_PENALTY_ALREADY_SETTLED"
          - "paid_amount_cents == assessment.assessed_amount_cents, else ERR_PAYMENT_AMOUNT_MISMATCH"
        side_effects:
          - "sets settled_at"
          - "ReportingEntity.paid_penalty_cents += assessed_amount_cents and outstanding_penalty_cents -= assessed_amount_cents (delinquency_points unchanged: paying does not erase the violation)"
      - from: ASSESSED
        to: WAIVED
        trigger: "POST /penalty-assessments/{id}/waive"
        actor: PenaltyOfficer
        preconditions:
          - "assessment.status == ASSESSED, else ERR_PENALTY_ALREADY_SETTLED"
        side_effects:
          - "sets waiver_reason and settled_at"
          - "ReportingEntity.waived_penalty_cents += assessed_amount_cents and outstanding_penalty_cents -= assessed_amount_cents"
          - "ReportingEntity.delinquency_points -= assessment.points (exact compensation of the points booked at assessment)"
          - "when the entity's governing Registration is SUSPENDED with suspended_reason == DELINQUENCY_TIER_BREACH and the post-waiver tier != TIER_2, that Registration SUSPENDED -> ACTIVE"

  - entity: MethodologyChange
    initial_state: COMMENT_OPEN
    terminal_states: [ADOPTED]
    transitions:
      - from: COMMENT_OPEN
        to: COMMENT_CLOSED
        trigger: "POST /methodology-changes/{id}/close-comment"
        actor: ProgramAdmin
        preconditions:
          - "change.status == COMMENT_OPEN"
          - "logical clock >= change.comment_period_end, else ERR_COMMENT_PERIOD_NOT_ENDED"
        side_effects: []
      - from: COMMENT_CLOSED
        to: ADOPTED
        trigger: "POST /methodology-changes/{id}/adopt"
        actor: ProgramAdmin
        preconditions:
          - "change.status == COMMENT_CLOSED"
          - "change.comment_count >= 1, else ERR_NO_PUBLIC_COMMENTS"
        side_effects:
          - "sets industry_notice_issued_at to the logical clock"
          - "for every MarketReport with category == affected_category and publication_state != WITHDRAWN: weighting_variant := proposed_weighting_variant"
          - "each such MarketReport whose aggregation_state == COMPUTED transitions to AGG_STALE (which forces disclosure_state -> UNREVIEWED and withdraws a PUBLISHED report)"
          - "sets restated_report_count to the number of reports whose weighting_variant was rewritten"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: submission-create-stale-window
    parent_entity: ReportingWindow
    write_endpoint: "POST /submissions"
    occ_field: "expected_window_version"
    description: |
      Creating a Submission against a ReportingWindow whose version has advanced
      since the client last read it is rejected. A filing decision depends on the
      window's collected state (accepted_submission_count, total_head_reported,
      and whether the filing must supersede an already-accepted report), so a
      creation carrying a stale window version is refused rather than silently
      filed against an out-of-date view.
    error_id: ERR_STALE_WINDOW_VERSION
    http_status: 412

  - rule_id: penalty-create-stale-entity
    parent_entity: ReportingEntity
    write_endpoint: "POST /penalty-assessments"
    occ_field: "expected_reporting_entity_version"
    description: |
      Assessing a PenaltyAssessment against a ReportingEntity whose version has
      advanced since the officer last read it is rejected. The assessed amount
      and point escalation are functions of the entity's delinquency_points and
      ledger balances at assessment time, which another assessment (legitimately
      stacking under the recidivism rule) has just changed, so the officer's view
      is stale.
    error_id: ERR_STALE_ENTITY_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: reporter_threshold_determination
    trigger: "POST /registrations/{id}/determine and POST /registrations/{id}/redetermine (Registration DRAFT->DETERMINED and UNDER_APPEAL->DETERMINED)"
    algorithm: threshold
    formula: |
      # --- eligible plants -------------------------------------------------
      plants = [P for P in Plant
                if P.reporting_entity_id == registration.reporting_entity_id
                and P.status IN {ACTIVE, IDLE}]          # CLOSED plants excluded
      if plants is empty: reject ERR_NO_ELIGIBLE_PLANTS
      years = [determination_year-5, determination_year-4, determination_year-3,
               determination_year-2, determination_year-1]           # 5 years, oldest first
      if any P in plants lacks any y in years in P.annual_head_history:
          reject ERR_INCOMPLETE_SLAUGHTER_HISTORY

      # --- variant selection (dual variant) --------------------------------
      if registration.basis_variant == FIVE_YEAR_AVERAGE:
          total = sum over P in plants, over y in years of P.annual_head_history[y]
          measured_head = floor(total / 5)        # ONE division of the pooled total, floored
      elif registration.basis_variant == PRIOR_YEAR_ACTUAL:
          measured_head = sum over P in plants of P.annual_head_history[determination_year-1]

      threshold_head = THRESHOLD_HEAD_BY_SPECIES[ReportingEntity.species_scope]
      determination_outcome = MANDATORY if measured_head >= threshold_head else EXEMPT
    input_set: "Plants of the registration's reporting entity with status IN {ACTIVE, IDLE}; the five calendar years strictly before determination_year. CLOSED plants and years outside that span never contribute."
    constants:
      THRESHOLD_HEAD_BY_SPECIES: { CATTLE: 125000, SWINE: 100000, LAMB: 35000 }
      LOOKBACK_YEARS: 5
    precision: "measured_head is an integer; the five-year variant floors AFTER pooling all plants and all years (never per plant, never per year)"
    variants:
      - name: FIVE_YEAR_AVERAGE
        when: "registration.basis_variant == FIVE_YEAR_AVERAGE (the default program basis)"
        difference: "Averages the pooled five-year total, so a firm that grew sharply in the most recent year can measure BELOW threshold and be EXEMPT."
      - name: PRIOR_YEAR_ACTUAL
        when: "registration.basis_variant == PRIOR_YEAR_ACTUAL (elected at creation or imposed on redetermination after an appeal)"
        difference: "Uses only determination_year-1, so the same plant history can measure ABOVE threshold and be MANDATORY. Identical inputs, divergent outcome."

  - name: market_report_aggregation
    trigger: "POST /market-reports/{id}/compute (MarketReport AGG_PENDING->AGG_COMPUTED and AGG_STALE->AGG_COMPUTED)"
    algorithm: weighted_scoring
    formula: |
      # --- eligible submissions -------------------------------------------
      subs = [S for S in Submission
              if S.reporting_window_id == report.reporting_window_id
              and S.status == ACCEPTED]        # SUBMITTED / RESUBMITTED / UNDER_CORRECTION /
                                               # REJECTED / SUPERSEDED / VOIDED all excluded
      source_submission_count = count(subs)

      if window.report_class == LIVE_ANIMAL:
          items      = all TransactionRecords of subs
          priced     = [t in items if t.purchase_type != PACKER_OWNED
                        and (report.purchase_type_filter == ALL_PRICED
                             or t.purchase_type IN {NEGOTIATED, NEGOTIATED_GRID})]
          total_head   = sum of t.head_count over items          # PACKER_OWNED counts in VOLUME
          total_pounds = null
          volume_metric_by_entity[e] = sum of t.head_count over items whose
                                       Plant.reporting_entity_id == e
          if report.weighting_variant == HEAD_WEIGHTED:
              w(t) = t.head_count
          else:  # WEIGHT_WEIGHTED
              w(t) = t.head_count * t.avg_carcass_weight_cwt      # UNROUNDED product
          p(t) = t.avg_net_price_per_cwt
      else:  # BOXED_BEEF or WHOLESALE_CUTS
          items  = all WholesaleLots of subs
          priced = items                                          # every lot is priced
          total_head   = null
          total_pounds = sum of l.total_pounds over items
          volume_metric_by_entity[e] = sum of l.total_pounds over items whose
                                       Plant.reporting_entity_id == e
          w(l) = l.load_count if report.weighting_variant == HEAD_WEIGHTED
                 else l.total_pounds
          p(l) = l.price_per_cwt

      reporter_count = count of DISTINCT Plant.reporting_entity_id over subs
      volume_total   = total_head if window.report_class == LIVE_ANIMAL else total_pounds
      max_reporter_share_pct =
          0.00 if volume_total in {null, 0}
          else round_half_up(100 * max(volume_metric_by_entity.values()) / volume_total, 2)

      # --- price statistics (empty-set edge) -------------------------------
      if priced is empty:
          weighted_average_price_per_cwt = null
          price_low_per_cwt  = null
          price_high_per_cwt = null
      else:
          numerator   = sum over priced of ( w(x) * p(x) )   # UNROUNDED terms
          denominator = sum over priced of   w(x)            # UNROUNDED terms
          weighted_average_price_per_cwt = round_half_up(numerator / denominator, 2)
          price_low_per_cwt  = min over priced of p(x)
          price_high_per_cwt = max over priced of p(x)
      computed_at = logical clock
    input_set: "Only Submissions in status ACCEPTED for the report's window. PACKER_OWNED transactions enter total_head, reporter_count and max_reporter_share_pct but NEVER the price statistics. purchase_type_filter == NEGOTIATED_ONLY narrows the priced set further to NEGOTIATED and NEGOTIATED_GRID."
    constants: {}
    precision: |
      2 decimal places, round_half_up, applied EXACTLY ONCE to the final quotient.
      Rounding order is pinned: per-item products w(x)*p(x) and the weights w(x)
      are accumulated at full precision. The alternative order — rounding each
      submission's own weighted average to 2 decimals and then combining those
      rounded averages — is explicitly NOT the program methodology and yields a
      different cent value. This is the OPPOSITE order from calculation
      submission_reported_totals, which rounds per record before summing.
    variants:
      - name: HEAD_WEIGHTED
        when: "report.weighting_variant == HEAD_WEIGHTED"
        difference: "Weights each live-animal transaction by head_count (each load_count for wholesale lots), so light-carcass lots pull the average down as hard as heavy ones."
      - name: WEIGHT_WEIGHTED
        when: "report.weighting_variant == WEIGHT_WEIGHTED"
        difference: "Weights each live-animal transaction by head_count * avg_carcass_weight_cwt (total_pounds for wholesale lots), so heavier carcasses dominate. Identical transactions, different published average."

  - name: submission_reported_totals
    trigger: "POST /submissions/{id}/transactions and POST /submissions/{id}/wholesale-lots"
    algorithm: aggregation
    formula: |
      # per-record values are rounded FIRST, then summed (pinned order)
      line_value_dollars(t) = round_half_up(t.head_count
                                            * t.avg_carcass_weight_cwt
                                            * t.avg_net_price_per_cwt, 2)
      lot_value_dollars(l)  = round_half_up(l.total_pounds / 100 * l.price_per_cwt, 2)

      submission.reported_head          = sum of t.head_count over its TransactionRecords
      submission.reported_cwt           = sum of round_half_up(t.head_count
                                            * t.avg_carcass_weight_cwt, 2) over them
      submission.reported_value_dollars = sum of line_value_dollars(t) over them
                                          + sum of lot_value_dollars(l) over its WholesaleLots
      submission.reported_pounds        = sum of l.total_pounds over its WholesaleLots
      submission.reported_load_count    = sum of l.load_count over its WholesaleLots
    input_set: "Every TransactionRecord and WholesaleLot attached to the submission, regardless of purchase_type or submission status; line items are immutable and append-only."
    constants: {}
    precision: |
      2 decimal places, round_half_up, applied PER RECORD before summation
      (round-then-sum). This is deliberately the opposite order from
      market_report_aggregation: two transactions each valued 2427.1750 book as
      2427.18 + 2427.18 = 4854.36, whereas sum-then-round would produce 4854.35.
      The booked figure 4854.36 is what the audit compares against plant records.

  - name: submission_lateness
    trigger: "POST /submissions/{id}/submit and POST /submissions/{id}/resubmit"
    algorithm: threshold
    formula: |
      delta_minutes   = floor((logical_clock - window.submission_deadline_utc) / 60 seconds)
      lateness_minutes = max(0, delta_minutes)
      is_late          = lateness_minutes > 0
      days_late        = ceil(lateness_minutes / MINUTES_PER_DAY)
    input_set: "The submission's own ReportingWindow.submission_deadline_utc and the logical clock at submit/resubmit time; a resubmit overwrites the earlier lateness figures."
    constants:
      MINUTES_PER_DAY: 1440
    precision: "Integer minutes, floored; exactly at the deadline lateness_minutes == 0 and is_late == false (strict > comparison)."

  - name: forward_commitment_peak
    trigger: "POST /submissions/{id}/transactions when purchase_type == FORWARD_CONTRACT"
    algorithm: interval_merge
    formula: |
      # closed intervals: two commitments collide when they share ANY calendar day,
      # including a single shared endpoint day.
      candidates = [t for t in TransactionRecord
                    if t.purchase_type == FORWARD_CONTRACT
                    and Submission(t).plant_id == Submission(new).plant_id
                    and Submission(t).status IN {DRAFT, SUBMITTED, ACCEPTED,
                                                 UNDER_CORRECTION, RESUBMITTED}]
      probe_days = { t.forward_delivery_start for t in candidates + [new] }
      peak = max over d in probe_days of
                 sum of t.head_count over (candidates + [new])
                 where t.forward_delivery_start <= d <= t.forward_delivery_end
      if peak > Plant.forward_commitment_cap_head: reject ERR_FORWARD_COMMITMENT_CAP_EXCEEDED
    input_set: "FORWARD_CONTRACT records of the SAME plant across every submission whose status is non-terminal (REJECTED, SUPERSEDED and VOIDED filings release their commitments); the probe set is the interval start days, where the running total can only step up."
    constants: {}
    precision: |
      Closed-interval semantics with aggregate capacity: overlap is permitted up
      to the cap, so this is NOT a mutual-exclusion rule. Contrast the
      window-calendar rule (validation priority 36, ERR_WINDOW_PERIOD_OVERLAP),
      which uses half-open [start, end) intervals and forbids ANY intersection.

  - name: confidentiality_suppression
    trigger: "POST /market-reports/{id}/disclosure-review (MarketReport DISC_UNREVIEWED->DISC_CLEARED or ->DISC_WITHHELD)"
    algorithm: threshold
    formula: |
      volume_metric = report.total_head   if window.report_class == LIVE_ANIMAL
                      else report.total_pounds
      # evaluated in this exact order; the FIRST failure wins
      if report.weighted_average_price_per_cwt is null:      # priced set was empty
          suppression_reason = NO_ELIGIBLE_DATA
      elif report.reporter_count < window.min_reporter_count:
          suppression_reason = INSUFFICIENT_REPORTERS
      elif report.max_reporter_share_pct > window.max_single_reporter_share_pct:
          suppression_reason = DOMINANT_REPORTER
      elif volume_metric < window.min_reported_head:
          suppression_reason = INSUFFICIENT_VOLUME
      else:
          suppression_reason = null
      disclosure_state = CLEARED if suppression_reason is null else WITHHELD
      if disclosure_state == WITHHELD:
          weighted_average_price_per_cwt = null
          price_low_per_cwt  = null
          price_high_per_cwt = null
          total_head         = null
          total_pounds       = null
          # reporter_count and max_reporter_share_pct are retained for the audit trail
    input_set: "The report's own computed aggregate fields plus the three guideline fields on its ReportingWindow (min_reporter_count, max_single_reporter_share_pct, min_reported_head)."
    constants: {}
    precision: |
      Boundaries are exact: reporter_count == min_reporter_count PASSES (strict <
      fails), max_reporter_share_pct == max_single_reporter_share_pct PASSES
      (strict > fails), volume_metric == min_reported_head PASSES (strict < fails).

  - name: audit_discrepancy
    trigger: "POST /audit-cases/{id}/finalize (AuditCase FIELDWORK->RECONCILED or ->DISCREPANCY)"
    algorithm: threshold
    formula: |
      reported_head  = Submission(audit_case.submission_id).reported_head
      reported_value = Submission(audit_case.submission_id).reported_value_dollars

      head_discrepancy_rate_pct =
          0.00   if verified_head == 0 and reported_head == 0
          100.00 if verified_head == 0 and reported_head != 0
          else round_half_up(100 * abs(verified_head - reported_head) / verified_head, 2)
      value_discrepancy_rate_pct =
          0.00   if verified_value_dollars == 0 and reported_value == 0
          100.00 if verified_value_dollars == 0 and reported_value != 0
          else round_half_up(100 * abs(verified_value_dollars - reported_value)
                                 / verified_value_dollars, 2)

      head_material  = head_discrepancy_rate_pct  > audit_case.materiality_pct
      value_material = value_discrepancy_rate_pct > audit_case.materiality_pct
      finding = MATERIAL_BOTH  if head_material and value_material
                MATERIAL_HEAD  if head_material and not value_material
                MATERIAL_VALUE if value_material and not head_material
                IMMATERIAL     otherwise
    input_set: "The audited Submission's booked totals (which use the round-then-sum order of submission_reported_totals) versus the verified figures supplied at finalize; the plant's own records are the denominator."
    constants: {}
    precision: |
      Rates carry 2 decimals, round_half_up; the denominator is always the
      VERIFIED figure. Materiality uses a strict >, so a rate exactly equal to
      materiality_pct is IMMATERIAL and the case reconciles.

  - name: penalty_assessment_amount
    trigger: "POST /penalty-assessments"
    algorithm: tiered_pricing
    formula: |
      # step 1-3 read PRE-assessment state only (see delinquency_points_and_tier)
      base_amount_cents = BASE_CENTS_BY_VIOLATION[violation_type]
      days_late         = Submission(submission_id).days_late if violation_type == LATE_FILING else 0
      day_tier_multiplier =
          1.00 if violation_type != LATE_FILING
          else 1.00 if 1 <= days_late <= 2
          else 1.50 if 3 <= days_late <= 7
          else 2.25 if days_late >= 8
          else 1.00                                   # days_late == 0
      repeat_index = count of PenaltyAssessment rows with the same
                     reporting_entity_id AND the same violation_type AND
                     status IN {ASSESSED, PAID}, counted BEFORE this row is written
      repeat_multiplier = 1.00 if repeat_index == 0
                          1.50 if repeat_index == 1
                          2.00 if repeat_index == 2
                          3.00 if repeat_index >= 3
      governing_registration = the Registration of this reporting entity with
          determination_year == calendar year of the logical clock and
          status IN {ACTIVE, SUSPENDED}; when several qualify take the one with the
          greatest created_at; when none qualifies volume_factor = 1.000 and
          suspension_surcharge = 1.00
      volume_factor = round_half_up(1 + min(0.500,
                        governing_registration.measured_head / 1000000), 3)
      suspension_surcharge = 1.25 if governing_registration.status == SUSPENDED
                             (read BEFORE this assessment) else 1.00
      raw = base_amount_cents * day_tier_multiplier * repeat_multiplier
                              * volume_factor * suspension_surcharge
      assessed_amount_cents = min(PER_ASSESSMENT_CAP_CENTS,
                                  round_half_up(raw, 0))     # round to whole cents FIRST, cap SECOND
    input_set: "The entity's own prior assessments (WAIVED ones are invisible to repeat_index), the governing Registration's measured_head and pre-assessment status, and — for LATE_FILING — the referenced Submission's days_late."
    constants:
      BASE_CENTS_BY_VIOLATION: { LATE_FILING: 250000, INACCURATE_DATA: 500000, NON_REGISTRATION: 1000000 }
      PER_ASSESSMENT_CAP_CENTS: 2000000
      VOLUME_FACTOR_HEAD_DIVISOR: 1000000
      VOLUME_FACTOR_MAX_UPLIFT: 0.500
    precision: |
      volume_factor carries 3 decimals; the product is rounded to whole cents
      with round_half_up and only THEN clamped by PER_ASSESSMENT_CAP_CENTS.
      Clamping before rounding is not equivalent at the cap boundary.

  - name: delinquency_points_and_tier
    trigger: "POST /penalty-assessments, POST /penalty-assessments/{id}/waive"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is PINNED because the amount depends on the tier, the
      # tier depends on the point total, and the point total depends on this very
      # assessment. The assessment never sees the consequences of itself.
      points_before = ReportingEntity.delinquency_points            # step 1
      tier(p) = TIER_0 if p <= 9 else TIER_1 if p <= 19 else TIER_2
      delinquency_tier_at_assessment = tier(points_before)          # step 2
      suspension_surcharge uses the registration status as of step 2   # step 3
      assessed_amount_cents = penalty_assessment_amount(...)           # step 4
      points = POINTS_BY_VIOLATION[violation_type]
               * (2 if delinquency_tier_at_assessment == TIER_2 else 1)   # step 5
      points_after = points_before + points                              # step 6
      ReportingEntity.delinquency_points = points_after
      if tier(points_after) == TIER_2:                                    # step 7
          if governing_registration.status == ACTIVE:    -> SUSPENDED (DELINQUENCY_TIER_BREACH)
          elif governing_registration.status == SUSPENDED: -> REVOKED
      # waiver is the exact inverse of step 5-6 for that row:
      on waive: ReportingEntity.delinquency_points -= assessment.points
    input_set: "Only PenaltyAssessments with status IN {ASSESSED, PAID} contribute points; a WAIVED row contributes nothing, so delinquency_points == sum(points over ASSESSED and PAID rows) at every observable instant."
    constants:
      POINTS_BY_VIOLATION: { LATE_FILING: 2, INACCURATE_DATA: 5, NON_REGISTRATION: 8 }
      TIER_1_FLOOR_POINTS: 10
      TIER_2_FLOOR_POINTS: 20
      TIER_2_POINT_DOUBLING: 2
    precision: "Integer points; tier boundaries are inclusive floors (exactly 10 points is TIER_1, exactly 20 is TIER_2)."

  - name: window_head_ledger
    trigger: "Every Submission transition into or out of status ACCEPTED (review ACCEPT, open-correction, audit-driven correction, supersede, reject-after-resubmit)"
    algorithm: aggregation
    formula: |
      accepted = [S for S in Submission
                  if S.reporting_window_id == window.id and S.status == ACCEPTED]
      window.accepted_submission_count = count(accepted)
      window.total_head_reported       = sum of S.reported_head over accepted
      window.version                  += 1                # every ledger write bumps the parent
    input_set: "Exactly the ACCEPTED submissions of the window at the instant of the write; a SUPERSEDED predecessor drops out in the same request that accepts its successor, so head is never double counted."
    constants: {}
    precision: "Integer head; full recompute (not incremental delta) so no drift can accumulate across correction cycles."

  - name: entity_penalty_ledger
    trigger: "POST /penalty-assessments, POST /penalty-assessments/{id}/pay, POST /penalty-assessments/{id}/waive"
    algorithm: aggregation
    formula: |
      rows = [A for A in PenaltyAssessment if A.reporting_entity_id == entity.id]
      entity.assessed_penalty_cents    = sum of A.assessed_amount_cents over rows
      entity.paid_penalty_cents        = sum where A.status == PAID
      entity.waived_penalty_cents      = sum where A.status == WAIVED
      entity.outstanding_penalty_cents = sum where A.status == ASSESSED
      entity.delinquency_points        = sum of A.points where A.status IN {ASSESSED, PAID}
      entity.version                  += 1
    input_set: "All PenaltyAssessments of the entity, partitioned by status; no time filter."
    constants: {}
    precision: |
      Integer cents. Conservation invariant held at every observable instant:
      assessed_penalty_cents == paid_penalty_cents + waived_penalty_cents
                                + outstanding_penalty_cents.

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number wins)
# =============================================================================
validations:

  # --- 1-2: authentication and authorization ---------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The presented role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  # --- 3: request shape ------------------------------------------------------
  - priority: 3
    category: business_constraint
    check: |
      Request shape: required inputs present; enums in range (entity_type, species,
      purchase_type, product_class, sale_type, decision, violation_type, stance,
      basis_variant, weighting_variant, purchase_type_filter, category, report_class,
      frequency); head_count / load_count / total_pounds strictly positive integers;
      avg_net_price_per_cwt, avg_carcass_weight_cwt, price_per_cwt strictly positive;
      verified_head and verified_value_dollars non-negative; annual_head_history keys
      are 4-digit years with non-negative integer values; period_start < period_end;
      submission_deadline_utc <= correction_deadline_utc <= publication_release_utc;
      pagination limit in [1,100] and offset >= 0
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  # --- 4: path existence (left to right) -------------------------------------
  - priority: 4
    category: existence
    check: "Path resource exists, resolved left-to-right: /reporting-entities/{id} -> ERR_REPORTING_ENTITY_NOT_FOUND, /plants/{id} -> ERR_PLANT_NOT_FOUND, /registrations/{id} -> ERR_REGISTRATION_NOT_FOUND, /reporting-windows/{id} -> ERR_REPORTING_WINDOW_NOT_FOUND, /submissions/{id} -> ERR_SUBMISSION_NOT_FOUND, /market-reports/{id} -> ERR_MARKET_REPORT_NOT_FOUND, /audit-cases/{id} -> ERR_AUDIT_CASE_NOT_FOUND, /penalty-assessments/{id} -> ERR_PENALTY_ASSESSMENT_NOT_FOUND, /methodology-changes/{id} -> ERR_METHODOLOGY_CHANGE_NOT_FOUND"
    error_id: ERR_SUBMISSION_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 5
    category: existence
    check: "Body foreign keys exist, in declaration order: reporting_entity_id -> ERR_REPORTING_ENTITY_NOT_FOUND, plant_id -> ERR_PLANT_NOT_FOUND, reporting_window_id -> ERR_REPORTING_WINDOW_NOT_FOUND, supersedes_submission_id and submission_id -> ERR_SUBMISSION_NOT_FOUND, audit_case_id -> ERR_AUDIT_CASE_NOT_FOUND"
    error_id: ERR_PLANT_NOT_FOUND
    http_status: 404
    applies_to: "POST /plants, POST /registrations, POST /submissions, POST /market-reports, POST /audit-cases, POST /penalty-assessments"

  # --- 6-8: identity-scoped and disclosure-scoped access --------------------
  - priority: 6
    category: auth
    check: "When X-User-Role == ReporterAgent, X-User-ID must equal the ReportingEntity that owns the target: Plant.reporting_entity_id for submissions and line items, Registration.reporting_entity_id for appeals"
    error_id: ERR_FOREIGN_REPORTING_ENTITY
    http_status: 403
    applies_to: "POST /submissions, POST /submissions/{id}/transactions, POST /submissions/{id}/wholesale-lots, POST /submissions/{id}/submit, POST /submissions/{id}/resubmit, POST /registrations/{id}/appeal"

  - priority: 7
    category: auth
    check: "Segregation of duties: the X-User-ID assessing a penalty must differ from AuditCase.finalized_by_user_id of the referenced audit case, and the X-User-ID finalizing an audit case must differ from AuditCase.opened_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /penalty-assessments, POST /audit-cases/{id}/finalize"

  - priority: 8
    category: business_safety
    check: "When X-User-Role == PublicUser, a MarketReport is readable only when publication_state == PUBLISHED; withheld and unpublished reports are invisible to the public"
    error_id: ERR_REPORT_NOT_PUBLISHED
    http_status: 403
    applies_to: "GET /market-reports/{id}, GET /market-reports"

  # --- 9: optimistic concurrency --------------------------------------------
  - priority: 9
    category: state
    check: "expected_window_version equals the current ReportingWindow.version"
    error_id: ERR_STALE_WINDOW_VERSION
    http_status: 412
    applies_to: "POST /submissions"

  - priority: 9
    category: state
    check: "expected_reporting_entity_version equals the current ReportingEntity.version"
    error_id: ERR_STALE_ENTITY_VERSION
    http_status: 412
    applies_to: "POST /penalty-assessments"

  # --- 10-19: state preconditions ------------------------------------------
  - priority: 10
    category: state
    check: "Line items may be attached only while the submission is DRAFT or UNDER_CORRECTION. Deliberately OUTRANKS the purchase-type element rules at priority 39: a FORMULA record with no formula_base_reference posted to a SUBMITTED submission returns this error, not ERR_MISSING_PURCHASE_TYPE_ELEMENT."
    error_id: ERR_SUBMISSION_NOT_EDITABLE
    http_status: 409
    applies_to: "POST /submissions/{id}/transactions, POST /submissions/{id}/wholesale-lots"

  - priority: 11
    category: state
    check: "Submission is in a status the requested lifecycle action permits (submit from DRAFT; review from SUBMITTED or RESUBMITTED; open-correction from ACCEPTED; resubmit from UNDER_CORRECTION); terminal REJECTED / SUPERSEDED / VOIDED accept nothing"
    error_id: ERR_INVALID_SUBMISSION_STATE
    http_status: 409
    applies_to: "POST /submissions/{id}/submit, POST /submissions/{id}/review, POST /submissions/{id}/open-correction, POST /submissions/{id}/resubmit"

  - priority: 12
    category: state
    check: "Registration is in a status the requested action permits (determine from DRAFT; appeal from DETERMINED; redetermine from UNDER_APPEAL; activate from DETERMINED; suspend from ACTIVE); REVOKED accepts nothing"
    error_id: ERR_INVALID_REGISTRATION_STATE
    http_status: 409
    applies_to: "POST /registrations/{id}/determine, POST /registrations/{id}/appeal, POST /registrations/{id}/redetermine, POST /registrations/{id}/activate, POST /registrations/{id}/suspend"

  - priority: 13
    category: state
    check: "AuditCase is in a status the requested action permits (start-fieldwork from OPEN; finalize from FIELDWORK; close from RECONCILED or DISCREPANCY); CLOSED accepts nothing"
    error_id: ERR_INVALID_AUDIT_STATE
    http_status: 409
    applies_to: "POST /audit-cases/{id}/start-fieldwork, POST /audit-cases/{id}/finalize, POST /audit-cases/{id}/close"

  - priority: 14
    category: state
    check: "MethodologyChange is in a status the requested action permits (comments and close-comment require COMMENT_OPEN; adopt requires COMMENT_CLOSED); ADOPTED accepts nothing"
    error_id: ERR_INVALID_METHODOLOGY_STATE
    http_status: 409
    applies_to: "POST /methodology-changes/{id}/comments, POST /methodology-changes/{id}/close-comment, POST /methodology-changes/{id}/adopt"

  - priority: 15
    category: state
    check: "The submission's ReportingWindow.status == OPEN when creating or submitting a filing"
    error_id: ERR_WINDOW_NOT_OPEN
    http_status: 409
    applies_to: "POST /submissions, POST /submissions/{id}/submit"

  - priority: 16
    category: state
    check: "MarketReport.aggregation_state == COMPUTED before disclosure review or publication; a report that went STALE must be recomputed first"
    error_id: ERR_REPORT_NOT_COMPUTED
    http_status: 409
    applies_to: "POST /market-reports/{id}/disclosure-review, POST /market-reports/{id}/publish"

  - priority: 17
    category: state
    check: "MarketReport.disclosure_state != UNREVIEWED before publication"
    error_id: ERR_DISCLOSURE_NOT_REVIEWED
    http_status: 409
    applies_to: "POST /market-reports/{id}/publish"

  - priority: 18
    category: state
    check: "MarketReport.publication_state == UNPUBLISHED when publishing; a WITHDRAWN report must be recomputed and re-reviewed, and an already PUBLISHED one is rejected (publication is not idempotent)"
    error_id: ERR_REPORT_ALREADY_PUBLISHED
    http_status: 409
    applies_to: "POST /market-reports/{id}/publish"

  - priority: 19
    category: state
    check: "PenaltyAssessment.status == ASSESSED when paying or waiving; PAID and WAIVED are terminal"
    error_id: ERR_PENALTY_ALREADY_SETTLED
    http_status: 409
    applies_to: "POST /penalty-assessments/{id}/pay, POST /penalty-assessments/{id}/waive"

  # --- 20-23: safety / confidentiality (business_safety) --------------------
  - priority: 20
    category: business_safety
    check: "A MarketReport whose disclosure_state == WITHHELD may never be published. Deliberately OUTRANKS the release-time rule at priority 25: a withheld report published before its release instant returns this error, not ERR_PUBLICATION_BEFORE_RELEASE_TIME."
    error_id: ERR_CONFIDENTIALITY_SUPPRESSION_REQUIRED
    http_status: 409
    applies_to: "POST /market-reports/{id}/publish"

  - priority: 21
    category: business_safety
    check: "Computing a market report requires at least one ACCEPTED Submission in the window; a window with only SUBMITTED / REJECTED / VOIDED filings has no eligible data"
    error_id: ERR_NO_ELIGIBLE_DATA
    http_status: 409
    applies_to: "POST /market-reports/{id}/compute"

  - priority: 22
    category: business_safety
    check: "Filing requires the plant's reporting entity to hold a Registration for the window's calendar year with determination_outcome == MANDATORY and status == ACTIVE; a SUSPENDED or REVOKED registration blocks filing even for an already-created DRAFT"
    error_id: ERR_REGISTRATION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /submissions/{id}/submit, POST /submissions/{id}/resubmit"

  - priority: 23
    category: business_safety
    check: "Wholesale lots may be attached only when the plant's computed wholesale_reporting_required == true (boxed_beef_volume_lbs_prior_year >= 2000000)"
    error_id: ERR_WHOLESALE_NOT_AUTHORIZED
    http_status: 409
    applies_to: "POST /submissions/{id}/wholesale-lots"

  # --- 24-30: temporal ------------------------------------------------------
  - priority: 24
    category: business_temporal
    check: "Reporter-initiated corrections require the logical clock <= ReportingWindow.correction_deadline_utc (audit-driven corrections bypass this deadline)"
    error_id: ERR_CORRECTION_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /submissions/{id}/open-correction"

  - priority: 25
    category: business_temporal
    check: "Publication requires the logical clock >= ReportingWindow.publication_release_utc; exactly at the release instant publication is allowed"
    error_id: ERR_PUBLICATION_BEFORE_RELEASE_TIME
    http_status: 409
    applies_to: "POST /market-reports/{id}/publish"

  - priority: 26
    category: business_temporal
    check: "Locking a window requires the logical clock >= period_end; exactly at period_end locking is allowed"
    error_id: ERR_WINDOW_PERIOD_NOT_ENDED
    http_status: 409
    applies_to: "POST /reporting-windows/{id}/lock"

  - priority: 27
    category: business_temporal
    check: "Closing the comment period requires the logical clock >= comment_period_end"
    error_id: ERR_COMMENT_PERIOD_NOT_ENDED
    http_status: 409
    applies_to: "POST /methodology-changes/{id}/close-comment"

  - priority: 28
    category: business_temporal
    check: "comment_period_end must be at least MIN_COMMENT_DAYS (30) days after the logical clock at creation"
    error_id: ERR_COMMENT_PERIOD_TOO_SHORT
    http_status: 422
    applies_to: "POST /methodology-changes"

  - priority: 29
    category: business_temporal
    check: "effective_from must be at least MIN_NOTICE_DAYS (30) days after comment_period_end so the industry receives notice of the methodology change"
    error_id: ERR_EFFECTIVE_DATE_TOO_SOON
    http_status: 422
    applies_to: "POST /methodology-changes"

  - priority: 30
    category: business_temporal
    check: "FORWARD_CONTRACT records require both forward_delivery_start and forward_delivery_end with start <= end; the interval is CLOSED on both ends"
    error_id: ERR_FORWARD_DELIVERY_INTERVAL_INVALID
    http_status: 422
    applies_to: "POST /submissions/{id}/transactions"

  # --- 31-35: referential ---------------------------------------------------
  - priority: 31
    category: business_referential
    check: "supersedes_submission_id must reference a Submission of the SAME plant_id and the SAME reporting_window_id. Deliberately OUTRANKS the duplicate-filing rule at priority 37: a cross-plant supersede target on a plant that already has an open filing returns this error, not ERR_DUPLICATE_SUBMISSION."
    error_id: ERR_SUPERSEDE_TARGET_PLANT_MISMATCH
    http_status: 409
    applies_to: "POST /submissions"

  - priority: 32
    category: business_referential
    check: "supersedes_submission_id must reference a Submission whose status == ACCEPTED at the moment the superseding filing is accepted"
    error_id: ERR_SUPERSEDE_TARGET_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /submissions, POST /submissions/{id}/review"

  - priority: 33
    category: business_referential
    check: "MarketReport.category must match its window: LIVE_STEER_HEIFER and LIVE_COW_BULL require species CATTLE with report_class LIVE_ANIMAL; BOXED_BEEF_CUTOUT requires species CATTLE with report_class BOXED_BEEF; WHOLESALE_PORK_CUTS requires species SWINE with report_class WHOLESALE_CUTS. Also Plant.species must equal ReportingWindow.species when filing."
    error_id: ERR_SPECIES_CLASS_MISMATCH
    http_status: 422
    applies_to: "POST /market-reports, POST /submissions"

  - priority: 34
    category: business_referential
    check: "Line-item class must match the window's report_class: TransactionRecords only on LIVE_ANIMAL windows, WholesaleLots only on BOXED_BEEF or WHOLESALE_CUTS windows"
    error_id: ERR_LINE_ITEM_CLASS_MISMATCH
    http_status: 422
    applies_to: "POST /submissions/{id}/transactions, POST /submissions/{id}/wholesale-lots"

  - priority: 35
    category: business_referential
    check: "An INACCURATE_DATA assessment requires audit_case_id referencing an AuditCase in status DISCREPANCY or CLOSED whose finding is MATERIAL_HEAD, MATERIAL_VALUE or MATERIAL_BOTH; a LATE_FILING assessment requires submission_id referencing a Submission with is_late == true; a NON_REGISTRATION assessment requires neither"
    error_id: ERR_AUDIT_CASE_NOT_DISCREPANT
    http_status: 409
    applies_to: "POST /penalty-assessments"

  # --- 36-48: structural constraints ---------------------------------------
  - priority: 36
    category: business_constraint
    check: "A new ReportingWindow's HALF-OPEN interval [period_start, period_end) must not intersect any existing window with the same (species, report_class, frequency); adjacency (new.period_start == existing.period_end) is allowed"
    error_id: ERR_WINDOW_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /reporting-windows"

  - priority: 37
    category: business_constraint
    check: "A plant may hold only one non-terminal Submission per window: reject when another Submission for the same (plant_id, reporting_window_id) has status IN {DRAFT, SUBMITTED, UNDER_CORRECTION, RESUBMITTED}, or when status == ACCEPTED and the new filing does not supersede it"
    error_id: ERR_DUPLICATE_SUBMISSION
    http_status: 409
    applies_to: "POST /submissions"

  - priority: 38
    category: business_constraint
    check: "At most one non-REVOKED Registration per (reporting_entity_id, determination_year)"
    error_id: ERR_DUPLICATE_REGISTRATION_YEAR
    http_status: 409
    applies_to: "POST /registrations"

  - priority: 39
    category: business_constraint
    check: "Required data elements by purchase type: FORMULA requires formula_base_reference; NEGOTIATED_GRID requires grid_premium_discount_per_cwt; FORWARD_CONTRACT requires forward_delivery_start and forward_delivery_end"
    error_id: ERR_MISSING_PURCHASE_TYPE_ELEMENT
    http_status: 422
    applies_to: "POST /submissions/{id}/transactions"

  - priority: 40
    category: business_constraint
    check: "Forbidden data elements by purchase type: NEGOTIATED and PACKER_OWNED must carry none of formula_base_reference, grid_premium_discount_per_cwt, forward_delivery_start, forward_delivery_end; FORMULA must not carry grid_premium_discount_per_cwt"
    error_id: ERR_FORBIDDEN_PURCHASE_TYPE_ELEMENT
    http_status: 422
    applies_to: "POST /submissions/{id}/transactions"

  - priority: 41
    category: business_constraint
    check: "Submission.resubmission_count < RESUBMISSION_LIMIT (2) before opening a correction cycle"
    error_id: ERR_RESUBMISSION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /submissions/{id}/open-correction"

  - priority: 42
    category: business_constraint
    check: "Registration.appeal_count < APPEAL_LIMIT (2) before appealing"
    error_id: ERR_APPEAL_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /registrations/{id}/appeal"

  - priority: 43
    category: business_constraint
    check: "Every eligible plant's annual_head_history covers all five lookback years for the FIVE_YEAR_AVERAGE basis, and determination_year-1 for the PRIOR_YEAR_ACTUAL basis"
    error_id: ERR_INCOMPLETE_SLAUGHTER_HISTORY
    http_status: 422
    applies_to: "POST /registrations/{id}/determine, POST /registrations/{id}/redetermine"

  - priority: 44
    category: business_constraint
    check: "At least one Plant of the reporting entity has status IN {ACTIVE, IDLE} at determination time"
    error_id: ERR_NO_ELIGIBLE_PLANTS
    http_status: 409
    applies_to: "POST /registrations/{id}/determine, POST /registrations/{id}/redetermine"

  - priority: 45
    category: business_constraint
    check: "A submission must carry at least one line item of the window's class before it can be submitted or resubmitted"
    error_id: ERR_EMPTY_SUBMISSION
    http_status: 409
    applies_to: "POST /submissions/{id}/submit, POST /submissions/{id}/resubmit"

  - priority: 46
    category: business_constraint
    check: "Only a Registration with determination_outcome == MANDATORY may be activated; an EXEMPT determination has no reporting obligation"
    error_id: ERR_ENTITY_EXEMPT
    http_status: 409
    applies_to: "POST /registrations/{id}/activate"

  - priority: 47
    category: business_constraint
    check: "No Submission of the window is still in status SUBMITTED or RESUBMITTED when the window is locked"
    error_id: ERR_PENDING_SUBMISSIONS_EXIST
    http_status: 409
    applies_to: "POST /reporting-windows/{id}/lock"

  - priority: 48
    category: business_constraint
    check: "The report's ReportingWindow.status must be LOCKED or PUBLISHED at publication time (an OPEN window is still collecting filings)"
    error_id: ERR_WINDOW_NOT_LOCKED
    http_status: 409
    applies_to: "POST /market-reports/{id}/publish"

  - priority: 49
    category: business_constraint
    check: "Adoption of a methodology change requires comment_count >= 1"
    error_id: ERR_NO_PUBLIC_COMMENTS
    http_status: 409
    applies_to: "POST /methodology-changes/{id}/adopt"

  # --- 50-52: fiscal / capacity --------------------------------------------
  - priority: 50
    category: business_fiscal
    check: "Aggregate forward commitments of the plant on any shared delivery day must not exceed Plant.forward_commitment_cap_head (CLOSED intervals, aggregate capacity — overlap is allowed up to the cap)"
    error_id: ERR_FORWARD_COMMITMENT_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /submissions/{id}/transactions"

  - priority: 51
    category: business_fiscal
    check: "ReportingEntity.outstanding_penalty_cents == 0 before a registration may be activated"
    error_id: ERR_OUTSTANDING_PENALTY_BLOCKS_ACTIVATION
    http_status: 409
    applies_to: "POST /registrations/{id}/activate"

  - priority: 52
    category: business_fiscal
    check: "paid_amount_cents must equal PenaltyAssessment.assessed_amount_cents exactly; partial payment is not accepted"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /penalty-assessments/{id}/pay"

# =============================================================================
# §1.5 API Endpoint Table  (api_prefix is empty — all paths are absolute)
# =============================================================================
endpoints:

  # --- ReportingEntity -------------------------------------------------------
  - method: POST
    path: "/reporting-entities"
    description: "Register a packing firm subject to the mandatory price reporting program"
    roles: [ProgramAdmin]
    code: 201
    input: [legal_name, entity_type, species_scope]
    output: ReportingEntity
    side_effects: ["delinquency_points and all four penalty ledger fields initialized to 0", "version initialized to 1"]

  - method: GET
    path: "/reporting-entities/{id}"
    description: "Read a reporting entity including its delinquency point total and penalty ledger; also the read used to obtain expected_reporting_entity_version"
    roles: [ProgramAdmin, MarketAnalyst, ComplianceAuditor, PenaltyOfficer, ReporterAgent]
    code: 200
    input: []
    output: ReportingEntity
    side_effects: []

  - method: GET
    path: "/reporting-entities"
    description: "List reporting entities"
    roles: [ProgramAdmin, MarketAnalyst, ComplianceAuditor, PenaltyOfficer]
    code: 200
    input: ["entity_type?", "species_scope?", "limit?", "offset?"]
    output: ReportingEntity[]
    side_effects: []

  # --- Plant -----------------------------------------------------------------
  - method: POST
    path: "/plants"
    description: "Add a slaughter or fabrication plant with its annual head history"
    roles: [ProgramAdmin]
    code: 201
    input: [reporting_entity_id, plant_code, species, annual_head_history, "boxed_beef_volume_lbs_prior_year?", "forward_commitment_cap_head?", "status?"]
    output: Plant
    side_effects: ["wholesale_reporting_required computed from boxed_beef_volume_lbs_prior_year against BOXED_BEEF_THRESHOLD_LBS"]

  - method: PATCH
    path: "/plants/{id}"
    description: "Amend a plant's operating status, slaughter history, wholesale volume or forward commitment cap"
    roles: [ProgramAdmin]
    code: 200
    input: ["status?", "annual_head_history?", "boxed_beef_volume_lbs_prior_year?", "forward_commitment_cap_head?"]
    output: Plant
    side_effects: ["wholesale_reporting_required recomputed", "increments Plant.version by 1"]

  - method: GET
    path: "/plants/{id}"
    description: "Read one plant"
    roles: [ProgramAdmin, MarketAnalyst, ComplianceAuditor, PenaltyOfficer, ReporterAgent]
    code: 200
    input: []
    output: Plant
    side_effects: []

  - method: GET
    path: "/plants"
    description: "List plants, optionally narrowed to one reporting entity"
    roles: [ProgramAdmin, MarketAnalyst, ComplianceAuditor, PenaltyOfficer, ReporterAgent]
    code: 200
    input: ["reporting_entity_id?", "species?", "status?", "limit?", "offset?"]
    output: Plant[]
    side_effects: []

  # --- Registration ----------------------------------------------------------
  - method: POST
    path: "/registrations"
    description: "Open a determination file for one reporting entity and determination year"
    roles: [ProgramAdmin]
    code: 201
    input: [reporting_entity_id, determination_year, "basis_variant?"]
    output: Registration
    side_effects: ["status set to DRAFT", "basis_variant defaults to FIVE_YEAR_AVERAGE", "appeal_count set to 0"]

  - method: POST
    path: "/registrations/{id}/determine"
    description: "Run the slaughter-volume threshold determination (DRAFT -> DETERMINED)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Registration
    side_effects: ["runs calculation reporter_threshold_determination", "sets measured_head, threshold_head, determination_outcome", "assigns registration_number when the outcome is MANDATORY"]

  - method: POST
    path: "/registrations/{id}/appeal"
    description: "Reporter contests a determination (DETERMINED -> UNDER_APPEAL)"
    roles: [ReporterAgent]
    code: 200
    input: [appeal_reason]
    output: Registration
    side_effects: ["increments appeal_count by 1"]

  - method: POST
    path: "/registrations/{id}/redetermine"
    description: "Re-run the determination under an explicitly chosen basis after an appeal (UNDER_APPEAL -> DETERMINED)"
    roles: [ProgramAdmin]
    code: 200
    input: [basis_variant]
    output: Registration
    side_effects: ["overwrites basis_variant then re-runs calculation reporter_threshold_determination", "measured_head and determination_outcome may flip relative to the first determination"]

  - method: POST
    path: "/registrations/{id}/activate"
    description: "Activate a mandatory registration so the entity's plants may file (DETERMINED -> ACTIVE)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Registration
    side_effects: ["sets effective_from to the logical clock", "clears suspended_reason"]

  - method: POST
    path: "/registrations/{id}/suspend"
    description: "Suspend a registration for cause (ACTIVE -> SUSPENDED)"
    roles: [ProgramAdmin]
    code: 200
    input: [suspended_reason]
    output: Registration
    side_effects: ["cascade: every Submission of the entity's plants in status DRAFT or SUBMITTED becomes VOIDED", "each voided ACCEPTED-adjacent window ledger is left untouched because VOIDED filings were never ACCEPTED"]

  - method: GET
    path: "/registrations/{id}"
    description: "Read one registration"
    roles: [ProgramAdmin, MarketAnalyst, ComplianceAuditor, PenaltyOfficer, ReporterAgent]
    code: 200
    input: []
    output: Registration
    side_effects: []

  - method: GET
    path: "/registrations"
    description: "List registrations, optionally narrowed to one reporting entity or determination year"
    roles: [ProgramAdmin, MarketAnalyst, ComplianceAuditor, PenaltyOfficer, ReporterAgent]
    code: 200
    input: ["reporting_entity_id?", "determination_year?", "status?", "determination_outcome?", "limit?", "offset?"]
    output: Registration[]
    side_effects: []

  # --- ReportingWindow -------------------------------------------------------
  - method: POST
    path: "/reporting-windows"
    description: "Open a daily or weekly reporting window with its deadlines and confidentiality guideline parameters"
    roles: [ProgramAdmin]
    code: 201
    input: [species, report_class, frequency, period_start, period_end, submission_deadline_utc, correction_deadline_utc, publication_release_utc, "min_reporter_count?", "max_single_reporter_share_pct?", "min_reported_head?"]
    output: ReportingWindow
    side_effects: ["status set to OPEN", "accepted_submission_count and total_head_reported set to 0", "guideline defaults 3 / 70.00 / 2000 applied when omitted"]

  - method: POST
    path: "/reporting-windows/{id}/lock"
    description: "Close collection for a window so reports can be published (OPEN -> LOCKED)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ReportingWindow
    side_effects: ["increments ReportingWindow.version by 1"]

  - method: GET
    path: "/reporting-windows/{id}"
    description: "Read one window including its collected ledger; the read used to obtain expected_window_version"
    roles: [ProgramAdmin, MarketAnalyst, ComplianceAuditor, PenaltyOfficer, ReporterAgent]
    code: 200
    input: []
    output: ReportingWindow
    side_effects: []

  - method: GET
    path: "/reporting-windows"
    description: "List reporting windows"
    roles: [ProgramAdmin, MarketAnalyst, ComplianceAuditor, PenaltyOfficer, ReporterAgent]
    code: 200
    input: ["species?", "report_class?", "frequency?", "status?", "limit?", "offset?"]
    output: ReportingWindow[]
    side_effects: []

  # --- Submission ------------------------------------------------------------
  - method: POST
    path: "/submissions"
    description: "Start a filing for one plant against one open window, optionally superseding an already accepted filing"
    roles: [ReporterAgent, ProgramAdmin]
    code: 201
    input: [plant_id, reporting_window_id, expected_window_version, "supersedes_submission_id?"]
    output: Submission
    side_effects: ["status set to DRAFT", "all reported_* totals set to 0", "resubmission_count set to 0", "increments ReportingWindow.version by 1"]

  - method: POST
    path: "/submissions/{id}/transactions"
    description: "Append one live-animal transaction line (negotiated, negotiated grid, formula, forward contract or packer-owned) with its required data elements"
    roles: [ReporterAgent, ProgramAdmin]
    code: 201
    input: [purchase_type, head_count, avg_net_price_per_cwt, avg_carcass_weight_cwt, "formula_base_reference?", "grid_premium_discount_per_cwt?", "forward_delivery_start?", "forward_delivery_end?"]
    output: TransactionRecord
    side_effects: ["computes line_value_dollars per calculation submission_reported_totals (round-then-sum)", "recomputes the submission's reported_head, reported_cwt and reported_value_dollars", "FORWARD_CONTRACT lines run calculation forward_commitment_peak"]

  - method: POST
    path: "/submissions/{id}/wholesale-lots"
    description: "Append one boxed beef or wholesale product lot line, distinct from the live-animal categories"
    roles: [ReporterAgent, ProgramAdmin]
    code: 201
    input: [product_class, sale_type, load_count, total_pounds, price_per_cwt]
    output: WholesaleLot
    side_effects: ["computes lot_value_dollars", "recomputes the submission's reported_pounds, reported_load_count and reported_value_dollars"]

  - method: POST
    path: "/submissions/{id}/submit"
    description: "File the submission against the window deadline (DRAFT -> SUBMITTED)"
    roles: [ReporterAgent, ProgramAdmin]
    code: 200
    input: []
    output: Submission
    side_effects: ["runs calculation submission_lateness and sets submitted_at, lateness_minutes, is_late, days_late"]

  - method: POST
    path: "/submissions/{id}/review"
    description: "Accept or reject a filed submission (SUBMITTED|RESUBMITTED -> ACCEPTED|REJECTED)"
    roles: [MarketAnalyst, ProgramAdmin]
    code: 200
    input: [decision, "review_note?"]
    output: Submission
    side_effects: ["on ACCEPT: sets accepted_at, runs calculation window_head_ledger, marks any supersedes target SUPERSEDED, and moves every COMPUTED MarketReport of the window to AGG_STALE (withdrawing PUBLISHED ones and returning the window to LOCKED)", "on REJECT: no ledger change"]

  - method: POST
    path: "/submissions/{id}/open-correction"
    description: "Reopen an accepted filing for correction (ACCEPTED -> UNDER_CORRECTION)"
    roles: [ComplianceAuditor, ProgramAdmin]
    code: 200
    input: [correction_reason]
    output: Submission
    side_effects: ["removes the filing's head from the window ledger via calculation window_head_ledger", "moves every COMPUTED MarketReport of the window to AGG_STALE", "increments resubmission_count by 1"]

  - method: POST
    path: "/submissions/{id}/resubmit"
    description: "Refile a corrected submission (UNDER_CORRECTION -> RESUBMITTED)"
    roles: [ReporterAgent, ProgramAdmin]
    code: 200
    input: []
    output: Submission
    side_effects: ["re-runs calculation submission_lateness against the original submission_deadline_utc"]

  - method: GET
    path: "/submissions/{id}"
    description: "Read one submission with its booked totals and lateness figures"
    roles: [ProgramAdmin, MarketAnalyst, ComplianceAuditor, PenaltyOfficer, ReporterAgent]
    code: 200
    input: []
    output: Submission
    side_effects: []

  - method: GET
    path: "/submissions"
    description: "List submissions, optionally narrowed by plant, window, supersede target or status"
    roles: [ProgramAdmin, MarketAnalyst, ComplianceAuditor, PenaltyOfficer, ReporterAgent]
    code: 200
    input: ["plant_id?", "reporting_window_id?", "supersedes_submission_id?", "status?", "is_late?", "limit?", "offset?"]
    output: Submission[]
    side_effects: []

  - method: GET
    path: "/submissions/{id}/transactions"
    description: "List the immutable live-animal transaction lines of a submission"
    roles: [ProgramAdmin, MarketAnalyst, ComplianceAuditor, PenaltyOfficer, ReporterAgent]
    code: 200
    input: ["purchase_type?", "limit?", "offset?"]
    output: TransactionRecord[]
    side_effects: []

  - method: GET
    path: "/submissions/{id}/wholesale-lots"
    description: "List the immutable wholesale product lines of a submission"
    roles: [ProgramAdmin, MarketAnalyst, ComplianceAuditor, PenaltyOfficer, ReporterAgent]
    code: 200
    input: ["product_class?", "limit?", "offset?"]
    output: WholesaleLot[]
    side_effects: []

  # --- MarketReport ----------------------------------------------------------
  - method: POST
    path: "/market-reports"
    description: "Create a market report shell for one window, category and weighting variant"
    roles: [MarketAnalyst, ProgramAdmin]
    code: 201
    input: [reporting_window_id, category, weighting_variant, "purchase_type_filter?"]
    output: MarketReport
    side_effects: ["aggregation_state AGG_PENDING, disclosure_state DISC_UNREVIEWED, publication_state PUB_UNPUBLISHED", "purchase_type_filter defaults to ALL_PRICED"]

  - method: POST
    path: "/market-reports/{id}/compute"
    description: "Aggregate accepted filings into weighted average price, volumes and price range (AGG_PENDING|AGG_STALE -> AGG_COMPUTED)"
    roles: [MarketAnalyst, ProgramAdmin]
    code: 200
    input: []
    output: MarketReport
    side_effects: ["runs calculation market_report_aggregation", "sets computed_at", "resets disclosure_state to DISC_UNREVIEWED and clears suppression_reason"]

  - method: POST
    path: "/market-reports/{id}/disclosure-review"
    description: "Apply the publication guidelines that prevent identification of individual reporters (DISC_UNREVIEWED -> DISC_CLEARED|DISC_WITHHELD)"
    roles: [MarketAnalyst, ProgramAdmin]
    code: 200
    input: []
    output: MarketReport
    side_effects: ["runs calculation confidentiality_suppression", "on WITHHELD nulls weighted_average_price_per_cwt, price_low_per_cwt, price_high_per_cwt, total_head and total_pounds while retaining reporter_count and max_reporter_share_pct"]

  - method: POST
    path: "/market-reports/{id}/publish"
    description: "Release a cleared market report at or after its window's publication release instant (PUB_UNPUBLISHED -> PUB_PUBLISHED)"
    roles: [MarketAnalyst, ProgramAdmin]
    code: 200
    input: []
    output: MarketReport
    side_effects: ["sets published_at", "moves the ReportingWindow LOCKED -> PUBLISHED"]

  - method: GET
    path: "/market-reports/{id}"
    description: "Read one market report; PublicUser sees it only once published"
    roles: [MarketAnalyst, ProgramAdmin, ComplianceAuditor, PenaltyOfficer, ReporterAgent, PublicUser]
    code: 200
    input: []
    output: MarketReport
    side_effects: []

  - method: GET
    path: "/market-reports"
    description: "List market reports, optionally narrowed to one window or category"
    roles: [MarketAnalyst, ProgramAdmin, ComplianceAuditor, PenaltyOfficer, ReporterAgent, PublicUser]
    code: 200
    input: ["reporting_window_id?", "category?", "weighting_variant?", "publication_state?", "disclosure_state?", "limit?", "offset?"]
    output: MarketReport[]
    side_effects: []

  # --- AuditCase -------------------------------------------------------------
  - method: POST
    path: "/audit-cases"
    description: "Open a compliance verification of one accepted submission against the plant's own records"
    roles: [ComplianceAuditor]
    code: 201
    input: [submission_id, "materiality_pct?"]
    output: AuditCase
    side_effects: ["status OPEN", "opened_by_user_id set from X-User-ID", "materiality_pct defaults to 2.00"]

  - method: POST
    path: "/audit-cases/{id}/start-fieldwork"
    description: "Begin fieldwork against the plant records (OPEN -> FIELDWORK)"
    roles: [ComplianceAuditor]
    code: 200
    input: []
    output: AuditCase
    side_effects: []

  - method: POST
    path: "/audit-cases/{id}/finalize"
    description: "Record verified head and value from plant records and settle the finding (FIELDWORK -> RECONCILED|DISCREPANCY)"
    roles: [ComplianceAuditor]
    code: 200
    input: [verified_head, verified_value_dollars]
    output: AuditCase
    side_effects: ["runs calculation audit_discrepancy", "finalized_by_user_id set from X-User-ID", "on a material finding fires the audit_discrepancy_chain: audited Submission ACCEPTED -> UNDER_CORRECTION, window ledger recomputed, COMPUTED reports -> AGG_STALE, PUBLISHED reports -> PUB_WITHDRAWN, window PUBLISHED -> LOCKED"]

  - method: POST
    path: "/audit-cases/{id}/close"
    description: "Close a finalized audit case (RECONCILED|DISCREPANCY -> CLOSED)"
    roles: [ComplianceAuditor]
    code: 200
    input: []
    output: AuditCase
    side_effects: ["sets closed_at"]

  - method: GET
    path: "/audit-cases/{id}"
    description: "Read one audit case"
    roles: [ComplianceAuditor, ProgramAdmin, PenaltyOfficer, MarketAnalyst]
    code: 200
    input: []
    output: AuditCase
    side_effects: []

  - method: GET
    path: "/audit-cases"
    description: "List audit cases, optionally narrowed to one submission"
    roles: [ComplianceAuditor, ProgramAdmin, PenaltyOfficer, MarketAnalyst]
    code: 200
    input: ["submission_id?", "status?", "finding?", "limit?", "offset?"]
    output: AuditCase[]
    side_effects: []

  # --- PenaltyAssessment -----------------------------------------------------
  - method: POST
    path: "/penalty-assessments"
    description: "Assess a penalty for late filing, inaccurate reporting or failure to register"
    roles: [PenaltyOfficer]
    code: 201
    input: [reporting_entity_id, violation_type, expected_reporting_entity_version, "submission_id?", "audit_case_id?"]
    output: PenaltyAssessment
    side_effects: ["runs calculations delinquency_points_and_tier, penalty_assessment_amount and entity_penalty_ledger", "assessed_by_user_id set from X-User-ID", "increments ReportingEntity.version by 1", "may fire the penalty_tier_breach_chain: governing Registration ACTIVE -> SUSPENDED or SUSPENDED -> REVOKED, then that entity's DRAFT and SUBMITTED Submissions -> VOIDED"]

  - method: POST
    path: "/penalty-assessments/{id}/pay"
    description: "Record payment in full of an assessed penalty (ASSESSED -> PAID)"
    roles: [PenaltyOfficer]
    code: 200
    input: [paid_amount_cents]
    output: PenaltyAssessment
    side_effects: ["sets settled_at", "re-runs calculation entity_penalty_ledger moving the amount from outstanding to paid while delinquency_points are unchanged", "increments ReportingEntity.version by 1"]

  - method: POST
    path: "/penalty-assessments/{id}/waive"
    description: "Waive an assessed penalty (ASSESSED -> WAIVED)"
    roles: [PenaltyOfficer, ProgramAdmin]
    code: 200
    input: [waiver_reason]
    output: PenaltyAssessment
    side_effects: ["sets settled_at", "re-runs calculation entity_penalty_ledger and subtracts this row's points from delinquency_points", "may reinstate a Registration SUSPENDED -> ACTIVE when the post-waiver total leaves TIER_2", "increments ReportingEntity.version by 1"]

  - method: GET
    path: "/penalty-assessments/{id}"
    description: "Read one penalty assessment with its full multiplier breakdown"
    roles: [PenaltyOfficer, ProgramAdmin, ComplianceAuditor, ReporterAgent]
    code: 200
    input: []
    output: PenaltyAssessment
    side_effects: []

  - method: GET
    path: "/penalty-assessments"
    description: "List penalty assessments, optionally narrowed by entity, audit case, submission, type or status"
    roles: [PenaltyOfficer, ProgramAdmin, ComplianceAuditor, ReporterAgent]
    code: 200
    input: ["reporting_entity_id?", "audit_case_id?", "submission_id?", "violation_type?", "status?", "limit?", "offset?"]
    output: PenaltyAssessment[]
    side_effects: []

  # --- MethodologyChange -----------------------------------------------------
  - method: POST
    path: "/methodology-changes"
    description: "Propose a methodology change and open the public comment period"
    roles: [ProgramAdmin]
    code: 201
    input: [change_code, affected_category, proposed_weighting_variant, comment_period_end, effective_from]
    output: MethodologyChange
    side_effects: ["status COMMENT_OPEN", "comment_count and restated_report_count set to 0"]

  - method: POST
    path: "/methodology-changes/{id}/comments"
    description: "File a public comment on a proposed methodology change"
    roles: [PublicUser, ReporterAgent, ProgramAdmin]
    code: 201
    input: [commenter_reference, comment_text, stance]
    output: PublicComment
    side_effects: ["sets received_at from the logical clock", "increments MethodologyChange.comment_count by 1"]

  - method: POST
    path: "/methodology-changes/{id}/close-comment"
    description: "Close the comment period at or after comment_period_end (COMMENT_OPEN -> COMMENT_CLOSED)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: MethodologyChange
    side_effects: ["sets industry_notice_issued_at from the logical clock"]

  - method: POST
    path: "/methodology-changes/{id}/adopt"
    description: "Adopt the change and restate affected published reports (COMMENT_CLOSED -> ADOPTED)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: MethodologyChange
    side_effects: ["every MarketReport of affected_category has weighting_variant replaced by proposed_weighting_variant", "each such report in AGG_COMPUTED goes AGG_STALE, PUB_PUBLISHED goes PUB_WITHDRAWN, and each affected window PUBLISHED goes LOCKED", "restated_report_count set to the number of reports touched"]

  - method: GET
    path: "/methodology-changes/{id}"
    description: "Read one methodology change"
    roles: [ProgramAdmin, MarketAnalyst, ComplianceAuditor, PenaltyOfficer, ReporterAgent, PublicUser]
    code: 200
    input: []
    output: MethodologyChange
    side_effects: []

  - method: GET
    path: "/methodology-changes"
    description: "List methodology changes"
    roles: [ProgramAdmin, MarketAnalyst, ComplianceAuditor, PenaltyOfficer, ReporterAgent, PublicUser]
    code: 200
    input: ["status?", "affected_category?", "limit?", "offset?"]
    output: MethodologyChange[]
    side_effects: []

  - method: GET
    path: "/methodology-changes/{id}/comments"
    description: "List the immutable public comments filed on a methodology change"
    roles: [ProgramAdmin, MarketAnalyst, ComplianceAuditor, PenaltyOfficer, ReporterAgent, PublicUser]
    code: 200
    input: ["stance?", "limit?", "offset?"]
    output: PublicComment[]
    side_effects: []

  # --- test-driving endpoint -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Every deadline, correction cutoff, publication release and comment-period rule reads this clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; the server MUST NOT fall back to real wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: datetime }"
    side_effects: ["no entity is mutated; subsequent lateness, release-time and comment-period evaluations read the new instant"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # --- auth ------------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Authenticated role is not listed on the requested endpoint"
  - id: ERR_FOREIGN_REPORTING_ENTITY
    http: 403
    condition: "ReporterAgent acts on a plant, submission or registration belonging to a different ReportingEntity than its X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The same X-User-ID both finalized an audit case and attempts to assess the penalty arising from it, or both opened and finalized the same audit case"
  - id: ERR_REPORT_NOT_PUBLISHED
    http: 403
    condition: "PublicUser reads a MarketReport whose publication_state is not PUBLISHED"

  # --- request shape ---------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required input, unknown enum value, non-positive quantity or price, malformed annual_head_history, inverted period or deadline ordering, or pagination outside limit 1..100 / offset >= 0"

  # --- existence -------------------------------------------------------------
  - id: ERR_REPORTING_ENTITY_NOT_FOUND
    http: 404
    condition: "reporting_entity_id in path or body does not resolve"
  - id: ERR_PLANT_NOT_FOUND
    http: 404
    condition: "plant_id in path or body does not resolve"
  - id: ERR_REGISTRATION_NOT_FOUND
    http: 404
    condition: "registration id in path does not resolve"
  - id: ERR_REPORTING_WINDOW_NOT_FOUND
    http: 404
    condition: "reporting_window_id in path or body does not resolve"
  - id: ERR_SUBMISSION_NOT_FOUND
    http: 404
    condition: "submission id in path, or submission_id / supersedes_submission_id in body, does not resolve"
  - id: ERR_MARKET_REPORT_NOT_FOUND
    http: 404
    condition: "market report id in path does not resolve"
  - id: ERR_AUDIT_CASE_NOT_FOUND
    http: 404
    condition: "audit case id in path or audit_case_id in body does not resolve"
  - id: ERR_PENALTY_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "penalty assessment id in path does not resolve"
  - id: ERR_METHODOLOGY_CHANGE_NOT_FOUND
    http: 404
    condition: "methodology change id in path does not resolve"

  # --- optimistic concurrency ------------------------------------------------
  - id: ERR_STALE_WINDOW_VERSION
    http: 412
    condition: "expected_window_version on POST /submissions does not equal the current ReportingWindow.version"
  - id: ERR_STALE_ENTITY_VERSION
    http: 412
    condition: "expected_reporting_entity_version on POST /penalty-assessments does not equal the current ReportingEntity.version"

  # --- state -----------------------------------------------------------------
  - id: ERR_SUBMISSION_NOT_EDITABLE
    http: 409
    condition: "Line item appended to a submission that is not DRAFT or UNDER_CORRECTION"
  - id: ERR_INVALID_SUBMISSION_STATE
    http: 409
    condition: "Submission lifecycle action requested from a status that does not permit it, including any action on terminal REJECTED / SUPERSEDED / VOIDED"
  - id: ERR_INVALID_REGISTRATION_STATE
    http: 409
    condition: "Registration action requested from a status that does not permit it, including any action on terminal REVOKED"
  - id: ERR_INVALID_AUDIT_STATE
    http: 409
    condition: "Audit case action requested from a status that does not permit it, including any action on terminal CLOSED"
  - id: ERR_INVALID_METHODOLOGY_STATE
    http: 409
    condition: "Methodology change action requested from a status that does not permit it, including any action on terminal ADOPTED"
  - id: ERR_WINDOW_NOT_OPEN
    http: 409
    condition: "Filing created or submitted against a window whose status is LOCKED or PUBLISHED"
  - id: ERR_REPORT_NOT_COMPUTED
    http: 409
    condition: "Disclosure review or publication attempted while aggregation_state is AGG_PENDING or AGG_STALE"
  - id: ERR_DISCLOSURE_NOT_REVIEWED
    http: 409
    condition: "Publication attempted while disclosure_state is DISC_UNREVIEWED"
  - id: ERR_REPORT_ALREADY_PUBLISHED
    http: 409
    condition: "Publication attempted while publication_state is PUB_PUBLISHED or PUB_WITHDRAWN"
  - id: ERR_PENALTY_ALREADY_SETTLED
    http: 409
    condition: "Payment or waiver attempted on a PAID or WAIVED assessment"

  # --- safety / confidentiality ---------------------------------------------
  - id: ERR_CONFIDENTIALITY_SUPPRESSION_REQUIRED
    http: 409
    condition: "Publication attempted on a report whose disclosure_state is DISC_WITHHELD under the publication guidelines"
  - id: ERR_NO_ELIGIBLE_DATA
    http: 409
    condition: "Compute attempted on a window with no ACCEPTED submissions at all"
  - id: ERR_REGISTRATION_NOT_ACTIVE
    http: 409
    condition: "Filing submitted or resubmitted while the plant's entity has no ACTIVE MANDATORY registration for the window's calendar year"
  - id: ERR_WHOLESALE_NOT_AUTHORIZED
    http: 409
    condition: "Wholesale lot appended for a plant whose wholesale_reporting_required is false"

  # --- temporal --------------------------------------------------------------
  - id: ERR_CORRECTION_WINDOW_CLOSED
    http: 409
    condition: "Reporter-initiated correction opened after the window's correction_deadline_utc"
  - id: ERR_PUBLICATION_BEFORE_RELEASE_TIME
    http: 409
    condition: "Publication attempted strictly before the window's publication_release_utc"
  - id: ERR_WINDOW_PERIOD_NOT_ENDED
    http: 409
    condition: "Window locked strictly before its period_end"
  - id: ERR_COMMENT_PERIOD_NOT_ENDED
    http: 409
    condition: "Comment period closed strictly before comment_period_end"
  - id: ERR_COMMENT_PERIOD_TOO_SHORT
    http: 422
    condition: "comment_period_end is fewer than 30 days after the logical clock at proposal time"
  - id: ERR_EFFECTIVE_DATE_TOO_SOON
    http: 422
    condition: "effective_from is fewer than 30 days after comment_period_end, leaving insufficient industry notice"
  - id: ERR_FORWARD_DELIVERY_INTERVAL_INVALID
    http: 422
    condition: "FORWARD_CONTRACT line has forward_delivery_end earlier than forward_delivery_start"

  # --- referential -----------------------------------------------------------
  - id: ERR_SUPERSEDE_TARGET_PLANT_MISMATCH
    http: 409
    condition: "supersedes_submission_id references a filing of a different plant or a different window"
  - id: ERR_SUPERSEDE_TARGET_NOT_ACCEPTED
    http: 409
    condition: "supersedes_submission_id references a filing whose status is not ACCEPTED"
  - id: ERR_SPECIES_CLASS_MISMATCH
    http: 422
    condition: "Report category incompatible with the window's species and report_class, or plant species different from the window's species"
  - id: ERR_LINE_ITEM_CLASS_MISMATCH
    http: 422
    condition: "Transaction line appended on a BOXED_BEEF or WHOLESALE_CUTS window, or wholesale lot appended on a LIVE_ANIMAL window"
  - id: ERR_AUDIT_CASE_NOT_DISCREPANT
    http: 409
    condition: "INACCURATE_DATA assessment without an audit case in DISCREPANCY or CLOSED bearing a material finding, or LATE_FILING assessment whose referenced submission has is_late false"

  # --- structural constraints ----------------------------------------------
  - id: ERR_WINDOW_PERIOD_OVERLAP
    http: 409
    condition: "New window's half-open [period_start, period_end) intersects an existing window with the same species, report_class and frequency"
  - id: ERR_DUPLICATE_SUBMISSION
    http: 409
    condition: "Plant already holds a non-terminal filing for the window, or an ACCEPTED one that the new filing does not supersede"
  - id: ERR_DUPLICATE_REGISTRATION_YEAR
    http: 409
    condition: "A non-REVOKED registration already exists for that entity and determination year"
  - id: ERR_MISSING_PURCHASE_TYPE_ELEMENT
    http: 422
    condition: "Purchase type requires a data element that is absent: FORMULA without formula_base_reference, NEGOTIATED_GRID without grid_premium_discount_per_cwt, FORWARD_CONTRACT without delivery dates"
  - id: ERR_FORBIDDEN_PURCHASE_TYPE_ELEMENT
    http: 422
    condition: "Purchase type carries a data element it must not: NEGOTIATED or PACKER_OWNED with any specialised element, FORMULA with grid_premium_discount_per_cwt"
  - id: ERR_RESUBMISSION_LIMIT_REACHED
    http: 409
    condition: "Correction opened on a filing whose resubmission_count already reached 2"
  - id: ERR_APPEAL_LIMIT_REACHED
    http: 409
    condition: "Appeal filed on a registration whose appeal_count already reached 2"
  - id: ERR_INCOMPLETE_SLAUGHTER_HISTORY
    http: 422
    condition: "An eligible plant lacks a required year in annual_head_history for the selected basis variant"
  - id: ERR_NO_ELIGIBLE_PLANTS
    http: 409
    condition: "Determination run for an entity with no plant in status ACTIVE or IDLE"
  - id: ERR_EMPTY_SUBMISSION
    http: 409
    condition: "Submit or resubmit attempted on a filing carrying no line item of the window's class"
  - id: ERR_ENTITY_EXEMPT
    http: 409
    condition: "Activation attempted on a registration whose determination_outcome is EXEMPT"
  - id: ERR_PENDING_SUBMISSIONS_EXIST
    http: 409
    condition: "Window locked while a filing is still SUBMITTED or RESUBMITTED"
  - id: ERR_WINDOW_NOT_LOCKED
    http: 409
    condition: "Publication attempted while the report's window is still OPEN"
  - id: ERR_NO_PUBLIC_COMMENTS
    http: 409
    condition: "Adoption attempted on a methodology change with comment_count 0"

  # --- fiscal / capacity ----------------------------------------------------
  - id: ERR_FORWARD_COMMITMENT_CAP_EXCEEDED
    http: 409
    condition: "Aggregate forward commitments of the plant on a shared delivery day would exceed forward_commitment_cap_head"
  - id: ERR_OUTSTANDING_PENALTY_BLOCKS_ACTIVATION
    http: 409
    condition: "Activation attempted while the entity's outstanding_penalty_cents is greater than 0"
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 422
    condition: "paid_amount_cents differs from the assessment's assessed_amount_cents"

# =============================================================================
# §1.7 RBAC Matrix  (role_model: segregation_of_duties)
# =============================================================================
roles:

  - name: ReporterAgent
    description: "A packing firm acting for itself: files transaction and wholesale data, corrects it on request, appeals determinations. X-User-ID is the firm's ReportingEntity id, so every filing it touches must belong to one of its own plants."
    identity: "entity_backed:ReportingEntity"
    exclusive_operations:
      - "POST /registrations/{id}/appeal"
    shared_operations:
      - "POST /submissions"
      - "POST /submissions/{id}/transactions"
      - "POST /submissions/{id}/wholesale-lots"
      - "POST /submissions/{id}/submit"
      - "POST /submissions/{id}/resubmit"
      - "POST /methodology-changes/{id}/comments"
      - "all GET endpoints except the confidentiality-restricted public view"

  - name: ProgramAdmin
    description: "Program administrator: maintains entities, plants, registrations, reporting windows and the methodology-change process. Operator identity, not tied to any reporting entity."
    identity: opaque
    exclusive_operations:
      - "POST /reporting-entities"
      - "POST /plants"
      - "PATCH /plants/{id}"
      - "POST /registrations"
      - "POST /registrations/{id}/determine"
      - "POST /registrations/{id}/redetermine"
      - "POST /registrations/{id}/activate"
      - "POST /registrations/{id}/suspend"
      - "POST /reporting-windows"
      - "POST /reporting-windows/{id}/lock"
      - "POST /methodology-changes"
      - "POST /methodology-changes/{id}/close-comment"
      - "POST /methodology-changes/{id}/adopt"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /submissions and the whole filing chain (administrative filing on a reporter's behalf)"
      - "POST /market-reports and its compute / disclosure-review / publish actions"
      - "POST /penalty-assessments/{id}/waive"
      - "all GET endpoints"

  - name: MarketAnalyst
    description: "Market news analyst: validates filings, aggregates them into published market reports and applies the publication guidelines."
    identity: opaque
    exclusive_operations:
      - "POST /submissions/{id}/review"
    shared_operations:
      - "POST /market-reports"
      - "POST /market-reports/{id}/compute"
      - "POST /market-reports/{id}/disclosure-review"
      - "POST /market-reports/{id}/publish"
      - "all GET endpoints"

  - name: ComplianceAuditor
    description: "Compliance auditor: verifies accepted filings against plant records and reopens filings that fail verification. Never assesses money — the penalty side is a different pair of hands."
    identity: opaque
    exclusive_operations:
      - "POST /audit-cases"
      - "POST /audit-cases/{id}/start-fieldwork"
      - "POST /audit-cases/{id}/finalize"
      - "POST /audit-cases/{id}/close"
    shared_operations:
      - "POST /submissions/{id}/open-correction"
      - "all GET endpoints except the confidentiality-restricted public view"

  - name: PenaltyOfficer
    description: "Penalty officer: assesses, collects and waives penalties for late or inaccurate reporting and for failure to register. Segregation of duties bars the X-User-ID that finalized an audit case from assessing the penalty it produced."
    identity: opaque
    exclusive_operations:
      - "POST /penalty-assessments"
      - "POST /penalty-assessments/{id}/pay"
    shared_operations:
      - "POST /penalty-assessments/{id}/waive"
      - "all GET endpoints except the confidentiality-restricted public view"

  - name: PublicUser
    description: "Anyone reading the published market news or commenting on a proposed methodology change. Sees only PUBLISHED market reports; withheld and unpublished aggregates are invisible."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /methodology-changes/{id}/comments"
      - "GET /market-reports/{id} and GET /market-reports (PUBLISHED only)"
      - "GET /methodology-changes, GET /methodology-changes/{id}, GET /methodology-changes/{id}/comments"
