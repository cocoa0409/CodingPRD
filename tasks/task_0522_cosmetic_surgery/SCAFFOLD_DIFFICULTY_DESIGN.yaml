  - rule_id: compensating_invariant
    instances:
      - name: invariant_deposit_conservation_on_cancel
        grounds:
          - calculations.cancellation_settlement
          - state_machines.SurgeryBooking.SCHEDULED_to_CANCELLED
          - entities.SurgeryBooking.fields.deposit_forfeited_cents
        distinguishing_aspect: |
          Conserved quantity #1 (deposit dollars): on cancel, deposit_forfeited_cents + deposit_refunded_cents
          == the deposit_paid_cents recorded before cancel (266000). With 20 days notice (clock 2026-07-12)
          the split is 133000 + 133000 == 266000, exact complement, no drift.
        test_recipe:
          setup:
            - "An ACCEPTED quote (total 1330000, deposit 266000 paid) with a SCHEDULED booking for 2026-08-01; clock set to 2026-07-12 (20 days notice, 50% tier)."
