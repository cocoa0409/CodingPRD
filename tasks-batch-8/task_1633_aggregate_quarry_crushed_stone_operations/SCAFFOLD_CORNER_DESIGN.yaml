            - { call: "POST /scales", payload: { site_id: "${site}", scale_code: "BELT-01", scale_type: "BELT" }, as: QuarryAdmin, captures: { belt: $.data.id } }
            - { call: "POST /scale-calibrations", payload: { scale_id: "${belt}", calibrated_on: "2026-02-02", as_found_error_pct: 0.10, as_left_error_pct: 0.05 }, as: QuarryAdmin }
