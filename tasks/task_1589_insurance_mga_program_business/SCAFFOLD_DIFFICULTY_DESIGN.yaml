# =============================================================================
# §1.8 Scaffold Difficulty Design — Insurance MGA & Program Business Administration
# 9 Difficulty Rules x 3 instances = 27 instances.
# Shared base chain (repeated per instance with instance-scoped capture names):
#   carrier -> program -> guideline(OCC) -> capacity-allocation(OCC) ->
#   rate-filing -> submit -> approve -> mark-effective -> activate.
# Default logical clock at startup: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: premium_provisional_vs_final_audit_upward
        grounds:
          - calculations.policy_premium
          - entities.Policy.fields.final_premium_cents
          - state_machines.Policy.NOT_AUDITED_to_AUDITED
        distinguishing_aspect: |
          Entity domain = Policy pricing. The same policy rated provisionally at bind
          (estimated exposure 100, mod 1.0) and re-rated at final audit (actual exposure
          120, mod 1.20) produces gross 155000 vs final 221000; the +66000 delta posts a
          COLLECTION entry and raises both capacity counters.
        test_recipe:
          setup:
            - "ACTIVE program (aggregate 2000000, tranche 1000000, commission 0.15) with EFFECTIVE CA filing (ARTISAN @1500c, fee 5000c) and ACTIVE guideline CA/ARTISAN (max_prem 250000, min 5000)"
            - "Policy issued: exposure 100, mod 1.0 -> gross_premium_cents 155000, collected 155000, trust balance 155000"
          setup_api_calls:
            - { call: "POST /mga/carriers", payload: { name: "Carrier DV1", naic_code: "NAIC-DV1", contact_email: "uw@dv1.com" }, as: PlatformAdmin, captures: { ca: $.data.id } }
            - { call: "POST /mga/programs", payload: { carrier_id: "${ca}", name: "DV1 Program", line_of_business: "GENERAL_LIABILITY", states_covered: ["CA"], inception_date: "2026-08-01T00:00:00Z", aggregate_limit_cents: 2000000, commission_rate_pct: 0.15, corrective_threshold_pct: 70, termination_threshold_pct: 85, min_trust_balance_cents: 10000, min_earned_premium_for_ratio_cents: 50000 }, as: MGAUnderwriter, captures: { prog: $.data.id, prog_v: $.data.version } }
            - { call: "POST /mga/programs/${prog}/guidelines", payload: { state_code: "CA", class_code: "ARTISAN", max_policy_premium_cents: 250000, max_policy_limit_cents: 1000000, min_policy_premium_cents: 5000, expected_program_version: "${prog_v}" }, as: MGAUnderwriter }
            - { call: "GET /mga/programs/${prog}", payload: {}, as: MGAUnderwriter, captures: { prog_v2: $.data.version } }
            - { call: "POST /mga/programs/${prog}/capacity-allocations", payload: { period_label: "2026-Q3", allocated_cents: 1000000, expected_program_version: "${prog_v2}" }, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/rate-filings", payload: { state_code: "CA", filing_type: "RATE", base_rates: { ARTISAN: 1500 }, policy_fee_cents: 5000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: MGAUnderwriter, captures: { fil: $.data.id } }
            - { call: "POST /mga/rate-filings/${fil}/submit", payload: {}, as: MGAUnderwriter }
            - { call: "POST /mga/rate-filings/${fil}/approve", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/rate-filings/${fil}/mark-effective", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/activate", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/policies", payload: { insured_name: "Acme", state_code: "CA", class_code: "ARTISAN", exposure_units: 100, coverage_limit_cents: 500000, experience_mod: 1.0, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: MGAUnderwriter, captures: { pol: $.data.id } }
            - { call: "POST /mga/policies/${pol}/bind", payload: {}, as: MGAUnderwriter }
            - { call: "POST /mga/policies/${pol}/collections", payload: { amount_cents: 155000 }, as: MGAFinance }
            - { call: "POST /mga/policies/${pol}/issue", payload: {}, as: MGAUnderwriter }
          trigger:
            - { call: "POST /mga/policies/${pol}/final-audit", payload: { actual_exposure_units: 120, actual_experience_mod: 1.20 }, as: MGAUnderwriter, captures: { final_prem: $.data.final_premium_cents, audit_st: $.data.audit_status } }
          assert:
            - "trigger response final_premium_cents == 221000 (round_half_up(120*1500*1.20)+5000), != gross_premium_cents 155000"
            - "Policy.${pol}.gross_premium_cents == 155000 (provisional preserved)"
            - "Policy.${pol}.audit_status == AUDITED; Policy.status still ISSUED"
            - "GET program: consumed_aggregate_cents == 221000 (155000 + 66000 delta)"
            - "GET trust-ledger: newest COLLECTION entry amount_cents == 66000, running_balance_cents == 221000"

      - name: loss_ratio_paid_vs_incurred_divergence
        grounds:
          - calculations.loss_ratio
          - entities.LossEvaluation.fields.outcome
          - state_machines.Program.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Entity domain = Program performance (different from Policy pricing in
          premium_provisional_vs_final_audit_upward). Identical data yields paid ratio
          60.00 (would be OK) vs incurred ratio 90.00 (TERMINATION_REVIEW); outcome is
          driven by the incurred basis only, and the breach auto-suspends the program.
        test_recipe:
          setup:
            - "ACTIVE program (tranche 500000, aggregate 1000000, min_earned 50000, thresholds 70/85) with EFFECTIVE filing and ACTIVE CA/ARTISAN guideline"
            - "TPA appointment ACTIVE for LIABILITY (authority 100000, window 2026-08-01..2027-08-01)"
            - "Policy 240 units -> gross 365000, bound, collected 365000, issued (term 2026-08-01..2027-08-01, 365 days)"
            - "Clock 2026-08-12: claim1 LIABILITY occ 2026-08-10 amount 60000 -> review -> approve 60000 -> pay (trust 365000 -> 305000); claim2 LIABILITY occ 2026-08-12 amount 50000 -> review -> reserve 30000"
            - "Clock advanced to 2026-11-09 (elapsed 100 days -> earned = 365000*100/365 = 100000)"
          setup_api_calls:
            - { call: "POST /mga/carriers", payload: { name: "Carrier DV2", naic_code: "NAIC-DV2", contact_email: "uw@dv2.com" }, as: PlatformAdmin, captures: { ca: $.data.id } }
            - { call: "POST /mga/tpas", payload: { name: "TPA DV2", license_number: "LIC-DV2", contact_email: "ops@dv2.com" }, as: PlatformAdmin, captures: { tpa: $.data.id } }
            - { call: "POST /mga/programs", payload: { carrier_id: "${ca}", name: "DV2 Program", line_of_business: "GENERAL_LIABILITY", states_covered: ["CA"], inception_date: "2026-08-01T00:00:00Z", aggregate_limit_cents: 1000000, commission_rate_pct: 0.15, corrective_threshold_pct: 70, termination_threshold_pct: 85, min_trust_balance_cents: 10000, min_earned_premium_for_ratio_cents: 50000 }, as: MGAUnderwriter, captures: { prog: $.data.id, prog_v: $.data.version } }
            - { call: "POST /mga/programs/${prog}/guidelines", payload: { state_code: "CA", class_code: "ARTISAN", max_policy_premium_cents: 500000, max_policy_limit_cents: 1000000, min_policy_premium_cents: 5000, expected_program_version: "${prog_v}" }, as: MGAUnderwriter }
            - { call: "GET /mga/programs/${prog}", payload: {}, as: MGAUnderwriter, captures: { prog_v2: $.data.version } }
            - { call: "POST /mga/programs/${prog}/capacity-allocations", payload: { period_label: "2026-Q3", allocated_cents: 500000, expected_program_version: "${prog_v2}" }, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/rate-filings", payload: { state_code: "CA", filing_type: "RATE", base_rates: { ARTISAN: 1500 }, policy_fee_cents: 5000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: MGAUnderwriter, captures: { fil: $.data.id } }
            - { call: "POST /mga/rate-filings/${fil}/submit", payload: {}, as: MGAUnderwriter }
            - { call: "POST /mga/rate-filings/${fil}/approve", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/rate-filings/${fil}/mark-effective", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/activate", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/tpa-appointments", payload: { tpa_id: "${tpa}", claim_type: "LIABILITY", authority_limit_cents: 100000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: CarrierUnderwriter, as_user_id: "${ca}", captures: { appt: $.data.id } }
            - { call: "POST /mga/tpa-appointments/${appt}/activate", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/policies", payload: { insured_name: "BigCo", state_code: "CA", class_code: "ARTISAN", exposure_units: 240, coverage_limit_cents: 900000, experience_mod: 1.0, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: MGAUnderwriter, captures: { pol: $.data.id } }
            - { call: "POST /mga/policies/${pol}/bind", payload: {}, as: MGAUnderwriter }
            - { call: "POST /mga/policies/${pol}/collections", payload: { amount_cents: 365000 }, as: MGAFinance }
            - { call: "POST /mga/policies/${pol}/issue", payload: {}, as: MGAUnderwriter }
            - { call: "POST /mga/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /mga/policies/${pol}/claims", payload: { claim_type: "LIABILITY", occurrence_date: "2026-08-10T00:00:00Z", amount_claimed_cents: 60000 }, as: MGAUnderwriter, captures: { cl1: $.data.id, cl1_tpa: $.data.assigned_tpa_id } }
            - { call: "POST /mga/claims/${cl1}/start-review", payload: {}, as: TPAAdjuster, as_user_id: "${tpa}" }
            - { call: "POST /mga/claims/${cl1}/approve", payload: { approved_amount_cents: 60000 }, as: TPAAdjuster, as_user_id: "${tpa}" }
            - { call: "POST /mga/claims/${cl1}/pay", payload: {}, as: TPAAdjuster, as_user_id: "${tpa}" }
            - { call: "POST /mga/policies/${pol}/claims", payload: { claim_type: "LIABILITY", occurrence_date: "2026-08-12T00:00:00Z", amount_claimed_cents: 50000 }, as: MGAUnderwriter, captures: { cl2: $.data.id } }
            - { call: "POST /mga/claims/${cl2}/start-review", payload: {}, as: TPAAdjuster, as_user_id: "${tpa}" }
            - { call: "POST /mga/claims/${cl2}/set-reserve", payload: { case_reserve_cents: 30000 }, as: TPAAdjuster, as_user_id: "${tpa}" }
            - { call: "POST /mga/_clock/set_current_utc", payload: { to_iso8601: "2026-11-09T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /mga/programs/${prog}/loss-evaluations", payload: { period_label: "2026-11" }, as: CarrierUnderwriter, as_user_id: "${ca}", captures: { ev: $.data.id, paid_r: $.data.paid_loss_ratio_pct, inc_r: $.data.incurred_loss_ratio_pct, outcome: $.data.outcome } }
          assert:
            - "evaluation earned_premium_cents == 100000, paid_losses_cents == 60000, case_reserves_cents == 30000"
            - "paid_loss_ratio_pct == 60.00 AND incurred_loss_ratio_pct == 90.00 (same inputs, divergent variants)"
            - "outcome == TERMINATION_REVIEW (incurred 90.00 >= 85; a paid-basis rule would say 60.00 < 70 -> OK)"
            - "GET program: status == SUSPENDED (auto-cascade), latest_incurred_loss_ratio_pct == 90.00"
            - "Claim.${cl2}.status == REFERRED with referral_reason == APPOINTMENT_SUSPENDED (cascade hop 3)"

      - name: earned_premium_pro_rata_vs_short_rate
        grounds:
          - calculations.earned_premium
          - entities.Policy.fields.earned_premium_cents
        distinguishing_aspect: |
          Third variant pair, on the cancellation-refund metric: two policies with
          identical 365000 premium and identical elapsed 100/365 days differ only by
          cancellation_reason — CARRIER_REQUEST earns pro-rata 100000 (refund 262500),
          INSURED_REQUEST earns short-rate 110000 (refund 252500).
        test_recipe:
          setup:
            - "ACTIVE program (aggregate 2000000, tranche 1500000, commission 0.15) with EFFECTIVE filing and guideline"
            - "Policy A and Policy B: each 240 units -> gross 365000, bound, fully collected, issued; term 2026-08-01..2027-08-01"
            - "Clock 2026-11-09; both cancelled with cancellation_date == 2026-11-09; A reason INSURED_REQUEST, B reason CARRIER_REQUEST"
          setup_api_calls:
            - { call: "POST /mga/carriers", payload: { name: "Carrier DV3", naic_code: "NAIC-DV3", contact_email: "uw@dv3.com" }, as: PlatformAdmin, captures: { ca: $.data.id } }
            - { call: "POST /mga/programs", payload: { carrier_id: "${ca}", name: "DV3 Program", line_of_business: "GENERAL_LIABILITY", states_covered: ["CA"], inception_date: "2026-08-01T00:00:00Z", aggregate_limit_cents: 2000000, commission_rate_pct: 0.15, corrective_threshold_pct: 70, termination_threshold_pct: 85, min_trust_balance_cents: 10000, min_earned_premium_for_ratio_cents: 50000 }, as: MGAUnderwriter, captures: { prog: $.data.id, prog_v: $.data.version } }
            - { call: "POST /mga/programs/${prog}/guidelines", payload: { state_code: "CA", class_code: "ARTISAN", max_policy_premium_cents: 500000, max_policy_limit_cents: 1000000, min_policy_premium_cents: 5000, expected_program_version: "${prog_v}" }, as: MGAUnderwriter }
            - { call: "GET /mga/programs/${prog}", payload: {}, as: MGAUnderwriter, captures: { prog_v2: $.data.version } }
            - { call: "POST /mga/programs/${prog}/capacity-allocations", payload: { period_label: "2026-Q3", allocated_cents: 1500000, expected_program_version: "${prog_v2}" }, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/rate-filings", payload: { state_code: "CA", filing_type: "RATE", base_rates: { ARTISAN: 1500 }, policy_fee_cents: 5000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: MGAUnderwriter, captures: { fil: $.data.id } }
            - { call: "POST /mga/rate-filings/${fil}/submit", payload: {}, as: MGAUnderwriter }
            - { call: "POST /mga/rate-filings/${fil}/approve", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/rate-filings/${fil}/mark-effective", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/activate", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/policies", payload: { insured_name: "A Co", state_code: "CA", class_code: "ARTISAN", exposure_units: 240, coverage_limit_cents: 900000, experience_mod: 1.0, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: MGAUnderwriter, captures: { polA: $.data.id } }
            - { call: "POST /mga/policies/${polA}/bind", payload: {}, as: MGAUnderwriter }
            - { call: "POST /mga/policies/${polA}/collections", payload: { amount_cents: 365000 }, as: MGAFinance }
            - { call: "POST /mga/policies/${polA}/issue", payload: {}, as: MGAUnderwriter }
            - { call: "POST /mga/programs/${prog}/policies", payload: { insured_name: "B Co", state_code: "CA", class_code: "ARTISAN", exposure_units: 240, coverage_limit_cents: 900000, experience_mod: 1.0, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: MGAUnderwriter, captures: { polB: $.data.id } }
            - { call: "POST /mga/policies/${polB}/bind", payload: {}, as: MGAUnderwriter }
            - { call: "POST /mga/policies/${polB}/collections", payload: { amount_cents: 365000 }, as: MGAFinance }
            - { call: "POST /mga/policies/${polB}/issue", payload: {}, as: MGAUnderwriter }
            - { call: "POST /mga/_clock/set_current_utc", payload: { to_iso8601: "2026-11-09T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /mga/policies/${polA}/cancel", payload: { cancellation_date: "2026-11-09T00:00:00Z", reason: "INSURED_REQUEST" }, as: MGAUnderwriter }
            - { call: "POST /mga/policies/${polB}/cancel", payload: { cancellation_date: "2026-11-09T00:00:00Z", reason: "CARRIER_REQUEST" }, as: MGAUnderwriter }
          trigger:
            - { call: "POST /mga/_ops/run-daily", payload: {}, as: PlatformAdmin }
          assert:
            - "Policy.${polA}.earned_premium_cents == 110000 (short-rate: round(100000*1.10)); Policy.${polB}.earned_premium_cents == 100000 (pro-rata)"
            - "Policy.${polA}.status == CANCELLED; Policy.${polB}.status == CANCELLED"
            - "REFUND entries: policy A refund == 252500 (365000-110000-2500); policy B refund == 262500 (365000-100000-2500) — identical dates, 10000 divergence from reason alone"
            - "GET program: trust_balance_cents == 215000 (730000 - 252500 - 262500)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: premium_clamp_multiply_fee_interaction
        grounds:
          - calculations.policy_premium
          - entities.Policy.fields.gross_premium_cents
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: experience_mod 1.30 is
          clamped to 1.25 by nested min/max BEFORE the exposure*rate multiply, then a
          flat fee is added: 100*1500*1.25 + 5000 = 192500 (an unclamped multiply would
          give 200000).
        test_recipe:
          setup:
            - "ACTIVE program with EFFECTIVE filing (ARTISAN @1500c, fee 5000c), guideline max_prem 250000/min 5000"
          setup_api_calls:
            - { call: "POST /mga/carriers", payload: { name: "Carrier CF1", naic_code: "NAIC-CF1", contact_email: "uw@cf1.com" }, as: PlatformAdmin, captures: { ca: $.data.id } }
            - { call: "POST /mga/programs", payload: { carrier_id: "${ca}", name: "CF1 Program", line_of_business: "GENERAL_LIABILITY", states_covered: ["CA"], inception_date: "2026-08-01T00:00:00Z", aggregate_limit_cents: 500000, commission_rate_pct: 0.15, corrective_threshold_pct: 70, termination_threshold_pct: 85, min_trust_balance_cents: 10000, min_earned_premium_for_ratio_cents: 50000 }, as: MGAUnderwriter, captures: { prog: $.data.id, prog_v: $.data.version } }
            - { call: "POST /mga/programs/${prog}/guidelines", payload: { state_code: "CA", class_code: "ARTISAN", max_policy_premium_cents: 250000, max_policy_limit_cents: 1000000, min_policy_premium_cents: 5000, expected_program_version: "${prog_v}" }, as: MGAUnderwriter }
            - { call: "GET /mga/programs/${prog}", payload: {}, as: MGAUnderwriter, captures: { prog_v2: $.data.version } }
            - { call: "POST /mga/programs/${prog}/capacity-allocations", payload: { period_label: "2026-Q3", allocated_cents: 300000, expected_program_version: "${prog_v2}" }, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/rate-filings", payload: { state_code: "CA", filing_type: "RATE", base_rates: { ARTISAN: 1500 }, policy_fee_cents: 5000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: MGAUnderwriter, captures: { fil: $.data.id } }
            - { call: "POST /mga/rate-filings/${fil}/submit", payload: {}, as: MGAUnderwriter }
            - { call: "POST /mga/rate-filings/${fil}/approve", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/rate-filings/${fil}/mark-effective", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/activate", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
          trigger:
            - { call: "POST /mga/programs/${prog}/policies", payload: { insured_name: "Clamp Co", state_code: "CA", class_code: "ARTISAN", exposure_units: 100, coverage_limit_cents: 500000, experience_mod: 1.30, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: MGAUnderwriter, captures: { pol: $.data.id, gross: $.data.gross_premium_cents, comm: $.data.mga_commission_cents } }
          assert:
            - "gross_premium_cents == 192500 (mod clamped 1.30 -> 1.25; NOT 200000)"
            - "mga_commission_cents == 28875 (round_half_up(192500*0.15))"
            - "Policy.${pol}.status == QUOTED"

      - name: bordereau_per_row_round_then_sum
        grounds:
          - calculations.bordereau_totals
          - entities.Bordereau.fields.computed_totals
        distinguishing_aspect: |
          Mode (b) — nested rounding order: commission is rounded half-up PER ROW then
          summed. Three rows of 155004 at 15% give 23251 per row -> total 69753;
          rounding the aggregate (465012*0.15 = 69751.8) would give 69752 — the pinned
          order differs by exactly 1 cent and the submit with the pinned total succeeds.
        test_recipe:
          setup:
            - "ACTIVE program (tranche 600000, aggregate 1000000) with EFFECTIVE filing whose policy_fee_cents == 5004 (so gross = 1500*100 + 5004 = 155004)"
            - "three policies, exposure 100 each, all BOUND (gross 155004, commission 23251 each)"
          setup_api_calls:
            - { call: "POST /mga/carriers", payload: { name: "Carrier CF2", naic_code: "NAIC-CF2", contact_email: "uw@cf2.com" }, as: PlatformAdmin, captures: { ca: $.data.id } }
            - { call: "POST /mga/programs", payload: { carrier_id: "${ca}", name: "CF2 Program", line_of_business: "GENERAL_LIABILITY", states_covered: ["CA"], inception_date: "2026-08-01T00:00:00Z", aggregate_limit_cents: 1000000, commission_rate_pct: 0.15, corrective_threshold_pct: 70, termination_threshold_pct: 85, min_trust_balance_cents: 10000, min_earned_premium_for_ratio_cents: 50000 }, as: MGAUnderwriter, captures: { prog: $.data.id, prog_v: $.data.version } }
            - { call: "POST /mga/programs/${prog}/guidelines", payload: { state_code: "CA", class_code: "ARTISAN", max_policy_premium_cents: 250000, max_policy_limit_cents: 1000000, min_policy_premium_cents: 5000, expected_program_version: "${prog_v}" }, as: MGAUnderwriter }
            - { call: "GET /mga/programs/${prog}", payload: {}, as: MGAUnderwriter, captures: { prog_v2: $.data.version } }
            - { call: "POST /mga/programs/${prog}/capacity-allocations", payload: { period_label: "2026-Q3", allocated_cents: 600000, expected_program_version: "${prog_v2}" }, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/rate-filings", payload: { state_code: "CA", filing_type: "RATE", base_rates: { ARTISAN: 1500 }, policy_fee_cents: 5004, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: MGAUnderwriter, captures: { fil: $.data.id } }
            - { call: "POST /mga/rate-filings/${fil}/submit", payload: {}, as: MGAUnderwriter }
            - { call: "POST /mga/rate-filings/${fil}/approve", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/rate-filings/${fil}/mark-effective", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/activate", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
