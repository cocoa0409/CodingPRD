            - call: POST /payout-statements
              payload: { cook_id: "${cook_id}", production_window_id: "${w_id}", basis: "ACCRUAL_WINDOW", expected_production_window_version: "${w_ver}" }
              as: FinanceOperator
              as_user_id: fin-1
              captures: { st_id: "$.data.id", st_status: "$.data.status" }
            - call: POST /payout-statements/${st_id}/advance
              payload: { to_status: "PAID" }
              as: FinanceOperator
              as_user_id: fin-1
              captures: { e_statement: "$.data.error_id" }
            - call: GET /production-windows/${w_id}
              payload: {}
