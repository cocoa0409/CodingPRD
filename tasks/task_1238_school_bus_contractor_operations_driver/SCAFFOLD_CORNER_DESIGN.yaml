        distinguishing_aspect: "DECLINED is terminal: approving a declined quote fails with ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["ACTIVE contract; charter QUOTED then DECLINED"]
          setup_api_calls:
            - { call: "POST /busops/districts", payload: { name: "D-SM10", region_fuel_index_code: "WEST", credit_limit_cents: 5000000, billing_dispute_window_days: 30 }, as: SystemAdmin, captures: { d_id: $.data.id } }
            - { call: "POST /busops/contracts", payload: { district_id: "${d_id}", bid_reference: "BID-S10", daily_rate_per_bus_cents: 50000, school_days_per_year: 180, fuel_base_price_cents: 400, penalty_mode: "FLAT_PER_ROUTE", shortage_penalty_flat_cents: 15000, shortage_penalty_per_student_minute_cents: 25, assumed_minutes_per_missed_route: 45, monthly_cap_cents: 10000000, charter_hourly_rate_cents: 12000, charter_per_mile_cents: 250, start_date: "2026-01-01", end_date: "2026-12-31" }, as: ContractorOps, captures: { c_id: $.data.id } }
            - { call: "POST /busops/contracts/${c_id}/submit", payload: {}, as: ContractorOps }
            - { call: "POST /busops/contracts/${c_id}/award", payload: {}, as: DistrictAdmin, as_user_id: "${d_id}" }
            - { call: "POST /busops/contracts/${c_id}/activate", payload: {}, as: ContractorOps }
            - { call: "POST /busops/charter-trips", payload: { contract_id: "${c_id}", purpose: "Declined trip", trip_date: "2026-06-10", pickup_minute: 600, return_minute: 720, estimated_hours_x10: 20, estimated_miles: 40, passenger_count: 20 }, as: DistrictAdmin, as_user_id: "${d_id}", captures: { ch: $.data.id } }
            - { call: "POST /busops/charter-trips/${ch}/quote", payload: {}, as: ContractorOps }
            - { call: "POST /busops/charter-trips/${ch}/decline", payload: { reason: "Too expensive" }, as: DistrictAdmin, as_user_id: "${d_id}" }
            - { call: "GET /busops/charter-trips/${ch}", as: ContractorOps, captures: { ch_v: $.data.version } }
          trigger:
            - { call: "POST /busops/charter-trips/${ch}/approve", payload: { expected_charter_trip_version: "${ch_v}", deposit_cents: 0 }, as: DistrictAdmin, as_user_id: "${d_id}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_ALREADY_TERMINAL"
            - "CharterTrip.${ch}.status == DECLINED"
      - name: inspection_overdue_system_transition_grounds_bus
        claim_type: valid_transition
        grounds:
          - state_machines.Inspection.SCHEDULED_to_OVERDUE
        distinguishing_aspect: "Clock advance past scheduled_date flips SCHEDULED -> OVERDUE automatically and grounds the bus (system transition, no result recorded)."
        test_recipe:
          setup: ["district; bus with inspection scheduled 2026-05-10, never resulted; clock default 2026-05-01"]
          setup_api_calls:
            - { call: "POST /busops/districts", payload: { name: "D-SM11", region_fuel_index_code: "WEST", credit_limit_cents: 5000000, billing_dispute_window_days: 30 }, as: SystemAdmin, captures: { d_id: $.data.id } }
            - { call: "POST /busops/buses", payload: { district_id: "${d_id}", fleet_number: "BS11", capacity: 48, fuel_type: "DIESEL", mpg_x10: 80, next_inspection_due: "2026-12-31" }, as: FleetManager, captures: { b_id: $.data.id } }
            - { call: "POST /busops/inspections", payload: { bus_id: "${b_id}", scheduled_date: "2026-05-10", inspector_ref: "ST-2" }, as: FleetManager, captures: { insp: $.data.id } }
          trigger:
            - { call: "POST /busops/_clock/set_current_utc", payload: { to_iso8601: "2026-05-11T00:00:00Z" }, as: SystemAdmin }
            - { call: "GET /busops/inspections/${insp}", as: FleetManager, captures: { i_st: $.data.status } }
            - { call: "GET /busops/buses/${b_id}", as: FleetManager, captures: { b_st: $.data.status } }
          assert:
            - "${i_st} == OVERDUE (scheduled_date 2026-05-10 < clock 2026-05-11)"
            - "${b_st} == GROUNDED (overdue cascade)"
      - name: idempotent_second_confirm_rejected
        claim_type: idempotency
        grounds:
          - state_machines.Assignment
        distinguishing_aspect: "Repeating the same CONFIRM trigger against the now-CONFIRMED assignment is rejected with ERR_INVALID_STATE — transitions are not silently idempotent."
        test_recipe:
