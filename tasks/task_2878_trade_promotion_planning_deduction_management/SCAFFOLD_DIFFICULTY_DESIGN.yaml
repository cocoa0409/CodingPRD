      - name: customer_trading_and_audit_axes_advance_independently
        grounds:
          - state_machines.Customer.trading_status
          - state_machines.Customer.audit_status
          - state_machines.ComplianceAudit.status
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          Customer carries two independent state dimensions. A manual credit-hold moves only
          trading_status ACTIVE -> CREDIT_HOLD; opening an audit afterwards moves only
          audit_status CLEAR -> AUDIT_IN_PROGRESS and must leave trading_status at CREDIT_HOLD
          with its original operator-supplied credit_hold_reason intact; issuing findings moves
          audit_status to FINDINGS_OPEN and adds 10 penalty points, which is below
          SUSPENSION_POINTS (25), so trading_status still does not move. This uses a different
          entity from the Promotion revision-cycle instance and exercises parallel axes rather
          than a cycle.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01."
            - "One program and one customer, initially trading_status ACTIVE and audit_status CLEAR."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
