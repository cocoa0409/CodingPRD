              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/picture-lock"
              payload: {}
              as: PostSupervisor
              as_user_id: "sup-1"
            - call: "GET /projects/${proj_id}"
              as: PostSupervisor
