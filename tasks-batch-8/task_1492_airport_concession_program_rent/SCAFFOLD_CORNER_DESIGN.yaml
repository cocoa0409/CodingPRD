            - { call: "POST /concessions/sales-reports", payload: { lease_id: "${l1}", period_month: "2026-01", gross_sales_cents: 100000 }, as: Tenant, as_user_id: "${t1}", captures: { r1: $.data.id } }
            - { call: "POST /concessions/sales-reports/${r1}/transition", payload: { action: "SUBMIT" }, as: Tenant, as_user_id: "${t1}" }
            - { call: "POST /concessions/audits", payload: { lease_id: "${l1}", period_start_month: "2026-01", period_end_month: "2026-03" }, as: Auditor, captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /concessions/audits/${a1}/issue-findings", payload: { findings: [ { sales_report_id: "${r1}", restated_gross_sales_cents: 900000 } ] }, as: Auditor, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_AUDIT_FINDING_REPORT_STATE"

      - name: evaluate_closed_review_returns_review_state_forbids
        claim_type: violation_to_error
        grounds: ["validations[priority=19]", "errors[ERR_REVIEW_STATE_FORBIDS]"]
        distinguishing_aspect: "Re-evaluating a COMPLIANT (terminal) review returns ERR_REVIEW_STATE_FORBIDS."
        test_recipe:
          setup: ["ACTIVE lease; ACCEPTED report 2026-04 gross 1,000,000; review evaluated COMPLIANT"]
          setup_api_calls:
            - { call: "POST /concessions/tenants", payload: { legal_name: "SkyEats LLC", contact_email: "ops@skyeats.com" }, as: AirportAdmin, captures: { t1: $.data.id } }
            - { call: "POST /concessions/leases", payload: { tenant_id: "${t1}", premises_code: "A1", category: "FOOD", term_start_date: "2026-01-01", term_end_date: "2030-12-31", mag_annual_cents: 1200000, pct_rate_below_bp: 800, pct_breakpoint_cents: 500000, pct_rate_above_bp: 1000, acdbe_goal_bp: 2000, ti_allowance_cents: 500000, buildout_deadline: "2026-09-30", min_spe_cents: 1000 }, as: AirportAdmin, captures: { l1: $.data.id } }
            - { call: "POST /concessions/leases/${l1}/transition", payload: { action: "ACTIVATE" }, as: AirportAdmin }
            - { call: "POST /concessions/sales-reports", payload: { lease_id: "${l1}", period_month: "2026-04", gross_sales_cents: 1000000 }, as: Tenant, as_user_id: "${t1}", captures: { r1: $.data.id } }
            - { call: "POST /concessions/sales-reports/${r1}/transition", payload: { action: "SUBMIT" }, as: Tenant, as_user_id: "${t1}" }
            - { call: "POST /concessions/sales-reports/${r1}/transition", payload: { action: "ACCEPT" }, as: ConcessionAnalyst }
            - { call: "POST /concessions/acdbe-reviews", payload: { lease_id: "${l1}", period_year: 2026 }, as: ConcessionAnalyst, captures: { rv: $.data.id } }
            - { call: "POST /concessions/acdbe-reviews/${rv}/evaluate", payload: { certified_revenue_cents: 300000 }, as: ConcessionAnalyst }
          trigger:
            - { call: "POST /concessions/acdbe-reviews/${rv}/evaluate", payload: { certified_revenue_cents: 100 }, as: ConcessionAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_REVIEW_STATE_FORBIDS"

      - name: recalculate_paid_settlement_returns_settlement_state_forbids
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_SETTLEMENT_STATE_FORBIDS]"]
        distinguishing_aspect: "Manual recalculate of a PAID settlement returns ERR_SETTLEMENT_STATE_FORBIDS (only the audit cascade may reopen PAID)."
        test_recipe:
