              as: Analyst
              as_user_id: "${ana}"
              captures: { plan: $.data.id }
            - call: "POST /fof/programs/${prog}/pacing-plans/${plan}/approve"
              payload: {}
              as: CIO
            - call: "POST /fof/managers"
              payload: { legal_name: "PhiCap", domicile_country: "US", relationship_since_year: 2016 }
              as: Analyst
              as_user_id: "${ana}"
              captures: { mgr: $.data.id }
            - call: "POST /fof/managers/${mgr}/vehicles"
              payload: { fund_name: "Phi I", strategy: "BUYOUT", vintage_year: 2026, fund_size_target: 400000000, mgmt_fee_rate_early: 0.02, mgmt_fee_rate_late: 0.01, investment_period_years: 5, carry_rate: 0.20, hurdle_rate: 0.08 }
