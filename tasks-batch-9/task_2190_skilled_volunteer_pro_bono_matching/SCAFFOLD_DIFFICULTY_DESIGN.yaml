      - name: rescope_required_scope_change_depth_five
        grounds:
          - calculations.scope_change_projection
          - state_machines.ScopeChangeRequest.PENDING_to_ESCALATED
          - state_machines.ProjectRequest.IN_DELIVERY_to_RESCOPING
          - state_machines.Engagement.work_status.IN_PROGRESS_to_TERMINATED
          - state_machines.ScopeChangeRequest.ESCALATED_to_VOIDED
          - calculations.volunteer_reliability_score
        distinguishing_aspect: |
          Entry point POST /engagements/{id}/scope-change-requests, five hops deep and triggered by a
          calculation rather than by an explicit status write: (1) scope_change_projection computes
          (12.00 + 0.00 + 48.00 - 40.00) / 40.00 = exactly 0.5000, which is at the inclusive
          RESCOPE_FLOOR, so decision_tier is RESCOPE_REQUIRED and the row is created ESCALATED rather
          than PENDING or AUTO_APPROVABLE; (2) BECAUSE the tier is RESCOPE_REQUIRED, ProjectRequest
          IN_DELIVERY -> RESCOPING and rescope_count becomes 1; (3) BECAUSE of the same tier, the
          Engagement is TERMINATED with termination_reason SCOPE_BREACH, releasing 40.00 hours and its
          slot and WAIVING the SCHEDULED milestone; (4) BECAUSE the engagement terminated, the just
          created ESCALATED change request is immediately VOIDED; (5) BECAUSE the engagement became
          terminal, reliability reruns to 0.2500 (points 0.25 for SCOPE_BREACH), which is below the
          0.4000 floor, so the volunteer is PAUSED with pause_reason RELIABILITY_FLOOR. One POST
          therefore leaves its own row VOIDED and the acting volunteer suspended from matching.
        test_recipe:
          setup:
            - "Canonical world: cycle 2026-Q1 (10 slots), LARGE partner, one SENIOR volunteer vetted with LEGAL_CONTRACTS proficiency 4 verified, HARD window [2026-01-05, 2026-03-01) offering 300.00 hours, clock 2026-01-10T00:00:00Z, no prior terminal engagement."
