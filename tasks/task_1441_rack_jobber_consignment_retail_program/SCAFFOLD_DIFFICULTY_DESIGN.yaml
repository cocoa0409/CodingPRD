            - { call: "POST /audit-counts/${aud2}/certify", payload: { expected_audit_count_version: "${aud2_v}" }, as: JobberAdmin, as_user_id: "admin-1" }
            - { call: "GET /agreements/${agr1}", payload: {}, as: JobberAdmin }
            - { call: "GET /agreements/${agr2}", payload: {}, as: JobberAdmin }
          assert:
            - "StoreAgreement.${agr1}: cumulative_shrink_ratio == 0.02 and status == SUSPENDED — exactly at the 0.02 threshold, >= applies"
            - "StoreAgreement.${agr2}: cumulative_shrink_ratio == 0.019 and status == ACTIVE — one unit below the threshold"
            - "AuditCount.${aud1}.chargeable_units == 20; AuditCount.${aud2}.chargeable_units == 19"

      - name: payout_minimum_exact_cents
        grounds: [calculations.settlement_net_payable, "validations[priority=32]", "errors[ERR_PAYOUT_BELOW_MINIMUM]", state_machines.SettlementStatement.APPROVED_to_PAID]
        distinguishing_aspect: |
          Metric = net_payable CENTS at the pay endpoint (different metric and
