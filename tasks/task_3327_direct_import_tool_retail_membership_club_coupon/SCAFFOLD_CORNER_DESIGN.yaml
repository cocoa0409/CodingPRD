          assert:
            - "member return at day 45 succeeds: Sale.${s_m}.status == RETURNED_FULL"
            - "non-member return at day 45 rejected: err == ERR_RETURN_WINDOW_EXPIRED"

      - name: hazard_recall_return_overrides_window
        claim_type: conditional_validation
        grounds: ["validations[priority=13]", state_machines.Sale.COMPLETED_to_RETURNED_FULL]
        distinguishing_aspect: "A return 200 days after completion (past every window) is STILL allowed when the item has an ACTIVE HAZARD recall — safety override beats temporal gate."
        test_recipe:
          setup: ["item ACTIVE; store; non-member customer; completed sale at 2026-09-01; clock at 2027-03-20; HAZARD recall ACTIVE on the item"]
          setup_api_calls:
            - call: "POST /items"
