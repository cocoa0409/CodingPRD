        grounds:
          - entities.CoachingSession.fields.status
          - entities.CoachingSession.fields.delivered_hours
          - calculations.coaching_allocation_cost
          - validations[priority=57]
          - entities.CoachingAllocation.fields.allocated_hours
          - entities.CoachingAllocation.fields.scheduled_hours
          - entities.CoachingAllocation.fields.delivered_hours
          - entities.CoachingAllocation.fields.remaining_hours
        distinguishing_aspect: |
          Conserved quantity = COACHING HOURS BUDGET (an hours ledger, not money), pinned as
          allocated_hours == scheduled_hours + delivered_hours + remaining_hours: the forward
          action (schedule a 4.0-hour session) and its compensating action (cancel it) must
          leave 12.0 == 0.0 + 3.5 + 8.5, with the 3.5 delivered hours of the earlier session -
