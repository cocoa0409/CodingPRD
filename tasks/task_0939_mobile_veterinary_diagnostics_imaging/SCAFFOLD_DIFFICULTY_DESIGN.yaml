          trigger:
            - call: "POST /referrals/${rf_l}/return"
              payload: { return_reason: "clinical history missing" }
              as: Scheduler
              captures: { st_returned_1: $.data.status }
            - call: "POST /referrals/${rf_l}/resubmit"
              payload: { clinical_history: "vomiting for two days" }
              as: ClinicUser
              as_user_id: "${cl_l}"
              captures: { st_resub_1: $.data.status }
            - call: "POST /referrals/${rf_l}/return"
              payload: { return_reason: "need prior imaging dates" }
              as: Scheduler
            - call: "POST /referrals/${rf_l}/resubmit"
              payload: { clinical_history: "vomiting for two days; last radiographs 2026-01-14" }
              as: ClinicUser
              as_user_id: "${cl_l}"
            - call: "POST /referrals/${rf_l}/accept"
              payload: {}
