            - call: "POST /false-alarm-program/alarm-permits/${permit2}/renewals"
              payload: {expected_alarm_permit_version: "${permit2_v}"}
              as: PermitClerk
            - call: "GET /false-alarm-program/alarm-permits/${permit3}"
              payload: {}
