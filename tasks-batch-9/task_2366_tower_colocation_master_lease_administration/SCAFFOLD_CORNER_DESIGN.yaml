      - name: standard_crud_delete_equipment_line_returns_204
        claim_type: standard_crud
        grounds:
          - endpoints.DELETE_/tower-colo/equipment-lines/{id}
          - endpoints.GET_/tower-colo/equipment-lines
        distinguishing_aspect: |
          DELETE answers 204 with no envelope at all, the line disappears from the filtered list
          (total_count drops from 2 to 1) and a subsequent read of the deleted id returns 404
          ERR_EQUIPMENT_LINE_NOT_FOUND — a soft-hidden row that still answered 200 would fail.
        test_recipe:
          setup:
            - "Tenant DLE holds an ACTIVE master lease and a DRAFT application on tower DLE carrying two lines: 500.0 units at 80 ft and 62.5 units at 100 ft."
          setup_api_calls:
            - call: "POST /tower-colo/towers"
