              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { gp_id: "$.data.id" }
            - call: "POST /grant-proposals/${gp_id}/pipeline-actions"
              payload: { action: "SUBMIT_FOR_REVIEW" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
            - call: "POST /grant-proposals/${gp_id}/internal-review"
