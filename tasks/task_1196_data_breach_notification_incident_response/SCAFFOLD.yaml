errors:
- id: ERR_UNAUTHENTICATED
  http: 401
  condition: Missing or malformed X-User-Role / X-User-ID headers
- id: ERR_FORBIDDEN
  http: 403
  condition: Role not permitted to invoke this endpoint per §1.5 roles
- id: ERR_NOT_FOUND
  http: 404
  condition: Path id or body FK does not resolve to an existing row in scope
- id: ERR_INVALID_REQUEST
  http: 422
  condition: Schema/type/enum validation failure on request payload
- id: ERR_INVALID_STATE
  http: 409
  condition: Target entity not in a state permitting the requested transition
- id: ERR_STALE_VERSION
  http: 412
  condition: expected_incident_version does not match current incident.version
- id: ERR_SEGREGATION_OF_DUTIES
  http: 409
  condition: Same user attempted two segregated steps (approve vs author; verify vs own; respond vs submit)
- id: ERR_DEADLINE_PASSED
  http: 409
  condition: 'Statutory deadline/deferred-action precondition violated: jurisdiction deadline elapsed, ship date in future, or offer expired'
- id: ERR_CUSTODY_OVERLAP
  http: 409
  condition: Evidence custody interval overlaps an existing half-open interval for the same evidence_item_id, or seal attempted with invalid preservation_hash
- id: ERR_DATA_ELEMENT_OUT_OF_SCOPE
  http: 422
  condition: AffectedSubject.data_elements_exposed not a subset of baselined ForensicScope.data_elements_at_risk
- id: ERR_SUPERSESSION_CYCLE
  http: 422
  condition: Notice supersedes_notice_id would create a cycle in the supersession chain
- id: ERR_STAFFING_PLAN_OVERLAP
  http: 409
  condition: New CallCenterStaffingPlan's effective interval strictly overlaps an existing ACTIVE plan for the same incident
- id: ERR_DUPLICATE_SUBJECT
  http: 409
  condition: AffectedSubject.external_subject_ref already exists on this incident for a non-EXCLUDED row
- id: ERR_OFFER_ALREADY_ACTIVE
  http: 409
  condition: An ISSUED CreditMonitoringOffer already exists for this affected_subject_id
- id: ERR_INCIDENT_NOT_CONFIRMED
  http: 409
  condition: Operation requires incident.investigation_status == CONFIRMED
- id: ERR_NOTICE_NOT_APPROVABLE
  http: 409
  condition: Notice approve blocked because incident not CONFIRMED or jurisdiction deadline passed
- id: ERR_NO_ACTIVE_STAFFING_PLAN
  http: 409
  condition: Operation requires an ACTIVE CallCenterStaffingPlan but none exists
- id: ERR_BATCH_NOT_SHIPPABLE
  http: 409
  condition: MailingBatch cannot transition to SHIPPED (scheduled_ship_date in future, or wrong state)
- id: ERR_EVIDENCE_NOT_SEALED
  http: 409
  condition: Operation requires at least one SEALED EvidenceItem but none exists
- id: ERR_REMEDIATION_INCOMPLETE
  http: 409
  condition: Incident cannot transition to CONTAINED/CLOSED while technical remediation actions remain non-terminal
- id: ERR_NO_AFFECTED_SUBJECTS
  http: 409
  condition: Confirm requires total_affected_subjects > 0
roles:
- name: IncidentCommander
  description: Owns the incident lifecycle (create/confirm/contain/close) and remediation actions
  identity: opaque
  exclusive_operations:
  - POST /incidents
  - POST /incidents/{incidentId}/confirm
  - POST /incidents/{incidentId}/contain
  - POST /incidents/{incidentId}/close
  - POST /incidents/{incidentId}/remediation-actions (and start/complete/cancel)
  - POST /incidents/{incidentId}/call-center-staffing-plans (and close)
  - POST /_clock/set_current_utc
  shared_operations:
  - GET reads on all incident resources
- name: ForensicLead
  description: Owns forensic scope, evidence, and custody
  identity: opaque
  exclusive_operations:
  - POST /incidents/{incidentId}/forensic-scopes/{scopeId}/baseline|amend|re-baseline|finalize
  - POST /incidents/{incidentId}/evidence-items (and seal/release/destroy)
  - POST /incidents/{incidentId}/custody-logs
  shared_operations:
  - POST /incidents/{incidentId}/forensic-scopes (with IncidentCommander)
  - GET reads on all incident resources
- name: PrivacyCounsel
  description: Drafts notices, coordinates mailing vendor, submits to regulators, manages credit-monitoring offers
  identity: opaque
  exclusive_operations:
  - POST /incidents/{incidentId}/notices (and submit-for-review, lock-for-mail)
  - POST /incidents/{incidentId}/mailing-batches (and start-production, mark-shipped, confirm-delivery, fail)
  - POST /incidents/{incidentId}/jurisdiction-evaluations
  - POST /incidents/{incidentId}/regulator-submissions (and submit, acknowledge, open-inquiry, close)
  - POST /incidents/{incidentId}/credit-monitoring-offers (and cancel)
  shared_operations:
  - GET reads on all incident resources
- name: GeneralCounsel
  description: Approves notices, verifies remediation, responds to regulator inquiries
  identity: opaque
  exclusive_operations:
  - POST /incidents/{incidentId}/notices/{noticeId}/approve
  - POST /incidents/{incidentId}/notices/{noticeId}/request-changes
  - POST /incidents/{incidentId}/remediation-actions/{actionId}/verify
  - POST /incidents/{incidentId}/regulator-submissions/{subId}/respond-inquiry
  shared_operations:
  - GET reads on all incident resources
- name: DataAnalyst
  description: Determines affected subjects and verifies records
  identity: opaque
  exclusive_operations:
  - POST /incidents/{incidentId}/affected-subjects (and verify, exclude)
  shared_operations:
  - GET reads on affected-subjects
- name: AffectedSubjectRole
  description: The data subject themselves; can redeem or decline a credit-monitoring offer
  identity: entity_backed:AffectedSubject
  exclusive_operations:
  - POST /incidents/{incidentId}/credit-monitoring-offers/{offerId}/redeem
  - POST /incidents/{incidentId}/credit-monitoring-offers/{offerId}/decline
  shared_operations:
  - GET /incidents/{incidentId}/credit-monitoring-offers (filtered to own)
- name: Auditor
  description: Read-only access across all resources for compliance review
  identity: opaque
  exclusive_operations: []
  shared_operations:
  - GET reads on all incident resources
