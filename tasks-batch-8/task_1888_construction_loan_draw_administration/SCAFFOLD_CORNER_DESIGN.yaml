          trigger:
            - { call: "POST /draw-documents/${doc_id}/review", payload: { decision: "MAYBE" }, as: DrawProcessor, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST (HTTP 400); DrawDocument.${doc_id}.status remains SUBMITTED"

      - name: draws_list_filter_by_status
        claim_type: listing
        grounds: ["endpoints[GET /draws]"]
        distinguishing_aspect: "The status filter is exact: with one SUBMITTED and one DRAFT draw on the same loan, status=DRAFT returns only the draft and status=SUBMITTED only the submitted one."
        test_recipe:
          setup: ["loan with BL-A; draw D1 [2026-03-01,2026-03-31) SUBMITTED; draw D2 [2026-04-01,2026-04-30) DRAFT"]
