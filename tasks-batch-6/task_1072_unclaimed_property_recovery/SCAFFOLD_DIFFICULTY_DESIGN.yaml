          - entities.StateAccount.custody_balance_cents
          - entities.LedgerEntry.entry_type
        distinguishing_aspect: >
          Depth-3 cascade triggered by claim pay: Claim APPROVED->PAID -> Property ESCHEATED->CLAIMED
          (link caused by pay) -> LedgerEntry PAYOUT_OUT(94900)+FEE_OUT(10600) and
