              payload: { email: "c1@example.com", full_name: "Tri Score", date_of_birth: "1986-06-26", ssn_last4: "2121", plan_id: "${plan_id}" }
              as: Anonymous
              captures: { sub_id: $.data.id, tok: $.data.verification_token }
