# =============================================================================
# SCAFFOLD_CORNER_DESIGN — Treasury Management & Lockbox Services
# §1.9 Coverage Index — enumerative coverage of every other testable claim
# the scaffold's §1.1–§1.7 surface declares, beyond §0.5's nine Difficulty Rules.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Section: entities — creation, defaults, computed, system fields, enums
  # ===========================================================================
  - section: entities
    instances:
      - name: bank_creation_applies_defaults
        claim_type: creation_with_defaults
        grounds: [entities.Bank.fields.current_business_date, entities.Bank.fields.current_analysis_cycle_index, entities.Bank.fields.posture]
        distinguishing_aspect: "Bank created with only required inputs gets current_business_date='2026-08-01', current_analysis_cycle_index=0, posture='OPERATING'."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "B", routing_number: "021000089", default_earnings_credit_rate_bp: 100 }
              as: BankOperationsAdmin
              captures: { b_id: $.data.id, bd: $.data.current_business_date, idx: $.data.current_analysis_cycle_index, pos: $.data.posture }
          trigger: []
          assert:
            - "${bd} == '2026-08-01'"
            - "${idx} == 0"
            - "${pos} == 'OPERATING'"

      - name: customer_creation_sets_prospect_status
        claim_type: creation_with_defaults
        grounds: [entities.Customer.fields.status, entities.Customer.fields.collected_balance_accumulator_cents, entities.Customer.fields.days_in_cycle_elapsed]
        distinguishing_aspect: "Customer created has status='PROSPECT', accumulator=0, days_in_cycle_elapsed=0."
        test_recipe:
          setup: ["Bank exists"]
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "B", routing_number: "021000089", default_earnings_credit_rate_bp: 100 }
              as: BankOperationsAdmin
              captures: { b_id: $.data.id }
            - call: "POST /banks/${b_id}/customers"
              payload: { legal_name: "C", tax_id: "12-1", deposit_account_number: "DDA" }
              as: TreasuryImplementer
              captures: { c_status: $.data.status, c_acc: $.data.collected_balance_accumulator_cents, c_days: $.data.days_in_cycle_elapsed }
          trigger: []
          assert:
            - "${c_status} == 'PROSPECT'"
            - "${c_acc} == 0"
            - "${c_days} == 0"

      - name: remittance_batch_computes_business_date_via_rollover
        claim_type: computed_field
        grounds: [entities.RemittanceBatch.fields.business_date, calculations.business_date_rollover]
        distinguishing_aspect: "business_date is computed (not client-supplied); creating a batch before cutoff yields today's date, after cutoff yields next business day. Already exercised by §1.8 cutoff_exactly_at_boundary_rolls_to_next_day but here we verify the BEFORE-cutoff branch."
        test_recipe:
          setup: ["Bank, customer, agreement ACTIVE, site LIVE, cutoff=14:00, logical clock 2026-08-03T10:00Z (== 05:00 Chicago, before cutoff)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: BankOperationsAdmin
            - call: "POST /banks"
              payload: { legal_name: "B", routing_number: "021000089", default_earnings_credit_rate_bp: 100 }
              as: BankOperationsAdmin
              captures: { b_id: $.data.id }
            - call: "POST /banks/${b_id}/customers"
              payload: { legal_name: "C", tax_id: "12-1", deposit_account_number: "DDA" }
              as: TreasuryImplementer
              captures: { c_id: $.data.id }
            - call: "POST /banks/${b_id}/customers/${c_id}/begin_onboarding"
              payload: {}
              as: TreasuryImplementer
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements"
              payload: { agreement_number: "A", monthly_maintenance_fee_cents: 0, per_item_capture_fee_cents: 0, per_exception_decision_fee_cents: 0, per_image_retrieval_fee_cents: 0 }
              as: TreasuryImplementer
              captures: { ag_id: $.data.id, ag_v: $.data.version }
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/implement"
              payload: {}
              as: TreasuryImplementer
              as_user_id: "impl-1"
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/activate"
              payload: { expected_agreement_version: "${ag_v} + 1" }
              as: TreasuryActivator
              as_user_id: "act-1"
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/transmission_formats"
              payload: { format_kind: "BAI2", version_label: "v1" }
              as: TreasuryImplementer
              captures: { fmt_id: $.data.id }
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/transmission_formats/${fmt_id}/activate"
              payload: { expected_agreement_version: "${ag_v} + 2" }
              as: TreasuryActivator
              as_user_id: "act-1"
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/sites"
              payload: { site_code: "S", postal_box_address: "PO", daily_cutoff_time_local: "14:00", timezone: "America/Chicago" }
              as: TreasuryImplementer
              captures: { s_id: $.data.id }
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/sites/${s_id}/availability_schedules"
              payload: { routing_number_pattern: "0710", tier: "SAME_DAY", effective_from: "2026-08-01", priority: 1 }
              as: TreasuryImplementer
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/sites/${s_id}/go_live"
              payload: {}
              as: TreasuryActivator
              as_user_id: "act-1"
          trigger:
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/sites/${s_id}/batches"
              payload: { batch_reference: "B-PRE", received_at: "2026-08-03T10:00:00Z", declared_item_count: 0, declared_total_cents: 0 }
              as: LockboxOperator
              captures: { bd: $.data.business_date }
          assert:
            - "${bd} == '2026-08-03'  # before cutoff: same business date"

      - name: invalid_enum_value_rejected
        claim_type: type_constraint
        grounds: [entities.TransmissionFormat.fields.format_kind, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "format_kind='X12' (not in enum) returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Bank, customer, agreement IMPLEMENTED"]
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "B", routing_number: "021000089", default_earnings_credit_rate_bp: 100 }
              as: BankOperationsAdmin
              captures: { b_id: $.data.id }
            - call: "POST /banks/${b_id}/customers"
              payload: { legal_name: "C", tax_id: "12-1", deposit_account_number: "DDA" }
              as: TreasuryImplementer
              captures: { c_id: $.data.id }
            - call: "POST /banks/${b_id}/customers/${c_id}/begin_onboarding"
              payload: {}
              as: TreasuryImplementer
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements"
              payload: { agreement_number: "A", monthly_maintenance_fee_cents: 0, per_item_capture_fee_cents: 0, per_exception_decision_fee_cents: 0, per_image_retrieval_fee_cents: 0 }
              as: TreasuryImplementer
              captures: { ag_id: $.data.id, ag_v: $.data.version }
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/implement"
              payload: {}
              as: TreasuryImplementer
              as_user_id: "impl-1"
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/activate"
              payload: { expected_agreement_version: "${ag_v} + 1" }
              as: TreasuryActivator
              as_user_id: "act-1"
          trigger:
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/transmission_formats"
              payload: { format_kind: "X12", version_label: "v1" }
              as: TreasuryImplementer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == 'ERR_INVALID_REQUEST'"

      - name: entity_retrieval_by_id_returns_stored_data
        claim_type: retrieval
        grounds: [entities.Customer]
        distinguishing_aspect: "GET /customers/{id} returns the customer created earlier with all input fields preserved."
        test_recipe:
          setup: ["Bank, one customer"]
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "B", routing_number: "021000089", default_earnings_credit_rate_bp: 100 }
              as: BankOperationsAdmin
              captures: { b_id: $.data.id }
            - call: "POST /banks/${b_id}/customers"
              payload: { legal_name: "Acme Co", tax_id: "12-1", deposit_account_number: "DDA-X" }
              as: TreasuryImplementer
              captures: { c_id: $.data.id }
          trigger:
            - call: "GET /banks/${b_id}/customers/${c_id}"
              payload: {}
              as: Auditor
              captures: { name: $.data.legal_name, tax: $.data.tax_id, dda: $.data.deposit_account_number }
          assert:
            - "${name} == 'Acme Co'"
            - "${tax} == '12-1'"
            - "${dda} == 'DDA-X'"

      - name: non_existent_id_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a non-existent customer UUID returns ERR_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["Bank exists"]
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "B", routing_number: "021000089", default_earnings_credit_rate_bp: 100 }
              as: BankOperationsAdmin
              captures: { b_id: $.data.id }
          trigger:
            - call: "GET /banks/${b_id}/customers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Auditor
              captures: { err: $.data.error_id }
          assert:
            - "${err} == 'ERR_NOT_FOUND'"

      - name: duplicate_unique_field_rejected
        claim_type: uniqueness
        grounds: [entities.Bank.fields.routing_number, "errors[ERR_DUPLICATE_UNIQUE_FIELD]"]
        distinguishing_aspect: "Creating two banks with the same routing_number fails with ERR_DUPLICATE_UNIQUE_FIELD on the second."
        test_recipe:
          setup: ["Bank B1 with routing_number='021000089' exists"]
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "B1", routing_number: "021000089", default_earnings_credit_rate_bp: 100 }
              as: BankOperationsAdmin
          trigger:
            - call: "POST /banks"
              payload: { legal_name: "B2", routing_number: "021000089", default_earnings_credit_rate_bp: 200 }
              as: BankOperationsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == 'ERR_DUPLICATE_UNIQUE_FIELD'"

  # ===========================================================================
  # Section: state_machines — invalid transitions, terminal lockdown, initial state
  # ===========================================================================
  - section: state_machines
    instances:
      - name: terminal_state_lockdown_on_terminated_customer
        claim_type: terminal_lockdown
        grounds: [state_machines.Customer, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Once Customer.status == TERMINATED, no further transitions (suspend/resume) are permitted."
        test_recipe:
          setup: ["Bank, customer TERMINATED (via agreement terminate then customer terminate)"]
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "B", routing_number: "021000089", default_earnings_credit_rate_bp: 100 }
              as: BankOperationsAdmin
              captures: { b_id: $.data.id }
            - call: "POST /banks/${b_id}/customers"
              payload: { legal_name: "C", tax_id: "12-1", deposit_account_number: "DDA" }
              as: TreasuryImplementer
              captures: { c_id: $.data.id }
            - call: "POST /banks/${b_id}/customers/${c_id}/begin_onboarding"
              payload: {}
              as: TreasuryImplementer
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements"
              payload: { agreement_number: "A", monthly_maintenance_fee_cents: 0, per_item_capture_fee_cents: 0, per_exception_decision_fee_cents: 0, per_image_retrieval_fee_cents: 0 }
              as: TreasuryImplementer
              captures: { ag_id: $.data.id, ag_v: $.data.version }
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/implement"
              payload: {}
              as: TreasuryImplementer
              as_user_id: "impl-1"
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/activate"
              payload: { expected_agreement_version: "${ag_v} + 1" }
              as: TreasuryActivator
              as_user_id: "act-1"
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/terminate"
              payload: {}
              as: TreasuryActivator
              as_user_id: "act-1"
            # Settle any open cycles (there may be an OPEN cycle with zero activity)
            - call: "POST /banks/${b_id}/close_business_day"
              payload: {}
              as: BankOperationsAdmin
            - call: "POST /banks/${b_id}/close_analysis_cycle"
              payload: { customer_id: "${c_id}" }
              as: BillingSpecialist
            - call: "GET /banks/${b_id}/customers/${c_id}/analysis_cycles"
              payload: {}
              as: BillingSpecialist
              captures: { cycle_id: "$.data[0].id", cycle_v: "$.data[0].version" }
            - call: "POST /banks/${b_id}/customers/${c_id}/analysis_cycles/${cycle_id}/settle"
              payload: { expected_cycle_version: "${cycle_v}" }
              as: BillingSpecialist
            - call: "POST /banks/${b_id}/customers/${c_id}/terminate"
              payload: {}
              as: TreasuryActivator
              as_user_id: "act-1"
          trigger:
            - call: "POST /banks/${b_id}/customers/${c_id}/resume"
              payload: {}
              as: TreasuryActivator
              as_user_id: "act-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == 'ERR_INVALID_STATE_TRANSITION'"

      - name: customer_initial_state_is_prospect
        claim_type: initial_state
        grounds: [state_machines.Customer]
        distinguishing_aspect: "Newly created customer starts in PROSPECT."
        excluded_because:
          difficulty_instance: dual_variant_calc / earnings_credit_override_vs_bank_default_on_customer_billing
          rationale: "PROSPECT→ONBOARDING→ACTIVE lifecycle is exercised as part of every §1.8 setup chain."

      - name: batch_close_with_pending_items_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.RemittanceBatch.BALANCED_to_CLOSED]
        distinguishing_aspect: "close requires all items in terminal item states; a batch with one CAPTURED item cannot be closed."
        test_recipe:
          setup: ["Bank, customer, agreement ACTIVE, site LIVE, batch BALANCED with one item still in CAPTURED"]
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "B", routing_number: "021000089", default_earnings_credit_rate_bp: 100 }
              as: BankOperationsAdmin
              captures: { b_id: $.data.id }
            - call: "POST /banks/${b_id}/customers"
              payload: { legal_name: "C", tax_id: "12-1", deposit_account_number: "DDA" }
              as: TreasuryImplementer
              captures: { c_id: $.data.id }
            - call: "POST /banks/${b_id}/customers/${c_id}/begin_onboarding"
              payload: {}
              as: TreasuryImplementer
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements"
              payload: { agreement_number: "A", monthly_maintenance_fee_cents: 0, per_item_capture_fee_cents: 0, per_exception_decision_fee_cents: 0, per_image_retrieval_fee_cents: 0 }
              as: TreasuryImplementer
              captures: { ag_id: $.data.id, ag_v: $.data.version }
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/implement"
              payload: {}
              as: TreasuryImplementer
              as_user_id: "impl-1"
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/activate"
              payload: { expected_agreement_version: "${ag_v} + 1" }
              as: TreasuryActivator
              as_user_id: "act-1"
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/transmission_formats"
              payload: { format_kind: "BAI2", version_label: "v1" }
              as: TreasuryImplementer
              captures: { fmt_id: $.data.id }
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/transmission_formats/${fmt_id}/activate"
              payload: { expected_agreement_version: "${ag_v} + 2" }
              as: TreasuryActivator
              as_user_id: "act-1"
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/sites"
              payload: { site_code: "S", postal_box_address: "PO", daily_cutoff_time_local: "14:00", timezone: "America/Chicago" }
              as: TreasuryImplementer
              captures: { s_id: $.data.id }
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/sites/${s_id}/availability_schedules"
              payload: { routing_number_pattern: "0710", tier: "SAME_DAY", effective_from: "2026-08-01", priority: 1 }
              as: TreasuryImplementer
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/sites/${s_id}/go_live"
              payload: {}
              as: TreasuryActivator
              as_user_id: "act-1"
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/sites/${s_id}/batches"
              payload: { batch_reference: "B1", received_at: "2026-08-01T13:00:00Z", declared_item_count: 1, declared_total_cents: 1000 }
              as: LockboxOperator
              captures: { ba_id: $.data.id }
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/sites/${s_id}/batches/${ba_id}/begin_capture"
              payload: {}
              as: LockboxOperator
              as_user_id: "lock-1"
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/sites/${s_id}/batches/${ba_id}/items"
              payload: { check_number: "1", payer_routing_number: "0710002880", amount_cents: 1000, payee_name: "C" }
              as: LockboxOperator
            # Do NOT accept the item; balance still succeeds because captured==declared
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/sites/${s_id}/batches/${ba_id}/balance"
              payload: {}
              as: LockboxOperator
          trigger:
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/sites/${s_id}/batches/${ba_id}/close"
              payload: {}
              as: LockboxOperator
              as_user_id: "lock-2"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == 'ERR_INVALID_STATE_TRANSITION'  # item still CAPTURED, not in terminal item state"

      - name: invalid_from_state_returns_error
        claim_type: invalid_transition
        grounds: [state_machines.ServiceAgreement]
        distinguishing_aspect: "Attempting 'suspend' on a DRAFT agreement returns ERR_INVALID_STATE_TRANSITION (suspend is defined only from ACTIVE)."
        test_recipe:
          setup: ["Bank, customer, agreement DRAFT"]
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "B", routing_number: "021000089", default_earnings_credit_rate_bp: 100 }
              as: BankOperationsAdmin
              captures: { b_id: $.data.id }
            - call: "POST /banks/${b_id}/customers"
              payload: { legal_name: "C", tax_id: "12-1", deposit_account_number: "DDA" }
              as: TreasuryImplementer
              captures: { c_id: $.data.id }
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements"
              payload: { agreement_number: "A", monthly_maintenance_fee_cents: 0, per_item_capture_fee_cents: 0, per_exception_decision_fee_cents: 0, per_image_retrieval_fee_cents: 0 }
              as: TreasuryImplementer
              captures: { ag_id: $.data.id, ag_v: $.data.version }
          trigger:
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/suspend"
              payload: {}
              as: TreasuryActivator
              as_user_id: "act-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == 'ERR_INVALID_STATE_TRANSITION'"

  # ===========================================================================
  # Section: calculations — constants applied, precision, input-set filtering
  # ===========================================================================
  - section: calculations
    instances:
      - name: earnings_credit_floored_at_zero
        claim_type: boundary
        grounds: [calculations.earnings_credit]
        distinguishing_aspect: "When gross_service_charges_cents == 0, earnings_credit_cents = min(EC, 0) = 0 (cap binds); the bank never pays the customer."
        test_recipe:
          setup: ["Bank, customer ACTIVE, agreement with all fees=0; customer carries a positive collected balance"]
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "B", routing_number: "021000089", default_earnings_credit_rate_bp: 500 }
              as: BankOperationsAdmin
              captures: { b_id: $.data.id }
            - call: "POST /banks/${b_id}/customers"
              payload: { legal_name: "C", tax_id: "12-1", deposit_account_number: "DDA" }
              as: TreasuryImplementer
              captures: { c_id: $.data.id }
            - call: "POST /banks/${b_id}/customers/${c_id}/begin_onboarding"
              payload: {}
              as: TreasuryImplementer
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements"
              payload: { agreement_number: "A", monthly_maintenance_fee_cents: 0, per_item_capture_fee_cents: 0, per_exception_decision_fee_cents: 0, per_image_retrieval_fee_cents: 0 }
              as: TreasuryImplementer
              captures: { ag_id: $.data.id, ag_v: $.data.version }
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/implement"
              payload: {}
              as: TreasuryImplementer
              as_user_id: "impl-1"
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/activate"
              payload: { expected_agreement_version: "${ag_v} + 1" }
              as: TreasuryActivator
              as_user_id: "act-1"
            - call: "POST /banks/${b_id}/close_business_day"
              payload: {}
              as: BankOperationsAdmin
          trigger:
            - call: "POST /banks/${b_id}/close_analysis_cycle"
              payload: { customer_id: "${c_id}" }
              as: BillingSpecialist
            - call: "GET /banks/${b_id}/customers/${c_id}/analysis_cycles"
              payload: {}
              as: BillingSpecialist
              captures: { ec: "$.data[0].earnings_credit_cents", gross: "$.data[0].gross_service_charges_cents", net: "$.data[0].net_amount_due_cents" }
          assert:
            - "${gross} == 0"
            - "${ec} == 0  # min(EC, gross) caps at 0"
            - "${net} == 0"

      - name: availability_schedule_no_match_defaults_to_two_day
        claim_type: correct_result
        grounds: [calculations.availability_assignment]
        distinguishing_aspect: "When no ACTIVE AvailabilitySchedule matches a payer_routing prefix, tier defaults to TWO_DAY."
        test_recipe:
          setup: ["Site has only a schedule for pattern '0710'; batch with item routing '9990000000'"]
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "B", routing_number: "021000089", default_earnings_credit_rate_bp: 100 }
              as: BankOperationsAdmin
              captures: { b_id: $.data.id }
            - call: "POST /banks/${b_id}/customers"
              payload: { legal_name: "C", tax_id: "12-1", deposit_account_number: "DDA" }
              as: TreasuryImplementer
              captures: { c_id: $.data.id }
            - call: "POST /banks/${b_id}/customers/${c_id}/begin_onboarding"
              payload: {}
              as: TreasuryImplementer
