      - name: fee_quote_computed_read_matches_formula
        claim_type: computed_read
        grounds:
          - endpoints.GET_/esign/envelopes/{id}/quote
          - calculations.envelope_fee_quote
        distinguishing_aspect: "The quote read derives total_fee from subtotal minus a rounded discount, so a 100-page envelope on an allowance-25 account returns total_fee 1566.71."
        excluded_because:
          difficulty_instance: quote_discount_activates_at_exactly_hundred_pages
          rationale: "The computed quote at the 100-page boundary is asserted as the primary outcome of that §1.8 instance."
      - name: bulk_send_partial_success_sets_partial
        claim_type: bulk_action
        grounds:
          - state_machines.BulkSendBatch.CREATED_to_PARTIAL
          - entities.BulkSendBatch.fields.succeeded_count
          - endpoints.POST_/esign/bulk-sends/{id}/process
        distinguishing_aspect: "A batch with one valid and one invalid row lands in PARTIAL with succeeded_count 1 and failed_count 1, so partial success is not collapsed into FAILED."
        test_recipe:
          setup:
            - "one PUBLISHED template and a bulk send batch of 2 rows"
          setup_api_calls:
            - call: "POST /esign/accounts"
              payload: { name: "Acme Signing", state_code: "CA", tier: "STANDARD", page_allowance: 25 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /esign/templates"
