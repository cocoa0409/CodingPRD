            - { call: "GET /surge-events/${ev}", as: ProgramAdmin, captures: { ev_v2: $.data.version } }
            - { call: "POST /surge-bookings", payload: { surge_event_id: "${ev}", household_id: "${hh_b}", quantity_bundles: 5, expected_surge_event_version: "${ev_v2}" }, as: Resident, as_user_id: "${hh_b}", captures: { bk_b: $.data.id, bk_b_st: $.data.status } }
            - { call: "GET /surge-events/${ev}", as: ProgramAdmin, captures: { ev_v3: $.data.version } }
            - { call: "POST /surge-bookings", payload: { surge_event_id: "${ev}", household_id: "${hh_c}", quantity_bundles: 1, expected_surge_event_version: "${ev_v3}" }, as: Resident, as_user_id: "${hh_c}", captures: { bk_c: $.data.id, bk_c_st: $.data.status } }
          trigger:
            - { call: "POST /surge-bookings/${bk_a}/cancel", payload: {}, as: Resident, as_user_id: "${hh_a}" }
          assert:
