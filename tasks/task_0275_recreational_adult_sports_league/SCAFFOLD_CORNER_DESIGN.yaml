              as_user_id: "${cap_id}"
              captures: { t_id: $.data.id }
            - call: "POST /teams/${t_id}/roster"
              payload: { player_id: "${mem_id}" }
              as: TeamCaptain
              as_user_id: "${cap_id}"
              captures: { re_id: $.data.id }
          trigger:
            - call: "DELETE /teams/${t_id}/roster/${re_id}"
              payload: {}
              as: TeamCaptain
              as_user_id: "${cap_id}"
          assert:
            - "After add: Player.${mem_id}.is_free_agent == false; after release: RosterEntry.${re_id}.state == RELEASED and Player.${mem_id}.is_free_agent == true"

