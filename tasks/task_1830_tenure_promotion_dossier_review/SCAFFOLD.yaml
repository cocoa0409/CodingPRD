# =============================================================================
# Task 1830 — Tenure & Promotion Dossier Review (university provost office)
# Scaffold seed tables (§1.0–§1.7). §1.8 and §1.9 live in sibling files.
# =============================================================================

scenario: |
  1830. Tenure & Promotion Dossier Review (university provost office): candidate
  dossier assembly & evidence categories, external reviewer solicitation &
  confidentiality, department/college/university committee sequential review,
  mid-tenure review & stop-the-clock requests, vote recording & recommendation
  letters, provost/board decision & notification deadlines, appeal & grievance
  process, post-decision record retention

domain_name: tenure-promotion-dossier-review
api_prefix: /api

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: multi-party negotiation      # sequential committee voting with quorum, recusal, certification
  secondary_archetype: compliance / audit          # confidentiality, SoD, deadlines, retention
  complexity_layers:
    - optimistic_concurrency      # OCC on TenureCase.version (dossier-item & invitation create) and Vote.version (ballot change)
    - cascading_side_effects      # certify -> stage advance -> next-round creation -> score recompute; appeal remand -> decision void -> round teardown
    - dual_variant_calculation    # vote-tally pass rules (STRICT_MAJORITY_OF_CAST vs SUPERMAJORITY_OF_ENTITLED); clock policy (ANNIVERSARY vs DAY_COUNT)
    - scheduled_actions           # logical clock drives response deadlines, review windows, notification/appeal windows, retention purge

  entity_topology: flat           # peer resources with FK references in bodies; no nested URL paths
  state_machine_shape: cyclic     # TenureCase revision/remand loops; ReviewRound reopen loop; DossierItem revise loop

  relationship_patterns:
    - one_to_many                 # TenureCase -> DossierItem / ReviewerInvitation / ReviewRound / ...
    - many_to_many                # Committee <-> faculty persons via CommitteeMember junction
    - self_referential            # DossierItem.supersedes_item_id -> DossierItem.id (evidence revision lineage)
    - cross_aggregate             # Vote -> CommitteeMember; ReviewRound -> Committee; Appeal -> ProvostDecision (via case)

  role_model: segregation_of_duties   # tally certifier may not vote; decision recorder may not be case creator; recusal is irrevocable
  consistency_model: immediate        # every mutation + cascade visible in the same response

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Candidate
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Candidate full name" }
      - { name: employee_id, type: string, source: input, description: "University employee id; unique across Candidates (ERR_DUPLICATE_EMPLOYEE_ID)" }
      - { name: department, type: string, source: input, description: "Home department; used for DEPARTMENT committee selector" }
      - { name: college, type: string, source: input, description: "Home college; used for COLLEGE committee selector" }
      - { name: tenure_clock_start, type: datetime, source: input, description: "Date (ISO8601) the tenure clock started; anchor for mandatory_review_date" }
      - { name: status, type: enum, source: system, description: "ACTIVE | TENURED | NOT_RENEWED | WITHDRAWN", constraints: "initial ACTIVE; transitions only via decision/withdraw cascades" }

  - name: TenureCase
    parent: null
    common_fields: true
    fields:
      - { name: candidate_id, type: string, source: input, description: "FK -> Candidate.id; the faculty member under review" }
      - { name: review_cycle, type: string, source: input, description: "Cycle label, e.g. '2026-2027'" }
      - { name: target_rank, type: enum, source: input, description: "ASSOCIATE_PROFESSOR | FULL_PROFESSOR" }
      - { name: seeking_tenure, type: boolean, source: input, description: "true when the case requests tenure (not promotion-only)" }
      - { name: clock_policy, type: enum, source: input, description: "ANNIVERSARY | DAY_COUNT; selects the mandatory_review_date variant; immutable after creation" }
      - { name: waiver_signed, type: boolean, source: input, default: true, description: "true = candidate waived access to external letters and ballots (confidentiality seal)" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creating ProvostOfficer; SoD anchor for decision recording" }
      - { name: stage, type: enum, source: system, description: "DOSSIER_ASSEMBLY | EXTERNAL_REVIEW | DEPT_COMMITTEE | COLLEGE_COMMITTEE | UNIVERSITY_COMMITTEE | PROVOST_REVIEW | DECIDED | NOTIFIED | CLOSED | ARCHIVED | PURGED | RETURNED_FOR_REVISION | WITHDRAWN" }
      - { name: dossier_submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of dossier submission; null until submit" }
      - { name: extension_days, type: integer, source: computed, default: 0, description: "Merged union of APPROVED ClockExtensionRequest intervals in days (half-open merge); recomputed on approve/rescind" }
      - { name: mandatory_review_date, type: datetime, source: computed, description: "tenure_clock_start + 72 months (ANNIVERSARY) or + round_half_up(72*30.4375)=2192 days (DAY_COUNT), then + extension_days" }
      - { name: dossier_strength_index, type: number, source: computed, description: "Per-category rounded dossier strength; computed at submit-dossier; null before" }
      - { name: recommendation_score, type: number, source: computed, description: "Weighted score over certified round percentages; computed on university-round certification; null before; cleared on remand" }
      - { name: appeal_filing_deadline, type: datetime, source: computed, description: "notification_sent_at + 30 days; set at notify; null before" }
      - { name: closed_at, type: datetime, source: system, description: "Logical-clock timestamp of case close; null until closed" }
      - { name: retention_until, type: datetime, source: computed, description: "closed_at + 2555 days (7*365); set at close; null before" }
      - { name: purged_at, type: datetime, source: system, description: "Logical-clock timestamp of purge; null until purged" }

  - name: DossierItem
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> TenureCase.id; owning case" }
      - { name: category, type: enum, source: input, description: "TEACHING | RESEARCH | SERVICE" }
      - { name: title, type: string, source: input, description: "Evidence title" }
      - { name: page_count, type: integer, source: input, description: "Page count; must be >= 1 (ERR_INVALID_REQUEST)" }
      - { name: is_peer_reviewed, type: boolean, source: input, default: false, description: "Peer-reviewed flag; completeness requires >= 1 peer-reviewed SUBMITTED RESEARCH item" }
      - { name: supersedes_item_id, type: string, source: input, description: "FK -> DossierItem.id; optional; when the new item is submitted, the target (if SUBMITTED) flips to SUPERSEDED; target must be a SUBMITTED item of the same case and category" , default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | RETURNED | SUPERSEDED | WITHDRAWN", constraints: "initial DRAFT" }

  - name: ExternalReviewer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Reviewer full name" }
      - { name: institution, type: string, source: input, description: "Reviewer institution (must differ from the university; informational)" }
      - { name: email, type: string, source: input, description: "Reviewer email; unique across ExternalReviewers (ERR_DUPLICATE_REVIEWER_EMAIL)" }
      - { name: expertise_area, type: string, source: input, description: "Declared expertise area" }

  - name: ReviewerInvitation
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> TenureCase.id" }
      - { name: reviewer_id, type: string, source: input, description: "FK -> ExternalReviewer.id" }
      - { name: invited_at, type: datetime, source: system, description: "Logical-clock timestamp of solicitation" }
      - { name: response_deadline, type: datetime, source: computed, description: "invited_at + 14 days; lazy expiry applies when the logical clock passes it" }
      - { name: review_window_start, type: datetime, source: input, description: "Start (date) of the review window the reviewer would occupy; must be < review_window_end" }
      - { name: review_window_end, type: datetime, source: input, description: "End (date) of the review window; letter submission allowed while now <= review_window_end" }
      - { name: is_arm_length, type: boolean, source: input, description: "Soliciting officer certifies arm's-length; must be true (ERR_ARMS_LENGTH_VIOLATION)" }
      - { name: declared_coauthor, type: boolean, source: input, description: "true when the reviewer has co-authored with the candidate; must be false (ERR_ARMS_LENGTH_VIOLATION)" }
      - { name: letter_received_at, type: datetime, source: system, description: "Timestamp of letter submission; null until LETTER_RECEIVED" }
      - { name: letter_text, type: string, source: input, description: "External review letter body (submitted via submit-letter); confidential when case.waiver_signed" }
      - { name: status, type: enum, source: system, description: "SOLICITED | ACCEPTED | LETTER_RECEIVED | DECLINED | WITHDRAWN | EXPIRED", constraints: "created directly in SOLICITED" }

  - name: Committee
    parent: null
    common_fields: true
    fields:
      - { name: level, type: enum, source: input, description: "DEPARTMENT | COLLEGE | UNIVERSITY" }
      - { name: academic_unit, type: string, source: input, description: "Unit scope; DEPARTMENT committee matches Candidate.department, COLLEGE matches Candidate.college, UNIVERSITY is matched on level only" }
      - { name: term_start, type: datetime, source: input, description: "Term start (date); must be < term_end (ERR_INVALID_INTERVAL)" }
      - { name: term_end, type: datetime, source: input, description: "Term end (date); committee eligible for selection while term_start <= now <= term_end" }
      - { name: quorum_fraction, type: number, source: input, default: 0.5, description: "Fraction of eligible voters needed for quorum; quorum_required = ceil(quorum_fraction * eligible_voter_count)" }
      - { name: pass_rule, type: enum, source: input, description: "STRICT_MAJORITY_OF_CAST | SUPERMAJORITY_OF_ENTITLED; selects the vote-tally variant" }

  - name: CommitteeMember
    parent: null
    common_fields: true
    fields:
      - { name: committee_id, type: string, source: input, description: "FK -> Committee.id" }
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: email, type: string, source: input, description: "Member email" }
      - { name: role_in_committee, type: enum, source: input, default: MEMBER, description: "MEMBER | CHAIR; at most one active CHAIR per committee (ERR_CHAIR_CONFLICT)" }
      - { name: service_start, type: datetime, source: input, description: "Service window start (date); must be <= service_end (ERR_INVALID_INTERVAL)" }
      - { name: service_end, type: datetime, source: input, description: "Service window end (date); voter eligible while service_start <= round.opened_at <= service_end" }
      - { name: is_active, type: boolean, source: system, default: true, description: "false after deactivate; inactive members are excluded from eligibility counts and cannot vote" }

  - name: ReviewRound
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> TenureCase.id; rounds are system-created at stage transitions, never via POST" }
      - { name: committee_id, type: string, source: system, description: "FK -> Committee.id; chosen by the committee selector at creation" }
      - { name: level, type: enum, source: system, description: "DEPARTMENT | COLLEGE | UNIVERSITY; copied from the selected committee" }
      - { name: opened_at, type: datetime, source: system, description: "Timestamp of open; anchor for member service-window eligibility; null until opened" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | VOTING_OPEN | TALLYING | COMPLETED | CANCELLED", constraints: "initial SCHEDULED" }
      - { name: active_member_count, type: integer, source: computed, description: "M: members of the committee with is_active=true and service window covering opened_at; computed at open" }
      - { name: recusal_count, type: integer, source: computed, description: "R: non-retracted RECUSE ballots; recomputed on every ballot mutation" }
      - { name: eligible_voter_count, type: integer, source: computed, description: "M - R; recomputed on every ballot mutation while not COMPLETED/CANCELLED" }
      - { name: quorum_required, type: integer, source: computed, description: "ceil(committee.quorum_fraction * eligible_voter_count); recomputed with eligible_voter_count" }
      - { name: votes_cast, type: integer, source: computed, description: "Non-retracted ballots in {YES, NO, ABSTAIN}; RECUSE ballots never count" }
      - { name: yes_count, type: integer, source: computed, description: "Non-retracted YES ballots" }
      - { name: no_count, type: integer, source: computed, description: "Non-retracted NO ballots" }
      - { name: abstain_count, type: integer, source: computed, description: "Non-retracted ABSTAIN ballots" }
      - { name: quorum_met, type: boolean, source: computed, description: "votes_cast >= quorum_required AND eligible_voter_count >= 1" }
      - { name: yes_percentage, type: number, source: computed, description: "round_half_up(yes_count / (yes_count + no_count), 4); null when yes_count + no_count == 0; computed at certification" }
      - { name: passed, type: boolean, source: computed, description: "Pass verdict per committee.pass_rule; computed at certification; null until certified; cleared on reopen" }
      - { name: recommendation, type: enum, source: input, description: "STRONGLY_SUPPORT | SUPPORT | NEUTRAL | OPPOSE | STRONGLY_OPPOSE; supplied by the certifying chair; the recommendation letter verdict" }
      - { name: letter_text, type: string, source: input, description: "Recommendation letter body supplied at certification; confidential when case.waiver_signed" }
      - { name: certified_at, type: datetime, source: system, description: "Timestamp of certification; null until COMPLETED; cleared on reopen" }

  - name: Vote
    parent: null
    common_fields: true
    fields:
      - { name: round_id, type: string, source: input, description: "FK -> ReviewRound.id" }
      - { name: member_id, type: string, source: system, description: "FK -> CommitteeMember.id; resolved from X-User-ID, never from the request body" }
      - { name: ballot, type: enum, source: input, description: "YES | NO | ABSTAIN | RECUSE" }
      - { name: status, type: enum, source: system, description: "CAST | RETRACTED", constraints: "initial CAST" }
      - { name: cast_at, type: datetime, source: system, description: "Timestamp of casting" }
      - { name: retracted_at, type: datetime, source: system, description: "Timestamp of retraction; null while CAST" }

  - name: ClockExtensionRequest
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> TenureCase.id" }
      - { name: reason, type: enum, source: input, description: "PARENTAL_LEAVE | MEDICAL_LEAVE | BEREAVEMENT | OTHER" }
      - { name: interval_start, type: datetime, source: input, description: "Stop-the-clock interval start (date); must be < interval_end (ERR_INVALID_INTERVAL)" }
      - { name: interval_end, type: datetime, source: input, description: "Stop-the-clock interval end (date); half-open [start, end) for overlap tests" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | DENIED | RESCINDED | CANCELLED", constraints: "initial PENDING" }
      - { name: decided_at, type: datetime, source: system, description: "Timestamp of approve/deny/rescind; null while PENDING" }

  - name: MidTenureReview
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> TenureCase.id" }
      - { name: review_year, type: integer, source: input, description: "Probation year the review covers (e.g. 3); must be >= 1 (ERR_INVALID_REQUEST)" }
      - { name: outcome, type: enum, source: input, description: "SATISFACTORY | CONCERNS | UNSATISFACTORY; supplied at complete; null before" }
      - { name: status, type: enum, source: system, description: "IN_PROGRESS | COMPLETED", constraints: "created directly in IN_PROGRESS" }
      - { name: completed_at, type: datetime, source: system, description: "Timestamp of completion; null until COMPLETED" }

  - name: ProvostDecision
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> TenureCase.id; a second decision can only be recorded after a remand voids the first (stage gating makes duplicates unreachable)" }
      - { name: decision, type: enum, source: input, description: "GRANT_TENURE | GRANT_PROMOTION | GRANT_BOTH | DENY | DEFER" }
      - { name: rationale_text, type: string, source: input, description: "Decision rationale" }
      - { name: override_rationale, type: string, source: input, default: null, description: "Required non-empty when a GRANT_* decision is recorded with recommendation_score < 0.60 (ERR_SCORE_BELOW_THRESHOLD otherwise)" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the recording ProvostOfficer; must differ from case.created_by_user_id (ERR_SOD_DECISION_BY_CASE_CREATOR)" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock timestamp of recording" }
      - { name: notification_deadline, type: datetime, source: computed, description: "decided_at + 10 days; notify is rejected after it" }
      - { name: notification_sent_at, type: datetime, source: system, description: "Timestamp of notification; null until case notified" }
      - { name: status, type: enum, source: system, description: "RECORDED | VOIDED", constraints: "initial RECORDED; VOIDED on appeal remand" }

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> TenureCase.id" }
      - { name: grounds, type: enum, source: input, description: "PROCEDURAL_ERROR | NEW_EVIDENCE | DISCRIMINATION | CAPRICIOUS_EVALUATION" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock timestamp of filing; must be <= case.appeal_filing_deadline (ERR_APPEAL_WINDOW_LAPSED)" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | UPHELD | DENIED | REMANDED | WITHDRAWN", constraints: "initial FILED" }
      - { name: resolution, type: enum, source: input, description: "UPHELD | DENIED | REMANDED; supplied at resolve; null before. UPHELD = the challenged decision is upheld (appeal dismissed, no case effect); DENIED = appeal rejected on its merits (no case effect); REMANDED = case sent back for re-review (full remand cascade)" }
      - { name: resolution_text, type: string, source: input, description: "Resolution rationale supplied at resolve" }
      - { name: resolved_at, type: datetime, source: system, description: "Timestamp of resolution; null until resolved" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: TenureCase
    initial_state: DOSSIER_ASSEMBLY
    terminal_states: [WITHDRAWN, PURGED]
    transitions:
      - from: DOSSIER_ASSEMBLY
        to: EXTERNAL_REVIEW
        trigger: "POST /api/cases/{id}/submit-dossier"
        actor: Candidate
        preconditions:
          - "acting user owns the case (X-User-ID == candidate_id) — ERR_OWNERSHIP_MISMATCH"
          - "dossier completeness holds (calculation dossier_completeness) — ERR_DOSSIER_INCOMPLETE"
          - "logical clock now <= mandatory_review_date — ERR_REVIEW_CLOCK_EXPIRED"
        side_effects:
          - "dossier_submitted_at = now; dossier_strength_index computed (calculation dossier_strength_index)"
          - "all case DossierItems in SUBMITTED become locked (no further item transitions until return-for-revision)"
          - "increments TenureCase.version by 1"

      - from: EXTERNAL_REVIEW
        to: RETURNED_FOR_REVISION
        trigger: "POST /api/cases/{id}/return-for-revision"
        actor: ProvostOfficer
        preconditions:
          - "no ReviewerInvitation of this case in status ACCEPTED — ERR_OPEN_INVITATIONS_EXIST (ACCEPTED invitations must first be withdrawn or receive letters)"
        side_effects:
          - "all SOLICITED invitations of this case -> WITHDRAWN (with invited review windows released)"
          - "increments TenureCase.version by 1"

      - from: RETURNED_FOR_REVISION
        to: DOSSIER_ASSEMBLY
        trigger: "POST /api/cases/{id}/resume-assembly"
        actor: Candidate
        preconditions:
          - "acting user owns the case — ERR_OWNERSHIP_MISMATCH"
        side_effects:
          - "dossier items unlocked (item transitions allowed again)"
          - "increments TenureCase.version by 1"

      - from: EXTERNAL_REVIEW
        to: DEPT_COMMITTEE
        trigger: "POST /api/cases/{id}/close-solicitation"
        actor: ProvostOfficer
        preconditions:
          - "lazy expiry applied first: every SOLICITED invitation with now > response_deadline flips to EXPIRED (system)"
          - "no ReviewerInvitation remains in SOLICITED — ERR_OPEN_INVITATIONS_EXIST"
          - "usable_letter_count >= 3 — ERR_INSUFFICIENT_EXTERNAL_LETTERS"
          - "a COMPLETED MidTenureReview exists for the case — ERR_MIDTERM_REVIEW_MISSING"
          - "no COMPLETED MidTenureReview of the case has outcome UNSATISFACTORY — ERR_MIDTERM_OUTCOME_BLOCKS"
          - "committee selector finds an eligible DEPARTMENT committee — ERR_NO_ELIGIBLE_COMMITTEE"
        side_effects:
          - "system creates a ReviewRound (status SCHEDULED, level DEPARTMENT) bound to the selected committee"
          - "increments TenureCase.version by 1"

      - from: DEPT_COMMITTEE
        to: COLLEGE_COMMITTEE
        trigger: "POST /api/cases/{id}/advance-stage"
        actor: ProvostOfficer
        preconditions:
          - "the case's DEPARTMENT round (latest by created_at) is COMPLETED — ERR_ROUND_NOT_CERTIFIED"
          - "committee selector finds an eligible COLLEGE committee — ERR_NO_ELIGIBLE_COMMITTEE"
        side_effects:
          - "system creates a ReviewRound (SCHEDULED, level COLLEGE) bound to the selected college committee"
          - "increments TenureCase.version by 1"

      - from: COLLEGE_COMMITTEE
        to: UNIVERSITY_COMMITTEE
        trigger: "POST /api/cases/{id}/advance-stage"
        actor: ProvostOfficer
        preconditions:
          - "the case's COLLEGE round (latest by created_at) is COMPLETED — ERR_ROUND_NOT_CERTIFIED"
          - "committee selector finds an eligible UNIVERSITY committee — ERR_NO_ELIGIBLE_COMMITTEE"
        side_effects:
          - "system creates a ReviewRound (SCHEDULED, level UNIVERSITY) bound to the selected university committee"
          - "increments TenureCase.version by 1"

      - from: UNIVERSITY_COMMITTEE
        to: PROVOST_REVIEW
        trigger: "POST /api/cases/{id}/advance-stage"
        actor: ProvostOfficer
        preconditions:
          - "the case's UNIVERSITY round (latest by created_at) is COMPLETED — ERR_ROUND_NOT_CERTIFIED"
        side_effects:
          - "recommendation_score computed (calculation case_recommendation_score) and stored on the case"
          - "increments TenureCase.version by 1"

      - from: PROVOST_REVIEW
        to: DECIDED
        trigger: "POST /api/decisions"
        actor: ProvostOfficer
        preconditions:
          - "recorded_by (X-User-ID) != case.created_by_user_id — ERR_SOD_DECISION_BY_CASE_CREATOR"
          - "for GRANT_TENURE | GRANT_PROMOTION | GRANT_BOTH: recommendation_score >= 0.60 OR override_rationale non-empty — ERR_SCORE_BELOW_THRESHOLD"
        side_effects:
          - "ProvostDecision created RECORDED; decided_at = now; notification_deadline = decided_at + 10 days"
          - "if decision == DENY: Candidate.status -> NOT_RENEWED"
          - "if decision in {GRANT_TENURE, GRANT_BOTH} and case.seeking_tenure: Candidate.status -> TENURED"
          - "increments TenureCase.version by 1"

      - from: DECIDED
        to: NOTIFIED
        trigger: "POST /api/cases/{id}/notify"
        actor: ProvostOfficer
        preconditions:
          - "a RECORDED ProvostDecision exists — ERR_DECISION_NOT_FOUND"
          - "now <= decision.notification_deadline — ERR_NOTIFICATION_WINDOW_LAPSED"
        side_effects:
          - "decision.notification_sent_at = now; case.appeal_filing_deadline = now + 30 days"
          - "increments TenureCase.version by 1"

      - from: NOTIFIED
        to: CLOSED
        trigger: "POST /api/cases/{id}/close"
        actor: ProvostOfficer
        preconditions:
          - "now > appeal_filing_deadline — ERR_APPEAL_WINDOW_OPEN"
          - "no Appeal of the case in status FILED or UNDER_REVIEW — ERR_APPEAL_PENDING"
        side_effects:
          - "closed_at = now; retention_until = closed_at + 2555 days"
          - "increments TenureCase.version by 1"

      - from: CLOSED
        to: ARCHIVED
        trigger: "POST /api/cases/{id}/archive"
        actor: RecordsOfficer
        preconditions: []
        side_effects: ["increments TenureCase.version by 1"]

      - from: ARCHIVED
        to: PURGED
        trigger: "POST /api/cases/{id}/purge"
        actor: RecordsOfficer
        preconditions:
          - "now >= retention_until — ERR_RETENTION_NOT_EXPIRED"
        side_effects:
          - "purged_at = now"
          - "increments TenureCase.version by 1"

      - from: DOSSIER_ASSEMBLY
        to: WITHDRAWN
        trigger: "POST /api/cases/{id}/withdraw"
        actor: Candidate
        preconditions: ["acting user owns the case — ERR_OWNERSHIP_MISMATCH"]
        side_effects: ["Candidate.status -> WITHDRAWN", "PENDING clock-extension requests -> CANCELLED", "increments TenureCase.version by 1"]
      - from: EXTERNAL_REVIEW
        to: WITHDRAWN
        trigger: "POST /api/cases/{id}/withdraw"
        actor: Candidate
        preconditions: ["acting user owns the case — ERR_OWNERSHIP_MISMATCH"]
        side_effects:
          - "Candidate.status -> WITHDRAWN"
          - "PENDING clock-extension requests -> CANCELLED"
          - "invitations in SOLICITED or ACCEPTED -> WITHDRAWN"
          - "increments TenureCase.version by 1"
      - from: DEPT_COMMITTEE
        to: WITHDRAWN
        trigger: "POST /api/cases/{id}/withdraw"
        actor: Candidate
        preconditions: ["acting user owns the case — ERR_OWNERSHIP_MISMATCH"]
        side_effects:
          - "Candidate.status -> WITHDRAWN"
          - "PENDING clock-extension requests -> CANCELLED"
          - "rounds in SCHEDULED, VOTING_OPEN, or TALLYING -> CANCELLED"
          - "increments TenureCase.version by 1"
      - from: COLLEGE_COMMITTEE
        to: WITHDRAWN
        trigger: "POST /api/cases/{id}/withdraw"
        actor: Candidate
        preconditions: ["acting user owns the case — ERR_OWNERSHIP_MISMATCH"]
        side_effects:
          - "Candidate.status -> WITHDRAWN"
          - "PENDING clock-extension requests -> CANCELLED"
          - "rounds in SCHEDULED, VOTING_OPEN, or TALLYING -> CANCELLED"
          - "increments TenureCase.version by 1"
      - from: UNIVERSITY_COMMITTEE
        to: WITHDRAWN
        trigger: "POST /api/cases/{id}/withdraw"
        actor: Candidate
        preconditions: ["acting user owns the case — ERR_OWNERSHIP_MISMATCH"]
        side_effects:
          - "Candidate.status -> WITHDRAWN"
          - "PENDING clock-extension requests -> CANCELLED"
          - "rounds in SCHEDULED, VOTING_OPEN, or TALLYING -> CANCELLED"
          - "increments TenureCase.version by 1"
      - from: PROVOST_REVIEW
        to: WITHDRAWN
        trigger: "POST /api/cases/{id}/withdraw"
        actor: Candidate
        preconditions: ["acting user owns the case — ERR_OWNERSHIP_MISMATCH"]
        side_effects: ["Candidate.status -> WITHDRAWN", "PENDING clock-extension requests -> CANCELLED", "increments TenureCase.version by 1"]
      - from: RETURNED_FOR_REVISION
        to: WITHDRAWN
        trigger: "POST /api/cases/{id}/withdraw"
        actor: Candidate
        preconditions: ["acting user owns the case — ERR_OWNERSHIP_MISMATCH"]
        side_effects: ["Candidate.status -> WITHDRAWN", "PENDING clock-extension requests -> CANCELLED", "increments TenureCase.version by 1"]

      - from: DECIDED
        to: DEPT_COMMITTEE
        trigger: "system (automatic when an Appeal resolves REMANDED)"
        actor: system
        preconditions: []
        side_effects:
          - "the RECORDED ProvostDecision -> VOIDED"
          - "Candidate.status -> ACTIVE (from TENURED or NOT_RENEWED)"
          - "recommendation_score cleared to null"
          - "committee selector picks the eligible DEPARTMENT committee (ERR_NO_ELIGIBLE_COMMITTEE fails the appeal resolve call)"
          - "system creates a fresh DEPARTMENT ReviewRound (SCHEDULED)"
          - "increments TenureCase.version by 1"
      - from: NOTIFIED
        to: DEPT_COMMITTEE
        trigger: "system (automatic when an Appeal resolves REMANDED)"
        actor: system
        preconditions: []
        side_effects:
          - "the RECORDED ProvostDecision -> VOIDED"
          - "Candidate.status -> ACTIVE (from TENURED or NOT_RENEWED)"
          - "recommendation_score and appeal_filing_deadline cleared to null"
          - "committee selector picks the eligible DEPARTMENT committee (ERR_NO_ELIGIBLE_COMMITTEE fails the appeal resolve call)"
          - "system creates a fresh DEPARTMENT ReviewRound (SCHEDULED)"
          - "increments TenureCase.version by 1"

  - entity: DossierItem
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/dossier-items/{id}/submit"
        actor: Candidate
        preconditions:
          - "owning case stage == DOSSIER_ASSEMBLY — ERR_CASE_STAGE_FORBIDDEN"
          - "acting user owns the case — ERR_OWNERSHIP_MISMATCH"
        side_effects:
          - "if supersedes_item_id set: target item (same case, same category, status SUBMITTED) -> SUPERSEDED; otherwise ERR_SUPERSEDE_TARGET_INVALID fails the submit"
          - "recompute nothing else (completeness is evaluated at dossier submission)"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /api/dossier-items/{id}/return"
        actor: ProvostOfficer
        preconditions:
          - "owning case stage == DOSSIER_ASSEMBLY — ERR_CASE_STAGE_FORBIDDEN"
        side_effects: []
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /api/dossier-items/{id}/submit"
        actor: Candidate
        preconditions:
          - "owning case stage == DOSSIER_ASSEMBLY — ERR_CASE_STAGE_FORBIDDEN"
          - "acting user owns the case — ERR_OWNERSHIP_MISMATCH"
        side_effects: []
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /api/dossier-items/{id}/withdraw"
        actor: Candidate
        preconditions:
          - "owning case stage == DOSSIER_ASSEMBLY — ERR_CASE_STAGE_FORBIDDEN"
          - "acting user owns the case — ERR_OWNERSHIP_MISMATCH"
        side_effects: []
      - from: RETURNED
        to: WITHDRAWN
        trigger: "POST /api/dossier-items/{id}/withdraw"
        actor: Candidate
        preconditions:
          - "owning case stage == DOSSIER_ASSEMBLY — ERR_OWNERSHIP_MISMATCH + ERR_CASE_STAGE_FORBIDDEN"
        side_effects: []
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system (automatic when another item of the same case with supersedes_item_id == this item is submitted)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ReviewerInvitation
    initial_state: SOLICITED
    terminal_states: [LETTER_RECEIVED, DECLINED, WITHDRAWN, EXPIRED]
    transitions:
      - from: SOLICITED
        to: ACCEPTED
        trigger: "POST /api/invitations/{id}/accept"
        actor: ExternalReviewer
        preconditions:
          - "lazy expiry: if now > response_deadline the invitation first flips to EXPIRED and the call fails — ERR_INVITATION_EXPIRED"
          - "acting reviewer is the invited reviewer (X-User-ID == reviewer_id) — ERR_OWNERSHIP_MISMATCH"
        side_effects: []
      - from: SOLICITED
        to: DECLINED
        trigger: "POST /api/invitations/{id}/decline"
        actor: ExternalReviewer
        preconditions:
          - "lazy expiry applies as for accept — ERR_INVITATION_EXPIRED"
          - "acting reviewer is the invited reviewer — ERR_OWNERSHIP_MISMATCH"
        side_effects: []
      - from: ACCEPTED
        to: LETTER_RECEIVED
        trigger: "POST /api/invitations/{id}/submit-letter"
        actor: ExternalReviewer
        preconditions:
          - "acting reviewer is the invited reviewer — ERR_OWNERSHIP_MISMATCH"
          - "now <= review_window_end — ERR_REVIEW_WINDOW_CLOSED"
        side_effects:
          - "letter_received_at = now; letter_text stored"
      - from: SOLICITED
        to: WITHDRAWN
        trigger: "POST /api/invitations/{id}/withdraw"
        actor: ProvostOfficer
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "POST /api/invitations/{id}/withdraw"
        actor: ProvostOfficer
        preconditions: []
        side_effects: []
      - from: SOLICITED
        to: EXPIRED
        trigger: "system (lazy expiry: applied whenever a request targets this invitation by path id while now > response_deadline, and in a batch at close-solicitation; reads of OTHER invitations — e.g. capacity scans or list GETs — do NOT trigger it)"
        actor: system
        preconditions: ["now > response_deadline"]
        side_effects: ["increments ReviewerInvitation.version by 1"]

  - entity: ReviewRound
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: VOTING_OPEN
        trigger: "POST /api/rounds/{id}/open"
        actor: CommitteeChair
        preconditions:
          - "acting user is an active CHAIR of this round's committee — ERR_OWNERSHIP_MISMATCH"
          - "owning case stage matches the round level (DEPARTMENT->DEPT_COMMITTEE, COLLEGE->COLLEGE_COMMITTEE, UNIVERSITY->UNIVERSITY_COMMITTEE) — ERR_ROUND_SEALED"
        side_effects:
          - "opened_at = now; active_member_count M computed (is_active members whose service window covers opened_at); eligible_voter_count = M; quorum_required = ceil(quorum_fraction * M)"
      - from: VOTING_OPEN
        to: TALLYING
        trigger: "POST /api/rounds/{id}/close-voting"
        actor: CommitteeChair
        preconditions:
          - "acting user is an active CHAIR of this round's committee — ERR_OWNERSHIP_MISMATCH"
        side_effects: ["round tallies recomputed; ballots frozen (no further cast/patch/retract until a reopen)"]
      - from: TALLYING
        to: COMPLETED
        trigger: "POST /api/rounds/{id}/certify"
        actor: CommitteeChair
        preconditions:
          - "acting user is an active CHAIR of this round's committee — ERR_OWNERSHIP_MISMATCH"
          - "eligible_voter_count >= 1 — ERR_NO_ELIGIBLE_VOTERS (evaluated first)"
          - "quorum_met == true (votes_cast >= quorum_required) — ERR_QUORUM_NOT_MET"
          - "the certifying chair has no non-retracted Vote in this round (any ballot incl. RECUSE) — ERR_SOD_CERTIFIER_VOTED"
        side_effects:
          - "certified_at = now; yes_percentage and passed computed (calculations vote_tally); recommendation and letter_text stored from payload"
          - "the case does NOT advance here; advancement is the separate POST /api/cases/{id}/advance-stage call, so the reopen window stays reachable"
      - from: COMPLETED
        to: VOTING_OPEN
        trigger: "POST /api/rounds/{id}/reopen"
        actor: CommitteeChair
        preconditions:
          - "acting user is an active CHAIR of this round's committee — ERR_OWNERSHIP_MISMATCH"
          - "owning case stage still matches the round level — ERR_ROUND_SEALED (case must not have advanced)"
          - "this round is the case's latest round at its level (by created_at) — ERR_ROUND_SEALED (a remand creates a newer DEPARTMENT round, sealing the pre-remand one)"
        side_effects:
          - "certified_at, passed, yes_percentage, recommendation, letter_text cleared to null"
          - "all non-retracted votes remain CAST; tallies recomputed"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (case withdrawal)"
        actor: system
        preconditions: []
        side_effects: []
      - from: VOTING_OPEN
        to: CANCELLED
        trigger: "system (case withdrawal)"
        actor: system
        preconditions: []
        side_effects: ["all CAST votes of the round -> RETRACTED (system retraction, retracted_at = now)"]
      - from: TALLYING
        to: CANCELLED
        trigger: "system (case withdrawal)"
        actor: system
        preconditions: []
        side_effects: ["all CAST votes of the round -> RETRACTED (system retraction, retracted_at = now)"]

  - entity: Vote
    initial_state: CAST
    terminal_states: [RETRACTED]
    transitions:
      - from: CAST
        to: CAST
        trigger: "PATCH /api/votes/{id} (ballot change)"
        actor: CommitteeVoter
        preconditions:
          - "round status == VOTING_OPEN — ERR_ROUND_NOT_VOTING_OPEN"
          - "acting user is this vote's member — ERR_OWNERSHIP_MISMATCH"
          - "OCC: expected_vote_version == vote.version — ERR_STALE_VERSION"
          - "neither current nor new ballot is RECUSE — ERR_RECUSAL_IRREVERSIBLE"
        side_effects:
          - "increments Vote.version by 1"
          - "round tallies recomputed (yes/no/abstain counts, votes_cast)"
      - from: CAST
        to: RETRACTED
        trigger: "POST /api/votes/{id}/retract"
        actor: CommitteeVoter
        preconditions:
          - "round status == VOTING_OPEN — ERR_ROUND_NOT_VOTING_OPEN"
          - "acting user is this vote's member — ERR_OWNERSHIP_MISMATCH"
        side_effects:
          - "retracted_at = now"
          - "round tallies recomputed; if ballot was RECUSE, recusal_count decreases and eligible_voter_count/quorum_required recompute"

  - entity: ClockExtensionRequest
    initial_state: PENDING
    terminal_states: [DENIED, RESCINDED, CANCELLED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /api/clock-extensions/{id}/approve"
        actor: ProvostOfficer
        preconditions:
          - "no half-open overlap with any APPROVED extension of the same case — ERR_EXTENSION_INTERVAL_OVERLAP"
          - "merged union days including the new interval <= 730 — ERR_EXTENSION_CAP_EXCEEDED"
        side_effects:
          - "decided_at = now"
          - "case.extension_days recomputed (calculation extension_day_merge); case.mandatory_review_date recomputed (calculation mandatory_review_date); increments TenureCase.version by 1"
      - from: PENDING
        to: DENIED
        trigger: "POST /api/clock-extensions/{id}/deny"
        actor: ProvostOfficer
        preconditions: []
        side_effects: ["decided_at = now"]
      - from: APPROVED
        to: RESCINDED
        trigger: "POST /api/clock-extensions/{id}/rescind"
        actor: ProvostOfficer
        preconditions: []
        side_effects:
          - "decided_at = now"
          - "case.extension_days and case.mandatory_review_date recomputed without this interval; increments TenureCase.version by 1"
      - from: PENDING
        to: CANCELLED
        trigger: "system (case withdrawal)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: MidTenureReview
    initial_state: IN_PROGRESS
    terminal_states: [COMPLETED]
    transitions:
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /api/midterm-reviews/{id}/complete"
        actor: ProvostOfficer
        preconditions: []
        side_effects: ["outcome stored from payload; completed_at = now"]

  - entity: ProvostDecision
    initial_state: RECORDED
    terminal_states: [VOIDED]
    transitions:
      - from: RECORDED
        to: VOIDED
        trigger: "system (appeal resolved REMANDED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Appeal
    initial_state: FILED
    terminal_states: [UPHELD, DENIED, REMANDED, WITHDRAWN]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /api/appeals/{id}/begin-review"
        actor: AppealOfficer
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /api/appeals/{id}/resolve (resolution=UPHELD)"
        actor: AppealOfficer
        preconditions: []
        side_effects: ["resolved_at = now"]
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /api/appeals/{id}/resolve (resolution=DENIED)"
        actor: AppealOfficer
        preconditions: []
        side_effects: ["resolved_at = now"]
      - from: UNDER_REVIEW
        to: REMANDED
        trigger: "POST /api/appeals/{id}/resolve (resolution=REMANDED)"
        actor: AppealOfficer
        preconditions:
          - "owning case stage in {DECIDED, NOTIFIED} — ERR_CASE_STAGE_FORBIDDEN"
        side_effects:
          - "resolved_at = now"
          - "case DECIDED|NOTIFIED -> DEPT_COMMITTEE with the full remand cascade (decision VOIDED, candidate status -> ACTIVE, fresh DEPARTMENT round created)"
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /api/appeals/{id}/withdraw"
        actor: Candidate
        preconditions: ["acting user owns the case — ERR_OWNERSHIP_MISMATCH"]
        side_effects: []

  - entity: Candidate
    initial_state: ACTIVE
    terminal_states: [TENURED, NOT_RENEWED, WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: TENURED
        trigger: "system (ProvostDecision GRANT_TENURE or GRANT_BOTH recorded on a case with seeking_tenure=true)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: NOT_RENEWED
        trigger: "system (ProvostDecision DENY recorded)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "system (case withdrawal)"
        actor: system
        preconditions: []
        side_effects: []
      - from: TENURED
        to: ACTIVE
        trigger: "system (appeal remand)"
        actor: system
        preconditions: []
        side_effects: []
      - from: NOT_RENEWED
        to: ACTIVE
        trigger: "system (appeal remand)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; serial-observability filter applied)
# =============================================================================
concurrency_rules:
  - rule_id: dossier-item-create-stale-case
    parent_entity: TenureCase
    write_endpoint: "POST /api/dossier-items"
    occ_field: "expected_case_version"
    description: |
      Creating a DossierItem against a TenureCase whose version has advanced since
      the client last observed it is rejected. The client composes the item (and its
      supersedes_item_id choice) from a snapshot of the dossier; any other dossier
      mutation (another item created, submitted, returned, withdrawn, or a supersede
      cascade) legitimately succeeds on its own and bumps TenureCase.version, so the
      stale writer's composition is no longer grounded in current dossier state.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: invitation-create-stale-case
    parent_entity: TenureCase
    write_endpoint: "POST /api/invitations"
    occ_field: "expected_case_version"
    description: |
      Creating a ReviewerInvitation against a TenureCase whose version has advanced
      since the client last observed it is rejected. Solicitation planning reads the
      current invitation set (capacity windows, duplicate checks); another invitation
      create/withdraw legitimately succeeds and bumps TenureCase.version, leaving the
      stale writer's solicitation plan outdated.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: vote-patch-stale-vote
    parent_entity: Vote
    write_endpoint: "PATCH /api/votes/{id}"
    occ_field: "expected_vote_version"
    description: |
      Changing a ballot with an expected_vote_version that no longer matches the
      Vote's version is rejected. A ballot change against a stale view of the vote
      (e.g., a retried client request after a successful change) must not silently
      re-apply; the client re-reads the vote and resubmits against the fresh version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: dossier_completeness
    trigger: "evaluated inside POST /api/cases/{id}/submit-dossier"
    algorithm: threshold
    formula: |
      For each category c in {TEACHING, RESEARCH, SERVICE}:
        count_c = |DossierItem where case_id == case.id AND category == c AND status == SUBMITTED|
      complete = (count_TEACHING >= 2) AND (count_RESEARCH >= 3) AND (count_SERVICE >= 1)
                 AND (|RESEARCH items with status == SUBMITTED AND is_peer_reviewed == true| >= 1)
      Boundary: counts equal to the minimum PASS (>=, not >).
      Items in DRAFT, RETURNED, SUPERSEDED, WITHDRAWN never count.
    input_set: "DossierItems of the case with status == SUBMITTED only"
    constants:
      TEACHING_MIN: 2
      RESEARCH_MIN: 3
      SERVICE_MIN: 1
      PEER_REVIEWED_RESEARCH_MIN: 1

  - name: dossier_strength_index
    trigger: "computed at POST /api/cases/{id}/submit-dossier (success path) and stored on the case"
    algorithm: weighted_scoring
    formula: |
      For each category c (same input set as dossier_completeness):
        ratio_c = min(count_c / MIN_c, 2.0), rounded to 3 decimal places round_half_up
        contribution_c = ratio_c * WEIGHT_c            (exact decimal arithmetic)
      dossier_strength_index = round_half_up(sum of contribution_c, 4)
      PINNED ORDER: round each ratio to 3 dp FIRST, then weight and sum, then round the
      total to 4 dp. Summing unrounded ratios first and rounding only the total is the
      forbidden variant (e.g. counts T3/R5/S1 give 1.4835 pinned vs 1.4833 unpinned).
    input_set: "DossierItems of the case with status == SUBMITTED only"
    constants:
      TEACHING_MIN: 2
      RESEARCH_MIN: 3
      SERVICE_MIN: 1
      TEACHING_WEIGHT: 0.30
      RESEARCH_WEIGHT: 0.50
      SERVICE_WEIGHT: 0.20
      RATIO_CAP: 2.0
    precision: "ratios 3 decimal places, index 4 decimal places, round_half_up"

  - name: extension_day_merge
    trigger: "clock-extension approve or rescind"
    algorithm: interval_merge
    formula: |
      Take all APPROVED ClockExtensionRequests of the case (after applying the
      triggering approve/rescind). Each interval is half-open [interval_start, interval_end).
      Merge overlapping OR touching intervals into their union (touching intervals
      [a,b) and [b,c) merge into [a,c)).
      extension_days = sum over merged intervals of (end - start) in whole days.
      Two approved intervals can never overlap (approval validation forbids it), but
      touching intervals still merge; the union sum equals the plain sum in that case.
    input_set: "ClockExtensionRequests of the case with status == APPROVED"
    constants:
      MAX_EXTENSION_DAYS: 730
    precision: "whole days; dates at 00:00:00Z"

  - name: mandatory_review_date
    trigger: "case creation; recomputed on every clock-extension approve/rescind"
    algorithm: chronological
    formula: |
      base = candidate.tenure_clock_start
      if case.clock_policy == ANNIVERSARY:
        base_date = base advanced by 72 calendar months, month-anchored
                    (2020-08-01 + 72 months = 2026-08-01)
      if case.clock_policy == DAY_COUNT:
        days = round_half_up(72 * 30.4375) = 2192
        base_date = base + 2192 days                   (2020-08-01 + 2192d = 2026-08-02)
      mandatory_review_date = base_date + extension_days days
    input_set: "Candidate.tenure_clock_start, case.clock_policy, case.extension_days"
    constants:
      PROBATION_MONTHS: 72
      DAYS_PER_MONTH: 30.4375
      DAY_COUNT_TOTAL: 2192
    precision: "date granularity (00:00:00Z)"
    variants:
      - name: ANNIVERSARY
        when: "case.clock_policy == ANNIVERSARY"
        difference: "calendar-month arithmetic; leap-day-insensitive anchor (e.g. 2026-08-01 for clock start 2020-08-01 with zero extensions)"
      - name: DAY_COUNT
        when: "case.clock_policy == DAY_COUNT"
        difference: "fixed day-count arithmetic; drifts across leap years (e.g. 2026-08-02 for clock start 2020-08-01 with zero extensions) — 1 day later than ANNIVERSARY for the same input"

  - name: usable_letter_count
    trigger: "evaluated inside POST /api/cases/{id}/close-solicitation (after lazy expiry)"
    algorithm: aggregation
    formula: |
      usable_letter_count = |ReviewerInvitation where case_id == case.id
                             AND status == LETTER_RECEIVED|
      Close requires usable_letter_count >= 3 (boundary: exactly 3 passes).
    input_set: "ReviewerInvitations of the case; only LETTER_RECEIVED counts (SOLICITED, ACCEPTED, DECLINED, WITHDRAWN, EXPIRED never count)"
    constants:
      MIN_EXTERNAL_LETTERS: 3

  - name: vote_tally
    trigger: "computed inside POST /api/rounds/{id}/certify (also recomputed incrementally on every ballot mutation for the live tallies)"
    algorithm: threshold
    formula: |
      M  = |CommitteeMember where committee_id == round.committee_id AND is_active == true
            AND service_start <= round.opened_at <= service_end|      (fixed at open)
      R  = |Vote where round_id == round.id AND status == CAST AND ballot == RECUSE|
      eligible_voter_count = M - R
      quorum_required = ceil(committee.quorum_fraction * eligible_voter_count)
      votes_cast = |Vote where round_id AND status == CAST AND ballot in {YES, NO, ABSTAIN}|
      quorum_met = (votes_cast >= quorum_required) AND (eligible_voter_count >= 1)
      yes_percentage = round_half_up(yes_count / (yes_count + no_count), 4)   (null if yes+no == 0)
      EVALUATION ORDER (pinned): M at open -> R -> eligible -> quorum_required ->
      quorum_met -> variant pass rule. RECUSE ballots reduce eligible_voter_count but
      never count toward votes_cast; ABSTAIN counts toward votes_cast but never toward
      yes_percentage's denominator.
      Pass variants (selected by committee.pass_rule):
        STRICT_MAJORITY_OF_CAST:   passed = (yes_count / (yes_count + no_count)) > 0.5
        SUPERMAJORITY_OF_ENTITLED: passed = (yes_count / eligible_voter_count) >= 2/3
      Identical ballots can diverge: eligible 6, YES 3, NO 1, ABSTAIN 2 ->
      STRICT: 3/4 = 0.75 > 0.5 passes; SUPERMAJORITY: 3/6 = 0.50 >= 0.6667 fails.
    input_set: "CommitteeMembers of the round's committee; non-retracted Votes of the round"
    constants:
      SUPERMAJORITY_RATIO: 0.6667
      STRICT_RATIO: 0.5
    precision: "yes_percentage 4 decimal places, round_half_up"
    variants:
      - name: STRICT_MAJORITY_OF_CAST
        when: "committee.pass_rule == STRICT_MAJORITY_OF_CAST"
        difference: "denominator is cast YES+NO ballots only; strict > boundary (exactly 0.5 FAILS)"
      - name: SUPERMAJORITY_OF_ENTITLED
        when: "committee.pass_rule == SUPERMAJORITY_OF_ENTITLED"
        difference: "denominator is eligible_voter_count (recusals shrink it; abstentions and non-voters count against); >= 2/3 boundary (exactly 2/3 PASSES)"

  - name: case_recommendation_score
    trigger: "computed when the UNIVERSITY ReviewRound is certified (case enters PROVOST_REVIEW)"
    algorithm: weighted_scoring
    formula: |
      For each level L in {DEPARTMENT, COLLEGE, UNIVERSITY} take the round of the case
      at that level with status == COMPLETED; if several exist (post-remand), take the
      one with the latest certified_at (tie-break: latest created_at):
        pct_L = round.yes_percentage                       (already 4-dp rounded)
      raw = 0.25 * pct_DEPARTMENT + 0.35 * pct_COLLEGE + 0.40 * pct_UNIVERSITY
      if any of the three selected rounds has passed == false:
        recommendation_score = min(round_half_up(raw, 4), 0.49)
      else:
        recommendation_score = round_half_up(raw, 4)
      Example (all pass): pct 0.75 / 0.80 / 0.6667 -> raw 0.73418 -> score 0.7342.
      Example (university failed): pct 0.80 / 0.80 / 0.50 -> raw 0.68 -> score 0.49.
    input_set: "COMPLETED ReviewRounds of the case, latest per level by certified_at (tie-break created_at)"
    constants:
      DEPT_WEIGHT: 0.25
      COLLEGE_WEIGHT: 0.35
      UNIV_WEIGHT: 0.40
      FAIL_CAP: 0.49
      GRANT_THRESHOLD: 0.60
    precision: "4 decimal places, round_half_up"

  - name: notification_and_appeal_windows
    trigger: "ProvostDecision creation; POST notify; POST appeal create; POST close"
    algorithm: threshold
    formula: |
      notification_deadline = decision.decided_at + 10 days
      notify allowed while now <= notification_deadline           (boundary: exactly at deadline passes)
      appeal_filing_deadline = decision.notification_sent_at + 30 days
      appeal filing allowed while now <= appeal_filing_deadline   (boundary: exactly at deadline passes)
      case close allowed only while now > appeal_filing_deadline  (boundary: exactly at deadline FAILS)
    input_set: "ProvostDecision timestamps, logical clock"
    constants:
      NOTIFICATION_WINDOW_DAYS: 10
      APPEAL_WINDOW_DAYS: 30

  - name: retention_schedule
    trigger: "POST /api/cases/{id}/close (compute); POST /api/cases/{id}/purge (check)"
    algorithm: threshold
    formula: |
      retention_until = closed_at + 2555 days (7 * 365)
      purge allowed while now >= retention_until   (boundary: exactly at retention_until passes)
    input_set: "TenureCase.closed_at, logical clock"
    constants:
      RETENTION_DAYS: 2555

  - name: committee_selection
    trigger: "close-solicitation (DEPARTMENT round), advance-stage from DEPT/COLLEGE (next-level round), appeal remand (fresh DEPARTMENT round)"
    algorithm: threshold
    formula: |
      Eligibility filter (candidate set):
        - level == required level (DEPARTMENT for close-solicitation/remand, COLLEGE for
          DEPT advance, UNIVERSITY for UNIVERSITY-level... i.e. the level being entered)
        - academic_unit match: DEPARTMENT -> candidate.department; COLLEGE -> candidate.college;
          UNIVERSITY -> any unit (level-only match)
        - term covers the logical clock now: term_start <= now <= term_end
      Ranking: term_start DESC (most recent term first).
      Tie-break: created_at ASC (earliest created wins among equal term_start).
      Empty candidate set -> the calling transition fails with ERR_NO_ELIGIBLE_COMMITTEE.
      The selector NEVER uses entity ids for ranking.
    input_set: "Committee entities (all statuses — Committee has no lifecycle state)"
    constants: {}

  - name: reviewer_capacity
    trigger: "evaluated inside POST /api/invitations"
    algorithm: threshold
    formula: |
      active = ReviewerInvitations where reviewer_id == new.reviewer_id
               AND status in {SOLICITED, ACCEPTED}
      overlap (CLOSED semantics — touching counts as overlap):
        overlaps(a, b) = a.review_window_start <= b.review_window_end
                         AND b.review_window_start <= a.review_window_end
      if |{i in active : overlaps(i, new)}| >= 2 -> reject ERR_REVIEWER_CAPACITY_EXCEEDED
      Boundary: exactly 2 overlapping SOLICITED-or-ACCEPTED invitations rejects; 2 such invitations
      whose windows do NOT touch the new window passes.
    input_set: "ReviewerInvitations of the reviewer with status in {SOLICITED, ACCEPTED}"
    constants:
      MAX_ACTIVE_ASSIGNMENTS: 2

  - name: clock_extension_overlap
    trigger: "evaluated inside POST /api/clock-extensions/{id}/approve"
    algorithm: interval_merge
    formula: |
      approved = ClockExtensionRequests of the case with status == APPROVED
      overlap (HALF-OPEN semantics — touching does NOT count as overlap):
        overlaps(a, b) = a.interval_start < b.interval_end AND b.interval_start < a.interval_end
      if any i in approved overlaps the candidate interval -> ERR_EXTENSION_INTERVAL_OVERLAP
      Cap check: merged_union_days(approved + candidate) <= 730 -> else ERR_EXTENSION_CAP_EXCEEDED
      Boundary: candidate.interval_start == existing.interval_end is ALLOWED (no overlap).
    input_set: "ClockExtensionRequests of the case with status == APPROVED"
    constants:
      MAX_EXTENSION_DAYS: 730

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "X-User-Role is permitted for this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path resource ids exist, validated left-to-right (before any ownership evaluation, which needs the resource)"
    error_id: "ERR_CANDIDATE_NOT_FOUND | ERR_CASE_NOT_FOUND | ERR_DOSSIER_ITEM_NOT_FOUND | ERR_REVIEWER_NOT_FOUND | ERR_INVITATION_NOT_FOUND | ERR_COMMITTEE_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_ROUND_NOT_FOUND | ERR_VOTE_NOT_FOUND | ERR_CLOCK_EXTENSION_NOT_FOUND | ERR_MIDTERM_REVIEW_NOT_FOUND | ERR_DECISION_NOT_FOUND | ERR_APPEAL_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: existence
    check: "Body-referenced FK ids exist (candidate_id, case_id, reviewer_id, committee_id, round_id, supersedes_item_id)"
    error_id: "same ERR_*_NOT_FOUND catalog as priority 3, resolved per missing field"
    http_status: 404
    applies_to: "POST endpoints with body FKs"

  - priority: 5
    category: auth
    check: "Ownership/identity on existing resources: Candidate acting on own case/item/extension/appeal (X-User-ID == case.candidate_id); ExternalReviewer on own invitation; CommitteeVoter/Chair is a CommitteeMember of the round's committee; Candidate reads of invitations/rounds/votes allowed only when the linked case has waiver_signed == false"
    error_id: "ERR_OWNERSHIP_MISMATCH / ERR_CONFIDENTIAL_LETTERS_SEALED"
    http_status: 403
    applies_to: "role-scoped write endpoints; GET /api/invitations*, GET /api/rounds*, GET /api/votes* (confidentiality clause)"

  - priority: 6
    category: state
    check: "TenureCase stage permits the operation (item mutations require DOSSIER_ASSEMBLY; extension requests require a pre-DECIDED stage; invitation create requires EXTERNAL_REVIEW; decision requires PROVOST_REVIEW; advance-stage requires a committee stage; etc.). OCC precondition is evaluated in this same priority: expected_*_version must match the current entity version — ERR_STALE_VERSION (412)."
    error_id: "ERR_CASE_STAGE_FORBIDDEN | ERR_STALE_VERSION"
    http_status: 409
    applies_to: "stage-gated endpoints; OCC-guarded write endpoints"

  - priority: 7
    category: state
    check: "Target entity lifecycle state permits the transition (item SUBMIT transitions, invitation accept/decline/submit-letter/withdraw, round open/certify/reopen, extension approve/deny/rescind, midterm complete, appeal begin-review/resolve/withdraw, vote patch/retract)"
    error_id: "ERR_INVALID_ITEM_STATE | ERR_INVALID_INVITATION_STATE | ERR_INVALID_ROUND_STATE | ERR_INVALID_EXTENSION_STATE | ERR_INVALID_MIDTERM_STATE | ERR_INVALID_APPEAL_STATE | ERR_INVALID_VOTE_STATE"
    http_status: 409
    applies_to: "entity action endpoints"

  - priority: 8
    category: business_safety
    check: "Segregation of duties & confidentiality: certifier must not hold a non-retracted ballot in the round; decision recorder != case creator; recusal ballots cannot be changed to/from RECUSE; arm's-length certification must hold (is_arm_length == true AND declared_coauthor == false)"
    error_id: "ERR_SOD_CERTIFIER_VOTED | ERR_SOD_DECISION_BY_CASE_CREATOR | ERR_RECUSAL_IRREVERSIBLE | ERR_ARMS_LENGTH_VIOLATION"
    http_status: 409
    applies_to: "round certify, decision create, vote patch, invitation create"

  - priority: 9
    category: business_constraint
    check: "Structural constraints: unique employee_id / reviewer email; one CAST (non-retracted) ballot per (round, member); one CHAIR with is_active == true per committee; supersede target same case+category and SUBMITTED; duplicate non-terminal invitation (SOLICITED, ACCEPTED, or LETTER_RECEIVED) per (case, reviewer); interval field sanity (start < end); extension interval half-open overlap; reviewer capacity; extension day cap; vote member eligibility (active + service window covers opened_at)"
    error_id: "ERR_DUPLICATE_EMPLOYEE_ID | ERR_DUPLICATE_REVIEWER_EMAIL | ERR_DUPLICATE_BALLOT | ERR_CHAIR_CONFLICT | ERR_SUPERSEDE_TARGET_INVALID | ERR_DUPLICATE_INVITATION | ERR_INVALID_INTERVAL | ERR_EXTENSION_INTERVAL_OVERLAP | ERR_REVIEWER_CAPACITY_EXCEEDED | ERR_EXTENSION_CAP_EXCEEDED | ERR_VOTER_NOT_ELIGIBLE | ERR_INVALID_REQUEST"
    http_status: 409
    applies_to: "create/action endpoints as applicable"

  - priority: 10
    category: business_temporal
    check: "Deadline/window checks: dossier submission before mandatory_review_date; invitation accept before response_deadline (lazy expiry); letter submission before review_window_end; new invitation review_window_end must be > now; notify before notification_deadline; appeal before appeal_filing_deadline; close after appeal window; purge after retention_until"
    error_id: "ERR_REVIEW_CLOCK_EXPIRED | ERR_INVITATION_EXPIRED | ERR_REVIEW_WINDOW_CLOSED | ERR_NOTIFICATION_WINDOW_LAPSED | ERR_APPEAL_WINDOW_LAPSED | ERR_APPEAL_WINDOW_OPEN | ERR_RETENTION_NOT_EXPIRED"
    http_status: 409
    applies_to: "time-gated endpoints"

  - priority: 11
    category: business_referential
    check: "Aggregate/referential gates: dossier completeness; usable letter count >= 3; no open invitations at close-solicitation/return-for-revision; completed non-UNSATISFACTORY midterm review exists; current-level round certified (advance-stage); eligible committee selector non-empty; quorum met; eligible_voter_count >= 1; score threshold; single open appeal per case. Within one priority, ties evaluate in the order the checks are listed here."
    error_id: "ERR_DOSSIER_INCOMPLETE | ERR_INSUFFICIENT_EXTERNAL_LETTERS | ERR_OPEN_INVITATIONS_EXIST | ERR_MIDTERM_REVIEW_MISSING | ERR_MIDTERM_OUTCOME_BLOCKS | ERR_ROUND_NOT_CERTIFIED | ERR_NO_ELIGIBLE_COMMITTEE | ERR_QUORUM_NOT_MET | ERR_NO_ELIGIBLE_VOTERS | ERR_SCORE_BELOW_THRESHOLD | ERR_APPEAL_ALREADY_OPEN"
    http_status: 409
    applies_to: "submit-dossier, close-solicitation, return-for-revision, advance-stage, certify, decision create, appeal create"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Candidate ---
  - method: POST
    path: "/api/candidates"
    description: "Register a candidate"
    roles: [ProvostOfficer]
    code: 201
    input: [full_name, employee_id, department, college, tenure_clock_start]
    output: Candidate
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/api/candidates/{id}"
    description: "Get a candidate"
    roles: [Any]
    code: 200
    input: []
    output: Candidate
    side_effects: []

  # --- TenureCase ---
  - method: POST
    path: "/api/cases"
    description: "Open a tenure/promotion case for a candidate"
    roles: [ProvostOfficer]
    code: 201
    input: [candidate_id, review_cycle, target_rank, seeking_tenure, clock_policy, "waiver_signed?"]
    output: TenureCase
    side_effects:
      - "stage = DOSSIER_ASSEMBLY; created_by_user_id = X-User-ID"
      - "mandatory_review_date computed (calculation mandatory_review_date with extension_days = 0)"

  - method: GET
    path: "/api/cases"
    description: "List cases (FK reverse-reachability for TenureCase.candidate_id)"
    roles: [Any]
    code: 200
    input: ["candidate_id?", "stage?", "limit?", "offset?"]
    output: "TenureCase[]"
    side_effects: []

  - method: GET
    path: "/api/cases/{id}"
    description: "Get a case"
    roles: [Any]
    code: 200
    input: []
    output: TenureCase
    side_effects: []

  - method: POST
    path: "/api/cases/{id}/submit-dossier"
    description: "Submit the assembled dossier; DOSSIER_ASSEMBLY -> EXTERNAL_REVIEW"
    roles: [Candidate]
    code: 200
    input: []
    output: TenureCase
    side_effects: ["dossier_submitted_at set; dossier_strength_index computed; items locked; increments TenureCase.version by 1"]

  - method: POST
    path: "/api/cases/{id}/return-for-revision"
    description: "Provost office returns the case for dossier revision; EXTERNAL_REVIEW -> RETURNED_FOR_REVISION"
    roles: [ProvostOfficer]
    code: 200
    input: []
    output: TenureCase
    side_effects: ["SOLICITED invitations -> WITHDRAWN; increments TenureCase.version by 1"]

  - method: POST
    path: "/api/cases/{id}/resume-assembly"
    description: "Candidate resumes dossier assembly; RETURNED_FOR_REVISION -> DOSSIER_ASSEMBLY"
    roles: [Candidate]
    code: 200
    input: []
    output: TenureCase
    side_effects: ["items unlocked; increments TenureCase.version by 1"]

  - method: POST
    path: "/api/cases/{id}/close-solicitation"
    description: "Close external review; applies lazy expiry, validates letters/midterm, creates the DEPARTMENT round; EXTERNAL_REVIEW -> DEPT_COMMITTEE"
    roles: [ProvostOfficer]
    code: 200
    input: []
    output: TenureCase
    side_effects:
      - "lazy expiry of stale SOLICITED invitations"
      - "system creates DEPARTMENT ReviewRound (SCHEDULED) via committee selector"
      - "increments TenureCase.version by 1"

  - method: POST
    path: "/api/cases/{id}/advance-stage"
    description: "Advance the case past a certified committee round: DEPT->COLLEGE or COLLEGE->UNIVERSITY (creates the next round via the committee selector) or UNIVERSITY->PROVOST_REVIEW (computes recommendation_score)"
    roles: [ProvostOfficer]
    code: 200
    input: []
    output: TenureCase
    side_effects:
      - "stage advance per TenureCase machine; next-level ReviewRound created (DEPT/COLLEGE advances) or recommendation_score computed (UNIVERSITY advance)"
      - "increments TenureCase.version by 1"

  - method: POST
    path: "/api/cases/{id}/withdraw"
    description: "Candidate withdraws the case (pre-decision stages only)"
    roles: [Candidate]
    code: 200
    input: []
    output: TenureCase
    side_effects: ["Candidate.status -> WITHDRAWN; open invitations/rounds torn down per stage; PENDING clock-extension requests -> CANCELLED; increments TenureCase.version by 1"]

  - method: POST
    path: "/api/cases/{id}/notify"
    description: "Notify the candidate of the decision; DECIDED -> NOTIFIED"
    roles: [ProvostOfficer]
    code: 200
    input: []
    output: TenureCase
    side_effects: ["decision.notification_sent_at = now; appeal_filing_deadline = now + 30 days; increments TenureCase.version by 1"]

  - method: POST
    path: "/api/cases/{id}/close"
    description: "Close the case after the appeal window lapses; NOTIFIED -> CLOSED"
    roles: [ProvostOfficer]
    code: 200
    input: []
    output: TenureCase
    side_effects: ["closed_at = now; retention_until = closed_at + 2555 days; increments TenureCase.version by 1"]

  - method: POST
    path: "/api/cases/{id}/archive"
    description: "Move a closed case to archives; CLOSED -> ARCHIVED"
    roles: [RecordsOfficer]
    code: 200
    input: []
    output: TenureCase
    side_effects: ["increments TenureCase.version by 1"]

  - method: POST
    path: "/api/cases/{id}/purge"
    description: "Purge an archived case once retention expires; ARCHIVED -> PURGED"
    roles: [RecordsOfficer]
    code: 200
    input: []
    output: TenureCase
    side_effects: ["purged_at = now; increments TenureCase.version by 1"]

  # --- DossierItem ---
  - method: POST
    path: "/api/dossier-items"
    description: "Create a dossier evidence item (OCC on the parent case)"
    roles: [Candidate]
    code: 201
    input: [case_id, category, title, page_count, "is_peer_reviewed?", "supersedes_item_id?", expected_case_version]
    output: DossierItem
    side_effects: ["status = DRAFT", "increments TenureCase.version by 1"]

  - method: GET
    path: "/api/dossier-items"
    description: "List dossier items (FK reverse-reachability for case_id and supersedes_item_id)"
    roles: [Any]
    code: 200
    input: ["case_id?", "supersedes_item_id?", "status?", "category?", "limit?", "offset?"]
    output: "DossierItem[]"
    side_effects: []

  - method: GET
    path: "/api/dossier-items/{id}"
    description: "Get a dossier item"
    roles: [Any]
    code: 200
    input: []
    output: DossierItem
    side_effects: []

  - method: POST
    path: "/api/dossier-items/{id}/submit"
    description: "Submit a DRAFT or RETURNED item; fires the supersede cascade when supersedes_item_id is set"
    roles: [Candidate]
    code: 200
    input: []
    output: DossierItem
    side_effects: ["supersede target (if any) -> SUPERSEDED"]

  - method: POST
    path: "/api/dossier-items/{id}/return"
    description: "Provost office returns a SUBMITTED item for revision"
    roles: [ProvostOfficer]
    code: 200
    input: []
    output: DossierItem
    side_effects: []

  - method: POST
    path: "/api/dossier-items/{id}/withdraw"
    description: "Candidate withdraws a DRAFT or RETURNED item"
    roles: [Candidate]
    code: 200
    input: []
    output: DossierItem
    side_effects: []

  # --- ExternalReviewer ---
  - method: POST
    path: "/api/reviewers"
    description: "Register an external reviewer"
    roles: [ProvostOfficer]
    code: 201
    input: [full_name, institution, email, expertise_area]
    output: ExternalReviewer
    side_effects: []

  - method: GET
    path: "/api/reviewers/{id}"
    description: "Get a reviewer"
    roles: [Any]
    code: 200
    input: []
    output: ExternalReviewer
    side_effects: []

  # --- ReviewerInvitation ---
  - method: POST
    path: "/api/invitations"
    description: "Solicit an external reviewer for a case (OCC on the parent case); created SOLICITED"
    roles: [ProvostOfficer]
    code: 201
    input: [case_id, reviewer_id, review_window_start, review_window_end, is_arm_length, declared_coauthor, expected_case_version]
    output: ReviewerInvitation
    side_effects:
      - "status = SOLICITED; invited_at = now; response_deadline = invited_at + 14 days"
      - "increments TenureCase.version by 1"

  - method: GET
    path: "/api/invitations"
    description: "List invitations (FK reverse-reachability for case_id and reviewer_id); Candidate reads blocked when the case waiver_signed (ERR_CONFIDENTIAL_LETTERS_SEALED)"
    roles: [Any, Candidate]
    code: 200
    input: ["case_id?", "reviewer_id?", "status?", "limit?", "offset?"]
    output: "ReviewerInvitation[]"
    side_effects: []

  - method: GET
    path: "/api/invitations/{id}"
    description: "Get an invitation; Candidate reads blocked when the case waiver_signed (ERR_CONFIDENTIAL_LETTERS_SEALED)"
    roles: [Any, Candidate]
    code: 200
    input: []
    output: ReviewerInvitation
    side_effects: []

  - method: POST
    path: "/api/invitations/{id}/accept"
    description: "Reviewer accepts the solicitation"
    roles: [ExternalReviewer]
    code: 200
    input: []
    output: ReviewerInvitation
    side_effects: ["lazy expiry applied first"]

  - method: POST
    path: "/api/invitations/{id}/decline"
    description: "Reviewer declines the solicitation"
    roles: [ExternalReviewer]
    code: 200
    input: []
    output: ReviewerInvitation
    side_effects: ["lazy expiry applied first"]

  - method: POST
    path: "/api/invitations/{id}/submit-letter"
    description: "Reviewer submits the external review letter; ACCEPTED -> LETTER_RECEIVED"
    roles: [ExternalReviewer]
    code: 200
    input: [letter_text]
    output: ReviewerInvitation
    side_effects: ["letter_received_at = now"]

  - method: POST
    path: "/api/invitations/{id}/withdraw"
    description: "Provost office withdraws a SOLICITED or ACCEPTED invitation"
    roles: [ProvostOfficer]
    code: 200
    input: []
    output: ReviewerInvitation
    side_effects: []

  # --- Committee ---
  - method: POST
    path: "/api/committees"
    description: "Create a committee (level, unit, term, quorum fraction, pass rule)"
    roles: [ProvostOfficer]
    code: 201
    input: [level, academic_unit, term_start, term_end, "quorum_fraction?", pass_rule]
    output: Committee
    side_effects: []

  - method: GET
    path: "/api/committees/{id}"
    description: "Get a committee"
    roles: [Any]
    code: 200
    input: []
    output: Committee
    side_effects: []

  # --- CommitteeMember ---
  - method: POST
    path: "/api/members"
    description: "Add a member to a committee"
    roles: [ProvostOfficer]
    code: 201
    input: [committee_id, full_name, email, "role_in_committee?", service_start, service_end]
    output: CommitteeMember
    side_effects: ["is_active = true"]

  - method: GET
    path: "/api/members"
    description: "List committee members (FK reverse-reachability for committee_id)"
    roles: [Any]
    code: 200
    input: ["committee_id?", "limit?", "offset?"]
    output: "CommitteeMember[]"
    side_effects: []

  - method: GET
    path: "/api/members/{id}"
    description: "Get a committee member"
    roles: [Any]
    code: 200
    input: []
    output: CommitteeMember
    side_effects: []

  - method: POST
    path: "/api/members/{id}/deactivate"
    description: "Deactivate a member (is_active = false); excluded from eligibility and voting"
    roles: [ProvostOfficer]
    code: 200
    input: []
    output: CommitteeMember
    side_effects: ["is_active = false"]

  # --- ReviewRound ---
  - method: GET
    path: "/api/rounds"
    description: "List rounds (FK reverse-reachability for case_id and committee_id); Candidate reads blocked when the case waiver_signed"
    roles: [Any, Candidate]
    code: 200
    input: ["case_id?", "committee_id?", "level?", "status?", "limit?", "offset?"]
    output: "ReviewRound[]"
    side_effects: []

  - method: GET
    path: "/api/rounds/{id}"
    description: "Get a round; Candidate reads blocked when the case waiver_signed"
    roles: [Any, Candidate]
    code: 200
    input: []
    output: ReviewRound
    side_effects: []

  - method: POST
    path: "/api/rounds/{id}/open"
    description: "Committee chair opens voting; SCHEDULED -> VOTING_OPEN; computes M, eligible, quorum_required"
    roles: [CommitteeChair]
    code: 200
    input: []
    output: ReviewRound
    side_effects: ["opened_at = now; active_member_count/eligible_voter_count/quorum_required computed"]

  - method: POST
    path: "/api/rounds/{id}/close-voting"
    description: "Committee chair closes balloting; VOTING_OPEN -> TALLYING"
    roles: [CommitteeChair]
    code: 200
    input: []
    output: ReviewRound
    side_effects: ["tallies frozen; recomputed for certification"]

  - method: POST
    path: "/api/rounds/{id}/certify"
    description: "Committee chair certifies the tally and files the recommendation letter; TALLYING -> COMPLETED. Case advancement is NOT automatic; use POST /api/cases/{id}/advance-stage (this keeps the reopen window reachable)."
    roles: [CommitteeChair]
    code: 200
    input: [recommendation, letter_text]
    output: ReviewRound
    side_effects:
      - "yes_percentage and passed computed (calculation vote_tally); certified_at = now"

  - method: POST
    path: "/api/rounds/{id}/reopen"
    description: "Committee chair reopens a certified round while the case is still at the round's level AND no newer round exists at that level (remand seals pre-remand rounds); COMPLETED -> VOTING_OPEN"
    roles: [CommitteeChair]
    code: 200
    input: []
    output: ReviewRound
    side_effects: ["certified_at/passed/yes_percentage/recommendation/letter_text cleared; tallies recomputed"]

  # --- Vote ---
  - method: POST
    path: "/api/votes"
    description: "Cast a ballot (member resolved from X-User-ID)"
    roles: [CommitteeVoter]
    code: 201
    input: [round_id, ballot]
    output: Vote
    side_effects:
      - "member_id = X-User-ID; status = CAST; cast_at = now"
      - "round tallies recomputed (votes_cast, yes/no/abstain counts, recusal_count, eligible_voter_count, quorum_required)"

  - method: GET
    path: "/api/votes"
    description: "List votes (FK reverse-reachability for round_id and member_id); Candidate reads blocked when the case waiver_signed"
    roles: [Any, Candidate]
    code: 200
    input: ["round_id?", "member_id?", "limit?", "offset?"]
    output: "Vote[]"
    side_effects: []

  - method: GET
    path: "/api/votes/{id}"
    description: "Get a vote; Candidate reads blocked when the case waiver_signed"
    roles: [Any, Candidate]
    code: 200
    input: []
    output: Vote
    side_effects: []

  - method: PATCH
    path: "/api/votes/{id}"
    description: "Change a ballot while the round is VOTING_OPEN (OCC on the vote; RECUSE transitions forbidden)"
    roles: [CommitteeVoter]
    code: 200
    input: [ballot, expected_vote_version]
    output: Vote
    side_effects: ["increments Vote.version by 1; round tallies recomputed"]

  - method: POST
    path: "/api/votes/{id}/retract"
    description: "Retract a ballot while the round is VOTING_OPEN"
    roles: [CommitteeVoter]
    code: 200
    input: []
    output: Vote
    side_effects: ["status -> RETRACTED; retracted_at = now; round tallies recomputed (recusal re-included in eligible when a RECUSE ballot is retracted)"]

  # --- ClockExtensionRequest ---
  - method: POST
    path: "/api/clock-extensions"
    description: "Candidate files a stop-the-clock request"
    roles: [Candidate]
    code: 201
    input: [case_id, reason, interval_start, interval_end]
    output: ClockExtensionRequest
    side_effects: ["status = PENDING"]

  - method: GET
    path: "/api/clock-extensions"
    description: "List clock-extension requests (FK reverse-reachability for case_id)"
    roles: [Any]
    code: 200
    input: ["case_id?", "status?", "limit?", "offset?"]
    output: "ClockExtensionRequest[]"
    side_effects: []

  - method: GET
    path: "/api/clock-extensions/{id}"
    description: "Get a clock-extension request"
    roles: [Any]
    code: 200
    input: []
    output: ClockExtensionRequest
    side_effects: []

  - method: POST
    path: "/api/clock-extensions/{id}/approve"
    description: "Approve a PENDING request; validates overlap/cap; recomputes the case clock"
    roles: [ProvostOfficer]
    code: 200
    input: []
    output: ClockExtensionRequest
    side_effects: ["case.extension_days and mandatory_review_date recomputed; increments TenureCase.version by 1"]

  - method: POST
    path: "/api/clock-extensions/{id}/deny"
    description: "Deny a PENDING request"
    roles: [ProvostOfficer]
    code: 200
    input: []
    output: ClockExtensionRequest
    side_effects: ["decided_at = now"]

  - method: POST
    path: "/api/clock-extensions/{id}/rescind"
    description: "Rescind an APPROVED request; recomputes the case clock without it"
    roles: [ProvostOfficer]
    code: 200
    input: []
    output: ClockExtensionRequest
    side_effects: ["case.extension_days and mandatory_review_date recomputed; increments TenureCase.version by 1"]

  # --- MidTenureReview ---
  - method: POST
    path: "/api/midterm-reviews"
    description: "Open a mid-tenure review for a case (created IN_PROGRESS)"
    roles: [ProvostOfficer]
    code: 201
    input: [case_id, review_year]
    output: MidTenureReview
    side_effects: ["status = IN_PROGRESS"]

  - method: GET
    path: "/api/midterm-reviews"
    description: "List mid-tenure reviews (FK reverse-reachability for case_id)"
    roles: [Any]
    code: 200
    input: ["case_id?", "limit?", "offset?"]
    output: "MidTenureReview[]"
    side_effects: []

  - method: GET
    path: "/api/midterm-reviews/{id}"
    description: "Get a mid-tenure review"
    roles: [Any]
    code: 200
    input: []
    output: MidTenureReview
    side_effects: []

  - method: POST
    path: "/api/midterm-reviews/{id}/complete"
    description: "Complete a mid-tenure review with an outcome"
    roles: [ProvostOfficer]
    code: 200
    input: [outcome]
    output: MidTenureReview
    side_effects: ["status -> COMPLETED; completed_at = now"]

  # --- ProvostDecision ---
  - method: POST
    path: "/api/decisions"
    description: "Record the provost decision (SoD: recorder != case creator)"
    roles: [ProvostOfficer]
    code: 201
    input: [case_id, decision, rationale_text, "override_rationale?"]
    output: ProvostDecision
    side_effects:
      - "decided_at = now; notification_deadline = decided_at + 10 days; status = RECORDED"
      - "candidate status cascade (TENURED / NOT_RENEWED)"
      - "case PROVOST_REVIEW -> DECIDED; increments TenureCase.version by 1"

  - method: GET
    path: "/api/decisions"
    description: "List decisions (FK reverse-reachability for case_id)"
    roles: [Any]
    code: 200
    input: ["case_id?", "limit?", "offset?"]
    output: "ProvostDecision[]"
    side_effects: []

  - method: GET
    path: "/api/decisions/{id}"
    description: "Get a decision"
    roles: [Any]
    code: 200
    input: []
    output: ProvostDecision
    side_effects: []

  # --- Appeal ---
  - method: POST
    path: "/api/appeals"
    description: "Candidate files an appeal within the filing window; requires case stage NOTIFIED (ERR_CASE_STAGE_FORBIDDEN otherwise), ownership, in-window filing, and no other FILED/UNDER_REVIEW appeal on the case"
    roles: [Candidate]
    code: 201
    input: [case_id, grounds]
    output: Appeal
    side_effects: ["status = FILED; filed_at = now"]

  - method: GET
    path: "/api/appeals"
    description: "List appeals (FK reverse-reachability for case_id)"
    roles: [Any]
    code: 200
    input: ["case_id?", "status?", "limit?", "offset?"]
    output: "Appeal[]"
    side_effects: []

  - method: GET
    path: "/api/appeals/{id}"
    description: "Get an appeal"
    roles: [Any]
    code: 200
    input: []
    output: Appeal
    side_effects: []

  - method: POST
    path: "/api/appeals/{id}/begin-review"
    description: "Appeal officer opens review; FILED -> UNDER_REVIEW"
    roles: [AppealOfficer]
    code: 200
    input: []
    output: Appeal
    side_effects: []

  - method: POST
    path: "/api/appeals/{id}/resolve"
    description: "Appeal officer resolves; REMANDED fires the remand cascade on the case"
    roles: [AppealOfficer]
    code: 200
    input: [resolution, resolution_text]
    output: Appeal
    side_effects: ["resolved_at = now; on REMANDED: case -> DEPT_COMMITTEE, decision VOIDED, candidate ACTIVE, fresh DEPARTMENT round created"]

  - method: POST
    path: "/api/appeals/{id}/withdraw"
    description: "Candidate withdraws a FILED appeal"
    roles: [Candidate]
    code: 200
    input: []
    output: Appeal
    side_effects: []

  # --- Test-driving clock ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the server's logical clock (ISO8601 `to_iso8601`). Startup default whenever a logical clock exists: 2026-08-01T00:00:00Z — before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "Acting user is not the owning candidate / invited reviewer / committee member required by the endpoint" }
  - { id: ERR_CONFIDENTIAL_LETTERS_SEALED, http: 403, condition: "Candidate attempted to read invitations, rounds, or votes of a case with waiver_signed == true" }
  # --- not found ---
  - { id: ERR_CANDIDATE_NOT_FOUND, http: 404, condition: "candidate id does not exist" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "case id does not exist" }
  - { id: ERR_DOSSIER_ITEM_NOT_FOUND, http: 404, condition: "dossier item id does not exist" }
  - { id: ERR_REVIEWER_NOT_FOUND, http: 404, condition: "reviewer id does not exist" }
  - { id: ERR_INVITATION_NOT_FOUND, http: 404, condition: "invitation id does not exist" }
  - { id: ERR_COMMITTEE_NOT_FOUND, http: 404, condition: "committee id does not exist" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "committee member id does not exist" }
  - { id: ERR_ROUND_NOT_FOUND, http: 404, condition: "round id does not exist" }
  - { id: ERR_VOTE_NOT_FOUND, http: 404, condition: "vote id does not exist" }
  - { id: ERR_CLOCK_EXTENSION_NOT_FOUND, http: 404, condition: "clock-extension request id does not exist" }
  - { id: ERR_MIDTERM_REVIEW_NOT_FOUND, http: 404, condition: "mid-tenure review id does not exist" }
  - { id: ERR_DECISION_NOT_FOUND, http: 404, condition: "decision id does not exist (or none recorded where required)" }
  - { id: ERR_APPEAL_NOT_FOUND, http: 404, condition: "appeal id does not exist" }
  # --- generic request ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, enum outside the declared set, page_count < 1, review_year < 1, or invalid pagination parameters" }
  - { id: ERR_INVALID_INTERVAL, http: 400, condition: "start >= end (or start > end for service windows) on interval fields" }
  # --- concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the current entity version (OCC)" }
  # --- case stage / lifecycle state ---
  - { id: ERR_CASE_STAGE_FORBIDDEN, http: 409, condition: "TenureCase stage does not permit the operation" }
  - { id: ERR_INVALID_ITEM_STATE, http: 409, condition: "DossierItem transition invalid for its current status" }
  - { id: ERR_INVALID_INVITATION_STATE, http: 409, condition: "ReviewerInvitation transition invalid for its current status" }
  - { id: ERR_INVALID_ROUND_STATE, http: 409, condition: "ReviewRound transition invalid for its current status (open requires SCHEDULED, certify requires TALLYING, reopen requires COMPLETED, ballot ops require VOTING_OPEN)" }
  - { id: ERR_INVALID_EXTENSION_STATE, http: 409, condition: "ClockExtensionRequest transition invalid for its current status" }
  - { id: ERR_INVALID_MIDTERM_STATE, http: 409, condition: "MidTenureReview already COMPLETED" }
  - { id: ERR_INVALID_APPEAL_STATE, http: 409, condition: "Appeal transition invalid for its current status" }
  - { id: ERR_INVALID_VOTE_STATE, http: 409, condition: "Vote transition invalid for its current status (e.g. patch/retract a RETRACTED vote)" }
  - { id: ERR_ROUND_SEALED, http: 409, condition: "Round's owning case has advanced past the round's level; open/reopen forbidden" }
  # --- segregation of duties / safety ---
  - { id: ERR_SOD_CERTIFIER_VOTED, http: 409, condition: "Certifying chair holds a non-retracted ballot (incl. RECUSE) in the round" }
  - { id: ERR_SOD_DECISION_BY_CASE_CREATOR, http: 409, condition: "ProvostDecision recorder X-User-ID equals the case creator's" }
  - { id: ERR_RECUSAL_IRREVERSIBLE, http: 409, condition: "Ballot change from or to RECUSE is forbidden; retract and re-cast instead" }
  - { id: ERR_ARMS_LENGTH_VIOLATION, http: 422, condition: "Invitation with is_arm_length == false or declared_coauthor == true" }
  # --- structural constraints ---
  - { id: ERR_DUPLICATE_EMPLOYEE_ID, http: 409, condition: "employee_id already registered" }
  - { id: ERR_DUPLICATE_REVIEWER_EMAIL, http: 409, condition: "reviewer email already registered" }
  - { id: ERR_DUPLICATE_BALLOT, http: 409, condition: "Member already holds a non-retracted ballot (any kind) in this round" }
  - { id: ERR_CHAIR_CONFLICT, http: 409, condition: "Committee already has an active CHAIR" }
  - { id: ERR_SUPERSEDE_TARGET_INVALID, http: 409, condition: "supersedes_item_id is not a SUBMITTED item of the same case and category" }
  - { id: ERR_DUPLICATE_INVITATION, http: 409, condition: "An invitation for the same (case, reviewer) already exists in SOLICITED, ACCEPTED, or LETTER_RECEIVED" }
  - { id: ERR_EXTENSION_INTERVAL_OVERLAP, http: 409, condition: "Candidate interval overlaps an APPROVED extension under half-open semantics" }
  - { id: ERR_EXTENSION_CAP_EXCEEDED, http: 422, condition: "Merged approved extension days would exceed 730" }
  - { id: ERR_REVIEWER_CAPACITY_EXCEEDED, http: 409, condition: "Reviewer already has 2 invitations in status SOLICITED or ACCEPTED whose review windows overlap the new window (closed semantics)" }
  - { id: ERR_VOTER_NOT_ELIGIBLE, http: 409, condition: "Voter is inactive, not a member of the round's committee, or service window does not cover opened_at" }
  # --- temporal ---
  - { id: ERR_REVIEW_CLOCK_EXPIRED, http: 409, condition: "Dossier submission attempted after mandatory_review_date" }
  - { id: ERR_INVITATION_EXPIRED, http: 409, condition: "Accept/decline attempted after response_deadline (invitation flips to EXPIRED)" }
  - { id: ERR_REVIEW_WINDOW_CLOSED, http: 409, condition: "Letter submission after review_window_end, or invitation create with review_window_end <= now" }
  - { id: ERR_NOTIFICATION_WINDOW_LAPSED, http: 409, condition: "Notify attempted after notification_deadline" }
  - { id: ERR_APPEAL_WINDOW_LAPSED, http: 409, condition: "Appeal filed after appeal_filing_deadline" }
  - { id: ERR_APPEAL_WINDOW_OPEN, http: 409, condition: "Close attempted while now <= appeal_filing_deadline" }
  - { id: ERR_RETENTION_NOT_EXPIRED, http: 409, condition: "Purge attempted before retention_until" }
  # --- aggregate / referential gates ---
  - { id: ERR_DOSSIER_INCOMPLETE, http: 422, condition: "Category minima or peer-reviewed-research requirement unmet at dossier submission" }
  - { id: ERR_INSUFFICIENT_EXTERNAL_LETTERS, http: 409, condition: "Fewer than 3 LETTER_RECEIVED invitations at close-solicitation" }
  - { id: ERR_OPEN_INVITATIONS_EXIST, http: 409, condition: "SOLICITED invitations remain at close-solicitation, or ACCEPTED invitations remain at return-for-revision" }
  - { id: ERR_MIDTERM_REVIEW_MISSING, http: 409, condition: "No COMPLETED MidTenureReview exists for the case at close-solicitation" }
  - { id: ERR_MIDTERM_OUTCOME_BLOCKS, http: 409, condition: "A COMPLETED MidTenureReview with outcome UNSATISFACTORY blocks close-solicitation" }
  - { id: ERR_NO_ELIGIBLE_COMMITTEE, http: 409, condition: "Committee selector found no eligible committee (level/unit/term) for the required round" }
  - { id: ERR_ROUND_NOT_CERTIFIED, http: 409, condition: "advance-stage attempted while the current level's round is not COMPLETED" }
  - { id: ERR_QUORUM_NOT_MET, http: 409, condition: "votes_cast < quorum_required at certification" }
  - { id: ERR_NO_ELIGIBLE_VOTERS, http: 409, condition: "eligible_voter_count == 0 at certification" }
  - { id: ERR_SCORE_BELOW_THRESHOLD, http: 422, condition: "GRANT_* decision with recommendation_score < 0.60 and empty override_rationale" }
  - { id: ERR_APPEAL_ALREADY_OPEN, http: 409, condition: "An appeal in FILED or UNDER_REVIEW already exists for the case" }
  - { id: ERR_APPEAL_PENDING, http: 409, condition: "Close attempted while an appeal is FILED or UNDER_REVIEW" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProvostOfficer
    description: "Provost-office staff; runs case administration, solicitation, committee management, extensions, midterm reviews, decisions (with SoD), notifications, and closures"
    identity: opaque
    exclusive_operations:
      - "POST /api/candidates"
      - "POST /api/cases"
      - "POST /api/cases/{id}/return-for-revision"
      - "POST /api/cases/{id}/close-solicitation"
      - "POST /api/cases/{id}/advance-stage"
      - "POST /api/cases/{id}/notify"
      - "POST /api/cases/{id}/close"
      - "POST /api/dossier-items/{id}/return"
      - "POST /api/reviewers"
      - "POST /api/invitations"
      - "POST /api/invitations/{id}/withdraw"
      - "POST /api/committees"
      - "POST /api/members"
      - "POST /api/members/{id}/deactivate"
      - "POST /api/clock-extensions/{id}/approve"
      - "POST /api/clock-extensions/{id}/deny"
      - "POST /api/clock-extensions/{id}/rescind"
      - "POST /api/midterm-reviews"
      - "POST /api/midterm-reviews/{id}/complete"
      - "POST /api/decisions"
    shared_operations: ["all GET endpoints (via Any)"]

  - name: Candidate
    description: "Faculty member under review; assembles the dossier, requests clock extensions, files appeals"
    identity: "entity_backed:Candidate"
    exclusive_operations:
      - "POST /api/cases/{id}/submit-dossier"
      - "POST /api/cases/{id}/resume-assembly"
      - "POST /api/cases/{id}/withdraw"
      - "POST /api/dossier-items"
      - "POST /api/dossier-items/{id}/submit"
      - "POST /api/dossier-items/{id}/withdraw"
      - "POST /api/clock-extensions"
      - "POST /api/appeals"
      - "POST /api/appeals/{id}/withdraw"
    shared_operations: ["GET endpoints except invitations/rounds/votes of own case when waiver_signed == true"]

  - name: CommitteeChair
    description: "Chair of a committee; opens, certifies (with letter), and reopens rounds of their own committee"
    identity: "entity_backed:CommitteeMember"
    exclusive_operations:
      - "POST /api/rounds/{id}/open"
      - "POST /api/rounds/{id}/close-voting"
      - "POST /api/rounds/{id}/certify"
      - "POST /api/rounds/{id}/reopen"
    shared_operations: ["all GET endpoints (via Any)"]

  - name: CommitteeVoter
    description: "Voting member of a committee; casts, changes, and retracts ballots in own committee's rounds"
    identity: "entity_backed:CommitteeMember"
    exclusive_operations:
      - "POST /api/votes"
      - "PATCH /api/votes/{id}"
      - "POST /api/votes/{id}/retract"
    shared_operations: ["all GET endpoints (via Any)"]

  - name: ExternalReviewer
    description: "External letter writer; accepts/declines solicitations and submits review letters"
    identity: "entity_backed:ExternalReviewer"
    exclusive_operations:
      - "POST /api/invitations/{id}/accept"
      - "POST /api/invitations/{id}/decline"
      - "POST /api/invitations/{id}/submit-letter"
    shared_operations: ["all GET endpoints (via Any)"]

  - name: AppealOfficer
    description: "Grievance officer; reviews and resolves appeals"
    identity: opaque
    exclusive_operations:
      - "POST /api/appeals/{id}/begin-review"
      - "POST /api/appeals/{id}/resolve"
    shared_operations: ["all GET endpoints (via Any)"]

  - name: RecordsOfficer
    description: "Records custodian; archives closed cases and purges after retention expiry"
    identity: opaque
    exclusive_operations:
      - "POST /api/cases/{id}/archive"
      - "POST /api/cases/{id}/purge"
    shared_operations: ["all GET endpoints (via Any)"]

  - name: SystemAdmin
    description: "Test operator; drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/_clock/set_current_utc"
    shared_operations: ["all GET endpoints (via Any)"]

  - name: Any
    description: "Pseudo-role covering every authenticated principal for read endpoints"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /api/candidates/{id}"
      - "GET /api/cases, /api/cases/{id}"
      - "GET /api/dossier-items, /api/dossier-items/{id}"
      - "GET /api/reviewers/{id}"
      - "GET /api/invitations, /api/invitations/{id} (Candidate blocked when waiver_signed)"
      - "GET /api/committees/{id}"
      - "GET /api/members, /api/members/{id}"
      - "GET /api/rounds, /api/rounds/{id} (Candidate blocked when waiver_signed)"
      - "GET /api/votes, /api/votes/{id} (Candidate blocked when waiver_signed)"
      - "GET /api/clock-extensions, /api/clock-extensions/{id}"
      - "GET /api/midterm-reviews, /api/midterm-reviews/{id}"
      - "GET /api/decisions, /api/decisions/{id}"
      - "GET /api/appeals, /api/appeals/{id}"
