            - "HazardEvaluation.${he_id}.status == DRAFT and HazardEvaluation.${he_id}.variant == PRELIMINARY"
            - "HazardEvaluation.${he_id}.hazard_score == 87.40 and HazardEvaluation.${he_id}.ratified_by_user_id == null"

