        distinguishing_aspect: "A depth-3 chain in the opposite direction of the verification cascade: reporting a passing mutates the in-transit Shipment, that shipment mutation parks its parent Order, and the parked Order bubbles up to close the Plan, so the trigger is a Pet write and the last hop is an AutoshipPlan write."
