              as_user_id: "${acct_id}"
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /registrar/invoices/${inv_id}/pay"
              payload: { use_credit: false }
              as: Registrant
              as_user_id: "${acct_id}"
            - call: "POST /registrar/abuse-reports"
              payload: { domain_id: "${dom_id}", category: "SPAM", severity: "HIGH", reporter_email: "watch@ngo.example" }
              as: Anonymous
              captures: { rep_id: $.data.id }
            - call: "POST /registrar/abuse-reports/${rep_id}/review"
              payload: {}
              as: AbuseAnalyst
              as_user_id: "analyst-1"
            - call: "POST /registrar/abuse-reports/${rep_id}/uphold"
              payload: { decision_note: "spam" }
              as: AbuseAnalyst
              as_user_id: "analyst-2"
          trigger:
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /registrar/_ops/run-expiry-sweep"
              payload: {}
              as: PlatformAdmin
            - call: "GET /registrar/accounts/${acct_id}"
              payload: {}
              as: SupportAgent
              as_user_id: "support-1"
          assert:
            - "before the clock move: Account.${acct_id}.risk_score == 30 and status == 'ACTIVE'"
            - "after the sweep at 2026-11-01: Account.${acct_id}.risk_score == 8 (30 * 0.5^floor(184/90) == 7.5, round_half_up)"
            - "Account.${acct_id}.status == 'ACTIVE' and Domain.${dom_id}.lifecycle_status == 'SUSPENDED' (decay never un-suspends anything)"

      - name: credit_covering_the_whole_invoice_needs_no_card
        claim_type: boundary_edge
        grounds:
          - calculations.account_credit_balance
          - validations[priority=90]
          - errors[ERR_PAYMENT_METHOD_REQUIRED]
          - endpoints[POST /registrar/accounts/{account_id}/credits]
        distinguishing_aspect: "The payment-method gate fires only when the cash remainder is strictly positive: 1298 cents of credit against a 1298-cent invoice leaves a remainder of exactly 0, so an account with no card pays successfully and writes only a CREDIT_APPLIED entry."
        test_recipe:
          setup: ["Account with NO card and exactly 1298 cents of granted store credit; an ISSUED example.com registration invoice for 1298 cents."]
          setup_api_calls:
            - call: "POST /registrar/accounts"
              payload: { email: "zero@corp.example", company_name: "Corp Example" }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /registrar/accounts/${acct_id}/credits"
              payload: { amount_cents: 1298, reason: "exact goodwill credit" }
              as: BillingAdmin
            - call: "POST /registrar/domains"
              payload: { account_id: "${acct_id}", domain_name: "example", tld: "com", term_years: 1, registrant_name: "Ada L", registrant_email: "ada@corp.example", auto_renew: false }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { dom_id: $.data.id }
            - call: "GET /registrar/invoices"
              payload: { account_id: "${acct_id}", status: "ISSUED" }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { inv_id: "$.data[0].id" }
          trigger:
            - call: "POST /registrar/invoices/${inv_id}/pay"
              payload: { use_credit: true }
              as: Registrant
              as_user_id: "${acct_id}"
            - call: "GET /registrar/accounts/${acct_id}/ledger-entries"
              payload: {}
              as: BillingAdmin
          assert:
            - "HTTP status == 200 (no ERR_PAYMENT_METHOD_REQUIRED — the cash remainder is exactly 0)"
            - "Invoice.${inv_id}.status == 'PAID' and amount_paid_cents == 1298"
            - "Account.${acct_id}.credit_balance_cents == 0 and net_cash_cents == 0"
            - "the ledger holds exactly 2 entries: CREDIT_GRANT +1298 and CREDIT_APPLIED -1298; no PAYMENT entry exists"
            - "Domain.${dom_id}.lifecycle_status == 'ACTIVE'"

  # =========================================================================
  # Validations
  # =========================================================================
  - section: validations
    instances:
      - name: missing_role_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with no X-User-Role header returns 401 ERR_UNAUTHENTICATED before any existence or state check runs."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /registrar/domains/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Registrant
              captures: { err: $.data.error_id }
          assert:
            - "with the X-User-Role and X-User-ID headers omitted: HTTP status == 401 and error_id == 'ERR_UNAUTHENTICATED' (NOT 404, even though the domain id does not exist)"

      - name: registrant_cannot_read_another_accounts_domain
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - roles[Registrant]
        distinguishing_aspect: "Registrant identity is entity_backed:Account, so acting on a Domain whose account_id differs from X-User-ID returns 403 ERR_NOT_RESOURCE_OWNER."
        test_recipe:
          setup: ["Account A owning a PENDING_PAYMENT example.com domain; unrelated Account B."]
          setup_api_calls:
            - call: "POST /registrar/accounts"
              payload: { email: "a@corp.example", company_name: "A Corp" }
              as: Anonymous
              captures: { acct_a: $.data.id }
            - call: "POST /registrar/accounts"
              payload: { email: "b@corp.example", company_name: "B Corp" }
              as: Anonymous
              captures: { acct_b: $.data.id }
            - call: "POST /registrar/domains"
              payload: { account_id: "${acct_a}", domain_name: "example", tld: "com", term_years: 1, registrant_name: "Ada L", registrant_email: "a@corp.example" }
              as: Registrant
              as_user_id: "${acct_a}"
              captures: { dom_id: $.data.id }
          trigger:
            - call: "GET /registrar/domains/${dom_id}"
              payload: {}
              as: Registrant
              as_user_id: "${acct_b}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403 and error_id == 'ERR_NOT_RESOURCE_OWNER'"

