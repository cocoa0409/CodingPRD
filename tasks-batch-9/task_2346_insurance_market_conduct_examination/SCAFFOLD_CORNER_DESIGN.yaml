  - section: errors
    instances:

      - name: err_unauthenticated_is_the_outermost_gate
        claim_type: error_triggerable
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations[priority 10 ERR_UNAUTHENTICATED]
        distinguishing_aspect: |
          401 is the only code that can be produced with no database state whatsoever, and it is produced
          identically for an absent header and for a syntactically invalid one. It also outranks every
          other refusal, so a request that is simultaneously unauthenticated and malformed answers 401 and
          never 422.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /market-conduct/examinations"
              as: SupervisingExaminer
              captures: { e1: "$.data.error_id" }
            - call: "POST /market-conduct/insurers"
              payload: { name: "Aurora Mutual Insurance Company", naic_code: "10001", annual_premium_written_cents: 1200000000, policy_count_in_force: 40000, confirmed_complaints_12mo: 120, financial_stress_score: 60, consumer_trend_score: 50 }
              as: MarketAnalyst
              as_user_id: "12345"
              captures: { e2: "$.data.message" }
            - call: "GET /market-conduct/insurers"
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
          assert:
            - "Both attempts return 401 with error_id == ERR_UNAUTHENTICATED"
            - "The envelope still carries meta.api_request_id and meta.api_request_timestamp on the error response"
            - "data.message is present and non-empty"
            - "GET /market-conduct/insurers with a valid header reports total_count == 0 - the malformed-header POST wrote nothing"

      - name: err_role_not_permitted_on_an_endpoint_outside_the_role_grant
        claim_type: error_triggerable
        grounds:
          - errors.ERR_ROLE_NOT_PERMITTED
          - validations[priority 11 ERR_ROLE_NOT_PERMITTED]
          - roles
        distinguishing_aspect: |
          Every endpoint enumerates its roles, so the refusal is a function of the endpoint rather than of
          the record: an authenticated carrier respondent is refused on carrier creation, an examiner in
          charge is refused on scope locking, and a market analyst is refused on criticism issuance. The
          refusal precedes both existence and shape checks, so a well-formed body aimed at a real record
          is still refused.
        test_recipe:
          setup:
            - "One carrier and one examination so the targets exist."
          setup_api_calls:
            - call: "POST /market-conduct/insurers"
              payload: { name: "Aurora Mutual Insurance Company", naic_code: "10001", annual_premium_written_cents: 1200000000, policy_count_in_force: 40000, confirmed_complaints_12mo: 120, financial_stress_score: 60, consumer_trend_score: 50 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { aurora_id: "$.data.id" }
            - call: "POST /market-conduct/examinations"
              payload: { insurer_id: "${aurora_id}", exam_type: "MARKET_CONDUCT_EXAM", mode: "ON_SITE", lead_state_code: "NV", fieldwork_start_date: "2026-09-01", fieldwork_end_date: "2026-11-30" }
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
              captures: { exam_id: "$.data.id" }
          trigger:
            - call: "POST /market-conduct/insurers"
              payload: { name: "Self Registered Insurance Company", naic_code: "10002", annual_premium_written_cents: 1000, policy_count_in_force: 10, confirmed_complaints_12mo: 0, financial_stress_score: 1, consumer_trend_score: 1 }
              as: InsurerRespondent
              as_user_id: "${aurora_id}"
              captures: { e1: "$.data.error_id" }
            - call: "POST /market-conduct/examinations/${exam_id}/lock-scope"
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
              captures: { e2: "$.data.error_id" }
            - call: "POST /market-conduct/analysis-cycles/aaaaaaaa-0000-0000-0000-0000000000ff/score"
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
              captures: { e3: "$.data.error_id" }
            - call: "GET /market-conduct/insurers/${aurora_id}/analysis-scores"
              as: MultistateCoordinator
              as_user_id: "55555555-5555-5555-5555-555555555555"
              captures: { e4: "$.data.error_id" }
          assert:
            - "All four return 403 with error_id == ERR_ROLE_NOT_PERMITTED"
            - "The examiner-in-charge refusal on lock-scope proves the grant is per endpoint and not per aggregate - the same role owns scope-area creation on the same examination"
            - "The scoring refusal outranks the fact that the cycle identifier does not exist"
            - "The read refusal shows the role gate applies to GET endpoints as well"
            - "Nothing was created: Insurer count is still 1 and the examination is still SCOPING"

      - name: err_not_exam_subject_for_a_foreign_carrier
        claim_type: error_triggerable
        grounds:
          - errors.ERR_NOT_EXAM_SUBJECT
          - validations[priority 12 ERR_NOT_EXAM_SUBJECT]
          - roles.InsurerRespondent
        distinguishing_aspect: |
          The respondent role is entity-backed, so this refusal is the one authorisation decision that
          compares the header identity with a value reachable from the target record rather than with a
          static role table. A second carrier holds the correct role for every endpoint it is refused on,
          which is what separates this code from ERR_ROLE_NOT_PERMITTED.
        test_recipe:
          setup:
            - "Two carriers, the first with an issued criticism the second has no part in."
          setup_api_calls:
            - call: "POST /market-conduct/insurers"
              payload: { name: "Aurora Mutual Insurance Company", naic_code: "10001", annual_premium_written_cents: 1200000000, policy_count_in_force: 40000, confirmed_complaints_12mo: 120, financial_stress_score: 60, consumer_trend_score: 50 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { aurora_id: "$.data.id" }
