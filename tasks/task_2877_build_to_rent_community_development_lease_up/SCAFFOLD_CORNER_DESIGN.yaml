        distinguishing_aspect: |
          The product mix is a hard per-type quota, not a hint: with a mix of one detached and one
          cottage, a second detached homesite is refused, a townhome is refused because its planned count
          is zero, and the cottage that the mix does allow is accepted — all against the same phase whose
          planned_unit_count still has room.
        test_recipe:
          setup:
