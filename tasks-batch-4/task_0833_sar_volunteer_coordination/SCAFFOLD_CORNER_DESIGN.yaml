      - name: finalize_aar_when_incident_not_closed_returns_error
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=7]
          - errors[ERR_INCIDENT_NOT_CLOSED]
          - state_machines.AfterActionReport.DRAFT_to_FINALIZED
        distinguishing_aspect: "Finalizing an AAR while its Incident is not CLOSED -> ERR_INCIDENT_NOT_CLOSED."
        test_recipe:
          setup: ["A DRAFT AAR on an ACTIVE incident."]
          setup_api_calls:
            - call: "POST /sar/incidents"
