  - rule_id: cross_entity_state_dependency
    instances:
      - name: policy_creation_requires_eligible_project_and_rejects_every_other_project_state
        grounds:
          - validations[priority=65].ERR_INVALID_PROJECT_STATE
          - state_machines.ConstructionProject.SUBMITTED_to_ELIGIBLE
          - state_machines.ConstructionProject.SUBMITTED_to_INELIGIBLE
          - state_machines.ConstructionProject.ELIGIBLE_to_UNDER_CONSTRUCTION
        distinguishing_aspect: |
          Entity pair (BuildersRiskPolicy, ConstructionProject): the write target is a
          BuildersRiskPolicy but the gating state lives on its parent project, and the project is
          walked through all four of its non-initial states around one endpoint. The same
          POST /builders-risk/policies body is rejected while the project is SUBMITTED, accepted
          once it is ELIGIBLE, rejected again once inception has moved it to UNDER_CONSTRUCTION,
          and rejected on a separate INELIGIBLE project - so the check is "== ELIGIBLE", not
          "!= SUBMITTED".
        test_recipe:
          setup:
            - "One project submitted but not yet screened (SUBMITTED), with its version captured."
            - "One separate project screened with engineering_grade D so it lands in INELIGIBLE."
            - "Logical clock advanced to 2026-09-01T00:00:00Z as part of putting the reference policy in force."
            - "The coverage schedule also carries a MATERIALS_ON_SITE part of 1000000000, which the DRAFT -> QUOTED transition requires; it contributes to no asserted figure here."
          setup_api_calls:
            - call: "POST /builders-risk/projects"
              payload: { name: "Harborline Logistics Center", site_address: "410 Dock Rd, Newport", construction_type: "NON_COMBUSTIBLE", project_kind: "NEW_CONSTRUCTION", hard_cost_value_cents: 2000000000, cat_zone: "WIND_TIER_2", planned_start_date: "2026-09-01T00:00:00Z", projected_completion_date: "2027-06-01T00:00:00Z" }
