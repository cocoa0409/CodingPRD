  - rule_id: priority_pair_validation_conflict
    instances:

      - name: qp_release_terminal_quality_state_outranks_open_critical_deviation
        grounds:
          - validations[priority=45]
          - validations[priority=68]
          - validations[priority=70]
          - state_machines.BatchOrder.quality_status.QP_REVIEW_to_RELEASED
          - state_machines.Deviation.status.OPEN_to_UNDER_INVESTIGATION
          - state_machines.ClientProject.status.ACTIVE_to_ON_HOLD
          - calculations.qp_release_fee_cents
        distinguishing_aspect: |
          Two rules are violated by the same second qp-release call: the state rule at priority 45
          (quality_status is RELEASED, a terminal state that is not a declared `from:` of any
          qp-release transition) and the business_safety rule at priority 68 (an open CRITICAL
          Deviation exists). The response must be ERR_BATCH_QUALITY_STATE_INVALID (409), never
          ERR_OPEN_CRITICAL_DEVIATION — and priority 70 must not fire either, since the signing
          X-User-ID qp-001 differs from reviewer_user_id qa-001. It also pins the subtle
          precondition asymmetry that classifying a CRITICAL deviation does NOT quarantine an
          already-RELEASED batch (RELEASED is excluded), even though it does put the project ON_HOLD.
