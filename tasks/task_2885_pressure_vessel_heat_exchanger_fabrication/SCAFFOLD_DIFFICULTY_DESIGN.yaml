  - rule_id: non_linear_state_machine
    instances:

      - name: non_linear_design_calculation_reject_revise_resubmit_cycle
        grounds:
          - state_machines.DesignCalculation.SUBMITTED_to_REJECTED
          - state_machines.DesignCalculation.REJECTED_to_DRAFT
          - state_machines.DesignCalculation.DRAFT_to_SUBMITTED
          - state_machines.DesignCalculation.SUBMITTED_to_APPROVED
          - state_machines.VesselJob.DESIGN_REVIEW_to_DRAFT
          - calculations.joint_efficiency_resolution
          - validations[priority=50]
          - validations[priority=60]
        distinguishing_aspect: |
          The DesignCalculation dimension is a true cycle: DRAFT -> SUBMITTED -> REJECTED -> DRAFT ->
          SUBMITTED -> APPROVED, and the loop is re-entered only through /revise, never through a
          second /submit — a REJECTED sheet re-submitted directly is refused with
          ERR_INVALID_CALCULATION_STATE, and each lap drags the parent VesselJob backwards from
          DESIGN_REVIEW to DRAFT while incrementing revision.
        test_recipe:
          setup:
            - "Two DesignEngineer Personnel rows exist (preparer Dana Reyes, reviewer Efrain Cole)."
            - "An ACTIVE certificate CA-U-8801 and a PRESSURE_VESSEL VesselJob J-2885-05 (mawp_psi 350, inside_radius_in 30, mdmt_f -20, stress_ratio 1.00, DIV1)."
            - "Sheet SHELL revision 1 (rt_extent_declared FULL, allowable_stress_psi 20000, corrosion_allowance_in 0.0625, thickness_nominal_in 1.0000) has been SUBMITTED and then REJECTED by the reviewer, so the sheet is REJECTED and the job has fallen back to DRAFT."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "Dana Reyes", role_code: "DESIGN_ENGINEER", stamp_initials: "DR" }
              as: ShopAdmin
              captures: { de1_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Efrain Cole", role_code: "DESIGN_ENGINEER", stamp_initials: "EC" }
              as: ShopAdmin
              captures: { de2_id: $.data.id }
            - call: "POST /certificates"
              payload: { cert_number: "CA-U-8801", scope_codes: ["U"], issued_on: "2026-01-01", expires_on: "2029-01-01" }
              as: ShopAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /vessel-jobs"
              payload: { certificate_id: "${cert_id}", job_number: "J-2885-05", customer_name: "Northline Energy", vessel_type: "PRESSURE_VESSEL", design_code: "DIV1", mawp_psi: 350, design_temp_f: 650, mdmt_f: -20, inside_radius_in: 30, stress_ratio: 1.00 }
              as: ShopAdmin
              captures: { job_id: $.data.id, jv1: $.data.version }
            - call: "POST /vessel-jobs/${job_id}/design-calculations"
              payload: { expected_job_version: "${jv1}", component: "SHELL", rt_extent_declared: "FULL", allowable_stress_psi: 20000, corrosion_allowance_in: 0.0625, thickness_nominal_in: 1.0000 }
              as: DesignEngineer
              as_user_id: "${de1_id}"
              captures: { c_shell_id: $.data.id }
            - call: "POST /design-calculations/${c_shell_id}/submit"
              payload: {}
              as: DesignEngineer
              as_user_id: "${de1_id}"
            - call: "POST /design-calculations/${c_shell_id}/reject"
              payload: { reject_reason: "Radiography extent claimed as FULL is not supported by the shop's examination plan for this seam." }
              as: DesignEngineer
              as_user_id: "${de2_id}"
          trigger:
            - call: "POST /design-calculations/${c_shell_id}/submit"
              payload: {}
              as: DesignEngineer
              as_user_id: "${de1_id}"
              captures: { err_resubmit: $.data.error_id }
            - call: "POST /design-calculations/${c_shell_id}/revise"
              payload: { rt_extent_declared: "NONE", allowable_stress_psi: 20000, corrosion_allowance_in: 0.0625, thickness_nominal_in: 1.0000 }
              as: DesignEngineer
              as_user_id: "${de1_id}"
            - call: "POST /design-calculations/${c_shell_id}/submit"
              payload: {}
              as: DesignEngineer
              as_user_id: "${de1_id}"
            - call: "POST /design-calculations/${c_shell_id}/approve"
              payload: {}
              as: DesignEngineer
              as_user_id: "${de2_id}"
          assert:
            - "The first trigger call returns HTTP 409 with data.error_id == ERR_INVALID_CALCULATION_STATE, because REJECTED -> SUBMITTED is not a declared transition"
            - "After the revise: HTTP 200, DesignCalculation.${c_shell_id}.status == DRAFT, revision == 2, reject_reason == null and reviewed_by_personnel_id == null"
            - "After the revise: DesignCalculation.${c_shell_id}.joint_efficiency == 0.70"
            - "After the revise: DesignCalculation.${c_shell_id}.thickness_circumferential_in == 0.7614 and thickness_longitudinal_in == 0.3731"
            - "After the revise: DesignCalculation.${c_shell_id}.thickness_required_in == 0.8239 and governing_variant == CIRCUMFERENTIAL"
            - "After the second submit: DesignCalculation.${c_shell_id}.status == SUBMITTED and VesselJob.${job_id}.status == DESIGN_REVIEW"
            - "After the approve: DesignCalculation.${c_shell_id}.status == APPROVED, revision is still 2 and reviewed_by_personnel_id == ${de2_id}"
            - "VesselJob.${job_id}.status == DESIGN_REVIEW after the approve, because component HEAD still has no APPROVED sheet"
            - "VesselJob.${job_id}.governing_joint_efficiency == 0.70"

      - name: non_linear_production_weld_parallel_nde_and_pwht_dimensions
