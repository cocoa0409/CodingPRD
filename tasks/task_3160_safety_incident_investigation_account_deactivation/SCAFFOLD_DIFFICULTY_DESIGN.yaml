              as: PlatformAdmin
              captures: { trip_id: $.data.id }
            - call: "POST /safety/trips/${trip_id}/complete-start"
              payload: {}
              as: Driver
              as_user_id: "${acct_id}"
            - call: "POST /safety/trips/${trip_id}/complete"
              payload: {}
              as: Driver
              as_user_id: "${acct_id}"
