            - call: "POST /poct/operators/${assr_id}/training"
              payload: { training_module_code: "POCT-GLUCO-101", completed_on: "2026-08-21" }
              as: QualityCoordinator
          trigger:
            - call: "POST /poct/competency-assessments"
              payload: { operator_id: "${subj_id}", assessor_operator_id: "${assr_id}", device_model: "GLUCO-9", assessment_type: "INITIAL", methods_demonstrated: 5, effective_date: "2026-09-01", expires_at: "2027-03-01", expected_operator_version: "${subj_v}" }
              as: QualityCoordinator
              captures: { err: $.data.error_id, msg: $.data.message }
            - call: "POST /poct/competency-assessments"
              payload: { operator_id: "${subj_id}", assessor_operator_id: "${assr_id}", device_model: "GLUCO-9", assessment_type: "INITIAL", methods_demonstrated: 6, effective_date: "2026-09-01", expires_at: "2027-03-01", expected_operator_version: "${subj_v}" }
              as: QualityCoordinator
              captures: { asmt_id: $.data.id, asmt_methods: $.data.methods_demonstrated, asmt_status: $.data.status }
          assert:
            - "the five-method call returns HTTP 422 with ${err} == \"ERR_INSUFFICIENT_COMPETENCY_METHODS\" - NOT 400/ERR_INVALID_REQUEST, because 5 is inside the declared 0..6 range"
            - "the six-method call returns HTTP 201 with ${asmt_methods} == 6 and ${asmt_status} == \"SUBMITTED\""
            - "expected_operator_version ${subj_v} was still accepted on the retry: the refused submission did not increment Operator.version"
            - "GET /poct/competency-assessments?operator_id=${subj_id} returns meta.total_count == 1"

      - name: site_oversight_suspended_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_SITE_OVERSIGHT_SUSPENDED]
          - validations[priority:42]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / access_reinstatement_blocked_by_site_posture_then_allowed_after_recoverage
          rationale: "That instance drives the 409 on POST /poct/operators/{id}/access-reinstatement and then clears it by restoring coverage."

      - name: lot_not_verified_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_LOT_NOT_VERIFIED]
          - validations[priority:44]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / qc_unlock_requires_verified_lot_on_the_confirming_run
          rationale: "The 409 is raised there on POST /poct/devices/{id}/qc-unlock through the confirming run's lot, and again on result capture in the priority-pair instance."

      - name: certificate_expired_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CERTIFICATE_EXPIRED]
          - validations[priority:57]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / expired_certificate_preempts_complexity_scope_on_device_create
          rationale: "That instance asserts the 422 is ERR_CERTIFICATE_EXPIRED on POST /poct/devices when the covering certificate has lapsed."

      - name: complexity_scope_exceeded_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_COMPLEXITY_SCOPE_EXCEEDED]
          - validations[priority:62]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / expired_certificate_excluded_from_overlap_candidates_unlocks_moderate_scope
          rationale: "The MODERATE device create is refused with ERR_COMPLEXITY_SCOPE_EXCEEDED under WAIVED coverage there before the replacement window is added."

      - name: coverage_window_overlap_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_COVERAGE_WINDOW_OVERLAP]
          - validations[priority:67]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / coverage_window_touching_endpoint_collides_then_next_day_is_accepted
          rationale: "The 409 is raised there on the touching endpoint and cleared by shifting the start one day."

      - name: assessment_window_overlap_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_ASSESSMENT_WINDOW_OVERLAP]
          - validations[priority:68]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / competency_window_touching_endpoint_allowed_then_one_day_earlier_collides
          rationale: "The half-open competency window is walked there: touching is accepted and one day earlier returns the 409."

  # ===========================================================================
  # Section 7 - RBAC (claim-extraction-guide "From Table 7")
  # Five roles; role_model == segregation_of_duties, so the extra claims are the
  # three same-user prohibitions in validation priority 65.
  # ===========================================================================
  - section: rbac
    instances:

      - name: exclusive_operations_are_denied_to_every_other_role
        claim_type: role_cannot_perform_others_exclusive
        grounds:
          - rbac.ProgramAdmin.exclusive_operations
          - rbac.Surveyor.exclusive_operations
          - rbac.Operator.exclusive_operations
          - rbac.LabDirector.exclusive_operations
          - errors[ERR_UNAUTHORIZED]
          - validations[priority:2]
        distinguishing_aspect: |
          Each of the four roles that own exclusive operations is probed with a
          different role's exclusive route, and the 403 arrives BEFORE any
          existence or state check - the investigation-decision probe uses an id
          that does not exist at all and still returns 403 rather than 404,
          because priority 2 precedes priority 14.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T08:00:00Z; one site and one certificate exist."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243049", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "GI Clinic POCT", department_code: "DEPT-4500", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Nils Bergqvist", role_title: "MEDICAL_TECHNOLOGIST", hire_date: "2026-01-05" }
              as: ProgramAdmin
              captures: { op_id: $.data.id }
            - call: "POST /poct/operators/${op_id}/training"
              payload: { training_module_code: "POCT-GLUCO-101", completed_on: "2026-08-20" }
              as: QualityCoordinator
          trigger:
            - call: "POST /poct/sites"
              payload: { name: "Surveyor's Own Site", department_code: "DEPT-4599", complexity_scope: "WAIVED" }
              as: Surveyor
              captures: { e_admin: $.data.error_id, m_admin: $.data.message }
            - call: "POST /poct/inspections"
              payload: { site_id: "${site_id}", inspection_type: "ROUTINE_SURVEY", scheduled_date: "2026-09-01" }
              as: QualityCoordinator
              captures: { e_surveyor: $.data.error_id, m_surveyor: $.data.message }
            - call: "POST /poct/test-results"
              payload: { device_id: "6f1d0c2b-0000-4000-8000-0000000000a1", operator_id: "${op_id}", reagent_lot_id: "6f1d0c2b-0000-4000-8000-0000000000a2", patient_mrn: "MRN-9001", analyte: "GLUCOSE", measured_value: 100.0, entry_mode: "INTERFACED" }
              as: QualityCoordinator
              captures: { e_operator: $.data.error_id, m_operator: $.data.message }
            - call: "POST /poct/pt-events/6f1d0c2b-0000-4000-8000-0000000000a3/investigation-decision"
              payload: { decision: "ACCEPT", note: "looks fine to me" }
              as: QualityCoordinator
              captures: { e_director: $.data.error_id, m_director: $.data.message }
            - call: "POST /poct/certificates/${cert_id}/suspend"
              payload: { reason: "director-initiated suspension" }
              as: LabDirector
              as_user_id: "${op_id}"
              captures: { e_suspend: $.data.error_id, m_suspend: $.data.message }
          assert:
            - "all five calls return HTTP 403 with error_id ERR_UNAUTHORIZED: ${e_admin}, ${e_surveyor}, ${e_operator}, ${e_director} and ${e_suspend}"
            - "the pt-events probe used a non-existent event id and still returned 403, not 404 - priority 2 precedes priority 14"
            - "no rows were created: GET /poct/inspections?site_id=${site_id} and GET /poct/test-results?device_id=6f1d0c2b-0000-4000-8000-0000000000a1 both return meta.total_count == 0"
            - "CliaCertificate.${cert_id}.status is still ACTIVE and department_code DEPT-4599 remains unused"

      - name: shared_operations_succeed_for_each_declared_role
        claim_type: role_shared_operations
        grounds:
          - rbac.ProgramAdmin.shared_operations
          - rbac.QualityCoordinator.shared_operations
          - rbac.Operator.shared_operations
        distinguishing_aspect: |
          Two genuinely multi-role routes are exercised from every role listed for
          them: training runs as ProgramAdmin AND as QualityCoordinator, and a
          temperature reading is recorded as Operator, QualityCoordinator and
          ProgramAdmin. Shared means identical semantics, not a privileged
          variant, so the resulting rows are indistinguishable except for the
          recorded_by_user_id the caller supplies.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T08:00:00Z; one site, two untrained operators and one storage unit 2.0..8.0 C."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/sites"
              payload: { name: "Ortho Clinic POCT", department_code: "DEPT-4600", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Ola Kirsch", role_title: "NURSE", hire_date: "2026-01-05" }
              as: ProgramAdmin
              captures: { op_1: $.data.id }
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Pia Halvorsen", role_title: "NURSE", hire_date: "2026-01-06" }
              as: ProgramAdmin
              captures: { op_2: $.data.id }
            - call: "POST /poct/storage-units"
              payload: { site_id: "${site_id}", name: "Reagent Fridge 1", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: ProgramAdmin
              captures: { su_id: $.data.id }
          trigger:
            - call: "POST /poct/operators/${op_1}/training"
              payload: { training_module_code: "POCT-GLUCO-101", completed_on: "2026-08-20" }
              as: ProgramAdmin
              captures: { t1_comp: $.data.competency_status, t1_access: $.data.access_status }
            - call: "POST /poct/operators/${op_2}/training"
              payload: { training_module_code: "POCT-GLUCO-101", completed_on: "2026-08-21" }
              as: QualityCoordinator
              captures: { t2_comp: $.data.competency_status, t2_access: $.data.access_status }
            - call: "POST /poct/storage-units/${su_id}/temperature-readings"
              payload: { reading_c: 4.0, recorded_at: "2026-09-01T09:00:00Z", recorded_by_user_id: "${op_1}" }
              as: Operator
              as_user_id: "${op_1}"
              captures: { r1_disp: $.data.disposition, r1_by: $.data.recorded_by_user_id }
            - call: "POST /poct/storage-units/${su_id}/temperature-readings"
              payload: { reading_c: 4.5, recorded_at: "2026-09-01T13:00:00Z", recorded_by_user_id: "user-qc" }
              as: QualityCoordinator
              captures: { r2_disp: $.data.disposition, r2_by: $.data.recorded_by_user_id }
            - call: "POST /poct/storage-units/${su_id}/temperature-readings"
              payload: { reading_c: 5.0, recorded_at: "2026-09-01T17:00:00Z", recorded_by_user_id: "user-admin" }
              as: ProgramAdmin
              captures: { r3_disp: $.data.disposition, r3_by: $.data.recorded_by_user_id }
            - call: "GET /poct/storage-units/${su_id}/temperature-readings"
              as: Surveyor
              captures: { reading_total: $.meta.total_count }
            - call: "GET /poct/storage-units/${su_id}"
              as: Surveyor
              captures: { su_state: $.data.excursion_state, su_last: $.data.last_reading_c }
          assert:
            - "both training calls return HTTP 200: ${t1_comp} == ${t2_comp} == \"PROVISIONAL\" and ${t1_access} == ${t2_access} == \"ACTIVE\""
            - "all three readings return HTTP 201 with ${r1_disp} == ${r2_disp} == ${r3_disp} == \"IN_RANGE\""
            - "${r1_by} == ${op_1}, ${r2_by} == \"user-qc\" and ${r3_by} == \"user-admin\" - the row records the supplied user, not the role"
            - "${reading_total} == 3, ${su_state} == \"IN_RANGE\" and ${su_last} == 5.0 (the latest recorded_at wins)"
            - "TestSite.${site_id}.total_operator_count == 2 and .lapsed_or_locked_operator_count == 0"

      - name: issuing_surveyor_cannot_accept_the_correction_they_issued
        claim_type: segregation_of_duties
        grounds:
          - validations[priority:65]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - rbac.Surveyor.exclusive_operations
        distinguishing_aspect: |
          Both actors hold the SAME role, so this cannot be caught by the role
          check at priority 2: the discriminator is X-User-ID against the
          finding's issued_by_user_id. Clause (c) fires on the accept, the ledger
          is untouched, and a different surveyor with the identical payload
          closes the finding.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T08:00:00Z."
            - "Covered site; surveyor user-surveyor-1 opens the survey, raises one STANDARD_LEVEL finding and issues it, so open_deficiency_weight == 3.00 and issued_by_user_id == user-surveyor-1."
            - "The quality coordinator files a plan of correction, moving the finding to CORRECTION_SUBMITTED."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243050", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Vascular Clinic POCT", department_code: "DEPT-4700", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2026-12-31" }
              as: ProgramAdmin
            - call: "POST /poct/inspections"
              payload: { site_id: "${site_id}", inspection_type: "ROUTINE_SURVEY", scheduled_date: "2026-09-01" }
              as: Surveyor
              as_user_id: "user-surveyor-1"
              captures: { insp_id: $.data.id }
            - call: "POST /poct/deficiencies"
              payload: { inspection_id: "${insp_id}", category: "QUALITY_CONTROL", severity: "STANDARD_LEVEL", description: "weekly control log incomplete", correction_due_date: "2026-10-15" }
              as: Surveyor
              as_user_id: "user-surveyor-1"
              captures: { def_id: $.data.id }
            - call: "POST /poct/inspections/${insp_id}/issue"
              payload: { issued_on: "2026-09-01" }
              as: Surveyor
              as_user_id: "user-surveyor-1"
              captures: { issued_total: $.data.issued_weight_total, insp_status: $.data.status }
            - call: "GET /poct/deficiencies/${def_id}"
              as: Surveyor
              captures: { def_status_1: $.data.status, def_weight: $.data.weight, def_issuer: $.data.issued_by_user_id }
            - call: "POST /poct/deficiencies/${def_id}/correction"
              payload: { correction_narrative: "log reprinted, daily sign-off added", evidence_ref: "POC-2026-09-14" }
              as: QualityCoordinator
              captures: { def_status_2: $.data.status, def_round: $.data.correction_round }
          trigger:
            - call: "POST /poct/deficiencies/${def_id}/correction-decision"
              payload: { decision: "ACCEPT", note: "closing my own finding" }
              as: Surveyor
              as_user_id: "user-surveyor-1"
              captures: { err: $.data.error_id, msg: $.data.message }
            - call: "GET /poct/sites/${site_id}"
              as: QualityCoordinator
              captures: { weight_mid: $.data.open_deficiency_weight, posture_mid: $.data.oversight_posture }
            - call: "POST /poct/deficiencies/${def_id}/correction-decision"
              payload: { decision: "ACCEPT", note: "evidence reviewed by a second surveyor" }
              as: Surveyor
              as_user_id: "user-surveyor-2"
              captures: { def_status_3: $.data.status }
            - call: "GET /poct/inspections/${insp_id}"
              as: Surveyor
              captures: { insp_status_2: $.data.status }
            - call: "GET /poct/sites/${site_id}"
              as: QualityCoordinator
              captures: { weight_after: $.data.open_deficiency_weight, posture_after: $.data.oversight_posture, readiness_after: $.data.inspection_readiness_score }
          assert:
            - "${issued_total} == 3.00, ${insp_status} == \"DEFICIENCIES_ISSUED\", ${def_status_1} == \"OPEN\", ${def_weight} == 3.00 and ${def_issuer} == \"user-surveyor-1\""
            - "${def_status_2} == \"CORRECTION_SUBMITTED\" and ${def_round} == 1"
            - "the self-accept returns HTTP 422 with ${err} == \"ERR_SEGREGATION_OF_DUTIES\" - same role, different user id is the only thing that matters"
            - "${weight_mid} == 3.00 and ${posture_mid} == \"OPEN\" (3.00 < 6.0) - the refused accept did not touch the ledger"
            - "the second surveyor's accept returns HTTP 200 with ${def_status_3} == \"CLOSED\""
            - "${insp_status_2} == \"CLOSED\" (compound bubble-up: every finding is terminal), ${weight_after} == 0.00, ${posture_after} == \"OPEN\" and ${readiness_after} == 100.00"

      - name: lab_director_who_served_as_assessor_cannot_approve_that_assessment
        claim_type: segregation_of_duties
        grounds:
          - validations[priority:65]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - rbac.LabDirector.shared_operations
          - entities.TestSite.fields.lab_director_operator_id
        distinguishing_aspect: |
          Clause (a) is a THREE-part conjunction and this instance falsifies two
          different parts with the same error id - first the director who was also
          the assessor, then a LabDirector actor who is not the site's director at
          all - while clause (b) is falsified at submission time. A ProgramAdmin
          actor, being outside the Operator roster, satisfies the clause by
          construction and approves the same assessment.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T08:00:00Z."
            - "Covered site with three trained operators: DIR (PHYSICIAN, appointed lab director), SUBJ (NURSE) and OTHER (MIDLEVEL_PRACTITIONER, not the site's director)."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243051", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Womens Health POCT", department_code: "DEPT-4800", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2026-12-31" }
              as: ProgramAdmin
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Dr. Quinn Abernathy", role_title: "PHYSICIAN", hire_date: "2026-01-05" }
              as: ProgramAdmin
              captures: { op_dir: $.data.id }
            - call: "POST /poct/operators/${op_dir}/training"
              payload: { training_module_code: "POCT-DIRECTOR-101", completed_on: "2026-08-18" }
              as: QualityCoordinator
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Rex Sundaram", role_title: "NURSE", hire_date: "2026-01-06" }
              as: ProgramAdmin
              captures: { op_subj: $.data.id }
            - call: "POST /poct/operators/${op_subj}/training"
              payload: { training_module_code: "POCT-GLUCO-101", completed_on: "2026-08-19" }
              as: QualityCoordinator
              captures: { subj_v: $.data.version }
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Sena Okonkwo", role_title: "MIDLEVEL_PRACTITIONER", hire_date: "2026-01-07" }
              as: ProgramAdmin
              captures: { op_other: $.data.id }
            - call: "POST /poct/operators/${op_other}/training"
              payload: { training_module_code: "POCT-GLUCO-101", completed_on: "2026-08-20" }
              as: QualityCoordinator
            - call: "PATCH /poct/sites/${site_id}/director"
              payload: { lab_director_operator_id: "${op_dir}" }
              as: ProgramAdmin
              captures: { site_director: $.data.lab_director_operator_id }
          trigger:
            - call: "POST /poct/competency-assessments"
              payload: { operator_id: "${op_subj}", assessor_operator_id: "${op_subj}", device_model: "GLUCO-9", assessment_type: "INITIAL", methods_demonstrated: 6, effective_date: "2026-09-01", expires_at: "2027-03-01", expected_operator_version: "${subj_v}" }
              as: QualityCoordinator
              captures: { err_self: $.data.error_id, msg_self: $.data.message }
            - call: "POST /poct/competency-assessments"
              payload: { operator_id: "${op_subj}", assessor_operator_id: "${op_dir}", device_model: "GLUCO-9", assessment_type: "INITIAL", methods_demonstrated: 6, effective_date: "2026-09-01", expires_at: "2027-03-01", expected_operator_version: "${subj_v}" }
              as: QualityCoordinator
              captures: { asmt_id: $.data.id, asmt_status_1: $.data.status, asmt_assessor: $.data.assessor_operator_id }
            - call: "POST /poct/competency-assessments/${asmt_id}/decision"
              payload: { decision: "APPROVE", note: "I assessed and I approve" }
              as: LabDirector
              as_user_id: "${op_dir}"
              captures: { err_dir: $.data.error_id, msg_dir: $.data.message }
            - call: "POST /poct/competency-assessments/${asmt_id}/decision"
              payload: { decision: "APPROVE", note: "approving on the director's behalf" }
              as: LabDirector
              as_user_id: "${op_other}"
              captures: { err_other: $.data.error_id, msg_other: $.data.message }
            - call: "POST /poct/competency-assessments/${asmt_id}/decision"
              payload: { decision: "APPROVE", note: "program office review of the assessment file" }
              as: ProgramAdmin
              as_user_id: "user-admin"
              captures: { asmt_status_2: $.data.status, decided_by: $.data.decided_by_user_id }
            - call: "GET /poct/operators/${op_subj}"
              as: QualityCoordinator
              captures: { subj_comp: $.data.competency_status, subj_exp: $.data.competency_expires_at }
          assert:
            - "${site_director} == ${op_dir}"
            - "the self-assessment submission returns HTTP 422 with ${err_self} == \"ERR_SEGREGATION_OF_DUTIES\" (clause (b): assessor_operator_id != operator_id)"
            - "the proper submission returns HTTP 201 with ${asmt_status_1} == \"SUBMITTED\" and ${asmt_assessor} == ${op_dir} - expected_operator_version ${subj_v} was still valid because the refused submission bumped nothing"
            - "the director's own approval returns HTTP 422 with ${err_dir} == \"ERR_SEGREGATION_OF_DUTIES\" (clause (a): X-User-ID == site.lab_director_operator_id but also == assessor_operator_id)"
            - "the non-director LabDirector's approval ALSO returns HTTP 422 with ${err_other} == \"ERR_SEGREGATION_OF_DUTIES\" (clause (a): X-User-ID != site.lab_director_operator_id) - not ERR_UNAUTHORIZED, since LabDirector is a declared role for the endpoint"
            - "the ProgramAdmin approval returns HTTP 200 with ${asmt_status_2} == \"APPROVED\" and ${decided_by} == \"user-admin\""
            - "${subj_comp} == \"COMPETENT\" and ${subj_exp} == \"2027-03-01\""

  # ===========================================================================
  # Section 8 - Cross-cutting complexity layers
  # (claim-extraction-guide "From Cross-Cutting Complexity Layers")
  # Active layers: cascading_side_effects, dual_variant_calculation,
  # rate_threshold_triggers, ops_run_checkpoint, optimistic_concurrency,
  # derived_field_reconciliation. Layers NOT declared (soft_delete, idempotency,
  # bulk_operations, multi_tenancy, conditional_feature_flags,
  # pagination_with_filtering) intentionally have no instance.
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: result_correction_with_stale_expected_version_returns_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.result-correct-stale-result
          - errors[ERR_STALE_VERSION]
          - validations[priority:30]
          - endpoints[POST /poct/test-results/{id}/correct]
        distinguishing_aspect: |
          version advances on EVERY write, so the number observed at capture time
          is already stale after posting; the same expected_test_result_version
          that succeeds once fails when replayed, and on the replay both priority
          30 and priority 50 are violated (posting_status is CORRECTION_PENDING,
          not POSTED) - the 412 must win over the 409.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T08:00:00Z."
            - "Covered site, trained operator, ACTIVE device, VERIFIED lot; one INTERFACED result captured and posted, so its version has advanced from 1 to 2."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243052", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Transplant Clinic POCT", department_code: "DEPT-4900", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2026-12-31" }
              as: ProgramAdmin
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Tomas Villalba", role_title: "MEDICAL_TECHNOLOGIST", hire_date: "2026-01-05" }
              as: ProgramAdmin
              captures: { op_id: $.data.id }
            - call: "POST /poct/operators/${op_id}/training"
              payload: { training_module_code: "POCT-GLUCO-101", completed_on: "2026-08-20" }
              as: QualityCoordinator
            - call: "POST /poct/devices"
              payload: { site_id: "${site_id}", device_model: "GLUCO-9", serial_number: "SN-GL-4900", analyte: "GLUCOSE", complexity_class: "WAIVED", connectivity_mode: "INTERFACED", qc_frequency_days: 30 }
              as: ProgramAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /poct/storage-units"
              payload: { site_id: "${site_id}", name: "Reagent Fridge 1", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: ProgramAdmin
              captures: { su_id: $.data.id }
            - call: "POST /poct/reagent-lots"
              payload: { site_id: "${site_id}", storage_unit_id: "${su_id}", device_model: "GLUCO-9", lot_number: "LOT-A1", expiration_date: "2027-01-31", received_at: "2026-09-01T08:00:00Z", control_min_level_1: 80.0, control_max_level_1: 120.0, control_min_level_2: 250.0, control_max_level_2: 350.0 }
              as: QualityCoordinator
              captures: { lot_id: $.data.id }
            - call: "POST /poct/qc-runs"
              payload: { device_id: "${dev_id}", reagent_lot_id: "${lot_id}", operator_id: "${op_id}", control_level: "LEVEL_1", measured_value: 100.0 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { qc1_id: $.data.id }
            - call: "POST /poct/qc-runs"
              payload: { device_id: "${dev_id}", reagent_lot_id: "${lot_id}", operator_id: "${op_id}", control_level: "LEVEL_2", measured_value: 300.0 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { qc2_id: $.data.id }
            - call: "POST /poct/reagent-lots/${lot_id}/verify"
              payload: { level_1_qc_run_id: "${qc1_id}", level_2_qc_run_id: "${qc2_id}" }
              as: QualityCoordinator
            - call: "POST /poct/test-results"
              payload: { device_id: "${dev_id}", operator_id: "${op_id}", reagent_lot_id: "${lot_id}", patient_mrn: "MRN-5001", analyte: "GLUCOSE", measured_value: 118.0, entry_mode: "INTERFACED" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { res_id: $.data.id, v_create: $.data.version }
            - call: "POST /poct/test-results/${res_id}/post"
              payload: { attestation: "instrument transmission verified" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { v_post: $.data.version, posted_val: $.data.posted_value, status_post: $.data.posting_status }
          trigger:
            - call: "POST /poct/test-results/${res_id}/correct"
              payload: { corrected_value: 181.0, correction_reason: "transposed digits at the analyser", expected_test_result_version: "${v_create}" }
              as: LabDirector
              as_user_id: "${op_id}"
              captures: { err_stale: $.data.error_id, msg_stale: $.data.message }
            - call: "POST /poct/test-results/${res_id}/correct"
              payload: { corrected_value: 181.0, correction_reason: "transposed digits at the analyser", expected_test_result_version: "${v_post}" }
              as: LabDirector
              as_user_id: "${op_id}"
              captures: { status_corr: $.data.posting_status, v_corr: $.data.version, corr_count: $.data.correction_count, posted_still: $.data.posted_value }
            - call: "POST /poct/test-results/${res_id}/correct"
              payload: { corrected_value: 182.0, correction_reason: "second amendment attempt on a stale read", expected_test_result_version: "${v_post}" }
              as: LabDirector
              as_user_id: "${op_id}"
              captures: { err_replay: $.data.error_id, msg_replay: $.data.message }
          assert:
            - "${v_create} == 1 and ${v_post} == 2; ${status_post} == \"POSTED\" and ${posted_val} == 118.0"
            - "the first correction returns HTTP 412 with ${err_stale} == \"ERR_STALE_VERSION\" - version 1 was superseded by the post"
            - "the second correction returns HTTP 200 with ${status_corr} == \"CORRECTION_PENDING\", ${v_corr} == 3, ${corr_count} == 1 and ${posted_still} == 118.0 (the amended value is not posted until it is re-posted)"
            - "the replay returns HTTP 412 with ${err_replay} == \"ERR_STALE_VERSION\", NOT 409/ERR_INVALID_STATE - priority 30 precedes priority 50 even though posting_status is no longer POSTED"
            - "TestResult.${res_id}.correction_count is still 1 - neither 412 mutated the row"

      - name: site_operator_counters_reconcile_after_second_rejection_revokes_operator
        claim_type: derived_field_reconciliation
        grounds:
          - entities.TestSite.fields.total_operator_count
          - entities.TestSite.fields.lapsed_or_locked_operator_count
          - state_machines.Operator
          - calculations.site_inspection_readiness_score
        distinguishing_aspect: |
          Revocation removes the operator from BOTH the numerator and the
          denominator of the competency term - a DEACTIVATED operator is neither
          LAPSED nor LOCKED_OUT and is excluded from total_operator_count - so the
          readiness score must stay 100.00 rather than jump to 50.00 (1 of 2
          "bad") or to 25.00. Reconciliation is exact, not merely monotone.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T08:00:00Z."
            - "Covered site with two trained operators: SUBJ and ASSESSOR, so total_operator_count == 2 and lapsed_or_locked_operator_count == 0."
            - "One assessment is submitted and REJECTED once, leaving consecutive_rejection_count == 1."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243053", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Burn Unit POCT", department_code: "DEPT-5000", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2026-12-31" }
              as: ProgramAdmin
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Uli Marchetti", role_title: "NURSE", hire_date: "2026-01-05" }
              as: ProgramAdmin
              captures: { subj_id: $.data.id }
            - call: "POST /poct/operators/${subj_id}/training"
              payload: { training_module_code: "POCT-GLUCO-101", completed_on: "2026-08-20" }
              as: QualityCoordinator
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Vera Lindgren", role_title: "MEDICAL_TECHNOLOGIST", hire_date: "2026-01-06" }
              as: ProgramAdmin
              captures: { assr_id: $.data.id }
            - call: "POST /poct/operators/${assr_id}/training"
              payload: { training_module_code: "POCT-GLUCO-101", completed_on: "2026-08-21" }
              as: QualityCoordinator
            - call: "GET /poct/sites/${site_id}"
              as: QualityCoordinator
              captures: { total_0: $.data.total_operator_count, gap_0: $.data.lapsed_or_locked_operator_count, ready_0: $.data.inspection_readiness_score }
            - call: "GET /poct/operators/${subj_id}"
              as: QualityCoordinator
              captures: { v_1: $.data.version }
            - call: "POST /poct/competency-assessments"
              payload: { operator_id: "${subj_id}", assessor_operator_id: "${assr_id}", device_model: "GLUCO-9", assessment_type: "INITIAL", methods_demonstrated: 6, effective_date: "2026-09-01", expires_at: "2027-03-01", expected_operator_version: "${v_1}" }
              as: QualityCoordinator
              captures: { asmt_1: $.data.id }
            - call: "POST /poct/competency-assessments/${asmt_1}/decision"
              payload: { decision: "REJECT", note: "two methods repeated incorrectly" }
              as: ProgramAdmin
              as_user_id: "user-admin"
              captures: { asmt_1_status: $.data.status }
            - call: "GET /poct/operators/${subj_id}"
              as: QualityCoordinator
              captures: { v_2: $.data.version, rej_1: $.data.consecutive_rejection_count, comp_1: $.data.competency_status, acc_1: $.data.access_status }
            - call: "POST /poct/competency-assessments"
              payload: { operator_id: "${subj_id}", assessor_operator_id: "${assr_id}", device_model: "GLUCO-9", assessment_type: "INITIAL", methods_demonstrated: 6, effective_date: "2026-09-01", expires_at: "2027-03-01", expected_operator_version: "${v_2}" }
              as: QualityCoordinator
              captures: { asmt_2: $.data.id, asmt_2_status: $.data.status }
          trigger:
            - call: "POST /poct/competency-assessments/${asmt_2}/decision"
              payload: { decision: "REJECT", note: "same two methods failed again" }
              as: ProgramAdmin
              as_user_id: "user-admin"
              captures: { asmt_2_status_after: $.data.status }
            - call: "GET /poct/operators/${subj_id}"
              as: QualityCoordinator
              captures: { rej_2: $.data.consecutive_rejection_count, comp_2: $.data.competency_status, acc_2: $.data.access_status }
            - call: "GET /poct/sites/${site_id}"
              as: QualityCoordinator
              captures: { total_1: $.data.total_operator_count, gap_1: $.data.lapsed_or_locked_operator_count, locked_1: $.data.locked_out_operator_count, ready_1: $.data.inspection_readiness_score, posture_1: $.data.oversight_posture }
            - call: "GET /poct/sites/${site_id}/readiness"
              as: QualityCoordinator
              captures: { comp_pen: $.data.competency_penalty, score: $.data.score }
            - call: "GET /poct/sites/${site_id}/operators"
              as: QualityCoordinator
              captures: { roster_total: $.meta.total_count }
          assert:
            - "${total_0} == 2, ${gap_0} == 0 and ${ready_0} == 100.00 before the rejections"
            - "${asmt_1_status} == \"REJECTED\"; ${rej_1} == 1, ${comp_1} == \"PROVISIONAL\" and ${acc_1} == \"ACTIVE\" - one rejection does not revoke"
            - "${asmt_2_status} == \"SUBMITTED\" (an APPROVED-only overlap rule lets the same window be re-submitted after a rejection) and ${asmt_2_status_after} == \"REJECTED\""
            - "${rej_2} == 2, ${comp_2} == \"REVOKED\" and ${acc_2} == \"DEACTIVATED\""
            - "${total_1} == 1 (DEACTIVATED operators leave the denominator), ${gap_1} == 0 (REVOKED is not LAPSED and DEACTIVATED is not LOCKED_OUT) and ${locked_1} == 0"
            - "${comp_pen} == 0.00 and ${score} == ${ready_1} == 100.00 - NOT 50.00 or 25.00"
            - "${posture_1} == \"OPEN\": (locked_out 0 * 2) > total 1 is false"
            - "${roster_total} == 2 - the revoked operator is still listed; only the derived counters exclude them"

      - name: oversight_run_expires_lot_and_rejects_pending_results
