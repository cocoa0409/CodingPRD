      - name: corner_nutrition_constants_are_applied_per_item
        claim_type: constants_applied
        grounds:
          - calculations.menu_cycle_nutrition_adequacy.constants
        distinguishing_aspect: "KCAL_DECIMALS, PROTEIN_DECIMALS, SODIUM_DECIMALS and MEAL_SLOTS_PER_DAY must be applied at the per-item step, not to the daily sum."
        excluded_because:
          difficulty_instance: combinatorial_formula / nutrition_per_item_rounding_before_summation_meets_contract_floor_exactly
          rationale: "That instance asserts 2800 kcal from per-item rounding where sum-then-round yields 2799, which pins every one of those constants."

      - name: corner_chill_gate_threshold_edges
        claim_type: threshold
        grounds:
          - calculations.temperature_log_in_range.constants
        distinguishing_aspect: "The chill gate must be tested at limit-1, at the limit and at limit+1 on both the temperature and the elapsed-minute axis."
        excluded_because:
          difficulty_instance: boundary_precision_check / chill_intermediate_inclusive_at_exactly_120_minutes_and_80_0_degrees
          rationale: "That instance posts readings at 119, 120 and 121 minutes at exactly 80.0 F and asserts in_range true/true/false, which is the threshold claim on both axes."

      - name: corner_waste_allowance_tier_straddle
        claim_type: tiered_pricing
        grounds:
          - calculations.meal_forecast_trays.constants
        distinguishing_aspect: "The waste allowance is a tiered schedule keyed on line_trays, so the flat tier and the marginal-rate tier must be compared across the boundary."
        excluded_because:
          difficulty_instance: boundary_precision_check / waste_allowance_tier_flips_between_line_trays_500_and_501
          rationale: "That instance builds forecasts at line_trays 500 and 501 and asserts waste 8 versus 11, covering the tier boundary and the marginal rate."

      - name: corner_chiller_interval_adjacency
        claim_type: interval_merge
        grounds:
          - calculations.blast_chiller_occupancy
        distinguishing_aspect: "Chiller occupancy uses closed intervals, so two batches that merely touch at the buffered release instant still count as overlapping."
        excluded_because:
          difficulty_instance: resource_temporal_overlap / blast_chiller_closed_interval_overlaps_at_the_shared_release_instant
          rationale: "That instance places a third batch at exactly the shared release instant (rejected) and one second later (accepted), which is the adjacency claim."

      - name: corner_contract_ledger_running_total
        claim_type: aggregation
        grounds:
          - calculations.contract_liquidated_damages
          - state_machines[MealServiceRecord].transitions[OPEN -> CLOSED]
        distinguishing_aspect: "The contract ledger is a running aggregate over closed service records and must stay correct as records are added."
        excluded_because:
          difficulty_instance: transitive_cascade / service_record_close_cascades_contract_ledger_to_facility_corrective_posture
          rationale: "That instance asserts the ledger totals immediately after a close, including the floor and ceiling behaviour of the derived cents fields."

      - name: corner_ld_variants_diverge_on_identical_data
        claim_type: variant_divergence
        grounds:
          - calculations.contract_liquidated_damages.variants
        distinguishing_aspect: "INCIDENT_BASED and POPULATION_WEIGHTED must produce different raw damages on the same fixture, with a computable delta."
        excluded_because:
          difficulty_instance: dual_variant_calc / liquidated_damages_incident_based_vs_population_weighted_diverge_on_severity_multiplier
          rationale: "That instance reconciles two identical contracts under the two variants and asserts raw 2250 versus 2385 with a delta of 108 on the net figure."

      - name: corner_forecast_variant_selection
        claim_type: variant_selection
        grounds:
          - calculations.meal_forecast_trays.variants
        distinguishing_aspect: "forecast_variant chosen at creation decides whether the immutable count feed or the live roster governs the tray math."
        excluded_because:
          difficulty_instance: dual_variant_calc / forecast_count_driven_vs_roster_driven_diverge_on_stale_count_feed
          rationale: "That instance builds both variants from the same PopulationCount row against a diverged roster and asserts 22 versus 11 total trays."

  # ===========================================================================
  # From Table 4 (Validations)
  # ===========================================================================
  - section: validations
    instances:
      - name: corner_sodium_cap_violation_returns_its_own_error
        claim_type: violation_to_error
        grounds:
          - validations[priority=30]
          - errors.ERR_SODIUM_CAP_EXCEEDED
          - calculations.menu_cycle_nutrition_adequacy
        distinguishing_aspect: "A cycle that clears both the kcal floor (2800) and the protein floor (58.50) but lands at 3500 mg sodium against a 2400 mg cap returns ERR_SODIUM_CAP_EXCEEDED, not the priority-29 ERR_NUTRITION_BELOW_STANDARD."
        test_recipe:
          setup:
            - "ACTIVE contract CFS-2515-V01 with Facility FAC-V01 and a complete one-day DRAFT MenuCycle whose DINNER component carries 460.0 mg sodium per 100 g at a 500 g portion."
          setup_api_calls:
            - call: "POST /cfs/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ContractAdministrator
              as_user_id: "ca-001"
            - call: "POST /cfs/service-contracts"
              payload: { contract_code: "CFS-2515-V01", vendor_name: "Aramark Correctional Services", contracted_kcal_per_meal_day: 2800, contracted_protein_grams_per_meal_day: 55.0, contracted_sodium_mg_cap_per_meal_day: 2400, cost_ceiling_cents_per_meal_day: 320, ld_cents_per_missed_meal: 750, ld_monthly_cap_cents: 5000000, substitution_allowance_pct: 0.30 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { contract_id: $.data.id }
            - call: "POST /cfs/facilities"
              payload: { contract_id: "${contract_id}", facility_code: "FAC-V01", name: "North Unit Kitchen", sharps_authorized_count: 12 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { facility_id: $.data.id }
            - call: "POST /cfs/service-contracts/${contract_id}/activate"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-001"
            - call: "POST /cfs/menu-cycles"
              payload: { facility_id: "${facility_id}", cycle_code: "CYC-V01", cycle_length_days: 1 }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
              captures: { cycle_id: $.data.id }
            - call: "POST /cfs/menu-cycles/${cycle_id}/items"
              payload: { cycle_day: 1, meal_slot: "BREAKFAST", component_name: "Oatmeal Bake", kcal_per_100g: 421.0, protein_grams_per_100g: 20.0, sodium_mg_per_100g: 600.0, portion_grams: 50, raw_cost_cents: 95 }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
            - call: "POST /cfs/menu-cycles/${cycle_id}/items"
              payload: { cycle_day: 1, meal_slot: "LUNCH", component_name: "Turkey Casserole", kcal_per_100g: 306.0, protein_grams_per_100g: 8.0, sodium_mg_per_100g: 400.0, portion_grams: 225, raw_cost_cents: 110 }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
            - call: "POST /cfs/menu-cycles/${cycle_id}/items"
              payload: { cycle_day: 1, meal_slot: "DINNER", component_name: "Salted Bean Rice Bowl", kcal_per_100g: 380.0, protein_grams_per_100g: 6.1, sodium_mg_per_100g: 460.0, portion_grams: 500, raw_cost_cents: 110 }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
          trigger:
            - call: "POST /cfs/menu-cycles/${cycle_id}/nutrition-sign"
              payload: {}
              as: RegisteredDietitian
              as_user_id: "rd-001"
              captures: { sodium_error: $.data.error_id }
          assert:
            - "${sodium_error} == ERR_SODIUM_CAP_EXCEEDED with HTTP 422"
            - "The per-item daily figures are kcal 211 + 689 + 1900 == 2800 (meets the floor) and protein 10.00 + 18.00 + 30.50 == 58.50 (meets the floor), so priority 29 does not fire"
            - "The per-item daily sodium is 300 + 900 + 2300 == 3500 mg against a 2400 mg cap"
            - "MenuCycle.${cycle_id}.status == DRAFT with approved_sodium_mg_per_meal_day == null"

