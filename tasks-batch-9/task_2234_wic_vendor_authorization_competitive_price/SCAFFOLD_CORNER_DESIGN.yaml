      - name: mar_variant_divergence_between_provisional_and_final
        claim_type: variant_divergence
        grounds:
          - "calculations.maximum_allowable_reimbursement"
          - "endpoints[POST /price-cycles/{id}/close]"
          - "endpoints[POST /price-cycles/{id}/publish-ceilings]"
        excluded_because:
          difficulty_instance: mar_provisional_vs_final_diverges_on_milk_ceiling
          rationale: |
            The guide's `Variant Divergence`, `Variant Selection` and `Reconciliation`
            rows all target calculations.maximum_allowable_reimbursement.variants. The
            §1.8 instance runs close and publish over one dataset, shows 351 vs 366,
            checks that each variant is selected by the correct endpoint, and checks the
            PROVISIONAL row's supersession — covering all three rows at once.

      - name: adjustment_proration_rounding_order
        claim_type: precision_rounding_accumulation
        grounds:
          - "calculations.adjustment_proration"
          - "entities.ReimbursementAdjustment.fields.line_recoupments"
        excluded_because:
          difficulty_instance: adjustment_proration_rounds_per_line_then_sums
          rationale: |
            The guide's `waterfall_allocation` and `Precision` rows ask that the rounding
            order and the non-redistributed remainder be pinned. The §1.8 instance already
            contrasts per-line round_half_up summing to 6 against rounding the 1007-cent
            total once to 5, on the same claim that also pins the E05 boundary.

      - name: cmp_threshold_and_constant_application
        claim_type: threshold_boundary
        grounds:
          - "calculations.civil_money_penalty"
          - "entities.SanctionCase.fields.effective_tier"
        excluded_because:
          difficulty_instance: cmp_effective_tier_escalation_order_pinned
          rationale: |
            The guide's `threshold` row (value at threshold-1, at threshold, at
            threshold+1) applies to calculations.civil_money_penalty's
            ESCALATION_THRESHOLDS [4, 8]. The §1.8 instance walks the escalation ladder
            across cumulative points 0/2/4/8 and pins the single-pass evaluation order
            plus the CMP_CAP_CENTS clamp, which subsumes a plain boundary triple.

