# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Residential Property Management — Expert
# Breadth probe over §1.1-§1.7: entity CRUD / required-fields / computed /
# defaults, state-machine invalid-from + terminal lockdown, RBAC denial, FK
# integrity, not-found, response envelope / pagination, OCC stale-version,
# computed-field correctness, and every error not already exercised by §1.8.
# Same seven-point contract and §1.5 gates as §1.8.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_property_returns_201_with_computed_ledger_defaults
        claim_type: Creation
        grounds: [entities.Property, endpoints.POST_/properties]
        distinguishing_aspect: "POST /properties with all required fields -> 201; trust_balance_cents=0, distributable_cents=0, unit_count=0, version=1 are server-set."
        test_recipe:
          setup: ["An Owner exists."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Own", email: "own@x.com", management_fee_pct: 0.08 }
              as: PropertyManager
              captures: { owner_id: $.data.id }
          trigger:
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", name: "Cedar", state_code: "IL", address: "9 Cedar" }
              as: PropertyManager
              captures: { prop_id: $.data.id, tb: $.data.trust_balance_cents, ver: $.data.version }
          assert:
            - "response status == 201"
            - "Property.${prop_id}.trust_balance_cents == 0"
            - "Property.${prop_id}.distributable_cents == 0"
            - "Property.${prop_id}.unit_count == 0"
            - "Property.${prop_id}.version == 1"

      - name: create_applicant_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Applicant.fields.credit_score, "validations[priority=5]"]
        distinguishing_aspect: "POST /applicants without credit_score (required, no default) -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A unit exists to apply for."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Own2", email: "own2@x.com", management_fee_pct: 0.08 }
              as: PropertyManager
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", name: "Pr", state_code: "TX", address: "Ad" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", label: "Ux", market_rent_cents: 200000 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /applicants"
              payload: { full_name: "NoScore", email: "ns@x.com", unit_id: "${unit_id}", annual_income_cents: 12000000, requested_rent_cents: 200000 }
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_applicant_credit_score_out_of_range_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Applicant.fields.credit_score, "validations[priority=5]"]
        distinguishing_aspect: "credit_score 900 violates the 300-850 range -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A unit exists."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Own3", email: "own3@x.com", management_fee_pct: 0.08 }
              as: PropertyManager
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", name: "Pr3", state_code: "TX", address: "Ad3" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", label: "Ux3", market_rent_cents: 200000 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /applicants"
              payload: { full_name: "Hi", email: "hi@x.com", unit_id: "${unit_id}", annual_income_cents: 12000000, credit_score: 900, requested_rent_cents: 200000 }
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_unit_default_occupancy_vacant_ready
        claim_type: Defaults
        grounds: [entities.Unit.fields.occupancy_status]
        distinguishing_aspect: "A newly created Unit defaults occupancy_status to VACANT_READY and active_lease_id to null."
        test_recipe:
          setup: ["A property exists."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Own4", email: "own4@x.com", management_fee_pct: 0.08 }
              as: PropertyManager
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", name: "Pr4", state_code: "TX", address: "Ad4" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /units"
              payload: { property_id: "${prop_id}", label: "Ux4", market_rent_cents: 200000 }
              as: PropertyManager
              captures: { unit_id: $.data.id, occ: $.data.occupancy_status }
          assert:
            - "Unit.${unit_id}.occupancy_status == VACANT_READY"
            - "Unit.${unit_id}.active_lease_id == null"

      - name: get_property_nonexistent_id_returns_not_found
        claim_type: Not Found
        grounds: ["endpoints.GET_/properties/{propertyId}", "validations[priority=3]"]
        distinguishing_aspect: "GET /properties/{random-uuid} for a non-existent id -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB (no properties)."]
          setup_api_calls: []
          trigger:
            - call: "GET /properties/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_property_unknown_owner_returns_fk_not_found
        claim_type: Parent Relationships
        grounds: [entities.Property.fields.owner_id, "validations[priority=4]"]
        distinguishing_aspect: "POST /properties with an owner_id that resolves to no Owner -> ERR_FK_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB (no owners)."]
          setup_api_calls: []
          trigger:
            - call: "POST /properties"
              payload: { owner_id: "11111111-1111-4111-8111-111111111111", name: "Ghost", state_code: "TX", address: "Z" }
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_FK_NOT_FOUND"

      - name: list_units_paginated_envelope_shape
        claim_type: Listing
        grounds: [endpoints.GET_/units, response_envelope.pagination_fields]
        distinguishing_aspect: "GET /units?property_id=&limit=1 returns an array envelope with total_count and has_more reflecting two units."
        test_recipe:
          setup: ["A property with two units."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Own5", email: "own5@x.com", management_fee_pct: 0.08 }
              as: PropertyManager
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", name: "Pr5", state_code: "TX", address: "Ad5" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", label: "A", market_rent_cents: 200000 }
              as: PropertyManager
            - call: "POST /units"
              payload: { property_id: "${prop_id}", label: "B", market_rent_cents: 210000 }
              as: PropertyManager
          trigger:
            - call: "GET /units?property_id=${prop_id}&limit=1&offset=0"
              payload: {}
              as: PropertyManager
          assert:
            - "response_type == array"
            - "meta.total_count == 2"
            - "meta.has_more == true"
            - "data length == 1"

      - name: system_fields_input_ignored_on_create_property
        claim_type: System Fields
        grounds: [entities.Property.fields.trust_balance_cents]
        distinguishing_aspect: "Client-supplied trust_balance_cents in POST /properties is ignored; server forces computed default 0 (extra field not in §1.5 input is rejected or ignored per ERR_INVALID_REQUEST contract)."
        test_recipe:
          setup: ["An owner exists."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Own6", email: "own6@x.com", management_fee_pct: 0.08 }
              as: PropertyManager
              captures: { owner_id: $.data.id }
          trigger:
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", name: "Pr6", state_code: "TX", address: "Ad6", reserve_floor_cents: 5000 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
          assert:
            - "Property.${prop_id}.trust_balance_cents == 0"
            - "Property.${prop_id}.reserve_floor_cents == 5000"
            - "Property.${prop_id}.distributable_cents == 0"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: screen_already_screened_applicant_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Applicant.SUBMITTED_to_SCREENED, "validations[priority=7]"]
        distinguishing_aspect: "Calling screen twice: the second screen on a SCREENED applicant -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A SCREENED applicant."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Own7", email: "own7@x.com", management_fee_pct: 0.08 }
              as: PropertyManager
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", name: "Pr7", state_code: "TX", address: "Ad7" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", label: "U7", market_rent_cents: 200000 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Dbl", email: "db@x.com", unit_id: "${unit_id}", annual_income_cents: 12000000, credit_score: 700, requested_rent_cents: 200000 }
              as: PropertyManager
              captures: { app_id: $.data.id }
            - call: "POST /applicants/${app_id}/screen"
              payload: {}
              as: PropertyManager
          trigger:
            - call: "POST /applicants/${app_id}/screen"
              payload: {}
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: sign_lease_without_approved_applicant_returns_applicant_not_approved
        claim_type: Precondition Enforcement
        grounds: [state_machines.Lease.DRAFT_to_ACTIVE, "errors[ERR_APPLICANT_NOT_APPROVED]"]
        distinguishing_aspect: "Signing a DRAFT lease whose applicant is only SCREENED (never decided) -> ERR_APPLICANT_NOT_APPROVED (409)."
        test_recipe:
          setup: ["A DRAFT lease whose applicant is SCREENED (not APPROVED) but with a HELD deposit and VACANT_READY unit."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Own8", email: "own8@x.com", management_fee_pct: 0.08 }
              as: PropertyManager
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", name: "Pr8", state_code: "TX", address: "Ad8" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", label: "U8", market_rent_cents: 200000 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "NoApprove", email: "na@x.com", unit_id: "${unit_id}", annual_income_cents: 12000000, credit_score: 700, requested_rent_cents: 200000 }
              as: PropertyManager
              captures: { app_id: $.data.id }
            - call: "POST /applicants/${app_id}/screen"
              payload: {}
              as: PropertyManager
            - call: "POST /leases"
              payload: { unit_id: "${unit_id}", applicant_id: "${app_id}", start_date: "2026-06-01", end_date: "2027-06-01", monthly_rent_cents: 200000 }
              as: PropertyManager
              captures: { lease_id: $.data.id }
            - call: "POST /security-deposits"
              payload: { lease_id: "${lease_id}", collected_cents: 200000, collected_date: "2026-06-01" }
              as: PropertyManager
          trigger:
            - call: "POST /leases/${lease_id}/sign"
              payload: {}
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_APPLICANT_NOT_APPROVED"

      - name: sign_lease_without_deposit_returns_deposit_required
        claim_type: Precondition Enforcement
        grounds: [state_machines.Lease.DRAFT_to_ACTIVE, "errors[ERR_DEPOSIT_REQUIRED]"]
        distinguishing_aspect: "Signing a DRAFT lease for an APPROVED applicant on a VACANT_READY unit with NO SecurityDeposit collected -> ERR_DEPOSIT_REQUIRED (409)."
        test_recipe:
          setup: ["DRAFT lease, APPROVED applicant, VACANT_READY unit, but no deposit collected."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Own9", email: "own9@x.com", management_fee_pct: 0.08 }
              as: PropertyManager
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", name: "Pr9", state_code: "TX", address: "Ad9" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", label: "U9", market_rent_cents: 200000 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "NoDep", email: "nd@x.com", unit_id: "${unit_id}", annual_income_cents: 12000000, credit_score: 700, requested_rent_cents: 200000 }
              as: PropertyManager
              captures: { app_id: $.data.id }
            - call: "POST /applicants/${app_id}/screen"
              payload: {}
              as: PropertyManager
            - call: "POST /applicants/${app_id}/decide"
              payload: { decision: "APPROVE" }
              as: PropertyManager
            - call: "POST /leases"
              payload: { unit_id: "${unit_id}", applicant_id: "${app_id}", start_date: "2026-06-01", end_date: "2027-06-01", monthly_rent_cents: 200000 }
              as: PropertyManager
              captures: { lease_id: $.data.id }
          trigger:
            - call: "POST /leases/${lease_id}/sign"
              payload: {}
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_DEPOSIT_REQUIRED"

      - name: expire_lease_before_end_date_returns_lease_not_ended
        claim_type: Precondition Enforcement
        grounds: [state_machines.Lease.ACTIVE_to_EXPIRED, "errors[ERR_LEASE_NOT_ENDED]"]
        distinguishing_aspect: "POST /leases/{id}/expire with as_of_date 2026-09-01 before end_date 2027-06-01 -> ERR_LEASE_NOT_ENDED (409)."
        test_recipe:
          setup: ["A signed ACTIVE lease with end_date 2027-06-01."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Own10", email: "own10@x.com", management_fee_pct: 0.08 }
              as: PropertyManager
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", name: "Pr10", state_code: "TX", address: "Ad10" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", label: "U10c", market_rent_cents: 200000 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Notend", email: "ne@x.com", unit_id: "${unit_id}", annual_income_cents: 12000000, credit_score: 700, requested_rent_cents: 200000 }
              as: PropertyManager
              captures: { app_id: $.data.id }
            - call: "POST /applicants/${app_id}/screen"
              payload: {}
              as: PropertyManager
            - call: "POST /applicants/${app_id}/decide"
              payload: { decision: "APPROVE" }
              as: PropertyManager
            - call: "POST /leases"
              payload: { unit_id: "${unit_id}", applicant_id: "${app_id}", start_date: "2026-06-01", end_date: "2027-06-01", monthly_rent_cents: 200000 }
              as: PropertyManager
              captures: { lease_id: $.data.id }
            - call: "POST /security-deposits"
              payload: { lease_id: "${lease_id}", collected_cents: 200000, collected_date: "2026-06-01" }
              as: PropertyManager
            - call: "POST /leases/${lease_id}/sign"
              payload: {}
              as: PropertyManager
          trigger:
            - call: "POST /leases/${lease_id}/expire"
              payload: { as_of_date: "2026-09-01" }
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_LEASE_NOT_ENDED"

      - name: enforce_eviction_still_in_cure_window_via_file_returns_cure_window_open
        claim_type: Precondition Enforcement
        grounds: [state_machines.EvictionCase.NOTICE_SERVED_to_FILED, "errors[ERR_CURE_WINDOW_OPEN]"]
        distinguishing_aspect: "Filing an eviction (FL HOLDOVER, 15-day cure, notice 2026-06-10 -> deadline 2026-06-25) with as_of_date 2026-06-20 (still inside window) -> ERR_CURE_WINDOW_OPEN (409)."
        test_recipe:
          setup: ["FL signed ACTIVE lease with a HOLDOVER eviction served 2026-06-10 (cure_deadline 2026-06-25)."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Own11", email: "own11@x.com", management_fee_pct: 0.08 }
              as: PropertyManager
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", name: "Pr11", state_code: "FL", address: "Ad11" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", label: "U11c", market_rent_cents: 200000 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Hold", email: "ho@x.com", unit_id: "${unit_id}", annual_income_cents: 12000000, credit_score: 700, requested_rent_cents: 200000 }
              as: PropertyManager
              captures: { app_id: $.data.id }
            - call: "POST /applicants/${app_id}/screen"
              payload: {}
              as: PropertyManager
            - call: "POST /applicants/${app_id}/decide"
              payload: { decision: "APPROVE" }
              as: PropertyManager
            - call: "POST /leases"
              payload: { unit_id: "${unit_id}", applicant_id: "${app_id}", start_date: "2026-06-01", end_date: "2027-06-01", monthly_rent_cents: 200000 }
              as: PropertyManager
              captures: { lease_id: $.data.id }
            - call: "POST /security-deposits"
              payload: { lease_id: "${lease_id}", collected_cents: 200000, collected_date: "2026-06-01" }
              as: PropertyManager
            - call: "POST /leases/${lease_id}/sign"
              payload: {}
              as: PropertyManager
            - call: "POST /evictions"
              payload: { lease_id: "${lease_id}", reason: "HOLDOVER", notice_date: "2026-06-10" }
              as: PropertyManager
              captures: { evic_id: $.data.id }
          trigger:
            - call: "POST /evictions/${evic_id}/file"
              payload: { as_of_date: "2026-06-20" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "EvictionCase.${evic_id}.cure_deadline_date == 2026-06-25"
            - "response status == 409"
            - "data.error_id == ERR_CURE_WINDOW_OPEN"

      - name: cure_eviction_after_deadline_returns_cure_window_closed
        claim_type: Precondition Enforcement
        grounds: [state_machines.EvictionCase.NOTICE_SERVED_to_CURED, "errors[ERR_CURE_WINDOW_CLOSED]"]
        distinguishing_aspect: "Curing a TX NONPAYMENT eviction (3-day cure, notice 2026-06-10 -> deadline 2026-06-13) with as_of_date 2026-06-20 (past deadline) -> ERR_CURE_WINDOW_CLOSED (409)."
        test_recipe:
          setup: ["TX signed ACTIVE lease; NONPAYMENT eviction served 2026-06-10 (deadline 2026-06-13); arrears cleared so only the window check fails."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Own12", email: "own12@x.com", management_fee_pct: 0.08 }
              as: PropertyManager
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", name: "Pr12", state_code: "TX", address: "Ad12" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", label: "U12c", market_rent_cents: 200000 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Cured", email: "cu@x.com", unit_id: "${unit_id}", annual_income_cents: 12000000, credit_score: 700, requested_rent_cents: 200000 }
              as: PropertyManager
              captures: { app_id: $.data.id }
            - call: "POST /applicants/${app_id}/screen"
              payload: {}
              as: PropertyManager
            - call: "POST /applicants/${app_id}/decide"
              payload: { decision: "APPROVE" }
              as: PropertyManager
            - call: "POST /leases"
              payload: { unit_id: "${unit_id}", applicant_id: "${app_id}", start_date: "2026-06-01", end_date: "2027-06-01", monthly_rent_cents: 200000 }
              as: PropertyManager
              captures: { lease_id: $.data.id }
            - call: "POST /security-deposits"
              payload: { lease_id: "${lease_id}", collected_cents: 200000, collected_date: "2026-06-01" }
              as: PropertyManager
            - call: "POST /leases/${lease_id}/sign"
              payload: {}
              as: PropertyManager
            - call: "POST /evictions"
              payload: { lease_id: "${lease_id}", reason: "NONPAYMENT", notice_date: "2026-06-10" }
              as: PropertyManager
              captures: { evic_id: $.data.id }
          trigger:
            - call: "POST /evictions/${evic_id}/cure"
              payload: { as_of_date: "2026-06-20" }
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "EvictionCase.${evic_id}.cure_deadline_date == 2026-06-13"
            - "response status == 409"
            - "data.error_id == ERR_CURE_WINDOW_CLOSED"

      - name: cure_nonpayment_eviction_with_arrears_returns_arrears_not_cleared
        claim_type: Precondition Enforcement
        grounds: [state_machines.EvictionCase.NOTICE_SERVED_to_CURED, "errors[ERR_ARREARS_NOT_CLEARED]"]
        distinguishing_aspect: "Curing a NONPAYMENT eviction within the window while lease balance_due_cents > 0 -> ERR_ARREARS_NOT_CLEARED (409)."
        test_recipe:
          setup: ["NY signed ACTIVE lease with an unpaid 250000 RENT charge; NONPAYMENT eviction served 2026-06-10 (deadline 2026-06-24); cure as_of 2026-06-15 within window but arrears outstanding."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Own13", email: "own13@x.com", management_fee_pct: 0.08 }
              as: PropertyManager
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
