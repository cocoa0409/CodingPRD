        claim_type: violation_to_error
        grounds: ["validations[priority=37]", "errors[ERR_PAYMENT_AMOUNT_MISMATCH]"]
        distinguishing_aspect: "Exact-amount payment: paying 18000 against outstanding 18500 on an ISSUED (payable) invoice isolates the fiscal rule — no state error masks it."
        test_recipe:
          setup: ["rate schedule 2026; beneficiary DOB 1961-04-12; PART_B effective 2026-06; cycle 2026-06-15 issues invoice (18500, fallback amount: no determination exists)"]
