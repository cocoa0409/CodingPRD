  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_finalize
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - state_machines.IncidentCase.RECORDABLE_to_FINALIZED
        distinguishing_aspect: |
          Pair (state vs business_safety): finalize on a PENDING_REVIEW case
          with is_severe_event == INPATIENT_HOSPITALIZATION and no
          SevereInjuryReport violates BOTH the state precondition (priority 4,
          ERR_INVALID_STATE) and the severe-report safety check (priority 5,
          ERR_SEVERE_REPORT_REQUIRED). Priority 4 MUST win.
        test_recipe:
          setup:
            - "Company C, Establishment E, Employee W"
            - "Case K created with is_severe_event == INPATIENT_HOSPITALIZATION; never classified (PENDING_REVIEW)"
            - "No SevereInjuryReport filed for K"
          setup_api_calls:
            - call: "POST /safety/companies"
              payload: { legal_name: "Iota Co", fein: "55-3334445" }
              as: PlatformAdmin
              captures: { co_id: $.data.id }
            - call: "POST /safety/establishments"
              payload: { company_id: "${co_id}", site_name: "Yard 8", naics_code: "237310", state_code: "FL", size_class: "SMALL" }
              as: PlatformAdmin
              captures: { est_id: $.data.id }
            - call: "POST /safety/employees"
              payload: { company_id: "${co_id}", full_name: "Worker Eight", job_title: "Laborer", hire_date: "2025-01-05" }
              as: RecordkeepingCoordinator
              captures: { emp_id: $.data.id }
            - call: "POST /safety/cases"
              payload: { establishment_id: "${est_id}", employee_id: "${emp_id}", occurred_at: "2026-07-28T10:00:00Z", description: "Hospitalized overnight", body_part: "head", event_type: "INJURY", is_severe_event: "INPATIENT_HOSPITALIZATION" }
              as: SafetyOfficer
              captures: { case_id: $.data.id, case_v: $.data.version }
          trigger:
            - call: "POST /safety/cases/${case_id}/finalize"
              payload: { expected_case_version: "${case_v}" }
              as: SafetyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (priority 4 state beats priority 5 business_safety)"
            - "case status remains PENDING_REVIEW; no side effects fired"

      - name: business_temporal_vs_business_constraint_on_classify
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - state_machines.IncidentCase.PENDING_REVIEW_to_RECORDABLE
        distinguishing_aspect: |
          Pair (business_temporal vs business_constraint) — distinct from
          state-vs-safety: a reclassify-then-classify where the classify is
          past the 7-day window (temporal, priority 6) AND carries an
          unchanged classification (same-as-current constraint violation,
          ERR_INVALID_STATE-shaped business rule at lower priority) MUST return
          ERR_RECORDABILITY_WINDOW_PASSED. Concretely: classify PENDING_REVIEW
          past window with classification MEDICAL_TREATMENT while the case is
          exempt-check-clean — temporal wins over every lower business rule.
        test_recipe:
          setup:
            - "Company C, Establishment E (non-exempt), Employee W"
            - "Case K occurred 2026-08-01T08:00:00Z; clock advanced to 2026-08-10 (past deadline 2026-08-08T08:00:00Z)"
            - "K is PENDING_REVIEW"
          setup_api_calls:
            - call: "POST /safety/companies"
              payload: { legal_name: "Kappa LLC", fein: "55-6667778" }
              as: PlatformAdmin
              captures: { co_id: $.data.id }
            - call: "POST /safety/establishments"
              payload: { company_id: "${co_id}", site_name: "Terminal 2", naics_code: "488210", state_code: "WA", size_class: "STANDARD" }
              as: PlatformAdmin
              captures: { est_id: $.data.id }
            - call: "POST /safety/employees"
              payload: { company_id: "${co_id}", full_name: "Worker Nine", job_title: "Switchman", hire_date: "2023-04-01" }
              as: RecordkeepingCoordinator
              captures: { emp_id: $.data.id }
            - call: "POST /safety/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/cases"
              payload: { establishment_id: "${est_id}", employee_id: "${emp_id}", occurred_at: "2026-08-01T08:00:00Z", description: "Laceration", body_part: "leg", event_type: "INJURY" }
              as: SafetyOfficer
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /safety/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /safety/cases/${case_id}/classify"
              payload: { classification: "MEDICAL_TREATMENT", expected_case_version: "${case_v}" }
              as: SafetyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_RECORDABILITY_WINDOW_PASSED (priority 6 business_temporal beats all business_constraint checks at priority >= 8)"
            - "case status remains PENDING_REVIEW"
            - "deadline was occurred_at + 7 days == 2026-08-08T08:00:00Z; clock 2026-08-10 is past it"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: severe_report_exactly_at_24h_deadline
        grounds:
          - calculations.severe_injury_clock
          - entities.SevereInjuryReport.fields.within_clock
        distinguishing_aspect: |
          Timestamp boundary (inclusive <=): an inpatient-hospitalization
          report filed exactly 24h00m00s after occurred_at is TIMELY; one
          second later is LATE. Metric = seconds-to-deadline; endpoint =
          POST /safety/cases/{id}/severe-reports.
        test_recipe:
          setup:
            - "Company C, Establishment E, Employee W"
            - "Two cases, each is_severe_event == INPATIENT_HOSPITALIZATION, occurred 2026-08-02T08:00:00Z"
          setup_api_calls:
            - call: "POST /safety/companies"
              payload: { legal_name: "Lambda Corp", fein: "55-8889990" }
              as: PlatformAdmin
              captures: { co_id: $.data.id }
            - call: "POST /safety/establishments"
              payload: { company_id: "${co_id}", site_name: "Lab 6", naics_code: "325412", state_code: "NJ", size_class: "STANDARD" }
              as: PlatformAdmin
              captures: { est_id: $.data.id }
            - call: "POST /safety/employees"
              payload: { company_id: "${co_id}", full_name: "Worker Ten", job_title: "Tech", hire_date: "2024-08-01" }
              as: RecordkeepingCoordinator
              captures: { emp_id: $.data.id }
            - call: "POST /safety/cases"
              payload: { establishment_id: "${est_id}", employee_id: "${emp_id}", occurred_at: "2026-08-02T08:00:00Z", description: "Chemical splash hospitalized", body_part: "eyes", event_type: "POISONING", is_severe_event: "INPATIENT_HOSPITALIZATION" }
              as: SafetyOfficer
              captures: { case_id: $.data.id }
            - call: "POST /safety/cases"
              payload: { establishment_id: "${est_id}", employee_id: "${emp_id}", occurred_at: "2026-08-02T08:00:00Z", description: "Second worker hospitalized", body_part: "respiratory", event_type: "RESPIRATORY", is_severe_event: "INPATIENT_HOSPITALIZATION" }
              as: SafetyOfficer
              captures: { case_id_2: $.data.id }
          trigger:
            - call: "POST /safety/cases/${case_id}/severe-reports"
              payload: { report_kind: "INPATIENT_HOSPITALIZATION", occurred_at: "2026-08-02T08:00:00Z", reported_to_agency_at: "2026-08-03T08:00:00Z" }
              as: SafetyOfficer
              captures: { rep_ok_status: $.data.status, rep_ok_within: $.data.within_clock }
            - call: "POST /safety/cases/${case_id_2}/severe-reports"
              payload: { report_kind: "INPATIENT_HOSPITALIZATION", occurred_at: "2026-08-02T08:00:00Z", reported_to_agency_at: "2026-08-03T08:00:01Z" }
              as: SafetyOfficer
              captures: { rep_late_status: $.data.status, rep_late_within: $.data.within_clock }
          assert:
            - "report at exactly deadline: within_clock == true, status == TIMELY (inclusive <=)"
            - "report one second past: within_clock == false, status == LATE"
            - "boundary precision to the second on the severe-injury clock"

      - name: posting_window_apr30_inclusive_vs_may01
        grounds:
          - state_machines.AnnualSummary.CERTIFIED_to_POSTED
