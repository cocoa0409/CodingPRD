        excluded_because:
          difficulty_instance: run_yield_provisional_vs_final_on_same_charge
          rationale: "That §1.8 instance stamps PROVISIONAL at securement and FINAL at completion on one charge and asserts both variant outputs plus the signed variance between them, which is exactly the both-variants-and-delta claim for run_yield_split."

      - name: dual_variant_credit_quantity_both_variants_and_the_delta
