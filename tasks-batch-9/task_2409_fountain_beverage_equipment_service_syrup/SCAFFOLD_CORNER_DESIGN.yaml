            - "ServiceCall.${sc}.status == ON_SITE"
            - "ServiceCall.${sc}.reserved_part_units == 2"
            - "VanPartStock.${vp}.on_van_units == 3"
            - "VanPartStock.${vp}.reserved_units == 2"
            - "VanPartStock.${vp}.consumed_units == 0"

  # ==========================================================================
  # §1.9 / cross_cutting_complexity_layers — declared layers are
  # optimistic_concurrency, cascading_side_effects and dual_variant_calculation
  # (plus selector_policy, which the guide has no row for). Both §1.2.1
  # concurrency_rules entries get a stale-version corner and a fresh-version
  # counterpart; the cascade corners deliberately enter through triggers that
  # §1.8 does not use (compliance-hold PLACE and operator SUSPEND rather than a
  # telemetry gallon breach or a route cancel).
  # ==========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_stale_outlet_version_rejects_the_second_agreement_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.agreement-create-stale-outlet
          - errors[ERR_STALE_OUTLET_VERSION]
          - validations[priority 7]
        distinguishing_aspect: "Creating the first agreement itself bumps Outlet.version to 2, so replaying the originally read version 1 is 412 ERR_STALE_OUTLET_VERSION — and crucially the first agreement is NOT moved to EXPIRED, which is exactly the paperwork the guard protects."
        test_recipe:
          setup:
            - "One outlet read at version 1; one DRAFT agreement created with that version, which leaves the outlet at version 2."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Riverside Diner", account_code: "OUT-1001", region_code: "R-WEST" }
              as: NetworkAdmin
              captures: { o: $.data.id, ov: $.data.version }
            - call: "POST /fountain-network/placement-agreements"
              payload: { outlet_id: "${o}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2027-01-01T00:00:00Z", annual_commitment_gallons: 8000, equipment_value_cents: 480000, expected_outlet_version: "${ov}" }
              as: NetworkAdmin
              captures: { ag: $.data.id }
          trigger:
            - call: "POST /fountain-network/placement-agreements"
              payload: { outlet_id: "${o}", term_start_date: "2026-02-01T00:00:00Z", term_end_date: "2027-02-01T00:00:00Z", annual_commitment_gallons: 9000, equipment_value_cents: 500000, expected_outlet_version: "${ov}" }
              as: NetworkAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "${eid} == ERR_STALE_OUTLET_VERSION"
            - "PlacementAgreement.${ag}.status == DRAFT"
            - "PlacementAgreement.${ag}.annual_commitment_gallons == 8000"
            - "Outlet.${o}.version == 2"

      - name: occ_refreshed_outlet_version_supersedes_the_draft_agreement
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.agreement-create-stale-outlet
          - state_machines.PlacementAgreement.DRAFT_to_EXPIRED
          - endpoints[POST /fountain-network/placement-agreements]
        distinguishing_aspect: "The identical second create succeeds once the outlet is re-read at version 2: the new agreement is DRAFT, the superseded one becomes EXPIRED and the outlet lands at version 3 — the positive counterpart of the same OCC guard."
        test_recipe:
          setup:
            - "One outlet with a DRAFT agreement; the outlet version is re-read before the second create."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Riverside Diner", account_code: "OUT-1001", region_code: "R-WEST" }
              as: NetworkAdmin
              captures: { o: $.data.id, ov: $.data.version }
            - call: "POST /fountain-network/placement-agreements"
              payload: { outlet_id: "${o}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2027-01-01T00:00:00Z", annual_commitment_gallons: 8000, equipment_value_cents: 480000, expected_outlet_version: "${ov}" }
              as: NetworkAdmin
              captures: { ag: $.data.id }
            - call: "GET /fountain-network/outlets/${o}"
              as: NetworkAdmin
              captures: { ov2: $.data.version }
          trigger:
            - call: "POST /fountain-network/placement-agreements"
              payload: { outlet_id: "${o}", term_start_date: "2026-02-01T00:00:00Z", term_end_date: "2027-02-01T00:00:00Z", annual_commitment_gallons: 9000, equipment_value_cents: 500000, expected_outlet_version: "${ov2}" }
              as: NetworkAdmin
              captures: { ag2: $.data.id }
          assert:
            - "HTTP status == 201"
            - "PlacementAgreement.${ag2}.status == DRAFT"
            - "PlacementAgreement.${ag2}.annual_commitment_gallons == 9000"
            - "PlacementAgreement.${ag2}.version == 1"
            - "PlacementAgreement.${ag}.status == EXPIRED"
            - "Outlet.${o}.version == 3"

      - name: occ_stale_route_version_rejects_the_second_stop_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.stop-create-stale-route
          - errors[ERR_STALE_ROUTE_VERSION]
          - validations[priority 8]
        distinguishing_aspect: "Adding a stop bumps ReplenishmentRoute.version to 2, so a second stop submitted with the version read at route creation is 412 ERR_STALE_ROUTE_VERSION even though its window and sequence_index are both free."
        test_recipe:
          setup:
            - "PLANNED route RT-01 read at version 1 with one PENDING stop already added at sequence_index 1 (09:00-10:00)."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Riverside Diner", account_code: "OUT-1001", region_code: "R-WEST" }
              as: NetworkAdmin
              captures: { o: $.data.id }
            - call: "POST /fountain-network/replenishment-routes"
              payload: { route_code: "RT-01", depot_region_code: "R-WEST", service_date: "2026-08-03T00:00:00Z", van_code: "VAN-7", capacity_units: 60 }
              as: SupplyPlanner
              captures: { rt: $.data.id, rtv: $.data.version }
            - call: "POST /fountain-network/replenishment-routes/${rt}/stops"
              payload: { outlet_id: "${o}", sequence_index: 1, window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T10:00:00Z", expected_route_version: "${rtv}" }
              as: SupplyPlanner
              captures: { st: $.data.id }
          trigger:
            - call: "POST /fountain-network/replenishment-routes/${rt}/stops"
              payload: { outlet_id: "${o}", sequence_index: 2, window_start: "2026-08-03T11:00:00Z", window_end: "2026-08-03T12:00:00Z", expected_route_version: "${rtv}" }
              as: SupplyPlanner
              captures: { eid: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "${eid} == ERR_STALE_ROUTE_VERSION"
            - "ReplenishmentRoute.${rt}.version == 2"
            - "ReplenishmentRoute.${rt}.status == PLANNED"
            - "RouteStop.${st}.sequence_index == 1"

      - name: occ_stale_route_version_rejects_the_route_dispatch
        claim_type: optimistic_concurrency
        grounds:
          - endpoints[POST /fountain-network/replenishment-routes/{id}/dispatch]
          - validations[priority 8]
          - errors[ERR_STALE_ROUTE_VERSION]
        distinguishing_aspect: "The same occ_field guards a pure state transition: dispatching with the pre-stop version 1 is 412 and the route stays PLANNED at version 2, so the driver never sees an unfinished plan."
        test_recipe:
          setup:
            - "PLANNED route RT-01 at version 2 after one stop was added; the caller still holds version 1."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Riverside Diner", account_code: "OUT-1001", region_code: "R-WEST" }
              as: NetworkAdmin
              captures: { o: $.data.id }
            - call: "POST /fountain-network/replenishment-routes"
              payload: { route_code: "RT-01", depot_region_code: "R-WEST", service_date: "2026-08-03T00:00:00Z", van_code: "VAN-7", capacity_units: 60 }
              as: SupplyPlanner
              captures: { rt: $.data.id, rtv: $.data.version }
            - call: "POST /fountain-network/replenishment-routes/${rt}/stops"
              payload: { outlet_id: "${o}", sequence_index: 1, window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T10:00:00Z", expected_route_version: "${rtv}" }
              as: SupplyPlanner
              captures: { st: $.data.id }
          trigger:
            - call: "POST /fountain-network/replenishment-routes/${rt}/dispatch"
              payload: { expected_route_version: "${rtv}" }
              as: SupplyPlanner
              captures: { eid: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "${eid} == ERR_STALE_ROUTE_VERSION"
            - "ReplenishmentRoute.${rt}.status == PLANNED"
            - "ReplenishmentRoute.${rt}.version == 2"
            - "RouteStop.${st}.status == PENDING"

      - name: occ_route_version_increments_on_every_write_of_the_route
        claim_type: optimistic_concurrency
        grounds:
          - entities.ReplenishmentRoute.version
          - endpoints[POST /fountain-network/replenishment-routes/{id}/cancel]
          - state_machines.RouteStop.PENDING_to_SKIPPED
        distinguishing_aspect: "Four writes walk the version 1 -> 2 -> 3 -> 4 with each OCC call re-reading the value first: create, stop-add, dispatch and cancel each bump it exactly once, and the cancel additionally skips the open stop with skip_reason_code ACCESS_DENIED."
        test_recipe:
          setup:
            - "Route RT-01 created (version 1), one stop added (version 2), then dispatched with the re-read version (version 3)."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Riverside Diner", account_code: "OUT-1001", region_code: "R-WEST" }
              as: NetworkAdmin
              captures: { o: $.data.id }
            - call: "POST /fountain-network/replenishment-routes"
              payload: { route_code: "RT-01", depot_region_code: "R-WEST", service_date: "2026-08-03T00:00:00Z", van_code: "VAN-7", capacity_units: 60 }
              as: SupplyPlanner
              captures: { rt: $.data.id, rtv: $.data.version }
            - call: "POST /fountain-network/replenishment-routes/${rt}/stops"
              payload: { outlet_id: "${o}", sequence_index: 1, window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T10:00:00Z", expected_route_version: "${rtv}" }
              as: SupplyPlanner
              captures: { st: $.data.id }
            - call: "GET /fountain-network/replenishment-routes/${rt}"
              as: SupplyPlanner
              captures: { rtv2: $.data.version }
            - call: "POST /fountain-network/replenishment-routes/${rt}/dispatch"
              payload: { expected_route_version: "${rtv2}" }
              as: SupplyPlanner
            - call: "GET /fountain-network/replenishment-routes/${rt}"
              as: SupplyPlanner
              captures: { rtv3: $.data.version }
          trigger:
            - call: "POST /fountain-network/replenishment-routes/${rt}/cancel"
              payload: { expected_route_version: "${rtv3}", reason_code: "VAN_BREAKDOWN" }
              as: SupplyPlanner
          assert:
            - "HTTP status == 200"
            - "ReplenishmentRoute.${rt}.status == CANCELLED"
            - "ReplenishmentRoute.${rt}.version == 4"
            - "ReplenishmentRoute.${rt}.committed_units == 0"
            - "RouteStop.${st}.status == SKIPPED"
            - "RouteStop.${st}.skip_reason_code == ACCESS_DENIED"

      - name: cascade_compliance_hold_freezes_skips_the_stop_and_returns_the_pool
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Outlet.ACTIVE_to_ACTIVE_hold_place
          - calculations.outlet_service_posture
          - calculations.supply_pool_ledger
        distinguishing_aspect: "Entering the same three-hop cascade through compliance-hold PLACE rather than through a maintenance overdue: one hold with zero overdue tasks still forces FROZEN, skips the PENDING stop with POSTURE_FROZEN (not OUTLET_CLOSED) and returns all 4 reserved units to the national pool."
        test_recipe:
          setup:
            - "SKU case_pack_units 4, ounces_per_unit 2000, national_allocation_units 100; a 7000-ounce 7-day reading and on_hand_units 2 give requested_units 5; one allocation grants 4 units to the route's PENDING stop, so reserved_pool_units and committed_units are both 4 while overdue_task_count is 0."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Riverside Diner", account_code: "OUT-1001", region_code: "R-WEST" }
              as: NetworkAdmin
              captures: { o: $.data.id, ov: $.data.version }
            - call: "POST /fountain-network/placement-agreements"
              payload: { outlet_id: "${o}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2027-01-01T00:00:00Z", annual_commitment_gallons: 8000, equipment_value_cents: 480000, expected_outlet_version: "${ov}" }
              as: NetworkAdmin
              captures: { ag: $.data.id }
            - call: "POST /fountain-network/dispenser-units"
              payload: { outlet_id: "${o}", agreement_id: "${ag}", serial_number: "SN-9001", model_code: "FREESTYLE_9100", installed_at: "2025-11-01T00:00:00Z" }
              as: NetworkAdmin
              captures: { du: $.data.id }
            - call: "POST /fountain-network/supply-items"
              payload: { sku_code: "SKU-COLA", brand_name: "Cola Classic", supply_form: "BAG_IN_BOX", case_pack_units: 4, ounces_per_unit: 2000, national_allocation_units: 100 }
              as: NetworkAdmin
              captures: { si: $.data.id }
            - call: "POST /fountain-network/telemetry-readings"
              payload: { dispenser_unit_id: "${du}", supply_item_id: "${si}", dispensed_ounces: 7000, reading_at: "2026-07-28T00:00:00Z", window_days: 7 }
              as: SupplyPlanner
            - call: "POST /fountain-network/supply-positions"
              payload: { outlet_id: "${o}", supply_item_id: "${si}", on_hand_units: 2 }
              as: SupplyPlanner
              captures: { sp: $.data.id }
            - call: "POST /fountain-network/supply-positions/${sp}/forecast"
              payload: { variant: "TRAILING_ACTUAL", window_days: 7 }
              as: SupplyPlanner
            - call: "POST /fountain-network/replenishment-routes"
              payload: { route_code: "RT-01", depot_region_code: "R-WEST", service_date: "2026-08-03T00:00:00Z", van_code: "VAN-7", capacity_units: 60 }
              as: SupplyPlanner
              captures: { rt: $.data.id, rtv: $.data.version }
            - call: "POST /fountain-network/replenishment-routes/${rt}/stops"
              payload: { outlet_id: "${o}", sequence_index: 1, window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T10:00:00Z", expected_route_version: "${rtv}" }
              as: SupplyPlanner
              captures: { st: $.data.id }
            - call: "POST /fountain-network/route-stops/${st}/allocations"
              payload: { supply_position_ids: ["${sp}"] }
              as: SupplyPlanner
          trigger:
            - call: "POST /fountain-network/outlets/${o}/compliance-hold"
              payload: { action: "PLACE", hold_reason_code: "SANITATION_LAPSE" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "HTTP status == 200"
            - "Outlet.${o}.open_compliance_hold_count == 1"
            - "Outlet.${o}.overdue_task_count == 0"
            - "Outlet.${o}.service_posture == FROZEN"
            - "Outlet.${o}.version == 3"
            - "RouteStop.${st}.status == SKIPPED"
            - "RouteStop.${st}.skip_reason_code == POSTURE_FROZEN"
            - "OutletSupplyPosition.${sp}.allocated_units == 0"
            - "OutletSupplyPosition.${sp}.planned_route_stop_id == null"
            - "SupplyItem.${si}.reserved_pool_units == 0"
            - "ReplenishmentRoute.${rt}.committed_units == 0"

      - name: cascade_operator_suspend_skips_both_the_pending_and_the_arrived_stop
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Outlet.ACTIVE_to_SUSPENDED
          - state_machines.RouteStop.ARRIVED_to_SKIPPED
          - endpoints[POST /fountain-network/outlets/{id}/status-change]
        distinguishing_aspect: "SUSPEND sweeps PENDING and ARRIVED stops alike with skip_reason_code OUTLET_CLOSED — the wider state set that distinguishes it from the compliance-hold cascade, which only touches PENDING stops."
        test_recipe:
          setup:
            - "Route RT-01 with two stops at the same outlet (sequence 1 at 09:00-10:00, sequence 2 at 11:00-12:00), dispatched, with the driver arrived at stop 1."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Riverside Diner", account_code: "OUT-1001", region_code: "R-WEST" }
              as: NetworkAdmin
              captures: { o: $.data.id }
            - call: "POST /fountain-network/replenishment-routes"
              payload: { route_code: "RT-01", depot_region_code: "R-WEST", service_date: "2026-08-03T00:00:00Z", van_code: "VAN-7", capacity_units: 60 }
              as: SupplyPlanner
              captures: { rt: $.data.id, rtv: $.data.version }
            - call: "POST /fountain-network/replenishment-routes/${rt}/stops"
              payload: { outlet_id: "${o}", sequence_index: 1, window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T10:00:00Z", expected_route_version: "${rtv}" }
              as: SupplyPlanner
              captures: { st1: $.data.id }
            - call: "GET /fountain-network/replenishment-routes/${rt}"
              as: SupplyPlanner
              captures: { rtv2: $.data.version }
            - call: "POST /fountain-network/replenishment-routes/${rt}/stops"
              payload: { outlet_id: "${o}", sequence_index: 2, window_start: "2026-08-03T11:00:00Z", window_end: "2026-08-03T12:00:00Z", expected_route_version: "${rtv2}" }
              as: SupplyPlanner
              captures: { st2: $.data.id }
            - call: "GET /fountain-network/replenishment-routes/${rt}"
              as: SupplyPlanner
              captures: { rtv3: $.data.version }
            - call: "POST /fountain-network/replenishment-routes/${rt}/dispatch"
              payload: { expected_route_version: "${rtv3}" }
              as: SupplyPlanner
            - call: "POST /fountain-network/route-stops/${st1}/arrive"
              payload: {}
              as: RouteDriver
          trigger:
            - call: "POST /fountain-network/outlets/${o}/status-change"
              payload: { action: "SUSPEND", reason_code: "HEALTH_ORDER" }
              as: NetworkAdmin
          assert:
            - "HTTP status == 200"
            - "Outlet.${o}.status == SUSPENDED"
            - "RouteStop.${st1}.status == SKIPPED"
            - "RouteStop.${st1}.skip_reason_code == OUTLET_CLOSED"
            - "RouteStop.${st2}.status == SKIPPED"
            - "RouteStop.${st2}.skip_reason_code == OUTLET_CLOSED"
            - "ReplenishmentRoute.${rt}.status == DISPATCHED"

      - name: dual_variant_reassessment_switches_the_exposure_and_unlocks_the_recall
        claim_type: dual_variant_calculation
        grounds:
          - calculations.equipment_recall_exposure
          - validations[priority 36]
          - state_machines.PlacementAgreement.SHORTFALL_REVIEW_to_RECALL_PENDING
        distinguishing_aspect: "One unit installed 2025-11-01 is 9 whole 30-day months old at the clock, so BOOK_VALUE yields 480000 x 0.91 = 436800 (below the 450000 floor) while a re-assessment under REPLACEMENT_RISK yields 480000 x 1.045 = 501600 and the RECALL now clears — the stored exposure_variant and recall_exposure_cents are both overwritten by the second run."
        test_recipe:
          setup:
            - "ACTIVE agreement, equipment_value_cents 480000, one unit installed 2025-11-01; assessed for Q3 under BOOK_VALUE by adm-1 (exposure 436800, fee 100000), closed FEE_ONLY by co-1, then re-assessed under REPLACEMENT_RISK by adm-1."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Riverside Diner", account_code: "OUT-1001", region_code: "R-WEST" }
              as: NetworkAdmin
              captures: { o: $.data.id, ov: $.data.version }
            - call: "POST /fountain-network/placement-agreements"
              payload: { outlet_id: "${o}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2027-01-01T00:00:00Z", annual_commitment_gallons: 8000, equipment_value_cents: 480000, expected_outlet_version: "${ov}" }
              as: NetworkAdmin
              captures: { ag: $.data.id }
            - call: "POST /fountain-network/dispenser-units"
              payload: { outlet_id: "${o}", agreement_id: "${ag}", serial_number: "SN-9001", model_code: "FREESTYLE_9100", installed_at: "2025-11-01T00:00:00Z" }
              as: NetworkAdmin
              captures: { du: $.data.id }
            - call: "POST /fountain-network/placement-agreements/${ag}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /fountain-network/placement-agreements/${ag}/assess-shortfall"
              payload: { period_start_date: "2026-07-01T00:00:00Z", period_end_date: "2026-10-01T00:00:00Z", exposure_variant: "BOOK_VALUE" }
              as: NetworkAdmin
              as_user_id: "adm-1"
            - call: "POST /fountain-network/placement-agreements/${ag}/recall-decision"
              payload: { outcome: "FEE_ONLY" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /fountain-network/placement-agreements/${ag}/assess-shortfall"
              payload: { period_start_date: "2026-07-01T00:00:00Z", period_end_date: "2026-10-01T00:00:00Z", exposure_variant: "REPLACEMENT_RISK" }
              as: NetworkAdmin
              as_user_id: "adm-1"
          trigger:
            - call: "POST /fountain-network/placement-agreements/${ag}/recall-decision"
              payload: { outcome: "RECALL" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "HTTP status == 200"
            - "PlacementAgreement.${ag}.exposure_variant == REPLACEMENT_RISK"
            - "PlacementAgreement.${ag}.recall_exposure_cents == 501600"
            - "PlacementAgreement.${ag}.assessed_fee_cents == 100000"
            - "PlacementAgreement.${ag}.status == RECALL_PENDING"
            - "PlacementAgreement.${ag}.recall_decided_by_user_id == \"co-1\""
            - "PlacementAgreement.${ag}.version == 6"
            - "DispenserUnit.${du}.status == RECALL_STAGED"

      - name: derived_field_reconciliation_of_the_pool_and_alert_level_after_serve
        claim_type: derived_field_reconciliation
        grounds:
          - endpoints[POST /fountain-network/route-stops/{id}/serve]
          - calculations.supply_pool_ledger
          - calculations.outlet_supply_forecast
        distinguishing_aspect: "Service moves the 4 allocated units into on_hand_units (2 -> 6), zeroes the reservation on both the SKU and the route, writes delivered_units 4 and re-derives the alert level from LOW to NONE because 6 units now cover 12 days at 0.5 units per day."
        test_recipe:
          setup:
            - "The 4-unit allocation of the case-pack scenario on a route that is then dispatched and arrived at; SKU ounces_per_unit 2000 with a 7000-ounce 7-day reading, so daily use is 0.5 units."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Riverside Diner", account_code: "OUT-1001", region_code: "R-WEST" }
              as: NetworkAdmin
              captures: { o: $.data.id, ov: $.data.version }
            - call: "POST /fountain-network/placement-agreements"
              payload: { outlet_id: "${o}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2027-01-01T00:00:00Z", annual_commitment_gallons: 8000, equipment_value_cents: 480000, expected_outlet_version: "${ov}" }
              as: NetworkAdmin
              captures: { ag: $.data.id }
            - call: "POST /fountain-network/dispenser-units"
              payload: { outlet_id: "${o}", agreement_id: "${ag}", serial_number: "SN-9001", model_code: "FREESTYLE_9100", installed_at: "2025-11-01T00:00:00Z" }
              as: NetworkAdmin
              captures: { du: $.data.id }
            - call: "POST /fountain-network/supply-items"
              payload: { sku_code: "SKU-COLA", brand_name: "Cola Classic", supply_form: "BAG_IN_BOX", case_pack_units: 4, ounces_per_unit: 2000, national_allocation_units: 100 }
              as: NetworkAdmin
              captures: { si: $.data.id }
            - call: "POST /fountain-network/telemetry-readings"
              payload: { dispenser_unit_id: "${du}", supply_item_id: "${si}", dispensed_ounces: 7000, reading_at: "2026-07-28T00:00:00Z", window_days: 7 }
              as: SupplyPlanner
            - call: "POST /fountain-network/supply-positions"
              payload: { outlet_id: "${o}", supply_item_id: "${si}", on_hand_units: 2 }
              as: SupplyPlanner
              captures: { sp: $.data.id }
            - call: "POST /fountain-network/supply-positions/${sp}/forecast"
              payload: { variant: "TRAILING_ACTUAL", window_days: 7 }
              as: SupplyPlanner
            - call: "POST /fountain-network/replenishment-routes"
              payload: { route_code: "RT-01", depot_region_code: "R-WEST", service_date: "2026-08-03T00:00:00Z", van_code: "VAN-7", capacity_units: 60 }
              as: SupplyPlanner
              captures: { rt: $.data.id, rtv: $.data.version }
            - call: "POST /fountain-network/replenishment-routes/${rt}/stops"
              payload: { outlet_id: "${o}", sequence_index: 1, window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T10:00:00Z", expected_route_version: "${rtv}" }
              as: SupplyPlanner
              captures: { st: $.data.id }
            - call: "POST /fountain-network/route-stops/${st}/allocations"
              payload: { supply_position_ids: ["${sp}"] }
              as: SupplyPlanner
            - call: "GET /fountain-network/replenishment-routes/${rt}"
              as: SupplyPlanner
              captures: { rtv2: $.data.version }
            - call: "POST /fountain-network/replenishment-routes/${rt}/dispatch"
              payload: { expected_route_version: "${rtv2}" }
              as: SupplyPlanner
            - call: "POST /fountain-network/route-stops/${st}/arrive"
              payload: {}
              as: RouteDriver
          trigger:
            - call: "POST /fountain-network/route-stops/${st}/serve"
              payload: {}
              as: RouteDriver
          assert:
            - "HTTP status == 200"
            - "RouteStop.${st}.status == SERVED"
            - "RouteStop.${st}.delivered_units == 4"
            - "OutletSupplyPosition.${sp}.on_hand_units == 6"
            - "OutletSupplyPosition.${sp}.allocated_units == 0"
            - "OutletSupplyPosition.${sp}.planned_route_stop_id == null"
            - "OutletSupplyPosition.${sp}.alert_level == NONE"
            - "SupplyItem.${si}.reserved_pool_units == 0"

  # ==========================================================================
  # §1.9 / consistency_model — declared model is `immediate`, so every write is
  # observable in its own response and in the very next read; there is no lag
  # window to probe.
  # ==========================================================================
  - section: consistency_model
    instances:

      - name: immediate_allocation_response_already_carries_the_committed_numbers
        claim_type: immediate
        grounds:
          - consistency_model
          - endpoints[POST /fountain-network/route-stops/{id}/allocations]
        distinguishing_aspect: "The allocation response itself reports total_allocated_units 4 and allocated_position_count 1, and a read of the SKU issued immediately afterwards already shows reserved_pool_units 4 — no second call or delay is needed for the denormalised counters to settle."
        test_recipe:
          setup:
            - "The 4-unit case-pack allocation scenario: SKU case_pack_units 4 with national_allocation_units 100, position on_hand_units 2 forecast to requested_units 5, one PENDING stop on a 60-unit route."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Riverside Diner", account_code: "OUT-1001", region_code: "R-WEST" }
              as: NetworkAdmin
              captures: { o: $.data.id, ov: $.data.version }
            - call: "POST /fountain-network/placement-agreements"
              payload: { outlet_id: "${o}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2027-01-01T00:00:00Z", annual_commitment_gallons: 8000, equipment_value_cents: 480000, expected_outlet_version: "${ov}" }
              as: NetworkAdmin
              captures: { ag: $.data.id }
            - call: "POST /fountain-network/dispenser-units"
              payload: { outlet_id: "${o}", agreement_id: "${ag}", serial_number: "SN-9001", model_code: "FREESTYLE_9100", installed_at: "2025-11-01T00:00:00Z" }
              as: NetworkAdmin
              captures: { du: $.data.id }
            - call: "POST /fountain-network/supply-items"
              payload: { sku_code: "SKU-COLA", brand_name: "Cola Classic", supply_form: "BAG_IN_BOX", case_pack_units: 4, ounces_per_unit: 2000, national_allocation_units: 100 }
              as: NetworkAdmin
              captures: { si: $.data.id }
            - call: "POST /fountain-network/telemetry-readings"
              payload: { dispenser_unit_id: "${du}", supply_item_id: "${si}", dispensed_ounces: 7000, reading_at: "2026-07-28T00:00:00Z", window_days: 7 }
              as: SupplyPlanner
            - call: "POST /fountain-network/supply-positions"
              payload: { outlet_id: "${o}", supply_item_id: "${si}", on_hand_units: 2 }
              as: SupplyPlanner
              captures: { sp: $.data.id }
            - call: "POST /fountain-network/supply-positions/${sp}/forecast"
              payload: { variant: "TRAILING_ACTUAL", window_days: 7 }
              as: SupplyPlanner
            - call: "POST /fountain-network/replenishment-routes"
              payload: { route_code: "RT-01", depot_region_code: "R-WEST", service_date: "2026-08-03T00:00:00Z", van_code: "VAN-7", capacity_units: 60 }
              as: SupplyPlanner
              captures: { rt: $.data.id, rtv: $.data.version }
            - call: "POST /fountain-network/replenishment-routes/${rt}/stops"
              payload: { outlet_id: "${o}", sequence_index: 1, window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T10:00:00Z", expected_route_version: "${rtv}" }
              as: SupplyPlanner
              captures: { st: $.data.id }
          trigger:
            - call: "POST /fountain-network/route-stops/${st}/allocations"
              payload: { supply_position_ids: ["${sp}"] }
              as: SupplyPlanner
            - call: "GET /fountain-network/supply-items/${si}"
              as: SupplyPlanner
          assert:
            - "HTTP status == 200"
            - "response body data.reserved_pool_units == 4"
            - "response body data.national_allocation_units == 100"
            - "OutletSupplyPosition.${sp}.allocated_units == 4"
            - "ReplenishmentRoute.${rt}.committed_units == 4"

      - name: immediate_posture_recompute_is_visible_on_the_next_outlet_read
        claim_type: immediate
        grounds:
          - consistency_model
          - endpoints[POST /fountain-network/maintenance-tasks/{id}/evaluate-due]
          - calculations.outlet_service_posture
        distinguishing_aspect: "evaluate-due returns the MaintenanceTask, yet the outlet counters it maintains are already reconciled: the very next GET of the outlet shows overdue_task_count 1 and service_posture RESTRICTED without any intervening recompute call."
        test_recipe:
          setup:
            - "One SANITATION task due 2026-07-01 on a unit of an OPEN-posture outlet, with the clock at 2026-08-01 (well past the 72-hour grace)."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Riverside Diner", account_code: "OUT-1001", region_code: "R-WEST" }
              as: NetworkAdmin
              captures: { o: $.data.id, ov: $.data.version }
            - call: "POST /fountain-network/placement-agreements"
              payload: { outlet_id: "${o}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2027-01-01T00:00:00Z", annual_commitment_gallons: 8000, equipment_value_cents: 480000, expected_outlet_version: "${ov}" }
              as: NetworkAdmin
              captures: { ag: $.data.id }
            - call: "POST /fountain-network/dispenser-units"
              payload: { outlet_id: "${o}", agreement_id: "${ag}", serial_number: "SN-9001", model_code: "FREESTYLE_9100", installed_at: "2025-11-01T00:00:00Z" }
              as: NetworkAdmin
              captures: { du: $.data.id }
            - call: "POST /fountain-network/placement-agreements/${ag}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /fountain-network/maintenance-tasks"
              payload: { dispenser_unit_id: "${du}", task_type: "SANITATION", due_at: "2026-07-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { mt: $.data.id }
          trigger:
            - call: "POST /fountain-network/maintenance-tasks/${mt}/evaluate-due"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /fountain-network/outlets/${o}"
              as: ComplianceOfficer
          assert:
            - "HTTP status == 200"
            - "response body data.overdue_task_count == 1"
            - "response body data.service_posture == RESTRICTED"
            - "response body data.open_compliance_hold_count == 0"
            - "MaintenanceTask.${mt}.status == OVERDUE"
            - "MaintenanceTask.${mt}.breach_kind == DATE"
