        distinguishing_aspect: "With baseline_weekly_units 50 and PROVISIONAL_WINDOW_DAYS 3, 50 * 3 / 7 = 21.428571... is stored as baseline_units_expected 21.43, and every downstream number is computed from that rounded value: lift_units 8.57, lift_pct 39.99 and incremental_revenue_cents ROUND_HALF_UP(8.57 * 499) = 4276 — not 4277 and not the 39.98 an unrounded intermediate would give."
