            - call: "POST /api/children"
              payload: { family_account_id: "${fam_b2}", display_name: "Kid B2", birth_year: 2012 }
              as: Parent
              as_user_id: "${par_b2}"
              captures: { child_b2: $.data.id }
            - call: "POST /api/children/${child_b2}/devices/pair"
              payload: { platform: "ANDROID", nickname: "B2-1" }
              as: Parent
              as_user_id: "${par_b2}"
          trigger:
            - call: "POST /api/children/${child_b2}/devices/pair"
              payload: { platform: "IOS", nickname: "B2-2" }
              as: Parent
              as_user_id: "${par_b2}"
            - call: "POST /api/children/${child_b2}/devices/pair"
              payload: { platform: "CHROMEBOOK", nickname: "B2-3" }
              as: Parent
              as_user_id: "${par_b2}"
              captures: { err_id: $.data.error_id }
          assert:
            - "Second pair succeeds (HTTP 201), FamilyAccount.device_count == 2"
            - "Third pair rejected: error_id == ERR_DEVICE_LIMIT_EXCEEDED, HTTP 409"
            - "FamilyAccount.device_count remains 2 after rejection"

      - name: bypass_strike_threshold_at_exactly_three
        grounds:
          - calculations.bypass_strike_window
          - entities.Device.fields.device_posture
        distinguishing_aspect: |
          Different metric (strike count, not device count) and different endpoint
          (POST bypass-events): after 2 in-window events posture is BYPASS_WATCH;
          the 3rd event (count >= 3, inclusive boundary) flips posture to LOCKDOWN.
        test_recipe:
          setup:
            - "Family, child, paired device with no bypass history"
          setup_api_calls:
            - call: "POST /api/families"
              payload: { family_name: "Fam T", primary_contact_email: "t@x.com", primary_parent_name: "Pat T" }
              as: PlatformAdmin
              captures: { fam_t: $.data.id }
            - call: "GET /api/families/${fam_t}/parents"
              as: PlatformAdmin
              captures: { par_t: $.data.0.id }
            - call: "POST /api/children"
              payload: { family_account_id: "${fam_t}", display_name: "Kid T", birth_year: 2012 }
              as: Parent
              as_user_id: "${par_t}"
              captures: { child_t: $.data.id }
            - call: "POST /api/children/${child_t}/devices/pair"
              payload: { platform: "ANDROID", nickname: "T-phone" }
              as: Parent
              as_user_id: "${par_t}"
              captures: { dev_t: $.data.id }
            - call: "POST /api/devices/${dev_t}/bypass-events"
              payload: { bypass_kind: "VPN", detected_at: "2026-09-01T00:00:00Z" }
              as: DeviceAgent
              as_user_id: "${dev_t}"
            - call: "POST /api/devices/${dev_t}/bypass-events"
              payload: { bypass_kind: "SECONDARY_ACCOUNT", detected_at: "2026-09-01T00:05:00Z" }
              as: DeviceAgent
              as_user_id: "${dev_t}"
          trigger:
            - call: "GET /api/devices/${dev_t}"
              as: Parent
              as_user_id: "${par_t}"
            - call: "POST /api/devices/${dev_t}/bypass-events"
              payload: { bypass_kind: "UNINSTALL_ATTEMPT", detected_at: "2026-09-01T00:10:00Z" }
              as: DeviceAgent
              as_user_id: "${dev_t}"
            - call: "GET /api/devices/${dev_t}"
              as: Parent
              as_user_id: "${par_t}"
          assert:
            - "After 2 events: bypass_strike_count == 2 AND device_posture == BYPASS_WATCH"
            - "After 3rd event: bypass_strike_count == 3 AND device_posture == LOCKDOWN"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: pairing_requires_family_active
        grounds:
          - state_machines.FamilyAccount
          - errors[ERR_FAMILY_SUSPENDED]
          - validations[priority=7]
        distinguishing_aspect: |
          Device pairing (Device -> FamilyAccount pair) is gated by the family's
          account_status: SUSPENDED blocks pairing; reactivation restores it.
        test_recipe:
          setup:
            - "Family with child; family suspended then reactivated"
          setup_api_calls:
            - call: "POST /api/families"
              payload: { family_name: "Fam X", primary_contact_email: "x@x.com", primary_parent_name: "Pat X" }
              as: PlatformAdmin
              captures: { fam_x: $.data.id }
            - call: "GET /api/families/${fam_x}/parents"
              as: PlatformAdmin
              captures: { par_x: $.data.0.id }
            - call: "POST /api/children"
              payload: { family_account_id: "${fam_x}", display_name: "Kid X", birth_year: 2012 }
              as: Parent
              as_user_id: "${par_x}"
              captures: { child_x: $.data.id }
            - call: "POST /api/families/${fam_x}/state"
              payload: { to_status: "SUSPENDED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/children/${child_x}/devices/pair"
              payload: { platform: "ANDROID", nickname: "X-1" }
              as: Parent
              as_user_id: "${par_x}"
              captures: { err_id: $.data.error_id }
            - call: "POST /api/families/${fam_x}/state"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /api/children/${child_x}/devices/pair"
              payload: { platform: "ANDROID", nickname: "X-1" }
              as: Parent
              as_user_id: "${par_x}"
          assert:
            - "While suspended: error_id == ERR_FAMILY_SUSPENDED, HTTP 409"
            - "After reactivation: pair succeeds (HTTP 201), device_count == 1"

      - name: severe_alert_resolve_requires_case_closed
        grounds:
          - state_machines.Alert.ACKNOWLEDGED_to_RESOLVED
          - state_machines.EscalationCase
          - errors[ERR_ESCALATION_OPEN]
        distinguishing_aspect: |
          Different entity pair (Alert -> EscalationCase): a SEVERE alert cannot
          transition to RESOLVED while its linked case is not CLOSED; advancing the
          case GUIDANCE_ISSUED -> RESOURCE_REFERRED -> CLOSED unblocks the resolve.
        test_recipe:
          setup:
            - "Family, child, paired device, ACTIVE connection; one SEVERE alert (PREDATORY_CONTACT 90) with EscalationCase OPEN; alert ACKNOWLEDGED so case -> GUIDANCE_ISSUED"
          setup_api_calls:
            - call: "POST /api/families"
              payload: { family_name: "Fam E", primary_contact_email: "e@x.com", primary_parent_name: "Pat E" }
              as: PlatformAdmin
              captures: { fam_e: $.data.id }
            - call: "GET /api/families/${fam_e}/parents"
              as: PlatformAdmin
              captures: { par_e: $.data.0.id }
            - call: "POST /api/children"
              payload: { family_account_id: "${fam_e}", display_name: "Kid E", birth_year: 2012 }
              as: Parent
              as_user_id: "${par_e}"
              captures: { child_e: $.data.id }
            - call: "POST /api/children/${child_e}/devices/pair"
              payload: { platform: "ANDROID", nickname: "E-phone" }
              as: Parent
              as_user_id: "${par_e}"
              captures: { dev_e: $.data.id }
            - call: "POST /api/children/${child_e}/connections"
              payload: { service_type: "MESSAGING", external_handle: "kide@msg", credential_token: "tok-e" }
              as: Parent
              as_user_id: "${par_e}"
              captures: { conn_e: $.data.id }
            - call: "POST /api/connections/${conn_e}/state"
              payload: { to_status: "ACTIVE" }
              as: Parent
              as_user_id: "${par_e}"
            - call: "POST /api/content-items"
              payload:
                service_connection_id: "${conn_e}"
                occurred_at: "2026-09-01T00:00:00Z"
                direction: "INBOUND"
                thread_depth: 1
                signals: [ { category: "PREDATORY_CONTACT", weight: 90 } ]
                raw_text: "severe item"
              as: DeviceAgent
              as_user_id: "${dev_e}"
              captures: { alert_e: $.data.alert_id }
            - call: "POST /api/alerts/${alert_e}/state"
              payload: { to_status: "ACKNOWLEDGED" }
              as: Parent
              as_user_id: "${par_e}"
            - call: "GET /api/escalation-cases"
              payload: { alert_id: "${alert_e}" }
              as: Parent
              as_user_id: "${par_e}"
              captures: { case_e: $.data.0.id }
          trigger:
            - call: "POST /api/alerts/${alert_e}/state"
              payload: { to_status: "RESOLVED" }
              as: Parent
              as_user_id: "${par_e}"
              captures: { err_id: $.data.error_id }
            - call: "POST /api/escalation-cases/${case_e}/state"
              payload: { to_status: "RESOURCE_REFERRED" }
              as: Parent
              as_user_id: "${par_e}"
            - call: "POST /api/escalation-cases/${case_e}/state"
              payload: { to_status: "CLOSED" }
              as: Parent
              as_user_id: "${par_e}"
            - call: "POST /api/alerts/${alert_e}/state"
              payload: { to_status: "RESOLVED" }
              as: Parent
              as_user_id: "${par_e}"
          assert:
            - "First resolve rejected: error_id == ERR_ESCALATION_OPEN, HTTP 409"
            - "After case CLOSED: resolve succeeds, Alert.alert_status == RESOLVED"
            - "ChildProfile.open_alert_count == 0"

  - rule_id: resource_temporal_overlap
    instances:
      - name: screen_time_window_half_open_adjacency
        grounds:
          - errors[ERR_WINDOW_OVERLAP]
          - state_machines.ScreenTimeWindow
          - entities.ScreenTimeWindow.fields.start_minute
        distinguishing_aspect: |
          Half-open interval semantics on ScreenTimeWindow (resource: Device):
          [480,720) and [720,900) on the same weekday are adjacent, NOT overlapping,
          and are accepted; [600,800) intersects [480,720) and is rejected; same
          interval on a different weekday is accepted.
        test_recipe:
          setup:
            - "Family, child, paired device; one ACTIVE BLOCKED window MON [480,720)"
          setup_api_calls:
            - call: "POST /api/families"
              payload: { family_name: "Fam V", primary_contact_email: "v@x.com", primary_parent_name: "Pat V" }
              as: PlatformAdmin
              captures: { fam_v: $.data.id }
            - call: "GET /api/families/${fam_v}/parents"
              as: PlatformAdmin
              captures: { par_v: $.data.0.id }
            - call: "POST /api/children"
              payload: { family_account_id: "${fam_v}", display_name: "Kid V", birth_year: 2012 }
              as: Parent
              as_user_id: "${par_v}"
              captures: { child_v: $.data.id }
            - call: "POST /api/children/${child_v}/devices/pair"
              payload: { platform: "ANDROID", nickname: "V-phone" }
              as: Parent
              as_user_id: "${par_v}"
              captures: { dev_v: $.data.id }
            - call: "POST /api/devices/${dev_v}/screen-time-windows"
              payload: { weekday: "MON", start_minute: 480, end_minute: 720, window_kind: "BLOCKED" }
              as: Parent
              as_user_id: "${par_v}"
          trigger:
            - call: "POST /api/devices/${dev_v}/screen-time-windows"
              payload: { weekday: "MON", start_minute: 720, end_minute: 900, window_kind: "BLOCKED" }
              as: Parent
              as_user_id: "${par_v}"
            - call: "POST /api/devices/${dev_v}/screen-time-windows"
              payload: { weekday: "TUE", start_minute: 600, end_minute: 800, window_kind: "BLOCKED" }
              as: Parent
              as_user_id: "${par_v}"
            - call: "POST /api/devices/${dev_v}/screen-time-windows"
              payload: { weekday: "MON", start_minute: 600, end_minute: 800, window_kind: "BLOCKED" }
              as: Parent
              as_user_id: "${par_v}"
              captures: { err_id: $.data.error_id }
          assert:
            - "Adjacent MON [720,900) accepted (HTTP 201)"
            - "Different-weekday TUE [600,800) accepted (HTTP 201)"
            - "Overlapping MON [600,800) rejected: error_id == ERR_WINDOW_OVERLAP, HTTP 409"

      - name: access_grant_padded_closed_interval_conflict
        grounds:
          - errors[ERR_GRANT_CONFLICT]
          - entities.DeviceAccessGrant.fields.grant_status
        distinguishing_aspect: |
          Different interval semantics on a different resource (DeviceAccessGrant):
          closed intervals padded by a 5-minute buffer on each side — a grant
          starting at 02:03 conflicts with one ending at 02:00 (padded to 02:05);
          a grant starting at 02:06 clears the buffer and is accepted.
        test_recipe:
          setup:
            - "Family, child, paired device; one grant [2026-09-01T01:00:00Z, 2026-09-01T02:00:00Z] created at default clock 2026-09-01T00:00:00Z (SCHEDULED)"
          setup_api_calls:
            - call: "POST /api/families"
              payload: { family_name: "Fam U", primary_contact_email: "u@x.com", primary_parent_name: "Pat U" }
              as: PlatformAdmin
              captures: { fam_u: $.data.id }
            - call: "GET /api/families/${fam_u}/parents"
              as: PlatformAdmin
              captures: { par_u: $.data.0.id }
            - call: "POST /api/children"
              payload: { family_account_id: "${fam_u}", display_name: "Kid U", birth_year: 2012 }
              as: Parent
              as_user_id: "${par_u}"
              captures: { child_u: $.data.id }
            - call: "POST /api/children/${child_u}/devices/pair"
              payload: { platform: "ANDROID", nickname: "U-phone" }
              as: Parent
              as_user_id: "${par_u}"
              captures: { dev_u: $.data.id }
            - call: "POST /api/devices/${dev_u}/access-grants"
              payload: { start_at: "2026-09-01T01:00:00Z", end_at: "2026-09-01T02:00:00Z" }
              as: Parent
              as_user_id: "${par_u}"
          trigger:
            - call: "POST /api/devices/${dev_u}/access-grants"
              payload: { start_at: "2026-09-01T02:03:00Z", end_at: "2026-09-01T03:00:00Z" }
              as: Parent
              as_user_id: "${par_u}"
              captures: { err_id: $.data.error_id }
            - call: "POST /api/devices/${dev_u}/access-grants"
              payload: { start_at: "2026-09-01T02:06:00Z", end_at: "2026-09-01T03:00:00Z" }
              as: Parent
              as_user_id: "${par_u}"
          assert:
            - "Grant starting 02:03 rejected: error_id == ERR_GRANT_CONFLICT, HTTP 409"
            - "Grant starting 02:06 accepted (HTTP 201)"

  - rule_id: compensating_invariant
    instances:
      - name: device_pair_unpair_count_conservation
        grounds:
          - calculations.device_limit_and_count
          - state_machines.Device
        distinguishing_aspect: |
          Conserved quantity: FamilyAccount.device_count. Pair(+1)/unpair(-1)
          compensation keeps device_count == count(PAIRED devices) at every step:
          0 -> 1 -> 2 -> 1 -> 2.
        test_recipe:
          setup:
            - "STANDARD family with one child"
          setup_api_calls:
            - call: "POST /api/families"
              payload: { family_name: "Fam N", primary_contact_email: "n@x.com", primary_parent_name: "Pat N", subscription_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { fam_n: $.data.id }
            - call: "GET /api/families/${fam_n}/parents"
              as: PlatformAdmin
              captures: { par_n: $.data.0.id }
            - call: "POST /api/children"
              payload: { family_account_id: "${fam_n}", display_name: "Kid N", birth_year: 2012 }
              as: Parent
              as_user_id: "${par_n}"
              captures: { child_n: $.data.id }
          trigger:
            - call: "POST /api/children/${child_n}/devices/pair"
              payload: { platform: "ANDROID", nickname: "N-1" }
              as: Parent
              as_user_id: "${par_n}"
              captures: { dev_n1: $.data.id }
            - call: "POST /api/children/${child_n}/devices/pair"
              payload: { platform: "IOS", nickname: "N-2" }
              as: Parent
              as_user_id: "${par_n}"
            - call: "POST /api/devices/${dev_n1}/unpair"
              as: Parent
              as_user_id: "${par_n}"
            - call: "POST /api/children/${child_n}/devices/pair"
              payload: { platform: "CHROMEBOOK", nickname: "N-3" }
              as: Parent
              as_user_id: "${par_n}"
            - call: "GET /api/families/${fam_n}"
              as: Parent
              as_user_id: "${par_n}"
          assert:
            - "After pair,pair: device_count == 2; after unpair: device_count == 1; after re-pair: device_count == 2"
            - "Final GET: FamilyAccount.${fam_n}.device_count == 2"
            - "Device.${dev_n1}.pairing_status == UNPAIRED"

      - name: alert_resolve_reopen_count_conservation
        grounds:
          - calculations.open_alert_count_aggregation
          - state_machines.Alert
        distinguishing_aspect: |
          Different conserved quantity: ChildProfile.open_alert_count. The
          RESOLVE(-1)/REOPEN(+1) compensating pair restores the exact prior count:
          1 -> 0 -> 1.
        test_recipe:
          setup:
            - "Family, child, paired device, ACTIVE connection; one MODERATE alert (open_alert_count == 1)"
          setup_api_calls:
            - call: "POST /api/families"
              payload: { family_name: "Fam O", primary_contact_email: "o@x.com", primary_parent_name: "Pat O" }
              as: PlatformAdmin
              captures: { fam_o: $.data.id }
            - call: "GET /api/families/${fam_o}/parents"
              as: PlatformAdmin
              captures: { par_o: $.data.0.id }
            - call: "POST /api/children"
              payload: { family_account_id: "${fam_o}", display_name: "Kid O", birth_year: 2012 }
              as: Parent
              as_user_id: "${par_o}"
              captures: { child_o: $.data.id }
            - call: "POST /api/children/${child_o}/devices/pair"
              payload: { platform: "ANDROID", nickname: "O-phone" }
              as: Parent
              as_user_id: "${par_o}"
              captures: { dev_o: $.data.id }
            - call: "POST /api/children/${child_o}/connections"
              payload: { service_type: "MESSAGING", external_handle: "kido@msg", credential_token: "tok-o" }
              as: Parent
              as_user_id: "${par_o}"
              captures: { conn_o: $.data.id }
            - call: "POST /api/connections/${conn_o}/state"
              payload: { to_status: "ACTIVE" }
              as: Parent
              as_user_id: "${par_o}"
            - call: "POST /api/content-items"
              payload:
                service_connection_id: "${conn_o}"
                occurred_at: "2026-09-01T00:00:00Z"
                direction: "OUTBOUND"
                thread_depth: 1
                signals: [ { category: "BULLYING", weight: 30 }, { category: "EXPLICIT", weight: 25 } ]
                raw_text: "count item"
              as: DeviceAgent
              as_user_id: "${dev_o}"
              captures: { alert_o: $.data.alert_id }
            - call: "POST /api/alerts/${alert_o}/state"
              payload: { to_status: "ACKNOWLEDGED" }
              as: Parent
              as_user_id: "${par_o}"
          trigger:
            - call: "POST /api/alerts/${alert_o}/state"
              payload: { to_status: "RESOLVED" }
              as: Parent
              as_user_id: "${par_o}"
            - call: "GET /api/children/${child_o}"
              as: Parent
              as_user_id: "${par_o}"
            - call: "POST /api/alerts/${alert_o}/state"
              payload: { to_status: "REOPENED" }
              as: Parent
              as_user_id: "${par_o}"
            - call: "GET /api/children/${child_o}"
              as: Parent
              as_user_id: "${par_o}"
          assert:
            - "After resolve: open_alert_count == 0"
            - "After reopen: open_alert_count == 1 (prior value restored exactly)"
