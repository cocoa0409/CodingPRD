          Depth 5 in one request: finalizing the claim as UNCONTROLLABLE (hop 1)
          moves the cycle's cancellation counters (hop 2), which stales the
          PUBLISHED scorecard (hop 3), which voids the ISSUED invoice with
          void_reason AUTO_SCORECARD_STALE (hop 4), which restores
