  - section: validations
    instances:
      - name: missing_x_user_id_outranks_the_role_not_being_authorized_for_the_endpoint
        claim_type: priority_ordering
        grounds: ["validations[priority 1]", "validations[priority 2]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "POST /state-programs does not list FilingAgent at all, so both priority 1 and priority 2 are violated by the same request. Priority 1 must win with 401, not the more informative 403 — and it must win even though no LicenseeUser exists in the database to resolve at all."
        test_recipe:
          setup:
            - "Empty database; only the clock has been set."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /state-programs"
              payload: { state_code: "TX", program_name: "Texas Price Posting Program" }
              as: FilingAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 401."
            - "data.error_id == \"ERR_UNAUTHENTICATED\" — the entity-backed role was named without X-User-ID."
            - "response_type == \"error\" and meta.api_request_id is present."
            - "GET /state-programs as ComplianceOfficer returns total_count == 0 — nothing was created."

      - name: role_authorization_outranks_path_existence_and_returns_unauthorized_for_an_unknown_schedule
        claim_type: priority_ordering
        grounds: ["validations[priority 2]", "validations[priority 3]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "The path id does not exist AND the acting role is wrong. Priority 2 outranks priority 3, so the response is 403 — an implementation that looks the resource up first in order to authorize it leaks a 404 here."
        test_recipe:
          setup:
            - "One wholesaler with an active FILING_AGENT user exists; no schedule with the probed id exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-programs"
              payload: { state_code: "TX", program_name: "Texas Price Posting Program" }
