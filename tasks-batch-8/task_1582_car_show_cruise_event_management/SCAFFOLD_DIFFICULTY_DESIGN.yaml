  - rule_id: cross_entity_state_dependency
    instances:
      - name: checkin_requires_signed_waiver
        grounds:
          - state_machines.Registration.CONFIRMED_to_CHECKED_IN
          - entities.Waiver.fields.registrant_id
          - errors[ERR_WAIVER_NOT_SIGNED]
        distinguishing_aspect: |
          Entity pair Registration -> Waiver: the CHECKED_IN transition is gated on the
          existence of a Waiver for (registrant_id, event_id); without it the transition fails
          with ERR_WAIVER_NOT_SIGNED, and signing the waiver (a different aggregate) unblocks it.
        test_recipe:
          setup:
            - "Event REGISTRATION_OPEN; registration CONFIRMED (paid 3000); zone FIELD window 08:00-10:00; clock 08:30; NO waiver signed"
          setup_api_calls:
            - { call: "POST /events", payload: { name: "Waiver Gate", event_date: "2026-08-15", gates_open_at: "2026-08-15T09:00:00Z", judging_start_at: "2026-08-15T12:00:00Z", judging_end_at: "2026-08-15T14:00:00Z", ballot_close_at: "2026-08-15T14:30:00Z", prereg_deadline: "2026-08-14T23:59:59Z", curfew_start: "22:00", curfew_end: "07:00", liability_policy_number: "POL-1", tabulation_method: "STRAIGHT_AVERAGE" }, as: Organizer, captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/classes", payload: { code: "OPEN", name: "Open", min_year: 1900, max_year: 2026, prereg_fee_cents: 3000, day_of_fee_cents: 4500, capacity: 40, judging_mode: "PEOPLES_CHOICE", award_depth: 1 }, as: Organizer, captures: { cl: $.data.id } }
            - { call: "POST /events/${ev}/zones", payload: { name: "Field", zone_type: "SHOW_FIELD", capacity: 50, has_power: false, arrival_window_start: "2026-08-15T08:00:00Z", arrival_window_end: "2026-08-15T10:00:00Z" }, as: Organizer, captures: { zn: $.data.id } }
            - { call: "POST /events/${ev}/publish", payload: {}, as: Organizer }
            - { call: "POST /events/${ev}/open-registration", payload: {}, as: Organizer }
            - { call: "POST /registrants", payload: { full_name: "WG", email: "wg@example.com", club_member: false, is_minor: false }, as: Organizer, captures: { p1: $.data.id } }
            - { call: "POST /registrants/${p1}/vehicles", payload: { year: 1970, make: "Ford", model: "Mustang" }, as: Organizer, captures: { v1: $.data.id } }
            - { call: "POST /registrations", payload: { event_id: "${ev}", registrant_id: "${p1}", vehicle_id: "${v1}", class_id: "${cl}" }, as: RegistrationDesk, captures: { r1: $.data.id } }
            - { call: "POST /registrations/${r1}/payments", payload: { amount_cents: 3000, method: "CASH" }, as: RegistrationDesk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T08:30:00Z" }, as: Organizer }
          trigger:
            - { call: "POST /registrations/${r1}/check-in", payload: { zone_id: "${zn}" }, as: RegistrationDesk, captures: { err: $.data.error_id } }
            - { call: "POST /waivers", payload: { event_id: "${ev}", registrant_id: "${p1}", signature_name: "WG" }, as: RegistrationDesk }
            - { call: "POST /registrations/${r1}/check-in", payload: { zone_id: "${zn}" }, as: RegistrationDesk, captures: { st: $.data.status, spot: $.data.spot_number } }
          assert:
            - "first check-in fails: error == ERR_WAIVER_NOT_SIGNED (HTTP 422)"
            - "after signing, second check-in succeeds: status == CHECKED_IN, spot_number == 1"
            - "Zone.assigned_count == 1 after the successful check-in"

      - name: sheet_submit_requires_event_judging
        grounds:
          - state_machines.ScoreSheet.DRAFT_to_SUBMITTED
          - state_machines.Event.REGISTRATION_LOCKED_to_JUDGING
          - errors[ERR_INVALID_EVENT_STATE]
        distinguishing_aspect: |
          Entity pair ScoreSheet -> Event (different pair than Registration -> Waiver): sheet
          creation is rejected while Event.lifecycle_status == REGISTRATION_LOCKED even inside
          the judging time window; only the start-judging transition on the Event unlocks it,
          and the eventual submit completes the class and drives the event to TABULATING.
        test_recipe:
          setup:
            - "Event REGISTRATION_LOCKED (not yet JUDGING); one CHECKED_IN registration; judge J1 assigned to the class; clock 12:30 inside the judging window"
          setup_api_calls:
            - { call: "POST /events", payload: { name: "Gate Show", event_date: "2026-08-15", gates_open_at: "2026-08-15T09:00:00Z", judging_start_at: "2026-08-15T12:00:00Z", judging_end_at: "2026-08-15T14:00:00Z", ballot_close_at: "2026-08-15T14:30:00Z", prereg_deadline: "2026-08-14T23:59:59Z", curfew_start: "22:00", curfew_end: "07:00", liability_policy_number: "POL-1", tabulation_method: "STRAIGHT_AVERAGE" }, as: Organizer, captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/classes", payload: { code: "MUSCLE", name: "Muscle", min_year: 1950, max_year: 1975, prereg_fee_cents: 3000, day_of_fee_cents: 4500, capacity: 40, judging_mode: "JUDGED", award_depth: 1 }, as: Organizer, captures: { cl: $.data.id } }
            - { call: "POST /events/${ev}/zones", payload: { name: "Field", zone_type: "SHOW_FIELD", capacity: 50, has_power: false, arrival_window_start: "2026-08-15T08:00:00Z", arrival_window_end: "2026-08-15T10:00:00Z" }, as: Organizer, captures: { zn: $.data.id } }
            - { call: "POST /events/${ev}/publish", payload: {}, as: Organizer }
            - { call: "POST /events/${ev}/open-registration", payload: {}, as: Organizer }
            - { call: "POST /registrants", payload: { full_name: "GS", email: "gs@example.com", club_member: false, is_minor: false }, as: Organizer, captures: { p1: $.data.id } }
            - { call: "POST /registrants/${p1}/vehicles", payload: { year: 1970, make: "Ford", model: "Mustang" }, as: Organizer, captures: { v1: $.data.id } }
            - { call: "POST /waivers", payload: { event_id: "${ev}", registrant_id: "${p1}", signature_name: "GS" }, as: RegistrationDesk }
            - { call: "POST /registrations", payload: { event_id: "${ev}", registrant_id: "${p1}", vehicle_id: "${v1}", class_id: "${cl}" }, as: RegistrationDesk, captures: { r1: $.data.id } }
            - { call: "POST /registrations/${r1}/payments", payload: { amount_cents: 3000, method: "CASH" }, as: RegistrationDesk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T08:30:00Z" }, as: Organizer }
            - { call: "POST /registrations/${r1}/check-in", payload: { zone_id: "${zn}" }, as: RegistrationDesk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T12:30:00Z" }, as: Organizer }
            - { call: "POST /events/${ev}/lock-registration", payload: {}, as: Organizer }
            - { call: "POST /events/${ev}/judges", payload: { name: "J1", email: "j1@example.com", assigned_class_ids: ["${cl}"] }, as: Organizer, captures: { j1: $.data.id } }
          trigger:
            - { call: "POST /score-sheets", payload: { registration_id: "${r1}", criteria_scores: [{ criterion: "EXTERIOR", points: 9 }, { criterion: "INTERIOR", points: 8 }, { criterion: "ENGINE", points: 8 }, { criterion: "AUTHENTICITY", points: 9 }, { criterion: "CONDITION", points: 8 }] }, as: Judge, as_user_id: "${j1}", captures: { err: $.data.error_id } }
            - { call: "POST /events/${ev}/start-judging", payload: {}, as: Organizer }
            - { call: "POST /score-sheets", payload: { registration_id: "${r1}", criteria_scores: [{ criterion: "EXTERIOR", points: 9 }, { criterion: "INTERIOR", points: 8 }, { criterion: "ENGINE", points: 8 }, { criterion: "AUTHENTICITY", points: 9 }, { criterion: "CONDITION", points: 8 }] }, as: Judge, as_user_id: "${j1}", captures: { s1: $.data.id } }
            - { call: "POST /score-sheets/${s1}/submit", payload: {}, as: Judge, as_user_id: "${j1}", captures: { st: $.data.status } }
          assert:
            - "first create fails: error == ERR_INVALID_EVENT_STATE (HTTP 409) — event not JUDGING despite clock inside the judging window"
            - "after start-judging the same create succeeds (201)"
            - "submit succeeds and, the class now complete, the sheet ends LOCKED and Event.lifecycle_status == TABULATING"

      - name: booth_assign_requires_paid_state
        grounds:
          - state_machines.BoothApplication.PAID_to_ASSIGNED
          - entities.BoothApplication.fields.paid_cents
          - errors[ERR_INVALID_BOOTH_STATE]
        distinguishing_aspect: |
          Entity pair BoothApplication -> Payment (different pair than the other two
          instances): assign is gated on the application's PAID status, which only a settled
          booth-fee Payment produces; APPROVED-but-unpaid assign fails with
          ERR_INVALID_BOOTH_STATE, then paying 14000 unblocks the same assign.
        test_recipe:
          setup:
            - "Event PUBLISHED; VENDOR_ROW zone (capacity 10, has_power true); DOUBLE booth application APPROVED with fee 14000, unpaid"
          setup_api_calls:
            - { call: "POST /events", payload: { name: "Booth Show", event_date: "2026-08-15", gates_open_at: "2026-08-15T09:00:00Z", judging_start_at: "2026-08-15T12:00:00Z", judging_end_at: "2026-08-15T14:00:00Z", ballot_close_at: "2026-08-15T14:30:00Z", prereg_deadline: "2026-08-14T23:59:59Z", curfew_start: "22:00", curfew_end: "07:00", liability_policy_number: "POL-1", tabulation_method: "STRAIGHT_AVERAGE" }, as: Organizer, captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/classes", payload: { code: "OPEN", name: "Open", min_year: 1900, max_year: 2026, prereg_fee_cents: 3000, day_of_fee_cents: 4500, capacity: 40, judging_mode: "PEOPLES_CHOICE", award_depth: 1 }, as: Organizer }
            - { call: "POST /events/${ev}/zones", payload: { name: "Vendor Row", zone_type: "VENDOR_ROW", capacity: 10, has_power: true }, as: Organizer, captures: { vz: $.data.id } }
            - { call: "POST /events/${ev}/publish", payload: {}, as: Organizer }
            - { call: "POST /booth-applications", payload: { event_id: "${ev}", business_name: "Wax Works", contact_email: "wax@example.com", booth_tier: "DOUBLE", power_requested: false }, as: Organizer, captures: { ba: $.data.id } }
            - { call: "POST /booth-applications/${ba}/approve", payload: {}, as: Organizer, captures: { fee: $.data.fee_cents } }
          trigger:
            - { call: "POST /booth-applications/${ba}/assign", payload: { zone_id: "${vz}", spaces: [1, 2] }, as: Organizer, captures: { err: $.data.error_id } }
            - { call: "POST /booth-applications/${ba}/payments", payload: { amount_cents: 14000, method: "CARD" }, as: Organizer }
            - { call: "POST /booth-applications/${ba}/assign", payload: { zone_id: "${vz}", spaces: [1, 2] }, as: Organizer, captures: { st: $.data.status } }
            - { call: "GET /events/${ev}/zones", payload: {}, as: Organizer }
          assert:
            - "fee == 14000 computed at approve (TIER_FEE_DOUBLE, no power)"
            - "assign while APPROVED fails: error == ERR_INVALID_BOOTH_STATE (HTTP 409)"
            - "after paying 14000 the same assign succeeds: status == ASSIGNED, assigned_spaces == [1, 2]"
            - "zones[0].assigned_count == 2"

  - rule_id: resource_temporal_overlap
    instances:
      - name: sound_slot_half_open_overlap
        grounds:
          - entities.SoundSlot.fields.slot_start
          - entities.SoundSlot.fields.slot_end
          - errors[ERR_SOUND_SLOT_OVERLAP]
        distinguishing_aspect: |
          Resource SoundSlot with half-open interval semantics: [19:00,20:00) blocks a
          19:30-20:30 request but permits back-to-back adjacency at exactly 20:00 (and a
          slot ending exactly at 19:00), because interval intersection is empty at the boundary.
        test_recipe:
          setup:
            - "Published event; one SCHEDULED slot 2026-08-15T19:00:00Z-20:00:00Z"
          setup_api_calls:
            - { call: "POST /events", payload: { name: "Slot Show", event_date: "2026-08-15", gates_open_at: "2026-08-15T09:00:00Z", judging_start_at: "2026-08-15T12:00:00Z", judging_end_at: "2026-08-15T14:00:00Z", ballot_close_at: "2026-08-15T14:30:00Z", prereg_deadline: "2026-08-14T23:59:59Z", curfew_start: "22:00", curfew_end: "07:00", liability_policy_number: "POL-1", tabulation_method: "STRAIGHT_AVERAGE" }, as: Organizer, captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/classes", payload: { code: "OPEN", name: "Open", min_year: 1900, max_year: 2026, prereg_fee_cents: 3000, day_of_fee_cents: 4500, capacity: 40, judging_mode: "PEOPLES_CHOICE", award_depth: 1 }, as: Organizer }
            - { call: "POST /events/${ev}/zones", payload: { name: "Field", zone_type: "SHOW_FIELD", capacity: 50, has_power: false }, as: Organizer }
            - { call: "POST /events/${ev}/publish", payload: {}, as: Organizer }
            - { call: "POST /events/${ev}/sound-slots", payload: { performer_name: "Headliner", slot_start: "2026-08-15T19:00:00Z", slot_end: "2026-08-15T20:00:00Z", expected_db: 90.0 }, as: Organizer, captures: { sl1: $.data.id } }
          trigger:
            - { call: "POST /events/${ev}/sound-slots", payload: { performer_name: "Overlapper", slot_start: "2026-08-15T19:30:00Z", slot_end: "2026-08-15T20:30:00Z", expected_db: 88.0 }, as: Organizer, captures: { err: $.data.error_id } }
            - { call: "POST /events/${ev}/sound-slots", payload: { performer_name: "After Band", slot_start: "2026-08-15T20:00:00Z", slot_end: "2026-08-15T21:00:00Z", expected_db: 85.0 }, as: Organizer, captures: { sl2: $.data.id } }
            - { call: "POST /events/${ev}/sound-slots", payload: { performer_name: "Before Band", slot_start: "2026-08-15T18:00:00Z", slot_end: "2026-08-15T19:00:00Z", expected_db: 85.0 }, as: Organizer, captures: { sl3: $.data.id } }
          assert:
            - "overlapper rejected: error == ERR_SOUND_SLOT_OVERLAP (HTTP 409)"
            - "adjacent-after slot (starts exactly at 20:00) created with status SCHEDULED"
            - "adjacent-before slot (ends exactly at 19:00) created with status SCHEDULED"

      - name: booth_space_set_conflict
        grounds:
          - entities.BoothApplication.fields.assigned_spaces
          - entities.BoothApplication.fields.booth_tier
          - errors[ERR_BOOTH_SPACE_CONFLICT]
          - errors[ERR_BOOTH_SPACES_NOT_CONTIGUOUS]
        distinguishing_aspect: |
          Resource booth spaces with discrete-set + adjacency semantics (different from
          half-open time intervals): a DOUBLE booth needs exactly two contiguous integers and
          any intersection with an occupied space rejects; space 3 occupied blocks [3,4] and
          non-contiguous [5,7] is rejected even though both spaces are free.
        test_recipe:
          setup:
            - "Published event; VENDOR_ROW zone capacity 10 with power; app1 SINGLE approved, paid 7500, ASSIGNED on space [3]; app2 DOUBLE approved and paid 14000"
          setup_api_calls:
            - { call: "POST /events", payload: { name: "Booth Grid", event_date: "2026-08-15", gates_open_at: "2026-08-15T09:00:00Z", judging_start_at: "2026-08-15T12:00:00Z", judging_end_at: "2026-08-15T14:00:00Z", ballot_close_at: "2026-08-15T14:30:00Z", prereg_deadline: "2026-08-14T23:59:59Z", curfew_start: "22:00", curfew_end: "07:00", liability_policy_number: "POL-1", tabulation_method: "STRAIGHT_AVERAGE" }, as: Organizer, captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/classes", payload: { code: "OPEN", name: "Open", min_year: 1900, max_year: 2026, prereg_fee_cents: 3000, day_of_fee_cents: 4500, capacity: 40, judging_mode: "PEOPLES_CHOICE", award_depth: 1 }, as: Organizer }
            - { call: "POST /events/${ev}/zones", payload: { name: "Vendor Row", zone_type: "VENDOR_ROW", capacity: 10, has_power: true }, as: Organizer, captures: { vz: $.data.id } }
            - { call: "POST /events/${ev}/publish", payload: {}, as: Organizer }
            - { call: "POST /booth-applications", payload: { event_id: "${ev}", business_name: "Single Co", contact_email: "s@example.com", booth_tier: "SINGLE", power_requested: false }, as: Organizer, captures: { b1: $.data.id } }
            - { call: "POST /booth-applications/${b1}/approve", payload: {}, as: Organizer }
            - { call: "POST /booth-applications/${b1}/payments", payload: { amount_cents: 7500, method: "CASH" }, as: Organizer }
            - { call: "POST /booth-applications/${b1}/assign", payload: { zone_id: "${vz}", spaces: [3] }, as: Organizer }
            - { call: "POST /booth-applications", payload: { event_id: "${ev}", business_name: "Double Co", contact_email: "d@example.com", booth_tier: "DOUBLE", power_requested: false }, as: Organizer, captures: { b2: $.data.id } }
            - { call: "POST /booth-applications/${b2}/approve", payload: {}, as: Organizer }
            - { call: "POST /booth-applications/${b2}/payments", payload: { amount_cents: 14000, method: "CARD" }, as: Organizer }
          trigger:
            - { call: "POST /booth-applications/${b2}/assign", payload: { zone_id: "${vz}", spaces: [3, 4] }, as: Organizer, captures: { err1: $.data.error_id } }
            - { call: "POST /booth-applications/${b2}/assign", payload: { zone_id: "${vz}", spaces: [5, 7] }, as: Organizer, captures: { err2: $.data.error_id } }
            - { call: "POST /booth-applications/${b2}/assign", payload: { zone_id: "${vz}", spaces: [5, 6] }, as: Organizer, captures: { st: $.data.status } }
          assert:
            - "[3,4] rejected with ERR_BOOTH_SPACE_CONFLICT (space 3 already occupied)"
            - "[5,7] rejected with ERR_BOOTH_SPACES_NOT_CONTIGUOUS despite both spaces being free"
            - "[5,6] succeeds: status == ASSIGNED; zone assigned_count == 3 total spaces occupied"

  - rule_id: compensating_invariant
    instances:
      - name: treasury_conserved_payment_refund
        grounds:
          - entities.Event.fields.treasury_cents
          - calculations.weather_refund_calc
          - state_machines.Registration.REFUND_REQUESTED_to_REFUNDED
        distinguishing_aspect: |
          Conserved quantity money: after every forward/compensating pair,
          Event.treasury_cents == sum(ENTRY_FEE + BOOTH_FEE payments) - sum(REFUND payments).
          Pay 3000 -> 3000; withdraw at 120h (50% tier) -> refund 1500 -> treasury 1500;
          re-register a second vehicle and pay 3000 -> 4500 == 6000 - 1500.
        test_recipe:
          setup:
            - "Event REGISTRATION_OPEN; registrant with vehicles V1/V2; R1 paid 3000; clock at 2026-08-10T09:00:00Z (120h before gates => 50% tier)"
          setup_api_calls:
            - { call: "POST /events", payload: { name: "Ledger Show", event_date: "2026-08-15", gates_open_at: "2026-08-15T09:00:00Z", judging_start_at: "2026-08-15T12:00:00Z", judging_end_at: "2026-08-15T14:00:00Z", ballot_close_at: "2026-08-15T14:30:00Z", prereg_deadline: "2026-08-14T23:59:59Z", curfew_start: "22:00", curfew_end: "07:00", liability_policy_number: "POL-1", tabulation_method: "STRAIGHT_AVERAGE" }, as: Organizer, captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/classes", payload: { code: "OPEN", name: "Open", min_year: 1900, max_year: 2026, prereg_fee_cents: 3000, day_of_fee_cents: 4500, capacity: 40, judging_mode: "PEOPLES_CHOICE", award_depth: 1 }, as: Organizer, captures: { cl: $.data.id } }
