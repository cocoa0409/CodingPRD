scenario: "785. Photo-Gift & Print Service (Shutterfly style): project (photobook/card/canvas/calendar) & template, photo upload & auto-layout, customization & proof, quantity/finish pricing & promo, production & turnaround, shipping & address book, reorder, holiday surge"
domain_name: "photo-gift-print"
api_prefix: "/"

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: hybrid
  # Customer/Project/Order are peer resources linked by FK (flat), while Photo/Proof
  # nest under Project and Address nests under Customer, and PromoWindow nests under
  # Promotion — a mix of nested sub-resources and cross-cutting FK references.

  state_machine_shape: parallel
  # Order carries two independent status axes (payment_status × fulfillment_status);
  # Project is cyclic (IN_PROOF -> DRAFT revision loop); ProductionJob and Shipment
  # are linear-with-cancel pipelines.

  relationship_patterns:
    - one_to_many          # Customer 1:* Project/Order/Address; Project 1:* Photo/Proof; Order 1:* ProductionJob/Shipment
    - self_referential     # Order.reorder_of_id -> Order.id (reorder chain)
    - cross_aggregate      # Order references Project, Address, Customer across aggregate roots

  role_model: peer_roles
  # Customer owns projects/photos/proofs/orders/addresses; CatalogAdmin owns
  # templates/promotions/surge windows and provisions customers; ProductionOperator
  # owns production jobs and shipments. Non-overlapping resource ownership.

  consistency_model: immediate
  # All cascades (pay -> production job; cancel -> job cancel -> shipment void ->
  # refund; proof approve -> project approve -> photo lock) resolve atomically
  # within the triggering request.

# ---------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# ---------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Login/contact email; unique across customers."
        constraints: "unique; non-empty"
      - name: full_name
        type: string
        source: input
        description: "Account holder name."
      - name: store_credit_cents
        type: integer
        source: system
        description: "Non-negative store-credit balance in cents. Starts at 0; adjusted by POST /customers/{id}/credit-adjustments, debited on STORE_CREDIT payment, credited by WALLET refunds."
        default: 0
        constraints: ">= 0"

  - name: Address
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; owning customer of this address-book entry."
      - name: recipient_name
        type: string
        source: input
        description: "Ship-to recipient name."
      - name: line1
        type: string
        source: input
        description: "Street address line 1."
      - name: line2
        type: string
        source: input
        description: "Street address line 2 (optional)."
        default: null
      - name: city
        type: string
        source: input
        description: "City."
      - name: region
        type: string
        source: input
        description: "State/province code."
      - name: postal_code
        type: string
        source: input
        description: "Postal/ZIP code."
      - name: country
        type: string
        source: input
        description: "ISO country code."
      - name: is_default
        type: boolean
        source: system
        description: "True iff this is the customer's first-created address (default ship-to). Set by the system on creation, never by input."
        default: false

  - name: Template
    parent: null
    common_fields: true
    fields:
      - name: product_type
        type: enum
        source: input
        description: "Gift product kind."
        constraints: "one of {PHOTOBOOK, CARD, CANVAS, CALENDAR}"
      - name: name
        type: string
        source: input
        description: "Human-readable template name."
      - name: status
        type: enum
        source: system
        description: "Lifecycle status; ACTIVE at creation, RETIRED after retire."
        default: ACTIVE
        constraints: "one of {ACTIVE, RETIRED}"
      - name: surface_count
        type: integer
        source: input
        description: "Number of print surfaces (book pages / calendar months / card panels)."
        constraints: ">= 1"
      - name: base_unit_price_cents
        type: integer
        source: input
        description: "Base price per single unit in cents, before finish surcharge and volume discount."
        constraints: ">= 0"
      - name: production_days
        type: integer
        source: input
        description: "Base production lead time in calendar days used by turnaround calculation."
        constraints: ">= 0"
      - name: allowed_finishes
        type: array
        source: input
        description: "Subset of finishes offered for this template."
        constraints: "non-empty subset of {MATTE, GLOSSY, LINEN, LAY_FLAT, METAL}"
      - name: min_photos
        type: integer
        source: input
        description: "Minimum photos required to auto-layout a project on this template."
        constraints: ">= 1"
      - name: max_photos
        type: integer
        source: input
        description: "Maximum photos accepted for auto-layout."
        constraints: ">= min_photos"
      - name: min_dpi
        type: integer
        source: input
        description: "Minimum effective DPI a placed photo must meet to pass print-quality gating."
        default: 150
        constraints: ">= 1"

  - name: Project
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; owner of this design project."
      - name: template_id
        type: string
        source: input
        description: "FK -> Template.id; template the project is built on."
      - name: title
        type: string
        source: input
        description: "Project title."
      - name: state
        type: enum
        source: system
        description: "Design lifecycle state. Cyclic: IN_PROOF can revert to DRAFT on request-changes."
        default: DRAFT
        constraints: "one of {DRAFT, LAID_OUT, IN_PROOF, APPROVED}"
      - name: photo_count
        type: integer
        source: computed
        description: "Count of Photo rows whose project_id == this project. Recomputed on photo upload."
        default: 0
      - name: placed_photo_count
        type: integer
        source: computed
        description: "Count of Photos with status PLACED or LOCKED after auto-layout."
        default: 0
      - name: current_proof_id
        type: string
        source: system
        description: "Id of the latest non-superseded Proof, or null before first proof."
        default: null

  - name: Photo
    parent: Project
    common_fields: false
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; project the photo was uploaded into."
      - name: filename
        type: string
        source: input
        description: "Original filename."
      - name: width_px
        type: integer
        source: input
        description: "Pixel width."
        constraints: ">= 1"
      - name: height_px
        type: integer
        source: input
        description: "Pixel height."
        constraints: ">= 1"
      - name: dpi
        type: integer
        source: input
        description: "Effective print DPI declared for the asset."
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "UPLOADED at upload; PLACED after auto-layout; LOCKED after proof approval; reverts PLACED->UPLOADED when a proof's changes are requested. (Auto-layout rejects the whole request on any low-DPI photo rather than marking individual photos.)"
        default: UPLOADED
        constraints: "one of {UPLOADED, PLACED, LOCKED}"

  - name: Proof
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; project this proof renders."
      - name: revision_number
        type: integer
        source: system
        description: "1-based revision index; each new proof on a project increments over the prior max."
        constraints: ">= 1"
      - name: state
        type: enum
        source: system
        description: "GENERATED at creation; APPROVED on approve; CHANGES_REQUESTED on request-changes; SUPERSEDED when a newer proof is generated."
        default: GENERATED
        constraints: "one of {GENERATED, APPROVED, CHANGES_REQUESTED, SUPERSEDED}"

  - name: Promotion
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Case-sensitive promo code customers enter at quote/checkout; unique."
        constraints: "unique; non-empty"
      - name: kind
        type: enum
        source: input
        description: "Discount kind."
        constraints: "one of {PERCENT, FLAT, FREE_SHIP}"
      - name: value
        type: integer
        source: input
        description: "For PERCENT: whole-percent integer (e.g. 20 == 20%). For FLAT: cents off. For FREE_SHIP: ignored (treated as 0)."
        constraints: ">= 0"
      - name: min_subtotal_cents
        type: integer
        source: input
        description: "Minimum order subtotal (after volume discount) required for the promo to apply."
        default: 0
        constraints: ">= 0"
      - name: stackable
        type: boolean
        source: input
        description: "If false, cannot be combined with any other promo on one order."
        default: false
      - name: per_customer_limit
        type: integer
        source: input
        description: "Max number of PAID orders per customer that may redeem this code."
        default: 1
        constraints: ">= 1"
      - name: product_type_scope
        type: enum
        source: input
        description: "If set, promo applies only to orders whose project template product_type matches; null means all products."
        default: null
        constraints: "null or one of {PHOTOBOOK, CARD, CANVAS, CALENDAR}"

  - name: PromoWindow
    parent: Promotion
    common_fields: true
    fields:
      - name: promotion_id
        type: string
        source: input
        description: "FK -> Promotion.id; promotion whose active interval this window declares."
      - name: starts_at
        type: datetime
        source: input
        description: "Inclusive window start (ISO 8601 UTC)."
      - name: ends_at
        type: datetime
        source: input
        description: "Inclusive window end (ISO 8601 UTC). CLOSED interval [starts_at, ends_at]."
        constraints: "ends_at > starts_at"

  - name: SurgeWindow
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Holiday-surge campaign name."
      - name: starts_at
        type: datetime
        source: input
        description: "Half-open window start (ISO 8601 UTC), inclusive."
      - name: ends_at
        type: datetime
        source: input
        description: "Half-open window end (ISO 8601 UTC), exclusive. HALF-OPEN interval [starts_at, ends_at)."
        constraints: "ends_at > starts_at"
      - name: turnaround_extra_days
        type: integer
        source: input
        description: "Extra production days added to turnaround for jobs scheduled inside this window."
        constraints: ">= 0"
      - name: capacity_per_day
        type: integer
        source: input
        description: "Max total order quantity that may be scheduled into production on any single day inside this window."
        constraints: ">= 1"
      - name: product_type_scope
        type: enum
        source: input
        description: "If set, the surge affects only that product_type; null means all products."
        default: null
        constraints: "null or one of {PHOTOBOOK, CARD, CANVAS, CALENDAR}"

  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; purchasing customer."
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the approved design being printed."
      - name: ship_address_id
        type: string
        source: input
        description: "FK -> Address.id; destination address for this order."
      - name: reorder_of_id
        type: string
        source: system
        description: "FK -> Order.id; set when this order was created via reorder of a prior order, else null."
        default: null
      - name: quantity
        type: integer
        source: input
        description: "Number of copies ordered."
        constraints: ">= 1"
      - name: finish
        type: enum
        source: input
        description: "Chosen finish; must be in the template's allowed_finishes."
        constraints: "one of {MATTE, GLOSSY, LINEN, LAY_FLAT, METAL}"
      - name: ship_method
        type: enum
        source: input
        description: "Shipping speed."
        constraints: "one of {STANDARD, EXPRESS}"
      - name: payment_method
        type: enum
        source: input
        description: "How the order will be paid."
        constraints: "one of {CARD, STORE_CREDIT}"
      - name: promo_codes
        type: array
        source: input
        description: "Zero or more promo codes applied at placement (final variant re-validates each)."
        default: []
      - name: unit_price_cents
        type: integer
        source: computed
        description: "template.base_unit_price_cents + finish surcharge for the chosen finish."
      - name: subtotal_cents
        type: integer
        source: computed
        description: "Volume-discounted line subtotal (see calculations.line_subtotal)."
      - name: discount_cents
        type: integer
        source: computed
        description: "Total promo discount applied at placement (final variant; see calculations.order_total)."
        default: 0
      - name: shipping_cents
        type: integer
        source: computed
        description: "Shipping charge after any FREE_SHIP promo."
      - name: total_cents
        type: integer
        source: computed
        description: "subtotal_cents - discount_cents + shipping_cents (floored at 0)."
      - name: paid_cents
        type: integer
        source: system
        description: "Amount actually captured at payment; equals total_cents at the moment of pay. 0 until paid."
        default: 0
      - name: refund_cents
        type: integer
        source: computed
        description: "Amount refunded on cancellation (see calculations.refund_amount); 0 until cancelled."
        default: 0
      - name: refund_destination
        type: enum
        source: system
        description: "WALLET or CARD; set from the cancel request's refund_destination."
        default: null
        constraints: "null or one of {WALLET, CARD}"
      - name: promised_ship_date
        type: string
        source: computed
        description: "Scheduled-variant promised ship date (YYYY-MM-DD) fixed at payment (see calculations.promised_ship_date)."
        default: null
      - name: payment_status
        type: enum
        source: system
        description: "Payment axis (independent of fulfillment_status)."
        default: UNPAID
        constraints: "one of {UNPAID, PAID, REFUNDED}"
      - name: fulfillment_status
        type: enum
        source: system
        description: "Fulfillment axis (independent of payment_status)."
        default: NEW
        constraints: "one of {NEW, IN_PRODUCTION, SHIPPED, DELIVERED, CANCELLED}"

  - name: ProductionJob
    parent: Order
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; order this job prints."
      - name: quantity
        type: integer
        source: system
        description: "Copied from the order at job creation; counts against daily production capacity."
        constraints: ">= 1"
      - name: scheduled_date
        type: string
        source: system
        description: "Production day (YYYY-MM-DD) set at job creation from the logical clock date at payment time."
      - name: surge_window_id
        type: string
        source: system
        description: "Convenience reference to the SurgeWindow.id covering scheduled_date for the product_type (null if none); read-only denormalized pointer, not an owned relationship."
        default: null
      - name: state
        type: enum
        source: system
        description: "QUEUED at creation; advances PRINTING -> FINISHING -> DONE; CANCELLED on order cancel."
        default: QUEUED
        constraints: "one of {QUEUED, PRINTING, FINISHING, DONE, CANCELLED}"

  - name: Shipment
    parent: Order
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; order being shipped."
      - name: address_id
        type: string
        source: input
        description: "FK -> Address.id; destination address (snapshot of order.ship_address_id at ship time)."
      - name: carrier
        type: string
        source: input
        description: "Carrier name."
      - name: method
        type: enum
        source: input
        description: "Shipping method."
        constraints: "one of {STANDARD, EXPRESS}"
      - name: tracking_code
        type: string
        source: system
        description: "System-minted tracking code."
      - name: state
        type: enum
        source: system
        description: "LABEL_CREATED at creation; advances IN_TRANSIT -> DELIVERED; VOID when the order is cancelled."
        default: LABEL_CREATED
        constraints: "one of {LABEL_CREATED, IN_TRANSIT, DELIVERED, VOID}"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Template
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /templates/{id}/retire"
        actor: CatalogAdmin
        preconditions: ["template.status == ACTIVE"]
        side_effects: ["set status=RETIRED", "increment version by 1"]
        note: "Retired templates reject new project creation (ERR_TEMPLATE_RETIRED) but existing projects/orders are unaffected."

  - entity: Project
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: LAID_OUT
        trigger: "POST /projects/{id}/autolayout"
        actor: Customer
        preconditions:
          - "project.state == DRAFT"
          - "photo_count >= template.min_photos (else ERR_INSUFFICIENT_PHOTOS)"
          - "photo_count <= template.max_photos (else ERR_TOO_MANY_PHOTOS)"
          - "every uploaded Photo has dpi >= template.min_dpi (else ERR_PHOTO_LOW_RESOLUTION)"
        side_effects:
          - "set every Photo.status UPLOADED -> PLACED"
          - "recompute placed_photo_count"
          - "increment project.version by 1"
      - from: LAID_OUT
        to: IN_PROOF
        trigger: "POST /projects/{id}/proofs"
        actor: Customer
        preconditions:
          - "project.state IN {LAID_OUT, IN_PROOF}"
          - "request.expected_project_version == project.version (else ERR_STALE_PROJECT_VERSION)"
        side_effects:
          - "create Proof(state=GENERATED, revision_number = prior_max_revision + 1)"
          - "mark any prior current proof state=SUPERSEDED"
          - "set project.current_proof_id = new proof id"
          - "increment project.version by 1"
        note: "OCC-guarded; see concurrency_rules.proof-generate-stale-project."
      - from: IN_PROOF
        to: IN_PROOF
        trigger: "POST /projects/{id}/proofs"
        actor: Customer
        preconditions:
          - "project.state == IN_PROOF"
          - "request.expected_project_version == project.version (else ERR_STALE_PROJECT_VERSION)"
        side_effects:
          - "create Proof(state=GENERATED, revision_number = prior_max_revision + 1)"
          - "mark prior current proof state=SUPERSEDED"
          - "set project.current_proof_id = new proof id"
          - "increment project.version by 1"
        note: "Regenerating a proof supersedes the prior one; legitimate revision — the true race guarded by OCC."
      - from: IN_PROOF
        to: DRAFT
        trigger: "POST /proofs/{id}/request-changes (proof of this project)"
        actor: Customer
        preconditions:
          - "project.state == IN_PROOF"
          - "target proof.state == GENERATED"
        side_effects:
          - "set proof.state=CHANGES_REQUESTED"
          - "set project.state=DRAFT (revision loop back-edge)"
          - "set every Photo.status PLACED -> UPLOADED (unlock for editing)"
          - "increment project.version by 1"
        note: "Cyclic back-edge DRAFT<-IN_PROOF."
      - from: IN_PROOF
        to: APPROVED
        trigger: "POST /proofs/{id}/approve (proof of this project)"
        actor: Customer
        preconditions:
          - "project.state == IN_PROOF"
          - "target proof.state == GENERATED"
          - "target proof.id == project.current_proof_id"
        side_effects:
          - "set proof.state=APPROVED (cascade hop 1)"
          - "set project.state=APPROVED (cascade hop 2)"
          - "set every Photo.status PLACED -> LOCKED (cascade hop 3)"
          - "increment project.version by 1"
        note: "Cascade Proof->Project->Photo (transitive, depth 3)."

  - entity: Order
    initial_state: "payment_status=UNPAID, fulfillment_status=NEW"
    terminal_states: ["payment_status=REFUNDED", "fulfillment_status=DELIVERED", "fulfillment_status=CANCELLED"]
    transitions:
      # -------- payment axis --------
      - from: "payment_status=UNPAID"
        to: "payment_status=PAID"
        trigger: "POST /orders/{id}/pay"
        actor: Customer
        preconditions:
          - "order.payment_status == UNPAID (else ERR_ORDER_NOT_PAYABLE)"
          - "order.fulfillment_status == NEW"
          - "if payment_method == STORE_CREDIT: customer.store_credit_cents >= order.total_cents (else ERR_INSUFFICIENT_STORE_CREDIT)"
          - "scheduled-day surge capacity admits order.quantity (else ERR_SURGE_CAPACITY_FULL)"
        side_effects:
          - "set payment_status=PAID; set paid_cents = total_cents"
          - "if STORE_CREDIT: debit customer.store_credit_cents by total_cents"
          - "set fulfillment_status=IN_PRODUCTION (cross-axis cascade)"
          - "create ProductionJob(state=QUEUED, quantity=order.quantity, scheduled_date=clock_date, surge_window_id=covering window or null)"
          - "compute promised_ship_date via scheduled variant"
          - "increment order.version by 1"
        note: "Payment axis advance also kicks the fulfillment axis and spawns the ProductionJob."
      - from: "payment_status=PAID"
        to: "payment_status=REFUNDED"
        trigger: "POST /orders/{id}/cancel"
        actor: Customer
        preconditions:
          - "order.fulfillment_status IN {NEW, IN_PRODUCTION} (else ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "set payment_status=REFUNDED"
          - "set refund_destination from request; compute refund_cents via refund_amount"
          - "if refund_destination==WALLET: credit customer.store_credit_cents by refund_cents"
          - "(fulfillment cascade documented on the fulfillment-axis cancel transition)"
          - "increment order.version by 1"
      # -------- fulfillment axis --------
      - from: "fulfillment_status=IN_PRODUCTION"
        to: "fulfillment_status=SHIPPED"
        trigger: "POST /shipments/{id}/advance (LABEL_CREATED->IN_TRANSIT, shipment belongs to this order)"
        actor: ProductionOperator
        preconditions:
          - "order.fulfillment_status == IN_PRODUCTION"
          - "shipment.state == LABEL_CREATED"
        side_effects:
          - "set fulfillment_status=SHIPPED"
          - "increment order.version by 1"
        note: "Shipment creation itself is fulfillment-neutral (order stays IN_PRODUCTION and thus cancellable until the label is dispatched); the axis advances only when the shipment enters transit."
      - from: "fulfillment_status=SHIPPED"
        to: "fulfillment_status=DELIVERED"
        trigger: "POST /shipments/{id}/advance (to DELIVERED)"
        actor: ProductionOperator
        preconditions:
          - "order.fulfillment_status == SHIPPED"
          - "shipment.state == IN_TRANSIT"
        side_effects:
          - "set fulfillment_status=DELIVERED"
          - "increment order.version by 1"
      - from: "fulfillment_status IN {NEW, IN_PRODUCTION}"
        to: "fulfillment_status=CANCELLED"
        trigger: "POST /orders/{id}/cancel"
        actor: Customer
        preconditions:
          - "order.fulfillment_status IN {NEW, IN_PRODUCTION} (else ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "set fulfillment_status=CANCELLED"
          - "cascade hop 1: any ProductionJob of this order not already CANCELLED (including a DONE job) -> state=CANCELLED"
          - "cascade hop 2 (caused by job cancel): the job's scheduled quantity leaves the active capacity sum, freeing scheduled_date capacity"
          - "cascade hop 3 (caused by job cancel): any Shipment of this order in {LABEL_CREATED, IN_TRANSIT} -> state=VOID"
          - "increment order.version by 1"
        note: "Transitive cascade Order->ProductionJob->Shipment (depth 3); the capacity release is the conserved-quantity compensation (surge_day_remaining_capacity restored)."

  - entity: ProductionJob
    initial_state: QUEUED
    terminal_states: [CANCELLED]
    transitions:
      - from: QUEUED
        to: PRINTING
        trigger: "POST /production-jobs/{id}/advance"
        actor: ProductionOperator
        preconditions: ["job.state == QUEUED (else ERR_PRODUCTION_NOT_ADVANCEABLE)"]
        side_effects: ["set state=PRINTING", "increment version by 1"]
      - from: PRINTING
        to: FINISHING
        trigger: "POST /production-jobs/{id}/advance"
        actor: ProductionOperator
        preconditions: ["job.state == PRINTING"]
        side_effects: ["set state=FINISHING", "increment version by 1"]
      - from: FINISHING
        to: DONE
        trigger: "POST /production-jobs/{id}/advance"
        actor: ProductionOperator
        preconditions: ["job.state == FINISHING"]
        side_effects: ["set state=DONE", "increment version by 1"]
        note: "DONE marks production complete but is NOT terminal: an order cancelled pre-dispatch still scraps the DONE job. Advancing a DONE job has no transition -> ERR_PRODUCTION_NOT_ADVANCEABLE."
      - from: "QUEUED|PRINTING|FINISHING|DONE"
        to: CANCELLED
        trigger: "system: cascade from POST /orders/{id}/cancel"
        actor: system
        preconditions: ["job.state != CANCELLED"]
        side_effects: ["set state=CANCELLED", "release scheduled_date capacity (drops job.quantity from the active capacity sum)", "cascade: any Shipment of this order in {LABEL_CREATED, IN_TRANSIT} -> VOID", "increment version by 1"]

  - entity: Shipment
    initial_state: LABEL_CREATED
    terminal_states: [DELIVERED, VOID]
    transitions:
      - from: LABEL_CREATED
        to: IN_TRANSIT
        trigger: "POST /shipments/{id}/advance"
        actor: ProductionOperator
        preconditions: ["shipment.state == LABEL_CREATED (else ERR_SHIPMENT_NOT_ADVANCEABLE)", "order.fulfillment_status == IN_PRODUCTION"]
        side_effects: ["set state=IN_TRANSIT", "set order.fulfillment_status=SHIPPED", "increment version by 1"]
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /shipments/{id}/advance"
        actor: ProductionOperator
        preconditions: ["shipment.state == IN_TRANSIT"]
        side_effects: ["set state=DELIVERED", "set order.fulfillment_status=DELIVERED", "increment version by 1"]
      - from: "LABEL_CREATED|IN_TRANSIT"
        to: VOID
        trigger: "system: cascade from POST /orders/{id}/cancel"
        actor: system
        preconditions: ["shipment.state NOT IN {DELIVERED, VOID}"]
        side_effects: ["set state=VOID", "increment version by 1"]

  - entity: Proof
    initial_state: GENERATED
    terminal_states: [APPROVED, CHANGES_REQUESTED, SUPERSEDED]
    transitions:
      - from: GENERATED
        to: APPROVED
        trigger: "POST /proofs/{id}/approve"
        actor: Customer
        preconditions: ["proof.state == GENERATED (else ERR_PROOF_NOT_PENDING)", "proof.id == project.current_proof_id"]
        side_effects: ["set state=APPROVED", "cascade project approval (see Project IN_PROOF->APPROVED)"]
      - from: GENERATED
        to: CHANGES_REQUESTED
        trigger: "POST /proofs/{id}/request-changes"
        actor: Customer
        preconditions: ["proof.state == GENERATED (else ERR_PROOF_NOT_PENDING)"]
        side_effects: ["set state=CHANGES_REQUESTED", "cascade project revert (see Project IN_PROOF->DRAFT)"]
      - from: GENERATED
        to: SUPERSEDED
        trigger: "system: a newer proof generated on the same project"
        actor: system
        preconditions: ["proof.state == GENERATED"]
        side_effects: ["set state=SUPERSEDED"]

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: proof-generate-stale-project
    parent_entity: Project
    write_endpoint: "POST /projects/{id}/proofs"
    occ_field: "expected_project_version"
    description: |
      Generating a Proof against a Project whose version has advanced since the
      client last read it is rejected on a stale-version check. A new proof
      legitimately supersedes the prior one (revision loop), so a second create
      that still carries the pre-supersede version is a stale write — the version
      the client observed no longer matches the parent's current version.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: line_subtotal
    trigger: "on POST /projects/{id}/quote and on POST /orders (order.subtotal_cents)"
    algorithm: tiered_pricing
    formula: |
      unit_price_cents = template.base_unit_price_cents + FINISH_SURCHARGE_CENTS[finish]
      pre_discount_cents = unit_price_cents * quantity          # exact integer
      tier_pct = VOLUME_TIERS.select_by(quantity)               # average-rate tier: highest min_qty <= quantity
      volume_discount_cents = round_half_up(pre_discount_cents * tier_pct)
      subtotal_cents = pre_discount_cents - volume_discount_cents
    input_set: "Single order line: one template, one finish, one integer quantity. Tier chosen by total quantity (average-rate, applied to the whole pre_discount)."
    constants:
      FINISH_SURCHARGE_CENTS: { MATTE: 0, GLOSSY: 300, LINEN: 700, LAY_FLAT: 1200, METAL: 2500 }
      VOLUME_TIERS: "[{min_qty:1, pct:0.00},{min_qty:10, pct:0.05},{min_qty:25, pct:0.12},{min_qty:50, pct:0.20}]"
    precision: "cents integers; round_half_up on the single volume-discount multiplication"
    variants: []

  - name: promo_discount
    trigger: "on POST /projects/{id}/quote (provisional) and on POST /orders (final)"
    algorithm: aggregation
    formula: |
      # Evaluation order is PINNED and rounding is per-promo-then-sum.
      # 1. Filter applicable promos (see order_total for the provisional/final eligibility differences).
      # 2. Sort applicable promos: PERCENT first, then FLAT, then FREE_SHIP; within a kind by promotion.created_at ASC.
      # 3. For each promo, compute its raw discount against the ORIGINAL subtotal_cents (NOT a running balance):
      #       PERCENT -> raw = subtotal_cents * value / 100
      #       FLAT    -> raw = value
      #       FREE_SHIP -> raw = 0 (handled in shipping instead)
      #    d_i = round_half_up(raw)        # round EACH promo to whole cents BEFORE summing
      # 4. discount_cents = min(subtotal_cents, sum(d_i))   # never exceeds subtotal
      # PINNED: round-per-promo-then-sum (NOT sum-then-round) — the two produce different cents.
    input_set: "The set of applicable promo codes on the order after eligibility filtering."
    constants: {}
    precision: "round_half_up per promo, then integer sum, floored below subtotal_cents"
    variants: []

  - name: order_total
    trigger: "on POST /projects/{id}/quote (provisional_quote) and on POST /orders (final_placement)"
    algorithm: aggregation
    formula: |
      subtotal_cents = line_subtotal(...)
      discount_cents = promo_discount(applicable_promos)
      base_shipping = SHIPPING_CENTS[ship_method]
      shipping_cents = 0 if any applicable promo.kind == FREE_SHIP else base_shipping
      total_cents = max(0, subtotal_cents - discount_cents + shipping_cents)
    input_set: "Order line + promo set + ship_method."
    constants:
      SHIPPING_CENTS: { STANDARD: 799, EXPRESS: 1999 }
    precision: "cents integers"
    variants:
      - name: provisional_quote
        when: "POST /projects/{id}/quote"
        difference: "A promo is applicable iff (code exists) AND (subtotal_cents >= promo.min_subtotal_cents) AND (product_type_scope null or matches). Promo WINDOW state and per_customer_limit are NOT checked — the quote optimistically assumes the promo is live."
      - name: final_placement
        when: "POST /orders"
        difference: "Adds two hard eligibility gates the quote skips: the promo must have an open PromoWindow at the current logical clock ([starts_at, ends_at] inclusive) else ERR_PROMO_NOT_ACTIVE, and the customer's prior PAID redemptions of that code must be < per_customer_limit else ERR_PROMO_LIMIT_EXCEEDED. The quote optimistically returns a discounted total without these gates, so placement can be REJECTED for inputs the quote happily priced — the provisional/final divergence surfaces as quote-success vs order-rejection."

  - name: refund_amount
    trigger: "on POST /orders/{id}/cancel (order.refund_cents)"
    algorithm: aggregation
    formula: |
      # Two valid refund valuations selected by refund_destination.
      captured = order.paid_cents
      if refund_destination == WALLET:
          refund_cents = captured                        # goodwill: full amount to store credit, no fee
      else:  # CARD
          restock_fee = round_half_up(order.subtotal_cents * RESTOCK_PCT)
          refund_cents = max(0, captured - restock_fee)  # cash refund retains restocking fee
    input_set: "The single order being cancelled and its paid_cents/subtotal_cents."
    constants:
      RESTOCK_PCT: 0.10
    precision: "round_half_up on restocking fee"
    variants:
      - name: wallet_refund
        when: "refund_destination == WALLET"
        difference: "Full paid_cents credited to Customer.store_credit_cents; no restocking fee — conserves store credit across pay->cancel."
      - name: cash_refund
        when: "refund_destination == CARD"
        difference: "paid_cents minus round_half_up(subtotal_cents*0.10) restocking fee returned to card; strictly less than the wallet variant for the same order."

  - name: promised_ship_date
    trigger: "on POST /projects/{id}/quote (estimated) and on POST /orders/{id}/pay (scheduled, persisted to order.promised_ship_date)"
    algorithm: threshold
    formula: |
      # Date math is in whole calendar days over the logical clock date.
      METHOD_TRANSIT_DAYS = { STANDARD: 5, EXPRESS: 2 }
      base = clock_date
      surge_extra = covering_surge_window.turnaround_extra_days if a SurgeWindow covers `base`
                    for the product_type (half-open [starts_at, ends_at)) else 0
      promised = base + template.production_days + surge_extra + METHOD_TRANSIT_DAYS[ship_method]
    input_set: "Order line + ship_method + logical clock date + surge windows."
    constants:
      METHOD_TRANSIT_DAYS: { STANDARD: 5, EXPRESS: 2 }
    precision: "calendar days; output YYYY-MM-DD"
    variants:
      - name: estimated
        when: "POST /projects/{id}/quote"
        difference: "surge_extra is always 0 — the quote ignores holiday surge and returns the base turnaround."
      - name: scheduled
        when: "POST /orders/{id}/pay"
        difference: "surge_extra reflects the SurgeWindow (if any) covering the scheduled production date, extending the promised date; can differ from the quote for identical inputs when payment lands inside a surge window."

  - name: surge_day_remaining_capacity
    trigger: "on POST /orders/{id}/pay (capacity admission) and on cancel (capacity release)"
    algorithm: aggregation
    formula: |
      # For the scheduled_date D and the order's product_type:
      w = SurgeWindow covering D (half-open) with matching product_type_scope (null scope matches all)
      if w is null:
          capacity_for_day = DEFAULT_DAILY_CAPACITY        # effectively unconstrained
      else:
          capacity_for_day = w.capacity_per_day
      used = sum(job.quantity) for ProductionJob
             where job.scheduled_date == D
               and job's order.product_type matches w's scope
               and job.state IN {QUEUED, PRINTING, FINISHING}     # CANCELLED/DONE excluded
      remaining = capacity_for_day - used
      # Admission at pay: reject if order.quantity > remaining (ERR_SURGE_CAPACITY_FULL).
      # Cancel sets job.state=CANCELLED, dropping it from `used`, restoring `remaining`.
    input_set: "All ProductionJobs sharing scheduled_date D and the surge window scope; only states {QUEUED,PRINTING,FINISHING} consume capacity."
    constants:
      DEFAULT_DAILY_CAPACITY: 100000
    precision: "integer units"
    variants: []

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /_clock/set_current_utc precondition-free ops"
  - priority: 2
    category: auth
    check: "acting role is permitted for the endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "path/body-referenced resources exist, validated left-to-right (customer, template, project, proof, order, address, promotion, production job, shipment, surge window)"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all id-bearing endpoints"
  - priority: 4
    category: business_referential
    check: "acting Customer (entity_backed) owns the target resource (customer_id chain resolves to X-User-ID)"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "Customer-scoped reads/writes on projects, photos, proofs, orders, addresses"
  - priority: 5
    category: business_constraint
    check: "request body well-formed: required fields present, enum values legal, finish ∈ template.allowed_finishes, positive quantities"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all bodied endpoints"
  - priority: 6
    category: state
    check: "target resource is in a state that admits this transition (project/order/proof/job/shipment state preconditions)"
    error_id: "ERR_INVALID_PROJECT_STATE | ERR_ORDER_NOT_PAYABLE | ERR_ORDER_NOT_CANCELLABLE | ERR_PROOF_NOT_PENDING | ERR_PRODUCTION_NOT_ADVANCEABLE | ERR_SHIPMENT_NOT_ADVANCEABLE"
    http_status: 409
    applies_to: "transition endpoints"
  - priority: 7
    category: state
    check: "cross-entity state guard: POST /orders requires Project.state == APPROVED"
    error_id: ERR_PROJECT_NOT_APPROVED
    http_status: 409
    applies_to: "POST /orders"
  - priority: 8
    category: business_referential
    check: "cross-entity state guard: POST /orders/{id}/shipments requires the order's ProductionJob.state == DONE"
    error_id: ERR_PRODUCTION_NOT_COMPLETE
    http_status: 409
    applies_to: "POST /orders/{id}/shipments"
  - priority: 9
    category: business_safety
    check: "auto-layout print-quality gate: every uploaded Photo has dpi >= template.min_dpi"
    error_id: ERR_PHOTO_LOW_RESOLUTION
    http_status: 422
    applies_to: "POST /projects/{id}/autolayout"
  - priority: 10
    category: business_constraint
    check: "auto-layout photo-count floor: photo_count >= template.min_photos"
    error_id: ERR_INSUFFICIENT_PHOTOS
    http_status: 422
    applies_to: "POST /projects/{id}/autolayout"
  - priority: 11
    category: business_constraint
    check: "auto-layout photo-count ceiling: photo_count <= template.max_photos"
    error_id: ERR_TOO_MANY_PHOTOS
    http_status: 422
    applies_to: "POST /projects/{id}/autolayout"
  - priority: 12
    category: business_constraint
    check: "project creation forbidden on a RETIRED template"
    error_id: ERR_TEMPLATE_RETIRED
    http_status: 409
    applies_to: "POST /projects"
  - priority: 13
    category: business_constraint
    check: "if >1 promo code supplied, every promo must be stackable"
    error_id: ERR_PROMO_NOT_STACKABLE
    http_status: 409
    applies_to: "POST /orders, POST /projects/{id}/quote"
  - priority: 14
    category: business_temporal
    check: "final placement: each promo has an open PromoWindow at the logical clock (inclusive)"
    error_id: ERR_PROMO_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /orders"
  - priority: 15
    category: business_constraint
    check: "final placement: customer prior PAID redemptions of the code < per_customer_limit"
    error_id: ERR_PROMO_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /orders"
  - priority: 16
    category: business_fiscal
    check: "each applied promo requires subtotal_cents >= promo.min_subtotal_cents"
    error_id: ERR_PROMO_MIN_NOT_MET
    http_status: 409
    applies_to: "POST /orders, POST /projects/{id}/quote"
  - priority: 17
    category: business_constraint
    check: "scheduled-day surge capacity admits order.quantity"
    error_id: ERR_SURGE_CAPACITY_FULL
    http_status: 409
    applies_to: "POST /orders/{id}/pay"
  - priority: 18
    category: business_fiscal
    check: "STORE_CREDIT payment requires customer.store_credit_cents >= order.total_cents"
    error_id: ERR_INSUFFICIENT_STORE_CREDIT
    http_status: 402
    applies_to: "POST /orders/{id}/pay"
  - priority: 19
    category: business_temporal
    check: "new PromoWindow must not overlap an existing window of the same promotion, and must be separated from every existing window by >= PROMO_WINDOW_BUFFER_DAYS = 2 calendar days (closed intervals [starts_at, ends_at], buffered): reject unless (new.starts_at - existing.ends_at >= 2 days) OR (existing.starts_at - new.ends_at >= 2 days)"
    error_id: ERR_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /promotions/{id}/windows"
  - priority: 20
    category: business_temporal
    check: "new SurgeWindow must not overlap any existing surge window (half-open intervals; touching endpoints allowed)"
    error_id: ERR_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /surge-windows"
  - priority: 21
    category: business_constraint
    check: "OCC: expected_project_version must equal project.version"
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /projects/{id}/proofs"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default (never real wall-clock)."
    roles: [CatalogAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["sets logical clock used by promo windows, surge windows, scheduled dates, promised_ship_date"]

  - method: POST
    path: "/customers"
    description: "Provision a customer account."
    roles: [CatalogAdmin]
    code: 201
    input: [email, full_name]
    output: Customer
    side_effects: ["create Customer with store_credit_cents=0"]
  - method: GET
    path: "/customers/{id}"
    description: "Fetch a customer."
    roles: [Customer, CatalogAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: POST
    path: "/customers/{id}/credit-adjustments"
    description: "Operator adjusts a customer's store-credit balance (customer-service grant/debit)."
    roles: [CatalogAdmin]
    code: 200
    input: [amount_cents, reason]
    output: Customer
    side_effects: ["add amount_cents to customer.store_credit_cents (may be negative, floored at 0)", "increment customer.version by 1"]
  - method: POST
    path: "/customers/{id}/addresses"
    description: "Add an address-book entry."
    roles: [Customer]
    code: 201
    input: [recipient_name, line1, "line2?", city, region, postal_code, country]
    output: Address
    side_effects: ["create Address; is_default=true iff it is the customer's first address"]
  - method: GET
    path: "/customers/{id}/addresses"
    description: "List a customer's addresses (reverse-reachability for Address.customer_id)."
    roles: [Customer, CatalogAdmin]
    code: 200
    input: []
    output: Address[]
    side_effects: []

  - method: POST
    path: "/templates"
    description: "Create a product template."
    roles: [CatalogAdmin]
    code: 201
    input: [product_type, name, surface_count, base_unit_price_cents, production_days, allowed_finishes, min_photos, max_photos, "min_dpi?"]
    output: Template
    side_effects: ["create Template status=ACTIVE"]
  - method: GET
    path: "/templates/{id}"
    description: "Fetch a template."
    roles: [Customer, CatalogAdmin]
    code: 200
    input: []
    output: Template
    side_effects: []
  - method: POST
    path: "/templates/{id}/retire"
    description: "Retire a template (ACTIVE->RETIRED)."
    roles: [CatalogAdmin]
    code: 200
    input: []
    output: Template
    side_effects: ["set status=RETIRED", "increment version by 1"]

  - method: POST
    path: "/projects"
    description: "Create a design project on a template."
    roles: [Customer]
    code: 201
    input: [customer_id, template_id, title]
    output: Project
    side_effects: ["create Project state=DRAFT; reject if template RETIRED (ERR_TEMPLATE_RETIRED)"]
  - method: GET
    path: "/projects/{id}"
    description: "Fetch a project."
    roles: [Customer, CatalogAdmin]
    code: 200
    input: []
    output: Project
    side_effects: []
  - method: GET
    path: "/projects"
    description: "List/filter projects (reverse-reachability for Project.customer_id and Project.template_id)."
    roles: [Customer, CatalogAdmin]
    code: 200
    input: ["customer_id?", "template_id?"]
    output: Project[]
    side_effects: []
  - method: POST
    path: "/projects/{id}/photos"
    description: "Upload a photo into a project."
    roles: [Customer]
    code: 201
    input: [filename, width_px, height_px, dpi]
    output: Photo
    side_effects: ["create Photo status=UPLOADED", "increment project.photo_count", "increment project.version by 1"]
  - method: GET
    path: "/projects/{id}/photos"
    description: "List a project's photos (reverse-reachability for Photo.project_id)."
    roles: [Customer, CatalogAdmin]
    code: 200
    input: []
    output: Photo[]
    side_effects: []
  - method: POST
    path: "/projects/{id}/autolayout"
    description: "Auto-layout the project: place photos, enforce count/DPI gates (DRAFT->LAID_OUT)."
    roles: [Customer]
    code: 200
    input: []
    output: Project
    side_effects: ["set each Photo UPLOADED->PLACED", "set state=LAID_OUT", "recompute placed_photo_count", "increment version by 1"]
  - method: POST
    path: "/projects/{id}/proofs"
    description: "Generate a proof (LAID_OUT/IN_PROOF -> IN_PROOF); OCC-guarded on project version."
    roles: [Customer]
    code: 201
    input: [expected_project_version]
    output: Proof
    side_effects: ["create Proof GENERATED", "supersede prior current proof", "set project.current_proof_id", "set state=IN_PROOF", "increment project.version by 1"]
  - method: GET
    path: "/projects/{id}/proofs"
    description: "List a project's proofs (reverse-reachability for Proof.project_id)."
    roles: [Customer, CatalogAdmin]
    code: 200
    input: []
    output: Proof[]
    side_effects: []
  - method: POST
    path: "/proofs/{id}/approve"
    description: "Approve a proof; cascades Proof->Project->Photo."
    roles: [Customer]
    code: 200
    input: []
    output: Proof
    side_effects: ["set proof.state=APPROVED", "set project.state=APPROVED", "set each Photo PLACED->LOCKED", "increment project.version by 1"]
  - method: POST
    path: "/proofs/{id}/request-changes"
    description: "Reject a proof; reverts project IN_PROOF->DRAFT (revision loop)."
    roles: [Customer]
    code: 200
    input: ["note?"]
    output: Proof
    side_effects: ["set proof.state=CHANGES_REQUESTED", "set project.state=DRAFT", "unlock photos PLACED->UPLOADED", "increment project.version by 1"]

  - method: POST
    path: "/projects/{id}/quote"
    description: "Provisional price/turnaround quote (order_total.provisional_quote, promised_ship_date.estimated). No approval required."
    roles: [Customer]
    code: 200
    input: [quantity, finish, ship_method, "ship_address_id?", "promo_codes?"]
    output: "{ unit_price_cents: integer, subtotal_cents: integer, discount_cents: integer, shipping_cents: integer, total_cents: integer, promised_ship_date: string }"
    side_effects: []
  - method: POST
    path: "/orders"
    description: "Place an order (final_placement variant). Requires Project.state==APPROVED."
    roles: [Customer]
    code: 201
    input: [project_id, quantity, finish, ship_method, ship_address_id, payment_method, "promo_codes?"]
    output: Order
    side_effects: ["create Order payment_status=UNPAID, fulfillment_status=NEW", "compute subtotal/discount/shipping/total via final_placement"]
  - method: GET
    path: "/orders/{id}"
    description: "Fetch an order."
    roles: [Customer, ProductionOperator, CatalogAdmin]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: GET
    path: "/orders"
    description: "List/filter orders (reverse-reachability for Order.customer_id, Order.project_id, Order.reorder_of_id, Order.ship_address_id)."
    roles: [Customer, ProductionOperator, CatalogAdmin]
    code: 200
    input: ["customer_id?", "project_id?", "reorder_of_id?", "ship_address_id?"]
    output: Order[]
    side_effects: []
  - method: POST
    path: "/orders/{id}/pay"
    description: "Pay an order; kicks fulfillment to IN_PRODUCTION and spawns a ProductionJob."
    roles: [Customer]
    code: 200
    input: []
    output: Order
    side_effects: ["payment_status UNPAID->PAID; paid_cents=total_cents", "debit store credit if STORE_CREDIT", "fulfillment NEW->IN_PRODUCTION", "create ProductionJob QUEUED (capacity admission)", "set promised_ship_date (scheduled variant)", "increment version by 1"]
  - method: POST
    path: "/orders/{id}/cancel"
    description: "Cancel an order; cascades job cancel -> shipment void, and refunds."
    roles: [Customer]
    code: 200
    input: [refund_destination]
    output: Order
    side_effects: ["fulfillment ->CANCELLED", "if PAID: payment ->REFUNDED, compute refund_cents, credit store credit if WALLET", "cascade ProductionJob->CANCELLED (release capacity) -> Shipment->VOID", "increment version by 1"]
  - method: POST
    path: "/orders/{id}/reorder"
    description: "Create a new UNPAID order cloning a prior order's line (self-FK reorder_of_id). Uses live prices."
    roles: [Customer]
    code: 201
    input: ["ship_address_id?", "ship_method?"]
    output: Order
    side_effects: ["create Order with reorder_of_id=source order id; quantity/finish/project copied; prices recomputed at current clock"]

  - method: GET
    path: "/orders/{id}/production-job"
    description: "List the order's production jobs (reverse-reachability for ProductionJob.order_id)."
    roles: [Customer, ProductionOperator, CatalogAdmin]
    code: 200
    input: []
    output: ProductionJob[]
    side_effects: []
  - method: POST
    path: "/production-jobs/{id}/advance"
    description: "Advance a production job one step (QUEUED->PRINTING->FINISHING->DONE)."
    roles: [ProductionOperator]
    code: 200
    input: []
    output: ProductionJob
    side_effects: ["advance state one step", "increment version by 1"]

  - method: POST
    path: "/orders/{id}/shipments"
    description: "Create a shipment (requires ProductionJob DONE); fulfillment IN_PRODUCTION->SHIPPED."
    roles: [ProductionOperator]
    code: 201
    input: [address_id, carrier, method]
    output: Shipment
    side_effects: ["create Shipment LABEL_CREATED (fulfillment-neutral: order stays IN_PRODUCTION)", "requires the order's ProductionJob.state==DONE (ERR_PRODUCTION_NOT_COMPLETE)"]
  - method: GET
    path: "/shipments/{id}"
    description: "Fetch a shipment."
    roles: [Customer, ProductionOperator, CatalogAdmin]
    code: 200
    input: []
    output: Shipment
    side_effects: []
  - method: GET
    path: "/shipments"
    description: "List/filter shipments (reverse-reachability for Shipment.order_id and Shipment.address_id)."
    roles: [Customer, ProductionOperator, CatalogAdmin]
    code: 200
    input: ["order_id?", "address_id?"]
    output: Shipment[]
    side_effects: []
  - method: POST
    path: "/shipments/{id}/advance"
    description: "Advance a shipment one step (LABEL_CREATED->IN_TRANSIT->DELIVERED)."
    roles: [ProductionOperator]
    code: 200
    input: []
    output: Shipment
    side_effects: ["advance state one step", "on IN_TRANSIT set order.fulfillment_status=SHIPPED", "on DELIVERED set order.fulfillment_status=DELIVERED", "increment version by 1"]

  - method: POST
    path: "/promotions"
    description: "Create a promotion definition."
    roles: [CatalogAdmin]
    code: 201
    input: [code, kind, value, "min_subtotal_cents?", "stackable?", "per_customer_limit?", "product_type_scope?"]
    output: Promotion
    side_effects: ["create Promotion"]
  - method: GET
    path: "/promotions/{id}"
    description: "Fetch a promotion."
    roles: [Customer, CatalogAdmin]
    code: 200
    input: []
    output: Promotion
    side_effects: []
  - method: POST
    path: "/promotions/{id}/windows"
    description: "Add an active window to a promotion (closed, buffered; overlap/buffer rejected)."
    roles: [CatalogAdmin]
    code: 201
    input: [starts_at, ends_at]
    output: PromoWindow
    side_effects: ["create PromoWindow after overlap+buffer check"]
  - method: GET
    path: "/promotions/{id}/windows"
    description: "List a promotion's windows (reverse-reachability for PromoWindow.promotion_id)."
    roles: [CatalogAdmin]
    code: 200
    input: []
    output: PromoWindow[]
    side_effects: []

  - method: POST
    path: "/surge-windows"
    description: "Create a holiday-surge window (half-open; overlap rejected)."
    roles: [CatalogAdmin]
    code: 201
    input: [name, starts_at, ends_at, turnaround_extra_days, capacity_per_day, "product_type_scope?"]
    output: SurgeWindow
    side_effects: ["create SurgeWindow after overlap check"]
  - method: GET
    path: "/surge-windows/{id}"
    description: "Fetch a surge window."
    roles: [CatalogAdmin, ProductionOperator]
    code: 200
    input: []
    output: SurgeWindow
    side_effects: []

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Authenticated role not permitted for this endpoint."
  - id: ERR_FORBIDDEN_OWNERSHIP
    http: 403
    condition: "Customer acts on a resource whose owning customer_id != X-User-ID."
  - id: ERR_VALIDATION
    http: 422
    condition: "Missing required field, illegal enum, non-positive quantity, or finish not in template.allowed_finishes."
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "Referenced customer id does not exist."
  - id: ERR_TEMPLATE_NOT_FOUND
    http: 404
    condition: "Referenced template id does not exist."
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "Referenced project id does not exist."
  - id: ERR_PROOF_NOT_FOUND
    http: 404
    condition: "Referenced proof id does not exist."
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "Referenced order id does not exist."
  - id: ERR_ADDRESS_NOT_FOUND
    http: 404
    condition: "Referenced address id does not exist."
  - id: ERR_PROMOTION_NOT_FOUND
    http: 404
    condition: "Referenced promotion id does not exist."
  - id: ERR_PRODUCTION_JOB_NOT_FOUND
    http: 404
    condition: "Referenced production job id does not exist."
  - id: ERR_SHIPMENT_NOT_FOUND
    http: 404
    condition: "Referenced shipment id does not exist."
  - id: ERR_SURGE_WINDOW_NOT_FOUND
    http: 404
    condition: "Referenced surge window id does not exist."
  - id: ERR_TEMPLATE_RETIRED
    http: 409
    condition: "Creating a project on a RETIRED template."
  - id: ERR_INVALID_PROJECT_STATE
    http: 409
    condition: "Auto-layout/proof from a project state that does not admit the transition."
  - id: ERR_INSUFFICIENT_PHOTOS
    http: 422
    condition: "Auto-layout with photo_count < template.min_photos (includes the empty-photo-set boundary)."
  - id: ERR_TOO_MANY_PHOTOS
    http: 422
    condition: "Auto-layout with photo_count > template.max_photos."
  - id: ERR_PHOTO_LOW_RESOLUTION
    http: 422
    condition: "Auto-layout while some uploaded photo has dpi < template.min_dpi."
  - id: ERR_PROOF_NOT_PENDING
    http: 409
    condition: "Approve/request-changes on a proof whose state != GENERATED."
  - id: ERR_PROJECT_NOT_APPROVED
    http: 409
    condition: "Placing an order whose project.state != APPROVED."
  - id: ERR_PROMO_NOT_STACKABLE
    http: 409
    condition: "More than one promo code supplied but at least one is not stackable."
  - id: ERR_PROMO_NOT_ACTIVE
    http: 409
    condition: "At placement, a promo has no open PromoWindow at the current logical clock."
  - id: ERR_PROMO_LIMIT_EXCEEDED
    http: 409
    condition: "At placement, customer's prior PAID redemptions of the code reached per_customer_limit."
  - id: ERR_PROMO_MIN_NOT_MET
    http: 409
    condition: "An applied promo requires subtotal_cents >= min_subtotal_cents and it is not met."
  - id: ERR_ORDER_NOT_PAYABLE
    http: 409
    condition: "Pay on an order whose payment_status != UNPAID."
  - id: ERR_INSUFFICIENT_STORE_CREDIT
    http: 402
    condition: "STORE_CREDIT payment where store_credit_cents < total_cents."
  - id: ERR_SURGE_CAPACITY_FULL
    http: 409
    condition: "Payment would schedule quantity exceeding the scheduled day's surge capacity."
  - id: ERR_ORDER_NOT_CANCELLABLE
    http: 409
    condition: "Cancel on an order whose fulfillment_status is SHIPPED, DELIVERED, or already CANCELLED."
  - id: ERR_PRODUCTION_NOT_COMPLETE
    http: 409
    condition: "Creating a shipment before the order's ProductionJob reaches DONE."
  - id: ERR_PRODUCTION_NOT_ADVANCEABLE
    http: 409
    condition: "Advancing a production job in a terminal (DONE/CANCELLED) state."
  - id: ERR_SHIPMENT_NOT_ADVANCEABLE
    http: 409
    condition: "Advancing a shipment in a terminal (DELIVERED/VOID) state."
  - id: ERR_WINDOW_OVERLAP
    http: 409
    condition: "New promo window overlaps/violates buffer against a sibling window, or new surge window overlaps an existing one."
  - id: ERR_STALE_PROJECT_VERSION
    http: 412
    condition: "expected_project_version != project.version on proof generation (OCC)."

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: Customer
    description: "End user who designs projects, uploads photos, approves proofs, places/pays/cancels/reorders orders, and manages their address book."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /customers/{id}/addresses"
      - "POST /projects"
      - "POST /projects/{id}/photos"
      - "POST /projects/{id}/autolayout"
      - "POST /projects/{id}/proofs"
      - "POST /proofs/{id}/approve"
      - "POST /proofs/{id}/request-changes"
      - "POST /projects/{id}/quote"
      - "POST /orders"
      - "POST /orders/{id}/pay"
      - "POST /orders/{id}/cancel"
      - "POST /orders/{id}/reorder"
    shared_operations:
      - "GET /customers/{id}"
      - "GET /customers/{id}/addresses"
      - "GET /templates/{id}"
      - "GET /projects/{id}"
      - "GET /projects"
      - "GET /projects/{id}/photos"
      - "GET /projects/{id}/proofs"
      - "GET /orders/{id}"
      - "GET /orders"
      - "GET /orders/{id}/production-job"
      - "GET /shipments/{id}"
      - "GET /shipments"
      - "GET /promotions/{id}"

  - name: CatalogAdmin
    description: "Operator who provisions customers, manages templates, promotions, promo windows, surge windows, credit adjustments, and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /customers"
      - "POST /customers/{id}/credit-adjustments"
      - "POST /templates"
      - "POST /templates/{id}/retire"
      - "POST /promotions"
      - "POST /promotions/{id}/windows"
      - "GET /promotions/{id}/windows"
      - "POST /surge-windows"
    shared_operations:
      - "GET /customers/{id}"
      - "GET /customers/{id}/addresses"
      - "GET /templates/{id}"
      - "GET /projects/{id}"
      - "GET /projects"
      - "GET /projects/{id}/photos"
      - "GET /projects/{id}/proofs"
      - "GET /orders/{id}"
      - "GET /orders"
      - "GET /orders/{id}/production-job"
      - "GET /shipments/{id}"
      - "GET /shipments"
      - "GET /promotions/{id}"
      - "GET /surge-windows/{id}"

  - name: ProductionOperator
    description: "Fulfillment operator who advances production jobs, creates shipments, and advances shipments."
    identity: "opaque"
    exclusive_operations:
      - "POST /production-jobs/{id}/advance"
      - "POST /orders/{id}/shipments"
      - "POST /shipments/{id}/advance"
    shared_operations:
      - "GET /orders/{id}"
      - "GET /orders"
      - "GET /orders/{id}/production-job"
      - "GET /shipments/{id}"
      - "GET /shipments"
      - "GET /surge-windows/{id}"
