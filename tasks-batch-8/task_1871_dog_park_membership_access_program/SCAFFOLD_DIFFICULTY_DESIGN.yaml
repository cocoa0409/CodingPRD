          assert:
            - "ParkArea.${a_id}.current_occupancy == 0 before any visit"
            - "ParkArea.${a_id}.current_occupancy == 2 after two check-ins"
            - "ParkArea.${a_id}.current_occupancy == 0 after both compensating check-outs (invariant: occupancy restored exactly)"

      - name: guest_pass_purchase_void_conservation
        grounds:
          - calculations.guest_monthly_usage
          - state_machines.GuestPass.ISSUED_to_VOID
          - entities.Member.fields.guest_passes_used_this_month
          - errors[ERR_GUEST_PASS_NOT_VOIDABLE]
        distinguishing_aspect: |
          Conserved quantity = sponsor's monthly guest-pass allotment: purchase
          (+1) paired with compensating void (-1) leaves usage unchanged, while a
          REDEEMED pass can never be voided and stays counted — distinct quantity
          from the area-occupancy instance above.
        test_recipe:
          setup:
            - "Clock 2026-08-01; SMALL area capacity 4; member A active (no passes yet)"
          setup_api_calls:
            - call: "POST /dog-park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ParkAdmin
            - call: "POST /dog-park/areas"
              payload: { name: "Small Side", size_class_restriction: "SMALL", capacity: 4, peak_capacity: 4 }
              as: ParkAdmin
              captures: { a_id: $.data.id }
            - call: "POST /dog-park/members"
              payload: { full_name: "Spon Sor", email: "sponsor@x.com" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /dog-park/members/${m_id}/dogs"
              payload: { name: "Pip", size_class: "SMALL", license_number: "LIC-1", vaccination_expires_on: "2027-06-01" }
              as: Member
              as_user_id: "${m_id}"
              captures: { d_id: $.data.id }
            - call: "POST /dog-park/dogs/${d_id}/verify"
              payload: { decision: "VERIFIED" }
              as: ParkAdmin
            - call: "POST /dog-park/members/${m_id}/memberships"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /dog-park/guest-passes"
              payload: { guest_dog_size_class: "SMALL", valid_on: "2026-08-03" }
              as: Member
              as_user_id: "${m_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /dog-park/guest-passes"
              payload: { guest_dog_size_class: "SMALL", valid_on: "2026-08-04" }
              as: Member
              as_user_id: "${m_id}"
              captures: { p2_id: $.data.id }
            - call: "GET /dog-park/members/${m_id}"
              payload: {}
              as: ParkAdmin
              captures: { gu2: $.data.guest_passes_used_this_month }
            - call: "POST /dog-park/guest-passes/${p1_id}/void"
              payload: {}
              as: ParkAdmin
            - call: "GET /dog-park/members/${m_id}"
              payload: {}
              as: ParkAdmin
              captures: { gu1: $.data.guest_passes_used_this_month }
            - call: "POST /dog-park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T10:00:00Z" }
              as: ParkAdmin
            - call: "POST /dog-park/visits/check-in"
              payload: { area_id: "${a_id}", guest_pass_id: "${p2_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { gv_id: $.data.id }
            - call: "POST /dog-park/guest-passes"
              payload: { guest_dog_size_class: "SMALL", valid_on: "2026-08-05" }
              as: Member
              as_user_id: "${m_id}"
              captures: { p3_id: $.data.id }
            - call: "POST /dog-park/guest-passes/${p2_id}/void"
              payload: {}
              as: ParkAdmin
              captures: { err: $.data.error_id }
            - call: "GET /dog-park/members/${m_id}"
              payload: {}
              as: ParkAdmin
              captures: { gu_final: $.data.guest_passes_used_this_month }
          assert:
            - "after 2 purchases: guest_passes_used_this_month == 2"
            - "after voiding ISSUED pass ${p1_id}: guest_passes_used_this_month == 1 (void compensates purchase)"
            - "pass ${p2_id} redeemed into visit ${gv_id} (ISSUED -> REDEEMED)"
            - "voiding REDEEMED pass ${p2_id}: error_id == ERR_GUEST_PASS_NOT_VOIDABLE (no compensation for redeemed)"
            - "final guest_passes_used_this_month == 2 (REDEEMED p2 + ISSUED p3 counted; VOID p1 excluded)"
