          trigger:
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "INHERENT", likelihood: 4, impact: 3, expected_risk_version: "${v1}" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { snap: $.data.inherent_score } }
            - { call: "GET /risks/${risk_id}", as: InternalAuditor, as_user_id: "user_aud_1" }
          assert:
            - "captured snap == 12 (computed in the same request)"
            - "Risk.${risk_id}.inherent_score == 12 and status == ASSESSED and version == (captured v1) + 1"
