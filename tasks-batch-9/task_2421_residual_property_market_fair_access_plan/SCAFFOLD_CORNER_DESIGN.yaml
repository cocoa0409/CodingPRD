            - call: "POST /fair-plan/policies"
              payload: { application_id: "${app_id}", effective_date: "2026-09-01" }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { bind_sod_err: $.data.error_id }
            - call: "POST /fair-plan/policies"
              payload: { application_id: "${app_id}", effective_date: "2026-09-01" }
              as: Underwriter
              as_user_id: "uw-2"
              captures: { pol_id: $.data.id }
          assert:
            - "the waiver by insp-1 returns status 409 with ${waiver_sod_err} == ERR_SEGREGATION_OF_DUTIES and leaves ImprovementRequirement.${req_id}.status == OPEN"
            - "the waiver by uw-2 returns status 200, ImprovementRequirement.${req_id}.status == WAIVED, Inspection.${insp_id}.open_requirement_count == 0 with cleared_major_count == 0, and Application.${app_id}.status == APPROVED_TO_BIND"
            - "the bind by uw-1 returns status 409 with ${bind_sod_err} == ERR_SEGREGATION_OF_DUTIES and Application.${app_id}.status is still APPROVED_TO_BIND"
            - "the bind by uw-2 returns status 201"
            - "Policy.${pol_id}.condition_score_at_bind == 88"
            - "Policy.${pol_id}.base_premium_cents == 607500"
            - "Policy.${pol_id}.annual_premium_cents == 546750"
            - "Policy.${pol_id}.annual_premium_cents == 607500 + 0 - 60750 - 0, i.e. the -0.10 condition adjustment alone: with cleared_major_count == 0 the improvement credit is 0 cents, so a WAIVED MINOR requirement earns no premium credit"
            - "Policy.${pol_id}.commission_credited_cents == 54675"
            - "Application.${app_id}.eligibility_reviewer_user_id == uw-1"

  - section: complexity_layers
    instances:
      - name: rate_filing_create_with_a_stale_zone_version_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[rate-filing-create-stale-zone]
          - validations[priority=7]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "The zone version the analyst carries goes stale twice over between reads — once when the first filing is created and once when that filing is approved — so a second filing quoting version 1 is refused with 412 ERR_STALE_VERSION even though no state precondition blocks a coexisting FILED row; re-reading the zone (now version 3) and resubmitting the identical body succeeds and leaves the zone at version 4."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; one HURRICANE zone created at version 1."
            - "One BASIC_FIRE_EO filing at 900 / 800 effective 2026-08-01 created against version 1 (zone -> version 2) and APPROVED (zone -> version 3)."
          setup_api_calls:
            - call: "POST /fair-plan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /fair-plan/cat-zones"
              payload: { code: "HUR-01", peril: "HURRICANE", exposure_cap_cents: 900000000 }
              as: PlanAdmin
              captures: { zone_id: $.data.id, zone_v: $.data.version }
            - call: "POST /fair-plan/rate-filings"
              payload: { cat_zone_id: "${zone_id}", peril_package: "BASIC_FIRE_EO", filed_rate_per_1000_cents: 900, voluntary_market_avg_rate_per_1000_cents: 800, effective_date: "2026-08-01", expected_zone_version: "${zone_v}" }
              as: RateAnalyst
              as_user_id: "ra-1"
              captures: { filing1_id: $.data.id }
            - call: "POST /fair-plan/rate-filings/${filing1_id}/review"
              payload: { decision: "APPROVE" }
              as: Regulator
              as_user_id: "reg-1"
          trigger:
            - call: "POST /fair-plan/rate-filings"
              payload: { cat_zone_id: "${zone_id}", peril_package: "BASIC_FIRE_EO", filed_rate_per_1000_cents: 950, voluntary_market_avg_rate_per_1000_cents: 800, effective_date: "2026-10-01", expected_zone_version: "${zone_v}" }
              as: RateAnalyst
              as_user_id: "ra-1"
              captures: { stale_err: $.data.error_id }
            - call: "GET /fair-plan/cat-zones/${zone_id}"
              payload: {}
              as: RateAnalyst
              as_user_id: "ra-1"
              captures: { zone_v_now: $.data.version }
            - call: "POST /fair-plan/rate-filings"
              payload: { cat_zone_id: "${zone_id}", peril_package: "BASIC_FIRE_EO", filed_rate_per_1000_cents: 950, voluntary_market_avg_rate_per_1000_cents: 800, effective_date: "2026-10-01", expected_zone_version: "${zone_v_now}" }
              as: RateAnalyst
              as_user_id: "ra-1"
              captures: { filing2_id: $.data.id }
          assert:
            - "the setup capture ${zone_v} was 1"
            - "the stale attempt returns status 412 with ${stale_err} == ERR_STALE_VERSION"
            - "the re-read reports ${zone_v_now} == 3 (create +1, approval +1)"
            - "the retry returns status 201"
            - "RateFiling.${filing2_id}.status == FILED"
            - "RateFiling.${filing2_id}.filed_rate_per_1000_cents == 950"
            - "RateFiling.${filing1_id}.status == APPROVED (the stale attempt neither superseded nor mutated it)"
            - "CatastropheZone.${zone_id}.version == 4"
            - "GET /fair-plan/cat-zones/${zone_id}/rate-filings as Regulator reports total_count == 2"

      - name: allocation_run_with_a_stale_assessment_version_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[allocation-run-stale-assessment]
          - validations[priority=7]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "A supersede re-run is legal from ALLOCATED, so only the version guard can stop the second caller: re-running with the version captured at event creation returns 412 ERR_STALE_VERSION and leaves allocation_run_count at 1, while re-reading the event (version 2) and re-running succeeds, raising allocation_run_count to 2 and rebuilding the same 30000000 / 30000000 / 40000000 set."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; three ACTIVE member insurers with market_share_pct 30.00 / 30.00 / 40.00; one HURRICANE zone."
            - "One MARKET_SHARE assessment event with trigger_loss_cents 200000000 and reserve_balance_cents_at_trigger 100000000 (assessable 100000000), already allocated once with the version captured at creation."
          setup_api_calls:
            - call: "POST /fair-plan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /fair-plan/member-insurers"
              payload: { name: "Carrier One", naic_code: "10001", market_share_pct: 30.00, written_premium_share_pct: 10.00 }
              as: PlanAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /fair-plan/member-insurers"
              payload: { name: "Carrier Two", naic_code: "10002", market_share_pct: 30.00, written_premium_share_pct: 10.00 }
              as: PlanAdmin
              captures: { m2_id: $.data.id }
            - call: "POST /fair-plan/member-insurers"
              payload: { name: "Carrier Three", naic_code: "10003", market_share_pct: 40.00, written_premium_share_pct: 80.00 }
              as: PlanAdmin
              captures: { m3_id: $.data.id }
            - call: "POST /fair-plan/cat-zones"
              payload: { code: "HUR-01", peril: "HURRICANE", exposure_cap_cents: 900000000 }
              as: PlanAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /fair-plan/assessment-events"
              payload: { cat_zone_id: "${zone_id}", trigger_loss_cents: 200000000, reserve_balance_cents_at_trigger: 100000000, allocation_basis: "MARKET_SHARE" }
              as: PlanAdmin
              captures: { ev_id: $.data.id, ev_v: $.data.version }
            - call: "POST /fair-plan/assessment-events/${ev_id}/allocation-run"
              payload: { expected_assessment_event_version: "${ev_v}" }
              as: PlanAdmin
          trigger:
            - call: "POST /fair-plan/assessment-events/${ev_id}/allocation-run"
              payload: { expected_assessment_event_version: "${ev_v}" }
              as: PlanAdmin
              captures: { stale_err: $.data.error_id }
            - call: "GET /fair-plan/assessment-events/${ev_id}"
              payload: {}
              as: PlanAdmin
              captures: { ev_v_now: $.data.version }
            - call: "POST /fair-plan/assessment-events/${ev_id}/allocation-run"
              payload: { expected_assessment_event_version: "${ev_v_now}" }
              as: PlanAdmin
          assert:
            - "the setup capture ${ev_v} was 1 and the setup run left AssessmentEvent.${ev_id}.status == ALLOCATED with allocation_run_count == 1"
            - "the stale re-run returns status 412 with ${stale_err} == ERR_STALE_VERSION"
            - "immediately after the refusal AssessmentEvent.${ev_id}.allocation_run_count is still 1 and version is still 2"
            - "the re-read reports ${ev_v_now} == 2"
            - "the fresh re-run returns status 200"
            - "AssessmentEvent.${ev_id}.allocation_run_count == 2 with version == 3"
            - "AssessmentEvent.${ev_id}.allocated_total_cents == 100000000 and remainder_cents == 0"
            - "GET /fair-plan/assessment-events/${ev_id}/allocations?status=PENDING as PlanAdmin reports total_count == 3 with net_due_cents 30000000, 30000000 and 40000000"
            - "MemberInsurer.${m3_id}.cumulative_assessed_cents == 40000000 (the abated prior run is not double-counted)"

      - name: four_hop_cascade_is_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: takeout_acceptance_cascades_four_hops_to_zone_reopening
          rationale: "The named §1.8 instance walks offer -> policy -> zone -> member ledger -> zone posture and asserts every hop's fields, which is the end-to-end chain claim for this layer."

      - name: both_premium_variants_and_the_switch_delta_are_correct
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: premium_provisional_quote_versus_bound_final_divergence
          rationale: "The named §1.8 instance asserts the PROVISIONAL_QUOTE and BOUND_FINAL results and their delta on one file."

      - name: zone_posture_thresholds_fire_at_their_exact_ratios
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers
          - calculations.zone_concentration_posture
        excluded_because:
          difficulty_instance: zone_exposure_aggregate_returns_to_zero_and_status_reverts_to_open
          rationale: "The named §1.8 instance crosses the 0.85 RESTRICTED ratio and returns below it, exercising both the trigger and the reset for this layer."

  - section: consistency_model
    instances:
      - name: allocation_run_side_effects_are_visible_in_the_same_request_and_on_immediate_reads
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "No denormalised field lags: the allocation-run response itself already carries allocated_total_cents 100000000 and remainder_cents 0, and reads issued immediately afterwards — with no sweep, no re-run and no waiting — report MemberInsurer.cumulative_assessed_cents 40000000 for the 40% member and three PENDING allocations."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; three ACTIVE member insurers with market_share_pct 30.00 / 30.00 / 40.00; one HURRICANE zone; one MARKET_SHARE assessment event with assessable_amount_cents 100000000."
          setup_api_calls:
            - call: "POST /fair-plan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /fair-plan/member-insurers"
              payload: { name: "Carrier One", naic_code: "10001", market_share_pct: 30.00, written_premium_share_pct: 10.00 }
              as: PlanAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /fair-plan/member-insurers"
              payload: { name: "Carrier Two", naic_code: "10002", market_share_pct: 30.00, written_premium_share_pct: 10.00 }
              as: PlanAdmin
              captures: { m2_id: $.data.id }
            - call: "POST /fair-plan/member-insurers"
              payload: { name: "Carrier Three", naic_code: "10003", market_share_pct: 40.00, written_premium_share_pct: 80.00 }
              as: PlanAdmin
              captures: { m3_id: $.data.id }
            - call: "POST /fair-plan/cat-zones"
              payload: { code: "HUR-01", peril: "HURRICANE", exposure_cap_cents: 900000000 }
              as: PlanAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /fair-plan/assessment-events"
              payload: { cat_zone_id: "${zone_id}", trigger_loss_cents: 200000000, reserve_balance_cents_at_trigger: 100000000, allocation_basis: "MARKET_SHARE" }
              as: PlanAdmin
              captures: { ev_id: $.data.id, ev_v: $.data.version }
          trigger:
            - call: "POST /fair-plan/assessment-events/${ev_id}/allocation-run"
              payload: { expected_assessment_event_version: "${ev_v}" }
              as: PlanAdmin
            - call: "GET /fair-plan/member-insurers/${m3_id}"
              payload: {}
              as: MemberInsurerUser
              as_user_id: "${m3_id}"
              captures: { m3_assessed: $.data.cumulative_assessed_cents }
            - call: "GET /fair-plan/member-insurers/${m3_id}/allocations"
              payload: { status: "PENDING", limit: 10, offset: 0 }
              as: MemberInsurerUser
              as_user_id: "${m3_id}"
              captures: { m3_alloc_id: "$.data[0].id" }
          assert:
            - "the allocation-run response body itself reports status ALLOCATED, allocated_total_cents == 100000000, remainder_cents == 0, allocation_run_count == 1 and version == 2"
            - "the immediately following read reports ${m3_assessed} == 40000000 with no intervening sweep or delay"
            - "AssessmentAllocation.${m3_alloc_id}.member_insurer_id == ${m3_id}"
            - "AssessmentAllocation.${m3_alloc_id}.assessment_event_id == ${ev_id}"
            - "AssessmentAllocation.${m3_alloc_id}.basis_weight_pct == 40.00"
            - "AssessmentAllocation.${m3_alloc_id}.gross_share_cents == 40000000 and net_due_cents == 40000000"
            - "AssessmentAllocation.${m3_alloc_id}.status == PENDING"
            - "GET /fair-plan/assessment-events/${ev_id}/allocations as PlanAdmin reports total_count == 3 in the same instant"

