              as: TourPlanner
              captures: { b2_id: $.data.id, b2_v: $.data.version }
            - call: "POST /touring/bookings"
              payload: { event_id: "${b2_id}", talent_id: "${t_id}", segment_label: "MATCH_1" }
              as: TourPlanner
            - call: "POST /touring/events/${b2_id}/lock"
              payload: { expected_event_version: "${b2_v}" }
              as: TourPlanner
            - call: "POST /touring/events/${b2_id}/complete"
              payload: {}
              as: TourPlanner
            - call: "POST /touring/events"
              payload: { name: "HS", event_type: "HOUSE_SHOW", arena_id: "${ar_id}", event_date: "2026-09-05", start_time: "19:00", end_time: "21:00", tour_country_code: "US", roster_min_main: 0, roster_min_total: 0 }
              as: TourPlanner
              captures: { hs_id: $.data.id, hs_v: $.data.version }
            - call: "POST /touring/bookings"
              payload: { event_id: "${hs_id}", talent_id: "${t_id}", segment_label: "MATCH_1" }
              as: TourPlanner
            - call: "POST /touring/events/${hs_id}/lock"
              payload: { expected_event_version: "${hs_v}" }
              as: TourPlanner
            - call: "POST /touring/events/${hs_id}/complete"
              payload: {}
              as: TourPlanner
            - call: "POST /touring/merch-sales"
              payload: { event_id: "${hs_id}", talent_id: "${t_id}", quantity: 2, unit_price_cents: 5000, sold_at: "2026-09-05T20:00:00Z" }
              as: MerchOps
            - call: "POST /touring/merch-sales"
              payload: { event_id: "${hs_id}", talent_id: "${t_id}", quantity: 3, unit_price_cents: 30000, sold_at: "2026-09-05T20:30:00Z" }
              as: MerchOps
