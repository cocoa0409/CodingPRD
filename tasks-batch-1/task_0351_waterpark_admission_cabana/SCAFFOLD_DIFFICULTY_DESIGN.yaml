          (priority 15, ERR_WINDOW_CAPACITY_EXCEEDED). An already-CHECKED_IN
          admission re-assigned to a full window fails the state check first
          (ERR_INVALID_STATE), not the capacity check. State beats fiscal.
        test_recipe:
          setup:
            - "An admission already CHECKED_IN, targeted at a window whose capacity is also exhausted."
          setup_api_calls:
