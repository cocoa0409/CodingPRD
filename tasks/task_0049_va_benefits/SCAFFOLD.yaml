# =============================================================================
# VA Benefits Administration API — seed tables (SCAFFOLD.yaml)
# §1.0–§1.7 + preamble. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Veterans Affairs (VA) Benefits: service connection, Disability percentage
  (Combined Rating), dependents, Post-9/11 GI Bill, Yellow Ribbon, Housing
  Allowance, Vocational Rehab

domain_name: va-benefits
api_prefix: /          # flat topology: Veteran, Claim, Condition, School, Enrollment, VocRehabPlan are all top-level collections

# Structural DNA selected per §0.1–§0.4.
complexity_profile:
  primary_archetype: pricing_engine          # non-linear "VA math" combined rating + MHA proration
  secondary_archetype: multi_party_negotiation # claim adjudication with remand/appeal cycles
  complexity_layers:
    - dual_variant_calculation     # provisional vs finalized combined rating; estimated vs actual MHA
    - cascading_side_effects       # claim grant -> condition rating -> profile combined rating -> monthly award
    - rate_threshold_triggers      # GI Bill tier breakpoints, dependent-bump rating threshold (>= 30)
    - optimistic_concurrency       # OCC on Veteran.version for award finalization races

  entity_topology: flat            # Veteran is the hub; Claim, Condition, Dependent, Enrollment, VocRehabPlan are peers linked by FK
  state_machine_shape: cyclic      # Claim adjudication loops DEVELOPMENT->REMANDED->DEVELOPMENT (appeal/remand rounds)

  relationship_patterns:
    - one_to_many                  # Veteran -> Claims, Conditions, Dependents, Enrollments
    - cross_aggregate              # Enrollment references School + Veteran; Condition references Claim

  role_model: peer_roles           # Veteran (self-service) vs RatingSpecialist vs SchoolCertifyingOfficial vs ClaimsAdmin
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Veteran
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: full_name, type: string, source: input, description: "Veteran legal name" }
      - { name: file_number, type: string, source: input, description: "VA file number; unique across veterans", constraints: "unique" }
      - { name: total_active_duty_days, type: integer, source: input, description: "Aggregate creditable active-duty service days after 2001-09-10 (drives GI Bill tier)", constraints: ">= 0" }
      - { name: discharged_for_service_disability, type: boolean, source: input, default: false, description: "True if separated due to service-connected disability after >=30 continuous days (GI Bill 100% special tier)" }
      - { name: combined_rating_pct, type: integer, source: computed, default: 0, description: "Whole-person combined disability rating in {0,10,20,...,100}; recomputed from SERVICE_CONNECTED conditions via va_combined_rating" }
      - { name: provisional_combined_rating_pct, type: integer, source: computed, default: 0, description: "Provisional combined rating including PROPOSED-but-not-final condition ratings; never falls below combined_rating_pct" }
      - { name: gi_bill_tier_pct, type: integer, source: computed, default: 0, description: "Post-9/11 GI Bill benefit tier percentage in {0,50,60,70,80,90,100} from total_active_duty_days via gi_bill_tier" }
      - { name: monthly_compensation_cents, type: integer, source: computed, default: 0, description: "Current monthly disability award in cents from combined_rating_pct + dependents via monthly_compensation" }
      - { name: voc_rehab_entitlement_months, type: number, source: computed, default: 48, description: "Remaining Chapter 31 Vocational Rehab entitlement months; debited as VocRehabPlan months are consumed" }
      - { name: award_status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | SUSPENDED — gates monthly award disbursement", constraints: "one of DRAFT, ACTIVE, SUSPENDED" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: veteran_id, type: string, source: input, description: "FK -> Veteran.id" }
      - { name: claim_type, type: enum, source: input, description: "ORIGINAL | INCREASE | SECONDARY", constraints: "one of ORIGINAL, INCREASE, SECONDARY" }
      - { name: received_date, type: datetime, source: input, description: "Date claim was received; establishes effective-date priority (earlier wins on tie)" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED -> DEVELOPMENT -> RATED -> {GRANTED, DENIED}; RATED/DENIED -> REMANDED -> DEVELOPMENT (appeal loop); GRANTED/DENIED terminal once appeal window closed", constraints: "one of SUBMITTED, DEVELOPMENT, RATED, GRANTED, DENIED, REMANDED, CLOSED" }
      - { name: remand_count, type: integer, source: system, default: 0, description: "Number of times this claim has cycled through REMANDED (caps appeal rounds at MAX_REMANDS)" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Condition
    parent: null
    common_fields: true
    fields:
      - { name: veteran_id, type: string, source: input, description: "FK -> Veteran.id" }
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; the claim that adjudicates this condition" }
      - { name: diagnostic_code, type: string, source: input, description: "VA Schedule for Rating Disabilities diagnostic code" }
      - { name: body_side, type: enum, source: input, default: NONE, description: "LEFT | RIGHT | NONE — used by bilateral-factor variant of combined rating", constraints: "one of LEFT, RIGHT, NONE" }
      - { name: is_extremity, type: boolean, source: input, default: false, description: "True if the rated body part is a paired extremity (arm/leg) eligible for bilateral factor" }
      - { name: proposed_rating_pct, type: integer, source: input, description: "Rating specialist's proposed schedular percentage in {0,10,...,100}", constraints: "multiple of 10, 0..100" }
      - { name: final_rating_pct, type: integer, source: computed, default: 0, description: "Finalized schedular percentage; equals proposed_rating_pct only after the parent Claim is GRANTED; 0 while PROPOSED" }
      - { name: service_connection, type: enum, source: system, default: PROPOSED, description: "PROPOSED -> SERVICE_CONNECTED (on Claim GRANTED) | NOT_CONNECTED (on Claim DENIED)", constraints: "one of PROPOSED, SERVICE_CONNECTED, NOT_CONNECTED" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Dependent
    parent: null
    common_fields: false   # id, created_at only — append-style record, edited via dedicated endpoints
    fields:
      - { name: veteran_id, type: string, source: input, description: "FK -> Veteran.id" }
      - { name: relationship, type: enum, source: input, description: "SPOUSE | CHILD | PARENT", constraints: "one of SPOUSE, CHILD, PARENT" }
      - { name: in_school_18_to_23, type: boolean, source: input, default: false, description: "CHILD only: true if aged 18-23 and enrolled in school (higher additional amount)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | REMOVED — REMOVED dependents excluded from compensation", constraints: "one of ACTIVE, REMOVED" }

  - name: School
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Institution name" }
      - { name: is_public, type: boolean, source: input, description: "True for public IHL (in-state tuition cap differs from private)" }
      - { name: yellow_ribbon_participant, type: boolean, source: input, default: false, description: "True if school has a Yellow Ribbon agreement" }
      - { name: yellow_ribbon_max_contribution_cents, type: integer, source: input, default: 0, description: "Per-student per-year max the school contributes under Yellow Ribbon (VA matches dollar-for-dollar)" }
      - { name: yellow_ribbon_slots_total, type: integer, source: input, default: 0, description: "Total Yellow Ribbon student slots offered per academic year" }
      - { name: yellow_ribbon_slots_used, type: integer, source: computed, default: 0, description: "Count of CERTIFIED enrollments at this school consuming a Yellow Ribbon slot in the current academic year" }
      - { name: monthly_housing_rate_cents, type: integer, source: input, description: "E-5-with-dependents BAH for the school's ZIP (full-time MHA basis)", constraints: ">= 0" }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: veteran_id, type: string, source: input, description: "FK -> Veteran.id" }
      - { name: school_id, type: string, source: input, description: "FK -> School.id" }
      - { name: term_start, type: datetime, source: input, description: "Term start date (inclusive)" }
      - { name: term_end, type: datetime, source: input, description: "Term end date (exclusive); overlap with another CERTIFIED enrollment for same veteran is rejected" }
      - { name: credit_hours, type: number, source: input, description: "Enrolled credit hours this term", constraints: "> 0" }
      - { name: full_time_credit_hours, type: number, source: input, description: "Credit hours that count as full time for this term (rate-of-pursuit denominator)", constraints: "> 0" }
      - { name: tuition_charged_cents, type: integer, source: input, description: "Net tuition after in-state cap; basis for Yellow Ribbon matching" }
      - { name: requests_yellow_ribbon, type: boolean, source: input, default: false, description: "Veteran requests a Yellow Ribbon slot for this enrollment" }
      - { name: rate_of_pursuit_pct, type: integer, source: computed, default: 0, description: "round_half_up(100 * credit_hours / full_time_credit_hours); MHA paid only when > 50" }
      - { name: monthly_housing_allowance_cents, type: integer, source: computed, default: 0, description: "Finalized MHA for this enrollment via housing_allowance; 0 until CERTIFIED" }
      - { name: estimated_mha_cents, type: integer, source: computed, default: 0, description: "Estimated MHA at submission using veteran's current gi_bill_tier_pct (provisional variant)" }
      - { name: yellow_ribbon_match_cents, type: integer, source: computed, default: 0, description: "VA Yellow Ribbon match for this enrollment via yellow_ribbon_match; 0 if not awarded a slot" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED -> CERTIFIED -> COMPLETED; SUBMITTED/CERTIFIED -> CANCELLED", constraints: "one of SUBMITTED, CERTIFIED, COMPLETED, CANCELLED" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: VocRehabPlan
    parent: null
    common_fields: true
    fields:
      - { name: veteran_id, type: string, source: input, description: "FK -> Veteran.id" }
      - { name: planned_months, type: number, source: input, description: "Chapter 31 entitlement months requested for this plan", constraints: "> 0" }
      - { name: track, type: enum, source: input, description: "REEMPLOYMENT | EMPLOYMENT_THROUGH_LONG_TERM | SELF_EMPLOYMENT", constraints: "one of REEMPLOYMENT, EMPLOYMENT_THROUGH_LONG_TERM, SELF_EMPLOYMENT" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "PROPOSED -> APPROVED -> COMPLETED; PROPOSED -> REJECTED", constraints: "one of PROPOSED, APPROVED, COMPLETED, REJECTED" }
      - { name: version, type: integer, source: system, description: "OCC version" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Claim
    initial_state: SUBMITTED
    terminal_states: [CLOSED]
    transitions:
      - from: SUBMITTED
        to: DEVELOPMENT
        trigger: "POST /claims/{claimId}/open-development"
        actor: ClaimsAdmin
        preconditions:
          - "Claim.status == SUBMITTED"
          - "At least one Condition has claim_id == this claim (ERR_CLAIM_HAS_NO_CONDITIONS)"
        side_effects: []

      - from: DEVELOPMENT
        to: RATED
        trigger: "POST /claims/{claimId}/rate"
        actor: RatingSpecialist
        preconditions:
          - "Claim.status == DEVELOPMENT"
          - "Every Condition on this claim has proposed_rating_pct set (multiple of 10, 0..100) (ERR_CONDITION_UNRATED)"
        side_effects:
          - "No change to Condition.final_rating_pct yet (still 0); ratings are proposed, not final"
          - "Refreshes Veteran.provisional_combined_rating_pct via va_combined_rating over (SERVICE_CONNECTED final + this claim's PROPOSED proposed) ratings"

      - from: RATED
        to: GRANTED
        trigger: "POST /claims/{claimId}/grant"
        actor: ClaimsAdmin
        preconditions:
          - "Claim.status == RATED"
          - "expected_claim_version matches Claim.version (ERR_STALE_VERSION)"
        side_effects:
          - "Each Condition on this claim: service_connection -> SERVICE_CONNECTED, final_rating_pct = proposed_rating_pct"
          - "CASCADE hop 1->2: recompute Veteran.combined_rating_pct via va_combined_rating over all SERVICE_CONNECTED conditions"
          - "CASCADE hop 2->3: recompute Veteran.monthly_compensation_cents via monthly_compensation from new combined_rating_pct + ACTIVE dependents"
          - "Veteran.provisional_combined_rating_pct recomputed (now equals combined_rating_pct if no other PROPOSED conditions)"
          - "increments Claim.version by 1"

      - from: RATED
        to: DENIED
        trigger: "POST /claims/{claimId}/deny"
        actor: ClaimsAdmin
        preconditions:
          - "Claim.status == RATED"
          - "expected_claim_version matches Claim.version (ERR_STALE_VERSION)"
        side_effects:
          - "Each Condition on this claim: service_connection -> NOT_CONNECTED, final_rating_pct stays 0"
          - "Veteran.provisional_combined_rating_pct recomputed without this claim's proposed ratings"
          - "increments Claim.version by 1"

      - from: RATED
        to: REMANDED
        trigger: "POST /claims/{claimId}/remand"
        actor: ClaimsAdmin
        preconditions:
          - "Claim.status == RATED"
          - "Claim.remand_count < MAX_REMANDS (ERR_APPEAL_EXHAUSTED)"
        side_effects:
          - "Claim.remand_count += 1"

      - from: DENIED
        to: REMANDED
        trigger: "POST /claims/{claimId}/remand"
        actor: ClaimsAdmin
        preconditions:
          - "Claim.status == DENIED"
          - "Claim.remand_count < MAX_REMANDS (ERR_APPEAL_EXHAUSTED)"
        side_effects:
          - "Claim.remand_count += 1"
          - "Each Condition on this claim: service_connection -> PROPOSED, final_rating_pct -> 0 (re-open for re-adjudication)"
          - "CASCADE: recompute Veteran.combined_rating_pct and Veteran.monthly_compensation_cents (the denied/now-reopened conditions leave the SERVICE_CONNECTED set unchanged; granted ones elsewhere remain)"

      - from: REMANDED
        to: DEVELOPMENT
        trigger: "POST /claims/{claimId}/open-development"
        actor: ClaimsAdmin
        preconditions:
          - "Claim.status == REMANDED"
        side_effects:
          - "Cycle re-enters development; conditions may receive new proposed_rating_pct via PATCH before re-rating"
        note: "CYCLE edge: REMANDED -> DEVELOPMENT -> RATED -> REMANDED forms the appeal loop, capped by MAX_REMANDS"

      - from: GRANTED
        to: CLOSED
        trigger: "POST /claims/{claimId}/close"
        actor: ClaimsAdmin
        preconditions:
          - "Claim.status == GRANTED"
        side_effects: []

      - from: DENIED
        to: CLOSED
        trigger: "POST /claims/{claimId}/close"
        actor: ClaimsAdmin
        preconditions:
          - "Claim.status == DENIED"
        side_effects: []

  - entity: Enrollment
    initial_state: SUBMITTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /enrollments/{enrollmentId}/certify"
        actor: SchoolCertifyingOfficial
        preconditions:
          - "Enrollment.status == SUBMITTED"
          - "Veteran.gi_bill_tier_pct > 0 (ERR_NO_GI_BILL_ELIGIBILITY) — cross-entity: depends on Veteran"
          - "No other CERTIFIED Enrollment for this veteran whose [term_start, term_end) overlaps this one (ERR_ENROLLMENT_OVERLAP)"
          - "If requests_yellow_ribbon: School.yellow_ribbon_participant == true AND School.yellow_ribbon_slots_used < School.yellow_ribbon_slots_total (ERR_YELLOW_RIBBON_UNAVAILABLE)"
          - "expected_enrollment_version matches Enrollment.version (ERR_STALE_VERSION)"
        side_effects:
          - "rate_of_pursuit_pct computed = round_half_up(100 * credit_hours / full_time_credit_hours)"
          - "monthly_housing_allowance_cents recomputed via housing_allowance (finalized variant, using current gi_bill_tier_pct and rate_of_pursuit_pct)"
          - "If requests_yellow_ribbon granted: yellow_ribbon_match_cents computed via yellow_ribbon_match; School.yellow_ribbon_slots_used += 1"
          - "increments Enrollment.version by 1"

      - from: CERTIFIED
        to: COMPLETED
        trigger: "POST /enrollments/{enrollmentId}/complete"
        actor: SchoolCertifyingOfficial
        preconditions:
          - "Enrollment.status == CERTIFIED"
        side_effects: []

      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /enrollments/{enrollmentId}/cancel"
        actor: Veteran
        preconditions:
          - "Enrollment.status == SUBMITTED"
        side_effects: []

      - from: CERTIFIED
        to: CANCELLED
        trigger: "POST /enrollments/{enrollmentId}/cancel"
        actor: Veteran
        preconditions:
          - "Enrollment.status == CERTIFIED"
        side_effects:
          - "COMPENSATION: monthly_housing_allowance_cents -> 0"
          - "If a Yellow Ribbon slot was consumed (yellow_ribbon_match_cents > 0): School.yellow_ribbon_slots_used -= 1; yellow_ribbon_match_cents -> 0 (restores the conserved slot pool)"

  - entity: VocRehabPlan
    initial_state: PROPOSED
    terminal_states: [COMPLETED, REJECTED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /voc-rehab-plans/{planId}/approve"
        actor: ClaimsAdmin
        preconditions:
          - "VocRehabPlan.status == PROPOSED"
          - "Veteran.combined_rating_pct >= VOC_REHAB_MIN_RATING (ERR_VOC_REHAB_INELIGIBLE) — cross-entity: depends on Veteran"
          - "VocRehabPlan.planned_months <= Veteran.voc_rehab_entitlement_months (ERR_ENTITLEMENT_EXHAUSTED)"
        side_effects:
          - "DEBIT: Veteran.voc_rehab_entitlement_months -= planned_months"

      - from: APPROVED
        to: COMPLETED
        trigger: "POST /voc-rehab-plans/{planId}/complete"
        actor: ClaimsAdmin
        preconditions:
          - "VocRehabPlan.status == APPROVED"
        side_effects: []

      - from: PROPOSED
        to: REJECTED
        trigger: "POST /voc-rehab-plans/{planId}/reject"
        actor: ClaimsAdmin
        preconditions:
          - "VocRehabPlan.status == PROPOSED"
        side_effects: []

  # Veteran award lifecycle (compound-ish: ACTIVE gates monthly disbursement)
  - entity: Veteran
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /veterans/{veteranId}/activate-award"
        actor: ClaimsAdmin
        preconditions:
          - "Veteran.award_status == DRAFT"
          - "Veteran.combined_rating_pct > 0 (ERR_NO_COMPENSABLE_RATING)"
          - "expected_veteran_version matches Veteran.version (ERR_STALE_VERSION)"
        side_effects:
          - "award_status -> ACTIVE; monthly_compensation_cents already reflects current rating + dependents"
          - "increments Veteran.version by 1"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /veterans/{veteranId}/suspend-award"
        actor: ClaimsAdmin
        preconditions:
          - "Veteran.award_status == ACTIVE"
        side_effects:
          - "award_status -> SUSPENDED (disbursement paused; computed amount retained)"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /veterans/{veteranId}/activate-award"
        actor: ClaimsAdmin
        preconditions:
          - "Veteran.award_status == SUSPENDED"
          - "Veteran.combined_rating_pct > 0 (ERR_NO_COMPENSABLE_RATING)"
          - "expected_veteran_version matches Veteran.version (ERR_STALE_VERSION)"
        side_effects:
          - "award_status -> ACTIVE"
          - "increments Veteran.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: award-activate-stale-veteran
    parent_entity: Veteran
    write_endpoint: "POST /veterans/{veteranId}/activate-award"
    occ_field: "expected_veteran_version"
    description: |
      Activating a Veteran's monthly award against a Veteran whose version has
      advanced since the client last observed it is rejected. A grant on any of
      the veteran's claims cascades into Veteran.combined_rating_pct and
      Veteran.monthly_compensation_cents and bumps Veteran.version; an activation
      that still carries the pre-cascade version is operating on a stale view of
      the award amount and must be refused so the operator re-reads the new
      compensation before committing the award.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: enrollment-certify-stale
    parent_entity: Enrollment
    write_endpoint: "POST /enrollments/{enrollmentId}/certify"
    occ_field: "expected_enrollment_version"
    description: |
      Certifying an Enrollment against an Enrollment whose version has advanced
      since the client last observed it is rejected. The housing allowance is
      finalized at certification from the veteran's tier and the term's rate of
      pursuit; if the enrollment was edited (re-deriving estimated_mha_cents and
      bumping version) after the certifying official read it, the certification
      carries a stale view and is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: va_combined_rating
    trigger: "Claim GRANTED (recompute over SERVICE_CONNECTED conditions); Claim RATED (provisional variant); Claim DENIED/REMANDED (recompute)"
    algorithm: constraint_propagation
    formula: |
      # "VA math": ratings do NOT add linearly. Each successive rating applies
      # to the EFFICIENCY remaining after prior ratings.
      # Inputs: ratings = list of final_rating_pct for the included condition set,
      #         each in {10,20,...,100}; ratings of 0 are dropped.
      # Step 1: sort ratings DESCENDING. Tie-break: created_at ASC (stable;
      #         immaterial to the numeric result but pinned for determinism).
      # Step 2: remaining_efficiency = 100
      #         for r in sorted_ratings:
      #             combined = remaining_efficiency * (r / 100)   # disability taken from remaining
      #             remaining_efficiency = remaining_efficiency - combined
      #         total_disability = 100 - remaining_efficiency
      # Step 3 (bilateral factor — see variant): apply BEFORE rounding when
      #         two or more is_extremity conditions exist on opposite body_side.
      # Step 4: round total_disability to the NEAREST 10 (round_half_up at .5):
      #         combined_rating_pct = round_half_up(total_disability / 10) * 10,
      #         clamped to [0,100].
      # Worked: ratings [50,30] -> 100*0.5=50 rem 50; 50*0.3=15 rem 35;
      #         total=65 -> nearest 10 = 70. (Not 80.)
    input_set: "Conditions where service_connection == SERVICE_CONNECTED and final_rating_pct > 0 (GRANTED variant); for provisional variant additionally include this claim's PROPOSED conditions using proposed_rating_pct"
    constants:
      ROUND_TO_NEAREST: 10
      BILATERAL_FACTOR_PCT: 10   # 10% of the combined bilateral subtotal, added before final rounding
    precision: "integer percent; intermediate efficiency kept as float, final round_half_up to nearest 10"
    variants:
      - name: schedular_only
        when: "no two SERVICE_CONNECTED is_extremity conditions on opposite body_side"
        difference: "Step 3 skipped; combine then round to nearest 10"
      - name: bilateral_factor
        when: ">=2 included is_extremity conditions exist with at least one LEFT and one RIGHT body_side"
        difference: "Combine the bilateral extremity ratings among themselves first; add BILATERAL_FACTOR_PCT (10%) of that bilateral subtotal; treat the result as a single rating that then combines with the remaining non-bilateral ratings; round to nearest 10 last"
      - name: provisional
        when: "triggered on Claim RATED (before grant)"
        difference: "Inclusion set adds the rated claim's PROPOSED conditions (proposed_rating_pct); writes Veteran.provisional_combined_rating_pct, not combined_rating_pct"

  - name: monthly_compensation
    trigger: "Veteran.combined_rating_pct changes (Claim GRANTED/DENIED/REMANDED cascade) or Dependent add/remove"
    algorithm: tiered_pricing
    formula: |
      # Base monthly compensation is a step function of combined_rating_pct.
      # Dependent additions apply ONLY when combined_rating_pct >= 30.
      if combined_rating_pct < 30:
          # Below the dependent threshold: flat base by rating, NO dependent bumps.
          base = BASE_RATE_CENTS[combined_rating_pct]      # for {0,10,20}; 0 maps to 0
          return base
      base = BASE_RATE_CENTS[combined_rating_pct]          # for {30,...,100}
      # Dependent additive amounts (only counted for ACTIVE dependents):
      spouse_amt   = SPOUSE_ADD_CENTS  if exactly_one ACTIVE SPOUSE else 0
      parent_amt   = PARENT_ADD_CENTS * count(ACTIVE PARENT)        # up to 2
      child_amt    = CHILD_UNDER18_ADD_CENTS * count(ACTIVE CHILD with in_school_18_to_23 == false)
      schoolchild_amt = CHILD_SCHOOL_ADD_CENTS * count(ACTIVE CHILD with in_school_18_to_23 == true)
      # Dependent amounts scale with rating tier: multiply the sum of dependent
      # adds by (combined_rating_pct / 100), round_half_up to whole cents.
      dep_sum = spouse_amt + parent_amt + child_amt + schoolchild_amt
      dep_scaled = round_half_up(dep_sum * combined_rating_pct / 100)
      return base + dep_scaled
    input_set: "Veteran.combined_rating_pct (finalized) + Dependent rows with status == ACTIVE"
    constants:
      BASE_RATE_CENTS: { 0: 0, 10: 17500, 20: 34600, 30: 53600, 40: 77200, 50: 109900, 60: 139500, 70: 175800, 80: 204400, 90: 229600, 100: 383150 }
      SPOUSE_ADD_CENTS: 10000
      PARENT_ADD_CENTS: 8000
      CHILD_UNDER18_ADD_CENTS: 7000
      CHILD_SCHOOL_ADD_CENTS: 23000
    precision: "cents (integer); dep_scaled round_half_up"
    variants:
      - name: with_dependents
        when: "combined_rating_pct >= 30"
        difference: "Dependent additive amounts included and scaled by rating tier"
      - name: veteran_alone
        when: "combined_rating_pct < 30"
        difference: "Dependent amounts ignored entirely even if ACTIVE dependents exist (boundary at exactly 30)"

  - name: gi_bill_tier
    trigger: "Veteran create or update of total_active_duty_days / discharged_for_service_disability"
    algorithm: threshold
    formula: |
      # Post-9/11 GI Bill benefit tier from aggregate creditable active-duty days.
      # discharged_for_service_disability with >=30 continuous days short-circuits to 100.
      if discharged_for_service_disability and total_active_duty_days >= 30:
          return 100
      d = total_active_duty_days
      if d >= 1095: return 100      # >= 36 months (1095 days)
      if d >= 912:  return 90       # 30-35 months
      if d >= 730:  return 80       # 24-29 months
      if d >= 547:  return 70       # 18-23 months
      if d >= 365:  return 60       # 12-17 months  (note: 60, NOT a 1-pt gap from 70)
      if d >= 90:   return 50       # 90 days - 11 months
      return 0                      # < 90 days: not eligible
    input_set: "Veteran.total_active_duty_days, Veteran.discharged_for_service_disability"
    constants:
      DAYS_36_MONTHS: 1095
      DAYS_30_MONTHS: 912
      DAYS_24_MONTHS: 730
      DAYS_18_MONTHS: 547
      DAYS_12_MONTHS: 365
      DAYS_90: 90
    precision: "integer percent in {0,50,60,70,80,90,100}"

  - name: housing_allowance
    trigger: "Enrollment certify (finalized); Enrollment submit (estimated variant)"
    algorithm: tiered_pricing
    formula: |
      # Monthly Housing Allowance for a term.
      # rate_of_pursuit_pct = round_half_up(100 * credit_hours / full_time_credit_hours)
      # MHA paid ONLY when rate_of_pursuit_pct > 50 (strictly greater; exactly 50 -> 0).
      if rate_of_pursuit_pct <= 50:
          return 0
      # Step 1: full-time basis scaled by GI Bill tier:
      tier_basis = round_half_up(school.monthly_housing_rate_cents * gi_bill_tier_pct / 100)
      # Step 2: scale by rate of pursuit, but round of the rate-of-pursuit factor
      #         is taken AFTER tier scaling (round-then-scale order is pinned):
      mha = round_half_up(tier_basis * rate_of_pursuit_pct / 100)
      return mha
    input_set: "School.monthly_housing_rate_cents, Veteran.gi_bill_tier_pct, Enrollment.rate_of_pursuit_pct"
    constants:
      RATE_OF_PURSUIT_FLOOR_PCT: 50   # strictly greater than this to receive MHA
    precision: "cents; two-step round_half_up — round tier_basis first, then round after pursuit scaling (order pinned)"
    variants:
      - name: finalized
        when: "Enrollment certify"
        difference: "Uses gi_bill_tier_pct as of certification; writes monthly_housing_allowance_cents"
      - name: estimated
        when: "Enrollment submit"
        difference: "Uses gi_bill_tier_pct as of submission and the submitted credit_hours/full_time_credit_hours; writes estimated_mha_cents (may differ from finalized if tier changes between submit and certify)"

  - name: yellow_ribbon_match
    trigger: "Enrollment certify when a Yellow Ribbon slot is granted"
    algorithm: waterfall_allocation
    formula: |
      # Yellow Ribbon covers tuition ABOVE the GI Bill tuition coverage.
      # Only veterans at the 100% GI Bill tier are Yellow-Ribbon eligible.
      if gi_bill_tier_pct != 100: return 0                  # not eligible
      uncovered = tuition_charged_cents                      # tuition_charged is already net-of-cap residual
      # School pledges up to its per-student cap; VA matches dollar-for-dollar.
      school_contrib = min(uncovered / 2, school.yellow_ribbon_max_contribution_cents)
      school_contrib = round_half_up(school_contrib)
      va_match = school_contrib                              # VA matches the school's contribution exactly
      # yellow_ribbon_match_cents stores the VA match portion.
      return va_match
    input_set: "Enrollment.tuition_charged_cents, School.yellow_ribbon_max_contribution_cents, Veteran.gi_bill_tier_pct"
    constants:
      VA_MATCH_RATIO: 1.0   # VA matches the school's contribution dollar-for-dollar
    precision: "cents; school_contrib round_half_up before matching"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7 RBAC; entity_backed roles acting on a resource they do not own are forbidden"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body referenced resources exist (Veteran, Claim, Condition, School, Enrollment, VocRehabPlan), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Required body fields present and well-typed; enums in declared set; proposed_rating_pct multiple of 10 in 0..100; credit_hours/full_time_credit_hours > 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all write endpoints"

  - priority: 5
    category: business_constraint
    check: "Veteran.file_number unique on create"
    error_id: ERR_DUPLICATE_FILE_NUMBER
    http_status: 409
    applies_to: "POST /veterans"

  - priority: 6
    category: state
    check: "Target resource in correct state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: state
    check: "OCC: expected_<parent>_version matches current version on guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /claims/{id}/grant, POST /claims/{id}/deny, POST /enrollments/{id}/certify, POST /veterans/{id}/activate-award"

  - priority: 8
    category: business_constraint
    check: "Claim cannot open development with zero conditions"
    error_id: ERR_CLAIM_HAS_NO_CONDITIONS
    http_status: 409
    applies_to: "POST /claims/{id}/open-development"

  - priority: 9
    category: business_constraint
    check: "Every condition on a claim must have proposed_rating_pct before the claim can be rated"
    error_id: ERR_CONDITION_UNRATED
    http_status: 409
    applies_to: "POST /claims/{id}/rate"

  - priority: 10
    category: business_constraint
    check: "Appeal rounds capped: Claim.remand_count < MAX_REMANDS (MAX_REMANDS = 2) to remand"
    error_id: ERR_APPEAL_EXHAUSTED
    http_status: 409
    applies_to: "POST /claims/{id}/remand"

  - priority: 11
    category: business_referential
    check: "Enrollment certify requires Veteran.gi_bill_tier_pct > 0 (GI Bill eligibility) — cross-entity dependency on Veteran"
    error_id: ERR_NO_GI_BILL_ELIGIBILITY
    http_status: 409
    applies_to: "POST /enrollments/{id}/certify"

  - priority: 12
    category: business_temporal
    check: "Enrollment certify rejected if [term_start, term_end) overlaps any existing CERTIFIED enrollment for the same veteran (half-open intervals; touching endpoints do NOT overlap)"
    error_id: ERR_ENROLLMENT_OVERLAP
    http_status: 409
    applies_to: "POST /enrollments/{id}/certify"

  - priority: 13
    category: business_fiscal
    check: "Yellow Ribbon slot available at school (slots_used < slots_total) when requested"
    error_id: ERR_YELLOW_RIBBON_UNAVAILABLE
    http_status: 409
    applies_to: "POST /enrollments/{id}/certify"

  - priority: 14
    category: business_referential
    check: "VocRehabPlan approve requires Veteran.combined_rating_pct >= VOC_REHAB_MIN_RATING (VOC_REHAB_MIN_RATING = 20) — cross-entity dependency on Veteran"
    error_id: ERR_VOC_REHAB_INELIGIBLE
    http_status: 409
    applies_to: "POST /voc-rehab-plans/{id}/approve"

  - priority: 15
    category: business_fiscal
    check: "VocRehabPlan approve requires planned_months <= Veteran.voc_rehab_entitlement_months"
    error_id: ERR_ENTITLEMENT_EXHAUSTED
    http_status: 409
    applies_to: "POST /voc-rehab-plans/{id}/approve"

  - priority: 16
    category: business_fiscal
    check: "Award activation requires Veteran.combined_rating_pct > 0 (compensable)"
    error_id: ERR_NO_COMPENSABLE_RATING
    http_status: 409
    applies_to: "POST /veterans/{id}/activate-award"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------- Veteran ----------
  - method: POST
    path: "/veterans"
    description: "Create a Veteran (award_status=DRAFT)"
    roles: [ClaimsAdmin]
    code: 201
    input: [full_name, file_number, total_active_duty_days, "discharged_for_service_disability?"]
    output: Veteran
    side_effects:
      - "gi_bill_tier_pct computed via gi_bill_tier"
      - "combined_rating_pct=0, provisional_combined_rating_pct=0, monthly_compensation_cents=0, voc_rehab_entitlement_months=48, award_status=DRAFT"

  - method: GET
    path: "/veterans/{veteranId}"
    description: "Get a Veteran (includes all computed fields)"
    roles: [ClaimsAdmin, RatingSpecialist, Veteran]
    code: 200
    input: []
    output: Veteran
    side_effects: []

  - method: GET
    path: "/veterans"
    description: "List veterans (paginated; optional file_number filter)"
    roles: [ClaimsAdmin, RatingSpecialist]
    code: 200
    input: ["file_number?", "limit?", "offset?"]
    output: Veteran[]
    side_effects: []

  - method: PATCH
    path: "/veterans/{veteranId}"
    description: "Update service-time fields (recomputes GI Bill tier)"
    roles: [ClaimsAdmin]
    code: 200
    input: ["total_active_duty_days?", "discharged_for_service_disability?", expected_veteran_version]
    output: Veteran
    side_effects:
      - "gi_bill_tier_pct recomputed via gi_bill_tier"
      - "increments Veteran.version by 1"

  - method: POST
    path: "/veterans/{veteranId}/activate-award"
    description: "Activate (or reactivate) monthly disability award"
    roles: [ClaimsAdmin]
    code: 200
    input: [expected_veteran_version]
    output: Veteran
    side_effects:
      - "award_status -> ACTIVE"
      - "increments Veteran.version by 1"

  - method: POST
    path: "/veterans/{veteranId}/suspend-award"
    description: "Suspend monthly disability award"
    roles: [ClaimsAdmin]
    code: 200
    input: []
    output: Veteran
    side_effects: ["award_status -> SUSPENDED"]

  - method: GET
    path: "/veterans/{veteranId}/compensation-summary"
    description: "Computed read: combined rating, monthly compensation breakdown, GI Bill tier"
    roles: [ClaimsAdmin, RatingSpecialist, Veteran]
    code: 200
    output: "{ combined_rating_pct: integer, provisional_combined_rating_pct: integer, monthly_compensation_cents: integer, gi_bill_tier_pct: integer, active_dependent_count: integer, voc_rehab_entitlement_months: number }"
    input: []
    side_effects: []

  # ---------- Dependent (reverse-reachability for Veteran FK) ----------
  - method: POST
    path: "/veterans/{veteranId}/dependents"
    description: "Add a dependent (recomputes monthly_compensation)"
    roles: [ClaimsAdmin, Veteran]
    code: 201
    input: [relationship, "in_school_18_to_23?"]
    output: Dependent
    side_effects:
      - "status=ACTIVE"
      - "recompute Veteran.monthly_compensation_cents via monthly_compensation"
      - "increments Veteran.version by 1"

  - method: GET
    path: "/veterans/{veteranId}/dependents"
    description: "List a veteran's dependents (sub-resource convenience form)"
    roles: [ClaimsAdmin, RatingSpecialist, Veteran]
    code: 200
    input: ["status?"]
    output: Dependent[]
    side_effects: []

  - method: GET
    path: "/dependents/{dependentId}"
    description: "Get a dependent"
    roles: [ClaimsAdmin, RatingSpecialist, Veteran]
    code: 200
    input: []
    output: Dependent
    side_effects: []

  - method: GET
    path: "/dependents"
    description: "List dependents (filter by veteran_id — reverse-reachability for Dependent.veteran_id)"
    roles: [ClaimsAdmin, RatingSpecialist, Veteran]
    code: 200
    input: ["veteran_id?", "status?", "limit?", "offset?"]
    output: Dependent[]
    side_effects: []

  - method: POST
    path: "/veterans/{veteranId}/dependents/{dependentId}/remove"
    description: "Remove a dependent (status->REMOVED, recomputes compensation)"
    roles: [ClaimsAdmin, Veteran]
    code: 200
    input: []
    output: Dependent
    side_effects:
      - "status -> REMOVED"
      - "recompute Veteran.monthly_compensation_cents via monthly_compensation"
      - "increments Veteran.version by 1"

  # ---------- Claim ----------
  - method: POST
    path: "/claims"
    description: "Create a Claim (status=SUBMITTED)"
    roles: [ClaimsAdmin, Veteran]
    code: 201
    input: [veteran_id, claim_type, received_date]
    output: Claim
    side_effects: ["status=SUBMITTED, remand_count=0"]

  - method: GET
    path: "/claims/{claimId}"
    description: "Get a Claim"
    roles: [ClaimsAdmin, RatingSpecialist, Veteran]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: GET
    path: "/claims"
    description: "List claims (filter by veteran_id — reverse-reachability for Claim.veteran_id)"
    roles: [ClaimsAdmin, RatingSpecialist, Veteran]
    code: 200
    input: ["veteran_id?", "status?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []

  - method: POST
    path: "/claims/{claimId}/open-development"
    description: "Move claim into DEVELOPMENT (also used from REMANDED)"
    roles: [ClaimsAdmin]
    code: 200
    input: []
    output: Claim
    side_effects: ["status -> DEVELOPMENT"]

  - method: POST
    path: "/claims/{claimId}/rate"
    description: "Rate claim (status -> RATED); refreshes provisional combined rating"
    roles: [RatingSpecialist]
    code: 200
    input: []
    output: Claim
    side_effects:
      - "status -> RATED"
      - "recompute Veteran.provisional_combined_rating_pct via va_combined_rating (provisional variant)"

  - method: POST
    path: "/claims/{claimId}/grant"
    description: "Grant claim (cascade: conditions -> service-connected, combined rating, monthly compensation)"
    roles: [ClaimsAdmin]
    code: 200
    input: [expected_claim_version]
    output: Claim
    side_effects:
      - "status -> GRANTED"
      - "conditions: service_connection->SERVICE_CONNECTED, final_rating_pct=proposed_rating_pct"
      - "recompute Veteran.combined_rating_pct via va_combined_rating"
      - "recompute Veteran.monthly_compensation_cents via monthly_compensation"
      - "increments Claim.version by 1"

  - method: POST
    path: "/claims/{claimId}/deny"
    description: "Deny claim (conditions -> not connected)"
    roles: [ClaimsAdmin]
    code: 200
    input: [expected_claim_version]
    output: Claim
    side_effects:
      - "status -> DENIED"
      - "conditions: service_connection->NOT_CONNECTED"
      - "recompute Veteran.provisional_combined_rating_pct"
      - "increments Claim.version by 1"

  - method: POST
    path: "/claims/{claimId}/remand"
    description: "Remand claim for re-adjudication (appeal loop)"
    roles: [ClaimsAdmin]
    code: 200
    input: []
    output: Claim
    side_effects:
      - "status -> REMANDED; remand_count += 1"
      - "if from DENIED: conditions service_connection->PROPOSED, final_rating_pct->0; recompute Veteran.combined_rating_pct + monthly_compensation_cents"

  - method: POST
    path: "/claims/{claimId}/close"
    description: "Close a granted or denied claim (terminal)"
    roles: [ClaimsAdmin]
    code: 200
    input: []
    output: Claim
    side_effects: ["status -> CLOSED"]

  # ---------- Condition (reverse-reachability for Veteran + Claim FKs) ----------
  - method: POST
    path: "/claims/{claimId}/conditions"
    description: "Add a condition to a claim"
    roles: [ClaimsAdmin, RatingSpecialist]
    code: 201
    input: [veteran_id, diagnostic_code, "body_side?", "is_extremity?", proposed_rating_pct]
    output: Condition
    side_effects: ["service_connection=PROPOSED, final_rating_pct=0"]

  - method: GET
    path: "/conditions"
    description: "List conditions (filter by veteran_id or claim_id — reverse-reachability for Condition.veteran_id and Condition.claim_id)"
    roles: [ClaimsAdmin, RatingSpecialist, Veteran]
    code: 200
    input: ["veteran_id?", "claim_id?", "service_connection?", "limit?", "offset?"]
    output: Condition[]
    side_effects: []

  - method: GET
    path: "/conditions/{conditionId}"
    description: "Get a condition"
    roles: [ClaimsAdmin, RatingSpecialist, Veteran]
    code: 200
    input: []
    output: Condition
    side_effects: []

  - method: PATCH
    path: "/conditions/{conditionId}"
    description: "Update proposed_rating_pct or body-side fields (only while parent claim in DEVELOPMENT)"
    roles: [RatingSpecialist]
    code: 200
    input: ["proposed_rating_pct?", "body_side?", "is_extremity?"]
    output: Condition
    side_effects: ["increments Condition.version by 1"]

  # ---------- School ----------
  - method: POST
    path: "/schools"
    description: "Create a School"
    roles: [ClaimsAdmin]
    code: 201
    input: [name, is_public, monthly_housing_rate_cents, "yellow_ribbon_participant?", "yellow_ribbon_max_contribution_cents?", "yellow_ribbon_slots_total?"]
    output: School
    side_effects: ["yellow_ribbon_slots_used=0"]

  - method: GET
    path: "/schools/{schoolId}"
    description: "Get a School"
    roles: [ClaimsAdmin, RatingSpecialist, Veteran, SchoolCertifyingOfficial]
    code: 200
    input: []
    output: School
    side_effects: []

  # ---------- Enrollment ----------
  - method: POST
    path: "/enrollments"
    description: "Submit an enrollment (status=SUBMITTED; estimated MHA computed)"
    roles: [Veteran, SchoolCertifyingOfficial]
    code: 201
    input: [veteran_id, school_id, term_start, term_end, credit_hours, full_time_credit_hours, "tuition_charged_cents?", "requests_yellow_ribbon?"]
    output: Enrollment
    side_effects:
      - "status=SUBMITTED"
      - "rate_of_pursuit_pct computed; estimated_mha_cents computed via housing_allowance (estimated variant)"

  - method: GET
    path: "/enrollments/{enrollmentId}"
    description: "Get an Enrollment"
    roles: [ClaimsAdmin, Veteran, SchoolCertifyingOfficial]
    code: 200
    input: []
    output: Enrollment
    side_effects: []

  - method: GET
    path: "/enrollments"
    description: "List enrollments (filter by veteran_id or school_id — reverse-reachability for Enrollment.veteran_id and Enrollment.school_id)"
    roles: [ClaimsAdmin, RatingSpecialist, Veteran, SchoolCertifyingOfficial]
    code: 200
    input: ["veteran_id?", "school_id?", "status?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []

  - method: POST
    path: "/enrollments/{enrollmentId}/certify"
    description: "Certify enrollment (finalize MHA + Yellow Ribbon)"
    roles: [SchoolCertifyingOfficial]
    code: 200
    input: [expected_enrollment_version]
    output: Enrollment
    side_effects:
      - "status -> CERTIFIED"
      - "monthly_housing_allowance_cents computed via housing_allowance (finalized)"
      - "if Yellow Ribbon granted: yellow_ribbon_match_cents via yellow_ribbon_match; School.yellow_ribbon_slots_used += 1"
      - "increments Enrollment.version by 1"

  - method: POST
    path: "/enrollments/{enrollmentId}/complete"
    description: "Mark enrollment completed (terminal)"
    roles: [SchoolCertifyingOfficial]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["status -> COMPLETED"]

  - method: POST
    path: "/enrollments/{enrollmentId}/cancel"
    description: "Cancel enrollment (compensating: zero MHA, restore Yellow Ribbon slot)"
    roles: [Veteran]
    code: 200
    input: []
    output: Enrollment
    side_effects:
      - "status -> CANCELLED"
      - "monthly_housing_allowance_cents -> 0"
      - "if YR slot consumed: School.yellow_ribbon_slots_used -= 1; yellow_ribbon_match_cents -> 0"

  # ---------- VocRehabPlan ----------
  - method: POST
    path: "/voc-rehab-plans"
    description: "Propose a Chapter 31 Voc Rehab plan"
    roles: [ClaimsAdmin, Veteran]
    code: 201
    input: [veteran_id, planned_months, track]
    output: VocRehabPlan
    side_effects: ["status=PROPOSED"]

  - method: GET
    path: "/voc-rehab-plans/{planId}"
    description: "Get a Voc Rehab plan"
    roles: [ClaimsAdmin, Veteran]
    code: 200
    input: []
    output: VocRehabPlan
    side_effects: []

  - method: GET
    path: "/voc-rehab-plans"
    description: "List voc rehab plans (filter by veteran_id — reverse-reachability for VocRehabPlan.veteran_id)"
    roles: [ClaimsAdmin, Veteran]
    code: 200
    input: ["veteran_id?", "status?", "limit?", "offset?"]
    output: VocRehabPlan[]
    side_effects: []

  - method: POST
    path: "/voc-rehab-plans/{planId}/approve"
    description: "Approve plan (debit entitlement months)"
    roles: [ClaimsAdmin]
    code: 200
    input: []
    output: VocRehabPlan
    side_effects:
      - "status -> APPROVED"
      - "Veteran.voc_rehab_entitlement_months -= planned_months"

  - method: POST
    path: "/voc-rehab-plans/{planId}/complete"
    description: "Complete an approved plan (terminal)"
    roles: [ClaimsAdmin]
    code: 200
    input: []
    output: VocRehabPlan
    side_effects: ["status -> COMPLETED"]

  - method: POST
    path: "/voc-rehab-plans/{planId}/reject"
    description: "Reject a proposed plan (terminal)"
    roles: [ClaimsAdmin]
    code: 200
    input: []
    output: VocRehabPlan
    side_effects: ["status -> REJECTED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for operation, or entity_backed role acting on a resource it does not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing/malformed body field, bad enum, proposed_rating_pct not multiple of 10 in 0..100, non-positive credit hours" }
  - { id: ERR_DUPLICATE_FILE_NUMBER, http: 409, condition: "Veteran.file_number already exists" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match current version (OCC)" }
  - { id: ERR_CLAIM_HAS_NO_CONDITIONS, http: 409, condition: "open-development attempted on a claim with zero conditions" }
  - { id: ERR_CONDITION_UNRATED, http: 409, condition: "rate attempted while some condition lacks proposed_rating_pct" }
  - { id: ERR_APPEAL_EXHAUSTED, http: 409, condition: "remand attempted when remand_count >= MAX_REMANDS" }
  - { id: ERR_NO_GI_BILL_ELIGIBILITY, http: 409, condition: "Enrollment certify when Veteran.gi_bill_tier_pct == 0" }
  - { id: ERR_ENROLLMENT_OVERLAP, http: 409, condition: "Enrollment certify whose term interval overlaps an existing CERTIFIED enrollment for the same veteran" }
  - { id: ERR_YELLOW_RIBBON_UNAVAILABLE, http: 409, condition: "Yellow Ribbon requested but school not participating or no slots remaining" }
  - { id: ERR_VOC_REHAB_INELIGIBLE, http: 409, condition: "Voc Rehab approve when Veteran.combined_rating_pct < VOC_REHAB_MIN_RATING" }
  - { id: ERR_ENTITLEMENT_EXHAUSTED, http: 409, condition: "Voc Rehab approve when planned_months > Veteran.voc_rehab_entitlement_months" }
  - { id: ERR_NO_COMPENSABLE_RATING, http: 409, condition: "Award activation when Veteran.combined_rating_pct == 0" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ClaimsAdmin
    description: "VA adjudication officer: manages veterans, opens development, grants/denies/remands/closes claims, approves voc rehab, activates awards"
    identity: opaque
    exclusive_operations:
      - "POST /veterans — create veteran"
      - "PATCH /veterans/{id} — edit service time"
      - "POST /veterans/{id}/activate-award"
      - "POST /veterans/{id}/suspend-award"
      - "POST /claims/{id}/open-development"
      - "POST /claims/{id}/grant"
      - "POST /claims/{id}/deny"
      - "POST /claims/{id}/remand"
      - "POST /claims/{id}/close"
      - "POST /schools — create school"
      - "POST /voc-rehab-plans/{id}/approve"
      - "POST /voc-rehab-plans/{id}/complete"
      - "POST /voc-rehab-plans/{id}/reject"
    shared_operations:
      - "GET endpoints; POST /veterans/{id}/dependents and remove; POST /claims; POST /claims/{id}/conditions; POST /voc-rehab-plans"

  - name: RatingSpecialist
    description: "Medical rating examiner: proposes/edits condition ratings and rates claims"
    identity: opaque
    exclusive_operations:
      - "POST /claims/{id}/rate"
      - "PATCH /conditions/{id} — edit proposed ratings"
    shared_operations:
      - "GET endpoints (veterans, claims, conditions, enrollments); POST /claims/{id}/conditions"

  - name: SchoolCertifyingOfficial
    description: "School official who certifies enrollment for GI Bill housing/Yellow Ribbon"
    identity: opaque
    exclusive_operations:
      - "POST /enrollments/{id}/certify"
      - "POST /enrollments/{id}/complete"
    shared_operations:
      - "GET schools/enrollments; POST /enrollments — submit enrollment"

  - name: Veteran
    description: "The veteran (self-service): submits own claims/enrollments/voc-rehab, manages own dependents, cancels own enrollments. entity_backed — X-User-ID equals the acting Veteran.id; may only act on resources whose veteran_id equals X-User-ID."
    identity: "entity_backed:Veteran"
    exclusive_operations:
      - "POST /enrollments/{id}/cancel — cancel own enrollment"
    shared_operations:
      - "GET own veteran/claims/conditions/enrollments/voc-rehab-plans; POST /claims (own); POST /enrollments (own); POST /voc-rehab-plans (own); POST /veterans/{id}/dependents (own) and remove"
