          trigger:
            - call: "POST /sped-staffing/assignments"
              payload: { plan_id: "${plan_id}", student_id: "${s2}", para_id: "${p1}", building_id: "${b1}", start_date: "2026-05-04", end_date: "2026-06-30", days_of_week: ["MON","TUE","WED","THU","FRI"], daily_start_minute: 600, daily_end_minute: 900, expected_plan_version: "${plan_v2}" }
