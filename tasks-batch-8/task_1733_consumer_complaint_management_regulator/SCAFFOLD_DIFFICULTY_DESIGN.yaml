              as: IntakeSpecialist
              as_user_id: "user_intake_5"
              captures: { c10_id: $.data.id }
            - call: "POST /complaint-office/complaints/${c10_id}/triage"
              payload: {}
              as: CaseHandler
            - call: "POST /complaint-office/complaints/${c10_id}/start_investigation"
              payload: {}
              as: CaseHandler
          trigger:
            - call: "POST /complaint-office/complaints/${c10_id}/draft_response"
              payload: { response_text: "Wire fee refunded.", response_template_key: "WIRE-ACK-DRAFT" }
              as: CaseHandler
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_TEMPLATE_NOT_ACTIVE"
            - "response error_id != ERR_RCA_REQUIRED"
            - "Complaint.${c10_id}.status == INVESTIGATING (unchanged)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics, distinct endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: referral_deadline_inclusive_boundary_on_time_vs_late
        grounds:
          - calculations.response_due_at
          - entities.RegulatoryReferral.fields.timeliness
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Numeric timestamp boundary on POST .../referrals/{id}/submit_response:
          the comparison is submitted_at <= response_due_at (INCLUSIVE), so a
          submission at exactly 2026-08-16T00:00:00Z (the deadline instant)
          is ON_TIME while one second later (2026-08-16T00:00:01Z) is LATE.
          Metric: deadline timeliness on the referral submit endpoint.
        test_recipe:
          setup:
            - "Two portal-channel complaints received at 2026-08-01T00:00:00Z; both referrals have response_due_at == 2026-08-16T00:00:00Z"
            - "Clock set to exactly 2026-08-16T00:00:00Z for the first submission, then to 2026-08-16T00:00:01Z for the second"
          setup_api_calls:
            - call: "POST /complaint-office/products"
              payload: { product_code: "BND-PROD", display_name: "Boundary Product" }
              as: ComplaintManager
            - call: "POST /complaint-office/channels"
              payload: { channel_code: "CFPB_PORTAL", display_name: "CFPB Portal", is_regulator_portal: true }
              as: ComplaintManager
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "BND.CAT" }
              as: ComplaintManager
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CUST-801", channel_code: "CFPB_PORTAL", product_code: "BND-PROD", category_code: "BND.CAT", narrative: "boundary A", portal_ref: "CFPB-BND-A" }
              as: IntakeSpecialist
              captures: { cb_a: $.data.id }
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CUST-802", channel_code: "CFPB_PORTAL", product_code: "BND-PROD", category_code: "BND.CAT", narrative: "boundary B", portal_ref: "CFPB-BND-B" }
              as: IntakeSpecialist
              captures: { cb_b: $.data.id }
            - call: "GET /complaint-office/complaints/${cb_a}/referrals"
              payload: {}
              as: CaseHandler
              captures: { refb_a: $.data.0.id }
            - call: "GET /complaint-office/complaints/${cb_b}/referrals"
              payload: {}
              as: CaseHandler
              captures: { refb_b: $.data.0.id }
            - call: "POST /complaint-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: ComplaintManager
            - call: "POST /complaint-office/referrals/${refb_a}/submit_response"
              payload: { response_text: "Exactly at deadline." }
              as: CaseHandler
            - call: "POST /complaint-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:01Z" }
              as: ComplaintManager
          trigger:
            - call: "POST /complaint-office/referrals/${refb_b}/submit_response"
              payload: { response_text: "One second past deadline." }
              as: CaseHandler
          assert:
            - "RegulatoryReferral.${refb_a}.timeliness == ON_TIME"
            - "RegulatoryReferral.${refb_a}.submitted_at == 2026-08-16T00:00:00Z"
            - "RegulatoryReferral.${refb_b}.timeliness == LATE"
            - "RegulatoryReferral.${refb_b}.submitted_at == 2026-08-16T00:00:01Z"

      - name: empty_window_never_warns_and_zero_restitution_rejected
        grounds:
          - calculations.early_warning_threshold
