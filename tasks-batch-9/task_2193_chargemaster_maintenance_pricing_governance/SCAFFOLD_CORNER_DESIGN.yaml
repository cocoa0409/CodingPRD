            - "${cycle_approved} == CROSSWALK_APPROVED"
            - "${cycle_activated} == ACTIVATED and ${applied} == 2"
            - "${snap_items} == 2 and ${snap_gross} == 480000"
            - "${act_at} == 2026-09-01T00:00:00Z"
            - "ChargeItem.${it1}.code_value == 93458A and ChargeItem.${it1}.gross_charge_cents == 240000"
            - "ChargeItem.${it2}.code_value == 93460A and ChargeItem.${it2}.gross_charge_cents == 240000"
            - "ChargeItem.${it1}.last_code_cycle_id == ${cycle} and ChargeItem.${it2}.last_code_cycle_id == ${cycle}"
            - "CodeUpdateEntry.${e1}.status == APPLIED and CodeUpdateEntry.${e1}.prior_code_value == 93458"
            - "CodeUpdateEntry.${e2}.status == APPLIED and CodeUpdateEntry.${e2}.prior_code_value == 93460"
            - "CodeUpdateEntry.${e3}.status == DEFERRED and CodeUpdateEntry.${e3}.target_charge_item_id == null"
