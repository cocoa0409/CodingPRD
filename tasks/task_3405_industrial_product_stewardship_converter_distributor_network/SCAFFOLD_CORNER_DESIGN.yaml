            - call: "POST /stewardship/converters/${conv_id}/authorize"
              payload: {}
              as: ChannelManager
              as_user_id: "qa-7"
              captures: { sod_err: $.data.error_id }
            - call: "POST /stewardship/converters/${conv_id}/authorize"
              payload: {}
              as: ChannelManager
              as_user_id: "cm-1"
          assert:
            - "same-id authorize: 403 ERR_SEGREGATION_OF_DUTIES (actual ${sod_err})"
            - "different-id authorize (cm-1): 200, Converter.${conv_id}.status == AUTHORIZED"

      - name: sod_program_creator_cannot_activate_program
        claim_type: Segregation of duties
        grounds:
          - validations[priority=4]
          - errors.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: "created_by is pinned at program creation (cm-7); a FinanceController activation attempt carrying X-User-ID cm-7 is refused ERR_SEGREGATION_OF_DUTIES, while fc-1 activates fine."
