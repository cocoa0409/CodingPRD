            - { call: "POST /reservations/${res2}/settle", payload: {}, as: OperationsAdmin }
          assert:
            - "Reservation.${res1}.late_fee_cents == 0"
            - "Reservation.${res1}.payment_status == REFUNDED"
            - "Reservation.${res1}.deposit_released_cents == 15000"
            - "Reservation.${res2}.late_fee_cents == 450"
            - "Reservation.${res2}.deposit_captured_cents == 450"
            - "Reservation.${res2}.deposit_released_cents == 14550"

      - name: route_capacity_exact_fit_then_overflow
        grounds:
          - calculations.route_load_check
          - errors[ERR_ROUTE_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Metric = aggregate vehicle weight in kg (different metric than late minutes),
          reached via POST /routes/{id}/stops (different endpoint than settle). A stop
          bringing planned weight to exactly 24.0 == capacity is accepted (<=), while the
          next stop of 0.5 kg is rejected and planned weight stays 24.0.
        test_recipe:
          setup:
            - "Route with vehicle_capacity_kg 24.0; two confirmed reservations on 12.0 kg items; a third confirmed reservation on a 0.5 kg item"
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Quinn Ba", email: "quinn@x.com", phone: "707" }, as: Anonymous, captures: { cust: $.data.id } }
            - { call: "POST /catalog-items", payload: { name: "Crib M", category: "CRIB", daily_rate_cents: 3000, deposit_amount_cents: 15000, weight_kg: 12.0, cleaning_turnaround_hours: 24, deep_clean_every_cycles: 3 }, as: OperationsAdmin, captures: { cat_a: $.data.id } }
            - { call: "POST /catalog-items", payload: { name: "Toy T", category: "STROLLER", daily_rate_cents: 500, deposit_amount_cents: 1000, weight_kg: 0.5, cleaning_turnaround_hours: 0, deep_clean_every_cycles: 3 }, as: OperationsAdmin, captures: { cat_b: $.data.id } }
            - { call: "POST /inventory-units", payload: { catalog_item_id: "${cat_a}", serial_number: "SN-M1", condition_grade: "A" }, as: OperationsAdmin }
            - { call: "POST /inventory-units", payload: { catalog_item_id: "${cat_a}", serial_number: "SN-M2", condition_grade: "A" }, as: OperationsAdmin }
            - { call: "POST /inventory-units", payload: { catalog_item_id: "${cat_b}", serial_number: "SN-T1", condition_grade: "A" }, as: OperationsAdmin }
            - { call: "POST /reservations", payload: { delivery_address: "16 Palm Ct", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-12", lines: [ { catalog_item_id: "${cat_a}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res1: $.data.id } }
            - { call: "POST /reservations", payload: { delivery_address: "17 Palm Ct", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-12", lines: [ { catalog_item_id: "${cat_a}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res2: $.data.id } }
            - { call: "POST /reservations", payload: { delivery_address: "18 Palm Ct", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-12", lines: [ { catalog_item_id: "${cat_b}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res3: $.data.id } }
            - { call: "POST /reservations/${res1}/confirm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /reservations/${res2}/confirm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /reservations/${res3}/confirm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /routes", payload: { route_date: "2026-06-10", zone_code: "Z1", vehicle_capacity_kg: 24.0 }, as: OperationsAdmin, captures: { route: $.data.id } }
          trigger:
            - { call: "POST /routes/${route}/stops", payload: { reservation_id: "${res1}", stop_type: "DELIVERY_SETUP", address: "16 Palm Ct", time_window_start: "2026-06-10T08:00:00Z", time_window_end: "2026-06-10T09:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /routes/${route}/stops", payload: { reservation_id: "${res2}", stop_type: "DELIVERY_SETUP", address: "17 Palm Ct", time_window_start: "2026-06-10T09:00:00Z", time_window_end: "2026-06-10T10:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /routes/${route}/stops", payload: { reservation_id: "${res3}", stop_type: "DELIVERY_SETUP", address: "18 Palm Ct", time_window_start: "2026-06-10T10:00:00Z", time_window_end: "2026-06-10T11:00:00Z" }, as: OperationsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "first two stops accepted; DeliveryRoute.${route}.planned_weight_kg == 24.0 (exact fit allowed)"
            - "third stop rejected with error_id == ERR_ROUTE_CAPACITY_EXCEEDED"
            - "DeliveryRoute.${route}.planned_weight_kg still == 24.0 after rejection"

  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: confirm_requires_customer_active
        grounds:
          - state_machines.Reservation.QUOTED_to_CONFIRMED
          - state_machines.Customer.ACTIVE_to_SUSPENDED
          - errors[ERR_CUSTOMER_SUSPENDED]
        distinguishing_aspect: |
          Entity pair Reservation -> Customer: confirm is only valid while the owning
          Customer is ACTIVE; a SUSPENDED customer's confirm is rejected and the
          reservation stays QUOTED.
        test_recipe:
          setup:
            - "Customer suspended after registration; QUOTED reservation with available unit"
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Rui An", email: "rui@x.com", phone: "808" }, as: Anonymous, captures: { cust: $.data.id } }
            - { call: "POST /catalog-items", payload: { name: "Crib N", category: "CRIB", daily_rate_cents: 3000, deposit_amount_cents: 15000, weight_kg: 12.0, cleaning_turnaround_hours: 24, deep_clean_every_cycles: 3 }, as: OperationsAdmin, captures: { cat: $.data.id } }
            - { call: "POST /inventory-units", payload: { catalog_item_id: "${cat}", serial_number: "SN-N1", condition_grade: "A" }, as: OperationsAdmin }
            - { call: "POST /reservations", payload: { delivery_address: "19 Lilac Ln", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-13", lines: [ { catalog_item_id: "${cat}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res: $.data.id } }
            - { call: "POST /customers/${cust}/suspend", payload: {}, as: OperationsAdmin }
          trigger:
            - { call: "POST /reservations/${res}/confirm", payload: {}, as: Customer, as_user_id: "${cust}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CUSTOMER_SUSPENDED"
            - "Reservation.${res}.status == QUOTED (unchanged)"

      - name: stop_complete_requires_route_dispatched
        grounds:
          - state_machines.RouteStop.SCHEDULED_to_COMPLETED
          - state_machines.DeliveryRoute
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair RouteStop -> DeliveryRoute (different pair than Reservation ->
          Customer): completing a stop is only valid while its route is DISPATCHED; with
          the route still PLANNED the completion is rejected and the stop stays SCHEDULED.
        test_recipe:
          setup:
            - "CONFIRMED reservation; PLANNED route with one SCHEDULED DELIVERY_SETUP stop"
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Sue Ma", email: "sue@x.com", phone: "909" }, as: Anonymous, captures: { cust: $.data.id } }
            - { call: "POST /catalog-items", payload: { name: "Crib O", category: "CRIB", daily_rate_cents: 3000, deposit_amount_cents: 15000, weight_kg: 12.0, cleaning_turnaround_hours: 24, deep_clean_every_cycles: 3 }, as: OperationsAdmin, captures: { cat: $.data.id } }
            - { call: "POST /inventory-units", payload: { catalog_item_id: "${cat}", serial_number: "SN-O1", condition_grade: "A" }, as: OperationsAdmin }
            - { call: "POST /reservations", payload: { delivery_address: "20 Maple Dr", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-13", lines: [ { catalog_item_id: "${cat}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res: $.data.id } }
            - { call: "POST /reservations/${res}/confirm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /routes", payload: { route_date: "2026-06-10", zone_code: "Z1", vehicle_capacity_kg: 100 }, as: OperationsAdmin, captures: { route: $.data.id } }
            - { call: "POST /routes/${route}/stops", payload: { reservation_id: "${res}", stop_type: "DELIVERY_SETUP", address: "20 Maple Dr", time_window_start: "2026-06-10T08:00:00Z", time_window_end: "2026-06-10T10:00:00Z" }, as: OperationsAdmin, captures: { stop: $.data.id } }
          trigger:
            - { call: "POST /route-stops/${stop}/complete", payload: {}, as: OperationsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "RouteStop.${stop}.status == SCHEDULED (unchanged)"
            - "Reservation.${res}.status == CONFIRMED (unchanged)"

      - name: extension_approve_requires_unit_free
        grounds:
          - state_machines.ExtensionRequest.PENDING_to_APPROVED
          - calculations.availability_count
          - errors[ERR_EXTENSION_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Entity pair ExtensionRequest/Reservation -> InventoryUnit (different pair than
          the other two instances): approving an extension re-checks every allocated
          unit's committed intervals; res2's confirmed booking [06-14, 06-18) on the same
          unit makes res1's extension to 06-15 fail and leaves res1.end_date unchanged.
        test_recipe:
          setup:
            - "Single unit U1; res1 CONFIRMED 2026-06-10 -> 2026-06-13; res2 CONFIRMED 2026-06-14 -> 2026-06-17 (starts exactly at res1's buffered end, legal); res1 requests extension to 2026-06-15"
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Tom Yi", email: "tom@x.com", phone: "111" }, as: Anonymous, captures: { cust: $.data.id } }
            - { call: "POST /catalog-items", payload: { name: "Crib P", category: "CRIB", daily_rate_cents: 3000, deposit_amount_cents: 15000, weight_kg: 12.0, cleaning_turnaround_hours: 24, deep_clean_every_cycles: 3 }, as: OperationsAdmin, captures: { cat: $.data.id } }
            - { call: "POST /inventory-units", payload: { catalog_item_id: "${cat}", serial_number: "SN-P1", condition_grade: "A" }, as: OperationsAdmin, captures: { unit: $.data.id } }
            - { call: "POST /reservations", payload: { delivery_address: "21 Nutmeg Rd", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-13", lines: [ { catalog_item_id: "${cat}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res1: $.data.id } }
            - { call: "POST /reservations/${res1}/confirm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /reservations", payload: { delivery_address: "22 Nutmeg Rd", zone_code: "Z1", start_date: "2026-06-14", end_date: "2026-06-17", lines: [ { catalog_item_id: "${cat}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res2: $.data.id } }
            - { call: "POST /reservations/${res2}/confirm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "GET /reservations/${res1}", payload: {}, as: OperationsAdmin, captures: { res1_v: $.data.version } }
            - { call: "POST /reservations/${res1}/extensions", payload: { requested_end_date: "2026-06-15", expected_reservation_version: "${res1_v}" }, as: Customer, as_user_id: "${cust}", captures: { ext: $.data.id } }
          trigger:
            - { call: "POST /extensions/${ext}/approve", payload: {}, as: OperationsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_EXTENSION_WINDOW_CONFLICT"
            - "ExtensionRequest.${ext}.status == PENDING (unchanged)"
            - "Reservation.${res1}.end_date == 2026-06-13 (unchanged)"
            - "Reservation.${res2}.status == CONFIRMED (unaffected)"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: unit_buffer_blocks_adjacent_booking
        grounds:
          - calculations.availability_count
          - entities.InventoryUnit.fields.blocked_until
        distinguishing_aspect: |
          Resource = InventoryUnit; interval semantics = buffered half-open (committed
          interval extended by cleaning_turnaround_hours). A confirmed rental
          [06-10, 06-13) with 24h turnaround blocks the unit until 06-14T00:00Z:
          availability for a window starting 06-13 is 0, while a window starting exactly
          at the buffered end 06-14 is 1 (adjacency at the buffer boundary allowed).
        test_recipe:
          setup:
            - "One unit committed to a CONFIRMED reservation 2026-06-10 -> 2026-06-13; catalog cleaning_turnaround_hours 24"
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Uma De", email: "uma@x.com", phone: "121" }, as: Anonymous, captures: { cust: $.data.id } }
            - { call: "POST /catalog-items", payload: { name: "Crib Q", category: "CRIB", daily_rate_cents: 3000, deposit_amount_cents: 15000, weight_kg: 12.0, cleaning_turnaround_hours: 24, deep_clean_every_cycles: 3 }, as: OperationsAdmin, captures: { cat: $.data.id } }
            - { call: "POST /inventory-units", payload: { catalog_item_id: "${cat}", serial_number: "SN-Q1", condition_grade: "A" }, as: OperationsAdmin, captures: { unit: $.data.id } }
            - { call: "POST /reservations", payload: { delivery_address: "23 Olive St", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-13", lines: [ { catalog_item_id: "${cat}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res: $.data.id } }
            - { call: "POST /reservations/${res}/confirm", payload: {}, as: Customer, as_user_id: "${cust}" }
          trigger:
            - { call: "GET /catalog-items/${cat}/availability", payload: { start_date: "2026-06-13", end_date: "2026-06-16" }, as: OperationsAdmin, captures: { count_overlap: $.data.available_count } }
            - { call: "GET /catalog-items/${cat}/availability", payload: { start_date: "2026-06-14", end_date: "2026-06-17" }, as: OperationsAdmin, captures: { count_adjacent: $.data.available_count } }
          assert:
            - "available_count for [2026-06-13, 2026-06-16) == 0 (inside cleaning buffer)"
            - "available_count for [2026-06-14, 2026-06-17) == 1 (adjacent at buffered end allowed)"

      - name: route_aggregate_capacity_overflow_rejection
        grounds:
          - calculations.route_load_check
          - errors[ERR_ROUTE_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Resource = DeliveryRoute; interval semantics = aggregate shared capacity pool
          (sum of stop weights vs vehicle capacity — NOT interval adjacency as in the
          unit-booking rule). Stops totalling exactly 24.0 kg succeed; a further 0.5 kg
          stop is rejected and the pool total is unchanged.
        test_recipe:
          setup:
            - "Route capacity 24.0 with two stops of 12.0 kg each already added (planned weight 24.0); third confirmed reservation gear weight 0.5 kg"
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Val Ko", email: "val@x.com", phone: "131" }, as: Anonymous, captures: { cust: $.data.id } }
            - { call: "POST /catalog-items", payload: { name: "Crib R", category: "CRIB", daily_rate_cents: 3000, deposit_amount_cents: 15000, weight_kg: 12.0, cleaning_turnaround_hours: 24, deep_clean_every_cycles: 3 }, as: OperationsAdmin, captures: { cat_a: $.data.id } }
            - { call: "POST /catalog-items", payload: { name: "Toy U", category: "STROLLER", daily_rate_cents: 500, deposit_amount_cents: 1000, weight_kg: 0.5, cleaning_turnaround_hours: 0, deep_clean_every_cycles: 3 }, as: OperationsAdmin, captures: { cat_b: $.data.id } }
            - { call: "POST /inventory-units", payload: { catalog_item_id: "${cat_a}", serial_number: "SN-R1", condition_grade: "A" }, as: OperationsAdmin }
            - { call: "POST /inventory-units", payload: { catalog_item_id: "${cat_a}", serial_number: "SN-R2", condition_grade: "A" }, as: OperationsAdmin }
            - { call: "POST /inventory-units", payload: { catalog_item_id: "${cat_b}", serial_number: "SN-U1", condition_grade: "A" }, as: OperationsAdmin }
            - { call: "POST /reservations", payload: { delivery_address: "24 Rose Ave", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-12", lines: [ { catalog_item_id: "${cat_a}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res1: $.data.id } }
            - { call: "POST /reservations", payload: { delivery_address: "25 Rose Ave", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-12", lines: [ { catalog_item_id: "${cat_a}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res2: $.data.id } }
            - { call: "POST /reservations", payload: { delivery_address: "26 Rose Ave", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-12", lines: [ { catalog_item_id: "${cat_b}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res3: $.data.id } }
            - { call: "POST /reservations/${res1}/confirm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /reservations/${res2}/confirm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /reservations/${res3}/confirm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /routes", payload: { route_date: "2026-06-10", zone_code: "Z1", vehicle_capacity_kg: 24.0 }, as: OperationsAdmin, captures: { route: $.data.id } }
            - { call: "POST /routes/${route}/stops", payload: { reservation_id: "${res1}", stop_type: "DELIVERY_SETUP", address: "24 Rose Ave", time_window_start: "2026-06-10T08:00:00Z", time_window_end: "2026-06-10T09:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /routes/${route}/stops", payload: { reservation_id: "${res2}", stop_type: "DELIVERY_SETUP", address: "25 Rose Ave", time_window_start: "2026-06-10T09:00:00Z", time_window_end: "2026-06-10T10:00:00Z" }, as: OperationsAdmin }
          trigger:
            - { call: "POST /routes/${route}/stops", payload: { reservation_id: "${res3}", stop_type: "DELIVERY_SETUP", address: "26 Rose Ave", time_window_start: "2026-06-10T10:00:00Z", time_window_end: "2026-06-10T11:00:00Z" }, as: OperationsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ROUTE_CAPACITY_EXCEEDED (24.5 > 24.0 pool capacity)"
            - "DeliveryRoute.${route}.planned_weight_kg == 24.0 (unchanged by rejected stop)"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: deposit_ledger_conservation_after_settle
        grounds:
          - calculations.deposit_settlement_waterfall
          - entities.DepositTransaction
          - entities.Reservation.fields.deposit_hold_cents
        distinguishing_aspect: |
          Conserved quantity = monetary deposit ledger: after settlement,
          deposit_hold_cents == deposit_captured_cents + deposit_released_cents, and the
          DepositTransaction stream reproduces it entry by entry (HOLD 15000 -> CAPTURE
          4800 -> CAPTURE 450 -> RELEASE 9750) with balance_after_cents ending at 0.
        test_recipe:
          setup:
            - "Grade-B unit, uninsured; reservation returned at 04:01 (late fee 450); one APPROVED MINOR claim repair 10000 (capture 4800)"
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Wes Lu", email: "wes@x.com", phone: "141" }, as: Anonymous, captures: { cust: $.data.id } }
            - { call: "POST /catalog-items", payload: { name: "Crib S", category: "CRIB", daily_rate_cents: 3000, deposit_amount_cents: 15000, weight_kg: 12.0, cleaning_turnaround_hours: 24, deep_clean_every_cycles: 3 }, as: OperationsAdmin, captures: { cat: $.data.id } }
            - { call: "POST /inventory-units", payload: { catalog_item_id: "${cat}", serial_number: "SN-S1", condition_grade: "B" }, as: OperationsAdmin, captures: { unit: $.data.id } }
            - { call: "POST /reservations", payload: { delivery_address: "27 Sage Ct", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-13", lines: [ { catalog_item_id: "${cat}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res: $.data.id } }
            - { call: "POST /reservations/${res}/confirm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /routes", payload: { route_date: "2026-06-10", zone_code: "Z1", vehicle_capacity_kg: 100 }, as: OperationsAdmin, captures: { route_d: $.data.id } }
            - { call: "POST /routes/${route_d}/stops", payload: { reservation_id: "${res}", stop_type: "DELIVERY_SETUP", address: "27 Sage Ct", time_window_start: "2026-06-10T08:00:00Z", time_window_end: "2026-06-10T10:00:00Z" }, as: OperationsAdmin, captures: { stop_d: $.data.id } }
            - { call: "POST /routes/${route_d}/dispatch", payload: {}, as: OperationsAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T09:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /route-stops/${stop_d}/complete", payload: {}, as: OperationsAdmin }
            - { call: "POST /routes", payload: { route_date: "2026-06-13", zone_code: "Z1", vehicle_capacity_kg: 100 }, as: OperationsAdmin, captures: { route_p: $.data.id } }
            - { call: "POST /routes/${route_p}/stops", payload: { reservation_id: "${res}", stop_type: "PICKUP", address: "27 Sage Ct", time_window_start: "2026-06-13T00:00:00Z", time_window_end: "2026-06-13T06:00:00Z" }, as: OperationsAdmin, captures: { stop_p: $.data.id } }
            - { call: "POST /routes/${route_p}/dispatch", payload: {}, as: OperationsAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-13T04:01:00Z" }, as: OperationsAdmin }
            - { call: "POST /route-stops/${stop_p}/complete", payload: {}, as: OperationsAdmin }
            - { call: "GET /reservation-lines", payload: { reservation_id: "${res}" }, as: OperationsAdmin, captures: { line: "$.data[0].id" } }
            - { call: "POST /damage-claims", payload: { reservation_line_id: "${line}", severity: "MINOR", repair_cost_cents: 10000, description: "wheel damage" }, as: Inspector, as_user_id: "insp-1", captures: { claim: $.data.id } }
            - { call: "POST /damage-claims/${claim}/approve", payload: {}, as: OperationsAdmin, as_user_id: "ops-1" }
          trigger:
            - { call: "POST /reservations/${res}/settle", payload: {}, as: OperationsAdmin }
            - { call: "GET /reservations/${res}/deposit-transactions", payload: {}, as: OperationsAdmin }
          assert:
            - "Reservation.${res}.deposit_hold_cents == 15000"
            - "Reservation.${res}.deposit_captured_cents == 5250"
            - "Reservation.${res}.deposit_released_cents == 9750"
            - "deposit_captured_cents + deposit_released_cents == deposit_hold_cents (5250 + 9750 == 15000)"
            - "ledger order: HOLD 15000 (balance 15000), CAPTURE 4800 DAMAGE_CLAIM (10200), CAPTURE 450 LATE_FEE (9750), RELEASE 9750 RELEASE_REMAINDER (0)"

      - name: unit_pool_conservation_across_confirm_cancel
        grounds:
          - state_machines.InventoryUnit.AVAILABLE_to_RESERVED
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - calculations.availability_count
        distinguishing_aspect: |
          Conserved quantity = bookable pool cardinality (different type than the monetary
          ledger): confirm moves units AVAILABLE -> RESERVED and its compensating cancel
          moves them RESERVED -> AVAILABLE, so availability over the same window returns
          exactly to its pre-confirm value (2 -> 0 -> 2) with no unit leaked or duplicated.
        test_recipe:
          setup:
            - "Catalog with exactly two units; no bookings"
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Xiu Pa", email: "xiu@x.com", phone: "151" }, as: Anonymous, captures: { cust: $.data.id } }
            - { call: "POST /catalog-items", payload: { name: "Crib T", category: "CRIB", daily_rate_cents: 3000, deposit_amount_cents: 15000, weight_kg: 12.0, cleaning_turnaround_hours: 24, deep_clean_every_cycles: 3 }, as: OperationsAdmin, captures: { cat: $.data.id } }
            - { call: "POST /inventory-units", payload: { catalog_item_id: "${cat}", serial_number: "SN-T1", condition_grade: "A" }, as: OperationsAdmin, captures: { u1: $.data.id } }
            - { call: "POST /inventory-units", payload: { catalog_item_id: "${cat}", serial_number: "SN-T2", condition_grade: "A" }, as: OperationsAdmin, captures: { u2: $.data.id } }
            - { call: "GET /catalog-items/${cat}/availability", payload: { start_date: "2026-06-10", end_date: "2026-06-13" }, as: OperationsAdmin, captures: { count_before: $.data.available_count } }
            - { call: "POST /reservations", payload: { delivery_address: "28 Thyme Way", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-13", lines: [ { catalog_item_id: "${cat}" }, { catalog_item_id: "${cat}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res: $.data.id } }
            - { call: "POST /reservations/${res}/confirm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "GET /catalog-items/${cat}/availability", payload: { start_date: "2026-06-10", end_date: "2026-06-13" }, as: OperationsAdmin, captures: { count_confirmed: $.data.available_count } }
          trigger:
            - { call: "POST /reservations/${res}/cancel", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "GET /catalog-items/${cat}/availability", payload: { start_date: "2026-06-10", end_date: "2026-06-13" }, as: OperationsAdmin, captures: { count_after: $.data.available_count } }
          assert:
            - "available_count before confirm == 2"
            - "available_count after confirm == 0"
            - "available_count after cancel == 2 (pool restored exactly)"
            - "InventoryUnit.${u1}.status == AVAILABLE and InventoryUnit.${u2}.status == AVAILABLE"
