# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 2459 — Digital Accessibility Conformance Reporting
# Breadth walk of references/claim-extraction-guide.md against SCAFFOLD.yaml
# §1.1–§1.7. Corners already asserted by a §1.8 instance appear as
# `excluded_because:` stubs naming that instance.
# Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: corner_standard_creation_returns_declared_fields
        claim_type: creation
        grounds:
          - entities.Standard.fields.code
          - entities.Standard.fields.max_target_level
        distinguishing_aspect: "POST /standards with all four required inputs returns 201 with code WCAG_2_2, surface_scope WEB, max_target_level AAA and a server-minted id."
        test_recipe:
          setup: ["Empty database; the logical clock is pinned to 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
          trigger:
            - call: "POST /standards"
              payload: { code: "WCAG_2_2", title: "WCAG 2.2", surface_scope: "WEB", max_target_level: "AAA" }
              as: AccessibilityLead
              captures: { std_id: $.data.id, std_code: $.data.code, std_scope: $.data.surface_scope }
          assert:
            - "HTTP 201"
            - "${std_code} == WCAG_2_2"
            - "${std_scope} == WEB"
            - "Standard.${std_id}.max_target_level == AAA"
            - "Standard.${std_id}.title == WCAG 2.2"

      - name: corner_get_criterion_returns_stored_row
        claim_type: retrieval
        grounds:
          - entities.SuccessCriterion.fields.criterion_number
          - entities.SuccessCriterion.fields.disability_categories
        distinguishing_aspect: "GET /criteria/{id} echoes exactly the criterion_number, level and disability_categories that were posted, with no version field in the payload."
        test_recipe:
          setup: ["One standard WCAG_2_2 holding criterion 1.1.1 at level A tagged VISION and COGNITIVE"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
            - call: "POST /standards"
              payload: { code: "WCAG_2_2", title: "WCAG 2.2", surface_scope: "WEB", max_target_level: "AAA" }
              as: AccessibilityLead
              captures: { std_id: $.data.id }
            - call: "POST /standards/${std_id}/criteria"
              payload: { criterion_number: "1.1.1", title: "Non-text Content", level: "A", disability_categories: ["VISION", "COGNITIVE"], applies_to_surfaces: ["WEB"] }
              as: AccessibilityLead
              captures: { crit_id: $.data.id }
          trigger:
            - call: "GET /criteria/${crit_id}"
              payload: {}
              as: AccessibilityTester
              captures: { read_number: $.data.criterion_number, read_cats: $.data.disability_categories }
          assert:
            - "HTTP 200"
            - "${read_number} == 1.1.1"
            - "${read_cats} == [VISION, COGNITIVE]"
            - "SuccessCriterion.${crit_id}.level == A"
            - "SuccessCriterion.${crit_id}.standard_id == ${std_id}"

      - name: corner_known_issue_list_paginates_with_total_count
        claim_type: listing
        grounds:
          - entities.KnownIssue.fields.severity
          - entities.Product.fields.publication_posture
        distinguishing_aspect: "GET /known-issues?product_id=&limit=2&offset=0 over three issues returns 2 rows with total_count 3 and has_more true; offset 2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "One product with one component and three OPEN known issues (BLOCKER, SERIOUS, MINOR), all publish_intent INCLUDED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
            - call: "POST /standards"
              payload: { code: "WCAG_2_2", title: "WCAG 2.2", surface_scope: "WEB", max_target_level: "AAA" }
              as: AccessibilityLead
              captures: { std_id: $.data.id }
            - call: "POST /standards/${std_id}/criteria"
              payload: { criterion_number: "1.1.1", title: "Non-text Content", level: "A", disability_categories: ["VISION", "COGNITIVE"], applies_to_surfaces: ["WEB"] }
              as: AccessibilityLead
              captures: { crit_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Insight Portal", version_label: "7.0", standard_id: "${std_id}", target_level: "AA", surface_type: "WEB" }
              as: AccessibilityLead
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/components"
              payload: { name: "Web UI", component_type: "WEB_UI", in_scope: true, assessment_scope: "FULL", applicable_criteria_count: 40, user_reach_pct: 60 }
              as: AccessibilityLead
              captures: { comp_id: $.data.id }
            - call: "POST /known-issues"
              payload: { product_id: "${prod_id}", component_id: "${comp_id}", criterion_id: "${crit_id}", severity: "BLOCKER", summary: "Primary navigation is unreachable by keyboard", effort_points: 2, target_remediation_date: "2026-09-10", publish_intent: "INCLUDED" }
              as: AccessibilityTester
            - call: "POST /known-issues"
              payload: { product_id: "${prod_id}", component_id: "${comp_id}", criterion_id: "${crit_id}", severity: "SERIOUS", summary: "Media library thumbnails expose no accessible name", effort_points: 1, target_remediation_date: "2026-09-10", publish_intent: "INCLUDED" }
              as: AccessibilityTester
            - call: "POST /known-issues"
              payload: { product_id: "${prod_id}", component_id: "${comp_id}", criterion_id: "${crit_id}", severity: "MINOR", summary: "Decorative icons expose redundant alternative text", effort_points: 1, target_remediation_date: "2026-09-10", publish_intent: "INCLUDED" }
              as: AccessibilityTester
          trigger:
            - call: "GET /known-issues"
              payload: { product_id: "${prod_id}", limit: 2, offset: 0 }
              as: AccessibilityLead
            - call: "GET /known-issues"
              payload: { product_id: "${prod_id}", limit: 2, offset: 2 }
              as: AccessibilityLead
          assert:
            - "First list: HTTP 200, response_type == array, 2 rows returned, total_count == 3, has_more == true"
            - "Second list: 1 row returned, total_count == 3, has_more == false"
            - "Every returned row has product_id == ${prod_id} and state == OPEN"

      - name: corner_get_product_with_unknown_id_not_found
        claim_type: not_found
        grounds:
          - validations[priority=12]
          - entities.Product.fields.publication_posture
        distinguishing_aspect: "GET /products/{id} for the well-formed but absent id 00000000-0000-0000-0000-0000000000ff returns ERR_PRODUCT_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["Empty database apart from the pinned clock; no product has ever been created"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
          trigger:
            - call: "GET /products/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: AccessibilityLead
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "${err} == ERR_PRODUCT_NOT_FOUND"
            - "response_type == error"

      - name: corner_component_create_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=20]
          - entities.ProductComponent.fields.applicable_criteria_count
        distinguishing_aspect: "POST /products/{id}/components without applicable_criteria_count returns ERR_INVALID_REQUEST 400 and creates no row, leaving components_in_scope_count at 0."
        test_recipe:
          setup: ["One standard and one product with an empty component inventory"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
            - call: "POST /standards"
              payload: { code: "WCAG_2_2", title: "WCAG 2.2", surface_scope: "WEB", max_target_level: "AAA" }
              as: AccessibilityLead
              captures: { std_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Insight Portal", version_label: "7.0", standard_id: "${std_id}", target_level: "AA", surface_type: "WEB" }
              as: AccessibilityLead
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /products/${prod_id}/components"
              payload: { name: "Web UI", component_type: "WEB_UI", in_scope: true, assessment_scope: "FULL", user_reach_pct: 60 }
              as: AccessibilityLead
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "${err} == ERR_INVALID_REQUEST"
            - "Product.${prod_id}.components_in_scope_count == 0"
            - "Product.${prod_id}.version == 1 (the rejected create bumped nothing)"

      - name: corner_environment_buffer_default_applied_when_omitted
        claim_type: defaults
        grounds:
          - entities.TestEnvironment.fields.reconfiguration_buffer_minutes
          - validations[priority=63]
        distinguishing_aspect: "POST /test-environments without reconfiguration_buffer_minutes stores the declared default of 30, which is observable because a run starting 12:20 after an 09:00-12:00 booking is refused."
        test_recipe:
          setup:
            - "One product with one in-scope component of applicable_criteria_count 40"
            - "One SCREEN_READER bench created without the optional buffer field"
            - "One SCHEDULED MANUAL run occupies 2026-08-03T09:00:00Z..12:00:00Z on that bench"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
            - call: "POST /standards"
              payload: { code: "WCAG_2_2", title: "WCAG 2.2", surface_scope: "WEB", max_target_level: "AAA" }
              as: AccessibilityLead
              captures: { std_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Insight Portal", version_label: "7.0", standard_id: "${std_id}", target_level: "AA", surface_type: "WEB" }
              as: AccessibilityLead
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/components"
              payload: { name: "Web UI", component_type: "WEB_UI", in_scope: true, assessment_scope: "FULL", applicable_criteria_count: 40, user_reach_pct: 60 }
              as: AccessibilityLead
              captures: { comp_id: $.data.id }
            - call: "POST /test-environments"
              payload: { name: "NVDA Bench 1", at_profile: "SCREEN_READER", at_product_name: "NVDA 2026.1", os_platform: "WINDOWS" }
              as: AccessibilityLead
              captures: { env_id: $.data.id, buffer: $.data.reconfiguration_buffer_minutes }
            - call: "POST /assessment-runs"
              payload: { component_id: "${comp_id}", environment_id: "${env_id}", method: "MANUAL", at_profile: "SCREEN_READER", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T12:00:00Z", criteria_exercised: 40, disability_categories_validated: ["VISION", "COGNITIVE"] }
              as: AccessibilityTester
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /assessment-runs"
              payload: { component_id: "${comp_id}", environment_id: "${env_id}", method: "AUTOMATED", at_profile: "SCREEN_READER", scheduled_start: "2026-08-03T12:20:00Z", scheduled_end: "2026-08-03T13:20:00Z", criteria_exercised: 10, disability_categories_validated: ["VISION"] }
              as: AccessibilityTester
              captures: { err: $.data.error_id }
          assert:
            - "${buffer} == 30"
            - "HTTP 409"
            - "${err} == ERR_ENVIRONMENT_WINDOW_CONFLICT"
            - "AssessmentRun.${run_id}.status == SCHEDULED"

      - name: corner_component_computed_fields_initialise_from_system
        claim_type: computed_fields
        grounds:
          - entities.ProductComponent.fields.coverage_pct
          - entities.ProductComponent.fields.evidence_units_total
          - entities.ProductComponent.fields.validated_disability_categories
        distinguishing_aspect: "A freshly created component carries computed coverage_pct 0.00, evidence_units_total 0 and an empty validated_disability_categories even though the client supplied none of them."
        test_recipe:
          setup: ["One standard and one product with an empty component inventory"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
            - call: "POST /standards"
              payload: { code: "WCAG_2_2", title: "WCAG 2.2", surface_scope: "WEB", max_target_level: "AAA" }
              as: AccessibilityLead
              captures: { std_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Insight Portal", version_label: "7.0", standard_id: "${std_id}", target_level: "AA", surface_type: "WEB" }
              as: AccessibilityLead
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /products/${prod_id}/components"
              payload: { name: "Web UI", component_type: "WEB_UI", in_scope: true, assessment_scope: "FULL", applicable_criteria_count: 40, user_reach_pct: 60 }
              as: AccessibilityLead
              captures: { comp_id: $.data.id, cov: $.data.coverage_pct, units: $.data.evidence_units_total, cats: $.data.validated_disability_categories }
          assert:
            - "HTTP 201"
            - "${cov} == 0.00"
            - "${units} == 0"
            - "${cats} == []"
            - "ProductComponent.${comp_id}.assessment_state == PLANNED"
            - "ProductComponent.${comp_id}.design_review_state == NOT_REVIEWED"
            - "Product.${prod_id}.components_in_scope_count == 1"

      - name: corner_system_fields_generated_on_create
        claim_type: system_fields
        grounds:
          - entities.Standard.fields.code
          - concurrency_rules[report-create-stale-product]
        distinguishing_aspect: "A created Standard carries a server-minted id, created_at equal to the logical clock 2026-08-01T00:00:00Z and version 1; none of the three are client inputs."
        test_recipe:
          setup: ["Empty database with the logical clock pinned to 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
          trigger:
            - call: "POST /standards"
              payload: { code: "WCAG_2_2", title: "WCAG 2.2", surface_scope: "WEB", max_target_level: "AAA" }
              as: AccessibilityLead
              captures: { std_id: $.data.id, made_at: $.data.created_at, ver: $.data.version }
          assert:
            - "${std_id} is a non-empty server-minted identifier"
            - "${made_at} == 2026-08-01T00:00:00Z"
            - "${ver} == 1"
            - "Standard.${std_id}.updated_at == 2026-08-01T00:00:00Z"

      - name: corner_criterion_level_invalid_enum_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=20]
          - entities.SuccessCriterion.fields.level
        distinguishing_aspect: "POST /standards/{id}/criteria with level AAAA (outside {A, AA, AAA}) returns ERR_INVALID_REQUEST 400 rather than the 422 level-unsupported error."
        test_recipe:
          setup: ["One standard WCAG_2_2 with max_target_level AAA and no criteria"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
            - call: "POST /standards"
              payload: { code: "WCAG_2_2", title: "WCAG 2.2", surface_scope: "WEB", max_target_level: "AAA" }
              as: AccessibilityLead
              captures: { std_id: $.data.id }
          trigger:
            - call: "POST /standards/${std_id}/criteria"
              payload: { criterion_number: "1.1.1", title: "Non-text Content", level: "AAAA", disability_categories: ["VISION"], applies_to_surfaces: ["WEB"] }
              as: AccessibilityLead
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "${err} == ERR_INVALID_REQUEST"
            - "GET /standards/${std_id}/criteria returns total_count == 0"

      - name: corner_success_criterion_is_immutable
        claim_type: immutability
        grounds:
          - entities.SuccessCriterion.fields.criterion_number
          - entities.SuccessCriterion.fields.level
        distinguishing_aspect: "SuccessCriterion is declared with common_fields false: §1.5 exposes no PATCH/PUT/DELETE for /criteria/{id} and the GET response carries no version field, so the row can only be read."
        test_recipe:
          setup: ["One standard holding criterion 1.4.3 at level AA"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
            - call: "POST /standards"
              payload: { code: "WCAG_2_2", title: "WCAG 2.2", surface_scope: "WEB", max_target_level: "AAA" }
              as: AccessibilityLead
              captures: { std_id: $.data.id }
            - call: "POST /standards/${std_id}/criteria"
              payload: { criterion_number: "1.4.3", title: "Contrast Minimum", level: "AA", disability_categories: ["VISION"], applies_to_surfaces: ["WEB"] }
              as: AccessibilityLead
              captures: { crit_id: $.data.id }
          trigger:
            - call: "GET /criteria/${crit_id}"
              payload: {}
              as: ConformanceReviewer
              captures: { read_level: $.data.level }
          assert:
            - "HTTP 200"
            - "${read_level} == AA"
            - "The response body for SuccessCriterion.${crit_id} exposes no version field"
            - "No mutation endpoint for /criteria/{id} exists in §1.5, so the row is write-once"

      - name: corner_component_under_unknown_product_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=12]
          - entities.ProductComponent.fields.product_id
        distinguishing_aspect: "POST /products/{id}/components under the absent parent id 00000000-0000-0000-0000-0000000000ee returns ERR_PRODUCT_NOT_FOUND 404 before any body validation runs."
        test_recipe:
          setup: ["One real standard and one real product exist, but the request targets a different, non-existent product id"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
            - call: "POST /standards"
              payload: { code: "WCAG_2_2", title: "WCAG 2.2", surface_scope: "WEB", max_target_level: "AAA" }
              as: AccessibilityLead
              captures: { std_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Insight Portal", version_label: "7.0", standard_id: "${std_id}", target_level: "AA", surface_type: "WEB" }
              as: AccessibilityLead
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /products/00000000-0000-0000-0000-0000000000ee/components"
              payload: { name: "Web UI", component_type: "WEB_UI", in_scope: true, assessment_scope: "FULL", applicable_criteria_count: 40, user_reach_pct: 60 }
              as: AccessibilityLead
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "${err} == ERR_PRODUCT_NOT_FOUND"
            - "Product.${prod_id}.components_in_scope_count == 0"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: corner_assessment_run_initial_state_is_scheduled
        claim_type: initial_state
        grounds:
          - state_machines.AssessmentRun.SCHEDULED_to_COMPLETED
          - entities.AssessmentRun.fields.status
        distinguishing_aspect: "A newly created AssessmentRun is SCHEDULED with completed_at null and credits no coverage, so the component stays at coverage_pct 0.00."
        test_recipe:
          setup: ["One product, one in-scope component of applicable_criteria_count 40 and one SCREEN_READER bench"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
            - call: "POST /standards"
              payload: { code: "WCAG_2_2", title: "WCAG 2.2", surface_scope: "WEB", max_target_level: "AAA" }
              as: AccessibilityLead
              captures: { std_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Insight Portal", version_label: "7.0", standard_id: "${std_id}", target_level: "AA", surface_type: "WEB" }
              as: AccessibilityLead
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/components"
              payload: { name: "Web UI", component_type: "WEB_UI", in_scope: true, assessment_scope: "FULL", applicable_criteria_count: 40, user_reach_pct: 60 }
              as: AccessibilityLead
              captures: { comp_id: $.data.id }
            - call: "POST /test-environments"
              payload: { name: "NVDA Bench 1", at_profile: "SCREEN_READER", at_product_name: "NVDA 2026.1", os_platform: "WINDOWS", reconfiguration_buffer_minutes: 30 }
              as: AccessibilityLead
              captures: { env_id: $.data.id }
          trigger:
            - call: "POST /assessment-runs"
              payload: { component_id: "${comp_id}", environment_id: "${env_id}", method: "MANUAL", at_profile: "SCREEN_READER", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T12:00:00Z", criteria_exercised: 40, disability_categories_validated: ["VISION", "COGNITIVE"] }
              as: AccessibilityTester
              captures: { run_id: $.data.id, run_status: $.data.status }
          assert:
            - "HTTP 201"
            - "${run_status} == SCHEDULED"
            - "AssessmentRun.${run_id}.completed_at is null"
            - "ProductComponent.${comp_id}.coverage_pct == 0.00"
            - "ProductComponent.${comp_id}.evidence_units_total == 0"

      - name: corner_complaint_triage_valid_transition
        claim_type: valid_transition
        grounds:
          - state_machines.Complaint.NEW_to_TRIAGED
          - entities.Complaint.fields.route
        distinguishing_aspect: "POST /complaints/{id}/triage with route ACCOMMODATION moves NEW -> TRIAGED and persists both accommodation fields, while accommodation_fulfilled_at stays null because fulfilment is a separate branch action."
        test_recipe:
          setup: ["One product with one component and one complaint in state NEW with route null"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
            - call: "POST /standards"
              payload: { code: "WCAG_2_2", title: "WCAG 2.2", surface_scope: "WEB", max_target_level: "AAA" }
              as: AccessibilityLead
              captures: { std_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Insight Portal", version_label: "7.0", standard_id: "${std_id}", target_level: "AA", surface_type: "WEB" }
              as: AccessibilityLead
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/components"
              payload: { name: "Web UI", component_type: "WEB_UI", in_scope: true, assessment_scope: "FULL", applicable_criteria_count: 40, user_reach_pct: 60 }
              as: AccessibilityLead
              captures: { comp_id: $.data.id }
            - call: "POST /complaints"
              payload: { product_id: "${prod_id}", component_id: "${comp_id}", channel: "PHONE", description: "I need the report exported in large print", disability_category: "VISION" }
              as: CustomerLiaison
              captures: { cmp_id: $.data.id, new_state: $.data.state }
          trigger:
            - call: "POST /complaints/${cmp_id}/triage"
              payload: { route: "ACCOMMODATION", requested_accommodation: "Large-print export of the conformance report", needed_by_date: "2026-09-01" }
              as: AccessibilityLead
              captures: { triaged_state: $.data.state, triaged_route: $.data.route, fulfilled: $.data.accommodation_fulfilled_at }
          assert:
            - "${new_state} == NEW"
            - "HTTP 200"
            - "${triaged_state} == TRIAGED"
            - "${triaged_route} == ACCOMMODATION"
            - "${fulfilled} is null"
            - "Complaint.${cmp_id}.requested_accommodation == Large-print export of the conformance report"
