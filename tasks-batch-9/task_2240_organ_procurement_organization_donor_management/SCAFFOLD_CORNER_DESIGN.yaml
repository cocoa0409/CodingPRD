            - call: "POST /opo/death-referrals"
              payload: { hospital_partner_id: "${hosp_id}", patient_mrn: "MRN-2201", age_years: 40, ventilated: true, gcs_score: 3, cause_of_death_category: "ANOXIA", trigger_event_at: "2026-09-03T07:30:00Z" }
              as: ReferralCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /opo/death-referrals/${ref_id}/screenings"
              payload: {}
              as: ReferralCoordinator
              captures: { scr_id: $.data.id }
          trigger:
