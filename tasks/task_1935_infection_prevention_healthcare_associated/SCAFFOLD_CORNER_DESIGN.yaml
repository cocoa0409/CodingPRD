- section: state_machines
  instances:
  - name: adjudicate_from_suspected_returns_case_not_adjudicatable
    claim_type: invalid_transition
    grounds:
    - state_machines.InfectionCase.transitions
    - errors[ERR_CASE_NOT_ADJUDICATABLE]
    distinguishing_aspect: adjudicate from SUSPECTED (skipping begin-review) is rejected; only UNDER_REVIEW adjudicates.
    test_recipe:
      setup:
      - facility + unit + patient + episode + case in SUSPECTED
      setup_api_calls:
      - call: POST /api/facilities
        payload:
          name: F1
          nhsn_org_id: ORG-1
          clabsi_baseline_per_1000: 2.0
          cauti_baseline_per_1000: 1.5
          ssi_baseline_per_procedure: 0.25
        as: PlatformAdmin
        captures:
          fac_id: $.data.id
      - call: POST /api/units
        payload:
          facility_id: ${fac_id}
          name: ICU-S1
          unit_type: ICU
          nhsn_location_code: IS1
        as: PlatformAdmin
        captures:
          unit_id: $.data.id
      - call: POST /api/patients
        payload:
          mrn: MRN-S1
          admitted_at: '2026-08-01T08:00:00Z'
          unit_id: ${unit_id}
        as: UnitNurseManager
        captures:
          pat_id: $.data.id
      - call: POST /api/device-episodes
        payload:
          patient_id: ${pat_id}
          device_type: CENTRAL_LINE
          placed_at: '2026-08-01T10:00:00Z'
        as: UnitNurseManager
        captures:
          ep_id: $.data.id
      - call: POST /api/infection-cases
        payload:
          patient_id: ${pat_id}
          case_type: CLABSI
          suspected_organism: E. coli
          first_positive_specimen_at: '2026-08-04T10:00:00Z'
          linked_device_episode_id: ${ep_id}
        as: InfectionPreventionist
        captures:
          case_id: $.data.id
      trigger:
      - call: POST /api/infection-cases/${case_id}/adjudicate
        payload:
          outcome: ADJUDICATED_HAI
          date_of_event: '2026-08-04T00:00:00Z'
          rationale: skip review attempt here
        as: InfectionPreventionist
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_CASE_NOT_ADJUDICATABLE and HTTP 409
      - InfectionCase.${case_id}.status remains SUSPECTED
  - name: reopen_from_under_review_returns_case_not_reopenable
    claim_type: invalid_transition
    grounds:
    - state_machines.InfectionCase.transitions
    - errors[ERR_CASE_NOT_REOPENABLE]
    distinguishing_aspect: reopen from UNDER_REVIEW (never adjudicated) rejected with ERR_CASE_NOT_REOPENABLE.
    test_recipe:
      setup:
      - case in UNDER_REVIEW
      setup_api_calls:
      - call: POST /api/facilities
        payload:
          name: F1
          nhsn_org_id: ORG-1
          clabsi_baseline_per_1000: 2.0
          cauti_baseline_per_1000: 1.5
          ssi_baseline_per_procedure: 0.25
        as: PlatformAdmin
        captures:
          fac_id: $.data.id
      - call: POST /api/units
        payload:
          facility_id: ${fac_id}
          name: ICU-S2
          unit_type: ICU
          nhsn_location_code: IS2
        as: PlatformAdmin
        captures:
          unit_id: $.data.id
      - call: POST /api/patients
        payload:
          mrn: MRN-S2
          admitted_at: '2026-08-01T08:00:00Z'
          unit_id: ${unit_id}
        as: UnitNurseManager
        captures:
          pat_id: $.data.id
      - call: POST /api/device-episodes
        payload:
          patient_id: ${pat_id}
          device_type: CENTRAL_LINE
          placed_at: '2026-08-01T10:00:00Z'
        as: UnitNurseManager
        captures:
          ep_id: $.data.id
      - call: POST /api/infection-cases
        payload:
          patient_id: ${pat_id}
          case_type: CLABSI
          suspected_organism: E. coli
          first_positive_specimen_at: '2026-08-04T10:00:00Z'
          linked_device_episode_id: ${ep_id}
        as: InfectionPreventionist
        captures:
          case_id: $.data.id
      - call: POST /api/infection-cases/${case_id}/begin-review
        payload: {}
        as: InfectionPreventionist
      trigger:
      - call: POST /api/infection-cases/${case_id}/reopen
        payload:
          reason: premature reopen try
        as: InfectionPreventionist
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_CASE_NOT_REOPENABLE and HTTP 409
      - status remains UNDER_REVIEW
  - name: summary_accept_from_open_returns_not_reviewable
    claim_type: invalid_transition
    grounds:
    - state_machines.MonthlySummary.transitions
    - errors[ERR_SUMMARY_NOT_REVIEWABLE]
    distinguishing_aspect: accept on an OPEN (never submitted) summary is rejected; review actions require SUBMITTED.
    test_recipe:
      setup:
      - facility + unit + summary OPEN
      setup_api_calls:
      - call: POST /api/facilities
        payload:
          name: F1
          nhsn_org_id: ORG-1
          clabsi_baseline_per_1000: 2.0
          cauti_baseline_per_1000: 1.5
          ssi_baseline_per_procedure: 0.25
        as: PlatformAdmin
        captures:
          fac_id: $.data.id
      - call: POST /api/units
        payload:
          facility_id: ${fac_id}
          name: ICU-S3
          unit_type: ICU
          nhsn_location_code: IS3
        as: PlatformAdmin
        captures:
          unit_id: $.data.id
      - call: POST /api/monthly-summaries
        payload:
          unit_id: ${unit_id}
          month: 2026-08
        as: InfectionPreventionist
        captures:
          sum_id: $.data.id
      trigger:
      - call: POST /api/monthly-summaries/${sum_id}/accept
        payload: {}
        as: InfectionControlDirector
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_SUMMARY_NOT_REVIEWABLE and HTTP 409
  - name: summary_amend_from_open_returns_not_amendable
    claim_type: invalid_transition
    grounds:
    - state_machines.MonthlySummary.transitions
    - errors[ERR_SUMMARY_NOT_AMENDABLE]
    distinguishing_aspect: amend requires ACCEPTED; on OPEN it is rejected with ERR_SUMMARY_NOT_AMENDABLE.
    test_recipe:
      setup:
      - facility + unit + summary OPEN
      setup_api_calls:
      - call: POST /api/facilities
        payload:
          name: F1
          nhsn_org_id: ORG-1
          clabsi_baseline_per_1000: 2.0
          cauti_baseline_per_1000: 1.5
          ssi_baseline_per_procedure: 0.25
        as: PlatformAdmin
        captures:
          fac_id: $.data.id
      - call: POST /api/units
        payload:
          facility_id: ${fac_id}
          name: ICU-S4
          unit_type: ICU
          nhsn_location_code: IS4
        as: PlatformAdmin
        captures:
          unit_id: $.data.id
      - call: POST /api/monthly-summaries
        payload:
          unit_id: ${unit_id}
          month: 2026-08
        as: InfectionPreventionist
        captures:
          sum_id: $.data.id
      trigger:
      - call: POST /api/monthly-summaries/${sum_id}/amend
        payload:
          reason: premature amendment
        as: InfectionPreventionist
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_SUMMARY_NOT_AMENDABLE and HTTP 409
  - name: summary_full_cycle_submit_reject_resubmit_accept
    claim_type: valid_transition
    grounds:
    - state_machines.MonthlySummary.transitions
    distinguishing_aspect: 'Branching with revert: OPEN->SUBMITTED->REJECTED->SUBMITTED->ACCEPTED, with denominator rows LOCKED on each submit and returned to DRAFT on reject.'
    test_recipe:
      setup:
      - facility + unit + one DeviceDayCount row + summary OPEN
      setup_api_calls:
      - call: POST /api/facilities
        payload:
          name: F1
          nhsn_org_id: ORG-1
          clabsi_baseline_per_1000: 2.0
          cauti_baseline_per_1000: 1.5
          ssi_baseline_per_procedure: 0.25
        as: PlatformAdmin
        captures:
          fac_id: $.data.id
      - call: POST /api/units
        payload:
          facility_id: ${fac_id}
          name: ICU-S5
          unit_type: ICU
          nhsn_location_code: IS5
        as: PlatformAdmin
        captures:
          unit_id: $.data.id
      - call: POST /api/device-day-counts
        payload:
          unit_id: ${unit_id}
          count_date: '2026-08-01T00:00:00Z'
          central_line_days: 20
          urinary_catheter_days: 10
          ventilator_days: 5
          patient_days: 40
        as: UnitNurseManager
        captures:
          dd_id: $.data.id
      - call: POST /api/monthly-summaries
        payload:
          unit_id: ${unit_id}
          month: 2026-08
        as: InfectionPreventionist
        captures:
          sum_id: $.data.id
      trigger:
      - call: POST /api/monthly-summaries/${sum_id}/submit
        payload: {}
