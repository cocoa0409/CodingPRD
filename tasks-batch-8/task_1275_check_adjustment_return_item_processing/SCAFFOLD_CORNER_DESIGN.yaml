      - name: represent_not_eligible_reason_rejected
        claim_type: violation_to_error
        grounds: [calculations.re_presentment_eligibility, "errors[ERR_RE_PRESENTMENT_NOT_ELIGIBLE]"]
        distinguishing_aspect: "STOP_PAYMENT is in the ineligible reason set: re-presenting after a coded STOP_PAYMENT return fails with ERR_RE_PRESENTMENT_NOT_ELIGIBLE even though presentment_count < 2."
        test_recipe:
          setup: ["item presented, returned, coded STOP_PAYMENT"]
          setup_api_calls:
            - call: "POST /bank/clearing-banks"
              payload: { name: "CB SP", routing_number: "222000034" }
              as: OperationsAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /bank/accounts"
              payload: { customer_name: "Ugo", account_number: "A-2026", opening_balance_cents: 100000 }
              as: OperationsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /bank/check-items"
              payload: { depositor_account_id: "${acct_id}", clearing_bank_id: "${cb_id}", item_reference: "ITM-SP", amount_cents: 5000, encoded_amount_cents: 5000, image_quality_score: 90, capture_channel: "ATM" }
              as: ItemProcessor
              captures: { item_id: $.data.id }
            - call: "POST /bank/check-items/${item_id}/present"
              as: ItemProcessor
            - call: "POST /bank/check-items/${item_id}/return-events"
              as: ItemProcessor
              captures: { re1: $.data.id }
            - call: "POST /bank/return-events/${re1}/code"
