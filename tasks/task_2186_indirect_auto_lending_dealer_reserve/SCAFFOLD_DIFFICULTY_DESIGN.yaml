          Conserved quantity 1 is money in the reserve ledger, pinned as
          Dealer.reserve_balance_cents == sum(ReserveEntry.amount_cents). Funding posts
          +154055 and +7003 on top of an opening 50000; an EARLY_PAYOFF at
