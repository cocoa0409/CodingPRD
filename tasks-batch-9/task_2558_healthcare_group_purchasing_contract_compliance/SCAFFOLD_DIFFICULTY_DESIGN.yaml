# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 2558 — Healthcare Group Purchasing & Contract Compliance
#
# Nine rule_id blocks, 22 instances. Every grounds ref resolves into SCAFFOLD.yaml
# §1.1–§1.7; every setup_api_calls chain drives empty-DB → the described precondition
# using only endpoints declared in §1.5; every numeric assert below was produced by
# executing the named §1.3 formula in Decimal/ROUND_HALF_UP.
#
# Shared fixture vocabulary used across instances (all values literal):
#   contract ladder  TIER_0 (0 bps, 0 units, 0.00 pct) / TIER_1 (800 bps, 2000 units,
#                    80.00 pct) / TIER_2 (1500 bps, 5000 units, 90.00 pct)
#   holdback ladder  {0 -> 0 bps, 100000 -> 250 bps}
#   item             base_price_cents 10000, floor_price_cents 8200
#   logical clock    starts at its mandatory default 2026-08-01T00:00:00Z

scaffold_difficulty_design:

  # ═══════════════════════════════════════════════════════════════════════════
  - rule_id: dual_variant_calc
    instances:
      - name: compliance_preliminary_versus_final_same_period
        grounds:
          - calculations.compliance_measurement
          - calculations.tier_requalification
          - state_machines.ComplianceMeasurement.DRAFT_to_PRELIMINARY
          - state_machines.ComplianceMeasurement.PRELIMINARY_to_FINAL
          - entities.ComplianceMeasurement.fields.preliminary_compliance_pct
          - entities.ComplianceMeasurement.fields.computed_variant
        distinguishing_aspect: |
          This dual variant lives on spend compliance for a Commitment: the PRELIMINARY
          variant admits PARTIALLY_LOADED files and drops UNMATCHED spend from the
          denominator, the FINAL variant drops PARTIALLY_LOADED files whole and counts
          UNMATCHED spend, so the identical stored purchase rows yield 75.10 pct and
          94.06 pct on the same measurement row and even move leakage_spend_cents from
          15750000 to 0.
        test_recipe:
          setup:
            - "ACTIVE contract with the shared three-tier ladder; one catalog item at base 10000 / floor 8200, requires_evidence false."
            - "Member M-1 with item_master entry MI-1; commitment at TIER_0 with a COUNTERSIGNED letter of participation, so election_status is ACTIVE."
            - "APPROVED cross-reference MI-1 -> the catalog item at conversion_factor 1.0, and an ACTIVE TIER_PRICE activation whose computed_price_cents is 10000."
            - "Distributor file D-A over [2026-08-01, 2026-09-01) fully accepted and LOADED: one ON_CONTRACT line 5000 units @ 9500 (47500000) and one UNMATCHED line MI-9 500 units @ 6000 (3000000)."
            - "Distributor file D-B over the same period PARTIALLY_LOADED: one OFF_CONTRACT_LEAKAGE line 1500 units @ 10500 (15750000) plus one zero-quantity line rejected as ZERO_QUANTITY."
            - "Commitment moved to REQUAL_REVIEW, a measurement opened for [2026-08-01, 2026-09-01) and already measured to PRELIMINARY."
          setup_api_calls:
            - call: "POST /gpo/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ContractManager
            - call: "POST /gpo/contracts"
              payload: { contract_code: "C-SUT-1", supplier_name: "Acme Surgical", category_code: "CAT-SUT", effective_from: "2026-01-01", effective_to: "2026-12-31", admin_fee_bps: 300, member_share_bps: 6000, requires_clinical_review: false, share_basis: "COLLECTED", leakage_alert_threshold_pct: 15.00, tiers: [ { tier_code: "TIER_0", min_committed_volume_units: 0, min_compliance_pct: 0.00, discount_bps: 0 }, { tier_code: "TIER_1", min_committed_volume_units: 2000, min_compliance_pct: 80.00, discount_bps: 800 }, { tier_code: "TIER_2", min_committed_volume_units: 5000, min_compliance_pct: 90.00, discount_bps: 1500 } ], holdback_tiers: [ { min_gross_pool_cents: 0, holdback_bps: 0 }, { min_gross_pool_cents: 100000, holdback_bps: 250 } ] }
              as: ContractManager
              captures: { c1: $.data.id }
            - call: "POST /gpo/contracts/${c1}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/contracts/${c1}/items"
              payload: { vendor_item_number: "V-1", item_description: "Suture 3-0 absorbable", uom: "EA", units_per_uom: 1, base_price_cents: 10000, floor_price_cents: 8200, requires_evidence: false }
              as: ContractManager
              captures: { i1: $.data.id }
            - call: "POST /gpo/members"
              payload: { member_code: "M-1", name: "Riverbend Regional Hospital", aggregation_group_code: "AGG-NORTH", item_master: [ { member_item_number: "MI-1", description: "Suture 3-0", units_per_uom: 1 } ] }
              as: ContractManager
              captures: { m1: $.data.id }
            - call: "POST /gpo/commitments"
              payload: { member_id: "${m1}", contract_id: "${c1}", elected_tier_code: "TIER_0", committed_volume_units: 100, effective_from: "2026-08-01" }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
              captures: { k1: $.data.id }
            - call: "POST /gpo/commitments/${k1}/lop/issue"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/commitments/${k1}/lop/sign"
              payload: { signer_name: "R. Vasquez" }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
            - call: "POST /gpo/commitments/${k1}/lop/countersign"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/item-cross-references"
              payload: { member_id: "${m1}", contract_item_id: "${i1}", member_item_number: "MI-1", match_type: "EXACT", conversion_factor: 1.0 }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
              captures: { x1: $.data.id }
            - call: "POST /gpo/item-cross-references/${x1}/approve"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/price-activations"
              payload: { commitment_id: "${k1}", contract_item_id: "${i1}", activation_type: "TIER_PRICE", effective_from: "2026-08-01", effective_to: "2026-12-31" }
              as: ContractManager
              captures: { a1: $.data.id }
            - call: "POST /gpo/price-activations/${a1}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/distributor-files"
              payload: { member_id: "${m1}", contract_id: "${c1}", distributor_code: "D-A", period_start: "2026-08-01", period_end: "2026-09-01", lines: [ { member_item_number: "MI-1", quantity_units: 5000, unit_price_paid_cents: 9500, purchase_date: "2026-08-05" }, { member_item_number: "MI-9", quantity_units: 500, unit_price_paid_cents: 6000, purchase_date: "2026-08-06" } ] }
              as: DistributorAgent
              captures: { f1: $.data.id }
            - call: "POST /gpo/distributor-files/${f1}/validate"
              payload: {}
              as: DistributorAgent
            - call: "POST /gpo/distributor-files/${f1}/load"
              payload: {}
              as: ComplianceAnalyst
            - call: "POST /gpo/distributor-files"
              payload: { member_id: "${m1}", contract_id: "${c1}", distributor_code: "D-B", period_start: "2026-08-01", period_end: "2026-09-01", lines: [ { member_item_number: "MI-1", quantity_units: 1500, unit_price_paid_cents: 10500, purchase_date: "2026-08-07" }, { member_item_number: "MI-1", quantity_units: 0, unit_price_paid_cents: 9500, purchase_date: "2026-08-08" } ] }
              as: DistributorAgent
              captures: { f2: $.data.id }
            - call: "POST /gpo/distributor-files/${f2}/validate"
              payload: {}
              as: DistributorAgent
            - call: "POST /gpo/distributor-files/${f2}/load"
              payload: {}
              as: ComplianceAnalyst
            - call: "POST /gpo/commitments/${k1}/open-requalification"
              payload: { reason: "annual tier review" }
              as: ComplianceAnalyst
            - call: "GET /gpo/commitments/${k1}"
              as: ComplianceAnalyst
              captures: { k1v: $.data.version }
            - call: "POST /gpo/compliance-measurements"
              payload: { commitment_id: "${k1}", period_start: "2026-08-01", period_end: "2026-09-01", expected_commitment_version: "${k1v}" }
              as: ComplianceAnalyst
              captures: { meas: $.data.id }
            - call: "POST /gpo/compliance-measurements/${meas}/measure"
              payload: {}
              as: ComplianceAnalyst
              captures: { prelim_pct: $.data.compliance_pct, prelim_leak: $.data.leakage_spend_cents, prelim_tier: $.data.qualified_tier_code }
          trigger:
            - call: "POST /gpo/compliance-measurements/${meas}/finalize"
              payload: {}
              as: ComplianceAnalyst
          assert:
            - "${prelim_pct} == 75.10"
            - "${prelim_leak} == 15750000"
            - "${prelim_tier} == TIER_0"
            - "ComplianceMeasurement.${meas}.computed_variant == FINAL"
            - "ComplianceMeasurement.${meas}.preliminary_compliance_pct == 75.10"
            - "ComplianceMeasurement.${meas}.compliance_pct == 94.06"
            - "ComplianceMeasurement.${meas}.on_contract_spend_cents == 47500000"
            - "ComplianceMeasurement.${meas}.leakage_spend_cents == 0"
            - "ComplianceMeasurement.${meas}.unmatched_spend_cents == 3000000"
            - "ComplianceMeasurement.${meas}.total_category_spend_cents == 50500000"
            - "ComplianceMeasurement.${meas}.measured_volume_units == 5000"
            - "ComplianceMeasurement.${meas}.qualified_tier_code == TIER_2"
            - "ComplianceMeasurement.${meas}.basis_empty == false"

      - name: admin_fee_pool_accrual_basis_versus_collected_basis
        grounds:
          - calculations.distribution_holdback
          - calculations.admin_fee_accrual
          - entities.Contract.fields.share_basis
          - entities.AdminFeeDistribution.fields.basis
          - state_machines.AdminFeeDistribution.ACCRUED_to_DISTRIBUTED
          - state_machines.AdminFeeDistribution.COLLECTED_to_DISTRIBUTED
        distinguishing_aspect: |
          This dual variant lives on administrative fee cash for a Contract, not on
          member compliance: with byte-identical purchase data (one line of 500 units at
          9500) the ACCRUAL basis distributes off gross 142500 and lands the holdback on
          the 250-bps rung for 3563, giving member_pool_cents 83362, while the COLLECTED
          basis distributes off gross 100200 for holdback 2505 and member_pool_cents
          58617 — a 24745-cent divergence driven by Contract.share_basis alone.
        test_recipe:
          setup:
            - "Two ACTIVE contracts identical except for share_basis: C-ACC on ACCRUAL and C-COL on COLLECTED; both admin_fee_bps 300, member_share_bps 6000, holdback ladder {0 -> 0 bps, 100000 -> 250 bps}."
            - "One catalog item per contract at base 10000 / floor 8200."
            - "Member M-1 with item_master MI-1 and MI-2; one ACTIVE COUNTERSIGNED commitment per contract at TIER_0; MI-1 cross-referenced to C-ACC's item and MI-2 to C-COL's item, both APPROVED; an ACTIVE TIER_PRICE activation per contract at computed_price_cents 10000."
            - "One LOADED distributor file per contract over [2026-08-01, 2026-09-01) carrying exactly one ON_CONTRACT line of 500 units at 9500 (extended 4750000)."
            - "One ACCRUED distribution per contract for [2026-08-01, 2026-09-01), each with accrued_fee_cents 142500; C-COL's distribution has already recorded a remittance of 100200 and is COLLECTED."
          setup_api_calls:
            - call: "POST /gpo/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FinanceAdministrator
            - call: "POST /gpo/contracts"
              payload: { contract_code: "C-ACC", supplier_name: "Acme Surgical", category_code: "CAT-SUT", effective_from: "2026-01-01", effective_to: "2026-12-31", admin_fee_bps: 300, member_share_bps: 6000, requires_clinical_review: false, share_basis: "ACCRUAL", leakage_alert_threshold_pct: 15.00, tiers: [ { tier_code: "TIER_0", min_committed_volume_units: 0, min_compliance_pct: 0.00, discount_bps: 0 }, { tier_code: "TIER_1", min_committed_volume_units: 2000, min_compliance_pct: 80.00, discount_bps: 800 }, { tier_code: "TIER_2", min_committed_volume_units: 5000, min_compliance_pct: 90.00, discount_bps: 1500 } ], holdback_tiers: [ { min_gross_pool_cents: 0, holdback_bps: 0 }, { min_gross_pool_cents: 100000, holdback_bps: 250 } ] }
              as: ContractManager
              captures: { cacc: $.data.id }
            - call: "POST /gpo/contracts/${cacc}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/contracts/${cacc}/items"
              payload: { vendor_item_number: "V-A", item_description: "Suture 3-0 absorbable", uom: "EA", units_per_uom: 1, base_price_cents: 10000, floor_price_cents: 8200, requires_evidence: false }
              as: ContractManager
              captures: { iacc: $.data.id }
            - call: "POST /gpo/contracts"
              payload: { contract_code: "C-COL", supplier_name: "Acme Surgical", category_code: "CAT-SUT", effective_from: "2026-01-01", effective_to: "2026-12-31", admin_fee_bps: 300, member_share_bps: 6000, requires_clinical_review: false, share_basis: "COLLECTED", leakage_alert_threshold_pct: 15.00, tiers: [ { tier_code: "TIER_0", min_committed_volume_units: 0, min_compliance_pct: 0.00, discount_bps: 0 }, { tier_code: "TIER_1", min_committed_volume_units: 2000, min_compliance_pct: 80.00, discount_bps: 800 }, { tier_code: "TIER_2", min_committed_volume_units: 5000, min_compliance_pct: 90.00, discount_bps: 1500 } ], holdback_tiers: [ { min_gross_pool_cents: 0, holdback_bps: 0 }, { min_gross_pool_cents: 100000, holdback_bps: 250 } ] }
              as: ContractManager
              captures: { ccol: $.data.id }
            - call: "POST /gpo/contracts/${ccol}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/contracts/${ccol}/items"
              payload: { vendor_item_number: "V-C", item_description: "Suture 3-0 absorbable", uom: "EA", units_per_uom: 1, base_price_cents: 10000, floor_price_cents: 8200, requires_evidence: false }
              as: ContractManager
              captures: { icol: $.data.id }
            - call: "POST /gpo/members"
              payload: { member_code: "M-1", name: "Riverbend Regional Hospital", aggregation_group_code: "AGG-NORTH", item_master: [ { member_item_number: "MI-1", description: "Suture 3-0", units_per_uom: 1 }, { member_item_number: "MI-2", description: "Suture 3-0 alt", units_per_uom: 1 } ] }
              as: ContractManager
              captures: { m1: $.data.id }
            - call: "POST /gpo/commitments"
              payload: { member_id: "${m1}", contract_id: "${cacc}", elected_tier_code: "TIER_0", committed_volume_units: 100, effective_from: "2026-08-01" }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
              captures: { kacc: $.data.id }
            - call: "POST /gpo/commitments/${kacc}/lop/issue"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/commitments/${kacc}/lop/sign"
              payload: { signer_name: "R. Vasquez" }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
            - call: "POST /gpo/commitments/${kacc}/lop/countersign"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/commitments"
              payload: { member_id: "${m1}", contract_id: "${ccol}", elected_tier_code: "TIER_0", committed_volume_units: 100, effective_from: "2026-08-01" }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
              captures: { kcol: $.data.id }
            - call: "POST /gpo/commitments/${kcol}/lop/issue"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/commitments/${kcol}/lop/sign"
              payload: { signer_name: "R. Vasquez" }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
            - call: "POST /gpo/commitments/${kcol}/lop/countersign"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/item-cross-references"
              payload: { member_id: "${m1}", contract_item_id: "${iacc}", member_item_number: "MI-1", match_type: "EXACT", conversion_factor: 1.0 }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
              captures: { xacc: $.data.id }
            - call: "POST /gpo/item-cross-references/${xacc}/approve"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/item-cross-references"
              payload: { member_id: "${m1}", contract_item_id: "${icol}", member_item_number: "MI-2", match_type: "EXACT", conversion_factor: 1.0 }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
              captures: { xcol: $.data.id }
            - call: "POST /gpo/item-cross-references/${xcol}/approve"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/price-activations"
              payload: { commitment_id: "${kacc}", contract_item_id: "${iacc}", activation_type: "TIER_PRICE", effective_from: "2026-08-01", effective_to: "2026-12-31" }
              as: ContractManager
              captures: { aacc: $.data.id }
            - call: "POST /gpo/price-activations/${aacc}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/price-activations"
              payload: { commitment_id: "${kcol}", contract_item_id: "${icol}", activation_type: "TIER_PRICE", effective_from: "2026-08-01", effective_to: "2026-12-31" }
              as: ContractManager
              captures: { acol: $.data.id }
            - call: "POST /gpo/price-activations/${acol}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/distributor-files"
