scenario: |
  Exhibition and convention venue management system: venue space partitioning with hall and zone and
  aisle hierarchy, fixed-and-modular booth grid, load-and-utility (power/water/network) capacity per
  cell, fire-safety constraint zones, and floor-plan version control; booth solicitation and
  allocation with exhibitor application intake, qualification review per exhibition theme, booth-tier
  pricing and corner-booth premium, allocation rules (priority by sponsorship/seniority/lottery),
  allocation-publication with objection window, and booth-relocation handling; setup and teardown
  scheduling with move-in and move-out time windows per exhibitor, vehicle-arrival slot booking at
  the dock, crane-and-forklift resource scheduling, safety-inspection gating before opening, and
  overnight-work permit handling; exhibitor service work orders with service-catalog (extra power /
  furniture rental / network / cleaning / security), exhibitor self-service ordering, work-order
  dispatch to service providers, on-site execution confirmation, billing aggregation, and dispute
  handling; ticket sales with ticket types (visitor/professional-buyer/student/VIP) and pricing,
  online-presale and on-site sale channels, QR-code ticket issuance, on-site entry scanning,
  capacity-and-occupancy real-time monitoring, and group-ticket handling for organized delegations;
  sponsor entitlement fulfillment with sponsor-tier entitlement catalog
  (signage/program-ad/lounge/speaking-slot/branded-gift), entitlement-execution checklist with
  deadlines, photo-and-document fulfillment evidence, exception-and-make-good handling, and
  post-event entitlement-fulfillment report; event-driven synchronization with payment, IM,
  access-control gate, and exhibitor CRM systems; audit logging for allocation decisions and
  entitlement records.

domain_name: "exhibition-venue"
api_prefix: "/exhibitions"

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Temporal windowing"
  complexity_layers:
    - "Cascading side effects"
    - "Dual-variant calculation"
    - "Rate / threshold triggers"
    - "Posture-driven gating"
  entity_topology: "hybrid"
  state_machine_shape: "posture_driven"
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: "peer_roles"
  consistency_model: "immediate"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Exhibition
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Exhibition title"
      - name: theme_code
        type: string
        source: input
        description: "Theme tag used to gate exhibitor applications"
      - name: open_date
        type: datetime
        source: input
        description: "Show open timestamp; gate for ticket scanning"
      - name: close_date
        type: datetime
        source: input
        description: "Show close timestamp"
      - name: capacity_max
        type: integer
        source: input
        description: "Maximum simultaneous on-site occupants"
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state of the exhibition"
        constraints: "{DRAFT, INTAKE_OPEN, ALLOCATION_PUBLISHED, SETUP, OPEN, TEARDOWN, CLOSED}"
        default: "DRAFT"
      - name: posture
        type: enum
        source: computed
        description: "Derived gating posture; OPEN allows entry; RESTRICTED blocks non-staff entry; FROZEN blocks all gate ops and new ticket sales"
        constraints: "{OPEN, RESTRICTED, FROZEN}"
        default: "FROZEN"
      - name: live_occupancy
        type: integer
        source: computed
        description: "Current on-site occupancy (scanned-in minus scanned-out); recomputed on each gate event"
        default: 0
      - name: objection_window_hours
        type: integer
        source: input
        description: "Hours from publication during which exhibitors may file an objection"
        default: 72
      - name: allocation_published_at
        type: datetime
        source: system
        description: "Server clock at moment ALLOCATION_PUBLISHED was entered; null otherwise"

  - name: Hall
    parent: Exhibition
    common_fields: true
    fields:
      - name: exhibition_id
        type: string
        source: input
        description: "Owning exhibition"
      - name: hall_code
        type: string
        source: input
        description: "Short code e.g. A, B, C; unique per exhibition"
      - name: zone_label
        type: string
        source: input
        description: "Zone the hall belongs to within the exhibition layout"
      - name: aisle_label
        type: string
        source: input
        description: "Aisle label inside the zone"
      - name: grid_rows
        type: integer
        source: input
        description: "Number of grid rows in this hall"
      - name: grid_cols
        type: integer
        source: input
        description: "Number of grid cols in this hall"
      - name: fire_safety_zone_cells
        type: array
        source: input
        description: "Array of {row,col} cells reserved as fire-safety constraint (no booth allowed)"
      - name: floor_plan_active_version
        type: integer
        source: computed
        description: "Version number of the currently-active floor plan"
        default: 1

  - name: FloorPlanVersion
    parent: Hall
    common_fields: false
    fields:
      - name: hall_id
        type: string
        source: input
        description: "Owning hall"
      - name: version_number
        type: integer
        source: system
        description: "Monotonically increasing per hall, starts at 1"
      - name: status
        type: enum
        source: computed
        description: "Lifecycle of this plan version"
        constraints: "{DRAFT, ACTIVE, SUPERSEDED}"
        default: "DRAFT"
      - name: published_at
        type: datetime
        source: system
        description: "Timestamp the version became ACTIVE; null while DRAFT"
      - name: cells
        type: array
        source: input
        description: "Array of {row,col,kind,power_kw,water_lpm,network_mbps} entries describing each grid cell. kind in {FIXED, MODULAR, FIRE_SAFETY}"

  - name: Booth
    parent: Hall
    common_fields: true
    fields:
      - name: hall_id
        type: string
        source: input
        description: "Hall containing this booth"
      - name: floor_plan_version_id
        type: string
        source: input
        description: "Floor plan version this booth belongs to (must be ACTIVE at creation time)"
      - name: code
        type: string
        source: input
        description: "Booth code unique within hall (e.g. A-12)"
      - name: cells
        type: array
        source: input
        description: "Array of {row,col} occupied; minimum 1 cell, must all exist in plan and be kind in {FIXED,MODULAR}"
      - name: tier
        type: enum
        source: input
        description: "Booth pricing tier"
        constraints: "{STANDARD, PREMIUM, ISLAND}"
      - name: is_corner
        type: boolean
        source: computed
        description: "True when the booth's cell rectangle touches at least two perpendicular aisle edges; recomputed at create time"
        default: false
      - name: base_price_cents
        type: integer
        source: computed
        description: "Quoted price for this booth before exhibitor-side discounts; see calculation booth_quoted_price"
      - name: power_kw_capacity
        type: number
        source: computed
        description: "Sum of power_kw across the booth's cells"
      - name: water_lpm_capacity
        type: number
        source: computed
        description: "Sum of water_lpm across the booth's cells"
      - name: network_mbps_capacity
        type: integer
        source: computed
        description: "Sum of network_mbps across the booth's cells"
      - name: status
        type: enum
        source: computed
        description: "Booth lifecycle"
        constraints: "{AVAILABLE, RESERVED, ALLOCATED, RELOCATING, BLOCKED}"
        default: "AVAILABLE"

  - name: ExhibitorApplication
    parent: null
    common_fields: true
    fields:
      - name: exhibition_id
        type: string
        source: input
        description: "Target exhibition"
      - name: exhibitor_id
        type: string
        source: input
        description: "Exhibitor (foreign key, role identity); equals X-User-ID when role is Exhibitor"
      - name: theme_tags
        type: array
        source: input
        description: "Exhibitor-declared theme tags; qualification requires intersect with Exhibition.theme_code"
      - name: requested_tier
        type: enum
        source: input
        description: "Preferred booth tier"
        constraints: "{STANDARD, PREMIUM, ISLAND}"
      - name: sponsorship_level
        type: enum
        source: input
        description: "Exhibitor's sponsor tier for this exhibition"
        constraints: "{NONE, BRONZE, SILVER, GOLD, PLATINUM}"
        default: "NONE"
      - name: seniority_years
        type: integer
        source: input
        description: "Years exhibitor has continuously participated; used as a tiebreak"
        default: 0
      - name: lottery_token
        type: integer
        source: system
        description: "Random integer in [0, 999999] assigned at submission; final tiebreak"
      - name: priority_score
        type: number
        source: computed
        description: "Derived priority score per calculation application_priority_score"
      - name: status
        type: enum
        source: computed
        description: "Application lifecycle"
        constraints: "{DRAFT, SUBMITTED, UNDER_REVIEW, QUALIFIED, REJECTED, ALLOCATED, WITHDRAWN}"
        default: "DRAFT"
      - name: rejection_reason
        type: string
        source: input
        description: "Reason recorded when REJECTED; null otherwise"

  - name: BoothAllocation
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "Source application"
      - name: booth_id
        type: string
        source: input
        description: "Allocated booth"
      - name: exhibition_id
        type: string
        source: input
        description: "Denormalized from application; used for posture gating"
      - name: exhibitor_id
        type: string
        source: input
        description: "Owning exhibitor"
      - name: quoted_price_cents
        type: integer
        source: computed
        description: "Pinned at PUBLISHED; copied from Booth.base_price_cents at publication time"
      - name: status
        type: enum
        source: computed
        description: "Allocation lifecycle"
        constraints: "{PROPOSED, PUBLISHED, OBJECTED, RELOCATING, CONFIRMED, REVOKED}"
        default: "PROPOSED"
      - name: published_at
        type: datetime
        source: system
        description: "Timestamp PUBLISHED was entered; null otherwise; objection_deadline = published_at + Exhibition.objection_window_hours"
      - name: relocation_source_booth_id
        type: string
        source: system
        description: "Previous booth_id when this allocation was relocated; null when never relocated"

  - name: DockSlot
    parent: Exhibition
    common_fields: true
    fields:
      - name: exhibition_id
        type: string
        source: input
        description: "Owning exhibition"
      - name: dock_code
        type: string
        source: input
        description: "Physical dock identifier (e.g. D1, D2)"
      - name: window_kind
        type: enum
        source: input
        description: "Move-in or move-out window"
        constraints: "{MOVE_IN, MOVE_OUT}"
      - name: start_at
        type: datetime
        source: input
        description: "Slot start (inclusive)"
      - name: end_at
        type: datetime
        source: input
        description: "Slot end (exclusive)"
      - name: allocation_id
        type: string
        source: input
        description: "BoothAllocation booking this slot; null when slot is OPEN"
      - name: crane_required
        type: boolean
        source: input
        description: "True when the exhibitor requested a crane for this slot"
        default: false
      - name: forklift_required
        type: boolean
        source: input
        description: "True when the exhibitor requested a forklift for this slot"
        default: false
      - name: overnight_permit
        type: boolean
        source: input
        description: "True when work continues past 22:00 local; permit row recorded"
        default: false
      - name: status
        type: enum
        source: computed
        description: "Slot lifecycle"
        constraints: "{OPEN, BOOKED, COMPLETED, CANCELLED}"
        default: "OPEN"
      - name: safety_inspection_passed
        type: boolean
        source: computed
        description: "Mirrors the most recent SafetyInspection.result == PASS for this slot; required true before any subsequent slot of the same allocation can be COMPLETED for MOVE_IN windows"
        default: false

  - name: SafetyInspection
    parent: null
    common_fields: false
    fields:
      - name: exhibition_id
        type: string
        source: input
        description: "Exhibition under inspection"
      - name: dock_slot_id
        type: string
        source: input
        description: "Move-in dock slot the inspection clears; null if exhibition-wide pre-open inspection"
      - name: kind
        type: enum
        source: input
        description: "Inspection scope"
        constraints: "{BOOTH_MOVE_IN, PRE_OPEN, OVERNIGHT}"
      - name: result
        type: enum
        source: input
        description: "Outcome"
        constraints: "{PASS, FAIL}"
      - name: inspector_id
        type: string
        source: input
        description: "Inspector role user id"
      - name: notes
        type: string
        source: input
        description: "Free text"

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - name: exhibition_id
        type: string
        source: input
        description: "Owning exhibition"
      - name: allocation_id
        type: string
        source: input
        description: "Booth allocation receiving the service"
      - name: exhibitor_id
        type: string
        source: input
        description: "Ordering exhibitor; must equal allocation.exhibitor_id"
      - name: lines
        type: array
        source: input
        description: "Array of {service_code, quantity, unit_price_cents} where service_code in {EXTRA_POWER, FURNITURE, NETWORK, CLEANING, SECURITY}"
      - name: subtotal_cents
        type: integer
        source: computed
        description: "See calculation work_order_billing; pinned at SUBMITTED"
      - name: tax_cents
        type: integer
        source: computed
        description: "See calculation work_order_billing; pinned at SUBMITTED"
      - name: total_cents
        type: integer
        source: computed
        description: "subtotal_cents + tax_cents; pinned at SUBMITTED"
      - name: status
        type: enum
        source: computed
        description: "Work order lifecycle"
        constraints: "{DRAFT, SUBMITTED, DISPATCHED, EXECUTED, BILLED, DISPUTED, RESOLVED, CANCELLED}"
        default: "DRAFT"
      - name: dispute_reason
        type: string
        source: input
        description: "Recorded when DISPUTED; null otherwise"
      - name: resolved_total_cents
        type: integer
        source: computed
        description: "Final billable amount after dispute resolution; equals total_cents if never disputed; may be lowered on dispute concession"

  - name: Ticket
    parent: Exhibition
    common_fields: true
    fields:
      - name: exhibition_id
        type: string
        source: input
        description: "Owning exhibition"
      - name: kind
        type: enum
        source: input
        description: "Ticket type"
        constraints: "{VISITOR, PROFESSIONAL_BUYER, STUDENT, VIP}"
      - name: channel
        type: enum
        source: input
        description: "Sale channel"
        constraints: "{ONLINE_PRESALE, ONSITE}"
      - name: price_cents
        type: integer
        source: computed
        description: "Pinned at ISSUED; see calculation ticket_price"
      - name: qr_code
        type: string
        source: system
        description: "Server-minted random QR token; unique"
      - name: group_id
        type: string
        source: input
        description: "Group identifier when issued as part of a group; null otherwise"
      - name: status
        type: enum
        source: computed
        description: "Ticket lifecycle"
        constraints: "{ISSUED, SCANNED_IN, SCANNED_OUT, VOID, REFUNDED}"
        default: "ISSUED"
      - name: scanned_in_at
        type: datetime
        source: system
        description: "When ticket was first scanned at the gate; null until SCANNED_IN"
      - name: scanned_out_at
        type: datetime
        source: system
        description: "Last scan-out time; null until SCANNED_OUT"

  - name: SponsorEntitlement
    parent: null
    common_fields: true
    fields:
      - name: exhibition_id
        type: string
        source: input
        description: "Owning exhibition"
      - name: exhibitor_id
        type: string
        source: input
        description: "Sponsor exhibitor"
      - name: entitlement_code
        type: enum
        source: input
        description: "Entitlement type"
        constraints: "{SIGNAGE, PROGRAM_AD, LOUNGE, SPEAKING_SLOT, BRANDED_GIFT}"
      - name: sponsor_tier
        type: enum
        source: input
        description: "Sponsor tier granting this entitlement"
        constraints: "{BRONZE, SILVER, GOLD, PLATINUM}"
      - name: deadline
        type: datetime
        source: input
        description: "Hard deadline for fulfillment evidence"
      - name: evidence_url
        type: string
        source: input
        description: "Photo or document URL submitted as fulfillment evidence; null until FULFILLED"
      - name: status
        type: enum
        source: computed
        description: "Entitlement lifecycle"
        constraints: "{PLANNED, IN_PROGRESS, FULFILLED, MISSED, MAKE_GOOD_OFFERED, MAKE_GOOD_ACCEPTED, WAIVED}"
        default: "PLANNED"
      - name: make_good_credit_cents
        type: integer
        source: computed
        description: "Credit offered when entitlement misses deadline; see calculation entitlement_make_good"
        default: 0
      - name: fulfillment_score
        type: number
        source: computed
        description: "Provisional vs final score; see calculation entitlement_fulfillment_score"
        default: 0

  - name: AuditLogEntry
    parent: null
    common_fields: false
    fields:
      - name: subject_kind
        type: enum
        source: input
        description: "Audit subject"
        constraints: "{ALLOCATION, ENTITLEMENT}"
      - name: subject_id
        type: string
        source: input
        description: "Allocation id or entitlement id"
      - name: action
        type: string
        source: input
        description: "Action name (e.g. PUBLISH, OBJECT, RELOCATE, FULFILL, MAKE_GOOD)"
      - name: actor_role
        type: string
        source: input
        description: "Role that performed the action"
      - name: actor_id
        type: string
        source: input
        description: "User id of the actor"
      - name: payload
        type: object
        source: input
        description: "Action-specific JSON snapshot"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Exhibition
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: INTAKE_OPEN
        trigger: "POST /exhibitions/{id}/open-intake"
        actor: VenueAdmin
        preconditions:
          - "Exhibition has at least one Hall with an ACTIVE FloorPlanVersion"
          - "Exhibition.theme_code is non-empty"
        side_effects:
          - "Exhibition.posture := FROZEN (entry blocked; staff-only)"
      - from: INTAKE_OPEN
        to: ALLOCATION_PUBLISHED
        trigger: "POST /exhibitions/{id}/publish-allocation"
        actor: VenueAdmin
        preconditions:
          - "All applications in {QUALIFIED, REJECTED, WITHDRAWN}"
          - "At least one BoothAllocation in PROPOSED on this exhibition"
        side_effects:
          - "Each BoothAllocation in PROPOSED transitions to PUBLISHED (cascade depth 1)"
          - "Each PUBLISHED allocation emits an AuditLogEntry(subject_kind=ALLOCATION, action=PUBLISH)"
          - "Exhibition.allocation_published_at := now()"
      - from: ALLOCATION_PUBLISHED
        to: SETUP
        trigger: "POST /exhibitions/{id}/start-setup"
        actor: VenueAdmin
        preconditions:
          - "All BoothAllocation rows for this exhibition are CONFIRMED or REVOKED"
          - "now() >= Exhibition.allocation_published_at + objection_window_hours hours"
        side_effects:
          - "Exhibition.posture := RESTRICTED (gate scanning blocked; staff only)"
      - from: SETUP
        to: OPEN
        trigger: "POST /exhibitions/{id}/open-doors"
        actor: VenueAdmin
        preconditions:
          - "Exists SafetyInspection on this exhibition with kind=PRE_OPEN and result=PASS"
          - "now() >= Exhibition.open_date"
        side_effects:
          - "Exhibition.posture := OPEN (ticket scanning enabled)"
      - from: OPEN
        to: TEARDOWN
        trigger: "POST /exhibitions/{id}/close-doors"
        actor: VenueAdmin
        preconditions:
          - "now() >= Exhibition.close_date"
          - "Exhibition.live_occupancy == 0"
        side_effects:
          - "Exhibition.posture := RESTRICTED"
          - "All Ticket rows in {ISSUED, SCANNED_IN} where status==ISSUED are VOIDed (cascade depth 1)"
      - from: TEARDOWN
        to: CLOSED
        trigger: "POST /exhibitions/{id}/close"
        actor: VenueAdmin
        preconditions:
          - "All WorkOrders in terminal states {BILLED, RESOLVED, CANCELLED}"
          - "All SponsorEntitlements in terminal states {FULFILLED, MISSED, MAKE_GOOD_ACCEPTED, WAIVED}"
        side_effects:
          - "Exhibition.posture := FROZEN"
          - "Each remaining SponsorEntitlement still in {IN_PROGRESS, MAKE_GOOD_OFFERED} is auto-MISSED and recompute fulfillment_score"
        note: "Final post-event fulfillment report is read from /exhibitions/{id}/entitlement-report"

  - entity: FloorPlanVersion
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /halls/{hall_id}/floor-plans/{id}/activate"
        actor: VenueAdmin
        preconditions:
          - "Owning Exhibition.status == DRAFT (cannot activate after intake opens)"
          - "Plan cells cover the full grid_rows x grid_cols of the Hall"
          - "No two cells share the same (row,col)"
        side_effects:
          - "Any currently-ACTIVE FloorPlanVersion on the same Hall transitions to SUPERSEDED (cascade depth 1)"
          - "Hall.floor_plan_active_version := this.version_number"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "Side effect of another FloorPlanVersion activating on the same Hall"
        actor: system
        preconditions:
          - "Owning Exhibition.status == DRAFT"
        side_effects:
          - "Any Booth.floor_plan_version_id == this.id is forcibly set to BLOCKED"

  - entity: ExhibitorApplication
    initial_state: DRAFT
    terminal_states: [REJECTED, WITHDRAWN, ALLOCATED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /applications/{id}/submit"
        actor: Exhibitor
        preconditions:
          - "Exhibition.status == INTAKE_OPEN"
        side_effects:
          - "lottery_token := random integer in [0, 999999]"
          - "priority_score := compute application_priority_score"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /applications/{id}/start-review"
        actor: VenueAdmin
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: QUALIFIED
        trigger: "POST /applications/{id}/qualify"
        actor: VenueAdmin
        preconditions:
          - "Application.theme_tags intersects {Exhibition.theme_code} (intersection non-empty)"
        side_effects: []
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /applications/{id}/reject"
        actor: VenueAdmin
        preconditions:
          - "rejection_reason is non-empty"
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Exhibitor
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Exhibitor
        preconditions: []
        side_effects: []
      - from: QUALIFIED
        to: ALLOCATED
        trigger: "Side effect of POST /allocations creation with status=PROPOSED"
        actor: system
        preconditions:
          - "A BoothAllocation row was created referencing this application"
        side_effects: []

  - entity: BoothAllocation
    initial_state: PROPOSED
    terminal_states: [CONFIRMED, REVOKED]
    transitions:
      - from: PROPOSED
        to: PUBLISHED
        trigger: "Side effect of Exhibition INTAKE_OPEN→ALLOCATION_PUBLISHED"
        actor: system
        preconditions:
          - "Application.status == ALLOCATED"
          - "Booth.status == RESERVED"
        side_effects:
          - "quoted_price_cents := Booth.base_price_cents at this instant"
          - "Booth.status := ALLOCATED"
          - "published_at := now()"
          - "AuditLogEntry(subject_kind=ALLOCATION, subject_id=this.id, action=PUBLISH, payload includes quoted_price_cents)"
      - from: PUBLISHED
        to: OBJECTED
        trigger: "POST /allocations/{id}/object"
        actor: Exhibitor
        preconditions:
          - "now() < published_at + Exhibition.objection_window_hours hours"
          - "Acting Exhibitor.id == allocation.exhibitor_id"
        side_effects:
          - "AuditLogEntry(action=OBJECT, payload={reason})"
      - from: PUBLISHED
        to: CONFIRMED
        trigger: "POST /allocations/{id}/confirm"
        actor: Exhibitor
        preconditions:
          - "Acting Exhibitor.id == allocation.exhibitor_id"
        side_effects:
          - "Exhibitor CRM sync event emitted"
      - from: OBJECTED
        to: RELOCATING
        trigger: "POST /allocations/{id}/start-relocation"
        actor: VenueAdmin
        preconditions:
          - "Allocation.status == OBJECTED"
        side_effects:
          - "Original Booth.status := AVAILABLE"
          - "Allocation.relocation_source_booth_id := current booth_id"
      - from: RELOCATING
        to: PUBLISHED
        trigger: "POST /allocations/{id}/relocate"
        actor: VenueAdmin
        preconditions:
          - "Target Booth.status == AVAILABLE"
          - "Target Booth.tier == original Booth.tier"
        side_effects:
          - "booth_id := target booth.id"
          - "Target Booth.status := ALLOCATED"
          - "quoted_price_cents := target Booth.base_price_cents (re-pinned)"
          - "AuditLogEntry(action=RELOCATE, payload={from_booth_id, to_booth_id})"
      - from: PUBLISHED
        to: REVOKED
        trigger: "POST /allocations/{id}/revoke"
        actor: VenueAdmin
        preconditions:
          - "Exhibition.status in {ALLOCATION_PUBLISHED}"
        side_effects:
          - "Booth.status := AVAILABLE"
          - "Application.status reverts to QUALIFIED"
          - "AuditLogEntry(action=REVOKE)"

  - entity: DockSlot
    initial_state: OPEN
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: OPEN
        to: BOOKED
        trigger: "POST /dock-slots/{id}/book"
        actor: Exhibitor
        preconditions:
          - "Acting Exhibitor.id == BoothAllocation(allocation_id).exhibitor_id"
          - "BoothAllocation.status == CONFIRMED"
          - "No other BOOKED DockSlot at same dock_code overlaps [start_at, end_at) (closed-open)"
          - "If window_kind==MOVE_IN: Exhibition.status == SETUP"
          - "If window_kind==MOVE_OUT: Exhibition.status == TEARDOWN"
        side_effects: []
      - from: BOOKED
        to: COMPLETED
        trigger: "POST /dock-slots/{id}/complete"
        actor: VenueOps
        preconditions:
          - "For MOVE_IN: a SafetyInspection(kind=BOOTH_MOVE_IN, dock_slot_id=this, result=PASS) exists"
          - "If overnight_permit==true: that inspection was within last 8 hours of now()"
        side_effects:
          - "safety_inspection_passed := true"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /dock-slots/{id}/cancel"
        actor: Exhibitor
        preconditions: []
        side_effects:
          - "allocation_id := null (slot reverts to OPEN-equivalent capacity but row marked CANCELLED)"

  - entity: WorkOrder
    initial_state: DRAFT
    terminal_states: [BILLED, RESOLVED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /work-orders/{id}/submit"
        actor: Exhibitor
        preconditions:
          - "Acting Exhibitor.id == work_order.exhibitor_id"
          - "BoothAllocation.status == CONFIRMED"
          - "Each line.quantity > 0 and line.unit_price_cents > 0"
        side_effects:
          - "subtotal_cents, tax_cents, total_cents := compute work_order_billing"
      - from: SUBMITTED
        to: DISPATCHED
        trigger: "POST /work-orders/{id}/dispatch"
        actor: VenueOps
        preconditions: []
        side_effects: []
      - from: DISPATCHED
        to: EXECUTED
        trigger: "POST /work-orders/{id}/confirm-execution"
        actor: ServiceProvider
        preconditions: []
        side_effects: []
      - from: EXECUTED
        to: BILLED
        trigger: "POST /work-orders/{id}/bill"
        actor: VenueOps
        preconditions: []
        side_effects:
          - "resolved_total_cents := total_cents"
          - "Payment system sync event emitted with total_cents"
      - from: EXECUTED
        to: DISPUTED
        trigger: "POST /work-orders/{id}/dispute"
        actor: Exhibitor
        preconditions:
          - "dispute_reason non-empty"
        side_effects: []
      - from: DISPUTED
        to: RESOLVED
        trigger: "POST /work-orders/{id}/resolve"
        actor: VenueOps
        preconditions:
          - "resolved_total_cents <= total_cents and resolved_total_cents >= 0"
        side_effects:
          - "Payment system sync event emitted with resolved_total_cents"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: Exhibitor
        preconditions: []
        side_effects: []

  - entity: Ticket
    initial_state: ISSUED
    terminal_states: [SCANNED_OUT, VOID, REFUNDED]
    transitions:
      - from: ISSUED
        to: SCANNED_IN
        trigger: "POST /tickets/{id}/scan-in"
        actor: GateOperator
        preconditions:
          - "Exhibition.posture == OPEN"
          - "Exhibition.live_occupancy < Exhibition.capacity_max"
        side_effects:
          - "Exhibition.live_occupancy := Exhibition.live_occupancy + 1 (cascade depth 1)"
          - "If Exhibition.live_occupancy / Exhibition.capacity_max >= 0.95 then Exhibition.posture := RESTRICTED (cascade depth 2)"
          - "Access-control gate sync event emitted"
          - "scanned_in_at := now()"
      - from: SCANNED_IN
        to: SCANNED_OUT
        trigger: "POST /tickets/{id}/scan-out"
        actor: GateOperator
        preconditions: []
        side_effects:
          - "Exhibition.live_occupancy := Exhibition.live_occupancy - 1 (cascade depth 1)"
          - "If Exhibition.posture==RESTRICTED and live_occupancy / capacity_max < 0.90 then Exhibition.posture := OPEN (cascade depth 2)"
          - "scanned_out_at := now()"
      - from: ISSUED
        to: VOID
        trigger: "POST /tickets/{id}/void"
        actor: VenueAdmin
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: REFUNDED
        trigger: "POST /tickets/{id}/refund"
        actor: VenueAdmin
        preconditions:
          - "Ticket.channel == ONLINE_PRESALE"
          - "Exhibition.status != OPEN"
        side_effects:
          - "Payment system sync event emitted with -price_cents"

  - entity: SponsorEntitlement
    initial_state: PLANNED
    terminal_states: [FULFILLED, MISSED, MAKE_GOOD_ACCEPTED, WAIVED]
    transitions:
      - from: PLANNED
        to: IN_PROGRESS
        trigger: "POST /entitlements/{id}/start"
        actor: VenueOps
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: FULFILLED
        trigger: "POST /entitlements/{id}/fulfill"
        actor: VenueOps
        preconditions:
          - "evidence_url non-empty"
          - "now() <= deadline"
        side_effects:
          - "fulfillment_score := compute entitlement_fulfillment_score (final variant)"
          - "AuditLogEntry(subject_kind=ENTITLEMENT, action=FULFILL, payload includes evidence_url)"
      - from: IN_PROGRESS
        to: MISSED
        trigger: "POST /entitlements/{id}/mark-missed (or auto on Exhibition close)"
        actor: VenueOps
        preconditions:
          - "now() > deadline OR Exhibition.status == TEARDOWN"
        side_effects:
          - "make_good_credit_cents := compute entitlement_make_good"
          - "fulfillment_score := compute entitlement_fulfillment_score (final variant)"
      - from: MISSED
        to: MAKE_GOOD_OFFERED
        trigger: "POST /entitlements/{id}/offer-make-good"
        actor: VenueAdmin
        preconditions:
          - "make_good_credit_cents > 0"
        side_effects:
          - "AuditLogEntry(action=MAKE_GOOD_OFFERED, payload={make_good_credit_cents})"
      - from: MAKE_GOOD_OFFERED
        to: MAKE_GOOD_ACCEPTED
        trigger: "POST /entitlements/{id}/accept-make-good"
        actor: Exhibitor
        preconditions:
          - "Acting Exhibitor.id == entitlement.exhibitor_id"
        side_effects:
          - "Payment system sync event emitted with -make_good_credit_cents"
      - from: PLANNED
        to: WAIVED
        trigger: "POST /entitlements/{id}/waive"
        actor: Exhibitor
        preconditions:
          - "Acting Exhibitor.id == entitlement.exhibitor_id"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two exhibitors simultaneously book overlapping intervals on the same dock_code"
    guarantee: "At most one DockSlot occupies any [start_at, end_at) interval per dock_code; second booking rejected"
    error_id: ERR_DOCK_SLOT_OVERLAP
    http_status: 409
    serialization: "First-writer-wins on DockSlot row creation per (dock_code, interval)"
  - scenario: "Two BoothAllocation rows targeting the same Booth at the same instant"
    guarantee: "At most one allocation per Booth; second creation rejected"
    error_id: ERR_BOOTH_ALREADY_ALLOCATED
    http_status: 409
    serialization: "First-writer-wins on Booth.status transition AVAILABLE→RESERVED"
  - scenario: "Two relocations of the same allocation simultaneously"
    guarantee: "Exactly one relocation succeeds; loser rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Allocation.status RELOCATING→PUBLISHED"
  - scenario: "Two scan-ins for the same ticket"
    guarantee: "At most one scan-in counts toward live_occupancy; second rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Ticket.status ISSUED→SCANNED_IN"
  - scenario: "Two scan-ins racing when live_occupancy == capacity_max - 1"
    guarantee: "Only one scan-in succeeds at capacity boundary; loser rejected"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 409
    serialization: "Live_occupancy increment is atomic; first-writer-wins at boundary"
  - scenario: "Confirm vs revoke racing on the same allocation"
    guarantee: "Exactly one succeeds; loser rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Allocation.status PUBLISHED→*"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: booth_quoted_price
    trigger: "On Booth creation and at BoothAllocation PROPOSED→PUBLISHED transition (re-pinned on relocation)"
    algorithm: tiered_pricing
    formula: |
      # Step 1: tier base (cents)
      tier_base = {STANDARD: 200000, PREMIUM: 350000, ISLAND: 600000}[booth.tier]
      # Step 2: cell count multiplier — for tier ISLAND ONLY, every cell beyond 4 adds 10% per cell
      cell_count = len(booth.cells)
      if booth.tier == ISLAND and cell_count > 4:
        cell_multiplier = 1.0 + 0.10 * (cell_count - 4)
      else:
        cell_multiplier = 1.0
      # Step 3: corner premium (only when is_corner)
      corner_multiplier = 1.15 if booth.is_corner else 1.0
      # Step 4: theme premium (Exhibition.theme_code prefix gates a flat add-on)
      theme_addon_cents = 50000 if Exhibition.theme_code.startswith("PRO_") else 0
      # Evaluation order is pinned: cell_multiplier first, then corner_multiplier, then theme_addon
      pre_theme = round(tier_base * cell_multiplier * corner_multiplier)  # round_half_up to integer cents
      result_cents = pre_theme + theme_addon_cents
    input_set: "Booth row at the calculation moment; Exhibition.theme_code at the same moment"
    constants:
      TIER_BASE_STANDARD_CENTS: 200000
      TIER_BASE_PREMIUM_CENTS: 350000
      TIER_BASE_ISLAND_CENTS: 600000
      ISLAND_OVERSIZE_PER_CELL_PCT: 0.10
      CORNER_MULTIPLIER: 1.15
      THEME_ADDON_PREFIX: "PRO_"
      THEME_ADDON_CENTS: 50000
    precision: "integer cents; round_half_up after the multiplier chain, before adding the theme addon"
    variants:
      - name: at_creation
        when: "Booth row creation (POST /booths)"
        difference: "Used for the booth's catalog price; written to base_price_cents"
      - name: at_publish_or_relocate
        when: "BoothAllocation PROPOSED→PUBLISHED and RELOCATING→PUBLISHED"
        difference: "Re-evaluated against the CURRENT booth and CURRENT theme_code; pinned into BoothAllocation.quoted_price_cents. If the booth's tier or is_corner flag has changed since creation, the published quote differs from base_price_cents."

  - name: application_priority_score
    trigger: "On ExhibitorApplication SUBMITTED transition; used when VenueAdmin runs allocation"
    algorithm: weighted_scoring
    formula: |
      sponsor_weight = {NONE: 0, BRONZE: 100, SILVER: 250, GOLD: 500, PLATINUM: 1000}[sponsorship_level]
      seniority_weight = min(seniority_years, 20) * 10
      # Lottery component bounded to <100 so it cannot outrank a sponsor tier difference
      lottery_component = lottery_token / 10000.0  # in [0.0, 99.9999]
      score = sponsor_weight + seniority_weight + lottery_component
      # Evaluation order is pinned: sponsor first, seniority second, lottery as final tiebreak only.
    input_set: "Single ExhibitorApplication row"
    constants:
      SENIORITY_CAP_YEARS: 20
      SENIORITY_PER_YEAR: 10
      SPONSOR_NONE: 0
      SPONSOR_BRONZE: 100
      SPONSOR_SILVER: 250
      SPONSOR_GOLD: 500
      SPONSOR_PLATINUM: 1000
      LOTTERY_DIVISOR: 10000.0
    precision: "4 decimal places, round_half_up on the lottery component; score sorted descending"

  - name: work_order_billing
    trigger: "On WorkOrder DRAFT→SUBMITTED transition; values pinned thereafter"
    algorithm: aggregation
    formula: |
      # PINNED evaluation order — rounding before sum (per-line rounding then aggregate)
      tax_rate = 0.06
      per_line_amounts_cents = []
      for line in work_order.lines:
        line_gross = line.unit_price_cents * line.quantity         # exact integer
        # Cleaning lines get a 5% discount applied per line BEFORE rounding
        if line.service_code == "CLEANING":
          line_discounted = line_gross * 0.95
        else:
          line_discounted = line_gross
        per_line_amounts_cents.append(round_half_up(line_discounted))  # integer cents
      subtotal_cents = sum(per_line_amounts_cents)
      tax_cents = round_half_up(subtotal_cents * tax_rate)
      total_cents = subtotal_cents + tax_cents
    input_set: "Lines on the WorkOrder row at submission instant"
    constants:
      TAX_RATE: 0.06
      CLEANING_DISCOUNT: 0.05
    precision: "integer cents; round_half_up; per-line rounding precedes aggregation"

  - name: ticket_price
    trigger: "On Ticket creation (issuance)"
    algorithm: threshold
    formula: |
      base = {VISITOR: 5000, PROFESSIONAL_BUYER: 12000, STUDENT: 2500, VIP: 30000}[kind]  # cents
      # Channel surcharge — ONSITE adds a flat 20% surcharge except for VIP
      if channel == "ONSITE" and kind != "VIP":
        channel_multiplier = 1.20
      else:
        channel_multiplier = 1.0
      # Group discount: any ticket whose group_id is non-null and group size >= 10 gets 15% off
      if group_id is not None and count(Ticket WHERE group_id == this.group_id) >= 10:
        group_multiplier = 0.85
      else:
        group_multiplier = 1.0
      price_cents = round_half_up(base * channel_multiplier * group_multiplier)
    input_set: "Single Ticket; sibling tickets sharing group_id at the creation instant"
    constants:
      BASE_VISITOR: 5000
      BASE_PROFESSIONAL_BUYER: 12000
      BASE_STUDENT: 2500
      BASE_VIP: 30000
      ONSITE_SURCHARGE: 0.20
      GROUP_THRESHOLD: 10
      GROUP_DISCOUNT: 0.15
    precision: "integer cents; round_half_up after multipliers"

  - name: entitlement_fulfillment_score
    trigger: "On SponsorEntitlement transitions IN_PROGRESS→FULFILLED and IN_PROGRESS→MISSED, and on Exhibition close (auto-MISS)"
    algorithm: forward_looking
    formula: |
      # PROVISIONAL — used for in-progress dashboards (not pinned to row)
      provisional = 1.0 if status in {IN_PROGRESS, MAKE_GOOD_OFFERED} else
                    1.0 if status == FULFILLED else
                    0.5 if status == MAKE_GOOD_ACCEPTED else
                    0.5 if status == MAKE_GOOD_OFFERED else
                    0.0 if status in {MISSED, WAIVED} else
                    1.0
      # FINAL — pinned to fulfillment_score at terminal transition
      if final_status == "FULFILLED":
        final_value = 1.0
      elif final_status == "MAKE_GOOD_ACCEPTED":
        final_value = 0.5
      elif final_status == "WAIVED":
        final_value = 0.0
      elif final_status == "MISSED":
        # delay penalty: every full 24h past deadline drops 0.1, floor 0
        hours_late = max(0, (now() - deadline).total_hours())
        days_late = floor(hours_late / 24)
        final_value = max(0.0, 0.5 - 0.1 * days_late)   # MISSED starts at 0.5, decays
      else:
        final_value = 0.0
    input_set: "Single SponsorEntitlement row; current clock for MISSED variant"
    constants:
      FULFILLED_SCORE: 1.0
      MAKE_GOOD_BASE_SCORE: 0.5
      MISSED_BASE_SCORE: 0.5
      MISSED_DAILY_DECAY: 0.1
    precision: "4 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "Returned by GET /exhibitions/{id}/entitlement-report while Exhibition.status != CLOSED"
        difference: "Computed live; assumes all IN_PROGRESS will fulfill (score 1.0); does NOT mutate the row"
      - name: final
        when: "Pinned at terminal transition or at Exhibition CLOSED auto-MISS"
        difference: "Reflects realized terminal status with MISSED decay applied; written to fulfillment_score; values for the same entitlement at the same instant typically differ between the two variants"

  - name: entitlement_make_good
    trigger: "On SponsorEntitlement IN_PROGRESS→MISSED transition"
    algorithm: tiered_pricing
    formula: |
      sponsor_tier_base = {BRONZE: 10000, SILVER: 25000, GOLD: 60000, PLATINUM: 120000}[sponsor_tier]
      entitlement_factor = {SIGNAGE: 0.5, PROGRAM_AD: 0.4, LOUNGE: 0.8, SPEAKING_SLOT: 1.0, BRANDED_GIFT: 0.3}[entitlement_code]
      make_good_credit_cents = round_half_up(sponsor_tier_base * entitlement_factor)
    input_set: "Single SponsorEntitlement row"
    constants:
      MAKE_GOOD_BRONZE: 10000
      MAKE_GOOD_SILVER: 25000
      MAKE_GOOD_GOLD: 60000
      MAKE_GOOD_PLATINUM: 120000
    precision: "integer cents; round_half_up"

# =============================================================================
# §1.4 Validation Rules Table
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "Request carries X-User-ID and X-User-Role headers"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is permitted for the endpoint per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path-referenced resources exist (left-to-right): Exhibition, then Hall, then FloorPlanVersion, then Booth, then BoothAllocation, then DockSlot, then WorkOrder, then Ticket, then SponsorEntitlement, then ExhibitorApplication"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "Target resource is in a state from which this transition is allowed (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 5
    category: business_safety
    check: "Exhibition.posture permits the requested gate operation: scan-in requires posture==OPEN; non-staff Exhibitor entry into venue blocked when posture==FROZEN"
    error_id: ERR_POSTURE_BLOCKED
    http_status: 409
    applies_to: ["POST /tickets/{id}/scan-in", "POST /tickets/{id}/scan-out"]
  - priority: 6
    category: business_safety
    check: "Safety inspection gate: cannot OPEN exhibition without PRE_OPEN PASS; cannot complete MOVE_IN dock slot without BOOTH_MOVE_IN PASS"
    error_id: ERR_SAFETY_INSPECTION_MISSING
    http_status: 409
    applies_to: ["POST /exhibitions/{id}/open-doors", "POST /dock-slots/{id}/complete"]
  - priority: 7
    category: business_safety
    check: "Overnight permit required: any DockSlot whose [start_at,end_at) crosses 22:00 local must have overnight_permit==true"
    error_id: ERR_OVERNIGHT_PERMIT_REQUIRED
    http_status: 422
    applies_to: ["POST /dock-slots", "PATCH /dock-slots/{id}"]
  - priority: 8
    category: business_constraint
    check: "Booth cells must all be kind in {FIXED, MODULAR}; no cell may be FIRE_SAFETY"
    error_id: ERR_FIRE_SAFETY_CELL
    http_status: 422
    applies_to: ["POST /halls/{hall_id}/booths"]
  - priority: 9
    category: business_constraint
    check: "Booth utility load: sum of WorkOrder.lines[service_code==EXTRA_POWER].quantity (in kW) on this booth must not exceed booth.power_kw_capacity"
    error_id: ERR_UTILITY_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: ["POST /work-orders/{id}/submit"]
  - priority: 10
    category: business_referential
    check: "Application.theme_tags must intersect {Exhibition.theme_code} for QUALIFY"
    error_id: ERR_THEME_MISMATCH
    http_status: 422
    applies_to: ["POST /applications/{id}/qualify"]
  - priority: 11
    category: business_temporal
    check: "Objection action: now() < BoothAllocation.published_at + Exhibition.objection_window_hours hours"
    error_id: ERR_OBJECTION_WINDOW_CLOSED
    http_status: 409
    applies_to: ["POST /allocations/{id}/object"]
  - priority: 12
    category: business_temporal
    check: "DockSlot [start_at,end_at) must not overlap (half-open) with any other BOOKED slot on the same dock_code"
    error_id: ERR_DOCK_SLOT_OVERLAP
    http_status: 409
    applies_to: ["POST /dock-slots"]
  - priority: 13
    category: business_temporal
    check: "Crane and forklift rules: at most one BOOKED slot at the same start_at across the exhibition may have crane_required==true; same rule independently for forklift_required==true"
    error_id: ERR_RESOURCE_CONFLICT
    http_status: 409
    applies_to: ["POST /dock-slots"]
  - priority: 14
    category: business_constraint
    check: "Ticket scan-in respects exhibition capacity: live_occupancy < capacity_max strictly (zero-quantity edge: capacity_max==0 blocks all scan-ins)"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: ["POST /tickets/{id}/scan-in"]
  - priority: 15
    category: business_constraint
    check: "Group ticket discount eligibility requires group size >= 10 at issuance instant; group_id must be the same string across all members; group cannot be empty"
    error_id: ERR_GROUP_INVALID
    http_status: 422
    applies_to: ["POST /tickets"]
  - priority: 16
    category: business_constraint
    check: "Relocation target booth tier must match the original booth tier"
    error_id: ERR_RELOCATION_TIER_MISMATCH
    http_status: 422
    applies_to: ["POST /allocations/{id}/relocate"]
  - priority: 17
    category: business_constraint
    check: "Work order line: quantity > 0 AND unit_price_cents > 0 (zero-quantity edge: quantity==0 rejected; empty lines array rejected)"
    error_id: ERR_INVALID_INPUT
    http_status: 422
    applies_to: ["POST /work-orders/{id}/submit"]
  - priority: 18
    category: business_fiscal
    check: "Dispute resolution: resolved_total_cents <= total_cents AND resolved_total_cents >= 0"
    error_id: ERR_DISPUTE_RESOLUTION_INVALID
    http_status: 422
    applies_to: ["POST /work-orders/{id}/resolve"]
  - priority: 19
    category: business_referential
    check: "FloorPlanVersion can be activated only while owning Exhibition.status == DRAFT"
    error_id: ERR_FLOOR_PLAN_LOCKED
    http_status: 409
    applies_to: ["POST /halls/{hall_id}/floor-plans/{id}/activate"]
  - priority: 20
    category: business_referential
    check: "OCC version conflict: when request body version does not match current row version"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all mutation endpoints accepting optional version"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # Test-driving infrastructure (required by skill §1.5 for time-gated reachability)
  - method: POST
    path: "/_clock/advance"
    description: "Advance the server's logical clock to a specified ISO8601 timestamp; enables tests to reach time-gated transitions (objection window expiry, deadline-based entitlement MISSED, open_date/close_date)"
    roles: [TestHarness]
    code: 200
    input: [to]
    output: "object"
    side_effects:
      - "On clock advance past any SponsorEntitlement.deadline while entitlement is in IN_PROGRESS, that row is auto-MISSED with make_good and final fulfillment_score recomputed (cascade depth 2)"

  # Exhibition
  - method: POST
    path: "/exhibitions"
    description: "Create exhibition (DRAFT)"
    roles: [VenueAdmin]
    code: 201
    input: ["name", "theme_code", "open_date", "close_date", "capacity_max", "objection_window_hours?"]
    output: Exhibition
    side_effects: []
  - method: GET
    path: "/exhibitions/{id}"
    description: "Read exhibition"
    roles: [VenueAdmin, VenueOps, Exhibitor, GateOperator, ServiceProvider]
    code: 200
    input: []
    output: Exhibition
    side_effects: []
  - method: POST
    path: "/exhibitions/{id}/open-intake"
    description: "DRAFT→INTAKE_OPEN"
    roles: [VenueAdmin]
    code: 200
    input: []
    output: Exhibition
    side_effects: ["posture := FROZEN"]
  - method: POST
    path: "/exhibitions/{id}/publish-allocation"
    description: "INTAKE_OPEN→ALLOCATION_PUBLISHED; cascades all PROPOSED allocations to PUBLISHED"
    roles: [VenueAdmin]
    code: 200
    input: []
    output: Exhibition
    side_effects: ["cascade: BoothAllocation PROPOSED→PUBLISHED for all rows on this exhibition; pin quoted_price_cents; AuditLogEntry per allocation"]
  - method: POST
    path: "/exhibitions/{id}/start-setup"
    description: "ALLOCATION_PUBLISHED→SETUP (objection window must be closed; all allocations CONFIRMED or REVOKED)"
    roles: [VenueAdmin]
    code: 200
    input: []
    output: Exhibition
    side_effects: ["posture := RESTRICTED"]
  - method: POST
    path: "/exhibitions/{id}/open-doors"
    description: "SETUP→OPEN"
    roles: [VenueAdmin]
    code: 200
    input: []
    output: Exhibition
    side_effects: ["posture := OPEN"]
  - method: POST
    path: "/exhibitions/{id}/close-doors"
    description: "OPEN→TEARDOWN"
    roles: [VenueAdmin]
    code: 200
    input: []
    output: Exhibition
    side_effects: ["posture := RESTRICTED; void unused issued tickets"]
  - method: POST
    path: "/exhibitions/{id}/close"
    description: "TEARDOWN→CLOSED"
    roles: [VenueAdmin]
    code: 200
    input: []
    output: Exhibition
    side_effects: ["posture := FROZEN; auto-MISS remaining IN_PROGRESS entitlements"]
  - method: GET
    path: "/exhibitions/{id}/entitlement-report"
    description: "Computed report aggregating sponsor entitlement statuses, fulfillment_score (provisional variant pre-CLOSED, final variant post-CLOSED), and make-good totals"
    roles: [VenueAdmin, Exhibitor]
    code: 200
    input: []
    output: "object"
    side_effects: []

  # Halls & FloorPlan
  - method: POST
    path: "/exhibitions/{id}/halls"
    description: "Create hall under exhibition"
    roles: [VenueAdmin]
    code: 201
    input: [hall_code, zone_label, aisle_label, grid_rows, grid_cols, fire_safety_zone_cells]
    output: Hall
    side_effects: []
  - method: POST
    path: "/halls/{hall_id}/floor-plans"
    description: "Create DRAFT floor plan version"
    roles: [VenueAdmin]
    code: 201
    input: [cells]
    output: FloorPlanVersion
    side_effects: []
  - method: POST
    path: "/halls/{hall_id}/floor-plans/{id}/activate"
    description: "DRAFT→ACTIVE; supersedes existing ACTIVE version"
    roles: [VenueAdmin]
    code: 200
    input: []
    output: FloorPlanVersion
    side_effects: ["any prior ACTIVE FloorPlanVersion → SUPERSEDED; Hall.floor_plan_active_version := this.version_number; Booth rows tied to the superseded version → BLOCKED"]

  # Booths
  - method: POST
    path: "/halls/{hall_id}/booths"
    description: "Create booth in active floor plan"
    roles: [VenueAdmin]
    code: 201
    input: [code, cells, tier]
    output: Booth
    side_effects: ["compute is_corner; compute capacities; compute base_price_cents via booth_quoted_price (at_creation variant)"]
  - method: GET
    path: "/halls/{hall_id}/booths"
    description: "List booths in hall; supports ?status filter"
    roles: [VenueAdmin, VenueOps, Exhibitor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Booth[]"
    side_effects: []
  - method: GET
    path: "/booths/{id}"
    description: "Read booth"
    roles: [VenueAdmin, VenueOps, Exhibitor]
    code: 200
    input: []
    output: Booth
    side_effects: []

  # Applications
  - method: POST
    path: "/exhibitions/{id}/applications"
    description: "Exhibitor submits an application (DRAFT)"
    roles: [Exhibitor]
    code: 201
    input: [theme_tags, requested_tier, sponsorship_level, seniority_years]
    output: ExhibitorApplication
    side_effects: []
  - method: POST
    path: "/applications/{id}/submit"
    description: "DRAFT→SUBMITTED"
    roles: [Exhibitor]
    code: 200
    input: []
    output: ExhibitorApplication
    side_effects: ["assign lottery_token; compute priority_score"]
  - method: POST
    path: "/applications/{id}/start-review"
    description: "SUBMITTED→UNDER_REVIEW"
    roles: [VenueAdmin]
    code: 200
    input: []
    output: ExhibitorApplication
    side_effects: []
  - method: POST
    path: "/applications/{id}/qualify"
    description: "UNDER_REVIEW→QUALIFIED"
    roles: [VenueAdmin]
    code: 200
    input: []
    output: ExhibitorApplication
    side_effects: []
  - method: POST
    path: "/applications/{id}/reject"
    description: "UNDER_REVIEW→REJECTED"
    roles: [VenueAdmin]
    code: 200
    input: [rejection_reason]
    output: ExhibitorApplication
    side_effects: []
  - method: POST
    path: "/applications/{id}/withdraw"
    description: "SUBMITTED or UNDER_REVIEW → WITHDRAWN"
    roles: [Exhibitor]
    code: 200
    input: []
    output: ExhibitorApplication
    side_effects: []
  - method: GET
    path: "/exhibitions/{id}/applications"
    description: "List applications; supports ?status filter and ?sort_by=priority_score"
    roles: [VenueAdmin]
    code: 200
    input: ["status?", "sort_by?", "limit?", "offset?"]
    output: "ExhibitorApplication[]"
    side_effects: []

  # Allocations
  - method: POST
    path: "/allocations"
    description: "Create PROPOSED allocation linking application to booth"
    roles: [VenueAdmin]
    code: 201
    input: [application_id, booth_id]
    output: BoothAllocation
    side_effects: ["Application.status → ALLOCATED; Booth.status → RESERVED"]
  - method: POST
    path: "/allocations/{id}/object"
    description: "PUBLISHED→OBJECTED within objection window"
    roles: [Exhibitor]
    code: 200
    input: [reason]
    output: BoothAllocation
    side_effects: ["AuditLogEntry(action=OBJECT)"]
  - method: POST
    path: "/allocations/{id}/confirm"
    description: "PUBLISHED→CONFIRMED"
    roles: [Exhibitor]
    code: 200
    input: []
    output: BoothAllocation
    side_effects: ["Exhibitor CRM sync event"]
  - method: POST
    path: "/allocations/{id}/start-relocation"
    description: "OBJECTED→RELOCATING; original booth freed"
    roles: [VenueAdmin]
    code: 200
    input: []
    output: BoothAllocation
    side_effects: ["Original Booth.status → AVAILABLE"]
  - method: POST
    path: "/allocations/{id}/relocate"
    description: "RELOCATING→PUBLISHED with new booth"
    roles: [VenueAdmin]
    code: 200
    input: [target_booth_id]
    output: BoothAllocation
    side_effects: ["Target Booth.status → ALLOCATED; quoted_price_cents re-pinned via booth_quoted_price (at_publish_or_relocate variant); AuditLogEntry(action=RELOCATE)"]
  - method: POST
    path: "/allocations/{id}/revoke"
    description: "PUBLISHED→REVOKED"
    roles: [VenueAdmin]
    code: 200
    input: [reason]
    output: BoothAllocation
    side_effects: ["Booth.status → AVAILABLE; Application reverts to QUALIFIED; AuditLogEntry(action=REVOKE)"]
  - method: GET
    path: "/allocations/{id}"
    description: "Read allocation"
    roles: [VenueAdmin, Exhibitor]
    code: 200
    input: []
    output: BoothAllocation
    side_effects: []
  - method: GET
    path: "/exhibitions/{id}/audit-log"
    description: "List audit log entries for allocations and entitlements; supports ?subject_kind filter"
    roles: [VenueAdmin]
    code: 200
    input: ["subject_kind?", "limit?", "offset?"]
    output: "AuditLogEntry[]"
    side_effects: []

  # Dock slots
  - method: POST
    path: "/exhibitions/{id}/dock-slots"
    description: "Book a dock slot for a confirmed allocation"
    roles: [Exhibitor]
    code: 201
    input: ["dock_code", "window_kind", "start_at", "end_at", "allocation_id", "crane_required?", "forklift_required?", "overnight_permit?"]
    output: DockSlot
    side_effects: []
  - method: POST
    path: "/dock-slots/{id}/complete"
    description: "BOOKED→COMPLETED"
    roles: [VenueOps]
    code: 200
    input: []
    output: DockSlot
    side_effects: ["safety_inspection_passed := true"]
  - method: POST
    path: "/dock-slots/{id}/cancel"
    description: "BOOKED→CANCELLED"
    roles: [Exhibitor]
    code: 200
    input: []
    output: DockSlot
    side_effects: []

  # Safety inspections
  - method: POST
    path: "/exhibitions/{id}/safety-inspections"
    description: "Record a safety inspection result (PRE_OPEN, BOOTH_MOVE_IN, or OVERNIGHT)"
    roles: [VenueOps]
    code: 201
    input: ["kind", "result", "inspector_id", "dock_slot_id?", "notes?"]
    output: SafetyInspection
    side_effects: ["For BOOTH_MOVE_IN with result=PASS: linked DockSlot.safety_inspection_passed will be true at /complete time"]

  # Work orders
  - method: POST
    path: "/work-orders"
    description: "Create DRAFT work order"
    roles: [Exhibitor]
    code: 201
    input: [exhibition_id, allocation_id, lines]
    output: WorkOrder
    side_effects: []
  - method: POST
    path: "/work-orders/{id}/submit"
    description: "DRAFT→SUBMITTED; pin subtotal/tax/total"
    roles: [Exhibitor]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["compute work_order_billing; pin subtotal_cents, tax_cents, total_cents"]
  - method: POST
    path: "/work-orders/{id}/dispatch"
    description: "SUBMITTED→DISPATCHED"
    roles: [VenueOps]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []
  - method: POST
    path: "/work-orders/{id}/confirm-execution"
    description: "DISPATCHED→EXECUTED"
    roles: [ServiceProvider]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []
  - method: POST
    path: "/work-orders/{id}/bill"
    description: "EXECUTED→BILLED; emits payment sync"
    roles: [VenueOps]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["resolved_total_cents := total_cents; payment sync emitted"]
  - method: POST
    path: "/work-orders/{id}/dispute"
    description: "EXECUTED→DISPUTED"
    roles: [Exhibitor]
    code: 200
    input: [dispute_reason]
    output: WorkOrder
    side_effects: []
  - method: POST
    path: "/work-orders/{id}/resolve"
    description: "DISPUTED→RESOLVED with concession"
    roles: [VenueOps]
    code: 200
    input: [resolved_total_cents]
    output: WorkOrder
    side_effects: ["payment sync emitted with resolved_total_cents"]
  - method: POST
    path: "/work-orders/{id}/cancel"
    description: "DRAFT→CANCELLED"
    roles: [Exhibitor]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []

  # Tickets
  - method: POST
    path: "/exhibitions/{id}/tickets"
    description: "Issue a ticket; price is computed via ticket_price; QR minted"
    roles: [VenueAdmin, VenueOps, Exhibitor]
    code: 201
    input: ["kind", "channel", "group_id?"]
    output: Ticket
    side_effects: ["compute ticket_price; mint qr_code"]
  - method: POST
    path: "/tickets/{id}/scan-in"
    description: "ISSUED→SCANNED_IN; increments live_occupancy"
    roles: [GateOperator]
    code: 200
    input: []
    output: Ticket
    side_effects: ["live_occupancy++; posture may transition OPEN→RESTRICTED at 95% (cascade depth 2); access-control gate sync emitted"]
  - method: POST
    path: "/tickets/{id}/scan-out"
    description: "SCANNED_IN→SCANNED_OUT; decrements live_occupancy"
    roles: [GateOperator]
    code: 200
    input: []
    output: Ticket
    side_effects: ["live_occupancy--; posture may transition RESTRICTED→OPEN at <90% (cascade depth 2)"]
  - method: POST
    path: "/tickets/{id}/refund"
    description: "ISSUED→REFUNDED (online-presale only, before OPEN)"
    roles: [VenueAdmin]
    code: 200
    input: []
    output: Ticket
    side_effects: ["payment sync emitted with -price_cents"]
  - method: POST
    path: "/tickets/{id}/void"
    description: "ISSUED→VOID"
    roles: [VenueAdmin]
    code: 200
    input: []
    output: Ticket
    side_effects: []
  - method: GET
    path: "/exhibitions/{id}/occupancy"
    description: "Real-time occupancy snapshot: live_occupancy, capacity_max, posture"
    roles: [VenueAdmin, VenueOps, GateOperator]
    code: 200
    input: []
    output: "object"
    side_effects: []

  # Sponsor entitlements
  - method: POST
    path: "/exhibitions/{id}/entitlements"
    description: "Create a SponsorEntitlement (PLANNED)"
    roles: [VenueAdmin]
    code: 201
    input: [exhibitor_id, entitlement_code, sponsor_tier, deadline]
    output: SponsorEntitlement
    side_effects: []
  - method: POST
    path: "/entitlements/{id}/start"
    description: "PLANNED→IN_PROGRESS"
    roles: [VenueOps]
    code: 200
    input: []
    output: SponsorEntitlement
    side_effects: []
  - method: POST
    path: "/entitlements/{id}/fulfill"
    description: "IN_PROGRESS→FULFILLED with evidence"
    roles: [VenueOps]
    code: 200
    input: [evidence_url]
    output: SponsorEntitlement
    side_effects: ["compute entitlement_fulfillment_score (final); AuditLogEntry"]
  - method: POST
    path: "/entitlements/{id}/mark-missed"
    description: "IN_PROGRESS→MISSED (manual; auto-triggered by clock past deadline)"
    roles: [VenueAdmin]
    code: 200
    input: []
    output: SponsorEntitlement
    side_effects: ["compute entitlement_make_good; compute entitlement_fulfillment_score (final, MISSED variant)"]
  - method: POST
    path: "/entitlements/{id}/offer-make-good"
    description: "MISSED→MAKE_GOOD_OFFERED"
    roles: [VenueAdmin]
    code: 200
    input: []
    output: SponsorEntitlement
    side_effects: ["AuditLogEntry(action=MAKE_GOOD_OFFERED)"]
  - method: POST
    path: "/entitlements/{id}/accept-make-good"
    description: "MAKE_GOOD_OFFERED→MAKE_GOOD_ACCEPTED"
    roles: [Exhibitor]
    code: 200
    input: []
    output: SponsorEntitlement
    side_effects: ["payment sync emitted with -make_good_credit_cents"]
  - method: POST
    path: "/entitlements/{id}/waive"
    description: "PLANNED→WAIVED"
    roles: [Exhibitor]
    code: 200
    input: []
    output: SponsorEntitlement
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "Missing X-User-ID or X-User-Role headers"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for endpoint per RBAC"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-referenced resource does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource not in a state allowing requested transition"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "OCC: client-supplied version does not match current row version"
  - id: ERR_POSTURE_BLOCKED
    http: 409
    condition: "Exhibition.posture does not permit this gate operation"
  - id: ERR_SAFETY_INSPECTION_MISSING
    http: 409
    condition: "Required PRE_OPEN or BOOTH_MOVE_IN safety inspection PASS not found"
  - id: ERR_OVERNIGHT_PERMIT_REQUIRED
    http: 422
    condition: "DockSlot crosses 22:00 local without overnight_permit==true"
  - id: ERR_FIRE_SAFETY_CELL
    http: 422
    condition: "Booth cells include a cell whose plan kind is FIRE_SAFETY"
  - id: ERR_UTILITY_CAPACITY_EXCEEDED
    http: 422
    condition: "Sum of EXTRA_POWER service quantities exceeds booth.power_kw_capacity"
  - id: ERR_THEME_MISMATCH
    http: 422
    condition: "Application.theme_tags does not intersect Exhibition.theme_code"
  - id: ERR_OBJECTION_WINDOW_CLOSED
    http: 409
    condition: "now() >= published_at + objection_window_hours"
  - id: ERR_DOCK_SLOT_OVERLAP
    http: 409
    condition: "Proposed DockSlot [start_at,end_at) overlaps an existing BOOKED slot on the same dock_code"
  - id: ERR_RESOURCE_CONFLICT
    http: 409
    condition: "Crane or forklift required at a start_at already taken by another BOOKED slot on the exhibition"
  - id: ERR_CAPACITY_EXCEEDED
    http: 409
    condition: "Scan-in would make live_occupancy >= capacity_max"
  - id: ERR_GROUP_INVALID
    http: 422
    condition: "Group ticket discount requested but group size < 10, or group_id mismatch"
  - id: ERR_RELOCATION_TIER_MISMATCH
    http: 422
    condition: "Relocation target booth tier differs from original booth tier"
  - id: ERR_INVALID_INPUT
    http: 422
    condition: "Generic input validation: missing field, non-positive quantity/price, empty array"
  - id: ERR_DISPUTE_RESOLUTION_INVALID
    http: 422
    condition: "resolved_total_cents out of range [0, total_cents]"
  - id: ERR_FLOOR_PLAN_LOCKED
    http: 409
    condition: "Attempt to activate a FloorPlanVersion after Exhibition has left DRAFT"
  - id: ERR_BOOTH_ALREADY_ALLOCATED
    http: 409
    condition: "Creating an allocation against a booth not in AVAILABLE status"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: VenueAdmin
    description: "Venue operator with full configuration and lifecycle authority"
    identity: "opaque"
    exclusive_operations:
      - "POST /exhibitions"
      - "POST /exhibitions/{id}/open-intake"
      - "POST /exhibitions/{id}/publish-allocation"
      - "POST /exhibitions/{id}/start-setup"
      - "POST /exhibitions/{id}/open-doors"
      - "POST /exhibitions/{id}/close-doors"
      - "POST /exhibitions/{id}/close"
      - "POST /exhibitions/{id}/halls"
      - "POST /halls/{hall_id}/floor-plans"
      - "POST /halls/{hall_id}/floor-plans/{id}/activate"
      - "POST /halls/{hall_id}/booths"
      - "POST /applications/{id}/start-review"
      - "POST /applications/{id}/qualify"
      - "POST /applications/{id}/reject"
      - "POST /allocations"
      - "POST /allocations/{id}/start-relocation"
      - "POST /allocations/{id}/relocate"
      - "POST /allocations/{id}/revoke"
      - "POST /entitlements/{id}/mark-missed"
      - "POST /entitlements/{id}/offer-make-good"
      - "POST /tickets/{id}/refund"
      - "POST /tickets/{id}/void"
      - "GET /exhibitions/{id}/audit-log"
      - "GET /exhibitions/{id}/applications"
      - "POST /exhibitions/{id}/entitlements"
    shared_operations:
      - "POST /exhibitions/{id}/tickets (with VenueOps, Exhibitor)"
      - "GET /exhibitions/{id}/entitlement-report (with Exhibitor)"
      - "GET /exhibitions/{id}/occupancy (with VenueOps, GateOperator)"
      - "GET /booths/{id}, /allocations/{id}, /exhibitions/{id} (read-many roles)"

  - name: VenueOps
    description: "Operational staff: dispatch work orders, run safety inspections, execute entitlements"
    identity: "opaque"
    exclusive_operations:
      - "POST /dock-slots/{id}/complete"
      - "POST /work-orders/{id}/dispatch"
      - "POST /work-orders/{id}/bill"
      - "POST /work-orders/{id}/resolve"
      - "POST /exhibitions/{id}/safety-inspections"
      - "POST /entitlements/{id}/start"
      - "POST /entitlements/{id}/fulfill"
    shared_operations:
      - "POST /exhibitions/{id}/tickets (with VenueAdmin, Exhibitor)"
      - "GET /exhibitions/{id}/occupancy (with VenueAdmin, GateOperator)"

  - name: Exhibitor
    description: "Exhibiting company; submits applications, books slots, places work orders"
    identity: "entity_backed:ExhibitorApplication"
    exclusive_operations:
      - "POST /exhibitions/{id}/applications"
      - "POST /applications/{id}/submit"
      - "POST /applications/{id}/withdraw"
      - "POST /allocations/{id}/object"
      - "POST /allocations/{id}/confirm"
      - "POST /exhibitions/{id}/dock-slots"
      - "POST /dock-slots/{id}/cancel"
      - "POST /work-orders"
      - "POST /work-orders/{id}/submit"
      - "POST /work-orders/{id}/dispute"
      - "POST /work-orders/{id}/cancel"
      - "POST /entitlements/{id}/accept-make-good"
      - "POST /entitlements/{id}/waive"
    shared_operations:
      - "POST /exhibitions/{id}/tickets (with VenueAdmin, VenueOps)"
      - "GET /exhibitions/{id}/entitlement-report (with VenueAdmin)"
      - "GET /booths/{id}, /allocations/{id} (own resources only)"
    note: |
      identity_backed:ExhibitorApplication — by convention, X-User-ID matches the exhibitor_id field
      that is carried as a foreign key on ExhibitorApplication, BoothAllocation, DockSlot, WorkOrder,
      and SponsorEntitlement. Ownership checks compare X-User-ID to the resource's exhibitor_id field.
      (The exhibitor identifier is the same opaque string across all the exhibitor's applications;
      ExhibitorApplication is the first persisted record minted under that id.)

  - name: ServiceProvider
    description: "Third-party service vendor confirming on-site execution of work orders"
    identity: "opaque"
    exclusive_operations:
      - "POST /work-orders/{id}/confirm-execution"
    shared_operations: []

  - name: GateOperator
    description: "Front-gate staff scanning tickets in and out"
    identity: "opaque"
    exclusive_operations:
      - "POST /tickets/{id}/scan-in"
      - "POST /tickets/{id}/scan-out"
    shared_operations:
      - "GET /exhibitions/{id}/occupancy (with VenueAdmin, VenueOps)"

  - name: TestHarness
    description: "Privileged test-only role for advancing the logical clock; not exposed in production"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/advance"
    shared_operations: []
