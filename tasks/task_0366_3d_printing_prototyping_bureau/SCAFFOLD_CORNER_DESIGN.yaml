        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[order-confirm-stale-order]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Confirm carrying expected_order_version captured at first quote (now stale after a second line bumped the version and the order was re-quoted) -> 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Funded customer; order line B quoted; client captured the quoted version; then a second line added + re-quoted (bumping version)."]
          setup_api_calls:
            - { call: "POST /bureaus", payload: { name: "B OCC1" }, as: BureauAdmin, captures: { b: $.data.id } }
            - { call: "POST /bureaus/customers", payload: { bureau_id: "${b}", email: "occ1@x.com", display_name: "OCC1" }, as: BureauAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bureaus/customers/${cust}/deposit", payload: { amount_cents: 5000000 }, as: BureauAdmin }
