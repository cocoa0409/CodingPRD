# =============================================================================
# PRD Benchmark Seed Tables — task_3104
# Transparent Cost-Plus Pharmacy Pricing & Direct Manufacturer Sourcing
# =============================================================================

scenario: |
  Generate task much harder than expert level!

  Transparent Cost-Plus Pharmacy Pricing & Direct Manufacturer Sourcing (Mark Cuban Cost Plus Drug Company): acquisition cost sourcing directly from manufacturers with negotiated per-unit pricing published to patients, price construction as acquisition cost plus a fixed markup, pharmacy fee and shipping with no insurance adjudication, formulary expansion decisions weighing patient demand against supply reliability, prescription intake requiring a valid prescriber order routed to a mail pharmacy, state pharmacy licensing and shipping restrictions with controlled substance exclusions, order fulfillment, refill authorization and shortage substitution communication, comparison messaging against typical retail and benefit-covered prices with substantiation

domain_name: transparent-cost-plus-pharmacy
api_prefix: ""
# The public surface is deliberately flat: drugs, prices, pharmacies, prescriptions,
# orders, claims and shipments are all top-level peer collections joined by foreign
# keys. The /formularies/* paths are a read-only computed view over Drug, not a
# resource container.

complexity_profile:
  primary_archetype: Pricing engine
  secondary_archetype: Compliance / audit
  secondary_archetype_note: >
    Compliance is realized through the pharmacy-license state gate (only states carrying an ACTIVE
    PharmacyLicense may receive a shipment), the controlled-substance exclusion, and the
    substantiation-registry requirement that every published comparison figure be preceded by a
    registered substantiation record.
  complexity_layers:
    - rate_threshold_triggers
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency
  entity_topology: flat
  flat_note: >
    All thirteen entities are peers joined by foreign keys (drug_id, pharmacy_id, order_id,
    claim_id, manufacturer_id). URL nesting is at most two levels (a pharmacy-scoped sub-resource);
    no strict ownership tree.
  state_machine_shape: parallel
  state_machine_shape_note: >
    DrugPrice carries two independent state dimensions on one row (price_status x sourcing_status);
    the remaining machines are linear, branching-with-revert, or cyclic.
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  many_to_many_note: >
    Drug <-> Pharmacy is many-to-many through PharmacyLicense (a pharmacy holds many drug licences;
    a drug is licensed to many pharmacies). The formulary row is likewise a junction between
    ManufacturerDrugPrice and Pharmacy.
  role_model: peer_roles
  consistency_model: immediate

difficulty_level: expert
difficulty_level_note: >
  Scarce drugs are sourced from several manufacturers at different negotiated per-unit costs, so
  "the cost" and "the shipment interval" are both selection problems with explicit eligibility,
  ranking, tie-break and empty-pool rules. Two independent state dimensions ride on one row, the
  state licensure gate chains into shipment creation which chains into claim fallback which chains
  into refill denial (depth 4), and a drug substitution chains into a comparison refresh. Two
  compensating invariants are pinned: a reversal restores the whole money decomposition exactly,
  and an intake-rejection restores claim active quantity exactly. All money is integer cents.

# =============================================================================
# Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Manufacturer
    parent: null
    common_fields: true
    fields:
      - { name: manufacturer_name, type: string, source: input, description: "Legal manufacturer name" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", constraints: "enum values ACTIVE, SUSPENDED; system-initialized to ACTIVE on create" }

  - name: Drug
    parent: null
    common_fields: true
    fields:
      - { name: drug_name, type: string, source: input, description: "Generic or brand-drug name" }
      - { name: strength, type: string, source: input, description: "Dose strength, e.g. 12.5MG" }
      - { name: dosage_form, type: string, source: input, description: "Tablet | Capsule | Solution" }
      - { name: is_controlled, type: boolean, source: input, description: "True when the drug is a controlled substance and is therefore excluded from shipping entirely" }
      - { name: state, type: enum, source: system, description: "FORMULARY | NON_FORMULARY | DELISTED", constraints: "enum values FORMULARY, NON_FORMULARY, DELISTED; system-initialized to NON_FORMULARY on create" }
      - { name: packaging, type: string, source: computed, description: "Packaging description copied from the selected primary ManufacturerDrugPrice row" }
      - { name: retail_reference_price_cents, type: integer, source: input, description: "Reference typical-retail price per fill, in integer cents" }
      - { name: insured_reference_price_cents, type: integer, source: input, description: "Reference benefit-covered price per fill (patient out-of-pocket), in integer cents" }
      - { name: demand_units_30d, type: integer, source: computed, description: "Sum of PrescriptionRequest.packaged_quantity for requests on this drug created within the trailing 30-day window ending at the logical clock" }
      - { name: supply_units, type: integer, source: computed, description: "Sum of ManufacturerDrugPrice.available_units for this drug over rows whose sourcing_status IN {SOURCED, UNDER_REVIEW} and manufacturer.status == ACTIVE" }
      - { name: sourcing_status, type: enum, source: computed, description: "SOURCED | UNDER_REVIEW | UNSOURCED | SUSPENDED — derived over the supply-eligible candidate pool" }
      - { name: effective_unit_cost_cents, type: integer, source: computed, description: "Sourcing-effective per-unit acquisition cost in integer cents; computed by primary_source_cost" }
      - { name: ship_interval_days, type: integer, source: computed, description: "Days between shipments for this drug; computed by shipment_interval_days" }
      - { name: expansion_score, type: integer, source: computed, description: "Formulary-expansion ranking score; computed by expansion_score" }

  - name: Pharmacy
    parent: null
    common_fields: true
    fields:
      - { name: pharmacy_name, type: string, source: input, description: "Pharmacy trading name" }
      - { name: domicile_state_code, type: string, source: input, description: "Two-letter state code of the pharmacy's domicile" }
      - { name: shipping_enabled, type: boolean, source: input, description: "Operator kill-switch; when false no shipment may be created for this pharmacy regardless of licensure" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", constraints: "enum values ACTIVE, SUSPENDED; system-initialized to ACTIVE on create" }

  - name: PharmacyLicense
    parent: Pharmacy
    common_fields: true
    fields:
      - { name: pharmacy_id, type: string, source: system, description: "FK -> Pharmacy.id; the licensed pharmacy" }
      - { name: state_code, type: string, source: input, description: "Two-letter destination state this licence covers" }
      - { name: license_number, type: string, source: input, description: "State-issued pharmacy licence number" }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | EXPIRED | REVOKED | SUPERSEDED", constraints: "enum values PENDING, ACTIVE, EXPIRED, REVOKED, SUPERSEDED" }
      - { name: verified_at, type: datetime, source: system, description: "Server-stamped verification instant; null until the licence first reaches ACTIVE" }
      - { name: expiry_at, type: datetime, source: input, description: "Licence expiry instant supplied by the operator" }

  - name: ManufacturerDrugPrice
    parent: null
    common_fields: true
    fields:
      - { name: drug_id, type: string, source: system, description: "FK -> Drug.id; the drug this negotiated price covers" }
      - { name: manufacturer_id, type: string, source: system, description: "FK -> Manufacturer.id; the manufacturer offering the drug" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Negotiated per-unit acquisition cost in integer cents", constraints: "must be >= 1" }
      - { name: available_units, type: integer, source: input, description: "Units the manufacturer can supply now", constraints: "must be >= 0" }
      - { name: reliability_tier, type: enum, source: input, description: "A | B | C — supply-reliability grade", constraints: "enum values A, B, C" }
      - { name: packaging, type: string, source: input, description: "Packaging description for this manufacturer's presentation, e.g. 90-count bottle" }
      - { name: price_status, type: enum, source: system, description: "PROPOSED | ACTIVE | REVOKED — the price dimension", constraints: "enum values PROPOSED, ACTIVE, REVOKED; system-initialized to PROPOSED on create" }
      - { name: sourcing_status, type: enum, source: system, description: "SOURCED | UNDER_REVIEW | SUPPRESSED — the sourcing dimension", constraints: "enum values SOURCED, UNDER_REVIEW, SUPPRESSED; system-initialized to UNDER_REVIEW on create" }
      - { name: interval_days, type: integer, source: computed, description: "Shipment interval contributed by this row; a function of reliability_tier and available_units" }
      - { name: effective_per_unit_cents, type: integer, source: computed, description: "Reference-only per-unit figure used exclusively by the temporary order blend while a fallback source is attached to an order; never a sourcing-selection key" }

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Patient full name" }
      - { name: email, type: string, source: input, description: "Patient email address" }
      - { name: home_state_code, type: string, source: input, description: "Two-letter home state code of the patient" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", constraints: "enum values ACTIVE, SUSPENDED; system-initialized to ACTIVE on create" }

  - name: Prescriber
    parent: null
    common_fields: true
    fields:
      - { name: prescriber_name, type: string, source: input, description: "Prescriber full name" }
      - { name: npi, type: string, source: input, description: "National Provider Identifier" }
      - { name: license_state_code, type: string, source: input, description: "Two-letter state code where the prescriber is licensed" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", constraints: "enum values ACTIVE, SUSPENDED; system-initialized to ACTIVE on create" }

  - name: Prescription
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; the patient the prescription is written for" }
      - { name: prescriber_id, type: string, source: system, description: "FK -> Prescriber.id; the valid prescriber order" }
      - { name: drug_id, type: string, source: system, description: "FK -> Drug.id; the prescribed drug" }
      - { name: ship_state_code, type: string, source: input, description: "Two-letter destination state for shipment" }
      - { name: total_refills_authorized, type: integer, source: input, description: "Number of refills the prescriber authorized", constraints: "must be >= 0" }
      - { name: refills_consumed, type: integer, source: computed, description: "Number of refills already dispensed; starts at 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | INTAKE_REVIEW | ACTIVE | REJECTED | DEPLETED | TERMINATED", constraints: "enum values DRAFT, INTAKE_REVIEW, ACTIVE, REJECTED, DEPLETED, TERMINATED; system-initialized to DRAFT on create" }
      - { name: rejection_reason_code, type: string, source: system, description: "Populated only when status == REJECTED; null otherwise" }

  - name: PrescriptionRequest
    parent: Prescription
    common_fields: true
    fields:
      - { name: prescription_id, type: string, source: system, description: "FK -> Prescription.id; the prescription this intake request belongs to" }
      - { name: packaged_quantity, type: integer, source: input, description: "Packaged quantity associated with this intake attempt", constraints: "must be >= 1" }
      - { name: consumed_quantity, type: integer, source: system, description: "Quantity consumed by accepted fills; starts at 0, incremented on each shipment; used to restore capacity on rejection" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | ACCEPTED | REJECTED", constraints: "enum values SUBMITTED, UNDER_REVIEW, ACCEPTED, REJECTED; system-initialized to SUBMITTED on create" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: prescription_id, type: string, source: system, description: "FK -> Prescription.id; the prescription this order fills" }
      - { name: request_id, type: string, source: system, description: "FK -> PrescriptionRequest.id; the intake request whose capacity this order consumes" }
      - { name: pharmacy_id, type: string, source: system, description: "FK -> Pharmacy.id; the mail pharmacy selected for fulfilment" }
      - { name: quantity, type: integer, source: input, description: "Units dispensed", constraints: "must be >= 1" }
      - { name: ship_state_code, type: string, source: computed, description: "Destination two-letter state code copied from prescription.ship_state_code at order creation" }
      - { name: paid_at, type: datetime, source: system, description: "Server-stamped instant the order reached PAID; null until PAID. The shipment interval is measured from this instant" }
      - { name: status, type: enum, source: system, description: "CREATED | PAID | FULFILLING | SHIPPED | DELIVERED | CANCELED", constraints: "enum values CREATED, PAID, FULFILLING, SHIPPED, DELIVERED, CANCELED; system-initialized to CREATED on create" }
      - { name: source_price_id, type: string, source: system, description: "FK -> ManufacturerDrugPrice.id; the price row selected as the sourcing source at creation" }
      - { name: sub_source_price_id, type: string, source: system, description: "FK -> ManufacturerDrugPrice.id; the fallback price row selected when the primary row's sourcing_status leaves SOURCED" }
      - { name: acquisition_cost_cents, type: integer, source: computed, description: "Blended acquisition cost of the whole order, in integer cents" }
      - { name: is_blended_cost, type: boolean, source: computed, description: "True when the order blends the primary and fallback source prices rather than using one row" }
      - { name: primary_units, type: integer, source: computed, description: "Units sourced from source_price_id" }
      - { name: fallback_units, type: integer, source: computed, description: "Units sourced from sub_source_price_id" }
      - { name: markup_cents, type: integer, source: computed, description: "Fixed 15% markup on acquisition_cost_cents" }
      - { name: pharmacy_fee_cents, type: integer, source: computed, description: "Pharmacy dispensing fee in integer cents" }
      - { name: shipping_fee_cents, type: integer, source: computed, description: "Shipping fee in integer cents" }
      - { name: patient_price_cents, type: integer, source: computed, description: "Total patient price of the order in integer cents" }
      - { name: retail_reference_price_cents, type: integer, source: computed, description: "Snapshot of the drug's typical-retail reference price at order creation" }
      - { name: insured_reference_price_cents, type: integer, source: computed, description: "Snapshot of the drug's benefit-covered reference price at order creation" }

  - name: Shipment
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; the order being shipped" }
      - { name: request_id, type: string, source: system, description: "FK -> PrescriptionRequest.id; the intake request whose consumed capacity this shipment consumes" }
      - { name: shipment_seq, type: integer, source: system, description: "1-based sequence number of this shipment within the order" }
      - { name: status, type: enum, source: system, description: "PENDING | DISPATCHED | IN_TRANSIT | DELIVERED | RETURNED", constraints: "enum values PENDING, DISPATCHED, IN_TRANSIT, DELIVERED, RETURNED; system-initialized to PENDING on create" }
      - { name: dispatch_at, type: datetime, source: system, description: "Server-stamped dispatch instant; null until DISPATCHED" }
      - { name: delivery_at, type: datetime, source: system, description: "Server-stamped delivery instant; null until DELIVERED" }

  - name: Claim
    parent: Prescription
    common_fields: true
    fields:
      - { name: prescription_id, type: string, source: system, description: "FK -> Prescription.id; the prescription this refill authorization belongs to" }
      - { name: claim_seq, type: integer, source: system, description: "1-based sequence number of this refill authorization within the prescription" }
      - { name: status, type: enum, source: system, description: "PENDING | AUTHORIZED | SHIPPED | DENIED | CANCELED", constraints: "enum values PENDING, AUTHORIZED, SHIPPED, DENIED, CANCELED; system-initialized to PENDING on create" }
      - { name: reserved_quantity, type: integer, source: computed, description: "Packaged quantity this authorization holds against the drug's supply while not terminal" }
      - { name: denied_at, type: datetime, source: system, description: "Server-stamped denial instant; null unless DENIED" }
      - { name: denial_reason_code, type: string, source: system, description: "Populated only when status == DENIED; null otherwise" }

  - name: PriceComparison
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; the order whose prices are being compared" }
      - { name: typical_retail_price_cents, type: integer, source: computed, description: "Reference typical-retail price used for this comparison" }
      - { name: benefit_covered_price_cents, type: integer, source: computed, description: "Reference benefit-covered price used for this comparison" }
      - { name: substantiated, type: boolean, source: computed, description: "True when a matching enabled PriceSubstantiation exists for this order at the logical clock; starts false" }
      - { name: substantiation_digest, type: string, source: computed, description: "SHA-256 hex digest of the falsifiable comparison claim; null until substantiated" }
      - { name: status, type: enum, source: system, description: "UNSUBSTANTIATED | SUBSTANTIATED | BLOCKED", constraints: "enum values UNSUBSTANTIATED, SUBSTANTIATED, BLOCKED; system-initialized to UNSUBSTANTIATED on create" }
      - { name: state, type: enum, source: system, description: "FRESH | REFRESH_REQUIRED | STALE", constraints: "enum values FRESH, REFRESH_REQUIRED, STALE; system-initialized to FRESH on create" }
      - { name: stale_deadline_at, type: datetime, source: system, description: "Instant after which a comparison that has never been substantiated is BLOCKED; set to created_at + 30 days" }

  - name: PriceSubstantiation
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; the order whose comparison this record substantiates" }
      - { name: source_kind, type: enum, source: input, description: "RETAIL_SURVEY | BENEFIT_INDEX | MANUFACTURER_NOTICE", constraints: "enum values RETAIL_SURVEY, BENEFIT_INDEX, MANUFACTURER_NOTICE" }
      - { name: source_reference, type: string, source: input, description: "Citation reference for the substantiation source" }
      - { name: observed_at, type: datetime, source: input, description: "Instant the reference price was observed" }
      - { name: valid_until, type: datetime, source: input, description: "Instant after which this substantiation no longer supports a claim" }
      - { name: status, type: enum, source: system, description: "PENDING | ENABLED | DISABLED", constraints: "enum values PENDING, ENABLED, DISABLED; system-initialized to PENDING on create" }
# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Drug
    field: state
    initial_state: NON_FORMULARY
    terminal_states: [DELISTED]
    transitions:
      - from: NON_FORMULARY
        to: FORMULARY
        trigger: "POST /formularies/{drug_id}/expansion"
        actor: PharmacyOps
        preconditions:
          - "drug.sourcing_status == SOURCED"
          - "drug.state == NON_FORMULARY"
          - "drug.is_controlled == false"
          - "drug.demand_units_30d >= 1"
          - "drug.expansion_score >= 2"
          - "drug.supply_units >= drug.demand_units_30d"
        side_effects:
          - "Set drug.packaging to the packaging of the selected primary ManufacturerDrugPrice row"
          - "Recompute drug.effective_unit_cost_cents via calculation primary_source_cost"
          - "Recompute drug.ship_interval_days via calculation shipment_interval_days"
          - "Recompute drug.expansion_score via calculation expansion_score"
          - "Increment Drug.version by 1"

      - from: FORMULARY
        to: DELISTED
        trigger: "POST /formularies/{drug_id}/delist"
        actor: PharmacyOps
        preconditions:
          - "drug.state == FORMULARY"
        side_effects:
          - "Hop 1: set all ManufacturerDrugPrice rows for this drug to sourcing_status = SUPPRESSED"
          - "Hop 1: for each Order on this drug with status IN {CREATED, PAID, FULFILLING, SHIPPED}: set order.status = CANCELED, which is the Order state machine's own cancellation transition"
          - "Hop 2 (caused by hop 1, not by the delist itself): each cancelled order's cancellation cascade sets its Shipment.status = RETURNED"
          - "Hop 3 (caused by hop 2): each RETURNED shipment's cascade sets every Claim of its prescription with status IN {PENDING, AUTHORIZED} to status = DENIED with denial_reason_code = ORDER_CANCELED, denied_at = logical clock, reserved_quantity = 0"
          - "Hop 4 (caused by hop 3): the claim denials cause Drug.supply_units and Drug.sourcing_status to be recomputed via calculation sourcing_status"
          - "Increment Drug.version by 1"

  - entity: ManufacturerDrugPrice
    field: price_status x sourcing_status
    parallel_dimensions: [price_status, sourcing_status]
    parallel_dimension_note: >
      Activated and revoked transitions move the price_status dimension
      (PROPOSED/ACTIVE/REVOKED); sourcing transitions move the sourcing_status
      dimension (UNDER_REVIEW/SOURCED/SUPPRESSED). The two dimensions evolve
      independently on the same row and their state values are disjoint, so each
      transition's dimension is unambiguous.
    initial_state: "price_status=PROPOSED x sourcing_status=UNDER_REVIEW"
    terminal_states: [REVOKED, SUPPRESSED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /manufacturer-drug-prices/{price_id}/activation"
        actor: PharmacyOps
        preconditions:
          - "price.price_status == PROPOSED"
          - "manufacturer.status == ACTIVE"
        side_effects:
          - "Recompute drug.sourcing_status via calculation sourcing_status"
          - "Recompute drug.supply_units via calculation sourcing_status"
          - "Recompute drug.effective_unit_cost_cents via calculation primary_source_cost"
          - "Recompute drug.ship_interval_days via calculation shipment_interval_days"
          - "Recompute drug.expansion_score via calculation expansion_score"
          - "Increment ManufacturerDrugPrice.version by 1 and Drug.version by 1"

      - from: ACTIVE
        to: REVOKED
        trigger: "POST /manufacturer-drug-prices/{price_id}/revocation"
        actor: PharmacyOps
        preconditions:
          - "price.price_status == ACTIVE"
        side_effects:
          - "Set price.sourcing_status = SUPPRESSED"
          - "Recompute drug.sourcing_status via calculation sourcing_status"
          - "Recompute drug.supply_units via calculation sourcing_status"
          - "Recompute drug.effective_unit_cost_cents via calculation primary_source_cost"
          - "Recompute drug.ship_interval_days via calculation shipment_interval_days"
          - "Recompute drug.expansion_score via calculation expansion_score"
          - "Increment ManufacturerDrugPrice.version by 1 and Drug.version by 1"

      - from: UNDER_REVIEW
        to: SOURCED
        trigger: "POST /manufacturer-drug-prices/{price_id}/sourcing"
        actor: PharmacyOps
        preconditions:
          - "price.sourcing_status == UNDER_REVIEW"
          - "price.price_status == ACTIVE"
          - "price.available_units > 0"
          - "manufacturer.status == ACTIVE"
        side_effects:
          - "Recompute drug.sourcing_status via calculation sourcing_status"
          - "Recompute drug.supply_units via calculation sourcing_status"
          - "Recompute drug.effective_unit_cost_cents via calculation primary_source_cost"
          - "Recompute drug.ship_interval_days via calculation shipment_interval_days"
          - "Recompute drug.expansion_score via calculation expansion_score"
          - "Recompute drug.packaging via calculation primary_source_cost"
          - "Increment ManufacturerDrugPrice.version by 1 and Drug.version by 1"

      - from: SOURCED
        to: UNDER_REVIEW
        trigger: "POST /manufacturer-drug-prices/{price_id}/sourcing"
        actor: PharmacyOps
        preconditions:
          - "price.sourcing_status == SOURCED"
        side_effects:
          - "For each Order carrying this price as source_price_id with status IN {CREATED, PAID, FULFILLING}: recompute Order.acquisition_cost_cents, Order.markup_cents, Order.patient_price_cents via calculation order_price"
          - "Recompute drug.sourcing_status via calculation sourcing_status"
          - "Recompute drug.supply_units via calculation sourcing_status"
          - "Recompute drug.effective_unit_cost_cents via calculation primary_source_cost"
          - "Recompute drug.expansion_score via calculation expansion_score"
          - "If drug.state == FORMULARY and drug.sourcing_status != SOURCED: set drug.state = DELISTED; set all ManufacturerDrugPrice rows for drug to SUPPRESSED; for each Order on drug with status IN {CREATED, PAID} set status = CANCELED; for each Shipment of those orders with status IN {PENDING, DISPATCHED} set status = RETURNED; for each Claim of those orders with status IN {PENDING, AUTHORIZED} set status = DENIED with denial_reason_code = SOURCING_LOST, reserved_quantity = 0; recompute drug.sourcing_status"
          - "Increment ManufacturerDrugPrice.version by 1 and Drug.version by 1"

      - from: SOURCED
        to: SUPPRESSED
        trigger: "system — manufacturer.status becomes SUSPENDED"
        actor: system
        preconditions:
          - "price.sourcing_status == SOURCED"
          - "manufacturer.status == SUSPENDED"
        side_effects:
          - "Same cascade as SOURCED → UNDER_REVIEW, applied unconditionally"

  - entity: PharmacyLicense
    field: status
    initial_state: PENDING
    terminal_states: [EXPIRED, REVOKED, SUPERSEDED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /pharmacies/{pharmacy_id}/licenses/{license_id}/verification"
        actor: PharmacyOps
        preconditions:
          - "license.status == PENDING"
          - "license.expiry_at > logical clock"
        side_effects:
          - "Set license.verified_at = logical clock"
          - "Increment PharmacyLicense.version by 1"

      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /pharmacies/{pharmacy_id}/licenses/{license_id}/verification"
        actor: PharmacyOps
        preconditions:
          - "license.status == ACTIVE"
          - "license.expiry_at <= logical clock"
        side_effects:
          - "Increment PharmacyLicense.version by 1"

      - from: ACTIVE
        to: REVOKED
        trigger: "POST /pharmacies/{pharmacy_id}/licenses/{license_id}/state"
        actor: PharmacyOps
        preconditions:
          - "license.status == ACTIVE"
        side_effects:
          - "Increment PharmacyLicense.version by 1"

      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /pharmacies/{pharmacy_id}/licenses"
        actor: PharmacyOps
        preconditions:
          - "A licence with status == ACTIVE already exists for the same pair (pharmacy_id, state_code)"
          - "The new licence's state_code equals this licence's state_code"
        side_effects:
          - "Set the prior licence.status = SUPERSEDED"
          - "Increment the prior PharmacyLicense.version by 1"
          - "The newly created licence starts at status = PENDING"

      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /pharmacies/{pharmacy_id}/licenses/{license_id}/verification"
        actor: PharmacyOps
        preconditions:
          - "license.status == EXPIRED"
          - "license.expiry_at > logical clock"
        side_effects:
          - "Set license.verified_at = logical clock"
          - "Increment PharmacyLicense.version by 1"

      - from: REVOKED
        to: ACTIVE
        trigger: "POST /pharmacies/{pharmacy_id}/licenses/{license_id}/verification"
        actor: PharmacyOps
        preconditions:
          - "license.status == REVOKED"
          - "license.expiry_at > logical clock"
        side_effects:
          - "Set license.verified_at = logical clock"
          - "Increment PharmacyLicense.version by 1"

  - entity: Prescription
    field: status
    initial_state: DRAFT
    terminal_states: [REJECTED, DEPLETED, TERMINATED]
    transitions:
      - from: DRAFT
        to: INTAKE_REVIEW
        trigger: "POST /prescriptions/{prescription_id}/intake-requests"
        actor: PharmacyOps
        preconditions:
          - "prescription.status == DRAFT"
          - "the Prescriber referenced by prescription.prescriber_id exists"
          - "prescriber.status == ACTIVE"
          - "the Drug referenced by prescription.drug_id exists"
        side_effects:
          - "Create a PrescriptionRequest with status = SUBMITTED, packaged_quantity = request quantity, consumed_quantity = 0"

      - from: INTAKE_REVIEW
        to: ACTIVE
        trigger: "POST /prescription-requests/{request_id}/acceptance"
        actor: Pharmacist
        preconditions:
          - "request.status == UNDER_REVIEW"
          - "prescription.status == INTAKE_REVIEW"
          - "a fill capacity remains: the prescription has not yet reached its packaged quantity"
        side_effects:
          - "Set prescription.status = ACTIVE"
          - "Increment Prescription.version by 1"
          - "Create the first Claim for the prescription with claim_seq = 1 and status = PENDING"

      - from: INTAKE_REVIEW
        to: REJECTED
        trigger: "POST /prescription-requests/{request_id}/rejection"
        actor: Pharmacist
        preconditions:
          - "request.status == UNDER_REVIEW"
          - "prescription.status == INTAKE_REVIEW"
        side_effects:
          - "Set prescription.status = REJECTED and prescription.rejection_reason_code = the supplied reason code"
          - "Set request.status = REJECTED"
          - "Restore the drug's claim-active reserved quantity exactly: decrement the drug's reserved-total by the request's consumed_quantity and set request.consumed_quantity = 0"
          - "Increment Prescription.version by 1 and PrescriptionRequest.version by 1"

      - from: ACTIVE
        to: DEPLETED
        trigger: "system — prescription.refills_consumed reaches prescription.total_refills_authorized"
        actor: system
        preconditions:
          - "prescription.status == ACTIVE"
          - "prescription.refills_consumed >= prescription.total_refills_authorized"
        side_effects:
          - "Set any Claim of this prescription with status IN {PENDING, AUTHORIZED, SHIPPED} to status = CANCELED and reserved_quantity = 0 (SHIPPED claims are cancelable from DEPLETED because their shipment has already left; DELIVERED is not a Claim state)"
          - "Increment Prescription.version by 1"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /prescriptions/{prescription_id}/termination"
        actor: Pharmacist
        preconditions:
          - "prescription.status == ACTIVE"
          - "no Claim of this prescription has status IN {PENDING, AUTHORIZED, SHIPPED}"
        side_effects:
          - "Increment Prescription.version by 1"

  - entity: PrescriptionRequest
    field: status
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /prescription-requests/{request_id}/review"
        actor: Pharmacist
        preconditions:
          - "request.status == SUBMITTED"
        side_effects:
          - "Increment PrescriptionRequest.version by 1"

      - from: UNDER_REVIEW
        to: ACCEPTED
        trigger: "POST /prescription-requests/{request_id}/acceptance"
        actor: Pharmacist
        preconditions:
          - "request.status == UNDER_REVIEW"
          - "prescription.status == INTAKE_REVIEW"
          - "request.consumed_quantity + prescription.packaged_quantity does not exceed the prescription's remaining fill capacity"
        side_effects:
          - "Set prescription.status = ACTIVE"
          - "Increment Prescription.version by 1"
          - "Create the first Claim for the prescription with claim_seq = 1 and status = PENDING"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /prescription-requests/{request_id}/rejection"
        actor: Pharmacist
        preconditions:
          - "request.status == UNDER_REVIEW"
          - "prescription.status == INTAKE_REVIEW"
        side_effects:
          - "Set prescription.status = REJECTED and prescription.rejection_reason_code = the supplied reason code"
          - "Restore the drug's claim-active reserved quantity exactly: decrement the drug's reserved-total by the request's consumed_quantity and set request.consumed_quantity = 0"
          - "Increment Prescription.version by 1 and PrescriptionRequest.version by 1"

  - entity: Order
    field: status
    initial_state: CREATED
    terminal_states: [DELIVERED, CANCELED]
    transitions:
      - from: CREATED
        to: PAID
        trigger: "POST /orders/{order_id}/payment"
        actor: PharmacyOps
        preconditions:
          - "order.status == CREATED"
          - "drug.state == FORMULARY"
          - "prescription.status == ACTIVE"
          - "the selected primary ManufacturerDrugPrice row has sourcing_status == SOURCED"
          - "request.status == ACCEPTED"
        side_effects:
          - "Recompute order.acquisition_cost_cents via calculation order_price"
          - "Recompute order.markup_cents via calculation order_price"
          - "Recompute order.pharmacy_fee_cents via calculation order_price"
          - "Recompute order.shipping_fee_cents via calculation order_price"
          - "Recompute order.patient_price_cents via calculation order_price"
          - "Increment Order.version by 1"

      - from: PAID
        to: FULFILLING
        trigger: "POST /orders/{order_id}/fulfillment"
        actor: PharmacyOps
        preconditions:
          - "order.status == PAID"
          - "logical clock >= the shipment interval boundary for this order"
        side_effects:
          - "Create a Shipment with shipment_seq = the next sequence number, status = PENDING"
          - "Increment the referenced PrescriptionRequest.consumed_quantity by min(order.quantity, request.packaged_quantity)"
          - "Increment PrescriptionRequest.version by 1"
          - "Increment Order.version by 1"

      - from: FULFILLING
        to: SHIPPED
        trigger: "POST /orders/{order_id}/shipping"
        actor: PharmacyOps
        preconditions:
          - "order.status == FULFILLING"
          - "the drug's carrier slot for the dispatch calendar day, together with its one-day quarantine buffer, does not already carry two shipments (ERR_SHIP_SLOT_CONFLICT)"
          - "the Order's selected Pharmacy exists"
          - "order.ship_state_code is covered by a PharmacyLicense with status == ACTIVE for that pharmacy"
          - "pharmacy.shipping_enabled == true"
          - "drug.is_controlled == false"
          - "the order's Shipment exists with status in {PENDING, DISPATCHED}"
        note: "Admission is governed by calculation ship_slot_capacity: the dispatch day and its one-day quarantine buffer must each carry fewer than two shipments of this drug (ERR_SHIP_SLOT_CONFLICT)."
        side_effects:
          - "Consume one unit of the drug's carrier slot on the dispatch calendar day and on the preceding buffer day, per calculation ship_slot_capacity"
          - "Set the Shipment.status = DISPATCHED and shipment.dispatch_at = logical clock"
          - "Set all Claims of this prescription with status IN {PENDING, AUTHORIZED} to status = SHIPPED, denied_at = null, denial_reason_code = null"
          - "Recompute drug.supply_units via calculation sourcing_status"
          - "Recompute Prescription.version by 1"
          - "Increment Shipment.version by 1 and Order.version by 1"

      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /orders/{order_id}/delivery"
        actor: PharmacyOps
        preconditions:
          - "order.status == SHIPPED"
          - "the Shipment exists with status IN {DISPATCHED, IN_TRANSIT}"
        side_effects:
          - "Set the Shipment.status = DELIVERED and shipment.delivery_at = logical clock"
          - "Increment prescription.refills_consumed by 1"
          - "Hop 2 of the delivery cascade: when refills_consumed now reaches total_refills_authorized, the prescription's own exhausted-budget transition fires, driving status ACTIVE -> DEPLETED and canceling every Claim of the prescription with status IN {PENDING, AUTHORIZED, SHIPPED}"
          - "Increment Drug.version by 1"
          - "Increment Shipment.version by 1 and Order.version by 1"

      - from: CREATED
        to: CANCELED
        trigger: "POST /orders/{order_id}/cancellation"
        actor: PharmacyOps
        preconditions:
          - "order.status == CREATED"
        side_effects:
          - "Increment Order.version by 1"

      - from: PAID
        to: CANCELED
        trigger: "POST /orders/{order_id}/cancellation"
        actor: PharmacyOps
        preconditions:
          - "order.status == PAID"
          - "no Shipment for this order has status == DISPATCHED"
        side_effects:
          - "Restore the referenced PrescriptionRequest.consumed_quantity by min(order.quantity, request.packaged_quantity)"
          - "Restore the request's reserved quantity against the drug's supply"
          - "For each Shipment of this order with status IN {PENDING, DISPATCHED}: set shipment.status = RETURNED, which runs the shipment's own cascade"
          - "Increment PrescriptionRequest.version by 1 and Order.version by 1"

      - from: FULFILLING
        to: CANCELED
        trigger: "POST /orders/{order_id}/cancellation"
        actor: PharmacyOps
        preconditions:
          - "order.status == FULFILLING"
          - "the order's Shipment is not DISPATCHED"
        side_effects:
          - "Set the order's Shipment.status = RETURNED, which runs the shipment's own cascade"
          - "Restore the referenced PrescriptionRequest.consumed_quantity by min(order.quantity, request.packaged_quantity)"
          - "Increment PrescriptionRequest.version by 1, Shipment.version by 1, and Order.version by 1"

      - from: SHIPPED
        to: CANCELED
        trigger: "POST /orders/{order_id}/cancellation"
        actor: PharmacyOps
        preconditions:
          - "order.status == SHIPPED"
          - "no Shipment for this order has status == DELIVERED"
        side_effects:
          - "Set the order's Shipment.status = RETURNED, which runs the shipment's own cascade"
          - "Increment Shipment.version by 1 and Order.version by 1"

  - entity: Shipment
    field: status
    initial_state: PENDING
    terminal_states: [DELIVERED, RETURNED]
    transitions:
      - from: PENDING
        to: DISPATCHED
        trigger: "POST /orders/{order_id}/shipping"
        actor: PharmacyOps
        preconditions:
          - "shipment.status == PENDING"
          - "the parent Order.status == FULFILLING"
        side_effects:
          - "Set shipment.dispatch_at = logical clock"

      - from: DISPATCHED
        to: IN_TRANSIT
        trigger: "system — carrier scan event"
        actor: system
        preconditions:
          - "shipment.status == DISPATCHED"
        side_effects:
          - "Increment Shipment.version by 1"

      - from: DISPATCHED
        to: DELIVERED
        trigger: "POST /orders/{order_id}/delivery"
        actor: PharmacyOps
        preconditions:
          - "shipment.status == DISPATCHED"
          - "the parent Order.status == SHIPPED"
        side_effects:
          - "Set shipment.delivery_at = logical clock"
          - "Increment prescription.refills_consumed by 1"
          - "Recompute drug.demand_units_30d via calculation demand_30d"
          - "Hop 2 of the delivery cascade: recompute Drug.expansion_score via calculation expansion_score"
          - "Increment Shipment.version by 1 and Drug.version by 1"

      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /orders/{order_id}/delivery"
        actor: PharmacyOps
        preconditions:
          - "shipment.status == IN_TRANSIT"
          - "the parent Order.status == SHIPPED"
        side_effects:
          - "Set shipment.delivery_at = logical clock"
          - "Increment prescription.refills_consumed by 1"
          - "Recompute drug.demand_units_30d via calculation demand_30d"
          - "Hop 2 of the delivery cascade: recompute Drug.expansion_score via calculation expansion_score"
          - "Increment Shipment.version by 1 and Drug.version by 1"

      - from: PENDING
        to: RETURNED
        trigger: "the parent Order's cancellation cascade"
        actor: system
        preconditions:
          - "shipment.status == PENDING"
          - "the parent Order.status == CANCELED"
        side_effects:
          - "Hop 3: set every Claim of the shipment's prescription with status IN {PENDING, AUTHORIZED} to status = DENIED, denial_reason_code = ORDER_CANCELED, denied_at = logical clock, reserved_quantity = 0"
          - "Increment Shipment.version by 1"

      - from: DISPATCHED
        to: RETURNED
        trigger: "the parent Order's cancellation cascade, or an operation on a DELISTED drug"
        actor: system
        preconditions:
          - "shipment.status == DISPATCHED"
          - "the parent Order.status == CANCELED, or the shipment's drug has state == DELISTED"
        side_effects:
          - "Hop 3: set every Claim of the shipment's prescription with status IN {PENDING, AUTHORIZED} to status = DENIED, denial_reason_code = ORDER_CANCELED, denied_at = logical clock, reserved_quantity = 0"
          - "Increment Shipment.version by 1"

  - entity: Claim
    field: status
    initial_state: PENDING
    terminal_states: [DENIED, CANCELED]
    transitions:
      - from: PENDING
        to: AUTHORIZED
        trigger: "POST /claims/{claim_id}/refill-authorizations"
        actor: Pharmacist
        preconditions:
          - "claim.status == PENDING"
          - "prescription.status == ACTIVE"
          - "prescription.refills_consumed < prescription.total_refills_authorized"
          - "drug.sourcing_status == SOURCED"
          - "drug.supply_units >= the order's requested quantity"
        side_effects:
          - "Set claim.reserved_quantity to the order's quantity consumed from drug.supply_units"
          - "Recompute drug.supply_units via calculation sourcing_status"
          - "Increment Claim.version by 1 and Drug.version by 1"

      - from: AUTHORIZED
        to: SHIPPED
        trigger: "POST /orders/{order_id}/shipping"
        actor: PharmacyOps
        preconditions:
          - "claim.status == AUTHORIZED"
          - "the order's Shipment reaches DISPATCHED"
        side_effects:
          - "Set claim.reserved_quantity = 0"
          - "Recompute drug.supply_units via calculation sourcing_status"
          - "Recompute drug.demand_units_30d via calculation demand_30d"
          - "Increment Claim.version by 1 and Drug.version by 1"

      - from: PENDING
        to: DENIED
        trigger: "POST /claims/{claim_id}/refill-authorizations, or a shipment returning"
        actor: Pharmacist
        preconditions:
          - "claim.status == PENDING"
          - "prescription.refills_consumed >= prescription.total_refills_authorized, or the claim's shipment returned"
        side_effects:
          - "Set claim.denied_at = logical clock and claim.denial_reason_code = REFILLS_EXHAUSTED or ORDER_CANCELED"
          - "Set claim.reserved_quantity = 0"
          - "Hop 4: recompute Drug.supply_units and Drug.sourcing_status via calculation sourcing_status"
          - "Increment Claim.version by 1 and Drug.version by 1"

      - from: PENDING
        to: DENIED
        trigger: "POST /claims/{claim_id}/refill-authorizations"
        actor: Pharmacist
        preconditions:
          - "claim.status == PENDING"
          - "drug.sourcing_status != SOURCED"
        side_effects:
          - "Set claim.denied_at = logical clock and claim.denial_reason_code = SOURCING_UNAVAILABLE"
          - "Set claim.reserved_quantity = 0"
          - "Set drug.expansion_score = null via calculation expansion_score when demand_units_30d > supply_units"
          - "Increment Claim.version by 1 and Drug.version by 1"

      - from: PENDING
        to: DENIED
        trigger: "POST /claims/{claim_id}/refill-authorizations"
        actor: Pharmacist
        preconditions:
          - "claim.status == PENDING"
          - "drug.state == DELISTED"
        side_effects:
          - "Set claim.denied_at = logical clock and claim.denial_reason_code = DRUG_DELISTED"
          - "Set claim.reserved_quantity = 0"
          - "Increment Claim.version by 1"

      - from: PENDING
        to: DENIED
        trigger: "POST /claims/{claim_id}/refill-authorizations"
        actor: Pharmacist
        preconditions:
          - "claim.status == PENDING"
          - "drug.supply_units < the order's requested quantity"
        side_effects:
          - "Set claim.denied_at = logical clock and claim.denial_reason_code = SUPPLY_SHORTFALL"
          - "Set claim.reserved_quantity = 0"
          - "Increment Claim.version by 1"

      - from: PENDING
        to: CANCELED
        trigger: "system — the prescription reaches DEPLETED"
        actor: system
        preconditions:
          - "claim.status == PENDING"
          - "prescription.status == DEPLETED"
        side_effects:
          - "Set claim.reserved_quantity = 0"

      - from: AUTHORIZED
        to: CANCELED
        trigger: "system — the prescription reaches DEPLETED"
        actor: system
        preconditions:
          - "claim.status == AUTHORIZED"
          - "prescription.status == DEPLETED"
        side_effects:
          - "Set claim.reserved_quantity = 0"
          - "Recompute drug.supply_units via calculation sourcing_status"

  - entity: PriceComparison
    field: state
    initial_state: FRESH
    terminal_states: [BLOCKED]
    transitions:
      - from: FRESH
        to: REFRESH_REQUIRED
        trigger: "system — the order's drug was substituted to a different drug"
        actor: system
        preconditions:
          - "comparison.state == FRESH"
          - "the order's drug_id changed"
        side_effects:
          - "Increment PriceComparison.version by 1 and Order.version by 1"

      - from: REFRESH_REQUIRED
        to: FRESH
        trigger: "POST /orders/{order_id}/comparisons/{comparison_id}/refresh"
        actor: PharmacyOps
        preconditions:
          - "comparison.state == REFRESH_REQUIRED"
          - "a PriceSubstantiation for this order exists with status == ENABLED and valid_until > logical clock"
        side_effects:
          - "Copy the order's current retail_reference_price_cents and insured_reference_price_cents into the comparison"
          - "Set comparison.substantiated = true"
          - "Set comparison.substantiation_digest to the SHA-256 hex digest of the falsifiable comparison claim"
          - "Set comparison.status = SUBSTANTIATED"
          - "Recompute comparison.state via calculation comparison_lifecycle"
          - "Increment PriceComparison.version by 1"

      - from: FRESH
        to: STALE
        trigger: "system — logical clock evaluation"
        actor: system
        preconditions:
          - "comparison.state == FRESH"
          - "every PriceSubstantiation for this order has valid_until <= logical clock"
        side_effects:
          - "Set comparison.substantiated = false and comparison.substantiation_digest = null"
          - "Increment PriceComparison.version by 1"

      - from: REFRESH_REQUIRED
        to: BLOCKED
        trigger: "system — logical clock evaluation"
        actor: system
        preconditions:
          - "comparison.state == REFRESH_REQUIRED"
          - "logical clock > stale_deadline_at"
        side_effects:
          - "Set comparison.substantiated = false and comparison.substantiation_digest = null"
          - "Increment PriceComparison.version by 1"

      - from: STALE
        to: FRESH
        trigger: "POST /orders/{order_id}/comparisons/{comparison_id}/refresh"
        actor: PharmacyOps
        preconditions:
          - "comparison.state == STALE"
          - "a PriceSubstantiation for this order exists with status == ENABLED and valid_until > logical clock"
        side_effects:
          - "Copy the order's current retail_reference_price_cents and insured_reference_price_cents into the comparison"
          - "Set comparison.substantiated = true"
          - "Set comparison.substantiation_digest to the SHA-256 hex digest of the falsifiable comparison claim"
          - "Set comparison.status = SUBSTANTIATED"
          - "Recompute comparison.state via calculation comparison_lifecycle"
          - "Increment PriceComparison.version by 1"

      - from: BLOCKED
        to: FRESH
        trigger: "POST /orders/{order_id}/comparisons/{comparison_id}/refresh"
        actor: PharmacyOps
        preconditions:
          - "comparison.state == BLOCKED"
          - "a PriceSubstantiation for this order exists with status == ENABLED and valid_until > logical clock"
        side_effects:
          - "Copy the order's current retail_reference_price_cents and insured_reference_price_cents into the comparison"
          - "Set comparison.substantiated = true"
          - "Set comparison.substantiation_digest to the SHA-256 hex digest of the falsifiable comparison claim"
          - "Set comparison.status = SUBSTANTIATED"
          - "Recompute comparison.state via calculation comparison_lifecycle"
          - "Increment PriceComparison.version by 1"

  - entity: PriceSubstantiation
    field: status
    initial_state: PENDING
    terminal_states: [DISABLED]
    transitions:
      - from: PENDING
        to: ENABLED
        trigger: "POST /orders/{order_id}/substantiation-enablement"
        actor: PharmacyOps
        preconditions:
          - "substantiation.status == PENDING"
          - "substantiation.valid_until > logical clock"
          - "substantiation.observed_at <= logical clock"
          - "the order's PriceComparison.state is FRESH, REFRESH_REQUIRED, or STALE"
        side_effects:
          - "Set the order's PriceComparison.substantiated = true"
          - "Set the order's PriceComparison.substantiation_digest to the SHA-256 hex digest of the falsifiable comparison claim"
          - "Set the order's PriceComparison.status = SUBSTANTIATED"
          - "Recompute the order's PriceComparison.state via calculation comparison_lifecycle"
          - "Increment PriceSubstantiation.version by 1 and PriceComparison.version by 1"

      - from: ENABLED
        to: DISABLED
        trigger: "POST /orders/{order_id}/substantiation-disablement"
        actor: PharmacyOps
        preconditions:
          - "substantiation.status == ENABLED"
        side_effects:
          - "Recompute the order's PriceComparison.state via calculation comparison_lifecycle"
          - "Set the order's PriceComparison.substantiated = false and substantiation_digest = null when no other ENABLED substantiation remains with valid_until > logical clock"
          - "Increment PriceSubstantiation.version by 1 and PriceComparison.version by 1"

      - from: PENDING
        to: DISABLED
        trigger: "system — substantive record superseded before enablement"
        actor: system
        preconditions:
          - "substantiation.status == PENDING"
          - "logical clock > substantiation.valid_until"
        side_effects:
          - "Increment PriceSubstantiation.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: order-fulfillment-stale-order-version
    parent_entity: Order
    write_endpoint: "POST /orders/{order_id}/fulfillment"
    occ_field: "expected_order_version"
    description: |
      Creating a Shipment under an Order whose version has advanced since the client
      last observed it is rejected. This captures the case where another writer has
      just advanced the order — a payment recompute or a cancellation — so the
      client's view of the order, and therefore of which shipment interval and which
      source price the shipment should consume, is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: substantiation-create-stale-order-version
    parent_entity: Order
    write_endpoint: "POST /orders/{order_id}/substantiation-enablement"
    occ_field: "expected_order_version"
    description: |
      Enabling a PriceSubstantiation against an Order whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has just substituted the order's drug and driven its comparison
      to REFRESH_REQUIRED, so the client's view of which comparison figures are being
      substantiated is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# All money is integer cents. Every rounding step is "round half up to the
# nearest cent" and is applied at the pinned step named in each formula.
# =============================================================================
calculations:

  - name: primary_source_cost
    trigger: "GET /formularies/{id}/stock-check, and every time POST /manufacturer-drug-prices/{id}/activation, POST /manufacturer-drug-prices/{id}/sourcing or POST /manufacturer-drug-prices/{id}/revocation runs"
    algorithm: aggregation
    formula: |
      Used by GET /formularies/{drug_id}/stock-check and written to Drug.effective_unit_cost_cents.

      OVERVIEW variant (the base): the sourcing-effective per-unit cost is the
      available_units-weighted average over the primary-source candidate pool:
        eligible = every ManufacturerDrugPrice row p where
                   p.drug_id == drug.id
                   AND p.price_status == ACTIVE
                   AND p.sourcing_status == SOURCED
                   AND p.manufacturer.status == ACTIVE
        if eligible is empty:
          effective_unit_cost_cents = null
        else:
          effective_unit_cost_cents = round_half_up(
              sum(p.unit_cost_cents * p.available_units for p in eligible)
              / sum(p.available_units for p in eligible))

      DETAIL variant (variant "lowest_available_per_unit"): the per-unit cost is
      the single lowest unit_cost_cents in the eligible pool:
        effective_unit_cost_cents = min(p.unit_cost_cents for p in eligible)

      The two variants diverge whenever the eligible pool holds more than one row
      and the cheapest row is not also the largest holder of available units.

      packaging side effect: drug.packaging is set to the packaging string of the
      row that the OVERVIEW variant selected as primary, defined as the eligible
      row with the lowest unit_cost_cents; ties break on available_units DESC,
      then created_at ASC. When the eligible pool is empty, packaging is left
      unchanged.
    input_set: >
      ManufacturerDrugPrice rows for the drug with price_status == ACTIVE AND
      sourcing_status == SOURCED, whose Manufacturer has status == ACTIVE. Rows in
      price_status PROPOSED or REVOKED, and rows in sourcing_status UNDER_REVIEW or
      SUPPRESSED, are excluded. Suspended manufacturers' rows are excluded.
    constants:
      MARKUP_RATE: 0.15
    precision: "integer cents, round_half_up at the final single division; no per-row rounding"
    variants:
      - name: overview_weighted_average
        when: "GET /formularies/{drug_id}/stock-check"
        difference: "available_units-weighted average over the whole eligible pool"
      - name: lowest_available_per_unit
        when: "the single-cheapest-source view a patient sees before an order is created"
        difference: "min unit_cost_cents over the eligible pool; differs from the weighted average whenever the cheapest holder is not the largest holder"
    worked_examples:
      - "Pool {M1 12c x 500u, M2 20c x 100u}: OVERVIEW = round_half_up((6000 + 2000)/600) = round_half_up(13.333) = 13; DETAIL = 12. The two variants differ by 1 cent."
      - "Single-row pool {M1 12c x 500u}: both variants = 12."
      - "Empty eligible pool (all rows PROPOSED): effective_unit_cost_cents = null."

  - name: shipment_interval_days
    trigger: "POST /formularies/{id}/expansion, POST /formularies/{id}/delist, POST /manufacturer-drug-prices/{id}/activation, POST /manufacturer-drug-prices/{id}/sourcing or POST /manufacturer-drug-prices/{id}/revocation"
    algorithm: tiered_pricing
    formula: |
      Sequential, not independent: compute the per-row interval, then take the max
      (the max is over integers, so no tie-break is required — equal intervals
      yield the same value whichever row supplies it).
        per_row_interval(p) =
            base(p.reliability_tier) + availability_adjustment(p.available_units)
        base(A) = 7 ; base(B) = 14 ; base(C) = 21
        availability_adjustment(u) =
            -7  if u >= 200
             0  if u >= 50
           +14  otherwise
        ship_interval_days = max(per_row_interval(p) for p in eligible pool)
      where the eligible pool is the same pool primary_source_cost uses
      (price_status == ACTIVE AND sourcing_status == SOURCED AND manufacturer ACTIVE).
      When the eligible pool is empty, ship_interval_days = null and no shipment
      may be created.
    input_set: "same eligible pool as primary_source_cost; rows are processed individually before the max"
    constants:
      BASE_A: 7
      BASE_B: 14
      BASE_C: 21
      ADJ_UNITS_GE_200: -7
      ADJ_UNITS_GE_50: 0
      ADJ_UNITS_LT_50: 14
    precision: "integer days, no rounding"
    variants:
      - name: evaluated_on_full_pool
        when: "day-to-day formulary stock checks"
        difference: "max over every eligible row"
    worked_examples:
      - "Pool {A 500u}: 7 + (-7) = 0 days."
      - "Pool {B 600u}: 14 + (-7) = 7 days."
      - "Pool {C 600u}: 21 + (-7) = 14 days."
      - "Pool {A 500u, B 600u}: max(0, 7) = 7 days."
      - "Pool {C 49u}: 21 + 14 = 35 days."

  - name: order_price
    trigger: "POST /orders/{order_id}/payment; and every time an Order's source_price_id row changes price_status or sourcing_status while the order is in CREATED, PAID, or FULFILLING"
    algorithm: tiered_pricing
    formula: |
      Step 1 — blend the acquisition cost (fallback only attaches when the primary
      row cannot cover the whole quantity):
        source = the row referenced by order.source_price_id
        fallback = the row referenced by order.sub_source_price_id
        if fallback is null OR source.available_units >= order.quantity:
            order.primary_units  = order.quantity
            order.fallback_units = 0
            order.is_blended_cost = false
            blended_cents = source.unit_cost_cents * order.quantity
        else:
            order.primary_units  = source.available_units
            order.fallback_units = order.quantity - source.available_units
            order.is_blended_cost = true
            blended_cents = source.unit_cost_cents * order.primary_units
                          + fallback.unit_cost_cents * order.fallback_units
        order.acquisition_cost_cents = round_half_up(blended_cents / order.quantity)

      Step 2 — construct the price from the acquisition cost produced by step 1.
      The shipping waiver is a test-on-the-provisional rule and MUST be evaluated in
      exactly this order, with exactly one re-assembly:
        provisional_cents = round_half_up(order.acquisition_cost_cents * 0.15)
                            + order.acquisition_cost_cents
                            + PHARMACY_FEE_CENTS
                            + SHIPPING_FEE_CENTS
        order.markup_cents = round_half_up(order.acquisition_cost_cents * 0.15)
        order.pharmacy_fee_cents = PHARMACY_FEE_CENTS
        order.shipping_fee_cents = 0 if provisional_cents >= FREE_SHIPPING_THRESHOLD_CENTS else SHIPPING_FEE_CENTS

      Step 3 — assemble the FINAL price with the settled shipping fee, so the waived
      fee is genuinely absent from the total:
        order.patient_price_cents = order.acquisition_cost_cents
                                  + order.markup_cents
                                  + order.pharmacy_fee_cents
                                  + order.shipping_fee_cents
      The two possible outcomes are therefore exactly:
        provisional < 1500  -> shipping_fee_cents = 500, patient_price_cents = provisional
        provisional >= 1500 -> shipping_fee_cents = 0,   patient_price_cents = provisional - 500
      patient_price_cents is never re-tested against the threshold after the waiver,
      so waiving shipping can never reinstate it.
    input_set: >
      order.quantity, order.source_price_id, order.sub_source_price_id, and the
      unit_cost_cents / available_units of those two rows. Reference prices are
      snapshotted from the drug, never recomputed here.
    constants:
      MARKUP_RATE: 0.15
      PHARMACY_FEE_CENTS: 800
      SHIPPING_FEE_CENTS: 500
      FREE_SHIPPING_THRESHOLD_CENTS: 1500
    precision: "two rounding sites, in order: acquisition_cost_cents first (round_half_up on the blend division), then markup_cents (round_half_up on acquisition * 0.15). patient_price_cents is an exact integer sum, never re-rounded"
    variants:
      - name: single_source
        when: "the order's source_price_id row has available_units >= order.quantity"
        difference: "acquisition_cost_cents == source.unit_cost_cents * quantity exactly; is_blended_cost == false"
      - name: blended_source
        when: "the order's source_price_id row has available_units < order.quantity and a sub_source_price_id row is attached"
        difference: "the weighted blend is divided back down to a per-unit cost before markup, so acquisition_cost_cents is NOT equal to primary_cost*primary_units + fallback_cost*fallback_units; is_blended_cost == true and shipping is waived more often because the rounded per-unit figure compresses the blend"
    worked_examples:
      - "quantity 60, source {12c, 600u}, no fallback: primary_units 60, fallback_units 0, blended 720, acquisition_cost_cents = 720, markup_cents = round(720*0.15) = 108, provisional = 720+108+800+500 = 2128 >= 1500 so shipping_fee_cents = 0, patient_price_cents = 720+108+800+0 = 1628."
      - "quantity 60, source {12c, 20u}, fallback {16c, any}: primary_units 20, fallback_units 40, blended = 12*20 + 16*40 = 880, acquisition_cost_cents = round(880/60) = round(14.667) = 15, markup_cents = round(15*0.15) = round(2.25) = 2, provisional = 15+2+800+500 = 1317 >= 1500? no, 1317 < 1500 so shipping_fee_cents = 500, patient_price_cents = 1317."
      - "quantity 30, source {500c, 8u}, fallback {550c, any}: primary_units 8, fallback_units 22, blended = 4000 + 12100 = 16100, acquisition_cost_cents = round(16100/30) = round(536.667) = 537, markup_cents = round(537*0.15) = round(80.55) = 81, provisional = 537+81+800+500 = 1918 >= 1500 so shipping_fee_cents = 0, patient_price_cents = 537+81+800+0 = 1418."

  - name: expansion_score
    trigger: "POST /formularies/{drug_id}/expansion, and every demand_units_30d or supply_units recompute"
    algorithm: threshold
    formula: |
      demand = drug.demand_units_30d
      supply = drug.supply_units
      if demand >= supply:                      expansion_score = 1
      elif supply < 2 * demand:                 expansion_score = 2
      elif supply <= 10 * demand:               expansion_score = 3
      else:                                     expansion_score = 0
      expansion_score = null when drug.is_controlled == true, when the drug has no
      candidate ManufacturerDrugPrice row offered by an ACTIVE manufacturer, or when
      supply == 0 with demand > 0 still scored 0 by the final else-branch.
      The formulary-expansion gate requires expansion_score >= 2, i.e. score 2 or 3
      admits and score 0 or 1 does not.
    input_set: "drug.demand_units_30d and drug.supply_units, both computed by other rules in this table"
    constants:
      EXPANSION_GATE_MIN_SCORE: 2
      SUPPLY_TIGHT_MULTIPLIER: 2
      SUPPLY_BAND_MULTIPLIER: 10
    precision: "integer score; exact comparisons, no rounding"
    variants:
      - name: gate_threshold_inclusive
        when: "POST /formularies/{drug_id}/expansion"
        difference: "score == 2 passes (>= 2); a rule written as > 2 would wrongly reject the tight-supply band"
    worked_examples:
      - "demand 500, supply 500 (demand >= supply): score 1, expansion refused"
      - "demand 600, supply 100 (demand >= supply): score 1, expansion refused"
      - "demand 250, supply 499 (supply < 2*demand since 499 < 500): score 2, expansion admitted"
      - "demand 100, supply 199 (199 < 200): score 2, expansion admitted"
      - "demand 100, supply 1000 (1000 <= 1000): score 3, expansion admitted"
      - "demand 49, supply 500 (500 > 490): score 0, expansion refused"
      - "demand 600, supply 0: score 0, expansion refused"

  - name: sourcing_status
    trigger: "POST /manufacturer-drug-prices/{id}/activation, POST /manufacturer-drug-prices/{id}/sourcing, POST /manufacturer-drug-prices/{id}/revocation, POST /manufacturers/{id}/state, or any claim denial"
    algorithm: threshold
    formula: |
      pool = every ManufacturerDrugPrice row p with p.drug_id == drug.id
             AND p.price_status == ACTIVE
             AND p.manufacturer.status == ACTIVE
      if pool is empty:
          drug.sourcing_status = UNSOURCED
      elif sum(p.available_units for p in pool) == 0:
          drug.sourcing_status = UNDER_REVIEW
      elif any p in pool has p.sourcing_status == SOURCED:
          drug.sourcing_status = SOURCED
      else:
          drug.sourcing_status = UNDER_REVIEW
    input_set: "ManufacturerDrugPrice rows with price_status == ACTIVE whose manufacturer is ACTIVE; REVOKED and PROPOSED rows and suspended manufacturers' rows are excluded"
    constants: {}
    precision: "enum, no numeric rounding"
    variants:
      - name: shared_across_supply_and_demand
        when: "GET /formularies/{drug_id}/supply-summary"
        difference: "the same computed field is surfaced individually on each ManufacturerDrugPrice row of the pool, so a row whose own sourcing_status is SUPPRESSED still reports the drug's SOURCED status"

  - name: demand_30d
    trigger: "POST /prescriptions/{id}/intake-requests, POST /prescription-requests/{id}/rejection, and POST /orders/{id}/shipping or POST /orders/{id}/delivery"
    algorithm: aggregation
    formula: |
      # As of 2026-09-10T00:00:00Z only. This is a pinned cut-over: before this
      # instant the window is the OPEN interval (clock - 30 days, clock] but no
      # request in the fixture set is old enough to matter; from this instant
      # onward the window is the HALF-OPEN interval [clock - 30 days, clock).
      window_start = clock - 30 days
      window_end   = clock
      drug.demand_units_30d = sum(r.packaged_quantity
                                  for r in PrescriptionRequest
                                  where r.prescription.drug_id == drug.id
                                    AND r.status IN {SUBMITTED, UNDER_REVIEW, ACCEPTED}
                                    AND window_start <= r.created_at < window_end)
      REJECTED requests are excluded.
      If the filtered set is empty, demand_units_30d = 0 (not null).
    input_set: "PrescriptionRequest rows whose status IN {SUBMITTED, UNDER_REVIEW, ACCEPTED}, created in the half-open window [clock-30d, clock). REJECTED requests are excluded even when they fall inside the window"
    constants:
      WINDOW_DAYS: 30
    precision: "integer units, no rounding"
    variants:
      - name: excludes_rejected
        when: "after an intake rejection"
        difference: "the rejected request's packaged_quantity leaves the window sum immediately, which can drop demand to 0 and therefore raise supply_units/demand_units_30d across a band boundary"

  - name: comparison_lifecycle
    trigger: "PriceSubstantiation enablement or disablement; order drug substitution; GET /orders/{order_id}/comparison"
    algorithm: threshold
    formula: |
      Let S = the set of PriceSubstantiation rows for this order with
              status == ENABLED AND valid_until > clock.
      Let latest_deadline = max(P.valid_until for P in S), null when S is empty.

      if S is non-empty:
          comparison.state = FRESH
          comparison.substantiated = true
          comparison.substantiation_digest = sha256_hex("order=" + order.id +
              "|retail=" + retail_reference_price_cents +
              "|benefit=" + insured_reference_price_cents)
      elif clock > comparison.stale_deadline_at:
          # never-substantiated comparison past its own deadline
          comparison.state = BLOCKED
          comparison.substantiated = false
          comparison.substantiation_digest = null
      elif any PriceSubstantiation for this order was DISABLED and
           max(disabled.valid_until) <= clock:
          comparison.state = STALE
          comparison.substantiated = false
          comparison.substantiation_digest = null
      else:
          comparison.state = FRESH
          comparison.substantiated = false
          comparison.substantiation_digest = null

      comparison.status mirrors: SUBSTANTIATED when substantiated is true,
      UNSUBSTANTIATED while state is FRESH and substantiated is false, and BLOCKED
      when state is BLOCKED. A comparison whose order drug was substituted is driven
      to REFRESH_REQUIRED by the substitution transition and is NOT re-derived by
      this rule until a refresh endpoint fires.

      Precedence is strict and ordered: an enabled-in-window substantiation always
      wins over the deadline branch, so a comparison with a live substantiation is
      FRESH even when its stale_deadline_at has already passed.
    input_set: "PriceSubstantiation rows for the order, and the order's PriceComparison.stale_deadline_at"
    constants:
      STALE_DEADLINE_DAYS: 30
    precision: "enum plus sha256 hex digest, no numeric rounding"
    variants:
      - name: substantiation_wins_over_deadline
        when: "an ENABLED substantiation with valid_until in the future exists after stale_deadline_at has passed"
        difference: "state is FRESH and status SUBSTANTIATED, not BLOCKED"
      - name: disabled_substantiation_goes_stale
        when: "every substantiation for the order has been DISABLED"
        difference: "state is STALE, which is distinguishable from BLOCKED and is the only state the refresh endpoint accepts from without an existing digest"

  - name: ship_slot_capacity
    trigger: "POST /orders/{id}/shipping dispatch check, and GET /formularies/{id}/supply-summary"
    algorithm: interval_merge
    formula: |
      Each drug carries a daily carrier slot of aggregate capacity SLOT_CAPACITY = 2.
      A shipment dispatched on calendar day D occupies the calendar day D and, as a
      quarantine buffer, the calendar day D-1 as well. Occupancy is counted over
      every Shipment of the drug with status IN {DISPATCHED, IN_TRANSIT, DELIVERED}:
        occupied_days(shipment) = { calendar_day(shipment.dispatch_at) - 1,
                                    calendar_day(shipment.dispatch_at) }
      On POST /orders/{id}/shipping:
        D = calendar_day(logical clock)
        if either day in {D-1, D} already carries SLOT_CAPACITY shipments of this drug:
          reject with ERR_SHIP_SLOT_CONFLICT
      Two shipments that abut exactly (D2 == D1 + 1) still collide, because the
      buffer day D2 - 1 == D1 is occupied. Two shipments separated by at least two
      days (D2 >= D1 + 2) never collide, because their occupied day sets are
      disjoint. This is deliberately different interval geometry from the licence
      coverage rule, which uses half-open interval inclusion with no buffer and
      rejects only on a strict-after violation at the shared endpoint.
    input_set: "Shipment rows of the drug with status IN {DISPATCHED, IN_TRANSIT, DELIVERED}; PENDING and RETURNED shipments occupy nothing"
    constants:
      SLOT_CAPACITY: 2
      QUARANTINE_BUFFER_DAYS: 1
    precision: "integer calendar days, no rounding"
    variants:
      - name: buffered_aggregate_capacity
        when: "POST /orders/{id}/shipping"
        difference: "aggregate capacity over two adjacent calendar days, versus the licence rule's single half-open interval with a strict-after endpoint test"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role header must be present and must be one of the declared roles"
    error_id: ERR_MISSING_ROLE_HEADER
    http_status: 401
    applies_to: "all endpoints except GET /_health"

  - priority: 2
    category: auth
    check: "The declared role must be permitted for this operation"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "every endpoint whose roles list excludes the caller's role"

  - priority: 2.5
    category: auth
    check: "When X-User-Role is Patient, X-User-ID must equal the patient_id owning the prescription, order, claim, or comparison addressed in the path"
    error_id: ERR_PATIENT_OWNERSHIP_REQUIRED
    http_status: 403
    applies_to: "every patient-scoped read and write; never applies to PharmacyOps or Pharmacist"

  - priority: 3
    category: existence
    check: "Every resource id in the path must resolve, validated left to right; the drug, pharmacy, manufacturer, prescriber, patient, prescription, request, order, shipment, claim, price row, licence, comparison and substantiation must each exist"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 3.5
    category: business_constraint
    check: "Optimistic concurrency on the parent Order: the supplied expected_order_version must equal order.version at the moment of the write"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /orders/{id}/fulfillment", "POST /orders/{id}/substantiation-enablement"]

  - priority: 4
    category: state
    check: "The target resource must be in a state that admits the requested transition; a terminal resource rejects every further transition with this error"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every state transition endpoint"

  - priority: 4.5
    category: business_constraint
    check: "Formulary admission requires the demand-versus-supply gate to pass: supply_units >= demand_units_30d, demand_units_30d >= 1, and expansion_score >= 2"
    error_id: ERR_FORMULARY_GATE_FAILED
    http_status: 422
    applies_to: ["POST /formularies/{id}/expansion"]

  - priority: 5
    category: business_safety
    check: "The drug must not be a controlled substance; controlled substances are never shippable and never orderable"
    error_id: ERR_CONTROLLED_SUBSTANCE_EXCLUDED
    http_status: 422
    applies_to: ["POST /prescriptions/{id}/intake-requests", "POST /prescription-requests/{id}/acceptance", "POST /orders", "POST /orders/{id}/shipping", "POST /orders/{id}/fulfillment"]

  - priority: 6
    category: business_constraint
    check: "The delivery state must be covered: a PharmacyLicense must exist for the selected pharmacy with state_code == the order's ship_state_code and status == ACTIVE, and the pharmacy's shipping_enabled must be true"
    error_id: ERR_NOT_LICENSED_IN_STATE
    http_status: 422
    applies_to: ["POST /orders/{order_id}/shipping"]

  - priority: 7
    category: business_referential
    check: "The PrescriptionRequest referenced by the order must be in status ACCEPTED and must still carry enough packaged_quantity capacity for the order's quantity"
    error_id: ERR_REQUEST_NOT_ACCEPTED
    http_status: 422
    applies_to: ["POST /orders"]

  - priority: 8
    category: business_constraint
    check: "The request's remaining capacity and the drug's remaining supply must both admit the order's quantity; remaining capacity is packaged_quantity minus consumed_quantity, and remaining supply is supply_units"
    error_id: ERR_REQUEST_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: ["POST /orders"]

  - priority: 8.2
    category: business_constraint
    check: "A refill authorisation is refused when the prescription's refill budget is exhausted, the drug's sourcing_status is not SOURCED, the drug's supply_units are below the requested quantity, or the drug is DELISTED"
    error_id: "ERR_SOURCING_UNAVAILABLE / ERR_SUPPLY_SHORTFALL / ERR_DRUG_DELISTED"
    http_status: 422
    applies_to: ["POST /claims/{id}/refill-authorizations"]

  - priority: 8.5
    category: business_constraint
    check: "The drug's carrier slot must admit the dispatch: neither the dispatch calendar day nor its one-day quarantine buffer may already carry two shipments of that drug in status DISPATCHED, IN_TRANSIT or DELIVERED"
    error_id: ERR_SHIP_SLOT_CONFLICT
    http_status: 409
    applies_to: ["POST /orders/{id}/shipping"]

  - priority: 9
    category: business_temporal
    check: "The shipment interval must have elapsed: the logical clock must be at or after order.paid_at + drug.ship_interval_days"
    error_id: ERR_SHIP_INTERVAL_NOT_ELAPSED
    http_status: 422
    applies_to: ["POST /orders/{order_id}/fulfillment"]

  - priority: 10
    category: business_constraint
    check: "A PharmacyLicense already ACTIVE for the same pair (pharmacy_id, state_code) blocks a second licence for that pair until the first is revoked or superseded, and the incoming expiry must be strictly after the incumbent's expiry"
    error_id: ERR_LICENSE_CONFLICT
    http_status: 409
    applies_to: ["POST /pharmacies/{pharmacy_id}/licenses"]

  - priority: 11
    category: business_fiscal
    check: "An order's acquisition_cost_cents, markup_cents and patient_price_cents must never be negative, and patient_price_cents must equal acquisition_cost_cents + markup_cents + pharmacy_fee_cents + shipping_fee_cents exactly"
    error_id: ERR_PRICE_INVARIANT_BROKEN
    http_status: 422
    applies_to: ["POST /orders/{order_id}/payment"]

  - priority: 12
    category: business_fiscal
    check: "The order's PriceComparison must be substantiated before any comparison message may be served; an unsubstantiated or blocked comparison is withheld"
    error_id: ERR_COMPARISON_UNSUBSTANTIATED
    http_status: 422
    applies_to: ["GET /orders/{order_id}/comparison"]

  - priority: 13
    category: business_referential
    check: "An order's source_price_id must reference a ManufacturerDrugPrice row whose drug_id equals the prescription's drug_id"
    error_id: ERR_SOURCE_PRICE_DRUG_MISMATCH
    http_status: 422
    applies_to: ["POST /orders", "POST /orders/{order_id}/payment"]

  - priority: 14
    category: business_constraint
    check: "POST /prescriptions/{prescription_id}/intake-requests requires a prescriber reference on the prescription and a drug reference on the prescription"
    error_id: ERR_PRESCRIBER_ORDER_REQUIRED
    http_status: 422
    applies_to: ["POST /prescriptions/{prescription_id}/intake-requests", "POST /prescription-requests/{request_id}/acceptance"]

  - priority: 15
    category: business_constraint
    check: "POST /prescriptions/{prescription_id}/substitution requires a stated reason code"
    error_id: ERR_SUBSTITUTION_REASON_REQUIRED
    http_status: 422
    applies_to: ["POST /prescriptions/{prescription_id}/substitution"]

  - priority: 16
    category: business_constraint
    check: "POST /orders/{order_id}/cancellation requires a stated cancellation reason code"
    error_id: ERR_CANCELLATION_REASON_REQUIRED
    http_status: 422
    applies_to: ["POST /orders/{order_id}/cancellation"]

  - priority: 17
    category: business_referential
    check: "POST /orders/{order_id}/substantiation-enablement requires a substantiation that belongs to this exact order"
    error_id: ERR_SUBSTANTIATION_ORDER_MISMATCH
    http_status: 422
    applies_to: ["POST /orders/{order_id}/substantiation-enablement"]

  - priority: 25
    category: business_constraint
    check: "Numeric inputs must satisfy their declared lower bounds: unit_cost_cents >= 1, available_units >= 0, packaged_quantity >= 1, quantity >= 1, total_refills_authorized >= 0"
    error_id: ERR_INVALID_AMOUNT
    http_status: 400
    applies_to: ["POST /manufacturer-drug-prices", "POST /prescriptions", "POST /prescriptions/{id}/intake-requests", "POST /orders", "POST /claims/{id}/refill-authorizations"]

  - priority: 18
    category: business_temporal
    check: "A PriceSubstantiation whose valid_until is not strictly after the logical clock may not be enabled"
    error_id: ERR_SUBSTANTIATION_EXPIRED
    http_status: 422
    applies_to: ["POST /orders/{order_id}/substantiation-enablement"]

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Clock / health ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. The server's startup default time is exactly 2026-09-01T00:00:00Z and MUST NOT fall back to real wall-clock time before this endpoint is called."
    roles: [PharmacyOps]
    code: 200
    input: [current_utc]
    output: "{ current_utc: datetime }"
    side_effects: ["Every time-gated rule (shipment interval, licence expiry, substantiation validity, comparison deadline, demand window) is evaluated against this instant"]

  - method: GET
    path: "/_health"
    description: "Liveness probe"
