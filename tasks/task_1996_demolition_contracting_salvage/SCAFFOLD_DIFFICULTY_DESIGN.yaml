            - { call: "POST /demolition/permits/${pmb}/transition", payload: { action: "SUBMIT" }, as: PermitCoordinator }
            - { call: "POST /demolition/permits/${pmb}/transition", payload: { action: "APPROVE" }, as: AuthorityReviewer }
