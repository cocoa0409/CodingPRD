        distinguishing_aspect: "Two strictly sequential notice creates carrying the same expected_lease_version: the first succeeds and bumps Lease.version; the second, replaying the now-stale version, fails with ERR_STALE_VERSION (412) — no wall-clock concurrency involved."
        test_recipe:
          setup:
            - "Portfolio with AM, BK; ACTIVE lease; FIXED RENEWAL option window [2026-08-01, 2026-12-31]; clock 2026-09-01"
