          setup:
            - "Exhibition JURYING with advance_score_threshold 7.0, weights 0.40/0.35/0.25, quorum_required 2."
            - "One MEMBER artist entry of three PAINTINGs (entry fee 4951): aw_a, aw_b, aw_c."
            - "Two CONFIRMED PAINTING jurors booked into round 1, round OPEN at clock 2026-10-06T10:00:00Z."
