      - name: the_eleventh_entry_against_a_one_position_quota_exceeds_the_list_ceiling
        claim_type: violation_to_error
        grounds:
          - validations.priority 11 ERR_RANK_LIST_TOO_LONG
          - errors.ERR_RANK_LIST_TOO_LONG
          - constants.RANK_LIST_MAX_MULTIPLE
        distinguishing_aspect: >
          The ceiling is quota_positions * RANK_LIST_MAX_MULTIPLE, so a one-position program may rank ten
          applications and no more. The eleventh entry arrives with rank_position 11 == entry_count + 1 and
          a current expected_rank_list_version, so it satisfies both the priority-10 sequence rule and the
          priority-6 concurrency rule: only the priority-11 fiscal ceiling can reject it, and entry_count
          must stay at 10.
