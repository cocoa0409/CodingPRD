              as: BureauAdmin
              captures: { ps_delta_id: "$.data.id" }
            - call: "POST /bureau/press-lines"
              payload: { line_code: "PL-GAMMA", capabilities: ["COLOR"], sheets_per_hour: 2000, daily_sheet_capacity: 20000, changeover_buffer_minutes: 30 }
              as: BureauAdmin
              captures: { ps_gamma_id: "$.data.id" }
            - call: "POST /bureau/press-lines"
