# =============================================================================
# Task 0080 — Online Music Festival Program Scheduling
# Scaffold file (§1.0–§1.7).  The companion §1.8 Difficulty Design lives in
# the sibling file SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================

scenario: |
  Online music festival program scheduling: program list creation with festival
  profile (date/venue), program-item attributes (artist/genre/duration),
  program-list version control, draft-and-publish workflow, and last-minute
  change handling; artist time-slot allocation with artist availability and
  travel constraints, headliner and opener tiering, time-slot priority by
  artist-tier, slot-conflict detection across artists with multi-festival
  commitments, and rider-requirement registration; stage resource conflict
  detection with multi-stage parallel scheduling, stage-changeover buffer
  time, equipment-sharing constraint across stages, lighting and audio
  resource allocation, and emergency-stage substitution rules; sound-check
  and rehearsal scheduling with sound-check slot per artist, shared
  sound-engineer-team assignment, rehearsal-room and stage-rehearsal
  differentiation, rehearsal-time-conflict avoidance, and rehearsal-record
  archiving; ticketing linkage with ticket-type configuration tied to
  programs (single-day/full-festival/VIP), schedule-change-triggered ticket
  notification, refund rules for cancelled programs, capacity-and-zoning
  information sharing, and access-control mapping; sponsor exposure
  allocation with sponsor-tier configuration (title/gold/silver),
  exposure-resource catalog (stage-name/screen-time/artist-mention/
  branded-zone), allocation rules per tier, exposure-execution tracking,
  and post-event exposure-fulfilment report; event-driven synchronization
  with ticketing, IM, broadcasting, and sponsor-management systems; audit
  logging for schedule changes and exposure records.

domain_name: festival-program-schedule
api_prefix: /festivals

# -----------------------------------------------------------------------------
# §0  Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - version_pinning_on_approval
    - optimistic_concurrency
    - scheduled_deferred_actions
    - bulk_operations
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: eventual
  difficulty_band: Expert
  rationale: |
    Multiple shared resources (stages, equipment kits, sound-engineer teams,
    rehearsal rooms) compete for overlapping time windows, each with its own
    interval-arithmetic flavour (changeover-padded vs aggregate-capacity vs
    closed-with-warmup-gap).  A festival-wide draft/publish program-version
    pointer turns approval into a version-pinning event whose downstream
    consequences cascade into ticket refunds, sponsor exposure projections,
    and an outbound event queue to four external systems.  Two genuine
    dual-variant calculations sit on different entity domains: refund
    estimates (forward-looking projection vs ticket-system-confirmed
    chronological tally) and sponsor exposure-fulfilment percentage
    (projection over confirmed schedule vs delivered-line tally from the
    post-event sweep).  The audit log is the append-only event log that
    cross-references both.

# -----------------------------------------------------------------------------
# §1.0  Response envelope — emit verbatim per the SKILL spec
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §1.1  Entity-Relationship Table  (15 entities)
# -----------------------------------------------------------------------------
entities:

  - name: Festival
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID (no type prefix)." }
      - { name: name, type: string, source: input, description: "Festival display name." }
      - { name: venue_name, type: string, source: input, description: "Venue at which the festival is held." }
      - { name: start_time, type: integer, source: input, description: "Festival window start (Unix seconds, UTC)." }
      - { name: end_time, type: integer, source: input, description: "Festival window end (Unix seconds, UTC).  Must be > start_time and the half-open interval [start_time, end_time) defines the festival's bookable window." }
      - { name: festival_day_count, type: integer, source: computed, description: "Ceil((end_time − start_time) / 86400).  Used as the divisor in the forward-looking refund formula." }
      - { name: status, type: enum, source: system, description: "Festival lifecycle.", constraints: "PLANNED | SCHEDULING | PUBLISHED | LIVE | CLOSED | CANCELLED" }
      - { name: current_program_version_id, type: string, source: system, default: null, description: "FK to the currently-published ProgramVersion; null while no version has been published.  Pinned to a specific ProgramVersion.id at publish time so later DRAFT versions do not silently become authoritative." }
      - { name: clock_offset_seconds, type: integer, source: system, default: 0, description: "Test-driven clock offset added to the wall clock by POST /_clock/advance.  All time-gated transitions read (real_now + clock_offset_seconds).  Always 0 in production." }
      - { name: outstanding_tickets_total, type: integer, source: computed, description: "Σ TicketType.issued_count − Σ TicketType.refunded_count over this festival's ticket types.  Conserved across the apply-then-revert of any ScheduleChange that produced and cancelled pending refunds (see invariant in §1.8 rule 9 instance A)." }

  - name: ProgramVersion
    parent: Festival
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier." }
      - { name: festival_id, type: string, source: system, description: "Parent Festival.id." }
      - { name: version_label, type: string, source: input, description: "Human-readable label, e.g., 'v3 — adds Saturday headliner'." }
      - { name: status, type: enum, source: system, description: "DRAFT ↔ READY_FOR_REVIEW (revisable cycle), and DRAFT|READY_FOR_REVIEW → PUBLISHED (terminal-for-this-version, pins Festival.current_program_version_id), or → SUPERSEDED when a newer version is published.", constraints: "DRAFT | READY_FOR_REVIEW | PUBLISHED | SUPERSEDED | WITHDRAWN" }
      - { name: program_item_ids, type: array, source: system, description: "Snapshot of the ProgramItem.id values authoritative for this version, captured at the moment of PUBLISHED transition.  An empty array is permitted (empty programs publish cleanly)." }
      - { name: published_at, type: datetime, source: system, default: null, description: "ISO 8601 UTC at the moment the version transitioned to PUBLISHED.  Null until then." }
      - { name: superseded_by_version_id, type: string, source: system, default: null, description: "When a newer version publishes, the prior PUBLISHED version flips to SUPERSEDED and stamps this field with the new version id.  Forms a back-pointer chain." }

  - name: Stage
    parent: Festival
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier." }
      - { name: festival_id, type: string, source: system, description: "Parent Festival.id." }
      - { name: stage_name, type: string, source: input, description: "Stage display name." }
      - { name: zone_capacity, type: integer, source: input, description: "Maximum simultaneous attendees for the stage's audience zone (used by the ticket-zone capacity check)." }
      - { name: changeover_buffer_seconds, type: integer, source: input, default: 1800, description: "Per-stage override of the global STAGE_CHANGEOVER_BUFFER_SECONDS constant.  If omitted on creation, the global default of 1800 (30 min) applies." }
      - { name: equipment_kits, type: array, source: input, description: "Array of equipment-kit identifiers this stage is wired for, each a string identifying an entry in the festival-wide kit catalog.  The catalog itself (kit_id → total_units across all stages) is the keyed table the aggregate-capacity rule sums against." }
      - { name: is_emergency_substitute, type: boolean, source: input, default: false, description: "Flag indicating the stage is an emergency-substitute stage, eligible to absorb ProgramItems whose primary stage failed.  Substitution is a fresh ProgramItem PATCH that swaps the stage_id and re-runs the overlap and equipment checks; the original stage's interval is freed." }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Stage operational state.", constraints: "ACTIVE | DECOMMISSIONED" }

  - name: EquipmentKit
    parent: Festival
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier." }
      - { name: festival_id, type: string, source: system, description: "Parent Festival.id." }
      - { name: kit_code, type: string, source: input, description: "Short uppercase code (e.g., 'LIGHTING_RIG_A', 'SUBWOOFER_STACK').  Unique within a festival.  This is the string that appears in Stage.equipment_kits[] arrays." }
      - { name: total_units, type: integer, source: input, description: "How many physical copies of this kit the festival owns.  The aggregate-capacity overlap rule asserts that, at any instant in the festival window, the count of CONFIRMED-or-ANNOUNCED ProgramItems whose `equipment_kit_codes` contains this kit_code is ≤ total_units." }
      - { name: description, type: string, source: input, default: "", description: "Free-text description of the kit." }

  - name: Artist
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier.  Artists are global, festival-independent." }
      - { name: stage_name, type: string, source: input, description: "Artist's performance name." }
      - { name: tier, type: enum, source: input, description: "Marketing tier of the artist.  Drives slot-priority scoring.", constraints: "HEADLINER | MAIN | OPENER | SURPRISE" }
      - { name: home_city, type: string, source: input, description: "Artist's home city, used informationally and as a fixed seed for the deterministic tie-break in selector rules." }
      - { name: external_commitments, type: array, source: input, default: [], description: "Array of {festival_external_id, start_time, end_time, city} objects describing this artist's other-festival bookings.  Read by the travel-buffer check and the multi-festival conflict detector." }
      - { name: minimum_travel_buffer_hours, type: integer, source: input, default: 4, description: "Per-artist override of the global TRAVEL_HOURS_MIN constant.  The travel-buffer check uses the artist-level value when set, falling back to the global constant otherwise." }

  - name: ProgramItem
    parent: Festival
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier." }
      - { name: festival_id, type: string, source: system, description: "Parent Festival.id." }
      - { name: program_version_id, type: string, source: system, description: "ProgramVersion.id under which this item was created.  When the festival publishes a newer ProgramVersion, items not in the new version's program_item_ids snapshot are NOT auto-cancelled but they cease to be reachable for transitions that require `program_version_id == Festival.current_program_version_id` (ERR_PROGRAM_VERSION_SUPERSEDED)." }
      - { name: artist_id, type: string, source: input, description: "FK to Artist.id.  Multiple ProgramItems for the same artist within one festival are allowed, but they must not internally overlap (the artist-self-overlap rule)." }
      - { name: stage_id, type: string, source: input, description: "FK to Stage.id.  PATCH endpoints permit swapping the stage when status ∈ {PROPOSED, CONFIRMED} and re-runs the overlap-and-equipment checks against the new stage." }
      - { name: genre, type: string, source: input, description: "Free-text genre label (e.g., 'indie-rock', 'electronic')." }
      - { name: start_time, type: integer, source: input, description: "Slot start (Unix seconds, UTC).  Must lie within [Festival.start_time, Festival.end_time)." }
      - { name: end_time, type: integer, source: input, description: "Slot end (Unix seconds, UTC).  Must be > start_time.  The slot interval is treated as half-open [start_time, end_time) for raw artist-self-overlap and equipment-kit capacity, and as [start_time − buffer, end_time + buffer] closed for the stage-changeover check (the asymmetry is the point of rule 8 instance 1)." }
      - { name: duration_seconds, type: integer, source: computed, description: "Read-only: end_time − start_time." }
      - { name: equipment_kit_codes, type: array, source: input, default: [], description: "Array of EquipmentKit.kit_code strings the item requires.  Used by the aggregate-capacity overlap check.  Every code listed must appear in the parent Stage.equipment_kits[] array, otherwise ERR_STAGE_LACKS_EQUIPMENT_KIT." }
      - { name: slot_priority_score, type: number, source: computed, description: "Composite score (formula in §1.3 `slot_priority_score`) used to order PROPOSED items competing for the same window.  Higher wins.  Recomputed on every PATCH that touches start_time, end_time, artist tier reference, or rider count." }
      - { name: status, type: enum, source: system, description: "ProgramItem lifecycle.", constraints: "PROPOSED | CONFIRMED | ANNOUNCED | ON_STAGE | PERFORMED | CANCELLED" }
      - { name: sound_check_status, type: enum, source: system, default: NOT_REQUIRED, description: "Independent parallel axis on the same ProgramItem row — tracks whether the artist's sound-check has been requested, scheduled, and completed.  Evolves on its own state machine driven by SoundCheckSlot transitions.", constraints: "NOT_REQUIRED | REQUESTED | SCHEDULED | COMPLETED | WAIVED" }
      - { name: announcement_sync_state, type: enum, source: system, default: PENDING, description: "Has the public announcement of this item been propagated to the external IM and broadcasting systems via a ScheduleChange?  Flipped to ACKED when at least one SyncEnvelope element under the originating ScheduleChange reports status ACKNOWLEDGED for target='im'.", constraints: "PENDING | QUEUED | ACKED | FAILED" }

  - name: RiderRequirement
    parent: ProgramItem
    common_fields: false  # append-only event log; only id and created_at
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier." }
      - { name: program_item_id, type: string, source: system, description: "Parent ProgramItem.id." }
      - { name: category, type: enum, source: input, description: "Coarse-grained category for grouping.", constraints: "TECHNICAL | HOSPITALITY | SECURITY | CATERING | ACCESSIBILITY" }
      - { name: description, type: string, source: input, description: "Free-text rider line item." }
      - { name: is_blocking, type: boolean, source: input, default: false, description: "If true, the rider must be flagged as fulfilled before the ProgramItem may transition CONFIRMED → ANNOUNCED.  The fulfilment flag is `fulfilled_at` below." }
      - { name: fulfilled_at, type: datetime, source: system, default: null, description: "Timestamp at which the rider was marked fulfilled (via PATCH .../riders/{rid}).  Null until then.  Append-only entity except for this single mutable flag; the rest is immutable." }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC at creation.  No updated_at because the entity is append-only except for the fulfilled_at flag, whose flip is itself audited via AuditEntry." }

  - name: SoundEngineerTeam
    parent: Festival
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier." }
      - { name: festival_id, type: string, source: system, description: "Parent Festival.id." }
      - { name: team_name, type: string, source: input, description: "Team display name." }
      - { name: head_engineer_name, type: string, source: input, description: "Name of the team's lead engineer." }
      - { name: warmup_minutes, type: integer, source: input, default: 10, description: "Per-team warmup gap between consecutive SoundCheckSlot bookings.  The temporal-overlap check for this resource uses closed-inclusive intervals padded one-sidedly on the right: a new slot's start must be ≥ the previous slot's end + warmup_minutes × 60.  Default 10 minutes mirrors TEAM_WARMUP_MINUTES." }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE → BUSY when at least one SoundCheckSlot referencing the team is in status SCHEDULED, back to AVAILABLE when all referencing slots reach COMPLETED or CANCELLED.  WITHDRAWN is the terminal staffing-removed state.", constraints: "AVAILABLE | BUSY | WITHDRAWN" }
      - { name: current_booking_id, type: string, source: system, default: null, description: "When `status == BUSY`, the SoundCheckSlot.id the team is currently committed to.  Cleared on slot completion or cancellation." }

  - name: SoundCheckSlot
    parent: ProgramItem
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier." }
      - { name: festival_id, type: string, source: system, description: "Denormalised festival id for indexing." }
      - { name: program_item_id, type: string, source: system, description: "Parent ProgramItem.id this sound-check is for." }
      - { name: stage_id, type: string, source: system, description: "Stage on which the sound-check happens (denormalised from the parent ProgramItem at creation time and pinned even if the program-item's stage_id is later PATCHed; a stage swap on the parent thus invalidates the slot and the test asserts the slot is auto-cancelled — see §1.2 SoundCheckSlot)." }
      - { name: sound_engineer_team_id, type: string, source: input, description: "Which SoundEngineerTeam runs the sound-check.  Provided when transitioning REQUESTED → SCHEDULED." }
      - { name: scheduled_window_start, type: integer, source: input, description: "Sound-check window start (Unix seconds, UTC).  Must be ≥ Festival.start_time and < the parent ProgramItem.start_time (sound-check must precede performance)." }
      - { name: scheduled_window_end, type: integer, source: input, description: "Sound-check window end (Unix seconds, UTC).  Must be > start and ≤ the parent ProgramItem.start_time minus TEAM_HANDOFF_SECONDS." }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "Sound-check lifecycle.  REQUESTED → SCHEDULED upon team assignment, REQUESTED|SCHEDULED → CANCELLED upon parent cancellation, SCHEDULED → COMPLETED upon mark-complete.", constraints: "REQUESTED | SCHEDULED | COMPLETED | CANCELLED" }

  - name: Rehearsal
    parent: Festival
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier." }
      - { name: festival_id, type: string, source: system, description: "Parent Festival.id." }
      - { name: artist_id, type: string, source: input, description: "Artist who is rehearsing.  Need not have a confirmed ProgramItem yet (rehearsals predate the announcement)." }
      - { name: rehearsal_type, type: enum, source: input, description: "STAGE rehearsals consume the named Stage's window (and therefore conflict with ProgramItems on that stage via the standard stage-changeover rule).  ROOM rehearsals consume a named rehearsal room from the pool — disjoint from the stage namespace.", constraints: "STAGE | ROOM" }
      - { name: stage_id, type: string, source: input, default: null, description: "Required when rehearsal_type == STAGE; null otherwise.  Stage rehearsals contribute to the stage's interval graph identically to ProgramItems for purposes of the changeover-buffer overlap rule." }
      - { name: rehearsal_room_name, type: string, source: input, default: null, description: "Required when rehearsal_type == ROOM; null otherwise.  Rehearsal rooms are a free-form string namespace — two ROOM rehearsals on the same room_name with overlapping windows conflict, but a ROOM rehearsal and a STAGE event never conflict because they live in different namespaces.  This namespace asymmetry is the distinguishing aspect for the rehearsal-room/stage-namespace rule 8 instance 3 below." }
      - { name: start_time, type: integer, source: input, description: "Rehearsal window start (Unix seconds, UTC)." }
      - { name: end_time, type: integer, source: input, description: "Rehearsal window end (Unix seconds, UTC), strictly greater than start_time.  Intervals are half-open [start, end) for the rehearsal-room overlap rule.  The 'rehearsal-time-conflict avoidance' clause in the scenario refers to this half-open intersection check." }
      - { name: archive_uri, type: string, source: system, default: null, description: "Set on ARCHIVED.  An opaque uri-like string the test asserts is non-null after archiving (the actual storage is out of scope)." }
      - { name: status, type: enum, source: system, description: "BOOKED → IN_PROGRESS at scheduled start (driven by POST /_clock/advance crossing start_time), IN_PROGRESS → ARCHIVED at end_time + REHEARSAL_GRACE_SECONDS, BOOKED → CANCELLED on explicit cancel.  Festival CLOSED cascades any non-terminal Rehearsal to ARCHIVED (cascade C in §1.8 rule 4).", constraints: "BOOKED | IN_PROGRESS | ARCHIVED | CANCELLED" }

  - name: TicketType
    parent: Festival
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier." }
      - { name: festival_id, type: string, source: system, description: "Parent Festival.id." }
      - { name: ticket_class, type: enum, source: input, description: "Coarse class.", constraints: "SINGLE_DAY | FULL_FESTIVAL | VIP" }
      - { name: tied_program_item_ids, type: array, source: input, description: "Array of ProgramItem.id this ticket grants access to.  SINGLE_DAY tickets tie to the items happening on a single calendar day in the festival's local timezone (the implementation uses UTC midnight buckets for determinism).  Cancellation of a tied item triggers the refund formula." }
      - { name: zone_name, type: string, source: input, description: "Name of the audience zone.  Capacity comes from the highest Stage.zone_capacity among the stages of the tied items; the per-zone capacity ceiling is checked on POST .../issue." }
      - { name: unit_price_cents, type: integer, source: input, description: "Integer cents.  All monetary arithmetic in this scaffold is in integer cents to avoid floating drift — the refund formula's two-decimal precision is therefore exact." }
      - { name: issued_count, type: integer, source: computed, description: "Total tickets issued of this type, incremented atomically by POST .../issue." }
      - { name: refunded_count, type: integer, source: computed, description: "Total tickets refunded of this type after a ScheduleChange.apply triggers a refund batch and the external ticketing system confirms.  Incremented by POST /_events/refund-confirmed; decremented by ScheduleChange.revert when the change is reverted before the external ACK." }
      - { name: provisional_refund_cents_outstanding, type: integer, source: computed, description: "Cents currently in the 'pending refund' bucket — the sum of provisional refund estimates queued by every ScheduleChange.apply that affects this ticket type and has not yet been ACKed by the ticketing system.  Cleared when matching POST /_events/refund-confirmed payloads arrive." }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE ↔ SUSPENDED (revert cycle when the ticketing admin pauses sales without closing the type), and any non-terminal → CLOSED at festival close.  WITHDRAWN is the terminal staffing-removed state when the type was suspended at the moment the festival closed.", constraints: "ACTIVE | SUSPENDED | CLOSED | WITHDRAWN" }

  - name: SponsorTier
    parent: Festival
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier." }
      - { name: festival_id, type: string, source: system, description: "Parent Festival.id." }
      - { name: tier_code, type: enum, source: input, description: "Title is the apex tier and consumes the catalog pool first; Gold second; Silver third.  The waterfall-allocation calculation uses this ordering verbatim.", constraints: "TITLE | GOLD | SILVER" }
      - { name: tier_name, type: string, source: input, description: "Marketing label, e.g., 'Title — Aurora Communications'." }
      - { name: priority_rank, type: integer, source: input, description: "Tie-break within a tier_code: lower priority_rank wins the next unit when the pool is short.  When two sponsors in the same tier_code have identical priority_rank, the lexicographically smaller `sponsor_external_id` wins (deterministic tie-break)." }
      - { name: sponsor_external_id, type: string, source: input, description: "Opaque sponsor-organisation identifier minted by the sponsor-management external system.  Carried on outbound SyncEnvelope payloads of target='sponsor'." }
      - { name: sponsor_display_name, type: string, source: input, description: "Sponsor organisation's marketing name." }
      - { name: contracted_units, type: integer, source: input, description: "Contracted total exposure units across the catalog kinds, summed.  The fulfilment-percentage formula's denominator." }
      - { name: contract_kinds_allowed, type: array, source: input, description: "Subset of {'stage_name','screen_time','artist_mention','branded_zone'} listing which exposure-resource kinds this sponsor's contract entitles them to receive units of.  An ExposureAllocation whose `kind` is not in this list is rejected with ERR_EXPOSURE_KIND_NOT_CONTRACTED." }
      - { name: projected_fulfilment_pct, type: number, source: computed, description: "Forward-looking percentage based on currently-scheduled ProgramItems that mention the sponsor.  Recomputed on ProgramItem state changes; the formal definition is the `provisional_exposure_fulfilment_pct` calculation in §1.3.  Two decimal places, half-up." }
      - { name: actual_fulfilment_pct, type: number, source: computed, default: null, description: "Post-event tally driven by the FulfilmentLog append stream and surfaced by POST /_sweep/run.  Null until the festival's first sweep.  Distinct from projected_fulfilment_pct on the same row — this is the dual-variant pair on the sponsor domain (rule 1 instance B)." }
      - { name: tier_remaining_quota, type: integer, source: computed, description: "contracted_units − Σ delivered_units across this tier's ExposureAllocations whose status is DELIVERED or REPORTED.  Conserved across the deliver/void invariant of §1.8 rule 9 instance B." }

  - name: ExposureAllocation
    parent: SponsorTier
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier." }
      - { name: festival_id, type: string, source: system, description: "Denormalised festival id for the cross-tier waterfall sweep." }
      - { name: sponsor_tier_id, type: string, source: system, description: "Parent SponsorTier.id." }
      - { name: program_item_id, type: string, source: system, default: null, description: "ProgramItem the exposure is tied to (e.g., the stage-name exposure rides on the headliner's set).  Nullable for catalog-kind exposures that aren't tied to a specific item (the 'branded_zone' kind in the worked example is festival-wide and leaves this null)." }
      - { name: kind, type: enum, source: input, description: "Which catalog resource is being allocated.  Must lie in the parent SponsorTier.contract_kinds_allowed list.", constraints: "stage_name | screen_time | artist_mention | branded_zone" }
      - { name: requested_units, type: integer, source: input, description: "How many catalog units the sponsor asked for.  After the waterfall sweep the `actual_units` field carries the share the sponsor actually got." }
      - { name: actual_units, type: integer, source: computed, description: "Result of the waterfall allocation: min(requested_units, pool_remaining_for_this_kind_after_higher_tiers_consumed).  Recomputed every POST /festivals/{fid}/sponsor-allocation-sweep." }
      - { name: delivered_units, type: integer, source: computed, default: 0, description: "Count of FulfilmentLog entries of type DELIVERED minus VOIDED that reference this allocation.  Drives `tier_remaining_quota`." }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED upon creation; DELIVERED upon at least one FulfilmentLog DELIVERED row appended; REPORTED after POST /_sweep/run rolls the festival's post-event tally; VOIDED on parent ProgramItem cancellation cascade or explicit void-delivery.", constraints: "PLANNED | DELIVERED | REPORTED | VOIDED" }
      - { name: pinned_rate_cents_per_unit, type: integer, source: input, description: "Integer rate of cents the sponsor pays the festival per delivered unit, pinned at allocation creation.  The combinatorial-mode-(b) nested-rounding pay-out arithmetic uses sub-cent rates inflated by 1000 (mills): see SPONSOR_PAYOUT_RATE_MILS_DEFAULT in §1.3 `sponsor_payout_total`." }

  - name: FulfilmentLog
    parent: ExposureAllocation
    common_fields: false  # append-only
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier." }
      - { name: exposure_allocation_id, type: string, source: system, description: "Parent ExposureAllocation.id." }
      - { name: program_item_id, type: string, source: input, default: null, description: "ProgramItem during which the exposure was delivered, when applicable." }
      - { name: event_type, type: enum, source: input, description: "Append-only event type.  DELIVERED increments the parent's delivered_units; VOIDED decrements it.  REPORTED is the closing-tally event emitted by POST /_sweep/run.  PROGRAM_VOIDED is the cascade-from-ProgramItem.cancel side-effect event.", constraints: "DELIVERED | VOIDED | REPORTED | PROGRAM_VOIDED" }
      - { name: units, type: integer, source: input, description: "Non-negative integer count of catalog units this log entry adjusts by.  Positive for DELIVERED, positive for VOIDED-as-magnitude (the sign comes from event_type), zero for REPORTED.  Must be ≤ the parent's actual_units." }
      - { name: note, type: string, source: input, default: "", description: "Free-text annotation." }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC.  Append-only — no updated_at." }

  - name: ScheduleChange
    parent: Festival
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier." }
      - { name: festival_id, type: string, source: system, description: "Parent Festival.id." }
      - { name: change_kind, type: enum, source: input, description: "Top-level taxonomy of the change.  ITEM_CANCEL cancels a specific ProgramItem and triggers the refund-and-exposure cascade.  ITEM_RESCHEDULE moves an item's window (the prior interval is freed and the new interval is range-checked against stages and equipment).  STAGE_SWAP changes the stage_id, exercising the emergency-substitution rule.  VERSION_PUBLISH is the meta-change wrapped around a ProgramVersion publish so the same outbound-sync ledger captures the announcement.  TICKET_NOTIFY is a no-op cascade entry used to fan a ticket-system notification when nothing structural changed but a sync round-trip is wanted (used by the test harness to verify sync-envelope plumbing without actually mutating the schedule).", constraints: "ITEM_CANCEL | ITEM_RESCHEDULE | STAGE_SWAP | VERSION_PUBLISH | TICKET_NOTIFY" }
      - { name: target_program_item_id, type: string, source: input, default: null, description: "When change_kind references a single item, its id.  Null for VERSION_PUBLISH and TICKET_NOTIFY at the festival level." }
      - { name: payload, type: object, source: input, description: "Change-kind-specific payload.  For ITEM_RESCHEDULE: `{new_start_time, new_end_time}`.  For STAGE_SWAP: `{new_stage_id}`.  For ITEM_CANCEL: `{reason}`.  For VERSION_PUBLISH: `{program_version_id}`.  For TICKET_NOTIFY: `{message}`." }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "PROPOSED upon POST.  Branching fork: PROPOSED → APPLIED on apply (the cascade fires), or PROPOSED → REJECTED on explicit reject.  APPLIED → SYNCED once every SyncEnvelope element has flipped to ACKNOWLEDGED.  APPLIED → REVERTED if the orchestrator cancels the change before the external systems ACK and re-emits the inverse (used by the compensating-invariant rule 9 instance A).  The fork {APPLIED, REJECTED} sharing the PROPOSED predecessor is the branching-shape contribution to rule 3.", constraints: "PROPOSED | APPLIED | SYNCED | REJECTED | REVERTED" }
      - { name: applied_at, type: datetime, source: system, default: null, description: "ISO 8601 UTC of the apply transition.  Null otherwise." }
      - { name: sync_envelopes, type: array, source: system, default: [], description: "Inline array of outbound-sync records, one per downstream target.  Each element is `{target: 'ticketing'|'im'|'broadcasting'|'sponsor', status: 'QUEUED'|'ACKNOWLEDGED'|'FAILED', queued_at, acked_at, payload_hash}`.  The four target strings correspond verbatim to the four external systems the scenario lists.  The envelope is the testable handle for the event-driven-synchronisation requirement: tests read this array from GET .../schedule-changes/{scid} and POST /_events/sync-ack to flip a specific target's element to ACKNOWLEDGED." }
      - { name: provisional_refund_cents_total, type: integer, source: computed, default: 0, description: "Forward-looking refund total in cents computed at the moment of apply per the `provisional_refund_amount` calculation.  Stable across the apply→sync window.  Compared against `final_refund_cents_total` once the ticketing ACK arrives." }
      - { name: final_refund_cents_total, type: integer, source: computed, default: null, description: "Chronological refund total in cents reported by the external ticketing system via POST /_events/refund-confirmed.  Null until the ACK arrives.  May differ from the provisional total by the admin-fee deduction (ADMIN_FEE_RATE_FINAL) — this is the dual-variant pair on the ticketing domain (rule 1 instance A)." }
      - { name: idempotency_key, type: string, source: input, default: null, description: "Optional client-supplied idempotency key.  When two POSTs share the same idempotency_key within IDEMPOTENCY_WINDOW_SECONDS, the second returns the first's stored response without creating a duplicate ScheduleChange row.  When the second POST's body hash differs from the first's, the server rejects with ERR_IDEMPOTENCY_KEY_REUSED rather than silently returning the wrong row." }

  - name: AuditEntry
    parent: Festival
    common_fields: false  # append-only audit log
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier." }
      - { name: festival_id, type: string, source: system, description: "Parent Festival.id." }
      - { name: actor_user_id, type: string, source: system, description: "X-User-ID of the actor whose request caused the entry.  For system-driven entries (clock-advance cascades, post-event sweep), the literal string 'system'." }
      - { name: actor_role, type: string, source: system, description: "X-User-Role of the actor, or 'system'." }
      - { name: event_category, type: enum, source: system, description: "Top-level audit-event category.  Tests filter on this enum to verify that the expected category was emitted by a given mutation.", constraints: "SCHEDULE_CHANGE | EXPOSURE | SYNC_ACK | CLOCK_TICK | STATE_TRANSITION | OCC_CONFLICT" }
      - { name: subject_entity_type, type: string, source: system, description: "Which entity type the event references (e.g., 'ProgramItem', 'ExposureAllocation', 'TicketType', 'Festival')." }
      - { name: subject_entity_id, type: string, source: system, description: "The subject entity's id." }
      - { name: from_state, type: string, source: system, default: null, description: "When the event is a state transition, the prior status enum value.  Null otherwise (e.g., for SYNC_ACK or CLOCK_TICK)." }
      - { name: to_state, type: string, source: system, default: null, description: "Posterior status enum value, or null." }
      - { name: payload_summary, type: string, source: system, description: "A short human-readable summary of the payload, e.g., 'Item X cancelled, 3 tickets queued for refund, 2 exposure allocations voided'.  The full payload is reconstructible from the referenced entity's history but is not duplicated here." }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC.  Audit entries are append-only and ordered by created_at strictly per festival." }

# -----------------------------------------------------------------------------
# §1.2  State Machines  (8 machines — non-linear shapes on multiple entities)
# -----------------------------------------------------------------------------
state_machines:

  - entity: Festival
    field: status
    initial_state: PLANNED
    terminal_states: [CLOSED, CANCELLED]
    shape: linear_with_terminal_branch
    note: "The 'CANCELLED' branch off any non-terminal state is the alternative terminal, making this a branching-with-revert-free shape.  Auto-transitions LIVE→CLOSED on the clock crossing end_time."
    transitions:
      - from: PLANNED
        to: SCHEDULING
        trigger: "POST /festivals/{fid}/open-scheduling"
        actor: FestivalProducer
        preconditions:
          - "Festival exists and is in PLANNED."
        side_effects:
          - "AuditEntry appended (event_category=STATE_TRANSITION, subject=Festival)."

      - from: SCHEDULING
        to: PUBLISHED
        trigger: "POST /festivals/{fid}/program-versions/{vid}/publish  (ProgramVersion transition that pins Festival.current_program_version_id)"
        actor: FestivalProducer
        preconditions:
          - "At least one ProgramVersion exists for the festival in DRAFT or READY_FOR_REVIEW status."
          - "The target ProgramVersion's status is DRAFT or READY_FOR_REVIEW."
        side_effects:
          - "Festival.current_program_version_id ← target.id (version-pinning-on-approval layer)."
          - "Prior PUBLISHED ProgramVersion (if any) flips PUBLISHED → SUPERSEDED with its `superseded_by_version_id` field stamped."
          - "A ScheduleChange of kind VERSION_PUBLISH is auto-created with the four sync_envelopes initialised to status QUEUED, target ∈ {ticketing, im, broadcasting, sponsor}.  This is the event-driven-synchronisation surface."
          - "AuditEntry appended (event_category=SCHEDULE_CHANGE)."

      - from: PUBLISHED
        to: LIVE
        trigger: "system — POST /_clock/advance crosses Festival.start_time"
        actor: system
        preconditions:
          - "real_now + clock_offset_seconds ≥ Festival.start_time."
        side_effects:
          - "Festival.status flipped atomically as the clock-advance cascade visits the festival."
          - "AuditEntry appended (event_category=CLOCK_TICK)."

      - from: LIVE
        to: CLOSED
        trigger: "system — POST /_clock/advance crosses Festival.end_time + FESTIVAL_CLOSE_GRACE_SECONDS"
        actor: system
        preconditions:
          - "real_now + clock_offset_seconds ≥ Festival.end_time + FESTIVAL_CLOSE_GRACE_SECONDS."
          - "All non-terminal Rehearsals (BOOKED or IN_PROGRESS) are auto-archived first (see Rehearsal machine).  This ordering is the depth-3 cascade C of rule 4 in §1.8."
        side_effects:
          - "Cascade: every Rehearsal under this festival in BOOKED or IN_PROGRESS → ARCHIVED with archive_uri stamped (link 1).  Each archived rehearsal appends an AuditEntry of subcategory 'AUTO_ARCHIVE_ON_FESTIVAL_CLOSE' (link 2).  Each AuditEntry append in turn synthesises a SyncEnvelope-style notification on the festival's last open ScheduleChange of kind VERSION_PUBLISH (the link-3 event-fan-out that closes the festival's outbound stream).  The three links — clock-tick→festival-close, festival-close→rehearsal-archive, rehearsal-archive→audit-and-sync-fanout — are caused strictly in sequence, each by the previous one, which is the definition of a depth-3 transitive cascade for rule 4."
          - "Every TicketType in ACTIVE or SUSPENDED transitions to CLOSED (or WITHDRAWN if it was SUSPENDED at close time)."
          - "POST /_sweep/run becomes the only path that further mutates ExposureAllocation rows (their state still moves DELIVERED → REPORTED on a sweep)."
          - "AuditEntry appended (event_category=CLOCK_TICK, subject=Festival, to_state=CLOSED)."

      - from: [PLANNED, SCHEDULING, PUBLISHED, LIVE]
        to: CANCELLED
        trigger: "POST /festivals/{fid}/cancel"
        actor: PlatformAdmin
        preconditions:
          - "Caller is PlatformAdmin (festival-level cancel is a privileged op)."
        side_effects:
          - "Cascade: every non-terminal ProgramItem → CANCELLED, every non-terminal Rehearsal → CANCELLED, every TicketType → WITHDRAWN with a fresh refund-batch ScheduleChange of kind ITEM_CANCEL emitted per cancelled item, every PLANNED|DELIVERED ExposureAllocation → VOIDED with a PROGRAM_VOIDED FulfilmentLog row.  This fan-out is broad, not deep, so it does NOT count toward the rule-4 transitive-cascade quota — a fan-out from a single trigger to multiple targets in parallel is explicitly excluded by rule 4."
          - "A flurry of AuditEntry rows of event_category=STATE_TRANSITION."

  - entity: ProgramVersion
    field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, WITHDRAWN]
    shape: cyclic_with_branch
    note: "DRAFT↔READY_FOR_REVIEW is the revision cycle (A→B→A).  Both DRAFT and READY_FOR_REVIEW can transition forward to PUBLISHED.  The PUBLISHED state is terminal-for-this-version-as-the-authoritative-pointer but becomes SUPERSEDED when a sibling version publishes after it.  This cyclic-shape sits on a different entity from the Festival linear pipeline, satisfying rule 3 with a cycle-shape pair on different entities."
    transitions:
      - from: DRAFT
        to: READY_FOR_REVIEW
        trigger: "POST /festivals/{fid}/program-versions/{vid}/submit-for-review"
        actor: FestivalProducer
        preconditions:
          - "At least one ProgramItem exists referencing this version_id (ERR_EMPTY_PROGRAM_VERSION) — except for VERSION_PUBLISH-of-empty-program test scaffolding which is gated by ALLOW_EMPTY_PROGRAM=false in the implementation config; in benchmark mode the flag is false."
        side_effects:
          - "AuditEntry appended."

      - from: READY_FOR_REVIEW
        to: DRAFT
        trigger: "POST /festivals/{fid}/program-versions/{vid}/return-for-revision"
        actor: ArtistLiaison
        preconditions:
          - "Version is in READY_FOR_REVIEW."
          - "A free-text reason is supplied in the request body (ERR_MISSING_REVISION_REASON)."
        side_effects:
          - "AuditEntry appended with the reason text in payload_summary."
        note: "This is the revision-loop edge that makes the machine cyclic and satisfies rule 3 instance 1."

      - from: [DRAFT, READY_FOR_REVIEW]
        to: PUBLISHED
        trigger: "POST /festivals/{fid}/program-versions/{vid}/publish"
        actor: FestivalProducer
        preconditions:
          - "Parent Festival.status ∈ {SCHEDULING, PUBLISHED} (so a second publish is permitted, and that's how supersession arises)."
          - "Every ProgramItem under the version has its required-rider list either empty or all `is_blocking=false` riders unfulfilled-but-non-blocking — i.e., no blocking rider is unfulfilled.  Otherwise ERR_BLOCKING_RIDERS_UNFULFILLED."
          - "OCC: client's `If-Match: <version_number>` header (when supplied) matches the row's `version` integer, otherwise ERR_VERSION_CONFLICT.  This is the optimistic-concurrency contract on a privileged transition where lost-update would silently demote a competing publisher."
        side_effects:
          - "ProgramVersion.published_at ← server clock (real_now + Festival.clock_offset_seconds)."
          - "ProgramVersion.program_item_ids ← snapshot of the version's current ProgramItem ids (pinning)."
          - "Festival.current_program_version_id ← this.id."
          - "If a prior ProgramVersion was PUBLISHED, it flips to SUPERSEDED and its `superseded_by_version_id` is stamped with this.id."
          - "A ScheduleChange of change_kind=VERSION_PUBLISH is auto-emitted with sync_envelopes seeded for the four external targets."
          - "Festival transitions SCHEDULING → PUBLISHED on the first publish; subsequent publishes leave Festival.status as PUBLISHED."
          - "AuditEntry appended."

      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system — a sibling ProgramVersion under the same festival publishes"
        actor: system
        preconditions:
          - "Festival.current_program_version_id changed to a different ProgramVersion.id."
        side_effects:
          - "This version's `superseded_by_version_id` is stamped with the new pinned version's id."
          - "ProgramItems whose `program_version_id` equals this superseded version's id are NOT auto-cancelled — they simply become unreachable for transitions that require the version to be authoritative (the program-version-supersession cross-entity-state check, rule 7 instance A).  This avoids silent mass cancellations on every publish."
          - "AuditEntry appended."

      - from: [DRAFT, READY_FOR_REVIEW]
        to: WITHDRAWN
        trigger: "POST /festivals/{fid}/program-versions/{vid}/withdraw"
        actor: FestivalProducer
        preconditions:
          - "Version has never been PUBLISHED."
        side_effects:
          - "ProgramItems referencing the withdrawn version are NOT cascaded — they remain in their current status but become un-publishable.  The orchestrator's normal flow is to migrate items to a new draft version before withdrawing."

  - entity: ProgramItem
    field: "status (lifecycle axis) and sound_check_status (parallel axis)"
    initial_state: "PROPOSED on lifecycle; NOT_REQUIRED on sound-check axis"
    terminal_states: [PERFORMED, CANCELLED]
    shape: parallel_dimensions
    note: |
      Two state axes evolve independently on the same row, which is the
      'parallel state dimensions on one entity' shape called out by §0.5 rule
      3.  The lifecycle axis is linear-with-branch (PROPOSED → CONFIRMED →
      ANNOUNCED → ON_STAGE → PERFORMED, plus a CANCELLED branch from any
      non-terminal lifecycle state), while the sound_check_status axis is
      driven exclusively by SoundCheckSlot transitions and runs NOT_REQUIRED
      → REQUESTED → SCHEDULED → COMPLETED in parallel.  WAIVED on the
      sound-check axis is the explicit-skip terminal.  The two axes
      synchronise only at one point: ProgramItem may not transition
      CONFIRMED → ANNOUNCED while it has any blocking riders unfulfilled OR
      while sound_check_status ∈ {REQUESTED, SCHEDULED} and the item's
      `category != HEADLINER` (a coarse rule the scenario hints at — a
      HEADLINER's announcement is allowed even before sound-check is fully
      scheduled, because the announcement drives ticket sales).  See the
      cross-entity-state-dependency rule 7 instance B for the sound-check
      side of the gate.
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /festivals/{fid}/program-items/{piid}/confirm"
        actor: ArtistLiaison
        preconditions:
          - "Parent Festival.status ∈ {SCHEDULING, PUBLISHED}."
          - "The item's `program_version_id` equals Festival.current_program_version_id once a version has been published; before the first publish, any version_id pointing to a non-WITHDRAWN, non-SUPERSEDED ProgramVersion under the festival is accepted.  Otherwise ERR_PROGRAM_VERSION_SUPERSEDED.  This is the festival↔program-item cross-entity-state dependency for rule 7 instance A."
          - "Artist.tier-and-travel checks pass: travel_buffer ≥ TRAVEL_HOURS_MIN_SECONDS using the artist's per-row override if set (ERR_ARTIST_TRAVEL_BUFFER_VIOLATION)."
          - "No multi-festival conflict with Artist.external_commitments (ERR_ARTIST_MULTI_FESTIVAL_CONFLICT) — the artist's external commitments' half-open windows must not intersect this item's half-open window."
          - "Stage-changeover-buffer overlap check passes (ERR_STAGE_CHANGEOVER_OVERLAP) — the per-stage padded-closed interval rule of §1.3 `stage_changeover_overlap_check`."
          - "Equipment-kit aggregate-capacity check passes (ERR_EQUIPMENT_KIT_OVERSUBSCRIBED) — the across-stage max-overlap-count rule of §1.3 `equipment_kit_capacity_check`."
          - "Artist-self-overlap check passes: no other ProgramItem of the same artist_id under any festival in CONFIRMED|ANNOUNCED|ON_STAGE state has an intersecting half-open window (ERR_ARTIST_SELF_OVERLAP)."
          - "OCC version match if If-Match header supplied."
        side_effects:
          - "ProgramItem.slot_priority_score recomputed."
          - "AuditEntry appended (event_category=STATE_TRANSITION)."
          - "The validation priority ordering is the standard one (auth → existence → state → business_safety → business_temporal → business_referential → business_fiscal), so when the multi-festival-temporal-conflict and the program-version-supersession both fail simultaneously, the state-category program-version-supersession error wins.  That pairing is the rule-5 instance A in §1.8."

      - from: CONFIRMED
        to: ANNOUNCED
        trigger: "POST /festivals/{fid}/program-items/{piid}/announce"
        actor: ArtistLiaison
        preconditions:
          - "All blocking RiderRequirements under the item have non-null `fulfilled_at`."
          - "Either Artist.tier is HEADLINER (the headliner-announcement-without-soundcheck carve-out), OR `sound_check_status` ∈ {COMPLETED, WAIVED, NOT_REQUIRED}.  See cross-entity-state-dependency rule 7 instance B."
          - "Parent Festival is PUBLISHED (otherwise the announcement has no public surface): ERR_FESTIVAL_NOT_PUBLISHED."
        side_effects:
          - "A ScheduleChange of change_kind=TICKET_NOTIFY is emitted, fanning out the announcement to the four downstream targets — this is the standard event-driven-synchronisation surface for announcements."
          - "TicketType rows whose `tied_program_item_ids` includes this item have their `provisional_refund_cents_outstanding` recomputed to zero (an item moving forward in lifecycle clears any pending refund estimate that was hanging on its provisional cancellation)."
          - "ProgramItem.announcement_sync_state ← QUEUED."
          - "AuditEntry appended."

      - from: ANNOUNCED
        to: ON_STAGE
        trigger: "system — POST /_clock/advance crosses ProgramItem.start_time and the parent Festival is in LIVE"
        actor: system
        preconditions:
          - "Festival.status == LIVE."
          - "real_now + Festival.clock_offset_seconds ≥ start_time."
        side_effects:
          - "AuditEntry appended (event_category=CLOCK_TICK)."

      - from: ON_STAGE
        to: PERFORMED
        trigger: "system — POST /_clock/advance crosses ProgramItem.end_time"
        actor: system
        preconditions:
          - "real_now + Festival.clock_offset_seconds ≥ end_time."
        side_effects:
          - "Any PLANNED ExposureAllocation tied to this item by program_item_id is unlocked for deliver (the ExposureAllocation.deliver precondition is exactly `tied ProgramItem.status == PERFORMED`, which is rule 7 instance C cross-entity dependency)."
          - "AuditEntry appended."

      - from: [PROPOSED, CONFIRMED, ANNOUNCED]
        to: CANCELLED
        trigger: "POST /festivals/{fid}/program-items/{piid}/cancel  (direct), OR ScheduleChange.apply with change_kind=ITEM_CANCEL targeting this item, OR Festival cancel cascade"
        actor: "ArtistLiaison | system"
        preconditions:
          - "Item is in PROPOSED, CONFIRMED, or ANNOUNCED.  ON_STAGE cannot be cancelled — the orchestrator has to wait for PERFORMED or treat the gap as a no-show, which the scenario's scope does not cover."
          - "When invoked directly (without a parent ScheduleChange), an idempotency_key is OPTIONAL but if supplied is checked against a recent identical cancel within IDEMPOTENCY_WINDOW_SECONDS to suppress duplicate refunds (ERR_IDEMPOTENCY_KEY_REUSED on mismatched bodies, silent dedup on matched bodies)."
        side_effects:
          - "Cascade A (depth ≥ 3, rule 4 instance A): the cancellation flips every SoundCheckSlot of this item in REQUESTED|SCHEDULED to CANCELLED (link 1, ProgramItem→SoundCheckSlot), each cancelled slot in turn flips its SoundEngineerTeam.status from BUSY to AVAILABLE if that slot was the team's current_booking_id (link 2, SoundCheckSlot→SoundEngineerTeam), and each freed team appends an AuditEntry of event_category=STATE_TRANSITION recording the team-status flip (link 3, SoundEngineerTeam→AuditEntry).  Each link is caused strictly by the prior one — the team flip is caused by the slot cancel, not by the original program-item cancel directly."
          - "Cascade B (depth 2, rule 4 instance B), fired in parallel to A: every ExposureAllocation whose `program_item_id` equals this item flips PLANNED|DELIVERED → VOIDED, appending a FulfilmentLog row of event_type=PROGRAM_VOIDED (link 1, ProgramItem→ExposureAllocation), which itself triggers a recomputation of the parent SponsorTier.tier_remaining_quota and projected_fulfilment_pct (link 2, ExposureAllocation→SponsorTier).  The originating trigger of cascade B (a direct cancel on the program item) is different from the originating trigger of cascade A (which, in the worked example for §1.8 rule 4 instance A, is a ScheduleChange.apply of kind ITEM_CANCEL — and the ScheduleChange.apply path also cascades the same sound-check chain, so the wording is precise: cascade A originates from ScheduleChange.apply, cascade B originates from POST /program-items/{piid}/cancel direct.  Cascade C originates from POST /_clock/advance and is the festival-close→rehearsal-archive→audit-fanout chain documented on the Festival CLOSED transition above)."
          - "An ITEM_CANCEL-kind ScheduleChange is auto-created (when the cancel was not itself the apply of a ScheduleChange — to avoid infinite recursion the implementation flags 'cascade origin' on the parent change and skips auto-emission for descendants).  The ScheduleChange runs the refund-and-sync side-effect chain.  When the cancellation arose from a Festival cancel, the originating change is the festival-level cancel record and per-item ScheduleChanges are batched under it."
          - "For every tied TicketType in `tied_program_item_ids`, the provisional refund formula in §1.3 fires and increments TicketType.provisional_refund_cents_outstanding; the corresponding ScheduleChange's provisional_refund_cents_total is set to the across-types sum."
          - "AuditEntry appended (event_category=SCHEDULE_CHANGE, payload_summary the human-readable cascade summary)."

      - description: "Sound-check axis transitions are driven externally by the SoundCheckSlot machine and the ProgramItem.sound_check_status field is updated as a side-effect of each SoundCheckSlot transition.  The two axes do not interlock except at the announcement-precondition described above."
        from: "(axis sound_check_status)"
        to: "(NOT_REQUIRED → REQUESTED → SCHEDULED → COMPLETED, or any → WAIVED via POST .../sound-check/waive, or any non-terminal → CANCELLED when the parent ProgramItem cancels)"
        trigger: "side-effect of the SoundCheckSlot machine and of POST /festivals/{fid}/program-items/{piid}/sound-check/waive"
        actor: "system (cascade) | StageManager (waive)"
        preconditions: []
        side_effects:
          - "AuditEntry appended per axis transition."

  - entity: SoundCheckSlot
    field: status
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    shape: branching
    note: "REQUESTED → SCHEDULED upon team assignment; REQUESTED|SCHEDULED → CANCELLED on parent-cancel cascade or explicit cancel; SCHEDULED → COMPLETED on mark-complete.  The two outbound edges from SCHEDULED — to COMPLETED or CANCELLED — make the shape branching."
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "PATCH /festivals/{fid}/sound-checks/{scid}  with {sound_engineer_team_id, scheduled_window_start, scheduled_window_end}"
        actor: StageManager
        preconditions:
          - "Parent ProgramItem.status ∈ {CONFIRMED, ANNOUNCED} (cross-entity dependency: a sound-check cannot be scheduled before its program-item is at least CONFIRMED).  This is rule 7 instance B (ProgramItem ↔ SoundCheckSlot)."
          - "Referenced SoundEngineerTeam.status == AVAILABLE (the team is not currently committed to another slot).  This is the second half of the cross-entity gate."
          - "The proposed window does not overlap any other SoundCheckSlot of the same SoundEngineerTeam in status SCHEDULED|COMPLETED, accounting for the team's `warmup_minutes` gap (the closed-with-one-sided-warmup-gap interval semantics in §1.3 `sound_engineer_team_overlap_check`)."
          - "The slot window lies wholly within the parent ProgramItem's pre-show window: scheduled_window_end ≤ ProgramItem.start_time − TEAM_HANDOFF_SECONDS, and scheduled_window_start ≥ Festival.start_time."
          - "If the parent ProgramItem's `stage_id` differs from the slot's persisted `stage_id` (i.e., the program item swapped stages after the slot was created), the slot must first be cancelled and recreated.  The race where the swap and the schedule arrive simultaneously is covered by concurrency rule 'soundcheck-stage-mismatch' in §1.2.1."
        side_effects:
          - "SoundEngineerTeam.status ← BUSY, current_booking_id ← this.id."
          - "Parent ProgramItem.sound_check_status ← SCHEDULED (the parallel-axis side-effect mentioned on the ProgramItem machine)."
          - "AuditEntry appended."

      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /festivals/{fid}/sound-checks/{scid}/complete"
        actor: StageManager
        preconditions:
          - "Slot is SCHEDULED."
          - "real_now + Festival.clock_offset_seconds ≥ scheduled_window_end (cannot mark complete before the window has closed — the boundary is ≥, inclusive)."
        side_effects:
          - "SoundEngineerTeam.status ← AVAILABLE, current_booking_id ← null."
          - "Parent ProgramItem.sound_check_status ← COMPLETED."
          - "AuditEntry appended."

      - from: [REQUESTED, SCHEDULED]
        to: CANCELLED
        trigger: "POST /festivals/{fid}/sound-checks/{scid}/cancel  OR parent-cancel cascade from ProgramItem"
        actor: "StageManager | system"
        preconditions:
          - "Slot is non-terminal."
        side_effects:
          - "If the slot was SCHEDULED and its team's current_booking_id equals this.id, SoundEngineerTeam flips BUSY → AVAILABLE and current_booking_id ← null.  This is the second link of cascade A (rule 4 instance A) when the cancel itself is a child of a parent-ProgramItem cancel."
          - "Parent ProgramItem.sound_check_status reverts to REQUESTED if there is still another non-cancelled slot for the same item, otherwise to NOT_REQUIRED."
          - "AuditEntry appended."

  - entity: SoundEngineerTeam
    field: status
    initial_state: AVAILABLE
    terminal_states: [WITHDRAWN]
    shape: "cycle on availability axis (AVAILABLE ↔ BUSY) with a terminal staffing-removed state"
    transitions:
      - from: AVAILABLE
        to: BUSY
        trigger: "system — referenced by a SoundCheckSlot transitioning REQUESTED → SCHEDULED"
        actor: system
        preconditions: []
        side_effects:
          - "current_booking_id ← the slot's id."

      - from: BUSY
        to: AVAILABLE
        trigger: "system — the slot referenced by current_booking_id transitions SCHEDULED → COMPLETED|CANCELLED"
        actor: system
        preconditions: []
        side_effects:
          - "current_booking_id ← null."
          - "AuditEntry appended.  When the chain originates from a ProgramItem cancel, this is the third hop of cascade A in rule 4."

      - from: [AVAILABLE, BUSY]
        to: WITHDRAWN
        trigger: "POST /festivals/{fid}/sound-engineer-teams/{tid}/withdraw"
        actor: StageManager
        preconditions:
          - "Team is not the current_booking_id of any SCHEDULED slot (ERR_TEAM_HAS_ACTIVE_SLOT).  The orchestrator must cancel the slot first."
        side_effects:
          - "AuditEntry appended."

  - entity: Rehearsal
    field: status
    initial_state: BOOKED
    terminal_states: [ARCHIVED, CANCELLED]
    shape: linear_with_branch
    note: "BOOKED → IN_PROGRESS auto-triggered when the clock crosses start_time; IN_PROGRESS → ARCHIVED auto-triggered when the clock crosses end_time + REHEARSAL_GRACE_SECONDS or when the parent Festival closes (the cascade C link of rule 4).  BOOKED → CANCELLED on explicit cancel."
    transitions:
      - from: BOOKED
        to: IN_PROGRESS
        trigger: "system — POST /_clock/advance crosses start_time and parent Festival.status ∈ {PUBLISHED, LIVE}"
        actor: system
        preconditions:
          - "real_now + Festival.clock_offset_seconds ≥ start_time."
        side_effects:
          - "AuditEntry appended (event_category=CLOCK_TICK)."

      - from: IN_PROGRESS
        to: ARCHIVED
        trigger: "system — POST /_clock/advance crosses end_time + REHEARSAL_GRACE_SECONDS, OR Festival CLOSED cascade"
        actor: system
        preconditions:
          - "real_now + Festival.clock_offset_seconds ≥ end_time + REHEARSAL_GRACE_SECONDS, OR Festival.status flipped to CLOSED on this clock tick."
        side_effects:
          - "Rehearsal.archive_uri ← 'archive://festival/<festival_id>/rehearsal/<this.id>' (a deterministic synthetic uri the test asserts is non-null and equals the expected string for the festival-close cascade case)."
          - "AuditEntry appended.  When the archive arose from the festival-close cascade, the event_category is CLOCK_TICK with subject_entity_type='Rehearsal' and payload_summary names the originating festival-close event id, completing the link-2 → link-3 hop of rule-4 cascade C."

      - from: BOOKED
        to: CANCELLED
        trigger: "POST /festivals/{fid}/rehearsals/{rid}/cancel"
        actor: StageManager
        preconditions:
          - "Rehearsal is BOOKED.  An IN_PROGRESS rehearsal cannot be cancelled — only archived."
        side_effects:
          - "AuditEntry appended."

      - from: [BOOKED, IN_PROGRESS]
        to: ARCHIVED
        trigger: "system — Festival.status transition to CLOSED (this is the link-2 of cascade C in rule 4)"
        actor: system
        preconditions:
          - "Parent Festival just transitioned to CLOSED."
        side_effects:
          - "archive_uri stamped as above."
          - "An AuditEntry appended whose payload_summary includes the originating clock-tick event id."

  - entity: TicketType
    field: status
    initial_state: ACTIVE
    terminal_states: [CLOSED, WITHDRAWN]
    shape: cyclic_with_terminal
    note: "ACTIVE ↔ SUSPENDED is the operational on/off cycle (a second-entity cycle next to ProgramVersion's draft/review cycle, satisfying rule 3 with two distinct cycles on different entities — even though the program-item parallel axis is the primary rule-3 ground, the ticket-type cycle is a worked redundancy).  Both ACTIVE and SUSPENDED transition to CLOSED on festival close (or WITHDRAWN if the type was SUSPENDED at the moment the festival closed)."
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /festivals/{fid}/ticket-types/{ttid}/suspend"
        actor: TicketingAdmin
        preconditions:
          - "Type is ACTIVE."
        side_effects:
          - "No issuance is accepted while SUSPENDED — POST /issue returns ERR_TICKET_TYPE_NOT_ACTIVE.  Refund-confirmed events keyed against a suspended type are still applied (the external system is allowed to ACK already-pending refunds across the operator's local pause)."
          - "AuditEntry appended."

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /festivals/{fid}/ticket-types/{ttid}/resume"
        actor: TicketingAdmin
        preconditions:
          - "Type is SUSPENDED and parent Festival.status ∈ {SCHEDULING, PUBLISHED, LIVE}."
        side_effects:
          - "AuditEntry appended."

      - from: [ACTIVE, SUSPENDED]
        to: CLOSED
        trigger: "system — parent Festival transitions to CLOSED (the link of the festival-close cascade that affects ticket types)"
        actor: system
        preconditions:
          - "Festival.status just became CLOSED."
          - "Type was ACTIVE at the moment of festival close.  If it was SUSPENDED, the type instead goes to WITHDRAWN.  This branching on the prior status is the small fork in the otherwise-linear close cascade."
        side_effects:
          - "issued_count and refunded_count are frozen as-of festival close — they no longer change.  Any later POST /_events/refund-confirmed targeting a CLOSED type is rejected (ERR_FESTIVAL_ALREADY_CLOSED)."
          - "AuditEntry appended."

      - from: SUSPENDED
        to: WITHDRAWN
        trigger: "system — Festival close cascade when the type was SUSPENDED at close time"
        actor: system
        preconditions:
          - "Type was SUSPENDED and Festival.status just became CLOSED."
        side_effects:
          - "AuditEntry appended."

  - entity: ExposureAllocation
    field: status
    initial_state: PLANNED
    terminal_states: [REPORTED, VOIDED]
    shape: linear_with_void_branch
    note: "PLANNED → DELIVERED upon the first DELIVERED FulfilmentLog event under the allocation.  DELIVERED → REPORTED upon POST /_sweep/run after the festival closes.  Any non-terminal state may transition to VOIDED, which is the cascade from a ProgramItem.cancel that the allocation was tied to (rule 4 cascade B) or the explicit void-delivery operation.  The compensating-action invariant for the deliver/void pair pins SponsorTier.tier_remaining_quota across the round-trip (rule 9 instance B)."
    transitions:
      - from: PLANNED
        to: DELIVERED
        trigger: "POST /festivals/{fid}/exposure-allocations/{aid}/deliver  with {units} payload, which atomically appends a FulfilmentLog row of event_type=DELIVERED"
        actor: SponsorshipAdmin
        preconditions:
          - "Tied ProgramItem.status == PERFORMED for allocations with non-null `program_item_id` (the cross-entity-state gate of rule 7 instance C).  For festival-wide allocations (program_item_id null), the gate is Festival.status ∈ {LIVE, CLOSED}."
          - "Sum of existing DELIVERED FulfilmentLog units on this allocation, plus the new units, must be ≤ actual_units (the post-waterfall ceiling)."
          - "Parent SponsorTier's `tier_remaining_quota` ≥ units."
        side_effects:
          - "A FulfilmentLog row is appended with event_type=DELIVERED, units as supplied."
          - "Allocation.delivered_units is recomputed as Σ(DELIVERED units) − Σ(VOIDED units) from the log."
          - "SponsorTier.tier_remaining_quota is recomputed as contracted_units − Σ allocation.delivered_units for the tier."
          - "AuditEntry appended (event_category=EXPOSURE)."

      - from: DELIVERED
        to: REPORTED
        trigger: "system — POST /_sweep/run after the festival has closed."
        actor: system
        preconditions:
          - "Festival.status == CLOSED.  Pre-close sweeps are no-ops on this state edge — they may refresh projected_fulfilment_pct but they cannot flip allocations to REPORTED while the festival is still live (this ordering disambiguates the dual-variant projected-vs-actual percentage)."
        side_effects:
          - "A FulfilmentLog row of event_type=REPORTED is appended with units=0 (the closing-tally event)."
          - "SponsorTier.actual_fulfilment_pct is recomputed from the closed-festival's delivered counts and stored.  Before this sweep, actual_fulfilment_pct is null; after it, it is fixed.  projected_fulfilment_pct may continue to drift as the implementation chooses but the test assertions are anchored on actual_fulfilment_pct."
          - "AuditEntry appended (event_category=EXPOSURE)."

      - from: DELIVERED
        to: DELIVERED  # self-loop on additional delivery
        trigger: "POST /festivals/{fid}/exposure-allocations/{aid}/deliver  (subsequent deliveries on the same allocation)"
        actor: SponsorshipAdmin
        preconditions:
          - "Same as the PLANNED → DELIVERED preconditions; just no state name change."
        side_effects:
          - "Same as above plus another FulfilmentLog row.  The self-loop edge is documented explicitly so the state-machine table is unambiguous about multiple deliveries being a non-terminal-revisit-of-same-state pattern."

      - from: [PLANNED, DELIVERED]
        to: VOIDED
        trigger: "POST /festivals/{fid}/exposure-allocations/{aid}/void-delivery, OR ProgramItem.cancel cascade B link 1, OR Festival.cancel fan-out"
        actor: "SponsorshipAdmin | system"
        preconditions:
          - "Allocation is non-terminal."
          - "When invoked manually (not as a cascade), the request body carries a `reason` string (ERR_MISSING_VOID_REASON)."
        side_effects:
          - "A FulfilmentLog row is appended with event_type=VOIDED for the manual case, or PROGRAM_VOIDED for the ProgramItem-cancel cascade.  In both cases the units field equals the allocation's currently-delivered units so the parent's delivered_units returns to zero (the inverse-of-deliver invariant of rule 9 instance B)."
          - "Parent SponsorTier.projected_fulfilment_pct and tier_remaining_quota are recomputed (this is the second link of cascade B in rule 4 — ExposureAllocation→SponsorTier)."
          - "AuditEntry appended."

  - entity: ScheduleChange
    field: status
    initial_state: PROPOSED
    terminal_states: [SYNCED, REJECTED, REVERTED]
    shape: branching_fork
    note: |
      The PROPOSED state forks to APPLIED (apply path) or REJECTED (reject
      path).  APPLIED then advances to SYNCED once every sync_envelopes
      element has ACKED, or to REVERTED if the orchestrator pulls the change
      back before any ACK arrives and the inverse fan-out is emitted.
      Branching-fork in shape, and the originating-trigger pattern is the
      one rule 4 cascade A is grounded on.
    transitions:
      - from: PROPOSED
        to: APPLIED
        trigger: "POST /festivals/{fid}/schedule-changes/{scid}/apply"
        actor: FestivalProducer
        preconditions:
          - "Change is PROPOSED."
          - "Idempotency-key check: if the original POST carried an idempotency_key and a recent ScheduleChange with the same key and the same payload-hash exists, the apply returns the existing change's apply response; a same-key-different-body collision returns ERR_IDEMPOTENCY_KEY_REUSED.  OCC also applies on the change row itself."
          - "When change_kind == ITEM_CANCEL, the target ProgramItem is in {PROPOSED, CONFIRMED, ANNOUNCED}.  When change_kind == ITEM_RESCHEDULE, the new window passes the same overlap-and-buffer checks as a fresh confirm."
        side_effects:
          - "The change's effect runs: cancel-and-refund for ITEM_CANCEL (link 1 of cascade A); reschedule-window-and-re-check for ITEM_RESCHEDULE; stage swap for STAGE_SWAP; the standalone notification fan-out for TICKET_NOTIFY and VERSION_PUBLISH."
          - "For ITEM_CANCEL the cancellation of the target ProgramItem cascades to its sound-checks (link 2 of cascade A) and its exposure allocations (the parallel cascade B fan-out)."
          - "ScheduleChange.provisional_refund_cents_total is stamped to the across-ticket-types sum of provisional refund cents (the forward-looking variant of rule 1 instance A)."
          - "Four sync_envelopes records are seeded — one per target in {ticketing, im, broadcasting, sponsor} — each with status=QUEUED, queued_at set, payload_hash computed."
          - "ScheduleChange.applied_at stamped."
          - "AuditEntry appended (event_category=SCHEDULE_CHANGE)."

      - from: APPLIED
        to: SYNCED
        trigger: "system — the last QUEUED sync_envelope element flipping to ACKNOWLEDGED via POST /_events/sync-ack"
        actor: system
        preconditions:
          - "All four sync_envelopes elements are in status ACKNOWLEDGED."
        side_effects:
          - "AuditEntry appended (event_category=SYNC_ACK)."

      - from: APPLIED
        to: REVERTED
        trigger: "POST /festivals/{fid}/schedule-changes/{scid}/revert"
        actor: FestivalProducer
        preconditions:
          - "Change is APPLIED."
          - "No sync_envelopes element has reached status ACKNOWLEDGED yet (ERR_CHANGE_ALREADY_ACKED).  The 'revert before external ACK' rule is what makes the apply/revert pair a clean compensating action — once the external systems have observed the change, the compensation has to go forward as a separate inverse change, not as a revert."
        side_effects:
          - "Inverse-fan-out: every side-effect of the apply is undone.  For ITEM_CANCEL, the cancelled ProgramItem is restored to its prior status (the status before the apply, captured in the from_state field of the corresponding AuditEntry).  Sound-check cancellations are NOT auto-reinstated — those are operator decisions — but the festival's outstanding_tickets_total invariant of rule 9 instance A is restored: TicketType.provisional_refund_cents_outstanding rows that were incremented at apply are decremented back to zero, and no real refund is ever issued because the ticketing-system ACK never arrived."
          - "All four sync_envelopes elements that were QUEUED transition to status=CANCELLED (a small extension to the QUEUED|ACKNOWLEDGED|FAILED set noted here so the test can assert the inverse fan-out).  Note for the doc generator: the precise sync_envelope status enum is {QUEUED, ACKNOWLEDGED, FAILED, CANCELLED}, with CANCELLED reserved for the revert path."
          - "AuditEntry appended (event_category=SCHEDULE_CHANGE, payload_summary='reverted')."

      - from: PROPOSED
        to: REJECTED
        trigger: "POST /festivals/{fid}/schedule-changes/{scid}/reject"
        actor: FestivalProducer
        preconditions:
          - "Change is PROPOSED."
          - "A reason string is supplied (ERR_MISSING_REJECTION_REASON)."
        side_effects:
          - "No cascade.  AuditEntry appended."

      - description: "POST /_events/sync-ack flips a specific element of an APPLIED change's sync_envelopes array from QUEUED to ACKNOWLEDGED.  When the change_kind is ITEM_CANCEL and the target element is target='ticketing' and the request body contains `{final_refund_cents_total}`, the same call also stamps the change's final_refund_cents_total field, which is the chronological half of the rule 1 instance A dual-variant.  Conceptually this is `POST /_events/refund-confirmed` rolled into the generic sync-ack endpoint with a discriminator in the body — the §1.5 endpoint table breaks them out as two distinct paths for ergonomic clarity but they share the same audit-row semantics.  Either path appends an AuditEntry of event_category=SYNC_ACK."
        from: "(sync_envelopes element)"
        to: "ACKNOWLEDGED (or FAILED on explicit fail flag)"
        trigger: "POST /_events/sync-ack OR POST /_events/refund-confirmed"
        actor: system
        preconditions:
          - "The targeted sync_envelopes element exists in status QUEUED."
          - "For POST /_events/refund-confirmed, the `final_refund_cents_total` is non-negative and ≤ the change's provisional_refund_cents_total + an ABS_TOLERANCE_CENTS=0 (i.e., the external system may not refund more than the festival projected; equality is the standard case, and the admin-fee deduction makes the final smaller).  Otherwise ERR_REFUND_EXCEEDS_PROVISIONAL."
        side_effects:
          - "ScheduleChange.final_refund_cents_total ← payload's final_refund_cents_total (rule 1 instance A chronological-variant result)."
          - "TicketType.refunded_count is incremented by the per-type breakdown carried in the ACK payload (`{ticket_type_id, count}` list)."
          - "TicketType.provisional_refund_cents_outstanding is decremented by the matching provisional amount (clears the pending bucket)."
          - "AuditEntry appended (event_category=SYNC_ACK)."

  - entity: AuditEntry
    field: "(append-only — no state machine)"
    initial_state: "(none, immutable on creation)"
    terminal_states: []
    shape: append_only
    note: "AuditEntry rows are immutable.  They have no state transitions of their own — the 'append' itself is the only operation.  Listed here for completeness because the spec asks for every entity's lifecycle to be expressed: an append-only log's lifecycle is a single-state machine."
    transitions: []

# -----------------------------------------------------------------------------
# §1.2.1  Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:

  - scenario: "Two FestivalProducers POST /festivals/{fid}/program-versions/{vid}/publish on two different DRAFT versions of the same Festival simultaneously."
    guarantee: "Exactly one publish succeeds and pins Festival.current_program_version_id; the other is rejected because the Festival row's `version` integer no longer matches the loser's CAS read."
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "Compare-and-swap on Festival.current_program_version_id keyed by Festival.version (the integer OCC field).  Winner is the first apply; loser's read-modify-write fails the CAS and returns ERR_VERSION_CONFLICT.  An AuditEntry of event_category=OCC_CONFLICT is appended for the loser."

  - scenario: "Two simultaneous PATCH /festivals/{fid}/sound-checks/{scid} requests propose to assign the same SoundEngineerTeam to the same SoundCheckSlot's REQUESTED → SCHEDULED transition."
    guarantee: "Exactly one assignment succeeds.  The loser's call returns the team-double-book error because the team's status flipped to BUSY in the winner's transaction."
    error_id: ERR_ENGINEER_TEAM_DOUBLE_BOOKED
    http_status: 409
    serialization: "Lock-on-team: the implementation acquires a row lock on the SoundEngineerTeam.id and checks `status == AVAILABLE && current_booking_id IS NULL`.  Winner flips it to BUSY; loser sees BUSY and returns the error."

  - scenario: "Two ExposureAllocation POSTs from two different sponsors in the same tier_code race for the last unit in the festival's catalog pool for the same `kind`."
    guarantee: "Exactly one POST succeeds with `actual_units` equal to the remaining pool; the other succeeds with `actual_units = 0` (allocations of zero actual units are permitted and surface in the post-event report as 0% delivery, distinct from being rejected).  The deterministic tie-break is priority_rank ascending, then sponsor_external_id lexicographic."
    error_id: ERR_TIER_POOL_EXHAUSTED
    http_status: 409
    serialization: "Serialise on the festival-level catalog pool counter for the (kind, tier_code) pair.  When the pool is empty before the deterministic tie-break can be applied (i.e., the second sponsor's allocation arrives after the pool is drained by the higher-priority sponsor's sweep), the second allocation is created in PLANNED with actual_units=0 — not an outright rejection, because the contract permits a zero-unit row to be reported on at festival close.  When the second POST arrives with a higher priority_rank than the first but the first has already locked the pool (a true race), the loser of the lock is rejected with ERR_TIER_POOL_EXHAUSTED.  The implementation must run the waterfall sweep `POST /festivals/{fid}/sponsor-allocation-sweep` to re-shuffle once after the race resolves so the deterministic priority order is honoured globally rather than per-arrival; the sweep itself is idempotent."
    note: "The two outcomes (zero-actual-units row vs ERR_TIER_POOL_EXHAUSTED rejection) are split into two concurrency_rules entries below to honour the §1.2.1 'one error_id per scenario' rule.  This first entry is the zero-units happy path; the second is the rejected-after-lock-loss path."

  - scenario: "Same race as the previous entry but the second sponsor's POST arrives while a row lock is held on the festival pool counter for the (kind, tier_code) pair by the first sponsor's allocation-sweep."
    guarantee: "The lock-loser is rejected outright rather than getting a zero-units row.  This is the distinct error from the same race scenario, split per the §1.2.1 'one error_id per scenario' rule."
    error_id: ERR_CONCURRENT_SWEEP_IN_PROGRESS
    http_status: 409
    serialization: "Festival-level advisory lock keyed on the festival_id and the literal string 'sponsor-allocation-sweep'.  Held for the duration of POST /festivals/{fid}/sponsor-allocation-sweep.  Other allocation POSTs against the same festival during the sweep return the error.  The sweep itself is idempotent and the orchestrator retries on the lock-conflict."

  - scenario: "Two `POST /festivals/{fid}/program-items/{piid}/cancel` requests arrive at the same time for the same item, carrying different (or no) idempotency_keys."
    guarantee: "Exactly one cancel takes effect.  The second sees ProgramItem.status already CANCELLED and is rejected."
    error_id: ERR_PROGRAM_ITEM_ALREADY_CANCELLED
    http_status: 409
    serialization: "Row lock on the ProgramItem.  Winner flips status from {PROPOSED,CONFIRMED,ANNOUNCED} to CANCELLED.  Loser observes terminal state and returns the error.  When both calls carry the SAME idempotency_key with the SAME body hash, the second call returns the first's stored response without an error — this is the idempotency happy-path branch.  When the keys match but the bodies differ, the second returns ERR_IDEMPOTENCY_KEY_REUSED.  This three-way fork (idempotent dup, idempotent collision, non-idempotent race) is exactly the surface the test harness asserts on."

  - scenario: "POST /festivals/{fid}/schedule-changes/{scid}/apply and POST /festivals/{fid}/schedule-changes/{scid}/reject arrive simultaneously."
    guarantee: "Exactly one wins.  The losing call sees a non-PROPOSED state and is rejected."
    error_id: ERR_CHANGE_NOT_PROPOSED
    http_status: 409
    serialization: "Row lock on ScheduleChange.  First writer wins on the status field's CAS from PROPOSED to APPLIED or REJECTED.  AuditEntry of event_category=OCC_CONFLICT for the loser."

  - scenario: "POST /festivals/{fid}/ticket-types/{ttid}/issue lands on a TicketType whose tied ProgramItem the SponsorshipAdmin just cancelled (apply of an ITEM_CANCEL ScheduleChange) — the issue races against the cancel cascade flipping the type's `tied_program_item_ids` set to empty-after-removal."
    guarantee: "The issue either fully succeeds against the pre-cascade state and the cancel cascade then queues a refund on that newly-issued ticket via the standard refund-event flow, OR the issue fails because the cascade already removed the tied program item from the type and the zone-capacity check or the tie-validity check fails first.  The non-deterministic-but-consistent outcome is that at most one of {issue succeeds with refund queued, issue fails outright} happens — not both."
    error_id: ERR_TICKET_TYPE_TIE_INVALID
    http_status: 409
    serialization: "Read-committed: the cascade and the issue are serialised on the TicketType row.  When the cascade commits first, the issue sees the trimmed tied_program_item_ids and fails ERR_TICKET_TYPE_TIE_INVALID (the ticket-type's tied set has become empty or the issue's requested item is gone).  When the issue commits first, the cascade observes one extra issued ticket and increments the provisional_refund_cents_outstanding accordingly so the apply/revert invariant of rule 9 instance A is preserved."

  - scenario: "POST /_events/sync-ack and POST /festivals/{fid}/schedule-changes/{scid}/revert arrive at the same time for the same ScheduleChange.  The revert precondition is 'no envelope ACKed', so a successful ack must lose the race."
    guarantee: "Atomicity on the ScheduleChange row.  When the ack commits first, the revert sees a non-zero ACK count and is rejected.  When the revert commits first, the ack lands on a REVERTED change's envelopes and the envelope status was set to CANCELLED by the revert, so the ack returns the not-queued error."
    error_id: ERR_SYNC_ENVELOPE_NOT_QUEUED
    http_status: 409
    serialization: "Row lock on ScheduleChange.  The revert atomically flips every QUEUED envelope to CANCELLED.  A simultaneous ack reads the envelope's post-revert status and returns the not-queued error.  The reverse ordering is the mirror case."


# -----------------------------------------------------------------------------
# §1.3  Calculation Rules
# -----------------------------------------------------------------------------
# Global constants shared across calculations (each calculation also reiterates
# the constants it personally references in its own `constants:` block so the
# yaml is independently readable per row).
global_constants:
  STAGE_CHANGEOVER_BUFFER_SECONDS: 1800        # 30 minutes, default per-stage changeover buffer (Stage.changeover_buffer_seconds overrides)
  TRAVEL_HOURS_MIN: 4                          # default minimum travel-buffer hours between an artist's external commitment and a festival slot (Artist.minimum_travel_buffer_hours overrides)
  TEAM_WARMUP_MINUTES: 10                      # default warmup gap between consecutive SoundCheckSlots of one team (SoundEngineerTeam.warmup_minutes overrides)
  TEAM_HANDOFF_SECONDS: 600                    # required gap between a sound-check window end and the program-item's start_time (the engineer-to-front-of-house handoff)
  FESTIVAL_CLOSE_GRACE_SECONDS: 3600           # grace window after Festival.end_time before the auto-close clock-tick fires
  REHEARSAL_GRACE_SECONDS: 600                 # grace window after a Rehearsal's end_time before its auto-archive clock-tick fires
  IDEMPOTENCY_WINDOW_SECONDS: 86400            # idempotency-key lifetime
  ABS_TOLERANCE_CENTS: 0                       # ticket-system refund-confirmed payload must not exceed the festival's provisional figure by any positive amount
  ADMIN_FEE_RATE_FINAL: "0.05"                 # admin-fee deduction rate the external ticketing system applies on confirmed refunds (the dual-variant divergence driver for rule 1 instance A)
  PERCENT_PRECISION: 2                         # decimal places for fulfilment percentages, half-up
  CENT_PRECISION: 0                            # monetary values are integer cents — no fractional cents are stored anywhere
  HEADLINER_BONUS: 100
  OPENER_BONUS: 30
  TRAVEL_WEIGHT: "0.1"
  MULTI_FESTIVAL_CONFLICT_PENALTY: 20
  RIDER_WEIGHT: 2
  RIDER_CAP: 5
  MAIN_BONUS: 50                               # mid-tier bonus used by the slot_priority_score formula when Artist.tier == MAIN
  SURPRISE_BONUS: 10
  SPONSOR_PAYOUT_RATE_MILS_DEFAULT: 25         # default cents-per-thousand-units rate for sponsor payout when ExposureAllocation.pinned_rate_cents_per_unit is unspecified (the sub-cent-rate-times-three-line-items input that makes the rounding-order divergence land on exactly the one-cent boundary of the worked example below)
  WATERFALL_TIER_ORDER: ["TITLE", "GOLD", "SILVER"]  # the fixed evaluation order for the sponsor-exposure waterfall
  MAX_PROGRAM_ITEMS_PER_FESTIVAL: 500          # hard cap to avoid pathological inputs

calculations:

  - name: provisional_refund_amount
    description: "Forward-looking refund estimate stamped on a ScheduleChange.apply that cancels program-day coverage for ticket holders.  The forward-looking variant assumes a flat pro-rata distribution across festival days, ignoring the external ticketing system's admin-fee deduction.  Paired with `final_refund_amount` below, this is the dual-variant pair on the ticketing entity domain — rule 1 instance A in §1.8."
    trigger: "ScheduleChange.apply when change_kind == ITEM_CANCEL (and the festival close cascade per-item refund batches)."
    inputs:
      - "The set S of TicketType rows whose `tied_program_item_ids` contains the cancelled ProgramItem.id, with each row's `issued_count − refunded_count` (the live outstanding-tickets count) and `unit_price_cents`."
      - "Festival.festival_day_count as the divisor."
      - "The implicit constant `cancelled_days = 1` per ITEM_CANCEL (the cancelled item occupies one day in the per-day taxonomy of the scenario; multi-day cancellations are not in scope)."
    algorithm: forward_looking
    formula: |
      For each TicketType t in S:
        outstanding_t = t.issued_count - t.refunded_count
        per_ticket_cents_t = round_half_up( t.unit_price_cents * cancelled_days / Festival.festival_day_count )
        type_refund_cents_t = outstanding_t * per_ticket_cents_t
        t.provisional_refund_cents_outstanding += type_refund_cents_t
        AuditEntry appended summarising the per-type figure.
      Across the whole change:
        change.provisional_refund_cents_total = Σ_t type_refund_cents_t
      Rounding order is pinned: per-ticket cents are rounded once at the per-type-per-ticket step, then multiplied by the outstanding count (which is integer), then summed across types.  No further rounding.  Half-up rule on the per-ticket step ensures the standard banker's-half-up convention is not used (the scenario does not call for banker's rounding).
    constants:
      cancelled_days: 1
      ROUND_HALF_UP: true
    precision: "Integer cents.  No fractional cents anywhere.  The half-up step is on per-ticket cents only."
    variants:
      - name: forward_looking_pinned
        when: "Always — the provisional figure is by definition the forward-looking pro-rata estimate."
        difference: "Uses Festival.festival_day_count as the divisor and assumes no admin-fee deduction.  Differs from the chronological `final_refund_amount` variant of the paired calculation below by exactly the admin-fee factor."
    note: "Worked example (the §1.8 rule 1 instance A literal): unit_price_cents=12000, outstanding=3, festival_day_count=3, cancelled_days=1 → per_ticket=4000 cents, type_refund=12000 cents, change.provisional_refund_cents_total = 12000 (i.e., $120.00).  This number is the literal the difficulty-design test_recipe pins."

  - name: final_refund_amount
    description: "Chronological refund total reported by the external ticketing system through POST /_events/refund-confirmed (and through the unified POST /_events/sync-ack with a refund-discriminator body).  The chronological variant respects the admin-fee deduction that the external system actually charges per refunded ticket, which the forward-looking provisional figure ignores.  Together with `provisional_refund_amount` this pair is the dual-variant on the ticketing domain (rule 1 instance A)."
    trigger: "POST /_events/refund-confirmed targeting an APPLIED ScheduleChange of change_kind == ITEM_CANCEL.  Each ACK carries the externally-computed final cents per ticket type."
    inputs:
      - "The matching ScheduleChange row (its `provisional_refund_cents_total` is the upper bound)."
      - "The ACK payload's `refund_breakdown: [{ticket_type_id, refunded_count_delta, final_cents_total_for_type}]`."
      - "The implicit constant ADMIN_FEE_RATE_FINAL = 0.05."
    algorithm: chronological
    formula: |
      For each entry e in the ACK's refund_breakdown:
        TicketType t = lookup by e.ticket_type_id (must belong to the same festival as the ScheduleChange — ERR_CROSS_FESTIVAL_REFUND otherwise).
        t.refunded_count += e.refunded_count_delta.
        # The cents check: the external system reports its own per-ticket figure already net of admin fees.
        # The implementation accepts the figure as authoritative for `final_refund_cents_total`.
        # An invariant assertion (not a rejection) is logged when |final_per_ticket − provisional_per_ticket × (1 − ADMIN_FEE_RATE_FINAL)| > 1 cent, surfaced in the AuditEntry payload_summary as 'admin-fee anomaly'.
        # Going the other direction (final exceeds provisional) is a hard rejection: ERR_REFUND_EXCEEDS_PROVISIONAL, http 422.
        t.provisional_refund_cents_outstanding -= the provisional cents that were originally attributed to this type by the matching `provisional_refund_amount` invocation, so the pending bucket goes to zero on a full ACK.
      change.final_refund_cents_total = Σ_e e.final_cents_total_for_type.
    constants:
      ADMIN_FEE_RATE_FINAL: 0.05
      ROUND_HALF_UP: true
    precision: "Integer cents.  The ACK payload's `final_cents_total_for_type` is already integer-cents from the external system, so no rounding happens at this step."
    variants:
      - name: chronological_externalised
        when: "Always for this calc — the chronological variant is by definition the externally-acknowledged figure."
        difference: "Differs from `provisional_refund_amount` by the ADMIN_FEE_RATE_FINAL deduction the external ticketing system applies before issuing the refund.  Worked example matching the rule 1 instance A literal: provisional total $120.00 paired with a final total $114.00 (= 12000 − round_half_up(12000 × 0.05) = 12000 − 600 cents = 11400 cents)."
    note: "Worked-example divergence: 12000 provisional cents vs 11400 final cents on the same input data — the same ScheduleChange row's two columns end up unequal.  This non-equality is the test's primary assertion for the rule 1 dual-variant claim on the ticketing entity domain."

  - name: provisional_exposure_fulfilment_pct
    description: "Forward-looking sponsor-exposure-fulfilment percentage based on the festival's CURRENTLY SCHEDULED program items.  Each ExposureAllocation tied to a non-cancelled ProgramItem in {CONFIRMED, ANNOUNCED, ON_STAGE, PERFORMED} counts toward the projected delivery; cancelled-item ties don't.  Recomputed eagerly whenever a ProgramItem state changes or a new ExposureAllocation is created or voided.  This is the forward-looking half of the dual-variant pair on the SPONSOR entity domain — rule 1 instance B in §1.8, which along with the refund pair satisfies the rule's 'different entity domains' clause."
    trigger: "ProgramItem state transitions; ExposureAllocation create/void; POST /festivals/{fid}/sponsor-allocation-sweep (which is the explicit synchronous recompute the test harness drives)."
    inputs:
      - "All ExposureAllocation rows for the SponsorTier, grouped by `kind`."
      - "For each allocation, the tied ProgramItem.status (or 'festival-wide' when program_item_id is null)."
      - "The tier's `contracted_units` as the denominator."
    algorithm: aggregation
    formula: |
      For each SponsorTier in a festival:
        scheduled_units = 0
        for each ExposureAllocation a under this tier:
          if a.program_item_id is null:
            # festival-wide; counted once-and-only-once at apex of the festival window for the projection,
            # weighted by the fraction of the festival window that has not yet ended at projection time.
            # The projection time is `real_now + Festival.clock_offset_seconds`; if the festival has not
            # started yet, the full weight 1.0 applies; if it ended, the weight is 0 (and the actual
            # variant takes over).  In the projection formula, this fraction is rounded to two decimals
            # half-up and then multiplied by a.actual_units to yield the projected-units contribution.
            window_fraction_remaining = clamp(
              (Festival.end_time - max(real_now + Festival.clock_offset_seconds, Festival.start_time))
                / max(1, Festival.end_time - Festival.start_time),
              0.0, 1.0)
            projected = round_half_up(window_fraction_remaining * a.actual_units, 4)  # fractional units allowed at the intermediate, then summed in the next step before the final percent rounding
          else:
            # tied to a program item; counts the allocation's full actual_units when the item is in a
            # 'will-or-did-happen' status, zero when cancelled.
            tied_item = ProgramItem with id = a.program_item_id
            projected = a.actual_units if tied_item.status in {CONFIRMED, ANNOUNCED, ON_STAGE, PERFORMED} else 0
          scheduled_units += projected
        # The rounding order for the percent is pinned: sum the fractional projected contributions
        # first (the intermediate is a Decimal not a float), divide by contracted_units, multiply by
        # 100, and round once half-up to PERCENT_PRECISION decimals.  An alternative would be to
        # round each allocation's individual percentage and average them; the scaffold pins
        # 'sum-then-divide-then-round' so the test's expected literal is unambiguous.  This pinned
        # ordering is part of the combinatorial-mode-(b) story below in `sponsor_payout_total`, but
        # the same nested-rounding principle applies here.
        SponsorTier.projected_fulfilment_pct = round_half_up(
          (scheduled_units / SponsorTier.contracted_units) * 100,
          PERCENT_PRECISION)
    constants:
      PERCENT_PRECISION: 2
      ROUND_HALF_UP: true
    precision: "Percentages are stored as numbers with two decimal places, half-up."
    variants:
      - name: forward_looking_projection
        when: "Whenever the sweep or any of the triggering mutations runs before festival close."
        difference: "Counts allocations tied to non-cancelled scheduled items at full weight, regardless of whether the show actually happens.  Differs from `actual_exposure_fulfilment_pct` (the chronological variant below), which counts only the post-event DELIVERED units.  The two will differ whenever an item is cancelled day-of or whenever the post-event sweep reports a partial delivery — the worked example in the difficulty design pins the divergence at 80.00% projected vs 70.00% actual."
    note: |
      Worked example pinning the rule 1 instance B literal: a Gold sponsor has
      `contracted_units = 10`.  Eight of the ten units are tied to confirmed
      ProgramItems and two are tied to festival-wide (program_item_id null)
      exposure that the festival window is entirely ahead of, so window_fraction
      _remaining is 1.0 and the festival-wide allocation contributes its
      actual_units in full.  Total scheduled_units at projection time = 8.
      Projected percentage = 8 / 10 × 100 = 80.00.  After the festival, the
      post-event sweep finds that one of the confirmed items was day-of
      cancelled so its tied units (1) never delivered; actual_delivered = 7
      and actual_fulfilment_pct = 7 / 10 × 100 = 70.00.  The 10-percentage-
      -point gap between 80.00 and 70.00 on the same SponsorTier row is the
      observable evidence of the dual variant.

  - name: actual_exposure_fulfilment_pct
    description: "Chronological sponsor-exposure-fulfilment percentage computed from the post-event FulfilmentLog event stream.  Stored in SponsorTier.actual_fulfilment_pct only after the first POST /_sweep/run that runs while the parent Festival.status == CLOSED.  Distinct from the projected variant on the same row; the pair is rule 1 instance B's dual variant."
    trigger: "POST /_sweep/run while Festival.status == CLOSED.  Idempotent — multiple invocations after close return the same number (the FulfilmentLog rows are append-only, and the sweep just re-derives the percentage)."
    inputs:
      - "The FulfilmentLog event stream for every ExposureAllocation under the SponsorTier."
      - "The tier's `contracted_units`."
    algorithm: projection
    formula: |
      For each ExposureAllocation a under the tier:
        delivered_a = sum(units of FulfilmentLog rows where event_type == DELIVERED)
                       - sum(units of FulfilmentLog rows where event_type in {VOIDED, PROGRAM_VOIDED})
        a.delivered_units = delivered_a
        a.status flips PLANNED → DELIVERED on the first non-zero DELIVERED, DELIVERED → VOIDED on the cascade, and DELIVERED → REPORTED on this very sweep (the closing-tally REPORTED log row is appended).
      tier_delivered = Σ_a a.delivered_units
      SponsorTier.actual_fulfilment_pct = round_half_up( (tier_delivered / SponsorTier.contracted_units) * 100, PERCENT_PRECISION )
      SponsorTier.tier_remaining_quota = SponsorTier.contracted_units - tier_delivered  # the rule 9 instance B conserved quantity, asserted-equal across deliver/void round-trips.
    constants:
      PERCENT_PRECISION: 2
      ROUND_HALF_UP: true
    precision: "Two-decimal-place percentages.  Integer units underneath."
    variants:
      - name: post_event_replayed
        when: "After Festival.status == CLOSED."
        difference: "Derives from the immutable FulfilmentLog stream, so the result is a deterministic function of which DELIVERED and VOIDED log entries were appended during the festival.  The provisional `projected_fulfilment_pct` does not consult the log at all (it consults the projection over still-scheduled items), which is why the two numbers can diverge."
    note: "Pairs with the projection-variant `provisional_exposure_fulfilment_pct` on the same SponsorTier row — different algorithm (chronological replay over an append-only event stream vs forward aggregation over a live schedule), different result.  The dual-variant claim of rule 1 instance B."

  - name: slot_priority_score
    description: "Composite scoring formula used to rank PROPOSED ProgramItems competing for similar windows.  Higher score = higher priority.  Combines artist tier bonuses, travel-buffer-encouragement (the longer the buffer over the minimum, the higher the score, linearly), a per-conflict penalty for the artist's other-festival commitments that fall within ±24 hours, and a capped rider-count bonus.  The clamp on rider_count and the indicator-function selection over tier give the formula three independent non-linear interactions over ≥4 inputs — the (a) mode of rule 2 in §0.5."
    trigger: "Computed and stored on ProgramItem.slot_priority_score whenever the row is created or its `artist_id`, `start_time`, `end_time`, or the underlying artist's `external_commitments` or `tier` field changes.  Also recomputed on POST /festivals/{fid}/program-items/{piid}/recompute-priority, an explicit handle for the test harness to force recomputation without touching state."
    inputs:
      - "Artist.tier (enum HEADLINER|MAIN|OPENER|SURPRISE)"
      - "travel_buffer_minutes = (this slot's start_time − the closest preceding external_commitment's end_time, in minutes) capped at 0 below and at TRAVEL_BUFFER_MAX_MINUTES above to avoid the term dominating.  Constant TRAVEL_BUFFER_MAX_MINUTES = 1440 (24 hours)."
      - "multi_festival_conflict_count = the number of Artist.external_commitments whose half-open window intersects this slot's ±24-hour neighbourhood (an integer)."
      - "rider_count = the number of RiderRequirement rows on the item, clamped to RIDER_CAP=5."
    algorithm: weighted_scoring
    formula: |
      tier_bonus =
        HEADLINER_BONUS  if Artist.tier == 'HEADLINER'
        MAIN_BONUS       if Artist.tier == 'MAIN'
        OPENER_BONUS     if Artist.tier == 'OPENER'
        SURPRISE_BONUS   if Artist.tier == 'SURPRISE'
      travel_term  = travel_buffer_minutes * TRAVEL_WEIGHT
      conflict_term = multi_festival_conflict_count * MULTI_FESTIVAL_CONFLICT_PENALTY
      rider_term   = min(rider_count, RIDER_CAP) * RIDER_WEIGHT
      score_raw    = tier_bonus + travel_term - conflict_term + rider_term
      slot_priority_score = round_half_up( max(0, score_raw), 2 )  # non-negative floor, two decimals half-up.
    constants:
      HEADLINER_BONUS: 100
      MAIN_BONUS: 50
      OPENER_BONUS: 30
      SURPRISE_BONUS: 10
      TRAVEL_WEIGHT: 0.1
      MULTI_FESTIVAL_CONFLICT_PENALTY: 20
      RIDER_WEIGHT: 2
      RIDER_CAP: 5
      TRAVEL_BUFFER_MAX_MINUTES: 1440
      NON_NEGATIVE_FLOOR: 0
      ROUND_HALF_UP: true
    precision: "Two-decimal-place numeric.  The clamp-at-0 floor is the non-linear interaction that makes the formula sensitive to large penalty terms cancelling out the bonus."
    variants: []
    note: "Worked example pinning the rule 2 instance A (mode (a)) literal: Artist.tier='HEADLINER', travel_buffer_minutes=600, multi_festival_conflict_count=1, rider_count=7 → tier_bonus=100, travel_term=60.0, conflict_term=20, rider_term=min(7,5)*2=10, score_raw=100+60-20+10=150, max(0,150)=150, rounded half-up to 2dp = 150.00.  The three non-linear pieces — indicator-function over tier, capped buffer term, clamped rider count — make this a genuine combinatorial-mode-(a) formula, distinct from the rounding-order mode (b) of `sponsor_payout_total` below and from the evaluation-order mode (c) of `sponsor_waterfall_allocation` further down."

  - name: stage_changeover_overlap_check
    description: "Pairwise interval-overlap check between a candidate ProgramItem-or-Rehearsal-of-type-STAGE on a given Stage and any existing CONFIRMED|ANNOUNCED|ON_STAGE ProgramItem or BOOKED|IN_PROGRESS Rehearsal-of-type-STAGE on the same stage.  The candidate's interval is treated as half-open right-exclusive [start, end), and each existing interval is padded by the stage's `changeover_buffer_seconds` on both sides into a closed interval [u_start − buffer, u_end + buffer].  Conflict iff the candidate's half-open interval intersects the padded-closed interval.  The asymmetry — half-open candidate vs padded-closed existing — is the precise rule the test pins, and the interval semantics differ from those of the aggregate-capacity equipment-kit rule and the closed-with-warmup-gap sound-engineer-team rule, giving rule 8's three distinct-semantics instances."
    trigger: "ProgramItem creation, ProgramItem stage swap, ProgramItem time PATCH, Rehearsal creation when rehearsal_type=STAGE, the apply path of a ScheduleChange of kind ITEM_RESCHEDULE or STAGE_SWAP."
    inputs:
      - "Candidate's stage_id, start_time, end_time."
      - "Stage.changeover_buffer_seconds (defaulting to STAGE_CHANGEOVER_BUFFER_SECONDS=1800 when null)."
      - "The set E of existing intervals on the same stage_id in non-terminal-and-not-cancelled states."
    algorithm: interval_merge
    formula: |
      buffer = Stage.changeover_buffer_seconds if not null else STAGE_CHANGEOVER_BUFFER_SECONDS
      candidate_interval = [candidate.start_time, candidate.end_time)        # half-open right-exclusive
      for each existing e in E:
        padded_e = [e.start_time - buffer, e.end_time + buffer]              # closed on both ends
        # 'half-open intersects closed' semantics: the intersection is non-empty iff
        #   candidate.start_time <= padded_e.end_time   AND   padded_e.start_time < candidate.end_time
        # Note the asymmetry: the right end of the existing-padded interval is INCLUSIVE
        # (≤), so a candidate starting exactly at padded_e.end_time conflicts; the right
        # end of the candidate's half-open interval is EXCLUSIVE (<), so an existing
        # padded-interval starting exactly at candidate.end_time does NOT conflict
        # (because candidate's right end is open).  This boundary asymmetry is the
        # specific behaviour the test fixture pins on the equality-boundary case (the
        # 'exactly at the buffer edge' test in the rule 8 instance 1 recipe).
        if candidate.start_time <= padded_e.end_time and padded_e.start_time < candidate.end_time:
          reject with ERR_STAGE_CHANGEOVER_OVERLAP
    constants:
      STAGE_CHANGEOVER_BUFFER_SECONDS: 1800
    precision: "Integer seconds; no floating-point distance."
    variants: []
    note: "Distinct interval semantics from `equipment_kit_capacity_check` (aggregate-capacity-across-stage, pure half-open, count of simultaneous active intervals must be ≤ kit total_units) and from `sound_engineer_team_overlap_check` (single-team closed-with-warmup-gap-on-the-right).  The three rules sit on three different resource entities (Stage, EquipmentKit, SoundEngineerTeam) — the §0.5 rule 8 'different resource entities and different interval semantics' clause is satisfied by enumerating the three."

  - name: equipment_kit_capacity_check
    description: "Aggregate-capacity check on the maximum number of simultaneously-running ProgramItems requiring a given equipment kit code across ALL stages of a festival.  Uses pure half-open intersection semantics with no buffer pad — the kit is either in use during [u_start, u_end) or it isn't — and the check is on the count of overlapping intervals rather than pairwise compatibility.  The maximum-overlap count at any instant within the candidate's window must, after adding 1 for the candidate itself, be ≤ EquipmentKit.total_units.  This 'aggregate sum across many resources of the same kind' semantics is structurally different from the pairwise-buffered stage check above and from the single-resource warmup-gap team check below."
    trigger: "ProgramItem create or time-PATCH that lists a kit_code in equipment_kit_codes; ScheduleChange.apply that adds a kit to an existing item's equipment_kit_codes via the ITEM_RESCHEDULE payload (this is an extension path the orchestrator can opt into)."
    inputs:
      - "Candidate's equipment_kit_codes, start_time, end_time."
      - "Per kit_code, the festival-wide EquipmentKit.total_units."
      - "The set of existing CONFIRMED|ANNOUNCED|ON_STAGE ProgramItems festival-wide whose equipment_kit_codes contains the same kit_code."
    algorithm: aggregation
    formula: |
      for each kit_code k in candidate.equipment_kit_codes:
        E_k = the set of festival-wide CONFIRMED|ANNOUNCED|ON_STAGE ProgramItems with k in their equipment_kit_codes
        # The 'maximum overlap count' at any instant in the candidate's half-open window:
        events = []
        for each e in E_k: events.append((e.start_time, +1)); events.append((e.end_time, -1))
        # Restrict to events whose time lies in [candidate.start_time, candidate.end_time):
        # the candidate itself contributes a +1 over its full window which we account for as the
        # final '+1' after computing the running maximum of the existing-only count.
        sort events lexicographically by (time, +1-before-−1-at-equal-time so that a closing event at time T does NOT overlap a starting event at the same time T — this is the half-open right-exclusive disambiguation that pins the boundary).
        running = 0; max_overlap_existing = 0
        for (t, delta) in events restricted to candidate's [start, end) window:
          running += delta
          max_overlap_existing = max(max_overlap_existing, running)
        # The candidate is one more user of the kit over the full window:
        peak_simultaneous_users = max_overlap_existing + 1
        if peak_simultaneous_users > EquipmentKit.total_units:
          reject with ERR_EQUIPMENT_KIT_OVERSUBSCRIBED, payload includes kit_code and the peak value.
    constants: {}
    precision: "Integer counts; integer seconds for the sweep timestamps."
    variants: []
    note: "The half-open right-exclusive tie-break in the sweep — closing events processed before opening events at the same instant — is the same convention as Python's `(start, +1), (end, -1)` sort with `(time, kind)` lex ordering where the close kind sorts ahead of the open kind at equal times.  Different from the pairwise-buffered stage rule above (which counts a single existing-interval-padded-closed conflict as a rejection regardless of total capacity) and different from the team rule below (which is single-resource closed-with-right-side-warmup-gap).  Three different interval-semantics flavours on three different resources = rule 8's three instances."

  - name: sound_engineer_team_overlap_check
    description: "Single-team consecutive-booking check: a SoundEngineerTeam can run only one SoundCheckSlot at a time, with a configurable post-slot warmup gap (default TEAM_WARMUP_MINUTES=10) that the next slot's start must clear by at least.  Intervals are closed on the left and the right (a slot's end_time is the precise wall-clock at which the team's post-slot warmup begins).  The geometric semantics — closed-closed plus a one-sided post-slot gap — differ from the stage's two-sided changeover buffer and from the equipment-kit's aggregate-capacity-with-half-open-pure-overlap rule.  Resource: SoundEngineerTeam.  Distinct interval flavour, distinct resource — the third of rule 8's three instances."
    trigger: "PATCH /festivals/{fid}/sound-checks/{scid} that transitions REQUESTED → SCHEDULED carrying the (team_id, window) tuple."
    inputs:
      - "Candidate slot's sound_engineer_team_id, scheduled_window_start, scheduled_window_end."
      - "SoundEngineerTeam.warmup_minutes (defaulting to TEAM_WARMUP_MINUTES=10)."
      - "The set of existing SoundCheckSlots in status SCHEDULED|COMPLETED that reference the same team."
    algorithm: interval_merge
    formula: |
      warmup_seconds = SoundEngineerTeam.warmup_minutes * 60   # default 600 s
      candidate_closed = [candidate.scheduled_window_start, candidate.scheduled_window_end]   # closed-closed
      for each existing s in the team's slots in {SCHEDULED, COMPLETED}:
        s_closed = [s.scheduled_window_start, s.scheduled_window_end]
        # Geometric rule: the two closed intervals must not overlap, AND the gap on either side
        # must be at least warmup_seconds.  Equivalently, treating the warmup as a one-sided
        # right-pad on the existing slot:
        s_padded = [s.scheduled_window_start - warmup_seconds, s.scheduled_window_end + warmup_seconds]
        # Conflict iff the closed candidate intersects the warmup-padded closed existing:
        if candidate_closed.start <= s_padded.end and s_padded.start <= candidate_closed.end:
          reject with ERR_ENGINEER_TEAM_DOUBLE_BOOKED
    constants:
      TEAM_WARMUP_MINUTES: 10
    precision: "Integer seconds."
    variants: []
    note: "Closed-closed-with-symmetric-warmup-pad semantics, contrasted with the stage's two-sided changeover where the existing is padded-closed but the candidate is half-open, and with the equipment-kit's pure half-open aggregate-count sweep.  Three different interval-flavours, three different resources."

  - name: rehearsal_room_overlap_check
    description: "Disjoint-namespace overlap check for ROOM-type Rehearsals.  Two ROOM-type rehearsals with the same `rehearsal_room_name` and overlapping half-open windows conflict.  A ROOM rehearsal never conflicts with a STAGE rehearsal or a ProgramItem on any stage — the two namespaces (room name vs stage id) are kept disjoint by design, which is the 'rehearsal-room and stage-rehearsal differentiation' clause of the scenario.  This rule's interval semantics — pure half-open over a free-form-string namespace — is yet another flavour, mirroring `equipment_kit_capacity_check`'s half-open semantics but on a string-keyed namespace and with a capacity of exactly one (a single room is occupied by a single rehearsal at a time)."
    trigger: "Rehearsal create when rehearsal_type=ROOM and rehearsal_room_name is non-null."
    inputs:
      - "Candidate's rehearsal_room_name, start_time, end_time."
      - "The set of existing Rehearsal rows in {BOOKED, IN_PROGRESS} with the same rehearsal_room_name."
    algorithm: interval_merge
    formula: |
      for each existing r in the same-room set:
        # Half-open intersection: the candidate's [s_c, e_c) and the existing's [s_r, e_r) overlap
        # iff s_c < e_r and s_r < e_c.  This is the standard half-open-right-exclusive overlap test
        # used in calendars where a back-to-back booking (one ends at exactly the time the next
        # begins) is allowed.  Distinguishes from `stage_changeover_overlap_check` which has a
        # buffer pad and from `sound_engineer_team_overlap_check` which is closed-closed-padded.
        if candidate.start_time < r.end_time and r.start_time < candidate.end_time:
          reject with ERR_REHEARSAL_ROOM_OVERLAP
    constants: {}
    precision: "Integer seconds."
    variants: []
    note: "ROOM/STAGE namespace disjointness is the structural distinguishing feature: the same wall-clock interval can be hosted simultaneously by a STAGE rehearsal on stage X and a ROOM rehearsal in room 'R1' without conflict.  The test fixture exercises this by booking the two side-by-side and asserting both succeed.  The fourth distinct interval-arithmetic flavour catalogued by the scaffold — rule 8 needs only two — so this one is an extra worked example for the test generator to choose from when it wants a third instance for that rule."

  - name: artist_travel_buffer_check
    description: "Per-artist temporal-precedence check: the new slot's start_time must satisfy start_time ≥ artist's latest preceding external_commitment.end_time + minimum_travel_buffer_seconds.  The boundary is inclusive — equality is acceptable, strict less-than is the rejection.  The numeric metric is wall-clock seconds, distinct from the integer counts of the ticket-zone capacity boundary and the integer cardinality of the headliner-rider-minimum boundary, so the three boundaries sit on three different metrics on three different endpoints, satisfying the rule 6 differentiation clause."
    trigger: "ProgramItem create and the CONFIRMED transition (the confirm path runs the check authoritatively; create checks it advisorily so a draft can be saved even when the buffer is short, but confirm cannot proceed)."
    inputs:
      - "Artist.external_commitments (each with an end_time)."
      - "Artist.minimum_travel_buffer_hours, defaulting to TRAVEL_HOURS_MIN=4."
      - "The candidate ProgramItem's start_time."
    algorithm: threshold
    formula: |
      min_buffer_seconds = (Artist.minimum_travel_buffer_hours if not null else TRAVEL_HOURS_MIN) * 3600
      # Preceding commitments are those whose end_time ≤ candidate.start_time.  Of those, the
      # 'latest preceding' is the one with the maximum end_time.  When there are no preceding
      # commitments, the check is trivially satisfied.  When the candidate falls during a
      # commitment (end_time of the candidate ≤ end_time of the commitment AND start_time of the
      # candidate < end_time of the commitment), the multi-festival-conflict check fires instead
      # and rejects with ERR_ARTIST_MULTI_FESTIVAL_CONFLICT — the two rules are siblings on the
      # same input, with the multi-festival rule covering the 'overlapping' subset and this rule
      # covering the 'consecutive but too-close' subset.
      preceding = [c for c in Artist.external_commitments if c.end_time <= candidate.start_time]
      if preceding:
        c_latest = the one with max c.end_time
        gap_seconds = candidate.start_time - c_latest.end_time
        # Inclusive boundary: gap_seconds == min_buffer_seconds is acceptable.
        if gap_seconds < min_buffer_seconds:
          reject with ERR_ARTIST_TRAVEL_BUFFER_VIOLATION
        # The boundary precision test in rule 6 instance A pins the equality case as accepted and
        # the off-by-one-second case (gap_seconds == min_buffer_seconds - 1) as rejected.
      # When `preceding` is the empty set, the rule passes trivially — there is nothing to
      # buffer against.  The empty-set behaviour is captured by the rule-6 'empty preceding
      # commitments' edge case in the difficulty design, but the differentiation clause of
      # rule 6 demands different metrics on different endpoints, which is why the empty-set
      # edge of this rule is NOT counted as one of rule 6's two-or-more instances — instead,
      # the integer-count zone-capacity rule and the integer-cardinality headliner-rider rule
      # are the two paired instances on different metrics.
    constants:
      TRAVEL_HOURS_MIN: 4
    precision: "Integer seconds."
    variants: []
    note: "Inclusive-≥ boundary on the gap-in-seconds metric.  Compare with the zone-capacity rule's strict-< boundary on an integer-count metric on a different endpoint, and the blocking-rider-minimum rule's ≥ 1 boundary on an integer-cardinality metric on yet a third endpoint."

  - name: ticket_zone_capacity_check
    description: "Per-zone capacity ceiling on TicketType.issuance.  The zone's capacity is the maximum over the Stage.zone_capacity values of the stages of the ticket's tied_program_items.  On each POST /issue, the sum of issued_count over all TicketType rows sharing the same zone_name within the festival must remain < zone_capacity AFTER the increment, so the check is `issued_count + 1 > zone_capacity → reject` (strict `>` boundary, integer-count metric).  The exact-equality case (cumulative count == capacity − 1, the very last ticket) is the boundary the test pins as the accepted side; the next ticket fails.  Different metric (integer count) and different endpoint from the travel-buffer rule's seconds-gap on /program-items/confirm — the rule-6 'different metrics on different endpoints' clause is satisfied by the pair."
    trigger: "POST /festivals/{fid}/ticket-types/{ttid}/issue."
    inputs:
      - "TicketType.zone_name."
      - "All TicketType rows in the same festival sharing the same zone_name (the zone group)."
      - "The set of Stage rows hosting any tied_program_item across the zone group, and the maximum zone_capacity among them."
    algorithm: threshold
    formula: |
      zone_group = [tt for tt in TicketType where tt.festival_id == this.festival_id and tt.zone_name == this.zone_name]
      zone_stages = the Stage rows hosting any program item in any tt.tied_program_item_ids across zone_group
      zone_capacity = max(stage.zone_capacity for stage in zone_stages) if zone_stages else 0
      cumulative_issued = sum(tt.issued_count - tt.refunded_count for tt in zone_group)
      # Boundary precision: strict-> on the post-increment cumulative count.  Pre-increment ==
      # zone_capacity − 1 is fine; pre-increment == zone_capacity rejects.  The OCC on the
      # TicketType row also serialises the increment so the boundary is deterministic under
      # concurrency.
      if cumulative_issued + 1 > zone_capacity:
        reject with ERR_TICKET_ZONE_CAPACITY_EXCEEDED
      # The 'empty zone_stages' edge case — when none of the zone group's tied items has yet
      # been assigned a stage — is rejected with ERR_TICKET_ZONE_NO_STAGE on the principle that
      # a ticket can't be issued for a zone with zero defined capacity.  This is the zero-count
      # edge of the integer-count metric and is the THIRD rule-6 instance (the boundary at
      # 'capacity = 0', i.e., the empty-set behaviour on a different metric than the
      # travel-buffer-seconds metric).  The minimum-rider-cardinality rule below is the
      # SECOND rule-6 instance on yet a different metric (integer cardinality of blocking
      # riders, with the boundary at exactly 0 vs 1).
    constants: {}
    precision: "Integer counts."
    variants: []
    note: "Strict-> boundary on the cumulative-issued integer count.  Tests assert the at-capacity case succeeds and the over-by-one case rejects, mirroring the boundary discipline of the travel-buffer-seconds rule but on a categorically different metric and endpoint."

  - name: blocking_rider_minimum_check
    description: "Cardinality boundary on the count of blocking RiderRequirements an Artist.tier==HEADLINER must have on a ProgramItem before the item can transition CONFIRMED → ANNOUNCED.  The minimum is `HEADLINER_MIN_BLOCKING_RIDERS = 1` for HEADLINER, and 0 for all other tiers.  The boundary 0-vs-1 on a non-negative integer cardinality is a distinct metric from the seconds-gap of the travel-buffer rule and the integer-count of the zone-capacity rule, so the trio of boundary checks lands on three different metrics through three different endpoints (program-item-confirm, program-item-announce, and ticket-type-issue).  Rule 6's two-instance minimum is satisfied by any pair of these three; the third is a bonus."
    trigger: "POST /festivals/{fid}/program-items/{piid}/announce."
    inputs:
      - "Artist.tier for the item's artist."
      - "The set of RiderRequirement rows on the item with is_blocking == true."
    algorithm: threshold
    formula: |
      required_blocking = HEADLINER_MIN_BLOCKING_RIDERS if Artist.tier == 'HEADLINER' else 0
      observed_blocking_fulfilled = count of RiderRequirement rows on the item with is_blocking==true and fulfilled_at != null
      observed_blocking_total = count of RiderRequirement rows on the item with is_blocking==true
      # Two-step check.  Step A — cardinality minimum: observed_blocking_total ≥ required_blocking, otherwise
      #   ERR_HEADLINER_MISSING_BLOCKING_RIDER (boundary at exactly 0 vs 1).  Step B — all blocking riders
      #   present must be fulfilled: observed_blocking_fulfilled == observed_blocking_total, otherwise
      #   ERR_BLOCKING_RIDERS_UNFULFILLED.  The boundary precision the test pins is the step-A 0-vs-1
      #   transition for a HEADLINER: with zero blocking riders the announce fails, with exactly one
      #   blocking rider in 'fulfilled_at != null' state the announce succeeds.
      if observed_blocking_total < required_blocking:
        reject with ERR_HEADLINER_MISSING_BLOCKING_RIDER
      if observed_blocking_fulfilled != observed_blocking_total:
        reject with ERR_BLOCKING_RIDERS_UNFULFILLED
    constants:
      HEADLINER_MIN_BLOCKING_RIDERS: 1
    precision: "Integer cardinalities."
    variants: []
    note: "Non-HEADLINER tiers skip step A altogether (required_blocking=0 means the ≥ check trivially passes).  The 0-vs-1 boundary on a HEADLINER is the rule-6-eligible discrete-cardinality edge.  The empty-rider-list case for a non-HEADLINER is the zero-quantity edge that the same rule covers on the other side (an empty set passes the check)."

  - name: sponsor_waterfall_allocation
    description: "Festival-wide waterfall allocation of a finite catalog pool across SponsorTiers in the fixed order WATERFALL_TIER_ORDER = ['TITLE','GOLD','SILVER'].  Within a tier, sponsors are ordered by `priority_rank` ascending, then `sponsor_external_id` lexicographic ascending as the tie-break.  Each ExposureAllocation.requested_units is reduced to `actual_units = min(requested_units, pool_remaining_for_this_kind_at_this_tier_position)`.  The pool is per `kind` (one separate pool for stage_name, screen_time, artist_mention, branded_zone).  The catalog totals come from a festival-level configuration table the FestivalProducer seeds via POST /festivals/{fid}/exposure-catalog with `{kind: total_units}` pairs.  Evaluation order is the pinned non-commutative element — title's full draw happens before any gold sponsor is considered, even if the title's priority_rank is numerically greater than a gold sponsor's; this is the (c) mode of rule 2 in §0.5 (a 'circular-looking dependency where the evaluation order must be made explicit')."
    trigger: "POST /festivals/{fid}/sponsor-allocation-sweep.  Idempotent: re-running the sweep with no new allocations produces the same (actual_units) tuple."
    inputs:
      - "The festival-level exposure-catalog dict {kind: total_units}."
      - "All ExposureAllocation rows under the festival in status PLANNED or DELIVERED (so that already-delivered allocations don't get retroactively reduced), grouped by kind."
      - "The tier order WATERFALL_TIER_ORDER."
    algorithm: waterfall_allocation
    formula: |
      For each kind k in {stage_name, screen_time, artist_mention, branded_zone}:
        pool_remaining = exposure_catalog[k]   # the festival-level total for this kind, integer.
        ordered_allocations = []
        for tier_code in WATERFALL_TIER_ORDER:
          tier_allocs = [a for a in ExposureAllocation if a.kind == k and a.sponsor_tier.tier_code == tier_code and a.status in {PLANNED, DELIVERED}]
          tier_allocs.sort(key=lambda a: (a.sponsor_tier.priority_rank, a.sponsor_tier.sponsor_external_id))
          ordered_allocations.extend(tier_allocs)
        # Disburse:
        for a in ordered_allocations:
          a.actual_units = min(a.requested_units, pool_remaining)
          pool_remaining -= a.actual_units
        # Invariant: Σ_a a.actual_units ≤ exposure_catalog[k] for every kind k.  Pool may end > 0
        # if total requested < total catalog.
        # The status of an allocation does not change here; the deliver/void path is what flips it.
        # AuditEntry of event_category=EXPOSURE is appended at the end of the sweep with a
        # `summary` containing the per-kind disbursement vector for the test to assert against.
    constants:
      WATERFALL_TIER_ORDER: ["TITLE", "GOLD", "SILVER"]
    precision: "Integer units throughout."
    variants:
      - name: pinned_tier_order
        when: "Always — the fixed tier order is the pinned evaluation order that disambiguates the otherwise-circular pool-and-quota dependency."
        difference: "An alternative algorithm that processes sponsors strictly by global priority_rank (ignoring tier) would yield different `actual_units` whenever a Silver sponsor's priority_rank is numerically smaller than a Gold sponsor's.  The scaffold pins the tier-first ordering and the test asserts a specific Silver-runs-out-with-1-unit literal that the global-rank-only ordering would not produce."
    note: |
      Worked example pinning the rule 2 (mode c) literal: exposure_catalog['branded_zone'] = 10.
      One Title sponsor requests 5 units (gets 5; pool now 5).  Two Gold sponsors each request
      2 units (the lower-priority_rank one drawn first by the tie-break; both succeed, pool now
      5−2−2 = 1).  Three Silver sponsors each request 1 unit in priority_rank ascending order;
      the first Silver gets 1, the next two get 0 each because the pool is empty.  The 'first
      Silver gets exactly 1' literal is the test's expected outcome and confirms the
      tier-then-rank ordering rather than a global-rank ordering.  Tie-break stability across
      identical priority_rank values within Silver is the lexicographic sponsor_external_id
      ascending, which the implementation must surface as a deterministic SQL ORDER BY.

  - name: sponsor_payout_total
    description: "Per-sponsor payout the festival owes after the post-event sweep, in integer cents, summed across the sponsor tier's exposure-resource lines.  Each line's contribution is `delivered_units_line × pinned_rate_cents_per_unit_line / 1000` in mills-to-cents conversion (pinned_rate_cents_per_unit is in mills — thousandths of a cent — to allow sub-cent precision in the rate without storing non-integer numerics).  The rounding-order subtlety is the rule 2 instance B (mode b): the scaffold pins 'sum the unrounded mills across lines, then divide by 1000, then round half-up to integer cents' — distinct from the alternative 'round each line's cents independently then sum'.  The two orderings can diverge by exactly one cent on the right input, which is the worked-example literal pinned in the difficulty design (8 cents under the pinned order, 9 cents under the alternative for the input vector (1,1,1) units at rate 25 mills/unit each)."
    trigger: "POST /_sweep/run with `compute_payout=true` flag in the body, and the read endpoint GET /festivals/{fid}/sponsor-tiers/{stid}/fulfilment-report.  Both surface `sponsor_payout_total_cents` as a number; the read endpoint is the testable hook."
    inputs:
      - "The SponsorTier and its ExposureAllocation rows in DELIVERED|REPORTED status."
      - "For each row, `delivered_units` and `pinned_rate_cents_per_unit` (in mills — thousandths of a cent).  When the latter is null on creation, the row's parent tier defaults to SPONSOR_PAYOUT_RATE_MILS_DEFAULT (=25 mills/unit)."
    algorithm: aggregation
    formula: |
      total_mills_unrounded = 0
      for each ExposureAllocation a in tier.allocations with status in {DELIVERED, REPORTED}:
        rate_mills = a.pinned_rate_cents_per_unit if not null else SPONSOR_PAYOUT_RATE_MILS_DEFAULT
        line_mills_unrounded = a.delivered_units * rate_mills   # integer multiplication, no rounding
        total_mills_unrounded += line_mills_unrounded
      # Pinned 'sum then round' order: total cents = round_half_up(total_mills_unrounded / 1000).
      sponsor_payout_total_cents = round_half_up_decimal(total_mills_unrounded / 1000)
      # The alternative 'round each line then sum' that the scaffold rejects would be:
      #   total_cents_alternative = sum(round_half_up_decimal(line_mills_unrounded[i] / 1000) for each line)
      # The two differ by exactly one cent on the worked input (three lines, one unit each, 25 mills
      # rate each).  The pinned answer is 0.075 → 0.08 cents = 8 cents; the alternative would be
      # 0.03 per line round-half-up of 0.025, summed to 0.09 cents = 9 cents.  Tests assert the
      # literal 8 cents to lock in the 'sum-then-round' order.
    constants:
      SPONSOR_PAYOUT_RATE_MILS_DEFAULT: 25
      ROUND_HALF_UP: true
    precision: "Integer cents in the final result; integer mills in the intermediate.  The half-up step happens exactly once, at the final mills→cents division."
    variants:
      - name: sum_then_round_pinned
        when: "Always."
        difference: "Versus the un-pinned alternative 'round-each-line-then-sum', differs by exactly one cent on the (1,1,1) units × 25 mills/unit input vector — 8 cents pinned, 9 cents alternative.  The divergence is precisely the rounding-order non-commutativity that combinatorial-mode (b) of rule 2 specifies."
    note: "The integer-mills intermediate eliminates floating-point error and makes the half-up rule fully deterministic.  The mills-to-cents step's half-up rounding rule is the only floating-point-equivalent step in the scaffold — and it is implemented over Decimal arithmetic so the boundary at 0.005 cents (which the worked example sits on, total_mills=75 → 0.075 cents) is unambiguous."

  - name: festival_outstanding_tickets_total
    description: "Conserved-quantity invariant for rule 9 instance A: across the apply-then-revert of any ScheduleChange whose change_kind is ITEM_CANCEL (the standard refund-triggering change), the festival's outstanding-tickets-total Σ TicketType.issued_count − Σ TicketType.refunded_count remains numerically unchanged.  The transient state between apply and revert sees the provisional_refund_cents_outstanding bucket bulge, but issued_count and refunded_count themselves do not move until an external refund-confirmed event lands; the revert clears the provisional bucket without touching issued or refunded, so the invariant holds.  Pinned as a computed derived field on Festival.outstanding_tickets_total."
    trigger: "Recomputed on every TicketType issued/refunded mutation."
    inputs:
      - "All TicketType rows under the festival."
    algorithm: aggregation
    formula: |
      Festival.outstanding_tickets_total = sum_over_TicketType_under_this_festival(
        TicketType.issued_count - TicketType.refunded_count
      )
      # Invariant pinned by §1.8 rule 9 instance A: the value is unchanged by the
      # apply-then-revert sequence on an ITEM_CANCEL ScheduleChange because the revert path
      # explicitly does not flip any TicketType.issued_count or .refunded_count when no
      # external refund ACK has landed.  The provisional_refund_cents_outstanding column on
      # TicketType DOES bulge between apply and revert (the test asserts the transient
      # divergence to confirm the apply actually ran) and then snaps back to zero on revert.
      # This non-trivial transient is the evidence that the invariant is the right
      # quantity to assert on, not just a no-op.
    constants: {}
    precision: "Integer count."
    variants: []
    note: "The 'transient divergence followed by restoration' shape is the calling-card of a compensating-action invariant, distinct from a 'no-side-effect' no-op.  The §1.8 rule 9 test recipe both observes the transient bulge in the provisional bucket and asserts the invariant on the outstanding count's pre-and-post equality."

  - name: sponsor_tier_remaining_quota_invariant
    description: "Conserved-quantity invariant for rule 9 instance B, on the SponsorTier domain rather than the ticketing domain: across the deliver-then-void round-trip on a single ExposureAllocation (where the void can be either the explicit POST .../void-delivery or the cascade-from-ProgramItem-cancel of cascade B in rule 4), the SponsorTier.tier_remaining_quota = contracted_units − Σ delivered_units returns to its pre-deliver value.  The transient is a positive delivery of N units (the quota drops by N), followed by a void of the same N units in a PROGRAM_VOIDED log row that exactly offsets the original DELIVERED row, so the net delivered_units is zero and the quota is restored to contracted_units.  A different conserved quantity than the ticketing invariant — quota counter rather than ticket count — and on a different entity, satisfying the 'different conserved quantities' clause of rule 9."
    trigger: "Recomputed on every FulfilmentLog append (DELIVERED, VOIDED, REPORTED, PROGRAM_VOIDED) under any of the tier's allocations."
    inputs:
      - "SponsorTier.contracted_units."
      - "All ExposureAllocation.delivered_units for the tier's allocations.  Each delivered_units is itself defined as Σ DELIVERED log units − Σ VOIDED log units − Σ PROGRAM_VOIDED log units."
    algorithm: aggregation
    formula: |
      tier_delivered = Σ_a a.delivered_units  for a in this tier's allocations
      SponsorTier.tier_remaining_quota = SponsorTier.contracted_units - tier_delivered
      # Invariant pinned by §1.8 rule 9 instance B: a deliver of N units followed by a void of
      # the same N units leaves tier_delivered unchanged at its pre-deliver value, hence
      # tier_remaining_quota unchanged.  The PROGRAM_VOIDED log event that the ProgramItem-
      # cancel cascade B emits has the same magnitude as the prior DELIVERED row by
      # construction (the cascade reads the row's current delivered_units and writes a
      # PROGRAM_VOIDED of equal magnitude).
    constants: {}
    precision: "Integer units."
    variants: []
    note: "The two rule-9 invariants — outstanding-tickets-count and tier-remaining-quota — sit on different conserved quantities (count of unrefunded tickets vs the integer-units remainder of a per-sponsor catalog quota) on different entities (Festival vs SponsorTier), which is exactly the differentiation rule 9 demands."

# -----------------------------------------------------------------------------
# §1.4  Validation Rules (priority ordered)
# -----------------------------------------------------------------------------
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and non-empty strings."
    error_id: ERR_MISSING_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints, including the dev endpoints under /_clock, /_events, /_sweep"

  - priority: 2
    category: auth
    check: "X-User-Role is a known role from the RBAC matrix (§1.7).  Unknown roles are rejected with ERR_UNKNOWN_ROLE rather than falling through to the per-endpoint permission check, so the test can distinguish 'header malformed' from 'role-not-permitted-for-this-op'."
    error_id: ERR_UNKNOWN_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: auth
    check: "The X-User-Role is one of the `roles:` array on the endpoint definition; otherwise insufficient permissions.  Read endpoints in the audit-log family additionally require the role to be in the audit-viewer set."
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints whose roles[] is non-empty"

  - priority: 4
    category: existence
    check: "Every entity id in the URL path resolves to a row in the right table, validated left-to-right.  For /festivals/{fid}/program-items/{piid} the festival is checked first and only then the program-item.  Each resource has its own 404 error id (ERR_FESTIVAL_NOT_FOUND, ERR_PROGRAM_VERSION_NOT_FOUND, ERR_STAGE_NOT_FOUND, ERR_EQUIPMENT_KIT_NOT_FOUND, ERR_ARTIST_NOT_FOUND, ERR_PROGRAM_ITEM_NOT_FOUND, ERR_RIDER_NOT_FOUND, ERR_SOUND_ENGINEER_TEAM_NOT_FOUND, ERR_SOUND_CHECK_NOT_FOUND, ERR_REHEARSAL_NOT_FOUND, ERR_TICKET_TYPE_NOT_FOUND, ERR_SPONSOR_TIER_NOT_FOUND, ERR_EXPOSURE_ALLOCATION_NOT_FOUND, ERR_SCHEDULE_CHANGE_NOT_FOUND).  Cross-festival id mismatches (program-item belongs to a different festival than the path's festival id) are ERR_RESOURCE_MISMATCHED_PARENT, http 404."
    error_id: "ERR_*_NOT_FOUND (one per resource type), ERR_RESOURCE_MISMATCHED_PARENT"
    http_status: 404
    applies_to: "all nested-id endpoints"

  - priority: 5
    category: state
    check: "Target resource is in a state that permits the requested operation.  A non-exhaustive sampler: program-item-confirm requires PROPOSED; program-item-announce requires CONFIRMED; ticket-type-issue requires ACTIVE; schedule-change-apply requires PROPOSED; schedule-change-revert requires APPLIED-with-no-ACKs; festival-cancel requires non-terminal; rehearsal-cancel requires BOOKED.  The error id matches the resource and the gate, e.g., ERR_PROGRAM_ITEM_NOT_PROPOSED, ERR_PROGRAM_ITEM_NOT_CONFIRMED, ERR_TICKET_TYPE_NOT_ACTIVE, ERR_CHANGE_NOT_PROPOSED, ERR_CHANGE_ALREADY_ACKED, ERR_FESTIVAL_ALREADY_CLOSED, ERR_PROGRAM_ITEM_ALREADY_CANCELLED, ERR_REHEARSAL_NOT_BOOKED."
    error_id: "ERR_<entity>_<state-gate> family"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: state
    check: "Cross-entity state preconditions: ProgramItem.confirm requires its `program_version_id` to equal Festival.current_program_version_id when the festival has a published version; SoundCheckSlot.schedule requires its parent ProgramItem.status in {CONFIRMED, ANNOUNCED} and the team in AVAILABLE; ExposureAllocation.deliver requires the tied ProgramItem.status == PERFORMED (or the festival in LIVE|CLOSED for festival-wide allocations); ProgramVersion.publish requires the parent Festival.status in {SCHEDULING, PUBLISHED}.  Each cross-state gate has its own error id (ERR_PROGRAM_VERSION_SUPERSEDED, ERR_PARENT_ITEM_NOT_READY, ERR_TIED_ITEM_NOT_PERFORMED, ERR_FESTIVAL_NOT_SCHEDULING_OR_PUBLISHED)."
    error_id: "ERR_<cross-entity-state> family"
    http_status: 409
    applies_to: "state-transition endpoints that depend on a sibling entity's state"

  - priority: 7
    category: business_safety
    check: "Equipment-sharing safety: the candidate ProgramItem's equipment_kit_codes list must not push the festival-wide concurrent-use count above EquipmentKit.total_units for any kit (the aggregate-capacity overlap check in §1.3 `equipment_kit_capacity_check`).  Also, every kit_code on the candidate must appear in the parent Stage.equipment_kits[] (the kit must be physically wireable into the stage; otherwise ERR_STAGE_LACKS_EQUIPMENT_KIT)."
    error_id: "ERR_EQUIPMENT_KIT_OVERSUBSCRIBED | ERR_STAGE_LACKS_EQUIPMENT_KIT"
    http_status: 409
    applies_to: "POST /festivals/{fid}/program-items, PATCH /festivals/{fid}/program-items/{piid} when equipment_kit_codes or stage_id is touched, schedule-change apply for ITEM_RESCHEDULE and STAGE_SWAP."

  - priority: 8
    category: business_safety
    check: "Sound-engineer-team double-booking safety: the candidate SoundCheckSlot's window does not overlap any other slot of the same team in {SCHEDULED, COMPLETED}, including the team's `warmup_minutes` post-slot gap.  Pure-temporal-overlap check on the team resource."
    error_id: ERR_ENGINEER_TEAM_DOUBLE_BOOKED
    http_status: 409
    applies_to: "PATCH /festivals/{fid}/sound-checks/{scid} when the transition is REQUESTED→SCHEDULED."

  - priority: 9
    category: business_safety
    check: "Headliner blocking-rider minimum and fulfilment: a HEADLINER ProgramItem cannot transition CONFIRMED→ANNOUNCED with zero blocking RiderRequirements (cardinality lower bound is 1 for HEADLINER, 0 for others — the §1.3 `blocking_rider_minimum_check`), and any blocking rider on file must have fulfilled_at non-null.  Together these produce two distinct error ids on a single endpoint."
    error_id: "ERR_HEADLINER_MISSING_BLOCKING_RIDER | ERR_BLOCKING_RIDERS_UNFULFILLED"
    http_status: 422
    applies_to: "POST /festivals/{fid}/program-items/{piid}/announce."

  - priority: 10
    category: business_temporal
    check: "Per-stage changeover-buffer overlap: the candidate's half-open [start,end) does not intersect any existing item's buffer-padded closed interval on the same stage.  See §1.3 `stage_changeover_overlap_check`.  Distinct interval semantics from the equipment-kit aggregate check and from the team warmup-gap check (rule 8's three flavours).  Distinct error code from the artist self-overlap rule and the rehearsal-room rule."
    error_id: ERR_STAGE_CHANGEOVER_OVERLAP
    http_status: 409
    applies_to: "POST /festivals/{fid}/program-items, PATCH /festivals/{fid}/program-items/{piid} on time or stage change, POST /festivals/{fid}/rehearsals when rehearsal_type=STAGE, schedule-change apply for ITEM_RESCHEDULE and STAGE_SWAP."

  - priority: 11
    category: business_temporal
    check: "Artist multi-festival temporal conflict: the candidate's half-open window does not intersect any of Artist.external_commitments' half-open windows.  See §1.3 `artist_travel_buffer_check` (the overlap-subset cousin)."
    error_id: ERR_ARTIST_MULTI_FESTIVAL_CONFLICT
    http_status: 409
    applies_to: "POST /festivals/{fid}/program-items, the confirm transition for an existing item, schedule-change apply for ITEM_RESCHEDULE."
    note: "Validation-priority interplay with §1.4 priority 6's program-version-supersession check: when both fail simultaneously (the item is on a superseded version AND the artist has a multi-festival overlap), the state-category program-version-supersession error wins because its priority (6) is numerically smaller than the business-temporal artist-conflict's priority (11).  This pairing is rule 5 instance A in §1.8."

  - priority: 12
    category: business_temporal
    check: "Artist travel-buffer gap: the gap between the latest preceding Artist.external_commitment.end_time and the candidate's start_time is ≥ minimum_travel_buffer_seconds.  Inclusive boundary (≥)."
    error_id: ERR_ARTIST_TRAVEL_BUFFER_VIOLATION
    http_status: 409
    applies_to: "POST /festivals/{fid}/program-items, the confirm transition for an existing item, schedule-change apply for ITEM_RESCHEDULE."

  - priority: 13
    category: business_temporal
    check: "Artist self-overlap within or across festivals: the candidate ProgramItem's half-open window does not intersect any other CONFIRMED|ANNOUNCED|ON_STAGE ProgramItem for the same artist_id, in this or any other festival the system knows about (cross-festival visibility is via the artist's `external_commitments` array seeded at registration plus the system's own ProgramItem table)."
    error_id: ERR_ARTIST_SELF_OVERLAP
    http_status: 409
    applies_to: "POST and PATCH on program-items, confirm transition, schedule-change apply for ITEM_RESCHEDULE."

  - priority: 14
    category: business_temporal
    check: "Sound-check window precedes the program-item's start_time by at least TEAM_HANDOFF_SECONDS (=600 s).  scheduled_window_end ≤ ProgramItem.start_time − TEAM_HANDOFF_SECONDS."
    error_id: ERR_SOUND_CHECK_WINDOW_INVALID
    http_status: 422
    applies_to: "PATCH /festivals/{fid}/sound-checks/{scid} on the REQUESTED→SCHEDULED transition."

  - priority: 15
    category: business_temporal
    check: "Rehearsal-room overlap (ROOM-type rehearsals on the same rehearsal_room_name): half-open intersection on the room's free-form string namespace."
    error_id: ERR_REHEARSAL_ROOM_OVERLAP
    http_status: 409
    applies_to: "POST /festivals/{fid}/rehearsals when rehearsal_type=ROOM."

  - priority: 16
    category: business_referential
    check: "ExposureAllocation.kind must be in the parent SponsorTier.contract_kinds_allowed list — when it isn't, the general ERR_EXPOSURE_KIND_NOT_CONTRACTED fires.  The artist-mention carve-out is the same gate restated for one specific kind: when the request's kind == 'artist_mention' and the parent SponsorTier's contract_kinds_allowed list does not contain 'artist_mention', the more-specific ERR_ARTIST_NOT_ELIGIBLE_FOR_TIER is returned instead of the generic one (a richer error message helps the test target the artist-mention failure mode precisely).  Both errors ground in the existing SponsorTier.contract_kinds_allowed array — no new field is needed.  Finally, the ExposureAllocation's optional program_item_id, when non-null, must reference a ProgramItem whose festival_id equals the allocation's festival_id (the cross-festival-reference guard, ERR_EXPOSURE_PROGRAM_ITEM_CROSS_FESTIVAL)."
    error_id: "ERR_EXPOSURE_KIND_NOT_CONTRACTED | ERR_ARTIST_NOT_ELIGIBLE_FOR_TIER | ERR_EXPOSURE_PROGRAM_ITEM_CROSS_FESTIVAL"
    http_status: 422
    applies_to: "POST /festivals/{fid}/sponsor-tiers/{stid}/exposure-allocations, PATCH on the allocation's program_item_id binding."

  - priority: 17
    category: business_referential
    check: "Refund-confirmed cross-festival guard: a POST /_events/refund-confirmed payload's per-type breakdown entries must each reference a TicketType whose festival_id equals the targeted ScheduleChange's festival_id.  Cross-festival ACKs are rejected outright."
    error_id: ERR_CROSS_FESTIVAL_REFUND
    http_status: 422
    applies_to: "POST /_events/refund-confirmed."

  - priority: 18
    category: business_fiscal
    check: "Tier-quota exhaustion guard: the per-kind exposure catalog pool must not go negative after a waterfall sweep.  This is more of a global-invariant assertion than a per-request rejection — the sweep itself zeroes out at the empty-pool boundary by setting actual_units = min(requested, pool_remaining), so the negative branch is impossible by construction.  The error fires only on a racing exposure-catalog edit that lowers a total below the already-disbursed sum, which the implementation guards against by rejecting the edit (ERR_EXPOSURE_CATALOG_BELOW_DISBURSED)."
    error_id: ERR_EXPOSURE_CATALOG_BELOW_DISBURSED
    http_status: 422
    applies_to: "PATCH /festivals/{fid}/exposure-catalog."

  - priority: 19
    category: business_fiscal
    check: "Sponsor-tier contract-units cap: ExposureAllocation.requested_units cannot, when summed with the tier's other allocations of the same kind, exceed SponsorTier.contracted_units for that kind.  This is the per-tier contract ceiling that sits independently of the festival-wide catalog pool (the catalog enforces a festival-wide ceiling; the contract enforces a per-sponsor ceiling).  The two ceilings interact through the waterfall."
    error_id: ERR_TIER_CONTRACT_UNITS_EXCEEDED
    http_status: 422
    applies_to: "POST and PATCH on /festivals/{fid}/sponsor-tiers/{stid}/exposure-allocations.  This is the business-fiscal half of rule 5 instance B's priority pair: when an allocation simultaneously fails the referential check (priority 16, ERR_ARTIST_NOT_ELIGIBLE_FOR_TIER) and the fiscal check (this rule, ERR_TIER_CONTRACT_UNITS_EXCEEDED), the referential error (numerically smaller priority) wins.  Different error-category pair from rule 5 instance A (state vs business_temporal)."

  - priority: 20
    category: business_fiscal
    check: "Ticket-zone capacity guard: the cumulative net-issued count in the zone group must not exceed the maximum Stage.zone_capacity across the zone's tied stages.  Strict-> on the post-increment count.  See §1.3 `ticket_zone_capacity_check`."
    error_id: ERR_TICKET_ZONE_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /festivals/{fid}/ticket-types/{ttid}/issue."

  - priority: 21
    category: business_fiscal
    check: "Refund-confirmed magnitude check: the ACK payload's `final_cents_total_for_type` for each entry cannot exceed the matching TicketType's provisional_refund_cents_outstanding portion attributed by the originating ScheduleChange.  Equality is the standard outcome; less-than (admin-fee deduction case) is allowed; greater-than is rejected."
    error_id: ERR_REFUND_EXCEEDS_PROVISIONAL
    http_status: 422
    applies_to: "POST /_events/refund-confirmed."

  - priority: 22
    category: business_constraint
    check: "Idempotency-key reuse: when a request body carries an `idempotency_key` that has been seen within IDEMPOTENCY_WINDOW_SECONDS=86400 on the same endpoint and the new body's SHA-256 hash differs from the stored body's hash, the request is rejected with ERR_IDEMPOTENCY_KEY_REUSED.  When the hashes match, the stored response is returned with no side-effects and a special meta flag `is_idempotent_replay: true` is added to the success envelope's meta.  The idempotency window's clock-source is the same `real_now + Festival.clock_offset_seconds` as everything else."
    error_id: ERR_IDEMPOTENCY_KEY_REUSED
    http_status: 409
    applies_to: "POST endpoints that explicitly accept an idempotency_key field: schedule-changes create, schedule-changes apply, program-item cancel, ticket-type issue.  Other POSTs ignore the field."

  - priority: 23
    category: business_constraint
    check: "Version-conflict guard (optimistic concurrency): when a request carries an `If-Match` header whose integer value differs from the target row's `version` integer (the OCC field that increments on every mutation), the server rejects with ERR_VERSION_CONFLICT.  Requests without an If-Match header skip the check (and may therefore lose a race silently, which is the responsibility-of-the-client convention).  An AuditEntry of event_category=OCC_CONFLICT is appended on rejection."
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "PATCH and POST endpoints that mutate an existing row's state — explicitly: program-version publish, program-item confirm, program-item announce, program-item cancel, sound-check schedule, sound-check complete, ticket-type suspend/resume, schedule-change apply/revert/reject, exposure-allocation deliver/void-delivery."

  - priority: 24
    category: business_constraint
    check: "Pagination parameter sanity: `limit` if provided must be an integer in [1, 100]; `offset` if provided must be a non-negative integer.  Both default to the envelope's `pagination_defaults`.  Negative or non-integer values reject with ERR_INVALID_PAGINATION."
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all GET list endpoints."

  - priority: 25
    category: business_constraint
    check: "Body schema sanity: required fields present, types match the entity model, enum strings come from the declared enum sets, integer timestamps are positive Unix seconds, end_time > start_time on every windowed entity (Festival, ProgramItem, Rehearsal, SoundCheckSlot.scheduled_window_*).  Catch-all ERR_INVALID_REQUEST_BODY for malformed JSON, ERR_INVALID_FIELD_VALUE for a specific field violation with a `field` discriminator in the message."
    error_id: "ERR_INVALID_REQUEST_BODY | ERR_INVALID_FIELD_VALUE"
    http_status: 400
    applies_to: "all POST and PATCH endpoints."

  - priority: 26
    category: business_safety
    check: "Audit-log read access: the audit log is readable by AuditViewer, FestivalProducer, and PlatformAdmin roles only.  Other roles get ERR_AUDIT_LOG_FORBIDDEN.  This is a finer-grained gate than the standard role-permission check because read-access on the audit log is a regulatory-grade restriction the scenario highlights ('audit logging for schedule changes and exposure records')."
    error_id: ERR_AUDIT_LOG_FORBIDDEN
    http_status: 403
    applies_to: "GET /festivals/{fid}/audit-entries."

  - priority: 27
    category: business_safety
    check: "Sound-check-stage-mismatch guard: when a SoundCheckSlot is being transitioned REQUESTED→SCHEDULED and the parent ProgramItem's `stage_id` differs from the slot's persisted `stage_id` (because a STAGE_SWAP ScheduleChange happened in between the slot's creation and the scheduling call), the schedule call is rejected with ERR_SOUND_CHECK_STAGE_MISMATCH and the orchestrator must cancel-and-recreate the slot.  The race-condition variant is the concurrency rule of the same name in §1.2.1."
    error_id: ERR_SOUND_CHECK_STAGE_MISMATCH
    http_status: 409
    applies_to: "PATCH /festivals/{fid}/sound-checks/{scid} on REQUESTED→SCHEDULED."

  - priority: 28
    category: business_constraint
    check: "Pool-exhausted guard on a non-sweep ExposureAllocation creation: when the per-kind catalog pool is currently empty according to the latest sweep's snapshot, a fresh ExposureAllocation POST for that kind is accepted but its `actual_units` is set to 0 (the zero-units row) rather than rejected — this is the 'always-create-the-row-for-reporting' rule the scenario implies by talking about a 'post-event exposure-fulfilment report' that should account for under-served sponsors.  The rejection path is only the racing-against-an-in-progress-sweep ERR_CONCURRENT_SWEEP_IN_PROGRESS of §1.2.1.  In other words, this is a *non-rejection* validation outcome — it's documented here for completeness of the priority table but it doesn't produce an error.  The 0-vs-non-zero `actual_units` distinction is the observable side-effect."
    error_id: "(no error — zero-actual-units is the success-with-empty-pool outcome)"
    http_status: 201
    applies_to: "POST /festivals/{fid}/sponsor-tiers/{stid}/exposure-allocations."

  - priority: 29
    category: business_temporal
    check: "Festival-window guard: every windowed-child entity's [start_time, end_time) must lie wholly within the parent Festival's [start_time, end_time) half-open window.  ProgramItem, Rehearsal of either type, SoundCheckSlot's window, all respect this — the only out-of-window thing is the festival's own clock-advance mechanic which can move `real_now + clock_offset_seconds` past Festival.end_time to trigger the auto-close."
    error_id: ERR_CHILD_WINDOW_OUT_OF_FESTIVAL_RANGE
    http_status: 422
    applies_to: "POST and time-PATCH on ProgramItem, Rehearsal, SoundCheckSlot."

  - priority: 30
    category: business_constraint
    check: "Festival's own start_time < end_time and both positive integers.  The festival's `festival_day_count` is computed as ceil((end_time − start_time) / 86400) on every read of the field, and is the denominator in the provisional-refund pro-rata formula — so a zero day-count festival is rejected at creation with ERR_INVALID_FESTIVAL_WINDOW."
    error_id: ERR_INVALID_FESTIVAL_WINDOW
    http_status: 400
    applies_to: "POST /festivals and PATCH /festivals/{fid} on the times."

# -----------------------------------------------------------------------------
# §1.5  API Endpoint Table
#
# Path-prefix convention: every resource hangs under /festivals/{fid}/ except
# the global Artist catalog under /artists and the four dev/test endpoints
# under /_clock, /_events, /_sweep, which are operator-only.
# -----------------------------------------------------------------------------
endpoints:

  # ------- Festival --------------------------------------------------------
  - method: POST
    path: "/festivals"
    description: "Create a new festival in status PLANNED."
    roles: [FestivalProducer, PlatformAdmin]
    code: 201
    input: [name, venue_name, start_time, end_time]
    output: Festival
    side_effects:
      - "status=PLANNED, clock_offset_seconds=0, festival_day_count=ceil((end-start)/86400)."
      - "An AuditEntry of event_category=STATE_TRANSITION (the implicit none→PLANNED entry) is appended."

  - method: GET
    path: "/festivals"
    description: "List festivals (paginated)."
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "Festival[]"
    side_effects: []

  - method: GET
    path: "/festivals/{festivalId}"
    description: "Read one festival."
    roles: [Any]
    code: 200
    input: []
    output: Festival
    side_effects: []

  - method: POST
    path: "/festivals/{festivalId}/open-scheduling"
    description: "PLANNED → SCHEDULING."
    roles: [FestivalProducer]
    code: 200
    input: []
    output: Festival
    side_effects: ["status transition, AuditEntry appended."]

  - method: POST
    path: "/festivals/{festivalId}/cancel"
    description: "Festival-level hard cancel.  Cascades through non-terminal children (program-items, rehearsals, ticket-types, exposure-allocations)."
    roles: [PlatformAdmin]
    code: 200
    input: ["reason"]
    output: Festival
    side_effects:
      - "Fan-out cascade documented on the Festival state machine's CANCELLED transition.  Each cascaded child gets its own AuditEntry."

  # ------- Exposure catalog (festival-level configuration) -----------------
  - method: POST
    path: "/festivals/{festivalId}/exposure-catalog"
    description: "Seed or replace the per-kind total-units dictionary for the festival's exposure catalog.  The dictionary keys are the four kinds (stage_name, screen_time, artist_mention, branded_zone) and the values are non-negative integer total-units.  Idempotent on the same body.  A subsequent PATCH cannot lower a kind below its currently-disbursed sum (ERR_EXPOSURE_CATALOG_BELOW_DISBURSED, §1.4 priority 18)."
    roles: [FestivalProducer]
    code: 200
    input: ["catalog"]
    output: "ExposureCatalogView (a synthetic JSON object reflecting the dict — not a stored entity per se)."
    side_effects: ["Triggers a sponsor-allocation-sweep on the next pool change."]

  - method: GET
    path: "/festivals/{festivalId}/exposure-catalog"
    description: "Read the catalog dict."
    roles: [Any]
    code: 200
    input: []
    output: ExposureCatalogView
    side_effects: []

  - method: PATCH
    path: "/festivals/{festivalId}/exposure-catalog"
    description: "Partial update of the catalog dict — only the provided keys change.  Subject to the disbursed-floor check."
    roles: [FestivalProducer]
    code: 200
    input: ["catalog"]
    output: ExposureCatalogView
    side_effects: ["AuditEntry appended (event_category=EXPOSURE)."]

  - method: POST
    path: "/festivals/{festivalId}/sponsor-allocation-sweep"
    description: "Run the waterfall allocation across all PLANNED|DELIVERED ExposureAllocations for the festival.  Idempotent — see §1.3 `sponsor_waterfall_allocation` for the formula.  Returns the per-allocation actual_units vector."
    roles: [SponsorshipAdmin, FestivalProducer]
    code: 200
    input: []
    output: "SponsorAllocationSweepResult (a synthetic JSON object containing the per-allocation actual_units mapping and the per-kind pool remainders, no DB row of its own)."
    side_effects:
      - "Updates ExposureAllocation.actual_units for every allocation under the festival."
      - "Recomputes SponsorTier.projected_fulfilment_pct."
      - "AuditEntry appended (event_category=EXPOSURE)."

  # ------- ProgramVersion --------------------------------------------------
  - method: POST
    path: "/festivals/{festivalId}/program-versions"
    description: "Create a DRAFT program version."
    roles: [FestivalProducer]
    code: 201
    input: ["version_label"]
    output: ProgramVersion
    side_effects: ["status=DRAFT, AuditEntry appended."]

  - method: GET
    path: "/festivals/{festivalId}/program-versions"
    description: "List program versions for a festival."
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "ProgramVersion[]"
    side_effects: []

  - method: GET
    path: "/festivals/{festivalId}/program-versions/{versionId}"
    description: "Read one program version."
    roles: [Any]
    code: 200
    input: []
    output: ProgramVersion
    side_effects: []

  - method: POST
    path: "/festivals/{festivalId}/program-versions/{versionId}/submit-for-review"
    description: "DRAFT → READY_FOR_REVIEW."
    roles: [FestivalProducer]
    code: 200
    input: []
    output: ProgramVersion
    side_effects: ["state transition, AuditEntry."]

  - method: POST
    path: "/festivals/{festivalId}/program-versions/{versionId}/return-for-revision"
    description: "READY_FOR_REVIEW → DRAFT — the revision-loop edge that makes the program-version state machine cyclic.  Requires a `reason` string."
    roles: [ArtistLiaison]
    code: 200
    input: ["reason"]
    output: ProgramVersion
    side_effects: ["state transition back to DRAFT, AuditEntry with reason in payload_summary."]

  - method: POST
    path: "/festivals/{festivalId}/program-versions/{versionId}/publish"
    description: "DRAFT|READY_FOR_REVIEW → PUBLISHED, atomic CAS on Festival.current_program_version_id keyed by Festival.version.  Pins program_item_ids.  Emits a ScheduleChange of kind=VERSION_PUBLISH with four QUEUED sync envelopes."
    roles: [FestivalProducer]
    code: 200
    input: ["If-Match? header for OCC"]
    output: ProgramVersion
    side_effects:
      - "Festival.current_program_version_id ← this.id, Festival.status PLANNED|SCHEDULING → PUBLISHED on the first publish, prior PUBLISHED version flips to SUPERSEDED with superseded_by_version_id stamped."
      - "Auto-emit ScheduleChange of kind VERSION_PUBLISH (sync_envelopes seeded for the four downstream targets), AuditEntry appended."

  - method: POST
    path: "/festivals/{festivalId}/program-versions/{versionId}/withdraw"
    description: "DRAFT or READY_FOR_REVIEW → WITHDRAWN, only when never PUBLISHED."
    roles: [FestivalProducer]
    code: 200
    input: []
    output: ProgramVersion
    side_effects: ["AuditEntry."]

  # ------- Stage -----------------------------------------------------------
  - method: POST
    path: "/festivals/{festivalId}/stages"
    description: "Register a stage with its zone capacity and equipment-kit wiring."
    roles: [FestivalProducer, StageManager]
    code: 201
    input: ["stage_name", "zone_capacity", "changeover_buffer_seconds?", "equipment_kits", "is_emergency_substitute?"]
    output: Stage
    side_effects: ["AuditEntry."]

  - method: GET
    path: "/festivals/{festivalId}/stages"
    description: "List stages."
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "Stage[]"
    side_effects: []

  - method: GET
    path: "/festivals/{festivalId}/stages/{stageId}"
    description: "Read one stage."
    roles: [Any]
    code: 200
    input: []
    output: Stage
    side_effects: []

  - method: PATCH
    path: "/festivals/{festivalId}/stages/{stageId}"
    description: "Update mutable stage fields (zone_capacity, changeover_buffer_seconds, equipment_kits, is_emergency_substitute, status).  Transition to DECOMMISSIONED requires the stage to have no non-terminal ProgramItems."
    roles: [StageManager]
    code: 200
    input: ["zone_capacity?", "changeover_buffer_seconds?", "equipment_kits?", "is_emergency_substitute?", "status?", "If-Match? header"]
    output: Stage
    side_effects: ["AuditEntry."]

  # ------- EquipmentKit ----------------------------------------------------
  - method: POST
    path: "/festivals/{festivalId}/equipment-kits"
    description: "Register an equipment kit in the festival-wide catalog with its total_units."
    roles: [StageManager, FestivalProducer]
    code: 201
    input: ["kit_code", "total_units", "description?"]
    output: EquipmentKit
    side_effects: ["AuditEntry."]

  - method: GET
    path: "/festivals/{festivalId}/equipment-kits"
    description: "List equipment kits."
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "EquipmentKit[]"
    side_effects: []

  - method: GET
    path: "/festivals/{festivalId}/equipment-kits/{kitId}"
    description: "Read one equipment kit."
    roles: [Any]
    code: 200
    input: []
    output: EquipmentKit
    side_effects: []

  - method: PATCH
    path: "/festivals/{festivalId}/equipment-kits/{kitId}"
    description: "Update total_units or description.  total_units cannot be lowered below the current peak concurrent demand (a soft cousin of the catalog-floor rule — same error_id ERR_EXPOSURE_CATALOG_BELOW_DISBURSED is reused with a different message, scoped by the request path)."
    roles: [StageManager, FestivalProducer]
    code: 200
    input: ["total_units?", "description?", "If-Match?"]
    output: EquipmentKit
    side_effects: ["AuditEntry."]

  # ------- Artist (global catalog) -----------------------------------------
  - method: POST
    path: "/artists"
    description: "Register a global Artist row (artists are festival-independent)."
    roles: [ArtistLiaison, PlatformAdmin]
    code: 201
    input: ["stage_name", "tier", "home_city", "external_commitments?", "minimum_travel_buffer_hours?"]
    output: Artist
    side_effects: []

  - method: GET
    path: "/artists"
    description: "List artists."
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "tier?"]
    output: "Artist[]"
    side_effects: []

  - method: GET
    path: "/artists/{artistId}"
    description: "Read one artist."
    roles: [Any]
    code: 200
    input: []
    output: Artist
    side_effects: []

  - method: PATCH
    path: "/artists/{artistId}"
    description: "Update external_commitments, minimum_travel_buffer_hours, or tier."
    roles: [ArtistLiaison, PlatformAdmin]
    code: 200
    input: ["external_commitments?", "minimum_travel_buffer_hours?", "tier?", "If-Match?"]
    output: Artist
    side_effects: ["Every ProgramItem of the artist has slot_priority_score recomputed."]

  # ------- ProgramItem -----------------------------------------------------
  - method: POST
    path: "/festivals/{festivalId}/program-items"
    description: "Create a ProgramItem under a specific program_version_id (caller supplies the version id in the body).  Status starts PROPOSED.  The overlap, travel-buffer, multi-festival-conflict, equipment-wiring, and within-festival-window checks all run at creation time as advisory rejections — they reject the create when violated.  The OCC-style version field on the row starts at 1."
    roles: [ArtistLiaison, FestivalProducer]
    code: 201
    input: ["program_version_id", "artist_id", "stage_id", "genre", "start_time", "end_time", "equipment_kit_codes?"]
    output: ProgramItem
    side_effects:
      - "slot_priority_score computed."
      - "AuditEntry appended."

  - method: GET
    path: "/festivals/{festivalId}/program-items"
    description: "List ProgramItems for a festival, with filters."
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "status?", "stage_id?", "artist_id?", "program_version_id?"]
    output: "ProgramItem[]"
    side_effects: []

  - method: GET
    path: "/festivals/{festivalId}/program-items/{itemId}"
    description: "Read one ProgramItem."
    roles: [Any]
    code: 200
    input: []
    output: ProgramItem
    side_effects: []

  - method: PATCH
    path: "/festivals/{festivalId}/program-items/{itemId}"
    description: "Update mutable fields: stage_id (the emergency-substitution path), start_time, end_time, genre, equipment_kit_codes.  Re-runs the overlap-and-buffer-and-travel checks against the new tuple.  OCC via If-Match.  Updating a ProgramItem already in ANNOUNCED or later is rejected with ERR_PROGRAM_ITEM_NOT_MUTABLE; the orchestrator must instead emit a ScheduleChange of kind ITEM_RESCHEDULE or STAGE_SWAP."
    roles: [ArtistLiaison, FestivalProducer]
    code: 200
    input: ["stage_id?", "start_time?", "end_time?", "genre?", "equipment_kit_codes?", "If-Match?"]
    output: ProgramItem
    side_effects: ["slot_priority_score recomputed; AuditEntry appended."]

  - method: POST
    path: "/festivals/{festivalId}/program-items/{itemId}/confirm"
    description: "PROPOSED → CONFIRMED.  Runs the full validation cascade.  The cross-entity-state check against Festival.current_program_version_id is the rule 7 instance A gate."
    roles: [ArtistLiaison, FestivalProducer]
    code: 200
    input: ["If-Match?"]
    output: ProgramItem
    side_effects: ["AuditEntry."]

  - method: POST
    path: "/festivals/{festivalId}/program-items/{itemId}/announce"
    description: "CONFIRMED → ANNOUNCED.  Triggers a ScheduleChange of kind TICKET_NOTIFY with four sync envelopes.  Enforces the HEADLINER blocking-rider minimum (the rule 6 instance C cardinality boundary)."
    roles: [ArtistLiaison]
    code: 200
    input: ["If-Match?"]
    output: ProgramItem
    side_effects: ["ScheduleChange auto-created, announcement_sync_state ← QUEUED, AuditEntry appended."]

  - method: POST
    path: "/festivals/{festivalId}/program-items/{itemId}/cancel"
    description: "Any of {PROPOSED, CONFIRMED, ANNOUNCED} → CANCELLED.  Direct cancel path (i.e., not via a ScheduleChange envelope), which fires cascade B (depth 2) and cascade A's sound-check-leg whenever there is a sound-check on the item.  Supports an optional `idempotency_key` body field — see §1.4 priority 22."
    roles: [ArtistLiaison, FestivalProducer]
    code: 200
    input: ["reason", "idempotency_key?", "If-Match?"]
    output: ProgramItem
    side_effects:
      - "Cascade A's sound-check leg fires from this direct cancel (the parent of the cascade chain in the test recipe for rule 4 instance A is in fact ScheduleChange.apply of kind ITEM_CANCEL, but the same cancel logic is the inner mechanism of both paths)."
      - "Cascade B's exposure-allocation leg fires."
      - "Provisional refund computation runs for the affected ticket types."
      - "AuditEntry."

  - method: POST
    path: "/festivals/{festivalId}/program-items/{itemId}/recompute-priority
"
    description: "Idempotent recompute of slot_priority_score — used by tests to force the formula to evaluate without changing any input.  No state transition; updates the slot_priority_score field and Festival's `updated_at` only when the value actually changes."
    roles: [ArtistLiaison, PlatformAdmin]
    code: 200
    input: []
    output: ProgramItem
    side_effects: ["Either no-op or a slot_priority_score update with an AuditEntry of payload_summary='priority recomputed'."]

  - method: POST
    path: "/festivals/{festivalId}/program-items/{itemId}/sound-check/waive"
    description: "Sets sound_check_status to WAIVED.  Allowed only when the current sound_check_status is in {NOT_REQUIRED, REQUESTED} and the item is in {CONFIRMED, ANNOUNCED}.  No SoundCheckSlot is required."
    roles: [StageManager, FestivalProducer]
    code: 200
    input: ["reason"]
    output: ProgramItem
    side_effects: ["sound_check_status ← WAIVED, AuditEntry."]

