# =============================================================================
# Scaffold: Liquidity Stress Testing & Contingency Funding Plan (bank treasury)
# Sections 1.0-1.7 — single source of truth for downstream PRD/test/impl.
# =============================================================================

scenario: |
  Liquidity Stress Testing & Contingency Funding Plan (bank treasury/liquidity desk): cash flow projection under baseline & stress scenarios, high-quality liquid asset inventory & haircuts, funding concentration & wholesale reliance metrics, early warning indicator dashboard & escalation triggers, contingency funding action playbook & capacity testing, collateral pledging & borrowing line availability, intraday liquidity monitoring, board limit reporting

domain_name: liquidity-stress-testing
api_prefix: /liquidity

complexity_profile:
  primary_archetype: compliance_audit        # board limits, breach escalation, SoD approvals, append-only audit events
  secondary_archetype: ledger_reconciliation # CONTRACTUAL vs BEHAVIORAL projections diverge on identical inputs
  complexity_layers:
    - cascading_side_effects                 # pledge release -> line recompute -> suspension -> action blocking; RED reading -> band -> posture -> breach escalation
    - dual_variant_calculation               # projection model variants; BASELINE vs STRESS haircut variants
    - rate_threshold_triggers                # amber/red bands, board limits, posture breakpoints (strictness pinned)
    - optimistic_concurrency                 # OCC on StressScenario.version (run create) and ContingencyPlaybook.version (PATCH)
  entity_topology: flat                      # peer resources linked by FK references
  state_machine_shape: cyclic                # playbook STOOD_DOWN->DRAFT loop; line ACTIVE<->SUSPENDED; asset PLEDGED->UNENCUMBERED; breach fork ACKNOWLEDGED->{REMEDIATED,ESCALATED}
  relationship_patterns: [one_to_many, self_referential, polymorphic, cross_aggregate]
  role_model: segregation_of_duties          # playbook drafter cannot approve; breach acknowledger cannot remediate
  consistency_model: immediate               # all side effects atomic within the triggering request

# =============================================================================
# Section 1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Section 1.1: Entity-Relationship Table
# Money is integer cents; percentages are integer basis points (bps) unless noted.
# common_fields: true  => id (UUID, identity only), created_at, updated_at, version
# common_fields: false => id, created_at only (append-only event entities)
# =============================================================================
entities:
  - name: StressScenario
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Scenario label" }
      - { name: tier, type: enum, source: input, description: "BASELINE | MODERATE | SEVERE; at most one ACTIVE scenario per tier", constraints: "enum {BASELINE, MODERATE, SEVERE}" }
      - { name: deposit_runoff_pct, type: integer, source: input, description: "Behavioral retail deposit runoff percent applied linearly over horizon", constraints: "0..100" }
      - { name: wholesale_renewal_pct, type: integer, source: input, description: "Percent of maturing wholesale funding that rolls over under BEHAVIORAL variant", constraints: "0..100" }
      - { name: level2_addon_bps, type: integer, source: input, description: "Stress haircut add-on (bps) applied to LEVEL_2A/LEVEL_2B assets only in STRESS variant", constraints: "0..10000" }
      - { name: horizon_days, type: integer, source: input, description: "Projection horizon in days", constraints: "1..365" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED", default: ACTIVE, constraints: "enum {ACTIVE, RETIRED}" }
      - { name: run_count, type: integer, source: computed, default: 0, description: "Number of ProjectionRuns created; increments bump version" }

  - name: ProjectionRun
    parent: null
    common_fields: true
    fields:
      - { name: scenario_id, type: string, source: system, description: "FK -> StressScenario.id; taken from the create path" }
      - { name: model_variant, type: enum, source: input, description: "CONTRACTUAL | BEHAVIORAL", constraints: "enum {CONTRACTUAL, BEHAVIORAL}" }
      - { name: as_of_date, type: string, source: input, description: "Business date the projection is anchored to (YYYY-MM-DD)" }
      - { name: horizon_days, type: integer, source: system, description: "Copied from StressScenario.horizon_days at creation" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED | SUPERSEDED | DISCARDED", default: DRAFT, constraints: "enum {DRAFT, FINALIZED, SUPERSEDED, DISCARDED}" }
      - { name: total_inflows_cents, type: integer, source: computed, default: 0, description: "Sum of modeled inflows (0 in this model); set at finalize" }
      - { name: total_outflows_cents, type: integer, source: computed, default: 0, description: "Sum of modeled outflows over horizon; set at finalize" }
      - { name: net_cumulative_gap_cents, type: integer, source: computed, default: 0, description: "total_inflows_cents - total_outflows_cents; set at finalize" }
      - { name: hqla_available_cents, type: integer, source: computed, default: 0, description: "STRESS-variant adjusted HQLA of UNENCUMBERED assets under this run's scenario, captured at finalize" }
      - { name: survival_days, type: integer, source: computed, default: 0, description: "Earliest day d in 1..horizon where cumulative net + hqla_available_cents < 0; else horizon_days" }
      - { name: finalized_at, type: datetime, source: system, description: "Logical clock value at finalize; null until FINALIZED" }

  - name: LiquidAsset
    parent: null
    common_fields: true
    fields:
      - { name: asset_class, type: enum, source: input, description: "HQLA level", constraints: "enum {LEVEL_1, LEVEL_2A, LEVEL_2B}" }
      - { name: reference, type: string, source: input, description: "External security identifier" }
      - { name: market_value_cents, type: integer, source: input, description: "Current market value", constraints: "> 0" }
      - { name: haircut_bps, type: integer, source: computed, description: "Class haircut: LEVEL_1=0, LEVEL_2A=1500, LEVEL_2B=2500" }
      - { name: encumbrance_status, type: enum, source: system, description: "UNENCUMBERED | PLEDGED | SOLD", default: UNENCUMBERED, constraints: "enum {UNENCUMBERED, PLEDGED, SOLD}" }

  - name: FundingSource
    parent: null
    common_fields: true
    fields:
      - { name: counterparty_name, type: string, source: input, description: "Counterparty or deposit segment name" }
      - { name: channel, type: enum, source: input, description: "Funding channel", constraints: "enum {RETAIL_DEPOSIT, WHOLESALE_UNSECURED, WHOLESALE_SECURED, BROKERED}" }
      - { name: balance_cents, type: integer, source: input, description: "Outstanding balance", constraints: "> 0" }
      - { name: matures_in_days, type: integer, source: input, description: "Days from projection as_of_date until contractual maturity; null = non-maturity (demand deposit)", constraints: ">= 0 or null" }

  - name: EwiMetric
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique metric code", constraints: "unique across EwiMetric" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: unit, type: enum, source: input, description: "Unit of value/thresholds", constraints: "enum {PCT_BPS, DAYS, CENTS}" }
      - { name: direction, type: enum, source: input, description: "ABOVE_BREACHES | BELOW_BREACHES", constraints: "enum {ABOVE_BREACHES, BELOW_BREACHES}" }
      - { name: amber_threshold, type: integer, source: input, description: "Amber band boundary (strict, see posture/band calculations)" }
      - { name: red_threshold, type: integer, source: input, description: "Red band boundary; ABOVE requires red > amber, BELOW requires red < amber" }
      - { name: min_reading_interval_hours, type: integer, source: input, default: 0, description: "Minimum spacing between readings by observed_at; 0 = no cadence rule", constraints: ">= 0" }
      - { name: current_band, type: enum, source: computed, default: GREEN, description: "GREEN | AMBER | RED from latest reading by observed_at", constraints: "enum {GREEN, AMBER, RED}" }
      - { name: last_reading_at, type: datetime, source: computed, description: "observed_at of latest reading; null before first reading" }

  - name: MetricReading
    parent: null
    common_fields: false
    fields:
      - { name: metric_id, type: string, source: system, description: "FK -> EwiMetric.id; taken from the create path" }
      - { name: observed_at, type: datetime, source: input, description: "Timestamp the value was observed (drives cadence and latest-reading selection)" }
      - { name: value, type: integer, source: input, description: "Observed value in metric unit" }
      - { name: band, type: enum, source: system, description: "Band this reading produced: GREEN | AMBER | RED", constraints: "enum {GREEN, AMBER, RED}" }

  - name: PostureSnapshot
    parent: null
    common_fields: false
    fields:
      - { name: snapshot_seq, type: integer, source: system, description: "Monotone sequence per deployment; current posture = snapshot with max snapshot_seq" }
      - { name: level, type: enum, source: system, description: "NORMAL | HEIGHTENED | SEVERE | CRISIS", constraints: "enum {NORMAL, HEIGHTENED, SEVERE, CRISIS}" }
      - { name: prior_level, type: enum, source: system, description: "Level of previous snapshot; NORMAL when none", constraints: "enum {NORMAL, HEIGHTENED, SEVERE, CRISIS}" }
      - { name: red_count, type: integer, source: system, description: "EwiMetrics with current_band == RED at evaluation" }
      - { name: amber_count, type: integer, source: system, description: "EwiMetrics with current_band == AMBER at evaluation" }
      - { name: open_breach_count, type: integer, source: system, description: "LimitBreaches with status == OPEN at evaluation" }
      - { name: trigger, type: enum, source: system, description: "READING_AUTO | MANUAL_EVALUATION", constraints: "enum {READING_AUTO, MANUAL_EVALUATION}" }
      - { name: evaluated_by_user_id, type: string, source: system, description: "X-User-ID for manual evaluations; system for READING_AUTO" }

  - name: ContingencyPlaybook
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Playbook name" }
      - { name: scenario_id, type: string, source: input, description: "FK -> StressScenario.id; stress context used by capacity tests" }
      - { name: min_activation_posture, type: enum, source: input, description: "Minimum current posture required to activate", constraints: "enum {NORMAL, HEIGHTENED, SEVERE, CRISIS}" }
      - { name: target_capacity_cents, type: integer, source: input, description: "Funding capacity the playbook must demonstrably cover", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | TESTED | APPROVED | ACTIVATED | EXECUTING | COMPLETED | STOOD_DOWN", default: DRAFT, constraints: "enum {DRAFT, TESTED, APPROVED, ACTIVATED, EXECUTING, COMPLETED, STOOD_DOWN}" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator (SoD anchor)" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of approver; null until APPROVED; cleared on revise" }
      - { name: tested_at, type: datetime, source: system, description: "Logical clock at last passing capacity test; cleared on revise" }
      - { name: activated_at, type: datetime, source: system, description: "Logical clock at activation; null until ACTIVATED" }

  - name: PlaybookAction
    parent: null
    common_fields: true
    fields:
      - { name: playbook_id, type: string, source: system, description: "FK -> ContingencyPlaybook.id; taken from the create path" }
      - { name: kind, type: enum, source: input, description: "ASSET_SALE | LINE_DRAWDOWN", constraints: "enum {ASSET_SALE, LINE_DRAWDOWN}" }
      - { name: sequence_no, type: integer, source: input, description: "Ordering within playbook", constraints: "> 0; unique within playbook" }
      - { name: estimated_proceeds_cents, type: integer, source: input, description: "Planned funding proceeds", constraints: "> 0" }
      - { name: settlement_lag_days, type: integer, source: input, description: "Days between execution and settlement", constraints: ">= 0" }
      - { name: asset_id, type: string, source: input, description: "FK -> LiquidAsset.id; required iff kind == ASSET_SALE" }
      - { name: line_id, type: string, source: input, description: "FK -> BorrowingLine.id; required iff kind == LINE_DRAWDOWN" }
      - { name: prerequisite_action_id, type: string, source: input, description: "FK -> PlaybookAction.id; same playbook, strictly smaller sequence_no (DAG by construction); null = none" }
      - { name: status, type: enum, source: system, description: "PENDING | READY | BLOCKED | EXECUTING | SETTLED | FAILED | SKIPPED", default: PENDING, constraints: "enum {PENDING, READY, BLOCKED, EXECUTING, SETTLED, FAILED, SKIPPED}" }
      - { name: executed_at, type: datetime, source: system, description: "Logical clock at execution; null until EXECUTING" }

  - name: BorrowingLine
    parent: null
    common_fields: true
    fields:
      - { name: provider_name, type: string, source: input, description: "Line provider" }
      - { name: line_type, type: enum, source: input, description: "FED_DISCOUNT_WINDOW | FHLB | REPO", constraints: "enum {FED_DISCOUNT_WINDOW, FHLB, REPO}" }
      - { name: total_capacity_cents, type: integer, source: input, description: "Committed facility size", constraints: "> 0" }
      - { name: advance_rate_bps, type: integer, source: input, description: "Collateral advance rate", constraints: "1..10000" }
      - { name: pledged_value_cents, type: integer, source: computed, default: 0, description: "Sum of pledged_value_cents over ACTIVE CollateralPledges on this line" }
      - { name: drawn_cents, type: integer, source: computed, default: 0, description: "Outstanding drawn balance" }
      - { name: borrowing_power_cents, type: integer, source: computed, default: 0, description: "max(0, min(total_capacity_cents, floor(pledged_value_cents * advance_rate_bps / 10000)) - drawn_cents)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE, constraints: "enum {ACTIVE, SUSPENDED}" }

  - name: CollateralPledge
    parent: null
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> LiquidAsset.id" }
      - { name: line_id, type: string, source: input, description: "FK -> BorrowingLine.id" }
      - { name: pledged_value_cents, type: integer, source: computed, description: "Pinned at creation: floor(market_value_cents * (10000 - haircut_bps) / 10000) at pledge time; never re-priced" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RELEASED", default: ACTIVE, constraints: "enum {ACTIVE, RELEASED}" }

  - name: BoardLimit
    parent: null
    common_fields: true
    fields:
      - { name: subject, type: enum, source: input, description: "What the limit measures", constraints: "enum {EWI_METRIC, WHOLESALE_RELIANCE_PCT, TOP_COUNTERPARTY_PCT, SURVIVAL_DAYS, INTRADAY_NET_POSITION}" }
      - { name: direction, type: enum, source: input, description: "ABOVE_BREACHES | BELOW_BREACHES", constraints: "enum {ABOVE_BREACHES, BELOW_BREACHES}" }
      - { name: limit_value, type: integer, source: input, description: "Limit boundary in subject unit (bps for *_PCT, days for SURVIVAL_DAYS, cents for INTRADAY_NET_POSITION, metric unit for EWI_METRIC)" }
      - { name: severity, type: enum, source: input, description: "BOARD | REGULATORY (informational)", constraints: "enum {BOARD, REGULATORY}" }
      - { name: ewi_metric_id, type: string, source: input, description: "FK -> EwiMetric.id; required iff subject == EWI_METRIC, forbidden otherwise" }

  - name: LimitBreach
    parent: null
    common_fields: true
    fields:
      - { name: limit_id, type: string, source: system, description: "FK -> BoardLimit.id" }
      - { name: subject, type: enum, source: system, description: "Copied from BoardLimit.subject at detection" }
      - { name: detected_value, type: integer, source: system, description: "Observed value that breached" }
      - { name: limit_value, type: integer, source: system, description: "Snapshot of BoardLimit.limit_value at detection" }
      - { name: status, type: enum, source: system, description: "OPEN | ACKNOWLEDGED | ESCALATED | REMEDIATED", default: OPEN, constraints: "enum {OPEN, ACKNOWLEDGED, ESCALATED, REMEDIATED}" }
      - { name: source_type, type: enum, source: system, description: "Detecting pipeline", constraints: "enum {METRIC_READING, FUNDING_EVALUATION, PROJECTION_FINALIZE, INTRADAY_SNAPSHOT}" }
      - { name: source_id, type: string, source: system, description: "Polymorphic reference (not a fixed FK): id of the MetricReading / ProjectionRun / IntradaySnapshot that detected the breach; null for FUNDING_EVALUATION" }
      - { name: acknowledged_by_user_id, type: string, source: system, description: "X-User-ID of acknowledger; null until ACKNOWLEDGED/ESCALATED-from-ACKNOWLEDGED" }
      - { name: remediated_by_user_id, type: string, source: system, description: "X-User-ID of remediator; null until REMEDIATED" }

  - name: IntradaySnapshot
    parent: null
    common_fields: false
    fields:
      - { name: business_date, type: string, source: input, description: "Business date bucket (YYYY-MM-DD); ordering enforced within bucket" }
      - { name: snapshot_at, type: datetime, source: input, description: "Observation timestamp; must be strictly greater than all existing snapshots with same business_date" }
      - { name: opening_balance_cents, type: integer, source: input, description: "Intraday opening cash balance" }
      - { name: payments_received_cents, type: integer, source: input, description: "Cumulative inflows since open", constraints: ">= 0" }
      - { name: payments_sent_cents, type: integer, source: input, description: "Cumulative outflows since open", constraints: ">= 0" }
      - { name: net_position_cents, type: integer, source: computed, description: "opening_balance_cents + payments_received_cents - payments_sent_cents" }

# =============================================================================
# Section 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: StressScenario
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /liquidity/stress-scenarios/{id}/retire"
        actor: RiskOfficer
        preconditions:
          - "If tier == BASELINE: at least one OTHER StressScenario with tier == BASELINE and status == ACTIVE must exist (else ERR_LAST_BASELINE_SCENARIO)"
          - "No ProjectionRun with scenario_id == this.id and status == DRAFT may exist (else ERR_SCENARIO_IN_USE)"
        side_effects: ["RETIRED scenarios reject new projection runs (ERR_SCENARIO_RETIRED)"]

  - entity: ProjectionRun
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, DISCARDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /liquidity/projection-runs/{id}/finalize"
        actor: TreasuryAnalyst
        preconditions:
          - "Scenario referenced by scenario_id has status == ACTIVE (else ERR_SCENARIO_RETIRED)"
        side_effects:
          - "Runs calculation projection_cash_flow: sets total_inflows_cents, total_outflows_cents, net_cumulative_gap_cents, hqla_available_cents, survival_days; finalized_at = logical clock"
          - "Every other ProjectionRun with same scenario_id, same model_variant, status == FINALIZED becomes SUPERSEDED"
          - "Breach detection (calculation breach_detection) for every BoardLimit with subject == SURVIVAL_DAYS against survival_days; source_type = PROJECTION_FINALIZE, source_id = this run id"
      - from: DRAFT
        to: DISCARDED
        trigger: "system (a new ProjectionRun is created for the same scenario_id and model_variant)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Create-with-supersede: at most one DRAFT per (scenario_id, model_variant)"
      - from: FINALIZED
        to: SUPERSEDED
        trigger: "system (another ProjectionRun with same scenario_id and model_variant is finalized)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: LiquidAsset
    initial_state: UNENCUMBERED
    terminal_states: [SOLD]
    transitions:
      - from: UNENCUMBERED
        to: PLEDGED
        trigger: "system (POST /liquidity/collateral-pledges creates an ACTIVE pledge referencing this asset)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PLEDGED
        to: UNENCUMBERED
        trigger: "system (POST /liquidity/collateral-pledges/{id}/release releases the pledge referencing this asset)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNENCUMBERED
        to: SOLD
        trigger: "system (POST /liquidity/playbook-actions/{id}/execute on a READY ASSET_SALE action referencing this asset)"
        actor: system
        preconditions: []
        side_effects: ["Asset leaves HQLA inventory (excluded from hqla_adjusted_value input set)"]
        note: "cyclic UNENCUMBERED<->PLEDGED; SOLD is terminal"

  - entity: ContingencyPlaybook
    initial_state: DRAFT
    terminal_states: [COMPLETED]
    transitions:
      - from: DRAFT
        to: TESTED
        trigger: "POST /liquidity/contingency-playbooks/{id}/capacity-test"
        actor: RiskOfficer
        preconditions:
          - "Playbook has at least one PlaybookAction (else ERR_INVALID_REQUEST)"
          - "Calculation capacity_test evaluates to PASSED (on FAILED the playbook stays DRAFT; result returned inline, no error)"
        side_effects:
          - "tested_at = logical clock"
      - from: TESTED
        to: APPROVED
        trigger: "POST /liquidity/contingency-playbooks/{id}/approve"
        actor: RiskOfficer
        preconditions:
          - "Segregation of duties: X-User-ID != created_by_user_id (else ERR_SOD_VIOLATION)"
        side_effects:
          - "approved_by_user_id = X-User-ID"
      - from: APPROVED
        to: ACTIVATED
        trigger: "POST /liquidity/contingency-playbooks/{id}/activate"
        actor: LiquidityCommittee
        preconditions:
          - "Current posture (level of PostureSnapshot with max snapshot_seq; NORMAL when none) has ordinal >= ordinal of min_activation_posture (else ERR_POSTURE_INSUFFICIENT). Ordinal: NORMAL=0 < HEIGHTENED=1 < SEVERE=2 < CRISIS=3"
          - "No other ContingencyPlaybook has status in {ACTIVATED, EXECUTING} (else ERR_PLAYBOOK_ALREADY_ACTIVE)"
        side_effects:
          - "activated_at = logical clock"
          - "Every PlaybookAction of this playbook with status == PENDING becomes READY (prerequisite enforcement happens at execute time via ERR_PREREQUISITE_ACTION_INCOMPLETE)"
      - from: ACTIVATED
        to: EXECUTING
        trigger: "system (first PlaybookAction of this playbook enters EXECUTING)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVATED
        to: STOOD_DOWN
        trigger: "POST /liquidity/contingency-playbooks/{id}/stand-down"
        actor: LiquidityCommittee
        preconditions:
          - "No PlaybookAction of this playbook has status == EXECUTING (else ERR_INVALID_STATE)"
        side_effects:
          - "Every PlaybookAction of this playbook with status in {PENDING, READY, BLOCKED} becomes SKIPPED"
      - from: EXECUTING
        to: STOOD_DOWN
        trigger: "POST /liquidity/contingency-playbooks/{id}/stand-down"
        actor: LiquidityCommittee
        preconditions:
          - "No PlaybookAction of this playbook has status == EXECUTING (else ERR_INVALID_STATE)"
        side_effects:
          - "Every PlaybookAction of this playbook with status in {PENDING, READY, BLOCKED} becomes SKIPPED"
      - from: EXECUTING
        to: COMPLETED
        trigger: "POST /liquidity/contingency-playbooks/{id}/complete"
        actor: LiquidityCommittee
        preconditions:
          - "Every PlaybookAction of this playbook has status in {SETTLED, FAILED, SKIPPED} (else ERR_ACTIONS_NOT_ALL_TERMINAL)"
        side_effects: []
      - from: STOOD_DOWN
        to: DRAFT
        trigger: "POST /liquidity/contingency-playbooks/{id}/revise"
        actor: TreasuryAnalyst
        preconditions: []
        side_effects:
          - "tested_at = null; approved_by_user_id = null (re-approval required)"
          - "Every PlaybookAction of this playbook with status == SKIPPED becomes PENDING"
        note: "revision loop closes the cycle DRAFT -> ... -> STOOD_DOWN -> DRAFT"

  - entity: PlaybookAction
    initial_state: PENDING
    terminal_states: [SETTLED, FAILED, SKIPPED]
    transitions:
      - from: PENDING
        to: READY
        trigger: "system (playbook activation makes every PENDING action READY)"
        actor: system
        preconditions:
          - "Playbook status in {ACTIVATED, EXECUTING}"
        side_effects: []
      - from: BLOCKED
        to: READY
        trigger: "system (POST /liquidity/borrowing-lines/{id}/reinstate on the referenced line while playbook status in {ACTIVATED, EXECUTING})"
        actor: system
        preconditions: []
        side_effects: []
      - from: BLOCKED
        to: PENDING
        trigger: "system (line reinstatement while playbook status NOT in {ACTIVATED, EXECUTING})"
        actor: system
        preconditions: []
        side_effects: []
      - from: READY
        to: EXECUTING
        trigger: "POST /liquidity/playbook-actions/{id}/execute"
        actor: TreasuryOps
        preconditions:
          - "Playbook status in {ACTIVATED, EXECUTING} (else ERR_INVALID_STATE)"
          - "prerequisite_action_id is null OR prerequisite action status == SETTLED (else ERR_PREREQUISITE_ACTION_INCOMPLETE)"
          - "kind == ASSET_SALE: referenced asset encumbrance_status == UNENCUMBERED (else ERR_ASSET_NOT_AVAILABLE)"
          - "kind == LINE_DRAWDOWN: referenced line status == ACTIVE (else ERR_LINE_SUSPENDED) and estimated_proceeds_cents <= line.borrowing_power_cents (else ERR_INSUFFICIENT_BORROWING_POWER)"
        side_effects:
          - "executed_at = logical clock"
          - "kind == ASSET_SALE: referenced asset UNENCUMBERED -> SOLD"
          - "kind == LINE_DRAWDOWN: referenced line drawn_cents += estimated_proceeds_cents, then borrowing_power_cents recomputed (calculation borrowing_power)"
          - "If playbook status == ACTIVATED: playbook ACTIVATED -> EXECUTING"
      - from: EXECUTING
        to: SETTLED
        trigger: "POST /liquidity/playbook-actions/{id}/settle"
        actor: TreasuryOps
        preconditions:
          - "logical clock >= executed_at + settlement_lag_days (else ERR_SETTLEMENT_NOT_DUE)"
        side_effects: []
      - from: EXECUTING
        to: FAILED
        trigger: "POST /liquidity/playbook-actions/{id}/fail"
        actor: TreasuryOps
        preconditions: []
        side_effects:
          - "kind == LINE_DRAWDOWN: compensation — referenced line drawn_cents -= estimated_proceeds_cents, then borrowing_power_cents recomputed (funds never received)"
      - from: PENDING
        to: SKIPPED
        trigger: "system (playbook stand-down)"
        actor: system
        preconditions: []
        side_effects: []
      - from: READY
        to: SKIPPED
        trigger: "system (playbook stand-down)"
        actor: system
        preconditions: []
        side_effects: []
      - from: BLOCKED
        to: SKIPPED
        trigger: "system (playbook stand-down)"
        actor: system
        preconditions: []
        side_effects: []
      - from: READY
        to: BLOCKED
        trigger: "system (referenced BorrowingLine becomes SUSPENDED; kind == LINE_DRAWDOWN only)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING
        to: BLOCKED
        trigger: "system (referenced BorrowingLine becomes SUSPENDED; kind == LINE_DRAWDOWN only)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: BorrowingLine
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /liquidity/borrowing-lines/{id}/suspend (manual) OR system (automatic when a recompute leaves drawn_cents > min(total_capacity_cents, floor(pledged_value_cents * advance_rate_bps / 10000)))"
        actor: RiskOfficer | system
        preconditions: []
        side_effects:
          - "Every PlaybookAction with line_id == this.id, kind == LINE_DRAWDOWN, status in {PENDING, READY} becomes BLOCKED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /liquidity/borrowing-lines/{id}/reinstate"
        actor: RiskOfficer
        preconditions:
          - "drawn_cents <= min(total_capacity_cents, floor(pledged_value_cents * advance_rate_bps / 10000)) (else ERR_INVALID_STATE)"
        side_effects:
          - "Every PlaybookAction with line_id == this.id and status == BLOCKED becomes READY (if playbook status in {ACTIVATED, EXECUTING}) else PENDING"
        note: "cyclic ACTIVE<->SUSPENDED"

  - entity: CollateralPledge
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /liquidity/collateral-pledges/{id}/release"
        actor: TreasuryOps
        preconditions: []
        side_effects:
          - "Referenced asset PLEDGED -> UNENCUMBERED"
          - "Referenced line: pledged_value_cents and borrowing_power_cents recomputed (calculation borrowing_power)"
          - "Cascade: if recompute leaves line drawn_cents > min(total_capacity_cents, floor(pledged_value_cents * advance_rate_bps / 10000)) and line status == ACTIVE: line ACTIVE -> SUSPENDED (which then blocks its PENDING/READY LINE_DRAWDOWN actions)"

  - entity: LimitBreach
    initial_state: OPEN
    terminal_states: [REMEDIATED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /liquidity/breaches/{id}/acknowledge"
        actor: RiskOfficer
        preconditions: []
        side_effects: ["acknowledged_by_user_id = X-User-ID"]
      - from: ACKNOWLEDGED
        to: ESCALATED
        trigger: "POST /liquidity/breaches/{id}/escalate"
        actor: LiquidityCommittee
        preconditions: []
        side_effects: []
      - from: OPEN
        to: ESCALATED
        trigger: "system (a PostureSnapshot with level in {SEVERE, CRISIS} is appended while this breach is OPEN)"
        actor: system
        preconditions: []
        side_effects: []
        note: "auto-escalation cascade step; acknowledged_by_user_id stays null"
      - from: ACKNOWLEDGED
        to: REMEDIATED
        trigger: "POST /liquidity/breaches/{id}/remediate"
        actor: RiskOfficer | LiquidityCommittee
        preconditions:
          - "Segregation of duties: X-User-ID != acknowledged_by_user_id (else ERR_SOD_VIOLATION)"
          - "Current value of the breach subject is within the limit (ABOVE_BREACHES: value <= limit_value; BELOW_BREACHES: value >= limit_value), re-evaluated at remediate time (else ERR_LIMIT_STILL_BREACHED)"
        side_effects: ["remediated_by_user_id = X-User-ID"]
      - from: ESCALATED
        to: REMEDIATED
        trigger: "POST /liquidity/breaches/{id}/remediate"
        actor: LiquidityCommittee
        preconditions:
          - "Actor role must be LiquidityCommittee (RiskOfficer gets ERR_FORBIDDEN on this branch)"
          - "Segregation of duties: if acknowledged_by_user_id is not null, X-User-ID != acknowledged_by_user_id (else ERR_SOD_VIOLATION)"
          - "Current value of the breach subject is within the limit (else ERR_LIMIT_STILL_BREACHED)"
        side_effects: ["remediated_by_user_id = X-User-ID"]
        note: "branching: ACKNOWLEDGED->{REMEDIATED, ESCALATED} and ESCALATED->REMEDIATED carry divergent role/SoD requirements"

  - entity: PostureSnapshot
    initial_state: NORMAL
    terminal_states: []
    transitions:
      - from: NORMAL
        to: "HEIGHTENED | SEVERE | CRISIS"
        trigger: "POST /liquidity/posture-evaluations (manual) or system READING_AUTO evaluation on a metric band becoming RED"
        actor: RiskOfficer | LiquidityCommittee | system
        preconditions: []
        side_effects:
          - "If new level in {SEVERE, CRISIS}: every LimitBreach with status == OPEN becomes ESCALATED"
      - from: HEIGHTENED
        to: "NORMAL | SEVERE | CRISIS | HEIGHTENED"
        trigger: "same as above"
        actor: RiskOfficer | LiquidityCommittee | system
        preconditions:
          - "De-escalation (raw_level below current): actor role must be LiquidityCommittee AND red_count == 0 AND open_breach_count == 0 (else ERR_FORBIDDEN for role, ERR_DEESCALATION_BLOCKED for conditions)"
          - "De-escalation moves at most one ordinal step per evaluation (hysteresis)"
        side_effects:
          - "If new level in {SEVERE, CRISIS}: every LimitBreach with status == OPEN becomes ESCALATED"
      - from: SEVERE
        to: "HEIGHTENED | CRISIS | SEVERE"
        trigger: "same as above"
        actor: RiskOfficer | LiquidityCommittee | system
        preconditions:
          - "Same de-escalation rules as HEIGHTENED row"
        side_effects:
          - "If new level == CRISIS: every LimitBreach with status == OPEN becomes ESCALATED"
      - from: CRISIS
        to: "SEVERE | CRISIS"
        trigger: "same as above"
        actor: RiskOfficer | LiquidityCommittee | system
        preconditions:
          - "Same de-escalation rules as HEIGHTENED row"
        side_effects: []
      - from: NORMAL
        to: NORMAL
        trigger: "evaluation with raw_level == NORMAL"
        actor: RiskOfficer | LiquidityCommittee | system
        preconditions: []
        side_effects: []
        note: "self-loop snapshots preserve an auditable evaluation history; cyclic machine overall"

# =============================================================================
# Section 1.2.1: Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: playbook-update-stale-version
    parent_entity: ContingencyPlaybook
    write_endpoint: "PATCH /liquidity/contingency-playbooks/{id}"
    occ_field: expected_playbook_version
    description: |
      Updating a DRAFT ContingencyPlaybook whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has just edited the same draft (a legitimate, successful update)
      and the current writer's view of the draft is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: projection-run-create-stale-scenario
    parent_entity: StressScenario
    write_endpoint: "POST /liquidity/stress-scenarios/{id}/projection-runs"
    occ_field: expected_scenario_version
    description: |
      Creating a ProjectionRun against a StressScenario whose version has
      advanced since the client last observed it is rejected. Creating a run
      legitimately supersedes (DISCARDS) any existing DRAFT run for the same
      (scenario_id, model_variant) and bumps the scenario version via run_count,
      so a writer holding a stale scenario version would otherwise silently
      discard a draft it never observed.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Section 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: hqla_adjusted_value
    trigger: "LiquidAsset create, LiquidAsset PATCH (market reprice), GET /liquidity/hqla-summary, ProjectionRun finalize (hqla_available_cents capture), CollateralPledge create (pinned pledged_value_cents uses BASELINE variant)"
    algorithm: aggregation
    formula: |
      Per asset (rounding order PINNED — floor per asset BEFORE summing):
        haircut_total_bps = haircut_bps(asset_class) + addon_bps   # addon applies only to LEVEL_2A/LEVEL_2B
        adjusted_cents(asset) = floor(market_value_cents * (10000 - haircut_total_bps) / 10000)
      total = sum of adjusted_cents over the input set.
      Pledge pinning: pledged_value_cents = floor(market_value_cents * (10000 - haircut_bps) / 10000) with addon = 0 (BASELINE variant), captured once at pledge creation and never re-priced.
    input_set: "LiquidAsset with encumbrance_status == UNENCUMBERED (summary and projection capture); pledge pinning uses the referenced asset regardless of variant"
    constants:
      LEVEL_1_HAIRCUT_BPS: 0
      LEVEL_2A_HAIRCUT_BPS: 1500
      LEVEL_2B_HAIRCUT_BPS: 2500
    precision: "integer cents; floor per asset, then sum (order pinned; per-asset-floor-then-sum and sum-then-floor differ)"
    variants:
      - name: BASELINE
        when: "addon_bps = 0"
        difference: "No stress add-on; LEVEL_2A adjusts at 1500 bps, LEVEL_2B at 2500 bps"
      - name: STRESS
        when: "addon_bps = level2_addon_bps of the referenced StressScenario, applied only to LEVEL_2A/LEVEL_2B"
        difference: "Same assets produce a strictly lower total whenever a LEVEL_2 asset exists and addon > 0"

  - name: projection_cash_flow
    trigger: "POST /liquidity/projection-runs/{id}/finalize"
    algorithm: forward_looking
    formula: |
      Horizon = run.horizon_days (copied from scenario). Days d = 1..horizon.
      CONTRACTUAL variant:
        outflow_d = sum of balance_cents over ALL FundingSource with matures_in_days == d
      BEHAVIORAL variant:
        (a) wholesale channels {WHOLESALE_UNSECURED, WHOLESALE_SECURED, BROKERED}:
            outflow_d += floor(balance_cents * (100 - wholesale_renewal_pct) / 100) for each source with matures_in_days == d
        (b) RETAIL_DEPOSIT sources (any matures_in_days incl. null):
            outflow_d += floor(balance_cents * deposit_runoff_pct / 100 / horizon_days) for every d in 1..horizon (linear runoff)
      Sources with matures_in_days > horizon or null contribute no wholesale/maturity outflow.
      inflow_d = 0 for all d (outflow-only model).
      cumulative_net_d = -sum(outflow_1..d)
      survival_days = min d where cumulative_net_d + hqla_available_cents < 0, else horizon_days
      hqla_available_cents = hqla_adjusted_value STRESS variant under the run's scenario over UNENCUMBERED assets, captured at finalize.
      totals: total_outflows_cents = sum(outflow_d); total_inflows_cents = 0; net_cumulative_gap_cents = -total_outflows_cents.
    input_set: "All FundingSource records (no status filter — FundingSource has no lifecycle); all LiquidAsset with encumbrance_status == UNENCUMBERED for the HQLA capture"
    constants: {}
    precision: "integer cents; floor per funding source per day"
    variants:
      - name: CONTRACTUAL
        when: "run.model_variant == CONTRACTUAL"
        difference: "Full contractual maturity outflows; no behavioral runoff or renewal"
      - name: BEHAVIORAL
        when: "run.model_variant == BEHAVIORAL"
        difference: "Wholesale maturities reduced by renewal_pct; retail deposits runoff linearly; same inputs produce different totals"

  - name: funding_concentration
    trigger: "POST /liquidity/funding-evaluations"
    algorithm: aggregation
    formula: |
      total_funding_cents = sum(balance_cents) over ALL FundingSource records
      wholesale_cents = sum(balance_cents) where channel in {WHOLESALE_UNSECURED, WHOLESALE_SECURED, BROKERED}
      wholesale_reliance_bps = floor(wholesale_cents * 10000 / total_funding_cents)  (0 when total == 0)
      per counterparty c: cp_cents(c) = sum(balance_cents) where counterparty_name == c
      top_counterparty_bps = max over c of floor(cp_cents(c) * 10000 / total_funding_cents)
      top_counterparty_name = argmax; tie-break: counterparty_name ASC (lexicographic)
      Then breach_detection runs for every BoardLimit with subject in {WHOLESALE_RELIANCE_PCT, TOP_COUNTERPARTY_PCT}.
    input_set: "All FundingSource records (point-in-time; no window; not order-sensitive except the pinned tie-break)"
    constants: {}
    precision: "integer bps; floor"

  - name: posture_evaluation
    trigger: "POST /liquidity/posture-evaluations (MANUAL_EVALUATION) or system when a MetricReading makes an EwiMetric's current_band become RED (READING_AUTO)"
    algorithm: threshold
    formula: |
      Inputs (>=3, non-linear interaction):
        red_count   = count of EwiMetric with current_band == RED
        amber_count = count of EwiMetric with current_band == AMBER
        open_breach_count = count of LimitBreach with status == OPEN
        current_level = level of PostureSnapshot with max snapshot_seq; NORMAL when none
      Ordinals: NORMAL=0 < HEIGHTENED=1 < SEVERE=2 < CRISIS=3.
      raw_level = CRISIS    if red_count >= 2
                  SEVERE    elif red_count >= 1
                  HEIGHTENED elif (amber_count >= 3 OR open_breach_count >= 2)
                  NORMAL    otherwise
      READING_AUTO trigger:    new_level = max(current_level, raw_level)   # auto path can only escalate
      MANUAL_EVALUATION:       if raw_level >= current_level -> new_level = raw_level
                               else (de-escalation): requires actor role == LiquidityCommittee (else ERR_FORBIDDEN)
                                 AND red_count == 0 AND open_breach_count == 0 (else ERR_DEESCALATION_BLOCKED);
                                 new_level = one ordinal step below current_level (hysteresis: never two steps in one evaluation)
      Appended PostureSnapshot records level, prior_level, counts, trigger, evaluated_by_user_id, snapshot_seq.
      If new_level in {SEVERE, CRISIS} and new_level > prior_level: every LimitBreach with status == OPEN becomes ESCALATED.
    input_set: "All EwiMetric records; LimitBreach with status == OPEN; latest PostureSnapshot by max snapshot_seq"
    constants: {}
    precision: "integer counts; ordinal comparison"

  - name: borrowing_power
    trigger: "CollateralPledge create/release, draw, repay, LINE_DRAWDOWN execute/fail, capacity_test, BorrowingLine read (derived field)"
    algorithm: aggregation
    formula: |
      Evaluation order PINNED (circular-looking dependency resolved):
        (1) pledged_value_cents = sum(pledged_value_cents) over CollateralPledge with line_id == this line AND status == ACTIVE
        (2) collateral_cap_cents = floor(pledged_value_cents * advance_rate_bps / 10000)
        (3) borrowing_power_cents = max(0, min(total_capacity_cents, collateral_cap_cents) - drawn_cents)
      Suspension rule (evaluated after any recompute): if drawn_cents > min(total_capacity_cents, collateral_cap_cents)
      and status == ACTIVE: line becomes SUSPENDED (see BorrowingLine state machine cascade).
    input_set: "CollateralPledge with status == ACTIVE for the line"
    constants: {}
    precision: "integer cents; floor at step (2)"

  - name: capacity_test
    trigger: "POST /liquidity/contingency-playbooks/{id}/capacity-test"
    algorithm: threshold
    formula: |
      For each PlaybookAction of the playbook:
        cap(action) =
          kind ASSET_SALE:    hqla_adjusted_value STRESS variant (playbook's scenario add-on) of the referenced asset
                              if asset encumbrance_status == UNENCUMBERED, else 0
          kind LINE_DRAWDOWN: referenced line's borrowing_power_cents if line status == ACTIVE, else 0
        action_pass = cap(action) >= estimated_proceeds_cents
      Per-line aggregate check: for each BorrowingLine L referenced by the playbook's LINE_DRAWDOWN actions,
        sum(estimated_proceeds_cents of those actions on L) <= borrowing_power_cents(L).
      total_estimated_cents = sum(estimated_proceeds_cents) over all actions
      total_realizable_cents = sum(min(estimated_proceeds_cents, cap(action)))
      result = PASSED iff every action_pass AND every per-line aggregate check AND total_estimated_cents >= target_capacity_cents
      PASSED -> playbook DRAFT -> TESTED, tested_at = logical clock. FAILED -> stays DRAFT; failures list returned inline.
    input_set: "All PlaybookAction of the playbook (any status; playbook is DRAFT so all are PENDING)"
    constants: {}
    precision: "integer cents"

  - name: intraday_net_position
    trigger: "POST /liquidity/intraday-snapshots"
    algorithm: chronological
    formula: |
      Chronological guard: within the same business_date bucket, snapshot_at must be strictly greater than
      max(snapshot_at) of existing IntradaySnapshot records with that business_date (else ERR_SNAPSHOT_OUT_OF_ORDER).
      net_position_cents = opening_balance_cents + payments_received_cents - payments_sent_cents
      Then breach_detection runs for every BoardLimit with subject == INTRADAY_NET_POSITION against net_position_cents;
      source_type = INTRADAY_SNAPSHOT, source_id = this snapshot id.
    input_set: "Existing IntradaySnapshot records with the same business_date (ordering only)"
    constants: {}
    precision: "integer cents"

  - name: breach_detection
    trigger: "Invoked by funding_concentration, posture-relevant metric readings (EWI_METRIC limits), projection finalize (SURVIVAL_DAYS limits), intraday snapshots (INTRADAY_NET_POSITION limits)"
    algorithm: threshold
    formula: |
      Boundary strictness PINNED:
        ABOVE_BREACHES: breach iff observed_value >  limit_value   (value == limit_value does NOT breach)
        BELOW_BREACHES: breach iff observed_value <  limit_value   (value == limit_value does NOT breach)
      Dedupe: skip creation when a LimitBreach with the same limit_id and status in {OPEN, ACKNOWLEDGED, ESCALATED}
      already exists (only REMEDIATED history may co-exist with a fresh breach).
      New breach: status OPEN, detected_value = observed value, limit_value snapshotted, subject copied, source_type/source_id set.
    input_set: "BoardLimit records matching the invoking pipeline's subject set (all limits are ACTIVE — BoardLimit has no lifecycle)"
    constants: {}
    precision: "integer comparison"

# =============================================================================
# Section 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Actor role is in the endpoint's roles list (RBAC; includes state-specific role rules such as ESCALATED-breach remediation requiring LiquidityCommittee and posture de-escalation requiring LiquidityCommittee)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path-template ids resolve to existing resources, validated left-to-right; body-supplied FK references (scenario_id, asset_id, line_id, prerequisite_action_id, ewi_metric_id) must exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all endpoints with path ids or FK inputs
  - priority: 4
    category: business_constraint
    check: "Request shape: required fields present, types valid, enum members valid, numeric ranges respected; cross-field rules (EWI metric: ABOVE_BREACHES requires red_threshold > amber_threshold, BELOW_BREACHES requires red_threshold < amber_threshold -> ERR_THRESHOLD_CONFIG_INVALID; PlaybookAction: asset_id present iff kind == ASSET_SALE, line_id present iff kind == LINE_DRAWDOWN, prerequisite_action_id belongs to same playbook with strictly smaller sequence_no; BoardLimit: ewi_metric_id present iff subject == EWI_METRIC; capacity-test requires >= 1 action)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all mutating endpoints
  - priority: 5
    category: business_constraint
    check: "OCC: expected_<parent>_version equals the parent resource's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["PATCH /liquidity/contingency-playbooks/{id}", "POST /liquidity/stress-scenarios/{id}/projection-runs"]
  - priority: 6
    category: state
    check: "Target resource is in a valid from-state for the requested transition (state machine preconditions on the addressed resource)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints
  - priority: 7
    category: business_safety
    check: "Segregation of duties: approve requires X-User-ID != created_by_user_id; remediate requires X-User-ID != acknowledged_by_user_id (when set)"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: ["POST /liquidity/contingency-playbooks/{id}/approve", "POST /liquidity/breaches/{id}/remediate"]
  - priority: 7
    category: business_safety
    check: "Current posture ordinal >= playbook min_activation_posture ordinal"
    error_id: ERR_POSTURE_INSUFFICIENT
    http_status: 409
    applies_to: ["POST /liquidity/contingency-playbooks/{id}/activate"]
  - priority: 7
    category: business_safety
    check: "Referenced BorrowingLine must have status == ACTIVE"
    error_id: ERR_LINE_SUSPENDED
    http_status: 409
    applies_to: ["POST /liquidity/borrowing-lines/{id}/draw", "POST /liquidity/collateral-pledges", "POST /liquidity/playbook-actions/{id}/execute"]
  - priority: 7
    category: business_safety
    check: "Referenced LiquidAsset must have encumbrance_status == UNENCUMBERED to be pledged"
    error_id: ERR_ASSET_NOT_PLEDGEABLE
    http_status: 409
    applies_to: ["POST /liquidity/collateral-pledges"]
  - priority: 7
    category: business_safety
    check: "Referenced LiquidAsset must have encumbrance_status == UNENCUMBERED to execute an ASSET_SALE"
    error_id: ERR_ASSET_NOT_AVAILABLE
    http_status: 409
    applies_to: ["POST /liquidity/playbook-actions/{id}/execute"]
  - priority: 7
    category: business_safety
    check: "StressScenario must have status == ACTIVE to accept a new run or a finalize"
    error_id: ERR_SCENARIO_RETIRED
    http_status: 409
    applies_to: ["POST /liquidity/stress-scenarios/{id}/projection-runs", "POST /liquidity/projection-runs/{id}/finalize"]
  - priority: 7
    category: business_safety
    check: "Posture de-escalation requires red_count == 0 and open_breach_count == 0"
    error_id: ERR_DEESCALATION_BLOCKED
    http_status: 409
    applies_to: ["POST /liquidity/posture-evaluations"]
  - priority: 8
    category: business_temporal
    check: "Logical clock >= executed_at + settlement_lag_days"
    error_id: ERR_SETTLEMENT_NOT_DUE
    http_status: 409
    applies_to: ["POST /liquidity/playbook-actions/{id}/settle"]
  - priority: 8
    category: business_temporal
    check: "Reading cadence: observed_at must be >= last_reading_at + min_reading_interval_hours (== allowed, < rejected)"
    error_id: ERR_READING_TOO_FREQUENT
    http_status: 409
    applies_to: ["POST /liquidity/ewi-metrics/{id}/readings"]
  - priority: 8
    category: business_temporal
    check: "snapshot_at must be strictly greater than all existing snapshots with the same business_date"
    error_id: ERR_SNAPSHOT_OUT_OF_ORDER
    http_status: 409
    applies_to: ["POST /liquidity/intraday-snapshots"]
  - priority: 9
    category: business_constraint
    check: "At most one ACTIVE StressScenario per tier"
    error_id: ERR_DUPLICATE_ACTIVE_SCENARIO
    http_status: 409
    applies_to: ["POST /liquidity/stress-scenarios"]
  - priority: 9
    category: business_constraint
    check: "The last ACTIVE BASELINE scenario cannot be retired"
    error_id: ERR_LAST_BASELINE_SCENARIO
    http_status: 409
    applies_to: ["POST /liquidity/stress-scenarios/{id}/retire"]
  - priority: 9
    category: business_constraint
    check: "Scenario with a DRAFT ProjectionRun cannot be retired"
    error_id: ERR_SCENARIO_IN_USE
    http_status: 409
    applies_to: ["POST /liquidity/stress-scenarios/{id}/retire"]
  - priority: 9
    category: business_constraint
    check: "At most one ContingencyPlaybook may hold status in {ACTIVATED, EXECUTING} (open-ended mutual exclusion)"
    error_id: ERR_PLAYBOOK_ALREADY_ACTIVE
    http_status: 409
    applies_to: ["POST /liquidity/contingency-playbooks/{id}/activate"]
  - priority: 9
    category: business_constraint
    check: "Prerequisite action must have status == SETTLED"
    error_id: ERR_PREREQUISITE_ACTION_INCOMPLETE
    http_status: 409
    applies_to: ["POST /liquidity/playbook-actions/{id}/execute"]
  - priority: 9
    category: business_constraint
    check: "All PlaybookActions must be in {SETTLED, FAILED, SKIPPED} to complete"
    error_id: ERR_ACTIONS_NOT_ALL_TERMINAL
    http_status: 409
    applies_to: ["POST /liquidity/contingency-playbooks/{id}/complete"]
  - priority: 9
    category: business_constraint
    check: "Remediation requires the current subject value to be within the limit at remediate time"
    error_id: ERR_LIMIT_STILL_BREACHED
    http_status: 409
    applies_to: ["POST /liquidity/breaches/{id}/remediate"]
  - priority: 10
    category: business_fiscal
    check: "amount_cents / estimated_proceeds_cents must be > 0 and <= borrowing_power_cents (== power is allowed)"
    error_id: ERR_INSUFFICIENT_BORROWING_POWER
    http_status: 409
    applies_to: ["POST /liquidity/borrowing-lines/{id}/draw", "POST /liquidity/playbook-actions/{id}/execute"]
  - priority: 10
    category: business_fiscal
    check: "amount_cents must be > 0 and <= drawn_cents"
    error_id: ERR_REPAY_EXCEEDS_DRAWN
    http_status: 409
    applies_to: ["POST /liquidity/borrowing-lines/{id}/repay"]

# =============================================================================
# Section 1.5: API Endpoint Table
# Roles shorthand below is explicit per row. "biz4" = [TreasuryAnalyst, RiskOfficer, TreasuryOps, LiquidityCommittee]
# =============================================================================
endpoints:
  - method: POST
    path: "/liquidity/_clock/set_current_utc"
    description: "Test-driving endpoint: sets the logical clock. Before any call, the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock advanced; no entity mutation"]

  - method: POST
    path: "/liquidity/stress-scenarios"
    description: "Create a StressScenario (status ACTIVE)"
    roles: [RiskOfficer]
    code: 201
    input: [name, tier, deposit_runoff_pct, wholesale_renewal_pct, level2_addon_bps, horizon_days]
    output: StressScenario
    side_effects: ["uniqueness check: at most one ACTIVE scenario per tier"]

  - method: GET
    path: "/liquidity/stress-scenarios"
    description: "List StressScenarios"
    roles: [TreasuryAnalyst, RiskOfficer, TreasuryOps, LiquidityCommittee]
    code: 200
    input: ["tier?", "status?", "limit?", "offset?"]
    output: StressScenario[]
    side_effects: []

  - method: GET
    path: "/liquidity/stress-scenarios/{id}"
    description: "Get a StressScenario"
    roles: [TreasuryAnalyst, RiskOfficer, TreasuryOps, LiquidityCommittee]
    code: 200
    input: []
    output: StressScenario
    side_effects: []

  - method: POST
    path: "/liquidity/stress-scenarios/{id}/retire"
    description: "Retire an ACTIVE scenario"
    roles: [RiskOfficer]
    code: 200
    input: []
    output: StressScenario
    side_effects: ["ACTIVE -> RETIRED"]

  - method: GET
    path: "/liquidity/stress-scenarios/{id}/projection-runs"
    description: "List ProjectionRuns of a scenario (FK reverse-reachability)"
    roles: [TreasuryAnalyst, RiskOfficer, TreasuryOps, LiquidityCommittee]
    code: 200
    input: ["limit?", "offset?"]
    output: ProjectionRun[]
    side_effects: []

  - method: POST
    path: "/liquidity/stress-scenarios/{id}/projection-runs"
    description: "Create a ProjectionRun (DRAFT) under a scenario; supersedes existing DRAFT for same (scenario, model_variant); OCC on scenario version"
    roles: [TreasuryAnalyst]
    code: 201
    input: [model_variant, as_of_date, expected_scenario_version]
    output: ProjectionRun
    side_effects:
      - "existing DRAFT ProjectionRun with same scenario_id and model_variant becomes DISCARDED"
      - "increments StressScenario.run_count by 1 and increments StressScenario.version by 1"

  - method: GET
    path: "/liquidity/projection-runs/{id}"
    description: "Get a ProjectionRun"
    roles: [TreasuryAnalyst, RiskOfficer, TreasuryOps, LiquidityCommittee]
    code: 200
    input: []
    output: ProjectionRun
    side_effects: []

  - method: POST
    path: "/liquidity/projection-runs/{id}/finalize"
    description: "Finalize a DRAFT run: computes projection_cash_flow, supersedes prior FINALIZED same (scenario, variant), runs SURVIVAL_DAYS breach detection"
    roles: [TreasuryAnalyst]
    code: 200
    input: []
    output: ProjectionRun
    side_effects:
      - "sets total_inflows_cents, total_outflows_cents, net_cumulative_gap_cents, hqla_available_cents, survival_days, finalized_at"
      - "prior FINALIZED runs for same (scenario_id, model_variant) become SUPERSEDED"
      - "breach_detection for BoardLimit subject == SURVIVAL_DAYS"

  - method: POST
    path: "/liquidity/liquid-assets"
    description: "Register a LiquidAsset (UNENCUMBERED)"
    roles: [TreasuryOps]
    code: 201
    input: [asset_class, reference, market_value_cents]
    output: LiquidAsset
    side_effects: ["haircut_bps derived from asset_class"]

  - method: GET
    path: "/liquidity/liquid-assets"
    description: "List LiquidAssets"
    roles: [TreasuryAnalyst, RiskOfficer, TreasuryOps, LiquidityCommittee]
    code: 200
    input: ["asset_class?", "encumbrance_status?", "limit?", "offset?"]
    output: LiquidAsset[]
    side_effects: []

  - method: PATCH
    path: "/liquidity/liquid-assets/{id}"
    description: "Reprice an asset (market value update)"
    roles: [TreasuryOps]
    code: 200
    input: [market_value_cents]
    output: LiquidAsset
    side_effects: ["future haircut computations use new value; existing pledges keep pinned pledged_value_cents; increments LiquidAsset.version by 1"]

  - method: GET
    path: "/liquidity/hqla-summary"
    description: "Computed read: HQLA adjusted totals over UNENCUMBERED assets under both haircut variants (stress add-on taken from the given scenario)"
    roles: [TreasuryAnalyst, RiskOfficer, TreasuryOps, LiquidityCommittee]
    code: 200
    input: [scenario_id]
    output: { baseline_total_cents: integer, stress_total_cents: integer, asset_count: integer }
    side_effects: []

  - method: POST
    path: "/liquidity/funding-sources"
    description: "Record a FundingSource balance"
    roles: [TreasuryAnalyst]
    code: 201
    input: [counterparty_name, channel, balance_cents, "matures_in_days?"]
    output: FundingSource
    side_effects: []

  - method: POST
    path: "/liquidity/funding-evaluations"
    description: "Run funding_concentration over all FundingSources; breach_detection for WHOLESALE_RELIANCE_PCT and TOP_COUNTERPARTY_PCT limits"
    roles: [RiskOfficer]
    code: 201
    input: []
    output: { total_funding_cents: integer, wholesale_reliance_bps: integer, top_counterparty_bps: integer, top_counterparty_name: string, breaches_created: integer }
    side_effects: ["creates LimitBreach (OPEN, source_type FUNDING_EVALUATION) per newly breached limit"]

  - method: POST
    path: "/liquidity/ewi-metrics"
    description: "Configure an EWI metric"
    roles: [RiskOfficer]
    code: 201
    input: [code, name, unit, direction, amber_threshold, red_threshold, "min_reading_interval_hours?"]
    output: EwiMetric
    side_effects: ["current_band = GREEN"]

  - method: GET
    path: "/liquidity/ewi-metrics"
    description: "List EWI metrics"
    roles: [TreasuryAnalyst, RiskOfficer, TreasuryOps, LiquidityCommittee]
    code: 200
    input: ["limit?", "offset?"]
    output: EwiMetric[]
    side_effects: []

  - method: GET
    path: "/liquidity/ewi-metrics/{id}"
