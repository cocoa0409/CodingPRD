  # ===========================================================================
  - section: errors
    instances:

      - name: error_reporting_window_open_blocks_approval_after_option_in
        claim_type: Violation -> Error
        grounds:
          - errors[ERR_REPORTING_WINDOW_OPEN]
          - validations[priority=7]
          - state_machines.EventApplication.prizing_report_status.NOT_DUE_to_DUE
        distinguishing_aspect: "State priority 7 fires before the release-legality rule at priority 8: with the prizing window opted in, approval returns 409 ERR_REPORTING_WINDOW_OPEN even though the release is street-legal."
        test_recipe:
          setup:
            - "Logical clock at the street date; one store, one set release, one FIXED format; one SUBMITTED QUALIFIER application that has been opted into the reporting window."
          setup_api_calls:
