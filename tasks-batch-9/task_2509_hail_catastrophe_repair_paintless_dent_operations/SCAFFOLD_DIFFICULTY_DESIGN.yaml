  - rule_id: combinatorial_formula
    instances:

      - name: targeting_score_nested_min_max_with_confidence_branch
        grounds:
          - calculations.storm_targeting_score
          - entities.StormEvent.fields.targeting_score
          - entities.StormEvent.fields.swath_confidence
          - validations[priority=36]
        distinguishing_aspect: |
          Mode (a) nesting: one score composes a confidence-selected weight, TWO independent
          min-caps (HAIL_MM_CAP 60 and POPULATION_CAP 250000), a third cap on competitor count
          (COMPETITOR_CAP 12), a step bonus keyed on SWATH_BONUS_KM2_THRESHOLD, a subtraction and
          an outer max(0, min(100, .)) clamp — three events built from the same shape score 72, 56
          and 98, so any single dropped cap or branch changes at least one of the three.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T08:00:00Z."
            - "No other entities are needed: the calculation reads only the StormEvent's own inputs."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T08:00:00Z" }
              as: CatastropheDirector
          trigger:
            - call: "POST /hail-ops/storm-events"
              payload: { name: "GT Baseline", region_state_code: "KS", max_hail_size_mm: 55, swath_area_km2: 520, swath_confidence: "GROUND_TRUTHED", vehicle_population_estimate: 40000, competitor_shop_count: 3, first_hail_at: "2026-08-04T21:00:00Z" }
              as: CatastropheDirector
              captures: { ev_gt: $.data.id, score_gt: $.data.targeting_score }
            - call: "POST /hail-ops/storm-events"
              payload: { name: "Modeled Twin", region_state_code: "KS", max_hail_size_mm: 55, swath_area_km2: 520, swath_confidence: "MODELED", vehicle_population_estimate: 40000, competitor_shop_count: 3, first_hail_at: "2026-08-04T21:00:00Z" }
              as: CatastropheDirector
              captures: { ev_mod: $.data.id }
            - call: "POST /hail-ops/storm-events"
              payload: { name: "Triple Cap Monster", region_state_code: "TX", max_hail_size_mm: 85, swath_area_km2: 100, swath_confidence: "GROUND_TRUTHED", vehicle_population_estimate: 300000, competitor_shop_count: 20, first_hail_at: "2026-08-04T23:00:00Z" }
              as: CatastropheDirector
              captures: { ev_cap: $.data.id }
          assert:
            - "StormEvent.${ev_gt}.targeting_score == 72"
            - "StormEvent.${ev_mod}.targeting_score == 56"
            - "StormEvent.${ev_cap}.targeting_score == 98"
            - "StormEvent.${ev_gt}.targeting_score - StormEvent.${ev_mod}.targeting_score == 16"
            - "StormEvent.${ev_gt}.status == EVALUATING and StormEvent.${ev_mod}.status == EVALUATING and StormEvent.${ev_cap}.status == EVALUATING"

      - name: per_panel_rounding_before_summation_pins_estimate_total
        grounds:
          - calculations.vehicle_repair_estimate
          - entities.DamageLine.fields.pdr_line_cents
          - entities.Vehicle.fields.matrix_variant_total_cents
        distinguishing_aspect: |
          Mode (b) pinned rounding order: the three panels' raw matrix charges are 110778.4,
          42945.0 and 49163.4 cents, so rounding each panel first and summing yields exactly
          202886 while summing the raws (202886.8) and rounding once yields 202887 — the two
          orders differ by exactly 1 cent, and matrix_variant_total_cents must equal 202886.
        test_recipe:
          setup:
            - "Identical fixture to pdr_versus_conventional_variant_divergence_on_estimate up to and including the three damage lines (HOOD 42 NICKEL r_and_i 0.5h, ROOF 15 DIME r_and_i 1.5h, LEFT_QUARTER 9 QUARTER aluminum), whose raw matrix charges carry .4 / .0 / .4 fractional cents."
          setup_api_calls:
