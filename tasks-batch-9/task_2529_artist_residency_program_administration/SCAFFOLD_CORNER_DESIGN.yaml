              captures: { res_v: "$.data.version" }
          assert:
            - "before the reschedule the case reads filing_deadline_date '2026-06-20', earliest_entry_date '2026-10-03', case_type 'B1_SHORT_TERM' and days_to_filing_deadline -42"
            - "the reschedule returns 200 with session_start_date '2027-03-01', session_length_weeks 9 and session_end_date '2027-05-02' (2027-03-01 + 63 - 1 day)"
            - "GET /visa-cases/${vc} now reads filing_deadline_date == '2026-10-17' (2027-03-01 minus 135 days) and earliest_entry_date == '2027-01-30' (minus 30 days), with backlog_days still 45"
            - "case_type flipped across the boundary: 'J1_RESEARCH_SCHOLAR', because 9 >= VISA_J1_MIN_SESSION_WEEKS"
            - "the countdown flipped sign: days_to_filing_deadline == 77, computed from the clock 2026-08-01 to 2026-10-17"
            - "the case's own version moved exactly once, per the schedule endpoint's declared side effect: VisaCase.version == ${vc_v0} + 1, while status is still 'INITIATED' and rfe_round still 0"
            - "the countdown is a live read, not a stored column: with no further writes, POST /_clock/set_current_utc to '2026-09-17T00:00:00Z' makes the very next GET /visa-cases/${vc} report days_to_filing_deadline == 30, and VisaCase.version does not change"
            - "the obligation set was re-derived in place by the same call rather than duplicated: GET /obligations?residency_id=${res} still returns total_count == 4, with COMMUNITY_WORKSHOP required_count floor(9/4) == 2 and every due_date now '2027-05-02'"

      - name: studio_auto_selection_prefers_the_least_over_provisioned_then_breaks_ties_on_code
        claim_type: correct_result
        grounds: ["calculations.studio_auto_selection", "constants.VENTILATION_RANK", "endpoints[POST /studio-assignments]", "entities.StudioAssignment.selection_mode"]
        distinguishing_aspect: "Six studios are registered so that the eligibility filter, all three substantive ranking keys and the code tie-break each decide something: one studio fails on capability, one on ventilation rank, one wins on ventilation rank, one on tag count, and the last two are identical on every key so only Studio.code ASC separates them. A selector that returned the first eligible row, the best-equipped row, or an id-ordered row would pick a different studio in each case."
        test_recipe:
          setup: ["A scheduled 8-week SCULPT residency (2026-11-02 .. 2026-12-27) whose discipline requires capability WELDING and ventilation LOCAL, plus six studios: S-A ['WELDING','KILN','DARKROOM'] LOCAL max 1; S-B ['WELDING','KILN'] FUME_HOOD max 1; S-C ['WELDING','KILN'] LOCAL max 1; S-D ['WELDING','KILN'] LOCAL max 1; S-E ['PRINT_PRESS'] LOCAL max 1; S-F ['WELDING'] NONE max 1."]
