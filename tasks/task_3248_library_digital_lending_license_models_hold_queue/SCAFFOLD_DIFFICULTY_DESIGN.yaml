            - call: "POST /lending/loans"
              payload: { patron_id: "${patq0_id}", title_id: "${titlem_id}" }
              as: Patron
              as_user_id: "${patq0_id}"
            - call: "POST /lending/holds"
              payload: { patron_id: "${patq1_id}", title_id: "${titlem_id}" }
              as: Patron
