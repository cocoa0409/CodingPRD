            - call: "GET /accreditation/units/${bp_u}"
              as: SafetyOfficer
              captures: { bp_posture_7: $.data.posture, bp_points_7: $.data.open_deficiency_penalty_points, bp_score_7: $.data.readiness_score, bp_band_7: $.data.readiness_band }
            - call: "POST /accreditation/rounding-sessions/${bp_rs}/deficiencies"
              payload: { standard_id: "${bp_s1}", description: "Eyewash overdue", severity: "HIGH" }
              as: SafetyOfficer
              captures: { bp_k2: $.data.id, bp_k2_due: $.data.due_at, bp_k2_acc: $.data.accelerated }
            - call: "GET /accreditation/units/${bp_u}"
              as: SafetyOfficer
              captures: { bp_posture_14: $.data.posture, bp_points_14: $.data.open_deficiency_penalty_points, bp_score_14: $.data.readiness_score }
            - call: "POST /accreditation/rounding-sessions/${bp_rs}/deficiencies"
              payload: { standard_id: "${bp_s2}", description: "Corridor clutter", severity: "LOW" }
              as: SafetyOfficer
              captures: { bp_k3: $.data.id, bp_k3_due: $.data.due_at, bp_k3_acc: $.data.accelerated }
            - call: "GET /accreditation/units/${bp_u}"
              as: SafetyOfficer
              captures: { bp_posture_15: $.data.posture, bp_points_15: $.data.open_deficiency_penalty_points, bp_score_15: $.data.readiness_score, bp_band_15: $.data.readiness_band }
          assert:
            - "${bp_score_base} == 78.00 (39 of 50 weight earned)"
            - "${bp_k1_due} == 2026-08-24T00:00:00.000Z and ${bp_k1_acc} == false (band snapshot CONDITIONAL, full 14 days)"
            - "${bp_points_7} == 7 and ${bp_posture_7} == OPEN and ${bp_score_7} == 71.00 and ${bp_band_7} == AT_RISK"
            - "${bp_k2_due} == 2026-08-17T00:00:00.000Z and ${bp_k2_acc} == true (band snapshot AT_RISK halves 14 to 7)"
            - "${bp_points_14} == 14 and ${bp_posture_14} == OPEN at threshold minus 1 and ${bp_score_14} == 64.00"
            - "${bp_k3_due} == 2026-09-01T00:00:00.000Z and ${bp_k3_acc} == true (45 halved by floor to 22 days)"
            - "${bp_points_15} == 15 and ${bp_posture_15} == RESTRICTED at exactly the threshold, ${bp_score_15} == 63.00, ${bp_band_15} == AT_RISK"

      - name: empty_participating_set_not_assessed_versus_zero_score
        grounds:
          - calculations.unit_readiness_score
          - calculations.mock_tracer_score
          - entities.MockTracer.fields.contributes_to_readiness
          - entities.HospitalUnit.fields.readiness_band
          - endpoints[GET /accreditation/units/{id}/readiness]
        distinguishing_aspect: |
          Boundary on the scored_weight == 0 edge of a different calculation: a COMPLETED tracer whose
          only observation is NOT_APPLICABLE leaves the participating set empty, so readiness must
          report 0.00 with band NOT_ASSESSED and the 7-point penalty must NOT be subtracted - the
          neighbouring case (a scored tracer at 0.00) yields band NOT_READY instead.
        test_recipe:
          setup:
            - "Chapter NPSG weight_pct 60 with one owned standard, unit AMB-1, clock 2026-08-10T00:00:00Z."
            - "One tracer COMPLETED with exactly one NOT_APPLICABLE observation, plus one OPEN HIGH ticket worth 7 points."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "NPSG", name: "National Patient Safety Goals", weight_pct: 60, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { na_ch: $.data.id }
            - call: "POST /accreditation/chapters/${na_ch}/standards"
              payload: { standard_code: "NPSG.03.04.01", title: "Label all medications", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { na_s1: $.data.id }
            - call: "POST /accreditation/standards/${na_s1}/owner-assignments"
              payload: { owner_user_id: "owner-1", designation: "PRIMARY" }
              as: AccreditationDirector
            - call: "POST /accreditation/units"
              payload: { name: "AMB-1", unit_type: "AMBULATORY", bed_count: 0 }
              as: AccreditationDirector
              captures: { na_u: $.data.id, na_u_v1: $.data.version }
            - call: "POST /accreditation/mock-tracers"
              payload: { unit_id: "${na_u}", chapter_id: "${na_ch}", tracer_type: "INDIVIDUAL", window_start: "2026-08-05T08:00:00Z", window_end: "2026-08-05T09:00:00Z", expected_unit_version: "${na_u_v1}" }
              as: TracerSurveyor
              captures: { na_t: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: AccreditationDirector
            - call: "POST /accreditation/mock-tracers/${na_t}/transition"
              payload: { action: "START" }
              as: TracerSurveyor
            - call: "POST /accreditation/mock-tracers/${na_t}/observations"
              payload: { standard_id: "${na_s1}", result: "NOT_APPLICABLE", weight: 5 }
              as: TracerSurveyor
            - call: "POST /accreditation/mock-tracers/${na_t}/transition"
              payload: { action: "COMPLETE" }
              as: TracerSurveyor
              captures: { na_t_score: $.data.tracer_score, na_t_contrib: $.data.contributes_to_readiness }
            - call: "POST /accreditation/rounding-sessions"
              payload: { unit_id: "${na_u}", round_type: "ENVIRONMENT_OF_CARE", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z" }
              as: SafetyOfficer
              captures: { na_rs: $.data.id }
            - call: "POST /accreditation/rounding-sessions/${na_rs}/deficiencies"
              payload: { standard_id: "${na_s1}", description: "Unlabeled syringe", severity: "HIGH" }
              as: SafetyOfficer
              captures: { na_k: $.data.id }
          trigger:
            - call: "GET /accreditation/units/${na_u}/readiness"
              as: AccreditationDirector
              captures: { na_score: $.data.readiness_score, na_band: $.data.readiness_band, na_penalty: $.data.penalty_points_applied, na_weight: $.data.participating_weight_pct }
          assert:
            - "${na_t_score} == 0.00 and ${na_t_contrib} == false (scored_weight is 0 because the only observation is NOT_APPLICABLE)"
            - "${na_score} == 0.00 and ${na_band} == NOT_ASSESSED, not NOT_READY"
            - "${na_penalty} == 0 and ${na_weight} == 0.00 (step 1 stops before the penalty is applied even though ticket ${na_k} is worth 7)"
            - "HospitalUnit.${na_u}.open_deficiency_penalty_points == 7 while readiness_score stays 0.00"
            - "HospitalUnit.${na_u}.posture == OPEN (7 is below POSTURE_RESTRICT_POINTS)"

      - name: noncompliance_rate_pattern_threshold_four_decimal_precision
        grounds:
          - calculations.finding_risk_classification
          - entities.SurveyFinding.fields.noncompliance_rate
          - entities.SurveyFinding.fields.classification
          - entities.SurveyFinding.fields.response_deadline_days
        distinguishing_aspect: |
          Boundary on a different constant, RATE_PATTERN_MIN 0.3400, evaluated on the 4-decimal rounded
          rate: 33/100 stays LIMITED, exactly 34/100 becomes PATTERN, and 1/3 rounds to 0.3333 which is
          still LIMITED - proving the comparison uses the rounded value and the threshold is inclusive.
        test_recipe:
          setup:
            - "Survey CYCLE-2026 in window_state ACTIVE_SURVEY at clock 2026-09-20T00:00:00Z."
            - "One DIRECT_IMPACT standard so tier_index is 2; patient_harm_observed false on all three findings."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "PC", name: "Provision of Care", weight_pct: 100, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { rt_ch: $.data.id }
            - call: "POST /accreditation/chapters/${rt_ch}/standards"
              payload: { standard_code: "PC.01.02.03", title: "Care planning", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { rt_s1: $.data.id }
            - call: "POST /accreditation/units"
              payload: { name: "MED-5", unit_type: "MED_SURG", bed_count: 22 }
              as: AccreditationDirector
              captures: { rt_u: $.data.id }
            - call: "POST /accreditation/survey-windows"
              payload: { cycle_label: "CYCLE-2026", prior_survey_end_date: "2025-03-15T00:00:00Z" }
              as: AccreditationDirector
              captures: { rt_sw: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: AccreditationDirector
            - call: "POST /accreditation/survey-windows/${rt_sw}/transition"
              payload: { action: "ACTIVATE_COMMAND_CENTER" }
              as: AccreditationDirector
            - call: "POST /accreditation/survey-windows/${rt_sw}/transition"
              payload: { action: "OPEN_SURVEY" }
              as: AccreditationDirector
          trigger:
            - call: "POST /accreditation/survey-windows/${rt_sw}/findings"
              payload: { standard_id: "${rt_s1}", unit_id: "${rt_u}", observed_noncompliance_count: 33, sampled_count: 100, patient_harm_observed: false }
              as: ExternalSurveyor
              captures: { rt_f1_rate: $.data.noncompliance_rate, rt_f1_class: $.data.classification, rt_f1_risk: $.data.risk_level, rt_f1_days: $.data.response_deadline_days }
            - call: "POST /accreditation/survey-windows/${rt_sw}/findings"
              payload: { standard_id: "${rt_s1}", unit_id: "${rt_u}", observed_noncompliance_count: 34, sampled_count: 100, patient_harm_observed: false }
              as: ExternalSurveyor
              captures: { rt_f2_rate: $.data.noncompliance_rate, rt_f2_class: $.data.classification, rt_f2_risk: $.data.risk_level, rt_f2_days: $.data.response_deadline_days, rt_f2_cond: $.data.condition_level }
            - call: "POST /accreditation/survey-windows/${rt_sw}/findings"
              payload: { standard_id: "${rt_s1}", unit_id: "${rt_u}", observed_noncompliance_count: 1, sampled_count: 3, patient_harm_observed: false }
              as: ExternalSurveyor
              captures: { rt_f3_rate: $.data.noncompliance_rate, rt_f3_class: $.data.classification, rt_f3_risk: $.data.risk_level }
          assert:
            - "${rt_f1_rate} == 0.3300, ${rt_f1_class} == LIMITED, ${rt_f1_risk} == MODERATE, ${rt_f1_days} == 60"
            - "${rt_f2_rate} == 0.3400, ${rt_f2_class} == PATTERN, ${rt_f2_risk} == HIGH, ${rt_f2_days} == 45, ${rt_f2_cond} == false"
            - "${rt_f3_rate} == 0.3333 (round_half_up of 0.333333 to 4 dp) and ${rt_f3_class} == LIMITED, ${rt_f3_risk} == MODERATE"
            - "SurveyWindow.${rt_sw}.condition_level_finding_count == 0 and GET /accreditation/survey-findings filtered by survey_window_id ${rt_sw} returns total_count 3"

  # =========================================================================
  # Rule 7 - cross-entity state dependencies on different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: ticket_verify_requires_closed_rounding_session
        grounds:
          - validations[priority=16]
          - errors[ERR_SESSION_NOT_CLOSED]
          - state_machines.DeficiencyTicket.REMEDIATED_to_VERIFIED
          - entities.RoundingSession.fields.state
        distinguishing_aspect: |
          Entity pair DeficiencyTicket depends on RoundingSession: the identical VERIFY request fails
          with ERR_SESSION_NOT_CLOSED while the parent session is OPEN and succeeds unchanged after the
          session is closed - the ticket's own state is REMEDIATED in both attempts.
        test_recipe:
          setup:
            - "Unit ED-4 with one OPEN LIFE_SAFETY session holding one MODERATE ticket already moved to REMEDIATED."
            - "Clock at 2026-08-10T00:00:00Z."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "LS", name: "Life Safety", weight_pct: 25, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { c1_ch: $.data.id }
            - call: "POST /accreditation/chapters/${c1_ch}/standards"
              payload: { standard_code: "LS.02.01.01", title: "Sprinkler coverage", risk_tier: "INDIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { c1_s1: $.data.id }
            - call: "POST /accreditation/units"
              payload: { name: "ED-4", unit_type: "ED", bed_count: 30 }
              as: AccreditationDirector
              captures: { c1_u: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: AccreditationDirector
            - call: "POST /accreditation/rounding-sessions"
              payload: { unit_id: "${c1_u}", round_type: "LIFE_SAFETY", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z" }
              as: SafetyOfficer
              captures: { c1_rs: $.data.id, c1_rs_state: $.data.state }
            - call: "POST /accreditation/rounding-sessions/${c1_rs}/deficiencies"
              payload: { standard_id: "${c1_s1}", description: "Extinguisher inspection overdue", severity: "MODERATE" }
              as: SafetyOfficer
              captures: { c1_k: $.data.id }
            - call: "POST /accreditation/deficiency-tickets/${c1_k}/transition"
              payload: { action: "START_WORK" }
              as: SafetyOfficer
            - call: "POST /accreditation/deficiency-tickets/${c1_k}/transition"
              payload: { action: "MARK_REMEDIATED" }
              as: SafetyOfficer
              captures: { c1_k_state: $.data.state }
          trigger:
            - call: "POST /accreditation/deficiency-tickets/${c1_k}/transition"
              payload: { action: "VERIFY" }
              as: SafetyOfficer
              captures: { c1_err: $.data.error_id }
            - call: "POST /accreditation/rounding-sessions/${c1_rs}/close"
              as: SafetyOfficer
              captures: { c1_rs_state_2: $.data.state }
            - call: "POST /accreditation/deficiency-tickets/${c1_k}/transition"
              payload: { action: "VERIFY" }
              as: SafetyOfficer
              captures: { c1_k_state_2: $.data.state }
          assert:
            - "${c1_rs_state} == OPEN and ${c1_k_state} == REMEDIATED before the trigger"
            - "${c1_err} == ERR_SESSION_NOT_CLOSED with HTTP 409 and the ticket stays REMEDIATED"
            - "${c1_rs_state_2} == CLOSED and ${c1_k_state_2} == VERIFIED"
            - "HospitalUnit.${c1_u}.open_deficiency_penalty_points == 3 before the close and 0 after VERIFY"

      - name: evidence_submit_requires_mapped_standard
        grounds:
          - validations[priority=42]
          - errors[ERR_STANDARD_UNMAPPED]
          - state_machines.EvidenceItem.DRAFT_to_SUBMITTED
          - state_machines.Standard.UNMAPPED_to_MAPPED
          - entities.Standard.fields.active_owner_count
        distinguishing_aspect: |
          A different entity pair - EvidenceItem depends on Standard.compliance_state: the same SUBMIT
          request fails with ERR_STANDARD_UNMAPPED while the standard has no ACTIVE owner and succeeds
          once an OwnerAssignment moves the standard to MAPPED, with no change to the evidence row.
        test_recipe:
          setup:
            - "Chapter MM with one standard that has no OwnerAssignment, so compliance_state is UNMAPPED."
            - "One EvidenceItem in DRAFT created on that standard by owner-1."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "MM", name: "Medication Management", weight_pct: 30, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { c2_ch: $.data.id }
            - call: "POST /accreditation/chapters/${c2_ch}/standards"
              payload: { standard_code: "MM.03.01.01", title: "Medication storage", risk_tier: "INDIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { c2_s1: $.data.id, c2_s1_state: $.data.compliance_state }
            - call: "POST /accreditation/standards/${c2_s1}/evidence-items"
              payload: { title: "Storage inspection report", doc_type: "INSPECTION_REPORT", effective_date: "2026-07-15T00:00:00Z" }
              as: StandardOwner
              as_user_id: "owner-1"
              captures: { c2_e1: $.data.id }
          trigger:
            - call: "POST /accreditation/evidence-items/${c2_e1}/transition"
              payload: { action: "SUBMIT" }
              as: StandardOwner
              as_user_id: "owner-1"
              captures: { c2_err: $.data.error_id }
            - call: "POST /accreditation/standards/${c2_s1}/owner-assignments"
              payload: { owner_user_id: "owner-1", designation: "PRIMARY" }
              as: AccreditationDirector
              captures: { c2_oa: $.data.id }
            - call: "POST /accreditation/evidence-items/${c2_e1}/transition"
              payload: { action: "SUBMIT" }
              as: StandardOwner
              as_user_id: "owner-1"
              captures: { c2_e1_state: $.data.validation_state }
          assert:
            - "${c2_s1_state} == UNMAPPED at creation"
            - "${c2_err} == ERR_STANDARD_UNMAPPED with HTTP 422 and EvidenceItem.${c2_e1}.validation_state stays DRAFT"
            - "after ${c2_oa} is created Standard.${c2_s1}.active_owner_count == 1 and compliance_state == MAPPED"
            - "${c2_e1_state} == SUBMITTED and Chapter.${c2_ch}.mapped_standard_count == 1"
            - "Standard.${c2_s1}.validated_evidence_count == 0 (SUBMITTED is not yet VALIDATED)"

      - name: finding_creation_requires_active_survey_window
        grounds:
          - validations[priority=19]
          - errors[ERR_SURVEY_NOT_ACTIVE]
          - state_machines.SurveyWindow.ELIGIBLE_to_ACTIVE_SURVEY
          - entities.SurveyWindow.fields.window_state
        distinguishing_aspect: |
          A third entity pair - SurveyFinding depends on SurveyWindow.window_state: the identical
          finding payload is rejected with ERR_SURVEY_NOT_ACTIVE while the window is merely ELIGIBLE
          with its command center ACTIVATED, and is accepted after OPEN_SURVEY.
        test_recipe:
          setup:
            - "Survey CYCLE-2026 predicted open 2026-09-15; clock advanced to 2026-09-20T00:00:00Z so window_state is ELIGIBLE."
            - "Command center already ACTIVATED, so priority 18 is not the blocking rule."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "EM", name: "Emergency Management", weight_pct: 20, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { c3_ch: $.data.id }
            - call: "POST /accreditation/chapters/${c3_ch}/standards"
              payload: { standard_code: "EM.02.01.01", title: "Emergency operations plan", risk_tier: "SITUATIONAL_DECISION_RULE" }
              as: AccreditationDirector
              captures: { c3_s1: $.data.id }
            - call: "POST /accreditation/units"
              payload: { name: "BH-1", unit_type: "BEHAVIORAL_HEALTH", bed_count: 10 }
              as: AccreditationDirector
              captures: { c3_u: $.data.id }
            - call: "POST /accreditation/survey-windows"
              payload: { cycle_label: "CYCLE-2026", prior_survey_end_date: "2025-03-15T00:00:00Z" }
              as: AccreditationDirector
              captures: { c3_sw: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: AccreditationDirector
            - call: "POST /accreditation/survey-windows/${c3_sw}/transition"
              payload: { action: "ACTIVATE_COMMAND_CENTER" }
              as: AccreditationDirector
              captures: { c3_cc: $.data.command_center_state, c3_ws: $.data.window_state }
          trigger:
            - call: "POST /accreditation/survey-windows/${c3_sw}/findings"
              payload: { standard_id: "${c3_s1}", unit_id: "${c3_u}", observed_noncompliance_count: 2, sampled_count: 10, patient_harm_observed: false }
              as: ExternalSurveyor
              captures: { c3_err: $.data.error_id }
            - call: "POST /accreditation/survey-windows/${c3_sw}/transition"
              payload: { action: "OPEN_SURVEY" }
              as: AccreditationDirector
              captures: { c3_ws_2: $.data.window_state }
            - call: "POST /accreditation/survey-windows/${c3_sw}/findings"
              payload: { standard_id: "${c3_s1}", unit_id: "${c3_u}", observed_noncompliance_count: 2, sampled_count: 10, patient_harm_observed: false }
              as: ExternalSurveyor
              captures: { c3_f_rate: $.data.noncompliance_rate, c3_f_risk: $.data.risk_level }
          assert:
            - "${c3_cc} == ACTIVATED and ${c3_ws} == ELIGIBLE before the trigger"
            - "${c3_err} == ERR_SURVEY_NOT_ACTIVE with HTTP 409 and GET /accreditation/survey-findings filtered by survey_window_id ${c3_sw} returns total_count 0"
            - "${c3_ws_2} == ACTIVE_SURVEY"
            - "${c3_f_rate} == 0.2000, classification LIMITED, tier_index 0 gives raw_index 0 so ${c3_f_risk} == LOW"
            - "GET /accreditation/survey-findings filtered by survey_window_id ${c3_sw} returns total_count 1 after the accepted call"

  # =========================================================================
  # Rule 8 - resource / temporal overlap on three different resources
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: tracer_half_open_interval_with_sixty_minute_turnaround_buffer
        grounds:
          - calculations.tracer_window_occupancy
          - validations[priority=28]
          - errors[ERR_TRACER_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Resource is the HospitalUnit as a tracer host, capacity 1, half-open interval plus a
          60-minute trailing buffer: a tracer starting at existing.window_end + 30 minutes is rejected
          while one starting at exactly existing.window_end + 60 minutes is accepted.
        test_recipe:
          setup:
            - "Unit ICU-8 with posture OPEN and one SCHEDULED tracer over 2026-08-05T08:00Z-12:00Z."
            - "Chapter EC has one mapped standard so priority 44 never fires."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "EC", name: "Environment of Care", weight_pct: 100, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { to1_ch: $.data.id }
            - call: "POST /accreditation/chapters/${to1_ch}/standards"
              payload: { standard_code: "EC.02.06.01", title: "Safe environment", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { to1_s1: $.data.id }
            - call: "POST /accreditation/standards/${to1_s1}/owner-assignments"
              payload: { owner_user_id: "owner-1", designation: "PRIMARY" }
              as: AccreditationDirector
            - call: "POST /accreditation/units"
              payload: { name: "ICU-8", unit_type: "ICU", bed_count: 18 }
              as: AccreditationDirector
              captures: { to1_u: $.data.id, to1_u_v1: $.data.version }
            - call: "POST /accreditation/mock-tracers"
              payload: { unit_id: "${to1_u}", chapter_id: "${to1_ch}", tracer_type: "SYSTEM", window_start: "2026-08-05T08:00:00Z", window_end: "2026-08-05T12:00:00Z", expected_unit_version: "${to1_u_v1}" }
              as: TracerSurveyor
              captures: { to1_t1: $.data.id }
            - call: "GET /accreditation/units/${to1_u}"
              as: TracerSurveyor
              captures: { to1_u_v2: $.data.version, to1_u_count1: $.data.scheduled_tracer_count }
          trigger:
            - call: "POST /accreditation/mock-tracers"
              payload: { unit_id: "${to1_u}", chapter_id: "${to1_ch}", tracer_type: "PATIENT", window_start: "2026-08-05T12:30:00Z", window_end: "2026-08-05T14:00:00Z", expected_unit_version: "${to1_u_v2}" }
              as: TracerSurveyor
              captures: { to1_err: $.data.error_id }
            - call: "POST /accreditation/mock-tracers"
              payload: { unit_id: "${to1_u}", chapter_id: "${to1_ch}", tracer_type: "PATIENT", window_start: "2026-08-05T13:00:00Z", window_end: "2026-08-05T14:00:00Z", expected_unit_version: "${to1_u_v2}" }
              as: TracerSurveyor
              captures: { to1_t2: $.data.id, to1_t2_state: $.data.state }
          assert:
            - "${to1_u_count1} == 1 after the setup tracer ${to1_t1} is scheduled"
            - "${to1_err} == ERR_TRACER_WINDOW_CONFLICT with HTTP 409 (12:30Z is before 12:00Z plus the 60-minute buffer)"
            - "the rejected attempt left HospitalUnit.${to1_u}.version equal to ${to1_u_v2}, which is why the second attempt reuses the same expected_unit_version"
            - "${to1_t2_state} == SCHEDULED and HospitalUnit.${to1_u}.scheduled_tracer_count == 2 (13:00Z is exactly buffer-clear)"
            - "MockTracer.${to1_t2}.window_start == 2026-08-05T13:00:00.000Z"

      - name: rounding_session_aggregate_capacity_two_closed_intervals
        grounds:
          - calculations.rounding_session_capacity
          - validations[priority=35]
          - errors[ERR_ROUNDING_CAPACITY_EXCEEDED]
          - entities.RoundingSession.fields.round_type
        distinguishing_aspect: |
          A different resource shape - aggregate capacity 2 per (unit, round_type) over CLOSED
          intervals: two overlapping sessions are legal, a third that merely touches the first at
          12:00Z is rejected, the same third window is legal under a different round_type, and closing
          one session releases capacity.
        test_recipe:
          setup:
            - "Unit OR-5 with two OPEN ENVIRONMENT_OF_CARE sessions: 08:00Z-12:00Z and 10:00Z-14:00Z on 2026-08-10."
            - "Clock at 2026-08-10T00:00:00Z."
          setup_api_calls:
            - call: "POST /accreditation/units"
              payload: { name: "OR-5", unit_type: "OR", bed_count: 4 }
              as: AccreditationDirector
              captures: { to2_u: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: AccreditationDirector
            - call: "POST /accreditation/rounding-sessions"
              payload: { unit_id: "${to2_u}", round_type: "ENVIRONMENT_OF_CARE", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z" }
              as: SafetyOfficer
              captures: { to2_s1: $.data.id }
            - call: "POST /accreditation/rounding-sessions"
              payload: { unit_id: "${to2_u}", round_type: "ENVIRONMENT_OF_CARE", window_start: "2026-08-10T10:00:00Z", window_end: "2026-08-10T14:00:00Z" }
              as: SafetyOfficer
              captures: { to2_s2: $.data.id, to2_s2_state: $.data.state }
          trigger:
            - call: "POST /accreditation/rounding-sessions"
              payload: { unit_id: "${to2_u}", round_type: "ENVIRONMENT_OF_CARE", window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T13:00:00Z" }
              as: SafetyOfficer
              captures: { to2_err: $.data.error_id }
            - call: "POST /accreditation/rounding-sessions"
              payload: { unit_id: "${to2_u}", round_type: "LIFE_SAFETY", window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T13:00:00Z" }
              as: SafetyOfficer
              captures: { to2_s3: $.data.id, to2_s3_state: $.data.state }
            - call: "POST /accreditation/rounding-sessions/${to2_s1}/close"
              as: SafetyOfficer
              captures: { to2_s1_state: $.data.state }
            - call: "POST /accreditation/rounding-sessions"
              payload: { unit_id: "${to2_u}", round_type: "ENVIRONMENT_OF_CARE", window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T13:00:00Z" }
              as: SafetyOfficer
              captures: { to2_s4: $.data.id, to2_s4_state: $.data.state }
          assert:
            - "${to2_s2_state} == OPEN (one intersecting session is below the limit of 2)"
            - "${to2_err} == ERR_ROUNDING_CAPACITY_EXCEEDED with HTTP 409 (touching ${to2_s1} at 12:00Z counts as an intersection, so intersecting == 2)"
            - "${to2_s3_state} == OPEN because capacity is scoped per round_type and LIFE_SAFETY is empty"
            - "${to2_s1_state} == CLOSED and ${to2_s4_state} == OPEN (a CLOSED session releases capacity)"
            - "GET /accreditation/rounding-sessions filtered by unit_id ${to2_u} returns total_count 4"

      - name: survey_window_hospital_wide_capacity_one_touching_endpoints
        grounds:
          - calculations.survey_window_prediction
          - validations[priority=29]
          - errors[ERR_SURVEY_WINDOW_OVERLAP]
          - entities.SurveyWindow.fields.predicted_close_date
        distinguishing_aspect: |
          A third resource - the hospital itself, capacity 1 over CLOSED predicted intervals with no
          buffer: a second cycle whose predicted_open_date equals the first cycle's
          predicted_close_date is rejected, and moving the anchor one day later makes it legal.
        test_recipe:
          setup:
            - "One SurveyWindow CYCLE-2026 from prior_survey_end_date 2025-03-15, so its predicted interval is [2026-09-15, 2028-03-15] and window_state is PROJECTED."
            - "Clock left at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /accreditation/survey-windows"
              payload: { cycle_label: "CYCLE-2026", prior_survey_end_date: "2025-03-15T00:00:00Z" }
              as: AccreditationDirector
              captures: { to3_w1: $.data.id, to3_w1_open: $.data.predicted_open_date, to3_w1_close: $.data.predicted_close_date }
          trigger:
            - call: "POST /accreditation/survey-windows"
              payload: { cycle_label: "CYCLE-2028-TOUCH", prior_survey_end_date: "2026-09-15T00:00:00Z" }
              as: AccreditationDirector
              captures: { to3_err: $.data.error_id }
            - call: "POST /accreditation/survey-windows"
              payload: { cycle_label: "CYCLE-2028-CLEAR", prior_survey_end_date: "2026-09-16T00:00:00Z" }
              as: AccreditationDirector
              captures: { to3_w2: $.data.id, to3_w2_open: $.data.predicted_open_date, to3_w2_close: $.data.predicted_close_date }
          assert:
            - "${to3_w1_open} == 2026-09-15T00:00:00.000Z and ${to3_w1_close} == 2028-03-15T00:00:00.000Z"
            - "${to3_err} == ERR_SURVEY_WINDOW_OVERLAP with HTTP 409 because the rejected interval [2028-03-15, 2029-09-15] touches ${to3_w1_close}"
            - "${to3_w2_open} == 2028-03-16T00:00:00.000Z and ${to3_w2_close} == 2029-09-16T00:00:00.000Z, one day clear of the existing close date"
            - "GET /accreditation/survey-windows/${to3_w2} shows window_state PROJECTED and command_center_activation_allowed_from 2028-02-15T00:00:00.000Z"

  # =========================================================================
  # Rule 9 - compensating invariants on three different ledgers
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: unit_penalty_ledger_restores_posture_after_verification
        grounds:
          - entities.HospitalUnit.fields.open_deficiency_penalty_points
          - state_machines.HospitalUnit.RESTRICTED_to_OPEN
          - state_machines.DeficiencyTicket.REMEDIATED_to_VERIFIED
          - calculations.unit_readiness_score
        distinguishing_aspect: |
          Ledger under test is HospitalUnit.open_deficiency_penalty_points: verifying one LOW ticket
          subtracts exactly its 1 point, drops the ledger from 15 to 14, and un-restricts the unit -
          the reverse of the OPEN -> RESTRICTED cascade, with no residual drift against the severity
          sum of the remaining non-VERIFIED tickets.
        test_recipe:
          setup:
            - "Reuse the posture_restrict_points_exact_fifteen_boundary fixture: unit ICU-9 at base 78.00 with HIGH + HIGH + LOW tickets worth 15 points, posture RESTRICTED, readiness 63.00."
            - "Clock at 2026-08-10T00:00:00Z; the ENVIRONMENT_OF_CARE session is still OPEN."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "EC", name: "Environment of Care", weight_pct: 100, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { ci1_ch: $.data.id }
            - call: "POST /accreditation/chapters/${ci1_ch}/standards"
              payload: { standard_code: "EC.02.06.01", title: "Safe environment", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { ci1_s1: $.data.id }
            - call: "POST /accreditation/chapters/${ci1_ch}/standards"
              payload: { standard_code: "EC.02.05.01", title: "Utility systems", risk_tier: "INDIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { ci1_s2: $.data.id }
            - call: "POST /accreditation/standards/${ci1_s1}/owner-assignments"
              payload: { owner_user_id: "owner-1", designation: "PRIMARY" }
              as: AccreditationDirector
            - call: "POST /accreditation/units"
              payload: { name: "ICU-9", unit_type: "ICU", bed_count: 16 }
              as: AccreditationDirector
              captures: { ci1_u: $.data.id, ci1_u_v1: $.data.version }
            - call: "POST /accreditation/mock-tracers"
              payload: { unit_id: "${ci1_u}", chapter_id: "${ci1_ch}", tracer_type: "SYSTEM", window_start: "2026-08-05T08:00:00Z", window_end: "2026-08-05T10:00:00Z", expected_unit_version: "${ci1_u_v1}" }
              as: TracerSurveyor
              captures: { ci1_t: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: AccreditationDirector
            - call: "POST /accreditation/mock-tracers/${ci1_t}/transition"
              payload: { action: "START" }
              as: TracerSurveyor
            - call: "POST /accreditation/mock-tracers/${ci1_t}/observations"
              payload: { standard_id: "${ci1_s1}", result: "COMPLIANT", weight: 39 }
              as: TracerSurveyor
            - call: "POST /accreditation/mock-tracers/${ci1_t}/observations"
              payload: { standard_id: "${ci1_s2}", result: "NON_COMPLIANT", weight: 11 }
              as: TracerSurveyor
            - call: "POST /accreditation/mock-tracers/${ci1_t}/transition"
              payload: { action: "COMPLETE" }
              as: TracerSurveyor
            - call: "POST /accreditation/rounding-sessions"
              payload: { unit_id: "${ci1_u}", round_type: "ENVIRONMENT_OF_CARE", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z" }
              as: SafetyOfficer
              captures: { ci1_rs: $.data.id }
            - call: "POST /accreditation/rounding-sessions/${ci1_rs}/deficiencies"
              payload: { standard_id: "${ci1_s1}", description: "Blocked panel", severity: "HIGH" }
              as: SafetyOfficer
              captures: { ci1_k1: $.data.id }
            - call: "POST /accreditation/rounding-sessions/${ci1_rs}/deficiencies"
              payload: { standard_id: "${ci1_s1}", description: "Eyewash overdue", severity: "HIGH" }
              as: SafetyOfficer
              captures: { ci1_k2: $.data.id }
            - call: "POST /accreditation/rounding-sessions/${ci1_rs}/deficiencies"
              payload: { standard_id: "${ci1_s2}", description: "Corridor clutter", severity: "LOW" }
              as: SafetyOfficer
              captures: { ci1_k3: $.data.id }
            - call: "GET /accreditation/units/${ci1_u}"
              as: SafetyOfficer
              captures: { ci1_points_before: $.data.open_deficiency_penalty_points, ci1_posture_before: $.data.posture, ci1_score_before: $.data.readiness_score }
          trigger:
            - call: "POST /accreditation/deficiency-tickets/${ci1_k3}/transition"
              payload: { action: "START_WORK" }
              as: SafetyOfficer
            - call: "POST /accreditation/deficiency-tickets/${ci1_k3}/transition"
              payload: { action: "MARK_REMEDIATED" }
              as: SafetyOfficer
            - call: "POST /accreditation/rounding-sessions/${ci1_rs}/close"
              as: SafetyOfficer
            - call: "POST /accreditation/deficiency-tickets/${ci1_k3}/transition"
              payload: { action: "VERIFY" }
              as: SafetyOfficer
              captures: { ci1_k3_state: $.data.state }
            - call: "GET /accreditation/units/${ci1_u}"
              as: SafetyOfficer
              captures: { ci1_points_after: $.data.open_deficiency_penalty_points, ci1_posture_after: $.data.posture, ci1_score_after: $.data.readiness_score, ci1_band_after: $.data.readiness_band }
          assert:
            - "${ci1_points_before} == 15 and ${ci1_posture_before} == RESTRICTED and ${ci1_score_before} == 63.00"
            - "${ci1_k3_state} == VERIFIED"
            - "${ci1_points_after} == 14, exactly the severity sum of the two remaining non-VERIFIED HIGH tickets, so the ledger shows no drift"
            - "${ci1_posture_after} == OPEN (the compensating half of the posture cycle) and ${ci1_score_after} == 64.00 with ${ci1_band_after} == AT_RISK"
            - "DeficiencyTicket.${ci1_k1}.state == OPEN and DeficiencyTicket.${ci1_k2}.state == OPEN are untouched by the compensation"

      - name: chapter_mapped_standard_ledger_reverses_on_owner_revocation
        grounds:
          - entities.Chapter.fields.mapped_standard_count
          - entities.Chapter.fields.evidence_complete_standard_count
          - state_machines.Standard.MAPPED_to_UNMAPPED
          - state_machines.OwnerAssignment.ACTIVE_to_REVOKED
          - endpoints[POST /accreditation/owner-assignments/{id}/revoke]
        distinguishing_aspect: |
          A different ledger pair - Chapter.mapped_standard_count and
          evidence_complete_standard_count: revoking the only ACTIVE OwnerAssignment reverses both
          counters to 0 while Standard.validated_evidence_count deliberately stays 1, proving the
          compensation touches only the owner-derived counters and leaves the evidence ledger intact.
        test_recipe:
          setup:
            - "Chapter IC with evidence_min_count 1 and one standard owned by owner-1, holding one VALIDATED EvidenceItem, so compliance_state is EVIDENCE_COMPLETE."
            - "Clock left at the default 2026-08-01T00:00:00Z; the evidence item has no expires_at."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "IC", name: "Infection Control", weight_pct: 50, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { ci2_ch: $.data.id }
            - call: "POST /accreditation/chapters/${ci2_ch}/standards"
              payload: { standard_code: "IC.01.01.01", title: "Hand hygiene program", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { ci2_s1: $.data.id }
            - call: "POST /accreditation/standards/${ci2_s1}/owner-assignments"
              payload: { owner_user_id: "owner-1", designation: "PRIMARY" }
              as: AccreditationDirector
              captures: { ci2_oa: $.data.id }
            - call: "POST /accreditation/standards/${ci2_s1}/evidence-items"
              payload: { title: "Hand hygiene policy", doc_type: "POLICY", effective_date: "2026-07-01T00:00:00Z" }
              as: StandardOwner
              as_user_id: "owner-1"
              captures: { ci2_e1: $.data.id }
            - call: "POST /accreditation/evidence-items/${ci2_e1}/transition"
              payload: { action: "SUBMIT" }
              as: StandardOwner
              as_user_id: "owner-1"
            - call: "POST /accreditation/evidence-items/${ci2_e1}/transition"
              payload: { action: "VALIDATE", review_note: "Policy current" }
              as: EvidenceValidator
              as_user_id: "val-1"
            - call: "GET /accreditation/chapters/${ci2_ch}"
              as: AccreditationDirector
              captures: { ci2_mapped_before: $.data.mapped_standard_count, ci2_ec_before: $.data.evidence_complete_standard_count }
          trigger:
            - call: "POST /accreditation/owner-assignments/${ci2_oa}/revoke"
              payload: { reason: "Owner left the organisation" }
              as: AccreditationDirector
              captures: { ci2_oa_status: $.data.status, ci2_oa_revoked_at: $.data.revoked_at }
            - call: "GET /accreditation/chapters/${ci2_ch}"
              as: AccreditationDirector
              captures: { ci2_mapped_after: $.data.mapped_standard_count, ci2_ec_after: $.data.evidence_complete_standard_count, ci2_std_count: $.data.standard_count }
          assert:
            - "${ci2_mapped_before} == 1 and ${ci2_ec_before} == 1 before the revocation"
            - "${ci2_oa_status} == REVOKED and ${ci2_oa_revoked_at} == 2026-08-01T00:00:00.000Z"
            - "Standard.${ci2_s1}.active_owner_count == 0 and compliance_state == UNMAPPED"
            - "${ci2_mapped_after} == 0 and ${ci2_ec_after} == 0 while ${ci2_std_count} stays 1"
            - "Standard.${ci2_s1}.validated_evidence_count == 1 and EvidenceItem.${ci2_e1}.validation_state == VALIDATED (the evidence ledger is untouched, so there is no drift)"

      - name: scheduled_tracer_count_ledger_releases_on_abort
        grounds:
          - entities.HospitalUnit.fields.scheduled_tracer_count
          - state_machines.MockTracer.SCHEDULED_to_ABORTED
          - calculations.tracer_window_occupancy
          - endpoints[POST /accreditation/mock-tracers/{id}/transition]
        distinguishing_aspect: |
          A third ledger - HospitalUnit.scheduled_tracer_count together with the unit's occupancy
          reservation: an explicit ABORT decrements the counter back to 0 and releases the interval, so
          the identical window becomes schedulable again - which the buffer rule would forbid if the
          aborted reservation had leaked.
        test_recipe:
          setup:
            - "Unit MED-9 with posture OPEN and chapter EC holding one mapped standard."
            - "One SCHEDULED tracer over 2026-08-05T08:00Z-12:00Z, so scheduled_tracer_count is 1."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "EC", name: "Environment of Care", weight_pct: 100, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { ci3_ch: $.data.id }
            - call: "POST /accreditation/chapters/${ci3_ch}/standards"
              payload: { standard_code: "EC.02.06.01", title: "Safe environment", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { ci3_s1: $.data.id }
            - call: "POST /accreditation/standards/${ci3_s1}/owner-assignments"
              payload: { owner_user_id: "owner-1", designation: "PRIMARY" }
              as: AccreditationDirector
            - call: "POST /accreditation/units"
              payload: { name: "MED-9", unit_type: "MED_SURG", bed_count: 26 }
              as: AccreditationDirector
              captures: { ci3_u: $.data.id, ci3_u_v1: $.data.version }
            - call: "POST /accreditation/mock-tracers"
              payload: { unit_id: "${ci3_u}", chapter_id: "${ci3_ch}", tracer_type: "SYSTEM", window_start: "2026-08-05T08:00:00Z", window_end: "2026-08-05T12:00:00Z", expected_unit_version: "${ci3_u_v1}" }
              as: TracerSurveyor
              captures: { ci3_t1: $.data.id }
            - call: "GET /accreditation/units/${ci3_u}"
              as: TracerSurveyor
              captures: { ci3_count_before: $.data.scheduled_tracer_count }
          trigger:
            - call: "POST /accreditation/mock-tracers/${ci3_t1}/transition"
              payload: { action: "ABORT", abort_reason: "SURVEYOR_UNAVAILABLE" }
              as: TracerSurveyor
              captures: { ci3_t1_state: $.data.state, ci3_t1_reason: $.data.abort_reason }
            - call: "GET /accreditation/units/${ci3_u}"
              as: TracerSurveyor
              captures: { ci3_count_after: $.data.scheduled_tracer_count, ci3_u_v2: $.data.version }
            - call: "POST /accreditation/mock-tracers"
              payload: { unit_id: "${ci3_u}", chapter_id: "${ci3_ch}", tracer_type: "PATIENT", window_start: "2026-08-05T08:00:00Z", window_end: "2026-08-05T12:00:00Z", expected_unit_version: "${ci3_u_v2}" }
              as: TracerSurveyor
              captures: { ci3_t2: $.data.id, ci3_t2_state: $.data.state }
            - call: "GET /accreditation/units/${ci3_u}"
              as: TracerSurveyor
              captures: { ci3_count_final: $.data.scheduled_tracer_count }
          assert:
            - "${ci3_count_before} == 1"
            - "${ci3_t1_state} == ABORTED and ${ci3_t1_reason} == SURVEYOR_UNAVAILABLE"
            - "${ci3_count_after} == 0 (the ledger is decremented, not merely recomputed at read time)"
            - "${ci3_t2_state} == SCHEDULED: the identical window is re-schedulable because ABORTED tracers release the unit, and no ERR_TRACER_WINDOW_CONFLICT is raised"
            - "${ci3_count_final} == 1 and HospitalUnit.${ci3_u}.readiness_band == NOT_ASSESSED throughout"
