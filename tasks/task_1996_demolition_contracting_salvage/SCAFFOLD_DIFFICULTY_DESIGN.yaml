  - rule_id: boundary_precision_check
    instances:
      - name: dust_threshold_exactly_75_is_exceedance
        grounds:
          - calculations.dust_exposure_score
          - entities.DustNoiseLog.fields.is_exceedance
        distinguishing_aspect: |
          Metric: exposure score. exposure_score == 75.0 exactly (93.75 * 1.0 *
          8 / 10) IS an exceedance (>= threshold); 74.9992 (93.749 * 1.0 * 8 /
          10) is NOT. Endpoint: POST /demolition/projects/{id}/dust-noise-logs.
        test_recipe:
          setup:
            - "Project DEMOLITION_ACTIVE and WORKABLE (release chain as in project_work_posture_stop_resume_cycle)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: ContractorAdmin }
