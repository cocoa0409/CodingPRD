      - name: financial_restatement_recomputes_the_monthly_expense_on_the_half_cent
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/organizations/{id}/financial-restatement
          - calculations.combined_operating_reserve_months
          - entities.Organization.fields.monthly_expense_cents
        distinguishing_aspect: |
          The action mutates two stored inputs and must re-derive monthly_expense_cents in
          the same response: 120000006 / 12 is exactly 10000000.5 cents, and round_half_up
          makes it 10000001 while truncation and banker's rounding both give 10000000. The
          restatement is an action rather than a PATCH, so it must also bump version to 2
          and leave every other field - including the seven-figure restricted corpus and
          the affiliation_role - untouched.
        test_recipe:
          setup:
