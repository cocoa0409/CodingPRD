              as: OpsAdmin
              captures: { ing: $.data.id }
            - call: "POST /api/recipes"
              payload: { restaurant_id: "${r1}", name: "Harvest", base_complexity: 0, portion_spec: [{ ingredient_id: "${ing}", target_grams: 100 }] }
              as: OpsAdmin
              captures: { rc: $.data.id, rc_v: $.data.version }
            - call: "POST /api/hoppers"
              payload: { line_id: "${la}", ingredient_id: "${ing}", capacity_grams: 2000, station_slot: 0, calibration_coefficient: 1.0 }
              as: OpsAdmin
              captures: { h1: $.data.id, h1_v: $.data.version }
            - call: "POST /api/hoppers/${h1}/load"
              payload: { load_grams: 1000, expected_hopper_version: "${h1_v}" }
              as: LineOperator
            - call: "POST /api/ingredients/${ing}/eighty-six"
              payload: {}
              as: ShiftManager
            - call: "POST /api/ingredients/${ing}/restore"
              payload: {}
              as: ShiftManager
            - call: "GET /api/recipes/${rc}"
