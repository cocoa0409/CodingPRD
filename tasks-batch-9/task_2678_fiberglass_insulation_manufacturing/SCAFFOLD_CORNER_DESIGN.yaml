            - "GET /product-lines/00000000-0000-4000-8000-000000000000 returns HTTP 404 with ${e_sku} == \"ERR_PRODUCT_LINE_NOT_FOUND\""
            - "GET /production-runs/00000000-0000-4000-8000-000000000000 returns HTTP 404 with ${e_run} == \"ERR_PRODUCTION_RUN_NOT_FOUND\""
