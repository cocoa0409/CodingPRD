        distinguishing_aspect: "A call without X-User-Role/X-User-ID headers fails at priority 1 with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any role/existence checks."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
