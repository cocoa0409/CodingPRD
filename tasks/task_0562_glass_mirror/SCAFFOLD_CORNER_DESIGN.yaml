        claim_type: Listing
        grounds: ["endpoints GET /quotes", response_envelope]
        distinguishing_aspect: "GET /quotes?contractor_account_id&limit=1 returns array envelope with total_count and has_more=true for two quotes."
        test_recipe:
          setup: ["An account with two quotes."]
          setup_api_calls:
            - call: "POST /contractor-accounts"
              payload: { company_name: "Acme", tier: "SILVER", credit_limit_cents: 100000000 }
