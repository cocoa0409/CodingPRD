  - rule_id: resource_temporal_overlap
    instances:

      - name: cycle_window_half_open_touching_dates_are_legal
        grounds:
          - validations.priority_28
          - errors.ERR_CYCLE_WINDOW_OVERLAP
          - entities.FillCycle.fields.cycle_start_date
          - entities.FillCycle.fields.cycle_end_date
          - endpoints.POST_/pharmacy/fill-cycles
        distinguishing_aspect: |
          Resource entity: FillCycle, the patient's dispensing calendar. Interval semantics:
          HALF-OPEN [cycle_start_date, cycle_end_date) — a new cycle may start on the exact
          day an existing cycle ends, and may end on the exact day an existing cycle starts,
          but one day of true intersection is fatal. The probe is on dates only, with no
          buffer and no inclusive upper bound.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "one patient synchronized BRIDGE_TO_START on anchor day 15 with a single Metformin ER [MORNING] prescription"
            - "cycle C1 occupying [2026-08-15, 2026-09-12) in DRAFT — its packaging_status is neither CANCELLED nor CLOSED, so it counts for the overlap check"
          setup_api_calls:
            - call: "POST /pharmacy/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pharmacy/insurance-plans"
              payload: { payer_name: "Northwind PBM", bin_number: "610502", generic_copay_cents_per_day: 34, brand_copay_cents_per_day: 74, specialty_copay_cents_per_day: 44, refill_too_soon_threshold_pct: 75, max_day_supply_days: 90, vacation_overrides_per_year: 1, coinsurance_pct: 20, allows_payer_vacation_override: true }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Tomas Berg", date_of_birth: "1955-01-25", email: "tomas.berg@example.com", state_code: "WA", insurance_plan_id: "${plan_id}" }
              as: PharmacyOperations
              captures: { pt_id: $.data.id }
            - call: "POST /pharmacy/prescriptions"
              payload: { patient_id: "${pt_id}", prescriber_npi: "1487654321", drug_name: "Metformin ER", ndc: "00093-1049-01", strength: "500mg", form: "TABLET", copay_tier: "GENERIC", dose_times: ["MORNING"], quantity_per_dose: 1, days_supply_written: 30, refills_authorized: 3, written_date: "2026-05-01", expiration_date: "2027-05-01", last_dispensed_date: "2026-07-25", last_dispensed_days_supply: 28 }
              as: Prescriber
              captures: { rx1: $.data.id }
            - call: "POST /pharmacy/patients/${pt_id}/synchronize"
              payload: { anchor_fill_day: 15, sync_mode: "BRIDGE_TO_START" }
              as: PharmacyOperations
            - call: "POST /pharmacy/fill-cycles"
              payload: { patient_id: "${pt_id}", cycle_start_date: "2026-08-15", day_supply_days: 28 }
              as: PharmacyOperations
              captures: { c1: $.data.id, c1_end: $.data.cycle_end_date }
          trigger:
            - call: "POST /pharmacy/fill-cycles"
              payload: { patient_id: "${pt_id}", cycle_start_date: "2026-09-12", day_supply_days: 28 }
              as: PharmacyOperations
              captures: { c2: $.data.id, c2_end: $.data.cycle_end_date }
            - call: "POST /pharmacy/fill-cycles"
              payload: { patient_id: "${pt_id}", cycle_start_date: "2026-07-18", day_supply_days: 28 }
              as: PharmacyOperations
              captures: { c4: $.data.id, c4_end: $.data.cycle_end_date }
            - call: "POST /pharmacy/fill-cycles"
              payload: { patient_id: "${pt_id}", cycle_start_date: "2026-09-11", day_supply_days: 28 }
              as: PharmacyOperations
          assert:
            - "FillCycle.${c1}.cycle_end_date == 2026-09-12 (EXCLUSIVE upper bound)"
            - "call 1 succeeds: a cycle starting exactly on 2026-09-12 is legal because new.cycle_start_date == existing.cycle_end_date is NOT an intersection; FillCycle.${c2}.cycle_end_date == 2026-10-10"
            - "call 2 succeeds: [2026-07-18, 2026-08-15) touches C1 from below and is equally legal; FillCycle.${c4}.cycle_end_date == 2026-08-15"
            - "call 3 returns 409 ERR_CYCLE_WINDOW_OVERLAP: [2026-09-11, 2026-10-09) intersects C1 on the single day 2026-09-11 (2026-09-11 < 2026-09-12 and 2026-08-15 < 2026-10-09)"
            - "GET /pharmacy/fill-cycles?patient_id=${pt_id} returns exactly 3 cycles — the rejected call created nothing"

      - name: roll_segment_closed_inclusive_abutting_day_collides
        grounds:
          - validations.priority_29
          - errors.ERR_REISSUE_SEGMENT_OVERLAP
          - calculations.roll_pouch_count
          - entities.PouchRoll.fields.segment_start_date
          - entities.PouchRoll.fields.segment_end_date
