          assert:
            - "st1 == FAILED AND comp1 == 70.0 (section floors 70/70 pass, composite 70.0 < 75.0 fails)"
            - "st2 == APPEALED (appeal inside 14-day window)"
            - "att == 2 (re-schedule from APPEALED increments attempt)"
            - "st3 == PASSED AND comp3 == 80.0 (retake bar >= 80.0 met exactly at equality)"

