scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: qualification_intake_vs_verified_budget_divergence
    grounds:
    - calculations.qualification_score
    - entities.Opportunity.fields.qualification_score_intake
    - entities.Opportunity.fields.qualification_score_verified
    - state_machines.Opportunity.SCREENING_to_DISQUALIFIED
    - validations[priority=90]
    distinguishing_aspect: The intake variant scores the client-stated budget (60000000 -> 68.00, above the 60.00 threshold) while the verified_requalification variant scores the partner-confirmed budget (30000000 -> 56.00, below it), so the SAME Opportunity row carries a passing intake score and a failing verified score and qualify() must follow the verified one.
    test_recipe:
      setup:
      - clock at 2026-08-03T09:00:00Z
      - client NWR-001 with decision_process COMMITTEE (factor 0.80) and completed_engagement_count 0
      - Opportunity SCREENING with estimated_value_cents 100000000, stated_budget_cents 60000000, decision_maker_identified true, conflict_status CLEAR
      setup_api_calls:
      - call: POST /consulting/_clock/set_current_utc
        payload:
          current_utc: '2026-08-03T09:00:00Z'
        as: PracticeAdmin
      - call: POST /consulting/clients
        payload:
          name: Northwind Retail Group
          client_code: NWR-001
          industry_code: RETAIL
          decision_process: COMMITTEE
          stated_budget_authority_cents: 80000000
          adverse_party_codes:
          - ACME-CORP
        as: PracticeAdmin
        captures:
          cl_id: $.data.id
      - call: POST /consulting/consultants
        payload:
          name: P. Reyes
          grade: PARTNER
          practice_code: OPS
          cost_rate_cents_per_hour: 62000
        as: PracticeAdmin
        captures:
          p_id: $.data.id
      - call: POST /consulting/consultants
        payload:
          name: M. Osei
          grade: MANAGER
          practice_code: OPS
          cost_rate_cents_per_hour: 38000
        as: PracticeAdmin
        captures:
          m_id: $.data.id
      - call: POST /consulting/consultants
        payload:
          name: C. Vaz
          grade: CONSULTANT
          practice_code: OPS
          cost_rate_cents_per_hour: 24000
        as: PracticeAdmin
        captures:
          c_id: $.data.id
      - call: POST /consulting/consultants
        payload:
          name: Q. Haddad
          grade: MANAGER
          practice_code: OPS
          cost_rate_cents_per_hour: 40000
          quality_reviewer_certified: true
        as: PracticeAdmin
        captures:
          qr_id: $.data.id
      - call: POST /consulting/consultants
        payload:
          name: L. Brandt
          grade: PARTNER
          practice_code: OPS
          cost_rate_cents_per_hour: 70000
        as: PracticeAdmin
        captures:
          fl_id: $.data.id
      - call: POST /consulting/opportunities
        payload:
          client_id: ${cl_id}
          owner_partner_consultant_id: ${p_id}
          scoping_manager_consultant_id: ${m_id}
          requested_practice_code: OPS
          estimated_value_cents: 100000000
          stated_budget_cents: 60000000
          decision_maker_identified: true
          target_start_date: '2026-09-01'
          target_end_date: '2026-12-18'
          objective_summary: Redesign the national distribution network
        as: EngagementPartner
        as_user_id: ${p_id}
        captures:
          opp_id: $.data.id
      - call: POST /consulting/opportunities/${opp_id}/conflict-check
        payload:
          screened_adverse_party_codes:
          - GLOBEX-LTD
        as: EngagementPartner
        as_user_id: ${p_id}
      trigger:
      - call: POST /consulting/opportunities/${opp_id}/verify-budget
        payload:
          verified_budget_cents: 30000000
        as: EngagementPartner
        as_user_id: ${p_id}
      - call: POST /consulting/opportunities/${opp_id}/qualify
        payload: {}
        as: EngagementPartner
        as_user_id: ${p_id}
      assert:
      - Opportunity.${opp_id}.qualification_score_intake == 68.00 (30*0.80 + 40*0.60 + 20*1 + 10*0)
      - Opportunity.${opp_id}.qualification_score_verified is null immediately after creation
      - 'after verify-budget: Opportunity.${opp_id}.qualification_score_verified == 56.00 (30*0.80 + 40*0.30 + 20*1 + 10*0)'
      - 'after verify-budget: Opportunity.${opp_id}.qualification_score_intake is still 68.00 (the intake variant is never recomputed)'
      - 'after qualify: Opportunity.${opp_id}.status == DISQUALIFIED because the gate reads qualification_score_verified (56.00) and 56.00 < 60.00'
      - the two variant results differ by exactly 12.00 points on identical entity data
  - name: sow_fixed_fee_vs_time_and_materials_variant_divergence
    grounds:
    - calculations.sow_quoted_fee
    - calculations.engagement_risk_score
    - entities.Sow.fields.not_to_exceed_cents
    - entities.Sow.fields.fixed_component_cents
    - state_machines.Sow.DRAFT_to_SUPERSEDED
    - concurrency_rules[sow-create-stale-opportunity]
    distinguishing_aspect: On one frozen baseline of 8566982 the fixed_fee variant LOADS the risk premium into the fee (risk_score 61 -> HIGH -> 0.20 -> quoted 10280378, not_to_exceed_cents null) while the time_and_materials variant DISCARDS the premium and instead lets the tier pick the ceiling multiplier (risk_score 46 -> MEDIUM -> 1.10 -> quoted == not_to_exceed_cents == 9423680), so the pricing_model changes both the formula path and which fields are populated.
    test_recipe:
      setup:
      - clock at 2026-08-03T09:00:00Z; Opportunity SCOPE_BASELINED with baseline_effort_cost_cents 8566982, 2 assumptions, 1 exclusion, 1 client responsibility, longest_dependency_chain 2
      - client decision_process COMMITTEE (decision_component 15)
      - a FIXED_FEE Sow already exists in DRAFT for that Opportunity
      setup_api_calls:
      - call: POST /consulting/_clock/set_current_utc
        payload:
          current_utc: '2026-08-03T09:00:00Z'
        as: PracticeAdmin
      - call: POST /consulting/clients
        payload:
          name: Northwind Retail Group
          client_code: NWR-001
          industry_code: RETAIL
          decision_process: COMMITTEE
          stated_budget_authority_cents: 80000000
          adverse_party_codes:
          - ACME-CORP
        as: PracticeAdmin
        captures:
          cl_id: $.data.id
      - call: POST /consulting/consultants
        payload:
          name: P. Reyes
          grade: PARTNER
          practice_code: OPS
          cost_rate_cents_per_hour: 62000
        as: PracticeAdmin
        captures:
          p_id: $.data.id
      - call: POST /consulting/consultants
        payload:
          name: M. Osei
          grade: MANAGER
          practice_code: OPS
          cost_rate_cents_per_hour: 38000
        as: PracticeAdmin
        captures:
          m_id: $.data.id
      - call: POST /consulting/consultants
        payload:
          name: C. Vaz
          grade: CONSULTANT
          practice_code: OPS
          cost_rate_cents_per_hour: 24000
        as: PracticeAdmin
        captures:
          c_id: $.data.id
      - call: POST /consulting/consultants
        payload:
          name: Q. Haddad
          grade: MANAGER
          practice_code: OPS
          cost_rate_cents_per_hour: 40000
          quality_reviewer_certified: true
        as: PracticeAdmin
        captures:
          qr_id: $.data.id
      - call: POST /consulting/consultants
        payload:
          name: L. Brandt
          grade: PARTNER
          practice_code: OPS
          cost_rate_cents_per_hour: 70000
        as: PracticeAdmin
        captures:
          fl_id: $.data.id
      - call: POST /consulting/opportunities
        payload:
          client_id: ${cl_id}
          owner_partner_consultant_id: ${p_id}
          scoping_manager_consultant_id: ${m_id}
          requested_practice_code: OPS
          estimated_value_cents: 100000000
          stated_budget_cents: 60000000
          decision_maker_identified: true
          target_start_date: '2026-09-01'
          target_end_date: '2026-12-18'
          objective_summary: Redesign the national distribution network
        as: EngagementPartner
        as_user_id: ${p_id}
        captures:
          opp_id: $.data.id
      - call: POST /consulting/opportunities/${opp_id}/conflict-check
        payload:
          screened_adverse_party_codes:
          - GLOBEX-LTD
        as: EngagementPartner
        as_user_id: ${p_id}
      - call: POST /consulting/opportunities/${opp_id}/verify-budget
        payload:
          verified_budget_cents: 60000000
        as: EngagementPartner
        as_user_id: ${p_id}
      - call: POST /consulting/opportunities/${opp_id}/qualify
        payload: {}
        as: EngagementPartner
        as_user_id: ${p_id}
      - call: PATCH /consulting/opportunities/${opp_id}/scope
        payload:
          assumptions: &id001
          - Client master data is available by week 2
          - No works-council consultation is required
          exclusions: &id002
          - Systems implementation
          client_responsibilities: &id003
          - Weekly steering committee attendance
        as: EngagementManager
        as_user_id: ${m_id}
      - call: POST /consulting/deliverables
        payload:
          opportunity_id: ${opp_id}
          name: Current-state diagnostic
          primary_grade: CONSULTANT
          effort_hours_estimate: 120.25
          completion_weight_pct: 40.0
          acceptance_criteria: Signed-off baseline cost-to-serve model
          planned_start_date: '2026-09-01'
          planned_end_date: '2026-10-15'
        as: EngagementManager
        as_user_id: ${m_id}
        captures:
          d1_id: $.data.id
      - call: POST /consulting/deliverables
        payload:
          opportunity_id: ${opp_id}
          name: Target-state network design
          primary_grade: MANAGER
          effort_hours_estimate: 80.5
          completion_weight_pct: 60.0
          acceptance_criteria: Approved design pack with transition plan
          planned_start_date: '2026-10-16'
          planned_end_date: '2026-12-18'
          depends_on_deliverable_id: ${d1_id}
        as: EngagementManager
        as_user_id: ${m_id}
        captures:
          d2_id: $.data.id
      - call: POST /consulting/opportunities/${opp_id}/baseline-scope
        payload: {}
        as: EngagementManager
        as_user_id: ${m_id}
        captures:
          opp_v: $.data.version
      - call: POST /consulting/sows
        payload:
          opportunity_id: ${opp_id}
          pricing_model: FIXED_FEE
          acceptance_summary: Written client sign-off per deliverable within 10 business days
          expected_opportunity_version: ${opp_v}
        as: EngagementPartner
        as_user_id: ${p_id}
        captures:
          sow_ff_id: $.data.id
      trigger:
      - call: GET /consulting/opportunities/${opp_id}
        payload: {}
        as: EngagementPartner
        as_user_id: ${p_id}
        captures:
          opp_v2: $.data.version
      - call: POST /consulting/sows
        payload:
          opportunity_id: ${opp_id}
          pricing_model: TIME_AND_MATERIALS
          acceptance_summary: Written client sign-off per deliverable within 10 business days
          expected_opportunity_version: ${opp_v2}
        as: EngagementPartner
        as_user_id: ${p_id}
        captures:
          sow_tm_id: $.data.id
      - call: GET /consulting/sows/${sow_ff_id}
        payload: {}
        as: EngagementPartner
        as_user_id: ${p_id}
      assert:
      - Sow.${sow_ff_id}.risk_score == 61 (25 FIXED_FEE + 15 COMMITTEE + 8 specification + 10 dependency + 3 obligation) and risk_premium_pct == 0.20
      - Sow.${sow_ff_id}.quoted_fee_cents == 10280378 and fixed_component_cents == 10280378
      - Sow.${sow_ff_id}.at_risk_component_cents == 0 and Sow.${sow_ff_id}.not_to_exceed_cents is null
      - Sow.${sow_tm_id}.risk_score == 46 (10 TIME_AND_MATERIALS + 15 + 8 + 10 + 3) and risk_premium_pct == 0.12
      - Sow.${sow_tm_id}.not_to_exceed_cents == 9423680 and quoted_fee_cents == 9423680 (8566982 * 1.10, MEDIUM multiplier)
      - Sow.${sow_tm_id}.fixed_component_cents == 0 and at_risk_component_cents == 0
      - both Sows carry baseline_effort_cost_cents == 8566982, so the 856698-cent quote gap is variant-driven only
      - Sow.${sow_ff_id}.status == SUPERSEDED and Sow.${sow_tm_id}.supersedes_sow_id == ${sow_ff_id}
      - Opportunity.${opp_id}.status == SOW_ISSUED and its version advanced past ${opp_v2}
- rule_id: combinatorial_formula
  instances:
  - name: outcome_based_fee_cap_selection_matrix
    grounds:
    - calculations.sow_quoted_fee
    - calculations.engagement_risk_score
    - entities.Sow.fields.at_risk_component_cents
    - entities.Sow.fields.target_bonus_cents
