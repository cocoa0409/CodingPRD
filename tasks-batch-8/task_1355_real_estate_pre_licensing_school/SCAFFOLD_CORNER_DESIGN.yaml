  # ---------------------------------------------------------- cross_cutting ---
  - section: cross_cutting
    instances:
      - name: cn_occ_offering_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[offering-update-stale-version]", "errors[ERR_STALE_OFFERING_VERSION]"]
        distinguishing_aspect: "OCC on CourseOffering.version: a PUT carrying the pre-update version succeeds (version 1 -> 2); replaying the same stale version is rejected 412 ERR_STALE_OFFERING_VERSION deterministically."
        test_recipe:
          setup: ["LICENSED school; offering DRAFT (version captured at create)"]
          setup_api_calls:
            - { call: "POST /schools", payload: { school_name: "Lone Star Realty School", school_code: "LSRS", home_state_code: "TX" }, as: SchoolDirector, captures: { sch: $.data.id } }
            - { call: "POST /schools/${sch}/license", as: StateCommission }
            - { call: "POST /courses", payload: { school_id: "${sch}", course_code: "PRE-101", title: "TX Pre-Licensing", course_type: "PRE_LICENSING", required_seat_minutes: 3000, tuition_cents: 50000, pass_score_pct: 70, completion_deadline_days: 30, ce_credit_hours: 0 }, as: SchoolDirector, captures: { crs: $.data.id } }
            - { call: "POST /courses/${crs}/approvals", payload: { state_code: "TX" }, as: ComplianceOfficer, captures: { cap: $.data.id } }
            - { call: "POST /approvals/${cap}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /courses/${crs}/activate", as: SchoolDirector }
            - { call: "POST /instructors", payload: { school_id: "${sch}", full_name: "Ira Instructor", license_number: "INS-001" }, as: Registrar, captures: { ins: $.data.id } }
            - { call: "POST /offerings", payload: { course_id: "${crs}", instructor_id: "${ins}", state_code: "TX", start_date: "2026-09-01", end_date: "2026-09-10", capacity: 2, delivery_mode: "IN_PERSON" }, as: SchoolDirector, captures: { off: $.data.id, ov: $.data.version } }
          trigger:
            - { call: "PUT /offerings/${off}", payload: { capacity: 3, expected_offering_version: "${ov}" }, as: SchoolDirector, captures: { v2: $.data.version } }
            - { call: "PUT /offerings/${off}", payload: { capacity: 4, expected_offering_version: "${ov}" }, as: SchoolDirector, captures: { err: $.data.error_id } }
          assert:
            - "first PUT succeeds: version increments to ${ov}+1"
            - "second PUT with the same (now stale) version: error_id == ERR_STALE_OFFERING_VERSION (http 412)"
            - "CourseOffering.${off}.capacity == 3 (the stale write changed nothing)"

      - name: cn_occ_grant_supersede_and_stale
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[grant-create-stale-course]", "errors[ERR_STALE_COURSE_VERSION]", "state_machines.EquivalencyGrant.ACTIVE_to_SUPERSEDED"]
        distinguishing_aspect: "CREATE-with-supersede under OCC on Course.version: grant g1 created; a second create for the same key with the pre-g1 version is rejected 412; with a fresh version it succeeds and SUPERSEDES g1 while bumping Course.version again."
        test_recipe:
          setup: ["LICENSED school; course ACTIVE (version ${cv} captured at activate); grant g1 TX->NM created with ${cv}"]
          setup_api_calls:
            - { call: "POST /schools", payload: { school_name: "Lone Star Realty School", school_code: "LSRS", home_state_code: "TX" }, as: SchoolDirector, captures: { sch: $.data.id } }
            - { call: "POST /schools/${sch}/license", as: StateCommission }
            - { call: "POST /courses", payload: { school_id: "${sch}", course_code: "PRE-101", title: "TX Pre-Licensing", course_type: "PRE_LICENSING", required_seat_minutes: 3000, tuition_cents: 50000, pass_score_pct: 70, completion_deadline_days: 30, ce_credit_hours: 0 }, as: SchoolDirector, captures: { crs: $.data.id } }
            - { call: "POST /courses/${crs}/approvals", payload: { state_code: "TX" }, as: ComplianceOfficer, captures: { cap: $.data.id } }
            - { call: "POST /approvals/${cap}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /courses/${crs}/activate", as: SchoolDirector, captures: { cv: $.data.version } }
            - { call: "POST /equivalency-grants", payload: { course_id: "${crs}", home_state_code: "TX", recognized_state_code: "NM", expected_course_version: "${cv}" }, as: ComplianceOfficer, captures: { g1: $.data.id, gs1: $.data.status } }
            - { call: "GET /courses/${crs}", as: ComplianceOfficer, captures: { cv2: $.data.version } }
          trigger:
            - { call: "POST /equivalency-grants", payload: { course_id: "${crs}", home_state_code: "TX", recognized_state_code: "NM", expected_course_version: "${cv}" }, as: ComplianceOfficer, captures: { err: $.data.error_id } }
            - { call: "POST /equivalency-grants", payload: { course_id: "${crs}", home_state_code: "TX", recognized_state_code: "NM", expected_course_version: "${cv2}" }, as: ComplianceOfficer, captures: { g2: $.data.id, gs2: $.data.status } }
            - { call: "GET /equivalency-grants/${g1}", as: ComplianceOfficer, captures: { gs1b: $.data.status } }
          assert:
            - "stale-version second create: error_id == ERR_STALE_COURSE_VERSION (http 412)   # deterministic, sequential"
            - "fresh-version create succeeds: g2 status == ACTIVE and Course.version advanced again"
            - "g1 status == SUPERSEDED   # supersede side effect of the fresh create"

      - name: cn_occ_report_amendment_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[report-amendment-stale-version]", "errors[ERR_STALE_CREDIT_REPORT_VERSION]"]
        distinguishing_aspect: "OCC on CreditReport.version: amendment create against an ACKNOWLEDGED report succeeds with the observed version (bumping it); a second amendment carrying the pre-amendment version is rejected 412."
        test_recipe:
          setup: ["LICENSED school; base report SUBMITTED then ACKNOWLEDGED (version captured from the acknowledge response)"]
          setup_api_calls:
            - { call: "POST /schools", payload: { school_name: "Lone Star Realty School", school_code: "LSRS", home_state_code: "TX" }, as: SchoolDirector, captures: { sch: $.data.id } }
            - { call: "POST /schools/${sch}/license", as: StateCommission }
            - { call: "POST /credit-reports", payload: { school_id: "${sch}", period_start: "2026-09-01", period_end: "2026-09-30" }, as: ComplianceOfficer, captures: { rep: $.data.id } }
            - { call: "POST /credit-reports/${rep}/submit", as: ComplianceOfficer }
            - { call: "POST /credit-reports/${rep}/acknowledge", as: StateCommission, captures: { rv: $.data.version } }
          trigger:
            - { call: "POST /credit-reports/${rep}/amendments", payload: { reason: "correction batch 1", expected_credit_report_version: "${rv}" }, as: ComplianceOfficer, captures: { am1: $.data.id, am1st: $.data.status, am1of: $.data.amendment_of_id } }
            - { call: "POST /credit-reports/${rep}/amendments", payload: { reason: "correction batch 2", expected_credit_report_version: "${rv}" }, as: ComplianceOfficer, captures: { err: $.data.error_id } }
          assert:
            - "first amendment: created DRAFT with amendment_of_id == ${rep}"
            - "second amendment with the stale version: error_id == ERR_STALE_CREDIT_REPORT_VERSION (http 412)"

      - name: cn_scheduled_sweep_advances_epochs
        claim_type: scheduled_actions
        grounds: ["endpoints[POST /_admin/run-regulatory-sweep]", "state_machines.CourseOffering", "state_machines.ExamAttempt.SCHEDULED_to_NO_SHOW", "state_machines.Enrollment.SEAT_TIME_MET_to_EXPIRED"]
        distinguishing_aspect: "Deferred actions fire only at sweep epochs: PUBLISHED -> IN_SESSION at start_date, SCHEDULED -> NO_SHOW after the 24h grace, IN_SESSION -> COMPLETED after end_date, SEAT_TIME_MET -> EXPIRED after deadline_date — each verified by sweep counters and states."
        test_recipe:
          setup: ["LICENSED school; course required 60, completion_deadline_days 30 (deadline 2026-10-10); PUBLISHED offering 2026-09-01..2026-09-10; enrollment SEAT_TIME_MET with one SCHEDULED attempt at 2026-09-11T14:00:00Z (never verified)"]
          setup_api_calls:
            - { call: "POST /schools", payload: { school_name: "Lone Star Realty School", school_code: "LSRS", home_state_code: "TX" }, as: SchoolDirector, captures: { sch: $.data.id } }
            - { call: "POST /schools/${sch}/license", as: StateCommission }
            - { call: "POST /courses", payload: { school_id: "${sch}", course_code: "PRE-60", title: "Fast Course", course_type: "PRE_LICENSING", required_seat_minutes: 60, tuition_cents: 50000, pass_score_pct: 70, completion_deadline_days: 30, ce_credit_hours: 0 }, as: SchoolDirector, captures: { crs: $.data.id } }
            - { call: "POST /courses/${crs}/approvals", payload: { state_code: "TX" }, as: ComplianceOfficer, captures: { cap: $.data.id } }
            - { call: "POST /approvals/${cap}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /courses/${crs}/activate", as: SchoolDirector }
            - { call: "POST /instructors", payload: { school_id: "${sch}", full_name: "Ira Instructor", license_number: "INS-001" }, as: Registrar, captures: { ins: $.data.id } }
            - { call: "POST /instructors/${ins}/approvals", payload: { state_code: "TX" }, as: Registrar, captures: { iap: $.data.id } }
            - { call: "POST /instructor-approvals/${iap}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /instructors", payload: { school_id: "${sch}", full_name: "Pat Proctor", license_number: "INS-002" }, as: Registrar, captures: { pro: $.data.id } }
            - { call: "POST /offerings", payload: { course_id: "${crs}", instructor_id: "${ins}", state_code: "TX", start_date: "2026-09-01", end_date: "2026-09-10", capacity: 2, delivery_mode: "IN_PERSON" }, as: SchoolDirector, captures: { off: $.data.id } }
            - { call: "POST /offerings/${off}/publish", as: SchoolDirector }
            - { call: "POST /students", payload: { school_id: "${sch}", full_name: "Stu One", email: "s1@x.com", license_goal_state: "TX" }, as: Registrar, captures: { st: $.data.id } }
            - { call: "POST /enrollments", payload: { offering_id: "${off}", student_id: "${st}" }, as: Registrar, captures: { enr: $.data.id } }
            - { call: "POST /enrollments/${enr}/attendance-records", payload: { session_date: "2026-09-03", minutes: 60 }, as: Instructor, as_user_id: "${ins}" }
            - { call: "POST /enrollments/${enr}/exam-attempts", payload: { scheduled_at: "2026-09-11T14:00:00Z", proctor_instructor_id: "${pro}" }, as: Registrar, captures: { att: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /_admin/run-regulatory-sweep", as: ComplianceOfficer, captures: { adv1: $.data.offerings_advanced, ns1: $.data.attempts_no_show } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-12T15:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /_admin/run-regulatory-sweep", as: ComplianceOfficer, captures: { ns2: $.data.attempts_no_show } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-11T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /_admin/run-regulatory-sweep", as: ComplianceOfficer, captures: { adv3: $.data.offerings_advanced, exp3: $.data.enrollments_expired } }
            - { call: "GET /offerings/${off}", as: Registrar, captures: { offst: $.data.status } }
            - { call: "GET /enrollments/${enr}", as: Registrar, captures: { enrst: $.data.academic_status } }
          assert:
            - "sweep at 2026-09-05: offerings_advanced == 1 (PUBLISHED -> IN_SESSION), attempts_no_show == 0 (grace not elapsed)"
            - "sweep at 2026-09-12T15:00: attempts_no_show == 1 (scheduled_at + 24h = 2026-09-12T14:00 passed)"
            - "sweep at 2026-09-12 already completed the offering (single-hop per run: IN_SESSION -> COMPLETED, end 2026-09-10 passed); sweep at 2026-10-11: offerings_advanced == 0 and enrollments_expired == 1 (today > deadline 2026-10-10)"
            - "final: CourseOffering.${off}.status == COMPLETED and Enrollment.${enr}.academic_status == EXPIRED"

      - name: cn_cascade_writes_audit_events
        claim_type: cascading_side_effects
        grounds: ["state_machines.CourseOffering.PUBLISHED_to_CANCELLED", "entities.AuditEvent", "endpoints[GET /audit-events]"]
        distinguishing_aspect: "Every cascade hop is auditable: cancelling the offering writes a CASCADED_CANCELLATION event on the offering and a STATUS_CHANGE (to WITHDRAWN, reason SCHOOL_CANCELLED) event per affected enrollment, all readable via GET /audit-events."
        test_recipe:
          setup: ["LICENSED school; PUBLISHED offering with one PAID enrollment"]
          setup_api_calls:
            - { call: "POST /schools", payload: { school_name: "Lone Star Realty School", school_code: "LSRS", home_state_code: "TX" }, as: SchoolDirector, captures: { sch: $.data.id } }
            - { call: "POST /schools/${sch}/license", as: StateCommission }
            - { call: "POST /courses", payload: { school_id: "${sch}", course_code: "PRE-101", title: "TX Pre-Licensing", course_type: "PRE_LICENSING", required_seat_minutes: 3000, tuition_cents: 50000, pass_score_pct: 70, completion_deadline_days: 30, ce_credit_hours: 0 }, as: SchoolDirector, captures: { crs: $.data.id } }
            - { call: "POST /courses/${crs}/approvals", payload: { state_code: "TX" }, as: ComplianceOfficer, captures: { cap: $.data.id } }
            - { call: "POST /approvals/${cap}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /courses/${crs}/activate", as: SchoolDirector }
            - { call: "POST /instructors", payload: { school_id: "${sch}", full_name: "Ira Instructor", license_number: "INS-001" }, as: Registrar, captures: { ins: $.data.id } }
            - { call: "POST /instructors/${ins}/approvals", payload: { state_code: "TX" }, as: Registrar, captures: { iap: $.data.id } }
            - { call: "POST /instructor-approvals/${iap}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /offerings", payload: { course_id: "${crs}", instructor_id: "${ins}", state_code: "TX", start_date: "2026-09-01", end_date: "2026-09-10", capacity: 2, delivery_mode: "IN_PERSON" }, as: SchoolDirector, captures: { off: $.data.id } }
            - { call: "POST /offerings/${off}/publish", as: SchoolDirector }
            - { call: "POST /students", payload: { school_id: "${sch}", full_name: "Stu One", email: "s1@x.com", license_goal_state: "TX" }, as: Registrar, captures: { st: $.data.id } }
            - { call: "POST /enrollments", payload: { offering_id: "${off}", student_id: "${st}" }, as: Registrar, captures: { enr: $.data.id } }
            - { call: "POST /enrollments/${enr}/pay", payload: { amount_cents: 51500 }, as: Registrar }
          trigger:
            - { call: "POST /offerings/${off}/cancel", as: SchoolDirector }
            - { call: "GET /audit-events?entity_type=CourseOffering&entity_id=${off}", as: Registrar, captures: { evo: $.data } }
            - { call: "GET /audit-events?entity_type=Enrollment&entity_id=${enr}", as: Registrar, captures: { eve: $.data } }
          assert:
            - "offering events include CASCADED_CANCELLATION with detail.to_status == CANCELLED"
            - "enrollment events include STATUS_CHANGE with detail {from_status: ENROLLED, to_status: WITHDRAWN}"
            - "cascade events carry actor_role 'system' for cascaded hops and SchoolDirector for the cancel itself"

      - name: cn_derived_seat_fields_reconcile
        claim_type: derived_field_reconciliation
        grounds: ["calculations.enrolled_count_seats"]
        excluded_because:
          difficulty_instance: seat_conservation_cycle
          rationale: "enrolled_count/seats_available recomputation after create and withdrawal is asserted at three checkpoints in the named §1.8 instance."

      - name: cn_grant_suspend_on_approval_expiry
        claim_type: cascading_side_effects
        grounds: ["state_machines.EquivalencyGrant.ACTIVE_to_SUSPENDED"]
        excluded_because:
          difficulty_instance: approval_expiry_grant_suspend_resume_cascade
          rationale: "Grant suspension on approval expiry (and resume on renewal) is asserted in the named §1.8 instance."

      - name: cn_report_correction_cycle_corner
        claim_type: valid_transition
        grounds: ["state_machines.CreditReport"]
        excluded_because:
          difficulty_instance: credit_report_correction_cycle
          rationale: "The DRAFT -> SUBMITTED -> REJECTED -> DRAFT -> SUBMITTED -> ACKNOWLEDGED loop with submission_count == 2 is asserted in the named §1.8 instance."

