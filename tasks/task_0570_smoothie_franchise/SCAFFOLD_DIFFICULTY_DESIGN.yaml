            - { call: "PATCH /stores/${store_id}", payload: { expected_store_version: "${store_v}", status: "OPEN" }, as: PlatformAdmin }
            - { call: "POST /ingredients", payload: { name: "Milk", unit: "ML", standard_cost_cents_per_unit: 1 }, as: PlatformAdmin, captures: { milk_id: $.data.id } }
            - { call: "POST /menu-items", payload: { name: "Milkshake", category: "SMOOTHIE", base_price_cents: 500, recipe: [ { ingredient_id: "${milk_id}", base_qty: 100 } ], base_calories: 300, allergen_tags: [ "milk" ] }, as: PlatformAdmin, captures: { mi_id: $.data.id } }
