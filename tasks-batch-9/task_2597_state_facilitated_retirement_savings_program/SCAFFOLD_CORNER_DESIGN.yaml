              payload: { participant_id: "${par_id}", annual_compensation_cents: 9600000 }
              as: ProgramAdministrator
            - call: "POST /employers/${emp_id}/enrollments"
              payload: { participant_id: "${par_id}", annual_compensation_cents: 9600000 }
