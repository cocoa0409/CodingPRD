      - name: affiliate_park_booking_blocked_when_partner_agreement_leaves_active
        grounds:
          - validations[priority=26]
          - state_machines.AffiliateAgreement.ACTIVE_to_SUSPENDED
          - errors[ERR_AFFILIATE_AGREEMENT_INACTIVE]
          - calculations.affiliate_quota_consumption
        distinguishing_aspect: |
          A different entity pair — Reservation -> AffiliateAgreement rather than Reservation ->
          Park — and the dependency runs the other way in time: the first booking succeeds while the
          partner agreement is ACTIVE and consumes reciprocity-inflated quota nights, then the
          agreement is SUSPENDED and the next booking at the same park is rejected 409 while the
          already-CONFIRMED stay and the consumed quota are left untouched.
