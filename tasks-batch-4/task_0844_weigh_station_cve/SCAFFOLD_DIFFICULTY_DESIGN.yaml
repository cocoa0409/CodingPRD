# =============================================================================
# Task 0844 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 2 instances = 18 instances. Grounds resolve into SCAFFOLD.yaml §1.1-§1.7.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: overweight_fine_provisional_vs_final_diverges
        grounds:
          - calculations.overweight_fine
          - entities.Citation.fields.assessed_fine_cents
          - entities.Citation.fields.final_fine_cents
          - state_machines.Citation.CONTESTED_to_UPHELD
        distinguishing_aspect: "On a Citation, the assessed fine (WIM weights) and the final fine (certified static-scale weights) are computed by the same tiered formula on different weight inputs and yield different cents (145000 vs 45000)."
        test_recipe:
          setup:
            - "Active carrier; station with default 80000/20000 limits; one bay; one driver."
            - "A REFERRED overweight screening (gross 86000, axle 21000), an inspection finalized OOS on it."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-02T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /carriers", payload: { usdot_number: "DOT-844-A", legal_name: "Acme Freight", irp_status: "ACTIVE", ifta_status: "ACTIVE", ucr_status: "ACTIVE" }, as: ComplianceAdmin, captures: { carrier_id: "$.data.id" } }
            - { call: "POST /stations", payload: { name: "I-5 Northbound", state_code: "CA" }, as: ComplianceAdmin, captures: { station_id: "$.data.id" } }
            - { call: "POST /stations/${station_id}/bays", payload: { label: "Bay 1" }, as: ComplianceAdmin, captures: { bay_id: "$.data.id" } }
            - { call: "POST /carriers/${carrier_id}/drivers", payload: { cdl_number: "CDL-1", full_name: "Pat Driver" }, as: ComplianceAdmin, captures: { driver_id: "$.data.id" } }
            - { call: "POST /screenings", payload: { station_id: "${station_id}", carrier_id: "${carrier_id}", driver_id: "${driver_id}", vehicle_plate: "PLT-1", axle_count: 5, gross_weight_lbs: 86000, heaviest_axle_lbs: 21000, hazmat_placarded: false }, as: Screener, captures: { screening_id: "$.data.id" } }
            - { call: "POST /inspections", payload: { screening_id: "${screening_id}", bay_id: "${bay_id}", level: "LEVEL_I", scheduled_start: "2026-03-02T10:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }, as: Inspector, captures: { inspection_id: "$.data.id" } }
            - { call: "POST /inspections/${inspection_id}/violations", payload: { code: "393.75", category: "WEIGHT", severity_weight: 5, oos: true }, as: Inspector }
            - { call: "POST /inspections/${inspection_id}/finalize", payload: { result: "OOS" }, as: Inspector }
          trigger:
            - { call: "POST /citations", payload: { inspection_id: "${inspection_id}", carrier_id: "${carrier_id}", kind: "OVERWEIGHT" }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { citation_id: "$.data.id" } }
            - { call: "POST /citations/${citation_id}/contest", payload: { contest_reason: "re-weigh on certified scale" }, as: CarrierRep, as_user_id: "${carrier_id}" }
            - { call: "POST /citations/${citation_id}/adjudicate", payload: { result: "UPHOLD", certified_gross_lbs: 83000, certified_axle_lbs: 21000 }, as: EnforcementOfficer, as_user_id: "officer-2" }
          assert:
            - "Citation.${citation_id}.assessed_fine_cents == 145000"
            - "Citation.${citation_id}.final_fine_cents == 45000"
            - "Citation.${citation_id}.assessed_fine_cents != Citation.${citation_id}.final_fine_cents"
            - "Carrier.${carrier_id}.unpaid_fines_cents == 45000"

      - name: iss_score_provisional_vs_certified_diverges
        grounds:
          - calculations.carrier_iss_score
          - entities.Carrier.fields.iss_score
          - entities.Carrier.fields.certified_iss_score
          - entities.ScoreSnapshot.fields.iss_score
        distinguishing_aspect: "On a Carrier, provisional ISS (includes an IN_PROGRESS inspection's violations) equals 11 while the certified snapshot ISS (finalized inspections only) equals 12 — the pending inspection is the sole divergence."
        test_recipe:
          setup:
            - "Active carrier; inspection #1 finalized OOS (violations sum 8, oos); inspection #2 IN_PROGRESS (one violation sum 10)."
            - "carrier version read immediately before the certified snapshot call."
          setup_api_calls:
            - { call: "POST /carriers", payload: { usdot_number: "DOT-844-B", legal_name: "Bravo Lines", irp_status: "ACTIVE", ifta_status: "ACTIVE", ucr_status: "ACTIVE" }, as: ComplianceAdmin, captures: { carrier_id: "$.data.id" } }
            - { call: "POST /stations", payload: { name: "US-101", state_code: "CA" }, as: ComplianceAdmin, captures: { station_id: "$.data.id" } }
            - { call: "POST /stations/${station_id}/bays", payload: { label: "Bay 1" }, as: ComplianceAdmin, captures: { bay_id: "$.data.id" } }
            - { call: "POST /carriers/${carrier_id}/drivers", payload: { cdl_number: "CDL-2", full_name: "Sam Hauler" }, as: ComplianceAdmin, captures: { driver_id: "$.data.id" } }
            - { call: "POST /screenings", payload: { station_id: "${station_id}", carrier_id: "${carrier_id}", driver_id: "${driver_id}", vehicle_plate: "PLT-2", axle_count: 5, gross_weight_lbs: 86000, heaviest_axle_lbs: 21000, hazmat_placarded: false }, as: Screener, captures: { screening1_id: "$.data.id" } }
            - { call: "POST /inspections", payload: { screening_id: "${screening1_id}", bay_id: "${bay_id}", level: "LEVEL_I", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T09:00:00Z" }, as: Inspector, captures: { inspection1_id: "$.data.id" } }
            - { call: "POST /inspections/${inspection1_id}/violations", payload: { code: "393.75", category: "WEIGHT", severity_weight: 4, oos: true }, as: Inspector }
            - { call: "POST /inspections/${inspection1_id}/violations", payload: { code: "393.9", category: "VEHICLE", severity_weight: 4, oos: true }, as: Inspector }
            - { call: "POST /inspections/${inspection1_id}/finalize", payload: { result: "OOS" }, as: Inspector }
            - { call: "POST /screenings", payload: { station_id: "${station_id}", carrier_id: "${carrier_id}", driver_id: "${driver_id}", vehicle_plate: "PLT-2", axle_count: 5, gross_weight_lbs: 87000, heaviest_axle_lbs: 21000, hazmat_placarded: false }, as: Screener, captures: { screening2_id: "$.data.id" } }
            - { call: "POST /inspections", payload: { screening_id: "${screening2_id}", bay_id: "${bay_id}", level: "LEVEL_II", scheduled_start: "2026-03-02T10:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }, as: Inspector, captures: { inspection2_id: "$.data.id" } }
            - { call: "POST /inspections/${inspection2_id}/violations", payload: { code: "396.3", category: "VEHICLE", severity_weight: 10, oos: false }, as: Inspector }
            - { call: "GET /carriers/${carrier_id}", payload: {}, as: ComplianceAdmin, captures: { carrier_v: "$.data.version" } }
          trigger:
            - { call: "POST /carriers/${carrier_id}/score-snapshots", payload: { expected_carrier_version: "${carrier_v}" }, as: ComplianceAdmin, captures: { snap_id: "$.data.id", snap_iss: "$.data.iss_score", snap_method: "$.data.method" } }
          assert:
            - "Carrier.${carrier_id}.iss_score == 11"
            - "ScoreSnapshot.${snap_id}.iss_score == 12"
            - "ScoreSnapshot.${snap_id}.method == CERTIFIED"
            - "Carrier.${carrier_id}.certified_iss_score == 12"
            - "Carrier.${carrier_id}.iss_score != ScoreSnapshot.${snap_id}.iss_score"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: overweight_fine_gross_vs_axle_max_selection
        grounds:
          - calculations.overweight_fine
          - entities.WeighStation.fields.single_axle_limit_lbs
          - entities.Citation.fields.assessed_fine_cents
        distinguishing_aspect: "Mode (a): the overweight fine is max(tiered(gross_excess), tiered(axle_excess)); with gross_excess=1000 (10000c) and axle_excess=6000 (145000c) the axle branch dominates, proving the non-linear max over two tiered sub-formulas."
        test_recipe:
          setup:
            - "Active carrier; default-limit station; REFERRED screening gross 81000 (1000 over) but axle 26000 (6000 over); inspection finalized OOS."
          setup_api_calls:
            - { call: "POST /carriers", payload: { usdot_number: "DOT-844-C", legal_name: "Cargo Co", irp_status: "ACTIVE", ifta_status: "ACTIVE", ucr_status: "ACTIVE" }, as: ComplianceAdmin, captures: { carrier_id: "$.data.id" } }
            - { call: "POST /stations", payload: { name: "SR-99", state_code: "CA" }, as: ComplianceAdmin, captures: { station_id: "$.data.id" } }
            - { call: "POST /stations/${station_id}/bays", payload: { label: "Bay 1" }, as: ComplianceAdmin, captures: { bay_id: "$.data.id" } }
            - { call: "POST /carriers/${carrier_id}/drivers", payload: { cdl_number: "CDL-3", full_name: "Lee Trucker" }, as: ComplianceAdmin, captures: { driver_id: "$.data.id" } }
            - { call: "POST /screenings", payload: { station_id: "${station_id}", carrier_id: "${carrier_id}", driver_id: "${driver_id}", vehicle_plate: "PLT-3", axle_count: 5, gross_weight_lbs: 81000, heaviest_axle_lbs: 26000, hazmat_placarded: false }, as: Screener, captures: { screening_id: "$.data.id" } }
            - { call: "POST /inspections", payload: { screening_id: "${screening_id}", bay_id: "${bay_id}", level: "LEVEL_I", scheduled_start: "2026-03-02T10:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }, as: Inspector, captures: { inspection_id: "$.data.id" } }
            - { call: "POST /inspections/${inspection_id}/violations", payload: { code: "393.75", category: "WEIGHT", severity_weight: 5, oos: true }, as: Inspector }
            - { call: "POST /inspections/${inspection_id}/finalize", payload: { result: "OOS" }, as: Inspector }
          trigger:
            - { call: "POST /citations", payload: { inspection_id: "${inspection_id}", carrier_id: "${carrier_id}", kind: "OVERWEIGHT" }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { citation_id: "$.data.id" } }
          assert:
            - "Citation.${citation_id}.assessed_fine_cents == 145000"

      - name: iss_score_round_per_inspection_then_average
        grounds:
          - calculations.carrier_iss_score
          - entities.Carrier.fields.iss_score
        distinguishing_aspect: "Mode (b): rounding order is pinned to round-per-inspection-first. With raw values 4.5 and 6.0, round-first gives (5+6)/2=5.5->6; averaging raw first gives 5.25->5. The result MUST be 6, proving the pinned order."
        test_recipe:
          setup:
            - "Active carrier; inspection #1 finalized OOS (severity sum 3 -> raw 4.5); inspection #2 finalized OOS (severity sum 4 -> raw 6.0)."
          setup_api_calls:
            - { call: "POST /carriers", payload: { usdot_number: "DOT-844-D", legal_name: "Delta Transit", irp_status: "ACTIVE", ifta_status: "ACTIVE", ucr_status: "ACTIVE" }, as: ComplianceAdmin, captures: { carrier_id: "$.data.id" } }
            - { call: "POST /stations", payload: { name: "I-80", state_code: "CA" }, as: ComplianceAdmin, captures: { station_id: "$.data.id" } }
            - { call: "POST /stations/${station_id}/bays", payload: { label: "Bay 1" }, as: ComplianceAdmin, captures: { bay_id: "$.data.id" } }
            - { call: "POST /carriers/${carrier_id}/drivers", payload: { cdl_number: "CDL-4", full_name: "Ola Driver" }, as: ComplianceAdmin, captures: { driver_id: "$.data.id" } }
            - { call: "POST /screenings", payload: { station_id: "${station_id}", carrier_id: "${carrier_id}", driver_id: "${driver_id}", vehicle_plate: "PLT-4", axle_count: 5, gross_weight_lbs: 86000, heaviest_axle_lbs: 21000, hazmat_placarded: false }, as: Screener, captures: { screening1_id: "$.data.id" } }
            - { call: "POST /inspections", payload: { screening_id: "${screening1_id}", bay_id: "${bay_id}", level: "LEVEL_I", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T09:00:00Z" }, as: Inspector, captures: { inspection1_id: "$.data.id" } }
            - { call: "POST /inspections/${inspection1_id}/violations", payload: { code: "393.75", category: "WEIGHT", severity_weight: 3, oos: true }, as: Inspector }
            - { call: "POST /inspections/${inspection1_id}/finalize", payload: { result: "OOS" }, as: Inspector }
            - { call: "POST /screenings", payload: { station_id: "${station_id}", carrier_id: "${carrier_id}", driver_id: "${driver_id}", vehicle_plate: "PLT-4", axle_count: 5, gross_weight_lbs: 87000, heaviest_axle_lbs: 21000, hazmat_placarded: false }, as: Screener, captures: { screening2_id: "$.data.id" } }
            - { call: "POST /inspections", payload: { screening_id: "${screening2_id}", bay_id: "${bay_id}", level: "LEVEL_I", scheduled_start: "2026-03-02T10:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }, as: Inspector, captures: { inspection2_id: "$.data.id" } }
            - { call: "POST /inspections/${inspection2_id}/violations", payload: { code: "393.9", category: "VEHICLE", severity_weight: 4, oos: true }, as: Inspector }
          trigger:
            - { call: "POST /inspections/${inspection2_id}/finalize", payload: { result: "OOS" }, as: Inspector }
          assert:
            - "Carrier.${carrier_id}.iss_score == 6"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: inspection_oos_reinspection_cycle
        grounds:
          - state_machines.Inspection.OOS_ISSUED_to_REINSPECTION
          - state_machines.Inspection.REINSPECTION_to_OOS_ISSUED
          - entities.Inspection.fields.reinspection_count
        distinguishing_aspect: "Inspection cycles OOS_ISSUED -> REINSPECTION -> OOS_ISSUED; reinspection_count increments to 1 while status returns to OOS_ISSUED, a non-linear loop on the Inspection entity."
        test_recipe:
          setup:
            - "Active carrier; REFERRED overweight screening; inspection with an OOS violation finalized OOS."
          setup_api_calls:
            - { call: "POST /carriers", payload: { usdot_number: "DOT-844-E", legal_name: "Echo Freight", irp_status: "ACTIVE", ifta_status: "ACTIVE", ucr_status: "ACTIVE" }, as: ComplianceAdmin, captures: { carrier_id: "$.data.id" } }
            - { call: "POST /stations", payload: { name: "I-15", state_code: "CA" }, as: ComplianceAdmin, captures: { station_id: "$.data.id" } }
            - { call: "POST /stations/${station_id}/bays", payload: { label: "Bay 1" }, as: ComplianceAdmin, captures: { bay_id: "$.data.id" } }
            - { call: "POST /carriers/${carrier_id}/drivers", payload: { cdl_number: "CDL-5", full_name: "Max Hauler" }, as: ComplianceAdmin, captures: { driver_id: "$.data.id" } }
            - { call: "POST /screenings", payload: { station_id: "${station_id}", carrier_id: "${carrier_id}", driver_id: "${driver_id}", vehicle_plate: "PLT-5", axle_count: 5, gross_weight_lbs: 86000, heaviest_axle_lbs: 21000, hazmat_placarded: false }, as: Screener, captures: { screening_id: "$.data.id" } }
            - { call: "POST /inspections", payload: { screening_id: "${screening_id}", bay_id: "${bay_id}", level: "LEVEL_I", scheduled_start: "2026-03-02T10:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }, as: Inspector, captures: { inspection_id: "$.data.id" } }
            - { call: "POST /inspections/${inspection_id}/violations", payload: { code: "393.75", category: "WEIGHT", severity_weight: 5, oos: true }, as: Inspector }
            - { call: "POST /inspections/${inspection_id}/finalize", payload: { result: "OOS" }, as: Inspector }
          trigger:
            - { call: "POST /inspections/${inspection_id}/reinspect", payload: {}, as: Inspector }
            - { call: "POST /inspections/${inspection_id}/finalize", payload: { result: "OOS" }, as: Inspector }
          assert:
            - "Inspection.${inspection_id}.status == OOS_ISSUED"
            - "Inspection.${inspection_id}.reinspection_count == 1"

      - name: citation_contest_branch_fork
        grounds:
          - state_machines.Citation.ASSESSED_to_CONTESTED
          - state_machines.Citation.CONTESTED_to_DISMISSED
          - state_machines.Citation.CONTESTED_to_UPHELD
        distinguishing_aspect: "From CONTESTED the Citation forks to two divergent terminals (UPHELD reconciles the fine delta; DISMISSED zeroes final_fine and reverses the debit) — a branch fork on the Citation entity, distinct from Inspection's cycle."
        test_recipe:
          setup:
            - "Active carrier; overweight inspection finalized OOS; an OVERWEIGHT citation issued and contested."
          setup_api_calls:
            - { call: "POST /carriers", payload: { usdot_number: "DOT-844-F", legal_name: "Foxtrot Cartage", irp_status: "ACTIVE", ifta_status: "ACTIVE", ucr_status: "ACTIVE" }, as: ComplianceAdmin, captures: { carrier_id: "$.data.id" } }
            - { call: "POST /stations", payload: { name: "US-50", state_code: "CA" }, as: ComplianceAdmin, captures: { station_id: "$.data.id" } }
            - { call: "POST /stations/${station_id}/bays", payload: { label: "Bay 1" }, as: ComplianceAdmin, captures: { bay_id: "$.data.id" } }
            - { call: "POST /carriers/${carrier_id}/drivers", payload: { cdl_number: "CDL-6", full_name: "Nia Driver" }, as: ComplianceAdmin, captures: { driver_id: "$.data.id" } }
            - { call: "POST /screenings", payload: { station_id: "${station_id}", carrier_id: "${carrier_id}", driver_id: "${driver_id}", vehicle_plate: "PLT-6", axle_count: 5, gross_weight_lbs: 86000, heaviest_axle_lbs: 21000, hazmat_placarded: false }, as: Screener, captures: { screening_id: "$.data.id" } }
            - { call: "POST /inspections", payload: { screening_id: "${screening_id}", bay_id: "${bay_id}", level: "LEVEL_I", scheduled_start: "2026-03-02T10:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }, as: Inspector, captures: { inspection_id: "$.data.id" } }
            - { call: "POST /inspections/${inspection_id}/violations", payload: { code: "393.75", category: "WEIGHT", severity_weight: 5, oos: true }, as: Inspector }
            - { call: "POST /inspections/${inspection_id}/finalize", payload: { result: "OOS" }, as: Inspector }
            - { call: "POST /citations", payload: { inspection_id: "${inspection_id}", carrier_id: "${carrier_id}", kind: "OVERWEIGHT" }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { citation_id: "$.data.id" } }
            - { call: "POST /citations/${citation_id}/contest", payload: { contest_reason: "scale calibration disputed" }, as: CarrierRep, as_user_id: "${carrier_id}" }
          trigger:
            - { call: "POST /citations/${citation_id}/adjudicate", payload: { result: "DISMISS" }, as: EnforcementOfficer, as_user_id: "officer-2" }
          assert:
            - "Citation.${citation_id}.status == DISMISSED"
            - "Citation.${citation_id}.final_fine_cents == 0"
            - "Carrier.${carrier_id}.unpaid_fines_cents == 0"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: inspection_oos_cascade_to_score_snapshot
        grounds:
          - state_machines.Inspection.IN_PROGRESS_to_OOS_ISSUED
          - entities.Carrier.fields.oos_points
          - state_machines.Carrier.ACTIVE_to_UNDER_REVIEW
          - entities.ScoreSnapshot.fields.is_current
        distinguishing_aspect: "Depth-4 chain from finalize(OOS): inspection->carrier.oos_points(+8)->carrier.status(UNDER_REVIEW)->auto PROVISIONAL ScoreSnapshot created is_current=true; each hop is caused by the prior one."
        test_recipe:
          setup:
            - "Active carrier; REFERRED overweight screening; inspection with two OOS violations summing 8 (iss will be 12 >= 10, oos_points 8 < 20)."
          setup_api_calls:
            - { call: "POST /carriers", payload: { usdot_number: "DOT-844-G", legal_name: "Golf Logistics", irp_status: "ACTIVE", ifta_status: "ACTIVE", ucr_status: "ACTIVE" }, as: ComplianceAdmin, captures: { carrier_id: "$.data.id" } }
            - { call: "POST /stations", payload: { name: "I-10", state_code: "CA" }, as: ComplianceAdmin, captures: { station_id: "$.data.id" } }
            - { call: "POST /stations/${station_id}/bays", payload: { label: "Bay 1" }, as: ComplianceAdmin, captures: { bay_id: "$.data.id" } }
            - { call: "POST /carriers/${carrier_id}/drivers", payload: { cdl_number: "CDL-7", full_name: "Ravi Driver" }, as: ComplianceAdmin, captures: { driver_id: "$.data.id" } }
            - { call: "POST /screenings", payload: { station_id: "${station_id}", carrier_id: "${carrier_id}", driver_id: "${driver_id}", vehicle_plate: "PLT-7", axle_count: 5, gross_weight_lbs: 86000, heaviest_axle_lbs: 21000, hazmat_placarded: false }, as: Screener, captures: { screening_id: "$.data.id" } }
            - { call: "POST /inspections", payload: { screening_id: "${screening_id}", bay_id: "${bay_id}", level: "LEVEL_I", scheduled_start: "2026-03-02T10:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }, as: Inspector, captures: { inspection_id: "$.data.id" } }
            - { call: "POST /inspections/${inspection_id}/violations", payload: { code: "393.75", category: "WEIGHT", severity_weight: 4, oos: true }, as: Inspector }
            - { call: "POST /inspections/${inspection_id}/violations", payload: { code: "393.9", category: "VEHICLE", severity_weight: 4, oos: true }, as: Inspector }
          trigger:
            - { call: "POST /inspections/${inspection_id}/finalize", payload: { result: "OOS" }, as: Inspector }
          assert:
            - "Carrier.${carrier_id}.oos_points == 8"
            - "Carrier.${carrier_id}.status == UNDER_REVIEW"
            - "Carrier.${carrier_id}.prism_flagged == true"
            - "ScoreSnapshot for ${carrier_id} with is_current==true exists, method == PROVISIONAL, iss_score == 12"

      - name: citation_issue_cascade_to_registration_hold
        grounds:
          - state_machines.Citation.ASSESSED_to_CONTESTED
          - entities.Carrier.fields.unpaid_fines_cents
          - entities.Carrier.fields.registration_hold
        distinguishing_aspect: "Depth-2 chain from citation issuance: citation->carrier.unpaid_fines_cents(145000)->registration_hold flips true because 145000 >= FINE_HOLD_THRESHOLD_CENTS; trigger differs from the finalize cascade."
        test_recipe:
          setup:
            - "Active carrier; overweight inspection finalized OOS (assessed fine will be 145000)."
          setup_api_calls:
            - { call: "POST /carriers", payload: { usdot_number: "DOT-844-H", legal_name: "Hotel Haulage", irp_status: "ACTIVE", ifta_status: "ACTIVE", ucr_status: "ACTIVE" }, as: ComplianceAdmin, captures: { carrier_id: "$.data.id" } }
            - { call: "POST /stations", payload: { name: "I-40", state_code: "CA" }, as: ComplianceAdmin, captures: { station_id: "$.data.id" } }
            - { call: "POST /stations/${station_id}/bays", payload: { label: "Bay 1" }, as: ComplianceAdmin, captures: { bay_id: "$.data.id" } }
            - { call: "POST /carriers/${carrier_id}/drivers", payload: { cdl_number: "CDL-8", full_name: "Ivy Driver" }, as: ComplianceAdmin, captures: { driver_id: "$.data.id" } }
            - { call: "POST /screenings", payload: { station_id: "${station_id}", carrier_id: "${carrier_id}", driver_id: "${driver_id}", vehicle_plate: "PLT-8", axle_count: 5, gross_weight_lbs: 86000, heaviest_axle_lbs: 21000, hazmat_placarded: false }, as: Screener, captures: { screening_id: "$.data.id" } }
            - { call: "POST /inspections", payload: { screening_id: "${screening_id}", bay_id: "${bay_id}", level: "LEVEL_I", scheduled_start: "2026-03-02T10:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }, as: Inspector, captures: { inspection_id: "$.data.id" } }
            - { call: "POST /inspections/${inspection_id}/violations", payload: { code: "393.75", category: "WEIGHT", severity_weight: 5, oos: true }, as: Inspector }
