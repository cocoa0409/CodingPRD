scaffold_corner_design:
  - section: entities
    instances:
      - name: institution_creation_stores_every_input_field_and_defaults_the_aggregates
        claim_type: Creation
        grounds:
          - entities.Institution
          - endpoints[POST /institutions]
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /institutions"
              payload: { legal_name: "Northbay National Bank", charter_type: "NATIONAL", primary_regulator: "OCC", cet1_capital_usd: 200000000, tier1_capital_usd: 210000000, total_capital_usd: 240000000, risk_weighted_assets_usd: 2000000000, average_total_assets_usd: 2600000000, total_loans_usd: 1500000000, latest_cra_rating: "SATISFACTORY" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { inst_id: "$.data.id" }
          assert:
            - "HTTP status == 201"
            - "Institution.${inst_id}.legal_name == Northbay National Bank"
            - "Institution.${inst_id}.charter_type == NATIONAL"
            - "Institution.${inst_id}.primary_regulator == OCC"
            - "Institution.${inst_id}.cet1_capital_usd == 200000000"
            - "Institution.${inst_id}.latest_cra_rating == SATISFACTORY"
            - "Institution.${inst_id}.status == ACTIVE"
            - "Institution.${inst_id}.total_deposits_usd == 0"
            - "Institution.${inst_id}.branch_count == 0"
            - "Institution.${inst_id}.version == 1"
            - "Institution.${inst_id}.created_at == 2026-08-01T00:00:00Z"

      - name: deposit_market_retrieval_returns_the_stored_row
        claim_type: Retrieval
        grounds:
          - entities.DepositMarket
          - endpoints[GET /deposit-markets/{id}]
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one MSA market with no branches yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
            - call: "POST /deposit-markets"
              payload: { market_code: "KESTREL-MSA", market_name: "Kestrel MSA", market_type: "MSA" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { mkt_id: "$.data.id" }
          trigger:
            - call: "GET /deposit-markets/${mkt_id}"
              payload: {}
              as: PublicCommenter
              as_user_id: "commenter-1"
          assert:
            - "HTTP status == 200"
            - "DepositMarket.${mkt_id}.market_code == KESTREL-MSA"
            - "DepositMarket.${mkt_id}.market_type == MSA"
            - "DepositMarket.${mkt_id}.total_deposits_usd == 0"
            - "DepositMarket.${mkt_id}.participant_count == 0"
            - "DepositMarket.${mkt_id}.hhi_current == 0"

      - name: branch_listing_filters_by_market_and_paginates
        claim_type: Listing
        grounds:
          - endpoints[GET /branches]
          - response_envelope
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "two markets, one institution, three branches: two in Kestrel MSA and one in Fernwood MSA"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
            - call: "POST /deposit-markets"
              payload: { market_code: "KESTREL-MSA", market_name: "Kestrel MSA", market_type: "MSA" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { mkt_id: "$.data.id" }
            - call: "POST /deposit-markets"
              payload: { market_code: "FERNWOOD-MSA", market_name: "Fernwood MSA", market_type: "MSA" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { mkt2_id: "$.data.id" }
            - call: "POST /institutions"
              payload: { legal_name: "Northbay National Bank", charter_type: "NATIONAL", primary_regulator: "OCC", cet1_capital_usd: 200000000, tier1_capital_usd: 210000000, total_capital_usd: 240000000, risk_weighted_assets_usd: 2000000000, average_total_assets_usd: 2600000000, total_loans_usd: 1500000000, latest_cra_rating: "SATISFACTORY" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { acq_id: "$.data.id" }
            - call: "POST /branches"
              payload: { institution_id: "${acq_id}", market_id: "${mkt_id}", branch_name: "Northbay Kestrel Main", deposits_usd: 200000000, service_type: "FULL_SERVICE" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { br1: "$.data.id" }
            - call: "POST /branches"
              payload: { institution_id: "${acq_id}", market_id: "${mkt_id}", branch_name: "Northbay Kestrel North", deposits_usd: 30000000, service_type: "LIMITED_SERVICE" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { br2: "$.data.id" }
            - call: "POST /branches"
              payload: { institution_id: "${acq_id}", market_id: "${mkt2_id}", branch_name: "Northbay Fernwood", deposits_usd: 10000000, service_type: "FULL_SERVICE" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { br3: "$.data.id" }
          trigger:
            - call: "GET /branches"
              payload: { market_id: "${mkt_id}", limit: 1, offset: 0 }
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { first_id: "$.data[0].id" }
          assert:
            - "HTTP status == 200"
            - "meta.total_count == 2"
            - "meta.has_more == true"
            - "exactly 1 row is returned and it belongs to market ${mkt_id}"
            - "the same call with offset 1 returns the other Kestrel branch and meta.has_more == false"
            - "the Fernwood branch ${br3} never appears under the market_id ${mkt_id} filter"

      - name: get_unknown_pro_forma_schedule_not_found
        claim_type: Not Found
        grounds:
          - errors.ERR_SCHEDULE_NOT_FOUND
          - endpoints[GET /pro-forma-schedules/{id}]
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "no schedules exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "GET /pro-forma-schedules/00000000-0000-4000-8000-000000000abc"
              payload: {}
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status == 404"
            - "error_id == ERR_SCHEDULE_NOT_FOUND"

      - name: branch_without_deposits_usd_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Branch.fields.deposits_usd
          - errors.ERR_INVALID_REQUEST
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one market and one institution"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
            - call: "POST /deposit-markets"
              payload: { market_code: "KESTREL-MSA", market_name: "Kestrel MSA", market_type: "MSA" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { mkt_id: "$.data.id" }
            - call: "POST /institutions"
              payload: { legal_name: "Northbay National Bank", charter_type: "NATIONAL", primary_regulator: "OCC", cet1_capital_usd: 200000000, tier1_capital_usd: 210000000, total_capital_usd: 240000000, risk_weighted_assets_usd: 2000000000, average_total_assets_usd: 2600000000, total_loans_usd: 1500000000, latest_cra_rating: "SATISFACTORY" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { acq_id: "$.data.id" }
          trigger:
            - call: "POST /branches"
              payload: { institution_id: "${acq_id}", market_id: "${mkt_id}", branch_name: "Northbay Kestrel Main" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_INVALID_REQUEST"
            - "no Branch row is created and DepositMarket.${mkt_id}.participant_count stays 0"

      - name: comment_period_duration_defaults_to_thirty_days
        claim_type: Defaults
        grounds:
          - entities.PublicCommentPeriod.fields.duration_days
          - calculations.comment_window_semantics
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "an application in DRAFT (a period may be opened for it explicitly)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
            - call: "POST /institutions"
              payload: { legal_name: "Northbay National Bank", charter_type: "NATIONAL", primary_regulator: "OCC", cet1_capital_usd: 200000000, tier1_capital_usd: 210000000, total_capital_usd: 240000000, risk_weighted_assets_usd: 2000000000, average_total_assets_usd: 2600000000, total_loans_usd: 1500000000, latest_cra_rating: "SATISFACTORY" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { acq_id: "$.data.id" }
            - call: "POST /institutions"
              payload: { legal_name: "Harbor Community Bank", charter_type: "STATE_NONMEMBER", primary_regulator: "FDIC", cet1_capital_usd: 60000000, tier1_capital_usd: 62000000, total_capital_usd: 70000000, risk_weighted_assets_usd: 700000000, average_total_assets_usd: 800000000, total_loans_usd: 520000000, latest_cra_rating: "SATISFACTORY" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { tgt_id: "$.data.id" }
            - call: "POST /merger-applications"
              payload: { acquirer_id: "${acq_id}", target_id: "${tgt_id}", structure: "STATUTORY_MERGER", consideration_type: "MIXED", total_consideration_usd: 250000000, officer_experience_score: 72, risk_management_score: 68, compliance_history_score: 67, integration_readiness_score: 73 }
              as: Filer
              as_user_id: "${acq_id}"
              captures: { app_id: "$.data.id" }
          trigger:
            - call: "POST /comment-periods"
              payload: { application_id: "${app_id}", opens_at: "2026-09-01T00:00:00Z" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { cp_id: "$.data.id" }
          assert:
            - "PublicCommentPeriod.${cp_id}.duration_days == 30"
            - "PublicCommentPeriod.${cp_id}.closes_at == 2026-10-01T00:00:00Z"
            - "PublicCommentPeriod.${cp_id}.extension_count == 0"
            - "PublicCommentPeriod.${cp_id}.extended_days_total == 0"
            - "PublicCommentPeriod.${cp_id}.status == OPEN"
            - "MergerApplication.${app_id}.public_review_status == OPEN_FOR_COMMENT"

      - name: institution_deposit_aggregates_are_computed_and_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.Institution.fields.total_deposits_usd
          - entities.Institution.fields.branch_count
          - calculations.market_deposit_aggregation
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one market and one institution created with only its own capital fields"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
            - call: "POST /deposit-markets"
              payload: { market_code: "KESTREL-MSA", market_name: "Kestrel MSA", market_type: "MSA" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { mkt_id: "$.data.id" }
            - call: "POST /institutions"
              payload: { legal_name: "Northbay National Bank", charter_type: "NATIONAL", primary_regulator: "OCC", cet1_capital_usd: 200000000, tier1_capital_usd: 210000000, total_capital_usd: 240000000, risk_weighted_assets_usd: 2000000000, average_total_assets_usd: 2600000000, total_loans_usd: 1500000000, latest_cra_rating: "SATISFACTORY" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { acq_id: "$.data.id" }
          trigger:
            - call: "POST /branches"
              payload: { institution_id: "${acq_id}", market_id: "${mkt_id}", branch_name: "Northbay Kestrel Main", deposits_usd: 200000000, service_type: "FULL_SERVICE" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { br1: "$.data.id" }
          assert:
            - "Institution.${acq_id}.total_deposits_usd == 200000000"
            - "Institution.${acq_id}.branch_count == 1"
            - "DepositMarket.${mkt_id}.total_deposits_usd == 200000000"
            - "DepositMarket.${mkt_id}.participant_count == 1"
            - "DepositMarket.${mkt_id}.hhi_current == 10000"
            - "Branch.${br1}.notice_lead_days == null"

      - name: public_comment_received_at_is_system_stamped_and_input_ignored
        claim_type: System Fields
        grounds:
          - entities.PublicComment.fields.received_at
          - endpoints[POST /public-comments].side_effects
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "an application submitted and accepted so a comment period is OPEN, then the clock advanced to 2026-08-10"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
            - call: "POST /institutions"
              payload: { legal_name: "Northbay National Bank", charter_type: "NATIONAL", primary_regulator: "OCC", cet1_capital_usd: 200000000, tier1_capital_usd: 210000000, total_capital_usd: 240000000, risk_weighted_assets_usd: 2000000000, average_total_assets_usd: 2600000000, total_loans_usd: 1500000000, latest_cra_rating: "SATISFACTORY" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { acq_id: "$.data.id" }
            - call: "POST /institutions"
              payload: { legal_name: "Harbor Community Bank", charter_type: "STATE_NONMEMBER", primary_regulator: "FDIC", cet1_capital_usd: 60000000, tier1_capital_usd: 62000000, total_capital_usd: 70000000, risk_weighted_assets_usd: 700000000, average_total_assets_usd: 800000000, total_loans_usd: 520000000, latest_cra_rating: "SATISFACTORY" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { tgt_id: "$.data.id" }
            - call: "POST /merger-applications"
              payload: { acquirer_id: "${acq_id}", target_id: "${tgt_id}", structure: "STATUTORY_MERGER", consideration_type: "MIXED", total_consideration_usd: 250000000, officer_experience_score: 72, risk_management_score: 68, compliance_history_score: 67, integration_readiness_score: 73 }
              as: Filer
              as_user_id: "${acq_id}"
              captures: { app_id: "$.data.id", app_v1: "$.data.version" }
            - call: "POST /pro-forma-schedules"
              payload: { application_id: "${app_id}", expected_application_version: "${app_v1}", basis: "REGULATORY_ADJUSTED", goodwill_created_usd: 40000000, core_deposit_intangible_usd: 10000000, aoci_markdown_usd: 25000000, deferred_tax_asset_usd: 12000000, transaction_costs_usd: 5000000, cash_consideration_usd: 20000000 }
              as: Filer
              as_user_id: "${acq_id}"
            - call: "POST /merger-applications/${app_id}/submit"
              payload: {}
              as: Filer
              as_user_id: "${acq_id}"
            - call: "POST /merger-applications/${app_id}/accept"
              payload: {}
              as: CaseAnalyst
              as_user_id: "analyst-1"
            - call: "GET /comment-periods"
              payload: { application_id: "${app_id}" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { cp_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-10T00:00:00Z" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /public-comments"
              payload: { period_id: "${cp_id}", commenter_name: "Rowan Delgado", commenter_type: "INDIVIDUAL", stance: "OPPOSE", body: "Branch hours have already been cut.", substantive: false }
              as: PublicCommenter
              as_user_id: "commenter-2"
              captures: { pc_id: "$.data.id" }
          assert:
            - "PublicComment.${pc_id}.received_at == 2026-08-10T00:00:00Z"
            - "PublicComment.${pc_id}.commenter_user_id == commenter-2"
            - "PublicComment.${pc_id}.status == RECEIVED"
            - "PublicComment.${pc_id}.response_body == null"
            - "PublicComment.${pc_id}.responded_at == null"
            - "PublicCommentPeriod.${cp_id}.comment_count == 1"
            - "PublicCommentPeriod.${cp_id}.substantive_protest_count == 0"
            - "MergerApplication.${app_id}.public_review_status == OPEN_FOR_COMMENT"

      - name: institution_with_undeclared_charter_type_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Institution.fields.charter_type
          - errors.ERR_INVALID_REQUEST
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /institutions"
              payload: { legal_name: "Undeclared Charter Bank", charter_type: "CREDIT_UNION", primary_regulator: "OCC", cet1_capital_usd: 100000000, tier1_capital_usd: 102000000, total_capital_usd: 110000000, risk_weighted_assets_usd: 800000000, average_total_assets_usd: 1000000000, total_loans_usd: 600000000, latest_cra_rating: "SATISFACTORY" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_INVALID_REQUEST"
            - "error_id != ERR_REGULATOR_CHARTER_MISMATCH (an undeclared enum fails at priority 4, before the priority 29 pairing rule)"

      - name: every_entity_is_mutable_and_carries_a_version_counter
        claim_type: Immutability
        grounds:
          - entities
          - complexity_profile.complexity_layers
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "an application at version 1 with a schedule attached"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
            - call: "POST /institutions"
              payload: { legal_name: "Northbay National Bank", charter_type: "NATIONAL", primary_regulator: "OCC", cet1_capital_usd: 200000000, tier1_capital_usd: 210000000, total_capital_usd: 240000000, risk_weighted_assets_usd: 2000000000, average_total_assets_usd: 2600000000, total_loans_usd: 1500000000, latest_cra_rating: "SATISFACTORY" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { acq_id: "$.data.id" }
            - call: "POST /institutions"
              payload: { legal_name: "Harbor Community Bank", charter_type: "STATE_NONMEMBER", primary_regulator: "FDIC", cet1_capital_usd: 60000000, tier1_capital_usd: 62000000, total_capital_usd: 70000000, risk_weighted_assets_usd: 700000000, average_total_assets_usd: 800000000, total_loans_usd: 520000000, latest_cra_rating: "SATISFACTORY" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { tgt_id: "$.data.id" }
            - call: "POST /merger-applications"
              payload: { acquirer_id: "${acq_id}", target_id: "${tgt_id}", structure: "STATUTORY_MERGER", consideration_type: "MIXED", total_consideration_usd: 250000000, officer_experience_score: 72, risk_management_score: 68, compliance_history_score: 67, integration_readiness_score: 73 }
              as: Filer
              as_user_id: "${acq_id}"
              captures: { app_id: "$.data.id", app_v1: "$.data.version" }
          trigger:
            - call: "POST /pro-forma-schedules"
              payload: { application_id: "${app_id}", expected_application_version: "${app_v1}", basis: "REGULATORY_ADJUSTED", goodwill_created_usd: 40000000, core_deposit_intangible_usd: 10000000, aoci_markdown_usd: 25000000, deferred_tax_asset_usd: 12000000, transaction_costs_usd: 5000000, cash_consideration_usd: 20000000 }
              as: Filer
              as_user_id: "${acq_id}"
              captures: { sch_id: "$.data.id" }
          assert:
            - "no entity in §1.1 declares common_fields false, so every row exposes id, created_at, updated_at and version"
            - "MergerApplication.${app_id}.version == 2 (the child create bumped the parent)"
            - "ProFormaCapitalSchedule.${sch_id}.version == 1"
            - "MergerApplication.${app_id}.updated_at == 2026-08-01T00:00:00Z"

      - name: branch_with_unknown_market_id_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Branch.fields.market_id
          - errors.ERR_MARKET_NOT_FOUND
          - validations[priority 8]
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one institution and no markets"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
            - call: "POST /institutions"
              payload: { legal_name: "Northbay National Bank", charter_type: "NATIONAL", primary_regulator: "OCC", cet1_capital_usd: 200000000, tier1_capital_usd: 210000000, total_capital_usd: 240000000, risk_weighted_assets_usd: 2000000000, average_total_assets_usd: 2600000000, total_loans_usd: 1500000000, latest_cra_rating: "SATISFACTORY" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { acq_id: "$.data.id" }
          trigger:
            - call: "POST /branches"
              payload: { institution_id: "${acq_id}", market_id: "00000000-0000-4000-8000-0000000000aa", branch_name: "Orphan Branch", deposits_usd: 10000000, service_type: "FULL_SERVICE" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status == 404"
            - "error_id == ERR_MARKET_NOT_FOUND"
            - "Institution.${acq_id}.branch_count == 0"

      - name: competitive_analysis_with_unknown_application_not_found
        claim_type: "entity_topology flat - foreign key references validated"
        grounds:
          - complexity_profile.entity_topology
          - errors.ERR_APPLICATION_NOT_FOUND
          - validations[priority 8]
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
