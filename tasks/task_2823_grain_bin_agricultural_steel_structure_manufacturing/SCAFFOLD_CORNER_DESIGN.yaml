      - name: bin_design_rejects_every_trigger_not_declared_from_its_current_state
        claim_type: invalid_transitions
        grounds:
          - state_machines[BinDesign].transitions
          - errors[ERR_DESIGN_STATE_INVALID]
        distinguishing_aspect: "The BinDesign machine is the cyclic one, so its four non-terminal states each accept exactly one or two triggers and must refuse the rest with the same 409. Walking DRAFT, UNDER_REVIEW and REVISION_REQUIRED and firing the wrong endpoint at each one distinguishes a real state table from an implementation that only checks whether the row exists. The REVISION_REQUIRED probes matter most: an implementation that treats REVISION_REQUIRED as just another DRAFT would wrongly accept submit-review there."
        test_recipe:
          setup:
            - "Jurisdiction NE-WEST (seal_required false), GrainProfile CORN, CoatingSpec G115."
            - "Two engineers: PE-1001 Dana Author and PE-1002 Rex Sealer, both licensed in NE-WEST."
            - "BinDesign D1 (12.0 m x 9.6 m, ASD) authored by PE-1001, with one ASD analysis whose verdict is PASS."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "NE-WEST", name: "Nebraska West", seal_required: false, min_design_wind_speed_mph: 95, seismic_design_category: "A", permit_review_days: 0 }
              as: PlantAdmin
              captures: { j_ns_id: $.data.id }
            - call: "POST /grain-profiles"
              payload: { grain_code: "CORN", bulk_density_kg_per_m3: 721, janssen_k_ratio: 0.42, max_safe_moisture_pct: 15.0, aeration_cfm_per_m3_base: 2.5, drying_multiplier: 4.0 }
              as: PlantAdmin
