            - { call: "POST /abatement/containments", payload: { project_id: "${p_id}", work_area_volume_cuft: 240000, containment_class: "FULL" }, as: Supervisor, as_user_id: "${w_sup}", captures: { c_id: "$.data.id" } }
            - { call: "POST /abatement/containments/${c_id}/install", payload: {}, as: Supervisor, as_user_id: "${w_sup}" }
            - { call: "POST /abatement/containments/${c_id}/verify", payload: { pressure_reading_inwg: -0.03 }, as: Supervisor, as_user_id: "${w_sup}" }
            - { call: "GET /abatement/projects/${p_id}", payload: {}, as: ContractorAdmin, captures: { p_v: "$.data.version" } }
            - { call: "POST /abatement/notifications", payload: { project_id: "${p_id}", notification_type: "INITIAL", declared_acm_sq_ft: 100, expected_project_version: "${p_v}" }, as: ContractorAdmin, captures: { n_id: "$.data.id", n_es: "$.data.earliest_start_at" } }
