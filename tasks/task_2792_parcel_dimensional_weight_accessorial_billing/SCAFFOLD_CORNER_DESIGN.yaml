          assert:
            - "The second scan's expected_shipment_version ${p_v2} had to be re-read from GET /shipments/${p} because a scan increments Shipment.version while the DimensionScan response carries no version of its own"
            - "DimensionScan.${scan_a} exposes id and created_at but carries NO version and NO updated_at field (common_fields false)"
            - "GET /shipments/${p}/scans returns total_count == 2 — the second scan appended a row rather than mutating the first"
            - "DimensionScan.${scan_a}.scanned_height_in == 20 and tolerance_status == WITHIN_TOLERANCE, unchanged after the second scan exists"
            - "DimensionScan.${scan_b}.scanned_height_in == 21, scanned_cube_in3 == 2100, dim_variance_pct == 5.00 and tolerance_status == EXCEEDS_TOLERANCE"
            - "Shipment.${p}.scanned_cube_in3 == 2100 — the governing scan is the newest row, not the first"

      - name: shipment_with_an_unknown_service_level_parent_is_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=7]  # ERR_SERVICE_LEVEL_NOT_FOUND
          - entities.Shipment.fields.service_level_id
        distinguishing_aspect: |
          The Shipment -> ServiceLevel parent reference is checked for existence before any
          pricing or state assignment: an unknown service_level_id returns HTTP 404
          ERR_SERVICE_LEVEL_NOT_FOUND even though the shipper and the contract both resolve.
        test_recipe:
          setup:
            - "SH-2001 is ACTIVE with an ACTIVE contract C1. Exactly one ServiceLevel (EXPRESS) exists, and the request will name a different id."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-2001", name: "Acme Parcel" }
              as: CarrierAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
