            - "basis_after == \"CASH\" and v_after == agr_v_now + 1"
      - name: stale_version_on_statement_generation_supersede
        claim_type: violation_to_error
        grounds: ['concurrency_rules[royalty-statement-create-stale-agreement]', 'state_machines.RoyaltyStatement.DRAFT_to_SUPERSEDED']
        distinguishing_aspect: "A second generation with the pre-first-generation version is rejected 412; with the fresh version it succeeds and supersedes the first DRAFT."
        test_recipe:
          setup: ["ACTIVE agreement; one DRAFT statement for September generated at version v0; client retries with the same stale version"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: BrandProgramAdmin }
