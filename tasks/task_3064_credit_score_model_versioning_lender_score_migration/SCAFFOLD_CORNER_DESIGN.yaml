          - entities.MigrationEvent.fields.to_score_variant_id
        distinguishing_aspect: "The migration-event list is filterable by the from-variant, the to-variant and the carried reason code independently, so a pair filter returns exactly the one event naming both ids."
        test_recipe:
          setup:
            - "Release M1 (CREDIT-DUAL-V1) and M2 (PRIME-SHIFT-V2) in the same family, each with a released AUTO variant; one RECALIBRATED event from the M1 variant to the M2 variant and one SNAPSHOT_COMPILED event from the M1 variant to the M1 variant."
          setup_api_calls:
            - {call: "POST /bureaus", payload: {bureau_code: "TUC", display_name: "TransUnion"}, as: BureauAdministrator, captures: {b_tuc: $.data.id}}
            - {call: "POST /score-models", payload: {family_code: "FICO_CORE", version_label: "CREDIT-DUAL-V1", min_input_count: 100, score_floor: 300, score_ceiling: 850}, as: ModelDeveloper, captures: {m1: $.data.id}}
