# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3110_independent_practice_affiliation_into_single_medical_group
#
# Depth probe: 9 Difficulty Rules x 2 instances. Every instance grounds in
# SCAFFOLD.yaml §1.1-§1.7 and is fully drivable from empty-DB via §1.5 calls.
# Logical clock default 2026-09-01T00:00:00Z is always set explicitly.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: distribution_net_provisional_vs_final_diverge_on_posted_batch
        grounds:
          - calculations.practice_distribution_net
          - calculations.shared_services_fee
          - state_machines.DistributionStatement.PROVISIONAL_ISSUED_to_FINAL_ISSUED
          - entities.DistributionStatement.fields.provisional_net_cents
          - entities.DistributionStatement.fields.net_distribution_cents
        distinguishing_aspect: |
          Entity domain: practice revenue-cycle distribution (DistributionStatement
          over CollectionBatch). Same batch data, two variants: the provisional
          variant counts the still-POSTED batch B at its posted amount, the final
          variant counts only settled amounts — provisional_net 42,000,000 vs
          final net 36,540,000 cents.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Group OPERATING, market, wave IN_CUTOVER, practice AFFILIATED via wave completion, contract activated (8% uplift), provider effective-enrolled on the contract."
            - "Batch A: posted 30,000,000, settled with denials 1,000,000 (settled 29,000,000). Batch B: posted 15,000,000, still POSTED."
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: GroupAdministrator
              as_user_id: "ga-root"
            - &k_group
              call: "POST /api/medical-groups"
              payload: { tin: "76-0001111", display_name: "Unified Medical Group" }
              as: GroupAdministrator
              as_user_id: "ga-root"
              captures: { mg_id: $.data.id }
            - &k_group_act
              call: "POST /api/medical-groups/${mg_id}/activate"
              payload: {}
              as: GroupAdministrator
              as_user_id: "ga-root"
            - &k_market
              call: "POST /api/markets"
              payload: { medical_group_id: "${mg_id}", name: "North Texas", state_code: "TX", max_practices: 10 }
              as: GroupAdministrator
              as_user_id: "ga-root"
              captures: { mkt_id: $.data.id }
            - &k_wave
              call: "POST /api/implementation-waves"
              payload: { market_id: "${mkt_id}", wave_code: "W1", cutover_start_date: "2026-08-01", cutover_end_date: "2026-12-31" }
              as: GroupAdministrator
              as_user_id: "ga-root"
              captures: { wave_id: $.data.id, wave_v: $.data.version }
            - &k_wave_lock
              call: "POST /api/implementation-waves/${wave_id}/lock"
              payload: { expected_wave_version: "${wave_v}" }
              as: GroupAdministrator
              as_user_id: "ga-root"
            - &k_wave_start
              call: "POST /api/implementation-waves/${wave_id}/start-cutover"
              payload: {}
              as: GroupAdministrator
              as_user_id: "ga-root"
            - &k_practice
              call: "POST /api/practices"
              payload: { medical_group_id: "${mg_id}", market_id: "${mkt_id}", legal_name: "Oak Cliff Family Medicine", legacy_tin: "75-9999999", org_npi: "1234567890" }
              as: GroupAdministrator
              as_user_id: "ga-root"
              captures: { prac_id: $.data.id, prac_v: $.data.version }
            - &k_agreement
              call: "POST /api/affiliation-agreements"
              payload: { practice_id: "${prac_id}", distribution_model: "NET_OF_SHARED_SERVICES", non_compete_accepted: true, expected_practice_version: "${prac_v}" }
              as: PracticeExecutive
              as_user_id: "${prac_id}"
              captures: { ag_id: $.data.id }
            - &k_agreement_exec
              call: "POST /api/affiliation-agreements/${ag_id}/execute"
              payload: {}
              as: PracticeExecutive
              as_user_id: "${prac_id}"
            - &k_provider
              call: "POST /api/providers"
              payload: { practice_id: "${prac_id}", npi: "1112223334", full_name: "Dr. Ada Fields", specialty: "Family Medicine", provider_role: "PHYSICIAN", employment_start_date: "2026-01-15" }
              as: GroupAdministrator
              as_user_id: "ga-root"
              captures: { prov_id: $.data.id }
            - &k_contract
              call: "POST /api/payer-contracts"
              payload: { medical_group_id: "${mg_id}", payer_name: "Lone Star Health Plan", contract_type: "HYBRID", effective_date: "2026-09-01" }
              as: PayerContractingOfficer
              as_user_id: "pco-marsha"
              captures: { pc_id: $.data.id }
            - &k_rate
              call: "POST /api/fee-schedule-rates"
              payload: { payer_contract_id: "${pc_id}", cpt_code: "99213", legacy_rate_cents: 10000, group_rate_cents: 10800 }
              as: PayerContractingOfficer
              as_user_id: "pco-marsha"
            - &k_vote
              call: "POST /api/committee-votes"
              payload: { market_id: "${mkt_id}", motion_type: "PAYER_CONTRACT_RATIFICATION", subject_contract_id: "${pc_id}" }
              as: MarketCommitteeChair
              as_user_id: "${prov_id}"
              captures: { vote_id: $.data.id }
            - &k_vote_cast
              call: "POST /api/committee-votes/${vote_id}/cast"
              payload: { ballot: "FOR" }
              as: PhysicianBoardMember
              as_user_id: "${prov_id}"
            - &k_contract_act
              call: "POST /api/payer-contracts/${pc_id}/activate"
              payload: {}
              as: PayerContractingOfficer
              as_user_id: "pco-marsha"
            - &k_enrollment
              call: "POST /api/credentialing-enrollments"
              payload: { provider_id: "${prov_id}", payer_contract_id: "${pc_id}", channel: "STANDARD", requested_effective_date: "2026-12-01" }
              as: CredentialingCoordinator
              as_user_id: "cc-jules"
              captures: { enr_id: $.data.id }
            - &k_enroll_approve
              call: "POST /api/credentialing-enrollments/${enr_id}/approve"
              payload: {}
              as: CredentialingCoordinator
              as_user_id: "cc-jules"
            - &k_wave_complete
              call: "POST /api/implementation-waves/${wave_id}/complete"
              payload: {}
              as: GroupAdministrator
              as_user_id: "ga-root"
            - &k_batch_a
              call: "POST /api/collection-batches"
              payload: { practice_id: "${prac_id}", payer_contract_id: "${pc_id}", period: "2026-09", posted_amount_cents: 30000000 }
              as: DistributionAccountant
              as_user_id: "da-roy"
              captures: { batch_a: $.data.id }
            - &k_batch_a_settle
              call: "POST /api/collection-batches/${batch_a}/settle"
              payload: { denial_amount_cents: 1000000 }
              as: DistributionAccountant
              as_user_id: "da-roy"
            - &k_batch_b
              call: "POST /api/collection-batches"
              payload: { practice_id: "${prac_id}", payer_contract_id: "${pc_id}", period: "2026-09", posted_amount_cents: 15000000 }
              as: DistributionAccountant
              as_user_id: "da-roy"
              captures: { batch_b: $.data.id }
          trigger:
            - &k_statement
              call: "POST /api/distribution-statements"
              payload: { practice_id: "${prac_id}", period: "2026-09" }
              as: DistributionAccountant
              as_user_id: "da-roy"
              captures: { stmt_id: $.data.id, stmt_prov_net: $.data.provisional_net_cents }
            - call: "POST /api/collection-batches/${batch_b}/settle"
              payload: { denial_amount_cents: 3000000 }
              as: DistributionAccountant
              as_user_id: "da-roy"
            - call: "POST /api/distribution-statements/${stmt_id}/finalize"
              payload: {}
              as: GroupFinancialController
              as_user_id: "gfc-lena"
          assert:
            - "DistributionStatement.${stmt_id}.provisional_gross_cents == 44000000 (29,000,000 settled + 15,000,000 posted)"
            - "DistributionStatement.${stmt_id}.provisional_fee_cents == 3080000 (0.07 * 44,000,000, both batches inside tier 1)"
            - "stmt_prov_net == 40920000"
            - "After finalize: gross_collections_cents == 41000000 (29,000,000 + 12,000,000; POSTED basis excluded)"
            - "After finalize: shared_services_fee_cents == 2870000 and net_distribution_cents == 38130000"
            - "DistributionStatement.${stmt_id}.net_distribution_cents != DistributionStatement.${stmt_id}.provisional_net_cents — the two variants disagree on identical underlying batches"

      - name: departure_penalty_estimated_vs_final_diverge_on_clock_drift
        grounds:
          - calculations.departure_penalty
          - state_machines.DepartureCase.SETTLEMENT_PENDING_to_SETTLED
          - entities.DepartureCase.fields.estimated_penalty_cents
          - entities.DepartureCase.fields.final_penalty_cents
        distinguishing_aspect: |
          Entity domain: departure-case penalty (DepartureCase), NOT revenue-cycle
          distribution. Estimated variant evaluates tenure at assumed_exit_date
          (14 months -> 5,500,000 cents), final variant at actual_exit_date which
          includes the settle-time clock (15 months -> 5,250,000 cents).
        test_recipe:
          setup:
            - "Base affiliated setup (group OPERATING, wave, practice AFFILIATED on 2026-09-01). Clock then moved to 2027-06-01; practice files departure with requested_exit_date 2027-09-01, before its earliest permitted exit (notice_date + 180 days = 2027-11-28)."
          setup_api_calls:
            - *k_clock
            - *k_group
            - *k_group_act
            - *k_market
            - *k_wave
            - *k_wave_lock
            - *k_wave_start
            - *k_practice
            - *k_agreement
            - *k_agreement_exec
            - *k_wave_complete
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: GroupAdministrator
              as_user_id: "ga-root"
          trigger:
            - call: "POST /api/departure-cases"
              payload: { practice_id: "${prac_id}", requested_exit_date: "2027-09-01" }
              as: PracticeExecutive
              as_user_id: "${prac_id}"
              captures: { dc_id: $.data.id, dc_est: $.data.estimated_penalty_cents }
            - call: "POST /api/departure-cases/${dc_id}/complete-review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-irene"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-12-01T00:00:00Z" }
              as: GroupAdministrator
              as_user_id: "ga-root"
            - call: "POST /api/departure-cases/${dc_id}/settle"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-irene"
          assert:
            - "DepartureCase.${dc_id}.earliest_exit_date == \"2027-11-28\" and notice_sufficient == false"
            - "dc_est == 5500000 (assumed exit 2027-11-28: tenure 14 months; 2,500,000 + 10*250,000 + 500,000 notice penalty)"
            - "After settle: actual_exit_date == \"2027-12-01\" (clock later than assumed exit)"
            - "After settle: final_penalty_cents == 5250000 (tenure 15 months: 2,500,000 + 9*250,000 + 500,000)"
            - "final_penalty_cents != estimated_penalty_cents"
            - "DepartureCase.${dc_id}.non_compete_applies == true in both variants (tenure < 24 months)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: shared_services_fee_tier_straddle_with_chronological_batch_order
        grounds:
          - calculations.shared_services_fee
          - entities.MedicalGroup.fields.shared_services_tier1_cap_cents
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — tier1 rate below the
          50,000,000-cent cap, tier2 above it, with an agreement-override branch;
          batches fill tier 1 in created_at order. Two batches of 30,000,000 cents
          straddle the cap: total fee 4,000,000 (2,100,000 + 1,900,000), not the
          flat 4,200,000 a single-rate reading would give.
        test_recipe:
          setup:
            - "Base affiliated setup with an EFFECTIVE enrollment; two batches in period 2026-09 of 30,000,000 each (gross 60,000,000 straddles the 50,000,000 tier-1 cap), both settled without denials."
          setup_api_calls:
            - *k_clock
            - *k_group
            - *k_group_act
            - *k_market
            - *k_wave
            - *k_wave_lock
            - *k_wave_start
            - *k_practice
            - *k_agreement
            - *k_agreement_exec
            - *k_provider
            - *k_contract
            - *k_rate
            - *k_vote
            - *k_vote_cast
            - *k_contract_act
            - *k_enrollment
            - *k_enroll_approve
            - *k_wave_complete
            - *k_batch_a
            - call: "POST /api/collection-batches/${batch_a}/settle"
              payload: { denial_amount_cents: 0 }
              as: DistributionAccountant
              as_user_id: "da-roy"
            - *k_batch_b
            - call: "POST /api/collection-batches/${batch_b}/settle"
              payload: { denial_amount_cents: 0 }
              as: DistributionAccountant
              as_user_id: "da-roy"
            - *k_statement
          trigger:
            - call: "POST /api/distribution-statements/${stmt_id}/finalize"
              payload: {}
              as: GroupFinancialController
              as_user_id: "gfc-lena"
          assert:
            - "DistributionStatement.${stmt_id}.gross_collections_cents == 60000000"
            - "shared_services_fee_cents == 4000000 (batch1 all tier1: 2,100,000; batch2: 0.07*20,000,000 + 0.05*10,000,000 = 1,900,000)"
            - "net_distribution_cents == 56000000"
            - "shared_services_fee_cents != 4200000 — the tier straddle is marginal, not average-rate"

      - name: incentive_share_floor_then_remainder_waterfall
        grounds:
          - calculations.value_based_incentive_share
          - entities.IncentiveAllocation.fields.share_cents
        distinguishing_aspect: |
          Mode (b): nested rounding — floor each pro-rata share first, then hand
          the leftover cents out one at a time ordered by fractional remainder
          DESC, quality DESC, created_at ASC. Pool 1,000,000 over weights
          180,000 and 80,000 floors to 692,307 + 307,692 = 999,999; the single
          remainder cent goes to the larger fractional remainder (0.6923), giving
          692,308 — a sum-then-round reading would give 692,308/307,692 too, so
          the assert also pins that a third allocation's presence changes which
          practice receives the remainder cent.
        test_recipe:
          setup:
            - "Base affiliated setup plus a second practice P2 in the same market, also AFFILIATED via the same wave, with its own EFFECTIVE-enrolled provider. HYBRID contract ACTIVE. Pool of 1,000,000 cents for 2026-09; P1 attests quality 90 / 2000 lives (weight 180,000), P2 attests quality 80 / 1000 lives (weight 80,000)."
          setup_api_calls:
            - *k_clock
            - *k_group
            - *k_group_act
            - *k_market
            - *k_wave
            - *k_wave_lock
            - *k_wave_start
            - *k_practice
            - *k_agreement
            - *k_agreement_exec
            - *k_provider
            - *k_contract
            - *k_rate
            - *k_vote
            - *k_vote_cast
            - *k_contract_act
            - *k_enrollment
            - *k_enroll_approve
            - &k_practice2
              call: "POST /api/practices"
              payload: { medical_group_id: "${mg_id}", market_id: "${mkt_id}", legal_name: "Bishop Arts Pediatrics", legacy_tin: "75-8888888", org_npi: "2234567891" }
              as: GroupAdministrator
              as_user_id: "ga-root"
              captures: { prac2_id: $.data.id, prac2_v: $.data.version }
            - call: "POST /api/affiliation-agreements"
              payload: { practice_id: "${prac2_id}", distribution_model: "NET_OF_SHARED_SERVICES", non_compete_accepted: true, expected_practice_version: "${prac2_v}" }
              as: PracticeExecutive
              as_user_id: "${prac2_id}"
              captures: { ag2_id: $.data.id }
            - call: "POST /api/affiliation-agreements/${ag2_id}/execute"
              payload: {}
              as: PracticeExecutive
              as_user_id: "${prac2_id}"
            - &k_provider2
              call: "POST /api/providers"
              payload: { practice_id: "${prac2_id}", npi: "4445556667", full_name: "Dr. Ben Osei", specialty: "Pediatrics", provider_role: "PHYSICIAN", employment_start_date: "2026-02-01" }
              as: GroupAdministrator
              as_user_id: "ga-root"
              captures: { prov2_id: $.data.id }
            - call: "POST /api/credentialing-enrollments"
              payload: { provider_id: "${prov2_id}", payer_contract_id: "${pc_id}", channel: "STANDARD", requested_effective_date: "2026-12-01" }
              as: CredentialingCoordinator
              as_user_id: "cc-jules"
              captures: { enr2_id: $.data.id }
            - call: "POST /api/credentialing-enrollments/${enr2_id}/approve"
              payload: {}
              as: CredentialingCoordinator
              as_user_id: "cc-jules"
            - *k_wave_complete
            - &k_pool
              call: "POST /api/incentive-pools"
              payload: { payer_contract_id: "${pc_id}", period: "2026-09", pool_amount_cents: 1000000 }
              as: PayerContractingOfficer
              as_user_id: "pco-marsha"
              captures: { pool_id: $.data.id }
            - &k_alloc1
              call: "POST /api/incentive-allocations"
              payload: { pool_id: "${pool_id}", practice_id: "${prac_id}", quality_score: 90, attributed_lives: 2000 }
              as: PracticeExecutive
              as_user_id: "${prac_id}"
              captures: { alloc1_id: $.data.id }
            - &k_alloc2
              call: "POST /api/incentive-allocations"
              payload: { pool_id: "${pool_id}", practice_id: "${prac2_id}", quality_score: 80, attributed_lives: 1000 }
              as: PracticeExecutive
              as_user_id: "${prac2_id}"
              captures: { alloc2_id: $.data.id }
            - &k_pool_close
              call: "POST /api/incentive-pools/${pool_id}/close-entries"
              payload: {}
              as: GroupFinancialController
              as_user_id: "gfc-lena"
          trigger:
            - call: "POST /api/incentive-pools/${pool_id}/allocate"
              payload: {}
              as: GroupFinancialController
              as_user_id: "gfc-lena"
          assert:
            - "IncentiveAllocation.${alloc1_id}.weight == 180000.000000 and status == SCORED"
            - "IncentiveAllocation.${alloc2_id}.weight == 80000.000000 and status == SCORED"
            - "IncentiveAllocation.${alloc1_id}.share_cents == 692308 (floor 692,307 plus the single remainder cent: fractional 0.6923 > 0.3077)"
            - "IncentiveAllocation.${alloc2_id}.share_cents == 307692"
            - "ValueBasedIncentivePool.${pool_id}.allocated_total_cents == 1000000 — shares conserve the pool exactly"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: practice_affiliated_suspended_cycle_with_distribution_gating
        grounds:
          - state_machines.Practice.AFFILIATED_to_SUSPENDED
          - state_machines.Practice.SUSPENDED_to_AFFILIATED
          - validations[priority=6]
        distinguishing_aspect: |
          Cycle on Practice: AFFILIATED -> SUSPENDED -> AFFILIATED. While
          SUSPENDED, statement creation and batch posting are rejected with
          ERR_PRACTICE_NOT_AFFILIATED; after reinstate the same calls succeed —
          the loop is traversable more than once and gates downstream writes.
        test_recipe:
          setup:
            - "Base affiliated setup with EFFECTIVE enrollment; practice AFFILIATED."
          setup_api_calls:
            - *k_clock
            - *k_group
            - *k_group_act
            - *k_market
            - *k_wave
            - *k_wave_lock
            - *k_wave_start
            - *k_practice
            - *k_agreement
            - *k_agreement_exec
            - *k_provider
            - *k_contract
            - *k_rate
            - *k_vote
            - *k_vote_cast
            - *k_contract_act
            - *k_enrollment
            - *k_enroll_approve
            - *k_wave_complete
          trigger:
            - call: "POST /api/practices/${prac_id}/suspend"
              payload: {}
              as: GroupAdministrator
              as_user_id: "ga-root"
            - call: "POST /api/collection-batches"
              payload: { practice_id: "${prac_id}", payer_contract_id: "${pc_id}", period: "2026-09", posted_amount_cents: 100000 }
              as: DistributionAccountant
              as_user_id: "da-roy"
              captures: { err_suspended: $.data.error_id }
            - call: "POST /api/practices/${prac_id}/reinstate"
              payload: {}
              as: GroupAdministrator
              as_user_id: "ga-root"
            - call: "POST /api/collection-batches"
              payload: { practice_id: "${prac_id}", payer_contract_id: "${pc_id}", period: "2026-09", posted_amount_cents: 100000 }
              as: DistributionAccountant
              as_user_id: "da-roy"
              captures: { batch_ok: $.data.id }
            - call: "POST /api/practices/${prac_id}/suspend"
              payload: {}
              as: GroupAdministrator
              as_user_id: "ga-root"
            - call: "POST /api/practices/${prac_id}/reinstate"
              payload: {}
              as: GroupAdministrator
              as_user_id: "ga-root"
          assert:
            - "err_suspended == ERR_PRACTICE_NOT_AFFILIATED with http 409"
            - "Second batch post succeeds after reinstate: CollectionBatch.${batch_ok} exists with status POSTED"
            - "The suspend/reinstate loop traversed twice: Practice.${prac_id}.status == AFFILIATED at the end"
            - "Practice.${prac_id}.version advanced by exactly 4 across the two cycles"

      - name: departure_case_dispute_resettle_cycle_before_settle
        grounds:
          - state_machines.DepartureCase.SETTLEMENT_PENDING_to_DISPUTED
          - state_machines.DepartureCase.DISPUTED_to_SETTLEMENT_PENDING
        distinguishing_aspect: |
          Cycle on DepartureCase (different entity than Practice): SETTLEMENT_PENDING
          -> DISPUTED -> SETTLEMENT_PENDING, traversable repeatedly, and the case
          can still reach SETTLED afterwards — the loop does not consume the
          forward path.
        test_recipe:
          setup:
            - "Base affiliated setup; clock 2027-06-01; departure case created with requested_exit_date 2027-12-01 (notice sufficient: earliest exit 2027-11-28), review completed."
          setup_api_calls:
            - *k_clock
            - *k_group
            - *k_group_act
            - *k_market
            - *k_wave
            - *k_wave_lock
            - *k_wave_start
            - *k_practice
            - *k_agreement
            - *k_agreement_exec
            - *k_wave_complete
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: GroupAdministrator
              as_user_id: "ga-root"
            - call: "POST /api/departure-cases"
              payload: { practice_id: "${prac_id}", requested_exit_date: "2027-12-01" }
              as: PracticeExecutive
              as_user_id: "${prac_id}"
              captures: { dc_id: $.data.id }
            - call: "POST /api/departure-cases/${dc_id}/complete-review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-irene"
          trigger:
            - call: "POST /api/departure-cases/${dc_id}/dispute"
              payload: {}
              as: PracticeExecutive
              as_user_id: "${prac_id}"
            - call: "POST /api/departure-cases/${dc_id}/resettle"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-irene"
            - call: "POST /api/departure-cases/${dc_id}/dispute"
              payload: {}
              as: PracticeExecutive
              as_user_id: "${prac_id}"
            - call: "POST /api/departure-cases/${dc_id}/resettle"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-irene"
            - call: "POST /_clock/set_current_utc"
