          units: 500
        as: WarehouseLead
      - call: POST /shipments/${s1}/load
        as: WarehouseLead
      - call: POST /shipments/${s1}/dispatch
        as: WarehouseLead
      - call: POST /shipments/${s1}/temperature-readings
        payload:
          readings:
          - recorded_at: '2026-08-10T09:00:00Z'
            temp_c: -19.0
          - recorded_at: '2026-08-10T10:00:00Z'
            temp_c: -19.0
        as: WarehouseLead
      - call: POST /_clock/set_current_utc
        payload:
