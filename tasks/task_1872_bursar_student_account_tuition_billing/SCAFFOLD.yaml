    input: ["status?", "limit?", "offset?"]
    output: FinancialHold[]
    side_effects: []

  # --- Refund ---
  - method: GET
    path: "/bursar/refunds/{id}"
    description: "Read a refund (Student: own account only)"
    roles: [Student, RegistrarStaff, BursarStaff, BursarManager]
    code: 200
    input: []
    output: Refund
    side_effects: []
  - method: GET
    path: "/bursar/refunds"
    description: "Filtered refund list (Student: own only)"
    roles: [Student, RegistrarStaff, BursarStaff, BursarManager]
    code: 200
    input: ["account_id?", "enrollment_id?", "status?", "limit?", "offset?"]
    output: Refund[]
    side_effects: []
  - method: POST
    path: "/bursar/refunds/{id}/transition"
    description: "Refund disposition: action APPROVE (post reversal + possible REFUND_PAYOUT) | VOID"
    roles: [BursarManager]
    code: 200
    input: [action]
    output: Refund
    side_effects: ["APPROVE: CHARGE_REVERSAL + optional REFUND_PAYOUT entries; VOID: no ledger effect"]

  # --- TaxForm1098T ---
  - method: POST
    path: "/bursar/tax-forms"
    description: "Generate a DRAFT 1098-T for a student + tax year (one DRAFT/FINALIZED per year)"
    roles: [BursarStaff, BursarManager]
    code: 201
    input: [student_id, tax_year]
    output: TaxForm1098T
    side_effects: ["form1098t_amounts computes box1/box5"]
  - method: GET
    path: "/bursar/tax-forms/{id}"
    description: "Read a 1098-T (Student: own only)"
    roles: [Student, RegistrarStaff, BursarStaff, BursarManager]
    code: 200
    input: []
    output: TaxForm1098T
    side_effects: []
  - method: GET
    path: "/bursar/students/{id}/tax-forms"
    description: "List a student's 1098-T forms (Student: own id only)"
    roles: [Student, RegistrarStaff, BursarStaff, BursarManager]
    code: 200
    input: []
    output: TaxForm1098T[]
    side_effects: []
  - method: GET
    path: "/bursar/tax-forms"
    description: "Filtered tax-form list"
    roles: [RegistrarStaff, BursarStaff, BursarManager]
    code: 200
    input: ["student_id?", "corrected_from_id?", "tax_year?", "limit?", "offset?"]
    output: TaxForm1098T[]
    side_effects: []
  - method: POST
    path: "/bursar/tax-forms/{id}/finalize"
    description: "DRAFT -> FINALIZED"
    roles: [BursarManager]
    code: 200
    input: []
    output: TaxForm1098T
    side_effects: []
  - method: POST
    path: "/bursar/tax-forms/{id}/correct"
    description: "FINALIZED -> SUPERSEDED; spawns a recomputed replacement DRAFT"
    roles: [BursarManager]
    code: 200
    input: []
    output: TaxForm1098T
    side_effects: ["old form SUPERSEDED", "new DRAFT created with corrected_from_id and recomputed boxes"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header missing/invalid" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on this endpoint, or entity-backed ownership check failed (Student touching another student's resource)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, bad enum value, or invalid date ordering on term/rate create" }
  - { id: ERR_TERM_NOT_FOUND, http: 404, condition: "term_id / term path id does not exist" }
  - { id: ERR_STUDENT_NOT_FOUND, http: 404, condition: "student_id / student path id does not exist" }
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "account_id / account path id does not exist" }
  - { id: ERR_ENROLLMENT_NOT_FOUND, http: 404, condition: "enrollment path id does not exist" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "Any other path id (payment, waiver, agreement, invoice, plan, installment, hold, refund, tax form) does not exist" }
  - { id: ERR_TERM_STATE_INVALID, http: 409, condition: "Term transition attempted from a state that does not allow it (incl. LOCK_CENSUS before census_date)" }
  - { id: ERR_TERM_NOT_OPEN, http: 409, condition: "Enrollment/drop requires term OPEN; withdraw requires OPEN or CENSUS_LOCKED" }
  - { id: ERR_TERM_NOT_CLOSABLE, http: 409, condition: "Term close attempted while some account has balance_cents > 0 and status != WRITTEN_OFF" }
  - { id: ERR_ENROLLMENT_NOT_ACTIVE, http: 409, condition: "Drop/withdraw attempted on a DROPPED or WITHDRAWN enrollment" }
  - { id: ERR_ACCOUNT_STATE_INVALID, http: 409, condition: "Operation requires account in {OPEN, PAST_DUE}: payment, plan creation, waiver create, hold create on CLOSED/WRITTEN_OFF/COLLECTIONS-only operations" }
  - { id: ERR_PAYMENT_STATE_INVALID, http: 409, condition: "Reverse attempted on a non-POSTED payment" }
  - { id: ERR_WAIVER_STATE_INVALID, http: 409, condition: "Post attempted on non-AWARDED waiver, or revoke on REVOKED waiver" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Invoice create/issue or operate attempted on EXHAUSTED/TERMINATED agreement" }
  - { id: ERR_INVOICE_STATE_INVALID, http: 409, condition: "Invoice transition/remittance attempted from a state that forbids it (incl. remittance while DISPUTED or PAID/VOID)" }
  - { id: ERR_PLAN_STATE_INVALID, http: 409, condition: "Cancel or installment-pay attempted on COMPLETED/CANCELLED plan" }
  - { id: ERR_INSTALLMENT_STATE_INVALID, http: 409, condition: "Pay attempted on PAID/CANCELLED installment" }
  - { id: ERR_HOLD_STATE_INVALID, http: 409, condition: "Release attempted on a RELEASED hold" }
  - { id: ERR_REFUND_STATE_INVALID, http: 409, condition: "Refund transition attempted on non-CALCULATED refund" }
  - { id: ERR_TAX_FORM_STATE_INVALID, http: 409, condition: "Finalize attempted on non-DRAFT, or correct attempted on non-FINALIZED form" }
  - { id: ERR_COLLECTIONS_STATE_INVALID, http: 409, condition: "send-to-collections from non-PAST_DUE, or write-off REQUEST/APPROVE out of order" }
  - { id: ERR_REGISTRATION_HOLD_ACTIVE, http: 422, condition: "Enrollment blocked: student has an ACTIVE REGISTRATION hold on some account" }
  - { id: ERR_NO_ACCOUNT_FOR_AGREEMENT, http: 422, condition: "SponsorInvoice create: no StudentAccount exists for the agreement's (student_id, term_id)" }
  - { id: ERR_DROP_WINDOW_CLOSED, http: 422, condition: "Drop effective_date after census_date" }
  - { id: ERR_WITHDRAWAL_WINDOW_CLOSED, http: 422, condition: "Withdraw effective_date outside [term.start_date, withdrawal_deadline]" }
  - { id: ERR_BILLING_WINDOW_CLOSED, http: 422, condition: "SponsorInvoice create after term.end_date + 30 days (billing cutoff)" }
  - { id: ERR_NO_APPLICABLE_TUITION_RATE, http: 422, condition: "No TuitionRate matches (term, residency, level, effective date) at assessment" }
  - { id: ERR_RATE_WINDOW_OVERLAP, http: 409, condition: "TuitionRate CLOSED effective window intersects an existing rate for the same (term, residency, level); touching endpoints overlap" }
  - { id: ERR_SPONSOR_WINDOW_OVERLAP, http: 409, condition: "SponsorAgreement HALF-OPEN window overlaps another agreement of the same student with intersecting covered kinds; adjacency (end == start) allowed" }
  - { id: ERR_PLAN_ALREADY_ACTIVE, http: 409, condition: "Plan creation while an ACTIVE plan exists on the account (a DEFAULTED plan is instead superseded via OCC)" }
  - { id: ERR_DRAFT_INVOICE_EXISTS, http: 409, condition: "SponsorInvoice create while another DRAFT invoice exists on the agreement" }
  - { id: ERR_DUPLICATE_TAX_FORM, http: 409, condition: "TaxForm create while a DRAFT or FINALIZED form exists for (student, tax_year)" }
  - { id: ERR_DUPLICATE_CODE, http: 409, condition: "Term code already exists" }
  - { id: ERR_DUPLICATE_EXTERNAL_REF, http: 409, condition: "Student external_ref already exists" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Write-off approver X-User-ID equals writeoff_requester_id" }
  - { id: ERR_CREDIT_HOURS_INVALID, http: 422, condition: "credit_hours outside 1..24" }
  - { id: ERR_AMOUNT_INVALID, http: 422, condition: "amount_cents / awarded_cents / cap_cents <= 0" }
  - { id: ERR_INSTALLMENT_AMOUNT_MISMATCH, http: 422, condition: "Installment pay amount does not equal the remaining installment amount" }
  - { id: ERR_OVERPAYMENT, http: 422, condition: "Sponsor remittance would push paid_cents above total_cents" }
  - { id: ERR_NO_BALANCE_DUE, http: 422, condition: "Plan creation or send-to-collections with balance_cents <= 0" }
  - { id: ERR_WAIVER_NOTHING_ELIGIBLE, http: 422, condition: "Waiver post with zero eligible open charge amount" }
  - { id: ERR_NO_BILLABLE_CHARGES, http: 422, condition: "Sponsor invoice generation produced zero lines (nothing eligible, or first eligible line exceeds remaining cap)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_account_version does not match the account's current version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Student
    description: "Enrolled student acting on their own records"
    identity: "entity_backed:Student"
    exclusive_operations:
      - "Self-service enrollment, drop, withdraw (POST /bursar/enrollments, /drop, /withdraw with student_id == X-User-ID)"
      - "Own-account payments and installment payments (POST /bursar/payments, POST /bursar/installments/{id}/pay)"
      - "Own payment-plan enrollment and cancellation"
    shared_operations:
      - "Read own student record, accounts, ledger, enrollments, payments, waivers, plans, installments, holds, refunds, tax forms (ownership: X-User-ID must equal the owning Student.id)"
  - name: RegistrarStaff
    description: "Registrar operations: academic calendar, rate cards, student records"
    identity: "opaque"
    exclusive_operations:
      - "Term create and OPEN/LOCK_CENSUS transitions (POST /bursar/terms, /transition)"
      - "TuitionRate creation (POST /bursar/tuition-rates)"
      - "Student registration (POST /bursar/students)"
      - "Administrative enrollment/drop/withdraw for any student"
    shared_operations:
      - "Read students, terms, rates, enrollments, accounts, ledger, payments, waivers, plans, installments, holds, refunds, tax forms"
      - "Set logical clock (POST /bursar/_clock/set_current_utc)"
  - name: BursarStaff
    description: "Bursar office clerk: billing, payments, waivers, sponsors, plans, holds, collections intake"
    identity: "opaque"
    exclusive_operations:
      - "Run billing cycle (POST /bursar/terms/{id}/run-billing-cycle)"
      - "Payment reversal (POST /bursar/payments/{id}/reverse)"
      - "Waiver create/post/revoke"
      - "Sponsor agreement and invoice management, remittance recording"
      - "Manual hold placement/release; send-to-collections; write-off REQUEST"
      - "Tax-form generation (POST /bursar/tax-forms)"
    shared_operations:
      - "Payments on any account; payment-plan create/cancel for any account"
      - "All read endpoints"
      - "Set logical clock"
  - name: BursarManager
    description: "Bursar office manager: approvals and dispositions; segregated from write-off requesters"
    identity: "opaque"
    exclusive_operations:
      - "Refund APPROVE/VOID (POST /bursar/refunds/{id}/transition)"
      - "Write-off APPROVE/REJECT (approver must differ from requester — ERR_SEGREGATION_OF_DUTIES)"
      - "Term CLOSE transition"
      - "Tax-form finalize/correct"
    shared_operations:
      - "All BursarStaff operations except where SoD forbids (a manager who REQUESTED a write-off cannot APPROVE it)"
      - "All read endpoints; set logical clock"
