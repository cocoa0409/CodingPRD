# =============================================================================
# SBA 7(a)/504 Loan Origination — benchmark seed tables (v1)
# §1.0–§1.7 (no scaffold_difficulty_design / scaffold_corner_design keys here)
# Flat topology: every entity is a top-level collection under /sba; children link
# to parents by FK and are discovered via filtered-list GETs.
# =============================================================================

scenario: |
  SBA 7(a)/504 Loan Origination: eligibility & size standard, use-of-proceeds &
  collateral, SBA guaranty fee & form package (1919/1920), credit memo & approval,
  closing & disbursement, secondary-market guaranty sale, servicing & 1502
  reporting, default/liquidation & guaranty purchase

domain_name: sba-loan-origination
api_prefix: /sba

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency        # OCC on Application.version for guaranty-sale supersede
    - cascading_side_effects        # disbursement / servicing / liquidation propagate balances
    - dual_variant_calculation      # guaranty fee (gross vs net-of-secondary) & purchase payout (repair vs clean)
    - rate_threshold_triggers       # fee tier breakpoints + size-standard caps at exact thresholds

  entity_topology: flat
  # Lender, Borrower, Application and every child (ProceedsLineItem, CollateralItem,
  # FormPackage, CreditMemo, Disbursement, GuarantySale, ServicingReport,
  # LiquidationEvent, GuarantyPurchase) are peer top-level collections under /sba,
  # linked by foreign keys and discovered via filtered-list GETs.

  state_machine_shape: cyclic
  # Application credit-review loop (UNDERWRITING <-> REVISION) is cyclic; Application
  # also carries two INDEPENDENT post-authorization status axes (servicing_status x
  # guaranty_status). FormPackage is branching (SUBMITTED -> {CLEARED, FLAGGED} with a
  # FLAGGED -> INCOMPLETE correction loop). Disbursement/ServicingReport are linear.

  relationship_patterns:
    - one_to_many        # Application -> CollateralItem, ProceedsLineItem, Disbursement, ServicingReport, ...
    - cross_aggregate    # GuarantySale references both Application and a Lender-level pool balance

  role_model: segregation_of_duties
  # The LoanOfficer who authors the credit memo cannot be the CreditApprover who
  # approves it (four-eyes / X-User-ID check). SbaOfficer issues authorization,
  # accepts 1502 reports, and pays guaranty purchases. InvestorServicer buys the
  # guaranteed portion on the secondary market.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Lender
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Lender (bank/CDC) legal name" }
      - { name: program, type: enum, source: input, description: "7A | 504 — program flavor", constraints: "7A | 504" }
      - { name: ongoing_fee_pool_cents, type: integer, source: computed, default: 0, description: "Accrued ongoing (servicing) guaranty fee owed to SBA across all this Lender's loans; credited on each accepted ServicingReport" }
      - { name: sold_guaranty_balance_cents, type: integer, source: computed, default: 0, description: "Sum of guaranteed principal currently sold to investors across this Lender's loans; conserved quantity for the secondary-market settle/repurchase invariant" }

  - name: Borrower
    parent: Lender
    common_fields: true
    fields:
      - { name: lender_id, type: string, source: input, description: "FK -> Lender.id; owning lender" }
      - { name: legal_name, type: string, source: input, description: "Borrower business legal name" }
      - { name: naics_code, type: string, source: input, description: "6-digit NAICS industry code used for the size-standard lookup" }
      - { name: tangible_net_worth_cents, type: integer, source: input, description: "Borrower tangible net worth; first prong of the alternative size standard" }
      - { name: avg_net_income_cents, type: integer, source: input, description: "2-year average net income after taxes; second prong of the alternative size standard" }
      - { name: affiliate_employee_count, type: integer, source: input, description: "Total employees including affiliates, for the headcount size standard" }
      - { name: is_eligible_business_type, type: boolean, source: input, default: true, description: "False for ineligible types (passive holding, lending, speculation); hard eligibility gate" }

  - name: Application
    parent: Borrower
    common_fields: true
    fields:
      - { name: borrower_id, type: string, source: input, description: "FK -> Borrower.id; the applicant" }
      - { name: lender_id, type: string, source: system, description: "FK -> Lender.id; denormalized from the Borrower at create time" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Total loan amount requested (gross loan)" }
      - { name: guaranty_pct, type: number, source: input, description: "SBA guaranty percentage on the gross loan, e.g. 0.75 or 0.85", constraints: "0 < guaranty_pct <= 0.90" }
      - { name: maturity_months, type: integer, source: input, description: "Loan term in months; >120 selects the long-term collateral coverage rule" }
      - { name: size_eligible, type: boolean, source: computed, default: false, description: "Result of the size-standard determination; computed at submit" }
      - { name: guaranteed_amount_cents, type: integer, source: computed, default: 0, description: "round_half_up(requested_amount_cents * guaranty_pct); SBA-guaranteed portion, frozen at AUTHORIZED" }
      - { name: guaranty_fee_cents, type: integer, source: computed, default: 0, description: "Upfront SBA guaranty fee, frozen at AUTHORIZED (see guaranty_fee calc)" }
      - { name: disbursed_amount_cents, type: integer, source: computed, default: 0, description: "Running sum of POSTED Disbursement.amount_cents on this Application" }
      - { name: outstanding_principal_cents, type: integer, source: computed, default: 0, description: "Disbursed principal minus principal repaid via accepted ServicingReports; drives liquidation and purchase math" }
      - { name: sold_guaranteed_principal_cents, type: integer, source: computed, default: 0, description: "Guaranteed principal currently sold via a SETTLED GuarantySale (0 if none/repurchased)" }
      - { name: status, type: enum, source: system, description: "Origination lifecycle axis", constraints: "DRAFT | UNDERWRITING | REVISION | PENDING_APPROVAL | APPROVED | AUTHORIZED | DISBURSING | CLOSED | WITHDRAWN | DECLINED" }
      - { name: servicing_status, type: enum, source: system, default: "NOT_SERVICING", description: "Parallel post-disbursement axis, INDEPENDENT of guaranty_status", constraints: "NOT_SERVICING | CURRENT | DELINQUENT | DEFAULTED | LIQUIDATED | PAID_IN_FULL" }
      - { name: guaranty_status, type: enum, source: system, default: "RETAINED", description: "Parallel post-authorization axis (who holds the guaranteed portion), INDEPENDENT of servicing_status", constraints: "RETAINED | SOLD | REPURCHASED | PURCHASED_BY_SBA" }

  - name: ProceedsLineItem
    parent: Application
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; parent application" }
      - { name: use_category, type: enum, source: input, description: "Use-of-proceeds bucket", constraints: "WORKING_CAPITAL | EQUIPMENT | REAL_ESTATE | REFINANCE | INVENTORY | GOODWILL" }
      - { name: amount_cents, type: integer, source: input, description: "Dollar amount allocated to this use" }
      - { name: is_fixed_asset, type: boolean, source: computed, description: "True for EQUIPMENT and REAL_ESTATE; flags the fixed-asset portion of proceeds" }

  - name: CollateralItem
    parent: Application
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; parent application" }
      - { name: asset_type, type: enum, source: input, description: "Collateral asset class", constraints: "REAL_ESTATE | EQUIPMENT | INVENTORY | RECEIVABLES" }
      - { name: appraised_value_cents, type: integer, source: input, description: "Independently appraised fair market value" }
      - { name: prior_lien_cents, type: integer, source: input, default: 0, description: "Senior liens ahead of this loan on the asset" }
      - { name: discounted_value_cents, type: integer, source: computed, description: "Net liquidation value: floor(appraised * asset discount) - prior_lien, floored at 0 (see collateral_coverage calc)" }

  - name: FormPackage
    parent: Application
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; the application this package documents" }
      - { name: form_1919_complete, type: boolean, source: input, default: false, description: "Borrower Information Form (SBA 1919) attested complete" }
      - { name: form_1920_complete, type: boolean, source: input, default: false, description: "Lender Application Form (SBA 1920) attested complete" }
      - { name: character_cleared, type: boolean, source: input, default: false, description: "Character/background determination cleared; decides the review branch" }
      - { name: status, type: enum, source: system, description: "Form package review status", constraints: "INCOMPLETE | SUBMITTED | CLEARED | FLAGGED" }

  - name: CreditMemo
    parent: Application
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; underwritten application" }
      - { name: authored_by_user_id, type: string, source: system, description: "X-User-ID of the LoanOfficer who authored the memo (segregation-of-duties anchor)" }
      - { name: dscr, type: number, source: input, description: "Debt-service-coverage ratio asserted by the underwriter (e.g. 1.35)" }
      - { name: risk_rating, type: integer, source: input, description: "Internal risk grade 1 (best) .. 8 (worst)", constraints: "1 <= risk_rating <= 8" }
      - { name: recommendation, type: enum, source: input, description: "Underwriter's recommendation", constraints: "APPROVE | DECLINE" }
      - { name: status, type: enum, source: system, description: "Credit memo lifecycle", constraints: "DRAFT | SUBMITTED | APPROVED | REJECTED" }

  - name: Disbursement
    parent: Application
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; loan being funded" }
      - { name: amount_cents, type: integer, source: input, description: "Advance amount for this draw" }
      - { name: tranche_label, type: string, source: input, description: "Free-text draw label, e.g. 'Initial' or 'Construction draw 2'" }
      - { name: draw_window_start_day, type: integer, source: input, description: "Inclusive start (day index from authorization) of this draw's funding window" }
      - { name: draw_window_end_day, type: integer, source: input, description: "EXCLUSIVE end (day index) of this draw's funding window; window is HALF-OPEN [start, end)" }
      - { name: status, type: enum, source: system, description: "Draw status", constraints: "REQUESTED | POSTED | REVERSED" }

  - name: GuarantySale
    parent: Application
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; loan whose guaranteed portion is sold" }
      - { name: lender_id, type: string, source: system, description: "FK -> Lender.id; selling lender (denormalized for pool accounting)" }
      - { name: investor_user_id, type: string, source: input, description: "X-User-ID of the InvestorServicer buying the guaranteed portion" }
      - { name: sold_principal_cents, type: integer, source: input, description: "Guaranteed principal being sold; must equal Application.guaranteed_amount_cents" }
      - { name: premium_bps, type: integer, source: input, description: "Price premium over par in basis points (e.g. 350 = 3.50% premium)", constraints: "0 <= premium_bps <= 1500" }
      - { name: premium_cents, type: integer, source: computed, default: 0, description: "Net premium credited to the lender after the SBA split (see secondary_market_premium calc)" }
      - { name: status, type: enum, source: system, description: "Sale lifecycle", constraints: "OFFERED | SETTLED | REPURCHASED" }

  - name: ServicingReport
    parent: Application
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; loan being serviced" }
      - { name: period_index, type: integer, source: input, description: "Monthly 1502 reporting period (0-based); equals period_start_month for single-month reports" }
      - { name: period_start_month, type: integer, source: input, description: "Inclusive first month of this report's coverage interval (0-based)" }
      - { name: period_end_month, type: integer, source: input, description: "INCLUSIVE last month covered; interval is CLOSED [start, end]; catch-up reports span >1 month" }
      - { name: principal_paid_cents, type: integer, source: input, description: "Principal collected from the borrower this period" }
      - { name: interest_paid_cents, type: integer, source: input, description: "Interest collected this period" }
      - { name: days_past_due, type: integer, source: input, default: 0, description: "Borrower days past due as of cutoff; drives delinquency/default transitions" }
      - { name: ongoing_fee_cents, type: integer, source: computed, default: 0, description: "SBA ongoing guaranty fee owed for this report, set on accept (see ongoing_fee calc)" }
      - { name: status, type: enum, source: system, description: "Report status", constraints: "PENDING | ACCEPTED | REJECTED" }

  - name: LiquidationEvent
    parent: Application
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; defaulted loan" }
      - { name: recovery_cents, type: integer, source: input, description: "Gross collateral liquidation proceeds recovered" }
      - { name: expense_cents, type: integer, source: input, default: 0, description: "Liquidation expenses deducted off the top before the guaranty split" }
      - { name: sba_share_cents, type: integer, source: computed, default: 0, description: "SBA's pro-rata share of net recovery, set on settle (see liquidation_split calc)" }
      - { name: lender_share_cents, type: integer, source: computed, default: 0, description: "Lender's pro-rata share of net recovery, set on settle (see liquidation_split calc)" }
      - { name: status, type: enum, source: system, description: "Liquidation status", constraints: "OPEN | SETTLED" }

  - name: GuarantyPurchase
    parent: Application
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; defaulted loan SBA is buying back" }
      - { name: requested_by_user_id, type: string, source: system, description: "X-User-ID of the LoanOfficer who filed the purchase request" }
      - { name: claimed_principal_cents, type: integer, source: input, description: "Outstanding guaranteed principal claimed from SBA" }
      - { name: repair_pct, type: number, source: input, default: 0, description: "Origination-defect repair fraction (0..1) SBA applies to reduce the payout", constraints: "0 <= repair_pct <= 1" }
      - { name: approved_amount_cents, type: integer, source: computed, default: 0, description: "Amount SBA approves to pay, net of recovery credit and repair, set on pay (see guaranty_purchase_payout calc)" }
      - { name: status, type: enum, source: system, description: "Purchase request status", constraints: "FILED | PAID | DENIED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  # Application — origination lifecycle (CYCLIC underwriting loop) plus TWO
  # parallel post-authorization dimensions (servicing_status x guaranty_status).
  # ---------------------------------------------------------------------------
  - entity: Application
    initial_state: DRAFT
    terminal_states: [WITHDRAWN, DECLINED, CLOSED]
    note: |
      `status` is the origination axis. After AUTHORIZED, two further axes evolve
      INDEPENDENTLY on the same row: `servicing_status` (NOT_SERVICING -> CURRENT ->
      DELINQUENT -> DEFAULTED -> LIQUIDATED / PAID_IN_FULL) and `guaranty_status`
      (RETAINED -> SOLD -> REPURCHASED; RETAINED/REPURCHASED -> PURCHASED_BY_SBA). A
      loan can be SOLD on the guaranty axis while DELINQUENT on the servicing axis.
      Transitions below are grouped by axis.
    transitions:
      # --- origination axis (status) ---
      - from: DRAFT
        to: UNDERWRITING
        trigger: "POST /sba/applications/{id}/submit"
        actor: LoanOfficer
        preconditions:
          - "Borrower.is_eligible_business_type == true, else ERR_INELIGIBLE_BUSINESS"
          - "At least one ProceedsLineItem exists, else ERR_NO_PROCEEDS"
          - "Sum of ProceedsLineItem.amount_cents == requested_amount_cents, else ERR_PROCEEDS_MISMATCH"
        side_effects:
          - "Run size_standard calc; set size_eligible"
          - "If size_eligible == false: reject with ERR_SIZE_STANDARD_EXCEEDED (no transition)"

      - from: PENDING_APPROVAL
        to: REVISION
        trigger: "POST /sba/applications/{id}/request-revision"
        actor: CreditApprover
        preconditions:
          - "A SUBMITTED CreditMemo exists for the application, else ERR_NO_CREDIT_MEMO"
        side_effects:
          - "Set the SUBMITTED CreditMemo.status = REJECTED"
        note: "Cycle entry: the committee sends a pending decision back for rework."

      - from: REVISION
        to: UNDERWRITING
        trigger: "POST /sba/applications/{id}/resubmit"
        actor: LoanOfficer
        preconditions:
          - "A DRAFT CreditMemo exists (revision authored), else ERR_NO_CREDIT_MEMO"
        side_effects: []
        note: "Cycle edge: REVISION -> UNDERWRITING reopens the credit-review loop, which can return to PENDING_APPROVAL via a fresh credit-memo submit."

      - from: UNDERWRITING
        to: PENDING_APPROVAL
        trigger: "POST /sba/credit-memos/{id}/submit"
        actor: LoanOfficer
        preconditions:
          - "The application's FormPackage.status == CLEARED, else ERR_FORM_PACKAGE_NOT_CLEARED"
          - "collateral_coverage coverage_ok == true for the maturity bucket, else ERR_COLLATERAL_SHORTFALL"
        side_effects:
          - "CreditMemo.status = SUBMITTED"

      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /sba/applications/{id}/approve"
        actor: CreditApprover
        preconditions:
          - "Acting CreditApprover X-User-ID != the SUBMITTED CreditMemo.authored_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "The SUBMITTED CreditMemo.recommendation == APPROVE, else ERR_MEMO_NOT_APPROVABLE"
        side_effects:
          - "CreditMemo.status = APPROVED"

      - from: PENDING_APPROVAL
        to: DECLINED
        trigger: "POST /sba/applications/{id}/decline"
        actor: CreditApprover
        preconditions:
          - "Acting CreditApprover X-User-ID != the SUBMITTED CreditMemo.authored_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "CreditMemo.status = REJECTED"

      - from: APPROVED
        to: AUTHORIZED
        trigger: "POST /sba/applications/{id}/authorize"
        actor: SbaOfficer
        preconditions:
          - "size_eligible == true, else ERR_SIZE_STANDARD_EXCEEDED"
        side_effects:
          - "Freeze guaranteed_amount_cents = guaranty_amount calc output"
          - "Freeze guaranty_fee_cents = guaranty_fee calc output"
          - "guaranty_status stays RETAINED; servicing_status stays NOT_SERVICING"

      - from: AUTHORIZED
        to: DISBURSING
        trigger: "system (first Disbursement reaches POSTED)"
        actor: system
        preconditions: []
        side_effects:
          - "servicing_status: NOT_SERVICING -> CURRENT"

      - from: DISBURSING
        to: CLOSED
        trigger: "POST /sba/applications/{id}/close"
        actor: LoanOfficer
        preconditions:
          - "disbursed_amount_cents == requested_amount_cents, else ERR_NOT_FULLY_DISBURSED"
        side_effects: []
        note: "CLOSED = origination axis complete; servicing/guaranty axes continue."

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /sba/applications/{id}/withdraw"
        actor: LoanOfficer
        preconditions: []
        side_effects: []

      - from: UNDERWRITING
        to: WITHDRAWN
        trigger: "POST /sba/applications/{id}/withdraw"
        actor: LoanOfficer
        preconditions: []
        side_effects: []

      - from: REVISION
        to: WITHDRAWN
        trigger: "POST /sba/applications/{id}/withdraw"
        actor: LoanOfficer
        preconditions: []
        side_effects: []

      # --- servicing axis (servicing_status); gated on origination AUTHORIZED+ ---
      - from: CURRENT
        to: DELINQUENT
        trigger: "system (accepted ServicingReport with days_past_due >= 60)"
        actor: system
        preconditions: []
        side_effects: []
        note: "servicing axis; origination status unchanged."

      - from: DELINQUENT
        to: CURRENT
        trigger: "system (accepted ServicingReport with days_past_due < 60)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Cure edge on the servicing axis."

      - from: DELINQUENT
        to: DEFAULTED
        trigger: "POST /sba/applications/{id}/declare-default"
        actor: LoanOfficer
        preconditions:
          - "Most-recent ACCEPTED ServicingReport.days_past_due >= 90, else ERR_NOT_DELINQUENT_ENOUGH"
        side_effects: []

      - from: DEFAULTED
        to: LIQUIDATED
        trigger: "POST /sba/liquidations/{id}/settle"
        actor: LoanOfficer
        preconditions:
          - "LiquidationEvent.status == OPEN, else ERR_INVALID_STATE"
        side_effects:
          - "Run liquidation_split calc; set sba_share_cents and lender_share_cents"
          - "LiquidationEvent.status = SETTLED"
          - "Reduce Application.outstanding_principal_cents by net_recovery (cascade hop 1; lowers the guaranty_purchase cap downstream)"

      - from: CURRENT
        to: PAID_IN_FULL
        trigger: "system (accepted ServicingReport drives outstanding_principal_cents to 0)"
        actor: system
        preconditions: []
        side_effects: []

      # --- guaranty axis (guaranty_status); gated on origination AUTHORIZED+ ---
      - from: RETAINED
        to: SOLD
        trigger: "POST /sba/guaranty-sales/{id}/settle"
        actor: InvestorServicer
        preconditions:
          - "GuarantySale.status == OFFERED, else ERR_INVALID_STATE"
          - "Application.status IN {AUTHORIZED, DISBURSING, CLOSED}, else ERR_GUARANTY_NOT_SELLABLE"
        side_effects:
          - "GuarantySale.status = SETTLED"
          - "Run secondary_market_premium calc; set GuarantySale.premium_cents"
          - "Application.sold_guaranteed_principal_cents = GuarantySale.sold_principal_cents"
          - "Lender.sold_guaranty_balance_cents += GuarantySale.sold_principal_cents (cross-aggregate cascade)"
          - "increments Application.version by 1 (OCC)"

      - from: SOLD
        to: REPURCHASED
        trigger: "POST /sba/guaranty-sales/{id}/repurchase"
        actor: LoanOfficer
        preconditions:
          - "GuarantySale.status == SETTLED, else ERR_INVALID_STATE"
        side_effects:
          - "GuarantySale.status = REPURCHASED"
          - "Application.sold_guaranteed_principal_cents = 0"
          - "Lender.sold_guaranty_balance_cents -= GuarantySale.sold_principal_cents (compensating; pool returns to pre-sale value)"

      - from: RETAINED
        to: PURCHASED_BY_SBA
        trigger: "POST /sba/guaranty-purchases/{id}/pay"
        actor: SbaOfficer
        preconditions:
          - "Application.servicing_status IN {DEFAULTED, LIQUIDATED}, else ERR_NOT_DEFAULTED"
          - "GuarantyPurchase.status == FILED, else ERR_INVALID_STATE"
        side_effects:
          - "Run guaranty_purchase_payout calc; set approved_amount_cents"
          - "GuarantyPurchase.status = PAID"

      - from: REPURCHASED
        to: PURCHASED_BY_SBA
        trigger: "POST /sba/guaranty-purchases/{id}/pay"
        actor: SbaOfficer
        preconditions:
          - "Application.servicing_status IN {DEFAULTED, LIQUIDATED}, else ERR_NOT_DEFAULTED"
          - "GuarantyPurchase.status == FILED, else ERR_INVALID_STATE"
        side_effects:
          - "Run guaranty_purchase_payout calc; set approved_amount_cents"
          - "GuarantyPurchase.status = PAID"

  # ---------------------------------------------------------------------------
  # FormPackage — BRANCHING review (SUBMITTED -> {CLEARED, FLAGGED}); FLAGGED loops
  # back to INCOMPLETE for correction. Divergent side-effect sets per branch.
  # ---------------------------------------------------------------------------
  - entity: FormPackage
    initial_state: INCOMPLETE
    terminal_states: []
    transitions:
      - from: INCOMPLETE
        to: SUBMITTED
        trigger: "POST /sba/form-packages/{id}/submit"
        actor: LoanOfficer
        preconditions:
          - "form_1919_complete == true AND form_1920_complete == true, else ERR_FORM_INCOMPLETE"
        side_effects: []

      - from: SUBMITTED
        to: CLEARED
        trigger: "POST /sba/form-packages/{id}/review"
        actor: CreditApprover
        preconditions:
          - "character_cleared == true (CLEARED branch)"
        side_effects: []
        note: "Branch A: unblocks credit-memo submit."

      - from: SUBMITTED
        to: FLAGGED
        trigger: "POST /sba/form-packages/{id}/review"
        actor: CreditApprover
        preconditions:
          - "character_cleared == false (FLAGGED branch)"
        side_effects: []
        note: "Branch B: divergent — FLAGGED keeps credit-memo submit blocked."

      - from: FLAGGED
        to: INCOMPLETE
        trigger: "POST /sba/form-packages/{id}/reopen"
        actor: LoanOfficer
        preconditions: []
        side_effects: []
        note: "Correction loop back to INCOMPLETE."

  # ---------------------------------------------------------------------------
  # Disbursement — linear draw with reversal.
  # ---------------------------------------------------------------------------
  - entity: Disbursement
    initial_state: REQUESTED
    terminal_states: [REVERSED]
    transitions:
      - from: REQUESTED
        to: POSTED
        trigger: "POST /sba/disbursements/{id}/post"
        actor: LoanOfficer
        preconditions:
          - "Application.status IN {AUTHORIZED, DISBURSING}, else ERR_NOT_AUTHORIZED_FOR_DISBURSAL"
          - "disbursed_amount_cents + amount_cents <= requested_amount_cents, else ERR_OVER_DISBURSEMENT"
          - "This draw's HALF-OPEN window [draw_window_start_day, draw_window_end_day) must not overlap any other POSTED draw's window on this Application; touching endpoints (one window's end_day == another's start_day) do NOT overlap, else ERR_DRAW_WINDOW_OVERLAP"
        side_effects:
          - "Application.disbursed_amount_cents += amount_cents"
          - "Application.outstanding_principal_cents += amount_cents (cascade hop 1)"
          - "If this is the first POSTED draw: Application.status AUTHORIZED -> DISBURSING and servicing_status NOT_SERVICING -> CURRENT (cascade hop 2)"

      - from: POSTED
        to: REVERSED
        trigger: "POST /sba/disbursements/{id}/reverse"
        actor: LoanOfficer
        preconditions:
          - "Application.servicing_status NOT IN {DEFAULTED, LIQUIDATED}, else ERR_INVALID_STATE"
        side_effects:
          - "Application.disbursed_amount_cents -= amount_cents (compensating)"
          - "Application.outstanding_principal_cents -= amount_cents (compensating)"

  # ---------------------------------------------------------------------------
  # ServicingReport — linear accept/reject; accept drives the Application
  # servicing axis and accrues the ongoing fee into the lender pool.
  # ---------------------------------------------------------------------------
  - entity: ServicingReport
    initial_state: PENDING
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /sba/servicing-reports/{id}/accept"
        actor: SbaOfficer
        preconditions:
          - "CLOSED interval [period_start_month, period_end_month] contiguous & non-overlapping with prior ACCEPTED: period_start_month == max ACCEPTED period_end_month + 1 (0 if first), else ERR_PERIOD_OUT_OF_ORDER"
          - "principal_paid_cents <= Application.outstanding_principal_cents, else ERR_PRINCIPAL_OVERPAY"
        side_effects:
          - "Run ongoing_fee calc on outstanding BEFORE this report; set ServicingReport.ongoing_fee_cents"
          - "Lender.ongoing_fee_pool_cents += ongoing_fee_cents (cascade hop 1)"
          - "Application.outstanding_principal_cents -= principal_paid_cents (cascade hop 2)"
          - "Re-evaluate servicing_status: CURRENT<->DELINQUENT on days_past_due 60 threshold; -> PAID_IN_FULL if outstanding hits 0 (cascade hop 3)"

      - from: PENDING
        to: REJECTED
        trigger: "POST /sba/servicing-reports/{id}/reject"
        actor: SbaOfficer
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: guaranty-sale-settle-stale-application
    parent_entity: Application
    write_endpoint: "POST /sba/guaranty-sales/{id}/settle"
    occ_field: "expected_application_version"
    description: |
      Settling a GuarantySale supersedes any prior OFFERED sale on the same
      Application by writing sold_guaranteed_principal_cents and bumping the
      Application version. A settle whose expected_application_version is older
      than the Application's current version is rejected as stale: another writer
      has already settled a sale (legitimately superseding the prior offer) and
      this writer's view of the loan is out of date.
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: size_standard
    trigger: "Application submit (DRAFT -> UNDERWRITING)"
    algorithm: threshold
    formula: |
      # Alternative size standard: PASS if EITHER prong holds.
      financial_ok = (tangible_net_worth_cents <= TNW_CAP) and (avg_net_income_cents <= NET_INCOME_CAP)
      headcount_ok = (affiliate_employee_count <= EMPLOYEE_CAP)
      size_eligible = financial_ok or headcount_ok
      # Boundary: all caps are INCLUSIVE (<=). At exactly the cap the prong PASSES.
    input_set: "The submitting Application's Borrower fields only."
    constants:
      TNW_CAP: 2000000000        # $20,000,000 tangible net worth ceiling (cents)
      NET_INCOME_CAP: 650000000  # $6,500,000 average net income ceiling (cents)
      EMPLOYEE_CAP: 500          # 500-employee headcount ceiling
    precision: "integer cents; boolean output"

  - name: collateral_coverage
    trigger: "CreditMemo submit (UNDERWRITING -> PENDING_APPROVAL) precondition check"
    algorithm: aggregation
    formula: |
      # Per-item net liquidation value (FLOOR per item), then SUM, then compare to a
      # maturity-dependent requirement (round-per-item-then-sum order is PINNED).
      for each CollateralItem:
        discounted_value_cents = max(0, floor(appraised_value_cents * ASSET_DISCOUNT[asset_type]) - prior_lien_cents)
      total_discounted = sum(discounted_value_cents over all CollateralItems)
      if Application.maturity_months > 120:
        required = Application.requested_amount_cents              # long-term: 100% net coverage
      else:
        required = floor(Application.requested_amount_cents * SHORT_TERM_COVERAGE)  # 50%
      coverage_ok = (total_discounted >= required)                 # boundary INCLUSIVE (>=)
    input_set: "All CollateralItem rows on the Application; maturity_months and requested_amount_cents from the Application."
    constants:
      ASSET_DISCOUNT: { REAL_ESTATE: 0.80, EQUIPMENT: 0.50, INVENTORY: 0.30, RECEIVABLES: 0.50 }
      SHORT_TERM_COVERAGE: 0.50
    precision: "integer cents; FLOOR per item BEFORE summing (round-per-item-then-sum, NOT sum-then-round)"

  - name: guaranty_amount
    trigger: "Application authorize (APPROVED -> AUTHORIZED) side effect"
    algorithm: threshold
    formula: |
      guaranteed_amount_cents = round_half_up(requested_amount_cents * guaranty_pct)
    input_set: "The Application's requested_amount_cents and guaranty_pct."
    precision: "integer cents, round_half_up"

  - name: guaranty_fee
    trigger: "Application authorize (APPROVED -> AUTHORIZED) side effect"
    algorithm: tiered_pricing
    formula: |
      # Upfront SBA guaranty fee: a MARGINAL TIERED rate selected by the GROSS
      # requested amount, applied to the GUARANTEED slice of each gross band.
      # Evaluation order is PINNED: floor each band's fee, THEN sum.
      g = requested_amount_cents
      gp = guaranty_pct
      band1 = min(g, TIER1_CENTS)
      band2 = min(max(g - TIER1_CENTS, 0), TIER2_CENTS - TIER1_CENTS)
      band3 = max(g - TIER2_CENTS, 0)
      guaranty_fee_cents = floor(band1 * gp * RATE1) + floor(band2 * gp * RATE2) + floor(band3 * gp * RATE3)
      # Boundary: gross EXACTLY at TIER1_CENTS stays wholly in band1 (RATE1); the
      # first dollar ABOVE the threshold is the first to attract RATE2.
    input_set: "The Application's requested_amount_cents and guaranty_pct, frozen at AUTHORIZED."
    constants:
      TIER1_CENTS: 15000000   # $150,000
      TIER2_CENTS: 70000000   # $700,000
      RATE1: 0.02             # 2.00% on the guaranteed slice of band 1
      RATE2: 0.03             # 3.00% on band 2
      RATE3: 0.035            # 3.50% on band 3
    precision: "integer cents; FLOOR per band THEN sum (round-per-band-then-sum order is PINNED)"
    variants:
      - name: gross_fee
        when: "At AUTHORIZED before any secondary-market sale"
        difference: "Fee billed on the full guaranteed portion as above."
      - name: net_of_secondary_credit
        when: "Tempting (WRONG) interpretation when a SETTLED GuarantySale exists"
        difference: "Selling the guaranty on the secondary market does NOT rebate or reduce the upfront guaranty fee; the AUTHORIZED-frozen guaranty_fee_cents is unchanged by any later sale. This variant is documented to PIN that the fee is sale-independent."

  - name: secondary_market_premium
    trigger: "GuarantySale settle (RETAINED -> SOLD) side effect"
    algorithm: tiered_pricing
    formula: |
      # THREE inputs (sold_principal, premium_bps, SBA split) interact non-linearly
      # via a conditional branch at the lender-retained premium floor.
      gross_premium = floor(sold_principal_cents * premium_bps / 10000)
      lender_retained = floor(sold_principal_cents * LENDER_RETAINED_BPS / 10000)
      if gross_premium <= lender_retained:
        sba_cut = 0
      else:
        sba_cut = floor((gross_premium - lender_retained) * SBA_SPLIT)
      premium_cents = gross_premium - sba_cut   # net premium credited to the lender
    input_set: "The GuarantySale's sold_principal_cents and premium_bps."
    constants:
      LENDER_RETAINED_BPS: 100   # lender always keeps premium up to 1.00% of par
      SBA_SPLIT: 0.50            # SBA takes 50% of premium ABOVE the retained floor
    precision: "integer cents; FLOOR at each step in the pinned order above"

  - name: liquidation_split
    trigger: "Liquidation settle (DEFAULTED -> LIQUIDATED) side effect"
    algorithm: waterfall_allocation
    formula: |
      # Waterfall: subtract expense off the top, then split net pro-rata to the
      # guaranty percentage. SBA share rounds; lender takes the remainder.
      net_recovery = max(0, recovery_cents - expense_cents)
      sba_share_cents = round_half_up(net_recovery * Application.guaranty_pct)
      lender_share_cents = net_recovery - sba_share_cents
      # INVARIANT: sba_share_cents + lender_share_cents == net_recovery exactly.
    input_set: "The LiquidationEvent's recovery_cents/expense_cents and the Application's guaranty_pct."
    precision: "integer cents; round_half_up on SBA share, lender takes the remainder (conserves net_recovery)"

  - name: guaranty_purchase_payout
    trigger: "GuarantyPurchase pay (-> PURCHASED_BY_SBA) side effect"
    algorithm: aggregation
    formula: |
      # SBA pays the lesser of (claimed) and (guaranty_pct of current outstanding),
      # reduced by liquidation recovery already credited to SBA, then by the repair
      # fraction. Two variants: clean (repair_pct == 0) vs repaired (repair_pct > 0).
      cap = round_half_up(Application.outstanding_principal_cents * Application.guaranty_pct)
      base = min(claimed_principal_cents, cap)
      sba_recovery_credit = sum(LiquidationEvent.sba_share_cents for SETTLED liquidations on this Application)
      after_recovery = max(0, base - sba_recovery_credit)
      approved_amount_cents = floor(after_recovery * (1 - repair_pct))
    input_set: "claimed_principal_cents and repair_pct on the GuarantyPurchase; outstanding_principal_cents and guaranty_pct on the Application; SETTLED LiquidationEvent.sba_share_cents."
    constants: {}
    precision: "integer cents; round_half_up on cap, floor on the repair reduction"
    variants:
      - name: clean_payout
        when: "repair_pct == 0 and no prior settled liquidation"
        difference: "approved = min(claimed, cap); SBA pays the full capped claim."
      - name: repaired_payout
        when: "repair_pct > 0 and/or a SETTLED liquidation credited SBA"
        difference: "approved = floor((min(claimed, cap) - sba_recovery_credit) * (1 - repair_pct)); both deductions stack, repair applied LAST."

  - name: ongoing_fee
    trigger: "ServicingReport accept (PENDING -> ACCEPTED) side effect"
    algorithm: aggregation
    formula: |
      # Monthly ongoing (servicing) guaranty fee = annual rate on the guaranteed
      # portion of outstanding principal AT REPORT TIME / 12, using outstanding
      # BEFORE this report's principal_paid is applied.
      guaranteed_outstanding = round_half_up(Application.outstanding_principal_cents * Application.guaranty_pct)
      ongoing_fee_cents = floor(guaranteed_outstanding * ANNUAL_ONGOING_RATE / 12)
    input_set: "Application.outstanding_principal_cents (pre-this-report) and guaranty_pct."
    constants:
      ANNUAL_ONGOING_RATE: 0.0055   # 0.55% per annum
    precision: "integer cents; round_half_up on guaranteed_outstanding then FLOOR on the monthly fee"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "Path resource ids exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: business_constraint
    check: "Body well-formed: required fields present, no negative/zero where positive required, enum members valid, FK targets exist"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all write endpoints

  - priority: 5
    category: state
    check: "Target resource is in a state from which this transition is allowed"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 6
    category: business_safety
    check: "Borrower business type must be eligible before any underwriting work"
    error_id: ERR_INELIGIBLE_BUSINESS
    http_status: 409
    applies_to: "Application submit"

  - priority: 7
    category: business_safety
    check: "Application must pass the size standard before authorization"
    error_id: ERR_SIZE_STANDARD_EXCEEDED
    http_status: 409
    applies_to: "Application submit, Application authorize"

  - priority: 8
    category: business_safety
    check: "Approver/decliner X-User-ID must differ from the CreditMemo author (four-eyes)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "Application approve, Application decline"

  - priority: 9
    category: business_referential
    check: "FormPackage must be CLEARED before a credit memo can be submitted"
    error_id: ERR_FORM_PACKAGE_NOT_CLEARED
    http_status: 409
    applies_to: "CreditMemo submit"

  - priority: 10
    category: business_constraint
    check: "Discounted collateral coverage must meet the maturity-bucket requirement"
    error_id: ERR_COLLATERAL_SHORTFALL
    http_status: 409
    applies_to: "CreditMemo submit"

  - priority: 11
    category: business_temporal
    check: "ServicingReport CLOSED interval [period_start_month, period_end_month] must be contiguous & non-overlapping with the prior ACCEPTED interval: period_start_month == prior accepted period_end_month + 1 (0 if first)"
    error_id: ERR_PERIOD_OUT_OF_ORDER
    http_status: 409
    applies_to: "ServicingReport accept"

  - priority: 12
    category: business_temporal
    check: "Disbursement HALF-OPEN window [draw_window_start_day, draw_window_end_day) must not overlap any other POSTED draw's window on the same Application; touching endpoints (end_day == start_day) do not overlap"
    error_id: ERR_DRAW_WINDOW_OVERLAP
    http_status: 409
    applies_to: "Disbursement post"

  - priority: 13
    category: business_fiscal
    check: "A disbursement must not push cumulative disbursed above the requested amount"
    error_id: ERR_OVER_DISBURSEMENT
    http_status: 409
    applies_to: "Disbursement post"

  - priority: 14
    category: business_fiscal
    check: "Reported principal_paid must not exceed current outstanding principal"
    error_id: ERR_PRINCIPAL_OVERPAY
    http_status: 422
    applies_to: "ServicingReport accept"

  - priority: 15
    category: business_constraint
    check: "GuarantySale.sold_principal_cents must equal Application.guaranteed_amount_cents"
    error_id: ERR_SALE_PRINCIPAL_MISMATCH
    http_status: 422
    applies_to: "GuarantySale create"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Lender ---
  - method: POST
    path: "/sba/lenders"
    description: "Create a Lender (bank or CDC)"
    roles: [SbaOfficer]
    code: 201
    input: [name, program]
    output: Lender
    side_effects: ["ongoing_fee_pool_cents=0, sold_guaranty_balance_cents=0"]

  - method: GET
    path: "/sba/lenders/{lenderId}"
    description: "Get a Lender (includes pool balances)"
    roles: [SbaOfficer, LoanOfficer, CreditApprover, InvestorServicer]
    code: 200
    input: []
    output: Lender
    side_effects: []

  # --- Borrower ---
  - method: POST
    path: "/sba/borrowers"
    description: "Create a Borrower under a Lender"
    roles: [LoanOfficer]
    code: 201
    input: [lender_id, legal_name, naics_code, tangible_net_worth_cents, avg_net_income_cents, affiliate_employee_count, "is_eligible_business_type?"]
    output: Borrower
    side_effects: []

  - method: GET
    path: "/sba/borrowers/{borrowerId}"
    description: "Get a Borrower"
    roles: [SbaOfficer, LoanOfficer, CreditApprover]
    code: 200
    input: []
    output: Borrower
    side_effects: []

  - method: GET
    path: "/sba/lenders/{id}/borrowers"
    description: "List a Lender's Borrowers (sub-resource — reverse-reachability for Borrower.lender_id)"
    roles: [SbaOfficer, LoanOfficer, CreditApprover]
    code: 200
    input: []
    output: "Borrower[]"
    side_effects: []

  # --- Application ---
  - method: POST
    path: "/sba/applications"
    description: "Create a DRAFT Application for a Borrower"
    roles: [LoanOfficer]
    code: 201
    input: [borrower_id, requested_amount_cents, guaranty_pct, maturity_months]
    output: Application
    side_effects: ["status=DRAFT, servicing_status=NOT_SERVICING, guaranty_status=RETAINED", "lender_id copied from Borrower"]

  - method: GET
    path: "/sba/applications/{applicationId}"
    description: "Get an Application (all computed balances and the three status axes)"
    roles: [SbaOfficer, LoanOfficer, CreditApprover, InvestorServicer]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: GET
    path: "/sba/applications"
    description: "List Applications (filter by lender_id / borrower_id / status — reverse-reachability for Application.lender_id and Application.borrower_id)"
    roles: [SbaOfficer, LoanOfficer, CreditApprover]
    code: 200
    input: ["lender_id?", "borrower_id?", "status?"]
    output: "Application[]"
    side_effects: []

  - method: POST
    path: "/sba/applications/{applicationId}/submit"
    description: "Submit a DRAFT Application into underwriting; runs the size standard"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: Application
    side_effects: ["Run size_standard; set size_eligible", "status DRAFT -> UNDERWRITING", "ERR_SIZE_STANDARD_EXCEEDED if ineligible"]

  - method: POST
    path: "/sba/applications/{applicationId}/request-revision"
    description: "Approver sends a pending application back for revision (cycle entry)"
    roles: [CreditApprover]
    code: 200
    input: []
    output: Application
    side_effects: ["status PENDING_APPROVAL -> REVISION", "SUBMITTED CreditMemo -> REJECTED"]

  - method: POST
    path: "/sba/applications/{applicationId}/resubmit"
    description: "Officer resubmits a revised application (cycle edge back into underwriting)"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: Application
    side_effects: ["status REVISION -> UNDERWRITING"]

  - method: POST
    path: "/sba/applications/{applicationId}/approve"
    description: "CreditApprover approves the submitted memo (four-eyes enforced)"
    roles: [CreditApprover]
    code: 200
    input: []
    output: Application
    side_effects: ["status PENDING_APPROVAL -> APPROVED", "CreditMemo -> APPROVED", "ERR_SEGREGATION_OF_DUTIES if approver == author"]

  - method: POST
    path: "/sba/applications/{applicationId}/decline"
    description: "CreditApprover declines the application"
    roles: [CreditApprover]
    code: 200
    input: []
    output: Application
    side_effects: ["status PENDING_APPROVAL -> DECLINED", "CreditMemo -> REJECTED"]

  - method: POST
    path: "/sba/applications/{applicationId}/authorize"
    description: "SBA authorizes the loan; freezes guaranteed amount and guaranty fee"
    roles: [SbaOfficer]
    code: 200
    input: []
    output: Application
    side_effects: ["status APPROVED -> AUTHORIZED", "Freeze guaranteed_amount_cents (guaranty_amount calc)", "Freeze guaranty_fee_cents (guaranty_fee calc)"]

  - method: POST
    path: "/sba/applications/{applicationId}/close"
    description: "Close origination once fully disbursed"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: Application
    side_effects: ["status DISBURSING -> CLOSED", "ERR_NOT_FULLY_DISBURSED if disbursed < requested"]

  - method: POST
    path: "/sba/applications/{applicationId}/withdraw"
    description: "Withdraw an application (DRAFT/UNDERWRITING/REVISION)"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: Application
    side_effects: ["status -> WITHDRAWN"]

  - method: POST
    path: "/sba/applications/{applicationId}/declare-default"
    description: "Declare default on a delinquent loan (servicing axis)"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: Application
    side_effects: ["servicing_status DELINQUENT -> DEFAULTED", "ERR_NOT_DELINQUENT_ENOUGH if last accepted report days_past_due < 90"]

  # --- ProceedsLineItem ---
  - method: POST
    path: "/sba/proceeds"
    description: "Add a use-of-proceeds line item (Application must be DRAFT)"
    roles: [LoanOfficer]
    code: 201
    input: [application_id, use_category, amount_cents]
    output: ProceedsLineItem
    side_effects: ["is_fixed_asset computed from use_category"]

  - method: GET
    path: "/sba/applications/{id}/proceeds"
    description: "List an Application's proceeds line items (sub-resource — reverse-reachability for ProceedsLineItem.application_id)"
    roles: [SbaOfficer, LoanOfficer, CreditApprover]
    code: 200
    input: []
    output: "ProceedsLineItem[]"
    side_effects: []

  # --- CollateralItem ---
  - method: POST
    path: "/sba/collateral"
    description: "Add a collateral item (Application DRAFT/UNDERWRITING/REVISION)"
    roles: [LoanOfficer]
    code: 201
    input: [application_id, asset_type, appraised_value_cents, "prior_lien_cents?"]
    output: CollateralItem
    side_effects: ["discounted_value_cents computed per collateral_coverage per-item rule"]

  - method: GET
    path: "/sba/applications/{id}/collateral"
    description: "List an Application's collateral items (sub-resource — reverse-reachability for CollateralItem.application_id)"
    roles: [SbaOfficer, LoanOfficer, CreditApprover]
    code: 200
    input: []
    output: "CollateralItem[]"
    side_effects: []

  # --- FormPackage ---
  - method: POST
    path: "/sba/form-packages"
    description: "Create the SBA form package (1919/1920) for an application"
    roles: [LoanOfficer]
    code: 201
    input: [application_id, "form_1919_complete?", "form_1920_complete?", "character_cleared?"]
    output: FormPackage
    side_effects: ["status=INCOMPLETE"]

  - method: GET
    path: "/sba/applications/{id}/form-packages"
    description: "List an Application's form packages (sub-resource — reverse-reachability for FormPackage.application_id)"
    roles: [SbaOfficer, LoanOfficer, CreditApprover]
    code: 200
    input: []
    output: "FormPackage[]"
    side_effects: []

  - method: POST
    path: "/sba/form-packages/{formPackageId}/submit"
    description: "Submit a form package for review"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: FormPackage
    side_effects: ["status INCOMPLETE -> SUBMITTED", "ERR_FORM_INCOMPLETE if 1919/1920 not complete"]

  - method: POST
    path: "/sba/form-packages/{formPackageId}/review"
    description: "Review a submitted package; branches to CLEARED or FLAGGED on character_cleared"
    roles: [CreditApprover]
    code: 200
    input: []
    output: FormPackage
    side_effects: ["status SUBMITTED -> CLEARED (character_cleared) or -> FLAGGED"]

  - method: POST
    path: "/sba/form-packages/{formPackageId}/reopen"
    description: "Reopen a FLAGGED package for correction (loop back to INCOMPLETE)"
    roles: [LoanOfficer]
    code: 200
    input: ["character_cleared?"]
    output: FormPackage
    side_effects: ["status FLAGGED -> INCOMPLETE; optionally clear the character flag"]

  # --- CreditMemo ---
  - method: POST
    path: "/sba/credit-memos"
    description: "Author a DRAFT credit memo (records the authoring LoanOfficer)"
    roles: [LoanOfficer]
    code: 201
    input: [application_id, dscr, risk_rating, recommendation]
    output: CreditMemo
    side_effects: ["status=DRAFT", "authored_by_user_id = X-User-ID"]

  - method: GET
    path: "/sba/applications/{id}/credit-memos"
    description: "List an Application's credit memos (sub-resource — reverse-reachability for CreditMemo.application_id)"
    roles: [SbaOfficer, LoanOfficer, CreditApprover]
    code: 200
    input: []
    output: "CreditMemo[]"
    side_effects: []

  - method: POST
    path: "/sba/credit-memos/{creditMemoId}/submit"
    description: "Submit a credit memo, moving the application to PENDING_APPROVAL"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: CreditMemo
    side_effects: ["CreditMemo -> SUBMITTED", "status UNDERWRITING -> PENDING_APPROVAL", "Enforces FormPackage CLEARED and collateral coverage"]

  # --- Disbursement ---
  - method: POST
    path: "/sba/disbursements"
    description: "Request a disbursement draw (Application AUTHORIZED/DISBURSING)"
    roles: [LoanOfficer]
    code: 201
    input: [application_id, amount_cents, tranche_label, draw_window_start_day, draw_window_end_day]
    output: Disbursement
    side_effects: ["status=REQUESTED"]

  - method: GET
    path: "/sba/applications/{id}/disbursements"
    description: "List an Application's disbursements (sub-resource — reverse-reachability for Disbursement.application_id)"
    roles: [SbaOfficer, LoanOfficer, CreditApprover]
    code: 200
    input: []
    output: "Disbursement[]"
    side_effects: []

  - method: POST
    path: "/sba/disbursements/{disbursementId}/post"
    description: "Post (fund) a disbursement; the first POSTED draw starts servicing"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["status REQUESTED -> POSTED", "disbursed_amount_cents += amount", "outstanding_principal_cents += amount", "first draw: Application AUTHORIZED -> DISBURSING, servicing_status -> CURRENT"]

  - method: POST
    path: "/sba/disbursements/{disbursementId}/reverse"
    description: "Reverse a posted disbursement (compensating)"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["status POSTED -> REVERSED", "disbursed_amount_cents -= amount", "outstanding_principal_cents -= amount"]

  # --- GuarantySale (secondary market) ---
  - method: POST
    path: "/sba/guaranty-sales"
    description: "Offer the guaranteed portion to an investor on the secondary market"
    roles: [LoanOfficer]
    code: 201
    input: [application_id, investor_user_id, sold_principal_cents, premium_bps]
    output: GuarantySale
    side_effects: ["status=OFFERED", "lender_id copied from Application", "ERR_SALE_PRINCIPAL_MISMATCH if sold_principal != guaranteed_amount_cents"]

  - method: GET
    path: "/sba/applications/{id}/guaranty-sales"
    description: "List an Application's guaranty sales (sub-resource — reverse-reachability for GuarantySale.application_id)"
    roles: [SbaOfficer, LoanOfficer, CreditApprover, InvestorServicer]
    code: 200
    input: []
    output: "GuarantySale[]"
    side_effects: []

  - method: GET
    path: "/sba/lenders/{id}/guaranty-sales"
    description: "List a Lender's guaranty sales (sub-resource — reverse-reachability for GuarantySale.lender_id)"
    roles: [SbaOfficer, LoanOfficer, CreditApprover, InvestorServicer]
    code: 200
    input: []
    output: "GuarantySale[]"
    side_effects: []

  - method: POST
    path: "/sba/guaranty-sales/{saleId}/settle"
    description: "Investor settles the sale (OCC on Application.version); credits net premium, debits lender pool"
    roles: [InvestorServicer]
    code: 200
    input: [expected_application_version]
    output: GuarantySale
    side_effects: ["status OFFERED -> SETTLED", "guaranty_status RETAINED -> SOLD", "premium_cents = secondary_market_premium calc", "Application.sold_guaranteed_principal_cents set", "Lender.sold_guaranty_balance_cents += sold_principal", "increments Application.version by 1"]

  - method: POST
    path: "/sba/guaranty-sales/{saleId}/repurchase"
    description: "Lender repurchases the sold guaranty (compensating; restores pool)"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: GuarantySale
    side_effects: ["status SETTLED -> REPURCHASED", "guaranty_status SOLD -> REPURCHASED", "Application.sold_guaranteed_principal_cents = 0", "Lender.sold_guaranty_balance_cents -= sold_principal"]

  # --- ServicingReport (1502) ---
  - method: POST
    path: "/sba/servicing-reports"
    description: "File a monthly (or catch-up) 1502 servicing report (PENDING)"
    roles: [LoanOfficer]
    code: 201
    input: [application_id, period_index, period_start_month, period_end_month, principal_paid_cents, interest_paid_cents, "days_past_due?"]
    output: ServicingReport
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/sba/applications/{id}/servicing-reports"
    description: "List an Application's servicing reports (sub-resource — reverse-reachability for ServicingReport.application_id)"
    roles: [SbaOfficer, LoanOfficer, CreditApprover]
    code: 200
    input: []
    output: "ServicingReport[]"
    side_effects: []

  - method: POST
    path: "/sba/servicing-reports/{reportId}/accept"
    description: "SBA accepts a 1502 report; accrues ongoing fee, reduces principal, evaluates servicing axis"
    roles: [SbaOfficer]
    code: 200
    input: []
    output: ServicingReport
    side_effects: ["status PENDING -> ACCEPTED", "ongoing_fee_cents = ongoing_fee calc", "Lender.ongoing_fee_pool_cents += ongoing_fee", "outstanding_principal_cents -= principal_paid", "servicing_status re-evaluated"]

  - method: POST
    path: "/sba/servicing-reports/{reportId}/reject"
    description: "SBA rejects a 1502 report"
    roles: [SbaOfficer]
    code: 200
    input: []
    output: ServicingReport
    side_effects: ["status PENDING -> REJECTED"]

  # --- LiquidationEvent ---
  - method: POST
    path: "/sba/liquidations"
    description: "Open a liquidation event on a defaulted loan"
    roles: [LoanOfficer]
    code: 201
    input: [application_id, recovery_cents, "expense_cents?"]
    output: LiquidationEvent
    side_effects: ["status=OPEN", "ERR_NOT_DEFAULTED if servicing_status != DEFAULTED"]

  - method: GET
    path: "/sba/applications/{id}/liquidations"
    description: "List an Application's liquidation events (sub-resource — reverse-reachability for LiquidationEvent.application_id)"
    roles: [SbaOfficer, LoanOfficer, CreditApprover]
    code: 200
    input: []
    output: "LiquidationEvent[]"
    side_effects: []

  - method: POST
    path: "/sba/liquidations/{liquidationId}/settle"
    description: "Settle the liquidation; splits net recovery between SBA and lender"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: LiquidationEvent
    side_effects: ["status OPEN -> SETTLED", "servicing_status DEFAULTED -> LIQUIDATED", "sba_share_cents/lender_share_cents = liquidation_split calc", "outstanding_principal_cents reduced by net_recovery"]

  # --- GuarantyPurchase ---
  - method: POST
    path: "/sba/guaranty-purchases"
    description: "File a guaranty purchase request to SBA (current guaranty holder)"
    roles: [LoanOfficer]
    code: 201
    input: [application_id, claimed_principal_cents, "repair_pct?"]
    output: GuarantyPurchase
    side_effects: ["status=FILED", "requested_by_user_id = X-User-ID", "ERR_NOT_DEFAULTED if servicing_status not in {DEFAULTED, LIQUIDATED}"]

  - method: GET
    path: "/sba/applications/{id}/guaranty-purchases"
    description: "List an Application's guaranty purchase requests (sub-resource — reverse-reachability for GuarantyPurchase.application_id)"
    roles: [SbaOfficer, LoanOfficer, CreditApprover]
    code: 200
    input: []
    output: "GuarantyPurchase[]"
    side_effects: []

  - method: POST
    path: "/sba/guaranty-purchases/{purchaseId}/pay"
    description: "SBA pays a guaranty purchase (applies recovery credit and repair)"
    roles: [SbaOfficer]
    code: 200
    input: []
    output: GuarantyPurchase
    side_effects: ["status FILED -> PAID", "approved_amount_cents = guaranty_purchase_payout calc", "guaranty_status -> PURCHASED_BY_SBA"]

  - method: POST
    path: "/sba/guaranty-purchases/{purchaseId}/deny"
    description: "SBA denies a guaranty purchase request"
    roles: [SbaOfficer]
    code: 200
    input: []
    output: GuarantyPurchase
    side_effects: ["status FILED -> DENIED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth / existence / request ---
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing or malformed"
  - id: ERR_FORBIDDEN_FOR_ROLE
    http: 403
    condition: "Caller role is valid but not permitted for this endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path resource id does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, negative/zero amount, invalid enum, or unknown FK target"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource is not in a state from which the requested transition is allowed"

  # --- eligibility / size ---
  - id: ERR_INELIGIBLE_BUSINESS
    http: 409
    condition: "Borrower.is_eligible_business_type is false at submit"
  - id: ERR_SIZE_STANDARD_EXCEEDED
    http: 409
    condition: "Application fails both prongs of the alternative size standard"
  - id: ERR_NO_PROCEEDS
    http: 409
    condition: "Submit attempted with no ProceedsLineItem rows"
  - id: ERR_PROCEEDS_MISMATCH
    http: 422
    condition: "Sum of ProceedsLineItem.amount_cents != Application.requested_amount_cents"

  # --- form package / underwriting ---
  - id: ERR_FORM_INCOMPLETE
    http: 409
    condition: "Form package submit attempted while 1919 or 1920 not marked complete"
  - id: ERR_FORM_PACKAGE_NOT_CLEARED
    http: 409
    condition: "Credit memo submit attempted while the FormPackage is not CLEARED"
  - id: ERR_COLLATERAL_SHORTFALL
    http: 409
    condition: "Discounted collateral coverage below the maturity-bucket requirement"
  - id: ERR_NO_CREDIT_MEMO
    http: 409
    condition: "Revision/resubmit requires a credit memo in the expected state and none exists"
  - id: ERR_MEMO_NOT_APPROVABLE
    http: 409
    condition: "Approve attempted on a memo whose recommendation is DECLINE"

  # --- segregation of duties ---
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "Approver/decliner X-User-ID equals the credit-memo author"

  # --- disbursement / closing ---
  - id: ERR_NOT_AUTHORIZED_FOR_DISBURSAL
    http: 409
    condition: "Disbursement post attempted while application not AUTHORIZED/DISBURSING"
  - id: ERR_DRAW_WINDOW_OVERLAP
    http: 409
    condition: "Draw's half-open funding window [start_day, end_day) overlaps another POSTED draw's window on the same application"
  - id: ERR_OVER_DISBURSEMENT
    http: 409
    condition: "Posting would push cumulative disbursed above requested_amount_cents"
  - id: ERR_NOT_FULLY_DISBURSED
    http: 409
    condition: "Close attempted while disbursed_amount_cents < requested_amount_cents"

  # --- secondary market ---
  - id: ERR_SALE_PRINCIPAL_MISMATCH
    http: 422
    condition: "GuarantySale.sold_principal_cents != Application.guaranteed_amount_cents"
  - id: ERR_GUARANTY_NOT_SELLABLE
    http: 409
    condition: "Guaranty sale settle attempted while application status not AUTHORIZED/DISBURSING/CLOSED"
  - id: ERR_STALE_APPLICATION_VERSION
    http: 412
    condition: "expected_application_version older than current Application.version on a guaranty-sale settle"

  # --- servicing / 1502 ---
  - id: ERR_PERIOD_OUT_OF_ORDER
    http: 409
    condition: "ServicingReport accept where the coverage interval is not contiguous with the prior accepted interval"
  - id: ERR_PRINCIPAL_OVERPAY
    http: 422
    condition: "Reported principal_paid_cents exceeds outstanding_principal_cents"

  # --- default / liquidation / purchase ---
  - id: ERR_NOT_DELINQUENT_ENOUGH
    http: 409
    condition: "Declare-default while latest accepted report days_past_due < 90"
  - id: ERR_NOT_DEFAULTED
    http: 409
    condition: "Liquidation/guaranty-purchase action while servicing_status not DEFAULTED/LIQUIDATED"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: LoanOfficer
    description: "Lender-side originator: builds applications, authors credit memos, requests/posts disbursements, files servicing reports, opens liquidations, files guaranty purchases. CANNOT approve own memo (four-eyes)."
    identity: "opaque"
    exclusive_operations:
      - "POST /sba/borrowers — Create borrower"
      - "POST /sba/applications — Create application"
      - "POST /sba/applications/{id}/submit — Submit to underwriting"
      - "POST /sba/applications/{id}/resubmit — Resubmit revised application"
      - "POST /sba/applications/{id}/close — Close origination"
      - "POST /sba/applications/{id}/withdraw — Withdraw application"
      - "POST /sba/applications/{id}/declare-default — Declare default"
      - "POST /sba/proceeds — Add proceeds line item"
      - "POST /sba/collateral — Add collateral item"
      - "POST /sba/form-packages — Create form package"
      - "POST /sba/form-packages/{id}/submit — Submit form package"
      - "POST /sba/form-packages/{id}/reopen — Reopen flagged package"
      - "POST /sba/credit-memos — Author credit memo"
      - "POST /sba/credit-memos/{id}/submit — Submit credit memo"
      - "POST /sba/disbursements — Request disbursement"
      - "POST /sba/disbursements/{id}/post — Post disbursement"
      - "POST /sba/disbursements/{id}/reverse — Reverse disbursement"
      - "POST /sba/guaranty-sales — Offer guaranty sale"
      - "POST /sba/guaranty-sales/{id}/repurchase — Repurchase guaranty"
      - "POST /sba/servicing-reports — File 1502 report"
      - "POST /sba/liquidations — Open liquidation"
      - "POST /sba/liquidations/{id}/settle — Settle liquidation"
      - "POST /sba/guaranty-purchases — File guaranty purchase"
    shared_operations:
      - "GET endpoints (lender / borrower / application / child-collection reads)"

  - name: CreditApprover
    description: "Independent credit authority at the lender: reviews form packages, approves/declines/sends-back credit decisions. CANNOT author the memo it approves (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /sba/applications/{id}/request-revision — Send back for revision"
      - "POST /sba/applications/{id}/approve — Approve application"
      - "POST /sba/applications/{id}/decline — Decline application"
      - "POST /sba/form-packages/{id}/review — Review form package (clear/flag)"
    shared_operations:
      - "GET endpoints (lender / borrower / application / child-collection reads)"

  - name: SbaOfficer
    description: "SBA-side authority: onboards lenders, authorizes loans, accepts/rejects 1502 servicing reports, pays/denies guaranty purchases."
    identity: "opaque"
    exclusive_operations:
      - "POST /sba/lenders — Create lender"
      - "POST /sba/applications/{id}/authorize — Authorize loan"
      - "POST /sba/servicing-reports/{id}/accept — Accept 1502 report"
      - "POST /sba/servicing-reports/{id}/reject — Reject 1502 report"
      - "POST /sba/guaranty-purchases/{id}/pay — Pay guaranty purchase"
      - "POST /sba/guaranty-purchases/{id}/deny — Deny guaranty purchase"
    shared_operations:
      - "GET endpoints (lender / borrower / application / child-collection reads)"

  - name: InvestorServicer
    description: "Secondary-market buyer of the guaranteed portion; settles guaranty sales."
    identity: "opaque"
    exclusive_operations:
      - "POST /sba/guaranty-sales/{id}/settle — Settle guaranty sale (buy guaranteed portion)"
    shared_operations:
      - "GET /sba/lenders/{id} — Read lender pool balances"
      - "GET /sba/applications/{id} — Read application"
      - "GET /sba/guaranty-sales — Read guaranty sales"
