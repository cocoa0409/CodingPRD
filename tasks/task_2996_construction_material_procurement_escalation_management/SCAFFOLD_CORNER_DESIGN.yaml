# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml - §1.9 Scaffold Corner Design
# Coverage index for the non-difficulty tests: a breadth walk of the nine
# claim-extraction-guide sections against this scaffold's §1.1-§1.7 surface.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) appear as
# `excluded_because:` stubs citing the covering instance by name.
# =============================================================================
scaffold_corner_design:
- section: entities
  instances:
  - name: creation_project_returns_201_with_a_zeroed_derived_ledger
    claim_type: creation
    grounds:
    - entities.Project
    - entities.Project.fields.escalation_contingency_remaining
    - endpoints[POST /procurement/projects]
    - calculations.buyout_variance
    distinguishing_aspect: A Project created from empty-DB returns 201 and every derived ledger field reads 0.00 except escalation_contingency_remaining, which equals the full 500000.00 budget because no commitment has accrued escalation yet.
    test_recipe:
      setup:
      - Empty database
      - Clock at its 2026-08-01T00:00:00Z startup default
      setup_api_calls: []
      trigger:
      - call: POST /procurement/projects
        payload: {name: Riverside Medical Tower, contract_number: GC-2996-A, owner_name: Riverside Health System, schedule_data_date: '2026-08-01T00:00:00.000Z', escalation_contingency_budget: '500000.00'}
        as: BuyoutManager
        captures: {proj_id: $.data.id}
      assert:
      - the trigger returns HTTP 201
      - Project.${proj_id}.name == "Riverside Medical Tower" and contract_number == "GC-2996-A"
      - Project.${proj_id}.escalation_contingency_budget == 500000.00
      - Project.${proj_id}.estimated_total_cost == 0.00 and committed_total_cost == 0.00
      - Project.${proj_id}.buyout_variance == 0.00 and bought_out_variance == 0.00
      - Project.${proj_id}.escalation_contingency_committed == 0.00
      - Project.${proj_id}.escalation_contingency_remaining == 500000.00
      - Project.${proj_id}.change_order_recovered_amount == 0.00
      - Project.${proj_id}.version == 1
      - the response envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == "object"
  - name: retrieval_material_package_returns_stored_and_clock_derived_fields
    claim_type: retrieval
    grounds:
    - entities.MaterialPackage
    - endpoints[GET /procurement/material-packages/{id}]
    - calculations.release_for_fabrication_schedule
    distinguishing_aspect: GET on a freshly created package returns lead_time_days 111 (21 + 70 + 20), release_for_fabrication_date 2026-11-10, float_days 101 and rff_risk_band ON_TRACK, all recomputed against the 2026-08-01 clock rather than persisted at create time.
    test_recipe:
      setup:
      - 'A project with one steel package: required_onsite_date 2027-03-01, fabrication 70 days, transit 20 days, submittal review 21 days'
      - Clock at its 2026-08-01T00:00:00Z startup default
      setup_api_calls:
      - call: POST /procurement/projects
        payload: {name: Riverside Medical Tower, contract_number: GC-2996-A, owner_name: Riverside Health System, schedule_data_date: '2026-08-01T00:00:00.000Z', escalation_contingency_budget: '500000.00'}
        as: BuyoutManager
        captures: {proj_id: $.data.id}
      - call: POST /procurement/material-packages
        payload: {project_id: '${proj_id}', scope_code: STRUCT-STEEL-01, description: Structural steel frame package, commodity_index_code: PPI_STEEL_MILL, estimated_cost: '1200000.00', required_onsite_date: '2027-03-01T00:00:00.000Z', fabrication_duration_days: 70, delivery_transit_days: 20, submittal_review_days: 21}
        as: BuyoutManager
        captures: {pkg_id: $.data.id}
      trigger:
      - call: GET /procurement/material-packages/${pkg_id}
        payload: {}
        as: BuyoutManager
      assert:
      - the trigger returns HTTP 200
      - MaterialPackage.${pkg_id}.lead_time_days == 111
      - MaterialPackage.${pkg_id}.release_for_fabrication_date == "2026-11-10T00:00:00.000Z"
      - MaterialPackage.${pkg_id}.float_days == 101
      - MaterialPackage.${pkg_id}.rff_risk_band == ON_TRACK
      - MaterialPackage.${pkg_id}.is_long_lead == true
      - MaterialPackage.${pkg_id}.open_quote_count == 0
      - MaterialPackage.${pkg_id}.status == IDENTIFIED
  - name: listing_material_packages_paginates_with_total_count_and_has_more
    claim_type: listing
    grounds:
    - entities.MaterialPackage
    - endpoints[GET /procurement/material-packages]
    - response_envelope.pagination_fields
    distinguishing_aspect: With three packages on one project, limit 2 / offset 0 returns exactly 2 rows with total_count 3 and has_more true, while offset 2 returns 1 row with has_more false — total_count reports the filtered population, not the page size.
    test_recipe:
      setup:
      - A project with three packages (scope codes STRUCT-STEEL-01, STRUCT-STEEL-02, ELEC-FEEDER-01)
      - Clock at its 2026-08-01T00:00:00Z startup default
      setup_api_calls:
      - call: POST /procurement/projects
        payload: {name: Riverside Medical Tower, contract_number: GC-2996-A, owner_name: Riverside Health System, schedule_data_date: '2026-08-01T00:00:00.000Z', escalation_contingency_budget: '500000.00'}
        as: BuyoutManager
        captures: {proj_id: $.data.id}
      - call: POST /procurement/material-packages
        payload: {project_id: '${proj_id}', scope_code: STRUCT-STEEL-01, description: Structural steel frame package, commodity_index_code: PPI_STEEL_MILL, estimated_cost: '1200000.00', required_onsite_date: '2027-03-01T00:00:00.000Z', fabrication_duration_days: 70, delivery_transit_days: 20, submittal_review_days: 21}
        as: BuyoutManager
        captures: {pkg_id: $.data.id}
      - call: POST /procurement/material-packages
        payload: {project_id: '${proj_id}', scope_code: STRUCT-STEEL-02, description: Miscellaneous metals package, commodity_index_code: PPI_STEEL_MILL, estimated_cost: '900000.00', required_onsite_date: '2027-03-01T00:00:00.000Z', fabrication_duration_days: 60, delivery_transit_days: 29}
        as: BuyoutManager
        captures: {pkg2_id: $.data.id}
      - call: POST /procurement/material-packages
        payload: {project_id: '${proj_id}', scope_code: ELEC-FEEDER-01, description: Electrical feeder conductor package, commodity_index_code: PPI_STEEL_MILL, estimated_cost: '400000.00', required_onsite_date: '2027-03-01T00:00:00.000Z', fabrication_duration_days: 30, delivery_transit_days: 10}
        as: BuyoutManager
        captures: {pkg3_id: $.data.id}
      trigger:
      - call: GET /procurement/material-packages
        payload: {project_id: '${proj_id}', limit: 2, offset: 0}
        as: BuyoutManager
      - call: GET /procurement/material-packages
        payload: {project_id: '${proj_id}', limit: 2, offset: 2}
        as: BuyoutManager
      assert:
      - the first trigger call returns HTTP 200 with response_type == "array", exactly 2 data rows, total_count == 3 and has_more == true
      - the second trigger call returns exactly 1 data row, total_count == 3 and has_more == false
      - the union of the two pages contains ${pkg_id}, ${pkg2_id} and ${pkg3_id} exactly once each
  - name: listing_quotes_filtered_by_supersedes_quote_id_returns_only_the_revision
    claim_type: listing
    grounds:
    - entities.Quote.fields.supersedes_quote_id
    - endpoints[GET /procurement/quotes]
    - state_machines.Quote.OPEN_to_SUPERSEDED
    distinguishing_aspect: Filtering GET /procurement/quotes by supersedes_quote_id == the original quote returns exactly the one revision row and never the original itself, which is the reverse-reachability path for the Quote self-reference.
    test_recipe:
      setup:
      - A steel package with an original quote from Ironworks Fabricators LLC at 1150000.00
      - The supplier has revised it to 1140000.00, so the original is SUPERSEDED
      - Clock at its 2026-08-01T00:00:00Z startup default
      setup_api_calls:
      - call: POST /procurement/projects
        payload: {name: Riverside Medical Tower, contract_number: GC-2996-A, owner_name: Riverside Health System, schedule_data_date: '2026-08-01T00:00:00.000Z', escalation_contingency_budget: '500000.00'}
        as: BuyoutManager
        captures: {proj_id: $.data.id}
      - call: POST /procurement/material-packages
        payload: {project_id: '${proj_id}', scope_code: STRUCT-STEEL-01, description: Structural steel frame package, commodity_index_code: PPI_STEEL_MILL, estimated_cost: '1200000.00', required_onsite_date: '2027-03-01T00:00:00.000Z', fabrication_duration_days: 70, delivery_transit_days: 20, submittal_review_days: 21}
        as: BuyoutManager
        captures: {pkg_id: $.data.id}
      - call: POST /procurement/suppliers
        payload: {legal_name: Ironworks Fabricators LLC, country_of_origin: US, declared_tariff_rate_pct: '0.00'}
        as: BuyoutManager
        captures: {sup_id: $.data.id}
      - call: POST /procurement/quotes
        payload: {material_package_id: '${pkg_id}', supplier_id: '${sup_id}', base_price: '1150000.00', received_at: '2026-08-01T00:00:00.000Z', price_hold_days: 45}
        as: SupplierRep
        as_user_id: ${sup_id}
        captures: {q_id: $.data.id}
      - call: POST /procurement/quotes/${q_id}/revise
        payload: {base_price: '1140000.00', received_at: '2026-08-01T00:00:00.000Z', price_hold_days: 45}
        as: SupplierRep
        as_user_id: ${sup_id}
        captures: {q_rev_id: $.data.id}
      trigger:
      - call: GET /procurement/quotes
        payload: {supersedes_quote_id: '${q_id}'}
        as: BuyoutManager
      assert:
      - the trigger returns HTTP 200 with exactly 1 data row and total_count == 1
      - that row's id == ${q_rev_id} and base_price == 1140000.00 and status == OPEN
      - Quote.${q_id} is NOT in the result set and its own status == SUPERSEDED
      - MaterialPackage.${pkg_id}.open_quote_count == 1
  - name: not_found_get_purchase_commitment_with_an_unknown_uuid
    claim_type: not_found
    grounds:
    - entities.PurchaseCommitment
    - endpoints[GET /procurement/purchase-commitments/{id}]
    - validations[priority=30]
    - errors[ERR_COMMITMENT_NOT_FOUND]
    distinguishing_aspect: A syntactically valid UUID that matches no PurchaseCommitment row returns ERR_COMMITMENT_NOT_FOUND with HTTP 404 — the commitment-specific code, not the catch-all ERR_RECORD_NOT_FOUND.
    test_recipe:
      setup:
      - A project and one steel package exist, but no purchase commitment has ever been created
      - Clock at its 2026-08-01T00:00:00Z startup default
      setup_api_calls:
      - call: POST /procurement/projects
        payload: {name: Riverside Medical Tower, contract_number: GC-2996-A, owner_name: Riverside Health System, schedule_data_date: '2026-08-01T00:00:00.000Z', escalation_contingency_budget: '500000.00'}
        as: BuyoutManager
        captures: {proj_id: $.data.id}
      - call: POST /procurement/material-packages
        payload: {project_id: '${proj_id}', scope_code: STRUCT-STEEL-01, description: Structural steel frame package, commodity_index_code: PPI_STEEL_MILL, estimated_cost: '1200000.00', required_onsite_date: '2027-03-01T00:00:00.000Z', fabrication_duration_days: 70, delivery_transit_days: 20, submittal_review_days: 21}
        as: BuyoutManager
        captures: {pkg_id: $.data.id}
      trigger:
      - call: GET /procurement/purchase-commitments/00000000-0000-4000-8000-000000000999
        payload: {}
        as: BuyoutManager
        captures: {err: $.data.error_id}
      assert:
      - the trigger fails with error_id ERR_COMMITMENT_NOT_FOUND and HTTP 404
      - the response envelope has response_type == "error" and data.error_id == "ERR_COMMITMENT_NOT_FOUND"
      - no PurchaseCommitment row is created
  - name: not_found_get_substitution_request_falls_back_to_the_generic_record_code
    claim_type: not_found
    grounds:
    - entities.SubstitutionRequest
    - endpoints[GET /procurement/substitution-requests/{id}]
    - validations[priority=30]
    - errors[ERR_RECORD_NOT_FOUND]
    distinguishing_aspect: SubstitutionRequest has no dedicated 404 code, so an unknown id resolves to ERR_RECORD_NOT_FOUND — proving the generic bucket is reachable and distinct from the six entity-specific 404s.
    test_recipe:
      setup:
      - A project and one steel package exist; no substitution request has been created
      - Clock at its 2026-08-01T00:00:00Z startup default
      setup_api_calls:
      - call: POST /procurement/projects
        payload: {name: Riverside Medical Tower, contract_number: GC-2996-A, owner_name: Riverside Health System, schedule_data_date: '2026-08-01T00:00:00.000Z', escalation_contingency_budget: '500000.00'}
        as: BuyoutManager
        captures: {proj_id: $.data.id}
      - call: POST /procurement/material-packages
        payload: {project_id: '${proj_id}', scope_code: STRUCT-STEEL-01, description: Structural steel frame package, commodity_index_code: PPI_STEEL_MILL, estimated_cost: '1200000.00', required_onsite_date: '2027-03-01T00:00:00.000Z', fabrication_duration_days: 70, delivery_transit_days: 20, submittal_review_days: 21}
        as: BuyoutManager
        captures: {pkg_id: $.data.id}
      trigger:
      - call: GET /procurement/substitution-requests/00000000-0000-4000-8000-000000000999
        payload: {}
        as: BuyoutManager
        captures: {err: $.data.error_id}
      assert:
      - the trigger fails with error_id ERR_RECORD_NOT_FOUND and HTTP 404
      - the error is NOT ERR_PACKAGE_NOT_FOUND and NOT ERR_SUPPLIER_NOT_FOUND
  - name: required_fields_material_package_create_missing_estimated_cost_rejected
    claim_type: required_fields
    grounds:
    - entities.MaterialPackage.fields.estimated_cost
    - validations[priority=25]
    - errors[ERR_INVALID_REQUEST]
    - endpoints[POST /procurement/material-packages]
    distinguishing_aspect: 'estimated_cost carries source: input with no default, so omitting it returns ERR_INVALID_REQUEST at HTTP 422 and no MaterialPackage row is written — unlike submittal_review_days, whose omission is legal.'
    test_recipe:
      setup:
      - A project exists
      - Clock at its 2026-08-01T00:00:00Z startup default
      setup_api_calls:
      - call: POST /procurement/projects
        payload: {name: Riverside Medical Tower, contract_number: GC-2996-A, owner_name: Riverside Health System, schedule_data_date: '2026-08-01T00:00:00.000Z', escalation_contingency_budget: '500000.00'}
        as: BuyoutManager
        captures: {proj_id: $.data.id}
      trigger:
      - call: POST /procurement/material-packages
        payload: {project_id: '${proj_id}', scope_code: STRUCT-STEEL-01, description: Structural steel frame package, commodity_index_code: PPI_STEEL_MILL, required_onsite_date: '2027-03-01T00:00:00.000Z', fabrication_duration_days: 70, delivery_transit_days: 20}
        as: BuyoutManager
        captures: {err: $.data.error_id}
      assert:
      - the trigger fails with error_id ERR_INVALID_REQUEST and HTTP 422
      - GET /procurement/material-packages?project_id=${proj_id} returns total_count == 0
      - Project.${proj_id}.estimated_total_cost == 0.00
  - name: defaults_submittal_review_days_defaults_to_twenty_one
    claim_type: defaults
    grounds:
    - entities.MaterialPackage.fields.submittal_review_days
    - calculations.release_for_fabrication_schedule
    - endpoints[POST /procurement/material-packages]
    distinguishing_aspect: Omitting submittal_review_days applies the declared default 21, so a package with fabrication 60 and transit 29 reports lead_time_days 110 and release_for_fabrication_date 2026-11-11 — while is_long_lead is false because 60 + 29 = 89 excludes the submittal span.
    test_recipe:
      setup:
      - A project exists
      - Clock at its 2026-08-01T00:00:00Z startup default
      setup_api_calls:
      - call: POST /procurement/projects
        payload: {name: Riverside Medical Tower, contract_number: GC-2996-A, owner_name: Riverside Health System, schedule_data_date: '2026-08-01T00:00:00.000Z', escalation_contingency_budget: '500000.00'}
        as: BuyoutManager
        captures: {proj_id: $.data.id}
      trigger:
      - call: POST /procurement/material-packages
        payload: {project_id: '${proj_id}', scope_code: STRUCT-STEEL-02, description: Miscellaneous metals package, commodity_index_code: PPI_STEEL_MILL, estimated_cost: '900000.00', required_onsite_date: '2027-03-01T00:00:00.000Z', fabrication_duration_days: 60, delivery_transit_days: 29}
        as: BuyoutManager
        captures: {pkg2_id: $.data.id}
      assert:
      - the trigger returns HTTP 201
      - MaterialPackage.${pkg2_id}.submittal_review_days == 21
      - MaterialPackage.${pkg2_id}.lead_time_days == 110
      - MaterialPackage.${pkg2_id}.release_for_fabrication_date == "2026-11-11T00:00:00.000Z"
      - MaterialPackage.${pkg2_id}.float_days == 102 and rff_risk_band == ON_TRACK
      - MaterialPackage.${pkg2_id}.is_long_lead == false
  - name: defaults_supplier_declared_tariff_rate_defaults_to_zero
    claim_type: defaults
    grounds:
    - entities.Supplier.fields.declared_tariff_rate_pct
    - entities.Supplier.fields.status
    - calculations.supplier_exposure_score
    - endpoints[POST /procurement/suppliers]
    distinguishing_aspect: Omitting declared_tariff_rate_pct applies the default 0, and combined with country_of_origin "US" and no disruption events the snapshot exposure is exactly 0.00 / LOW and status defaults to ACTIVE.
    test_recipe:
      setup:
      - Empty database
      - Clock at its 2026-08-01T00:00:00Z startup default
      setup_api_calls: []
      trigger:
      - call: POST /procurement/suppliers
        payload: {legal_name: Ironworks Fabricators LLC, country_of_origin: US}
        as: BuyoutManager
        captures: {sup_id: $.data.id}
      assert:
      - the trigger returns HTTP 201
      - Supplier.${sup_id}.declared_tariff_rate_pct == 0
      - Supplier.${sup_id}.status == ACTIVE and suspension_reason is null
      - Supplier.${sup_id}.is_domestic == true
      - Supplier.${sup_id}.open_disruption_count == 0
      - Supplier.${sup_id}.exposure_score_snapshot == 0.00 and exposure_band_snapshot == LOW
  - name: computed_fields_is_domestic_derived_from_country_of_origin
    claim_type: computed_fields
    grounds:
    - entities.Supplier.fields.is_domestic
    - entities.Supplier.fields.country_of_origin
    - calculations.supplier_exposure_score
    distinguishing_aspect: 'is_domestic is source: computed from country_of_origin alone: a CN supplier with declared_tariff_rate_pct 0.00 and no events reads is_domestic false and exposure_score_snapshot exactly 20.00 (the NON_DOMESTIC_PENALTY) with band LOW.'
    test_recipe:
      setup:
      - Empty database
      - Clock at its 2026-08-01T00:00:00Z startup default
      setup_api_calls: []
      trigger:
      - call: POST /procurement/suppliers
        payload: {legal_name: Pacific Rim Steel Works, country_of_origin: CN, declared_tariff_rate_pct: '0.00'}
        as: BuyoutManager
        captures: {sup_cn_id: $.data.id}
      assert:
      - the trigger returns HTTP 201
      - Supplier.${sup_cn_id}.is_domestic == false
      - Supplier.${sup_cn_id}.exposure_score_snapshot == 20.00
      - Supplier.${sup_cn_id}.exposure_band_snapshot == LOW
      - Supplier.${sup_cn_id}.open_disruption_count == 0
  - name: system_fields_package_baselines_and_status_are_server_minted
    claim_type: system_fields
    grounds:
    - entities.MaterialPackage.fields.baseline_estimated_cost
    - entities.MaterialPackage.fields.baseline_fabrication_duration_days
    - entities.MaterialPackage.fields.status
    - entities.MaterialPackage
    distinguishing_aspect: 'baseline_estimated_cost, baseline_fabrication_duration_days and status are source: system — the server seeds the two baselines from the submitted values at create time and sets status IDENTIFIED, and common_fields mints id / created_at / updated_at / version == 1.'
    test_recipe:
      setup:
      - A project exists
      - Clock at its 2026-08-01T00:00:00Z startup default
      setup_api_calls:
      - call: POST /procurement/projects
        payload: {name: Riverside Medical Tower, contract_number: GC-2996-A, owner_name: Riverside Health System, schedule_data_date: '2026-08-01T00:00:00.000Z', escalation_contingency_budget: '500000.00'}
        as: BuyoutManager
        captures: {proj_id: $.data.id}
      trigger:
      - call: POST /procurement/material-packages
        payload: {project_id: '${proj_id}', scope_code: STRUCT-STEEL-01, description: Structural steel frame package, commodity_index_code: PPI_STEEL_MILL, estimated_cost: '1200000.00', required_onsite_date: '2027-03-01T00:00:00.000Z', fabrication_duration_days: 70, delivery_transit_days: 20, submittal_review_days: 21}
        as: BuyoutManager
        captures: {pkg_id: $.data.id}
      assert:
      - the trigger returns HTTP 201
      - MaterialPackage.${pkg_id}.baseline_estimated_cost == 1200000.00 and estimated_cost == 1200000.00
      - MaterialPackage.${pkg_id}.baseline_fabrication_duration_days == 70 and fabrication_duration_days == 70
      - MaterialPackage.${pkg_id}.status == IDENTIFIED
      - MaterialPackage.${pkg_id}.version == 1
      - MaterialPackage.${pkg_id}.id is a bare UUID with no type prefix
      - MaterialPackage.${pkg_id}.created_at and updated_at are ISO-8601 UTC instants with three fractional digits
  - name: type_constraints_undeclared_commodity_index_code_rejected
    claim_type: type_constraints
    grounds:
    - entities.MaterialPackage.fields.commodity_index_code
    - validations[priority=25]
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: commodity_index_code is an enum, so the undeclared member "PPI_UNOBTANIUM" returns ERR_INVALID_REQUEST at HTTP 422 rather than being stored verbatim.
    test_recipe:
      setup:
      - A project exists
      - Clock at its 2026-08-01T00:00:00Z startup default
      setup_api_calls:
      - call: POST /procurement/projects
        payload: {name: Riverside Medical Tower, contract_number: GC-2996-A, owner_name: Riverside Health System, schedule_data_date: '2026-08-01T00:00:00.000Z', escalation_contingency_budget: '500000.00'}
        as: BuyoutManager
        captures: {proj_id: $.data.id}
      trigger:
      - call: POST /procurement/material-packages
        payload: {project_id: '${proj_id}', scope_code: STRUCT-STEEL-01, description: Structural steel frame package, commodity_index_code: PPI_UNOBTANIUM, estimated_cost: '1200000.00', required_onsite_date: '2027-03-01T00:00:00.000Z', fabrication_duration_days: 70, delivery_transit_days: 20}
        as: BuyoutManager
        captures: {err: $.data.error_id}
      assert:
      - the trigger fails with error_id ERR_INVALID_REQUEST and HTTP 422
      - GET /procurement/material-packages?project_id=${proj_id} returns total_count == 0
  - name: type_constraints_unknown_field_in_a_quote_payload_rejected
    claim_type: type_constraints
    grounds:
    - entities.Quote.fields.expires_at
    - validations[priority=25]
    - errors[ERR_INVALID_REQUEST]
    - endpoints[POST /procurement/quotes]
    distinguishing_aspect: 'expires_at is source: computed and absent from the endpoint''s input, so sending it is an unknown field and returns ERR_INVALID_REQUEST at HTTP 422 — the server never silently ignores a client-supplied derived value.'
    test_recipe:
      setup:
      - A project, a steel package and Ironworks Fabricators LLC exist
      - Clock at its 2026-08-01T00:00:00Z startup default
      setup_api_calls:
      - call: POST /procurement/projects
        payload: {name: Riverside Medical Tower, contract_number: GC-2996-A, owner_name: Riverside Health System, schedule_data_date: '2026-08-01T00:00:00.000Z', escalation_contingency_budget: '500000.00'}
        as: BuyoutManager
        captures: {proj_id: $.data.id}
      - call: POST /procurement/material-packages
        payload: {project_id: '${proj_id}', scope_code: STRUCT-STEEL-01, description: Structural steel frame package, commodity_index_code: PPI_STEEL_MILL, estimated_cost: '1200000.00', required_onsite_date: '2027-03-01T00:00:00.000Z', fabrication_duration_days: 70, delivery_transit_days: 20, submittal_review_days: 21}
        as: BuyoutManager
        captures: {pkg_id: $.data.id}
      - call: POST /procurement/suppliers
