# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Breadth complement to SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8). Enumerates the
# remaining testable claims of SCAFFOLD.yaml §1.1–§1.7: entity creation/defaults/
# computed fields, state-machine invalid-from rejections and terminal lockdowns,
# calculation corners, validation triggers and priority pairs, endpoint envelope/
# pagination/filters, error triggerability, RBAC denials and scoping, OCC
# concurrency, scheduled actions, immediate consistency. Corners already
# exercised by a §1.8 instance are emitted as excluded_because stubs.
# Logical-clock discipline: the server default is 2026-09-01T00:00:00Z and the
# clock only moves forward; every fixture date below is reachable from it.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  # Section: entities — creation, defaults, computed/system fields, type bounds
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: institution_create_embeds_users_and_defaults
        claim_type: creation
        grounds:
          - entities.Institution.fields.status
          - entities.Institution.fields.suspension_reason
          - entities.Institution.fields.compliance_standing
          - entities.Institution.fields.users
          - entities.InstitutionUser.fields.status
        distinguishing_aspect: "POST /institutions returns 201 with the users array embedded in input order; system defaults on creation are status ACTIVE, suspension_reason NONE, compliance_standing COMPLIANT, version 1, and each provisioned InstitutionUser starts ACTIVE."
        test_recipe:
          setup:
            - "Empty database; default logical clock 2026-09-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" }, { email: "cert@su.edu", role: "CERTIFIER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id", u0_email: "$.data.users[0].email", u0_role: "$.data.users[0].role", u0_status: "$.data.users[0].status", u1_email: "$.data.users[1].email", inst_status: "$.data.status", inst_reason: "$.data.suspension_reason", inst_standing: "$.data.compliance_standing", inst_v: "$.data.version" } }
          trigger:
            - { call: "GET /institutions/${inst_id}", payload: {}, as: ClearinghouseOps, captures: { g_status: "$.data.status", g_reason: "$.data.suspension_reason", g_standing: "$.data.compliance_standing" } }
          assert:
            - "captured u0_email == sub@su.edu and u0_role == SUBMITTER and u0_status == ACTIVE (input order preserved)"
            - "captured u1_email == cert@su.edu"
            - "captured inst_status == ACTIVE and inst_reason == NONE and inst_standing == COMPLIANT and inst_v == 1"
            - "captured g_status == ACTIVE and g_reason == NONE and g_standing == COMPLIANT (GET agrees with the create response)"

      - name: student_resolution_matches_normalized_name_and_dob
        claim_type: computed_fields
        grounds:
          - entities.EnrollmentEntry.fields.student_id
          - entities.StudentRecord.fields.full_name
        distinguishing_aspect: "Student resolution keys on (lower(trim(full_name)), date_of_birth): a row with name 'ada lovelace' resolves to the SAME StudentRecord as 'Ada Lovelace' with the same dob, while the same name with a different dob creates a distinct student; the stored full_name keeps the first-reported casing."
        test_recipe:
          setup:
            - "Compliant institution with ACTIVE agreement and OPEN Fall 2026 period at 2026-11-15"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" }, { email: "cert@su.edu", role: "CERTIFIER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id", sub_uid: "$.data.users[0].id" } }
            - { call: "POST /institutions/${inst_id}/agreements", payload: { effective_from: "2026-01-01", effective_to: "2027-06-30" }, as: ClearinghouseOps }
            - { call: "POST /institutions/${inst_id}/reporting-periods", payload: { term_label: "Fall 2026", term_start: "2026-09-01", term_end: "2026-12-15", submission_opens_at: "2026-11-01", submission_due_at: "2026-12-20" }, as: ClearinghouseOps, captures: { period_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-15T00:00:00Z" }, as: ClearinghouseOps }
            - { call: "GET /institutions/${inst_id}/reporting-periods", payload: {}, as: ClearinghouseOps, captures: { period_v: "$.data[0].version" } }
            - { call: "POST /enrollment-files", payload: { institution_id: "${inst_id}", reporting_period_id: "${period_id}", expected_reporting_period_version: "${period_v}", rows: [ { student_ref: "S1", full_name: "Ada Lovelace", date_of_birth: "2004-05-12", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15" }, { student_ref: "S2", full_name: "ada lovelace", date_of_birth: "2004-05-12", career_level: "UNDERGRAD", credit_hours: 9.0, term_start: "2026-09-01", term_end: "2026-12-15" }, { student_ref: "S3", full_name: "Ada Lovelace", date_of_birth: "2004-05-13", career_level: "UNDERGRAD", credit_hours: 9.0, term_start: "2026-09-01", term_end: "2026-12-15" } ] }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { file_id: "$.data.id" } }
          trigger:
            - { call: "GET /enrollment-entries", payload: { file_id: "${file_id}" }, as: ClearinghouseOps, captures: { st_a: "$.data[0].student_id", st_b: "$.data[1].student_id", st_c: "$.data[2].student_id" } }
            - { call: "GET /students/${st_a}", payload: {}, as: ClearinghouseOps, captures: { st_name: "$.data.full_name" } }
          assert:
            - "captured st_a == st_b (case-normalized name + same dob resolve to one student)"
            - "captured st_c != st_a (same name, different dob => distinct student)"
            - "captured st_name == Ada Lovelace (first-reported casing retained)"

      - name: student_deferment_standing_defaults_to_none
        claim_type: defaults
        grounds:
          - entities.StudentRecord.fields.deferment_standing
        distinguishing_aspect: "A StudentRecord created implicitly by file upload starts with deferment_standing NONE and version 1 — no notification has been ACKNOWLEDGED yet."
        test_recipe:
          setup:
            - "Compliant institution, OPEN Fall 2026 period, one uploaded row"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" }, { email: "cert@su.edu", role: "CERTIFIER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id", sub_uid: "$.data.users[0].id" } }
            - { call: "POST /institutions/${inst_id}/agreements", payload: { effective_from: "2026-01-01", effective_to: "2027-06-30" }, as: ClearinghouseOps }
            - { call: "POST /institutions/${inst_id}/reporting-periods", payload: { term_label: "Fall 2026", term_start: "2026-09-01", term_end: "2026-12-15", submission_opens_at: "2026-11-01", submission_due_at: "2026-12-20" }, as: ClearinghouseOps, captures: { period_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-15T00:00:00Z" }, as: ClearinghouseOps }
            - { call: "GET /institutions/${inst_id}/reporting-periods", payload: {}, as: ClearinghouseOps, captures: { period_v: "$.data[0].version" } }
            - { call: "POST /enrollment-files", payload: { institution_id: "${inst_id}", reporting_period_id: "${period_id}", expected_reporting_period_version: "${period_v}", rows: [ { student_ref: "S1", full_name: "Ada Lovelace", date_of_birth: "2004-05-12", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15" } ] }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { file_id: "$.data.id" } }
            - { call: "GET /enrollment-entries", payload: { file_id: "${file_id}" }, as: ClearinghouseOps, captures: { st1: "$.data[0].student_id" } }
          trigger:
            - { call: "GET /students/${st1}", payload: {}, as: ClearinghouseOps, captures: { st_standing: "$.data.deferment_standing", st_v: "$.data.version" } }
          assert:
            - "captured st_standing == NONE"
            - "captured st_v == 1"

      - name: period_grace_ends_at_computed_from_due_date
        claim_type: computed_fields
        grounds:
          - entities.ReportingPeriod.fields.grace_ends_at
          - entities.ReportingPeriod.fields.status
          - calculations.compliance_standing
        distinguishing_aspect: "grace_ends_at is derived as submission_due_at + GRACE_PERIOD_DAYS(14): a period due 2026-12-20 reports grace_ends_at 2027-01-03T00:00:00Z, and at the default clock 2026-09-01 (before opens 2026-11-01) the computed initial status is SCHEDULED with version 1."
        test_recipe:
          setup:
            - "One institution; default clock 2026-09-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" }, { email: "cert@su.edu", role: "CERTIFIER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id" } }
          trigger:
            - { call: "POST /institutions/${inst_id}/reporting-periods", payload: { term_label: "Fall 2026", term_start: "2026-09-01", term_end: "2026-12-15", submission_opens_at: "2026-11-01", submission_due_at: "2026-12-20" }, as: ClearinghouseOps, captures: { p_grace: "$.data.grace_ends_at", p_status: "$.data.status", p_v: "$.data.version" } }
          assert:
            - "captured p_grace == 2027-01-03T00:00:00Z (2026-12-20 + 14 days)"
            - "captured p_status == SCHEDULED (now 2026-09-01 < opens 2026-11-01)"
            - "captured p_v == 1"

      - name: requester_create_defaults_credit_zero
        claim_type: defaults
        grounds:
          - entities.Requester.fields.credit_balance_cents
          - entities.Requester.fields.initial_credit_cents
          - entities.Requester.fields.status
        distinguishing_aspect: "Omitting initial_credit_cents seeds credit_balance_cents at 0; the requester starts PENDING_VETTING with version 1."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id" } }
          trigger:
            - { call: "POST /requesters", payload: { org_name: "Bare Org", requester_kind: "BACKGROUND_SCREENER" }, as: ClearinghouseOps, captures: { rq_bal: "$.data.credit_balance_cents", rq_status: "$.data.status", rq_v: "$.data.version" } }
          assert:
            - "captured rq_bal == 0 (default initial_credit_cents 0)"
            - "captured rq_status == PENDING_VETTING"
            - "captured rq_v == 1"

      - name: file_upload_row_partition_computed
        claim_type: computed_fields
        grounds:
          - entities.EnrollmentFile.fields.row_count
          - entities.EnrollmentFile.fields.accepted_rows
          - entities.EnrollmentFile.fields.rejected_rows
          - entities.EnrollmentEntry.fields.reject_reason
          - entities.EnrollmentEntry.fields.status_code
        distinguishing_aspect: "Screening partitions rows deterministically: of 3 rows where the middle one has credit_hours 31.0 (> MAX_CREDIT_HOURS 30), the file reports row_count 3, accepted_rows 2, rejected_rows 1, and the rejected entry carries reject_reason INVALID_CREDITS with status_code kept at NONE (REJECTED rows are excluded from status computation)."
        test_recipe:
          setup:
            - "Compliant institution, OPEN Fall 2026 period at 2026-11-15"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" }, { email: "cert@su.edu", role: "CERTIFIER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id", sub_uid: "$.data.users[0].id" } }
            - { call: "POST /institutions/${inst_id}/agreements", payload: { effective_from: "2026-01-01", effective_to: "2027-06-30" }, as: ClearinghouseOps }
            - { call: "POST /institutions/${inst_id}/reporting-periods", payload: { term_label: "Fall 2026", term_start: "2026-09-01", term_end: "2026-12-15", submission_opens_at: "2026-11-01", submission_due_at: "2026-12-20" }, as: ClearinghouseOps, captures: { period_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-15T00:00:00Z" }, as: ClearinghouseOps }
            - { call: "GET /institutions/${inst_id}/reporting-periods", payload: {}, as: ClearinghouseOps, captures: { period_v: "$.data[0].version" } }
          trigger:
            - { call: "POST /enrollment-files", payload: { institution_id: "${inst_id}", reporting_period_id: "${period_id}", expected_reporting_period_version: "${period_v}", rows: [ { student_ref: "S1", full_name: "Good One", date_of_birth: "2004-01-01", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15" }, { student_ref: "S2", full_name: "Bad Credits", date_of_birth: "2004-01-02", career_level: "UNDERGRAD", credit_hours: 31.0, term_start: "2026-09-01", term_end: "2026-12-15" }, { student_ref: "S3", full_name: "Good Two", date_of_birth: "2004-01-03", career_level: "UNDERGRAD", credit_hours: 9.0, term_start: "2026-09-01", term_end: "2026-12-15" } ] }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { file_id: "$.data.id", f_rows: "$.data.row_count", f_acc: "$.data.accepted_rows", f_rej: "$.data.rejected_rows" } }
            - { call: "GET /enrollment-entries", payload: { file_id: "${file_id}" }, as: ClearinghouseOps, captures: { e2_status: "$.data[1].entry_status", e2_reason: "$.data[1].reject_reason", e2_code: "$.data[1].status_code" } }
          assert:
            - "captured f_rows == 3 and f_acc == 2 and f_rej == 1"
            - "captured e2_status == REJECTED and e2_reason == INVALID_CREDITS (31.0 > MAX_CREDIT_HOURS 30)"
            - "captured e2_code == NONE (REJECTED rows keep NONE)"

      - name: screening_reject_reason_matrix
        claim_type: type_constraints
        grounds:
          - entities.EnrollmentEntry.fields.reject_reason
          - entities.EnrollmentEntry.fields.entry_status
          - calculations.enrollment_status_determination
        distinguishing_aspect: "Each screening rule maps to its own reject_reason in row order: DUPLICATE_STUDENT_IN_FILE (student_ref repeated), MISSING_FIELD, INVALID_ENUM_VALUE, INVALID_CREDITS (30.5 > 30), INVALID_TERM_DATES (term_end == term_start), INVALID_WITHDRAWAL_DATE (withdrawal after term_end); a boundary row at exactly 30.0 credits is ACCEPTED and computed FULL_TIME."
        test_recipe:
          setup:
            - "Compliant institution, OPEN Fall 2026 period at 2026-11-15"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" }, { email: "cert@su.edu", role: "CERTIFIER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id", sub_uid: "$.data.users[0].id" } }
            - { call: "POST /institutions/${inst_id}/agreements", payload: { effective_from: "2026-01-01", effective_to: "2027-06-30" }, as: ClearinghouseOps }
            - { call: "POST /institutions/${inst_id}/reporting-periods", payload: { term_label: "Fall 2026", term_start: "2026-09-01", term_end: "2026-12-15", submission_opens_at: "2026-11-01", submission_due_at: "2026-12-20" }, as: ClearinghouseOps, captures: { period_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-15T00:00:00Z" }, as: ClearinghouseOps }
            - { call: "GET /institutions/${inst_id}/reporting-periods", payload: {}, as: ClearinghouseOps, captures: { period_v: "$.data[0].version" } }
          trigger:
            - { call: "POST /enrollment-files", payload: { institution_id: "${inst_id}", reporting_period_id: "${period_id}", expected_reporting_period_version: "${period_v}", rows: [ { student_ref: "DUP", full_name: "Dup One", date_of_birth: "2004-01-01", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15" }, { student_ref: "DUP", full_name: "Dup Two", date_of_birth: "2004-01-02", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15" }, { student_ref: "M1", full_name: "Miss Field", date_of_birth: "2004-01-03", career_level: "UNDERGRAD", term_start: "2026-09-01", term_end: "2026-12-15" }, { student_ref: "E1", full_name: "Enum Bad", date_of_birth: "2004-01-04", career_level: "PHD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15" }, { student_ref: "C1", full_name: "Credits Bad", date_of_birth: "2004-01-05", career_level: "UNDERGRAD", credit_hours: 30.5, term_start: "2026-09-01", term_end: "2026-12-15" }, { student_ref: "T1", full_name: "Term Bad", date_of_birth: "2004-01-06", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-09-01" }, { student_ref: "W1", full_name: "Wd Bad", date_of_birth: "2004-01-07", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15", withdrawal_date: "2026-12-20" }, { student_ref: "MAX", full_name: "Max Credits", date_of_birth: "2004-01-08", career_level: "UNDERGRAD", credit_hours: 30.0, term_start: "2026-09-01", term_end: "2026-12-15" } ] }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { file_id: "$.data.id", f_rows: "$.data.row_count", f_acc: "$.data.accepted_rows", f_rej: "$.data.rejected_rows" } }
            - { call: "GET /enrollment-entries", payload: { file_id: "${file_id}" }, as: ClearinghouseOps, captures: { r1: "$.data[1].reject_reason", r2: "$.data[2].reject_reason", r3: "$.data[3].reject_reason", r4: "$.data[4].reject_reason", r5: "$.data[5].reject_reason", r6: "$.data[6].reject_reason", e7_status: "$.data[7].entry_status", e7_code: "$.data[7].status_code" } }
          assert:
            - "captured f_rows == 8 and f_acc == 2 and f_rej == 6"
            - "captured r1 == DUPLICATE_STUDENT_IN_FILE (second occurrence of student_ref DUP; first wins)"
            - "captured r2 == MISSING_FIELD (credit_hours absent)"
            - "captured r3 == INVALID_ENUM_VALUE (career_level PHD)"
            - "captured r4 == INVALID_CREDITS (30.5 > 30)"
            - "captured r5 == INVALID_TERM_DATES (term_end == term_start)"
            - "captured r6 == INVALID_WITHDRAWAL_DATE (2026-12-20 > term_end 2026-12-15)"
            - "captured e7_status == ACCEPTED and e7_code == FULL_TIME (30.0 <= MAX_CREDIT_HOURS boundary, >= 12.0)"

      - name: directive_create_defaults_indefinite_window
        claim_type: defaults
        grounds:
          - entities.PrivacyDirective.fields.effective_to
          - entities.PrivacyDirective.fields.status
        distinguishing_aspect: "Omitting effective_to stores null (indefinite window); the directive is created ACTIVE and is the only directive on the student."
        test_recipe:
          setup:
            - "Compliant institution, OPEN period, one uploaded student S1 at version 1"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" }, { email: "cert@su.edu", role: "CERTIFIER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id", sub_uid: "$.data.users[0].id" } }
            - { call: "POST /institutions/${inst_id}/agreements", payload: { effective_from: "2026-01-01", effective_to: "2027-06-30" }, as: ClearinghouseOps }
            - { call: "POST /institutions/${inst_id}/reporting-periods", payload: { term_label: "Fall 2026", term_start: "2026-09-01", term_end: "2026-12-15", submission_opens_at: "2026-11-01", submission_due_at: "2026-12-20" }, as: ClearinghouseOps, captures: { period_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-15T00:00:00Z" }, as: ClearinghouseOps }
            - { call: "GET /institutions/${inst_id}/reporting-periods", payload: {}, as: ClearinghouseOps, captures: { period_v: "$.data[0].version" } }
            - { call: "POST /enrollment-files", payload: { institution_id: "${inst_id}", reporting_period_id: "${period_id}", expected_reporting_period_version: "${period_v}", rows: [ { student_ref: "S1", full_name: "Ada Lovelace", date_of_birth: "2004-05-12", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15" } ] }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { file_id: "$.data.id" } }
            - { call: "GET /enrollment-entries", payload: { file_id: "${file_id}" }, as: ClearinghouseOps, captures: { st1: "$.data[0].student_id" } }
            - { call: "GET /students/${st1}", payload: {}, as: ClearinghouseOps, captures: { st_v: "$.data.version" } }
          trigger:
            - { call: "POST /students/${st1}/privacy-directives", payload: { directive_type: "FULL_BLOCK", effective_from: "2026-01-01", expected_student_version: "${st_v}" }, as: ClearinghouseOps, captures: { d_status: "$.data.status", d_to: "$.data.effective_to" } }
            - { call: "GET /students/${st1}/privacy-directives", payload: {}, as: ClearinghouseOps, captures: { d_count: "$.meta.total_count" } }
          assert:
            - "captured d_status == ACTIVE"
            - "captured d_to is null (indefinite window)"
            - "captured d_count == 1"

  # ---------------------------------------------------------------------------
  # Section: state_machines — valid transitions, invalid-from rejections,
  # terminal lockdowns, idempotency, side-effect execution
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: agreement_window_inclusive_start_exclusive_end
        claim_type: valid_transition
        grounds:
          - state_machines.ParticipationAgreement.SCHEDULED_to_ACTIVE
          - state_machines.ParticipationAgreement.ACTIVE_to_EXPIRED
          - entities.ParticipationAgreement.fields.effective_to
        distinguishing_aspect: "Half-open [effective_from, effective_to): at exactly effective_from 2026-10-01 the SCHEDULED agreement flips ACTIVE (inclusive start); at exactly effective_to 2026-11-01 it flips EXPIRED (exclusive end) and, with no other ACTIVE agreement, the institution cascades to SUSPENDED/AGREEMENT_LAPSE."
        test_recipe:
          setup:
            - "Institution with a single agreement window [2026-10-01, 2026-11-01), created SCHEDULED at the default clock 2026-09-01"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id" } }
            - { call: "POST /institutions/${inst_id}/agreements", payload: { effective_from: "2026-10-01", effective_to: "2026-11-01" }, as: ClearinghouseOps, captures: { ag0: "$.data.status" } }
          trigger:
