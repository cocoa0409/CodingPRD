              as_user_id: "usr-file-1"
              captures: { sub1_id: "$.data.id" }
            - call: "POST /filing-submissions/${sub1_id}/transmit"
              payload: {}
              as: FilingAgent
              as_user_id: "usr-file-1"
          trigger:
            - call: "PATCH /flight-legs/${leg4_id}"
              payload: { dep_utc: "2026-11-23T10:00:00Z", arr_utc: "2026-11-23T11:00:00Z" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "PATCH /flight-legs/${leg4_id}"
              payload: { dep_utc: "2026-11-23T08:00:00Z", arr_utc: "2026-11-23T09:00:00Z" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /flight-legs/${leg4_id}/attach-slot"
              payload: { slot_holding_id: "${sh_id}", movement_type: "DEPARTURE" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /filing-submissions"
              payload: { schedule_version_id: "${sv_id}", distribution_system: "IATA_SSIM", change_window: "EXPEDITED" }
              as: FilingAgent
              as_user_id: "usr-file-1"
              captures: { sub2_id: "$.data.id" }
            - call: "POST /filing-submissions/${sub2_id}/transmit"
              payload: {}
              as: FilingAgent
              as_user_id: "usr-file-1"
          assert:
            - "before the trigger FlightLeg.${leg4_id}.status == FILED (lap 1 reached FILED)"
            - "after trigger call 1 FlightLeg.${leg4_id}.status == REFILE_REQUIRED and departure_slot_holding_id == null"
            - "after trigger call 2 FlightLeg.${leg4_id}.status == REFILE_REQUIRED (self-loop) and dep_utc == \"2026-11-23T08:00:00Z\""
            - "after trigger call 3 FlightLeg.${leg4_id}.status == SLOT_BACKED and departure_slot_holding_id == ${sh_id} — the leg has re-entered a state it already occupied"
            - "after trigger call 5 FlightLeg.${leg4_id}.status == FILED again, completing the second lap of the SLOT_BACKED -> FILED -> REFILE_REQUIRED -> SLOT_BACKED cycle"
