              as: RatingProviderAdmin
              captures: { r16: $.data.id }
            - call: "POST /raters"
              payload: { full_name: "Ines Pike", cert_level: "RATING_FIELD_INSPECTOR", cert_expires_at: "2027-06-30T00:00:00Z" }
              as: RatingProviderAdmin
              captures: { fi16: $.data.id }
            - call: "POST /plan-models"
              payload: { subdivision_id: "${sd16}", plan_code: "STD-2400", conditioned_floor_area_sqft: 2400, conditioned_volume_cuft: 21600, bedrooms: 4, envelope_ua_btu_per_hr_f: 320, design_ach50: 3.00, design_duct_leakage_cfm25_per_100sqft: 3.00, hvac_efficiency_index: 9, pv_capacity_kw_dc: 0 }
              as: CertifiedRater
              as_user_id: "${r16}"
              captures: { pm16: $.data.id }
            - call: "POST /homes"
              payload: { subdivision_id: "${sd16}", plan_model_id: "${pm16}", lot_number: "L-1101", permit_date: "2026-08-04" }
              as: BuilderRep
              as_user_id: "${b16}"
              captures: { h16a: $.data.id }
            - call: "POST /homes"
              payload: { subdivision_id: "${sd16}", plan_model_id: "${pm16}", lot_number: "L-1102", permit_date: "2026-08-05" }
              as: BuilderRep
              as_user_id: "${b16}"
              captures: { h16b: $.data.id }
            - call: "POST /ratings"
              payload: { home_id: "${h16a}", rater_id: "${r16}" }
              as: CertifiedRater
              as_user_id: "${r16}"
              captures: { rt16a: $.data.id }
            - call: "POST /ratings"
              payload: { home_id: "${h16b}", rater_id: "${r16}" }
              as: CertifiedRater
              as_user_id: "${r16}"
              captures: { rt16b: $.data.id }
            - call: "POST /inspections"
              payload: { rating_id: "${rt16a}", inspector_id: "${fi16}", checkpoint: "FINAL", scheduled_start_utc: "2026-08-18T09:00:00Z", scheduled_end_utc: "2026-08-18T11:00:00Z", air_handler_installed: true }
              as: FieldInspector
              as_user_id: "${fi16}"
              captures: { in16a: $.data.id }
          trigger:
            - call: "POST /inspections"
              payload: { rating_id: "${rt16b}", inspector_id: "${fi16}", checkpoint: "FINAL", scheduled_start_utc: "2026-08-18T11:30:00Z", scheduled_end_utc: "2026-08-18T12:30:00Z", air_handler_installed: true }
              as: FieldInspector
              as_user_id: "${fi16}"
            - call: "POST /inspections"
              payload: { rating_id: "${rt16b}", inspector_id: "${fi16}", checkpoint: "FINAL", scheduled_start_utc: "2026-08-18T12:30:00Z", scheduled_end_utc: "2026-08-18T13:30:00Z", air_handler_installed: true }
              as: FieldInspector
              as_user_id: "${fi16}"
              captures: { in16b: $.data.id }
          assert:
            - "the 11:30-12:30 request returns HTTP status == 409 with error_id == ERR_INSPECTOR_WINDOW_CONFLICT"
            - "the 12:30-13:30 request returns HTTP status == 201"
            - "Inspection.${in16b}.scheduled_start_utc == 2026-08-18T12:30:00Z"
            - "Inspection.${in16b}.status == SCHEDULED"
            - "Inspection.${in16a}.status == SCHEDULED"
            - "GET /inspections?inspector_id=${fi16} returns exactly 2 items"

