              as: ClaimsAgent
            - call: "POST /deposit-accounts/${pt_acct_ok_id}/ownership-interests"
              payload: { depositor_record_id: "${pt_p2_id}", interest_role: "PARTICIPANT", designated_share_bps: 5000 }
