    - entities.RecipientCandidate.fields.active_days_total
    - entities.RecipientCandidate.fields.listing_status
    - calculations.waitlist_priority_score
    distinguishing_aspect: 'The request supplies hostile values for one computed field, one aggregate
      field and one system enum; every one is discarded and recomputed, which distinguishes source: computed
      from source: input.'
    test_recipe:
      setup:
      - Program NLT-01 with coordinator staff exists.
      - The request carries the same clinical inputs as the clean creation case, so the recomputed score
        is again 20.01.
      setup_api_calls:
