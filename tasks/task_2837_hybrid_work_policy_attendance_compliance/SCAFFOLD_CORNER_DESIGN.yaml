            - call: "POST /exception-requests/${req_flag}/request-info"
              payload: { info_needed: "confirmation of the accommodation plan on file" }
              as: AccommodationSpecialist
              as_user_id: "acc-1"
            - call: "POST /exception-requests/${req_flag}/respond"
              payload: { response_note: "plan confirmed by occupational health" }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
            - call: "POST /exception-requests/${req_flag}/adjudicate"
              payload: { decision: "APPROVE", granted_relief_days: 2 }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { e_specialist: "$.data.error_id" }
            - call: "POST /exception-requests/${req_flag}/adjudicate"
              payload: { decision: "APPROVE", granted_relief_days: 2 }
              as: AccommodationSpecialist
              as_user_id: "acc-1"
          assert:
            - "Setup: ExceptionRequest.${req_flag}.interactive_process_required == true while ExceptionRequest.${req_plain}.interactive_process_required == false, from identical payloads - the flag comes from the EMPLOYEE, and Employee.${e_plain}.disability_accommodation_on_file == false confirms the omitted input defaulted"
            - "Call 1: HTTP 200. The non-interactive twin is approved by an HRBusinessPartner with NO information round at all: status == 'APPROVED', adjudicated_by_user_id == 'hrbp-1', info_round_count == 0"
            - "Call 3: ExceptionRequest.${req_flag}.info_round_count == 1 and status back to 'SUBMITTED', so ERR_INTERACTIVE_PROCESS_PENDING is no longer available and the next refusal must come from the role gate alone"
            - "Call 4: HTTP 409 ERR_ACCOMMODATION_SPECIALIST_REQUIRED - the same caller and the same payload that succeeded in call 1 is refused here, isolating the conditional rule"
            - "Call 5: HTTP 200 with status == 'APPROVED' and adjudicated_by_user_id == 'acc-1'"
            - "Employee.${e_flag}.approved_relief_days_total == 2 and Employee.${e_plain}.approved_relief_days_total == 2"

      - name: authentication_outranks_every_later_check_and_existence_outranks_shape
        claim_type: cascading
        grounds:
          - validations[priority=10, ERR_UNAUTHENTICATED]
          - validations[priority=20, existence]
          - validations[priority=30, ERR_INVALID_REQUEST]
        distinguishing_aspect: "One request carrying FOUR simultaneous defects - no X-User-ID, a role that the endpoint forbids, a foreign key that does not exist and a numeric field out of range - must answer with the band-10 error, and peeling the defects off one at a time walks the ladder downward, proving existence (20) is resolved before payload shape (30)."
        test_recipe:
          setup:
            - "One cycle and nothing else. The unknown cycle id is the fixed probe 00000000-0000-4000-8000-000000000001."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: WorkplaceProgramOffice
            - call: "POST /policy-cycles"
              payload: { cycle_label: "FY27-CRN52", effective_from: "2026-09-01", effective_to: "2026-12-31", days_in_office_floor: 2, badge_weight: 0.60, network_weight: 0.40, collaboration_target_score: 70.00, equity_variance_threshold_pct: 20.00 }
              as: WorkplaceProgramOffice
              captures: { cyc_id: $.data.id }
          trigger:
            - call: "POST /teams"
              payload: { policy_cycle_id: "00000000-0000-4000-8000-000000000001", team_code: "T-LADDER", expected_days_in_office_per_week: 9, core_collaboration_days: ["TUE"], headcount_planned: 4, signal_corroboration_required: false }
              as: Employee
              as_user_id: ""
              captures: { e_unauth: "$.data.error_id" }
            - call: "POST /teams"
              payload: { policy_cycle_id: "00000000-0000-4000-8000-000000000001", team_code: "T-LADDER", expected_days_in_office_per_week: 9, core_collaboration_days: ["TUE"], headcount_planned: 4, signal_corroboration_required: false }
              as: WorkplaceProgramOffice
              as_user_id: "wpo-1"
              captures: { e_notfound: "$.data.error_id" }
            - call: "POST /teams"
              payload: { policy_cycle_id: "${cyc_id}", team_code: "T-LADDER", expected_days_in_office_per_week: 9, core_collaboration_days: ["TUE"], headcount_planned: 4, signal_corroboration_required: false }
              as: WorkplaceProgramOffice
              as_user_id: "wpo-1"
              captures: { e_shape: "$.data.error_id" }
            - call: "POST /teams"
              payload: { policy_cycle_id: "${cyc_id}", team_code: "T-LADDER", expected_days_in_office_per_week: 3, core_collaboration_days: ["TUE"], headcount_planned: 4, signal_corroboration_required: false }
              as: WorkplaceProgramOffice
              as_user_id: "wpo-1"
              captures: { t_ladder: $.data.id }
          assert:
            - "Call 1: HTTP 401 ERR_UNAUTHENTICATED - the missing header is answered before the role check, before existence and before shape, so no 403, 404 or 422 leaks the fact that the cycle id is bogus"
            - "Call 2: HTTP 404 ERR_POLICY_CYCLE_NOT_FOUND even though expected_days_in_office_per_week is still 9 - existence at band 20 is resolved BEFORE shape at band 30"
            - "Call 3: HTTP 422 ERR_INVALID_REQUEST once the foreign key resolves, which is the same payload defect that call 2 hid"
            - "Call 4: HTTP 201 - the row is created only when every band is satisfied, and GET /teams?policy_cycle_id=${cyc_id} returns total_count 1, so calls 1 to 3 wrote nothing"
            - "The adjacent 12-versus-20 rung (an unauthorised caller naming a non-existent row answering ERR_UNAUTHORIZED rather than a 404) is owned by the §1.8 instance unauthorized_outranks_not_found and is not restated here"

      - name: duplicate_signal_outranks_the_observed_date_containment_gate
        claim_type: priority_conflict
        grounds:
          - validations[priority=60, ERR_DUPLICATE_SIGNAL]
          - validations[priority=64, ERR_SIGNAL_OUTSIDE_WEEK]
        excluded_because:
          difficulty_instance: duplicate_signal_outranks_signal_outside_week
          rationale: "That §1.8 instance already replays a dedupe_key together with an out-of-range observed_date and asserts that the band-60 uniqueness error wins, plus the band-50 ERR_WEEK_NOT_OPEN that outranks both. A §1.9 copy would restate the same three-way ladder."

      - name: seat_allocation_capacity_is_an_aggregate_per_week_check
        claim_type: aggregate
        grounds:
          - validations[priority=70, ERR_NEIGHBORHOOD_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: neighborhood_capacity_exact_fit_allowed_one_over_refused
          rationale: "That §1.8 instance already shows several individually-legal allocations whose overlapping sum breaches usable capacity, with the exact-fit case allowed and the one-over case refused. Aggregate validation has no residual corner left to probe."

      - name: desk_changeover_buffer_rejects_abutting_intervals
        claim_type: temporal
        grounds:
          - validations[priority=74, ERR_DESK_CHANGEOVER_CONFLICT]
        excluded_because:
          difficulty_instance: desk_assignment_closed_interval_changeover_buffer
          rationale: "That §1.8 instance already tests the CLOSED-interval predicate with a one-day sanitation buffer, including the abutting pair that a naive overlap test would accept and the VACATED row that must not conflict."

      - name: relocation_eligibility_depends_on_a_different_entitys_state
        claim_type: cross_entity
        grounds:
          - validations[priority=58, ERR_NO_APPROVED_CLASSIFICATION]
        excluded_because:
          difficulty_instance: relocation_requires_approved_and_non_onsite_classification
          rationale: "That §1.8 instance already walks the employee through no classification, a submitted-but-undecided one and an APPROVED ONSITE_REQUIRED one, asserting the two distinct errors and the success path. The cross-entity pattern is fully covered there."

      - name: stale_neighborhood_version_outranks_the_entitlement_ceiling
        claim_type: priority_conflict
        grounds:
          - validations[priority=40, ERR_STALE_NEIGHBORHOOD_VERSION]
          - validations[priority=70, ERR_SEAT_ENTITLEMENT_EXCEEDED]
        excluded_because:
          difficulty_instance: stale_neighborhood_version_outranks_seat_entitlement
          rationale: "That §1.8 instance already fires a request that is simultaneously stale and over the team's entitlement and asserts the 412. The interval-versus-concurrency instance above covers the OTHER side of the same OCC rung (band 34 beating band 40), so the pair is complete without a duplicate."

  - section: endpoints
    instances:

      - name: the_clock_endpoint_needs_no_identity_and_every_timestamp_follows_it
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - validations[priority=10, ERR_UNAUTHENTICATED]
        distinguishing_aspect: "This is the ONLY endpoint that is exempt from the X-User-ID requirement and the only one open to all seven roles, and it retroactively defines what 'now' means for every later write: rows created before the first call carry the documented default instant 2026-08-01T00:00:00Z, and finalized_at / updated_at follow whatever the clock was set to at the moment of the call."
        test_recipe:
          setup:
            - "Nothing. This instance deliberately breaks the shared convention of pinning the clock first, because the default-clock claim can only be observed before the first set call."
          setup_api_calls:
            - call: "POST /policy-cycles"
              payload: { cycle_label: "FY27-CRN53", effective_from: "2026-08-01", effective_to: "2026-12-31", days_in_office_floor: 2, badge_weight: 0.60, network_weight: 0.40, collaboration_target_score: 70.00, equity_variance_threshold_pct: 20.00 }
              as: WorkplaceProgramOffice
              captures: { cyc_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-08T14:30:00Z" }
              as: Employee
              as_user_id: ""
            - call: "POST /teams"
              payload: { policy_cycle_id: "${cyc_id}", team_code: "T-A", expected_days_in_office_per_week: 3, core_collaboration_days: ["TUE", "WED", "THU"], headcount_planned: 12, signal_corroboration_required: false }
              as: WorkplaceProgramOffice
              captures: { t_a: $.data.id }
            - call: "POST /employees"
              payload: { team_id: "${t_a}", employee_number: "E-1001", work_email: "e1001@corp.example", home_timezone: "America/New_York", tenure_start_date: "2024-03-04", demographic_band: "BAND_A", manager_user_id: "mgr-1", hr_partner_user_id: "hrbp-1", disability_accommodation_on_file: false }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { e1_id: $.data.id }
            - call: "POST /attendance-weeks"
              payload: { employee_id: "${e1_id}", iso_week: "2026-W37", week_start_date: "2026-09-07" }
              as: SystemIntegration
              as_user_id: "sys-1"
              captures: { w37: $.data.id }
            - call: "POST /attendance-weeks/${w37}/finalize"
              payload: {}
              as: SystemIntegration
              as_user_id: "sys-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-21T08:00:00Z" }
              as: SystemIntegration
              as_user_id: "sys-1"
            - call: "POST /employees/${e1_id}/status"
              payload: { target_status: "ON_LEAVE", note: "sabbatical" }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
            - call: "GET /policy-cycles/${cyc_id}"
              payload: {}
              as: WorkplaceProgramOffice
          assert:
            - "Setup: PolicyCycle.${cyc_id}.created_at == '2026-08-01T00:00:00Z' - the documented default logical clock, NOT real wall-clock time, so the value is reproducible across runs"
            - "Call 1: HTTP 200 with NO X-User-ID header at all - every other endpoint would answer ERR_UNAUTHENTICATED here; the response echoes current_utc == '2026-09-08T14:30:00Z'"
            - "Calls 2 to 4: created_at == '2026-09-08T14:30:00Z' on the Team, the Employee and the AttendanceWeek"
            - "Call 5: AttendanceWeek.${w37}.finalized_at == '2026-09-08T14:30:00Z', i.e. the finalize stamps the clock and not the week's own dates"
            - "Call 6: HTTP 200 from a DIFFERENT role - the endpoint's roles list is all seven, so SystemIntegration may also move the clock"
            - "Call 7: Employee.${e1_id}.updated_at == '2026-09-21T08:00:00Z' while created_at is still '2026-09-08T14:30:00Z' - the clock moved forward and only the mutation timestamp followed"
            - "Call 8: PolicyCycle.${cyc_id}.created_at is STILL '2026-08-01T00:00:00Z' - moving the clock never rewrites an existing timestamp"

      - name: manual_desk_assignment_validates_both_ends_of_the_junction
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /desk-assignments]
          - validations[priority=20, existence]
          - validations[priority=64, ERR_TEAM_ALLOCATION_MISMATCH]
        distinguishing_aspect: "DeskAssignment is the second junction entity, linking a SeatAllocation to an Employee, and the create must validate BOTH ends plus two derived constraints between them: the employee's team must equal the allocation's team, and the desk index must fall inside the neighborhood band reached through the allocation - a two-hop check that no single foreign key expresses."
        test_recipe:
          setup:
            - "Cycle, teams T-A and T-B, employee E-A on T-A and E-B on T-B, neighborhood N-1 with seat_count 13, buffer_seats 4 and desks 1..13, and a COMMITTED 4-seat allocation of T-A over [2026-W37, 2026-W40). Unknown-id probes use 00000000-0000-4000-8000-000000000002 and ...0003."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: WorkplaceProgramOffice
            - call: "POST /policy-cycles"
              payload: { cycle_label: "FY27-CRN54", effective_from: "2026-09-01", effective_to: "2026-12-31", days_in_office_floor: 2, badge_weight: 0.60, network_weight: 0.40, collaboration_target_score: 70.00, equity_variance_threshold_pct: 20.00 }
              as: WorkplaceProgramOffice
              captures: { cyc_id: $.data.id }
            - call: "POST /teams"
              payload: { policy_cycle_id: "${cyc_id}", team_code: "T-A", expected_days_in_office_per_week: 3, core_collaboration_days: ["TUE", "WED", "THU"], headcount_planned: 12, signal_corroboration_required: false }
              as: WorkplaceProgramOffice
              captures: { t_a: $.data.id }
            - call: "POST /teams"
              payload: { policy_cycle_id: "${cyc_id}", team_code: "T-B", expected_days_in_office_per_week: 3, core_collaboration_days: ["TUE", "WED", "THU"], headcount_planned: 12, signal_corroboration_required: false }
              as: WorkplaceProgramOffice
              captures: { t_b: $.data.id }
            - call: "POST /employees"
              payload: { team_id: "${t_a}", employee_number: "E-A", work_email: "ea@corp.example", home_timezone: "America/New_York", tenure_start_date: "2024-03-04", demographic_band: "BAND_A", manager_user_id: "mgr-1", hr_partner_user_id: "hrbp-1", disability_accommodation_on_file: false }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { e_a: $.data.id }
            - call: "POST /employees"
              payload: { team_id: "${t_b}", employee_number: "E-B", work_email: "eb@corp.example", home_timezone: "America/New_York", tenure_start_date: "2024-03-04", demographic_band: "BAND_B", manager_user_id: "mgr-2", hr_partner_user_id: "hrbp-1", disability_accommodation_on_file: false }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { e_b: $.data.id }
            - call: "POST /neighborhoods"
              payload: { policy_cycle_id: "${cyc_id}", anchor_team_id: "${t_a}", neighborhood_code: "N-1", site_code: "NYC-01", seat_count: 13, buffer_seats: 4, desk_index_from: 1, desk_index_to: 13 }
              as: WorkplaceProgramOffice
              captures: { n1: $.data.id, na_v1: $.data.version }
            - call: "POST /seat-allocations"
              payload: { neighborhood_id: "${n1}", team_id: "${t_a}", allocated_seats: 4, window_start_week: "2026-W37", window_end_week: "2026-W40", expected_neighborhood_version: "${na_v1}" }
              as: WorkplaceProgramOffice
              captures: { alloc1: $.data.id }
            - call: "POST /seat-allocations/${alloc1}/commit"
              payload: {}
              as: WorkplaceProgramOffice
          trigger:
            - call: "POST /desk-assignments"
              payload: { seat_allocation_id: "00000000-0000-4000-8000-000000000002", employee_id: "${e_a}", desk_index: 1, start_date: "2026-09-07", end_date: "2026-09-11" }
              as: WorkplaceProgramOffice
              captures: { e_alloc_missing: "$.data.error_id" }
            - call: "POST /desk-assignments"
              payload: { seat_allocation_id: "${alloc1}", employee_id: "00000000-0000-4000-8000-000000000003", desk_index: 1, start_date: "2026-09-07", end_date: "2026-09-11" }
              as: WorkplaceProgramOffice
              captures: { e_emp_missing: "$.data.error_id" }
            - call: "POST /desk-assignments"
              payload: { seat_allocation_id: "${alloc1}", employee_id: "${e_b}", desk_index: 1, start_date: "2026-09-07", end_date: "2026-09-11" }
              as: WorkplaceProgramOffice
              captures: { e_cross_team: "$.data.error_id" }
            - call: "POST /desk-assignments"
              payload: { seat_allocation_id: "${alloc1}", employee_id: "${e_a}", desk_index: 14, start_date: "2026-09-07", end_date: "2026-09-11" }
              as: WorkplaceProgramOffice
              captures: { e_outside_band: "$.data.error_id" }
            - call: "POST /desk-assignments"
              payload: { seat_allocation_id: "${alloc1}", employee_id: "${e_a}", desk_index: 13, start_date: "2026-09-07", end_date: "2026-09-11" }
              as: WorkplaceProgramOffice
              captures: { da1: $.data.id }
            - call: "GET /desk-assignments?seat_allocation_id=${alloc1}&status=ASSIGNED"
              payload: { seat_allocation_id: "${alloc1}", status: "ASSIGNED" }
              as: WorkplaceProgramOffice
          assert:
            - "Call 1: HTTP 404 ERR_SEAT_ALLOCATION_NOT_FOUND for the unresolvable first end of the link"
            - "Call 2: HTTP 404 ERR_EMPLOYEE_NOT_FOUND for the unresolvable second end"
            - "Call 3: HTTP 409 ERR_TEAM_ALLOCATION_MISMATCH - E-B belongs to T-B while the allocation belongs to T-A, a relation only visible by dereferencing both ends"
            - "Call 4: HTTP 409 ERR_TEAM_ALLOCATION_MISMATCH again, this time because desk_index 14 sits outside the band 1..13 reached via allocation -> neighborhood; the same error id covers both branches of the declared rule"
            - "Call 5: HTTP 201 with desk_index == 13, the LAST index in the band, assignment_mode == 'MANUAL' (not AUTO), status == 'ASSIGNED' and neighborhood_id == ${n1} derived through the allocation rather than supplied"
            - "Call 6: total_count == 1 - the four refusals created nothing, and Neighborhood.${n1}.peak_committed_seats is still 4, untouched by desk-level activity"

      - name: the_hold_endpoint_flips_one_flag_and_deliberately_moves_nothing_else
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /escalation-cases/{case_id}/hold]
          - entities.EscalationCase.fields.discretionary_hold
        distinguishing_aspect: "The hold endpoint's declared side-effect list is deliberately narrow - it sets the boolean and the actor, and explicitly does NOT change the stage or any roll-up on that call - so clearing a hold does not immediately re-sync a stale stage; the case only realigns on the NEXT cascade, which is observable as a two-step lag."
        test_recipe:
          setup:
            - "Cycle, team T-A (3 expected days), employee E-1001 with an APPROVED HYBRID classification (required_days 3, multiplier 1.0), and a FINALIZED 2026-W37 week with one 480-minute BADGE signal: credited 1, shortfall 2, pressure round_half_up(2 * 1.0 + 1, 2) == 3.00, one EscalationCase at COACHING with discretionary_hold false, Team.escalated_headcount 1, Team.formal_action_count 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: WorkplaceProgramOffice
            - call: "POST /policy-cycles"
              payload: { cycle_label: "FY27-CRN55", effective_from: "2026-09-01", effective_to: "2026-12-31", days_in_office_floor: 2, badge_weight: 0.60, network_weight: 0.40, collaboration_target_score: 70.00, equity_variance_threshold_pct: 20.00 }
              as: WorkplaceProgramOffice
              captures: { cyc_id: $.data.id }
            - call: "POST /teams"
              payload: { policy_cycle_id: "${cyc_id}", team_code: "T-A", expected_days_in_office_per_week: 3, core_collaboration_days: ["TUE", "WED", "THU"], headcount_planned: 12, signal_corroboration_required: false }
              as: WorkplaceProgramOffice
              captures: { t_a: $.data.id }
            - call: "POST /employees"
              payload: { team_id: "${t_a}", employee_number: "E-1001", work_email: "e1001@corp.example", home_timezone: "America/New_York", tenure_start_date: "2024-03-04", demographic_band: "BAND_A", manager_user_id: "mgr-1", hr_partner_user_id: "hrbp-1", disability_accommodation_on_file: false }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { e1_id: $.data.id, e1_v1: $.data.version }
            - call: "POST /eligibility-classifications"
              payload: { employee_id: "${e1_id}", requested_class: "HYBRID", justification_code: "ROLE_DESIGN", effective_from: "2026-09-01", expected_employee_version: "${e1_v1}" }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { cls1: $.data.id }
            - call: "POST /eligibility-classifications/${cls1}/submit"
              payload: {}
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
            - call: "POST /eligibility-classifications/${cls1}/decision"
              payload: { decision: "APPROVE" }
              as: PeopleManager
              as_user_id: "mgr-1"
            - call: "POST /attendance-weeks"
              payload: { employee_id: "${e1_id}", iso_week: "2026-W37", week_start_date: "2026-09-07" }
              as: SystemIntegration
              as_user_id: "sys-1"
              captures: { w37: $.data.id }
            - call: "POST /attendance-weeks/${w37}/signals"
              payload: { signal_source: "BADGE", site_code: "NYC-01", observed_date: "2026-09-08", minutes_present: 480, dedupe_key: "B-0908" }
              as: SystemIntegration
              as_user_id: "sys-1"
            - call: "POST /attendance-weeks/${w37}/finalize"
              payload: {}
              as: SystemIntegration
              as_user_id: "sys-1"
            - call: "GET /escalation-cases?employee_id=${e1_id}"
              payload: { employee_id: "${e1_id}" }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { case_id: "$.data[0].id" }
          trigger:
            - call: "POST /escalation-cases/${case_id}/hold"
              payload: { discretionary_hold: true, action_note: "coaching paused pending an accommodation conversation" }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
            - call: "POST /attendance-weeks/${w37}/amend"
              payload: { amendment_reason: "badge feed backfilled the rest of the week" }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
            - call: "POST /escalation-cases/${case_id}/hold"
              payload: { discretionary_hold: false, action_note: "conversation complete, automation may resume" }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
            - call: "POST /attendance-weeks"
              payload: { employee_id: "${e1_id}", iso_week: "2026-W38", week_start_date: "2026-09-14" }
              as: SystemIntegration
              as_user_id: "sys-1"
              captures: { w38: $.data.id }
            - call: "POST /attendance-weeks/${w38}/signals"
              payload: { signal_source: "BADGE", site_code: "NYC-01", observed_date: "2026-09-15", minutes_present: 480, dedupe_key: "B-0915" }
              as: SystemIntegration
              as_user_id: "sys-1"
            - call: "POST /attendance-weeks/${w38}/signals"
              payload: { signal_source: "BADGE", site_code: "NYC-01", observed_date: "2026-09-16", minutes_present: 480, dedupe_key: "B-0916" }
              as: SystemIntegration
              as_user_id: "sys-1"
            - call: "POST /attendance-weeks/${w38}/signals"
              payload: { signal_source: "BADGE", site_code: "NYC-01", observed_date: "2026-09-17", minutes_present: 480, dedupe_key: "B-0917" }
              as: SystemIntegration
              as_user_id: "sys-1"
            - call: "POST /attendance-weeks/${w38}/finalize"
              payload: {}
              as: SystemIntegration
              as_user_id: "sys-1"
          assert:
            - "Call 1: HTTP 200 with discretionary_hold == true, last_action_by_user_id == 'hrbp-1' and stage STILL 'COACHING' - the endpoint declares no stage change, so Team.${t_a}.escalated_headcount stays 1 and formal_action_count stays 0"
            - "Call 2: AttendanceWeek.${w37}.status == 'AMENDED' with shortfall_days 0 and Employee.${e1_id}.non_compliance_pressure == 0.00, compliance_state == 'COMPLIANT' - yet the case is STILL 'COACHING', because the held case skips pressure_derived_stage; escalated_headcount is still 1 even though the employee is compliant"
            - "Call 3: HTTP 200 with discretionary_hold == false and stage STILL 'COACHING' - clearing the hold does not retroactively re-run the stage derivation on the same call, which is the declared narrow side-effect list"
            - "Call 8: required_days 3, credited_days 3, shortfall_days 0, consecutive_breach_weeks 0, pressure 0.00 - and NOW the cascade re-syncs the unheld case: stage == 'CURED', Employee.escalation_stage == 'CURED', Team.${t_a}.escalated_headcount == 0"
            - "PolicyCycle.${cyc_id}.formal_action_total == 0 throughout - the case never entered the formal-action band, so the hold could not corrupt the roll-up"

      - name: auto_desk_assignment_is_allowed_only_with_a_committed_allocation
        claim_type: conditional_action
        grounds:
          - endpoints[POST /desk-assignments/auto]
          - validations[priority=80, ERR_NO_ELIGIBLE_DESK]
        excluded_because:
          difficulty_instance: auto_desk_requires_committed_allocation_of_the_employees_own_team
          rationale: "That §1.8 instance already probes the precondition from both sides - a RESERVED-only allocation and another team's COMMITTED allocation both yield ERR_NO_ELIGIBLE_DESK - and the §1.9 desk-selector instance covers the success path and the ranking. Nothing conditional remains."

      - name: release_reverses_every_side_effect_the_commit_applied
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /seat-allocations/{allocation_id}/release]
        excluded_because:
          difficulty_instance: seat_release_restores_peak_utilization_and_chargeback
          rationale: "That §1.8 instance already releases a COMMITTED allocation and reconciles the neighborhood's peak load, utilization, allocation_state and the chargeback line back to their pre-commit values with no drift, which is the whole of this endpoint's side-effect list."

      - name: review_submit_is_the_computed_read_of_four_measures
        claim_type: computed_read
        grounds:
          - endpoints[POST /recalibration-reviews/{review_id}/submit]
        excluded_because:
          difficulty_instance: chargeback_round_per_line_then_sum
          rationale: "The submit response and a subsequent GET of the same review return one row, and that §1.8 instance already asserts collaboration_index, meets_collaboration_target, total_space_chargeback_cents and the equity trio on it. The §1.9 equity instance re-reads the same four fields under small-cell suppression, so a dedicated read instance would add no discrimination."

