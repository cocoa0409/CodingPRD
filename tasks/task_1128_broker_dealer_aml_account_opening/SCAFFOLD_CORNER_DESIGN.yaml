      - name: scan_dedup_second_run_creates_nothing
        claim_type: bulk_action
        grounds: [endpoints, entities.MonitoringAlert.fields.window_end]
        distinguishing_aspect: "Re-running the scan on the same clock day creates 0 new alerts (dedup key rule_code+account_id+window_end) and flags 0 additional transactions; the first run created 1."
        test_recipe:
          setup: ["OPEN LOW account with three structuring BUYs; rule created."]
