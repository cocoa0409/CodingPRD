scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_station_success_and_computed_counters_zero
        claim_type: creation
        grounds: ['entities.Station']
        distinguishing_aspect: "POST /baggage/stations with all required fields returns 201; input fields echoed; computed counters initialize to 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn: $.data.id } }
          assert:
            - "HTTP 201; Station.${stn}.station_code == JFK"
            - "Station.${stn}.open_report_count == 0"
            - "Station.${stn}.recovered_bag_count == 0"
            - "Station.${stn}.mishandled_report_count == 0"
            - "Station.${stn}.version == 1"

      - name: get_report_nonexistent_returns_404
        claim_type: not_found
        grounds: ['entities.IrregularityReport', 'errors[ERR_NOT_FOUND]']
        distinguishing_aspect: "GET on a well-formed but unknown report id returns the error envelope with ERR_NOT_FOUND and HTTP 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "GET /baggage/reports/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: ClaimsAdjuster, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_bag_tag_default_declared_value
        claim_type: defaults
        grounds: ['entities.BagTag.fields.declared_value_cents']
        distinguishing_aspect: "Omitting declared_value_cents applies the default 0; the response shows status CHECKED and declared_value_cents == 0."
        test_recipe:
          setup: ["carrier AA and passenger exist"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/carriers", payload: { carrier_code: "AA", name: "Air Alpha", is_interline_partner: false }, as: SystemAdmin, captures: { car_aa: $.data.id } }
            - { call: "POST /baggage/passengers", payload: { full_name: "Pat Flyer", email: "pat@x.com", tier: "STANDARD" }, as: BaggageServiceAgent, captures: { pax: $.data.id } }
          trigger:
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234601", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: false, weight_kg: 20 }, as: BaggageServiceAgent, captures: { bag: $.data.id } }
          assert:
            - "HTTP 201; BagTag.${bag}.declared_value_cents == 0"
            - "BagTag.${bag}.status == CHECKED"

      - name: create_report_computes_liability_fields
        claim_type: computed_fields
        grounds: ['entities.IrregularityReport.fields.liable_carrier_id', 'entities.IrregularityReport.fields.liability_regime', 'entities.IrregularityReport.fields.effective_cap_cents']
        distinguishing_aspect: "Report creation computes liable_carrier_id as the LAST routing carrier (interline delivering-carrier rule), liability_regime from is_international, and effective_cap_cents 170016 for a 20kg international bag with no declared value."
        test_recipe:
          setup: ["station JFK; carriers AA (own) and BA (interline partner); passenger; international bag routed [AA, BA]"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn: $.data.id } }
            - { call: "POST /baggage/carriers", payload: { carrier_code: "AA", name: "Air Alpha", is_interline_partner: false }, as: SystemAdmin, captures: { car_aa: $.data.id } }
            - { call: "POST /baggage/carriers", payload: { carrier_code: "BA", name: "Air Beta", is_interline_partner: true }, as: SystemAdmin, captures: { car_ba: $.data.id } }
            - { call: "POST /baggage/passengers", payload: { full_name: "Pat Flyer", email: "pat@x.com", tier: "STANDARD" }, as: BaggageServiceAgent, captures: { pax: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234602", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}", "${car_ba}"], is_international: true, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag: $.data.id } }
          trigger:
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00102", passenger_id: "${pax}", bag_tag_id: "${bag}", station_id: "${stn}", type: "DELAYED" }, as: BaggageServiceAgent, captures: { rpt: $.data.id, cap: $.data.effective_cap_cents, regime: $.data.liability_regime, carrier: $.data.liable_carrier_id } }
          assert:
            - "IrregularityReport.${rpt}.liable_carrier_id == ${car_ba}"
            - "IrregularityReport.${rpt}.liability_regime == MONTREAL"
            - "IrregularityReport.${rpt}.effective_cap_cents == 170016"
            - "IrregularityReport.${rpt}.opened_on == 2026-08-01"

      - name: create_bag_tag_with_system_fields_rejected
        claim_type: system_fields
        grounds: ['entities.BagTag', 'errors[ERR_INVALID_REQUEST]']
        distinguishing_aspect: "Client-supplied system fields (id, version, created_at) in a create payload are rejected with ERR_INVALID_REQUEST; ids are server-minted."
        test_recipe:
          setup: ["carrier AA and passenger exist"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/carriers", payload: { carrier_code: "AA", name: "Air Alpha", is_interline_partner: false }, as: SystemAdmin, captures: { car_aa: $.data.id } }
            - { call: "POST /baggage/passengers", payload: { full_name: "Pat Flyer", email: "pat@x.com", tier: "STANDARD" }, as: BaggageServiceAgent, captures: { pax: $.data.id } }
          trigger:
            - { call: "POST /baggage/bag-tags", payload: { id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", version: 1, tag_number: "0001234603", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: false, weight_kg: 20 }, as: BaggageServiceAgent, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: tag_number_must_be_ten_digits
        claim_type: type_constraints
        grounds: ['entities.BagTag.fields.tag_number', 'errors[ERR_INVALID_REQUEST]']
        distinguishing_aspect: "tag_number '123' violates the 10-digit format and is rejected with ERR_INVALID_REQUEST before any duplicate check."
        test_recipe:
          setup: ["carrier AA and passenger exist"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/carriers", payload: { carrier_code: "AA", name: "Air Alpha", is_interline_partner: false }, as: SystemAdmin, captures: { car_aa: $.data.id } }
            - { call: "POST /baggage/passengers", payload: { full_name: "Pat Flyer", email: "pat@x.com", tier: "STANDARD" }, as: BaggageServiceAgent, captures: { pax: $.data.id } }
          trigger:
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "123", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: false, weight_kg: 20 }, as: BaggageServiceAgent, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: tracing_event_immutable_common_fields_false
        claim_type: immutability
        grounds: ['entities.TracingEvent']
        distinguishing_aspect: "TracingEvent is an append-only event with common_fields=false: its JSON carries id and created_at but no version or updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["station JFK; carrier AA; passenger; domestic bag; DELAYED report in TRACING"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn: $.data.id } }
            - { call: "POST /baggage/carriers", payload: { carrier_code: "AA", name: "Air Alpha", is_interline_partner: false }, as: SystemAdmin, captures: { car_aa: $.data.id } }
            - { call: "POST /baggage/passengers", payload: { full_name: "Pat Flyer", email: "pat@x.com", tier: "STANDARD" }, as: BaggageServiceAgent, captures: { pax: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234604", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: false, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag: $.data.id } }
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00104", passenger_id: "${pax}", bag_tag_id: "${bag}", station_id: "${stn}", type: "DELAYED" }, as: BaggageServiceAgent, captures: { rpt: $.data.id } }
          trigger:
            - { call: "POST /baggage/reports/${rpt}/tracing-events", payload: { carrier_id: "${car_aa}", station_id: "${stn}", event_type: "FORWARDED" }, as: BaggageServiceAgent, captures: { evt: $.data.id } }
          assert:
            - "HTTP 201; TracingEvent.${evt} response JSON has keys id and created_at"
            - "TracingEvent.${evt} response JSON has no version key and no updated_at key"
            - "IrregularityReport.${rpt}.status == TRACING (FORWARDED does not change report state)"

      - name: report_fk_integrity_unknown_bag_returns_not_found
        claim_type: parent_relationships
        grounds: ['entities.IrregularityReport.fields.bag_tag_id', 'errors[ERR_NOT_FOUND]']
        distinguishing_aspect: "Flat-topology FK integrity: creating a report with a non-existent bag_tag_id UUID fails with ERR_NOT_FOUND (404) before any business rule runs."
        test_recipe:
          setup: ["station JFK and passenger exist"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn: $.data.id } }
            - { call: "POST /baggage/passengers", payload: { full_name: "Pat Flyer", email: "pat@x.com", tier: "STANDARD" }, as: BaggageServiceAgent, captures: { pax: $.data.id } }
          trigger:
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00105", passenger_id: "${pax}", bag_tag_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", station_id: "${stn}", type: "DELAYED" }, as: BaggageServiceAgent, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: reports_list_pagination_interacts_with_filters
        claim_type: listing
        grounds: ['response_envelope', 'entities.IrregularityReport']
        distinguishing_aspect: "List endpoint honors limit/offset with envelope fields: 3 reports, limit=2 yields total_count 3 and has_more true at offset 0, one item and has_more false at offset 2."
        test_recipe:
          setup: ["station JFK; carrier AA; passenger; three bags each with a DELAYED report"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn: $.data.id } }
            - { call: "POST /baggage/carriers", payload: { carrier_code: "AA", name: "Air Alpha", is_interline_partner: false }, as: SystemAdmin, captures: { car_aa: $.data.id } }
            - { call: "POST /baggage/passengers", payload: { full_name: "Pat Flyer", email: "pat@x.com", tier: "STANDARD" }, as: BaggageServiceAgent, captures: { pax: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234606", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: false, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag1: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234607", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: false, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag2: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234608", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: false, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag3: $.data.id } }
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00106", passenger_id: "${pax}", bag_tag_id: "${bag1}", station_id: "${stn}", type: "DELAYED" }, as: BaggageServiceAgent }
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00107", passenger_id: "${pax}", bag_tag_id: "${bag2}", station_id: "${stn}", type: "DELAYED" }, as: BaggageServiceAgent }
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00108", passenger_id: "${pax}", bag_tag_id: "${bag3}", station_id: "${stn}", type: "DELAYED" }, as: BaggageServiceAgent }
          trigger:
            - { call: "GET /baggage/reports", payload: { station_id: "${stn}", limit: 2, offset: 0 }, as: ClaimsAdjuster }
            - { call: "GET /baggage/reports", payload: { station_id: "${stn}", limit: 2, offset: 2 }, as: ClaimsAdjuster }
          assert:
            - "First page: data has exactly 2 items; meta pagination total_count == 3; has_more == true"
            - "Second page: data has exactly 1 item; has_more == false"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: delayed_report_initial_state_tracing_and_bag_mishandled
        claim_type: initial_state
        grounds: ['state_machines.IrregularityReport.OPEN_to_TRACING', 'state_machines.BagTag.CHECKED_to_MISHANDLED']
        distinguishing_aspect: "A DELAYED report is never observable in OPEN: creation auto-enters TRACING and the bag flips CHECKED -> MISHANDLED; filing station open_report_count becomes 1."
        test_recipe:
          setup: ["station JFK; carrier AA; passenger; domestic bag CHECKED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn: $.data.id } }
            - { call: "POST /baggage/carriers", payload: { carrier_code: "AA", name: "Air Alpha", is_interline_partner: false }, as: SystemAdmin, captures: { car_aa: $.data.id } }
            - { call: "POST /baggage/passengers", payload: { full_name: "Pat Flyer", email: "pat@x.com", tier: "STANDARD" }, as: BaggageServiceAgent, captures: { pax: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234611", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: false, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag: $.data.id } }
          trigger:
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00111", passenger_id: "${pax}", bag_tag_id: "${bag}", station_id: "${stn}", type: "DELAYED" }, as: BaggageServiceAgent, captures: { rpt: $.data.id, st: $.data.status } }
          assert:
            - "IrregularityReport.${rpt}.status == TRACING (in the creation response itself)"
            - "BagTag.${bag}.status == MISHANDLED"
            - "Station.${stn}.open_report_count == 1"

      - name: damaged_report_initial_state_damage_review
        claim_type: initial_state
        grounds: ['state_machines.IrregularityReport.OPEN_to_DAMAGE_REVIEW', 'state_machines.BagTag.CHECKED_to_DELIVERED_DAMAGED']
        distinguishing_aspect: "The creation-time branch forks by type: a DAMAGED report enters DAMAGE_REVIEW (not TRACING) and its bag becomes DELIVERED_DAMAGED, not MISHANDLED."
        test_recipe:
          setup: ["station JFK; carrier AA; passenger; domestic bag CHECKED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn: $.data.id } }
            - { call: "POST /baggage/carriers", payload: { carrier_code: "AA", name: "Air Alpha", is_interline_partner: false }, as: SystemAdmin, captures: { car_aa: $.data.id } }
            - { call: "POST /baggage/passengers", payload: { full_name: "Pat Flyer", email: "pat@x.com", tier: "STANDARD" }, as: BaggageServiceAgent, captures: { pax: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234612", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: false, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag: $.data.id } }
          trigger:
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00112", passenger_id: "${pax}", bag_tag_id: "${bag}", station_id: "${stn}", type: "DAMAGED" }, as: BaggageServiceAgent, captures: { rpt: $.data.id } }
          assert:
            - "IrregularityReport.${rpt}.status == DAMAGE_REVIEW"
            - "BagTag.${bag}.status == DELIVERED_DAMAGED"

      - name: accept_settlement_from_claim_review_invalid
        claim_type: invalid_transition
        grounds: ['state_machines.IrregularityReport.SETTLEMENT_OFFERED_to_SETTLEMENT_ACCEPTED', 'errors[ERR_SETTLEMENT_NOT_OFFERED]']
        distinguishing_aspect: "accept-settlement from CLAIM_REVIEW (offer never made) is rejected with ERR_SETTLEMENT_NOT_OFFERED; the report stays in CLAIM_REVIEW."
        test_recipe:
          setup: ["station JFK; carrier AA; passenger; DAMAGED report assessed non-repairable (contents 5000) -> CLAIM_REVIEW"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn: $.data.id } }
            - { call: "POST /baggage/carriers", payload: { carrier_code: "AA", name: "Air Alpha", is_interline_partner: false }, as: SystemAdmin, captures: { car_aa: $.data.id } }
            - { call: "POST /baggage/passengers", payload: { full_name: "Pat Flyer", email: "pat@x.com", tier: "STANDARD" }, as: BaggageServiceAgent, captures: { pax: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234613", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: false, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag: $.data.id } }
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00113", passenger_id: "${pax}", bag_tag_id: "${bag}", station_id: "${stn}", type: "DAMAGED" }, as: BaggageServiceAgent, captures: { rpt: $.data.id } }
            - { call: "POST /baggage/reports/${rpt}/assess-damage", payload: { repairable: false, contents_damage_cents: 5000 }, as: ClaimsAdjuster }
          trigger:
            - { call: "POST /baggage/reports/${rpt}/accept-settlement", payload: {}, as: Passenger, as_user_id: "${pax}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SETTLEMENT_NOT_OFFERED"
            - "HTTP status == 409"
            - "IrregularityReport.${rpt}.status == CLAIM_REVIEW"

      - name: closed_report_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ['state_machines.IrregularityReport.SETTLEMENT_ACCEPTED_to_CLOSED', 'errors[ERR_REPORT_NOT_IN_CLAIM_REVIEW]']
        distinguishing_aspect: "From terminal CLOSED no transition is possible: offer-settlement returns ERR_REPORT_NOT_IN_CLAIM_REVIEW and the report remains CLOSED."
        test_recipe:
          setup:
            - "station JFK; carrier AA; passenger; international bag; DELAYED report"
            - "Full lifecycle executed: swept DECLARED_LOST -> assess-loss 100000 -> offer (MISCONNECT) -> accept -> settlement payment -> mark-paid -> CLOSED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn: $.data.id } }
            - { call: "POST /baggage/carriers", payload: { carrier_code: "AA", name: "Air Alpha", is_interline_partner: false }, as: SystemAdmin, captures: { car_aa: $.data.id } }
            - { call: "POST /baggage/passengers", payload: { full_name: "Pat Flyer", email: "pat@x.com", tier: "STANDARD" }, as: BaggageServiceAgent, captures: { pax: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234614", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: true, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag: $.data.id } }
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00114", passenger_id: "${pax}", bag_tag_id: "${bag}", station_id: "${stn}", type: "DELAYED" }, as: BaggageServiceAgent, captures: { rpt: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-22T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/reports/${rpt}/assess-loss", payload: { contents_loss_cents: 100000 }, as: ClaimsAdjuster }
            - { call: "POST /baggage/reports/${rpt}/offer-settlement", payload: { root_cause: "MISCONNECT", root_cause_station_id: "${stn}" }, as: ClaimsAdjuster }
            - { call: "POST /baggage/reports/${rpt}/accept-settlement", payload: {}, as: Passenger, as_user_id: "${pax}", captures: { rpt_v: $.data.version } }
            - { call: "POST /baggage/reports/${rpt}/settlement-payments", payload: { expected_report_version: "${rpt_v}" }, as: ClaimsAdjuster, captures: { pay: $.data.id } }
            - { call: "POST /baggage/settlement-payments/${pay}/mark-paid", payload: {}, as: ClaimsAdjuster }
          trigger:
            - { call: "POST /baggage/reports/${rpt}/offer-settlement", payload: { root_cause: "MISCONNECT", root_cause_station_id: "${stn}" }, as: ClaimsAdjuster, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_REPORT_NOT_IN_CLAIM_REVIEW"
            - "HTTP status == 409"
            - "IrregularityReport.${rpt}.status == CLOSED"

      - name: adjudicate_twice_not_idempotent
        claim_type: idempotency
        grounds: ['state_machines.ExpenseClaim.SUBMITTED_to_APPROVED', 'errors[ERR_INVALID_STATE_TRANSITION]']
        distinguishing_aspect: "The same adjudicate trigger twice: the first approves, the second is rejected with ERR_INVALID_STATE_TRANSITION because the claim is no longer SUBMITTED; reimbursable_total_cents is unchanged."
        test_recipe:
          setup: ["station JFK; carrier AA; passenger; domestic bag; DELAYED report TRACING; one claim SUBMITTED (receipt 4000 on 2026-08-02)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn: $.data.id } }
            - { call: "POST /baggage/carriers", payload: { carrier_code: "AA", name: "Air Alpha", is_interline_partner: false }, as: SystemAdmin, captures: { car_aa: $.data.id } }
            - { call: "POST /baggage/passengers", payload: { full_name: "Pat Flyer", email: "pat@x.com", tier: "STANDARD" }, as: BaggageServiceAgent, captures: { pax: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234615", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: false, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag: $.data.id } }
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00115", passenger_id: "${pax}", bag_tag_id: "${bag}", station_id: "${stn}", type: "DELAYED" }, as: BaggageServiceAgent, captures: { rpt: $.data.id } }
            - { call: "POST /baggage/expense-claims", payload: { report_id: "${rpt}", receipts: [{ incurred_on: "2026-08-02", description: "meals", amount_minor: 4000, currency_code: "USD" }] }, as: Passenger, as_user_id: "${pax}", captures: { clm: $.data.id } }
          trigger:
            - { call: "POST /baggage/expense-claims/${clm}/adjudicate", payload: { decision: "APPROVE" }, as: ClaimsAdjuster }
            - { call: "POST /baggage/expense-claims/${clm}/adjudicate", payload: { decision: "APPROVE" }, as: ClaimsAdjuster, captures: { err: $.data.error_id } }
          assert:
            - "Second adjudicate: error_id == ERR_INVALID_STATE_TRANSITION"
            - "ExpenseClaim.${clm}.status == APPROVED"
            - "ExpenseClaim.${clm}.reimbursable_total_cents == 4000"

