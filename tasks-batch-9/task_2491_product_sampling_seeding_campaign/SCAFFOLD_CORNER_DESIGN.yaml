      - name: allocation_into_a_locked_wave_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_INVALID_WAVE_STATE]
        excluded_because:
          difficulty_instance: shipment_allocation_requires_planned_wave
          rationale: "That §1.8 cross_entity_state_dependency instance already allocates into a LOCKED wave and asserts 409 ERR_INVALID_WAVE_STATE together with the full no-side-effect end state (wave unit count, kit reservations, campaign budget). A §1.9 duplicate would add no distinguishing coverage."

      - name: enrolling_into_a_suspended_campaign_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CAMPAIGN_NOT_ACCEPTING_ENROLLMENTS]
        excluded_because:
          difficulty_instance: suspended_campaign_state_beats_exhausted_budget_on_allocation
          rationale: "That §1.8 priority_pair_validation_conflict instance triggers ERR_CAMPAIGN_NOT_ACCEPTING_ENROLLMENTS from a SUSPENDED campaign while the budget rule is also violated, which subsumes a plain single-cause version of the same code."

      - name: syndicating_content_from_a_flagged_panelist_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_PANELIST_INTEGRITY_HOLD]
        excluded_because:
          difficulty_instance: flagged_panelist_safety_beats_unregistered_retailer_referential_on_syndication
          rationale: "That §1.8 priority_pair_validation_conflict instance already produces ERR_PANELIST_INTEGRITY_HOLD from a FLAGGED panelist while an unregistered retailer is simultaneously in play, proving both the code and its precedence."

      - name: center_daily_capacity_ceiling_is_enforced
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CENTER_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: center_aggregate_capacity_half_open_windows
          rationale: "That §1.8 resource_temporal_overlap instance drives ERR_CENTER_CAPACITY_EXCEEDED through overlapping half-open wave windows at the center-aggregate ceiling, which is strictly richer than a single-wave version of the same code."

  # ===========================================================================
  # Table 7 breadth: role denials on other roles' exclusive operations, the two
  # shared operations, the entity-backed Panelist ownership rule, and the two
  # header-level auth checks (§1.4 priorities 1 and 2).
  - section: rbac
    instances:

      - name: fulfillment_ops_cannot_open_campaign_screening
        claim_type: exclusive_operations
        grounds:
          - roles.CampaignManager.exclusive_operations
          - errors[ERR_FORBIDDEN_ROLE]
          - validations[priority=3]
        distinguishing_aspect: "A lifecycle transition that is exclusive to CampaignManager is attempted by the role that owns inventory: every business precondition for the transition is satisfied (the campaign is DRAFT and has an ACTIVE kit line), so only the role check can produce the 403 and the campaign must not move."
        test_recipe:
          setup:
            - "One DRAFT campaign with one ACTIVE kit line, i.e. ready for open-screening in every respect except the caller's role."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { name: "Role Guard", objective_type: "TRIAL_GENERATION", target_segment_codes: ["URBAN_MILLENNIAL"], syndication_retailer_ids: [], sampling_window_start: "2026-07-01T00:00:00Z", sampling_window_end: "2026-09-30T00:00:00Z", budget_total_cents: 1000000 }
              as: CampaignManager
              captures: { camp_id: $.data.id }
            - call: "POST /kit-lines"
              payload: { campaign_id: "${camp_id}", component_sku: "HERO-1", component_role: "HERO_PRODUCT", unit_cost_cents: 1417, quantity_per_kit: 1, component_discount_pct: 0.8 }
              as: CampaignManager
              captures: { kl1_id: $.data.id }
            - call: "GET /campaigns/${camp_id}"
              payload: {}
              as: CampaignManager
              captures: { camp_v_before: $.data.version }
          trigger:
            - call: "POST /campaigns/${camp_id}/open-screening"
              payload: {}
              as: FulfillmentOps
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "${err_id} == ERR_FORBIDDEN_ROLE"
            - "Campaign.${camp_id}.status == DRAFT"
            - "Campaign.${camp_id}.version == ${camp_v_before} — the rejected transition performs no write, so the version left behind by the kit-line create is unchanged"
            - "Campaign.${camp_id}.kit_assembly_unit_cost_cents == 283 — recomputed by the kit-line create in setup and untouched by the denied transition (1417 * 1 * (1 - 0.8) = 283.4 -> 283)"
            - "Campaign.${camp_id}.budget_committed_cents == 0 and budget_available_cents == 1000000 (no allocation has happened)"

      - name: campaign_manager_cannot_receive_kit_units
        claim_type: exclusive_operations
        grounds:
          - roles.FulfillmentOps.exclusive_operations
          - errors[ERR_FORBIDDEN_ROLE]
          - validations[priority=3]
        distinguishing_aspect: "The mirror-image denial: the role that defines the kit cannot move physical stock. The kit line exists and the payload is valid, so a 403 here proves receipts are gated on role rather than on ownership of the parent campaign."
        test_recipe:
          setup:
            - "One DRAFT campaign with one ACTIVE kit line holding zero units."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { name: "Stock Guard", objective_type: "TRIAL_GENERATION", target_segment_codes: ["URBAN_MILLENNIAL"], syndication_retailer_ids: [], sampling_window_start: "2026-07-01T00:00:00Z", sampling_window_end: "2026-09-30T00:00:00Z", budget_total_cents: 1000000 }
              as: CampaignManager
              captures: { camp_id: $.data.id }
            - call: "POST /kit-lines"
              payload: { campaign_id: "${camp_id}", component_sku: "HERO-1", component_role: "HERO_PRODUCT", unit_cost_cents: 1417, quantity_per_kit: 1, component_discount_pct: 0.8 }
              as: CampaignManager
              captures: { kl1_id: $.data.id, kl1_v: $.data.version }
          trigger:
            - call: "POST /kit-lines/${kl1_id}/receipts"
              payload: { units: 10 }
              as: CampaignManager
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "${err_id} == ERR_FORBIDDEN_ROLE"
            - "KitLine.${kl1_id}.units_received == 0 and units_available == 0"
            - "KitLine.${kl1_id}.version == ${kl1_v}"

      - name: panelist_cannot_create_a_campaign
        claim_type: exclusive_operations
        grounds:
          - roles.Panelist.shared_operations
          - roles.CampaignManager.exclusive_operations
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "The entity-backed role is confined to its own two write families: even with a real Panelist row behind X-User-ID, campaign creation is refused at the role layer and no campaign row appears."
        test_recipe:
          setup:
            - "One registered panelist whose id is used as X-User-ID; no campaign exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /panelists"
              payload: { email: "rb1@example.com", display_name: "RB One", address_hash: "H-RB1", account_opened_at: "2026-01-01T00:00:00Z", segment_code: "URBAN_MILLENNIAL" }
              as: Anonymous
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /campaigns"
              payload: { name: "Panelist Campaign", objective_type: "TRIAL_GENERATION", target_segment_codes: ["URBAN_MILLENNIAL"], syndication_retailer_ids: [], sampling_window_start: "2026-07-01T00:00:00Z", sampling_window_end: "2026-09-30T00:00:00Z", budget_total_cents: 1000000 }
              as: Panelist
              as_user_id: "${p1_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "${err_id} == ERR_FORBIDDEN_ROLE"
            - "GET /campaigns as CampaignManager returns total_count == 0"

      - name: anonymous_can_register_a_panelist_but_cannot_enroll
        claim_type: shared_operations
        grounds:
          - roles.Anonymous
          - endpoints[POST /panelists]
          - endpoints[POST /enrollments]
          - validations[priority=3]
        distinguishing_aspect: "The self-service role has exactly one door: the same Anonymous caller succeeds on panel sign-up (its only shared operation) and is refused on enrollment creation. The refusal is a role refusal at priority 3, which is why it arrives before the campaign-state objection that the DRAFT campaign would otherwise raise at priority 11."
        test_recipe:
          setup:
            - "One DRAFT campaign; no panelist yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { name: "Anon Door", objective_type: "TRIAL_GENERATION", target_segment_codes: ["URBAN_MILLENNIAL"], syndication_retailer_ids: [], sampling_window_start: "2026-07-01T00:00:00Z", sampling_window_end: "2026-09-30T00:00:00Z", budget_total_cents: 1000000 }
              as: CampaignManager
              captures: { camp_id: $.data.id }
          trigger:
            - call: "POST /panelists"
              payload: { email: "anon1@example.com", display_name: "Anon One", address_hash: "H-ANON1", account_opened_at: "2026-01-01T00:00:00Z", segment_code: "URBAN_MILLENNIAL" }
              as: Anonymous
              captures: { p1_id: $.data.id }
            - call: "POST /enrollments"
              payload: { campaign_id: "${camp_id}", panelist_id: "${p1_id}", screening_answers: { household_size: 2, attests_no_resale: true } }
              as: Anonymous
              captures: { err_id: $.data.error_id }
          assert:
            - "the sign-up call returns HTTP status == 201 with Panelist.${p1_id}.integrity_status == CLEAR"
            - "the enrollment call returns HTTP status == 403"
            - "${err_id} == ERR_FORBIDDEN_ROLE"
            - "GET /enrollments?campaign_id=${camp_id} as CampaignManager returns total_count == 0"

      - name: retailer_registration_is_shared_by_platform_admin_and_campaign_manager
        claim_type: shared_operations
        grounds:
          - roles.PlatformAdmin.shared_operations
          - roles.CampaignManager.shared_operations
          - endpoints[POST /retailers]
        distinguishing_aspect: "A genuinely shared write: both listed roles create retailers with identical semantics (same defaults, both 201), which distinguishes a shared operation from an exclusive one and rules out an implementation that hard-codes a single owner role."
        test_recipe:
          setup:
            - "Empty retailer registry."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /retailers"
              payload: { name: "AdminMart" }
              as: PlatformAdmin
              captures: { rt1_id: $.data.id }
            - call: "POST /retailers"
              payload: { name: "ManagerMart" }
              as: CampaignManager
              captures: { rt2_id: $.data.id }
          assert:
            - "both calls return HTTP status == 201"
            - "Retailer.${rt1_id}.feed_status == ACCEPTING and requires_disclosure_badge == true and min_star_rating_accepted == 1 and max_reviews_per_panelist_per_month == 1"
            - "Retailer.${rt2_id} carries exactly the same four defaults as Retailer.${rt1_id}"
            - "${rt1_id} != ${rt2_id}"

      - name: panelist_cannot_read_another_panelists_enrollment
        claim_type: peer_roles
        grounds:
          - errors[ERR_NOT_RESOURCE_OWNER]
          - validations[priority=9]
          - roles.Panelist.identity
        distinguishing_aspect: "Ownership, not role, is the discriminator: two callers with the identical role Panelist hit the same GET and get different answers — the owner reads 200, the peer reads 403. That isolates the X-User-ID-to-panelist_id comparison from the role list, which admits Panelist on this endpoint."
        test_recipe:
          setup:
            - "One campaign in SCREENING_OPEN and two registered panelists P1 and P2."
            - "One enrollment belonging to P1 only."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
