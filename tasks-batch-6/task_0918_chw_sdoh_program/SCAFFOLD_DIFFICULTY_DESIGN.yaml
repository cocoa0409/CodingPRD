  # =========================================================================
  # RULE 4 — transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: records_hold_depth_five_cascade_to_escalation_auto_resolution
        grounds:
          - state_machines.Patient.OPEN_to_RECORDS_HOLD
          - state_machines.Referral.SENT_to_LAPSED
          - entities.ResourceOffering.fields.availability_state
          - state_machines.Escalation.OPEN_TIER_1_to_RESOLVED
          - entities.Escalation.fields.blocking_offering_id
        distinguishing_aspect: |
          Depth-5 chain triggered by POST /chw/patients/{id}/records-hold with action PLACE:
          (1) Patient.gate_status -> RECORDS_HOLD causes (2) Referral -> LAPSED, which causes
          (3) the offering's hold to be released, which causes (4) availability_state EXHAUSTED ->
          AVAILABLE, which causes (5) the RESOURCE_EXHAUSTED Escalation to auto-resolve. Each link is
          caused by the previous link, never directly by the records-hold request.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One worker and one ENROLLED patient in ZIP 60614 with gate_status OPEN."
            - "One ACTIVE resource organization with one FOOD_BOX offering of capacity_total 1 and no eligibility criteria."
            - "One Referral in SENT holding the offering's single unit, so available_units is 0 and availability_state is EXHAUSTED."
            - "One Escalation opened by the exhaustion cascade with source_flag RESOURCE_EXHAUSTED, blocking_offering_id set, status OPEN_TIER_1."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "W-007" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-070", full_name: "Pilar Gomez", household_size: 3, monthly_income_cents: 110000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p1: $.data.id }
            - call: "PATCH /chw/patients/${p1}"
              payload: { enrollment_action: "ENROLL" }
              as: Supervisor
              as_user_id: "sup-1"
            - call: "POST /chw/resource-orgs"
              payload: { name: "Northside Pantry", org_type: "FOOD", service_zips: ["60614"], contact_email: "ops@northside.example" }
              as: ProgramAdmin
              captures: { org1: $.data.id }
            - call: "POST /chw/offerings"
              payload: { resource_org_id: "${org1}", unit_type: "FOOD_BOX", capacity_total: 1 }
              as: ProgramAdmin
              captures: { off1: $.data.id, off1_v1: $.data.version }
            - call: "POST /chw/referrals"
              payload: { patient_id: "${p1}", offering_id: "${off1}", opened_by_chw_id: "${w1}", urgency: "ROUTINE", units_requested: 1, expected_offering_version: "${off1_v1}" }
              as: CHW
              as_user_id: "${w1}"
              captures: { r1: $.data.id }
            - call: "GET /chw/escalations"
              payload: { blocking_offering_id: "${off1}" }
              as: Supervisor
              as_user_id: "sup-1"
              captures: { ex1: "$.data[0].id" }
          trigger:
            - call: "POST /chw/patients/${p1}/records-hold"
              payload: { action: "PLACE", reason: "Patient withdrew consent to share records" }
              as: Supervisor
              as_user_id: "sup-1"
          assert:
            - "Patient.${p1}.gate_status == RECORDS_HOLD"
            - "Patient.${p1}.gate_reason == Patient withdrew consent to share records"
            - "Referral.${r1}.status == LAPSED"
            - "Referral.${r1}.lapse_reason == RECORDS_HOLD"
            - "ResourceOffering.${off1}.allocated_units == 0"
            - "ResourceOffering.${off1}.available_units == 1"
            - "ResourceOffering.${off1}.released_units == 1"
            - "ResourceOffering.${off1}.delivered_units == 0"
            - "ResourceOffering.${off1}.expired_units == 0"
            - "ResourceOffering.${off1}.lifetime_allocated_units == 1"
            - "ResourceOffering.${off1}.availability_state == AVAILABLE"
            - "ResourceOffering.${off1}.exhausted_since == null"
            - "Escalation.${ex1}.status == RESOLVED"
            - "Escalation.${ex1}.resolution_reason == RESOURCE_RESTORED"
            - "Escalation.${ex1}.acknowledged_by_user_id == null"
            - "Patient.${p1}.unfulfilled_referral_count == 1 — below the threshold of 2, so no REFERRAL_UNFULFILLED escalation opened"
            - "ResourceOffering.${off1}.capacity_total == 1 == available_units + allocated_units + delivered_units"

      - name: encounter_void_cascade_reverses_grant_line_and_restores_budget
        grounds:
          - state_machines.Encounter.LOCKED_to_VOIDED
          - entities.GrantChargeLine.fields.reversed_at
          - entities.GrantAward.fields.committed_cents
          - calculations.grant_charge_line_amount
        distinguishing_aspect: |
          A depth-3 chain from a DIFFERENT triggering transition — POST /chw/encounters/{id}/void
          rather than a records-hold placement: (1) Encounter -> VOIDED causes (2) its POSTED
          GrantChargeLine to be reversed with reversal_reason ENCOUNTER_VOIDED, which causes
          (3) GrantAward.committed_cents to fall by exactly 4620 and remaining_budget_cents to rise
          by the same amount.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-20T00:00:00Z."
            - "One worker and one ENROLLED patient."
            - "One OPEN GrantAward, funder City Health Fund, period 2026-06-01..2026-06-30, budget_cap_cents 200000, indirect_rate_pct 10."
            - "One SUBMITTED June 2026 encounter with billable_minutes 60, LOCKED to a POSTED GrantChargeLine of total_amount_cents 4620."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "W-008" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-080", full_name: "Devon Clark", household_size: 1, monthly_income_cents: 80000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p1: $.data.id }
            - call: "PATCH /chw/patients/${p1}"
              payload: { enrollment_action: "ENROLL" }
              as: Supervisor
              as_user_id: "sup-1"
            - call: "POST /chw/grant-awards"
              payload: { funder_name: "City Health Fund", period_start: "2026-06-01", period_end: "2026-06-30", budget_cap_cents: 200000, indirect_rate_pct: 10 }
              as: ProgramAdmin
              captures: { aw: $.data.id }
            - call: "POST /chw/encounters"
              payload: { patient_id: "${p1}", chw_id: "${w1}", encounter_date: "2026-06-10", direct_minutes: 50, indirect_minutes: 5, travel_minutes: 0, documentation_minutes: 5 }
              as: CHW
              as_user_id: "${w1}"
              captures: { e1: $.data.id }
            - call: "POST /chw/encounters/${e1}/submit"
              payload: {}
              as: CHW
              as_user_id: "${w1}"
            - call: "GET /chw/grant-awards/${aw}"
              payload: {}
              as: BillingSpecialist
              as_user_id: "bill-1"
              captures: { aw_v1: $.data.version }
            - call: "POST /chw/grant-charge-lines"
              payload: { grant_award_id: "${aw}", encounter_id: "${e1}", expected_grant_award_version: "${aw_v1}" }
              as: BillingSpecialist
              as_user_id: "bill-1"
              captures: { l1: $.data.id }
          trigger:
            - call: "POST /chw/encounters/${e1}/void"
              payload: { reason: "Documented against the wrong patient" }
              as: Supervisor
              as_user_id: "sup-1"
          assert:
            - "Encounter.${e1}.billable_minutes == 60"
            - "Encounter.${e1}.status == VOIDED"
            - "Encounter.${e1}.funding_source == UNFUNDED"
            - "GrantChargeLine.${l1}.total_amount_cents == 4620"
            - "GrantChargeLine.${l1}.status == REVERSED"
            - "GrantChargeLine.${l1}.reversal_reason == ENCOUNTER_VOIDED"
            - "GrantAward.${aw}.committed_cents == 0"
            - "GrantAward.${aw}.remaining_budget_cents == 200000"

  # =========================================================================
  # RULE 5 — validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: write_gate_rung4_preempts_payload_rung5
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - state_machines.Patient.OPEN_to_RECORDS_HOLD
        distinguishing_aspect: |
          Category pair `state` (rung 4 records-hold write gate) versus `business_constraint` (rung 5
          payload domain rule). A goal whose target_value 5 is below its baseline_value 10 under
          INCREASE_GOOD violates rung 5, but the gated patient makes rung 4 win: the response is
          ERR_PATIENT_RECORDS_HOLD (409), never ERR_VALIDATION (400).
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One worker and one ENROLLED patient whose gate_status is RECORDS_HOLD."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "W-009" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-090", full_name: "Kai Nguyen", household_size: 2, monthly_income_cents: 95000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p1: $.data.id }
            - call: "PATCH /chw/patients/${p1}"
              payload: { enrollment_action: "ENROLL" }
              as: Supervisor
              as_user_id: "sup-1"
            - call: "POST /chw/patients/${p1}/records-hold"
              payload: { action: "PLACE", reason: "Consent withdrawn" }
              as: Supervisor
              as_user_id: "sup-1"
          trigger:
            - call: "POST /chw/goals"
              payload: { patient_id: "${p1}", domain: "FOOD", direction: "INCREASE_GOOD", baseline_value: 10, target_value: 5 }
              as: CHW
              as_user_id: "${w1}"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_PATIENT_RECORDS_HOLD"
            - "HTTP status == 409"
            - "GET /chw/goals with patient_id=${p1} returns total_count == 0"
            - "Patient.${p1}.gate_status is still RECORDS_HOLD"

      - name: eligibility_rung12_preempts_capacity_rung16
        grounds:
          - validations[priority=28]
          - validations[priority=41]
          - calculations.eligibility_gauntlet
        distinguishing_aspect: |
          Category pair `business_referential` (rung 12 eligibility gauntlet) versus
          `business_constraint` (rung 16 inventory capacity). The offering has zero available units AND
          the patient fails the GEOGRAPHY criterion; the answer must be ERR_ELIGIBILITY_GEOGRAPHY (422),
          not ERR_INSUFFICIENT_UNITS (409) — a different pair from the state/business_constraint pair above.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One worker; two ENROLLED patients — pass_patient in ZIP 60614 with income 100000, fail_patient in ZIP 60640 with income 150000."
            - "One ACTIVE organization with a FOOD_BOX offering of capacity_total 1 carrying an INCOME_BAND criterion (max 200000) and a GEOGRAPHY criterion (allowed_zips 60614)."
            - "pass_patient already holds the offering's single unit, so available_units is 0 and availability_state is EXHAUSTED."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "W-010" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-100", full_name: "Pass Patient", household_size: 3, monthly_income_cents: 100000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p_pass: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-101", full_name: "Fail Patient", household_size: 3, monthly_income_cents: 150000, residence_zip: "60640" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p_fail: $.data.id }
            - call: "PATCH /chw/patients/${p_pass}"
              payload: { enrollment_action: "ENROLL" }
              as: Supervisor
              as_user_id: "sup-1"
            - call: "PATCH /chw/patients/${p_fail}"
              payload: { enrollment_action: "ENROLL" }
              as: Supervisor
              as_user_id: "sup-1"
            - call: "POST /chw/resource-orgs"
              payload: { name: "Northside Pantry", org_type: "FOOD", service_zips: ["60614"], contact_email: "ops@northside.example" }
              as: ProgramAdmin
              captures: { org1: $.data.id }
            - call: "POST /chw/offerings"
              payload: { resource_org_id: "${org1}", unit_type: "FOOD_BOX", capacity_total: 1 }
              as: ProgramAdmin
              captures: { off1: $.data.id }
            - call: "POST /chw/offerings/${off1}/criteria"
              payload: { criterion_type: "INCOME_BAND", max_monthly_income_cents: 200000 }
              as: ProgramAdmin
            - call: "POST /chw/offerings/${off1}/criteria"
              payload: { criterion_type: "GEOGRAPHY", allowed_zips: ["60614"] }
              as: ProgramAdmin
            - call: "GET /chw/offerings/${off1}"
              payload: {}
              as: CHW
              as_user_id: "${w1}"
              captures: { off1_v: $.data.version }
            - call: "POST /chw/referrals"
              payload: { patient_id: "${p_pass}", offering_id: "${off1}", opened_by_chw_id: "${w1}", urgency: "ROUTINE", units_requested: 1, expected_offering_version: "${off1_v}" }
              as: CHW
              as_user_id: "${w1}"
            - call: "GET /chw/offerings/${off1}"
              payload: {}
              as: CHW
              as_user_id: "${w1}"
              captures: { off1_v2: $.data.version }
          trigger:
            - call: "POST /chw/referrals"
              payload: { patient_id: "${p_fail}", offering_id: "${off1}", opened_by_chw_id: "${w1}", urgency: "ROUTINE", units_requested: 1, expected_offering_version: "${off1_v2}" }
              as: CHW
              as_user_id: "${w1}"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_ELIGIBILITY_GEOGRAPHY"
            - "HTTP status == 422"
            - "ResourceOffering.${off1}.available_units == 0 — the capacity rule was violated too but never reached"
            - "ResourceOffering.${off1}.availability_state == EXHAUSTED"
            - "GET /chw/referrals with patient_id=${p_fail} returns total_count == 0"

      - name: ownership_rung10_preempts_attestation_window_rung14
        grounds:
          - validations[priority=23]
          - validations[priority=34]
          - state_machines.HomeVisit.DRAFT_to_ATTESTED
        distinguishing_aspect: |
          Category pair `auth` (rung 10 ownership) versus `business_temporal` (rung 14 attestation
          window). A non-owning CHW attesting 73 hours after completion violates both; the response is
          ERR_NOT_RESOURCE_OWNER (403), not ERR_ATTESTATION_WINDOW_CLOSED (422).
        test_recipe:
          setup:
            - "Logical clock at 2026-06-05T11:00:00Z, which is 73 hours after the visit completed."
            - "Two workers; one ENROLLED patient."
            - "One HomeVisit assigned to the first worker, scheduling_status COMPLETED with completed_at 2026-06-02T10:00:00.000Z and documentation_status DRAFT."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "W-011" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/workers"
              payload: { full_name: "Ben Cole", employee_code: "W-012" }
              as: ProgramAdmin
              captures: { w2: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-110", full_name: "Tomas Vela", household_size: 2, monthly_income_cents: 90000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p1: $.data.id }
            - call: "PATCH /chw/patients/${p1}"
              payload: { enrollment_action: "ENROLL" }
              as: Supervisor
              as_user_id: "sup-1"
            - call: "POST /chw/home-visits"
              payload: { patient_id: "${p1}", assigned_chw_id: "${w1}", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T10:00:00Z" }
              as: CHW
              as_user_id: "${w1}"
              captures: { v1: $.data.id }
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/home-visits/${v1}/en-route"
              payload: {}
              as: CHW
              as_user_id: "${w1}"
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T10:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/home-visits/${v1}/complete"
              payload: {}
              as: CHW
              as_user_id: "${w1}"
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T11:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /chw/home-visits/${v1}/attest"
              payload: { visit_note: "Attempted by the wrong worker" }
              as: CHW
              as_user_id: "${w2}"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_NOT_RESOURCE_OWNER"
            - "HTTP status == 403"
            - "HomeVisit.${v1}.documentation_status == DRAFT"
            - "HomeVisit.${v1}.attested_at == null"

      - name: enrollment_rung9_preempts_two_person_safety_rung11
        grounds:
          - validations[priority=21]
          - validations[priority=26]
          - entities.Patient.fields.address_safety_flag
        distinguishing_aspect: |
          Category pair `state` (rung 9 cross-entity enrollment precondition) versus `business_safety`
          (rung 11 two-person visit rule) — a third distinct pair. A PROSPECTIVE safety-flagged patient
          with no second worker returns ERR_PATIENT_NOT_ENROLLED (409); once ENROLLED, the identical
          request returns ERR_TWO_PERSON_VISIT_REQUIRED (422).
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One worker; one PROSPECTIVE patient whose address_safety_flag is true."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "W-013" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-120", full_name: "Sky Bennett", household_size: 2, monthly_income_cents: 70000, residence_zip: "60614", address_safety_flag: true }
              as: CHW
              as_user_id: "${w1}"
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /chw/home-visits"
              payload: { patient_id: "${p1}", assigned_chw_id: "${w1}", scheduled_start: "2026-06-03T09:00:00Z", scheduled_end: "2026-06-03T10:00:00Z" }
              as: CHW
              as_user_id: "${w1}"
              captures: { err_first: $.data.error_id }
            - call: "PATCH /chw/patients/${p1}"
              payload: { enrollment_action: "ENROLL" }
              as: Supervisor
              as_user_id: "sup-1"
            - call: "POST /chw/home-visits"
              payload: { patient_id: "${p1}", assigned_chw_id: "${w1}", scheduled_start: "2026-06-03T09:00:00Z", scheduled_end: "2026-06-03T10:00:00Z" }
              as: CHW
              as_user_id: "${w1}"
              captures: { err_second: $.data.error_id }
          assert:
            - "${err_first} == ERR_PATIENT_NOT_ENROLLED with HTTP status 409"
            - "${err_second} == ERR_TWO_PERSON_VISIT_REQUIRED with HTTP status 422"
            - "GET /chw/home-visits with patient_id=${p1} returns total_count == 0"
            - "Patient.${p1}.enrollment_status == ENROLLED after the PATCH"

  # =========================================================================
  # RULE 6 — boundary-precision checks on different metrics and endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: cm_minute_threshold_exactly_sixty_qualifies
        grounds:
          - calculations.billable_minutes_monthly_rollup
          - validations[priority=43]
          - errors[ERR_MINUTE_THRESHOLD_NOT_MET]
        distinguishing_aspect: |
          Numeric threshold boundary on the MONTHLY MINUTE metric, reached through POST
          /chw/payer-claims: exactly 60 claimed minutes qualifies for CM-60 because the comparison is
          >=, while 54 minutes is rejected with ERR_MINUTE_THRESHOLD_NOT_MET.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-20T00:00:00Z."
            - "One worker; two ENROLLED patients."
            - "Patient A has one SUBMITTED June encounter with raw_billable_minutes 60 and billable_minutes 60."
            - "Patient B has one SUBMITTED June encounter with raw_billable_minutes 54 and billable_minutes 54."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "W-014" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-130", full_name: "Boundary A", household_size: 1, monthly_income_cents: 60000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { pa: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-131", full_name: "Boundary B", household_size: 1, monthly_income_cents: 60000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { pb: $.data.id }
            - call: "PATCH /chw/patients/${pa}"
              payload: { enrollment_action: "ENROLL" }
              as: Supervisor
              as_user_id: "sup-1"
            - call: "PATCH /chw/patients/${pb}"
              payload: { enrollment_action: "ENROLL" }
              as: Supervisor
              as_user_id: "sup-1"
            - call: "POST /chw/encounters"
              payload: { patient_id: "${pa}", chw_id: "${w1}", encounter_date: "2026-06-04", direct_minutes: 45, indirect_minutes: 10, travel_minutes: 0, documentation_minutes: 5 }
              as: CHW
              as_user_id: "${w1}"
              captures: { ea: $.data.id }
            - call: "POST /chw/encounters"
              payload: { patient_id: "${pb}", chw_id: "${w1}", encounter_date: "2026-06-04", direct_minutes: 40, indirect_minutes: 8, travel_minutes: 0, documentation_minutes: 6 }
              as: CHW
              as_user_id: "${w1}"
              captures: { eb: $.data.id }
            - call: "POST /chw/encounters/${ea}/submit"
              payload: {}
              as: CHW
              as_user_id: "${w1}"
            - call: "POST /chw/encounters/${eb}/submit"
              payload: {}
              as: CHW
              as_user_id: "${w1}"
          trigger:
            - call: "POST /chw/payer-claims"
              payload: { patient_id: "${pa}", service_month: "2026-06", basis: "FINAL" }
              as: BillingSpecialist
              as_user_id: "bill-1"
              captures: { cl_a: $.data.id }
            - call: "POST /chw/payer-claims"
              payload: { patient_id: "${pb}", service_month: "2026-06", basis: "FINAL" }
              as: BillingSpecialist
              as_user_id: "bill-1"
              captures: { err_b: $.data.error_id }
          assert:
            - "Encounter.${ea}.billable_minutes == 60"
            - "Encounter.${eb}.billable_minutes == 54"
            - "PayerClaim.${cl_a}.claimed_minutes == 60"
            - "PayerClaim.${cl_a}.billing_code == CM-60"
            - "PayerClaim.${cl_a}.units == 4"
            - "PayerClaim.${cl_a}.allowed_amount_cents == 8600"
            - "${err_b} == ERR_MINUTE_THRESHOLD_NOT_MET with HTTP status 422"
            - "Encounter.${eb}.status == SUBMITTED and funding_source == UNFUNDED — the rejected claim locked nothing"

      - name: half_open_visit_slot_touching_boundary_is_accepted
        grounds:
          - validations[priority=32]
          - errors[ERR_VISIT_SLOT_CONFLICT]
          - entities.HomeVisit.fields.scheduled_end
        distinguishing_aspect: |
          Interval-adjacency boundary — a structurally different metric from the numeric minute
          threshold, reached through a different endpoint (POST /chw/home-visits). A visit starting at
          exactly the previous visit's scheduled_end is ACCEPTED because slots are HALF-OPEN, while a
          visit starting one minute earlier is rejected with ERR_VISIT_SLOT_CONFLICT.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One worker; one ENROLLED patient with address_safety_flag false."
            - "One HomeVisit for that worker scheduled 2026-06-02T09:00:00Z to 2026-06-02T10:00:00Z, scheduling_status SCHEDULED."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "W-015" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-140", full_name: "Edge Case", household_size: 2, monthly_income_cents: 70000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p1: $.data.id }
            - call: "PATCH /chw/patients/${p1}"
              payload: { enrollment_action: "ENROLL" }
              as: Supervisor
              as_user_id: "sup-1"
            - call: "POST /chw/home-visits"
              payload: { patient_id: "${p1}", assigned_chw_id: "${w1}", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T10:00:00Z" }
              as: CHW
              as_user_id: "${w1}"
              captures: { v1: $.data.id }
          trigger:
            - call: "POST /chw/home-visits"
              payload: { patient_id: "${p1}", assigned_chw_id: "${w1}", scheduled_start: "2026-06-02T10:00:00Z", scheduled_end: "2026-06-02T11:00:00Z" }
              as: CHW
              as_user_id: "${w1}"
              captures: { v2: $.data.id }
            - call: "POST /chw/home-visits"
              payload: { patient_id: "${p1}", assigned_chw_id: "${w1}", scheduled_start: "2026-06-02T09:59:00Z", scheduled_end: "2026-06-02T10:30:00Z" }
              as: CHW
              as_user_id: "${w1}"
              captures: { err_v3: $.data.error_id }
          assert:
            - "HomeVisit.${v2}.scheduling_status == SCHEDULED — the touching slot is accepted with HTTP 201"
            - "HomeVisit.${v2}.scheduled_start == 2026-06-02T10:00:00.000Z"
            - "${err_v3} == ERR_VISIT_SLOT_CONFLICT with HTTP status 409"
            - "GET /chw/home-visits with assigned_chw_id=${w1} returns total_count == 2"

      - name: rescreen_cadence_exact_boundary_re_anchors
        grounds:
          - calculations.sdoh_weighted_risk_score
          - state_machines.Screening.SUBMITTED_to_SUPERSEDED
          - entities.ScreeningInstrument.fields.rescreen_cadence_days
        distinguishing_aspect: |
          Cadence-day boundary on a third metric (elapsed calendar days) through a third endpoint
          (POST /chw/screenings). At EXACTLY 90 days the strict comparison `< cadence` is false, so the
          FRESH_ANCHOR variant applies: a new Screening row is minted and the prior row is SUPERSEDED.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z, later advanced to 2026-08-30T00:00:00Z (exactly 90 days)."
            - "One worker and one Patient."
            - "One PUBLISHED instrument with rescreen_cadence_days 90."
            - "One Screening in status SUBMITTED with anchor_screened_at 2026-06-01T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "W-016" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-150", full_name: "Cadence Case", household_size: 3, monthly_income_cents: 130000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p1: $.data.id, p1_v1: $.data.version }
            - call: "POST /chw/screening-instruments"
              payload: { name: "PRAPARE-Local", version_label: "v2.1", domain_weights: { FOOD: 40, HOUSING: 40, TRANSPORT: 20 }, effective_from: "2026-05-01T00:00:00Z", rescreen_cadence_days: 90 }
              as: ProgramAdmin
              captures: { inst1: $.data.id }
            - call: "POST /chw/screening-instruments/${inst1}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /chw/screenings"
              payload: { patient_id: "${p1}", instrument_id: "${inst1}", domain_scores: { FOOD: 3, HOUSING: 2, TRANSPORT: 1 }, expected_patient_version: "${p1_v1}" }
              as: CHW
              as_user_id: "${w1}"
              captures: { s1: $.data.id }
            - call: "GET /chw/patients/${p1}"
              payload: {}
              as: CHW
              as_user_id: "${w1}"
              captures: { p1_v2: $.data.version }
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-30T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /chw/screenings"
              payload: { patient_id: "${p1}", instrument_id: "${inst1}", domain_scores: { FOOD: 3, HOUSING: 2, TRANSPORT: 1 }, expected_patient_version: "${p1_v2}" }
              as: CHW
              as_user_id: "${w1}"
              captures: { s2: $.data.id }
          assert:
            - "${s2} != ${s1} — at exactly the cadence boundary a NEW row is minted"
            - "Screening.${s2}.anchor_screened_at == 2026-08-30T00:00:00.000Z"
            - "Screening.${s2}.amendment_count == 0"
            - "Screening.${s2}.status == SUBMITTED"
            - "Screening.${s1}.status == SUPERSEDED"
            - "Screening.${s1}.anchor_screened_at == 2026-06-01T00:00:00.000Z"
            - "Patient.${p1}.risk_tier_effective_at == 2026-08-30T00:00:00.000Z"
            - "GET /chw/screenings with patient_id=${p1} returns total_count == 2"

      - name: empty_criteria_set_passes_eligibility_with_zero_evaluated
        grounds:
          - calculations.eligibility_gauntlet
          - endpoints.POST./chw/offerings/{id}/eligibility-check
          - entities.EligibilityCriterion.fields.evaluation_rank
        distinguishing_aspect: |
          Empty-collection boundary — a fourth metric (set cardinality zero) on a fourth endpoint
          (POST /chw/offerings/{id}/eligibility-check). An offering with no criteria yields
          eligible true, evaluated_count 0 and null first_failing_* fields rather than an error.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One worker; one ENROLLED patient."
            - "One ACTIVE organization with a TRANSPORT_RIDE offering of capacity_total 4 and ZERO eligibility criteria."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "W-017" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-160", full_name: "Empty Set", household_size: 1, monthly_income_cents: 999000, residence_zip: "99999" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p1: $.data.id }
            - call: "PATCH /chw/patients/${p1}"
              payload: { enrollment_action: "ENROLL" }
              as: Supervisor
              as_user_id: "sup-1"
            - call: "POST /chw/resource-orgs"
              payload: { name: "City Rides", org_type: "TRANSPORT", service_zips: ["60614"], contact_email: "ops@cityrides.example" }
              as: ProgramAdmin
              captures: { org1: $.data.id }
            - call: "POST /chw/offerings"
              payload: { resource_org_id: "${org1}", unit_type: "TRANSPORT_RIDE", capacity_total: 4 }
              as: ProgramAdmin
              captures: { off1: $.data.id }
          trigger:
            - call: "POST /chw/offerings/${off1}/eligibility-check"
              payload: { patient_id: "${p1}" }
              as: CHW
              as_user_id: "${w1}"
          assert:
            - "response.eligible == true"
            - "response.evaluated_count == 0"
            - "response.first_failing_criterion_id == null"
            - "response.first_failing_criterion_type == null"
            - "response.first_failing_error_id == null"
            - "HTTP status == 200 even though the patient's income 999000 and ZIP 99999 would fail any criterion that existed"
            - "GET /chw/offerings/${off1}/criteria returns total_count == 0"

  # =========================================================================
  # RULE 7 — cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: referral_blocked_while_resource_org_suspended
        grounds:
          - validations[priority=20]
          - state_machines.ResourceOrg.ACTIVE_to_SUSPENDED
          - state_machines.ResourceOrg.SUSPENDED_to_ACTIVE
          - errors[ERR_RESOURCE_ORG_SUSPENDED]
        distinguishing_aspect: |
          Entity pair Referral -> ResourceOrg: a referral's legality depends on the state of an entity
          two hops away (Referral -> ResourceOffering -> ResourceOrg). Suspending the organization
          blocks creation; reinstating it lets the identical request through.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One worker; one ENROLLED patient in ZIP 60614."
            - "One resource organization in status SUSPENDED with one FOOD_BOX offering of capacity_total 5 and no criteria."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "W-018" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-170", full_name: "Guarded Case", household_size: 3, monthly_income_cents: 100000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p1: $.data.id }
            - call: "PATCH /chw/patients/${p1}"
              payload: { enrollment_action: "ENROLL" }
              as: Supervisor
              as_user_id: "sup-1"
            - call: "POST /chw/resource-orgs"
              payload: { name: "Northside Pantry", org_type: "FOOD", service_zips: ["60614"], contact_email: "ops@northside.example" }
              as: ProgramAdmin
              captures: { org1: $.data.id }
            - call: "POST /chw/offerings"
              payload: { resource_org_id: "${org1}", unit_type: "FOOD_BOX", capacity_total: 5 }
              as: ProgramAdmin
              captures: { off1: $.data.id }
            - call: "POST /chw/resource-orgs/${org1}/suspend"
              payload: { action: "SUSPEND" }
              as: ProgramAdmin
            - call: "GET /chw/offerings/${off1}"
              payload: {}
              as: CHW
              as_user_id: "${w1}"
              captures: { off1_v: $.data.version }
          trigger:
            - call: "POST /chw/referrals"
              payload: { patient_id: "${p1}", offering_id: "${off1}", opened_by_chw_id: "${w1}", urgency: "URGENT", units_requested: 1, expected_offering_version: "${off1_v}" }
              as: CHW
              as_user_id: "${w1}"
              captures: { err_id: $.data.error_id }
            - call: "POST /chw/resource-orgs/${org1}/suspend"
              payload: { action: "REINSTATE" }
              as: ProgramAdmin
            - call: "POST /chw/referrals"
              payload: { patient_id: "${p1}", offering_id: "${off1}", opened_by_chw_id: "${w1}", urgency: "URGENT", units_requested: 1, expected_offering_version: "${off1_v}" }
              as: CHW
              as_user_id: "${w1}"
              captures: { r1: $.data.id }
          assert:
            - "${err_id} == ERR_RESOURCE_ORG_SUSPENDED with HTTP status 409"
            - "Referral.${r1}.status == SENT after reinstatement"
            - "Referral.${r1}.ack_deadline_at == 2026-06-02T00:00:00.000Z — URGENT is 24 hours from sent_at"
            - "ResourceOffering.${off1}.allocated_units == 1 and available_units == 4"
            - "ResourceOrg.${org1}.status == ACTIVE"

      - name: screening_blocked_while_instrument_unpublished
        grounds:
          - validations[priority=19]
          - entities.ScreeningInstrument.fields.status
          - errors[ERR_INSTRUMENT_NOT_PUBLISHED]
        distinguishing_aspect: |
          A DIFFERENT entity pair, Screening -> ScreeningInstrument: the same patient and payload are
          rejected with ERR_INSTRUMENT_NOT_PUBLISHED while the instrument is DRAFT, and accepted once
          it is PUBLISHED. Retiring the instrument afterwards re-blocks new screenings.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One worker; one PROSPECTIVE patient."
            - "One ScreeningInstrument in status DRAFT with weights FOOD 40, HOUSING 40, TRANSPORT 20."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "W-019" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-180", full_name: "Draft Case", household_size: 2, monthly_income_cents: 90000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p1: $.data.id, p1_v1: $.data.version }
            - call: "POST /chw/screening-instruments"
              payload: { name: "PRAPARE-Local", version_label: "v3.0", domain_weights: { FOOD: 40, HOUSING: 40, TRANSPORT: 20 }, effective_from: "2026-05-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { inst1: $.data.id }
          trigger:
            - call: "POST /chw/screenings"
              payload: { patient_id: "${p1}", instrument_id: "${inst1}", domain_scores: { FOOD: 3, HOUSING: 2, TRANSPORT: 1 }, expected_patient_version: "${p1_v1}" }
              as: CHW
              as_user_id: "${w1}"
              captures: { err_id: $.data.error_id }
            - call: "POST /chw/screening-instruments/${inst1}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /chw/screenings"
              payload: { patient_id: "${p1}", instrument_id: "${inst1}", domain_scores: { FOOD: 3, HOUSING: 2, TRANSPORT: 1 }, expected_patient_version: "${p1_v1}" }
              as: CHW
              as_user_id: "${w1}"
              captures: { s1: $.data.id }
          assert:
            - "${err_id} == ERR_INSTRUMENT_NOT_PUBLISHED with HTTP status 409"
            - "ScreeningInstrument.${inst1}.rescreen_cadence_days == 90 — the declared default"
            - "Screening.${s1}.weighted_score == 55.00"
            - "Screening.${s1}.risk_tier == HIGH"
            - "Patient.${p1}.enrollment_status == ENROLLED — a HIGH-tier screening auto-enrols a PROSPECTIVE patient"
            - "Patient.${p1}.risk_tier_effective_at == 2026-06-01T00:00:00.000Z"

      - name: encounter_submit_blocked_while_home_visit_unattested
        grounds:
          - validations[priority=22]
          - state_machines.HomeVisit.DRAFT_to_ATTESTED
          - state_machines.Encounter.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          A THIRD entity pair, Encounter -> HomeVisit, and it crosses the two PARALLEL axes: the visit's
          scheduling_status is already COMPLETED, yet submission is refused with ERR_INVALID_STATE until
          the independent documentation_status reaches ATTESTED.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-02T10:30:00Z."
            - "One worker; one ENROLLED patient."
            - "One HomeVisit with scheduling_status COMPLETED and documentation_status DRAFT."
            - "One DRAFT Encounter linked to that visit."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "W-020" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-190", full_name: "Axis Case", household_size: 2, monthly_income_cents: 90000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p1: $.data.id }
            - call: "PATCH /chw/patients/${p1}"
              payload: { enrollment_action: "ENROLL" }
              as: Supervisor
              as_user_id: "sup-1"
            - call: "POST /chw/home-visits"
              payload: { patient_id: "${p1}", assigned_chw_id: "${w1}", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T10:00:00Z" }
              as: CHW
              as_user_id: "${w1}"
              captures: { v1: $.data.id }
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/home-visits/${v1}/en-route"
              payload: {}
              as: CHW
              as_user_id: "${w1}"
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T10:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/home-visits/${v1}/complete"
              payload: {}
              as: CHW
              as_user_id: "${w1}"
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T10:30:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/encounters"
              payload: { patient_id: "${p1}", chw_id: "${w1}", encounter_date: "2026-06-02", direct_minutes: 55, indirect_minutes: 5, travel_minutes: 20, documentation_minutes: 0, home_visit_id: "${v1}" }
              as: CHW
              as_user_id: "${w1}"
              captures: { e1: $.data.id }
          trigger:
            - call: "POST /chw/encounters/${e1}/submit"
              payload: {}
              as: CHW
              as_user_id: "${w1}"
              captures: { err_id: $.data.error_id }
            - call: "POST /chw/home-visits/${v1}/attest"
              payload: { visit_note: "Home visit completed, food box delivered" }
              as: CHW
              as_user_id: "${w1}"
            - call: "POST /chw/encounters/${e1}/submit"
              payload: {}
              as: CHW
              as_user_id: "${w1}"
          assert:
            - "${err_id} == ERR_INVALID_STATE with HTTP status 409"
            - "HomeVisit.${v1}.scheduling_status == COMPLETED throughout — the blocking axis is documentation_status, not scheduling_status"
            - "HomeVisit.${v1}.documentation_status == ATTESTED after the attest call"
            - "Encounter.${e1}.status == SUBMITTED after the second submit"
            - "Encounter.${e1}.total_minutes == 80"
            - "Encounter.${e1}.raw_billable_minutes == 60"
            - "Encounter.${e1}.billable_minutes == 60 — travel minutes are excluded from billable time"

  # =========================================================================
  # RULE 8 — resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: worker_visit_slots_half_open_including_second_worker_role
        grounds:
          - validations[priority=32]
          - entities.HomeVisit.fields.second_chw_id
          - errors[ERR_VISIT_SLOT_CONFLICT]
        distinguishing_aspect: |
          Resource entity: CommunityHealthWorker. Interval semantics: HALF-OPEN [start, end) with an
          aggregate capacity of exactly one visit per worker, and the occupancy counts a worker in
          EITHER the assigned_chw_id or the second_chw_id slot. A second visit assigned to a different
          worker still collides because it names the first worker as the second attendee.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "Two workers; one ENROLLED patient with address_safety_flag false."
            - "One HomeVisit 2026-06-02T09:00:00Z to 2026-06-02T10:00:00Z assigned to the first worker."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "W-021" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/workers"
              payload: { full_name: "Ben Cole", employee_code: "W-022" }
              as: ProgramAdmin
              captures: { w2: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-200", full_name: "Slot Case", household_size: 2, monthly_income_cents: 90000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p1: $.data.id }
            - call: "PATCH /chw/patients/${p1}"
              payload: { enrollment_action: "ENROLL" }
              as: Supervisor
              as_user_id: "sup-1"
            - call: "POST /chw/home-visits"
              payload: { patient_id: "${p1}", assigned_chw_id: "${w1}", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T10:00:00Z" }
              as: CHW
              as_user_id: "${w1}"
              captures: { v1: $.data.id }
          trigger:
            - call: "POST /chw/home-visits"
              payload: { patient_id: "${p1}", assigned_chw_id: "${w2}", second_chw_id: "${w1}", scheduled_start: "2026-06-02T09:30:00Z", scheduled_end: "2026-06-02T10:30:00Z" }
              as: CHW
              as_user_id: "${w2}"
              captures: { err_id: $.data.error_id }
            - call: "POST /chw/home-visits"
              payload: { patient_id: "${p1}", assigned_chw_id: "${w2}", second_chw_id: "${w1}", scheduled_start: "2026-06-02T10:00:00Z", scheduled_end: "2026-06-02T11:00:00Z" }
              as: CHW
              as_user_id: "${w2}"
              captures: { v2: $.data.id }
          assert:
            - "${err_id} == ERR_VISIT_SLOT_CONFLICT with HTTP status 409"
            - "HomeVisit.${v2}.scheduling_status == SCHEDULED — touching at 10:00:00 does not collide under HALF-OPEN semantics"
            - "HomeVisit.${v2}.second_chw_id == ${w1}"
            - "GET /chw/home-visits with second_chw_id=${w1} returns total_count == 1"

      - name: grant_award_periods_closed_within_funder
        grounds:
          - validations[priority=33]
          - entities.GrantAward.fields.period_end
          - errors[ERR_GRANT_PERIOD_OVERLAP]
        distinguishing_aspect: |
          A DIFFERENT resource entity (GrantAward, partitioned by funder_name) with the OPPOSITE
          interval semantics: periods are CLOSED, so a new period whose period_start equals an existing
          period_end DOES collide. The same touching geometry that is legal for visit slots is illegal here.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One OPEN GrantAward for funder City Health Fund covering 2026-06-01..2026-06-30."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/grant-awards"
              payload: { funder_name: "City Health Fund", period_start: "2026-06-01", period_end: "2026-06-30", budget_cap_cents: 100000 }
              as: ProgramAdmin
              captures: { aw_a: $.data.id }
          trigger:
            - call: "POST /chw/grant-awards"
              payload: { funder_name: "City Health Fund", period_start: "2026-06-30", period_end: "2026-07-31", budget_cap_cents: 100000 }
              as: ProgramAdmin
              captures: { err_touch: $.data.error_id }
            - call: "POST /chw/grant-awards"
              payload: { funder_name: "City Health Fund", period_start: "2026-07-01", period_end: "2026-07-31", budget_cap_cents: 100000 }
              as: ProgramAdmin
              captures: { aw_c: $.data.id }
            - call: "POST /chw/grant-awards"
              payload: { funder_name: "State Wellness Trust", period_start: "2026-06-15", period_end: "2026-06-20", budget_cap_cents: 50000 }
              as: ProgramAdmin
              captures: { aw_d: $.data.id }
          assert:
            - "${err_touch} == ERR_GRANT_PERIOD_OVERLAP with HTTP status 409 — the touching date 2026-06-30 is INSIDE the closed period"
            - "GrantAward.${aw_c}.status == OPEN — a period starting the day after period_end is accepted"
            - "GrantAward.${aw_d}.status == OPEN — the overlap check is scoped to funder_name"
            - "GrantAward.${aw_a}.indirect_rate_pct == 10 — the declared default"
            - "GrantAward.${aw_a}.remaining_budget_cents == 100000"

  # =========================================================================
  # RULE 9 — compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: referral_hold_then_decline_conserves_offering_units
        grounds:
          - conservation_invariants.offering_unit_conservation
          - conservation_invariants.offering_hold_ledger_conservation
          - state_machines.Referral.SENT_to_DECLINED
        distinguishing_aspect: |
          Conserved quantity: INVENTORY UNITS. Placing a 2-unit hold and then declining the referral
          restores available_units to the pre-referral value of 3 with zero drift, while
          lifetime_allocated_units stays at 2 and the released bucket absorbs exactly 2.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One worker; one ENROLLED patient in ZIP 60614."
            - "One ACTIVE organization with a FOOD_BOX offering of capacity_total 3 and no criteria; available_units 3 and every other counter 0."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "W-023" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-210", full_name: "Ledger Case", household_size: 4, monthly_income_cents: 95000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p1: $.data.id }
            - call: "PATCH /chw/patients/${p1}"
              payload: { enrollment_action: "ENROLL" }
              as: Supervisor
              as_user_id: "sup-1"
            - call: "POST /chw/resource-orgs"
              payload: { name: "Northside Pantry", org_type: "FOOD", service_zips: ["60614"], contact_email: "ops@northside.example" }
              as: ProgramAdmin
              captures: { org1: $.data.id }
            - call: "POST /chw/offerings"
              payload: { resource_org_id: "${org1}", unit_type: "FOOD_BOX", capacity_total: 3 }
              as: ProgramAdmin
              captures: { off1: $.data.id, off1_v1: $.data.version }
            - call: "POST /chw/referrals"
              payload: { patient_id: "${p1}", offering_id: "${off1}", opened_by_chw_id: "${w1}", urgency: "ROUTINE", units_requested: 2, expected_offering_version: "${off1_v1}" }
              as: CHW
              as_user_id: "${w1}"
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /chw/referrals/${r1}/respond"
              payload: { decision: "DECLINED", decline_reason: "Household already served this month" }
              as: ResourcePartner
              as_user_id: "${org1}"
          assert:
            - "ResourceOffering.${off1}.available_units == 3"
            - "ResourceOffering.${off1}.allocated_units == 0"
            - "ResourceOffering.${off1}.delivered_units == 0"
            - "ResourceOffering.${off1}.released_units == 2"
            - "ResourceOffering.${off1}.expired_units == 0"
            - "ResourceOffering.${off1}.lifetime_allocated_units == 2"
            - "ResourceOffering.${off1}.capacity_total == 3 == available_units + allocated_units + delivered_units"
            - "ResourceOffering.${off1}.lifetime_allocated_units == 2 == allocated_units + delivered_units + released_units + expired_units"
            - "ResourceOffering.${off1}.availability_state == AVAILABLE"
            - "Referral.${r1}.status == DECLINED"
            - "Patient.${p1}.unfulfilled_referral_count == 1"

      - name: grant_line_post_then_reverse_conserves_budget_cents
        grounds:
          - conservation_invariants.grant_budget_conservation
          - entities.GrantChargeLine.fields.reversed_at
          - calculations.grant_charge_line_amount
        distinguishing_aspect: |
          A DIFFERENT conserved quantity: CURRENCY. Posting a 4620-cent line and reversing it returns
          committed_cents to 0 and remaining_budget_cents to the full 200000, so
          budget_cap_cents == committed_cents + remaining_budget_cents holds with zero drift — unlike
          the unit-count conservation above.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-20T00:00:00Z."
            - "One worker; one ENROLLED patient."
            - "One OPEN GrantAward, funder City Health Fund, 2026-06-01..2026-06-30, budget_cap_cents 200000, indirect_rate_pct 10."
            - "One SUBMITTED June encounter with billable_minutes 60, LOCKED by a POSTED GrantChargeLine of 4620 cents."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "W-024" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-220", full_name: "Budget Case", household_size: 1, monthly_income_cents: 80000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p1: $.data.id }
            - call: "PATCH /chw/patients/${p1}"
              payload: { enrollment_action: "ENROLL" }
              as: Supervisor
              as_user_id: "sup-1"
            - call: "POST /chw/grant-awards"
              payload: { funder_name: "City Health Fund", period_start: "2026-06-01", period_end: "2026-06-30", budget_cap_cents: 200000, indirect_rate_pct: 10 }
              as: ProgramAdmin
              captures: { aw: $.data.id }
            - call: "POST /chw/encounters"
              payload: { patient_id: "${p1}", chw_id: "${w1}", encounter_date: "2026-06-10", direct_minutes: 50, indirect_minutes: 5, travel_minutes: 0, documentation_minutes: 5 }
              as: CHW
              as_user_id: "${w1}"
              captures: { e1: $.data.id }
            - call: "POST /chw/encounters/${e1}/submit"
              payload: {}
              as: CHW
              as_user_id: "${w1}"
            - call: "GET /chw/grant-awards/${aw}"
              payload: {}
              as: BillingSpecialist
              as_user_id: "bill-1"
              captures: { aw_v1: $.data.version }
            - call: "POST /chw/grant-charge-lines"
              payload: { grant_award_id: "${aw}", encounter_id: "${e1}", expected_grant_award_version: "${aw_v1}" }
              as: BillingSpecialist
              as_user_id: "bill-1"
              captures: { l1: $.data.id }
          trigger:
            - call: "POST /chw/grant-charge-lines/${l1}/reverse"
              payload: { reversal_reason: "MANUAL_REVERSAL" }
              as: BillingSpecialist
              as_user_id: "bill-1"
          assert:
            - "GrantChargeLine.${l1}.total_amount_cents == 4620"
            - "GrantChargeLine.${l1}.status == REVERSED"
            - "GrantAward.${aw}.committed_cents == 0"
            - "GrantAward.${aw}.remaining_budget_cents == 200000"
            - "GrantAward.${aw}.budget_cap_cents == 200000 == committed_cents + remaining_budget_cents"
            - "Encounter.${e1}.status == SUBMITTED"
            - "Encounter.${e1}.funding_source == UNFUNDED"

      - name: upheld_appeal_conserves_encounter_minutes_by_funding_source
        grounds:
          - conservation_invariants.encounter_minute_conservation
          - state_machines.PayerClaim.APPEALED_to_UPHELD
          - state_machines.Encounter.LOCKED_to_SUBMITTED
          - calculations.program_report_rollups
        distinguishing_aspect: |
          A THIRD conserved quantity: CHW MINUTES partitioned by funding source. The claim locks 60
          minutes into the PAYER bucket; the UPHELD appeal moves exactly those 60 minutes back to
          UNFUNDED, so payer_minutes returns to 0 and unfunded_minutes returns to 60 with no minute
          created or destroyed.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-20T00:00:00Z, later advanced to 2026-07-01T00:00:00Z."
            - "One worker; one ENROLLED patient."
            - "One SUBMITTED June encounter with billable_minutes 60."
            - "One FINAL PayerClaim for 2026-06 in status APPEALED after a denial on 2026-06-20."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "W-025" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-230", full_name: "Appeal Case", household_size: 1, monthly_income_cents: 80000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p1: $.data.id }
            - call: "PATCH /chw/patients/${p1}"
              payload: { enrollment_action: "ENROLL" }
              as: Supervisor
              as_user_id: "sup-1"
            - call: "POST /chw/encounters"
              payload: { patient_id: "${p1}", chw_id: "${w1}", encounter_date: "2026-06-10", direct_minutes: 50, indirect_minutes: 5, travel_minutes: 0, documentation_minutes: 5 }
              as: CHW
              as_user_id: "${w1}"
              captures: { e1: $.data.id }
            - call: "POST /chw/encounters/${e1}/submit"
              payload: {}
              as: CHW
              as_user_id: "${w1}"
            - call: "POST /chw/payer-claims"
              payload: { patient_id: "${p1}", service_month: "2026-06", basis: "FINAL" }
              as: BillingSpecialist
              as_user_id: "bill-1"
              captures: { cl: $.data.id }
            - call: "POST /chw/payer-claims/${cl}/adjudicate"
              payload: { outcome: "DENIED", denial_reason: "Documentation insufficient" }
              as: BillingSpecialist
              as_user_id: "bill-1"
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/payer-claims/${cl}/appeal"
              payload: {}
              as: BillingSpecialist
              as_user_id: "bill-1"
          trigger:
            - call: "POST /chw/payer-claims/${cl}/appeal-decision"
              payload: { decision: "UPHELD" }
              as: BillingSpecialist
              as_user_id: "bill-1"
            - call: "GET /chw/reports/program-summary"
              payload: { service_month: "2026-06", denominator_basis: "ENROLLED_ONLY" }
              as: BillingSpecialist
              as_user_id: "bill-1"
          assert:
            - "PayerClaim.${cl}.claimed_minutes == 60"
            - "PayerClaim.${cl}.allowed_amount_cents == 8600"
            - "PayerClaim.${cl}.status == UPHELD"
            - "PayerClaim.${cl}.denied_at == 2026-06-20T00:00:00.000Z"
            - "Encounter.${e1}.status == SUBMITTED"
            - "Encounter.${e1}.funding_source == UNFUNDED"
            - "Encounter.${e1}.funding_claim_id == null"
            - "report.payer_minutes == 0"
            - "report.grant_minutes == 0"
            - "report.unfunded_minutes == 60"
            - "report.patient_denominator_count == 1"
