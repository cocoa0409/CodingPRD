    description: "Ingest a LogEvent"
    roles: [IngestionAgent]
    code: 201
    input: [size_bytes, service_tag, ingested_at_utc, "retention_tier_id?"]
    output: LogEvent
    side_effects:
      - "evaluates ExclusionFilters synchronously; sets exclusion_state"
      - "bumps LOG_INGEST MeterAccumulator by size_bytes"
