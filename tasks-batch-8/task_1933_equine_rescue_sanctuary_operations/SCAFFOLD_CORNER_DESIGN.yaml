            - { call: "POST /rescue-ops/care-service-appointments", payload: { horse_id: "${h}", practitioner_id: "${far}", service_type: FARRIER_SHOEING, scheduled_start: "2026-08-18T09:00:00Z", scheduled_end: "2026-08-18T10:00:00Z" }, as: IntakeCoordinator, captures: { a2: $.data.id } }
