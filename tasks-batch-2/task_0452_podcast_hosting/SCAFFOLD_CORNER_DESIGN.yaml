              as: PlatformAdmin
          trigger:
            - call: "POST /ad-placements/${pRec}/reconcile"
              payload: {}
              as: PlatformAdmin
          assert:
            - "AdPlacement.${pRec}.final_cost_cents == 150"
            - "AdCampaign.${cRec}.reserved_budget_cents == 0"
            - "AdCampaign.${cRec}.spent_budget_cents == 150"
            - "AdCampaign.${cRec}.available_budget_cents == 999850"

