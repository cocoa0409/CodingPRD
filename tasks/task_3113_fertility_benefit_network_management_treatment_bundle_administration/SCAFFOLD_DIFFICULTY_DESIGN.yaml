            - "OutcomeRecord.${or21}.outcome_status == VOIDED and OutcomeRecord.${or21}.void_reason == \"duplicate submission from the clinic feed\" after the trigger"
            - "Clinic.${c19}.cycles_reported == 0 and Clinic.${c19}.live_birth_rate_bps == 0 and Clinic.${c19}.multiple_birth_rate_bps == 0 after the void — the record leaves BOTH the numerator and the denominator"
            - "the invariant cardinality(RECORDED or AMENDED rows for ${c19}) + cardinality(VOIDED rows for ${c19}) == 1 holds after the void, because the voided row is retained rather than deleted"
            - "Member.${m25}.live_births_recorded == 0 after the void, having been 1 before it"
            - "GET /outcome-records?clinic_id=${c19} returns exactly 1 row and GET /outcome-records?clinic_id=${c19}&outcome_status=VOIDED returns exactly that row"
            - "Clinic.${c19}.clinic_status == PROBATION is false — with maturity_report_threshold 1 and zero reported cycles the clinic falls to gate G2, so the void does not manufacture a breach"
            - "Clinic.${c19}.version > ${c19v2} and Member.${m25}.version > ${m25v2}"
