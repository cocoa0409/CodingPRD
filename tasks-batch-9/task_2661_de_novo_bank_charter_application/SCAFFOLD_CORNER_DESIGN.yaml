# SCAFFOLD_CORNER_DESIGN.yaml - task_2661 De Novo Bank Charter Application
# Section 1.9 breadth probe. Sections and claim_type values are taken from
# references/claim-extraction-guide.md; no categories are invented. Corners already
# exercised by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
scaffold_corner_design:
  - section: entities
    instances:
      - name: entity_creation_organizing_group_returns_declared_defaults
        claim_type: creation
        grounds:
          - entities.OrganizingGroup
          - endpoints[POST /de-novo/organizing-groups]
          - response_envelope
          - roles[CharterCounsel]
        distinguishing_aspect: >
          A single POST with every required field returns 201 and every system/computed default the
          entity table declares - stage ORGANIZING, composition_status FORMING, all four counters at
          zero, management_composite_score 0.00, opening_blocked_reason NONE, supervision_started_at
          null, version 1 - rather than only echoing the four input fields.
        test_recipe:
          setup:
            - "Empty database."
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /de-novo/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /de-novo/organizing-groups"
              payload: { proposed_bank_name: "Cascade Charter Bank", home_state_code: "WA", charter_type: "NATIONAL", target_opening_date: "2027-03-01T00:00:00Z" }
              as: CharterCounsel
              captures: { g_id: $.data.id }
          assert:
            - "the call returns 201 and $.response_type == object with a $.meta.api_request_id present"
            - "OrganizingGroup.${g_id}.proposed_bank_name == Cascade Charter Bank"
            - "OrganizingGroup.${g_id}.home_state_code == WA"
            - "OrganizingGroup.${g_id}.charter_type == NATIONAL"
            - "OrganizingGroup.${g_id}.target_opening_date == 2027-03-01T00:00:00Z"
            - "OrganizingGroup.${g_id}.stage == ORGANIZING"
            - "OrganizingGroup.${g_id}.composition_status == FORMING"
            - "OrganizingGroup.${g_id}.organizer_count == 0"
            - "OrganizingGroup.${g_id}.independent_organizer_count == 0"
            - "OrganizingGroup.${g_id}.max_affiliation_count == 0"
            - "OrganizingGroup.${g_id}.management_composite_score == 0.00"
            - "OrganizingGroup.${g_id}.opening_blocked_reason == NONE"
            - "OrganizingGroup.${g_id}.supervision_started_at == null"
            - "OrganizingGroup.${g_id}.supervision_year_index == 0"
            - "OrganizingGroup.${g_id}.version == 1 and id, created_at, updated_at are all present"
      - name: entity_retrieval_business_plan_get_returns_stored_row
        claim_type: retrieval
        grounds:
          - entities.BusinessPlan
          - endpoints[GET /de-novo/business-plans/{plan_id}]
        distinguishing_aspect: >
          The read-back of a freshly created BusinessPlan returns the twelve stored projection
          figures byte-for-byte plus the computed aggregates in their zero state
          (stress_scenario_count 0, breach_scenario_count 0,
          worst_governing_min_leverage_ratio_bps 0) - the GET is not a re-derivation.
        test_recipe:
          setup:
            - "One OrganizingGroup at stage ORGANIZING."
            - "One DRAFT BusinessPlan created with the canonical projection set"
            - "(opening_tier1_capital_cents 4,000,000,000; assets 25/34/43 bn; loans 15/21/28 bn;"
            - "deposits 21/29/37 bn) and no stress scenarios."
          setup_api_calls:
            - call: "POST /de-novo/organizing-groups"
              payload: { proposed_bank_name: "Cascade Charter Bank", home_state_code: "WA", charter_type: "NATIONAL", target_opening_date: "2027-03-01T00:00:00Z" }
              as: CharterCounsel
              captures: { g_id: $.data.id }
            - call: "GET /de-novo/organizing-groups/${g_id}"
              payload: {}
              as: CharterCounsel
              captures: { g_v: $.data.version }
            - call: "POST /de-novo/business-plans"
              payload: { group_id: "${g_id}", expected_group_version: "${g_v}", opening_tier1_capital_cents: 4000000000, projected_assets_y1_cents: 25000000000, projected_assets_y2_cents: 34000000000, projected_assets_y3_cents: 43000000000, projected_loans_y1_cents: 15000000000, projected_loans_y2_cents: 21000000000, projected_loans_y3_cents: 28000000000, projected_deposits_y1_cents: 21000000000, projected_deposits_y2_cents: 29000000000, projected_deposits_y3_cents: 37000000000, projected_net_income_y1_cents: -250000000, projected_net_income_y2_cents: 120000000, projected_net_income_y3_cents: 460000000, projected_branch_count: 3 }
              as: CharterCounsel
              captures: { p_id: $.data.id }
          trigger:
            - call: "GET /de-novo/business-plans/${p_id}"
              payload: {}
              as: CharterCounsel
          assert:
            - "the call returns 200 and $.response_type == object"
            - "BusinessPlan.${p_id}.group_id == ${g_id}"
            - "BusinessPlan.${p_id}.opening_tier1_capital_cents == 4000000000"
            - "BusinessPlan.${p_id}.projected_assets_y3_cents == 43000000000"
            - "BusinessPlan.${p_id}.projected_loans_y3_cents == 28000000000"
            - "BusinessPlan.${p_id}.projected_net_income_y1_cents == -250000000"
            - "BusinessPlan.${p_id}.projected_branch_count == 3"
            - "BusinessPlan.${p_id}.supersedes_plan_id == null"
            - "BusinessPlan.${p_id}.plan_revision_index == 1"
            - "BusinessPlan.${p_id}.status == DRAFT"
            - "BusinessPlan.${p_id}.stress_scenario_count == 0"
            - "BusinessPlan.${p_id}.breach_scenario_count == 0"
            - "BusinessPlan.${p_id}.worst_governing_min_leverage_ratio_bps == 0"
            - "BusinessPlan.${p_id}.version == 1"
      - name: entity_listing_organizers_paginates_and_filters_by_independence
        claim_type: listing
        grounds:
          - entities.Organizer
          - endpoints[GET /de-novo/organizers]
          - response_envelope.pagination_fields
        distinguishing_aspect: >
          Six Organizers exist in one group; limit 2 / offset 0 returns exactly two rows with
          total_count 6 and has_more true, while the is_independent=true filter returns exactly the
          three independent rows with has_more false - the filter changes total_count, proving it is
          applied before pagination, not after.
        test_recipe:
          setup:
            - "One OrganizingGroup with six Organizers: five board members (two FIRSTCAP affiliates and"
            - "three independents) plus one INVESTOR_ONLY organizer."
            - "Three of the six have is_independent == true."
          setup_api_calls:
            - call: "POST /de-novo/organizing-groups"
              payload: { proposed_bank_name: "Cascade Charter Bank", home_state_code: "WA", charter_type: "NATIONAL", target_opening_date: "2027-03-01T00:00:00Z" }
              as: CharterCounsel
              captures: { g_id: $.data.id }
            - call: "POST /de-novo/organizing-groups/${g_id}/organizers"
              payload: { full_name: "Dana Whitfield", role_on_board: "PROPOSED_CEO", is_independent: false, affiliation_code: "FIRSTCAP", banking_years: 7, regulatory_experience_score: 83 }
              as: CharterCounsel
              captures: { o1_id: $.data.id }
            - call: "POST /de-novo/organizing-groups/${g_id}/organizers"
              payload: { full_name: "Marcus Ibarra", role_on_board: "PROPOSED_CFO", is_independent: false, affiliation_code: "FIRSTCAP", banking_years: 13, regulatory_experience_score: 71 }
              as: CharterCounsel
              captures: { o2_id: $.data.id }
            - call: "POST /de-novo/organizing-groups/${g_id}/organizers"
              payload: { full_name: "Priya Raghunathan", role_on_board: "PROPOSED_CRO", is_independent: true, affiliation_code: "IND_A", banking_years: 3, regulatory_experience_score: 66 }
              as: CharterCounsel
              captures: { o3_id: $.data.id }
            - call: "POST /de-novo/organizing-groups/${g_id}/organizers"
              payload: { full_name: "Elena Kowalski", role_on_board: "PROPOSED_CCO", is_independent: true, affiliation_code: "IND_B", banking_years: 20, regulatory_experience_score: 90 }
              as: CharterCounsel
              captures: { o4_id: $.data.id }
            - call: "POST /de-novo/organizing-groups/${g_id}/organizers"
              payload: { full_name: "Theo Nakamura", role_on_board: "DIRECTOR", is_independent: true, affiliation_code: "IND_C", banking_years: 10, regulatory_experience_score: 54 }
              as: CharterCounsel
              captures: { o5_id: $.data.id }
            - call: "POST /de-novo/organizing-groups/${g_id}/organizers"
              payload: { full_name: "Roland Achebe", role_on_board: "INVESTOR_ONLY", is_independent: false, affiliation_code: "INV_D", banking_years: 2, regulatory_experience_score: 40 }
              as: CharterCounsel
              captures: { o6_id: $.data.id }
          trigger:
            - call: "GET /de-novo/organizers"
              payload: { group_id: "${g_id}", limit: 2, offset: 0 }
              as: CharterCounsel
            - call: "GET /de-novo/organizers"
              payload: { group_id: "${g_id}", is_independent: true, limit: 10, offset: 0 }
              as: CharterCounsel
          assert:
            - "the first call returns 200 with $.response_type == array and exactly 2 Organizer rows"
            - "the first call reports total_count == 6 and has_more == true with limit 2 and offset 0"
            - "the second call returns exactly 3 Organizer rows, total_count == 3 and has_more == false"
            - "every row of the second call has is_independent == true"
            - "no row of either call belongs to a group other than ${g_id}"
      - name: entity_not_found_get_subscription_unknown_id_returns_404
        claim_type: not_found
        grounds:
          - validations[priority=5]
          - errors[ERR_SUBSCRIPTION_NOT_FOUND]
          - endpoints[GET /de-novo/subscriptions/{subscription_id}]
          - response_envelope.error
        distinguishing_aspect: >
          A syntactically valid but unknown subscription id returns the entity-specific
          ERR_SUBSCRIPTION_NOT_FOUND at 404 - not a generic 404 body and not ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "Empty database apart from the clock call."
            - "No Subscription row exists with id 00000000-0000-0000-0000-0000000000ff."
          setup_api_calls:
            - call: "POST /de-novo/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /de-novo/subscriptions/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: EscrowAgent
              captures: { err_id: $.data.error_id }
          assert:
            - "the call returns 404"
            - "$.data.error_id == ERR_SUBSCRIPTION_NOT_FOUND"
            - "$.response_type == error and $.data.message is a non-empty string"
            - "$.meta.api_request_id is present on the error envelope too"
      - name: entity_required_field_missing_charter_type_is_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /de-novo/organizing-groups]
          - entities.OrganizingGroup.fields.charter_type
        distinguishing_aspect: >
          charter_type has source: input with no default, so omitting it is a 422
          ERR_INVALID_REQUEST rather than a silently defaulted NATIONAL group.
        test_recipe:
          setup:
            - "Empty database apart from the clock call."
          setup_api_calls:
            - call: "POST /de-novo/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /de-novo/organizing-groups"
              payload: { proposed_bank_name: "Cascade Charter Bank", home_state_code: "WA", target_opening_date: "2027-03-01T00:00:00Z" }
              as: CharterCounsel
              captures: { err_id: $.data.error_id }
          assert:
            - "the call returns 422"
            - "$.data.error_id == ERR_INVALID_REQUEST"
            - "no OrganizingGroup row is created - the response carries no $.data.id"
      - name: entity_defaults_vendor_contract_starts_evaluating_with_zero_windows
        claim_type: defaults
        grounds:
          - entities.VendorContract.fields.status
          - entities.VendorContract.fields.active_window_count
          - state_machines.VendorContract.initial_state
          - endpoints[POST /de-novo/vendor-contracts]
        distinguishing_aspect: >
          A VendorContract created without any status input lands on the declared default
          EVALUATING with active_window_count 0 - not SELECTED, and not the criticality-dependent
          status a due-diligence score of 61 might suggest.
        test_recipe:
          setup:
            - "One OrganizingGroup at stage ORGANIZING and no vendor contracts."
          setup_api_calls:
            - call: "POST /de-novo/organizing-groups"
              payload: { proposed_bank_name: "Cascade Charter Bank", home_state_code: "WA", charter_type: "NATIONAL", target_opening_date: "2027-03-01T00:00:00Z" }
              as: CharterCounsel
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /de-novo/vendor-contracts"
              payload: { group_id: "${g_id}", service_domain: "DIGITAL_BANKING", vendor_name: "Northlight Digital", annual_cost_cents: 24000000, contract_term_months: 36, due_diligence_score: 61, criticality: "SIGNIFICANT" }
              as: CharterCounsel
              captures: { vc_b_id: $.data.id }
          assert:
            - "the call returns 201"
            - "VendorContract.${vc_b_id}.status == EVALUATING"
            - "VendorContract.${vc_b_id}.active_window_count == 0"
            - "VendorContract.${vc_b_id}.criticality == SIGNIFICANT"
            - "VendorContract.${vc_b_id}.due_diligence_score == 61"
            - "VendorContract.${vc_b_id}.version == 1"
      - name: entity_computed_field_subscription_amount_is_shares_times_price
        claim_type: computed_fields
        grounds:
          - calculations.subscription_amount
          - calculations.escrow_position
          - entities.Subscription.fields.amount_cents
          - entities.Subscription.fields.counts_toward_escrow
          - endpoints[POST /de-novo/subscriptions]
        distinguishing_aspect: >
          amount_cents is not an input field: 1,250,000 shares against the raise's pinned
          offering_price_cents_per_share of 1000 must persist exactly 1,250,000,000 cents, and the
          new row must not count toward escrow because it is only PLEDGED and UNSCREENED.
        test_recipe:
          setup:
            - "One OrganizingGroup at stage ORGANIZING."
            - "One CapitalRaise in status OPEN with offering_price_cents_per_share 1000,"
            - "max_shares 5,000,000, target 4,300,000,000, minimum 4,100,000,000 and"
            - "organizational_expense_claim_cents 150,000,000."
            - "No subscriptions yet, so every raise aggregate is 0."
          setup_api_calls:
            - call: "POST /de-novo/organizing-groups"
              payload: { proposed_bank_name: "Cascade Charter Bank", home_state_code: "WA", charter_type: "NATIONAL", target_opening_date: "2027-03-01T00:00:00Z" }
              as: CharterCounsel
              captures: { g_id: $.data.id }
            - call: "POST /de-novo/capital-raises"
              payload: { group_id: "${g_id}", target_gross_cents: 4300000000, minimum_gross_cents: 4100000000, offering_price_cents_per_share: 1000, max_shares: 5000000, organizational_expense_claim_cents: 150000000 }
              as: CharterCounsel
              captures: { r_id: $.data.id }
            - call: "POST /de-novo/capital-raises/${r_id}/open"
              payload: {}
              as: CharterCounsel
          trigger:
            - call: "POST /de-novo/subscriptions"
              payload: { capital_raise_id: "${r_id}", subscriber_name: "Olympic Coast Holdings", shares: 1250000 }
              as: EscrowAgent
              captures: { s1_id: $.data.id }
          assert:
            - "the call returns 201"
            - "Subscription.${s1_id}.amount_cents == 1250000000"
            - "Subscription.${s1_id}.funding_state == PLEDGED"
            - "Subscription.${s1_id}.clearance_state == UNSCREENED"
            - "Subscription.${s1_id}.counts_toward_escrow == false"
            - "CapitalRaise.${r_id}.subscribed_shares == 1250000"
            - "CapitalRaise.${r_id}.pledged_gross_cents == 1250000000"
            - "CapitalRaise.${r_id}.funded_gross_cents == 0"
            - "CapitalRaise.${r_id}.cleared_escrow_cents == 0"
            - "CapitalRaise.${r_id}.projected_reimbursement_cents == 0"
            - "CapitalRaise.${r_id}.projected_net_release_cents == 0"
      - name: entity_system_fields_are_server_minted_on_policy_document
        claim_type: system_fields
        grounds:
          - entities.PolicyDocument.fields.status
          - entities.PolicyDocument.fields.adopted_at
          - entities.PolicyDocument.fields.adopted_by_organizer_id
          - endpoints[POST /de-novo/policy-documents]
        distinguishing_aspect: >
          The four system-sourced fields of a new PolicyDocument (status, adopted_by_organizer_id,
          adopted_at, finding_note) are server-minted: status DRAFT and the other three null, with
          id, created_at, updated_at and version 1 stamped by the server.
        test_recipe:
          setup:
            - "One OrganizingGroup with five cleared, QUALIFIED organizers"
            - "(management_composite_score 71.80)."
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "No policy documents yet."
          setup_api_calls:
            - call: "POST /de-novo/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /de-novo/organizing-groups"
              payload: { proposed_bank_name: "Cascade Charter Bank", home_state_code: "WA", charter_type: "NATIONAL", target_opening_date: "2027-03-01T00:00:00Z" }
              as: CharterCounsel
              captures: { g_id: $.data.id }
            - call: "POST /de-novo/organizing-groups/${g_id}/organizers"
              payload: { full_name: "Dana Whitfield", role_on_board: "PROPOSED_CEO", is_independent: false, affiliation_code: "FIRSTCAP", banking_years: 7, regulatory_experience_score: 83 }
              as: CharterCounsel
              captures: { o1_id: $.data.id }
            - call: "POST /de-novo/organizing-groups/${g_id}/organizers"
              payload: { full_name: "Marcus Ibarra", role_on_board: "PROPOSED_CFO", is_independent: false, affiliation_code: "FIRSTCAP", banking_years: 13, regulatory_experience_score: 71 }
              as: CharterCounsel
              captures: { o2_id: $.data.id }
            - call: "POST /de-novo/organizing-groups/${g_id}/organizers"
              payload: { full_name: "Priya Raghunathan", role_on_board: "PROPOSED_CRO", is_independent: true, affiliation_code: "IND_A", banking_years: 3, regulatory_experience_score: 66 }
              as: CharterCounsel
              captures: { o3_id: $.data.id }
            - call: "POST /de-novo/organizing-groups/${g_id}/organizers"
              payload: { full_name: "Elena Kowalski", role_on_board: "PROPOSED_CCO", is_independent: true, affiliation_code: "IND_B", banking_years: 20, regulatory_experience_score: 90 }
              as: CharterCounsel
              captures: { o4_id: $.data.id }
            - call: "POST /de-novo/organizing-groups/${g_id}/organizers"
              payload: { full_name: "Theo Nakamura", role_on_board: "DIRECTOR", is_independent: true, affiliation_code: "IND_C", banking_years: 10, regulatory_experience_score: 54 }
              as: CharterCounsel
              captures: { o5_id: $.data.id }
            - call: "POST /de-novo/organizers/${o1_id}/background-result"
              payload: { dimension: "FINGERPRINT", outcome: "CLEARED" }
              as: CharteringExaminer
            - call: "POST /de-novo/organizers/${o1_id}/background-result"
              payload: { dimension: "CREDIT", outcome: "CLEARED" }
              as: CharteringExaminer
            - call: "POST /de-novo/organizers/${o2_id}/background-result"
              payload: { dimension: "FINGERPRINT", outcome: "CLEARED" }
              as: CharteringExaminer
            - call: "POST /de-novo/organizers/${o2_id}/background-result"
              payload: { dimension: "CREDIT", outcome: "CLEARED" }
              as: CharteringExaminer
            - call: "POST /de-novo/organizers/${o3_id}/background-result"
              payload: { dimension: "FINGERPRINT", outcome: "CLEARED" }
              as: CharteringExaminer
            - call: "POST /de-novo/organizers/${o3_id}/background-result"
              payload: { dimension: "CREDIT", outcome: "CLEARED" }
              as: CharteringExaminer
            - call: "POST /de-novo/organizers/${o4_id}/background-result"
              payload: { dimension: "FINGERPRINT", outcome: "CLEARED" }
              as: CharteringExaminer
            - call: "POST /de-novo/organizers/${o4_id}/background-result"
              payload: { dimension: "CREDIT", outcome: "CLEARED" }
              as: CharteringExaminer
            - call: "POST /de-novo/organizers/${o5_id}/background-result"
              payload: { dimension: "FINGERPRINT", outcome: "CLEARED" }
              as: CharteringExaminer
            - call: "POST /de-novo/organizers/${o5_id}/background-result"
              payload: { dimension: "CREDIT", outcome: "CLEARED" }
              as: CharteringExaminer
          trigger:
            - call: "POST /de-novo/policy-documents"
              payload: { group_id: "${g_id}", domain: "LENDING", drafted_by_organizer_id: "${o1_id}", document_title: "Lending and Credit Administration Policy" }
              as: LeadOrganizer
              as_user_id: "${o1_id}"
              captures: { pol_len_id: $.data.id }
          assert:
            - "the call returns 201"
            - "PolicyDocument.${pol_len_id}.status == DRAFT"
            - "PolicyDocument.${pol_len_id}.adopted_by_organizer_id == null"
            - "PolicyDocument.${pol_len_id}.adopted_at == null"
            - "PolicyDocument.${pol_len_id}.finding_note == null"
            - "PolicyDocument.${pol_len_id}.drafted_by_organizer_id == ${o1_id}"
            - "PolicyDocument.${pol_len_id}.version == 1 and id, created_at, updated_at are present"
      - name: entity_type_constraint_invalid_charter_type_enum_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
          - entities.OrganizingGroup.fields.charter_type
        distinguishing_aspect: >
          charter_type is constrained to {NATIONAL, STATE_MEMBER, STATE_NONMEMBER}; the
          plausible-looking member FEDERAL_THRIFT is not declared and must be rejected 422 at
          priority 4, before any stage or composition logic runs.
        test_recipe:
          setup:
            - "Empty database apart from the clock call."
          setup_api_calls:
            - call: "POST /de-novo/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /de-novo/organizing-groups"
              payload: { proposed_bank_name: "Cascade Charter Bank", home_state_code: "WA", charter_type: "FEDERAL_THRIFT", target_opening_date: "2027-03-01T00:00:00Z" }
              as: CharterCounsel
              captures: { err_id: $.data.error_id }
          assert:
            - "the call returns 422"
            - "$.data.error_id == ERR_INVALID_REQUEST"
            - "no OrganizingGroup row is created"
      - name: entity_parent_stress_scenario_under_unknown_plan_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=5]
          - errors[ERR_BUSINESS_PLAN_NOT_FOUND]
          - endpoints[POST /de-novo/business-plans/{plan_id}/stress-scenarios]
          - entities.StressScenario.parent
        distinguishing_aspect: >
          StressScenario is created only under a parent path id; an unknown {plan_id} is refused at
          priority 5 with ERR_BUSINESS_PLAN_NOT_FOUND, before the enum and range checks on the
          scenario body would run.
        test_recipe:
          setup:
            - "One OrganizingGroup with one real DRAFT BusinessPlan, so the endpoint is reachable."
            - "No BusinessPlan exists with id 00000000-0000-0000-0000-0000000000ff."
          setup_api_calls:
            - call: "POST /de-novo/organizing-groups"
              payload: { proposed_bank_name: "Cascade Charter Bank", home_state_code: "WA", charter_type: "NATIONAL", target_opening_date: "2027-03-01T00:00:00Z" }
              as: CharterCounsel
              captures: { g_id: $.data.id }
            - call: "GET /de-novo/organizing-groups/${g_id}"
              payload: {}
              as: CharterCounsel
              captures: { g_v: $.data.version }
