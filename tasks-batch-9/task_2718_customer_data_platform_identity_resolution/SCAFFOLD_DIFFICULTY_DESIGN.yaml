          assert:
            - "Destination.${dest_id}.remaining_daily_hash_quota == 500 before the trigger sequence"
            - "after trigger step 1 Activation.${act_id}.status == DISPATCHED with audience_size 2 and dispatched_hash_count 2"
            - "after trigger step 1 Destination.${dest_id}.remaining_daily_hash_quota == 498"
            - "after trigger step 2 Activation.${act_id}.status == PAUSED with paused_reason OPERATOR"
            - "after trigger step 2 Destination.${dest_id}.remaining_daily_hash_quota == 500"
            - "after trigger step 3 Activation.${act_id}.status == ACTIVE with dispatched_hash_count 2"
            - "after trigger step 3 Destination.${dest_id}.remaining_daily_hash_quota == 498"
            - "after trigger step 4 Activation.${act_id}.status == PAUSED"
            - "after trigger step 4 Destination.${dest_id}.remaining_daily_hash_quota == 500, i.e. the invariant remaining == 500 - SUM(dispatched_hash_count over {DISPATCHED, ACTIVE, UNDERPERFORMING}) holds at every step with zero drift"
            - "Segment.${seg_id}.active_activation_count == 0 after trigger step 4"
            - "Destination.${dest_id}.quota_reset_on == 2026-08-01 throughout, proving the restoration came from refunds and not from a daily reset"

      - name: lifetime_value_conserved_by_confirmed_merge
        grounds:
          - calculations.merge_survivorship
          - entities.Profile.fields.lifetime_value_cents
          - state_machines.Profile.RESOLVED_to_MERGED_AWAY
          - endpoints[POST /cdp/identity-links/{linkId}/decision]
        distinguishing_aspect: |
          Conserved quantity: MONEY — SUM(Profile.lifetime_value_cents) over profiles with
          resolution_status != MERGED_AWAY, a different quantity and a different ledger from the
          sibling instance's hash units. A CONFIRM merge moves 400 cents from the loser to the
          survivor (1000 + 400 = 1400) and zeroes the loser, so the visible total is 1400 both
          before and after; nothing is created and nothing is destroyed.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One SourceSystem LTV_SRC (trust_tier 3) and one PROMOTED batch of two fully valid records in postal 10001, each with an EMAIL/MARKETING OPT_IN signal and a null address_line so no Household forms; both profiles therefore have source_record_count 1 and the same trust_tier, leaving created_at as the survivor discriminator."
            - "One ACTIVE EMAIL Destination DEST_LTV with daily_hash_quota 1000, min_audience_size 1, min_match_rate 0.10."
            - "One APPROVED Segment SEG_LTV with criteria postal_code EQ 10001, one Activation dispatched to DEST_LTV, and one match report attributing 1000 cents to the first profile and 400 cents to the second, so the visible total is 1400."
            - "One PROBABILISTIC MatchRule PROB_LTV: STRICT_ZERO, review_floor 0.65, auto_merge_threshold 0.92, min_precision 0.40, and one PROPOSED IdentityLink over the pair at confidence 0.8500 (below auto_merge_threshold, so the merge needs a steward)."
          setup_api_calls:
            - call: "POST /cdp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DataPlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /cdp/source-systems"
              payload:
                code: "LTV_SRC"
                display_name: "Transactions LTV Feed"
                channel_type: "TRANSACTIONS"
                trust_tier: 3
              as: DataPlatformAdmin
              as_user_id: "u_admin"
              captures: { src_id: "$.data.id" }
            - call: "POST /cdp/ingest-batches"
              payload:
                source_system_id: "${src_id}"
                batch_label: "LTV Pair"
                records:
                  - external_id: "L1"
                    email_raw: "l1@example.com"
                    phone_raw: "+1 (555) 190-0001"
                    loyalty_number: "LY00001801"
                    first_name: "Ada"
                    last_name: "Alpha"
                    postal_code: "10001"
                    address_line: null
                    event_timestamp: "2026-07-17T10:00:00Z"
                    consent_signals:
                      - { channel: "EMAIL", purpose: "MARKETING", consent_state: "OPT_IN" }
                  - external_id: "L2"
                    email_raw: "l2@example.com"
                    phone_raw: "+1 (555) 190-0002"
                    loyalty_number: "LY00001802"
                    first_name: "Ada"
                    last_name: "Alpha"
                    postal_code: "10001"
                    address_line: null
                    event_timestamp: "2026-07-17T11:00:00Z"
                    consent_signals:
                      - { channel: "EMAIL", purpose: "MARKETING", consent_state: "OPT_IN" }
              as: DataEngineer
              as_user_id: "u_eng"
              captures: { batch_id: "$.data.id" }
            - call: "POST /cdp/ingest-batches/${batch_id}/validate"
              payload: {}
              as: DataEngineer
              as_user_id: "u_eng"
            - call: "POST /cdp/ingest-batches/${batch_id}/promote"
              payload: {}
              as: DataEngineer
              as_user_id: "u_eng"
            - call: "GET /cdp/profiles"
              payload: { origin_batch_id: "${batch_id}" }
              as: IdentitySteward
              as_user_id: "u_steward"
              captures:
                p1_id: "$.data[0].id"
                p2_id: "$.data[1].id"
            - call: "POST /cdp/destinations"
              payload:
                code: "DEST_LTV"
                platform_kind: "ADVERTISING"
                channel: "EMAIL"
                hashing_algorithm: "SHA256_EMAIL_LOWER"
                daily_hash_quota: 1000
                min_audience_size: 1
                min_match_rate: 0.10
                cooldown_minutes: 0
              as: DataPlatformAdmin
              as_user_id: "u_admin"
              captures: { dest_id: "$.data.id" }
            - call: "POST /cdp/segments"
              payload:
                name: "LTV Conservation Segment"
                criteria:
                  - { attribute: "postal_code", operator: "EQ", value: "10001" }
              as: SegmentAnalyst
              as_user_id: "u_analyst"
              captures: { seg_id: "$.data.id" }
            - call: "POST /cdp/segments/${seg_id}/submit-for-review"
              payload: {}
              as: SegmentAnalyst
              as_user_id: "u_analyst"
            - call: "POST /cdp/segments/${seg_id}/governance-decision"
              payload: { decision: "APPROVE", sensitive_use_approved: false }
              as: DataGovernanceOfficer
              as_user_id: "u_gov"
              captures: { seg_v_after_approve: "$.data.version" }
            - call: "POST /cdp/activations"
              payload:
                segment_id: "${seg_id}"
                destination_id: "${dest_id}"
                window_start_at: "2026-08-02T00:00:00Z"
                window_end_at: "2026-08-02T02:00:00Z"
                expected_segment_version: "${seg_v_after_approve}"
              as: SegmentAnalyst
              as_user_id: "u_analyst"
              captures: { act_id: "$.data.id" }
            - call: "POST /cdp/activations/${act_id}/dispatch"
              payload: {}
              as: SegmentAnalyst
              as_user_id: "u_analyst"
            - call: "POST /cdp/activations/${act_id}/match-report"
              payload:
                vendor_matched_count: 2
                unusable_hash_count: 0
                attributed_conversions:
                  - { profile_id: "${p1_id}", converted_at: "2026-08-02T10:00:00Z", revenue_cents: 1000 }
                  - { profile_id: "${p2_id}", converted_at: "2026-08-02T11:00:00Z", revenue_cents: 400 }
              as: DestinationPlatform
              as_user_id: "${dest_id}"
            - call: "POST /cdp/match-rules"
              payload:
                code: "PROB_LTV"
                rule_kind: "PROBABILISTIC"
                deterministic_key: null
                missing_identifier_policy: "STRICT_ZERO"
                auto_merge_threshold: 0.92
                review_floor: 0.65
                min_precision: 0.40
              as: DataPlatformAdmin
              as_user_id: "u_admin"
              captures: { rule_id: "$.data.id" }
            - call: "POST /cdp/identity-links"
              payload:
                left_profile_id: "${p1_id}"
                right_profile_id: "${p2_id}"
                match_rule_id: "${rule_id}"
                evidence: { email_similarity: 1.0, phone_similarity: 1.0, name_similarity: 1.0, address_similarity: 0.0 }
              as: IdentitySteward
              as_user_id: "u_steward"
              captures: { link_id: "$.data.id" }
          trigger:
            - call: "POST /cdp/identity-links/${link_id}/decision"
              payload: { decision: "CONFIRM" }
              as: IdentitySteward
              as_user_id: "u_steward"
          assert:
            - "before the trigger Profile.${p1_id}.lifetime_value_cents == 1000 and Profile.${p2_id}.lifetime_value_cents == 400, so the visible total is 1400"
            - "IdentityLink.${link_id}.confidence == 0.8500 and its status was PROPOSED before the trigger"
            - "the trigger returns status 200"
            - "IdentityLink.${link_id}.status == CONFIRMED"
            - "IdentityLink.${link_id}.survivor_profile_id == ${p1_id} because both profiles have source_record_count 1 and the same trust_tier, so the earlier created_at wins"
            - "Profile.${p2_id}.resolution_status == MERGED_AWAY"
            - "Profile.${p2_id}.merged_into_profile_id == ${p1_id}"
            - "Profile.${p2_id}.lifetime_value_cents == 0"
            - "Profile.${p1_id}.lifetime_value_cents == 1400"
            - "SUM(lifetime_value_cents) over profiles with resolution_status != MERGED_AWAY == 1400, identical to the pre-merge total"
            - "Profile.${p1_id}.source_record_count == 2, so SUM(source_record_count) over the same set is also unchanged at 2"
            - "Activation.${act_id}.attributed_conversion_count == 2 — the conversion ledger is not rewritten by the merge"
            - "MatchRule.${rule_id}.confirmed_count == 1 and precision_estimate == 1.0000"
