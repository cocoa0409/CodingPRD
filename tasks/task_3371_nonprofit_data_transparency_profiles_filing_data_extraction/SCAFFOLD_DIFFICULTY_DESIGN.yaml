              payload: { legal_name: "Southgate Services", ein: "444555666", org_type: "501C3", state_code: "MN" }
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { sg_id: $.data.id }
            - &hl_org
              call: "POST /nonprofits/organizations"
              payload: { legal_name: "Harborlight Fund", ein: "777888999", org_type: "501C3", state_code: "MN" }
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { hl_id: $.data.id }
            - call: "POST /nonprofits/organizations/${ng_id}/grants"
              payload: { funder_organization_id: "${sg_id}", funder_name_raw: "Southgate Services", recipient_name_raw: "Northgate Pantry", recipient_ein: "111222333", amount_cents: 5000000, fiscal_year: 2025 }
              as: DataConsumer
              as_user_id: "${sg_id}"
              captures: { ng_g1: $.data.id }
            - call: "POST /nonprofits/organizations/${ng_id}/grants"
              payload: { funder_organization_id: "${hl_id}", funder_name_raw: "Harborlight Fund", recipient_name_raw: "Northgate Pantry", recipient_ein: "111222333", amount_cents: 2500000, fiscal_year: 2025 }
              as: DataConsumer
              as_user_id: "${hl_id}"
              captures: { ng_g2: $.data.id }
            - call: "POST /nonprofits/identity-cases"
              payload: { subject_organization_id: "${ng_id}", case_type: "MERGE", effective_date: "2026-09-01T00:00:00Z", surviving_organization_id: "${sg_id}", resolution_note: "Northgate Pantry merged into Southgate Services." }
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { ng_case: $.data.id }
          trigger:
            - call: "POST /nonprofits/identity-cases/${ng_case}/finalize"
              payload: { resolution_decision: "FINALIZE" }
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { ng_case_v: $.data.version }
          assert:
            - "IdentityResolutionCase.${ng_case}.status == FINALIZED and reassigned_grant_count == 2"
            - "Organization.${ng_id}.profile_status == MERGED and successor_organization_id == ${sg_id}"
            - "Organization.${ng_id}.distinct_funder_count == 0"
            - "Organization.${sg_id}.distinct_funder_count == 2"
            - "GET /nonprofits/organizations/${sg_id}/grants returns exactly 2 rows, both with recipient_organization_id == ${sg_id}"
            - "GET /nonprofits/organizations/${ng_id}/grants returns exactly 0 rows"

