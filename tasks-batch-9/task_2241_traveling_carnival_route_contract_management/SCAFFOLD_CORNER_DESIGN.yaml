              payload: { channel: "WRISTBAND", units: 100, unit_price_cents: 1000, business_date: "2026-09-04T18:00:00Z" }
              as: TicketingAuditor
              captures: { sale_e10: "$.data.id" }
            - call: "GET /route-stops/${stop_e10}/ticket-sales"
              payload: {}
              as: TicketingAuditor
          assert:
            - "HTTP 201 and TicketSale.${sale_e10}.gross_cents == 100000"
            - "The TicketSale body carries id and created_at only from the common set: no version key and no updated_at key are present"
            - "§1.5 exposes no PUT, PATCH or DELETE route for ticket sales; the sole write is POST /route-stops/{id}/ticket-sales"
            - "GET /route-stops/${stop_e10}/ticket-sales returns total_count == 1 with data[0].id == ${sale_e10} and data[0].channel == \"WRISTBAND\""
            - "RouteStop.${stop_e10}.status == \"OPEN\" is unchanged by the insert"

  # ===========================================================================
  # SECTION 2 — State Machines
  # ===========================================================================
  - section: state_machines
    instances:

      - name: newly_created_rows_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.Route.initial_state
          - state_machines.RouteStop.initial_state
          - state_machines.Contract.initial_state
          - state_machines.RideAllocation.initial_state
          - state_machines.PermitApplication.initial_state
          - entities.RouteStop.fields.operating_days
          - entities.PermitApplication.fields.fee_cents
        distinguishing_aspect: |
          Five machines seed five different initial states in one fixture: Route DRAFT, RouteStop PLANNED with
          compliance_posture already PERMIT_HOLD (no EVENT permit exists yet, so the posture ladder's first rung
          matches on an untouched stop), Contract DRAFT with negotiation_round 0, RideAllocation RESERVED and
          PermitApplication DRAFT. A server that seeds RouteStop.compliance_posture as CLEAR fails.
        test_recipe:
          setup:
            - "Jurisdiction OH; Venue V1 (100000 sqft, 1200 A, attendance 20001); Ride Giant Wheel (MAJOR 4010 sqft / 300 A)."
            - "Route R1 just created; stop A just created (load-in 2026-09-01T06:00Z, open 2026-09-04T12:00Z, close 2026-09-07T12:00Z, teardown 2026-09-08T12:00Z); Contract C1 just created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { state_code: "OH", name: "Ohio", permit_lead_days: 10, amusement_tax_pct: 6.5, permit_fee_cents: 50000 }
              as: PlatformAdmin
              captures: { jur_s1: "$.data.id" }
            - call: "POST /venues"
              payload: { jurisdiction_id: "${jur_s1}", name: "Franklin County Fairgrounds", city: "Columbus", lot_area_sqft: 100000, power_amps_available: 1200, expected_attendance: 20001, lot_surface: "GRAVEL" }
              as: PlatformAdmin
              captures: { ven_s1: "$.data.id" }
            - call: "POST /rides"
              payload: { name: "Giant Wheel", ride_class: "MAJOR", footprint_sqft: 4010, power_amps: 300, crew_size_setup: 6, setup_hours: 8, axle_count: 4, requires_state_inspection: false }
              as: PlatformAdmin
              captures: { ride_s1: "$.data.id" }
            - call: "POST /routes"
              payload: { name: "2026 Midwest Swing", season_year: 2026, home_base_state: "OH" }
              as: RouteManager
              captures: { route_s1: "$.data.id" }
            - call: "POST /route-stops"
              payload: { route_id: "${route_s1}", venue_id: "${ven_s1}", load_in_start: "2026-09-01T06:00:00Z", open_date: "2026-09-04T12:00:00Z", close_date: "2026-09-07T12:00:00Z", teardown_deadline: "2026-09-08T12:00:00Z" }
              as: RouteManager
              captures: { stop_s1: "$.data.id" }
            - call: "POST /contracts"
              payload: { route_stop_id: "${stop_s1}", counterparty_name: "Franklin County Ag Society", revenue_split_pct_operator: 65 }
              as: ContractNegotiator
              captures: { con_s1: "$.data.id" }
            - call: "GET /route-stops/${stop_s1}"
              payload: {}
              as: LotBoss
              captures: { sv_s1: "$.data.version" }
          trigger:
            - call: "POST /ride-allocations"
              payload: { ride_id: "${ride_s1}", route_stop_id: "${stop_s1}", expected_route_stop_version: "${sv_s1}" }
              as: LotBoss
              captures: { alloc_s1: "$.data.id" }
            - call: "POST /permit-applications"
              payload: { route_stop_id: "${stop_s1}", permit_type: "TRANSPORT", valid_from: "2026-09-01T00:00:00Z", valid_until: "2026-09-09T00:00:00Z", axles_declared: 4 }
              as: ComplianceClerk
              captures: { permit_s1: "$.data.id" }
            - call: "GET /routes/${route_s1}"
              payload: {}
              as: RouteManager
            - call: "GET /route-stops/${stop_s1}"
              payload: {}
              as: LotBoss
            - call: "GET /contracts/${con_s1}"
              payload: {}
              as: ContractNegotiator
          assert:
            - "Route.${route_s1}.status == \"DRAFT\" and stop_count == 1 and total_guaranteed_cents == 0"
            - "RouteStop.${stop_s1}.status == \"PLANNED\" and sequence_index == 0 and travel_hours_from_previous == 0"
            - "RouteStop.${stop_s1}.operating_days == 3 and scheduled_operating_hours == 24"
            - "RouteStop.${stop_s1}.compliance_posture == \"PERMIT_HOLD\""
            - "Contract.${con_s1}.status == \"DRAFT\" and negotiation_round == 0 and last_sent_by_user_id == null and executed_at == null"
            - "Contract.${con_s1}.guarantee_cents == 0 and ride_minimum_count == 0 and exclusivity == \"NONE\" and settlement_basis == \"GREATER_OF\""
            - "RideAllocation.${alloc_s1}.status == \"RESERVED\" and released_at == null"
            - "PermitApplication.${permit_s1}.status == \"DRAFT\" and submitted_at == null and decided_at == null"
            - "PermitApplication.${permit_s1}.fee_cents == 56000 (50000 + 4 * 1500 TRANSPORT axle surcharge)"

      - name: begin_setup_on_a_planned_stop_is_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.RouteStop.transitions.CONFIRMED_to_SETUP
          - validations[priority=41]
          - errors[ERR_STOP_STATE_INVALID]
        distinguishing_aspect: |
          begin-setup is declared only from CONFIRMED, and CONFIRMED is reachable only through contract
          execution — so a PLANNED stop fails on the priority-41 state gate (409) even though the clock has
          already passed load_in_start and the later gates (ERR_NO_COMMITTED_RIDES at 85, ERR_PERMIT_NOT_APPROVED
          at 100) are also unsatisfied. The state error must win, and the stop must not move or bump version.
        test_recipe:
          setup:
            - "Jurisdiction OH, Venue V1, Route R1 in DRAFT with one PLANNED stop A; no contract, no allocations, no permits."
            - "Logical clock advanced to 2026-09-01T07:00Z, i.e. past stop A's load_in_start."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { state_code: "OH", name: "Ohio", permit_lead_days: 10, amusement_tax_pct: 6.5, permit_fee_cents: 50000 }
              as: PlatformAdmin
              captures: { jur_s2: "$.data.id" }
            - call: "POST /venues"
              payload: { jurisdiction_id: "${jur_s2}", name: "Franklin County Fairgrounds", city: "Columbus", lot_area_sqft: 100000, power_amps_available: 1200, expected_attendance: 20001, lot_surface: "GRAVEL" }
              as: PlatformAdmin
              captures: { ven_s2: "$.data.id" }
            - call: "POST /routes"
              payload: { name: "2026 Midwest Swing", season_year: 2026, home_base_state: "OH" }
              as: RouteManager
              captures: { route_s2: "$.data.id" }
            - call: "POST /route-stops"
              payload: { route_id: "${route_s2}", venue_id: "${ven_s2}", load_in_start: "2026-09-01T06:00:00Z", open_date: "2026-09-04T12:00:00Z", close_date: "2026-09-07T12:00:00Z", teardown_deadline: "2026-09-08T12:00:00Z" }
              as: RouteManager
              captures: { stop_s2: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T07:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /route-stops/${stop_s2}/begin-setup"
              payload: {}
              as: LotBoss
              captures: { err_s2: "$.data.error_id" }
          assert:
            - "HTTP 409 with data.error_id == \"ERR_STOP_STATE_INVALID\""
            - "RouteStop.${stop_s2}.status == \"PLANNED\" and version == 1 (no mutation, no cascade)"
            - "The response is NOT ERR_NO_COMMITTED_RIDES and NOT ERR_PERMIT_NOT_APPROVED"

      - name: executing_an_already_executed_contract_is_rejected
        claim_type: idempotency
        grounds:
          - state_machines.Contract.transitions.SENT_to_EXECUTED
          - validations[priority=42]
          - errors[ERR_CONTRACT_STATE_INVALID]
          - entities.Route.fields.total_guaranteed_cents
        distinguishing_aspect: |
          The second execute must fail on the priority-42 state gate (409) and — the sharper half of the claim —
          the guarantee ledger must not double-count: Route.total_guaranteed_cents stays 500000 rather than
          becoming 1000000, and the already-CONFIRMED stop is not re-cascaded.
        test_recipe:
          setup:
            - "Jurisdiction OH, Venue V1, Route R1, stop A, Contract C1 with guarantee_cents 500000."
            - "R1 SEQUENCED then COMMITTED; C1 SENT by user-negotiator-1 then EXECUTED by user-gm-1, so stop A is CONFIRMED and Route.total_guaranteed_cents is 500000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { state_code: "OH", name: "Ohio", permit_lead_days: 10, amusement_tax_pct: 6.5, permit_fee_cents: 50000 }
              as: PlatformAdmin
              captures: { jur_s3: "$.data.id" }
            - call: "POST /venues"
              payload: { jurisdiction_id: "${jur_s3}", name: "Franklin County Fairgrounds", city: "Columbus", lot_area_sqft: 100000, power_amps_available: 1200, expected_attendance: 20001, lot_surface: "GRAVEL" }
              as: PlatformAdmin
              captures: { ven_s3: "$.data.id" }
            - call: "POST /routes"
              payload: { name: "2026 Midwest Swing", season_year: 2026, home_base_state: "OH" }
              as: RouteManager
              captures: { route_s3: "$.data.id" }
            - call: "POST /route-stops"
              payload: { route_id: "${route_s3}", venue_id: "${ven_s3}", load_in_start: "2026-09-01T06:00:00Z", open_date: "2026-09-04T12:00:00Z", close_date: "2026-09-07T12:00:00Z", teardown_deadline: "2026-09-08T12:00:00Z" }
              as: RouteManager
              captures: { stop_s3: "$.data.id" }
            - call: "POST /contracts"
              payload: { route_stop_id: "${stop_s3}", counterparty_name: "Franklin County Ag Society", revenue_split_pct_operator: 65, guarantee_cents: 500000 }
              as: ContractNegotiator
              captures: { con_s3: "$.data.id" }
            - call: "POST /routes/${route_s3}/sequence"
              payload: {}
              as: RouteManager
            - call: "POST /contracts/${con_s3}/send"
              payload: {}
              as: ContractNegotiator
              as_user_id: "user-negotiator-1"
            - call: "POST /routes/${route_s3}/commit"
              payload: {}
              as: RouteManager
            - call: "POST /contracts/${con_s3}/execute"
              payload: {}
              as: GeneralManager
              as_user_id: "user-gm-1"
          trigger:
            - call: "POST /contracts/${con_s3}/execute"
              payload: {}
              as: GeneralManager
              as_user_id: "user-gm-2"
              captures: { err_s3: "$.data.error_id" }
          assert:
            - "HTTP 409 with data.error_id == \"ERR_CONTRACT_STATE_INVALID\""
            - "Contract.${con_s3}.status == \"EXECUTED\" and version == 3 (create 1, send 2, execute 3 — the rejected call bumps nothing)"
            - "Route.${route_s3}.total_guaranteed_cents == 500000, not 1000000"
            - "RouteStop.${stop_s3}.status == \"CONFIRMED\" and version == 2"

      - name: permit_submit_then_approve_walks_draft_to_approved
        claim_type: valid_transition
        grounds:
          - state_machines.PermitApplication.transitions.DRAFT_to_SUBMITTED
          - state_machines.PermitApplication.transitions.SUBMITTED_to_APPROVED
          - entities.PermitApplication.fields.submitted_at
          - entities.PermitApplication.fields.decided_at
          - endpoints[POST /permit-applications/{id}/submit]
          - endpoints[POST /permit-applications/{id}/decision]
        distinguishing_aspect: |
          The two-hop permit walk is driven by two different roles — ComplianceClerk submits, JurisdictionOfficer
          decides — and each hop stamps its own timestamp from the logical clock (submitted_at at
          2026-08-01T00:00:00Z, decided_at at 2026-08-02T00:00:00Z). denial_reason stays null on the APPROVE
          branch and fee_cents, fixed at creation, is untouched by either hop.
        test_recipe:
          setup:
            - "Jurisdiction OH (permit_fee_cents 50000, permit_lead_days 10), Venue V1, Route R1 with PLANNED stop A."
            - "A DRAFT TRANSPORT PermitApplication with axles_declared 4 exists on stop A."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { state_code: "OH", name: "Ohio", permit_lead_days: 10, amusement_tax_pct: 6.5, permit_fee_cents: 50000 }
              as: PlatformAdmin
              captures: { jur_s4: "$.data.id" }
            - call: "POST /venues"
              payload: { jurisdiction_id: "${jur_s4}", name: "Franklin County Fairgrounds", city: "Columbus", lot_area_sqft: 100000, power_amps_available: 1200, expected_attendance: 20001, lot_surface: "GRAVEL" }
              as: PlatformAdmin
              captures: { ven_s4: "$.data.id" }
            - call: "POST /routes"
              payload: { name: "2026 Midwest Swing", season_year: 2026, home_base_state: "OH" }
              as: RouteManager
              captures: { route_s4: "$.data.id" }
            - call: "POST /route-stops"
              payload: { route_id: "${route_s4}", venue_id: "${ven_s4}", load_in_start: "2026-09-01T06:00:00Z", open_date: "2026-09-04T12:00:00Z", close_date: "2026-09-07T12:00:00Z", teardown_deadline: "2026-09-08T12:00:00Z" }
              as: RouteManager
              captures: { stop_s4: "$.data.id" }
            - call: "POST /permit-applications"
              payload: { route_stop_id: "${stop_s4}", permit_type: "TRANSPORT", valid_from: "2026-09-01T00:00:00Z", valid_until: "2026-09-09T00:00:00Z", axles_declared: 4 }
              as: ComplianceClerk
              captures: { permit_s4: "$.data.id" }
          trigger:
            - call: "POST /permit-applications/${permit_s4}/submit"
              payload: {}
              as: ComplianceClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /permit-applications/${permit_s4}/decision"
              payload: { decision: "APPROVE" }
              as: JurisdictionOfficer
          assert:
            - "After the submit call: PermitApplication.${permit_s4}.status == \"SUBMITTED\", submitted_at == \"2026-08-01T00:00:00Z\", decided_at == null, version == 2"
            - "After the decision call: status == \"APPROVED\", decided_at == \"2026-08-02T00:00:00Z\", version == 3"
            - "PermitApplication.${permit_s4}.denial_reason == null on the APPROVE branch"
            - "PermitApplication.${permit_s4}.fee_cents == 56000, unchanged by both hops"
            - "RouteStop.${stop_s4}.compliance_posture == \"PERMIT_HOLD\" (the approved permit is TRANSPORT, not EVENT)"

      - name: submitting_an_already_denied_permit_is_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.PermitApplication.terminal_states
          - state_machines.PermitApplication.transitions.SUBMITTED_to_DENIED
          - validations[priority=44]
          - errors[ERR_PERMIT_STATE_INVALID]
        distinguishing_aspect: |
          DENIED is terminal, so a re-submit is a priority-44 ERR_PERMIT_STATE_INVALID (409) — the row does not
          return to SUBMITTED, denial_reason is preserved verbatim, and version stays at 3. A DENY decision also
          proves the priority-20 conditional rule that denial_reason is mandatory exactly on the DENY branch.
        test_recipe:
          setup:
            - "Jurisdiction OH, Venue V1, Route R1 with PLANNED stop A."
            - "An EVENT PermitApplication on stop A was SUBMITTED and then DENIED with denial_reason \"Lot abuts a school zone\"."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { state_code: "OH", name: "Ohio", permit_lead_days: 10, amusement_tax_pct: 6.5, permit_fee_cents: 50000 }
              as: PlatformAdmin
              captures: { jur_s5: "$.data.id" }
            - call: "POST /venues"
              payload: { jurisdiction_id: "${jur_s5}", name: "Franklin County Fairgrounds", city: "Columbus", lot_area_sqft: 100000, power_amps_available: 1200, expected_attendance: 20001, lot_surface: "GRAVEL" }
              as: PlatformAdmin
              captures: { ven_s5: "$.data.id" }
            - call: "POST /routes"
              payload: { name: "2026 Midwest Swing", season_year: 2026, home_base_state: "OH" }
              as: RouteManager
              captures: { route_s5: "$.data.id" }
            - call: "POST /route-stops"
              payload: { route_id: "${route_s5}", venue_id: "${ven_s5}", load_in_start: "2026-09-01T06:00:00Z", open_date: "2026-09-04T12:00:00Z", close_date: "2026-09-07T12:00:00Z", teardown_deadline: "2026-09-08T12:00:00Z" }
              as: RouteManager
              captures: { stop_s5: "$.data.id" }
            - call: "POST /permit-applications"
              payload: { route_stop_id: "${stop_s5}", permit_type: "EVENT", valid_from: "2026-09-04T00:00:00Z", valid_until: "2026-09-08T00:00:00Z" }
              as: ComplianceClerk
              captures: { permit_s5: "$.data.id" }
            - call: "POST /permit-applications/${permit_s5}/submit"
              payload: {}
              as: ComplianceClerk
            - call: "POST /permit-applications/${permit_s5}/decision"
              payload: { decision: "DENY", denial_reason: "Lot abuts a school zone" }
              as: JurisdictionOfficer
          trigger:
            - call: "POST /permit-applications/${permit_s5}/submit"
              payload: {}
              as: ComplianceClerk
              captures: { err_s5: "$.data.error_id" }
          assert:
            - "HTTP 409 with data.error_id == \"ERR_PERMIT_STATE_INVALID\""
            - "PermitApplication.${permit_s5}.status == \"DENIED\" and version == 3"
            - "PermitApplication.${permit_s5}.denial_reason == \"Lot abuts a school zone\" and fee_cents == 50000 (EVENT permits carry no axle surcharge)"
            - "RouteStop.${stop_s5}.compliance_posture == \"PERMIT_HOLD\""

      - name: adjudicating_an_already_adjudicated_closure_is_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.WeatherClosure.terminal_states
          - state_machines.WeatherClosure.transitions.LOGGED_to_ADJUDICATED
          - validations[priority=44]
          - errors[ERR_CLOSURE_STATE_INVALID]
          - calculations.weather_abatement_hours
        distinguishing_aspect: |
          ADJUDICATED is the single terminal state of the closure machine, so the second adjudicate is a
          priority-44 ERR_CLOSURE_STATE_INVALID (409). The sharper half: the abatement ledger must not be applied
          twice — WeatherClosure.abated_hours stays 3.0 and RouteStop.closure_hours_adjudicated stays 3.0 rather
          than doubling to 6.0.
        test_recipe:
          setup:
            - "Jurisdiction OH (requires_state_ride_inspection false), Venue V1, Ride Giant Wheel (MAJOR, no state inspection), Worker Op One certified MAJOR."
            - "Route R1 COMMITTED, Contract C1 EXECUTED, TRANSPORT and EVENT permits APPROVED, one COMMITTED allocation and one RIDE_OPERATOR shift, so stop A reaches OPEN at 2026-09-04T12:00Z."
            - "At clock 2026-09-05T00:00Z a WIND closure 2026-09-04T14:00Z..17:00Z is logged and adjudicated once, giving abated_hours 3.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { state_code: "OH", name: "Ohio", permit_lead_days: 10, requires_state_ride_inspection: false, amusement_tax_pct: 6.5, permit_fee_cents: 50000 }
              as: PlatformAdmin
              captures: { jur_s6: "$.data.id" }
            - call: "POST /venues"
              payload: { jurisdiction_id: "${jur_s6}", name: "Franklin County Fairgrounds", city: "Columbus", lot_area_sqft: 100000, power_amps_available: 1200, expected_attendance: 20001, lot_surface: "GRAVEL" }
              as: PlatformAdmin
              captures: { ven_s6: "$.data.id" }
            - call: "POST /rides"
              payload: { name: "Giant Wheel", ride_class: "MAJOR", footprint_sqft: 4010, power_amps: 300, crew_size_setup: 6, setup_hours: 8, axle_count: 4, requires_state_inspection: false }
              as: PlatformAdmin
              captures: { ride_s6: "$.data.id" }
            - call: "POST /workers"
              payload: { full_name: "Op One", employment_type: "PERMANENT", hourly_rate_cents: 1600, certified_ride_classes: ["MAJOR"] }
              as: PlatformAdmin
