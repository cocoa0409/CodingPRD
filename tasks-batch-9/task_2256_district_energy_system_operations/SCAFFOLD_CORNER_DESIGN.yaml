            - "WorkOrder WO-A on SEG-W1 with requires_isolation false and WO-B on SEG-W2 with requires_isolation true, both SCHEDULED for the window 2026-09-10T08:00:00Z to 2026-09-10T18:00:00Z, with the clock repositioned inside that window."
