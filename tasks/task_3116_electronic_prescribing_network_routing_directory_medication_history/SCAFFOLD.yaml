  # --- Test-driving endpoints (outside the public business surface) ---------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the logical clock. The server's startup default logical time is exactly 2026-09-01T00:00:00Z and the clock MUST NOT fall back to real wall-clock time before this endpoint is called."
    roles: [NetworkOperator]
    code: 200
    input: [current_utc]

    output: { current_utc: datetime }
    side_effects:
      - "the logical clock reads current_utc; no business state changes"
  - method: POST
    path: "/_test/advance_clock"
    description: "Test-driving endpoint: advance the logical clock by a whole number of minutes from its current value, defaulting from 2026-09-01T00:00:00Z when never set"
    roles: [NetworkOperator]
    code: 200
    input: [minutes]

    output: { current_utc: datetime }
    side_effects:
      - "the logical clock advances; no business state changes"

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- envelope / request ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, unknown enum member, or a declared input that is not a recognised field of the request"
  - id: ERR_DUPLICATE_PARTICIPANT_NPI
    http: 409
    condition: "A participant with the same (participant_type, npi) pair already exists"
  # --- auth ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role header absent or not equal to a declared role"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not permitted for this operation, or the X-User-ID does not identify the backing entity of an entity_backed role"
  # --- existence ---
  - id: ERR_PARTICIPANT_NOT_FOUND
    http: 404
    condition: "Participant id supplied on a path or in a body is not a registered participant"
  - id: ERR_PRESCRIPTION_NOT_FOUND
    http: 404
    condition: "Prescription id supplied on a path or in a body is not a registered prescription"
  - id: ERR_ENDPOINT_NOT_FOUND
    http: 404
    condition: "DirectoryEndpoint id supplied on a path or in a body is not a registered endpoint"
  - id: ERR_ATTEMPT_NOT_FOUND
    http: 404
    condition: "RoutingAttempt id supplied on a path is not a registered attempt"
  - id: ERR_PATIENT_NOT_FOUND
    http: 404
    condition: "Patient id supplied on a path or in a body is not a registered patient"
  - id: ERR_CONSENT_NOT_FOUND
    http: 404
    condition: "No PatientConsent row exists for the referenced patient and consent id"
  - id: ERR_SIGNING_SESSION_NOT_FOUND
    http: 404
    condition: "SigningSession id supplied on a path or in a body is not a registered session"
  - id: ERR_BENEFIT_CHECK_NOT_FOUND
    http: 404
    condition: "BenefitCheck id supplied on a path is not a registered benefit check"
  - id: ERR_FEE_ENTRY_NOT_FOUND
    http: 404
    condition: "TransactionFeeEntry id supplied on a path is not a registered fee entry"
  # --- state ---
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target resource is not in a state that admits the requested operation"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "The target resource is already in a terminal state for this machine and cannot move again"
  - id: ERR_ROUTE_ATTEMPT_IN_PROGRESS
    http: 409
    condition: "The prescription already has an attempt in outcome IN_PROGRESS"
  - id: ERR_LAST_ACTIVE_ENDPOINT
    http: 409
    condition: "Disabling this endpoint would leave its participant with no ACTIVE endpoint for the same service_set"
  - id: ERR_HISTORY_BATCH_IN_PROGRESS
    http: 409
    condition: "An AGGREGATING batch already exists for the patient"
  # --- concurrency (OCC) ---
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_prescription_version does not equal the prescription's current version"
  - id: ERR_PARTICIPANT_STALE_VERSION
    http: 412
    condition: "expected_participant_version does not equal the participant's current version"
  # --- safety ---
  - id: ERR_IDENTITY_PROOFING_REQUIRED
    http: 422
    condition: "The order is controlled and the signing session lacks PASSED identity proofing and PASSED two-factor authentication"
  - id: ERR_CONTROLLED_NOT_SUPPORTED_BY_STANDARD
    http: 422
    condition: "The prescription's message_standard is NCPDP_SCRIPT_2017071 while controlled_schedule is SCHEDULE_II, SCHEDULE_III, SCHEDULE_IV or SCHEDULE_V"
  - id: ERR_PHARMACY_NOT_CERTIFIED_FOR_CONTROLLED
    http: 422
    condition: "The receiving pharmacy has no ACTIVE DirectoryEndpoint for service_set NEW_RX while the order is controlled"
  - id: ERR_ACCOUNT_LOCKED
    http: 423
    condition: "The signing session's two_factor_status is LOCKED at three failed challenge attempts"
  - id: ERR_OTP_INVALID
    http: 422
    condition: "The supplied otp_code does not match the session's current challenge code"
  - id: ERR_CRITICAL_ORDER_DELIVERY_REQUIRED
    http: 422
    condition: "A CRITICAL-significance order is being cancelled before it reached a delivery outcome"
  # --- certification ---
  - id: ERR_CERT_TESTS_INCOMPLETE
    http: 422
    condition: "certification_tests_passed does not cover CONNECTIVITY and SCRIPT_NEW_RX"
  - id: ERR_CERT_TEST_PREREQUISITE
    http: 422
    condition: "MED_HISTORY has been passed while ELIGIBILITY_FORMULARY has not"
  - id: ERR_UNKNOWN_TEST_CODE
    http: 422
    condition: "The supplied test_code is not one of the seven declared certification test codes"
  - id: ERR_CERT_NO_ENDPOINT
    http: 422
    condition: "The participant has no DirectoryEndpoint rows, so a certification window cannot be opened"
  # --- routing / directory ---
  - id: ERR_NO_ROUTE_AVAILABLE
    http: 422
    condition: "No DirectoryEndpoint satisfies the routing selector's eligibility filter for this transaction"
  - id: ERR_MESSAGE_STANDARD_MISMATCH
    http: 422
    condition: "For a refill, change or cancel response the selected endpoint's message_standard differs from the prescription's"
  - id: ERR_FALLBACK_HOP_LIMIT_EXCEEDED
    http: 422
    condition: "The prescription already carries three RoutingAttempt rows with channel != NETWORK"
  - id: ERR_FALLBACK_NOT_PERMITTED
    http: 422
    condition: "The reported failure_code is PATIENT_UNKNOWN or BENEFIT_EXHAUSTED and the prescription's fallback_channel is null"
  - id: ERR_FALLBACK_CHANNEL_UNAVAILABLE
    http: 422
    condition: "The participant's fallback_channel is FAX but fax_number is null"
  - id: ERR_NO_FAILED_ATTEMPT_TO_FALL_BACK
    http: 422
    condition: "The prescription has no RoutingAttempt with outcome UNDELIVERABLE or REJECTED"
  - id: ERR_ENDPOINT_OUT_OF_SERVICE_WINDOW
    http: 422
    condition: "The logical clock is outside the endpoint's half-open interval [effective_from, effective_to)"
  - id: ERR_ENDPOINT_INTERVAL_OVERLAP
    http: 422
    condition: "The new endpoint's interval overlaps an existing endpoint's interval for the same participant, service_set, endpoint_role and message_standard"
  - id: ERR_ENDPOINT_NOT_STABLE
    http: 422
    condition: "The endpoint's chronological reliability_ratio is below 0.95"
  - id: ERR_ENDPOINT_NOT_ROUTED_ATTEMPT
    http: 422
    condition: "The reported attempt's target_endpoint_id is not the endpoint being degraded"
  - id: ERR_ENDPOINT_COVERAGE_WARNING
    http: 422
    condition: "The degrade would push the participant's ACTIVE-endpoint share below 0.50; the endpoint stays ACTIVE and the payload carries this warning code"
  - id: ERR_ATTEMPT_PRESCRIPTION_MISMATCH
    http: 422
    condition: "The reported attempt does not belong to the prescription named in the request"
  # --- consent / history ---
  - id: ERR_CONSENT_REQUIRED
    http: 422
    condition: "No ACTIVE consent with the required scope exists for the patient"
  - id: ERR_CONSENT_EXPIRED
    http: 422
    condition: "The consent whose validity interval covers the referenced grant has elapsed at the current logical clock; raised when a duration_days of zero is supplied, producing an empty half-open window whose status is written EXPIRED"
  - id: ERR_CONSENT_INTERVAL_OVERLAP
    http: 422
    condition: "The new consent's validity window [granted_at, granted_at + duration_days) overlaps an existing ACTIVE consent's window for the same patient and the same scope"
  - id: ERR_CONSENT_STALE
    http: 409
    condition: "The patient's consent_version advanced past the batch's consent_version_snapshot while aggregation was running"
  - id: ERR_HISTORY_SOURCE_UNCERTIFIED
    http: 422
    condition: "The reporting participant's certification_status is not CERTIFIED"
  # --- fiscal ---
  - id: ERR_ENTRY_NOT_REVERSIBLE
    http: 422
    condition: "The fee entry's status is not POSTED, or the entry is itself a compensating row (reversal_of_entry_id is not null), or it is an unsettled PARTIAL accrual, or it has already been reversed"

