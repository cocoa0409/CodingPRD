            - { call: "GET /v1/units/${u1}", as: PropertyAdmin, captures: { hab1: $.data.habitability_status } }
            - { call: "POST /v1/work-orders/${wo}/cancel", as: MaintenanceSupervisor, as_user_id: "${sup1}" }
            - { call: "POST /v1/relocation-cases/${rc}/end", payload: { actual_end_date: "2026-08-05T00:00:00Z" }, as: MaintenanceSupervisor, as_user_id: "${sup1}", captures: { st: $.data.status, act: $.data.actual_cost_cents } }
            - { call: "GET /v1/units/${u1}", as: PropertyAdmin, captures: { hab2: $.data.habitability_status } }
          assert:
            - "First end: error_id == ERR_WORK_ORDER_INVALID_STATE (409); RC stays ACTIVE and Unit stays UNINHABITABLE"
            - "After cancelling the blocking EMERGENCY_FOLLOWUP work order, end succeeds: status == ENDED"
