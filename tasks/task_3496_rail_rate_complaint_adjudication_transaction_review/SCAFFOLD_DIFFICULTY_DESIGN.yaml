              as: BoardAdjudicator
              captures: { eso1: $.data.id }
          trigger:
            - call: "POST /stb/service-complaints/${sc1}/resolve"
              payload: {}
              as: BoardAdjudicator
            - call: "POST /stb/_clock/set_current_utc"
              payload: { current_utc: "2026-10-16T00:00:00Z" }
