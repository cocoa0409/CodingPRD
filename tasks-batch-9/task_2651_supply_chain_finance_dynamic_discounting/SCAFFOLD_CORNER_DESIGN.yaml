            - "after onboarding/submit Supplier.${supplier_id}.onboarding_status == VERIFYING and idv_status == PENDING"
            - "BankAccount.${bank_id}.status == MICRO_DEPOSIT_SENT and micro_deposit_attempts == 0"
            - "AuctionSession.${session_id}.status == SCHEDULED with named_offer_count == 0 and clearing_apr_bps == 0"
            - "Funder.${funder_id}.status == ACTIVE with encumbered_capital_cents == 0"
            - "FunderCommitment.${commitment_id}.status == ACTIVE"
            - "Invoice.${invoice_id}.status == ELIGIBLE"

      - name: registering_a_replacement_bank_account_demotes_the_active_supplier
        claim_type: side_effect_execution
        grounds:
          - state_machines.BankAccount.VERIFIED_to_REPLACED
          - entities.Supplier.fields.verified_account_last4
          - entities.Supplier.fields.payment_ready_at
          - "endpoints[POST /suppliers/{id}/bank-accounts]"
        distinguishing_aspect: |
          This is the cross-entity side-effect chain of the replace edge fired on an ALREADY ACTIVE
          supplier: the prior row goes REPLACED, the supplier's bank axis rewinds to
          MICRO_DEPOSIT_SENT, verified_account_last4 is cleared to null, onboarding_status drops
          ACTIVE -> VERIFYING and payment_ready_at is nulled - while the identity axis keeps
          idv_status PASSED, proving only the bank branch was rewound.
        test_recipe:
          setup:
            - "One Supplier fully onboarded to ACTIVE: bank 021000021/4321 VERIFIED and idv PASSED, payment_ready_at stamped at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /suppliers"
              payload: { legal_name: "Bank Swap Supply Co", tax_id_last4: "5566", remittance_email: "ar@bankswap.example" }
              as: PlatformOps
              captures: { supplier_id: "$.data.id" }
            - call: "POST /suppliers/${supplier_id}/onboarding/submit"
              payload: {}
              as: Supplier
              as_user_id: "${supplier_id}"
            - call: "POST /suppliers/${supplier_id}/bank-accounts"
              payload: { routing_number: "021000021", account_last4: "4321" }
              as: Supplier
              as_user_id: "${supplier_id}"
              captures: { bank_one: "$.data.id", md_code_one: "$.data.micro_deposit_code" }
            - call: "POST /bank-accounts/${bank_one}/micro-deposit/confirm"
              payload: { code: "${md_code_one}" }
              as: Supplier
              as_user_id: "${supplier_id}"
            - call: "POST /suppliers/${supplier_id}/idv/adjudicate"
              payload: { decision: "PASSED", identity_score: 88 }
              as: PlatformOps
          trigger:
            - call: "POST /suppliers/${supplier_id}/bank-accounts"
              payload: { routing_number: "011000015", account_last4: "8899" }
              as: Supplier
              as_user_id: "${supplier_id}"
              captures: { bank_two: "$.data.id", md_code_two: "$.data.micro_deposit_code" }
          assert:
            - "BankAccount.${bank_one}.status == REPLACED"
            - "BankAccount.${bank_two}.status == MICRO_DEPOSIT_SENT and micro_deposit_attempts == 0"
            - "${md_code_two} == '015889' (last three routing digits plus first three account_last4 digits)"
            - "Supplier.${supplier_id}.bank_status == MICRO_DEPOSIT_SENT"
            - "Supplier.${supplier_id}.verified_account_last4 is null"
            - "Supplier.${supplier_id}.onboarding_status == VERIFYING"
            - "Supplier.${supplier_id}.payment_ready_at is null"
            - "Supplier.${supplier_id}.idv_status == PASSED and identity_score == 88"

      - name: cancelling_a_live_session_expires_its_named_offers
        claim_type: side_effect_execution
        grounds:
          - state_machines.AuctionSession.LIVE_to_CANCELLED
          - state_machines.DiscountOffer.NAMED_to_EXPIRED
          - calculations.session_clearing_apr
          - "endpoints[POST /auction-sessions/{id}/close]"
        distinguishing_aspect: |
          The cancel cascade reaches every NAMED offer on the session in created_at ASC order, yet
          deliberately stops there: clearing_apr_bps stays 0 because the CANCELLED edge never runs
          session_clearing_apr, and the two invoices remain OFFERED rather than reverting to ELIGIBLE.
        test_recipe:
          setup:
