          setup:
            - "an OPEN season with one share plan"
            - "a vessel with a 500.00 lb SALMON entitlement and a trip planned while the vessel was COMPLIANT"
            - "the vessel then moved to PROBATION and then to SUSPENDED, which also suspends its ledger"
