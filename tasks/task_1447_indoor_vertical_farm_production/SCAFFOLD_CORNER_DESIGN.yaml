- section: cross_cutting_layers
  instances:
  - name: occ_recipe_activate_stale_crop_version
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[recipe-activate-stale-crop]
    - errors[ERR_STALE_VERSION]
    distinguishing_aspect: Activating recipe R2 with the Crop version observed BEFORE R1's activation (1 instead of 2) is a 412; re-reading and retrying succeeds and supersedes R1 to RETIRED.
    test_recipe:
      setup:
      - Crop KALE-01 (version 1 at creation); recipes R1 and R2 both DRAFT
      setup_api_calls:
      - call: POST /farm/crops
        payload:
          crop_code: KALE-01
          display_name: Kale
          category: LEAFY_GREEN
          margin_cents_per_lb: 300
          floor_price_cents_per_lb: 100
        as: FarmManager
        captures:
          c_kale: $.data.id
          c_v1: $.data.version
      - call: POST /farm/recipes
        payload:
          crop_id: ${c_kale}
          light_hours_per_day: 16
          light_ppfd_umol: 600
          ec_target_ms: 1.8
          ph_target: 5.8
          temp_day_c: 22
          temp_night_c: 18
          humidity_pct: 65
          co2_ppm: 900
          days_to_harvest: 21
          expected_yield_lb_per_tower: 12.5
        as: Grower
        captures:
          r1: $.data.id
      - call: POST /farm/recipes
        payload:
          crop_id: ${c_kale}
          light_hours_per_day: 18
          light_ppfd_umol: 650
          ec_target_ms: 1.9
          ph_target: 5.9
          temp_day_c: 23
          temp_night_c: 19
