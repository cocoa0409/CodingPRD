  # Rule 5 — validation priority conflicts across different error-category pairs
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: hearing_create_state_beats_lead_time
        grounds:
          - validations[priority=7]
          - validations[priority=25]
        distinguishing_aspect: |
          Pair: state (p7) vs business_temporal (p25). One request violates both — the case
          is only FILED (not SERVICE_COMPLETE) and the proposed hearing is 2 days out
          (< CA 10-day lead) — and the state error must win.
        test_recipe:
          setup:
            - "One CA case in FILED (package accepted, no service yet); clock 2026-05-06"
          setup_api_calls:
            - { call: "POST /api/landlords", payload: { legal_name: "L1 LLC", contact_email: "l1@x.com" }, as: PlatformAdmin, captures: { ll: $.data.id } }
