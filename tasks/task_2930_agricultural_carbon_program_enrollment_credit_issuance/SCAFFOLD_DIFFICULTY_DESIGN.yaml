# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Task 2930 — Agricultural Carbon Program Enrollment & Credit Issuance
#
# Every literal in every `assert:` line below was computed by executing the
# §1.3 formulas as code against the pinned setup inputs.
#
# Recurring fixture vocabulary (identical across instances so the downstream
# generator can share fixtures):
#   standard   COVER_CROP v1: lookback 5, max_prior_adoption 20.00,
#              min_documented_years 4, min_adoption_years 3,
#              uncertainty_base 15.00, sequestration 0.3500/acre,
#              modeled_baseline 0.2000/acre, buffer_base 10.00,
#              telemetry_required true, effective_from 2020-01-01
#   clock      2026-06-01T00:00:00Z  (current crop year 2026)
#   admins     "admin-screener-01" screens; "admin-baseline-01" approves
#              baselines; "admin-reversal-01" reports; "admin-reversal-02"
#              assesses  (segregation of duties, §1.4 priority 11)

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: baseline_historical_vs_modeled_divergence
        grounds:
          - calculations.baseline_establishment
          - entities.Baseline.fields.method
          - entities.Baseline.fields.baseline_emissions_t
          - entities.Baseline.fields.uncertainty_pct
          - entities.Baseline.fields.historical_mean_rate
          - state_machines.Baseline.PROPOSED_to_SUPERSEDED
        distinguishing_aspect: |
          Both variants read the SAME five PracticeHistory rows of the SAME field, yet
          HISTORICAL_DATA derives baseline_emissions_t from the observed per-acre mean
          (145.000 t at 7.00 pct uncertainty) while MODELED ignores every observed value
          and uses the standard's modelled rate scaled by the LOAM soil factor
          (200.000 t at 19.00 pct uncertainty) — the divergence is in the Baseline entity.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z, so the current crop year is 2026."
            - "COVER_CROP standard v1 published with lookback 5 and uncertainty_base_pct 15.00."
            - "Grower G1 ACTIVE with field F1 whose 2000x2000 rectangle yields mapped_acres 1000.00 on LOAM soil, status MAPPED."
            - "Five PracticeHistory rows on F1 for crop years 2021-2025; four of them (2021, 2023, 2024, 2025) carry admissible FARM_RECORD / EQUIPMENT_TELEMETRY evidence with observed rates 0.1000, 0.1400, 0.1600, 0.1800, and the 2022 row is REMOTE_SENSING (inadmissible for baselines)."
            - "Enrollment E1 has passed screening and sits in ACCEPTED with no baseline yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /practice-standards"
              payload: { practice_code: "COVER_CROP", standard_version: 1, additionality_lookback_years: 5, max_prior_adoption_pct: 20.00, min_documented_years: 4, min_adoption_years: 3, uncertainty_base_pct: 15.00, sequestration_rate_per_acre: 0.3500, modeled_baseline_rate_per_acre: 0.2000, buffer_base_pct: 10.00, telemetry_required: true, effective_from: "2020-01-01" }
              as: ProgramAdmin
              captures: { std_cc_id: $.data.id }
            - call: "POST /growers"
              payload: { legal_name: "Northfield Farms LLC", operator_type: "LLC", tax_id: "91-1122334", mailing_state: "IA" }
              as: ProgramAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /growers/${g1_id}/fields"
              payload: { field_name: "North Quarter", boundary_min_x: 0, boundary_min_y: 0, boundary_max_x: 2000, boundary_max_y: 2000, gross_acres: 1010.00, soil_group: "LOAM", county_code: "IA-113" }
              as: ProgramAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /fields/${f1_id}/map-confirm"
              payload: { surveyor_reference: "SUR-2026-0001" }
              as: ProgramAdmin
            - call: "POST /fields/${f1_id}/practice-history"
              payload: { crop_year: 2021, practice_code: "COVER_CROP", adopted: true, evidence_source: "FARM_RECORD", acres: 200.00, observed_emissions_per_acre: 0.1000 }
              as: ProgramAdmin
            - call: "POST /fields/${f1_id}/practice-history"
              payload: { crop_year: 2022, practice_code: "COVER_CROP", adopted: true, evidence_source: "REMOTE_SENSING", acres: 500.00, observed_emissions_per_acre: 0.1200 }
              as: ProgramAdmin
            - call: "POST /fields/${f1_id}/practice-history"
              payload: { crop_year: 2023, practice_code: "COVER_CROP", adopted: false, evidence_source: "FARM_RECORD", acres: 0.00, observed_emissions_per_acre: 0.1400 }
              as: ProgramAdmin
            - call: "POST /fields/${f1_id}/practice-history"
              payload: { crop_year: 2024, practice_code: "COVER_CROP", adopted: false, evidence_source: "EQUIPMENT_TELEMETRY", acres: 0.00, observed_emissions_per_acre: 0.1600 }
              as: ProgramAdmin
            - call: "POST /fields/${f1_id}/practice-history"
              payload: { crop_year: 2025, practice_code: "COVER_CROP", adopted: false, evidence_source: "FARM_RECORD", acres: 0.00, observed_emissions_per_acre: 0.1800 }
              as: ProgramAdmin
            - call: "POST /enrollments"
              payload: { field_id: "${f1_id}", practice_standard_id: "${std_cc_id}", commitment_years: 5, start_crop_year: 2026, enrolled_acres: 1000.00, payment_model: "PER_CREDIT", per_credit_share_pct: 60.00 }
              as: ProgramAdmin
              captures: { e1_id: $.data.id }
            - call: "POST /enrollments/${e1_id}/submit"
              payload: {}
              as: ProgramAdmin
            - call: "POST /enrollments/${e1_id}/screen"
              payload: { decision: "ACCEPT" }
              as: ProgramAdmin
              as_user_id: "admin-screener-01"
              captures: { e1_v_screened: $.data.version }
          trigger:
            - call: "POST /enrollments/${e1_id}/baselines"
              payload: { method: "HISTORICAL_DATA", expected_enrollment_version: "${e1_v_screened}" }
              as: ProgramAdmin
              as_user_id: "admin-baseline-01"
              captures: { b_hist_id: $.data.id }
            - call: "GET /enrollments/${e1_id}"
              payload: {}
              as: ProgramAdmin
              captures: { e1_v_after_hist: $.data.version }
            - call: "POST /enrollments/${e1_id}/baselines"
              payload: { method: "MODELED", expected_enrollment_version: "${e1_v_after_hist}" }
              as: ProgramAdmin
              as_user_id: "admin-baseline-01"
              captures: { b_mod_id: $.data.id }
          assert:
            - "Baseline.${b_hist_id}.qualifying_years == 4"
            - "Baseline.${b_hist_id}.historical_mean_rate == 0.1450"
            - "Baseline.${b_hist_id}.baseline_emissions_t == 145.000"
            - "Baseline.${b_hist_id}.uncertainty_pct == 7.00"
            - "Baseline.${b_mod_id}.historical_mean_rate == null"
            - "Baseline.${b_mod_id}.qualifying_years == 4"
            - "Baseline.${b_mod_id}.baseline_emissions_t == 200.000"
            - "Baseline.${b_mod_id}.uncertainty_pct == 19.00"
            - "Baseline.${b_hist_id}.status == SUPERSEDED"
            - "Baseline.${b_mod_id}.status == PROPOSED"
            - "Enrollment.${e1_id}.status == ACCEPTED"

      - name: quantification_model_vs_measurement_divergence
        grounds:
          - calculations.net_removals_quantification
          - entities.QuantificationRun.fields.method
          - entities.QuantificationRun.fields.adoption_factor
