              payload: { service_area_id: "${area}", equipment_kind: "SAMPLING_DEVICE", asset_code: "PROBE-EXP", model: "Diverter D2" }
              captures: { probe: "$.data.id" }
          trigger:
            - call: POST /grain-inspection/equipment/${probe}/certify
              as: ServiceAdmin
              payload: { certified_until: "2026-07-01T00:00:00Z" }
              captures: { err: "$.data.error_id" }
          assert:
            - "422 ERR_EXPIRY_IN_PAST"
            - "GET /grain-inspection/equipment/${probe} -> approval_status still PENDING_APPROVAL and certified_until still null"
            - "certified_until exactly 2026-08-03T09:00:00Z -> 422 ERR_EXPIRY_IN_PAST (strictly in the future)"
            - "certified_until 2026-08-03T09:00:01Z -> 200 with approval_status APPROVED"
            - "Advancing the clock to 2026-08-03T09:00:02Z then flips that device to EXPIRED, and re-certifying with a past certified_until -> 422 ERR_EXPIRY_IN_PAST again"

      - name: logical_clock_refuses_to_move_backwards
        claim_type: temporal_validation
        grounds:
          - "validations[priority=12]"
          - "errors[ERR_CLOCK_NOT_MONOTONIC]"
          - "endpoints[POST /_clock/set_current_utc]"
        distinguishing_aspect: "The clock is the substrate every deadline, expiry and fee window reads, so it is monotonic but not strictly monotonic: re-setting the same instant is a legal no-op while one second earlier is refused."
        test_recipe:
          setup:
            - "A fresh service whose clock has been set forward to 2026-08-03T09:00:00Z."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
          trigger:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T08:59:59Z" }
              captures: { err: "$.data.error_id" }
          assert:
            - "422 ERR_CLOCK_NOT_MONOTONIC"
            - "Re-setting exactly 2026-08-03T09:00:00Z -> 200 (equal is allowed)"
            - "Setting 2026-08-03T09:00:01Z -> 200, and a subsequent attempt at 2026-08-03T09:00:00Z -> 422 ERR_CLOCK_NOT_MONOTONIC"
            - "A malformed current_utc such as \"2026-08-03 09:00\" -> 422 ERR_INVALID_REQUEST at priority 5"
            - "Entities created after each accepted move carry created_at equal to the logical clock, never to wall time"

      - name: fee_schedule_activation_guards_windows_and_draft_status
        claim_type: temporal_validation
        grounds:
          - "validations[priority=12]"
          - "errors[ERR_FEE_SCHEDULE_WINDOW_CONFLICT]"
          - "errors[ERR_FEE_SCHEDULE_NOT_DRAFT]"
          - "state_machines.FeeSchedule.status"
        distinguishing_aspect: "Two ACTIVE schedules for the same (area, class) may never share an instant, but the window is half-open, so a schedule starting exactly at the incumbent's effective_to is legal while one starting a day earlier is not; and re-activating an already ACTIVE row is a state error, not a window error."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z."
            - "A DELEGATED area with one ACTIVE GRADING schedule over [2026-01-01, 2026-06-01)."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
            - call: POST /grain-inspection/service-areas
              as: ServiceAdmin
              payload: { name: "Plains Delegated Office", state_code: "KS", authority_type: "DELEGATED", supervision_required: false }
              captures: { area: "$.data.id" }
            - call: POST /grain-inspection/fee-schedules
              as: ServiceAdmin
              payload: { service_area_id: "${area}", service_class: "GRADING", base_fee_cents: 8000, per_thousand_bushel_rate_cents: 2000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-06-01T00:00:00Z" }
              captures: { fs1: "$.data.id" }
            - call: POST /grain-inspection/fee-schedules/${fs1}/activate
              as: ServiceAdmin
              payload: {}
            - call: POST /grain-inspection/fee-schedules
              as: ServiceAdmin
              payload: { service_area_id: "${area}", service_class: "GRADING", base_fee_cents: 9000, per_thousand_bushel_rate_cents: 2500, effective_from: "2026-05-01T00:00:00Z" }
              captures: { fs2: "$.data.id" }
          trigger:
            - call: POST /grain-inspection/fee-schedules/${fs2}/activate
              as: ServiceAdmin
              payload: {}
              captures: { err: "$.data.error_id" }
          assert:
            - "422 ERR_FEE_SCHEDULE_WINDOW_CONFLICT: [2026-05-01, infinity) overlaps the incumbent's [2026-01-01, 2026-06-01)"
            - "GET /grain-inspection/fee-schedules/${fs2} -> status still DRAFT; GET /grain-inspection/fee-schedules/${fs1} -> status still ACTIVE"
            - "A third schedule with effective_from exactly 2026-06-01 -> activation 200, because effective_to is exclusive"
            - "POST /grain-inspection/fee-schedules/${fs1}/activate again -> 409 ERR_FEE_SCHEDULE_NOT_DRAFT"
            - "Creating a schedule with effective_to 2026-01-01 and effective_from 2026-06-01 -> 422 ERR_FEE_SCHEDULE_WINDOW_CONFLICT (effective_to must be strictly after effective_from)"
            - "A WEIGHING schedule over the identical [2026-01-01, 2026-06-01) window -> activation 200, since the uniqueness scope is (service_area_id, service_class)"

