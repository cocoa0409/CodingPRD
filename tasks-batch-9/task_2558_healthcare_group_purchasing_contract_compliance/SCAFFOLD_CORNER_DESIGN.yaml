              payload: { contract_code: "C-CS", supplier_name: "Acme Surgical", category_code: "CAT-SUT", effective_from: "2026-01-01", effective_to: "2026-12-31", admin_fee_bps: 300, member_share_bps: 6000, requires_clinical_review: false, share_basis: "ACCRUAL", tiers: [ { tier_code: "TIER_0", min_committed_volume_units: 0, min_compliance_pct: 0.00, discount_bps: 0 } ], holdback_tiers: [ { min_gross_pool_cents: 0, holdback_bps: 0 }, { min_gross_pool_cents: 50000, holdback_bps: 100 } ] }
              as: ContractManager
              captures: { c1: $.data.id }
            - call: "POST /gpo/contracts/${c1}/activate"
              payload: {}
