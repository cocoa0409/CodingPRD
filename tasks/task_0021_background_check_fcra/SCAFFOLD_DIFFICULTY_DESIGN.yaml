            - "early_err == 'ERR_WAITING_PERIOD_NOT_ELAPSED'"
            - "ok_status == 'FINALIZED'"

      - name: federal_floor_pre_adverse_days_5_succeeds_4_rejected
        grounds:
          - validations[priority=95]
          - errors[ERR_BELOW_FEDERAL_FLOOR]
          - entities.Jurisdiction.fields.pre_adverse_waiting_days
        distinguishing_aspect: |
          Boundary on the Jurisdiction creation endpoint (different endpoint AND different
          metric than Rule 6a): pre_adverse_waiting_days >= 5 (federal floor). The value 5
          is accepted; the value 4 returns ERR_BELOW_FEDERAL_FLOOR. Different metric
          (integer day count) and different endpoint (POST /jurisdictions vs POST
          /adverse-actions/{id}/finalize).
        test_recipe:
