      - name: split_over_allocation_rejected
        claim_type: Aggregate validation
        grounds:
          - "validations[priority=14]"
          - "entities.CommissionSplit.fields.split_pct"
          - "errors[ERR_SPLIT_OVER_ALLOCATED]"
        distinguishing_aspect: "A WRITING 0.7 + SERVICING 0.4 (sum 1.1 > 1.0) breaches the cap on the second split -> ERR_SPLIT_OVER_ALLOCATED 422 (OVERRIDE excluded from cap)."
        test_recipe:
          setup: ["a QUOTED policy with an existing WRITING split of 0.7 by the writer; two more producers exist"]
          setup_api_calls:
