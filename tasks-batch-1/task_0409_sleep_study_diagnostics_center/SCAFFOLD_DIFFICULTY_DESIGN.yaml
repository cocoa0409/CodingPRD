  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: bed_night_overlap_with_turnover_buffer
        grounds:
          - validations[priority=9]
          - errors[ERR_BED_DOUBLE_BOOKED]
          - entities.SleepBed.fields.turnover_buffer_minutes
          - state_machines.StudyOrder.ORDERED_to_SCHEDULED
        distinguishing_aspect: |
          SleepBed interval semantics: a booked night blocks not just its own
          [start,end] but an additional turnover_buffer_minutes AFTER end. A
          second night starting 06:30 (30 min after a night ending 06:00 with a
          60-min buffer) is rejected ERR_BED_DOUBLE_BOOKED. Buffer-extended
          interval arithmetic distinguishes this from the half-open compliance
          rule.
        test_recipe:
          setup:
            - "A bed with a night booked 2026-07-20T22:00..2026-07-21T06:00 (buffer 60 -> blocked until 07:00). A second authorized study ready to schedule on the same bed."
          setup_api_calls:
