            - call: "POST /reservations"
              payload: { ticket_class_id: "${tc_id}", guest_id: "${g2_id}", party_size: 2, primary_guest_name: "Envelope Two", expected_ticket_class_version: "${v_stale}" }
              as: Guest
              as_user_id: "${g2_id}"
              captures: { e412: $.data.error_id }
            - call: "POST /reservations"
              payload: { ticket_class_id: "${tc_id}", guest_id: "${g2_id}", party_size: 9, primary_guest_name: "Envelope Two", expected_ticket_class_version: "${v_fresh}" }
              as: Guest
              as_user_id: "${g2_id}"
              captures: { e422: $.data.error_id }
            - call: "GET /ticket-classes/${tc_id}"
              payload: {}
              as: PlatformAdmin
              captures: { v_end: $.data.version }
          assert:
            - "${e400} == ERR_INVALID_PAGINATION with HTTP 400: limit 0 is below the declared minimum of 1"
            - "${e402} == ERR_PAYMENT_BELOW_DEPOSIT with HTTP 402: 7721 is one cent under deposit_due_cents 7722"
            - "${e403} == ERR_UNAUTHORIZED with HTTP 403: KitchenLead's only write is the dietary-note ack, and priority 3 fires before any service-state check"
            - "${e404} == ERR_RESERVATION_NOT_FOUND with HTTP 404"
            - "${e409} == ERR_RESERVATION_INVALID_STATE with HTTP 409: seat is not a legal trigger from PENDING, and priority 17 outranks both the missing table assignment and the priority 41 seating-time check"
            - "${e412} == ERR_STALE_TICKET_CLASS_VERSION with HTTP 412: ${v_stale} was superseded when ${res_id} took 2 seats"
            - "${e422} == ERR_PARTY_SIZE_OUT_OF_BAND with HTTP 422: party 9 exceeds the class band maximum of 8 even though ${v_fresh} is current"
            - "all seven error bodies have response_type == error and a data object whose keys are exactly error_id and message, with no id, no version, no pagination block and no partial entity fields"
            - "${v_end} == ${v_fresh}: not one of the seven rejected calls incremented TicketClass.version, and TicketClass.${tc_id}.seats_sold stays 2 with seats_available 18"
            - "Reservation.${res_id} is still PENDING and UNPAID with amount_paid_cents 0, and the guest ${g2_id} still owns no reservation"

      # --- catalogue codes whose only sensible trigger is already a §1.8 arm ---
      - name: error_refund_exception_already_decided_on_second_decide
        claim_type: Error Triggerability
        grounds:
          - errors[ERR_REFUND_EXCEPTION_ALREADY_DECIDED]
        excluded_because:
          difficulty_instance: refund_exception_fork_with_disjoint_arms
          rationale: "The §1.8 fork instance decides the same exception twice on both arms and asserts ERR_REFUND_EXCEPTION_ALREADY_DECIDED 409 from APPROVED and from DENIED, which is the whole triggerable surface of priority 25."

      - name: error_refund_exception_not_approved_on_credit_after_denial
        claim_type: Error Triggerability
        grounds:
          - errors[ERR_REFUND_EXCEPTION_NOT_APPROVED]
        excluded_because:
          difficulty_instance: goodwill_credit_requires_approved_exception
          rationale: "That §1.8 instance issues against a REQUESTED exception and against a DENIED one and pins ERR_REFUND_EXCEPTION_NOT_APPROVED 409 for both, before the cap check at priority 65 can be reached."

      - name: error_insufficient_seats_when_the_class_pool_is_short
        claim_type: Error Triggerability
        grounds:
          - errors[ERR_INSUFFICIENT_SEATS]
        excluded_because:
          difficulty_instance: cancel_cascade_returns_class_to_sold_out_via_available_pool
          rationale: "ERR_INSUFFICIENT_SEATS 409 is the failure arm of that cascade instance: the class is driven to zero free seats, the oversized request is rejected, then a cancellation returns seats and the same request succeeds."

      - name: error_dietary_ack_required_before_the_party_is_seated
        claim_type: Error Triggerability
        grounds:
          - errors[ERR_DIETARY_ACK_REQUIRED]
        excluded_because:
          difficulty_instance: dietary_ack_safety_beats_table_turn_temporal
          rationale: "That §1.8 instance triggers ERR_DIETARY_ACK_REQUIRED 422 on both assign-table and seat with an unacked ANAPHYLAXIS note, and additionally proves priority 30 outranks the temporal table-turn conflict."

      - name: error_dietary_note_prep_rejected_blocks_the_table
        claim_type: Error Triggerability
        grounds:
          - errors[ERR_DIETARY_NOTE_PREP_REJECTED]
        excluded_because:
          difficulty_instance: dietary_note_prep_rejection_amend_loop
          rationale: "The amend-loop instance leaves a note in PREP_REJECTED and asserts ERR_DIETARY_NOTE_PREP_REJECTED 422 at priority 31 until the guest amends it back to PENDING."

      - name: error_cancel_window_closed_after_seating_starts
        claim_type: Error Triggerability
        grounds:
          - errors[ERR_CANCEL_WINDOW_CLOSED]
        excluded_because:
          difficulty_instance: forfeiture_ladder_exact_72_hour_band_edge
          rationale: "That instance walks the clock across the forfeiture ladder up to and past seat_from_utc and asserts ERR_CANCEL_WINDOW_CLOSED 422 at the first instant the window is shut, which is priority 46's only edge."

      - name: error_guest_index_out_of_range_on_a_dietary_note
        claim_type: Error Triggerability
        grounds:
          - errors[ERR_GUEST_INDEX_OUT_OF_RANGE]
        excluded_because:
          difficulty_instance: dietary_note_guest_index_upper_bound
          rationale: "The §1.8 boundary instance files notes at guest_index party_size-1, party_size and party_size+1 and pins ERR_GUEST_INDEX_OUT_OF_RANGE 422 on exactly the two out-of-band values."

      - name: error_offer_rounds_exhausted_on_the_third_offer
        claim_type: Error Triggerability
        grounds:
          - errors[ERR_OFFER_ROUNDS_EXHAUSTED]
        excluded_because:
          difficulty_instance: waitlist_offer_cycle_capped_at_max_offer_rounds
          rationale: "That cyclic instance lapses two offers on the same entry and asserts ERR_OFFER_ROUNDS_EXHAUSTED 422 on the third, which is the only way past max_offer_rounds 2."

      - name: error_kitchen_prep_oversubscribed_beyond_the_line_capacity
        claim_type: Error Triggerability
        grounds:
          - errors[ERR_KITCHEN_PREP_OVERSUBSCRIBED]
        excluded_because:
          difficulty_instance: kitchen_line_closed_interval_aggregate_overlap
          rationale: "The aggregate-overlap instance loads the prep window to exactly kitchen_prep_capacity_minutes and asserts ERR_KITCHEN_PREP_OVERSUBSCRIBED 422 on the first cover past it, including the closed-interval adjacency case."

      - name: error_goodwill_exceeds_cap_above_the_min_of_cap_and_shortfall
        claim_type: Error Triggerability
        grounds:
          - errors[ERR_GOODWILL_EXCEEDS_CAP]
        excluded_because:
          difficulty_instance: goodwill_credit_requires_approved_exception
          rationale: "The same §1.8 instance issues above the restaurant cap and above the exception shortfall and asserts ERR_GOODWILL_EXCEEDS_CAP 402 for whichever of the two is smaller, which is exactly priority 65's min() semantics."

  # ===========================================================================
  # §1.9 / section: rbac — claim-extraction-guide §7. Five roles, two of them
  # opaque and three entity_backed, under role_model segregation_of_duties.
  # Per role: the exclusive and shared operations must all succeed, and every
  # other role's exclusive operations must return ERR_UNAUTHORIZED at priority 3
  # — before any not-found, state or amount check. The entity_backed roles add
  # a second axis: ERR_FORBIDDEN_RESOURCE_OWNER when the role is right but the
  # row belongs to someone else. The role_model row adds the identifier axis:
  # the same operator id may not occupy two recorded steps of one exception.
  # ===========================================================================
  - section: rbac
    instances:

      - name: rbac_guest_exclusive_writes_all_succeed_for_the_owning_guest
        claim_type: Can perform all exclusive and shared operations
        grounds:
          - roles.Guest.exclusive_operations
          - roles.Guest.shared_operations
          - endpoints.POST_/reservations
          - endpoints.POST_/reservations/{id}/add-ons
          - endpoints.POST_/reservations/{id}/dietary-notes
          - endpoints.POST_/reservations/{id}/name-change
          - endpoints.POST_/waitlist-entries
          - calculations.reservation_charge_breakdown
        distinguishing_aspect: "Seven of the Guest role's ten exclusive writes are driven in one chain on rows the acting guest owns, and each one is asserted by its own side effect rather than by its status code — the add-on line re-prices the reservation and un-freezes nothing, the dietary note re-derives prep minutes, the name change increments name_changes_count, and the waitlist entry coexists with an active reservation on the same service because priority 57 is scoped to waitlist rows only. The remaining three (transfer, claim, amend) are driven in the validations, state_machines and §1.8 chains."
        test_recipe:
          setup:
            - "STD chain: restaurant (service_charge_bp 725, hold_ttl 20, offer_ttl 15, max_offer_rounds 2, goodwill cap 20000, prep_lead 45, scrutiny 300000), package (base 12000, DEPOSIT, deposit_bp 3000, STANDARD, DEPOSIT_BASIS, release_discount_bp 1500, prep 12/cover, band 1..8), service 2026-09-10 DINNER 22:00Z..02:00Z turn 150 capacity 20 STANDARD prep capacity 600, class 20 seats band 1..8, published"
            - "one add-on: Caviar Supplement 4500 cents, prep 4 minutes per unit, max 2 per cover, order cutoff 1440 minutes"
            - "guest G1 exists and owns nothing yet; the clock is pinned at 2026-09-01T00:00:00Z so every 20 minute hold and 1440 minute cutoff is wide open"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /restaurants"
              payload: { name: "Corner Guest Rights House", service_charge_bp: 725, hold_ttl_minutes: 20, offer_ttl_minutes: 15, max_offer_rounds: 2, goodwill_credit_cap_cents: 20000, prep_lead_minutes: 45, refund_scrutiny_threshold_cents: 300000 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /experience-packages"
              payload: { restaurant_id: "${r_id}", name: "Tasting Menu", course_count: 8, base_price_cents: 12000, prepayment_mode: "DEPOSIT", deposit_bp: 3000, forfeiture_schedule_code: "STANDARD", forfeiture_basis: "DEPOSIT_BASIS", release_discount_bp: 1500, kitchen_prep_minutes_per_cover: 12, min_party_size: 1, max_party_size: 8 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { pkg_id: $.data.id }
            - call: "POST /add-ons"
              payload: { restaurant_id: "${r_id}", name: "Caviar Supplement", price_cents: 4500, prep_minutes_per_unit: 4, max_qty_per_cover: 2, order_cutoff_minutes: 1440, requires_kitchen_ack: false }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { aon_id: $.data.id }
            - call: "POST /services"
              payload: { restaurant_id: "${r_id}", service_date: "2026-09-10", meal_period: "DINNER", seating_start_utc: "2026-09-10T22:00:00Z", seating_end_utc: "2026-09-11T02:00:00Z", turn_time_minutes: 150, seats_capacity: 20, demand_tier: "STANDARD", unsold_release_bp: 5000, release_lead_minutes: 180, waitlist_policy: "FAIR_QUEUE", kitchen_prep_capacity_minutes: 600 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { svc_id: $.data.id }
            - call: "POST /ticket-classes"
              payload: { service_id: "${svc_id}", package_id: "${pkg_id}", seats_allocated: 20, min_party_size: 1, max_party_size: 8 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { tc_id: $.data.id }
            - call: "POST /services/${svc_id}/publish"
              payload: {}
              as: RestaurantManager
              as_user_id: "${r_id}"
            - call: "POST /guests"
              payload: { email: "rights@corner.test", display_name: "Rights Guest" }
              as: PlatformAdmin
              captures: { g1_id: $.data.id }
            - call: "GET /ticket-classes/${tc_id}"
              payload: {}
              as: Guest
              as_user_id: "${g1_id}"
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /reservations"
              payload: { ticket_class_id: "${tc_id}", guest_id: "${g1_id}", party_size: 2, primary_guest_name: "Rights Guest", expected_ticket_class_version: "${v1}" }
              as: Guest
              as_user_id: "${g1_id}"
              captures: { res_id: $.data.id, dep0: $.data.deposit_due_cents }
            - call: "POST /reservations/${res_id}/dietary-notes"
              payload: { guest_index: 1, restriction_code: "GLUTEN", severity: "INFO", note_text: "coeliac, no bread service" }
              as: Guest
              as_user_id: "${g1_id}"
              captures: { note_id: $.data.id, note_prep: $.data.prep_minutes }
            - call: "POST /reservations/${res_id}/name-change"
              payload: { primary_guest_name: "Rights Guest Renamed" }
              as: Guest
              as_user_id: "${g1_id}"
              captures: { nc_count: $.data.name_change_count }
            - call: "GET /reservations/${res_id}"
              payload: {}
              as: Guest
              as_user_id: "${g1_id}"
              captures: { rv: $.data.version }
            - call: "POST /reservations/${res_id}/add-ons"
              payload: { add_on_id: "${aon_id}", qty: 1, expected_reservation_version: "${rv}" }
              as: Guest
              as_user_id: "${g1_id}"
              captures: { line_id: $.data.id, line_sc: $.data.line_service_charge_cents }
            - call: "GET /reservations/${res_id}"
              payload: {}
              as: Guest
              as_user_id: "${g1_id}"
              captures: { grand2: $.data.grand_total_cents, dep2: $.data.deposit_due_cents, prep2: $.data.prep_minutes_total }
            - call: "POST /reservations/${res_id}/payments"
              payload: { amount_cents: 9170 }
              as: Guest
              as_user_id: "${g1_id}"
              captures: { pay_status: $.data.payment_status }
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Guest
              as_user_id: "${g1_id}"
              captures: { ff_status: $.data.fulfillment_status }
            - call: "POST /waitlist-entries"
              payload: { service_id: "${svc_id}", guest_id: "${g1_id}", party_size: 4, requested_package_id: "${pkg_id}" }
              as: Guest
              as_user_id: "${g1_id}"
              captures: { wl_id: $.data.id, wl_status: $.data.status }
            - call: "POST /waitlist-entries/${wl_id}/withdraw"
              payload: {}
              as: Guest
              as_user_id: "${g1_id}"
              captures: { wl_status2: $.data.status }
          assert:
            - "the reservation is created 201 with price_locked_per_cover_cents 12000, ticket_subtotal 24000, service_charge 1740, grand_total 25740 and ${dep0} == 7722"
            - "${note_prep} == 0 because SEVERITY_PREP_MINUTES[INFO] is 0, yet the note row exists with ack_status PENDING and guest_index 1"
            - "${nc_count} == 1 (Reservation.name_change_count) and Reservation.${res_id}.primary_guest_name == 'Rights Guest Renamed'; the name change neither re-prices nor re-holds the reservation"
            - "${line_sc} == 326: the 4500 line is charged 725 bp and rounded once on its own line (4500 * 725 / 10000 = 326.25 -> 326), not folded into a single end-of-order rounding"
            - "${grand2} == 30566 == 24000 + 4500 + (1740 + 326)"
            - "${dep2} == 9170 == round_half_up(30566 * 3000 / 10000): the deposit is still re-derivable because confirm has not frozen it yet"
            - "${prep2} == 28 == 2 * 12 + 0 + 4 * 1, so the add-on and the note both feed dietary_prep_minutes"
            - "${pay_status} == DEPOSIT_PAID with amount_paid_cents 9170 and balance_due_cents 21396"
            - "${ff_status} == CONFIRMED and deposit_due_cents is now frozen at 9170"
            - "${wl_status} == WAITING with offer_round 0: holding a CONFIRMED reservation on ${svc_id} does not trip priority 57, which only looks at other WAITING or OFFERED waitlist rows"
            - "${wl_status2} == WITHDRAWN and no reservation was cancelled, because the entry never reached OFFERED"
            - "all seven Guest-exclusive writes returned their declared success code (201 for reservations, dietary-notes, add-ons, payments and waitlist-entries; 200 for name-change, confirm and withdraw)"

      - name: rbac_guest_cannot_perform_manager_kitchen_care_or_admin_exclusive_ops
        claim_type: Cannot perform other roles' exclusive operations
        grounds:
          - validations.priority_3_ERR_UNAUTHORIZED
          - roles.RestaurantManager.exclusive_operations
          - roles.KitchenLead.exclusive_operations
          - roles.GuestServices.exclusive_operations
          - roles.PlatformAdmin.exclusive_operations
        distinguishing_aspect: "Fourteen writes exclusive to the four other roles are attempted by a legitimate Guest and every one returns ERR_UNAUTHORIZED 403 — including three whose bodies point at ids that do not exist and one whose target service is in a state that would independently fail. Priority 3 must therefore fire before the not-found sweep and before every state check, and the clock must not have moved: the closing payment proves the rejected /_clock call was a no-op."
