              as: LeasingAgent
            - call: "POST /leases/${l10y_id}/execute"
              payload: { execution_note: "Imaging lease executed" }
              as: LeasingAgent
            - call: "POST /leases"
              payload: { building_id: "${b10_id}", suite_id: "${s10w_id}", tenant_id: "${t10w_id}", lease_type: "DIRECT", term_start: "2026-09-01", term_end: "2029-08-31", base_rent_psf_annual: 30.00 }
