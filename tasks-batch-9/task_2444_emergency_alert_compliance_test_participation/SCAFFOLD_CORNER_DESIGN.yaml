      - name: superseded_plan_is_terminal_and_cannot_be_reactivated
        claim_type: terminal_state_lockdown
        grounds:
          - "§1.2 state_machines.StatePlan terminal_states [SUPERSEDED] and ACTIVE -> SUPERSEDED (PLAN-SUPERSEDE CASCADE hop 1)"
          - "§1.6 ERR_PLAN_NOT_DRAFT (409)"
          - "§1.1 StatePlan.superseded_at 'Logical-clock instant a newer plan for the same state_code superseded this one'"
        distinguishing_aspect: "Activating a newer KS plan drives the older one into the terminal SUPERSEDED state with superseded_at stamped, and from there activate is refused with ERR_PLAN_NOT_DRAFT — the terminal state is not re-enterable and not escapable, while a plan for a DIFFERENT state_code is untouched by the cascade."
        test_recipe:
          setup:
            - "Clock 2026-08-05T09:00:00Z: plan_v1 (KS 2026-R1) and plan_ne (NE 2026-R1) both activated."
            - "Clock 2026-08-20T10:00:00Z: plan_v2 (KS 2026-R2) created and activated, superseding plan_v1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP"], mandatory_relay_event_codes: [] }
              captures: { plan_v1: "$.data.id" }
            - call: "POST /state-plans/${plan_v1}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
