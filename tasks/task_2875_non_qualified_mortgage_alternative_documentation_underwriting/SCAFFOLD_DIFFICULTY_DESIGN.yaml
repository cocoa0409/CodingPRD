              as: Underwriter
              as_user_id: "uw-15"
          assert:
            - "trigger call 1 -> 201: 2026-05-01 is the exact end instant of the existing month, so the intervals are adjacent, not overlapping; eligible_deposit_cents == 12222221"
            - "trigger call 2 -> 422 ERR_STATEMENT_PERIOD_OVERLAP (2026-05-15 .. 2026-06-15 shares interior days with 2026-05-01 .. 2026-06-01)"
            - "trigger call 3 -> 422 ERR_STATEMENT_PERIOD_OVERLAP (ending exactly on another month's start instant is not enough; 2026-04-15 sits inside the first month)"
            - "trigger call 4 -> 201, eligible_deposit_cents == 12222220 (12500000 - 277780)"
            - "trigger call 5 -> 200, StatementMonth.${sm_to_2_id}.inclusion_status == EXCLUDED"
            - "trigger call 6 -> 422 ERR_STATEMENT_PERIOD_OVERLAP: an EXCLUDED month still occupies its interval, so its slot cannot be refilled"
            - "trigger call 7 -> 422 ERR_STATEMENT_PERIOD_OUT_OF_WINDOW (2024-06-01 is earlier than the 24-month lookback opening at 2024-08-01)"
            - "trigger call 8 -> 422 ERR_STATEMENT_PERIOD_OUT_OF_WINDOW (the period ends 2026-09-01, after the 2026-08-01 clock date)"
            - "final state: the worksheet holds exactly three StatementMonth rows, two INCLUDED (12222221 and 12222220) and one EXCLUDED (12222221)"

