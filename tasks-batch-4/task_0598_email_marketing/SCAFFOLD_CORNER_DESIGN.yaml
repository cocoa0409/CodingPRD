  # =========================================================================
  - section: calculations
    instances:

      - name: segment_min_engagement_score_inclusive_boundary
        claim_type: Constants Applied
        grounds: [calculations.segment_member_set, entities.Segment.fields.min_engagement_score, entities.Subscriber.fields.engagement_score]
        distinguishing_aspect: "min_engagement_score is compared with `>=`: two brand-new subscribers score exactly 50, so a segment with min_engagement_score 50 counts both while an otherwise identical segment with 51 counts none."
        test_recipe:
          setup: ["One single-opt-in audience with 2 CONFIRMED subscribers who have received no sends, so engagement_score == 50 for both."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /audiences"
              payload: { account_id: "${acct}", name: "Main", default_from_email: "hi@acme.com", double_optin_required: false }
              as: PlatformAdmin
              captures: { aud: $.data.id }
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "s1@x.com", consent_source: "API" }
              as: PlatformAdmin
              captures: { s1: $.data.id, sc: $.data.engagement_score }
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "s2@x.com", consent_source: "API" }
              as: PlatformAdmin
          trigger:
            - call: "POST /audiences/${aud}/segments"
              payload: { name: "AtLeast50", consent_states: ["CONFIRMED"], min_engagement_score: 50 }
              as: PlatformAdmin
              captures: { mc50: $.data.member_count }
            - call: "POST /audiences/${aud}/segments"
              payload: { name: "AtLeast51", consent_states: ["CONFIRMED"], min_engagement_score: 51 }
              as: PlatformAdmin
              captures: { mc51: $.data.member_count }
          assert:
            - "${sc} == 50"
            - "${mc50} == 2   # inclusive >= boundary"
            - "${mc51} == 0"

