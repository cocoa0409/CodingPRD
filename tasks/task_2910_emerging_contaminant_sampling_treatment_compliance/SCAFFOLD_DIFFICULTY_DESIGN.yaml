            - "LabResult.${r3_id}.status == ACCEPTED"
            - "LabResult.${r3_id}.compliance_value_ng_per_l == 3.35"
            - "LabResult.${r3_id}.planning_value_ng_per_l == 3.35"

      - name: technology_score_rounds_each_weighted_term_before_summing_them
        grounds:
          - calculations.technology_score
          - entities.PilotTest.fields.technology_score
          - entities.PilotTest.fields.lifecycle_cost_score
          - entities.PilotTest.fields.removal_pct
          - global_constants.TECHNOLOGY_WEIGHTS
          - global_constants.LIFECYCLE_COST_DIVISOR_CENTS
          - state_machines.PilotTest.RUNNING_to_COMPLETED
        distinguishing_aspect: |
          MODE (b): nested rounding order. Five component scores are each multiplied by a weight and
          each product is rounded to two decimals BEFORE the five are added, so the GAC pilot scores
          80.14 (33.71 + 18.63 + 12.40 + 7.10 + 8.30); summing at full precision and rounding once at
          the end yields 80.13. Every input is an integer or two-decimal literal, so the only possible
          source of the 0.01 gap is the rounding order — unlike instance (a), where all five weights
          would be irrelevant and the discriminator is a sum of unrounded quotients.
        test_recipe:
          setup:
            - "EntryPoint EPTDS-01, population 45000, and a voluntary TreatmentEvaluation."
            - "A GAC PilotTest with lifecycle_cost_cents 2550000000, residuals_burden_score 62.00, footprint_score 71.00 and om_complexity_score 83.00, already RUNNING (its May 2026 window has opened against the default clock)."
            - "The pilot is completed with influent 50.00 and effluent 1.85, so removal_pct is 96.30, and lifecycle_cost_score is 100 - (2550000000 / 100000000) = 74.50."
          setup_api_calls:
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "GROUNDWATER", population_served: 45000 }
              as: UtilityAdmin
              captures: { ep_id: "$.data.id" }
            - call: "POST /treatment-evaluations"
              payload: { entry_point_id: "${ep_id}" }
              as: TreatmentEngineer
              captures: { eval_id: "$.data.id" }
            - call: "POST /pilot-tests"
              payload: { treatment_evaluation_id: "${eval_id}", technology: "GAC", window_start_at: "2026-05-01T00:00:00.000Z", window_end_at: "2026-05-15T00:00:00.000Z", ebct_min: 10.00, lifecycle_cost_cents: 2550000000, capital_cost_estimate_cents: 680000000, annual_om_estimate_cents: 31000000, residuals_burden_score: 62.00, footprint_score: 71.00, om_complexity_score: 83.00 }
              as: TreatmentEngineer
              captures: { gac_id: "$.data.id" }
            - call: "POST /pilot-tests/${gac_id}/start"
              payload: {}
              as: TreatmentEngineer
          trigger:
            - call: "POST /pilot-tests/${gac_id}/complete"
              payload: { influent_ng_per_l: 50.00, effluent_ng_per_l: 1.85, bed_volumes_treated: 25000, spent_media_kg: 800.00 }
              as: TreatmentEngineer
          assert:
            - "PilotTest.${gac_id}.status == COMPLETED"
            - "PilotTest.${gac_id}.removal_pct == 96.30"
            - "PilotTest.${gac_id}.lifecycle_cost_score == 74.50"
            - "PilotTest.${gac_id}.technology_score == 80.14"
            - "PilotTest.${gac_id}.technology_score != 80.13"
            - "PilotTest.${gac_id}.spent_media_kg == 800.00"
            - "PilotTest.${gac_id}.unmanifested_media_kg == 800.00"
            - "PilotTest.${gac_id}.selected == false"
            - "TreatmentEvaluation.${eval_id}.status == PILOTING"

      - name: rate_impact_ladder_keeps_the_provisional_surcharge_tier_after_a_capital_cost_patch
        grounds:
          - calculations.rate_impact_analysis
          - entities.CapitalProject.fields.provisional_rate_impact_pct
          - entities.CapitalProject.fields.surcharge_bp
          - entities.CapitalProject.fields.final_annual_requirement_cents
          - entities.CapitalProject.fields.rate_impact_pct
          - global_constants.ANNUITY_FACTOR_20Y_2PCT
          - validations[priority=33]
        distinguishing_aspect: |
          MODE (c): a pinned sequential order that looks circular. The surcharge tier is chosen from
          provisional_rate_impact_pct (14.90 -> 150 bp) and is NEVER re-chosen from the final
          rate_impact_pct (15.12), even though 15.12 sits in the next tier and would demand 400 bp. A
          fixed-point or re-entrant implementation reports surcharge_bp 400 and a different
          final_annual_requirement_cents; the pinned ladder reports 150 bp and 155178619. The
          discriminator is step ordering across seven dependent steps, not a rounding site (instance b)
          nor an unrounded accumulation (instance a).
        test_recipe:
          setup:
            - "EntryPoint EPTDS-01, population 45000 (18000 accounts, 1080000 kgal, baseline revenue 1026000000)."
            - "GAC and IX pilots completed exactly as in the dual-variant money instance, so the SELECT decision seeds a CapitalProject at capital_cost_cents 680000000 and annual_om_cost_cents 31000000 with rate_design UNIFORM and no funding."
            - "The project is still PLANNED, so its costs remain mutable."
          setup_api_calls:
            - call: "POST /entry-points"
