# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2906 — Apartment Doorstep Trash Valet Service
# Every rule_id below is verbatim from §0.5; every grounds ref resolves into
# SCAFFOLD.yaml §1.1–§1.7. Money literals in `assert:` were computed by
# executing the §1.3 formulas against the pinned setup inputs.
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: statement_provisional_vs_final_diverge_on_gross_basis
        grounds:
          - calculations.statement_settlement
          - calculations.resident_passthrough_line
          - entities.MonthlyStatement.fields.variant
          - entities.MonthlyStatement.fields.gross_passthrough_cents
          - entities.MonthlyStatement.fields.net_due_from_property_cents
          - state_machines.MonthlyStatement.DRAFT_to_ISSUED
          - concurrency_rules[statement-create-stale-contract]
        distinguishing_aspect: |
          The PROVISIONAL variant bills the contracted door count (unit_count 4 x 3495 = 13980)
          while the FINAL variant bills the occupancy-prorated per-resident line sum (7457) over
          the identical contract, resident set and night set, so net_due_from_property_cents moves
          from 10457 to 5578 with no input change whatsoever.
        test_recipe:
          setup:
            - "Property 'Maple Court' with unit_count 4 (units 101-104), ACTIVE, contract ACTIVE at 3495 cents/unit/month, revenue share 1500 bps, sla_missed_threshold_bps 1000, service_night_days SUN..THU, effective 2026-09-01..2027-08-31"
            - "Residents: 101 occupied all of September (30 billable days), 102 moved in 2026-09-14 (17 days), 103 moved out 2026-09-18 exclusive (17 days), 104 vacant"
            - "Two nights in 2026-09: 09-01 closed MISSED (no scans), 09-02 closed VERIFIED (2 of 2 expected doors scanned)"
            - "Logical clock at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /valet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /valet/properties"
              payload: { name: "Maple Court", unit_count: 4, market_code: "ATL" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /valet/properties/${prop_id}/contracts"
              payload: { per_unit_monthly_fee_cents: 3495, property_revenue_share_bps: 1500, service_night_days: ["SUN", "MON", "TUE", "WED", "THU"], effective_from: "2026-09-01", effective_to: "2027-08-31", sla_missed_threshold_bps: 1000 }
              as: BillingAnalyst
              as_user_id: "analyst-drafter"
              captures: { contract_id: $.data.id }
            - call: "POST /valet/properties/${prop_id}/residents"
              payload: { unit_number: 101, full_name: "Rosa One", move_in_date: "2026-08-01" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /valet/properties/${prop_id}/residents"
              payload: { unit_number: 102, full_name: "Ravi Two", move_in_date: "2026-09-14" }
              as: PlatformAdmin
              captures: { r2_id: $.data.id }
            - call: "POST /valet/properties/${prop_id}/residents"
              payload: { unit_number: 103, full_name: "Rita Three", move_in_date: "2026-08-01" }
              as: PlatformAdmin
              captures: { r3_id: $.data.id }
            - call: "POST /valet/residents/${r3_id}/move-out"
              payload: { move_out_date: "2026-09-18" }
              as: PlatformAdmin
            - call: "POST /valet/contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { contract_v: $.data.version }
            - call: "POST /valet/contracts/${contract_id}/service-nights"
              payload: { service_date: "2026-09-01", service_window_start: "2026-09-01T18:00:00.000Z", service_window_end: "2026-09-01T22:00:00.000Z" }
              as: ValetOpsManager
              captures: { n1_id: $.data.id }
            - call: "POST /valet/contracts/${contract_id}/service-nights"
              payload: { service_date: "2026-09-02", service_window_start: "2026-09-02T18:00:00.000Z", service_window_end: "2026-09-02T22:00:00.000Z" }
              as: ValetOpsManager
              captures: { n2_id: $.data.id, n2_v: $.data.version }
            - call: "POST /valet/contractors"
              payload: { legal_name: "Val Ito", equipment_provided_by_company: true, sets_own_schedule: true, works_exclusively: false, weekly_committed_hours: 20 }
              as: ValetOpsManager
              captures: { ct_id: $.data.id }
            - call: "POST /valet/contractors/${ct_id}/documents"
              payload: { tax_form_type: "W9", direct_deposit_on_file: true }
              as: ValetOpsManager
            - call: "POST /valet/contractors/${ct_id}/background-check"
              payload: { result: "CLEAR" }
              as: ComplianceOfficer
              as_user_id: "co-screener"
            - call: "POST /valet/contractors/${ct_id}/classification"
              payload: { basis: "DECLARED" }
              as: ComplianceOfficer
              as_user_id: "co-screener"
            - call: "POST /valet/service-nights/${n2_id}/route-assignments"
              payload: { contractor_id: "${ct_id}", unit_from: 101, unit_to: 103, expected_service_night_version: "${n2_v}" }
              as: ValetOpsManager
              captures: { rt2_id: $.data.id }
            - call: "POST /valet/route-assignments/${rt2_id}/accept"
              payload: {}
              as: Valet
              as_user_id: "${ct_id}"
            - call: "POST /valet/route-assignments/${rt2_id}/scans"
              payload: { resident_id: "${r1_id}", scan_result: "SERVICED", container_type: "TRASH_BIN" }
              as: Valet
              as_user_id: "${ct_id}"
            - call: "POST /valet/route-assignments/${rt2_id}/scans"
              payload: { resident_id: "${r3_id}", scan_result: "SERVICED", container_type: "TRASH_BIN" }
              as: Valet
              as_user_id: "${ct_id}"
            - call: "POST /valet/service-nights/${n2_id}/close"
              payload: {}
              as: ValetOpsManager
            - call: "POST /valet/service-nights/${n1_id}/close"
              payload: {}
              as: ValetOpsManager
          trigger:
            - call: "POST /valet/contracts/${contract_id}/statements"
              payload: { billing_period: "2026-09", expected_contract_version: "${contract_v}" }
              as: BillingAnalyst
              as_user_id: "analyst-drafter"
              captures: { stmt_id: $.data.id }
            - call: "POST /valet/statements/${stmt_id}/issue"
              payload: {}
              as: BillingAnalyst
              as_user_id: "analyst-issuer"
          assert:
            - "the POST /valet/contracts/${contract_id}/statements response has MonthlyStatement.variant == 'PROVISIONAL', gross_passthrough_cents == 13980, scheduled_night_count == 2, missed_equivalent_nights == 1.0, missed_service_bps == 5000, sla_credit_rate_bps == 1200, missed_service_credit_cents == 1678, property_revenue_share_cents == 1845, net_due_from_property_cents == 10457"
            - "the POST /valet/statements/${stmt_id}/issue response has MonthlyStatement.variant == 'FINAL', gross_passthrough_cents == 7457, missed_service_credit_cents == 895, property_revenue_share_cents == 984, net_due_from_property_cents == 5578"
            - "MonthlyStatement.${stmt_id}.status == 'ISSUED' and issued_by_user_id == 'analyst-issuer'"
            - "the two variants differ on the same inputs: 13980 - 7457 == 6523 cents of gross and 10457 - 5578 == 4879 cents of net"
            - "GET /valet/service-nights?contract_id=${contract_id} shows night ${n1_id} verification_status == 'MISSED' with billing_status == 'CREDITED' and night ${n2_id} verification_status == 'VERIFIED' with billing_status == 'INVOICED'"

      - name: contractor_classification_declared_vs_observed_flip_worker_status
        grounds:
          - calculations.contractor_classification_score
          - entities.ValetContractor.fields.classification
          - entities.ValetContractor.fields.classification_basis
          - entities.ValetContractor.fields.control_score
          - entities.ValetContractor.fields.observed_weekly_hours
          - state_machines.ValetContractor.CLEARED_to_CLEARED
        distinguishing_aspect: |
          On one unchanged onboarding packet the DECLARED basis scores 30 (equipment only) and
          classifies CONTRACTOR_1099, while the OBSERVED basis recomputes hours from three
          COMPLETED 10-hour routes at a single property inside the trailing 7-day window, scores
          75 and classifies EMPLOYEE_W2 — a different entity domain (worker classification, not
          money) from the statement dual variant.
        test_recipe:
          setup:
            - "Property 'Cedar Walk' unit_count 4, contract ACTIVE, service_night_days SUN..THU, effective 2026-09-01..2027-08-31"
            - "Contractor 'Dana Vale' declares equipment_provided_by_company true, sets_own_schedule true, works_exclusively false, weekly_committed_hours 20; background CLEAR; already DECLARED-classified so it is route-eligible"
            - "Three COMPLETED routes on nights 2026-09-01, 09-02 and 09-03, each with a 10-hour window (18:00Z to 04:00Z the next day), all at the same property"
            - "Logical clock advanced to 2026-09-03T23:00:00Z so the closed trailing window is 2026-08-28..2026-09-03"
          setup_api_calls:
            - call: "POST /valet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /valet/properties"
              payload: { name: "Cedar Walk", unit_count: 4, market_code: "ATL" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /valet/properties/${prop_id}/contracts"
              payload: { per_unit_monthly_fee_cents: 3495, property_revenue_share_bps: 1500, service_night_days: ["SUN", "MON", "TUE", "WED", "THU"], effective_from: "2026-09-01", effective_to: "2027-08-31", sla_missed_threshold_bps: 1000 }
              as: BillingAnalyst
              as_user_id: "analyst-drafter"
              captures: { contract_id: $.data.id }
            - call: "POST /valet/contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /valet/contractors"
              payload: { legal_name: "Dana Vale", equipment_provided_by_company: true, sets_own_schedule: true, works_exclusively: false, weekly_committed_hours: 20 }
              as: ValetOpsManager
              captures: { ct_id: $.data.id }
            - call: "POST /valet/contractors/${ct_id}/documents"
              payload: { tax_form_type: "W9", direct_deposit_on_file: true }
              as: ValetOpsManager
            - call: "POST /valet/contractors/${ct_id}/background-check"
              payload: { result: "CLEAR" }
              as: ComplianceOfficer
              as_user_id: "co-screener"
            - call: "POST /valet/contractors/${ct_id}/classification"
              payload: { basis: "DECLARED" }
              as: ComplianceOfficer
              as_user_id: "co-screener"
            - call: "POST /valet/contracts/${contract_id}/service-nights"
              payload: { service_date: "2026-09-01", service_window_start: "2026-09-01T18:00:00.000Z", service_window_end: "2026-09-02T04:00:00.000Z" }
              as: ValetOpsManager
              captures: { na_id: $.data.id, na_v: $.data.version }
            - call: "POST /valet/service-nights/${na_id}/route-assignments"
              payload: { contractor_id: "${ct_id}", unit_from: 101, unit_to: 104, expected_service_night_version: "${na_v}" }
              as: ValetOpsManager
              captures: { rta_id: $.data.id }
            - call: "POST /valet/route-assignments/${rta_id}/accept"
              payload: {}
              as: Valet
              as_user_id: "${ct_id}"
            - call: "POST /valet/route-assignments/${rta_id}/complete"
              payload: {}
              as: Valet
              as_user_id: "${ct_id}"
            - call: "POST /valet/contracts/${contract_id}/service-nights"
              payload: { service_date: "2026-09-02", service_window_start: "2026-09-02T18:00:00.000Z", service_window_end: "2026-09-03T04:00:00.000Z" }
              as: ValetOpsManager
              captures: { nb_id: $.data.id, nb_v: $.data.version }
            - call: "POST /valet/service-nights/${nb_id}/route-assignments"
              payload: { contractor_id: "${ct_id}", unit_from: 101, unit_to: 104, expected_service_night_version: "${nb_v}" }
              as: ValetOpsManager
              captures: { rtb_id: $.data.id }
            - call: "POST /valet/route-assignments/${rtb_id}/accept"
              payload: {}
              as: Valet
              as_user_id: "${ct_id}"
            - call: "POST /valet/route-assignments/${rtb_id}/complete"
              payload: {}
              as: Valet
              as_user_id: "${ct_id}"
            - call: "POST /valet/contracts/${contract_id}/service-nights"
              payload: { service_date: "2026-09-03", service_window_start: "2026-09-03T18:00:00.000Z", service_window_end: "2026-09-04T04:00:00.000Z" }
              as: ValetOpsManager
              captures: { nc_id: $.data.id, nc_v: $.data.version }
            - call: "POST /valet/service-nights/${nc_id}/route-assignments"
              payload: { contractor_id: "${ct_id}", unit_from: 101, unit_to: 104, expected_service_night_version: "${nc_v}" }
              as: ValetOpsManager
              captures: { rtc_id: $.data.id }
            - call: "POST /valet/route-assignments/${rtc_id}/accept"
              payload: {}
              as: Valet
              as_user_id: "${ct_id}"
            - call: "POST /valet/route-assignments/${rtc_id}/complete"
              payload: {}
              as: Valet
              as_user_id: "${ct_id}"
            - call: "POST /valet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T23:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /valet/contractors/${ct_id}/classification"
              payload: { basis: "DECLARED" }
              as: ComplianceOfficer
              as_user_id: "co-screener"
            - call: "POST /valet/contractors/${ct_id}/classification"
              payload: { basis: "OBSERVED" }
              as: ComplianceOfficer
              as_user_id: "co-auditor"
          assert:
            - "the DECLARED response has ValetContractor.control_score == 30, classification == 'CONTRACTOR_1099', classification_basis == 'DECLARED'"
            - "the OBSERVED response has ValetContractor.control_score == 75, classification == 'EMPLOYEE_W2', classification_basis == 'OBSERVED', observed_weekly_hours == 30.0"
            - "the 45-point delta is exactly CONTROL_WEIGHT_FULLTIME_HOURS (25) + CONTROL_WEIGHT_EXCLUSIVITY (20): the declared 20 committed hours score 0 while the observed 30.0 hours score 25, and the declared works_exclusively false scores 0 while 3 COMPLETED routes at one property score 20"
            - "ValetContractor.${ct_id}.onboarding_status == 'CLEARED' after both runs — classification never moves the onboarding dimension"

  - rule_id: combinatorial_formula
    instances:

      - name: fine_amount_nested_clamp_orders_round_then_floor_then_cap
        grounds:
          - calculations.resident_fine_amount
          - entities.ResidentFine.fields.amount_cents
          - entities.ResidentFine.fields.uncapped_amount_cents
          - entities.Resident.fields.fines_assessed_this_period_cents
          - state_machines.ServiceScan.OPEN_to_FINED
        distinguishing_aspect: |
          Mode (a) nested min/max: the third recycling-contamination offense computes a raw
          10000 cents, is floored by max(.,1000) as a no-op, and is only then clamped by
          min(.,remaining_cap=5000), so amount_cents == 5000 while uncapped_amount_cents == 10000
          — applying the cap before the floor or the floor before the rounding both produce a
          different number.
        test_recipe:
          setup:
            - "Property 'Birch Row' unit_count 4, contract ACTIVE, resident 101 occupied since 2026-08-01"
            - "Contractor cleared and DECLARED-classified; three nights 2026-09-01, 09-02, 09-03, each with its own accepted route over units 101-104"
            - "Two prior recycling-contamination scans on 09-01 and 09-02 already auto-fined 2500 and 7500 cents, so fines_assessed_this_period_cents == 10000 and remaining cap == 5000"
          setup_api_calls:
            - call: "POST /valet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /valet/properties"
              payload: { name: "Birch Row", unit_count: 4, market_code: "ATL" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /valet/properties/${prop_id}/contracts"
              payload: { per_unit_monthly_fee_cents: 3495, property_revenue_share_bps: 1500, service_night_days: ["SUN", "MON", "TUE", "WED", "THU"], effective_from: "2026-09-01", effective_to: "2027-08-31", sla_missed_threshold_bps: 1000 }
              as: BillingAnalyst
              as_user_id: "analyst-drafter"
              captures: { contract_id: $.data.id }
            - call: "POST /valet/properties/${prop_id}/residents"
              payload: { unit_number: 101, full_name: "Rosa One", move_in_date: "2026-08-01" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /valet/contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /valet/contractors"
              payload: { legal_name: "Val Ito", equipment_provided_by_company: true, sets_own_schedule: true, works_exclusively: false, weekly_committed_hours: 20 }
              as: ValetOpsManager
              captures: { ct_id: $.data.id }
            - call: "POST /valet/contractors/${ct_id}/documents"
              payload: { tax_form_type: "W9", direct_deposit_on_file: true }
              as: ValetOpsManager
            - call: "POST /valet/contractors/${ct_id}/background-check"
              payload: { result: "CLEAR" }
              as: ComplianceOfficer
              as_user_id: "co-screener"
            - call: "POST /valet/contractors/${ct_id}/classification"
              payload: { basis: "DECLARED" }
              as: ComplianceOfficer
              as_user_id: "co-screener"
            - call: "POST /valet/contracts/${contract_id}/service-nights"
              payload: { service_date: "2026-09-01", service_window_start: "2026-09-01T18:00:00.000Z", service_window_end: "2026-09-01T22:00:00.000Z" }
              as: ValetOpsManager
              captures: { n1_id: $.data.id, n1_v: $.data.version }
            - call: "POST /valet/service-nights/${n1_id}/route-assignments"
              payload: { contractor_id: "${ct_id}", unit_from: 101, unit_to: 104, expected_service_night_version: "${n1_v}" }
              as: ValetOpsManager
              captures: { rt1_id: $.data.id }
            - call: "POST /valet/route-assignments/${rt1_id}/accept"
              payload: {}
              as: Valet
              as_user_id: "${ct_id}"
            - call: "POST /valet/route-assignments/${rt1_id}/scans"
              payload: { resident_id: "${r1_id}", scan_result: "TAGGED_NOT_SERVICED", container_type: "RECYCLING_BIN", non_compliance_type: "RECYCLING_CONTAMINATION" }
              as: Valet
              as_user_id: "${ct_id}"
              captures: { sc1_id: $.data.id }
            - call: "POST /valet/contracts/${contract_id}/service-nights"
              payload: { service_date: "2026-09-02", service_window_start: "2026-09-02T18:00:00.000Z", service_window_end: "2026-09-02T22:00:00.000Z" }
              as: ValetOpsManager
              captures: { n2_id: $.data.id, n2_v: $.data.version }
            - call: "POST /valet/service-nights/${n2_id}/route-assignments"
              payload: { contractor_id: "${ct_id}", unit_from: 101, unit_to: 104, expected_service_night_version: "${n2_v}" }
              as: ValetOpsManager
              captures: { rt2_id: $.data.id }
            - call: "POST /valet/route-assignments/${rt2_id}/accept"
              payload: {}
              as: Valet
              as_user_id: "${ct_id}"
            - call: "POST /valet/route-assignments/${rt2_id}/scans"
              payload: { resident_id: "${r1_id}", scan_result: "TAGGED_NOT_SERVICED", container_type: "RECYCLING_BIN", non_compliance_type: "RECYCLING_CONTAMINATION" }
              as: Valet
              as_user_id: "${ct_id}"
              captures: { sc2_id: $.data.id }
            - call: "POST /valet/contracts/${contract_id}/service-nights"
              payload: { service_date: "2026-09-03", service_window_start: "2026-09-03T18:00:00.000Z", service_window_end: "2026-09-03T22:00:00.000Z" }
              as: ValetOpsManager
              captures: { n3_id: $.data.id, n3_v: $.data.version }
            - call: "POST /valet/service-nights/${n3_id}/route-assignments"
              payload: { contractor_id: "${ct_id}", unit_from: 101, unit_to: 104, expected_service_night_version: "${n3_v}" }
              as: ValetOpsManager
              captures: { rt3_id: $.data.id }
            - call: "POST /valet/route-assignments/${rt3_id}/accept"
              payload: {}
              as: Valet
              as_user_id: "${ct_id}"
          trigger:
            - call: "POST /valet/route-assignments/${rt3_id}/scans"
              payload: { resident_id: "${r1_id}", scan_result: "TAGGED_NOT_SERVICED", container_type: "RECYCLING_BIN", non_compliance_type: "RECYCLING_CONTAMINATION" }
              as: Valet
              as_user_id: "${ct_id}"
              captures: { sc3_id: $.data.id }
            - call: "GET /valet/resident-fines"
              payload: { scan_id: "${sc3_id}" }
              as: PlatformAdmin
              captures: { f3_id: "$.data[0].id" }
          assert:
            - "the trigger scan response has ServiceScan.offense_ordinal == 3 and tag_status == 'FINED'"
            - "GET /valet/resident-fines?scan_id=${sc3_id} returns exactly 1 ResidentFine with amount_cents == 5000, uncapped_amount_cents == 10000, escalation_multiplier == 2.0, base_cents == 5000, origin == 'AUTO', status == 'ASSESSED'"
            - "Resident.${r1_id}.fines_assessed_this_period_cents == 15000 and fines_outstanding_cents == 15000"
            - "the two earlier fines are unchanged: GET /valet/resident-fines?resident_id=${r1_id} returns 3 fines with amount_cents 2500, 7500 and 5000"

      - name: statement_gross_rounds_each_resident_line_before_summing
        grounds:
          - calculations.resident_passthrough_line
          - calculations.statement_settlement
          - entities.Resident.fields.move_in_date
          - entities.Resident.fields.move_out_date
          - entities.MonthlyStatement.fields.gross_passthrough_cents
        distinguishing_aspect: |
          Mode (b) rounding order: with a daily rate of exactly 116.5 cents, two residents at 17
          billable days each round to 1981 individually and the FINAL gross is 3495 + 1981 + 1981
          == 7457; summing the exact rationals first and rounding once yields 7456, so the single
          cent is the discriminator between the pinned per-line order and the forbidden one.
        test_recipe:
          setup:
            - "Property 'Willow Gate' unit_count 4, contract ACTIVE at 3495 cents/unit/month over a 30-day September, revenue share 1500 bps"
            - "Residents: 101 move_in 2026-08-01 (30 billable days), 102 move_in 2026-09-14 (17 days), 103 move_in 2026-08-01 with move_out 2026-09-18 exclusive (17 days), 104 vacant"
            - "No ServiceNight exists for 2026-09, so scheduled_night_count == 0 and the SLA arm contributes nothing"
          setup_api_calls:
            - call: "POST /valet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /valet/properties"
              payload: { name: "Willow Gate", unit_count: 4, market_code: "ATL" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /valet/properties/${prop_id}/contracts"
              payload: { per_unit_monthly_fee_cents: 3495, property_revenue_share_bps: 1500, service_night_days: ["SUN", "MON", "TUE", "WED", "THU"], effective_from: "2026-09-01", effective_to: "2027-08-31", sla_missed_threshold_bps: 1000 }
              as: BillingAnalyst
              as_user_id: "analyst-drafter"
