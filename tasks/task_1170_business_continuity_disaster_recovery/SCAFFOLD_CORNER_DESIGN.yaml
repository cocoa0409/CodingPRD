              payload: {}
              as: ResilienceAdmin
            - call: "POST /resilience/bias"
              payload: { process_id: "${p_id}", cycle_label: "FY2026-H1", rto_target_hours: 8, rpo_target_hours: 2, mtpd_hours: 24, peak_period_flag: false, impact_financial_per_hour: 100, impact_regulatory: "NONE", impact_reputational: "NONE", impact_operational: "NONE" }
              as: BIAAnalyst
              captures: { bia_id: $.data.id }
            - call: "POST /resilience/bias/${bia_id}/submit"
              payload: {}
              as: BIAAnalyst
            - call: "POST /resilience/bias/${bia_id}/decide"
              payload: { decision: "APPROVE" }
              as: RiskCommittee
              as_user_id: "${c2_id}"
            - call: "POST /resilience/third-parties"
              payload: { name: "ImmVendor", service_category: "Cloud", criticality_rating: "HIGH", owner_contact_id: "${c1_id}" }
              as: VendorManager
              as_user_id: "${c2_id}"
              captures: { v_id: $.data.id }
            - call: "POST /resilience/third-parties/${v_id}/activate"
              payload: {}
              as: VendorManager
              as_user_id: "${c2_id}"
            - call: "POST /resilience/assessments"
              payload: { third_party_id: "${v_id}", process_id: "${p_id}", assessment_type: "ANNUAL", assessed_rto_hours: 12, assessed_rpo_hours: 2, rto_required_hours: 6, rpo_required_hours: 1 }
              as: VendorManager
              as_user_id: "${c2_id}"
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /resilience/assessments/${a_id}/finalize"
