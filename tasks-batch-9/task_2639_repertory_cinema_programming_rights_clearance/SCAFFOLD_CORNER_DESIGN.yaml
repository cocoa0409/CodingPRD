      - name: stale_expected_clearance_version_on_auto_schedule_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.autoschedule-stale-clearance
          - validations[priority=5]
          - errors[ERR_STALE_CLEARANCE_VERSION]
          - endpoints[POST /showtimes/auto-schedule]
        distinguishing_aspect: |
          The optimiser carries the same guard as the manual scheduler, and it must fire BEFORE any slot is
          searched or scored - otherwise a stale caller would consume a slot and only then be refused. The
          distinct assertion here is that no slot_score was written anywhere.
        test_recipe:
          setup:
            - "Canonical venue / distributor / title / CONFIRMED booking / CLEARED clearance with max_screenings 6 / non-encrypted DCP asset."
            - "The clearance version is read once and held as ${c_v1}."
            - "A first showtime at 2026-08-14T12:00:00Z created manually with ${c_v1} bumps the clearance version to 2, so ${c_v1} is stale."
            - "The auto-schedule request targets 2026-08-16, a completely empty day inside both windows with 45 grid candidates, so a healthy request would certainly find a slot."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Reel Repertory", seat_capacity: 12, house_hold_seats: 4, trailer_reel_minutes: 12, turnaround_minutes: 25, min_useful_gap_minutes: 45, dcp_ingest_lane_count: 2, open_local_time: "11:00", last_start_local_time: "22:00", utc_offset_minutes: 0, max_first_run_share: 0.60, weekly_repertory_target: 3, supported_formats: ["DCP_2K", "DCP_4K"], base_house_nut_weekly_cents: 200000 }
