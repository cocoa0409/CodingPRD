              as: EditorialStaff
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_CODE_ALREADY_EXISTS"
            - "the returned http status is 409"
            - "CodeChange count with code 00007 is 1"

      - name: action_permission_beats_workflow_state_conflict
        grounds:
          - validations[priority=2]
          - validations[priority=8]
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_MEETING_NOT_OPEN]
        distinguishing_aspect: |
          The auth-versus-state pair: a licensee whose licence was terminated in
