            - "IncentiveEnrollment.${enr_a_id}.status == TERMINATED_INELIGIBLE"
            - "IncentiveEnrollment.${enr_b_id}.status == ENROLLED"
            - "IncentiveProgram.${ip_id}.enrollment_state == OPEN"
            - "IncentiveProgram.${ip_id}.uncommitted_capacity_cents == 80000000"
            - "IncentiveProgram.${ip_id}.enrolled_count == 1"

      - name: cascade_batch_finalize_to_downgrade_counter_to_auto_audit_to_reclassification_suspension
        grounds:
          - state_machines.SettlementBatch.SUBMITTED_to_FINALIZED
          - state_machines.TransactionRecord.PENDING_to_DOWNGRADED
          - calculations.merchant_downgrade_counter
          - state_machines.Merchant.VERIFIED_to_UNDER_REVIEW
          - state_machines.ReclassificationRequest.SUBMITTED_to_SUSPENDED_PENDING_AUDIT
          - entities.MerchantCategoryAudit.fields.trigger_reason
        distinguishing_aspect: |
          Depth-4 chain fired by a single POST /settlement-batches/{id}/finalize — a different
          trigger and a different terminal entity from the sustain-findings cascade: hop 1 downgrades
          three records to 40 cents each, hop 2 recomputes downgrade_count_current_quarter to 3 and
          lifetime_net_assessed_cents to 120, hop 3 auto-creates a DOWNGRADE_THRESHOLD audit and
          moves the merchant to UNDER_REVIEW, hop 4 freezes the live reclassification request to
          SUSPENDED_PENDING_AUDIT.
        test_recipe:
          setup:
            - "Clock at 2026-09-03T00:00:00Z so that batch_date 2026-09-02 falls in the current quarter Q3."
            - "US/USD acquirer; MCC 5411 and MCC 9399 defined; CPS_RETAIL, SMALL_TICKET and STANDARD programs."
            - "One VERIFIED grocery merchant with a live reclassification request to 9399 in status SUBMITTED."
