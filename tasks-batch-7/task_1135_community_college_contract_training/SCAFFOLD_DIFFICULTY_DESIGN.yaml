              as_user_id: "adm-01"
              captures: { gp: $.data.id }
            - call: "POST /ct/employers"
              payload: { legal_name: "Beta Works", industry_code: "333111", contact_email: "ops@beta.example" }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { emp: $.data.id }
            - call: "POST /ct/employers/${emp}/needs-assessments"
              payload: { title: "Welding", skill_gaps: ["weld"], target_roles: ["welder"], curriculum_modules: [{ code: "WLD-1", hours: 10, required_credential_codes: ["CNC", "OSHA30"] }] }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { na: $.data.id }
            - call: "POST /ct/needs-assessments/${na}/submit"
              payload: {}
              as: WorkforceCoordinator
              as_user_id: "wc-01"
            - call: "POST /ct/needs-assessments/${na}/approve"
              payload: {}
              as: CollegeAdmin
              as_user_id: "adm-01"
            - call: "POST /ct/employers/${emp}/training-agreements"
              payload: { needs_assessment_id: "${na}", pricing_model: "PER_PARTICIPANT", delivery_mode: "ON_SITE", est_participant_count: 20, est_delivery_hours: 10, target_start_date: "2026-06-01T00:00:00Z", max_cohorts: 3 }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { agr: $.data.id }
            - call: "POST /ct/training-agreements/${agr}/quote"
              payload: {}
              as: WorkforceCoordinator
              as_user_id: "wc-01"
            - call: "POST /ct/training-agreements/${agr}/sign"
