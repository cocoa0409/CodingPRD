            - call: "POST /kiosk-ops/devices/${dev_id}/cache-sync"
              payload: { bundle_id: "${bundle_id}" }
              as: DeviceAgent
              as_user_id: "${dev_id}"
            - call: "POST /kiosk-ops/devices/${dev_id}/orders"
              payload: { line_items: [{ menu_item_id: "${item_a_id}", qty: 1 }], tender_kind: "CARD", created_offline: true }
              as: DeviceAgent
              as_user_id: "${dev_id}"
