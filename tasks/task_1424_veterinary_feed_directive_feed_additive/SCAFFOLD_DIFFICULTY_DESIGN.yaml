scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — dual_variant_calc (>= 2 instances, different entity domains)
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: withdrawal_plan_provisional_vs_final
        grounds:
          - calculations.provisional_market_date
          - calculations.final_market_date
          - state_machines.WithdrawalPlan.PROVISIONAL_to_FINALIZED
          - entities.WithdrawalPlan.fields.provisional_market_date
          - entities.WithdrawalPlan.fields.final_market_date
        distinguishing_aspect: |
          WithdrawalPlan carries TWO market-date variants computed from the
          same order: provisional_market_date uses now_utc at validation
          (forward_looking), final_market_date uses producer-attested
          last_feed_consumed_at at delivery (chronological). The two values
          differ because the last-feed timestamp is always later than the
          validation timestamp; both are exposed on the same entity.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z"
            - "Clinic C1, Vet V1 ACTIVE, Producer P1 ACTIVE, AnimalGroup AG1 CATTLE:BEEF earliest_market_date=2026-09-15"
            - "VfdDrug D1 withdrawal_hours=96, allowed_species_classes=['CATTLE:BEEF']"
            - "VCPR ACTIVE covering (V1, P1) expiring 2027-08-01"
            - "VfdAuthorization A1 authorized_animal_count=100, expiration 2026-10-01"
            - "FeedMill M1, DistributorAcknowledgment ACK1 ACKNOWLEDGED covering (M1, D1)"
            - "FeedOrder O1 against A1 with animal_count=10"
          setup_api_calls:
            - call: "POST /vfd/clinics"
              payload: { name: "Clinic One", license_number: "LIC-C1", state_code: "IA" }
              as: Inspector
              captures: { clinic_id: $.data.id }
            - call: "POST /vfd/clinics/${clinic_id}/veterinarians"
              payload: { full_name: "Dr. Alice", license_number: "DVM-1", state_code: "IA" }
              as: Inspector
              captures: { vet_id: $.data.id }
            - call: "POST /vfd/producers"
              payload: { legal_name: "Farm P1", premise_id: "PIN-1", state_code: "IA" }
              as: Inspector
              captures: { producer_id: $.data.id }
            - call: "POST /vfd/producers/${producer_id}/animal-groups"
              payload: { species: "CATTLE", production_class: "BEEF", head_count: 200, average_weight_lbs: 1200, earliest_market_date: "2026-09-15" }
              as: Producer
              as_user_id: "${producer_id}"
              captures: { group_id: $.data.id }
            - call: "POST /vfd/drugs"
              payload: { drug_code: "DRUG-1", label_name: "Med A", withdrawal_hours: 96, allowed_species_classes: ["CATTLE:BEEF"], max_duration_days: 14 }
              as: Inspector
              captures: { drug_id: $.data.id }
            - call: "POST /vfd/vcp-verifications"
              payload: { vet_id: "${vet_id}", producer_id: "${producer_id}", expires_on: "2027-08-01T00:00:00Z" }
              as: Veterinarian
              as_user_id: "${vet_id}"
            - call: "POST /vfd/vfd-authorizations"
              payload: { producer_id: "${producer_id}", animal_group_id: "${group_id}", vet_id: "${vet_id}", drug_id: "${drug_id}", authorized_animal_count: 100, feed_duration_days: 14, expiration_date: "2026-10-01T00:00:00Z" }
              as: Veterinarian
              as_user_id: "${vet_id}"
              captures: { vfd_id: $.data.id, vfd_v: $.data.version }
            - call: "POST /vfd/feed-mills"
              payload: { name: "Mill M1", fda_registration: "FDA-M1", state_code: "IA" }
              as: Inspector
              captures: { mill_id: $.data.id }
            - call: "POST /vfd/feed-mills/${mill_id}/distributor-acknowledgments"
              payload: { distributor_name: "Dist D", covers_drug_id: "${drug_id}", statement_text: "ack" }
              as: FeedMillOperator
              as_user_id: "${mill_id}"
            - call: "POST /vfd/feed-mills/${mill_id}/feed-orders"
              payload: { vfd_authorization_id: "${vfd_id}", producer_id: "${producer_id}", animal_count: 10, tons_of_feed: 5, intended_use_label: "label use" }
              as: FeedMillOperator
              as_user_id: "${mill_id}"
              captures: { order_id: $.data.id }
            - call: "POST /vfd/feed-orders/${order_id}/validate"
              payload: { expected_vfd_authorization_version: "${vfd_v}" }
              as: FeedMillOperator
              as_user_id: "${mill_id}"
              captures: { order_v_after_validate: $.data.version }
            - call: "POST /vfd/feed-orders/${order_id}/ship"
              payload: { tons_shipped: 5 }
              as: FeedMillOperator
              as_user_id: "${mill_id}"
              captures: { shipment_id: $.data.id }
          trigger:
            - call: "POST /vfd/feed-shipments/${shipment_id}/deliver"
              payload: { last_feed_consumed_at: "2026-08-10T00:00:00Z" }
              as: Producer
              as_user_id: "${producer_id}"
          assert:
            - "WithdrawalPlan for ${order_id} has provisional_market_date == 2026-08-05T00:00:00Z (2026-08-01 + 96h; later than 2026-09-15 max comparison so max picked now+96h, but 2026-09-15 is later, so provisional == 2026-09-15)"
            - "WithdrawalPlan.final_market_date == 2026-08-14T00:00:00Z (2026-08-10 + 96h)"
            - "WithdrawalPlan.provisional_market_date != WithdrawalPlan.final_market_date"
            - "WithdrawalPlan.status == FINALIZED (2026-08-14 <= 2026-09-15)"

      - name: vfd_remaining_quota_forward_vs_settled
        grounds:
          - calculations.vfd_remaining_quota
          - entities.VfdAuthorization.fields.remaining_animal_count
          - state_machines.FeedOrder.VALIDATED_to_CANCELLED
        distinguishing_aspect: |
          VfdAuthorization.remaining_animal_count is a dual-variant aggregate
          on the VFD entity domain: the forward_looking variant used inside
          validate evaluates (remaining - candidate_order) BEFORE the new
          order is debited; the settled variant recomputed after a cancel
          returns the cancelled order's animal_count. The two algorithms
          produce different numeric views of the same field across the
          order's lifecycle (validate -> cancel -> re-validate).
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z"
            - "Clinic C2, Vet V2 ACTIVE, Producer P2 ACTIVE, AnimalGroup AG2 SWINE:BREEDING earliest_market_date=2026-12-01"
            - "VfdDrug D2 withdrawal_hours=24, allowed_species_classes=['SWINE:BREEDING']"
            - "VCPR ACTIVE for (V2, P2)"
            - "VfdAuthorization A2 authorized_animal_count=50, expiration 2026-10-01"
            - "FeedMill M2 with acknowledgment covering D2"
          setup_api_calls:
            - call: "POST /vfd/clinics"
              payload: { name: "Clinic Two", license_number: "LIC-C2", state_code: "IA" }
              as: Inspector
              captures: { clinic_id: $.data.id }
            - call: "POST /vfd/clinics/${clinic_id}/veterinarians"
              payload: { full_name: "Dr. Bob", license_number: "DVM-2", state_code: "IA" }
              as: Inspector
              captures: { vet_id: $.data.id }
            - call: "POST /vfd/producers"
              payload: { legal_name: "Farm P2", premise_id: "PIN-2", state_code: "IA" }
              as: Inspector
              captures: { producer_id: $.data.id }
            - call: "POST /vfd/producers/${producer_id}/animal-groups"
              payload: { species: "SWINE", production_class: "BREEDING", head_count: 500, average_weight_lbs: 400, earliest_market_date: "2026-12-01" }
              as: Producer
              as_user_id: "${producer_id}"
              captures: { group_id: $.data.id }
            - call: "POST /vfd/drugs"
              payload: { drug_code: "DRUG-2", label_name: "Med B", withdrawal_hours: 24, allowed_species_classes: ["SWINE:BREEDING"], max_duration_days: 7 }
              as: Inspector
              captures: { drug_id: $.data.id }
            - call: "POST /vfd/vcp-verifications"
              payload: { vet_id: "${vet_id}", producer_id: "${producer_id}", expires_on: "2027-08-01T00:00:00Z" }
              as: Veterinarian
              as_user_id: "${vet_id}"
            - call: "POST /vfd/vfd-authorizations"
              payload: { producer_id: "${producer_id}", animal_group_id: "${group_id}", vet_id: "${vet_id}", drug_id: "${drug_id}", authorized_animal_count: 50, feed_duration_days: 7, expiration_date: "2026-10-01T00:00:00Z" }
              as: Veterinarian
              as_user_id: "${vet_id}"
              captures: { vfd_id: $.data.id, vfd_v: $.data.version }
            - call: "POST /vfd/feed-mills"
              payload: { name: "Mill M2", fda_registration: "FDA-M2", state_code: "IA" }
              as: Inspector
              captures: { mill_id: $.data.id }
            - call: "POST /vfd/feed-mills/${mill_id}/distributor-acknowledgments"
              payload: { distributor_name: "Dist E", covers_drug_id: "${drug_id}", statement_text: "ack" }
              as: FeedMillOperator
              as_user_id: "${mill_id}"
            - call: "POST /vfd/feed-mills/${mill_id}/feed-orders"
              payload: { vfd_authorization_id: "${vfd_id}", producer_id: "${producer_id}", animal_count: 20, tons_of_feed: 3, intended_use_label: "label use" }
              as: FeedMillOperator
              as_user_id: "${mill_id}"
              captures: { order_id: $.data.id }
            - call: "POST /vfd/feed-orders/${order_id}/validate"
              payload: { expected_vfd_authorization_version: "${vfd_v}" }
              as: FeedMillOperator
              as_user_id: "${mill_id}"
          trigger:
            - call: "POST /vfd/feed-orders/${order_id}/cancel"
              payload: {}
              as: Producer
              as_user_id: "${producer_id}"
          assert:
            - "Before cancel: VfdAuthorization.${vfd_id}.remaining_animal_count == 30 (50 - 20, settled variant after validate)"
            - "After cancel: VfdAuthorization.${vfd_id}.remaining_animal_count == 50 (compensating return)"
            - "VfdAuthorization.status == ISSUED (no longer PARTIALLY_USED)"

  # =========================================================================
  # Rule 2 — combinatorial_formula (>= 2 instances, DIFFERENT modes)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: compliance_penalty_tiered_marginal_rounding
        grounds:
          - calculations.compliance_penalty
          - calculations.residue_severity
          - state_machines.ResidueCase.UNDER_INVESTIGATION_to_CONFIRMED_VIOLATION
        distinguishing_aspect: |
          Mode (b) — nested rounding order matters. compliance_penalty rounds
          each tier's marginal contribution to an integer THEN sums; the
          alternative (sum floats, then round) yields different cents on
          fractional ratios. The scaffold pins round-per-tier-then-sum.
          With ratio=3.7, tolerance=100, residue=370: TIER_1 marginal =
          round(min(3.7,2.0)-1.0)*50 = round(1.0)*50 = 50; TIER_2 marginal =
          round(min(3.7,5.0)-2.0)*150 = round(1.7)*150 = round(1.7)=2 -> 300;
          TIER_3 skipped; + FLAT_ADMIN 100 = total 450.
        test_recipe:
          setup:
            - "Clinic C3 with compliance_score=1000"
            - "Vet V3 under C3, Producer P3, AnimalGroup AG3, Drug D3, VCPR active, VFD A3 issued"
            - "FeedMill M3 with ack, FeedOrder O3 validated+shipped+delivered"
            - "ResidueCase R3 on P3 in UNDER_INVESTIGATION"
          setup_api_calls:
            - call: "POST /vfd/clinics"
              payload: { name: "Clinic Three", license_number: "LIC-C3", state_code: "IA" }
              as: Inspector
              captures: { clinic_id: $.data.id }
            - call: "POST /vfd/clinics/${clinic_id}/veterinarians"
              payload: { full_name: "Dr. Carol", license_number: "DVM-3", state_code: "IA" }
              as: Inspector
              captures: { vet_id: $.data.id }
            - call: "POST /vfd/producers"
              payload: { legal_name: "Farm P3", premise_id: "PIN-3", state_code: "IA" }
              as: Inspector
              captures: { producer_id: $.data.id }
            - call: "POST /vfd/producers/${producer_id}/animal-groups"
              payload: { species: "CATTLE", production_class: "BEEF", head_count: 50, average_weight_lbs: 1100, earliest_market_date: "2026-12-01" }
              as: Producer
              as_user_id: "${producer_id}"
              captures: { group_id: $.data.id }
            - call: "POST /vfd/drugs"
              payload: { drug_code: "DRUG-3", label_name: "Med C", withdrawal_hours: 48, allowed_species_classes: ["CATTLE:BEEF"], max_duration_days: 7 }
              as: Inspector
              captures: { drug_id: $.data.id }
            - call: "POST /vfd/vcp-verifications"
              payload: { vet_id: "${vet_id}", producer_id: "${producer_id}", expires_on: "2027-08-01T00:00:00Z" }
              as: Veterinarian
              as_user_id: "${vet_id}"
            - call: "POST /vfd/vfd-authorizations"
              payload: { producer_id: "${producer_id}", animal_group_id: "${group_id}", vet_id: "${vet_id}", drug_id: "${drug_id}", authorized_animal_count: 20, feed_duration_days: 7, expiration_date: "2026-10-01T00:00:00Z" }
              as: Veterinarian
              as_user_id: "${vet_id}"
              captures: { vfd_id: $.data.id, vfd_v: $.data.version }
            - call: "POST /vfd/feed-mills"
              payload: { name: "Mill M3", fda_registration: "FDA-M3", state_code: "IA" }
              as: Inspector
              captures: { mill_id: $.data.id }
            - call: "POST /vfd/feed-mills/${mill_id}/distributor-acknowledgments"
              payload: { distributor_name: "Dist F", covers_drug_id: "${drug_id}", statement_text: "ack" }
              as: FeedMillOperator
              as_user_id: "${mill_id}"
            - call: "POST /vfd/feed-mills/${mill_id}/feed-orders"
              payload: { vfd_authorization_id: "${vfd_id}", producer_id: "${producer_id}", animal_count: 5, tons_of_feed: 1, intended_use_label: "label use" }
              as: FeedMillOperator
              as_user_id: "${mill_id}"
              captures: { order_id: $.data.id }
            - call: "POST /vfd/feed-orders/${order_id}/validate"
              payload: { expected_vfd_authorization_version: "${vfd_v}" }
              as: FeedMillOperator
              as_user_id: "${mill_id}"
            - call: "POST /vfd/feed-orders/${order_id}/ship"
              payload: { tons_shipped: 1 }
              as: FeedMillOperator
              as_user_id: "${mill_id}"
              captures: { shipment_id: $.data.id }
            - call: "POST /vfd/feed-shipments/${shipment_id}/deliver"
              payload: { last_feed_consumed_at: "2026-08-05T00:00:00Z" }
              as: Producer
              as_user_id: "${producer_id}"
            - call: "POST /vfd/producers/${producer_id}/residue-cases"
              payload: { feed_order_id: "${order_id}", detected_at: "2026-08-12T00:00:00Z", investigator_id: "inv-1" }
              as: Inspector
              captures: { case_id: $.data.id }
            - call: "POST /vfd/residue-cases/${case_id}/open-investigation"
              payload: {}
              as: Inspector
          trigger:
            - call: "POST /vfd/residue-cases/${case_id}/confirm"
              payload: { residue_ppb: 370, tolerance_ppb: 100 }
              as: Inspector
          assert:
            - "ResidueCase.${case_id}.severity_tier == TIER_2 (2.0 <= 3.7 < 5.0)"
            - "ResidueCase.${case_id}.penalty_score_deduction == 450 (round-per-tier: T1=round(1.0)*50=50, T2=round(1.7)*150=300, +FLAT_ADMIN 100)"
            - "VeterinaryClinic.${clinic_id}.compliance_score == 550 (1000 - 450)"
            - "VeterinaryClinic.${clinic_id}.audit_ready == false (550 < 700)"

      - name: provisional_market_date_three_input_max
        grounds:
          - calculations.provisional_market_date
        distinguishing_aspect: |
          Mode (a) — formula with >=3 inputs and non-linear interaction:
          provisional_market_date = max(now_utc + withdrawal_window_hours,
          animal_group.earliest_market_date) where withdrawal_window_hours
          itself depends on the drug selected. Branch selection changes with
          each input; the max() function is the non-linear interaction.
          Case A: now+96h (=2026-08-05) later than earliest_market_date
          (=2026-08-03) -> provisional == 2026-08-05. Case B (separate
          setup): earliest_market_date later -> provisional ==
          earliest_market_date. The branch flips based on input combination.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z"
            - "Clinic/Vet/Producer/Group(CATTLE:BEEF, earliest_market_date=2026-08-03)/Drug(96h)"
            - "VCPR active; VFD issued; Mill + Ack; Order submitted"
          setup_api_calls:
            - call: "POST /vfd/clinics"
              payload: { name: "Clinic Four", license_number: "LIC-C4", state_code: "IA" }
              as: Inspector
              captures: { clinic_id: $.data.id }
            - call: "POST /vfd/clinics/${clinic_id}/veterinarians"
              payload: { full_name: "Dr. Dan", license_number: "DVM-4", state_code: "IA" }
              as: Inspector
              captures: { vet_id: $.data.id }
            - call: "POST /vfd/producers"
              payload: { legal_name: "Farm P4", premise_id: "PIN-4", state_code: "IA" }
              as: Inspector
              captures: { producer_id: $.data.id }
            - call: "POST /vfd/producers/${producer_id}/animal-groups"
              payload: { species: "CATTLE", production_class: "BEEF", head_count: 80, average_weight_lbs: 1150, earliest_market_date: "2026-08-03" }
              as: Producer
              as_user_id: "${producer_id}"
              captures: { group_id: $.data.id }
            - call: "POST /vfd/drugs"
              payload: { drug_code: "DRUG-4", label_name: "Med D", withdrawal_hours: 96, allowed_species_classes: ["CATTLE:BEEF"], max_duration_days: 14 }
              as: Inspector
              captures: { drug_id: $.data.id }
            - call: "POST /vfd/vcp-verifications"
              payload: { vet_id: "${vet_id}", producer_id: "${producer_id}", expires_on: "2027-08-01T00:00:00Z" }
              as: Veterinarian
              as_user_id: "${vet_id}"
            - call: "POST /vfd/vfd-authorizations"
              payload: { producer_id: "${producer_id}", animal_group_id: "${group_id}", vet_id: "${vet_id}", drug_id: "${drug_id}", authorized_animal_count: 30, feed_duration_days: 7, expiration_date: "2026-10-01T00:00:00Z" }
              as: Veterinarian
              as_user_id: "${vet_id}"
              captures: { vfd_id: $.data.id, vfd_v: $.data.version }
            - call: "POST /vfd/feed-mills"
              payload: { name: "Mill M4", fda_registration: "FDA-M4", state_code: "IA" }
              as: Inspector
              captures: { mill_id: $.data.id }
            - call: "POST /vfd/feed-mills/${mill_id}/distributor-acknowledgments"
              payload: { distributor_name: "Dist G", covers_drug_id: "${drug_id}", statement_text: "ack" }
              as: FeedMillOperator
              as_user_id: "${mill_id}"
            - call: "POST /vfd/feed-mills/${mill_id}/feed-orders"
              payload: { vfd_authorization_id: "${vfd_id}", producer_id: "${producer_id}", animal_count: 5, tons_of_feed: 1, intended_use_label: "label use" }
              as: FeedMillOperator
              as_user_id: "${mill_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /vfd/feed-orders/${order_id}/validate"
              payload: { expected_vfd_authorization_version: "${vfd_v}" }
              as: FeedMillOperator
              as_user_id: "${mill_id}"
          assert:
            - "WithdrawalPlan for ${order_id}.provisional_market_date == 2026-08-05T00:00:00Z (now+96h wins because 2026-08-05 > 2026-08-03)"
            - "WithdrawalPlan.withdrawal_window_hours == 96"
            - "WithdrawalPlan.status == PROVISIONAL"

  # =========================================================================
  # Rule 3 — non_linear_state_machine (>= 2 instances, different entities)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: veterinarian_active_suspended_active_cycle
        grounds:
          - state_machines.Veterinarian.ACTIVE_to_SUSPENDED
          - state_machines.Veterinarian.SUSPENDED_to_ACTIVE
          - state_machines.Veterinarian.ACTIVE_to_REVOKED
        distinguishing_aspect: |
          Veterinarian state machine has a CYCLE ACTIVE -> SUSPENDED -> ACTIVE
          (reinstatement) — non-linear. Branching: from ACTIVE there are two
          terminal-ish outcomes (SUSPENDED which loops back, or REVOKED
          terminal). The cycle allows re-entry; revocation does not.
        test_recipe:
          setup:
            - "Clinic C5, Vet V5 ACTIVE"
          setup_api_calls:
            - call: "POST /vfd/clinics"
              payload: { name: "Clinic Five", license_number: "LIC-C5", state_code: "IA" }
              as: Inspector
              captures: { clinic_id: $.data.id }
            - call: "POST /vfd/clinics/${clinic_id}/veterinarians"
              payload: { full_name: "Dr. Eve", license_number: "DVM-5", state_code: "IA" }
              as: Inspector
              captures: { vet_id: $.data.id }
          trigger:
            - call: "POST /vfd/veterinarians/${vet_id}/suspend"
              payload: {}
              as: Inspector
            - call: "POST /vfd/veterinarians/${vet_id}/reinstate"
              payload: {}
              as: Inspector
            - call: "POST /vfd/veterinarians/${vet_id}/suspend"
              payload: {}
              as: Inspector
            - call: "POST /vfd/veterinarians/${vet_id}/reinstate"
              payload: {}
              as: Inspector
          assert:
            - "Veterinarian.${vet_id}.status == ACTIVE (cycle allowed twice)"
            - "Veterinarian.${vet_id}.version == 5 (1 initial + 4 transitions)"

      - name: feed_order_branching_reject_vs_validate
        grounds:
          - state_machines.FeedOrder.SUBMITTED_to_REJECTED
          - state_machines.FeedOrder.SUBMITTED_to_VALIDATED
          - state_machines.FeedOrder.VALIDATED_to_CANCELLED
        distinguishing_aspect: |
          FeedOrder exhibits BRANCHING fork from SUBMITTED: to VALIDATED
          (forward path) OR to REJECTED (terminal). The branch choice
          produces divergent side-effect sets: VALIDATED creates a
          WithdrawalPlan + debits quota; REJECTED leaves quota untouched.
          Compensating: VALIDATED -> CANCELLED returns quota.
        test_recipe:
          setup:
            - "Full chain to two orders O_A and O_B in SUBMITTED against same VFD A6 (quota 30)"
          setup_api_calls:
            - call: "POST /vfd/clinics"
              payload: { name: "Clinic Six", license_number: "LIC-C6", state_code: "IA" }
              as: Inspector
              captures: { clinic_id: $.data.id }
            - call: "POST /vfd/clinics/${clinic_id}/veterinarians"
              payload: { full_name: "Dr. Fay", license_number: "DVM-6", state_code: "IA" }
              as: Inspector
              captures: { vet_id: $.data.id }
            - call: "POST /vfd/producers"
              payload: { legal_name: "Farm P6", premise_id: "PIN-6", state_code: "IA" }
              as: Inspector
              captures: { producer_id: $.data.id }
            - call: "POST /vfd/producers/${producer_id}/animal-groups"
              payload: { species: "CATTLE", production_class: "BEEF", head_count: 100, average_weight_lbs: 1100, earliest_market_date: "2026-12-01" }
              as: Producer
              as_user_id: "${producer_id}"
              captures: { group_id: $.data.id }
            - call: "POST /vfd/drugs"
              payload: { drug_code: "DRUG-6", label_name: "Med E", withdrawal_hours: 24, allowed_species_classes: ["CATTLE:BEEF"], max_duration_days: 7 }
              as: Inspector
              captures: { drug_id: $.data.id }
            - call: "POST /vfd/vcp-verifications"
              payload: { vet_id: "${vet_id}", producer_id: "${producer_id}", expires_on: "2027-08-01T00:00:00Z" }
