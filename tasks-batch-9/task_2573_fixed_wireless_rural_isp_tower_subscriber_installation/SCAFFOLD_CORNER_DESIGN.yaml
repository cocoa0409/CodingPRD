              as: Subscriber
              as_user_id: "${sub_a}"
              captures: { err_collection: $.data.error_id }
            - call: "GET /subscribers/00000000-0000-0000-0000-000000000000"
              as: Subscriber
              as_user_id: "${sub_a}"
              captures: { err_unknown: $.data.error_id }
          assert:
            - "${own_email} == \"owner.a@example.com\" with HTTP 200 and ${own_wo_count} == 0 - the self reads work"
            - "${err_other_account}, ${err_other_usage} and ${err_other_equipment} are all \"ERR_NOT_RESOURCE_OWNER\" with HTTP 403 - the nested reads are ownership-checked too"
            - "${err_collection} == \"ERR_UNAUTHORIZED\" with HTTP 403 - GET /subscribers is not a Subscriber operation at all, so it is the priority-2 code and not the priority-7 one"
