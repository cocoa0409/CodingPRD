# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Sports Officiating Assignment — Expert band. 9 rules, 20 instances total.
#
# Shared geometry conventions used across recipes:
#  - Official home == game venue (lat 40.0, lon -75.0) => great-circle distance 0
#    => mileage_cents 0 => pay asserts depend only on rank/fee/uplift math, which is
#    earth-radius-independent and fully deterministic.
#  - A wide AVAILABLE window [2026-01-01, 2027-01-01) covers every game interval used.
#  - Clock is pinned via POST /_clock/set_current_utc before time-gated steps.
#  - Every OCC expected_game_version is re-read from a fresh GET /games/{id}
#    immediately before the OCC call, since cascades silently bump Game.version.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_pay_diverge_on_rank_promotion
        grounds:
          - calculations.provisional_game_pay
          - calculations.finalized_settlement_pay
          - state_machines.Assignment.OFFERED_to_ACCEPTED
          - state_machines.Assignment.ACCEPTED_to_COMPLETED
          - entities.Assignment.fields.provisional_pay_cents
          - entities.Assignment.fields.final_pay_cents
        distinguishing_aspect: "Same Assignment, two algorithms on the Assignment domain: provisional freezes rank=CERTIFIED at offer (12500c); finalized reads rank=SENIOR at settle (15000c) — provisional_pay_cents != final_pay_cents."
        test_recipe:
          setup:
            - "League OPEN, base_game_fee_cents=10000, mileage_rate=50."
            - "Official CERTIFIED, home==venue (dist 0), wide AVAILABLE window."
            - "Game regular, 1 ASSISTANT slot, OPEN; offered+accepted while CERTIFIED."
            - "Official promoted CERTIFIED->SENIOR before lock/settle; clock past start at settle."
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "L", sport: "BASKETBALL", base_game_fee_cents: 10000, mileage_rate_cents_per_mile: 50 }
              as: LeagueAdmin
              captures: { lg: $.data.id }
            - call: "POST /leagues/${lg}/activate"
              payload: {}
              as: LeagueAdmin
            - call: "POST /officials"
              payload: { league_id: "${lg}", full_name: "O", rank: "CERTIFIED", home_lat: 40.0, home_lon: -75.0 }
              as: LeagueAdmin
              captures: { off: $.data.id }
            - call: "POST /availabilities"
              payload: { official_id: "${off}", window_start_utc: "2026-01-01T00:00:00Z", window_end_utc: "2027-01-01T00:00:00Z" }
              as: Official
              as_user_id: "${off}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LeagueAdmin
            - call: "POST /games"
              payload: { league_id: "${lg}", home_team: "H", away_team: "A", venue_lat: 40.0, venue_lon: -75.0, start_utc: "2026-06-10T18:00:00Z", required_crew_size: 1 }
              as: Assignor
              captures: { gm: $.data.id }
            - call: "POST /games/${gm}/crew-slots"
              payload: { position: "ASSISTANT" }
              as: Assignor
              captures: { slot: $.data.id }
            - call: "POST /games/${gm}/open"
              payload: {}
              as: Assignor
              captures: { gv1: $.data.version }
            - call: "POST /crew-slots/${slot}/offer"
              payload: { official_id: "${off}", expected_game_version: "${gv1}" }
              as: Assignor
              captures: { asg: $.data.id, prov: $.data.provisional_pay_cents }
            - call: "GET /games/${gm}"
              payload: {}
              as: Assignor
              captures: { gv2: $.data.version }
            - call: "POST /assignments/${asg}/accept"
              payload: { expected_game_version: "${gv2}" }
              as: Official
              as_user_id: "${off}"
            - call: "GET /officials/${off}"
              payload: {}
              as: LeagueAdmin
              captures: { ov1: $.data.version }
            - call: "PATCH /officials/${off}"
              payload: { rank: "SENIOR", expected_official_version: "${ov1}" }
              as: LeagueAdmin
            - call: "GET /games/${gm}"
              payload: {}
              as: Assignor
              captures: { gv3: $.data.version }
            - call: "POST /games/${gm}/lock"
              payload: { expected_game_version: "${gv3}" }
              as: Assignor
              captures: { gv4: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T20:30:00Z" }
              as: LeagueAdmin
          trigger:
            - call: "POST /games/${gm}/settle"
              payload: { expected_game_version: "${gv4}" }
              as: Assignor
          assert:
            - "Assignment.${asg}.provisional_pay_cents == 12500"
            - "Assignment.${asg}.final_pay_cents == 15000"
            - "Assignment.${asg}.final_pay_cents != Assignment.${asg}.provisional_pay_cents"

      - name: eligibility_round_first_vs_average_first_flip
        grounds:
          - calculations.postseason_eligibility
          - entities.Official.fields.postseason_eligible
          - entities.Official.fields.mean_rating
          - state_machines.League.OPEN_to_POSTSEASON
        distinguishing_aspect: "On the Official/League domain (different from Assignment pay): pinned round-per-item-then-average yields mean_rating 3.35 (>= min 3.35 => eligible); the rival average-raw-then-round yields 3.34 (< 3.35 => ineligible) — divergent eligibility from the same two scores."
        test_recipe:
          setup:
            - "League OPEN, postseason_min_games=2, postseason_min_rating=3.35, postseason_max_noshows=0."
            - "Official SENIOR with 2 COMPLETED assignments across 2 settled games (dist 0)."
            - "Evaluations score 3.335 and 3.345 on the two completed assignments."
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "L", sport: "SOCCER", base_game_fee_cents: 10000, mileage_rate_cents_per_mile: 0, postseason_min_games: 2, postseason_min_rating: 3.35, postseason_max_noshows: 0 }
              as: LeagueAdmin
              captures: { lg: $.data.id }
            - call: "POST /leagues/${lg}/activate"
              payload: {}
              as: LeagueAdmin
            - call: "POST /officials"
              payload: { league_id: "${lg}", full_name: "O", rank: "SENIOR", home_lat: 40.0, home_lon: -75.0 }
              as: LeagueAdmin
              captures: { off: $.data.id }
            - call: "POST /availabilities"
              payload: { official_id: "${off}", window_start_utc: "2026-01-01T00:00:00Z", window_end_utc: "2027-01-01T00:00:00Z" }
              as: Official
              as_user_id: "${off}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LeagueAdmin
            - call: "POST /games"
              payload: { league_id: "${lg}", home_team: "H1", away_team: "A1", venue_lat: 40.0, venue_lon: -75.0, start_utc: "2026-06-10T18:00:00Z", required_crew_size: 1 }
              as: Assignor
              captures: { g1: $.data.id }
            - call: "POST /games/${g1}/crew-slots"
              payload: { position: "REFEREE" }
              as: Assignor
              captures: { s1: $.data.id }
            - call: "POST /games/${g1}/open"
              payload: {}
              as: Assignor
              captures: { g1v1: $.data.version }
            - call: "POST /crew-slots/${s1}/offer"
              payload: { official_id: "${off}", expected_game_version: "${g1v1}" }
              as: Assignor
              captures: { a1: $.data.id }
            - call: "GET /games/${g1}"
              payload: {}
              as: Assignor
              captures: { g1v2: $.data.version }
            - call: "POST /assignments/${a1}/accept"
              payload: { expected_game_version: "${g1v2}" }
              as: Official
              as_user_id: "${off}"
            - call: "GET /games/${g1}"
              payload: {}
              as: Assignor
              captures: { g1v3: $.data.version }
            - call: "POST /games/${g1}/lock"
              payload: { expected_game_version: "${g1v3}" }
              as: Assignor
              captures: { g1v4: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T20:30:00Z" }
              as: LeagueAdmin
            - call: "POST /games/${g1}/settle"
              payload: { expected_game_version: "${g1v4}" }
              as: Assignor
            - call: "POST /assignments/${a1}/evaluations"
              payload: { score: 3.335 }
              as: Evaluator
            - call: "POST /games"
              payload: { league_id: "${lg}", home_team: "H2", away_team: "A2", venue_lat: 40.0, venue_lon: -75.0, start_utc: "2026-06-12T18:00:00Z", required_crew_size: 1 }
              as: Assignor
              captures: { g2: $.data.id }
            - call: "POST /games/${g2}/crew-slots"
              payload: { position: "REFEREE" }
              as: Assignor
              captures: { s2: $.data.id }
            - call: "POST /games/${g2}/open"
              payload: {}
              as: Assignor
              captures: { g2v1: $.data.version }
            - call: "POST /crew-slots/${s2}/offer"
              payload: { official_id: "${off}", expected_game_version: "${g2v1}" }
              as: Assignor
              captures: { a2: $.data.id }
            - call: "GET /games/${g2}"
              payload: {}
              as: Assignor
              captures: { g2v2: $.data.version }
            - call: "POST /assignments/${a2}/accept"
              payload: { expected_game_version: "${g2v2}" }
              as: Official
              as_user_id: "${off}"
            - call: "GET /games/${g2}"
              payload: {}
              as: Assignor
              captures: { g2v3: $.data.version }
            - call: "POST /games/${g2}/lock"
              payload: { expected_game_version: "${g2v3}" }
              as: Assignor
              captures: { g2v4: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-12T20:30:00Z" }
              as: LeagueAdmin
            - call: "POST /games/${g2}/settle"
              payload: { expected_game_version: "${g2v4}" }
              as: Assignor
            - call: "POST /assignments/${a2}/evaluations"
              payload: { score: 3.345 }
              as: Evaluator
          trigger:
            - call: "GET /officials/${off}/eligibility"
              payload: {}
              as: LeagueAdmin
              captures: { mr: $.data.mean_rating, elig: $.data.postseason_eligible }
          assert:
            - "Official.${off}.mean_rating == 3.35"
            - "Official.${off}.postseason_eligible == true"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: decline_penalty_nonlinear_leadtime_escalation_postseason
        grounds:
          - calculations.decline_penalty
          - state_machines.Assignment.OFFERED_to_DECLINED
          - entities.Assignment.fields.penalty_assessed_points
        distinguishing_aspect: "Mode (a): three interacting inputs (lead-time tier, prior-decline escalation capped at 3 steps, postseason x2) compose non-linearly — late tier 8 + escalation 0, then x2 postseason = 16, not a sum of independent terms."
        test_recipe:
          setup:
            - "League OPEN with postseason gates relaxed (min_games 0, min_rating 0, max_noshows 99) so a ROOKIE passes the postseason eligibility gate."
            - "Clock 2026-06-10T16:00:00Z; postseason game starting 2026-06-10T18:00:00Z (2h out => late tier)."
            - "ROOKIE official, dist 0, wide availability; ASSISTANT slot offered, then declined immediately (first decline => escalation 0)."
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "L", sport: "HOCKEY", base_game_fee_cents: 10000, mileage_rate_cents_per_mile: 0, postseason_min_games: 0, postseason_min_rating: 0, postseason_max_noshows: 99 }
              as: LeagueAdmin
              captures: { lg: $.data.id }
            - call: "POST /leagues/${lg}/activate"
              payload: {}
              as: LeagueAdmin
            - call: "POST /officials"
              payload: { league_id: "${lg}", full_name: "O", rank: "ROOKIE", home_lat: 40.0, home_lon: -75.0 }
              as: LeagueAdmin
              captures: { off: $.data.id }
            - call: "POST /availabilities"
              payload: { official_id: "${off}", window_start_utc: "2026-01-01T00:00:00Z", window_end_utc: "2027-01-01T00:00:00Z" }
              as: Official
              as_user_id: "${off}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T16:00:00Z" }
              as: LeagueAdmin
            - call: "POST /games"
              payload: { league_id: "${lg}", home_team: "H", away_team: "A", venue_lat: 40.0, venue_lon: -75.0, start_utc: "2026-06-10T18:00:00Z", required_crew_size: 1, is_postseason: true }
              as: Assignor
              captures: { gm: $.data.id }
            - call: "POST /games/${gm}/crew-slots"
              payload: { position: "ASSISTANT" }
              as: Assignor
              captures: { slot: $.data.id }
            - call: "POST /games/${gm}/open"
              payload: {}
              as: Assignor
              captures: { gv1: $.data.version }
            - call: "POST /crew-slots/${slot}/offer"
              payload: { official_id: "${off}", expected_game_version: "${gv1}" }
              as: Assignor
              captures: { asg: $.data.id }
          trigger:
            - call: "POST /assignments/${asg}/decline"
              payload: {}
              as: Official
              as_user_id: "${off}"
          assert:
            - "Assignment.${asg}.penalty_assessed_points == 16"
            - "Assignment.${asg}.status == DECLINED"

      - name: provisional_pay_postseason_uplift_before_mileage_order
        grounds:
          - calculations.provisional_game_pay
          - entities.Game.fields.is_postseason
          - entities.Assignment.fields.provisional_pay_cents
        distinguishing_aspect: "Mode (b): nested order-sensitive arithmetic — postseason uplift is applied to game_pay BEFORE mileage is added (pinned order: base*rank, then *uplift, then +mileage). SENIOR base 10000*1.5=15000, *1.20=18000, mileage 0 => provisional_pay_cents 18000."
        test_recipe:
          setup:
            - "League OPEN, base 10000, mileage 0, postseason gates relaxed; SENIOR official dist 0; postseason game; REFEREE slot."
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "L", sport: "BASKETBALL", base_game_fee_cents: 10000, mileage_rate_cents_per_mile: 0, postseason_min_games: 0, postseason_min_rating: 0, postseason_max_noshows: 99 }
              as: LeagueAdmin
              captures: { lg: $.data.id }
            - call: "POST /leagues/${lg}/activate"
              payload: {}
              as: LeagueAdmin
            - call: "POST /officials"
              payload: { league_id: "${lg}", full_name: "O", rank: "SENIOR", home_lat: 40.0, home_lon: -75.0 }
              as: LeagueAdmin
              captures: { off: $.data.id }
            - call: "POST /availabilities"
              payload: { official_id: "${off}", window_start_utc: "2026-01-01T00:00:00Z", window_end_utc: "2027-01-01T00:00:00Z" }
              as: Official
              as_user_id: "${off}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LeagueAdmin
            - call: "POST /games"
              payload: { league_id: "${lg}", home_team: "H", away_team: "A", venue_lat: 40.0, venue_lon: -75.0, start_utc: "2026-06-20T18:00:00Z", required_crew_size: 1, is_postseason: true }
              as: Assignor
              captures: { gm: $.data.id }
            - call: "POST /games/${gm}/crew-slots"
              payload: { position: "REFEREE" }
              as: Assignor
              captures: { slot: $.data.id }
            - call: "POST /games/${gm}/open"
              payload: {}
              as: Assignor
              captures: { gv1: $.data.version }
          trigger:
            - call: "POST /crew-slots/${slot}/offer"
              payload: { official_id: "${off}", expected_game_version: "${gv1}" }
              as: Assignor
              captures: { asg: $.data.id, prov: $.data.provisional_pay_cents }
          assert:
            - "Assignment.${asg}.provisional_pay_cents == 18000"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: crewslot_cyclic_reoffer_after_decline
        grounds:
          - state_machines.Assignment.OFFERED_to_DECLINED
          - state_machines.CrewSlot.OFFERED_to_VACANT
          - state_machines.CrewSlot.VACANT_to_OFFERED
        distinguishing_aspect: "Cyclic shape on CrewSlot: VACANT->OFFERED->VACANT->OFFERED — a decline returns the slot to VACANT and a fresh offer creates a new Assignment on the SAME slot, unlike a linear pipeline."
        test_recipe:
          setup:
            - "League OPEN; one OPEN regular game with 1 ASSISTANT slot; two ACTIVE officials A and B, dist 0, wide availability."
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "L", sport: "BASKETBALL", base_game_fee_cents: 10000, mileage_rate_cents_per_mile: 0 }
              as: LeagueAdmin
              captures: { lg: $.data.id }
            - call: "POST /leagues/${lg}/activate"
              payload: {}
              as: LeagueAdmin
            - call: "POST /officials"
              payload: { league_id: "${lg}", full_name: "A", rank: "ROOKIE", home_lat: 40.0, home_lon: -75.0 }
              as: LeagueAdmin
              captures: { oa: $.data.id }
            - call: "POST /officials"
              payload: { league_id: "${lg}", full_name: "B", rank: "ROOKIE", home_lat: 40.0, home_lon: -75.0 }
              as: LeagueAdmin
              captures: { ob: $.data.id }
            - call: "POST /availabilities"
              payload: { official_id: "${oa}", window_start_utc: "2026-01-01T00:00:00Z", window_end_utc: "2027-01-01T00:00:00Z" }
              as: Official
              as_user_id: "${oa}"
            - call: "POST /availabilities"
              payload: { official_id: "${ob}", window_start_utc: "2026-01-01T00:00:00Z", window_end_utc: "2027-01-01T00:00:00Z" }
              as: Official
              as_user_id: "${ob}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LeagueAdmin
            - call: "POST /games"
              payload: { league_id: "${lg}", home_team: "H", away_team: "A", venue_lat: 40.0, venue_lon: -75.0, start_utc: "2026-06-20T18:00:00Z", required_crew_size: 1 }
              as: Assignor
              captures: { gm: $.data.id }
            - call: "POST /games/${gm}/crew-slots"
              payload: { position: "ASSISTANT" }
              as: Assignor
              captures: { slot: $.data.id }
            - call: "POST /games/${gm}/open"
              payload: {}
              as: Assignor
              captures: { gv1: $.data.version }
            - call: "POST /crew-slots/${slot}/offer"
              payload: { official_id: "${oa}", expected_game_version: "${gv1}" }
              as: Assignor
              captures: { a1: $.data.id }
            - call: "POST /assignments/${a1}/decline"
              payload: {}
              as: Official
              as_user_id: "${oa}"
          trigger:
            - call: "GET /games/${gm}"
              payload: {}
              as: Assignor
              captures: { gv2: $.data.version }
            - call: "POST /crew-slots/${slot}/offer"
              payload: { official_id: "${ob}", expected_game_version: "${gv2}" }
              as: Assignor
              captures: { a2: $.data.id }
          assert:
            - "CrewSlot.${slot}.status == OFFERED"
            - "CrewSlot.${slot}.current_assignment_id == ${a2}"
            - "Assignment.${a1}.status == DECLINED"
            - "Assignment.${a2}.status == OFFERED"

      - name: game_parallel_dimensions_staffed_bubbles_open_on_withdraw
        grounds:
          - state_machines.Game.OPEN_to_STAFFED
          - state_machines.Game.STAFFED_to_OPEN
          - state_machines.Assignment.ACCEPTED_to_CANCELLED
        distinguishing_aspect: "Auto-bubble cyclic shape on Game (different entity than CrewSlot): the staffing dimension auto-cycles OPEN<->STAFFED driven by crew_filled_count, distinct from the irreversible completion dimension."
        test_recipe:
          setup:
            - "League OPEN; OPEN regular game, 1 ASSISTANT slot; official accepts (game auto-STAFFED), then withdraws (game auto back to OPEN)."
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "L", sport: "SOCCER", base_game_fee_cents: 10000, mileage_rate_cents_per_mile: 0 }
              as: LeagueAdmin
              captures: { lg: $.data.id }
            - call: "POST /leagues/${lg}/activate"
              payload: {}
              as: LeagueAdmin
            - call: "POST /officials"
              payload: { league_id: "${lg}", full_name: "O", rank: "ROOKIE", home_lat: 40.0, home_lon: -75.0 }
              as: LeagueAdmin
              captures: { off: $.data.id }
            - call: "POST /availabilities"
              payload: { official_id: "${off}", window_start_utc: "2026-01-01T00:00:00Z", window_end_utc: "2027-01-01T00:00:00Z" }
              as: Official
              as_user_id: "${off}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LeagueAdmin
            - call: "POST /games"
              payload: { league_id: "${lg}", home_team: "H", away_team: "A", venue_lat: 40.0, venue_lon: -75.0, start_utc: "2026-06-20T18:00:00Z", required_crew_size: 1 }
              as: Assignor
              captures: { gm: $.data.id }
            - call: "POST /games/${gm}/crew-slots"
              payload: { position: "ASSISTANT" }
              as: Assignor
              captures: { slot: $.data.id }
            - call: "POST /games/${gm}/open"
              payload: {}
              as: Assignor
              captures: { gv1: $.data.version }
            - call: "POST /crew-slots/${slot}/offer"
              payload: { official_id: "${off}", expected_game_version: "${gv1}" }
              as: Assignor
              captures: { asg: $.data.id }
            - call: "GET /games/${gm}"
              payload: {}
              as: Assignor
              captures: { gv2: $.data.version }
            - call: "POST /assignments/${asg}/accept"
              payload: { expected_game_version: "${gv2}" }
              as: Official
              as_user_id: "${off}"
          trigger:
            - call: "POST /assignments/${asg}/withdraw"
              payload: {}
              as: Official
              as_user_id: "${off}"
          assert:
            - "Game.${gm}.status == OPEN"
            - "Game.${gm}.crew_filled_count == 0"
            - "CrewSlot.${slot}.status == VACANT"
            - "Assignment.${asg}.status == CANCELLED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: noshow_cascade_assignment_slot_game_depth3
        grounds:
          - state_machines.Assignment.ACCEPTED_to_NO_SHOW
          - state_machines.CrewSlot.FILLED_to_VACANT
          - state_machines.Game.STAFFED_to_OPEN
          - calculations.no_show_penalty
        distinguishing_aspect: "Depth-3 chain from a no-show trigger: Assignment->NO_SHOW mutates CrewSlot FILLED->VACANT, which itself drops crew_filled_count and bubbles Game STAFFED->OPEN — each hop caused by the prior hop."
        test_recipe:
          setup:
            - "League OPEN; regular game, 1 ASSISTANT slot; official accepts (game STAFFED); clock advanced past start so no-show is permitted."
          setup_api_calls:
            - call: "POST /leagues"
