          trigger:
            - call: "POST /deposit-accounts/${acct_id}/deposits"
              payload: { amount_cents: 1 }
              as: PublicUnitTreasurer
              as_user_id: "${unit_id}"
              captures: { err_limit: $.data.error_id }
            - call: "POST /deposit-accounts/${acct_id}/withdrawals"
