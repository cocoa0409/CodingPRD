# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe across §1.1–§1.7. Stubs point to §1.8 instances that already
# cover a corner. Every setup_api_calls chain uses only §1.5 endpoints.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_account_defaults_and_system_fields
        claim_type: defaults
        grounds:
          - entities.Account.fields.tax_rate
          - entities.Account.fields.status
          - entities.Account.fields.tax_exempt_status
          - entities.Account.fields.outstanding_cents
        distinguishing_aspect: "POST /accounts without tax_rate applies default 0.08; system fields initialize status=ACTIVE, tax_exempt_status=NONE, outstanding_cents=0, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "Defaults Co", credit_terms: "NET_30", credit_limit_cents: 50000 }
              as: AccountManager
              captures: { acct_id: $.data.id }
          trigger:
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: WarehouseOps
          assert:
            - "Account.${acct_id}.tax_rate == 0.08"
            - "Account.${acct_id}.status == ACTIVE"
            - "Account.${acct_id}.tax_exempt_status == NONE"
            - "Account.${acct_id}.outstanding_cents == 0"
            - "Account.${acct_id}.version == 1"

      - name: create_product_taxable_defaults_true
        claim_type: defaults
        grounds:
          - entities.Product.fields.taxable
          - entities.Product.fields.needs_reorder
        distinguishing_aspect: "POST /products without taxable defaults to true; needs_reorder computed false when on_hand_qty (20) > reorder_point (5)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "DFLT-1", name: "Ladle", category: "SMALLWARE", unit_price_cents: 400, case_qty: 12, case_price_cents: 4200, pallet_case_qty: 10, pallet_price_cents: 40000, weight_lbs_per_unit: 1, fulfillment_type: "STOCK", freight_type: "PARCEL", on_hand_qty: 20, par_level: 30, reorder_point: 5 }
              as: WarehouseOps
              captures: { prod_id: $.data.id }
          trigger:
            - call: "GET /products/${prod_id}"
              payload: {}
              as: Buyer
          assert:
            - "Product.${prod_id}.taxable == true"
            - "Product.${prod_id}.needs_reorder == false"
            - "Product.${prod_id}.reorder_suggested_qty == 0"

      - name: get_order_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_ORDER_NOT_FOUND]
          - entities.PurchaseOrder
        distinguishing_aspect: "GET /orders/{unknown-uuid} returns ERR_ORDER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: WarehouseOps
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ORDER_NOT_FOUND"

      - name: create_product_missing_sku_invalid_request
        claim_type: required_fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - entities.Product.fields.sku
        distinguishing_aspect: "POST /products omitting required sku returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { name: "No SKU", category: "SMALLWARE", unit_price_cents: 400, case_qty: 12, case_price_cents: 4200, pallet_case_qty: 10, pallet_price_cents: 40000, weight_lbs_per_unit: 1, fulfillment_type: "STOCK", freight_type: "PARCEL", on_hand_qty: 20, par_level: 30, reorder_point: 5 }
              as: WarehouseOps
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: list_products_pagination_envelope
        claim_type: listing
        grounds:
          - entities.Product
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /products?limit=1 with two products returns total_count=2 and has_more=true."
        test_recipe:
          setup: ["Two products exist."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "PG-1", name: "P1", category: "SMALLWARE", unit_price_cents: 100, case_qty: 12, case_price_cents: 1100, pallet_case_qty: 10, pallet_price_cents: 10000, weight_lbs_per_unit: 1, fulfillment_type: "STOCK", freight_type: "PARCEL", on_hand_qty: 10, par_level: 20, reorder_point: 2 }
              as: WarehouseOps
            - call: "POST /products"
              payload: { sku: "PG-2", name: "P2", category: "SMALLWARE", unit_price_cents: 100, case_qty: 12, case_price_cents: 1100, pallet_case_qty: 10, pallet_price_cents: 10000, weight_lbs_per_unit: 1, fulfillment_type: "STOCK", freight_type: "PARCEL", on_hand_qty: 10, par_level: 20, reorder_point: 2 }
              as: WarehouseOps
          trigger:
            - call: "GET /products?limit=1&offset=0"
              payload: {}
              as: Buyer
          assert:
            - "response total_count == 2"
            - "response has_more == true"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: confirm_already_confirmed_order_returns_not_draft
        claim_type: invalid_transition
        grounds:
          - state_machines.PurchaseOrder.DRAFT_to_CONFIRMED
          - errors[ERR_ORDER_NOT_DRAFT]
        distinguishing_aspect: "Re-confirming a CONFIRMED order fails with ERR_ORDER_NOT_DRAFT (state precondition, priority 5) before any OCC/credit check."
        test_recipe:
          setup: ["A CONFIRMED order with one affordable line."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "SM Co", credit_terms: "NET_30", credit_limit_cents: 100000000 }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SM-1", name: "Whisk", category: "SMALLWARE", taxable: true, unit_price_cents: 300, case_qty: 12, case_price_cents: 3200, pallet_case_qty: 10, pallet_price_cents: 30000, weight_lbs_per_unit: 1, fulfillment_type: "STOCK", freight_type: "PARCEL", on_hand_qty: 100, par_level: 50, reorder_point: 5 }
              as: WarehouseOps
              captures: { prod_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acct_id}" }
              as: Buyer
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { product_id: "${prod_id}", quantity: 3 }
              as: Buyer
              as_user_id: "${acct_id}"
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: WarehouseOps
              captures: { cver: $.data.version }
            - call: "POST /orders/${order_id}/confirm"
              payload: { expected_account_version: "${cver}" }
              as: Buyer
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /orders/${order_id}/confirm"
              payload: { expected_account_version: "${cver}" }
              as: Buyer
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ORDER_NOT_DRAFT"

      - name: cancel_cancelled_order_terminal_lockdown
        claim_type: terminal_lockdown
        grounds:
          - state_machines.PurchaseOrder.DRAFT_to_CANCELLED
          - errors[ERR_ORDER_NOT_CANCELLABLE]
        distinguishing_aspect: "Cancelling a CANCELLED (terminal) order fails with ERR_ORDER_NOT_CANCELLABLE."
        test_recipe:
          setup: ["A DRAFT order already cancelled."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "Term Co", credit_terms: "NET_30", credit_limit_cents: 100000 }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acct_id}" }
              as: Buyer
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/cancel"
              payload: {}
              as: Buyer
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              payload: {}
              as: Buyer
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ORDER_NOT_CANCELLABLE"

      - name: reinstate_active_account_returns_not_suspended
        claim_type: invalid_transition
        grounds:
          - state_machines.Account.SUSPENDED_to_ACTIVE
          - errors[ERR_ACCOUNT_NOT_SUSPENDED]
        distinguishing_aspect: "Reinstating an ACTIVE account fails with ERR_ACCOUNT_NOT_SUSPENDED."
        test_recipe:
          setup: ["A newly created ACTIVE account."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "Rein Co", credit_terms: "NET_30", credit_limit_cents: 100000 }
              as: AccountManager
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/reinstate"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ACCOUNT_NOT_SUSPENDED"

      - name: resubmit_submitted_cert_returns_not_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.TaxExemptCertificate.REJECTED_to_SUBMITTED
          - errors[ERR_CERT_NOT_REJECTED]
        distinguishing_aspect: "Resubmitting a still-SUBMITTED certificate fails with ERR_CERT_NOT_REJECTED."
        test_recipe:
          setup: ["An account with a SUBMITTED certificate."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "Cert Co", credit_terms: "NET_30", credit_limit_cents: 100000 }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/tax-certificates"
              payload: { cert_number: "TX-2002", state_code: "TX", expiry_date: "2027-01-01T00:00:00Z" }
              as: Buyer
              as_user_id: "${acct_id}"
              captures: { cert_id: $.data.id }
          trigger:
            - call: "POST /tax-certificates/${cert_id}/resubmit"
              payload: {}
              as: Buyer
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CERT_NOT_REJECTED"

      - name: book_already_booked_shipment_returns_not_quoted
        claim_type: invalid_transition
        grounds:
          - state_machines.Shipment.QUOTED_to_BOOKED
          - errors[ERR_SHIPMENT_NOT_QUOTED]
        distinguishing_aspect: "Booking a shipment that is already BOOKED fails with ERR_SHIPMENT_NOT_QUOTED."
        test_recipe:
          setup: ["A BOOKED shipment on a confirmed order."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "Ship Co", credit_terms: "NET_30", credit_limit_cents: 100000000 }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SHIP-1", name: "Cart", category: "SMALLWARE", taxable: true, unit_price_cents: 5000, case_qty: 4, case_price_cents: 18000, pallet_case_qty: 4, pallet_price_cents: 70000, weight_lbs_per_unit: 10, fulfillment_type: "STOCK", freight_type: "PARCEL", on_hand_qty: 50, par_level: 20, reorder_point: 4 }
              as: WarehouseOps
              captures: { prod_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acct_id}" }
              as: Buyer
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { product_id: "${prod_id}", quantity: 2 }
              as: Buyer
              as_user_id: "${acct_id}"
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: WarehouseOps
              captures: { cver: $.data.version }
            - call: "POST /orders/${order_id}/confirm"
              payload: { expected_account_version: "${cver}" }
              as: Buyer
              as_user_id: "${acct_id}"
            - call: "POST /shipments"
              payload: { order_id: "${order_id}", carrier: "UPS" }
              as: WarehouseOps
              captures: { ship_id: $.data.id }
            - call: "POST /shipments/${ship_id}/book"
              payload: {}
              as: WarehouseOps
          trigger:
            - call: "POST /shipments/${ship_id}/book"
              payload: {}
              as: WarehouseOps
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SHIPMENT_NOT_QUOTED"

      - name: open_return_on_undelivered_order_returns_not_completed
        claim_type: invalid_transition
        grounds:
          - state_machines.PurchaseOrder.SHIPPED_to_COMPLETED
          - errors[ERR_ORDER_NOT_COMPLETED]
        distinguishing_aspect: "Opening an RMA on a CONFIRMED (not yet delivered/COMPLETED) order fails with ERR_ORDER_NOT_COMPLETED."
        test_recipe:
          setup: ["A CONFIRMED order that has not been shipped/delivered."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "Ret Co", credit_terms: "NET_30", credit_limit_cents: 100000000 }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "RET-1", name: "Tongs", category: "SMALLWARE", taxable: true, unit_price_cents: 400, case_qty: 12, case_price_cents: 4200, pallet_case_qty: 10, pallet_price_cents: 40000, weight_lbs_per_unit: 1, fulfillment_type: "STOCK", freight_type: "PARCEL", on_hand_qty: 100, par_level: 50, reorder_point: 5 }
              as: WarehouseOps
              captures: { prod_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acct_id}" }
              as: Buyer
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { product_id: "${prod_id}", quantity: 3 }
              as: Buyer
              as_user_id: "${acct_id}"
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: WarehouseOps
              captures: { cver: $.data.version }
            - call: "POST /orders/${order_id}/confirm"
              payload: { expected_account_version: "${cver}" }
              as: Buyer
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /orders/${order_id}/returns"
              payload: { reason: "Change of mind" }
              as: Buyer
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ORDER_NOT_COMPLETED"

      - name: payment_dimension_advances_independently
        claim_type: side_effect_execution
        grounds:
          - state_machines.PurchaseOrder.CONFIRMED_to_CONFIRMED
          - entities.PurchaseOrder.fields.payment_status
        distinguishing_aspect: "invoice then pay advances payment_status UNPAID->INVOICED->PAID while lifecycle_status stays CONFIRMED (parallel dimension)."
        test_recipe:
          setup: ["A CONFIRMED order."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "Pay Co", credit_terms: "NET_30", credit_limit_cents: 100000000 }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "PAY-1", name: "Peeler", category: "SMALLWARE", taxable: true, unit_price_cents: 200, case_qty: 12, case_price_cents: 2100, pallet_case_qty: 10, pallet_price_cents: 20000, weight_lbs_per_unit: 1, fulfillment_type: "STOCK", freight_type: "PARCEL", on_hand_qty: 100, par_level: 50, reorder_point: 5 }
              as: WarehouseOps
              captures: { prod_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acct_id}" }
              as: Buyer
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { product_id: "${prod_id}", quantity: 3 }
              as: Buyer
              as_user_id: "${acct_id}"
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: WarehouseOps
              captures: { cver: $.data.version }
            - call: "POST /orders/${order_id}/confirm"
              payload: { expected_account_version: "${cver}" }
              as: Buyer
              as_user_id: "${acct_id}"
            - call: "POST /orders/${order_id}/invoice"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /orders/${order_id}/pay"
              payload: {}
              as: Buyer
              as_user_id: "${acct_id}"
          assert:
            - "PurchaseOrder.${order_id}.payment_status == PAID"
            - "PurchaseOrder.${order_id}.lifecycle_status == CONFIRMED"

      - name: clock_advance_expires_approved_certificate
        claim_type: side_effect_execution
        grounds:
          - state_machines.TaxExemptCertificate.APPROVED_to_EXPIRED
          - entities.Account.fields.tax_exempt_status
        distinguishing_aspect: "Advancing the clock past an APPROVED certificate's expiry_date sets cert status EXPIRED and owning Account.tax_exempt_status EXPIRED."
        test_recipe:
          setup: ["Clock 2026-05-01; an account with an APPROVED certificate expiring 2026-06-01."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: WarehouseOps
            - call: "POST /accounts"
              payload: { business_name: "Exp Co", credit_terms: "NET_30", credit_limit_cents: 100000 }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/tax-certificates"
              payload: { cert_number: "TX-3003", state_code: "TX", expiry_date: "2026-06-01T00:00:00Z" }
              as: Buyer
              as_user_id: "${acct_id}"
              captures: { cert_id: $.data.id }
            - call: "POST /tax-certificates/${cert_id}/approve"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: WarehouseOps
          assert:
            - "TaxExemptCertificate.${cert_id}.status == EXPIRED"
            - "Account.${acct_id}.tax_exempt_status == EXPIRED"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: certified_account_order_has_zero_tax
        claim_type: input_set_filtering
        grounds:
          - calculations.order_tax
          - entities.Account.fields.tax_exempt_status
          - state_machines.TaxExemptCertificate.SUBMITTED_to_APPROVED
        distinguishing_aspect: "With an APPROVED certificate (tax_exempt_status CERTIFIED), a taxable line produces tax_cents=0 at confirm."
        test_recipe:
          setup: ["An account whose certificate is APPROVED; a DRAFT order with one taxable line subtotal 5000."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "TaxFree Co", credit_terms: "NET_30", credit_limit_cents: 100000000 }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/tax-certificates"
              payload: { cert_number: "TX-4004", state_code: "TX", expiry_date: "2027-01-01T00:00:00Z" }
              as: Buyer
              as_user_id: "${acct_id}"
              captures: { cert_id: $.data.id }
            - call: "POST /tax-certificates/${cert_id}/approve"
              payload: {}
              as: AccountManager
            - call: "POST /products"
              payload: { sku: "TF-1", name: "Cutting Board", category: "SMALLWARE", taxable: true, unit_price_cents: 1000, case_qty: 100, case_price_cents: 90000, pallet_case_qty: 10, pallet_price_cents: 850000, weight_lbs_per_unit: 2, fulfillment_type: "STOCK", freight_type: "PARCEL", on_hand_qty: 100, par_level: 50, reorder_point: 5 }
              as: WarehouseOps
              captures: { prod_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acct_id}" }
              as: Buyer
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { product_id: "${prod_id}", quantity: 5 }
              as: Buyer
              as_user_id: "${acct_id}"
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: WarehouseOps
              captures: { cver: $.data.version }
          trigger:
            - call: "POST /orders/${order_id}/confirm"
              payload: { expected_account_version: "${cver}" }
              as: Buyer
              as_user_id: "${acct_id}"
          assert:
            - "PurchaseOrder.${order_id}.tax_cents == 0"
            - "PurchaseOrder.${order_id}.total_cents == 5000"

      - name: free_freight_threshold_waives_parcel_base
        claim_type: correct_result
        grounds:
          - calculations.freight_quote
          - entities.Shipment.fields.freight_quote_cents
          - entities.Shipment.fields.shipping_mode
        distinguishing_aspect: "A parcel-weight order (1 lb) with merchandise_subtotal_cents 250000 >= FREE_FREIGHT_THRESHOLD_CENTS waives the parcel base, so freight_quote_cents == 0 and shipping_mode == PARCEL."
        test_recipe:
          setup: ["A CONFIRMED order for a single lightweight high-value item (subtotal 250000)."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "Free Co", credit_terms: "NET_30", credit_limit_cents: 100000000 }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "FF-1", name: "Digital Scale", category: "SMALLWARE", taxable: false, unit_price_cents: 250000, case_qty: 100, case_price_cents: 24000000, pallet_case_qty: 10, pallet_price_cents: 230000000, weight_lbs_per_unit: 1, fulfillment_type: "STOCK", freight_type: "PARCEL", on_hand_qty: 100, par_level: 50, reorder_point: 5 }
              as: WarehouseOps
              captures: { prod_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acct_id}" }
              as: Buyer
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { product_id: "${prod_id}", quantity: 1 }
              as: Buyer
              as_user_id: "${acct_id}"
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: WarehouseOps
              captures: { cver: $.data.version }
            - call: "POST /orders/${order_id}/confirm"
              payload: { expected_account_version: "${cver}" }
              as: Buyer
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /shipments"
              payload: { order_id: "${order_id}", carrier: "UPS" }
              as: WarehouseOps
              captures: { ship_id: $.data.id }
          assert:
            - "Shipment.${ship_id}.shipping_mode == PARCEL"
            - "Shipment.${ship_id}.freight_quote_cents == 0"

      - name: dropship_line_does_not_touch_on_hand
        claim_type: input_set_filtering
        grounds:
          - state_machines.PurchaseOrder.DRAFT_to_CONFIRMED
          - entities.Product.fields.fulfillment_type
          - entities.OrderLine.fields.status
          - entities.OrderLine.fields.allocated_qty
        distinguishing_aspect: "Confirming an order with a DROPSHIP line sets line.status DROPSHIP_PENDING with allocated_qty 0 and leaves Product.on_hand_qty unchanged (0)."
        test_recipe:
          setup: ["A DROPSHIP product with on_hand_qty 0; a DRAFT order with one line qty 5."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "Drop Co", credit_terms: "NET_30", credit_limit_cents: 100000000 }
