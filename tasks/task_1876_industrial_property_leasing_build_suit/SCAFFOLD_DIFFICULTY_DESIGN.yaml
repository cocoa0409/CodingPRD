# =============================================================================
# Task 1876 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x >=2 instances = 19 instances (combinatorial_formula carries 3,
# one per mode a/b/c). All recipes drive empty-DB -> precondition using only
# §1.5 endpoints. Canonical fixtures:
#   REQ_A  (rep-001): Acme Distribution, DISTRIBUTION, 90k-120k SF, ch32/dock16/pw3000/yd150, Inland Empire
#   SITE_A (asking 6.00): Ridge Logistics Center, 200k SF, ch36/dock20/pw4000/yd200
#   SITE_B (asking 13.20): Pacific BTS Site, 200k SF, same specs, Antelope Valley
#   SITE_L (asking 2.00): Victorville Land Bank, LAND_BANK, 500k SF, zeroed specs
#   LOI_A economics: 5yr / 100000 SF / 8.00 rate / 10.00 TI / 6 free / 0.03 esc
#   LOI_B economics: 5yr / 100000 SF / 12.00 rate / 10.00 TI / 6 free / 0.03 esc
# =============================================================================

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: bts_pricing_method_divergence
        grounds:
          - calculations.bts_cost_rent_conversion
          - entities.BuildToSuitPlan.fields.pricing_method
        distinguishing_aspect: |
          Same cost inputs on the same plan produce converted_base_rate_psf 10.25 under
          YIELD_ON_COST and 10.76 under MARKET_COMP (max(asking 6.00, 10.25*1.05=10.76)) —
          dual-variant divergence on the BuildToSuitPlan cost domain.
        test_recipe:
          setup:
            - "EXECUTED LOI_A on SITE_A (200000 SF, asking 6.00) with auto-created SCHEMATIC plan"
            - "plan costs: hard 10000000, soft 2000000, contingency 0.05"
          setup_api_calls:
            - { call: "POST /api/tenant-requirements", payload: { tenant_name: "Acme Distribution", use_type: DISTRIBUTION, min_sf: 90000, max_sf: 120000, min_clear_height_ft: 32, min_dock_doors: 16, min_power_amps: 3000, min_yard_depth_ft: 150, target_submarket: "Inland Empire", required_delivery_date: "2027-01-01T00:00:00Z" }, as: TenantRep, as_user_id: rep-001, captures: { req_id: $.data.id } }
            - { call: "POST /api/sites", payload: { site_name: "Ridge Logistics Center", submarket: "Inland Empire", parcel_type: EXISTING, total_sf: 200000, clear_height_ft: 36, dock_doors: 20, power_amps: 4000, yard_depth_ft: 200, zoning_designation: "M-1", environmental_phase: PHASE_I_COMPLETE, asking_rate_psf: 6.00 }, as: LeasingManager, captures: { site_id: $.data.id } }
            - { call: "POST /api/tours", payload: { site_id: "${site_id}", requirement_id: "${req_id}", start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z" }, as: TenantRep, as_user_id: rep-001, captures: { tour_id: $.data.id } }
            - { call: "POST /api/tours/${tour_id}/confirm", as: LeasingManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T11:00:00Z" }, as: AssetManager }
            - { call: "POST /api/tours/${tour_id}/complete", as: TenantRep, as_user_id: rep-001 }
            - { call: "POST /api/lois", payload: { requirement_id: "${req_id}", site_id: "${site_id}", term_years: 5, leased_sf: 100000, base_rate_psf: 8.00, ti_allowance_psf: 10.00, free_rent_months: 6, escalation_pct: 0.03, commission_basis: GROSS_AGGREGATE }, as: TenantRep, as_user_id: rep-001, captures: { loi_id: $.data.id, loi_v: $.data.version } }
            - { call: "POST /api/lois/${loi_id}/submit", payload: { expected_loi_version: "${loi_v}" }, as: TenantRep, as_user_id: rep-001 }
            - { call: "POST /api/lois/${loi_id}/accept", as: LeasingManager }
            - { call: "POST /api/compliance-reviews", payload: { site_id: "${site_id}", requirement_id: "${req_id}", review_type: ENVIRONMENTAL }, as: ComplianceOfficer, captures: { rev_e: $.data.id } }
            - { call: "POST /api/compliance-reviews/${rev_e}/begin", as: ComplianceOfficer }
            - { call: "POST /api/compliance-reviews/${rev_e}/resolve", payload: { outcome: CLEARED }, as: ComplianceOfficer }
            - { call: "POST /api/compliance-reviews", payload: { site_id: "${site_id}", requirement_id: "${req_id}", review_type: ZONING_USE }, as: ComplianceOfficer, captures: { rev_z: $.data.id } }
            - { call: "POST /api/compliance-reviews/${rev_z}/begin", as: ComplianceOfficer }
            - { call: "POST /api/compliance-reviews/${rev_z}/resolve", payload: { outcome: CLEARED }, as: ComplianceOfficer }
            - { call: "POST /api/lois/${loi_id}/execute", as: AssetManager }
            - { call: "GET /api/bts-plans?loi_id=${loi_id}", as: ProjectManager, captures: { plan_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /api/bts-plans/${plan_id}/price", payload: { hard_cost_total: 10000000, soft_cost_total: 2000000, contingency_pct: 0.05, pricing_method: YIELD_ON_COST }, as: ProjectManager, captures: { rate_yield: $.data.converted_base_rate_psf } }
            - { call: "POST /api/bts-plans/${plan_id}/revise", as: ProjectManager }
            - { call: "POST /api/bts-plans/${plan_id}/price", payload: { hard_cost_total: 10000000, soft_cost_total: 2000000, contingency_pct: 0.05, pricing_method: MARKET_COMP }, as: ProjectManager, captures: { rate_market: $.data.converted_base_rate_psf } }
          assert:
            - "BuildToSuitPlan.${plan_id} after first price: converted_base_rate_psf == 10.25"
            - "BuildToSuitPlan.${plan_id} after MARKET_COMP re-price: converted_base_rate_psf == 10.76"
            - "rate_yield != rate_market with identical hard/soft/contingency inputs"
            - "total_project_cost == 12814064.36 in both variants"

      - name: commission_basis_divergence
        grounds:
          - calculations.broker_commission
          - entities.LOI.fields.commission_basis
        distinguishing_aspect: |
          Identical LOI economics (5yr, 100000 SF, 8.00, TI 10.00, 6 free, 3% esc) produce
          per-side total_commission 68709.63 under GROSS_AGGREGATE (basis 4247308.65) and
          47709.63 under NET_EFFECTIVE (basis 2847308.65) — dual-variant divergence on the
          CommissionInvoice brokerage domain, distinct from the BTS cost domain.
        test_recipe:
          setup:
            - "Two independent executed LOIs with identical economics on two identical sites; LOI-1 commission_basis GROSS_AGGREGATE, LOI-2 NET_EFFECTIVE"
          setup_api_calls:
            - { call: "POST /api/tenant-requirements", payload: { tenant_name: "Acme Distribution", use_type: DISTRIBUTION, min_sf: 90000, max_sf: 120000, min_clear_height_ft: 32, min_dock_doors: 16, min_power_amps: 3000, min_yard_depth_ft: 150, target_submarket: "Inland Empire", required_delivery_date: "2027-01-01T00:00:00Z" }, as: TenantRep, as_user_id: rep-001, captures: { req1: $.data.id } }
            - { call: "POST /api/sites", payload: { site_name: "Ridge Logistics Center", submarket: "Inland Empire", parcel_type: EXISTING, total_sf: 200000, clear_height_ft: 36, dock_doors: 20, power_amps: 4000, yard_depth_ft: 200, zoning_designation: "M-1", environmental_phase: PHASE_I_COMPLETE, asking_rate_psf: 6.00 }, as: LeasingManager, captures: { site1: $.data.id } }
            - { call: "POST /api/tours", payload: { site_id: "${site1}", requirement_id: "${req1}", start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z" }, as: TenantRep, as_user_id: rep-001, captures: { tour1: $.data.id } }
            - { call: "POST /api/tours/${tour1}/confirm", as: LeasingManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T11:00:00Z" }, as: AssetManager }
            - { call: "POST /api/tours/${tour1}/complete", as: TenantRep, as_user_id: rep-001 }
            - { call: "POST /api/lois", payload: { requirement_id: "${req1}", site_id: "${site1}", term_years: 5, leased_sf: 100000, base_rate_psf: 8.00, ti_allowance_psf: 10.00, free_rent_months: 6, escalation_pct: 0.03, commission_basis: GROSS_AGGREGATE }, as: TenantRep, as_user_id: rep-001, captures: { loi1: $.data.id, loi1_v: $.data.version } }
            - { call: "POST /api/lois/${loi1}/submit", payload: { expected_loi_version: "${loi1_v}" }, as: TenantRep, as_user_id: rep-001 }
            - { call: "POST /api/lois/${loi1}/accept", as: LeasingManager }
            - { call: "POST /api/compliance-reviews", payload: { site_id: "${site1}", requirement_id: "${req1}", review_type: ENVIRONMENTAL }, as: ComplianceOfficer, captures: { r1e: $.data.id } }
            - { call: "POST /api/compliance-reviews/${r1e}/begin", as: ComplianceOfficer }
            - { call: "POST /api/compliance-reviews/${r1e}/resolve", payload: { outcome: CLEARED }, as: ComplianceOfficer }
            - { call: "POST /api/compliance-reviews", payload: { site_id: "${site1}", requirement_id: "${req1}", review_type: ZONING_USE }, as: ComplianceOfficer, captures: { r1z: $.data.id } }
            - { call: "POST /api/compliance-reviews/${r1z}/begin", as: ComplianceOfficer }
            - { call: "POST /api/compliance-reviews/${r1z}/resolve", payload: { outcome: CLEARED }, as: ComplianceOfficer }
            - { call: "POST /api/lois/${loi1}/execute", as: AssetManager }
            - { call: "POST /api/tenant-requirements", payload: { tenant_name: "BlueRidge Cold Chain", use_type: COLD_STORAGE, min_sf: 90000, max_sf: 120000, min_clear_height_ft: 32, min_dock_doors: 16, min_power_amps: 3000, min_yard_depth_ft: 150, target_submarket: "Inland Empire", required_delivery_date: "2027-01-01T00:00:00Z" }, as: TenantRep, as_user_id: rep-002, captures: { req2: $.data.id } }
            - { call: "POST /api/sites", payload: { site_name: "Summit Logistics Center", submarket: "Inland Empire", parcel_type: EXISTING, total_sf: 200000, clear_height_ft: 36, dock_doors: 20, power_amps: 4000, yard_depth_ft: 200, zoning_designation: "M-1", environmental_phase: PHASE_I_COMPLETE, asking_rate_psf: 6.00 }, as: LeasingManager, captures: { site2: $.data.id } }
            - { call: "POST /api/tours", payload: { site_id: "${site2}", requirement_id: "${req2}", start_at: "2026-08-10T13:00:00Z", end_at: "2026-08-10T14:00:00Z" }, as: TenantRep, as_user_id: rep-002, captures: { tour2: $.data.id } }
            - { call: "POST /api/tours/${tour2}/confirm", as: LeasingManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T14:00:00Z" }, as: AssetManager }
            - { call: "POST /api/tours/${tour2}/complete", as: TenantRep, as_user_id: rep-002 }
            - { call: "POST /api/lois", payload: { requirement_id: "${req2}", site_id: "${site2}", term_years: 5, leased_sf: 100000, base_rate_psf: 8.00, ti_allowance_psf: 10.00, free_rent_months: 6, escalation_pct: 0.03, commission_basis: NET_EFFECTIVE }, as: TenantRep, as_user_id: rep-002, captures: { loi2: $.data.id, loi2_v: $.data.version } }
            - { call: "POST /api/lois/${loi2}/submit", payload: { expected_loi_version: "${loi2_v}" }, as: TenantRep, as_user_id: rep-002 }
            - { call: "POST /api/lois/${loi2}/accept", as: LeasingManager }
            - { call: "POST /api/compliance-reviews", payload: { site_id: "${site2}", requirement_id: "${req2}", review_type: ENVIRONMENTAL }, as: ComplianceOfficer, captures: { r2e: $.data.id } }
            - { call: "POST /api/compliance-reviews/${r2e}/begin", as: ComplianceOfficer }
            - { call: "POST /api/compliance-reviews/${r2e}/resolve", payload: { outcome: CLEARED }, as: ComplianceOfficer }
            - { call: "POST /api/compliance-reviews", payload: { site_id: "${site2}", requirement_id: "${req2}", review_type: ZONING_USE }, as: ComplianceOfficer, captures: { r2z: $.data.id } }
            - { call: "POST /api/compliance-reviews/${r2z}/begin", as: ComplianceOfficer }
            - { call: "POST /api/compliance-reviews/${r2z}/resolve", payload: { outcome: CLEARED }, as: ComplianceOfficer }
            - { call: "POST /api/lois/${loi2}/execute", as: AssetManager }
          trigger:
            - { call: "GET /api/commission-invoices?loi_id=${loi1}", as: LeasingManager, captures: { inv1_t: "$.data[0].id" } }
            - { call: "GET /api/commission-invoices?loi_id=${loi2}", as: LeasingManager, captures: { inv2_t: "$.data[0].id" } }
          assert:
            - "CommissionInvoice.${inv1_t}: commission_basis_amount == 4247308.65 and total_commission == 68709.63"
            - "CommissionInvoice.${inv2_t}: commission_basis_amount == 2847308.65 and total_commission == 47709.63"
            - "inv1 total_commission - inv2 total_commission == 21000.00 (21000.00 delta per side from identical terms)"

  - rule_id: combinatorial_formula
    instances:
      - name: ner_multi_input_interaction
        grounds:
          - calculations.net_effective_rent
          - validations[priority=25]
        distinguishing_aspect: |
          Mode (a): NER combines >= 5 inputs with non-linear interaction — escalation
          compounding inside aggregate_rent, a nested min() capping TI at 50.00/SF, and a
          credit subtraction before division. Here ti_allowance_psf 75.00 is capped to
          50.00 (credit 5000000.00, not 7500000.00), so NER lands at 6.94 rather than 4.44.
        test_recipe:
          setup:
            - "SITE_C asking 5.00 (accept floor 3.00); requirement REQ_C toured and completed"
            - "LOI_C terms: 10yr, 100000 SF, rate 12.00, esc 0.02, free_rent 12, TI 75.00"
          setup_api_calls:
            - { call: "POST /api/tenant-requirements", payload: { tenant_name: "Coastal R&D", use_type: R_AND_D, min_sf: 90000, max_sf: 120000, min_clear_height_ft: 32, min_dock_doors: 16, min_power_amps: 3000, min_yard_depth_ft: 150, target_submarket: "Inland Empire", required_delivery_date: "2027-01-01T00:00:00Z" }, as: TenantRep, as_user_id: rep-001, captures: { req_id: $.data.id } }
            - { call: "POST /api/sites", payload: { site_name: "Valley Commerce Center", submarket: "Inland Empire", parcel_type: EXISTING, total_sf: 200000, clear_height_ft: 36, dock_doors: 20, power_amps: 4000, yard_depth_ft: 200, zoning_designation: "M-1", environmental_phase: PHASE_I_COMPLETE, asking_rate_psf: 5.00 }, as: LeasingManager, captures: { site_id: $.data.id } }
            - { call: "POST /api/tours", payload: { site_id: "${site_id}", requirement_id: "${req_id}", start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z" }, as: TenantRep, as_user_id: rep-001, captures: { tour_id: $.data.id } }
            - { call: "POST /api/tours/${tour_id}/confirm", as: LeasingManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T11:00:00Z" }, as: AssetManager }
            - { call: "POST /api/tours/${tour_id}/complete", as: TenantRep, as_user_id: rep-001 }
            - { call: "POST /api/lois", payload: { requirement_id: "${req_id}", site_id: "${site_id}", term_years: 10, leased_sf: 100000, base_rate_psf: 12.00, ti_allowance_psf: 75.00, free_rent_months: 12, escalation_pct: 0.02 }, as: TenantRep, as_user_id: rep-001, captures: { loi_id: $.data.id, loi_v: $.data.version } }
          trigger:
            - { call: "POST /api/lois/${loi_id}/submit", payload: { expected_loi_version: "${loi_v}" }, as: TenantRep, as_user_id: rep-001 }
          assert:
            - "LOI.${loi_id}.aggregate_rent_total == 13139665.20 (12.00*100000*(1.02^10-1)/0.02, summed then rounded once)"
            - "LOI.${loi_id}.net_effective_rent_psf == 6.94 (free credit 1200000.00; TI credit capped at 50.00/SF = 5000000.00; NER total 6939665.20 over 10*100000)"

      - name: commission_installment_rounding_order
        grounds:
          - calculations.broker_commission
          - entities.CommissionInvoice.fields.installment_2_amount
        distinguishing_aspect: |
          Mode (b): nested rounding with pinned order — tiers are rounded to cents BEFORE
          summing (25000.00 + 112419.26 = 137419.26), the side split rounds the TENANT_REP
          half (68709.63) with the remainder pinned to LANDLORD_REP, and installment 1 is
          round(0.5*total) = 34354.82 while installment 2 is the remainder 34354.81 — never
          two independently rounded halves (which would drift +0.01).
        test_recipe:
          setup:
            - "EXECUTED LOI_A (GROSS_AGGREGATE) with its two auto-created ACCRUED invoices"
          setup_api_calls:
            - { call: "POST /api/tenant-requirements", payload: { tenant_name: "Acme Distribution", use_type: DISTRIBUTION, min_sf: 90000, max_sf: 120000, min_clear_height_ft: 32, min_dock_doors: 16, min_power_amps: 3000, min_yard_depth_ft: 150, target_submarket: "Inland Empire", required_delivery_date: "2027-01-01T00:00:00Z" }, as: TenantRep, as_user_id: rep-001, captures: { req_id: $.data.id } }
            - { call: "POST /api/sites", payload: { site_name: "Ridge Logistics Center", submarket: "Inland Empire", parcel_type: EXISTING, total_sf: 200000, clear_height_ft: 36, dock_doors: 20, power_amps: 4000, yard_depth_ft: 200, zoning_designation: "M-1", environmental_phase: PHASE_I_COMPLETE, asking_rate_psf: 6.00 }, as: LeasingManager, captures: { site_id: $.data.id } }
            - { call: "POST /api/tours", payload: { site_id: "${site_id}", requirement_id: "${req_id}", start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z" }, as: TenantRep, as_user_id: rep-001, captures: { tour_id: $.data.id } }
            - { call: "POST /api/tours/${tour_id}/confirm", as: LeasingManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T11:00:00Z" }, as: AssetManager }
            - { call: "POST /api/tours/${tour_id}/complete", as: TenantRep, as_user_id: rep-001 }
            - { call: "POST /api/lois", payload: { requirement_id: "${req_id}", site_id: "${site_id}", term_years: 5, leased_sf: 100000, base_rate_psf: 8.00, ti_allowance_psf: 10.00, free_rent_months: 6, escalation_pct: 0.03, commission_basis: GROSS_AGGREGATE }, as: TenantRep, as_user_id: rep-001, captures: { loi_id: $.data.id, loi_v: $.data.version } }
            - { call: "POST /api/lois/${loi_id}/submit", payload: { expected_loi_version: "${loi_v}" }, as: TenantRep, as_user_id: rep-001 }
            - { call: "POST /api/lois/${loi_id}/accept", as: LeasingManager }
            - { call: "POST /api/compliance-reviews", payload: { site_id: "${site_id}", requirement_id: "${req_id}", review_type: ENVIRONMENTAL }, as: ComplianceOfficer, captures: { rev_e: $.data.id } }
            - { call: "POST /api/compliance-reviews/${rev_e}/begin", as: ComplianceOfficer }
            - { call: "POST /api/compliance-reviews/${rev_e}/resolve", payload: { outcome: CLEARED }, as: ComplianceOfficer }
            - { call: "POST /api/compliance-reviews", payload: { site_id: "${site_id}", requirement_id: "${req_id}", review_type: ZONING_USE }, as: ComplianceOfficer, captures: { rev_z: $.data.id } }
            - { call: "POST /api/compliance-reviews/${rev_z}/begin", as: ComplianceOfficer }
            - { call: "POST /api/compliance-reviews/${rev_z}/resolve", payload: { outcome: CLEARED }, as: ComplianceOfficer }
            - { call: "POST /api/lois/${loi_id}/execute", as: AssetManager }
            - { call: "GET /api/commission-invoices?loi_id=${loi_id}", as: LeasingManager, captures: { inv_t: "$.data[0].id", inv_l: "$.data[1].id" } }
          trigger:
            - { call: "GET /api/commission-invoices/${inv_t}", as: LeasingManager }
            - { call: "GET /api/commission-invoices/${inv_l}", as: LeasingManager }
          assert:
            - "TENANT_REP invoice ${inv_t}: total_commission == 68709.63, installment_1_amount == 34354.82, installment_2_amount == 34354.81"
            - "LANDLORD_REP invoice ${inv_l}: total_commission == 68709.63, installment_1_amount == 34354.82, installment_2_amount == 34354.81"
            - "installment_1_amount + installment_2_amount == total_commission exactly on both invoices (34354.82 + 34354.81 == 68709.63)"

      - name: bts_two_pass_circular_order
        grounds:
          - calculations.bts_cost_rent_conversion
          - entities.BuildToSuitPlan.fields.total_project_cost
        distinguishing_aspect: |
          Mode (c): circular-looking dependency (rent needs total cost; total cost includes a
          commission estimated FROM rent) pinned to a two-pass order — commission is estimated
          on the PROVISIONAL rent (10.08) exactly once: total_project_cost == 12814064.36, not
          12600000.00 (no commission) and not 12817674.57 (commission re-iterated on the final
          rent 10.25).
        test_recipe:
          setup:
            - "EXECUTED LOI_A on SITE_A with auto-created SCHEMATIC plan"
          setup_api_calls:
            - { call: "POST /api/tenant-requirements", payload: { tenant_name: "Acme Distribution", use_type: DISTRIBUTION, min_sf: 90000, max_sf: 120000, min_clear_height_ft: 32, min_dock_doors: 16, min_power_amps: 3000, min_yard_depth_ft: 150, target_submarket: "Inland Empire", required_delivery_date: "2027-01-01T00:00:00Z" }, as: TenantRep, as_user_id: rep-001, captures: { req_id: $.data.id } }
            - { call: "POST /api/sites", payload: { site_name: "Ridge Logistics Center", submarket: "Inland Empire", parcel_type: EXISTING, total_sf: 200000, clear_height_ft: 36, dock_doors: 20, power_amps: 4000, yard_depth_ft: 200, zoning_designation: "M-1", environmental_phase: PHASE_I_COMPLETE, asking_rate_psf: 6.00 }, as: LeasingManager, captures: { site_id: $.data.id } }
            - { call: "POST /api/tours", payload: { site_id: "${site_id}", requirement_id: "${req_id}", start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z" }, as: TenantRep, as_user_id: rep-001, captures: { tour_id: $.data.id } }
            - { call: "POST /api/tours/${tour_id}/confirm", as: LeasingManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T11:00:00Z" }, as: AssetManager }
            - { call: "POST /api/tours/${tour_id}/complete", as: TenantRep, as_user_id: rep-001 }
            - { call: "POST /api/lois", payload: { requirement_id: "${req_id}", site_id: "${site_id}", term_years: 5, leased_sf: 100000, base_rate_psf: 8.00, ti_allowance_psf: 10.00, free_rent_months: 6, escalation_pct: 0.03, commission_basis: GROSS_AGGREGATE }, as: TenantRep, as_user_id: rep-001, captures: { loi_id: $.data.id, loi_v: $.data.version } }
            - { call: "POST /api/lois/${loi_id}/submit", payload: { expected_loi_version: "${loi_v}" }, as: TenantRep, as_user_id: rep-001 }
            - { call: "POST /api/lois/${loi_id}/accept", as: LeasingManager }
            - { call: "POST /api/compliance-reviews", payload: { site_id: "${site_id}", requirement_id: "${req_id}", review_type: ENVIRONMENTAL }, as: ComplianceOfficer, captures: { rev_e: $.data.id } }
            - { call: "POST /api/compliance-reviews/${rev_e}/begin", as: ComplianceOfficer }
            - { call: "POST /api/compliance-reviews/${rev_e}/resolve", payload: { outcome: CLEARED }, as: ComplianceOfficer }
            - { call: "POST /api/compliance-reviews", payload: { site_id: "${site_id}", requirement_id: "${req_id}", review_type: ZONING_USE }, as: ComplianceOfficer, captures: { rev_z: $.data.id } }
            - { call: "POST /api/compliance-reviews/${rev_z}/begin", as: ComplianceOfficer }
            - { call: "POST /api/compliance-reviews/${rev_z}/resolve", payload: { outcome: CLEARED }, as: ComplianceOfficer }
