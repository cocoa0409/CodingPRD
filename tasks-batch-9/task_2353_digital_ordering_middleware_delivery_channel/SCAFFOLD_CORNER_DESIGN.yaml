          - errors[ERR_INVALID_STATEMENT_STATE]
          - validations[priority=39]
        distinguishing_aspect: "Both settle and dispute require RECONCILED, so an OPEN statement rejects each of them with the same error while remaining OPEN and empty."
        test_recipe:
          setup:
            - "Channel MARKETMAX exists; clock 2026-08-04T01:00:00Z; an OPEN statement for 2026-08-03 exists with no orders"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T01:00:00Z" }
              as: PlatformAdmin
            - call: "POST /channels"
              payload: { code: "MARKETMAX", name: "MarketMax", channel_type: "MARKETPLACE", markup_bps: 1500, rounding_mode: "NICKEL", service_fee_cents: 299, commission_bps: 2500, settlement_mode: "NET_MODE", eighty_six_policy: "HONOR_86", throttle_policy: "SUPPRESS_ON_THROTTLE", adjustment_review_mode: "CHANNEL_REVIEW", accepts_delivery: true }
              as: PlatformAdmin
