          assert:
            - "err == ERR_ORG_NOT_ACTIVE   # priority 5 state beats priority 14 fiscal, though both fail"

      - name: runner_safety_vs_referential_priority
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - errors[ERR_PUBLIC_REPO_RUNNER_FORBIDDEN]
          - errors[ERR_CROSS_ORG_REFERENCE]
        distinguishing_aspect: |
          business_safety vs business_referential pair: dispatching a
          SELF_HOSTED run on a PUBLIC repository using a runner that belongs to
          a DIFFERENT organization fails both priority 7
          (ERR_PUBLIC_REPO_RUNNER_FORBIDDEN, runner has
          allowed_on_public_repos=false) and priority 11
