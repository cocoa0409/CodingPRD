            - "The advance status == 'ADVANCE_CANCELLED'."

      - name: production_advance_branching_shape_on_critical_denial
        claim_type: branching
        grounds:
          - state_machines.ProductionAdvance.ADVANCE_IN_REVIEW_to_ADVANCE_BLOCKED
          - state_machines.ProductionAdvance.ADVANCE_IN_REVIEW_to_ADVANCE_IN_REVIEW
          - entities.RiderItem.fields.is_critical
        distinguishing_aspect: |
          One trigger (rule) forks on is_critical: DENIED on a critical line branches to
          ADVANCE_BLOCKED with blocked_reason_code DENIED_CRITICAL_ITEM, DENIED on a
          non-critical line stays on the ADVANCE_IN_REVIEW self-loop.
        excluded_because:
          difficulty_instance: production_advance_blocks_then_reverts_via_substitution
          rationale: >-
            That §1.8 instance drives both forks from the same fixture -- it denies the
            non-critical SOUND line (advance stays ADVANCE_IN_REVIEW) and then denies the
            critical STAGING line (advance moves to ADVANCE_BLOCKED with
            blocked_reason_code DENIED_CRITICAL_ITEM) -- so the branching shape is already
            asserted at full strength and a second instance would only restate it.

      - name: advance_complete_guarded_by_open_item_predicates
        claim_type: guarded_transitions
        grounds:
          - state_machines.ProductionAdvance.ADVANCE_IN_REVIEW_to_ADVANCE_COMPLETE
          - state_machines.ProductionAdvance.ADVANCE_BLOCKED_to_ADVANCE_IN_REVIEW
          - errors.ERR_ADVANCE_HAS_OPEN_ITEMS
        distinguishing_aspect: |
          The same source state admits complete only under a conjunction of guards -- no
          RiderItem still REQUESTED and the seed STAGING line APPROVED or SUBSTITUTED --
          and the SUBSTITUTED ruling is itself guarded by substituted_cost_cents <=
          requested_cost_cents.
        excluded_because:
          difficulty_instance: production_advance_blocks_then_reverts_via_substitution
          rationale: >-
            That §1.8 instance walks the guarded arcs end to end: it substitutes the denied
            critical line under the cost guard, watches ADVANCE_BLOCKED revert to
            ADVANCE_IN_REVIEW, and only then completes. Its assertions already pin every
            guard predicate on both arcs.

      - name: show_booking_two_dimension_parallel_shape
        claim_type: parallel
        grounds:
          - state_machines.ShowBooking.SCALED_PENDING_to_SCALED
          - state_machines.ShowBooking.DATE_HELD_to_ANNOUNCED
          - state_machines.ShowBooking.SCALED_to_ON_SALE
        distinguishing_aspect: |
          booking_status and ticketing_status advance independently and ON_SALE is a join:
          whichever of announce and first-scale completes second must fire the
          SCALED -> ON_SALE hop inside its own request, in either interleaving.
        excluded_because:
          difficulty_instance: show_booking_parallel_dimensions_join_to_on_sale
          rationale: >-
            That §1.8 instance runs both interleavings (scale-then-announce and
            announce-then-scale) against the join and asserts ON_SALE appears in the second
            request of each order, which is exactly and only what the parallel shape claims.

      - name: offer_negotiation_cyclic_shape_sent_countered_sent
        claim_type: cyclic
        grounds:
          - state_machines.Offer.SENT_to_COUNTERED
          - state_machines.Offer.COUNTERED_to_SENT
          - errors.ERR_NEGOTIATION_ROUND_LIMIT
        distinguishing_aspect: |
          SENT -> COUNTERED -> SENT is a genuine cycle bounded by round_count, so the
          third round is the last one admitted and the cycle terminates with 409
          ERR_NEGOTIATION_ROUND_LIMIT rather than looping forever.
        excluded_because:
          difficulty_instance: offer_negotiation_cycle_exhausts_round_cap
          rationale: >-
            That §1.8 instance traverses the cycle to exhaustion, asserting round_count
            after each hop and the ERR_NEGOTIATION_ROUND_LIMIT refusal at the cap, which
            subsumes any weaker cyclic-shape probe.

      - name: cancellation_cascade_down_to_riders_and_ledgers
        claim_type: cascade_down
        grounds:
          - state_machines.ShowBooking.ANNOUNCED_to_CANCELLED
          - state_machines.ProductionAdvance.ADVANCE_IN_REVIEW_to_ADVANCE_CANCELLED
          - entities.ShowBooking.fields.recoupable_production_cost_cents
        distinguishing_aspect: |
          One CANCEL walks four hops downward: booking -> advance ADVANCE_CANCELLED ->
          every RiderItem VOIDED with approved_cost_cents 0 -> advance cost ledgers 0 ->
          booking.recoupable_production_cost_cents 0.
        excluded_because:
          difficulty_instance: weather_cancellation_voids_riders_and_zeroes_recoupment
          rationale: >-
            That §1.8 instance asserts every hop of this downward cascade from a fixture
            with a non-zero recoupable rider cost, including the intermediate advance
            ledgers, so re-testing it here would add no discriminating power.

