            - {call: "POST /protests/${pr}/route", payload: {track: HEARING}, as: HearingOfficer, as_user_id: "u-202"}
            - {call: "POST /protests/${pr}/resolve", payload: {outcome: STIPULATE, resolution_note: "Mitigation condition imposed in lieu of an offset.", condition_type: MITIGATION_PAYMENT, compliance_due_date: "2026-12-01T00:00:00Z"}, as: HearingOfficer, as_user_id: "u-202"}
          trigger:
            - {call: "POST /water-rights/${wr}/declare-forfeiture", payload: {finding_note: "Five consecutive non-use years 2018-2022; abandonment found."}, as: BasinAdjudicator, captures: {status_after: "$.data.status"}}
            - {call: "GET /transfer-applications/${app}", as: WaterRightsAnalyst, captures: {app_status: "$.data.status"}}
            - {call: "GET /lease-assignments/${ls}", as: WaterRightsAnalyst, captures: {lease_status: "$.data.status"}}
            - {call: "GET /water-bank-accounts/${acc}", as: WaterRightsAnalyst, captures: {posture_after: "$.data.posture"}}
            - {call: "GET /claimants/${cl_a}", as: WaterRightsAnalyst, captures: {standing_after: "$.data.standing_status"}}
            - {call: "GET /transfer-applications/${app}/approval-conditions", as: WaterRightsAnalyst, captures: {cond_status: "$.data[0].status"}}
            - {call: "POST /water-rights/${wr}/declare-forfeiture", payload: {finding_note: "Second declaration."}, as: BasinAdjudicator, captures: {err_repeat: "$.data.error_id"}}
            - {call: "POST /water-rights/${wr}/reinstate", payload: {reinstatement_note: "Attempt to bring a forfeited right back."}, as: BasinAdjudicator, captures: {err_reinstate: "$.data.error_id"}}
          assert:
            - "Pre-state (worth asserting before the trigger): forfeiture_risk_score 53.75 == round(5*9 + 0.0000*25 + (1 - 0.3750)*30 + 0 - 10, 2) with band ELEVATED and forfeiture_eligible true; the right reads certified_hcu_af 195.00, encumbered_af 110.00 (100.00 escrow + 10.00 bank hold), transferable_af 85.00; the account reads deposited 10.00 / committed 10.00 / available 0.00 with posture RESTRICTED; claimant A is DELINQUENT with outstanding_fee_balance_usd 2600.00."
            - "Link 1: HTTP 200 and the response body already shows status FORFEITED with certified_hcu_af 0.00, encumbered_af 0.00, transferred_away_af 0.00 and transferable_af 0.00 — the zeroed right satisfies its ledger identity trivially rather than being exempted from checking."
            - "Link 2a: the application is DENIED with escrowed_af 0.00 and WaterRight.pending_review_count 0; its FINALIZED InjuryAnalysis is left as it was (net_injury_af 78.00) rather than VOIDED, because voiding is the withdraw path."
            - "Link 2b: the lease is CANCELLED with used_af 0.00 and settlement_credit_af 10.00 (cancellation from RESERVED never charges, whatever the valuation_method), so the account reads committed_credit_af 0.00, leased_out_af 0.00, available_credit_af 10.00 and deposited_credit_af 10.00 — the whole reservation is returned and 10.00 == 10.00 + 0.00 + 0.00."
            - "Link 3: the single ApprovalCondition moves IMPOSED -> RELEASED and OUTSTANDING -> REVERSED; claimant A's outstanding_fee_balance_usd returns to exactly 0.00 and standing_status returns to IN_GOOD_STANDING."
            - "Ordering matters: posture is recomputed only after BOTH the credit return and the standing repair, so the account ends OPEN (available 10.00 >= 5.00, holder in good standing, suspended_lease_count 0). Recomputing posture before the standing repair would leave it RESTRICTED, which is the observable failure mode."
            - "Untouched by design: the protest stays RESOLVED_STIPULATED with stipulated_offset_af 0.00, and the POD stays AUTHORIZED."
            - "FORFEITED is terminal and sticky: the second declare-forfeiture returns HTTP 409 ERR_INVALID_STATE (not a second cascade, and not ERR_FORFEITURE_NOT_ELIGIBLE), and reinstate returns HTTP 409 ERR_INVALID_STATE because the right is not SUSPENDED."
            - "Every entity mutated by the cascade has its version bumped exactly once: WaterRight, TransferApplication, LeaseAssignment, WaterBankAccount, ApprovalCondition and Claimant."

      - name: cross_dual_variant_layer_two_independent_variant_pairs
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.hcu_transferable_volume
          - calculations.lease_settlement_credit
        distinguishing_aspect: >-
          Both variant pairs on identical inputs and the exact delta on switching:
          DIVERSION_BASED versus CIR_BASED consumptive use, and PRO_RATA_DAILY versus
          SEASON_BLOCK lease settlement.
        excluded_because:
          difficulty_instance: hcu_method_variant_divergence
          rationale: >-
            hcu_method_variant_divergence runs both HCU methods over one record set and
            pins the divergence, and lease_settlement_valuation_variant does the same for
            the two valuation methods at one cancellation instant; the corner claim adds
            nothing that those two §1.8 instances do not already assert.

      - name: cross_rate_threshold_layer_headgate_capacity_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers.rate_threshold_triggers
          - calculations.pod_concurrent_rate_load
          - validations[priority=42]
        distinguishing_aspect: >-
          The instantaneous-rate threshold at a headgate, evaluated at equality and one
          thousandth beyond, over the set of leases that actually overlap in time.
        excluded_because:
          difficulty_instance: pod_rate_equality_accepted_one_thousandth_rejected
          rationale: >-
            That §1.8 instance sits exactly on the threshold, and
            pod_half_open_adjacency_and_aggregate proves the half-open overlap set that
            feeds it, so both halves of the layer (boundary and input set) are covered.

      - name: cross_cascading_layer_condition_violation_suspension_chain
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - state_machines.ApprovalCondition
          - state_machines.LeaseAssignment
        distinguishing_aspect: >-
          The second multi-family cascade, which moves in the opposite direction to
          forfeiture: recording a compliance violation suspends the right, freezes the
          funding account and suspends the account's deliveries.
        excluded_because:
          difficulty_instance: condition_violation_suspension_cascade
          rationale: >-
            The §1.8 instance walks that chain link by link, including the FROZEN posture
            and the per-lease resume that is deliberately not automatic, so a second
            end-to-end walk here would be pure duplication.

  - section: consistency_model
    instances:
      - name: consistency_immediate_derived_fields_are_current_in_the_writing_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.right_volume_ledger
          - entities.DecreeDocket.claim_count
        distinguishing_aspect: >-
          No read-after-write lag anywhere: the submit response itself carries the new
          escrow, a GET of the parent right in the very next call already shows the
          decremented transferable bucket, and a docket's claim_count is current in the
          response of the call that created the claim. Nothing in this API is allowed to
          settle asynchronously.
        test_recipe:
