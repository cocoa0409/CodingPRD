          assert:
            - "Trigger 1: HTTP 201; Page.${page_id}.version == ${ver_1} + 1 and current_classification_id == ${cls_1}"
            - "Trigger 2 (replaying ${ver_1}): HTTP 412 and ${e_stale_1} == ERR_STALE_PAGE_VERSION; PageClassification.${cls_1}.review_state is still PENDING_REVIEW, i.e. the refused write did not supersede it"
            - "Trigger 3: HTTP 200; the review bumps the page again, so Page.${page_id}.version == ${ver_1} + 2 - reviews advance the OCC token even though they do not create a classification"
            - "Trigger 4 (replaying ${ver_1} two generations late): HTTP 412 and ${e_stale_2} == ERR_STALE_PAGE_VERSION"
            - "Trigger 5: ${ver_now} == ${ver_1} + 2"
            - "Trigger 6 with the current token: HTTP 201; PageClassification.${cls_1}.review_state becomes SUPERSEDED, Page.${page_id}.current_classification_id == ${cls_2}, classification_state == MODEL_CLASSIFIED and version == ${ver_1} + 3"
            - "GET /page-classifications filtered by page_id == ${page_id} returns total_count == 2 - the two refused writes created nothing"

      - name: campaign_occ_token_advances_on_every_accepted_claim
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[claim-create-stale-campaign]
          - errors[ERR_STALE_CAMPAIGN_VERSION]
          - endpoints[POST /refund-claims]
        distinguishing_aspect: |
          Claim creation is legitimately repeatable, so the guard cannot be a
          state precondition: the second claim is refused only because the
          advertiser's view of the campaign's open-claim exposure is one
          generation old. The fixture files two claims over two different
          batches and shows the middle attempt failing with the pre-first-claim
          token and then succeeding once refreshed - proving the token, not the
          batch, is what moved.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; two pages under one publisher, each carrying a QUARANTINED batch (measured 10000, measurable 6000, in_view 6000 -> coverage 0.6000); the campaign version is captured BEFORE any claim exists."
