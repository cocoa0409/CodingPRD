            - call: "POST /phases"
              payload: { project_id: "${p_priv}", wbs_code: "02-DD", fee_basis: "LUMP_SUM", lump_sum_fee: 200000.00, budget_labor_cost: 60000.00, consultant_budget: 0.00 }
