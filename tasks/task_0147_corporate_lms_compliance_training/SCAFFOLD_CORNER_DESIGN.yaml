# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Corporate LMS & Compliance Training — breadth probe over §1.1-§1.7.
# Every setup_api_calls / trigger call resolves to a §1.5 endpoint; every ${var}
# is captured earlier; path ids carry their ${var}. excluded_because stubs point
# at §1.8 instances by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_course_returns_201_with_system_fields
        claim_type: Creation
        grounds: ["entities.Course", "endpoints"]
        distinguishing_aspect: "POST /courses with all required fields returns 201; response carries server-minted id, status=DRAFT, version=1, created_at."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: ComplianceAdmin
          trigger:
            - call: "POST /courses"
              payload: { code: "C-CREATE", title: "Create", content_type: "SCORM", passing_score: 70 }
              as: ComplianceAdmin
              captures: { c: $.data.id }
          assert:
            - "response.status == 201"
            - "Course.${c}.status == DRAFT"
            - "Course.${c}.version == 1"
            - "Course.${c}.passing_score == 70"

      - name: get_course_not_found_returns_404
        claim_type: Not Found
        grounds: ["entities.Course", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /courses/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /courses/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_course_missing_required_field_returns_400
        claim_type: Required Fields
        grounds: ["entities.Course.fields.passing_score", "errors[ERR_INVALID_REQUEST]", "validations[priority=6]"]
        distinguishing_aspect: "POST /courses omitting required passing_score returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /courses"
              payload: { code: "C-MISS", title: "Miss", content_type: "SCORM" }
              as: ComplianceAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_course_defaults_applied
        claim_type: Defaults
        grounds: ["entities.Course.fields.max_attempts", "entities.Course.fields.grading_policy", "entities.Course.fields.ceu_policy"]
        distinguishing_aspect: "Omitting max_attempts/grading_policy/ceu_policy applies defaults 3 / HIGHEST_SCORE / STANDARD."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /courses"
              payload: { code: "C-DEF", title: "Def", content_type: "SCORM", passing_score: 60 }
              as: ComplianceAdmin
              captures: { c: $.data.id }
          assert:
            - "Course.${c}.max_attempts == 3"
            - "Course.${c}.grading_policy == HIGHEST_SCORE"
            - "Course.${c}.ceu_policy == STANDARD"

      - name: course_invalid_enum_content_type_returns_400
        claim_type: Type Constraints
        grounds: ["entities.Course.fields.content_type", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /courses with content_type not in {SCORM, XAPI} returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /courses"
              payload: { code: "C-ENUM", title: "Enum", content_type: "PDF", passing_score: 70 }
              as: ComplianceAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: duplicate_course_code_returns_409
        claim_type: Type Constraints
        grounds: ["entities.Course.fields.code", "errors[ERR_DUPLICATE]", "validations[priority=17]"]
        distinguishing_aspect: "Creating a second Course with an existing code returns ERR_DUPLICATE (409)."
        test_recipe:
          setup: ["A course with code DUP exists."]
          setup_api_calls:
            - call: "POST /courses"
              payload: { code: "DUP", title: "First", content_type: "SCORM", passing_score: 70 }
              as: ComplianceAdmin
          trigger:
            - call: "POST /courses"
              payload: { code: "DUP", title: "Second", content_type: "XAPI", passing_score: 80 }
              as: ComplianceAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE"

      - name: employee_self_referential_manager_not_found_returns_404
        claim_type: Parent Relationships
        grounds: ["entities.Employee.fields.manager_id", "errors[ERR_NOT_FOUND]", "validations[priority=5]"]
        distinguishing_aspect: "POST /employees with manager_id referencing a non-existent Employee returns ERR_NOT_FOUND (404) (self-referential FK integrity)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /employees"
              payload: { email: "orphan@x.com", full_name: "Orphan", department: "HR", job_role: "IC", manager_id: "00000000-0000-4000-8000-000000000000" }
              as: ComplianceAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: list_courses_pagination_envelope
        claim_type: Listing
        grounds: ["entities.Course", "endpoints", "response_envelope"]
        distinguishing_aspect: "GET /courses returns a paginated array with meta + total_count + has_more honoring limit/offset."
        test_recipe:
          setup: ["Two courses exist."]
          setup_api_calls:
            - call: "POST /courses"
              payload: { code: "PG-1", title: "Pg1", content_type: "SCORM", passing_score: 70 }
              as: ComplianceAdmin
            - call: "POST /courses"
              payload: { code: "PG-2", title: "Pg2", content_type: "SCORM", passing_score: 70 }
              as: ComplianceAdmin
          trigger:
            - call: "GET /courses"
              payload: { limit: 1, offset: 0 }
              as: ComplianceAdmin
          assert:
            - "response.data is an array of length 1"
            - "response.meta.total_count == 2"
            - "response.has_more == true"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: publish_already_published_course_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Course.DRAFT_to_PUBLISHED", "errors[ERR_INVALID_STATE]", "validations[priority=8]"]
        distinguishing_aspect: "POST /courses/{id}/publish on an already-PUBLISHED course returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A PUBLISHED course."]
          setup_api_calls:
            - call: "POST /courses"
              payload: { code: "PUB2", title: "Pub", content_type: "SCORM", passing_score: 70 }
              as: ComplianceAdmin
              captures: { c: $.data.id }
            - call: "POST /courses/${c}/publish"
              payload: {}
              as: ComplianceAdmin
          trigger:
            - call: "POST /courses/${c}/publish"
              payload: {}
              as: ComplianceAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: archive_course_with_open_enrollments_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Course.PUBLISHED_to_ARCHIVED", "errors[ERR_COURSE_HAS_OPEN_ENROLLMENTS]"]
        distinguishing_aspect: "POST /courses/{id}/archive while a NOT_STARTED enrollment exists returns ERR_COURSE_HAS_OPEN_ENROLLMENTS (409)."
        test_recipe:
          setup: ["A PUBLISHED course with one NOT_STARTED enrollment."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: ComplianceAdmin
            - call: "POST /employees"
              payload: { email: "ao@x.com", full_name: "AO", department: "HR", job_role: "IC" }
              as: ComplianceAdmin
              captures: { emp: $.data.id }
            - call: "POST /courses"
              payload: { code: "ARCHO", title: "ArchOpen", content_type: "SCORM", passing_score: 70 }
              as: ComplianceAdmin
              captures: { c: $.data.id }
            - call: "POST /courses/${c}/publish"
              payload: {}
              as: ComplianceAdmin
            - call: "POST /enrollments"
              payload: { employee_id: "${emp}", course_id: "${c}" }
              as: ComplianceAdmin
          trigger:
            - call: "POST /courses/${c}/archive"
              payload: {}
              as: ComplianceAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_COURSE_HAS_OPEN_ENROLLMENTS"

      - name: reopen_non_failed_enrollment_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Enrollment.FAILED_to_IN_PROGRESS", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /enrollments/{id}/reopen on a NOT_STARTED (not FAILED) enrollment returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A NOT_STARTED enrollment on a PUBLISHED course."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: ComplianceAdmin
            - call: "POST /employees"
              payload: { email: "rp@x.com", full_name: "RP", department: "HR", job_role: "IC" }
              as: ComplianceAdmin
              captures: { emp: $.data.id }
            - call: "POST /courses"
              payload: { code: "REOP", title: "Reop", content_type: "SCORM", passing_score: 70 }
              as: ComplianceAdmin
              captures: { c: $.data.id }
            - call: "POST /courses/${c}/publish"
              payload: {}
              as: ComplianceAdmin
            - call: "POST /enrollments"
              payload: { employee_id: "${emp}", course_id: "${c}" }
              as: ComplianceAdmin
              captures: { enr: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr}/reopen"
              payload: {}
              as: ComplianceAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: waived_enrollment_is_terminal_second_start_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Enrollment.NOT_STARTED_to_WAIVED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "After waiving a NOT_STARTED enrollment (terminal WAIVED), POST /enrollments/{id}/start returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A WAIVED enrollment."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: ComplianceAdmin
            - call: "POST /employees"
              payload: { email: "wv@x.com", full_name: "WV", department: "HR", job_role: "IC" }
              as: ComplianceAdmin
              captures: { emp: $.data.id }
            - call: "POST /courses"
              payload: { code: "WAIV", title: "Waiv", content_type: "SCORM", passing_score: 70 }
              as: ComplianceAdmin
              captures: { c: $.data.id }
            - call: "POST /courses/${c}/publish"
              payload: {}
              as: ComplianceAdmin
            - call: "POST /enrollments"
              payload: { employee_id: "${emp}", course_id: "${c}" }
              as: ComplianceAdmin
              captures: { enr: $.data.id }
            - call: "POST /enrollments/${enr}/waive"
              payload: {}
              as: ComplianceAdmin
          trigger:
            - call: "POST /enrollments/${enr}/start"
              payload: {}
              as: Learner
              as_user_id: "${emp}"
              captures: { err: $.data.error_id }
          assert:
            - "Enrollment.${enr}.status == WAIVED"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: newly_created_enrollment_initial_state_not_started
        claim_type: Initial State
        grounds: ["state_machines.Enrollment", "entities.Enrollment.fields.status"]
        distinguishing_aspect: "A freshly created Enrollment starts in NOT_STARTED with cycle_index 1 and attempts_used 0."
        test_recipe:
          setup: ["A PUBLISHED course."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: ComplianceAdmin
            - call: "POST /employees"
              payload: { email: "in@x.com", full_name: "IN", department: "HR", job_role: "IC" }
              as: ComplianceAdmin
              captures: { emp: $.data.id }
            - call: "POST /courses"
              payload: { code: "INIT", title: "Init", content_type: "SCORM", passing_score: 70 }
              as: ComplianceAdmin
              captures: { c: $.data.id }
            - call: "POST /courses/${c}/publish"
              payload: {}
              as: ComplianceAdmin
          trigger:
            - call: "POST /enrollments"
              payload: { employee_id: "${emp}", course_id: "${c}" }
              as: ComplianceAdmin
              captures: { enr: $.data.id }
          assert:
            - "Enrollment.${enr}.status == NOT_STARTED"
            - "Enrollment.${enr}.cycle_index == 1"
            - "Enrollment.${enr}.attempts_used == 0"

      - name: tracking_session_commit_self_loop_accumulates
        claim_type: Valid Transition
        grounds: ["state_machines.TrackingSession.RUNNING_to_RUNNING", "entities.TrackingSession.fields.progress_pct"]
        distinguishing_aspect: "PATCH /tracking-sessions/{id}/commit twice keeps status RUNNING and updates progress_pct to the latest committed value (cyclic self-loop)."
        test_recipe:
          setup: ["A started enrollment with an open tracking session."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: ComplianceAdmin
            - call: "POST /employees"
              payload: { email: "ts@x.com", full_name: "TS", department: "HR", job_role: "IC" }
              as: ComplianceAdmin
              captures: { emp: $.data.id }
            - call: "POST /courses"
              payload: { code: "TSC", title: "Tsc", content_type: "SCORM", passing_score: 70 }
              as: ComplianceAdmin
              captures: { c: $.data.id }
            - call: "POST /courses/${c}/publish"
              payload: {}
              as: ComplianceAdmin
            - call: "POST /enrollments"
              payload: { employee_id: "${emp}", course_id: "${c}" }
              as: ComplianceAdmin
              captures: { enr: $.data.id }
            - call: "POST /enrollments/${enr}/start"
              payload: {}
              as: Learner
              as_user_id: "${emp}"
            - call: "POST /enrollments/${enr}/tracking-sessions"
              payload: {}
              as: Learner
              as_user_id: "${emp}"
              captures: { sess: $.data.id }
            - call: "PATCH /tracking-sessions/${sess}/commit"
              payload: { lesson_status: "INCOMPLETE", progress_pct: 30 }
              as: Learner
              as_user_id: "${emp}"
          trigger:
            - call: "PATCH /tracking-sessions/${sess}/commit"
              payload: { lesson_status: "INCOMPLETE", progress_pct: 75 }
              as: Learner
              as_user_id: "${emp}"
              captures: { p: $.data.progress_pct }
          assert:
            - "TrackingSession.${sess}.status == RUNNING"
            - "TrackingSession.${sess}.progress_pct == 75"

      - name: enrollment_failed_to_in_progress_retry_cycle_stub
        claim_type: Valid Transition
        grounds: ["state_machines.Enrollment.FAILED_to_IN_PROGRESS"]
        excluded_because:
          difficulty_instance: enrollment_failed_to_in_progress_retry_cycle
          rationale: "The FAILED->IN_PROGRESS retry cycle is the named §1.8 non_linear_state_machine instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: ceu_standard_full_credit_on_pass
        claim_type: Correct Result
        grounds: ["calculations.ceu_accrual", "entities.Course.fields.ceu_policy", "entities.Certificate.fields.ceu_credited"]
        distinguishing_aspect: "STANDARD ceu_policy credits the full ceu_credits (5.00) regardless of score on completion — the variant counterpart to the §1.8 SCORE_WEIGHTED instance."
        test_recipe:
          setup: ["A STANDARD course ceu_credits 5.00 PUBLISHED; learner enrolled+started."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: ComplianceAdmin
            - call: "POST /employees"
              payload: { email: "cs@x.com", full_name: "CS", department: "HR", job_role: "IC" }
              as: ComplianceAdmin
              captures: { emp: $.data.id }
            - call: "POST /courses"
              payload: { code: "STD5", title: "Std5", content_type: "SCORM", passing_score: 70, ceu_credits: 5.00, ceu_policy: "STANDARD" }
              as: ComplianceAdmin
              captures: { c: $.data.id }
            - call: "POST /courses/${c}/publish"
              payload: {}
              as: ComplianceAdmin
            - call: "POST /enrollments"
              payload: { employee_id: "${emp}", course_id: "${c}", is_required: true }
              as: ComplianceAdmin
              captures: { enr: $.data.id }
            - call: "POST /enrollments/${enr}/start"
              payload: {}
              as: Learner
              as_user_id: "${emp}"
              captures: { enr_v2: $.data.version }
          trigger:
            - call: "POST /enrollments/${enr}/quiz-attempts"
              payload: { score: 72, expected_enrollment_version: "${enr_v2}" }
              as: Learner
              as_user_id: "${emp}"
            - call: "GET /certificates"
              payload: { enrollment_id: "${enr}" }
              as: ComplianceAdmin
              captures: { cert: "$.data[0].id" }
          assert:
            - "Certificate.${cert}.ceu_credited == 5.00"
            - "Employee.${emp}.total_ceu_earned == 5.00"

      - name: final_grade_highest_score_variant_correct
        claim_type: Variant Selection
        grounds: ["calculations.final_grade", "entities.Course.fields.grading_policy", "entities.Enrollment.fields.final_grade"]
        distinguishing_aspect: "HIGHEST_SCORE grading: with attempts 60(fail) then 90(pass) the completing final_grade is 90 (max) — the variant counterpart to the §1.8 LATEST_ATTEMPT instance."
        test_recipe:
          setup: ["HIGHEST_SCORE course passing_score 70 max_attempts 3 PUBLISHED; learner started; one failing attempt (60) recorded."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: ComplianceAdmin
            - call: "POST /employees"
              payload: { email: "hg@x.com", full_name: "HG", department: "HR", job_role: "IC" }
              as: ComplianceAdmin
              captures: { emp: $.data.id }
            - call: "POST /courses"
              payload: { code: "HIGH", title: "High", content_type: "SCORM", passing_score: 70, max_attempts: 3, grading_policy: "HIGHEST_SCORE" }
              as: ComplianceAdmin
              captures: { c: $.data.id }
            - call: "POST /courses/${c}/publish"
              payload: {}
              as: ComplianceAdmin
            - call: "POST /enrollments"
              payload: { employee_id: "${emp}", course_id: "${c}" }
              as: ComplianceAdmin
              captures: { enr: $.data.id }
            - call: "POST /enrollments/${enr}/start"
              payload: {}
              as: Learner
              as_user_id: "${emp}"
              captures: { enr_v2: $.data.version }
            - call: "POST /enrollments/${enr}/quiz-attempts"
              payload: { score: 60, expected_enrollment_version: "${enr_v2}" }
              as: Learner
              as_user_id: "${emp}"
            - call: "GET /enrollments/${enr}"
              payload: {}
              as: Learner
              as_user_id: "${emp}"
              captures: { enr_v3: $.data.version }
          trigger:
            - call: "POST /enrollments/${enr}/quiz-attempts"
              payload: { score: 90, expected_enrollment_version: "${enr_v3}" }
              as: Learner
              as_user_id: "${emp}"
          assert:
            - "Enrollment.${enr}.status == COMPLETED"
            - "Enrollment.${enr}.final_grade == 90"
            - "Enrollment.${enr}.best_score == 90"

      - name: path_progress_round_then_sum_divergence_stub
        claim_type: Variant Divergence
        grounds: ["calculations.path_progress_pct"]
        excluded_because:
          difficulty_instance: path_progress_rounding_order_pinned_sum_then_round
          rationale: "Sum-then-round vs round-then-sum divergence (66.67) is the named §1.8 combinatorial_formula instance."

      - name: escalation_tier_threshold_stub
        claim_type: Constants Applied
        grounds: ["calculations.escalation_tier"]
        excluded_because:
          difficulty_instance: escalation_tier_boundary_seven_vs_eight_days_on_escalations_run
          rationale: "Tier day-count thresholds (7 vs 8) are the named §1.8 boundary_precision_check instance."

  # ===========================================================================
  - section: validations
    instances:
      - name: publish_recurring_course_without_recurrence_months_returns_409
        claim_type: Violation to Error
        grounds: ["state_machines.Course.DRAFT_to_PUBLISHED", "errors[ERR_RECURRENCE_CONFIG_INVALID]"]
        distinguishing_aspect: "Publishing a course with is_recurring=true but no recurrence_months returns ERR_RECURRENCE_CONFIG_INVALID (409)."
        test_recipe:
          setup: ["A DRAFT course is_recurring=true with recurrence_months omitted."]
          setup_api_calls:
            - call: "POST /courses"
              payload: { code: "RECBAD", title: "RecBad", content_type: "SCORM", passing_score: 70, is_recurring: true }
              as: ComplianceAdmin
              captures: { c: $.data.id }
          trigger:
            - call: "POST /courses/${c}/publish"
              payload: {}
              as: ComplianceAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_RECURRENCE_CONFIG_INVALID"

      - name: publish_empty_path_returns_409
        claim_type: Violation to Error
        grounds: ["state_machines.LearningPath.DRAFT_to_PUBLISHED", "errors[ERR_PATH_EMPTY]"]
        distinguishing_aspect: "Publishing a LearningPath with zero steps returns ERR_PATH_EMPTY (409)."
        test_recipe:
          setup: ["A DRAFT path with no steps."]
          setup_api_calls:
            - call: "POST /learning-paths"
              payload: { code: "EMPTYP", title: "Empty", enforce_sequence: true }
              as: ComplianceAdmin
              captures: { lp: $.data.id }
          trigger:
            - call: "POST /learning-paths/${lp}/publish"
              payload: {}
              as: ComplianceAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_PATH_EMPTY"

      - name: publish_path_with_noncontiguous_sequence_returns_409
        claim_type: Violation to Error
        grounds: ["state_machines.LearningPath.DRAFT_to_PUBLISHED", "errors[ERR_PATH_SEQUENCE_INVALID]"]
        distinguishing_aspect: "Publishing a path whose steps are sequenced 1,3 (gap) returns ERR_PATH_SEQUENCE_INVALID (409)."
        test_recipe:
          setup: ["A DRAFT path with two steps at sequence_index 1 and 3 over PUBLISHED courses."]
          setup_api_calls:
            - call: "POST /courses"
              payload: { code: "SQ1", title: "Sq1", content_type: "SCORM", passing_score: 70 }
              as: ComplianceAdmin
              captures: { ca: $.data.id }
            - call: "POST /courses/${ca}/publish"
              payload: {}
              as: ComplianceAdmin
            - call: "POST /courses"
              payload: { code: "SQ2", title: "Sq2", content_type: "SCORM", passing_score: 70 }
              as: ComplianceAdmin
              captures: { cb: $.data.id }
            - call: "POST /courses/${cb}/publish"
              payload: {}
              as: ComplianceAdmin
