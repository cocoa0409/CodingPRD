  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: report_submit_cascades_to_shipment_and_blocks_install
        grounds:
          - state_machines.ConditionReport.DRAFT_to_SUBMITTED
          - state_machines.Shipment.RECEIVED_to_DAMAGE_HOLD
          - validations[priority=5]
        distinguishing_aspect: |
          Depth-3 cascade: ConditionReport SUBMIT (A) computes composite_score
          (B field mutation); score < 70 flips Shipment RECEIVED -> DAMAGE_HOLD
          (C entity mutation); DAMAGE_HOLD in turn blocks TourStop BEGIN_INSTALL
          (D gate). Each link is caused by the previous link.
        test_recipe:
          setup:
            - "Shipment RECEIVED; stop CONTRACTED with certificate issued; low-quality crate about to be reported"
          setup_api_calls:
            - call: "POST /tours"
              payload: { title: "Pottery", exhibit_code: "POTT-2026", crate_count: 1, declared_value_cents: 3000000, refurbishment_gap_days: 2 }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/crates"
              payload: { crate_label: "CRATE-01", contents_value_cents: 3000000 }
              as: TourManager
              captures: { crate_id: $.data.id }
            - call: "POST /tours/${tour_id}/transition"
              payload: { action: "OPEN_BOOKING" }
              as: TourManager
            - call: "POST /venues"
              payload: { name: "Clay Center", city: "Asheville", climate_controlled: true, max_gallery_sqm: 800, local_sponsorship_cap_cents: 0 }
              as: TourManager
              captures: { venue_id: $.data.id }
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tour_v: $.data.version }
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", install_start: "2026-09-01T00:00:00Z", open_date: "2026-09-04T00:00:00Z", close_date: "2026-10-04T00:00:00Z", teardown_end: "2026-10-07T00:00:00Z", projected_attendance: 6000, expected_tour_version: "${tour_v}" }
              as: TourManager
              captures: { stop_id: $.data.id }
            - call: "POST /tours/${tour_id}/stops/${stop_id}/contract"
              payload: { base_fee_cents: 400000, sponsorship_credit_cents: 0 }
              as: TourManager
            - call: "POST /tours/${tour_id}/stops/${stop_id}/contract/transition"
              payload: { action: "SEND" }
              as: TourManager
            - call: "POST /tours/${tour_id}/stops/${stop_id}/contract/transition"
              payload: { action: "SIGN" }
              as: VenueRegistrar
            - call: "POST /tours/${tour_id}/certificates"
              payload: { tour_stop_id: "${stop_id}", insurer_name: "Axis", coverage_cents: 3000000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z" }
              as: Insurer
            - call: "POST /tours/${tour_id}/shipments"
              payload: { origin_stop_id: null, destination_stop_id: "${stop_id}", depart_at: "2026-08-20T00:00:00Z", arrive_at: "2026-08-28T00:00:00Z", carrier_name: "Carrier X", crate_ids: ["${crate_id}"] }
              as: TourManager
              captures: { ship_id: $.data.id }
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/transition"
              payload: { action: "DISPATCH" }
              as: Shipper
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/transition"
              payload: { action: "DEPART" }
              as: Shipper
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/transition"
              payload: { action: "RECEIVE" }
              as: Registrar
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/reports"
              payload: { crate_id: "${crate_id}", inspector_name: "Reg", phase: "UNPACK", surface_score: 60, structural_score: 50, seal_intact: true }
              as: Registrar
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/reports/${rep_id}/transition"
              payload: { action: "SUBMIT" }
              as: Registrar
            - call: "POST /tours/${tour_id}/stops/${stop_id}/transition"
              payload: { action: "BEGIN_INSTALL" }
              as: TourManager
              captures: { install_err: $.data.error_id }
          assert:
            - "ConditionReport.${rep_id}.composite_score == 54"
            - "Shipment.${ship_id}.status == DAMAGE_HOLD"
            - "BEGIN_INSTALL rejected with error_id == ERR_INVALID_STATE (inbound shipment not in {RECEIVED, CLEARED})"

      - name: tour_retire_cascades_stop_contract_marketing_certificate
        grounds:
          - state_machines.Tour.BOOKING_to_RETIRED
          - state_machines.TourStop.TENTATIVE_to_CANCELLED
          - state_machines.ParticipationContract.DRAFT_to_FINALIZED
        distinguishing_aspect: |
          Different trigger (tour RETIRE, depth >= 3): Tour BOOKING -> RETIRED
          cancels TENTATIVE stops (link 1); each cancelled stop FINALIZES its
          DRAFT contract with final_fee_cents=0 (link 2); retirement also VOIDs
          ISSUED certificates and RETIREs PLANNED marketing kits (link 3).
        test_recipe:
          setup:
            - "Tour T in BOOKING with one TENTATIVE stop S, a DRAFT contract on S, a PLANNED marketing kit, and an ISSUED certificate"
          setup_api_calls:
            - call: "POST /tours"
              payload: { title: "Posters", exhibit_code: "POST-2026", crate_count: 1, declared_value_cents: 500000, refurbishment_gap_days: 2 }
              as: TourManager
              captures: { tour_id: $.data.id }
