  # ===========================================================================
  # Rule 6 — boundary_precision_check: exact-precision boundaries on DIFFERENT
  # metrics, reachable through DISTINCT endpoints.
  # Instance 1: numeric ratio threshold — EMTrip reviewed_pct 0.2999 stays
  # IN_REVIEW, 0.3000 promotes to REVIEWED (endpoint: record-review).
  # Instance 2: integer cap boundary — observer commitment cap: S + planned
  # == 90 ALLOWED, == 91 REJECTED (endpoint: POST /deployments).
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: em_reviewed_pct_02999_stays_03000_promotes
        grounds:
          - calculations.em_review_progress_calculation
          - state_machines.EMTrip.IN_REVIEW_to_IN_REVIEW
          - state_machines.EMTrip.IN_REVIEW_to_REVIEWED
          - errors[ERR_EM_REVIEW_MIN_NOT_MET]
        distinguishing_aspect: |
          Numeric ratio boundary on the reviewed_pct metric via the record-review
          endpoint: with video_hours == 100.00, recording 29.99 reviewed hours
          yields reviewed_pct 0.2999 and the trip STAYS IN_REVIEW; recording one
          more 0.01-hour increment reaches 30.00 hours -> reviewed_pct 0.3000 and
          the trip AUTO-PROMOTES to REVIEWED (>= is inclusive at exactly 0.3000).
          An accept attempt while still at 0.2999 fails ERR_EM_REVIEW_MIN_NOT_MET.
        test_recipe:
          setup:
            - "Fishery F, operator OP, vessel V ACTIVE in ELECTRONIC_MONITORING mode (enrollment approved+activated)"
            - "EMReviewer R ACTIVE"
            - "EMTrip T 2026-10-01..2026-10-08 DECLARED, footage 100.00 hours submitted, reviewer assigned (IN_REVIEW)"
          setup_api_calls:
            - call: "POST /observer-program/fisheries"
              payload: { code: "BSAI-BP1", name: "BSAI Boundary 1", region: "Bering Sea", coverage_target_pct: 0.30, priority_gear: "TRAWL" }
              as: ProgramAdmin
              captures: { fish_id: $.data.id }
            - call: "POST /observer-program/vessel-operators"
              payload: { legal_name: "Bp1 Ops LLC", license_number: "LIC-BP1-1", contact_person_ref: "person-bp1-op" }
              as: ProgramAdmin
              captures: { op_id: $.data.id }
            - call: "POST /observer-program/vessels"
              payload: { operator_id: "${op_id}", fishery_id: "${fish_id}", vessel_name: "FV Bp1", permit_number: "PERMIT-BP1", home_port: "Kodiak", length_ft: 50, gear_type: "TRAWL" }
              as: VesselOperator
              as_user_id: "${op_id}"
              captures: { v_id: $.data.id }
            - call: "PATCH /observer-program/vessels/${v_id}"
              payload: { status: "ACTIVE" }
              as: ProgramAdmin
            - call: "POST /observer-program/em-enrollments"
              payload: { vessel_id: "${v_id}", equipment_vendor: "DeckCam Inc", equipment_install_date: "2026-08-15T00:00:00Z" }
              as: VesselOperator
              as_user_id: "${op_id}"
              captures: { em_id: $.data.id }
            - call: "POST /observer-program/em-enrollments/${em_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /observer-program/em-enrollments/${em_id}/activate"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /observer-program/em-reviewers"
              payload: { person_ref: "person-bp1-rev", full_name: "Rex Reviewer" }
              as: ProgramAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /observer-program/em-trips"
              payload: { vessel_id: "${v_id}", departure_date: "2026-10-01T00:00:00Z", return_date: "2026-10-08T00:00:00Z" }
              as: VesselOperator
              as_user_id: "${op_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /observer-program/em-trips/${trip_id}/submit-footage"
              payload: { video_hours: 100.00 }
              as: VesselOperator
              as_user_id: "${op_id}"
            - call: "POST /observer-program/em-trips/${trip_id}/assign-reviewer"
              payload: { reviewer_id: "${rev_id}" }
              as: ProgramCoordinator
          trigger:
            - call: "POST /observer-program/em-trips/${trip_id}/record-review"
              payload: { additional_reviewed_hours: 29.99, sampled_catch_kg_delta: 50.00 }
              as: EMReviewer
              as_user_id: "${rev_id}"
              captures: { pct1: $.data.reviewed_pct, st1: $.data.status }
            - call: "POST /observer-program/em-trips/${trip_id}/accept"
              payload: {}
              as: ProgramCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /observer-program/em-trips/${trip_id}/record-review"
              payload: { additional_reviewed_hours: 0.01, sampled_catch_kg_delta: 0.00 }
              as: EMReviewer
              as_user_id: "${rev_id}"
              captures: { pct2: $.data.reviewed_pct, st2: $.data.status }
          assert:
            - "After 29.99 hours: EMTrip.${trip_id}.reviewed_pct == 0.2999 and status == IN_REVIEW (below threshold)"
            - "Accept at reviewed_pct 0.2999 fails with ERR_EM_REVIEW_MIN_NOT_MET (409)"
            - "After +0.01 hours (total 30.00): EMTrip.${trip_id}.reviewed_pct == 0.3000 and status == REVIEWED (inclusive >= boundary promotes)"
            - "EMTrip.${trip_id}.reviewed_hours == 30.00 exactly at the promotion boundary"

      - name: observer_commitment_cap_90_allowed_91_rejected
        grounds:
          - calculations.observer_capacity_check
          - errors[ERR_OBSERVER_COMMITMENT_CAP_EXCEEDED]
          - entities.Observer.fields.max_consecutive_sea_days
        distinguishing_aspect: |
          Integer cumulative-cap boundary on the observer commitment metric via
          the deployment-create endpoint: with an existing commitment of 60
          planned days, a new 30-day deployment brings the sum to EXACTLY 90 and
          is ALLOWED (equality is allowed per observer_capacity_check), while any
          further deployment (e.g. 31 days) exceeds 90 and is REJECTED with
          ERR_OBSERVER_COMMITMENT_CAP_EXCEEDED. Different metric (integer day
