      - name: household_screening_blocked_while_parent_program_posture_is_frozen
        entity_pair: "ApplicantHousehold (dependent) -> AffiliateProgram (governing)"
        grounds:
          - state_machines.ApplicantHousehold.selection_status.SUBMITTED_to_SCREENING
          - validations[priority=12]
          - errors.ERR_PROGRAM_FROZEN
          - entities.AffiliateProgram.fields.program_posture
          - entities.AffiliateProgram.fields.status
          - entities.ApplicantHousehold.fields.selection_status
          - entities.ApplicantHousehold.fields.score_basis
          - calculations.household_selection_scoring
          - concurrency_rules[subsidy-pool-adjust-stale-program]
        distinguishing_aspect: |
          A different entity pair from the MortgageApplication -> BuildSite
          instance above, and a different governing field: the
          ApplicantHousehold SUBMITTED -> SCREENING transition lists its
          preconditions verbatim as "selection_status == SUBMITTED" and
          "AffiliateProgram.program_posture != FROZEN". The household side is
          held constant at SUBMITTED across both probes while only the parent
          program moves: SUSPEND_PROGRAM drives status SUSPENDED and
          program_posture FROZEN, so the identical screen call is refused with
          ERR_PROGRAM_FROZEN at priority 12 and the household stays SUBMITTED
          with score_basis still null; RESUME_PROGRAM returns status ACTIVE and
          posture OPEN (subsidy_available_cents 5000000 > 0 and no obligations
          booked), after which the same screen call succeeds. The PRELIMINARY
          scores it then writes are pre-computed from the self-reported basis:
          monthly_gross = floor(3600000/12) = 300000; cost_burden_ratio =
          round(150000/300000, 4) = 0.5 which is >= 0.5 so 40 points;
          persons_per_bedroom = 4 / max(1, 1) = 4.0 which is >= 2.0 so 30
          points; habitability_deficiency_count 3 >= 2 so 30 points; need_score
          = 40 + 30 + 30 = 100. dti = round(30000/300000, 4) = 0.1 which is
          <= 0.13 so 50 points; credit_score 640 >= 620 so 25 points;
          on_time_housing_payment_months 24 >= 12 so 25 points;
          ability_to_pay_score = 100. ami_pct = round(3600000/6000000, 4) =
          0.6. willingness_score stays null so composite_selection_score stays
          null. Each subsidy-pool-adjustment re-reads the program version with
          a GET immediately beforehand, per concurrency rule
          subsidy-pool-adjust-stale-program.
        test_recipe:
          setup:
            - "One AffiliateProgram created with subsidy_pool_cents 5000000, committee_quorum 2 and sweat_equity_base_hours_required 12, then suspended, so status is SUSPENDED and program_posture is FROZEN with subsidy_committed_cents 0 and subsidy_disbursed_cents 0."
            - "One ApplicantHousehold of that program holding a single ACTIVE APPLICANT member, submitted so selection_status is SUBMITTED and documentation_status is SUBMITTED, with need_score, ability_to_pay_score, ami_pct, score_basis all still null."
            - "Logical clock left at its fresh-service value 2026-08-01T00:00:00.000Z."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id } }
            - { call: "POST /homeownership/households", payload: { program_id: "${prog_id}", household_name: "Alvarez", household_size: 4, current_bedroom_count: 1, habitability_deficiency_count: 3, self_reported_annual_income_cents: 3600000, self_reported_housing_cost_cents: 150000, monthly_debt_payment_cents: 30000, credit_score: 640, on_time_housing_payment_months: 24 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { hh_id: $.data.id } }
            - { call: "POST /homeownership/household-members", payload: { household_id: "${hh_id}", full_name: "Rosa Alvarez", relationship: "APPLICANT", birth_date: "1985-03-15T00:00:00.000Z", is_adult_occupant: true }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/households/${hh_id}/submit", payload: { attestation_signed: true }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { hh_status_before: $.data.selection_status, doc_status_before: $.data.documentation_status } }
            - { call: "GET /homeownership/programs/${prog_id}", as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_v1: $.data.version } }
            - { call: "POST /homeownership/programs/${prog_id}/subsidy-pool-adjustments", payload: { action: "SUSPEND_PROGRAM", expected_program_version: "${prog_v1}", memo: "Board-ordered suspension pending audit" }, as: ProgramAdmin, as_user_id: "admin-1", captures: { posture_frozen: $.data.program_posture, status_frozen: $.data.status } }
            - { call: "GET /homeownership/programs/${prog_id}", as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_v2: $.data.version } }
          trigger:
            - { call: "POST /homeownership/households/${hh_id}/screen", payload: { income_documents_received: true, verified_annual_income_cents: 3000000, verified_housing_cost_cents: 100000 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "GET /homeownership/households/${hh_id}", as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { hh_status_mid: $.data.selection_status, basis_mid: $.data.score_basis } }
            - { call: "POST /homeownership/programs/${prog_id}/subsidy-pool-adjustments", payload: { action: "RESUME_PROGRAM", expected_program_version: "${prog_v2}", memo: "Audit closed; intake resumes" }, as: ProgramAdmin, as_user_id: "admin-1", captures: { posture_open: $.data.program_posture, status_active: $.data.status } }
            - { call: "POST /homeownership/households/${hh_id}/screen", payload: { income_documents_received: true, verified_annual_income_cents: 3000000, verified_housing_cost_cents: 100000 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
          assert:
            - "${hh_status_before} == SUBMITTED"
            - "${doc_status_before} == SUBMITTED"
            - "${status_frozen} == SUSPENDED"
            - "${posture_frozen} == FROZEN"
            - "trigger step 1 response HTTP status == 409"
            - "trigger step 1 response data.error_id == ERR_PROGRAM_FROZEN"
            - "${hh_status_mid} == SUBMITTED"
            - "${basis_mid} == null"
            - "${status_active} == ACTIVE"
            - "${posture_open} == OPEN"
            - "trigger step 4 response HTTP status == 200"
            - "ApplicantHousehold.${hh_id}.selection_status == SCREENING"
            - "ApplicantHousehold.${hh_id}.documentation_status == VERIFIED"
            - "ApplicantHousehold.${hh_id}.score_basis == PRELIMINARY"
            - "ApplicantHousehold.${hh_id}.need_score == 100"
            - "ApplicantHousehold.${hh_id}.ability_to_pay_score == 100"
            - "ApplicantHousehold.${hh_id}.ami_pct == 0.6"
            - "ApplicantHousehold.${hh_id}.willingness_score == null"
            - "ApplicantHousehold.${hh_id}.composite_selection_score == null"
            - "AffiliateProgram.${prog_id}.subsidy_available_cents == 5000000"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: overlap_site_closed_60min_cleanup_buffer_exact_abutment
        resource_entity: BuildSite
        interval_semantics: "closed interval [start_at - 60 min, end_at + 60 min], symmetric cleanup buffer, exclusive site occupancy"
        grounds:
          - calculations.site_shift_buffer_overlap
          - validations[priority=29]
          - errors.ERR_SITE_SHIFT_BUFFER_CONFLICT
          - entities.ConstructionShift.fields.start_at
          - entities.ConstructionShift.fields.end_at
        distinguishing_aspect: |
          The resource is the BuildSite and the geometry is BUFFERED-CLOSED: an
          existing 08:00->12:00 shift occupies the site through 13:00:00.000Z, so a
          candidate starting at exactly 13:00:00.000Z (a gap of exactly 60 minutes)
          is ACCEPTED because collides() uses strict `<` on both sides, while a
          candidate starting one minute earlier at 12:59:00.000Z (a 59-minute gap)
          is REJECTED with ERR_SITE_SHIFT_BUFFER_CONFLICT — an implementation that
          compares raw start_at/end_at without the 60-minute buffer accepts BOTH.
        test_recipe:
          setup:
            - "One AffiliateProgram (status ACTIVE, program_posture OPEN) on the fresh-service logical clock 2026-08-01T00:00:00.000Z."
            - "One BuildSite P-1001 driven RAW_LAND -> TITLE_CLEAR -> ENV_CLEARED -> READY_TO_BUILD by three readiness-advance steps; safety_posture CLEAR, so no priority-25 or priority-26 gate fires on a shift write."
            - "One SCHEDULED ConstructionShift on that site over 2026-08-10T08:00:00.000Z -> 2026-08-10T12:00:00.000Z (duration_hours 4.0, volunteer_slots 6, required_trade_slots 0), which buffer-occupies the site over the closed interval 07:00:00.000Z -> 13:00:00.000Z."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id } }
            - { call: "POST /homeownership/build-sites", payload: { program_id: "${prog_id}", parcel_number: "P-1001", street_address: "12 Cedar Ln", acquisition_cost_cents: 4000000, appraised_value_cents: 15000000 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { site_id: $.data.id } }
            - { call: "POST /homeownership/build-sites/${site_id}/readiness-advance", payload: { step: "TITLE", document_reference: "T-1" }, as: ConstructionManager, as_user_id: "cm-1" }
            - { call: "POST /homeownership/build-sites/${site_id}/readiness-advance", payload: { step: "ENVIRONMENTAL", document_reference: "E-1" }, as: ConstructionManager, as_user_id: "cm-1" }
            - { call: "POST /homeownership/build-sites/${site_id}/readiness-advance", payload: { step: "UTILITIES", document_reference: "U-1" }, as: ConstructionManager, as_user_id: "cm-1" }
            - { call: "POST /homeownership/construction-shifts", payload: { build_site_id: "${site_id}", crew_lead_user_id: "cm-1", start_at: "2026-08-10T08:00:00.000Z", end_at: "2026-08-10T12:00:00.000Z", volunteer_slots: 6, required_trade_slots: 0 }, as: ConstructionManager, as_user_id: "cm-1", captures: { shift_base_id: $.data.id } }
          trigger:
            - { call: "POST /homeownership/construction-shifts", payload: { build_site_id: "${site_id}", crew_lead_user_id: "cm-1", start_at: "2026-08-10T12:59:00.000Z", end_at: "2026-08-10T16:59:00.000Z", volunteer_slots: 6, required_trade_slots: 0 }, as: ConstructionManager, as_user_id: "cm-1" }
            - { call: "POST /homeownership/construction-shifts", payload: { build_site_id: "${site_id}", crew_lead_user_id: "cm-1", start_at: "2026-08-10T13:00:00.000Z", end_at: "2026-08-10T17:00:00.000Z", volunteer_slots: 6, required_trade_slots: 0 }, as: ConstructionManager, as_user_id: "cm-1", captures: { shift_abut_id: $.data.id } }
          assert:
            - "trigger[1] (start 12:59:00.000Z, 59-minute gap) -> HTTP 409 with data.error_id == ERR_SITE_SHIFT_BUFFER_CONFLICT"
            - "trigger[1] creates no row: count(ConstructionShift where build_site_id == ${site_id}) == 2 after both triggers"
            - "trigger[2] (start 13:00:00.000Z, gap of exactly 60 minutes) -> HTTP 201"
            - "ConstructionShift.${shift_abut_id}.status == SCHEDULED"
            - "ConstructionShift.${shift_abut_id}.start_at == 2026-08-10T13:00:00.000Z"
            - "ConstructionShift.${shift_abut_id}.duration_hours == 4.0"
            - "ConstructionShift.${shift_base_id}.status == SCHEDULED"
            - "BuildSite.${site_id}.readiness_status == READY_TO_BUILD"
            - "BuildSite.${site_id}.safety_posture == CLEAR"

      - name: overlap_volunteer_half_open_zero_buffer_back_to_back_allowed
        resource_entity: VolunteerProfile
        interval_semantics: "half-open interval [start_at, end_at), ZERO buffer, adjacency explicitly allowed; aggregate Monday-anchored weekly budget layered on top"
        grounds:
          - calculations.volunteer_shift_overlap_and_weekly_cap
          - validations[priority=29]
          - validations[priority=31]
          - errors.ERR_VOLUNTEER_DOUBLE_BOOKED
          - entities.VolunteerProfile.fields.assigned_hours_committed
          - concurrency_rules[assignment-create-stale-shift]
        distinguishing_aspect: |
          The resource is the VolunteerProfile identity, not the site, and the
          geometry is the OPPOSITE of the site rule: half-open [start_at, end_at)
          with ZERO buffer, so a seat on a shift starting at exactly
          2026-08-10T12:00:00.000Z — the very instant the volunteer's held
          08:00->12:00 shift ends — is ACCEPTED (assigned_hours_committed 4.00 ->
          8.00), while a seat on a shift starting one minute earlier at
          11:59:00.000Z is REJECTED with ERR_VOLUNTEER_DOUBLE_BOOKED. An
          implementation that reuses the site rule's 60-minute buffer here rejects
          the back-to-back seat; one that uses closed intervals rejects it too.
        test_recipe:
          setup:
            - "One AffiliateProgram (ACTIVE) and THREE BuildSites P-1001 / P-1002 / P-1003, each advanced to READY_TO_BUILD with safety_posture CLEAR — three sites are required because the 60-minute site buffer of calculations.site_shift_buffer_overlap forbids back-to-back shifts on one site."
            - "One adult VolunteerProfile (birth_date 1990-05-05, is_minor false, waiver_expires_on 2027-01-01, status ACTIVE, no_show_strikes 0), so the weekly cap is 40.00 hours."
            - "Three OPEN 4.00-hour shifts, all inside the Monday-anchored UTC week [2026-08-10T00:00:00.000Z, 2026-08-17T00:00:00.000Z): SITE-A 08:00->12:00, SITE-B 12:00->16:00 (exactly abutting), SITE-C 11:59->15:59 (one minute inside)."
            - "The volunteer holds one RESERVED GENERAL_VOLUNTEER seat on the SITE-A shift, so assigned_hours_committed == 4.00 and week_hours == 4.00 of the 40.00 budget."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id } }
            - { call: "POST /homeownership/build-sites", payload: { program_id: "${prog_id}", parcel_number: "P-1001", street_address: "12 Cedar Ln", acquisition_cost_cents: 4000000, appraised_value_cents: 15000000 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { site_a_id: $.data.id } }
            - { call: "POST /homeownership/build-sites", payload: { program_id: "${prog_id}", parcel_number: "P-1002", street_address: "14 Cedar Ln", acquisition_cost_cents: 4000000, appraised_value_cents: 15000000 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { site_b_id: $.data.id } }
            - { call: "POST /homeownership/build-sites", payload: { program_id: "${prog_id}", parcel_number: "P-1003", street_address: "16 Cedar Ln", acquisition_cost_cents: 4000000, appraised_value_cents: 15000000 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { site_c_id: $.data.id } }
            - { call: "POST /homeownership/build-sites/${site_a_id}/readiness-advance", payload: { step: "TITLE", document_reference: "T-A" }, as: ConstructionManager, as_user_id: "cm-1" }
            - { call: "POST /homeownership/build-sites/${site_a_id}/readiness-advance", payload: { step: "ENVIRONMENTAL", document_reference: "E-A" }, as: ConstructionManager, as_user_id: "cm-1" }
            - { call: "POST /homeownership/build-sites/${site_a_id}/readiness-advance", payload: { step: "UTILITIES", document_reference: "U-A" }, as: ConstructionManager, as_user_id: "cm-1" }
