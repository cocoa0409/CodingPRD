        distinguishing_aspect: "Sales-cents metric on POST /reconciliations/{id}/post: net_sales 50000 == REBATE_THRESHOLD triggers the rebate rate 0.05 (royalty_due 2500) whereas 49999 would keep 0.06 — a different metric and endpoint from the inventory-units boundary."
