            - "epoch.auto_orders_created == 0 and epoch.holds_promoted == 0"
            - "Loan.${loan0_id}.version == ${loan0_v} (unchanged) and status still ACTIVE"

      - name: consortium_visibility_gate_blocks_local_only_title
