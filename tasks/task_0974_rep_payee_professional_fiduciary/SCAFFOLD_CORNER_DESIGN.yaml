            - { call: "POST /surety-bonds/${b3_id}/activate", payload: {}, as: FiduciaryAdmin, captures: { b3_st: $.data.status } }
          assert:
            - "err == ERR_BOND_WINDOW_CONFLICT ([2026-06-01, 2026-12-01) overlaps ACTIVE B1)"
            - "b3_st == ACTIVE (adjacency at 2026-07-01 allowed; PENDING B2 does not block)"

      - name: duplicate_bank_account_ref_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=32]", "errors[ERR_DUPLICATE_UNIQUE_FIELD]"]

        distinguishing_aspect: "bank_account_ref is globally unique across clients: reusing 'BA-DUP-001' for a different client's account is rejected with ERR_DUPLICATE_UNIQUE_FIELD (409)."
        test_recipe:
          setup: ["Two clients; first client already has account BA-DUP-001"]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Dup One", date_of_birth: "1970-01-01", ssn_last4: "1010", county_of_residence: "TRV", medicaid_enrolled: false }, as: FiduciaryAdmin, captures: { c1_id: $.data.id } }
            - { call: "POST /clients", payload: { legal_name: "Dup Two", date_of_birth: "1972-02-02", ssn_last4: "2020", county_of_residence: "TRV", medicaid_enrolled: false }, as: FiduciaryAdmin, captures: { c2_id: $.data.id } }
