        grounds:
          - concurrency_rules[program-year-config-edit-stale]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: |
          PUT /program-years/{id} with an expected_program_year_version that
          does not match the current ProgramYear.version returns 412
          ERR_STALE_VERSION; version advances on each successful mutation.
        test_recipe:
          setup:
            - "One ProgramYear at version=1 (just created)"
            - "Capture current version"
          setup_api_calls:
            - call: "POST /program-years"
              payload: { program_code: "P1", program_year_label: "PY1", budget_cap_cents: 1000000, savings_goal_kwh: 1000 }
              as: ProgramAdministrator
              captures: { py_id: $.data.id, py_v: $.data.version }
          trigger:
            - call: "PUT /program-years/${py_id}"
              payload: { expected_program_year_version: "${py_v}", budget_cap_cents: 2000000 }
              as: ProgramAdministrator
              captures: { py_v_after: $.data.version }
            - call: "PUT /program-years/${py_id}"
              payload: { expected_program_year_version: "${py_v}", savings_goal_kwh: 9999 }
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "First PUT succeeds; ProgramYear.${py_id}.version == 2"
            - "Second PUT fails: HTTP status == 412"
            - "error_id == 'ERR_STALE_VERSION'"

