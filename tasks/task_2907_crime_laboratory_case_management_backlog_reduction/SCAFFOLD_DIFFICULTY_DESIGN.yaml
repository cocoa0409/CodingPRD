              payload: { decision: "APPROVE", rationale: "Second-person check plus audit closes the detection gap." }
              as: QualityManager
              as_user_id: "ops-qm-1"
            - call: "POST /lab/nonconformances/${nc1}/verify-close"
              payload: {}
              as: QualityManager
              as_user_id: "ops-qm-1"
          assert:
            - "Nonconformance.${nc1}.capa_rejection_count == 2"
            - "Nonconformance.${nc1}.severity == CRITICAL"
            - "Nonconformance.${nc1}.opened_at_utc == 2026-08-01T00:00:00Z"
            - "Nonconformance.${nc1}.due_utc == 2026-08-11T00:00:00Z"
            - "Nonconformance.${nc1}.status == CLOSED"
            - "Nonconformance.${nc1}.closed_at_utc == 2026-08-01T00:00:00Z"
            - "Nonconformance.${nc1}.overdue == false"
            - "Nonconformance.${nc1}.root_cause_category == METHOD_DEFICIENCY"
            - "Analyst.${a1}.qualification_state == QUALIFIED"
            - "Analyst.${a1}.probation_entered_at_utc is null"
            - "Analyst.${a1}.consecutive_pt_failures == 0"

