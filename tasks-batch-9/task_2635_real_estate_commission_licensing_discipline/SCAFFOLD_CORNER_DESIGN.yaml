          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          GO_INACTIVE is declared only from ACTIVE. Replaying it from INACTIVE must 409 at priority 9
          without re-stamping inactive_since (which would silently reset the CE escalation clock of
          ce_requirement_hours) and without decrementing affiliated_licensee_count a second time.
        test_recipe:
          setup:
