            - "HTTP 409 with error_id \"ERR_PRIVILEGE_LOG_INCOMPLETE\" — 0 VALIDATED entries against a quota of 2"
            - "Batch.${b1_id}.status is still \"QC_PASSED\" and released_at == null"
            - "Assignment.${a1_id}.status == \"SUBMITTED\" — no COMPLETED cascade fired"
            - "Matter.${m_id}.status == \"IN_REVIEW\" — no QC_CLOSEOUT cascade fired"
            - "Reviewer.${ra_id}.scorecard_strikes == 0 — the clean sample credited -1 but the running total floors at 0"

      - name: release_bubbles_matter_to_closeout_then_close_completes
        claim_type: bubble_up
        grounds:
          - state_machines.Batch.QC_PASSED_to_RELEASED
          - state_machines.Matter.IN_REVIEW_to_QC_CLOSEOUT
          - state_machines.Matter.QC_CLOSEOUT_to_CLOSED
          - calculations.matter_invoice_total
        distinguishing_aspect: "Releasing the last batch bubbles state UPWARD twice: the batch's RELEASED transition drags its SUBMITTED assignment to COMPLETED and its VALIDATED privilege entries to FINAL and lifts the matter to QC_CLOSEOUT, after which close moves the matter to its terminal CLOSED."
