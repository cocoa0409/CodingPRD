  - rule_id: non_linear_state_machine
    instances:
      - name: trip_charter_decline_resubmit_cycle
        grounds:
          - state_machines.TripRequest.DECLINED_to_REQUESTED
          - state_machines.TripRequest.REQUESTED_to_DECLINED
          - state_machines.TripRequest.REQUESTED_to_APPROVED
        distinguishing_aspect: |
          TripRequest's machine is cyclic (REQUESTED -> DECLINED -> REQUESTED
          -> APPROVED): a declined charter trip loops back into REQUESTED via
          resubmit with revised commercial terms, and the loop clears
          decline_reason while applying the new quote.
        test_recipe:
          setup:
            - "Owner O, aircraft A, agreement ACTIVE"
            - "CHARTER trip T with charter_quote_cents 800000 in REQUESTED"
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Aeris Holdings LLC", contact_email: "owner@aeris.example" }
              as: AccountExecutive
              captures: { o_id: $.data.id }
            - call: "POST /aircraft"
              payload: { owner_id: "${o_id}", tail_number: "N600JX", model: "G650", home_base_icao: "KTEB" }
              as: AccountExecutive
              captures: { a_id: $.data.id }
            - call: "POST /agreements"
              payload: { owner_id: "${o_id}", aircraft_id: "${a_id}", monthly_management_fee_cents: 500000, variable_fee_pct: 0.10, charter_owner_share_pct: 0.85, tax_allocation_method: FLIGHT_HOURS }
              as: AccountExecutive
              captures: { ag_id: $.data.id }
            - call: "POST /agreements/${ag_id}/activate"
              as: AccountExecutive
            - call: "POST /trips"
              payload: { aircraft_id: "${a_id}", trip_use: CHARTER, depart_icao: "KTEB", arrive_icao: "KMIA", departure_at: "2026-08-06T08:00:00Z", block_hours_est: 6.0, charter_quote_cents: 800000 }
              as: FlightOpsManager
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /trips/${t_id}/decline"
              payload: { reason: "quote below market" }
              as: Owner
              as_user_id: "${o_id}"
            - call: "POST /trips/${t_id}/resubmit"
              payload: { charter_quote_cents: 900000 }
              as: FlightOpsManager
            - call: "POST /trips/${t_id}/approve"
              as: Owner
              as_user_id: "${o_id}"
          assert:
            - "after decline: TripRequest.${t_id}.status == DECLINED and decline_reason == \"quote below market\""
            - "after resubmit: TripRequest.${t_id}.status == REQUESTED and charter_quote_cents == 900000 and decline_reason is null"
            - "after approve: TripRequest.${t_id}.status == APPROVED"

      - name: vendor_contract_counter_reproposal_cycle
        grounds:
          - state_machines.VendorContract.DRAFT_to_PROPOSED
          - state_machines.VendorContract.PROPOSED_to_COUNTERED
          - state_machines.VendorContract.COUNTERED_to_PROPOSED
          - state_machines.VendorContract.PROPOSED_to_EXECUTED
        distinguishing_aspect: |
          VendorContract's machine is a negotiation cycle on a DIFFERENT entity
          than TripRequest: DRAFT -> PROPOSED -> COUNTERED -> PROPOSED ->
          EXECUTED, and each loop arm rewrites rate_cents_per_unit, so the
          executed rate (470) is the re-proposed value, not the draft (500) or
          the counter (450).
        test_recipe:
          setup:
            - "Owner O, aircraft A (no agreement needed for contract negotiation)"
            - "FUEL VendorContract drafted with rate_cents_per_unit 500"
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Aeris Holdings LLC", contact_email: "owner@aeris.example" }
              as: AccountExecutive
              captures: { o_id: $.data.id }
            - call: "POST /aircraft"
              payload: { owner_id: "${o_id}", tail_number: "N700JX", model: "G650", home_base_icao: "KTEB" }
              as: AccountExecutive
              captures: { a_id: $.data.id }
            - call: "POST /contracts"
              payload: { aircraft_id: "${a_id}", vendor_kind: FUEL, vendor_name: "JetFuel Co", unit: GALLON, rate_cents_per_unit: 500, term_start: "2026-09-01", term_end: "2027-08-31" }
              as: ContractsManager
              captures: { vc_id: $.data.id }
          trigger:
            - call: "POST /contracts/${vc_id}/propose"
              as: ContractsManager
            - call: "POST /contracts/${vc_id}/counter"
              payload: { rate_cents_per_unit: 450 }
              as: ContractsManager
            - call: "POST /contracts/${vc_id}/propose"
              payload: { rate_cents_per_unit: 470 }
              as: ContractsManager
            - call: "POST /contracts/${vc_id}/execute"
              as: AccountExecutive
          assert:
            - "VendorContract.${vc_id}.status == EXECUTED"
            - "VendorContract.${vc_id}.rate_cents_per_unit == 470"

