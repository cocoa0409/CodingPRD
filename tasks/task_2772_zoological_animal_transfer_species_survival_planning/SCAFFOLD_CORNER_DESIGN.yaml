          rationale: "That instance drives the negotiation to MAX_NEGOTIATION_ROUNDS and asserts the refusal with this error id."
      - name: inbreeding_limit_error_is_reachable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_INBREEDING_LIMIT_EXCEEDED]
        excluded_because:
          difficulty_instance: boundary_precision_check / molecular_inbreeding_exact_limit_blocks_endorsement
          rationale: "That instance triggers this error at exactly MAX_OFFSPRING_INBREEDING and shows the sibling case one step below it succeeding."
      - name: carrier_capacity_error_is_reachable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CARRIER_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / carrier_closed_interval_aggregate_capacity_at_one_second
          rationale: "That instance asserts this error on the third overlapping booking of the same carrier."
      - name: quarantine_room_conflict_error_is_reachable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_QUARANTINE_ROOM_CONFLICT]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / quarantine_room_half_open_window_with_phase_conditional_buffer
          rationale: "That instance asserts this error for the overlapping and buffer-violating windows while the abutting window is accepted."
      - name: permit_not_issued_error_is_reachable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_PERMIT_NOT_ISSUED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / confirm_referential_71_outranks_temporal_74
          rationale: "That instance asserts this priority-71 error on the first confirm attempt while the temporal rule is also violated."
      - name: health_certificate_expired_error_is_reachable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_HEALTH_CERTIFICATE_EXPIRED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / confirm_referential_71_outranks_temporal_74
          rationale: "That instance asserts this priority-74 error on the second confirm attempt, once the referential defect ahead of it has been repaired."
      - name: institution_not_accredited_error_is_reachable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_INSTITUTION_NOT_ACCREDITED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / accept_gated_on_receiving_institution_accreditation
          rationale: "That instance suspends the receiving institution and asserts this error on accept, then restores it and shows the accept succeed."
      - name: vet_license_invalid_error_is_reachable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_VET_LICENSE_INVALID]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / certificate_issue_gated_on_signing_vet_license_state
          rationale: "That instance asserts this error for the lapsed-licence signer and the successful issue for the active one."
      - name: quarantine_not_scheduled_error_is_reachable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_QUARANTINE_NOT_SCHEDULED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / booking_confirm_gated_on_scheduled_quarantine_at_receiver
          rationale: "That instance asserts this error on the confirm attempt made before the receiver's quarantine occupancy exists."
      - name: test_panel_incomplete_error_is_reachable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_TEST_PANEL_INCOMPLETE]
        excluded_because:
          difficulty_instance: boundary_precision_check / empty_and_partial_test_panel_block_certificate_issue
          rationale: "That instance asserts this error for the zero-test panel and for the one-of-two-test panel before the complete panel is accepted."
      - name: quarantine_minimum_not_met_error_is_reachable
        claim_type: error_triggerable
        grounds:
