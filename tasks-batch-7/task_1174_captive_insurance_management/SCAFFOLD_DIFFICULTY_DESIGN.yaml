              payload: { filing_type: "INITIAL_FORMATION", jurisdiction: "VERMONT", supporting_documents: [{document_type: "ARTICLES", document_url: "https://docs.example.com/a.pdf", uploaded_at: "2026-01-15T00:00:00Z"}] }
