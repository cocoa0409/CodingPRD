      - name: omitted_assessment_cap_falls_back_to_the_declared_default_constant
        claim_type: constants_applied
        grounds:
          - calculations.parcel_value_decomposition
          - entities.Parcel.fields.assessment_cap_pct_bps
          - entities.Parcel.fields.capped_value_cents
        distinguishing_aspect: "Omitting the optional assessment_cap_pct_bps input stores DEFAULT_ASSESSMENT_CAP_PCT_BPS 200 and the cap step still grows the base value over the 6 elapsed years to capped_value_cents 33600000; a zero-cap fallback would leave 30000000."
        test_recipe:
          setup:
            - "Empty database; the parcel is created without the optional cap field."
            - "Arithmetic: years_since_base = 2026 - 2020 = 6; 30000000 * (10000 + 200*6)/10000 = 30000000 * 11200/10000 = 33600000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
