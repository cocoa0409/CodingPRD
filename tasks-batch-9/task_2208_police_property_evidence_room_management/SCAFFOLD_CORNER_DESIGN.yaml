            - "GET /custody-transfers/${transfer_id} still shows status == 'RELEASED' with released_signature == 'sig-release-1' (the second signature is not stored)"
            - "GET /evidence-items/${item_id} shows custody_state == 'CHECKED_OUT' exactly once: current_holder_id == ${lab_id} and open_transfer_count == 1"
            - "GET /chain-events?evidence_item_id=${item_id} returns total_count == 3 (INTAKE, STORAGE_ASSIGN, RELEASE): no second RELEASE entry was appended"

