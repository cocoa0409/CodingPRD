  - rule_id: transitive_cascade
    instances:

      - name: accept_offer_depth5_commitment_cascade
        grounds:
          - state_machines.Offer.ISSUED_to_ACCEPTED
          - state_machines.Offer.ISSUED_to_SUPERSEDED
          - state_machines.RadiusClause.PROVISIONAL_to_RELEASED
          - calculations.festival_lineup_posture
          - entities.BudgetTier.fields.status
        distinguishing_aspect: |
          Triggered by POST /offers/{id}/accept. Depth 5 with every link caused by the previous
          one, not fanned out from the trigger: accept creates the Booking (1) -> the Booking
          debits its tier (2) -> the debit closes the tier because slots_committed reached
          max_slots 1 (3) -> the tier closing supersedes the sibling ISSUED offer (4) -> the
          supersession releases that offer's PROVISIONAL radius clause (5). Nothing in the accept
          request mentions the sibling offer or its clause.
