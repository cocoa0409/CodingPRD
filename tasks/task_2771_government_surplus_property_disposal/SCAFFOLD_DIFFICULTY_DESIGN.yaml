      - name: tc_demil_destroy_four_hop_cancellation
        grounds:
          - endpoints[POST /assets/{id}/clearance-certificates]
          - state_machines.SurplusAsset.LISTED_to_DESTROYED
          - state_machines.AuctionLot.OPEN_to_CANCELLED
          - state_machines.Bid.ACTIVE_to_RETRACTED
          - state_machines.TurnIn.ACCEPTED_to_CLOSED
          - validations[priority=56]
          - validations[priority=58]
        distinguishing_aspect: |
          A demilitarization certificate filed with method DESTROY on a LISTED restricted asset drives a
          cascade whose root is a certificate insert rather than a status call, and whose fourth hop is a
          bubble-up: because the destroyed asset is the turn-in's only child and DESTROYED is terminal,
          the parent TurnIn moves ACCEPTED -> CLOSED. Unlike the debarment unwind, nothing here returns
          to a re-listable state — the asset ends in a terminal state and the live auction is cancelled
          under it.
