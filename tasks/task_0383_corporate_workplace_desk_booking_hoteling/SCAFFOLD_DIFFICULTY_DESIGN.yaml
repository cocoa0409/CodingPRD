              payload: { label: "C" }
              as: FacilityManager
              captures: { seat_c: $.data.id }
            - call: "POST /workplace/employees"
              payload: { email: "e11a@x.com", full_name: "E11A", team_code: "ENG" }
              as: FacilityManager
              captures: { emp_a: $.data.id }
            - call: "POST /workplace/employees"
              payload: { email: "e11b@x.com", full_name: "E11B", team_code: "ENG" }
              as: FacilityManager
              captures: { emp_b: $.data.id }
            - call: "POST /workplace/_clock/set"
              payload: { current_date: "2026-07-01", current_minute: 500 }
