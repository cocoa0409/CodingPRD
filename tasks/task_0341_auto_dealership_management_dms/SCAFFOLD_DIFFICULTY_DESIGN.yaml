              as: FinanceManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE (state precondition, priority 7, beats fiscal ERR_LTV_EXCEEDED priority 16)"

      - name: conflict_safety_vs_temporal_on_testdrive
        grounds:
          - validations[priority=11]
          - validations[priority=13]
          - endpoints.POST_/test-drives
        distinguishing_aspect: |
          Error-category pair (business_temporal vs business_safety): a test-drive request whose customer
          lacks a valid license AND whose interval overlaps an existing SCHEDULED drive returns the
          higher-priority error — ERR_TESTDRIVE_OVERLAP (business_temporal, priority 11) wins over
          ERR_LICENSE_INVALID (business_safety, priority 13).
        test_recipe:
          setup:
            - "Vehicle VT AVAILABLE with one SCHEDULED test drive 10:00-10:30; Customer with drivers_license_valid false."
          setup_api_calls:
            - call: "POST /vehicles"
