        claim_type: violation_to_error
        grounds:
          - errors[ERR_APPEAL_WINDOW_EXPIRED]
        distinguishing_aspect: "Appealing a non-SAFETY violation past the 14-day window returns ERR_APPEAL_WINDOW_EXPIRED (422); safety branch is covered separately."
        test_recipe:
          setup:
            - "Property P; NUISANCE violation V fined at 2026-03-05; clock advanced to 2026-03-25 (20 days after)."
          setup_api_calls:
