            - "the series read in the same breath shows entry_count 2 and status still PLANTED (one entry is still PLANTED, so the bubble-up has correctly not fired yet)"
            - "the site read shows committed_plot_count 18, utilisation 0.18 and posture OPEN, already reflecting both entries"
