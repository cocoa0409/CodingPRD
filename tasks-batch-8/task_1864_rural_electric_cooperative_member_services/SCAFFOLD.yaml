  # --- ServiceOrder ---
  - { method: POST, path: "/coop/service-orders", description: "Create a service order", roles: [MemberServicesRep], code: 201, input: [service_location_id, order_type, distance_ft, requires_road_bore], output: ServiceOrder, side_effects: ["status=DRAFT"] }
