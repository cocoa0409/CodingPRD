            - { call: "GET /waiver-agreements/${agmt_id}", payload: {}, as: FundController, captures: { bal: "$.data.recoverable_balance" } }
          assert:
            - "${nav_status} == FINAL and NavRecord.${nav_id}.expense_accrual_total == 1.00 (round2(365000 x 10/10000/365))"
            - "ratio == round4(1.00 x 365 / 365000 x 10000) == 10.0000 == cap_bps -> NO breach: ${bal} == 0"
            - "GET /waiver-agreements/${agmt_id}/ledger returns empty list (total_count == 0)"
      - name: recoup_window_last_day_inclusive
        grounds:
          - calculations.recoupment_waterfall
          - entities.WaiverLedgerEntry.fields.expires_at
          - errors[ERR_RECOUP_WINDOW_EXPIRED]
        distinguishing_aspect: |
          Boundary metric = calendar date, exercised through
          POST /waiver-agreements/{id}/recoupments (different metric and
          endpoint from the ratio boundary): a recoupment dated exactly
          expires_at (2026-11-04) is INSIDE the inclusive window and succeeds,
          while the same request one day later fails with
          ERR_RECOUP_WINDOW_EXPIRED despite remaining balance.
        test_recipe:
          setup:
            - "Like the cap fixture (qty 3650 @ 100.00, cap 10bps, recovery 3 months) but a manual OTHER accrual at 0.2bps makes day-1 accruals 1.02 -> ratio 10.2000 > 10 -> WAIVER 0.02 with entry_date 2026-08-04, expires_at 2026-11-04"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: FundController }
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: null, rate_bps: 50 } ] }, as: FundController, captures: { fund_id: "$.data.id" } }
            - { call: "POST /share-classes", payload: { fund_id: "${fund_id}", class_ticker: "ALPHXI", distribution_frequency: "QUARTERLY" }, as: FundController, captures: { class_id: "$.data.id" } }
            - { call: "POST /share-classes/${class_id}/capital-activity", payload: { activity_type: "SUBSCRIPTION", activity_date: "2026-08-03", shares: 10000 }, as: FundAccountant }
            - { call: "POST /securities", payload: { security_identifier: "CUSIP0001", description: "Acme Corp", asset_class: "EQUITY", default_pricing_level: "LEVEL_1", currency: "USD" }, as: FundAccountant, captures: { sec_id: "$.data.id" } }
            - { call: "POST /positions", payload: { share_class_id: "${class_id}", security_id: "${sec_id}", quantity: 3650, cost_basis_total: 365000, opened_date: "2026-08-03" }, as: FundAccountant }
            - { call: "POST /price-observations", payload: { security_id: "${sec_id}", price_date: "2026-08-04", price: 100.00, source: "EXCHANGE_CLOSE", pricing_level: "LEVEL_1" }, as: FundAccountant, captures: { px_id: "$.data.id" } }
            - { call: "POST /price-observations/${px_id}/approve", payload: {}, as: PricingCommittee }
            - { call: "POST /waiver-agreements", payload: { share_class_id: "${class_id}", cap_bps: 10, effective_from: "2026-08-01", effective_to: "2026-12-31", recovery_window_months: 3 }, as: FundController, captures: { agmt_id: "$.data.id" } }
            - { call: "POST /nav-records", payload: { share_class_id: "${class_id}", accounting_date: "2026-08-04" }, as: FundAccountant, as_user_id: "acct_1", captures: { nav_id: "$.data.id" } }
            - { call: "POST /expense-accruals", payload: { share_class_id: "${class_id}", accrual_date: "2026-08-04", category: "OTHER", annual_rate_bps: 0.2 }, as: FundAccountant }
            - { call: "GET /nav-records/${nav_id}", payload: {}, as: FundController, captures: { nav_v: "$.data.version" } }
            - { call: "POST /nav-records/${nav_id}/finalize", payload: { expected_nav_record_version: "${nav_v}" }, as: FundController, as_user_id: "ctl_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-04T00:00:00Z" }, as: FundController }
          trigger:
            - { call: "POST /waiver-agreements/${agmt_id}/recoupments", payload: { amount: 0.01, recoup_date: "2026-11-04" }, as: FundController, captures: { rec_id: "$.data.id", rec_type: "$.data.entry_type" } }
            - { call: "GET /waiver-agreements/${agmt_id}", payload: {}, as: FundController, captures: { bal_after: "$.data.recoverable_balance" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-05T00:00:00Z" }, as: FundController }
            - { call: "POST /waiver-agreements/${agmt_id}/recoupments", payload: { amount: 0.01, recoup_date: "2026-11-05" }, as: FundController, captures: { err: "$.data.error_id" } }
          assert:
            - "First recoupment succeeds on the exact expiry day: ${rec_type} == RECOUPMENT (window inclusive of expires_at 2026-11-04)"
            - "WaiverAgreement.${agmt_id}.recoverable_balance == 0.01 after partial recoupment (${bal_after})"
            - "Second recoupment one day later: ${err} == ERR_RECOUP_WINDOW_EXPIRED (http 422) even though 0.01 remaining_amount exists"

  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: finalize_requires_all_prices_approved
        grounds:
          - state_machines.NavRecord.ESTIMATED_to_FINAL
          - errors[ERR_PRICE_NOT_APPROVED]
        distinguishing_aspect: |
          Entity pair PriceObservation -> NavRecord: a NavRecord cannot leave
          ESTIMATED while any held security's observation for that date is
          still SUBMITTED; approving the observation unlocks the transition.
        test_recipe:
          setup:
            - "Base kit, but the single price 100.00 on 2026-08-04 stays SUBMITTED"
            - "NavRecord 2026-08-04 ESTIMATED (PROVISIONAL variant admits SUBMITTED, so creation succeeds with GAV 100000.00)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: FundController }
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: null, rate_bps: 50 } ] }, as: FundController, captures: { fund_id: "$.data.id" } }
            - { call: "POST /share-classes", payload: { fund_id: "${fund_id}", class_ticker: "ALPHXI", distribution_frequency: "QUARTERLY" }, as: FundController, captures: { class_id: "$.data.id" } }
            - { call: "POST /share-classes/${class_id}/capital-activity", payload: { activity_type: "SUBSCRIPTION", activity_date: "2026-08-03", shares: 10000 }, as: FundAccountant }
            - { call: "POST /securities", payload: { security_identifier: "CUSIP0001", description: "Acme Corp", asset_class: "EQUITY", default_pricing_level: "LEVEL_1", currency: "USD" }, as: FundAccountant, captures: { sec_id: "$.data.id" } }
            - { call: "POST /positions", payload: { share_class_id: "${class_id}", security_id: "${sec_id}", quantity: 1000, cost_basis_total: 50000, opened_date: "2026-08-03" }, as: FundAccountant }
            - { call: "POST /price-observations", payload: { security_id: "${sec_id}", price_date: "2026-08-04", price: 100.00, source: "EXCHANGE_CLOSE", pricing_level: "LEVEL_1" }, as: FundAccountant, captures: { px_id: "$.data.id" } }
            - { call: "POST /nav-records", payload: { share_class_id: "${class_id}", accounting_date: "2026-08-04" }, as: FundAccountant, as_user_id: "acct_1", captures: { nav_id: "$.data.id", nav_v1: "$.data.version" } }
          trigger:
            - { call: "POST /nav-records/${nav_id}/finalize", payload: { expected_nav_record_version: "${nav_v1}" }, as: FundController, as_user_id: "ctl_1", captures: { err: "$.data.error_id" } }
            - { call: "POST /price-observations/${px_id}/approve", payload: {}, as: PricingCommittee }
            - { call: "GET /nav-records/${nav_id}", payload: {}, as: FundController, captures: { nav_v2: "$.data.version" } }
            - { call: "POST /nav-records/${nav_id}/finalize", payload: { expected_nav_record_version: "${nav_v2}" }, as: FundController, as_user_id: "ctl_1", captures: { st: "$.data.status" } }
          assert:
            - "First finalize: ${err} == ERR_PRICE_NOT_APPROVED (http 409) — SUBMITTED observation on a held security blocks FINAL"
            - "After approve: ${st} == FINAL (the cross-entity gate cleared)"
      - name: filing_approve_blocked_by_escalated_break
        grounds:
          - state_machines.RegulatoryFiling.PENDING_REVIEW_to_APPROVED
          - state_machines.ReconciliationBreak.OPEN_to_ESCALATED
          - errors[ERR_BREAK_ESCALATED_BLOCKS]
        distinguishing_aspect: |
          Entity pair ReconciliationBreak -> RegulatoryFiling (different pair
          from the pricing instance): approval is gated on the fund having no
          ESCALATED break; resolving the break unblocks approval.
        test_recipe:
          setup:
            - "Fund/class/position qty 1000; break dated 2026-08-04 (counterparty 900) escalated by the sweep at clock 2026-08-10"
            - "N_PORT filing period_end 2026-07-31 (already ended) in PENDING_REVIEW prepared by comp_1"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: FundController }
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: null, rate_bps: 50 } ] }, as: FundController, captures: { fund_id: "$.data.id" } }
            - { call: "POST /share-classes", payload: { fund_id: "${fund_id}", class_ticker: "ALPHXI", distribution_frequency: "QUARTERLY" }, as: FundController, captures: { class_id: "$.data.id" } }
            - { call: "POST /securities", payload: { security_identifier: "CUSIP0001", description: "Acme Corp", asset_class: "EQUITY", default_pricing_level: "LEVEL_1", currency: "USD" }, as: FundAccountant, captures: { sec_id: "$.data.id" } }
            - { call: "POST /positions", payload: { share_class_id: "${class_id}", security_id: "${sec_id}", quantity: 1000, cost_basis_total: 50000, opened_date: "2026-08-03" }, as: FundAccountant, captures: { pos_id: "$.data.id" } }
            - { call: "POST /reconciliation-breaks", payload: { fund_id: "${fund_id}", position_id: "${pos_id}", break_type: "BROKER_POSITION", break_date: "2026-08-04", counterparty_quantity: 900 }, as: FundAccountant, captures: { brk_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: FundController }
            - { call: "POST /reconciliation-breaks/escalate-overdue", payload: {}, as: FundController }
            - { call: "POST /regulatory-filings", payload: { fund_id: "${fund_id}", filing_type: "N_PORT", period_end: "2026-07-31" }, as: ComplianceOfficer, as_user_id: "comp_1", captures: { fil_id: "$.data.id" } }
            - { call: "POST /regulatory-filings/${fil_id}/submit-review", payload: {}, as: ComplianceOfficer, as_user_id: "comp_1" }
          trigger:
            - { call: "POST /regulatory-filings/${fil_id}/approve", payload: {}, as: FundController, as_user_id: "ctl_1", captures: { err: "$.data.error_id" } }
            - { call: "POST /reconciliation-breaks/${brk_id}/resolve", payload: { resolution_type: "NO_CHANGE" }, as: FundController }
            - { call: "POST /regulatory-filings/${fil_id}/approve", payload: {}, as: FundController, as_user_id: "ctl_1", captures: { st: "$.data.status" } }
          assert:
            - "While break ESCALATED: ${err} == ERR_BREAK_ESCALATED_BLOCKS (http 409)"
            - "After resolving the break (NO_CHANGE leaves position quantity 1000 untouched): ${st} == APPROVED"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: waiver_agreement_closed_interval_adjacency_rejected
        grounds:
          - entities.WaiverAgreement.fields.effective_from
          - entities.WaiverAgreement.fields.effective_to
          - errors[ERR_CAP_AGREEMENT_OVERLAP]
        distinguishing_aspect: |
          Interval semantics = closed day-intervals where touching endpoints
          count as overlap: a new agreement starting on the existing
          agreement's last day (2026-10-31) is rejected, while starting the
          next day (2026-11-01) is accepted.
        test_recipe:
          setup:
            - "Fund + class only; agreement A1 covers [2026-08-01, 2026-12-31... no: A1 covers [2026-08-01, 2026-10-31] cap 10bps"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: FundController }
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: null, rate_bps: 50 } ] }, as: FundController, captures: { fund_id: "$.data.id" } }
            - { call: "POST /share-classes", payload: { fund_id: "${fund_id}", class_ticker: "ALPHXI", distribution_frequency: "QUARTERLY" }, as: FundController, captures: { class_id: "$.data.id" } }
            - { call: "POST /waiver-agreements", payload: { share_class_id: "${class_id}", cap_bps: 10, effective_from: "2026-08-01", effective_to: "2026-10-31", recovery_window_months: 3 }, as: FundController, captures: { agmt1_id: "$.data.id" } }
          trigger:
            - { call: "POST /waiver-agreements", payload: { share_class_id: "${class_id}", cap_bps: 12, effective_from: "2026-10-31", effective_to: "2026-11-30", recovery_window_months: 3 }, as: FundController, captures: { err: "$.data.error_id" } }
            - { call: "POST /waiver-agreements", payload: { share_class_id: "${class_id}", cap_bps: 12, effective_from: "2026-11-01", effective_to: "2026-12-31", recovery_window_months: 3 }, as: FundController, captures: { agmt2_id: "$.data.id" } }
          assert:
            - "effective_from == 2026-10-31 (== A1.effective_to): ${err} == ERR_CAP_AGREEMENT_OVERLAP — closed intervals share that calendar day"
            - "effective_from == 2026-11-01 (A1.effective_to + 1 day): created, ${agmt2_id} is a non-empty UUID"
      - name: fee_invoice_contiguous_tiling_required
        grounds:
          - entities.FeeInvoice.fields.period_start
          - errors[ERR_FEE_PERIOD_NOT_CONTIGUOUS]
          - calculations.adviser_fee_tiered
        distinguishing_aspect: |
          Interval semantics = mandatory gapless tiling (the opposite treatment
          from waiver agreements): the next invoice for the same fund+fee_type
          MUST start exactly one day after the previous period_end; a one-day
          gap (2026-09-02) is rejected exactly as an overlap would be.
        test_recipe:
          setup:
            - "Base kit; FINAL NavRecords on 2026-08-04 (TNA 99999.73) and 2026-09-01 (TNA 99999.73)"
            - "Invoice I1 ADVISER 2026-08-01..2026-08-31 already created (gross_fee 42.47)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: FundController }
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: 100000000, rate_bps: 50 }, { up_to_net_assets: null, rate_bps: 40 } ] }, as: FundController, captures: { fund_id: "$.data.id" } }
            - { call: "POST /share-classes", payload: { fund_id: "${fund_id}", class_ticker: "ALPHXI", distribution_frequency: "QUARTERLY" }, as: FundController, captures: { class_id: "$.data.id" } }
            - { call: "POST /share-classes/${class_id}/capital-activity", payload: { activity_type: "SUBSCRIPTION", activity_date: "2026-08-03", shares: 10000 }, as: FundAccountant }
            - { call: "POST /securities", payload: { security_identifier: "CUSIP0001", description: "Acme Corp", asset_class: "EQUITY", default_pricing_level: "LEVEL_1", currency: "USD" }, as: FundAccountant, captures: { sec_id: "$.data.id" } }
            - { call: "POST /positions", payload: { share_class_id: "${class_id}", security_id: "${sec_id}", quantity: 1000, cost_basis_total: 50000, opened_date: "2026-08-03" }, as: FundAccountant }
            - { call: "POST /price-observations", payload: { security_id: "${sec_id}", price_date: "2026-08-04", price: 100.00, source: "EXCHANGE_CLOSE", pricing_level: "LEVEL_1" }, as: FundAccountant, captures: { px1_id: "$.data.id" } }
            - { call: "POST /price-observations/${px1_id}/approve", payload: {}, as: PricingCommittee }
            - { call: "POST /nav-records", payload: { share_class_id: "${class_id}", accounting_date: "2026-08-04" }, as: FundAccountant, as_user_id: "acct_1", captures: { nav1_id: "$.data.id", nav1_v: "$.data.version" } }
            - { call: "POST /nav-records/${nav1_id}/finalize", payload: { expected_nav_record_version: "${nav1_v}" }, as: FundController, as_user_id: "ctl_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: FundController }
            - { call: "POST /price-observations", payload: { security_id: "${sec_id}", price_date: "2026-09-01", price: 100.00, source: "EXCHANGE_CLOSE", pricing_level: "LEVEL_1" }, as: FundAccountant, captures: { px2_id: "$.data.id" } }
            - { call: "POST /price-observations/${px2_id}/approve", payload: {}, as: PricingCommittee }
            - { call: "POST /nav-records", payload: { share_class_id: "${class_id}", accounting_date: "2026-09-01" }, as: FundAccountant, as_user_id: "acct_1", captures: { nav2_id: "$.data.id", nav2_v: "$.data.version" } }
            - { call: "POST /nav-records/${nav2_id}/finalize", payload: { expected_nav_record_version: "${nav2_v}" }, as: FundController, as_user_id: "ctl_1" }
            - { call: "POST /fee-invoices", payload: { fund_id: "${fund_id}", fee_type: "ADVISER", period_start: "2026-08-01", period_end: "2026-08-31" }, as: FundAccountant, as_user_id: "acct_1", captures: { inv1_id: "$.data.id", inv1_gross: "$.data.gross_fee" } }
          trigger:
            - { call: "POST /fee-invoices", payload: { fund_id: "${fund_id}", fee_type: "ADVISER", period_start: "2026-09-02", period_end: "2026-09-30" }, as: FundAccountant, as_user_id: "acct_1", captures: { err: "$.data.error_id" } }
            - { call: "POST /fee-invoices", payload: { fund_id: "${fund_id}", fee_type: "ADVISER", period_start: "2026-09-01", period_end: "2026-09-30" }, as: FundAccountant, as_user_id: "acct_1", captures: { inv2_id: "$.data.id", inv2_gross: "$.data.gross_fee" } }
          assert:
            - "I1 created: gross_fee == 42.47 (${inv1_gross}; ADNA 99999.73 x 50bps x 31/365)"
