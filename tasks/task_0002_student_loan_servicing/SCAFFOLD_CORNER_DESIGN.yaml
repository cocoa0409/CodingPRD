        grounds:
          - concurrency_rules[discharge-approve-stale-loan]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / active_repayment_plan_supersede_semantics
          rationale: |
            The plan-create OCC variant is already covered by the §1.8 instance.
            The discharge-approve OCC rule is a sibling rule with identical mechanism (412
            on stale expected_loan_version_by_loan_id); the prior instance demonstrates
            the OCC machinery and additional duplication is not warranted.

