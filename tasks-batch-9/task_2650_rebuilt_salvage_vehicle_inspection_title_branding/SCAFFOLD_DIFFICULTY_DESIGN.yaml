  - rule_id: cross_entity_state_dependency
    instances:
      - name: submit_refused_because_owning_rebuilder_license_is_suspended
        grounds:
          - validations[priority=75]
          - state_machines.Rebuilder.ACTIVE_to_SUSPENDED
          - state_machines.RebuiltApplication.DRAFT_to_SUBMITTED
          - errors[ERR_REBUILDER_LICENSE_INACTIVE]
        distinguishing_aspect: |
          Entity pair RebuiltApplication -> Rebuilder: the application itself is faultless (DRAFT,
          documentation_completeness_pct 100.00, photo_view_count 4, funded), yet the submit is
          refused with ERR_REBUILDER_LICENSE_INACTIVE (403) purely because the OWNING Rebuilder row
          moved to license_status SUSPENDED after the application was opened.
        test_recipe:
          setup:
            - "a TRAILER vehicle on a SALVAGE title (REQUIRED_PART_CLASSES empty, so completeness is 100.00)"
            - "an application in DRAFT with four photo views on file and the rebuilder funded with 500000 cents"
            - "the rebuilder then SUSPENDED by admin-01"
          setup_api_calls:
            - call: "POST /v1/vehicles"
              payload: { vin: "1HGCM82633A005501", model_year: 2020, make: "Wells", model: "Cargo", body_class: "TRAILER", registered_state_code: "NV" }
