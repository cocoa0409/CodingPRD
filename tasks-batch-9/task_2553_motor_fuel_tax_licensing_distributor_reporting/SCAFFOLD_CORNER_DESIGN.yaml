          trigger:
            - call: "POST /mft/rack-removals"
              payload: { terminal_id: "${term_id}", position_holder_licensee_id: "${sup_id}", purchaser_licensee_id: "${dist_id}", product_code: "GASOLINE", gross_gallons: 8000.00, net_gallons: 7960.00, removal_date: "2026-07-28", destination_state: "MN", bill_of_lading_number: "BOL-CS-0001" }
