        claim_type: violation_to_error
        grounds: ["errors[ERR_INSUFFICIENT_DONATION_QTY]"]
        excluded_because:
          difficulty_instance: "boundary_precision_check / line_item_exact_remaining_quantity_boundary"
          rationale: "Asserted as the failure arm of the named 1.8 instance (reserve 4 with 3 available -> ERR_INSUFFICIENT_DONATION_QTY)."
      - name: error_clearance_invalid_and_blackout
        claim_type: violation_to_error
        grounds: ["errors[ERR_MEDICAL_CLEARANCE_INVALID]", "errors[ERR_TREATMENT_BLACKOUT_CONFLICT]"]
        excluded_because:
          difficulty_instance: "travel_clearance_safety_beats_blackout_temporal"
          rationale: "Both scheduling errors are triggered by the named 1.8 instance (and wish_event_blackout_closed_interval_overlap); ERR_URGENT_SLA_VIOLATION is covered by the active corner instance rapid_sla_deadline_boundary."
      - name: error_age_and_duplicate_and_territory
        claim_type: violation_to_error
        grounds: ["errors[ERR_CHILD_AGE_OUT_OF_RANGE]"]
        excluded_because:
          difficulty_instance: "referral_intake_age_216_months_boundary"
          rationale: "Upper age bound asserted by the named 1.8 instance; duplicate detection and territory fallback are covered by active corner instances in this file."

