              captures: { p_v3: $.data.version }
            - call: "POST /v1/change-orders"
              payload: { project_id: "${p_id}", expected_project_version: "${p_v3}", description: "Growth B", trade_code: "HULL_STEEL", pricing_mode: "LUMP_SUM", duration_days: 1, schedule_delta_days: 0, quantity: 1, unit_price_cents: 1000 }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { co_b: $.data.id }
          assert:
            - "first create succeeded (co_a bound), second create with the same captured version returned err == ERR_STALE_VERSION (412)"
            - "captured p_v3 > ${p_v2} (each successful create bumped the project version by 1)"
            - "retry with the freshly observed version succeeded (co_b bound)"
