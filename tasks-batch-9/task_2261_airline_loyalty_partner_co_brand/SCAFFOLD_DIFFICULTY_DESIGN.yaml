# §1.8 Scaffold Difficulty Design — Test Targeting Index
# task_2261_airline_loyalty_partner_co_brand
# Nine Difficulty Rules x 2 instances = 18 instances.
# Every numeric assert below was executed against the §1.3 formulas and their
# constants; all values are literals, never expressions.
scaffold_difficulty_design:

  # ===================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: mile_order_provisional_vs_final_tier_pricing
        grounds:
          - calculations.mile_purchase_order_pricing
          - state_machines.MilePurchaseOrder.fulfillment_status_PENDING_to_ISSUED
          - state_machines.MilePurchaseOrder.settlement_status_PENDING_to_INVOICED
          - entities.MilePurchaseOrder.fields.provisional_tier_price_centicents
          - entities.MilePurchaseOrder.fields.volume_true_up_cents
          - concurrency_rules[mile-purchase-order-stale-agreement]
        distinguishing_aspect: |
          The same order_miles priced twice against the same tier_schedule diverges because
          PROVISIONAL_AT_ORDER charges ONE tier price (chosen by where the order starts) for the
          whole order while FINAL_AT_INVOICE charges each tier slice its own marginal price:
          gross_amount_cents is 1450022 and final_amount_cents is 1300022 on identical inputs,
          leaving volume_true_up_cents at exactly -150000.
        test_recipe:
          setup:
            - "One LoyaltyProgram in revenue_recognition_state OPEN, current_period 2026-08."
            - "One CoBrandIssuer with annual_mile_purchase_cap_miles 20000000, status ACTIVE."
            - "One MileSaleAgreement in status ACTIVE, committed_volume_miles 8000000, tier_schedule [{0,160},{1000000,145},{5000000,130}], negotiated by user pm-1 and ratified by user co-1."
            - "One MilePurchaseOrder for 4999990 miles already ISSUED, so the agreement's drawn_miles is 4999990 and its prepayment_balance_miles is 4999990."
            - "Logical clock at its 2026-08-01T00:00:00Z default (never repositioned)."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Core", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /co-brand-issuers"
              payload: { program_id: "${prog_id}", name: "Northbank Card Services", annual_mile_purchase_cap_miles: 20000000 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { issuer_id: "$.data.id" }
            - call: "POST /mile-sale-agreements"
              payload:
                issuer_id: "${issuer_id}"
                term_start_date: "2026-09-01"
                term_end_date: "2027-08-31"
                committed_volume_miles: 8000000
                tier_schedule:
                  - { threshold_miles: 0, price_per_mile_centicents: 160 }
                  - { threshold_miles: 1000000, price_per_mile_centicents: 145 }
                  - { threshold_miles: 5000000, price_per_mile_centicents: 130 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { agr_id: "$.data.id" }
            - call: "POST /mile-sale-agreements/${agr_id}/submit"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-1"
            - call: "POST /mile-sale-agreements/${agr_id}/ratify"
              payload: {}
              as: ContractsOfficer
              as_user_id: "co-1"
            - call: "POST /mile-sale-agreements/${agr_id}/activate"
              payload: {}
              as: ContractsOfficer
              as_user_id: "co-1"
              captures: { agr_v_active: "$.data.version" }
            - call: "POST /mile-purchase-orders"
              payload: { agreement_id: "${agr_id}", order_miles: 4999990, expected_agreement_version: "${agr_v_active}" }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { order1_id: "$.data.id" }
            - call: "POST /mile-purchase-orders/${order1_id}/issue"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-1"
            - call: "GET /mile-sale-agreements/${agr_id}"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { agr_v_after_issue: "$.data.version", agr_drawn: "$.data.drawn_miles" }
          trigger:
            - call: "POST /mile-purchase-orders"
              payload: { agreement_id: "${agr_id}", order_miles: 1000015, expected_agreement_version: "${agr_v_after_issue}" }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { order2_id: "$.data.id" }
            - call: "POST /mile-purchase-orders/${order2_id}/issue"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-1"
            - call: "POST /mile-purchase-orders/${order2_id}/invoice"
              payload: {}
              as: RevenueAccountant
          assert:
            - "MilePurchaseOrder.${order2_id}.drawn_miles_before == 4999990"
            - "MilePurchaseOrder.${order2_id}.provisional_tier_price_centicents == 145"
            - "MilePurchaseOrder.${order2_id}.gross_amount_cents == 1450022"
            - "MilePurchaseOrder.${order2_id}.final_amount_cents == 1300022"
            - "MilePurchaseOrder.${order2_id}.volume_true_up_cents == -150000"
            - "MilePurchaseOrder.${order2_id}.net_amount_cents == 1300022"
            - "MilePurchaseOrder.${order2_id}.final_amount_cents != MilePurchaseOrder.${order2_id}.gross_amount_cents"
            - "MilePurchaseOrder.${order2_id}.fulfillment_status == ISSUED and settlement_status == INVOICED"
            - "MilePurchaseOrder.${order2_id}.posted_period == \"2026-08\""
            - "MileSaleAgreement.${agr_id}.drawn_miles == 6000005"
            - "LoyaltyProgram.${prog_id}.deferred_revenue_cents == 9300006"

      - name: program_breakage_historical_vs_forward_divergence
        grounds:
          - calculations.breakage_and_deferred_revenue
          - state_machines.LoyaltyProgram.OPEN_to_CLOSING
          - state_machines.LoyaltyProgram.CLOSING_to_LOCKED
          - state_machines.LoyaltyProgram.LOCKED_to_OPEN
          - entities.DeferredRevenuePosting.fields.method_applied
          - entities.LoyaltyProgram.fields.breakage_policy_mode
          - concurrency_rules[deferred-posting-stale-program]
        distinguishing_aspect: |
          This dual-variant pair lives in a different entity domain than the mile-sale pricing pair
          (DeferredRevenuePosting / program liability rather than MilePurchaseOrder / tier schedule):
          on one identical trailing bucket set (expired 200000, redeemed 1800000, issued 2400000)
          HISTORICAL_ATTRITION yields breakage_rate_bps 1000 while FORWARD_EXPECTATION yields 2500,
          because the historical variant divides expiries by miles that LEFT the program and the
          forward variant divides unredeemed miles by miles ISSUED.
        test_recipe:
          setup:
            - "One LoyaltyProgram, breakage_policy_mode HISTORICAL_ATTRITION, current_period 2026-08."
            - "One MemberAccount with a 2400000-mile card-spend earn, an 1800000-mile redemption and a 200000-mile expiry, all dated 2026-07-15, leaving mile_balance 400000 and program outstanding_miles 400000."
            - "One ACTIVE MileSaleAgreement with tier_schedule [{0,160}] whose single 500000-mile order is ISSUED, so deferred_revenue_cents is 800000."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Ledger", current_period: "2026-08", breakage_policy_mode: "HISTORICAL_ATTRITION" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /co-brand-issuers"
              payload: { program_id: "${prog_id}", name: "Northbank Card Services", annual_mile_purchase_cap_miles: 5000000 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { issuer_id: "$.data.id" }
            - call: "POST /mile-sale-agreements"
              payload:
                issuer_id: "${issuer_id}"
                term_start_date: "2026-09-01"
                term_end_date: "2027-08-31"
                committed_volume_miles: 1000000
                tier_schedule:
                  - { threshold_miles: 0, price_per_mile_centicents: 160 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { agr_id: "$.data.id" }
            - call: "POST /mile-sale-agreements/${agr_id}/submit"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-1"
            - call: "POST /mile-sale-agreements/${agr_id}/ratify"
              payload: {}
              as: ContractsOfficer
              as_user_id: "co-1"
            - call: "POST /mile-sale-agreements/${agr_id}/activate"
              payload: {}
              as: ContractsOfficer
              as_user_id: "co-1"
              captures: { agr_v: "$.data.version" }
            - call: "POST /mile-purchase-orders"
              payload: { agreement_id: "${agr_id}", order_miles: 500000, expected_agreement_version: "${agr_v}" }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { order_id: "$.data.id" }
            - call: "POST /mile-purchase-orders/${order_id}/issue"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-1"
            - call: "POST /member-accounts"
              payload: { program_id: "${prog_id}", external_member_ref: "MBR-0001", home_region: "AMER" }
              as: ProgramAdmin
              captures: { mem_id: "$.data.id" }
            - call: "POST /mile-transactions"
              payload: { member_id: "${mem_id}", txn_type: "CARD_SPEND_EARN", activity_date: "2026-07-15", qualifying_spend_cents: 240000000 }
              as: RevenueAccountant
            - call: "POST /mile-transactions"
              payload: { member_id: "${mem_id}", txn_type: "REDEEM", activity_date: "2026-07-15", base_miles: 1800000 }
              as: RevenueAccountant
            - call: "POST /mile-transactions"
              payload: { member_id: "${mem_id}", txn_type: "EXPIRY", activity_date: "2026-07-15", base_miles: 200000 }
              as: RevenueAccountant
            - call: "POST /loyalty-programs/${prog_id}/recognition-transitions"
              payload: { target_state: "CLOSING" }
              as: RevenueAccountant
              captures: { prog_v_closing: "$.data.version" }
          trigger:
            - call: "POST /deferred-revenue-postings"
              payload: { program_id: "${prog_id}", period: "2026-08", expected_program_version: "${prog_v_closing}" }
              as: RevenueAccountant
              captures: { post_aug_id: "$.data.id" }
            - call: "POST /loyalty-programs/${prog_id}/recognition-transitions"
              payload: { target_state: "LOCKED" }
              as: RevenueAccountant
            - call: "POST /loyalty-programs/${prog_id}/recognition-transitions"
              payload: { target_state: "OPEN" }
              as: RevenueAccountant
            - call: "POST /loyalty-programs/${prog_id}/recognition-transitions"
              payload: { target_state: "CLOSING" }
              as: RevenueAccountant
              captures: { prog_v_closing2: "$.data.version" }
            - call: "POST /deferred-revenue-postings"
              payload: { program_id: "${prog_id}", period: "2026-09", method: "FORWARD_EXPECTATION", expected_program_version: "${prog_v_closing2}" }
              as: RevenueAccountant
              captures: { post_sep_id: "$.data.id" }
          assert:
            - "DeferredRevenuePosting.${post_aug_id}.method_applied == HISTORICAL_ATTRITION"
            - "DeferredRevenuePosting.${post_aug_id}.expired_miles_trailing == 200000"
            - "DeferredRevenuePosting.${post_aug_id}.redeemed_miles_trailing == 1800000"
            - "DeferredRevenuePosting.${post_aug_id}.issued_miles_trailing == 2400000"
            - "DeferredRevenuePosting.${post_aug_id}.breakage_rate_bps == 1000"
            - "DeferredRevenuePosting.${post_aug_id}.deferred_balance_before_cents == 800000"
            - "DeferredRevenuePosting.${post_aug_id}.breakage_income_cents == 80000"
            - "DeferredRevenuePosting.${post_aug_id}.deferred_balance_after_cents == 720000"
            - "DeferredRevenuePosting.${post_sep_id}.method_applied == FORWARD_EXPECTATION"
            - "DeferredRevenuePosting.${post_sep_id}.breakage_rate_bps == 2500"
            - "DeferredRevenuePosting.${post_sep_id}.deferred_balance_before_cents == 720000"
            - "DeferredRevenuePosting.${post_sep_id}.breakage_income_cents == 180000"
            - "DeferredRevenuePosting.${post_sep_id}.deferred_balance_after_cents == 540000"
            - "DeferredRevenuePosting.${post_sep_id}.breakage_rate_bps != DeferredRevenuePosting.${post_aug_id}.breakage_rate_bps"
            - "LoyaltyProgram.${prog_id}.deferred_revenue_cents == 540000"
            - "LoyaltyProgram.${prog_id}.last_breakage_rate_bps == 2500"
            - "LoyaltyProgram.${prog_id}.lifetime_breakage_income_cents == 260000"
            - "LoyaltyProgram.${prog_id}.current_period == \"2026-09\""

  # ===================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: earn_stacking_mode_matrix_across_tier_and_promo_multiplier
        grounds:
          - calculations.earning_credit_with_multipliers
          - entities.MileTransaction.fields.stacking_mode_applied
          - entities.MileTransaction.fields.tier_bonus_miles
          - entities.PromotionCampaign.fields.stacking_mode
          - entities.MemberAccount.fields.elite_tier
        distinguishing_aspect: |
          Mode (a) multi-factor combination: the same base 8000 miles earned by the same PLATINUM
          member on three campaigns that differ ONLY in stacking_mode produces three different
          total_miles - EXCLUSIVE 16000 (tier bonus suppressed to 0), ADDITIVE 24000 and
          MULTIPLICATIVE 32000 - so no single factor pair can be collapsed and the tier x promo
          matrix must be evaluated cell by cell.
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08."
            - "Three FLIGHT-channel PromotionCampaigns, all multiplier_bps 20000, bonus_cap_miles omitted (unbounded), on adjacent non-overlapping windows: EXCLUSIVE over [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z), ADDITIVE over [2026-09-01T00:00:00Z, 2026-10-01T00:00:00Z), MULTIPLICATIVE over [2026-10-01T00:00:00Z, 2026-11-01T00:00:00Z)."
            - "The EXCLUSIVE campaign is already LIVE (run-epoch fired at the clock default); the other two are still SCHEDULED."
            - "One MemberAccount at elite_tier PLATINUM via a 180-day status match, security_state NORMAL."
            - "Logical clock at its 2026-08-01T00:00:00Z default; the trigger chain walks it forward so each campaign is LIVE exactly when its earn posts."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Earn Lab", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /promotion-campaigns"
              payload: { program_id: "${prog_id}", code: "EXC2X", earn_channel: "FLIGHT", multiplier_bps: 20000, stacking_mode: "EXCLUSIVE", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { camp_exc_id: "$.data.id" }
            - call: "POST /promotion-campaigns"
              payload: { program_id: "${prog_id}", code: "ADD2X", earn_channel: "FLIGHT", multiplier_bps: 20000, stacking_mode: "ADDITIVE", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { camp_add_id: "$.data.id" }
            - call: "POST /promotion-campaigns"
              payload: { program_id: "${prog_id}", code: "MUL2X", earn_channel: "FLIGHT", multiplier_bps: 20000, stacking_mode: "MULTIPLICATIVE", window_start: "2026-10-01T00:00:00Z", window_end: "2026-11-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { camp_mul_id: "$.data.id" }
            - call: "POST /member-accounts"
              payload: { program_id: "${prog_id}", external_member_ref: "MBR-PLAT", home_region: "EMEA" }
              as: ProgramAdmin
              captures: { mem_id: "$.data.id" }
            - call: "POST /member-accounts/${mem_id}/status-match"
              payload: { matched_tier: "PLATINUM", trial_days: 180 }
              as: ProgramAdmin
            - call: "POST /_ops/run-epoch"
              payload: { program_id: "${prog_id}" }
              as: ProgramAdmin
          trigger:
            - call: "POST /mile-transactions"
              payload: { member_id: "${mem_id}", txn_type: "FLIGHT_EARN", activity_date: "2026-08-01", base_miles: 8000, segments: 2, promotion_id: "${camp_exc_id}" }
              as: RevenueAccountant
              captures: { txn_exc_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /_ops/run-epoch"
              payload: { program_id: "${prog_id}" }
              as: ProgramAdmin
            - call: "POST /mile-transactions"
              payload: { member_id: "${mem_id}", txn_type: "FLIGHT_EARN", activity_date: "2026-09-01", base_miles: 8000, segments: 2, promotion_id: "${camp_add_id}" }
              as: RevenueAccountant
              captures: { txn_add_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /_ops/run-epoch"
              payload: { program_id: "${prog_id}" }
              as: ProgramAdmin
            - call: "POST /mile-transactions"
              payload: { member_id: "${mem_id}", txn_type: "FLIGHT_EARN", activity_date: "2026-10-01", base_miles: 8000, segments: 2, promotion_id: "${camp_mul_id}" }
              as: RevenueAccountant
              captures: { txn_mul_id: "$.data.id" }
          assert:
            - "MileTransaction.${txn_exc_id}.stacking_mode_applied == EXCLUSIVE"
            - "MileTransaction.${txn_exc_id}.tier_bonus_miles == 0"
            - "MileTransaction.${txn_exc_id}.bonus_miles == 8000"
            - "MileTransaction.${txn_exc_id}.total_miles == 16000"
            - "MileTransaction.${txn_add_id}.stacking_mode_applied == ADDITIVE"
            - "MileTransaction.${txn_add_id}.tier_bonus_miles == 8000"
            - "MileTransaction.${txn_add_id}.bonus_miles == 8000"
            - "MileTransaction.${txn_add_id}.total_miles == 24000"
            - "MileTransaction.${txn_mul_id}.stacking_mode_applied == MULTIPLICATIVE"
            - "MileTransaction.${txn_mul_id}.tier_bonus_miles == 8000"
            - "MileTransaction.${txn_mul_id}.bonus_miles == 16000"
            - "MileTransaction.${txn_mul_id}.total_miles == 32000"
            - "MileTransaction.${txn_exc_id}.total_miles != MileTransaction.${txn_add_id}.total_miles"
            - "MileTransaction.${txn_add_id}.total_miles != MileTransaction.${txn_mul_id}.total_miles"
            - "MileTransaction.${txn_exc_id}.qualifying_miles_credited == 8000"
            - "MileTransaction.${txn_exc_id}.promo_multiplier_bps == 20000"
            - "PromotionCampaign.${camp_exc_id}.status == ENDED and PromotionCampaign.${camp_mul_id}.status == LIVE"
            - "MemberAccount.${mem_id}.mile_balance == 72000"
            - "MemberAccount.${mem_id}.qualifying_miles_ytd == 24000"
            - "MemberAccount.${mem_id}.qualifying_segments_ytd == 6"

      - name: mile_order_final_amount_rounds_per_tier_slice_then_sums
        grounds:
          - calculations.mile_purchase_order_pricing
          - entities.MilePurchaseOrder.fields.final_amount_cents
          - state_machines.MilePurchaseOrder.settlement_status_PENDING_to_INVOICED
        distinguishing_aspect: |
          Mode (b) rounding-boundary combination: the order straddles a tier boundary into two
          slices whose exact centicent products both end in .5 (14.5 and 1300006.5), so rounding
          each slice to whole cents BEFORE summing yields final_amount_cents 1300022 while the
          plausible-but-wrong sum-then-round order yields 1300021 - a one-cent fork that only a
          per-slice implementation can hit.
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08."
            - "One ACTIVE MileSaleAgreement with tier_schedule [{0,160},{1000000,145},{5000000,130}], committed_volume_miles 8000000, whose drawn_miles is exactly 4999990 after a first ISSUED order."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Rounding Lab", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /co-brand-issuers"
              payload: { program_id: "${prog_id}", name: "Northbank Card Services", annual_mile_purchase_cap_miles: 20000000 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { issuer_id: "$.data.id" }
            - call: "POST /mile-sale-agreements"
              payload:
                issuer_id: "${issuer_id}"
                term_start_date: "2026-09-01"
                term_end_date: "2027-08-31"
                committed_volume_miles: 8000000
                tier_schedule:
                  - { threshold_miles: 0, price_per_mile_centicents: 160 }
                  - { threshold_miles: 1000000, price_per_mile_centicents: 145 }
                  - { threshold_miles: 5000000, price_per_mile_centicents: 130 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { agr_id: "$.data.id" }
            - call: "POST /mile-sale-agreements/${agr_id}/submit"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-1"
            - call: "POST /mile-sale-agreements/${agr_id}/ratify"
              payload: {}
              as: ContractsOfficer
              as_user_id: "co-1"
            - call: "POST /mile-sale-agreements/${agr_id}/activate"
              payload: {}
              as: ContractsOfficer
              as_user_id: "co-1"
              captures: { agr_v: "$.data.version" }
            - call: "POST /mile-purchase-orders"
              payload: { agreement_id: "${agr_id}", order_miles: 4999990, expected_agreement_version: "${agr_v}" }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { order1_id: "$.data.id" }
            - call: "POST /mile-purchase-orders/${order1_id}/issue"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-1"
            - call: "GET /mile-sale-agreements/${agr_id}"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { agr_v2: "$.data.version" }
            - call: "POST /mile-purchase-orders"
              payload: { agreement_id: "${agr_id}", order_miles: 1000015, expected_agreement_version: "${agr_v2}" }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { order2_id: "$.data.id" }
            - call: "POST /mile-purchase-orders/${order2_id}/issue"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-1"
          trigger:
            - call: "POST /mile-purchase-orders/${order2_id}/invoice"
              payload: {}
              as: RevenueAccountant
          assert:
            - "MilePurchaseOrder.${order2_id}.final_amount_cents == 1300022"
            - "MilePurchaseOrder.${order2_id}.final_amount_cents != 1300021"
            - "MilePurchaseOrder.${order1_id}.gross_amount_cents == 7999984"
            - "MilePurchaseOrder.${order2_id}.volume_true_up_cents == -150000"
            - "MilePurchaseOrder.${order2_id}.settlement_status == INVOICED"

  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: mile_sale_agreement_counter_revise_negotiation_cycle
        grounds:
          - state_machines.MileSaleAgreement.DRAFT_to_ISSUER_REVIEW
          - state_machines.MileSaleAgreement.ISSUER_REVIEW_to_COUNTERED
          - state_machines.MileSaleAgreement.COUNTERED_to_DRAFT
          - state_machines.MileSaleAgreement.ISSUER_REVIEW_to_RATIFIED
          - entities.MileSaleAgreement.fields.negotiation_round
          - validations[priority=10]
        distinguishing_aspect: |
          Cyclic shape: the agreement returns to DRAFT twice through
          ISSUER_REVIEW -> COUNTERED -> DRAFT, so negotiation_round reads exactly 3 when the third
          lap is ratified - the state alone cannot tell the laps apart, only the counter that the
          cycle increments can.
        test_recipe:
          setup:
            - "One LoyaltyProgram and one ACTIVE CoBrandIssuer with annual_mile_purchase_cap_miles 10000000."
            - "One MileSaleAgreement already back in DRAFT after ONE completed negotiation lap, so negotiation_round is 2 and countered_committed_volume_miles is 5000000."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Negotiation", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /co-brand-issuers"
              payload: { program_id: "${prog_id}", name: "Northbank Card Services", annual_mile_purchase_cap_miles: 10000000 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { issuer_id: "$.data.id" }
            - call: "POST /mile-sale-agreements"
              payload:
                issuer_id: "${issuer_id}"
                term_start_date: "2026-09-01"
                term_end_date: "2027-08-31"
                committed_volume_miles: 6000000
                tier_schedule:
                  - { threshold_miles: 0, price_per_mile_centicents: 170 }
                  - { threshold_miles: 2000000, price_per_mile_centicents: 155 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { agr_id: "$.data.id" }
            - call: "POST /mile-sale-agreements/${agr_id}/submit"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-1"
            - call: "POST /mile-sale-agreements/${agr_id}/counter"
              payload: { counter_price_per_mile_centicents: 150, counter_committed_volume_miles: 5000000, note: "first counter" }
              as: IssuerRepresentative
              as_user_id: "${issuer_id}"
            - call: "POST /mile-sale-agreements/${agr_id}/revise"
              payload:
                committed_volume_miles: 5500000
                tier_schedule:
                  - { threshold_miles: 0, price_per_mile_centicents: 165 }
                  - { threshold_miles: 2000000, price_per_mile_centicents: 150 }
              as: PartnerManager
              as_user_id: "pm-1"
          trigger:
            - call: "POST /mile-sale-agreements/${agr_id}/submit"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-1"
            - call: "POST /mile-sale-agreements/${agr_id}/counter"
              payload: { counter_price_per_mile_centicents: 145, counter_committed_volume_miles: 4800000, note: "second counter" }
              as: IssuerRepresentative
              as_user_id: "${issuer_id}"
            - call: "POST /mile-sale-agreements/${agr_id}/revise"
              payload:
                committed_volume_miles: 5000000
                tier_schedule:
                  - { threshold_miles: 0, price_per_mile_centicents: 160 }
                  - { threshold_miles: 2000000, price_per_mile_centicents: 148 }
              as: PartnerManager
              as_user_id: "pm-1"
            - call: "POST /mile-sale-agreements/${agr_id}/submit"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-1"
            - call: "POST /mile-sale-agreements/${agr_id}/ratify"
              payload: {}
              as: ContractsOfficer
              as_user_id: "co-1"
          assert:
            - "MileSaleAgreement.${agr_id}.negotiation_round == 3"
            - "MileSaleAgreement.${agr_id}.status == RATIFIED"
            - "MileSaleAgreement.${agr_id}.committed_volume_miles == 5000000"
            - "MileSaleAgreement.${agr_id}.countered_committed_volume_miles == 4800000"
            - "MileSaleAgreement.${agr_id}.countered_price_per_mile_centicents == 145"
            - "MileSaleAgreement.${agr_id}.negotiated_by_user_id == \"pm-1\""
            - "MileSaleAgreement.${agr_id}.ratified_by_user_id == \"co-1\""
            - "CoBrandIssuer.${issuer_id}.aggregate_committed_miles == 5000000"
            - "CoBrandIssuer.${issuer_id}.status == ACTIVE"

      - name: mile_purchase_order_parallel_fulfillment_and_settlement_dimensions
        grounds:
          - state_machines.MilePurchaseOrder.fulfillment_status_PENDING_to_ISSUED
          - state_machines.MilePurchaseOrder.settlement_status_PENDING_to_INVOICED
          - state_machines.MilePurchaseOrder.settlement_status_INVOICED_to_SETTLED
          - entities.MilePurchaseOrder.fields.fulfillment_status
          - entities.MilePurchaseOrder.fields.settlement_status
          - validations[priority=8]
        distinguishing_aspect: |
          Parallel-dimension shape (as opposed to the cyclic shape of the negotiation instance): one
          MilePurchaseOrder row carries two independent axes, and the cash axis is GATED by the
          delivery axis - invoicing a (PENDING, PENDING) order is rejected with ERR_INVALID_STATE,
          while the very same call succeeds once the row is (ISSUED, PENDING), ending at
          (ISSUED, SETTLED).
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08."
            - "One ACTIVE MileSaleAgreement with tier_schedule [{0,200}] and committed_volume_miles 1000000."
            - "One MilePurchaseOrder for 100000 miles at (fulfillment_status PENDING, settlement_status PENDING) with gross_amount_cents 200000."
