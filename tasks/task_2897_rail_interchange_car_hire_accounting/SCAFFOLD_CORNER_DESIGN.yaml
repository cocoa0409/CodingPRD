      - name: body_foreign_key_not_found_is_reported_after_shape_and_enum
        claim_type: Verify every error code is triggerable
        grounds:
          - validations.priority_8_body_fk_not_found
          - validations.priority_6_ERR_INVALID_REQUEST
          - validations.priority_7_ERR_INVALID_ENUM_VALUE
          - errors.ERR_ENTITY_NOT_FOUND_umbrella
        distinguishing_aspect: "The NOT_FOUND family is reachable by TWO routes with different orderings — path ids at priority 5 (before shape) and body foreign keys at priority 8 (after shape and enum) — so a body that is simultaneously malformed and dangling reports ERR_INVALID_REQUEST, a body with a bad enum and a dangling key reports ERR_INVALID_ENUM_VALUE, and only a well-formed body with a dangling key reports the entity-specific 404."
