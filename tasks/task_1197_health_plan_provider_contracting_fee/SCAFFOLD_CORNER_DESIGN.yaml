# =============================================================================
# 1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1197: Health Plan Provider Contracting & Fee Schedule Load
# =============================================================================
scaffold_corner_design:
- section: entities
  instances:
  - name: provider_creation_applies_system_defaults
    claim_type: creation
    grounds:
    - entities.Provider.fields.provider_status
    distinguishing_aspect: Creating a provider with exactly the required inputs returns 201 with provider_status ACTIVE, version 1, and server-minted id/created_at/updated_at.
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: POST /providers
        payload:
          legal_name: Prov A
          tin: TIN-A
          npi: NPI-A
          locality_code: L01
        as: PlanAdmin
        captures:
          st: $.data.provider_status
          v: $.data.version
      assert:
      - st == ACTIVE
      - v == 1
      - response carries server-minted id, created_at, updated_at
  - name: contract_and_entry_defaults_applied
    claim_type: defaults
    grounds:
    - entities.Contract.fields.auto_renew
    - entities.FeeScheduleEntry.fields.benchmark_lookup_mode
    distinguishing_aspect: Omitting auto_renew on contract create stores false; omitting benchmark_lookup_mode on entry create stores STRICT.
    test_recipe:
      setup:
      - contract in IN_CONFIGURATION with DRAFT version 1
      setup_api_calls:
      - call: POST /networks
        payload:
          name: PPO-NET
          line_of_business: COMMERCIAL_PPO
        as: PlanAdmin
        captures:
          net_id: $.data.id
      - call: POST /providers
        payload:
          legal_name: Prov A
          tin: TIN-A
          npi: NPI-A
          locality_code: L01
        as: PlanAdmin
        captures:
          prov_id: $.data.id
      - call: POST /providers/${prov_id}/contracts
        payload:
          network_id: ${net_id}
          base_effective_date: '2026-07-01'
          term_months: 36
          escalator_bps: 0
          escalator_mode: ANNIVERSARY
          auto_renew: false
        as: ContractManager
        captures:
          ct_id: $.data.id
      - call: POST /contracts/${ct_id}/begin-negotiation
        as: ContractManager
      - call: POST /contracts/${ct_id}/submit-for-signature
        as: ContractManager
        as_user_id: cm-1
      - call: POST /contracts/${ct_id}/sign
        as: ContractLegal
        as_user_id: cl-1
      - call: POST /contracts/${ct_id}/begin-configuration
        as: ConfigurationAnalyst
        captures:
          ct_v: $.data.version
      - call: POST /contracts/${ct_id}/versions
        payload:
          version_number: 1
          effective_date: '2026-07-01'
          expected_contract_version: ${ct_v}
        as: ContractManager
        captures:
          v1_id: $.data.id
      trigger:
      - call: GET /contracts/${ct_id}
        as: PlanAdmin
        captures:
          ar: $.data.auto_renew
      - call: POST /contract-versions/${v1_id}/fee-schedule-entries
        payload:
          hcpcs_code: '99213'
          service_category: OFFICE_VISIT
          rate_type: FLAT_RATE
          flat_rate_cents: 5000
        as: ConfigurationAnalyst
        captures:
          lm: $.data.benchmark_lookup_mode
      assert:
      - ar == false (default applied)
      - lm == STRICT (default applied)
  - name: provider_missing_required_tin_returns_invalid_request
    claim_type: required_fields
    grounds:
    - entities.Provider.fields.tin
    - validations[priority=1]
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: Omitting the required input field tin is rejected at schema validation (priority 1) before any auth check.
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: POST /providers
        payload:
          legal_name: Prov A
          npi: NPI-A
          locality_code: L01
        as: PlanAdmin
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_INVALID_REQUEST
  - name: contract_invalid_enum_returns_invalid_request
    claim_type: type_constraints
    grounds:
    - entities.Contract.fields.escalator_mode
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: escalator_mode value MONTHLY is outside the declared enum {ANNIVERSARY, CALENDAR} and is rejected.
    test_recipe:
      setup:
      - network and provider exist
      setup_api_calls:
      - call: POST /networks
        payload:
          name: PPO-NET
          line_of_business: COMMERCIAL_PPO
        as: PlanAdmin
        captures:
          net_id: $.data.id
      - call: POST /providers
        payload:
          legal_name: Prov A
          tin: TIN-A
          npi: NPI-A
          locality_code: L01
        as: PlanAdmin
        captures:
          prov_id: $.data.id
      trigger:
      - call: POST /providers/${prov_id}/contracts
        payload:
          network_id: ${net_id}
          base_effective_date: '2026-07-01'
          term_months: 36
          escalator_bps: 0
          escalator_mode: MONTHLY
          auto_renew: false
        as: ContractManager
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_INVALID_REQUEST
  - name: contract_get_returns_not_found
    claim_type: not_found
    grounds:
    - errors[ERR_CONTRACT_NOT_FOUND]
    - validations[priority=5]
    distinguishing_aspect: GET with a well-formed but unknown contract UUID returns ERR_CONTRACT_NOT_FOUND (404).
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: GET /contracts/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2
        as: PlanAdmin
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_CONTRACT_NOT_FOUND
  - name: nested_create_with_unknown_parent_returns_not_found
    claim_type: parent_relationships
    grounds:
    - entities.Contract.parent
    - errors[ERR_PROVIDER_NOT_FOUND]
    distinguishing_aspect: Creating a contract under a non-existent provider id fails with ERR_PROVIDER_NOT_FOUND; the child is never created.
    test_recipe:
      setup:
      - a network exists
      setup_api_calls:
      - call: POST /networks
        payload:
          name: PPO-NET
          line_of_business: COMMERCIAL_PPO
        as: PlanAdmin
        captures:
          net_id: $.data.id
      trigger:
      - call: POST /providers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/contracts
        payload:
          network_id: ${net_id}
          base_effective_date: '2026-07-01'
          term_months: 36
          escalator_bps: 0
          escalator_mode: ANNIVERSARY
          auto_renew: false
        as: ContractManager
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_PROVIDER_NOT_FOUND
  - name: audit_event_immutable_shape
    claim_type: immutability
    grounds:
    - entities.AuditEvent
    distinguishing_aspect: 'AuditEvent declares common_fields: false — list entries expose id and created_at but no version or updated_at, and no update/delete endpoint exists for the entity.'
    test_recipe:
      setup:
      - contract created (which appends CONTRACT_CREATED)
      setup_api_calls:
      - call: POST /networks
        payload:
          name: PPO-NET
          line_of_business: COMMERCIAL_PPO
        as: PlanAdmin
        captures:
          net_id: $.data.id
      - call: POST /providers
        payload:
          legal_name: Prov A
          tin: TIN-A
          npi: NPI-A
          locality_code: L01
        as: PlanAdmin
        captures:
          prov_id: $.data.id
      - call: POST /providers/${prov_id}/contracts
        payload:
          network_id: ${net_id}
          base_effective_date: '2026-07-01'
          term_months: 36
          escalator_bps: 0
          escalator_mode: ANNIVERSARY
          auto_renew: false
        as: ContractManager
        captures:
          ct_id: $.data.id
      trigger:
      - call: GET /contracts/${ct_id}/audit-events
        as: PlanAdmin
      assert:
      - GET /contracts/${ct_id}/audit-events returns at least one event (CONTRACT_CREATED)
      - each event carries id, created_at, event_type, actor_role, actor_id, occurred_at — and no version field
  - name: entry_computed_rate_after_mapping
    claim_type: computed_fields
    grounds:
    - entities.FeeScheduleEntry.fields.computed_rate_cents
    - calculations.entry_rate_computation
    distinguishing_aspect: computed_rate_cents is null at creation and system-populated to 10000 by map-benchmark (10000 benchmark x 10000 bps); the client never supplies it.
    test_recipe:
      setup:
      - contract in IN_CONFIGURATION; version 1 DRAFT; benchmark 99213/L01/2026 PUBLISHED at 10000
      setup_api_calls:
      - call: POST /networks
        payload:
          name: PPO-NET
          line_of_business: COMMERCIAL_PPO
        as: PlanAdmin
        captures:
          net_id: $.data.id
      - call: POST /medicare-benchmarks
        payload:
          benchmark_year: 2026
          locality_code: L01
          hcpcs_code: '99213'
          benchmark_amount_cents: 10000
        as: PlanAdmin
        captures:
          b_id: $.data.id
      - call: POST /medicare-benchmarks/${b_id}/publish
        as: PlanAdmin
      - call: POST /providers
        payload:
          legal_name: Prov A
          tin: TIN-A
          npi: NPI-A
          locality_code: L01
        as: PlanAdmin
        captures:
          prov_id: $.data.id
      - call: POST /providers/${prov_id}/contracts
        payload:
          network_id: ${net_id}
          base_effective_date: '2026-07-01'
          term_months: 36
          escalator_bps: 0
          escalator_mode: ANNIVERSARY
          auto_renew: false
        as: ContractManager
        captures:
          ct_id: $.data.id
      - call: POST /contracts/${ct_id}/begin-negotiation
        as: ContractManager
      - call: POST /contracts/${ct_id}/submit-for-signature
        as: ContractManager
        as_user_id: cm-1
      - call: POST /contracts/${ct_id}/sign
        as: ContractLegal
        as_user_id: cl-1
      - call: POST /contracts/${ct_id}/begin-configuration
        as: ConfigurationAnalyst
        captures:
          ct_v: $.data.version
      - call: POST /contracts/${ct_id}/versions
        payload:
          version_number: 1
          effective_date: '2026-07-01'
          expected_contract_version: ${ct_v}
        as: ContractManager
        captures:
          v1_id: $.data.id
      trigger:
      - call: POST /contract-versions/${v1_id}/fee-schedule-entries
        payload:
          hcpcs_code: '99213'
          service_category: OFFICE_VISIT
          rate_type: PERCENT_OF_MEDICARE
          pct_of_medicare_bps: 10000
        as: ConfigurationAnalyst
        captures:
          e1_id: $.data.id
          pre: $.data.computed_rate_cents
      - call: POST /fee-schedule-entries/${e1_id}/map-benchmark
        as: ConfigurationAnalyst
        captures:
          post: $.data.computed_rate_cents
          rb: $.data.resolved_benchmark_cents
          mb: $.data.medicare_benchmark_id
      assert:
      - pre == null
      - post == 10000 and rb == 10000
      - mb == ${b_id}
- section: state_machines
  instances:
  - name: sign_from_draft_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.Contract.transitions
    - errors[ERR_CONTRACT_INVALID_STATE]
    distinguishing_aspect: sign is not in the transition set from DRAFT; the attempt is rejected and no audit event is appended.
    test_recipe:
      setup:
      - contract in DRAFT
      setup_api_calls:
      - call: POST /networks
        payload:
          name: PPO-NET
          line_of_business: COMMERCIAL_PPO
        as: PlanAdmin
        captures:
          net_id: $.data.id
      - call: POST /providers
        payload:
          legal_name: Prov A
          tin: TIN-A
          npi: NPI-A
          locality_code: L01
        as: PlanAdmin
        captures:
          prov_id: $.data.id
      - call: POST /providers/${prov_id}/contracts
        payload:
          network_id: ${net_id}
          base_effective_date: '2026-07-01'
          term_months: 36
          escalator_bps: 0
          escalator_mode: ANNIVERSARY
          auto_renew: false
        as: ContractManager
        captures:
          ct_id: $.data.id
      trigger:
      - call: POST /contracts/${ct_id}/sign
        as: ContractLegal
        as_user_id: cl-1
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_CONTRACT_INVALID_STATE
      - Contract ${ct_id}.contract_status == DRAFT
  - name: terminated_contract_rejects_begin_negotiation
    claim_type: terminal_lockdown
    grounds:
    - state_machines.Contract.terminal_states
    - errors[ERR_CONTRACT_INVALID_STATE]
    distinguishing_aspect: 'TERMINATED is terminal: begin-negotiation after termination finalize fails with ERR_CONTRACT_INVALID_STATE.'
    test_recipe:
      setup:
      - contract TERMINATED via issued + finalized notice (clock at termination_date)
      setup_api_calls:
      - call: POST /networks
        payload:
          name: PPO-NET
          line_of_business: COMMERCIAL_PPO
        as: PlanAdmin
        captures:
          net_id: $.data.id
      - call: POST /medicare-benchmarks
        payload:
          benchmark_year: 2026
          locality_code: L01
          hcpcs_code: '99213'
          benchmark_amount_cents: 10000
        as: PlanAdmin
        captures:
          b_id: $.data.id
      - call: POST /medicare-benchmarks/${b_id}/publish
        as: PlanAdmin
      - call: POST /providers
        payload:
          legal_name: Prov A
          tin: TIN-A
          npi: NPI-A
          locality_code: L01
        as: PlanAdmin
        captures:
          prov_id: $.data.id
      - call: POST /providers/${prov_id}/contracts
        payload:
          network_id: ${net_id}
          base_effective_date: '2026-07-01'
          term_months: 36
          escalator_bps: 0
          escalator_mode: ANNIVERSARY
          auto_renew: false
        as: ContractManager
        captures:
          ct_id: $.data.id
      - call: POST /contracts/${ct_id}/begin-negotiation
        as: ContractManager
      - call: POST /contracts/${ct_id}/submit-for-signature
        as: ContractManager
        as_user_id: cm-1
      - call: POST /contracts/${ct_id}/sign
        as: ContractLegal
        as_user_id: cl-1
      - call: POST /contracts/${ct_id}/begin-configuration
        as: ConfigurationAnalyst
        captures:
          ct_v: $.data.version
      - call: POST /contracts/${ct_id}/versions
        payload:
          version_number: 1
          effective_date: '2026-07-01'
          expected_contract_version: ${ct_v}
        as: ContractManager
        captures:
          v1_id: $.data.id
      - call: POST /contract-versions/${v1_id}/fee-schedule-entries
        payload:
          hcpcs_code: '99213'
          service_category: OFFICE_VISIT
          rate_type: PERCENT_OF_MEDICARE
          pct_of_medicare_bps: 10000
        as: ConfigurationAnalyst
        captures:
          e1_id: $.data.id
      - call: POST /fee-schedule-entries/${e1_id}/map-benchmark
        as: ConfigurationAnalyst
      - call: POST /contract-versions/${v1_id}/load
        as: ConfigurationAnalyst
      - call: POST /contract-versions/${v1_id}/validate
        as: ConfigurationAnalyst
      - call: POST /contracts/${ct_id}/begin-testing
        as: ConfigurationAnalyst
      - call: POST /contract-versions/${v1_id}/simulation-batches
        payload:
          label: B1
        as: ConfigurationAnalyst
        captures:
          bt_id: $.data.id
      - call: POST /simulation-batches/${bt_id}/claims
        payload:
          hcpcs_code: '99213'
          service_category: OFFICE_VISIT
          service_date: '2026-07-15'
          billed_cents: 15000
          expected_allowed_cents: 10000
        as: ConfigurationAnalyst
      - call: POST /simulation-batches/${bt_id}/price
        as: ConfigurationAnalyst
      - call: POST /simulation-batches/${bt_id}/score
        as: ConfigurationAnalyst
      - call: POST /contracts/${ct_id}/mark-ready
        as: ConfigurationAnalyst
      - call: POST /contracts/${ct_id}/approve-go-live
        as: PlanAdmin
        captures:
          ct_live: $.data.version
      - call: POST /contracts/${ct_id}/termination-notices
        payload:
          notice_date: '2026-05-01'
          termination_date: '2026-08-15'
          reason: WITHOUT_CAUSE
          expected_contract_version: ${ct_live}
        as: ContractManager
        captures:
          nt_id: $.data.id
      - call: POST /termination-notices/${nt_id}/issue
        as: ContractManager
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-15T00:00:00Z'
        as: PlanAdmin
      - call: POST /termination-notices/${nt_id}/finalize
        as: PlanAdmin
      trigger:
      - call: POST /contracts/${ct_id}/begin-negotiation
        as: ContractManager
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_CONTRACT_INVALID_STATE
      - Contract ${ct_id}.contract_status == TERMINATED
  - name: settle_after_reject_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.RetroAdjustment.transitions
    - errors[ERR_ADJUSTMENT_INVALID_STATE]
    distinguishing_aspect: REJECTED is terminal for an adjustment; settle after reject fails with ERR_ADJUSTMENT_INVALID_STATE.
