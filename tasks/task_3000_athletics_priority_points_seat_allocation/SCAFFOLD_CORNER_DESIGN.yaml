            - call: "POST /athletics/donors/${wal_id}/status-change"
              payload: { new_status: "LAPSED", effective_date: "2026-04-01T00:00:00.000Z", reason: "retry with a fresh version", expected_donor_version: "${wal_v5}" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
          assert:
            - "The initial GET returns version == 1; a read never advances the counter"
            - "After the gift create Donor.${wal_id}.version == 2 while Gift.${walg_id}.version == 1 and gift_status == \"PLEDGED\" (the default)"
            - "After the settle Donor.${wal_id}.version == 3 and Gift.${walg_id}.version == 2 with gift_status == \"RECEIVED\""
            - "After the season-ticket renewal Donor.${wal_id}.version == 4, season_ticket_seasons_purchased == 1 and season_ticket_first_cycle_year == 2026, so ${wal_v4} == 4"
            - "After the run Donor.${wal_id}.version == 5 and certified_points == 18.00 (S1 10.00 + S4 5.00 for a one-year streak + S5 3.00 for one season + S6 0.00 for NON_ALUMNUS)"
            - "The status-change carrying the pre-run ${wal_v4} == 4 returns HTTP 412 with error_id == \"ERR_STALE_VERSION\" — the run invalidated a token the client never used against the donor endpoint"
            - "After the 412 Donor.${wal_id}.donor_status is still \"ACTIVE\", status_effective_date is still null and version is still 5, so ${wal_v5} == 5"
            - "The retry with ${wal_v5} returns HTTP 200 with donor_status == \"LAPSED\", status_effective_date == \"2026-04-01T00:00:00.000Z\" and version == 6"
            - "certified_points is still 18.00 after the LAPSED move — LAPSED retains the alumni bonus eligibility set, and no recalculation ran"

      - name: reseating_drags_a_fully_paid_assignment_backwards_on_the_payment_axis_only
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Section.transitions.REPRICED_to_RESEATING
          - state_machines.SeatAssignment.transitions.PAID_to_INVOICED
