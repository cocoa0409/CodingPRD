          target DriveUnit is in {ACTIVE, CHARGING}; an EN_ROUTE unit's window
          stays SCHEDULED (no transition fires) until the unit returns. The
          dependency crosses a different entity pair from the PickTask-FloorZone
          instance.
        test_recipe:
          setup:
            - "Zones Z1, Z2. Pod P1 in Z1 with SKU1 qty 5. PickStation ST1 in Z2. DriveUnit DU1. CustomerOrder O1 line qty 1. PickTask PT1 dispatched — DU1 is EN_ROUTE. MaintenanceWindow MW1 on DU1 with starts_at=2026-09-01T09:00:00Z ends_at=2026-09-01T09:30:00Z kind=CORRECTIVE."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/zones"
              payload: { zone_code: "Z1", grid_x: 0, grid_y: 0, width: 10, height: 10, max_human_occupancy: 2 }
              as: FleetAdmin
              captures: { z1: $.data.id }
            - call: "POST /fleet/zones"
              payload: { zone_code: "Z2", grid_x: 10, grid_y: 0, width: 10, height: 10, max_human_occupancy: 2 }
              as: FleetAdmin
              captures: { z2: $.data.id }
            - call: "POST /fleet/drive-units"
              payload: { unit_code: "DU1", home_zone_id: "${z1}" }
              as: FleetAdmin
              captures: { du1: $.data.id }
            - call: "POST /fleet/pods"
              payload: { pod_code: "P1", zone_id: "${z1}", slot_capacity: 5 }
              as: FleetAdmin
              captures: { p1: $.data.id }
            - call: "POST /fleet/skus"
              payload: { sku_code: "SKU1", velocity_class: "LOW" }
              as: FleetAdmin
              captures: { sku1: $.data.id, sku1_v: $.data.version }
            - call: "POST /fleet/pick-stations"
              payload: { station_code: "ST1", zone_id: "${z2}", max_queue: 5 }
              as: FleetAdmin
              captures: { st1: $.data.id }
            - call: "POST /fleet/stow-tasks"
              payload: { sku_id: "${sku1}", quantity: 5 }
              as: FlowController
              captures: { stow1: $.data.id }
            - call: "POST /fleet/stow-tasks/${stow1}/place"
              payload: { expected_sku_version: "${sku1_v}" }
              as: FlowController
            - call: "POST /fleet/stow-tasks/${stow1}/confirm"
              payload: {}
              as: StationOperator
            - call: "POST /fleet/customer-orders"
              payload: { order_code: "O1", cutoff_at: "2026-09-02T00:00:00Z", priority: 1, lines: [{sku_id: "${sku1}", quantity: 1}] }
              as: FlowController
              captures: { o1: $.data.id }
            - call: "GET /fleet/customer-orders/${o1}/lines"
              as: FlowController
              captures: { o1_line: "$.data[0].id" }
            - call: "POST /fleet/pick-tasks"
              payload: { order_id: "${o1}", line_id: "${o1_line}", pod_id: "${p1}", station_id: "${st1}", quantity: 1 }
              as: FlowController
              captures: { pt1: $.data.id }
            - call: "GET /fleet/pick-stations/${st1}"
              as: FlowController
              captures: { st1_v: $.data.version }
            - call: "POST /fleet/pick-tasks/${pt1}/sequence"
              payload: { expected_station_version: "${st1_v}" }
              as: FlowController
            - call: "POST /fleet/pick-tasks/${pt1}/dispatch"
              payload: {}
              as: FlowController
            - call: "POST /fleet/maintenance-windows"
              payload: { drive_unit_id: "${du1}", starts_at: "2026-09-01T09:00:00Z", ends_at: "2026-09-01T09:30:00Z", kind: "CORRECTIVE" }
              as: MaintenanceTech
              captures: { mw1: $.data.id }
          trigger:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:15:00Z" }
              as: FleetAdmin
            - call: "GET /fleet/maintenance-windows/${mw1}"
              as: MaintenanceTech
              captures: { mw1_status: $.data.status }
            - call: "GET /fleet/drive-units/${du1}"
              as: MaintenanceTech
              captures: { du1_status: $.data.status }
          assert:
            - "MaintenanceWindow.${mw1}.status == SCHEDULED (window cannot activate while unit EN_ROUTE)"
            - "DriveUnit.${du1}.status == EN_ROUTE"

  - rule_id: resource_temporal_overlap
    instances:
      - name: maintenance_window_buffer_adjacency
        grounds:
          - validations[priority=8]
          - entities.MaintenanceWindow
        distinguishing_aspect: |
          Half-open interval semantics on DriveUnit: two windows on the same
          unit may be back-to-back ONLY when separated by exactly
          MAINT_BUFFER_MINUTES=15 minutes; gap < 15 must be rejected, gap == 15
          must be accepted. Interval arithmetic differs from the closed-interval
          permit rule below.
        test_recipe:
          setup:
            - "Zone Z1. DriveUnit DU1. Existing MaintenanceWindow MW1 [2026-09-01T10:00:00Z, 2026-09-01T11:00:00Z) kind=PREVENTIVE."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/zones"
              payload: { zone_code: "Z1", grid_x: 0, grid_y: 0, width: 10, height: 10, max_human_occupancy: 2 }
              as: FleetAdmin
              captures: { z1: $.data.id }
            - call: "POST /fleet/drive-units"
              payload: { unit_code: "DU1", home_zone_id: "${z1}" }
              as: FleetAdmin
              captures: { du1: $.data.id }
            - call: "POST /fleet/maintenance-windows"
              payload: { drive_unit_id: "${du1}", starts_at: "2026-09-01T10:00:00Z", ends_at: "2026-09-01T11:00:00Z", kind: "PREVENTIVE" }
              as: MaintenanceTech
              captures: { mw1: $.data.id }
          trigger:
            - call: "POST /fleet/maintenance-windows"
              payload: { drive_unit_id: "${du1}", starts_at: "2026-09-01T11:10:00Z", ends_at: "2026-09-01T12:00:00Z", kind: "PREVENTIVE" }
              as: MaintenanceTech
              captures: { bad_err: $.data.error_id }
            - call: "POST /fleet/maintenance-windows"
              payload: { drive_unit_id: "${du1}", starts_at: "2026-09-01T11:15:00Z", ends_at: "2026-09-01T12:00:00Z", kind: "PREVENTIVE" }
              as: MaintenanceTech
              captures: { mw2: $.data.id }
          assert:
            - "first trigger rejected with ERR_TEMPORAL_CONFLICT (gap 10 min < 15)"
            - "second trigger succeeds (gap 15 min == buffer, allowed)"
            - "MaintenanceWindow.${mw2}.status == SCHEDULED"

      - name: human_entry_permit_closed_interval_capacity
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - entities.HumanEntryPermit
          - state_machines.HumanEntryPermit.REQUESTED_to_ACTIVE
        distinguishing_aspect: |
          Closed interval + aggregate capacity semantics on FloorZone: permits
          whose [starts_at, ends_at] intervals touch at a single endpoint DO
          overlap (closed), and the count of overlapping ACTIVE permits must
          stay strictly below max_human_occupancy. Different interval semantics
          from the maintenance half-open buffer rule.
        test_recipe:
          setup:
            - "Zone Z1 max_human_occupancy=1. FloorException EX1 triaged HUMAN. Permit P1 [08:00, 09:00] REQUESTED; permit P2 [09:00, 10:00] REQUESTED (touching endpoint). Clock 2026-09-01T08:30:00Z (inside P1)."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:30:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/zones"
              payload: { zone_code: "Z1", grid_x: 0, grid_y: 0, width: 10, height: 10, max_human_occupancy: 1 }
              as: FleetAdmin
              captures: { z1: $.data.id }
            - call: "POST /fleet/floor-exceptions"
              payload: { kind: "BLOCKED_PATH", zone_id: "${z1}" }
              as: FloorSupervisor
              captures: { ex1: $.data.id }
            - call: "POST /fleet/floor-exceptions/${ex1}/triage"
              payload: { branch: "HUMAN" }
              as: FloorSupervisor
            - call: "POST /fleet/human-entry-permits"
              payload: { zone_id: "${z1}", exception_id: "${ex1}", starts_at: "2026-09-01T08:00:00Z", ends_at: "2026-09-01T09:00:00Z" }
              as: FloorSupervisor
              captures: { p1: $.data.id }
            - call: "POST /fleet/human-entry-permits"
              payload: { zone_id: "${z1}", exception_id: "${ex1}", starts_at: "2026-09-01T09:00:00Z", ends_at: "2026-09-01T10:00:00Z" }
              as: FloorSupervisor
              captures: { p2: $.data.id }
            - call: "POST /fleet/human-entry-permits/${p1}/grant"
              payload: {}
              as: SafetyOfficer
          trigger:
            - call: "POST /fleet/human-entry-permits/${p2}/grant"
              payload: {}
              as: SafetyOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_CAPACITY_EXCEEDED"
            - "http status == 422"
            - "closed intervals touching at endpoint 09:00 count as overlapping; capacity 1 already consumed by P1"

  - rule_id: compensating_invariant
    instances:
      - name: sku_reserved_units_invariant_across_cancel
        grounds:
          - state_machines.PickTask.QUEUED_to_CANCELLED
          - entities.Sku.fields.total_units_reserved
        distinguishing_aspect: |
          Conserved quantity: Sku.total_units_reserved. Forward action
          (sequence PickTask) increments it by quantity; the compensating action
          (cancel the same PickTask) decrements it by exactly quantity. After
          the pair, total_units_reserved MUST equal its value before the pair.
        test_recipe:
          setup:
            - "Zone Z1. Pod P1, Sku SKU1 with 5 units on hand. PickStation ST1 max_queue 5. CustomerOrder O1 line qty 2. Sku.total_units_reserved == 0 initially."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/zones"
              payload: { zone_code: "Z1", grid_x: 0, grid_y: 0, width: 10, height: 10, max_human_occupancy: 2 }
              as: FleetAdmin
              captures: { z1: $.data.id }
            - call: "POST /fleet/pods"
              payload: { pod_code: "P1", zone_id: "${z1}", slot_capacity: 5 }
              as: FleetAdmin
              captures: { p1: $.data.id }
            - call: "POST /fleet/skus"
              payload: { sku_code: "SKU1", velocity_class: "LOW" }
              as: FleetAdmin
              captures: { sku1: $.data.id, sku1_v: $.data.version }
            - call: "POST /fleet/pick-stations"
              payload: { station_code: "ST1", zone_id: "${z1}", max_queue: 5 }
              as: FleetAdmin
              captures: { st1: $.data.id }
            - call: "POST /fleet/stow-tasks"
              payload: { sku_id: "${sku1}", quantity: 5 }
              as: FlowController
              captures: { stow1: $.data.id }
            - call: "POST /fleet/stow-tasks/${stow1}/place"
              payload: { expected_sku_version: "${sku1_v}" }
              as: FlowController
            - call: "POST /fleet/stow-tasks/${stow1}/confirm"
              payload: {}
              as: StationOperator
            - call: "GET /fleet/skus/${sku1}"
              as: FlowController
              captures: { sku_reserved_before: $.data.total_units_reserved }
            - call: "POST /fleet/customer-orders"
              payload: { order_code: "O1", cutoff_at: "2026-09-02T00:00:00Z", priority: 1, lines: [{sku_id: "${sku1}", quantity: 2}] }
              as: FlowController
              captures: { o1: $.data.id }
            - call: "GET /fleet/customer-orders/${o1}/lines"
              as: FlowController
              captures: { o1_line: "$.data[0].id" }
            - call: "POST /fleet/pick-tasks"
              payload: { order_id: "${o1}", line_id: "${o1_line}", pod_id: "${p1}", station_id: "${st1}", quantity: 2 }
              as: FlowController
              captures: { pt1: $.data.id }
            - call: "GET /fleet/pick-stations/${st1}"
              as: FlowController
              captures: { st1_v: $.data.version }
            - call: "POST /fleet/pick-tasks/${pt1}/sequence"
              payload: { expected_station_version: "${st1_v}" }
              as: FlowController
            - call: "GET /fleet/skus/${sku1}"
              as: FlowController
              captures: { sku_reserved_mid: $.data.total_units_reserved }
          trigger:
            - call: "POST /fleet/pick-tasks/${pt1}/cancel"
              payload: {}
              as: FlowController
            - call: "GET /fleet/skus/${sku1}"
              as: FlowController
              captures: { sku_reserved_after: $.data.total_units_reserved }
          assert:
            - "Sku.${sku1}.total_units_reserved before sequence == 0"
            - "Sku.${sku1}.total_units_reserved after sequence == 2"
            - "Sku.${sku1}.total_units_reserved after cancel == 0"
            - "compensating invariant: reserved_after == reserved_before"

      - name: fleet_status_count_conservation_across_charge_cycle
        grounds:
          - state_machines.DriveUnit
          - state_machines.ChargingSession
        distinguishing_aspect: |
          Conserved quantity: total fleet count across non-terminal DriveUnit
          statuses. Opening then closing a ChargingSession (ACTIVE->CHARGING
          ->ACTIVE) leaves the multiset {ACTIVE, CHARGING, MAINTENANCE, PARKED,
          EN_ROUTE, AT_STATION, STRANDED} unchanged in size; no DriveUnit is
          created or destroyed by the cycle. Different conserved quantity from
          the inventory reservation invariant.
        test_recipe:
          setup:
            - "Zone Z1. Charger C1 slot_count 1. DriveUnits DU1, DU2 both ACTIVE."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/zones"
              payload: { zone_code: "Z1", grid_x: 0, grid_y: 0, width: 10, height: 10, max_human_occupancy: 2 }
              as: FleetAdmin
              captures: { z1: $.data.id }
            - call: "POST /fleet/chargers"
              payload: { zone_id: "${z1}", slot_count: 1 }
              as: FleetAdmin
              captures: { c1: $.data.id }
            - call: "POST /fleet/drive-units"
              payload: { unit_code: "DU1", home_zone_id: "${z1}" }
              as: FleetAdmin
              captures: { du1: $.data.id }
            - call: "POST /fleet/drive-units"
              payload: { unit_code: "DU2", home_zone_id: "${z1}" }
              as: FleetAdmin
              captures: { du2: $.data.id }
            - call: "GET /fleet/drive-units"
              as: FleetAdmin
              
          trigger:
            - call: "POST /fleet/charging-sessions"
              payload: { charger_id: "${c1}", drive_unit_id: "${du1}" }
              as: FlowController
              captures: { cs1: $.data.id }
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/charging-sessions/${cs1}/close"
              payload: {}
              as: FlowController
            - call: "GET /fleet/drive-units"
              as: FleetAdmin
              
            - call: "GET /fleet/drive-units/${du1}"
              as: FleetAdmin
              captures: { du1_status: $.data.status }
          assert:
            - "fleet total_count before cycle == 2"
            - "fleet total_count after cycle == 2"
            - "DriveUnit.${du1}.status == ACTIVE"
            - "fleet size conserved across the charge cycle"
