              as: AssetManager
              captures: { j1: $.data.id }
            - call: "POST /assets/installations/${j1}/activate"
              payload: {}
              as: AssetManager
            - call: "GET /assets/entitlements/${eid}"
              payload: {}
              as: AssetManager
              captures: { ev1: $.data.version }
            - call: "POST /assets/installations"
              payload: { software_product_id: "${pid}", hardware_asset_id: "${aid}", license_entitlement_id: "${eid}", expected_entitlement_version: "${ev1}" }
              as: AssetManager
              captures: { j2: $.data.id }
            - call: "POST /assets/installations/${j2}/activate"
              payload: {}
              as: AssetManager
            - call: "GET /assets/entitlements/${eid}"
              payload: {}
              as: AssetManager
              captures: { ev2: $.data.version }
            - call: "POST /assets/installations"
              payload: { software_product_id: "${pid}", hardware_asset_id: "${aid}", license_entitlement_id: "${eid}", expected_entitlement_version: "${ev2}" }
              as: AssetManager
              captures: { j3: $.data.id }
            - call: "POST /assets/installations/${j3}/activate"
              payload: {}
              as: AssetManager
            - call: "GET /assets/entitlements/${eid}"
              payload: {}
              as: AssetManager
              captures: { ev3: $.data.version }
            - call: "POST /assets/installations"
              payload: { software_product_id: "${pid}", hardware_asset_id: "${aid}", license_entitlement_id: "${eid}", expected_entitlement_version: "${ev3}" }
              as: AssetManager
              captures: { j4: $.data.id }
            - call: "POST /assets/installations/${j4}/activate"
              payload: {}
              as: AssetManager
            - call: "GET /assets/entitlements/${eid}"
              payload: {}
              as: AssetManager
              captures: { ev4: $.data.version }
            - call: "POST /assets/installations"
              payload: { software_product_id: "${pid}", hardware_asset_id: "${aid}", license_entitlement_id: "${eid}", expected_entitlement_version: "${ev4}" }
              as: AssetManager
              captures: { j5: $.data.id, ev5: $.data.version }
