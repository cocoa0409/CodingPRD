        excluded_because:
          difficulty_instance: upgrade_paid_installment_count_exactly_twelve_vs_eleven
          rationale: |
            The conditional-action claim for this endpoint is that instance: two loans identical
            except for one paid installment, with 12 PAID (5000 bps) admitted and 11 PAID (4583
            bps) refused with ERR_UPGRADE_THRESHOLD_NOT_MET, which pins the >= comparison and
            the floor division at the same time.

      - name: completion_endpoint_side_effects_mint_the_successor_loan
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/upgrade-requests/{id}/completion
          - state_machines.InstallmentLoan.status.ACTIVE_to_ROLLED_OVER
          - calculations.rollover_and_new_loan_principal
        excluded_because:
          difficulty_instance: new_loan_principal_fee_tier_keyed_on_pre_fee_base
          rationale: |
            Every side effect of the completion endpoint is asserted there end to end: the
            predecessor reaches ROLLED_OVER, the quote is CONSUMED, the successor loan is minted
            with its predecessor_loan_id, rolled-over balance, origination-fee tier and fresh
            24-installment schedule, and the trade-in settles. A breadth corner cannot add to
            it.

  # ===========================================================================
  - section: errors
    instances:
      - name: missing_or_undeclared_identity_headers_are_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations.priority_1_ERR_UNAUTHENTICATED
          - validations.priority_2_ERR_UNAUTHENTICATED
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: |
          Both authentication legs are exercised and both outrank everything else: an empty
          X-User-ID with a perfectly good role is 401, a syntactically fine identity carrying a
          role name that §1.7 never declares is 401, and an unauthenticated request against a
          non-existent path id is 401 rather than the 404 it would otherwise earn.
        test_recipe:
          setup:
            - "Empty database; only the logical clock is pinned."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
          trigger:
            - call: "GET /device-models"
              payload: {}
              as: ProgramAdmin
              as_user_id: ""
              captures: { e_no_id: "$.data.error_id" }
            - call: "GET /device-models"
              payload: {}
              as: DistrictManager
              as_user_id: "u-dm-1"
              captures: { e_bad_role: "$.data.error_id" }
            - call: "GET /customers/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: DistrictManager
              as_user_id: "u-dm-1"
              captures: { e_beats_404: "$.data.error_id" }
            - call: "POST /customers"
              payload: { full_name: "Hana Okabe", email: "hana.okabe@example.com", mobile_number: "+15550100044" }
              as: RetailAssociate
              as_user_id: ""
              captures: { e_write: "$.data.error_id" }
          assert:
            - "the empty-X-User-ID read returns HTTP 401 with error_id ERR_UNAUTHENTICATED and a non-empty message"
            - "the undeclared-role read returns HTTP 401 with error_id ERR_UNAUTHENTICATED (priority 2), not ERR_UNAUTHORIZED"
            - "the unauthenticated read of a non-existent customer id returns HTTP 401 ERR_UNAUTHENTICATED, not HTTP 404 ERR_CUSTOMER_NOT_FOUND"
            - "the unauthenticated create returns HTTP 401 and no Customer row is written (a subsequent authenticated POST /customers with the same email succeeds instead of raising ERR_DUPLICATE_IDENTIFIER)"
            - "every 401 response body contains exactly the keys error_id and message"

      - name: the_logical_clock_refuses_to_move_backwards
        claim_type: violation_to_error
        grounds:
          - validations.priority_85_ERR_CLOCK_NOT_MONOTONIC
          - validations.priority_10_ERR_INVALID_REQUEST
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: |
          The monotonicity rule is >=, not >: re-pinning the clock to the instant it already
          holds succeeds, one second earlier is refused with ERR_CLOCK_NOT_MONOTONIC, an
          unparseable instant is refused one rung earlier as ERR_INVALID_REQUEST (priority 10
          before 85), and after both refusals the clock still reads the last accepted value.
        test_recipe:
          setup:
            - "Empty database; clock pinned at the program epoch."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { t0: "$.data.current_utc" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { t_same: "$.data.current_utc" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-31T23:59:59Z" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { e_back: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "the-first-of-august" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { e_garbage: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:01Z" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { t_fwd: "$.data.current_utc" }
          assert:
            - "the re-pin to the identical instant returns HTTP 200 with current_utc == \"2026-08-01T00:00:00Z\""
            - "the one-second-backwards call returns HTTP 422 with error_id ERR_CLOCK_NOT_MONOTONIC"
            - "the unparseable call returns HTTP 422 with error_id ERR_INVALID_REQUEST (priority 10 outranks 85)"
            - "the one-second-forwards call returns HTTP 200 with current_utc == \"2026-08-01T00:00:01Z\""
            - "a further backwards attempt to \"2026-08-01T00:00:00Z\" now returns ERR_CLOCK_NOT_MONOTONIC because the accepted value advanced"

      - name: unresolvable_body_foreign_keys_each_return_their_own_not_found
        claim_type: violation_to_error
        grounds:
          - validations.priority_30_ERR_CUSTOMER_NOT_FOUND
          - validations.priority_31_ERR_DEVICE_MODEL_NOT_FOUND
          - validations.priority_32_ERR_CREDIT_APPLICATION_NOT_FOUND
          - validations.priority_33_ERR_LOAN_NOT_FOUND
          - validations.priority_34_ERR_CARRIER_ACCOUNT_NOT_FOUND
          - validations.priority_36_ERR_PAYOFF_QUOTE_NOT_FOUND
          - validations.priority_37_ERR_PAYMENT_POSTING_NOT_FOUND
