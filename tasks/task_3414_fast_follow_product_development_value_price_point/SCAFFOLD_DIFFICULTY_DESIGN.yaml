  - rule_id: resource_temporal_overlap
    instances:
      - name: line_review_windows_half_open_adjacency_allowed
        grounds:
          - validations[priority=21]
          - errors.ERR_WINDOW_OVERLAP
        distinguishing_aspect: "HALF-OPEN interval semantics on the RetailPartner review calendar: [2026-10-01, 2026-10-15) and [2026-10-15, 2026-11-01) touch at a boundary and are allowed; [2026-10-14, 2026-10-28) overlaps by one day and is rejected; a CANCELLED review frees its window for reuse."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One retail partner ValueMart."
          setup_api_calls:
            - *k_clock
            - *k_partner
          trigger:
            - call: "POST /line-reviews"
              payload: { retail_partner_id: "${partner_id}", season: "2026-HO", submission_window_start: "2026-10-01T00:00:00Z", submission_window_end: "2026-10-15T00:00:00Z", review_date: "2026-10-20T00:00:00Z" }
              as: RetailPlanner
              as_user_id: "rp-owen"
              captures: { w1_id: $.data.id }
            - call: "POST /line-reviews"
              payload: { retail_partner_id: "${partner_id}", season: "2027-SP", submission_window_start: "2026-10-15T00:00:00Z", submission_window_end: "2026-11-01T00:00:00Z", review_date: "2026-11-05T00:00:00Z" }
              as: RetailPlanner
              as_user_id: "rp-owen"
              captures: { w2_id: $.data.id }
            - call: "POST /line-reviews"
              payload: { retail_partner_id: "${partner_id}", season: "2027-SU", submission_window_start: "2026-10-14T00:00:00Z", submission_window_end: "2026-10-28T00:00:00Z", review_date: "2026-10-28T00:00:00Z" }
              as: RetailPlanner
              as_user_id: "rp-owen"
              captures: { err_ovl: $.data.error_id }
            - call: "PATCH /line-reviews/${w2_id}"
              payload: { status: "CANCELLED" }
              as: RetailPlanner
              as_user_id: "rp-owen"
            - call: "POST /line-reviews"
              payload: { retail_partner_id: "${partner_id}", season: "2027-SP-B", submission_window_start: "2026-10-15T00:00:00Z", submission_window_end: "2026-10-20T00:00:00Z", review_date: "2026-10-22T00:00:00Z" }
              as: RetailPlanner
              as_user_id: "rp-owen"
              captures: { w4_id: $.data.id }
          assert:
            - "first and second reviews both return 201  (adjacency start == other.end is NOT an overlap under half-open semantics)"
            - "the third create returns 409 and err_ovl == ERR_WINDOW_OVERLAP  ([10-14, 10-28) intersects [10-01, 10-15) by one day)"
            - "after cancelling the second review, the fourth create reusing [10-15, 10-20) returns 201  (CANCELLED reviews do not block)"
            - "GET /line-reviews?retail_partner_id=${partner_id} returns 3 rows: w1 SCHEDULED, w2 CANCELLED, w4 SCHEDULED"

      - name: slot_occupancy_closed_interval_requires_14day_buffer
        grounds:
          - validations[priority=22]
          - errors.ERR_OCCUPANCY_CONFLICT
        distinguishing_aspect: "CLOSED-interval-plus-buffer semantics on the shelf position resource (different geometry than half-open windows, different resource entity): position EYES-A1 occupied [2026-11-01, 2027-01-31] inclusive; a successor starting exactly 14 days later (2027-02-14) is allowed, 13 days later (2027-02-13) conflicts, and any interval strictly inside conflicts."
        test_recipe:
          setup:
            - "Product LAUNCH_READY; line review SUBMISSION_OPEN at 2026-10-02; slot S1 PROPOSED on position EYES-A1 with occupancy [2026-11-01, 2027-01-31]."
          setup_api_calls:
