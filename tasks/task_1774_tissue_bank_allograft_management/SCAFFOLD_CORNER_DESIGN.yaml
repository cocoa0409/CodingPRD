# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Tissue Bank & Allograft Management. Breadth probe across §1.1–§1.7 per the
# claim-extraction guide taxonomy. Default logical clock: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: supplier_create_applies_defaults
        claim_type: creation_defaults
        grounds: [entities.Supplier]
        distinguishing_aspect: "POST /suppliers with only required inputs returns 201 with status PENDING_QUALIFICATION, both qualification scores 100, version 1, server-minted UUID id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /tissue-bank/suppliers", payload: { legal_name: "Acme Tissue Source", license_number: "LIC-001" }, as: QualityManager, as_user_id: "qm-1", captures: { sup: $.data.id, st: $.data.status, prov: $.data.qualification_score_provisional, fin: $.data.qualification_score_final, ver: $.data.version } }
          assert:
            - "st == PENDING_QUALIFICATION (initial state)"
            - "prov == 100 and fin == 100 (computed defaults)"
            - "ver == 1 and sup is a server-minted UUID"
            - "suspended_at == null"

      - name: supplier_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Supplier, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required license_number triggers ERR_INVALID_REQUEST (400) at request-shape priority 3.4."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /tissue-bank/suppliers", payload: { legal_name: "No License Labs" }, as: QualityManager, as_user_id: "qm-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: tissue_unit_system_fields_ignore_manifest_input
        claim_type: system_fields
        grounds: [entities.TissueUnit]
        distinguishing_aspect: "Manifest lines smuggling id/status keys are ignored: minted units keep server id and status QUARANTINED (initial state of the unit machine)."
        test_recipe:
          setup: ["qualified supplier; freezer"]
          setup_api_calls:
            - { call: "POST /tissue-bank/suppliers", payload: { legal_name: "Acme Tissue Source", license_number: "LIC-001" }, as: QualityManager, as_user_id: "qm-1", captures: { sup: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: AATB_ACCREDITATION, document_ref: "AATB-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_a: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_a}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: FDA_REGISTRATION, document_ref: "FDA-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_f: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_f}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/approve", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /tissue-bank/freezers", payload: { name: "FZ-ULT-1", min_celsius: -80.0, max_celsius: -60.0, nominal_capacity: 50 }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { fz: $.data.id } }
          trigger:
            - { call: "POST /tissue-bank/shipments", payload: { supplier_id: "${sup}", freezer_id: "${fz}", items: [ { id: "00000000-0000-0000-0000-0000000000aa", status: "AVAILABLE", tissue_type: BONE, lot_number: "L1", serial_number: "U-001", unit_cost_cents: 5000, expiration_at: "2027-01-01T00:00:00Z", criticality_tier: STANDARD } ] }, as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { sh1: $.data.id } }
            - { call: "GET /tissue-bank/tissue-units?shipment_id=${sh1}", as: QualityManager, as_user_id: "qm-1", captures: { uid: "$.data[0].id", ust: "$.data[0].status" } }
          assert:
            - "ust == QUARANTINED (smuggled status AVAILABLE ignored)"
            - "uid != 00000000-0000-0000-0000-0000000000aa (smuggled id ignored; server mints UUID)"
            - "Shipment.${sh1}.unit_count == 1 and total_declared_value_cents == 5000"

      - name: temperature_reading_is_immutable_event
        claim_type: immutability
        grounds: [entities.TemperatureReading]
        distinguishing_aspect: "TemperatureReading has common_fields false: response carries id + created_at but no version/updated_at; no update or delete endpoint exists for it."
        test_recipe:
          setup: ["freezer exists"]
          setup_api_calls:
            - { call: "POST /tissue-bank/freezers", payload: { name: "FZ-ULT-1", min_celsius: -80.0, max_celsius: -60.0, nominal_capacity: 50 }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { fz: $.data.id } }
          trigger:
            - { call: "POST /tissue-bank/freezers/${fz}/readings", payload: { temp_celsius: -70.0 }, as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { rid: $.data.id, inr: $.data.in_range } }
          assert:
            - "inr == true (-70.0 within [-80.0, -60.0])"
            - "Response has id and created_at but NO version and NO updated_at key (append-only event)"

      - name: freezer_computed_capacity_fields_on_create
        claim_type: computed_fields
        grounds: [entities.Freezer, calculations.storage_capacity_gating]
        distinguishing_aspect: "New freezer: occupied_count 0, utilization_pct 0.0, quarantine_reserve_slots 0, effective_capacity == nominal_capacity."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /tissue-bank/freezers", payload: { name: "FZ-ULT-1", min_celsius: -80.0, max_celsius: -60.0, nominal_capacity: 10 }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { occ: $.data.occupied_count, util: $.data.utilization_pct, res: $.data.quarantine_reserve_slots, eff: $.data.effective_capacity } }
          assert:
            - "occ == 0, util == 0.0, res == 0, eff == 10"
            - "status == OPERATIONAL (initial state)"

      - name: resource_not_found_family_returns_specific_404
        claim_type: not_found
        grounds: ["errors[ERR_UNIT_NOT_FOUND]", "errors[ERR_FREEZER_NOT_FOUND]", "errors[ERR_SUPPLIER_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns 404 with the resource-specific error id, not a generic 500."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /tissue-bank/tissue-units/11111111-2222-4333-8444-555555555555", as: QualityManager, as_user_id: "qm-1", captures: { e1: $.data.error_id } }
            - { call: "GET /tissue-bank/freezers/11111111-2222-4333-8444-555555555555", as: QualityManager, as_user_id: "qm-1", captures: { e2: $.data.error_id } }
            - { call: "GET /tissue-bank/suppliers/11111111-2222-4333-8444-555555555555", as: QualityManager, as_user_id: "qm-1", captures: { e3: $.data.error_id } }
          assert:
            - "e1 == ERR_UNIT_NOT_FOUND, e2 == ERR_FREEZER_NOT_FOUND, e3 == ERR_SUPPLIER_NOT_FOUND (all http 404)"

      - name: invalid_enum_in_manifest_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.TissueUnit, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "tissue_type MARROW is not in the enum -> ERR_INVALID_REQUEST at request-shape priority."
        test_recipe:
          setup: ["qualified supplier; freezer"]
          setup_api_calls:
            - { call: "POST /tissue-bank/suppliers", payload: { legal_name: "Acme Tissue Source", license_number: "LIC-001" }, as: QualityManager, as_user_id: "qm-1", captures: { sup: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: AATB_ACCREDITATION, document_ref: "AATB-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_a: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_a}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: FDA_REGISTRATION, document_ref: "FDA-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_f: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_f}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/approve", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /tissue-bank/freezers", payload: { name: "FZ-ULT-1", min_celsius: -80.0, max_celsius: -60.0, nominal_capacity: 50 }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { fz: $.data.id } }
          trigger:
            - { call: "POST /tissue-bank/shipments", payload: { supplier_id: "${sup}", freezer_id: "${fz}", items: [ { tissue_type: MARROW, lot_number: "L1", serial_number: "U-001", unit_cost_cents: 5000, expiration_at: "2027-01-01T00:00:00Z", criticality_tier: STANDARD } ] }, as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST (invalid enum member rejected before any state or safety logic)"

  - section: state_machines
    instances:
      - name: supplier_approve_when_already_qualified_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Supplier.PENDING_QUALIFICATION_to_QUALIFIED, "errors[ERR_SUPPLIER_INVALID_STATE]"]
        distinguishing_aspect: "Approve is defined only from PENDING_QUALIFICATION or SUSPENDED; a second approve on QUALIFIED fails ERR_SUPPLIER_INVALID_STATE."
        test_recipe:
          setup: ["supplier with both required docs VERIFIED"]
          setup_api_calls:
            - { call: "POST /tissue-bank/suppliers", payload: { legal_name: "Acme Tissue Source", license_number: "LIC-001" }, as: QualityManager, as_user_id: "qm-1", captures: { sup: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: AATB_ACCREDITATION, document_ref: "AATB-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_a: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_a}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: FDA_REGISTRATION, document_ref: "FDA-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_f: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_f}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/approve", as: ComplianceOfficer, as_user_id: "co-1" }
          trigger:
            - { call: "POST /tissue-bank/suppliers/${sup}/approve", as: ComplianceOfficer, as_user_id: "co-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_SUPPLIER_INVALID_STATE (idempotency: second approve rejected, no state change)"

      - name: supplier_disqualified_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Supplier]
        distinguishing_aspect: "DISQUALIFIED is terminal: suspend, reinstate and approve all fail from it."
        test_recipe:
          setup: ["supplier DISQUALIFIED from PENDING_QUALIFICATION (no documents needed)"]
          setup_api_calls:
            - { call: "POST /tissue-bank/suppliers", payload: { legal_name: "Acme Tissue Source", license_number: "LIC-001" }, as: QualityManager, as_user_id: "qm-1", captures: { sup: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/disqualify", as: ComplianceOfficer, as_user_id: "co-1" }
          trigger:
            - { call: "POST /tissue-bank/suppliers/${sup}/suspend", as: ComplianceOfficer, as_user_id: "co-1", captures: { e1: $.data.error_id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/reinstate", as: ComplianceOfficer, as_user_id: "co-1", captures: { e2: $.data.error_id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/approve", as: ComplianceOfficer, as_user_id: "co-1", captures: { e3: $.data.error_id } }
          assert:
            - "e1 == ERR_SUPPLIER_INVALID_STATE and e2 == ERR_SUPPLIER_INVALID_STATE and e3 == ERR_SUPPLIER_INVALID_STATE"
            - "Supplier.${sup}.status == DISQUALIFIED throughout"

      - name: document_verify_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.SupplierDocument.SUBMITTED_to_VERIFIED, "errors[ERR_DOCUMENT_INVALID_STATE]"]
        distinguishing_aspect: "Verify is defined only from SUBMITTED; verifying a VERIFIED document fails ERR_DOCUMENT_INVALID_STATE."
        test_recipe:
          setup: ["supplier with one SUBMITTED document, then verified"]
          setup_api_calls:
            - { call: "POST /tissue-bank/suppliers", payload: { legal_name: "Acme Tissue Source", license_number: "LIC-001" }, as: QualityManager, as_user_id: "qm-1", captures: { sup: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: AATB_ACCREDITATION, document_ref: "AATB-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_a: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_a}/verify", as: QualityManager, as_user_id: "qm-1" }
          trigger:
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_a}/verify", as: QualityManager, as_user_id: "qm-2", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_DOCUMENT_INVALID_STATE"
            - "SupplierDocument.${doc_a}.verified_by_user_id == qm-1 (first verify stands)"

      - name: shipment_reject_creates_return_dispositions
        claim_type: side_effect_execution
        grounds: [state_machines.Shipment.RECEIVED_to_REJECTED]
        distinguishing_aspect: "Rejecting a RECEIVED 2-unit shipment moves both units to RETURNED_TO_SUPPLIER and creates one DRAFT DispositionRecord (RETURNED_TO_SUPPLIER) per unit; freezer occupancy returns to 0."
        test_recipe:
          setup: ["qualified supplier; freezer; shipment SH1 with 2 units in RECEIVED"]
          setup_api_calls:
            - { call: "POST /tissue-bank/suppliers", payload: { legal_name: "Acme Tissue Source", license_number: "LIC-001" }, as: QualityManager, as_user_id: "qm-1", captures: { sup: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: AATB_ACCREDITATION, document_ref: "AATB-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_a: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_a}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: FDA_REGISTRATION, document_ref: "FDA-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_f: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_f}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/approve", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /tissue-bank/freezers", payload: { name: "FZ-ULT-1", min_celsius: -80.0, max_celsius: -60.0, nominal_capacity: 50 }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { fz: $.data.id } }
            - { call: "POST /tissue-bank/shipments", payload: { supplier_id: "${sup}", freezer_id: "${fz}", items: [ { tissue_type: BONE, lot_number: "L1", serial_number: "U-001", unit_cost_cents: 5000, expiration_at: "2027-01-01T00:00:00Z", criticality_tier: STANDARD }, { tissue_type: BONE, lot_number: "L1", serial_number: "U-002", unit_cost_cents: 6000, expiration_at: "2027-01-01T00:00:00Z", criticality_tier: STANDARD } ] }, as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { sh1: $.data.id } }
          trigger:
            - { call: "POST /tissue-bank/shipments/${sh1}/reject", payload: { rejection_reason: "Cold chain broken in transit" }, as: TissueBankCoordinator, as_user_id: "tbc-1" }
            - { call: "GET /tissue-bank/tissue-units?shipment_id=${sh1}", as: QualityManager, as_user_id: "qm-1", captures: { s1: "$.data[0].status", s2: "$.data[1].status", u1: "$.data[0].id" } }
            - { call: "GET /tissue-bank/tissue-units/${u1}/disposition-records", as: ComplianceOfficer, as_user_id: "co-1", captures: { dt: "$.data[0].disposition_type", dst: "$.data[0].status" } }
            - { call: "GET /tissue-bank/freezers/${fz}", as: SupplyChainAdmin, as_user_id: "sca-1", captures: { occ: $.data.occupied_count } }
          assert:
            - "s1 == RETURNED_TO_SUPPLIER and s2 == RETURNED_TO_SUPPLIER"
            - "dt == RETURNED_TO_SUPPLIER and dst == DRAFT (one record per unit; check second unit likewise)"
            - "occ == 0 (rejected units leave the freezer ledger)"
            - "Shipment.${sh1}.status == REJECTED"

      - name: shipment_accept_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Shipment.RECEIVED_to_ACCEPTED, "errors[ERR_SHIPMENT_NOT_RECEIVED]"]
        distinguishing_aspect: "ACCEPTED is terminal: a second accept fails ERR_SHIPMENT_NOT_RECEIVED."
        test_recipe:
          setup: ["qualified supplier; freezer; accepted shipment"]
          setup_api_calls:
            - { call: "POST /tissue-bank/suppliers", payload: { legal_name: "Acme Tissue Source", license_number: "LIC-001" }, as: QualityManager, as_user_id: "qm-1", captures: { sup: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: AATB_ACCREDITATION, document_ref: "AATB-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_a: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_a}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: FDA_REGISTRATION, document_ref: "FDA-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_f: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_f}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/approve", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /tissue-bank/freezers", payload: { name: "FZ-ULT-1", min_celsius: -80.0, max_celsius: -60.0, nominal_capacity: 50 }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { fz: $.data.id } }
            - { call: "POST /tissue-bank/shipments", payload: { supplier_id: "${sup}", freezer_id: "${fz}", items: [ { tissue_type: BONE, lot_number: "L1", serial_number: "U-001", unit_cost_cents: 5000, expiration_at: "2027-01-01T00:00:00Z", criticality_tier: STANDARD } ] }, as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { sh1: $.data.id } }
            - { call: "POST /tissue-bank/shipments/${sh1}/accept", as: TissueBankCoordinator, as_user_id: "tbc-1" }
          trigger:
            - { call: "POST /tissue-bank/shipments/${sh1}/accept", as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_SHIPMENT_NOT_RECEIVED"

      - name: unit_release_from_available_rejected
        claim_type: invalid_transition
        grounds: [state_machines.TissueUnit.QUARANTINED_to_AVAILABLE, "errors[ERR_UNIT_NOT_QUARANTINED]"]
        distinguishing_aspect: "Release is defined only from QUARANTINED; releasing an AVAILABLE unit fails ERR_UNIT_NOT_QUARANTINED."
        test_recipe:
          setup: ["qualified supplier; freezer; unit ACCEPTED + released AVAILABLE"]
          setup_api_calls:
            - { call: "POST /tissue-bank/suppliers", payload: { legal_name: "Acme Tissue Source", license_number: "LIC-001" }, as: QualityManager, as_user_id: "qm-1", captures: { sup: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: AATB_ACCREDITATION, document_ref: "AATB-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_a: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_a}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: FDA_REGISTRATION, document_ref: "FDA-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_f: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_f}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/approve", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /tissue-bank/freezers", payload: { name: "FZ-ULT-1", min_celsius: -80.0, max_celsius: -60.0, nominal_capacity: 50 }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { fz: $.data.id } }
            - { call: "POST /tissue-bank/shipments", payload: { supplier_id: "${sup}", freezer_id: "${fz}", items: [ { tissue_type: BONE, lot_number: "L1", serial_number: "U-001", unit_cost_cents: 5000, expiration_at: "2027-01-01T00:00:00Z", criticality_tier: STANDARD } ] }, as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { sh1: $.data.id } }
            - { call: "POST /tissue-bank/shipments/${sh1}/accept", as: TissueBankCoordinator, as_user_id: "tbc-1" }
