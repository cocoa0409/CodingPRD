          the single deadline_utc moves 2026-09-26T23:59:59Z -> 2026-10-26T23:59:59Z (EXTENSION_DAYS 30
          added to the deadline, not to delivered_at_utc), compliance_days stays 30 and
          delivered_at_utc stays 2026-08-27T00:00:00Z, and the second extension is refused because
          MAX_EXTENSIONS is 1.
