  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: program_advance_with_stale_version_returns_412
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[program-advance-stale-version]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "OCC on SeasonalProgram.version: after OPEN consumes version 1 -> 2, a LOCK advance still carrying expected_program_version 1 is rejected 412 ERR_STALE_VERSION even though the clock gate would pass."
        test_recipe:
          setup:
            - "Program at OPEN_FOR_COMMITMENTS with version 2; the caller's last observed version is 1; clock at 2027-02-15 (lock window reached)."
          setup_api_calls:
            - *c_clock_0105
            - *c_prog
            - *c_prog_open
            - *c_clock_0215
          trigger:
            - call: "POST /confection/seasonal-programs/${prog_id}/advance"
              payload: { to_state: "LOCKED", expected_program_version: "${prog_v1}" }
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 412 and error_id == ERR_STALE_VERSION"
            - "error_id != ERR_PROGRAM_ADVANCE_TOO_EARLY — the OCC check (priority 6) precedes temporal gates (priority 9)"
            - "SeasonalProgram.${prog_id}.status remains OPEN_FOR_COMMITMENTS with version 2"

      - name: commitment_revise_supersedes_and_second_revise_is_stale
        claim_type: occ_create_with_supersede
        grounds:
          - concurrency_rules[commitment-revise-stale-version]
          - state_machines.RetailerCommitment.SUBMITTED_to_SUPERSEDED
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "CREATE-with-supersede under OCC: revise at the observed version forks revision 2 (SUBMITTED) and retires revision 1 to SUPERSEDED (version 3); replaying the same revise against the now-stale version is 412, not a state error — OCC (p6) precedes the SUPERSEDED from-state check (p7)."
        test_recipe:
          setup:
            - "Program OPEN_FOR_COMMITMENTS; GOLD commitment SUBMITTED with committed_units 5 at version 2."
          setup_api_calls:
            - *c_clock_0105
            - *c_prog
            - *c_prog_open
            - *c_rt
            - *c_prod_seas
            - *c_clock_0120
            - call: "POST /confection/retailer-commitments"
              payload: { program_id: "${prog_id}", retailer_id: "${r_gold}", product_id: "${prod_id}", committed_units: 5, ship_window_open_on: "2027-08-01T00:00:00Z", ship_window_close_on: "2027-09-10T00:00:00Z" }
              as: Retailer
              as_user_id: "${r_gold}"
              captures: { c_gold: $.data.id }
            - call: "POST /confection/retailer-commitments/${c_gold}/submit"
              payload: {}
              as: Retailer
              as_user_id: "${r_gold}"
              captures: { cv2: $.data.version }
          trigger:
            - call: "POST /confection/retailer-commitments/${c_gold}/revise"
              payload: { committed_units: 25, expected_commitment_version: "${cv2}" }
              as: Retailer
              as_user_id: "${r_gold}"
              captures: { c_rev2: $.data.id }
            - call: "POST /confection/retailer-commitments/${c_gold}/revise"
              payload: { committed_units: 30, expected_commitment_version: "${cv2}" }
              as: Retailer
              as_user_id: "${r_gold}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the first revise returns 201 with the NEW row: revision == 2, status SUBMITTED, committed_units == 25, supersedes_commitment_id == ${c_gold}, version == 1"
            - "the old commitment ${c_gold} is SUPERSEDED with version == 3"
            - "the replayed revise returns 412 and error_id == ERR_STALE_VERSION (old row is now version 3, caller holds 2)"
            - "error_id != ERR_INVALID_STATE — the stale-version guard fires before the SUPERSEDED state guard"
            - "GET /confection/retailer-commitments?supersedes_commitment_id=${c_gold} returns exactly 1 row (${c_rev2})"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: advance_response_carries_the_mutation_immediately
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/confection/seasonal-programs/{id}/advance
        distinguishing_aspect: "Immediate consistency: the advance RESPONSE itself carries status OPEN_FOR_COMMITMENTS and version 2 — no re-read is needed to observe the transition."
        test_recipe:
          setup:
            - "Program in PLANNING at version 1."
          setup_api_calls:
            - *c_clock_0105
            - *c_prog
          trigger:
            - call: "POST /confection/seasonal-programs/${prog_id}/advance"
              payload: { to_state: "OPEN_FOR_COMMITMENTS", expected_program_version: "${prog_v1}" }
              as: PlatformAdmin
              captures: { st: $.data.status, v: $.data.version }
          assert:
            - "the 200 response body has status == OPEN_FOR_COMMITMENTS and version == 2 in the same envelope"
            - "a follow-up GET /confection/seasonal-programs/${prog_id} shows the identical status and version"

