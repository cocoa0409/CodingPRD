            - "RepairOrder.${ro_id}.reserved_parts_cents == 0"
            - "ApprovedPart.${part_other_id}.on_hand_qty == 6"
            - "ApprovedPart.${part_other_id}.reserved_qty == 0"

      - name: a_part_line_for_a_non_oem_part_rejected
