              as: ProcurementBuyer
              captures: { rod_id: $.data.id, rod_v1: $.data.version }
            - call: "POST /production-lots"
              payload: { product_id: "${prod_id}", rod_lot_id: "${rod_id}", lot_code: "LOT-S", planned_length_ft: 5000, line_code: "EXT-1", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z", expected_rod_lot_version: "${rod_v1}" }
