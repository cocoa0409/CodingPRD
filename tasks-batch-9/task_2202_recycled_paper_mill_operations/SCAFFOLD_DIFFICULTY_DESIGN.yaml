  # ===========================================================================
  # Rule 5 — priority-pair validation conflicts across four category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: safety_exceedance_beats_fiscal_pulp_shortfall_on_run_start
        grounds:
          - validations.priority_40
          - validations.priority_67
          - errors.ERR_PERMIT_EXCEEDANCE_BLOCK
          - errors.ERR_INSUFFICIENT_PULP
          - calculations.effluent_rolling_compliance
        distinguishing_aspect: |
          Category pair business_safety (40) versus business_fiscal (67): one /start request
          violates both the permit gate and the pulp-availability gate, and only
          ERR_PERMIT_EXCEEDANCE_BLOCK with HTTP 409 may be returned — a reader who orders the
          checks by how obviously wrong they look (a 30.000-ton draw against 25.500 available
          tons is arithmetically flagrant) emits ERR_INSUFFICIENT_PULP instead.
        test_recipe:
          setup:
            - "FiberGrades MIX_54 / OCC_11, PaperGradeSpec TL_140, PaperMachine PM1 RUNNABLE."
