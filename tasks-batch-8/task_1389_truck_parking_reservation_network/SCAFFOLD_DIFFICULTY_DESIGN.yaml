# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Truck Parking Reservation Network (task_1389)
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: booking_provisional_quote_vs_final_settlement
        grounds:
          - calculations.booking_settlement
          - entities.Booking.fields.quoted_total_cents
          - entities.Booking.fields.final_total_cents
        distinguishing_aspect: |
          Entity domain = Booking money. The provisional_quote variant (creation-time tier, no
          amenities/fees) and final_settlement variant (settlement-time tier, plus amenity_net and
          fees) produce different totals for identical parking input once amenity lines exist.
        test_recipe:
          setup:
            - "Site S (base 5000) with 5 reservable stalls R01..R05, SHOWER(1500) and WIFI(500) products, no other bookings (occupancy 0%)"
            - "Driver D STANDARD tier; booking B arrival 2026-08-10 (Mon, non-peak), 1 night, DRIVER_DIRECT"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R02", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R03", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R04", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R05", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/amenity-products", payload: { code: "SHOWER", name: "Shower", price_cents: 1500 }, as: NetworkAdmin, captures: { ap_shower: $.data.id } }
            - { call: "POST /sites/${site_id}/amenity-products", payload: { code: "WIFI", name: "Wifi", price_cents: 500 }, as: NetworkAdmin, captures: { ap_wifi: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-DV1", full_name: "Dv One" }, as: Anonymous, captures: { drv: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings", payload: { driver_id: "${drv}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${drv}", captures: { bk: $.data.id, quote: $.data.quoted_total_cents } }
            - { call: "POST /bookings/${bk}/amenities", payload: { amenity_product_id: "${ap_shower}", quantity: 1 }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /bookings/${bk}/amenities", payload: { amenity_product_id: "${ap_wifi}", quantity: 1 }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T15:30:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings/${bk}/check-in", payload: {}, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T10:00:00Z" }, as: NetworkAdmin }
          trigger:
            - { call: "POST /bookings/${bk}/check-out", payload: {}, as: Driver, as_user_id: "${drv}", captures: { final: $.data.final_total_cents } }
          assert:
            - "Booking.${bk}.quoted_total_cents == 4500 (5000 * 0.9, STANDARD, parking only)"
            - "Booking.${bk}.final_total_cents == 6300 (parking 4500 + amenity subtotal 2000 - bundle discount 200)"
            - "final_total_cents != quoted_total_cents for identical parking input: 6300 != 4500"

      - name: forecast_confirmed_only_vs_committed_weighted
        grounds:
          - calculations.demand_forecast
        distinguishing_aspect: |
          Entity domain = Site demand (not money). confirmed_only uses only materialized bookings;
          committed_weighted adds 0.5 per QUEUED and 0.25 per OFFERED waitlist entry, so the two
          variants disagree whenever waitlist demand exists.
        test_recipe:
          setup:
            - "Site S (base 5000) with 5 reservable + 5 first-come stalls (10 ACTIVE total)"
            - "3 RESERVED bookings covering night 2026-08-10; 2 QUEUED waitlist entries for 2026-08-10"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R02", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R03", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R04", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R05", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "F01", stall_class: "STANDARD", is_reservable: false }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "F02", stall_class: "STANDARD", is_reservable: false }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "F03", stall_class: "STANDARD", is_reservable: false }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "F04", stall_class: "STANDARD", is_reservable: false }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "F05", stall_class: "STANDARD", is_reservable: false }, as: NetworkAdmin }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-F1", full_name: "F One" }, as: Anonymous, captures: { d1: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-F2", full_name: "F Two" }, as: Anonymous, captures: { d2: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-F3", full_name: "F Three" }, as: Anonymous, captures: { d3: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-F4", full_name: "F Four" }, as: Anonymous, captures: { d4: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-F5", full_name: "F Five" }, as: Anonymous, captures: { d5: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d1}" }
            - { call: "POST /bookings", payload: { driver_id: "${d2}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d2}" }
            - { call: "POST /bookings", payload: { driver_id: "${d3}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d3}" }
            - { call: "POST /waitlist-entries", payload: { driver_id: "${d4}", site_id: "${site_id}", arrival_date: "2026-08-10", night_count: 1, stall_class: "STANDARD", payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d4}" }
            - { call: "POST /waitlist-entries", payload: { driver_id: "${d5}", site_id: "${site_id}", arrival_date: "2026-08-10", night_count: 1, stall_class: "STANDARD", payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d5}" }
          trigger:
            - { call: "GET /sites/${site_id}/forecast", payload: { date: "2026-08-10" }, as: NetworkAdmin, captures: { c_pct: $.data.confirmed_occupancy_pct, w_pct: $.data.committed_occupancy_pct, c_occ: $.data.confirmed_occupied_stalls, w_dem: $.data.committed_weighted_demand } }
          assert:
            - "confirmed_occupied_stalls == 3 and confirmed_occupancy_pct == 30.0"
            - "committed_weighted_demand == 4.0 and committed_occupancy_pct == 40.0"
            - "committed_occupancy_pct != confirmed_occupancy_pct (40.0 vs 30.0) for the same night"

  - rule_id: combinatorial_formula
    instances:
      - name: tiered_rate_peak_and_occupancy_stacking
        grounds:
          - calculations.nightly_dynamic_rate
        distinguishing_aspect: |
          Mode (a): >= 3 inputs (base rate, occupancy tier, peak-day flag, posture cap) with
          non-linear tier selection; a Friday arrival at exactly 80% occupancy stacks mult_high
          with peak_multiplier.
        test_recipe:
          setup:
            - "Site S (base 5000) with 5 reservable stalls; 4 bookings already covering night 2026-08-14 (Friday) -> occupancy for the 5th request is 80%"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R02", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R03", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R04", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R05", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-T1", full_name: "T One" }, as: Anonymous, captures: { d1: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-T2", full_name: "T Two" }, as: Anonymous, captures: { d2: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-T3", full_name: "T Three" }, as: Anonymous, captures: { d3: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-T4", full_name: "T Four" }, as: Anonymous, captures: { d4: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-T5", full_name: "T Five" }, as: Anonymous, captures: { d5: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-14", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d1}" }
            - { call: "POST /bookings", payload: { driver_id: "${d2}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-14", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d2}" }
            - { call: "POST /bookings", payload: { driver_id: "${d3}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-14", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d3}" }
            - { call: "POST /bookings", payload: { driver_id: "${d4}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-14", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d4}" }
          trigger:
            - { call: "POST /bookings", payload: { driver_id: "${d5}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-14", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d5}", captures: { bk5: $.data.id, q5: $.data.quoted_total_cents } }
          assert:
            - "Booking.${bk5}.quoted_total_cents == 7500 (round_half_up(5000 * 1.25 * 1.2); occupancy 4/5 = 80% selects mult_high, Friday selects peak 1.2)"

      - name: per_night_rounding_then_sum
        grounds:
          - calculations.booking_settlement
          - calculations.nightly_dynamic_rate
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — each night line is round_half_up-ed to
          integer cents BEFORE summation. Base 3333 at 0.9x over 2 nights yields 3000+3000=6000
          per-line, whereas sum-then-round would yield 5999.
        test_recipe:
          setup:
            - "Site S (base 3333) with 3 reservable stalls, occupancy 0% (mult_low 0.9)"
            - "Driver D; booking 2 nights arrival 2026-08-10 (Mon/Tue, non-peak)"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 3333 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R02", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R03", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-R1", full_name: "R One" }, as: Anonymous, captures: { d1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
          trigger:
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 2, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d1}", captures: { bk: $.data.id, q: $.data.quoted_total_cents } }
          assert:
            - "Booking.${bk}.per_night_rates == [{date: 2026-08-10, rate_cents: 3000}, {date: 2026-08-11, rate_cents: 3000}]"
            - "Booking.${bk}.quoted_total_cents == 6000 (per-line rounding), NOT 5999 (sum-then-round)"

      - name: invoice_tier_keyed_on_gross_not_net
        grounds:
          - calculations.fleet_invoice_totals
        distinguishing_aspect: |
          Mode (c): circular-looking dependency resolved by pinned evaluation order — the volume
          tier is keyed on GROSS, then the discount is subtracted to form net. Gross 540000 selects
          2%; keying on net would be ill-defined (529200 still >= 500000 here, so the pinned order
          is what makes discount_cents == 10800 well-defined).
        test_recipe:
          setup:
            - "Site S (base 500000) with 3 reservable stalls, occupancy 0%"
            - "Fleet F (credit 10000000, terms 30d); driver D with ACTIVE authorization"
            - "FLEET_BILL booking 1 night arrival 2026-08-14 (Fri): rate = rhu(500000*0.9*1.2) = 540000; checked in and out inside period 2026-08"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 500000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R02", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R03", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /fleet-accounts", payload: { company_name: "F", credit_limit_cents: 10000000, payment_terms_days: 30 }, as: NetworkAdmin, captures: { fl: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-I1", full_name: "I One" }, as: Anonymous, captures: { d1: $.data.id } }
            - { call: "POST /driver-authorizations", payload: { driver_id: "${d1}", fleet_account_id: "${fl}" }, as: Driver, as_user_id: "${d1}", captures: { au: $.data.id } }
            - { call: "POST /driver-authorizations/${au}/transition", payload: { to: "ACTIVE" }, as: FleetManager, as_user_id: "${fl}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-14", night_count: 1, payment_mode: "FLEET_BILL", fleet_account_id: "${fl}" }, as: Driver, as_user_id: "${d1}", captures: { bk: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-14T15:30:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings/${bk}/check-in", payload: {}, as: Driver, as_user_id: "${d1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T10:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings/${bk}/check-out", payload: {}, as: Driver, as_user_id: "${d1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: NetworkAdmin }
          trigger:
            - { call: "POST /fleet-accounts/${fl}/close-billing-period", payload: { period: "2026-08" }, as: NetworkAdmin, captures: { inv: $.data.id, gross: $.data.gross_cents, pct: $.data.discount_pct, disc: $.data.discount_cents, net: $.data.net_cents, due: $.data.due_date } }
          assert:
            - "Invoice.${inv}.gross_cents == 540000"
            - "Invoice.${inv}.discount_pct == 2 (tier keyed on gross 540000 >= 500000)"
            - "Invoice.${inv}.discount_cents == 10800 and net_cents == 529200"
            - "Invoice.${inv}.due_date == 2026-09-30 (period end 2026-08-31 + 30 days)"

  - rule_id: non_linear_state_machine
    instances:
      - name: booking_parallel_billing_survives_noshow
        grounds:
          - state_machines.Booking.BOOKED_to_NO_SHOW
          - state_machines.Booking.UNBILLED_to_INVOICED
        distinguishing_aspect: |
          Booking carries two independent state dimensions. The lifecycle axis terminally lands in
          NO_SHOW while the billing axis independently advances UNBILLED -> INVOICED for the
          no-show fee — a parallel-dimension machine, not a linear pipeline.
        test_recipe:
          setup:
            - "Site S (base 5000) with 2 reservable stalls; fleet F (credit 10000000); driver D with ACTIVE authorization"
            - "FLEET_BILL booking B arrival 2026-08-10 1 night (rate 4500 at 0% occupancy)"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R02", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /fleet-accounts", payload: { company_name: "F", credit_limit_cents: 10000000, payment_terms_days: 30 }, as: NetworkAdmin, captures: { fl: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-P1", full_name: "P One" }, as: Anonymous, captures: { d1: $.data.id } }
            - { call: "POST /driver-authorizations", payload: { driver_id: "${d1}", fleet_account_id: "${fl}" }, as: Driver, as_user_id: "${d1}", captures: { au: $.data.id } }
            - { call: "POST /driver-authorizations/${au}/transition", payload: { to: "ACTIVE" }, as: FleetManager, as_user_id: "${fl}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "FLEET_BILL", fleet_account_id: "${fl}" }, as: Driver, as_user_id: "${d1}", captures: { bk: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T16:00:01Z" }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/ops-run", payload: {}, as: NetworkAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: NetworkAdmin }
          trigger:
            - { call: "POST /fleet-accounts/${fl}/close-billing-period", payload: { period: "2026-08" }, as: NetworkAdmin, captures: { inv: $.data.id, gross: $.data.gross_cents } }
            - { call: "GET /bookings/${bk}", payload: {}, as: NetworkAdmin, captures: { bstat: $.data.status, bstat2: $.data.billing_status, bfee: $.data.fee_cents, bfinal: $.data.final_total_cents } }
          assert:
            - "Booking.${bk}.status == NO_SHOW (lifecycle axis terminal)"
            - "Booking.${bk}.billing_status == INVOICED (billing axis advanced independently)"
            - "Booking.${bk}.fee_cents == 4500 and final_total_cents == 4500"
            - "Invoice.${inv}.gross_cents == 4500 and discount_pct == 0"

      - name: incident_resolve_reopen_cycle
        grounds:
          - state_machines.IncidentReport.RESOLVED_to_REOPENED
          - state_machines.IncidentReport.INVESTIGATING_to_RESOLVED
        distinguishing_aspect: |
          IncidentReport is cyclic: RESOLVED -> REOPENED -> INVESTIGATING -> RESOLVED loops while
          the 72h reopen window holds; reopened_count tracks the loop, unlike any linear machine.
        test_recipe:
          setup:
            - "Site S; driver D reported a SECURITY/HIGH incident INC"
            - "Operator op-alice acknowledged and is investigating; resolution requires a different operator"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-C1", full_name: "C One" }, as: Anonymous, captures: { d1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/incidents", payload: { category: "SECURITY", severity: "HIGH", description: "loitering", reporter_driver_id: "${d1}" }, as: Driver, as_user_id: "${d1}", captures: { inc: $.data.id } }
            - { call: "POST /incidents/${inc}/transition", payload: { to: "ACKNOWLEDGED" }, as: SiteOperator, as_user_id: "op-alice" }
            - { call: "POST /incidents/${inc}/transition", payload: { to: "INVESTIGATING" }, as: SiteOperator, as_user_id: "op-alice" }
            - { call: "POST /incidents/${inc}/transition", payload: { to: "RESOLVED" }, as: SiteOperator, as_user_id: "op-bob" }
          trigger:
            - { call: "POST /incidents/${inc}/transition", payload: { to: "REOPENED" }, as: SiteOperator, as_user_id: "op-bob", captures: { rc: $.data.reopened_count, st1: $.data.status } }
            - { call: "POST /incidents/${inc}/transition", payload: { to: "INVESTIGATING" }, as: SiteOperator, as_user_id: "op-alice" }
            - { call: "POST /incidents/${inc}/transition", payload: { to: "RESOLVED" }, as: SiteOperator, as_user_id: "op-bob", captures: { st2: $.data.status } }
          assert:
            - "IncidentReport.${inc}.reopened_count == 1 after the loop"
            - "status sequence REOPENED -> INVESTIGATING -> RESOLVED all succeed inside the 72h window"
            - "final status == RESOLVED with resolved_by_user_id == op-bob"
  - rule_id: transitive_cascade
    instances:
      - name: noshow_strike_suspension_cancels_future_booking
        grounds:
          - state_machines.Booking.BOOKED_to_NO_SHOW
          - calculations.driver_standing_eval
          - calculations.no_show_fee
        distinguishing_aspect: |
          Trigger = site ops-run no-show sweep. Chain depth 4: B3 -> NO_SHOW mutates Driver
          (strike 3); the strike crossing recomputes standing -> SUSPENDED; the suspension
          cancels unrelated future booking B4 -> CANCELLED; the cancellation releases the stall
          and runs a waitlist offer scan.
        test_recipe:
          setup:
            - "Site S (base 5000) with 2 reservable stalls; driver D with bookings B1 (08-03), B2 (08-04), B3 (08-05) one night each, and B4 arrival 2026-08-20"
            - "Windows do not overlap (departure 11:00Z precedes next open 15:00Z), so one stall serves all four"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R02", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-N1", full_name: "N One" }, as: Anonymous, captures: { d1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-03", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d1}", captures: { b1: $.data.id } }
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-04", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d1}", captures: { b2: $.data.id } }
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-05", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d1}", captures: { b3: $.data.id } }
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-20", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d1}", captures: { b4: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T16:00:01Z" }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/ops-run", payload: {}, as: NetworkAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T16:00:01Z" }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/ops-run", payload: {}, as: NetworkAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T16:00:01Z" }, as: NetworkAdmin }
          trigger:
            - { call: "POST /sites/${site_id}/ops-run", payload: {}, as: NetworkAdmin }
            - { call: "GET /drivers/${d1}", payload: {}, as: NetworkAdmin, captures: { standing: $.data.standing, strikes: $.data.strikes_90d } }
            - { call: "GET /bookings/${b4}", payload: {}, as: NetworkAdmin, captures: { b4s: $.data.status, b4b: $.data.billing_status, b4f: $.data.fee_cents } }
          assert:
            - "Driver.${d1}.strikes_90d == 3 and standing == SUSPENDED (third no-show crosses the >= 3 threshold)"
            - "Booking.${b4}.status == CANCELLED and billing_status == WAIVED and fee_cents == 0 (system cancellation never charges)"
            - "Booking.${b1}.status == NO_SHOW and Booking.${b1}.fee_cents == 4500"

      - name: overdue_invoice_suspends_fleet_and_cancels_fleet_bookings
        grounds:
          - state_machines.Invoice.ISSUED_to_OVERDUE
          - state_machines.FleetAccount.ACTIVE_to_SUSPENDED
          - state_machines.DriverAuthorization.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Trigger = fleet ops-run overdue sweep (different trigger than the no-show sweep). Chain
          depth 4: Invoice -> OVERDUE mutates FleetAccount -> SUSPENDED; that suspends every ACTIVE
          DriverAuthorization (auto_suspended=true); each suspension cancels the driver's future
          FLEET_BILL bookings -> CANCELLED with billing WAIVED.
        test_recipe:
          setup:
            - "Site S (base 5000) 2 reservable stalls; fleet F (credit 10000000, terms 30); driver D ACTIVE-authorized"
            - "B1 arrival 2026-08-03 checked in/out (final 4500, UNBILLED); B2 arrival 2026-10-10 BOOKED on the same fleet"
            - "Invoice for 2026-08 issued at clock 2026-09-01 with due_date 2026-09-30"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R02", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /fleet-accounts", payload: { company_name: "F", credit_limit_cents: 10000000, payment_terms_days: 30 }, as: NetworkAdmin, captures: { fl: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-O1", full_name: "O One" }, as: Anonymous, captures: { d1: $.data.id } }
            - { call: "POST /driver-authorizations", payload: { driver_id: "${d1}", fleet_account_id: "${fl}" }, as: Driver, as_user_id: "${d1}", captures: { au: $.data.id } }
            - { call: "POST /driver-authorizations/${au}/transition", payload: { to: "ACTIVE" }, as: FleetManager, as_user_id: "${fl}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-03", night_count: 1, payment_mode: "FLEET_BILL", fleet_account_id: "${fl}" }, as: Driver, as_user_id: "${d1}", captures: { b1: $.data.id } }
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-10-10", night_count: 1, payment_mode: "FLEET_BILL", fleet_account_id: "${fl}" }, as: Driver, as_user_id: "${d1}", captures: { b2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T15:30:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings/${b1}/check-in", payload: {}, as: Driver, as_user_id: "${d1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T10:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings/${b1}/check-out", payload: {}, as: Driver, as_user_id: "${d1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /fleet-accounts/${fl}/close-billing-period", payload: { period: "2026-08" }, as: NetworkAdmin, captures: { inv: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: NetworkAdmin }
          trigger:
            - { call: "POST /fleet-accounts/${fl}/ops-run", payload: {}, as: NetworkAdmin, captures: { fstat: $.data.status, fauto: $.data.auto_suspended } }
            - { call: "GET /driver-authorizations/${au}", payload: {}, as: NetworkAdmin, captures: { austat: $.data.status } }
            - { call: "GET /bookings/${b2}", payload: {}, as: NetworkAdmin, captures: { b2s: $.data.status, b2b: $.data.billing_status, b2f: $.data.fee_cents } }
            - { call: "GET /invoices/${inv}", payload: {}, as: NetworkAdmin, captures: { invs: $.data.status } }
          assert:
            - "Invoice.${inv}.status == OVERDUE (clock 2026-10-01 > due 2026-09-30)"
            - "FleetAccount.${fl}.status == SUSPENDED and auto_suspended == true"
            - "DriverAuthorization.${au}.status == SUSPENDED"
            - "Booking.${b2}.status == CANCELLED and billing_status == WAIVED and fee_cents == 0"

      - name: invoice_payment_paid_cascade_earns_loyalty_points
        grounds:
          - state_machines.Invoice.PARTIALLY_PAID_to_PAID
          - state_machines.Booking.INVOICED_to_PAID
          - calculations.loyalty_points_ledger
        distinguishing_aspect: |
          Trigger = invoice payment (different from both ops-run triggers). Chain depth 3: payment
          completing the invoice flips Invoice -> PAID; that flips each member Booking's
          billing_status INVOICED -> PAID; each flip credits the Driver's loyalty points.
        test_recipe:
          setup:
            - "Same fleet pipeline as a settled 1-night FLEET_BILL booking (final 4500) invoiced for 2026-08; invoice net 4500 unpaid"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /fleet-accounts", payload: { company_name: "F", credit_limit_cents: 10000000, payment_terms_days: 30 }, as: NetworkAdmin, captures: { fl: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-L1", full_name: "L One" }, as: Anonymous, captures: { d1: $.data.id } }
            - { call: "POST /driver-authorizations", payload: { driver_id: "${d1}", fleet_account_id: "${fl}" }, as: Driver, as_user_id: "${d1}", captures: { au: $.data.id } }
            - { call: "POST /driver-authorizations/${au}/transition", payload: { to: "ACTIVE" }, as: FleetManager, as_user_id: "${fl}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-03", night_count: 1, payment_mode: "FLEET_BILL", fleet_account_id: "${fl}" }, as: Driver, as_user_id: "${d1}", captures: { b1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T15:30:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings/${b1}/check-in", payload: {}, as: Driver, as_user_id: "${d1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T10:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings/${b1}/check-out", payload: {}, as: Driver, as_user_id: "${d1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /fleet-accounts/${fl}/close-billing-period", payload: { period: "2026-08" }, as: NetworkAdmin, captures: { inv: $.data.id } }
          trigger:
            - { call: "POST /invoices/${inv}/payments", payload: { amount_cents: 4500 }, as: FleetManager, as_user_id: "${fl}", captures: { istat: $.data.status } }
            - { call: "GET /bookings/${b1}", payload: {}, as: NetworkAdmin, captures: { bb: $.data.billing_status } }
            - { call: "GET /drivers/${d1}", payload: {}, as: NetworkAdmin, captures: { pts: $.data.loyalty_points_balance, nights: $.data.settled_nights_90d } }
          assert:
            - "Invoice.${inv}.status == PAID"
            - "Booking.${b1}.billing_status == PAID (cascade hop 2)"
            - "Driver.${d1}.loyalty_points_balance == 10 (10 x 1 night, cascade hop 3) and settled_nights_90d == 1"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: escalated_site_beats_past_window
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_SITE_ESCALATED]
          - errors[ERR_WINDOW_IN_PAST]
        distinguishing_aspect: |
          Category pair business_safety (pri 7) vs business_temporal (pri 8): a create request on
          an ESCALATED site whose arrival_date is also in the past must return ERR_SITE_ESCALATED,
          not ERR_WINDOW_IN_PAST.
        test_recipe:
          setup:
            - "Site S with 1 reservable stall; clock at 2026-08-10T00:00:00Z; CRITICAL SECURITY incident open -> posture ESCALATED"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-V1", full_name: "V One" }, as: Anonymous, captures: { d1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/incidents", payload: { category: "SECURITY", severity: "CRITICAL", description: "break-in", reporter_driver_id: "${d1}" }, as: Driver, as_user_id: "${d1}" }
          trigger:
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-01", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SITE_ESCALATED (priority 7 safety beats priority 8 temporal), NOT ERR_WINDOW_IN_PAST"

      - name: missing_authorization_beats_credit_limit
        grounds:
          - validations[priority=13]
          - validations[priority=19]
          - errors[ERR_DRIVER_NOT_AUTHORIZED]
          - errors[ERR_FLEET_CREDIT_EXCEEDED]
        distinguishing_aspect: |
          Category pair business_referential (pri 13) vs business_fiscal (pri 19): a FLEET_BILL
          create whose authorization is merely PENDING and whose fleet credit would also be
          exceeded must return ERR_DRIVER_NOT_AUTHORIZED.
        test_recipe:
          setup:
            - "Site S with 1 reservable stall; fleet F with credit_limit_cents == 1 (any quote exceeds); driver D with a PENDING (never approved) authorization"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /fleet-accounts", payload: { company_name: "F", credit_limit_cents: 1, payment_terms_days: 30 }, as: NetworkAdmin, captures: { fl: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-V2", full_name: "V Two" }, as: Anonymous, captures: { d1: $.data.id } }
            - { call: "POST /driver-authorizations", payload: { driver_id: "${d1}", fleet_account_id: "${fl}" }, as: Driver, as_user_id: "${d1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
          trigger:
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "FLEET_BILL", fleet_account_id: "${fl}" }, as: Driver, as_user_id: "${d1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DRIVER_NOT_AUTHORIZED (priority 13 referential beats priority 19 fiscal), NOT ERR_FLEET_CREDIT_EXCEEDED"

  - rule_id: boundary_precision_check
    instances:
      - name: occupancy_tier_inclusive_boundaries_60_and_80
        grounds:
          - calculations.nightly_dynamic_rate
          - endpoints["POST /bookings"]
        distinguishing_aspect: |
          Metric = occupancy percent, endpoint = POST /bookings. With 5 reservable stalls the 4th
          booking sees 3/5 = 60% (mult_mid, >= boundary) and the 5th sees 4/5 = 80% (mult_high);
          the 3rd sees 40% (mult_low) — all three tier edges pinned on a non-peak Monday.
        test_recipe:
          setup:
            - "Site S (base 5000) with 5 reservable stalls, no bookings; clock 2026-08-01"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R02", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R03", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R04", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R05", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-B1", full_name: "B One" }, as: Anonymous, captures: { d1: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-B2", full_name: "B Two" }, as: Anonymous, captures: { d2: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-B3", full_name: "B Three" }, as: Anonymous, captures: { d3: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-B4", full_name: "B Four" }, as: Anonymous, captures: { d4: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-B5", full_name: "B Five" }, as: Anonymous, captures: { d5: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d1}" }
            - { call: "POST /bookings", payload: { driver_id: "${d2}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d2}" }
          trigger:
            - { call: "POST /bookings", payload: { driver_id: "${d3}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d3}", captures: { q3: $.data.quoted_total_cents } }
            - { call: "POST /bookings", payload: { driver_id: "${d4}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d4}", captures: { q4: $.data.quoted_total_cents } }
            - { call: "POST /bookings", payload: { driver_id: "${d5}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d5}", captures: { q5: $.data.quoted_total_cents } }
          assert:
            - "3rd booking (sees 2/5 = 40%) quoted_total_cents == 4500 (mult_low 0.9)"
            - "4th booking (sees 3/5 = 60%, INCLUSIVE tier2 boundary) quoted_total_cents == 5000 (mult_mid 1.0)"
            - "5th booking (sees 4/5 = 80%, INCLUSIVE tier3 boundary) quoted_total_cents == 6250 (mult_high 1.25)"

      - name: checkin_grace_inclusive_minute_boundary
        grounds:
          - state_machines.Booking.BOOKED_to_CHECKED_IN
          - validations[priority=9]
        distinguishing_aspect: |
          Metric = minutes after checkin_open_at, endpoint = POST /bookings/{id}/check-in. At
          exactly open + 60 minutes check-in succeeds (inclusive <=); one second later it fails
          ERR_CHECKIN_GRACE_ELAPSED.
        test_recipe:
          setup:
            - "Site S (base 5000, default no_show_grace_minutes 60) with 2 reservable stalls; two 1-night bookings B1 (driver X) and B2 (driver Y) arrival 2026-08-10; checkin_open_at = 2026-08-10T15:00:00Z"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R02", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-G1", full_name: "G One" }, as: Anonymous, captures: { d1: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-G2", full_name: "G Two" }, as: Anonymous, captures: { d2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d1}", captures: { b1: $.data.id } }
            - { call: "POST /bookings", payload: { driver_id: "${d2}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d2}", captures: { b2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T16:00:00Z" }, as: NetworkAdmin }
          trigger:
            - { call: "POST /bookings/${b1}/check-in", payload: {}, as: Driver, as_user_id: "${d1}", captures: { s1: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T16:00:01Z" }, as: NetworkAdmin }
            - { call: "POST /bookings/${b2}/check-in", payload: {}, as: Driver, as_user_id: "${d2}", captures: { err: $.data.error_id } }
          assert:
            - "B1 at exactly 16:00:00Z (grace boundary, inclusive) -> status == CHECKED_IN"
            - "B2 at 16:00:01Z -> error_id == ERR_CHECKIN_GRACE_ELAPSED"

      - name: shower_nightly_capacity_exactly_at_limit
        grounds:
          - calculations.shower_capacity_check
          - endpoints["POST /bookings/{booking_id}/amenities"]
        distinguishing_aspect: |
          Metric = integer units in a nightly bucket, endpoint = POST /bookings/{id}/amenities.
          Capacity 2: the line bringing consumption to exactly 2 succeeds (<= boundary); the next
          line for the same night fails ERR_AMENITY_CAPACITY_EXCEEDED.
        test_recipe:
          setup:
            - "Site S (base 5000) 3 reservable stalls; SHOWER product nightly_capacity 2"
            - "Three 1-night bookings B1/B2/B3 arrival 2026-08-10 by three drivers"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R02", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R03", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/amenity-products", payload: { code: "SHOWER", name: "Shower", price_cents: 1500, nightly_capacity: 2 }, as: NetworkAdmin, captures: { ap: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-S1", full_name: "S One" }, as: Anonymous, captures: { d1: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-S2", full_name: "S Two" }, as: Anonymous, captures: { d2: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-S3", full_name: "S Three" }, as: Anonymous, captures: { d3: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d1}", captures: { b1: $.data.id } }
            - { call: "POST /bookings", payload: { driver_id: "${d2}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d2}", captures: { b2: $.data.id } }
            - { call: "POST /bookings", payload: { driver_id: "${d3}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d3}", captures: { b3: $.data.id } }
          trigger:
            - { call: "POST /bookings/${b1}/amenities", payload: { amenity_product_id: "${ap}", quantity: 1 }, as: Driver, as_user_id: "${d1}", captures: { l1: $.data.status } }
            - { call: "POST /bookings/${b2}/amenities", payload: { amenity_product_id: "${ap}", quantity: 1 }, as: Driver, as_user_id: "${d2}", captures: { l2: $.data.status } }
            - { call: "POST /bookings/${b3}/amenities", payload: { amenity_product_id: "${ap}", quantity: 1 }, as: Driver, as_user_id: "${d3}", captures: { err: $.data.error_id } }
          assert:
            - "B1 line RESERVED (consumed 1 <= 2) and B2 line RESERVED (consumed 2 == 2, inclusive boundary allowed)"
            - "B3 line -> error_id == ERR_AMENITY_CAPACITY_EXCEEDED (2 + 1 > 2)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: checkin_rejected_when_stall_out_of_service
        grounds:
          - state_machines.Booking.BOOKED_to_CHECKED_IN
          - state_machines.Stall.ACTIVE_to_OUT_OF_SERVICE
          - errors[ERR_STALL_OUT_OF_SERVICE]
        distinguishing_aspect: |
          Entity pair Booking -> Stall: check-in is gated on the linked stall still being ACTIVE.
          The stall is taken OUT_OF_SERVICE after the check-in window opened, so the reassignment
          cascade spares the booking and the dependency itself is what rejects the check-in.
        test_recipe:
          setup:
            - "Site S (base 5000) with 1 reservable stall R01; driver D booking arrival 2026-08-10 (BOOKED, stall R01)"
            - "Clock inside the check-in window (2026-08-10T15:30:00Z); R01 then set OUT_OF_SERVICE"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin, captures: { s1: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-X1", full_name: "X One" }, as: Anonymous, captures: { d1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d1}", captures: { b1: $.data.id, bstall: $.data.stall_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T15:30:00Z" }, as: NetworkAdmin }
            - { call: "PATCH /sites/${site_id}/stalls/${s1}", payload: { status: "OUT_OF_SERVICE" }, as: SiteOperator, as_user_id: "op-alice" }
          trigger:
            - { call: "POST /bookings/${b1}/check-in", payload: {}, as: Driver, as_user_id: "${d1}", captures: { err: $.data.error_id } }
          assert:
            - "Booking.${b1}.stall_id == ${s1} (window already open, so no reassignment)"
            - "check-in -> error_id == ERR_STALL_OUT_OF_SERVICE and Booking.${b1}.status stays BOOKED"

      - name: fleet_bill_booking_requires_active_authorization
        grounds:
          - state_machines.DriverAuthorization.ACTIVE_to_REVOKED
          - validations[priority=13]
          - errors[ERR_DRIVER_NOT_AUTHORIZED]
        distinguishing_aspect: |
          Entity pair Booking -> DriverAuthorization (different pair than Booking -> Stall):
          FLEET_BILL creation requires the linked authorization in ACTIVE; a REVOKED authorization
          rejects the booking even though the fleet itself is ACTIVE and credit-sufficient.
        test_recipe:
          setup:
            - "Site S with 1 reservable stall; fleet F (credit 10000000) ACTIVE; driver D authorization approved then REVOKED"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /fleet-accounts", payload: { company_name: "F", credit_limit_cents: 10000000, payment_terms_days: 30 }, as: NetworkAdmin, captures: { fl: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-X2", full_name: "X Two" }, as: Anonymous, captures: { d1: $.data.id } }
            - { call: "POST /driver-authorizations", payload: { driver_id: "${d1}", fleet_account_id: "${fl}" }, as: Driver, as_user_id: "${d1}", captures: { au: $.data.id } }
            - { call: "POST /driver-authorizations/${au}/transition", payload: { to: "ACTIVE" }, as: FleetManager, as_user_id: "${fl}" }
            - { call: "POST /driver-authorizations/${au}/transition", payload: { to: "REVOKED" }, as: FleetManager, as_user_id: "${fl}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
          trigger:
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "FLEET_BILL", fleet_account_id: "${fl}" }, as: Driver, as_user_id: "${d1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DRIVER_NOT_AUTHORIZED (authorization is REVOKED)"
            - "no booking is created for driver ${d1} (GET /bookings?driver_id returns empty list)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: stall_half_open_interval_back_to_back
        grounds:
          - calculations.stall_assignment_selector
          - errors[ERR_STALL_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Resource = Stall, semantics = half-open intervals [15:00 arrival, 11:00 departure) with
          a built-in turnover gap: a departure-day arrival on the SAME stall is legal (adjacency),
          while a genuinely overlapping request naming the stall is rejected.
        test_recipe:
          setup:
            - "Site S (base 5000) with exactly 1 reservable stall R01; drivers X, Y, Z"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin, captures: { s1: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-Y1", full_name: "Y One" }, as: Anonymous, captures: { d1: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-Y2", full_name: "Y Two" }, as: Anonymous, captures: { d2: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-Y3", full_name: "Y Three" }, as: Anonymous, captures: { d3: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d1}", captures: { b1: $.data.id, st1: $.data.stall_id } }
          trigger:
            - { call: "POST /bookings", payload: { driver_id: "${d2}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-11", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d2}", captures: { b2: $.data.id, st2: $.data.stall_id } }
            - { call: "POST /bookings", payload: { driver_id: "${d3}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "DRIVER_DIRECT", stall_id: "${s1}" }, as: Driver, as_user_id: "${d3}", captures: { err: $.data.error_id } }
          assert:
            - "Booking.${b1}.stall_id == ${s1} and Booking.${b2}.stall_id == ${s1} (11:00Z departure vs 15:00Z arrival: half-open adjacency legal)"
            - "overlapping request naming stall ${s1} -> error_id == ERR_STALL_WINDOW_CONFLICT"

      - name: shower_nightly_bucket_not_interval
        grounds:
          - calculations.shower_capacity_check
          - errors[ERR_AMENITY_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Resource = AmenityProduct, semantics = discrete per-night buckets (NOT half-open
          intervals): a 2-night booking consumes the bucket on BOTH nights, so a second booking
          arriving on the second night collides even though interval-style turnover logic would
          call it adjacent; a booking arriving after the span does not collide.
        test_recipe:
          setup:
            - "Site S (base 5000) with 3 reservable stalls; SHOWER nightly_capacity == 1"
            - "B1: driver X, 2 nights arrival 2026-08-10, shower qty 1 (consumes buckets 08-10 and 08-11)"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R02", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R03", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/amenity-products", payload: { code: "SHOWER", name: "Shower", price_cents: 1500, nightly_capacity: 1 }, as: NetworkAdmin, captures: { ap: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-Z1", full_name: "Z One" }, as: Anonymous, captures: { d1: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-Z2", full_name: "Z Two" }, as: Anonymous, captures: { d2: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-Z3", full_name: "Z Three" }, as: Anonymous, captures: { d3: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 2, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d1}", captures: { b1: $.data.id } }
            - { call: "POST /bookings/${b1}/amenities", payload: { amenity_product_id: "${ap}", quantity: 1 }, as: Driver, as_user_id: "${d1}" }
            - { call: "POST /bookings", payload: { driver_id: "${d2}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-11", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d2}", captures: { b2: $.data.id } }
            - { call: "POST /bookings", payload: { driver_id: "${d3}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-12", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d3}", captures: { b3: $.data.id } }
          trigger:
            - { call: "POST /bookings/${b2}/amenities", payload: { amenity_product_id: "${ap}", quantity: 1 }, as: Driver, as_user_id: "${d2}", captures: { err: $.data.error_id } }
            - { call: "POST /bookings/${b3}/amenities", payload: { amenity_product_id: "${ap}", quantity: 1 }, as: Driver, as_user_id: "${d3}", captures: { l3: $.data.status } }
          assert:
            - "B2 (night 2026-08-11 bucket already consumed by B1's span) -> error_id == ERR_AMENITY_CAPACITY_EXCEEDED"
            - "B3 (night 2026-08-12 bucket free) -> line status RESERVED"

  - rule_id: compensating_invariant
    instances:
      - name: stall_free_count_conserved_across_create_and_cancel
        grounds:
          - calculations.stall_assignment_selector
          - state_machines.Booking.BOOKED_to_CANCELLED
          - endpoints["GET /sites/{site_id}/availability"]
        distinguishing_aspect: |
          Conserved quantity = count of free reservable stalls for a window. Formula:
          reservable_free(w) == reservable_total - |{b: b non-terminal, window overlaps w}|.
          Create then cancel must return the count to its exact prior value (zero drift).
        test_recipe:
          setup:
            - "Site S (base 5000) with 2 reservable stalls; driver D; clock 2026-08-01; probe window 2026-08-10T15:00Z..2026-08-11T11:00Z"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R02", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-K1", full_name: "K One" }, as: Anonymous, captures: { d1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "GET /sites/${site_id}/availability", payload: { window_start: "2026-08-10T15:00:00Z", window_end: "2026-08-11T11:00:00Z" }, as: NetworkAdmin, captures: { free0: $.data.reservable_free } }
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d1}", captures: { b1: $.data.id } }
            - { call: "GET /sites/${site_id}/availability", payload: { window_start: "2026-08-10T15:00:00Z", window_end: "2026-08-11T11:00:00Z" }, as: NetworkAdmin, captures: { free1: $.data.reservable_free } }
          trigger:
            - { call: "POST /bookings/${b1}/cancel", payload: {}, as: Driver, as_user_id: "${d1}", captures: { f: $.data.fee_cents, bs: $.data.billing_status } }
            - { call: "GET /sites/${site_id}/availability", payload: { window_start: "2026-08-10T15:00:00Z", window_end: "2026-08-11T11:00:00Z" }, as: NetworkAdmin, captures: { free2: $.data.reservable_free } }
          assert:
            - "reservable_free sequence == 2 -> 1 -> 2 (create consumes exactly one, cancel restores exactly one)"
            - "cancel at clock 2026-08-01 is inside the free window (<= 2026-08-09T15:00Z): fee_cents == 0 and billing_status == WAIVED"

      - name: fleet_balance_conserved_across_payment_and_writeoff
        grounds:
          - calculations.fleet_invoice_totals
          - state_machines.Invoice.DISPUTED_to_WRITTEN_OFF
          - calculations.loyalty_points_ledger
          - entities.FleetAccount.fields.current_balance_cents
        distinguishing_aspect: |
          Conserved quantity = FleetAccount.current_balance_cents ==
          sum over invoices with status != WRITTEN_OFF of (net_cents - paid_cents). A full payment
          followed by a dispute-WAIVED write-off must return the balance to its pre-invoice value
          AND claw back the loyalty points earned at payment (second conserved quantity: points).
        test_recipe:
          setup:
            - "Site S (base 5000) 1 reservable stall; fleet F (credit 10000000, terms 30); driver D ACTIVE-authorized"
            - "1-night FLEET_BILL booking settled at 4500, invoiced for 2026-08 (net 4500)"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /fleet-accounts", payload: { company_name: "F", credit_limit_cents: 10000000, payment_terms_days: 30 }, as: NetworkAdmin, captures: { fl: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-K2", full_name: "K Two" }, as: Anonymous, captures: { d1: $.data.id } }
            - { call: "POST /driver-authorizations", payload: { driver_id: "${d1}", fleet_account_id: "${fl}" }, as: Driver, as_user_id: "${d1}", captures: { au: $.data.id } }
            - { call: "POST /driver-authorizations/${au}/transition", payload: { to: "ACTIVE" }, as: FleetManager, as_user_id: "${fl}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-03", night_count: 1, payment_mode: "FLEET_BILL", fleet_account_id: "${fl}" }, as: Driver, as_user_id: "${d1}", captures: { b1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T15:30:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings/${b1}/check-in", payload: {}, as: Driver, as_user_id: "${d1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T10:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings/${b1}/check-out", payload: {}, as: Driver, as_user_id: "${d1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /fleet-accounts/${fl}/close-billing-period", payload: { period: "2026-08" }, as: NetworkAdmin, captures: { inv: $.data.id } }
            - { call: "GET /fleet-accounts/${fl}", payload: {}, as: NetworkAdmin, captures: { bal1: $.data.current_balance_cents } }
            - { call: "POST /invoices/${inv}/payments", payload: { amount_cents: 4500 }, as: FleetManager, as_user_id: "${fl}" }
            - { call: "GET /fleet-accounts/${fl}", payload: {}, as: NetworkAdmin, captures: { bal2: $.data.current_balance_cents } }
            - { call: "GET /drivers/${d1}", payload: {}, as: NetworkAdmin, captures: { pts1: $.data.loyalty_points_balance } }
          trigger:
            - { call: "POST /invoices/${inv}/dispute", payload: { reason: "duplicate charge" }, as: FleetManager, as_user_id: "${fl}" }
            - { call: "POST /invoices/${inv}/resolve-dispute", payload: { outcome: "WAIVED" }, as: NetworkAdmin, captures: { istat: $.data.status } }
            - { call: "GET /fleet-accounts/${fl}", payload: {}, as: NetworkAdmin, captures: { bal3: $.data.current_balance_cents, cred3: $.data.credit_cents } }
            - { call: "GET /drivers/${d1}", payload: {}, as: NetworkAdmin, captures: { pts2: $.data.loyalty_points_balance } }
            - { call: "GET /bookings/${b1}", payload: {}, as: NetworkAdmin, captures: { bb: $.data.billing_status } }
          assert:
            - "current_balance_cents sequence == 4500 (issued) -> 0 (paid) -> 0 (written off; formula excludes WRITTEN_OFF)"
            - "FleetAccount.${fl}.credit_cents == 4500 (refund of paid amount tracked as credit)"
            - "Driver.${d1}.loyalty_points_balance == 10 after payment, == 0 after write-off clawback"
            - "Booking.${b1}.billing_status == WAIVED and Invoice.${inv}.status == WRITTEN_OFF"
