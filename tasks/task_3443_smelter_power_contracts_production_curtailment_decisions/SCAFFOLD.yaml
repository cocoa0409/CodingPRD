- method: GET
  path: /smelter-ops/smelters/{id}/power-contracts
  description: List power contracts of a smelter.
  roles:
  - PlatformAdmin
  - EnergyManager
  - TradingAnalyst
  - SmelterManager
  - Controller
  - VPOperations
  - EHSManager
  code: 200
  input:
