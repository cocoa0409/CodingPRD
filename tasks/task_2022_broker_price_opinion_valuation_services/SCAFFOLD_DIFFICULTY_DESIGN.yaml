              as: ClientAdmin
              as_user_id: "${cl_x_id}"
              captures: { ord_x2: $.data.id, ord_x2_v: $.data.version }
            - call: "POST /bpo/valuation-orders/${ord_x2}/submit"
              payload: {}
              as: ClientAdmin
              as_user_id: "${cl_x_id}"
              captures: { ord_x2_v2: $.data.version }
            - call: "POST /bpo/valuation-orders/${ord_x2}/dispatch"
              payload: { broker_id: "${brk_x}", expected_order_version: "${ord_x2_v2}" }
              as: DispatchCoordinator
            - call: "POST /bpo/valuation-orders/${ord_x2}/accept"
              payload: {}
              as: Broker
              as_user_id: "${brk_x}"
            - call: "POST /bpo/valuation-orders/${ord_x2}/comparables"
              payload: { source_property_id: "${comp_x1}", sale_price_cents: 40000000, sale_date: "2026-06-01T00:00:00Z", distance_miles: 1.5, adjustment_cents: 0 }
              as: Broker
              as_user_id: "${brk_x}"
              captures: { cmp_x21: $.data.id }
            - call: "POST /bpo/valuation-orders/${ord_x2}/comparables"
              payload: { source_property_id: "${comp_x2}", sale_price_cents: 40000000, sale_date: "2026-06-02T00:00:00Z", distance_miles: 1.5, adjustment_cents: 0 }
              as: Broker
              as_user_id: "${brk_x}"
