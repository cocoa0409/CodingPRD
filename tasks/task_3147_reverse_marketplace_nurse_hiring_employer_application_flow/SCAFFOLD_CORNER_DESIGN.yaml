            - *k_emp
            - *k_nurse
            - *k_lic
            - *k_submit
            - *k_verify
            - *k_req
            - *k_app
            - *k_review
            - *k_iv
            - *k_clock_iv
            - *k_iv_done
            - *k_scr
            - *k_scr_cred
            - *k_scr_bg
            - *k_doc
            - *k_offer
          trigger:
            - call: "POST /marketplace/offers/${offer_id}/accept"
