# =============================================================================
# Equestrian Boarding & Barn Management — Scaffold Seed Tables (Expert tier)
# §1.0–§1.7 only. Difficulty design (§1.8) and corner design (§1.9) live in
# their own sibling files.
# =============================================================================

scenario: |
  Equestrian Boarding & Barn Management: horse boarding (stall/pasture) & billing,
  lesson/training schedule, farrier/vet/dentist visit, feed & supplement order,
  show/event entry, liability waiver, owner billing & deposit, turnout schedule

domain_name: equestrian-barn
api_prefix: "/"

# All monetary fields are integer cents to avoid float drift. All timestamps are
# ISO-8601 UTC with three fractional digits. The system clock used for temporal
# preconditions (waiver expiry; lesson 24h cancellation cutoff) is the value last
# set via POST /_clock/set_current_utc; it defaults to 1970-01-01T00:00:00.000Z.

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency        # OCC on Owner.version for billing-run supersede
    - cascading_side_effects        # waiver expiry -> agreement suspend -> lesson cancel
    - dual_variant_calculation      # provisional vs final boarding charge; owner standing
    - derived_field_reconciliation  # Owner.account_balance_cents; Stall.occupied_count

  entity_topology: flat
  # Peer entities linked by foreign keys. Owner is the billing aggregate root;
  # children (Horse, Lesson, ServiceVisit, ShowEntry, TurnoutAssignment,
  # BoardingAgreement, Invoice, LiabilityWaiver) reference parents by FK fields in
  # the body. Reverse-reachability is exposed via sub-resource and filtered-list GETs.

  state_machine_shape: cyclic
  # BoardingAgreement ACTIVE<->SUSPENDED and LiabilityWaiver SIGNED<->EXPIRED are
  # revision/renewal cycles; Lesson, ServiceVisit and ShowEntry are branching fork-joins.

  relationship_patterns:
    - one_to_many        # Owner->Horse; Horse->Lesson; Owner->Invoice
    - cross_aggregate    # ShowEntry / BoardingAgreement gate on LiabilityWaiver state across aggregates
    - polymorphic        # Invoice sweeps Lesson|ServiceVisit|ShowEntry|BoardingAgreement lines

  role_model: peer_roles
  # BarnManager owns lifecycle/billing; Instructor (opaque operator) completes lessons;
  # Owner acts on own horses/waivers/requests; ServiceProvider records visit outcomes.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Owner
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: full_name, type: string, source: input, description: "Owner's legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across Owners" }
      - { name: deposit_held_cents, type: integer, source: computed, default: 0, description: "Refundable security deposit currently held; raised/lowered via POST /owners/{id}/deposit, consumed when applied to a finalized Invoice, restored on void. Never negative." }
      - { name: account_balance_cents, type: integer, source: computed, default: 0, description: "Running ledger: sum of FINALIZED Invoice.amount_due_cents minus payments applied. Positive = owner owes the barn." }
      - { name: standing_score, type: integer, source: computed, default: 0, description: "Committed delinquency risk score 0..100; see calculations.owner_standing_score variant final. Gates suspension/reinstatement cascades." }
      - { name: provisional_standing_score, type: integer, source: computed, default: 0, description: "What-if standing score including OPEN (not-yet-finalized) invoices; see calculations.owner_standing_score variant provisional. Read-only projection, never gates anything." }
      - { name: status, type: enum, source: computed, default: "ACTIVE", description: "ACTIVE | DELINQUENT. Computed on every standing recompute: DELINQUENT when standing_score >= SUSPEND_SCORE, else ACTIVE." }

  - name: LiabilityWaiver
    parent: Owner
    common_fields: true
    fields:
      - { name: owner_id, type: string, source: input, description: "FK -> Owner.id; the signing owner" }
      - { name: signed_at, type: datetime, source: system, description: "Clock time the waiver was signed; null while PENDING" }
      - { name: expires_at, type: datetime, source: computed, description: "signed_at + VALIDITY_DAYS; recomputed on each (re)sign; null while PENDING" }
      - { name: superseded_by_id, type: string, source: system, description: "Lineage pointer to the id of a newer waiver that superseded this one; null otherwise. Forward lineage link (not a parent FK); discovered via the same owner's waiver list." }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | SIGNED | EXPIRED | SUPERSEDED" }

  - name: Stall
    parent: null
    common_fields: true
    fields:
      - { name: label, type: string, source: input, description: "Human label, e.g. 'Barn A-12'; unique across Stalls" }
      - { name: kind, type: enum, source: input, description: "STALL | PASTURE" }
      - { name: capacity, type: integer, source: input, constraints: "STALL kind must have capacity == 1; PASTURE kind must have capacity >= 1", description: "Max co-located horses the slot holds" }
      - { name: daily_rate_cents, type: integer, source: input, description: "Boarding rate per horse per occupied day" }
      - { name: occupied_count, type: integer, source: computed, default: 0, description: "Count of ACTIVE or SUSPENDED BoardingAgreements currently assigned to this stall; reconciled on activate (+1) and end (-1). Must never exceed capacity." }

  - name: Horse
    parent: Owner
    common_fields: true
    fields:
      - { name: owner_id, type: string, source: input, description: "FK -> Owner.id" }
      - { name: name, type: string, source: input, description: "Horse's barn name" }

  - name: BoardingAgreement
    parent: Horse
    common_fields: true
    fields:
      - { name: horse_id, type: string, source: input, description: "FK -> Horse.id" }
      - { name: stall_id, type: string, source: input, description: "FK -> Stall.id; the stall/pasture this horse occupies" }
      - { name: start_date, type: datetime, source: input, description: "First occupied day (inclusive)" }
      - { name: end_date, type: datetime, source: system, description: "Set when the agreement ENDS (move-out day, exclusive); null while DRAFT/ACTIVE/SUSPENDED" }
      - { name: suspended_days, type: integer, source: computed, default: 0, description: "Cumulative whole days the agreement has spent SUSPENDED, summed across all suspension intervals; used by calculations.boarding_charge final variant" }
      - { name: provisional_charge_cents, type: integer, source: computed, default: 0, description: "Forward-looking projected boarding charge; see calculations.boarding_charge variant provisional" }
      - { name: final_charge_cents, type: integer, source: computed, default: 0, description: "Chronological prorated boarding charge computed at end; see calculations.boarding_charge variant final" }
      - { name: suspended_at, type: datetime, source: system, description: "Clock time of most recent suspension; null while ACTIVE/DRAFT" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | ACTIVE | SUSPENDED | ENDED" }

  - name: Lesson
    parent: Horse
    common_fields: true
    fields:
      - { name: horse_id, type: string, source: input, description: "FK -> Horse.id" }
      - { name: instructor_name, type: string, source: input, description: "Name of the instructor delivering the lesson (instructors are opaque operators, not persisted entities)" }
      - { name: lesson_fee_cents, type: integer, source: input, description: "Full fee for a completed lesson" }
      - { name: starts_at, type: datetime, source: input, description: "Lesson start (inclusive boundary)" }
      - { name: ends_at, type: datetime, source: input, constraints: "ends_at > starts_at", description: "Lesson end (exclusive boundary)" }
      - { name: billed_fee_cents, type: integer, source: computed, default: 0, description: "Fee actually billed; set on completion/no-show/cancel; see calculations.lesson_fee" }
      - { name: invoiced, type: boolean, source: computed, default: false, description: "True once a FINALIZED Invoice has swept this lesson's billed_fee_cents" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | COMPLETED | NO_SHOW | CANCELLED" }

  - name: ServiceVisit
    parent: Horse
    common_fields: true
    fields:
      - { name: horse_id, type: string, source: input, description: "FK -> Horse.id" }
      - { name: visit_type, type: enum, source: input, description: "FARRIER | VET | DENTIST" }
      - { name: scheduled_at, type: datetime, source: input, description: "Visit start (inclusive)" }
      - { name: duration_minutes, type: integer, source: input, constraints: "> 0", description: "Expected duration; occupied window is [scheduled_at, scheduled_at + duration_minutes)" }
      - { name: fee_cents, type: integer, source: input, description: "Provider fee billed on completion" }
      - { name: invoiced, type: boolean, source: computed, default: false, description: "True once a FINALIZED Invoice swept this visit's fee_cents" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED | SCHEDULED | COMPLETED | CANCELLED" }

  - name: ShowEntry
    parent: Horse
    common_fields: true
    fields:
      - { name: horse_id, type: string, source: input, description: "FK -> Horse.id" }
      - { name: event_name, type: string, source: input, description: "Show/event name" }
      - { name: event_date, type: datetime, source: input, description: "Date of the event" }
      - { name: entry_fee_cents, type: integer, source: input, description: "Entry fee billed once confirmed" }
      - { name: invoiced, type: boolean, source: computed, default: false, description: "True once a FINALIZED Invoice swept this entry's entry_fee_cents" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | CONFIRMED | SCRATCHED | WITHDRAWN" }

  - name: TurnoutAssignment
    parent: Horse
    common_fields: true
    fields:
      - { name: horse_id, type: string, source: input, description: "FK -> Horse.id" }
      - { name: pasture_id, type: string, source: input, description: "FK -> Stall.id; must reference a Stall whose kind == PASTURE" }
      - { name: window_start, type: datetime, source: input, description: "Turnout start (inclusive boundary)" }
      - { name: window_end, type: datetime, source: input, constraints: "window_end > window_start", description: "Turnout end (exclusive boundary)" }
      - { name: status, type: enum, source: system, default: "BOOKED", description: "BOOKED | CANCELLED" }

  - name: Invoice
    parent: Owner
    common_fields: true
    fields:
      - { name: owner_id, type: string, source: input, description: "FK -> Owner.id; the billed owner" }
      - { name: period_label, type: string, source: input, description: "Billing period tag, e.g. '2026-06'" }
      - { name: gross_amount_cents, type: integer, source: computed, default: 0, description: "Sum of all swept line items before discount/deposit; see calculations.invoice_total" }
      - { name: multi_horse_discount_cents, type: integer, source: computed, default: 0, description: "Tiered discount when owner boards >= 2 horses on this invoice; see calculations.invoice_total" }
      - { name: deposit_applied_cents, type: integer, source: computed, default: 0, description: "Deposit consumed at finalization; bounded by Owner.deposit_held_cents and net amount" }
      - { name: amount_due_cents, type: integer, source: computed, default: 0, description: "max(0, gross - multi_horse_discount - deposit_applied)" }
      - { name: paid_amount_cents, type: integer, source: computed, default: 0, description: "Cumulative payments applied to this invoice via POST /invoices/{id}/transition (target_status=PAID)" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | FINALIZED | PAID | VOID" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: LiabilityWaiver
    initial_state: PENDING
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PENDING
        to: SIGNED
        trigger: "POST /owners/{id}/waivers/{id}/sign"
        actor: Owner
        preconditions:
          - "status == PENDING (else ERR_WAIVER_NOT_SIGNABLE)"
        side_effects:
          - "signed_at = clock now"
          - "expires_at = signed_at + VALIDITY_DAYS (calculations.waiver_expiry)"

      - from: SIGNED
        to: EXPIRED
        trigger: "system, on a GET list read of the owner's waivers (GET /owners/{id}/waivers), when clock now >= expires_at"
        actor: system
        preconditions:
          - "clock now >= expires_at (inclusive boundary; see calculations.waiver_expiry — boundary_precision_check waiver_expiry_boundary)"
        side_effects:
          - "status = EXPIRED"
          - "CASCADE: every ACTIVE BoardingAgreement of every Horse owned by this owner transitions ACTIVE -> SUSPENDED (transitive_cascade waiver_suspends_boarding hop 1->2)"

      - from: EXPIRED
        to: SIGNED
        trigger: "POST /owners/{id}/waivers/{id}/sign"
        actor: Owner
        preconditions:
          - "status == EXPIRED (re-sign renews the same waiver — CYCLE EXPIRED->SIGNED)"
        side_effects:
          - "signed_at = clock now; expires_at recomputed"
          - "CASCADE: every SUSPENDED BoardingAgreement of this owner's horses whose suspended_at is set transitions SUSPENDED -> ACTIVE, but only if Owner.standing_score < SUSPEND_SCORE"

      - from: SIGNED
        to: SUPERSEDED
        trigger: "system, on POST /owners/{id}/waivers when the owner already has a SIGNED waiver"
        actor: system
        preconditions:
          - "A new waiver is created for the same owner"
        side_effects:
          - "old waiver.superseded_by_id = new waiver.id; old waiver.status = SUPERSEDED"

  - entity: BoardingAgreement
    initial_state: DRAFT
    terminal_states: [ENDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /boarding-agreements/{id}/transition (target_status=ACTIVE)"
        actor: BarnManager
        preconditions:
          - "status == DRAFT (else ERR_INVALID_STATE)"
          - "Owner has a SIGNED non-expired LiabilityWaiver (else ERR_WAIVER_NOT_ACTIVE) — cross_entity_state_dependency boarding_requires_waiver"
          - "Stall.occupied_count < Stall.capacity (else ERR_STALL_FULL) — resource_temporal_overlap stall_capacity_slot"
        side_effects:
          - "status = ACTIVE"
          - "Stall.occupied_count += 1 (derived-field reconciliation)"
          - "provisional_charge_cents computed (calculations.boarding_charge variant provisional)"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /boarding-agreements/{id}/transition (target_status=SUSPENDED) OR waiver-expiry cascade"
        actor: BarnManager | system
        preconditions:
          - "status == ACTIVE (else ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects:
          - "status = SUSPENDED; suspended_at = clock now"
          - "CASCADE: every SCHEDULED Lesson of this horse with starts_at >= clock now transitions SCHEDULED -> CANCELLED with billed_fee_cents = 0 (transitive_cascade waiver_suspends_boarding hop 2->3)"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /boarding-agreements/{id}/transition (target_status=ACTIVE) OR waiver re-sign cascade"
        actor: BarnManager | system
        preconditions:
          - "status == SUSPENDED (else ERR_INVALID_STATE)"
          - "Owner has a SIGNED non-expired waiver (else ERR_WAIVER_NOT_ACTIVE)"
          - "Owner.standing_score < SUSPEND_SCORE (else ERR_OWNER_DELINQUENT) — cross_entity_state_dependency reinstate_requires_standing"
        side_effects:
          - "status = ACTIVE; suspended_days += whole days between suspended_at and clock now; suspended_at = null (CYCLE SUSPENDED->ACTIVE)"

      - from: [ACTIVE, SUSPENDED]
        to: ENDED
        trigger: "POST /boarding-agreements/{id}/transition (target_status=ENDED)"
        actor: BarnManager
        preconditions:
          - "status in {ACTIVE, SUSPENDED}"
        side_effects:
          - "status = ENDED; end_date = clock now"
          - "if was SUSPENDED, suspended_days += whole days between suspended_at and clock now"
          - "final_charge_cents computed (calculations.boarding_charge variant final)"
          - "Stall.occupied_count -= 1 (compensating_invariant stall_occupancy_conservation)"
          - "CASCADE: every BOOKED TurnoutAssignment of this horse with window_start >= clock now transitions BOOKED -> CANCELLED (transitive_cascade end_releases_resources hop 1->2)"

  - entity: Lesson
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /lessons/{id}/transition (target_status=COMPLETED)"
        actor: Instructor
        preconditions:
          - "status == SCHEDULED (else ERR_INVALID_STATE)"
          - "horse's BoardingAgreement is ACTIVE (else ERR_BOARDING_NOT_ACTIVE) — cross_entity_state_dependency lesson_requires_active_boarding"
        side_effects:
          - "billed_fee_cents = lesson_fee_cents (calculations.lesson_fee variant completed)"
        note: "BRANCH 1 of the SCHEDULED fork — full fee; divergent side-effect set from the other two branches."

      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /lessons/{id}/transition (target_status=NO_SHOW)"
        actor: Instructor
        preconditions:
          - "status == SCHEDULED (else ERR_INVALID_STATE)"
        side_effects:
          - "billed_fee_cents = round_half_up(lesson_fee_cents * NO_SHOW_PCT) (calculations.lesson_fee variant no_show)"
        note: "BRANCH 2 — partial fee."

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /lessons/{id}/transition (target_status=CANCELLED)"
        actor: BarnManager | Owner | Instructor
        preconditions:
          - "status == SCHEDULED (else ERR_INVALID_STATE)"
          - "clock now <= starts_at - CANCEL_CUTOFF_HOURS (else ERR_CANCEL_TOO_LATE) — boundary_precision_check lesson_cancel_cutoff"
        side_effects:
          - "billed_fee_cents = 0"
        note: "BRANCH 3 — zero fee; divergent from both other branches."

  - entity: ServiceVisit
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /service-visits/{id}/transition (target_status=SCHEDULED)"
        actor: BarnManager
        preconditions:
          - "status == REQUESTED (else ERR_INVALID_STATE)"
          - "no other SCHEDULED/COMPLETED ServiceVisit for the SAME horse whose [scheduled_at, scheduled_at+duration) window overlaps this one (else ERR_VISIT_OVERLAP) — resource_temporal_overlap visit_horse_window"
        side_effects:
          - "status = SCHEDULED"

      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /service-visits/{id}/transition (target_status=COMPLETED)"
        actor: ServiceProvider
        preconditions:
          - "status == SCHEDULED (else ERR_INVALID_STATE)"
        side_effects:
          - "status = COMPLETED (fee_cents becomes an invoiceable line)"

      - from: [REQUESTED, SCHEDULED]
        to: CANCELLED
        trigger: "POST /service-visits/{id}/transition (target_status=CANCELLED)"
        actor: BarnManager | Owner
        preconditions:
          - "status in {REQUESTED, SCHEDULED}"
        side_effects:
          - "status = CANCELLED (releases the horse's window so a new visit may be scheduled)"

  - entity: ShowEntry
    initial_state: SUBMITTED
    terminal_states: [SCRATCHED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: CONFIRMED
        trigger: "POST /show-entries/{id}/transition (target_status=CONFIRMED)"
        actor: BarnManager
        preconditions:
          - "status == SUBMITTED (else ERR_INVALID_STATE)"
          - "Owner has a SIGNED non-expired LiabilityWaiver (else ERR_WAIVER_NOT_ACTIVE) — cross_entity_state_dependency show_requires_waiver"
        side_effects:
          - "status = CONFIRMED (entry_fee_cents becomes an invoiceable line)"

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /show-entries/{id}/transition (target_status=WITHDRAWN)"
        actor: Owner
        preconditions:
          - "status == SUBMITTED (else ERR_INVALID_STATE)"
        side_effects:
          - "status = WITHDRAWN (no fee billed)"

      - from: CONFIRMED
        to: SCRATCHED
        trigger: "POST /show-entries/{id}/transition (target_status=SCRATCHED)"
        actor: BarnManager
        preconditions:
          - "status == CONFIRMED (else ERR_INVALID_STATE)"
        side_effects:
          - "status = SCRATCHED (entry_fee_cents remains billable as a no-refund line)"

  - entity: TurnoutAssignment
    initial_state: BOOKED
    terminal_states: [CANCELLED]
    transitions:
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /turnout-assignments/{id}/transition (target_status=CANCELLED) OR agreement-end cascade"
        actor: BarnManager | Owner | system
        preconditions:
          - "status == BOOKED (else ERR_INVALID_STATE)"
        side_effects:
          - "status = CANCELLED (frees the horse's slot in the pasture's concurrent-capacity count)"

  - entity: Invoice
    initial_state: OPEN
    terminal_states: [PAID, VOID]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /invoices/{id}/transition (target_status=FINALIZED)"
        actor: BarnManager
        preconditions:
          - "status == OPEN (else ERR_INVOICE_NOT_OPEN)"
          - "at least one unbilled billable line exists for the owner (else ERR_NO_BILLABLE_LINES)"
          - "expected_owner_version == Owner.version (else ERR_STALE_OWNER_VERSION) — concurrency owner-invoice-finalize-stale"
        side_effects:
          - "gross_amount_cents, multi_horse_discount_cents, deposit_applied_cents, amount_due_cents computed (calculations.invoice_total)"
          - "Owner.deposit_held_cents -= deposit_applied_cents (compensating_invariant deposit_conservation)"
          - "Owner.account_balance_cents += amount_due_cents (derived-field reconciliation)"
          - "swept Lesson/ServiceVisit/ShowEntry/BoardingAgreement lines marked invoiced = true"
          - "Owner.version += 1"
          - "Owner.standing_score recomputed (calculations.owner_standing_score variant final)"

      - from: FINALIZED
        to: PAID
        trigger: "POST /invoices/{id}/transition (target_status=PAID)"
        actor: BarnManager
        preconditions:
          - "status == FINALIZED (else ERR_INVOICE_NOT_FINALIZED)"
          - "paid_amount_cents + amount_cents <= amount_due_cents (else ERR_OVERPAYMENT)"
        side_effects:
          - "paid_amount_cents += amount_cents"
          - "Owner.account_balance_cents -= amount_cents"
          - "status = PAID once paid_amount_cents == amount_due_cents (boundary_precision_check payment_settles)"
          - "Owner.standing_score recomputed (calculations.owner_standing_score variant final)"

      - from: OPEN
        to: VOID
        trigger: "POST /invoices/{id}/transition (target_status=VOID)"
        actor: BarnManager
        preconditions:
          - "status == OPEN"
        side_effects:
          - "status = VOID (no deposit was applied while OPEN, so deposit_held_cents is unchanged — compensating_invariant deposit_conservation)"

      - from: FINALIZED
        to: VOID
        trigger: "POST /invoices/{id}/transition (target_status=VOID)"
        actor: BarnManager
        preconditions:
          - "status == FINALIZED"
          - "paid_amount_cents == 0 (else ERR_INVOICE_HAS_PAYMENTS)"
        side_effects:
          - "status = VOID"
          - "Owner.deposit_held_cents += deposit_applied_cents (restore — compensating_invariant deposit_conservation)"
          - "Owner.account_balance_cents -= amount_due_cents"
          - "swept lines reverted to invoiced = false"
          - "Owner.version += 1"
          - "Owner.standing_score recomputed (calculations.owner_standing_score variant final)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: owner-invoice-finalize-stale
    parent_entity: Owner
    write_endpoint: "POST /invoices/{id}/transition"
    occ_field: "expected_owner_version"
    description: |
      Finalizing an Invoice against an Owner whose version has advanced since the
      client last observed it is rejected. Finalization debits the owner's deposit
      and account balance and sweeps billable lines into this invoice; when another
      finalization has already advanced Owner.version (legitimately superseding the
      owner's prior billing snapshot by consuming deposit and marking lines invoiced),
      the current writer's view of remaining deposit and unbilled lines is stale and
      must be refused so the same lines/deposit are not double-counted.
    error_id: ERR_STALE_OWNER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: waiver_expiry
    trigger: "LiabilityWaiver sign / re-sign (PENDING->SIGNED, EXPIRED->SIGNED)"
    algorithm: threshold
    formula: |
      expires_at = signed_at + (VALIDITY_DAYS days)
      A waiver is EXPIRED when clock_now >= expires_at (INCLUSIVE boundary:
      at exactly expires_at the waiver IS expired).
    input_set: "single waiver's signed_at"
    constants:
      VALIDITY_DAYS: 365
    precision: "datetime arithmetic, UTC, no rounding"
    note: "Boundary: clock_now == expires_at => EXPIRED. boundary_precision_check waiver_expiry_boundary."

  - name: boarding_charge
    trigger: "BoardingAgreement DRAFT->ACTIVE (provisional) and {ACTIVE,SUSPENDED}->ENDED (final)"
    algorithm: chronological
    formula: |
      daily = Stall.daily_rate_cents
      provisional variant (forward-looking, at activation):
        # Projects a full standard billing month, ignoring any future suspension.
        provisional_charge_cents = daily * BILLING_MONTH_DAYS
      final variant (chronological, at end):
        # Walks actual occupancy day-by-day from start_date (inclusive) to end_date
        # (exclusive); SUSPENDED days are NOT charged.
        occupied_days = whole_days_between(start_date, end_date)   # exclusive end, floor
        charged_days  = occupied_days - suspended_days
        final_charge_cents = daily * charged_days
    input_set: "agreement.start_date, end_date, suspended_days; Stall.daily_rate_cents"
    constants:
      BILLING_MONTH_DAYS: 30
    precision: "integer cents; whole days only (floor of the day difference)"
    variants:
      - name: provisional
        when: "at DRAFT->ACTIVE; before actual occupancy is known"
        difference: "forward-looking flat BILLING_MONTH_DAYS projection; ignores suspensions and actual move-out"
      - name: final
        when: "at end"
        difference: "chronological day-walk: occupied_days minus suspended_days; equals provisional only when occupied_days == BILLING_MONTH_DAYS and suspended_days == 0"

  - name: owner_standing_score
    trigger: "Invoice finalize / void / pay (final variant); GET /owners/{id} read (provisional variant projection)"
    algorithm: weighted_scoring
    formula: |
      # Delinquency risk on the OWNER (distinct entity domain from boarding cost).
      base = min(60, floor(max(0, balance) / OVERDUE_UNIT_CENTS) * POINTS_PER_UNIT)
      open_unpaid = count of FINALIZED Invoices of this owner with paid_amount_cents < amount_due_cents
      penalty = min(40, open_unpaid * UNPAID_INVOICE_POINTS)
      score = min(100, base + penalty)
    input_set: "Owner balance; FINALIZED partially/un-paid Invoices for the owner"
    constants:
      OVERDUE_UNIT_CENTS: 10000
      POINTS_PER_UNIT: 10
      UNPAID_INVOICE_POINTS: 20
      SUSPEND_SCORE: 80
    precision: "integer points 0..100; floor on division"
    variants:
      - name: final
        when: "after finalize/void/pay; written to Owner.standing_score"
        difference: "balance = committed Owner.account_balance_cents; counts only FINALIZED unpaid invoices"
      - name: provisional
        when: "read-only projection written to Owner.provisional_standing_score on each owner read"
        difference: "balance = account_balance_cents PLUS the projected amount_due of every OPEN invoice; OPEN invoices also count toward open_unpaid"
    note: "Distinct entity domain (Owner risk) from boarding_charge (Agreement cost) — dual_variant_calc."

  - name: invoice_total
    trigger: "Invoice OPEN->FINALIZED"
    algorithm: tiered_pricing
    formula: |
      # >= 3 inputs, non-linear interaction, and nested rounding whose order is PINNED.
      # Eligible unbilled lines (invoiced == false) for the owner's horses:
      #   COMPLETED Lesson.billed_fee_cents, NO_SHOW Lesson.billed_fee_cents,
      #   COMPLETED ServiceVisit.fee_cents,
      #   CONFIRMED/SCRATCHED ShowEntry.entry_fee_cents,
      #   ENDED BoardingAgreement.final_charge_cents.
      # STEP 1 — per-line rounding then sum (PINNED ORDER: round EACH line FIRST, THEN sum):
      gross_amount_cents = sum over lines of round_half_up(line_value)
      # STEP 2 — tiered multi-horse discount (non-linear; depends on distinct boarding horses):
      n = count of DISTINCT Horse ids contributing an ENDED BoardingAgreement line
      discount_pct = 0.00 if n <= 1
                     0.05 if n == 2
                     0.10 if n >= 3
      multi_horse_discount_cents = round_half_up(gross_amount_cents * discount_pct)
      # STEP 3 — deposit waterfall (after discount, bounded):
      net = gross_amount_cents - multi_horse_discount_cents
      deposit_applied_cents = min(Owner.deposit_held_cents, net)
      amount_due_cents = max(0, net - deposit_applied_cents)
    input_set: "unbilled lines across the owner's horses; distinct ENDED-boarding horse count; Owner.deposit_held_cents"
    constants:
      DISCOUNT_TIER_2_PCT: 0.05
      DISCOUNT_TIER_3_PCT: 0.10
    precision: "round_half_up to whole cents; round EACH line THEN sum (pinned); discount rounded once after summation"
    note: "combinatorial_formula: mode (a) tiered selection + nested min/max AND mode (b) pinned round-then-sum order."

  - name: lesson_fee
    trigger: "Lesson SCHEDULED -> {COMPLETED, NO_SHOW, CANCELLED}"
    algorithm: threshold
    formula: |
      completed: billed_fee_cents = lesson_fee_cents
      no_show:   billed_fee_cents = round_half_up(lesson_fee_cents * NO_SHOW_PCT)
      cancelled: billed_fee_cents = 0
    input_set: "Lesson.lesson_fee_cents; chosen terminal branch"
    constants:
      NO_SHOW_PCT: 0.50
      CANCEL_CUTOFF_HOURS: 24
    precision: "round_half_up to whole cents"
    variants:
      - name: completed
        when: "lesson delivered"
        difference: "full fee"
      - name: no_show
        when: "horse failed to appear"
        difference: "NO_SHOW_PCT of full fee"

  - name: pasture_turnout_capacity
    trigger: "TurnoutAssignment create (POST /turnout-assignments)"
    algorithm: interval_merge
    formula: |
      # Aggregate-capacity overlap (DIFFERENT interval semantics from visit_horse_window's
      # pairwise binary overlap): the constraint counts CONCURRENT bookings, not pairs.
      # A new BOOKED turnout on pasture P over [window_start, window_end) is rejected if,
      # at any instant t in that half-open window, the number of BOOKED turnouts on P whose
      # half-open window contains t — including the new one — would EXCEED Stall.capacity.
      concurrent(t) = count of BOOKED turnouts on P with window_start <= t < window_end
      reject if max over t in [new.window_start, new.window_end)
                 of (concurrent(t) including new) > Stall.capacity
    input_set: "BOOKED TurnoutAssignments on the same pasture; Stall.capacity"
    constants:
      {}
    precision: "integer counts; half-open intervals (touching windows a.end == b.start do NOT overlap)"
    note: "boundary_precision_check turnout_capacity_boundary: reaching exactly capacity is ALLOWED (<=); only > capacity rejected. resource_temporal_overlap turnout_pasture_capacity."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7 (includes per-target_status role gating on transition endpoints)"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "Owner acting on a resource must own it (X-User-ID equals the owner FK resolved through the resource's horse/owner chain)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Owner-scoped writes (own horses, waivers, lessons, requests, withdrawals)"

  - priority: 4
    category: existence
    check: "Path ids resolve left-to-right (ownerId, waiverId, invoiceId, horseId, agreementId, lessonId, visitId, entryId, turnoutId, stallId)"
    error_id: "ERR_OWNER_NOT_FOUND / ERR_WAIVER_NOT_FOUND / ERR_INVOICE_NOT_FOUND / ERR_HORSE_NOT_FOUND / ERR_AGREEMENT_NOT_FOUND / ERR_LESSON_NOT_FOUND / ERR_VISIT_NOT_FOUND / ERR_ENTRY_NOT_FOUND / ERR_TURNOUT_NOT_FOUND / ERR_STALL_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 5
    category: business_referential
    check: "Body FK references resolve (owner_id, horse_id, stall_id, pasture_id) before any state/business check"
    error_id: "ERR_OWNER_NOT_FOUND / ERR_HORSE_NOT_FOUND / ERR_STALL_NOT_FOUND"
    http_status: 404
    applies_to: "POST /horses, /boarding-agreements, /lessons, /service-visits, /show-entries, /turnout-assignments, /invoices"

  - priority: 6
    category: business_constraint
    check: "Field-shape constraints: ends_at > starts_at; window_end > window_start; quantity >= 1; duration_minutes > 0; STALL capacity == 1 / PASTURE capacity >= 1; pasture_id must reference a Stall whose kind == PASTURE; valid enum members"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "create endpoints with temporal/quantity/kind fields"

  - priority: 7
    category: state
    check: "Target resource in a legal state for the requested transition (agreement DRAFT for activate; invoice OPEN for finalize; etc.)"
    error_id: "ERR_INVALID_STATE / ERR_WAIVER_NOT_SIGNABLE / ERR_AGREEMENT_NOT_ACTIVE / ERR_INVOICE_NOT_OPEN / ERR_INVOICE_NOT_FINALIZED"
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 8
    category: business_safety
    check: "Boarding activation, lesson completion and show-entry confirmation require the owner to hold a SIGNED non-expired LiabilityWaiver"
    error_id: ERR_WAIVER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /boarding-agreements/{id}/transition(ACTIVE-from-DRAFT), POST /lessons/{id}/transition(COMPLETED), POST /show-entries/{id}/transition(CONFIRMED)"

  - priority: 9
    category: business_referential
    check: "Lesson completion and turnout booking require the horse's BoardingAgreement to be ACTIVE (not SUSPENDED/ENDED/absent)"
    error_id: ERR_BOARDING_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /lessons/{id}/transition(COMPLETED), POST /turnout-assignments"

  - priority: 10
    category: business_temporal
    check: "Lesson cancellation must occur at least CANCEL_CUTOFF_HOURS before starts_at (inclusive boundary: exactly cutoff allowed)"
    error_id: ERR_CANCEL_TOO_LATE
    http_status: 409
    applies_to: "POST /lessons/{id}/transition(CANCELLED)"

  - priority: 11
    category: business_temporal
    check: "ServiceVisit scheduling rejected when the horse already has an overlapping SCHEDULED/COMPLETED visit window [scheduled_at, scheduled_at+duration) (pairwise overlap)"
    error_id: ERR_VISIT_OVERLAP
    http_status: 409
    applies_to: "POST /service-visits/{id}/transition(SCHEDULED)"

  - priority: 12
    category: business_temporal
    check: "Turnout booking rejected when concurrent BOOKED turnouts on the pasture would exceed Stall.capacity at any instant (half-open windows; aggregate capacity)"
    error_id: ERR_PASTURE_FULL
    http_status: 409
    applies_to: "POST /turnout-assignments"

  - priority: 13
    category: business_constraint
    check: "Stall assignment rejected when Stall.occupied_count >= Stall.capacity at activation"
    error_id: ERR_STALL_FULL
    http_status: 409
    applies_to: "POST /boarding-agreements/{id}/transition(ACTIVE-from-DRAFT)"

  - priority: 14
    category: business_temporal
    check: "Turnout booking rejected when window_start is in the past relative to the current clock (cannot book a turnout that has already started)"
    error_id: ERR_TURNOUT_IN_PAST
    http_status: 409
    applies_to: "POST /turnout-assignments"

  - priority: 15
    category: state
    check: "Reinstating a SUSPENDED agreement requires Owner.standing_score < SUSPEND_SCORE"
    error_id: ERR_OWNER_DELINQUENT
    http_status: 409
    applies_to: "POST /boarding-agreements/{id}/transition(ACTIVE-from-SUSPENDED)"

  - priority: 16
    category: business_referential
    check: "Voiding a FINALIZED invoice is rejected when paid_amount_cents > 0"
    error_id: ERR_INVOICE_HAS_PAYMENTS
    http_status: 409
    applies_to: "POST /invoices/{id}/transition(VOID)"

  - priority: 17
    category: business_constraint
    check: "Finalizing an invoice with zero unbilled lines is rejected"
    error_id: ERR_NO_BILLABLE_LINES
    http_status: 409
    applies_to: "POST /invoices/{id}/transition(FINALIZED)"

  - priority: 18
    category: business_fiscal
    check: "paid_amount_cents + amount_cents must not exceed Invoice.amount_due_cents"
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: "POST /invoices/{id}/transition(PAID)"

  - priority: 19
    category: business_fiscal
    check: "A deposit adjustment must not drive Owner.deposit_held_cents below zero"
    error_id: ERR_INSUFFICIENT_DEPOSIT
    http_status: 422
    applies_to: "POST /owners/{id}/deposit"

  - priority: 20
    category: state
    check: "Optimistic concurrency: expected_owner_version on invoice FINALIZED transition must equal current Owner.version"
    error_id: ERR_STALE_OWNER_VERSION
    http_status: 412
    applies_to: "POST /invoices/{id}/transition(FINALIZED)"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Owner & deposit ----
  - method: POST
    path: "/owners"
    description: "Create an owner account"
    roles: [BarnManager]
    code: 201
    input: [full_name, email]
    output: Owner
    side_effects: ["status=ACTIVE; deposit_held_cents=0; account_balance_cents=0; standing_score=0; provisional_standing_score=0; version=1"]

  - method: GET
    path: "/owners/{id}"
    description: "Get an owner; the read recomputes provisional_standing_score (provisional variant) without persisting committed fields"
    roles: [BarnManager, Owner]
    code: 200
    input: []
    output: Owner
    side_effects: ["recompute provisional_standing_score (calculations.owner_standing_score variant provisional)"]

  - method: POST
    path: "/owners/{id}/deposit"
    description: "Adjust the held security deposit (positive adds, negative refunds); rejects going below zero"
    roles: [BarnManager]
    code: 200
    input: [amount_cents]
    output: Owner
    side_effects: ["Owner.deposit_held_cents += amount_cents (>= 0 enforced); Owner.version += 1"]

  # ---- LiabilityWaiver (sub-resource of Owner) ----
  - method: POST
    path: "/owners/{id}/waivers"
    description: "Create a PENDING waiver for the owner; supersedes any existing SIGNED waiver"
    roles: [BarnManager, Owner]
    code: 201
    input: []
    output: LiabilityWaiver
    side_effects: ["status=PENDING; any prior SIGNED waiver -> SUPERSEDED with superseded_by_id set to the new waiver id"]

  - method: GET
    path: "/owners/{id}/waivers"
    description: "List the owner's waivers (reverse-reachability for LiabilityWaiver.owner_id)"
    roles: [BarnManager, Owner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "LiabilityWaiver[]"
    side_effects: ["each SIGNED waiver whose clock now >= expires_at is lazily transitioned EXPIRED + suspension cascade before the list is returned"]

  - method: POST
    path: "/owners/{id}/waivers/{id}/sign"
    description: "Sign (PENDING->SIGNED) or renew (EXPIRED->SIGNED) the waiver"
    roles: [Owner]
    code: 200
    input: []
    output: LiabilityWaiver
    side_effects: ["signed_at, expires_at set; renewal cascade reinstates eligible suspended agreements"]

  # ---- Stall ----
  - method: POST
    path: "/stalls"
    description: "Create a stall or pasture"
    roles: [BarnManager]
    code: 201
    input: [label, kind, capacity, daily_rate_cents]
    output: Stall
    side_effects: ["occupied_count=0"]

  - method: GET
    path: "/stalls/{id}"
    description: "Get a stall/pasture (reflects reconciled occupied_count)"
    roles: [BarnManager, Owner]
    code: 200
    input: []
    output: Stall
    side_effects: []

  - method: GET
    path: "/stalls/{id}/boarding-agreements"
    description: "List agreements assigned to this stall (reverse-reachability for BoardingAgreement.stall_id)"
    roles: [BarnManager, Owner]
    code: 200
    input: ["limit?", "offset?"]
    output: "BoardingAgreement[]"
    side_effects: []

  - method: GET
    path: "/stalls/{id}/turnouts"
    description: "List turnouts booked on this pasture (reverse-reachability for TurnoutAssignment.pasture_id)"
    roles: [BarnManager, Owner]
    code: 200
    input: ["limit?", "offset?"]
    output: "TurnoutAssignment[]"
    side_effects: []

  # ---- Horse (sub-resources of Owner / Horse) ----
  - method: POST
    path: "/horses"
    description: "Register a horse for an owner"
    roles: [BarnManager, Owner]
    code: 201
    input: [owner_id, name]
    output: Horse
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/owners/{id}/horses"
    description: "List an owner's horses (reverse-reachability for Horse.owner_id)"
    roles: [BarnManager, Owner]
    code: 200
    input: ["limit?", "offset?"]
    output: "Horse[]"
    side_effects: []

  - method: GET
    path: "/horses/{id}"
    description: "Get a horse"
    roles: [BarnManager, Owner]
    code: 200
    input: []
    output: Horse
    side_effects: []

  - method: GET
    path: "/horses/{id}/boarding-agreements"
    description: "List a horse's boarding agreements (reverse-reachability for BoardingAgreement.horse_id; reflects provisional/final charges)"
    roles: [BarnManager, Owner]
    code: 200
    input: ["limit?", "offset?"]
    output: "BoardingAgreement[]"
    side_effects: []

  - method: GET
    path: "/horses/{id}/lessons"
    description: "List a horse's lessons (reverse-reachability for Lesson.horse_id; reflects billed_fee_cents)"
    roles: [BarnManager, Owner, Instructor]
    code: 200
    input: ["limit?", "offset?"]
    output: "Lesson[]"
    side_effects: []

  - method: GET
    path: "/horses/{id}/service-visits"
    description: "List a horse's service visits (reverse-reachability for ServiceVisit.horse_id)"
    roles: [BarnManager, Owner, ServiceProvider]
    code: 200
    input: ["limit?", "offset?"]
    output: "ServiceVisit[]"
    side_effects: []

  - method: GET
    path: "/horses/{id}/show-entries"
    description: "List a horse's show entries (reverse-reachability for ShowEntry.horse_id)"
    roles: [BarnManager, Owner]
    code: 200
    input: ["limit?", "offset?"]
    output: "ShowEntry[]"
    side_effects: []

  - method: GET
    path: "/horses/{id}/turnouts"
    description: "List a horse's turnout assignments (reverse-reachability for TurnoutAssignment.horse_id)"
    roles: [BarnManager, Owner]
    code: 200
    input: ["limit?", "offset?"]
    output: "TurnoutAssignment[]"
    side_effects: []

  # ---- BoardingAgreement ----
  - method: POST
    path: "/boarding-agreements"
    description: "Create a DRAFT boarding agreement linking a horse to a stall/pasture"
    roles: [BarnManager]
    code: 201
    input: [horse_id, stall_id, start_date]
    output: BoardingAgreement
    side_effects: ["status=DRAFT"]

  - method: POST
    path: "/boarding-agreements/{id}/transition"
    description: "Drive the agreement lifecycle: ACTIVE (activate from DRAFT or reinstate from SUSPENDED), SUSPENDED, or ENDED"
    roles: [BarnManager]
    code: 200
    input: [target_status]
    output: BoardingAgreement
    side_effects: ["DRAFT->ACTIVE: stall assigned, occupied_count+=1, provisional charge; ACTIVE->SUSPENDED: future lessons cancelled; SUSPENDED->ACTIVE: reinstated; ->ENDED: final charge, occupied_count-=1, future turnouts cancelled"]

  # ---- Lesson ----
  - method: POST
    path: "/lessons"
    description: "Schedule a lesson"
    roles: [BarnManager, Owner]
    code: 201
    input: [horse_id, instructor_name, lesson_fee_cents, starts_at, ends_at]
    output: Lesson
    side_effects: ["status=SCHEDULED"]

  - method: POST
    path: "/lessons/{id}/transition"
    description: "Resolve a scheduled lesson: COMPLETED (Instructor), NO_SHOW (Instructor), or CANCELLED (BarnManager/Owner/Instructor)"
    roles: [BarnManager, Owner, Instructor]
    code: 200
    input: [target_status]
    output: Lesson
    side_effects: ["sets billed_fee_cents per branch (full / NO_SHOW_PCT / 0)"]

  # ---- ServiceVisit ----
  - method: POST
    path: "/service-visits"
    description: "Request a farrier/vet/dentist visit"
    roles: [BarnManager, Owner]
    code: 201
    input: [horse_id, visit_type, scheduled_at, duration_minutes, fee_cents]
    output: ServiceVisit
    side_effects: ["status=REQUESTED"]

  - method: POST
    path: "/service-visits/{id}/transition"
    description: "Drive a visit: SCHEDULED (BarnManager, overlap-checked), COMPLETED (ServiceProvider), or CANCELLED (BarnManager/Owner)"
    roles: [BarnManager, Owner, ServiceProvider]
    code: 200
    input: [target_status]
    output: ServiceVisit
    side_effects: ["SCHEDULED: horse-window overlap check; COMPLETED: fee invoiceable; CANCELLED: releases window"]

  # ---- ShowEntry ----
  - method: POST
    path: "/show-entries"
    description: "Submit a show/event entry for a horse"
    roles: [BarnManager, Owner]
    code: 201
    input: [horse_id, event_name, event_date, entry_fee_cents]
    output: ShowEntry
    side_effects: ["status=SUBMITTED"]

  - method: POST
    path: "/show-entries/{id}/transition"
    description: "Drive a show entry: CONFIRMED (BarnManager, waiver-checked), WITHDRAWN (Owner), or SCRATCHED (BarnManager)"
    roles: [BarnManager, Owner]
    code: 200
    input: [target_status]
    output: ShowEntry
    side_effects: ["CONFIRMED: fee invoiceable; WITHDRAWN: no fee; SCRATCHED: no-refund fee"]

  # ---- TurnoutAssignment ----
  - method: POST
    path: "/turnout-assignments"
    description: "Book a pasture turnout window for a horse (window_start must be in the future; horse boarding must be ACTIVE; capacity-aware overlap check)"
    roles: [BarnManager, Owner]
    code: 201
    input: [horse_id, pasture_id, window_start, window_end]
    output: TurnoutAssignment
    side_effects: ["status=BOOKED if window_start not in the past, boarding ACTIVE, and pasture capacity not exceeded"]

  - method: POST
    path: "/turnout-assignments/{id}/transition"
    description: "Cancel a booked turnout (frees pasture capacity)"
    roles: [BarnManager, Owner]
    code: 200
    input: [target_status]
    output: TurnoutAssignment
    side_effects: ["BOOKED->CANCELLED"]

  # ---- Invoice (flat) ----
  - method: POST
    path: "/invoices"
    description: "Open a draft invoice for an owner billing period"
    roles: [BarnManager]
    code: 201
    input: [owner_id, period_label]
    output: Invoice
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/owners/{id}/invoices"
    description: "List the owner's invoices (reverse-reachability for Invoice.owner_id; reflects totals)"
    roles: [BarnManager, Owner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Invoice[]"
    side_effects: []

  - method: POST
    path: "/invoices/{id}/transition"
    description: "Drive an invoice lifecycle: FINALIZED (OCC-guarded on Owner.version; pass expected_owner_version), VOID (restore deposit/balance for a FINALIZED invoice), or PAID (record a payment; pass amount_cents)"
    roles: [BarnManager]
    code: 200
    input: [target_status, "expected_owner_version?", "amount_cents?"]
    output: Invoice
    side_effects:
      - "FINALIZED: requires expected_owner_version == Owner.version; totals + deposit_applied computed; Owner.account_balance_cents += amount_due_cents; Owner.deposit_held_cents -= deposit_applied_cents; lines marked invoiced; Owner.version += 1; standing recomputed"
      - "VOID: if was FINALIZED restore deposit, reverse account_balance, un-invoice lines, Owner.version += 1, standing recomputed"
      - "PAID: requires amount_cents; paid_amount_cents += amount_cents; Owner.account_balance_cents -= amount_cents; -> PAID once fully paid; standing recomputed"

  # ---- Test-driving clock endpoint ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the system clock for temporal preconditions (waiver expiry; lesson cancel cutoff)"
    roles: [BarnManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server clock now = to_iso8601; does NOT itself fire lazy waiver expiry (read GET /owners/{id}/waivers to fire it)"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_USER_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing/invalid" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation or this target_status" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Acting Owner is not the owner linked to the resource" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, bad enum, ends<=starts, window_end<=window_start, quantity<1, duration<=0, capacity rule violated, pasture_id not a PASTURE" }
  - { id: ERR_OWNER_NOT_FOUND, http: 404, condition: "Owner id does not resolve" }
  - { id: ERR_WAIVER_NOT_FOUND, http: 404, condition: "LiabilityWaiver id does not resolve" }
  - { id: ERR_STALL_NOT_FOUND, http: 404, condition: "Stall id does not resolve" }
  - { id: ERR_HORSE_NOT_FOUND, http: 404, condition: "Horse id does not resolve" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "BoardingAgreement id does not resolve" }
  - { id: ERR_LESSON_NOT_FOUND, http: 404, condition: "Lesson id does not resolve" }
  - { id: ERR_VISIT_NOT_FOUND, http: 404, condition: "ServiceVisit id does not resolve" }
  - { id: ERR_ENTRY_NOT_FOUND, http: 404, condition: "ShowEntry id does not resolve" }
  - { id: ERR_TURNOUT_NOT_FOUND, http: 404, condition: "TurnoutAssignment id does not resolve" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "Invoice id does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Illegal state transition for the target resource / unknown target_status" }
  - { id: ERR_WAIVER_NOT_SIGNABLE, http: 409, condition: "Sign attempted on a waiver not in PENDING or EXPIRED" }
  - { id: ERR_WAIVER_NOT_ACTIVE, http: 409, condition: "Operation requires a SIGNED non-expired waiver and none exists" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Operation requires the agreement to be ACTIVE" }
  - { id: ERR_BOARDING_NOT_ACTIVE, http: 409, condition: "Horse's boarding agreement is not ACTIVE for lesson completion / turnout" }
  - { id: ERR_INVOICE_NOT_OPEN, http: 409, condition: "Finalize/void-open requires invoice status OPEN" }
  - { id: ERR_INVOICE_NOT_FINALIZED, http: 409, condition: "Pay requires invoice status FINALIZED" }
  - { id: ERR_CANCEL_TOO_LATE, http: 409, condition: "Lesson cancellation later than CANCEL_CUTOFF_HOURS before start" }
  - { id: ERR_VISIT_OVERLAP, http: 409, condition: "Horse already has an overlapping SCHEDULED/COMPLETED visit window" }
  - { id: ERR_PASTURE_FULL, http: 409, condition: "Turnout would exceed pasture capacity at some instant in the window" }
  - { id: ERR_STALL_FULL, http: 409, condition: "Stall occupied_count >= capacity at activation" }
  - { id: ERR_TURNOUT_IN_PAST, http: 409, condition: "Turnout window_start is before the current clock" }
  - { id: ERR_OWNER_DELINQUENT, http: 409, condition: "Reinstate blocked: Owner.standing_score >= SUSPEND_SCORE" }
  - { id: ERR_INVOICE_HAS_PAYMENTS, http: 409, condition: "Void of a FINALIZED invoice with paid_amount_cents > 0" }
  - { id: ERR_NO_BILLABLE_LINES, http: 409, condition: "Finalize with zero unbilled lines" }
  - { id: ERR_OVERPAYMENT, http: 422, condition: "Payment would push paid_amount_cents above amount_due_cents" }
  - { id: ERR_INSUFFICIENT_DEPOSIT, http: 422, condition: "Deposit adjustment would drive deposit_held_cents below zero" }
  - { id: ERR_STALE_OWNER_VERSION, http: 412, condition: "expected_owner_version != Owner.version on finalize (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: BarnManager
    description: "Barn operations + billing authority; manages stalls, agreements lifecycle, invoices, deposits, visit scheduling, show confirmation, and the system clock"
    identity: opaque
    exclusive_operations:
      - "POST /owners — create owner"
      - "POST /stalls — create stall/pasture"
      - "POST /owners/{id}/deposit — adjust deposit"
      - "POST /boarding-agreements (+ /transition) — agreement lifecycle (activate/suspend/reinstate/end)"
      - "POST /service-visits/{id}/transition(SCHEDULED) — schedule a visit (overlap-checked)"
      - "POST /show-entries/{id}/transition(CONFIRMED|SCRATCHED) — confirm/scratch a show entry"
      - "POST /invoices (+ /transition for FINALIZED/VOID/PAID) — billing"
      - "POST /_clock/set_current_utc — set system clock"
    shared_operations:
      - "GET reads across all collections"
      - "POST /horses, /lessons, /service-visits, /show-entries, /turnout-assignments, /owners/{id}/waivers — shared with Owner"
      - "POST /lessons/{id}/transition(CANCELLED) — shared with Owner, Instructor"
      - "POST /service-visits/{id}/transition(CANCELLED), /turnout-assignments/{id}/transition — shared with Owner"

  - name: Owner
    description: "Horse owner; acts on own horses, waivers, lessons, service/show/turnout requests. X-User-ID equals an Owner.id"
    identity: "entity_backed:Owner"
    exclusive_operations:
      - "POST /owners/{id}/waivers/{id}/sign — sign/renew own waiver"
      - "POST /show-entries/{id}/transition(WITHDRAWN) — withdraw own submitted entry"
    shared_operations:
      - "GET reads of own resources"
      - "POST /horses, /lessons, /service-visits, /show-entries, /turnout-assignments, /owners/{id}/waivers"
      - "POST /lessons/{id}/transition(CANCELLED), /service-visits/{id}/transition(CANCELLED), /turnout-assignments/{id}/transition"

  - name: Instructor
    description: "Lesson instructor; completes or no-shows lessons. X-User-ID is an opaque operator id (instructors are not persisted entities)"
    identity: opaque
    exclusive_operations:
      - "POST /lessons/{id}/transition(COMPLETED) — mark lesson completed"
      - "POST /lessons/{id}/transition(NO_SHOW) — mark lesson no-show"
    shared_operations:
      - "GET /horses/{id}/lessons reads"
      - "POST /lessons/{id}/transition(CANCELLED) — shared with BarnManager, Owner"

  - name: ServiceProvider
    description: "Farrier/vet/dentist; records visit completion. X-User-ID is an opaque operator id"
    identity: opaque
    exclusive_operations:
      - "POST /service-visits/{id}/transition(COMPLETED) — complete a scheduled visit"
    shared_operations:
      - "GET /horses/{id}/service-visits reads"
