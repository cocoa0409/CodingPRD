              payload: { season_id: "${s_id}", grower_id: "${g_id}", variety: "LONG_GRAIN", source: "SPOT", gross_weight_lbs: 41000, tare_weight_lbs: 12000, scheduled_date: "2026-08-10", moisture_pct_handheld: 15.0, spot_price_cents_per_cwt: 1300 }
              as: ScaleOperator
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_SEASON_INTAKE_NOT_OPEN (state priority 6 beats capacity priority 11 even though the spot cap is also exhausted)"

