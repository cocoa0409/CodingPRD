  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: ce_session_requires_enrollment_active
        grounds:
          - validations[priority=7]
          - state_machines.Enrollment.PENDING_to_ACTIVE
          - entities.Enrollment.fields.status
        distinguishing_aspect: "Entity pair Session->Enrollment: scheduling a Session is rejected ERR_ENROLLMENT_NOT_ACTIVE while the Enrollment is still PENDING (never activated)."
        test_recipe:
          setup:
            - "Enrollment created but NOT activated (PENDING); version 1 captured for OCC"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /dsmes/programs", payload: { name: "CEA DSMES", accreditation_body: "ADA" }, as: ProgramCoordinator, captures: { cea_prog: "$.data.id" } }
            - { call: "POST /dsmes/curricula", payload: { name: "T2 CEA", diabetes_type_focus: "TYPE_2", required_hours: 10.0, module_count: 8 }, as: ProgramCoordinator, captures: { cea_cur: "$.data.id" } }
            - { call: "POST /dsmes/patients", payload: { mrn: "CEA-001", full_name: "Cy A", date_of_birth: "1962-02-02", diabetes_type: "TYPE_2", payer: "MEDICARE", baseline_a1c: 8.6 }, as: ProgramCoordinator, captures: { cea_pat: "$.data.id" } }
            - { call: "POST /dsmes/dietitians", payload: { full_name: "RD CEA", npi: "1000000014", credential: "RD" }, as: ProgramCoordinator, captures: { cea_die: "$.data.id" } }
            - { call: "POST /dsmes/referrals", payload: { program_id: "${cea_prog}", patient_id: "${cea_pat}", referring_provider_npi: "2000000014", referral_reason: "POOR_CONTROL" }, as: ProgramCoordinator, captures: { cea_ref: "$.data.id" } }
            - { call: "POST /dsmes/referrals/${cea_ref}/assess", payload: { assessed_a1c: 8.6 }, as: Dietitian, as_user_id: "${cea_die}" }
            - { call: "POST /dsmes/enrollments", payload: { referral_id: "${cea_ref}", curriculum_id: "${cea_cur}" }, as: ProgramCoordinator, captures: { cea_enr: "$.data.id", cea_v1: "$.data.version" } }
          trigger:
            - { call: "POST /dsmes/sessions", payload: { enrollment_id: "${cea_enr}", dietitian_id: "${cea_die}", modality: "INDIVIDUAL", scheduled_start: "2026-05-19T09:00:00Z", scheduled_end: "2026-05-19T10:00:00Z", expected_enrollment_version: "${cea_v1}" }, as: Dietitian, as_user_id: "${cea_die}", captures: { cea_err: "$.data.error_id" } }
          assert:
            - "trigger response.data.error_id == ERR_ENROLLMENT_NOT_ACTIVE"

      - name: ce_enrollment_requires_referral_assessed
        grounds:
          - validations[priority=9]
          - state_machines.Referral.RECEIVED_to_ASSESSED
          - entities.Referral.fields.status
        distinguishing_aspect: "Entity pair Enrollment->Referral: creating an Enrollment is rejected ERR_REFERRAL_NOT_ASSESSED while the Referral is still RECEIVED (assessment not performed)."
        test_recipe:
          setup:
            - "Referral in RECEIVED (never assessed)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /dsmes/programs", payload: { name: "CEB DSMES", accreditation_body: "ADA" }, as: ProgramCoordinator, captures: { ceb_prog: "$.data.id" } }
            - { call: "POST /dsmes/curricula", payload: { name: "T2 CEB", diabetes_type_focus: "TYPE_2", required_hours: 10.0, module_count: 8 }, as: ProgramCoordinator, captures: { ceb_cur: "$.data.id" } }
            - { call: "POST /dsmes/patients", payload: { mrn: "CEB-001", full_name: "Cy B", date_of_birth: "1961-01-01", diabetes_type: "TYPE_2", payer: "MEDICARE", baseline_a1c: 8.7 }, as: ProgramCoordinator, captures: { ceb_pat: "$.data.id" } }
            - { call: "POST /dsmes/referrals", payload: { program_id: "${ceb_prog}", patient_id: "${ceb_pat}", referring_provider_npi: "2000000015", referral_reason: "POOR_CONTROL" }, as: ProgramCoordinator, captures: { ceb_ref: "$.data.id" } }
          trigger:
            - { call: "POST /dsmes/enrollments", payload: { referral_id: "${ceb_ref}", curriculum_id: "${ceb_cur}" }, as: ProgramCoordinator, captures: { ceb_err: "$.data.error_id" } }
          assert:
            - "trigger response.data.error_id == ERR_REFERRAL_NOT_ASSESSED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: rt_dietitian_double_book_half_open
        grounds:
          - validations[priority=12]
          - entities.Session.fields.scheduled_start
          - entities.Session.fields.dietitian_id
        distinguishing_aspect: "Dietitian resource, half-open [start,end) semantics with NO buffer: a second individual session 09:30-10:30 overlapping an existing 09:00-10:00 booking for the same dietitian is rejected ERR_DIETITIAN_DOUBLE_BOOKED."
        test_recipe:
          setup:
            - "ACTIVE enrollment; existing INDIVIDUAL session for dietitian at 2026-05-12T09:00-10:00"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /dsmes/programs", payload: { name: "RTA DSMES", accreditation_body: "ADA" }, as: ProgramCoordinator, captures: { rta_prog: "$.data.id" } }
            - { call: "POST /dsmes/curricula", payload: { name: "T2 RTA", diabetes_type_focus: "TYPE_2", required_hours: 10.0, module_count: 8 }, as: ProgramCoordinator, captures: { rta_cur: "$.data.id" } }
            - { call: "POST /dsmes/patients", payload: { mrn: "RTA-001", full_name: "Ray A", date_of_birth: "1960-06-06", diabetes_type: "TYPE_2", payer: "MEDICARE", baseline_a1c: 8.8 }, as: ProgramCoordinator, captures: { rta_pat: "$.data.id" } }
            - { call: "POST /dsmes/dietitians", payload: { full_name: "RD RTA", npi: "1000000016", credential: "RD" }, as: ProgramCoordinator, captures: { rta_die: "$.data.id" } }
            - { call: "POST /dsmes/referrals", payload: { program_id: "${rta_prog}", patient_id: "${rta_pat}", referring_provider_npi: "2000000016", referral_reason: "POOR_CONTROL" }, as: ProgramCoordinator, captures: { rta_ref: "$.data.id" } }
            - { call: "POST /dsmes/referrals/${rta_ref}/assess", payload: { assessed_a1c: 8.8 }, as: Dietitian, as_user_id: "${rta_die}" }
            - { call: "POST /dsmes/enrollments", payload: { referral_id: "${rta_ref}", curriculum_id: "${rta_cur}" }, as: ProgramCoordinator, captures: { rta_enr: "$.data.id" } }
            - { call: "POST /dsmes/enrollments/${rta_enr}/activate", payload: {}, as: ProgramCoordinator, captures: { rta_v2: "$.data.version" } }
            - { call: "POST /dsmes/sessions", payload: { enrollment_id: "${rta_enr}", dietitian_id: "${rta_die}", modality: "INDIVIDUAL", scheduled_start: "2026-05-12T09:00:00Z", scheduled_end: "2026-05-12T10:00:00Z", expected_enrollment_version: "${rta_v2}" }, as: Dietitian, as_user_id: "${rta_die}", captures: { rta_s1: "$.data.id" } }
            - { call: "GET /dsmes/enrollments/${rta_enr}", payload: {}, as: ProgramCoordinator, captures: { rta_v3: "$.data.version" } }
          trigger:
            - { call: "POST /dsmes/sessions", payload: { enrollment_id: "${rta_enr}", dietitian_id: "${rta_die}", modality: "INDIVIDUAL", scheduled_start: "2026-05-12T09:30:00Z", scheduled_end: "2026-05-12T10:30:00Z", expected_enrollment_version: "${rta_v3}" }, as: Dietitian, as_user_id: "${rta_die}", captures: { rta_err: "$.data.error_id" } }
          assert:
            - "trigger response.data.error_id == ERR_DIETITIAN_DOUBLE_BOOKED"

      - name: rt_group_room_buffer_conflict
        grounds:
          - validations[priority=15]
          - entities.GroupClass.fields.room_id
          - entities.GroupClass.fields.scheduled_start
        distinguishing_aspect: "Room resource, closed interval + 15-min buffer: a second class in ROOM-1 starting 14:10 only 10 minutes after a 13:00-14:00 class ends is rejected ERR_ROOM_CONFLICT — different interval semantics (buffered, adjacency rejected) than the dietitian half-open rule."
        test_recipe:
          setup:
            - "Existing GroupClass in ROOM-1 at 2026-05-14T13:00-14:00"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /dsmes/programs", payload: { name: "RTB DSMES", accreditation_body: "ADA" }, as: ProgramCoordinator, captures: { rtb_prog: "$.data.id" } }
            - { call: "POST /dsmes/curricula", payload: { name: "T2 RTB", diabetes_type_focus: "TYPE_2", required_hours: 10.0, module_count: 8 }, as: ProgramCoordinator, captures: { rtb_cur: "$.data.id" } }
            - { call: "POST /dsmes/dietitians", payload: { full_name: "RD RTB", npi: "1000000017", credential: "RD" }, as: ProgramCoordinator, captures: { rtb_die: "$.data.id" } }
            - { call: "POST /dsmes/group-classes", payload: { curriculum_id: "${rtb_cur}", dietitian_id: "${rtb_die}", room_id: "ROOM-1", scheduled_start: "2026-05-14T13:00:00Z", scheduled_end: "2026-05-14T14:00:00Z", capacity: 10, topic: "Carb Counting" }, as: ProgramCoordinator, captures: { rtb_gc1: "$.data.id" } }
          trigger:
            - { call: "POST /dsmes/group-classes", payload: { curriculum_id: "${rtb_cur}", dietitian_id: "${rtb_die}", room_id: "ROOM-1", scheduled_start: "2026-05-14T14:10:00Z", scheduled_end: "2026-05-14T15:00:00Z", capacity: 10, topic: "Foot Care" }, as: ProgramCoordinator, captures: { rtb_err: "$.data.error_id" } }
          assert:
            - "trigger response.data.error_id == ERR_ROOM_CONFLICT"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: ci_benefit_hours_conserved_on_cancel
        grounds:
          - state_machines.Session.SCHEDULED_to_CANCELLED
          - calculations.enrollment_hours_dual
          - entities.Enrollment.fields.provisional_hours_used
        distinguishing_aspect: "Conserved quantity = provisional benefit hours: scheduling a 60-min session debits 1.0h (provisional_hours_used 1.0); cancelling it credits exactly 1.0h back, restoring provisional_hours_used to 0.0 and hours_remaining to 10.0."
        test_recipe:
          setup:
            - "ACTIVE enrollment; one 60-min SCHEDULED session (provisional_hours_used 1.0)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /dsmes/programs", payload: { name: "CIA DSMES", accreditation_body: "ADA" }, as: ProgramCoordinator, captures: { cia_prog: "$.data.id" } }
            - { call: "POST /dsmes/curricula", payload: { name: "T2 CIA", diabetes_type_focus: "TYPE_2", required_hours: 10.0, module_count: 8 }, as: ProgramCoordinator, captures: { cia_cur: "$.data.id" } }
            - { call: "POST /dsmes/patients", payload: { mrn: "CIA-001", full_name: "Cid A", date_of_birth: "1959-05-05", diabetes_type: "TYPE_2", payer: "MEDICARE", baseline_a1c: 8.9 }, as: ProgramCoordinator, captures: { cia_pat: "$.data.id" } }
            - { call: "POST /dsmes/dietitians", payload: { full_name: "RD CIA", npi: "1000000018", credential: "RD" }, as: ProgramCoordinator, captures: { cia_die: "$.data.id" } }
            - { call: "POST /dsmes/referrals", payload: { program_id: "${cia_prog}", patient_id: "${cia_pat}", referring_provider_npi: "2000000017", referral_reason: "POOR_CONTROL" }, as: ProgramCoordinator, captures: { cia_ref: "$.data.id" } }
            - { call: "POST /dsmes/referrals/${cia_ref}/assess", payload: { assessed_a1c: 8.9 }, as: Dietitian, as_user_id: "${cia_die}" }
            - { call: "POST /dsmes/enrollments", payload: { referral_id: "${cia_ref}", curriculum_id: "${cia_cur}" }, as: ProgramCoordinator, captures: { cia_enr: "$.data.id" } }
            - { call: "POST /dsmes/enrollments/${cia_enr}/activate", payload: {}, as: ProgramCoordinator, captures: { cia_v2: "$.data.version" } }
            - { call: "POST /dsmes/sessions", payload: { enrollment_id: "${cia_enr}", dietitian_id: "${cia_die}", modality: "INDIVIDUAL", scheduled_start: "2026-05-21T09:00:00Z", scheduled_end: "2026-05-21T10:00:00Z", expected_enrollment_version: "${cia_v2}" }, as: Dietitian, as_user_id: "${cia_die}", captures: { cia_sess: "$.data.id" } }
          trigger:
            - { call: "POST /dsmes/sessions/${cia_sess}/cancel", payload: { cancel_reason: "patient reschedule" }, as: Dietitian, as_user_id: "${cia_die}" }
          assert:
            - "Enrollment.${cia_enr}.provisional_hours_used == 0.0"
            - "Enrollment.${cia_enr}.hours_remaining == 10.0"

      - name: ci_group_seats_conserved_on_cancel
        grounds:
          - state_machines.Session.SCHEDULED_to_CANCELLED
          - calculations.group_seats
          - entities.GroupClass.fields.seats_taken
        distinguishing_aspect: "Conserved quantity = group seats: reserving a seat raises GroupClass.seats_taken to 1; cancelling that group session releases exactly one seat, restoring seats_taken to 0 (a different conserved quantity than benefit hours)."
        test_recipe:
          setup:
            - "GroupClass capacity 3; ACTIVE enrollment with one reserved group seat (seats_taken 1)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /dsmes/programs", payload: { name: "CIB DSMES", accreditation_body: "ADA" }, as: ProgramCoordinator, captures: { cib_prog: "$.data.id" } }
            - { call: "POST /dsmes/curricula", payload: { name: "T2 CIB", diabetes_type_focus: "TYPE_2", required_hours: 10.0, module_count: 8 }, as: ProgramCoordinator, captures: { cib_cur: "$.data.id" } }
            - { call: "POST /dsmes/patients", payload: { mrn: "CIB-001", full_name: "Cid B", date_of_birth: "1958-08-08", diabetes_type: "TYPE_2", payer: "MEDICARE", baseline_a1c: 9.1 }, as: ProgramCoordinator, captures: { cib_pat: "$.data.id" } }
            - { call: "POST /dsmes/dietitians", payload: { full_name: "RD CIB", npi: "1000000019", credential: "RD" }, as: ProgramCoordinator, captures: { cib_die: "$.data.id" } }
            - { call: "POST /dsmes/referrals", payload: { program_id: "${cib_prog}", patient_id: "${cib_pat}", referring_provider_npi: "2000000018", referral_reason: "POOR_CONTROL" }, as: ProgramCoordinator, captures: { cib_ref: "$.data.id" } }
