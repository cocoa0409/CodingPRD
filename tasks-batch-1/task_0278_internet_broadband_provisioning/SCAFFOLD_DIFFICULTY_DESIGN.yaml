              as: ProvisioningAgent
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ACCOUNT_NOT_ACTIVE (409)"
            - "TransferRequest.status remains APPROVED; Account.status remains SUSPENDED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: install_slot_aggregate_capacity_overlap
        grounds:
          - validations[priority=10]
          - entities.InstallSlot.fields.capacity
          - entities.InstallSlot.fields.booked_count
        distinguishing_aspect: |
          InstallSlot uses AGGREGATE-CAPACITY interval semantics: up to `capacity`
          appointments may share the same half-open window; the (capacity+1)-th is
          rejected ERR_SLOT_AT_CAPACITY regardless of exact times — count-based, not
          pairwise-interval.
        test_recipe:
          setup:
            - "Slot capacity 1, already holding one BOOKED appointment; a second order wants the same slot."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkOps
            - call: "POST /service-addresses"
              payload: { line1: "15 Fiber Ln", postal_code: "00015", coverage_status: "SERVICEABLE", technology: "FIBER", max_serviceable_mbps: 1000, self_install_eligible: false }
              as: ProvisioningAgent
              captures: { addr_id: $.data.id }
            - call: "POST /service-plans"
              payload: { code: "CAP500", tier: "PLUS", download_mbps: 500, throttled_mbps: 50, monthly_fee_cents: 8999, included_gb: 1000, overage_policy: "BILL", contract_term_months: 0, etf_full_cents: 0 }
              as: ProvisioningAgent
              captures: { plan_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Pat", travel_buffer_minutes: 30 }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /install-slots"
              payload: { technician_id: "${tech_id}", window_start_iso: "2026-06-02T09:00:00Z", window_end_iso: "2026-06-02T17:00:00Z", capacity: 1 }
              as: Dispatcher
              captures: { slot_id: $.data.id }
            - call: "POST /accounts"
              payload: { service_address_id: "${addr_id}", plan_id: "${plan_id}", customer_user_id: "cust-c1" }
              as: ProvisioningAgent
              captures: { acct1: $.data.id, acct1_v: $.data.version }
            - call: "POST /service-orders"
              payload: { account_id: "${acct1}", order_type: "NEW_INSTALL", install_mode: "TECH_INSTALL", requested_plan_id: "${plan_id}" }
              as: ProvisioningAgent
              captures: { order1: $.data.id }
            - call: "POST /install-appointments"
              payload: { service_order_id: "${order1}", install_slot_id: "${slot_id}", start_iso: "2026-06-02T09:00:00Z", end_iso: "2026-06-02T10:00:00Z", expected_account_version: "${acct1_v}" }
              as: ProvisioningAgent
            - call: "POST /accounts"
              payload: { service_address_id: "${addr_id}", plan_id: "${plan_id}", customer_user_id: "cust-c2" }
              as: ProvisioningAgent
              captures: { acct2: $.data.id, acct2_v: $.data.version }
            - call: "POST /service-orders"
              payload: { account_id: "${acct2}", order_type: "NEW_INSTALL", install_mode: "TECH_INSTALL", requested_plan_id: "${plan_id}" }
              as: ProvisioningAgent
              captures: { order2: $.data.id }
          trigger:
            - call: "POST /install-appointments"
              payload: { service_order_id: "${order2}", install_slot_id: "${slot_id}", start_iso: "2026-06-02T13:00:00Z", end_iso: "2026-06-02T14:00:00Z", expected_account_version: "${acct2_v}" }
              as: ProvisioningAgent
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SLOT_AT_CAPACITY (409) — second appointment at a non-overlapping time still rejected because the slot count is full"
            - "InstallSlot.booked_count == 1 (unchanged)"

      - name: technician_travel_buffer_interval_overlap
        grounds:
          - validations[priority=11]
          - entities.Technician.fields.travel_buffer_minutes
        distinguishing_aspect: |
          Technician uses BUFFERED-INTERVAL semantics: appointment [start, end+buffer)
          must not intersect another appointment; a second appointment starting 15 min
          after the first's end+buffer-30 window collides (ERR_TECHNICIAN_DOUBLE_BOOKED)
          — pairwise interval arithmetic with a buffer, on a different resource entity
          (Technician) than the count-based slot capacity above.
        test_recipe:
          setup:
            - "One technician with buffer 30; two OPEN slots in the same window for that technician."
            - "First appointment 09:00-10:00 booked (blocks until 10:30). Second wants 10:15-11:00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkOps
            - call: "POST /service-addresses"
              payload: { line1: "16 Fiber Ln", postal_code: "00016", coverage_status: "SERVICEABLE", technology: "FIBER", max_serviceable_mbps: 1000, self_install_eligible: false }
              as: ProvisioningAgent
              captures: { addr_id: $.data.id }
            - call: "POST /service-plans"
              payload: { code: "BUF500", tier: "PLUS", download_mbps: 500, throttled_mbps: 50, monthly_fee_cents: 8999, included_gb: 1000, overage_policy: "BILL", contract_term_months: 0, etf_full_cents: 0 }
              as: ProvisioningAgent
              captures: { plan_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Sol", travel_buffer_minutes: 30 }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /install-slots"
              payload: { technician_id: "${tech_id}", window_start_iso: "2026-06-02T09:00:00Z", window_end_iso: "2026-06-02T17:00:00Z", capacity: 5 }
              as: Dispatcher
              captures: { slot_id: $.data.id }
            - call: "POST /accounts"
              payload: { service_address_id: "${addr_id}", plan_id: "${plan_id}", customer_user_id: "cust-b1" }
              as: ProvisioningAgent
              captures: { acct1: $.data.id, acct1_v: $.data.version }
            - call: "POST /service-orders"
              payload: { account_id: "${acct1}", order_type: "NEW_INSTALL", install_mode: "TECH_INSTALL", requested_plan_id: "${plan_id}" }
              as: ProvisioningAgent
              captures: { order1: $.data.id }
            - call: "POST /install-appointments"
              payload: { service_order_id: "${order1}", install_slot_id: "${slot_id}", start_iso: "2026-06-02T09:00:00Z", end_iso: "2026-06-02T10:00:00Z", expected_account_version: "${acct1_v}" }
              as: ProvisioningAgent
            - call: "POST /accounts"
              payload: { service_address_id: "${addr_id}", plan_id: "${plan_id}", customer_user_id: "cust-b2" }
              as: ProvisioningAgent
              captures: { acct2: $.data.id, acct2_v: $.data.version }
            - call: "POST /service-orders"
              payload: { account_id: "${acct2}", order_type: "NEW_INSTALL", install_mode: "TECH_INSTALL", requested_plan_id: "${plan_id}" }
              as: ProvisioningAgent
              captures: { order2: $.data.id }
          trigger:
            - call: "POST /install-appointments"
              payload: { service_order_id: "${order2}", install_slot_id: "${slot_id}", start_iso: "2026-06-02T10:15:00Z", end_iso: "2026-06-02T11:00:00Z", expected_account_version: "${acct2_v}" }
              as: ProvisioningAgent
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_TECHNICIAN_DOUBLE_BOOKED (409) — 10:15 falls inside the 09:00-10:30 buffered block"
            - "a retry at start 2026-06-02T10:30:00Z end 11:30:00Z would succeed (10:30 == buffer end, half-open)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: etf_conserved_under_transfer_waiver
        grounds:
          - calculations.early_termination_fee
          - state_machines.Account.ACTIVE_to_TRANSFERRED
          - entities.AccountCredit.fields.source_type
        distinguishing_aspect: |
          Conserved quantity = net ETF burden. Forward action (would-be ETF charge
          15000) paired with its compensating TRANSFER_WAIVER credit (15000) leaves
          net_etf == charged_etf - waiver_credit == 0 on a transfer; the invariant is
          the ETF money quantity.
        test_recipe:
          setup:
            - "ACTIVE 24-month account (etf_full 24000), contract_start 2026-06-01; clock 2027-03-01 (would-be ETF 15000)."
            - "An APPROVED transfer with waive_etf=true on that account."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkOps
            - call: "POST /service-addresses"
              payload: { line1: "17 Fiber Ln", postal_code: "00017", coverage_status: "SERVICEABLE", technology: "FIBER", max_serviceable_mbps: 1000, self_install_eligible: true }
              as: ProvisioningAgent
              captures: { addr_id: $.data.id }
            - call: "POST /service-plans"
              payload: { code: "WV24", tier: "PLUS", download_mbps: 500, throttled_mbps: 50, monthly_fee_cents: 8999, included_gb: 1000, overage_policy: "BILL", contract_term_months: 24, etf_full_cents: 24000 }
              as: ProvisioningAgent
              captures: { plan_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { kind: "MODEM", serial: "SN-WV-1", lease_fee_cents_per_cycle: 1500 }
              as: ProvisioningAgent
              captures: { unit_id: $.data.id }
            - call: "POST /accounts"
              payload: { service_address_id: "${addr_id}", plan_id: "${plan_id}", customer_user_id: "cust-wv" }
              as: ProvisioningAgent
              captures: { acct_id: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", order_type: "NEW_INSTALL", install_mode: "SELF_INSTALL", requested_plan_id: "${plan_id}" }
              as: ProvisioningAgent
              captures: { order_id: $.data.id }
            - call: "POST /service-orders/${order_id}/ship-kit"
              payload: {}
              as: ProvisioningAgent
            - call: "POST /service-orders/${order_id}/activate"
              payload: {}
              as: ProvisioningAgent
            - call: "POST /transfer-requests"
              payload: { account_id: "${acct_id}", to_service_address_id: "${addr_id}", to_plan_id: "${plan_id}", waive_etf: true }
              as: ProvisioningAgent
              captures: { xfer_id: $.data.id }
            - call: "POST /transfer-requests/${xfer_id}/approve"
              payload: {}
              as: ProvisioningAgent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: NetworkOps
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ProvisioningAgent
              captures: { acct_v: $.data.version }
          trigger:
            - call: "POST /transfer-requests/${xfer_id}/complete"
              payload: { expected_account_version: "${acct_v}" }
              as: ProvisioningAgent
            - call: "GET /account-credits"
              payload: { account_id: "${acct_id}" }
              as: ProvisioningAgent
          assert:
            - "an AccountCredit with source_type == TRANSFER_WAIVER and amount_cents == 15000 exists"
            - "the finalized BillingCycle carries NO ETF charge; net_etf = 0 (charged 0, waiver credit 15000 offsets the would-be 15000)"

      - name: lease_fee_conserved_under_lost_reversal
        grounds:
          - calculations.lease_proration_credit
          - state_machines.EquipmentUnit.RETURN_PENDING_to_LOST
          - entities.AccountCredit.fields.source_type
        distinguishing_aspect: |
          Conserved quantity = lease-fee refund. A LEASE_PRORATE credit (1000) emitted
          on RETURN_PENDING is reversed when the unit is marked LOST, leaving the
          account's net LEASE_PRORATE credit at 0 — a different conserved quantity
          (lease fee) than the ETF invariant above.
        test_recipe:
          setup:
            - "ACTIVE account disconnected at day 10 (30-day cycle) -> LEASE_PRORATE credit 1000 emitted, unit RETURN_PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkOps
            - call: "POST /service-addresses"
              payload: { line1: "18 Fiber Ln", postal_code: "00018", coverage_status: "SERVICEABLE", technology: "FIBER", max_serviceable_mbps: 1000, self_install_eligible: true }
              as: ProvisioningAgent
              captures: { addr_id: $.data.id }
            - call: "POST /service-plans"
              payload: { code: "LST500", tier: "PLUS", download_mbps: 500, throttled_mbps: 50, monthly_fee_cents: 8999, included_gb: 1000, overage_policy: "BILL", contract_term_months: 0, etf_full_cents: 0 }
              as: ProvisioningAgent
              captures: { plan_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { kind: "MODEM", serial: "SN-LST-1", lease_fee_cents_per_cycle: 1500 }
              as: ProvisioningAgent
              captures: { unit_id: $.data.id }
            - call: "POST /accounts"
              payload: { service_address_id: "${addr_id}", plan_id: "${plan_id}", customer_user_id: "cust-lst" }
              as: ProvisioningAgent
              captures: { acct_id: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", order_type: "NEW_INSTALL", install_mode: "SELF_INSTALL", requested_plan_id: "${plan_id}" }
              as: ProvisioningAgent
              captures: { order_id: $.data.id }
            - call: "POST /service-orders/${order_id}/ship-kit"
              payload: {}
              as: ProvisioningAgent
            - call: "POST /service-orders/${order_id}/activate"
              payload: {}
              as: ProvisioningAgent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T00:00:00Z" }
              as: NetworkOps
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ProvisioningAgent
              captures: { acct_v: $.data.version }
            - call: "POST /accounts/${acct_id}/disconnect"
              payload: { expected_account_version: "${acct_v}" }
              as: ProvisioningAgent
          trigger:
            - call: "POST /equipment-units/${unit_id}/mark-lost"
              payload: {}
              as: ProvisioningAgent
            - call: "GET /account-credits"
              payload: { account_id: "${acct_id}" }
              as: ProvisioningAgent
          assert:
            - "before mark-lost: a LEASE_PRORATE AccountCredit with amount_cents == 1000 exists"
            - "after mark-lost: net LEASE_PRORATE credit for the account == 0 (the 1000 credit is reversed)"
            - "EquipmentUnit.status == LOST"
