        distinguishing_aspect: "An absent X-User-Role header fails the auth category before the authorization category, so the envelope is 401 ERR_UNAUTHENTICATED rather than 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup:
            - "Logical clock at the street date; one store exists."
          setup_api_calls:
