      - name: review_of_a_draft_filing_rejected
        claim_type: invalid_transitions
        grounds:
          - validations[priority=9]
          - errors[ERR_INVALID_REGISTRATION_STATE]
          - state_machines.StateRegistration.transitions.SUBMITTED_to_REGISTERED
        distinguishing_aspect: "review is declared only out of SUBMITTED, so an APPROVE decision on a DRAFT filing is a 409 ERR_INVALID_REGISTRATION_STATE from a correctly authorized regulator — the filing is not promoted straight to REGISTERED."
