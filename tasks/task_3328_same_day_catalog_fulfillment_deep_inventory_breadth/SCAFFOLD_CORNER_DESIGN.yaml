            - "CatalogOrder.${order_id}.version == ${order_v}, so the rejected second release did not advance the order"

      - name: cancelled_order_cannot_be_allocated
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.CatalogOrder
          - errors.ERR_INVALID_STATE
          - entities.CatalogOrder.fields.order_status
        distinguishing_aspect: "CANCELLED is a terminal state of the order axis, so every trigger that would move the order out of it is refused — attempting the allocation of a cancelled order answers 409 ERR_INVALID_STATE even though fulfillment_status is AWAITING_RELEASE and the version supplied is current."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T08:00:00Z. One account, one curated item with BOS stock, one order created, released and cancelled."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /distribution-centers"
              payload: { code: "BOS", region: "NORTHEAST", local_zone: "America/New_York", local_cutoff_time: "06:00:00", utc_offset_minutes: -240, inbound_capacity_units: 900, transit_seconds: 86400 }
              as: PlatformAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /accounts"
