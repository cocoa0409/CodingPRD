          trigger:
            - call: "POST /cca/remittance-files/${rem_may}/dispute"
              payload: {}
              as: UtilityLiaison
              captures: { applied_after: $.data.applied_cents, st: $.data.status }
            - call: "GET /cca/service-accounts/${acct_h1}"
              payload: {}
              as: CustomerService
              captures: { rem_h1: $.data.cumulative_remitted_cents }
            - call: "GET /cca/service-accounts/${acct_h2}"
              payload: {}
              as: CustomerService
              captures: { rem_h2: $.data.cumulative_remitted_cents }
          assert:
            - "After reconcile both accounts held cumulative_remitted_cents == 11400 (sum 22800 == net_remittance_cents)"
            - "After dispute: status == DISPUTED, applied_cents == 0"
            - "acct_h1.cumulative_remitted_cents == 0 and acct_h2.cumulative_remitted_cents == 0 — the compensating action restores the pre-reconcile invariant exactly"
            - "acct_h1.cumulative_billed_cents == 11400 unchanged (dispute reverses remittance credits, not billed ledger)"
      - name: contract_terminate_reserve_clamp_conserves_reserve_floor
        grounds:
          - calculations.contract_termination_fee
          - state_machines.SupplyContract.EXECUTED_to_TERMINATED
          - entities.Authority.fields.climate_reserve_balance_cents
        distinguishing_aspect: |
          Conserved quantity: Authority.climate_reserve_balance_cents >= 0 floor under
          the forward action (terminate) and its conceptual compensation (the clamp).
          Different conserved quantity than account remittance cents: reserve invariant
          is balance_new == max(0, balance_old - fee) with the deficit expelled to
