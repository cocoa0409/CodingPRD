          assert:
            - "the ProductSpecification is at version 1 when it is created and at version 2 after the first DesignControlRecord is filed, so a child write bumps the parent's version"
            - "re-filing with the version observed BEFORE that child returns HTTP 412 with error_id ERR_STALE_PRODUCT_SPEC_VERSION, and the specification is still at version 2 afterwards — the rejected write neither persisted a record nor bumped the version"
            - "the identical body re-sent with the refreshed version 2 succeeds with HTTP 201, and the design-record list then holds exactly two rows with total_count 2"
            - "the ReagentLot is at version 1 at creation and version 2 after the antibody component is dispensed"
