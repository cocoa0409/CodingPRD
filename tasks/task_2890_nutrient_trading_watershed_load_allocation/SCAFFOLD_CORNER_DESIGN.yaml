            - "data.margin_of_safety_lbs_yr == 0.00, data.allocable_load_lbs_yr == 0.00, data.wla_total_lbs_yr == 0.00, data.la_total_lbs_yr == 0.00, data.reserve_allocation_lbs_yr == 0.00"
            - "data.effective_background_lbs_yr is null and data.allocation_variant is null"
            - "GET /watersheds/${w_id} returns data.program_status == \"PROVISIONAL\" (creating a DRAFT assessment does not activate the program)"

      - name: withdrawn_tmdl_assessment_rejects_any_further_status_change
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.TmdlAssessment.terminal_states
          - state_machines.TmdlAssessment.DRAFT_to_WITHDRAWN
