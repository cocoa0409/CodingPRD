scaffold_corner_design:

  - section: entities
    instances:

      # ---------- Not Found: one per entity, all 22 ----------
      - name: brokerage_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_BROKERAGE_NOT_FOUND]", "endpoints.GET./staging/brokerages/{brokerage_id}"]
        distinguishing_aspect: "A GET on an unknown Brokerage id returns ERR_BROKERAGE_NOT_FOUND with HTTP 404 and no data payload."
        test_recipe:
          setup: ["Empty database with the logical clock at its 2026-05-01T00:00:00Z default."]
          setup_api_calls: &clk
            - call: "POST /staging/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /staging/brokerages/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 404"
            - "response.data.error_id == ERR_BROKERAGE_NOT_FOUND"
            - "response.response_type == error"

