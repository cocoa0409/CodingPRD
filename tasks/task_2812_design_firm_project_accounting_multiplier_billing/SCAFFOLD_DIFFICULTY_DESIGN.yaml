              as: Controller
              captures: { p_id: $.data.id, p_v0: $.data.version }
            - call: "POST /phases"
              payload: { project_id: "${p_id}", wbs_code: "01-SD", fee_basis: "LUMP_SUM", lump_sum_fee: 100000.00, budget_labor_cost: 0.00, consultant_budget: 0.00 }
              as: Controller
              captures: { ph_zero: $.data.id }
            - call: "POST /phases"
