      - name: boundary_cancellation_lead_exactly_grace_is_free
        grounds:
          - calculations.cancellation_tier
          - entities.CorporateAccount.fields.cancellation_grace_minutes
          - entities.Reservation.fields.cancellation_fee_cents
          - state_machines.Reservation.QUOTED_to_CANCELLED
        distinguishing_aspect: "Distinct metric (lead-time vs wait) on a distinct endpoint (trip-events CANCEL): clock 10:00, pickup 12:00 => lead 120 == grace 120 => FREE tier, fee 0 (>= grace boundary); one minute less (lead 119) would be TIER1."
        test_recipe:
          setup:
            - "Account grace 120; clock 2026-07-12T10:00:00Z; QUOTED reservation pickup 2026-07-12T12:00:00Z (lead exactly 120)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-12T10:00:00Z" }
              as: DispatchAdmin
            - call: "POST /corporate-accounts"
              payload: { company_name: "Acme", billing_email: "ap@acme.com", negotiated_discount_pct: 10, default_gratuity_pct: 20, cancellation_grace_minutes: 120 }
              as: DispatchAdmin
              captures: { acct: $.data.id }
            - call: "POST /vehicle-classes"
              payload: { code: "SEDAN", base_fare_cents: 5000, per_mile_cents: 250, hourly_rate_cents: 12000, wait_per_minute_cents: 200 }
              as: DispatchAdmin
              captures: { sedan: $.data.id }
            - call: "POST /reservations"
              payload: { corporate_account_id: "${acct}", trip_type: "POINT_TO_POINT", vehicle_class_id: "${sedan}", pickup_at: "2026-07-12T12:00:00Z", planned_drop_at: "2026-07-12T13:00:00Z", estimated_miles: 12.4, tolls_cents: 350 }
