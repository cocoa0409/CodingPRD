            - { call: "POST /reservations", payload: { member_id: "${m}", dock_id: "${hd}", boat_type: "PONTOON", start_time: "2026-05-05T13:30:00Z", end_time: "2026-05-05T15:00:00Z" }, as: Member, as_user_id: "${m}", captures: { r3: "$.data.id" } }
          assert:
            - "the 12:30 request (30-min gap) returns status 409 with data.error_id == ERR_MEMBER_SCHEDULE_CONFLICT"
            - "the 13:30 request (90-min gap) returns status 201"
            - "Reservation.${r3}.status == REQUESTED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: ci_weekly_reservation_credits_confirm_cancel
        grounds:
          - calculations.member_weekly_reservations
          - state_machines.Reservation.REQUESTED_to_CONFIRMED
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
        distinguishing_aspect: "The conserved quantity is the weekly reservation allowance count: reservations_used_this_week + reservations_remaining_this_week == tier.reservations_per_week (4) before, during, and after; confirm decrements remaining to 3 and cancel restores it to 4 with zero drift."
        test_recipe:
          setup:
            - "A SAIL member (reservations_per_week=4) is ACTIVE and BASIC-certified; the clock is set to 2026-05-04T08:00Z (Monday of the reservation's ISO week)."
          setup_api_calls:
