    side_effects: ["computes block_label from the NPA code, nxx_code and thousands_digit and enforces its uniqueness", "computes is_pooling_eligible from contaminated_count", "recomputes RateCenter.available_block_count / assigned_block_count, NPA.available_block_count / total_block_count and the NPA exhaust posture", "when holder_carrier_id is supplied, sets assigned_at = clock_now, activation_due_at = clock_now + ACTIVATION_WINDOW_DAYS and recomputes Carrier.blocks_held_count"]
  - method: GET
