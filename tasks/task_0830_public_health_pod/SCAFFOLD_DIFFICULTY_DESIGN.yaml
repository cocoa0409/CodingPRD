  # ===========================================================================
  # Rule 9 — compensating_invariant (>=2, different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: allocation_reserve_then_cancel_restores_available_quantity
        grounds:
          - state_machines.AllocationRequest.REQUESTED_to_RESERVED
          - state_machines.AllocationRequest.RESERVED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: InventoryLot.reserved_quantity + available_quantity
          == on_hand_quantity (inventory-quota units). Reserve moves quantity from
          available to reserved; cancel moves it back — the sum is invariant
          throughout.
        test_recipe:
          setup:
            - "Central SNS-cache InventoryLot on_hand_quantity=200"
            - "AllocationRequest requested_quantity=50"
          setup_api_calls:
            - call: "POST /hazard-plans"
              payload: { hazard_type: OUTBREAK_OTHER, title: "Invariant A Plan", jurisdiction_code: "CTY17", target_population: 1500 }
              as: PublicHealthAdmin
              captures: { hp_id: $.data.id }
            - call: "POST /hazard-plans/${hp_id}/activate"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /pods"
              payload: { hazard_plan_id: "${hp_id}", site_name: "Invariant A POD", site_type: FIXED_POD, address: "17 Invariant Way", staffing_capacity_lanes: 3, lane_throughput_rate_per_hour: 15 }
              as: PublicHealthAdmin
              captures: { pod_id: $.data.id }
            - call: "POST /pods/${pod_id}/open"
              payload: {}
              as: PublicHealthAdmin
              captures: { pod_v1: $.data.version }
            - call: "POST /countermeasures"
              payload: { name: "Invariant Vaccine", countermeasure_type: VACCINE, doses_required: 1, unit_cost_cents: 300, reorder_point_quantity: 5 }
              as: PublicHealthAdmin
              captures: { cm_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { countermeasure_id: "${cm_id}", lot_number: "LOT-H1", on_hand_quantity: 200, expiration_date: "2027-01-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { lot_id: $.data.id, lot_v1: $.data.version }
            - call: "POST /allocation-requests"
              payload: { pod_id: "${pod_id}", countermeasure_id: "${cm_id}", source_type: SNS_CACHE, requested_quantity: 50, expected_pod_version: "${pod_v1}" }
              as: LogisticsCoordinator
              captures: { ar_id: $.data.id }
          trigger:
            - call: "POST /allocation-requests/${ar_id}/reserve"
              payload: { expected_inventory_lot_version: "${lot_v1}" }
              as: LogisticsCoordinator
            - call: "GET /inventory-lots/${lot_id}"
              payload: {}
              as: LogisticsCoordinator
              captures: { avail_after_reserve: $.data.available_quantity, reserved_after_reserve: $.data.reserved_quantity }
            - call: "POST /allocation-requests/${ar_id}/cancel"
              payload: {}
              as: LogisticsCoordinator
            - call: "GET /inventory-lots/${lot_id}"
              payload: {}
              as: LogisticsCoordinator
              captures: { avail_after_cancel: $.data.available_quantity, reserved_after_cancel: $.data.reserved_quantity }
          assert:
            - "avail_after_reserve == 150 and reserved_after_reserve == 50  (150+50 == on_hand_quantity 200)"
            - "avail_after_cancel == 200 and reserved_after_cancel == 0  (200+0 == on_hand_quantity 200 — invariant restored exactly to the pre-reserve values)"

      - name: shift_confirm_then_cancel_restores_committed_staff_hours
        grounds:
          - state_machines.ShiftAssignment.PENDING_to_CONFIRMED
          - state_machines.ShiftAssignment.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: POD.committed_staff_hours (staffing-hours units) —
          a different type of conserved quantity than instance 1's inventory
          units. Confirm adds the shift's duration; cancelling a CONFIRMED shift
          subtracts the same duration back to the pre-confirm value.
        test_recipe:
          setup:
            - "POD.committed_staff_hours starts at 0"
            - "ShiftAssignment [2026-03-07T08:00:00Z, 2026-03-07T16:00:00Z) — an 8 hour window"
          setup_api_calls:
            - call: "POST /hazard-plans"
              payload: { hazard_type: OUTBREAK_OTHER, title: "Invariant B Plan", jurisdiction_code: "CTY18", target_population: 1800 }
              as: PublicHealthAdmin
              captures: { hp_id: $.data.id }
            - call: "POST /hazard-plans/${hp_id}/activate"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /pods"
              payload: { hazard_plan_id: "${hp_id}", site_name: "Invariant B POD", site_type: FIXED_POD, address: "18 Invariant Way", staffing_capacity_lanes: 3, lane_throughput_rate_per_hour: 15 }
              as: PublicHealthAdmin
              captures: { pod_id: $.data.id }
            - call: "POST /pods/${pod_id}/open"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /staff-members"
              payload: { full_name: "Hours Staff", email: "hoursstaff@example.org", primary_role: VACCINATOR, mrc_unit: "UnitM", credential_type: EMT_CERT, credential_expires_at: "2027-01-01T00:00:00Z" }
              as: PublicHealthAdmin
              captures: { staff_id: $.data.id }
            - call: "POST /staff-members/${staff_id}/verify-credential"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /shift-assignments"
              payload: { pod_id: "${pod_id}", staff_member_id: "${staff_id}", assigned_role: VACCINATOR, start_time: "2026-03-07T08:00:00Z", end_time: "2026-03-07T16:00:00Z" }
              as: PublicHealthAdmin
              captures: { sa_id: $.data.id }
          trigger:
            - call: "POST /shift-assignments/${sa_id}/confirm"
              payload: {}
              as: ClinicalLead
            - call: "GET /pods/${pod_id}"
              payload: {}
              as: PublicHealthAdmin
              captures: { hours_after_confirm: $.data.committed_staff_hours }
            - call: "POST /shift-assignments/${sa_id}/cancel"
              payload: {}
              as: PublicHealthAdmin
            - call: "GET /pods/${pod_id}"
              payload: {}
              as: PublicHealthAdmin
              captures: { hours_after_cancel: $.data.committed_staff_hours }
          assert:
            - "hours_after_confirm == 8  (end_time - start_time == 8 hours, added to committed_staff_hours)"
            - "hours_after_cancel == 0  (the CONFIRMED->CANCELLED reversal subtracts the same 8 hours, restoring the pre-confirm value)"
