      - name: design_not_released_outranks_stock_allowance_exceeded_on_confirm
        grounds:
          - validations[priority=40]
          - validations[priority=91]
          - errors[ERR_DESIGN_NOT_RELEASED]
          - errors[ERR_STOCK_ALLOWANCE_EXCEEDED]
          - endpoints[POST /customer-orders/{id}/confirm]
          - calculations.distributor_allowance_ledger
        distinguishing_aspect: |
          A different rule pair with a much narrower gap and different categories:
          business_referential (priority 40) versus business_fiscal (priority 91) on
          POST /customer-orders/{id}/confirm. The order asks for 12 units against a
          committed_annual_units of 10 AND its design has been pulled back to REVISION_OPEN, so
          the 409 referential error must mask the 422 fiscal one; re-releasing the design without
          touching the quantity then exposes the fiscal error, and the allowance ledger must
          still read 0 outstanding / 10 remaining after both rejections.
