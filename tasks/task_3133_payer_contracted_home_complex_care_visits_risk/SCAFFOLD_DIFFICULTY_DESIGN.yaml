      - name: shared_savings_per_member_delta_pool_then_split_then_withhold_pinned_order
        grounds:
          - calculations.shared_savings_settlement_amount
          - entities.PayerSettlement.fields.gross_savings_share_cents
          - entities.PayerSettlement.fields.quality_withhold_cents
          - entities.PayerSettlement.fields.net_payment_cents
        distinguishing_aspect: |
          Mode (c): a circular-looking dependency where the order of evaluation
          is pinned. Per-member delta feeds the pool; the pool feeds the split;
          the split feeds the withhold; the withhold feeds the net. If a reader
          computed the withhold from the gross pool BEFORE applying the split,
          or computed the split from the per-member average instead of the
          pooled sum, the cents diverge. Three members with deltas
          +150000, -50000, +250000 (pool = 350000, split 0.50 → share 175000;
          withhold 10% → 17500; release full → net = 175000). The floor at
          zero on negative pooled savings (a separate scenario) is also
          exercised implicitly because one member is a loser but the pool is
          still positive.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "SHARED_SAVINGS contract: baseline 600000, split 0.50, withhold 0.10, threshold 0.80."
            - "Three members attributed to the contract, all enrolled ACTIVE; medical costs 450000, 650000, 350000 in period 0 → deltas +150000, -50000, +250000."
