# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml  —  §1.8 for task_2303 (public aquarium)
#
# Nine §0.5 difficulty rules, 24 differentiated instances.
# Every instance grounds in §1.1-§1.6 of SCAFFOLD.yaml, and every assert is a
# pre-computed literal, never a restatement of a formula.
# Instance names are unique across this file AND SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================
scaffold_difficulty_design:
- rule_id: dual_variant_calc
  rationale: Two different §1.3 calculations carry variants, on two different entities with two disjoint input universes, so a single shared helper cannot satisfy both.
  instances:
  - name: dual_variant_sustainability_provisional_then_final_after_receiver_downgrade
    grounds:
    - §1.3 sustainability_score, variants PROVISIONAL and FINAL
    - §1.1 AcquisitionRequest.sustainability_score / sustainability_score_variant / quota_units_reserved
    - §1.1 Institution.welfare_audit_score / is_receiving_eligible
    - §1.2 AcquisitionRequest READY_FOR_CLEARANCE -> CLEARED
    - §1.5 POST /aquarium/acquisition-requests, PATCH /aquarium/institutions/{id}, POST /aquarium/acquisition-requests/{id}/clearance
    - §1.4 priority 13 ERR_SOD_VIOLATION, priority 47 ERR_CLEARANCE_SCORE_TOO_LOW
    distinguishing_aspect: The FINAL variant RE-READS the source institution's current welfare_audit_score instead of reusing the value snapshotted at creation. An implementation that stores the PROVISIONAL number and re-labels it FINAL at clearance returns 84.00 where 77.00 is required; the -7.00 delta is exactly INSTITUTION_WEIGHT * (88.00 - 60.00).
    test_recipe:
      setup: One exhibit, one UNLISTED GREEN species, an APPROVED plan entry and an accredited source institution with welfare_audit_score 88.00. An INSTITUTIONAL_TRANSFER acquisition request is created (PROVISIONAL stamp) and submitted; because the species is UNLISTED and the source is not wild, permit_required is false and the request lands on READY_FOR_CLEARANCE. The institution is then re-audited down to 60.00 before clearance is granted.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
        captures: {lss_id: $.data.id}
      - call: POST /aquarium/exhibits
        payload: {exhibit_code: EX-COLD-1, name: Cold Water Reef, habitat_type: COLD_MARINE, life_support_system_id: '${lss_id}', display_volume_liters: 120000, bioload_capacity_units: 100}
        as: CuratorOfCollections
        captures: {ex_id: $.data.id, ex_v1: $.data.version}
      - call: POST /aquarium/species
        payload: {scientific_name: Sebastes ruberrimus, common_name: yelloweye rockfish, taxon_group: TELEOST, protection_status: UNLISTED, sustainability_rating: GREEN, bioload_units_per_specimen: 12, base_quarantine_days: 30, wild_take_quota_annual: 4}
        as: CuratorOfCollections
        captures: {sp_id: $.data.id, sp_v1: $.data.version}
      - call: POST /aquarium/collection-plan-entries
        payload: {exhibit_id: '${ex_id}', species_id: '${sp_id}', planned_count: 2, sustainability_requirement: GREEN_ONLY, expected_exhibit_version: '${ex_v1}'}
        as: CuratorOfCollections
        captures: {cpe_id: $.data.id}
      - call: POST /aquarium/collection-plan-entries/${cpe_id}/status-actions
        payload: {action: APPROVE}
        as: ComplianceDirector
        as_user_id: dir-plan-approver
      - call: POST /aquarium/institutions
        payload: {name: Northport Marine Institute, institution_code: NPM, accreditation_status: ACCREDITED, welfare_audit_score: 88.0, last_audit_at: '2026-05-01T00:00:00Z'}
        as: ComplianceDirector
        captures: {inst_id: $.data.id}
      - call: POST /aquarium/acquisition-requests
        payload: {collection_plan_entry_id: '${cpe_id}', source_type: INSTITUTIONAL_TRANSFER, requested_count: 1, source_institution_id: '${inst_id}'}
        as: CuratorOfCollections
        captures: {ar_id: $.data.id, prov_score: $.data.sustainability_score}
      - call: POST /aquarium/acquisition-requests/${ar_id}/submission
        payload: {}
        as: CuratorOfCollections
      - call: PATCH /aquarium/institutions/${inst_id}
        payload: {welfare_audit_score: 60.0, last_audit_at: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: GET /aquarium/species/${sp_id}
        payload: {}
        as: ComplianceDirector
        captures: {sp_v2: $.data.version}
      trigger:
      - call: POST /aquarium/acquisition-requests/${ar_id}/clearance
        payload: {expected_species_version: '${sp_v2}'}
        as: ComplianceDirector
        as_user_id: dir-clearance-officer
        captures: {final_score: $.data.sustainability_score}
      assert:
      - immediately after POST /aquarium/acquisition-requests the response carries sustainability_score == 84.00 and sustainability_score_variant == PROVISIONAL (min(100, 40 + 22 + 0.25*88.00) - 0)
      - the PATCH response carries Institution.welfare_audit_score == 60.00 and is_receiving_eligible == false (60.00 < MIN_RECEIVER_WELFARE_SCORE 70.00)
      - the trigger response carries AcquisitionRequest.status == CLEARED, sustainability_score == 77.00 and sustainability_score_variant == FINAL
      - the recomputation delta is exactly -7.00; a stored-and-relabelled PROVISIONAL value would return 84.00
      - AcquisitionRequest.quota_units_reserved == 0 and Species.wild_take_quota_reserved == 0 (a non-wild source reserves nothing even though the species has wild_take_quota_annual 4)
      - AcquisitionRequest.cleared_by_user_id == 'dir-clearance-officer' and cleared_at == '2026-08-01T00:00:00Z'
      - 'no permit was consulted: the FINAL score contains no PERMIT_BONUS term because the request never entered PENDING_PERMIT'
  - name: dual_variant_welfare_rolling_then_audit_snapshot_on_identical_logs
    grounds:
    - §1.3 welfare_score, variants ROLLING and AUDIT_SNAPSHOT
    - §1.1 Specimen.welfare_score / welfare_score_variant
    - §1.1 HusbandryLog.log_type / logged_at / appetite_score / behavior_code
    - §1.2 AccreditationAudit SCHEDULED -> IN_PROGRESS
    - §1.5 POST /aquarium/specimens/{id}/husbandry-logs, POST /aquarium/accreditation-audits/{id}/progressions
    distinguishing_aspect: The two variants read the SAME five HusbandryLog rows and disagree by 58.14 points, because ROLLING divides the appetite sum by the sample count (3) and penalises open treatment cases, while AUDIT_SNAPSHOT divides by AUDIT_WINDOW_DAYS (14) and penalises the 11 calendar days inside the window that carry no feeding record. Neither penalty term appears in the other variant.
    test_recipe:
      setup: A specimen is accessioned, cleared out of quarantine and placed on exhibit. Five husbandry logs are appended on three distinct feeding dates (2026-09-11, 2026-09-12, 2026-09-13) plus two behaviour observations, all inside the 14-day window that ends at the audit instant 2026-09-15T00:00:00Z. Both of the specimen's veterinary cases are CLOSED, so the open-treatment penalty is zero and only the variant arithmetic can explain the gap.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
        captures: {lss_id: $.data.id}
      - call: POST /aquarium/exhibits
        payload: {exhibit_code: EX-COLD-1, name: Cold Water Reef, habitat_type: COLD_MARINE, life_support_system_id: '${lss_id}', display_volume_liters: 120000, bioload_capacity_units: 100}
        as: CuratorOfCollections
        captures: {ex_id: $.data.id, ex_v1: $.data.version}
      - call: POST /aquarium/species
        payload: {scientific_name: Sebastes ruberrimus, common_name: yelloweye rockfish, taxon_group: TELEOST, protection_status: UNLISTED, sustainability_rating: GREEN, bioload_units_per_specimen: 12, base_quarantine_days: 30, wild_take_quota_annual: 4}
        as: CuratorOfCollections
        captures: {sp_id: $.data.id, sp_v1: $.data.version}
      - call: POST /aquarium/collection-plan-entries
        payload: {exhibit_id: '${ex_id}', species_id: '${sp_id}', planned_count: 2, sustainability_requirement: GREEN_ONLY, expected_exhibit_version: '${ex_v1}'}
        as: CuratorOfCollections
        captures: {cpe_id: $.data.id}
      - call: POST /aquarium/collection-plan-entries/${cpe_id}/status-actions
        payload: {action: APPROVE}
        as: ComplianceDirector
        as_user_id: dir-plan-approver
      - call: POST /aquarium/acquisition-requests
        payload: {collection_plan_entry_id: '${cpe_id}', source_type: CAPTIVE_BRED, requested_count: 1}
        as: CuratorOfCollections
        captures: {ar_id: $.data.id, prov_score: $.data.sustainability_score}
      - call: POST /aquarium/acquisition-requests/${ar_id}/submission
        payload: {}
        as: CuratorOfCollections
      - call: GET /aquarium/species/${sp_id}
        payload: {}
        as: ComplianceDirector
        captures: {sp_v2: $.data.version}
      - call: POST /aquarium/acquisition-requests/${ar_id}/clearance
        payload: {expected_species_version: '${sp_v2}'}
        as: ComplianceDirector
        as_user_id: dir-clearance-officer
      - call: POST /aquarium/specimens
        payload: {accession_code: SPC-0001, species_id: '${sp_id}', acquisition_request_id: '${ar_id}', arrival_at: '2026-08-01T00:00:00Z', holding_area: QT-BAY-1}
        as: CuratorOfCollections
        captures: {spec_id: $.data.id}
      - call: GET /aquarium/specimens/${spec_id}/quarantine-cases
        payload: {}
        as: VeterinaryOfficer
        captures: {qc_id: '$.data[0].id'}
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-05T00:00:00Z'}
        as: VeterinaryOfficer
      - call: POST /aquarium/veterinary-cases
        payload: {specimen_id: '${spec_id}', case_type: PREVENTIVE_EXAM, opened_at: '2026-08-05T00:00:00Z'}
        as: VeterinaryOfficer
        as_user_id: vet-exam-opener
        captures: {vc1_id: $.data.id}
      - call: POST /aquarium/veterinary-cases/${vc1_id}/closure
        payload: {outcome: RESOLVED, findings_severity: NONE}
        as: VeterinaryOfficer
        as_user_id: vet-exam-closer
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-10T00:00:00Z'}
        as: VeterinaryOfficer
      - call: POST /aquarium/veterinary-cases
        payload: {specimen_id: '${spec_id}', case_type: PREVENTIVE_EXAM, opened_at: '2026-08-10T00:00:00Z'}
        as: VeterinaryOfficer
        as_user_id: vet-exam-opener
        captures: {vc2_id: $.data.id}
      - call: POST /aquarium/veterinary-cases/${vc2_id}/closure
        payload: {outcome: RESOLVED, findings_severity: NONE}
        as: VeterinaryOfficer
        as_user_id: vet-exam-closer
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-09-01T00:00:00Z'}
        as: VeterinaryOfficer
      - call: POST /aquarium/quarantine-cases/${qc_id}/reviews
        payload: {outcome: CLEAR}
        as: VeterinaryOfficer
        as_user_id: vet-quarantine-clearer
      - call: GET /aquarium/exhibits/${ex_id}
        payload: {}
        as: AquaristTechnician
        captures: {ex_v2: $.data.version}
      - call: POST /aquarium/specimens/${spec_id}/exhibit-placements
        payload: {exhibit_id: '${ex_id}', expected_exhibit_version: '${ex_v2}'}
        as: AquaristTechnician
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-09-14T12:00:00Z'}
        as: AquaristTechnician
      - call: POST /aquarium/specimens/${spec_id}/husbandry-logs
        payload: {log_type: FEEDING, logged_at: '2026-09-11T09:00:00Z', appetite_score: 4, feed_grams: 120.0}
        as: AquaristTechnician
      - call: POST /aquarium/specimens/${spec_id}/husbandry-logs
        payload: {log_type: FEEDING, logged_at: '2026-09-12T09:00:00Z', appetite_score: 5, feed_grams: 150.0}
        as: AquaristTechnician
      - call: POST /aquarium/specimens/${spec_id}/husbandry-logs
        payload: {log_type: BEHAVIOR, logged_at: '2026-09-12T15:00:00Z', behavior_code: NORMAL}
        as: AquaristTechnician
      - call: POST /aquarium/specimens/${spec_id}/husbandry-logs
        payload: {log_type: FEEDING, logged_at: '2026-09-13T09:00:00Z', appetite_score: 3, feed_grams: 90.0}
        as: AquaristTechnician
      - call: POST /aquarium/specimens/${spec_id}/husbandry-logs
        payload: {log_type: BEHAVIOR, logged_at: '2026-09-14T09:00:00Z', behavior_code: LETHARGIC}
        as: AquaristTechnician
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-09-15T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/accreditation-audits
        payload: {audit_code: AUD-2026-Q3, scope: FULL, scheduled_for: '2026-09-15T00:00:00Z'}
        as: ComplianceDirector
        captures: {aud_id: $.data.id}
      trigger:
      - call: POST /aquarium/accreditation-audits/${aud_id}/progressions
        payload: {action: START}
        as: ComplianceDirector
        as_user_id: dir-audit-opener
      assert:
      - immediately after the fifth husbandry log Specimen.welfare_score == 79.00 and welfare_score_variant == ROLLING (appetite mean (4+5+3)/3 = 4.00 * 8 = 32.00, behaviour mean (10.00+4.00)/2 = 7.00, no open TREATMENT case)
      - after the trigger Specimen.welfare_score == 20.86 and welfare_score_variant == AUDIT_SNAPSHOT (appetite (4+5+3)/14 * 8 = 6.857142857, behaviour 7.00, missing_feed_days 14 - 3 = 11 -> 40 + 6.857142857 + 7 - 33 = 20.857142857)
      - AccreditationAudit.domain_subscores.ANIMAL_HEALTH == 20.86, i.e. the audit reads the AUDIT_SNAPSHOT value, never the 79.00 rolling value
      - 'the five HusbandryLog rows are unchanged by the trigger: GET /aquarium/specimens/{id}/husbandry-logs still returns total_count 5'
      - AccreditationAudit.status == IN_PROGRESS and opened_by_user_id == 'dir-audit-opener'
      - re-appending no further logs, a second START is impossible (status is no longer SCHEDULED), so 20.86 is stable
- rule_id: combinatorial_formula
  rationale: Mode (a) conditional-branch accumulation, mode (b) nested rounding and mode (c) a non-commutative pipeline, each on a different §1.3 calculation.
  instances:
  - name: combinatorial_wqi_multi_parameter_nested_max_term
    grounds:
    - '§1.3 water_quality_index (mode a: six parameter deviation ratios, a habitat target table, an additive SUM_WEIGHT term and a nested MAX_WEIGHT term over the same ratio set)'
    - §1.1 WaterQualityReading.severity / breach_parameters / water_quality_index_snapshot
    - §1.2 LifeSupportSystem.alarm_state NORMAL -> WARNING
    - §1.3 exhibit_posture (OPEN -> RESTRICTED, LSS_WARNING)
    - §1.5 POST /aquarium/life-support-systems/{id}/water-quality-readings
    distinguishing_aspect: Four of the six ratios are non-zero and two of them tie into the penalty twice — once through the sum and once through max(). Dropping the MAX_WEIGHT term yields 82.90 instead of 66.40, and using the raw parameter values rather than the habitat-relative ratios makes the ammonia and nitrite terms non-zero even though both sit exactly on their warning thresholds.
    test_recipe:
      setup: One COLD_MARINE recirculating plant serving one COLD_MARINE exhibit, clock at 2026-08-01T12:00:00Z so the reading instant is in the past.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T12:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
        captures: {lss_id: $.data.id}
      - call: POST /aquarium/exhibits
        payload: {exhibit_code: EX-COLD-1, name: Cold Water Reef, habitat_type: COLD_MARINE, life_support_system_id: '${lss_id}', display_volume_liters: 120000, bioload_capacity_units: 100}
        as: CuratorOfCollections
        captures: {ex_id: $.data.id, ex_v1: $.data.version}
      trigger:
      - call: POST /aquarium/life-support-systems/${lss_id}/water-quality-readings
        payload: {taken_at: '2026-08-01T09:00:00Z', temperature_c: 13.65, salinity_ppt: 33.5, ph: 8.15, dissolved_oxygen_mg_l: 6.25, ammonia_mg_l: 0.02, nitrite_mg_l: 0.1}
        as: AquaristTechnician
        captures: {sev: $.data.severity, idx: $.data.water_quality_index_snapshot}
      - call: GET /aquarium/exhibits/${ex_id}
        payload: {}
        as: AquaristTechnician
        captures: {ex_v2: $.data.version}
      assert:
      - the reading response carries water_quality_index_snapshot == 66.40 (ratios temperature 1.65/1.5 = 1.10, salinity 0.50/1.0 = 0.50, ph 0.05/0.2 = 0.25, dissolved oxygen (7.0-6.25)/1.5*2 = 1.00, ammonia 0.00, nitrite 0.00; sum 2.85, max 1.10; 100 - (6*2.85 + 15*1.10) = 66.40)
      - severity == WARNING because max ratio 1.10 is >= WARNING_RATIO 1.0 and < CRITICAL_RATIO 2.0
      - breach_parameters == ['temperature_c', 'dissolved_oxygen_mg_l'] in §1.1 field order; the dissolved-oxygen ratio of exactly 1.00 IS a breach (>= is inclusive)
      - ammonia_mg_l 0.020 and nitrite_mg_l 0.100 sit exactly on AMMONIA_WARN / NITRITE_WARN and contribute ratio 0.00, not a breach
      - omitting the nested MAX_WEIGHT term would give 100 - 6*2.85 = 82.90, which is wrong
      - LifeSupportSystem.alarm_state == WARNING, water_quality_index == 66.40, consecutive_breach_readings == 1, consecutive_normal_readings == 0
      - the served Exhibit has posture == RESTRICTED and last_posture_reason == 'LSS_WARNING'
  - name: combinatorial_readiness_nested_rounding_per_subscore_then_weighted
    grounds:
    - '§1.3 readiness_score (mode b: round each of five domain subscores to 2 dp, round the weighted sum, then apply the blocking deduction and clamp)'
    - §1.3 welfare_score AUDIT_SNAPSHOT (feeds ANIMAL_HEALTH)
    - §1.1 AccreditationAudit.readiness_score / domain_subscores / blocking_finding_count
    - §1.2 AccreditationAudit SCHEDULED -> IN_PROGRESS -> CONDITIONAL
    - §1.4 priority 13 ERR_SOD_VIOLATION, priority 35 ERR_AUDIT_NOT_DUE
    - §1.5 POST /aquarium/accreditation-audits/{id}/progressions
    distinguishing_aspect: 'The rounding is nested three deep and the ANIMAL_HEALTH mean is a repeating decimal, so the order matters: rounding the subscore first gives 0.25*20.86 = 5.2150 and a final 80.22, while summing the unrounded 20.857142857 gives 80.2142857 -> 80.21. Only one of the two answers is correct, and both are within a cent of each other.'
    test_recipe:
      setup: 'Same world as the welfare dual-variant instance: one healthy plant with no readings (LIFE_SUPPORT 100.00), one specimen ON_EXHIBIT whose AUDIT_SNAPSHOT welfare is the repeating 20.857142857 (ANIMAL_HEALTH), five husbandry logs so RECORDS is 100.00, no CLEARED permit-bearing request (PERMITS 100.00) and no interaction sessions at all (PUBLIC_SAFETY 100.00). No plant is CRITICAL or OFFLINE, no exhibit is CLOSED and no specimen awaits necropsy, so blocking_finding_count is 0.'
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
        captures: {lss_id: $.data.id}
      - call: POST /aquarium/exhibits
        payload: {exhibit_code: EX-COLD-1, name: Cold Water Reef, habitat_type: COLD_MARINE, life_support_system_id: '${lss_id}', display_volume_liters: 120000, bioload_capacity_units: 100}
        as: CuratorOfCollections
        captures: {ex_id: $.data.id, ex_v1: $.data.version}
      - call: POST /aquarium/species
        payload: {scientific_name: Sebastes ruberrimus, common_name: yelloweye rockfish, taxon_group: TELEOST, protection_status: UNLISTED, sustainability_rating: GREEN, bioload_units_per_specimen: 12, base_quarantine_days: 30, wild_take_quota_annual: 4}
        as: CuratorOfCollections
