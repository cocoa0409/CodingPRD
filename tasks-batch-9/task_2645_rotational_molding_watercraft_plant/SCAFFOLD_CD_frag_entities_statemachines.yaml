      # ------------------------------------------------------------------ stubs
      - name: ent_computed_warranty_reserve_and_paid_on_product_model
        claim_type: Computed Fields
        grounds:
          - entities.ProductModel.fields.warranty_reserve_cents
          - entities.ProductModel.fields.warranty_paid_cents
        excluded_because:
          difficulty_instance: "compensating_invariant / warranty_reserve_ledger_conserved_across_approve_and_void"
          rationale: "That instance already reads both computed money fields before an approve, after the approve and after the void, and asserts warranty_reserve_cents + warranty_paid_cents == initial_warranty_reserve_cents at each step — a strictly stronger claim than 'the two fields are derived, not posted'."

      - name: ent_computed_storage_footprint_and_zone_anchor_flag_on_finished_unit
        claim_type: Computed Fields
        grounds:
          - entities.FinishedUnit.fields.stored_footprint_cube_m3
          - entities.FinishedUnit.fields.is_zone_anchor
          - entities.FinishedUnit.fields.storage_zone_code
        excluded_because:
          difficulty_instance: "compensating_invariant / storage_footprint_conserved_with_asymmetric_anchor_promotion"
          rationale: "The asymmetric-anchor instance stores three hulls into one zone and asserts the anchor's full gross cube against the followers' nested cube, then promotes a follower on release — so it already pins stored_footprint_cube_m3, is_zone_anchor and storage_zone_code as server-derived on every row."

      - name: ent_computed_warehouse_committed_cube_utilization_and_posture
        claim_type: Computed Fields
        grounds:
          - entities.Warehouse.fields.committed_cube_m3
          - entities.Warehouse.fields.utilization_pct
          - entities.Warehouse.fields.posture
        excluded_because:
          difficulty_instance: "boundary_precision_check / warehouse_frozen_threshold_rounded_95_00_freezes_vs_95_01_threshold"
          rationale: "That instance drives committed_cube_m3 to the exact rounding boundary and asserts utilization_pct and the derived posture on both sides of frozen_threshold_pct, which subsumes the plain 'these three fields are computed from stored hulls, not supplied' claim."

      - name: ent_computed_mold_id_selected_by_the_server_at_cycle_creation
        claim_type: Computed Fields
        grounds:
          - entities.MoldingCycle.fields.mold_id
          - calculations.mold_selection
        excluded_because:
          difficulty_instance: "dual_variant_calc / mold_selection_first_attempt_vs_retry_with_exclusions"
          rationale: "mold_id is absent from the POST /molding-cycles input list and is chosen by calculations.mold_selection; that instance runs the selector twice over the same pool with and without exclude_mold_ids and asserts a different winning mould each time, which proves server derivation far more sharply than a single-candidate pool would."

      - name: ent_computed_wall_thickness_statistics_on_finished_unit
        claim_type: Computed Fields
        grounds:
          - entities.FinishedUnit.fields.mean_wall_thickness_mm
          - entities.FinishedUnit.fields.wall_sd_mm
          - entities.FinishedUnit.fields.wall_cv_pct
          - entities.FinishedUnit.fields.min_wall_thickness_mm
          - calculations.wall_thickness_distribution
        excluded_because:
          difficulty_instance: "combinatorial_formula / wall_distribution_nested_rounding_mean_then_sd_then_cv"
          rationale: "All four statistics are asserted there as literals computed from one measurement vector through the mandated round-mean-then-sd-then-cv order, so a second instance could only restate the same derivation with weaker numbers."

      - name: ent_type_constraint_wall_thickness_points_minimum_cardinality
        claim_type: Type Constraints
        grounds:
          - validations[priority=25]
          - entities.FinishedUnit.fields.wall_thickness_points
          - errors.ERR_INSUFFICIENT_MEASUREMENTS
        excluded_because:
          difficulty_instance: "boundary_precision_check / inspection_measurement_count_six_accepted_vs_five_rejected"
          rationale: "The array-cardinality constraint is exercised there at both sides of the inclusive floor — five points rejected with ERR_INSUFFICIENT_MEASUREMENTS and six accepted on the same hull — which is exactly this claim plus the boundary."

      - name: ent_type_constraint_regrind_percentage_ceiling_at_two_decimals
        claim_type: Type Constraints
        grounds:
          - entities.ResinLot.fields.regrind_pct_by_mass
          - entities.ProductModel.fields.max_regrind_pct
          - errors.ERR_REGRIND_LIMIT_EXCEEDED
        excluded_because:
          difficulty_instance: "boundary_precision_check / regrind_ceiling_exact_30_00_pct_accepted_vs_30_01_rejected"
          rationale: "That instance already fixes the two-decimal semantics of the regrind percentage against max_regrind_pct, accepting exactly 30.00 and rejecting 30.01, so the type-and-range claim on these fields is fully covered."

