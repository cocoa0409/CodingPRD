              as: Underwriter
              captures: { g1_new: $.data.id, g1_new_surcharge: $.data.high_risk_surcharge_pct }
            - call: "POST /carriers/${carrier_id}/policies"
              payload: { grower_id: "${g2}", policy_kind: "CROP_HAIL", effective_date: "2026-08-10T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z" }
              as: Underwriter
              captures: { g2_new: $.data.id, g2_new_surcharge: $.data.high_risk_surcharge_pct }
          assert:
            - "Policy.${g1_new}.high_risk_surcharge_pct == 0   (1 prior claim — below threshold)"
            - "Policy.${g2_new}.high_risk_surcharge_pct == 10  (2 prior claims — boundary INCLUSIVE)"

      - name: acreage_report_lateness_exactly_at_deadline_is_timely
        grounds:
          - calculations.acreage_report_lateness
          - entities.AcreageReport.fields.is_timely
        distinguishing_aspect: |
          Different metric (deadline boundary, not threshold count) and different
          endpoint (POST .../acreage-reports, not POST /policies). Deadline is
          INCLUSIVE (submitted_at <= deadline → timely). We pin: submit exactly
          AT the deadline timestamp (boundary) vs 1 second past it (violation).
        test_recipe:
          setup:
            - "Carrier; grower; rate; policy effective 2026-08-02, expiration 2026-12-31"
            - "acreage_report_deadline = effective + 21d = 2026-08-23T00:00:00Z"
            - "Two CUs on same policy (CU-A, CU-B) so we can submit two PLANTING reports"
          setup_api_calls:
            - call: "POST /carriers"
              payload: { carrier_code: "CHL-L", legal_name: "Carrier L", reinsurance_treaty_attachment_cents: 100000000 }
              as: PlatformAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/growers"
              payload: { full_name: "Grower L", tax_id_last4: "7777", email: "l@x.com", county_code: "06001", state_code: "CA" }
              as: Underwriter
              captures: { grower_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/rate-tables"
              payload: { rating_kind: "CROP_HAIL", county_code: "06001", crop_code: "CORN", rate_per_100_cents_of_liability: 333, effective_from: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { rt: $.data.id }
            - call: "POST /carriers/${carrier_id}/rate-tables/${rt}/publish"
              payload: {}
              as: Underwriter
            - call: "POST /carriers/${carrier_id}/policies"
              payload: { grower_id: "${grower_id}", policy_kind: "CROP_HAIL", effective_date: "2026-08-02T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z" }
              as: Underwriter
              captures: { policy_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/coverage-units"
              payload: { county_code: "06001", crop_code: "CORN", declared_acres: 1 }
              as: Underwriter
              captures: { cu_a: $.data.id }
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/coverage-units"
              payload: { county_code: "06001", crop_code: "CORN", declared_acres: 1 }
              as: Underwriter
              captures: { cu_b: $.data.id }
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/bind"
              payload: {}
              as: Underwriter
            # Advance clock to exactly the deadline (2026-08-23T00:00:00Z) for CU-A.
            - call: "POST /carriers/${carrier_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-23T00:00:00Z" }
              as: Underwriter
          trigger:
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/coverage-units/${cu_a}/acreage-reports"
              payload: { report_kind: "PLANTING", reported_acres: 1 }
              as: Policyholder
              as_user_id: "${grower_id}"
              captures: { ar_a_timely: $.data.is_timely, ar_a_late: $.data.lateness_days, ar_a_red: $.data.coverage_reduction_pct }
            # Advance clock by 1 second past the deadline for CU-B.
            - call: "POST /carriers/${carrier_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-23T00:00:01Z" }
              as: Underwriter
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/coverage-units/${cu_b}/acreage-reports"
              payload: { report_kind: "PLANTING", reported_acres: 1 }
              as: Policyholder
              as_user_id: "${grower_id}"
              captures: { ar_b_timely: $.data.is_timely, ar_b_late: $.data.lateness_days, ar_b_red: $.data.coverage_reduction_pct }
          assert:
            - "AcreageReport on CU-A: is_timely == true AND lateness_days == 0 AND coverage_reduction_pct == 0   (boundary INCLUSIVE)"
            - "AcreageReport on CU-B: is_timely == false AND lateness_days == 1 (ceiling of 1 second = 1 day) AND coverage_reduction_pct == 5"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency on DIFFERENT entity pairs
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: claim_determination_blocked_when_docs_incomplete
        grounds:
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
          - entities.Claim.fields.doc_posture
        distinguishing_aspect: |
          Pair = Claim.claim_state × Claim.doc_posture (parallel-axis
          dependency on same entity; treated as cross-entity in spirit because
          doc_posture is mutated by VeterinaryReport entity, NOT by claim
          transitions). The APPROVE transition is BLOCKED until
          VeterinaryReport rows push doc_posture to DOCS_COMPLETE.
        test_recipe:
          setup:
            - "Carrier; grower; PUBLISHED CATTLE rate; BOUND+ACTIVE+PAID livestock policy"
            - "CU(species=CATTLE, head=10, per_head=200000); timely INITIAL head report"
            - "Claim loss 2026-08-04, appraised 100000, deceased 1"
            - "Adjuster assigned, FieldInspection submitted, submit-for-review (claim now UNDER_REVIEW)"
            - "NO VeterinaryReport yet — doc_posture = DOCS_PENDING"
          setup_api_calls:
            - call: "POST /carriers"
              payload: { carrier_code: "CHL-M", legal_name: "Carrier M", reinsurance_treaty_attachment_cents: 100000000 }
              as: PlatformAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/growers"
              payload: { full_name: "Rancher M", tax_id_last4: "1212", email: "m@x.com", county_code: "06001", state_code: "CA" }
              as: Underwriter
              captures: { grower_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/adjusters"
              payload: { full_name: "Adj M", license_number: "ADJ-M-1", county_codes: ["06001"], species_qualified: ["CATTLE"], capacity_max_open_claims: 5 }
              as: Underwriter
              captures: { adjuster_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/rate-tables"
              payload: { rating_kind: "LIVESTOCK_MORTALITY", species: "CATTLE", value_band_floor_cents: 150000, value_band_ceiling_cents: 250000, rate_per_100_cents_of_liability: 400, effective_from: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { rt: $.data.id }
            - call: "POST /carriers/${carrier_id}/rate-tables/${rt}/publish"
              payload: {}
              as: Underwriter
            - call: "POST /carriers/${carrier_id}/policies"
              payload: { grower_id: "${grower_id}", policy_kind: "LIVESTOCK_MORTALITY", effective_date: "2026-08-02T00:00:00Z", expiration_date: "2027-08-02T00:00:00Z" }
              as: Underwriter
              captures: { policy_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/coverage-units"
              payload: { species: "CATTLE", declared_head_count: 10, per_head_value_cents: 200000 }
              as: Underwriter
              captures: { cu_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/premium-payments"
              payload: { amount_cents: 80000 }
              as: Policyholder
              as_user_id: "${grower_id}"
            - call: "POST /carriers/${carrier_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
