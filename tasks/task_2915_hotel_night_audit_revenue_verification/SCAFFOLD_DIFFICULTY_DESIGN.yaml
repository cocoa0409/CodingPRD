          assert:
            - "GET /night-audit/settlement-batches/${batch_at_id} returns system_amount == 150.45, variance_amount == 5.00 and status == MATCHED, because abs(5.00) <= 5.00."
            - "GET /night-audit/settlement-batches/${batch_over_id} returns system_amount == 150.45, variance_amount == 5.01 and status == VARIANCE_FLAGGED - one cent more."
            - "The trigger response returns status == SETTLEMENT_REVIEW, unresolved_settlement_batch_count == 1 (only the flagged batch counts) and settlement_variance_total_amount == 10.01 (abs(5.00) + abs(5.01), both batches contribute)."
            - "A follow-up POST /night-audit/business-dates/${bd1_id}/balance as NightAuditor fails 409 ERR_SETTLEMENTS_UNRESOLVED while the flagged batch stands."
            - "An implementation using a strict < tolerance comparison flags the 5.00 batch too, giving unresolved_settlement_batch_count == 2, and fails."

  - rule_id: cross_entity_state_dependency
    instances:

      - name: revoking_comp_paperwork_breaks_tomorrows_audit_without_rewriting_yesterday
        grounds: "§1.4 priority 54 ERR_COMP_AUTHORIZATION_MISSING; §1.2 AuthorizationDocument ACTIVE -> REVOKED; §1.5 POST /night-audit/authorization-documents/{id}/revoke ('lines already posted under the document are left untouched'); §1.1 Folio.is_comp."
        distinguishing_aspect: >-
          The gated entity (BusinessDate) is not the entity whose state changed (AuthorizationDocument),
          and the dependency is evaluated per audit run rather than per row, so revoking paperwork
          mid-stay is forward-only: yesterday's 0.00 ROOM line survives while today's run is refused
          in full. No other instance here has an asymmetric past/future effect.
        test_recipe:
          setup: "Standard property; business dates 2026-08-01 and 2026-08-02; one COMP folio (is_comp true, nights_count 2, contracted_rate_amount 200.00) checked in; a COMP_ROOM AuthorizationDocument covering 2026-08-01 to 2026-08-02 filed by FrontDeskAgent u_fd_1 and reviewed APPROVE by RevenueManager u_rm_1 so it is ACTIVE; the 2026-08-01 audit run then posts the comp night; finally the Controller revokes the document."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00.000Z" }
