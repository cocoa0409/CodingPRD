  - { method: GET, path: "/central-casting/time-events", description: "List time events", roles: *ALL_ROLES, code: 200, input: ["limit?", "offset?", "booking_id?", "event_type?", "corrects_event_id?"], output: "TimeEvent[]", side_effects: [] }
