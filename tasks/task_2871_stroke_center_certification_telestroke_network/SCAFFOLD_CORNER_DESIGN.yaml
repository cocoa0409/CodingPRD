- section: state_machines
  instances:
  - name: protocol_deviation_opens_in_the_declared_initial_state
    claim_type: initial_state
    grounds:
    - state_machines.ProtocolDeviation initial_state OPEN
    - endpoints.POST /stroke-network/deviations
    distinguishing_aspect: A MANUAL deviation must land in OPEN with review_round 0 and debrief_completed false; an implementation that jumps straight to UNDER_REVIEW would skip the reviewer's start-review step entirely.
    test_recipe:
      setup:
      - Clock set to 2026-09-01T08:00:00Z; one SPOKE centre and one ACTIVATED case on it.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:00:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/stroke-centers
        payload:
          name: Riverside Community Spoke
          facility_type: SPOKE
          state_code: CA
          ems_region_code: CA-R1
        as: ProgramCoordinator
        captures:
          is_ctr: $.data.id
      - call: POST /stroke-network/code-strokes
        payload:
          center_id: ${is_ctr}
          patient_ref: P-IS-001
          door_at: '2026-09-01T08:00:00Z'
          lkw_precision: EXACT
          arrival_mode: EMS
          last_known_well_at: '2026-09-01T07:40:00Z'
        as: EdPhysician
        as_user_id: ed_ann
        captures:
          is_case: $.data.id
      trigger:
      - call: POST /stroke-network/deviations
        payload:
          case_id: ${is_case}
          deviation_type: DTI_EXCEEDED
          severity: MINOR
          narrative: imaging clock exceeded on a busy shift
        as: QualityAbstractor
        as_user_id: qa_bob
        captures:
          is_dev: $.data.id
          is_status: $.data.status
          is_src: $.data.source
          is_round: $.data.review_round
          is_deb: $.data.debrief_completed
          is_rev: $.data.reviewed_by_user_id
          is_open: $.data.opened_by_user_id
      assert:
      - HTTP 201 with ${is_status} == OPEN (the declared initial_state)
      - ${is_src} == MANUAL — the default, because this row came from a human, not the detector
      - ${is_round} == 0, ${is_deb} == false, ${is_rev} == null
      - ${is_open} == qa_bob, taken from X-User-ID and not from the body
      - CodeStrokeCase.${is_case}.deviation_count == 1
  - name: imaging_complete_moves_an_activated_case_and_stamps_the_clock
    claim_type: valid_transition
    grounds:
    - state_machines.CodeStrokeCase ACTIVATED -> IMAGING_COMPLETE
    - calculations.clock_interval_metrics door_to_imaging_minutes
    - endpoints.POST /stroke-network/code-strokes/{id}/imaging-complete
    distinguishing_aspect: The happy-path transition must stamp imaging_at from the LOGICAL clock, derive door_to_imaging_minutes = 20 by floor division, and raise NO deviation because 20 <= DTI_TARGET_MIN of 45.
    test_recipe:
      setup:
      - Clock set to 2026-09-01T08:00:00Z; one SPOKE centre with both readiness flags true.
      - One CodeStrokeCase with door_at 2026-09-01T08:00:00Z, status ACTIVATED, version 1.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:00:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/stroke-centers
        payload:
          name: Riverside Community Spoke
          facility_type: SPOKE
          state_code: CA
          ems_region_code: CA-R1
        as: ProgramCoordinator
        captures:
          vt_ctr: $.data.id
      - call: POST /stroke-network/code-strokes
        payload:
          center_id: ${vt_ctr}
          patient_ref: P-VT-001
          door_at: '2026-09-01T08:00:00Z'
          lkw_precision: EXACT
          arrival_mode: EMS
          last_known_well_at: '2026-09-01T07:40:00Z'
        as: EdPhysician
        as_user_id: ed_ann
        captures:
          vt_case: $.data.id
      trigger:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:20:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/code-strokes/${vt_case}/imaging-complete
        payload:
          imaging_modality: CT_NON_CONTRAST
        as: EdPhysician
        as_user_id: ed_ann
      - call: GET /stroke-network/code-strokes/${vt_case}
        as: EdPhysician
        captures:
          vt_status: $.data.status
          vt_img: $.data.imaging_at
          vt_dti: $.data.door_to_imaging_minutes
          vt_dev: $.data.deviation_count
          vt_v: $.data.version
      - call: GET /stroke-network/deviations?case_id=${vt_case}&limit=10&offset=0
        payload:
          case_id: ${vt_case}
          limit: 10
          offset: 0
        as: ProgramCoordinator
      assert:
      - HTTP 200; ${vt_status} == IMAGING_COMPLETE
      - ${vt_img} == 2026-09-01T08:20:00Z — the logical clock, not wall time
      - ${vt_dti} == 20 (floor(1200 / 60)), and door_at is unchanged at 08:00:00Z
      - ${vt_dev} == 0 and the deviation list reports total_count 0 because 20 <= DTI_TARGET_MIN 45
      - ${vt_v} == 2 — exactly one version increment
  - name: imaging_complete_is_blocked_while_the_ct_scanner_is_failed
    claim_type: precondition_enforcement
    grounds:
    - state_machines.CodeStrokeCase ACTIVATED -> IMAGING_COMPLETE precondition 'center ct_scanner_ready == true'
    - validations priority 58 -> ERR_CENTER_EQUIPMENT_OFFLINE (409)
    - endpoints.POST /stroke-network/stroke-centers/{id}/readiness-attestations
    distinguishing_aspect: A FAIL attestation on the CT scanner alone leaves the centre only DEGRADED, not OFFLINE — yet the imaging precondition keys off the ct_scanner_ready FLAG, so imaging must still be refused. A PASS attestation then restores READY and the same call succeeds.
    test_recipe:
      setup:
      - Clock set to 2026-09-01T08:00:00Z; one SPOKE centre, both readiness flags true, posture READY.
      - One ACTIVATED CodeStrokeCase with door_at 08:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:00:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/stroke-centers
