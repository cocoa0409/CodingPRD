# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Record Label A&R & Release Planning
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_net_payable
        grounds:
          - calculations.statement_net_payable
          - calculations.recoupment_waterfall
          - state_machines.RoyaltyStatement.PROVISIONAL_to_FINAL
        distinguishing_aspect: |
          Same revenue data, two variants on the RoyaltyStatement entity domain:
          the provisional variant holds reserve = 10% of (earned - projected) and
          reports net 36000, while the final variant releases the reserve and
          reports net 40000 — a 4000-cent delta on identical inputs.
        test_recipe:
          setup:
            - "Label with defaults; artist (score 56.1) signed via memo advance 100000, base rate 2000 bps, MASTER_ONLY; advance disbursed (advance bucket 100000)"
            - "One SINGLE release LIVE (release_date 2026-09-01); one STREAMING revenue report period 2026-Q3 gross 1000000 units 10000"
            - "Royalty run 2026-Q3 CLOSED then CALCULATED"
          setup_api_calls:
            - { call: "POST /api/labels", payload: { name: "Label C" }, as: LabelAdmin, captures: { label_id: $.data.id } }
            - { call: "POST /api/artists", payload: { label_id: "${label_id}", stage_name: "Artist C", genre: "POP", birth_date: "1995-04-12", monthly_streams: 600000, social_followers: 800000, engagement_rate: 0.5, live_draw_avg: 1000 }, as: AnRManager, captures: { artist_id: $.data.id } }
            - { call: "POST /api/artists/${artist_id}/deal-memos", payload: { advance_cents: 100000, base_royalty_rate_bps: 2000, recoupment_scope: "MASTER_ONLY", promo_costs_recoupable: false, options_total: 1, option_term_months: 12, option_escalation_bps: 150, term_months: 12, valid_until_date: "2028-01-01" }, as: AnRManager, captures: { memo_id: $.data.id } }
            - { call: "POST /api/deal-memos/${memo_id}/propose", payload: {}, as: AnRManager }
            - { call: "POST /api/deal-memos/${memo_id}/approve", payload: {}, as: LabelAdmin }
            - { call: "POST /api/deal-memos/${memo_id}/execute", payload: {}, as: LabelAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /api/contracts/${contract_id}/disburse-advance", payload: {}, as: FinanceController }
            - { call: "POST /api/contracts/${contract_id}/recording-projects", payload: { title: "P-C", project_type: "SINGLE", budget_cents: 1000000 }, as: AnRManager, captures: { proj_id: $.data.id } }
            - { call: "POST /api/recording-projects/${proj_id}/start", payload: {}, as: AnRManager }
            - { call: "POST /api/recording-projects/${proj_id}/tracks", payload: { title: "T1", duration_seconds: 200, isrc: "USRC10000001" }, as: AnRManager, captures: { trk_id: $.data.id } }
            - { call: "POST /api/tracks/${trk_id}/advance-stage", payload: {}, as: AnRManager }
            - { call: "POST /api/tracks/${trk_id}/advance-stage", payload: {}, as: AnRManager }
            - { call: "POST /api/tracks/${trk_id}/advance-stage", payload: {}, as: AnRManager }
            - { call: "POST /api/tracks/${trk_id}/advance-stage", payload: {}, as: AnRManager }
            - { call: "POST /api/contracts/${contract_id}/releases", payload: { project_id: "${proj_id}", title: "R-C", release_type: "SINGLE", release_date: "2026-09-01", track_ids: ["${trk_id}"] }, as: AnRManager, captures: { rel_id: $.data.id } }
            - { call: "POST /api/releases/${rel_id}/assemble", payload: {}, as: AnRManager }
            - { call: "POST /api/releases/${rel_id}/lock-assets", payload: { cover_art_confirmed: true }, as: AnRManager }
            - { call: "POST /api/releases/${rel_id}/schedule", payload: {}, as: MarketingManager }
            - { call: "POST /api/distributors", payload: { label_id: "${label_id}", name: "DSP-1", channel_type: "DSP" }, as: LabelAdmin, captures: { dist_id: $.data.id } }
            - { call: "POST /api/releases/${rel_id}/deliveries", payload: { distributor_ids: ["${dist_id}"] }, as: MarketingManager, captures: { del_id: "$.data[0].id" } }
            - { call: "POST /api/asset-deliveries/${del_id}/transmit", payload: {}, as: MarketingManager }
            - { call: "POST /api/asset-deliveries/${del_id}/acknowledge", payload: {}, as: MarketingManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: LabelAdmin }
            - { call: "POST /api/releases/${rel_id}/go-live", payload: {}, as: MarketingManager }
            - { call: "POST /api/revenue-reports", payload: { label_id: "${label_id}", distributor_id: "${dist_id}", release_id: "${rel_id}", period: "2026-Q3", channel: "STREAMING", units: 10000, gross_revenue_cents: 1000000 }, as: FinanceController }
            - { call: "POST /api/royalty-runs", payload: { label_id: "${label_id}", period: "2026-Q3" }, as: FinanceController, captures: { run_id: $.data.id } }
            - { call: "POST /api/royalty-runs/${run_id}/close", payload: {}, as: FinanceController }
            - { call: "POST /api/royalty-runs/${run_id}/calculate", payload: {}, as: FinanceController }
            - { call: "GET /api/royalty-runs/${run_id}/statements", payload: {}, as: FinanceController, captures: { stmt_id: "$.data[0].id" } }
          trigger:
            - { call: "GET /api/royalty-statements/${stmt_id}", payload: {}, as: FinanceController, captures: { prov_net: $.data.net_payable_cents, prov_reserve: $.data.reserve_held_cents } }
            - { call: "POST /api/royalty-runs/${run_id}/finalize", payload: {}, as: FinanceController }
            - { call: "GET /api/royalty-statements/${stmt_id}", payload: {}, as: FinanceController, captures: { fin_net: $.data.net_payable_cents } }
          assert:
            - "Provisional: RoyaltyStatement.${stmt_id}.status == PROVISIONAL, royalty_earned_cents == 140000, projected_recoupment_cents == 100000, reserve_held_cents == 4000, net_payable_cents == 36000"
            - "Final: RoyaltyStatement.${stmt_id}.status == FINAL, recoupment_applied_cents == 100000, reserve_held_cents == 0, net_payable_cents == 40000"
            - "fin_net - prov_net == 4000 (the released reserve) over identical revenue data"

      - name: master_only_vs_cross_collateralized_waterfall
        grounds:
          - calculations.recoupment_waterfall
          - entities.RecoupmentAccount.fields.tour_support_balance_cents
        distinguishing_aspect: |
          Same earnings (70000) and identical tour-support bucket (30000) on the
          RecoupmentAccount entity domain: a MASTER_ONLY contract applies 0
          (tour bucket invisible, artist nets full 70000) while a
          CROSS_COLLATERALIZED contract applies 30000 (artist nets 40000).
        test_recipe:
          setup:
            - "Label with defaults; two artists each signed with advance 0, base 2000 bps; artist M scope MASTER_ONLY, artist X scope CROSS_COLLATERALIZED"
            - "Each contract: tour support approved 60000, advanced 30000, one TRAVEL expense 30000 approved (tour bucket 30000; category cap floor(0.5 x 60000) == 30000 exactly)"
            - "Each contract: one SINGLE release LIVE; one STREAMING report 2026-Q3 gross 500000 units 5000 (earned 70000 each)"
            - "Royalty run 2026-Q3 CALCULATED then FINALIZED"
          setup_api_calls:
            - { call: "POST /api/labels", payload: { name: "Label D" }, as: LabelAdmin, captures: { label_id: $.data.id } }
            - { call: "POST /api/artists", payload: { label_id: "${label_id}", stage_name: "Artist M", genre: "POP", birth_date: "1995-04-12", monthly_streams: 600000, social_followers: 800000, engagement_rate: 0.5, live_draw_avg: 1000 }, as: AnRManager, captures: { artist_m: $.data.id } }
            - { call: "POST /api/artists/${artist_m}/deal-memos", payload: { advance_cents: 0, base_royalty_rate_bps: 2000, recoupment_scope: "MASTER_ONLY", promo_costs_recoupable: false, options_total: 0, option_term_months: 12, option_escalation_bps: 0, term_months: 12, valid_until_date: "2028-01-01" }, as: AnRManager, captures: { memo_m: $.data.id } }
            - { call: "POST /api/deal-memos/${memo_m}/propose", payload: {}, as: AnRManager }
            - { call: "POST /api/deal-memos/${memo_m}/approve", payload: {}, as: LabelAdmin }
            - { call: "POST /api/deal-memos/${memo_m}/execute", payload: {}, as: LabelAdmin, captures: { contract_m: $.data.id } }
            - { call: "POST /api/artists", payload: { label_id: "${label_id}", stage_name: "Artist X", genre: "ROCK", birth_date: "1990-01-01", monthly_streams: 600000, social_followers: 800000, engagement_rate: 0.5, live_draw_avg: 1000 }, as: AnRManager, captures: { artist_x: $.data.id } }
            - { call: "POST /api/artists/${artist_x}/deal-memos", payload: { advance_cents: 0, base_royalty_rate_bps: 2000, recoupment_scope: "CROSS_COLLATERALIZED", promo_costs_recoupable: false, options_total: 0, option_term_months: 12, option_escalation_bps: 0, term_months: 12, valid_until_date: "2028-01-01" }, as: AnRManager, captures: { memo_x: $.data.id } }
            - { call: "POST /api/deal-memos/${memo_x}/propose", payload: {}, as: AnRManager }
            - { call: "POST /api/deal-memos/${memo_x}/approve", payload: {}, as: LabelAdmin }
            - { call: "POST /api/deal-memos/${memo_x}/execute", payload: {}, as: LabelAdmin, captures: { contract_x: $.data.id } }
            - { call: "POST /api/contracts/${contract_m}/tour-supports", payload: { tour_name: "Tour M", requested_amount_cents: 60000 }, as: AnRManager, captures: { ts_m: $.data.id } }
            - { call: "POST /api/tour-supports/${ts_m}/approve", payload: { approved_budget_cents: 60000 }, as: LabelAdmin, as_user_id: "admin-1" }
            - { call: "POST /api/tour-supports/${ts_m}/advance-funds", payload: { amount_cents: 30000 }, as: FinanceController, as_user_id: "fin-1" }
            - { call: "POST /api/tour-supports/${ts_m}/expenses", payload: { category: "TRAVEL", amount_cents: 30000, expense_date: "2026-09-15" }, as: ArtistPortal, as_user_id: "${artist_m}", captures: { exp_m: $.data.id } }
            - { call: "POST /api/tour-expenses/${exp_m}/approve", payload: {}, as: FinanceController }
            - { call: "POST /api/contracts/${contract_x}/tour-supports", payload: { tour_name: "Tour X", requested_amount_cents: 60000 }, as: AnRManager, captures: { ts_x: $.data.id } }
