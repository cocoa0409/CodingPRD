              as: ProgramDirector
              captures: { atty_a_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Nadia Rey", rep_type: "ACCREDITED_REP", languages: ["en", "es"], max_case_load: 15, max_supervisees: 0, weekly_capacity_hours: 40 }
              as: ProgramDirector
              captures: { nadia_id: "$.data.id" }
            - call: "POST /clients"
              payload: { full_name: "Rosa Mena", preferred_language_code: "es", country_of_birth_code: "GT", date_of_birth: "1990-04-11", household_size: 3, annual_household_income_cents: 2000000 }
              as: ProgramDirector
              captures: { client_id: "$.data.id" }
          trigger:
            - call: "POST /intake-screenings"
              payload: { client_id: "${client_id}", cycle_id: "${cycle_id}", case_type: "U_VISA", detained: false, statutory_deadline_date: "2026-12-01" }
              as: ProgramDirector
              captures: { intake_id: "$.data.id" }
            - call: "POST /intake-screenings/${intake_id}/screen"
              payload: {}
              as: IntakeScreener
              as_user_id: "${atty_a_id}"
            - call: "POST /intake-screenings/${intake_id}/decide"
              payload: { decision: "ACCEPT", decision_reason_code: "ACCEPTED_ON_MERIT" }
              as: ProgramDirector
            - call: "POST /accreditations"
              payload: { representative_id: "${nadia_id}", recognition_id: "${rec_id}", accreditation_type: "PARTIAL", requested_forums: ["USCIS"] }
              as: ProgramDirector
