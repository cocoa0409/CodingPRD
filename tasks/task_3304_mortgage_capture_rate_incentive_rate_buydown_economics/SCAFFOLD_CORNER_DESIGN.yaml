            - "the second allocation is rejected with http 412 and error_id ERR_STALE_CONTRACT_VERSION"
            - "HomeSaleContract.${ct1}.version == 2 after the first write"
            - "exactly one IncentiveAllocation row exists for HomeSaleContract.${ct1}"

      - name: derived_field_reconciliation_after_close_and_reopen
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.capture_rate_realization
          - entities.Community.fields.funded_units
          - state_machines.RateLock.EXPIRED_to_ACTIVE
        distinguishing_aspect: "The community's derived aggregates stay reconciled across a close: they rise on close and are recomputed, not left stale, when the count of CLOSED contracts changes."
        test_recipe:
          setup: ["one closeable contract"]
          setup_api_calls:
            - call: "POST /housing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /housing/communities"
              payload: { name: "C1", state_code: "TX", incentive_policy_code: "STANDARD", price_reduction_cap_cents: 3000000, closing_cost_cap_cents: 2000000, rate_buydown_cap_cents: 6000000 }
              as: PlatformAdmin
              captures: { cm1: $.data.id }
            - call: "POST /housing/buyers"
              payload: { full_name: "Ada", email: "ada@x.com", state_code: "TX" }
              as: SalesCounselor
              captures: { b1: $.data.id }
            - call: "POST /housing/communities/${cm1}/home-sites"
              payload: { lot_number: "L1", address: "1 Elm", base_price_cents: 50000000, construction_stage: "FINISH", estimated_completion_iso: "2026-10-01T00:00:00Z", advertised_rate_bps: 499, advertised_rate_expires_iso: "2027-01-01T00:00:00Z" }
              as: SalesCounselor
              captures: { hs1: $.data.id }
            - call: "POST /housing/communities/${cm1}/forward-commitments"
              payload: { commitment_code: "FC1", investor_name: "Fannie", committed_rate_bps: 499, committed_units: 5, commitment_start_iso: "2026-09-01T00:00:00Z", commitment_end_iso: "2030-01-01T00:00:00Z" }
              as: MortgageBanker
              captures: { fc1: $.data.id }
            - call: "POST /housing/home-sites/${hs1}/contracts"
              payload: { buyer_id: "${b1}", purchase_price_cents: 50000000, earnest_money_cents: 2000000 }
              as: SalesCounselor
              captures: { ct1: $.data.id }
            - call: "POST /housing/contracts/${ct1}/loan-applications"
              payload: { lender_entity_code: "AFFILIATED_LENDER", application_number: "APP-1", qualifying_income_cents: 2000000, monthly_debt_cents: 100000 }
              as: MortgageBanker
              captures: { la1: $.data.id }
            - call: "POST /housing/loan-applications/${la1}/qualify"
              payload: {}
              as: MortgageBanker
              captures: { la1_v: $.data.version }
            - call: "POST /housing/loan-applications/${la1}/rate-locks"
              payload: { commitment_id: "${fc1}", lock_rate_bps: 499, lock_days: 180, expected_application_version: "${la1_v}" }
              as: MortgageBanker
              captures: { lk1: $.data.id }
          trigger:
            - call: "POST /housing/contracts/${ct1}/lock"
              payload: {}
              as: MortgageBanker
            - call: "POST /housing/contracts/${ct1}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /housing/contracts/${ct1}/close"
              payload: {}
              as: ClosingOfficer
            - call: "GET /housing/communities/${cm1}"
              payload: {}
              as: ComplianceOfficer
              captures: { fu: $.data.funded_units, cr: $.data.capture_rate_bps }
          assert:
            - "Community.${cm1}.funded_units == 1 immediately after the close"
            - "Community.${cm1}.affiliated_units == 1"
            - "Community.${cm1}.capture_rate_bps == 10000"
            - "Community.${cm1}.incentive_spend_cents == 0, showing the derived fields were recomputed from source rows rather than incremented blindly"

  - section: consistency_model
    instances:
      - name: immediate_visibility_of_derived_buyer_totals_within_the_write_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - entities.Buyer.fields.total_incentive_received_cents
          - endpoints.GET /housing/buyers/{id}
        distinguishing_aspect: "Under the immediate consistency model the buyer's derived incentive total is already correct on the very next read, with no delay or reconciliation window."
        test_recipe:
          setup: ["an approved contract with an applied allocation of 6000000"]
          setup_api_calls:
            - call: "POST /housing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
