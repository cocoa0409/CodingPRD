# =============================================================================
# §1.8 Scaffold Difficulty Design — task 2993 (CCR closure & groundwater
# monitoring). Nine §0.5 difficulty rules x 2 instances = 18 instances.
# Every instance grounds only in SCAFFOLD.yaml §1.1-§1.7 and is reachable from
# an empty database using the endpoints declared in §1.5. The logical clock
# starts at 2026-08-01T00:00:00Z; every fixture date below is chosen against
# that default.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: interwell_vs_intrawell_limit_flips_ssi_verdict
        grounds:
          - calculations.background_statistical_limit
          - calculations.statistical_verdict
          - entities.MonitoringProgram.fields.comparison_basis
          - entities.StatisticalEvaluation.fields.background_upper_limit
          - entities.StatisticalEvaluation.fields.comparison_basis_used
          - state_machines.MonitoringProgram.DETECTION_to_ASSESSMENT
        distinguishing_aspect: |
          The same 0.9000 mg/L sulfate measurement at well DG-01 yields NO_SSI under the INTRAWELL
          variant (limit 0.9453, built from DG-01's own four background values) and SSI under the
          INTERWELL variant (limit 0.6961, built from the four upgradient BG-01 values) — the variant
          alone decides the verdict and whether the program leaves DETECTION.
        test_recipe:
          setup:
            - "One unit with a certified network: BG-01 (BACKGROUND) plus DG-01..DG-03 (DOWNGRADIENT)"
            - "Background window 2025-01-01..2025-12-31 holding four VALIDATED rounds 91 days apart, each carrying one BG-01 and one DG-01 sulfate result"
            - "BG-01 window values 0.5000/0.6000/0.5500/0.5800; DG-01 window values 0.6800/0.8200/0.7400/0.7800"
            - "One VALIDATED DETECTION round on 2026-06-15 with DG-01 sulfate 0.9000"
            - "Program comparison_basis starts as INTRAWELL; statistical_method is the PARAMETRIC default"
          setup_api_calls:
            - call: "POST /ccr/professionals"
              payload: { full_name: "Mia Chen", license_number: "HG-33003", license_state: "NC", discipline: "HYDROGEOLOGY" }
              as: UtilityAdmin
              captures: { hg_id: $.data.id }
            - call: "POST /ccr/professionals"
              payload: { full_name: "Rae Novak", license_number: "ST-44004", license_state: "NC", discipline: "STATISTICS" }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0001", unit_name: "Ash Pond 1", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { unit_id: $.data.id, prog_id: $.data.monitoring_program_id }
            - call: "POST /ccr/wells"
              payload: { unit_id: "${unit_id}", well_code: "BG-01", well_role: "BACKGROUND", aquifer_zone: "UPPER SAND", screen_top_ft: 22.00, screen_bottom_ft: 42.00, installed_on: "2024-06-01" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
              captures: { bg1_id: $.data.id }
            - call: "POST /ccr/wells"
              payload: { unit_id: "${unit_id}", well_code: "DG-01", well_role: "DOWNGRADIENT", aquifer_zone: "UPPER SAND", screen_top_ft: 20.00, screen_bottom_ft: 40.00, installed_on: "2024-06-01" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
              captures: { dg1_id: $.data.id }
            - call: "POST /ccr/wells"
              payload: { unit_id: "${unit_id}", well_code: "DG-02", well_role: "DOWNGRADIENT", aquifer_zone: "UPPER SAND", screen_top_ft: 21.00, screen_bottom_ft: 41.00, installed_on: "2024-06-01" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
            - call: "POST /ccr/wells"
              payload: { unit_id: "${unit_id}", well_code: "DG-03", well_role: "DOWNGRADIENT", aquifer_zone: "UPPER SAND", screen_top_ft: 23.00, screen_bottom_ft: 43.00, installed_on: "2024-06-01" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
            - call: "PATCH /ccr/monitoring-programs/${prog_id}"
              payload: { comparison_basis: "INTRAWELL", background_window_start_on: "2025-01-01", background_window_end_on: "2025-12-31" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
            - call: "POST /ccr/monitoring-programs/${prog_id}/certify-network"
              payload: { certified_on: "2025-01-05" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
            - call: "POST /ccr/sampling-events"
              payload: { program_id: "${prog_id}", event_code: "BG-R1", event_type: "BACKGROUND", sampled_on: "2025-02-10" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
              captures: { ev1_id: $.data.id, ev1_v1: $.data.version }
            - call: "POST /ccr/analytical-results"
              payload: { sampling_event_id: "${ev1_id}", well_id: "${bg1_id}", parameter_code: "SULFATE", concentration: 0.5000, unit_of_measure: "MG_PER_L", detection_flag: "DETECTED", expected_sampling_event_version: "${ev1_v1}" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
            - call: "GET /ccr/sampling-events/${ev1_id}"
              as: Hydrogeologist
              as_user_id: "${hg_id}"
              captures: { ev1_v2: $.data.version }
            - call: "POST /ccr/analytical-results"
              payload: { sampling_event_id: "${ev1_id}", well_id: "${dg1_id}", parameter_code: "SULFATE", concentration: 0.6800, unit_of_measure: "MG_PER_L", detection_flag: "DETECTED", expected_sampling_event_version: "${ev1_v2}" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
            - call: "POST /ccr/sampling-events/${ev1_id}/validate"
              payload: { validated_on: "2025-02-11" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
            - call: "POST /ccr/sampling-events"
              payload: { program_id: "${prog_id}", event_code: "BG-R2", event_type: "BACKGROUND", sampled_on: "2025-05-12" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
              captures: { ev2_id: $.data.id, ev2_v1: $.data.version }
            - call: "POST /ccr/analytical-results"
              payload: { sampling_event_id: "${ev2_id}", well_id: "${bg1_id}", parameter_code: "SULFATE", concentration: 0.6000, unit_of_measure: "MG_PER_L", detection_flag: "DETECTED", expected_sampling_event_version: "${ev2_v1}" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
            - call: "GET /ccr/sampling-events/${ev2_id}"
              as: Hydrogeologist
              as_user_id: "${hg_id}"
              captures: { ev2_v2: $.data.version }
            - call: "POST /ccr/analytical-results"
              payload: { sampling_event_id: "${ev2_id}", well_id: "${dg1_id}", parameter_code: "SULFATE", concentration: 0.8200, unit_of_measure: "MG_PER_L", detection_flag: "DETECTED", expected_sampling_event_version: "${ev2_v2}" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
            - call: "POST /ccr/sampling-events/${ev2_id}/validate"
              payload: { validated_on: "2025-05-13" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
            - call: "POST /ccr/sampling-events"
              payload: { program_id: "${prog_id}", event_code: "BG-R3", event_type: "BACKGROUND", sampled_on: "2025-08-11" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
              captures: { ev3_id: $.data.id, ev3_v1: $.data.version }
            - call: "POST /ccr/analytical-results"
              payload: { sampling_event_id: "${ev3_id}", well_id: "${bg1_id}", parameter_code: "SULFATE", concentration: 0.5500, unit_of_measure: "MG_PER_L", detection_flag: "DETECTED", expected_sampling_event_version: "${ev3_v1}" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
            - call: "GET /ccr/sampling-events/${ev3_id}"
              as: Hydrogeologist
              as_user_id: "${hg_id}"
              captures: { ev3_v2: $.data.version }
            - call: "POST /ccr/analytical-results"
              payload: { sampling_event_id: "${ev3_id}", well_id: "${dg1_id}", parameter_code: "SULFATE", concentration: 0.7400, unit_of_measure: "MG_PER_L", detection_flag: "DETECTED", expected_sampling_event_version: "${ev3_v2}" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
            - call: "POST /ccr/sampling-events/${ev3_id}/validate"
              payload: { validated_on: "2025-08-12" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
            - call: "POST /ccr/sampling-events"
              payload: { program_id: "${prog_id}", event_code: "BG-R4", event_type: "BACKGROUND", sampled_on: "2025-11-10" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
              captures: { ev4_id: $.data.id, ev4_v1: $.data.version }
            - call: "POST /ccr/analytical-results"
              payload: { sampling_event_id: "${ev4_id}", well_id: "${bg1_id}", parameter_code: "SULFATE", concentration: 0.5800, unit_of_measure: "MG_PER_L", detection_flag: "DETECTED", expected_sampling_event_version: "${ev4_v1}" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
            - call: "GET /ccr/sampling-events/${ev4_id}"
              as: Hydrogeologist
              as_user_id: "${hg_id}"
              captures: { ev4_v2: $.data.version }
            - call: "POST /ccr/analytical-results"
              payload: { sampling_event_id: "${ev4_id}", well_id: "${dg1_id}", parameter_code: "SULFATE", concentration: 0.7800, unit_of_measure: "MG_PER_L", detection_flag: "DETECTED", expected_sampling_event_version: "${ev4_v2}" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
            - call: "POST /ccr/sampling-events/${ev4_id}/validate"
              payload: { validated_on: "2025-11-11" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
            - call: "POST /ccr/sampling-events"
              payload: { program_id: "${prog_id}", event_code: "DET-R1", event_type: "DETECTION", sampled_on: "2026-06-15" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
              captures: { ev5_id: $.data.id, ev5_v1: $.data.version }
            - call: "POST /ccr/analytical-results"
              payload: { sampling_event_id: "${ev5_id}", well_id: "${dg1_id}", parameter_code: "SULFATE", concentration: 0.9000, unit_of_measure: "MG_PER_L", detection_flag: "DETECTED", expected_sampling_event_version: "${ev5_v1}" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
            - call: "POST /ccr/sampling-events/${ev5_id}/validate"
              payload: { validated_on: "2026-06-16" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
          trigger:
            - call: "POST /ccr/statistical-evaluations"
              payload: { program_id: "${prog_id}", compliance_well_id: "${dg1_id}", evaluation_code: "EV-INTRA", parameter_code: "SULFATE" }
              as: StatisticalReviewer
              as_user_id: "${st_id}"
              captures: { ev_intra_id: $.data.id }
            - call: "PATCH /ccr/monitoring-programs/${prog_id}"
              payload: { comparison_basis: "INTERWELL" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
            - call: "POST /ccr/statistical-evaluations"
              payload: { program_id: "${prog_id}", compliance_well_id: "${dg1_id}", evaluation_code: "EV-INTER", parameter_code: "SULFATE" }
              as: StatisticalReviewer
              as_user_id: "${st_id}"
              captures: { ev_inter_id: $.data.id }
          assert:
            - "StatisticalEvaluation.${ev_intra_id}.comparison_basis_used == INTRAWELL"
            - "StatisticalEvaluation.${ev_intra_id}.background_n == 4"
            - "StatisticalEvaluation.${ev_intra_id}.background_mean == 0.7550"
            - "StatisticalEvaluation.${ev_intra_id}.background_stdev == 0.059722"
            - "StatisticalEvaluation.${ev_intra_id}.background_upper_limit == 0.9453"
            - "StatisticalEvaluation.${ev_intra_id}.comparison_value == 0.9000"
            - "StatisticalEvaluation.${ev_intra_id}.verdict == NO_SSI"
            - "StatisticalEvaluation.${ev_intra_id}.asd_deadline_date == null"
            - "StatisticalEvaluation.${ev_inter_id}.comparison_basis_used == INTERWELL"
            - "StatisticalEvaluation.${ev_inter_id}.background_n == 4"
            - "StatisticalEvaluation.${ev_inter_id}.background_mean == 0.5575"
            - "StatisticalEvaluation.${ev_inter_id}.background_stdev == 0.043493"
            - "StatisticalEvaluation.${ev_inter_id}.background_upper_limit == 0.6961"
            - "StatisticalEvaluation.${ev_inter_id}.comparison_value == 0.9000"
            - "StatisticalEvaluation.${ev_inter_id}.verdict == SSI"
            - "StatisticalEvaluation.${ev_inter_id}.asd_deadline_date == 2026-10-30"
            - "MonitoringProgram.${prog_id}.phase == ASSESSMENT"
            - "MonitoringProgram.${prog_id}.sampling_frequency == QUARTERLY"
            - "DisposalUnit.${unit_id}.compliance_posture == RESTRICTED"

      - name: nominal_vs_discounted_cost_flips_recommended_method
        grounds:
          - calculations.closure_cost_present_value
          - calculations.closure_method_recommendation
          - entities.ClosurePlan.fields.in_place_nominal_usd_cents
          - entities.ClosurePlan.fields.in_place_pv_usd_cents
          - entities.ClosurePlan.fields.recommended_method
        distinguishing_aspect: |
          On identical cost inputs the nominal variant makes removal cheaper (2,510,000,000 vs
          2,650,000,000) while the discounted variant makes closure-in-place cheaper (2,442,008,829 vs
          2,489,200,885). recommended_method reads the discounted variant only: its variance is 1.90%,
          inside the 5.00% tie band, so the answer is CLOSURE_IN_PLACE. An implementation that feeds the
          nominal pair into the same chain gets variance 5.28%, escapes the tie band, and the strict
          comparison then picks CLOSURE_BY_REMOVAL — the opposite method from the same payload.
        test_recipe:
          setup:
            - "One unit with clean siting attributes so no mandatory-removal clause fires"
            - "No stability assessment, no wells and no monitoring history are needed: both cost variants are computed at plan creation"
          setup_api_calls:
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0002", unit_name: "Ash Pond 2", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /ccr/closure-plans"
              payload: { unit_id: "${unit_id}", plan_code: "CP-0001", selected_method: "CLOSURE_IN_PLACE", in_place_capital_usd_cents: 2050000000, in_place_annual_care_usd_cents: 20000000, removal_capital_usd_cents: 2450000000, removal_annual_care_usd_cents: 2000000, care_period_years: 30 }
              as: UtilityAdmin
              captures: { plan_id: $.data.id }
          assert:
            - "ClosurePlan.${plan_id}.in_place_nominal_usd_cents == 2650000000"
            - "ClosurePlan.${plan_id}.removal_nominal_usd_cents == 2510000000"
            - "ClosurePlan.${plan_id}.in_place_pv_usd_cents == 2442008829"
            - "ClosurePlan.${plan_id}.removal_pv_usd_cents == 2489200885"
            - "ClosurePlan.${plan_id}.cost_variance_pct == 1.90"
            - "ClosurePlan.${plan_id}.recommended_method == CLOSURE_IN_PLACE"
            - "ClosurePlan.${plan_id}.in_place_nominal_usd_cents > ClosurePlan.${plan_id}.removal_nominal_usd_cents"
            - "ClosurePlan.${plan_id}.in_place_pv_usd_cents < ClosurePlan.${plan_id}.removal_pv_usd_cents"
            - "ClosurePlan.${plan_id}.status == DRAFT"

  - rule_id: combinatorial_formula
    instances:
      - name: care_stream_pv_rounds_each_year_before_summation
        grounds:
          - calculations.closure_cost_present_value
          - entities.ClosurePlan.fields.in_place_pv_usd_cents
          - entities.ClosurePlan.fields.removal_pv_usd_cents
          - entities.ClosurePlan.fields.cost_variance_pct
        distinguishing_aspect: |
          Mode (b) rounding-order sensitivity: the 30-year care stream must be discounted year by year
          with each year's factor rounded half-up to whole cents BEFORE the years are summed. Rounding
          once after summation yields 2,442,008,827 and 2,489,200,883 — both two cents low — so the
          exact literals 2,442,008,829 and 2,489,200,885 are only reachable by the pinned order.
        test_recipe:
          setup:
            - "One clean unit, no monitoring or stability history: the cost fields alone drive the calculation"
            - "Care stream 20,000,000 cents/year for in-place and 2,000,000 cents/year for removal over 30 years at the pinned 3% discount rate"
          setup_api_calls:
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0003", unit_name: "Ash Pond 3", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /ccr/closure-plans"
              payload: { unit_id: "${unit_id}", plan_code: "CP-0002", selected_method: "CLOSURE_IN_PLACE", in_place_capital_usd_cents: 2050000000, in_place_annual_care_usd_cents: 20000000, removal_capital_usd_cents: 2450000000, removal_annual_care_usd_cents: 2000000, care_period_years: 30 }
              as: UtilityAdmin
              captures: { plan_id: $.data.id }
          assert:
            - "ClosurePlan.${plan_id}.in_place_pv_usd_cents == 2442008829"
            - "ClosurePlan.${plan_id}.in_place_pv_usd_cents != 2442008827"
            - "ClosurePlan.${plan_id}.removal_pv_usd_cents == 2489200885"
            - "ClosurePlan.${plan_id}.removal_pv_usd_cents != 2489200883"
            - "ClosurePlan.${plan_id}.in_place_pv_usd_cents - ClosurePlan.${plan_id}.in_place_capital_usd_cents == 392008829"
            - "ClosurePlan.${plan_id}.cost_variance_pct == 1.90"

      - name: assurance_contingency_tier_keyed_on_base_not_on_total
        grounds:
          - calculations.corrective_action_assurance_amount
          - entities.MonitoringProgram.fields.assurance_amount_usd_cents
          - validations.priority_19_ERR_INVALID_PROGRAM_PHASE
        distinguishing_aspect: |
          Mode (c) intermediate-quantity reuse: the 20% contingency tier is selected from the base
          480,000,000 alone (below the 500,000,000 tier-1 ceiling). The 576,000,000 subtotal sits in the
          15% band, so an implementation that re-derives the tier from the subtotal or the total returns
          565,800,000 instead of the correct 590,400,000 — a 24,600,000-cent divergence.
        test_recipe:
          setup:
            - "Unit with a certified network of BG-01..BG-04 (BACKGROUND) and DG-01..DG-03 (DOWNGRADIENT)"
            - "One VALIDATED BACKGROUND round on 2025-06-01 carrying the four upgradient sulfate values 0.5000/0.6000/0.5500/0.5800 inside window 2025-01-01..2025-12-31"
            - "One VALIDATED DETECTION round on 2026-06-15 with DG-01 sulfate 0.9000, which yields SSI and moves the program to ASSESSMENT so assurance may be posted"
          setup_api_calls:
            - call: "POST /ccr/professionals"
              payload: { full_name: "Mia Chen", license_number: "HG-33003", license_state: "NC", discipline: "HYDROGEOLOGY" }
              as: UtilityAdmin
              captures: { hg_id: $.data.id }
            - call: "POST /ccr/professionals"
              payload: { full_name: "Rae Novak", license_number: "ST-44004", license_state: "NC", discipline: "STATISTICS" }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0004", unit_name: "Ash Pond 4", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { unit_id: $.data.id, prog_id: $.data.monitoring_program_id }
            - call: "POST /ccr/wells"
              payload: { unit_id: "${unit_id}", well_code: "BG-01", well_role: "BACKGROUND", aquifer_zone: "UPPER SAND", screen_top_ft: 22.00, screen_bottom_ft: 42.00, installed_on: "2024-06-01" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
              captures: { bg1_id: $.data.id }
            - call: "POST /ccr/wells"
              payload: { unit_id: "${unit_id}", well_code: "BG-02", well_role: "BACKGROUND", aquifer_zone: "UPPER SAND", screen_top_ft: 22.00, screen_bottom_ft: 42.00, installed_on: "2024-06-01" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
              captures: { bg2_id: $.data.id }
            - call: "POST /ccr/wells"
              payload: { unit_id: "${unit_id}", well_code: "BG-03", well_role: "BACKGROUND", aquifer_zone: "UPPER SAND", screen_top_ft: 22.00, screen_bottom_ft: 42.00, installed_on: "2024-06-01" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
              captures: { bg3_id: $.data.id }
            - call: "POST /ccr/wells"
              payload: { unit_id: "${unit_id}", well_code: "BG-04", well_role: "BACKGROUND", aquifer_zone: "UPPER SAND", screen_top_ft: 22.00, screen_bottom_ft: 42.00, installed_on: "2024-06-01" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
              captures: { bg4_id: $.data.id }
            - call: "POST /ccr/wells"
              payload: { unit_id: "${unit_id}", well_code: "DG-01", well_role: "DOWNGRADIENT", aquifer_zone: "UPPER SAND", screen_top_ft: 20.00, screen_bottom_ft: 40.00, installed_on: "2024-06-01" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
              captures: { dg1_id: $.data.id }
            - call: "POST /ccr/wells"
              payload: { unit_id: "${unit_id}", well_code: "DG-02", well_role: "DOWNGRADIENT", aquifer_zone: "UPPER SAND", screen_top_ft: 21.00, screen_bottom_ft: 41.00, installed_on: "2024-06-01" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
            - call: "POST /ccr/wells"
              payload: { unit_id: "${unit_id}", well_code: "DG-03", well_role: "DOWNGRADIENT", aquifer_zone: "UPPER SAND", screen_top_ft: 23.00, screen_bottom_ft: 43.00, installed_on: "2024-06-01" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
            - call: "PATCH /ccr/monitoring-programs/${prog_id}"
              payload: { comparison_basis: "INTERWELL", background_window_start_on: "2025-01-01", background_window_end_on: "2025-12-31" }
