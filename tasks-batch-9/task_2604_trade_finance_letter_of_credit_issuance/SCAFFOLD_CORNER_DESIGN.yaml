            - call: "POST /banks"
              payload: { bank_name: "Nordkyst Bank", swift_bic: "NDKBNOKK", country_code: "NO", country_risk_score: 12, credit_rating: "AA", confirmation_appetite_cents: 90000000 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { bank_id: $.data.id }
            - call: "POST /banks"
              payload: { bank_name: "Coastline Trade Bank", swift_bic: "CLTBSEXX", country_code: "SE", country_risk_score: 20, credit_rating: "A", confirmation_appetite_cents: 50000000 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { bank2_id: $.data.id }
            - call: "PATCH /banks/${bank2_id}"
              payload: { status: "SUSPENDED" }
              as: CreditOfficer
