    side_effects: ["schedule_status HELD->CONFIRMED", "clear hold_expires_at", "increments Booking.version by 1"]
  - method: POST
    path: "/studio/bookings/{id}/cancel"
    description: "cancel a HELD or CONFIRMED booking; computes refund, releases children"
    roles: [StudioManager, Client]
    code: 200
    input: []
    output: Booking
    side_effects: ["cancellation_refund calc", "create REFUND Payment with refund_destination=WALLET (credits Client.wallet_credit_cents)", "release GearRental + EngineerAssignment children", "settlement_status->REFUNDING->REFUNDED", "schedule_status->CANCELLED", "increments Booking.version by 1"]
  - method: POST
    path: "/studio/bookings/{id}/check-in"
    description: "begin the session (CONFIRMED->IN_SESSION)"
    roles: [StudioManager]
    code: 200
    input: []
    output: Booking
    side_effects: ["schedule_status CONFIRMED->IN_SESSION", "increments Booking.version by 1"]
  - method: POST
    path: "/studio/bookings/{id}/check-out"
    description: "end the session; record overtime, reconcile total, move settlement to BALANCE_DUE"
    roles: [StudioManager]
    code: 200
    input: [actual_end_at]
    output: Booking
    side_effects: ["create OvertimeRecord (overtime_surcharge calc)", "finalize EngineerAssignment.billed_hours/charge_cents (engineering_charge final variant)", "recompute total_charge_cents", "settlement_status DEPOSIT_PAID->BALANCE_DUE", "schedule_status IN_SESSION->COMPLETED", "increments Booking.version by 1"]
  # ---- Payments ----
  - method: POST
    path: "/studio/bookings/{id}/payments"
    description: "record a DEPOSIT, BALANCE, or REFUND payment against the booking"
    roles: [StudioManager, Client]
    code: 201
    input: ["kind", "amount_cents", "refund_destination?"]
    output: Payment
    side_effects: ["recompute Booking.amount_paid_cents", "DEPOSIT: settlement AWAITING_DEPOSIT->DEPOSIT_PAID", "BALANCE: waterfall wallet then external, settlement BALANCE_DUE->SETTLED, decrement Client.wallet_credit_cents", "increments Booking.version by 1"]
