      - name: escalate_then_reassign_root_cause_restores_the_complaint_bucket_partition
        grounds:
          - state_machines.Complaint.RECEIVED_to_ROOT_CAUSE_ASSIGNED
          - state_machines.Complaint.ROOT_CAUSE_ASSIGNED_to_ESCALATED
          - state_machines.Complaint.ESCALATED_to_ROOT_CAUSE_ASSIGNED
          - calculations.complaint_rate_bps
          - calculations.oversight_posture_computation
          - entities.Partner.fields.open_complaint_count
        distinguishing_aspect: |
          The conserved quantity is a record_count partition: at every step the
          four disjoint Partner complaint counters (open, escalated, resolved,
          withdrawn) must sum to total_complaint_count = 2, and the invariant is
          exercised across a CYCLIC path - a complaint goes
          ROOT_CAUSE_ASSIGNED -> ESCALATED -> ROOT_CAUSE_ASSIGNED, which moves
          one unit out of the open bucket and back in while
