      - name: utility_account_with_an_unknown_provider_fk_is_rejected
        claim_type: parent_relationships
        grounds:
          - validations[priority=11]
          - errors[ERR_REFERENCE_NOT_FOUND]
          - endpoints[POST /utility-accounts]
        distinguishing_aspect: |
          Under the flat topology every association is an explicit body FK, so a well-formed
          UtilityAccount naming a non-existent service_provider_id fails the body-FK gate with
          ERR_REFERENCE_NOT_FOUND (404) at priority 11 — before the priority-71 municipality
          cross-check the missing provider could never satisfy.
