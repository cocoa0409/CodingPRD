  instances:
  - name: machine_window_half_open_with_changeover_buffer
    grounds:
    - calculations.machine_window_occupancy
    - validations[priority=78]
    - errors[ERR_MACHINE_WINDOW_CONFLICT]
    - entities.WorkOrder.fields.scheduled_end_at
    distinguishing_aspect: |
      Machine occupancy uses HALF-OPEN intervals plus a conditional 45-minute changeover buffer keyed on a bar-diameter change: a 12.7 mm job ending 14:00 blocks a 16.0 mm job starting 14:30 but not one starting exactly 14:45, because the buffer extends only the earlier interval's end and adjacency is legal.
