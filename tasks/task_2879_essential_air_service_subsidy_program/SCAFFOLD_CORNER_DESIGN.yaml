            - "Both proposals score subsidy_points 100.0000 (each is its own best_spp) and service_points 100.0000 (13/12 clamps at 1.0), so both composites are round(0.40*0.0000 + 0.35*100.0000 + 0.25*100.0000, 4) == 60.0000"
