          assert:
            - "First call 201: PacContribution.${contrib1_id}.support_score == 80.50, max_allowed_cents == 250000, amount_cents == 250000, status == PENDING_BOARD"
            - "Candidate.${cand_id}.latest_support_score == 80.50 and pending_support_cents == 250000"
            - "Second call 422 with error_id ERR_CONTRIBUTION_LIMIT_EXCEEDED: remaining_cents == 250000 (500000 - the 250000 already held by the PENDING_BOARD row) and 250001 > 250000"
