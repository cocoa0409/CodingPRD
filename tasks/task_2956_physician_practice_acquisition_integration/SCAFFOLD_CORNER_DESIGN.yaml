            - "Physician.${phys_id}.employment_status == OFFERED"
            - "a sibling plan at base_salary_cents 36100000 computes benchmark_percentile == 90.03 and its APPROVED request returns ERR_COMP_EXCEEDS_FMV_SAFE_HARBOR (422)"
            - "that same 36100000 plan is approvable once fmv_justification_on_file is true, which is the documented escape from the rule"

      - name: license_expiring_exactly_today_satisfies_the_license_rule
        claim_type: Satisfaction → Pass
        grounds:
