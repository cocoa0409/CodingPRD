          - errors.ERR_COLLECTIONS_THRESHOLD_NOT_MET
        distinguishing_aspect: "The same DELINQUENT agreement is offered to the billing partner one day apart: at 2026-11-03 the arrears are 59 days old and the placement is refused with ERR_COLLECTIONS_THRESHOLD_NOT_MET, and at 2026-11-04 they are exactly 60 - the COLLECTIONS_DAYS_THRESHOLD - so the >= comparison lets it through and appends a SYSTEM COLLECTION_PLACED row of amount 0."
