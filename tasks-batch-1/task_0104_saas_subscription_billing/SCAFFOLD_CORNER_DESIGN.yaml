# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over the §1.1-§1.7 surface that §1.8 does not already cover.
# section: / claim_type: come from references/claim-extraction-guide.md.
# Every setup_api_calls chain drives empty-DB -> precondition via §1.5 only;
# every ${var} bound by an earlier captures:; formula asserts pre-computed.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_plan_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Plan, "endpoints[\"POST /plans\"]"]
        distinguishing_aspect: "POST /plans with all required fields -> 201; response carries server-minted id, version==1, status defaulting to ACTIVE."
        test_recipe:
          setup: ["Empty DB; acting as BillingAdmin"]
          setup_api_calls: []
          trigger:
            - call: "POST /plans"
              payload: { tier: "BASIC", monthly_fee_cents: 3000, included_usage_units: 1000, overage_tiers: [{ up_to_units: null, rate_cents_per_unit: 1 }], trial_days: 7 }
              as: BillingAdmin
              captures: { plan_id: $.data.id, ver: $.data.version, st: $.data.status }
          assert:
            - "HTTP status == 201"
            - "Plan.${plan_id}.status == ACTIVE"
            - "Plan.${plan_id}.version == 1"

      - name: create_plan_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Plan.fields.monthly_fee_cents, "errors[ERR_INVALID_REQUEST]", "validations[priority=5]"]
        distinguishing_aspect: "POST /plans omitting monthly_fee_cents -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB; acting as BillingAdmin"]
          setup_api_calls: []
          trigger:
            - call: "POST /plans"
              payload: { tier: "BASIC", included_usage_units: 1000, overage_tiers: [{ up_to_units: null, rate_cents_per_unit: 1 }] }
              as: BillingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: create_plan_default_trial_days_zero_when_omitted
        claim_type: Defaults
        grounds: [entities.Plan.fields.trial_days, "endpoints[\"POST /plans\"]"]
        distinguishing_aspect: "Omitting trial_days defaults it to 0 (subscriptions then start ACTIVE immediately)."
        test_recipe:
          setup: ["Empty DB; acting as BillingAdmin"]
          setup_api_calls: []
          trigger:
            - call: "POST /plans"
              payload: { tier: "PRO", monthly_fee_cents: 9000, included_usage_units: 1000, overage_tiers: [{ up_to_units: null, rate_cents_per_unit: 1 }] }
              as: BillingAdmin
              captures: { plan_id: $.data.id, td: $.data.trial_days }
          assert:
            - "Plan.${plan_id}.trial_days == 0"

      - name: get_plan_nonexistent_id_returns_not_found
        claim_type: Not Found
        grounds: [entities.Plan, "errors[ERR_NOT_FOUND]", "endpoints[\"GET /plans/{id}\"]"]
        distinguishing_aspect: "GET /plans/{id} with a fabricated UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB; acting as BillingAdmin"]
          setup_api_calls: []
          trigger:
            - call: "GET /plans/00000000-0000-4000-8000-000000000001"
              as: BillingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response error_id == ERR_NOT_FOUND"

      - name: create_account_resolves_tax_jurisdiction_from_region_code
        claim_type: Computed Fields
        grounds: [entities.Account.fields.tax_jurisdiction_id, entities.Account.fields.region_code, "endpoints[\"POST /accounts\"]"]
        distinguishing_aspect: "POST /accounts with region_code US-CA resolves tax_jurisdiction_id to the matching jurisdiction's id; mrr_cents defaults to 0."
        test_recipe:
          setup: ["TaxJurisdiction US-CA exists"]
          setup_api_calls:
            - call: "POST /tax-jurisdictions"
              payload: { region_code: "US-CA", tax_rate_bps: 875 }
              as: BillingAdmin
              captures: { jur_id: $.data.id }
          trigger:
            - call: "POST /accounts"
              payload: { email: "comp@x.com", company_name: "CompCo", region_code: "US-CA" }
              as: Anonymous
              captures: { acct_id: $.data.id, tj: $.data.tax_jurisdiction_id, mrr: $.data.mrr_cents }
          assert:
            - "Account.${acct_id}.tax_jurisdiction_id == ${jur_id}"
            - "Account.${acct_id}.mrr_cents == 0"

      - name: create_account_unknown_region_code_returns_jurisdiction_not_found
        claim_type: Type Constraints
        grounds: [entities.Account.fields.region_code, "errors[ERR_JURISDICTION_NOT_FOUND]", "validations[priority=8]"]
        distinguishing_aspect: "POST /accounts with a region_code that has no TaxJurisdiction -> ERR_JURISDICTION_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB (no jurisdictions)"]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { email: "nojur@x.com", company_name: "NoJur", region_code: "US-ZZ" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response error_id == ERR_JURISDICTION_NOT_FOUND"

      - name: duplicate_account_email_returns_duplicate
        claim_type: Type Constraints
        grounds: [entities.Account.fields.email, "errors[ERR_DUPLICATE]", "validations[priority=6]"]
        distinguishing_aspect: "A second POST /accounts with an already-used email -> ERR_DUPLICATE (409)."
        test_recipe:
          setup: ["US-CA jurisdiction; one account with email dup@x.com"]
          setup_api_calls:
            - call: "POST /tax-jurisdictions"
              payload: { region_code: "US-CA", tax_rate_bps: 875 }
              as: BillingAdmin
            - call: "POST /accounts"
              payload: { email: "dup@x.com", company_name: "First", region_code: "US-CA" }
              as: Anonymous
          trigger:
            - call: "POST /accounts"
              payload: { email: "dup@x.com", company_name: "Second", region_code: "US-CA" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response error_id == ERR_DUPLICATE"

      - name: usage_record_immutable_entity_has_no_version
        claim_type: Immutability
        grounds: [entities.UsageRecord, entities.UsageRecord.fields.billed]
        distinguishing_aspect: "UsageRecord has common_fields:false — it exposes id and created_at but no version/updated_at; it is append-only and never updated."
        test_recipe:
          setup: ["US-CA jurisdiction; BASIC plan trial_days 0; account with an ACTIVE subscription"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /tax-jurisdictions"
              payload: { region_code: "US-CA", tax_rate_bps: 875 }
              as: BillingAdmin
            - call: "POST /plans"
              payload: { tier: "BASIC", monthly_fee_cents: 3000, included_usage_units: 1000, overage_tiers: [{ up_to_units: null, rate_cents_per_unit: 1 }], trial_days: 0 }
              as: BillingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "imm@x.com", company_name: "ImmCo", region_code: "US-CA" }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/subscriptions/${sub_id}/usage"
              payload: { units: 50, recorded_at: "2026-06-05T00:00:00Z" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { ur_id: $.data.id, billed: $.data.billed }
          assert:
            - "HTTP status == 201"
            - "UsageRecord.${ur_id}.billed == false"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_already_canceled_subscription_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Subscription.lifecycle_status.ACTIVE_to_CANCELED, "errors[ERR_INVALID_STATE]", "endpoints[\"POST /accounts/{id}/subscriptions/{sid}/cancel\"]"]
        distinguishing_aspect: "Cancelling a subscription already in CANCELED (terminal) -> ERR_INVALID_STATE (409); no side effects re-fire."
        test_recipe:
          setup: ["US-CA; BASIC plan trial_days 0; ACTIVE subscription then CANCELED"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /tax-jurisdictions"
              payload: { region_code: "US-CA", tax_rate_bps: 875 }
              as: BillingAdmin
            - call: "POST /plans"
              payload: { tier: "BASIC", monthly_fee_cents: 3000, included_usage_units: 1000, overage_tiers: [{ up_to_units: null, rate_cents_per_unit: 1 }], trial_days: 0 }
              as: BillingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "cc@x.com", company_name: "CcCo", region_code: "US-CA" }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions/${sub_id}/cancel"
              as: AccountOwner
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /accounts/${acct_id}/subscriptions/${sub_id}/cancel"
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response error_id == ERR_INVALID_STATE"

      - name: convert_non_trialing_subscription_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Subscription.lifecycle_status.TRIALING_to_ACTIVE, "errors[ERR_INVALID_STATE]", "endpoints[\"POST /accounts/{id}/subscriptions/{sid}/convert\"]"]
        distinguishing_aspect: "Converting a subscription that is already ACTIVE (created on a trial_days=0 plan) -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["US-CA; BASIC plan trial_days 0; subscription already ACTIVE"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /tax-jurisdictions"
              payload: { region_code: "US-CA", tax_rate_bps: 875 }
              as: BillingAdmin
            - call: "POST /plans"
              payload: { tier: "BASIC", monthly_fee_cents: 3000, included_usage_units: 1000, overage_tiers: [{ up_to_units: null, rate_cents_per_unit: 1 }], trial_days: 0 }
              as: BillingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "cv@x.com", company_name: "CvCo", region_code: "US-CA" }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/subscriptions/${sub_id}/convert"
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response error_id == ERR_INVALID_STATE"

      - name: new_subscription_with_trial_starts_in_trialing
        claim_type: Initial State
        grounds: [state_machines.Subscription.lifecycle_status.TRIALING_to_ACTIVE, entities.Subscription.fields.lifecycle_status, "endpoints[\"POST /accounts/{id}/subscriptions\"]"]
        distinguishing_aspect: "Creating a subscription on a plan with trial_days>0 starts lifecycle_status=TRIALING with billing_status=CURRENT and no invoice generated."
        test_recipe:
          setup: ["US-CA; PRO plan trial_days 14"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /tax-jurisdictions"
              payload: { region_code: "US-CA", tax_rate_bps: 875 }
              as: BillingAdmin
            - call: "POST /plans"
              payload: { tier: "PRO", monthly_fee_cents: 9000, included_usage_units: 1000, overage_tiers: [{ up_to_units: null, rate_cents_per_unit: 1 }], trial_days: 14 }
              as: BillingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "tr@x.com", company_name: "TrCo", region_code: "US-CA" }
              as: Anonymous
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id, life: $.data.lifecycle_status, bill: $.data.billing_status }
            - call: "GET /accounts/${acct_id}/invoices"
              as: AccountOwner
              as_user_id: "${acct_id}"
          assert:
            - "Subscription.${sub_id}.lifecycle_status == TRIALING"
            - "Subscription.${sub_id}.billing_status == CURRENT"
            - "GET /accounts/${acct_id}/invoices returns an empty list (total_count == 0)"

      - name: close_account_with_settled_subscription_succeeds
        claim_type: Valid Transition
        grounds: [state_machines.Account.status.ACTIVE_to_CLOSED, entities.Account.fields.status, "endpoints[\"POST /accounts/{id}/close\"]"]
        distinguishing_aspect: "Account ACTIVE->CLOSED succeeds when its only subscription is CANCELED and no invoice is OPEN/PAST_DUE; mrr_cents set to 0."
        test_recipe:
          setup: ["US-CA; BASIC plan trial_days 0; payment_method_ok=true so the first invoice is PAID (terminal); subscription then CANCELED"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /tax-jurisdictions"
              payload: { region_code: "US-CA", tax_rate_bps: 875 }
              as: BillingAdmin
            - call: "POST /plans"
              payload: { tier: "BASIC", monthly_fee_cents: 3000, included_usage_units: 1000, overage_tiers: [{ up_to_units: null, rate_cents_per_unit: 1 }], trial_days: 0 }
              as: BillingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "clok@x.com", company_name: "Clok", region_code: "US-CA", payment_method_ok: true }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions/${sub_id}/cancel"
              as: AccountOwner
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /accounts/${acct_id}/close"
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { st: $.data.status, mrr: $.data.mrr_cents }
          assert:
            - "HTTP status == 200"
            - "Account.${acct_id}.status == CLOSED"
            - "Account.${acct_id}.mrr_cents == 0"

      - name: cancel_pause_window_then_overlapping_window_allowed
        claim_type: Valid Transition
        grounds: [state_machines.SubscriptionPauseWindow.status.SCHEDULED_to_CANCELED, entities.SubscriptionPauseWindow.fields.status, "endpoints[\"DELETE /accounts/{id}/subscriptions/{sid}/pause-windows/{pwid}\"]"]
        distinguishing_aspect: "Cancelling a SCHEDULED pause window frees the timeline so a previously-conflicting window can then be scheduled."
        test_recipe:
          setup: ["US-CA; BASIC plan trial_days 0; ACTIVE subscription with a SCHEDULED pause window [2026-06-01,2026-06-10)"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /tax-jurisdictions"
              payload: { region_code: "US-CA", tax_rate_bps: 875 }
              as: BillingAdmin
            - call: "POST /plans"
              payload: { tier: "BASIC", monthly_fee_cents: 3000, included_usage_units: 1000, overage_tiers: [{ up_to_units: null, rate_cents_per_unit: 1 }], trial_days: 0 }
              as: BillingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "pwc@x.com", company_name: "PwcCo", region_code: "US-CA" }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions/${sub_id}/pause-windows"
              payload: { pause_from: "2026-06-01T00:00:00Z", pause_to: "2026-06-10T00:00:00Z" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { pw_id: $.data.id }
          trigger:
            - call: "DELETE /accounts/${acct_id}/subscriptions/${sub_id}/pause-windows/${pw_id}"
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { st: $.data.status }
            - call: "POST /accounts/${acct_id}/subscriptions/${sub_id}/pause-windows"
              payload: { pause_from: "2026-06-05T00:00:00Z", pause_to: "2026-06-12T00:00:00Z" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { pw2_id: $.data.id }
          assert:
            - "SubscriptionPauseWindow.${pw_id}.status == CANCELED"
            - "The second pause window create returns HTTP 201"

      - name: dunning_exhaustion_cancel_cascade
        claim_type: Cascade down
        grounds: [state_machines.Subscription.lifecycle_status.ACTIVE_to_CANCELED, state_machines.Invoice.status.PAST_DUE_to_VOID]
        excluded_because:
          difficulty_instance: transitive_cascade / dunning_exhaustion_cascade_depth3_billing_lifecycle_mrr
          rationale: "The dunning-exhaustion cascade (billing UNPAID -> lifecycle CANCELED -> invoice VOID -> MRR recompute) is asserted in full by the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: first_invoice_fixed_once_coupon_discount_then_tax
        claim_type: Correct Result
        grounds: [calculations.invoice_finalize_total, entities.Coupon.fields.duration, entities.Invoice.fields.total_cents]
        distinguishing_aspect: "First BASIC(3000) invoice with FIXED ONCE coupon FLAT500: discount 500 -> taxable 2500 -> CA tax 219 -> total 2719."
        test_recipe:
          setup: ["US-CA (875 bps); BASIC plan fee 3000 trial_days 0; FIXED ONCE coupon FLAT500 (amount_off 500)"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /tax-jurisdictions"
              payload: { region_code: "US-CA", tax_rate_bps: 875 }
              as: BillingAdmin
            - call: "POST /plans"
              payload: { tier: "BASIC", monthly_fee_cents: 3000, included_usage_units: 1000, overage_tiers: [{ up_to_units: null, rate_cents_per_unit: 1 }], trial_days: 0 }
              as: BillingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /coupons"
              payload: { code: "FLAT500", discount_type: "FIXED", amount_off_cents: 500, duration: "ONCE", max_redemptions: 10 }
              as: BillingAdmin
              captures: { coupon_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "fix@x.com", company_name: "FixCo", region_code: "US-CA" }
              as: Anonymous
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { plan_id: "${plan_id}", coupon_id: "${coupon_id}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
            - call: "GET /accounts/${acct_id}/invoices"
              as: AccountOwner
              as_user_id: "${acct_id}"
          assert:
            - "The first Invoice has subtotal_cents == 3000, discount_cents == 500, tax_cents == 219, total_cents == 2719"

      - name: per_jurisdiction_tax_ny_rate_applied
        claim_type: Constants Applied
        grounds: [calculations.invoice_finalize_total, entities.TaxJurisdiction.fields.tax_rate_bps, entities.Invoice.fields.tax_cents]
        distinguishing_aspect: "A US-NY (400 bps) account's first PRO(9000) invoice has tax_cents 360 (vs 788 for US-CA) — jurisdiction rate snapshot is applied."
        test_recipe:
          setup: ["US-NY (400 bps); PRO plan fee 9000 trial_days 0; account in US-NY"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /tax-jurisdictions"
              payload: { region_code: "US-NY", tax_rate_bps: 400 }
              as: BillingAdmin
            - call: "POST /plans"
              payload: { tier: "PRO", monthly_fee_cents: 9000, included_usage_units: 1000, overage_tiers: [{ up_to_units: null, rate_cents_per_unit: 1 }], trial_days: 0 }
              as: BillingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "ny@x.com", company_name: "NyCo", region_code: "US-NY" }
              as: Anonymous
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
            - call: "GET /accounts/${acct_id}/invoices"
              as: AccountOwner
              as_user_id: "${acct_id}"
          assert:
            - "The first Invoice has subtotal_cents == 9000, discount_cents == 0, tax_cents == 360, total_cents == 9360"

      - name: usage_outside_period_excluded_from_overage
        claim_type: Input Set Filtering
        grounds: [calculations.usage_overage_charge, entities.UsageRecord.fields.recorded_at, "validations[priority=12]", "errors[ERR_USAGE_OUT_OF_PERIOD]"]
        distinguishing_aspect: "A usage event with recorded_at outside [period_start, period_end) is rejected with ERR_USAGE_OUT_OF_PERIOD, so it never enters the overage sweep."
        test_recipe:
          setup: ["US-CA; PRO plan trial_days 14; subscription converted ACTIVE with period 2026-06-01..2026-07-01"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /tax-jurisdictions"
              payload: { region_code: "US-CA", tax_rate_bps: 875 }
              as: BillingAdmin
            - call: "POST /plans"
              payload: { tier: "PRO", monthly_fee_cents: 9000, included_usage_units: 1000, overage_tiers: [{ up_to_units: null, rate_cents_per_unit: 1 }], trial_days: 14 }
              as: BillingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "oop@x.com", company_name: "OopCo", region_code: "US-CA" }
              as: Anonymous
