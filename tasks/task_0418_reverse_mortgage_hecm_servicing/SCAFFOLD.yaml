# =============================================================================
# Reverse Mortgage / HECM Servicing (HUD/FHA) — Benchmark Seed Tables (Expert)
# =============================================================================

scenario: |
  418. Reverse Mortgage / HECM Servicing (HUD/FHA): borrower age & principal-limit
  factor, draw type (lump/line/tenure/term), MIP accrual & loan-balance growth,
  annual occupancy certification, property-charge set-aside (LESA), maturity event
  & due-and-payable, non-borrowing-spouse deferral, foreclosure/short-sale

domain_name: reverse-mortgage-hecm-servicing
api_prefix: ""   # flat topology: peer collections (/loans, /borrowers, /disbursements, ...) live at the root

# -----------------------------------------------------------------------------
# Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: compliance_audit          # HUD/FHA-constrained servicing with regulated lifecycle gates
  secondary_archetype: ledger_reconciliation   # forward-looking payoff quote vs chronological accrual ledger
  complexity_layers:
    - cascading_side_effects                   # maturity → due-and-payable → NBS deferral → cancel draws
    - dual_variant_calculation                 # accrual (compounded) vs payoff-quote (projected) on Loan; LESA fully- vs partially-funded
    - rate_threshold_triggers                  # age >= 62, available-line == 0, LESA residual == 0
    - derived_field_reconciliation             # available_line_of_credit / loan balance kept consistent with ledger
    - optimistic_concurrency                   # OCC on Loan.version for line draws that legitimately supersede

  entity_topology: flat
  # Peer entities linked by foreign keys; no deep URL nesting. Loan is the hub;
  # Borrower, Disbursement, LesaSetAside, OccupancyCertification, MaturityEvent,
  # NonBorrowingSpouseDeferral, Resolution, PropertyChargePayment, LedgerEntry all
  # reference Loan (or Borrower) by FK and are reached via filtered-list GETs.

  state_machine_shape: parallel
  # Loan carries two independent state axes (servicing_status x disposition_status);
  # OccupancyCertification is cyclic; Disbursement and Resolution branch (fork-join).

  relationship_patterns:
    - one_to_many        # Loan has many Disbursements, OccupancyCertifications, PropertyChargePayments, LedgerEntries
    - cross_aggregate    # NonBorrowingSpouseDeferral references MaturityEvent and Borrower across aggregate lines
    - polymorphic        # LedgerEntry.source_ref_id references Disbursement | PropertyChargePayment | system accrual

  role_model: peer_roles
  # ServicerOps (originate/service), ComplianceOfficer (occupancy/maturity/deferral/resolution decisions),
  # Borrower (entity-backed self-service draws + self-certify), HudAuditor (read-only + audit recompute), System (clock/automation).

  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — emitted verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Lender
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Servicer / lender display name" }
      - { name: hud_lending_limit_cents, type: integer, source: input, description: "FHA national HECM lending limit (max claim ceiling), in cents", constraints: "> 0" }
      - { name: clock_utc, type: datetime, source: system, description: "Lender-scoped simulated current UTC; advanced only via POST /loans/_clock/set; ISO 8601, three fractional digits", default: "1970-01-01T00:00:00.000Z" }

  - name: PrincipalLimitFactor
    parent: null
    common_fields: false
    fields:
      - { name: lender_id, type: string, source: input, description: "FK -> Lender.id; PLF table owner" }
      - { name: age, type: integer, source: input, description: "Youngest-borrower age this factor applies to", constraints: "62..150" }
      - { name: expected_rate_bps, type: integer, source: input, description: "Expected-rate bucket in basis points this factor applies to (e.g., 500 = 5.00%)", constraints: ">= 0" }
      - { name: factor_micros, type: integer, source: input, description: "Principal-limit factor expressed in micros (0.5230 -> 523000); fraction of max-claim-amount lendable", constraints: "1..1000000" }

  - name: Borrower
    parent: null
    common_fields: true
    fields:
      - { name: lender_id, type: string, source: system, description: "FK -> Lender.id; servicing portfolio owner" }
      - { name: full_name, type: string, source: input, description: "Borrower legal name" }
      - { name: birthdate, type: string, source: input, description: "Borrower date of birth, YYYY-MM-DD" }
      - { name: is_non_borrowing_spouse, type: boolean, source: input, default: false, description: "True if this person is a non-borrowing spouse rather than a borrower" }
      - { name: nbs_qualifies, type: boolean, source: input, default: false, description: "True if NBS satisfied HUD eligibility (married at origination, principal residence, named on loan)" }
      - { name: occupancy_status, type: enum, source: system, default: "OCCUPYING", description: "OCCUPYING | VACATED | DECEASED; set by occupancy cert and maturity events" }

  - name: Loan
    parent: null
    common_fields: true
    fields:
      - { name: lender_id, type: string, source: system, description: "FK -> Lender.id; servicing portfolio owner" }
      - { name: borrower_id, type: string, source: input, description: "FK -> Borrower.id; the (youngest) borrower of record" }
      - { name: non_borrowing_spouse_id, type: string, source: input, required: false, description: "FK -> Borrower.id; optional NBS on the loan (must have is_non_borrowing_spouse=true)" }
      - { name: appraised_value_cents, type: integer, source: input, description: "Appraised property value at origination, in cents", constraints: "> 0" }
      - { name: expected_rate_bps, type: integer, source: input, description: "Expected interest rate at origination in basis points; selects PLF bucket and drives growth", constraints: ">= 0" }
      - { name: annual_mip_rate_bps, type: integer, source: input, default: 50, description: "Ongoing annual MIP rate in basis points (HUD 0.50% = 50 bps)", constraints: ">= 0" }
      - { name: draw_type, type: enum, source: input, description: "LUMP_SUM | LINE_OF_CREDIT | TENURE | TERM; set at origination, immutable" }
      - { name: tenure_term_months, type: integer, source: input, required: false, description: "For TERM draw type: number of monthly payment months; null otherwise", constraints: ">= 1 when draw_type=TERM" }
      - { name: max_claim_amount_cents, type: integer, source: computed, description: "min(appraised_value_cents, lender.hud_lending_limit_cents)" }
      - { name: principal_limit_factor_micros, type: integer, source: computed, description: "PLF resolved from youngest borrower age + expected_rate_bps bucket at origination" }
      - { name: gross_principal_limit_cents, type: integer, source: computed, description: "round_half_up(max_claim_amount_cents * principal_limit_factor_micros / 1_000_000)" }
      - { name: lesa_set_aside_cents, type: integer, source: computed, default: 0, description: "Total LESA carved from the principal limit (0 if no LESA)" }
      - { name: net_principal_limit_cents, type: integer, source: computed, description: "gross_principal_limit_cents - lesa_set_aside_cents - initial_financed_costs_cents at origination event (conserved-capacity baseline)" }
      - { name: initial_financed_costs_cents, type: integer, source: input, default: 0, description: "Closing costs + initial MIP financed into the loan at origination", constraints: ">= 0" }
      - { name: principal_balance_cents, type: integer, source: computed, default: 0, description: "Current outstanding loan balance (advances + accrued interest + accrued MIP)" }
      - { name: available_line_of_credit_cents, type: integer, source: computed, default: 0, description: "Undrawn growing line of credit (LINE_OF_CREDIT only); grows at the loan growth rate" }
      - { name: monthly_payment_cents, type: integer, source: computed, default: 0, description: "Scheduled monthly disbursement for TENURE/TERM draw types" }
      - { name: months_elapsed, type: integer, source: system, default: 0, description: "Whole servicing months posted since origination via accrual posting" }
      - { name: servicing_status, type: enum, source: system, default: "CURRENT", description: "CURRENT | DELINQUENT_OCCUPANCY | DELINQUENT_PROPERTY_CHARGE; axis 1 (independent of disposition_status)" }
      - { name: disposition_status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | DUE_AND_PAYABLE | DEFERRED | IN_RESOLUTION | TERMINATED; axis 2 (independent of servicing_status)" }
      - { name: origination_date, type: string, source: system, required: false, description: "UTC date origination posted; null until ORIGINATED" }

  - name: Disbursement
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; the loan being drawn against" }
      - { name: kind, type: enum, source: input, description: "INITIAL | LINE_DRAW | SCHEDULED; INITIAL=origination advance, LINE_DRAW=ad hoc credit-line draw, SCHEDULED=tenure/term monthly payment" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Amount the borrower requests to draw, in cents", constraints: "> 0" }
      - { name: approved_amount_cents, type: integer, source: computed, default: 0, description: "Amount approved (== requested on approval; 0 if rejected)" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED | APPROVED | DISBURSED | REJECTED | VOIDED" }

  - name: LesaSetAside
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; the loan this set-aside funds" }
      - { name: funding_mode, type: enum, source: input, description: "FULLY_FUNDED | PARTIALLY_FUNDED; servicer pays charges directly vs semi-annual disbursement to borrower" }
      - { name: annual_property_charge_cents, type: integer, source: input, description: "Estimated annual property charges (taxes+insurance) used to size the set-aside", constraints: "> 0" }
      - { name: life_expectancy_years, type: integer, source: input, description: "HUD life-expectancy set-aside horizon in whole years", constraints: ">= 1" }
      - { name: initial_amount_cents, type: integer, source: computed, description: "Total LESA carved from principal limit (sized by funding_mode)" }
      - { name: drawn_cents, type: integer, source: computed, default: 0, description: "Cumulative LESA paid out via PropertyChargePayments (conserved-pool counter)" }
      - { name: remaining_cents, type: integer, source: computed, description: "initial_amount_cents - drawn_cents (LESA pool residual)" }
      - { name: status, type: enum, source: system, default: "FUNDED", description: "FUNDED | EXHAUSTED; EXHAUSTED when remaining_cents == 0" }

  - name: PropertyChargePayment
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; loan whose property charges are being paid" }
      - { name: lesa_set_aside_id, type: string, source: input, description: "FK -> LesaSetAside.id; the LESA pool drawn from" }
      - { name: charge_type, type: enum, source: input, description: "PROPERTY_TAX | HAZARD_INSURANCE; the coverage being paid" }
      - { name: coverage_start, type: string, source: input, description: "Coverage window start (inclusive), YYYY-MM-DD" }
      - { name: coverage_end, type: string, source: input, description: "Coverage window end (exclusive), YYYY-MM-DD; half-open [start,end)" }
      - { name: amount_cents, type: integer, source: input, description: "Charge amount paid from LESA, in cents", constraints: "> 0" }
      - { name: status, type: enum, source: system, default: "POSTED", description: "POSTED | REVERSED" }

  - name: OccupancyCertification
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; loan being certified" }
      - { name: certification_year, type: integer, source: input, description: "Annual certification period (whole year index since origination, 1-based)", constraints: ">= 1" }
      - { name: due_date, type: string, source: system, description: "UTC date by which this year's certification is due (origination anniversary + year)" }
      - { name: certified_at, type: datetime, source: system, required: false, description: "When borrower attested; null until CERTIFIED" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | CERTIFIED | DELINQUENT; cycles PENDING->DELINQUENT->CERTIFIED and re-opens PENDING next year" }

  - name: MaturityEvent
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; loan that has matured" }
      - { name: event_type, type: enum, source: input, description: "BORROWER_DEATH | PERMANENT_VACANCY | SALE_OF_PROPERTY | TAX_INSURANCE_DEFAULT; the maturity / due-and-payable trigger" }
      - { name: event_date, type: string, source: input, description: "Date the maturity event occurred, YYYY-MM-DD" }
      - { name: status, type: enum, source: system, default: "RECORDED", description: "RECORDED | ACKNOWLEDGED; ACKNOWLEDGED once compliance issues the due-and-payable notice" }

  - name: NonBorrowingSpouseDeferral
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; loan whose due-and-payable is deferred" }
      - { name: borrower_id, type: string, source: input, description: "FK -> Borrower.id; the eligible non-borrowing spouse" }
      - { name: maturity_event_id, type: string, source: input, description: "FK -> MaturityEvent.id; the BORROWER_DEATH event that opened deferral eligibility" }
      - { name: period_start, type: string, source: system, description: "Deferral window start (inclusive) == maturity_event.event_date" }
      - { name: period_end, type: string, source: system, required: false, description: "Deferral window end (exclusive); null while ACTIVE, set on termination" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | TERMINATED; ACTIVE freezes disposition; TERMINATED re-opens due-and-payable" }

  - name: Resolution
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; loan being resolved after due-and-payable" }
      - { name: path, type: enum, source: input, description: "PAYOFF | SHORT_SALE | FORECLOSURE; the disposition path elected" }
      - { name: appraised_at_resolution_cents, type: integer, source: input, required: false, description: "Re-appraised value at resolution (required for SHORT_SALE deficiency math), in cents", constraints: "> 0" }
      - { name: payoff_amount_cents, type: integer, source: computed, description: "Lesser-of payoff: min(principal_balance_cents, 95% of appraised value) for non-recourse settlement" }
      - { name: deficiency_cents, type: integer, source: computed, default: 0, description: "Non-recourse deficiency absorbed by FHA insurance (principal_balance - payoff_amount)" }
      - { name: status, type: enum, source: system, default: "INITIATED", description: "INITIATED | SETTLED | CANCELLED" }

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; loan this ledger row belongs to" }
      - { name: entry_type, type: enum, source: system, description: "ADVANCE | INTEREST_ACCRUAL | MIP_ACCRUAL | LESA_DRAW | REVERSAL; the kind of balance movement" }
      - { name: source_ref_id, type: string, source: system, required: false, description: "Polymorphic ref to the originating Disbursement.id or PropertyChargePayment.id, or null for system accruals" }
      - { name: amount_cents, type: integer, source: system, description: "Signed amount applied to principal_balance_cents (positive = balance increase)" }
      - { name: balance_after_cents, type: integer, source: system, description: "principal_balance_cents immediately after this entry was posted" }
      - { name: posted_month_index, type: integer, source: system, description: "months_elapsed value when posted (0 = at origination)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Loan: PARALLEL state axes (servicing_status x disposition_status) ----
  - entity: Loan
    initial_state: "disposition_status=ACTIVE; servicing_status=CURRENT (after ORIGINATED)"
    terminal_states: ["disposition_status=TERMINATED"]
    note: |
      Loan has TWO independent state dimensions evolving on the same row:
      AXIS A servicing_status {CURRENT, DELINQUENT_OCCUPANCY, DELINQUENT_PROPERTY_CHARGE}
      AXIS B disposition_status {ACTIVE, DUE_AND_PAYABLE, DEFERRED, IN_RESOLUTION, TERMINATED}.
      A loan can be DELINQUENT_OCCUPANCY (axis A) while still ACTIVE (axis B); a maturity
      event moves axis B to DUE_AND_PAYABLE without changing axis A. Both axes are
      examined together by validations (e.g., a draw needs disposition_status=ACTIVE
      AND servicing_status=CURRENT).
    transitions:
      # --- creation / origination ---
      - from: "(none)"
        to: "disposition_status=ACTIVE, servicing_status=CURRENT"
        trigger: "POST /loans then POST /loans/{loanId}/originate"
        actor: ServicerOps
        preconditions:
          - "Borrower age at origination >= 62 (computed from borrower.birthdate vs lender.clock_utc); else ERR_BORROWER_UNDER_AGE"
          - "draw_type provided and valid; TERM requires tenure_term_months >= 1 else ERR_INVALID_REQUEST"
          - "Loan currently in pre-origination state (origination_date null) else ERR_ALREADY_ORIGINATED"
        side_effects:
          - "Compute max_claim_amount_cents, principal_limit_factor_micros, gross_principal_limit_cents (calc: principal_limit)"
          - "If a LesaSetAside exists for loan: compute lesa_set_aside_cents (calc: lesa_sizing) and carve from limit"
          - "Compute net_principal_limit_cents = gross_principal_limit_cents - lesa_set_aside_cents - initial_financed_costs_cents"
          - "Post INITIAL advance: principal_balance_cents = initial_financed_costs_cents (LedgerEntry ADVANCE)"
          - "For LINE_OF_CREDIT: available_line_of_credit_cents = net_principal_limit_cents"
          - "For TENURE/TERM: compute monthly_payment_cents (calc: scheduled_payment)"
          - "origination_date = lender.clock_utc date; months_elapsed = 0"

      # --- AXIS A: occupancy delinquency (set by occupancy cert lapse cascade) ---
      - from: "servicing_status=CURRENT"
        to: "servicing_status=DELINQUENT_OCCUPANCY"
        trigger: "system (cascade from OccupancyCertification PENDING->DELINQUENT)"
        actor: system
        preconditions: ["A governing OccupancyCertification for the loan reached DELINQUENT"]
        side_effects: ["servicing_status flips; disposition_status unchanged (axes independent)"]

      - from: "servicing_status=DELINQUENT_OCCUPANCY"
        to: "servicing_status=CURRENT"
        trigger: "system (cascade from OccupancyCertification DELINQUENT->CERTIFIED)"
        actor: system
        preconditions: ["No other DELINQUENT OccupancyCertification remains for the loan"]
        side_effects: ["servicing_status restored to CURRENT"]

      # --- AXIS A: property-charge delinquency (LESA exhausted + charge unpaid) ---
      - from: "servicing_status=CURRENT"
        to: "servicing_status=DELINQUENT_PROPERTY_CHARGE"
        trigger: "system (cascade when a TAX_INSURANCE_DEFAULT maturity event references a loan whose LESA remaining_cents == 0)"
        actor: system
        preconditions: ["LesaSetAside.remaining_cents == 0 (EXHAUSTED) for the loan"]
        side_effects: ["servicing_status flips to DELINQUENT_PROPERTY_CHARGE"]

      # --- AXIS B: maturity -> due-and-payable ---
      - from: "disposition_status=ACTIVE"
        to: "disposition_status=DUE_AND_PAYABLE"
        trigger: "POST /maturity-events (system cascade on MaturityEvent creation)"
        actor: system
        preconditions: ["disposition_status currently ACTIVE"]
        side_effects:
          - "disposition_status -> DUE_AND_PAYABLE"
          - "Cancel all REQUESTED/APPROVED Disbursements for the loan -> VOIDED (conditional cascade: only non-DISBURSED)"
          - "available_line_of_credit_cents -> 0 (line frozen at due-and-payable)"

      # --- AXIS B: due-and-payable -> deferred (NBS) ---
      - from: "disposition_status=DUE_AND_PAYABLE"
        to: "disposition_status=DEFERRED"
        trigger: "POST /nbs-deferrals (NonBorrowingSpouseDeferral activation)"
        actor: ComplianceOfficer
        preconditions:
          - "Triggering MaturityEvent.event_type == BORROWER_DEATH else ERR_DEFERRAL_NOT_ELIGIBLE"
          - "Named NBS Borrower has is_non_borrowing_spouse=true AND nbs_qualifies=true else ERR_NBS_NOT_QUALIFIED"
          - "disposition_status == DUE_AND_PAYABLE else ERR_INVALID_STATE"
        side_effects:
          - "disposition_status -> DEFERRED"
          - "NonBorrowingSpouseDeferral.status = ACTIVE; period_start = maturity_event.event_date"

      - from: "disposition_status=DEFERRED"
        to: "disposition_status=DUE_AND_PAYABLE"
        trigger: "POST /nbs-deferrals/{deferralId}/terminate"
        actor: ComplianceOfficer
        preconditions: ["Active deferral exists for loan"]
        side_effects:
          - "deferral.status = TERMINATED; period_end = lender.clock_utc date"
          - "disposition_status -> DUE_AND_PAYABLE (due-and-payable re-opens)"

      # --- AXIS B: due-and-payable -> in resolution ---
      - from: "disposition_status=DUE_AND_PAYABLE"
        to: "disposition_status=IN_RESOLUTION"
        trigger: "POST /resolutions"
        actor: ComplianceOfficer
        preconditions:
          - "disposition_status == DUE_AND_PAYABLE else ERR_INVALID_STATE"
          - "No ACTIVE NonBorrowingSpouseDeferral for loan else ERR_DEFERRAL_ACTIVE"
        side_effects:
          - "disposition_status -> IN_RESOLUTION"
          - "Compute payoff_amount_cents and deficiency_cents (calc: lesser_of_payoff)"

      # --- AXIS B: in resolution -> terminated ---
      - from: "disposition_status=IN_RESOLUTION"
        to: "disposition_status=TERMINATED"
        trigger: "POST /resolutions/{resolutionId}/settle"
        actor: ComplianceOfficer
        preconditions: ["Resolution status == INITIATED"]
        side_effects:
          - "Resolution.status = SETTLED"
          - "disposition_status -> TERMINATED (terminal); available_line_of_credit_cents = 0"

  # ---- Disbursement: branching (approve/reject fork) + compensating void ----
  - entity: Disbursement
    initial_state: REQUESTED
    terminal_states: [DISBURSED, REJECTED, VOIDED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /disbursements/{disbursementId}/approve"
        actor: ServicerOps
        preconditions:
          - "Loan.disposition_status == ACTIVE AND Loan.servicing_status == CURRENT else ERR_LOAN_NOT_DRAWABLE (cross-entity)"
          - "kind == LINE_DRAW requires Loan.draw_type == LINE_OF_CREDIT else ERR_DRAW_TYPE_MISMATCH"
          - "requested_amount_cents <= Loan.available_line_of_credit_cents else ERR_INSUFFICIENT_LINE (boundary: == allowed)"
          - "expected_loan_version matches Loan.version else ERR_STALE_VERSION (OCC)"
        side_effects:
          - "approved_amount_cents = requested_amount_cents"
          - "increments Loan.version by 1"
      - from: APPROVED
        to: DISBURSED
        trigger: "POST /disbursements/{disbursementId}/disburse"
        actor: ServicerOps
        preconditions: ["Loan.disposition_status == ACTIVE else ERR_LOAN_NOT_DRAWABLE"]
        side_effects:
          - "principal_balance_cents += approved_amount_cents (LedgerEntry ADVANCE)"
          - "available_line_of_credit_cents -= approved_amount_cents (conserved: balance+line constant)"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /disbursements/{disbursementId}/reject"
        actor: ServicerOps
        preconditions: []
        side_effects: ["approved_amount_cents = 0"]
      - from: DISBURSED
        to: VOIDED
        trigger: "POST /disbursements/{disbursementId}/void"
        actor: ServicerOps
        preconditions: ["Loan.disposition_status == ACTIVE else ERR_INVALID_STATE"]
        side_effects:
          - "Compensation: principal_balance_cents -= approved_amount_cents (LedgerEntry REVERSAL)"
          - "available_line_of_credit_cents += approved_amount_cents (restores conserved principal-capacity invariant)"
      - from: REQUESTED
        to: VOIDED
        trigger: "system (cascade on MaturityEvent / due-and-payable)"
        actor: system
        preconditions: ["Disbursement not yet DISBURSED"]
        side_effects: ["approved_amount_cents = 0"]
      - from: APPROVED
        to: VOIDED
        trigger: "system (cascade on MaturityEvent / due-and-payable)"
        actor: system
        preconditions: ["Disbursement not yet DISBURSED"]
        side_effects: ["approved_amount_cents = 0"]

  # ---- OccupancyCertification: CYCLIC (PENDING->DELINQUENT->CERTIFIED->next year PENDING) ----
  - entity: OccupancyCertification
    initial_state: PENDING
    terminal_states: []
    note: "Cyclic: a cert can lapse to DELINQUENT and recover to CERTIFIED; certifying a year opens the next year's PENDING cert on the next anniversary."
    transitions:
      - from: PENDING
        to: CERTIFIED
        trigger: "POST /occupancy-certifications/{certId}/certify"
        actor: Borrower
        preconditions:
          - "lender.clock_utc date <= due_date (on or before due) else transition routes via DELINQUENT"
          - "Loan.disposition_status != TERMINATED else ERR_INVALID_STATE"
        side_effects:
          - "certified_at = lender.clock_utc"
          - "If Loan.servicing_status == DELINQUENT_OCCUPANCY and no other DELINQUENT cert remains: Loan.servicing_status -> CURRENT (bubble-up cascade)"
      - from: PENDING
        to: DELINQUENT
        trigger: "POST /loans/_clock/set advancing past due_date (system sweep) OR POST /occupancy-certifications/{certId}/mark-delinquent"
        actor: system
        preconditions: ["lender.clock_utc date > due_date AND status still PENDING"]
        side_effects: ["cascade: Loan.servicing_status CURRENT -> DELINQUENT_OCCUPANCY"]
      - from: DELINQUENT
        to: CERTIFIED
        trigger: "POST /occupancy-certifications/{certId}/certify"
        actor: Borrower
        preconditions: ["Loan.disposition_status != TERMINATED"]
        side_effects:
          - "certified_at = lender.clock_utc"
          - "cascade: Loan.servicing_status DELINQUENT_OCCUPANCY -> CURRENT if no other DELINQUENT cert remains (bubble-up)"

  # ---- MaturityEvent: linear acknowledge ----
  - entity: MaturityEvent
    initial_state: RECORDED
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: RECORDED
        to: ACKNOWLEDGED
        trigger: "POST /maturity-events/{eventId}/acknowledge"
        actor: ComplianceOfficer
        preconditions: ["Loan.disposition_status == DUE_AND_PAYABLE OR DEFERRED"]
        side_effects: ["records the due-and-payable notice issuance timestamp via updated_at"]

  # ---- Resolution: branching fork by path with divergent side-effects ----
  - entity: Resolution
    initial_state: INITIATED
    terminal_states: [SETTLED, CANCELLED]
    note: "Branching fork on `path`: PAYOFF / SHORT_SALE / FORECLOSURE each compute deficiency differently and have divergent settle side-effects."
    transitions:
      - from: INITIATED
        to: SETTLED
        trigger: "POST /resolutions/{resolutionId}/settle"
        actor: ComplianceOfficer
        preconditions:
          - "path == SHORT_SALE requires appraised_at_resolution_cents present else ERR_INVALID_REQUEST"
          - "Loan.disposition_status == IN_RESOLUTION"
        side_effects:
          - "PAYOFF branch: deficiency_cents = 0; balance considered satisfied"
          - "SHORT_SALE branch: payoff_amount_cents = min(balance, round_half_up(0.95*appraised_at_resolution_cents)); deficiency_cents = balance - payoff_amount_cents"
          - "FORECLOSURE branch: payoff_amount_cents = min(balance, round_half_up(0.95*appraised_value_cents)); deficiency_cents = balance - payoff_amount_cents"
          - "Loan.disposition_status -> TERMINATED"
      - from: INITIATED
        to: CANCELLED
        trigger: "POST /resolutions/{resolutionId}/cancel"
        actor: ComplianceOfficer
        preconditions: ["Resolution status == INITIATED"]
        side_effects: ["Loan.disposition_status -> DUE_AND_PAYABLE (re-opened)"]

  # ---- NonBorrowingSpouseDeferral: lifecycle ----
  - entity: NonBorrowingSpouseDeferral
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /nbs-deferrals/{deferralId}/terminate"
        actor: ComplianceOfficer
        preconditions: ["deferral status == ACTIVE"]
        side_effects:
          - "period_end = lender.clock_utc date"
          - "Loan.disposition_status DEFERRED -> DUE_AND_PAYABLE (cross-entity)"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: line-draw-approve-stale-loan
    parent_entity: Loan
    write_endpoint: "POST /disbursements/{disbursementId}/approve"
    occ_field: "expected_loan_version"
    description: |
      Approving a LINE_DRAW disbursement against a Loan whose version has advanced
      since the client last observed it is rejected. The line of credit is a finite
      growing pool; a prior approve against the same loan legitimately debited the
      available line and advanced Loan.version, so the current approver's view of
      available_line_of_credit_cents is stale and re-validation is required.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: principal_limit
    trigger: "Loan ORIGINATED (POST /loans/{loanId}/originate)"
    algorithm: threshold
    formula: |
      # nested min/max + tiered PLF selection (≥3 inputs, non-linear)
      max_claim_amount_cents = min(appraised_value_cents, lender.hud_lending_limit_cents)
      age = whole_years_between(borrower.birthdate, lender.clock_utc date)   # floor
      # PLF lookup: pick the PrincipalLimitFactor row for this lender whose
      #   age == min(age, 90 capped) AND expected_rate_bps == loan.expected_rate_bps.
      #   If exact age row absent, choose the row with the greatest age <= borrower age
      #   (tie impossible: age is unique per (lender, expected_rate_bps)).
      plf_micros = factor_micros of selected PrincipalLimitFactor
      gross_principal_limit_cents = round_half_up(max_claim_amount_cents * plf_micros / 1_000_000)
    input_set: "Loan being originated + its Borrower + Lender.hud_lending_limit_cents + matching PrincipalLimitFactor rows"
    constants:
      AGE_CAP: 90          # ages above 90 use the age-90 factor row
      MIN_AGE: 62
    precision: "cents, round_half_up at the single multiply step"
    variants:
      - name: line_of_credit_available
        when: "draw_type == LINE_OF_CREDIT"
        difference: "Entire net_principal_limit becomes available_line_of_credit_cents (undrawn); principal_balance starts at initial_financed_costs only."
      - name: lump_sum_drawn
        when: "draw_type == LUMP_SUM"
        difference: "Borrower draws the full net principal limit at origination; available_line_of_credit_cents stays 0 and principal_balance = initial_financed_costs + net_principal_limit advance. Same gross limit, different available figure."

  - name: balance_accrual
    trigger: "POST /loans/{loanId}/post-accrual (monthly servicing posting)"
    algorithm: aggregation
    formula: |
      # MONTHLY COMPOUNDING — nested rounding where ORDER MATTERS.
      # Pinned order: round EACH per-month component to whole cents, THEN add to balance,
      # THEN that rounded balance is the base for the next month. (round-per-period-then-accumulate,
      # NOT accumulate-then-round.)
      monthly_rate = (expected_rate_bps + annual_mip_rate_bps) / 10_000 / 12
      for each month m in the posting run:
        interest_component_cents = round_half_up(principal_balance_cents * (expected_rate_bps/10_000/12))
        mip_component_cents      = round_half_up(principal_balance_cents * (annual_mip_rate_bps/10_000/12))
        principal_balance_cents += interest_component_cents + mip_component_cents      # post 2 LedgerEntries
        available_line_of_credit_cents += round_half_up(available_line_of_credit_cents * monthly_rate)  # line grows same rate
        months_elapsed += 1
    input_set: "Single Loan; number_of_months from request body"
    constants:
      BPS_DIVISOR: 10000
      MONTHS_PER_YEAR: 12
    precision: "cents, round_half_up PER MONTH PER COMPONENT before accumulation (order pinned)"
    variants:
      - name: payoff_quote_projection
        when: "GET /loans/{loanId}/payoff-quote (forward-looking, does NOT mutate)"
        difference: "Projects balance forward number_of_months as a single compound figure round_half_up(balance*(1+monthly_rate)^n) computed once at the end (accumulate-then-round). For the same loan + same n this yields a DIFFERENT cents value than balance_accrual's round-per-month posting."

  - name: lesa_sizing
    trigger: "Loan ORIGINATED with a LesaSetAside present"
    algorithm: tiered_pricing
    formula: |
      # circular-looking dependency pinned: lesa_set_aside reduces net principal limit,
      # but its own size is keyed off annual_property_charge and funding_mode (NOT off net limit).
      # Evaluation order pinned: compute lesa_set_aside FIRST from charges, THEN subtract from gross limit.
      if funding_mode == FULLY_FUNDED:
        initial_amount_cents = annual_property_charge_cents * life_expectancy_years
      elif funding_mode == PARTIALLY_FUNDED:
        # semi-annual disbursement model: half of estimated charges over the horizon
        initial_amount_cents = round_half_up(annual_property_charge_cents * life_expectancy_years / 2)
    input_set: "Single LesaSetAside for the loan"
    constants:
      PARTIAL_FACTOR_DENOM: 2
    precision: "cents, round_half_up"
    variants:
      - name: fully_funded
        when: "funding_mode == FULLY_FUNDED"
        difference: "Servicer pays charges directly; full horizon carved from principal limit."
      - name: partially_funded
        when: "funding_mode == PARTIALLY_FUNDED"
        difference: "Half the horizon is set aside (semi-annual borrower disbursement). Same inputs, different initial_amount_cents than fully_funded."

  - name: scheduled_payment
    trigger: "Loan ORIGINATED with draw_type TENURE or TERM"
    algorithm: threshold
    formula: |
      # ≥3-input non-linear amortization-style monthly payment.
      principal_available = net_principal_limit_cents
      monthly_rate = expected_rate_bps / 10_000 / 12   # MIP excluded from the tenure factor base
      if draw_type == TENURE:
        n = (100 - age) * 12       # HUD pays until borrower reaches age 100
      else:   # TERM
        n = tenure_term_months
      if monthly_rate == 0:
        monthly_payment_cents = floor(principal_available / n)
      else:
        monthly_payment_cents = floor(principal_available * monthly_rate / (1 - (1+monthly_rate)^(-n)))
    input_set: "Single Loan (net_principal_limit_cents, expected_rate_bps, draw_type, tenure_term_months, borrower age)"
    constants:
      TENURE_TERMINAL_AGE: 100
    precision: "cents, floor (never overpay the principal)"

  - name: lesser_of_payoff
    trigger: "Resolution created (POST /resolutions) and recomputed on settle"
    algorithm: threshold
    formula: |
      # non-recourse: borrower/estate never owes more than 95% of appraised value.
      basis_value = (path == SHORT_SALE) ? appraised_at_resolution_cents : loan.appraised_value_cents
      capped = round_half_up(0.95 * basis_value)
      payoff_amount_cents = min(loan.principal_balance_cents, capped)
      deficiency_cents    = loan.principal_balance_cents - payoff_amount_cents   # absorbed by FHA insurance
    input_set: "Single Resolution + its Loan"
    constants:
      NON_RECOURSE_FACTOR_PCT: 95
    precision: "cents, round_half_up on the cap"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Caller role permitted for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body resource ids resolve (Loan, Borrower, Disbursement, LesaSetAside, etc.), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all endpoints referencing a resource id

  - priority: 4
    category: business_constraint
    check: "Request body is well-formed: required fields present, enums valid, amounts > 0, TERM has tenure_term_months, SHORT_SALE resolution has appraised_at_resolution_cents"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all write endpoints

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 6
    category: business_safety
    check: "Borrower youngest age at origination >= 62 (regulatory floor)"
    error_id: ERR_BORROWER_UNDER_AGE
    http_status: 422
    applies_to: "POST /loans/{loanId}/originate"

  - priority: 7
    category: state
    check: "Loan must be drawable: disposition_status == ACTIVE AND servicing_status == CURRENT for disbursement approve"
    error_id: ERR_LOAN_NOT_DRAWABLE
    http_status: 409
    applies_to: "POST /disbursements/{disbursementId}/approve, POST /disbursements/{disbursementId}/disburse"

  - priority: 8
    category: business_referential
    check: "kind=LINE_DRAW requires Loan.draw_type == LINE_OF_CREDIT"
    error_id: ERR_DRAW_TYPE_MISMATCH
    http_status: 409
    applies_to: "POST /disbursements/{disbursementId}/approve"

  - priority: 9
    category: business_referential
    check: "NBS deferral: named NBS Borrower has is_non_borrowing_spouse=true AND nbs_qualifies=true"
    error_id: ERR_NBS_NOT_QUALIFIED
    http_status: 422
    applies_to: "POST /nbs-deferrals"

  - priority: 10
    category: business_temporal
    check: "NBS deferral: triggering MaturityEvent.event_type must be BORROWER_DEATH (only death opens deferral eligibility)"
    error_id: ERR_DEFERRAL_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /nbs-deferrals"

  - priority: 11
    category: business_temporal
    check: "OccupancyCertification: at most one certification per (loan, certification_year); the new coverage year must not overlap an existing certification's annual window"
    error_id: ERR_CERT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /occupancy-certifications"

  - priority: 12
    category: business_temporal
    check: "PropertyChargePayment: half-open coverage window [coverage_start, coverage_end) must not overlap an existing POSTED payment of the same charge_type on the same loan (adjacency, end==next.start, allowed)"
    error_id: ERR_COVERAGE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /property-charge-payments"

  - priority: 13
    category: business_referential
    check: "PropertyChargePayment: referenced LesaSetAside.status must be FUNDED (not EXHAUSTED) and belong to the same loan"
    error_id: ERR_LESA_EXHAUSTED
    http_status: 409
    applies_to: "POST /property-charge-payments"

  - priority: 14
    category: business_fiscal
    check: "PropertyChargePayment amount_cents <= LesaSetAside.remaining_cents (cannot overdraw the pool)"
    error_id: ERR_LESA_OVERDRAW
    http_status: 422
    applies_to: "POST /property-charge-payments"

  - priority: 15
    category: business_fiscal
    check: "Disbursement approve: requested_amount_cents <= Loan.available_line_of_credit_cents (== exactly the line is allowed; > rejected)"
    error_id: ERR_INSUFFICIENT_LINE
    http_status: 422
    applies_to: "POST /disbursements/{disbursementId}/approve"

  - priority: 16
    category: state
    check: "NBS deferral cannot be opened while loan already has an ACTIVE deferral; resolution cannot start while an ACTIVE deferral exists"
    error_id: ERR_DEFERRAL_ACTIVE
    http_status: 409
    applies_to: "POST /nbs-deferrals, POST /resolutions"

  - priority: 17
    category: concurrency
    check: "Disbursement approve: expected_loan_version must equal current Loan.version (OCC)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /disbursements/{disbursementId}/approve"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Lender ----
  - method: POST
    path: "/lenders"
    description: "Create a lender / servicer with the FHA lending limit"
    roles: [ServicerOps]
    code: 201
    input: [name, hud_lending_limit_cents]
    output: Lender
    side_effects: ["clock_utc initialized to 1970-01-01T00:00:00.000Z"]

  - method: GET
    path: "/lenders/{lenderId}"
    description: "Get a lender"
    roles: [ServicerOps, ComplianceOfficer, HudAuditor, Borrower]
    code: 200
    input: []
    output: Lender
    side_effects: []

  - method: POST
    path: "/loans/_clock/set"
    description: "Set the simulated current UTC for a lender (test/automation clock); runs occupancy-delinquency sweep"
    roles: [System, ServicerOps]
    code: 200
    input: [lender_id, to_iso8601]
    output: Lender
    side_effects:
      - "lender.clock_utc = to_iso8601"
      - "Sweep: any PENDING OccupancyCertification whose due_date < new clock date -> DELINQUENT (cascade: Loan.servicing_status -> DELINQUENT_OCCUPANCY)"

  # ---- PrincipalLimitFactor (config) ----
  - method: POST
    path: "/principal-limit-factors"
    description: "Register a PLF table row (age x expected_rate_bps -> factor_micros)"
    roles: [ServicerOps]
    code: 201
    input: [lender_id, age, expected_rate_bps, factor_micros]
    output: PrincipalLimitFactor
    side_effects: []

  - method: GET
    path: "/principal-limit-factors/{plfId}"
    description: "Get a PLF row"
    roles: [ServicerOps, ComplianceOfficer, HudAuditor]
    code: 200
    input: []
    output: PrincipalLimitFactor
    side_effects: []

  - method: GET
    path: "/principal-limit-factors"
    description: "List PLF rows; filter by lender_id"
    roles: [ServicerOps, ComplianceOfficer, HudAuditor]
    code: 200
    input: ["lender_id?", "expected_rate_bps?"]
    output: "PrincipalLimitFactor[]"
    side_effects: []

  # ---- Borrower ----
  - method: POST
    path: "/borrowers"
    description: "Create a borrower or non-borrowing spouse"
    roles: [ServicerOps]
    code: 201
    input: [lender_id, full_name, birthdate, "is_non_borrowing_spouse?", "nbs_qualifies?"]
    output: Borrower
    side_effects: ["occupancy_status = OCCUPYING"]

  - method: GET
    path: "/borrowers/{borrowerId}"
    description: "Get a borrower"
    roles: [ServicerOps, ComplianceOfficer, HudAuditor, Borrower]
    code: 200
    input: []
    output: Borrower
    side_effects: []

  - method: GET
    path: "/borrowers"
    description: "List borrowers; filter by lender_id"
    roles: [ServicerOps, ComplianceOfficer, HudAuditor]
    code: 200
    input: ["lender_id?"]
    output: "Borrower[]"
    side_effects: []

  # ---- Loan ----
  - method: POST
    path: "/loans"
    description: "Create a HECM loan in pre-origination state"
    roles: [ServicerOps]
    code: 201
    input: [lender_id, borrower_id, "non_borrowing_spouse_id?", appraised_value_cents, expected_rate_bps, draw_type, "annual_mip_rate_bps?", "tenure_term_months?", "initial_financed_costs_cents?"]
    output: Loan
    side_effects: ["disposition_status=ACTIVE pending origination; origination_date=null; balances 0"]

  - method: GET
    path: "/loans/{loanId}"
    description: "Get a loan with all computed fields"
    roles: [ServicerOps, ComplianceOfficer, HudAuditor, Borrower]
    code: 200
    input: []
    output: Loan
    side_effects: []

  - method: GET
    path: "/loans"
    description: "List loans; filter by lender_id, borrower_id, or non_borrowing_spouse_id"
    roles: [ServicerOps, ComplianceOfficer, HudAuditor]
    code: 200
    input: ["lender_id?", "borrower_id?", "non_borrowing_spouse_id?"]
    output: "Loan[]"
    side_effects: []

  - method: POST
    path: "/loans/{loanId}/originate"
    description: "Originate the loan: compute principal limit, LESA carve, initial advance, available line / scheduled payment"
    roles: [ServicerOps]
    code: 200
    input: []
    output: Loan
    side_effects:
      - "calc principal_limit, lesa_sizing (if LESA present), scheduled_payment (TENURE/TERM)"
      - "net_principal_limit_cents set; INITIAL advance posted; origination_date set"

  - method: POST
    path: "/loans/{loanId}/post-accrual"
    description: "Post N months of compounding interest + MIP accrual and grow the line of credit"
    roles: [ServicerOps, System]
    code: 200
    input: [number_of_months]
    output: Loan
    side_effects:
      - "calc balance_accrual: principal_balance_cents and available_line_of_credit_cents grow; months_elapsed += number_of_months; LedgerEntries posted"

  - method: GET
    path: "/loans/{loanId}/payoff-quote"
    description: "Forward-looking payoff quote (does not mutate); projects balance number_of_months ahead"
    roles: [ServicerOps, ComplianceOfficer, HudAuditor, Borrower]
    code: 200
    input: ["number_of_months?"]
    output: "{ loan_id: string, projected_balance_cents: integer, lesser_of_payoff_cents: integer, deficiency_cents: integer }"
    side_effects: []

  # ---- Disbursement ----
  - method: POST
    path: "/disbursements"
    description: "Request a disbursement (draw) against a loan"
    roles: [ServicerOps, Borrower]
    code: 201
    input: [loan_id, kind, requested_amount_cents]
    output: Disbursement
    side_effects: ["status=REQUESTED"]

  - method: GET
    path: "/disbursements/{disbursementId}"
    description: "Get a disbursement"
    roles: [ServicerOps, ComplianceOfficer, HudAuditor, Borrower]
    code: 200
    input: []
    output: Disbursement
    side_effects: []

  - method: GET
    path: "/disbursements"
    description: "List disbursements; filter by loan_id"
    roles: [ServicerOps, ComplianceOfficer, HudAuditor, Borrower]
    code: 200
    input: ["loan_id?", "status?"]
    output: "Disbursement[]"
    side_effects: []

  - method: POST
    path: "/disbursements/{disbursementId}/approve"
    description: "Approve a requested disbursement (OCC-guarded against the loan's line)"
    roles: [ServicerOps]
    code: 200
    input: [expected_loan_version]
    output: Disbursement
    side_effects: ["approved_amount_cents set; increments Loan.version by 1"]

  - method: POST
    path: "/disbursements/{disbursementId}/disburse"
    description: "Disburse an approved disbursement (debits line, credits balance)"
    roles: [ServicerOps]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["principal_balance_cents += approved; available_line_of_credit_cents -= approved; LedgerEntry ADVANCE"]

  - method: POST
    path: "/disbursements/{disbursementId}/reject"
    description: "Reject a requested disbursement"
    roles: [ServicerOps]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["status=REJECTED; approved_amount_cents=0"]

  - method: POST
    path: "/disbursements/{disbursementId}/void"
    description: "Void a disbursed draw (compensating reversal restoring principal capacity)"
    roles: [ServicerOps]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["principal_balance_cents -= approved; available_line_of_credit_cents += approved; LedgerEntry REVERSAL"]

  # ---- LesaSetAside ----
  - method: POST
    path: "/lesa-set-asides"
    description: "Create a property-charge set-aside (LESA) for a loan (before origination)"
    roles: [ServicerOps]
    code: 201
    input: [loan_id, funding_mode, annual_property_charge_cents, life_expectancy_years]
    output: LesaSetAside
    side_effects: ["status=FUNDED; initial_amount_cents computed lazily at loan origination (calc lesa_sizing)"]

  - method: GET
    path: "/lesa-set-asides/{lesaId}"
    description: "Get a LESA set-aside"
    roles: [ServicerOps, ComplianceOfficer, HudAuditor, Borrower]
    code: 200
    input: []
    output: LesaSetAside
    side_effects: []

  - method: GET
    path: "/lesa-set-asides"
    description: "List LESA set-asides; filter by loan_id"
    roles: [ServicerOps, ComplianceOfficer, HudAuditor]
    code: 200
    input: ["loan_id?"]
    output: "LesaSetAside[]"
    side_effects: []

  # ---- PropertyChargePayment ----
  - method: POST
    path: "/property-charge-payments"
    description: "Pay a property charge from the LESA pool"
    roles: [ServicerOps]
    code: 201
    input: [loan_id, lesa_set_aside_id, charge_type, coverage_start, coverage_end, amount_cents]
    output: PropertyChargePayment
    side_effects:
      - "LesaSetAside.drawn_cents += amount_cents; remaining_cents -= amount_cents; status->EXHAUSTED at 0"
      - "principal_balance_cents += amount_cents (LedgerEntry LESA_DRAW)"

  - method: GET
    path: "/property-charge-payments/{paymentId}"
    description: "Get a property-charge payment"
    roles: [ServicerOps, ComplianceOfficer, HudAuditor]
    code: 200
    input: []
    output: PropertyChargePayment
    side_effects: []

  - method: GET
    path: "/property-charge-payments"
    description: "List property-charge payments; filter by loan_id or lesa_set_aside_id"
    roles: [ServicerOps, ComplianceOfficer, HudAuditor]
    code: 200
    input: ["loan_id?", "lesa_set_aside_id?"]
    output: "PropertyChargePayment[]"
    side_effects: []

  - method: POST
    path: "/property-charge-payments/{paymentId}/reverse"
    description: "Reverse a posted property-charge payment (compensating LESA-pool restoration)"
    roles: [ServicerOps]
    code: 200
    input: []
    output: PropertyChargePayment
    side_effects:
      - "LesaSetAside.drawn_cents -= amount_cents; remaining_cents += amount_cents; status->FUNDED"
      - "principal_balance_cents -= amount_cents (LedgerEntry REVERSAL)"

  # ---- OccupancyCertification ----
  - method: POST
    path: "/occupancy-certifications"
    description: "Open a borrower occupancy certification for a certification_year"
    roles: [ServicerOps]
    code: 201
    input: [loan_id, certification_year]
    output: OccupancyCertification
    side_effects: ["status=PENDING; due_date = origination_date + certification_year years"]

  - method: GET
    path: "/occupancy-certifications/{certId}"
    description: "Get an occupancy certification"
    roles: [ServicerOps, ComplianceOfficer, HudAuditor, Borrower]
    code: 200
    input: []
    output: OccupancyCertification
    side_effects: []

  - method: GET
    path: "/occupancy-certifications"
    description: "List occupancy certifications; filter by loan_id"
    roles: [ServicerOps, ComplianceOfficer, HudAuditor, Borrower]
    code: 200
    input: ["loan_id?", "status?"]
    output: "OccupancyCertification[]"
    side_effects: []

  - method: POST
    path: "/occupancy-certifications/{certId}/certify"
    description: "Borrower attests continued occupancy (recovers DELINQUENT to CERTIFIED)"
    roles: [Borrower, ServicerOps]
    code: 200
    input: []
    output: OccupancyCertification
    side_effects: ["certified_at set; bubble-up: Loan.servicing_status -> CURRENT if no other DELINQUENT cert remains"]

  - method: POST
    path: "/occupancy-certifications/{certId}/mark-delinquent"
    description: "Mark a past-due PENDING certification DELINQUENT (manual servicer action; same effect as clock sweep)"
    roles: [ServicerOps, System]
    code: 200
    input: []
    output: OccupancyCertification
    side_effects: ["status=DELINQUENT; cascade: Loan.servicing_status -> DELINQUENT_OCCUPANCY"]

  # ---- MaturityEvent ----
  - method: POST
    path: "/maturity-events"
    description: "Record a maturity event (death / vacancy / sale / tax-insurance default) -> due-and-payable"
    roles: [ComplianceOfficer, ServicerOps]
    code: 201
    input: [loan_id, event_type, event_date]
    output: MaturityEvent
    side_effects:
      - "status=RECORDED"
      - "cascade: Loan.disposition_status ACTIVE -> DUE_AND_PAYABLE; void non-DISBURSED Disbursements; freeze line to 0"
      - "If event_type==TAX_INSURANCE_DEFAULT and loan LESA remaining_cents==0: Loan.servicing_status -> DELINQUENT_PROPERTY_CHARGE"

  - method: GET
    path: "/maturity-events/{eventId}"
    description: "Get a maturity event"
    roles: [ServicerOps, ComplianceOfficer, HudAuditor]
    code: 200
    input: []
    output: MaturityEvent
    side_effects: []

  - method: GET
    path: "/maturity-events"
    description: "List maturity events; filter by loan_id"
    roles: [ServicerOps, ComplianceOfficer, HudAuditor]
    code: 200
    input: ["loan_id?"]
    output: "MaturityEvent[]"
    side_effects: []

  - method: POST
    path: "/maturity-events/{eventId}/acknowledge"
    description: "Compliance acknowledges and issues the due-and-payable notice"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: MaturityEvent
    side_effects: ["status=ACKNOWLEDGED"]

  # ---- NonBorrowingSpouseDeferral ----
  - method: POST
    path: "/nbs-deferrals"
    description: "Open a non-borrowing-spouse deferral against a due-and-payable loan"
    roles: [ComplianceOfficer]
    code: 201
    input: [loan_id, borrower_id, maturity_event_id]
    output: NonBorrowingSpouseDeferral
    side_effects:
      - "status=ACTIVE; period_start=maturity_event.event_date"
      - "cascade: Loan.disposition_status DUE_AND_PAYABLE -> DEFERRED"

  - method: GET
    path: "/nbs-deferrals/{deferralId}"
    description: "Get an NBS deferral"
    roles: [ServicerOps, ComplianceOfficer, HudAuditor]
    code: 200
    input: []
    output: NonBorrowingSpouseDeferral
    side_effects: []

  - method: GET
    path: "/nbs-deferrals"
    description: "List NBS deferrals; filter by loan_id or borrower_id or maturity_event_id"
    roles: [ServicerOps, ComplianceOfficer, HudAuditor]
    code: 200
    input: ["loan_id?", "borrower_id?", "maturity_event_id?"]
    output: "NonBorrowingSpouseDeferral[]"
    side_effects: []

  - method: POST
    path: "/nbs-deferrals/{deferralId}/terminate"
    description: "Terminate an active deferral (NBS dies / moves out) -> due-and-payable re-opens"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: NonBorrowingSpouseDeferral
    side_effects: ["status=TERMINATED; period_end set; cascade: Loan.disposition_status DEFERRED -> DUE_AND_PAYABLE"]

  # ---- Resolution ----
  - method: POST
    path: "/resolutions"
    description: "Open a resolution (payoff / short-sale / foreclosure) for a due-and-payable loan"
    roles: [ComplianceOfficer]
    code: 201
    input: [loan_id, path, "appraised_at_resolution_cents?"]
    output: Resolution
    side_effects:
      - "status=INITIATED; calc lesser_of_payoff (payoff_amount_cents, deficiency_cents)"
      - "cascade: Loan.disposition_status DUE_AND_PAYABLE -> IN_RESOLUTION"

  - method: GET
    path: "/resolutions/{resolutionId}"
    description: "Get a resolution"
    roles: [ServicerOps, ComplianceOfficer, HudAuditor]
    code: 200
    input: []
    output: Resolution
    side_effects: []

  - method: GET
    path: "/resolutions"
    description: "List resolutions; filter by loan_id"
    roles: [ServicerOps, ComplianceOfficer, HudAuditor]
    code: 200
    input: ["loan_id?"]
    output: "Resolution[]"
    side_effects: []

  - method: POST
    path: "/resolutions/{resolutionId}/settle"
    description: "Settle a resolution (terminal); recomputes deficiency per path branch"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Resolution
    side_effects: ["status=SETTLED; recompute lesser_of_payoff; cascade: Loan.disposition_status -> TERMINATED"]

  - method: POST
    path: "/resolutions/{resolutionId}/cancel"
    description: "Cancel a resolution -> loan returns to due-and-payable"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Resolution
    side_effects: ["status=CANCELLED; cascade: Loan.disposition_status IN_RESOLUTION -> DUE_AND_PAYABLE"]

  # ---- LedgerEntry (audit / reverse-reachability) ----
  - method: GET
    path: "/ledger-entries"
    description: "List append-only ledger entries; filter by loan_id"
    roles: [ServicerOps, ComplianceOfficer, HudAuditor]
    code: 200
    input: ["loan_id?"]
    output: "LedgerEntry[]"
    side_effects: []

  - method: GET
    path: "/ledger-entries/{ledgerEntryId}"
    description: "Get a single append-only ledger entry by id (audit retrieval)"
    roles: [ServicerOps, ComplianceOfficer, HudAuditor]
    code: 200
    input: []
    output: LedgerEntry
    side_effects: []

  - method: POST
    path: "/loans/{loanId}/recompute"
    description: "Audit recompute: re-derive principal_balance_cents from the LedgerEntry stream and reconcile derived fields"
    roles: [HudAuditor, ServicerOps]
    code: 200
    input: []
    output: Loan
    side_effects: ["reconcile principal_balance_cents/available_line_of_credit_cents to ledger; ERR_LEDGER_INCONSISTENT on mismatch"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing or malformed"
  - id: ERR_FORBIDDEN_FOR_ROLE
    http: 403
    condition: "Caller role valid but not permitted for this endpoint"
  # --- existence / request ---
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource id does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body: missing required field, invalid enum, non-positive amount, TERM without tenure_term_months, SHORT_SALE without appraised_at_resolution_cents"
  # --- state ---
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource is not in a state from which the requested transition is defined"
  - id: ERR_ALREADY_ORIGINATED
    http: 409
    condition: "Loan origination attempted on a loan that already has origination_date set"
  # --- origination / age ---
  - id: ERR_BORROWER_UNDER_AGE
    http: 422
    condition: "Youngest borrower age at origination is below 62"
  - id: ERR_PLF_NOT_FOUND
    http: 422
    condition: "No PrincipalLimitFactor row matches the loan's expected_rate_bps and borrower age at origination"
  # --- disbursement ---
  - id: ERR_LOAN_NOT_DRAWABLE
    http: 409
    condition: "Loan disposition_status != ACTIVE or servicing_status != CURRENT when a draw is approved/disbursed"
  - id: ERR_DRAW_TYPE_MISMATCH
    http: 409
    condition: "LINE_DRAW requested on a loan whose draw_type is not LINE_OF_CREDIT"
  - id: ERR_INSUFFICIENT_LINE
    http: 422
    condition: "requested_amount_cents exceeds available_line_of_credit_cents (equal is allowed)"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_loan_version does not match current Loan.version on disbursement approve (OCC)"
  # --- LESA / property charge ---
  - id: ERR_LESA_EXHAUSTED
    http: 409
    condition: "Referenced LesaSetAside is EXHAUSTED (remaining_cents == 0) or belongs to a different loan"
  - id: ERR_LESA_OVERDRAW
    http: 422
    condition: "Property-charge amount_cents exceeds LesaSetAside.remaining_cents"
  - id: ERR_COVERAGE_WINDOW_OVERLAP
    http: 409
    condition: "Property-charge coverage window [start,end) overlaps an existing POSTED payment of the same charge_type on the loan"
  # --- occupancy ---
  - id: ERR_CERT_PERIOD_OVERLAP
    http: 409
    condition: "An occupancy certification already exists for the (loan, certification_year) annual window"
  # --- maturity / deferral ---
  - id: ERR_DEFERRAL_NOT_ELIGIBLE
    http: 422
    condition: "NBS deferral attempted against a maturity event whose event_type is not BORROWER_DEATH"
  - id: ERR_NBS_NOT_QUALIFIED
    http: 422
    condition: "Named NBS borrower is not is_non_borrowing_spouse or does not satisfy nbs_qualifies"
  - id: ERR_DEFERRAL_ACTIVE
    http: 409
    condition: "An ACTIVE NBS deferral blocks opening another deferral or starting a resolution"
  # --- ledger ---
  - id: ERR_LEDGER_INCONSISTENT
    http: 409
    condition: "Audit recompute could not reconcile derived balances against the ledger stream"
  # --- pagination ---
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit/offset outside allowed bounds (limit 1..100, offset >= 0)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ServicerOps
    description: "Loan servicer back-office: creates lenders/PLF/borrowers/loans, originates, posts accrual, manages disbursements, LESA, property charges, recompute"
    identity: opaque
    exclusive_operations:
      - "POST /lenders — create lender"
      - "POST /principal-limit-factors — register PLF row"
      - "POST /borrowers — create borrower"
      - "POST /loans — create loan"
      - "POST /loans/{loanId}/originate — originate loan"
      - "POST /loans/{loanId}/post-accrual — post monthly accrual"
      - "POST /lesa-set-asides — create LESA"
      - "POST /property-charge-payments — pay property charge"
      - "POST /property-charge-payments/{paymentId}/reverse — reverse property-charge payment"
      - "POST /disbursements/{disbursementId}/approve — approve draw"
      - "POST /disbursements/{disbursementId}/disburse — disburse draw"
      - "POST /disbursements/{disbursementId}/reject — reject draw"
      - "POST /disbursements/{disbursementId}/void — void disbursed draw"
      - "POST /occupancy-certifications — open occupancy certification"
      - "POST /occupancy-certifications/{certId}/mark-delinquent — mark cert delinquent"
    shared_operations:
      - "POST /loans/_clock/set — set simulated clock (shared with System)"
      - "POST /disbursements — request draw (shared with Borrower)"
      - "POST /maturity-events — record maturity event (shared with ComplianceOfficer)"
      - "POST /loans/{loanId}/recompute — audit recompute (shared with HudAuditor)"
      - "GET endpoints (loans, borrowers, disbursements, lesa-set-asides, property-charge-payments, occupancy-certifications, maturity-events, nbs-deferrals, resolutions, ledger-entries, lenders, principal-limit-factors)"

  - name: ComplianceOfficer
    description: "HUD/FHA compliance: records maturity events, acknowledges due-and-payable, decides NBS deferral, drives resolutions, certifies occupancy on behalf of servicer where allowed"
    identity: opaque
    exclusive_operations:
      - "POST /maturity-events/{eventId}/acknowledge — issue due-and-payable notice"
      - "POST /nbs-deferrals — open NBS deferral"
      - "POST /nbs-deferrals/{deferralId}/terminate — terminate deferral"
      - "POST /resolutions — open resolution"
      - "POST /resolutions/{resolutionId}/settle — settle resolution"
      - "POST /resolutions/{resolutionId}/cancel — cancel resolution"
    shared_operations:
      - "POST /maturity-events — record maturity event (shared with ServicerOps)"
      - "GET endpoints (read-only across portfolio)"

  - name: Borrower
    description: "The loan borrower acting in self-service: requests draws and self-certifies occupancy"
    identity: "entity_backed:Borrower"
    exclusive_operations: []
    shared_operations:
      - "POST /disbursements — request draw (shared with ServicerOps)"
      - "POST /occupancy-certifications/{certId}/certify — self-certify occupancy (shared with ServicerOps)"
      - "GET /loans/{loanId}, GET /loans/{loanId}/payoff-quote, GET /borrowers/{borrowerId}, GET /disbursements, GET /disbursements/{disbursementId}, GET /lesa-set-asides/{lesaId}, GET /occupancy-certifications, GET /occupancy-certifications/{certId}, GET /lenders/{lenderId}"

  - name: HudAuditor
    description: "Read-only HUD/FHA auditor plus the ledger reconcile/recompute action"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /loans/{loanId}/recompute — audit recompute (shared with ServicerOps)"
      - "GET endpoints (read-only across portfolio incl. ledger-entries)"

  - name: System
    description: "Automation actor for the simulated clock and the occupancy/property-charge sweeps"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /loans/_clock/set — set simulated clock (shared with ServicerOps)"
      - "POST /loans/{loanId}/post-accrual — post accrual (shared with ServicerOps)"
      - "POST /occupancy-certifications/{certId}/mark-delinquent — mark delinquent (shared with ServicerOps)"
