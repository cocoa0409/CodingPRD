            - call: "POST /travel/teams/${team_id}/trips"
              payload: { season_id: "${season_id}", destination_code: "HOU", game_tipoff_utc: "2026-12-26T00:00:00Z", return_arrival_utc: "2026-12-27T08:00:00Z" }
              as: TravelManager
              captures: { trip_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/members"
              payload: { member_ref: "S01", party_role: "PLAYER", travel_class: "CHARTER_FIRST", per_diem_tier: "TIER_A" }
              as: TravelManager
              captures: { m_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/charter-contracts"
              payload: { vendor_code: "VZ", base_price_cents: 5000000, fuel_surcharge_cap_cents: 500000, seat_capacity: 1, cargo_capacity_lb: 5000, penalty_bands: [{days_before: 30, penalty_pct: 10}] }
              as: TravelManager
              captures: { contract_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/charter-contracts/${contract_id}/submit"
              payload: {}
              as: TravelManager
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/charter-contracts/${contract_id}/countersign"
              payload: {}
              as: VendorRep
              captures: { contract_v_pre_exec: $.data.version }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/charter-contracts/${contract_id}/execute"
              payload: { expected_contract_version: "${contract_v_pre_exec}" }
              as: TravelFinanceLead
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs"
              payload: { leg_seq: 1, origin_code: "SAT", destination_code: "HOU", scheduled_depart_utc: "2026-12-25T14:00:00Z", scheduled_arrive_utc: "2026-12-25T15:00:00Z", is_charter: true, contract_id: "${contract_id}" }
              as: TravelCoordinator
              captures: { leg1_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs"
              payload: { leg_seq: 2, origin_code: "HOU", destination_code: "DAL", scheduled_depart_utc: "2026-12-26T02:00:00Z", scheduled_arrive_utc: "2026-12-26T03:00:00Z", is_charter: true, contract_id: "${contract_id}" }
