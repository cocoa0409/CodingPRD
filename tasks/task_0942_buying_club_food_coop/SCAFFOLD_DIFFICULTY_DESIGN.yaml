          item_id: ${i_cheese}
          effective_from: '2026-04-01T00:00:00Z'
          case_price_cents: 10000
        as: ClubAdmin
        captures:
          pv_cheese: $.data.id
      - call: POST /cycles
        payload:
          code: CY-MAY
