# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 2956 — Physician Practice Acquisition & Integration
#
# Every instance grounds exclusively in elements already declared in
# SCAFFOLD.yaml §1.1–§1.7. Deleting this file leaves the declared behaviour
# identical; it only makes coverage harder to audit.
#
# Every numeric literal in an `assert:` line was computed by executing the
# corresponding §1.3 `formula:` with its `constants:` in Python
# (Decimal, ROUND_HALF_UP; floor where the formula says truncate).
#
# Logical clock: every chain pins it explicitly to 2026-08-01T00:00:00Z (the
# §1.5 default) so no assertion depends on wall-clock time.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations on different entities
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: fmv_income_vs_market_diverges_on_same_ebitda_inputs
        grounds:
          - calculations.fmv_concluded_value
          - entities.ValuationOpinion.fields.method
          - entities.ValuationOpinion.fields.concluded_value_cents
          - concurrency_rules[valuation-opinion-create-stale-acquisition]
        distinguishing_aspect: |
          Two FMV opinions on ONE acquisition carry byte-identical
          normalized_ebitda_cents (240000000) yet conclude 2167511341 under
          INCOME_APPROACH and 1560000000 under MARKET_APPROACH, a 607511341-cent
          divergence, because the income variant runs a three-year discounted
          cash flow with a Gordon-growth terminal value while the market variant
          ignores projection_years, ebitda_growth_bps, discount_rate_bps and
          terminal_growth_bps entirely.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One Acquisition in deal_status DILIGENCE with one Physician attached."
            - "No ValuationOpinion exists yet on the acquisition."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_id: "$.data.id" }
            - call: "POST /physicians"
              payload: { acquisition_id: "${acq_id}", npi: "1548392017", full_name: "Amara Vance MD", specialty: "PRIMARY_CARE", board_certified: true, state_license_expires_on: "2028-06-30" }
              as: DealLead
              as_user_id: "dl-1"
              captures: { phys_id: "$.data.id" }
            - call: "POST /acquisitions/${acq_id}/status"
              payload: { target_status: "DILIGENCE" }
              as: DealLead
              as_user_id: "dl-1"
            - call: "GET /acquisitions/${acq_id}"
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_v1: "$.data.version" }
            - call: "POST /valuation-opinions"
              payload: { acquisition_id: "${acq_id}", expected_acquisition_version: "${acq_v1}", opinion_type: "FMV", method: "INCOME_APPROACH", normalized_ebitda_cents: 240000000, projection_years: 3, ebitda_growth_bps: 300, discount_rate_bps: 1400, terminal_growth_bps: 250, independence_attested: true, effective_on: "2026-08-01" }
              as: ValuationAnalyst
              as_user_id: "va-1"
              captures: { income_opinion_id: "$.data.id", income_value: "$.data.concluded_value_cents" }
            - call: "GET /acquisitions/${acq_id}"
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_v2: "$.data.version" }
          trigger:
            - call: "POST /valuation-opinions"
              payload: { acquisition_id: "${acq_id}", expected_acquisition_version: "${acq_v2}", opinion_type: "FMV", method: "MARKET_APPROACH", normalized_ebitda_cents: 240000000, market_multiple_bps: 65000, independence_attested: true, effective_on: "2026-08-01" }
              as: ValuationAnalyst
              as_user_id: "va-1"
              captures: { market_opinion_id: "$.data.id" }
          assert:
            - "ValuationOpinion.${income_opinion_id}.concluded_value_cents == 2167511341"
            - "ValuationOpinion.${market_opinion_id}.concluded_value_cents == 1560000000"
            - "ValuationOpinion.${market_opinion_id}.concluded_value_cents - ValuationOpinion.${income_opinion_id}.concluded_value_cents == -607511341"
            - "ValuationOpinion.${income_opinion_id}.normalized_ebitda_cents == ValuationOpinion.${market_opinion_id}.normalized_ebitda_cents"
            - "ValuationOpinion.${income_opinion_id}.expires_on == 2027-08-01"
            - "ValuationOpinion.${market_opinion_id}.expires_on == 2027-08-01"
            - "ValuationOpinion.${income_opinion_id}.status == DRAFT"
            - "ValuationOpinion.${market_opinion_id}.status == DRAFT"
            - "ValuationOpinion.${market_opinion_id}.market_multiple_bps == 65000 and ValuationOpinion.${market_opinion_id}.projection_years is null"
            - "Acquisition.${acq_id}.version increments by 1 on each of the two POST /valuation-opinions calls"
            - "Acquisition.${acq_id}.purchase_price_cents is null (still DILIGENCE, nothing pinned)"

      - name: comp_percentile_tcc_vs_per_wrvu_diverges_on_same_physician_economics
        grounds:
          - calculations.compensation_benchmark_percentile
          - calculations.projected_total_cash_comp
          - entities.CompensationPlan.fields.benchmark_basis
          - entities.CompensationPlan.fields.benchmark_percentile
          - concurrency_rules[compensation-plan-create-stale-acquisition]
        distinguishing_aspect: |
          Two plans for the SAME physician land on identical
          projected_total_cash_comp_cents (34000000) and identical
          comp_per_wrvu_cents (8500), yet the BASE_PLUS_INCENTIVE plan benchmarks
          at 84.00 against the specialty total-cash-compensation quartiles while
          the WRVU_PRODUCTIVITY plan benchmarks at 91.07 against the
          dollars-per-wRVU quartiles — one is inside the FMV safe harbour and the
          other is outside it, on the same economics.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One Acquisition in deal_status DILIGENCE with one PRIMARY_CARE Physician."
            - "compliance_clearance is PENDING, so plan creation is not blocked."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_id: "$.data.id" }
            - call: "POST /physicians"
              payload: { acquisition_id: "${acq_id}", npi: "1548392017", full_name: "Amara Vance MD", specialty: "PRIMARY_CARE", board_certified: true, state_license_expires_on: "2028-06-30" }
              as: DealLead
              as_user_id: "dl-1"
              captures: { phys_id: "$.data.id" }
            - call: "POST /acquisitions/${acq_id}/status"
              payload: { target_status: "DILIGENCE" }
              as: DealLead
              as_user_id: "dl-1"
            - call: "GET /acquisitions/${acq_id}"
              as: CompensationDesigner
              as_user_id: "cd-1"
              captures: { acq_v1: "$.data.version" }
            - call: "POST /compensation-plans"
              payload: { acquisition_id: "${acq_id}", expected_acquisition_version: "${acq_v1}", physician_id: "${phys_id}", model_type: "BASE_PLUS_INCENTIVE", base_salary_cents: 6000000, conversion_factor_cents_per_wrvu: 7000, threshold_wrvu: 0, projected_annual_wrvu: 4000, includes_referral_credit: false, stark_exception: "BONA_FIDE_EMPLOYMENT", fmv_justification_on_file: false }
              as: CompensationDesigner
              as_user_id: "cd-1"
              captures: { salary_plan_id: "$.data.id" }
            - call: "GET /acquisitions/${acq_id}"
              as: CompensationDesigner
              as_user_id: "cd-1"
              captures: { acq_v2: "$.data.version" }
          trigger:
            - call: "POST /compensation-plans"
              payload: { acquisition_id: "${acq_id}", expected_acquisition_version: "${acq_v2}", physician_id: "${phys_id}", model_type: "WRVU_PRODUCTIVITY", conversion_factor_cents_per_wrvu: 8500, projected_annual_wrvu: 4000, includes_referral_credit: false, stark_exception: "BONA_FIDE_EMPLOYMENT", fmv_justification_on_file: false }
              as: CompensationDesigner
              as_user_id: "cd-1"
              captures: { wrvu_plan_id: "$.data.id" }
          assert:
            - "CompensationPlan.${salary_plan_id}.projected_total_cash_comp_cents == 34000000"
            - "CompensationPlan.${wrvu_plan_id}.projected_total_cash_comp_cents == 34000000"
            - "CompensationPlan.${salary_plan_id}.comp_per_wrvu_cents == 8500"
            - "CompensationPlan.${wrvu_plan_id}.comp_per_wrvu_cents == 8500"
            - "CompensationPlan.${salary_plan_id}.benchmark_basis == TOTAL_CASH_COMP"
            - "CompensationPlan.${wrvu_plan_id}.benchmark_basis == COMP_PER_WRVU"
            - "CompensationPlan.${salary_plan_id}.benchmark_percentile == 84.00"
            - "CompensationPlan.${wrvu_plan_id}.benchmark_percentile == 91.07"
            - "CompensationPlan.${salary_plan_id}.benchmark_percentile <= 90.00 (inside FMV_SAFE_HARBOR_PERCENTILE) while CompensationPlan.${wrvu_plan_id}.benchmark_percentile > 90.00"
            - "CompensationPlan.${salary_plan_id}.status == DRAFT and CompensationPlan.${wrvu_plan_id}.status == DRAFT"
            - "Physician.${phys_id}.employment_status == PROSPECTIVE"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  #   mode (b) → staff_wage_rounding_per_component_then_sum
  #   mode (c) → net_consideration_tier_pinned_to_gross_not_net
  #   mode (a) → retention_bonus_nested_min_max_with_criticality
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: staff_wage_rounding_per_component_then_sum
        grounds:
          - calculations.staff_offer_wage_harmonization
          - entities.StaffTransitionOffer.fields.uplift_component_cents
          - entities.StaffTransitionOffer.fields.pto_component_cents
          - entities.StaffTransitionOffer.fields.offered_annual_wage_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where the ORDER decides the cents. A BILLER
          on a legacy wage of 5282350 with 104 PTO hours produces raw components
          of 158470.5 and 132058.75; rounding each independently and then adding
          yields offered_annual_wage_cents 5572880, whereas summing the raws and
          rounding once yields 5572879. The scaffold pins round-per-component-then-sum,
          so 5572880 is the only correct answer and the one-cent alternative is a
          detectable wrong implementation.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One Acquisition in deal_status SOURCING; no StaffTransitionOffer exists yet."
            - "compliance_clearance is PENDING, so offer creation is not blocked."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_id: "$.data.id" }
          trigger:
            - call: "POST /staff-transition-offers"
              payload: { acquisition_id: "${acq_id}", staff_member_name: "Rosa Delgado", role_code: "BILLER", legacy_annual_wage_cents: 5282350, legacy_pto_hours: 104, credited_service_months: 84, offer_expires_on: "2026-10-31" }
              as: IntegrationManager
              as_user_id: "im-1"
              captures: { biller_offer_id: "$.data.id" }
          assert:
            - "StaffTransitionOffer.${biller_offer_id}.uplift_component_cents == 158471"
            - "StaffTransitionOffer.${biller_offer_id}.pto_component_cents == 132059"
            - "StaffTransitionOffer.${biller_offer_id}.offered_annual_wage_cents == 5572880"
            - "StaffTransitionOffer.${biller_offer_id}.offered_annual_wage_cents != 5572879 (the sum-then-round answer)"
            - "StaffTransitionOffer.${biller_offer_id}.offered_annual_wage_cents == 5282350 + StaffTransitionOffer.${biller_offer_id}.uplift_component_cents + StaffTransitionOffer.${biller_offer_id}.pto_component_cents"
            - "StaffTransitionOffer.${biller_offer_id}.wage_floor_applied == false"
            - "StaffTransitionOffer.${biller_offer_id}.retention_bonus_cents == 557288"
            - "StaffTransitionOffer.${biller_offer_id}.status == DRAFT"
            - "Acquisition.${acq_id}.retention_pool_committed_cents == 0 and Acquisition.${acq_id}.retention_pool_available_cents == 3000000"

      - name: net_consideration_tier_pinned_to_gross_not_net
        grounds:
          - calculations.deal_net_consideration
          - calculations.malpractice_tail_premium
          - state_machines.Acquisition.deal_status.DILIGENCE_to_BOARD_REVIEW
          - entities.Acquisition.fields.gross_consideration_cents
          - entities.Acquisition.fields.synergy_credit_bps
          - entities.Acquisition.fields.net_consideration_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with a pinned evaluation order.
          gross_consideration_cents 1500750000 sits 750000 cents ABOVE
          TIER_2_CEILING_CENTS, so synergy_credit_bps is 275; subtracting the
          resulting 41270625-cent credit drops net_consideration_cents to
          1459479375, which is BELOW that same ceiling. The tier is never
          re-selected from the net, so 1459479375 is correct and the
          re-tiered-from-net answer 1478858184 (150 bps) is wrong.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One Acquisition in deal_status DILIGENCE with one Physician, malpractice_policy_form OCCURRENCE (so tail_coverage_required is false and tail_premium_cents will be 0), escrow_committed_cents 0."
            - "One FMV MARKET_APPROACH ValuationOpinion in status ACCEPTED concluding 1450000000, prepared by va-1 and accepted by co-1."
            - "One COMMERCIAL_REASONABLENESS ValuationOpinion in status ACCEPTED with cr_conclusion REASONABLE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_id: "$.data.id" }
            - call: "POST /physicians"
              payload: { acquisition_id: "${acq_id}", npi: "1548392017", full_name: "Amara Vance MD", specialty: "PRIMARY_CARE", board_certified: true, state_license_expires_on: "2028-06-30" }
              as: DealLead
              as_user_id: "dl-1"
              captures: { phys_id: "$.data.id" }
            - call: "POST /acquisitions/${acq_id}/status"
              payload: { target_status: "DILIGENCE" }
              as: DealLead
              as_user_id: "dl-1"
            - call: "GET /acquisitions/${acq_id}"
              as: ValuationAnalyst
              as_user_id: "va-1"
              captures: { acq_v1: "$.data.version" }
            - call: "POST /valuation-opinions"
              payload: { acquisition_id: "${acq_id}", expected_acquisition_version: "${acq_v1}", opinion_type: "FMV", method: "MARKET_APPROACH", normalized_ebitda_cents: 290000000, market_multiple_bps: 50000, independence_attested: true, effective_on: "2026-08-01" }
              as: ValuationAnalyst
              as_user_id: "va-1"
              captures: { fmv_id: "$.data.id" }
            - call: "POST /valuation-opinions/${fmv_id}/status"
              payload: { target_status: "SUBMITTED" }
              as: ValuationAnalyst
              as_user_id: "va-1"
            - call: "POST /valuation-opinions/${fmv_id}/status"
              payload: { target_status: "ACCEPTED" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /acquisitions/${acq_id}"
              as: ValuationAnalyst
              as_user_id: "va-1"
              captures: { acq_v2: "$.data.version" }
            - call: "POST /valuation-opinions"
              payload: { acquisition_id: "${acq_id}", expected_acquisition_version: "${acq_v2}", opinion_type: "COMMERCIAL_REASONABLENESS", method: "NARRATIVE", cr_conclusion: "REASONABLE", independence_attested: true, effective_on: "2026-08-01" }
              as: ValuationAnalyst
              as_user_id: "va-1"
              captures: { cr_id: "$.data.id" }
            - call: "POST /valuation-opinions/${cr_id}/status"
              payload: { target_status: "SUBMITTED" }
              as: ValuationAnalyst
              as_user_id: "va-1"
            - call: "POST /valuation-opinions/${cr_id}/status"
              payload: { target_status: "ACCEPTED" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /acquisitions/${acq_id}/status"
              payload: { target_status: "BOARD_REVIEW" }
              as: DealLead
              as_user_id: "dl-1"
          assert:
            - "Acquisition.${acq_id}.deal_status == BOARD_REVIEW"
            - "ValuationOpinion.${fmv_id}.is_pinned == true"
            - "ValuationOpinion.${fmv_id}.concluded_value_cents == 1450000000"
            - "ValuationOpinion.${cr_id}.concluded_value_cents == 0"
            - "Acquisition.${acq_id}.purchase_price_cents == 1450000000"
            - "Acquisition.${acq_id}.tail_coverage_required == false and Acquisition.${acq_id}.tail_premium_cents == 0"
            - "Acquisition.${acq_id}.integration_reserve_cents == 50750000"
            - "Acquisition.${acq_id}.gross_consideration_cents == 1500750000"
            - "Acquisition.${acq_id}.synergy_credit_bps == 275"
            - "Acquisition.${acq_id}.synergy_credit_cents == 41270625"
            - "Acquisition.${acq_id}.net_consideration_cents == 1459479375"
            - "Acquisition.${acq_id}.net_consideration_cents != 1478858184 (the answer produced by re-selecting the tier from net)"
            - "Acquisition.${acq_id}.net_consideration_cents < 1500000000 while Acquisition.${acq_id}.gross_consideration_cents >= 1500000000"

      - name: retention_bonus_nested_min_max_with_criticality
        grounds:
          - calculations.retention_bonus_award
          - calculations.staff_offer_wage_harmonization
          - entities.StaffTransitionOffer.fields.retention_bonus_cents
          - entities.StaffTransitionOffer.fields.wage_floor_applied
        distinguishing_aspect: |
          Mode (a) — four interacting inputs (role_code, legacy wage, PTO hours,
          credited_service_months) feed a tier selection, a criticality
          multiplier applied to the ALREADY-ROUNDED tier award, and a nested
          min(cap, max(floor, adjusted)) clamp. FRONT_DESK at 6 months clamps UP
          to BONUS_FLOOR_CENTS 100000, PRACTICE_MANAGER at 200 months clamps DOWN
          to BONUS_CAP_CENTS 1500000, and RN at 130 months lands strictly inside
          the band at 1187154 — all three branches of the same nested clamp.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One Acquisition in deal_status SOURCING with retention_pool_total_cents 3000000."
            - "Two StaffTransitionOffer rows already created in status DRAFT (FRONT_DESK and PRACTICE_MANAGER); DRAFT offers reserve nothing from the pool."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_id: "$.data.id" }
            - call: "POST /staff-transition-offers"
              payload: { acquisition_id: "${acq_id}", staff_member_name: "Tomas Reyes", role_code: "FRONT_DESK", legacy_annual_wage_cents: 3400000, legacy_pto_hours: 0, credited_service_months: 6, offer_expires_on: "2026-10-31" }
              as: IntegrationManager
              as_user_id: "im-1"
              captures: { fd_offer_id: "$.data.id" }
            - call: "POST /staff-transition-offers"
              payload: { acquisition_id: "${acq_id}", staff_member_name: "Grace Okonkwo", role_code: "PRACTICE_MANAGER", legacy_annual_wage_cents: 12000000, legacy_pto_hours: 160, credited_service_months: 200, offer_expires_on: "2026-10-31" }
              as: IntegrationManager
              as_user_id: "im-1"
              captures: { pm_offer_id: "$.data.id" }
          trigger:
            - call: "POST /staff-transition-offers"
              payload: { acquisition_id: "${acq_id}", staff_member_name: "Dana Whitfield", role_code: "RN", legacy_annual_wage_cents: 8000000, legacy_pto_hours: 80, credited_service_months: 130, offer_expires_on: "2026-10-31" }
              as: IntegrationManager
              as_user_id: "im-1"
              captures: { rn_offer_id: "$.data.id" }
          assert:
            - "StaffTransitionOffer.${fd_offer_id}.offered_annual_wage_cents == 3600000 and StaffTransitionOffer.${fd_offer_id}.wage_floor_applied == true"
            - "StaffTransitionOffer.${fd_offer_id}.retention_bonus_cents == 100000 (raw tier award 72000 clamped UP to BONUS_FLOOR_CENTS)"
            - "StaffTransitionOffer.${pm_offer_id}.offered_annual_wage_cents == 13421538 and StaffTransitionOffer.${pm_offer_id}.wage_floor_applied == false"
            - "StaffTransitionOffer.${pm_offer_id}.retention_bonus_cents == 1500000 (adjusted 1845461 clamped DOWN to BONUS_CAP_CENTS)"
            - "StaffTransitionOffer.${rn_offer_id}.uplift_component_cents == 480000"
            - "StaffTransitionOffer.${rn_offer_id}.pto_component_cents == 153846"
            - "StaffTransitionOffer.${rn_offer_id}.offered_annual_wage_cents == 8633846 and StaffTransitionOffer.${rn_offer_id}.wage_floor_applied == false"
            - "StaffTransitionOffer.${rn_offer_id}.retention_bonus_cents == 1187154 (tier 1100 bps -> 949723, then CRITICAL_ROLE_MULTIPLIER_BPS 12500 -> 1187154, inside both clamps)"
            - "StaffTransitionOffer.${pm_offer_id}.retention_bonus_cents != 1845461 (the unclamped adjusted award) and StaffTransitionOffer.${fd_offer_id}.retention_bonus_cents != 72000 (the unclamped raw award)"
            - "Acquisition.${acq_id}.retention_pool_available_cents == 3000000 (all three offers still DRAFT)"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  #   Acquisition (deal_status cycle + parallel clearance dimension)
  #   CompensationPlan (bounded revision cycle terminating in WITHDRAWN)
  #   EhrMigrationBatch (fail/requeue cycle terminating in ABORTED)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: acquisition_board_review_returns_to_diligence_and_unpins_valuation
        grounds:
          - state_machines.Acquisition.deal_status.DILIGENCE_to_BOARD_REVIEW
          - state_machines.Acquisition.deal_status.BOARD_REVIEW_to_DILIGENCE
          - calculations.deal_net_consideration
          - calculations.compensation_plan_revision_limit
          - entities.ValuationOpinion.fields.is_pinned
        distinguishing_aspect: |
          The Acquisition.deal_status machine cycles DILIGENCE -> BOARD_REVIEW ->
          DILIGENCE on the SAME row, and the backward edge is not a no-op: it
          unpins the FMV opinion, nulls all five consideration fields the forward
          edge computed, and returns the SUBMITTED compensation plan to DRAFT with
          returned_count 1. Re-entering BOARD_REVIEW recomputes every one of those
          fields to the identical values, proving the cycle is idempotent in the
          forward direction and compensating in the backward one.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One Acquisition in deal_status BOARD_REVIEW with one Physician."
            - "One pinned ACCEPTED FMV MARKET_APPROACH opinion concluding 1450000000 and one ACCEPTED REASONABLE COMMERCIAL_REASONABLENESS opinion."
            - "One CompensationPlan in status SUBMITTED with returned_count 0; no plan is EXECUTED, which the backward edge requires."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_id: "$.data.id" }
            - call: "POST /physicians"
              payload: { acquisition_id: "${acq_id}", npi: "1548392017", full_name: "Amara Vance MD", specialty: "PRIMARY_CARE", board_certified: true, state_license_expires_on: "2028-06-30" }
              as: DealLead
              as_user_id: "dl-1"
              captures: { phys_id: "$.data.id" }
            - call: "POST /acquisitions/${acq_id}/status"
              payload: { target_status: "DILIGENCE" }
              as: DealLead
              as_user_id: "dl-1"
            - call: "GET /acquisitions/${acq_id}"
              as: ValuationAnalyst
              as_user_id: "va-1"
              captures: { acq_v1: "$.data.version" }
            - call: "POST /valuation-opinions"
              payload: { acquisition_id: "${acq_id}", expected_acquisition_version: "${acq_v1}", opinion_type: "FMV", method: "MARKET_APPROACH", normalized_ebitda_cents: 290000000, market_multiple_bps: 50000, independence_attested: true, effective_on: "2026-08-01" }
              as: ValuationAnalyst
              as_user_id: "va-1"
              captures: { fmv_id: "$.data.id" }
            - call: "POST /valuation-opinions/${fmv_id}/status"
              payload: { target_status: "SUBMITTED" }
              as: ValuationAnalyst
              as_user_id: "va-1"
            - call: "POST /valuation-opinions/${fmv_id}/status"
              payload: { target_status: "ACCEPTED" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /acquisitions/${acq_id}"
              as: ValuationAnalyst
              as_user_id: "va-1"
              captures: { acq_v2: "$.data.version" }
            - call: "POST /valuation-opinions"
              payload: { acquisition_id: "${acq_id}", expected_acquisition_version: "${acq_v2}", opinion_type: "COMMERCIAL_REASONABLENESS", method: "NARRATIVE", cr_conclusion: "REASONABLE", independence_attested: true, effective_on: "2026-08-01" }
              as: ValuationAnalyst
              as_user_id: "va-1"
              captures: { cr_id: "$.data.id" }
            - call: "POST /valuation-opinions/${cr_id}/status"
              payload: { target_status: "SUBMITTED" }
              as: ValuationAnalyst
              as_user_id: "va-1"
            - call: "POST /valuation-opinions/${cr_id}/status"
              payload: { target_status: "ACCEPTED" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /acquisitions/${acq_id}"
              as: CompensationDesigner
              as_user_id: "cd-1"
              captures: { acq_v3: "$.data.version" }
            - call: "POST /compensation-plans"
              payload: { acquisition_id: "${acq_id}", expected_acquisition_version: "${acq_v3}", physician_id: "${phys_id}", model_type: "BASE_PLUS_INCENTIVE", base_salary_cents: 20000000, conversion_factor_cents_per_wrvu: 7000, threshold_wrvu: 3000, projected_annual_wrvu: 4400, includes_referral_credit: false, stark_exception: "BONA_FIDE_EMPLOYMENT", fmv_justification_on_file: false }
              as: CompensationDesigner
              as_user_id: "cd-1"
              captures: { plan_id: "$.data.id" }
            - call: "POST /compensation-plans/${plan_id}/status"
              payload: { target_status: "SUBMITTED" }
              as: CompensationDesigner
              as_user_id: "cd-1"
            - call: "POST /acquisitions/${acq_id}/status"
              payload: { target_status: "BOARD_REVIEW" }
              as: DealLead
              as_user_id: "dl-1"
          trigger:
            - call: "POST /acquisitions/${acq_id}/status"
              payload: { target_status: "DILIGENCE" }
              as: DealLead
              as_user_id: "dl-1"
          assert:
            - "Acquisition.${acq_id}.deal_status == DILIGENCE"
            - "ValuationOpinion.${fmv_id}.is_pinned == false and ValuationOpinion.${fmv_id}.status == ACCEPTED"
            - "Acquisition.${acq_id}.purchase_price_cents is null"
            - "Acquisition.${acq_id}.integration_reserve_cents is null"
            - "Acquisition.${acq_id}.gross_consideration_cents is null"
            - "Acquisition.${acq_id}.synergy_credit_bps is null and Acquisition.${acq_id}.synergy_credit_cents is null"
            - "Acquisition.${acq_id}.net_consideration_cents is null"
            - "CompensationPlan.${plan_id}.status == DRAFT"
            - "CompensationPlan.${plan_id}.returned_count == 1"
            - "CompensationPlan.${plan_id}.projected_total_cash_comp_cents == 29800000 and CompensationPlan.${plan_id}.benchmark_percentile == 68.33 (unchanged by the return)"
            - "A second POST /acquisitions/${acq_id}/status with target_status BOARD_REVIEW as DealLead restores gross_consideration_cents == 1500750000, synergy_credit_bps == 275 and net_consideration_cents == 1459479375, and re-sets ValuationOpinion.${fmv_id}.is_pinned == true"
            - "Acquisition.${acq_id}.compliance_clearance == PENDING throughout (the parallel dimension is untouched by the deal_status cycle)"

      - name: comp_plan_return_cycle_terminates_as_withdrawn_after_two_returns
        grounds:
          - state_machines.CompensationPlan.status.SUBMITTED_to_DRAFT
          - state_machines.CompensationPlan.status.SUBMITTED_to_WITHDRAWN
          - calculations.compensation_plan_revision_limit
          - entities.CompensationPlan.fields.returned_count
          - entities.Physician.fields.employment_status
        distinguishing_aspect: |
          CompensationPlan.status loops SUBMITTED -> DRAFT -> SUBMITTED exactly
          MAX_PLAN_RETURNS (2) times; the third identical request with
          target_status DRAFT does NOT cycle again but lands the plan in the
          terminal WITHDRAWN state with returned_count 3. The same trigger word
          therefore produces two different target states depending on a counter,
          which no linear pipeline can express — and the entity is
          CompensationPlan, not the Acquisition of the previous instance.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One Acquisition in deal_status DILIGENCE with one Physician."
            - "One CompensationPlan that has already been returned twice and re-submitted twice: status SUBMITTED, returned_count 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_id: "$.data.id" }
            - call: "POST /physicians"
              payload: { acquisition_id: "${acq_id}", npi: "1548392017", full_name: "Amara Vance MD", specialty: "PRIMARY_CARE", board_certified: true, state_license_expires_on: "2028-06-30" }
              as: DealLead
              as_user_id: "dl-1"
              captures: { phys_id: "$.data.id" }
            - call: "POST /acquisitions/${acq_id}/status"
              payload: { target_status: "DILIGENCE" }
              as: DealLead
              as_user_id: "dl-1"
            - call: "GET /acquisitions/${acq_id}"
              as: CompensationDesigner
              as_user_id: "cd-1"
              captures: { acq_v1: "$.data.version" }
            - call: "POST /compensation-plans"
              payload: { acquisition_id: "${acq_id}", expected_acquisition_version: "${acq_v1}", physician_id: "${phys_id}", model_type: "BASE_PLUS_INCENTIVE", base_salary_cents: 20000000, conversion_factor_cents_per_wrvu: 7000, threshold_wrvu: 3000, projected_annual_wrvu: 4400, includes_referral_credit: false, stark_exception: "BONA_FIDE_EMPLOYMENT", fmv_justification_on_file: false }
              as: CompensationDesigner
              as_user_id: "cd-1"
              captures: { plan_id: "$.data.id" }
            - call: "POST /compensation-plans/${plan_id}/status"
              payload: { target_status: "SUBMITTED" }
              as: CompensationDesigner
              as_user_id: "cd-1"
            - call: "POST /compensation-plans/${plan_id}/status"
              payload: { target_status: "DRAFT", review_note: "First redraft requested." }
              as: ComplianceOfficer
              as_user_id: "co-2"
            - call: "POST /compensation-plans/${plan_id}/status"
              payload: { target_status: "SUBMITTED" }
              as: CompensationDesigner
              as_user_id: "cd-1"
            - call: "POST /compensation-plans/${plan_id}/status"
              payload: { target_status: "DRAFT", review_note: "Second redraft requested." }
              as: ComplianceOfficer
              as_user_id: "co-2"
            - call: "POST /compensation-plans/${plan_id}/status"
              payload: { target_status: "SUBMITTED" }
              as: CompensationDesigner
              as_user_id: "cd-1"
          trigger:
            - call: "POST /compensation-plans/${plan_id}/status"
              payload: { target_status: "DRAFT", review_note: "Third redraft requested." }
              as: ComplianceOfficer
              as_user_id: "co-2"
          assert:
            - "CompensationPlan.${plan_id}.status == WITHDRAWN (not DRAFT)"
            - "CompensationPlan.${plan_id}.returned_count == 3"
            - "Physician.${phys_id}.employment_status == PROSPECTIVE (recomputed; no APPROVED or EXECUTED plan remains)"
            - "After the first return CompensationPlan.${plan_id}.status was DRAFT with returned_count == 1"
            - "After the second return CompensationPlan.${plan_id}.status was DRAFT with returned_count == 2"
            - "A further POST /compensation-plans/${plan_id}/status with target_status SUBMITTED as CompensationDesigner returns ERR_INVALID_STATE_TRANSITION (409) — WITHDRAWN is terminal"
            - "Acquisition.${acq_id}.deal_status == DILIGENCE and compliance_clearance == PENDING (unaffected)"

      - name: ehr_batch_failed_requeue_cycle_aborts_after_two_retries
        grounds:
          - state_machines.EhrMigrationBatch.status.LOADED_to_FAILED
          - state_machines.EhrMigrationBatch.status.FAILED_to_STAGED
          - state_machines.EhrMigrationBatch.status.LOADED_to_ABORTED
          - calculations.ehr_reconciliation_match_rate
          - entities.EhrMigrationBatch.fields.retry_count
        distinguishing_aspect: |
          EhrMigrationBatch.status loops STAGED -> EXTRACTED -> LOADED -> FAILED ->
          STAGED twice and then, on the third identical RECONCILE with the same
          sub-threshold counts, branches to the terminal ABORTED instead of FAILED
          because retry_count has reached MAX_MIGRATION_RETRIES. The entity is
          EhrMigrationBatch — a third distinct entity from the Acquisition and
          CompensationPlan cycles above — and the fork is on a counter rather than
          on the submitted payload.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One Acquisition in deal_status SOURCING."
            - "One EhrMigrationBatch with record_count 20000 that has already failed reconciliation twice and been requeued twice: status LOADED, retry_count 2, validated_count 0, defect_count 0, unprocessed_count 20000, match_rate_bps 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_id: "$.data.id" }
            - call: "POST /ehr-migration-batches"
              payload: { acquisition_id: "${acq_id}", batch_label: "CHARTS-A", source_system: "ECLINICALWORKS", chart_type: "STRUCTURED", record_count: 20000, contains_minor_records: false, last_encounter_on: "2026-07-15" }
              as: IntegrationManager
              as_user_id: "im-1"
              captures: { batch_id: "$.data.id" }
            - call: "POST /ehr-migration-batches/${batch_id}/progress"
              payload: { action: "EXTRACT" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /ehr-migration-batches/${batch_id}/progress"
              payload: { action: "LOAD" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /ehr-migration-batches/${batch_id}/progress"
              payload: { action: "RECONCILE", validated_count: 19899, defect_count: 101 }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /ehr-migration-batches/${batch_id}/progress"
              payload: { action: "REQUEUE" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /ehr-migration-batches/${batch_id}/progress"
              payload: { action: "EXTRACT" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /ehr-migration-batches/${batch_id}/progress"
              payload: { action: "LOAD" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /ehr-migration-batches/${batch_id}/progress"
              payload: { action: "RECONCILE", validated_count: 19899, defect_count: 101 }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /ehr-migration-batches/${batch_id}/progress"
              payload: { action: "REQUEUE" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /ehr-migration-batches/${batch_id}/progress"
              payload: { action: "EXTRACT" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /ehr-migration-batches/${batch_id}/progress"
              payload: { action: "LOAD" }
              as: IntegrationManager
              as_user_id: "im-1"
          trigger:
            - call: "POST /ehr-migration-batches/${batch_id}/progress"
              payload: { action: "RECONCILE", validated_count: 19899, defect_count: 101 }
              as: IntegrationManager
              as_user_id: "im-1"
          assert:
            - "EhrMigrationBatch.${batch_id}.status == ABORTED (not FAILED)"
            - "EhrMigrationBatch.${batch_id}.retry_count == 3"
            - "EhrMigrationBatch.${batch_id}.match_rate_bps == 9949"
            - "EhrMigrationBatch.${batch_id}.validated_count == 19899 and defect_count == 101 and unprocessed_count == 0"
            - "After the first RECONCILE the batch was FAILED with retry_count == 1 and match_rate_bps == 9949"
            - "After the first REQUEUE the batch was STAGED with validated_count == 0, defect_count == 0, unprocessed_count == 20000 and match_rate_bps == 0"
            - "After the second RECONCILE the batch was FAILED with retry_count == 2"
            - "A further POST /ehr-migration-batches/${batch_id}/progress with action REQUEUE returns ERR_INVALID_STATE_TRANSITION (409) — ABORTED is terminal"
            - "EhrMigrationBatch.${batch_id}.retention_years == 10 and legacy_purge_eligible_on == 2036-07-15"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  #   depth 3 : POST /performance-reports
  #   depth 2 : POST /payer-contracts/{contractId}/novation with action DENY
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: performance_report_true_up_flags_acquisition_and_returns_pending_plans
        grounds:
          - calculations.comp_true_up
          - state_machines.CompensationPlan.status.EXECUTED_to_COMPLIANCE_HOLD
          - state_machines.Acquisition.compliance_clearance.CLEARED_to_FLAGGED
          - state_machines.CompensationPlan.status.SUBMITTED_to_DRAFT
          - calculations.compensation_plan_revision_limit
        distinguishing_aspect: |
          Depth-3 chain in which every link is caused by the previous link, not by
          the original request: POST /performance-reports re-benchmarks plan A to
          95.45 which moves plan A EXECUTED -> COMPLIANCE_HOLD (link 1); that plan
          transition sets Acquisition.compliance_clearance CLEARED -> FLAGGED
          (link 2); that clearance transition returns the unrelated plan C from
          SUBMITTED -> DRAFT with returned_count 1 (link 3). The report itself
          never touches plan C or the clearance field.
