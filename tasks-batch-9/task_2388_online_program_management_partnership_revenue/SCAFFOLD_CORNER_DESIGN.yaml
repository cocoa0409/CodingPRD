  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_partnership_version_on_statement_create_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[statement-create-stale-partnership]
          - errors[ERR_STALE_PARTNERSHIP_VERSION]
        distinguishing_aspect: "The first OCC rule guards statement creation: a terms amendment slipped in between the read and the write advanced Partnership.version from 3 to 4, so the statement create still carrying 3 is rejected with 412 and no statement row appears."
        test_recipe:
          setup:
            - "EXECUTED Partnership (version 3) with a paid ACTIVE Enrollment; clock at 2026-10-01."
            - "The bursar reads version 3, then the partner amends the marketing budget, taking the Partnership to version 4."
          setup_api_calls:
            - *k_clock
            - *k_ps_create
            - *k_ps_submit
            - *k_ps_execute
            - *k_pg_create
            - *k_course_create
            - *k_course_start
            - *k_course_submit
            - *k_course_approve
            - *k_scope_marketing
            - *k_pg_submit
            - *k_pg_approve
            - *k_pg_launch
            - *k_co_create
            - *k_co_plan
            - *k_co_review
            - *k_lead_create
            - *k_lead_contact
            - *k_lead_apply
            - *k_enroll
            - *k_clock_sep5
            - *k_pay_full
            - *k_clock_oct1
            - *k_get_ps_v
            - *k_terms_amend_tiers
          trigger:
            - call: "POST /partnerships/${ps_id}/remittance-statements"
              payload: { period_start: "2026-09-01", period_end: "2026-09-30", expected_partnership_version: "${ps_v}" }
              as: UniversityBursar
              as_user_id: "bursar-1"
              captures: { o1: $.data.error_id }
          assert:
            - "response status == 412"
            - "${o1} == ERR_STALE_PARTNERSHIP_VERSION"
            - "Partnership.${ps_id}.version == 4"
            - "Partnership.${ps_id}.open_statement_count == 0"

      - name: stale_partnership_version_on_terms_patch_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[terms-patch-stale-partnership]
          - errors[ERR_STALE_PARTNERSHIP_VERSION]
        distinguishing_aspect: "The second OCC rule guards the amendment endpoint against itself: two amendments computed from the same read of version 3 are indistinguishable by state, so the first succeeds and the replay of the second is rejected with 412 and the tiers from the first amendment survive."
        test_recipe:
          setup:
            - "EXECUTED Partnership at version 3, read once by the partner."
            - "A first amendment replaced the revenue_share_tiers and took the Partnership to version 4."
          setup_api_calls:
            - *k_clock
            - *k_ps_create
            - *k_ps_submit
            - *k_ps_execute
            - *k_get_ps_v
            - *k_terms_amend_tiers
          trigger:
            - call: "PATCH /partnerships/${ps_id}/terms"
              payload: { expected_partnership_version: "${ps_v}", marketing_budget_cents: 5000000 }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
              captures: { o2: $.data.error_id }
          assert:
            - "response status == 412"
            - "${o2} == ERR_STALE_PARTNERSHIP_VERSION"
            - "Partnership.${ps_id}.version == 4"
            - "Partnership.${ps_id}.marketing_budget_cents == 4000000"

      - name: partnership_version_increments_on_every_successful_write
        claim_type: optimistic_concurrency
        grounds:
          - entities.Partnership.fields.version
          - endpoints[POST /partnerships/{id}/contract-actions]
          - endpoints[PATCH /partnerships/{id}/terms]
        distinguishing_aspect: "Version is a write counter, not a status counter: creation, SUBMIT_FOR_REVIEW, EXECUTE, a terms amendment and a statement cut each add exactly one, so five successful writes leave the Partnership at version 5 even though only three of them changed status."
        test_recipe:
          setup:
            - "EXECUTED Partnership at version 3 with a paid ACTIVE Enrollment; clock at 2026-10-01; one terms amendment applied (version 4)."
          setup_api_calls:
            - *k_clock
            - *k_ps_create
            - *k_ps_submit
            - *k_ps_execute
            - *k_pg_create
            - *k_course_create
            - *k_course_start
            - *k_course_submit
            - *k_course_approve
            - *k_scope_marketing
            - *k_pg_submit
            - *k_pg_approve
            - *k_pg_launch
            - *k_co_create
            - *k_co_plan
            - *k_co_review
            - *k_lead_create
            - *k_lead_contact
            - *k_lead_apply
            - *k_enroll
            - *k_clock_sep5
            - *k_pay_full
            - *k_clock_oct1
            - *k_get_ps_v
            - *k_terms_amend_tiers
            - *k_get_ps_v3
          trigger:
            - call: "POST /partnerships/${ps_id}/remittance-statements"
              payload: { period_start: "2026-09-01", period_end: "2026-09-30", expected_partnership_version: "${ps_v3}" }
              as: UniversityBursar
              as_user_id: "bursar-1"
              captures: { st_v_id: $.data.id }
          assert:
            - "response status == 201"
            - "${ps_v} == 3"
            - "${ps_v3} == 4"
            - "Partnership.${ps_id}.version == 5"
            - "Partnership.${ps_id}.status == EXECUTED"
            - "RemittanceStatement.${st_v_id}.status == CALCULATED"

      - name: lead_listing_combines_status_filter_with_offset_paging
        claim_type: pagination_with_filtering
        grounds:
          - endpoints[GET /leads]
          - response_envelope.pagination_fields
        distinguishing_aspect: "Filter is applied before paging, not after: of three Leads only two are CONTACTED, so status=CONTACTED&limit=1&offset=1 returns the second CONTACTED lead with total_count 2 and has_more false — a post-paging filter would have reported total_count 3."
        test_recipe:
          setup:
            - "LAUNCHED Program with three Leads for one counselor: P-1001 ENROLLED, P-1002 CONTACTED, P-1003 CONTACTED (created in that order)."
          setup_api_calls:
