            - { call: "POST /air-freight/screening-records/${srr2}/resolve", payload: { outcome: "REJECTED", rejection_reason: "x-ray alarm" }, as: ComplianceOfficer, as_user_id: "comp-1" }
            - { call: "POST /air-freight/house-waybills", payload: { shipper_id: "${sh1}", hwb_number: "HWB-R3", origin_code: "SFO", destination_code: "NRT", pieces: 1, gross_weight_kg: 10.0, declared_volume_m3: 0.05, dg_flag: false }, as: ForwarderOps, captures: { r3: "$.data.id" } }
            - { call: "POST /air-freight/house-waybills/${r3}/submit", as: ForwarderOps, as_user_id: "ops-1" }
            - { call: "GET /air-freight/house-waybills/${r3}/screening-records", as: ForwarderOps, captures: { srr3: "$.data[0].id" } }
            - { call: "POST /air-freight/screening-records/${srr3}/resolve", payload: { outcome: "REJECTED", rejection_reason: "x-ray alarm" }, as: ComplianceOfficer, as_user_id: "comp-1" }
            - { call: "POST /air-freight/flight-bookings", payload: { airline_code: "UA", flight_number: "UA838", origin_code: "SFO", destination_code: "NRT", scheduled_departure_utc: "2026-08-10T10:00:00Z", cutoff_utc: "2026-08-09T10:00:00Z", booked_weight_kg: 500.0, booked_volume_m3: 50.0 }, as: CapacityPlanner, captures: { bk1: "$.data.id" } }
            - { call: "POST /air-freight/master-waybills", payload: { booking_id: "${bk1}", mawb_number: "180-12345675" }, as: CapacityPlanner, captures: { mb1: "$.data.id" } }
            - { call: "POST /air-freight/master-waybills/${mb1}/open", as: CapacityPlanner }
            - { call: "GET /air-freight/master-waybills/${mb1}", as: ForwarderOps, captures: { mv1: "$.data.version" } }
          trigger:
            - { call: "POST /air-freight/master-waybills/${mb1}/house-waybills", payload: { hwb_id: "${hwx}", expected_master_waybill_version: "${mv1}" }, as: ForwarderOps, captures: { err: "$.data.error_id" } }
          assert:
            - "Shipper.${sh1}.known_shipper_status == SUSPENDED at trigger time (both failures armed: HWB-DGX in SCREENING and shipper not KNOWN)"
            - "captured ${err} == ERR_HWB_NOT_CLEARED (state, priority 5) and NOT ERR_SHIPPER_NOT_KNOWN (business_safety, priority 6)"
            - "HouseWaybill.${hwx}.status == SCREENING unchanged; MasterWaybill.${mb1}.version unchanged (no side effects fired)"

      - name: safety_beats_fiscal_on_consolidation
        grounds:
          - validations[priority=6]
          - validations[priority=11]
        distinguishing_aspect: |
          Error-category pair business_safety vs business_fiscal (different pair
          than state-vs-safety): a CLEARED dg waybill whose shipper has since
          been SUSPENDED, consolidated into a booking too small for it — both
          ERR_SHIPPER_NOT_KNOWN (priority 6) and ERR_CAPACITY_EXCEEDED
          (priority 11) are armed; the safety error must win.
        test_recipe:
          setup:
            - "Shipper ACME KNOWN; HWB-DGY dg_flag true, submitted and BOTH screenings CLEARED (status CLEARED)"
            - "Three other waybills screened REJECTED so ACME is now SUSPENDED"
            - "SFO->NRT rate agreement exists; booking UA859 50/50 OPEN (too small: waybill chargeable 100.0 kg); MAWB open"
          setup_api_calls:
            - { call: "POST /air-freight/shippers", payload: { name: "Acme Exports", account_code: "ACME" }, as: ForwarderOps, captures: { sh1: "$.data.id" } }
            - { call: "POST /air-freight/shippers/${sh1}/verify-known-shipper", as: ComplianceOfficer }
            - { call: "POST /air-freight/rate-agreements", payload: { shipper_id: "${sh1}", origin_code: "SFO", destination_code: "NRT", weight_breaks: [ { min_weight_kg: 0, rate_per_kg: 5.00 } ], min_charge_amount: 250.00, fuel_surcharge_pct: 0.125, security_fee_amount: 25.00, spot_surcharge_pct: 0, valid_from_utc: "2026-01-01T00:00:00Z", valid_to_utc: "2027-01-01T00:00:00Z" }, as: PricingManager }
            - { call: "POST /air-freight/house-waybills", payload: { shipper_id: "${sh1}", hwb_number: "HWB-DGY", origin_code: "SFO", destination_code: "NRT", pieces: 2, gross_weight_kg: 80.0, declared_volume_m3: 0.60, dg_flag: true }, as: ForwarderOps, captures: { hwy: "$.data.id" } }
            - { call: "POST /air-freight/house-waybills/${hwy}/submit", as: ForwarderOps, as_user_id: "ops-1" }
            - { call: "GET /air-freight/house-waybills/${hwy}/screening-records", as: ForwarderOps, captures: { sy_sec: "$.data[0].id", sy_dg: "$.data[1].id" } }
            - { call: "POST /air-freight/screening-records/${sy_sec}/resolve", payload: { outcome: "CLEARED" }, as: ComplianceOfficer, as_user_id: "comp-1" }
            - { call: "POST /air-freight/screening-records/${sy_dg}/resolve", payload: { outcome: "CLEARED" }, as: ComplianceOfficer, as_user_id: "comp-1" }
            - { call: "POST /air-freight/house-waybills", payload: { shipper_id: "${sh1}", hwb_number: "HWB-R1", origin_code: "SFO", destination_code: "NRT", pieces: 1, gross_weight_kg: 10.0, declared_volume_m3: 0.05, dg_flag: false }, as: ForwarderOps, captures: { r1: "$.data.id" } }
            - { call: "POST /air-freight/house-waybills/${r1}/submit", as: ForwarderOps, as_user_id: "ops-1" }
