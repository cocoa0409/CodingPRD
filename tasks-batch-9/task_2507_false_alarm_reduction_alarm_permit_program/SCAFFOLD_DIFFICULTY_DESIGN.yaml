  # =========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: permit_expiry_cascades_through_unpermitted_status_penalty_invoice_and_a_sibling_permit_block
        grounds:
          - state_machines.AlarmPermit.GRACE_to_EXPIRED
          - state_machines.AlarmSystem.PERMITTED_to_UNPERMITTED
          - state_machines.AlarmPermit.RENEWAL_DUE_to_RENEWAL_BLOCKED
          - calculations.site_balance_rollup
          - calculations.invoice_assembly
          - validations[priority=55]
        distinguishing_aspect: >-
          One nightly run must walk three hops in order: permit A GRACE -> EXPIRED, then its system
          PERMITTED -> UNPERMITTED with a 63000-cent UNPERMITTED_OPERATION_PENALTY invoice, then the
          resulting 79000-cent site balance flipping renewal_block_active and dragging the unrelated
          sibling permit B from RENEWAL_DUE to RENEWAL_BLOCKED — a permit that nothing in the
          request touched directly.
        test_recipe:
          setup:
            - "One ACTIVE FeeSchedule with permit_term_days 30, renewal_grace_days 10, unpermitted_operation_penalty_cents 60000, delinquent_balance_block_cents 50000 and invoice_due_days 3650 (so no dunning noise enters the balance)."
            - "One COMMERCIAL AlarmSite with two ACTIVE ECV-callable contacts and two systems approved on 2026-01-01: permit A and permit B, both term_end_at 2026-01-31, grace_through_at 2026-02-10. Balance 11000."
            - "Nightly 2026-01-05 moves both permits ACTIVE -> RENEWAL_DUE; nightly 2026-02-01 moves both RENEWAL_DUE -> GRACE."
            - "Permit B is renewed on 2026-02-05 out of GRACE (days_late 5 -> the 1500-cent tier), invoiced 4500 + 500 admin = 5000, so the site balance is 16000 and B's new term_end_at is 2026-03-07."
            - "Nightly 2026-02-06 moves B ACTIVE -> RENEWAL_DUE again (clock >= term_end_at - 30 days) while permit A is still curable in GRACE."
          setup_api_calls:
            - {call: "POST /false-alarm-program/_clock/set_current_utc", payload: {current_utc: "2026-01-01T00:00:00Z"}, as: ProgramAdministrator}
            - call: "POST /false-alarm-program/fee-schedules"
              payload: {<<: *fs_base, schedule_code: "FS-2507-CASC", effective_from: "2026-01-01T00:00:00Z", permit_term_days: 30, renewal_grace_days: 10, unpermitted_operation_penalty_cents: 60000, invoice_due_days: 3650}
              as: ProgramAdministrator
              captures: {sched_id: $.data.id}
            - {call: "POST /false-alarm-program/fee-schedules/${sched_id}/activate", payload: {}, as: ProgramAdministrator}
            - {call: "POST /false-alarm-program/alarm-companies", payload: {legal_name: "Cascade Alarm Partners", license_number: "AC-2507-CS", contact_email: "ops@cascadealarm2507.example", contact_phone: "+15550101001", score_mode: "PERIOD_EQUAL"}, as: ProgramAdministrator, captures: {company_id: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-sites", payload: {address_key: "2507-CS-500-CASCADE-BLVD", street_address: "500 Cascade Blvd", city: "Fairview", zip_code: "44011", occupancy_class: "COMMERCIAL", police_beat: "B02"}, as: PermitClerk, captures: {site_id: $.data.id}}
            - {call: "POST /false-alarm-program/site-contacts", payload: {alarm_site_id: "${site_id}", full_name: "Lena Ortiz", phone_number: "+15550101002", relationship: "MANAGER", contact_priority: 1, is_ecv_callable: true}, as: PermitClerk, captures: {c1: $.data.id}}
            - {call: "POST /false-alarm-program/site-contacts", payload: {alarm_site_id: "${site_id}", full_name: "Cy Trent", phone_number: "+15550101003", relationship: "KEYHOLDER", contact_priority: 2, is_ecv_callable: true}, as: PermitClerk, captures: {c2: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-systems", payload: {alarm_site_id: "${site_id}", monitoring_company_id: "${company_id}", system_type: "BURGLARY", zone_count: 11, ecv_enabled: true, verified_response_mode: "NONE", installed_at: "2025-12-01T00:00:00Z"}, as: ProgramAdministrator, captures: {sysA: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-systems", payload: {alarm_site_id: "${site_id}", monitoring_company_id: "${company_id}", system_type: "HOLDUP", zone_count: 3, ecv_enabled: true, verified_response_mode: "NONE", installed_at: "2025-12-01T00:00:00Z"}, as: ProgramAdministrator, captures: {sysB: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-systems/${sysA}/approve-registration", payload: {}, as: PermitClerk, captures: {permitA: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-systems/${sysB}/approve-registration", payload: {}, as: PermitClerk, captures: {permitB: $.data.id}}
            - {call: "POST /false-alarm-program/_clock/set_current_utc", payload: {current_utc: "2026-01-05T00:00:00Z"}, as: ProgramAdministrator}
            - {call: "POST /false-alarm-program/_program-runs/nightly", payload: {}, as: ProgramAdministrator}
            - {call: "POST /false-alarm-program/_clock/set_current_utc", payload: {current_utc: "2026-02-01T00:00:00Z"}, as: ProgramAdministrator}
            - {call: "POST /false-alarm-program/_program-runs/nightly", payload: {}, as: ProgramAdministrator}
            - {call: "POST /false-alarm-program/_clock/set_current_utc", payload: {current_utc: "2026-02-05T00:00:00Z"}, as: ProgramAdministrator}
            - {call: "GET /false-alarm-program/alarm-permits/${permitB}", payload: {}, as: PermitClerk, captures: {permitB_v: $.data.version}}
            - {call: "POST /false-alarm-program/alarm-permits/${permitB}/renewals", payload: {expected_alarm_permit_version: "${permitB_v}"}, as: PermitClerk}
            - {call: "POST /false-alarm-program/_clock/set_current_utc", payload: {current_utc: "2026-02-06T00:00:00Z"}, as: ProgramAdministrator}
            - {call: "POST /false-alarm-program/_program-runs/nightly", payload: {}, as: ProgramAdministrator}
            - {call: "GET /false-alarm-program/alarm-permits/${permitB}", payload: {}, as: PermitClerk, captures: {permitB_v2: $.data.version}}
            - {call: "POST /false-alarm-program/_clock/set_current_utc", payload: {current_utc: "2026-02-11T00:00:00Z"}, as: ProgramAdministrator}
          trigger:
            - {call: "POST /false-alarm-program/_program-runs/nightly", payload: {}, as: ProgramAdministrator}
            - {call: "GET /false-alarm-program/alarm-permits/${permitA}", payload: {}, as: PermitClerk}
            - {call: "GET /false-alarm-program/alarm-permits/${permitB}", payload: {}, as: PermitClerk}
            - {call: "GET /false-alarm-program/penalty-invoices?alarm_site_id=${site_id}&kind=UNPERMITTED_OPERATION_PENALTY", payload: {}, as: BillingClerk}
            - {call: "GET /false-alarm-program/alarm-sites/${site_id}", payload: {}, as: PermitClerk}
            - {call: "POST /false-alarm-program/alarm-permits/${permitB}/renewals", payload: {expected_alarm_permit_version: "${permitB_v2}"}, as: PermitClerk, captures: {blocked_error: $.data.error_id}}
          assert:
            - "hop 1: AlarmPermit.${permitA}.status == 'EXPIRED' (clock 2026-02-11 > grace_through_at 2026-02-10)"
            - "hop 2: AlarmSystem.${sysA}.status == 'UNPERMITTED' with unpermitted_since == '2026-02-11T00:00:00Z'"
            - "hop 2: exactly 1 UNPERMITTED_OPERATION_PENALTY invoice exists with alarm_permit_id == ${permitA}, subtotal_cents 60000, admin_fee_cents 3000, assessed_cents 63000"
            - "hop 2: AlarmSite.${site_id}.unpermitted_system_count == 1"
            - "hop 3: AlarmSite.${site_id}.outstanding_balance_cents == 79000 (11000 + 5000 renewal + 63000) and renewal_block_active == true"
            - "hop 3: AlarmPermit.${permitB}.status == 'RENEWAL_BLOCKED' even though nothing in the request referenced permit B"
            - "AlarmPermit.${permitB}.renewal_count == 1 and term_end_at == '2026-03-07T00:00:00Z' (its own term is untouched)"
            - "the PERMIT_RENEWAL_FEE invoice for ${permitB} has 2 line_items (PERMIT_RENEWAL 3000, LATE_RENEWAL 1500), subtotal_cents 4500, admin_fee_cents 500, assessed_cents 5000"
            - "the follow-up renewal of ${permitB} fails 409 ERR_PERMIT_RENEWAL_BLOCKED (priority 55) and leaves AlarmPermit.${permitB}.status == 'RENEWAL_BLOCKED'"
            - "AlarmSite.${site_id}.lifetime_assessed_cents == 79000"

      - name: granted_appeal_cascades_from_exemption_through_renumbering_repricing_and_order_vacatur
        grounds:
          - state_machines.Appeal.HEARD_to_GRANTED
          - state_machines.FalseAlarmIncident.APPEALED_to_EXEMPT_BY_APPEAL
          - calculations.false_alarm_occurrence_index
          - calculations.escalating_false_alarm_fee
          - calculations.site_response_posture
          - entities.SuspensionOrder.fields.status
        distinguishing_aspect: >-
          Granting the appeal of the MIDDLE chargeable incident must ripple four hops in one request:
          that incident becomes EXEMPT_BY_APPEAL, the later incident is renumbered from
          occurrence_index 3 to 2 and re-priced 20000 -> 10000, its already-settled 21000-cent
          invoice is re-assessed to 10500 with the 10500-cent overpayment moved to
          credit_balance_cents, and the auto-proposed SuspensionOrder is VACATED because the
          window count fell from 3 to 2.
        test_recipe:
          setup:
            - "One ACTIVE FeeSchedule with free_alarm_allowance 1, tiers [1-1: 0, 2-2: 10000, 3-3: 20000, 4+: 40000], probation_threshold_count 2, suspension_threshold_count 3, invoice_due_days 3650."
            - "One RESIDENTIAL AlarmSite (multiplier 1.00) with two ACTIVE ECV-callable contacts and three PERMITTED systems (16500 of permit-issue invoices)."
            - "Three COUNTED incidents: 2026-02-05 (index 1, fee 0, no invoice), 2026-02-12 (index 2, fee 10000, invoice 10500), 2026-02-20 (index 3, fee 20000, invoice 21000)."
            - "The third determination pushed chargeable_count_window to 3 and auto-created a PROPOSED SuspensionOrder with effective_from 2026-03-02 and effective_through 2026-04-01."
            - "A single 31500-cent CARD payment on 2026-02-25 settles both fee invoices EXPLICITly, so the site owes only the 16500 of permit-issue invoices."
            - "The permit holder appeals the SECOND incident on 2026-02-25 (13 days after its determination, inside the 20-day window); it is scheduled onto the 2026-03-01T09:00Z session and heard at 2026-03-01T10:00Z."
