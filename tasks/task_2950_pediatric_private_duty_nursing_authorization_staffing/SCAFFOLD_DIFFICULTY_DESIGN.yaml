  - rule_id: compensating_invariant
    instances:
      - name: assignment_cancel_returns_committed_minutes_to_the_exact_prior_value
        grounds:
          - calculations.committed_minutes_invariant
          - state_machines.ShiftAssignment.transitions.ACTIVE_to_CANCELLED
          - state_machines.Shift.transitions.ASSIGNED_to_OPEN
          - calculations.case_fill_metrics
          - endpoints[POST /pdn/shift-assignments/{id}/cancel]
        distinguishing_aspect: >-
          The conserved quantity is scheduled commitment: Authorization.hours_committed_this_week
          together with Nurse.scheduled_minutes_this_week. Cancelling the assignment must return both
          to their pre-assignment values exactly (8.00 -> 0.00 and 480 -> 0) and reopen the shift, with
          no residual minutes left behind on either side.
        test_recipe:
          setup:
            - "Authorization approved at 40.00 h/wk is ACTIVE, case ACTIVE, clock 2026-08-03 06:00."
            - "One 8-hour shift on 2026-08-05 08:00-16:00 is ASSIGNED to N1."
