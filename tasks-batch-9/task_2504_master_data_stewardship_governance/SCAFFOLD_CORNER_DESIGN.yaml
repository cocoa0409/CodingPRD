              as: GovernanceAdmin
              captures: { err: $.data.error_id }
            - call: "GET /mdm/source-systems/${crm_id}"
              as: GovernanceAdmin
              captures: { after_cert_at: $.data.certified_at, after_version: $.data.version }
          assert:
            - "${first_version} == 2"
            - "HTTP 409 and ${err} == ERR_INVALID_STATE_TRANSITION"
            - "${after_cert_at} == 2026-08-01T00:00:00Z (unchanged by the replay)"
            - "${after_version} == 2 - the rejected call performed no write"

      - name: rejected_merge_proposal_is_locked_down
