      - name: decide_is_gated_first_by_quorum_then_by_effective_votes_then_computes_the_tally
        claim_type: Constants Applied
        grounds:
          - calculations.panel_decision_tally
          - errors.ERR_QUORUM_NOT_MET
          - errors.ERR_NO_EFFECTIVE_VOTES
          - entities.HearingSession.fields.quorum_required
        distinguishing_aspect: |
          On a panel of 3 the constants give quorum_required = CEILING(3 * 2 / 3) = 2, and the three
          gates fire in a pinned order as votes accumulate: with 1 ABSTAIN cast, decide returns
          ERR_QUORUM_NOT_MET; with 2 ABSTAINs cast, quorum is satisfied (ABSTAIN votes DO count toward
          quorum) yet decide returns ERR_NO_EFFECTIVE_VOTES; after a third RESPONSIBLE/3 vote,
          effective_vote_count is 1, 1 * 2 > 1 gives panel_finding RESPONSIBLE and the median over the
          single RESPONSIBLE recommendation is 3.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; a FORMAL case with an acknowledged notice and a 3-panelist session convened at 2026-08-20T10:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/departments"
