              as: Auditor
              as_user_id: "aud-01"
            - call: "GET /review-capacity-windows/00000000-0000-4000-8000-000000000404"
              as: Auditor
              as_user_id: "aud-01"
            - call: "GET /rollout-plans/00000000-0000-4000-8000-000000000404"
              as: Auditor
              as_user_id: "aud-01"
            - call: "GET /commerce-items/00000000-0000-4000-8000-000000000404"
              as: Auditor
              as_user_id: "aud-01"
            - call: "GET /impact-assessments/00000000-0000-4000-8000-000000000404"
              as: Auditor
              as_user_id: "aud-01"
          assert:
            - "all twelve calls return 404"
            - "the /publisher-accounts read error_id == ERR_PUBLISHER_ACCOUNT_NOT_FOUND"
            - "the /signing-credentials read error_id == ERR_SIGNING_CREDENTIAL_NOT_FOUND"
            - "the /feature-mappings read error_id == ERR_FEATURE_MAPPING_NOT_FOUND"
            - "the /metadata-locales read error_id == ERR_METADATA_LOCALE_NOT_FOUND"
            - "the /behavior-findings read error_id == ERR_BEHAVIOR_FINDING_NOT_FOUND"
            - "the /rejection-reasons read error_id == ERR_REJECTION_REASON_NOT_FOUND"
            - "the /appeal-requests read error_id == ERR_APPEAL_REQUEST_NOT_FOUND"
            - "the /expedite-requests read error_id == ERR_EXPEDITE_REQUEST_NOT_FOUND"
            - "the /review-capacity-windows read error_id == ERR_REVIEW_CAPACITY_WINDOW_NOT_FOUND"
            - "the /rollout-plans read error_id == ERR_ROLLOUT_PLAN_NOT_FOUND"
            - "the /commerce-items read error_id == ERR_COMMERCE_ITEM_NOT_FOUND"
            - "the /impact-assessments read error_id == ERR_IMPACT_ASSESSMENT_NOT_FOUND"
      - name: an_expired_membership_blocks_mapping_creation_where_the_posture_gate_cannot_reach
        claim_type: Violation → Error
        grounds:
          - validations.priority_45.ERR_PROGRAM_MEMBERSHIP_EXPIRED
          - endpoints.POST_/_clock/set_current_utc.side_effects
          - validations.priority_40.applies_to
        distinguishing_aspect: "Moving the clock one second past membership_paid_through_at reports accounts_expired_count == 1 and makes POST /feature-mappings return 403 ERR_PROGRAM_MEMBERSHIP_EXPIRED — a code only observable on an endpoint outside the priority-40 posture list, since the same clock move also expires the distribution certificate and would otherwise answer 409 first."
        test_recipe:
          setup: "An app whose account is paid through 2027-08-01T00:00:00Z and whose single NOT_STARTED mapping already holds the posture at RESTRICTED."
          setup_api_calls: *CH_MAP
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-08-01T00:00:01Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
            - *c_map_b
          assert:
            - "the POST /_clock/set_current_utc call returns 200"
            - "data.accounts_expired_count == 1"
            - "data.credentials_expired_count == 2"
            - "PublisherAccount.${acct_id}.program_status == EXPIRED"
            - "the POST /feature-mappings call returns 403"
            - "the POST /feature-mappings response error_id == ERR_PROGRAM_MEMBERSHIP_EXPIRED"
            - "AppRecord.${app_id}.compliance_posture == RESTRICTED"
            - "AppRecord.${app_id}.posture_reason_codes == [MEMBERSHIP_EXPIRED, NO_ACTIVE_DISTRIBUTION_CERT, COMPLIANCE_INDEX_BELOW_FLOOR]"
      - name: a_provisioning_profile_linked_to_a_cross_platform_certificate_is_refused
        claim_type: Violation → Error
        grounds:
          - validations.priority_65.ERR_CREDENTIAL_PLATFORM_MISMATCH
          - entities.SigningCredential.linked_cert_id
        distinguishing_aspect: "An IOS provisioning profile whose linked_cert_id points at an ACTIVE ANDROID distribution certificate of the same account is refused with ERR_CREDENTIAL_PLATFORM_MISMATCH — not with ERR_LINKED_CERT_NOT_ACTIVE, since the linked certificate is perfectly active."
        test_recipe:
          setup: "One enrolled account holding an ACTIVE ANDROID distribution certificate and no iOS certificate."
          setup_api_calls:
            - *c_clock
            - *c_acct
          trigger:
            - &c_cert_android
              call: "POST /signing-credentials"
              payload: { expected_publisher_account_version: "${acct_v1}", publisher_account_id: "${acct_id}", credential_type: "DISTRIBUTION_CERT", platform: "ANDROID", key_custody: "HSM", not_before: "2026-07-01T00:00:00Z", not_after: "2027-07-01T00:00:00Z", entitlements: ["IN_APP_PURCHASE"] }
              as: PublisherAdmin
              as_user_id: "${acct_id}"
              captures: { certa_id: $.data.id }
            - call: "POST /signing-credentials/${certa_id}/activate"
              payload: {}
              as: PublisherAdmin
              as_user_id: "${acct_id}"
            - *c_acct_reread
            - call: "POST /signing-credentials"
              payload: { expected_publisher_account_version: "${acct_v2}", publisher_account_id: "${acct_id}", credential_type: "PROVISIONING_PROFILE", platform: "IOS", key_custody: "CLOUD_MANAGED", linked_cert_id: "${certa_id}", not_before: "2026-07-01T00:00:00Z", not_after: "2027-07-01T00:00:00Z" }
              as: PublisherAdmin
              as_user_id: "${acct_id}"
          assert:
            - "the ANDROID certificate creation returns 201 and its activation returns 200"
            - "SigningCredential.${certa_id}.status == ACTIVE"
            - "the second POST /signing-credentials call returns 409"
            - "the second POST /signing-credentials response error_id == ERR_CREDENTIAL_PLATFORM_MISMATCH"
      - name: publishing_a_rule_that_supersedes_an_unpublished_draft_is_refused
        claim_type: Violation → Error
        grounds:
          - state_machines.GuidelineRule.DRAFT_to_EFFECTIVE.preconditions
          - errors.ERR_GUIDELINE_RULE_NOT_EFFECTIVE
          - errors.ERR_RULE_NOT_YET_EFFECTIVE
        distinguishing_aspect: "Publishing rule B while its supersedes_rule_id still points at a DRAFT rule A returns ERR_GUIDELINE_RULE_NOT_EFFECTIVE, and publishing A first then B succeeds — the two preconditions are distinct, ERR_RULE_NOT_YET_EFFECTIVE covering only a future effective_from."
        test_recipe:
          setup: "An empty database with the clock at its mandatory default."
          setup_api_calls:
            - *c_clock
            - *c_rule
          trigger:
            - *c_rule_v2
            - *c_rule_v2_pub
            - *c_rule_pub
            - *c_rule_v2_pub
          assert:
            - "the first POST /guideline-rules/${rule_v2_id}/publish call returns 409"
            - "the first publish response error_id == ERR_GUIDELINE_RULE_NOT_EFFECTIVE"
            - "GuidelineRule.${rule_v2_id}.status == DRAFT"
            - "the POST /guideline-rules/${rule_id}/publish call returns 200"
            - "the second POST /guideline-rules/${rule_v2_id}/publish call returns 200"
            - "GuidelineRule.${rule_id}.status == SUPERSEDED"
            - "GuidelineRule.${rule_v2_id}.status == EFFECTIVE"
            - "GuidelineRule.${rule_v2_id}.impacted_app_count == 0"
      - name: skipping_a_phase_outranks_the_dwell_that_has_not_elapsed
        claim_type: Priority Ordering
        grounds:
          - validations.priority_65.ERR_PHASE_SEQUENCE_INVALID
          - validations.priority_70.ERR_PHASE_DWELL_NOT_MET
          - calculations.global_constants.PHASE_COUNT
        distinguishing_aspect: "An advance to to_phase_index 2 from phase 0 at the very instant of phase entry violates BOTH the sequence rule (priority 65) and the dwell rule (priority 70) and must answer ERR_PHASE_SEQUENCE_INVALID; to_phase_index 7 is refused with the same code because PHASE_COUNT - 1 is 6."
        test_recipe:
          setup: "A PHASE_ACTIVE plan that entered phase 0 at 2026-08-01T00:00:00Z."
          setup_api_calls: *CH_ACTIVE
          trigger:
            - call: "POST /rollout-plans/${plan_id}/advance"
              payload: { to_phase_index: 2 }
              as: ReleaseManager
              as_user_id: "${acct_id}"
            - call: "POST /rollout-plans/${plan_id}/advance"
              payload: { to_phase_index: 7 }
              as: ReleaseManager
              as_user_id: "${acct_id}"
            - call: "POST /rollout-plans/${plan_id}/advance"
              payload: { to_phase_index: 0 }
              as: ReleaseManager
              as_user_id: "${acct_id}"
          assert:
            - "all three calls return 409"
            - "all three responses carry error_id == ERR_PHASE_SEQUENCE_INVALID"
            - "RolloutPlan.${plan_id}.current_phase_index == 0"
            - "RolloutPlan.${plan_id}.phase_entered_at == 2026-08-01T00:00:00Z"
            - "AppRecord.${app_id}.released_share_pct == 1.00"
      - name: four_critical_reasons_in_one_rejection_drop_the_account_below_the_expedite_floor
        claim_type: Violation → Error
        grounds:
          - validations.priority_75.ERR_STANDING_TOO_LOW
          - calculations.standing_score.ROLLING_365
          - calculations.global_constants.EXPEDITE_STANDING_FLOOR
        distinguishing_aspect: "A single REJECT decision carrying four CRITICAL rejection reasons costs 4 * 12 = 48 points, leaving standing_score_rolling_365 at 52.00, and the next expedite request is refused with ERR_STANDING_TOO_LOW at request time — before any credit is consumed, with expedite_credits_remaining still 2."
        test_recipe:
          setup: "A build IN_REVIEW claimed by rev-01 on an OPEN app of an account with a spotless history."
          setup_api_calls: *CH_REVIEW
          trigger:
            - call: "POST /submissions/${sub_id}/decision"
              payload: { outcome: "REJECT", rejection_reasons: [ { guideline_rule_id: "${rule_id}", reason_code: "PRIVACY_LABEL_MISMATCH", severity: "CRITICAL", detail: "Undisclosed device identifier collection." }, { guideline_rule_id: "${rule_id}", reason_code: "PRIVACY_PURPOSE_MISMATCH", severity: "CRITICAL", detail: "Analytics purpose undeclared." }, { guideline_rule_id: "${rule_id}", reason_code: "PRIVACY_TRACKING_UNDECLARED", severity: "CRITICAL", detail: "Cross-app tracking undeclared." }, { guideline_rule_id: "${rule_id}", reason_code: "PRIVACY_DELETION_FLOW_MISSING", severity: "CRITICAL", detail: "No in-app deletion path." } ] }
              as: PlatformReviewer
              as_user_id: "rev-01"
            - *c_app_reread
            - *c_sub_101
            - call: "POST /expedite-requests"
              payload: { submission_id: "${sub2_id}", justification_category: "CRITICAL_BUG", justification: "Crash on launch for 30 percent of devices." }
              as: ReleaseManager
              as_user_id: "${acct_id}"
          assert:
            - "the POST /submissions/${sub_id}/decision call returns 200"
            - "Submission.${sub_id}.state == REJECTED"
            - "GET /publisher-accounts/${acct_id}/standing reports rejection_strike_count == 4"
            - "GET /publisher-accounts/${acct_id}/standing reports decayed_penalty_total == 48"
            - "GET /publisher-accounts/${acct_id}/standing reports standing_score_rolling_365 == 52.00"
            - "GET /publisher-accounts/${acct_id}/standing reports standing_score_lifetime == 52.00"
            - "the POST /expedite-requests call returns 409"
            - "the expedite response error_id == ERR_STANDING_TOO_LOW"
            - "PublisherAccount.${acct_id}.expedite_credits_remaining == 2"

  - section: rbac
    instances:
      - name: the_three_publisher_roles_cannot_reach_into_each_others_exclusive_steps
        claim_type: peer_roles
        grounds:
          - rbac.PublisherAdmin.exclusive_operations
          - rbac.ReleaseManager.exclusive_operations
          - rbac.ComplianceOfficer.exclusive_operations
          - validations.priority_15.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: "All three publisher roles are entity_backed on the SAME PublisherAccount, yet ReleaseManager is refused POST /feature-mappings, ComplianceOfficer is refused POST /submissions, PublisherAdmin is refused POST /submissions/{id}/queue and ReleaseManager is refused POST /signing-credentials — each with 403 ERR_ROLE_NOT_PERMITTED and with no state change at all."
        test_recipe:
          setup: "An OPEN iOS app of one account with an EFFECTIVE privacy rule, one mapping and a DRAFT build."
          setup_api_calls: *CH_DRAFT
          trigger:
            - call: "POST /feature-mappings"
              payload: { app_record_id: "${app_id}", guideline_rule_id: "${rule_id}", feature_code: "DATA_EXPORT" }
              as: ReleaseManager
              as_user_id: "${acct_id}"
            - call: "POST /submissions"
              payload: { expected_app_record_version: "${app_v2}", app_record_id: "${app_id}", signing_credential_id: "${prof_id}", build_number: 101, version_string: "4.2.1" }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
            - call: "POST /submissions/${sub_id}/queue"
              payload: {}
              as: PublisherAdmin
              as_user_id: "${acct_id}"
            - call: "POST /signing-credentials"
              payload: { expected_publisher_account_version: "${acct_v2}", publisher_account_id: "${acct_id}", credential_type: "DISTRIBUTION_CERT", platform: "IOS", key_custody: "HSM", not_before: "2026-07-01T00:00:00Z", not_after: "2027-07-01T00:00:00Z", entitlements: ["IN_APP_PURCHASE"] }
              as: ReleaseManager
              as_user_id: "${acct_id}"
          assert:
            - "all four calls return 403"
            - "all four responses carry error_id == ERR_ROLE_NOT_PERMITTED"
            - "GET /feature-mappings?app_record_id=${app_id} reports meta.total_count == 1"
            - "GET /submissions?app_record_id=${app_id} reports meta.total_count == 1"
            - "Submission.${sub_id}.state == DRAFT"
            - "GET /signing-credentials?publisher_account_id=${acct_id} reports meta.total_count == 2"
      - name: the_auditor_reads_everything_and_may_mutate_nothing_not_even_remediation
        claim_type: hierarchical_override
        grounds:
          - rbac.Auditor.exclusive_operations
          - rbac.Auditor.shared_operations
          - validations.priority_15.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: "The Auditor reads the standing, compliance-summary and impact-assessment views of an account it does not belong to, but POST /impact-assessments/{id}/assess, POST /feature-mappings/{id}/self-review and POST /behavior-findings/{id}/triage are all 403 ERR_ROLE_NOT_PERMITTED — the remediation-exemption list at priority 40 never widens the Auditor's rights."
        test_recipe:
          setup: "An ImpactAssessment in REMEDIATION_REQUIRED with a STALE mapping on a RESTRICTED app."
          setup_api_calls: *CH_IA_REQ
          trigger:
            - call: "GET /app-records/${app_id}/compliance-summary"
              as: Auditor
              as_user_id: "aud-01"
            - call: "GET /publisher-accounts/${acct_id}/standing"
              as: Auditor
              as_user_id: "aud-01"
            - call: "POST /impact-assessments/${ia_id}/assess"
              payload: { action: "MARK_REMEDIATED" }
              as: Auditor
              as_user_id: "aud-01"
            - call: "POST /feature-mappings/${map_id}/self-review"
              payload: { outcome: "PASS", evidence_ref: "audit/forced.pdf" }
              as: Auditor
              as_user_id: "aud-01"
          assert:
            - "the two GET calls return 200"
            - "the compliance-summary read reports mapping_stale == 1 and open_impact_count == 1"
            - "the standing read reports standing_score_rolling_365 == 100.00"
            - "the POST /impact-assessments/${ia_id}/assess call returns 403 with error_id == ERR_ROLE_NOT_PERMITTED"
            - "the POST /feature-mappings/${map_id}/self-review call returns 403 with error_id == ERR_ROLE_NOT_PERMITTED"
            - "ImpactAssessment.${ia_id}.status == REMEDIATION_REQUIRED"
            - "FeatureMapping.${map_id}.self_review_status == STALE"
      - name: the_age_rating_write_is_shared_by_two_roles_while_the_privacy_write_is_not
        claim_type: peer_roles
        grounds:
          - rbac.ReleaseManager.shared_operations
          - rbac.ComplianceOfficer.exclusive_operations
          - endpoints.PUT_/submissions/{id}/age-rating.roles
        distinguishing_aspect: "PUT /submissions/{id}/age-rating succeeds for BOTH ReleaseManager and ComplianceOfficer on the same build, while PUT /submissions/{id}/privacy-declaration succeeds only for ComplianceOfficer and answers ReleaseManager with 403 ERR_ROLE_NOT_PERMITTED."
        test_recipe:
          setup: "An OPEN iOS app with a DRAFT build and a completed primary locale."
          setup_api_calls: *CH_DRAFT
          trigger:
            - call: "PUT /submissions/${sub_id}/age-rating"
              payload: { age_rating_answers: { violence: 0, sexual_content: 0, profanity: 0, gambling_simulated: 0, drugs_alcohol: 0, horror: 0, unrestricted_web_access: false, user_generated_content: false, ugc_moderation_enabled: false, real_money_gambling: false, contests: false }, attested_age_rating: 4 }
              as: ReleaseManager
              as_user_id: "${acct_id}"
            - *c_age
            - call: "PUT /submissions/${sub_id}/privacy-declaration"
              payload: { declared_privacy_items: [], tracking_consent_prompt_present: false }
              as: ReleaseManager
              as_user_id: "${acct_id}"
            - *c_priv
          assert:
            - "the first PUT /submissions/${sub_id}/age-rating call returns 200"
            - "the second PUT /submissions/${sub_id}/age-rating call returns 200"
            - "Submission.${sub_id}.derived_age_rating == 0"
            - "Submission.${sub_id}.attested_age_rating == 4"
            - "the first PUT /submissions/${sub_id}/privacy-declaration call returns 403 with error_id == ERR_ROLE_NOT_PERMITTED"
            - "the second PUT /submissions/${sub_id}/privacy-declaration call returns 200"
            - "Submission.${sub_id}.tracking_consent_prompt_present == false"
      - name: only_the_claiming_reviewer_may_decide_the_build_it_claimed
        claim_type: Segregation of duties
        grounds:
          - validations.priority_50.sub_rule_a
          - rbac.PlatformReviewer.description
          - errors.ERR_SEGREGATION_OF_DUTIES_VIOLATION
        distinguishing_aspect: "A second reviewer rev-02 holding the correct PlatformReviewer role is refused the decision on a build claimed by rev-01 with 409 ERR_SEGREGATION_OF_DUTIES_VIOLATION — not 403 — and rev-01 then decides the same build successfully."
        test_recipe:
          setup: "A build IN_REVIEW claimed by rev-01 whose disclosure and rating gates all pass."
          setup_api_calls: *CH_REVIEW
          trigger:
            - call: "POST /submissions/${sub_id}/decision"
              payload: { outcome: "APPROVE" }
              as: PlatformReviewer
              as_user_id: "rev-02"
            - *c_approve
          assert:
            - "the first POST /submissions/${sub_id}/decision call returns 409"
            - "the first decision response error_id == ERR_SEGREGATION_OF_DUTIES_VIOLATION"
            - "Submission.${sub_id}.state == IN_REVIEW"
            - "Submission.${sub_id}.reviewed_by_user_id == rev-01"
            - "the second POST /submissions/${sub_id}/decision call returns 200"
            - "Submission.${sub_id}.state == APPROVED"
      - name: the_officer_who_attested_the_build_may_never_decide_it_even_as_a_reviewer
        claim_type: Segregation of duties
        grounds:
          - validations.priority_50.sub_rule_a
          - entities.Submission.attested_by_user_id
          - state_machines.Submission.pre-review-check.side_effects
        distinguishing_aspect: "A caller whose X-User-ID equals Submission.attested_by_user_id may legally CLAIM the build as PlatformReviewer, yet the decision is refused with ERR_SEGREGATION_OF_DUTIES_VIOLATION even though the same caller is now the claiming reviewer — the rule has two legs and only one of them is satisfied."
        test_recipe:
          setup: "A build WAITING_FOR_REVIEW whose pre-review check was attested by the account's compliance officer."
          setup_api_calls: *CH_WAIT
          trigger:
            - call: "POST /submissions/${sub_id}/claim"
              payload: {}
              as: PlatformReviewer
              as_user_id: "${acct_id}"
            - call: "POST /submissions/${sub_id}/decision"
              payload: { outcome: "APPROVE" }
              as: PlatformReviewer
              as_user_id: "${acct_id}"
          assert:
            - "Submission.${sub_id}.attested_by_user_id == ${acct_id}"
            - "the POST /submissions/${sub_id}/claim call returns 200"
            - "Submission.${sub_id}.state == IN_REVIEW"
            - "Submission.${sub_id}.reviewed_by_user_id == ${acct_id}"
            - "the POST /submissions/${sub_id}/decision call returns 409"
            - "the decision response error_id == ERR_SEGREGATION_OF_DUTIES_VIOLATION"
            - "Submission.${sub_id}.state == IN_REVIEW"
      - name: the_reviewer_who_rejected_the_build_may_neither_take_up_nor_judge_the_appeal
        claim_type: Segregation of duties
        grounds:
          - validations.priority_50.sub_rule_b
          - endpoints.POST_/appeal-requests/{id}/board-review.side_effects
          - endpoints.POST_/appeal-requests/{id}/decide.side_effects
        distinguishing_aspect: "Both appeal steps are refused when X-User-ID is rev-01, the reviewer recorded on the rejected submission, even though the caller carries the correct PlatformAppealBoard role; board-07 performs the identical board-review successfully."
        test_recipe:
          setup: "A SUBMITTED appeal on a build rejected by rev-01 with one CONTESTED CRITICAL reason."
          setup_api_calls: *CH_APPEAL
          trigger:
            - call: "POST /appeal-requests/${appeal_id}/board-review"
              payload: {}
              as: PlatformAppealBoard
              as_user_id: "rev-01"
            - &c_board_review
              call: "POST /appeal-requests/${appeal_id}/board-review"
              payload: {}
              as: PlatformAppealBoard
              as_user_id: "board-07"
            - call: "POST /appeal-requests/${appeal_id}/decide"
              payload: { outcome: "UPHELD", rationale: "The identifier is not device-local." }
              as: PlatformAppealBoard
              as_user_id: "rev-01"
          assert:
            - "the first POST /appeal-requests/${appeal_id}/board-review call returns 409 with error_id == ERR_SEGREGATION_OF_DUTIES_VIOLATION"
            - "AppealRequest.${appeal_id}.state == SUBMITTED"
            - "the second POST /appeal-requests/${appeal_id}/board-review call returns 200"
            - "AppealRequest.${appeal_id}.state == BOARD_REVIEW"
            - "AppealRequest.${appeal_id}.board_started_at == 2026-08-01T00:00:00Z"
            - "the POST /appeal-requests/${appeal_id}/decide call returns 409 with error_id == ERR_SEGREGATION_OF_DUTIES_VIOLATION"
            - "AppealRequest.${appeal_id}.state == BOARD_REVIEW"
            - "Submission.${sub_id}.state == APPEAL_PENDING"
      - name: the_rejecting_reviewer_cannot_grant_the_expedite_but_the_board_can
        claim_type: Segregation of duties
        grounds:
          - validations.priority_50.sub_rule_c
          - endpoints.POST_/expedite-requests/{id}/decide
          - calculations.expedite_credit_ledger
        distinguishing_aspect: "The expedite decision on a build reviewed by rev-01 is refused for X-User-ID rev-01 with ERR_SEGREGATION_OF_DUTIES_VIOLATION and consumes no credit, while board-07 grants the same request and drops expedite_credits_remaining from 2 to 1."
        test_recipe:
          setup: "A build REJECTED by rev-01 whose account still holds both expedite credits and standing 88.00."
          setup_api_calls: *CH_REJECTED
          trigger:
            - *c_expedite
            - call: "POST /expedite-requests/${exp_id}/decide"
              payload: { outcome: "GRANT", decision_rationale: "Self-granted." }
              as: PlatformAppealBoard
              as_user_id: "rev-01"
            - *c_expedite_grant
          assert:
            - "the POST /expedite-requests call returns 201 and data.state == REQUESTED"
            - "the first POST /expedite-requests/${exp_id}/decide call returns 409"
            - "the first decide response error_id == ERR_SEGREGATION_OF_DUTIES_VIOLATION"
            - "ExpediteRequest.${exp_id}.state == REQUESTED"
            - "PublisherAccount.${acct_id}.expedite_credits_remaining == 2"
            - "the second POST /expedite-requests/${exp_id}/decide call returns 200"
            - "ExpediteRequest.${exp_id}.state == GRANTED"
            - "ExpediteRequest.${exp_id}.granted_at == 2026-08-01T00:00:00Z"
            - "PublisherAccount.${acct_id}.expedite_credits_remaining == 1"
      - name: whoever_attested_the_self_review_may_not_be_the_one_to_waive_it
        claim_type: Segregation of duties
        grounds:
          - validations.priority_50.sub_rule_d
          - entities.FeatureMapping.attested_by_user_id
          - rbac.PlatformPolicyAdmin.exclusive_operations
        distinguishing_aspect: "POST /feature-mappings/{id}/waive is refused when X-User-ID equals FeatureMapping.attested_by_user_id even though the caller holds the exclusive PlatformPolicyAdmin role, and ppa-01 then waives the same FAILED mapping to WAIVED_BY_PLATFORM, lifting the index to 100.00."
        test_recipe:
          setup: "An app whose only mapping was self-reviewed FAILED by the account's compliance officer."
          setup_api_calls: *CH_MAP_FAILED
          trigger:
            - call: "POST /feature-mappings/${map_id}/waive"
              payload: { waiver_reason: "Self-service waiver." }
              as: PlatformPolicyAdmin
              as_user_id: "${acct_id}"
            - &c_map_waive
              call: "POST /feature-mappings/${map_id}/waive"
              payload: { waiver_reason: "Compensating control accepted by policy." }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
          assert:
            - "FeatureMapping.${map_id}.attested_by_user_id == ${acct_id}"
            - "the first POST /feature-mappings/${map_id}/waive call returns 409"
            - "the first waive response error_id == ERR_SEGREGATION_OF_DUTIES_VIOLATION"
            - "FeatureMapping.${map_id}.self_review_status == FAILED"
            - "AppRecord.${app_id}.feature_compliance_index == 0.00"
            - "the second POST /feature-mappings/${map_id}/waive call returns 200"
            - "FeatureMapping.${map_id}.self_review_status == WAIVED_BY_PLATFORM"
            - "AppRecord.${app_id}.feature_compliance_index == 100.00"
            - "AppRecord.${app_id}.compliance_posture == OPEN"
      - name: the_commerce_mapping_attester_is_barred_from_reviewing_that_apps_commerce_item
        claim_type: Segregation of duties
        grounds:
          - validations.priority_50.sub_rule_e
          - endpoints.POST_/commerce-items/{id}/review
          - calculations.feature_compliance_index
        distinguishing_aspect: "Sub-rule (e) reaches across entities: because a COMMERCE-category mapping of the app was attested by the account's officer, a PlatformReviewer whose X-User-ID equals that officer id is refused the commerce review with ERR_SEGREGATION_OF_DUTIES_VIOLATION, while rev-02 approves the identical item."
        test_recipe:
          setup: "A distributed app with a PASSED privacy mapping and one already-approved commerce item."
          setup_api_calls: *CH_ITEM_APPROVED
          trigger:
            - *c_rule_commerce
            - *c_rule_commerce_pub
            - &c_map_commerce
              call: "POST /feature-mappings"
              payload: { app_record_id: "${app_id}", guideline_rule_id: "${crule_id}", feature_code: "IN_APP_PURCHASE" }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
              captures: { cmap_id: $.data.id }
            - &c_map_commerce_start
              call: "POST /feature-mappings/${cmap_id}/self-review"
              payload: { outcome: "START" }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
            - &c_map_commerce_pass
              call: "POST /feature-mappings/${cmap_id}/self-review"
              payload: { outcome: "PASS", evidence_ref: "audit/iap-2026-08.pdf" }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
            - &c_item2
              call: "POST /commerce-items"
              payload: { app_record_id: "${app_id}", item_type: "CONSUMABLE", reference_name: "Coin Pack 500", price_tier_cents: 2000, entitlement_class: "DIGITAL_CONTENT" }
              as: PublisherAdmin
              as_user_id: "${acct_id}"
              captures: { item2_id: $.data.id }
            - &c_item2_submit
              call: "POST /commerce-items/${item2_id}/submit"
              payload: {}
              as: PublisherAdmin
              as_user_id: "${acct_id}"
            - call: "POST /commerce-items/${item2_id}/review"
              payload: { outcome: "APPROVE" }
              as: PlatformReviewer
              as_user_id: "${acct_id}"
            - &c_item2_approve
              call: "POST /commerce-items/${item2_id}/review"
              payload: { outcome: "APPROVE" }
              as: PlatformReviewer
              as_user_id: "rev-02"
          assert:
            - "FeatureMapping.${cmap_id}.self_review_status == PASSED"
            - "FeatureMapping.${cmap_id}.attested_by_user_id == ${acct_id}"
            - "FeatureMapping.${cmap_id}.risk_weight == 3"
            - "AppRecord.${app_id}.feature_compliance_index == 100.00"
            - "the POST /commerce-items/${item2_id}/submit call returns 200 and CommerceItem.${item2_id}.status == SUBMITTED"
            - "the first POST /commerce-items/${item2_id}/review call returns 409"
            - "the first review response error_id == ERR_SEGREGATION_OF_DUTIES_VIOLATION"
            - "CommerceItem.${item2_id}.status == SUBMITTED"
            - "the second POST /commerce-items/${item2_id}/review call returns 200"
            - "CommerceItem.${item2_id}.status == APPROVED"
            - "CommerceItem.${item2_id}.commission_rate_applied == 0.30"
      - name: delist_is_the_only_listing_action_the_platform_may_take_and_it_leaves_distribution_alone
        claim_type: peer_roles
        grounds:
          - endpoints.PATCH_/app-records/{id}/listing.side_effects
          - rbac.PlatformPolicyAdmin.shared_operations
          - state_machines.AppRecord.listing_state
        distinguishing_aspect: "PATCH /app-records/{id}/listing with listing_action=COMPLETE_METADATA is 403 ERR_ROLE_NOT_PERMITTED for PlatformPolicyAdmin while DELIST from LISTED succeeds for the same role, and the DELIST leaves distribution_state at PHASED_ROLLOUT with the plan still PHASE_ACTIVE and the shares untouched."
        test_recipe:
          setup: "A PHASE_ACTIVE plan on phase 0 of an OPEN app whose listing_state is still DRAFT and whose primary locale is complete."
          setup_api_calls: *CH_ACTIVE
          trigger:
            - call: "PATCH /app-records/${app_id}/listing"
              payload: { listing_action: "COMPLETE_METADATA" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
            - call: "PATCH /app-records/${app_id}/listing"
              payload: { listing_action: "COMPLETE_METADATA" }
              as: PublisherAdmin
              as_user_id: "${acct_id}"
            - call: "PATCH /app-records/${app_id}/listing"
              payload: { listing_action: "LIST" }
              as: PublisherAdmin
              as_user_id: "${acct_id}"
            - call: "PATCH /app-records/${app_id}/listing"
              payload: { listing_action: "DELIST" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
          assert:
            - "the first PATCH returns 403 with error_id == ERR_ROLE_NOT_PERMITTED"
            - "AppRecord.${app_id}.listing_state == DRAFT"
            - "the second PATCH returns 200 and AppRecord.${app_id}.listing_state == METADATA_COMPLETE"
            - "the third PATCH returns 200 and AppRecord.${app_id}.listing_state == LISTED"
            - "the fourth PATCH returns 200 and AppRecord.${app_id}.listing_state == DELISTED"
            - "AppRecord.${app_id}.distribution_state == PHASED_ROLLOUT"
            - "AppRecord.${app_id}.released_share_pct == 1.00"
            - "AppRecord.${app_id}.held_back_share_pct == 99.00"
            - "RolloutPlan.${plan_id}.state == PHASE_ACTIVE"
      - name: platform_roles_read_across_accounts_where_publisher_roles_are_walled_off
        claim_type: peer_roles
        grounds:
          - validations.priority_20.ERR_CROSS_ACCOUNT_ACCESS_DENIED
          - rbac.PlatformReviewer.shared_operations
          - rbac.Auditor.shared_operations
        distinguishing_aspect: "The identical GET /app-records/{id} on account A's app returns 200 for PlatformReviewer, PlatformPolicyAdmin and Auditor but 403 ERR_CROSS_ACCOUNT_ACCESS_DENIED for account B's PublisherAdmin, and account B's list read returns an empty page with total_count 0 instead of an error."
        test_recipe:
          setup: "Account A owns one app; a second account B exists and owns nothing."
          setup_api_calls:
            - *c_clock
            - *c_acct
            - *c_cert
            - *c_acct_reread
            - *c_cert_act
            - *c_app
            - call: "POST /publisher-accounts"
              payload: { legal_name: "Second Studio SARL", contact_email: "ops@second.example", membership_paid_through_at: "2027-08-01T00:00:00Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
              captures: { acctb_id: $.data.id }
          trigger:
            - call: "GET /app-records/${app_id}"
              as: PlatformReviewer
              as_user_id: "rev-01"
            - call: "GET /app-records/${app_id}"
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
            - call: "GET /app-records/${app_id}"
              as: Auditor
              as_user_id: "aud-01"
            - call: "GET /app-records?limit=10&offset=0"
              as: PublisherAdmin
              as_user_id: "${acctb_id}"
          assert:
            - "the first three GET calls all return 200 with data.id == ${app_id}"
            - "the fourth GET returns 200 with meta.total_count == 0 and an empty data array"
            - "GET /app-records/${app_id} as PublisherAdmin with X-Publisher-Account-Id ${acctb_id} returns 403 with error_id == ERR_CROSS_ACCOUNT_ACCESS_DENIED"

  - section: cross_cutting_complexity_layers
    instances:
      - name: submission_create_rejects_the_app_record_version_the_previous_submission_already_burned
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.submission-create-stale-app-record
          - endpoints.POST_/submissions
          - errors.ERR_STALE_APP_RECORD_VERSION
        distinguishing_aspect: "The very act of creating a Submission increments AppRecord.version, so replaying the same expected_app_record_version for a second build is refused with 412 ERR_STALE_APP_RECORD_VERSION and writes nothing; re-reading the AppRecord and passing the fresh version admits the identical payload."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "PublisherAccount Northwind ACTIVE with an ACTIVE IOS DISTRIBUTION_CERT and ACTIVE IOS PROVISIONING_PROFILE."
            - "AppRecord Northwind Wallet with its single FeatureMapping PASSED, feature_compliance_index 100.00 and compliance_posture OPEN."
            - "One Submission build 100 already created against expected_app_record_version ${app_v2}, which pushed AppRecord.version to ${app_v2} + 1."
          setup_api_calls: *CH_DRAFT
          trigger:
            - call: "POST /submissions"
              payload: { expected_app_record_version: "${app_v2}", app_record_id: "${app_id}", signing_credential_id: "${prof_id}", build_number: 101, version_string: "4.2.1" }
              as: ReleaseManager
              as_user_id: "${acct_id}"
            - *c_app_reread3
            - call: "POST /submissions"
              payload: { expected_app_record_version: "${app_v3}", app_record_id: "${app_id}", signing_credential_id: "${prof_id}", build_number: 101, version_string: "4.2.1" }
              as: ReleaseManager
              as_user_id: "${acct_id}"
              captures: { sub2_id: $.data.id }
          assert:
            - "the first POST /submissions returns status 412 with error.error_id == ERR_STALE_APP_RECORD_VERSION"
            - "immediately after that 412, GET /submissions?app_record_id=${app_id} reports total_count == 1"
            - "immediately after that 412, AppRecord.${app_id}.version == ${app_v3} and equals ${app_v2} + 1"
            - "the second POST /submissions returns status 201 with Submission.${sub2_id}.build_number == 101"
            - "Submission.${sub2_id}.state == DRAFT"
            - "AppRecord.${app_id}.version == ${app_v3} + 1"

      - name: the_stale_app_record_version_outranks_the_rollout_window_conflict_it_would_also_have_hit
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.rollout-plan-create-stale-app-record
          - validations.priority_30_optimistic_concurrency
          - validations.priority_65_rollout_window_exclusivity
          - errors.ERR_STALE_APP_RECORD_VERSION
          - errors.ERR_ROLLOUT_WINDOW_CONFLICT
        distinguishing_aspect: "A second RolloutPlan for an app that already has a PHASE_ACTIVE plan is doubly illegal, and the request must fail with 412 ERR_STALE_APP_RECORD_VERSION at priority 30 rather than 409 ERR_ROLLOUT_WINDOW_CONFLICT at priority 65; only after the version is refreshed does the exclusivity conflict become visible."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Northwind Wallet APPROVED submission build 100 with compliance_posture OPEN."
            - "RolloutPlan PHASED scheduled at 2026-08-01T00:00:00Z, started, so it is PHASE_ACTIVE at phase_index 0 with released_share_pct 1.00 and AppRecord.distribution_state == PHASED_ROLLOUT."
            - "That plan create plus its start each incremented AppRecord.version, leaving ${app_v3} two writes behind."
          setup_api_calls: *CH_ACTIVE
          trigger:
            - call: "POST /rollout-plans"
              payload: { expected_app_record_version: "${app_v3}", app_record_id: "${app_id}", submission_id: "${sub_id}", mode: "PHASED", scheduled_start_at: "2026-08-05T00:00:00Z" }
              as: ReleaseManager
              as_user_id: "${acct_id}"
            - *c_app_reread5
            - call: "POST /rollout-plans"
              payload: { expected_app_record_version: "${app_v5}", app_record_id: "${app_id}", submission_id: "${sub_id}", mode: "PHASED", scheduled_start_at: "2026-08-05T00:00:00Z" }
              as: ReleaseManager
              as_user_id: "${acct_id}"
          assert:
            - "the first POST /rollout-plans returns status 412 with error.error_id == ERR_STALE_APP_RECORD_VERSION"
            - "the first POST /rollout-plans does NOT return ERR_ROLLOUT_WINDOW_CONFLICT even though the interval overlaps the PHASE_ACTIVE plan"
            - "immediately after that 412, GET /rollout-plans?app_record_id=${app_id} reports total_count == 1"
            - "immediately after that 412, AppRecord.${app_id}.version == ${app_v5}"
            - "the second POST /rollout-plans returns status 409 with error.error_id == ERR_ROLLOUT_WINDOW_CONFLICT"
            - "after both attempts, GET /rollout-plans?app_record_id=${app_id} still reports total_count == 1 and AppRecord.${app_id}.version == ${app_v5}"
            - "RolloutPlan.${plan_id}.state == PHASE_ACTIVE and released_share_pct == 1.00 throughout"

      - name: a_second_signing_credential_may_not_reuse_the_account_version_the_first_one_consumed
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.credential-create-stale-account
          - endpoints.POST_/signing-credentials
          - errors.ERR_STALE_PUBLISHER_ACCOUNT_VERSION
        distinguishing_aspect: "SigningCredential creation carries expected_publisher_account_version against PublisherAccount.version, a different OCC field and a different error code than the AppRecord-scoped rules; replaying ${acct_v1} after the DISTRIBUTION_CERT consumed it yields 412 ERR_STALE_PUBLISHER_ACCOUNT_VERSION with no second credential row."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "PublisherAccount Northwind created at version 1 (${acct_v1})."
            - "One IOS DISTRIBUTION_CERT created with expected_publisher_account_version ${acct_v1}, which moved the account to version 2."
          setup_api_calls:
            - *c_clock
            - *c_acct
            - *c_cert
          trigger:
            - call: "POST /signing-credentials"
              payload: { expected_publisher_account_version: "${acct_v1}", publisher_account_id: "${acct_id}", credential_type: "PROVISIONING_PROFILE", platform: "IOS", key_custody: "CLOUD_MANAGED", linked_cert_id: "${cert_id}", not_before: "2026-07-01T00:00:00Z", not_after: "2027-07-01T00:00:00Z" }
              as: PublisherAdmin
              as_user_id: "${acct_id}"
            - *c_acct_reread
            - call: "POST /signing-credentials"
              payload: { expected_publisher_account_version: "${acct_v2}", publisher_account_id: "${acct_id}", credential_type: "PROVISIONING_PROFILE", platform: "IOS", key_custody: "CLOUD_MANAGED", linked_cert_id: "${cert_id}", not_before: "2026-07-01T00:00:00Z", not_after: "2027-07-01T00:00:00Z" }
              as: PublisherAdmin
              as_user_id: "${acct_id}"
              captures: { prof2_id: $.data.id }
          assert:
            - "the first POST /signing-credentials returns status 412 with error.error_id == ERR_STALE_PUBLISHER_ACCOUNT_VERSION"
            - "the error is NOT ERR_STALE_APP_RECORD_VERSION"
            - "immediately after that 412, GET /signing-credentials?publisher_account_id=${acct_id} reports total_count == 1"
            - "immediately after that 412, PublisherAccount.${acct_id}.version == ${acct_v2} and equals ${acct_v1} + 1"
            - "the second POST /signing-credentials returns status 201 with SigningCredential.${prof2_id}.status == PENDING_ACTIVATION"
            - "PublisherAccount.${acct_id}.version == ${acct_v2} + 1"

      - name: membership_renewal_is_occ_guarded_on_the_same_account_version_as_credential_creation
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.membership-renewal-stale-account
          - endpoints.POST_/publisher-accounts/{id}/membership-renewal
          - errors.ERR_STALE_PUBLISHER_ACCOUNT_VERSION
        distinguishing_aspect: "Two distinct write endpoints share one OCC field (PublisherAccount.version): the credential create bumps it and then membership-renewal replaying ${acct_v1} is refused 412 with membership_paid_through_at untouched, while the same call at ${acct_v2} succeeds and bumps the version again."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "PublisherAccount Northwind ACTIVE with membership_paid_through_at 2027-08-01T00:00:00Z at version 1 (${acct_v1})."
            - "One IOS DISTRIBUTION_CERT created against ${acct_v1}, moving the account to version 2."
          setup_api_calls:
            - *c_clock
            - *c_acct
            - *c_cert
          trigger:
            - call: "POST /publisher-accounts/${acct_id}/membership-renewal"
              payload: { expected_publisher_account_version: "${acct_v1}", paid_through_at: "2028-08-01T00:00:00Z" }
              as: PublisherAdmin
              as_user_id: "${acct_id}"
            - *c_acct_reread
            - call: "POST /publisher-accounts/${acct_id}/membership-renewal"
              payload: { expected_publisher_account_version: "${acct_v2}", paid_through_at: "2028-08-01T00:00:00Z" }
              as: PublisherAdmin
              as_user_id: "${acct_id}"
          assert:
            - "the first membership-renewal returns status 412 with error.error_id == ERR_STALE_PUBLISHER_ACCOUNT_VERSION"
            - "immediately after that 412, PublisherAccount.${acct_id}.membership_paid_through_at == 2027-08-01T00:00:00Z"
            - "immediately after that 412, PublisherAccount.${acct_id}.version == ${acct_v2}"
            - "the second membership-renewal returns status 200"
            - "PublisherAccount.${acct_id}.membership_paid_through_at == 2028-08-01T00:00:00Z"
            - "PublisherAccount.${acct_id}.membership_status == ACTIVE"
            - "PublisherAccount.${acct_id}.version == ${acct_v2} + 1"

      - name: the_guideline_publication_cascade_runs_all_four_hops_on_a_live_app_in_one_request
        claim_type: cascading_side_effects
        grounds:
          - endpoints.POST_/guideline-rules/{id}/publish.side_effects
          - state_machines.GuidelineRule.transitions.DRAFT_to_EFFECTIVE
          - state_machines.RolloutPlan.transitions.PHASE_ACTIVE_to_PAUSED
          - state_machines.AppRecord.distribution_state.PHASED_ROLLOUT_to_PAUSED
          - calculations.impact_severity
        distinguishing_aspect: "On an app that is mid-rollout, one publish call must land all four hops in the same response — mapping STALE, index 50.00 and posture RESTRICTED, the PHASE_ACTIVE plan PAUSED with POSTURE_DEGRADED, and distribution_state PAUSED with both share fields frozen at 1.00/99.00 — and the ImpactAssessment must be scored with exposure_factor 1.5 (severity 6.00), which is only correct if hop 2 reads the live distribution_state rather than the post-hop-4 value being NOT_DISTRIBUTED."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z."
            - "Northwind Wallet: one PASSED FeatureMapping (ACCOUNT_DELETION) against EFFECTIVE PRIVACY rule 5.1.1 (severity_weight 4, remediation_grace_days 30), index 100.00, posture OPEN."
            - "Build 100 APPROVED and its PHASED RolloutPlan started: state PHASE_ACTIVE, phase_index 0, released_share_pct 1.00, held_back_share_pct 99.00, AppRecord.distribution_state PHASED_ROLLOUT."
          setup_api_calls: *CH_ACTIVE
          trigger:
            - *c_rule_v2
            - call: "POST /guideline-rules/${rule_v2_id}/publish"
              payload: {}
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
          assert:
            - "the publish response status is 200 with data.status == EFFECTIVE and data.impacted_app_count == 1"
            - "hop 1: GuidelineRule.${rule_id}.status == SUPERSEDED, FeatureMapping.${map_id}.guideline_rule_id == ${rule_v2_id}, self_review_status == STALE and staled_by_rule_id == ${rule_v2_id}"
            - "hop 2: AppRecord.${app_id}.feature_compliance_index == 50.00 and compliance_posture == RESTRICTED"
            - "hop 2: AppRecord.${app_id}.posture_reason_codes == [\"COMPLIANCE_INDEX_BELOW_FLOOR\", \"OPEN_IMPACT_ASSESSMENT\"]"
            - "hop 2: GET /impact-assessments?app_record_id=${app_id} reports total_count == 1 with data[0].status == OPEN, data[0].impact_severity == 6.00 (4 * 1 * 1.5) and data[0].remediation_deadline_at == 2026-08-31T00:00:00Z"
            - "hop 3: RolloutPlan.${plan_id}.state == PAUSED and pause_reason_code == POSTURE_DEGRADED"
            - "hop 4: AppRecord.${app_id}.distribution_state == PAUSED"
            - "hop 4: RolloutPlan.${plan_id}.released_share_pct == 1.00 and held_back_share_pct == 99.00, still summing to 100.00"
            - "RolloutPlan.${plan_id}.phase_index is still 0 and phase_entered_at is still 2026-08-01T00:00:00Z"
            - "Submission.${sub_id}.state is still APPROVED — the cascade never touches the build"

      - name: the_reject_decision_cascade_pauses_a_live_rollout_through_the_index_it_just_destroyed
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Submission.transitions.IN_REVIEW_to_REJECTED
          - endpoints.POST_/submissions/{id}/decision.side_effects
          - calculations.feature_compliance_index
          - calculations.standing_score
          - state_machines.RolloutPlan.transitions.PHASE_ACTIVE_to_PAUSED
        distinguishing_aspect: "Rejecting a second build with a CRITICAL reason citing rule 5.1.1 must chain four hops in one request: the cited mapping PASSED -> FAILED, index 100.00 -> 0.00 and posture RESTRICTED, the PHASE_ACTIVE plan of the older live build PAUSED with POSTURE_DEGRADED, and distribution_state PHASED_ROLLOUT -> PAUSED with shares frozen — hop 3 is only reachable because hop 2 degraded the posture."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z."
            - "Northwind Wallet with one PASSED FeatureMapping against EFFECTIVE PRIVACY rule 5.1.1; index 100.00, posture OPEN."
            - "Build 100 APPROVED, its PHASED plan PHASE_ACTIVE at phase 0 (1.00/99.00), AppRecord.distribution_state PHASED_ROLLOUT."
            - "ReviewCapacityWindow ${win_id} has capacity 5 with slots_consumed 1 and slots_available 4 after build 100's decision."
            - "A second build 101 is driven to IN_REVIEW and claimed by rev-01."
          setup_api_calls: *CH_ACTIVE
          trigger:
            - *c_app_reread4
            - *c_sub2
            - *c_loc2
            - *c_age2
            - *c_priv2
            - *c_prc2
            - *c_queue2
            - *c_claim2
            - call: "POST /submissions/${sub2_id}/decision"
              payload: { outcome: "REJECT", rejection_reasons: [{ guideline_rule_id: "${rule_id}", reason_code: "PRIVACY_LABEL_MISMATCH", severity: "CRITICAL", detail: "Device identifier collection undisclosed in build 101." }] }
              as: PlatformReviewer
              as_user_id: "rev-01"
          assert:
            - "the decision response status is 200 with Submission.${sub2_id}.state == REJECTED and rejected_at == 2026-08-01T00:00:00Z"
            - "hop 0: GET /rejection-reasons?submission_id=${sub2_id} reports total_count == 1 with data[0].severity == CRITICAL, disposition == PENDING and appeal_disposition == PENDING"
            - "hop 1: FeatureMapping.${map_id}.self_review_status == FAILED"
            - "hop 2: AppRecord.${app_id}.feature_compliance_index == 0.00, compliance_posture == RESTRICTED and posture_reason_codes == [\"COMPLIANCE_INDEX_BELOW_FLOOR\"]"
            - "hop 3: RolloutPlan.${plan_id}.state == PAUSED and pause_reason_code == POSTURE_DEGRADED"
            - "hop 4: AppRecord.${app_id}.distribution_state == PAUSED with RolloutPlan.${plan_id}.released_share_pct == 1.00 and held_back_share_pct == 99.00"
            - "PublisherAccount.${acct_id}.standing_score_rolling_365 == 88.00 and standing_score_lifetime == 88.00 and rejection_strike_count == 1"
            - "ReviewCapacityWindow.${win_id}.slots_reserved == 0, slots_consumed == 2 and slots_available == 3"
            - "Submission.${sub_id}.state is still APPROVED and AppRecord.${app_id}.live_submission_id is still ${sub_id}"

      - name: reporting_a_compromised_certificate_revokes_its_profile_blocks_the_build_and_pauses_the_rollout
        claim_type: cascading_side_effects
        grounds:
          - state_machines.SigningCredential.transitions.ACTIVE_to_COMPROMISED
          - endpoints.POST_/signing-credentials/{id}/report-compromise
          - state_machines.Submission.transitions.IN_REVIEW_to_BLOCKED_INVALID_SIGNING
          - validations.priority_40_posture_gate
        distinguishing_aspect: "One report-compromise on the DISTRIBUTION_CERT walks a four-hop chain across four different entity types — linked PROVISIONING_PROFILE REVOKED with COMPROMISE_CASCADE, the IN_REVIEW build BLOCKED_INVALID_SIGNING with its review slot handed back, posture RESTRICTED for NO_ACTIVE_DISTRIBUTION_CERT despite a 100.00 index, and the PHASE_ACTIVE plan PAUSED — and it must run even though the endpoint is exempt from the posture gate and from ERR_CREDENTIAL_IN_USE."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z."
            - "Northwind Wallet: ACTIVE IOS DISTRIBUTION_CERT ${cert_id} and ACTIVE IOS PROVISIONING_PROFILE ${prof_id} whose linked_cert_id == ${cert_id}; index 100.00, posture OPEN."
            - "Build 100 APPROVED with its plan PHASE_ACTIVE at phase 0 and distribution_state PHASED_ROLLOUT."
            - "Build 101 signed by the same profile is claimed and sits IN_REVIEW holding one reserved slot of window ${win_id} (capacity 5, slots_consumed 1, slots_reserved 1, slots_available 3)."
          setup_api_calls: *CH_ACTIVE
          trigger:
            - *c_app_reread4
            - *c_sub2
            - *c_loc2
            - *c_age2
            - *c_priv2
            - *c_prc2
            - *c_queue2
            - *c_claim2
            - call: "POST /signing-credentials/${cert_id}/report-compromise"
              payload: { reason_code: "PRIVATE_KEY_LEAKED" }
              as: PublisherAdmin
              as_user_id: "${acct_id}"
          assert:
            - "the report-compromise response status is 200 with data.status == COMPROMISED and data.compromised_at == 2026-08-01T00:00:00Z"
            - "hop 1: SigningCredential.${prof_id}.status == REVOKED with revocation_reason == COMPROMISE_CASCADE"
            - "hop 2: Submission.${sub2_id}.state == BLOCKED_INVALID_SIGNING with review_window_id == null"
            - "hop 2: SigningCredential.${prof_id}.blocked_submission_count == 1"
            - "hop 2: ReviewCapacityWindow.${win_id}.slots_reserved == 0, slots_available == 4 and slots_consumed == 1 (unchanged)"
            - "hop 3: AppRecord.${app_id}.compliance_posture == RESTRICTED with posture_reason_codes == [\"NO_ACTIVE_DISTRIBUTION_CERT\"] while feature_compliance_index is still 100.00"
            - "hop 4: RolloutPlan.${plan_id}.state == PAUSED with pause_reason_code == POSTURE_DEGRADED and AppRecord.${app_id}.distribution_state == PAUSED"
            - "the call did NOT fail with ERR_APP_COMPLIANCE_RESTRICTED or ERR_CREDENTIAL_IN_USE"
            - "Submission.${sub_id}.state is still APPROVED — only WAITING_FOR_REVIEW and IN_REVIEW builds are blocked"

      - name: all_four_disclosure_divergence_causes_stack_into_a_single_provisional_versus_final_gap
        claim_type: dual_variant_calculation
        grounds:
          - calculations.disclosure_accuracy_score.variants.SELF_REVIEW_PROVISIONAL
          - calculations.disclosure_accuracy_score.variants.REVIEW_FINAL
          - validations.priority_55_privacy_disclosure_accuracy
          - endpoints.POST_/submissions/{id}/pre-review-check
          - endpoints.POST_/submissions/{id}/claim
        distinguishing_aspect: "One submission holding four findings and one over-declared data type must report disclosure_accuracy_score_provisional == 0.9500 and disclosure_accuracy_score_final == 0.4800 at the same instant: the provisional variant sees only the OPEN, in-window, high-confidence MINOR finding, while the final variant adds the low-confidence MAJOR, the DISPUTED MAJOR and the late-arriving MINOR (50 points) plus the 2-point over-disclosure term the provisional variant never applies."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z. Northwind Wallet, mapping PASSED, index 100.00, posture OPEN, window ${win_id} OPEN with 5 slots."
            - "Build 100 declares exactly one privacy item {DEVICE_ID, ADVERTISING, linked_to_user true, used_for_tracking true} with tracking_consent_prompt_present true."
            - "Four BehaviorFinding rows, none of which matches the declared tuple: A COARSE_LOCATION/MINOR confidence 0.9500 detected 2026-08-01T00:00:00Z; B CONTACTS/MAJOR confidence 0.7999 detected 2026-08-01T00:00:00Z; C PHOTOS/MAJOR confidence 0.9900 detected 2026-08-01T00:00:00Z then DISPUTED; D HEALTH/MINOR confidence 0.9900 detected 2026-08-01T06:00:00Z (after the pre-review check)."
          setup_api_calls: *CH_DRAFT
          trigger:
            - *c_loc
            - *c_age
            - *c_priv_tracking_ok
            - *c_finding_minor
            - call: "POST /behavior-findings"
              payload: { submission_id: "${sub_id}", data_type: "CONTACTS", observed_purpose: "ADVERTISING", observed_linked_to_user: true, observed_tracking: true, endpoint_domain: "ads.northwind.example", severity: "MAJOR", scanner_confidence: 0.7999, detected_at: "2026-08-01T00:00:00Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
              captures: { find_lowconf_id: $.data.id }
            - call: "POST /behavior-findings"
              payload: { submission_id: "${sub_id}", data_type: "PHOTOS", observed_purpose: "ANALYTICS", observed_linked_to_user: true, observed_tracking: false, endpoint_domain: "media.northwind.example", severity: "MAJOR", scanner_confidence: 0.9900, detected_at: "2026-08-01T00:00:00Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
              captures: { find_disputed_id: $.data.id }
            - call: "POST /behavior-findings/${find_disputed_id}/triage"
              payload: { action: "DISPUTE", justification: "Photo picker access is user initiated and not collected." }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
            - *c_prc
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
            - call: "POST /behavior-findings"
              payload: { submission_id: "${sub_id}", data_type: "HEALTH", observed_purpose: "ANALYTICS", observed_linked_to_user: true, observed_tracking: false, endpoint_domain: "vitals.northwind.example", severity: "MINOR", scanner_confidence: 0.9900, detected_at: "2026-08-01T06:00:00Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
              captures: { find_late_id: $.data.id }
            - *c_queue
            - *c_claim
            - call: "POST /submissions/${sub_id}/decision"
              payload: { outcome: "APPROVE" }
              as: PlatformReviewer
              as_user_id: "rev-01"
          assert:
            - "after the pre-review check, Submission.${sub_id}.pre_review_checked_at == 2026-08-01T00:00:00Z, pre_review_passed == true and disclosure_accuracy_score_provisional == 0.9500"
            - "after the late finding is filed, Submission.${sub_id}.disclosure_accuracy_score_provisional is still 0.9500 — detected_at 2026-08-01T06:00:00Z is outside the provisional window"
            - "the POST /submissions/${sub_id}/queue call returns 200: the queue gate reads the provisional 0.9500, which passes the inclusive DISCLOSURE_PASS_THRESHOLD"
            - "after the claim, Submission.${sub_id}.disclosure_accuracy_score_final == 0.4800 (100 - 5 - 20 - 20 - 5 - 2*1, divided by 100 once at the end)"
            - "at that same instant disclosure_accuracy_score_provisional is still 0.9500, so the two variants differ by 0.4700 over identical stored data"
            - "the POST /submissions/${sub_id}/decision call returns 409 with error.error_id == ERR_PRIVACY_DISCLOSURE_INACCURATE"
            - "Submission.${sub_id}.state is still IN_REVIEW and BehaviorFinding.${find_disputed_id}.status == DISPUTED"

      - name: the_same_critical_rejection_decays_in_the_rolling_variant_and_never_in_the_lifetime_variant
        claim_type: dual_variant_calculation
        grounds:
          - calculations.standing_score.variants.ROLLING_365
          - calculations.standing_score.variants.LIFETIME_UNDECAYED
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: "One CRITICAL RejectionReason recorded at 2026-08-01T00:00:00Z must drive standing_score_rolling_365 through 88.00 -> 94.00 (age 122 days, decay 0.5) -> 97.00 (age 212 days, decay 0.25) -> 100.00 (age 366 days, outside the inclusive 365-day window) while standing_score_lifetime stays pinned at 88.00 at every one of those instants."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z."
            - "Build 100 of Northwind Wallet REJECTED with exactly one CRITICAL RejectionReason (weight 12) recorded_at 2026-08-01T00:00:00Z, appeal_disposition PENDING."
            - "No appeal credits and no COMPLETED rollout plans, so credit == 0 in both variants."
          setup_api_calls: *CH_REJECTED
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-01T00:00:00Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-03-01T00:00:00Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-08-02T00:00:00Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
          assert:
            - "at 2026-08-01T00:00:00Z: standing_score_rolling_365 == 88.00 and standing_score_lifetime == 88.00 (age_days 0, decay 1.0 in both)"
            - "at 2026-12-01T00:00:00Z: PublisherAccount.${acct_id}.standing_score_rolling_365 == 94.00 and standing_score_lifetime == 88.00"
            - "at 2027-03-01T00:00:00Z: standing_score_rolling_365 == 97.00 and standing_score_lifetime == 88.00"
            - "at 2027-08-02T00:00:00Z: standing_score_rolling_365 == 100.00 and standing_score_lifetime == 88.00"
            - "PublisherAccount.${acct_id}.rejection_strike_count == 1 at every one of those instants — the strike count is not a decayed field"
            - "GET /rejection-reasons?submission_id=${sub_id} still reports total_count == 1 with severity CRITICAL; no row was deleted by the sweeps"

      - name: the_window_selector_ranks_by_free_slots_before_creation_order
        claim_type: selector_policy
        grounds:
          - calculations.review_capacity_allocation
          - endpoints.POST_/submissions/{id}/queue
          - entities.ReviewCapacityWindow.fields.slots_available
        distinguishing_aspect: "With two eligible IOS windows covering the clock, the queue call must assign the later-created POOL_B window because its slots_available of 6 outranks POOL_A's 5; a selector that fell back on created_at ASC or on the id would pick POOL_A."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; build 100 in PRE_REVIEW_PASSED."
            - "Window ${win_id}: IOS / POOL_A / 2026-08-01T00:00:00Z..2026-09-01T00:00:00Z / capacity 5, all free."
            - "Window ${winb_id}: IOS / POOL_B / same interval / capacity 6, created afterwards, all free."
          setup_api_calls: *CH_PRP
          trigger:
            - call: "POST /review-capacity-windows"
              payload: { platform: "IOS", reviewer_pool_code: "POOL_B", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-09-01T00:00:00Z", capacity_slots: 6 }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
              captures: { winb_id: $.data.id }
            - *c_queue
          assert:
            - "the POST /review-capacity-windows call returns 201 — POOL_B is a different pool code, so review_pool_concurrency sees no intersecting window and 6 <= 10"
            - "the queue call returns 200 and Submission.${sub_id}.assigned_review_window_id == ${winb_id}"
            - "ReviewCapacityWindow.${winb_id}.slots_reserved == 1, slots_consumed == 0 and slots_available == 5"
            - "ReviewCapacityWindow.${win_id}.slots_reserved == 0 and slots_available == 5 — untouched"
            - "5 + 1 + 0 == 6 for ${winb_id}, satisfying the conservation invariant"

      - name: a_tie_on_free_slots_is_broken_by_the_earlier_starts_at_not_by_creation_order
        claim_type: selector_policy
        grounds:
          - calculations.review_capacity_allocation
          - endpoints.POST_/submissions/{id}/queue
        distinguishing_aspect: "Two eligible IOS windows with identical slots_available of 5 must be separated by starts_at ASC, so the later-created POOL_C window that opened on 2026-07-15 wins over the POOL_A window that opened on 2026-08-01; created_at ASC is only the third-level tie-break and must not decide here."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; build 100 in PRE_REVIEW_PASSED."
            - "Window ${win_id}: IOS / POOL_A / 2026-08-01T00:00:00Z..2026-09-01T00:00:00Z / capacity 5, created first."
            - "Window ${winc_id}: IOS / POOL_C / 2026-07-15T00:00:00Z..2026-09-01T00:00:00Z / capacity 5, created second; the clock sits inside both half-open intervals."
          setup_api_calls: *CH_PRP
          trigger:
            - call: "POST /review-capacity-windows"
              payload: { platform: "IOS", reviewer_pool_code: "POOL_C", starts_at: "2026-07-15T00:00:00Z", ends_at: "2026-09-01T00:00:00Z", capacity_slots: 5 }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
              captures: { winc_id: $.data.id }
            - *c_queue
          assert:
            - "the POST /review-capacity-windows call returns 201 with slots_available == 5"
            - "the queue call returns 200 and Submission.${sub_id}.assigned_review_window_id == ${winc_id}"
            - "ReviewCapacityWindow.${winc_id}.slots_reserved == 1 and slots_available == 4"
            - "ReviewCapacityWindow.${win_id}.slots_reserved == 0 and slots_available == 5"

  - section: consistency_model
    instances:
      - name: the_queue_response_body_already_carries_every_field_the_queue_call_derived
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/submissions/{id}/queue.side_effects
          - calculations.review_priority_score
          - calculations.review_capacity_allocation
        distinguishing_aspect: "Under the immediate consistency model the queue response itself must already contain queued_at, provisional_deadline_at, priority_score, priority_band, effective_review_deadline_at and assigned_review_window_id, and a GET issued as the very next call must return byte-identical values with no second write and no settling delay."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; build 100 of Northwind Wallet in PRE_REVIEW_PASSED with window ${win_id} OPEN (capacity 5, all free)."
            - "standing_score_lifetime is 100.00 and there are no rejection strikes, so the priority score lands in the NORMAL band."
          setup_api_calls: *CH_PRP
          trigger:
            - *c_queue
            - call: "GET /submissions/${sub_id}"
              as: ReleaseManager
              as_user_id: "${acct_id}"
            - call: "GET /review-capacity-windows?platform=IOS"
              as: PlatformReviewer
              as_user_id: "rev-01"
          assert:
            - "the queue response status is 200 and its data block already reports state == WAITING_FOR_REVIEW, queued_at == 2026-08-01T00:00:00Z, provisional_deadline_at == 2026-08-03T00:00:00Z, priority_band == NORMAL, effective_review_deadline_at == 2026-08-03T00:00:00Z and assigned_review_window_id == ${win_id}"
            - "the queue response data.priority_score is a number in 40.00..69.99 consistent with priority_band NORMAL"
            - "the immediately following GET /submissions/${sub_id} returns exactly the same values for all six fields"
            - "the immediately following GET /review-capacity-windows?platform=IOS shows ${win_id} with slots_reserved == 1 and slots_available == 4 to a different role in the same sequence"
            - "no retry, sleep or clock advance is needed between the write and either read"

      - name: a_waiver_is_visible_in_the_derived_read_model_on_the_very_next_call
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/feature-mappings/{id}/waive
          - endpoints.GET_/app-records/{id}/compliance-summary
          - calculations.feature_compliance_index
          - calculations.compliance_posture
        distinguishing_aspect: "The compliance-summary projection is recomputed per request rather than cached, so the waiver that lifts feature_compliance_index from 0.00 to 100.00 must be reflected in the Auditor's very next read — posture OPEN with an empty reason-code list and mapping_failed 0 — without any intervening write to refresh a denormalised copy."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z."
            - "Northwind Wallet has exactly one FeatureMapping against EFFECTIVE PRIVACY rule 5.1.1 in self_review_status FAILED, so feature_compliance_index == 0.00 and compliance_posture == RESTRICTED with posture_reason_codes [COMPLIANCE_INDEX_BELOW_FLOOR]."
            - "An ACTIVE IOS DISTRIBUTION_CERT exists and there are no impact assessments or open findings."
          setup_api_calls: *CH_MAP_FAILED
          trigger:
            - call: "GET /app-records/${app_id}/compliance-summary"
              as: Auditor
              as_user_id: "aud-01"
            - *c_map_waive
            - call: "GET /app-records/${app_id}/compliance-summary"
              as: Auditor
              as_user_id: "aud-01"
          assert:
            - "the first compliance-summary returns 200 with compliance_posture == RESTRICTED, feature_compliance_index == 0.00, posture_reason_codes == [\"COMPLIANCE_INDEX_BELOW_FLOOR\"], mapping_total == 1 and mapping_failed == 1"
            - "the waive response status is 200 with data.self_review_status == WAIVED_BY_PLATFORM and data.waiver_reason == \"Compensating control accepted by policy.\""
            - "the second compliance-summary, issued as the very next call, returns compliance_posture == OPEN, feature_compliance_index == 100.00, posture_reason_codes == [] and mapping_failed == 0"
            - "the second compliance-summary reports mapping_total == 1, open_impact_count == 0, overdue_impact_count == 0, critical_finding_open_count == 0 and active_distribution_cert_present == true"
            - "GET /app-records/${app_id} read in the same sequence agrees: feature_compliance_index == 100.00 and compliance_posture == OPEN"
