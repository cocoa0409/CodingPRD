      - "POST /stores/{storeId}/veterinary-encounters/{encounterId}/start-exam — start the exam"
      - "POST /stores/{storeId}/veterinary-encounters/{encounterId}/complete-exam — complete the exam"
      - "POST /stores/{storeId}/veterinary-encounters/{encounterId}/cancel — cancel the appointment"
      - "POST /stores/{storeId}/prescription-authorizations — prescribe after an in-house exam"
      - "POST /stores/{storeId}/prescription-authorizations/{authorizationId}/revoke — revoke"
    shared_operations: []
  - name: GroomingStaff
    description: "Groomer who owns grooming risk screening, service completion and incident reporting"
    identity: opaque
    exclusive_operations:
      - "POST /stores/{storeId}/service-bookings/{bookingId}/screen — record a grooming risk screening"
      - "POST /stores/{storeId}/service-bookings/{bookingId}/start-service — start a service"
      - "POST /stores/{storeId}/service-bookings/{bookingId}/complete-service — complete a service"
      - "POST /stores/{storeId}/service-bookings/{bookingId}/cancel — cancel a booking"
      - "POST /stores/{storeId}/incident-records — report an injury during service"
