# =============================================================================
# Task 959 — Mobile Bike-Repair & Tune-Up (route) — Scaffold seed tables
# =============================================================================

scenario: "959. Mobile Bike-Repair & Tune-Up (route): service request & location, van route & dispatch, tune tier & parts/truck-stock, subscription (fleet/apartment), warranty/callback, e-bike & battery, per-job billing, scheduling"

domain_name: mobile-bike-repair
api_prefix: /v1

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (14 entities)
# =============================================================================
entities:
  - name: Zone
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Zone display name (service area)" }
      - { name: base_callout_fee_cents, type: integer, source: input, description: "Callout (travel) fee in cents charged per non-callback job in this zone; >= 0" }
      - { name: active, type: boolean, source: input, description: "Whether new service requests may target this zone", default: true }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer display name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across all customers" }
      - { name: account_kind, type: enum, source: input, description: "INDIVIDUAL | FLEET | APARTMENT; subscriptions require FLEET or APARTMENT" }
      - { name: phone, type: string, source: input, description: "Contact phone (optional)", default: null }
      - { name: account_credit_cents, type: integer, source: system, description: "Goodwill credit balance in cents; starts at 0; drawn down by invoice PAY with use_credit" }

  - name: Bike
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owning customer" }
      - { name: bike_type, type: enum, source: input, description: "MECHANICAL | EBIKE" }
      - { name: brand, type: string, source: input, description: "Free-text brand/model note (optional)", default: null }
      - { name: battery_wh, type: integer, source: input, description: "Battery capacity in watt-hours; REQUIRED when bike_type=EBIKE, must be null for MECHANICAL", default: null }
      - { name: battery_certified, type: boolean, source: input, description: "Whether the battery pack is certified for mobile service; default true", default: true }
      - { name: battery_health_pct, type: integer, source: input, description: "Battery state-of-health 0..100; default 100", default: 100 }

  - name: Mechanic
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Mechanic display name" }
      - { name: ebike_certified, type: boolean, source: input, description: "Certified to service e-bike electrical systems" }
      - { name: home_zone_id, type: string, source: input, description: "FK -> Zone.id; mechanic's home zone" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED; starts ACTIVE" }

  - name: Van
    parent: null
    common_fields: true
    fields:
      - { name: plate, type: string, source: input, description: "License plate / van label" }
      - { name: zone_id, type: string, source: input, description: "FK -> Zone.id; zone the van operates in" }
      - { name: mechanic_id, type: string, source: input, description: "FK -> Mechanic.id; assigned mechanic (optional at creation)", default: null }
      - { name: max_stops_per_day, type: integer, source: input, description: "Maximum active route stops per route day; >= 1" }
      - { name: status, type: enum, source: system, description: "ACTIVE | OUT_OF_SERVICE; starts ACTIVE" }

  - name: Part
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Stock-keeping unit; unique across all parts" }
      - { name: name, type: string, source: input, description: "Part display name" }
      - { name: unit_price_cents, type: integer, source: input, description: "Unit sale price in cents; >= 0" }
      - { name: warranty_days, type: integer, source: input, description: "Part warranty length in days from job completion; >= 0" }
      - { name: ebike_only, type: boolean, source: input, description: "Whether the part is only usable on e-bikes; default false", default: false }

  - name: TruckStockItem
    parent: null
    common_fields: true
    fields:
      - { name: van_id, type: string, source: system, description: "FK -> Van.id; van holding the stock" }
      - { name: part_id, type: string, source: system, description: "FK -> Part.id; stocked part" }
      - { name: on_hand, type: integer, source: system, description: "Physical units on the van; changed only by RECEIVE(+), RETURN_TO_WAREHOUSE(-), CONSUME(-); never negative" }
      - { name: reserved, type: integer, source: system, description: "Units reserved for open service requests; 0 <= reserved <= on_hand" }

  - name: StockMovement
    parent: null
    common_fields: false   # append-only event log: id + created_at only
    fields:
      - { name: van_id, type: string, source: system, description: "FK -> Van.id; van whose stock moved" }
      - { name: part_id, type: string, source: system, description: "FK -> Part.id; part moved" }
      - { name: service_request_id, type: string, source: system, description: "FK -> ServiceRequest.id; set when reason is RESERVE/RELEASE/CONSUME, else null", default: null }
      - { name: quantity_delta, type: integer, source: system, description: "Signed units moved (RECEIVE +n, RETURN_TO_WAREHOUSE -n); 0 for RESERVE/RELEASE/CONSUME" }
      - { name: reason, type: enum, source: system, description: "RECEIVE | RETURN_TO_WAREHOUSE | RESERVE | RELEASE | CONSUME" }
      - { name: note, type: string, source: input, description: "Free-text note (optional)", default: null }

  - name: ServiceTier
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Tier code BASIC | STANDARD | PREMIUM; unique" }
      - { name: base_price_cents, type: integer, source: input, description: "Base labor price in cents covering included_minutes" }
      - { name: included_minutes, type: integer, source: input, description: "Labor minutes included in base price; > 0" }
      - { name: overage_rate_cents_per_min, type: integer, source: input, description: "Cents per labor minute beyond included_minutes; >= 0" }
      - { name: labor_warranty_days, type: integer, source: input, description: "Labor warranty length in days from completion; >= 0" }

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; subscribing account (must be FLEET or APARTMENT)" }
      - { name: included_tunes_per_period, type: integer, source: input, description: "Number of STANDARD tune jobs covered per period; >= 1" }
      - { name: discount_pct, type: number, source: input, description: "Fractional discount (e.g. 0.10) applied per labor/parts line on covered jobs; 0 < discount_pct < 1" }
      - { name: period_start, type: datetime, source: input, description: "Coverage period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Coverage period end (inclusive)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | PAST_DUE | SUSPENDED | CANCELLED; starts ACTIVE" }
      - { name: allowance_reserved, type: integer, source: system, description: "Allowance units reserved by open (non-terminal) STANDARD requests; starts 0" }
      - { name: allowance_consumed, type: integer, source: system, description: "Allowance units settled by COMPLETED STANDARD requests; starts 0" }
      - { name: allowance_remaining, type: integer, source: computed, description: "Forward-looking variant: included_tunes_per_period - allowance_reserved - allowance_consumed" }
      - { name: settled_allowance_remaining, type: integer, source: computed, description: "Chronological/settled variant: included_tunes_per_period - allowance_consumed" }

  - name: ServiceRequest
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; requesting customer" }
      - { name: bike_id, type: string, source: input, description: "FK -> Bike.id; bike to service; must belong to customer_id" }
      - { name: zone_id, type: string, source: input, description: "FK -> Zone.id; service location zone" }
      - { name: tier_id, type: string, source: input, description: "FK -> ServiceTier.id; tune tier" }
      - { name: subscription_id, type: string, source: input, description: "FK -> Subscription.id; covering subscription (optional)", default: null }
      - { name: request_kind, type: enum, source: system, description: "STANDARD | CALLBACK; CALLBACK set when created via the callbacks endpoint" }
      - { name: callback_of_id, type: string, source: system, description: "FK -> ServiceRequest.id; self-reference to the original job for CALLBACK requests, else null", default: null }
      - { name: window_start, type: datetime, source: input, description: "Requested arrival window start (ISO 8601 UTC)" }
      - { name: window_end, type: datetime, source: input, description: "Requested arrival window end (ISO 8601 UTC)" }
      - { name: issue_note, type: string, source: input, description: "Problem description (optional)", default: null }
      - { name: work_status, type: enum, source: system, description: "QUOTED | DISPATCHED | ON_SITE | IN_SERVICE | ON_HOLD_PARTS | COMPLETED | CLOSED | CANCELLED | NO_SHOW" }
      - { name: billing_status, type: enum, source: system, description: "ESTIMATED | INVOICED | DISPUTED | PAID; starts ESTIMATED; evolves independently of work_status" }
      - { name: scheduled_mechanic_id, type: string, source: system, description: "FK -> Mechanic.id; assigned via route dispatch, else null", default: null }
      - { name: quoted_total_cents, type: integer, source: computed, description: "Provisional quote total (see calculations.provisional_quote); recomputed on create and on subscription-cascade recompute" }
      - { name: covered_by_subscription, type: boolean, source: system, description: "True while an ACTIVE/PAST_DUE subscription covers this request; cleared by subscription SUSPEND/CANCEL cascade" }
      - { name: actual_labor_minutes, type: integer, source: system, description: "Actual labor minutes recorded at COMPLETE, else null", default: null }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock timestamp of COMPLETE, else null", default: null }
      - { name: cancel_reason, type: string, source: input, description: "Cancellation reason (optional, CANCEL event)", default: null }

  - name: RouteDay
    parent: null
    common_fields: true
    fields:
      - { name: van_id, type: string, source: input, description: "FK -> Van.id; van running the route" }
      - { name: date, type: string, source: input, description: "Route date YYYY-MM-DD; unique per van (van_id, date)" }
      - { name: status, type: enum, source: system, description: "OPEN | LOCKED | IN_PROGRESS | CLOSED; starts OPEN" }
      - { name: active_stop_count, type: integer, source: computed, description: "Count of RouteStops on this day with status PLANNED or ARRIVED" }

  - name: RouteStop
    parent: null
    common_fields: true
    fields:
      - { name: route_day_id, type: string, source: system, description: "FK -> RouteDay.id; owning route day" }
      - { name: service_request_id, type: string, source: system, description: "FK -> ServiceRequest.id; dispatched request" }
      - { name: seq, type: integer, source: system, description: "Visit order within the route day; 1-based; rewritten by resequence" }
      - { name: planned_start, type: datetime, source: input, description: "Planned arrival (must be >= request window_start)" }
      - { name: planned_end, type: datetime, source: input, description: "Planned departure (must be <= request window_end)" }
      - { name: travel_buffer_minutes, type: integer, source: input, description: "Buffer applied around this stop for mechanic overlap checks; default 15; >= 0", default: 15 }
      - { name: status, type: enum, source: system, description: "PLANNED | ARRIVED | DONE | SKIPPED | UNASSIGNED; starts PLANNED" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: service_request_id, type: string, source: system, description: "FK -> ServiceRequest.id; billed request" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | DISPUTED | PAID | VOID; starts DRAFT" }
      - { name: callout_cents, type: integer, source: computed, description: "Callout fee charged (0 for CALLBACK requests)" }
      - { name: labor_cents, type: integer, source: computed, description: "Gross labor line: tier base + overage minutes * overage rate (0 for CALLBACK)" }
      - { name: parts_gross_cents, type: integer, source: computed, description: "Sum of part line totals before discount" }
      - { name: discount_cents, type: integer, source: computed, description: "Total subscription discount: sum of per-line discounts, each rounded half-up to cents (see calculations.parts_line_discounts)" }
      - { name: subtotal_cents, type: integer, source: computed, description: "callout_cents + discounted labor + discounted parts (pre-surcharge, pre-tax)" }
      - { name: surcharge_cents, type: integer, source: computed, description: "Route/fuel surcharge; bracket keyed on subtotal_cents BEFORE surcharge (see calculations.route_surcharge)" }
      - { name: tax_cents, type: integer, source: computed, description: "8% tax on (subtotal_cents + surcharge_cents), round_half_up to cents" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents + surcharge_cents + tax_cents" }
      - { name: credit_applied_cents, type: integer, source: system, description: "Customer account credit applied at PAY; 0 until paid" }
      - { name: amount_paid_cents, type: integer, source: system, description: "Cash amount paid at PAY; 0 until paid" }
      - { name: line_items, type: array, source: system, description: "Per-line breakdown: [{part_id, sku, quantity, unit_price_cents, line_total_cents, line_discount_cents}] plus a LABOR line" }
      - { name: is_no_show_fee, type: boolean, source: system, description: "True when generated for a NO_SHOW request (callout + tax only)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ServiceRequest
    field: work_status
    note: "Parallel dimensions: work_status and billing_status evolve independently on the same row (e.g., a request may be work_status=IN_SERVICE while billing_status is still ESTIMATED)."
    initial_state: QUOTED
    terminal_states: [CLOSED, CANCELLED, NO_SHOW]
    transitions:
      - from: QUOTED
        to: DISPATCHED
        trigger: "POST /v1/route-days/{route_day_id}/stops (create stop for this request)"
        actor: Dispatcher
        preconditions:
          - "RouteDay.status == OPEN"
          - "Van.status == ACTIVE and Van.mechanic_id is not null"
          - "assigned Mechanic.status == ACTIVE"
          - "bike_type == EBIKE implies assigned Mechanic.ebike_certified == true"
          - "planned_start/planned_end within [window_start, window_end]"
          - "no mechanic overlap per calculations.mechanic_stop_overlap"
          - "RouteDay.active_stop_count < Van.max_stops_per_day"
        side_effects:
          - "RouteStop created (status PLANNED, seq = active_stop_count + 1)"
          - "scheduled_mechanic_id := Van.mechanic_id"
          - "RouteDay.active_stop_count recomputed; RouteDay.version + 1"

      - from: DISPATCHED
        to: QUOTED
        trigger: "system (Mechanic SUSPEND cascade or RouteStop SKIP event)"
        actor: system
        preconditions: []
        side_effects:
          - "scheduled_mechanic_id := null"
          - "linked RouteStop := SKIPPED (skip) or UNASSIGNED (suspend cascade)"
          - "RouteDay.active_stop_count recomputed; RouteDay.version + 1"
          - "if RouteDay.status == LOCKED and active_stop_count == 0: RouteDay auto-transitions LOCKED -> OPEN"

      - from: DISPATCHED
        to: ON_SITE
        trigger: "POST /v1/route-stops/{stop_id}/events (ARRIVE)"
        actor: Mechanic
        preconditions:
          - "RouteStop.status == PLANNED"
          - "acting Mechanic.id == scheduled_mechanic_id"
        side_effects:
          - "RouteStop.status := ARRIVED"

      - from: ON_SITE
        to: IN_SERVICE
        trigger: "POST /v1/service-requests/{request_id}/events (START_SERVICE)"
        actor: Mechanic
        preconditions:
          - "acting Mechanic.id == scheduled_mechanic_id"
        side_effects: []

      - from: IN_SERVICE
        to: ON_HOLD_PARTS
        trigger: "POST /v1/service-requests/{request_id}/events (HOLD_PARTS)"
        actor: Mechanic
        preconditions:
          - "acting Mechanic.id == scheduled_mechanic_id"
        side_effects: []

      - from: ON_HOLD_PARTS
        to: IN_SERVICE
        trigger: "POST /v1/service-requests/{request_id}/events (RESUME)"
        actor: Mechanic
        preconditions:
          - "acting Mechanic.id == scheduled_mechanic_id"
        side_effects: []
        note: "IN_SERVICE -> ON_HOLD_PARTS -> IN_SERVICE is an unrestricted cycle (parts-wait loop)."

      - from: IN_SERVICE
        to: COMPLETED
        trigger: "POST /v1/service-requests/{request_id}/events (COMPLETE, labor_minutes)"
        actor: Mechanic
        preconditions:
          - "acting Mechanic.id == scheduled_mechanic_id"
          - "labor_minutes present and >= 0"
        side_effects:
          - "actual_labor_minutes := labor_minutes; completed_at := current logical clock"
          - "any TruckStockItem units still RESERVED for this request are RELEASED (StockMovement reason=RELEASE appended)"
          - "if covered_by_subscription: Subscription.allowance_reserved - 1, allowance_consumed + 1 (chronological settlement)"

      - from: COMPLETED
        to: CLOSED
        trigger: "system (billing_status becomes PAID)"
        actor: system
        preconditions:
          - "billing_status == PAID"
        side_effects: []
        note: "Bubble-up auto-transition: COMPLETED + PAID => CLOSED in the same request that pays the invoice."

      - from: QUOTED
        to: CANCELLED
        trigger: "POST /v1/service-requests/{request_id}/events (CANCEL)"
        actor: "Customer (own request) or Dispatcher"
        preconditions: []
        side_effects:
          - "if covered_by_subscription: Subscription.allowance_reserved - 1 (release)"
          - "no cancellation invoice (free cancel)"

      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /v1/service-requests/{request_id}/events (CANCEL)"
        actor: "Customer (own request) or Dispatcher"
        preconditions: []
        side_effects:
          - "linked RouteStop (PLANNED/ARRIVED) := SKIPPED; RouteDay.active_stop_count recomputed; RouteDay.version + 1"
          - "scheduled_mechanic_id := null"
          - "if covered_by_subscription: Subscription.allowance_reserved - 1"
          - "cancellation-fee Invoice auto-created in DRAFT: callout_cents = Zone.base_callout_fee_cents, labor/parts 0, no surcharge, tax on callout"

      - from: ON_SITE
        to: CANCELLED
        trigger: "POST /v1/service-requests/{request_id}/events (CANCEL)"
        actor: "Customer (own request) or Dispatcher"
        preconditions: []
        side_effects:
          - "linked RouteStop := SKIPPED; RouteDay.active_stop_count recomputed; RouteDay.version + 1"
          - "if covered_by_subscription: Subscription.allowance_reserved - 1"
          - "cancellation-fee Invoice auto-created in DRAFT (callout + tax only)"

      - from: ON_SITE
        to: NO_SHOW
        trigger: "POST /v1/service-requests/{request_id}/events (MARK_NO_SHOW)"
        actor: Mechanic
        preconditions:
          - "acting Mechanic.id == scheduled_mechanic_id"
        side_effects:
          - "linked RouteStop := SKIPPED; RouteDay.active_stop_count recomputed; RouteDay.version + 1"
          - "if covered_by_subscription: Subscription.allowance_reserved - 1 (no-show does not consume allowance)"
          - "no-show Invoice auto-created in DRAFT: callout_cents + tax only (is_no_show_fee = true)"

  - entity: ServiceRequest
    field: billing_status
    note: "Second, independent state dimension on ServiceRequest."
    initial_state: ESTIMATED
    terminal_states: [PAID]
    transitions:
      - from: ESTIMATED
        to: INVOICED
        trigger: "POST /v1/invoices/{invoice_id}/events (ISSUE) on this request's Invoice"
        actor: Dispatcher
        preconditions:
          - "a non-VOID Invoice exists for this request"
        side_effects: []
      - from: INVOICED
        to: DISPUTED
        trigger: "POST /v1/invoices/{invoice_id}/events (DISPUTE)"
        actor: Customer
        preconditions: []
        side_effects: []
      - from: DISPUTED
        to: INVOICED
        trigger: "POST /v1/invoices/{invoice_id}/events (ISSUE) re-issue after dispute"
        actor: Dispatcher
        preconditions: []
        side_effects: []
        note: "INVOICED -> DISPUTED -> INVOICED cycle mirrors the Invoice state machine."
      - from: INVOICED
        to: PAID
        trigger: "POST /v1/invoices/{invoice_id}/events (PAY)"
        actor: Customer
        preconditions: []
        side_effects:
          - "if work_status == COMPLETED: work_status := CLOSED"

  - entity: Invoice
    field: status
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /v1/invoices/{invoice_id}/events (ISSUE)"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "ServiceRequest.billing_status := INVOICED"
      - from: DISPUTED
        to: ISSUED
        trigger: "POST /v1/invoices/{invoice_id}/events (ISSUE) — re-issue"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "ServiceRequest.billing_status := INVOICED"
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /v1/invoices/{invoice_id}/events (DISPUTE, dispute_reason)"
        actor: "Customer (own invoice)"
        preconditions: []
        side_effects:
          - "ServiceRequest.billing_status := DISPUTED"
      - from: ISSUED
        to: PAID
        trigger: "POST /v1/invoices/{invoice_id}/events (PAY, amount_cents, use_credit?)"
        actor: "Customer (own invoice)"
        preconditions:
          - "amount_cents == total_cents - credit_applied_cents (credit_applied = min(Customer.account_credit_cents, total_cents) when use_credit is true, else 0)"
        side_effects:
          - "credit_applied_cents and amount_paid_cents recorded; Customer.account_credit_cents -= credit_applied_cents"
          - "ServiceRequest.billing_status := PAID; if work_status == COMPLETED: work_status := CLOSED"
      - from: DRAFT
        to: VOID
        trigger: "POST /v1/invoices/{invoice_id}/events (VOID)"
        actor: Dispatcher
        preconditions: []
        side_effects: []
      - from: DISPUTED
        to: VOID
        trigger: "POST /v1/invoices/{invoice_id}/events (VOID)"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "ServiceRequest.billing_status := ESTIMATED (request becomes re-billable)"

  - entity: RouteDay
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /v1/route-days/{route_day_id}/events (LOCK)"
        actor: Dispatcher
        preconditions: []
        side_effects: []
      - from: LOCKED
        to: OPEN
        trigger: "POST /v1/route-days/{route_day_id}/events (UNLOCK)"
        actor: Dispatcher
        preconditions: []
        side_effects: []
        note: "LOCK/UNLOCK revert: non-linear branching shape."
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /v1/route-days/{route_day_id}/events (START)"
        actor: Dispatcher
        preconditions:
          - "active_stop_count >= 1"
        side_effects: []
      - from: LOCKED
        to: IN_PROGRESS
        trigger: "POST /v1/route-days/{route_day_id}/events (START)"
        actor: Dispatcher
        preconditions:
          - "active_stop_count >= 1"
        side_effects: []
      - from: IN_PROGRESS
        to: CLOSED
        trigger: "POST /v1/route-days/{route_day_id}/events (CLOSE)"
        actor: Dispatcher
        preconditions:
          - "every RouteStop on this day is in a terminal status (DONE, SKIPPED, or UNASSIGNED)"
        side_effects: []
      - from: LOCKED
        to: OPEN
        trigger: "system (mechanic-suspend cascade emptied the route: active_stop_count == 0)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Auto-unlock: third hop of the mechanic-suspend cascade."

  - entity: RouteStop
    field: status
    initial_state: PLANNED
    terminal_states: [DONE, SKIPPED, UNASSIGNED]
    transitions:
      - from: PLANNED
        to: ARRIVED
        trigger: "POST /v1/route-stops/{stop_id}/events (ARRIVE)"
        actor: Mechanic
        preconditions:
          - "acting Mechanic.id == linked ServiceRequest.scheduled_mechanic_id"
        side_effects:
          - "ServiceRequest.work_status := ON_SITE"
      - from: ARRIVED
        to: DONE
        trigger: "POST /v1/route-stops/{stop_id}/events (DONE)"
        actor: Mechanic
        preconditions:
          - "linked ServiceRequest.work_status == COMPLETED"
        side_effects:
          - "RouteDay.active_stop_count recomputed; RouteDay.version + 1"
      - from: PLANNED
        to: SKIPPED
        trigger: "POST /v1/route-stops/{stop_id}/events (SKIP)"
        actor: "Mechanic or Dispatcher"
        preconditions: []
        side_effects:
          - "ServiceRequest.work_status := QUOTED (revert), scheduled_mechanic_id := null"
          - "RouteDay.active_stop_count recomputed; RouteDay.version + 1"
      - from: PLANNED
        to: UNASSIGNED
        trigger: "system (Mechanic SUSPEND cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "ServiceRequest.work_status := QUOTED (revert), scheduled_mechanic_id := null"
          - "RouteDay.active_stop_count recomputed; RouteDay.version + 1"

  - entity: Subscription
    field: status
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAST_DUE
        trigger: "POST /v1/subscriptions/{subscription_id}/events (MARK_PAST_DUE)"
        actor: "PlatformAdmin or Dispatcher"
        preconditions: []
        side_effects: []
      - from: PAST_DUE
        to: ACTIVE
        trigger: "POST /v1/subscriptions/{subscription_id}/events (RECOVER)"
        actor: "PlatformAdmin or Dispatcher"
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /v1/subscriptions/{subscription_id}/events (SUSPEND)"
        actor: "PlatformAdmin or Dispatcher"
        preconditions: []
        side_effects:
          - "cascade hop 1: every ServiceRequest with subscription_id == this subscription and work_status IN {QUOTED, DISPATCHED, ON_SITE, IN_SERVICE, ON_HOLD_PARTS}: covered_by_subscription := false"
          - "cascade hop 2 (per affected request): allowance_reserved - 1 (reservation released), then quoted_total_cents recomputed WITHOUT subscription discount (calculations.provisional_quote)"
      - from: PAST_DUE
        to: SUSPENDED
        trigger: "POST /v1/subscriptions/{subscription_id}/events (SUSPEND)"
        actor: "PlatformAdmin or Dispatcher"
        preconditions: []
        side_effects:
          - "same cascade as ACTIVE -> SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /v1/subscriptions/{subscription_id}/events (REINSTATE)"
        actor: "PlatformAdmin or Dispatcher"
        preconditions: []
        side_effects: []
        note: "REINSTATE does NOT restore coverage on previously decoupled requests."
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /v1/subscriptions/{subscription_id}/events (CANCEL)"
        actor: "PlatformAdmin or Dispatcher"
        preconditions: []
        side_effects:
          - "same decoupling cascade as SUSPEND"
      - from: PAST_DUE
        to: CANCELLED
        trigger: "POST /v1/subscriptions/{subscription_id}/events (CANCEL)"
        actor: "PlatformAdmin or Dispatcher"
        preconditions: []
        side_effects:
          - "same decoupling cascade as SUSPEND"
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /v1/subscriptions/{subscription_id}/events (CANCEL)"
        actor: "PlatformAdmin or Dispatcher"
        preconditions: []
        side_effects: []

  - entity: Mechanic
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /v1/mechanics/{mechanic_id}/events (SUSPEND)"
        actor: "PlatformAdmin or Dispatcher"
        preconditions: []
        side_effects:
          - "cascade hop 1: every RouteStop with status PLANNED on a non-CLOSED RouteDay whose Van.mechanic_id == this mechanic: status := UNASSIGNED"
          - "cascade hop 2 (per affected stop): linked ServiceRequest DISPATCHED -> QUOTED, scheduled_mechanic_id := null"
          - "cascade hop 3 (per affected RouteDay): active_stop_count recomputed, version + 1; if status == LOCKED and active_stop_count == 0: auto-transition LOCKED -> OPEN"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /v1/mechanics/{mechanic_id}/events (REINSTATE)"
        actor: "PlatformAdmin or Dispatcher"
        preconditions: []
        side_effects: []

  - entity: Van
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: OUT_OF_SERVICE
        trigger: "POST /v1/vans/{van_id}/events (TAKE_OUT_OF_SERVICE)"
        actor: "PlatformAdmin or Dispatcher"
        preconditions: []
        side_effects: []
      - from: OUT_OF_SERVICE
        to: ACTIVE
        trigger: "POST /v1/vans/{van_id}/events (RETURN_TO_SERVICE)"
        actor: "PlatformAdmin or Dispatcher"
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /v1/vans/{van_id}/events (ASSIGN_MECHANIC, mechanic_id)"
        actor: "PlatformAdmin or Dispatcher"
        preconditions:
          - "target Mechanic.status == ACTIVE"
        side_effects:
          - "mechanic_id := given mechanic"
        note: "Self-loop reassignment, not a status change."

# =============================================================================
# §1.2.1 Concurrency Rules (true races only; OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: route-resequence-stale-version
    parent_entity: RouteDay
    write_endpoint: "POST /v1/route-days/{route_day_id}/resequence"
    occ_field: expected_route_day_version
    description: |
      Resequencing a RouteDay whose version has advanced since the client last
      observed it is rejected. Two sequential resequences of the same OPEN route
      day both see a legitimate from-state, so the stale writer is detected only
      via the version check; the loser gets ERR_STALE_VERSION.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: request-reschedule-stale-version
    parent_entity: ServiceRequest
    write_endpoint: "POST /v1/service-requests/{request_id}/reschedule"
    occ_field: expected_service_request_version
    description: |
      Rescheduling a QUOTED ServiceRequest whose version has advanced since the
      client last observed it is rejected. A second sequential reschedule from
      QUOTED remains a legitimate transition, so the stale writer is detected
      only via the version check; the loser gets ERR_STALE_VERSION.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: provisional_quote
    trigger: "ServiceRequest creation; also recomputed by the subscription SUSPEND/CANCEL decoupling cascade"
    algorithm: forward_looking
    formula: |
      Variant PROVISIONAL (stored on ServiceRequest.quoted_total_cents):
        labor_net = tier.base_price_cents
                    - (round_half_up(tier.base_price_cents * subscription.discount_pct)
                       if covered_by_subscription else 0)
        subtotal  = zone.base_callout_fee_cents + labor_net        # no parts known yet
        surcharge = route_surcharge(subtotal)                       # bracket keyed on PRE-surcharge subtotal
        tax       = round_half_up((subtotal + surcharge) * TAX_RATE)
        quoted_total_cents = subtotal + surcharge + tax
      Assumes exactly tier.included_minutes of labor (no overage) and no parts.
      For CALLBACK requests: callout = 0 and labor base = 0.
    input_set: "the ServiceRequest's zone, tier, and (if covered_by_subscription) subscription; parts and actual labor excluded by definition"
    constants:
      TAX_RATE: 0.08
    precision: "integer cents; round_half_up wherever a multiplication yields a fraction"
    variants:
      - name: provisional
        when: "at creation and after decoupling cascade"
        difference: "no parts, no overage, assumes included_minutes exactly"
      - name: final
        when: "invoice generation after COMPLETED/NO_SHOW"
        difference: "see calculations.final_invoice — actual parts and labor; diverges from provisional for identical request context"

  - name: final_invoice
    trigger: "POST /v1/service-requests/{request_id}/invoices (requires work_status COMPLETED or NO_SHOW)"
    algorithm: tiered_pricing
    formula: |
      Evaluation order is PINNED (do not reorder):
        1. labor_gross = tier.base_price_cents
                         + max(0, actual_labor_minutes - tier.included_minutes) * tier.overage_rate_cents_per_min
           (CALLBACK: labor_gross = 0; NO_SHOW: labor_gross = 0, parts = empty)
        2. parts lines: for each StockMovement with reason=CONSUME grouped by part:
           line_total = quantity * part.unit_price_cents
        3. discounts (per line, see calculations.parts_line_discounts):
           labor_discount = round_half_up(labor_gross * discount_pct) if covered else 0
           line_discount  = round_half_up(line_total * discount_pct) if covered else 0
           discount_cents = labor_discount + sum(line_discount)
        4. callout_cents = zone.base_callout_fee_cents (0 for CALLBACK)
        5. subtotal_cents = callout_cents + (labor_gross - labor_discount) + (parts_gross_cents - sum(line_discount))
        6. surcharge_cents = route_surcharge(subtotal_cents)   # keyed on PRE-surcharge subtotal
        7. tax_cents = round_half_up((subtotal_cents + surcharge_cents) * TAX_RATE)
        8. total_cents = subtotal_cents + surcharge_cents + tax_cents
      NO_SHOW / cancellation-fee invoices: only callout_cents and tax on it; surcharge 0
      (callout subtotal 2500 < SURCHARGE_T1_MIN anyway under default constants).
    input_set: "COMPLETED request with actual_labor_minutes; StockMovements with reason=CONSUME and service_request_id=this request; zone, tier, subscription snapshot at completion"
    constants:
      TAX_RATE: 0.08
    precision: "integer cents; per-line round_half_up BEFORE summing (see parts_line_discounts)"
    variants:
      - name: final
        when: "invoice generation"
        difference: "uses actuals; diverges from provisional_quote for identical request"
      - name: provisional
        when: "booking time"
        difference: "see calculations.provisional_quote"

  - name: parts_line_discounts
    trigger: "inside final_invoice step 3 (and provisional_quote labor line)"
    algorithm: aggregation
    formula: |
      PINNED ROUNDING ORDER: discount is computed PER LINE and rounded half-up to
      integer cents BEFORE summing:
        discount_cents = sum_over_lines( round_half_up(line_gross_cents * discount_pct) )
      The alternative (sum all gross lines, then round one product) can differ by
      cents and is FORBIDDEN. Example: two 333-cent lines at 10% give
      round(33.3) + round(33.3) = 33 + 33 = 66, whereas round(666 * 0.10) = 67.
    input_set: "labor line plus each consumed-part line of the invoice"
    constants: {}
    precision: "integer cents, round_half_up per line, then sum"

  - name: route_surcharge
    trigger: "inside provisional_quote and final_invoice"
    algorithm: threshold
    formula: |
      Surcharge bracket is keyed on the PRE-surcharge subtotal_cents (this pins the
      otherwise circular question 'total includes surcharge, so which value selects
      the bracket'):
        subtotal_cents <  SURCHARGE_T1_MIN                        -> 0
        SURCHARGE_T1_MIN <= subtotal_cents < SURCHARGE_T2_MIN     -> SURCHARGE_T1_CENTS
        subtotal_cents >= SURCHARGE_T2_MIN                        -> SURCHARGE_T2_CENTS
      Boundaries are >= (a subtotal of exactly 10000 yields 500, exactly 20000 yields 1200).
    input_set: "the invoice/quote subtotal_cents"
    constants:
      SURCHARGE_T1_MIN: 10000
      SURCHARGE_T1_CENTS: 500
      SURCHARGE_T2_MIN: 20000
      SURCHARGE_T2_CENTS: 1200
    precision: "integer cents; comparisons on exact integers"

  - name: subscription_allowance
    trigger: "ServiceRequest create with subscription_id (reserve), CANCEL / MARK_NO_SHOW / decoupling cascade (release), COMPLETE (settle)"
    algorithm: chronological
    formula: |
      Two valid readings of 'allowance left' coexist and MUST both be exposed:
        RESERVED view (forward-looking):  allowance_remaining         = included_tunes_per_period - allowance_reserved - allowance_consumed
        SETTLED view  (chronological):    settled_allowance_remaining = included_tunes_per_period - allowance_consumed
      Reserve: creation of a STANDARD request with subscription_id requires
        allowance_remaining >= 1, then allowance_reserved += 1.
      Release: CANCEL, MARK_NO_SHOW, or subscription decoupling cascade => allowance_reserved -= 1.
      Settle: COMPLETE of a covered request => allowance_reserved -= 1, allowance_consumed += 1.
      CALLBACK requests never touch the allowance.
    input_set: "Subscription counters; only STANDARD requests with covered_by_subscription"
    constants: {}
    precision: "integer units"
    variants:
      - name: reserved_view
        when: "booking-time gating and customer-facing 'remaining'"
        difference: "subtracts both reserved and consumed"
      - name: settled_view
        when: "accounting view of actually delivered tunes"
        difference: "subtracts only consumed; diverges from reserved view while any request is open"

  - name: warranty_window
    trigger: "POST /v1/service-requests/{request_id}/callbacks"
    algorithm: threshold
    formula: |
      warranty_days = max(tier.labor_warranty_days,
                          max(part.warranty_days over parts CONSUMED on the original request, default 0))
      deadline = original.completed_at + warranty_days days
      Callback eligible iff current_logical_clock <= deadline  (INCLUSIVE at the exact deadline second).
      Requires original work_status == COMPLETED and no existing non-terminal callback
      (callback work_status NOT IN {CLOSED, CANCELLED, NO_SHOW}).
    input_set: "original COMPLETED request, its tier, its consumed parts, logical clock"
    constants: {}
    precision: "second-precision ISO 8601 comparison, inclusive <="

  - name: mechanic_stop_overlap
    trigger: "POST /v1/route-days/{route_day_id}/stops"
    algorithm: interval_overlap
    formula: |
      HALF-OPEN intervals WITH BUFFER. The new stop occupies
      [planned_start - buffer, planned_end + buffer) where buffer = the NEW stop's
      travel_buffer_minutes. Conflict with any existing PLANNED/ARRIVED stop assigned
      to the same mechanic (across ALL route days of the same mechanic's vans) iff:
        new_start - buffer < exist_end   AND   exist_start < new_end + buffer
      Exact touch at the expanded boundary is ALLOWED (half-open): a new stop starting
      exactly at exist_end + buffer does NOT conflict.
    input_set: "existing stops with status IN {PLANNED, ARRIVED} whose ServiceRequest.scheduled_mechanic_id equals the candidate mechanic"
    constants:
      DEFAULT_TRAVEL_BUFFER_MINUTES: 15
    precision: "second precision"

  - name: customer_window_overlap
    trigger: "POST /v1/service-requests and POST /v1/service-requests/{id}/reschedule"
    algorithm: interval_overlap
    formula: |
      CLOSED intervals, NO buffer — deliberately different semantics from
      mechanic_stop_overlap. Two requests of the same customer conflict iff both are
      in work_status IN {QUOTED, DISPATCHED, ON_SITE, IN_SERVICE, ON_HOLD_PARTS} and:
        new_start <= exist_end AND exist_start <= new_end
      Touching endpoints CONFLICT (inclusive): a new window starting exactly at the
      existing window's end is rejected.
    input_set: "existing non-terminal requests of the same customer_id (CALLBACK and STANDARD alike)"
    constants: {}
    precision: "second precision"

  - name: truck_stock_reconciliation
    trigger: "every stock movement (RECEIVE, RETURN_TO_WAREHOUSE, RESERVE, RELEASE, CONSUME)"
    algorithm: aggregation
    formula: |
      Per (van_id, part_id), TruckStockItem is a derived view over StockMovement:
        on_hand  = sum(quantity_delta) over movements with reason IN {RECEIVE, RETURN_TO_WAREHOUSE}
                   - sum(quantity)     over movements with reason = CONSUME
        reserved = sum(quantity) over RESERVE - sum(quantity) over RELEASE - sum(quantity) over CONSUME
      Guards: RESERVE/CONSUME/RETURN_TO_WAREHOUSE with quantity > available
      (on_hand - reserved for RESERVE; reserved for CONSUME; on_hand for RETURN)
      => ERR_STOCK_INSUFFICIENT.
      CONSERVED QUANTITY (compensating invariant): RESERVE followed by RELEASE of the
      same quantity leaves on_hand and reserved unchanged.
    input_set: "all StockMovements for the (van, part) pair"
    constants: {}
    precision: "integer units"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is one of PlatformAdmin, Dispatcher, Customer, Mechanic"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path resource ids exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Body is valid JSON; required fields present; enum values in declared sets; bike_type=EBIKE requires battery_wh non-null; battery_wh must be null for MECHANICAL; unknown fields rejected"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"

  - priority: 5
    category: state
    check: "OCC: expected_route_day_version == RouteDay.version; expected_service_request_version == ServiceRequest.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /v1/route-days/{route_day_id}/resequence; POST /v1/service-requests/{request_id}/reschedule"

  - priority: 6
    category: state
    check: "Target resource is in a valid from-state for the transition (work_status, invoice status, route-day status, stop status)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all event/action endpoints"

  - priority: 7
    category: state
    check: "RouteDay.status == OPEN when adding stops or resequencing"
    error_id: ERR_ROUTE_DAY_NOT_OPEN
    http_status: 409
    applies_to: "POST /v1/route-days/{route_day_id}/stops; POST /v1/route-days/{route_day_id}/resequence"

  - priority: 8
    category: state
    check: "Invoice generation requires ServiceRequest.work_status IN {COMPLETED, NO_SHOW}"
    error_id: ERR_JOB_NOT_COMPLETED
    http_status: 409
    applies_to: "POST /v1/service-requests/{request_id}/invoices"

  - priority: 9
    category: state
    check: "PAY and DISPUTE require Invoice.status == ISSUED; ISSUE requires DRAFT or DISPUTED; VOID requires DRAFT or DISPUTED"
    error_id: ERR_INVOICE_NOT_ISSUED
    http_status: 409
    applies_to: "POST /v1/invoices/{invoice_id}/events"

  - priority: 10
    category: state
    check: "At most one non-VOID invoice per service request"
    error_id: ERR_INVOICE_EXISTS
    http_status: 409
    applies_to: "POST /v1/service-requests/{request_id}/invoices"

  - priority: 11
    category: business_safety
    check: "E-bike battery safety: bike_type=EBIKE requires battery_certified == true AND battery_health_pct >= 70 to book service"
    error_id: ERR_BATTERY_SAFETY
    http_status: 422
    applies_to: "POST /v1/service-requests"

  - priority: 12
    category: business_temporal
    check: "Window shape: window_end - window_start >= 30 minutes and <= 4 hours; window_start >= current logical clock"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /v1/service-requests; POST /v1/service-requests/{request_id}/reschedule; POST /v1/service-requests/{request_id}/callbacks"

  - priority: 13
    category: business_temporal
    check: "Customer double-booking: closed-interval overlap per calculations.customer_window_overlap"
    error_id: ERR_CUSTOMER_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /v1/service-requests; POST /v1/service-requests/{request_id}/reschedule"

  - priority: 14
    category: business_temporal
    check: "Planned stop within request window AND no mechanic overlap per calculations.mechanic_stop_overlap"
    error_id: ERR_MECHANIC_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /v1/route-days/{route_day_id}/stops"

  - priority: 15
    category: business_temporal
    check: "Callback eligibility: original COMPLETED, logical clock <= completed_at + warranty_days (inclusive), no existing non-terminal callback (ERR_CALLBACK_EXISTS checked at same priority, listed second)"
    error_id: ERR_WARRANTY_EXPIRED
    http_status: 409
    applies_to: "POST /v1/service-requests/{request_id}/callbacks"

  - priority: 16
    category: business_temporal
    check: "An open (non-terminal) callback already exists for this original request"
    error_id: ERR_CALLBACK_EXISTS
    http_status: 409
    applies_to: "POST /v1/service-requests/{request_id}/callbacks"

  - priority: 17
    category: business_temporal
    check: "Subscription coverage period: window_start within [period_start, period_end] inclusive"
    error_id: ERR_SUBSCRIPTION_PERIOD
    http_status: 422
    applies_to: "POST /v1/service-requests"

  - priority: 18
    category: business_constraint
    check: "Dispatch constraints: Van.status == ACTIVE and mechanic assigned (ERR_VAN_UNAVAILABLE); Mechanic.status == ACTIVE (ERR_MECHANIC_SUSPENDED); EBIKE job requires Mechanic.ebike_certified (ERR_MECHANIC_NOT_EBIKE_CERTIFIED); RouteDay.active_stop_count < Van.max_stops_per_day (ERR_ROUTE_CAPACITY_EXCEEDED)"
    error_id: ERR_VAN_UNAVAILABLE
    http_status: 409
    applies_to: "POST /v1/route-days; POST /v1/route-days/{route_day_id}/stops; POST /v1/vans/{van_id}/events"
    note: "Single row summarizing four distinct constraint errors checked in this order: ERR_VAN_UNAVAILABLE, ERR_MECHANIC_SUSPENDED, ERR_MECHANIC_NOT_EBIKE_CERTIFIED, ERR_ROUTE_CAPACITY_EXCEEDED."

  - priority: 19
    category: business_constraint
    check: "Uniqueness: Part.sku (ERR_DUPLICATE_SKU); ServiceTier.code (ERR_DUPLICATE_TIER_CODE); Customer.email (ERR_EMAIL_EXISTS); (van_id, date) route day (ERR_ROUTE_DAY_EXISTS); at most one non-CANCELLED subscription per customer (ERR_SUBSCRIPTION_ACTIVE_EXISTS)"
    error_id: ERR_DUPLICATE_SKU
    http_status: 409
    applies_to: "POST /v1/parts; POST /v1/service-tiers; POST /v1/customers; POST /v1/route-days; POST /v1/subscriptions"
    note: "Each uniqueness rule maps to its own error id as listed."

  - priority: 20
    category: business_constraint
    check: "Subscription creation requires Customer.account_kind IN {FLEET, APARTMENT}"
    error_id: ERR_SUBSCRIPTION_REQUIRES_ORG_ACCOUNT
    http_status: 422
    applies_to: "POST /v1/subscriptions"

  - priority: 21
    category: business_referential
    check: "Ownership: Bike.customer_id == request customer_id (ERR_BIKE_NOT_OWNED); Subscription.customer_id == request customer_id (ERR_SUBSCRIPTION_NOT_OWNED); Customer role may only act on own resources (ERR_FORBIDDEN at priority 2 for endpoint-level, referential checks here)"
    error_id: ERR_BIKE_NOT_OWNED
    http_status: 403
    applies_to: "POST /v1/service-requests; POST /v1/bikes; POST /v1/invoices/{invoice_id}/events (PAY/DISPUTE by Customer)"
    note: "ERR_SUBSCRIPTION_NOT_OWNED (403) is the sibling error for subscription ownership."

  - priority: 22
    category: business_fiscal
    check: "Subscription usable: status IN {ACTIVE, PAST_DUE}"
    error_id: ERR_SUBSCRIPTION_INACTIVE
    http_status: 409
    applies_to: "POST /v1/service-requests"

  - priority: 23
    category: business_fiscal
    check: "Allowance: allowance_remaining >= 1 for a STANDARD request with subscription_id"
    error_id: ERR_ALLOWANCE_EXHAUSTED
    http_status: 422
    applies_to: "POST /v1/service-requests"

  - priority: 24
    category: business_fiscal
    check: "Truck stock: RESERVE quantity <= on_hand - reserved; CONSUME quantity <= reserved; RETURN_TO_WAREHOUSE quantity <= on_hand"
    error_id: ERR_STOCK_INSUFFICIENT
    http_status: 409
    applies_to: "POST /v1/service-requests/{request_id}/part-usages; POST /v1/vans/{van_id}/stock-movements"

  - priority: 25
    category: business_fiscal
    check: "PAY amount_cents must equal total_cents - credit_applied_cents (credit_applied = min(account_credit_cents, total_cents) when use_credit, else 0)"
    error_id: ERR_PAYMENT_MISMATCH
    http_status: 422
    applies_to: "POST /v1/invoices/{invoice_id}/events"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Zones ---
  - method: POST
    path: "/v1/zones"
    description: "Create a service zone"
    roles: [PlatformAdmin]
    code: 201
    input: [name, base_callout_fee_cents, "active?"]
    output: Zone
    side_effects: ["active defaults to true"]

  - method: GET
    path: "/v1/zones/{zone_id}"
    description: "Get a zone"
    roles: [PlatformAdmin, Dispatcher, Customer, Mechanic]
    code: 200
    input: []
    output: Zone
    side_effects: []

  # --- Customers ---
  - method: POST
    path: "/v1/customers"
    description: "Create a customer account"
    roles: [PlatformAdmin, Dispatcher]
    code: 201
    input: [name, email, account_kind, "phone?"]
    output: Customer
    side_effects: ["account_credit_cents initialized to 0"]

  - method: GET
    path: "/v1/customers/{customer_id}"
    description: "Get a customer"
    roles: [PlatformAdmin, Dispatcher, Customer, Mechanic]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: GET
    path: "/v1/customers/{id}/bikes"
    description: "List bikes owned by a customer (FK reverse reachability)"
    roles: [PlatformAdmin, Dispatcher, Customer, Mechanic]
    code: 200
    input: []
    output: Bike[]
    side_effects: []

  - method: POST
    path: "/v1/customers/{customer_id}/credit-adjustments"
    description: "Grant or revoke goodwill credit (signed amount_cents); balance must stay >= 0"
    roles: [PlatformAdmin]
    code: 201
    input: [amount_cents, reason]
    output: Customer
    side_effects: ["account_credit_cents += amount_cents; Customer.version + 1"]

  # --- Bikes ---
  - method: POST
    path: "/v1/bikes"
    description: "Register a bike; Customer role may only register for themselves"
    roles: [Customer, Dispatcher]
    code: 201
    input: [customer_id, bike_type, "brand?", "battery_wh?", "battery_certified?", "battery_health_pct?"]
    output: Bike
    side_effects: []

  - method: GET
    path: "/v1/bikes/{bike_id}"
    description: "Get a bike"
    roles: [PlatformAdmin, Dispatcher, Customer, Mechanic]
    code: 200
    input: []
    output: Bike
    side_effects: []

  # --- Mechanics ---
  - method: POST
    path: "/v1/mechanics"
    description: "Create a mechanic"
    roles: [PlatformAdmin]
    code: 201
    input: [name, ebike_certified, home_zone_id]
    output: Mechanic
    side_effects: ["status initialized to ACTIVE"]

  - method: GET
    path: "/v1/mechanics/{mechanic_id}"
    description: "Get a mechanic"
    roles: [PlatformAdmin, Dispatcher, Customer, Mechanic]
    code: 200
    input: []
    output: Mechanic
    side_effects: []

  - method: GET
    path: "/v1/mechanics"
    description: "List mechanics (FK reverse for home_zone_id)"
    roles: [PlatformAdmin, Dispatcher, Customer, Mechanic]
    code: 200
    input: ["home_zone_id?", "status?"]
    output: Mechanic[]
    side_effects: []

  - method: POST
    path: "/v1/mechanics/{mechanic_id}/events"
    description: "SUSPEND or REINSTATE a mechanic; SUSPEND triggers the unassign cascade"
    roles: [PlatformAdmin, Dispatcher]
    code: 200
    input: [event_type, "reason?"]
    output: Mechanic
    side_effects:
      - "SUSPEND: PLANNED stops on this mechanic's vans -> UNASSIGNED; their requests DISPATCHED -> QUOTED; affected RouteDays recompute active_stop_count (auto-unlock if LOCKED and empty)"
      - "REINSTATE: status -> ACTIVE (no auto-restore of stops)"

  # --- Vans ---
  - method: POST
    path: "/v1/vans"
    description: "Create a van"
    roles: [PlatformAdmin]
    code: 201
    input: [plate, zone_id, "mechanic_id?", max_stops_per_day]
    output: Van
    side_effects: ["status initialized to ACTIVE"]

  - method: GET
    path: "/v1/vans/{van_id}"
    description: "Get a van"
    roles: [PlatformAdmin, Dispatcher, Customer, Mechanic]
    code: 200
    input: []
    output: Van
    side_effects: []

  - method: GET
    path: "/v1/vans"
    description: "List vans (FK reverse for zone_id and mechanic_id)"
    roles: [PlatformAdmin, Dispatcher, Customer, Mechanic]
    code: 200
    input: ["zone_id?", "mechanic_id?", "status?"]
    output: Van[]
    side_effects: []

  - method: POST
    path: "/v1/vans/{van_id}/events"
    description: "ASSIGN_MECHANIC (requires mechanic ACTIVE) | TAKE_OUT_OF_SERVICE | RETURN_TO_SERVICE"
    roles: [PlatformAdmin, Dispatcher]
    code: 200
    input: [event_type, "mechanic_id?"]
    output: Van
    side_effects: ["ASSIGN_MECHANIC sets mechanic_id; TAKE_OUT_OF_SERVICE blocks new route days and stop additions"]

  # --- Parts & truck stock ---
  - method: POST
    path: "/v1/parts"
    description: "Create a catalog part"
    roles: [PlatformAdmin]
    code: 201
    input: [sku, name, unit_price_cents, warranty_days, "ebike_only?"]
    output: Part
    side_effects: []

  - method: GET
    path: "/v1/parts/{part_id}"
    description: "Get a part"
    roles: [PlatformAdmin, Dispatcher, Customer, Mechanic]
    code: 200
    input: []
    output: Part
    side_effects: []

  - method: GET
    path: "/v1/parts/{id}/stock"
    description: "List TruckStockItems holding this part across vans (FK reverse)"
    roles: [PlatformAdmin, Dispatcher, Customer, Mechanic]
    code: 200
    input: []
    output: TruckStockItem[]
    side_effects: []

  - method: POST
    path: "/v1/vans/{van_id}/stock-movements"
    description: "Receive stock onto a van (RECEIVE) or return it (RETURN_TO_WAREHOUSE)"
    roles: [Dispatcher, Mechanic]
    code: 201
    input: [part_id, quantity, reason, "note?"]
    output: StockMovement
    side_effects:
      - "RECEIVE: TruckStockItem.on_hand += quantity (row created if absent)"
      - "RETURN_TO_WAREHOUSE: requires on_hand >= quantity; on_hand -= quantity"
      - "StockMovement row appended with signed quantity_delta"

  - method: GET
    path: "/v1/stock-movements/{movement_id}"
    description: "Get a stock movement"
    roles: [PlatformAdmin, Dispatcher, Customer, Mechanic]
    code: 200
    input: []
    output: StockMovement
    side_effects: []

  - method: GET
    path: "/v1/stock-movements"
    description: "List stock movements (FK reverse for van_id, part_id, service_request_id)"
    roles: [PlatformAdmin, Dispatcher, Customer, Mechanic]
    code: 200
    input: ["van_id?", "part_id?", "service_request_id?", "reason?"]
    output: StockMovement[]
    side_effects: []

  - method: GET
    path: "/v1/vans/{id}/stock"
    description: "List TruckStockItems on a van (FK reverse)"
    roles: [PlatformAdmin, Dispatcher, Customer, Mechanic]
    code: 200
    input: []
    output: TruckStockItem[]
    side_effects: []

  # --- Service tiers ---
  - method: POST
    path: "/v1/service-tiers"
    description: "Create a tune tier"
    roles: [PlatformAdmin]
    code: 201
    input: [code, base_price_cents, included_minutes, overage_rate_cents_per_min, labor_warranty_days]
    output: ServiceTier
    side_effects: []

  - method: GET
    path: "/v1/service-tiers/{tier_id}"
    description: "Get a service tier"
    roles: [PlatformAdmin, Dispatcher, Customer, Mechanic]
    code: 200
    input: []
    output: ServiceTier
    side_effects: []

  # --- Subscriptions ---
  - method: POST
    path: "/v1/subscriptions"
    description: "Create a fleet/apartment subscription (at most one non-CANCELLED per customer)"
    roles: [PlatformAdmin, Dispatcher]
    code: 201
    input: [customer_id, included_tunes_per_period, discount_pct, period_start, period_end]
    output: Subscription
    side_effects: ["status ACTIVE; allowance_reserved/consumed = 0"]

  - method: GET
    path: "/v1/subscriptions/{subscription_id}"
    description: "Get a subscription"
    roles: [PlatformAdmin, Dispatcher, Customer, Mechanic]
    code: 200
    input: []
    output: Subscription
    side_effects: []

  - method: GET
    path: "/v1/subscriptions"
    description: "List subscriptions (FK reverse for customer_id)"
    roles: [PlatformAdmin, Dispatcher, Customer, Mechanic]
    code: 200
    input: ["customer_id?", "status?"]
    output: Subscription[]
    side_effects: []

  - method: POST
    path: "/v1/subscriptions/{subscription_id}/events"
    description: "MARK_PAST_DUE | RECOVER | SUSPEND | REINSTATE | CANCEL; SUSPEND/CANCEL trigger the decoupling cascade"
    roles: [PlatformAdmin, Dispatcher]
    code: 200
    input: [event_type]
    output: Subscription
    side_effects:
      - "SUSPEND/CANCEL: open covered requests lose coverage, allowance reservations released, quoted_total_cents recomputed without discount"

  # --- Service requests ---
  - method: POST
    path: "/v1/service-requests"
    description: "Create a STANDARD service request; computes provisional quote; reserves subscription allowance when subscription_id given"
    roles: [Customer, Dispatcher]
    code: 201
    input: [customer_id, bike_id, zone_id, tier_id, "subscription_id?", window_start, window_end, "issue_note?"]
    output: ServiceRequest
    side_effects:
      - "work_status=QUOTED, billing_status=ESTIMATED"
      - "quoted_total_cents computed per calculations.provisional_quote"
      - "if subscription_id: covered_by_subscription=true, allowance_reserved += 1"

  - method: GET
    path: "/v1/service-requests/{request_id}"
    description: "Get a service request"
    roles: [PlatformAdmin, Dispatcher, Customer, Mechanic]
    code: 200
    input: []
    output: ServiceRequest
    side_effects: []

  - method: GET
    path: "/v1/service-requests"
    description: "List service requests (FK reverse for customer_id, bike_id, zone_id, tier_id, subscription_id, scheduled_mechanic_id, callback_of_id)"
    roles: [PlatformAdmin, Dispatcher, Customer, Mechanic]
    code: 200
    input: ["customer_id?", "bike_id?", "zone_id?", "tier_id?", "subscription_id?", "scheduled_mechanic_id?", "callback_of_id?", "work_status?"]
    output: ServiceRequest[]
    side_effects: []

  - method: POST
    path: "/v1/service-requests/{request_id}/events"
    description: "CANCEL | START_SERVICE | HOLD_PARTS | RESUME | COMPLETE | MARK_NO_SHOW"
    roles: [Customer, Mechanic, Dispatcher]
    code: 200
    input: [event_type, "labor_minutes?", "cancel_reason?"]
    output: ServiceRequest
    side_effects:
      - "per ServiceRequest work_status transitions; CANCEL from DISPATCHED/ON_SITE and MARK_NO_SHOW auto-create DRAFT fee invoices"
      - "COMPLETE settles subscription allowance and releases unconsumed reserved stock"

  - method: POST
    path: "/v1/service-requests/{request_id}/reschedule"
    description: "Move the requested window (QUOTED only); OCC-guarded"
    roles: [Customer, Dispatcher]
    code: 200
    input: [window_start, window_end, expected_service_request_version]
    output: ServiceRequest
    side_effects: ["increments ServiceRequest.version by 1; re-validates window shape and customer overlap"]

  - method: POST
    path: "/v1/service-requests/{request_id}/callbacks"
    description: "Create a warranty CALLBACK request linked to a COMPLETED original"
    roles: [Customer, Dispatcher]
    code: 201
    input: [window_start, window_end, "issue_note?"]
    output: ServiceRequest
    side_effects:
      - "new request: request_kind=CALLBACK, callback_of_id=original id, same customer/bike/zone/tier"
      - "callback never consumes allowance and is never subscription-covered; callout and labor base are 0"

  - method: POST
    path: "/v1/service-requests/{request_id}/part-usages"
    description: "RESERVE | RELEASE | CONSUME truck stock for a request (van derived from its route stop)"
    roles: [Mechanic, Dispatcher]
    code: 200
    input: [part_id, quantity, action]
    output: TruckStockItem
    side_effects:
      - "RESERVE (from DISPATCHED/ON_SITE/IN_SERVICE/ON_HOLD_PARTS): reserved += quantity; StockMovement RESERVE appended"
      - "RELEASE: reserved -= quantity; StockMovement RELEASE appended"
      - "CONSUME (from IN_SERVICE/ON_HOLD_PARTS): reserved -= quantity, on_hand -= quantity; StockMovement CONSUME appended"

  # --- Route days & stops ---
  - method: POST
    path: "/v1/route-days"
    description: "Create a route day for a van (unique per van+date); requires van ACTIVE"
    roles: [Dispatcher]
    code: 201
    input: [van_id, date]
    output: RouteDay
    side_effects: ["status OPEN, active_stop_count 0"]

  - method: GET
    path: "/v1/route-days/{route_day_id}"
    description: "Get a route day"
    roles: [PlatformAdmin, Dispatcher, Customer, Mechanic]
    code: 200
    input: []
    output: RouteDay
    side_effects: []

  - method: GET
    path: "/v1/route-days"
    description: "List route days (FK reverse for van_id)"
    roles: [PlatformAdmin, Dispatcher, Customer, Mechanic]
    code: 200
    input: ["van_id?", "date?", "status?"]
    output: RouteDay[]
    side_effects: []

  - method: POST
    path: "/v1/route-days/{route_day_id}/events"
    description: "LOCK | UNLOCK | START | CLOSE"
    roles: [Dispatcher]
    code: 200
    input: [event_type]
    output: RouteDay
    side_effects: ["START requires >= 1 active stop; CLOSE requires all stops terminal"]

  - method: POST
    path: "/v1/route-days/{route_day_id}/stops"
    description: "Dispatch a QUOTED request onto an OPEN route day (assigns the van's mechanic)"
    roles: [Dispatcher]
    code: 201
    input: [service_request_id, planned_start, planned_end, "travel_buffer_minutes?"]
    output: RouteStop
    side_effects:
      - "RouteStop created PLANNED with seq = active_stop_count + 1"
      - "ServiceRequest: QUOTED -> DISPATCHED, scheduled_mechanic_id := van.mechanic_id"
      - "RouteDay.active_stop_count recomputed; RouteDay.version + 1"

  - method: GET
    path: "/v1/route-days/{id}/stops"
    description: "List stops of a route day ordered by seq (FK reverse)"
    roles: [PlatformAdmin, Dispatcher, Customer, Mechanic]
    code: 200
    input: []
    output: RouteStop[]
    side_effects: []

  - method: POST
    path: "/v1/route-days/{route_day_id}/resequence"
    description: "Rewrite visit order; stop_ids must be exactly the set of the day's PLANNED/ARRIVED stops; OCC-guarded"
    roles: [Dispatcher]
    code: 200
    input: [stop_ids, expected_route_day_version]
    output: RouteDay
    side_effects: ["RouteStop.seq rewritten in given order; increments RouteDay.version by 1"]

  - method: GET
    path: "/v1/route-stops/{stop_id}"
    description: "Get a route stop"
    roles: [PlatformAdmin, Dispatcher, Customer, Mechanic]
    code: 200
    input: []
    output: RouteStop
    side_effects: []

  - method: GET
    path: "/v1/route-stops"
    description: "List route stops (FK reverse for service_request_id)"
    roles: [PlatformAdmin, Dispatcher, Customer, Mechanic]
    code: 200
    input: ["service_request_id?", "status?"]
    output: RouteStop[]
    side_effects: []

  - method: POST
    path: "/v1/route-stops/{stop_id}/events"
    description: "ARRIVE | DONE | SKIP (drives the linked request's ON_SITE/QUOTED transitions)"
    roles: [Mechanic, Dispatcher]
    code: 200
    input: [event_type]
    output: RouteStop
    side_effects:
      - "ARRIVE: request -> ON_SITE; DONE requires request COMPLETED; SKIP reverts request to QUOTED"

  # --- Invoices ---
  - method: POST
    path: "/v1/service-requests/{request_id}/invoices"
    description: "Generate the final invoice from actuals (COMPLETED or NO_SHOW); at most one non-VOID invoice per request"
    roles: [Dispatcher, PlatformAdmin]
    code: 201
    input: []
    output: Invoice
    side_effects: ["Invoice DRAFT created per calculations.final_invoice"]

  - method: GET
    path: "/v1/service-requests/{id}/invoices"
    description: "List invoices for a request (FK reverse; 0..n given VOID re-billing)"
    roles: [PlatformAdmin, Dispatcher, Customer, Mechanic]
    code: 200
    input: []
    output: Invoice[]
    side_effects: []

  - method: GET
    path: "/v1/invoices/{invoice_id}"
    description: "Get an invoice"
    roles: [PlatformAdmin, Dispatcher, Customer, Mechanic]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: POST
    path: "/v1/invoices/{invoice_id}/events"
    description: "ISSUE | PAY | DISPUTE | VOID"
    roles: [Customer, Dispatcher, PlatformAdmin]
    code: 200
    input: [event_type, "amount_cents?", "use_credit?", "dispute_reason?"]
    output: Invoice
    side_effects:
      - "ISSUE: request billing -> INVOICED; DISPUTE: -> DISPUTED; VOID from DISPUTED: -> ESTIMATED"
      - "PAY: applies optional account credit, requires exact amount_cents, request billing -> PAID, COMPLETED work -> CLOSED"

  # --- Test-driving clock ---
  - method: POST
    path: "/v1/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default (before any call) is exactly 2026-05-01T00:00:00Z; the clock never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced/set; used by window validation, completed_at, and warranty_window"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on endpoint, or entity-backed caller acting on another party's resource at endpoint level" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource id does not exist (checked left-to-right)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body, missing required field, bad enum value, unknown field, or EBIKE battery field violation (battery_wh required; MECHANICAL must not carry battery_wh)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid from-state for the requested transition (generic state error)" }
  - { id: ERR_ROUTE_DAY_NOT_OPEN, http: 409, condition: "Stop addition or resequence attempted on a RouteDay not in OPEN" }
  - { id: ERR_JOB_NOT_COMPLETED, http: 409, condition: "Invoice generation attempted while request is not COMPLETED or NO_SHOW" }
  - { id: ERR_INVOICE_NOT_ISSUED, http: 409, condition: "PAY/DISPUTE attempted on an invoice not in ISSUED (or ISSUE/VOID from an invalid state)" }
  - { id: ERR_INVOICE_EXISTS, http: 409, condition: "A non-VOID invoice already exists for this service request" }
  - { id: ERR_BATTERY_SAFETY, http: 422, condition: "E-bike with battery_certified=false or battery_health_pct < 70 cannot be booked for mobile service" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "Window shorter than 30 minutes, longer than 4 hours, starts in the past (logical clock), or planned stop outside the request window" }
  - { id: ERR_CUSTOMER_WINDOW_OVERLAP, http: 409, condition: "Closed-interval overlap with another non-terminal request of the same customer (touching endpoints conflict)" }
  - { id: ERR_MECHANIC_WINDOW_OVERLAP, http: 409, condition: "Buffered half-open overlap with another PLANNED/ARRIVED stop of the same mechanic" }
  - { id: ERR_WARRANTY_EXPIRED, http: 409, condition: "Callback attempted after completed_at + warranty_days (exclusive past the inclusive deadline)" }
  - { id: ERR_CALLBACK_EXISTS, http: 409, condition: "An open (non-terminal) callback already exists for this original request" }
  - { id: ERR_SUBSCRIPTION_PERIOD, http: 422, condition: "Requested window_start outside the subscription coverage period [period_start, period_end]" }
  - { id: ERR_VAN_UNAVAILABLE, http: 409, condition: "Van OUT_OF_SERVICE or has no mechanic assigned when one is required" }
  - { id: ERR_MECHANIC_SUSPENDED, http: 409, condition: "Assigned mechanic is SUSPENDED (dispatch or ASSIGN_MECHANIC)" }
  - { id: ERR_MECHANIC_NOT_EBIKE_CERTIFIED, http: 409, condition: "E-bike job dispatched to a mechanic without ebike_certified" }
  - { id: ERR_ROUTE_CAPACITY_EXCEEDED, http: 409, condition: "RouteDay.active_stop_count == Van.max_stops_per_day when adding a stop" }
  - { id: ERR_ROUTE_DAY_EXISTS, http: 409, condition: "A route day already exists for this van and date" }
  - { id: ERR_DUPLICATE_SKU, http: 409, condition: "Part sku already exists" }
  - { id: ERR_DUPLICATE_TIER_CODE, http: 409, condition: "ServiceTier code already exists" }
  - { id: ERR_EMAIL_EXISTS, http: 409, condition: "Customer email already exists" }
  - { id: ERR_SUBSCRIPTION_ACTIVE_EXISTS, http: 409, condition: "Customer already has a non-CANCELLED subscription" }
  - { id: ERR_SUBSCRIPTION_REQUIRES_ORG_ACCOUNT, http: 422, condition: "Subscription attempted for an INDIVIDUAL customer" }
  - { id: ERR_BIKE_NOT_OWNED, http: 403, condition: "Bike belongs to a different customer than the request's customer_id" }
  - { id: ERR_SUBSCRIPTION_NOT_OWNED, http: 403, condition: "Subscription belongs to a different customer than the request's customer_id" }
  - { id: ERR_SUBSCRIPTION_INACTIVE, http: 409, condition: "Subscription not in ACTIVE or PAST_DUE when booking with coverage" }
  - { id: ERR_ALLOWANCE_EXHAUSTED, http: 422, condition: "allowance_remaining < 1 for a covered STANDARD request" }
  - { id: ERR_STOCK_INSUFFICIENT, http: 409, condition: "RESERVE exceeds on_hand - reserved; CONSUME exceeds reserved; RETURN_TO_WAREHOUSE exceeds on_hand" }
  - { id: ERR_PAYMENT_MISMATCH, http: 422, condition: "PAY amount_cents != total_cents - credit_applied_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator administering catalog data (zones, parts, tiers), mechanics, vans, credit, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /v1/zones"
      - "POST /v1/mechanics"
      - "POST /v1/vans"
      - "POST /v1/parts"
      - "POST /v1/service-tiers"
      - "POST /v1/customers/{customer_id}/credit-adjustments"
      - "POST /v1/_clock/set_current_utc"
    shared_operations:
      - "POST /v1/customers; POST /v1/subscriptions; subscription/mechanic/van events"
      - "POST /v1/service-requests/{request_id}/invoices; invoice ISSUE/VOID"
      - "all GET endpoints"

  - name: Dispatcher
    description: "Operations dispatcher building route days, dispatching stops, managing subscriptions and invoices"
    identity: opaque
    exclusive_operations:
      - "POST /v1/route-days and /events, /stops, /resequence"
      - "POST /v1/service-requests/{request_id}/invoices (shared with PlatformAdmin)"
    shared_operations:
      - "POST /v1/customers, /v1/bikes, /v1/service-requests (on behalf of customers)"
      - "POST /v1/service-requests/{request_id}/events (CANCEL), /reschedule, /callbacks, /part-usages"
      - "POST /v1/vans/{van_id}/stock-movements; mechanic/van/subscription events"
      - "all GET endpoints"

  - name: Customer
    description: "End customer (individual, fleet, or apartment account) requesting service and paying invoices"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /v1/invoices/{invoice_id}/events (PAY, DISPUTE) on own invoices"
    shared_operations:
      - "POST /v1/bikes (own customer_id only)"
      - "POST /v1/service-requests (own), /events (CANCEL own), /reschedule (own), /callbacks (own)"
      - "all GET endpoints"

  - name: Mechanic
    description: "Van mechanic executing route stops and service work"
    identity: "entity_backed:Mechanic"
    exclusive_operations:
      - "POST /v1/route-stops/{stop_id}/events (ARRIVE, DONE) — assigned mechanic only"
      - "POST /v1/service-requests/{request_id}/events (START_SERVICE, HOLD_PARTS, RESUME, COMPLETE, MARK_NO_SHOW) — assigned mechanic only"
    shared_operations:
      - "POST /v1/service-requests/{request_id}/part-usages; POST /v1/vans/{van_id}/stock-movements"
      - "all GET endpoints"
