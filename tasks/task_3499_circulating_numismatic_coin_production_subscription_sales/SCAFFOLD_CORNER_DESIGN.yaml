        claim_type: side_effect_execution
        grounds: ["state_machines.NumismaticProduct.ON_SALE_to_WITHDRAWN", "state_machines.NumismaticOrder"]
        distinguishing_aspect: "Conditional cascade on withdraw: the PAID+ALLOCATED order becomes RELEASED and REFUNDED (status CANCELLED); the WAITLISTED order becomes RELEASED without any refund (still UNPAID) and is NOT promoted (product is terminal)."
        test_recipe:
          setup: ["product WDR-2 (mintage 3) ON_SALE; o1 qty 3 PAID (product SOLD_OUT); o2 qty 1 WAITLISTED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
