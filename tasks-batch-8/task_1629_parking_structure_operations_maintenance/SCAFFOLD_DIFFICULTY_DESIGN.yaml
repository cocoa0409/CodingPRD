- rule_id: transitive_cascade
  instances:
  - name: critical_inspection_cascades_to_credential_revocation
    grounds:
    - state_machines.StructuralInspection.IN_FIELD_to_REPORTED
    - state_machines.MonthlyAgreement.APPROVED_to_WAITLISTED
    - state_machines.Credential.ACTIVE_to_REVOKED
    distinguishing_aspect: 'Depth-3 chain: CRITICAL report mutates Facility (posture RESTRICTED,

      closed_spaces 2); that mutation demotes the newest APPROVED agreement to

      WAITLISTED; that demotion revokes its ACTIVE credential and refunds the

      5000 deposit. Each hop is caused by the previous hop, not the report.

      '
    test_recipe:
      setup:
      - Facility total_spaces 4, monthly_capacity 3; three APPROVED agreements a1,a2,a3 (application_seq 1,2,3)
      - Credential c3 ACTIVE on a3 with deposit 5000 (deposit_liability 5000)
      - One IN_FIELD inspection on level L1
      setup_api_calls:
      - call: POST /ops/facilities
        payload:
          name: Cascade Fac
          total_spaces: 4
          monthly_capacity: 3
          event_pool_spaces: 0
        as: FacilityManager
        captures:
          fac: $.data.id
      - call: POST /ops/parker-accounts
        payload:
          full_name: P One
          email: p1@x.com
        as: ParkingAttendant
        as_user_id: att-1
        captures:
          p1: $.data.id
      - call: POST /ops/monthly-agreements
        payload:
          facility_id: ${fac}
          parker_account_id: ${p1}
          tier: STANDARD
          monthly_rate_cents: 10000
        as: ParkingAttendant
        as_user_id: att-1
        captures:
          a1: $.data.id
      - call: POST /ops/parker-accounts
        payload:
          full_name: P Two
          email: p2@x.com
        as: ParkingAttendant
        as_user_id: att-1
        captures:
          p2: $.data.id
      - call: POST /ops/monthly-agreements
        payload:
          facility_id: ${fac}
          parker_account_id: ${p2}
          tier: STANDARD
          monthly_rate_cents: 10000
        as: ParkingAttendant
        as_user_id: att-1
        captures:
          a2: $.data.id
      - call: POST /ops/parker-accounts
        payload:
          full_name: P Three
          email: p3@x.com
        as: ParkingAttendant
        as_user_id: att-1
        captures:
          p3: $.data.id
      - call: POST /ops/monthly-agreements
        payload:
          facility_id: ${fac}
          parker_account_id: ${p3}
          tier: STANDARD
          monthly_rate_cents: 10000
        as: ParkingAttendant
        as_user_id: att-1
        captures:
          a3: $.data.id
      - call: POST /ops/credentials
        payload:
          agreement_id: ${a3}
          credential_type: TRANSPONDER
          deposit_cents: 5000
        as: ParkingAttendant
        as_user_id: att-1
        captures:
          c3: $.data.id
      - call: POST /ops/inspections
        payload:
          facility_id: ${fac}
          level_scope: L1
          scheduled_for: '2026-08-02T09:00:00Z'
        as: MaintenanceSupervisor
        captures:
          insp: $.data.id
      - call: POST /ops/inspections/${insp}/start
        as: MaintenanceSupervisor
      trigger:
      - call: POST /ops/inspections/${insp}/report
        payload:
          load_bearing_rating: 2
          waterproofing_rating: 5
          surface_rating: 5
          closed_space_count: 2
        as: MaintenanceSupervisor
        captures:
          cls: $.data.condition_class
          idx: $.data.condition_index
      - call: GET /ops/facilities/${fac}
        as: FacilityManager
        captures:
          post: $.data.posture
          closed: $.data.closed_spaces
          liab: $.data.deposit_liability_cents
      - call: GET /ops/monthly-agreements/${a3}
        as: FacilityManager
        captures:
          a3st: $.data.agreement_status
      - call: GET /ops/credentials/${c3}
        as: FacilityManager
        captures:
          c3st: $.data.credential_status
      assert:
      - StructuralInspection.${insp}.condition_index == 70 and condition_class == CRITICAL (load-bearing 2 override fires even though index 70 is not < 40)
      - Facility.${fac}.posture == RESTRICTED and closed_spaces == 2 (cascade link 1)
      - 'MonthlyAgreement.${a3}.agreement_status == WAITLISTED (link 2: committed 3 > effective capacity min(3, 4-2) = 2; newest by application_seq demoted)'
      - MonthlyAgreement.${a1} and .${a2} remain APPROVED
      - Credential.${c3}.credential_status == REVOKED (link 3) and Facility.deposit_liability_cents == 0
  - name: event_activation_cascades_posture_to_device_mode
    grounds:
    - state_machines.EventBooking.CONFIRMED_to_ACTIVE
    - state_machines.Facility.NORMAL_to_EVENT_SURGE
    - entities.AccessDevice.fields.device_mode
    distinguishing_aspect: 'Depth-2 chain from a different trigger: event activate mutates Facility

      posture to EVENT_SURGE; that posture mutation flips every ONLINE device to

      EVENT mode; a subsequent entry pins fee_mode EVENT_FLAT (1500 flat for a

      would-be 800 stay), proving the cascade reached the tariff layer.

      '
