            - "app_status == ISSUED and perm_number == WP-0001"
            - "rep1_due == 2027-10-02T00:00:00Z (issue 2026-10-02 + 365 days) and only report 1 is past due at the trigger clock"
            - "rep1_status == OVERDUE (link 1: the clock move mutated the report)"
            - "perm_status == SUSPENDED (link 2: 2027-12-02 is strictly past due_date + 60 days = 2027-12-01)"
            - "case_src == MONITORING_BREACH, case_status == OPENED, case_fill == 0 (link 3: the suspension itself opened the referral case)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_bank_txn
        grounds:
          - validations[priority=7]
          - validations[priority=27]
          - errors[ERR_BANK_NOT_OPERATIONAL]
          - errors[ERR_INSUFFICIENT_CREDIT_INVENTORY]
        distinguishing_aspect: |
          Category pair (state, business_fiscal): the reservation both targets a
          SUSPENDED bank (state failure, priority 7) and requests 999 credits against 20
          available (fiscal failure, priority 27). The state error must win.
        test_recipe:
          setup:
            - "Plan APPROVED (BANK_CREDITS); bank with capacity FORESTED_WETLAND 20 approved then SUSPENDED"
          setup_api_calls:
            - { call: "POST /wetland-permits/applicants", payload: { legal_name: "Acme Dredging LLC", organization_type: "CORPORATION", contact_email: "permits@acme.example" }, as: SystemAdmin, captures: { ap_id: "$.data.id" } }
