            - call: "POST /residence-life/ra-applications/${app_id}/review"
              payload: { interview_score: 71 }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/ra-applications/${app_id}/decision"
              payload: { decision: "REQUEST_REVISION", revision_notes: "expand the crisis scenario" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/ra-applications/${app_id}/submit"
              payload: { essay_ref: "E-CY-1" }
              as: Student
              as_user_id: "${s_cy_id}"
            - call: "POST /residence-life/ra-applications/${app_id}/review"
              payload: { interview_score: 76 }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/ra-applications/${app_id}/decision"
              payload: { decision: "REQUEST_REVISION", revision_notes: "still thin on conflict handling" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/ra-applications/${app_id}/submit"
              payload: { essay_ref: "E-CY-2" }
              as: Student
              as_user_id: "${s_cy_id}"
            - call: "POST /residence-life/ra-applications/${app_id}/review"
              payload: { interview_score: 80 }
              as: ResidenceDirector
              as_user_id: "rd-1"
          trigger:
            - call: "POST /residence-life/ra-applications/${app_id}/decision"
              payload: { decision: "REQUEST_REVISION", revision_notes: "third pass" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "The trigger returns HTTP 409 with data.error_id == ERR_REVISION_LIMIT_REACHED"
            - "RAApplication.${app_id}.revision_count == 2"
            - "RAApplication.${app_id}.status == UNDER_REVIEW"
            - "RAApplication.${app_id}.interview_score == 80"
            - "RAApplication.${app_id}.revision_notes == 'still thin on conflict handling'"

  - rule_id: transitive_cascade
    instances:

      - name: emergency_closure_room_offline_then_break_revoked_then_relocation_case_then_student_pending
        grounds:
          - state_machines.Building.OPEN_to_EMERGENCY_CLOSED
          - state_machines.Room.OCCUPIED_to_OFFLINE
          - state_machines.BreakHousingRequest.APPROVED_to_REVOKED
          - state_machines.RoomChangeCase.NONE_to_REQUESTED
          - entities.Student.fields.housing_status
          - entities.Room.fields.pre_closure_status
        distinguishing_aspect: |
          A depth-4 chain whose trigger is the Building posture transition: the hall closing
          drives Room 201 OFFLINE, the room going OFFLINE (not the closure itself) drives the
          approved BreakHousingRequest to REVOKED, that revocation (not the room change)
          creates a RoomChangeCase with origin EMERGENCY_RELOCATION, and that case creation
          sets the Student to RELOCATION_PENDING.
        test_recipe:
          setup:
            - "Kerr Hall has break_housing_enabled true and posture OPEN."
            - "Floor 2 holds room 201 (bed_capacity 2)."
            - "Bo Lin occupies room 201, so the room is OCCUPIED with occupied_beds 1."
            - "Bo Lin holds an APPROVED WINTER break stay in room 201 for 2026-12-18 through 2026-12-24."
            - "The logical clock is at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /residence-life/buildings"
              payload: { name: "Kerr Hall", code: "KERR", campus_zone: "NORTH", break_housing_enabled: true }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { b_id: $.data.id }
            - call: "POST /residence-life/floors"
              payload: { building_id: "${b_id}", floor_number: 2 }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { f_id: $.data.id }
            - call: "POST /residence-life/rooms"
              payload: { floor_id: "${f_id}", room_number: "201", bed_capacity: 2, last_renovation_year: 2021 }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { r201_id: $.data.id }
            - call: "POST /residence-life/students"
              payload: { full_name: "Bo Lin", email: "bo@u.edu", class_year: "SOPHOMORE" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { s_bo_id: $.data.id }
            - call: "POST /residence-life/students/${s_bo_id}/room-assignment"
              payload: { action: "PLACE", room_id: "${r201_id}" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/break-housing-requests"
              payload: { student_id: "${s_bo_id}", room_id: "${r201_id}", break_code: "WINTER", start_date: "2026-12-18", end_date: "2026-12-24", reason: "research assistantship" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { bh_id: $.data.id }
            - call: "POST /residence-life/break-housing-requests/${bh_id}/decision"
              payload: { decision: "APPROVE" }
              as: ResidenceDirector
              as_user_id: "rd-1"
          trigger:
            - call: "POST /residence-life/buildings/${b_id}/posture"
              payload: { target_posture: "EMERGENCY_CLOSED", reason: "burst riser on floor 2" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "GET /residence-life/room-change-cases"
              payload: { student_id: "${s_bo_id}" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { rcc_id: "$.data[0].id" }
          assert:
            - "Building.${b_id}.posture == EMERGENCY_CLOSED"
            - "Room.${r201_id}.status == OFFLINE"
            - "Room.${r201_id}.pre_closure_status == OCCUPIED"
            - "BreakHousingRequest.${bh_id}.status == REVOKED"
            - "BreakHousingRequest.${bh_id}.revocation_cause == EMERGENCY_CLOSURE"
            - "GET /residence-life/room-change-cases?student_id=${s_bo_id} returns total_count == 1"
            - "RoomChangeCase.${rcc_id}.origin == EMERGENCY_RELOCATION"
            - "RoomChangeCase.${rcc_id}.placement_status == REQUESTED"
            - "RoomChangeCase.${rcc_id}.mediation_status == NOT_REQUIRED"
            - "RoomChangeCase.${rcc_id}.from_room_id == ${r201_id}"
            - "RoomChangeCase.${rcc_id}.opened_by_user_id == system"
            - "Student.${s_bo_id}.housing_status == RELOCATION_PENDING"
            - "Floor.${f_id}.programming_frozen == true"

      - name: conduct_sanction_probation_then_placement_denied_then_break_revoked
        grounds:
          - state_machines.ConductCase.HEARING_SCHEDULED_to_SANCTIONED
          - calculations.conduct_sanction_points
          - entities.Student.fields.conduct_points
          - entities.Student.fields.conduct_standing
          - entities.Student.fields.break_housing_eligible
          - state_machines.RoomChangeCase.REQUESTED_to_DENIED
          - state_machines.BreakHousingRequest.APPROVED_to_REVOKED
          - state_machines.IncidentReport.ROUTED_TO_CONDUCT_to_CLOSED_ADJUDICATED
        distinguishing_aspect: |
          A depth-4 chain from a different trigger - the ConductCase decision, not a posture
          change: the second SANCTION adds 14 points taking Cy Park to 19, crossing 19 >= 12
          flips conduct_standing to PROBATION, PROBATION (not the sanction) denies the
          student's REQUESTED room-change case and clears break_housing_eligible, and losing
