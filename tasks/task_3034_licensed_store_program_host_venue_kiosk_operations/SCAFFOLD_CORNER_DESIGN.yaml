            - { call: "POST /licensing/license-agreements/${agr_id}/stores", payload: { store_code: "ST1", equipment_footprint_units: 40 }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { store_id: $.data.id } }
            - { call: "POST /licensing/product-items", payload: { sku: "SKU-F15", name: "F15", category: "BEVERAGE_CORE", proprietary: false, venue_type_restrictions: [], unit_cost_cents: 500, case_pack_units: 1, footprint_units: 15 }, as: BrandProgramAdmin, captures: { p15: $.data.id } }
