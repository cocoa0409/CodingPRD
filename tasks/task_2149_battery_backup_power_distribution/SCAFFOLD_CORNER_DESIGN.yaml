      - name: filed_manifest_is_terminal_and_rejects_further_transitions
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.DisposalManifest.SUBMITTED_to_FILED
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "FILED is terminal for DisposalManifest, so a reject issued after filing returns ERR_INVALID_STATE (409) and the attached lot keeps its scrap_manifest_id."
        test_recipe:
          setup:
            - "One TX warehouse, model IB-31-FLD and one SHELF_EXPIRED 4-unit lot manufactured 2024-01-01."
            - "One manifest created by comp-1 carrying that lot, submitted, then filed by comp-2."
          setup_api_calls:
            - call: "POST /distribution/warehouses"
              payload: { code: "TX-DAL", state_code: "TX", hazmat_endorsement: true, storm_reserve_pct: 0.0, dock_capacity_kg_per_window: 100000.0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { wh_tx: $.data.id }
            - call: "POST /distribution/battery-models"
              payload: { sku: "IB-31-FLD", chemistry: "FLOODED_LEAD_ACID", nominal_voltage: 12, amp_hour_capacity: 100, peukert_exponent: 1.25, unit_weight_kg: 26.0, lead_content_kg: 12.5, core_deposit_cents: 2200, list_price_cents: 18500, warranty_free_replacement_months: 12, warranty_prorata_months: 24, shelf_life_days: 540, self_discharge_pct_per_month: 6.0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { m_fld: $.data.id }
            - call: "POST /distribution/inventory-lots"
              payload: { battery_model_id: "${m_fld}", warehouse_id: "${wh_tx}", manufactured_on: "2024-01-01", quantity_on_hand: 4 }
              as: WarehouseOperator
              as_user_id: "op-1"
              captures: { lot: $.data.id }
            - call: "POST /distribution/disposal-manifests"
              payload: { warehouse_id: "${wh_tx}", epa_id: "TXD988001122", reporting_period: "2026-Q3" }
              as: ComplianceOfficer
              as_user_id: "comp-1"
              captures: { man: $.data.id, author: $.data.created_by_user_id }
            - call: "POST /distribution/inventory-lots/${lot}/scrap"
              payload: { disposal_manifest_id: "${man}" }
              as: ComplianceOfficer
              as_user_id: "comp-1"
            - call: "POST /distribution/disposal-manifests/${man}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "comp-1"
            - call: "POST /distribution/disposal-manifests/${man}/file"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "comp-2"
              captures: { st: $.data.status, filer: $.data.filed_by_user_id }
          trigger:
            - call: "POST /distribution/disposal-manifests/${man}/reject"
              payload: { rejection_reason: "Attempt to unwind an already filed manifest." }
              as: ComplianceOfficer
              as_user_id: "comp-1"
              captures: { err: $.data.error_id }
          assert:
            - "${author} == comp-1"
            - "${st} == FILED"
            - "${filer} == comp-2"
            - "HTTP status == 409"
            - "${err} == ERR_INVALID_STATE"
            - "DisposalManifest.${man}.status == FILED"
            - "DisposalManifest.${man}.total_lead_kg == 50.000"
            - "InventoryLot.${lot}.scrap_manifest_id == ${man}"
            - "InventoryLot.${lot}.condition_state == SCRAPPED"

      - name: storm_event_closes_directly_from_declared
        claim_type: Valid Transition
        grounds:
