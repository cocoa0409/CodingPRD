      - name: deferred_condition_report_cannot_be_resolved_before_defer_date
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ConditionReport.DEFERRED_to_RESOLVED
          - validations[priority=25]
          - errors[ERR_DEFER_DATE_NOT_REACHED]
          - entities.ConditionReport.fields.defer_until_date
        distinguishing_aspect: |
          The DEFERRED branch of the fork-join carries its own resolve precondition: the logical
          clock date must have reached defer_until_date. Resolving on 2026-08-01 a report deferred to
          2026-10-01 returns HTTP 409 ERR_DEFER_DATE_NOT_REACHED.
        test_recipe:
          setup:
            - "One land manager, one volunteer and the Alder Creek segment (traffic_class MODERATE)."
            - "A condition report triaged with severity MODERATE and exposure MEDIUM, scoring 50, then dispositioned DEFER until 2026-10-01."
          setup_api_calls:
            - call: "POST /stewardship/land-managers"
              payload: { agency_name: "Cascade National Forest", jurisdiction_code: "USFS-R6-ALDER", permit_required: true, permit_lead_days: 14, max_party_size: 20, wet_threshold_index: 0.65, requires_engineering_review: true, requires_certified_sawyer: true }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { lm_id: $.data.id }
            - call: "POST /stewardship/volunteers"
              payload: { full_name: "Petra Novak", email: "petra@example.org", waiver_signed_on: "2026-07-01", certifications: [] }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { gen_id: $.data.id }
            - call: "POST /stewardship/trail-segments"
              payload: { land_manager_id: "${lm_id}", name: "Alder Creek", length_miles: 4.2, surface_class: "NATIVE_SOIL", traffic_class: "MODERATE" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { seg_id: $.data.id }
            - call: "POST /stewardship/condition-reports"
              payload: { trail_segment_id: "${seg_id}", reported_by_volunteer_id: "${gen_id}", hazard_type: "SIGNAGE_MISSING", severity_class: "MODERATE", description: "Junction sign gone." }
              as: Volunteer
              as_user_id: "${gen_id}"
              captures: { cr_id: $.data.id }
            - call: "POST /stewardship/condition-reports/${cr_id}/triage"
              payload: { exposure_class: "MEDIUM" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { s_triage: $.data.priority_score }
            - call: "POST /stewardship/condition-reports/${cr_id}/disposition"
              payload: { disposition: "DEFER", defer_until_date: "2026-10-01" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { s_def: $.data.status, s_score: $.data.priority_score, s_var: $.data.priority_variant }
          trigger:
            - call: "POST /stewardship/condition-reports/${cr_id}/resolve"
              payload: {}
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { early_error: $.data.error_id }
          assert:
            - "${s_triage} == 50"
            - "${s_def} == DEFERRED and ${s_score} == 50 and ${s_var} == REASSESSED"
            - "HTTP status is 409 and ${early_error} == ERR_DEFER_DATE_NOT_REACHED"
            - "ConditionReport.${cr_id}.status == DEFERRED"
            - "TrailSegment.${seg_id}.hazard_index == 8"
      - name: escalate_disposition_below_threshold_is_refused
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ConditionReport.TRIAGED_to_ESCALATED
          - validations[priority=33]
          - errors[ERR_PRIORITY_TOO_LOW_TO_ESCALATE]
          - calculations.condition_report_priority_score
        distinguishing_aspect: |
          The ESCALATE branch requires the REASSESSED score to be at or above 70. A MODERATE /
          MEDIUM report on a MODERATE-traffic segment reassesses to 50 on the same day it was filed,
          so the escalate is refused with HTTP 422 ERR_PRIORITY_TOO_LOW_TO_ESCALATE.
        test_recipe:
