              as: AssetManager
              captures: { eid: $.data.id }
            - call: "POST /assets/entitlements/${eid}/activate"
              payload: {}
              as: AssetManager
              captures: { ev: $.data.version }
            - call: "POST /assets/hardware"
              payload: { vendor_id: "${vid}", asset_tag: "TAG-CI1", category: "DESKTOP", purchase_cost_cents: 100000, in_service_date: "2025-01-01T00:00:00.000Z" }
              as: AssetManager
              captures: { aid: $.data.id }
            - call: "POST /assets/installations"
              payload: { software_product_id: "${pid}", hardware_asset_id: "${aid}", license_entitlement_id: "${eid}", expected_entitlement_version: "${ev}" }
              as: AssetManager
              captures: { iid: $.data.id }
            - call: "POST /assets/installations/${iid}/activate"
              payload: {}
              as: AssetManager
          trigger:
            - call: "POST /assets/installations/${iid}/transition"
              payload: { to_status: "UNINSTALLED" }
              as: AssetManager
            - call: "GET /assets/entitlements/${eid}"
              payload: {}
              as: AssetManager
              captures: { cu: $.data.consumed_units, av: $.data.available_units }
          assert:
            - "LicenseEntitlement.${eid}.consumed_units == 0    # equals pre-install value; install+uninstall conserves seat count"
            - "LicenseEntitlement.${eid}.available_units == 5"

      - name: total_net_book_value_conserved_dispose_reverse
        grounds:
          - state_machines.HardwareAsset.RETIRED_to_DISPOSED
          - state_machines.HardwareAsset.DISPOSED_to_RETIRED
          - entities.HardwareAsset.fields.net_book_value_cents
          - entities.HardwareAsset.fields.disposal_gain_loss_cents
        distinguishing_aspect: |
          Different conserved quantity = HardwareAsset.net_book_value_cents (monetary book value): complete
          disposal (books final depreciation, sets gain/loss) paired with reverse (restores provisional book
          value, zeroes gain/loss) leaves net_book_value_cents back at its pre-disposal provisional value
          (180000) and disposal_gain_loss_cents at 0. Distinct from the seat-count invariant.
        test_recipe:
          setup:
            - "Asset purchase=360000, salvage=0, life=36, in_service=2024-01-01; clock 2025-07-15 (provisional nbv=180000); disposed via approved+completed request, then reversed."
          setup_api_calls:
            - call: "POST /assets/_clock/set_current_utc"
              payload: { to_iso8601: "2025-07-15T00:00:00.000Z" }
              as: AssetManager
            - call: "POST /assets/vendors"
              payload: { name: "HW Corp", vendor_type: "HARDWARE", support_email: "s@hw.com" }
              as: AssetManager
              captures: { vid: $.data.id }
            - call: "POST /assets/hardware"
              payload: { vendor_id: "${vid}", asset_tag: "TAG-CI2", category: "LAPTOP", purchase_cost_cents: 360000, in_service_date: "2024-01-01T00:00:00.000Z", useful_life_months: 36, salvage_value_cents: 0 }
              as: AssetManager
              captures: { aid: $.data.id, nbv_pre: $.data.net_book_value_cents }
            - call: "POST /assets/disposal-requests"
              payload: { hardware_asset_id: "${aid}", reason: "DAMAGED", proposed_proceeds_cents: 150000 }
              as: AssetManager
              as_user_id: "mgr-1"
              captures: { dr: $.data.id }
            - call: "POST /assets/disposal-requests/${dr}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /assets/disposal-requests/${dr}/complete"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /assets/disposal-requests/${dr}/reverse"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /assets/hardware/${aid}"
              payload: {}
              as: ComplianceOfficer
              captures: { nbv_post: $.data.net_book_value_cents, gl_post: $.data.disposal_gain_loss_cents, st: $.data.status }
          assert:
            - "HardwareAsset.${aid}.net_book_value_cents == 180000   # restored to pre-disposal provisional value (nbv_pre)"
            - "HardwareAsset.${aid}.disposal_gain_loss_cents == 0    # gain/loss zeroed by compensation"
            - "HardwareAsset.${aid}.status == RETIRED"
