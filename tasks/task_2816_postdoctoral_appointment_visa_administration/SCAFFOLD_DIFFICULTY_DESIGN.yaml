  - rule_id: boundary_precision_check
    instances:

      - name: total_months_in_rank_cap_accepts_exactly_sixty_and_rejects_sixty_one
        grounds:
          - calculations.months_in_rank_ledger
          - validations.priority_15_ERR_RANK_YEARS_EXCEEDED
          - entities.Appointment.fields.cumulative_months_in_rank_at_end
        distinguishing_aspect: |
          Metric: an integer month count against TOTAL_MONTHS_IN_RANK_CAP (60).
          Endpoint: POST /appointments. The pair 48 + 12 = 60 (accepted) and
          49 + 12 = 61 (refused) differs by exactly one month, so an inclusive
          comparison passes and a strict one fails. The month arithmetic itself is
          also on a boundary: 2026-10-01 to 2027-09-30 has e.day (30) < s.day (1)
          false, so the +1 correction applies and the term is 12, not 11.
