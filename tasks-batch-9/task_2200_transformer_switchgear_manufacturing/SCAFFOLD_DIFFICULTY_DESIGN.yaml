              payload: {}
              as: ContractAdmin
          assert:
            - "after the first confirm: FactoryAcceptanceTest.${fat_id}.status == WITNESS_CONFIRMED and confirmed_witness_count == 1 and EngineeredOrder.${ord_id}.production_posture == OPEN with posture_reason_codes == []"
            - "after the CONFIRMED -> DECLINED decline: FactoryAcceptanceTest.${fat_id}.status == BAY_SCHEDULED, confirmed_witness_count == 0, test_bay_id still ${bay_id} and window_end_at still 2026-02-10T20:00:00Z (the bay window is not surrendered)"
            - "after that same decline: EngineeredOrder.${ord_id}.production_posture == RESTRICTED and posture_reason_codes == [\"WITNESS_MISSING\"]"
            - "after the first reinvite: WitnessAssignment.${wa_id}.status == INVITED while FactoryAcceptanceTest.${fat_id}.status stays BAY_SCHEDULED and confirmed_witness_count stays 0"
            - "after the INVITED -> DECLINED decline: WitnessAssignment.${wa_id}.status == DECLINED, FactoryAcceptanceTest.${fat_id}.confirmed_witness_count is still 0 and status is still BAY_SCHEDULED -- this decline has no FAT-level side effect at all, unlike the first one"
            - "after the second confirm: FactoryAcceptanceTest.${fat_id}.status == WITNESS_CONFIRMED again, confirmed_witness_count == 1, EngineeredOrder.${ord_id}.production_posture == OPEN and posture_reason_codes == []"
            - "TestBay.${bay_id}.scheduled_hours_total == 8 throughout (no re-scheduling occurred during the cycle)"
            - "WitnessAssignment.${wa_id}.blackout_days == 0 and confirmed_at == 2026-02-01T00:00:00Z"

      - name: order_fulfillment_reverts_fat_complete_to_in_production_on_attempt_two_schedule
        grounds:
          - state_machines.EngineeredOrder.fulfillment_status.FAT_COMPLETE->IN_PRODUCTION
          - state_machines.FactoryAcceptanceTest.REQUESTED->BAY_SCHEDULED
          - state_machines.FactoryAcceptanceTest.FAILED->ABANDONED
          - state_machines.ComponentAllocation.COMMITTED->CONSUMED
          - entities.FactoryAcceptanceTest.fields.attempt_number
        distinguishing_aspect: |
          fulfillment_status is not monotonic: scheduling a retest whose attempt_number is 2 drags the
          order backwards FAT_COMPLETE -> IN_PRODUCTION even though every ComponentAllocation was
          already CONSUMED by the first PASS, producing an IN_PRODUCTION order with zero COMMITTED
          allocations -- a combination the forward path (PLANNING -> MATERIAL_ALLOCATED ->
          IN_PRODUCTION) can never produce. Scheduling the attempt_number 1 test while the order is
          already FAT_COMPLETE must NOT revert anything.
        test_recipe:
          setup:
            - "Order TX-NLS-0006 driven to FAT_COMPLETE by FAT #1 (attempt_number 1) passing on 2026-02-10; its single COMMITTED allocation of 2 units becomes CONSUMED there."
