# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 2713: Trauma Center Verification & Registry Reporting
# Nine §0.5 Difficulty Rules; every instance is reachable from an empty database
# using only endpoints declared in SCAFFOLD.yaml §1.5. The logical clock starts at
# 2026-08-01T00:00:00Z, so every chain that depends on "now" sets it explicitly.
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: triage_rate_variants_diverge_on_identical_case_cohort
        grounds:
          - calculations.under_over_triage_rates
          - entities.TraumaCenter.fields.under_triage_rate_pct
          - entities.TraumaCenter.fields.over_triage_rate_pct
          - entities.RegistryCase.fields.effective_iss
          - endpoints[GET /trauma-centers/{id}/triage-rates]
        distinguishing_aspect: |
          PROVISIONAL_MONITORING counts the medical director's confirmed review outcomes over every
          INCLUDED case (4 cases -> 25.00 under / 0.00 over) while VERIFICATION_AUDIT re-derives the
          numerators from the Cribari ISS/tier matrix over adjudicated cases only (3 cases -> 33.33
          under / 33.33 over), so the same four cases return four different numbers in one request pair.
        test_recipe:
          setup:
            - "one trauma center with two activation tiers: TIER_1_FULL (surgeon 15 min, specialty 30 min, iss_threshold 16) and TIER_3_CONSULT (30/60, iss_threshold 4)"
            - "no DataDictionaryRule rows exist, so every abstraction scores 0 penalty points and registry_compliance_score stays 100.00"
            - "four INCLUDED cases: K1 (TIER_3_CONSULT, ISS 25, abstraction VALIDATED, triage APPROPRIATE), K2 (TIER_1_FULL, ISS 5, abstraction VALIDATED, triage UNDER_TRIAGE_CONFIRMED), K3 (TIER_1_FULL, ISS 20, abstraction VALIDATED, triage APPROPRIATE), K4 (TIER_3_CONSULT, ISS 10, abstraction still PENDING, triage APPROPRIATE)"
            - "confirming under-triage on K2 lifted the persisted under_triage_rate_pct to 25.00, which already opened one SYSTEM_AUTO UNDER_TRIAGE PIEvent"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
            - call: "POST /trauma-centers"
              payload: { name: "Northgate Trauma", state_code: "OH", designation_level: "LEVEL_I", verification_cycle_start_date: "2026-01-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
              captures: { c1: $.data.id }
            - call: "POST /trauma-centers/${c1}/activation-tiers"
              payload: { tier_code: "TIER_1_FULL", surgeon_response_limit_minutes: 15, specialty_response_limit_minutes: 30, iss_threshold: 16 }
              as: TraumaProgramManager
              as_user_id: "${c1}"
              captures: { tier_full: $.data.id }
            - call: "POST /trauma-centers/${c1}/activation-tiers"
              payload: { tier_code: "TIER_3_CONSULT", surgeon_response_limit_minutes: 30, specialty_response_limit_minutes: 60, iss_threshold: 4 }
              as: TraumaProgramManager
              as_user_id: "${c1}"
              captures: { tier_consult: $.data.id }
            - call: "POST /registry-cases"
              payload: { center_id: "${c1}", activation_tier_id: "${tier_consult}", mrn: "MRN-K1", arrival_at: "2026-07-20T08:00:00Z", injury_severity_score: 25, los_hours: 96.00, ed_disposition: "ADMIT" }
              as: RegistryAbstractor
              as_user_id: "u_abstractor_1"
              captures: { k1: $.data.id, k1_v: $.data.version }
            - call: "POST /registry-cases/${k1}/abstractions"
              payload: { expected_case_version: "${k1_v}", iss_abstracted: 25, gcs_arrival: 9, mechanism_code: "MVC", ed_departure_at: "2026-07-20T11:00:00Z" }
              as: RegistryAbstractor
              as_user_id: "u_abstractor_1"
              captures: { a_k1: $.data.id }
            - call: "POST /abstractions/${a_k1}/validate"
              payload: {}
              as: RegistryValidator
              as_user_id: "u_validator_1"
            - call: "POST /registry-cases/${k1}/triage-review"
              payload: { triage_review_status: "APPROPRIATE" }
              as: TraumaMedicalDirector
              as_user_id: "u_director_1"
            - call: "POST /registry-cases"
              payload: { center_id: "${c1}", activation_tier_id: "${tier_full}", mrn: "MRN-K2", arrival_at: "2026-07-21T08:00:00Z", injury_severity_score: 5, los_hours: 96.00, ed_disposition: "ADMIT" }
              as: RegistryAbstractor
              as_user_id: "u_abstractor_1"
              captures: { k2: $.data.id, k2_v: $.data.version }
            - call: "POST /registry-cases/${k2}/abstractions"
              payload: { expected_case_version: "${k2_v}", iss_abstracted: 5, gcs_arrival: 15, mechanism_code: "FALL", ed_departure_at: "2026-07-21T10:00:00Z" }
              as: RegistryAbstractor
              as_user_id: "u_abstractor_1"
              captures: { a_k2: $.data.id }
            - call: "POST /abstractions/${a_k2}/validate"
              payload: {}
              as: RegistryValidator
              as_user_id: "u_validator_1"
            - call: "POST /registry-cases/${k2}/triage-review"
              payload: { triage_review_status: "UNDER_TRIAGE_CONFIRMED" }
              as: TraumaMedicalDirector
              as_user_id: "u_director_1"
            - call: "POST /registry-cases"
              payload: { center_id: "${c1}", activation_tier_id: "${tier_full}", mrn: "MRN-K3", arrival_at: "2026-07-22T08:00:00Z", injury_severity_score: 20, los_hours: 96.00, ed_disposition: "ADMIT" }
              as: RegistryAbstractor
              as_user_id: "u_abstractor_1"
              captures: { k3: $.data.id, k3_v: $.data.version }
            - call: "POST /registry-cases/${k3}/abstractions"
              payload: { expected_case_version: "${k3_v}", iss_abstracted: 20, gcs_arrival: 12, mechanism_code: "GSW", ed_departure_at: "2026-07-22T09:30:00Z" }
              as: RegistryAbstractor
              as_user_id: "u_abstractor_1"
              captures: { a_k3: $.data.id }
            - call: "POST /abstractions/${a_k3}/validate"
              payload: {}
              as: RegistryValidator
              as_user_id: "u_validator_1"
            - call: "POST /registry-cases/${k3}/triage-review"
              payload: { triage_review_status: "APPROPRIATE" }
              as: TraumaMedicalDirector
              as_user_id: "u_director_1"
            - call: "POST /registry-cases"
              payload: { center_id: "${c1}", activation_tier_id: "${tier_consult}", mrn: "MRN-K4", arrival_at: "2026-07-23T08:00:00Z", injury_severity_score: 10, los_hours: 96.00, ed_disposition: "ADMIT" }
              as: RegistryAbstractor
              as_user_id: "u_abstractor_1"
              captures: { k4: $.data.id }
            - call: "POST /registry-cases/${k4}/triage-review"
              payload: { triage_review_status: "APPROPRIATE" }
              as: TraumaMedicalDirector
              as_user_id: "u_director_1"
          trigger:
            - call: "GET /trauma-centers/${c1}/triage-rates"
              payload: {}
              as: TraumaProgramManager
              as_user_id: "${c1}"
            - call: "GET /trauma-centers/${c1}/triage-rates"
              payload: { variant: "VERIFICATION_AUDIT" }
              as: VerificationReviewer
              as_user_id: "u_reviewer_1"
          assert:
            - "the default read returns variant == PROVISIONAL_MONITORING, denominator_case_count == 4, under_triage_numerator == 1, over_triage_numerator == 0, under_triage_rate_pct == 25.00, over_triage_rate_pct == 0.00"
            - "the VERIFICATION_AUDIT read returns denominator_case_count == 3, under_triage_numerator == 1, over_triage_numerator == 1, under_triage_rate_pct == 33.33, over_triage_rate_pct == 33.33"
            - "TraumaCenter.${c1}.under_triage_rate_pct == 25.00 and TraumaCenter.${c1}.over_triage_rate_pct == 0.00 — the VERIFICATION_AUDIT numbers are never persisted"
            - "TraumaCenter.${c1}.registry_included_case_count == 4 and TraumaCenter.${c1}.registry_excluded_case_count == 0"
      - name: readiness_score_variants_diverge_on_remediation_submitted_deficiency
        grounds:
          - calculations.verification_readiness_score
          - state_machines.CriteriaDeficiency.OPEN_to_REMEDIATION_SUBMITTED
          - entities.VerificationCycle.fields.readiness_score
          - endpoints[GET /verification-cycles/{id}/readiness]
        distinguishing_aspect: |
          REVIEWER_ASSESSMENT keeps a REMEDIATION_SUBMITTED TYPE_II_MAJOR deficiency inside its OPEN_SET
          and returns 74.00, while SELF_ASSESSMENT treats the same row as resolved and returns 80.00 —
          a 6.00 point gap produced by one status value, on a different entity family (VerificationCycle
          deficiencies) than the triage-rate variant instance.
        test_recipe:
          setup:
            - "one trauma center with no outreach credit hours, so the NATIONAL_VERIFICATION outreach gap is the full 12.00 hours (penalty 18.00)"
            - "one NATIONAL_VERIFICATION cycle in PREP carrying two deficiencies: CD-11-01 TYPE_II_MAJOR already REMEDIATION_SUBMITTED and CD-11-02 TYPE_III_MINOR still OPEN"
            - "no PI events and registry_compliance_score 100.00, so the pi and registry penalties are both 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
            - call: "POST /trauma-centers"
              payload: { name: "Lakeshore Trauma", state_code: "MI", designation_level: "LEVEL_II", verification_cycle_start_date: "2026-01-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
              captures: { c1: $.data.id }
            - call: "POST /verification-cycles"
              payload: { center_id: "${c1}", cycle_type: "NATIONAL_VERIFICATION", site_visit_date: "2026-11-10T13:00:00Z" }
              as: TraumaProgramManager
              as_user_id: "${c1}"
              captures: { cyc: $.data.id }
            - call: "POST /verification-cycles/${cyc}/deficiencies"
              payload: { criterion_code: "CD-11-01", deficiency_class: "TYPE_II_MAJOR", remediation_due_at: "2026-10-01T00:00:00Z" }
              as: VerificationReviewer
              as_user_id: "u_reviewer_1"
              captures: { d_major: $.data.id }
            - call: "POST /verification-cycles/${cyc}/deficiencies"
              payload: { criterion_code: "CD-11-02", deficiency_class: "TYPE_III_MINOR", remediation_due_at: "2026-10-01T00:00:00Z" }
              as: VerificationReviewer
              as_user_id: "u_reviewer_1"
              captures: { d_minor: $.data.id }
            - call: "GET /verification-cycles/${cyc}"
              payload: {}
              as: TraumaProgramManager
              as_user_id: "${c1}"
              captures: { cyc_v: $.data.version }
            - call: "POST /criteria-deficiencies/${d_major}/remediation"
              payload: { expected_cycle_version: "${cyc_v}", remediation_note: "Call panel roster updated and monthly audit attached." }
              as: TraumaProgramManager
              as_user_id: "${c1}"
          trigger:
            - call: "GET /verification-cycles/${cyc}/readiness"
              payload: {}
              as: TraumaProgramManager
              as_user_id: "${c1}"
            - call: "GET /verification-cycles/${cyc}/readiness"
              payload: { variant: "SELF_ASSESSMENT" }
              as: TraumaProgramManager
              as_user_id: "${c1}"
          assert:
            - "the default read returns variant == REVIEWER_ASSESSMENT, deficiency_penalty == 8, outreach_penalty == 18.00, pi_penalty == 0, readiness_score == 74.00, submit_eligible == true"
            - "the SELF_ASSESSMENT read returns deficiency_penalty == 2, outreach_penalty == 18.00, readiness_score == 80.00"
            - "VerificationCycle.${cyc}.readiness_score == 74.00 — the persisted score always follows REVIEWER_ASSESSMENT"
            - "VerificationCycle.${cyc}.open_type_ii_count == 1 and open_type_iii_count == 1: REMEDIATION_SUBMITTED does not decrement the open counters"
  - rule_id: combinatorial_formula
    instances:
      - name: readiness_deficiency_penalty_saturates_at_sixty_point_cap
        grounds:
          - calculations.verification_readiness_score
          - state_machines.VerificationCycle.PREP_to_PREP_BLOCKED
          - entities.VerificationCycle.fields.open_type_i_count
          - entities.TraumaCenter.fields.open_critical_deficiency_count
        distinguishing_aspect: |
          Mode (a) formula shape: five TYPE_I_CRITICAL deficiencies weigh 15*5 = 75 raw points but the
          min(60, ...) cap clips the deficiency term to exactly 60, so the score is
          100.00 - 60 - 18.00 = 22.00 rather than the uncapped 7.00 — the cap, not the weight sum,
          determines the answer.
        test_recipe:
          setup:
            - "one trauma center with zero verified outreach hours (NATIONAL outreach penalty 18.00) and registry_compliance_score 100.00"
            - "one NATIONAL_VERIFICATION cycle holding five OPEN TYPE_I_CRITICAL deficiencies CD-01-01 .. CD-01-05"
            - "the cycle has already been driven PREP -> PREP_BLOCKED by the first critical deficiency and the center posture is AT_RISK"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
            - call: "POST /trauma-centers"
              payload: { name: "Riverbend Trauma", state_code: "TX", designation_level: "LEVEL_I", verification_cycle_start_date: "2026-01-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
              captures: { c1: $.data.id }
            - call: "POST /verification-cycles"
              payload: { center_id: "${c1}", cycle_type: "NATIONAL_VERIFICATION", site_visit_date: "2026-12-01T13:00:00Z" }
              as: TraumaProgramManager
              as_user_id: "${c1}"
              captures: { cyc: $.data.id }
            - call: "POST /verification-cycles/${cyc}/deficiencies"
              payload: { criterion_code: "CD-01-01", deficiency_class: "TYPE_I_CRITICAL", remediation_due_at: "2026-09-15T00:00:00Z" }
              as: VerificationReviewer
              as_user_id: "u_reviewer_1"
            - call: "POST /verification-cycles/${cyc}/deficiencies"
              payload: { criterion_code: "CD-01-02", deficiency_class: "TYPE_I_CRITICAL", remediation_due_at: "2026-09-15T00:00:00Z" }
              as: VerificationReviewer
              as_user_id: "u_reviewer_1"
            - call: "POST /verification-cycles/${cyc}/deficiencies"
              payload: { criterion_code: "CD-01-03", deficiency_class: "TYPE_I_CRITICAL", remediation_due_at: "2026-09-15T00:00:00Z" }
              as: VerificationReviewer
              as_user_id: "u_reviewer_1"
            - call: "POST /verification-cycles/${cyc}/deficiencies"
              payload: { criterion_code: "CD-01-04", deficiency_class: "TYPE_I_CRITICAL", remediation_due_at: "2026-09-15T00:00:00Z" }
              as: VerificationReviewer
              as_user_id: "u_reviewer_1"
            - call: "POST /verification-cycles/${cyc}/deficiencies"
              payload: { criterion_code: "CD-01-05", deficiency_class: "TYPE_I_CRITICAL", remediation_due_at: "2026-09-15T00:00:00Z" }
              as: VerificationReviewer
              as_user_id: "u_reviewer_1"
          trigger:
            - call: "GET /verification-cycles/${cyc}/readiness"
              payload: {}
              as: VerificationReviewer
              as_user_id: "u_reviewer_1"
          assert:
            - "the read returns deficiency_penalty == 60, outreach_penalty == 18.00, pi_penalty == 0, readiness_score == 22.00, submit_eligible == false"
            - "VerificationCycle.${cyc}.readiness_score == 22.00 and VerificationCycle.${cyc}.open_type_i_count == 5"
            - "VerificationCycle.${cyc}.status == PREP_BLOCKED"
            - "TraumaCenter.${c1}.open_critical_deficiency_count == 5 and TraumaCenter.${c1}.readiness_posture == AT_RISK"
      - name: outreach_ledger_quantizes_each_activity_before_summing
        grounds:
          - calculations.outreach_credit_hour_ledger
          - state_machines.OutreachActivity.LOGGED_to_VERIFIED
          - entities.OutreachActivity.fields.weighted_credit_hours
          - entities.TraumaCenter.fields.outreach_credit_hours_ytd
        distinguishing_aspect: |
          Mode (b) evaluation order: quantizing each activity to 0.25 first yields 1.75 + 1.25 + 0.50 =
          3.50, whereas summing the raw weighted hours (1.65 + 1.15 + 0.375 = 3.175) and quantizing the
          total once yields 3.25 — the ledger must land on 3.50.
        test_recipe:
          setup:
            - "one trauma center with outreach_credit_hours_ytd 0.00"
            - "three LOGGED activities: INJURY_PREVENTION 1.10 h (weight 1.5), PROFESSIONAL_EDUCATION 1.15 h (weight 1.0) and COMMUNITY_OUTREACH 0.75 h (weight 0.5)"
            - "no verification cycle exists, so the ledger move is observed on the center alone"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
            - call: "POST /trauma-centers"
              payload: { name: "Cedar Falls Trauma", state_code: "IA", designation_level: "LEVEL_II", verification_cycle_start_date: "2026-01-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
              captures: { c1: $.data.id }
            - call: "POST /trauma-centers/${c1}/outreach-activities"
              payload: { activity_kind: "INJURY_PREVENTION", event_date: "2026-06-10T17:00:00Z", credit_hours: 1.10, audience_count: 40 }
              as: TraumaProgramManager
              as_user_id: "${c1}"
              captures: { o_ip: $.data.id }
            - call: "POST /trauma-centers/${c1}/outreach-activities"
              payload: { activity_kind: "PROFESSIONAL_EDUCATION", event_date: "2026-06-17T17:00:00Z", credit_hours: 1.15, audience_count: 25 }
              as: TraumaProgramManager
              as_user_id: "${c1}"
              captures: { o_pe: $.data.id }
            - call: "POST /trauma-centers/${c1}/outreach-activities"
              payload: { activity_kind: "COMMUNITY_OUTREACH", event_date: "2026-06-24T17:00:00Z", credit_hours: 0.75, audience_count: 90 }
              as: TraumaProgramManager
              as_user_id: "${c1}"
              captures: { o_co: $.data.id }
          trigger:
            - call: "POST /outreach-activities/${o_ip}/verify"
              payload: {}
              as: TraumaMedicalDirector
              as_user_id: "u_director_1"
            - call: "POST /outreach-activities/${o_pe}/verify"
              payload: {}
              as: TraumaMedicalDirector
              as_user_id: "u_director_1"
            - call: "POST /outreach-activities/${o_co}/verify"
              payload: {}
              as: TraumaMedicalDirector
              as_user_id: "u_director_1"
          assert:
            - "OutreachActivity.${o_ip}.weighted_credit_hours == 1.75, OutreachActivity.${o_pe}.weighted_credit_hours == 1.25, OutreachActivity.${o_co}.weighted_credit_hours == 0.50"
            - "TraumaCenter.${c1}.outreach_credit_hours_ytd == 1.75 after the first verify and == 3.00 after the second"
            - "TraumaCenter.${c1}.outreach_credit_hours_ytd == 3.50 after the third verify (NOT 3.25)"
            - "all three activities report verified_status == VERIFIED and reviewed_by_user_id == u_director_1"
      - name: dictionary_band_multiplier_reads_prepenalty_compliance_score
        grounds:
          - calculations.dictionary_penalty_scan
          - state_machines.RegistryCase.PENDING_to_ABSTRACTED
          - entities.AbstractionRecord.fields.band_multiplier_used
          - entities.AbstractionRecord.fields.applied_penalty_points
          - entities.TraumaCenter.fields.registry_compliance_score
        distinguishing_aspect: |
          Mode (c) circular dependency: three abstractions with byte-identical violation sets (raw
          weight 6) draw penalties 6.00, 9.00 and 12.00 because the band multiplier reads the score as
          persisted at the start of each request; reading the band after subtracting the same
          submission's penalty would already diverge on the first abstraction (9.00 / 91.00).
        test_recipe:
          setup:
            - "four DataDictionaryRule rows: gcs_arrival RANGE MAJOR [3,15] (weight 2), iss_abstracted RANGE MAJOR [0,75] (weight 2), mechanism_code CONFORMANCE MINOR allowed {MVC,FALL,GSW} (weight 1), ed_departure_at REQUIRED MINOR (weight 1) — none CRITICAL, so no submission is rejected"
            - "one trauma center with registry_compliance_score 100.00 and one TIER_1_FULL activation tier"
            - "three PENDING cases MRN-D1, MRN-D2 and MRN-D3, each with version 1 and no abstraction yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
            - call: "POST /data-dictionary-rules"
              payload: { field_name: "gcs_arrival", rule_kind: "RANGE", severity: "MAJOR", min_value: 3, max_value: 15 }
              as: SystemAdmin
              as_user_id: "u_admin"
            - call: "POST /data-dictionary-rules"
              payload: { field_name: "iss_abstracted", rule_kind: "RANGE", severity: "MAJOR", min_value: 0, max_value: 75 }
              as: SystemAdmin
              as_user_id: "u_admin"
            - call: "POST /data-dictionary-rules"
              payload: { field_name: "mechanism_code", rule_kind: "CONFORMANCE", severity: "MINOR", allowed_codes: ["MVC", "FALL", "GSW"] }
              as: SystemAdmin
              as_user_id: "u_admin"
            - call: "POST /data-dictionary-rules"
              payload: { field_name: "ed_departure_at", rule_kind: "REQUIRED", severity: "MINOR" }
              as: SystemAdmin
              as_user_id: "u_admin"
            - call: "POST /trauma-centers"
              payload: { name: "Summit Ridge Trauma", state_code: "CO", designation_level: "LEVEL_I", verification_cycle_start_date: "2026-01-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
              captures: { c1: $.data.id }
            - call: "POST /trauma-centers/${c1}/activation-tiers"
              payload: { tier_code: "TIER_1_FULL", surgeon_response_limit_minutes: 15, specialty_response_limit_minutes: 30, iss_threshold: 16 }
              as: TraumaProgramManager
              as_user_id: "${c1}"
              captures: { tier_full: $.data.id }
            - call: "POST /registry-cases"
              payload: { center_id: "${c1}", activation_tier_id: "${tier_full}", mrn: "MRN-D1", arrival_at: "2026-07-10T08:00:00Z", injury_severity_score: 18, los_hours: 72.00, ed_disposition: "ADMIT" }
              as: RegistryAbstractor
              as_user_id: "u_abstractor_1"
              captures: { d1: $.data.id, d1_v: $.data.version }
            - call: "POST /registry-cases"
              payload: { center_id: "${c1}", activation_tier_id: "${tier_full}", mrn: "MRN-D2", arrival_at: "2026-07-11T08:00:00Z", injury_severity_score: 18, los_hours: 72.00, ed_disposition: "ADMIT" }
              as: RegistryAbstractor
              as_user_id: "u_abstractor_1"
              captures: { d2: $.data.id, d2_v: $.data.version }
            - call: "POST /registry-cases"
              payload: { center_id: "${c1}", activation_tier_id: "${tier_full}", mrn: "MRN-D3", arrival_at: "2026-07-12T08:00:00Z", injury_severity_score: 18, los_hours: 72.00, ed_disposition: "ADMIT" }
              as: RegistryAbstractor
              as_user_id: "u_abstractor_1"
              captures: { d3: $.data.id, d3_v: $.data.version }
          trigger:
            - call: "POST /registry-cases/${d1}/abstractions"
              payload: { expected_case_version: "${d1_v}", iss_abstracted: 90, gcs_arrival: 20, mechanism_code: "TRAIN" }
              as: RegistryAbstractor
              as_user_id: "u_abstractor_1"
