          - entities.Appliance.fields.hcpcs_code
        distinguishing_aspect: |
          The prefabricated arm of two different dual-variant calculations at once: starting
          advancement is min(4.00, half the range) = 4.00 rather than the custom arm's 4.75 on the
          identical 8.00 mm range, and the A9270 fee basis is 0, so allowed_cents is 0 and the whole
          billed amount becomes a contractual adjustment.
