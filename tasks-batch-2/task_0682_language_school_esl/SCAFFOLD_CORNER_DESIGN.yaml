        claim_type: Priority Ordering
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "Confirming a non-existent enrollment id returns ERR_NOT_FOUND (existence p4) rather than any state error p5 — existence is checked first."
        test_recipe:
          setup: ["Empty DB."]
