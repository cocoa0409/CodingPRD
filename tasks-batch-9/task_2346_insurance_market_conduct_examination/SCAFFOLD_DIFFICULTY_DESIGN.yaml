  # =============================================================================
  # RULE 3 - non_linear_state_machine
  # =============================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: criticism_rebuttal_cycle_loops_to_issued_and_terminates_at_round_bound
        grounds:
          - state_machines.Criticism
          - calculations.criticism_response_round_accounting
          - entities.Criticism.fields.response_round
          - entities.Criticism.fields.rebuttal_count
          - errors.ERR_REBUTTAL_ROUNDS_EXHAUSTED
        distinguishing_aspect: |
          A true cycle ISSUED -> RESPONDED -> ISSUED traversed twice on ONE entity, where the loop counter
          (response_round) and the back-edge counter (rebuttal_count) advance on DIFFERENT edges while a
          single strict guard response_round < MAX_RESPONSE_ROUNDS bounds both of them. The exit is
          asymmetric: the third rebuttal is refused with ERR_REBUTTAL_ROUNDS_EXHAUSTED and parks the
          criticism in RESPONDED, after which a further response is refused by the higher-priority state
          rule instead - and the exposure computed on the first pass is never recomputed by looping.
        test_recipe:
          setup:
            - "SETUP-CHAIN-A: AURORA carrier, ON_SITE examination 2026-09-01 .. 2026-11-30, CLAIMS area population 4000 / sample 10 with statutory tolerance 3.00, 3 MATERIAL errors 25000 / 18000 / 7333 -> tolerance_breached true, area TESTED, examination in CRITICISM."
            - "One MATERIAL criticism issued against the CLAIMS area with affected_file_count 3 -> restitution_method POPULATION_EXTRAPOLATED, restitution_exposure_cents 20132000, status ISSUED, response_round 0, rebuttal_count 0."
          setup_api_calls:
            - call: "POST /market-conduct/insurers"
              payload: { name: "Aurora Mutual Insurance Company", naic_code: "10001", annual_premium_written_cents: 1200000000, policy_count_in_force: 40000, confirmed_complaints_12mo: 120, financial_stress_score: 60, consumer_trend_score: 50 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { aurora_id: "$.data.id" }
            - call: "POST /market-conduct/examinations"
              payload: { insurer_id: "${aurora_id}", exam_type: "MARKET_CONDUCT_EXAM", mode: "ON_SITE", lead_state_code: "NV", fieldwork_start_date: "2026-09-01", fieldwork_end_date: "2026-11-30" }
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
              captures: { exam_id: "$.data.id" }
            - call: "POST /market-conduct/examinations/${exam_id}/scope-areas"
              payload: { area: "CLAIMS", population_size: 4000, sample_size: 10 }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
              captures: { clm_area_id: "$.data.id" }
            - call: "POST /market-conduct/examinations/${exam_id}/lock-scope"
              as: SupervisingExaminer
