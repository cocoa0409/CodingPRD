    - state_machines.SerializedAsset.TRADE_IN_RETURNED_to_IN_SERVICE
    - state_machines.SerializedAsset.TRADE_IN_RETURNED_to_REFURB_INTAKE
    - calculations.asset_trade_in_valuation
    - calculations.tradein_credit_ledger
    - validations[priority=11]
    - errors[ERR_INVALID_STATE_TRANSITION]
    distinguishing_aspect: 'The compensating edge TRADE_IN_RETURNED -> IN_SERVICE exists only from TRADE_IN_RETURNED: the same reverse call succeeds there (clearing the 263973-cent grant) and then fails
      with ERR_INVALID_STATE_TRANSITION once the asset has branched to REFURB_INTAKE, where no reverse edge is declared.'
    test_recipe:
      setup:
      - Logical clock at the default 2026-08-01T00:00:00Z throughout, so age_years == 0.
