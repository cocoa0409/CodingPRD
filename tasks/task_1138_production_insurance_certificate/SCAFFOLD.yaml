# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not authorized for endpoint per §1.5 roles list" }
  - { id: ERR_SELF_SETTLEMENT_FORBIDDEN, http: 403, condition: "Claims adjuster X-User-ID matches claim submitter X-User-ID" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a valid `from` state for the requested transition" }
  - { id: ERR_DUPLICATE_IDENTIFIER, http: 409, condition: "Uniqueness violation on certificate_number or (carrier_code, coverage_line, policy_number)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match parent's current version (OCC)" }
  - { id: ERR_INVALID_ENUM, http: 400, condition: "Enum field value not in declared set" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing or malformed type" }
  - { id: ERR_ADDITIONAL_INSURED_REQUIRED, http: 400, condition: "additional_insured_name required on LOCATION/PERMIT certificates but absent/empty" }
  - { id: ERR_TEMPORAL_RANGE_INVALID, http: 422, condition: "end <= start, or occurrence_date outside policy effective window" }
  - { id: ERR_CERT_WINDOW_OUTSIDE_POLICY, http: 422, condition: "Certificate window not subset of allowed outer window AND all bound policy windows (half-open)" }
  - { id: ERR_WINDOW_ELAPSED, http: 422, condition: "current_utc past allowed window (renewal offer expired, certificate location_end passed)" }
  - { id: ERR_FOREIGN_TRAVEL_OVERLAP, http: 422, condition: "Travel extension overlaps another approved/active same-territory extension, or outside production buffer window" }
  - { id: ERR_POSTURE_BLOCKS_ISSUANCE, http: 422, condition: "Production.coverage_posture is RESTRICTED or SUSPENDED; issuance operations blocked" }
  - { id: ERR_POSTURE_BLOCKS_BOND, http: 422, condition: "Production.coverage_posture blocks bond issuance (must be BOUND_PARTIAL or BOUND_FULL)" }
  - { id: ERR_POSTURE_BLOCKS_FOREIGN, http: 422, condition: "Production.coverage_posture blocks foreign travel approval" }
  - { id: ERR_COVERAGE_LINE_NOT_BOUND, http: 422, condition: "Certificate lists a coverage_line with no bound policy on this production" }
  - { id: ERR_CAST_ENDORSEMENT_INVALID, http: 422, condition: "Cast endorsement type does not match cast member state (exam status / essential_element / role_tier)" }
  - { id: ERR_CAST_ENDORSEMENT_MISSING, http: 422, condition: "Cast member with endorsement_required == true has no ISSUED endorsement" }
  - { id: ERR_CAST_EXAM_INCOMPLETE, http: 422, condition: "Cast-coverage policy bind requires every endorsement-required cast member to have exam in {CLEARED, CONDITIONAL}" }
  - { id: ERR_EO_CLEARANCE_INCOMPLETE, http: 422, condition: "E&O policy bind requires SCRIPT and TITLE clearances in {CLEARED, WAIVED}" }
  - { id: ERR_GL_PREREQUISITE_MISSING, http: 422, condition: "FOREIGN_TRAVEL policy bind requires a bound GENERAL_LIABILITY policy" }
  - { id: ERR_NO_BOUND_POLICY, http: 422, condition: "Production activation requires at least one policy in {BOUND, ENDORSED_PENDING, ACTIVE}" }
  - { id: ERR_BOND_NOT_ISSUED, http: 422, condition: "Production.requires_completion_bond but bond not in ISSUED" }
  - { id: ERR_MANDATORY_CLEARANCE_OPEN, http: 422, condition: "Mandatory clearance (SCRIPT/TITLE/PERSONAL_RIGHTS) still in PENDING or FLAGGED at activation" }
  - { id: ERR_OPEN_CLAIMS_BLOCK_WRAP, http: 422, condition: "Production cannot wrap while claims are open" }
  - { id: ERR_OPEN_CLAIMS_BLOCK_CANCEL, http: 422, condition: "Production cannot cancel while claims are open" }
  - { id: ERR_OPEN_CLAIMS_BLOCK_POLICY_CANCEL, http: 422, condition: "Policy cannot cancel while it has open claims" }
  - { id: ERR_DRAFT_CERTIFICATES_OPEN, http: 422, condition: "Production cannot wrap with DRAFT certificates outstanding" }
  - { id: ERR_POLICY_NOT_CLAIMABLE, http: 422, condition: "Claim references a policy in QUOTED or CANCELLED state" }
  - { id: ERR_REFERENCED_STATE_INVALID, http: 422, condition: "Generic FK-target state incompatible with operation" }
  - { id: ERR_SETTLEMENT_EXCEEDS_RESERVE, http: 422, condition: "settlement_amount_cents > claim.reserve_cents" }
  - { id: ERR_FISCAL_CONSTRAINT_VIOLATED, http: 422, condition: "Fiscal sanity check (amount > 0, bond >= min pct of budget, etc.) failed" }
  - { id: ERR_DEDUCTIBLE_CAP_EXCEEDED, http: 422, condition: "Aggregate deductible cap would be exceeded by proposed claim" }
  - { id: ERR_AUDIT_PENDING_BLOCKS_RENEWAL, http: 422, condition: "Renewal accept blocked while a payroll audit is SCHEDULED or SUBMITTED" }
  - { id: ERR_RENEWAL_OFFER_EXPIRED, http: 422, condition: "Renewal accept attempted after offer_expires_at" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: BrokerAgent
    description: "Insurance broker's account executive — manages productions, policies, certificates"
    identity: opaque
    exclusive_operations:
      - "POST /productions"
      - "POST /productions/{id}/activate"
      - "POST /productions/{id}/cancel"
      - "POST /productions/{prodId}/policies"
      - "POST /productions/{prodId}/policies/{id}/bind"
      - "POST /productions/{prodId}/policies/{id}/cancel"
      - "POST /productions/{prodId}/certificates"
      - "POST /productions/{prodId}/certificates/{id}/issue"
      - "POST /productions/{prodId}/certificates/{id}/void"
      - "POST /productions/{prodId}/policies/{pid}/payroll-audits/{id}/post"
    shared_operations:
      - "GET reads on all resources"

  - name: ProductionManager
    description: "Production-side manager — adds cast, reports claims, manages bond application, requests travel"
    identity: opaque
    exclusive_operations:
      - "POST /productions/{id}/wrap"
      - "POST /productions/{prodId}/cast-members"
      - "POST /productions/{prodId}/claims"
      - "POST /productions/{prodId}/completion-bond"
      - "POST /productions/{prodId}/foreign-travel-extensions"
      - "POST /productions/{prodId}/policies/{pid}/payroll-audits/{id}/dispute"
      - "POST /productions/{prodId}/policies/{pid}/renewal-offers/{id}/accept"
      - "POST /productions/{prodId}/policies/{pid}/renewal-offers/{id}/decline"
    shared_operations:
      - "GET reads on all resources"

  - name: UnderwriterAgent
    description: "Carrier underwriter — issues endorsements, approves travel, records physical exams, creates renewal offers"
    identity: opaque
    exclusive_operations:
      - "POST /productions/{prodId}/cast-members/{id}/physical-exam"
      - "POST /productions/{prodId}/cast-members/{id}/physical-exam-retake"
      - "POST /productions/{prodId}/cast-endorsements"
      - "POST /productions/{prodId}/cast-endorsements/{id}/issue"
      - "POST /productions/{prodId}/cast-endorsements/{id}/revoke"
      - "POST /productions/{prodId}/foreign-travel-extensions/{id}/approve"
      - "POST /productions/{prodId}/foreign-travel-extensions/{id}/deny"
      - "POST /productions/{prodId}/policies/{pid}/renewal-offers"
    shared_operations:
      - "GET reads on all resources"

  - name: ClaimsAdjuster
    description: "Claims adjuster — acknowledges, adjusts, settles, denies, closes claims"
    identity: opaque
    exclusive_operations:
      - "POST /productions/{prodId}/claims/{id}/acknowledge"
      - "POST /productions/{prodId}/claims/{id}/adjust"
      - "POST /productions/{prodId}/claims/{id}/settle"
      - "POST /productions/{prodId}/claims/{id}/deny"
      - "POST /productions/{prodId}/claims/{id}/close"
    shared_operations:
      - "GET reads on claims, policies, productions"

  - name: ClearanceCounsel
    description: "E&O clearance counsel — manages clearance items"
    identity: opaque
    exclusive_operations:
      - "POST /productions/{prodId}/clearance-items"
      - "POST /productions/{prodId}/clearance-items/{id}/resolve"
    shared_operations:
      - "GET reads on clearance items and productions"

  - name: SuretyUnderwriter
    description: "Completion bond surety — underwrites, issues, claims, lapses bonds"
    identity: opaque
    exclusive_operations:
      - "POST /productions/{prodId}/completion-bond/underwrite"
      - "POST /productions/{prodId}/completion-bond/issue"
      - "POST /productions/{prodId}/completion-bond/claim"
      - "POST /productions/{prodId}/completion-bond/lapse"
    shared_operations:
      - "GET reads on bonds and productions"

  - name: ExternalAuditor
    description: "External payroll auditor — schedules and submits payroll audits"
    identity: opaque
    exclusive_operations:
      - "POST /productions/{prodId}/policies/{pid}/payroll-audits"
      - "POST /productions/{prodId}/policies/{pid}/payroll-audits/{id}/submit"
    shared_operations:
      - "GET reads on payroll audits and policies"

  - name: PlatformOperator
    description: "Internal platform operator — test-driving endpoints, full read access"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads on all resources"
