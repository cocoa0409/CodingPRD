            - { call: "POST /incident-reports", payload: { volunteer_id: "${v_id}", severity: "HIGH", description: "Argument with staff" }, as: CampusAdmin }
          trigger:
            - { call: "POST /placements/${pl_id}/confirm", payload: {}, as: CampusAdmin, captures: { err: $.data.error_id } }
          assert:
            - "confirm response error_id == ERR_VOLUNTEER_INVALID_STATE"
            - "Placement.${pl_id}.status remains REQUESTED"
            - "Opportunity.${opp_id}.committed_count == 0"

      - name: checkin_blocked_when_placement_cancelled
        grounds:
          - state_machines.Placement.CONFIRMED_to_CANCELLED
          - validations[priority=4]
          - errors[ERR_PLACEMENT_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair VisitCheckIn -> Placement (different pair from the
          Placement -> Volunteer instance): check-in citing a placement whose
          status has moved to CANCELLED is rejected with
          ERR_PLACEMENT_INVALID_STATE even inside the time window.
        test_recipe:
          setup:
            - "ACTIVE volunteer; placement CONFIRMED on opp window 2026-08-10T14:00:00Z..2026-08-10T17:00:00Z, then CANCELLED by the volunteer; clock at 2026-08-10T14:30:00Z (inside window)"
          setup_api_calls:
            - { call: "POST /training-modules", payload: { module_code: "ORIENT", title: "Volunteer Orientation", required_contact_types: ["SUPERVISED", "UNSUPERVISED"], validity_days: 365 }, as: DistrictCoordinator, captures: { mod_id: $.data.id } }
            - { call: "POST /volunteers", payload: { full_name: "Checkin Cher", email: "cher@x.com", contact_type: "SUPERVISED" }, as: DistrictCoordinator, captures: { v_id: $.data.id, v_ver: $.data.version } }
            - { call: "POST /background-checks", payload: { volunteer_id: "${v_id}", level: "BASIC", expected_volunteer_version: "${v_ver}" }, as: DistrictCoordinator, captures: { chk_id: $.data.id } }
            - { call: "POST /training-records", payload: { volunteer_id: "${v_id}", module_id: "${mod_id}", completed_at: "2026-07-01T00:00:00Z" }, as: DistrictCoordinator }
            - { call: "POST /background-checks/${chk_id}/adjudicate", payload: { findings: "NONE" }, as: DistrictCoordinator }
            - { call: "POST /campuses", payload: { name: "Lincoln Elementary", campus_code: "LNC", badge_prefix: "LNC" }, as: DistrictCoordinator, captures: { camp_id: $.data.id } }
            - { call: "POST /opportunities", payload: { campus_id: "${camp_id}", title: "Library Help", required_contact_type: "SUPERVISED", restricted_category: "NONE", capacity: 2, starts_at: "2026-08-10T14:00:00Z", ends_at: "2026-08-10T17:00:00Z" }, as: CampusAdmin, captures: { opp_id: $.data.id } }
            - { call: "POST /opportunities/${opp_id}/publish", payload: {}, as: CampusAdmin }
            - { call: "POST /placements", payload: { opportunity_id: "${opp_id}" }, as: Volunteer, as_user_id: "${v_id}", captures: { pl_id: $.data.id } }
            - { call: "POST /placements/${pl_id}/confirm", payload: {}, as: CampusAdmin }
            - { call: "POST /placements/${pl_id}/cancel", payload: {}, as: Volunteer, as_user_id: "${v_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T14:30:00Z" }, as: DistrictCoordinator }
          trigger:
            - { call: "POST /check-ins", payload: { campus_id: "${camp_id}", placement_id: "${pl_id}" }, as: Volunteer, as_user_id: "${v_id}", captures: { err: $.data.error_id } }
          assert:
            - "check-in response error_id == ERR_PLACEMENT_INVALID_STATE"
            - "no VisitCheckIn created (GET /check-ins?volunteer_id=${v_id} total_count == 0)"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: placement_overlap_half_open_adjacency
        grounds:
          - validations[priority=7]
          - errors[ERR_PLACEMENT_TIME_CONFLICT]
          - state_machines.Placement.REQUESTED_to_CONFIRMED
        distinguishing_aspect: |
          Half-open interval semantics on the volunteer's placement schedule:
          [14:00,17:00) and [17:00,19:00) touch but do not overlap, so the
          adjacent confirm succeeds, while [16:00,18:00) intersects and its
          confirm fails with ERR_PLACEMENT_TIME_CONFLICT.
        test_recipe:
          setup:
            - "ACTIVE volunteer; three OPEN opportunities on 2026-08-10 (A 14:00-17:00, B 17:00-19:00, C 16:00-18:00), each cap 2; volunteer holds REQUESTED placements on all three"
          setup_api_calls:
            - { call: "POST /training-modules", payload: { module_code: "ORIENT", title: "Volunteer Orientation", required_contact_types: ["SUPERVISED", "UNSUPERVISED"], validity_days: 365 }, as: DistrictCoordinator, captures: { mod_id: $.data.id } }
            - { call: "POST /volunteers", payload: { full_name: "Overlap Ollie", email: "ollie@x.com", contact_type: "SUPERVISED" }, as: DistrictCoordinator, captures: { v_id: $.data.id, v_ver: $.data.version } }
            - { call: "POST /background-checks", payload: { volunteer_id: "${v_id}", level: "BASIC", expected_volunteer_version: "${v_ver}" }, as: DistrictCoordinator, captures: { chk_id: $.data.id } }
            - { call: "POST /training-records", payload: { volunteer_id: "${v_id}", module_id: "${mod_id}", completed_at: "2026-07-01T00:00:00Z" }, as: DistrictCoordinator }
            - { call: "POST /background-checks/${chk_id}/adjudicate", payload: { findings: "NONE" }, as: DistrictCoordinator }
            - { call: "POST /campuses", payload: { name: "Lincoln Elementary", campus_code: "LNC", badge_prefix: "LNC" }, as: DistrictCoordinator, captures: { camp_id: $.data.id } }
            - { call: "POST /opportunities", payload: { campus_id: "${camp_id}", title: "Shift A", required_contact_type: "SUPERVISED", restricted_category: "NONE", capacity: 2, starts_at: "2026-08-10T14:00:00Z", ends_at: "2026-08-10T17:00:00Z" }, as: CampusAdmin, captures: { oa_id: $.data.id } }
            - { call: "POST /opportunities", payload: { campus_id: "${camp_id}", title: "Shift B", required_contact_type: "SUPERVISED", restricted_category: "NONE", capacity: 2, starts_at: "2026-08-10T17:00:00Z", ends_at: "2026-08-10T19:00:00Z" }, as: CampusAdmin, captures: { ob_id: $.data.id } }
            - { call: "POST /opportunities", payload: { campus_id: "${camp_id}", title: "Shift C", required_contact_type: "SUPERVISED", restricted_category: "NONE", capacity: 2, starts_at: "2026-08-10T16:00:00Z", ends_at: "2026-08-10T18:00:00Z" }, as: CampusAdmin, captures: { oc_id: $.data.id } }
            - { call: "POST /opportunities/${oa_id}/publish", payload: {}, as: CampusAdmin }
            - { call: "POST /opportunities/${ob_id}/publish", payload: {}, as: CampusAdmin }
            - { call: "POST /opportunities/${oc_id}/publish", payload: {}, as: CampusAdmin }
            - { call: "POST /placements", payload: { opportunity_id: "${oa_id}" }, as: Volunteer, as_user_id: "${v_id}", captures: { pa_id: $.data.id } }
            - { call: "POST /placements", payload: { opportunity_id: "${ob_id}" }, as: Volunteer, as_user_id: "${v_id}", captures: { pb_id: $.data.id } }
            - { call: "POST /placements", payload: { opportunity_id: "${oc_id}" }, as: Volunteer, as_user_id: "${v_id}", captures: { pc_id: $.data.id } }
            - { call: "POST /placements/${pa_id}/confirm", payload: {}, as: CampusAdmin }
          trigger:
            - { call: "POST /placements/${pb_id}/confirm", payload: {}, as: CampusAdmin, captures: { pb_status: $.data.status } }
            - { call: "POST /placements/${pc_id}/confirm", payload: {}, as: CampusAdmin, captures: { err: $.data.error_id } }
          assert:
            - "adjacent confirm succeeds: Placement.${pb_id}.status == CONFIRMED (end == start is not an overlap)"
            - "overlapping confirm fails with error_id == ERR_PLACEMENT_TIME_CONFLICT"
            - "Placement.${pc_id}.status remains REQUESTED"

      - name: checkin_buffer_window_and_singleton
        grounds:
          - validations[priority=7]
          - errors[ERR_OUTSIDE_CHECKIN_WINDOW]
          - errors[ERR_OPEN_CHECKIN_EXISTS]
        distinguishing_aspect: |
          Different interval semantics from the placement rule: a closed,
          buffered window [starts_at - 30min, ends_at] on the check-in resource
          — 13:29 is rejected, 13:30 exactly is accepted (inclusive bound) —
          plus a singleton-open-session rule rejecting any second check-in
          while one is OPEN.
        test_recipe:
          setup:
            - "ACTIVE volunteer with CONFIRMED placement on opp window 2026-08-10T14:00:00Z..2026-08-10T17:00:00Z at campus LNC"
          setup_api_calls:
            - { call: "POST /training-modules", payload: { module_code: "ORIENT", title: "Volunteer Orientation", required_contact_types: ["SUPERVISED", "UNSUPERVISED"], validity_days: 365 }, as: DistrictCoordinator, captures: { mod_id: $.data.id } }
            - { call: "POST /volunteers", payload: { full_name: "Buffer Beth", email: "beth@x.com", contact_type: "SUPERVISED" }, as: DistrictCoordinator, captures: { v_id: $.data.id, v_ver: $.data.version } }
            - { call: "POST /background-checks", payload: { volunteer_id: "${v_id}", level: "BASIC", expected_volunteer_version: "${v_ver}" }, as: DistrictCoordinator, captures: { chk_id: $.data.id } }
            - { call: "POST /training-records", payload: { volunteer_id: "${v_id}", module_id: "${mod_id}", completed_at: "2026-07-01T00:00:00Z" }, as: DistrictCoordinator }
            - { call: "POST /background-checks/${chk_id}/adjudicate", payload: { findings: "NONE" }, as: DistrictCoordinator }
            - { call: "POST /campuses", payload: { name: "Lincoln Elementary", campus_code: "LNC", badge_prefix: "LNC" }, as: DistrictCoordinator, captures: { camp_id: $.data.id } }
            - { call: "POST /opportunities", payload: { campus_id: "${camp_id}", title: "Library Help", required_contact_type: "SUPERVISED", restricted_category: "NONE", capacity: 2, starts_at: "2026-08-10T14:00:00Z", ends_at: "2026-08-10T17:00:00Z" }, as: CampusAdmin, captures: { opp_id: $.data.id } }
            - { call: "POST /opportunities/${opp_id}/publish", payload: {}, as: CampusAdmin }
            - { call: "POST /placements", payload: { opportunity_id: "${opp_id}" }, as: Volunteer, as_user_id: "${v_id}", captures: { pl_id: $.data.id } }
            - { call: "POST /placements/${pl_id}/confirm", payload: {}, as: CampusAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T13:29:00Z" }, as: DistrictCoordinator }
          trigger:
            - { call: "POST /check-ins", payload: { campus_id: "${camp_id}", placement_id: "${pl_id}" }, as: Volunteer, as_user_id: "${v_id}", captures: { early_err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T13:30:00Z" }, as: DistrictCoordinator }
            - { call: "POST /check-ins", payload: { campus_id: "${camp_id}", placement_id: "${pl_id}" }, as: Volunteer, as_user_id: "${v_id}", captures: { ci_id: $.data.id, ci_badge: $.data.badge_code } }
            - { call: "POST /check-ins", payload: { campus_id: "${camp_id}" }, as: Volunteer, as_user_id: "${v_id}", captures: { dup_err: $.data.error_id } }
          assert:
            - "13:29 check-in fails with error_id == ERR_OUTSIDE_CHECKIN_WINDOW"
            - "13:30 check-in succeeds (inclusive lower bound): VisitCheckIn.${ci_id}.status == OPEN and badge_code == LNC-0001"
            - "second check-in while one is OPEN fails with error_id == ERR_OPEN_CHECKIN_EXISTS"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: seat_conservation_confirm_then_cancel
        grounds:
          - calculations.opportunity_fill
          - state_machines.Placement.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: opportunity seat occupancy. The forward action
          (confirm, committed_count +1) paired with its compensating action
          (cancel, committed_count -1) leaves committed_count ==
          |{placements with status CONFIRMED}| with zero drift.
        test_recipe:
          setup:
            - "OPEN opp cap 2 window 2026-08-10T14:00:00Z..2026-08-10T17:00:00Z; volunteers V1, V2 ACTIVE; p1 (V1) and p2 (V2) both CONFIRMED => committed_count 2"
          setup_api_calls:
            - { call: "POST /training-modules", payload: { module_code: "ORIENT", title: "Volunteer Orientation", required_contact_types: ["SUPERVISED", "UNSUPERVISED"], validity_days: 365 }, as: DistrictCoordinator, captures: { mod_id: $.data.id } }
            - { call: "POST /campuses", payload: { name: "Lincoln Elementary", campus_code: "LNC", badge_prefix: "LNC" }, as: DistrictCoordinator, captures: { camp_id: $.data.id } }
            - { call: "POST /opportunities", payload: { campus_id: "${camp_id}", title: "Two Seats", required_contact_type: "SUPERVISED", restricted_category: "NONE", capacity: 2, starts_at: "2026-08-10T14:00:00Z", ends_at: "2026-08-10T17:00:00Z" }, as: CampusAdmin, captures: { opp_id: $.data.id } }
            - { call: "POST /opportunities/${opp_id}/publish", payload: {}, as: CampusAdmin }
            - { call: "POST /volunteers", payload: { full_name: "Seat One", email: "one@x.com", contact_type: "SUPERVISED" }, as: DistrictCoordinator, captures: { v1_id: $.data.id, v1_ver: $.data.version } }
            - { call: "POST /background-checks", payload: { volunteer_id: "${v1_id}", level: "BASIC", expected_volunteer_version: "${v1_ver}" }, as: DistrictCoordinator, captures: { ch1_id: $.data.id } }
            - { call: "POST /training-records", payload: { volunteer_id: "${v1_id}", module_id: "${mod_id}", completed_at: "2026-07-01T00:00:00Z" }, as: DistrictCoordinator }
            - { call: "POST /background-checks/${ch1_id}/adjudicate", payload: { findings: "NONE" }, as: DistrictCoordinator }
            - { call: "POST /volunteers", payload: { full_name: "Seat Two", email: "two@x.com", contact_type: "SUPERVISED" }, as: DistrictCoordinator, captures: { v2_id: $.data.id, v2_ver: $.data.version } }
            - { call: "POST /background-checks", payload: { volunteer_id: "${v2_id}", level: "BASIC", expected_volunteer_version: "${v2_ver}" }, as: DistrictCoordinator, captures: { ch2_id: $.data.id } }
            - { call: "POST /training-records", payload: { volunteer_id: "${v2_id}", module_id: "${mod_id}", completed_at: "2026-07-01T00:00:00Z" }, as: DistrictCoordinator }
            - { call: "POST /background-checks/${ch2_id}/adjudicate", payload: { findings: "NONE" }, as: DistrictCoordinator }
            - { call: "POST /placements", payload: { opportunity_id: "${opp_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { p1_id: $.data.id } }
            - { call: "POST /placements/${p1_id}/confirm", payload: {}, as: CampusAdmin }
            - { call: "POST /placements", payload: { opportunity_id: "${opp_id}" }, as: Volunteer, as_user_id: "${v2_id}", captures: { p2_id: $.data.id } }
            - { call: "POST /placements/${p2_id}/confirm", payload: {}, as: CampusAdmin }
          trigger:
            - { call: "POST /placements/${p1_id}/cancel", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "GET /opportunities/${opp_id}", payload: {}, as: CampusAdmin }
            - { call: "GET /placements", payload: { opportunity_id: "${opp_id}", status: "CONFIRMED" }, as: CampusAdmin }
          assert:
            - "Opportunity.${opp_id}.committed_count == 1 (2 confirms + 1 cancel nets to 1)"
            - "Opportunity.${opp_id}.projected_count == 1"
            - "count of placements with status == CONFIRMED for ${opp_id} == 1 (invariant: committed_count equals the CONFIRMED set cardinality)"
            - "Placement.${p1_id}.cancel_reason == VOLUNTEER_WITHDRAW"

      - name: hours_points_conservation_verify_then_revoke
        grounds:
          - calculations.volunteer_service_hours
          - calculations.recognition_points
          - state_machines.HourEntry.VERIFIED_to_REVOKED
        distinguishing_aspect: |
          Conserved quantity: volunteer verified-hour and point sums (different
          conserved quantity from seat occupancy). verify(e) followed by
          revoke(e) nets both totals to the pre-verify values; the revoked
          entry keeps its historical points field but leaves both aggregates.
        test_recipe:
          setup:
            - "ACTIVE volunteer with CONFIRMED placement on opp window 2026-08-03T08:00:00Z..2026-08-07T20:00:00Z"
            - "e1 4.0 TUTORING verified (points 6.0); e2 3.0 STANDARD verified (points 3.0) => totals 7.0 hours / 9.0 points"
          setup_api_calls:
            - { call: "POST /training-modules", payload: { module_code: "ORIENT", title: "Volunteer Orientation", required_contact_types: ["SUPERVISED", "UNSUPERVISED"], validity_days: 365 }, as: DistrictCoordinator, captures: { mod_id: $.data.id } }
            - { call: "POST /volunteers", payload: { full_name: "Revoke Rena", email: "rena@x.com", contact_type: "SUPERVISED" }, as: DistrictCoordinator, captures: { v_id: $.data.id, v_ver: $.data.version } }
            - { call: "POST /background-checks", payload: { volunteer_id: "${v_id}", level: "BASIC", expected_volunteer_version: "${v_ver}" }, as: DistrictCoordinator, captures: { chk_id: $.data.id } }
            - { call: "POST /training-records", payload: { volunteer_id: "${v_id}", module_id: "${mod_id}", completed_at: "2026-07-01T00:00:00Z" }, as: DistrictCoordinator }
            - { call: "POST /background-checks/${chk_id}/adjudicate", payload: { findings: "NONE" }, as: DistrictCoordinator }
            - { call: "POST /campuses", payload: { name: "Lincoln Elementary", campus_code: "LNC", badge_prefix: "LNC" }, as: DistrictCoordinator, captures: { camp_id: $.data.id } }
            - { call: "POST /opportunities", payload: { campus_id: "${camp_id}", title: "Week Helper", required_contact_type: "SUPERVISED", restricted_category: "NONE", capacity: 2, starts_at: "2026-08-03T08:00:00Z", ends_at: "2026-08-07T20:00:00Z" }, as: CampusAdmin, captures: { opp_id: $.data.id } }
            - { call: "POST /opportunities/${opp_id}/publish", payload: {}, as: CampusAdmin }
            - { call: "POST /placements", payload: { opportunity_id: "${opp_id}" }, as: Volunteer, as_user_id: "${v_id}", captures: { pl_id: $.data.id } }
            - { call: "POST /placements/${pl_id}/confirm", payload: {}, as: CampusAdmin }
            - { call: "POST /hour-entries", payload: { placement_id: "${pl_id}", worked_date: "2026-08-03", hours: 4.0, activity_category: "TUTORING" }, as: Volunteer, as_user_id: "${v_id}", captures: { he1_id: $.data.id } }
            - { call: "POST /hour-entries/${he1_id}/verify", payload: {}, as: CampusAdmin }
            - { call: "POST /hour-entries", payload: { placement_id: "${pl_id}", worked_date: "2026-08-04", hours: 3.0, activity_category: "STANDARD" }, as: Volunteer, as_user_id: "${v_id}", captures: { he2_id: $.data.id } }
            - { call: "POST /hour-entries/${he2_id}/verify", payload: {}, as: CampusAdmin }
          trigger:
            - { call: "POST /hour-entries/${he1_id}/revoke", payload: {}, as: DistrictCoordinator }
            - { call: "GET /volunteers/${v_id}", payload: {}, as: DistrictCoordinator }
            - { call: "GET /hour-entries/${he1_id}", payload: {}, as: DistrictCoordinator }
          assert:
            - "Volunteer.${v_id}.total_verified_hours == 3.0 (verify 4.0 then revoke 4.0 nets to the remaining 3.0)"
            - "Volunteer.${v_id}.total_provisional_hours == 3.0"
            - "Volunteer.${v_id}.recognition_points == 3.0"
            - "Volunteer.${v_id}.recognition_tier == NONE"
            - "HourEntry.${he1_id}.status == REVOKED and HourEntry.${he1_id}.points == 6.0 (historical, excluded from aggregates)"
