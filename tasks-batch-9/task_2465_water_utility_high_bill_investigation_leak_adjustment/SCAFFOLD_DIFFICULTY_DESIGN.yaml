            - "Ledger: exactly three METER_TEST_DEPOSIT entries of +3000 and exactly two METER_TEST_DEPOSIT_REFUND entries of -3000 exist for ${acct_c_id}"
            - "Terminal lockdown: the fourth call, a second record-bench-result on ${req_p_id}, returns 409 with error_id ERR_INVALID_STATE_TRANSITION and MeterTestRequest.${req_p_id}.accuracy_pct is still 100.00"
