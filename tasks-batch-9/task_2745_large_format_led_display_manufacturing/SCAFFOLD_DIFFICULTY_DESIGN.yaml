      - name: empty_spare_pool_returns_no_eligible_spare_module
        grounds:
          - calculations.spare_module_selector
          - errors.ERR_NO_ELIGIBLE_SPARE_MODULE
          - endpoints.POST_service_contracts_spare_reservations
          - entities.ServiceContract.fields.spare_reserved_count
        distinguishing_aspect: |
          The empty-set edge of a selector, on a third endpoint
          (POST /service-contracts/{id}/spare-reservations) and a third metric
          (the candidate pool size, not a numeric threshold). With module_id
          omitted the server must search for an unreserved CALIBRATED module of
          the project's model; the only module in the plant is INSTALLED, so the
          candidate set is empty and the call must fail rather than pick an
          installed module or return a null reservation. The immediately
          following retry, after exactly one candidate appears, must succeed with
          the same unchanged OCC version.
        test_recipe:
          setup:
            - "The canonical FP10-IN 1x1 RETAIL project is COMMISSIONED; its only module M-1 is INSTALLED."
            - "A GOLD contract is ACTIVE with spare_required_count 1 and spare_reserved_count 0."
            - "No CALIBRATED, unreserved module exists anywhere."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
