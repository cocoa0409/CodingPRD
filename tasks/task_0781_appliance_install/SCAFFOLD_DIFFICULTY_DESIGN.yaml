              as: PlatformAdmin
              captures: { task_id: $.data.id }
            - call: "POST /work-orders"
              payload: { retailer_id: "${ret_id}", customer_id: "${cust_id}", install_task_id: "${task_id}", service_zone_id: "${zone_id}", product_sku: "S", product_category: "TV_MOUNT" }
              as: Retailer
              as_user_id: "${ret_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T10:00:00Z" }
              as: Retailer
              as_user_id: "${ret_id}"
              captures: { wo_v: $.data.version }
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: { expected_work_order_version: "${wo_v}" }
              as: PlatformAdmin
            - call: "GET /assignments?work_order_id=${wo_id}"
              payload: {}
              as: PlatformAdmin
              captures: { asg_id: "$.data[0].id" }
            - call: "POST /assignments/${asg_id}/accept"
              payload: {}
              as: Pro
              as_user_id: "${pro_id}"
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: Pro
              as_user_id: "${pro_id}"
            - call: "POST /work-orders/${wo_id}/parts"
              payload: { name: "Anchor", unit_cost_cents: 251, quantity: 1, markup_bps: 4000 }
              as: Pro
              as_user_id: "${pro_id}"
              captures: { part1_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/parts"
              payload: { name: "Anchor", unit_cost_cents: 251, quantity: 1, markup_bps: 4000 }
              as: Pro
              as_user_id: "${pro_id}"
            - call: "POST /work-orders/${wo_id}/parts"
              payload: { name: "Anchor", unit_cost_cents: 251, quantity: 1, markup_bps: 4000 }
              as: Pro
              as_user_id: "${pro_id}"
          trigger:
            - call: "POST /work-orders/${wo_id}/complete"
              payload: {}
              as: Pro
              as_user_id: "${pro_id}"
          assert:
            - "Part.${part1_id}.line_billed_cents == 351"
            - "WorkOrder.${wo_id}.final_price_cents == 11053"
            - "Sum-then-round (round(3*351.4)=1054) would give final 11054; the pinned per-line order gives 11053"

  - rule_id: non_linear_state_machine
    instances:
      - name: workorder_warranty_redo_cycle_reenters_dispatched
        grounds:
          - state_machines.WorkOrder.COMPLETED_to_REDO_REQUESTED
