              as_user_id: "u_designer_1"
              captures: { stale_offer_v: $.data.version }
            - call: "POST /offers/${offer_id}/availability"
              payload: { to_status: "SUSPENDED", reason: "Copy fix" }
              as: LiveOpsCommander
            - call: "POST /offers/${offer_id}/availability"
              payload: { to_status: "LIVE", reason: "Copy fixed" }
              as: LiveOpsCommander
          trigger:
            - call: "POST /purchases"
              payload: { player_id: "${pv_id}", offer_id: "${offer_id}", expected_offer_version: "${stale_offer_v}" }
              as: Player
              as_user_id: "${pv_id}"
              captures: { err: $.data.error_id }
            - call: "GET /offers/${offer_id}"
              payload: {}
              as: Player
              as_user_id: "${pv_id}"
              captures: { fresh_offer_v: $.data.version }
            - call: "POST /purchases"
              payload: { player_id: "${pv_id}", offer_id: "${offer_id}", expected_offer_version: "${fresh_offer_v}" }
              as: Player
              as_user_id: "${pv_id}"
              captures: { pur_id: $.data.id }
          assert:
            - "stale purchase response status == 412"
            - "stale purchase response data.error_id == ERR_STALE_OFFER_VERSION"
            - "GET /purchases?offer_id=${offer_id} returns total_count 0 immediately after the stale attempt"
            - "fresh purchase response status == 201"
            - "Purchase.${pur_id}.status == PENDING"
            - "Offer.${offer_id}.pending_purchase_count == 1"
            - "Offer.${offer_id}.version == ${fresh_offer_v} + 1"
            - "Season.${season_id}.pending_revenue_minor == 300"

      - name: corner_layer_occ_balance_change_advance_stale_season_version
        claim_type: Stale expected_<parent>_version → rule's error_id (412); correct version → success; version increments on every write
        grounds:
          - concurrency_rules.balance-change-advance-stale-season
          - errors[ERR_STALE_SEASON_VERSION]
          - endpoints["POST /balance-changes/{change_id}/advance"]
        distinguishing_aspect: |
          Advancing a tuning change to SHADOW with a season version captured before an offer
          publish returns ERR_STALE_SEASON_VERSION (412) and leaves the change in DRAFT; the same
          advance with the refreshed version moves it to SHADOW.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; season S7 LIVE."
            - "A DRAFT BalanceChange authored by u_designer_1 exists; the season version is captured."
            - "An APPROVED offer BC_PACK is then published, bumping the season version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /seasons"
              payload: { code: "S7", title: "Season 7 Tidebreak", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-10-30T00:00:00Z", planned_episode_count: 6, target_xp_total: 9000, pass_price_minor: 1000 }
              as: ContentProducer
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/status"
              payload: { to_status: "LIVE" }
              as: ContentProducer
            - call: "POST /balance-changes"
              payload: { season_id: "${season_id}", target_kind: "SINK_RATE", delta_bp: 500, rationale: "Crafting sink up" }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
              captures: { change_id: $.data.id }
            - call: "POST /offers"
              payload: { season_id: "${season_id}", offer_type: "BUNDLE", sku: "BC_PACK", price_tier: "T1", list_price_minor: 900, line_items: [{ sku: "BC_COINS", base_price_minor: 900, declared_value_minor: 1200, granted_currency_code: "SOFT_COIN", granted_amount_minor: 1200 }], window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-20T00:00:00Z" }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
              captures: { offer_id: $.data.id }
            - call: "POST /offers/${offer_id}/submit"
              payload: {}
              as: EconomyDesigner
              as_user_id: "u_designer_1"
            - call: "POST /offers/${offer_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "u_compliance_1"
            - call: "GET /seasons/${season_id}"
              payload: {}
              as: LiveOpsCommander
              captures: { stale_v: $.data.version }
            - call: "POST /offers/${offer_id}/publish"
              payload: { expected_season_version: "${stale_v}" }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
          trigger:
            - call: "POST /balance-changes/${change_id}/advance"
              payload: { to_stage: "SHADOW", expected_season_version: "${stale_v}" }
              as: LiveOpsCommander
              captures: { err: $.data.error_id }
            - call: "GET /seasons/${season_id}"
              payload: {}
              as: LiveOpsCommander
              captures: { fresh_v: $.data.version }
            - call: "POST /balance-changes/${change_id}/advance"
              payload: { to_stage: "SHADOW", expected_season_version: "${fresh_v}" }
              as: LiveOpsCommander
          assert:
            - "stale advance response status == 412"
            - "stale advance response data.error_id == ERR_STALE_SEASON_VERSION"
            - "BalanceChange.${change_id}.stage == DRAFT immediately after the stale attempt"
            - "fresh advance response status == 200"
            - "BalanceChange.${change_id}.stage == SHADOW"
            - "Season.${season_id}.effective_sink_rate_bp == 10000"

      - name: corner_layer_version_increments_on_every_write
        claim_type: Stale expected_<parent>_version → rule's error_id (412); correct version → success; version increments on every write
        grounds:
          - entities.Season.fields.version
          - entities.Offer.fields.version
          - entities.EconomyLedgerEntry
        distinguishing_aspect: |
          Every mutation of a versioned row advances its version by exactly one: the season moves
          1 -> 2 on going LIVE and 2 -> 3 on the offer publish, the offer moves 1 -> 2 on submit,
          2 -> 3 on review and 3 -> 4 on publish, while the append-only ledger rows expose no
          version field at all.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "A fresh season S7 and a fresh offer VER_PACK are walked through their approval chain, and one ledger row is appended."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LiveOpsCommander
          trigger:
            - call: "POST /seasons"
              payload: { code: "S7", title: "Season 7 Tidebreak", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-10-30T00:00:00Z", planned_episode_count: 6, target_xp_total: 9000, pass_price_minor: 1000 }
              as: ContentProducer
              captures: { season_id: $.data.id, s_v1: $.data.version }
            - call: "POST /seasons/${season_id}/status"
              payload: { to_status: "LIVE" }
              as: ContentProducer
              captures: { s_v2: $.data.version }
            - call: "POST /offers"
              payload: { season_id: "${season_id}", offer_type: "BUNDLE", sku: "VER_PACK", price_tier: "T1", list_price_minor: 900, line_items: [{ sku: "VER_COINS", base_price_minor: 900, declared_value_minor: 1200, granted_currency_code: "SOFT_COIN", granted_amount_minor: 1200 }], window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-20T00:00:00Z" }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
              captures: { offer_id: $.data.id, o_v1: $.data.version }
            - call: "POST /offers/${offer_id}/submit"
              payload: {}
              as: EconomyDesigner
              as_user_id: "u_designer_1"
              captures: { o_v2: $.data.version }
            - call: "POST /offers/${offer_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "u_compliance_1"
              captures: { o_v3: $.data.version }
            - call: "POST /offers/${offer_id}/publish"
              payload: { expected_season_version: "${s_v2}" }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
              captures: { o_v4: $.data.version }
            - call: "POST /players"
              payload: { handle: "tide_pver", region_code: "NA", active_season_id: "${season_id}" }
              as: LiveOpsCommander
              captures: { pver_id: $.data.id }
            - call: "POST /players/${pver_id}/currency-accounts"
              payload: { currency_code: "SOFT_COIN" }
              as: LiveOpsCommander
              captures: { pver_soft_id: $.data.id }
            - call: "POST /currency-accounts/${pver_soft_id}/adjustments"
              payload: { direction: "FAUCET", amount_minor: 500, source_kind: "COMPENSATION" }
              as: LiveOpsCommander
              captures: { entry_id: $.data.id }
          assert:
            - "Season version sequence is 1 then 2 then 3 across create, go-live and the offer publish"
            - "Offer version sequence is 1 then 2 then 3 then 4 across create, submit, review and publish"
            - "the ledger entry response body contains no version field"
            - "EconomyLedgerEntry.${entry_id}.direction == FAUCET"
            - "CurrencyAccount.${pver_soft_id}.balance_minor == 500"

      - name: corner_layer_cascading_side_effects_chain_and_ordering
        claim_type: N-level chain verified end-to-end; ordering sensitivity tested; partial failure handled
        grounds:
          - state_machines.MonitoringRun.OPEN_to_COMPUTED
          - state_machines.Episode.SCHEDULED_to_LIVE
        excluded_because:
          difficulty_instance: "transitive_cascade / monitoring_compute_suspends_lootbox_and_denies_pending_purchase"
          rationale: |
            The two transitive_cascade instances already walk both multi-level chains end to end
            (episode release -> ledger -> account -> season ratio, and monitoring compute ->
            season health -> offer suspension -> purchase denial -> pending revenue) and assert
            the terminal counters, while the bulk-action endpoint instance covers the skip path for
            ineligible members of a fan-out.

      - name: corner_layer_dual_variant_delta_on_switch
        claim_type: Both variants produce expected results; delta on switch is correct
        grounds:
          - calculations.season_sink_faucet_ratio_bp
          - calculations.player_pacing_bp
        excluded_because:
          difficulty_instance: "dual_variant_calc / player_pacing_realized_vs_projected"
          rationale: |
            Both dual_variant_calc instances query the two variants back to back over one fixture
            and pin each variant's number and band, which is exactly the delta-on-switch claim for
            this layer.

  # ===========================================================================
  - section: consistency model
    instances:
      - name: corner_consistency_immediate_cascade_visible_in_same_response
        claim_type: All changes visible in same request's response
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Episode.SCHEDULED_to_LIVE
          - endpoints["POST /episodes/{episode_id}/release"]
          - endpoints["GET /seasons/{season_id}/economy-summary"]
        distinguishing_aspect: |
          The release response body itself already carries the fan-out result
          (grant_batch_size 2) and a read issued immediately afterwards shows the season's
          gross_faucet_minor at 2800 and lifetime_ratio_bp at 1429 with no settling delay.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; season S7 LIVE."
            - "Players pi1 and pi2 are active in S7 and each hold a SOFT_COIN account."
            - "Episode 1 (soft_currency_grant_minor 1200) is SCHEDULED for 2026-08-02 and the clock is moved there."
            - "One 400-minor SINK is applied to pi1 before the release so both ledger directions exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /seasons"
              payload: { code: "S7", title: "Season 7 Tidebreak", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-10-30T00:00:00Z", planned_episode_count: 6, target_xp_total: 9000, pass_price_minor: 1000 }
              as: ContentProducer
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/status"
              payload: { to_status: "LIVE" }
              as: ContentProducer
            - call: "POST /players"
              payload: { handle: "tide_pi1", region_code: "NA", active_season_id: "${season_id}" }
              as: LiveOpsCommander
              captures: { pi1_id: $.data.id }
            - call: "POST /players/${pi1_id}/currency-accounts"
              payload: { currency_code: "SOFT_COIN" }
              as: LiveOpsCommander
              captures: { pi1_soft_id: $.data.id }
            - call: "POST /players"
              payload: { handle: "tide_pi2", region_code: "EU", active_season_id: "${season_id}" }
              as: LiveOpsCommander
              captures: { pi2_id: $.data.id }
            - call: "POST /players/${pi2_id}/currency-accounts"
              payload: { currency_code: "SOFT_COIN" }
              as: LiveOpsCommander
              captures: { pi2_soft_id: $.data.id }
            - call: "POST /currency-accounts/${pi1_soft_id}/adjustments"
              payload: { direction: "FAUCET", amount_minor: 400, source_kind: "COMPENSATION" }
              as: LiveOpsCommander
            - call: "POST /currency-accounts/${pi1_soft_id}/adjustments"
              payload: { direction: "SINK", amount_minor: 400, source_kind: "CRAFTING" }
              as: LiveOpsCommander
            - call: "POST /episodes"
              payload: { season_id: "${season_id}", sequence_no: 1, title: "E1 Tidefall", planned_release_at: "2026-08-02T00:00:00Z", xp_grant: 600, soft_currency_grant_minor: 1200 }
              as: ContentProducer
              captures: { ep1_id: $.data.id }
            - call: "POST /episodes/${ep1_id}/schedule"
              payload: {}
              as: ContentProducer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: LiveOpsCommander
          trigger:
            - call: "POST /episodes/${ep1_id}/release"
              payload: {}
              as: ContentProducer
            - call: "GET /seasons/${season_id}/economy-summary"
              payload: { variant: "LIFETIME_CUMULATIVE" }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
            - call: "GET /seasons/${season_id}"
              payload: {}
              as: LiveOpsCommander
          assert:
            - "release response data.status == LIVE"
            - "release response data.grant_batch_size == 2"
            - "release response data.actual_release_at == 2026-08-02T00:00:00Z"
            - "economy-summary response data.gross_faucet_minor == 2800"
            - "economy-summary response data.gross_sink_minor == 400"
            - "economy-summary response data.sink_faucet_ratio_bp == 1429"
            - "economy-summary response data.health_band == INFLATED"
            - "season read response data.gross_faucet_minor == 2800"
            - "season read response data.lifetime_ratio_bp == 1429"
            - "season read response data.released_episode_count == 1"
            - "CurrencyAccount.${pi1_soft_id}.balance_minor == 1200"
            - "CurrencyAccount.${pi2_soft_id}.balance_minor == 1200"
