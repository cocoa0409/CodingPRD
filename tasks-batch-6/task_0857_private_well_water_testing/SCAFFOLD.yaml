# =============================================================================
# PRD Benchmark Scaffold — Private Well Permit & Water Testing (Expert)
# =============================================================================

scenario: |
  857. Private Well Permit & Water Testing: well-construction permit & driller
  log, setback & aquifer, water-sample (bacteria/nitrate/lead) submission,
  result & advisory, abandonment/decommission permit, real-estate test
  requirement, contamination case, registry

domain_name: private-well-water-testing
api_prefix: "/"

# Difficulty: Expert. Compliance/audit primary; temporal-windowing secondary.
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency          # OCC on RealEstateTestRequirement.version (sample-supersede race)
    - cascading_side_effects          # result -> sample -> case -> well/advisory (depth-3)
    - dual_variant_calculation        # nitrate provisional vs confirmed; permit fee estimate vs final
    - derived_field_reconciliation    # Well.active_advisory_count, Well.potability_status, Applicant.net_fees_paid_cents

  entity_topology: flat               # peer entities linked by foreign keys; no nesting in URL paths
  state_machine_shape: parallel       # Well carries registry_status x potability_status independently
  relationship_patterns:
    - one_to_many                     # Well 1:N ConstructionPermit / WaterSample / Advisory / ContaminationCase
    - cross_aggregate                 # SampleResult mutates ContaminationCase mutates Well+Advisory

  role_model: segregation_of_duties   # a ContaminationCase must be closed by a different officer than opened it
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Applicant
    parent: null
    common_fields: true               # id, created_at, updated_at, version
    fields:
      - { name: full_name, type: string, source: input, description: "Well owner / applicant legal name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: mailing_state, type: string, source: input, description: "Two-letter USPS state code" }
      - { name: net_fees_paid_cents, type: integer, source: computed, default: 0, description: "= sum over this applicant's ConstructionPermits of (fee_charged_cents if fee_paid else 0) - fee_refunded_cents. Conserved money quantity for compensating-invariant checks." }

  - name: Driller
    parent: null
    common_fields: true
    fields:
      - { name: license_number, type: string, source: input, description: "State driller license number" }
      - { name: license_state, type: string, source: input, description: "Two-letter USPS state that issued the license" }
      - { name: license_expires_on, type: datetime, source: input, description: "ISO 8601 UTC instant the license lapses; a log filed at/after this instant fails ERR_DRILLER_LICENSE_INVALID" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED — SUSPENDED drillers cannot file logs or complete abandonments", constraints: "ACTIVE, SUSPENDED" }

  - name: Aquifer
    parent: null
    common_fields: false              # configuration entity: id + created_at only, immutable
    fields:
      - { name: name, type: string, source: input, description: "Aquifer / groundwater basin name" }
      - { name: sensitivity, type: enum, source: input, description: "HIGH | MODERATE | LOW — drives permit-fee surcharge", constraints: "HIGH, MODERATE, LOW" }
      - { name: min_setback_septic_ft, type: integer, source: input, description: "Minimum required distance (ft) from a well to the nearest septic system" }
      - { name: min_setback_property_line_ft, type: integer, source: input, description: "Minimum required distance (ft) from a well to the nearest property line" }
      - { name: min_well_depth_ft, type: integer, source: input, description: "Minimum permitted well depth (ft) for this aquifer" }

  - name: Well
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id; owner of the well" }
      - { name: aquifer_id, type: string, source: input, description: "FK -> Aquifer.id; groundwater basin the well draws from" }
      - { name: latitude, type: number, source: input, description: "Decimal-degrees latitude of the wellhead" }
      - { name: longitude, type: number, source: input, description: "Decimal-degrees longitude of the wellhead" }
      - { name: parcel_apn, type: string, source: input, description: "Assessor parcel number of the hosting parcel" }
      - { name: intended_use, type: enum, source: input, description: "DOMESTIC | IRRIGATION | LIVESTOCK — drives permit-fee use multiplier", constraints: "DOMESTIC, IRRIGATION, LIVESTOCK" }
      - { name: registry_status, type: enum, source: system, default: "PROPOSED", description: "Lifecycle dimension: PROPOSED | PERMITTED | ACTIVE | INACTIVE | DECOMMISSIONED. Evolves independently of potability_status.", constraints: "PROPOSED, PERMITTED, ACTIVE, INACTIVE, DECOMMISSIONED" }
      - { name: potability_status, type: enum, source: system, default: "UNKNOWN", description: "Health dimension: UNKNOWN | POTABLE | ADVISORY | UNSAFE. Recomputed from the latest RESULTED sample's confirmed level and open contamination cases. Evolves independently of registry_status.", constraints: "UNKNOWN, POTABLE, ADVISORY, UNSAFE" }
      - { name: depth_ft, type: integer, source: computed, default: null, description: "Total drilled depth (ft); set from the DrillerLog.total_depth_ft when the log is filed" }
      - { name: active_advisory_count, type: integer, source: computed, default: 0, description: "= count of Advisory rows for this well with status == ACTIVE. Conserved count quantity for compensating-invariant checks." }

  - name: ConstructionPermit
    parent: null
    common_fields: true
    fields:
      - { name: well_id, type: string, source: input, description: "FK -> Well.id; the well to be constructed" }
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id; must equal Well.applicant_id" }
      - { name: driller_id, type: string, source: input, description: "FK -> Driller.id; the driller assigned to the job" }
      - { name: proposed_depth_ft, type: integer, source: input, description: "Applicant's proposed total depth (ft); drives the fee ESTIMATE" }
      - { name: setback_septic_ft, type: integer, source: input, description: "Measured distance (ft) from wellhead to nearest septic system" }
      - { name: setback_property_line_ft, type: integer, source: input, description: "Measured distance (ft) from wellhead to nearest property line" }
      - { name: scheduled_start, type: datetime, source: input, description: "ISO 8601 UTC start of the driller's on-site work window" }
      - { name: scheduled_end, type: datetime, source: input, description: "ISO 8601 UTC end of the driller's on-site work window; must be strictly after scheduled_start" }
      - { name: expedite, type: boolean, source: input, default: false, description: "Expedited-review flag; adds EXPEDITE_FEE_CENTS to the fee" }
      - { name: fee_estimate_cents, type: integer, source: computed, description: "Fee computed from proposed_depth_ft at submission (permit_fee variant=ESTIMATE)" }
      - { name: fee_final_cents, type: integer, source: computed, default: null, description: "Fee recomputed from DrillerLog.total_depth_ft at completion (permit_fee variant=FINAL)" }
      - { name: fee_charged_cents, type: integer, source: computed, default: 0, description: "Amount currently charged to the applicant: fee_estimate_cents at pay, replaced by fee_final_cents at completion" }
      - { name: fee_refunded_cents, type: integer, source: computed, default: 0, description: "Amount refunded to the applicant on DENY (= fee_charged_cents at time of denial if fee_paid)" }
      - { name: fee_paid, type: boolean, source: system, default: false, description: "True once the applicant pays; approval requires this" }
      - { name: issued_on, type: datetime, source: system, default: null, description: "ISO 8601 UTC instant the permit was ISSUED" }
      - { name: expires_on, type: datetime, source: system, default: null, description: "= issued_on + PERMIT_VALIDITY_DAYS (=365); ISSUED permits past this on an expiry sweep become EXPIRED" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | APPROVED | ISSUED | COMPLETED | DENIED | EXPIRED", constraints: "SUBMITTED, APPROVED, ISSUED, COMPLETED, DENIED, EXPIRED" }

  - name: DrillerLog
    parent: null
    common_fields: true
    fields:
      - { name: construction_permit_id, type: string, source: input, description: "FK -> ConstructionPermit.id; the ISSUED permit this log completes" }
      - { name: driller_id, type: string, source: input, description: "FK -> Driller.id; must equal the assigned ConstructionPermit.driller_id" }
      - { name: total_depth_ft, type: integer, source: input, description: "Actual total drilled depth (ft); drives the permit fee FINAL variant and Well.depth_ft" }
      - { name: static_water_level_ft, type: integer, source: input, description: "Depth (ft) to standing water" }
      - { name: casing_depth_ft, type: integer, source: input, description: "Depth (ft) of the surface casing" }
      - { name: grout_type, type: enum, source: input, description: "BENTONITE | CEMENT | NEAT_CEMENT", constraints: "BENTONITE, CEMENT, NEAT_CEMENT" }
      - { name: completed_on, type: datetime, source: input, description: "ISO 8601 UTC instant drilling completed" }

  - name: WaterSample
    parent: null
    common_fields: true
    fields:
      - { name: well_id, type: string, source: input, description: "FK -> Well.id; the sampled well (must be ACTIVE)" }
      - { name: submitted_by_applicant_id, type: string, source: input, description: "FK -> Applicant.id; who submitted the sample" }
      - { name: sample_type, type: enum, source: input, description: "ROUTINE | REAL_ESTATE | CONTAMINATION_FOLLOWUP", constraints: "ROUTINE, REAL_ESTATE, CONTAMINATION_FOLLOWUP" }
      - { name: requested_analytes, type: array, source: input, description: "Non-empty subset of [BACTERIA, NITRATE, LEAD]; drives panel_fee_cents" }
      - { name: collected_on, type: datetime, source: input, description: "ISO 8601 UTC instant the sample was drawn; anchors real-estate validity window" }
      - { name: chain_of_custody_id, type: string, source: input, description: "External chain-of-custody identifier" }
      - { name: panel_fee_cents, type: integer, source: computed, description: "Panel fee computed per requested analyte then summed (panel_fee calculation)" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | RECEIVED | IN_ANALYSIS | RESULTED | INVALIDATED", constraints: "SUBMITTED, RECEIVED, IN_ANALYSIS, RESULTED, INVALIDATED" }

  - name: SampleResult
    parent: null
    common_fields: false              # append-only lab record: id + created_at only, immutable
    fields:
      - { name: water_sample_id, type: string, source: input, description: "FK -> WaterSample.id; the sample this result belongs to (must be IN_ANALYSIS)" }
      - { name: bacteria_coliform, type: enum, source: input, description: "PRESENT | ABSENT | NOT_TESTED (total coliform)", constraints: "PRESENT, ABSENT, NOT_TESTED" }
      - { name: ecoli, type: enum, source: input, description: "PRESENT | ABSENT | NOT_TESTED (E. coli)", constraints: "PRESENT, ABSENT, NOT_TESTED" }
      - { name: nitrate_mg_l, type: number, source: input, description: "Nitrate concentration in mg/L; must be >= 0" }
      - { name: lead_ppb, type: number, source: input, description: "Lead concentration in ppb (ug/L); must be >= 0" }
      - { name: analyzed_on, type: datetime, source: input, description: "ISO 8601 UTC instant the lab completed analysis" }
      - { name: advisory_level_provisional, type: enum, source: computed, description: "SAFE | ADVISORY | UNSAFE from THIS sample only (nitrate variant=PROVISIONAL)", constraints: "SAFE, ADVISORY, UNSAFE" }
      - { name: advisory_level_confirmed, type: enum, source: computed, description: "SAFE | ADVISORY | UNSAFE using the 2-sample running nitrate average (nitrate variant=CONFIRMED); drives Well.potability_status and case auto-open", constraints: "SAFE, ADVISORY, UNSAFE" }
      - { name: exceedances, type: array, source: computed, description: "Subset of [BACTERIA, NITRATE, LEAD] that exceeded its confirmed threshold" }

  - name: Advisory
    parent: null
    common_fields: true
    fields:
      - { name: well_id, type: string, source: input, description: "FK -> Well.id; the well the advisory covers" }
      - { name: source_case_id, type: string, source: input, default: null, description: "FK -> ContaminationCase.id; set when auto-issued by a case, null for manual advisories" }
      - { name: advisory_type, type: enum, source: input, description: "BOIL_WATER | DO_NOT_DRINK | NITRATE | LEAD", constraints: "BOIL_WATER, DO_NOT_DRINK, NITRATE, LEAD" }
      - { name: effective_from, type: datetime, source: input, description: "ISO 8601 UTC start of the advisory's active window" }
      - { name: effective_to, type: datetime, source: input, description: "ISO 8601 UTC end of the active window; must be strictly after effective_from" }
      - { name: reason, type: string, source: input, description: "Free-text justification" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | LIFTED", constraints: "ACTIVE, LIFTED" }

  - name: ContaminationCase
    parent: null
    common_fields: true
    fields:
      - { name: well_id, type: string, source: input, description: "FK -> Well.id; the affected well" }
      - { name: source_sample_id, type: string, source: input, default: null, description: "FK -> WaterSample.id; the sample whose confirmed UNSAFE result opened the case, null for manual cases" }
      - { name: severity, type: enum, source: input, description: "LOW | MODERATE | HIGH | CRITICAL", constraints: "LOW, MODERATE, HIGH, CRITICAL" }
      - { name: opened_by_officer_id, type: string, source: system, description: "X-User-ID of the HealthOfficer that opened the case (opaque operator id)" }
      - { name: closed_by_officer_id, type: string, source: system, default: null, description: "X-User-ID of the HealthOfficer that closed the case; MUST differ from opened_by_officer_id" }
      - { name: resolution_notes, type: string, source: input, default: null, description: "Officer notes recorded at close" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | INVESTIGATING | MITIGATION | RESOLVED | CLOSED (RESOLVED can reopen to INVESTIGATING)", constraints: "OPEN, INVESTIGATING, MITIGATION, RESOLVED, CLOSED" }

  - name: AbandonmentPermit
    parent: null
    common_fields: true
    fields:
      - { name: well_id, type: string, source: input, description: "FK -> Well.id; the well to decommission (must be ACTIVE at approval)" }
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id; must equal Well.applicant_id" }
      - { name: driller_id, type: string, source: input, description: "FK -> Driller.id; driller who will perform the decommission" }
      - { name: reason, type: enum, source: input, description: "DRY | CONTAMINATED | REPLACED | CODE_VIOLATION", constraints: "DRY, CONTAMINATED, REPLACED, CODE_VIOLATION" }
      - { name: method, type: enum, source: input, description: "PERFORATE_FILL | OVERDRILL | EXCAVATE", constraints: "PERFORATE_FILL, OVERDRILL, EXCAVATE" }
      - { name: completed_on, type: datetime, source: system, default: null, description: "ISO 8601 UTC instant the decommission was completed" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | APPROVED | DENIED | COMPLETED", constraints: "SUBMITTED, APPROVED, DENIED, COMPLETED" }

  - name: RealEstateTestRequirement
    parent: null
    common_fields: true
    fields:
      - { name: well_id, type: string, source: input, description: "FK -> Well.id; the well being sold/refinanced" }
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id; the party responsible for the requirement" }
      - { name: transaction_type, type: enum, source: input, description: "SALE | REFINANCE", constraints: "SALE, REFINANCE" }
      - { name: closing_date, type: datetime, source: input, description: "ISO 8601 UTC transaction closing instant; anchors the sample validity window" }
      - { name: required_analytes, type: array, source: input, default: ["BACTERIA", "NITRATE", "LEAD"], description: "Analytes the linked sample must have covered" }
      - { name: linked_sample_id, type: string, source: system, default: null, description: "FK -> WaterSample.id; the currently attached candidate sample (superseded by each link)" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | SATISFIED | EXPIRED | WAIVED", constraints: "OPEN, SATISFIED, EXPIRED, WAIVED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Well : registry_status dimension (lifecycle) ----
  - entity: Well
    dimension: registry_status
    initial_state: PROPOSED
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: PROPOSED
        to: PERMITTED
        trigger: "POST /construction-permits/{id}/issue (side effect on the permit's Well)"
        actor: HealthOfficer
        preconditions: ["Well.registry_status == PROPOSED"]
        side_effects: ["Well.registry_status = PERMITTED"]
      - from: PERMITTED
        to: ACTIVE
        trigger: "POST /driller-logs (log filed against the ISSUED permit)"
        actor: Driller
        preconditions: ["Well.registry_status == PERMITTED"]
        side_effects: ["Well.depth_ft = DrillerLog.total_depth_ft", "Well.registry_status = ACTIVE"]
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /wells/{id}/deactivate"
        actor: HealthOfficer
        preconditions: ["Well.registry_status == ACTIVE"]
        side_effects: ["Well.registry_status = INACTIVE"]
      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /wells/{id}/reactivate"
        actor: HealthOfficer
        preconditions: ["Well.registry_status == INACTIVE"]
        side_effects: ["Well.registry_status = ACTIVE"]
      - from: ACTIVE
        to: DECOMMISSIONED
        trigger: "POST /abandonment-permits/{id}/complete (side effect on the permit's Well)"
        actor: Driller
        preconditions: ["Well.registry_status == ACTIVE", "the completing AbandonmentPermit is APPROVED"]
        side_effects: ["Well.registry_status = DECOMMISSIONED", "AbandonmentPermit.status = COMPLETED"]

  # ---- Well : potability_status dimension (health) — parallel to registry_status ----
  - entity: Well
    dimension: potability_status
    initial_state: UNKNOWN
    terminal_states: []
    transitions:
      - from: UNKNOWN
        to: POTABLE
        trigger: "POST /sample-results with advisory_level_confirmed == SAFE"
        actor: system
        preconditions: []
        side_effects: ["Well.potability_status = POTABLE"]
      - from: UNKNOWN
        to: ADVISORY
        trigger: "POST /sample-results with advisory_level_confirmed == ADVISORY"
        actor: system
        preconditions: []
        side_effects: ["Well.potability_status = ADVISORY"]
      - from: POTABLE
        to: UNSAFE
        trigger: "POST /sample-results with advisory_level_confirmed == UNSAFE (auto-opens ContaminationCase)"
        actor: system
        preconditions: []
        side_effects: ["auto-open ContaminationCase (OPEN)", "Well.potability_status = UNSAFE"]
        note: "Reachable from any non-UNSAFE potability state; the confirmed UNSAFE result drives it."
      - from: ADVISORY
        to: UNSAFE
        trigger: "POST /sample-results with advisory_level_confirmed == UNSAFE"
        actor: system
        preconditions: []
        side_effects: ["auto-open ContaminationCase (OPEN)", "Well.potability_status = UNSAFE"]
      - from: UNSAFE
        to: POTABLE
        trigger: "POST /contamination-cases/{id}/close then potability recompute from latest RESULTED sample confirmed == SAFE"
        actor: system
        preconditions: ["no OPEN/INVESTIGATING/MITIGATION/RESOLVED ContaminationCase remains on the well"]
        side_effects: ["Well.potability_status = POTABLE"]
        note: "Recompute maps latest confirmed level SAFE->POTABLE, ADVISORY->ADVISORY, UNSAFE->UNSAFE."

  # ---- ConstructionPermit : branching (approve/deny fork) ----
  - entity: ConstructionPermit
    initial_state: SUBMITTED
    terminal_states: [COMPLETED, DENIED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /construction-permits/{id}/approve"
        actor: HealthOfficer
        preconditions:
          - "ConstructionPermit.status == SUBMITTED"
          - "setback_septic_ft >= Aquifer.min_setback_septic_ft AND setback_property_line_ft >= Aquifer.min_setback_property_line_ft (business_safety)"
          - "fee_paid == true (business_fiscal)"
        side_effects: []
        note: "Setback (safety) is checked before fee (fiscal); see validations priority conflict."
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /construction-permits/{id}/deny"
        actor: HealthOfficer
        preconditions: ["ConstructionPermit.status == SUBMITTED"]
        side_effects:
          - "if fee_paid: fee_refunded_cents = fee_charged_cents (compensating refund)"
          - "recompute Applicant.net_fees_paid_cents (money conservation)"
      - from: APPROVED
        to: ISSUED
        trigger: "POST /construction-permits/{id}/issue"
        actor: HealthOfficer
        preconditions:
          - "ConstructionPermit.status == APPROVED"
          - "assigned Driller has no other ISSUED/COMPLETED permit whose [scheduled_start, scheduled_end) window, expanded by DRILL_TRAVEL_BUFFER_HOURS (=4) on both sides, overlaps this permit's window (business_temporal)"
        side_effects:
          - "issued_on = now; expires_on = issued_on + PERMIT_VALIDITY_DAYS (=365)"
          - "Well.registry_status PROPOSED -> PERMITTED"
      - from: ISSUED
        to: COMPLETED
        trigger: "POST /driller-logs (log filed against this permit)"
        actor: Driller
        preconditions: ["ConstructionPermit.status == ISSUED"]
        side_effects:
          - "fee_final_cents = permit_fee(FINAL, DrillerLog.total_depth_ft)"
          - "fee_charged_cents = fee_final_cents"
          - "recompute Applicant.net_fees_paid_cents by delta (fee_final_cents - fee_estimate_cents)"
          - "Well.depth_ft = total_depth_ft; Well.registry_status PERMITTED -> ACTIVE"
      - from: ISSUED
        to: EXPIRED
        trigger: "POST /_ops/expiry-sweep when now >= expires_on"
        actor: HealthOfficer
        preconditions: ["ConstructionPermit.status == ISSUED", "now >= expires_on"]
        side_effects: []

  # ---- WaterSample : lab pipeline ----
  - entity: WaterSample
    initial_state: SUBMITTED
    terminal_states: [INVALIDATED]
    transitions:
      - from: SUBMITTED
        to: RECEIVED
        trigger: "POST /water-samples/{id}/receive"
        actor: LabAnalyst
        preconditions: ["WaterSample.status == SUBMITTED"]
        side_effects: []
      - from: RECEIVED
        to: IN_ANALYSIS
        trigger: "POST /water-samples/{id}/begin-analysis"
        actor: LabAnalyst
        preconditions: ["WaterSample.status == RECEIVED"]
        side_effects: []
      - from: IN_ANALYSIS
        to: RESULTED
        trigger: "POST /sample-results (the result creation moves the sample)"
        actor: LabAnalyst
        preconditions: ["WaterSample.status == IN_ANALYSIS"]
        side_effects:
          - "create SampleResult; compute advisory_level_provisional and advisory_level_confirmed"
          - "if advisory_level_confirmed == UNSAFE: auto-open ContaminationCase (OPEN) on the well (cascade hop 2)"
          - "recompute Well.potability_status from advisory_level_confirmed"
      - from: RESULTED
        to: INVALIDATED
        trigger: "POST /water-samples/{id}/invalidate"
        actor: HealthOfficer
        preconditions: ["WaterSample.status == RESULTED"]
        side_effects: ["recompute Well.potability_status from the latest remaining RESULTED sample"]

  # ---- ContaminationCase : cyclic (RESOLVED can reopen) ----
  - entity: ContaminationCase
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: INVESTIGATING
        trigger: "POST /contamination-cases/{id}/transition {to_status: INVESTIGATING}"
        actor: HealthOfficer
        preconditions: ["ContaminationCase.status == OPEN"]
        side_effects: []
      - from: INVESTIGATING
        to: MITIGATION
        trigger: "POST /contamination-cases/{id}/transition {to_status: MITIGATION}"
        actor: HealthOfficer
        preconditions: ["ContaminationCase.status == INVESTIGATING"]
        side_effects: []
      - from: MITIGATION
        to: RESOLVED
        trigger: "POST /contamination-cases/{id}/transition {to_status: RESOLVED}"
        actor: HealthOfficer
        preconditions: ["ContaminationCase.status == MITIGATION"]
        side_effects: []
      - from: RESOLVED
        to: INVESTIGATING
        trigger: "POST /contamination-cases/{id}/transition {to_status: INVESTIGATING} (reopen)"
        actor: HealthOfficer
        preconditions: ["ContaminationCase.status == RESOLVED"]
        side_effects: []
        note: "Cyclic loop: a resolved case can reopen for further investigation."
      - from: OPEN
        to: OPEN
        trigger: "system auto-open at POST /sample-results with confirmed UNSAFE (cascade hop 3)"
        actor: system
        preconditions: []
        side_effects:
          - "Well.potability_status = UNSAFE"
          - "auto-issue Advisory (ACTIVE) with source_case_id = this case; Well.active_advisory_count += 1"
        note: "Documents the entry side-effects executed when the case is created OPEN by the cascade."
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /contamination-cases/{id}/close"
        actor: HealthOfficer
        preconditions:
          - "ContaminationCase.status == RESOLVED"
          - "X-User-ID (closing officer) != opened_by_officer_id (segregation of duties)"
        side_effects:
          - "closed_by_officer_id = X-User-ID; resolution_notes set"
          - "lift every ACTIVE Advisory whose source_case_id == this case (ACTIVE -> LIFTED); Well.active_advisory_count decremented (cascade hop 1)"
          - "recompute Well.potability_status from latest RESULTED sample confirmed level (cascade hop 2)"

  # ---- AbandonmentPermit : branching ----
  - entity: AbandonmentPermit
    initial_state: SUBMITTED
    terminal_states: [DENIED, COMPLETED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /abandonment-permits/{id}/approve"
        actor: HealthOfficer
        preconditions:
          - "AbandonmentPermit.status == SUBMITTED"
          - "Well.registry_status == ACTIVE (cross-entity dependency)"
          - "no non-terminal ConstructionPermit (SUBMITTED/APPROVED/ISSUED) exists on the well"
        side_effects: []
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /abandonment-permits/{id}/deny"
        actor: HealthOfficer
        preconditions: ["AbandonmentPermit.status == SUBMITTED"]
        side_effects: []
      - from: APPROVED
        to: COMPLETED
        trigger: "POST /abandonment-permits/{id}/complete"
        actor: Driller
        preconditions:
          - "AbandonmentPermit.status == APPROVED"
          - "acting Driller.id == AbandonmentPermit.driller_id AND Driller.status == ACTIVE"
        side_effects: ["completed_on = now", "Well.registry_status ACTIVE -> DECOMMISSIONED (cross-entity)"]

  # ---- RealEstateTestRequirement : link/certify/expire/waive ----
  - entity: RealEstateTestRequirement
    initial_state: OPEN
    terminal_states: [SATISFIED, EXPIRED, WAIVED]
    transitions:
      - from: OPEN
        to: OPEN
        trigger: "POST /real-estate-requirements/{id}/link-sample (supersede candidate; OCC on version)"
        actor: Applicant
        preconditions:
          - "RealEstateTestRequirement.status == OPEN"
          - "expected_requirement_version == RealEstateTestRequirement.version (else ERR_STALE_VERSION)"
          - "linked WaterSample.status == RESULTED AND its result advisory_level_confirmed == SAFE"
          - "abs(closing_date - WaterSample.collected_on) <= REAL_ESTATE_TEST_VALIDITY_DAYS (=90), collected_on <= closing_date (business_temporal)"
        side_effects: ["linked_sample_id = WaterSample.id (supersedes prior)", "version += 1"]
        note: "Stays OPEN so a newer sample can supersede; only OCC distinguishes a stale writer."
      - from: OPEN
        to: SATISFIED
        trigger: "POST /real-estate-requirements/{id}/certify"
        actor: HealthOfficer
        preconditions: ["RealEstateTestRequirement.status == OPEN", "linked_sample_id != null"]
        side_effects: []
      - from: OPEN
        to: EXPIRED
        trigger: "POST /_ops/expiry-sweep when now > closing_date"
        actor: HealthOfficer
        preconditions: ["RealEstateTestRequirement.status == OPEN", "now > closing_date"]
        side_effects: []
      - from: OPEN
        to: WAIVED
        trigger: "POST /real-estate-requirements/{id}/waive"
        actor: HealthOfficer
        preconditions: ["RealEstateTestRequirement.status == OPEN"]
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: requirement-link-stale-version
    parent_entity: RealEstateTestRequirement
    write_endpoint: "POST /real-estate-requirements/{id}/link-sample"
    occ_field: "expected_requirement_version"
    description: |
      Linking a WaterSample to a RealEstateTestRequirement whose version has
      advanced since the client last observed it is rejected. Each link
      legitimately supersedes the prior candidate sample (a buyer may attach a
      newer passing test), so a second link against a stale version is the
      classic supersede race: the requirement's version has moved because an
      earlier link already attached a sample, and this writer's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  # --- Dual-variant #1 (water-quality domain): nitrate advisory level ---
  - name: sample_advisory_level
    trigger: "POST /sample-results (WaterSample IN_ANALYSIS -> RESULTED)"
    algorithm: threshold
    formula: |
      # level(nitrate_val, bacteria_coliform, ecoli, lead_ppb):
      #   if bacteria_coliform == PRESENT or ecoli == PRESENT
      #        or lead_ppb >= LEAD_ACTION_PPB
      #        or nitrate_val >= NITRATE_MCL_MG_L:      return UNSAFE
      #   elif nitrate_val >= NITRATE_ADVISORY_MG_L:    return ADVISORY
      #   else:                                         return SAFE
      #
      # advisory_level_provisional = level(this.nitrate_mg_l, this.bacteria, this.ecoli, this.lead_ppb)
      #
      # advisory_level_confirmed uses a 2-sample RUNNING NITRATE AVERAGE:
      #   prior = the most recent OTHER RESULTED SampleResult for the same well,
      #           ordered by WaterSample.collected_on DESC, tie-break created_at DESC.
      #   if prior exists:
      #       nitrate_conf = round_half_up((this.nitrate_mg_l + prior.nitrate_mg_l) / 2, 3)
      #   else:
      #       nitrate_conf = this.nitrate_mg_l
      #   advisory_level_confirmed = level(nitrate_conf, this.bacteria, this.ecoli, this.lead_ppb)
      #
      # exceedances = [ 'BACTERIA' if bacteria/ecoli PRESENT,
      #                 'NITRATE'  if nitrate_conf >= NITRATE_MCL_MG_L,
      #                 'LEAD'     if lead_ppb >= LEAD_ACTION_PPB ]
    input_set: "This SampleResult plus the single most-recent prior RESULTED SampleResult on the same well (RESULTED, not INVALIDATED)."
    constants:
      NITRATE_MCL_MG_L: 10.0
      NITRATE_ADVISORY_MG_L: 5.0
      LEAD_ACTION_PPB: 15.0
    precision: "nitrate average to 3 decimals round_half_up; comparisons use >= for thresholds"
    variants:
      - name: PROVISIONAL
        when: "the immediate per-sample advisory recorded on SampleResult.advisory_level_provisional"
        difference: "uses this sample's nitrate only; ignores the prior sample"
      - name: CONFIRMED
        when: "the official level that drives Well.potability_status and contamination-case auto-open"
        difference: "uses the 2-sample running nitrate average, so an elevated prior sample can push CONFIRMED to UNSAFE while PROVISIONAL stays ADVISORY"

  # --- Dual-variant #2 (permit-fee domain): construction permit fee ---
  - name: permit_fee
    trigger: "POST /construction-permits (ESTIMATE) and POST /driller-logs completion (FINAL)"
    algorithm: tiered_pricing
    formula: |
      # depth_base(d):
      #   if d <= DEPTH_TIER1_MAX_FT:  DEPTH_TIER1_CENTS
      #   elif d <= DEPTH_TIER2_MAX_FT: DEPTH_TIER2_CENTS
      #   else:                         DEPTH_TIER3_CENTS
      # use_mult:  DOMESTIC 1.0 | IRRIGATION 1.2 | LIVESTOCK 1.5   (from Well.intended_use)
      # aquifer_surcharge: HIGH AQ_SURCHARGE_HIGH_CENTS | MODERATE AQ_SURCHARGE_MODERATE_CENTS | LOW 0
      # fee = round_half_up(depth_base(depth) * use_mult)
      #        + aquifer_surcharge
      #        + (EXPEDITE_FEE_CENTS if expedite else 0)
      # ESTIMATE: depth = ConstructionPermit.proposed_depth_ft
      # FINAL:    depth = DrillerLog.total_depth_ft
    input_set: "Single ConstructionPermit + its Well.intended_use + Well's Aquifer.sensitivity."
    constants:
      DEPTH_TIER1_MAX_FT: 100
      DEPTH_TIER2_MAX_FT: 300
      DEPTH_TIER1_CENTS: 15000
      DEPTH_TIER2_CENTS: 25000
      DEPTH_TIER3_CENTS: 40000
      USE_MULT_DOMESTIC: 1.0
      USE_MULT_IRRIGATION: 1.2
      USE_MULT_LIVESTOCK: 1.5
      AQ_SURCHARGE_HIGH_CENTS: 10000
      AQ_SURCHARGE_MODERATE_CENTS: 5000
      EXPEDITE_FEE_CENTS: 20000
    precision: "integer cents; round_half_up on the depth_base * use_mult product BEFORE adding surcharge and expedite"
    variants:
      - name: ESTIMATE
        when: "computed at submission from proposed_depth_ft, stored in fee_estimate_cents"
        difference: "keyed on the applicant's proposed depth"
      - name: FINAL
        when: "computed at driller-log completion from total_depth_ft, stored in fee_final_cents"
        difference: "keyed on the actual drilled depth; delta (FINAL - ESTIMATE) reconciles Applicant.net_fees_paid_cents"

  # --- Combinatorial mode (b): panel fee, round-per-analyte-then-sum ---
  - name: panel_fee
    trigger: "POST /water-samples"
    algorithm: aggregation
    formula: |
      # ANALYTE_BASE_CENTS: BACTERIA 3000 | NITRATE 2500 | LEAD 4500
      # panel_fee_cents = sum over a in requested_analytes of
      #                     round_half_up(ANALYTE_BASE_CENTS[a] * PANEL_REGION_FACTOR)
      # ORDER IS PINNED: round EACH analyte line to whole cents, THEN sum the
      # rounded lines. (sum-then-round would differ by a cent and is WRONG.)
    input_set: "The requested_analytes list on the single WaterSample being created."
    constants:
      ANALYTE_BASE_BACTERIA_CENTS: 3000
      ANALYTE_BASE_NITRATE_CENTS: 2500
      ANALYTE_BASE_LEAD_CENTS: 4500
      PANEL_REGION_FACTOR: 1.075
    precision: "round_half_up per analyte line to whole cents, then integer sum"

  # --- Derived reconciliation fields ---
  - name: applicant_net_fees_paid
    trigger: "POST /construction-permits/{id}/pay, /deny, and driller-log completion"
    algorithm: aggregation
    formula: |
      # net_fees_paid_cents = sum over the applicant's ConstructionPermits of
      #     (fee_charged_cents if fee_paid else 0) - fee_refunded_cents
    input_set: "All ConstructionPermits whose applicant_id == this applicant."
    precision: "integer cents"

  - name: well_active_advisory_count
    trigger: "advisory issue (manual or cascade) and advisory lift"
    algorithm: aggregation
    formula: |
      # active_advisory_count = count of Advisory rows where well_id == Well.id
      #                          AND status == ACTIVE
    input_set: "All Advisory rows for the well; only status == ACTIVE counted."
    precision: "integer count"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lower number checked first)
# =============================================================================
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 20
    category: auth
    check: "the authenticated role is permitted to call this endpoint (RBAC §1.7)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 25
    category: business_constraint
    check: "request body well-formed: required fields present, enums in range, requested_analytes non-empty subset of [BACTERIA,NITRATE,LEAD]"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST/PATCH"
  - priority: 26
    category: business_constraint
    check: "SampleResult concentrations non-negative (nitrate_mg_l >= 0 AND lead_ppb >= 0)"
    error_id: ERR_ANALYTE_OUT_OF_RANGE
    http_status: 400
    applies_to: "POST /sample-results"
  - priority: 30
    category: existence
    check: "every referenced resource (by path id or FK in body) exists; validated left-to-right"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all"
  - priority: 40
    category: state
    check: "target resource is in the correct state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-changing endpoints"
  - priority: 41
    category: state
    check: "POST /driller-logs: the ConstructionPermit is ISSUED"
    error_id: ERR_PERMIT_NOT_ISSUED
    http_status: 409
    applies_to: "POST /driller-logs"
  - priority: 41
    category: state
    check: "POST /real-estate-requirements/{id}/link-sample and /certify: requirement is OPEN"
    error_id: ERR_REQUIREMENT_NOT_OPEN
    http_status: 409
    applies_to: "POST /real-estate-requirements/{id}/link-sample, POST /real-estate-requirements/{id}/certify"
  - priority: 41
    category: state
    check: "POST /water-samples: the Well.registry_status == ACTIVE; POST /abandonment-permits/{id}/approve: Well.registry_status == ACTIVE"
    error_id: ERR_WELL_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /water-samples, POST /abandonment-permits/{id}/approve"
  - priority: 42
    category: state
    check: "OCC: expected_requirement_version equals current RealEstateTestRequirement.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /real-estate-requirements/{id}/link-sample"
  - priority: 46
    category: business_constraint
    check: "segregation of duties: closing officer X-User-ID differs from ContaminationCase.opened_by_officer_id"
    error_id: ERR_SELF_CLOSE_FORBIDDEN
    http_status: 403
    applies_to: "POST /contamination-cases/{id}/close"
  - priority: 50
    category: business_safety
    check: "POST /construction-permits/{id}/approve: setback_septic_ft >= Aquifer.min_setback_septic_ft AND setback_property_line_ft >= Aquifer.min_setback_property_line_ft"
    error_id: ERR_SETBACK_VIOLATION
    http_status: 422
    applies_to: "POST /construction-permits/{id}/approve"
  - priority: 51
    category: business_safety
    check: "driller license valid: Driller.status == ACTIVE AND log/completion instant < Driller.license_expires_on"
    error_id: ERR_DRILLER_LICENSE_INVALID
    http_status: 422
    applies_to: "POST /driller-logs, POST /abandonment-permits/{id}/complete"
  - priority: 60
    category: business_referential
    check: "POST /driller-logs: driller_id equals the assigned ConstructionPermit.driller_id"
    error_id: ERR_DRILLER_NOT_ASSIGNED
    http_status: 409
    applies_to: "POST /driller-logs"
  - priority: 61
    category: business_referential
    check: "permit/abandonment applicant_id equals Well.applicant_id"
    error_id: ERR_APPLICANT_MISMATCH
    http_status: 409
    applies_to: "POST /construction-permits, POST /abandonment-permits"
  - priority: 70
    category: business_temporal
    check: "POST .../link-sample: collected_on <= closing_date AND (closing_date - collected_on) <= REAL_ESTATE_TEST_VALIDITY_DAYS (=90)"
    error_id: ERR_SAMPLE_OUTSIDE_VALIDITY_WINDOW
    http_status: 422
    applies_to: "POST /real-estate-requirements/{id}/link-sample"
  - priority: 71
    category: business_temporal
    check: "POST /construction-permits/{id}/issue: assigned driller's buffered [scheduled_start, scheduled_end) window does not overlap another ISSUED/COMPLETED permit's window (half-open, +/- DRILL_TRAVEL_BUFFER_HOURS (=4))"
    error_id: ERR_DRILLER_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /construction-permits/{id}/issue"
  - priority: 72
    category: business_temporal
    check: "POST /advisories: no existing ACTIVE Advisory of the same advisory_type on the well has a closed-interval [effective_from, effective_to] overlapping this one"
    error_id: ERR_ADVISORY_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /advisories"
  - priority: 80
    category: business_constraint
    check: "POST .../link-sample: linked WaterSample is RESULTED and its result advisory_level_confirmed == SAFE"
    error_id: ERR_SAMPLE_NOT_SAFE
    http_status: 422
    applies_to: "POST /real-estate-requirements/{id}/link-sample"
  - priority: 81
    category: business_constraint
    check: "POST /abandonment-permits/{id}/approve: no non-terminal ConstructionPermit (SUBMITTED/APPROVED/ISSUED) exists on the well"
    error_id: ERR_ABANDONMENT_BLOCKED
    http_status: 409
    applies_to: "POST /abandonment-permits/{id}/approve"
  - priority: 90
    category: business_fiscal
    check: "POST /construction-permits/{id}/approve: fee_paid == true"
    error_id: ERR_FEE_UNPAID
    http_status: 402
    applies_to: "POST /construction-permits/{id}/approve"

# =============================================================================
# 1.5 API Endpoint Table  (roles: Applicant, Driller, LabAnalyst, HealthOfficer)
# =============================================================================
endpoints:
  # ---- Aquifer (config) ----
  - method: POST
    path: "/aquifers"
    description: "Create an aquifer configuration record"
    roles: [HealthOfficer]
    code: 201
    input: [name, sensitivity, min_setback_septic_ft, min_setback_property_line_ft, min_well_depth_ft]
    output: Aquifer
    side_effects: []
  - method: GET
    path: "/aquifers/{id}"
    description: "Fetch an aquifer"
    roles: [Applicant, Driller, LabAnalyst, HealthOfficer]
    code: 200
    input: []
    output: Aquifer
    side_effects: []

  # ---- Applicant ----
  - method: POST
    path: "/applicants"
    description: "Register an applicant / well owner account"
    roles: [HealthOfficer]
    code: 201
    input: [full_name, email, mailing_state]
    output: Applicant
    side_effects: ["net_fees_paid_cents = 0"]
  - method: GET
    path: "/applicants/{id}"
    description: "Fetch an applicant (Applicant may fetch own record)"
    roles: [Applicant, HealthOfficer]
    code: 200
    input: []
    output: Applicant
    side_effects: []

  # ---- Driller ----
  - method: POST
    path: "/drillers"
    description: "Register a licensed driller"
    roles: [HealthOfficer]
    code: 201
    input: [license_number, license_state, license_expires_on]
    output: Driller
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/drillers/{id}"
    description: "Fetch a driller"
    roles: [Applicant, Driller, LabAnalyst, HealthOfficer]
    code: 200
    input: []
    output: Driller
    side_effects: []
  - method: POST
    path: "/drillers/{id}/suspend"
    description: "Suspend a driller license (blocks new logs/completions)"
    roles: [HealthOfficer]
    code: 200
    input: []
    output: Driller
    side_effects: ["status = SUSPENDED"]

  # ---- Well ----
  - method: POST
    path: "/wells"
    description: "Create a well registry record (PROPOSED)"
    roles: [Applicant]
    code: 201
    input: [applicant_id, aquifer_id, latitude, longitude, parcel_apn, intended_use]
    output: Well
    side_effects: ["registry_status = PROPOSED", "potability_status = UNKNOWN", "active_advisory_count = 0"]
  - method: GET
    path: "/wells/{id}"
    description: "Fetch a well"
    roles: [Applicant, Driller, LabAnalyst, HealthOfficer]
    code: 200
    input: []
    output: Well
    side_effects: []
  - method: GET
    path: "/wells"
    description: "List/filter wells (reverse-reachability for applicant_id, aquifer_id)"
    roles: [Applicant, Driller, LabAnalyst, HealthOfficer]
    code: 200
    input: ["applicant_id?", "aquifer_id?", "registry_status?", "potability_status?", "limit?", "offset?"]
    output: Well[]
    side_effects: []
  - method: POST
    path: "/wells/{id}/deactivate"
    description: "Deactivate an ACTIVE well"
    roles: [HealthOfficer]
    code: 200
    input: []
    output: Well
    side_effects: ["registry_status ACTIVE -> INACTIVE"]
  - method: POST
    path: "/wells/{id}/reactivate"
    description: "Reactivate an INACTIVE well"
    roles: [HealthOfficer]
    code: 200
    input: []
    output: Well
    side_effects: ["registry_status INACTIVE -> ACTIVE"]

  # ---- ConstructionPermit ----
  - method: POST
    path: "/construction-permits"
    description: "Submit a well-construction permit application"
    roles: [Applicant]
    code: 201
    input: [well_id, applicant_id, driller_id, proposed_depth_ft, setback_septic_ft, setback_property_line_ft, scheduled_start, scheduled_end, "expedite?"]
    output: ConstructionPermit
    side_effects: ["status = SUBMITTED", "fee_estimate_cents = permit_fee(ESTIMATE)", "fee_charged_cents = 0", "fee_paid = false"]
  - method: GET
    path: "/construction-permits/{id}"
    description: "Fetch a construction permit"
    roles: [Applicant, Driller, LabAnalyst, HealthOfficer]
    code: 200
    input: []
    output: ConstructionPermit
    side_effects: []
  - method: GET
    path: "/construction-permits"
    description: "List/filter construction permits (reverse-reachability for well_id, applicant_id, driller_id)"
    roles: [Applicant, Driller, LabAnalyst, HealthOfficer]
    code: 200
    input: ["well_id?", "applicant_id?", "driller_id?", "status?", "limit?", "offset?"]
    output: ConstructionPermit[]
    side_effects: []
  - method: POST
    path: "/construction-permits/{id}/pay"
    description: "Pay the permit fee estimate"
    roles: [Applicant]
    code: 200
    input: []
    output: ConstructionPermit
    side_effects: ["fee_paid = true", "fee_charged_cents = fee_estimate_cents", "recompute Applicant.net_fees_paid_cents", "version += 1"]
  - method: POST
    path: "/construction-permits/{id}/approve"
    description: "Approve a submitted permit (setback + fee checks)"
    roles: [HealthOfficer]
    code: 200
    input: []
    output: ConstructionPermit
    side_effects: ["status SUBMITTED -> APPROVED", "version += 1"]
  - method: POST
    path: "/construction-permits/{id}/deny"
    description: "Deny a submitted permit; refund any paid fee (compensating)"
    roles: [HealthOfficer]
    code: 200
    input: []
    output: ConstructionPermit
    side_effects: ["status SUBMITTED -> DENIED", "if fee_paid: fee_refunded_cents = fee_charged_cents", "recompute Applicant.net_fees_paid_cents", "version += 1"]
  - method: POST
    path: "/construction-permits/{id}/issue"
    description: "Issue an approved permit; reserves the driller work window"
    roles: [HealthOfficer]
    code: 200
    input: []
    output: ConstructionPermit
    side_effects: ["status APPROVED -> ISSUED", "issued_on = now; expires_on = issued_on + PERMIT_VALIDITY_DAYS (=365)", "Well.registry_status PROPOSED -> PERMITTED", "version += 1"]

  # ---- DrillerLog ----
  - method: POST
    path: "/driller-logs"
    description: "File the completion log for an ISSUED permit (completes permit, activates well)"
    roles: [Driller]
    code: 201
    input: [construction_permit_id, driller_id, total_depth_ft, static_water_level_ft, casing_depth_ft, grout_type, completed_on]
    output: DrillerLog
    side_effects:
      - "ConstructionPermit.status ISSUED -> COMPLETED"
      - "ConstructionPermit.fee_final_cents = permit_fee(FINAL); fee_charged_cents = fee_final_cents"
      - "recompute Applicant.net_fees_paid_cents by delta (FINAL - ESTIMATE)"
      - "Well.depth_ft = total_depth_ft; Well.registry_status PERMITTED -> ACTIVE"
  - method: GET
    path: "/driller-logs/{id}"
    description: "Fetch a driller log"
    roles: [Applicant, Driller, LabAnalyst, HealthOfficer]
    code: 200
    input: []
    output: DrillerLog
    side_effects: []
  - method: GET
    path: "/driller-logs"
    description: "List/filter driller logs (reverse-reachability for construction_permit_id, driller_id)"
    roles: [Applicant, Driller, LabAnalyst, HealthOfficer]
    code: 200
    input: ["construction_permit_id?", "driller_id?", "limit?", "offset?"]
    output: DrillerLog[]
    side_effects: []

  # ---- WaterSample ----
  - method: POST
    path: "/water-samples"
    description: "Submit a water sample for an ACTIVE well"
    roles: [Applicant]
    code: 201
    input: [well_id, submitted_by_applicant_id, sample_type, requested_analytes, collected_on, chain_of_custody_id]
    output: WaterSample
    side_effects: ["status = SUBMITTED", "panel_fee_cents = panel_fee(requested_analytes)"]
  - method: GET
    path: "/water-samples/{id}"
    description: "Fetch a water sample"
    roles: [Applicant, Driller, LabAnalyst, HealthOfficer]
    code: 200
    input: []
    output: WaterSample
    side_effects: []
  - method: GET
    path: "/water-samples"
    description: "List/filter water samples (reverse-reachability for well_id, submitted_by_applicant_id)"
    roles: [Applicant, Driller, LabAnalyst, HealthOfficer]
    code: 200
    input: ["well_id?", "submitted_by_applicant_id?", "status?", "sample_type?", "limit?", "offset?"]
    output: WaterSample[]
    side_effects: []
  - method: POST
    path: "/water-samples/{id}/receive"
    description: "Lab receives the sample"
    roles: [LabAnalyst]
    code: 200
    input: []
    output: WaterSample
    side_effects: ["status SUBMITTED -> RECEIVED"]
  - method: POST
    path: "/water-samples/{id}/begin-analysis"
    description: "Lab begins analysis"
    roles: [LabAnalyst]
    code: 200
    input: []
    output: WaterSample
    side_effects: ["status RECEIVED -> IN_ANALYSIS"]
  - method: POST
    path: "/water-samples/{id}/invalidate"
    description: "Invalidate a resulted sample (recompute well potability)"
    roles: [HealthOfficer]
    code: 200
    input: []
    output: WaterSample
    side_effects: ["status RESULTED -> INVALIDATED", "recompute Well.potability_status from latest remaining RESULTED sample"]

  # ---- SampleResult ----
  - method: POST
    path: "/sample-results"
    description: "Record lab results (moves sample to RESULTED; drives potability + case cascade)"
    roles: [LabAnalyst]
    code: 201
    input: [water_sample_id, bacteria_coliform, ecoli, nitrate_mg_l, lead_ppb, analyzed_on]
    output: SampleResult
    side_effects:
      - "WaterSample.status IN_ANALYSIS -> RESULTED"
      - "compute advisory_level_provisional, advisory_level_confirmed, exceedances"
      - "recompute Well.potability_status from advisory_level_confirmed"
      - "if advisory_level_confirmed == UNSAFE: auto-open ContaminationCase (OPEN) which auto-issues an Advisory and increments Well.active_advisory_count"
  - method: GET
    path: "/sample-results/{id}"
    description: "Fetch a sample result"
    roles: [Applicant, Driller, LabAnalyst, HealthOfficer]
    code: 200
    input: []
    output: SampleResult
    side_effects: []
  - method: GET
    path: "/sample-results"
    description: "List/filter sample results (reverse-reachability for water_sample_id)"
    roles: [Applicant, Driller, LabAnalyst, HealthOfficer]
    code: 200
    input: ["water_sample_id?", "limit?", "offset?"]
    output: SampleResult[]
    side_effects: []

  # ---- Advisory ----
  - method: POST
    path: "/advisories"
    description: "Manually issue a health advisory (closed-interval overlap check per type)"
    roles: [HealthOfficer]
    code: 201
    input: [well_id, advisory_type, effective_from, effective_to, reason]
    output: Advisory
    side_effects: ["status = ACTIVE", "source_case_id = null", "Well.active_advisory_count += 1"]
  - method: GET
    path: "/advisories/{id}"
    description: "Fetch an advisory"
    roles: [Applicant, Driller, LabAnalyst, HealthOfficer]
    code: 200
    input: []
    output: Advisory
    side_effects: []
  - method: GET
    path: "/advisories"
    description: "List/filter advisories (reverse-reachability for well_id, source_case_id)"
    roles: [Applicant, Driller, LabAnalyst, HealthOfficer]
    code: 200
    input: ["well_id?", "source_case_id?", "status?", "advisory_type?", "limit?", "offset?"]
    output: Advisory[]
    side_effects: []
  - method: POST
    path: "/advisories/{id}/lift"
    description: "Lift an active advisory"
    roles: [HealthOfficer]
    code: 200
    input: []
    output: Advisory
    side_effects: ["status ACTIVE -> LIFTED", "Well.active_advisory_count -= 1"]

  # ---- ContaminationCase ----
  - method: POST
    path: "/contamination-cases"
    description: "Manually open a contamination case on a well"
    roles: [HealthOfficer]
    code: 201
    input: [well_id, severity, "source_sample_id?"]
    output: ContaminationCase
    side_effects: ["status = OPEN", "opened_by_officer_id = X-User-ID", "Well.potability_status = UNSAFE"]
  - method: GET
    path: "/contamination-cases/{id}"
    description: "Fetch a contamination case"
    roles: [Applicant, Driller, LabAnalyst, HealthOfficer]
    code: 200
    input: []
    output: ContaminationCase
    side_effects: []
  - method: GET
    path: "/contamination-cases"
    description: "List/filter contamination cases (reverse-reachability for well_id, source_sample_id)"
    roles: [Applicant, Driller, LabAnalyst, HealthOfficer]
    code: 200
    input: ["well_id?", "source_sample_id?", "status?", "limit?", "offset?"]
    output: ContaminationCase[]
    side_effects: []
  - method: POST
    path: "/contamination-cases/{id}/transition"
    description: "Advance case status (OPEN->INVESTIGATING->MITIGATION->RESOLVED; RESOLVED->INVESTIGATING reopen)"
    roles: [HealthOfficer]
    code: 200
    input: [to_status]
    output: ContaminationCase
    side_effects: ["status changes per the requested to_status", "version += 1"]
  - method: POST
    path: "/contamination-cases/{id}/close"
    description: "Close a resolved case (segregation of duties; lifts case advisories; recompute potability)"
    roles: [HealthOfficer]
    code: 200
    input: ["resolution_notes?"]
    output: ContaminationCase
    side_effects:
      - "status RESOLVED -> CLOSED; closed_by_officer_id = X-User-ID"
      - "lift every ACTIVE Advisory with source_case_id == this case; Well.active_advisory_count decremented"
      - "recompute Well.potability_status from latest RESULTED sample confirmed level"
      - "version += 1"

  # ---- AbandonmentPermit ----
  - method: POST
    path: "/abandonment-permits"
    description: "Submit an abandonment / decommission permit application"
    roles: [Applicant]
    code: 201
    input: [well_id, applicant_id, driller_id, reason, method]
    output: AbandonmentPermit
    side_effects: ["status = SUBMITTED"]
  - method: GET
    path: "/abandonment-permits/{id}"
    description: "Fetch an abandonment permit"
    roles: [Applicant, Driller, LabAnalyst, HealthOfficer]
    code: 200
    input: []
    output: AbandonmentPermit
    side_effects: []
  - method: GET
    path: "/abandonment-permits"
    description: "List/filter abandonment permits (reverse-reachability for well_id, applicant_id, driller_id)"
    roles: [Applicant, Driller, LabAnalyst, HealthOfficer]
    code: 200
    input: ["well_id?", "applicant_id?", "driller_id?", "status?", "limit?", "offset?"]
    output: AbandonmentPermit[]
    side_effects: []
  - method: POST
    path: "/abandonment-permits/{id}/approve"
    description: "Approve an abandonment permit (well must be ACTIVE; no open construction permit)"
    roles: [HealthOfficer]
    code: 200
    input: []
    output: AbandonmentPermit
    side_effects: ["status SUBMITTED -> APPROVED"]
  - method: POST
    path: "/abandonment-permits/{id}/deny"
    description: "Deny an abandonment permit"
    roles: [HealthOfficer]
    code: 200
    input: []
    output: AbandonmentPermit
    side_effects: ["status SUBMITTED -> DENIED"]
  - method: POST
    path: "/abandonment-permits/{id}/complete"
    description: "Complete the decommission (driller); decommissions the well"
    roles: [Driller]
    code: 200
    input: []
    output: AbandonmentPermit
    side_effects: ["status APPROVED -> COMPLETED", "completed_on = now", "Well.registry_status ACTIVE -> DECOMMISSIONED"]

  # ---- RealEstateTestRequirement ----
  - method: POST
    path: "/real-estate-requirements"
    description: "Create a real-estate test requirement for a property transfer"
    roles: [Applicant, HealthOfficer]
    code: 201
    input: [well_id, applicant_id, transaction_type, closing_date, "required_analytes?"]
    output: RealEstateTestRequirement
    side_effects: ["status = OPEN", "linked_sample_id = null"]
  - method: GET
    path: "/real-estate-requirements/{id}"
    description: "Fetch a real-estate test requirement"
    roles: [Applicant, Driller, LabAnalyst, HealthOfficer]
    code: 200
    input: []
    output: RealEstateTestRequirement
    side_effects: []
  - method: GET
    path: "/real-estate-requirements"
    description: "List/filter requirements (reverse-reachability for well_id, applicant_id, linked_sample_id)"
    roles: [Applicant, Driller, LabAnalyst, HealthOfficer]
    code: 200
    input: ["well_id?", "applicant_id?", "linked_sample_id?", "status?", "limit?", "offset?"]
    output: RealEstateTestRequirement[]
    side_effects: []
  - method: POST
    path: "/real-estate-requirements/{id}/link-sample"
    description: "Attach/supersede a candidate sample (OCC on version; window + safety checks)"
    roles: [Applicant]
    code: 200
    input: [linked_sample_id, expected_requirement_version]
    output: RealEstateTestRequirement
    side_effects: ["linked_sample_id set (supersedes prior)", "version += 1"]
  - method: POST
    path: "/real-estate-requirements/{id}/certify"
    description: "Certify the requirement as satisfied (requires a linked valid sample)"
    roles: [HealthOfficer]
    code: 200
    input: []
    output: RealEstateTestRequirement
    side_effects: ["status OPEN -> SATISFIED"]
  - method: POST
    path: "/real-estate-requirements/{id}/waive"
    description: "Waive the requirement"
    roles: [HealthOfficer]
    code: 200
    input: ["reason?"]
    output: RealEstateTestRequirement
    side_effects: ["status OPEN -> WAIVED"]

  # ---- Clock / Ops (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [HealthOfficer]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock = to_iso8601"]
  - method: POST
    path: "/_ops/expiry-sweep"
    description: "Expire past-due ISSUED permits (now >= expires_on) and OPEN requirements (now > closing_date)"
    roles: [HealthOfficer]
    code: 200
    input: []
    output: null
    side_effects: ["ConstructionPermit ISSUED -> EXPIRED where now >= expires_on", "RealEstateTestRequirement OPEN -> EXPIRED where now > closing_date"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Authenticated role not permitted for this endpoint" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, bad enum, or empty/invalid requested_analytes" }
  - { id: ERR_ANALYTE_OUT_OF_RANGE, http: 400, condition: "SampleResult nitrate_mg_l or lead_ppb is negative" }
  - { id: ERR_APPLICANT_NOT_FOUND, http: 404, condition: "Referenced applicant_id does not exist" }
  - { id: ERR_DRILLER_NOT_FOUND, http: 404, condition: "Referenced driller_id does not exist" }
  - { id: ERR_AQUIFER_NOT_FOUND, http: 404, condition: "Referenced aquifer_id does not exist" }
  - { id: ERR_WELL_NOT_FOUND, http: 404, condition: "Referenced well_id does not exist" }
  - { id: ERR_PERMIT_NOT_FOUND, http: 404, condition: "Referenced construction permit does not exist" }
  - { id: ERR_DRILLER_LOG_NOT_FOUND, http: 404, condition: "Referenced driller log does not exist" }
  - { id: ERR_SAMPLE_NOT_FOUND, http: 404, condition: "Referenced water sample does not exist" }
  - { id: ERR_RESULT_NOT_FOUND, http: 404, condition: "Referenced sample result does not exist" }
  - { id: ERR_ADVISORY_NOT_FOUND, http: 404, condition: "Referenced advisory does not exist" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "Referenced contamination case does not exist" }
  - { id: ERR_ABANDONMENT_NOT_FOUND, http: 404, condition: "Referenced abandonment permit does not exist" }
  - { id: ERR_REQUIREMENT_NOT_FOUND, http: 404, condition: "Referenced real-estate test requirement does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition (generic)" }
  - { id: ERR_PERMIT_NOT_ISSUED, http: 409, condition: "Driller log filed against a construction permit that is not ISSUED" }
  - { id: ERR_REQUIREMENT_NOT_OPEN, http: 409, condition: "link-sample/certify on a requirement that is not OPEN" }
  - { id: ERR_WELL_NOT_ACTIVE, http: 409, condition: "Water-sample submission or abandonment approval when the well is not ACTIVE" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_requirement_version does not match current RealEstateTestRequirement.version" }
  - { id: ERR_SELF_CLOSE_FORBIDDEN, http: 403, condition: "Closing officer X-User-ID equals the case's opened_by_officer_id (segregation of duties)" }
  - { id: ERR_SETBACK_VIOLATION, http: 422, condition: "Permit approval with setback below the aquifer minimum (septic or property line)" }
  - { id: ERR_DRILLER_LICENSE_INVALID, http: 422, condition: "Driller SUSPENDED or license expired at the log/completion instant" }
  - { id: ERR_DRILLER_NOT_ASSIGNED, http: 409, condition: "Driller log driller_id does not equal the permit's assigned driller_id" }
  - { id: ERR_APPLICANT_MISMATCH, http: 409, condition: "Permit/abandonment applicant_id does not equal Well.applicant_id" }
  - { id: ERR_SAMPLE_OUTSIDE_VALIDITY_WINDOW, http: 422, condition: "Linked sample collected after closing_date or more than REAL_ESTATE_TEST_VALIDITY_DAYS (=90) before it" }
  - { id: ERR_DRILLER_SCHEDULE_CONFLICT, http: 409, condition: "Issuing a permit whose buffered driller window overlaps another ISSUED/COMPLETED permit's window" }
  - { id: ERR_ADVISORY_WINDOW_OVERLAP, http: 409, condition: "Manual advisory overlaps an existing ACTIVE advisory of the same type on the well (closed interval)" }
  - { id: ERR_SAMPLE_NOT_SAFE, http: 422, condition: "Linked sample is not RESULTED or its confirmed level is not SAFE" }
  - { id: ERR_ABANDONMENT_BLOCKED, http: 409, condition: "Abandonment approval blocked by a non-terminal construction permit on the well" }
  - { id: ERR_FEE_UNPAID, http: 402, condition: "Permit approval attempted before the fee is paid" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Applicant
    description: "Well owner. Registers wells, submits construction/abandonment permits, pays fees, submits water samples, creates real-estate requirements and links samples."
    identity: "entity_backed:Applicant"
    exclusive_operations:
      - "POST /wells"
      - "POST /construction-permits"
      - "POST /construction-permits/{id}/pay"
      - "POST /water-samples"
      - "POST /abandonment-permits"
      - "POST /real-estate-requirements/{id}/link-sample"
    shared_operations:
      - "POST /real-estate-requirements (with HealthOfficer)"
      - "GET reads (wells, permits, samples, results, advisories, cases, requirements, drillers, aquifers)"
  - name: Driller
    description: "Licensed well driller. Files driller logs and completes approved abandonments."
    identity: "entity_backed:Driller"
    exclusive_operations:
      - "POST /driller-logs"
      - "POST /abandonment-permits/{id}/complete"
    shared_operations:
      - "GET reads (as above)"
  - name: LabAnalyst
    description: "Laboratory analyst (operational, not entity-backed). Receives samples, runs analysis, records results."
    identity: "opaque"
    exclusive_operations:
      - "POST /water-samples/{id}/receive"
      - "POST /water-samples/{id}/begin-analysis"
      - "POST /sample-results"
    shared_operations:
      - "GET reads (as above)"
  - name: HealthOfficer
    description: "Regulatory officer (operational, not entity-backed). Manages aquifers/applicants/drillers, reviews permits, issues advisories, runs contamination cases, certifies real-estate requirements, drives the clock and expiry sweeps. X-User-ID is tracked for segregation of duties on contamination-case close."
    identity: "opaque"
    exclusive_operations:
      - "POST /aquifers, POST /applicants, POST /drillers, POST /drillers/{id}/suspend"
      - "POST /wells/{id}/deactivate, POST /wells/{id}/reactivate"
      - "POST /construction-permits/{id}/approve|deny|issue"
      - "POST /water-samples/{id}/invalidate"
      - "POST /advisories, POST /advisories/{id}/lift"
      - "POST /contamination-cases, POST /contamination-cases/{id}/transition, POST /contamination-cases/{id}/close"
      - "POST /abandonment-permits/{id}/approve|deny"
      - "POST /real-estate-requirements/{id}/certify|waive"
      - "POST /_clock/set_current_utc, POST /_ops/expiry-sweep"
    shared_operations:
      - "POST /real-estate-requirements (with Applicant)"
      - "GET reads (as above)"
