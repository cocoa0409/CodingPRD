  # --- Incidents ---
  - method: POST
    path: "/api/incident-reports"
    description: "File an incident report against a corridor run"
    roles: [IncidentReviewer]
    code: 201
    input: [corridor_id, run_plan_id, severity, "recordable_incidents?", "corrective_action_count?", "review_days_allowed?", "reproduction_case_kind?", "logs_populated?"]
    output: IncidentReport
    side_effects:
      - "report_status = FILED"
      - "incident_tier recomputes from the corridor weather profile"
      - "regulatory_notice_required recomputes"
      - "report_sequence_number assigned"
      - "owning Carrier.recordable_incidents_last_epoch recomputes"

  - method: GET
    path: "/api/incident-reports"
    description: "List incident reports, optionally filtered"
    roles: [Any]
    code: 200
    input: ["corridor_id?", "carrier_id?", "severity?", "report_status?", "limit?", "offset?"]
    output: "IncidentReport[]"
    side_effects: []

  - method: GET
    path: "/api/incident-reports/{id}"
    description: "Get an incident report with its tier and notice flags"
    roles: [Any]
    code: 200
    input: []
    output: IncidentReport
    side_effects: []

  - method: POST
    path: "/api/incident-reports/{id}/investigate"
    description: "Open the investigation on a filed incident"
    roles: [IncidentReviewer]
    code: 200
    input: []
    output: IncidentReport
    side_effects:
      - "report_status → INVESTIGATING"
      - "owning corridor.has_blocking_incident recomputes"
      - "owning corridor.posture recomputes — a CRITICAL report on an ACTIVE corridor forces LIMITED"
      - "owning corridor.corridor_status recomputes — a third CRITICAL report inside the review window forces SUSPENDED"

  - method: POST
    path: "/api/incident-reports/{id}/corrective-action"
    description: "Record the corrective action closing out an investigation"
    roles: [IncidentReviewer]
    code: 200
    input: [corrective_action_count]
    output: IncidentReport
    side_effects:
      - "report_status → CORRECTIVE_ACTION"
      - "regulatory_notice_required recomputes"
      - "review_days_allowed recomputes to 3 when notice is required, else 5"
      - "owning corridor.has_blocking_incident recomputes"

  - method: POST
    path: "/api/incident-reports/{id}/close"
    description: "Close an incident once corrective action is on file"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: IncidentReport
    side_effects:
      - "report_status → CLOSED"
      - "owning corridor.has_blocking_incident recomputes — a LIMITED corridor may recover to ACTIVE"
      - "owning Carrier.recordable_incidents_last_epoch and incident_band recompute"
      - "owning Carrier.carrier_status recomputes — a fifth recordable incident forces SUSPENDED"

  - method: POST
    path: "/api/incident-reports/{id}/submit"
    description: "Submit a notice-required incident to the state authority"
    roles: [IncidentReviewer]
    code: 200
    input: []
    output: IncidentReport
    side_effects:
      - "report_status → SUBMITTED"
      - "owning corridor.has_blocking_incident recomputes"
      - "owning Carrier.recordable_incidents_last_epoch and incident_band recompute"

  - method: POST
    path: "/api/incident-reports/{id}/reopen"
    description: "Reopen a closed or submitted incident inside its review window"
    roles: [IncidentReviewer]
    code: 200
    input: []
    output: IncidentReport
    side_effects:
      - "report_status → INVESTIGATING"
      - "owning corridor.has_blocking_incident recomputes"
      - "owning corridor.posture recomputes"

