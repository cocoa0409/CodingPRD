      - name: ordering_statutory_entry_after_the_notice_window_updates_both_rows
        claim_type: Side Effect Execution
        grounds:
          - state_machines.SiteAccess.transitions.REQUESTED_to_ENTRY_ORDERED
          - state_machines.Well.access_status.transitions.ACCESS_PENDING_to_ENTRY_ORDERED
          - validations[priority 51]
        distinguishing_aspect: |
          At the exact instant 2026-08-31T00:00:00Z the clock is no longer strictly before
          window_end_at, so ORDER_ENTRY succeeds and fires all four declared side effects in one
          call: SiteAccess ENTRY_ORDERED, legal_authority_citation stored, resolved_at set, and the
          Well's independent access_status dimension mirrored to ENTRY_ORDERED.
        test_recipe:
          setup:
            - "one REQUESTED STATUTORY_ENTRY SiteAccess with waiting_period_days 30 created at the 2026-08-01T00:00:00Z default clock, so window_end_at == 2026-08-31T00:00:00Z"
            - "the clock is then moved to exactly 2026-08-31T00:00:00Z"
          setup_api_calls:
