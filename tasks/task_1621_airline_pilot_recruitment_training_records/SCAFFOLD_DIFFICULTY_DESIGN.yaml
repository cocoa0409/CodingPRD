            - { call: "POST /pilot-training/equipment", payload: { code: "BCS3", name: "A220-300", simulator_cost_per_hour_cents: 45000, ioe_hours_required: 10, landings_required_90d: 3 }, as: TrainingCoordinator, captures: { eq_id: $.data.id } }
