              payload: { qei_id: "${qei_id}", qalicb_id: "${la_qalicb_id}", loan_class: "A", principal_cents: 40000000 }
              as: CDESponsor
              as_user_id: "${cde_id}"
            - call: "POST /nmtc/qlicis"
              payload: { qei_id: "${qei_id}", qalicb_id: "${ms_qalicb_id}", loan_class: "A", principal_cents: 40000000 }
              as: CDESponsor
              as_user_id: "${cde_id}"
