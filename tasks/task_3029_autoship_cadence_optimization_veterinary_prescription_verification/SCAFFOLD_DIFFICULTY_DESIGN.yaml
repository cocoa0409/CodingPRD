              as: Customer
              captures: { pet_i2: "$.data.id" }
            - call: "POST /v1/autoship-plans"
              payload: { pet_id: "${pet_i2}", blackout_start_date: "2026-09-30T00:00:00Z", blackout_end_date: "2026-10-06T00:00:00Z" }
              as: Customer
              as_user_id: "${pet_i2}"
              captures: { plan_i2: "$.data.id" }
            - call: "POST /v1/autoship-plans/${plan_i2}/items"
              payload: { product_id: "${prod_i2}", cadence_days: 28, default_quantity: 1 }
              as: Customer
              as_user_id: "${pet_i2}"
              captures: { item_i2: "$.data.id" }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-29T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /v1/autoship-plans/${plan_i2}"
              payload: {}
              as: Customer
              as_user_id: "${pet_i2}"
