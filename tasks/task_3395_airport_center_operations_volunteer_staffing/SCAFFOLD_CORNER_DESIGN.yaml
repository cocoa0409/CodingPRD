              payload: { kind: "ENTERTAINMENT_TOUR", name: "Tour X", start_at: "2026-10-01T14:00:00Z", end_at: "2026-10-01T16:00:00Z", min_volunteers: 0, required_security_level: 1, talent_agreement_signed: true }
