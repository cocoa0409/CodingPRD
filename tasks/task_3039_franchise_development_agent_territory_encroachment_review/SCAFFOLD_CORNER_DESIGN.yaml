          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "OCC on Territory.version: after a first application creation bumps the territory to version 3, a second create carrying the stale expected_territory_version observed before is rejected with 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Logical clock default; territory assigned to DA (version 2 after assign); first application created with expected_territory_version 2 (bumps territory to 3)."]
          setup_api_calls:
