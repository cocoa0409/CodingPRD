              as: JuryChair
            - call: "POST /markets/${m9_id}/assignments"
              payload: { booth_id: "${b9_id}", application_id: "${a9_id}" }
              as: MarketOperator
              captures: { asg9_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-05T00:00:00Z" }
              as: MarketOperator
            - call: "GET /markets/${m9_id}"
              as: MarketOperator
              captures: { m9_ver: $.data.version }
