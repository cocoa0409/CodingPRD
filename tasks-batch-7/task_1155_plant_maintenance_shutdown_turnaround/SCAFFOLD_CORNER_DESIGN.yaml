  - section: validations
    instances:
      - name: missing_auth_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A call without X-User-Role/X-User-ID headers is rejected 401 before any role check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            # negative test: no auth headers at all (`as:` intentionally absent)
            - { call: "POST /turnarounds", payload: { name: "TA-NA", plant_unit: "CRU-2", planned_start: "2026-06-10T00:00:00Z", planned_end: "2026-07-10T00:00:00Z", authorized_budget_cents: 500000, contingency_budget_cents: 100000 }, captures: { err: "$.data.error_id" } }
          assert:
            - "rejected with ERR_UNAUTHENTICATED (401)"

      - name: planner_cannot_freeze_scope_returns_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "freeze-scope is exclusive to TurnaroundManager; a Planner call is rejected 403 ERR_FORBIDDEN before existence/state checks matter."
        test_recipe:
          setup: ["turnaround PLANNING with one PROPOSED work item"]
          setup_api_calls:
            - { call: "POST /turnarounds", payload: { name: "TA-FB", plant_unit: "CRU-2", planned_start: "2026-06-10T00:00:00Z", planned_end: "2026-07-10T00:00:00Z", authorized_budget_cents: 500000, contingency_budget_cents: 100000 }, as: TurnaroundManager, captures: { t_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/work-items", payload: { title: "Anchor", system_area: "A", work_type: "CORRECTIVE", risk_class: "A", estimated_hours: 10, estimated_cost_cents: 10000 }, as: Planner }
          trigger:
            - { call: "POST /turnarounds/${t_id}/freeze-scope", payload: { scope_cutoff_count: 1 }, as: Planner, captures: { err: "$.data.error_id" } }
          assert:
            - "rejected with ERR_FORBIDDEN (403); turnaround stays PLANNING"

      - name: cross_scope_isolation_reference_rejected
        claim_type: cross_entity
        grounds: ["validations[priority=6]", "errors[ERR_CROSS_SCOPE_REFERENCE]"]
        distinguishing_aspect: "A permit on a work item of turnaround T1 referencing an isolation owned by turnaround T2 fails with ERR_CROSS_SCOPE_REFERENCE (referential scope check precedes state checks)."
        test_recipe:
          setup: ["T1 SCOPE_FROZEN with W1 FROZEN; T2 SCOPE_FROZEN with isolation I2 (equipment V-201)"]
          setup_api_calls:
