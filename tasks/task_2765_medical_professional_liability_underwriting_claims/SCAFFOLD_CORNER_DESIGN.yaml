              captures: { pol_hi: $.data.id, pol_hi_v0: $.data.version }
          trigger:
            - call: "POST /mpl/policies/${pol_hi}/terms"
              payload: { effective_date: "2026-08-01", expiration_date: "2027-08-01", expected_policy_version: "${pol_hi_v0}" }
              as: UnderwritingOfficer
