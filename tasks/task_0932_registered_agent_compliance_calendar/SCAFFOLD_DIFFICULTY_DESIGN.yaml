  - rule_id: compensating_invariant
    instances:
      - name: abandon_reverses_service_portion_and_conserves_payment_funds
        grounds:
          - calculations.client_funds_identity
          - calculations.refund_split_on_rejection
          - state_machines.Filing.REJECTED_to_ABANDONED
          - state_machines.Payment.CAPTURED_to_PARTIALLY_REFUNDED
          - entities.Client.fields.credit_balance_cents
        distinguishing_aspect: |
          The conserved quantity is MONEY: after capture + allocate + reject + abandon,
          Payment.captured_amount_cents (9900) still equals allocated (5000) +
          unallocated (0) + refunded (4900), and Client.credit_balance_cents equals the
          sum of refunded_amount_cents over the client's payments. The sibling instance
          conserves a cardinality, not money.
