      - name: certificate_acceptance_updates_structure_elevation_and_compliance
        claim_type: side_effect_execution
        grounds:
          - state_machines.ElevationCertificate.SUBMITTED_to_ACCEPTED
          - calculations.derived_deadlines_and_loop_limits
          - entities.Structure.fields.lowest_floor_elevation_ft
        distinguishing_aspect: |
          Accepting a FINISHED_CONSTRUCTION certificate executes all three declared side
          effects at once: accepted_at 2026-08-01T00:00:00Z with retention_review_due_at
          exactly five calendar years later (2031-08-01T00:00:00Z), Structure
          lowest_floor_elevation_ft 14.0 copied from the normalized value, and
          compliance_status COMPLIANT because the structure carries no active violation.
        test_recipe:
          setup:
            - "Canonical base fixture; permit ISSUED (requirement 13.5); FINISHED_CONSTRUCTION certificate filed at 14.0 ft NAVD88 (margin 0.5)."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
