            - "Creator.${creator_id}.lifetime_refunded_cents == 20000"

      - name: coupon_redemption_count_conservation_on_cancel
        grounds:
          - entities.Coupon.fields.redeemed_count
          - state_machines.Enrollment.billing_status.PENDING_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity = Coupon.redeemed_count (a count, not money). Enroll-with-coupon (+1) then
          cancel before payment (-1) returns redeemed_count to 0 with no drift. Different conserved-quantity
          type than the money ledger invariant.
        test_recipe:
          setup:
            - "Published course, ONE_TIME 20000, ACTIVE coupon C10 (PERCENT 10, min 0); one enrollment created with C10 (unpaid), redeemed_count==1 pre-cancel"
          setup_api_calls:
            - call: "POST /creators"
              payload: { email: "c@x.com", display_name: "C" }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
            - call: "POST /students"
              payload: { email: "s@x.com", full_name: "S" }
              as: PlatformAdmin
              captures: { student_id: $.data.id }
            - call: "POST /courses"
              payload: { creator_id: "${creator_id}", title: "Course A" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { course_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${course_id}", title: "L1", position: 1 }
              as: Creator
              as_user_id: "${creator_id}"
            - call: "POST /price-plans"
              payload: { course_id: "${course_id}", plan_type: "ONE_TIME", amount_cents: 20000 }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /coupons"
              payload: { course_id: "${course_id}", code: "C10", discount_type: "PERCENT", discount_value: 10, max_redemptions: 5, min_purchase_cents: 0, starts_at: "2026-01-01T00:00:00Z", expires_at: "2026-12-31T00:00:00Z" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { coupon_id: $.data.id }
            - call: "POST /courses/${course_id}/set-status"
              payload: { status: "PUBLISHED" }
              as: Creator
              as_user_id: "${creator_id}"
            - call: "POST /enrollments"
              payload: { student_id: "${student_id}", course_id: "${course_id}", price_plan_id: "${plan_id}", coupon_code: "C10" }
              as: Student
              as_user_id: "${student_id}"
              captures: { enrollment_id: $.data.id }
          trigger:
            - call: "POST /enrollments/${enrollment_id}/cancel"
              payload: {}
              as: Student
              as_user_id: "${student_id}"
          assert:
            - "Coupon.${coupon_id}.redeemed_count == 0"
