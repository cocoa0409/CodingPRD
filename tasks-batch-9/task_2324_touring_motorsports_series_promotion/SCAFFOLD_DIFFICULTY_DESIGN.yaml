  - rule_id: transitive_cascade
    instances:
      - name: withdrawing_a_confirmed_booking_unwinds_stop_orders_tiers_and_season_budget
        grounds:
          - state_machines.VenueBooking.CONFIRMED_to_WITHDRAWN
          - state_machines.TourStop.ON_SALE_to_CANCELLED
          - state_machines.TicketOrder.PENDING_to_VOID
          - state_machines.TicketOrder.PAID_to_REFUNDED
          - calculations.stop_readiness_posture
          - calculations.marketing_allocation_admission
        distinguishing_aspect: |
          CASCADE A, five links deep from a single write on a grandparent aggregate:
          VenueBooking -> TourStop (both state dimensions) -> TicketOrder (two different terminal
          states depending on the order's own status) -> TicketTier seat pools and TourStop money
          counters -> MarketingAllocation release, which reaches back up to the Season budget ledger
