          trigger:
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "601", amount_cents: 50100, payee_name_raw: "OMEGA CO", channel: "TELLER", presented_at: "2026-08-03T10:00:00Z" }, as: BankOps, captures: { a_st: $.data.status, a_res: $.data.match_result } }
