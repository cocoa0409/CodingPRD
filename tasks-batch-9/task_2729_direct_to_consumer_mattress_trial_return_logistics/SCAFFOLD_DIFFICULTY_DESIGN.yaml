              as: TrialSupportAgent
              captures: { order_id: $.data.id }
            - call: "POST /trial-orders/${order_id}/dispatch"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /trial-orders/${order_id}/deliver"
              payload: {}
              as: LogisticsCoordinator
              captures: { order_v_after_deliver: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-21T23:59:59Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /return-cases"
              payload: { order_id: "${order_id}", reason_code: "COMFORT" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-22T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /return-cases"
              payload: { order_id: "${order_id}", reason_code: "COMFORT" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rc_id: $.data.id }
          assert:
            - "TrialOrder.${order_id}.break_in_ends_at == 2026-08-22T00:00:00Z"
            - "trigger call 1 (clock 2026-08-21T23:59:59Z, one second early) -> 422 with error_id ERR_BREAK_IN_NOT_ELAPSED"
            - "TrialOrder.${order_id}.version == ${order_v_after_deliver} after trigger call 1 (the refusal wrote nothing)"
            - "trigger call 3 (clock exactly 2026-08-22T00:00:00Z) -> 201"
            - "ReturnCase.${rc_id}.logistics_status == REQUESTED and financial_status == PENDING"
            - "ReturnCase.${rc_id}.requested_at == 2026-08-22T00:00:00Z and nights_used == null"
            - "TrialOrder.${order_id}.trial_status == RETURN_REQUESTED"

