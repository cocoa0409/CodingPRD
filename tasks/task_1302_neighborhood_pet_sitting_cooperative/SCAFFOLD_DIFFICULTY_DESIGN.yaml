            - call: "POST /coop/members/${x_id}/references"
              payload: { referee_member_id: "${f2_id}", relationship_years: 2, attestation_text: "F2 vouches for applicant X." }
              as: CoopAdmin
              captures: { ref_xf2: $.data.id }
            - call: "POST /coop/members/${x_id}/submit-references"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/member-references/${ref_xf1}/accept"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/member-references/${ref_xf2}/accept"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/members/${f1_id}/references"
