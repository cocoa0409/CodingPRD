  - rule_id: non_linear_state_machine
    instances:
      - name: witness_churn_cycle_bay_scheduled_confirmed_twice_with_two_different_decline_arms
        grounds:
          - state_machines.FactoryAcceptanceTest.BAY_SCHEDULED->WITNESS_CONFIRMED
          - state_machines.FactoryAcceptanceTest.WITNESS_CONFIRMED->BAY_SCHEDULED
          - state_machines.WitnessAssignment.CONFIRMED->DECLINED
          - state_machines.WitnessAssignment.INVITED->DECLINED
          - state_machines.WitnessAssignment.DECLINED->INVITED
          - calculations.order_production_posture
        distinguishing_aspect: |
          One and the same endpoint (POST /witness-assignments/{id}/decline) has two structurally
          different arms: from CONFIRMED it decrements fat.confirmed_witness_count and drags the FAT
          backwards WITNESS_CONFIRMED -> BAY_SCHEDULED (adding posture reason WITNESS_MISSING), while
          from INVITED it changes nothing outside the assignment. The FAT therefore visits
          BAY_SCHEDULED three times and WITNESS_CONFIRMED twice without ever losing its bay window,
          and posture oscillates OPEN -> RESTRICTED -> OPEN.
        test_recipe:
          setup:
            - "Order TX-NLS-0005 (rated_kv 69, contract_value_cents 3000000) driven to fulfillment_status IN_PRODUCTION with one COMMITTED allocation, so no other posture reason code can be collected."
            - "One TestBay BAY-NL1 (max_kv 145, changeover_buffer_hours 4) and one FAT with witness_required true, test_duration_hours 8, window_start_at 2026-02-10T08:00:00Z (window_end_at 2026-02-10T20:00:00Z)."
            - "One WitnessParty WP-NL1 with daily_witness_capacity 1 and credential_expires_at 2027-01-01T00:00:00Z; one WitnessAssignment with travel_region NA so blackout_days is 0."
            - "The logical clock stays at 2026-02-01T00:00:00Z for the whole recipe, which is strictly before window_start_at so every reinvite is legal."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /engineered-orders"
              payload: { order_number: "TX-NLS-0005", customer_name: "Basin Electric Coop", product_family: "POWER_TRANSFORMER", rated_kv: 69, contract_value_cents: 3000000, sold_at: "2026-02-01T00:00:00Z", promised_ship_at: "2026-12-01T00:00:00Z", owning_sales_user_id: "u_sales_1" }
              as: ContractAdmin
              captures: { ord_id: $.data.id, ord_v0: $.data.version }
            - call: "POST /engineered-orders/${ord_id}/submittal-drawings"
              payload: { drawing_set_code: "DS-N", authored_by_user_id: "u_de_1", expected_engineered_order_version: "${ord_v0}" }
              as: DesignEngineer
              captures: { dwg_id: $.data.id }
            - call: "POST /submittal-drawings/${dwg_id}/submit"
              payload: {}
              as: DesignEngineer
            - call: "POST /submittal-drawings/${dwg_id}/begin-review"
              payload: {}
              as: CustomerReviewer
              as_user_id: "u_cr_1"
            - call: "POST /submittal-drawings/${dwg_id}/disposition"
              payload: { disposition: "APPROVED", reviewed_by_user_id: "u_cr_1", notes_count: 0 }
              as: CustomerReviewer
              as_user_id: "u_cr_1"
            - call: "POST /suppliers"
              payload: { supplier_code: "SUP-N05", legal_name: "Basin Windings", region: "NA" }
              as: PlantAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /suppliers/${sup_id}/long-lead-components"
