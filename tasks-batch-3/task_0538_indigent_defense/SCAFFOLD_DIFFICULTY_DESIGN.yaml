          assert:
            - "HTTP 409 and data.error_id == ERR_ATTORNEY_NOT_ACTIVE"
            - "Case.${c}.status remains SCREENED; no Assignment created"

      - name: panel_voucher_submit_requires_case_disposed
        grounds:
          - state_machines.Voucher.DRAFT_to_SUBMITTED
          - "errors[ERR_CASE_NOT_DISPOSED]"
          - entities.Case.fields.status
        distinguishing_aspect: "Voucher DRAFT -> SUBMITTED for a PANEL_FEE voucher is blocked while the Case.status is only ASSIGNED (ERR_CASE_NOT_DISPOSED) — the Voucher transition depends on the Case entity's state (pair Voucher/Case, distinct from Case/Attorney)."
        test_recipe:
          setup:
            - "ASSIGNED (not disposed) case; a PANEL_FEE voucher DRAFT."
          setup_api_calls:
            - { call: "POST /defender-offices", payload: { name: "PD-X2", annual_voucher_budget_cents: 100000000, recoupment_basis: "SCHEDULE" }, as: SupervisingAttorney, captures: { off: $.data.id } }
            - { call: "POST /attorneys", payload: { office_id: "${off}", name: "Vic", attorney_type: "PANEL", bar_number: "XX2", hourly_rate_cents: 15000, max_weighted_caseload: 10.0 }, as: SupervisingAttorney, captures: { att: $.data.id } }
            - { call: "POST /cases", payload: { office_id: "${off}", defendant_name: "Vi", charge_class: "MISDEMEANOR" }, as: IntakeClerk, captures: { c: $.data.id } }
            - { call: "POST /financial-screenings", payload: { case_id: "${c}", household_income_cents: 800000, household_size: 2, asset_value_cents: 0 }, as: IntakeClerk, captures: { scr: $.data.id } }
            - { call: "POST /financial-screenings/${scr}/decide", payload: {}, as: ScreeningOfficer, as_user_id: "officer-1" }
            - { call: "POST /conflict-checks", payload: { case_id: "${c}", attorney_id: "${att}", co_defendant_names: [] }, as: AssignmentCoordinator }
            - { call: "POST /assignments", payload: { case_id: "${c}", attorney_id: "${att}" }, as: AssignmentCoordinator }
            - { call: "POST /vouchers", payload: { case_id: "${c}", attorney_id: "${att}", voucher_type: "PANEL_FEE", claimed_hours: 5 }, as: Attorney, as_user_id: "${att}", captures: { v: $.data.id } }
          trigger:
            - { call: "POST /vouchers/${v}/submit", payload: {}, as: Attorney, as_user_id: "${att}", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409 and data.error_id == ERR_CASE_NOT_DISPOSED"
            - "Voucher.${v}.status remains DRAFT"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: attorney_calendar_travel_buffer
        grounds:
          - "validations[priority=10]"
          - "errors[ERR_ATTORNEY_SCHEDULE_CONFLICT]"
          - entities.CourtEvent.fields.attorney_id
          - entities.CourtEvent.fields.scheduled_start
        distinguishing_aspect: "For the same attorney, a new event 15 minutes after an existing event (10:15 vs 10:00 end) is rejected, but 30 minutes after (10:30) is allowed — half-open intervals PLUS a 30-min travel buffer on the Attorney resource."
        test_recipe:
          setup:
            - "Attorney with two assigned cases; event1 for caseA1 in room1 2026-06-10T09:00Z-10:00Z."
          setup_api_calls:
            - { call: "POST /defender-offices", payload: { name: "PD-O1", annual_voucher_budget_cents: 100000000, recoupment_basis: "SCHEDULE" }, as: SupervisingAttorney, captures: { off: $.data.id } }
            - { call: "POST /attorneys", payload: { office_id: "${off}", name: "Ova", attorney_type: "STAFF", bar_number: "OO1", hourly_rate_cents: 15000, max_weighted_caseload: 10.0 }, as: SupervisingAttorney, captures: { att: $.data.id } }
            - { call: "POST /courtrooms", payload: { name: "Room 1", courthouse: "Main" }, as: SupervisingAttorney, captures: { room1: $.data.id } }
            - { call: "POST /courtrooms", payload: { name: "Room 2", courthouse: "Annex" }, as: SupervisingAttorney, captures: { room2: $.data.id } }
            - { call: "POST /cases", payload: { office_id: "${off}", defendant_name: "A1", charge_class: "MISDEMEANOR" }, as: IntakeClerk, captures: { c1: $.data.id } }
            - { call: "POST /cases", payload: { office_id: "${off}", defendant_name: "A2", charge_class: "MISDEMEANOR" }, as: IntakeClerk, captures: { c2: $.data.id } }
            - { call: "POST /financial-screenings", payload: { case_id: "${c1}", household_income_cents: 800000, household_size: 2, asset_value_cents: 0 }, as: IntakeClerk, captures: { s1: $.data.id } }
            - { call: "POST /financial-screenings", payload: { case_id: "${c2}", household_income_cents: 800000, household_size: 2, asset_value_cents: 0 }, as: IntakeClerk, captures: { s2: $.data.id } }
            - { call: "POST /financial-screenings/${s1}/decide", payload: {}, as: ScreeningOfficer, as_user_id: "officer-1" }
            - { call: "POST /financial-screenings/${s2}/decide", payload: {}, as: ScreeningOfficer, as_user_id: "officer-1" }
            - { call: "POST /conflict-checks", payload: { case_id: "${c1}", attorney_id: "${att}", co_defendant_names: [] }, as: AssignmentCoordinator }
            - { call: "POST /conflict-checks", payload: { case_id: "${c2}", attorney_id: "${att}", co_defendant_names: [] }, as: AssignmentCoordinator }
            - { call: "POST /assignments", payload: { case_id: "${c1}", attorney_id: "${att}" }, as: AssignmentCoordinator }
            - { call: "POST /assignments", payload: { case_id: "${c2}", attorney_id: "${att}" }, as: AssignmentCoordinator }
            - { call: "POST /court-events", payload: { case_id: "${c1}", courtroom_id: "${room1}", event_type: "MOTION_HEARING", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T10:00:00Z" }, as: AssignmentCoordinator }
          trigger:
            - { call: "POST /court-events", payload: { case_id: "${c2}", courtroom_id: "${room2}", event_type: "MOTION_HEARING", scheduled_start: "2026-06-10T10:15:00Z", scheduled_end: "2026-06-10T11:00:00Z" }, as: AssignmentCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /court-events", payload: { case_id: "${c2}", courtroom_id: "${room2}", event_type: "MOTION_HEARING", scheduled_start: "2026-06-10T10:30:00Z", scheduled_end: "2026-06-10T11:00:00Z" }, as: AssignmentCoordinator, captures: { st: $.data.status } }
          assert:
            - "First trigger (10:15, gap 15 min < 30) returns HTTP 409 data.error_id == ERR_ATTORNEY_SCHEDULE_CONFLICT"
            - "Second trigger (10:30, gap exactly 30 min) returns HTTP 201 with CourtEvent.status == SCHEDULED"

      - name: courtroom_overlap_adjacency_allowed
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_COURTROOM_DOUBLE_BOOKED]"
          - entities.CourtEvent.fields.courtroom_id
          - entities.CourtEvent.fields.scheduled_end
        distinguishing_aspect: "In one courtroom, a new event overlapping an existing one (09:30-10:30 vs 09:00-10:00) is rejected, but a back-to-back event starting exactly at the prior end (10:00-11:00) is allowed — half-open intervals with NO buffer on the Courtroom resource, distinct interval semantics from the Attorney buffer."
