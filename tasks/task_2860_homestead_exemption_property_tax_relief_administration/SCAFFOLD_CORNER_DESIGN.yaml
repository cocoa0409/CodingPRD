      - name: unregistered_role_header_is_unauthenticated
        claim_type: unauthenticated
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - endpoints[GET /parcels/{id}]
          - roles.AssessorAnalyst
        distinguishing_aspect: "Priority 1 fires before every other check, so a role string that is not one of the nine declared roles yields ERR_UNAUTHENTICATED 401 rather than ERR_UNAUTHORIZED_ROLE 403, and it stays 401 even when the addressed parcel does not exist — the identity gate outranks both the role gate and the existence gate."
        test_recipe:
          setup:
            - "One parcel exists so that the only defect in the first two trigger calls is the caller identity."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /parcels"
              payload: { apn: "P-0001", situs_address_normalized: "100 OAK ST NORTHFIELD ST 10001", county_zone: "NORTH", tax_year: 2026, base_year: 2020, base_year_value_cents: 30000000, market_value_cents: 40000000, assessment_cap_pct_bps: 200 }
              as: AssessorAnalyst
              as_user_id: "analyst-01"
              captures: { p1_id: $.data.id }
          trigger:
            - call: "GET /parcels/${p1_id}"
              payload: {}
              as: "CountyTreasurer"
              as_user_id: "treasurer-01"
              captures: { e_unauth_role: $.data.error_id }
            - call: "GET /parcels/${p1_id}"
              payload: {}
              as: ""
              as_user_id: ""
              captures: { e_unauth_missing: $.data.error_id }
            - call: "GET /parcels/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: "CountyTreasurer"
              as_user_id: "treasurer-01"
              captures: { e_unauth_missing_row: $.data.error_id }
            - call: "GET /parcels/${p1_id}"
              payload: {}
              as: AssessorAnalyst
              as_user_id: "analyst-01"
              captures: { apn_ok: $.data.apn }
          assert:
            - "${e_unauth_role} == ERR_UNAUTHENTICATED with HTTP 401 — CountyTreasurer is not one of the nine declared roles"
            - "${e_unauth_missing} == ERR_UNAUTHENTICATED with HTTP 401 — the call omits both the X-User-Role and X-User-ID headers"
            - "${e_unauth_missing_row} == ERR_UNAUTHENTICATED with HTTP 401, not ERR_PARCEL_NOT_FOUND: priority 1 preempts priority 6"
            - "${apn_ok} == P-0001 with HTTP 200 for the declared AssessorAnalyst, so the path and the parcel were valid throughout"

  # ===========================================================================
  # CROSS-CUTTING COMPLEXITY LAYERS — claim_type values are the layer names
  # declared in §0.2 complexity_layers: optimistic_concurrency,
  # cascading_side_effects, dual_variant_calculation, rate_threshold_triggers.
  # Both §1.2.1 concurrency_rules entries get their own OCC instance, each using
  # that rule's declared write_endpoint and occ_field.
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_parcel_version_from_an_annual_roll_run_blocks_the_determination
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[determination-stale-parcel]
          - validations[priority=8]
          - errors[ERR_STALE_PARCEL_VERSION]
          - endpoints[POST /exemption-applications/{id}/determine]
          - endpoints[POST /assessment-roll-runs]
          - calculations.parcel_value_decomposition
        distinguishing_aspect: "The stale view is produced by a third party rather than by a competing determination: the annual roll run rewrites the parcel's tax_year and capped value and bumps Parcel.version to 2, so the reviewer's cached version 1 is refused with ERR_STALE_PARCEL_VERSION 412, and after re-reading, the very same APPROVE mints a benefit computed from the NEW basis (8550000 from capped 34200000, not 8400000 from 33600000)."
        test_recipe:
          setup:
            - "P1 (base_year 2020, base_year_value 30000000, market 40000000, cap 200 bps) starts at tax_year 2026: capped = round_half_up(30000000 * (10000 + 200*6) / 10000) = 33600000, version 1."
            - "An application on P1 has reached UNDER_REVIEW with both registry checks MATCH, so the only obstacle is the version token."
            - "The roll to 2027 recomputes capped = round_half_up(30000000 * (10000 + 200*7) / 10000) = 34200000 and increments Parcel.version to 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /relief-programs"
              payload: { program_code: "HOMESTEAD_BASIC", name: "Basic Homestead", relief_pct_bps: 2500, max_exempt_value_cents: 10000000, statutory_lookback_years: 3, penalty_pct_bps: 1000, interest_pct_bps_per_year: 500, priority_rank: 10 }
              as: ProgramAdministrator
              as_user_id: "admin-01"
              captures: { prog_h_id: $.data.id }
            - call: "POST /parcels"
              payload: { apn: "P-0001", situs_address_normalized: "100 OAK ST NORTHFIELD ST 10001", county_zone: "NORTH", tax_year: 2026, base_year: 2020, base_year_value_cents: 30000000, market_value_cents: 40000000, assessment_cap_pct_bps: 200 }
              as: AssessorAnalyst
              as_user_id: "analyst-01"
              captures: { p1_id: $.data.id, p1_v: $.data.version, capped_2026: $.data.capped_value_cents }
            - call: "POST /taxpayer-accounts"
              payload: { full_name: "TERESA OWNER", date_of_birth: "1955-03-10", ssn_last4: "4321", mailing_address_normalized: "100 OAK ST NORTHFIELD ST 10001" }
              as: IntakeClerk
              as_user_id: "clerk-01"
              captures: { t_id: $.data.id }
            - call: "POST /ownership-records"
              payload: { parcel_id: "${p1_id}", taxpayer_id: "${t_id}", ownership_pct_bps: 10000, deed_recorded_date: "2019-06-01", occupancy_type: "PRIMARY_RESIDENCE", occupancy_start_date: "2019-06-01", source_system: "DEED_REGISTRY" }
              as: AssessorAnalyst
              as_user_id: "analyst-01"
            - call: "POST /_registry-records"
              payload: { taxpayer_id: "${t_id}", source: "VOTER_REGISTRY", record_effective_date: "2026-01-05", address_normalized: "100 OAK ST NORTHFIELD ST 10001" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /_registry-records"
              payload: { taxpayer_id: "${t_id}", source: "DEED_REGISTRY", record_effective_date: "2026-01-10", address_normalized: "100 OAK ST NORTHFIELD ST 10001" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /exemption-applications"
              payload: { parcel_id: "${p1_id}", taxpayer_id: "${t_id}", program_id: "${prog_h_id}", tax_year: 2026, claimed_occupancy_date: "2019-06-01", claimed_address_normalized: "100 OAK ST NORTHFIELD ST 10001" }
              as: IntakeClerk
              as_user_id: "clerk-01"
              captures: { app_id: $.data.id }
            - call: "POST /exemption-applications/${app_id}/submit"
              payload: {}
              as: IntakeClerk
              as_user_id: "clerk-01"
            - call: "POST /exemption-applications/${app_id}/verification-checks"
              payload: { source: "VOTER_REGISTRY" }
              as: ExemptionsReviewer
              as_user_id: "reviewer-01"
            - call: "POST /exemption-applications/${app_id}/verification-checks"
              payload: { source: "DEED_REGISTRY" }
              as: ExemptionsReviewer
              as_user_id: "reviewer-01"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /assessment-roll-runs"
              payload: { target_tax_year: 2027 }
              as: AssessorAnalyst
              as_user_id: "analyst-01"
              captures: { rolled: $.data.parcels_rolled_count }
          trigger:
            - call: "POST /exemption-applications/${app_id}/determine"
              payload: { outcome: "APPROVE", expected_parcel_version: "${p1_v}" }
              as: ExemptionsReviewer
              as_user_id: "reviewer-02"
              captures: { e_stale_parcel: $.data.error_id }
            - call: "GET /exemption-applications/${app_id}"
              payload: {}
              as: ExemptionsReviewer
              as_user_id: "reviewer-02"
              captures: { st_after_412: $.data.status }
            - call: "GET /parcels/${p1_id}"
              payload: {}
              as: ExemptionsReviewer
              as_user_id: "reviewer-02"
              captures: { p1_v2: $.data.version, capped_2027: $.data.capped_value_cents, assessed_2027: $.data.assessed_value_cents }
            - call: "POST /exemption-applications/${app_id}/determine"
              payload: { outcome: "APPROVE", expected_parcel_version: "${p1_v2}" }
              as: ExemptionsReviewer
              as_user_id: "reviewer-02"
              captures: { g1_id: $.data.resulting_grant_id }
          assert:
            - "${capped_2026} == 33600000 and ${p1_v} == 1 at parcel creation"
            - "${rolled} == 1 with certifications_lapsed_count == 0, grants_suspended_count == 0 and grants_lapsed_count == 0"
            - "${e_stale_parcel} == ERR_STALE_PARCEL_VERSION with HTTP 412"
            - "${st_after_412} == UNDER_REVIEW with resulting_grant_id == null — the 412 wrote nothing"
            - "${p1_v2} == 2, ${capped_2027} == 34200000 and ${assessed_2027} == 34200000 (tax_year now 2027)"
            - "the re-issued determine returns HTTP 200 with status APPROVED and GET /exemption-grants/${g1_id} shows benefit_amount_cents == 8550000 (min(10000000, 34200000 * 2500 / 10000))"
            - "GET /parcels/${p1_id} then shows version == 3, exempt_value_cents == 8550000, taxable_value_cents == 25650000 and exemption_status PARTIALLY_EXEMPT"

      - name: stale_expected_grant_version_on_a_second_port_returns_conflict
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[grant-port-stale-grant]
          - validations[priority=8]
          - errors[ERR_STALE_GRANT_VERSION]
          - endpoints[POST /exemption-grants/{id}/port]
          - calculations.portable_freeze_allocation
        distinguishing_aspect: "The second OCC rule guards a different parent entity with a different token: the first partial port increments ExemptionGrant.version to 2 and drops portable_balance_cents to 32600000, so replaying the identical port body with the pre-port expected_grant_version yields ERR_STALE_GRANT_VERSION 412 and allocates nothing, while re-reading the grant first lets the same transfer succeed and leaves the conserved sum 31600000 + 1000000 + 1000000 == 33600000."
