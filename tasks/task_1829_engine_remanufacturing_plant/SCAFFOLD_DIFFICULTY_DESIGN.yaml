            - call: "POST /work-orders/${w1}/operations"
              payload: { op_type: "CRANK_GRIND", sequence: 1, expected_work_order_version: "${w1v}" }
              as: ShopTechnician
              captures: { o1: $.data.id }
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "MACHINING" }
              as: ShopTechnician
            - call: "POST /operations/${o1}/perform"
              payload: { station_code: "STN-CRANK-9", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z", result: "PASS" }
              as: ShopTechnician
