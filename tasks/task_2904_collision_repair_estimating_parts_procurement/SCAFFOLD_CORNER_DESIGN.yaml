              as: ShopAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_id}", insurer_id: "${ins_id}", claim_number: "CLM-90047", vehicle_vin: "1HGCV1F30LA090047", vehicle_model_year: 2019, vehicle_make_model: "Honda Accord", initial_authorized_cents: 400000, deductible_cents: 25000 }
