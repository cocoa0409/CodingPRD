  - rule_id: non_linear_state_machine
    instances:

      - name: order_fulfillment_and_settlement_dimensions_advance_in_either_interleaving
        grounds:
          - state_machines.Order.fulfillment_status
          - state_machines.Order.settlement_status
          - entities.Order.fields.fulfillment_status
          - entities.Order.fields.settlement_status
          - endpoints.POST_orders_production
          - endpoints.POST_orders_disclose_fee
        distinguishing_aspect: |
          Order carries TWO independent status dimensions. This instance drives
          two identical orders through the SAME set of four triggers in OPPOSITE
          interleavings (order X: disclose-fee, START, READY; order Y: START,
          READY, disclose-fee) and shows both land on the identical combined
