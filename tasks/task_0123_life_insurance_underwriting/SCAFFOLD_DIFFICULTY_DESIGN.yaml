              payload: {}
              as: Underwriter
              as_user_id: "${u1_id}"
            - call: "POST /applications/${app_id}/mib-checks"
              payload: { mib_hit: false, rx_flag_count: 0 }
              as: Underwriter
              as_user_id: "${u1_id}"
            - call: "POST /applications/${app_id}/begin-review"
              payload: {}
              as: Underwriter
              as_user_id: "${u2_id}"
              captures: { ver_review: $.data.version }
            - call: "POST /applications/${app_id}/approve"
              payload: { expected_application_version: "${ver_review}" }
              as: Underwriter
              as_user_id: "${u2_id}"
              captures: { ver_offer: $.data.version }
            - call: "POST /applications/${app_id}/issue"
              payload: { expected_application_version: "${ver_offer}" }
              as: Underwriter
              as_user_id: "${u2_id}"
              captures: { policy_id: $.data.id }
            - call: "POST /policies/${policy_id}/beneficiaries"
              payload: { full_name: "Primary One", designation: "PRIMARY", share_pct: 100 }
              as: PolicyOwner
              as_user_id: "${appl_id}"
              captures: { ben1_id: $.data.id }
          trigger:
            - call: "POST /policies/${policy_id}/beneficiaries"
              payload: { full_name: "Primary Two", designation: "PRIMARY", share_pct: 100 }
              as: PolicyOwner
              as_user_id: "${appl_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 422"
            - "response data.error_id == ERR_BENEFICIARY_SHARE_INVALID"
            - "GET /policies/${policy_id}/beneficiaries returns exactly 1 PRIMARY beneficiary with share_pct 100 (tier total conserved at 100)"
