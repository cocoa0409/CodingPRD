            - call: "POST /residents/${r_id}/intake-observations"
              payload: { observation_date: "2026-08-20", meal_period: "LUNCH", intake_pct: 80 }
              as: ClinicalStaff
              as_user_id: "cs-1"
              captures: { o3_id: $.data.id }
            - call: "GET /residents/${r_id}"
              payload: {}
              as: ClinicalStaff
              captures: { avg_final: $.data.avg_intake_pct_7d, roll_final: $.data.rolling_30d_weight_change_pct, base_final: $.data.baseline_weight_change_pct, tray_final: $.data.tray_card_state }
            - call: "GET /residents/${r_id}/intake-observations"
              payload: {}
              as: ClinicalStaff
              captures: { obs_total: $.meta.total_count }
            - call: "GET /plan-of-care-reviews"
              payload: { resident_id: "${r_id}" }
              as: RegisteredDietitian
              captures: { rev_total: $.meta.total_count }
          assert:
            - "${avg_after_1} == null — the only observation so far (2026-08-13) falls outside the window, so the mean has no inputs"
            - "${avg_final} == 70.00 ((60 + 80) / 2); averaging all three would give 60.00, which is wrong"
            - "${roll_final} == 0.00 and ${base_final} == 0.00 — no observation carried a weight, so the current weight falls back to the 70.0 baseline"
            - "${obs_total} == 3 — the excluded observation is still stored and listable"
            - "${rev_total} == 0 and ${tray_final} == CLEAR — 70.00 is not below the strict 50.00 intake trigger"
      - name: intake_risk_score_on_leave_multiplier_halves_score
        claim_type: weighted_scoring
        grounds:
          - calculations.intake_risk_score
          - endpoints[POST /residents/{id}/dining-status]
        distinguishing_aspect: "All five weighted components contribute (30 + 30 + 10 + 5 + 0 = 75) and the ON_LEAVE multiplier is applied once at the end to the summed raw score, so the score halves to 37.50 rather than each component being halved and re-rounded."
        test_recipe:
          setup:
            - "One community and one ACTIVE resident with baseline_weight_kg 80.0."
            - "The resident has an APPROVED, ACTIVE MINCED_MOIST / SLIGHTLY_THICK order carrying exactly one therapeutic code (LOW_SODIUM)."
            - "An observation on 2026-08-02 (80.0 kg, intake 40) and one on 2026-08-20 (76.0 kg, intake 40) put rolling_30d_weight_change_pct at -5.00 and avg_intake_pct_7d at 40.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T08:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /communities"
              payload: { name: "Brookdale Aldergate", care_levels_offered: ["ASSISTED_LIVING"] }
              as: ProgramAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${c_id}", full_name: "Nadia Broussard", care_level: "ASSISTED_LIVING", baseline_weight_kg: 80.0 }
              as: ProgramAdministrator
              captures: { r_id: $.data.id, r_v: $.data.version }
            - call: "POST /diet-orders"
              payload: { resident_id: "${r_id}", texture_level: "MINCED_MOIST", liquid_consistency: "SLIGHTLY_THICK", therapeutic_codes: ["LOW_SODIUM"], expected_resident_version: "${r_v}" }
              as: ClinicalStaff
              as_user_id: "cs-1"
              captures: { do_id: $.data.id }
            - call: "POST /diet-orders/${do_id}/dietitian-review"
              payload: { decision: "APPROVE" }
              as: RegisteredDietitian
              as_user_id: "rd-1"
            - call: "POST /residents/${r_id}/intake-observations"
              payload: { observation_date: "2026-08-02", meal_period: "LUNCH", intake_pct: 40, weight_kg: 80.0 }
              as: ClinicalStaff
              as_user_id: "cs-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T08:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /residents/${r_id}/intake-observations"
              payload: { observation_date: "2026-08-20", meal_period: "LUNCH", intake_pct: 40, weight_kg: 76.0 }
              as: ClinicalStaff
              as_user_id: "cs-1"
              captures: { obs2_id: $.data.id }
            - call: "GET /residents/${r_id}"
              payload: {}
              as: ClinicalStaff
              captures: { roll_active: $.data.rolling_30d_weight_change_pct, avg_active: $.data.avg_intake_pct_7d, score_active: $.data.intake_risk_score, status_active: $.data.dining_status }
          trigger:
            - call: "POST /residents/${r_id}/dining-status"
              payload: { dining_status: "ON_LEAVE" }
              as: ProgramAdministrator
              captures: { status_leave: $.data.dining_status, score_leave: $.data.intake_risk_score, roll_leave: $.data.rolling_30d_weight_change_pct, avg_leave: $.data.avg_intake_pct_7d }
            - call: "POST /residents/${r_id}/dining-status"
              payload: { dining_status: "ACTIVE" }
              as: ProgramAdministrator
              captures: { status_back: $.data.dining_status, score_back: $.data.intake_risk_score }
          assert:
            - "${status_active} == ACTIVE, ${roll_active} == -5.00 and ${avg_active} == 40.00"
            - "${score_active} == 75.00 (weight 30 + intake 30 + texture MINCED_MOIST 2*5 + therapeutic min(10, 5*1) + liquid SLIGHTLY_THICK 0)"
            - "${status_leave} == ON_LEAVE and ${score_leave} == 37.50 (75 * 0.50, rounded once)"
            - "${roll_leave} == -5.00 and ${avg_leave} == 40.00 — the multiplier changes no component input"
            - "${status_back} == ACTIVE and ${score_back} == 75.00 — the multiplier is re-derived, not persisted as a discount"
      - name: ticket_amount_rounding_precision
        claim_type: precision
        grounds:
          - calculations.ticket_billed_amount.precision
        excluded_because:
          difficulty_instance: combinatorial_formula / ticket_amount_round_per_component_then_sum
          rationale: "That instance pins the round-each-component-then-sum order against the sum-then-round alternative on the TAKEOUT/DINNER sponsored case (1549 vs 1548)."
      - name: administrative_fee_tier_boundaries
        claim_type: tiered_pricing
        grounds:
          - calculations.reconciliation_net_billable.constants
        excluded_because:
          difficulty_instance: combinatorial_formula / net_billable_fee_tier_keyed_on_pre_fee_base
          rationale: "That instance walks the SMALL/MID boundary at ADMIN_TIER_SMALL_MAX and proves the tier is keyed on pre_fee_base_cents rather than on the net total it feeds."

      - name: venue_interval_adjacency_and_buffer
        claim_type: interval_merge
        grounds:
          - calculations.venue_capacity_conflict.precision
        excluded_because:
          difficulty_instance: resource_temporal_overlap / venue_half_open_interval_with_tail_buffer
          rationale: "That instance probes the buffered tail at the exclusive boundary minute and one minute earlier."
      - name: reconciliation_variant_divergence
        claim_type: variant_divergence
        grounds:
          - calculations.meal_count_reconciliation.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / meal_count_ledger_vs_census_billing
          rationale: "That instance builds one period in which the two variants diverge in both directions (a walk-in ticket and a never-seated reservation) and asserts both totals plus the signed variance."
      - name: weight_trend_variant_selection
        claim_type: variant_selection
        grounds:
          - calculations.resident_weight_trend.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / weight_trend_rolling_vs_baseline_clinical
          rationale: "That instance shows ROLLING_30D gating the plan-of-care trigger while BASELINE_ANCHORED reports a different number on the same observations."
      - name: tray_card_constraint_propagation_chain
        claim_type: constraint_propagation
        grounds:
          - calculations.tray_card_resolution.algorithm
        excluded_because:
          difficulty_instance: transitive_cascade / intake_observation_four_hop_monitoring_chain
          rationale: "That instance drives the propagation chain to its fixed point across four hops and asserts the resulting tray-card resolution."

  - section: validations
    instances:
      - name: duplicate_item_code_in_same_cycle_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=23]
          - errors[id=ERR_DUPLICATE_ITEM_CODE]
        distinguishing_aspect: "Uniqueness is scoped to the owning cycle and ignores every other column: the same item_code on a different day_index and meal_period is still a duplicate."
        test_recipe:
          setup:
            - "One community with a DRAFT MenuCycle holding item REG-COD at day_index 1 LUNCH."
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Brookdale Aldergate", care_levels_offered: ["ASSISTED_LIVING"] }
              as: ProgramAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /menu-cycles"
              payload: { community_id: "${c_id}", cycle_number: 1, week_count: 1, effective_start_date: "2026-08-10", effective_end_date: "2026-08-16" }
              as: DiningServicesManager
              captures: { mc_id: $.data.id }
            - call: "POST /menu-cycles/${mc_id}/items"
              payload: { item_code: "REG-COD", name: "Baked Cod", day_index: 1, meal_period: "LUNCH", base_texture: "REGULAR" }
              as: DiningServicesManager
              captures: { mi1_id: $.data.id }
          trigger:
            - call: "POST /menu-cycles/${mc_id}/items"
              payload: { item_code: "REG-COD", name: "Baked Cod Reprise", day_index: 4, meal_period: "DINNER", base_texture: "REGULAR" }
              as: DiningServicesManager
              captures: { dup_error: $.data.error_id, dup_message: $.data.message }
            - call: "GET /menu-cycles/${mc_id}/items"
              payload: {}
              as: DiningServicesManager
              captures: { items_total: $.meta.total_count, item_first: "$.data[0].item_code" }
          assert:
            - "${dup_error} == ERR_DUPLICATE_ITEM_CODE with HTTP 409"
            - "${items_total} == 1 and ${item_first} == REG-COD — the rejected row was not persisted"
      - name: same_item_code_in_a_different_cycle_is_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=23]
          - entities.MenuItem.parent
        distinguishing_aspect: "The mirror image of the duplicate rule: because uniqueness is per MenuCycle, the identical item_code in a sibling cycle of the same community must be accepted with 201 rather than 409."
        test_recipe:
          setup:
            - "One community with two DRAFT MenuCycles: C1 (2026-08-10..2026-08-16) already holding REG-COD, and C2 (2026-08-17..2026-08-23) empty."
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Brookdale Aldergate", care_levels_offered: ["ASSISTED_LIVING"] }
              as: ProgramAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /menu-cycles"
              payload: { community_id: "${c_id}", cycle_number: 1, week_count: 1, effective_start_date: "2026-08-10", effective_end_date: "2026-08-16" }
              as: DiningServicesManager
              captures: { c1_id: $.data.id }
            - call: "POST /menu-cycles/${c1_id}/items"
              payload: { item_code: "REG-COD", name: "Baked Cod", day_index: 1, meal_period: "LUNCH", base_texture: "REGULAR" }
              as: DiningServicesManager
              captures: { mi1_id: $.data.id }
            - call: "POST /menu-cycles"
              payload: { community_id: "${c_id}", cycle_number: 2, week_count: 1, effective_start_date: "2026-08-17", effective_end_date: "2026-08-23" }
              as: DiningServicesManager
              captures: { c2_id: $.data.id }
          trigger:
            - call: "POST /menu-cycles/${c2_id}/items"
              payload: { item_code: "REG-COD", name: "Baked Cod", day_index: 1, meal_period: "LUNCH", base_texture: "REGULAR" }
              as: DiningServicesManager
              captures: { mi2_id: $.data.id, mi2_cycle: $.data.menu_cycle_id, mi2_coverage: $.data.extension_coverage_status }
          assert:
            - "HTTP 201 and ${mi2_id} != ${mi1_id}"
            - "${mi2_cycle} == ${c2_id} and ${mi2_coverage} == NOT_REQUIRED"
            - "GET /menu-cycles/${c1_id}/items still returns exactly 1 row"
      - name: publish_overlapping_published_cycle_date_range_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=22]
          - errors[id=ERR_MENU_CYCLE_DATE_OVERLAP]
        distinguishing_aspect: "The ranges are compared as closed intervals, so a candidate starting exactly on the incumbent's last day (2026-08-16) intersects and is refused, while a candidate starting one day later publishes."
        test_recipe:
          setup:
            - "One community with a PUBLISHED cycle C1 covering 2026-08-10..2026-08-16."
            - "Cycle C2 covers 2026-08-16..2026-08-22 and sits at PENDING_DIETITIAN_SIGNOFF; cycle C3 covers 2026-08-17..2026-08-23 and also sits at PENDING_DIETITIAN_SIGNOFF."
