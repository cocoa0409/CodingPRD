              payload: { email: "kid@x.com", full_name: "Kid Member", date_of_birth: "2015-01-01" }
              as: Member
              captures: { m_id: $.data.id }
            - call: "POST /enrollments"
              payload: { member_id: "${m_id}", site_type: "ENROLLMENT_CENTER", site_id: "${ec_id}", document_type: "PASSPORT", document_number: "P5555555", document_expiry: "2026-01-01", biometric_capture_ok: true }
              as: Member
              as_user_id: "${m_id}"
              captures: { enr_id: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr_id}/submit-document"
