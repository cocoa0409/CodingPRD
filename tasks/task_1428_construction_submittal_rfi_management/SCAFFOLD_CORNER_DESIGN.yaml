  - section: calculations
    instances:
      - name: rfi_due_date_skips_project_holidays
        claim_type: correct_result
        grounds: [calculations.rfi_due_date, entities.Project.fields.holiday_dates]
        distinguishing_aspect: "With 2026-08-14 (Fri) declared a holiday, an RFI opened 2026-08-03 with 10 business days lands on 2026-08-18 — one day later than the no-holiday 2026-08-17."
        test_recipe:
          setup: ["project ACTIVE with holiday_dates ['2026-08-14']; clock 2026-08-03"]
          setup_api_calls:
            - call: "POST /v1/projects"
              payload: { project_name: "H", holiday_dates: ["2026-08-14"] }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "GET /v1/projects/${p_id}"
              payload: {}
              as: ProjectManager
              captures: { p_v: $.data.version }
          trigger:
            - call: "POST /v1/projects/${p_id}/rfis"
              payload: { subject: "S", question_text: "Q", expected_project_version: "${p_v}" }
              as: ProjectEngineer
              captures: { due: $.data.due_date }
          assert:
            - "due == 2026-08-18 (the holiday 2026-08-14 is skipped)"

