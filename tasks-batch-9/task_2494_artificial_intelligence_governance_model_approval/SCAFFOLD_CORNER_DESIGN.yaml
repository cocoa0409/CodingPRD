            - "HTTP 409 with data.error_id == ERR_GRACE_PERIOD_ELAPSED"
            - "the response is NOT ERR_SHADOW_NOT_ACTIONABLE - the status rule at p18 is satisfied"
            - "grace_days_granted is still 0 and the deadline is unchanged"

