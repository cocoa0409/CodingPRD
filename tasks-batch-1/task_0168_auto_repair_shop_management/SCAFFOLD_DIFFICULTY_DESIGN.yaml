# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine §0.5 Difficulty Rules.
# 9 rule_ids x >= 2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: labor_charge_flat_rate_vs_time_and_materials
        grounds:
          - calculations.labor_charge
          - entities.LaborLine.fields.billing_method
          - entities.LaborLine.fields.charge_cents
          - state_machines.LaborLine.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          Same LaborLine inputs (book_hours=2.0, actual_hours=1.5, rate=12000) yield
          charge 24000 under FLAT_RATE but 18000 under TIME_AND_MATERIALS — divergence
          lives on the LaborLine/RepairOrder labor-cost domain.
        test_recipe:
          setup:
            - "Catalog op DIAG with book_hours=2.0, default_rate_cents=12000"
            - "Customer + vehicle + bay + technician; RO scheduled and started (IN_PROGRESS)"
            - "Two labor lines off DIAG: line A FLAT_RATE, line B TIME_AND_MATERIALS"
            - "Each line clocked for 1.5h (clock_in 09:00, clock_out 10:30) then completed"
          setup_api_calls:
            - call: "POST /labor-operations"
              payload: { op_code: "DIAG", description: "Diagnostics", book_hours: 2.0, default_rate_cents: 12000 }
              as: ShopManager
              captures: { op_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ada Owner", phone: "555-1", email: "ada@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", vin: "VINDV01", make: "Honda", model: "Civic", model_year: 2020, odometer_miles: 30000 }
              as: ShopManager
              captures: { veh_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tom Tech", skill_level: "A" }
              as: ShopManager
              captures: { tech_id: $.data.id }
            - call: "POST /service-bays"
              payload: { bay_name: "Bay-DV1", bay_type: "GENERAL" }
              as: ShopManager
              captures: { bay_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", tax_rate: 0.0 }
              as: ShopManager
              captures: { ro_id: $.data.id, ro_v0: $.data.version }
            - call: "POST /repair-orders/${ro_id}/labor-lines"
              payload: { labor_operation_id: "${op_id}", technician_id: "${tech_id}", billing_method: "FLAT_RATE" }
              as: ShopManager
              captures: { ll_flat_id: $.data.id, ll_flat_book: $.data.book_hours }
            - call: "POST /repair-orders/${ro_id}/labor-lines"
              payload: { labor_operation_id: "${op_id}", technician_id: "${tech_id}", billing_method: "TIME_AND_MATERIALS" }
              as: ShopManager
              captures: { ll_tm_id: $.data.id }
            - call: "GET /repair-orders/${ro_id}"
              payload: {}
              as: ShopManager
              captures: { ro_id_ver1: $.data.version }
            - call: "POST /repair-orders/${ro_id}/authorize"
              payload: { expected_repair_order_version: "${ro_id_ver1}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /repair-orders/${ro_id}/schedule"
              payload: { bay_id: "${bay_id}", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T12:00:00Z" }
              as: ShopManager
            - call: "POST /repair-orders/${ro_id}/transition"
              payload: { action: "START" }
              as: ShopManager
            - call: "POST /labor-lines/${ll_flat_id}/clock-in"
              payload: { technician_id: "${tech_id}", clock_in: "2026-06-01T09:00:00Z" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /labor-lines/${ll_flat_id}/clock-out"
              payload: { clock_out: "2026-06-01T10:30:00Z" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /labor-lines/${ll_tm_id}/clock-in"
              payload: { technician_id: "${tech_id}", clock_in: "2026-06-01T10:45:00Z" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /labor-lines/${ll_tm_id}/clock-out"
              payload: { clock_out: "2026-06-01T12:15:00Z" }
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /labor-lines/${ll_flat_id}/complete"
              payload: {}
              as: ShopManager
              captures: { flat_charge: $.data.charge_cents }
            - call: "POST /labor-lines/${ll_tm_id}/complete"
              payload: {}
              as: ShopManager
              captures: { tm_charge: $.data.charge_cents }
          assert:
            - "LaborLine.${ll_flat_id}.charge_cents == 24000"
            - "LaborLine.${ll_tm_id}.charge_cents == 18000"

      - name: parts_markup_marginal_vs_flat_bracket
        grounds:
          - calculations.parts_markup
          - entities.PartLine.fields.markup_mode
          - entities.PartLine.fields.extended_charge_cents
          - entities.MarkupTier.fields.markup_pct
        distinguishing_aspect: |
          Same per-unit cost 8000 over the same 3-tier matrix yields unit_sell 11700
          (MARGINAL, sliced across bands) vs 11200 (FLAT_BRACKET, whole cost at the
          containing tier) — divergence lives on the PartLine parts-pricing domain.
        test_recipe:
          setup:
            - "Markup matrix: [0,5000)@0.50, [5000,20000)@0.40, [20000,inf)@0.25"
            - "Customer + vehicle + RO (ESTIMATE)"
            - "Two part lines, same part cost 8000 qty 2: one MARGINAL, one FLAT_BRACKET"
          setup_api_calls:
            - call: "POST /markup-tiers"
              payload: { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: 5000, markup_pct: 0.50 }
              as: PartsManager
            - call: "POST /markup-tiers"
              payload: { tier_index: 1, lower_bound_cents: 5000, upper_bound_cents: 20000, markup_pct: 0.40 }
              as: PartsManager
            - call: "POST /markup-tiers"
              payload: { tier_index: 2, lower_bound_cents: 20000, markup_pct: 0.25 }
              as: PartsManager
            - call: "POST /customers"
              payload: { full_name: "Bea Owner", phone: "555-2", email: "bea@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", vin: "VINPM01", make: "Ford", model: "F150", model_year: 2019, odometer_miles: 50000 }
              as: ShopManager
              captures: { veh_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", tax_rate: 0.0 }
              as: ShopManager
              captures: { ro_id: $.data.id }
          trigger:
            - call: "POST /repair-orders/${ro_id}/part-lines"
              payload: { part_number: "P-MG", description: "Pump", quantity: 2, unit_cost_cents: 8000, markup_mode: "MARGINAL" }
              as: PartsManager
              captures: { pl_mg_id: $.data.id, mg_ext: $.data.extended_charge_cents }
            - call: "POST /repair-orders/${ro_id}/part-lines"
              payload: { part_number: "P-FB", description: "Pump", quantity: 2, unit_cost_cents: 8000, markup_mode: "FLAT_BRACKET" }
              as: PartsManager
              captures: { pl_fb_id: $.data.id, fb_ext: $.data.extended_charge_cents }
          assert:
            - "PartLine.${pl_mg_id}.extended_charge_cents == 23400"
            - "PartLine.${pl_fb_id}.extended_charge_cents == 22400"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: parts_markup_marginal_tier_selection_three_inputs
        grounds:
          - calculations.parts_markup
          - entities.MarkupTier.fields.lower_bound_cents
          - entities.MarkupTier.fields.upper_bound_cents
          - entities.PartLine.fields.quantity
        distinguishing_aspect: |
          MODE (a): non-linear interaction of >=3 inputs — unit cost, the tiered
          markup matrix, and quantity — where the cost is sliced across bands
          ([0,5000)@.5 + [5000,8000)@.4) before multiplying by quantity.
        test_recipe:
          setup:
            - "Markup matrix: [0,5000)@0.50, [5000,20000)@0.40, [20000,inf)@0.25"
            - "Customer + vehicle + RO (ESTIMATE)"
          setup_api_calls:
            - call: "POST /markup-tiers"
              payload: { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: 5000, markup_pct: 0.50 }
              as: PartsManager
            - call: "POST /markup-tiers"
              payload: { tier_index: 1, lower_bound_cents: 5000, upper_bound_cents: 20000, markup_pct: 0.40 }
              as: PartsManager
            - call: "POST /markup-tiers"
              payload: { tier_index: 2, lower_bound_cents: 20000, markup_pct: 0.25 }
              as: PartsManager
            - call: "POST /customers"
              payload: { full_name: "Cy Owner", phone: "555-3", email: "cy@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", vin: "VINCF01", make: "Kia", model: "Rio", model_year: 2021, odometer_miles: 10000 }
              as: ShopManager
              captures: { veh_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", tax_rate: 0.0 }
              as: ShopManager
              captures: { ro_id: $.data.id }
          trigger:
            - call: "POST /repair-orders/${ro_id}/part-lines"
              payload: { part_number: "P-SLICE", description: "Alternator", quantity: 2, unit_cost_cents: 8000, markup_mode: "MARGINAL" }
              as: PartsManager
              captures: { pl_id: $.data.id, ext: $.data.extended_charge_cents }
          assert:
            - "PartLine.${pl_id}.extended_charge_cents == 23400"

      - name: repair_order_total_round_per_line_then_sum
        grounds:
          - calculations.repair_order_total
          - entities.PartLine.fields.extended_charge_cents
          - entities.RepairOrder.fields.parts_total_cents
        distinguishing_aspect: |
          MODE (b): nested rounding where order matters — two part lines each at raw
          499.5 cents round to 500 per line (parts_total 1000) under the pinned
          round-per-line-then-sum order; sum-then-round would give 999.
        test_recipe:
          setup:
            - "Markup matrix tier [0,5000)@0.50 (covers cost 333)"
            - "Customer + vehicle + RO (ESTIMATE), tax_rate 0.0"
            - "Two MARGINAL part lines, cost 333 qty 1 each (raw 499.5 -> 500 each)"
          setup_api_calls:
            - call: "POST /markup-tiers"
              payload: { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: 5000, markup_pct: 0.50 }
              as: PartsManager
            - call: "POST /customers"
              payload: { full_name: "Di Owner", phone: "555-4", email: "di@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", vin: "VINRD01", make: "Mazda", model: "3", model_year: 2018, odometer_miles: 60000 }
              as: ShopManager
              captures: { veh_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", tax_rate: 0.0 }
              as: ShopManager
              captures: { ro_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/part-lines"
              payload: { part_number: "P-R1", description: "Clip", quantity: 1, unit_cost_cents: 333, markup_mode: "MARGINAL" }
              as: PartsManager
          trigger:
            - call: "POST /repair-orders/${ro_id}/part-lines"
              payload: { part_number: "P-R2", description: "Clip", quantity: 1, unit_cost_cents: 333, markup_mode: "MARGINAL" }
              as: PartsManager
              captures: { ro_parts: $.data.repair_order_id }
            - call: "GET /repair-orders/${ro_id}"
              payload: {}
              as: ShopManager
              captures: { parts_total: $.data.parts_total_cents }
          assert:
            - "RepairOrder.${ro_id}.parts_total_cents == 1000"
            - "RepairOrder.${ro_id}.grand_total_cents == 1000"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: repair_order_cyclic_in_progress_on_hold_loop
        grounds:
          - state_machines.RepairOrder.IN_PROGRESS_to_ON_HOLD
          - state_machines.RepairOrder.ON_HOLD_to_IN_PROGRESS
          - entities.RepairOrder.fields.status
        distinguishing_aspect: |
          RepairOrder is the entity carrying the cycle: IN_PROGRESS -> ON_HOLD ->
          IN_PROGRESS returns to a previously occupied state (a true loop), distinct
          from the RecommendedJob fork below.
        test_recipe:
          setup:
            - "Customer + vehicle + bay + op + RO authorized, scheduled, started (IN_PROGRESS)"
          setup_api_calls:
            - call: "POST /labor-operations"
              payload: { op_code: "CYC", description: "Brakes", book_hours: 1.0, default_rate_cents: 10000 }
              as: ShopManager
              captures: { op_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ed Owner", phone: "555-5", email: "ed@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", vin: "VINCY01", make: "GM", model: "Volt", model_year: 2017, odometer_miles: 70000 }
              as: ShopManager
              captures: { veh_id: $.data.id }
            - call: "POST /service-bays"
              payload: { bay_name: "Bay-CY1" }
              as: ShopManager
              captures: { bay_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ShopManager
              captures: { ro_id: $.data.id, ro_v0: $.data.version }
            - call: "POST /repair-orders/${ro_id}/labor-lines"
              payload: { labor_operation_id: "${op_id}" }
              as: ShopManager
            - call: "GET /repair-orders/${ro_id}"
              payload: {}
              as: ShopManager
              captures: { ro_id_ver2: $.data.version }
            - call: "POST /repair-orders/${ro_id}/authorize"
              payload: { expected_repair_order_version: "${ro_id_ver2}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /repair-orders/${ro_id}/schedule"
              payload: { bay_id: "${bay_id}", scheduled_start: "2026-06-02T08:00:00Z", scheduled_end: "2026-06-02T12:00:00Z" }
              as: ShopManager
            - call: "POST /repair-orders/${ro_id}/transition"
              payload: { action: "START" }
              as: ShopManager
          trigger:
            - call: "POST /repair-orders/${ro_id}/transition"
              payload: { action: "HOLD" }
              as: ServiceAdvisor
              captures: { st_hold: $.data.status }
            - call: "POST /repair-orders/${ro_id}/transition"
              payload: { action: "RESUME" }
              as: ServiceAdvisor
              captures: { st_resume: $.data.status }
          assert:
            - "RepairOrder.${ro_id}.status == IN_PROGRESS after RESUME (returned to prior state)"
            - "Intermediate status after HOLD == ON_HOLD"

      - name: recommended_job_branching_fork_and_deferred_revisit
        grounds:
          - state_machines.RecommendedJob.PENDING_to_DEFERRED
          - state_machines.RecommendedJob.DEFERRED_to_APPROVED
          - state_machines.RecommendedJob.PENDING_to_DECLINED
          - entities.RecommendedJob.fields.status
        distinguishing_aspect: |
          RecommendedJob is a different entity whose shape is a branching fork
          PENDING -> {APPROVED, DECLINED, DEFERRED} with a DEFERRED -> APPROVED
          revisit edge — not a linear pipeline and not the RO cycle.
        test_recipe:
          setup:
            - "Customer + vehicle + RO + inspection SUBMITTED with one item; one recommended job PENDING"
          setup_api_calls:
            - call: "POST /labor-operations"
              payload: { op_code: "RJB", description: "Tires", book_hours: 1.0, default_rate_cents: 10000 }
              as: ShopManager
              captures: { op_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Ty Tech" }
              as: ShopManager
              captures: { tech_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Fi Owner", phone: "555-6", email: "fi@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", vin: "VINRJ01", make: "VW", model: "Golf", model_year: 2016, odometer_miles: 80000 }
              as: ShopManager
              captures: { veh_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ShopManager
              captures: { ro_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/inspections"
              payload: { technician_id: "${tech_id}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/items"
              payload: { point_name: "Tread depth", severity: "YELLOW" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /inspections/${insp_id}/recommended-jobs"
              payload: { repair_order_id: "${ro_id}", labor_operation_id: "${op_id}", severity: "YELLOW" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { rj_id: $.data.id }
          trigger:
            - call: "POST /recommended-jobs/${rj_id}/decision"
              payload: { decision: "DEFER" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { st_defer: $.data.status }
            - call: "POST /recommended-jobs/${rj_id}/decision"
              payload: { decision: "APPROVE" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { st_appr: $.data.status, made_ll: $.data.created_labor_line_id }
          assert:
            - "RecommendedJob.${rj_id}.status == DEFERRED after first decision"
            - "RecommendedJob.${rj_id}.status == APPROVED after DEFERRED->APPROVE revisit"
            - "RecommendedJob.${rj_id}.created_labor_line_id is not null (materialised on revisit approval)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: approve_job_cascades_partline_corecharge_ro_deposit_depth3
        grounds:
          - state_machines.RecommendedJob.PENDING_to_APPROVED
          - state_machines.CoreCharge.CHARGED_to_CORE_RETURNED
          - entities.RepairOrder.fields.core_deposit_total_cents
          - entities.CoreCharge.fields.deposit_cents
        distinguishing_aspect: |
          Depth-3 chain from RecommendedJob approval: approve -> creates PartLine
          (link1) -> PartLine.has_core creation cascades a CoreCharge (link2) ->
          CoreCharge creation bumps RepairOrder.core_deposit_total_cents (link3),
          each link caused by the previous, not by the original approve action.
        test_recipe:
          setup:
            - "Markup matrix [0,5000)@0.50,[5000,20000)@0.40; RO + inspection SUBMITTED"
            - "One PENDING recommended job carrying a cored part (qty 1, deposit 3000)"
          setup_api_calls:
            - call: "POST /markup-tiers"
              payload: { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: 5000, markup_pct: 0.50 }
              as: PartsManager
            - call: "POST /markup-tiers"
              payload: { tier_index: 1, lower_bound_cents: 5000, upper_bound_cents: 20000, markup_pct: 0.40 }
              as: PartsManager
            - call: "POST /labor-operations"
              payload: { op_code: "CAS", description: "Starter", book_hours: 1.0, default_rate_cents: 10000 }
              as: ShopManager
              captures: { op_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Ca Tech" }
              as: ShopManager
              captures: { tech_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Gi Owner", phone: "555-7", email: "gi@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", vin: "VINCA01", make: "Audi", model: "A4", model_year: 2015, odometer_miles: 90000 }
              as: ShopManager
              captures: { veh_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ShopManager
              captures: { ro_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/inspections"
              payload: { technician_id: "${tech_id}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/items"
              payload: { point_name: "Starter", severity: "RED" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /inspections/${insp_id}/recommended-jobs"
              payload: { repair_order_id: "${ro_id}", labor_operation_id: "${op_id}", part_number: "ST-9", part_quantity: 1, part_unit_cost_cents: 8000, has_core: true, core_deposit_cents: 3000, severity: "RED" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { rj_id: $.data.id }
          trigger:
            - call: "POST /recommended-jobs/${rj_id}/decision"
              payload: { decision: "APPROVE" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { made_pl: $.data.created_part_line_id }
            - call: "GET /repair-orders/${ro_id}"
              payload: {}
              as: ShopManager
              captures: { core_dep: $.data.core_deposit_total_cents }
          assert:
            - "RepairOrder.${ro_id}.core_deposit_total_cents == 3000 (CoreCharge cascaded from approved part)"
            - "RecommendedJob.${rj_id}.created_part_line_id is not null"

      - name: complete_ro_cascades_labor_credit_to_technician_depth2
        grounds:
          - state_machines.RepairOrder.IN_PROGRESS_to_COMPLETED
          - calculations.technician_efficiency
          - entities.Technician.fields.banked_flat_hours
          - entities.Technician.fields.efficiency_pct
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (RO complete): complete -> each
          COMPLETED LaborLine credits Technician.banked_flat/actual_hours (link1) ->
          that credit recomputes Technician.efficiency_pct (link2).
        test_recipe:
          setup:
            - "Op book_hours 2.0 rate 12000; RO started; one FLAT_RATE line, clocked 1.5h, completed"
          setup_api_calls:
            - call: "POST /labor-operations"
              payload: { op_code: "EFF", description: "Service", book_hours: 2.0, default_rate_cents: 12000 }
              as: ShopManager
              captures: { op_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Ef Tech", skill_level: "A" }
              as: ShopManager
              captures: { tech_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ha Owner", phone: "555-8", email: "ha@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", vin: "VINEF01", make: "BMW", model: "330", model_year: 2014, odometer_miles: 95000 }
              as: ShopManager
              captures: { veh_id: $.data.id }
            - call: "POST /service-bays"
              payload: { bay_name: "Bay-EF1" }
              as: ShopManager
