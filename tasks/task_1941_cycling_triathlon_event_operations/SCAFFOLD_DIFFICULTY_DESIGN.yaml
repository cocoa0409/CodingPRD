# =============================================================================
# Task 1941: Cycling & Triathlon Event Operations — §1.8 Scaffold Difficulty Design
# Test Targeting Index: 9 Difficulty Rules x 2 instances = 18 instances.
# All chains drive empty-DB -> precondition state using only §1.5 endpoints.
# Logical clock default (no set_current_utc call) is 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: result_total_provisional_excludes_confirmed_penalty
        grounds:
          - calculations.result_total_time
          - calculations.penalty_seconds_total
          - state_machines.Result.PROVISIONAL_to_OFFICIAL
        distinguishing_aspect: |
          Timing-domain dual variant: for identical VALIDATED timing data and one
          CONFIRMED 120s penalty, the PROVISIONAL variant reports 5490 while the
          OFFICIAL variant reports 5610 — same entity, same inputs, two numbers.
        test_recipe:
          setup:
            - "Event fully built: permit approved, wave W1 (AGE_GROUP, ages 18-39, capacity 2, draft_legal=false, start 2026-10-15T08:00:00Z), aid station READY, posture PUBLISHED"
            - "Athlete A1 (born 1990-01-01) registered, PAID, CONFIRMED into W1, bike RACKED with bib BIB-100"
            - "Swim decision SWIM_ON (20.0C); race started at clock 2026-10-15T08:00:00Z"
            - "Validated timing: SWIM 08:15:00, T1 08:16:00, BIKE 09:16:00, T2 09:16:30, FINISH 09:46:30 -> R1 FINISHED, provisional 5490"
            - "DRAFTING penalty P1 assessed (120s); clock advanced to 2026-10-15T10:47:30Z (61 min past assessment) and run-ops auto-confirms P1"
          setup_api_calls:
            - call: "POST /events"
              payload: { name: "Tri Alpha", start_date: "2026-10-15T08:00:00Z", has_swim: true, water_pool_units: 1000 }
              as: RaceDirector
              captures: { ev_id: $.data.id }
            - call: "POST /events/${ev_id}/road-segments"
              payload: { name: "Main St", length_km: 10.0, closure_start: "2026-10-15T06:00:00Z", closure_end: "2026-10-15T12:00:00Z" }
              as: PermitCoordinator
              captures: { seg_id: $.data.id }
            - call: "POST /road-segments/${seg_id}/permits"
              payload: { authority_name: "City PD", requested_start: "2026-10-15T06:00:00Z", requested_end: "2026-10-15T12:00:00Z" }
              as: PermitCoordinator
              captures: { per_id: $.data.id }
            - call: "POST /permits/${per_id}/submit"
              as: PermitCoordinator
            - call: "POST /permits/${per_id}/approve"
              as: PermitCoordinator
            - call: "POST /events/${ev_id}/advance"
              as: RaceDirector
            - call: "POST /events/${ev_id}/waves"
              payload: { label: "M18-39", division: "AGE_GROUP", scheduled_start_time: "2026-10-15T08:00:00Z", capacity: 2, draft_legal: false, age_band_min: 18, age_band_max: 39 }
              as: RaceDirector
              captures: { wave_id: $.data.id }
            - call: "POST /events/${ev_id}/aid-stations"
              payload: { name: "AS-1", location_km: 10.0, required_volunteers: 2, required_water_units: 400 }
              as: RaceDirector
              captures: { as_id: $.data.id }
            - call: "POST /aid-stations/${as_id}/assignments"
              payload: { volunteer_id: "vol-1", shift_start: "2026-10-15T06:00:00Z", shift_end: "2026-10-15T10:00:00Z" }
              as: VolunteerCoordinator
              captures: { va1_id: $.data.id }
            - call: "POST /volunteer-assignments/${va1_id}/confirm"
              as: VolunteerCoordinator
            - call: "POST /aid-stations/${as_id}/assignments"
              payload: { volunteer_id: "vol-2", shift_start: "2026-10-15T06:00:00Z", shift_end: "2026-10-15T10:00:00Z" }
              as: VolunteerCoordinator
              captures: { va2_id: $.data.id }
            - call: "POST /volunteer-assignments/${va2_id}/confirm"
              as: VolunteerCoordinator
            - call: "POST /events/${ev_id}/allocate-water"
              as: RaceDirector
            - call: "POST /events/${ev_id}/advance"
              as: RaceDirector
            - call: "POST /events/${ev_id}/athletes"
              payload: { full_name: "Ann A", birth_date: "1990-01-01", license_number: "USAT-1" }
              as: RaceDirector
              captures: { ath_id: $.data.id }
            - call: "POST /events/${ev_id}/registrations"
              payload: { athlete_id: "${ath_id}", division: "AGE_GROUP", entry_fee_cents: 20000 }
              as: Athlete
              as_user_id: "${ath_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /registrations/${reg_id}/pay"
              as: Athlete
              as_user_id: "${ath_id}"
            - call: "POST /registrations/${reg_id}/confirm"
              as: RaceDirector
            - call: "POST /events/${ev_id}/safety-assessments"
              payload: { water_temp_celsius: 20.0, lightning_within_10km: false }
              as: RaceDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-14T10:00:00Z" }
              as: RaceDirector
            - call: "POST /registrations/${reg_id}/check-in-bike"
              payload: { bib_code: "BIB-100" }
              as: Athlete
              as_user_id: "${ath_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T08:00:00Z" }
              as: RaceDirector
            - call: "POST /events/${ev_id}/start"
              as: RaceDirector
            - call: "POST /registrations/${reg_id}/timing-records"
              payload: { discipline: "SWIM", recorded_at: "2026-10-15T08:15:00Z" }
              as: Timer
              captures: { tr_swim: $.data.id }
            - call: "POST /timing-records/${tr_swim}/validate"
              as: Timer
            - call: "POST /registrations/${reg_id}/timing-records"
              payload: { discipline: "T1", recorded_at: "2026-10-15T08:16:00Z" }
              as: Timer
              captures: { tr_t1: $.data.id }
            - call: "POST /timing-records/${tr_t1}/validate"
              as: Timer
            - call: "POST /registrations/${reg_id}/timing-records"
              payload: { discipline: "BIKE", recorded_at: "2026-10-15T09:16:00Z" }
              as: Timer
              captures: { tr_bike: $.data.id }
            - call: "POST /timing-records/${tr_bike}/validate"
              as: Timer
            - call: "POST /registrations/${reg_id}/timing-records"
              payload: { discipline: "T2", recorded_at: "2026-10-15T09:16:30Z" }
              as: Timer
              captures: { tr_t2: $.data.id }
            - call: "POST /timing-records/${tr_t2}/validate"
              as: Timer
            - call: "POST /registrations/${reg_id}/timing-records"
              payload: { discipline: "FINISH", recorded_at: "2026-10-15T09:46:30Z" }
              as: Timer
              captures: { tr_fin: $.data.id }
            - call: "POST /timing-records/${tr_fin}/validate"
              as: Timer
            - call: "POST /registrations/${reg_id}/penalties"
              payload: { kind: "DRAFTING" }
              as: Referee
              as_user_id: "ref-1"
              captures: { pen_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T10:47:30Z" }
              as: RaceDirector
            - call: "POST /events/${ev_id}/run-ops"
              as: RaceDirector
            - call: "POST /events/${ev_id}/finalize"
              as: RaceDirector
          trigger:
            - call: "GET /registrations/${reg_id}/results"
              as: Timer
              captures: { res_official: $.data.0.official_total_seconds, res_prov: $.data.0.provisional_total_seconds, res_pen: $.data.0.penalty_seconds_total }
          assert:
            - "Result.provisional_total_seconds == 5490 (900+60+3600+30+1800; penalties excluded)"
            - "Result.penalty_seconds_total == 120"
            - "Result.official_total_seconds == 5610 (5490 + 120; CONFIRMED penalty included)"
            - "Result.status == OFFICIAL"
            - "provisional_total_seconds != official_total_seconds for identical timing data"

      - name: refund_provisional_vs_final_tier_crossing
        grounds:
          - calculations.refund_estimate
          - state_machines.Registration.PAID_to_WITHDRAWN
        distinguishing_aspect: |
          Fiscal-domain dual variant: the provisional estimate uses the withdraw
          date tier (56 days out -> 50% -> 9000 cents) while the final settlement
          uses the run-ops processing date tier (25 days out -> 0% -> 0 cents);
          same entry fee, two different refunds — a different entity domain
          (Registration money) from the timing-domain result variant.
        test_recipe:
          setup:
            - "Event E2 start 2026-10-15T08:00:00Z; athlete A2 registered with entry_fee_cents 20000 and PAID"
            - "Logical clock at 2026-08-20T00:00:00Z for the withdraw (56 days before start -> 50% tier)"
          setup_api_calls:
            - call: "POST /events"
              payload: { name: "Tri Beta", start_date: "2026-10-15T08:00:00Z", has_swim: false, water_pool_units: 500 }
              as: RaceDirector
              captures: { ev2_id: $.data.id }
            - call: "POST /events/${ev2_id}/athletes"
              payload: { full_name: "Bob B", birth_date: "1992-05-05", license_number: "USAT-2" }
              as: RaceDirector
              captures: { ath2_id: $.data.id }
            - call: "POST /events/${ev2_id}/registrations"
              payload: { athlete_id: "${ath2_id}", division: "AGE_GROUP", entry_fee_cents: 20000 }
              as: Athlete
              as_user_id: "${ath2_id}"
              captures: { reg2_id: $.data.id }
            - call: "POST /registrations/${reg2_id}/pay"
              as: Athlete
              as_user_id: "${ath2_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: RaceDirector
          trigger:
            - call: "POST /registrations/${reg2_id}/withdraw"
              payload: { refund_destination: "card-123" }
              as: Athlete
              as_user_id: "${ath2_id}"
              captures: { est_cents: $.data.refund_estimate_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: RaceDirector
            - call: "POST /events/${ev2_id}/run-ops"
              as: RaceDirector
            - call: "GET /registrations/${reg2_id}"
              as: RaceDirector
              captures: { final_cents: $.data.refund_final_cents }
          assert:
            - "refund_estimate_cents == 9000 (base floor(20000*0.50)=10000; fee ceil(10000*0.10)=1000; 10000-1000)"
            - "refund_final_cents == 0 (processing date 25 days before start -> 0% tier)"
            - "refund_estimate_cents != refund_final_cents (tier crossed between withdraw and payout)"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes: (a) vs (b))
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: drafting_penalty_tiered_branching
        grounds:
          - calculations.drafting_penalty_seconds
        distinguishing_aspect: |
          Mode (a) combinatorial: seconds depends on three interacting inputs —
          prior DRAFTING count (0/1/>=2), kind, and wave.draft_legal — with a
          state-changing third tier (DSQ flag), not a flat rate.
        test_recipe:
          setup:
            - "Racing event (same build as base fixture): R1 RACING in a non-draft-legal wave"
          setup_api_calls:
            - call: "POST /events"
              payload: { name: "Tri Gamma", start_date: "2026-10-15T08:00:00Z", has_swim: true, water_pool_units: 1000 }
              as: RaceDirector
              captures: { ev_id: $.data.id }
            - call: "POST /events/${ev_id}/road-segments"
              payload: { name: "Main St", length_km: 10.0, closure_start: "2026-10-15T06:00:00Z", closure_end: "2026-10-15T12:00:00Z" }
              as: PermitCoordinator
              captures: { seg_id: $.data.id }
            - call: "POST /road-segments/${seg_id}/permits"
              payload: { authority_name: "City PD", requested_start: "2026-10-15T06:00:00Z", requested_end: "2026-10-15T12:00:00Z" }
              as: PermitCoordinator
              captures: { per_id: $.data.id }
            - call: "POST /permits/${per_id}/submit"
              as: PermitCoordinator
            - call: "POST /permits/${per_id}/approve"
              as: PermitCoordinator
            - call: "POST /events/${ev_id}/advance"
              as: RaceDirector
            - call: "POST /events/${ev_id}/waves"
              payload: { label: "M18-39", division: "AGE_GROUP", scheduled_start_time: "2026-10-15T08:00:00Z", capacity: 2, draft_legal: false, age_band_min: 18, age_band_max: 39 }
              as: RaceDirector
            - call: "POST /events/${ev_id}/aid-stations"
              payload: { name: "AS-1", location_km: 10.0, required_volunteers: 1, required_water_units: 100 }
              as: RaceDirector
              captures: { as_id: $.data.id }
            - call: "POST /aid-stations/${as_id}/assignments"
              payload: { volunteer_id: "vol-1", shift_start: "2026-10-15T06:00:00Z", shift_end: "2026-10-15T10:00:00Z" }
              as: VolunteerCoordinator
              captures: { va_id: $.data.id }
            - call: "POST /volunteer-assignments/${va_id}/confirm"
              as: VolunteerCoordinator
            - call: "POST /events/${ev_id}/allocate-water"
              as: RaceDirector
            - call: "POST /events/${ev_id}/advance"
              as: RaceDirector
            - call: "POST /events/${ev_id}/athletes"
              payload: { full_name: "Ann A", birth_date: "1990-01-01", license_number: "USAT-1" }
              as: RaceDirector
              captures: { ath_id: $.data.id }
            - call: "POST /events/${ev_id}/registrations"
              payload: { athlete_id: "${ath_id}", division: "AGE_GROUP", entry_fee_cents: 20000 }
              as: Athlete
              as_user_id: "${ath_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /registrations/${reg_id}/pay"
              as: Athlete
              as_user_id: "${ath_id}"
            - call: "POST /registrations/${reg_id}/confirm"
              as: RaceDirector
            - call: "POST /events/${ev_id}/safety-assessments"
              payload: { water_temp_celsius: 20.0, lightning_within_10km: false }
              as: RaceDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-14T10:00:00Z" }
              as: RaceDirector
            - call: "POST /registrations/${reg_id}/check-in-bike"
              payload: { bib_code: "BIB-100" }
              as: Athlete
              as_user_id: "${ath_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T08:00:00Z" }
              as: RaceDirector
            - call: "POST /events/${ev_id}/start"
              as: RaceDirector
          trigger:
            - call: "POST /registrations/${reg_id}/penalties"
              payload: { kind: "DRAFTING" }
              as: Referee
              as_user_id: "ref-1"
              captures: { pen1_seconds: $.data.seconds, pen1_dsq: $.data.triggers_dsq }
            - call: "POST /registrations/${reg_id}/penalties"
              payload: { kind: "DRAFTING" }
              as: Referee
              as_user_id: "ref-1"
              captures: { pen2_seconds: $.data.seconds, pen2_dsq: $.data.triggers_dsq }
            - call: "POST /registrations/${reg_id}/penalties"
              payload: { kind: "DRAFTING" }
              as: Referee
              as_user_id: "ref-1"
              captures: { pen3_seconds: $.data.seconds, pen3_dsq: $.data.triggers_dsq }
          assert:
            - "penalty#1.seconds == 120 AND penalty#1.triggers_dsq == false (0 priors)"
            - "penalty#2.seconds == 300 AND penalty#2.triggers_dsq == false (1 prior)"
            - "penalty#3.seconds == 0 AND penalty#3.triggers_dsq == true (>=2 priors -> DSQ tier)"

      - name: refund_nested_rounding_order_pinned
        grounds:
          - calculations.refund_estimate
        distinguishing_aspect: |
          Mode (b) combinatorial: nested rounding order is pinned — floor the
          tiered base first, then ceil the 10% fee on the rounded base, then
          subtract; sum-then-round would give a different cent value for odd
          fees (entry 20005 at 75%: floor-then-fee 11252 vs naive 11253).
        test_recipe:
          setup:
            - "Event E3 start 2026-10-15T08:00:00Z; athlete with entry_fee_cents 20005, PAID; clock 2026-08-01 (75 days out -> 75% tier)"
          setup_api_calls:
            - call: "POST /events"
              payload: { name: "Tri Delta", start_date: "2026-10-15T08:00:00Z", has_swim: false, water_pool_units: 100 }
              as: RaceDirector
              captures: { ev3_id: $.data.id }
            - call: "POST /events/${ev3_id}/athletes"
              payload: { full_name: "Cid C", birth_date: "1988-03-03", license_number: "USAT-3" }
              as: RaceDirector
              captures: { ath3_id: $.data.id }
            - call: "POST /events/${ev3_id}/registrations"
              payload: { athlete_id: "${ath3_id}", division: "AGE_GROUP", entry_fee_cents: 20005 }
              as: Athlete
              as_user_id: "${ath3_id}"
              captures: { reg3_id: $.data.id }
            - call: "POST /registrations/${reg3_id}/pay"
              as: Athlete
              as_user_id: "${ath3_id}"
          trigger:
            - call: "POST /registrations/${reg3_id}/withdraw"
              payload: { refund_destination: "card-9" }
              as: Athlete
              as_user_id: "${ath3_id}"
              captures: { est3: $.data.refund_estimate_cents }
          assert:
            - "refund_estimate_cents == 13502 (base floor(20005*0.75)=15003; fee ceil(15003*0.10)=1501; 15003-1501=13502)"
            - "refund_estimate_cents != 13502 - off-by-one guard: sum-then-round variants (e.g. floor(20005*0.75 - 20005*0.75*0.10)=13503) are wrong"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: event_parallel_dimensions_posture_x_swim
        grounds:
          - state_machines.Event.swim_status
          - state_machines.Event.posture
        distinguishing_aspect: |
          Event carries two independent state dimensions: posture
          (DRAFT->PERMITTED->PUBLISHED) advances while swim_status flips
          PENDING_DECISION->SWIM_ON->SWIM_CANCELLED on its own triggers;
          swim flips do not touch posture and posture advances do not touch
          swim_status.
        test_recipe:
          setup:
            - "Event fully advanced to PUBLISHED with swim decision SWIM_ON, then a cancelling assessment flips swim_status while posture stays PUBLISHED"
          setup_api_calls:
            - call: "POST /events"
              payload: { name: "Tri Epsilon", start_date: "2026-10-15T08:00:00Z", has_swim: true, water_pool_units: 1000 }
              as: RaceDirector
              captures: { ev_id: $.data.id }
            - call: "POST /events/${ev_id}/road-segments"
              payload: { name: "Main St", length_km: 10.0, closure_start: "2026-10-15T06:00:00Z", closure_end: "2026-10-15T12:00:00Z" }
              as: PermitCoordinator
              captures: { seg_id: $.data.id }
            - call: "POST /road-segments/${seg_id}/permits"
              payload: { authority_name: "City PD", requested_start: "2026-10-15T06:00:00Z", requested_end: "2026-10-15T12:00:00Z" }
              as: PermitCoordinator
              captures: { per_id: $.data.id }
            - call: "POST /permits/${per_id}/submit"
              as: PermitCoordinator
            - call: "POST /permits/${per_id}/approve"
              as: PermitCoordinator
            - call: "POST /events/${ev_id}/advance"
              as: RaceDirector
            - call: "POST /events/${ev_id}/waves"
              payload: { label: "M18-39", division: "AGE_GROUP", scheduled_start_time: "2026-10-15T08:00:00Z", capacity: 2, draft_legal: false, age_band_min: 18, age_band_max: 39 }
              as: RaceDirector
            - call: "POST /events/${ev_id}/aid-stations"
              payload: { name: "AS-1", location_km: 10.0, required_volunteers: 1, required_water_units: 100 }
              as: RaceDirector
              captures: { as_id: $.data.id }
            - call: "POST /aid-stations/${as_id}/assignments"
              payload: { volunteer_id: "vol-1", shift_start: "2026-10-15T06:00:00Z", shift_end: "2026-10-15T10:00:00Z" }
              as: VolunteerCoordinator
              captures: { va_id: $.data.id }
            - call: "POST /volunteer-assignments/${va_id}/confirm"
              as: VolunteerCoordinator
            - call: "POST /events/${ev_id}/allocate-water"
              as: RaceDirector
            - call: "POST /events/${ev_id}/advance"
              as: RaceDirector
            - call: "POST /events/${ev_id}/safety-assessments"
              payload: { water_temp_celsius: 20.0, lightning_within_10km: false }
              as: RaceDirector
          trigger:
            - call: "POST /events/${ev_id}/safety-assessments"
              payload: { water_temp_celsius: 10.0, lightning_within_10km: false }
              as: Referee
            - call: "GET /events/${ev_id}"
              as: RaceDirector
              captures: { post: $.data.posture, swim: $.data.swim_status }
          assert:
            - "Event.posture == PUBLISHED (unchanged by the safety cascade)"
            - "Event.swim_status == SWIM_CANCELLED (independent dimension flipped)"
            - "First SafetyAssessment.status == SUPERSEDED; second == RECORDED with outcome SWIM_CANCEL"

      - name: course_permit_reject_resubmit_cycle
        grounds:
          - state_machines.CoursePermit.REJECTED_to_SUBMITTED
        distinguishing_aspect: |
          CoursePermit is cyclic (SUBMITTED->REJECTED->SUBMITTED->APPROVED): a
          rejected permit can be resubmitted and approved, unlike any linear
          pipeline; rejection_reason is cleared on resubmit.
        test_recipe:
          setup:
            - "Event with one road segment; permit P created (DRAFT)"
          setup_api_calls:
            - call: "POST /events"
              payload: { name: "Tri Zeta", start_date: "2026-10-15T08:00:00Z", has_swim: false, water_pool_units: 100 }
              as: RaceDirector
              captures: { ev_id: $.data.id }
            - call: "POST /events/${ev_id}/road-segments"
              payload: { name: "Main St", length_km: 10.0, closure_start: "2026-10-15T06:00:00Z", closure_end: "2026-10-15T12:00:00Z" }
              as: PermitCoordinator
              captures: { seg_id: $.data.id }
            - call: "POST /road-segments/${seg_id}/permits"
              payload: { authority_name: "City PD", requested_start: "2026-10-15T06:00:00Z", requested_end: "2026-10-15T12:00:00Z" }
              as: PermitCoordinator
              captures: { per_id: $.data.id }
            - call: "POST /permits/${per_id}/submit"
              as: PermitCoordinator
            - call: "POST /permits/${per_id}/reject"
              payload: { reason: "insufficient detour plan" }
              as: PermitCoordinator
          trigger:
            - call: "POST /permits/${per_id}/submit"
              as: PermitCoordinator
              captures: { st2: $.data.status, rr2: $.data.rejection_reason }
            - call: "POST /permits/${per_id}/approve"
              as: PermitCoordinator
              captures: { st3: $.data.status }
          assert:
            - "After resubmit: status == SUBMITTED AND rejection_reason == null"
            - "After second review: status == APPROVED (cycle REJECTED->SUBMITTED->APPROVED completed)"

