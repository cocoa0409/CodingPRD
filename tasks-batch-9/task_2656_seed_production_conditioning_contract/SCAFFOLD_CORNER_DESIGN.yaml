# SCAFFOLD_CORNER_DESIGN.yaml
# Task 2656 - Seed Production & Conditioning Contract
# Section 1.9 breadth probe. Walks references/claim-extraction-guide.md row by row against
# SCAFFOLD.yaml sections 1.1-1.7. Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml
# are emitted as excluded_because stubs that cite the covering instance by name.
# Every chain starts from an empty database and only uses endpoints declared in section 1.5.
# The logical clock defaults to 2026-08-01T00:00:00Z and is moved only via POST /_clock/set_current_utc.

scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: variety_creation_returns_declared_fields
        claim_type: creation
        grounds:
          - entities.Variety
          - endpoints.POST /seed-ops/varieties
        distinguishing_aspect: "A POST carrying every required Variety field returns 201 and echoes each stored value verbatim inside the success envelope's data object."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned at its default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /seed-ops/varieties"
              payload: { crop_kind: "WHEAT", variety_name: "HRW-Sable", max_seed_class: "CERTIFIED", isolation_min_m: 200.0, restricted_prior_crop_kinds: ["WHEAT", "TRITICALE"], restricted_prior_crop_years: 3, germination_min_pct: 85.0, purity_min_pct: 97.0, max_off_type_per_10000: 10.0, max_restricted_weed_per_10000: 5.0, max_disease_incidence_pct: 2.0, max_rogueing_rounds: 2, estimated_conditioning_shrink_pct: 8.0, germ_validity_days: 270, max_carryover_generations: 2, treatment_required: false }
              as: ProgramAdmin
              captures: { v_id: $.data.id }
          assert:
            - "Returns 201 with response_type object and a data object carrying a server-minted id"
            - "Variety.${v_id}.crop_kind == WHEAT and variety_name == HRW-Sable and max_seed_class == CERTIFIED"
            - "Variety.${v_id}.isolation_min_m == 200.0 and restricted_prior_crop_kinds == [WHEAT, TRITICALE] and restricted_prior_crop_years == 3"
            - "Variety.${v_id}.germination_min_pct == 85.0 and purity_min_pct == 97.0 and max_off_type_per_10000 == 10.0 and max_rogueing_rounds == 2"
            - "Variety.${v_id}.germ_validity_days == 270 and max_carryover_generations == 2 and treatment_required == false"
            - "meta.api_request_id and meta.api_request_timestamp are present on the response"

      - name: grower_retrieval_returns_stored_data
        claim_type: retrieval
        grounds:
          - entities.Grower
          - endpoints.GET /seed-ops/growers/{grower_id}
        distinguishing_aspect: "GET /seed-ops/growers/{grower_id} returns exactly the row created by the prior POST, including the system-initialised standing fields."
        test_recipe:
          setup:
            - "One grower Prairie Ridge Farms created in region ND-07"
          setup_api_calls:
            - call: "POST /seed-ops/growers"
              payload: { grower_name: "Prairie Ridge Farms", region_code: "ND-07", contact_email: "ops@prairieridge.example" }
              as: ProgramAdmin
              captures: { g_id: $.data.id }
          trigger:
            - call: "GET /seed-ops/growers/${g_id}"
              payload: {}
              as: FieldOfficer
          assert:
            - "Returns 200 with data.id == ${g_id}"
            - "Grower.${g_id}.grower_name == Prairie Ridge Farms and region_code == ND-07 and contact_email == ops@prairieridge.example"
            - "Grower.${g_id}.status == GOOD_STANDING and compliance_flag_count == 0 (system-initialised, never supplied by the client)"
            - "Grower.${g_id}.version == 1"

      - name: growers_listing_returns_pagination_envelope
        claim_type: listing
        grounds:
          - endpoints.GET /seed-ops/growers
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /seed-ops/growers with limit 1 returns one row plus total_count 2 and has_more true; offset 1 returns the second row with has_more false."
        test_recipe:
          setup:
            - "Two growers exist: Prairie Ridge Farms (ND-07) and Coteau Seed Co (ND-11)"
          setup_api_calls:
            - call: "POST /seed-ops/growers"
              payload: { grower_name: "Prairie Ridge Farms", region_code: "ND-07", contact_email: "ops@prairieridge.example" }
              as: ProgramAdmin
              captures: { g_id: $.data.id }
            - call: "POST /seed-ops/growers"
              payload: { grower_name: "Coteau Seed Co", region_code: "ND-11", contact_email: "office@coteau.example" }
              as: ProgramAdmin
              captures: { g2_id: $.data.id }
          trigger:
            - call: "GET /seed-ops/growers"
              payload: { limit: 1, offset: 0 }
              as: ProgramAdmin
            - call: "GET /seed-ops/growers"
              payload: { limit: 1, offset: 1 }
              as: ProgramAdmin
            - call: "GET /seed-ops/growers"
              payload: { region_code: "ND-11", limit: 10, offset: 0 }
              as: ProgramAdmin
          assert:
            - "First call returns response_type array with exactly 1 item, total_count 2, has_more true, limit 1, offset 0"
            - "Second call returns exactly 1 item, total_count 2, has_more false"
            - "The two pages together contain ${g_id} and ${g2_id} with no duplicates, ordered by created_at ASC"
            - "Third call filters by region: exactly 1 item whose id == ${g2_id}, total_count 1, has_more false"

      - name: grower_get_with_unknown_id_not_found
        claim_type: not_found
        grounds:
          - validations.priority_4_path_existence
          - errors.ERR_GROWER_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unknown UUID on GET /seed-ops/growers/{grower_id} returns 404 ERR_GROWER_NOT_FOUND, never an empty 200."
        test_recipe:
          setup:
            - "One unrelated grower exists so the collection is non-empty"
          setup_api_calls:
            - call: "POST /seed-ops/growers"
              payload: { grower_name: "Prairie Ridge Farms", region_code: "ND-07", contact_email: "ops@prairieridge.example" }
              as: ProgramAdmin
              captures: { g_id: $.data.id }
          trigger:
            - call: "GET /seed-ops/growers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Returns 404 with response_type error and data.error_id == ERR_GROWER_NOT_FOUND"
            - "The existing grower ${g_id} is unaffected and still retrievable"

      - name: contract_create_missing_base_price_rejected
        claim_type: required_fields
        grounds:
          - validations.priority_3_ERR_INVALID_REQUEST
          - endpoints.POST /seed-ops/production-contracts
        distinguishing_aspect: "Omitting the required base_price_per_unit_cents returns 400 ERR_INVALID_REQUEST and creates no ProductionContract row."
        test_recipe:
          setup:
            - "Variety, grower and field all exist and are mutually consistent"
          setup_api_calls:
            - call: "POST /seed-ops/varieties"
              payload: { crop_kind: "WHEAT", variety_name: "HRW-Sable", max_seed_class: "CERTIFIED", isolation_min_m: 200.0, restricted_prior_crop_kinds: ["WHEAT", "TRITICALE"], restricted_prior_crop_years: 3, germination_min_pct: 85.0, purity_min_pct: 97.0, max_off_type_per_10000: 10.0, max_restricted_weed_per_10000: 5.0, max_disease_incidence_pct: 2.0, max_rogueing_rounds: 2, estimated_conditioning_shrink_pct: 8.0, germ_validity_days: 270, max_carryover_generations: 2, treatment_required: false }
              as: ProgramAdmin
              captures: { v_id: $.data.id }
            - call: "POST /seed-ops/growers"
              payload: { grower_name: "Prairie Ridge Farms", region_code: "ND-07", contact_email: "ops@prairieridge.example" }
              as: ProgramAdmin
              captures: { g_id: $.data.id }
            - call: "POST /seed-ops/production-fields"
              payload: { grower_id: "${g_id}", field_code: "F-North-12", acres: 320.0, isolation_distance_m: 250.0 }
              as: ProgramAdmin
              captures: { f_id: $.data.id }
            - call: "POST /seed-ops/production-fields/${f_id}/history"
              payload: { crop_kind: "CANOLA", crop_year: 2024 }
              as: FieldOfficer
          trigger:
            - call: "POST /seed-ops/production-contracts"
              payload: { grower_id: "${g_id}", variety_id: "${v_id}", production_field_id: "${f_id}", season_year: 2026, seed_class: "CERTIFIED", contracted_acres: 300.0, conditioning_charge_per_unit_cents: 220, advance_total_cents: 1200000 }
              as: ProgramAdmin
          assert:
            - "Returns 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /seed-ops/production-contracts returns total_count 0"

      - name: conditioning_line_status_default_available
        claim_type: defaults
        grounds:
          - entities.ConditioningLine.fields.status
          - endpoints.POST /seed-ops/conditioning-lines
        distinguishing_aspect: "Omitting the optional status on POST /seed-ops/conditioning-lines applies the declared default AVAILABLE, and last_cleanout_variety_id and last_run_end_utc start null."
        test_recipe:
          setup:
            - "Empty database; logical clock at its default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /seed-ops/conditioning-lines"
              payload: { line_code: "LN-1", cleanout_minutes_required: 60, capacity_kg_per_hour: 8000.0 }
              as: ConditioningManager
              captures: { ln_id: $.data.id }
          assert:
            - "Returns 201 with ConditioningLine.${ln_id}.status == AVAILABLE"
            - "ConditioningLine.${ln_id}.cleanout_minutes_required == 60 and capacity_kg_per_hour == 8000.0"
            - "ConditioningLine.${ln_id}.last_cleanout_variety_id == null and last_run_end_utc == null"
            - "ConditioningLine.${ln_id}.version == 1"

      - name: seed_lot_provisional_units_computed_input_ignored
        claim_type: computed_fields
        grounds:
          - calculations.clean_seed_unit_accounting
          - entities.SeedLot.fields.provisional_clean_units
        distinguishing_aspect: "provisional_clean_units is derived from gross_weight_kg, moisture_pct and the variety's book shrink; a client-supplied value in the harvest-event body is ignored and the computed 1452.22 is stored."
        test_recipe:
          setup:
            - "Golden contract INSPECTION_PASSED, CMB-7 cleanout-certified for its variety, clock at 2026-09-14T00:00:00Z"
          setup_api_calls:
            - call: "POST /seed-ops/varieties"
              payload: { crop_kind: "WHEAT", variety_name: "HRW-Sable", max_seed_class: "CERTIFIED", isolation_min_m: 200.0, restricted_prior_crop_kinds: ["WHEAT", "TRITICALE"], restricted_prior_crop_years: 3, germination_min_pct: 85.0, purity_min_pct: 97.0, max_off_type_per_10000: 10.0, max_restricted_weed_per_10000: 5.0, max_disease_incidence_pct: 2.0, max_rogueing_rounds: 2, estimated_conditioning_shrink_pct: 8.0, germ_validity_days: 270, max_carryover_generations: 2, treatment_required: false }
              as: ProgramAdmin
              captures: { v_id: $.data.id }
            - call: "POST /seed-ops/growers"
              payload: { grower_name: "Prairie Ridge Farms", region_code: "ND-07", contact_email: "ops@prairieridge.example" }
              as: ProgramAdmin
              captures: { g_id: $.data.id }
            - call: "POST /seed-ops/production-fields"
              payload: { grower_id: "${g_id}", field_code: "F-North-12", acres: 320.0, isolation_distance_m: 250.0 }
              as: ProgramAdmin
              captures: { f_id: $.data.id }
            - call: "POST /seed-ops/production-fields/${f_id}/history"
              payload: { crop_kind: "CANOLA", crop_year: 2024 }
              as: FieldOfficer
            - call: "POST /seed-ops/production-contracts"
              payload: { grower_id: "${g_id}", variety_id: "${v_id}", production_field_id: "${f_id}", season_year: 2026, seed_class: "CERTIFIED", contracted_acres: 300.0, base_price_per_unit_cents: 1850, conditioning_charge_per_unit_cents: 220, advance_total_cents: 1200000 }
              as: ProgramAdmin
              captures: { c_id: $.data.id }
            - call: "POST /seed-ops/production-contracts/${c_id}/offer"
              payload: {}
              as: ProgramAdmin
            - call: "POST /seed-ops/production-contracts/${c_id}/sign"
              payload: { planted_on: "2026-04-15" }
              as: Grower
              as_user_id: "${g_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /seed-ops/field-inspections"
              payload: { production_contract_id: "${c_id}", inspected_on: "2026-08-20", sampled_plants: 20000, off_type_plants: 12, restricted_weed_plants: 4, diseased_plants: 100, isolation_verified_m: 250.0 }
              as: FieldOfficer
              as_user_id: "fo-1"
            - call: "POST /seed-ops/harvest-equipment"
              payload: { equipment_code: "CMB-7", equipment_kind: "COMBINE", cleanout_minutes_required: 45 }
              as: ConditioningManager
              captures: { eq_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /seed-ops/harvest-equipment/${eq_id}/cleanout-certification"
              payload: { variety_id: "${v_id}", cleaned_at: "2026-09-09T18:00:00Z" }
              as: ConditioningManager
          trigger:
            - call: "POST /seed-ops/harvest-events"
              payload: { production_contract_id: "${c_id}", harvest_equipment_id: "${eq_id}", window_start: "2026-09-10T08:00:00Z", window_end: "2026-09-10T18:00:00Z", gross_weight_kg: 41000.0, moisture_pct: 14.5, bag_size_kg: 25.0, provisional_clean_units: 9999.99 }
              as: ConditioningManager
              captures: { lot_id: $.data.seed_lot_id }
          assert:
            - "SeedLot.${lot_id}.provisional_clean_units == 1452.22, not 9999.99"
            - "SeedLot.${lot_id}.provisional_clean_kg == 36305.500 and intake_moisture_pct == 14.5"
            - "SeedLot.${lot_id}.current_kg == 41000.0 and cumulative_shrink_kg == 0.0 and dockage_pct == 0.00"
            - "ProductionContract.${c_id}.provisional_clean_units_total == 1452.22"

      - name: grower_system_fields_generated_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Grower.fields.id
          - entities.Grower.fields.version
        distinguishing_aspect: "id, created_at, updated_at and version are system-sourced: values supplied for them in the POST body are ignored and the server mints its own."
        test_recipe:
          setup:
            - "Empty database; logical clock at its default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /seed-ops/growers"
              payload: { grower_name: "Prairie Ridge Farms", region_code: "ND-07", contact_email: "ops@prairieridge.example", id: "00000000-0000-0000-0000-000000000000", version: 99, status: "SUSPENDED", compliance_flag_count: 7 }
              as: ProgramAdmin
              captures: { g_id: $.data.id }
          assert:
            - "Grower.${g_id}.id != 00000000-0000-0000-0000-000000000000 (server-minted, client value ignored)"
            - "Grower.${g_id}.version == 1, not 99"
            - "Grower.${g_id}.status == GOOD_STANDING and compliance_flag_count == 0, not SUSPENDED / 7"
            - "created_at and updated_at are present ISO 8601 instants stamped by the server"

      - name: contract_invalid_seed_class_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.ProductionContract.fields.seed_class
          - validations.priority_3_ERR_INVALID_REQUEST
        distinguishing_aspect: "seed_class GOLD_STANDARD is not a declared enum member, so the request fails with 400 ERR_INVALID_REQUEST before any eligibility or acreage rule is consulted."
        test_recipe:
          setup:
            - "Variety, grower and a 320.0-acre field exist"
          setup_api_calls:
            - call: "POST /seed-ops/varieties"
              payload: { crop_kind: "WHEAT", variety_name: "HRW-Sable", max_seed_class: "CERTIFIED", isolation_min_m: 200.0, restricted_prior_crop_kinds: ["WHEAT", "TRITICALE"], restricted_prior_crop_years: 3, germination_min_pct: 85.0, purity_min_pct: 97.0, max_off_type_per_10000: 10.0, max_restricted_weed_per_10000: 5.0, max_disease_incidence_pct: 2.0, max_rogueing_rounds: 2, estimated_conditioning_shrink_pct: 8.0, germ_validity_days: 270, max_carryover_generations: 2, treatment_required: false }
              as: ProgramAdmin
              captures: { v_id: $.data.id }
            - call: "POST /seed-ops/growers"
              payload: { grower_name: "Prairie Ridge Farms", region_code: "ND-07", contact_email: "ops@prairieridge.example" }
              as: ProgramAdmin
              captures: { g_id: $.data.id }
            - call: "POST /seed-ops/production-fields"
              payload: { grower_id: "${g_id}", field_code: "F-North-12", acres: 320.0, isolation_distance_m: 250.0 }
              as: ProgramAdmin
              captures: { f_id: $.data.id }
            - call: "POST /seed-ops/production-fields/${f_id}/history"
              payload: { crop_kind: "CANOLA", crop_year: 2024 }
              as: FieldOfficer
          trigger:
            - call: "POST /seed-ops/production-contracts"
              payload: { grower_id: "${g_id}", variety_id: "${v_id}", production_field_id: "${f_id}", season_year: 2026, seed_class: "GOLD_STANDARD", contracted_acres: 900.0, base_price_per_unit_cents: 1850, conditioning_charge_per_unit_cents: 220, advance_total_cents: 1200000 }
              as: ProgramAdmin
          assert:
            - "Returns 400 with data.error_id == ERR_INVALID_REQUEST"
            - "The response is NOT ERR_CONTRACTED_ACRES_EXCEED_FIELD, even though contracted_acres 900.0 also exceeds the field's 320.0 acres (priority 3 precedes priority 39)"
            - "GET /seed-ops/production-contracts returns total_count 0"

      - name: variety_immutable_has_no_version_field
        claim_type: immutability
        grounds:
          - entities.Variety
          - entities.FieldHistoryRecord
        distinguishing_aspect: "Variety and FieldHistoryRecord are declared with common_fields false, so section 1.5 exposes no update endpoint for them and their reads carry no version field to concurrency-check."
        test_recipe:
          setup:
            - "One variety and one field-history record exist"
          setup_api_calls:
            - call: "POST /seed-ops/varieties"
              payload: { crop_kind: "WHEAT", variety_name: "HRW-Sable", max_seed_class: "CERTIFIED", isolation_min_m: 200.0, restricted_prior_crop_kinds: ["WHEAT", "TRITICALE"], restricted_prior_crop_years: 3, germination_min_pct: 85.0, purity_min_pct: 97.0, max_off_type_per_10000: 10.0, max_restricted_weed_per_10000: 5.0, max_disease_incidence_pct: 2.0, max_rogueing_rounds: 2, estimated_conditioning_shrink_pct: 8.0, germ_validity_days: 270, max_carryover_generations: 2, treatment_required: false }
              as: ProgramAdmin
              captures: { v_id: $.data.id }
            - call: "POST /seed-ops/growers"
              payload: { grower_name: "Prairie Ridge Farms", region_code: "ND-07", contact_email: "ops@prairieridge.example" }
              as: ProgramAdmin
              captures: { g_id: $.data.id }
            - call: "POST /seed-ops/production-fields"
              payload: { grower_id: "${g_id}", field_code: "F-North-12", acres: 320.0, isolation_distance_m: 250.0 }
              as: ProgramAdmin
              captures: { f_id: $.data.id }
            - call: "POST /seed-ops/production-fields/${f_id}/history"
              payload: { crop_kind: "CANOLA", crop_year: 2024 }
              as: FieldOfficer
          trigger:
            - call: "GET /seed-ops/varieties/${v_id}"
              payload: {}
              as: ProgramAdmin
            - call: "GET /seed-ops/field-history-records"
              payload: { production_field_id: "${f_id}", limit: 10, offset: 0 }
              as: FieldOfficer
          assert:
            - "GET /seed-ops/varieties/${v_id} returns 200 and the data object contains no version field and no updated_at field"
            - "The history listing returns response_type array with exactly 1 item whose crop_kind == CANOLA and crop_year == 2024, and that item carries no version field"
            - "Section 1.5 declares no PATCH, PUT or DELETE route for /seed-ops/varieties or for field-history records"

      - name: field_history_create_on_unknown_field_not_found
        claim_type: parent_relationships
        grounds:
          - entities.FieldHistoryRecord.fields.production_field_id
          - errors.ERR_PRODUCTION_FIELD_NOT_FOUND
        distinguishing_aspect: "A sub-resource POST under an unknown production_field_id returns 404 ERR_PRODUCTION_FIELD_NOT_FOUND and writes no FieldHistoryRecord."
        test_recipe:
          setup:
            - "One real field exists so the parent collection is non-empty"
          setup_api_calls:
            - call: "POST /seed-ops/growers"
              payload: { grower_name: "Prairie Ridge Farms", region_code: "ND-07", contact_email: "ops@prairieridge.example" }
              as: ProgramAdmin
              captures: { g_id: $.data.id }
            - call: "POST /seed-ops/production-fields"
              payload: { grower_id: "${g_id}", field_code: "F-North-12", acres: 320.0, isolation_distance_m: 250.0 }
              as: ProgramAdmin
              captures: { f_id: $.data.id }
            - call: "POST /seed-ops/production-fields/${f_id}/history"
              payload: { crop_kind: "CANOLA", crop_year: 2024 }
              as: FieldOfficer
          trigger:
            - call: "POST /seed-ops/production-fields/00000000-0000-0000-0000-000000000000/history"
              payload: { crop_kind: "WHEAT", crop_year: 2025 }
              as: FieldOfficer
          assert:
            - "Returns 404 with data.error_id == ERR_PRODUCTION_FIELD_NOT_FOUND"
            - "GET /seed-ops/field-history-records?production_field_id=${f_id} still returns total_count 1 (the CANOLA 2024 record only)"

      - name: seed_lot_graph_links_resolve_from_both_parents
        claim_type: graph
        grounds:
          - complexity_profile.entity_topology
          - entities.SeedLot.fields.production_contract_id
          - entities.SeedLot.fields.variety_id
        distinguishing_aspect: "The SeedLot node is reachable by filtering on either of its two independent parents - production_contract_id and variety_id - which is the graph-topology cross-reference integrity claim, not a hierarchical nesting claim."
        test_recipe:
          setup:
            - "Golden contract harvested into one 41000.0 kg lot; clock at 2026-09-14T00:00:00Z"
          setup_api_calls:
            - call: "POST /seed-ops/varieties"
              payload: { crop_kind: "WHEAT", variety_name: "HRW-Sable", max_seed_class: "CERTIFIED", isolation_min_m: 200.0, restricted_prior_crop_kinds: ["WHEAT", "TRITICALE"], restricted_prior_crop_years: 3, germination_min_pct: 85.0, purity_min_pct: 97.0, max_off_type_per_10000: 10.0, max_restricted_weed_per_10000: 5.0, max_disease_incidence_pct: 2.0, max_rogueing_rounds: 2, estimated_conditioning_shrink_pct: 8.0, germ_validity_days: 270, max_carryover_generations: 2, treatment_required: false }
              as: ProgramAdmin
              captures: { v_id: $.data.id }
            - call: "POST /seed-ops/growers"
              payload: { grower_name: "Prairie Ridge Farms", region_code: "ND-07", contact_email: "ops@prairieridge.example" }
              as: ProgramAdmin
              captures: { g_id: $.data.id }
            - call: "POST /seed-ops/production-fields"
              payload: { grower_id: "${g_id}", field_code: "F-North-12", acres: 320.0, isolation_distance_m: 250.0 }
              as: ProgramAdmin
              captures: { f_id: $.data.id }
            - call: "POST /seed-ops/production-fields/${f_id}/history"
              payload: { crop_kind: "CANOLA", crop_year: 2024 }
              as: FieldOfficer
