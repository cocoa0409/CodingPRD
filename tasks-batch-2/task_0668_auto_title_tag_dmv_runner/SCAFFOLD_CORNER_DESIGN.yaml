        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[leg-attach-stale-trip]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After one leg attach bumps RunnerTrip.version, a second attach carrying the pre-attach (now stale) expected_runnertrip_version is rejected with 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Two submitted REGISTRATION transactions and a capacity-5 trip; one leg already attached so the trip version advanced past the captured pre-attach version."]
          setup_api_calls:
            - call: "POST /dmv/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
