            - "Naming solicitation 2's proposal returns 409 with ${foreign_proposal_error_id} == ERR_PROPOSAL_NOT_IN_SOLICITATION"
            - "Including the DRAFT proposal returns 409 with ${draft_proposal_error_id} == ERR_PROPOSAL_NOT_IN_SOLICITATION even though it does belong to this solicitation"
            - "Naming a non-existent proposal returns 404 with ${unknown_proposal_error_id} == ERR_PROPOSAL_NOT_FOUND, because priority 4 existence precedes priority 13 membership"
            - "Solicitation.${sol1_id}.preference_filing_count is still 0 and version is still ${sol1_v} after the three refusals, so no partial rows were written"
            - "The filing naming only ${p1_sub_id} returns 201 with preference_filing_count == 1, and GET /eas/solicitations/${sol1_id}/preferences returns exactly 1 row"
            - "GET /eas/proposals/${p1_sub_id}/preferences returns that single row with rank 1 and filing_sequence 1, while GET /eas/proposals/${p2_sub_id}/preferences returns 0 rows"
            - "Solicitation.${sol2_id}.preference_filing_count is still 0 — the filing did not leak across solicitations"

      - name: aircraft_retirement_blocks_new_submissions_only
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/eas/aircraft-types/{id}/retire
          - validations.priority_12
          - errors.ERR_AIRCRAFT_TYPE_RETIRED
        distinguishing_aspect: "Retirement is evaluated at submission time only: a proposal already SUBMITTED on the type keeps its state and stays a live candidate, while a DRAFT proposal on the same type can no longer be submitted, and the retired type remains readable and referenceable by the resulting agreement."
        test_recipe:
          setup:
            - "Community HYS ELIGIBLE, an OPEN solicitation, two aircraft types, one proposal already SUBMITTED on the B190 and one DRAFT proposal on the same B190."
          setup_api_calls:
