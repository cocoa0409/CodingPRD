              captures: { rent_id: $.data.id }
            - call: "POST /lessons/${les_id}/complete"
              payload: { outcome: "COMPLETED" }
              as: SalesAssociate
          trigger:
            - call: "POST /rentals/${rent_id}/checkout"
              payload: {}
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "checkout response data.error_id == ERR_LESSON_NOT_SCHEDULED"
            - "Rental.${rent_id}.fulfillment_status == RESERVED"

      - name: event_entry_requires_event_published
        grounds:
          - validations[priority=11]
          - state_machines.Event.DRAFT_to_PUBLISHED
          - errors[ERR_EVENT_NOT_OPEN]
        distinguishing_aspect: "Entity pair EventEntry→Event (distinct from Rental→Lesson): registering for a DRAFT (unpublished) event is rejected ERR_EVENT_NOT_OPEN and entry_count stays 0."
        test_recipe:
          setup:
            - "A Customer and a DRAFT (never-published) Event."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ce2@x.com", full_name: "Cross Two" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /events"
              payload: { name: "Winter Contest", sponsor: "BrandY", venue: "City Park", start_at: "2026-07-12T00:00:00Z", capacity: 5, entry_fee_cents: 3000 }
              as: ShopManager
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /event-entries"
              payload: { event_id: "${ev_id}", customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "event-entry create response data.error_id == ERR_EVENT_NOT_OPEN"
            - "Event.${ev_id}.entry_count == 0"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: coach_lesson_buffer_overlap_semantics
        grounds:
          - validations[priority=8]
          - entities.Lesson.fields.start_at
          - errors[ERR_COACH_UNAVAILABLE]
        distinguishing_aspect: "Resource Coach with buffer semantics: SETUP_BUFFER_MINUTES=15 separation required — a lesson starting 10 min after the prior ends is rejected ERR_COACH_UNAVAILABLE, while one starting exactly at end+15min is accepted."
        test_recipe:
          setup:
            - "A Coach with one SCHEDULED lesson 07-08 10:00–11:00 and a Customer."
          setup_api_calls:
            - call: "POST /coaches"
              payload: { name: "Coach C", discipline: "SURF" }
              as: ShopManager
              captures: { coach_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "ov1@x.com", full_name: "Over One" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /lessons"
              payload: { coach_id: "${coach_id}", customer_id: "${cust_id}", discipline: "SURF", start_at: "2026-07-08T10:00:00Z", end_at: "2026-07-08T11:00:00Z" }
              as: SalesAssociate
              captures: { les1_id: $.data.id }
          trigger:
            - call: "POST /lessons"
              payload: { coach_id: "${coach_id}", customer_id: "${cust_id}", discipline: "SURF", start_at: "2026-07-08T11:10:00Z", end_at: "2026-07-08T11:40:00Z" }
              as: SalesAssociate
              captures: { err: $.data.error_id }
            - call: "POST /lessons"
              payload: { coach_id: "${coach_id}", customer_id: "${cust_id}", discipline: "SURF", start_at: "2026-07-08T11:15:00Z", end_at: "2026-07-08T11:45:00Z" }
              as: SalesAssociate
              captures: { les3_id: $.data.id, les3_status: $.data.status }
          assert:
            - "the 11:10 lesson (only 10 min after 11:00 end) response data.error_id == ERR_COACH_UNAVAILABLE"
            - "the 11:15 lesson (== end + 15 min buffer) succeeds with Lesson.${les3_id}.status == SCHEDULED"

      - name: rental_asset_adjacency_allowed_overlap_rejected
        grounds:
          - validations[priority=9]
          - entities.Rental.fields.start_at
          - errors[ERR_ASSET_UNAVAILABLE]
        distinguishing_aspect: "Resource RentalAsset with adjacency-allowed half-open semantics (no buffer, distinct from Coach): a rental starting exactly at the prior rental's end (07-04) is accepted, while an overlapping one (start 07-03 inside [07-02,07-04)) is rejected ERR_ASSET_UNAVAILABLE."
        test_recipe:
          setup:
            - "A rentable product, a RentalAsset, a Customer, and a Rental holding the asset for 07-02→07-04."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "SB-2", name: "Longboard", category: "SURFBOARD", unit_price_cents: 60000, rental_day_rate_cents: 2500, is_rentable: true }
              as: ShopManager
              captures: { prod_id: $.data.id }
            - call: "POST /rental-assets"
              payload: { product_id: "${prod_id}", asset_tag: "SB-2A" }
              as: ShopManager
              captures: { asset_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "ov2@x.com", full_name: "Over Two" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /rentals"
              payload: { customer_id: "${cust_id}", rental_asset_id: "${asset_id}", start_at: "2026-07-02T00:00:00Z", end_at: "2026-07-04T00:00:00Z", deposit_cents: 5000 }
              as: SalesAssociate
              captures: { rent1_id: $.data.id }
          trigger:
            - call: "POST /rentals"
              payload: { customer_id: "${cust_id}", rental_asset_id: "${asset_id}", start_at: "2026-07-03T00:00:00Z", end_at: "2026-07-05T00:00:00Z", deposit_cents: 5000 }
              as: SalesAssociate
              captures: { err: $.data.error_id }
            - call: "POST /rentals"
              payload: { customer_id: "${cust_id}", rental_asset_id: "${asset_id}", start_at: "2026-07-04T00:00:00Z", end_at: "2026-07-06T00:00:00Z", deposit_cents: 5000 }
              as: SalesAssociate
              captures: { rent3_id: $.data.id, rent3_status: $.data.fulfillment_status }
          assert:
            - "the overlapping rental (start 07-03 within [07-02,07-04)) response data.error_id == ERR_ASSET_UNAVAILABLE"
            - "the adjacent rental (start 07-04 == prior end) succeeds with Rental.${rent3_id}.fulfillment_status == RESERVED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: build_reserve_cancel_conserves_inventory_units
        grounds:
          - state_machines.BoardBuild.DRAFT_to_RESERVED
          - state_machines.BoardBuild.RESERVED_to_CANCELLED
          - calculations.product_availability
          - entities.Product.fields.on_hand_qty
          - entities.Product.fields.reserved_qty
        distinguishing_aspect: "Conserved quantity #1 = Product inventory units: reserve (+3 reserved) paired with cancel (−3 reserved) restores reserved_qty to 0 and leaves on_hand_qty unchanged at 8; invariant available_qty == on_hand_qty − reserved_qty holds after both."
        test_recipe:
          setup:
            - "A Customer, a Product with on_hand 8, a DRAFT BoardBuild qty 3 that has been reserved (reserved_qty 3, available 5)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "inv@x.com", full_name: "Inv Ida" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "TRK-1", name: "Trucks", category: "TRUCKS", unit_price_cents: 5000 }
              as: ShopManager
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/inventory-adjustments"
              payload: { delta_on_hand: 8 }
              as: ShopManager
            - call: "POST /board-builds"
              payload: { customer_id: "${cust_id}", components: [ { product_id: "${prod_id}", qty: 3 } ] }
              as: BenchTech
              captures: { bb_id: $.data.id }
            - call: "POST /board-builds/${bb_id}/reserve"
              payload: {}
              as: BenchTech
          trigger:
            - call: "POST /board-builds/${bb_id}/cancel"
              payload: {}
              as: BenchTech
              captures: { st: $.data.status }
          assert:
            - "BoardBuild.${bb_id}.status == CANCELLED"
            - "Product.${prod_id}.on_hand_qty == 8"
            - "Product.${prod_id}.reserved_qty == 0"
            - "Product.${prod_id}.available_qty == 8"

      - name: event_entry_register_cancel_conserves_loyalty_points
        grounds:
          - state_machines.EventEntry.REGISTERED_to_CANCELLED
          - entities.Customer.fields.loyalty_points
          - entities.EventEntry.fields.points_awarded
        distinguishing_aspect: "Conserved quantity #2 = loyalty points (distinct from inventory units): an entry accrues exactly points_awarded (100) and its cancel reverses exactly that amount, restoring Customer.loyalty_points to the pre-entry value 0."
        test_recipe:
          setup:
            - "A Customer, a PUBLISHED Event (entry_fee 5000), and a REGISTERED entry that accrued 100 points."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "lp@x.com", full_name: "Loy Points" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /events"
              payload: { name: "Bowl Jam", sponsor: "BrandZ", venue: "The Bowl", start_at: "2026-07-14T00:00:00Z", capacity: 20, entry_fee_cents: 5000 }
              as: ShopManager
              captures: { ev_id: $.data.id }
            - call: "POST /events/${ev_id}/publish"
              payload: {}
              as: ShopManager
            - call: "POST /event-entries"
              payload: { event_id: "${ev_id}", customer_id: "${cust_id}", role: "PUBLIC" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ee_id: $.data.id, pa: $.data.points_awarded }
          trigger:
            - call: "POST /event-entries/${ee_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { st: $.data.status }
          assert:
            - "EventEntry.${ee_id}.points_awarded == 100"
            - "EventEntry.${ee_id}.status == CANCELLED"
            - "Customer.${cust_id}.loyalty_points == 0"
