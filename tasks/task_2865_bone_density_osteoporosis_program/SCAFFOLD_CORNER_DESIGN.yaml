      - name: patient_create_unauthenticated_then_forbidden_then_invalid_request_rejected
        claim_type: priority_ordering
        grounds:
          - validations[priority 1]
          - validations[priority 2]
          - validations[priority 3]
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_FORBIDDEN_ROLE]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "The first three priorities are strictly ordered on one endpoint: a request with no identity headers and a malformed body returns 401 ERR_UNAUTHENTICATED (not 422), a Technologist with a perfectly valid body returns 403 ERR_FORBIDDEN_ROLE (not 201), and only once the identity gates pass does a bad enum or a missing required field surface as 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "One PayerPolicy exists so that a valid patient body can be built."
          setup_api_calls:
            - call: "POST /bone-density/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /bone-density/payer-policies"
              payload: { payer_code: "PAY-STD", name: "Standard Bone Health", baseline_screening_min_interval_months: 24, high_risk_min_interval_months: 12, treatment_monitoring_min_interval_months: 12, vfa_covered: true, vfa_requires_height_loss_cm: 4.0, repeat_scan_grace_days: 30, max_lifetime_screening_scans: 6, appeal_allowed: false }
              as: ProgramAdmin
              captures: { policy_id: $.data.id }
          trigger:
            - call: "POST /bone-density/patients"
              payload: { mrn: "MRN-6101", primary_payer_policy_id: "${policy_id}", birth_date: "1958-05-12", sex: "NOT_A_SEX", postmenopausal: true, baseline_height_cm: 165.0 }
              as: "(no X-User-Role and no X-User-ID header)"
            - call: "POST /bone-density/patients"
              payload: { mrn: "MRN-6102", primary_payer_policy_id: "${policy_id}", birth_date: "1958-05-12", sex: "FEMALE", postmenopausal: true, baseline_height_cm: 165.0 }
              as: Technologist
              as_user_id: "tech-001"
            - call: "POST /bone-density/patients"
              payload: { mrn: "MRN-6103", primary_payer_policy_id: "${policy_id}", birth_date: "1958-05-12", sex: "NOT_A_SEX", postmenopausal: true, baseline_height_cm: 165.0 }
              as: Scheduler
            - call: "POST /bone-density/patients"
              payload: { primary_payer_policy_id: "${policy_id}", birth_date: "1958-05-12", sex: "FEMALE", postmenopausal: true, baseline_height_cm: 165.0 }
              as: Scheduler
          assert:
            - "the first trigger response status is 401 and data.error_id is ERR_UNAUTHENTICATED"
            - "the second trigger response status is 403 and data.error_id is ERR_FORBIDDEN_ROLE"
            - "the third trigger response status is 422 and data.error_id is ERR_INVALID_REQUEST"
            - "the fourth trigger response status is 422 and data.error_id is ERR_INVALID_REQUEST"
            - "GET /bone-density/patients returns total_count 0, so none of the four attempts persisted a row"
