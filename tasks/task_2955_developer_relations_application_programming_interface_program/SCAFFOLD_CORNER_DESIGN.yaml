      - name: resolve_before_first_communication_is_a_state_refusal
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.SupportCase RESPONDING -> RESOLVED
          - validations.priority_16_support_case_state
          - validations.priority_52_no_communication_recorded
          - errors.ERR_SUPPORT_CASE_STATE_INVALID
        distinguishing_aspect: >-
          An OPEN case violates two rules at once — the state precondition (priority 16 allows
          resolve only from RESPONDING or ESCALATED) and the "at least one communication"
          constraint (priority 52) — so the state error must surface. After one communication
          the same resolve call succeeds, which proves the refusal was the precondition and not
          a permanent block.
        test_recipe:
          setup:
            - "an OPEN PLATFORM_INCIDENT S3 for product P1 started at 2026-08-01T00:00:00Z, clock at 2026-08-01T01:00:00Z"
          setup_api_calls:
