scaffold_corner_design:

  # ==========================================================================
  # Section: entities
  # ==========================================================================
  - section: entities
    instances:
      - name: borrower_create_returns_id_and_defaults
        claim_type: Creation
        grounds: ["entities.Borrower"]
        distinguishing_aspect: "POST /borrowers with full_name + ssn_last4 returns 201 with server-minted id, created_at, version=1, and is_veteran defaulting to false."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /loan-servicing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
          trigger:
            - call: "POST /loan-servicing/borrowers"
              payload: { full_name: "Defaults B", ssn_last4: "1111" }
              as: LoanServicer
              captures: { b_id: $.data.id, b_v: $.data.version, b_vet: $.data.is_veteran }
          assert:
            - "${b_v} == 1"
            - "${b_vet} == false"

      - name: borrower_create_missing_full_name_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.Borrower.fields.full_name"]
        distinguishing_aspect: "Missing required full_name on POST /borrowers returns ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /loan-servicing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
          trigger:
            - call: "POST /loan-servicing/borrowers"
              payload: { ssn_last4: "0001" }
              as: LoanServicer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: loan_create_invalid_loan_type_enum_rejected
        claim_type: Type Constraints
        grounds: ["entities.Loan.fields.loan_type"]
        distinguishing_aspect: "POST /loans with loan_type='DIRECT_BAD' (not in {DIRECT_SUB, DIRECT_UNSUB, DIRECT_PLUS}) returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["A Borrower exists"]
          setup_api_calls:
            - call: "POST /loan-servicing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /loan-servicing/borrowers"
              payload: { full_name: "Enum B", ssn_last4: "0002", is_veteran: false }
              as: LoanServicer
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /loan-servicing/loans"
              payload: { borrower_id: "${b_id}", loan_type: "DIRECT_BAD", principal_cents: 100000, interest_rate_bps: 500, disbursement_date: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: loan_create_defaults_status_originated
        claim_type: Defaults
        grounds: ["entities.Loan.fields.status"]
        distinguishing_aspect: "Newly created Loan has status='ORIGINATED' and version=1."
        test_recipe:
          setup: ["Borrower exists"]
          setup_api_calls:
            - call: "POST /loan-servicing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /loan-servicing/borrowers"
              payload: { full_name: "Init B", ssn_last4: "0003", is_veteran: false }
              as: LoanServicer
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /loan-servicing/loans"
              payload: { borrower_id: "${b_id}", loan_type: "DIRECT_UNSUB", principal_cents: 100000, interest_rate_bps: 500, disbursement_date: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              captures: { ln_status: $.data.status, ln_v: $.data.version }
          assert:
            - "${ln_status} == ORIGINATED"
            - "${ln_v} == 1"

      - name: loan_create_with_unknown_borrower_id_returns_borrower_not_found
        claim_type: Parent Relationships
        grounds: ["entities.Loan.fields.borrower_id"]
        distinguishing_aspect: "POST /loans with borrower_id referencing no existing Borrower returns ERR_BORROWER_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /loan-servicing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
          trigger:
            - call: "POST /loan-servicing/loans"
              payload: { borrower_id: "00000000-0000-0000-0000-000000000000", loan_type: "DIRECT_UNSUB", principal_cents: 100000, interest_rate_bps: 500, disbursement_date: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_BORROWER_NOT_FOUND"

      - name: loan_get_not_found_uuid_returns_loan_not_found
        claim_type: Not Found
        grounds: ["entities.Loan"]
        distinguishing_aspect: "GET /loans/{non-existent-uuid} returns ERR_LOAN_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /loan-servicing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
          trigger:
            - call: "GET /loan-servicing/loans/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: LoanServicer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_LOAN_NOT_FOUND"

      - name: loan_listing_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds: ["entities.Loan"]
        distinguishing_aspect: "GET /loans returns paginated envelope including total_count and has_more."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /loan-servicing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
          trigger:
            - call: "GET /loan-servicing/loans"
              payload: {}
              as: LoanServicer
          assert:
            - "response.data is an array; response includes pagination fields limit, offset, total_count, has_more"

      - name: status_change_is_event_log_no_version_field
        claim_type: Immutability
        grounds: ["entities.StatusChange"]
        distinguishing_aspect: "StatusChange has common_fields: false; only id and created_at; no version field, no update endpoint declared in §1.5."
        excluded_because:
          difficulty_instance: transitive_cascade / default_declare_depth2_loan_plan
          rationale: "StatusChange immutability is indirectly observed in the cascade tests that read /loans/{id}/status-changes after transitions."

      - name: loan_computed_pslf_count_ignores_input
        claim_type: Computed Fields
        grounds: ["entities.Loan.fields.pslf_qualifying_payment_count"]
        distinguishing_aspect: "pslf_qualifying_payment_count is computed; passing it as input to POST /loans is ignored — the response shows the freshly computed value (0 at creation)."
        test_recipe:
          setup: ["Borrower exists"]
          setup_api_calls:
            - call: "POST /loan-servicing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /loan-servicing/borrowers"
              payload: { full_name: "Cmp B", ssn_last4: "0004", is_veteran: false }
              as: LoanServicer
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /loan-servicing/loans"
              payload: { borrower_id: "${b_id}", loan_type: "DIRECT_UNSUB", principal_cents: 100000, interest_rate_bps: 500, disbursement_date: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              captures: { pslf: $.data.pslf_qualifying_payment_count }
          assert:
            - "${pslf} == 0"

  # ==========================================================================
  # Section: state_machines
  # ==========================================================================
  - section: state_machines
    instances:
      - name: loan_originated_initial_state
        claim_type: Initial State
        grounds: ["state_machines.Loan"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / priority_state_vs_business_safety_default_threshold_wins_over_invalid_state
          rationale: "Initial state ORIGINATED is implicit in many §1.8 instances (declare-default on a new Loan checks state=IN_SCHOOL after enter-school)."

      - name: loan_originated_cannot_graduate_directly
        claim_type: Invalid Transitions
        grounds: ["state_machines.Loan.transitions.IN_SCHOOL_to_GRACE"]
        distinguishing_aspect: "Calling /graduate from ORIGINATED (skipping enter-school) is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Loan in ORIGINATED"]
          setup_api_calls:
            - call: "POST /loan-servicing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /loan-servicing/borrowers"
              payload: { full_name: "Inv B", ssn_last4: "0005", is_veteran: false }
              as: LoanServicer
              captures: { b_id: $.data.id }
            - call: "POST /loan-servicing/loans"
              payload: { borrower_id: "${b_id}", loan_type: "DIRECT_UNSUB", principal_cents: 100000, interest_rate_bps: 500, disbursement_date: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              captures: { ln_id: $.data.id }
          trigger:
            - call: "POST /loan-servicing/loans/${ln_id}/graduate"
              payload: {}
              as: LoanServicer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE"

      - name: loan_paid_off_is_terminal_no_resume
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Loan.terminal_states"]
        distinguishing_aspect: "Once Loan.status=PAID_OFF, /resume-repayment is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Loan in PAID_OFF (balance 0 from a covering payment)"]
          setup_api_calls:
            - call: "POST /loan-servicing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /loan-servicing/borrowers"
              payload: { full_name: "Pay B", ssn_last4: "0006", is_veteran: false }
              as: LoanServicer
              captures: { b_id: $.data.id }
            - call: "POST /loan-servicing/loans"
              payload: { borrower_id: "${b_id}", loan_type: "DIRECT_UNSUB", principal_cents: 100, interest_rate_bps: 500, disbursement_date: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              captures: { ln_id: $.data.id }
            - call: "POST /loan-servicing/loans/${ln_id}/enter-school"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/loans/${ln_id}/graduate"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/loans/${ln_id}/start-repayment"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/payments"
              payload: { loan_id: "${ln_id}", amount_cents: 100, payment_date: "2026-06-01T00:00:00Z" }
              as: Borrower
              as_user_id: "${b_id}"
              captures: { pay_id: $.data.id }
            - call: "POST /loan-servicing/payments/${pay_id}/apply"
              payload: {}
              as: LoanServicer
              captures: { ln_status: $.data.status }
          trigger:
            - call: "POST /loan-servicing/loans/${ln_id}/resume-repayment"
              payload: {}
              as: LoanServicer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE"

      - name: deferment_to_repayment_capitalizes_accrued_interest
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Loan.transitions.DEFERMENT_to_REPAYMENT
          - entities.Loan.fields.capitalized_interest_cents
        distinguishing_aspect: "Resuming from DEFERMENT moves accrued_interest_cents (4560) into principal_balance_cents and capitalized_interest_cents; accrued_interest_cents := 0."
        test_recipe:
          setup:
            - "DIRECT_UNSUB Loan principal=1_111_111, rate=500 bps in REPAYMENT since 2026-06-01"
            - "Clock advanced to 2026-07-01 (accrued_interest_cents = 4560 per chronological per-day rule)"
            - "Then borrower requests deferment"
          setup_api_calls:
            - call: "POST /loan-servicing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /loan-servicing/borrowers"
              payload: { full_name: "Cap B", ssn_last4: "0007", is_veteran: false }
              as: LoanServicer
              captures: { b_id: $.data.id }
            - call: "POST /loan-servicing/loans"
              payload: { borrower_id: "${b_id}", loan_type: "DIRECT_UNSUB", principal_cents: 1111111, interest_rate_bps: 500, disbursement_date: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              captures: { ln_id: $.data.id }
            - call: "POST /loan-servicing/loans/${ln_id}/enter-school"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/loans/${ln_id}/graduate"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/loans/${ln_id}/start-repayment"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /loan-servicing/loans/${ln_id}/request-deferment"
              payload: {}
              as: Borrower
              as_user_id: "${b_id}"
          trigger:
            - call: "POST /loan-servicing/loans/${ln_id}/resume-repayment"
              payload: {}
              as: LoanServicer
              captures: { ln_bal: $.data.principal_balance_cents, ln_int: $.data.accrued_interest_cents, ln_cap: $.data.capitalized_interest_cents }
          assert:
            - "${ln_bal} == 1115671"
            - "${ln_int} == 0"
            - "${ln_cap} == 4560"

      - name: idempotency_double_enter_school_second_call_rejected
        claim_type: Idempotency
        grounds: ["state_machines.Loan.transitions.ORIGINATED_to_IN_SCHOOL"]
        distinguishing_aspect: "Second POST /loans/{id}/enter-school after the first returns ERR_INVALID_STATE (loan is now IN_SCHOOL, not ORIGINATED)."
        test_recipe:
          setup: ["Loan in IN_SCHOOL (already after first enter-school)"]
          setup_api_calls:
            - call: "POST /loan-servicing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /loan-servicing/borrowers"
              payload: { full_name: "Idm B", ssn_last4: "0008", is_veteran: false }
              as: LoanServicer
              captures: { b_id: $.data.id }
            - call: "POST /loan-servicing/loans"
              payload: { borrower_id: "${b_id}", loan_type: "DIRECT_UNSUB", principal_cents: 100000, interest_rate_bps: 500, disbursement_date: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              captures: { ln_id: $.data.id }
            - call: "POST /loan-servicing/loans/${ln_id}/enter-school"
              payload: {}
              as: LoanServicer
          trigger:
            - call: "POST /loan-servicing/loans/${ln_id}/enter-school"
              payload: {}
              as: LoanServicer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE"

      - name: direct_sub_in_school_accrues_zero_interest_subsidy
        claim_type: Side Effect Execution
        grounds: ["state_machines.Loan.transitions.ORIGINATED_to_IN_SCHOOL", "calculations.interest_accrual"]
        distinguishing_aspect: "DIRECT_SUB Loan in IN_SCHOOL after a 30-day clock advance has accrued_interest_cents = 0 (subsidized), while a parallel DIRECT_UNSUB would accrue 4560."
        test_recipe:
          setup: ["DIRECT_SUB Loan, principal=1_111_111, rate=500 bps, in IN_SCHOOL from 2026-06-01"]
          setup_api_calls:
            - call: "POST /loan-servicing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /loan-servicing/borrowers"
              payload: { full_name: "Sub B", ssn_last4: "0009", is_veteran: false }
              as: LoanServicer
              captures: { b_id: $.data.id }
            - call: "POST /loan-servicing/loans"
              payload: { borrower_id: "${b_id}", loan_type: "DIRECT_SUB", principal_cents: 1111111, interest_rate_bps: 500, disbursement_date: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              captures: { ln_id: $.data.id }
            - call: "POST /loan-servicing/loans/${ln_id}/enter-school"
              payload: {}
              as: LoanServicer
          trigger:
            - call: "POST /loan-servicing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: LoanServicer
            - call: "GET /loan-servicing/loans/${ln_id}"
              payload: {}
              as: LoanServicer
              captures: { ln_int: $.data.accrued_interest_cents }
          assert:
            - "${ln_int} == 0"

      - name: discharge_application_branching_deny_no_loan_cascade
        claim_type: Side Effect Execution
        grounds: ["state_machines.DischargeApplication.transitions.UNDER_REVIEW_to_DENIED"]
        distinguishing_aspect: "Denying a DischargeApplication leaves parent Loan.status unchanged (REPAYMENT) — no cascade fires."
        test_recipe:
          setup: ["DischargeApplication in UNDER_REVIEW; parent Loan in REPAYMENT"]
          setup_api_calls:
            - call: "POST /loan-servicing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /loan-servicing/borrowers"
              payload: { full_name: "Dny B", ssn_last4: "0012", is_veteran: false }
              as: LoanServicer
              captures: { b_id: $.data.id }
            - call: "POST /loan-servicing/loans"
              payload: { borrower_id: "${b_id}", loan_type: "DIRECT_UNSUB", principal_cents: 100000, interest_rate_bps: 500, disbursement_date: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              captures: { ln_id: $.data.id }
            - call: "POST /loan-servicing/loans/${ln_id}/enter-school"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/loans/${ln_id}/graduate"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/loans/${ln_id}/start-repayment"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/discharge-applications"
              payload: { loan_id: "${ln_id}", discharge_type: "VETERAN_TOTAL_DISABILITY" }
              as: Borrower
              as_user_id: "${b_id}"
              captures: { da_id: $.data.id }
            - call: "POST /loan-servicing/discharge-applications/${da_id}/begin-review"
              payload: {}
              as: LoanServicer
          trigger:
            - call: "POST /loan-servicing/discharge-applications/${da_id}/deny"
              payload: { review_notes: "documentation incomplete" }
              as: LoanServicer
              captures: { da_status: $.data.status }
            - call: "GET /loan-servicing/loans/${ln_id}"
              payload: {}
              as: LoanServicer
              captures: { ln_status: $.data.status }
          assert:
            - "${da_status} == DENIED"
            - "${ln_status} == REPAYMENT"

  # ==========================================================================
  # Section: calculations
  # ==========================================================================
  - section: calculations
    instances:
      - name: idr_paye_correct_result
        claim_type: Correct Result
        grounds: ["calculations.idr_monthly_payment"]
        distinguishing_aspect: "PAYE variant: AGI=6_000_000, family_size=2, CONTIGUOUS_48 → monthly_payment_cents == 23675."
        test_recipe:
          setup: ["Borrower with CERTIFIED IncomeCertification (AGI=6_000_000, family_size=2, CA); Loan in REPAYMENT"]
          setup_api_calls:
            - call: "POST /loan-servicing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /loan-servicing/borrowers"
              payload: { full_name: "Paye B", ssn_last4: "0013", is_veteran: false }
              as: LoanServicer
              captures: { b_id: $.data.id }
            - call: "POST /loan-servicing/loans"
              payload: { borrower_id: "${b_id}", loan_type: "DIRECT_UNSUB", principal_cents: 3000000, interest_rate_bps: 533, disbursement_date: "2023-06-01T00:00:00Z" }
              as: LoanServicer
              captures: { ln_id: $.data.id }
            - call: "POST /loan-servicing/loans/${ln_id}/enter-school"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/loans/${ln_id}/graduate"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/loans/${ln_id}/start-repayment"
              payload: {}
              as: LoanServicer
              captures: { ln_v: $.data.version }
            - call: "POST /loan-servicing/income-certifications"
              payload: { borrower_id: "${b_id}", agi_cents: 6000000, family_size: 2, state_code: "CA", effective_date: "2026-05-01T00:00:00Z" }
              as: Borrower
              as_user_id: "${b_id}"
              captures: { ic_id: $.data.id }
            - call: "POST /loan-servicing/income-certifications/${ic_id}/certify"
              payload: {}
              as: LoanServicer
          trigger:
            - call: "POST /loan-servicing/repayment-plans"
              payload: { loan_id: "${ln_id}", plan_type: "PAYE", effective_date: "2026-06-01T00:00:00Z", expected_loan_version: "${ln_v}" }
              as: LoanServicer
              captures: { mp: $.data.monthly_payment_cents }
          assert:
            - "${mp} == 23675"

      - name: idr_standard_amortization_correct_result
        claim_type: Correct Result
        grounds: ["calculations.idr_monthly_payment"]
        distinguishing_aspect: "STANDARD variant: 10-year amortization on principal=3_000_000 cents at 533 bps → monthly_payment_cents == 32306."
        test_recipe:
          setup: ["Borrower & DIRECT_UNSUB Loan in REPAYMENT, principal=3_000_000, rate=533 bps"]
          setup_api_calls:
            - call: "POST /loan-servicing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /loan-servicing/borrowers"
              payload: { full_name: "Std B", ssn_last4: "0014", is_veteran: false }
              as: LoanServicer
              captures: { b_id: $.data.id }
            - call: "POST /loan-servicing/loans"
              payload: { borrower_id: "${b_id}", loan_type: "DIRECT_UNSUB", principal_cents: 3000000, interest_rate_bps: 533, disbursement_date: "2023-06-01T00:00:00Z" }
              as: LoanServicer
              captures: { ln_id: $.data.id }
            - call: "POST /loan-servicing/loans/${ln_id}/enter-school"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/loans/${ln_id}/graduate"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/loans/${ln_id}/start-repayment"
              payload: {}
              as: LoanServicer
              captures: { ln_v: $.data.version }
          trigger:
            - call: "POST /loan-servicing/repayment-plans"
