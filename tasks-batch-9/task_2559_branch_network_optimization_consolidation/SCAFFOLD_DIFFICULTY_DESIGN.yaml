            - call: "POST /distribution/consolidation-cases/${case_id}/impact-assessments"
              payload: { lmi_tract: true, distance_to_nearest_remaining_miles: 4.9, alternative_access_count: 3, senior_household_pct_bps: 1600, public_transit_access: true }
