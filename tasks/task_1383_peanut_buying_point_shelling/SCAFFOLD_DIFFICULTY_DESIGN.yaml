      - name: dock_window_closed_interval_buffer
        grounds:
          - validations[priority=9]
          - errors[ERR_DOCK_WINDOW_OVERLAP]
          - entities.DeliveryCall.fields.dock_window_start
        distinguishing_aspect: |
          Resource ShellerContract dock, closed-interval-plus-buffer semantics:
          a second call starting 60 minutes after the first window's inclusive
          end is REJECTED (TURNAROUND_BUFFER_MIN 120 expands both sides), while
          a start at exactly end+120min is allowed — geometrically different
          from the dryer's half-open adjacency rule (where gap-0 is legal).
        test_recipe:
          setup:
            - "Foundation (WH-G 2000); contract 100t ACTIVE, window 2026-09-01T00:00Z to 2026-11-01T00:00Z"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T09:00:00Z" }, as: BuyingPointAdmin }
