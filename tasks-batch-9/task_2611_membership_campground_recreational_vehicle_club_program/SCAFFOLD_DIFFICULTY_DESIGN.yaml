scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: entitlement_nights_provisional_at_confirmation_vs_final_at_checkout
        grounds:
          - calculations.entitlement_nights_charge
          - entities.Membership.fields.nights_used_class_b
          - entities.Reservation.fields.entitlement_nights_charged
          - state_machines.Reservation.CONFIRMED_to_CHECKED_IN
          - state_machines.Reservation.CHECKED_IN_to_COMPLETED
        distinguishing_aspect: |
          This dual variant lives in the night-entitlement ledger domain (Membership x Reservation):
          the same six-night stay debits 6 nights under variant provisional_at_confirmation and 3
          nights under variant final_at_checkout, so Membership.nights_used_class_b is 6 before
          check-out and exactly 3 after it.
        test_recipe:
          setup:
            - "Logical clock at the 2026-08-01T00:00:00Z default"
            - "PRESIDENT tier: 21 CLASS_B entitlement nights, 120-day advance window, 21-night consecutive limit"
            - "One member holding one ACTIVE, dues-CURRENT PRESIDENT membership"
            - "One OPEN CLASS_B park with 40 sites and a 60% member allocation (24 member-pool sites)"
          setup_api_calls:
            - call: "POST /membership-tiers"
              payload: { code: "PRESIDENT", name: "President Class", tier_rank: 3, upfront_cost_cents: 1850000, annual_dues_cents: 58000, entitlement_nights_class_a: 14, entitlement_nights_class_b: 21, entitlement_nights_class_c: 28, annual_total_night_cap: 45, advance_window_days: 120, max_consecutive_stay_nights: 21, min_out_nights_between_stays: 1, affiliate_access_enabled: true, resale_allowed: true, transfer_fee_cents: 95000 }
              as: ClubAdmin
              captures: { tier_pres_id: "$.data.id" }
            - call: "POST /members"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", home_region: "Southwest" }
              as: ClubAdmin
              captures: { mbr_dana_id: "$.data.id" }
            - call: "POST /memberships"
              payload: { member_id: "${mbr_dana_id}", tier_id: "${tier_pres_id}", upfront_paid_cents: 1850000 }
              as: ClubAdmin
              captures: { ms_dana_id: "$.data.id" }
            - call: "POST /parks"
              payload: { name: "Mesa Verde RV Resort", park_class: "CLASS_B", total_sites: 40, member_allocation_pct: 60, season_open_date: "2026-01-05", season_close_date: "2026-12-20" }
              as: ClubAdmin
              captures: { park_b_id: "$.data.id" }
            - call: "POST /parks/${park_b_id}/season-openings"
              payload: {}
              as: ClubAdmin
          trigger:
            - call: "POST /reservations"
              payload: { park_id: "${park_b_id}", membership_id: "${ms_dana_id}", arrival_date: "2026-08-14", scheduled_departure_date: "2026-08-20" }
              as: Member
              as_user_id: "${mbr_dana_id}"
              captures: { res_dana_id: "$.data.id", charged_at_confirmation: "$.data.entitlement_nights_charged" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-14T12:00:00Z" }
              as: ClubAdmin
            - call: "POST /reservations/${res_dana_id}/check-in"
              payload: {}
              as: Member
              as_user_id: "${mbr_dana_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-17T09:00:00Z" }
              as: ClubAdmin
            - call: "POST /reservations/${res_dana_id}/check-out"
              payload: { actual_departure_date: "2026-08-17" }
              as: Member
              as_user_id: "${mbr_dana_id}"
          assert:
            - "at confirmation: Reservation.${res_dana_id}.status == CONFIRMED and Reservation.${res_dana_id}.entitlement_nights_charged == 6"
            - "at confirmation: Membership.${ms_dana_id}.nights_used_class_b == 6 and Membership.${ms_dana_id}.annual_nights_used == 6"
            - "after check-out: Reservation.${res_dana_id}.status == COMPLETED and Reservation.${res_dana_id}.departure_date == \"2026-08-17\""
            - "after check-out: Reservation.${res_dana_id}.entitlement_nights_charged == 3"
            - "after check-out: Membership.${ms_dana_id}.nights_used_class_b == 3 and Membership.${ms_dana_id}.annual_nights_used == 3"
            - "the credited delta is exactly 3 nights: 6 (provisional_at_confirmation) - 3 (final_at_checkout)"
      - name: park_rating_lifetime_decay_vs_trailing_window_mean_divergence
        grounds:
          - calculations.park_rating_score
          - calculations.survey_weighted_score
          - calculations.capital_priority_score
          - entities.Park.fields.rating_score
          - entities.CapitalProject.fields.priority_score
        distinguishing_aspect: |
          This dual variant lives in the park-reputation / capital-scoring domain (Park x
          SatisfactionSurvey x CapitalProject), a different entity domain from the night-ledger
          instance: over the identical two-survey set the recency_weighted_lifetime variant yields
          Park.rating_score == 3.19 while the trailing_window_mean variant yields 2.10, and the
          project scored off the trailing variant is 4912 instead of the 3337 the lifetime variant
          would produce.
        test_recipe:
          setup:
            - "PRESIDENT tier and one ACTIVE PRESIDENT membership created at logical date 2026-02-01"
            - "One OPEN CLASS_B park with 40 sites and 60% member allocation"
            - "Two COMPLETED stays at that park, 2 nights each: 2026-02-08 to 2026-02-10 and 2026-08-08 to 2026-08-10"
            - "A 5.00-weighted survey submitted at 2026-02-10 and a 2.10-weighted survey submitted at 2026-08-10"
            - "Logical clock moved to 2026-08-20 before the capital project is proposed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-01T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /membership-tiers"
              payload: { code: "PRESIDENT", name: "President Class", tier_rank: 3, upfront_cost_cents: 1850000, annual_dues_cents: 58000, entitlement_nights_class_a: 14, entitlement_nights_class_b: 21, entitlement_nights_class_c: 28, annual_total_night_cap: 45, advance_window_days: 120, max_consecutive_stay_nights: 21, min_out_nights_between_stays: 1, affiliate_access_enabled: true, resale_allowed: true, transfer_fee_cents: 95000 }
              as: ClubAdmin
              captures: { tier_pres_id: "$.data.id" }
            - call: "POST /members"
              payload: { full_name: "Ivo Marsh", email: "ivo@example.com", home_region: "Northwest" }
              as: ClubAdmin
              captures: { mbr_ivo_id: "$.data.id" }
            - call: "POST /memberships"
              payload: { member_id: "${mbr_ivo_id}", tier_id: "${tier_pres_id}", upfront_paid_cents: 1850000 }
              as: ClubAdmin
              captures: { ms_ivo_id: "$.data.id" }
            - call: "POST /parks"
              payload: { name: "Cedar Bluff RV Resort", park_class: "CLASS_B", total_sites: 40, member_allocation_pct: 60, season_open_date: "2026-01-05", season_close_date: "2026-12-20" }
              as: ClubAdmin
              captures: { park_cb_id: "$.data.id" }
            - call: "POST /parks/${park_cb_id}/season-openings"
              payload: {}
              as: ClubAdmin
            - call: "POST /reservations"
              payload: { park_id: "${park_cb_id}", membership_id: "${ms_ivo_id}", arrival_date: "2026-02-08", scheduled_departure_date: "2026-02-10" }
              as: Member
              as_user_id: "${mbr_ivo_id}"
              captures: { res_feb_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-08T15:00:00Z" }
              as: ClubAdmin
            - call: "POST /reservations/${res_feb_id}/check-in"
              payload: {}
              as: Member
              as_user_id: "${mbr_ivo_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-10T10:00:00Z" }
              as: ClubAdmin
            - call: "POST /reservations/${res_feb_id}/check-out"
              payload: { actual_departure_date: "2026-02-10" }
              as: Member
              as_user_id: "${mbr_ivo_id}"
            - call: "POST /reservations/${res_feb_id}/satisfaction-surveys"
              payload: { overall_rating: 5, cleanliness_rating: 5, staff_rating: 5, value_rating: 5 }
              as: Member
              as_user_id: "${mbr_ivo_id}"
              captures: { survey_feb_id: "$.data.id", survey_feb_score: "$.data.weighted_score" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /reservations"
              payload: { park_id: "${park_cb_id}", membership_id: "${ms_ivo_id}", arrival_date: "2026-08-08", scheduled_departure_date: "2026-08-10" }
              as: Member
              as_user_id: "${mbr_ivo_id}"
              captures: { res_aug_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-08T15:00:00Z" }
              as: ClubAdmin
            - call: "POST /reservations/${res_aug_id}/check-in"
              payload: {}
              as: Member
              as_user_id: "${mbr_ivo_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T10:00:00Z" }
              as: ClubAdmin
            - call: "POST /reservations/${res_aug_id}/check-out"
              payload: { actual_departure_date: "2026-08-10" }
              as: Member
              as_user_id: "${mbr_ivo_id}"
          trigger:
            - call: "POST /reservations/${res_aug_id}/satisfaction-surveys"
              payload: { overall_rating: 2, cleanliness_rating: 3, staff_rating: 2, value_rating: 1 }
              as: Member
              as_user_id: "${mbr_ivo_id}"
              captures: { survey_aug_id: "$.data.id", survey_aug_score: "$.data.weighted_score" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /capital-projects"
              payload: { park_id: "${park_cb_id}", title: "Replace 30A pedestals loop C", category: "UTILITY", requested_cost_cents: 4500000, fiscal_year: 2026 }
              as: ParkManager
              as_user_id: "${park_cb_id}"
              captures: { proj_cb_id: "$.data.id", proj_cb_score: "$.data.priority_score" }
          assert:
            - "SatisfactionSurvey.${survey_feb_id}.weighted_score == 5.00"
            - "SatisfactionSurvey.${survey_aug_id}.weighted_score == 2.10"
            - "Park.${park_cb_id}.rating_score == 3.19 (recency_weighted_lifetime: (0.6*5.00 + 1.0*2.10) / 1.6)"
            - "CapitalProject.${proj_cb_id}.priority_score == 4912 (trailing_window_mean == 2.10 drops the 181-day-old February survey)"
            - "CapitalProject.${proj_cb_id}.priority_score != 3337, the value the recency_weighted_lifetime rating of 3.19 would have produced"
  - rule_id: combinatorial_formula
    instances:
      - name: transient_stay_charge_rounds_each_night_then_sums
        grounds:
          - calculations.transient_stay_charge
          - entities.Reservation.fields.total_charge_cents
          - 'endpoints["POST /transient-reservations"]'
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order is pinned: a two-night peak-weekend CLASS_B
          stay rounds 9625.5 up to 9626 per night and only then sums to 19252, so the total is
          20985; the sum-then-round reading gives 19251 and a total of 20984.
        test_recipe:
          setup:
            - "Logical clock at the 2026-08-01T00:00:00Z default"
            - "One OPEN CLASS_B park with 40 sites and a 60% member allocation (16 transient-pool sites)"
            - "Requested nights 2026-08-14 (Friday) and 2026-08-15 (Saturday) are both inside the 07-01..09-07 peak window and both weekend nights"
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Dune Crest RV Resort", park_class: "CLASS_B", total_sites: 40, member_allocation_pct: 60, season_open_date: "2026-01-05", season_close_date: "2026-12-20" }
              as: ClubAdmin
              captures: { park_dc_id: "$.data.id" }
            - call: "POST /parks/${park_dc_id}/season-openings"
              payload: {}
              as: ClubAdmin
          trigger:
            - call: "POST /transient-reservations"
              payload: { park_id: "${park_dc_id}", guest_name: "Priya Raman", arrival_date: "2026-08-14", scheduled_departure_date: "2026-08-16" }
              as: TransientGuest
              captures: { res_tg_id: "$.data.id", tg_total: "$.data.total_charge_cents" }
          assert:
            - "Reservation.${res_tg_id}.status == CONFIRMED and Reservation.${res_tg_id}.pool_charged == TRANSIENT_POOL"
            - "Reservation.${res_tg_id}.nights == 2"
            - "Reservation.${res_tg_id}.total_charge_cents == 20985"
            - "Reservation.${res_tg_id}.total_charge_cents != 20984, the value produced by summing the unrounded 9625.5 night rates first"
            - "Reservation.${res_tg_id}.entitlement_nights_charged == 0 (a transient stay debits no entitlement)"
      - name: dues_invoice_loyalty_band_keyed_on_subtotal_not_base_dues
        grounds:
          - calculations.dues_invoice_total
          - entities.DuesInvoice.fields.capital_assessment_cents
          - entities.DuesInvoice.fields.loyalty_credit_cents
          - entities.DuesInvoice.fields.amount_cents
          - entities.Membership.fields.dues_balance_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with a pinned evaluation order: the loyalty band is
          keyed on subtotal_cents (62640, above the 60000 band) which itself contains the capital
          assessment derived from base_dues_cents (58000, below the band), so the invoice is 59508;
          keying the band off base_dues_cents would leave the invoice at 62640.
        test_recipe:
          setup:
            - "Logical clock at the 2026-08-01T00:00:00Z default"
            - "PRESIDENT tier with annual_dues_cents 58000 and CLASSIC tier with annual_dues_cents 42000"
            - "Two members, each about to be sold one membership at tenure_years 0"
          setup_api_calls:
            - call: "POST /membership-tiers"
              payload: { code: "PRESIDENT", name: "President Class", tier_rank: 3, upfront_cost_cents: 1850000, annual_dues_cents: 58000, entitlement_nights_class_a: 14, entitlement_nights_class_b: 21, entitlement_nights_class_c: 28, annual_total_night_cap: 45, advance_window_days: 120, max_consecutive_stay_nights: 21, min_out_nights_between_stays: 1, affiliate_access_enabled: true, resale_allowed: true, transfer_fee_cents: 95000 }
              as: ClubAdmin
              captures: { tier_pres_id: "$.data.id" }
            - call: "POST /membership-tiers"
              payload: { code: "CLASSIC", name: "Classic Class", tier_rank: 1, upfront_cost_cents: 795000, annual_dues_cents: 42000, entitlement_nights_class_a: 0, entitlement_nights_class_b: 10, entitlement_nights_class_c: 18, annual_total_night_cap: 24, advance_window_days: 60, max_consecutive_stay_nights: 14, min_out_nights_between_stays: 3, affiliate_access_enabled: false, resale_allowed: false, transfer_fee_cents: 60000 }
              as: ClubAdmin
              captures: { tier_cls_id: "$.data.id" }
            - call: "POST /members"
              payload: { full_name: "Omar Vance", email: "omar@example.com", home_region: "Gulf" }
              as: ClubAdmin
              captures: { mbr_omar_id: "$.data.id" }
            - call: "POST /members"
              payload: { full_name: "Lena Fox", email: "lena@example.com", home_region: "Plains" }
              as: ClubAdmin
              captures: { mbr_lena_id: "$.data.id" }
          trigger:
            - call: "POST /memberships"
              payload: { member_id: "${mbr_omar_id}", tier_id: "${tier_pres_id}", upfront_paid_cents: 1850000 }
              as: ClubAdmin
              captures: { ms_omar_id: "$.data.id", omar_balance: "$.data.dues_balance_cents" }
            - call: "GET /memberships/${ms_omar_id}/dues-invoices"
              payload: {}
              as: ClubAdmin
              captures: { inv_omar_id: "$.data[0].id", inv_omar_amount: "$.data[0].amount_cents" }
            - call: "POST /memberships"
              payload: { member_id: "${mbr_lena_id}", tier_id: "${tier_cls_id}", upfront_paid_cents: 795000 }
              as: ClubAdmin
              captures: { ms_lena_id: "$.data.id" }
            - call: "GET /memberships/${ms_lena_id}/dues-invoices"
              payload: {}
              as: ClubAdmin
              captures: { inv_lena_id: "$.data[0].id", inv_lena_amount: "$.data[0].amount_cents" }
          assert:
            - "DuesInvoice.${inv_omar_id}.base_dues_cents == 58000"
            - "DuesInvoice.${inv_omar_id}.capital_assessment_cents == 4640"
            - "DuesInvoice.${inv_omar_id}.loyalty_credit_cents == 3132"
            - "DuesInvoice.${inv_omar_id}.amount_cents == 59508 and DuesInvoice.${inv_omar_id}.status == OPEN"
            - "DuesInvoice.${inv_omar_id}.amount_cents != 62640, the value a base_dues-keyed loyalty band would leave"
            - "DuesInvoice.${inv_omar_id}.due_date == \"2026-08-31\""
            - "Membership.${ms_omar_id}.dues_balance_cents == 59508"
            - "DuesInvoice.${inv_lena_id}.capital_assessment_cents == 3360 and DuesInvoice.${inv_lena_id}.loyalty_credit_cents == 0 and DuesInvoice.${inv_lena_id}.amount_cents == 45360"
  - rule_id: non_linear_state_machine
    instances:
      - name: membership_contract_and_dues_axes_advance_independently
        grounds:
          - state_machines.Membership.membership_status.ACTIVE_to_SUSPENDED
          - state_machines.Membership.dues_status.CURRENT_to_GRACE
          - state_machines.Membership.dues_status.GRACE_to_CURRENT
          - state_machines.Membership.membership_status.SUSPENDED_to_ACTIVE
          - calculations.dues_late_fee
        distinguishing_aspect: |
          Membership carries two parallel state dimensions on one row: dues_status moves
          CURRENT -> GRACE while membership_status stays ACTIVE, then membership_status moves
          ACTIVE -> SUSPENDED while dues_status stays GRACE, then dues_status returns to CURRENT
          while membership_status stays SUSPENDED — four transitions, never in lockstep.
        test_recipe:
          setup:
            - "PRESIDENT tier and one ACTIVE, dues-CURRENT membership sold at logical date 2026-08-01"
            - "Its first dues invoice is OPEN for 59508 cents with due_date 2026-08-31 and stays unpaid"
            - "Logical clock advanced to 2026-09-15, i.e. 15 days past due — inside GRACE, short of the 30-day DELINQUENT threshold"
          setup_api_calls:
            - call: "POST /membership-tiers"
              payload: { code: "PRESIDENT", name: "President Class", tier_rank: 3, upfront_cost_cents: 1850000, annual_dues_cents: 58000, entitlement_nights_class_a: 14, entitlement_nights_class_b: 21, entitlement_nights_class_c: 28, annual_total_night_cap: 45, advance_window_days: 120, max_consecutive_stay_nights: 21, min_out_nights_between_stays: 1, affiliate_access_enabled: true, resale_allowed: true, transfer_fee_cents: 95000 }
              as: ClubAdmin
              captures: { tier_pres_id: "$.data.id" }
            - call: "POST /members"
              payload: { full_name: "Ruth Calder", email: "ruth@example.com", home_region: "Northeast" }
              as: ClubAdmin
              captures: { mbr_ruth_id: "$.data.id" }
            - call: "POST /memberships"
              payload: { member_id: "${mbr_ruth_id}", tier_id: "${tier_pres_id}", upfront_paid_cents: 1850000 }
              as: ClubAdmin
              captures: { ms_ruth_id: "$.data.id" }
            - call: "GET /memberships/${ms_ruth_id}/dues-invoices"
              payload: {}
              as: ClubAdmin
              captures: { inv_ruth_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: ClubAdmin
          trigger:
            - call: "POST /ops/dues-delinquency-run"
              payload: {}
              as: ClubAdmin
            - call: "POST /memberships/${ms_ruth_id}/suspension"
              payload: { suspension_reason: "ADMIN_ACTION" }
              as: ClubAdmin
            - call: "POST /dues-invoices/${inv_ruth_id}/payments"
              payload: { amount_cents: 60401 }
              as: Member
              as_user_id: "${mbr_ruth_id}"
            - call: "POST /memberships/${ms_ruth_id}/reinstatement"
              payload: { reinstatement_fee_paid_cents: 15000 }
              as: ClubAdmin
          assert:
            - "after the delinquency run: Membership.${ms_ruth_id}.dues_status == GRACE and Membership.${ms_ruth_id}.membership_status == ACTIVE"
            - "after the delinquency run: DuesInvoice.${inv_ruth_id}.status == PAST_DUE, late_fee_cents == 893, days_past_due == 15"
            - "after the suspension: Membership.${ms_ruth_id}.membership_status == SUSPENDED, suspension_reason == ADMIN_ACTION, dues_status still GRACE"
            - "after the payment: Membership.${ms_ruth_id}.dues_status == CURRENT while membership_status is still SUSPENDED"
            - "after the payment: DuesInvoice.${inv_ruth_id}.status == PAID, paid_amount_cents == 60401, Membership.${ms_ruth_id}.dues_balance_cents == 0"
            - "after the reinstatement: Membership.${ms_ruth_id}.membership_status == ACTIVE, suspension_reason == null, dues_status == CURRENT"
      - name: reservation_checked_in_extension_review_cycle_returns_to_checked_in
        grounds:
          - state_machines.Reservation.CHECKED_IN_to_EXTENSION_REVIEW
          - state_machines.Reservation.EXTENSION_REVIEW_to_CHECKED_IN
          - state_machines.OccupancyException.REQUESTED_to_DENIED
          - calculations.consecutive_occupancy_nights
          - entities.Reservation.fields.extension_denied_count
        distinguishing_aspect: |
          Reservation — a different entity from Membership — carries the cycle
          CHECKED_IN -> EXTENSION_REVIEW -> CHECKED_IN and re-enters the extension path afterwards,
          so one row visits CHECKED_IN three times with extension_denied_count 1 and
          extension_count 1 at the end.
        test_recipe:
          setup:
            - "CLASSIC tier: 18 CLASS_C entitlement nights, 14-night consecutive limit, 60-day advance window"
            - "One ACTIVE, dues-CURRENT CLASSIC membership"
            - "One OPEN CLASS_C park with 20 sites and 60% member allocation (12 member-pool sites)"
            - "A 10-night stay 2026-08-05 to 2026-08-15 already CHECKED_IN at logical date 2026-08-05"
          setup_api_calls:
            - call: "POST /membership-tiers"
              payload: { code: "CLASSIC", name: "Classic Class", tier_rank: 1, upfront_cost_cents: 795000, annual_dues_cents: 42000, entitlement_nights_class_a: 0, entitlement_nights_class_b: 10, entitlement_nights_class_c: 18, annual_total_night_cap: 24, advance_window_days: 60, max_consecutive_stay_nights: 14, min_out_nights_between_stays: 3, affiliate_access_enabled: false, resale_allowed: false, transfer_fee_cents: 60000 }
              as: ClubAdmin
              captures: { tier_cls_id: "$.data.id" }
            - call: "POST /members"
              payload: { full_name: "Gus Alder", email: "gus@example.com", home_region: "Midwest" }
              as: ClubAdmin
              captures: { mbr_gus_id: "$.data.id" }
            - call: "POST /memberships"
              payload: { member_id: "${mbr_gus_id}", tier_id: "${tier_cls_id}", upfront_paid_cents: 795000 }
              as: ClubAdmin
              captures: { ms_gus_id: "$.data.id" }
            - call: "POST /parks"
              payload: { name: "Pinyon Flats RV Park", park_class: "CLASS_C", total_sites: 20, member_allocation_pct: 60, season_open_date: "2026-01-05", season_close_date: "2026-12-20" }
              as: ClubAdmin
              captures: { park_pf_id: "$.data.id" }
            - call: "POST /parks/${park_pf_id}/season-openings"
