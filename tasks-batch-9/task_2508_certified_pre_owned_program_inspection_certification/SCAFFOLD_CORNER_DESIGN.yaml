      - name: reconditioning_reimbursement_excludes_waived_rows
        claim_type: input_set_filtering
        grounds:
          - calculations.reconditioning_reimbursement.input_set
          - entities.ReconditioningItem.fields.status
          - entities.ReconditioningItem.fields.reimbursable_cents
        distinguishing_aspect: |
          Only COMPLETED rows enter the sum. One inspection holds all three statuses at once: a
          COMPLETED row at 1001 cents (601 after round_half_up per item), a WAIVED row whose
          actual_cost_cents stays null, and a still-REQUIRED CRITICAL row. The totals must read
