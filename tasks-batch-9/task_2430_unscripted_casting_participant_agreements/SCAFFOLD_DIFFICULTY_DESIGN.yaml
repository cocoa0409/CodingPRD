              payload: { name: "Stage A", state_code: "CA", capacity: 500, turnaround_buffer_minutes: 60, filming_permit_number: "PRM-1001" }
              as: ProductionAdmin
              captures: { loc_a_id: $.data.id }
            - call: "POST /casting/shoot-blocks"
              payload: { production_id: "${prod_id}", location_id: "${loc_a_id}", block_kind: "STUDIO", start_utc: "2026-10-05T08:00:00Z", end_utc: "2026-10-05T11:30:00Z", participant_agreement_ids: [], expected_crowd_headcount: 0, onset_minor_hours: 0 }
              as: ProductionAdmin
              captures: { blk_base_id: $.data.id }
          trigger:
            - call: "POST /casting/shoot-blocks"
              payload: { production_id: "${prod_id}", location_id: "${loc_a_id}", block_kind: "STUDIO", start_utc: "2026-10-05T12:00:00Z", end_utc: "2026-10-05T14:00:00Z", participant_agreement_ids: [], expected_crowd_headcount: 0, onset_minor_hours: 0 }
              as: ProductionAdmin
              captures: { err_id: $.data.error_id }
            - call: "POST /casting/shoot-blocks"
              payload: { production_id: "${prod_id}", location_id: "${loc_a_id}", block_kind: "STUDIO", start_utc: "2026-10-05T12:30:00Z", end_utc: "2026-10-05T14:00:00Z", participant_agreement_ids: [], expected_crowd_headcount: 0, onset_minor_hours: 0 }
              as: ProductionAdmin
              captures: { blk_ok_id: $.data.id, blk_ok_status: $.data.status }
          assert:
            - "${err_id} == ERR_LOCATION_BLOCK_CONFLICT"
            - "HTTP status of the 12:00Z request == 409"
            - "${blk_ok_status} == SCHEDULED"
            - "ShootBlock.${blk_ok_id}.start_utc == 2026-10-05T12:30:00Z"
            - "GET /casting/shoot-blocks?location_id=${loc_a_id} returns total_count == 2"
            - "ShootBlock.${blk_base_id}.status == SCHEDULED"

      - name: minor_daily_onset_hours_aggregate_over_utc_date_bucket
        grounds:
          - calculations.minor_daily_onset_hours
          - validations[priority=28]
          - errors[ERR_MINOR_DAILY_HOURS_EXCEEDED]
          - entities.MinorProtection.fields.education_hours_scheduled_weekly
          - entities.ShootBlock.fields.onset_minor_hours
        distinguishing_aspect: |
          Different resource entity (the minor Applicant, not a Location) and different
          interval semantics: an AGGREGATE-CAPACITY cap over a UTC calendar-date bucket
          rather than pairwise interval intersection. Three time-disjoint,
          buffer-compliant blocks on 2026-10-06 collide on the cap — 2.5 + 2.5 + 3.0
