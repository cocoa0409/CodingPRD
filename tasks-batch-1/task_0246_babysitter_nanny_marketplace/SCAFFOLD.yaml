# =============================================================================
# Babysitter & Nanny Marketplace (Care.com style) — Scaffold (§1.0–§1.7)
# Difficulty band: EXPERT (§0.4)
# =============================================================================

scenario: |
  246. Babysitter & Nanny Marketplace (Care.com style): caregiver profile/background-check
  tier, booking (one-time/recurring), hourly/family pay rate, interview/trial, backup care,
  household-employer tax (W-2), rating/review, last-minute request

domain_name: babysitter-nanny-marketplace
api_prefix: /marketplace

# Structural DNA of this benchmark. Primary challenge is multi-party negotiation
# (Family <-> Caregiver booking offers, counter-offer rounds, interview/trial gating)
# layered over temporal windowing (recurring session intervals, caregiver
# double-booking and travel-buffer overlap detection). Money moves through a
# Family escrow ledger and a household-employer (W-2) tax ledger that must stay
# conserved across forward actions and their compensations.
complexity_profile:
  primary_archetype: multi-party negotiation
  secondary_archetype: temporal windowing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: flat            # peer entities under a shared /marketplace namespace, linked by FK fields in the body
  state_machine_shape: cyclic      # Booking has a counter-offer loop; others branch/revert
  relationship_patterns:
    - one_to_many                  # Family -> JobPosting -> Booking -> BookingSession
    - cross_aggregate              # Booking references Family, Caregiver, JobPosting across aggregates
  role_model: peer_roles           # Family owns postings/bookings; Caregiver owns profile/availability; PlatformAdmin overrides
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # -------------------------------------------------------------------------
  - name: Family
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: display_name, type: string, source: input, description: "Household display name" }
      - { name: email, type: string, source: input, description: "Contact email, unique across families" }
      - { name: num_children, type: integer, source: input, description: "Children needing care; >= 1", constraints: "1..8" }
      - { name: required_tier, type: enum, source: input, description: "Minimum background-check tier a caregiver must hold to be bookable by this family", default: BASIC, constraints: "BASIC | STANDARD | PREMIUM" }
      - { name: wallet_balance_cents, type: integer, source: input, description: "Total funds the family has deposited; escrow_reserved + escrow_available always equals this", default: 0, constraints: ">= 0" }
      - { name: escrow_reserved_cents, type: integer, source: computed, description: "Funds reserved against CONFIRMED bookings' estimated pay; never negative" }
      - { name: escrow_available_cents, type: integer, source: computed, description: "wallet_balance_cents - escrow_reserved_cents; never negative" }
      - { name: tax_withheld_ytd_cents, type: integer, source: computed, description: "Sum of FICA employee-share withheld across this family's PAID payouts in the current tax year" }
      - { name: cash_wages_ytd_cents, type: integer, source: computed, description: "Sum of gross session pay paid to all of this family's caregivers in the current tax year; gates W-2 obligation" }
      - { name: is_w2_obligated, type: boolean, source: computed, description: "True once cash_wages_ytd_cents > FICA_ANNUAL_WAGE_THRESHOLD_CENTS for any single caregiver in the tax year" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE, constraints: "ACTIVE | SUSPENDED" }

  # -------------------------------------------------------------------------
  - name: Caregiver
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: full_name, type: string, source: input, description: "Caregiver legal name" }
      - { name: email, type: string, source: input, description: "Contact email, unique across caregivers" }
      - { name: hourly_rate_floor_cents, type: integer, source: input, description: "Lowest rate the caregiver will accept; a Booking's agreed rate must be >= this", constraints: ">= 1" }
      - { name: background_check_tier, type: enum, source: computed, description: "Highest tier reached by a CLEARED BackgroundCheck; NONE until first clearance", default: NONE, constraints: "NONE | BASIC | STANDARD | PREMIUM" }
      - { name: verification_status, type: enum, source: computed, description: "Mirrors the latest BackgroundCheck outcome: NONE | PENDING | CLEAR | CONSIDER | FLAGGED" }
      - { name: availability_status, type: enum, source: system, description: "AVAILABLE = open to new sessions and backup matches; BUSY = at session capacity; OFFLINE = manually paused; SUSPENDED = platform-suspended", default: OFFLINE, constraints: "AVAILABLE | BUSY | OFFLINE | SUSPENDED" }
      - { name: pending_earnings_cents, type: integer, source: computed, description: "Net pay accrued from COMPLETED sessions not yet paid out" }
      - { name: lifetime_paid_cents, type: integer, source: computed, description: "Cumulative net pay across PAID payouts" }
      - { name: rating_avg, type: number, source: computed, description: "Mean rating_value over PUBLISHED reviews; 0 when none; 2 decimals" }
      - { name: rating_count, type: integer, source: computed, description: "Count of PUBLISHED reviews" }

  # -------------------------------------------------------------------------
  - name: BackgroundCheck
    parent: Caregiver
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: caregiver_id, type: string, source: input, description: "FK -> Caregiver.id; subject of the check" }
      - { name: requested_tier, type: enum, source: input, description: "Tier being screened for", constraints: "BASIC | STANDARD | PREMIUM" }
      - { name: status, type: enum, source: system, description: "INITIATED | IN_PROGRESS | CLEAR | CONSIDER | FLAGGED | EXPIRED", default: INITIATED }
      - { name: adjudication_note, type: string, source: input, description: "Admin note recorded on CLEAR/CONSIDER/FLAGGED adjudication", default: null }
      - { name: cleared_at, type: datetime, source: system, description: "Timestamp the check reached CLEAR; null otherwise", default: null }

  # -------------------------------------------------------------------------
  - name: JobPosting
    parent: Family
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: family_id, type: string, source: input, description: "FK -> Family.id; the posting owner" }
      - { name: title, type: string, source: input, description: "Posting title" }
      - { name: care_type, type: enum, source: input, description: "ONE_TIME or RECURRING care need", constraints: "ONE_TIME | RECURRING" }
      - { name: family_pay_rate_cents, type: integer, source: input, description: "Family's offered hourly rate (the 'family pay rate'); a Booking inherits this unless overridden", constraints: ">= 1" }
      - { name: required_tier, type: enum, source: input, description: "Minimum caregiver background-check tier for this posting; defaults to family.required_tier", constraints: "BASIC | STANDARD | PREMIUM" }
      - { name: status, type: enum, source: system, description: "OPEN | FILLED | CLOSED", default: OPEN, constraints: "OPEN | FILLED | CLOSED" }

  # -------------------------------------------------------------------------
  - name: Interview
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: job_posting_id, type: string, source: input, description: "FK -> JobPosting.id; the posting being interviewed for" }
      - { name: family_id, type: string, source: input, description: "FK -> Family.id; interviewer" }
      - { name: caregiver_id, type: string, source: input, description: "FK -> Caregiver.id; interviewee" }
      - { name: scheduled_start, type: datetime, source: input, description: "Interview/trial window start (UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Interview/trial window end (UTC); must be > scheduled_start" }
      - { name: kind, type: enum, source: input, description: "PHONE | VIDEO | TRIAL (paid in-home trial shift)", constraints: "PHONE | VIDEO | TRIAL" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | PASSED | FAILED | TRIAL_BOOKED | CANCELLED", default: SCHEDULED }
      - { name: outcome_note, type: string, source: input, description: "Family note recorded on PASSED/FAILED", default: null }

  # -------------------------------------------------------------------------
  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: family_id, type: string, source: input, description: "FK -> Family.id; employer" }
      - { name: caregiver_id, type: string, source: input, description: "FK -> Caregiver.id; the offered caregiver" }
      - { name: job_posting_id, type: string, source: input, description: "FK -> JobPosting.id; posting this booking fills" }
      - { name: care_type, type: enum, source: computed, description: "Inherited from job_posting.care_type: ONE_TIME | RECURRING" }
      - { name: agreed_rate_cents, type: integer, source: input, description: "Hourly rate proposed in the current offer round; must be >= caregiver.hourly_rate_floor_cents", constraints: ">= 1" }
      - { name: scheduled_start, type: datetime, source: input, description: "Start of the (first) session window (UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "End of the (first) session window (UTC); must be > scheduled_start" }
      - { name: recurrence_count, type: integer, source: input, description: "For RECURRING: number of weekly sessions to generate on CONFIRM (>=2); for ONE_TIME must be 1", default: 1, constraints: ">= 1" }
      - { name: is_holiday, type: boolean, source: input, description: "Whether the first session falls on a holiday (2x rate)", default: false }
      - { name: status, type: enum, source: system, description: "OFFERED | COUNTERED | CONFIRMED | IN_PROGRESS | COMPLETED | DECLINED | CANCELLED", default: OFFERED }
      - { name: offer_round, type: integer, source: computed, description: "Increments on each counter-offer; starts at 1" }
      - { name: is_last_minute, type: boolean, source: computed, description: "True if (scheduled_start - confirmation time) < LAST_MINUTE_WINDOW_HOURS at CONFIRM" }
      - { name: estimated_pay_cents, type: integer, source: computed, description: "Forward estimate of first-session gross pay at CONFIRM; drives escrow reservation" }
      - { name: final_pay_cents, type: integer, source: computed, description: "Sum of actual gross pay across all COMPLETED sessions; null until first completion" }

  # -------------------------------------------------------------------------
  - name: BookingSession
    parent: Booking
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; parent booking" }
      - { name: caregiver_id, type: string, source: input, description: "FK -> Caregiver.id; denormalized for caregiver overlap checks" }
      - { name: sequence_index, type: integer, source: system, description: "0-based occurrence index within a recurring booking" }
      - { name: window_start, type: datetime, source: input, description: "Scheduled session window start (UTC)" }
      - { name: window_end, type: datetime, source: input, description: "Scheduled session window end (UTC); must be > window_start" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | COMPLETED | NO_SHOW | CANCELLED", default: SCHEDULED }
      - { name: clock_in_at, type: datetime, source: system, description: "Actual clock-in (UTC); set on IN_PROGRESS", default: null }
      - { name: clock_out_at, type: datetime, source: system, description: "Actual clock-out (UTC); set on COMPLETED", default: null }
      - { name: actual_hours, type: number, source: computed, description: "(clock_out_at - clock_in_at) in hours, 2 decimals; 0 until completed" }
      - { name: gross_pay_cents, type: integer, source: computed, description: "Final gross pay for this session from actual_hours; 0 until completed" }
      - { name: is_holiday, type: boolean, source: input, description: "Whether this session is a holiday session (2x rate)", default: false }

  # -------------------------------------------------------------------------
  - name: BackupCareRequest
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: family_id, type: string, source: input, description: "FK -> Family.id; requesting family" }
      - { name: matched_caregiver_id, type: string, source: input, description: "FK -> Caregiver.id; caregiver matched by the platform selector; null until matched", default: null }
      - { name: needed_start, type: datetime, source: input, description: "Window start of needed backup care (UTC)" }
      - { name: needed_end, type: datetime, source: input, description: "Window end (UTC); must be > needed_start" }
      - { name: required_tier, type: enum, source: input, description: "Minimum caregiver tier acceptable for this backup match", constraints: "BASIC | STANDARD | PREMIUM" }
      - { name: max_rate_cents, type: integer, source: input, description: "Highest hourly rate the family will pay for the match", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "OPEN | MATCHED | FULFILLED | EXPIRED | CANCELLED", default: OPEN }

  # -------------------------------------------------------------------------
  - name: Payout
    parent: Caregiver
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: caregiver_id, type: string, source: input, description: "FK -> Caregiver.id; payee" }
      - { name: family_id, type: string, source: input, description: "FK -> Family.id; household employer whose W-2 ledger absorbs the tax" }
      - { name: session_ids, type: array, source: input, description: "COMPLETED BookingSession ids included in this payout sweep" }
      - { name: gross_pay_cents, type: integer, source: computed, description: "Sum of per-session gross_pay_cents over included sessions" }
      - { name: fica_withheld_cents, type: integer, source: computed, description: "Employee-share FICA withheld, rounded per-session then summed" }
      - { name: platform_fee_cents, type: integer, source: computed, description: "Platform fee on gross_pay_cents" }
      - { name: net_pay_cents, type: integer, source: computed, description: "gross_pay_cents - fica_withheld_cents - platform_fee_cents" }
      - { name: status, type: enum, source: system, description: "PENDING | PAID | REVERSED", default: PENDING }

  # -------------------------------------------------------------------------
  - name: Review
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; the completed booking being reviewed" }
      - { name: family_id, type: string, source: input, description: "FK -> Family.id; author" }
      - { name: caregiver_id, type: string, source: input, description: "FK -> Caregiver.id; subject" }
      - { name: rating_value, type: integer, source: input, description: "Star rating 1..5", constraints: "1..5" }
      - { name: comment, type: string, source: input, description: "Free-text review body", default: null }
      - { name: status, type: enum, source: system, description: "PENDING_MODERATION | PUBLISHED | HIDDEN", default: PENDING_MODERATION }

  # -------------------------------------------------------------------------
  - name: TaxStatement
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: family_id, type: string, source: input, description: "FK -> Family.id; household employer issuing the W-2" }
      - { name: caregiver_id, type: string, source: input, description: "FK -> Caregiver.id; employee on the W-2" }
      - { name: tax_year, type: integer, source: input, description: "Calendar tax year, e.g. 2026" }
      - { name: cash_wages_cents, type: integer, source: computed, description: "Frozen snapshot of gross wages paid family->caregiver in tax_year at issuance" }
      - { name: fica_withheld_cents, type: integer, source: computed, description: "Frozen snapshot of FICA employee-share withheld in tax_year at issuance" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # -------------------------------------------------------------------------
  - entity: BackgroundCheck
    initial_state: INITIATED
    terminal_states: [CLEAR, FLAGGED, EXPIRED]
    transitions:
      - from: INITIATED
        to: IN_PROGRESS
        trigger: "POST /marketplace/background-checks/{id}/start"
        actor: PlatformAdmin
        preconditions: ["check.status == INITIATED"]
        side_effects:
          - "caregiver.verification_status := PENDING"
      - from: IN_PROGRESS
        to: CLEAR
        trigger: "POST /marketplace/background-checks/{id}/adjudicate (decision=CLEAR)"
        actor: PlatformAdmin
        preconditions: ["check.status == IN_PROGRESS"]
        side_effects:
          - "cleared_at := current clock"
          - "caregiver.verification_status := CLEAR"
          - "caregiver.background_check_tier := max(caregiver.background_check_tier, requested_tier) by tier order NONE<BASIC<STANDARD<PREMIUM"
      - from: IN_PROGRESS
        to: CONSIDER
        trigger: "POST /marketplace/background-checks/{id}/adjudicate (decision=CONSIDER)"
        actor: PlatformAdmin
        preconditions: ["check.status == IN_PROGRESS"]
        side_effects:
          - "caregiver.verification_status := CONSIDER"
        note: "Non-terminal: admin may re-run the check (CONSIDER -> IN_PROGRESS) after dispute."
      - from: CONSIDER
        to: IN_PROGRESS
        trigger: "POST /marketplace/background-checks/{id}/start"
        actor: PlatformAdmin
        preconditions: ["check.status == CONSIDER"]
        side_effects:
          - "caregiver.verification_status := PENDING"
        note: "Revert/re-run loop — branching+revert shape."
      - from: IN_PROGRESS
        to: FLAGGED
        trigger: "POST /marketplace/background-checks/{id}/adjudicate (decision=FLAGGED)"
        actor: PlatformAdmin
        preconditions: ["check.status == IN_PROGRESS"]
        side_effects:
          - "caregiver.verification_status := FLAGGED"
          - "caregiver.availability_status := SUSPENDED (cascade)"
          - "every Booking of this caregiver in {OFFERED, COUNTERED, CONFIRMED} -> CANCELLED (cascade), each releasing family escrow"
      - from: CONSIDER
        to: FLAGGED
        trigger: "POST /marketplace/background-checks/{id}/adjudicate (decision=FLAGGED)"
        actor: PlatformAdmin
        preconditions: ["check.status == CONSIDER"]
        side_effects:
          - "caregiver.verification_status := FLAGGED"
          - "caregiver.availability_status := SUSPENDED (cascade)"
          - "every Booking of this caregiver in {OFFERED, COUNTERED, CONFIRMED} -> CANCELLED (cascade), each releasing family escrow"

  # -------------------------------------------------------------------------
  - entity: Booking
    initial_state: OFFERED
    terminal_states: [COMPLETED, DECLINED, CANCELLED]
    transitions:
      - from: OFFERED
        to: COUNTERED
        trigger: "POST /marketplace/bookings/{id}/counter"
        actor: Caregiver
        preconditions:
          - "booking.status == OFFERED"
          - "expected_booking_version matches booking.version (OCC)"
          - "new agreed_rate_cents >= caregiver.hourly_rate_floor_cents"
        side_effects:
          - "agreed_rate_cents := counter rate"
          - "offer_round += 1"
          - "increments Booking.version by 1"
        note: "Negotiation loop — cyclic shape."
      - from: COUNTERED
        to: OFFERED
        trigger: "POST /marketplace/bookings/{id}/counter"
        actor: Family
        preconditions:
          - "booking.status == COUNTERED"
          - "expected_booking_version matches booking.version (OCC)"
          - "new agreed_rate_cents >= caregiver.hourly_rate_floor_cents"
        side_effects:
          - "agreed_rate_cents := counter rate"
          - "offer_round += 1"
          - "increments Booking.version by 1"
        note: "Family answers the counter — closes the A->B->A cycle."
      - from: OFFERED
        to: CONFIRMED
        trigger: "POST /marketplace/bookings/{id}/confirm"
        actor: Caregiver
        preconditions:
          - "booking.status == OFFERED"
          - "caregiver.verification_status == CLEAR"
          - "caregiver.background_check_tier >= family.required_tier (tier order)"
          - "caregiver.availability_status != SUSPENDED"
          - "family.escrow_available_cents >= estimated_pay_cents"
        side_effects:
          - "is_last_minute := (scheduled_start - now) < LAST_MINUTE_WINDOW_HOURS"
          - "estimated_pay_cents := compute_estimated_session_pay(...)"
          - "family.escrow_reserved_cents += estimated_pay_cents; family.escrow_available_cents recomputed (ledger sync)"
          - "for RECURRING: generate recurrence_count BookingSession rows at weekly cadence (cascade); for ONE_TIME: generate 1"
          - "job_posting.status := FILLED"
      - from: COUNTERED
        to: CONFIRMED
        trigger: "POST /marketplace/bookings/{id}/confirm"
        actor: Caregiver
        preconditions:
          - "booking.status == COUNTERED"
          - "caregiver.verification_status == CLEAR"
          - "caregiver.background_check_tier >= family.required_tier (tier order)"
          - "caregiver.availability_status != SUSPENDED"
          - "family.escrow_available_cents >= estimated_pay_cents"
        side_effects:
          - "same as OFFERED->CONFIRMED"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /marketplace/bookings/{id}/decline"
        actor: Caregiver
        preconditions: ["booking.status IN {OFFERED, COUNTERED}"]
        side_effects: []
      - from: CONFIRMED
        to: IN_PROGRESS
        trigger: "system: first BookingSession clock-in"
        actor: system
        preconditions: ["booking.status == CONFIRMED", "a child session moved SCHEDULED->IN_PROGRESS"]
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "system: all BookingSessions terminal (COMPLETED/NO_SHOW/CANCELLED) with >=1 COMPLETED"
        actor: system
        preconditions: ["booking.status == IN_PROGRESS", "every child session terminal"]
        side_effects:
          - "final_pay_cents := sum of COMPLETED sessions' gross_pay_cents"
          - "settle escrow: release (estimated_pay_cents - first-session reserved consumed) drift back to family.escrow_available (compensation)"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /marketplace/bookings/{id}/cancel"
        actor: Family
        preconditions:
          - "booking.status == CONFIRMED"
          - "no child BookingSession is IN_PROGRESS or COMPLETED"
        side_effects:
          - "family.escrow_reserved_cents -= estimated_pay_cents; family.escrow_available_cents recomputed (compensation, exact)"
          - "every SCHEDULED child BookingSession -> CANCELLED (cascade down)"
          - "job_posting.status := OPEN"

  # -------------------------------------------------------------------------
  - entity: BookingSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /marketplace/sessions/{id}/clock-in"
        actor: Caregiver
        preconditions:
          - "session.status == SCHEDULED"
          - "booking.status IN {CONFIRMED, IN_PROGRESS}"
          - "no caregiver overlap (half-open [window_start, window_end) with TRAVEL_BUFFER_MINUTES gap against caregiver's other non-terminal sessions)"
        side_effects:
          - "clock_in_at := current clock"
          - "if booking.status == CONFIRMED then booking -> IN_PROGRESS (bubble up)"
          - "caregiver.availability_status := BUSY"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /marketplace/sessions/{id}/clock-out"
        actor: Caregiver
        preconditions: ["session.status == IN_PROGRESS"]
        side_effects:
          - "clock_out_at := current clock"
          - "actual_hours := (clock_out_at - clock_in_at) hours, 2dp"
          - "gross_pay_cents := compute_final_session_pay(actual_hours, ...)"
          - "caregiver.pending_earnings_cents += net of this session (cross-entity)"
          - "family.cash_wages_ytd_cents += gross_pay_cents; recompute family.is_w2_obligated (ledger sync)"
          - "caregiver.availability_status := AVAILABLE"
          - "if all sibling sessions terminal then booking -> COMPLETED (bubble up)"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /marketplace/sessions/{id}/no-show"
        actor: Family
        preconditions: ["session.status == SCHEDULED", "current clock >= window_end"]
        side_effects:
          - "if all sibling sessions terminal then booking -> COMPLETED (bubble up)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: parent Booking cancellation cascade"
        actor: system
        preconditions: ["session.status == SCHEDULED"]
        side_effects: []

  # -------------------------------------------------------------------------
  - entity: BackupCareRequest
    initial_state: OPEN
    terminal_states: [FULFILLED, EXPIRED, CANCELLED]
    transitions:
      - from: OPEN
        to: MATCHED
        trigger: "POST /marketplace/backup-requests/{id}/match"
        actor: PlatformAdmin
        preconditions:
          - "request.status == OPEN"
          - "expected_backuprequest_version matches request.version (OCC)"
          - "selector finds >=1 eligible caregiver"
        side_effects:
          - "matched_caregiver_id := selected caregiver (selector policy, see §1.3)"
          - "increments BackupCareRequest.version by 1"
      - from: MATCHED
        to: FULFILLED
        trigger: "POST /marketplace/backup-requests/{id}/fulfill"
        actor: Family
        preconditions: ["request.status == MATCHED"]
        side_effects: []
      - from: OPEN
        to: EXPIRED
        trigger: "POST /marketplace/backup-requests/{id}/expire"
        actor: PlatformAdmin
        preconditions: ["request.status == OPEN", "current clock >= needed_start"]
        side_effects: []
      - from: OPEN
        to: CANCELLED
        trigger: "POST /marketplace/backup-requests/{id}/cancel"
        actor: Family
        preconditions: ["request.status IN {OPEN, MATCHED}"]
        side_effects: []
      - from: MATCHED
        to: CANCELLED
        trigger: "POST /marketplace/backup-requests/{id}/cancel"
        actor: Family
        preconditions: ["request.status IN {OPEN, MATCHED}"]
        side_effects: []

  # -------------------------------------------------------------------------
  - entity: Interview
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /marketplace/interviews/{id}/decide (outcome=PASSED)"
        actor: Family
        preconditions: ["interview.status == SCHEDULED"]
        side_effects: []
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /marketplace/interviews/{id}/decide (outcome=FAILED)"
        actor: Family
        preconditions: ["interview.status == SCHEDULED"]
        side_effects: []
      - from: SCHEDULED
        to: TRIAL_BOOKED
        trigger: "POST /marketplace/interviews/{id}/decide (outcome=TRIAL_BOOKED)"
        actor: Family
        preconditions: ["interview.status == SCHEDULED", "interview.kind == TRIAL"]
        side_effects: []
        note: "Branching fork-join: SCHEDULED forks to PASSED/FAILED/TRIAL_BOOKED with divergent side-effect sets."
      - from: TRIAL_BOOKED
        to: PASSED
        trigger: "POST /marketplace/interviews/{id}/decide (outcome=PASSED)"
        actor: Family
        preconditions: ["interview.status == TRIAL_BOOKED"]
        side_effects: []
      - from: TRIAL_BOOKED
        to: FAILED
        trigger: "POST /marketplace/interviews/{id}/decide (outcome=FAILED)"
        actor: Family
        preconditions: ["interview.status == TRIAL_BOOKED"]
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /marketplace/interviews/{id}/cancel"
        actor: Family
        preconditions: ["interview.status IN {SCHEDULED, TRIAL_BOOKED}"]
        side_effects: []

  # -------------------------------------------------------------------------
  - entity: Review
    initial_state: PENDING_MODERATION
    terminal_states: [PUBLISHED, HIDDEN]
    transitions:
      - from: PENDING_MODERATION
        to: PUBLISHED
        trigger: "POST /marketplace/reviews/{id}/moderate (decision=PUBLISH)"
        actor: PlatformAdmin
        preconditions: ["review.status == PENDING_MODERATION"]
        side_effects:
          - "recompute caregiver.rating_avg and caregiver.rating_count over PUBLISHED reviews (derived-field reconciliation)"
      - from: PENDING_MODERATION
        to: HIDDEN
        trigger: "POST /marketplace/reviews/{id}/moderate (decision=HIDE)"
        actor: PlatformAdmin
        preconditions: ["review.status == PENDING_MODERATION"]
        side_effects: []
      - from: PUBLISHED
        to: HIDDEN
        trigger: "POST /marketplace/reviews/{id}/moderate (decision=HIDE)"
        actor: PlatformAdmin
        preconditions: ["review.status == PUBLISHED"]
        side_effects:
          - "recompute caregiver.rating_avg and caregiver.rating_count over PUBLISHED reviews (derived-field reconciliation)"

  # -------------------------------------------------------------------------
  - entity: Payout
    initial_state: PENDING
    terminal_states: [PAID, REVERSED]
    transitions:
      - from: PENDING
        to: PAID
        trigger: "POST /marketplace/payouts/{id}/pay"
        actor: PlatformAdmin
        preconditions: ["payout.status == PENDING"]
        side_effects:
          - "caregiver.pending_earnings_cents -= net_pay_cents; caregiver.lifetime_paid_cents += net_pay_cents (cross-entity)"
          - "family.tax_withheld_ytd_cents += fica_withheld_cents (ledger sync)"
      - from: PAID
        to: REVERSED
        trigger: "POST /marketplace/payouts/{id}/reverse"
        actor: PlatformAdmin
        preconditions: ["payout.status == PAID"]
        side_effects:
          - "caregiver.lifetime_paid_cents -= net_pay_cents (compensation)"
          - "family.tax_withheld_ytd_cents -= fica_withheld_cents (compensation, exact reversal)"
          - "family.cash_wages_ytd_cents -= gross_pay_cents; recompute family.is_w2_obligated (compensation)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version — see §1.2.1 filter)
# =============================================================================
concurrency_rules:
  - rule_id: backup-match-stale-request
    parent_entity: BackupCareRequest
    write_endpoint: "POST /marketplace/backup-requests/{id}/match"
    occ_field: "expected_backuprequest_version"
    description: |
      Matching a caregiver to a BackupCareRequest whose version has advanced
      since the client last observed it is rejected. A backup request may be
      matched at most once; the new match legitimately supersedes the prior
      OPEN state, so a writer carrying a stale version is rejected on the
      version check rather than silently overwriting an existing match.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: booking-counter-stale-offer
    parent_entity: Booking
    write_endpoint: "POST /marketplace/bookings/{id}/counter"
    occ_field: "expected_booking_version"
    description: |
      Posting a counter-offer against a Booking whose version has advanced
      since the client last read it is rejected. Each counter legitimately
      supersedes the prior agreed_rate, so a counter built on a stale view of
      the negotiation is rejected on the version check, not by overwriting the
      latest round.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: compute_estimated_session_pay
    trigger: "Booking OFFERED|COUNTERED -> CONFIRMED"
    algorithm: forward_looking
    formula: |
      # Forward estimate from SCHEDULED first-session window (no actual clock data yet).
      scheduled_hours = (scheduled_end - scheduled_start) in hours, 2dp
      child_mult = 1 + MULTI_CHILD_SURCHARGE_PCT_PER_EXTRA * (family.num_children - 1)
      eff_rate = agreed_rate_cents * child_mult
      if is_holiday:
          base = scheduled_hours * eff_rate * HOLIDAY_MULTIPLIER          # holiday: all hours 2x, OT does NOT stack
      else:
          reg_hours = min(scheduled_hours, OT_DAILY_THRESHOLD_HOURS)
          ot_hours  = max(0, scheduled_hours - OT_DAILY_THRESHOLD_HOURS)
          base = reg_hours * eff_rate + ot_hours * eff_rate * OT_MULTIPLIER
      gross = base
      if is_last_minute:
          gross = gross * (1 + LAST_MINUTE_SURCHARGE_PCT)
      estimated_pay_cents = round_half_up(gross)   # to whole cents
    input_set: "First-session scheduled window only; later recurring sessions are NOT pre-reserved."
    constants:
      OT_DAILY_THRESHOLD_HOURS: 8.0
      OT_MULTIPLIER: 1.5
      HOLIDAY_MULTIPLIER: 2.0
      MULTI_CHILD_SURCHARGE_PCT_PER_EXTRA: 0.10
      LAST_MINUTE_WINDOW_HOURS: 24
      LAST_MINUTE_SURCHARGE_PCT: 0.15
    precision: "whole cents, round_half_up"
    variants:
      - name: estimated_at_confirm
        when: "Booking confirmation, before any clock-in"
        difference: "Uses SCHEDULED hours and the is_last_minute flag computed at confirm time; drives escrow reservation."

  - name: compute_final_session_pay
    trigger: "BookingSession IN_PROGRESS -> COMPLETED (clock-out)"
    algorithm: chronological
    formula: |
      # Final pay from ACTUAL clocked hours — the dual-variant counterpart to the estimate.
      actual_hours = round_half_up((clock_out_at - clock_in_at) hours, 2)
      child_mult = 1 + MULTI_CHILD_SURCHARGE_PCT_PER_EXTRA * (family.num_children - 1)
      eff_rate = booking.agreed_rate_cents * child_mult
      if session.is_holiday:
          base = actual_hours * eff_rate * HOLIDAY_MULTIPLIER
      else:
          reg_hours = min(actual_hours, OT_DAILY_THRESHOLD_HOURS)
          ot_hours  = max(0, actual_hours - OT_DAILY_THRESHOLD_HOURS)
          base = reg_hours * eff_rate + ot_hours * eff_rate * OT_MULTIPLIER
      gross = base
      if booking.is_last_minute:
          gross = gross * (1 + LAST_MINUTE_SURCHARGE_PCT)
      gross_pay_cents = round_half_up(gross)
    input_set: "Per individual COMPLETED session; OT is per-session daily (each session is one day)."
    constants:
      OT_DAILY_THRESHOLD_HOURS: 8.0
      OT_MULTIPLIER: 1.5
      HOLIDAY_MULTIPLIER: 2.0
      MULTI_CHILD_SURCHARGE_PCT_PER_EXTRA: 0.10
      LAST_MINUTE_SURCHARGE_PCT: 0.15
    variants:
      - name: final_from_actuals
        when: "Session clock-out"
        difference: "Uses ACTUAL clocked hours instead of scheduled; can diverge from estimate when caregiver works longer/shorter or crosses the OT boundary."

  - name: compute_payout_withholding
    trigger: "POST /marketplace/payouts (creation) sweeping COMPLETED sessions"
    algorithm: aggregation
    formula: |
      # PINNED rounding order: round FICA per-session, THEN sum. (Sum-then-round is the wrong variant.)
      gross_pay_cents     = sum(s.gross_pay_cents for s in included_sessions)            # exact integer cents
      fica_withheld_cents = sum( round_half_up(s.gross_pay_cents * FICA_EMPLOYEE_RATE) for s in included_sessions )
      platform_fee_cents  = round_half_up(gross_pay_cents * PLATFORM_FEE_PCT)
      net_pay_cents       = gross_pay_cents - fica_withheld_cents - platform_fee_cents
    input_set: "Only BookingSession rows with status==COMPLETED and not already in a non-REVERSED payout; ordered by window_start ASC, then created_at ASC."
    constants:
      FICA_EMPLOYEE_RATE: 0.0765
      PLATFORM_FEE_PCT: 0.10
    precision: "whole cents, round_half_up; round-per-session-then-sum is the binding order"
    variants:
      - name: per_session_then_sum
        when: "Always"
        difference: "round(gross_i * rate) summed over sessions differs from round(sum(gross_i) * rate) by the accumulated rounding remainder — the scaffold pins per-session-then-sum."

  - name: compute_w2_obligation
    trigger: "Recompute on family.cash_wages_ytd change (session completion / payout reversal)"
    algorithm: threshold
    formula: |
      # Household-employer (W-2) test, per caregiver, per tax year.
      per_caregiver_wages = sum(gross_pay_cents of COMPLETED sessions paid family->caregiver in tax_year)
      is_w2_obligated = any( per_caregiver_wages > FICA_ANNUAL_WAGE_THRESHOLD_CENTS for caregiver )
    input_set: "Wages grouped by (family, caregiver, tax_year); COMPLETED sessions only; reversed payouts decrement the group."
    constants:
      FICA_ANNUAL_WAGE_THRESHOLD_CENTS: 270000
    precision: "exact integer compare; strictly greater-than (>) crosses the threshold"
    variants:
      - name: strict_threshold
        when: "Always"
        difference: "Exactly 270000 does NOT obligate (>, not >=); 270001 does."

  - name: select_backup_caregiver
    trigger: "POST /marketplace/backup-requests/{id}/match"
    algorithm: weighted_scoring
    formula: |
      # Selector policy: eligibility filter -> ranking -> tie-break -> empty fallback.
      eligible = caregivers where:
          availability_status == AVAILABLE
        AND verification_status == CLEAR
        AND tier_order(background_check_tier) >= tier_order(request.required_tier)
        AND hourly_rate_floor_cents <= request.max_rate_cents
        AND no overlap with request window [needed_start, needed_end) incl. TRAVEL_BUFFER_MINUTES against caregiver's non-terminal sessions
      rank key (descending priority):
          1. rating_avg DESC
          2. hourly_rate_floor_cents ASC      (cheaper preferred)
          3. created_at ASC                   (deterministic tie-break; NEVER id)
      matched_caregiver_id = first(eligible sorted by rank key)
      if eligible is empty: reject with ERR_NO_ELIGIBLE_CAREGIVER (no match made)
    input_set: "All Caregiver rows; filtered by the eligibility predicate above."
    constants:
      TRAVEL_BUFFER_MINUTES: 30
    precision: "rating_avg compared at 2dp; ties broken by created_at ASC"
    variants:
      - name: rating_first_then_rate
        when: "Always"
        difference: "Ranking prioritizes rating over price; only equal ratings fall through to the cheaper-rate then created_at tie-break."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is permitted for this endpoint per §1.7; entity_backed role's X-User-ID owns the targeted resource where ownership applies"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path/body referenced resources exist (validated left-to-right in path, then FK body fields)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "Target resource is in a state permitting the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-changing endpoints"

  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version equals the parent's current version on guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /marketplace/bookings/{id}/counter, POST /marketplace/backup-requests/{id}/match"

  - priority: 6
    category: business_safety
    check: "On confirm: caregiver.verification_status == CLEAR and background_check_tier >= family.required_tier (tier order); on backup match: matched caregiver tier >= request.required_tier"
    error_id: ERR_TIER_INSUFFICIENT
    http_status: 422
    applies_to: "POST /marketplace/bookings/{id}/confirm, POST /marketplace/backup-requests/{id}/match"

  - priority: 7
    category: business_safety
    check: "Caregiver is not SUSPENDED when confirming a booking or being matched for backup care"
    error_id: ERR_CAREGIVER_SUSPENDED
    http_status: 422
    applies_to: "POST /marketplace/bookings/{id}/confirm, POST /marketplace/backup-requests/{id}/match"

  - priority: 8
    category: business_referential
    check: "Booking's caregiver_id and family_id are consistent with job_posting (posting.family_id == booking.family_id); posting is OPEN at offer"
    error_id: ERR_POSTING_MISMATCH
    http_status: 422
    applies_to: "POST /marketplace/bookings"

  - priority: 9
    category: business_constraint
    check: "agreed_rate_cents (offer/counter) >= caregiver.hourly_rate_floor_cents"
    error_id: ERR_RATE_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /marketplace/bookings, POST /marketplace/bookings/{id}/counter"

  - priority: 10
    category: business_constraint
    check: "recurrence_count == 1 for ONE_TIME postings; recurrence_count >= 2 for RECURRING"
    error_id: ERR_RECURRENCE_INVALID
    http_status: 422
    applies_to: "POST /marketplace/bookings"

  - priority: 11
    category: business_temporal
    check: "Caregiver session interval [window_start, window_end) does not overlap (within TRAVEL_BUFFER_MINUTES) another non-terminal session of the same caregiver"
    error_id: ERR_CAREGIVER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /marketplace/sessions/{id}/clock-in"

  - priority: 12
    category: business_temporal
    check: "Family may not have two CONFIRMED/IN_PROGRESS bookings whose first-session windows [start,end) overlap (closed adjacency, no buffer)"
    error_id: ERR_FAMILY_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /marketplace/bookings/{id}/confirm"

  - priority: 13
    category: business_temporal
    check: "Interval ordering: scheduled_end/window_end/needed_end strictly after the matching start"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /marketplace/bookings, POST /marketplace/interviews, POST /marketplace/backup-requests, POST /marketplace/sessions/{id}/clock-out"

  - priority: 14
    category: business_referential
    check: "Review may only be created when its Booking.status == COMPLETED and authoring family owns the booking"
    error_id: ERR_BOOKING_NOT_COMPLETED
    http_status: 422
    applies_to: "POST /marketplace/reviews"

  - priority: 15
    category: business_fiscal
    check: "family.escrow_available_cents >= estimated_pay_cents at confirm"
    error_id: ERR_INSUFFICIENT_ESCROW
    http_status: 422
    applies_to: "POST /marketplace/bookings/{id}/confirm"

  - priority: 16
    category: business_constraint
    check: "Payout session_ids are all COMPLETED, all for the same caregiver+family, and none already in a non-REVERSED payout"
    error_id: ERR_PAYOUT_SESSION_INVALID
    http_status: 422
    applies_to: "POST /marketplace/payouts"

  - priority: 17
    category: business_constraint
    check: "Required body fields present and well-typed; enums within domain; numeric ranges respected"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- test-driving clock ----
  - method: POST
    path: "/marketplace/_clock/set"
    description: "Set the deterministic system clock (test-driving)"
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ now: datetime }"
    side_effects: ["system clock := to_iso8601"]

  # ---- Family ----
  - method: POST
    path: "/marketplace/families"
    description: "Register a family (household employer)"
    roles: [PlatformAdmin, Family]
    code: 201
    input: [display_name, email, num_children, "required_tier?", "wallet_balance_cents?"]
    output: Family
    side_effects: ["status=ACTIVE", "escrow_reserved_cents=0", "escrow_available_cents=wallet_balance_cents"]
  - method: GET
    path: "/marketplace/families/{id}"
    description: "Get a family"
    roles: [PlatformAdmin, Family, Caregiver]
    code: 200
    input: []
    output: Family
    side_effects: []
  - method: GET
    path: "/marketplace/families"
    description: "List families"
    roles: [PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Family[]
    side_effects: []
  - method: POST
    path: "/marketplace/families/{id}/deposit"
    description: "Add funds to a family's wallet"
    roles: [PlatformAdmin, Family]
    code: 200
    input: [amount_cents]
    output: Family
    side_effects: ["wallet_balance_cents += amount_cents", "escrow_available_cents recomputed"]

  # ---- Caregiver ----
  - method: POST
    path: "/marketplace/caregivers"
    description: "Register a caregiver"
    roles: [PlatformAdmin, Caregiver]
    code: 201
    input: [full_name, email, hourly_rate_floor_cents]
    output: Caregiver
    side_effects: ["background_check_tier=NONE", "verification_status=NONE", "availability_status=OFFLINE"]
  - method: GET
    path: "/marketplace/caregivers/{id}"
    description: "Get a caregiver"
    roles: [PlatformAdmin, Family, Caregiver]
    code: 200
    input: []
    output: Caregiver
    side_effects: []
  - method: GET
    path: "/marketplace/caregivers"
    description: "List caregivers"
    roles: [PlatformAdmin, Family]
    code: 200
    input: ["limit?", "offset?", "availability_status?", "background_check_tier?"]
    output: Caregiver[]
    side_effects: []
  - method: POST
    path: "/marketplace/caregivers/{id}/availability"
    description: "Caregiver sets availability_status (cannot leave SUSPENDED)"
    roles: [PlatformAdmin, Caregiver]
    code: 200
    input: [availability_status]
    output: Caregiver
    side_effects: ["availability_status := value if current != SUSPENDED"]

  # ---- BackgroundCheck ----
  - method: POST
    path: "/marketplace/background-checks"
    description: "Initiate a background check for a caregiver at a tier"
    roles: [PlatformAdmin]
    code: 201
    input: [caregiver_id, requested_tier]
    output: BackgroundCheck
    side_effects: ["status=INITIATED"]
  - method: GET
    path: "/marketplace/background-checks/{id}"
    description: "Get a background check"
    roles: [PlatformAdmin, Caregiver]
    code: 200
    input: []
    output: BackgroundCheck
    side_effects: []
  - method: GET
    path: "/marketplace/background-checks"
    description: "List background checks (filter by caregiver)"
    roles: [PlatformAdmin, Caregiver]
    code: 200
    input: ["caregiver_id?", "status?", "limit?", "offset?"]
    output: BackgroundCheck[]
    side_effects: []
  - method: POST
    path: "/marketplace/background-checks/{id}/start"
    description: "Advance check to IN_PROGRESS (from INITIATED or CONSIDER re-run)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: BackgroundCheck
    side_effects: ["status=IN_PROGRESS", "caregiver.verification_status=PENDING"]
  - method: POST
    path: "/marketplace/background-checks/{id}/adjudicate"
    description: "Record adjudication outcome (CLEAR/CONSIDER/FLAGGED) with cascades"
    roles: [PlatformAdmin]
    code: 200
    input: [decision, "adjudication_note?"]
    output: BackgroundCheck
    side_effects: ["state transition per §1.2; FLAGGED cascades caregiver suspension + booking cancellations"]

  # ---- JobPosting ----
  - method: POST
    path: "/marketplace/job-postings"
    description: "Create a job posting"
    roles: [PlatformAdmin, Family]
    code: 201
    input: [family_id, title, care_type, family_pay_rate_cents, "required_tier?"]
    output: JobPosting
    side_effects: ["status=OPEN", "required_tier defaults to family.required_tier"]
  - method: GET
    path: "/marketplace/job-postings/{id}"
    description: "Get a job posting"
    roles: [PlatformAdmin, Family, Caregiver]
    code: 200
    input: []
    output: JobPosting
    side_effects: []
  - method: GET
    path: "/marketplace/job-postings"
    description: "List job postings (filter by family)"
    roles: [PlatformAdmin, Family, Caregiver]
    code: 200
    input: ["family_id?", "status?", "care_type?", "limit?", "offset?"]
    output: JobPosting[]
    side_effects: []

  # ---- Interview ----
  - method: POST
    path: "/marketplace/interviews"
    description: "Schedule an interview/trial"
    roles: [PlatformAdmin, Family]
    code: 201
    input: [job_posting_id, family_id, caregiver_id, scheduled_start, scheduled_end, kind]
    output: Interview
    side_effects: ["status=SCHEDULED"]
  - method: GET
    path: "/marketplace/interviews/{id}"
    description: "Get an interview"
    roles: [PlatformAdmin, Family, Caregiver]
    code: 200
    input: []
    output: Interview
    side_effects: []
  - method: GET
    path: "/marketplace/interviews"
    description: "List interviews (filter by family/caregiver/posting)"
    roles: [PlatformAdmin, Family, Caregiver]
    code: 200
    input: ["family_id?", "caregiver_id?", "job_posting_id?", "status?", "limit?", "offset?"]
    output: Interview[]
    side_effects: []
  - method: POST
    path: "/marketplace/interviews/{id}/decide"
    description: "Record interview outcome (PASSED/FAILED/TRIAL_BOOKED)"
    roles: [PlatformAdmin, Family]
    code: 200
    input: [outcome, "outcome_note?"]
    output: Interview
    side_effects: ["state transition per §1.2"]
  - method: POST
    path: "/marketplace/interviews/{id}/cancel"
    description: "Cancel an interview"
    roles: [PlatformAdmin, Family]
    code: 200
    input: []
    output: Interview
    side_effects: ["status=CANCELLED"]

  # ---- Booking ----
  - method: POST
    path: "/marketplace/bookings"
    description: "Family extends a booking offer to a caregiver for a posting"
    roles: [PlatformAdmin, Family]
    code: 201
    input: [family_id, caregiver_id, job_posting_id, agreed_rate_cents, scheduled_start, scheduled_end, "recurrence_count?", "is_holiday?"]
    output: Booking
    side_effects: ["status=OFFERED", "offer_round=1", "care_type inherited from posting"]
  - method: GET
    path: "/marketplace/bookings/{id}"
    description: "Get a booking"
    roles: [PlatformAdmin, Family, Caregiver]
    code: 200
    input: []
    output: Booking
    side_effects: []
  - method: GET
    path: "/marketplace/bookings"
    description: "List bookings (filter by family/caregiver/posting)"
    roles: [PlatformAdmin, Family, Caregiver]
    code: 200
    input: ["family_id?", "caregiver_id?", "job_posting_id?", "status?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []
  - method: POST
    path: "/marketplace/bookings/{id}/counter"
    description: "Counter-offer a new rate (OCC-guarded negotiation round)"
    roles: [PlatformAdmin, Family, Caregiver]
    code: 200
    input: [agreed_rate_cents, expected_booking_version]
    output: Booking
    side_effects: ["status toggles OFFERED<->COUNTERED", "agreed_rate_cents updated", "offer_round += 1", "increments Booking.version by 1"]
  - method: POST
    path: "/marketplace/bookings/{id}/confirm"
    description: "Caregiver accepts the current offer; reserves escrow and generates sessions"
    roles: [PlatformAdmin, Caregiver]
    code: 200
    input: []
    output: Booking
    side_effects: ["status=CONFIRMED", "estimated_pay_cents computed", "escrow reserved", "sessions generated", "posting FILLED"]
  - method: POST
    path: "/marketplace/bookings/{id}/decline"
    description: "Caregiver declines the offer"
    roles: [PlatformAdmin, Caregiver]
    code: 200
    input: []
    output: Booking
    side_effects: ["status=DECLINED"]
  - method: POST
    path: "/marketplace/bookings/{id}/cancel"
    description: "Family cancels a CONFIRMED booking (no session started)"
    roles: [PlatformAdmin, Family]
    code: 200
    input: []
    output: Booking
    side_effects: ["status=CANCELLED", "escrow released exactly", "SCHEDULED sessions cancelled", "posting OPEN"]

  # ---- BookingSession ----
  - method: GET
    path: "/marketplace/sessions/{id}"
    description: "Get a booking session"
    roles: [PlatformAdmin, Family, Caregiver]
    code: 200
    input: []
    output: BookingSession
    side_effects: []
  - method: GET
    path: "/marketplace/sessions"
    description: "List sessions (filter by booking/caregiver)"
    roles: [PlatformAdmin, Family, Caregiver]
    code: 200
    input: ["booking_id?", "caregiver_id?", "status?", "limit?", "offset?"]
    output: BookingSession[]
    side_effects: []
  - method: POST
    path: "/marketplace/sessions/{id}/clock-in"
    description: "Caregiver clocks in (overlap-checked)"
    roles: [PlatformAdmin, Caregiver]
    code: 200
    input: []
    output: BookingSession
    side_effects: ["status=IN_PROGRESS", "clock_in_at set", "booking -> IN_PROGRESS", "caregiver BUSY"]
  - method: POST
    path: "/marketplace/sessions/{id}/clock-out"
    description: "Caregiver clocks out; computes final pay"
    roles: [PlatformAdmin, Caregiver]
    code: 200
    input: []
    output: BookingSession
    side_effects: ["status=COMPLETED", "gross_pay_cents computed", "caregiver earnings + family wages ledgers updated", "booking COMPLETED bubble-up"]
  - method: POST
    path: "/marketplace/sessions/{id}/no-show"
    description: "Family marks a session a no-show"
    roles: [PlatformAdmin, Family]
    code: 200
    input: []
    output: BookingSession
    side_effects: ["status=NO_SHOW", "booking COMPLETED bubble-up if all siblings terminal"]

  # ---- BackupCareRequest ----
  - method: POST
    path: "/marketplace/backup-requests"
    description: "Family opens a last-minute backup care request"
    roles: [PlatformAdmin, Family]
    code: 201
    input: [family_id, needed_start, needed_end, required_tier, max_rate_cents]
    output: BackupCareRequest
    side_effects: ["status=OPEN"]
  - method: GET
    path: "/marketplace/backup-requests/{id}"
    description: "Get a backup care request"
    roles: [PlatformAdmin, Family, Caregiver]
    code: 200
    input: []
    output: BackupCareRequest
    side_effects: []
  - method: GET
    path: "/marketplace/backup-requests"
    description: "List backup care requests (filter by family/matched caregiver)"
    roles: [PlatformAdmin, Family, Caregiver]
    code: 200
    input: ["family_id?", "matched_caregiver_id?", "status?", "limit?", "offset?"]
    output: BackupCareRequest[]
    side_effects: []
  - method: POST
    path: "/marketplace/backup-requests/{id}/match"
    description: "Platform runs the selector to match a caregiver (OCC-guarded)"
    roles: [PlatformAdmin]
    code: 200
    input: [expected_backuprequest_version]
    output: BackupCareRequest
    side_effects: ["status=MATCHED", "matched_caregiver_id set by selector", "increments BackupCareRequest.version by 1"]
  - method: POST
    path: "/marketplace/backup-requests/{id}/fulfill"
    description: "Family confirms the matched backup caregiver served"
    roles: [PlatformAdmin, Family]
    code: 200
    input: []
    output: BackupCareRequest
    side_effects: ["status=FULFILLED"]
  - method: POST
    path: "/marketplace/backup-requests/{id}/expire"
    description: "Platform expires an unmatched request past its needed_start"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: BackupCareRequest
    side_effects: ["status=EXPIRED"]
  - method: POST
    path: "/marketplace/backup-requests/{id}/cancel"
    description: "Family cancels a backup request"
    roles: [PlatformAdmin, Family]
    code: 200
    input: []
    output: BackupCareRequest
    side_effects: ["status=CANCELLED"]

  # ---- Payout ----
  - method: POST
    path: "/marketplace/payouts"
    description: "Sweep COMPLETED sessions into a payout (FICA + fee computed)"
    roles: [PlatformAdmin]
    code: 201
    input: [caregiver_id, family_id, session_ids]
    output: Payout
    side_effects: ["status=PENDING", "gross/fica/fee/net computed per §1.3"]
  - method: GET
    path: "/marketplace/payouts/{id}"
    description: "Get a payout"
    roles: [PlatformAdmin, Caregiver]
    code: 200
    input: []
    output: Payout
    side_effects: []
  - method: GET
    path: "/marketplace/payouts"
    description: "List payouts (filter by caregiver/family)"
    roles: [PlatformAdmin, Caregiver]
    code: 200
    input: ["caregiver_id?", "family_id?", "status?", "limit?", "offset?"]
    output: Payout[]
    side_effects: []
  - method: POST
    path: "/marketplace/payouts/{id}/pay"
    description: "Mark a payout PAID; posts to caregiver and family tax ledgers"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Payout
    side_effects: ["status=PAID", "caregiver lifetime_paid += net", "family tax_withheld_ytd += fica"]
  - method: POST
    path: "/marketplace/payouts/{id}/reverse"
    description: "Reverse a PAID payout; exact compensation of all ledgers"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Payout
    side_effects: ["status=REVERSED", "ledgers reversed exactly (tax + wages + lifetime)"]

  # ---- Review ----
  - method: POST
    path: "/marketplace/reviews"
    description: "Family submits a review for a COMPLETED booking"
    roles: [PlatformAdmin, Family]
    code: 201
    input: [booking_id, family_id, caregiver_id, rating_value, "comment?"]
    output: Review
    side_effects: ["status=PENDING_MODERATION"]
  - method: GET
    path: "/marketplace/reviews/{id}"
    description: "Get a review"
    roles: [PlatformAdmin, Family, Caregiver]
    code: 200
    input: []
    output: Review
    side_effects: []
  - method: GET
    path: "/marketplace/reviews"
    description: "List reviews (filter by booking/family/caregiver)"
    roles: [PlatformAdmin, Family, Caregiver]
    code: 200
    input: ["booking_id?", "family_id?", "caregiver_id?", "status?", "limit?", "offset?"]
    output: Review[]
    side_effects: []
  - method: POST
    path: "/marketplace/reviews/{id}/moderate"
    description: "Platform publishes or hides a review; recomputes caregiver rating aggregates"
    roles: [PlatformAdmin]
    code: 200
    input: [decision]
    output: Review
    side_effects: ["state transition per §1.2", "caregiver.rating_avg/rating_count recomputed on PUBLISH/HIDE"]

  # ---- TaxStatement (W-2) ----
  - method: POST
    path: "/marketplace/tax-statements"
    description: "Issue a W-2 tax statement snapshot for a (family, caregiver, year)"
    roles: [PlatformAdmin]
    code: 201
    input: [family_id, caregiver_id, tax_year]
    output: TaxStatement
    side_effects: ["cash_wages_cents and fica_withheld_cents frozen from current ledgers"]
  - method: GET
    path: "/marketplace/tax-statements/{id}"
    description: "Get a tax statement"
    roles: [PlatformAdmin, Family, Caregiver]
    code: 200
    input: []
    output: TaxStatement
    side_effects: []
  - method: GET
    path: "/marketplace/tax-statements"
    description: "List tax statements (filter by family/caregiver)"
    roles: [PlatformAdmin, Family, Caregiver]
    code: 200
    input: ["family_id?", "caregiver_id?", "tax_year?", "limit?", "offset?"]
    output: TaxStatement[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for endpoint, or entity_backed user does not own the targeted resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist or is out of scope" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing/ill-typed body field, out-of-domain enum, or out-of-range number" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state permitting the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_TIER_INSUFFICIENT, http: 422, condition: "Caregiver background-check tier below the required tier for confirm/match" }
  - { id: ERR_CAREGIVER_SUSPENDED, http: 422, condition: "Caregiver is SUSPENDED and cannot be confirmed or matched" }
  - { id: ERR_POSTING_MISMATCH, http: 422, condition: "Booking's family/posting are inconsistent, or posting is not OPEN" }
  - { id: ERR_RATE_BELOW_FLOOR, http: 422, condition: "agreed_rate_cents below caregiver.hourly_rate_floor_cents" }
  - { id: ERR_RECURRENCE_INVALID, http: 422, condition: "recurrence_count inconsistent with posting care_type (ONE_TIME=1, RECURRING>=2)" }
  - { id: ERR_CAREGIVER_DOUBLE_BOOKED, http: 409, condition: "Session window overlaps another non-terminal session of the same caregiver within the travel buffer" }
  - { id: ERR_FAMILY_WINDOW_CONFLICT, http: 409, condition: "Family already has a confirmed/in-progress booking whose first-session window overlaps this one" }
  - { id: ERR_INVALID_INTERVAL, http: 422, condition: "end timestamp is not strictly after start timestamp" }
  - { id: ERR_BOOKING_NOT_COMPLETED, http: 422, condition: "Review created against a booking that is not COMPLETED" }
  - { id: ERR_INSUFFICIENT_ESCROW, http: 422, condition: "family.escrow_available_cents below estimated_pay_cents at confirm" }
  - { id: ERR_PAYOUT_SESSION_INVALID, http: 422, condition: "Payout session_ids not all COMPLETED, not same caregiver+family, or already paid" }
  - { id: ERR_NO_ELIGIBLE_CAREGIVER, http: 422, condition: "Backup-care selector found no eligible caregiver for the request" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator. Runs background-check adjudication, backup-care matching, payout settlement, review moderation, tax-statement issuance, and the test clock. May act on any resource (override)."
    identity: "opaque"
    exclusive_operations:
      - "POST /marketplace/_clock/set — set system clock"
      - "POST /marketplace/background-checks — initiate check"
      - "POST /marketplace/background-checks/{id}/start — advance check"
      - "POST /marketplace/background-checks/{id}/adjudicate — adjudicate check"
      - "POST /marketplace/backup-requests/{id}/match — run selector match"
      - "POST /marketplace/backup-requests/{id}/expire — expire request"
      - "POST /marketplace/payouts — create payout"
      - "POST /marketplace/payouts/{id}/pay — settle payout"
      - "POST /marketplace/payouts/{id}/reverse — reverse payout"
      - "POST /marketplace/reviews/{id}/moderate — moderate review"
      - "POST /marketplace/tax-statements — issue W-2 statement"
      - "GET /marketplace/families — list all families"
    shared_operations:
      - "All Family- and Caregiver-shared reads and writes (admin override)"

  - name: Family
    description: "A household employer. Owns its job postings, bookings, interviews, backup requests, reviews; deposits funds; cancels bookings; decides interviews."
    identity: "entity_backed:Family"
    exclusive_operations:
      - "POST /marketplace/job-postings — create own posting"
      - "POST /marketplace/families/{id}/deposit — fund own wallet"
      - "POST /marketplace/interviews — schedule interview"
      - "POST /marketplace/interviews/{id}/decide — decide own interview"
      - "POST /marketplace/interviews/{id}/cancel — cancel own interview"
      - "POST /marketplace/bookings — offer a booking"
      - "POST /marketplace/bookings/{id}/cancel — cancel own confirmed booking"
      - "POST /marketplace/backup-requests — open backup request"
      - "POST /marketplace/backup-requests/{id}/fulfill — confirm fulfillment"
      - "POST /marketplace/backup-requests/{id}/cancel — cancel own request"
      - "POST /marketplace/sessions/{id}/no-show — mark no-show"
      - "POST /marketplace/reviews — submit review"
    shared_operations:
      - "POST /marketplace/families — register (self)"
      - "POST /marketplace/bookings/{id}/counter — family counter round"
      - "GET reads on own families/caregivers/postings/bookings/sessions/interviews/backup-requests/reviews/tax-statements"

  - name: Caregiver
    description: "A babysitter/nanny. Owns its profile and availability, accepts/declines/counters offers, clocks sessions in/out, views own payouts and checks."
    identity: "entity_backed:Caregiver"
    exclusive_operations:
      - "POST /marketplace/caregivers/{id}/availability — set own availability"
      - "POST /marketplace/bookings/{id}/confirm — accept an offer"
      - "POST /marketplace/bookings/{id}/decline — decline an offer"
      - "POST /marketplace/sessions/{id}/clock-in — clock in"
      - "POST /marketplace/sessions/{id}/clock-out — clock out"
    shared_operations:
      - "POST /marketplace/caregivers — register (self)"
      - "POST /marketplace/bookings/{id}/counter — caregiver counter round"
      - "GET reads on own caregiver/background-checks/bookings/sessions/payouts/interviews/reviews/tax-statements"
