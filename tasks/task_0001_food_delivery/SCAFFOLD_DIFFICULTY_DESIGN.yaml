scaffold_difficulty_design:

  # ============================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ============================================================
  - rule_id: dual_variant_calc
    instances:
      - name: delivery_fee_provisional_vs_merged_final
        grounds:
          - calculations.provisional_delivery_fee
          - calculations.final_delivery_fee
          - state_machines.Assignment.OFFERED_to_ACCEPTED
          - state_machines.Assignment.PICKED_UP_to_DELIVERED
          - entities.Order.fields.provisional_delivery_fee_cents
          - entities.Order.fields.final_delivery_fee_cents
          - entities.Assignment.fields.route_group_id
        distinguishing_aspect: |
          This variant lives on the Order/Assignment entity domain (delivery-fee cost accounting): identical
          placement inputs (distance_km=2.0, is_peak=false, subtotal=ignored) produce provisional_delivery_fee_cents=540
          but final_delivery_fee_cents=405 once a 2-assignment RouteGroup applies the 25% merge discount. The
          two variants diverge purely because of route-merge context at delivery time.
        test_recipe:
          setup:
            - "Create Restaurant R1 (ACTIVE), Customer C1 whose lat/lng puts Order distance_km == 2.0 km from R1"
            - "Create two Riders Ra, Rb; go-online Ra and Rb"
            - "Create two MenuItems each at 1000 cents; customer places Order O1 and Order O2 with same restaurant"
            - "Both orders placed OUTSIDE peak window (use /api/_clock/advance so placement falls at 09:00 UTC)"
          trigger:
            - "Dispatch offers both orders; Ra accepts O1 then O2 in quick succession so that Assignment A2 is merged into A1's RouteGroup (route_group_id set on both A1 and A2)"
            - "Restaurant marks both orders ready; Ra pickup A1 and A2; Ra deliver A1 and A2"
          assert:
            - "After placement: O1.provisional_delivery_fee_cents == 540 AND O1.provisional_commission_cents uses tiered rate snapshot"
            - "After delivery: O1.final_delivery_fee_cents == 405 (solo=540 minus floor(540*0.25)=135)"
            - "O1.provisional_delivery_fee_cents != O1.final_delivery_fee_cents (540 != 405) — identical inputs, different algorithm output"
            - "A1.final_delivery_fee_cents == 405"

      - name: commission_tiered_vs_flat_override
        grounds:
          - calculations.provisional_commission
          - calculations.final_commission
          - state_machines.Order.PICKED_UP_to_DELIVERED
          - entities.Restaurant.fields.commission_rate_override
          - entities.Order.fields.provisional_commission_cents
          - entities.Order.fields.final_commission_cents
        distinguishing_aspect: |
          This variant lives on the Restaurant entity domain (platform-commission accounting), structurally distinct
          from the Order/Assignment delivery-fee domain in the sibling instance. Given Order.subtotal_cents=30000 and
          placement while Restaurant.commission_rate_override is null, provisional_commission_cents=4800 (marginal tiers
          20000*0.15+10000*0.18). If a PlatformAdmin PATCHes commission_rate_override to 0.12 after placement but before
          delivery, final_commission_cents=3600 (flat 30000*0.12). Same Order inputs, different algorithm branch.
        test_recipe:
          setup:
            - "Create Restaurant R1 (ACTIVE, commission_rate_override=null); Customer C1; Menu items summing to 30000 cents"
            - "Place Order O1 with subtotal 30000 cents"
            - "Restaurant accepts; start-preparing spawns Assignment dispatch; Rider accepts"
          trigger:
            - "PlatformAdmin PATCH /api/restaurants/{R1} body {commission_rate_override: 0.12} BEFORE Order reaches DELIVERED"
            - "Restaurant marks ready; Rider picks up; Rider delivers"
          assert:
            - "O1.provisional_commission_cents == 4800 (computed at placement with null override via tiered formula)"
            - "O1.final_commission_cents == 3600 (computed at delivery with override=0.12 via flat formula)"
            - "O1.provisional_commission_cents != O1.final_commission_cents (4800 != 3600)"
            - "Restaurant.pending_settlement_cents increased by (30000 - 3600) == 26400 at delivery (uses final, not provisional)"

  # ============================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ============================================================
  - rule_id: combinatorial_formula
    instances:
      - name: merged_delivery_fee_discount_floor_per_leg
        grounds:
          - calculations.final_delivery_fee
          - entities.Assignment.fields.route_group_id
          - entities.Assignment.fields.final_delivery_fee_cents
          - entities.RouteGroup.fields.assignment_ids
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. Scaffold pins: compute each assignment's solo_fee in
          integer cents, then FLOOR the 25% discount PER ASSIGNMENT (merged_discount = floor(solo_fee * 0.25)),
          then subtract. Alternative order (pool total solo_fees across all legs, floor once, then re-split)
          produces different per-assignment final_delivery_fee_cents and thus different Rider wallet credits per
          leg. For legs solo_fee=541 and solo_fee=543, per-leg floor yields discounts 135 + 135 = 270; pooled
          floor(1084*0.25) = floor(271.0) = 271 and re-split would produce 541-135=406, 543-136=407 or a
          different split, diverging by 1 cent. Scaffold nails "floor-per-leg" as the canonical order.
        test_recipe:
          setup:
            - "Create Restaurant R1 (ACTIVE), Customer C1 placed such that Order O1 has distance_km=2.0 (solo_fee=540) and Order O2 has distance_km=2.01 (solo_fee=300+ceil(2.01)*120+0 = 300+360 = 660) — different distances exercise the per-leg rounding independently"
            - "Create Rider Ra online; both orders placed off-peak"
            - "Dispatch both; Ra accepts both and both attach to same RouteGroup (route_group_id set on both Assignment rows)"
          trigger:
            - "Restaurant marks both ready; Ra pickup A1 and A2; Ra deliver A1 and A2"
          assert:
            - "O1.final_delivery_fee_cents == 540 - floor(540*0.25) == 540 - 135 == 405 (per-leg floor, NOT a pooled/split floor)"
            - "O2.final_delivery_fee_cents == 660 - floor(660*0.25) == 660 - 165 == 495"
            - "Rider total credited == 405 + 495 == 900; a pooled rounding order (floor on combined 1200*0.25 = 300, then split) would credit 1200-300=900 in aggregate but produce a different per-assignment distribution — the scaffold's per-leg order is observable via the individual Assignment.final_delivery_fee_cents values."

      - name: late_fine_conditional_formula_with_three_inputs
        grounds:
          - calculations.late_delivery_fine
          - state_machines.Order.PICKED_UP_to_DELIVERED
          - entities.Order.fields.minutes_late
          - entities.Order.fields.final_delivery_fee_cents
          - entities.Fine.fields.amount_cents
        distinguishing_aspect: |
          Mode (a) — formula with 3 inputs (minutes_late, final_delivery_fee_cents, peak/solo context via final fee
          itself being an upstream conditional) and non-linear interaction via three conditional branches at
          m<=10, m<=30, m>30. Each branch uses a different arithmetic structure (flat, linear, capped+bonus),
          so the combined formula is non-linear. Falls in mode (a), STRUCTURALLY DISTINCT from the
          tiered_commission sibling (which falls in mode (b), nested-rounding order).
        test_recipe:
          setup:
            - "Create Restaurant R1 (ACTIVE), Customer C1, Rider Ra online; Menu items totaling 5000 cents; place order with distance_km == 2.0 (off-peak, so solo fee = 540)"
            - "Restaurant accepts, start-preparing, Rider accepts, Restaurant ready, Rider picks up at promised_delivery_time"
          trigger:
            - "Advance clock by 20 minutes beyond promised_delivery_time via POST /api/_clock/advance {seconds: 1200}"
            - "Rider POST /api/assignments/{A1}/deliver"
          assert:
            - "O1.minutes_late == 20"
            - "O1.final_delivery_fee_cents == 540 (solo)"
            - "A Fine row created with subject_type=RIDER, reason=LATE_DELIVERY, amount_cents == 1000 (tier2: 500 + 50*(20-10) = 1000)"
            - "Rider.wallet_balance_cents is net: +540 (delivery fee) -1000 (fine) = -460"

  # ============================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ============================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: return_revision_cycle_on_return_entity
        grounds:
          - state_machines.Return
          - state_machines.Return.REQUESTED_to_ESCALATED
          - state_machines.Return.ESCALATED_to_REQUESTED
          - state_machines.Return.REQUESTED_to_REJECTED
          - state_machines.Return.REQUESTED_to_APPROVED
        distinguishing_aspect: |
          Non-linear on Return entity: a cycle REQUESTED→ESCALATED→REQUESTED exists (reopen). Branching also present
          (REQUESTED→{APPROVED, REJECTED, ESCALATED}). Structurally distinct from any linear A→B→C→D pipeline.
        test_recipe:
          setup:
            - "Fast-path a DELIVERED order and open a Return in REQUESTED state"
          trigger:
            - "POST /api/returns/{R1}/escalate (REQUESTED -> ESCALATED; WorkOrder created)"
            - "POST /api/returns/{R1}/reopen (ESCALATED -> REQUESTED; WorkOrder closed)"
            - "POST /api/returns/{R1}/escalate AGAIN (REQUESTED -> ESCALATED; new WorkOrder)"
            - "POST /api/returns/{R1}/approve with approved_refund_cents == 500 (ESCALATED -> APPROVED)"
          assert:
            - "Return visited ESCALATED, REQUESTED, ESCALATED, APPROVED in that order (cycle exercised)"
            - "Exactly 2 WorkOrders exist related_return_id == R1, with the first now CLOSED and the second terminal by test end"
            - "Order status ends at REFUNDED"

      - name: order_parallel_fulfillment_and_payment_dimensions
        grounds:
          - state_machines.Order
          - entities.Order.fields.status
          - entities.Order.fields.payment_status
          - state_machines.Order.PICKED_UP_to_DELIVERED
          - state_machines.Order.REFUND_REQUESTED_to_REFUNDED
        distinguishing_aspect: |
          Non-linear on Order entity (DIFFERENT entity from Return): parallel state dimensions — Order.status
          (fulfillment: PLACED→RESTAURANT_ACCEPTED→PREPARING→READY_FOR_PICKUP→PICKED_UP→DELIVERED→REFUND_REQUESTED→REFUNDED)
          evolves semi-independently of Order.payment_status (UNPAID→AUTHORIZED→CAPTURED→PARTIALLY_REFUNDED).
          At DELIVERED, fulfillment is terminal for the main pipeline but payment can still transition;
          at REFUNDED, fulfillment branches backward. Two axes, one entity.
        test_recipe:
          setup:
            - "Place Order O1 (status=PLACED, payment_status=UNPAID -> AUTHORIZED on placement)"
          trigger:
            - "Run full flow to DELIVERED (status DELIVERED, payment_status -> CAPTURED)"
            - "Customer opens Return (status -> REFUND_REQUESTED, payment_status still CAPTURED)"
            - "CS approves with approved_refund_cents=300, subtotal=1000 (payment_status -> PARTIALLY_REFUNDED; status -> REFUNDED)"
          assert:
            - "After AUTHORIZED-only step: O1.status == PLACED AND O1.payment_status == AUTHORIZED (independent)"
            - "After DELIVERED: O1.status == DELIVERED AND O1.payment_status == CAPTURED"
            - "After return approved: O1.status == REFUNDED AND O1.payment_status == PARTIALLY_REFUNDED (two dimensions landed in different terminal classes)"

  # ============================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ============================================================
  - rule_id: transitive_cascade
    instances:
      - name: deliver_order_cascade_to_rider_tier_via_fine
        grounds:
          - state_machines.Order.PICKED_UP_to_DELIVERED
          - state_machines.Assignment.PICKED_UP_to_DELIVERED
          - calculations.late_delivery_fine
          - calculations.rider_bonus_tier
          - entities.Fine.fields.settlement_status
          - entities.Rider.fields.wallet_balance_cents
          - entities.Rider.fields.bonus_tier
        distinguishing_aspect: |
          Depth-3 chain originating from Rider's DELIVER trigger: POST /api/assignments/{id}/deliver → Order.status
          PICKED_UP→DELIVERED (link 1) → the Order.status transition itself creates a Fine row with
          subject=RIDER (link 2, caused by link 1, not by the original POST) → Fine creation itself debits
          Rider.wallet_balance_cents and recomputes Rider.bonus_tier (link 3, caused by link 2). Each link is
          caused by the prior, not by the original action. Spelled out in Order.DELIVERED side_effects.
        test_recipe:
          setup:
            - "Create Rider Ra with on_time_rate=0.95, acceptance_rate=0.95, rating=5.0 (currently PLATINUM via rider_bonus_tier)"
            - "Create an order, run through to PICKED_UP state with Ra as rider, off-peak 2.0km so final_delivery_fee_cents=540"
            - "Advance clock by 35 minutes beyond promised_delivery_time (makes minutes_late=35 → tier3 fine)"
          trigger:
            - "POST /api/assignments/{A1}/deliver (the single originating trigger)"
          assert:
            - "Link 1 effect: Order.status transitioned PICKED_UP -> DELIVERED (direct side effect of the deliver endpoint)"
            - "Link 2 effect: A new Fine row exists with subject_type=RIDER, reason=LATE_DELIVERY, amount_cents == min(540, 1500) + 500 == 1040 (tier3: cap + compensation); Fine creation is caused by the Order.status transition's side_effect, not directly by the API endpoint"
            - "Link 3 effect: Rider.wallet_balance_cents == +540 - 1040 == -500; Rider.bonus_tier recomputed (still PLATINUM initially but next delivery with another late event could drop it; for this test assert bonus_tier has been RECOMPUTED as evidenced by updated_at freshness — all three mutations nested: deliver -> order DELIVERED -> fine -> rider wallet/tier)"

      - name: return_approve_cascade_to_work_order_closure
        grounds:
          - state_machines.Return.REQUESTED_to_APPROVED
          - state_machines.Order.REFUND_REQUESTED_to_REFUNDED
          - entities.Customer.fields.credit_balance_cents
          - entities.Restaurant.fields.pending_settlement_cents
          - state_machines.Return.REQUESTED_to_ESCALATED
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT originating trigger (POST /api/returns/{id}/approve, not /deliver).
          Link 1: Return.status REQUESTED→APPROVED directly by endpoint. Link 2: that Return transition
          cascades Order.REFUND_REQUESTED→REFUNDED (caused by Return being APPROVED, not directly by the API
          endpoint). Link 3: Order.REFUND_REQUESTED→REFUNDED transition itself mutates Customer.credit_balance_cents
          and Restaurant.pending_settlement_cents (caused by the Order transition, not by the approve endpoint).
          Different trigger than the deliver cascade; different propagation pattern.
        test_recipe:
          setup:
            - "Run an order to DELIVERED at subtotal 1000 cents; open a Return with requested_refund_cents=400"
          trigger:
            - "POST /api/returns/{R1}/approve body {approved_refund_cents: 400}"
          assert:
            - "Link 1: Return.status == APPROVED"
            - "Link 2: Order.status == REFUNDED; Order.payment_status == PARTIALLY_REFUNDED (caused by link 1, not by the approve endpoint)"
            - "Link 3: Customer.credit_balance_cents increased by exactly 400; Restaurant.pending_settlement_cents decreased by exactly 400 (caused by link 2's Order transition side_effects)"

  # ============================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ============================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_referential_on_return_approve
        grounds:
          - validations[priority=6]
          - validations[priority=16]
          - state_machines.WorkOrder
        distinguishing_aspect: |
          Error-category pair: `state` (priority 6: ERR_INVALID_STATE) vs `business_referential` (priority 16:
          ERR_RELATED_RETURN_UNRESOLVED). Both can fail simultaneously on POST /api/work-orders/{id}/resolve when
          the WorkOrder itself is CLOSED (wrong state) AND the related Return is still REQUESTED (unresolved).
          Priority rule dictates ERR_INVALID_STATE wins (priority 6 < priority 16). A dual-failure test asserts
          the correct winner.
        test_recipe:
          setup:
            - "Create a Return in REQUESTED; create a WorkOrder related_return_id=R1, run it to CLOSED (assign, resolve — fail? wait, resolve requires return terminal). Alternative: create WorkOrder, have it reach RESOLVED then CLOSED via a path where related_return_id was null, then PATCH an unresolved return link — but fields immutable. Instead use a different dual-failure: WorkOrder in RESOLVED state (past the endpoint's allowed state) with related_return_id pointing to a REQUESTED (non-terminal) return."
            - "Concrete setup: Open WorkOrder W1 with related_return_id=R1 (R1 in REQUESTED). Path R1 to APPROVED terminal (via /approve). Path W1 through assign -> resolve (now RESOLVED). Now re-create a NEW return R2 on a different order, update nothing. We need the SAME W1 to have both wrong state AND unresolved link — since related_return_id is input-only, create W2 linked to R2 (still REQUESTED); run W2 through assign -> resolve (which would fail because R2 non-terminal). That proves ERR_RELATED_RETURN_UNRESOLVED triggers. To force dual-failure: after W2 is in UNDER_REVIEW, escalate to ESCALATED then resolve again (ESCALATED can resolve per machine). Instead, simpler: W2 is CLOSED (via path W2 requires R2 terminal — so approve R2 first, close W2), then NEW return R3 with related_return_id on a different WO W3... this gets tangled. Use this: W3 with related_return_id=R3, WO in state OPEN, R3 in REQUESTED; call /resolve which needs UNDER_REVIEW state — dual-failure: state check (OPEN != UNDER_REVIEW) AND referential (R3 non-terminal)."
            - "Concrete: Create Return R3 (REQUESTED). Create WorkOrder W3 with related_return_id=R3, status=OPEN."
          trigger:
            - "POST /api/work-orders/{W3}/resolve body {resolution_notes: 'x'}"
          assert:
            - "Response HTTP 409 with error_id == ERR_INVALID_STATE (priority 6 wins over priority 16 despite both conditions holding)"

      - name: business_temporal_vs_business_constraint_on_return_open
        grounds:
          - validations[priority=10]
          - validations[priority=11]
        distinguishing_aspect: |
          Error-category pair: `business_temporal` (priority 10: ERR_RETURN_WINDOW_EXPIRED) vs
          `business_constraint` (priority 11: ERR_DUPLICATE_RETURN). DIFFERENT category pair from the sibling
          instance (which used state vs business_referential). Both can fail on POST /api/orders/{id}/returns
          when the 24h window has passed AND a prior Return exists on the same order.
        test_recipe:
          setup:
            - "Run Order O1 to DELIVERED"
            - "Customer opens Return R1 successfully (REQUESTED) — consumes the duplicate slot"
            - "Advance clock by 25 hours via POST /api/_clock/advance (now past 24h window)"
          trigger:
            - "Customer POST /api/orders/{O1}/returns with second return attempt"
          assert:
            - "Response HTTP 422 with error_id == ERR_RETURN_WINDOW_EXPIRED (priority 10 wins over priority 11 despite both conditions holding)"

  # ============================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ============================================================
  - rule_id: boundary_precision_check
    instances:
      - name: rider_bonus_tier_platinum_boundary_exact_0_90
        grounds:
          - calculations.rider_bonus_tier
          - entities.Rider.fields.bonus_tier
          - entities.Rider.fields.on_time_rate
          - entities.Rider.fields.acceptance_rate
          - entities.Rider.fields.rating
        distinguishing_aspect: |
          Numeric threshold metric: rider_bonus_tier score crossing the PLATINUM 0.90 boundary. Boundary is
          INCLUSIVE (>=). Distinct metric from the zero-set sibling, reached via POST /api/assignments/{id}/deliver.
        test_recipe:
          setup:
            - "Create Rider Ra with exact values: on_time_rate=0.90, acceptance_rate=0.90, rating=4.5 (so score = 0.6*0.90 + 0.3*0.90 + 0.1*(4.5/5.0) = 0.54+0.27+0.09 = 0.900)"
            - "Trigger a delivery to force bonus_tier recompute (place/accept/prepare/ready/pickup/deliver on-time)"
          trigger:
            - "POST /api/assignments/{A1}/deliver"
          assert:
            - "Rider.bonus_tier == PLATINUM (0.900 >= 0.90 is inclusive)"
            - "Create peer Rider Rb with on_time_rate=0.90, acceptance_rate=0.89, rating=4.5 -> score 0.540+0.267+0.09 == 0.897, recompute -> Rb.bonus_tier == GOLD (strictly below 0.90)"

      - name: order_items_empty_set_rejection_on_place_order
        grounds:
          - validations[priority=14]
          - entities.Order.fields.items
        distinguishing_aspect: |
          Empty-set/zero-count boundary on a DIFFERENT metric (array length, not a numeric threshold). DIFFERENT
          endpoint from the tier sibling: POST /api/orders. Empty items array MUST be rejected — zero-length is
          the exact boundary distinct from the minimum-quantity>=1 check.
        test_recipe:
          setup:
            - "Create Restaurant R1 (ACTIVE), Customer C1"
          trigger:
            - "POST /api/orders body {customer_id: C1, restaurant_id: R1, items: []}  (empty array)"
          assert:
            - "HTTP 422 with error_id == ERR_ORDER_INVALID"
            - "Contrast: identical body with items=[{menu_item_id, quantity:1, unit_price_cents: 500, name: 'x'}] succeeds with HTTP 201 — empty-vs-non-empty is the exact boundary"

  # ============================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ============================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_ready_requires_assignment_accepted
        grounds:
          - state_machines.Order.PREPARING_to_READY_FOR_PICKUP
          - state_machines.Assignment
        distinguishing_aspect: |
          Entity pair: Order → Assignment. Order.PREPARING→READY_FOR_PICKUP is blocked unless there exists an
          Assignment with order_id == Order.id AND Assignment.status IN {ACCEPTED, PICKED_UP}. Attempting /ready
          while all assignments are still OFFERED (rider hasn't accepted yet) returns ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Place Order O1, restaurant accepts, start-preparing (creates Assignment A1 in OFFERED but Rider does NOT accept)"
          trigger:
            - "Restaurant POST /api/orders/{O1}/ready while A1 still OFFERED"
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE (precondition on sibling Assignment.status)"
            - "After Rider accepts A1 (A1.status -> ACCEPTED), a subsequent /ready call succeeds"

      - name: work_order_resolve_requires_related_return_terminal
        grounds:
          - state_machines.WorkOrder.UNDER_REVIEW_to_RESOLVED
          - state_machines.Return
          - validations[priority=16]
        distinguishing_aspect: |
          DIFFERENT entity pair from the sibling: WorkOrder → Return (not Order → Assignment).
          WorkOrder.UNDER_REVIEW→RESOLVED is blocked if WorkOrder.related_return_id is non-null AND the linked
          Return is not yet in {APPROVED, REJECTED}. Two distinct cross-entity dependencies exercised.
        test_recipe:
          setup:
            - "Create Return R1 in REQUESTED; create WorkOrder W1 with related_return_id=R1; CS assigns W1 -> UNDER_REVIEW"
          trigger:
            - "CS POST /api/work-orders/{W1}/resolve body {resolution_notes: 'trying'}"
          assert:
            - "HTTP 422 with error_id == ERR_RELATED_RETURN_UNRESOLVED"
            - "After POST /api/returns/{R1}/reject (R1 -> REJECTED, terminal), the same /resolve call succeeds with W1 -> RESOLVED"
