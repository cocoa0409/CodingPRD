        distinguishing_aspect: "STEP_DOWN bands use strict > on the upper edge: remaining months 49 -> 5% (40,000,000), 46 -> 4% (32,000,000), 12 -> 1% (8,000,000) on an 800,000,000 balance; m == 48 would be 4% not 5%."
