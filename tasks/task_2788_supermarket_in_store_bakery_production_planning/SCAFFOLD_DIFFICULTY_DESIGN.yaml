              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { bd_id: $.data.id }
            - call: "POST /bakery/bake-days/${bd_id}/forecast-lines"
              payload: { product_id: "${fil_id}", daypart: "MORNING", forecasted_units: 1 }
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { bd_v1: $.data.version }
            - call: "POST /bakery/bake-days/${bd_id}/generate-plan"
              payload: { expected_bake_day_version: "${bd_v1}" }
              as: DepartmentManager
              as_user_id: "${dept_id}"
            - call: "POST /bakery/production-runs"
              payload: { bake_day_id: "${bd_id}", product_id: "${crois_id}", rack_count: 2, oven_id: "${oven_a_id}", deck_index: 0, bake_start_utc: "2026-08-12T05:00:00Z" }
              as: Baker
              as_user_id: "baker-01"
              captures: { run_id: $.data.id }
            - call: "POST /bakery/ovens/${oven_a_id}/status"
              payload: { oven_status: "MAINTENANCE", status_reason: "burner service" }
              as: DepartmentManager
              as_user_id: "${dept_id}"
          trigger:
            - call: "POST /bakery/production-runs/${run_id}/start-bake"
              payload: {}
              as: Baker
              as_user_id: "baker-01"
              captures: { blocked_error: $.data.error_id }
            - call: "POST /bakery/ovens/${oven_a_id}/status"
              payload: { oven_status: "AVAILABLE" }
              as: DepartmentManager
              as_user_id: "${dept_id}"
            - call: "POST /bakery/production-runs/${run_id}/start-bake"
              payload: {}
              as: Baker
              as_user_id: "baker-01"
          assert:
            - "${blocked_error} == ERR_OVEN_UNAVAILABLE with HTTP 409"
            - "ProductionRun.${run_id}.execution_status is still SCHEDULED after the rejection"
            - "Oven.${oven_a_id}.oven_status == MAINTENANCE and status_reason == 'burner service' at the moment of rejection"
            - "after the oven returns to AVAILABLE the identical start-bake call returns 200 and execution_status == BAKING"
            - "Oven.${oven_a_id}.status_reason is cleared to null when the oven returns to AVAILABLE"

      - name: cake_order_cannot_confirm_against_a_closed_pickup_slot
        grounds:
          - validations.priority_27
          - state_machines.PickupSlot.slot_status
          - state_machines.CustomCakeOrder.order_status
          - errors.ERR_PICKUP_SLOT_CLOSED
          - endpoints.POST_/bakery/pickup-slots/{pickupSlotId}/close
        distinguishing_aspect: |
          A DIFFERENT entity pair — CUSTOM CAKE ORDER -> PICKUP SLOT — on a different
          state machine and a different endpoint family. The order sits in a legal
          INTAKE state and the confirm request is well formed; only the slot's
          slot_status blocks it, and a sibling order on an OPEN slot confirms fine.
        test_recipe:
          setup:
            - "CAKE-8 custom cake base; two pickup slots on the same day: 14:00Z-16:00Z and 16:00Z-18:00Z."
            - "Two INTAKE orders, one against each slot (STANDARD / 2 tiers, no rush)."
            - "The 14:00Z slot is then CLOSED; the 16:00Z slot stays OPEN."
            - "Clock 2026-08-12T04:00:00Z, well inside both 180-minute decoration deadlines."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T04:00:00Z" }
              as: RegionalAdmin
            - call: "POST /bakery/departments"
              payload: { name: "Store 41 Bakery", store_number: "0041", shrink_budget_pct: 0.03, labor_rate_cents_per_minute: 40, freight_surcharge_pct: 0.05 }
