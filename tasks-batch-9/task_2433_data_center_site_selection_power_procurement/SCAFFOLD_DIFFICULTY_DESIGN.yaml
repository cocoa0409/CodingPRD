            - call: "POST /water-sources"
              payload: { name: "Yadkin Basin", basin_code: "YAD-03", state_code: "NC", annual_permitted_mgal: 900 }
              as: PermittingAuthority
              captures: { w_id: $.data.id }
            - call: "POST /candidate-sites"
              payload: { program_id: "${p_id}", utility_id: "${u_id}", water_source_id: "${w_id}", name: "Site Alpha", state_code: "NC", county: "Rowan", gross_acres: 300 }
              as: SiteScreeningAnalyst
              captures: { s1_id: $.data.id }
            - call: "GET /candidate-sites/${s1_id}"
              payload: {}
              as: SiteScreeningAnalyst
              captures: { s1_v0: $.data.version }
            - call: "POST /parcel-options"
              payload: { site_id: "${s1_id}", parcel_apn: "APN-100", phase_index: 1, acres: 240, option_premium_usd: 1250000, purchase_price_usd: 42000000, premium_credit_pct: 0.5, window_start: "2027-01-01T00:00:00Z", window_end: "2027-12-31T00:00:00Z", expected_site_version: "${s1_v0}" }
              as: SiteScreeningAnalyst
              captures: { o1_id: $.data.id }
            - call: "GET /candidate-sites/${s1_id}"
              payload: {}
              as: SiteScreeningAnalyst
              captures: { s1_v1: $.data.version }
          trigger:
            - call: "POST /parcel-options"
              payload: { site_id: "${s1_id}", parcel_apn: "APN-100", phase_index: 1, acres: 300, option_premium_usd: 400000, purchase_price_usd: 50000000, premium_credit_pct: 0.5, window_start: "2027-06-01T00:00:00Z", window_end: "2028-12-31T00:00:00Z", replaces_option_id: "${o1_id}", expected_site_version: "${s1_v1}" }
              as: SiteScreeningAnalyst
              captures: { o2_id: $.data.id }
          assert:
            - "LandParcelOption.${o1_id}.status == RELEASED"
            - "LandParcelOption.${o2_id}.status == OPTIONED"
            - "LandParcelOption.${o2_id}.replaces_option_id == ${o1_id}"
            - "SitingProgram.${p_id}.option_exposure_usd == 400000.00"
            - "SitingProgram.${p_id}.forfeited_premium_usd == 1250000.00"
            - "SitingProgram.${p_id}.capitalized_premium_usd == 0"
            - "SitingProgram.${p_id}.premium_committed_total_usd == 1650000.00"
            - "SitingProgram.${p_id}.option_exposure_usd + SitingProgram.${p_id}.forfeited_premium_usd + SitingProgram.${p_id}.capitalized_premium_usd == SitingProgram.${p_id}.premium_committed_total_usd"
            - "CandidateSite.${s1_id}.land_control_pct == 100.00"
            - "CandidateSite.${s1_id}.land_control_status == FULL"
            - "SitingProgram.${p_id}.full_land_control_site_count == 1"
            - "CandidateSite.${s1_id}.site_capital_commitment_usd == 400000.00"
