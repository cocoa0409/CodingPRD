            - { call: "POST /api/contracts/${contract_id}/recording-projects", payload: { title: "P-B2", project_type: "ALBUM", budget_cents: 1000000 }, as: AnRManager, captures: { proj_id: $.data.id } }
            - { call: "POST /api/recording-projects/${proj_id}/start", payload: {}, as: AnRManager }
            - { call: "POST /api/recording-projects/${proj_id}/milestones", payload: { name: "M1", sequence: 1, due_date: "2026-09-01", payment_cents: 600000 }, as: AnRManager, captures: { m1: $.data.id } }
            - { call: "POST /api/milestones/${m1}/submit", payload: {}, as: AnRManager }
            - { call: "POST /api/milestones/${m1}/approve", payload: {}, as: LabelAdmin }
            - { call: "POST /api/milestones/${m1}/pay", payload: {}, as: FinanceController }
