            - { call: "POST /network/showtimes/${st_id}/attendance-reports", payload: { reported_attendance: 180 }, as: TheaterOps, as_user_id: "${t_id}", captures: { err2: "$.data.error_id" } }
          assert:
            - "while SUBMITTED: error_id == ERR_DUPLICATE_OPEN_ATTENDANCE_REPORT"
            - "while ACCEPTED: error_id == ERR_DUPLICATE_OPEN_ATTENDANCE_REPORT again"

      - name: playlog_before_showtime_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_PLAYLOG_BEFORE_SHOWTIME]"]
        distinguishing_aspect: "Temporal tier on playlogs: with the logical clock at 18:00, two hours before the 19:00 starts_at, recording playback on a CONFIRMED slot is rejected with ERR_PLAYLOG_BEFORE_SHOWTIME."
        test_recipe:
          setup: ["reel LOCKED (slot CONFIRMED); clock deliberately left at a pre-showtime instant"]
          setup_api_calls:
            - { call: "POST /network/theaters", payload: { name: "MetroPlex", market_tier: MAJOR_METRO }, as: NetworkOps, captures: { t_id: "$.data.id" } }
            - { call: "POST /network/theaters/${t_id}/screens", payload: { auditorium_label: "Aud 1", seat_count: 200 }, as: NetworkOps, captures: { s_id: "$.data.id" } }
