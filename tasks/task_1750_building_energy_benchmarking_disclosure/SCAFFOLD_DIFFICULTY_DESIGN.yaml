            - { call: "POST /v1/utility-accounts/${acc1}/usage-records", payload: { period_start: "2027-01-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z", consumption_value: 1200000 }, as: UtilityAgent, captures: { ur1: $.data.id } }
