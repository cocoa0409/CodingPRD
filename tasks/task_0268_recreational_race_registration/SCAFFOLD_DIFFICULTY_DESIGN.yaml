          assert:
            - "Distance.${dist}.confirmed_count == 0"
            - "Registration.${reg}.status == CANCELLED"

      - name: wave_assigned_count_invariant_after_assign_then_cancel
        grounds:
          - state_machines.Registration.CONFIRMED_to_BIB_ASSIGNED
          - state_machines.Registration.BIB_ASSIGNED_to_CANCELLED
          - entities.Wave.fields.assigned_count
        distinguishing_aspect: |
          Conserved quantity = Wave.assigned_count == count of BibAssignments referencing the wave
          (a different conserved quantity than distance occupancy). assign-bib (+1) paired with the
          compensating cancel of the BIB_ASSIGNED registration (-1, bib deleted) returns assigned_count to 0.
        test_recipe:
          setup:
            - "Wave wave_capacity 5, assigned_count starts at 0; P1 CONFIRMED then BIB_ASSIGNED."
          setup_api_calls:
            - call: "POST /participants"
              payload: { email: "wa1@x.com", full_name: "WA One", birthdate: "1990-01-01", gender: "M" }
