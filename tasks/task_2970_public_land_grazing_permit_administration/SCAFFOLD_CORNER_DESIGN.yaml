              payload: { name: "Immediate Consistency Allotment", admin_unit_code: "NV-179", acres: 4200, total_permitted_aums: 200, season_start: "01-01", season_end: "12-31", required_pasture_rotation_count: 1 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_a72_id: "$.data.id" }
            - call: "POST /allotments/${c_a72_id}/pastures"
