      - name: completion_is_blocked_by_an_unresolved_or_failed_safety_item
        claim_type: violation→error
        grounds:
          - validations[priority=36]
          - validations[priority=51]
          - validations[priority=52]
          - errors.ERR_CHECKLIST_ITEM_UNKNOWN
          - errors.ERR_CHECKLIST_INCOMPLETE
          - errors.ERR_SAFETY_CRITICAL_FAIL_BLOCKS_COMPLETION
        distinguishing_aspect: "Three distinct checklist rules fire in sequence on one visit: completing with one of two items unresolved is ERR_CHECKLIST_INCOMPLETE, an item_code outside the copied template is ERR_CHECKLIST_ITEM_UNKNOWN, and once every item is resolved but the safety-critical one FAILed, completion is refused by the higher-priority ERR_SAFETY_CRITICAL_FAIL_BLOCKS_COMPLETION rather than by the now-satisfied completeness rule."
        test_recipe:
          setup:
            - "Clock 2026-08-15T08:00:00Z; club NORTH, unit e1, ACTIVE GOLD/FULL contract, technician T1."
            - "Model TM-900 carries a two-element checklist: BELT_TENSION (not safety critical) and EMERGENCY_STOP (safety critical)."
            - "A visit on e1 is assigned to T1 for 08:00-09:30 and started."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T08:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH" }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "TM-900", category: "TREADMILL", model_year: 2019, pm_interval_hours: 250, expected_service_life_hours: 20000, base_annual_service_cents: 120000, checklist_template: [{ code: "BELT_TENSION", is_safety_critical: false, consumable: true }, { code: "EMERGENCY_STOP", is_safety_critical: true, consumable: false }] }, as: ContractAdministrator, captures: { model_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-CK-1", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e1_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_id}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 250000, initial_parts_allowance_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { c_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts/${c_id}/activate", as: ContractAdministrator }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Dana Reyes", region_code: "NORTH", skill_categories: ["TREADMILL"] }, as: ContractAdministrator, captures: { t1_id: "$.data.id" } }
            - { call: "POST /fleetcare/preventive-visits", payload: { contract_id: "${c_id}", equipment_id: "${e1_id}", window_start: "2026-08-15T08:00:00Z", window_end: "2026-08-15T09:30:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator, captures: { v1_id: "$.data.id", total: "$.data.checklist_total_count" } }
            - { call: "POST /fleetcare/preventive-visits/${v1_id}/start", as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "POST /fleetcare/preventive-visits/${v1_id}/checklist-results", payload: { item_code: "BELT_TENSION", result: "PASS", consumable_replaced: true }, as: FieldTechnician, as_user_id: "${t1_id}", captures: { resolved_1: "$.data.checklist_resolved_count" } }
          trigger:
            - { call: "POST /fleetcare/preventive-visits/${v1_id}/complete", as: FieldTechnician, as_user_id: "${t1_id}", captures: { err_incomplete: "$.data.error_id" } }
            - { call: "POST /fleetcare/preventive-visits/${v1_id}/checklist-results", payload: { item_code: "FLUX_CAPACITOR", result: "PASS" }, as: FieldTechnician, as_user_id: "${t1_id}", captures: { err_unknown: "$.data.error_id" } }
            - { call: "POST /fleetcare/preventive-visits/${v1_id}/checklist-results", payload: { item_code: "EMERGENCY_STOP", result: "FAIL", note: "E-stop does not latch" }, as: FieldTechnician, as_user_id: "${t1_id}", captures: { resolved_2: "$.data.checklist_resolved_count", failed_2: "$.data.safety_critical_failed_count" } }
            - { call: "POST /fleetcare/preventive-visits/${v1_id}/complete", as: FieldTechnician, as_user_id: "${t1_id}", captures: { err_safety: "$.data.error_id" } }
          assert:
            - "${total} == 2 and ${resolved_1} == 1"
            - "${err_incomplete} == 'ERR_CHECKLIST_INCOMPLETE' with HTTP 409"
            - "${err_unknown} == 'ERR_CHECKLIST_ITEM_UNKNOWN' with HTTP 422 and checklist_resolved_count is still 1"
            - "${resolved_2} == 2, ${failed_2} == 1 and checklist_failed_count == 1"
            - "${err_safety} == 'ERR_SAFETY_CRITICAL_FAIL_BLOCKS_COMPLETION' with HTTP 409 — priority 36 outranks the now-satisfied priority 52"
            - "PreventiveVisit.${v1_id}.visit_status == 'IN_PROGRESS' with completed_at null and pm_credit_earned false"
            - "ServiceContract.${c_id}.pm_visits_completed_count == 0 and pm_compliance_pct == 100.00 (no history yet)"
            - "Technician.${t1_id}.committed_minutes == 90 — the assignment is untouched by the refusals"

