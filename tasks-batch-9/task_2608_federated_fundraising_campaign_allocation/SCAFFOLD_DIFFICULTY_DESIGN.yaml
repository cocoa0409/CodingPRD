  - rule_id: resource_temporal_overlap
    instances:
      - name: employer_campaign_windows_half_open_touching_endpoints_allowed
        grounds:
          - validations.priority_27_ERR_CAMPAIGN_WINDOW_OVERLAP
          - errors.ERR_CAMPAIGN_WINDOW_OVERLAP
          - entities.Campaign.fields.solicitation_start_date
          - entities.Campaign.fields.solicitation_end_date
          - endpoints.POST_fundraising_campaigns
        distinguishing_aspect: |
          Resource entity: Employer (the workplace whose employees may only be solicited by one
          campaign at a time). Interval semantics: HALF-OPEN [solicitation_start_date,
          solicitation_end_date) - so a new campaign whose start equals an existing campaign's
          end is legal, while a start one day earlier is not. This is the opposite convention
          from the panelist site-visit instance, which uses closed intervals plus a buffer, and
          the guarded resource is a different entity.
        test_recipe:
          setup:
            - "One ACTIVE employer EMP_A holding an OPEN campaign for [2026-07-01, 2026-09-30)."
            - "A second ACTIVE employer EMP_B holding no campaign, used to prove the constraint is scoped per employer."
            - "Logical clock left at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /fundraising/employers"
              payload: { legal_name: "Granite State Mutual", employee_count: 500, payroll_periods_per_year: 26, historical_shrinkage_rate_bps: 500 }
              as: UnitedFundAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /fundraising/employers/${emp_id}/activate"
              payload: {}
              as: UnitedFundAdmin
            - call: "POST /fundraising/campaigns"
              payload: { employer_id: "${emp_id}", campaign_year: 2026, solicitation_start_date: "2026-07-01", solicitation_end_date: "2026-09-30", loss_reserve_amount: 0.00 }
              as: UnitedFundAdmin
              captures: { camp_a: $.data.id }
            - call: "POST /fundraising/campaigns/${camp_a}/open"
              payload: {}
              as: UnitedFundAdmin
            - call: "POST /fundraising/employers"
              payload: { legal_name: "Northwind Grocers", employee_count: 310, payroll_periods_per_year: 24, historical_shrinkage_rate_bps: 800 }
              as: UnitedFundAdmin
              captures: { emp_b: $.data.id }
            - call: "POST /fundraising/employers/${emp_b}/activate"
              payload: {}
              as: UnitedFundAdmin
          trigger:
            - call: "POST /fundraising/campaigns"
              payload: { employer_id: "${emp_id}", campaign_year: 2027, solicitation_start_date: "2026-09-29", solicitation_end_date: "2026-12-31", loss_reserve_amount: 0.00 }
              as: UnitedFundAdmin
            - call: "POST /fundraising/campaigns"
              payload: { employer_id: "${emp_id}", campaign_year: 2027, solicitation_start_date: "2026-09-30", solicitation_end_date: "2026-12-31", loss_reserve_amount: 0.00 }
              as: UnitedFundAdmin
              captures: { camp_touch: $.data.id, touch_posture: $.data.posture }
            - call: "POST /fundraising/campaigns"
              payload: { employer_id: "${emp_b}", campaign_year: 2026, solicitation_start_date: "2026-07-01", solicitation_end_date: "2026-09-30", loss_reserve_amount: 0.00 }
              as: UnitedFundAdmin
              captures: { camp_b: $.data.id }
          assert:
            - "One-day overlap is refused: the [2026-09-29, 2026-12-31) attempt returns HTTP 409 with error_id == ERR_CAMPAIGN_WINDOW_OVERLAP, because 2026-09-29 < 2026-09-30 and 2026-07-01 < 2026-12-31"
            - "Employer.${emp_id}.active_campaign_count is still 1 after the refusal - no Campaign row was created"
            - "Touching endpoints are ALLOWED under half-open semantics: the [2026-09-30, 2026-12-31) attempt returns 201 with posture == PLANNED, since the existing interval excludes its own end date"
            - "The constraint is scoped to the Employer resource: EMP_B may hold the byte-identical [2026-07-01, 2026-09-30) window that EMP_A already holds, and that create returns 201"
            - "GET /fundraising/employers/${emp_id}/campaigns returns exactly 2 campaigns and GET /fundraising/employers/${emp_b}/campaigns returns exactly 1"
            - "A subsequent attempt on EMP_A for [2026-12-31, 2027-03-31) also returns 201 - fully disjoint intervals are never blocked - while [2026-12-30, 2027-03-31) returns 409"

      - name: panelist_site_visit_windows_closed_intervals_plus_three_day_buffer
        grounds:
          - validations.priority_28_ERR_SITE_VISIT_BUFFER_CONFLICT
          - errors.ERR_SITE_VISIT_BUFFER_CONFLICT
          - calculations.outcome_report_expenditure_variance.constants.SITE_VISIT_BUFFER_DAYS
          - entities.OutcomeReport.fields.site_visit_window_start
          - entities.OutcomeReport.fields.site_visit_window_end
          - entities.Panelist.fields.site_visit_count
          - endpoints.POST_fundraising_outcome_reports_id_site_visit
        distinguishing_aspect: |
          A different resource entity (Panelist - a volunteer's own travel calendar) and the
          opposite interval convention from the employer-campaign instance: the site-visit window
          is a CLOSED interval [start, end] AND it carries a SITE_VISIT_BUFFER_DAYS == 3 travel
          buffer on both sides. Three consequences are tested at the exact boundary: a window
          starting on another window's end date collides (closed, unlike half-open), a gap of
          exactly 3 days still collides (the rule demands MORE than the buffer), and a gap of 4
          days is clean. A second panelist may hold the byte-identical window, proving the
          constraint is scoped per Panelist rather than globally.
        test_recipe:
          setup:
            - "Three agencies AG1, AG2, AG3 all GOOD_STANDING via reviews certified at 100.00, none holding designations (designated_passthrough_ytd 0.00)."
            - "Five panelists all seated on one OPEN cycle with conflict_declared == false: P1/P2/P3 are the scorers, P4 and P5 file no scores at all so segregation of duties (priority 23) never blocks their site visits."
            - "One OPEN cycle: focus FINANCIAL_STABILITY, opening_undesignated_pool 300000.00, max_award_per_agency 200000.00, window [2026-07-01, 2026-12-31)."
            - "Three requests of 20000.00 (one per agency), each scored (100,100,100) by P1/P2/P3, finalized to PANEL_APPROVED at composite 100.00, and awarded 21200.00 (base 20000.00, offset 0.00, supplement 1200.00 at rate 0.06)."
            - "Three SUBMITTED outcome reports REP1, REP2, REP3, one per awarded request, each with funds_expended 21200.00 so expenditure_variance_pct == 0.00."
            - "Logical clock left at its 2026-08-01T00:00:00Z default, so every report's submitted_at date is 2026-08-01 and every window below satisfies priority 29 (start >= 2026-08-01, end <= 2026-10-30)."
