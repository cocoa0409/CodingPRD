        distinguishing_aspect: "Each completed PREDATOR_PROOFING visit climbs the grade ladder exactly one rung: NONE -> B -> A -> A (saturated at A on the third completion)."
        test_recipe:
          setup:
            - "URBAN household; coop INSTALLED via SETUP_INSTALL (grade NONE)"
