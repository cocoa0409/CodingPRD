# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe: every testable §1.1-§1.7 claim not already covered by §1.8.
# Same seven-point contract + §1.5 reachability as §1.8.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_parcel_returns_201_and_system_fields
        claim_type: Creation
        grounds:
          - entities.Parcel
          - 'endpoints["POST /property-tax/parcels"]'
        distinguishing_aspect: "POST /property-tax/parcels with all required fields returns 201, echoes inputs, and mints id/created_at/version (version starts at 1)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /property-tax/parcels"
              payload: { parcel_number: "APN-C1", owner_name: "Cee One", situs_address: "1 Corner", assessed_value_cents: 12345600, property_class: "RESIDENTIAL" }
              as: Cashier
              captures: { p_id: $.data.id, ver: $.data.version }
          assert:
            - "Parcel.${p_id}.assessed_value_cents == 12345600"
            - "Parcel.${p_id}.property_class == RESIDENTIAL"
            - "Parcel.${p_id}.version == 1"

      - name: parcel_homestead_defaults_to_false
        claim_type: Defaults
        grounds:
          - entities.Parcel.fields.homestead
        distinguishing_aspect: "Omitting homestead on parcel creation applies the declared default false."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /property-tax/parcels"
              payload: { parcel_number: "APN-C2", owner_name: "Def Ault", situs_address: "2 Corner", assessed_value_cents: 1000000, property_class: "AGRICULTURAL" }
              as: Cashier
              captures: { p_id: $.data.id }
          assert:
            - "Parcel.${p_id}.homestead == false"

      - name: get_parcel_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - 'errors[ERR_NOT_FOUND]'
          - 'endpoints["GET /property-tax/parcels/{id}"]'
        distinguishing_aspect: "GET on a well-formed but non-existent parcel id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /property-tax/parcels/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Treasurer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_parcel_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - entities.Parcel.fields.assessed_value_cents
          - 'errors[ERR_VALIDATION]'
        distinguishing_aspect: "POST parcel without assessed_value_cents returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /property-tax/parcels"
              payload: { parcel_number: "APN-C3", owner_name: "No Val", situs_address: "3 Corner", property_class: "RESIDENTIAL" }
              as: Cashier
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"
            - "HTTP status == 400"

      - name: create_parcel_invalid_property_class_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Parcel.fields.property_class
          - 'errors[ERR_INVALID_ENUM]'
        distinguishing_aspect: "property_class outside {RESIDENTIAL,COMMERCIAL,AGRICULTURAL,INDUSTRIAL} returns ERR_INVALID_ENUM (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /property-tax/parcels"
              payload: { parcel_number: "APN-C4", owner_name: "Bad Enum", situs_address: "4 Corner", assessed_value_cents: 1000000, property_class: "MANSION" }
              as: Cashier
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_ENUM"
            - "HTTP status == 422"

      - name: create_parcel_unknown_escrow_agent_fk_rejected
        claim_type: Parent Relationships
        grounds:
          - entities.Parcel.fields.escrow_agent_id
          - 'errors[ERR_NOT_FOUND]'
        distinguishing_aspect: "escrow_agent_id that does not resolve to an EscrowAgent returns ERR_NOT_FOUND (FK integrity)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /property-tax/parcels"
              payload: { parcel_number: "APN-C5", owner_name: "No Agent", situs_address: "5 Corner", assessed_value_cents: 1000000, property_class: "COMMERCIAL", escrow_agent_id: "00000000-0000-0000-0000-000000000000" }
              as: Cashier
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

  # ---------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: new_bill_starts_in_current_none_pending
        claim_type: Initial State
        grounds:
          - state_machines.TaxBill.collection_status
          - state_machines.TaxBill.sale_status
          - state_machines.Installment
        distinguishing_aspect: "A freshly issued bill has collection_status CURRENT, sale_status NONE, and both installments PENDING."
        test_recipe:
          setup: ["A tax year and parcel exist."]
          setup_api_calls:
            - call: "POST /property-tax/tax-years"
              payload: { year: 2025, millage_rate: 20.0, first_installment_due_date: "2026-06-15T00:00:00Z", second_installment_due_date: "2026-09-15T00:00:00Z" }
              as: Treasurer
              captures: { ty_id: $.data.id }
            - call: "POST /property-tax/parcels"
              payload: { parcel_number: "APN-C6", owner_name: "Fresh Bill", situs_address: "6 Corner", assessed_value_cents: 20000000, property_class: "RESIDENTIAL" }
              as: Cashier
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /property-tax/tax-bills"
              payload: { parcel_id: "${p_id}", tax_year_id: "${ty_id}" }
              as: Treasurer
              captures: { bill_id: $.data.id }
          assert:
            - "TaxBill.${bill_id}.collection_status == CURRENT"
            - "TaxBill.${bill_id}.sale_status == NONE"
            - "Installment(sequence=1 of bill ${bill_id}).status == PENDING"

      - name: redeem_already_redeemed_referral_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.TaxSaleReferral.REFERRED_to_REDEEMED
          - 'errors[ERR_INVALID_STATE]'
        distinguishing_aspect: "Redeeming a referral already in REDEEMED returns ERR_INVALID_STATE; no side effect fires."
        test_recipe:
          setup: ["Parcel assessed 5000000; installment 1 paid; clock 2026-09-16; referral opened then redeemed."]
          setup_api_calls:
            - call: "POST /property-tax/tax-years"
              payload: { year: 2025, millage_rate: 20.0, first_installment_due_date: "2026-06-15T00:00:00Z", second_installment_due_date: "2026-09-15T00:00:00Z" }
              as: Treasurer
              captures: { ty_id: $.data.id }
            - call: "POST /property-tax/parcels"
              payload: { parcel_number: "APN-C7", owner_name: "Re Deem", situs_address: "7 Corner", assessed_value_cents: 5000000, property_class: "RESIDENTIAL" }
              as: Cashier
              captures: { p_id: $.data.id }
            - call: "POST /property-tax/tax-bills"
              payload: { parcel_id: "${p_id}", tax_year_id: "${ty_id}" }
              as: Treasurer
              captures: { bill_id: $.data.id }
            - call: "POST /property-tax/payments"
              payload: { bill_id: "${bill_id}", amount_cents: 50000, tender_type: "CHECK", source: "COUNTER" }
              as: Cashier
            - call: "POST /property-tax/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: CollectionsOfficer
            - call: "GET /property-tax/tax-bills/${bill_id}"
              payload: {}
              as: CollectionsOfficer
              captures: { bill_v: $.data.version }
            - call: "POST /property-tax/tax-sale-referrals"
              payload: { bill_id: "${bill_id}", expected_bill_version: "${bill_v}" }
              as: CollectionsOfficer
              as_user_id: "co-1"
              captures: { ref_id: $.data.id }
            - call: "POST /property-tax/tax-sale-referrals/${ref_id}/redeem"
              payload: {}
              as: CollectionsOfficer
          trigger:
            - call: "POST /property-tax/tax-sale-referrals/${ref_id}/redeem"
              payload: {}
              as: CollectionsOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: review_twice_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.TaxReliefApplication.SUBMITTED_to_UNDER_REVIEW
          - 'errors[ERR_INVALID_STATE]'
        distinguishing_aspect: "Calling review on an application already UNDER_REVIEW returns ERR_INVALID_STATE (no legal SUBMITTED source)."
        test_recipe:
          setup: ["A submitted application already moved UNDER_REVIEW."]
          setup_api_calls:
            - call: "POST /property-tax/tax-years"
              payload: { year: 2025, millage_rate: 20.0, first_installment_due_date: "2026-06-15T00:00:00Z", second_installment_due_date: "2026-09-15T00:00:00Z" }
              as: Treasurer
              captures: { ty_id: $.data.id }
            - call: "POST /property-tax/parcels"
              payload: { parcel_number: "APN-C8", owner_name: "Re View", situs_address: "8 Corner", assessed_value_cents: 15000000, property_class: "RESIDENTIAL" }
              as: Cashier
              captures: { p_id: $.data.id }
            - call: "POST /property-tax/relief-applications"
              payload: { parcel_id: "${p_id}", tax_year_id: "${ty_id}", relief_class: "EXEMPTION", relief_type: "HOMESTEAD", claimed_amount_cents: 50000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: Cashier
              captures: { app_id: $.data.id }
            - call: "POST /property-tax/relief-applications/${app_id}/review"
              payload: {}
              as: ReliefOfficer
              as_user_id: "ro-1"
          trigger:
            - call: "POST /property-tax/relief-applications/${app_id}/review"
              payload: {}
              as: ReliefOfficer
              as_user_id: "ro-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: decide_denied_application_already_decided
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.TaxReliefApplication.UNDER_REVIEW_to_DENIED
          - 'errors[ERR_RELIEF_ALREADY_DECIDED]'
        distinguishing_aspect: "Deciding an application already DENIED returns ERR_RELIEF_ALREADY_DECIDED; terminal state is locked."
        test_recipe:
          setup: ["An application reviewed then DENIED."]
          setup_api_calls:
            - call: "POST /property-tax/tax-years"
              payload: { year: 2025, millage_rate: 20.0, first_installment_due_date: "2026-06-15T00:00:00Z", second_installment_due_date: "2026-09-15T00:00:00Z" }
              as: Treasurer
              captures: { ty_id: $.data.id }
            - call: "POST /property-tax/parcels"
              payload: { parcel_number: "APN-C9", owner_name: "De Nied", situs_address: "9 Corner", assessed_value_cents: 15000000, property_class: "RESIDENTIAL" }
              as: Cashier
              captures: { p_id: $.data.id }
            - call: "POST /property-tax/relief-applications"
              payload: { parcel_id: "${p_id}", tax_year_id: "${ty_id}", relief_class: "ABATEMENT", relief_type: "HARDSHIP", claimed_amount_cents: 50000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: Cashier
              captures: { app_id: $.data.id }
            - call: "POST /property-tax/relief-applications/${app_id}/review"
              payload: {}
              as: ReliefOfficer
              as_user_id: "ro-1"
            - call: "POST /property-tax/relief-applications/${app_id}/decide"
              payload: { decision: "DENY" }
              as: ReliefOfficer
              as_user_id: "ro-1"
          trigger:
            - call: "POST /property-tax/relief-applications/${app_id}/decide"
              payload: { decision: "APPROVE" }
              as: ReliefOfficer
              as_user_id: "ro-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_RELIEF_ALREADY_DECIDED"
            - "HTTP status == 409"

  # ---------------------------------------------------------------------
  - section: calculations
    instances:
      - name: bill_levy_applies_approved_exemption
        claim_type: Correct Result
        grounds:
          - calculations.bill_levy
          - calculations.relief_credit
          - entities.TaxBill.fields.net_tax_cents
        distinguishing_aspect: "With an APPROVED EXEMPTION of 100000 in place at issuance, gross 400000 becomes net 300000 and installments split 150000/150000 (EXEMPTION variant applied pre-split)."
        test_recipe:
          setup: ["Tax year (millage 20.0) and parcel assessed 20000000; an EXEMPTION for 100000 approved before the bill is issued."]
          setup_api_calls:
            - call: "POST /property-tax/tax-years"
              payload: { year: 2025, millage_rate: 20.0, first_installment_due_date: "2026-06-15T00:00:00Z", second_installment_due_date: "2026-09-15T00:00:00Z" }
              as: Treasurer
              captures: { ty_id: $.data.id }
            - call: "POST /property-tax/parcels"
              payload: { parcel_number: "APN-C10", owner_name: "Ex Empt", situs_address: "10 Corner", assessed_value_cents: 20000000, property_class: "RESIDENTIAL" }
              as: Cashier
              captures: { p_id: $.data.id }
            - call: "POST /property-tax/relief-applications"
              payload: { parcel_id: "${p_id}", tax_year_id: "${ty_id}", relief_class: "EXEMPTION", relief_type: "HOMESTEAD", claimed_amount_cents: 100000, effective_from: "2025-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: Cashier
              captures: { app_id: $.data.id }
            - call: "POST /property-tax/relief-applications/${app_id}/review"
              payload: {}
              as: ReliefOfficer
              as_user_id: "ro-1"
            - call: "POST /property-tax/relief-applications/${app_id}/decide"
              payload: { decision: "APPROVE" }
              as: ReliefOfficer
              as_user_id: "ro-1"
          trigger:
            - call: "POST /property-tax/tax-bills"
              payload: { parcel_id: "${p_id}", tax_year_id: "${ty_id}" }
              as: Treasurer
              captures: { bill_id: $.data.id }
          assert:
            - "TaxBill.${bill_id}.gross_tax_cents == 400000"
            - "TaxBill.${bill_id}.exemption_credit_cents == 100000"
            - "TaxBill.${bill_id}.net_tax_cents == 300000"
            - "Installment(sequence=1 of bill ${bill_id}).principal_due_cents == 150000"
            - "Installment(sequence=2 of bill ${bill_id}).principal_due_cents == 150000"

      - name: payment_partial_allocation_waterfall
        claim_type: Correct Result
        grounds:
          - calculations.payment_allocation
          - state_machines.Installment.PENDING_to_PARTIALLY_PAID
        distinguishing_aspect: "A 250000 payment on a 400000 bill (installments 200000/200000, clock default, no delinquency) fully pays installment 1 and partially pays installment 2 (paid 50000, balance 150000); overpayment 0."
        test_recipe:
          setup: ["Fresh bill net 400000, installments 200000/200000, clock default."]
          setup_api_calls:
            - call: "POST /property-tax/tax-years"
              payload: { year: 2025, millage_rate: 20.0, first_installment_due_date: "2026-06-15T00:00:00Z", second_installment_due_date: "2026-09-15T00:00:00Z" }
              as: Treasurer
              captures: { ty_id: $.data.id }
            - call: "POST /property-tax/parcels"
              payload: { parcel_number: "APN-C11", owner_name: "Par Tial", situs_address: "11 Corner", assessed_value_cents: 20000000, property_class: "RESIDENTIAL" }
              as: Cashier
              captures: { p_id: $.data.id }
            - call: "POST /property-tax/tax-bills"
              payload: { parcel_id: "${p_id}", tax_year_id: "${ty_id}" }
              as: Treasurer
              captures: { bill_id: $.data.id }
          trigger:
            - call: "POST /property-tax/payments"
              payload: { bill_id: "${bill_id}", amount_cents: 250000, tender_type: "CHECK", source: "COUNTER" }
              as: Cashier
              captures: { pay_id: $.data.id }
          assert:
            - "Installment(sequence=1 of bill ${bill_id}).status == PAID"
            - "Installment(sequence=2 of bill ${bill_id}).paid_cents == 50000"
            - "Installment(sequence=2 of bill ${bill_id}).balance_cents == 150000"
            - "TaxBill.${bill_id}.collection_status == PARTIALLY_PAID"
            - "Payment.${pay_id}.overpayment_applied_cents == 0"

      - name: escrow_payment_records_agent_and_source
        claim_type: Correct Result
        grounds:
          - entities.Payment.fields.escrow_agent_id
          - entities.Payment.fields.source
        distinguishing_aspect: "A mortgage-company (escrow) payment posts with source ESCROW and the escrow_agent_id linked, and is discoverable via GET /payments?escrow_agent_id."
        test_recipe:
          setup: ["An escrow agent, a parcel, and a bill exist."]
          setup_api_calls:
            - call: "POST /property-tax/escrow-agents"
              payload: { name: "BigBank Servicing", servicer_code: "BBS" }
              as: Treasurer
              captures: { ea_id: $.data.id }
            - call: "POST /property-tax/tax-years"
              payload: { year: 2025, millage_rate: 20.0, first_installment_due_date: "2026-06-15T00:00:00Z", second_installment_due_date: "2026-09-15T00:00:00Z" }
              as: Treasurer
              captures: { ty_id: $.data.id }
            - call: "POST /property-tax/parcels"
              payload: { parcel_number: "APN-C12", owner_name: "Es Crow", situs_address: "12 Corner", assessed_value_cents: 20000000, property_class: "RESIDENTIAL", escrow_agent_id: "${ea_id}" }
              as: Cashier
              captures: { p_id: $.data.id }
            - call: "POST /property-tax/tax-bills"
              payload: { parcel_id: "${p_id}", tax_year_id: "${ty_id}" }
              as: Treasurer
              captures: { bill_id: $.data.id }
          trigger:
            - call: "POST /property-tax/payments"
              payload: { bill_id: "${bill_id}", amount_cents: 400000, tender_type: "ACH", source: "ESCROW", escrow_agent_id: "${ea_id}" }
              as: Cashier
              captures: { pay_id: $.data.id }
          assert:
            - "Payment.${pay_id}.source == ESCROW"
            - "Payment.${pay_id}.escrow_agent_id == ${ea_id}"
            - "TaxBill.${bill_id}.collection_status == PAID"

  # ---------------------------------------------------------------------
  - section: validations
    instances:
      - name: zero_amount_payment_rejected
        claim_type: Violation to Error
        grounds:
          - 'errors[ERR_ZERO_AMOUNT]'
          - 'validations[priority=5]'
        distinguishing_aspect: "A payment with amount_cents 0 returns ERR_ZERO_AMOUNT (422)."
        test_recipe:
          setup: ["A bill exists."]
          setup_api_calls:
            - call: "POST /property-tax/tax-years"
              payload: { year: 2025, millage_rate: 20.0, first_installment_due_date: "2026-06-15T00:00:00Z", second_installment_due_date: "2026-09-15T00:00:00Z" }
              as: Treasurer
              captures: { ty_id: $.data.id }
            - call: "POST /property-tax/parcels"
              payload: { parcel_number: "APN-C13", owner_name: "Ze Ro", situs_address: "13 Corner", assessed_value_cents: 20000000, property_class: "RESIDENTIAL" }
              as: Cashier
              captures: { p_id: $.data.id }
            - call: "POST /property-tax/tax-bills"
              payload: { parcel_id: "${p_id}", tax_year_id: "${ty_id}" }
              as: Treasurer
              captures: { bill_id: $.data.id }
          trigger:
            - call: "POST /property-tax/payments"
              payload: { bill_id: "${bill_id}", amount_cents: 0, tender_type: "CASH", source: "COUNTER" }
              as: Cashier
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ZERO_AMOUNT"
            - "HTTP status == 422"

      - name: escrow_source_without_agent_rejected
        claim_type: Conditional validation
        grounds:
          - 'errors[ERR_ESCROW_AGENT_REQUIRED]'
          - entities.Payment.fields.source
        distinguishing_aspect: "source ESCROW with escrow_agent_id omitted returns ERR_ESCROW_AGENT_REQUIRED (422)."
        test_recipe:
          setup: ["A bill exists."]
          setup_api_calls:
            - call: "POST /property-tax/tax-years"
              payload: { year: 2025, millage_rate: 20.0, first_installment_due_date: "2026-06-15T00:00:00Z", second_installment_due_date: "2026-09-15T00:00:00Z" }
              as: Treasurer
              captures: { ty_id: $.data.id }
            - call: "POST /property-tax/parcels"
              payload: { parcel_number: "APN-C14", owner_name: "No Agent2", situs_address: "14 Corner", assessed_value_cents: 20000000, property_class: "RESIDENTIAL" }
              as: Cashier
              captures: { p_id: $.data.id }
            - call: "POST /property-tax/tax-bills"
              payload: { parcel_id: "${p_id}", tax_year_id: "${ty_id}" }
              as: Treasurer
              captures: { bill_id: $.data.id }
          trigger:
            - call: "POST /property-tax/payments"
              payload: { bill_id: "${bill_id}", amount_cents: 100000, tender_type: "ACH", source: "ESCROW" }
              as: Cashier
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ESCROW_AGENT_REQUIRED"
            - "HTTP status == 422"

      - name: duplicate_bill_for_parcel_year_rejected
        claim_type: Violation to Error
        grounds:
          - 'errors[ERR_DUPLICATE_BILL]'
          - 'validations[priority=8]'
        distinguishing_aspect: "Issuing a second bill for the same (parcel_id, tax_year_id) returns ERR_DUPLICATE_BILL (409)."
        test_recipe:
          setup: ["A parcel already has a bill for the tax year."]
          setup_api_calls:
            - call: "POST /property-tax/tax-years"
              payload: { year: 2025, millage_rate: 20.0, first_installment_due_date: "2026-06-15T00:00:00Z", second_installment_due_date: "2026-09-15T00:00:00Z" }
              as: Treasurer
              captures: { ty_id: $.data.id }
            - call: "POST /property-tax/parcels"
              payload: { parcel_number: "APN-C15", owner_name: "Dup Bill", situs_address: "15 Corner", assessed_value_cents: 20000000, property_class: "RESIDENTIAL" }
              as: Cashier
              captures: { p_id: $.data.id }
            - call: "POST /property-tax/tax-bills"
              payload: { parcel_id: "${p_id}", tax_year_id: "${ty_id}" }
              as: Treasurer
              captures: { bill_id: $.data.id }
          trigger:
            - call: "POST /property-tax/tax-bills"
              payload: { parcel_id: "${p_id}", tax_year_id: "${ty_id}" }
              as: Treasurer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE_BILL"
            - "HTTP status == 409"

      - name: reverse_already_reversed_payment_rejected
        claim_type: Violation to Error
        grounds:
          - 'errors[ERR_PAYMENT_ALREADY_REVERSED]'
          - state_machines.Payment.POSTED_to_REVERSED
        distinguishing_aspect: "Reversing a payment already REVERSED returns ERR_PAYMENT_ALREADY_REVERSED (409)."
        test_recipe:
          setup: ["A posted payment already reversed once."]
          setup_api_calls:
            - call: "POST /property-tax/tax-years"
