        distinguishing_aspect: "Settle while a delivered lot's source has only a PROVISIONAL alpha -> ERR_FINAL_TEST_REQUIRED; the allocation stays DELIVERED."
        test_recipe:
          setup: ["pellet 736 from lot with PROVISIONAL 12.0 only; contract vol 736; allocation confirmed and delivered"]
          setup_api_calls:
