            - { call: "POST /appointments", payload: { site_id: "${site_id}", taxpayer_id: "${tp1}", volunteer_id: "${prep_id}", purpose: INTAKE, start_at: "2026-08-03T10:00:00Z", end_at: "2026-08-03T11:00:00Z" }, as: Screener, as_user_id: "${scr_id}", captures: { appt1: $.data.id } }
