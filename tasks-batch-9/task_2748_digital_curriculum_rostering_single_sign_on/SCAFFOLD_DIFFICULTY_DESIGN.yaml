# =============================================================================
# 1.8 Scaffold Difficulty Design — digital-curriculum-rostering-sso (task 2748)
#
# Nine §0.5 reasoning rules x 2 instances = 18 instances.
# Every literal below was computed against SCAFFOLD.yaml's §1.3 formulas and
# their `constants:` blocks. Logical clock starts at 2026-08-01T00:00:00Z.
#
# Shared literal district used by the fixtures (each instance builds its own
# from an empty DB):
#   Term      Fall 2026 / school_year 2026 / 2026-08-10 .. 2026-12-18
#             add_drop_cutoff_date 2026-09-15 / instructional_days 85
#             archive_retention_days 90   -> total_days = 131
#   Operators ro-001 (RosterOperator), dgo-001 (DataGovernanceOfficer),
#             vim-001 (VendorIntegrationManager), ia-001 (IdentityAdmin)
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 — dual_variant_calc (two different entity domains: SyncRun charge
  #          figures vs VendorApp renewal scoring)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: seat_charge_provisional_vs_final_on_sync_run
        grounds:
          - calculations.sync_seat_charge
          - state_machines.SyncRun.EXTRACTED_to_TRANSFORMED
          - state_machines.SyncRun.TRANSFORMED_to_PUBLISHED
          - entities.SyncRun.fields.projected_charge_cents
          - entities.SyncRun.fields.published_charge_cents
          - entities.Enrollment.fields.requested_effective_date
          - entities.Enrollment.fields.effective_date
        distinguishing_aspect: "Both variants read the SAME three enrollments, but PROVISIONAL_TRANSFORM prices them off Enrollment.requested_effective_date (2026-09-01, on or before the add/drop cutoff, so full price 1000 each = 3000) while FINAL_PUBLISH prices them off the Enrollment.effective_date stamped at publish (2026-10-01, after the cutoff, so prorated ceil(1000*79/131) = 604 each = 1812) — a -1188 cent reconciliation delta on the SyncRun entity domain."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one ACTIVE ELEMENTARY building; Term Fall 2026 ACTIVE with start 2026-08-10, end 2026-12-18, add_drop_cutoff_date 2026-09-15 (total_days = 131)."
            - "One ACTIVE teacher who is primary_teacher_id of the single section, so triage raises no UNMATCHED_TEACHER item and the run transforms cleanly."
            - "Three ENROLLED students with distinct last_name/date_of_birth pairs (no DUPLICATE_STUDENT key collision), each with a PENDING_ADD enrollment whose requested_effective_date is 2026-09-01 — in the future relative to the clock, so no same-request auto-activation fires."
            - "An ACTIVE PER_STUDENT licence with total_seats 10, price_per_seat_cents 1000, PROPORTIONAL_HEADCOUNT allocation and no AppAccount rows at all, so VendorApp.committed_charge_cents stays 0 throughout."
            - "A FULL SyncRun that has already been transformed (state TRANSFORMED, projected figures written), after which the clock is advanced to 2026-10-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /rostering/schools"
              payload: { name: "Northside Elementary", sis_school_id: "SCH-NE", building_code: "NE", grade_band: "ELEMENTARY" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { sch_ne_id: $.data.id }
            - call: "POST /rostering/terms"
              payload: { name: "Fall 2026", school_year: 2026, start_date: "2026-08-10", end_date: "2026-12-18", add_drop_cutoff_date: "2026-09-15", instructional_days: 85, archive_retention_days: 90 }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { term_id: $.data.id }
            - call: "POST /rostering/terms/${term_id}/activate"
              payload: {}
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /rostering/teachers"
              payload: { school_id: "${sch_ne_id}", sis_staff_id: "STF-1001", full_name: "Dana Reed", email: "dana.reed@district.k12" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { t_a_id: $.data.id }
            - call: "POST /rostering/students"
              payload: { school_id: "${sch_ne_id}", sis_student_id: "STU-2001", first_name: "Alex", last_name: "Nakamura", grade_level: 4, date_of_birth: "2016-05-04" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { s1_id: $.data.id }
            - call: "POST /rostering/students"
              payload: { school_id: "${sch_ne_id}", sis_student_id: "STU-2002", first_name: "Priya", last_name: "Rao", grade_level: 4, date_of_birth: "2016-07-11" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { s2_id: $.data.id }
            - call: "POST /rostering/students"
              payload: { school_id: "${sch_ne_id}", sis_student_id: "STU-2003", first_name: "Liam", last_name: "Osei", grade_level: 4, date_of_birth: "2016-09-23" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { s3_id: $.data.id }
            - call: "POST /rostering/sections"
              payload: { school_id: "${sch_ne_id}", term_id: "${term_id}", primary_teacher_id: "${t_a_id}", sis_section_id: "SEC-3001", course_code: "MATH4", subject: "MATH", period_index: 3, meeting_days: ["MON", "WED", "FRI"], max_seats: 5 }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { sec_id: $.data.id }
            - call: "POST /rostering/enrollments"
              payload: { section_id: "${sec_id}", student_id: "${s1_id}", requested_effective_date: "2026-09-01", source: "SIS_EXTRACT" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { e1_id: $.data.id }
            - call: "POST /rostering/enrollments"
              payload: { section_id: "${sec_id}", student_id: "${s2_id}", requested_effective_date: "2026-09-01", source: "SIS_EXTRACT" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { e2_id: $.data.id }
            - call: "POST /rostering/enrollments"
              payload: { section_id: "${sec_id}", student_id: "${s3_id}", requested_effective_date: "2026-09-01", source: "SIS_EXTRACT" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { e3_id: $.data.id }
            - call: "POST /rostering/vendor-apps"
              payload: { name: "MathBlast", vendor_code: "MBX", term_id: "${term_id}", rostering_standard: "ONEROSTER_REST_1P2", identifier_strategy: "SIS_ID", username_domain: "apps.district.k12", name_format: "LAST_FIRST", grade_band_scope: ["ELEMENTARY"], seat_model: "PER_STUDENT", allocation_policy: "PROPORTIONAL_HEADCOUNT", overage_policy: "POOL_FALLBACK", unmatched_teacher_policy: "HOLD_RUN", total_seats: 10, price_per_seat_cents: 1000 }
              as: VendorIntegrationManager
              as_user_id: "vim-001"
              captures: { va_id: $.data.id }
            - call: "POST /rostering/vendor-apps/${va_id}/activate-license"
              payload: {}
              as: DataGovernanceOfficer
              as_user_id: "dgo-001"
            - call: "POST /rostering/sync-runs"
              payload: { vendor_app_id: "${va_id}", run_type: "FULL" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { run_id: $.data.id }
            - call: "POST /rostering/sync-runs/${run_id}/transform"
              payload: {}
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { projected: $.data.projected_charge_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-10-01T00:00:00Z" }
              as: RosterOperator
              as_user_id: "ro-001"
          trigger:
            - call: "POST /rostering/sync-runs/${run_id}/publish"
              payload: {}
              as: DataGovernanceOfficer
              as_user_id: "dgo-001"
          assert:
            - "SyncRun.${run_id}.projected_charge_cents == 3000"
            - "SyncRun.${run_id}.projected_seat_delta == 3"
            - "SyncRun.${run_id}.published_charge_cents == 1812"
            - "SyncRun.${run_id}.published_seat_delta == 3"
            - "SyncRun.${run_id}.published_charge_cents - SyncRun.${run_id}.projected_charge_cents == -1188"
            - "SyncRun.${run_id}.state == PUBLISHED"
            - "Enrollment.${e1_id}.roster_status == ACTIVE and Enrollment.${e1_id}.effective_date == 2026-10-01"
            - "Enrollment.${e1_id}.requested_effective_date == 2026-09-01 (unchanged by publish)"
            - "Enrollment.${e1_id}.add_drop_class == IN_WINDOW (classified at creation against 2026-09-15, NOT re-derived from effective_date)"
            - "VendorApp.${va_id}.committed_charge_cents == 0 — no SyncRun charge figure is ever posted into the licence ledger"

      - name: renewal_score_final_vs_provisional_on_vendor_app
        grounds:
          - calculations.renewal_recommendation_score
          - entities.VendorApp.fields.renewal_score
          - entities.VendorApp.fields.renewal_recommendation
          - entities.AppAccount.fields.identity_status
          - entities.AppAccount.fields.last_activity_date
          - "endpoints[GET /rostering/vendor-apps/{vendor_app_id}/renewal-summary]"
        distinguishing_aspect: "On the VendorApp entity domain (not SyncRun), FINAL_RENEWAL and PROVISIONAL_MID_YEAR read identical stored rows and disagree on BOTH the score and the categorical recommendation: recency_ok kills all engagement in FINAL (40.00 -> RENEGOTIATE) while PROVISIONAL counts lifetime minutes against the `provisioned` denominator instead of `consumed` (75.00 -> RENEW)."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one ACTIVE ELEMENTARY building; Term Fall 2026 ACTIVE."
            - "Four ENROLLED students and an ACTIVE PER_STUDENT licence with total_seats 5, price_per_seat_cents 1000, SIS_ID identifiers, PROPORTIONAL_HEADCOUNT (H = 4 so the single building receives all 5 seats and unallocated_seats is 0)."
            - "Four AppAccounts provisioned while the clock is on or before the add/drop cutoff, so each seat_charge_cents is the full 1000 and VendorApp.committed_charge_cents is exactly 4000."
            - "Exactly three of the four accounts have had a password set (identity_status PROVISIONED); the fourth stays PENDING_PROVISION but still holds its RESERVED seat, so consumed = 4 while provisioned = 3."
            - "Exactly two of the PROVISIONED accounts have posted 120 usage minutes on 2026-08-01; the clock is then advanced to 2026-09-10T00:00:00Z, which is 40 days later and therefore outside the 30-day USAGE_WINDOW_DAYS."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: IdentityAdmin
              as_user_id: "ia-001"
            - call: "POST /rostering/schools"
              payload: { name: "Northside Elementary", sis_school_id: "SCH-NE", building_code: "NE", grade_band: "ELEMENTARY", min_password_length: 8, password_requires_mixed_case: true, password_max_age_days: 180, password_lockout_threshold: 5, temp_password_ttl_hours: 72 }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { sch_ne_id: $.data.id }
            - call: "POST /rostering/terms"
              payload: { name: "Fall 2026", school_year: 2026, start_date: "2026-08-10", end_date: "2026-12-18", add_drop_cutoff_date: "2026-09-15", instructional_days: 85, archive_retention_days: 90 }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { term_id: $.data.id }
            - call: "POST /rostering/terms/${term_id}/activate"
              payload: {}
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /rostering/students"
              payload: { school_id: "${sch_ne_id}", sis_student_id: "STU-2001", first_name: "Alex", last_name: "Nakamura", grade_level: 4, date_of_birth: "2016-05-04" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { s1_id: $.data.id }
            - call: "POST /rostering/students"
              payload: { school_id: "${sch_ne_id}", sis_student_id: "STU-2002", first_name: "Priya", last_name: "Rao", grade_level: 4, date_of_birth: "2016-07-11" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { s2_id: $.data.id }
            - call: "POST /rostering/students"
              payload: { school_id: "${sch_ne_id}", sis_student_id: "STU-2003", first_name: "Liam", last_name: "Osei", grade_level: 4, date_of_birth: "2016-09-23" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { s3_id: $.data.id }
            - call: "POST /rostering/students"
              payload: { school_id: "${sch_ne_id}", sis_student_id: "STU-2004", first_name: "Nora", last_name: "Iqbal", grade_level: 4, date_of_birth: "2016-11-02" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { s4_id: $.data.id }
            - call: "POST /rostering/vendor-apps"
              payload: { name: "MathBlast", vendor_code: "MBX", term_id: "${term_id}", rostering_standard: "ONEROSTER_REST_1P2", identifier_strategy: "SIS_ID", username_domain: "apps.district.k12", grade_band_scope: ["ELEMENTARY"], seat_model: "PER_STUDENT", allocation_policy: "PROPORTIONAL_HEADCOUNT", overage_policy: "BLOCK", total_seats: 5, price_per_seat_cents: 1000 }
              as: VendorIntegrationManager
              as_user_id: "vim-001"
              captures: { va_id: $.data.id }
            - call: "POST /rostering/vendor-apps/${va_id}/activate-license"
              payload: {}
              as: DataGovernanceOfficer
              as_user_id: "dgo-001"
            - call: "GET /rostering/building-allocations"
              payload: { vendor_app_id: "${va_id}", school_id: "${sch_ne_id}" }
              as: IdentityAdmin
              as_user_id: "ia-001"
              captures: { alloc_id: "$.data[0].id" }
            - call: "GET /rostering/vendor-apps/${va_id}"
              payload: {}
              as: IdentityAdmin
              as_user_id: "ia-001"
              captures: { va_v1: $.data.version }
            - call: "POST /rostering/app-accounts"
              payload: { building_allocation_id: "${alloc_id}", subject_type: "STUDENT", student_id: "${s1_id}", expected_vendor_app_version: "${va_v1}" }
              as: IdentityAdmin
              as_user_id: "ia-001"
              captures: { a1_id: $.data.id }
            - call: "GET /rostering/vendor-apps/${va_id}"
              payload: {}
              as: IdentityAdmin
              as_user_id: "ia-001"
              captures: { va_v2: $.data.version }
            - call: "POST /rostering/app-accounts"
              payload: { building_allocation_id: "${alloc_id}", subject_type: "STUDENT", student_id: "${s2_id}", expected_vendor_app_version: "${va_v2}" }
              as: IdentityAdmin
              as_user_id: "ia-001"
              captures: { a2_id: $.data.id }
            - call: "GET /rostering/vendor-apps/${va_id}"
              payload: {}
              as: IdentityAdmin
              as_user_id: "ia-001"
              captures: { va_v3: $.data.version }
            - call: "POST /rostering/app-accounts"
              payload: { building_allocation_id: "${alloc_id}", subject_type: "STUDENT", student_id: "${s3_id}", expected_vendor_app_version: "${va_v3}" }
              as: IdentityAdmin
              as_user_id: "ia-001"
              captures: { a3_id: $.data.id }
            - call: "GET /rostering/vendor-apps/${va_id}"
              payload: {}
              as: IdentityAdmin
              as_user_id: "ia-001"
              captures: { va_v4: $.data.version }
            - call: "POST /rostering/app-accounts"
              payload: { building_allocation_id: "${alloc_id}", subject_type: "STUDENT", student_id: "${s4_id}", expected_vendor_app_version: "${va_v4}" }
              as: IdentityAdmin
              as_user_id: "ia-001"
              captures: { a4_id: $.data.id }
            - call: "POST /rostering/app-accounts/${a1_id}/password-set"
              payload: { new_password: "Rostering2026" }
              as: IdentityAdmin
              as_user_id: "ia-001"
            - call: "POST /rostering/app-accounts/${a2_id}/password-set"
              payload: { new_password: "Rostering2026" }
              as: IdentityAdmin
              as_user_id: "ia-001"
            - call: "POST /rostering/app-accounts/${a3_id}/password-set"
              payload: { new_password: "Rostering2026" }
              as: IdentityAdmin
              as_user_id: "ia-001"
            - call: "POST /rostering/app-accounts/${a1_id}/record-usage"
              payload: { activity_date: "2026-08-01", active_minutes: 120, session_count: 4, failed_logins: 0 }
              as: IdentityAdmin
              as_user_id: "ia-001"
            - call: "POST /rostering/app-accounts/${a2_id}/record-usage"
              payload: { activity_date: "2026-08-01", active_minutes: 120, session_count: 4, failed_logins: 0 }
              as: IdentityAdmin
              as_user_id: "ia-001"
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-09-10T00:00:00Z" }
              as: IdentityAdmin
              as_user_id: "ia-001"
          trigger:
            - call: "GET /rostering/vendor-apps/${va_id}/renewal-summary"
              payload: {}
              as: DataGovernanceOfficer
              as_user_id: "dgo-001"
              captures: { final_score: $.data.renewal_score, final_reco: $.data.renewal_recommendation }
            - call: "GET /rostering/vendor-apps/${va_id}/renewal-summary"
              payload: { basis: "provisional" }
              as: DataGovernanceOfficer
              as_user_id: "dgo-001"
              captures: { prov_score: $.data.renewal_score, prov_reco: $.data.renewal_recommendation }
          assert:
            - "VendorApp.${va_id}.committed_charge_cents == 4000"
            - "first response: basis == final, consumed_seats == 4, provisioned_seats == 3, engaged_seats == 0"
            - "first response: renewal_score == 40.00 and renewal_recommendation == RENEGOTIATE"
            - "first response: cost_per_engaged_cents == null and cost_efficiency == 0"
            - "second response: basis == provisional, consumed_seats == 4, provisioned_seats == 3, engaged_seats == 2"
            - "second response: cost_per_engaged_cents == 2000, cost_efficiency == 0.75"
            - "second response: renewal_score == 75.00 and renewal_recommendation == RENEW"
            - "both responses: invoice_total_cents == 29000 (gross 4000 -> tier 0.00, net 4000, platform_fee_cents 25000 from FEE_FLOOR_CENTS, shelfware_credit_cents 0) — the invoice is basis-independent"
            - "AppAccount.${a4_id}.identity_status == PENDING_PROVISION and AppAccount.${a4_id}.seat_status == RESERVED"

  # ===========================================================================
  # RULE 2 — combinatorial_formula
  #   2a is MODE (b): nested rounding where the order matters (floor-then-
  #        distribute-remainder vs round-then-sum).
  #   2b is MODE (c): circular-looking dependency (invoice_total = net + fee
  #        - credit, where the fee is keyed off a discount tier of the gross)
  #        resolved by a pinned 7-step evaluation order.
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: building_seat_allocation_remainder_rounding_order
        grounds:
          - calculations.building_seat_allocation
          - state_machines.VendorApp.DRAFT_to_ACTIVE
          - entities.BuildingAllocation.fields.allocated_seats
          - entities.BuildingAllocation.fields.eligible_headcount_snapshot
          - entities.VendorApp.fields.unallocated_seats
          - entities.School.fields.enrolled_student_count
        distinguishing_aspect: "Mode (b): seven seats over three equal 2-student buildings gives the exact rational 2.3333 per building, and the scaffold's PINNED order (floor every share first, then hand the single leftover seat to the top of the recipients ranking) yields {3, 2, 2} = 7, whereas rounding each share to the nearest integer and summing yields {2, 2, 2} = 6 and strands one licensed seat — the two orders differ on the identical inputs."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; Term Fall 2026 created (activation is not required for licence allocation)."
            - "Three ACTIVE ELEMENTARY buildings created in the order A, B, C, each holding exactly two ENROLLED students, so enrolled_student_count is 2 / 2 / 2 and H = 6."
            - "A DRAFT PROPORTIONAL_HEADCOUNT licence scoped to ELEMENTARY with total_seats 7 and overage_policy BLOCK, registered by vim-001 and not yet activated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /rostering/schools"
              payload: { name: "Alpha Elementary", sis_school_id: "SCH-A", building_code: "AAA", grade_band: "ELEMENTARY" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { sch_a_id: $.data.id }
            - call: "POST /rostering/schools"
              payload: { name: "Bravo Elementary", sis_school_id: "SCH-B", building_code: "BBB", grade_band: "ELEMENTARY" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { sch_b_id: $.data.id }
            - call: "POST /rostering/schools"
              payload: { name: "Charlie Elementary", sis_school_id: "SCH-C", building_code: "CCC", grade_band: "ELEMENTARY" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { sch_c_id: $.data.id }
            - call: "POST /rostering/terms"
              payload: { name: "Fall 2026", school_year: 2026, start_date: "2026-08-10", end_date: "2026-12-18", add_drop_cutoff_date: "2026-09-15", instructional_days: 85, archive_retention_days: 90 }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { term_id: $.data.id }
            - call: "POST /rostering/students"
              payload: { school_id: "${sch_a_id}", sis_student_id: "STU-A1", first_name: "Ada", last_name: "Ahmed", grade_level: 3, date_of_birth: "2017-01-05" }
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /rostering/students"
              payload: { school_id: "${sch_a_id}", sis_student_id: "STU-A2", first_name: "Abel", last_name: "Arnesen", grade_level: 3, date_of_birth: "2017-02-06" }
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /rostering/students"
              payload: { school_id: "${sch_b_id}", sis_student_id: "STU-B1", first_name: "Bea", last_name: "Barros", grade_level: 3, date_of_birth: "2017-03-07" }
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /rostering/students"
              payload: { school_id: "${sch_b_id}", sis_student_id: "STU-B2", first_name: "Ben", last_name: "Bianchi", grade_level: 3, date_of_birth: "2017-04-08" }
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /rostering/students"
              payload: { school_id: "${sch_c_id}", sis_student_id: "STU-C1", first_name: "Cleo", last_name: "Costa", grade_level: 3, date_of_birth: "2017-05-09" }
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /rostering/students"
              payload: { school_id: "${sch_c_id}", sis_student_id: "STU-C2", first_name: "Cai", last_name: "Chen", grade_level: 3, date_of_birth: "2017-06-10" }
              as: RosterOperator
