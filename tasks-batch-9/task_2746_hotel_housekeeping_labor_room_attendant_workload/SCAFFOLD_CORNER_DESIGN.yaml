            - call: "POST /housekeeping/forecast-days"
              payload: { property_id: "${prop_id}", business_date: "2026-08-03", forecast_occupied_rooms: 2, forecast_arrivals: 0, forecast_departures: 2, planned_deep_clean_rooms: 0 }
              as: HousekeepingDirector
              captures: { fd_id: $.data.id }
            - call: "POST /housekeeping/forecast-days/${fd_id}/publish"
              payload: {}
              as: HousekeepingDirector
            - call: "POST /housekeeping/shift-rosters"
              payload: { forecast_day_id: "${fd_id}", attendant_id: "${ra1_id}", planned_start_at: "2026-08-03T08:00:00.000Z" }
              as: HousekeepingDirector
              captures: { roster_id: $.data.id, r_v1: $.data.version }
