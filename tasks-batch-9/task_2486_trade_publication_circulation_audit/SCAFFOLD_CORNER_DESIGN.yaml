            - "CirculationStatement.${st_id}.status == RESTATEMENT_REQUIRED — 2.00 >= materiality_pct 2.00 is material"
            - "Publication.${pub_id}.audit_posture == FROZEN"
            - "had the verification recorded 1190 copies the discrepancy would be 10 / 1200 == 0.83 percent and the statement would have reached AUDIT_CLEARED instead"

      - name: critical_finding_freezes_posture_over_the_restricted_clause
