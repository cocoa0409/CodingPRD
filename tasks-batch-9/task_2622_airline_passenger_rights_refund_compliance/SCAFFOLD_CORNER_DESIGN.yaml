  # ==========================================================================
  # 4. VALIDATIONS  (claim-extraction-guide "From Table 4 (Validations)")
  # ==========================================================================
  - section: validations
    instances:

      - name: duplicate_key_violations_return_their_specific_error_codes
        claim_type: violation_to_error
        grounds: ["validations[priority 67]", "errors.ERR_DUPLICATE_CARRIER_CODE", "errors.ERR_DUPLICATE_PASSENGER_EMAIL", "errors.ERR_DUPLICATE_RECORD_LOCATOR", "errors.ERR_DUPLICATE_TAG_NUMBER", "errors.ERR_DUPLICATE_SEQUENCE_INDEX"]
        distinguishing_aspect: "All five uniqueness scopes return distinct 409 codes, and sequence_index is unique only WITHIN a booking while the other four are global — the same value reused under a different booking would be accepted."
        test_recipe:
          setup: ["One PolicyProfile ZQ, one Passenger pat@example.com, one Booking ABC123 with segment sequence_index 1 and bag BAG0000001."]
          setup_api_calls:
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { pol_id: "$.data.id" }
            - call: "POST /compliance/passengers"
              payload: { email: "pat@example.com", full_name: "Pat Rivera" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { pax_id: "$.data.id" }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "ABC123", total_fare_cents: 50000, payment_method: "CREDIT_CARD" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { bk_id: "$.data.id" }
            - call: "POST /compliance/bookings/${bk_id}/flight-segments"
              payload: { sequence_index: 1, flight_number: "ZQ410", origin_iata: "ORD", destination_iata: "DFW", is_international: false, scheduled_departure_utc: "2026-08-10T12:00:00Z", scheduled_arrival_utc: "2026-08-10T14:00:00Z", segment_fare_cents: 50000 }
              as: OpsController
              as_user_id: "ops_1"
              captures: { seg1_id: "$.data.id" }
            - call: "POST /compliance/checked-bags"
              payload: { booking_id: "${bk_id}", tag_number: "BAG0000001", fee_cents: 4500, checked_at_utc: "2026-08-10T13:00:00Z", scheduled_delivery_utc: "2026-08-10T21:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { bag_id: "$.data.id" }
          trigger:
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { err1: "$.data.error_id" }
            - call: "POST /compliance/passengers"
