      - name: classify_mints_a_notice_only_on_the_disclosure_required_branch
        claim_type: conditional_cascade
        grounds:
          - state_machines[DirectPlacement].RECEIVED->DISCLOSURE_REQUIRED
          - state_machines[DirectPlacement].RECEIVED->DISCLOSURE_WAIVED
          - calculations.direct_placement_materiality_ratio
          - endpoints.POST_/disclosure/direct-placements/{id}/classify
        distinguishing_aspect: >-
          One trigger, two disjoint cascades chosen by the 500-bp materiality boundary: the
          required branch mints a FINANCIAL_OBLIGATION_INCURRENCE notice back-dated to the
          placement's execution_date and bumps the issue's open_material_event_count, while the
          waived branch must leave linked_notice_id null and create nothing at all. Testing only
          the required branch would let an implementation mint a notice unconditionally.
        test_recipe:
          setup:
            - "One OUTSTANDING BondIssue with outstanding par 100000000 and an ACTIVE Undertaking."
            - "Placement A: principal 5000000 (exactly 500 bp of par) with practice VOLUNTARY, review window 2026-08-01..2026-08-10."
            - "Placement B: principal 3000000 (300 bp) with practice VOLUNTARY, review window 2026-08-15..2026-08-25 — disjoint from A so the aggregate review-capacity rule never engages."
          setup_api_calls:
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "CIVICCENTER", series_designation: "2026A", security_type: "REVENUE", dated_date: "2026-04-01", final_maturity_date: "2056-04-01", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_id: "$.data.id" }
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue_id}", fiscal_year_end_month_day: "06-30" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { und_id: "$.data.id" }
            - call: "POST /disclosure/direct-placements"
              payload: { issue_id: "${issue_id}", lender_name: "Harbor Trust Bank", principal_amount_cents: 5000000, execution_date: "2026-07-28", review_window_start_date: "2026-08-01", review_window_end_date: "2026-08-10", disclosure_practice: "VOLUNTARY" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { placeA_id: "$.data.id", ratioA: "$.data.materiality_ratio_bp", statusA0: "$.data.status", linkA0: "$.data.linked_notice_id" }
            - call: "POST /disclosure/direct-placements"
              payload: { issue_id: "${issue_id}", lender_name: "Cornerstone Savings", principal_amount_cents: 3000000, execution_date: "2026-07-28", review_window_start_date: "2026-08-15", review_window_end_date: "2026-08-25", disclosure_practice: "VOLUNTARY" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { placeB_id: "$.data.id", ratioB: "$.data.materiality_ratio_bp" }
          trigger:
            - call: "POST /disclosure/direct-placements/${placeA_id}/classify"
              payload: {}
              as: ComplianceReviewer
              as_user_id: "rev-1"
              captures: { statusA: "$.data.status", linkA: "$.data.linked_notice_id" }
            - call: "GET /disclosure/material-event-notices?issue_id=${issue_id}&financial_obligation_ref=${placeA_id}"
              payload: {}
              as: ComplianceReviewer
              as_user_id: "rev-1"
              captures: { nA_total: "$.total_count", nA_id: "$.data[0].id", nA_type: "$.data[0].event_type", nA_status: "$.data[0].status", nA_perse: "$.data[0].per_se_material", nA_occ: "$.data[0].occurrence_date", nA_deadline: "$.data[0].filing_deadline_date" }
            - call: "POST /disclosure/direct-placements/${placeB_id}/classify"
              payload: {}
              as: ComplianceReviewer
              as_user_id: "rev-1"
              captures: { e_no_reason: "$.data.error_id" }
            - call: "POST /disclosure/direct-placements/${placeB_id}/classify"
              payload: { waiver_reason: "300 bp of par; no covenant differing from the public bonds." }
              as: ComplianceReviewer
              as_user_id: "rev-1"
              captures: { statusB: "$.data.status", linkB: "$.data.linked_notice_id", reasonB: "$.data.waiver_reason" }
            - call: "GET /disclosure/material-event-notices?issue_id=${issue_id}&financial_obligation_ref=${placeB_id}"
              payload: {}
              as: ComplianceReviewer
              as_user_id: "rev-1"
              captures: { nB_total: "$.total_count" }
            - call: "GET /disclosure/bond-issues/${issue_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { open_events: "$.data.open_material_event_count" }
            - call: "GET /disclosure/undertakings/${und_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { open_oblig: "$.data.open_obligation_count" }
          assert:
            - "${ratioA} == 500 and ${ratioB} == 300 — both frozen at creation from principal / outstanding par"
            - "${statusA0} == RECEIVED with ${linkA0} == null before classification"
            - "${statusA} == DISCLOSURE_REQUIRED — 500 bp meets the >= 500 threshold exactly"
            - "${nA_total} == 1 with ${nA_id} == \"${linkA}\", ${nA_type} == FINANCIAL_OBLIGATION_INCURRENCE, ${nA_status} == DETERMINATION_PENDING, ${nA_perse} == false"
            - "${nA_occ} == \"2026-07-28\" (the execution_date, NOT the classification date) and ${nA_deadline} == \"2026-08-11\""
            - "${e_no_reason} == ERR_WAIVER_REASON_REQUIRED (422) — the waived branch is the only one that demands a reason"
            - "${statusB} == DISCLOSURE_WAIVED with ${linkB} == null, ${reasonB} recorded, and ${nB_total} == 0 — no notice was minted"
            - "${open_events} == 1 and ${open_oblig} == 1 — only branch A consumed an obligation slot"

      - name: confirmation_syncs_the_engagement_billable_ledger
        claim_type: ledger_sync
        grounds:
          - state_machines[Filing].SUBMITTED->CONFIRMED
          - state_machines[Filing].SUBMITTED->REJECTED
          - calculations.dissemination_agent_invoice
        distinguishing_aspect: >-
          billable_filing_count counts filings whose status is exactly CONFIRMED, so a SUBMITTED
          filing bills nothing and a REJECTED one never becomes billable — only the confirmation
          moves the ledger, and it moves invoice_total_cents with it. Before/after values must
          reconcile across the whole submit -> reject -> resubmit -> confirm loop rather than
          being counted per submission attempt.
        test_recipe:
          setup:
            - "The resubmit instance's setup: an assembled FY2026 cycle in READY_TO_FILE, an ACTIVE engagement with retainer 400000, and one DRAFT ANNUAL_REPORT filing. Posture is COMPLIANT so no surcharge applies."
            - "TIER1_RATE_CENTS is 45000 for each of the first four confirmed filings, and MIN_ANNUAL_FEE_CENTS 300000 does not bind at a 400000 retainer."
