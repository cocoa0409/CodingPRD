            - call: "POST /fuel-redemptions/${r4a_id}/complete"
              payload: { gallons_dispensed: 250.000 }
              as: PumpTerminal
              as_user_id: "${p1_id}"
            - call: "GET /members/${m4_id}"
              payload: {}
              as: PumpTerminal
              as_user_id: "${p1_id}"
              captures: { mv4b: $.data.version }
            - call: "POST /fuel-redemptions"
              payload: { member_id: "${m4_id}", site_id: "${p1_id}", alt_id_presented: "5550000004", points_committed: 300, expected_member_version: "${mv4b}" }
              as: PumpTerminal
              as_user_id: "${p1_id}"
              captures: { r4b_id: $.data.id }
            - call: "POST /fuel-redemptions/${r4b_id}/complete"
              payload: { gallons_dispensed: 250.000 }
              as: PumpTerminal
              as_user_id: "${p1_id}"
            - call: "GET /sites/${p1_id}"
