            - call: "POST /api/plans"
              payload: { name: "Plan CT", effective_date: "2026-01-01", distribution_events_allowed: ["CHANGE_IN_CONTROL"], officer_comp_threshold_cents: 20000000 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /api/plans/${plan_id}/activate"
              as: PlanSponsor
            - call: "POST /api/change-in-control-events"
              payload: { plan_id: "${plan_id}", event_type: "OWNERSHIP_CHANGE", effective_date: "2027-02-01", stake_change_bp: 4999 }
              as: PlanSponsor
              captures: { cic1_id: $.data.id }
            - call: "POST /api/change-in-control-events"
              payload: { plan_id: "${plan_id}", event_type: "OWNERSHIP_CHANGE", effective_date: "2027-02-01", stake_change_bp: 5000 }
              as: PlanSponsor
              captures: { cic2_id: $.data.id }
          trigger:
            - call: "POST /api/change-in-control-events/${cic1_id}/adjudicate"
              payload: { outcome: "VERIFIED" }
              as: ComplianceOfficer
              captures: { low_err: $.data.error_id }
            - call: "POST /api/change-in-control-events/${cic2_id}/adjudicate"
              payload: { outcome: "VERIFIED" }
              as: ComplianceOfficer
              captures: { ok_status: $.data.status }
          assert:
            - "${low_err} == ERR_CIC_THRESHOLD_NOT_MET (4999 < 5000)"
            - "ChangeInControlEvent.${cic1_id}.status == REPORTED (unchanged)"
            - "${ok_status} == VERIFIED (5000 >= 5000, inclusive)"
      - name: date_shape_validation_sweep
        claim_type: violation_to_error
        grounds: ["validations[priority=8.3]", "errors[ERR_INVALID_WINDOW_DATES]", "errors[ERR_INVALID_EFFECTIVE_DATE]", "errors[ERR_CLOCK_REGRESSION]"]
        distinguishing_aspect: "Three date-shape rules: (1) window general_close_date outside calendar year plan_year-1 fails ERR_INVALID_WINDOW_DATES; (2) performance period under 365 days fails ERR_INVALID_WINDOW_DATES; (3) a specified-list effective_date equal to identification_date fails ERR_INVALID_EFFECTIVE_DATE; (4) moving the logical clock backwards fails ERR_CLOCK_REGRESSION."
        test_recipe:
          setup: ["ACTIVE plan; version tracked for OCC-guarded creates"]
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { name: "Plan DS", effective_date: "2026-01-01", distribution_events_allowed: ["SEPARATION"], officer_comp_threshold_cents: 20000000 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /api/plans/${plan_id}/activate"
              as: PlanSponsor
              captures: { plan_v: $.data.version }
          trigger:
            - call: "POST /api/election-windows"
              payload: { plan_id: "${plan_id}", plan_year: 2027, general_open_date: "2026-10-01", general_close_date: "2027-01-15", expected_plan_version: "${plan_v}" }
              as: PlanSponsor
              captures: { w_err: $.data.error_id }
            - call: "POST /api/election-windows"
              payload: { plan_id: "${plan_id}", plan_year: 2027, general_open_date: "2026-10-01", general_close_date: "2026-12-31", performance_period_start: "2027-01-01", performance_period_end: "2027-06-30", expected_plan_version: "${plan_v}" }
              as: PlanSponsor
              captures: { perf_err: $.data.error_id }
            - call: "POST /api/specified-employee-lists"
              payload: { plan_id: "${plan_id}", identification_date: "2026-12-31", effective_date: "2026-12-31", expected_plan_version: "${plan_v}" }
              as: ComplianceOfficer
              captures: { eff_err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { clk_err: $.data.error_id }
          assert:
            - "${w_err} == ERR_INVALID_WINDOW_DATES (close 2027-01-15 not in year 2026)"
            - "${perf_err} == ERR_INVALID_WINDOW_DATES (performance period 180 days < 365)"
            - "${eff_err} == ERR_INVALID_EFFECTIVE_DATE (must be strictly after identification_date)"
            - "${clk_err} == ERR_CLOCK_REGRESSION (2026-07-01 precedes the 2026-08-01 default)"

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: response_envelope_success_and_error_shape
        claim_type: response_envelope
        grounds: ["response_envelope"]
        distinguishing_aspect: "Every response wraps data in the fixed envelope: success carries meta.api_request_id, meta.api_request_timestamp, response_type='object'|'array', data; errors carry response_type='error' with data.error_id and data.message. List responses add limit/offset/total_count/has_more."
        test_recipe:
          setup: ["one plan exists"]
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { name: "Plan ENV", effective_date: "2026-01-01", distribution_events_allowed: ["SEPARATION"], officer_comp_threshold_cents: 20000000 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
          trigger:
            - call: "GET /api/plans/${plan_id}"
              as: PlanSponsor
            - call: "GET /api/plans"
              as: PlanSponsor
            - call: "GET /api/plans/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: PlanSponsor
              captures: { err: $.data.error_id }
          assert:
            - "single GET: meta.api_request_id non-empty, meta.api_request_timestamp ISO8601, response_type == 'object', data.id == ${plan_id}"
            - "list GET: response_type == 'array' with pagination fields limit/offset/total_count/has_more present"
            - "${err} == ERR_NOT_FOUND and the error body has response_type == 'error' with data.error_id and data.message keys"
      - name: elections_list_filter_by_participant
        claim_type: filter_semantics
        grounds: ["endpoints", "entities.DeferralElection"]
        distinguishing_aspect: "The filtered list returns only the rows whose participant_id matches the filter — P1's election appears under participant_id=${p1_id} and not under participant_id=${p2_id}; filtering by election_window_id returns both."
        test_recipe:
          setup: ["ACTIVE plan, fund, OPEN window 2027 (clock 2026-10-15); participants P1 and P2 each with one DRAFT election"]
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { name: "Plan LF", effective_date: "2026-01-01", distribution_events_allowed: ["SEPARATION"], officer_comp_threshold_cents: 20000000 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /api/plans/${plan_id}/activate"
              as: PlanSponsor
              captures: { plan_v: $.data.version }
            - call: "POST /api/notional-funds"
              payload: { plan_id: "${plan_id}", ticker: "FIX5", crediting_mode: "FIXED_RATE", annual_rate_bp: 500 }
              as: PlanSponsor
              captures: { fund_id: $.data.id }
            - call: "POST /api/election-windows"
              payload: { plan_id: "${plan_id}", plan_year: 2027, general_open_date: "2026-10-01", general_close_date: "2026-12-31", expected_plan_version: "${plan_v}" }
              as: PlanSponsor
              captures: { window_id: $.data.id }
            - call: "POST /api/participants"
              payload: { plan_id: "${plan_id}", employee_ref: "EMP-L1", hire_date: "2023-01-02", initial_eligibility_date: "2026-01-05", annual_compensation_cents: 30000000 }
              as: BenefitsAdministrator
              captures: { p1_id: $.data.id }
            - call: "POST /api/participants"
              payload: { plan_id: "${plan_id}", employee_ref: "EMP-L2", hire_date: "2023-01-02", initial_eligibility_date: "2026-01-05", annual_compensation_cents: 30000000 }
              as: BenefitsAdministrator
              captures: { p2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/deferral-elections"
              payload: { participant_id: "${p1_id}", election_window_id: "${window_id}", election_type: "GENERAL", deferral_percent_bp: 5000, notional_fund_id: "${fund_id}" }
              as: Participant
              as_user_id: "${p1_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /api/deferral-elections"
              payload: { participant_id: "${p2_id}", election_window_id: "${window_id}", election_type: "GENERAL", deferral_percent_bp: 2500, notional_fund_id: "${fund_id}" }
              as: Participant
              as_user_id: "${p2_id}"
              captures: { e2_id: $.data.id }
          trigger:
            - call: "GET /api/deferral-elections?participant_id=${p1_id}"
              as: BenefitsAdministrator
            - call: "GET /api/deferral-elections?election_window_id=${window_id}"
              as: BenefitsAdministrator
          assert:
            - "filter participant_id=${p1_id}: total_count == 1 and the only row id == ${e1_id}"
            - "filter election_window_id=${window_id}: total_count == 2 containing ${e1_id} and ${e2_id}"
            - "filter participant_id=${p2_id}: total_count == 1, row id == ${e2_id} (implied by p1 exclusivity)"

  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: workflow_state_guard_error_sweep
        claim_type: violation_to_error
        grounds: ["validations[priority=6.6]", "validations[priority=6.7]", "errors[ERR_DISTRIBUTION_STATE_INVALID]", "errors[ERR_CASE_STATE_INVALID]", "errors[ERR_FAILURE_STATE_INVALID]", "errors[ERR_FINDING_STATE_INVALID]", "errors[ERR_PLAN_STATE_INVALID]", "errors[ERR_PARTICIPANT_STATE_INVALID]"]
        distinguishing_aspect: "Six distinct workflow state guards each reject from the wrong state: schedule on REQUESTED, determine on OPEN (no evidence), assess on IDENTIFIED, finding adjudicate on REPORTED, plan resume on ACTIVE, participant rehire on ACTIVE."
        test_recipe:
          setup: ["ACTIVE plan; participant; account; an unverified distribution request; an OPEN separation case (no records); an IDENTIFIED failure; a REPORTED finding"]
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { name: "Plan WG", effective_date: "2026-01-01", distribution_events_allowed: ["FIXED_TIME", "SEPARATION"], officer_comp_threshold_cents: 20000000 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /api/plans/${plan_id}/activate"
              as: PlanSponsor
            - call: "POST /api/participants"
              payload: { plan_id: "${plan_id}", employee_ref: "EMP-WG", hire_date: "2023-01-02", initial_eligibility_date: "2026-01-05", annual_compensation_cents: 30000000 }
              as: BenefitsAdministrator
              captures: { participant_id: $.data.id }
            - call: "POST /api/accounts"
              payload: { participant_id: "${participant_id}", plan_id: "${plan_id}" }
              as: BenefitsAdministrator
              captures: { account_id: $.data.id }
            - call: "POST /api/distribution-requests"
              payload: { account_id: "${account_id}", event_type: "FIXED_TIME", fixed_date: "2027-06-01" }
              as: Participant
              as_user_id: "${participant_id}"
              captures: { req_id: $.data.id }
            - call: "POST /api/separation-cases"
              payload: { participant_id: "${participant_id}", alleged_separation_date: "2027-03-15", trigger_reason: "RESIGNATION" }
              as: BenefitsAdministrator
              as_user_id: "ba-1"
              captures: { case_id: $.data.id }
            - call: "POST /api/operational-failures"
              payload: { account_id: "${account_id}", failure_type: "EXCESS_DEFERRAL", failure_date: "2026-06-01", amount_cents: 5000 }
              as: BenefitsAdministrator
              as_user_id: "ba-1"
              captures: { failure_id: $.data.id }
            - call: "POST /api/document-findings"
              payload: { plan_id: "${plan_id}", description: "Missing delay language", failure_year: 2026 }
              as: ComplianceOfficer
              captures: { finding_id: $.data.id }
          trigger:
            - call: "POST /api/distribution-requests/${req_id}/schedule"
              as: BenefitsAdministrator
              captures: { e_sched: $.data.error_id }
            - call: "POST /api/separation-cases/${case_id}/determine"
              payload: { outcome: "CONFIRMED_SEPARATION" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { e_det: $.data.error_id }
            - call: "POST /api/operational-failures/${failure_id}/assess-inclusion"
              as: ComplianceOfficer
              as_user_id: "co-2"
              captures: { e_assess: $.data.error_id }
            - call: "POST /api/document-findings/${finding_id}/adjudicate"
              payload: { outcome: "CORRECTED" }
              as: PlanSponsor
              captures: { e_adj: $.data.error_id }
            - call: "POST /api/plans/${plan_id}/resume"
              as: PlanSponsor
              captures: { e_resume: $.data.error_id }
            - call: "POST /api/participants/${participant_id}/rehire"
              as: BenefitsAdministrator
              captures: { e_rehire: $.data.error_id }
          assert:
            - "${e_sched} == ERR_DISTRIBUTION_STATE_INVALID (schedule requires EVENT_VERIFIED)"
            - "${e_det} == ERR_CASE_STATE_INVALID (determine requires evidence submitted)"
            - "${e_assess} == ERR_FAILURE_STATE_INVALID (assess requires QUANTIFIED)"
            - "${e_adj} == ERR_FINDING_STATE_INVALID (adjudicate requires CORRECTION_FILED)"
            - "${e_resume} == ERR_PLAN_STATE_INVALID (resume requires SUSPENDED)"
            - "${e_rehire} == ERR_PARTICIPANT_STATE_INVALID (rehire requires SEPARATED; participant is SEPARATION_REVIEW)"
      - name: uniqueness_constraint_error_sweep
        claim_type: violation_to_error
        grounds: ["validations[priority=9.1]", "errors[ERR_DUPLICATE_ELECTION]", "errors[ERR_OPEN_CASE_EXISTS]", "errors[ERR_TRUST_EXISTS]", "errors[ERR_DRAFT_LIST_EXISTS]", "errors[ERR_DUPLICATE_MEMBER]"]
        distinguishing_aspect: "Five uniqueness constraints fire independently: duplicate election on (participant, window); second open separation case per participant; second rabbi trust per plan; second DRAFT specified-employee list per plan; duplicate member row in a list."
        test_recipe:
