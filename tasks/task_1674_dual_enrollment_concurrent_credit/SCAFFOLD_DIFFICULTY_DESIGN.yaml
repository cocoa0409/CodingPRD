            - { call: "GET /dual-credit/offerings/${off_id}", as: Any, captures: { v2: $.data.version } }
            - { call: "POST /dual-credit/enrollments/${e2}/confirm", payload: { expected_offering_version: "${v2}" }, as: HsCoordinator }
