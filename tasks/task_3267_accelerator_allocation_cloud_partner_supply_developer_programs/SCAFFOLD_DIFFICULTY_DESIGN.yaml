          blueprint_type: TRAINING_CLUSTER
          target_tdp_watts: 1400
          required_validation_minutes: 120
          evaluation_deadline_days: 30
        as: SupplyPlanner
        captures:
          bp_id: $.data.id
      - call: POST /accelerators/blueprints/${bp_id}/certify
        payload: {}
        as: SupplyPlanner
      - call: POST /accelerators/partners
        payload:
          legal_name: Helios Cloud Systems
          partner_type: CLOUD_PROVIDER
          destination_country: US
          export_restriction_tier: LICENSE_EXCEPTION
          origin_epoch_index: 5
        as: PartnerOps
        captures:
          pa_id: $.data.id
      - call: POST /accelerators/partners/${pa_id}/validations
        payload:
          validation_minutes: 240
          test_count: 6
          blueprint_id: ${bp_id}
        as: PartnerProgramManager
      - call: POST /accelerators/partners/${pa_id}/qualify
        payload: {}
        as: PartnerProgramManager
      - call: POST /accelerators/allocations
        payload:
          sku_code: AC-100-PCIE
          product_family: DATACENTER
          form_factor: PCLE
          hbm_capacity_gb: 80
          tdp_watts: 1350
          supply_ceiling_units: 10000
          long_term_availability_through: '2029-01-01T00:00:00Z'
        as: PlatformAdmin
        captures:
          sku_id: $.data.id
      - call: POST /accelerators/allocations/${sku_id}/advance_lifecycle
        payload: {}
        as: PlatformAdmin
      - call: GET /accelerators/allocations/${sku_id}
        payload: {}
        as: PlatformAdmin
        captures:
          fence_start: $.data.reserved_evaluation_units
          sku_v_r: $.data.version
      - call: POST /accelerators/evaluation-loans
        payload:
          product_sku_id: ${sku_id}
          blueprint_id: ${bp_id}
          loan_units: 50
        as: PartnerOps
        as_user_id: ${pa_id}
        captures:
          loan_r1: $.data.id
      - call: POST /accelerators/evaluation-loans
