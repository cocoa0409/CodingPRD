            - "${st4} == AWAITING_BUYER, ${r4} == 4, ${side4} == SELLER"
            - "${nv4} == ${nv3} + 1 and ${nv3} == ${nv2} + 1 and ${nv2} == ${nv1} + 1 (every counter-offer bumps the OCC version exactly once)"
