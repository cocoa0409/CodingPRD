# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1240: Christmas Tree Farm & Wholesale Program
# Breadth probe over §1.1-§1.7 claims not already covered by §1.8.
# Sections/claim_types follow references/claim-extraction-guide.md.
# Canonical season fixture (same as §1.8):
#   booking  2026-06-01T00:00:00Z .. 2026-08-31T23:59:59Z
#   harvest  2026-11-01 .. 2026-11-25 (inclusive dates)
#   shipping 2026-11-15T00:00:00Z .. 2026-12-10T23:59:59Z (inclusive end)
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: season_create_applies_defaults
        claim_type: creation_and_defaults
        grounds: ["entities.Season.fields.posture", "entities.Season.fields.ops_run_index"]
        distinguishing_aspect: "A new Season starts in PLANNING with ops_run_index 0 and version 1 regardless of input values for those fields."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { year: 2026, booking_open_at: "2026-06-01T00:00:00Z", booking_close_at: "2026-08-31T23:59:59Z", harvest_window_start: "2026-11-01", harvest_window_end: "2026-11-25", shipping_window_start: "2026-11-15T00:00:00Z", shipping_window_end: "2026-12-10T23:59:59Z" }, as: Owner, captures: { s: $.data.id } }
          trigger:
            - { call: "GET /api/seasons/${s}", payload: {}, as: Owner }
          assert:
            - "201 on create; Season.${s}.posture == PLANNING"
            - "Season.${s}.ops_run_index == 0 and version == 1"
            - "Season.${s}.id is a server-minted UUID (no type prefix); created_at present with millisecond precision"

      - name: block_create_system_field_input_ignored
        claim_type: system_fields_and_defaults
        grounds: ["entities.Block.fields.ucut_designated", "entities.Block.fields.rotation_state"]
        distinguishing_aspect: "Client-supplied id/version/rotation_state are ignored; ucut_designated defaults to false when omitted."
        test_recipe:
          setup: ["season exists"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { year: 2026, booking_open_at: "2026-06-01T00:00:00Z", booking_close_at: "2026-08-31T23:59:59Z", harvest_window_start: "2026-11-01", harvest_window_end: "2026-11-25", shipping_window_start: "2026-11-15T00:00:00Z", shipping_window_end: "2026-12-10T23:59:59Z" }, as: Owner, captures: { s: $.data.id } }
          trigger:
            - { call: "POST /api/blocks", payload: { season_id: "${s}", block_code: "B-9", acreage: 3.0, id: "00000000-0000-4000-8000-0000000000aa", version: 99, rotation_state: "HARVESTED" }, as: FarmManager, captures: { blk: $.data.id } }
          assert:
            - "Block.${blk}.id != the client-supplied id (server minted); version == 1, not 99"
            - "Block.${blk}.rotation_state == RESTING (system default, input ignored)"
            - "Block.${blk}.ucut_designated == false (default applied when omitted)"

      - name: order_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID yields ERR_NOT_FOUND, not a 500 or empty object."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { year: 2026, booking_open_at: "2026-06-01T00:00:00Z", booking_close_at: "2026-08-31T23:59:59Z", harvest_window_start: "2026-11-01", harvest_window_end: "2026-11-25", shipping_window_start: "2026-11-15T00:00:00Z", shipping_window_end: "2026-12-10T23:59:59Z" }, as: Owner }
          trigger:
            - { call: "GET /api/wholesale-orders/11111111-2222-4333-8444-555555555555", payload: {}, as: Owner }
          assert:
            - "response 404 with data.error_id == ERR_NOT_FOUND and a message string"
            - "error envelope carries meta.api_request_id and response_type == error"

      - name: order_create_missing_required_quantity_returns_400
        claim_type: required_fields
        grounds: ["validations[priority=5]", "errors[ERR_MALFORMED_REQUEST]"]
        distinguishing_aspect: "Omitting required field quantity on order create yields ERR_MALFORMED_REQUEST (400) before any business rule runs."
        test_recipe:
          setup: ["season in BOOKING; buyer exists"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { year: 2026, booking_open_at: "2026-06-01T00:00:00Z", booking_close_at: "2026-08-31T23:59:59Z", harvest_window_start: "2026-11-01", harvest_window_end: "2026-11-25", shipping_window_start: "2026-11-15T00:00:00Z", shipping_window_end: "2026-12-10T23:59:59Z" }, as: Owner, captures: { s: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "BOOKING" }, as: Owner }
            - { call: "POST /api/buyer-accounts", payload: { name: "Acme Wholesale", credit_limit_cents: 100000000 }, as: Owner, captures: { buy: $.data.id } }
          trigger:
            - { call: "POST /api/wholesale-orders", payload: { season_id: "${s}", buyer_account_id: "${buy}", species: "NOBLE_FIR", height_class: "H_6_7", unit_price_cents: 400 }, as: WholesaleBuyer, as_user_id: "${buy}" }
          assert:
            - "response 400 with error_id == ERR_MALFORMED_REQUEST"
            - "GET /api/wholesale-orders?buyer_account_id=${buy} returns total_count == 0"

      - name: order_create_invalid_enum_species_rejected
        claim_type: type_constraints
        grounds: ["entities.WholesaleOrder.fields.species", "errors[ERR_MALFORMED_REQUEST]"]
        distinguishing_aspect: "species is a closed enum; PINE_42 is rejected with 400 while NOBLE_FIR succeeds."
        test_recipe:
          setup: ["season in BOOKING; buyer exists"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { year: 2026, booking_open_at: "2026-06-01T00:00:00Z", booking_close_at: "2026-08-31T23:59:59Z", harvest_window_start: "2026-11-01", harvest_window_end: "2026-11-25", shipping_window_start: "2026-11-15T00:00:00Z", shipping_window_end: "2026-12-10T23:59:59Z" }, as: Owner, captures: { s: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "BOOKING" }, as: Owner }
            - { call: "POST /api/buyer-accounts", payload: { name: "Acme Wholesale", credit_limit_cents: 100000000 }, as: Owner, captures: { buy: $.data.id } }
          trigger:
            - { call: "POST /api/wholesale-orders", payload: { season_id: "${s}", buyer_account_id: "${buy}", species: "PINE_42", height_class: "H_6_7", quantity: 5, unit_price_cents: 400 }, as: WholesaleBuyer, as_user_id: "${buy}" }
          assert:
            - "response 400 with error_id == ERR_MALFORMED_REQUEST"
            - "no order persisted: GET /api/wholesale-orders?buyer_account_id=${buy} returns total_count == 0"

      - name: order_create_computed_field_input_ignored
        claim_type: computed_fields
        grounds: ["entities.WholesaleOrder.fields.allocated_qty"]
        distinguishing_aspect: "allocated_qty is system-computed; a client-supplied value on create is ignored and the response shows 0."
        test_recipe:
          setup: ["season in BOOKING; buyer exists"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { year: 2026, booking_open_at: "2026-06-01T00:00:00Z", booking_close_at: "2026-08-31T23:59:59Z", harvest_window_start: "2026-11-01", harvest_window_end: "2026-11-25", shipping_window_start: "2026-11-15T00:00:00Z", shipping_window_end: "2026-12-10T23:59:59Z" }, as: Owner, captures: { s: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "BOOKING" }, as: Owner }
            - { call: "POST /api/buyer-accounts", payload: { name: "Acme Wholesale", credit_limit_cents: 100000000 }, as: Owner, captures: { buy: $.data.id } }
          trigger:
            - { call: "POST /api/wholesale-orders", payload: { season_id: "${s}", buyer_account_id: "${buy}", species: "NOBLE_FIR", height_class: "H_6_7", quantity: 5, unit_price_cents: 400, allocated_qty: 999 }, as: WholesaleBuyer, as_user_id: "${buy}", captures: { ord: $.data.id } }
          assert:
            - "201 Created; WholesaleOrder.${ord}.allocated_qty == 0 (client-supplied 999 ignored)"
            - "WholesaleOrder.${ord}.status == DRAFT"

      - name: block_list_pagination_envelope
        claim_type: listing_pagination
        grounds: ["response_envelope"]
        distinguishing_aspect: "limit/offset windowing over three blocks yields total_count 3, has_more true on the first page and false on the last."
        test_recipe:
          setup: ["season with three blocks B-1, B-2, B-3 created in that order"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { year: 2026, booking_open_at: "2026-06-01T00:00:00Z", booking_close_at: "2026-08-31T23:59:59Z", harvest_window_start: "2026-11-01", harvest_window_end: "2026-11-25", shipping_window_start: "2026-11-15T00:00:00Z", shipping_window_end: "2026-12-10T23:59:59Z" }, as: Owner, captures: { s: $.data.id } }
            - { call: "POST /api/blocks", payload: { season_id: "${s}", block_code: "B-1", acreage: 5.0 }, as: FarmManager }
            - { call: "POST /api/blocks", payload: { season_id: "${s}", block_code: "B-2", acreage: 6.0 }, as: FarmManager }
            - { call: "POST /api/blocks", payload: { season_id: "${s}", block_code: "B-3", acreage: 7.0 }, as: FarmManager }
          trigger:
            - { call: "GET /api/blocks?season_id=${s}&limit=2", payload: {}, as: FarmManager }
            - { call: "GET /api/blocks?season_id=${s}&limit=2&offset=2", payload: {}, as: FarmManager }
          assert:
            - "page 1: response_type == array, data length == 2, total_count == 3, has_more == true"
            - "page 2 (offset=2): data length == 1, total_count == 3, has_more == false"
            - "ordering is created_at ASC: page 1 holds B-1 then B-2; page 2 holds B-3"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: order_create_initial_state_draft
        claim_type: initial_state
        grounds: ["state_machines.WholesaleOrder"]
        distinguishing_aspect: "Every new WholesaleOrder starts in DRAFT with allocated_qty 0 and null invoice fields."
        test_recipe:
          setup: ["season in BOOKING; buyer exists"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { year: 2026, booking_open_at: "2026-06-01T00:00:00Z", booking_close_at: "2026-08-31T23:59:59Z", harvest_window_start: "2026-11-01", harvest_window_end: "2026-11-25", shipping_window_start: "2026-11-15T00:00:00Z", shipping_window_end: "2026-12-10T23:59:59Z" }, as: Owner, captures: { s: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "BOOKING" }, as: Owner }
            - { call: "POST /api/buyer-accounts", payload: { name: "Acme Wholesale", credit_limit_cents: 100000000 }, as: Owner, captures: { buy: $.data.id } }
          trigger:
            - { call: "POST /api/wholesale-orders", payload: { season_id: "${s}", buyer_account_id: "${buy}", species: "NOBLE_FIR", height_class: "H_5_6", quantity: 12, unit_price_cents: 300 }, as: WholesaleBuyer, as_user_id: "${buy}", captures: { ord: $.data.id } }
          assert:
            - "WholesaleOrder.${ord}.status == DRAFT"
            - "allocated_qty == 0; invoice_total_cents is null until submit; submitted_at is null"

      - name: order_double_submit_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.WholesaleOrder.DRAFT_to_SUBMITTED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "SUBMITTED is not a valid from-state for submit; the second submit is a 409 and no duplicate invoice/exposure accrues."
        test_recipe:
          setup: ["season in BOOKING; buyer; order submitted once"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { year: 2026, booking_open_at: "2026-06-01T00:00:00Z", booking_close_at: "2026-08-31T23:59:59Z", harvest_window_start: "2026-11-01", harvest_window_end: "2026-11-25", shipping_window_start: "2026-11-15T00:00:00Z", shipping_window_end: "2026-12-10T23:59:59Z" }, as: Owner, captures: { s: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "BOOKING" }, as: Owner }
            - { call: "POST /api/buyer-accounts", payload: { name: "Acme Wholesale", credit_limit_cents: 100000000 }, as: Owner, captures: { buy: $.data.id } }
            - { call: "POST /api/wholesale-orders", payload: { season_id: "${s}", buyer_account_id: "${buy}", species: "NOBLE_FIR", height_class: "H_6_7", quantity: 10, unit_price_cents: 400 }, as: WholesaleBuyer, as_user_id: "${buy}", captures: { ord: $.data.id } }
            - { call: "POST /api/wholesale-orders/${ord}/submit", payload: {}, as: WholesaleBuyer, as_user_id: "${buy}" }
          trigger:
            - { call: "POST /api/wholesale-orders/${ord}/submit", payload: {}, as: WholesaleBuyer, as_user_id: "${buy}" }
          assert:
            - "second submit: 409 with error_id == ERR_INVALID_STATE"
            - "BuyerAccount.${buy}.exposure_cents == 4000 (charged once, not twice)"

      - name: cancel_terminal_order_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.WholesaleOrder"]
        distinguishing_aspect: "CANCELLED is terminal; a second cancel hits the lockdown with ERR_INVALID_STATE."
        test_recipe:
          setup: ["season in BOOKING; buyer; DRAFT order cancelled"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { year: 2026, booking_open_at: "2026-06-01T00:00:00Z", booking_close_at: "2026-08-31T23:59:59Z", harvest_window_start: "2026-11-01", harvest_window_end: "2026-11-25", shipping_window_start: "2026-11-15T00:00:00Z", shipping_window_end: "2026-12-10T23:59:59Z" }, as: Owner, captures: { s: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "BOOKING" }, as: Owner }
            - { call: "POST /api/buyer-accounts", payload: { name: "Acme Wholesale", credit_limit_cents: 100000000 }, as: Owner, captures: { buy: $.data.id } }
            - { call: "POST /api/wholesale-orders", payload: { season_id: "${s}", buyer_account_id: "${buy}", species: "NOBLE_FIR", height_class: "H_6_7", quantity: 3, unit_price_cents: 400 }, as: WholesaleBuyer, as_user_id: "${buy}", captures: { ord: $.data.id } }
            - { call: "POST /api/wholesale-orders/${ord}/cancel", payload: {}, as: WholesaleBuyer, as_user_id: "${buy}" }
          trigger:
            - { call: "POST /api/wholesale-orders/${ord}/cancel", payload: {}, as: FarmManager }
          assert:
            - "second cancel (even by FarmManager): 409 with error_id == ERR_INVALID_STATE"
            - "WholesaleOrder.${ord}.status remains CANCELLED"

      - name: consignment_dispute_renegotiation_cycle
        claim_type: cyclic_shape
        grounds: ["state_machines.Consignment.SETTLING_to_DISPUTED", "state_machines.Consignment.DISPUTED_to_SETTLING"]
        distinguishing_aspect: "SETTLING -> DISPUTED -> SETTLING -> SETTLED walks the renegotiation loop; returned_count is overwritten by the re-report (7 then 4)."
        test_recipe:
          setup:
            - "Season progressed to SETTLEMENT; consignment delivered 20 trees at 2500 cents, max_return_pct 0.5"
            - "first return report of 7, dispute, corrected report of 4, then settle"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { year: 2026, booking_open_at: "2026-06-01T00:00:00Z", booking_close_at: "2026-08-31T23:59:59Z", harvest_window_start: "2026-11-01", harvest_window_end: "2026-11-25", shipping_window_start: "2026-11-15T00:00:00Z", shipping_window_end: "2026-12-10T23:59:59Z" }, as: Owner, captures: { s: $.data.id } }
            - { call: "POST /api/blocks", payload: { season_id: "${s}", block_code: "B-1", acreage: 12.5 }, as: FarmManager, captures: { blk: $.data.id } }
            - { call: "POST /api/crop-lots", payload: { block_id: "${blk}", species: "GRAND_FIR", planted_year: 2018, initial_counts: { H_4_5: 0, H_5_6: 0, H_6_7: 100, H_7_8: 0, H_8_9: 0, H_9_PLUS: 0 } }, as: FarmManager, captures: { lot: $.data.id } }
            - { call: "GET /api/crop-lots/${lot}/stand-buckets", payload: {}, as: FarmManager, captures: { b67: "$.data[2].id" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "BOOKING" }, as: Owner }
            - { call: "POST /api/consignments", payload: { season_id: "${s}", bucket_id: "${b67}", lot_name: "Lot 7 Retail", quantity: 20, unit_price_cents: 2500, max_return_pct: 0.5 }, as: FarmManager, captures: { cons: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-11-10T08:00:00Z" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "HARVEST" }, as: Owner }
            - { call: "POST /api/consignments/${cons}/deliver", payload: { delivered_count: 20 }, as: FarmManager }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "SHIPPING" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "SETTLEMENT" }, as: Owner }
            - { call: "POST /api/consignments/${cons}/report-return", payload: { returned_count: 7 }, as: FarmManager }
          trigger:
            - { call: "POST /api/consignments/${cons}/dispute", payload: {}, as: FarmManager, captures: { st1: $.data.status } }
            - { call: "POST /api/consignments/${cons}/report-return", payload: { returned_count: 4 }, as: FarmManager, captures: { st2: $.data.status } }
            - { call: "POST /api/consignments/${cons}/settle", payload: {}, as: FarmManager, captures: { fin: $.data.final_settlement_cents } }
          assert:
            - "${st1} == DISPUTED then ${st2} == SETTLING — the cycle executed"
            - "final_settlement_cents computed from the corrected report: ${fin} == 40000  (round_half_up((20-4)*2500))"
            - "Consignment.${cons}.status == SETTLED and returned_count == 4 (overwrite, not accumulate)"

      - name: order_cancel_releases_reserved_allocations
        claim_type: side_effect_execution
        grounds: ["state_machines.WholesaleOrder.SUBMITTED_to_CANCELLED", "state_machines.Allocation.RESERVED_to_RELEASED"]
        distinguishing_aspect: "Cancelling an ALLOCATED order cascades: its RESERVED allocation flips RELEASED and the bucket's reserved_count drops from 25 to 0."
        test_recipe:
          setup: ["season in BOOKING; lot H_6_7 standing 100; order qty 25 submitted and fully allocated"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { year: 2026, booking_open_at: "2026-06-01T00:00:00Z", booking_close_at: "2026-08-31T23:59:59Z", harvest_window_start: "2026-11-01", harvest_window_end: "2026-11-25", shipping_window_start: "2026-11-15T00:00:00Z", shipping_window_end: "2026-12-10T23:59:59Z" }, as: Owner, captures: { s: $.data.id } }
            - { call: "POST /api/blocks", payload: { season_id: "${s}", block_code: "B-1", acreage: 12.5 }, as: FarmManager, captures: { blk: $.data.id } }
            - { call: "POST /api/crop-lots", payload: { block_id: "${blk}", species: "NOBLE_FIR", planted_year: 2019, initial_counts: { H_4_5: 0, H_5_6: 0, H_6_7: 100, H_7_8: 0, H_8_9: 0, H_9_PLUS: 0 } }, as: FarmManager, captures: { lot: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "BOOKING" }, as: Owner }
            - { call: "POST /api/buyer-accounts", payload: { name: "Acme Wholesale", credit_limit_cents: 100000000 }, as: Owner, captures: { buy: $.data.id } }
            - { call: "POST /api/wholesale-orders", payload: { season_id: "${s}", buyer_account_id: "${buy}", species: "NOBLE_FIR", height_class: "H_6_7", quantity: 25, unit_price_cents: 400 }, as: WholesaleBuyer, as_user_id: "${buy}", captures: { ord: $.data.id } }
            - { call: "POST /api/wholesale-orders/${ord}/submit", payload: {}, as: WholesaleBuyer, as_user_id: "${buy}", captures: { ov: $.data.version } }
            - { call: "POST /api/wholesale-orders/${ord}/allocate", payload: { quantity: 25, expected_order_version: "${ov}" }, as: FarmManager }
            - { call: "GET /api/allocations?order_id=${ord}", payload: {}, as: FarmManager, captures: { alc: "$.data[0].id" } }
          trigger:
            - { call: "POST /api/wholesale-orders/${ord}/cancel", payload: {}, as: FarmManager }
          assert:
            - "Allocation.${alc}.status == RELEASED"
            - "StandBucket H_6_7: reserved_count == 0, standing_count == 100 (release never destroys standing)"
            - "WholesaleOrder.${ord}.status == CANCELLED; BuyerAccount.${buy}.exposure_cents == 0"

      - name: tag_redeem_side_effects_on_bucket
        claim_type: side_effect_execution
        grounds: ["state_machines.UcutTag.ACTIVE_to_REDEEMED"]
        distinguishing_aspect: "Tag create claims the tree (standing 10->9, tagged 0->1); redeem converts the claim to a sale (tagged 1->0, ucut_sold 0->1, standing stays 9)."
        test_recipe:
          setup: ["season in HARVEST; ucut-designated HARVESTABLE block; bucket H_6_7 standing 10"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { year: 2026, booking_open_at: "2026-06-01T00:00:00Z", booking_close_at: "2026-08-31T23:59:59Z", harvest_window_start: "2026-11-01", harvest_window_end: "2026-11-25", shipping_window_start: "2026-11-15T00:00:00Z", shipping_window_end: "2026-12-10T23:59:59Z" }, as: Owner, captures: { s: $.data.id } }
