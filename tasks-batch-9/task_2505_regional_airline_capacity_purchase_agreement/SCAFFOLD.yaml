# =============================================================================
# task_2505 — Regional Airline Capacity Purchase Agreement (CPA) seed tables
# §1.0 – §1.7.  Difficulty design → SCAFFOLD_DIFFICULTY_DESIGN.yaml
#                Corner design   → SCAFFOLD_CORNER_DESIGN.yaml
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2505. Regional Airline Capacity Purchase Agreement (regional airline operations): agreement structure with fixed and variable payment components by block hour, departure and aircraft ownership, performance incentives and penalties on completion factor, on-time arrival and mishandled bags, fleet allocation, base assignment and crew staffing driven by the mainline partner's schedule, pass-through cost categories such as fuel, airport fees and insurance with reconciliation, controllable versus uncontrollable cancellation classification for penalty purposes, aircraft transition, fleet renewal and contract extension negotiation, pilot supply constraints, hiring pipeline and attrition to the mainline partner, brand standards, uniform and product consistency obligations

domain_name: regional-cpa-settlement
api_prefix: /cpa

complexity_profile:
  primary_archetype: Ledger reconciliation
  secondary_archetype: Multi-party negotiation
  complexity_layers:
    - Dual-variant calculation
    - Cascading side effects
    - Rate / threshold triggers
    - Derived field reconciliation
    - Optimistic concurrency

  entity_topology: flat
  # Every entity is a peer addressed at /cpa/<collection>/{id}; parentage is
  # expressed purely through FK fields plus filtered-list reverse lookups.
  # No nested URL paths anywhere in §1.5.

  state_machine_shape: cyclic
  # CancellationClaim CLASSIFIED→DISPUTED→CLASSIFIED and ExtensionNegotiation
  # OFFERED→COUNTERED→OFFERED are true loops with round counters; BrandAudit
  # carries two independent state dimensions on one row; Aircraft
  # IN_SERVICE→GROUNDED_STAFFING→IN_SERVICE loops on crew supply.

  relationship_patterns:
    - one_to_many          # Agreement→CrewBase/Aircraft/ScheduleCycle, ScheduleCycle→FlightLeg
    - cross_aggregate      # FlightLeg→Aircraft and FlightLeg→Pilot cross the schedule/fleet boundary
    - polymorphic          # Invoice.void_reason distinguishes manual vs cascade-authored voids

  role_model: segregation_of_duties
  # The X-User-ID that files a pass-through actual may not be the X-User-ID that
  # reconciles it, even when both act under CPAAdministrator; classification of a
  # cancellation belongs to the mainline while the dispute belongs to the regional.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Agreement
    parent: null
    common_fields: true
    fields:
      - { name: mainline_partner_name, type: string, source: input, description: "Mainline partner branding the flights" }
      - { name: regional_carrier_name, type: string, source: input, description: "Regional operator selling capacity" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | ACTIVE | EXTENSION_PENDING | EXPIRED | TERMINATED", constraints: "See §1.2 Agreement machine" }
      - { name: fixed_monthly_fee_usd, type: number, source: input, description: "Fixed monthly capacity fee, 2dp, > 0" }
      - { name: block_hour_rate_usd, type: number, source: input, description: "Variable rate per block hour flown, 2dp, > 0" }
      - { name: departure_rate_usd, type: number, source: input, description: "Variable rate per completed departure, 2dp, > 0" }
      - { name: aircraft_ownership_fee_usd, type: number, source: input, description: "Monthly ownership fee paid per REGIONAL_OWNED aircraft in service, 2dp, > 0" }
      - { name: incentive_pool_cap_usd, type: number, source: input, description: "Hard ceiling on monthly performance incentive, 2dp, >= 0" }
      - { name: penalty_cap_usd, type: number, source: input, description: "Hard floor (as positive magnitude) on monthly performance penalty, 2dp, >= 0" }
      - { name: term_end_date, type: string, source: input, description: "Contract expiry date, YYYY-MM-DD" }
      - { name: extension_round_count, type: integer, source: system, default: 0, description: "Number of extension offers ever opened against this agreement" }
      - { name: settled_to_date_usd, type: number, source: computed, default: 0.00, description: "= sum(Invoice.total_usd) over invoices of this agreement's cycles with Invoice.status == ISSUED; 2dp. Conserved quantity for §0.5 Rule 9" }
      - { name: open_invoice_count, type: integer, source: computed, default: 0, description: "= count(Invoice) with Invoice.status == DRAFT over this agreement's cycles" }
      - { name: activated_at, type: datetime, source: system, description: "Logical-clock instant of the DRAFT→ACTIVE transition; null while DRAFT" }

  - name: CrewBase
    parent: Agreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> Agreement.id; the CPA this crew base staffs" }
      - { name: station_code, type: string, source: input, description: "3-letter station code, unique per agreement_id" }
      - { name: pilots_required_per_aircraft, type: integer, source: input, description: "Contractual pilots-per-aircraft staffing ratio, >= 1" }
      - { name: aircraft_allocation_cap, type: integer, source: input, description: "Maximum aircraft the mainline may allocate to this base, >= 1" }
      - { name: lifecycle_status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | CLOSED — CLOSED is written only by the agreement-termination cascade" }
      - { name: line_qualified_pilot_count, type: integer, source: computed, default: 0, description: "= count(Pilot) with base_id == this.id AND status == LINE_QUALIFIED" }
      - { name: in_training_pilot_count, type: integer, source: computed, default: 0, description: "= count(Pilot) with base_id == this.id AND status == IN_TRAINING" }
      - { name: assigned_aircraft_count, type: integer, source: computed, default: 0, description: "= count(Aircraft) with assigned_base_id == this.id AND status IN {IN_SERVICE, GROUNDED_STAFFING}" }
      - { name: required_pilot_count, type: integer, source: computed, default: 0, description: "= assigned_aircraft_count * pilots_required_per_aircraft" }
      - { name: headcount_shortfall, type: integer, source: computed, default: 0, description: "HEADCOUNT_BASIS variant of calculations.pilot_staffing_shortfall" }
      - { name: pipeline_shortfall, type: integer, source: computed, default: 0, description: "PIPELINE_BASIS variant of calculations.pilot_staffing_shortfall" }
      - { name: staffing_posture, type: enum, source: computed, default: "STAFFED", description: "STAFFED | SHORT | CRITICAL — banded from headcount_shortfall per calculations.pilot_staffing_shortfall" }
      - { name: allocatable_aircraft_count, type: integer, source: computed, default: 0, description: "= min(aircraft_allocation_cap, floor(pipeline_available_pilots / pilots_required_per_aircraft))" }

  - name: Aircraft
    parent: Agreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> Agreement.id; the CPA this tail flies under" }
      - { name: assigned_base_id, type: string, source: input, description: "FK -> CrewBase.id; base whose crews operate this tail" }
      - { name: tail_number, type: string, source: input, description: "Registration, unique per agreement_id" }
      - { name: seat_count, type: integer, source: input, description: "Certified seats, >= 1" }
      - { name: ownership, type: enum, source: input, description: "REGIONAL_OWNED | MAINLINE_OWNED | LEASED — only REGIONAL_OWNED earns aircraft_ownership_fee_usd" }
      - { name: status, type: enum, source: system, default: "PENDING_INDUCTION", description: "PENDING_INDUCTION | IN_SERVICE | GROUNDED_STAFFING | TRANSITION_PENDING | TRANSITIONED | WITHDRAWN" }
      - { name: transition_reason, type: enum, source: system, description: "FLEET_RENEWAL | LEASE_EXPIRY | PARTNER_RECALL — set by the transition action, else null" }
      - { name: target_ownership, type: enum, source: system, description: "REGIONAL_OWNED | MAINLINE_OWNED | LEASED — ownership the tail assumes on TRANSITIONED, else null" }
      - { name: grounded_reason, type: enum, source: system, description: "STAFFING_SHORTFALL — set when a crew cascade grounds the tail, else null" }
      - { name: inducted_at, type: datetime, source: system, description: "Logical-clock instant of first PENDING_INDUCTION→IN_SERVICE transition; null before" }

  - name: Pilot
    parent: CrewBase
    common_fields: true
    fields:
      - { name: base_id, type: string, source: input, description: "FK -> CrewBase.id; the pilot's assigned base" }
      - { name: employee_ref, type: string, source: input, description: "Employee reference, unique per base_id" }
      - { name: seat, type: enum, source: input, description: "CAPTAIN | FIRST_OFFICER" }
      - { name: hire_class_date, type: string, source: input, description: "Hiring-pipeline class date, YYYY-MM-DD" }
      - { name: status, type: enum, source: system, default: "PIPELINE", description: "PIPELINE | IN_TRAINING | LINE_QUALIFIED | ATTRITED_TO_MAINLINE | RESIGNED" }
      - { name: attrition_destination, type: enum, source: system, description: "MAINLINE | OTHER — set by the attrition action, else null" }

  - name: ScheduleCycle
    parent: Agreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> Agreement.id; the CPA this settlement month belongs to" }
      - { name: cycle_month, type: string, source: input, description: "Settlement month YYYY-MM, unique per agreement_id" }
      - { name: published_departures, type: integer, source: input, description: "Departure count the mainline published for this month; metric denominator basis, >= 0" }
      - { name: status, type: enum, source: system, default: "PLANNED", description: "PLANNED | OPEN | CLOSED | SETTLED" }
      - { name: recorded_completed_legs, type: integer, source: computed, default: 0, description: "= count(FlightLeg) with cycle_id == this.id AND status == COMPLETED" }
      - { name: open_leg_count, type: integer, source: computed, default: 0, description: "= count(FlightLeg) with cycle_id == this.id AND status == SCHEDULED" }
      - { name: cancelled_controllable_count, type: integer, source: computed, default: 0, description: "= count(CancellationClaim) with cycle_id == this.id AND status IN {OPEN, CLASSIFIED, DISPUTED, FINALIZED} AND effective_classification == CONTROLLABLE" }
      - { name: cancelled_uncontrollable_count, type: integer, source: computed, default: 0, description: "= count(CancellationClaim) with cycle_id == this.id AND status == FINALIZED AND classification == UNCONTROLLABLE" }
      - { name: metric_completed_departures, type: integer, source: computed, default: 0, description: "= published_departures - cancelled_controllable_count - cancelled_uncontrollable_count" }
      - { name: departure_ledger_total, type: integer, source: computed, default: 0, description: "= metric_completed_departures + cancelled_controllable_count + cancelled_uncontrollable_count; conserved quantity for §0.5 Rule 9 (MUST always equal published_departures)" }
      - { name: credited_block_hours, type: number, source: computed, default: 0.000, description: "= sum(FlightLeg.actual_block_hours) over legs with status == COMPLETED, 3dp" }
      - { name: enplaned_bags_total, type: integer, source: computed, default: 0, description: "= sum(FlightLeg.enplaned_bags) over legs with status == COMPLETED" }
      - { name: mishandled_bags_total, type: integer, source: computed, default: 0, description: "= sum(FlightLeg.mishandled_bags) over legs with status == COMPLETED" }
      - { name: on_time_leg_count, type: integer, source: computed, default: 0, description: "= count(FlightLeg) with status == COMPLETED AND on_time == true" }
      - { name: estimated_passthrough_total_usd, type: number, source: computed, default: 0.00, description: "= sum(PassThroughClaim.estimated_amount_usd) over claims with cycle_id == this.id AND status IN {SUBMITTED, ACTUAL_SUBMITTED, RECONCILED}, 2dp" }
      - { name: passthrough_settlement_usd, type: number, source: computed, default: 0.00, description: "Output of calculations.passthrough_reconciliation_settlement (base total + admin fee), 2dp" }
      - { name: closed_at, type: datetime, source: system, description: "Logical-clock instant of OPEN→CLOSED; null before" }

  - name: FlightLeg
    parent: ScheduleCycle
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> ScheduleCycle.id; settlement month this leg is credited to" }
      - { name: aircraft_id, type: string, source: input, description: "FK -> Aircraft.id; tail operating the leg" }
      - { name: captain_pilot_id, type: string, source: input, description: "FK -> Pilot.id; pilot in command" }
      - { name: flight_number, type: string, source: input, description: "Mainline-branded flight number" }
      - { name: origin, type: string, source: input, description: "Departure station code" }
      - { name: destination, type: string, source: input, description: "Arrival station code" }
      - { name: scheduled_departure_utc, type: datetime, source: input, description: "Published departure instant, ISO 8601 UTC" }
      - { name: scheduled_arrival_utc, type: datetime, source: input, description: "Published arrival instant, ISO 8601 UTC; MUST be > scheduled_departure_utc" }
      - { name: planned_block_hours, type: number, source: input, description: "Scheduled block hours, 3dp, > 0" }
      - { name: actual_block_hours, type: number, source: system, description: "Block hours flown, 3dp; set by the complete action, else null" }
      - { name: actual_arrival_utc, type: datetime, source: system, description: "Actual arrival instant; set by the complete action, else null" }
      - { name: enplaned_bags, type: integer, source: system, default: 0, description: "Bags enplaned on the leg; reported by the complete action" }
      - { name: mishandled_bags, type: integer, source: system, default: 0, description: "Bags mishandled on the leg; reported by the complete action" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | COMPLETED | CANCELLED" }
      - { name: on_time, type: boolean, source: computed, default: false, description: "= actual_arrival_utc <= scheduled_arrival_utc + ON_TIME_GRACE_MINUTES (inclusive A14 boundary); false while SCHEDULED or CANCELLED" }
      - { name: leg_variable_payment_usd, type: number, source: computed, default: 0.00, description: "Per-leg output of calculations.variable_flight_payment, 2dp; 0.00 unless status == COMPLETED" }
      - { name: cancel_cause_code, type: enum, source: system, description: "CREW_UNAVAILABLE | MAINTENANCE | WEATHER | ATC | MAINLINE_REQUEST | SECURITY — set by the cancel action, else null" }
      - { name: reinstate_count, type: integer, source: system, default: 0, description: "Number of CANCELLED→SCHEDULED reinstatements applied to this leg" }

  - name: CancellationClaim
    parent: FlightLeg
    common_fields: true
    fields:
      - { name: leg_id, type: string, source: input, description: "FK -> FlightLeg.id; the cancelled leg under classification" }
      - { name: cycle_id, type: string, source: input, description: "FK -> ScheduleCycle.id; denormalised from the leg for cycle-level counters" }
      - { name: cause_code, type: enum, source: system, description: "Copied from FlightLeg.cancel_cause_code at claim creation" }
      - { name: classification, type: enum, source: system, description: "CONTROLLABLE | UNCONTROLLABLE — set by the mainline classify action, else null" }
      - { name: effective_classification, type: enum, source: computed, description: "= classification when status == FINALIZED, otherwise the pinned provisional attribution CONTROLLABLE" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | CLASSIFIED | DISPUTED | FINALIZED | VOIDED" }
      - { name: dispute_round, type: integer, source: system, default: 0, description: "Count of CLASSIFIED→DISPUTED loops taken; capped by MAX_DISPUTE_ROUNDS" }
      - { name: dispute_note, type: string, source: system, description: "Regional carrier's most recent dispute rationale, else null" }

  - name: PassThroughClaim
    parent: ScheduleCycle
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> ScheduleCycle.id; settlement month the cost belongs to" }
      - { name: category, type: enum, source: input, description: "FUEL | AIRPORT_FEES | INSURANCE — unique per cycle_id" }
      - { name: estimated_amount_usd, type: number, source: input, description: "Accrual estimate filed at submission, 2dp, > 0" }
      - { name: actual_amount_usd, type: number, source: system, description: "Invoiced actual, 2dp; set by the submit-actual action, else null" }
      - { name: supporting_doc_ref, type: string, source: system, description: "Document reference filed with the actual, else null" }
      - { name: allowed_amount_usd, type: number, source: computed, description: "Step 1 of calculations.passthrough_reconciliation_settlement; null until status == RECONCILED" }
      - { name: variance_usd, type: number, source: computed, description: "= actual_amount_usd - estimated_amount_usd, 2dp; null until actual filed" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | ACTUAL_SUBMITTED | RECONCILED | REJECTED" }
      - { name: actual_submitted_by_user_id, type: string, source: system, description: "X-User-ID that filed the actual; segregation-of-duties comparand, else null" }
      - { name: reconciled_by_user_id, type: string, source: system, description: "X-User-ID that reconciled or rejected the claim, else null" }

  - name: Scorecard
    parent: ScheduleCycle
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> ScheduleCycle.id; the closed month scored" }
      - { name: status, type: enum, source: system, default: "PUBLISHED", description: "PUBLISHED | STALE" }
      - { name: completion_factor_pct, type: number, source: computed, description: "Output of calculations.completion_factor, 2dp" }
      - { name: on_time_arrival_pct, type: number, source: computed, description: "Output of calculations.on_time_arrival, 2dp" }
      - { name: mishandled_bags_per_1000, type: number, source: computed, description: "Output of calculations.mishandled_bag_rate, 2dp" }
      - { name: completion_factor_points, type: integer, source: computed, description: "CF band points per calculations.performance_incentive_penalty" }
      - { name: on_time_points, type: integer, source: computed, description: "OTA band points, forfeited to 0 when completion_factor_points < 0" }
      - { name: bag_points, type: integer, source: computed, description: "Bag band points, forfeited to 0 when completion_factor_points < 0" }
      - { name: performance_points, type: integer, source: computed, description: "= completion_factor_points + on_time_points + bag_points after forfeiture" }
      - { name: gross_performance_usd, type: number, source: computed, description: "= performance_points * POINT_VALUE_USD, 2dp, signed" }
      - { name: incentive_usd, type: number, source: computed, default: 0.00, description: "Non-negative capped incentive, 2dp" }
      - { name: penalty_usd, type: number, source: computed, default: 0.00, description: "Non-negative capped penalty magnitude, 2dp" }
      - { name: brand_penalty_usd, type: number, source: computed, default: 0.00, description: "Output of calculations.brand_consistency_penalty, 2dp" }
      - { name: recompute_count, type: integer, source: system, default: 0, description: "Number of explicit recompute actions applied" }

  - name: Invoice
    parent: ScheduleCycle
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> ScheduleCycle.id; settlement month billed" }
      - { name: variant, type: enum, source: input, description: "PROVISIONAL | FINAL — selects the calculations.invoice_settlement variant" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | ISSUED | VOIDED — only a variant == FINAL invoice may reach ISSUED" }
      - { name: ownership_aircraft_count, type: integer, source: computed, description: "= count(Aircraft) with agreement_id == cycle.agreement_id AND ownership == REGIONAL_OWNED AND status IN {IN_SERVICE, GROUNDED_STAFFING}" }
      - { name: fixed_component_usd, type: number, source: computed, description: "= fixed_monthly_fee_usd + round2(aircraft_ownership_fee_usd * ownership_aircraft_count), 2dp" }
      - { name: variable_component_usd, type: number, source: computed, description: "Output of calculations.variable_flight_payment for the selected variant, 2dp" }
      - { name: passthrough_component_usd, type: number, source: computed, description: "estimated_passthrough_total_usd (PROVISIONAL) or passthrough_settlement_usd (FINAL), 2dp" }
      - { name: incentive_component_usd, type: number, source: computed, default: 0.00, description: "Scorecard.incentive_usd on variant FINAL; always 0.00 on variant PROVISIONAL" }
      - { name: penalty_component_usd, type: number, source: computed, default: 0.00, description: "Scorecard.penalty_usd on variant FINAL; always 0.00 on variant PROVISIONAL" }
      - { name: brand_penalty_component_usd, type: number, source: computed, default: 0.00, description: "Scorecard.brand_penalty_usd on variant FINAL; always 0.00 on variant PROVISIONAL" }
      - { name: total_usd, type: number, source: computed, description: "Output of calculations.invoice_settlement, 2dp" }
      - { name: void_reason, type: enum, source: system, description: "MANUAL | AUTO_SCORECARD_STALE | AUTO_SUPERSEDED — set on VOIDED, else null" }
      - { name: issued_final_at, type: datetime, source: system, description: "Logical-clock instant of DRAFT→ISSUED; null before" }

  - name: BrandAudit
    parent: CrewBase
    common_fields: true
    fields:
      - { name: base_id, type: string, source: input, description: "FK -> CrewBase.id; base audited for brand and product consistency" }
      - { name: audit_scope, type: enum, source: input, description: "UNIFORM | CABIN_PRODUCT | SERVICE_SCRIPT | LIVERY" }
      - { name: findings_count, type: integer, source: input, description: "Number of brand-standard findings raised, >= 1" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR | CRITICAL — selects the per-finding penalty weight" }
      - { name: finding_status, type: enum, source: system, default: "OPEN", description: "OPEN | ACKNOWLEDGED | CLOSED — acknowledgement dimension, independent of remediation_status" }
      - { name: remediation_status, type: enum, source: system, default: "NOT_STARTED", description: "NOT_STARTED | IN_PROGRESS | VERIFIED — remediation dimension, independent of finding_status" }
      - { name: evidence_ref, type: string, source: system, description: "Remediation evidence reference, else null" }

  - name: ExtensionNegotiation
    parent: Agreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> Agreement.id; the CPA whose term is being renegotiated" }
      - { name: round_index, type: integer, source: system, description: "= Agreement.extension_round_count after this offer was opened" }
      - { name: proposed_term_end_date, type: string, source: input, description: "Mainline's proposed new term end, YYYY-MM-DD; MUST be > Agreement.term_end_date" }
      - { name: proposed_block_hour_rate_usd, type: number, source: input, description: "Mainline's proposed block-hour rate, 2dp, > 0" }
      - { name: counter_term_end_date, type: string, source: system, description: "Regional carrier's counter term end, else null" }
      - { name: counter_block_hour_rate_usd, type: number, source: system, description: "Regional carrier's counter block-hour rate, 2dp, else null" }
      - { name: status, type: enum, source: system, default: "OFFERED", description: "OFFERED | COUNTERED | ACCEPTED | WITHDRAWN" }
      - { name: counter_round, type: integer, source: system, default: 0, description: "Count of OFFERED→COUNTERED loops taken; capped by MAX_COUNTER_ROUNDS" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Agreement
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /cpa/agreements/{agreementId}/activate"
        actor: CPAAdministrator
        preconditions:
          - "status == DRAFT"
          - "at least one CrewBase exists with agreement_id == this.id AND lifecycle_status == ACTIVE"
        side_effects:
          - "activated_at := logical clock now"
          - "increments Agreement.version by 1"

      - from: ACTIVE
        to: EXTENSION_PENDING
        trigger: "POST /cpa/agreements/{agreementId}/extension-negotiations"
        actor: MainlineScheduler
        preconditions:
          - "status == ACTIVE"
          - "expected_agreement_version == Agreement.version (concurrency_rules[extension-offer-stale-agreement])"
          - "proposed_term_end_date > Agreement.term_end_date"
        side_effects:
          - "creates ExtensionNegotiation in status OFFERED with round_index := Agreement.extension_round_count + 1, counter_round = 0"
          - "every pre-existing ExtensionNegotiation of this agreement with status IN {OFFERED, COUNTERED} is superseded to WITHDRAWN"
          - "Agreement.extension_round_count += 1"
          - "increments Agreement.version by 1"

      - from: EXTENSION_PENDING
        to: ACTIVE
        trigger: "POST /cpa/extension-negotiations/{negotiationId}/accept"
        actor: MainlineScheduler | RegionalOpsController
        preconditions:
          - "status == EXTENSION_PENDING"
          - "the negotiation's status IN {OFFERED, COUNTERED}"
        side_effects:
          - "Agreement.term_end_date := negotiation.counter_term_end_date when the negotiation was COUNTERED, else negotiation.proposed_term_end_date"
          - "Agreement.block_hour_rate_usd := negotiation.counter_block_hour_rate_usd when the negotiation was COUNTERED, else negotiation.proposed_block_hour_rate_usd"
          - "the negotiation moves OFFERED|COUNTERED → ACCEPTED"
          - "increments Agreement.version by 1"
        note: "Rate change is prospective only: already-created Invoice rows keep their computed components."

      - from: EXTENSION_PENDING
        to: ACTIVE
        trigger: "POST /cpa/extension-negotiations/{negotiationId}/withdraw"
        actor: MainlineScheduler
        preconditions:
          - "status == EXTENSION_PENDING"
          - "the negotiation's status IN {OFFERED, COUNTERED}"
        side_effects:
          - "the negotiation moves OFFERED|COUNTERED → WITHDRAWN"
          - "Agreement.term_end_date and Agreement.block_hour_rate_usd unchanged"
          - "increments Agreement.version by 1"
        note: "ACTIVE→EXTENSION_PENDING→ACTIVE is the negotiation loop; extension_round_count is monotone and never decremented."

      - from: ACTIVE
        to: EXPIRED
        trigger: "system (POST /cpa/_clock/set_current_utc advances the logical clock past term_end_date)"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "date(new logical clock) > term_end_date"
        side_effects:
          - "every ScheduleCycle of this agreement with status == PLANNED is left untouched but can no longer be opened (validations[priority=20])"
          - "increments Agreement.version by 1"
        note: "Agreements are swept in created_at ASC order so the observable result is order-independent."

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /cpa/agreements/{agreementId}/terminate"
        actor: CPAAdministrator
        preconditions:
          - "status IN {ACTIVE, EXTENSION_PENDING}"
          - "no ScheduleCycle of this agreement has status == OPEN"
        side_effects:
          - "every CrewBase of this agreement moves lifecycle_status ACTIVE → CLOSED (cascade hop 1)"
          - "because each of those bases is now CLOSED, every Aircraft with assigned_base_id == that base AND status == PENDING_INDUCTION moves to WITHDRAWN (cascade hop 2, caused by hop 1)"
          - "increments Agreement.version by 1"

      - from: EXTENSION_PENDING
        to: TERMINATED
        trigger: "POST /cpa/agreements/{agreementId}/terminate"
        actor: CPAAdministrator
        preconditions:
          - "status IN {ACTIVE, EXTENSION_PENDING}"
          - "no ScheduleCycle of this agreement has status == OPEN"
        side_effects:
          - "same cascade as ACTIVE→TERMINATED"
          - "every ExtensionNegotiation with status IN {OFFERED, COUNTERED} moves to WITHDRAWN"
          - "increments Agreement.version by 1"

  - entity: CrewBase
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "system (agreement termination cascade)"
        actor: system
        preconditions:
          - "the parent Agreement is moving to TERMINATED"
        side_effects:
          - "PENDING_INDUCTION aircraft assigned to this base move to WITHDRAWN"
          - "increments CrewBase.version by 1"
        note: |
          staffing_posture (STAFFED | SHORT | CRITICAL) and allocatable_aircraft_count are
          computed dimensions recomputed on every Pilot status change and every Aircraft
          assigned_aircraft_count change; they are NOT lifecycle states.

  - entity: Aircraft
    initial_state: PENDING_INDUCTION
    terminal_states: [TRANSITIONED, WITHDRAWN]
    transitions:
      - from: PENDING_INDUCTION
        to: IN_SERVICE
        trigger: "POST /cpa/aircraft/{aircraftId}/induct"
        actor: RegionalOpsController
        preconditions:
          - "status == PENDING_INDUCTION"
          - "Agreement.status == ACTIVE"
          - "CrewBase.lifecycle_status == ACTIVE"
          - "(CrewBase.assigned_aircraft_count + 1) * CrewBase.pilots_required_per_aircraft <= CrewBase.line_qualified_pilot_count — else ERR_BASE_UNDERSTAFFED (cross-entity dependency Aircraft→CrewBase)"
          - "CrewBase.assigned_aircraft_count + 1 <= CrewBase.aircraft_allocation_cap — else ERR_FLEET_ALLOCATION_EXCEEDED"
        side_effects:
          - "inducted_at := logical clock now"
          - "CrewBase.assigned_aircraft_count += 1, then required_pilot_count / headcount_shortfall / pipeline_shortfall / staffing_posture / allocatable_aircraft_count are recomputed"
          - "increments Aircraft.version by 1 and CrewBase.version by 1"

      - from: IN_SERVICE
        to: GROUNDED_STAFFING
        trigger: "system (a CrewBase staffing recompute leaves assigned_aircraft_count > allocatable_aircraft_count)"
        actor: system
        preconditions:
          - "status == IN_SERVICE"
          - "CrewBase.assigned_aircraft_count > CrewBase.allocatable_aircraft_count"
        side_effects:
          - "grounded_reason := STAFFING_SHORTFALL"
          - "increments Aircraft.version by 1"
        note: |
          Selector: candidate set = Aircraft with assigned_base_id == base.id AND status == IN_SERVICE;
          ranking = created_at DESC (most recently inducted tails are grounded first);
          tie-break when created_at ties = tail_number ASC (lexicographic);
          the server grounds exactly (assigned_aircraft_count - allocatable_aircraft_count) tails;
          empty candidate set = no-op (no error).

      - from: GROUNDED_STAFFING
        to: IN_SERVICE
        trigger: "system (a CrewBase staffing recompute leaves allocatable_aircraft_count >= assigned_aircraft_count)"
        actor: system
        preconditions:
          - "status == GROUNDED_STAFFING"
          - "count(Aircraft with assigned_base_id == base.id AND status == IN_SERVICE) < CrewBase.allocatable_aircraft_count"
        side_effects:
          - "grounded_reason := null"
          - "increments Aircraft.version by 1"
        note: |
          Selector: candidate set = Aircraft with assigned_base_id == base.id AND status == GROUNDED_STAFFING;
          ranking = created_at ASC (longest-grounded tails return first); tie-break = tail_number ASC;
          restored count = allocatable_aircraft_count - count(IN_SERVICE at that base).
          IN_SERVICE→GROUNDED_STAFFING→IN_SERVICE is a true loop driven by crew supply.

      - from: IN_SERVICE
        to: TRANSITION_PENDING
        trigger: "POST /cpa/aircraft/{aircraftId}/transition"
        actor: CPAAdministrator
        preconditions:
          - "status IN {IN_SERVICE, GROUNDED_STAFFING}"
          - "no FlightLeg exists with aircraft_id == this.id AND status == SCHEDULED — else ERR_AIRCRAFT_HAS_OPEN_LEGS"
        side_effects:
          - "transition_reason and target_ownership := request values"
          - "CrewBase.assigned_aircraft_count -= 1, then the base's staffing fields are recomputed, which may restore GROUNDED_STAFFING tails at that base"
          - "increments Aircraft.version by 1 and CrewBase.version by 1"

      - from: GROUNDED_STAFFING
        to: TRANSITION_PENDING
        trigger: "POST /cpa/aircraft/{aircraftId}/transition"
        actor: CPAAdministrator
        preconditions:
          - "status IN {IN_SERVICE, GROUNDED_STAFFING}"
          - "no FlightLeg exists with aircraft_id == this.id AND status == SCHEDULED"
        side_effects:
          - "same as IN_SERVICE→TRANSITION_PENDING; grounded_reason := null"
          - "increments Aircraft.version by 1 and CrewBase.version by 1"

      - from: TRANSITION_PENDING
        to: TRANSITIONED
        trigger: "POST /cpa/aircraft/{aircraftId}/complete-transition"
        actor: CPAAdministrator
        preconditions:
          - "status == TRANSITION_PENDING"
        side_effects:
          - "ownership := target_ownership (fleet-renewal ownership flip)"
          - "increments Aircraft.version by 1"

      - from: PENDING_INDUCTION
        to: WITHDRAWN
        trigger: "system (CrewBase ACTIVE→CLOSED cascade from agreement termination)"
        actor: system
        preconditions:
          - "status == PENDING_INDUCTION"
          - "the assigned CrewBase has just moved to CLOSED"
        side_effects:
          - "increments Aircraft.version by 1"

  - entity: Pilot
    initial_state: PIPELINE
    terminal_states: [ATTRITED_TO_MAINLINE, RESIGNED]
    transitions:
      - from: PIPELINE
        to: IN_TRAINING
        trigger: "POST /cpa/pilots/{pilotId}/advance (to_status = IN_TRAINING)"
        actor: BaseChiefPilot
        preconditions:
          - "status == PIPELINE"
          - "X-User-ID == Pilot.base_id (BaseChiefPilot owns the base)"
          - "CrewBase.lifecycle_status == ACTIVE"
        side_effects:
          - "CrewBase.in_training_pilot_count += 1, then pipeline_shortfall and allocatable_aircraft_count are recomputed, which may restore GROUNDED_STAFFING tails"
          - "increments Pilot.version by 1 and CrewBase.version by 1"

      - from: IN_TRAINING
        to: LINE_QUALIFIED
        trigger: "POST /cpa/pilots/{pilotId}/advance (to_status = LINE_QUALIFIED)"
        actor: BaseChiefPilot
        preconditions:
          - "status == IN_TRAINING"
          - "X-User-ID == Pilot.base_id"
        side_effects:
          - "CrewBase.in_training_pilot_count -= 1 and line_qualified_pilot_count += 1, then headcount_shortfall / pipeline_shortfall / staffing_posture / allocatable_aircraft_count are recomputed, which may restore GROUNDED_STAFFING tails"
          - "increments Pilot.version by 1 and CrewBase.version by 1"

      - from: LINE_QUALIFIED
        to: ATTRITED_TO_MAINLINE
        trigger: "POST /cpa/pilots/{pilotId}/attrite (destination = MAINLINE)"
        actor: BaseChiefPilot
        preconditions:
          - "status == LINE_QUALIFIED"
          - "X-User-ID == Pilot.base_id"
        side_effects:
          - "attrition_destination := MAINLINE"
          - "CrewBase.line_qualified_pilot_count -= 1 (cascade hop 1)"
          - "because that count fell, CrewBase.headcount_shortfall / staffing_posture / pipeline_shortfall / allocatable_aircraft_count are recomputed (cascade hop 2, caused by hop 1)"
          - "because allocatable_aircraft_count fell below assigned_aircraft_count, IN_SERVICE tails at that base are grounded to GROUNDED_STAFFING per the Aircraft selector (cascade hop 3, caused by hop 2)"
          - "increments Pilot.version by 1, CrewBase.version by 1, and each grounded Aircraft.version by 1"

      - from: PIPELINE
        to: RESIGNED
        trigger: "POST /cpa/pilots/{pilotId}/attrite (destination = OTHER)"
        actor: BaseChiefPilot
        preconditions:
          - "status IN {PIPELINE, IN_TRAINING, LINE_QUALIFIED}"
          - "X-User-ID == Pilot.base_id"
        side_effects:
          - "attrition_destination := OTHER"
          - "the base's pilot counters for the pilot's prior status are decremented and staffing fields recomputed"
          - "increments Pilot.version by 1 and CrewBase.version by 1"

      - from: IN_TRAINING
        to: RESIGNED
        trigger: "POST /cpa/pilots/{pilotId}/attrite (destination = OTHER)"
        actor: BaseChiefPilot
        preconditions:
          - "status IN {PIPELINE, IN_TRAINING, LINE_QUALIFIED}"
          - "X-User-ID == Pilot.base_id"
        side_effects:
          - "CrewBase.in_training_pilot_count -= 1 and staffing fields recomputed"
          - "increments Pilot.version by 1 and CrewBase.version by 1"

      - from: LINE_QUALIFIED
        to: RESIGNED
        trigger: "POST /cpa/pilots/{pilotId}/attrite (destination = OTHER)"
        actor: BaseChiefPilot
        preconditions:
          - "status IN {PIPELINE, IN_TRAINING, LINE_QUALIFIED}"
          - "X-User-ID == Pilot.base_id"
        side_effects:
          - "same three-hop cascade as LINE_QUALIFIED→ATTRITED_TO_MAINLINE"
          - "increments Pilot.version by 1, CrewBase.version by 1, and each grounded Aircraft.version by 1"

  - entity: ScheduleCycle
    initial_state: PLANNED
    terminal_states: []
    transitions:
      - from: PLANNED
        to: OPEN
        trigger: "POST /cpa/schedule-cycles/{cycleId}/open"
        actor: MainlineScheduler
        preconditions:
          - "status == PLANNED"
          - "Agreement.status == ACTIVE"
        side_effects:
          - "increments ScheduleCycle.version by 1"

      - from: OPEN
        to: CLOSED
        trigger: "POST /cpa/schedule-cycles/{cycleId}/close"
        actor: MainlineScheduler
        preconditions:
          - "status == OPEN"
          - "open_leg_count == 0 — else ERR_CYCLE_HAS_OPEN_LEGS"
        side_effects:
          - "closed_at := logical clock now"
          - "passthrough_settlement_usd := calculations.passthrough_reconciliation_settlement"
          - "creates exactly one Scorecard in status PUBLISHED whose completion_factor_pct / on_time_arrival_pct / mishandled_bags_per_1000 / point fields / incentive_usd / penalty_usd / brand_penalty_usd are written from calculations.completion_factor, calculations.on_time_arrival, calculations.mishandled_bag_rate, calculations.performance_incentive_penalty and calculations.brand_consistency_penalty"
          - "increments ScheduleCycle.version by 1"
        note: "CancellationClaims still un-FINALIZED at close are attributed CONTROLLABLE via effective_classification."

      - from: CLOSED
        to: SETTLED
        trigger: "POST /cpa/invoices/{invoiceId}/issue-final"
        actor: CPAAdministrator
        preconditions:
          - "status == CLOSED"
          - "the invoice has variant == FINAL AND status == DRAFT"
        side_effects:
          - "Agreement.settled_to_date_usd += Invoice.total_usd and Agreement.open_invoice_count -= 1"
          - "increments ScheduleCycle.version by 1 and Agreement.version by 1"

      - from: SETTLED
        to: CLOSED
        trigger: "POST /cpa/invoices/{invoiceId}/void, or system (Scorecard PUBLISHED→STALE cascade voids the ISSUED invoice)"
        actor: CPAAdministrator | system
        preconditions:
          - "status == SETTLED"
          - "the voided invoice had status == ISSUED"
        side_effects:
          - "Agreement.settled_to_date_usd -= Invoice.total_usd (compensating invariant: the quantity returns to its pre-issue value)"
          - "increments ScheduleCycle.version by 1 and Agreement.version by 1"
        note: "CLOSED→SETTLED→CLOSED is a revert loop; settled_to_date_usd is the conserved quantity."

  - entity: FlightLeg
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /cpa/flight-legs/{legId}/complete"
        actor: RegionalOpsController
        preconditions:
          - "status == SCHEDULED"
          - "ScheduleCycle.status == OPEN"
          - "Aircraft.status == IN_SERVICE — a GROUNDED_STAFFING or TRANSITION_PENDING tail cannot report a completion (ERR_AIRCRAFT_NOT_AVAILABLE)"
          - "actual_arrival_utc > scheduled_departure_utc"
        side_effects:
          - "actual_block_hours, actual_arrival_utc, enplaned_bags, mishandled_bags := request values"
          - "on_time := actual_arrival_utc <= scheduled_arrival_utc + ON_TIME_GRACE_MINUTES"
          - "leg_variable_payment_usd := round2(actual_block_hours * Agreement.block_hour_rate_usd) + Agreement.departure_rate_usd"
          - "ScheduleCycle.recorded_completed_legs += 1, open_leg_count -= 1, credited_block_hours += actual_block_hours, enplaned_bags_total += enplaned_bags, mishandled_bags_total += mishandled_bags, on_time_leg_count += 1 when on_time"
          - "increments FlightLeg.version by 1 and ScheduleCycle.version by 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /cpa/flight-legs/{legId}/cancel"
        actor: RegionalOpsController
        preconditions:
          - "status == SCHEDULED"
          - "ScheduleCycle.status == OPEN"
        side_effects:
          - "cancel_cause_code := request cause_code"
          - "creates exactly one CancellationClaim in status OPEN with leg_id, cycle_id, cause_code copied, classification = null, effective_classification = CONTROLLABLE, dispute_round = 0"
          - "because that claim's effective_classification is CONTROLLABLE, ScheduleCycle.cancelled_controllable_count += 1, then metric_completed_departures and departure_ledger_total are recomputed"
          - "ScheduleCycle.open_leg_count -= 1"
          - "increments FlightLeg.version by 1 and ScheduleCycle.version by 1"

      - from: CANCELLED
        to: SCHEDULED
        trigger: "POST /cpa/flight-legs/{legId}/reinstate"
        actor: RegionalOpsController
        preconditions:
          - "status == CANCELLED"
          - "ScheduleCycle.status == OPEN"
          - "the leg's CancellationClaim has status != FINALIZED — else ERR_CLAIM_ALREADY_FINALIZED"
        side_effects:
          - "reinstate_count += 1, cancel_cause_code := null"
          - "the leg's CancellationClaim moves OPEN|CLASSIFIED|DISPUTED → VOIDED"
          - "because that claim is VOIDED it leaves the counter filter set, so ScheduleCycle.cancelled_controllable_count -= 1 and metric_completed_departures / departure_ledger_total are recomputed back to their pre-cancel values"
          - "ScheduleCycle.open_leg_count += 1"
          - "increments FlightLeg.version by 1 and ScheduleCycle.version by 1"
        note: "SCHEDULED→CANCELLED→SCHEDULED is the compensating pair for the departure-ledger invariant."

  - entity: CancellationClaim
    initial_state: OPEN
    terminal_states: [FINALIZED, VOIDED]
    transitions:
      - from: OPEN
        to: CLASSIFIED
        trigger: "POST /cpa/cancellation-claims/{claimId}/classify"
        actor: MainlineScheduler
        preconditions:
          - "status IN {OPEN, DISPUTED}"
        side_effects:
          - "classification := request classification"
          - "effective_classification stays CONTROLLABLE because status != FINALIZED, so ScheduleCycle counters do NOT move yet"
          - "increments CancellationClaim.version by 1"

      - from: CLASSIFIED
        to: DISPUTED
        trigger: "POST /cpa/cancellation-claims/{claimId}/dispute"
        actor: RegionalOpsController
        preconditions:
          - "status == CLASSIFIED"
          - "dispute_round < MAX_DISPUTE_ROUNDS — else ERR_DISPUTE_ROUNDS_EXHAUSTED"
        side_effects:
          - "dispute_round += 1, dispute_note := request dispute_note"
          - "increments CancellationClaim.version by 1"

      - from: DISPUTED
        to: CLASSIFIED
        trigger: "POST /cpa/cancellation-claims/{claimId}/classify"
        actor: MainlineScheduler
        preconditions:
          - "status IN {OPEN, DISPUTED}"
        side_effects:
          - "classification := request classification (may overwrite the previous value)"
          - "increments CancellationClaim.version by 1"
        note: "CLASSIFIED→DISPUTED→CLASSIFIED is the negotiation loop, bounded by MAX_DISPUTE_ROUNDS = 2."

      - from: CLASSIFIED
        to: FINALIZED
        trigger: "POST /cpa/cancellation-claims/{claimId}/finalize"
        actor: CPAAdministrator
        preconditions:
          - "status == CLASSIFIED"
          - "classification != null"
        side_effects:
          - "effective_classification := classification (cascade hop 1)"
          - "because effective_classification changed, when classification == UNCONTROLLABLE the parent ScheduleCycle moves cancelled_controllable_count -= 1 and cancelled_uncontrollable_count += 1, then metric_completed_departures / departure_ledger_total are recomputed (cascade hop 2, caused by hop 1)"
          - "because those cycle counters changed, any Scorecard of that cycle with status == PUBLISHED moves PUBLISHED → STALE (cascade hop 3, caused by hop 2)"
          - "because that Scorecard went STALE, every Invoice of that cycle with status IN {DRAFT, ISSUED} moves to VOIDED with void_reason = AUTO_SCORECARD_STALE (cascade hop 4, caused by hop 3)"
          - "because an ISSUED invoice was voided, Agreement.settled_to_date_usd -= Invoice.total_usd and ScheduleCycle moves SETTLED → CLOSED; for each voided DRAFT invoice Agreement.open_invoice_count -= 1 (cascade hop 5, caused by hop 4)"
          - "increments CancellationClaim.version, ScheduleCycle.version, Scorecard.version, each affected Invoice.version and Agreement.version by 1"

      - from: OPEN
        to: VOIDED
        trigger: "system (FlightLeg CANCELLED→SCHEDULED reinstatement)"
        actor: system
        preconditions:
          - "status IN {OPEN, CLASSIFIED, DISPUTED}"
        side_effects:
          - "leaves the ScheduleCycle counter filter set, so cancelled_controllable_count -= 1"
          - "increments CancellationClaim.version by 1"

      - from: CLASSIFIED
        to: VOIDED
        trigger: "system (FlightLeg CANCELLED→SCHEDULED reinstatement)"
        actor: system
        preconditions:
          - "status IN {OPEN, CLASSIFIED, DISPUTED}"
        side_effects:
          - "same as OPEN→VOIDED"
          - "increments CancellationClaim.version by 1"

      - from: DISPUTED
        to: VOIDED
        trigger: "system (FlightLeg CANCELLED→SCHEDULED reinstatement)"
        actor: system
        preconditions:
          - "status IN {OPEN, CLASSIFIED, DISPUTED}"
        side_effects:
          - "same as OPEN→VOIDED"
          - "increments CancellationClaim.version by 1"

  - entity: PassThroughClaim
    initial_state: SUBMITTED
    terminal_states: [RECONCILED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: ACTUAL_SUBMITTED
        trigger: "POST /cpa/pass-through-claims/{claimId}/submit-actual"
        actor: RegionalOpsController | CPAAdministrator
        preconditions:
          - "status == SUBMITTED"
          - "ScheduleCycle.status IN {OPEN, CLOSED}"
        side_effects:
          - "actual_amount_usd, supporting_doc_ref := request values"
          - "variance_usd := round2(actual_amount_usd - estimated_amount_usd)"
          - "actual_submitted_by_user_id := X-User-ID of this request"
          - "increments PassThroughClaim.version by 1"

      - from: ACTUAL_SUBMITTED
        to: RECONCILED
        trigger: "POST /cpa/pass-through-claims/{claimId}/reconcile (decision = APPROVE)"
        actor: CPAAdministrator
        preconditions:
          - "status == ACTUAL_SUBMITTED"
          - "X-User-ID != actual_submitted_by_user_id — else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "allowed_amount_usd := Step 1 of calculations.passthrough_reconciliation_settlement"
          - "reconciled_by_user_id := X-User-ID"
          - "ScheduleCycle.passthrough_settlement_usd recomputed via Steps 2–5"
          - "increments PassThroughClaim.version by 1 and ScheduleCycle.version by 1"

      - from: ACTUAL_SUBMITTED
        to: REJECTED
        trigger: "POST /cpa/pass-through-claims/{claimId}/reconcile (decision = REJECT)"
        actor: CPAAdministrator
        preconditions:
          - "status == ACTUAL_SUBMITTED"
          - "X-User-ID != actual_submitted_by_user_id"
        side_effects:
          - "allowed_amount_usd stays null; the claim is excluded from both estimated_passthrough_total_usd and the Step 2 base total"
          - "reconciled_by_user_id := X-User-ID"
          - "ScheduleCycle.estimated_passthrough_total_usd and passthrough_settlement_usd recomputed"
          - "increments PassThroughClaim.version by 1 and ScheduleCycle.version by 1"

  - entity: Scorecard
    initial_state: PUBLISHED
    terminal_states: []
    transitions:
      - from: PUBLISHED
        to: STALE
        trigger: "system (a FINALIZED CancellationClaim changed the parent cycle's cancellation counters after close, or a BrandAudit under the same agreement was created or closed and thereby changed the brand_consistency_penalty input set)"
        actor: system
        preconditions:
          - "status == PUBLISHED"
          - "the parent ScheduleCycle's cancelled_controllable_count or cancelled_uncontrollable_count changed, OR a BrandAudit whose base_id belongs to the same agreement entered the brand_consistency_penalty input set (creation) or left it (finding_status → CLOSED)"
        side_effects:
          - "every Invoice of the cycle with status IN {DRAFT, ISSUED} is voided with void_reason = AUTO_SCORECARD_STALE"
          - "increments Scorecard.version by 1"

      - from: STALE
        to: PUBLISHED
        trigger: "POST /cpa/scorecards/{scorecardId}/recompute"
        actor: CPAAdministrator
        preconditions:
          - "status IN {PUBLISHED, STALE}"
        side_effects:
          - "all metric, point, incentive, penalty and brand_penalty fields recomputed from the cycle's current counters"
          - "recompute_count += 1"
          - "increments Scorecard.version by 1"

      - from: PUBLISHED
        to: PUBLISHED
        trigger: "POST /cpa/scorecards/{scorecardId}/recompute"
        actor: CPAAdministrator
        preconditions:
          - "status IN {PUBLISHED, STALE}"
        side_effects:
          - "recomputation is idempotent when no counter changed: every metric field keeps its value"
          - "recompute_count += 1"
          - "increments Scorecard.version by 1"

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /cpa/invoices/{invoiceId}/issue-final"
        actor: CPAAdministrator
        preconditions:
          - "status == DRAFT"
          - "variant == FINAL — else ERR_INVOICE_VARIANT_NOT_FINAL"
          - "ScheduleCycle.status == CLOSED"
          - "every PassThroughClaim of the cycle has status IN {RECONCILED, REJECTED} — else ERR_PASSTHROUGH_UNRECONCILED"
          - "the cycle's Scorecard has status == PUBLISHED — else ERR_SCORECARD_STALE"
        side_effects:
          - "issued_final_at := logical clock now"
          - "ScheduleCycle moves CLOSED → SETTLED"
          - "Agreement.settled_to_date_usd += total_usd and Agreement.open_invoice_count -= 1"
          - "increments Invoice.version, ScheduleCycle.version and Agreement.version by 1"

      - from: DRAFT
        to: VOIDED
        trigger: "POST /cpa/invoices/{invoiceId}/void, or system (supersede on a newer invoice for the same cycle, or Scorecard PUBLISHED→STALE)"
        actor: CPAAdministrator | system
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "void_reason := MANUAL (explicit call) | AUTO_SUPERSEDED (newer invoice created) | AUTO_SCORECARD_STALE (stale scorecard cascade)"
          - "Agreement.open_invoice_count -= 1"
          - "increments Invoice.version and Agreement.version by 1"

      - from: ISSUED
        to: VOIDED
        trigger: "POST /cpa/invoices/{invoiceId}/void, or system (Scorecard PUBLISHED→STALE)"
        actor: CPAAdministrator | system
        preconditions:
          - "status == ISSUED"
        side_effects:
          - "void_reason := MANUAL | AUTO_SCORECARD_STALE"
          - "Agreement.settled_to_date_usd -= total_usd (returns the conserved quantity to its pre-issue value)"
          - "ScheduleCycle moves SETTLED → CLOSED"
          - "increments Invoice.version, ScheduleCycle.version and Agreement.version by 1"

  - entity: BrandAudit
    initial_state: "finding_status=OPEN & remediation_status=NOT_STARTED"
    terminal_states: ["finding_status=CLOSED & remediation_status=VERIFIED"]
    transitions:
      - from: "finding_status=OPEN"
        to: "finding_status=ACKNOWLEDGED"
        trigger: "POST /cpa/brand-audits/{auditId}/acknowledge"
        actor: RegionalOpsController
        preconditions:
          - "finding_status == OPEN"
        side_effects:
          - "remediation_status is untouched — the two dimensions evolve independently"
          - "increments BrandAudit.version by 1"

      - from: "remediation_status=NOT_STARTED"
        to: "remediation_status=IN_PROGRESS"
        trigger: "POST /cpa/brand-audits/{auditId}/remediation (to_remediation_status = IN_PROGRESS)"
        actor: RegionalOpsController
        preconditions:
          - "remediation_status == NOT_STARTED"
        side_effects:
          - "finding_status is untouched — remediation may start before or after acknowledgement"
          - "increments BrandAudit.version by 1"

      - from: "remediation_status=IN_PROGRESS"
        to: "remediation_status=VERIFIED"
        trigger: "POST /cpa/brand-audits/{auditId}/remediation (to_remediation_status = VERIFIED)"
        actor: RegionalOpsController
        preconditions:
          - "remediation_status == IN_PROGRESS"
          - "evidence_ref is present in the request — else ERR_EVIDENCE_REQUIRED"
        side_effects:
          - "evidence_ref := request value"
          - "the audit leaves the calculations.brand_consistency_penalty filter set, so any later Scorecard computation for this base's agreement excludes its findings_count"
          - "increments BrandAudit.version by 1"

      - from: "finding_status=ACKNOWLEDGED"
        to: "finding_status=CLOSED"
        trigger: "POST /cpa/brand-audits/{auditId}/close"
        actor: BrandAuditor
        preconditions:
          - "finding_status == ACKNOWLEDGED"
          - "remediation_status == VERIFIED — else ERR_REMEDIATION_NOT_VERIFIED (cross-dimension guard)"
        side_effects:
          - "increments BrandAudit.version by 1"

  - entity: ExtensionNegotiation
    initial_state: OFFERED
    terminal_states: [ACCEPTED, WITHDRAWN]
    transitions:
      - from: OFFERED
        to: COUNTERED
        trigger: "POST /cpa/extension-negotiations/{negotiationId}/counter"
        actor: RegionalOpsController
        preconditions:
          - "status == OFFERED"
          - "Agreement.status == EXTENSION_PENDING"
          - "counter_round < MAX_COUNTER_ROUNDS — else ERR_COUNTER_ROUNDS_EXHAUSTED"
        side_effects:
          - "counter_term_end_date, counter_block_hour_rate_usd := request values; counter_round += 1"
          - "increments ExtensionNegotiation.version by 1"

      - from: COUNTERED
        to: OFFERED
        trigger: "POST /cpa/extension-negotiations/{negotiationId}/revise-offer"
        actor: MainlineScheduler
        preconditions:
          - "status == COUNTERED"
          - "Agreement.status == EXTENSION_PENDING"
        side_effects:
          - "proposed_term_end_date, proposed_block_hour_rate_usd := request values"
          - "increments ExtensionNegotiation.version by 1"
        note: "OFFERED→COUNTERED→OFFERED is the bargaining loop, bounded by MAX_COUNTER_ROUNDS = 2."

      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /cpa/extension-negotiations/{negotiationId}/accept"
        actor: RegionalOpsController
        preconditions:
          - "status == OFFERED"
          - "the acting role is RegionalOpsController — the party that authored the standing offer may not accept it (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Agreement.term_end_date := proposed_term_end_date, Agreement.block_hour_rate_usd := proposed_block_hour_rate_usd, Agreement.status EXTENSION_PENDING → ACTIVE"
          - "increments ExtensionNegotiation.version by 1 and Agreement.version by 1"

      - from: COUNTERED
        to: ACCEPTED
        trigger: "POST /cpa/extension-negotiations/{negotiationId}/accept"
        actor: MainlineScheduler
        preconditions:
          - "status == COUNTERED"
          - "the acting role is MainlineScheduler — the counter's author may not accept its own counter (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Agreement.term_end_date := counter_term_end_date, Agreement.block_hour_rate_usd := counter_block_hour_rate_usd, Agreement.status EXTENSION_PENDING → ACTIVE"
          - "increments ExtensionNegotiation.version by 1 and Agreement.version by 1"

      - from: OFFERED
        to: WITHDRAWN
        trigger: "POST /cpa/extension-negotiations/{negotiationId}/withdraw, or system (superseded by a newer offer on the same agreement)"
        actor: MainlineScheduler | system
        preconditions:
          - "status IN {OFFERED, COUNTERED}"
        side_effects:
          - "on the explicit call, Agreement.status EXTENSION_PENDING → ACTIVE with term_end_date and block_hour_rate_usd unchanged"
          - "increments ExtensionNegotiation.version by 1"

      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /cpa/extension-negotiations/{negotiationId}/withdraw, or system (superseded by a newer offer on the same agreement)"
        actor: MainlineScheduler | system
        preconditions:
          - "status IN {OFFERED, COUNTERED}"
        side_effects:
          - "same as OFFERED→WITHDRAWN"
          - "increments ExtensionNegotiation.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules  (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: extension-offer-stale-agreement
    parent_entity: Agreement
    write_endpoint: "POST /cpa/agreements/{agreementId}/extension-negotiations"
    occ_field: "expected_agreement_version"
    description: |
      Opening an extension offer against an Agreement whose version has advanced
      since the client last read it is rejected with a stale-version conflict.
      A successful offer legitimately supersedes every standing OFFERED/COUNTERED
      negotiation to WITHDRAWN and bumps Agreement.extension_round_count, so a
      writer holding an older Agreement.version is reasoning about a term sheet
      that no longer exists.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

  - rule_id: invoice-create-stale-cycle
    parent_entity: ScheduleCycle
    write_endpoint: "POST /cpa/schedule-cycles/{cycleId}/invoices"
    occ_field: "expected_schedule_cycle_version"
    description: |
      Creating an Invoice against a ScheduleCycle whose version has advanced since
      the client last read it is rejected with a stale-version conflict. A new
      invoice legitimately supersedes the cycle's standing DRAFT invoice
      (void_reason = AUTO_SUPERSEDED), so a writer whose view of the cycle predates
      a counter change, a pass-through reconciliation or an earlier invoice would
      otherwise bill a settlement the cycle no longer supports.
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: variable_flight_payment
    trigger: "On FlightLeg SCHEDULED→COMPLETED (per-leg field) and on Invoice creation (cycle roll-up for the selected variant)"
    algorithm: aggregation
    formula: |
      # ---- PINNED ROUNDING ORDER (mode (b) of §0.5 Rule 2) ----
      # Round the block-hour money PER LEG to cents, THEN sum the rounded legs.
      # The alternative reading (sum the unrounded products, round once at the
      # end) is explicitly WRONG here and yields a different cent total.
      per_leg_amount(leg) =
          round2(leg.<hours_field> * Agreement.block_hour_rate_usd)   # rounded here, per leg
        + Agreement.departure_rate_usd                                # already 2dp
      variable_component_usd = sum(per_leg_amount(leg) for leg in included_legs)
      # Legs are summed in scheduled_departure_utc ASC order; when two legs share
      # scheduled_departure_utc the order is created_at ASC. (Sum is order-free,
      # but the order is pinned so per-leg audit listings are deterministic.)
      # FlightLeg.leg_variable_payment_usd stores per_leg_amount(leg) for the
      # ACTUAL_BASIS variant only.
    input_set: |
      ACTUAL_BASIS: legs with cycle_id == cycle.id AND status == COMPLETED, hours_field = actual_block_hours.
      PLANNED_BASIS: legs with cycle_id == cycle.id AND status IN {SCHEDULED, COMPLETED}, hours_field = planned_block_hours.
      CANCELLED legs are excluded from both variants.
    constants:
      BLOCK_HOURS_PRECISION: 3
    precision: "per-leg amount 2 decimal places, round_half_up; the sum is exact over already-rounded 2dp addends"
    variants:
      - name: ACTUAL_BASIS
        when: "Invoice.variant == FINAL, and for FlightLeg.leg_variable_payment_usd"
        difference: "Uses actual_block_hours over COMPLETED legs only"
      - name: PLANNED_BASIS
        when: "Invoice.variant == PROVISIONAL"
        difference: "Uses planned_block_hours over SCHEDULED + COMPLETED legs, so still-open and later-cancelled legs are paid for provisionally"

  - name: completion_factor
    trigger: "On ScheduleCycle OPEN→CLOSED (Scorecard creation) and on POST /cpa/scorecards/{scorecardId}/recompute"
    algorithm: threshold
    formula: |
      eligible_departures = ScheduleCycle.published_departures
                          - ScheduleCycle.cancelled_uncontrollable_count
      if eligible_departures <= 0:
          completion_factor_pct = 100.00          # zero-set convention, pinned
      else:
          completion_factor_pct = round2(
              100 * (eligible_departures - ScheduleCycle.cancelled_controllable_count)
              / eligible_departures)
      # Uncontrollable cancellations are removed from BOTH numerator and
      # denominator (they neither help nor hurt); controllable cancellations are
      # removed from the numerator only. Claims not yet FINALIZED are counted as
      # CONTROLLABLE through CancellationClaim.effective_classification.
    input_set: "published_departures (input) plus the cycle's cancelled_controllable_count / cancelled_uncontrollable_count counters, which filter CancellationClaim by status and effective_classification as declared in §1.1"
    constants:
      ZERO_ELIGIBLE_RESULT_PCT: 100.00
    precision: "2 decimal places, round_half_up"

  - name: on_time_arrival
    trigger: "On ScheduleCycle OPEN→CLOSED and on POST /cpa/scorecards/{scorecardId}/recompute"
    algorithm: aggregation
    formula: |
      if ScheduleCycle.recorded_completed_legs == 0:
          on_time_arrival_pct = 100.00            # empty-set convention, pinned
      else:
          on_time_arrival_pct = round2(100 * ScheduleCycle.on_time_leg_count
                                       / ScheduleCycle.recorded_completed_legs)
      # A leg is on time when actual_arrival_utc <= scheduled_arrival_utc +
      # ON_TIME_GRACE_MINUTES. The boundary is INCLUSIVE: arriving exactly
      # 14:00 minutes late is on time; 14:01 is not.
    input_set: "FlightLeg rows with cycle_id == cycle.id AND status == COMPLETED; CANCELLED and SCHEDULED legs are excluded from both numerator and denominator"
    constants:
      ON_TIME_GRACE_MINUTES: 14
      EMPTY_SET_RESULT_PCT: 100.00
    precision: "2 decimal places, round_half_up"

  - name: mishandled_bag_rate
    trigger: "On ScheduleCycle OPEN→CLOSED and on POST /cpa/scorecards/{scorecardId}/recompute"
    algorithm: aggregation
    formula: |
      if ScheduleCycle.enplaned_bags_total == 0:
          mishandled_bags_per_1000 = 0.00         # zero-denominator convention, pinned
      else:
          mishandled_bags_per_1000 = round2(1000 * ScheduleCycle.mishandled_bags_total
                                            / ScheduleCycle.enplaned_bags_total)
    input_set: "FlightLeg rows with cycle_id == cycle.id AND status == COMPLETED"
    constants:
      ZERO_BAGS_RESULT: 0.00
    precision: "2 decimal places, round_half_up"

  - name: performance_incentive_penalty
    trigger: "On ScheduleCycle OPEN→CLOSED (Scorecard creation) and on POST /cpa/scorecards/{scorecardId}/recompute"
    algorithm: weighted_scoring
    formula: |
      # ---- mode (a) of §0.5 Rule 2: three metric inputs, tiered selection,
      # ---- a conditional forfeiture branch and a nested min/max cap chain.
      cf  = completion_factor_pct
      ota = on_time_arrival_pct
      bag = mishandled_bags_per_1000

      completion_factor_points = +3 if cf  >= CF_TIER_HIGH_PCT       # >= 99.00
                            else  0 if cf  >= CF_TIER_MID_PCT        # >= 97.50
                            else -4
      on_time_points_raw       = +2 if ota >= OTA_TIER_HIGH_PCT      # >= 85.00
                            else  0 if ota >= OTA_TIER_MID_PCT       # >= 80.00
                            else -3
      bag_points_raw           = +1 if bag <= BAG_TIER_LOW_PER_1000  # <= 3.00
                            else  0 if bag <= BAG_TIER_MID_PER_1000  # <= 5.50
                            else -2

      # Forfeiture branch: missing the completion-factor floor voids any positive
      # credit earned on the other two metrics (negatives still count).
      if completion_factor_points < 0:
          on_time_points = min(0, on_time_points_raw)
          bag_points     = min(0, bag_points_raw)
      else:
          on_time_points = on_time_points_raw
          bag_points     = bag_points_raw

      performance_points   = completion_factor_points + on_time_points + bag_points
      gross_performance_usd = round2(performance_points * POINT_VALUE_USD)

      if gross_performance_usd >= 0:
          revenue_cap  = round2(INCENTIVE_REVENUE_SHARE
                                * (Invoice-basis fixed_component_usd
                                   + ACTUAL_BASIS variable_component_usd))
          incentive_usd = min(gross_performance_usd,
                              Agreement.incentive_pool_cap_usd,
                              revenue_cap)
          penalty_usd   = 0.00
      else:
          incentive_usd = 0.00
          penalty_usd   = min(abs(gross_performance_usd),
                              Agreement.penalty_cap_usd)
      # fixed_component_usd and the ACTUAL_BASIS variable_component_usd used by
      # revenue_cap are the same expressions §1.1 declares on Invoice; they are
      # evaluated from current entity state, not read off an Invoice row, so the
      # Scorecard is well-defined before any invoice exists.
    input_set: "the three Scorecard metric fields for this cycle, plus Agreement.incentive_pool_cap_usd / penalty_cap_usd / fixed_monthly_fee_usd / aircraft_ownership_fee_usd / block_hour_rate_usd / departure_rate_usd and the cycle's COMPLETED legs"
    constants:
      CF_TIER_HIGH_PCT: 99.00
      CF_TIER_MID_PCT: 97.50
      OTA_TIER_HIGH_PCT: 85.00
      OTA_TIER_MID_PCT: 80.00
      BAG_TIER_LOW_PER_1000: 3.00
      BAG_TIER_MID_PER_1000: 5.50
      POINT_VALUE_USD: 12000.00
      INCENTIVE_REVENUE_SHARE: 0.05
    precision: "2 decimal places, round_half_up; points are integers"

  - name: brand_consistency_penalty
    trigger: "On ScheduleCycle OPEN→CLOSED and on POST /cpa/scorecards/{scorecardId}/recompute"
    algorithm: threshold
    formula: |
      exposed_audits = BrandAudit rows whose base_id is a CrewBase with
          agreement_id == cycle.agreement_id
          AND finding_status IN {OPEN, ACKNOWLEDGED}
          AND remediation_status IN {NOT_STARTED, IN_PROGRESS}
      raw = sum(audit.findings_count * SEVERITY_WEIGHT_USD[audit.severity]
                for audit in exposed_audits)
      brand_penalty_usd = min(round2(raw), BRAND_PENALTY_CAP_USD)
      # BOTH dimensions must still be exposed: an audit that is CLOSED on the
      # finding dimension OR VERIFIED on the remediation dimension leaves the set.
    input_set: "BrandAudit rows reachable from the cycle's agreement through CrewBase.agreement_id, filtered on both state dimensions as written above; audits are summed in created_at ASC order"
    constants:
      SEVERITY_WEIGHT_USD: { MINOR: 500.00, MAJOR: 2500.00, CRITICAL: 7500.00 }
      BRAND_PENALTY_CAP_USD: 25000.00
    precision: "2 decimal places, round_half_up"

  - name: passthrough_reconciliation_settlement
    trigger: "On PassThroughClaim ACTUAL_SUBMITTED→RECONCILED / →REJECTED, and on ScheduleCycle OPEN→CLOSED"
    algorithm: waterfall_allocation
    formula: |
      # ---- mode (c) of §0.5 Rule 2: the admin fee is keyed on a tier of the
      # ---- pass-through total, and the settlement total contains the admin fee.
      # ---- The evaluation order below is PINNED; the tier is chosen from the
      # ---- Step-2 value and is NEVER re-derived from the Step-5 value, even
      # ---- when adding the fee crosses the next tier boundary.
      # Step 1 — per claim, on reconciliation:
      if claim.category == FUEL:
          allowed_amount_usd = claim.actual_amount_usd            # uncapped pass-through
      else:
          cap = round2(claim.estimated_amount_usd
                       * (1 + CATEGORY_TOLERANCE[claim.category]))
          allowed_amount_usd = min(claim.actual_amount_usd, cap)
      # Step 2 — cycle base total over already-2dp addends, claims ordered created_at ASC:
      base_passthrough_total = sum(claim.allowed_amount_usd
                                   for claim in cycle claims with status == RECONCILED)
      # Step 3 — tier selection on the Step-2 value:
      admin_fee_rate = ADMIN_FEE_TIER_LOW_RATE  if base_passthrough_total <= ADMIN_TIER_1_USD
                  else ADMIN_FEE_TIER_MID_RATE  if base_passthrough_total <= ADMIN_TIER_2_USD
                  else ADMIN_FEE_TIER_HIGH_RATE
      # Step 4:
      admin_fee_usd = round2(base_passthrough_total * admin_fee_rate)
      # Step 5:
      passthrough_settlement_usd = base_passthrough_total + admin_fee_usd
    input_set: "PassThroughClaim rows with cycle_id == cycle.id AND status == RECONCILED; SUBMITTED, ACTUAL_SUBMITTED and REJECTED claims contribute 0.00"
    constants:
      CATEGORY_TOLERANCE: { FUEL: null, AIRPORT_FEES: 0.10, INSURANCE: 0.05 }
      ADMIN_TIER_1_USD: 100000.00
      ADMIN_TIER_2_USD: 500000.00
      ADMIN_FEE_TIER_LOW_RATE: 0.030
      ADMIN_FEE_TIER_MID_RATE: 0.020
      ADMIN_FEE_TIER_HIGH_RATE: 0.015
    precision: "2 decimal places, round_half_up at Step 1 and Step 4 only"

  - name: pilot_staffing_shortfall
    trigger: "On every Pilot status change, on Aircraft PENDING_INDUCTION→IN_SERVICE and on Aircraft →TRANSITION_PENDING (any mutation of CrewBase.assigned_aircraft_count or the base's pilot counters)"
    algorithm: constraint_propagation
    formula: |
      required_pilot_count = CrewBase.assigned_aircraft_count
                           * CrewBase.pilots_required_per_aircraft

      # Variant HEADCOUNT_BASIS — line-qualified crews only:
      headcount_available = CrewBase.line_qualified_pilot_count
      headcount_shortfall = max(0, required_pilot_count - headcount_available)

      # Variant PIPELINE_BASIS — credits the hiring pipeline net of attrition:
      pipeline_available  = CrewBase.line_qualified_pilot_count
                          + floor(CrewBase.in_training_pilot_count
                                  * (1 - ATTRITION_DISCOUNT))
      pipeline_shortfall  = max(0, required_pilot_count - pipeline_available)

      staffing_posture = STAFFED  if headcount_shortfall == 0
                    else SHORT    if headcount_shortfall <= CrewBase.pilots_required_per_aircraft
                    else CRITICAL

      allocatable_aircraft_count = min(
          CrewBase.aircraft_allocation_cap,
          floor(pipeline_available / CrewBase.pilots_required_per_aircraft))
      # The two variants disagree whenever in_training_pilot_count > 0: gating
      # (induction admissibility, staffing_posture) uses HEADCOUNT_BASIS, while
      # planning (allocatable_aircraft_count, and therefore which tails get
      # grounded or restored) uses PIPELINE_BASIS.
    input_set: "Pilot rows with base_id == base.id filtered by status (LINE_QUALIFIED for headcount, plus IN_TRAINING for pipeline); PIPELINE, ATTRITED_TO_MAINLINE and RESIGNED pilots are excluded from both. Aircraft rows with assigned_base_id == base.id AND status IN {IN_SERVICE, GROUNDED_STAFFING}"
    constants:
      ATTRITION_DISCOUNT: 0.35
    precision: "integers; floor() truncates toward zero"
    variants:
      - name: HEADCOUNT_BASIS
        when: "Aircraft induction admissibility (validations[priority=34]) and staffing_posture"
        difference: "Counts only LINE_QUALIFIED pilots; ignores the training pipeline entirely"
      - name: PIPELINE_BASIS
        when: "allocatable_aircraft_count, and therefore the grounding/restoration selector on Aircraft"
        difference: "Adds floor(in_training_pilot_count * 0.65) to the available headcount, so a base can be SHORT for induction yet retain its allocation"

  - name: invoice_settlement
    trigger: "On POST /cpa/schedule-cycles/{cycleId}/invoices (all component fields and total_usd are written at creation and never recomputed afterwards)"
    algorithm: forward_looking
    formula: |
      ownership_aircraft_count = count(Aircraft with
          agreement_id == cycle.agreement_id
          AND ownership == REGIONAL_OWNED
          AND status IN {IN_SERVICE, GROUNDED_STAFFING})
      fixed_component_usd = Agreement.fixed_monthly_fee_usd
                          + round2(Agreement.aircraft_ownership_fee_usd
                                   * ownership_aircraft_count)

      if variant == PROVISIONAL:
          variable_component_usd       = variable_flight_payment[PLANNED_BASIS]
          passthrough_component_usd    = ScheduleCycle.estimated_passthrough_total_usd
          incentive_component_usd      = 0.00
          penalty_component_usd        = 0.00
          brand_penalty_component_usd  = 0.00
      else:  # variant == FINAL
          variable_component_usd       = variable_flight_payment[ACTUAL_BASIS]
          passthrough_component_usd    = ScheduleCycle.passthrough_settlement_usd
          incentive_component_usd      = Scorecard.incentive_usd
          penalty_component_usd        = Scorecard.penalty_usd
          brand_penalty_component_usd  = Scorecard.brand_penalty_usd

      total_usd = fixed_component_usd
                + variable_component_usd
                + passthrough_component_usd
                + incentive_component_usd
                - penalty_component_usd
                - brand_penalty_component_usd
    input_set: "the cycle's FlightLeg rows filtered per the selected variable_flight_payment variant, its PassThroughClaim rows, its single Scorecard (FINAL only) and the agreement's REGIONAL_OWNED aircraft in {IN_SERVICE, GROUNDED_STAFFING}"
    constants: {}
    precision: "2 decimal places, round_half_up; every addend is already 2dp so the sum is exact"
    variants:
      - name: PROVISIONAL
        when: "Invoice.variant == PROVISIONAL — billed during or right after the operating month"
        difference: "Pays planned block hours on SCHEDULED + COMPLETED legs, passes through the raw estimate total, and excludes all incentive, penalty and brand-penalty components"
      - name: FINAL
        when: "Invoice.variant == FINAL — billed after the cycle is CLOSED and every pass-through is terminal"
        difference: "Pays actual block hours on COMPLETED legs only, passes through the reconciled total plus its admin fee, and applies incentive, penalty and brand penalty from the Scorecard"

# =============================================================================
# §1.4 Validation Rules Table (evaluated in ascending priority order)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's §1.5 roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "every id in the request path exists, validated left-to-right"
    error_id: "ERR_AGREEMENT_NOT_FOUND | ERR_CREW_BASE_NOT_FOUND | ERR_AIRCRAFT_NOT_FOUND | ERR_PILOT_NOT_FOUND | ERR_SCHEDULE_CYCLE_NOT_FOUND | ERR_FLIGHT_LEG_NOT_FOUND | ERR_CANCELLATION_CLAIM_NOT_FOUND | ERR_PASSTHROUGH_CLAIM_NOT_FOUND | ERR_SCORECARD_NOT_FOUND | ERR_INVOICE_NOT_FOUND | ERR_BRAND_AUDIT_NOT_FOUND | ERR_NEGOTIATION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 4
    category: business_referential
    check: "every foreign key in the request body resolves (agreement_id, assigned_base_id, base_id, cycle_id, aircraft_id, captain_pilot_id)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /cpa/crew-bases, POST /cpa/aircraft, POST /cpa/pilots, POST /cpa/schedule-cycles, POST /cpa/flight-legs, POST /cpa/pass-through-claims, POST /cpa/brand-audits"

  - priority: 5
    category: business_constraint
    check: "required body fields are present, enums are members of their declared set, monetary amounts are > 0 with at most 2 decimals, block hours are > 0 with at most 3 decimals, published_departures >= 0, findings_count >= 1, pilots_required_per_aircraft >= 1, aircraft_allocation_cap >= 1, pagination limit within 1..100"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints and all list endpoints"

  - priority: 6
    category: auth
    check: "when the acting role is BaseChiefPilot, X-User-ID equals the target Pilot's base_id"
    error_id: ERR_BASE_NOT_OWNED
    http_status: 403
    applies_to: "POST /cpa/pilots/{pilotId}/advance, POST /cpa/pilots/{pilotId}/attrite"

  - priority: 10
    category: state
    check: "the governing Agreement has status == ACTIVE"
    error_id: ERR_AGREEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /cpa/aircraft/{aircraftId}/induct, POST /cpa/schedule-cycles/{cycleId}/open, POST /cpa/pilots/{pilotId}/advance"

  - priority: 12
    category: state
    check: "the OCC field equals the parent's current version (expected_agreement_version on Agreement, expected_schedule_cycle_version on ScheduleCycle)"
    error_id: "ERR_STALE_AGREEMENT_VERSION | ERR_STALE_CYCLE_VERSION"
    http_status: 412
    applies_to: "POST /cpa/agreements/{agreementId}/extension-negotiations, POST /cpa/schedule-cycles/{cycleId}/invoices"

  - priority: 20
    category: state
    check: "the target resource is in a state that declares this transition in §1.2 (includes: invoice creation with variant == FINAL requires ScheduleCycle.status == CLOSED; issue-final requires Invoice.status == DRAFT; classify requires claim status IN {OPEN, DISPUTED}; complete/cancel/reinstate require ScheduleCycle.status == OPEN)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints and POST /cpa/schedule-cycles/{cycleId}/invoices"

  - priority: 22
    category: state
    check: "the target resource is not already in one of its terminal states"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "POST /cpa/aircraft/{aircraftId}/*, POST /cpa/pilots/{pilotId}/*, POST /cpa/flight-legs/{legId}/*, POST /cpa/cancellation-claims/{claimId}/*, POST /cpa/pass-through-claims/{claimId}/*, POST /cpa/invoices/{invoiceId}/*, POST /cpa/extension-negotiations/{negotiationId}/*"

  - priority: 30
    category: business_safety
    check: "the referenced Aircraft.status == IN_SERVICE (a PENDING_INDUCTION, GROUNDED_STAFFING, TRANSITION_PENDING, TRANSITIONED or WITHDRAWN tail may not be scheduled or reported as flown)"
    error_id: ERR_AIRCRAFT_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /cpa/flight-legs, POST /cpa/flight-legs/{legId}/complete, POST /cpa/flight-legs/{legId}/reinstate"

  - priority: 32
    category: business_safety
    check: "the referenced captain Pilot has status == LINE_QUALIFIED"
    error_id: ERR_PILOT_NOT_QUALIFIED
    http_status: 409
    applies_to: "POST /cpa/flight-legs"

  - priority: 34
    category: business_safety
    check: "HEADCOUNT_BASIS admissibility: (CrewBase.assigned_aircraft_count + 1) * pilots_required_per_aircraft <= CrewBase.line_qualified_pilot_count"
    error_id: ERR_BASE_UNDERSTAFFED
    http_status: 409
    applies_to: "POST /cpa/aircraft/{aircraftId}/induct"

  - priority: 40
    category: business_referential
    check: "the referenced Aircraft.agreement_id and the referenced Pilot's CrewBase.agreement_id both equal ScheduleCycle.agreement_id"
    error_id: ERR_CROSS_AGREEMENT_REFERENCE
    http_status: 409
    applies_to: "POST /cpa/flight-legs"

  - priority: 42
    category: business_referential
    check: "no other PassThroughClaim exists for the same cycle_id with the same category and status != REJECTED"
    error_id: ERR_DUPLICATE_PASSTHROUGH_CATEGORY
    http_status: 409
    applies_to: "POST /cpa/pass-through-claims"

  - priority: 44
    category: business_referential
    check: "scoped uniqueness: CrewBase.station_code per agreement_id, Aircraft.tail_number per agreement_id, Pilot.employee_ref per base_id, ScheduleCycle.cycle_month per agreement_id"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /cpa/crew-bases, POST /cpa/aircraft, POST /cpa/pilots, POST /cpa/schedule-cycles"

  - priority: 50
    category: business_temporal
    check: "scheduled_arrival_utc > scheduled_departure_utc on creation; actual_arrival_utc > scheduled_departure_utc on completion"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /cpa/flight-legs, POST /cpa/flight-legs/{legId}/complete"

  - priority: 52
    category: business_temporal
    check: |
      Aircraft turn-buffer overlap — PAIRWISE geometry. Treat each leg as the
      half-open interval [scheduled_departure_utc, scheduled_arrival_utc) inflated
      by AIRCRAFT_MIN_TURN_MINUTES = 35 on BOTH ends. The new leg is rejected when,
      for any other leg on the same aircraft_id with status IN {SCHEDULED, COMPLETED},
      NOT (new.scheduled_departure_utc >= other.scheduled_arrival_utc + 35min
           OR new.scheduled_arrival_utc + 35min <= other.scheduled_departure_utc).
      Exactly 35 minutes of separation is ACCEPTED (>= / <=).
    error_id: ERR_AIRCRAFT_TURN_CONFLICT
    http_status: 409
    applies_to: "POST /cpa/flight-legs"

  - priority: 54
    category: business_temporal
    check: |
      Pilot rolling-window duty cap — AGGREGATE-CAPACITY geometry, not pairwise.
      Over the half-open window [new.scheduled_departure_utc - 24h,
      new.scheduled_departure_utc + 24h), sum planned_block_hours across all legs
      with captain_pilot_id == new.captain_pilot_id AND status IN {SCHEDULED, COMPLETED}
      whose scheduled_departure_utc falls in that window, add the new leg's
      planned_block_hours, and reject when the total > PILOT_ROLLING_BLOCK_CAP_HOURS
      = 16.000. A total of exactly 16.000 is ACCEPTED. Legs may be arbitrarily far
      apart in clock time and still collide through the aggregate.
    error_id: ERR_PILOT_DUTY_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /cpa/flight-legs"

  - priority: 56
    category: business_constraint
    check: "segregation of duties: on reconcile, X-User-ID != PassThroughClaim.actual_submitted_by_user_id; on accept, the acting role is RegionalOpsController when status == OFFERED and MainlineScheduler when status == COUNTERED"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /cpa/pass-through-claims/{claimId}/reconcile, POST /cpa/extension-negotiations/{negotiationId}/accept"

  - priority: 58
    category: business_constraint
    check: "negotiation-loop bounds: CancellationClaim.dispute_round < MAX_DISPUTE_ROUNDS (2); ExtensionNegotiation.counter_round < MAX_COUNTER_ROUNDS (2)"
    error_id: "ERR_DISPUTE_ROUNDS_EXHAUSTED | ERR_COUNTER_ROUNDS_EXHAUSTED"
    http_status: 409
    applies_to: "POST /cpa/cancellation-claims/{claimId}/dispute, POST /cpa/extension-negotiations/{negotiationId}/counter"

  - priority: 60
    category: business_constraint
    check: "ScheduleCycle.open_leg_count == 0 (every leg is COMPLETED or CANCELLED)"
    error_id: ERR_CYCLE_HAS_OPEN_LEGS
    http_status: 409
    applies_to: "POST /cpa/schedule-cycles/{cycleId}/close"

  - priority: 61
    category: business_constraint
    check: "no FlightLeg with aircraft_id == this tail AND status == SCHEDULED"
    error_id: ERR_AIRCRAFT_HAS_OPEN_LEGS
    http_status: 409
    applies_to: "POST /cpa/aircraft/{aircraftId}/transition"

  - priority: 62
    category: business_constraint
    check: "evidence_ref is present when to_remediation_status == VERIFIED"
    error_id: ERR_EVIDENCE_REQUIRED
    http_status: 422
    applies_to: "POST /cpa/brand-audits/{auditId}/remediation"

  - priority: 63
    category: business_constraint
    check: "BrandAudit.remediation_status == VERIFIED (cross-dimension guard on the finding dimension)"
    error_id: ERR_REMEDIATION_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /cpa/brand-audits/{auditId}/close"

  - priority: 64
    category: business_constraint
    check: "the leg's CancellationClaim has status != FINALIZED"
    error_id: ERR_CLAIM_ALREADY_FINALIZED
    http_status: 409
    applies_to: "POST /cpa/flight-legs/{legId}/reinstate"

  - priority: 70
    category: business_fiscal
    check: "CrewBase.assigned_aircraft_count + 1 <= CrewBase.aircraft_allocation_cap"
    error_id: ERR_FLEET_ALLOCATION_EXCEEDED
    http_status: 409
    applies_to: "POST /cpa/aircraft/{aircraftId}/induct"

  - priority: 72
    category: business_fiscal
    check: "Invoice.variant == FINAL"
    error_id: ERR_INVOICE_VARIANT_NOT_FINAL
    http_status: 422
    applies_to: "POST /cpa/invoices/{invoiceId}/issue-final"

  - priority: 74
    category: business_fiscal
    check: "every PassThroughClaim of the cycle has status IN {RECONCILED, REJECTED}"
    error_id: ERR_PASSTHROUGH_UNRECONCILED
    http_status: 409
    applies_to: "POST /cpa/schedule-cycles/{cycleId}/invoices (variant == FINAL only), POST /cpa/invoices/{invoiceId}/issue-final"

  - priority: 76
    category: business_fiscal
    check: "the cycle's Scorecard has status == PUBLISHED"
    error_id: ERR_SCORECARD_STALE
    http_status: 409
    applies_to: "POST /cpa/invoices/{invoiceId}/issue-final"

  - priority: 78
    category: business_fiscal
    check: "cancelled_controllable_count + cancelled_uncontrollable_count + 1 <= ScheduleCycle.published_departures — the departure ledger may never go negative"
    error_id: ERR_DEPARTURE_LEDGER_OVERFLOW
    http_status: 422
    applies_to: "POST /cpa/flight-legs/{legId}/cancel"

  - priority: 80
    category: business_temporal
    check: "proposed_term_end_date > Agreement.term_end_date on an offer; counter_term_end_date > Agreement.term_end_date on a counter"
    error_id: ERR_EXTENSION_TERM_NOT_LATER
    http_status: 422
    applies_to: "POST /cpa/agreements/{agreementId}/extension-negotiations, POST /cpa/extension-negotiations/{negotiationId}/counter, POST /cpa/extension-negotiations/{negotiationId}/revise-offer"

# =============================================================================
# §1.5 Endpoint Inventory
# All resources are addressed from a flat root: /cpa/<collection>/{id}.
# =============================================================================
endpoints:
  # ---------------------------------------------------------------- test clock
  - method: POST
    path: /cpa/_clock/set_current_utc
    purpose: "Test-driving endpoint: set the service's logical current UTC instant. The logical clock starts at the fixed default 2026-08-01T00:00:00Z at service startup and only ever changes through this endpoint; no wall-clock reads occur anywhere in the service. Required because Agreement term expiry (§1.2) is unreachable otherwise."
    roles: [CPAAdministrator]
    input: [to_iso8601]
    output: null
    status: 200
    side_effects: "Sets the logical clock. Then sweeps every ACTIVE Agreement whose term_end_date < the new date, in created_at ASC order, to EXPIRED (see §1.2)."

  # ----------------------------------------------------------------- Agreement
  - method: POST
    path: /cpa/agreements
    purpose: "Register a capacity purchase agreement in DRAFT with its fixed and variable rate card."
    roles: [CPAAdministrator]
    input: [mainline_partner_name, regional_carrier_name, fixed_monthly_fee_usd, block_hour_rate_usd, departure_rate_usd, aircraft_ownership_fee_usd, incentive_pool_cap_usd, penalty_cap_usd, term_end_date]
    output: Agreement
    status: 201
    side_effects: "status = DRAFT; extension_round_count = 0; settled_to_date_usd = 0.00; open_invoice_count = 0; activated_at = null."

  - method: GET
    path: /cpa/agreements/{agreementId}
    purpose: "Read one agreement including its derived settlement counters."
    roles: [CPAAdministrator, MainlineScheduler, RegionalOpsController, BaseChiefPilot, BrandAuditor]
    input: []
    output: Agreement
    status: 200
    side_effects: none

  - method: GET
    path: /cpa/agreements
    purpose: "List agreements, newest last (created_at ASC, then id ASC)."
    roles: [CPAAdministrator, MainlineScheduler, RegionalOpsController, BaseChiefPilot, BrandAuditor]
    input: ["status?", "limit?", "offset?"]
    output: Agreement[]
    status: 200
    side_effects: none

  - method: POST
    path: /cpa/agreements/{agreementId}/activate
    purpose: "Move a DRAFT agreement to ACTIVE so bases, fleet and cycles may operate under it."
    roles: [CPAAdministrator]
    input: []
    output: Agreement
    status: 200
    side_effects: "status = ACTIVE; activated_at = logical now; version += 1."

  - method: POST
    path: /cpa/agreements/{agreementId}/terminate
    purpose: "Terminate an ACTIVE or EXTENSION_PENDING agreement and stand down its footprint."
    roles: [CPAAdministrator]
    input: [termination_reason]
    output: Agreement
    status: 200
    side_effects: "status = TERMINATED; 2-hop cascade — every ACTIVE CrewBase of the agreement becomes CLOSED, and every Aircraft of those bases whose status IN {PENDING_INDUCTION, IN_SERVICE, GROUNDED_STAFFING} becomes WITHDRAWN (grounded_reason = AGREEMENT_TERMINATED); any OFFERED or COUNTERED ExtensionNegotiation becomes WITHDRAWN; version += 1."

  - method: POST
    path: /cpa/agreements/{agreementId}/extension-negotiations
    purpose: "Mainline partner opens (or reopens) a contract-extension round. OCC-guarded on the Agreement."
    roles: [MainlineScheduler]
    input: [proposed_term_end_date, proposed_block_hour_rate_usd, expected_agreement_version]
    output: ExtensionNegotiation
    status: 201
    side_effects: "Creates ExtensionNegotiation with status = OFFERED, round_index = Agreement.extension_round_count + 1, counter_round = 0; Agreement.status = EXTENSION_PENDING; Agreement.extension_round_count += 1; Agreement.version += 1."

  # ------------------------------------------------------- ExtensionNegotiation
  - method: GET
    path: /cpa/extension-negotiations/{negotiationId}
    purpose: "Read one extension negotiation round."
    roles: [CPAAdministrator, MainlineScheduler, RegionalOpsController, BaseChiefPilot, BrandAuditor]
    input: []
    output: ExtensionNegotiation
    status: 200
    side_effects: none

  - method: GET
    path: /cpa/extension-negotiations
    purpose: "List extension negotiations, optionally scoped to one agreement (created_at ASC, then id ASC)."
    roles: [CPAAdministrator, MainlineScheduler, RegionalOpsController, BaseChiefPilot, BrandAuditor]
    input: ["agreement_id?", "status?", "limit?", "offset?"]
    output: ExtensionNegotiation[]
    status: 200
    side_effects: none

  - method: POST
    path: /cpa/extension-negotiations/{negotiationId}/counter
    purpose: "Regional carrier counters an OFFERED round with its own term and rate."
    roles: [RegionalOpsController]
    input: [counter_term_end_date, counter_block_hour_rate_usd]
    output: ExtensionNegotiation
    status: 200
    side_effects: "status = COUNTERED; counter_round += 1."

  - method: POST
    path: /cpa/extension-negotiations/{negotiationId}/revise-offer
    purpose: "Mainline partner revises a COUNTERED round, returning it to OFFERED (cycle back)."
    roles: [MainlineScheduler]
    input: [proposed_term_end_date, proposed_block_hour_rate_usd]
    output: ExtensionNegotiation
    status: 200
    side_effects: "status = OFFERED; proposed_* replaced; counter_* cleared to null."

  - method: POST
    path: /cpa/extension-negotiations/{negotiationId}/accept
    purpose: "Accept the round on the table. Segregation of duties: an OFFERED round is accepted by RegionalOpsController, a COUNTERED round by MainlineScheduler."
    roles: [MainlineScheduler, RegionalOpsController]
    input: []
    output: ExtensionNegotiation
    status: 200
    side_effects: "status = ACCEPTED; Agreement.term_end_date = (counter_term_end_date when accepting a COUNTERED round, else proposed_term_end_date); Agreement.block_hour_rate_usd = the matching rate; Agreement.status = ACTIVE; Agreement.version += 1."

  - method: POST
    path: /cpa/extension-negotiations/{negotiationId}/withdraw
    purpose: "Mainline partner withdraws the round; the agreement returns to ACTIVE unchanged."
    roles: [MainlineScheduler]
    input: []
    output: ExtensionNegotiation
    status: 200
    side_effects: "status = WITHDRAWN; Agreement.status = ACTIVE with term and rate untouched; Agreement.version += 1."

  # ------------------------------------------------------------------ CrewBase
  - method: POST
    path: /cpa/crew-bases
    purpose: "Open a crew base with its staffing ratio and fleet allocation cap."
    roles: [RegionalOpsController]
    input: [agreement_id, station_code, pilots_required_per_aircraft, aircraft_allocation_cap]
    output: CrewBase
    status: 201
    side_effects: "lifecycle_status = ACTIVE; all pilot and aircraft counters = 0; required_pilot_count = 0; headcount_shortfall = 0; pipeline_shortfall = 0; staffing_posture = STAFFED; allocatable_aircraft_count = 0."

  - method: GET
    path: /cpa/crew-bases/{baseId}
    purpose: "Read one crew base including both staffing-shortfall variants."
    roles: [CPAAdministrator, MainlineScheduler, RegionalOpsController, BaseChiefPilot, BrandAuditor]
    input: []
    output: CrewBase
    status: 200
    side_effects: none

  - method: GET
    path: /cpa/crew-bases
    purpose: "List crew bases, optionally scoped to one agreement (created_at ASC, then id ASC)."
    roles: [CPAAdministrator, MainlineScheduler, RegionalOpsController, BaseChiefPilot, BrandAuditor]
    input: ["agreement_id?", "staffing_posture?", "limit?", "offset?"]
    output: CrewBase[]
    status: 200
    side_effects: none

  # ------------------------------------------------------------------ Aircraft
  - method: POST
    path: /cpa/aircraft
    purpose: "Register a tail against an agreement and a base in PENDING_INDUCTION."
    roles: [RegionalOpsController]
    input: [agreement_id, assigned_base_id, tail_number, seat_count, ownership]
    output: Aircraft
    status: 201
    side_effects: "status = PENDING_INDUCTION; transition_reason, target_ownership, grounded_reason, inducted_at = null. Base counters are untouched until induction."

  - method: GET
    path: /cpa/aircraft/{aircraftId}
    purpose: "Read one tail."
    roles: [CPAAdministrator, MainlineScheduler, RegionalOpsController, BaseChiefPilot, BrandAuditor]
    input: []
    output: Aircraft
    status: 200
    side_effects: none

  - method: GET
    path: /cpa/aircraft
    purpose: "List tails, optionally scoped by agreement or base (created_at ASC, then id ASC)."
    roles: [CPAAdministrator, MainlineScheduler, RegionalOpsController, BaseChiefPilot, BrandAuditor]
    input: ["agreement_id?", "assigned_base_id?", "status?", "limit?", "offset?"]
    output: Aircraft[]
    status: 200
    side_effects: none

  - method: POST
    path: /cpa/aircraft/{aircraftId}/induct
    purpose: "Place a PENDING_INDUCTION tail into revenue service. Gated on the base's live crew staffing and its allocation cap."
    roles: [RegionalOpsController]
    input: []
    output: Aircraft
    status: 200
    side_effects: "status = IN_SERVICE; inducted_at = logical now; CrewBase.assigned_aircraft_count += 1 and its required_pilot_count, shortfalls, staffing_posture and allocatable_aircraft_count are recomputed per §1.3."

  - method: POST
    path: /cpa/aircraft/{aircraftId}/transition
    purpose: "Begin a fleet-renewal transition of an IN_SERVICE or GROUNDED_STAFFING tail to a new ownership form."
    roles: [CPAAdministrator]
    input: [transition_reason, target_ownership]
    output: Aircraft
    status: 200
    side_effects: "status = TRANSITION_PENDING; transition_reason and target_ownership recorded; if the tail was IN_SERVICE or GROUNDED_STAFFING, CrewBase.assigned_aircraft_count -= 1 and the base's staffing derivations are recomputed."

  - method: POST
    path: /cpa/aircraft/{aircraftId}/complete-transition
    purpose: "Finish the transition; the tail leaves the paid fleet under its new ownership."
    roles: [CPAAdministrator]
    input: []
    output: Aircraft
    status: 200
    side_effects: "status = TRANSITIONED (terminal); ownership = target_ownership."

  # -------------------------------------------------------------------- Pilot
  - method: POST
    path: /cpa/pilots
    purpose: "Add a pilot to a base's hiring pipeline."
    roles: [RegionalOpsController]
    input: [base_id, employee_ref, seat, hire_class_date]
    output: Pilot
    status: 201
    side_effects: "status = PIPELINE; attrition_destination = null; CrewBase pipeline counters and derivations are recomputed per §1.3."

  - method: GET
    path: /cpa/pilots/{pilotId}
    purpose: "Read one pilot."
    roles: [CPAAdministrator, MainlineScheduler, RegionalOpsController, BaseChiefPilot, BrandAuditor]
    input: []
    output: Pilot
    status: 200
    side_effects: none

  - method: GET
    path: /cpa/pilots
    purpose: "List pilots, optionally scoped to one base (created_at ASC, then id ASC)."
    roles: [CPAAdministrator, MainlineScheduler, RegionalOpsController, BaseChiefPilot, BrandAuditor]
    input: ["base_id?", "status?", "seat?", "limit?", "offset?"]
    output: Pilot[]
    status: 200
    side_effects: none

  - method: POST
    path: /cpa/pilots/{pilotId}/advance
    purpose: "Advance a pilot one step along PIPELINE -> IN_TRAINING -> LINE_QUALIFIED. BaseChiefPilot acts only on its own base."
    roles: [BaseChiefPilot]
    input: [to_status]
    output: Pilot
    status: 200
    side_effects: "status = to_status; CrewBase.in_training_pilot_count / line_qualified_pilot_count and all base derivations recomputed. On reaching LINE_QUALIFIED, any GROUNDED_STAFFING tail at the base that the restored staffing now supports is returned to IN_SERVICE using the §1.2 restore selector."

  - method: POST
    path: /cpa/pilots/{pilotId}/attrite
    purpose: "Record a pilot leaving — to the mainline partner or by resignation. Drives the 3-hop staffing cascade."
    roles: [BaseChiefPilot]
    input: [destination]
    output: Pilot
    status: 200
    side_effects: "status = ATTRITED_TO_MAINLINE when destination == MAINLINE else RESIGNED; attrition_destination = destination; hop 2 recomputes the CrewBase counters, shortfalls, staffing_posture and allocatable_aircraft_count; hop 3 grounds (assigned_aircraft_count - allocatable_aircraft_count) IN_SERVICE tails at that base to GROUNDED_STAFFING (grounded_reason = PILOT_SHORTFALL) using the §1.2 pinned selector."

  # ------------------------------------------------------------ ScheduleCycle
  - method: POST
    path: /cpa/schedule-cycles
    purpose: "Mainline partner publishes a monthly schedule cycle, declaring the number of published departures it is buying."
    roles: [MainlineScheduler]
    input: [agreement_id, cycle_month, published_departures]
    output: ScheduleCycle
    status: 201
    side_effects: "status = PLANNED; every counter and metric = 0 (departure_ledger_total = 0, credited_block_hours = 0.000, metric_completed_departures = 0, estimated_passthrough_total_usd = 0.00, passthrough_settlement_usd = null); closed_at = null."

  - method: GET
    path: /cpa/schedule-cycles/{cycleId}
    purpose: "Read one schedule cycle including its ledger counters and pass-through totals."
    roles: [CPAAdministrator, MainlineScheduler, RegionalOpsController, BaseChiefPilot, BrandAuditor]
    input: []
    output: ScheduleCycle
    status: 200
    side_effects: none

  - method: GET
    path: /cpa/schedule-cycles
    purpose: "List schedule cycles, optionally scoped to one agreement (created_at ASC, then id ASC)."
    roles: [CPAAdministrator, MainlineScheduler, RegionalOpsController, BaseChiefPilot, BrandAuditor]
    input: ["agreement_id?", "status?", "limit?", "offset?"]
    output: ScheduleCycle[]
    status: 200
    side_effects: none

  - method: POST
    path: /cpa/schedule-cycles/{cycleId}/open
    purpose: "Open a PLANNED cycle for flying and operational reporting."
    roles: [MainlineScheduler]
    input: []
    output: ScheduleCycle
    status: 200
    side_effects: "status = OPEN; version += 1."

  - method: POST
    path: /cpa/schedule-cycles/{cycleId}/close
    purpose: "Close an OPEN cycle once no leg is still SCHEDULED; publishes the performance scorecard."
    roles: [MainlineScheduler]
    input: []
    output: ScheduleCycle
    status: 200
    side_effects: "status = CLOSED; closed_at = logical now; all §1.3 cycle metrics frozen; a Scorecard is created with status = PUBLISHED, recompute_count = 0 and every performance figure computed per §1.3 (completion_factor, on_time_arrival, mishandled_bag_rate, points, gross_performance_usd, incentive_usd, penalty_usd, brand_penalty_usd); version += 1."

  - method: POST
    path: /cpa/schedule-cycles/{cycleId}/invoices
    purpose: "Raise a DRAFT invoice against the cycle. variant PROVISIONAL bills planned block hours and estimated pass-throughs and is allowed while the cycle is OPEN; variant FINAL bills actuals and requires a CLOSED cycle with every pass-through terminal. OCC-guarded on the ScheduleCycle."
    roles: [CPAAdministrator]
    input: [variant, expected_schedule_cycle_version]
    output: Invoice
    status: 201
    side_effects: "Creates Invoice with status = DRAFT, void_reason = null, issued_final_at = null and every component computed per §1.3 invoice_settlement for the requested variant; any other DRAFT invoice of the same cycle and variant becomes VOIDED with void_reason = AUTO_SUPERSEDED; Agreement.open_invoice_count recomputed; ScheduleCycle.version += 1."

  # ---------------------------------------------------------------- FlightLeg
  - method: POST
    path: /cpa/flight-legs
    purpose: "Schedule a leg on a tail with a line-qualified captain inside an OPEN cycle. Enforces the aircraft turn buffer and the pilot rolling block-hour cap."
    roles: [MainlineScheduler]
    input: [cycle_id, aircraft_id, captain_pilot_id, flight_number, origin, destination, scheduled_departure_utc, scheduled_arrival_utc, planned_block_hours]
    output: FlightLeg
    status: 201
    side_effects: "status = SCHEDULED; actual_block_hours, actual_arrival_utc, enplaned_bags, mishandled_bags, on_time, leg_variable_payment_usd, cancel_cause_code = null; reinstate_count = 0; ScheduleCycle.open_leg_count += 1."

  - method: GET
    path: /cpa/flight-legs/{legId}
    purpose: "Read one leg including its per-leg variable payment."
    roles: [CPAAdministrator, MainlineScheduler, RegionalOpsController, BaseChiefPilot, BrandAuditor]
    input: []
    output: FlightLeg
    status: 200
    side_effects: none

  - method: GET
    path: /cpa/flight-legs
    purpose: "List legs, optionally scoped by cycle, tail or captain (created_at ASC, then id ASC)."
    roles: [CPAAdministrator, MainlineScheduler, RegionalOpsController, BaseChiefPilot, BrandAuditor]
    input: ["cycle_id?", "aircraft_id?", "captain_pilot_id?", "status?", "limit?", "offset?"]
    output: FlightLeg[]
    status: 200
    side_effects: none

  - method: POST
    path: /cpa/flight-legs/{legId}/complete
    purpose: "Report a leg as flown with actual block hours, actual arrival and bag counts."
    roles: [RegionalOpsController]
    input: [actual_block_hours, actual_arrival_utc, enplaned_bags, mishandled_bags]
    output: FlightLeg
    status: 200
    side_effects: "status = COMPLETED; on_time = (actual_arrival_utc - scheduled_arrival_utc <= ON_TIME_GRACE_MINUTES); leg_variable_payment_usd computed per §1.3 variable_flight_payment (ACTUAL_BASIS); ScheduleCycle.recorded_completed_legs += 1, open_leg_count -= 1, credited_block_hours += actual_block_hours, enplaned_bags_total += enplaned_bags, mishandled_bags_total += mishandled_bags, on_time_leg_count += 1 when on_time. The cancellation counters and therefore metric_completed_departures and departure_ledger_total are untouched."

  - method: POST
    path: /cpa/flight-legs/{legId}/cancel
    purpose: "Cancel a SCHEDULED leg with a cause code; opens a CancellationClaim for controllability adjudication."
    roles: [RegionalOpsController]
    input: [cause_code]
    output: FlightLeg
    status: 200
    side_effects: "status = CANCELLED; cancel_cause_code = cause_code; a CancellationClaim is created with status = OPEN, classification = null, effective_classification = CONTROLLABLE, dispute_round = 0; ScheduleCycle.open_leg_count -= 1 and cancelled_controllable_count += 1, so metric_completed_departures drops by 1 while departure_ledger_total stays equal to published_departures."

  - method: POST
    path: /cpa/flight-legs/{legId}/reinstate
    purpose: "Reinstate a CANCELLED leg whose claim is not yet FINALIZED — the compensating action for a mis-cancelled departure."
    roles: [RegionalOpsController]
    input: []
    output: FlightLeg
    status: 200
    side_effects: "status = SCHEDULED; cancel_cause_code = null; reinstate_count += 1; the CancellationClaim becomes VOIDED and therefore leaves the counter filter set, so ScheduleCycle.cancelled_controllable_count -= 1 and metric_completed_departures returns to its exact pre-cancel value while departure_ledger_total remains equal to published_departures; ScheduleCycle.open_leg_count += 1."

  # -------------------------------------------------------- CancellationClaim
  - method: GET
    path: /cpa/cancellation-claims/{claimId}
    purpose: "Read one cancellation claim including its effective classification."
    roles: [CPAAdministrator, MainlineScheduler, RegionalOpsController, BaseChiefPilot, BrandAuditor]
    input: []
    output: CancellationClaim
    status: 200
    side_effects: none

  - method: GET
    path: /cpa/cancellation-claims
    purpose: "List cancellation claims, optionally scoped by cycle or leg (created_at ASC, then id ASC)."
    roles: [CPAAdministrator, MainlineScheduler, RegionalOpsController, BaseChiefPilot, BrandAuditor]
    input: ["cycle_id?", "leg_id?", "status?", "classification?", "limit?", "offset?"]
    output: CancellationClaim[]
    status: 200
    side_effects: none

  - method: POST
    path: /cpa/cancellation-claims/{claimId}/classify
    purpose: "Mainline partner classifies the cancellation as CONTROLLABLE or UNCONTROLLABLE."
    roles: [MainlineScheduler]
    input: [classification]
    output: CancellationClaim
    status: 200
    side_effects: "status = CLASSIFIED; classification recorded; no cycle counter moves yet — only finalization touches the ledger."

  - method: POST
    path: /cpa/cancellation-claims/{claimId}/dispute
    purpose: "Regional carrier disputes a CLASSIFIED claim, sending it back for reclassification (bounded by MAX_DISPUTE_ROUNDS = 2)."
    roles: [RegionalOpsController]
    input: [dispute_note]
    output: CancellationClaim
    status: 200
    side_effects: "status = DISPUTED; dispute_round += 1; dispute_note recorded."

  - method: POST
    path: /cpa/cancellation-claims/{claimId}/finalize
    purpose: "Lock the classification for penalty purposes. Entry point of the deepest cascade in the system."
    roles: [CPAAdministrator]
    input: []
    output: CancellationClaim
    status: 200
    side_effects: "hop 1 status = FINALIZED and effective_classification = classification; hop 2 ScheduleCycle.cancelled_controllable_count or cancelled_uncontrollable_count += 1 and the cycle metrics are recomputed; hop 3 if the cycle already has a Scorecard it becomes STALE; hop 4 every DRAFT or ISSUED Invoice of that cycle becomes VOIDED with void_reason = AUTO_SCORECARD_STALE; hop 5 Agreement.settled_to_date_usd and open_invoice_count are recomputed and, when a SETTLED cycle is invalidated this way, ScheduleCycle.status reverts to CLOSED."

  # --------------------------------------------------------- PassThroughClaim
  - method: POST
    path: /cpa/pass-through-claims
    purpose: "Open a pass-through cost category (FUEL, AIRPORT_FEES or INSURANCE) for the cycle with its estimate."
    roles: [RegionalOpsController]
    input: [cycle_id, category, estimated_amount_usd]
    output: PassThroughClaim
    status: 201
    side_effects: "status = SUBMITTED; actual_amount_usd, supporting_doc_ref, allowed_amount_usd, variance_usd, actual_submitted_by_user_id, reconciled_by_user_id = null; ScheduleCycle.estimated_passthrough_total_usd += estimated_amount_usd."

  - method: GET
    path: /cpa/pass-through-claims/{claimId}
    purpose: "Read one pass-through claim including its allowed amount and variance."
    roles: [CPAAdministrator, MainlineScheduler, RegionalOpsController, BaseChiefPilot, BrandAuditor]
    input: []
    output: PassThroughClaim
    status: 200
    side_effects: none

  - method: GET
    path: /cpa/pass-through-claims
    purpose: "List pass-through claims, optionally scoped to one cycle (created_at ASC, then id ASC)."
    roles: [CPAAdministrator, MainlineScheduler, RegionalOpsController, BaseChiefPilot, BrandAuditor]
    input: ["cycle_id?", "category?", "status?", "limit?", "offset?"]
    output: PassThroughClaim[]
    status: 200
    side_effects: none

  - method: POST
    path: /cpa/pass-through-claims/{claimId}/submit-actual
    purpose: "Submit the invoiced actual for the category with its supporting document reference."
    roles: [RegionalOpsController, CPAAdministrator]
    input: [actual_amount_usd, supporting_doc_ref]
    output: PassThroughClaim
    status: 200
    side_effects: "status = ACTUAL_SUBMITTED; actual_amount_usd and supporting_doc_ref recorded; actual_submitted_by_user_id = X-User-ID."

  - method: POST
    path: /cpa/pass-through-claims/{claimId}/reconcile
    purpose: "Adjudicate the actual against the estimate and the category tolerance. Segregation of duties: the reconciler may not be the submitter."
    roles: [CPAAdministrator]
    input: [decision]
    output: PassThroughClaim
    status: 200
    side_effects: "decision APPROVE -> status = RECONCILED with allowed_amount_usd per Step 1 of §1.3 passthrough_reconciliation_settlement; decision REJECT -> status = REJECTED with allowed_amount_usd left null and the claim excluded from both estimated_passthrough_total_usd and the Step-2 base; reconciled_by_user_id = X-User-ID; ScheduleCycle.passthrough_settlement_usd recomputed across the cycle's RECONCILED claims. decision is one of {APPROVE, REJECT}."

  # ------------------------------------------------------------------ Scorecard
  - method: GET
    path: /cpa/scorecards/{scorecardId}
    purpose: "Read one performance scorecard with its three metrics, points and money outcomes."
    roles: [CPAAdministrator, MainlineScheduler, RegionalOpsController, BaseChiefPilot, BrandAuditor]
    input: []
    output: Scorecard
    status: 200
    side_effects: none

  - method: GET
    path: /cpa/scorecards
    purpose: "List scorecards, optionally scoped to one cycle (created_at ASC, then id ASC)."
    roles: [CPAAdministrator, MainlineScheduler, RegionalOpsController, BaseChiefPilot, BrandAuditor]
    input: ["cycle_id?", "status?", "limit?", "offset?"]
    output: Scorecard[]
    status: 200
    side_effects: none

  - method: POST
    path: /cpa/scorecards/{scorecardId}/recompute
    purpose: "Recompute the scorecard from the cycle's current ledger. Republishes a STALE scorecard; on an already-PUBLISHED scorecard it is idempotent in every business field."
    roles: [CPAAdministrator]
    input: []
    output: Scorecard
    status: 200
    side_effects: "All §1.3 performance figures recomputed from the live cycle counters and brand audits; status = PUBLISHED; recompute_count += 1 (the only field that moves on the PUBLISHED -> PUBLISHED self-transition)."

  # -------------------------------------------------------------------- Invoice
  - method: GET
    path: /cpa/invoices/{invoiceId}
    purpose: "Read one invoice with its fixed, variable, pass-through, incentive, penalty and brand components."
    roles: [CPAAdministrator, MainlineScheduler, RegionalOpsController, BaseChiefPilot, BrandAuditor]
    input: []
    output: Invoice
    status: 200
    side_effects: none

  - method: GET
    path: /cpa/invoices
    purpose: "List invoices, optionally scoped to one cycle (created_at ASC, then id ASC)."
    roles: [CPAAdministrator, MainlineScheduler, RegionalOpsController, BaseChiefPilot, BrandAuditor]
    input: ["cycle_id?", "status?", "variant?", "limit?", "offset?"]
    output: Invoice[]
    status: 200
    side_effects: none

  - method: POST
    path: /cpa/invoices/{invoiceId}/issue-final
    purpose: "Issue a DRAFT FINAL invoice for settlement. Requires a PUBLISHED scorecard and fully terminal pass-throughs."
    roles: [CPAAdministrator]
    input: []
    output: Invoice
    status: 200
    side_effects: "status = ISSUED; issued_final_at = logical now; Agreement.settled_to_date_usd += total_usd; Agreement.open_invoice_count recomputed; ScheduleCycle.status = SETTLED; Agreement.version += 1."

  - method: POST
    path: /cpa/invoices/{invoiceId}/void
    purpose: "Void a DRAFT or ISSUED invoice. Voiding an ISSUED invoice is the compensating action that unwinds settled money."
    roles: [CPAAdministrator]
    input: []
    output: Invoice
    status: 200
    side_effects: "status = VOIDED; void_reason = MANUAL; when the invoice was ISSUED, Agreement.settled_to_date_usd -= total_usd (exact restoration of the pre-issue figure) and ScheduleCycle.status reverts from SETTLED to CLOSED; Agreement.open_invoice_count recomputed; Agreement.version += 1."

  # ----------------------------------------------------------------- BrandAudit
  - method: POST
    path: /cpa/brand-audits
    purpose: "Record a brand-standards audit (uniform, cabin product or service consistency) against a base."
    roles: [BrandAuditor]
    input: [base_id, audit_scope, findings_count, severity]
    output: BrandAudit
    status: 201
    side_effects: "finding_status = OPEN; remediation_status = NOT_STARTED; evidence_ref = null. Any PUBLISHED Scorecard of a CLOSED cycle under the same agreement becomes STALE."

  - method: GET
    path: /cpa/brand-audits/{auditId}
    purpose: "Read one brand audit with both of its independent status dimensions."
    roles: [CPAAdministrator, MainlineScheduler, RegionalOpsController, BaseChiefPilot, BrandAuditor]
    input: []
    output: BrandAudit
    status: 200
    side_effects: none

  - method: GET
    path: /cpa/brand-audits
    purpose: "List brand audits, optionally scoped to one base (created_at ASC, then id ASC)."
    roles: [CPAAdministrator, MainlineScheduler, RegionalOpsController, BaseChiefPilot, BrandAuditor]
    input: ["base_id?", "finding_status?", "remediation_status?", "limit?", "offset?"]
    output: BrandAudit[]
    status: 200
    side_effects: none

  - method: POST
    path: /cpa/brand-audits/{auditId}/acknowledge
    purpose: "Regional carrier acknowledges the finding (finding dimension only)."
    roles: [RegionalOpsController]
    input: []
    output: BrandAudit
    status: 200
    side_effects: "finding_status = ACKNOWLEDGED; remediation_status untouched."

  - method: POST
    path: /cpa/brand-audits/{auditId}/remediation
    purpose: "Advance the remediation dimension NOT_STARTED -> IN_PROGRESS -> VERIFIED, independently of the finding dimension."
    roles: [RegionalOpsController]
    input: [to_remediation_status, "evidence_ref?"]
    output: BrandAudit
    status: 200
    side_effects: "remediation_status = to_remediation_status; evidence_ref stored when supplied; finding_status untouched."

  - method: POST
    path: /cpa/brand-audits/{auditId}/close
    purpose: "Close an ACKNOWLEDGED finding. Blocked unless the remediation dimension has already reached VERIFIED."
    roles: [BrandAuditor]
    input: []
    output: BrandAudit
    status: 200
    side_effects: "finding_status = CLOSED; the audit stops contributing to brand_penalty_usd, so any PUBLISHED Scorecard of a CLOSED cycle under the same agreement becomes STALE."

# =============================================================================
# §1.6 Error Catalog
# =============================================================================
errors:
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    message: "Authentication headers are missing or malformed"
    triggered_by: "X-User-Role or X-User-ID absent, or X-User-Role is not one of the five declared roles"

  - error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    message: "Role is not permitted to perform this operation"
    triggered_by: "The acting role is not in the endpoint's roles list"

  - error_id: ERR_BASE_NOT_OWNED
    http_status: 403
    message: "Chief pilot may only act on pilots of their own base"
    triggered_by: "Role BaseChiefPilot with X-User-ID != the target Pilot's base_id"

  - error_id: ERR_AGREEMENT_NOT_FOUND
    http_status: 404
    message: "Agreement not found"
    triggered_by: "agreementId in the path does not exist"

  - error_id: ERR_CREW_BASE_NOT_FOUND
    http_status: 404
    message: "Crew base not found"
    triggered_by: "baseId in the path does not exist"

  - error_id: ERR_AIRCRAFT_NOT_FOUND
    http_status: 404
    message: "Aircraft not found"
    triggered_by: "aircraftId in the path does not exist"

  - error_id: ERR_PILOT_NOT_FOUND
    http_status: 404
    message: "Pilot not found"
    triggered_by: "pilotId in the path does not exist"

  - error_id: ERR_SCHEDULE_CYCLE_NOT_FOUND
    http_status: 404
    message: "Schedule cycle not found"
    triggered_by: "cycleId in the path does not exist"

  - error_id: ERR_FLIGHT_LEG_NOT_FOUND
    http_status: 404
    message: "Flight leg not found"
    triggered_by: "legId in the path does not exist"

  - error_id: ERR_CANCELLATION_CLAIM_NOT_FOUND
    http_status: 404
    message: "Cancellation claim not found"
    triggered_by: "claimId in the path does not exist"

  - error_id: ERR_PASSTHROUGH_CLAIM_NOT_FOUND
    http_status: 404
    message: "Pass-through claim not found"
    triggered_by: "claimId in the path does not exist"

  - error_id: ERR_SCORECARD_NOT_FOUND
    http_status: 404
    message: "Scorecard not found"
    triggered_by: "scorecardId in the path does not exist"

  - error_id: ERR_INVOICE_NOT_FOUND
    http_status: 404
    message: "Invoice not found"
    triggered_by: "invoiceId in the path does not exist"

  - error_id: ERR_BRAND_AUDIT_NOT_FOUND
    http_status: 404
    message: "Brand audit not found"
    triggered_by: "auditId in the path does not exist"

  - error_id: ERR_NEGOTIATION_NOT_FOUND
    http_status: 404
    message: "Extension negotiation not found"
    triggered_by: "negotiationId in the path does not exist"

  - error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    message: "A referenced resource in the request body does not exist"
    triggered_by: "agreement_id, assigned_base_id, base_id, cycle_id, aircraft_id or captain_pilot_id in the body does not resolve"

  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    message: "Request body or query is structurally invalid"
    triggered_by: "Missing required field, unknown enum member, non-positive money or block hours, more decimals than the field allows, negative published_departures, or pagination limit outside 1..100"

  - error_id: ERR_AGREEMENT_NOT_ACTIVE
    http_status: 409
    message: "Governing agreement is not ACTIVE"
    triggered_by: "Inducting a tail, opening a cycle or advancing a pilot under an agreement whose status != ACTIVE"

  - error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
    message: "expected_agreement_version does not match the current agreement version"
    triggered_by: "Opening an extension round with a stale expected_agreement_version"

  - error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412
    message: "expected_schedule_cycle_version does not match the current schedule cycle version"
    triggered_by: "Creating an invoice with a stale expected_schedule_cycle_version"

  - error_id: ERR_INVALID_STATE
    http_status: 409
    message: "Resource is not in a state that allows this transition"
    triggered_by: "Any action whose source state does not declare the transition in §1.2, including a FINAL invoice requested while the cycle is still OPEN"

  - error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    message: "Resource is already in a terminal state"
    triggered_by: "Acting on a TRANSITIONED or WITHDRAWN tail, an attrited or resigned pilot, a FINALIZED or VOIDED claim, a REJECTED pass-through, a VOIDED invoice, or an ACCEPTED or WITHDRAWN negotiation"

  - error_id: ERR_AIRCRAFT_NOT_AVAILABLE
    http_status: 409
    message: "Aircraft is not in revenue service"
    triggered_by: "Scheduling, completing or reinstating a leg on a tail whose status != IN_SERVICE (notably GROUNDED_STAFFING)"

  - error_id: ERR_PILOT_NOT_QUALIFIED
    http_status: 409
    message: "Captain is not line qualified"
    triggered_by: "Scheduling a leg with a captain whose status != LINE_QUALIFIED"

  - error_id: ERR_BASE_UNDERSTAFFED
    http_status: 409
    message: "Base does not have enough line-qualified pilots to support another tail"
    triggered_by: "Inducting a tail when (assigned_aircraft_count + 1) * pilots_required_per_aircraft > line_qualified_pilot_count"

  - error_id: ERR_CROSS_AGREEMENT_REFERENCE
    http_status: 409
    message: "Aircraft or captain belongs to a different agreement than the schedule cycle"
    triggered_by: "Scheduling a leg whose tail or captain resolves to another agreement_id"

  - error_id: ERR_DUPLICATE_PASSTHROUGH_CATEGORY
    http_status: 409
    message: "A live pass-through claim already exists for this category in this cycle"
    triggered_by: "Second POST /cpa/pass-through-claims for the same cycle_id and category while the first is not REJECTED"

  - error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    message: "A resource with this natural key already exists in this scope"
    triggered_by: "Duplicate station_code per agreement, tail_number per agreement, employee_ref per base, or cycle_month per agreement"

  - error_id: ERR_INVALID_INTERVAL
    http_status: 422
    message: "Arrival instant must be strictly after the departure instant"
    triggered_by: "scheduled_arrival_utc <= scheduled_departure_utc on creation, or actual_arrival_utc <= scheduled_departure_utc on completion"

  - error_id: ERR_AIRCRAFT_TURN_CONFLICT
    http_status: 409
    message: "Leg violates the minimum turn buffer for this aircraft"
    triggered_by: "A leg on the same tail whose turn-inflated interval overlaps an existing SCHEDULED or COMPLETED leg (separation strictly less than AIRCRAFT_MIN_TURN_MINUTES = 35)"

  - error_id: ERR_PILOT_DUTY_CAP_EXCEEDED
    http_status: 409
    message: "Captain would exceed the rolling 24-hour block-hour cap"
    triggered_by: "Total planned_block_hours for the captain inside the +/-24h window, including the new leg, exceeds PILOT_ROLLING_BLOCK_CAP_HOURS = 16.000"

  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    message: "The acting party may not adjudicate its own submission or its own offer"
    triggered_by: "Reconciling a pass-through whose actual_submitted_by_user_id == X-User-ID, or accepting a negotiation round from the side that put it on the table"

  - error_id: ERR_DISPUTE_ROUNDS_EXHAUSTED
    http_status: 409
    message: "Cancellation classification dispute rounds are exhausted"
    triggered_by: "dispute on a claim whose dispute_round already equals MAX_DISPUTE_ROUNDS = 2"

  - error_id: ERR_COUNTER_ROUNDS_EXHAUSTED
    http_status: 409
    message: "Extension negotiation counter rounds are exhausted"
    triggered_by: "counter on a negotiation whose counter_round already equals MAX_COUNTER_ROUNDS = 2"

  - error_id: ERR_CYCLE_HAS_OPEN_LEGS
    http_status: 409
    message: "Cycle still has legs that are neither completed nor cancelled"
    triggered_by: "Closing a cycle whose open_leg_count > 0"

  - error_id: ERR_AIRCRAFT_HAS_OPEN_LEGS
    http_status: 409
    message: "Aircraft still has scheduled legs"
    triggered_by: "Beginning a transition on a tail with at least one SCHEDULED leg"

  - error_id: ERR_EVIDENCE_REQUIRED
    http_status: 422
    message: "evidence_ref is required to mark remediation VERIFIED"
    triggered_by: "remediation with to_remediation_status == VERIFIED and no evidence_ref"

  - error_id: ERR_REMEDIATION_NOT_VERIFIED
    http_status: 409
    message: "Finding cannot be closed until remediation is VERIFIED"
    triggered_by: "close on an audit whose remediation_status != VERIFIED"

  - error_id: ERR_CLAIM_ALREADY_FINALIZED
    http_status: 409
    message: "Cancellation classification is already final for this leg"
    triggered_by: "reinstate on a leg whose CancellationClaim is FINALIZED"

  - error_id: ERR_FLEET_ALLOCATION_EXCEEDED
    http_status: 409
    message: "Base fleet allocation cap would be exceeded"
    triggered_by: "Inducting a tail when assigned_aircraft_count + 1 > aircraft_allocation_cap"

  - error_id: ERR_INVOICE_VARIANT_NOT_FINAL
    http_status: 422
    message: "Only a FINAL invoice can be issued for settlement"
    triggered_by: "issue-final on an invoice whose variant == PROVISIONAL"

  - error_id: ERR_PASSTHROUGH_UNRECONCILED
    http_status: 409
    message: "Cycle has pass-through claims that are not yet reconciled or rejected"
    triggered_by: "Creating a FINAL invoice, or issuing one, while any pass-through claim of the cycle is SUBMITTED or ACTUAL_SUBMITTED"

  - error_id: ERR_SCORECARD_STALE
    http_status: 409
    message: "Cycle scorecard is stale and must be recomputed before settlement"
    triggered_by: "issue-final while the cycle's Scorecard status == STALE"

  - error_id: ERR_DEPARTURE_LEDGER_OVERFLOW
    http_status: 422
    message: "Cancellation would push recorded departures past the published departure count"
    triggered_by: "cancel when cancelled_controllable_count + cancelled_uncontrollable_count + 1 > published_departures"

  - error_id: ERR_EXTENSION_TERM_NOT_LATER
    http_status: 422
    message: "Proposed term end date must be later than the current term end date"
    triggered_by: "An offer, revised offer or counter whose term end date is not strictly after Agreement.term_end_date"

# =============================================================================
# §1.7 Role / Permission Matrix
# =============================================================================
roles:
  - name: CPAAdministrator
    identity: opaque
    description: "Contract administrator for the capacity purchase agreement. Owns agreement lifecycle, fleet transitions, pass-through reconciliation, scorecard recomputation, invoice issuance and voiding, and the logical clock."
    allowed:
      - "POST /cpa/agreements"
      - "POST /cpa/agreements/{agreementId}/activate"
      - "POST /cpa/agreements/{agreementId}/terminate"
      - "POST /cpa/aircraft/{aircraftId}/transition"
      - "POST /cpa/aircraft/{aircraftId}/complete-transition"
      - "POST /cpa/schedule-cycles/{cycleId}/invoices"
      - "POST /cpa/cancellation-claims/{claimId}/finalize"
      - "POST /cpa/pass-through-claims/{claimId}/submit-actual"
      - "POST /cpa/pass-through-claims/{claimId}/reconcile"
      - "POST /cpa/scorecards/{scorecardId}/recompute"
      - "POST /cpa/invoices/{invoiceId}/issue-final"
      - "POST /cpa/invoices/{invoiceId}/void"
      - "POST /cpa/_clock/set_current_utc"
      - "all GET endpoints"
    denied:
      - "POST /cpa/schedule-cycles and all mainline scheduling actions"
      - "POST /cpa/crew-bases, POST /cpa/aircraft, POST /cpa/pilots and all regional operating actions"
      - "POST /cpa/brand-audits and the brand close action"

  - name: MainlineScheduler
    identity: opaque
    description: "Mainline partner's schedule and contract negotiation desk. Publishes cycles and legs, classifies cancellations, opens extension rounds and revises offers."
    allowed:
      - "POST /cpa/agreements/{agreementId}/extension-negotiations"
      - "POST /cpa/extension-negotiations/{negotiationId}/revise-offer"
      - "POST /cpa/extension-negotiations/{negotiationId}/accept (only a COUNTERED round)"
      - "POST /cpa/extension-negotiations/{negotiationId}/withdraw"
      - "POST /cpa/schedule-cycles"
      - "POST /cpa/schedule-cycles/{cycleId}/open"
      - "POST /cpa/schedule-cycles/{cycleId}/close"
      - "POST /cpa/flight-legs"
      - "POST /cpa/cancellation-claims/{claimId}/classify"
      - "all GET endpoints"
    denied:
      - "Agreement create, activate and terminate"
      - "Invoice creation, issuance and voiding; pass-through reconciliation; scorecard recompute"
      - "Leg completion, cancellation and reinstatement"
      - "Countering its own offer"

  - name: RegionalOpsController
    identity: opaque
    description: "Regional carrier's operations control. Owns bases, fleet registration and induction, pilot hiring, operational reporting of legs, pass-through submission, cancellation disputes and brand remediation."
    allowed:
      - "POST /cpa/crew-bases"
      - "POST /cpa/aircraft"
      - "POST /cpa/aircraft/{aircraftId}/induct"
      - "POST /cpa/pilots"
      - "POST /cpa/flight-legs/{legId}/complete"
      - "POST /cpa/flight-legs/{legId}/cancel"
      - "POST /cpa/flight-legs/{legId}/reinstate"
      - "POST /cpa/cancellation-claims/{claimId}/dispute"
      - "POST /cpa/pass-through-claims"
      - "POST /cpa/pass-through-claims/{claimId}/submit-actual"
      - "POST /cpa/extension-negotiations/{negotiationId}/counter"
      - "POST /cpa/extension-negotiations/{negotiationId}/accept (only an OFFERED round)"
      - "POST /cpa/brand-audits/{auditId}/acknowledge"
      - "POST /cpa/brand-audits/{auditId}/remediation"
      - "all GET endpoints"
    denied:
      - "POST /cpa/pass-through-claims/{claimId}/reconcile (segregation of duties)"
      - "Pilot advance and attrite (chief-pilot authority)"
      - "Cycle creation, opening, closing and leg scheduling"
      - "Invoice and scorecard operations; POST /cpa/brand-audits and brand close"

  - name: BaseChiefPilot
    identity: "entity_backed:CrewBase — X-User-ID is the id of the CrewBase the chief pilot commands, and must equal the target Pilot's base_id"
    description: "Chief pilot of one crew base. Moves pilots through training and records attrition to the mainline partner."
    allowed:
      - "POST /cpa/pilots/{pilotId}/advance (own base only)"
      - "POST /cpa/pilots/{pilotId}/attrite (own base only)"
      - "all GET endpoints"
    denied:
      - "Any pilot action on another base (ERR_BASE_NOT_OWNED)"
      - "Every other write endpoint in the service"

  - name: BrandAuditor
    identity: opaque
    description: "Brand standards auditor for uniform, cabin product and service consistency obligations. Raises findings and closes them once remediation is verified."
    allowed:
      - "POST /cpa/brand-audits"
      - "POST /cpa/brand-audits/{auditId}/close"
      - "all GET endpoints"
    denied:
      - "POST /cpa/brand-audits/{auditId}/acknowledge and /remediation (the carrier remediates, the auditor verifies closure)"
      - "Every agreement, fleet, crew, cycle, leg, pass-through, scorecard and invoice write endpoint"

