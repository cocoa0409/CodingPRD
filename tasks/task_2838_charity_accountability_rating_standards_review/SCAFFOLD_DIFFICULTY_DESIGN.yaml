              payload: {}
              as: RatingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /complaints"
              payload: { organization_id: "${org1}", complainant_kind: "DONOR", category: "MISUSE_OF_FUNDS", narrative: "restricted gift spent on unrelated overhead", corroborating_document_count: 2 }
              as: PublicUser
              as_user_id: "donor-1"
              captures: { cp1: $.data.id }
            - call: "POST /complaints/${cp1}/triage"
              payload: { disposition: "INVESTIGATE", triage_note: "documents attached" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /complaints/${cp1}/resolve"
              payload: { finding: "SUBSTANTIATED", penalty_points: 12, finding_note: "bank records confirm diversion" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { ledger_after: $.data.penalty_points_applied }
            - call: "POST /complaints/${cp1}/reverse-finding"
              payload: { reversal_reason: "the bank records were misread; the transfer was an approved program advance" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { ledger_restored: $.data.penalty_points_applied, status_restored: $.data.status }
          assert:
            - "${ledger_after} == 12 and ${ledger_restored} == 0"
            - "${status_restored} == INVESTIGATING"
            - "After the substantiation: RatingCycle.${c1}.accountability_penalty_points == 12, the ACCOUNTABILITY row had penalty_points 12, raw_points 9, normalized_score 37.50 and status STALE, and the cycle read weighted_sum_provisional 72.13, provisional_composite_score 71.13, provisional_grade NEEDS_IMPROVEMENT"
            - "After the reversal: RatingCycle.${c1}.accountability_penalty_points == 0"
            - "After the reversal: the ACCOUNTABILITY row has penalty_points == 0, raw_points == 21, normalized_score == 87.50 and status == COMPUTED"
            - "After the reversal: RatingCycle.${c1}.weighted_sum_provisional == 84.63, standards_penalty_points == 1.50, provisional_composite_score == 83.13 and provisional_grade == MEETS_STANDARDS - identical to the pre-complaint figures"
            - "After the reversal: Complaint.${cp1}.penalized_rating_cycle_id == null and resolved_at == null, while credibility_score stays 86.00 and credibility_variant stays INVESTIGATED"
            - "After the reversal: Organization.${org1}.substantiated_complaint_count == 0 again"
            - "RatingCycle.${c1}.status is SCORED throughout: the ledger round-trip never moved the cycle's own state"
