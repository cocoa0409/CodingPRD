              payload: { component_id: "${comp1}", qty_per_unit: 2, expected_recipe_version: "${rv0}" }
              as: Scheduler
              captures: { rv1: $.data.version }
          assert:
            - "http status == 201"
            - "Recipe version after add == 2 (was 1)"

      - name: occ_stale_line_version_on_run_start
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[run-start-stale-line]", "endpoints./copack/production-runs/{id}/start"]
        distinguishing_aspect: "Starting a run with expected_line_version one less than the line's current version (deliberate stale) is rejected with ERR_STALE_VERSION 412."
        test_recipe:
          setup: ["One run already started on Line A (line version advanced); a second SCHEDULED run carries the pre-start line version"]
          setup_api_calls:
            - call: "POST /copack/customers"
              payload: { name: "Acme", code: "ACME" }
              as: Receiver
              captures: { cid: $.data.id }
            - call: "POST /copack/components"
