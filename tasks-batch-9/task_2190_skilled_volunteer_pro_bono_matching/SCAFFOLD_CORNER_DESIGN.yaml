        distinguishing_aspect: "A real Volunteer caller targets a nonexistent volunteer id, so both the priority-7 existence gate and the priority-15 ownership gate apply; existence is earlier, so the answer is 404 ERR_VOLUNTEER_NOT_FOUND rather than 403 ERR_NOT_RESOURCE_OWNER."
