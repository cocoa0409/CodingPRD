# =============================================================================
# Task 1949: Airline Irregular Operations & Passenger Rebooking
# Scaffold seed tables (§1.0–§1.7). Difficulty design (§1.8) and corner
# design (§1.9) live in sibling files per the scaffold-generator skill.
# =============================================================================

scenario: |
  1949. Airline Irregular Operations & Passenger Rebooking (airline operations control center): disruption detection & cancellation decision, passenger reaccommodation priority (status/fare/connection), hotel/meal voucher issuance rules, misconnect protection & interline rebooking, crew legality recheck on new schedule, refund vs credit election & regulation compliance, communications cadence & self-service rebooking, cost accounting per event

domain_name: airline-irops-rebooking
api_prefix: /irops

complexity_profile:
  primary_archetype: quota_allocation        # finite seats on recovery flights competed for by prioritized disrupted bookings
  secondary_archetype: compliance_audit      # crew legality rechecks + regulated refund/compensation handling with cost ledger
  complexity_layers:
    - optimistic_concurrency                 # OCC on ReaccommodationCase.version and Flight.version
    - cascading_side_effects                 # cancel/delay cascades: flight -> segment -> booking -> case -> comms -> event counters
    - dual_variant_calculation               # compensation provisional-vs-final; event cost accrual-vs-settled
    - selector_policy                        # recovery-option generation: pinned eligibility, ranking, tie-break, empty fallback
  entity_topology: flat                      # peer entities joined by foreign keys; no nested ownership tree in URLs
  state_machine_shape: parallel              # Booking carries two independent axes (booking_status x compensation_status); other machines add cycles/branching
  relationship_patterns:
    - one_to_many                            # Flight -> CabinInventory, Booking -> BookingSegment, Case -> Option
    - many_to_many                           # Booking <-> Flight via BookingSegment legs
    - polymorphic                            # CostEntry.source_id references Voucher/RefundElection/ReaccommodationOption by source_type
    - cross_aggregate                        # ReaccommodationOption -> InterlineAgreement; Flight -> DisruptionEvent
  role_model: peer_roles                     # OpsController / DutyManager / ReaccommodationAgent / CrewScheduler / FinanceProcessor / OpsAdmin own disjoint surfaces; Passenger self-service
  consistency_model: immediate               # every mutation + its cascade is visible in the same response

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: DisruptionEvent
    parent: null
    common_fields: true
    fields:
      - { name: event_code, type: string, source: input, description: "Unique operator code for the event, e.g. WX-HUB-0810" }
      - { name: hub, type: string, source: input, description: "Hub airport code where the disruption is centered" }
      - { name: classification, type: enum, source: input, description: "WEATHER | ATC | MECHANICAL | CREW_SHORTAGE", constraints: "MECHANICAL and CREW_SHORTAGE are controllable; WEATHER and ATC are uncontrollable" }
      - { name: is_controllable, type: boolean, source: computed, description: "true iff classification IN {MECHANICAL, CREW_SHORTAGE}" }
      - { name: event_status, type: enum, source: system, default: OPEN, description: "OPEN -> ASSESSING -> RECOVERY -> CLOSED, with RECOVERY -> ASSESSING reopen cycle" }
      - { name: cost_cap_cents, type: integer, source: input, description: "Fiscal cap on net accrual cost for this event; voucher issuance is rejected when it would push accrual_total_cents above this cap" }
      - { name: detected_at, type: datetime, source: system, description: "Logical clock value at creation" }
      - { name: affected_booking_count, type: integer, source: computed, default: 0, description: "Count of Bookings currently in booking_status DISRUPTED that have at least one BookingSegment on a Flight whose disruption_event_id = this event" }
      - { name: affected_passenger_count, type: integer, source: computed, default: 0, description: "Sum of party_size over the bookings counted in affected_booking_count" }
      - { name: accrual_total_cents, type: integer, source: computed, default: 0, description: "Net committed cost: sum of CostEntry.amount_cents for this event where entry_kind = ACCRUAL plus sum of REVERSAL entries (reversals carry negative amounts)" }
      - { name: settled_total_cents, type: integer, source: computed, default: 0, description: "Net actual cash cost: sum of CostEntry.amount_cents for this event where entry_kind = SETTLEMENT plus sum of REVERSAL entries targeting SETTLEMENT entries" }

  - name: Flight
    parent: null
    common_fields: true
    fields:
      - { name: flight_number, type: string, source: input, description: "Marketing flight number, e.g. UA1234" }
      - { name: origin, type: string, source: input, description: "Origin airport IATA code" }
      - { name: destination, type: string, source: input, description: "Destination airport IATA code" }
      - { name: sched_dep_utc, type: datetime, source: input, description: "Current scheduled departure (mutated by delay/retime)" }
      - { name: sched_arr_utc, type: datetime, source: input, description: "Current scheduled arrival (mutated by delay/retime)" }
      - { name: orig_sched_dep_utc, type: datetime, source: system, description: "Immutable snapshot of sched_dep_utc at creation; never mutated by delay/retime" }
      - { name: orig_sched_arr_utc, type: datetime, source: system, description: "Immutable snapshot of sched_arr_utc at creation; basis for arrival-delay measurement" }
      - { name: act_dep_utc, type: datetime, source: input, default: null, description: "Actual departure, set by depart" }
      - { name: act_arr_utc, type: datetime, source: input, default: null, description: "Actual arrival, set by record-actuals" }
      - { name: distance_km, type: integer, source: input, description: "Great-circle distance for compensation tier and fare proration" }
      - { name: operating_carrier, type: string, source: input, description: "Two-letter carrier code operating the flight; own carrier is 'OC'" }
      - { name: flight_status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED -> DELAYED -> IN_FLIGHT -> ARRIVED; SCHEDULED|DELAYED -> CANCELLED" }
      - { name: disruption_event_id, type: string, source: input, default: null, description: "FK -> DisruptionEvent.id; set when the flight is cancelled or delayed under an event" }
      - { name: cancelled_at, type: datetime, source: system, default: null, description: "Logical clock value when the flight entered CANCELLED" }
      - { name: crew_coverage_status, type: enum, source: computed, default: CREW_OK, description: "CREW_OK if every required role (CAPTAIN, FIRST_OFFICER) has at least one CrewAssignment with assignment_status != RELEASED and legality_status = LEGAL on this flight; else CREW_SHORT" }

  - name: CabinInventory
    parent: null
    common_fields: true
    fields:
      - { name: flight_id, type: string, source: system, description: "FK -> Flight.id" }
      - { name: cabin, type: enum, source: input, description: "ECONOMY | PREMIUM | BUSINESS | FIRST" }
      - { name: capacity, type: integer, source: input, description: "Physical seats in the cabin" }
      - { name: seats_sold, type: integer, source: system, default: 0, description: "Seats committed by non-FLOWN, non-CANCELLED booking segments (own-carrier sales)" }
      - { name: interline_seats_committed, type: integer, source: system, default: 0, description: "Seats committed on this flight to partner-carrier rebookings via interline options" }
      - { name: seats_available, type: integer, source: computed, description: "capacity - seats_sold - interline_seats_committed" }

  - name: Passenger
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Passenger display name" }
      - { name: loyalty_tier, type: enum, source: input, default: NONE, description: "NONE | SILVER | GOLD | PLATINUM" }
      - { name: special_service_codes, type: array, source: input, default: [], description: "Subset of {UMNR, WCHR, PETC}; drives priority SSR bonus" }
      - { name: contact_email, type: string, source: input, description: "Notification address" }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: passenger_id, type: string, source: input, description: "FK -> Passenger.id" }
      - { name: fare_cents, type: integer, source: input, description: "Total ticket fare for the whole itinerary and party" }
      - { name: cabin, type: enum, source: input, description: "Booked cabin for all segments: ECONOMY | PREMIUM | BUSINESS | FIRST" }
      - { name: party_size, type: integer, source: input, description: "Seats consumed per segment", constraints: ">= 1" }
      - { name: booking_status, type: enum, source: system, default: ACTIVE, description: "ACTIVE -> DISRUPTED -> REBOOKED -> DISRUPTED (cycle on re-disruption); ACTIVE|DISRUPTED -> CANCELLED; any non-CANCELLED -> COMPLETED when all segments terminal-flown" }
      - { name: compensation_status, type: enum, source: system, default: NONE, description: "NONE -> ELIGIBLE_PENDING -> ELECTED_REFUND | ELECTED_CREDIT -> SETTLED; ELIGIBLE_PENDING -> ELECTED_CREDIT via system default after deadline" }
      - { name: eligible_at, type: datetime, source: system, default: null, description: "Logical clock value when compensation_status entered ELIGIBLE_PENDING" }
      - { name: election_deadline, type: datetime, source: computed, default: null, description: "eligible_at + ELECTION_WINDOW_HOURS (72h), inclusive" }
      - { name: refund_amount_cents, type: integer, source: computed, description: "fare_cents minus sum of per-segment mileage-prorated allocations of FLOWN segments (per-segment round_half_up); at creation (no FLOWN segments) equals fare_cents; recomputed on every segment mutation" }
      - { name: credit_amount_cents, type: integer, source: computed, description: "round_half_up(refund_amount_cents * (1 + CREDIT_BONUS_PCT)); recomputed whenever refund_amount_cents is" }
      - { name: compensation_amount_cents, type: integer, source: computed, default: 0, description: "Regulatory flat compensation per booking (whole party); provisional at commit, final at arrival" }
      - { name: compensation_basis, type: enum, source: system, default: null, description: "null | PROVISIONAL | FINAL" }

  - name: BookingSegment
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id" }
      - { name: flight_id, type: string, source: input, description: "FK -> Flight.id" }
      - { name: seq_no, type: integer, source: input, description: "1-based position of the leg within the itinerary" }
      - { name: cabin, type: enum, source: system, description: "Copied from Booking.cabin at creation" }
      - { name: segment_status, type: enum, source: system, default: CONFIRMED, description: "CONFIRMED -> DISRUPTED -> CANCELLED | REBOOKED; CONFIRMED -> FLOWN; DISRUPTED -> CANCELLED" }
      - { name: reaccommodation_case_id, type: string, source: system, default: null, description: "FK -> ReaccommodationCase.id; set on segments created by a commit (the replacement legs)" }

  - name: ReaccommodationCase
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id" }
      - { name: disruption_event_id, type: string, source: system, description: "FK -> DisruptionEvent.id of the event that caused the disruption" }
      - { name: priority_score, type: integer, source: computed, description: "Reaccommodation priority per calculation reaccommodation_priority_score" }
      - { name: case_status, type: enum, source: system, default: QUEUED, description: "QUEUED -> OFFERED -> COMMITTED | EXPIRED; QUEUED|OFFERED -> ESCALATED; ESCALATED -> OFFERED (regenerate); OFFERED -> EXPIRED; any non-terminal -> VOIDED when booking cancelled" }
      - { name: queued_at, type: datetime, source: system, description: "Logical clock value at case creation" }
      - { name: committed_option_id, type: string, source: system, default: null, description: "FK -> ReaccommodationOption.id accepted at commit" }

  - name: ReaccommodationOption
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> ReaccommodationCase.id" }
      - { name: interline_agreement_id, type: string, source: system, default: null, description: "FK -> InterlineAgreement.id; set only when is_interline = true" }
      - { name: is_interline, type: boolean, source: system, description: "true when the option's first leg operates on a partner carrier under an agreement" }
      - { name: legs, type: array, source: system, description: "Ordered list of {flight_id, cabin} replacement legs chosen by the selector" }
      - { name: est_first_dep_utc, type: datetime, source: system, description: "Scheduled departure of legs[0] at generation time" }
      - { name: est_final_arr_utc, type: datetime, source: system, description: "Scheduled arrival of the last leg at generation time" }
      - { name: projected_arrival_delay_minutes, type: integer, source: system, description: "est_final_arr_utc minus the orig_sched_arr_utc of the flight of the booking's highest-seq_no original segment, in minutes" }
      - { name: interline_fare_cents, type: integer, source: system, default: 0, description: "Face value of interline carriage: party_size * partner leg distance_km * INTERLINE_KM_RATE_CENTS" }
      - { name: rank_score, type: integer, source: system, description: "Selector ranking key: fewer stops better, earlier arrival better, own metal better; lower sorts first" }
      - { name: option_status, type: enum, source: system, default: PROPOSED, description: "PROPOSED -> ACCEPTED | REJECTED | EXPIRED" }

  - name: InterlineAgreement
    parent: null
    common_fields: true
    fields:
      - { name: partner_carrier, type: string, source: input, description: "Two-letter partner carrier code" }
      - { name: origin, type: string, source: input, description: "Route scope origin airport" }
      - { name: destination, type: string, source: input, description: "Route scope destination airport" }
      - { name: cabin_map, type: object, source: input, description: "Map of our cabin -> partner booking class, e.g. {ECONOMY: 'Y', BUSINESS: 'J'}" }
      - { name: settlement_rate_pct, type: integer, source: input, description: "Percent of interline_fare_cents the partner bills us; 0-100" }
      - { name: seats_quota_per_flight, type: integer, source: input, description: "Max interline seats committed per partner flight under this agreement" }
      - { name: agreement_status, type: enum, source: system, default: ACTIVE, description: "ACTIVE <-> SUSPENDED (toggle)" }

  - name: Voucher
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id" }
      - { name: disruption_event_id, type: string, source: system, description: "FK -> DisruptionEvent.id (copied from the booking's reaccommodation case)" }
      - { name: voucher_type, type: enum, source: input, description: "HOTEL | MEAL | TRANSPORT" }
      - { name: check_in_date, type: string, source: input, default: null, description: "ISO date, required for HOTEL; first covered night" }
      - { name: nights, type: integer, source: computed, default: 0, description: "HOTEL only: max(1, ceil(disruption_window_hours / 24)), capped at MAX_HOTEL_NIGHTS = 3" }
      - { name: meals_count, type: integer, source: computed, default: 0, description: "MEAL only: min(3, floor(disruption_window_hours / MEAL_WINDOW_HOURS))" }
      - { name: face_value_cents, type: integer, source: computed, description: "HOTEL: nights * HOTEL_NIGHT_CAP_CENTS; MEAL: meals_count * MEAL_RATE_CENTS; TRANSPORT: TRANSPORT_FLAT_CENTS" }
      - { name: valid_through, type: string, source: system, description: "ISO date after which the voucher is EXPIRED: HOTEL = check_in_date + nights days; MEAL = issue date + 1 day; TRANSPORT = issue date + 2 days" }
      - { name: voucher_status, type: enum, source: system, default: ISSUED, description: "ISSUED -> REDEEMED | VOIDED | EXPIRED" }
      - { name: redeemed_amount_cents, type: integer, source: input, default: null, description: "Actual redeemed value, set by redeem" }

  - name: CrewAssignment
    parent: null
    common_fields: true
    fields:
      - { name: flight_id, type: string, source: system, description: "FK -> Flight.id" }
      - { name: crew_member_ref, type: string, source: input, description: "Opaque crew member identifier (crew roster lives outside this system)" }
      - { name: crew_role, type: enum, source: input, description: "CAPTAIN | FIRST_OFFICER | FLIGHT_ATTENDANT" }
      - { name: duty_start_utc, type: datetime, source: input, description: "Duty period start" }
      - { name: duty_end_utc, type: datetime, source: input, description: "Duty period end; must be strictly greater than duty_start_utc and at most MAX_DUTY_HOURS (14h) later" }
      - { name: legality_status, type: enum, source: system, default: LEGAL, description: "LEGAL | FLAGGED_ILLEGAL (after retime the duty no longer covers the flight)" }
      - { name: assignment_status, type: enum, source: system, default: ASSIGNED, description: "ASSIGNED -> RELEASED" }

  - name: RefundElection
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id" }
      - { name: election, type: enum, source: input, description: "REFUND | CREDIT" }
      - { name: election_source, type: enum, source: system, default: USER, description: "USER | SYSTEM_DEFAULT (process-due auto-credit after election_deadline)" }
      - { name: refund_amount_cents, type: integer, source: computed, description: "Snapshot of Booking.refund_amount_cents at creation; paid only when election = REFUND" }
      - { name: credit_amount_cents, type: integer, source: computed, description: "Snapshot of Booking.credit_amount_cents at creation; issued only when election = CREDIT" }
      - { name: compensation_amount_cents, type: integer, source: computed, description: "Snapshot of Booking.compensation_amount_cents at creation; paid with either election" }
      - { name: election_status, type: enum, source: system, default: PENDING, description: "PENDING -> PROCESSED" }

  - name: CostEntry
    parent: null
    common_fields: false
    fields:
      - { name: disruption_event_id, type: string, source: system, description: "FK -> DisruptionEvent.id" }
      - { name: source_type, type: enum, source: system, description: "VOUCHER | REFUND | CREDIT | COMPENSATION | INTERLINE" }
      - { name: source_id, type: string, source: system, description: "Id of the source row; resolve via source_type (VOUCHER -> Voucher.id, REFUND|CREDIT|COMPENSATION -> RefundElection.id, INTERLINE -> ReaccommodationOption.id)" }
      - { name: entry_kind, type: enum, source: system, description: "ACCRUAL | SETTLEMENT | REVERSAL" }
      - { name: amount_cents, type: integer, source: system, description: "Signed amount; REVERSAL entries are negative" }
      - { name: note, type: string, source: system, default: "", description: "Free-form audit note" }

  - name: CommunicationLog
    parent: null
    common_fields: false
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id" }
      - { name: disruption_event_id, type: string, source: system, description: "FK -> DisruptionEvent.id" }
      - { name: template, type: enum, source: system, description: "DISRUPTION_DETECTED | CANCELLATION | REBOOK_OFFER | REBOOK_CONFIRMED | REMINDER | ELECTION_DEFAULT" }
      - { name: channel, type: enum, source: system, description: "EMAIL | SMS" }
      - { name: due_at, type: datetime, source: system, description: "Earliest logical time the message may be sent" }
      - { name: sent_at, type: datetime, source: system, default: null, description: "Set when process-due sends it" }
      - { name: log_status, type: enum, source: system, default: QUEUED, description: "QUEUED -> SENT | FAILED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Flight
    initial_state: SCHEDULED
    terminal_states: [CANCELLED, ARRIVED]
    transitions:
      - from: SCHEDULED
        to: DELAYED
        trigger: "POST /irops/flights/{id}/delay"
        actor: OpsController
        preconditions:
          - "flight_status = SCHEDULED (else ERR_FLIGHT_NOT_DELAYABLE)"
          - "expected_flight_version matches Flight.version (else ERR_STALE_VERSION)"
          - "new_sched_arr_utc > new_sched_dep_utc (else ERR_INVALID_REQUEST)"
          - "if disruption_event_id supplied: event exists and event_status IN {OPEN, ASSESSING, RECOVERY} (else ERR_EVENT_INVALID_STATE)"
        side_effects:
          - "sets sched_dep_utc/sched_arr_utc to the new times; increments Flight.version by 1"
          - "crew legality re-eval (calculation crew_legality_eval): assignments whose duty window no longer covers [new dep, new arr + 30min] become FLAGGED_ILLEGAL; Flight.crew_coverage_status recomputed (CREW_SHORT if CAPTAIN or FIRST_OFFICER lacks a LEGAL non-RELEASED assignment)"
          - "misconnect protection (link 1 of cascade): for every BookingSegment on this flight in CONFIRMED whose Booking has a next segment N+1 in CONFIRMED on a flight departing < MIN_CONNECT_MINUTES (45) after the new arrival, segment N+1 becomes DISRUPTED"
          - "each segment mutated above triggers: its Booking.booking_status becomes DISRUPTED (link 2)"
          - "each booking mutated above triggers: a ReaccommodationCase is created (QUEUED, priority_score computed) if the booking has no case in {QUEUED, OFFERED, ESCALATED} (link 3)"
          - "each case created above triggers: CommunicationLog DISRUPTION_DETECTED queued with due_at = now (link 4)"
      - from: DELAYED
        to: DELAYED
        trigger: "POST /irops/flights/{id}/delay (retime)"
        actor: OpsController
        preconditions:
          - "flight_status = DELAYED (else ERR_FLIGHT_NOT_DELAYABLE)"
          - "expected_flight_version matches Flight.version (else ERR_STALE_VERSION)"
          - "new_sched_arr_utc > new_sched_dep_utc (else ERR_INVALID_REQUEST)"
        side_effects:
          - "same crew legality re-eval, misconnect cascade, and version increment as SCHEDULED -> DELAYED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /irops/flights/{id}/cancel"
        actor: OpsController
        preconditions:
          - "flight_status IN {SCHEDULED, DELAYED} (else ERR_FLIGHT_NOT_CANCELLABLE)"
          - "expected_flight_version matches Flight.version (else ERR_STALE_VERSION)"
          - "disruption_event_id is required and the event's event_status IN {ASSESSING, RECOVERY} (else ERR_EVENT_INVALID_STATE)"
        side_effects:
          - "sets cancelled_at = now; increments Flight.version by 1"
          - "link 1: every BookingSegment on this flight in CONFIRMED becomes CANCELLED"
          - "link 2: each Booking owning such a segment becomes DISRUPTED (unless already DISRUPTED)"
          - "link 3: each booking that became DISRUPTED gets a ReaccommodationCase (QUEUED, priority_score computed) if none open, and its compensation_status becomes ELIGIBLE_PENDING with eligible_at = now when the linked event is_controllable (compensation_amount_cents initialized to the distance-tier base, compensation_basis = PROVISIONAL)"
          - "link 4: each case created queues CommunicationLog CANCELLATION (due_at = now); event affected_booking_count / affected_passenger_count recomputed"
      - from: DELAYED
        to: CANCELLED
        trigger: "POST /irops/flights/{id}/cancel"
        actor: OpsController
        preconditions:
          - "flight_status IN {SCHEDULED, DELAYED} (else ERR_FLIGHT_NOT_CANCELLABLE)"
          - "expected_flight_version matches Flight.version (else ERR_STALE_VERSION)"
          - "disruption_event_id required, event_status IN {ASSESSING, RECOVERY} (else ERR_EVENT_INVALID_STATE)"
        side_effects:
          - "same cascade as SCHEDULED -> CANCELLED"
      - from: SCHEDULED
        to: IN_FLIGHT
        trigger: "POST /irops/flights/{id}/depart"
        actor: OpsController
        preconditions:
          - "flight_status IN {SCHEDULED, DELAYED} (else ERR_FLIGHT_NOT_DELAYABLE)"
        side_effects:
          - "sets act_dep_utc; increments Flight.version by 1"
      - from: DELAYED
        to: IN_FLIGHT
        trigger: "POST /irops/flights/{id}/depart"
        actor: OpsController
        preconditions:
          - "flight_status IN {SCHEDULED, DELAYED} (else ERR_FLIGHT_NOT_DELAYABLE)"
        side_effects:
          - "sets act_dep_utc; increments Flight.version by 1"
      - from: IN_FLIGHT
        to: ARRIVED
        trigger: "POST /irops/flights/{id}/record-actuals"
        actor: OpsController
        preconditions:
          - "flight_status = IN_FLIGHT (else ERR_FLIGHT_NOT_DELAYABLE)"
          - "act_arr_utc > act_dep_utc (else ERR_INVALID_REQUEST)"
        side_effects:
          - "sets act_arr_utc; increments Flight.version by 1"
          - "every BookingSegment on this flight in CONFIRMED becomes FLOWN"
          - "booking rollup: a Booking whose every segment is in {FLOWN, CANCELLED, REBOOKED} with at least one FLOWN and none DISRUPTED becomes COMPLETED"
          - "final compensation recompute (calculation compensation_amount, variant final) for every Booking with compensation_status IN {ELIGIBLE_PENDING, ELECTED_REFUND, ELECTED_CREDIT} whose current itinerary ends on this flight: compensation_amount_cents recomputed from actual arrival delay, compensation_basis = FINAL"
          - "arrival-delay eligibility: if this flight is linked to a controllable event and actual arrival delay (act_arr_utc - orig_sched_arr_utc) >= COMP_DELAY_THRESHOLD_MINUTES (180), every Booking holding a segment on this flight in CONFIRMED gains compensation_status = ELIGIBLE_PENDING with eligible_at = now and compensation_amount_cents = distance-tier base with compensation_basis = FINAL"

  - entity: DisruptionEvent
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: ASSESSING
        trigger: "POST /irops/disruption-events/{id}/assess"
        actor: DutyManager
        preconditions:
          - "event_status = OPEN (else ERR_EVENT_INVALID_STATE)"
        side_effects:
          - "increments DisruptionEvent.version by 1"
      - from: ASSESSING
        to: RECOVERY
        trigger: "POST /irops/disruption-events/{id}/declare-recovery"
        actor: DutyManager
        preconditions:
          - "event_status = ASSESSING (else ERR_EVENT_INVALID_STATE)"
        side_effects:
          - "increments DisruptionEvent.version by 1"
      - from: RECOVERY
        to: ASSESSING
        trigger: "POST /irops/disruption-events/{id}/reopen"
        actor: DutyManager
        preconditions:
          - "event_status = RECOVERY (else ERR_EVENT_INVALID_STATE)"
        side_effects:
          - "increments DisruptionEvent.version by 1"
          - "voucher issuance is blocked while the event is back in ASSESSING"
      - from: RECOVERY
        to: CLOSED
        trigger: "POST /irops/disruption-events/{id}/close"
        actor: DutyManager
        preconditions:
          - "event_status = RECOVERY (else ERR_EVENT_INVALID_STATE)"
          - "no ReaccommodationCase for this event in {QUEUED, OFFERED, ESCALATED} (else ERR_EVENT_CLOSE_BLOCKED)"
          - "no Voucher for this event in ISSUED (else ERR_EVENT_CLOSE_BLOCKED)"
          - "no Booking with a case on this event in compensation_status ELIGIBLE_PENDING (else ERR_EVENT_CLOSE_BLOCKED)"
          - "no RefundElection for a booking of this event in PENDING (else ERR_EVENT_CLOSE_BLOCKED)"
        side_effects:
          - "increments DisruptionEvent.version by 1"

  - entity: Booking
    initial_state: ACTIVE
    terminal_states: [CANCELLED, COMPLETED]
    note: "Two independent axes evolve on one row: booking_status (travel fulfillment) and compensation_status (regulatory money). Neither axis gates the other except that elections require booking DISRUPTED/REBOOKED (not CANCELLED voluntarily before eligibility)."
    transitions:
      - from: ACTIVE
        to: DISRUPTED
        trigger: "system cascade: a segment becomes DISRUPTED or CANCELLED via flight delay/cancel"
        actor: system
        preconditions: []
        side_effects:
          - "ReaccommodationCase auto-created if none open (QUEUED, priority_score computed)"
          - "CommunicationLog DISRUPTION_DETECTED or CANCELLATION queued"
      - from: DISRUPTED
        to: REBOOKED
        trigger: "POST /irops/reaccommodation-cases/{id}/commit"
        actor: ReaccommodationAgent | Passenger
        preconditions:
          - "the case is OFFERED and option PROPOSED (see ReaccommodationCase machine)"
        side_effects:
          - "old DISRUPTED segments become REBOOKED; new CONFIRMED segments created from the option legs with reaccommodation_case_id set"
          - "seat move: old flights' CabinInventory.seats_sold -= party_size per replaced segment; new flights' seats_sold += party_size (or interline_seats_committed for partner legs)"
      - from: REBOOKED
        to: DISRUPTED
        trigger: "system cascade: a replacement flight is itself delayed past misconnect or cancelled"
        actor: system
        preconditions: []
        side_effects:
          - "same case/comm auto-creation as ACTIVE -> DISRUPTED (re-disruption loop)"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /irops/bookings/{id}/cancel (voluntary)"
        actor: ReaccommodationAgent | Passenger
        preconditions:
          - "booking_status IN {ACTIVE, DISRUPTED, REBOOKED} (else ERR_INVALID_BOOKING_STATE)"
        side_effects:
          - "non-FLOWN segments become CANCELLED; each such segment releases seats: CabinInventory.seats_sold -= party_size"
          - "open ReaccommodationCase becomes VOIDED; its PROPOSED options become EXPIRED"
          - "compensation_status unchanged by voluntary cancel (no eligibility gained)"
      - from: DISRUPTED
        to: CANCELLED
        trigger: "POST /irops/bookings/{id}/cancel (involuntary path)"
        actor: ReaccommodationAgent | Passenger
        preconditions:
          - "booking_status IN {ACTIVE, DISRUPTED, REBOOKED} (else ERR_INVALID_BOOKING_STATE)"
        side_effects:
          - "same seat release and case voiding as ACTIVE -> CANCELLED"
      - from: REBOOKED
        to: CANCELLED
        trigger: "POST /irops/bookings/{id}/cancel"
        actor: ReaccommodationAgent | Passenger
        preconditions:
          - "booking_status IN {ACTIVE, DISRUPTED, REBOOKED} (else ERR_INVALID_BOOKING_STATE)"
        side_effects:
          - "same seat release and case voiding as ACTIVE -> CANCELLED"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system rollup on flight arrival"
        actor: system
        preconditions:
          - "every segment in {FLOWN, CANCELLED, REBOOKED}, at least one FLOWN, none DISRUPTED or CONFIRMED"
        side_effects: []
      - from: REBOOKED
        to: COMPLETED
        trigger: "system rollup on flight arrival"
        actor: system
        preconditions:
          - "every segment in {FLOWN, CANCELLED, REBOOKED}, at least one FLOWN, none DISRUPTED or CONFIRMED"
        side_effects: []
      - from: NONE
        to: ELIGIBLE_PENDING
        trigger: "system: controllable-event cancellation, or arrival delay >= 180 on a controllable-event flight"
        actor: system
        preconditions: []
        side_effects:
          - "sets eligible_at = now; election_deadline = eligible_at + 72h"
      - from: ELIGIBLE_PENDING
        to: ELECTED_REFUND
        trigger: "POST /irops/bookings/{id}/refund-elections with election = REFUND"
        actor: ReaccommodationAgent | Passenger
        preconditions:
          - "compensation_status = ELIGIBLE_PENDING (else ERR_COMPENSATION_NOT_ELIGIBLE)"
          - "now <= election_deadline (else ERR_ELECTION_WINDOW_CLOSED)"
        side_effects:
          - "RefundElection created (PENDING) with amount snapshots"
      - from: ELIGIBLE_PENDING
        to: ELECTED_CREDIT
        trigger: "POST /irops/bookings/{id}/refund-elections with election = CREDIT, or system default via POST /irops/communications/process-due when now > election_deadline"
        actor: ReaccommodationAgent | Passenger | system
        preconditions:
          - "compensation_status = ELIGIBLE_PENDING (else ERR_COMPENSATION_NOT_ELIGIBLE)"
          - "user path: now <= election_deadline (else ERR_ELECTION_WINDOW_CLOSED)"
        side_effects:
          - "RefundElection created (PENDING for user path; PROCESSED with election_source SYSTEM_DEFAULT for the default path, which also posts CREDIT + COMPENSATION CostEntries and queues CommunicationLog ELECTION_DEFAULT)"
          - "system-default path only: because the election is created already PROCESSED, compensation_status immediately advances to SETTLED"
      - from: ELECTED_REFUND
        to: SETTLED
        trigger: "POST /irops/refund-elections/{id}/process"
        actor: FinanceProcessor
        preconditions:
          - "election_status = PENDING (else ERR_ELECTION_NOT_PENDING)"
        side_effects:
          - "posts CostEntries: REFUND accrual+settlement at refund_amount_cents, COMPENSATION accrual+settlement at compensation_amount_cents (amount 0 rows are not posted)"
      - from: ELECTED_CREDIT
        to: SETTLED
        trigger: "POST /irops/refund-elections/{id}/process (user-elected credit)"
        actor: FinanceProcessor
        preconditions:
          - "election_status = PENDING (else ERR_ELECTION_NOT_PENDING)"
        side_effects:
          - "posts CostEntries: CREDIT accrual at credit_amount_cents, COMPENSATION accrual+settlement at compensation_amount_cents"

  - entity: BookingSegment
    initial_state: CONFIRMED
    terminal_states: [FLOWN, CANCELLED, REBOOKED]
    transitions:
      - from: CONFIRMED
        to: DISRUPTED
        trigger: "system cascade (flight cancel or misconnect protection)"
        actor: system
        preconditions: []
        side_effects:
          - "booking rollup to DISRUPTED"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "system cascade (flight cancel) or booking cancel"
        actor: system
        preconditions: []
        side_effects:
          - "seat release when caused by booking cancel (flight cancel retains seats_sold for audit until segments are rebooked)"
      - from: DISRUPTED
        to: REBOOKED
        trigger: "system cascade on case commit"
        actor: system
        preconditions: []
        side_effects:
          - "seat move to replacement flight"
      - from: DISRUPTED
        to: CANCELLED
        trigger: "booking cancel"
        actor: system
        preconditions: []
        side_effects:
          - "seat release"
      - from: CONFIRMED
        to: FLOWN
        trigger: "system on flight record-actuals"
        actor: system
        preconditions: []
        side_effects:
          - "booking completion rollup; refund/credit amounts recomputed (flown allocation set changed)"

  - entity: ReaccommodationCase
    initial_state: QUEUED
    terminal_states: [COMMITTED, EXPIRED, VOIDED]
    transitions:
      - from: QUEUED
        to: OFFERED
        trigger: "POST /irops/reaccommodation-cases/{id}/generate-options"
        actor: ReaccommodationAgent | Passenger
        preconditions:
          - "case_status IN {QUEUED, ESCALATED} (else ERR_CASE_NOT_COMMITTABLE)"
          - "selector finds >= 1 candidate (else ERR_NO_REACCOM_OPTIONS; case stays QUEUED)"
        side_effects:
          - "prior PROPOSED options become EXPIRED; new options created (PROPOSED); increments ReaccommodationCase.version by 1"
          - "CommunicationLog REBOOK_OFFER queued for the booking"
      - from: ESCALATED
        to: OFFERED
        trigger: "POST /irops/reaccommodation-cases/{id}/generate-options"
        actor: ReaccommodationAgent | Passenger
        preconditions:
          - "case_status IN {QUEUED, ESCALATED} (else ERR_CASE_NOT_COMMITTABLE)"
          - "selector finds >= 1 candidate (else ERR_NO_REACCOM_OPTIONS; case stays ESCALATED)"
        side_effects:
          - "same as QUEUED -> OFFERED"
      - from: OFFERED
        to: COMMITTED
        trigger: "POST /irops/reaccommodation-cases/{id}/commit"
        actor: ReaccommodationAgent | Passenger
        preconditions:
          - "case_status = OFFERED (else ERR_CASE_NOT_COMMITTABLE)"
          - "expected_case_version matches ReaccommodationCase.version (else ERR_STALE_VERSION)"
          - "option exists and option_status = PROPOSED (else ERR_OPTION_NOT_PROPOSED)"
          - "every leg flight has flight_status IN {SCHEDULED, DELAYED} (else ERR_OPTION_NOT_PROPOSED; the option is marked EXPIRED)"
          - "every leg cabin has seats_available >= party_size, or for interline legs interline_seats_committed + party_size <= agreement.seats_quota_per_flight (else ERR_SEATS_INSUFFICIENT)"
          - "if option is interline: agreement agreement_status = ACTIVE (else ERR_INTERLINE_AGREEMENT_INACTIVE)"
        side_effects:
          - "option ACCEPTED; all sibling PROPOSED options REJECTED; committed_option_id set; increments ReaccommodationCase.version by 1"
          - "booking DISRUPTED -> REBOOKED with seat move and new segments (see Booking machine)"
          - "provisional compensation recompute (calculation compensation_amount, variant provisional) from option.projected_arrival_delay_minutes; compensation_basis = PROVISIONAL"
          - "interline cost: if is_interline, post CostEntry INTERLINE ACCRUAL = round_half_up(interline_fare_cents * settlement_rate_pct / 100)"
          - "crew legality re-eval runs on every leg flight (retime does not occur, but coverage is recomputed)"
          - "CommunicationLog REBOOK_CONFIRMED queued"
      - from: QUEUED
        to: ESCALATED
        trigger: "POST /irops/reaccommodation-cases/{id}/escalate"
        actor: ReaccommodationAgent
        preconditions:
          - "case_status IN {QUEUED, OFFERED} (else ERR_CASE_NOT_COMMITTABLE)"
        side_effects:
          - "increments ReaccommodationCase.version by 1"
      - from: OFFERED
        to: ESCALATED
        trigger: "POST /irops/reaccommodation-cases/{id}/escalate"
        actor: ReaccommodationAgent
        preconditions:
          - "case_status IN {QUEUED, OFFERED} (else ERR_CASE_NOT_COMMITTABLE)"
        side_effects:
          - "increments ReaccommodationCase.version by 1"
      - from: OFFERED
        to: EXPIRED
        trigger: "system via POST /irops/communications/process-due sweep when every PROPOSED option's first leg dep <= now"
        actor: system
        preconditions: []
        side_effects:
          - "remaining PROPOSED options become EXPIRED"
      - from: QUEUED
        to: VOIDED
        trigger: "system cascade on booking cancel"
        actor: system
        preconditions: []
        side_effects:
          - "PROPOSED options become EXPIRED"
      - from: OFFERED
        to: VOIDED
        trigger: "system cascade on booking cancel"
        actor: system
        preconditions: []
        side_effects:
          - "PROPOSED options become EXPIRED"
      - from: ESCALATED
        to: VOIDED
        trigger: "system cascade on booking cancel"
        actor: system
        preconditions: []
        side_effects:
          - "PROPOSED options become EXPIRED"

  - entity: ReaccommodationOption
    initial_state: PROPOSED
    terminal_states: [ACCEPTED, REJECTED, EXPIRED]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "case commit"
        actor: ReaccommodationAgent | Passenger
        preconditions: ["see ReaccommodationCase QUEUED/OFFERED -> COMMITTED preconditions"]
        side_effects: ["sibling options REJECTED"]
      - from: PROPOSED
        to: REJECTED
        trigger: "system when a sibling option is accepted"
        actor: system
        preconditions: []
        side_effects: []
      - from: PROPOSED
        to: EXPIRED
        trigger: "system: regeneration supersedes it, target flight cancelled/departed, or process-due sweep past first-leg departure"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Voucher
    initial_state: ISSUED
    terminal_states: [REDEEMED, VOIDED, EXPIRED]
    transitions:
      - from: ISSUED
        to: REDEEMED
        trigger: "POST /irops/vouchers/{id}/redeem"
        actor: FinanceProcessor
        preconditions:
          - "voucher_status = ISSUED (else ERR_VOUCHER_NOT_OPEN)"
          - "actual_amount_cents >= 0 (else ERR_INVALID_REQUEST)"
        side_effects:
          - "posts CostEntry SETTLEMENT = actual_amount_cents (source VOUCHER)"
      - from: ISSUED
        to: VOIDED
        trigger: "POST /irops/vouchers/{id}/void"
        actor: FinanceProcessor
        preconditions:
          - "voucher_status = ISSUED (else ERR_VOUCHER_NOT_OPEN)"
        side_effects:
          - "posts CostEntry REVERSAL = -face_value_cents (compensates the ACCRUAL posted at issuance)"
      - from: ISSUED
        to: EXPIRED
        trigger: "system via process-due sweep when valid_through < current date"
        actor: system
        preconditions: []
        side_effects:
          - "posts CostEntry REVERSAL = -face_value_cents"

  - entity: CrewAssignment
    initial_state: ASSIGNED
    terminal_states: [RELEASED]
    transitions:
      - from: ASSIGNED
        to: RELEASED
        trigger: "POST /irops/crew-assignments/{id}/release"
        actor: CrewScheduler
        preconditions:
          - "assignment_status = ASSIGNED (else ERR_INVALID_CREW_STATE)"
        side_effects:
          - "Flight.crew_coverage_status recomputed"
      - from: ASSIGNED
        to: ASSIGNED
        trigger: "system legality re-eval on flight retime (legality_status dimension: LEGAL -> FLAGGED_ILLEGAL)"
        actor: system
        preconditions: []
        side_effects:
          - "Flight.crew_coverage_status recomputed"

  - entity: RefundElection
    initial_state: PENDING
    terminal_states: [PROCESSED]
    transitions:
      - from: PENDING
        to: PROCESSED
        trigger: "POST /irops/refund-elections/{id}/process"
        actor: FinanceProcessor
        preconditions:
          - "election_status = PENDING (else ERR_ELECTION_NOT_PENDING)"
        side_effects:
          - "posts CostEntries per Booking compensation axis side effects; booking compensation_status -> SETTLED"

  - entity: InterlineAgreement
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /irops/interline-agreements/{id}/suspend"
        actor: OpsAdmin
        preconditions: []
        side_effects: ["increments InterlineAgreement.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /irops/interline-agreements/{id}/suspend"
        actor: OpsAdmin
        preconditions: []
        side_effects: ["increments InterlineAgreement.version by 1"]

  - entity: CommunicationLog
    initial_state: QUEUED
    terminal_states: [SENT, FAILED]
    transitions:
      - from: QUEUED
        to: SENT
        trigger: "POST /irops/communications/process-due"
        actor: OpsAdmin
        preconditions:
          - "log_status = QUEUED and due_at <= now"
        side_effects: ["sets sent_at = now"]
      - from: QUEUED
        to: FAILED
        trigger: "POST /irops/communications/process-due (channel failure injection is out of scope; reserved)"
        actor: OpsAdmin
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: case-commit-stale-version
    parent_entity: ReaccommodationCase
    write_endpoint: "POST /irops/reaccommodation-cases/{id}/commit"
    occ_field: "expected_case_version"
    description: |
      Committing an option against a ReaccommodationCase whose version has
      advanced since the client last observed it (for example because options
      were regenerated, which bumps the version) is rejected. The client must
      re-read the case and resubmit with the current version.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: flight-retime-stale-version
    parent_entity: Flight
    write_endpoint: "POST /irops/flights/{id}/delay"
    occ_field: "expected_flight_version"
    description: |
      Retiming a Flight whose version has advanced since the client last
      observed it (for example because a crew assignment changed the flight's
      crew_coverage_status, bumping the version) is rejected. The client must
      re-read the flight and resubmit with the current version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: reaccommodation_priority_score
    description: "Reaccommodation priority for a newly created ReaccommodationCase; higher is served first in case listings"
    trigger: "ReaccommodationCase creation (cancel cascade, misconnect cascade, or re-disruption loop)"
    algorithm: weighted_scoring
    formula: |
      score = 1000 * TIER_WEIGHT[passenger.loyalty_tier]
            + 10 * CABIN_WEIGHT[booking.cabin]
            + URGENCY_BONUS(minutes from case creation to the disrupted segment's originally scheduled departure)
            + min(SSR_CAP, sum(SSRF bonus for each code in passenger.special_service_codes))
            - GROUP_PENALTY_PER_EXTRA * min(party_size - 1, GROUP_PENALTY_MAX_EXTRA)
      URGENCY_BONUS(m) = 500 if m < 120; 250 if 120 <= m < 360; 0 if m >= 360
      SSRF(UMNR) = 300; SSRF(WCHR) = 200; SSRF(PETC) = 50
      All arithmetic is integer; no rounding occurs.
      Tie-break for ordering cases at equal score: Booking.created_at ASC (earlier booking first). Ids never participate.
    input_set: "Bookings entering DISRUPTED (their passenger, cabin, party_size, and the disrupted segment's sched_dep_utc at case creation time)"
    constants:
      TIER_WEIGHT: "{NONE: 0, SILVER: 1, GOLD: 2, PLATINUM: 4}"
      CABIN_WEIGHT: "{ECONOMY: 1, PREMIUM: 2, BUSINESS: 3, FIRST: 4}"
      SSR_CAP: 400
      GROUP_PENALTY_PER_EXTRA: 50
      GROUP_PENALTY_MAX_EXTRA: 4
      URGENCY_TIER1_MINUTES: 120
      URGENCY_TIER2_MINUTES: 360
    precision: "integer"

  - name: compensation_amount
    description: "EU261-style flat regulatory compensation per booking, driven by itinerary distance tier and final arrival delay"
    trigger: "provisional: case commit; final: record-actuals (flight ARRIVED); eligibility: controllable-event cancellation or actual arrival delay >= 180"
    algorithm: threshold
    formula: |
      base = 25000 if itinerary_distance_km <= 1500
             else 40000 if itinerary_distance_km <= 3500
             else 60000
      itinerary_distance_km = sum of Flight.distance_km over the booking's original (pre-disruption) segments
      delay = arrival delay in minutes at the final destination, ALWAYS measured against the
            booking's ORIGINAL itinerary final scheduled arrival (the orig_sched_arr_utc of the flight
            of the booking's highest-seq_no ORIGINAL segment, i.e. segments created at booking time):
            (provisional variant: ReaccommodationOption.projected_arrival_delay_minutes of the committed option;
             final variant: act_arr_utc of the flight carrying the booking's current final segment
             minus that original final scheduled arrival)
      eligible only when the linked DisruptionEvent.is_controllable = true AND
        (the disrupting flight was CANCELLED OR delay >= COMP_DELAY_THRESHOLD_MINUTES)
      reduction: if the booking reached REBOOKED via an own-metal (non-interline) option AND delay < REDUCTION_THRESHOLD_MINUTES,
        amount = round_half_up(base * REDUCTION_FACTOR); otherwise amount = base
      uncontrollable classification => amount = 0 and compensation_status stays NONE
    input_set: "Bookings whose disruption links to a controllable event; excluded: voluntary cancels before eligibility, bookings on WEATHER/ATC events"
    constants:
      COMP_DELAY_THRESHOLD_MINUTES: 180
      REDUCTION_THRESHOLD_MINUTES: 240
      REDUCTION_FACTOR: 0.5
      TIER1_MAX_KM: 1500
      TIER2_MAX_KM: 3500
      TIER1_CENTS: 25000
      TIER2_CENTS: 40000
      TIER3_CENTS: 60000
    precision: "integer cents; the only rounding is round_half_up on the 50% reduction"
    variants:
      - name: provisional
        when: "computed at case commit from the committed option's projected_arrival_delay_minutes"
        difference: "uses projected schedule, sets compensation_basis = PROVISIONAL; may diverge from final when actual times differ"
      - name: final
        when: "computed at record-actuals from act_arr_utc"
        difference: "uses actual times, sets compensation_basis = FINAL and overwrites compensation_amount_cents"

  - name: election_amounts
    description: "Refund and travel-credit amounts for a RefundElection, with pinned rounding order"
    trigger: "RefundElection creation (user path or system default)"
    algorithm: tiered_pricing
    formula: |
      alloc(seg) = round_half_up(booking.fare_cents * Flight(seg).distance_km / total_distance_km)
      total_distance_km = sum of Flight.distance_km over ALL original segments of the booking (flown or not)
      refund_amount_cents = booking.fare_cents - sum(alloc(seg) for seg in FLOWN segments)
        -- evaluation order pinned: round each FLOWN segment's allocation FIRST, sum them, subtract from fare_cents.
        -- This deliberately differs from summing allocations of UNFLOWN segments (6667 vs 6666 at fare 10000, legs 1000/1000/1000 km).
      credit_amount_cents = round_half_up(refund_amount_cents * (100 + CREDIT_BONUS_PCT_NUM) / 100)
        -- single rounding AFTER the multiplication, applied to the already-rounded refund_amount_cents.
    input_set: "Bookings with compensation_status = ELIGIBLE_PENDING; segment set = the booking's original segments"
    constants:
      CREDIT_BONUS_PCT_NUM: 10
    precision: "integer cents, round_half_up, per-segment rounding before summation"

  - name: event_cost_rollup
    description: "Per-event cost accounting totals over the append-only CostEntry ledger"
    trigger: "on every CostEntry insert (voucher issue/redeem/void/expire, election process/default, interline commit)"
    algorithm: aggregation
    formula: |
      accrual_total_cents = sum(amount_cents where entry_kind = ACCRUAL) + sum(amount_cents where entry_kind = REVERSAL and target was ACCRUAL)
      settled_total_cents = sum(amount_cents where entry_kind = SETTLEMENT) + sum(amount_cents where entry_kind = REVERSAL and target was SETTLEMENT)
      (REVERSAL entries recorded in this system always target ACCRUAL entries, so settled_total is unaffected by voids)
    input_set: "CostEntry rows for the DisruptionEvent, all entry_kind values, no time window"
    precision: "integer cents"
    variants:
      - name: accrual_basis
        when: "committed-cost view used for cap enforcement and close reporting"
        difference: "counts issued vouchers at face_value_cents even before redemption"
      - name: settled_basis
        when: "actual-cash view"
        difference: "counts vouchers at redeemed_amount_cents only after REDEEMED; identical inputs, different totals"

  - name: voucher_entitlement
    description: "Hotel/meal/transport voucher eligibility and face value from the disruption window"
    trigger: "POST /irops/bookings/{id}/vouchers"
    algorithm: threshold
    formula: |
      disruption_window_hours = (committed option's est_first_dep_utc - disrupted flight's cancelled_at or first-disruption time) in whole hours, floor for partial hours
      HOTEL: requires booking DISRUPTED or REBOOKED with a COMMITTED case, event RECOVERY and controllable,
             and disruption_window_hours >= HOTEL_WINDOW_THRESHOLD_HOURS (8);
             nights = min(MAX_HOTEL_NIGHTS, max(1, ceil(disruption_window_hours / 24)));
             face_value_cents = nights * HOTEL_NIGHT_CAP_CENTS
      MEAL: same state gates; meals_count = min(3, floor(disruption_window_hours / MEAL_WINDOW_HOURS));
            requires meals_count >= 1; face_value_cents = meals_count * MEAL_RATE_CENTS
      TRANSPORT: requires booking DISRUPTED (no committed case needed); face_value_cents = TRANSPORT_FLAT_CENTS
      Fiscal gates (after entitlement): per-booking voucher face total <= BOOKING_VOUCHER_CAP_CENTS,
        and event accrual_total_cents + face_value_cents <= event.cost_cap_cents
    input_set: "Bookings in DISRUPTED or REBOOKED tied to a controllable event in RECOVERY"
    constants:
      HOTEL_WINDOW_THRESHOLD_HOURS: 8
      HOTEL_NIGHT_CAP_CENTS: 15000
      MAX_HOTEL_NIGHTS: 3
      MEAL_WINDOW_HOURS: 4
      MEAL_RATE_CENTS: 1500
      TRANSPORT_FLAT_CENTS: 5000
      BOOKING_VOUCHER_CAP_CENTS: 40000
    precision: "integer cents"

  - name: crew_legality_eval
    description: "Crew legality recheck whenever a flight is retimed"
    algorithm: constraint_propagation
    trigger: "flight delay/retime side effect; also evaluated at CrewAssignment creation"
    formula: |
      An assignment legally covers its flight iff:
        duty_start_utc <= sched_dep_utc AND sched_arr_utc + POST_FLIGHT_BUFFER_MINUTES <= duty_end_utc
      At creation: duty_end_utc must be > duty_start_utc and <= duty_start_utc + MAX_DUTY_HOURS,
        and the crew member must have no other ASSIGNED assignment whose [duty_start_utc, duty_end_utc)
        overlaps the new one (half-open intervals: end == start is NOT an overlap).
      On retime: assignments failing coverage become FLAGGED_ILLEGAL; flight crew_coverage_status recomputed.
    input_set: "CrewAssignments with assignment_status = ASSIGNED on the retimed flight"
    constants:
      MAX_DUTY_HOURS: 14
      POST_FLIGHT_BUFFER_MINUTES: 30
    precision: "minute resolution"

  - name: recovery_option_selection
    description: "Selector policy for generate-options: candidate set, ranking, tie-break, empty fallback"
    trigger: "POST /irops/reaccommodation-cases/{id}/generate-options"
    algorithm: weighted_scoring
    formula: |
      eligibility (per candidate replacement itinerary for the disrupted segment):
        - leg1 departs from the disrupted segment's origin and the itinerary terminates at the booking's final destination
        - every leg flight_status IN {SCHEDULED, DELAYED}
        - legs[0].sched_dep_utc <= original sched_dep_utc + RECOVERY_WINDOW_HOURS (48h)
        - every leg cabin seats_available >= booking.party_size (own metal)
        - interline candidates (only when include_interline = true): first leg operating_carrier matches an
          InterlineAgreement with agreement_status = ACTIVE, route matching origin/destination,
          cabin_map containing the booking cabin, and interline_seats_committed + party_size <= seats_quota_per_flight
        - connections inside the candidate itinerary respect MIN_CONNECT_MINUTES (45)
      ranking: rank_score = stops_count * 1000000 + minutes_until_final_arrival * 10 + (is_interline ? 1 : 0)
        lower rank_score sorts first; ties broken by legs[0] flight created_at ASC. Ids never participate.
      empty fallback: if the candidate set is empty, return ERR_NO_REACCOM_OPTIONS (422) and leave the case in its current status.
      At most 3 options are materialized, ranked ascending by rank_score.
    input_set: "Flights and CabinInventories reachable from the disrupted segment's origin; InterlineAgreements when include_interline"
    constants:
      RECOVERY_WINDOW_HOURS: 48
      MIN_CONNECT_MINUTES: 45
      MAX_OPTIONS: 3
      INTERLINE_KM_RATE_CENTS: 5
    precision: "integer"

  - name: comms_cadence_batch
    description: "Ops-run sweep driving voucher expiry, election defaulting, and the notification cadence"
    trigger: "POST /irops/communications/process-due"
    algorithm: chronological
    formula: |
      The batch evaluates in this pinned order (each step reads the state produced by earlier steps):
        1. expire PROPOSED options whose legs[0] departure <= now; a case left with no PROPOSED option and status OFFERED becomes EXPIRED
        2. expire ISSUED vouchers with valid_through < current date -> EXPIRED + REVERSAL CostEntry
        3. default elections: bookings in ELIGIBLE_PENDING with election_deadline < now become ELECTED_CREDIT;
           create a PROCESSED RefundElection (election = CREDIT, election_source = SYSTEM_DEFAULT),
           post CREDIT + COMPENSATION CostEntries, queue CommunicationLog ELECTION_DEFAULT (due_at = now)
        4. send all QUEUED logs with due_at <= now (including the ELECTION_DEFAULT rows from step 3)
        5. reminders: bookings still DISRUPTED whose latest SENT/QUEUED log for the booking has sent_at/due_at
           older than REMINDER_CADENCE_MINUTES (30) get a REMINDER log queued and sent in this same batch;
           bookings defaulted in step 3 are excluded (their ELECTION_DEFAULT from step 3 satisfies the cadence)
      The order matters: running step 4 before step 3 would send REMINDERs to bookings that step 3 defaults.
    input_set: "All non-terminal options/vouchers, ELIGIBLE_PENDING bookings, QUEUED logs"
    constants:
      REMINDER_CADENCE_MINUTES: 30
      ELECTION_WINDOW_HOURS: 72
    precision: "minute resolution"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and well-formed", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role is permitted for this endpoint per §1.5 roles", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Passenger role may only touch resources whose booking chain's passenger_id equals X-User-ID", error_id: ERR_FORBIDDEN_OWNERSHIP, http_status: 403, applies_to: "Passenger-accessible endpoints" }
  - { priority: 4, category: existence, check: "Request body parses; required fields present; field types correct; enum values in domain; party_size >= 1; sched/duty time pairs ordered", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all write endpoints" }
  - { priority: 5, category: existence, check: "Enum-typed input values are members of the declared enum domain", error_id: ERR_INVALID_ENUM, http_status: 400, applies_to: "all write endpoints with enum inputs" }
  - { priority: 6, category: existence, check: "Path and body-referenced resources exist, validated left-to-right: passenger, flight, event, booking, case, option, voucher, agreement, election, crew assignment", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all endpoints with resource ids" }
  - { priority: 7, category: state, check: "OCC: expected_<parent>_version equals the parent entity's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /irops/flights/{id}/delay, POST /irops/flights/{id}/cancel, POST /irops/reaccommodation-cases/{id}/commit" }
  - { priority: 8, category: state, check: "Flight delay/depart/record-actuals only from the states named in the Flight machine", error_id: ERR_FLIGHT_NOT_DELAYABLE, http_status: 409, applies_to: "POST /irops/flights/{id}/delay, depart, record-actuals" }
  - { priority: 9, category: state, check: "Flight cancel only from SCHEDULED or DELAYED", error_id: ERR_FLIGHT_NOT_CANCELLABLE, http_status: 409, applies_to: "POST /irops/flights/{id}/cancel" }
  - { priority: 10, category: state, check: "Event lifecycle action matches current event_status; flight cancel/delay requires linked event in a decision state; voucher issuance requires event RECOVERY", error_id: ERR_EVENT_INVALID_STATE, http_status: 409, applies_to: "event lifecycle endpoints, flight cancel/delay, voucher issue" }
  - { priority: 11, category: state, check: "Event close requires no open cases, no ISSUED vouchers, no ELIGIBLE_PENDING bookings, no PENDING elections", error_id: ERR_EVENT_CLOSE_BLOCKED, http_status: 409, applies_to: "POST /irops/disruption-events/{id}/close" }
  - { priority: 12, category: state, check: "Voucher issuance requires booking DISRUPTED or REBOOKED (elections are exempt: a CANCELLED booking keeps its ELIGIBLE_PENDING compensation axis)", error_id: ERR_BOOKING_NOT_DISRUPTED, http_status: 409, applies_to: "POST /irops/bookings/{id}/vouchers" }
  - { priority: 13, category: state, check: "Booking cancel requires booking_status IN {ACTIVE, DISRUPTED, REBOOKED}", error_id: ERR_INVALID_BOOKING_STATE, http_status: 409, applies_to: "POST /irops/bookings/{id}/cancel" }
  - { priority: 14, category: state, check: "Case generate-options requires QUEUED or ESCALATED; commit requires OFFERED; escalate requires QUEUED or OFFERED", error_id: ERR_CASE_NOT_COMMITTABLE, http_status: 409, applies_to: "case action endpoints" }
  - { priority: 15, category: state, check: "Committed option must be PROPOSED and all leg flights still in {SCHEDULED, DELAYED}", error_id: ERR_OPTION_NOT_PROPOSED, http_status: 409, applies_to: "POST /irops/reaccommodation-cases/{id}/commit" }
  - { priority: 16, category: state, check: "Voucher redeem/void require ISSUED", error_id: ERR_VOUCHER_NOT_OPEN, http_status: 409, applies_to: "POST /irops/vouchers/{id}/redeem, POST /irops/vouchers/{id}/void" }
  - { priority: 17, category: state, check: "Election process requires PENDING", error_id: ERR_ELECTION_NOT_PENDING, http_status: 409, applies_to: "POST /irops/refund-elections/{id}/process" }
  - { priority: 18, category: state, check: "Crew release requires assignment_status = ASSIGNED", error_id: ERR_INVALID_CREW_STATE, http_status: 409, applies_to: "POST /irops/crew-assignments/{id}/release" }
  - { priority: 19, category: business_safety, check: "Crew assignment creation: no overlapping [duty_start_utc, duty_end_utc) half-open intervals for the same crew_member_ref among ASSIGNED assignments", error_id: ERR_CREW_DUTY_OVERLAP, http_status: 422, applies_to: "POST /irops/flights/{id}/crew-assignments" }
  - { priority: 20, category: business_safety, check: "Election creation requires compensation_status = ELIGIBLE_PENDING (regulatory entitlement gate)", error_id: ERR_COMPENSATION_NOT_ELIGIBLE, http_status: 422, applies_to: "POST /irops/bookings/{id}/refund-elections" }
  - { priority: 21, category: business_constraint, check: "Seat quota: booking create and commit require seats_available >= party_size on every leg; interline legs require quota headroom", error_id: ERR_SEATS_INSUFFICIENT, http_status: 422, applies_to: "POST /irops/bookings, POST /irops/reaccommodation-cases/{id}/commit" }
  - { priority: 22, category: business_constraint, check: "Selector found zero eligible candidates", error_id: ERR_NO_REACCOM_OPTIONS, http_status: 422, applies_to: "POST /irops/reaccommodation-cases/{id}/generate-options" }
  - { priority: 23, category: business_constraint, check: "Interline commit requires agreement ACTIVE (cabin-map coverage is enforced at option generation, not commit)", error_id: ERR_INTERLINE_AGREEMENT_INACTIVE, http_status: 422, applies_to: "POST /irops/reaccommodation-cases/{id}/commit" }
  - { priority: 25, category: business_constraint, check: "A passenger may not hold two ISSUED/REDEEMED HOTEL vouchers whose covered night sets intersect (discrete night granularity: nights [check_in_date, check_in_date + nights); touching check_out == check_in is allowed)", error_id: ERR_HOTEL_NIGHT_OVERLAP, http_status: 422, applies_to: "POST /irops/bookings/{id}/vouchers" }
  - { priority: 26, category: business_temporal, check: "Connection feasibility: at booking create, segment N+1 dep - segment N arr >= MIN_CONNECT_MINUTES (45)", error_id: ERR_CONNECTION_WINDOW_VIOLATION, http_status: 422, applies_to: "POST /irops/bookings" }
  - { priority: 27, category: business_temporal, check: "Election creation requires now <= election_deadline (inclusive)", error_id: ERR_ELECTION_WINDOW_CLOSED, http_status: 422, applies_to: "POST /irops/bookings/{id}/refund-elections" }
  - { priority: 28, category: business_temporal, check: "HOTEL requires disruption_window_hours >= 8; MEAL requires meals_count >= 1", error_id: ERR_VOUCHER_RULE_NOT_MET, http_status: 422, applies_to: "POST /irops/bookings/{id}/vouchers" }
  - { priority: 29, category: business_fiscal, check: "Sum of face_value_cents over the booking's ISSUED/REDEEMED vouchers + new face <= BOOKING_VOUCHER_CAP_CENTS (40000)", error_id: ERR_VOUCHER_CAP_EXCEEDED, http_status: 422, applies_to: "POST /irops/bookings/{id}/vouchers" }
  - { priority: 30, category: business_fiscal, check: "Event accrual_total_cents + new voucher face_value_cents <= DisruptionEvent.cost_cap_cents", error_id: ERR_EVENT_COST_CAP_EXCEEDED, http_status: 422, applies_to: "POST /irops/bookings/{id}/vouchers" }

