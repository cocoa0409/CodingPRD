              as_user_id: "u-comp-1"
            - call: "POST /recall-campaigns/${camp_id}/remedy-parts"
              payload: { part_number: "P-88337", unit_cost: 21.90, total_procured_qty: 100 }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
              captures: { part_id: $.data.id, part_v: $.data.version }
          trigger:
            - call: "POST /vehicles"
              payload: { vin: "1HGCM82633A004352", plant_code: "PLT1", model_code: "MDLA", model_year: 2024, production_date: "2024-03-15", suspect_part_number: 1500, region_code: "NE", sale_status: "SOLD" }
              as: RecallOperationsManager
