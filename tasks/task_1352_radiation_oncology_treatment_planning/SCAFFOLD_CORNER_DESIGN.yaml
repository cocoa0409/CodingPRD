            - { call: "POST /oncology/treatment-plans/${pl}/physics-checks", payload: { check_type: "SECOND", outcome: "PASS" }, as: MedicalPhysicist, as_user_id: "phys_a", captures: { err: $.data.error_id } }
            - { call: "POST /oncology/treatment-plans/${pl}/physics-checks", payload: { check_type: "SECOND", outcome: "PASS" }, as: MedicalPhysicist, as_user_id: "phys_b", captures: { ok_st: $.data.plan_id } }
            - { call: "GET /oncology/treatment-plans/${pl}", payload: {}, as: MedicalPhysicist, as_user_id: "phys_b", captures: { pl_st: $.data.status } }
          assert:
            - "err == ERR_SEGREGATION_OF_DUTIES (second checker phys_a equals primary_checker_id)"
            - "pl_st == APPROVED_FOR_DELIVERY after phys_b's SECOND PASS"

      - name: oncologist_cannot_approve_own_contours
        claim_type: segregation_of_duties
        grounds: ["validations[priority=7]", entities.ContourSet.fields.created_by_user_id]
        distinguishing_aspect: "Contour approval is peer review: the creating oncologist (onc_a) cannot approve their own contour set (ERR_SEGREGATION_OF_DUTIES); onc_b can."
        test_recipe:
          setup: ["contour set SUBMITTED, created by onc_a"]
          setup_api_calls:
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-R8", full_name: "Rbac Eight", date_of_birth: "1970-01-01" }, as: Scheduler, captures: { pat: $.data.id } }
            - { call: "POST /oncology/patients/${pat}/treatment-courses", payload: { diagnosis_code: "C61", intent: "CURATIVE", technique: "IMRT", prescribed_total_dose_cGy: 2000, planned_fractions: 10 }, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs: $.data.id } }
            - { call: "POST /oncology/machines", payload: { name: "CT-Sim-R8", machine_type: "CT_SIMULATOR", room: "SIM1" }, as: SystemAdmin, captures: { sim_m: $.data.id } }
            - { call: "POST /oncology/treatment-courses/${crs}/simulation-appointments", payload: { machine_id: "${sim_m}", start_time: "2026-07-30T09:00:00Z", end_time: "2026-07-30T09:30:00Z", immobilization_device: "THERMOPLASTIC_MASK" }, as: Scheduler, captures: { sim_a: $.data.id } }
            - { call: "POST /oncology/simulation-appointments/${sim_a}/complete", payload: { patient_weight_kg: 80.0 }, as: RadiationTherapist, as_user_id: "rtt_a" }
            - { call: "POST /oncology/treatment-courses/${crs}/contour-sets", payload: { set_label: "CT1", target_volumes: ["PTV"], oar_structures: [] }, as: RadiationOncologist, as_user_id: "onc_a", captures: { cs: $.data.id } }
            - { call: "POST /oncology/contour-sets/${cs}/submit", payload: {}, as: RadiationOncologist, as_user_id: "onc_a" }
          trigger:
            - { call: "POST /oncology/contour-sets/${cs}/approve", payload: {}, as: RadiationOncologist, as_user_id: "onc_a", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_SEGREGATION_OF_DUTIES (approver equals created_by_user_id)"
            - "ContourSet.${cs}.status remains SUBMITTED"

  # ===================================================================
  # Section: cross_cutting_layers
  # ===================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_plan_create_stale_course_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[plan-create-stale-course]"]
        distinguishing_aspect: "Two strictly sequential plan creates: the first succeeds and bumps TreatmentCourse.version; the second, carrying the previously observed expected_course_version, is rejected with 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["course PLANNING; contour APPROVED; client observed course version before any plan existed"]
          setup_api_calls:
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-X1", full_name: "Occ One", date_of_birth: "1970-01-01" }, as: Scheduler, captures: { pat: $.data.id } }
            - { call: "POST /oncology/patients/${pat}/treatment-courses", payload: { diagnosis_code: "C61", intent: "CURATIVE", technique: "IMRT", prescribed_total_dose_cGy: 2000, planned_fractions: 10 }, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs: $.data.id } }
            - { call: "POST /oncology/machines", payload: { name: "CT-Sim-X1", machine_type: "CT_SIMULATOR", room: "SIM1" }, as: SystemAdmin, captures: { sim_m: $.data.id } }
            - { call: "POST /oncology/treatment-courses/${crs}/simulation-appointments", payload: { machine_id: "${sim_m}", start_time: "2026-07-30T09:00:00Z", end_time: "2026-07-30T09:30:00Z", immobilization_device: "THERMOPLASTIC_MASK" }, as: Scheduler, captures: { sim_a: $.data.id } }
            - { call: "POST /oncology/simulation-appointments/${sim_a}/complete", payload: { patient_weight_kg: 80.0 }, as: RadiationTherapist, as_user_id: "rtt_a" }
            - { call: "POST /oncology/treatment-courses/${crs}/contour-sets", payload: { set_label: "CT1", target_volumes: ["PTV"], oar_structures: [] }, as: RadiationOncologist, as_user_id: "onc_a", captures: { cs: $.data.id } }
            - { call: "POST /oncology/contour-sets/${cs}/submit", payload: {}, as: RadiationOncologist, as_user_id: "onc_a" }
            - { call: "POST /oncology/contour-sets/${cs}/approve", payload: {}, as: RadiationOncologist, as_user_id: "onc_b" }
            - { call: "GET /oncology/treatment-courses/${crs}", payload: {}, as: MedicalDosimetrist, as_user_id: "dos_a", captures: { crs_v: $.data.version } }
            - { call: "POST /oncology/treatment-courses/${crs}/treatment-plans", payload: { contour_set_id: "${cs}", target_total_dose_cGy: 2000, planned_fractions: 10, expected_course_version: "${crs_v}" }, as: MedicalDosimetrist, as_user_id: "dos_a", captures: { pl1: $.data.id, pl1_ver: $.data.plan_version } }
          trigger:
            - { call: "POST /oncology/treatment-courses/${crs}/treatment-plans", payload: { contour_set_id: "${cs}", target_total_dose_cGy: 2000, planned_fractions: 10, expected_course_version: "${crs_v}" }, as: MedicalDosimetrist, as_user_id: "dos_a", captures: { err: $.data.error_id } }
          assert:
            - "pl1_ver == 1 (first plan created against the observed version succeeded)"
            - "err == ERR_STALE_VERSION (http 412): the first create bumped TreatmentCourse.version, so the replayed expected_course_version is stale"
            - "the course still has exactly 1 plan"

      - name: occ_finalize_stale_claim_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[claim-finalize-stale-claim]"]
        distinguishing_aspect: "After a successful finalize and a reopen, replaying the pre-finalize expected_claim_version is rejected with 412 ERR_STALE_VERSION; only a freshly read version finalizes again."
        test_recipe:
          setup: ["claim DRAFT with one SIMULATION line (65000)"]
          setup_api_calls:
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-X2", full_name: "Occ Two", date_of_birth: "1970-01-01" }, as: Scheduler, captures: { pat: $.data.id } }
            - { call: "POST /oncology/patients/${pat}/treatment-courses", payload: { diagnosis_code: "C61", intent: "CURATIVE", technique: "IMRT", prescribed_total_dose_cGy: 2000, planned_fractions: 10 }, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs: $.data.id } }
            - { call: "POST /oncology/machines", payload: { name: "CT-Sim-X2", machine_type: "CT_SIMULATOR", room: "SIM1" }, as: SystemAdmin, captures: { sim_m: $.data.id } }
            - { call: "POST /oncology/treatment-courses/${crs}/simulation-appointments", payload: { machine_id: "${sim_m}", start_time: "2026-07-30T09:00:00Z", end_time: "2026-07-30T09:30:00Z", immobilization_device: "THERMOPLASTIC_MASK" }, as: Scheduler, captures: { sim_a: $.data.id } }
            - { call: "POST /oncology/treatment-courses/${crs}/billing-claims", payload: {}, as: BillingCoordinator, as_user_id: "bill_a", captures: { clm: $.data.id } }
            - { call: "POST /oncology/simulation-appointments/${sim_a}/complete", payload: { patient_weight_kg: 80.0 }, as: RadiationTherapist, as_user_id: "rtt_a" }
            - { call: "GET /oncology/billing-claims/${clm}", payload: {}, as: BillingCoordinator, as_user_id: "bill_a", captures: { cl_v: $.data.version } }
            - { call: "POST /oncology/billing-claims/${clm}/finalize", payload: { expected_claim_version: "${cl_v}" }, as: BillingCoordinator, as_user_id: "bill_a", captures: { st1: $.data.status } }
            - { call: "POST /oncology/billing-claims/${clm}/reopen", payload: {}, as: BillingCoordinator, as_user_id: "bill_a" }
          trigger:
            - { call: "POST /oncology/billing-claims/${clm}/finalize", payload: { expected_claim_version: "${cl_v}" }, as: BillingCoordinator, as_user_id: "bill_a", captures: { err: $.data.error_id } }
          assert:
            - "st1 == FINALIZED (first finalize with the fresh version succeeded)"
            - "err == ERR_STALE_VERSION (http 412): finalize and reopen each bumped the claim version, so the replayed value is stale"
            - "BillingClaim.${clm}.status remains DRAFT"

      - name: version_increments_on_cascaded_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.TreatmentCourse.fields.status, "concurrency_rules[plan-create-stale-course]"]
        distinguishing_aspect: "Every mutation including system cascades bumps version by exactly 1: course create -> 1, first sim booking (auto-transition) -> 2, sim complete (auto-transition) -> 3."
        test_recipe:
          setup: ["course created (version 1)"]
          setup_api_calls:
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-X3", full_name: "Occ Three", date_of_birth: "1970-01-01" }, as: Scheduler, captures: { pat: $.data.id } }
            - { call: "POST /oncology/patients/${pat}/treatment-courses", payload: { diagnosis_code: "C61", intent: "CURATIVE", technique: "IMRT", prescribed_total_dose_cGy: 2000, planned_fractions: 10 }, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs: $.data.id, v1: $.data.version } }
            - { call: "POST /oncology/machines", payload: { name: "CT-Sim-X3", machine_type: "CT_SIMULATOR", room: "SIM1" }, as: SystemAdmin, captures: { sim_m: $.data.id } }
          trigger:
            - { call: "POST /oncology/treatment-courses/${crs}/simulation-appointments", payload: { machine_id: "${sim_m}", start_time: "2026-07-30T09:00:00Z", end_time: "2026-07-30T09:30:00Z", immobilization_device: "NONE" }, as: Scheduler, captures: { sim_a: $.data.id } }
            - { call: "GET /oncology/treatment-courses/${crs}", payload: {}, as: Scheduler, captures: { v2: $.data.version } }
            - { call: "POST /oncology/simulation-appointments/${sim_a}/complete", payload: { patient_weight_kg: 80.0 }, as: RadiationTherapist, as_user_id: "rtt_a" }
            - { call: "GET /oncology/treatment-courses/${crs}", payload: {}, as: Scheduler, captures: { v3: $.data.version } }
          assert:
            - "v1 == 1 and v2 == v1 + 1 and v3 == v2 + 1 (cascaded auto-transitions are full mutations)"

      - name: adaptation_cascade_skips_terminal_sessions
        claim_type: cascading_side_effects
        grounds: [state_machines.TreatmentCourse.ON_TREATMENT_to_ADAPTATION_REQUIRED]
        excluded_because:
          difficulty_instance: adaptation_check_cascade_plan_sessions_claim
          rationale: "The difficulty instance asserts the DELIVERED session is untouched while SCHEDULED siblings cancel — the conditional-cascade claim."

      - name: rate_threshold_chart_gate_boundary
        claim_type: rate_threshold_triggers
        grounds: [calculations.chart_review_gate]
        excluded_because:
          difficulty_instance: chart_gate_fifth_delivery_passes_sixth_blocked
          rationale: "The difficulty instance exercises the cumulative threshold at exactly 5 and the reset on PASS."

      - name: rate_threshold_weight_loss_boundary
        claim_type: rate_threshold_triggers
        grounds: [calculations.adaptation_weight_loss_trigger]
        excluded_because:
          difficulty_instance: weight_loss_exactly_10pct_triggers_adaptation
          rationale: "The difficulty instance brackets the 10.0% threshold from both sides."

  # ===================================================================
  # Section: consistency_model
  # ===================================================================
  - section: consistency_model
    instances:
      - name: deliver_counters_immediately_visible
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model, state_machines.FractionSession.SCHEDULED_to_DELIVERED]
        distinguishing_aspect: "Immediate consistency: the GET issued directly after deliver reflects delivered_fractions 1, delivered_dose_cGy 200, and fractions_since_chart_review 1 — no lag, no read repair."
        test_recipe:
          setup: ["IMRT course 2000/10 TREATMENT_READY; session booked"]
          setup_api_calls:
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-CM-1", full_name: "Consistent One", date_of_birth: "1970-01-01" }, as: Scheduler, captures: { pat: $.data.id } }
            - { call: "POST /oncology/patients/${pat}/treatment-courses", payload: { diagnosis_code: "C61", intent: "CURATIVE", technique: "IMRT", prescribed_total_dose_cGy: 2000, planned_fractions: 10 }, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs: $.data.id } }
            - { call: "POST /oncology/machines", payload: { name: "CT-Sim-CM1", machine_type: "CT_SIMULATOR", room: "SIM1" }, as: SystemAdmin, captures: { sim_m: $.data.id } }
            - { call: "POST /oncology/machines", payload: { name: "Linac-CM1", machine_type: "LINAC", room: "TX1" }, as: SystemAdmin, captures: { lin_m: $.data.id } }
            - { call: "POST /oncology/treatment-courses/${crs}/simulation-appointments", payload: { machine_id: "${sim_m}", start_time: "2026-07-30T09:00:00Z", end_time: "2026-07-30T09:30:00Z", immobilization_device: "THERMOPLASTIC_MASK" }, as: Scheduler, captures: { sim_a: $.data.id } }
            - { call: "POST /oncology/simulation-appointments/${sim_a}/complete", payload: { patient_weight_kg: 80.0 }, as: RadiationTherapist, as_user_id: "rtt_a" }
            - { call: "POST /oncology/treatment-courses/${crs}/contour-sets", payload: { set_label: "CT1", target_volumes: ["PTV"], oar_structures: [] }, as: RadiationOncologist, as_user_id: "onc_a", captures: { cs: $.data.id } }
            - { call: "POST /oncology/contour-sets/${cs}/submit", payload: {}, as: RadiationOncologist, as_user_id: "onc_a" }
            - { call: "POST /oncology/contour-sets/${cs}/approve", payload: {}, as: RadiationOncologist, as_user_id: "onc_b" }
            - { call: "GET /oncology/treatment-courses/${crs}", payload: {}, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs_v: $.data.version } }
            - { call: "POST /oncology/treatment-courses/${crs}/treatment-plans", payload: { contour_set_id: "${cs}", target_total_dose_cGy: 2000, planned_fractions: 10, expected_course_version: "${crs_v}" }, as: MedicalDosimetrist, as_user_id: "dos_a", captures: { pl: $.data.id } }
            - { call: "POST /oncology/treatment-plans/${pl}/dose-constraints", payload: { structure_name: "Cord", constraint_type: "MAX_DOSE", limit_cGy: 2000, evaluated_value_cGy: 1500 }, as: MedicalDosimetrist, as_user_id: "dos_a" }
            - { call: "POST /oncology/treatment-plans/${pl}/submit-for-check", payload: {}, as: MedicalDosimetrist, as_user_id: "dos_a" }
            - { call: "POST /oncology/treatment-plans/${pl}/physics-checks", payload: { check_type: "PRIMARY", outcome: "PASS" }, as: MedicalPhysicist, as_user_id: "phys_a" }
            - { call: "POST /oncology/treatment-plans/${pl}/physics-checks", payload: { check_type: "SECOND", outcome: "PASS" }, as: MedicalPhysicist, as_user_id: "phys_b" }
            - { call: "POST /oncology/treatment-courses/${crs}/fraction-sessions", payload: { plan_id: "${pl}", machine_id: "${lin_m}", start_time: "2026-08-03T09:00:00Z", end_time: "2026-08-03T09:20:00Z" }, as: Scheduler, captures: { f1: $.data.id } }
          trigger:
            - { call: "POST /oncology/fraction-sessions/${f1}/deliver", payload: {}, as: RadiationTherapist, as_user_id: "rtt_a" }
            - { call: "GET /oncology/treatment-courses/${crs}", payload: {}, as: RadiationTherapist, as_user_id: "rtt_a", captures: { df: $.data.delivered_fractions, dd: $.data.delivered_dose_cGy, gate: $.data.fractions_since_chart_review } }
          assert:
            - "df == 1 and dd == 200 and gate == 1 immediately after the deliver call"
