  # ---- partner and product administration -----------------------------------
  - method: POST
    path: /partners
    description: "Register a utility brand partner in ONBOARDING. Marketing-approval and mailing-cadence policy is captured here."
    roles: [PlatformAdmin]
    input: [name, utility_type, state_code, "brand_approval_required?", "min_days_between_drops?", "max_mailings_per_year?", "rate_filing_required?", "bill_insert_supported?"]
    output: UtilityPartner
    side_effects:
      - "creates one UtilityPartner with status ONBOARDING, version 1 and enrolled_premises_count 0"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

  - method: POST
    path: /partners/{partnerId}/status-changes
    description: "Move a partner between ONBOARDING, ACTIVE, SUSPENDED and TERMINATED. Suspension and termination withdraw the partner's in-flight campaigns."
    roles: [PlatformAdmin]
    input: [target_status, reason, expected_partner_version]
    output: UtilityPartner
    side_effects:
      - "applies the requested UtilityPartner transition and sets or clears suspension_reason"
      - "on SUSPENDED or TERMINATED: transitions every MarketingCampaign of the partner in {DRAFT, PARTNER_REVIEW, APPROVED} to WITHDRAWN in created_at ASC order, incrementing each campaign's version by 1"
      - "on TERMINATED: transitions every ServiceLineProduct of the partner to WITHDRAWN in created_at ASC order"
      - "increments UtilityPartner.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_PARTNER_NOT_FOUND, ERR_STALE_PARTNER_VERSION, ERR_INVALID_PARTNER_STATE, ERR_NO_FILED_PRODUCT]

  - method: POST
    path: /service-line-products
    description: "File a warranty product against a partner: ownership boundary at the curb stop or meter, waiting period, and the per-occurrence and annual benefit caps with their reset basis."
    roles: [PlatformAdmin]
    input: [partner_id, name, line_type, ownership_boundary, required_owned_segment, monthly_price_cents, waiting_period_days, per_occurrence_cap_cents, annual_cap_cents, "permit_covered?", "restoration_covered_scope?", "cap_reset_basis?"]
    output: ServiceLineProduct
    side_effects:
      - "creates one ServiceLineProduct with status AVAILABLE and version 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_PARTNER_NOT_FOUND, ERR_PARTNER_NOT_ACTIVE]

  - method: POST
    path: /premises
    description: "Add a premises to a partner's marketing file, recording which service-line segments the owner owns at the curb, any do-not-mail request, address hygiene and any previously reported defect."
    roles: [MarketingOps, PlatformAdmin]
    input: [partner_id, street_address, state_code, owned_segments, "do_not_mail?", "address_status?", "known_defect_reported_at?"]
    output: Premises
    side_effects:
      - "creates one Premises with version 1, last_mail_decision NOT_EVALUATED, mail_count_current_year 0 and a freshly derived suppression_reason"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_PARTNER_NOT_FOUND]

  # ---- marketing approval and mailing ---------------------------------------
  - method: POST
    path: /campaigns
    description: "Draft a marketing campaign for one product with a requested quantity and a planned drop date."
    roles: [MarketingOps]
    input: [partner_id, product_id, name, piece_type, drop_date, requested_quantity]
    output: MarketingCampaign
    side_effects:
      - "creates one MarketingCampaign in DRAFT with version 1, revision_count 0, mailed_count 0 and suppressed_count 0"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_PARTNER_NOT_FOUND, ERR_PRODUCT_NOT_FOUND, ERR_PARTNER_NOT_ACTIVE, ERR_PRODUCT_WITHDRAWN]

  - method: POST
    path: /campaigns/{campaignId}/submission
    description: "Submit a draft or rejected campaign for brand-partner review. Enforces the partner's minimum spacing between mail drops."
    roles: [MarketingOps]
    input: ["note?"]
    output: MarketingCampaign
    side_effects:
      - "transitions the campaign to PARTNER_REVIEW and records submitted_by_user_id"
      - "increments revision_count by 1 when resubmitting from REJECTED"
      - "increments MarketingCampaign.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_CAMPAIGN_NOT_FOUND, ERR_INVALID_CAMPAIGN_STATE, ERR_REVISION_LIMIT_REACHED, ERR_PARTNER_NOT_ACTIVE, ERR_DROP_WINDOW_CONFLICT]

  - method: POST
    path: /campaigns/{campaignId}/decision
    description: "Brand-partner approval or rejection of a campaign, optionally trimming the approved quantity below the requested quantity."
    roles: [PartnerBrandReviewer]
    input: [decision, decision_note, "approved_quantity?"]
    output: MarketingCampaign
    side_effects:
      - "transitions the campaign to APPROVED or REJECTED and records decision_by_user_id, decision_note and decided_at"
      - "on APPROVE sets approved_quantity to the requested value, defaulting to requested_quantity"
      - "increments MarketingCampaign.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_CAMPAIGN_NOT_FOUND, ERR_NOT_RESOURCE_OWNER, ERR_SEGREGATION_OF_DUTIES, ERR_INVALID_CAMPAIGN_STATE]

  - method: POST
    path: /campaigns/{campaignId}/mail-drop
    description: "Execute the drop: apply the suppression precedence to every premises on the partner file, fill the approved quantity in created_at ASC order, and record the per-premises outcome."
    roles: [MarketingOps]
    input: []
    output: "{campaign_id: uuid, status: string, mailed_count: integer, suppressed_count: integer, suppressed_by_reason: object, mailed_premises_ids: uuid[]}"   # inline MailDropResult schema
    side_effects:
      - "transitions the campaign to MAILED and sets mailed_count, suppressed_count and mail_dropped_at"
      - "for every mailed premises: sets last_mailed_campaign_id, last_mail_decision MAILED, clears last_mail_suppression_reason, increments mail_count_current_year and increments that Premises.version by 1"
      - "for every suppressed premises: sets last_mail_decision SUPPRESSED and last_mail_suppression_reason to the winning reason, and increments that Premises.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CAMPAIGN_NOT_FOUND, ERR_INVALID_CAMPAIGN_STATE, ERR_PARTNER_NOT_ACTIVE, ERR_DROP_DATE_IN_FUTURE]

  # ---- enrollment, billing and renewal --------------------------------------
  - method: POST
    path: /enrollments
    description: "Enroll a premises in a product. A campaign-sourced enrollment must name a MAILED campaign that did not suppress the premises; a direct inbound enrollment omits source_campaign_id."
    roles: [CustomerServiceRep]
    input: [premises_id, product_id, billing_mode, expected_premises_version, "source_campaign_id?", "prepaid_amount_cents?"]
    output: Enrollment
    side_effects:
      - "creates one Enrollment with version 1, coverage_status PENDING_WAITING_PERIOD, billing_status CURRENT, cap_status WITHIN_CAP, monthly_price_cents copied from the product, term_start = the logical clock's calendar date, term_end = term_start plus 12 calendar months, coverage_effective_at = term_start plus the product's waiting_period_days, and cap_year_start per the product's cap_reset_basis"
      - "defaults prepaid_amount_cents to monthly_price_cents * 12 for DIRECT_BILL and to 0 for BILL_INSERT"
      - "recomputes the premises' suppression_reason (an active enrollment suppresses future mail on that product) and increments Premises.version by 1"
      - "increments the partner's enrolled_premises_count"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_PREMISES_NOT_FOUND, ERR_PRODUCT_NOT_FOUND, ERR_CAMPAIGN_NOT_FOUND, ERR_STALE_PREMISES_VERSION, ERR_PARTNER_NOT_ACTIVE, ERR_PRODUCT_WITHDRAWN, ERR_CAMPAIGN_NOT_MAILED, ERR_MAILING_SUPPRESSED, ERR_BILL_INSERT_NOT_SUPPORTED, ERR_OWNERSHIP_NOT_ELIGIBLE, ERR_DUPLICATE_ACTIVE_ENROLLMENT]

  - method: POST
    path: /enrollments/{enrollmentId}/cancellation
    description: "Cancel coverage and settle the unearned premium: a cash refund net of any cancellation fee under direct billing, or a bill credit for the remainder of the final billed month under bill-insert billing."
    roles: [CustomerServiceRep]
    input: [reason, requested_effective_date]
    output: Enrollment
    side_effects:
      - "runs calculations.cancellation_refund_proration and stores cancellation_effective_date, cancellation_reason, refund_cents, credit_cents and cancellation_fee_cents"
      - "moves coverage_status to CANCELLED and billing_status to REFUND_ISSUED (DIRECT_BILL) or CREDIT_ISSUED (BILL_INSERT)"
      - "appends a PRORATION_REFUND or PRORATION_CREDIT LedgerEntry for the negative payout and a CANCELLATION_FEE LedgerEntry when the fee is non-zero"
      - "cancels every open Dispatch of this enrollment's claims with cancellation_reason CLAIM_DENIED and recomputes each affected Contractor.open_dispatch_count"
      - "increments Enrollment.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_ENROLLMENT_NOT_FOUND, ERR_ENROLLMENT_TERMINAL, ERR_CANCELLATION_BLOCKED_APPEAL, ERR_REFUND_NOT_AVAILABLE]

  - method: POST
    path: /enrollments/{enrollmentId}/billing-events
    description: "Post a premium payment, a utility bill-insert remittance, a missed payment or a write-off against the enrollment's cash ledger."
    roles: [BillingOps]
    input: [event_type, effective_date, "amount_cents?", "memo?"]
    output: Enrollment
    side_effects:
      - "moves the billing dimension per the event_type and sets or clears past_due_since"
      - "appends one CASH LedgerEntry for PREMIUM_PAYMENT, INSERT_REMITTANCE and WRITE_OFF; MISSED_PAYMENT writes no ledger row because no money moves"
      - "reinstates coverage_status SUSPENDED_NONPAY -> ACTIVE when the payment clears the arrears"
      - "recomputes premium_collected_cents"
      - "increments Enrollment.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_ENROLLMENT_NOT_FOUND, ERR_ENROLLMENT_TERMINAL]

  - method: POST
    path: /enrollments/{enrollmentId}/renewal-notices
    description: "Issue a renewal price change notice. The required advance notice is tiered by the size of the increase, and a filing-gated partner cannot raise above the filing threshold."
    roles: [BillingOps]
    input: [new_price_cents, renewal_effective_date, expected_enrollment_version]
    output: Enrollment
    side_effects:
      - "runs calculations.renewal_price_change_notice and, when the notice is compliant, sets renewal_price_cents, renewal_effective_date, renewal_notice_sent_at and renewal_notice_status SENT"
      - "increments Enrollment.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_ENROLLMENT_NOT_FOUND, ERR_STALE_ENROLLMENT_VERSION, ERR_ENROLLMENT_TERMINAL, ERR_INSUFFICIENT_RENEWAL_NOTICE, ERR_RATE_FILING_REQUIRED]

  # ---- claims, appeals and dispatch ------------------------------------------
  - method: POST
    path: /claims
    description: "File a claim against an enrollment. The coverage eligibility assessment is derived on creation from ownership boundary, pre-existing defect history, waiting period and cap state."
    roles: [CustomerServiceRep, Policyholder]
    input: [enrollment_id, line_type, defect_location, urgency, incident_description, "recurrence_of_claim_id?"]
    output: Claim
    side_effects:
      - "creates one Claim in TRIAGE with version 1, reported_at = the logical clock, appeal_count 0, and a derived eligibility_assessment"
      - "resolves occurrence_root_claim_id by walking the recurrence_of_claim_id chain to its root so recurrences share one per-occurrence cap"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_ENROLLMENT_NOT_FOUND, ERR_CLAIM_NOT_FOUND, ERR_ENROLLMENT_TERMINAL, ERR_INVALID_RECURRENCE_LINK]

  - method: POST
    path: /claims/{claimId}/triage-decision
    description: "Adjuster triage: approve the claim for dispatch or deny it with a reason consistent with the derived eligibility assessment."
    roles: [ClaimsAdjuster]
    input: [decision, coverage_note, "denial_reason?"]
    output: Claim
    side_effects:
      - "transitions the claim to APPROVED or DENIED and records triage_decided_by_user_id and triage_decided_at"
      - "on DENY sets denial_reason and denied_at, starting the appeal window"
      - "increments Claim.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_CLAIM_NOT_FOUND, ERR_INVALID_CLAIM_STATE, ERR_ENROLLMENT_NOT_ACTIVE, ERR_DENIAL_REASON_UNSUPPORTED, ERR_WAITING_PERIOD_NOT_ELAPSED, ERR_OWNERSHIP_NOT_ELIGIBLE, ERR_PRE_EXISTING_CONDITION, ERR_ANNUAL_CAP_EXHAUSTED]

  - method: POST
    path: /claims/{claimId}/appeals
    description: "Policyholder appeal of a denied claim, admissible only inside the appeal window and up to the appeal limit. Opening an appeal places a retention hold on the enrollment."
    roles: [Policyholder]
    input: [appeal_reason]
    output: Claim
    side_effects:
      - "transitions the claim to APPEAL_OPEN with appeal_source POLICYHOLDER and increments appeal_count by 1"
      - "sets Enrollment.retention_hold = true and increments that Enrollment.version by 1"
      - "recomputes the premises' suppression_reason to OPEN_APPEAL and increments that Premises.version by 1"
      - "increments Claim.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_CLAIM_NOT_FOUND, ERR_NOT_RESOURCE_OWNER, ERR_INVALID_CLAIM_STATE, ERR_APPEAL_LIMIT_REACHED, ERR_APPEAL_WINDOW_EXPIRED]

  - method: POST
    path: /claims/{claimId}/appeal-decision
    description: "Appeals officer decision: OVERTURN returns the claim to APPROVED, REMAND re-denies it and restarts the appeal window, UPHOLD closes it as a sustained denial. The officer may not be the adjuster who denied it."
    roles: [AppealsOfficer]
    input: [decision, rationale]
    output: Claim
    side_effects:
      - "transitions the claim to APPROVED, DENIED or APPEAL_UPHELD_DENIAL and records appeal_decided_by_user_id"
      - "on REMAND refreshes denied_at to the logical clock"
      - "recomputes Enrollment.retention_hold and the premises' suppression_reason"
      - "increments Claim.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_CLAIM_NOT_FOUND, ERR_SEGREGATION_OF_DUTIES, ERR_INVALID_CLAIM_STATE]

  - method: POST
    path: /contractors
    description: "Onboard a network contractor with its licence expiry, certified line types, capacity ceiling, rate card and SLA history."
    roles: [OperationsAdmin, PlatformAdmin]
    input: [name, state_code, license_number, license_expires_on, line_types_certified, hourly_rate_cents, sla_compliance_pct, max_open_dispatches, "permit_pull_authorized?"]
    output: Contractor
    side_effects:
      - "creates one Contractor with status ACTIVE, version 1, sla_breach_count 0 and open_dispatch_count 0"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

  - method: POST
    path: /claims/{claimId}/dispatches
    description: "Dispatch an approved claim to a contractor. Omitting contractor_id runs the urgency-weighted selection score over the eligible pool; supplying it forces a manual assignment that still passes every eligibility gate. Supplying supersedes_dispatch_id re-dispatches without restarting the response SLA."
    roles: [OperationsAdmin]
    input: [window_start, expected_claim_version, "contractor_id?", "supersedes_dispatch_id?"]
    output: Dispatch
    side_effects:
      - "creates one Dispatch in ASSIGNED with version 1, assigned_at = the logical clock, window_end from VISIT_MINUTES_BY_LINE, selection_mode, selection_score and the provisional estimated_benefit_cents"
      - "stamps Claim.sla_deadline_at on the claim's first dispatch and inherits it unchanged on every later dispatch"
      - "transitions the claim APPROVED -> DISPATCHED and increments Claim.version by 1"
      - "increments the selected Contractor.open_dispatch_count and increases Enrollment.annual_benefit_reserved_cents by estimated_benefit_cents"
      - "when supersedes_dispatch_id is supplied, transitions that dispatch to SUPERSEDED, releases its reservation and decrements its contractor's open_dispatch_count"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_CLAIM_NOT_FOUND, ERR_CONTRACTOR_NOT_FOUND, ERR_DISPATCH_NOT_FOUND, ERR_STALE_CLAIM_VERSION, ERR_INVALID_CLAIM_STATE, ERR_INVALID_DISPATCH_STATE, ERR_CONTRACTOR_NOT_ACTIVE, ERR_CONTRACTOR_LICENSE_EXPIRED, ERR_PERMIT_REQUIRED, ERR_CONTRACTOR_NOT_CERTIFIED, ERR_CONTRACTOR_WINDOW_CONFLICT, ERR_CONTRACTOR_CAPACITY_EXCEEDED, ERR_NO_ELIGIBLE_CONTRACTOR, ERR_PER_OCCURRENCE_CAP_EXHAUSTED]

  - method: POST
    path: /dispatches/{dispatchId}/events
    description: "Contractor field events: ACCEPT stamps the response time against the SLA, ARRIVE marks arrival, COMPLETE files the invoice with permit and restoration lines and settles the benefit through the cap waterfall."
    roles: [NetworkContractor]
    input: [event_type, "labor_cents?", "materials_cents?", "permit_number?", "permit_fee_cents?", "restoration_cents?", "restoration_scope?"]
    output: Dispatch
    side_effects:
      - "ACCEPT: sets responded_at and response_minutes, transitions ASSIGNED -> ACCEPTED"
      - "ARRIVE: transitions ACCEPTED -> ON_SITE"
      - "COMPLETE: stores the invoice lines, runs calculations.dispatch_benefit_settlement in its final_settlement variant, sets invoice_total_cents, benefit_paid_cents and customer_responsibility_cents, and transitions to COMPLETED"
      - "COMPLETE also decrements Contractor.open_dispatch_count, releases the reservation, appends the BENEFIT_CHARGE LedgerEntry, drives the claim DISPATCHED -> WORK_COMPLETE -> PAID, and on reaching the annual cap moves the enrollment to ANNUAL_CAP_EXHAUSTED and denies its remaining TRIAGE claims with CAP_EXHAUSTED"
      - "increments Dispatch.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_DISPATCH_NOT_FOUND, ERR_NOT_RESOURCE_OWNER, ERR_INVALID_DISPATCH_STATE, ERR_PERMIT_REQUIRED, ERR_RESTORATION_SCOPE_NOT_COVERED]

  # ---- regulator complaints ---------------------------------------------------
  - method: POST
    path: /regulator-complaints
    description: "Log a regulator or ombudsman complaint against a partner, optionally citing a claim and an enrollment. Citing a denied claim both shortens the response deadline and reopens the claim's appeal."
    roles: [RegulatoryAffairs]
    input: [partner_id, regulator, allegation, "claim_id?", "enrollment_id?"]
    output: RegulatorComplaint
    side_effects:
      - "creates one RegulatorComplaint in OPEN with version 1, received_at = the logical clock, escalation_count 0 and response_due_at from calculations.regulator_response_due_at"
      - "when claim_id names a claim in DENIED or APPEAL_UPHELD_DENIAL: transitions that claim to APPEAL_OPEN with appeal_source REGULATOR, sets Enrollment.retention_hold = true, and recomputes the premises' suppression_reason"
      - "when enrollment_id is supplied: sets Premises.regulator_hold = true for that enrollment's premises and increments that Premises.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_PARTNER_NOT_FOUND, ERR_CLAIM_NOT_FOUND, ERR_ENROLLMENT_NOT_FOUND]

  - method: POST
    path: /regulator-complaints/{complaintId}/response
    description: "File the substantive response and remedy. A substantiated complaint may reverse a posted benefit, refund premium or reinstate cancelled coverage; an unsubstantiated one may not move money."
    roles: [RegulatoryAffairs]
    input: [response_summary, disposition, remedy_type, expected_complaint_version, "remedy_amount_cents?"]
    output: RegulatorComplaint
    side_effects:
      - "closes the complaint as CLOSED_SUBSTANTIATED or CLOSED_UNSUBSTANTIATED and records responded_at, response_summary, disposition, remedy_type and remedy_amount_cents"
      - "BENEFIT_REVERSAL: appends a negative BENEFIT LedgerEntry, lowers Enrollment.annual_benefit_used_cents and may return cap_status to WITHIN_CAP"
      - "PREMIUM_REFUND: appends a negative CASH PRORATION_REFUND LedgerEntry and moves billing_status to REFUND_ISSUED"
      - "REINSTATEMENT: returns coverage_status CANCELLED -> ACTIVE, appends the positive REFUND_CLAWBACK LedgerEntry, clears the cancellation fields and restores term_end"
      - "recomputes Premises.regulator_hold and suppression_reason"
      - "increments RegulatorComplaint.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_COMPLAINT_NOT_FOUND, ERR_STALE_COMPLAINT_VERSION, ERR_INVALID_COMPLAINT_STATE, ERR_REMEDY_TARGET_MISSING, ERR_REMEDY_NOT_PERMITTED, ERR_REVERSAL_EXCEEDS_BENEFIT]

  - method: POST
    path: /regulator-complaints/{complaintId}/escalation
    description: "Re-open an unsubstantiated closure that the regulator has rejected, returning the complaint to ESCALATED for a fresh response."
    roles: [RegulatoryAffairs]
    input: [escalation_note]
    output: RegulatorComplaint
    side_effects:
      - "transitions the complaint CLOSED_UNSUBSTANTIATED -> ESCALATED, increments escalation_count by 1 and clears responded_at, response_summary, disposition, remedy_type and remedy_amount_cents"
      - "restores Premises.regulator_hold = true when the complaint cites an enrollment"
      - "increments RegulatorComplaint.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_COMPLAINT_NOT_FOUND, ERR_INVALID_COMPLAINT_STATE]

  # ---- operations -------------------------------------------------------------
  - method: POST
    path: /operations/nightly-run
    description: "Run the deterministic overnight batch in a pinned phase order: (1) dispatch SLA breach sweep, (2) contractor probation and dispatch cancellation, (3) complaint overdue and escalation sweep, (4) enrollment coverage sweep, (5) denied-claim closure sweep, (6) renewal and cap-year reset. Rows are processed created_at ASC inside each phase."
    roles: [OperationsAdmin, PlatformAdmin]
    input: []
    output: "{ran_at: string, sla_breached_dispatch_ids: uuid[], probated_contractor_ids: uuid[], cancelled_dispatch_ids: uuid[], overdue_complaint_ids: uuid[], escalated_complaint_ids: uuid[], activated_enrollment_ids: uuid[], suspended_enrollment_ids: uuid[], lapsed_enrollment_ids: uuid[], closed_claim_ids: uuid[], renewed_enrollment_ids: uuid[], cap_year_reset_enrollment_ids: uuid[]}"   # inline NightlyRunResult schema
    side_effects:
      - "phase 1: transitions every ASSIGNED Dispatch whose sla_deadline_at <= the logical clock to SLA_BREACHED and increments its Contractor.sla_breach_count"
      - "phase 2: transitions every Contractor whose sla_breach_count >= SLA_BREACH_PROBATION_THRESHOLD from ACTIVE to PROBATION, cancels that contractor's remaining ASSIGNED dispatches with cancellation_reason CONTRACTOR_PROBATION, and reverts each of their claims DISPATCHED -> APPROVED"
      - "phase 3: transitions OPEN complaints past response_due_at to OVERDUE and OVERDUE complaints past ESCALATION_GRACE_DAYS to ESCALATED"
      - "phase 4: activates PENDING_WAITING_PERIOD enrollments whose coverage_effective_at has arrived, suspends ACTIVE enrollments past NONPAY_SUSPENSION_DAYS of arrears, and lapses SUSPENDED_NONPAY enrollments past NONPAY_LAPSE_DAYS"
      - "phase 5: closes DENIED claims whose appeal window has expired"
      - "phase 6: for every enrollment whose term_end has arrived, applies renewal_price_cents when renewal_notice_status == SENT and the notice was compliant (renewal_notice_status becomes APPLIED) or keeps monthly_price_cents and sets renewal_notice_status NOT_APPLIED_NO_COMPLIANT_NOTICE, extends term_end and cap_year_start by one year, increments renewal_count, and returns cap_status to WITHIN_CAP"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED]

  - method: POST
    path: /_clock/set_current_utc
    description: "Set the logical clock that every temporal rule reads. The clock defaults to 2026-08-01T00:00:00Z at process start and only moves when this endpoint is called."
    roles: [PlatformAdmin, OperationsAdmin]
    input: [to_iso8601]
    output: "{current_utc: string}"   # inline ClockState schema
    side_effects:
      - "sets the logical clock to the supplied instant; no domain entity is mutated"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

# -----------------------------------------------------------------------------
# §1.6 Error Catalog
# -----------------------------------------------------------------------------
errors:
  - error_id: ERR_UNAUTHENTICATED
    status: 401
    message: "Authentication required"
    triggered_by: "any request without a non-empty X-User-ID header"
  - error_id: ERR_UNAUTHORIZED
    status: 403
    message: "Role not permitted for this operation"
    triggered_by: "a caller whose role is absent from the endpoint's roles list"
  - error_id: ERR_NOT_RESOURCE_OWNER
    status: 403
    message: "Caller does not own this resource"
    triggered_by: "an entity_backed caller acting on another partner's campaign, another premises' claim, or another contractor's dispatch"
  - error_id: ERR_SEGREGATION_OF_DUTIES
    status: 403
    message: "Same user may not perform both steps"
    triggered_by: "an appeal decided by the adjuster who denied the claim, or a campaign decision made by its submitter"
  - error_id: ERR_INVALID_REQUEST
    status: 400
    message: "Request body failed validation"
    triggered_by: "a missing required field, wrong JSON type, unknown enum member, negative money amount, out-of-term cancellation date, approved_quantity above requested_quantity, or an amount_cents omitted for a money-moving billing event"
  - error_id: ERR_INVALID_PAGINATION
    status: 400
    message: "Invalid pagination parameters"
    triggered_by: "limit < 1, limit > 100, offset < 0, or a non-integer value on any list endpoint"
  - error_id: ERR_PARTNER_NOT_FOUND
    status: 404
    message: "Utility partner not found"
    triggered_by: "an unknown partnerId in the path or partner_id in the body"
  - error_id: ERR_PRODUCT_NOT_FOUND
    status: 404
    message: "Service line product not found"
    triggered_by: "an unknown productId in the path or product_id in the body"
  - error_id: ERR_PREMISES_NOT_FOUND
    status: 404
    message: "Premises not found"
    triggered_by: "an unknown premisesId in the path or premises_id in the body"
  - error_id: ERR_CAMPAIGN_NOT_FOUND
    status: 404
    message: "Marketing campaign not found"
    triggered_by: "an unknown campaignId in the path or source_campaign_id in the body"
  - error_id: ERR_ENROLLMENT_NOT_FOUND
    status: 404
    message: "Enrollment not found"
    triggered_by: "an unknown enrollmentId in the path or enrollment_id in the body"
  - error_id: ERR_CLAIM_NOT_FOUND
    status: 404
    message: "Claim not found"
    triggered_by: "an unknown claimId in the path, or an unknown recurrence_of_claim_id or claim_id in the body"
  - error_id: ERR_CONTRACTOR_NOT_FOUND
    status: 404
    message: "Contractor not found"
    triggered_by: "an unknown contractorId in the path or contractor_id in the body"
  - error_id: ERR_DISPATCH_NOT_FOUND
    status: 404
    message: "Dispatch not found"
    triggered_by: "an unknown dispatchId in the path or supersedes_dispatch_id in the body"
  - error_id: ERR_LEDGER_ENTRY_NOT_FOUND
    status: 404
    message: "Ledger entry not found"
    triggered_by: "an unknown ledgerEntryId in the path"
  - error_id: ERR_COMPLAINT_NOT_FOUND
    status: 404
    message: "Regulator complaint not found"
    triggered_by: "an unknown complaintId in the path"
  - error_id: ERR_STALE_PARTNER_VERSION
    status: 412
    message: "Partner has been modified since it was read"
    triggered_by: "expected_partner_version != UtilityPartner.version on a status change"
  - error_id: ERR_STALE_PREMISES_VERSION
    status: 412
    message: "Premises has been modified since it was read"
    triggered_by: "expected_premises_version != Premises.version on enrollment creation"
  - error_id: ERR_STALE_CLAIM_VERSION
    status: 412
    message: "Claim has been modified since it was read"
    triggered_by: "expected_claim_version != Claim.version on dispatch creation"
  - error_id: ERR_STALE_ENROLLMENT_VERSION
    status: 412
    message: "Enrollment has been modified since it was read"
    triggered_by: "expected_enrollment_version != Enrollment.version on a renewal notice"
  - error_id: ERR_STALE_COMPLAINT_VERSION
    status: 412
    message: "Complaint has been modified since it was read"
    triggered_by: "expected_complaint_version != RegulatorComplaint.version on a response"
  - error_id: ERR_INVALID_PARTNER_STATE
    status: 409
    message: "Partner status transition not allowed"
    triggered_by: "a target_status unreachable from the partner's current status, including any transition out of TERMINATED"
  - error_id: ERR_INVALID_CAMPAIGN_STATE
    status: 409
    message: "Campaign is not in a state that allows this operation"
    triggered_by: "submitting an APPROVED campaign, deciding a DRAFT campaign, or dropping mail on a campaign that is not APPROVED"
  - error_id: ERR_INVALID_CLAIM_STATE
    status: 409
    message: "Claim is not in a state that allows this operation"
    triggered_by: "triaging a claim twice, dispatching a claim that is not APPROVED, appealing a claim that is not DENIED (including a CLOSED one), or deciding an appeal that is not open"
  - error_id: ERR_INVALID_DISPATCH_STATE
    status: 409
    message: "Dispatch is not in a state that allows this operation"
    triggered_by: "arriving before accepting, completing an ASSIGNED dispatch, acting on a terminal dispatch, or superseding a dispatch that is already terminal or belongs to another claim"
  - error_id: ERR_INVALID_COMPLAINT_STATE
    status: 409
    message: "Complaint is not in a state that allows this operation"
    triggered_by: "responding to an already-closed complaint, or escalating a complaint that is not CLOSED_UNSUBSTANTIATED"
  - error_id: ERR_ENROLLMENT_TERMINAL
    status: 409
    message: "Enrollment coverage has ended"
    triggered_by: "cancelling, re-pricing, billing or filing a claim against an enrollment whose coverage_status is CANCELLED or LAPSED"
  - error_id: ERR_ENROLLMENT_NOT_ACTIVE
    status: 409
    message: "Enrollment coverage is not in force"
    triggered_by: "approving a claim whose enrollment is SUSPENDED_NONPAY, CANCELLED or LAPSED"
  - error_id: ERR_REVISION_LIMIT_REACHED
    status: 409
    message: "Campaign revision limit reached"
    triggered_by: "a third resubmission of a rejected campaign"
  - error_id: ERR_APPEAL_LIMIT_REACHED
    status: 409
    message: "Claim appeal limit reached"
    triggered_by: "a third appeal on the same claim"
  - error_id: ERR_PARTNER_NOT_ACTIVE
    status: 409
    message: "Utility partner is not active"
    triggered_by: "filing a product, creating or submitting a campaign, dropping mail or enrolling under a partner in ONBOARDING, SUSPENDED or TERMINATED"
  - error_id: ERR_NO_FILED_PRODUCT
    status: 409
    message: "Partner has no filed product"
    triggered_by: "activating a partner with no ServiceLineProduct in AVAILABLE"
  - error_id: ERR_PRODUCT_WITHDRAWN
    status: 409
    message: "Service line product has been withdrawn"
    triggered_by: "creating a campaign or an enrollment against a WITHDRAWN product"
  - error_id: ERR_CAMPAIGN_NOT_MAILED
    status: 409
    message: "Sourcing campaign has not been mailed"
    triggered_by: "supplying a source_campaign_id whose campaign is not in MAILED"
  - error_id: ERR_MAILING_SUPPRESSED
    status: 409
    message: "Premises was suppressed from that mailing"
    triggered_by: "supplying a source_campaign_id for a premises the drop suppressed or never mailed"
  - error_id: ERR_CONTRACTOR_NOT_ACTIVE
    status: 409
    message: "Contractor is not active"
    triggered_by: "manually dispatching to a contractor in PROBATION or SUSPENDED"
  - error_id: ERR_CONTRACTOR_LICENSE_EXPIRED
    status: 422
    message: "Contractor licence has expired"
    triggered_by: "manually dispatching to a contractor whose license_expires_on is on or before the logical clock's date"
  - error_id: ERR_PERMIT_REQUIRED
    status: 422
    message: "Permit authority or permit number required"
    triggered_by: "dispatching a permit-covered product to a contractor without permit_pull_authorized, or completing a dispatch with a permit fee and no permit_number"
  - error_id: ERR_CONTRACTOR_NOT_CERTIFIED
    status: 422
    message: "Contractor is not certified for this service line"
    triggered_by: "manually dispatching a line_type absent from the contractor's line_types_certified"
  - error_id: ERR_CONTRACTOR_CAPACITY_EXCEEDED
    status: 422
    message: "Contractor has no open dispatch capacity"
    triggered_by: "manually dispatching to a contractor whose open_dispatch_count has reached max_open_dispatches"
  - error_id: ERR_CONTRACTOR_WINDOW_CONFLICT
    status: 422
    message: "Requested visit window overlaps an existing dispatch"
    triggered_by: "a window that intersects an open dispatch of the same contractor once the travel buffer is applied"
  - error_id: ERR_NO_ELIGIBLE_CONTRACTOR
    status: 422
    message: "No eligible contractor available"
    triggered_by: "automatic selection finding an empty candidate pool after the eligibility filter"
  - error_id: ERR_DROP_WINDOW_CONFLICT
    status: 422
    message: "Drop date violates the partner's minimum spacing between mailings"
    triggered_by: "submitting a campaign whose drop_date is fewer than min_days_between_drops from a sibling in PARTNER_REVIEW, APPROVED or MAILED"
  - error_id: ERR_DROP_DATE_IN_FUTURE
    status: 422
    message: "Drop date has not arrived"
    triggered_by: "dropping mail while the logical clock is before the campaign's drop_date"
  - error_id: ERR_OWNERSHIP_NOT_ELIGIBLE
    status: 422
    message: "Service line ownership does not qualify for this product"
    triggered_by: "enrolling a premises that does not own the product's required segment, or approving a claim whose defect_location lies outside the product's ownership boundary"
  - error_id: ERR_DUPLICATE_ACTIVE_ENROLLMENT
    status: 422
    message: "Premises already holds coverage on this product"
    triggered_by: "a second enrollment on the same product while the first is PENDING_WAITING_PERIOD, ACTIVE or SUSPENDED_NONPAY"
  - error_id: ERR_BILL_INSERT_NOT_SUPPORTED
    status: 422
    message: "Partner does not support bill-inserted billing"
    triggered_by: "billing_mode BILL_INSERT on a partner with bill_insert_supported false"
  - error_id: ERR_WAITING_PERIOD_NOT_ELAPSED
    status: 422
    message: "Waiting period has not elapsed"
    triggered_by: "approving a claim reported before the enrollment's coverage_effective_at"
  - error_id: ERR_PRE_EXISTING_CONDITION
    status: 422
    message: "Defect was reported before coverage was purchased"
    triggered_by: "approving a claim on a premises whose known_defect_reported_at precedes the enrollment date"
  - error_id: ERR_DENIAL_REASON_UNSUPPORTED
    status: 422
    message: "Denial reason is not supported by the eligibility assessment"
    triggered_by: "denying with a reason that contradicts the derived eligibility_assessment"
  - error_id: ERR_INVALID_RECURRENCE_LINK
    status: 422
    message: "Invalid recurrence link"
    triggered_by: "a recurrence_of_claim_id on another enrollment, another line_type, or outside RECURRENCE_WINDOW_DAYS"
  - error_id: ERR_RESTORATION_SCOPE_NOT_COVERED
    status: 422
    message: "Reported restoration scope exceeds the covered scope"
    triggered_by: "completing a dispatch with a restoration_scope richer than the product's restoration_covered_scope"
  - error_id: ERR_PER_OCCURRENCE_CAP_EXHAUSTED
    status: 422
    message: "Per-occurrence benefit cap is exhausted"
    triggered_by: "dispatching a claim whose occurrence pool is already fully consumed by earlier recurrences"
  - error_id: ERR_ANNUAL_CAP_EXHAUSTED
    status: 422
    message: "Annual benefit cap is exhausted"
    triggered_by: "approving a claim on an enrollment whose cap_status is ANNUAL_CAP_EXHAUSTED"
  - error_id: ERR_APPEAL_WINDOW_EXPIRED
    status: 422
    message: "Appeal window has closed"
    triggered_by: "appealing more than APPEAL_WINDOW_DAYS after denied_at"
  - error_id: ERR_CANCELLATION_BLOCKED_APPEAL
    status: 422
    message: "Cancellation blocked while an appeal is open"
    triggered_by: "cancelling an enrollment whose retention_hold is true"
  - error_id: ERR_INSUFFICIENT_RENEWAL_NOTICE
    status: 422
    message: "Renewal notice does not meet the required advance notice"
    triggered_by: "a notice whose lead time is shorter than the tier required by the size of the price change"
  - error_id: ERR_RATE_FILING_REQUIRED
    status: 422
    message: "Rate filing required before this increase"
    triggered_by: "a price change above RATE_FILING_PCT_THRESHOLD on a partner with rate_filing_required true"
  - error_id: ERR_REFUND_NOT_AVAILABLE
    status: 422
    message: "No refundable premium remains"
    triggered_by: "a direct-bill cancellation whose earned premium plus fee exceeds the prepaid amount"
  - error_id: ERR_REMEDY_TARGET_MISSING
    status: 422
    message: "Remedy requires a cited claim or enrollment"
    triggered_by: "a BENEFIT_REVERSAL with no claim_id, or a PREMIUM_REFUND or REINSTATEMENT with no enrollment_id"
  - error_id: ERR_REMEDY_NOT_PERMITTED
    status: 422
    message: "Remedy not permitted for an unsubstantiated complaint"
    triggered_by: "disposition UNSUBSTANTIATED with a remedy_type that moves money"
  - error_id: ERR_REVERSAL_EXCEEDS_BENEFIT
    status: 422
    message: "Reversal exceeds the benefit paid on the cited claim"
    triggered_by: "remedy_amount_cents greater than the cited claim's benefit_paid_cents"

# -----------------------------------------------------------------------------
# §1.7 Role Table  (role_model: segregation_of_duties)
# -----------------------------------------------------------------------------
roles:
  - role: PlatformAdmin
    identity: opaque
    description: "HomeServe platform administrator: onboards utility partners, files products, moves partner status and may run the overnight batch."
    exclusive_operations:
      - "POST /partners"
      - "POST /partners/{partnerId}/status-changes"
      - "POST /service-line-products"
    shared_operations:
      - "POST /premises"
      - "POST /contractors"
      - "POST /operations/nightly-run"
      - "POST /_clock/set_current_utc"
      - "every GET endpoint"
  - role: MarketingOps
    identity: opaque
    description: "HomeServe marketing operations: builds the premises file, drafts campaigns, submits them for brand approval and executes the drop."
    exclusive_operations:
      - "POST /campaigns"
      - "POST /campaigns/{campaignId}/submission"
      - "POST /campaigns/{campaignId}/mail-drop"
    shared_operations:
      - "POST /premises"
      - "GET /partners/{partnerId}, GET /service-line-products, GET /service-line-products/{productId}, GET /premises, GET /premises/{premisesId}, GET /campaigns, GET /campaigns/{campaignId}, GET /enrollments, GET /enrollments/{enrollmentId}"
  - role: PartnerBrandReviewer
    identity: "entity_backed:UtilityPartner"
    description: "The utility brand partner's own reviewer. X-User-ID is the UtilityPartner.id; the reviewer may only decide campaigns belonging to that partner and may not decide a campaign it submitted itself."
    exclusive_operations:
      - "POST /campaigns/{campaignId}/decision"
    shared_operations:
      - "GET /partners/{partnerId}, GET /service-line-products, GET /service-line-products/{productId}, GET /premises, GET /premises/{premisesId}, GET /campaigns, GET /campaigns/{campaignId}"
  - role: CustomerServiceRep
    identity: opaque
    description: "Contact-centre agent: enrolls premises, files claims on the policyholder's behalf and processes cancellations."
    exclusive_operations:
      - "POST /enrollments"
      - "POST /enrollments/{enrollmentId}/cancellation"
    shared_operations:
      - "POST /claims"
      - "every GET endpoint except GET /regulator-complaints and GET /regulator-complaints/{complaintId}"
  - role: BillingOps
    identity: opaque
    description: "Billing operations: posts premium payments, utility bill-insert remittances, missed payments and write-offs, and issues renewal price change notices."
    exclusive_operations:
      - "POST /enrollments/{enrollmentId}/billing-events"
      - "POST /enrollments/{enrollmentId}/renewal-notices"
    shared_operations:
      - "GET /partners/{partnerId}, GET /service-line-products, GET /service-line-products/{productId}, GET /premises, GET /premises/{premisesId}, GET /enrollments, GET /enrollments/{enrollmentId}, GET /claims, GET /claims/{claimId}, GET /ledger-entries, GET /ledger-entries/{ledgerEntryId}"
  - role: Policyholder
    identity: "entity_backed:Premises"
    description: "The covered homeowner. X-User-ID is the Premises.id; the policyholder may file and appeal claims only on enrollments belonging to that premises."
    exclusive_operations:
      - "POST /claims/{claimId}/appeals"
    shared_operations:
      - "POST /claims"
      - "GET /premises/{premisesId}, GET /enrollments/{enrollmentId}, GET /claims/{claimId}"
  - role: ClaimsAdjuster
    identity: opaque
    description: "Claims adjuster: performs triage and records the coverage decision. The adjuster who denies a claim is barred from deciding its appeal."
    exclusive_operations:
      - "POST /claims/{claimId}/triage-decision"
    shared_operations:
      - "GET /claims, GET /claims/{claimId}, GET /enrollments, GET /enrollments/{enrollmentId}, GET /contractors/{contractorId}, GET /dispatches, GET /dispatches/{dispatchId}, GET /regulator-complaints, GET /regulator-complaints/{complaintId}"
  - role: AppealsOfficer
    identity: opaque
    description: "Independent appeals officer: overturns, remands or upholds a denial. Segregation of duties bars the deciding user from being the triage adjuster."
    exclusive_operations:
      - "POST /claims/{claimId}/appeal-decision"
    shared_operations:
      - "GET /claims, GET /claims/{claimId}, GET /enrollments, GET /enrollments/{enrollmentId}, GET /regulator-complaints, GET /regulator-complaints/{complaintId}"
  - role: NetworkContractor
    identity: "entity_backed:Contractor"
    description: "Network contractor crew. X-User-ID is the Contractor.id; the crew may only post events on its own dispatches."
    exclusive_operations:
      - "POST /dispatches/{dispatchId}/events"
    shared_operations:
      - "GET /contractors/{contractorId}, GET /dispatches, GET /dispatches/{dispatchId}, GET /claims/{claimId}"
  - role: RegulatoryAffairs
    identity: opaque
    description: "Regulatory affairs analyst: logs regulator and ombudsman complaints, files the substantive response with any remedy, and re-opens rejected closures."
    exclusive_operations:
      - "POST /regulator-complaints"
      - "POST /regulator-complaints/{complaintId}/response"
      - "POST /regulator-complaints/{complaintId}/escalation"
    shared_operations:
      - "every GET endpoint"
  - role: OperationsAdmin
    identity: opaque
    description: "Field operations administrator: onboards contractors, dispatches approved claims and runs the overnight batch."
    exclusive_operations:
      - "POST /claims/{claimId}/dispatches"
    shared_operations:
      - "POST /contractors"
      - "POST /operations/nightly-run"
      - "POST /_clock/set_current_utc"
      - "every GET endpoint"
