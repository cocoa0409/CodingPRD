            - "${scC4_grade} == A"
      - name: quality_score_input_set_drops_a_suspended_feed_but_keeps_a_degraded_one
        claim_type: Input Set Filtering
        grounds:
          - calculations.participant_quality_score.input_set
          - state_machines.DataFeed.MONITORED_to_DEGRADED
          - state_machines.DataFeed.DEGRADED_to_SUSPENDED
          - endpoints.POST_hie_data_feeds_id_status_transitions
        distinguishing_aspect: |
          The qualifying set is exactly the samples of feeds whose status is MONITORED or DEGRADED. With a
          MONITORED ADT feed (8000/100/200/50/250) and a DEGRADED CCDA feed (4000/600/800/200/1500, reject
          rate 0.1500) the score is 90.69 grade B - the DEGRADED feed still counts. Suspending the CCDA feed
          re-runs the calculation over the ADT sample alone and the score jumps to 98.78 grade A. The
          penalty is keyed to the provisional grade in both readings (base 91.6875 -> 91.69 -> provisional B
          -> penalty 1 -> 90.69).
        test_recipe:
          setup:
            - "One participant at CONFORMANCE_TESTING with an ADT feed and a CCDA feed, each carrying one sample; the CCDA sample's reject_rate 0.1500 exceeds FEED_DEGRADED_REJECT_RATE so that feed is DEGRADED."
