scenario: |
  Similarity Detection Repository & Institutional Integration (Turnitin): submission intake through
  learning management integrations with assignment configuration and student consent handling,
  comparison against internet sources, publications and a repository of prior student submissions
  with institutional repository options, similarity report generation with source breakdown,
  exclusion settings for quotes, bibliography and small matches, instructor interpretation guidance
  distinguishing similarity from misconduct with false positive risks, repository participation
  choices affecting whether a submission is stored and comparable across institutions, artificial
  intelligence writing detection indicators with confidence limitations and institutional policy
  guidance, data privacy, student record obligations and international data residency, integration
  with grading and feedback workflows

domain_name: similarity-detection-repository
api_prefix: /integrity

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - conditional_feature_flags
    - multi_tenancy_isolation
    - scheduled_actions
  entity_topology: hierarchical
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }
# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Institution
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Institution display name" }
      - { name: residency_region, type: enum, source: input, description: "Data residency region", constraints: "one of {EU, US, APAC}; immutable while data_residency_locked is true" }
      - { name: repository_participation, type: enum, source: input, description: "Repository participation tier", default: INSTITUTION_ONLY, constraints: "one of {GLOBAL_SHARED, INSTITUTION_ONLY, OPT_OUT}" }
      - { name: cross_institution_comparison_enabled, type: boolean, source: input, description: "Permit cross-institution repository comparison", default: false }
      - { name: ai_detection_enabled, type: boolean, source: input, description: "Institution policy flag: run AI writing detection", default: true }
      - { name: data_residency_locked, type: boolean, source: input, description: "Locks residency_region against later edits", default: false }
      - { name: comparable_submission_count, type: integer, source: computed, description: "Count of RepositoryDeposit rows with deposit_state==STORED and scope==GLOBAL_SHARED for this institution; maintained by calc comparable_submission_count", default: 0 }

  - name: LmsIntegration
    parent: Institution
    common_fields: true
    fields:
      - { name: institution_id, type: string, source: input, description: "FK -> Institution.id; owning tenant" }
      - { name: provider, type: enum, source: input, description: "LMS provider", constraints: "one of {CANVAS, BLACKBOARD, MOODLE, CUSTOM_API}" }
      - { name: external_key, type: string, source: input, description: "Opaque LMS connection key" }
      - { name: status, type: enum, source: system, description: "Integration lifecycle", default: PENDING, constraints: "one of {PENDING, ACTIVE, SUSPENDED}" }
      - { name: consent_enforcement, type: enum, source: input, description: "STRICT requires consent GRANTED at intake; LENIENT permits NOT_GIVEN but not WITHDRAWN", default: STRICT, constraints: "one of {STRICT, LENIENT}" }

  - name: Instructor
    parent: Institution
    common_fields: true
    fields:
      - { name: institution_id, type: string, source: input, description: "FK -> Institution.id; owning tenant" }
      - { name: email, type: string, source: input, description: "Instructor email" }
      - { name: full_name, type: string, source: input, description: "Instructor full name" }

  - name: Student
    parent: Institution
    common_fields: true
    fields:
      - { name: institution_id, type: string, source: input, description: "FK -> Institution.id; owning tenant" }
      - { name: external_lms_id, type: string, source: input, description: "Student id in the LMS" }
      - { name: email, type: string, source: input, description: "Student email" }
      - { name: full_name, type: string, source: input, description: "Student full name" }
      - { name: home_region, type: enum, source: input, description: "Student home data region", constraints: "one of {EU, US, APAC}" }
      - { name: consent_status, type: enum, source: system, description: "Repository consent state", default: NOT_GIVEN, constraints: "one of {NOT_GIVEN, GRANTED, WITHDRAWN}" }
      - { name: consent_recorded_at, type: datetime, source: system, description: "Logical-clock timestamp of last consent change; null until first consent", default: null }
  - name: Assignment
    parent: LmsIntegration
    common_fields: true
    fields:
      - { name: lms_integration_id, type: string, source: input, description: "FK -> LmsIntegration.id; delivering integration" }
      - { name: instructor_id, type: string, source: input, description: "FK -> Instructor.id; owning instructor (must equal X-User-ID for Instructor writes)" }
      - { name: title, type: string, source: input, description: "Assignment title" }
      - { name: due_at, type: datetime, source: input, description: "Due instant; accepting_state auto-transitions OPEN->CLOSED when logical clock >= due_at (evaluated lazily on read and on intake)" }
      - { name: accepting_state, type: enum, source: system, description: "Parallel dimension 1: intake gate", default: OPEN, constraints: "one of {OPEN, CLOSED}" }
      - { name: report_visibility, type: enum, source: system, description: "Parallel dimension 2: whether Students may read reports", default: HIDDEN, constraints: "one of {HIDDEN, RELEASED}" }
      - { name: repository_option, type: enum, source: input, description: "STORE_AND_COMPARE stores a deposit at process time; COMPARE_ONLY never stores", default: COMPARE_ONLY, constraints: "one of {STORE_AND_COMPARE, COMPARE_ONLY}" }
      - { name: exclude_quotes, type: boolean, source: input, description: "Filtered score excludes DIRECT_QUOTE fragments", default: false }
      - { name: exclude_bibliography, type: boolean, source: input, description: "Filtered score excludes BIBLIOGRAPHY_ENTRY fragments", default: false }
      - { name: exclude_small_matches, type: boolean, source: input, description: "Filtered score excludes fragments with matched_word_count < small_match_threshold_words", default: false }
      - { name: small_match_threshold_words, type: integer, source: input, description: "Small-match threshold; exclusion applies strictly below this value", default: 8, constraints: "1..32 inclusive" }
      - { name: max_submissions_per_student, type: integer, source: input, description: "Quota of non-SUPERSEDED submissions per student per assignment", default: 3, constraints: "1..10 inclusive" }
      - { name: submission_count, type: integer, source: computed, description: "Count of this assignment's submissions with pipeline_state != SUPERSEDED; maintained by calc submission_count_rollup", default: 0 }

  - name: Submission
    parent: Assignment
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: input, description: "FK -> Assignment.id; parent assignment" }
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; author (must equal X-User-ID for Student intake)" }
      - { name: content_text, type: string, source: input, description: "Paper text body" }
      - { name: word_count, type: integer, source: computed, description: "Count of whitespace-separated tokens in content_text" }
      - { name: pipeline_state, type: enum, source: system, description: "Processing pipeline state", default: RECEIVED, constraints: "one of {RECEIVED, PROCESSING, REPORT_READY, FAILED, SUPERSEDED}" }
      - { name: revision_number, type: integer, source: system, description: "1 for initial intake; prior revision_number + 1 on resubmission", default: 1 }
      - { name: supersedes_submission_id, type: string, source: input, description: "FK -> Submission.id; prior revision being replaced; null on initial intake", default: null }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of intake" }
      - { name: ai_burstiness, type: number, source: input, description: "Upstream text-analysis signal in [0,1]; required for AI scoring", default: null }
      - { name: ai_perplexity, type: number, source: input, description: "Upstream text-analysis signal in [0,1]", default: null }
      - { name: ai_stylometry, type: number, source: input, description: "Upstream text-analysis signal in [0,1]", default: null }

  - name: SourceDocument
    parent: Institution
    common_fields: true
    fields:
      - { name: origin_institution_id, type: string, source: input, description: "FK -> Institution.id; registering institution" }
      - { name: source_type, type: enum, source: input, description: "Corpus class; STUDENT_REPOSITORY rows are auto-created per RepositoryDeposit and cannot be created via POST", constraints: "one of {INTERNET, PUBLICATION, STUDENT_REPOSITORY}" }
      - { name: uri, type: string, source: input, description: "Source locator" }
      - { name: region, type: enum, source: input, description: "Data residency region of the source", constraints: "one of {EU, US, APAC}" }
      - { name: publication_date, type: datetime, source: input, description: "Publication instant; nullable", default: null }
      - { name: status, type: enum, source: system, description: "ACTIVE sources are comparable; RETRACTED sources are excluded", default: ACTIVE, constraints: "one of {ACTIVE, RETRACTED}" }

  - name: MatchFragment
    parent: Submission
    common_fields: false
    fields:
      - { name: submission_id, type: string, source: input, description: "FK -> Submission.id; compared submission" }
      - { name: source_document_id, type: string, source: input, description: "FK -> SourceDocument.id; matched source" }
      - { name: matched_word_count, type: integer, source: input, description: "Contiguous matched words", constraints: ">= 1" }
      - { name: match_category, type: enum, source: input, description: "Match classification drives exclusion and weighting", constraints: "one of {DIRECT_QUOTE, PARAPHRASE, BIBLIOGRAPHY_ENTRY, BOILERPLATE}" }
      - { name: offset_start, type: integer, source: input, description: "Word offset where the match begins in the submission", constraints: ">= 0" }
      - { name: weighted_words, type: integer, source: computed, description: "round_half_up(matched_word_count * category multiplier) per calc match_weighting; computed at injection" }
      - { name: excluded, type: boolean, source: system, description: "True once the source document is RETRACTED; excluded fragments never enter score sums", default: false }
  - name: SimilarityReport
    parent: Submission
    common_fields: true
    fields:
      - { name: submission_id, type: string, source: system, description: "FK -> Submission.id; owning submission (1:1)" }
      - { name: raw_score_bps, type: integer, source: computed, description: "Raw similarity score in basis points 0..10000 per calc similarity_score (raw variant)" }
      - { name: filtered_score_bps, type: integer, source: computed, description: "Filtered similarity score per calc similarity_score (filtered variant over exclusion_snapshot)" }
      - { name: exclusion_snapshot, type: object, source: system, description: "Frozen copy of the assignment exclusion settings (exclude_quotes, exclude_bibliography, exclude_small_matches, small_match_threshold_words) at generation time" }
      - { name: report_state, type: enum, source: system, description: "Report lifecycle", default: DRAFT, constraints: "one of {DRAFT, FINALIZED, STALE}" }
      - { name: instructor_interpretation, type: enum, source: input, description: "Instructor interpretation set at finalize; similarity is not misconduct", default: null, constraints: "one of {NOT_MISCONDUCT, POSSIBLE_MISCONDUCT, NEEDS_REVIEW}" }
      - { name: finalized_at, type: datetime, source: system, description: "Logical-clock timestamp of finalization; null until finalized", default: null }

  - name: AiWritingAssessment
    parent: Submission
    common_fields: true
    fields:
      - { name: submission_id, type: string, source: system, description: "FK -> Submission.id; owning submission (1:1)" }
      - { name: ai_score_bps, type: integer, source: computed, description: "Point-estimate AI writing indicator in basis points per calc ai_confidence_score (point_estimate variant)" }
      - { name: confidence_band, type: enum, source: computed, description: "Signal-agreement band per calc ai_confidence_score", constraints: "one of {LOW, MEDIUM, HIGH}" }
      - { name: conservative_score_bps, type: integer, source: computed, description: "Lower confidence bound per calc ai_confidence_score (conservative_bound variant)" }
      - { name: assessment_state, type: enum, source: system, description: "PENDING at creation; COMPLETE once scored; SUPPRESSED when institution ai_detection_enabled is false or word_count < 250", default: PENDING, constraints: "one of {PENDING, COMPLETE, SUPPRESSED}" }

  - name: RepositoryDeposit
    parent: Submission
    common_fields: true
    fields:
      - { name: submission_id, type: string, source: system, description: "FK -> Submission.id; deposited submission" }
      - { name: institution_id, type: string, source: system, description: "FK -> Institution.id; owning institution (from the submission's assignment integration)" }
      - { name: scope, type: enum, source: computed, description: "GLOBAL_SHARED iff institution.repository_participation==GLOBAL_SHARED else INSTITUTION_ONLY", constraints: "one of {GLOBAL_SHARED, INSTITUTION_ONLY}" }
      - { name: deposit_state, type: enum, source: system, description: "STORED: comparable; QUARANTINED: stored but excluded (institution OPT_OUT); WITHDRAWN: removed", default: STORED, constraints: "one of {STORED, QUARANTINED, WITHDRAWN}" }
      - { name: stored_at, type: datetime, source: system, description: "Logical-clock timestamp of deposit creation" }

  - name: DataRetentionPolicy
    parent: Institution
    common_fields: true
    fields:
      - { name: institution_id, type: string, source: input, description: "FK -> Institution.id; owning tenant" }
      - { name: region, type: enum, source: input, description: "Region the policy governs; must equal institution.residency_region", constraints: "one of {EU, US, APAC}" }
      - { name: applies_to, type: enum, source: input, description: "Purge target class; BOTH overlaps SUBMISSIONS and REPORTS for window-collision checks", constraints: "one of {SUBMISSIONS, REPORTS, BOTH}" }
      - { name: retention_start, type: datetime, source: input, description: "Half-open window start (inclusive)" }
      - { name: retention_end, type: datetime, source: input, description: "Half-open window end (exclusive); must be > retention_start" }
      - { name: policy_state, type: enum, source: system, description: "ACTIVE on creation; auto-transitions to EXPIRED when logical clock >= retention_end (lazy on read and on run-purge)", default: ACTIVE, constraints: "one of {ACTIVE, EXPIRED}" }

  - name: GradeEntry
    parent: Submission
    common_fields: true
    fields:
      - { name: submission_id, type: string, source: input, description: "FK -> Submission.id; graded submission" }
      - { name: score_points, type: number, source: input, description: "Numeric grade awarded", constraints: ">= 0" }
      - { name: feedback_text, type: string, source: input, description: "Instructor feedback", default: "" }
      - { name: grade_state, type: enum, source: system, description: "PROVISIONAL until the submission's report is FINALIZED (auto-release cascade); returns to PROVISIONAL if the report goes STALE", default: PROVISIONAL, constraints: "one of {PROVISIONAL, RELEASED}" }
      - { name: pinned_report_version, type: integer, source: system, description: "SimilarityReport.version observed at grade creation (version-pinning on approval)" }
# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: LmsIntegration
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /integrity/lms-integrations/{id}/activate"
        actor: PlatformAdmin
        preconditions: ["integration.status == PENDING or SUSPENDED"]
        side_effects: ["increments LmsIntegration.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /integrity/lms-integrations/{id}/activate"
        actor: PlatformAdmin
        preconditions: ["integration.status == SUSPENDED"]
        side_effects: ["increments LmsIntegration.version by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /integrity/lms-integrations/{id}/suspend"
        actor: PlatformAdmin
        preconditions: ["integration.status == ACTIVE"]
        side_effects:
          - "increments LmsIntegration.version by 1"
          - "cascade: every Assignment of this integration with accepting_state==OPEN flips to CLOSED (conditional cascade; CLOSED assignments untouched)"

  - entity: Student
    initial_state: NOT_GIVEN
    terminal_states: []
    transitions:
      - from: NOT_GIVEN
        to: GRANTED
        trigger: "POST /integrity/students/{id}/consents with consent_action=GRANT"
        actor: Student
        preconditions: ["OCC: payload expected_student_version == Student.version", "consent_status == NOT_GIVEN or WITHDRAWN"]
        side_effects: ["sets consent_recorded_at to logical clock", "increments Student.version by 1"]
      - from: WITHDRAWN
        to: GRANTED
        trigger: "POST /integrity/students/{id}/consents with consent_action=GRANT"
        actor: Student
        preconditions: ["OCC: payload expected_student_version == Student.version"]
        side_effects: ["sets consent_recorded_at to logical clock", "increments Student.version by 1"]
      - from: GRANTED
        to: WITHDRAWN
        trigger: "POST /integrity/students/{id}/consents with consent_action=WITHDRAW"
        actor: Student
        preconditions: ["OCC: payload expected_student_version == Student.version", "consent_status == GRANTED"]
        side_effects:
          - "sets consent_recorded_at to logical clock"
          - "increments Student.version by 1"
          - "cascade depth-2: every RepositoryDeposit of this student's submissions in deposit_state==STORED flips to QUARANTINED; each quarantine recomputes the owning Institution.comparable_submission_count (derived field reconciliation)"

  - entity: Assignment
    initial_state: "accepting_state=OPEN, report_visibility=HIDDEN (parallel dimensions)"
    terminal_states: ["accepting_state=CLOSED"]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "system: lazy auto-transition when logical clock >= due_at, evaluated on assignment read and on submission intake"
        actor: system
        preconditions: ["logical clock >= Assignment.due_at"]
        side_effects: ["increments Assignment.version by 1"]
      - from: HIDDEN
        to: RELEASED
        trigger: "PATCH /integrity/assignments/{id} with report_visibility=RELEASED"
        actor: Instructor
        preconditions: ["OCC: payload expected_assignment_version == Assignment.version", "acting instructor owns the assignment (instructor_id == X-User-ID)"]
        side_effects: ["increments Assignment.version by 1"]
        note: "parallel dimension: report_visibility evolves independently of accepting_state"

  - entity: Submission
    initial_state: RECEIVED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: RECEIVED
        to: PROCESSING
        trigger: "POST /integrity/submissions/{id}/process"
        actor: Instructor
        preconditions: ["pipeline_state == RECEIVED or FAILED"]
        side_effects: ["increments Submission.version by 1"]
      - from: PROCESSING
        to: REPORT_READY
        trigger: "system: completion of POST /integrity/submissions/{id}/process (same request; PROCESSING is transient within the call)"
        actor: system
        preconditions: ["word_count >= 1"]
        side_effects:
          - "upserts SimilarityReport (report_state=DRAFT, exclusion_snapshot copied from assignment, raw_score_bps/filtered_score_bps per calc similarity_score)"
          - "upserts AiWritingAssessment: COMPLETE with scores per calc ai_confidence_score, or SUPPRESSED when institution.ai_detection_enabled==false or word_count < 250"
          - "when assignment.repository_option==STORE_AND_COMPARE: creates RepositoryDeposit (scope per calc deposit_scope; deposit_state=QUARANTINED when institution.repository_participation==OPT_OUT else STORED) and an auto SourceDocument of source_type=STUDENT_REPOSITORY, then recomputes Institution.comparable_submission_count"
          - "recomputes Assignment.submission_count (calc submission_count_rollup)"
      - from: PROCESSING
        to: FAILED
        trigger: "system: POST /integrity/submissions/{id}/process when content yields word_count == 0"
        actor: system
        preconditions: ["word_count == 0"]
        side_effects: ["no report, assessment, or deposit is created"]
        note: "intake rejects empty content, so FAILED is only reachable when content_text is all-whitespace"
      - from: FAILED
        to: PROCESSING
        trigger: "POST /integrity/submissions/{id}/process (retry)"
        actor: Instructor
        preconditions: ["pipeline_state == FAILED"]
        side_effects: ["increments Submission.version by 1"]
      - from: REPORT_READY
        to: PROCESSING
        trigger: "POST /integrity/submissions/{id}/process (re-run, e.g. after the report went STALE)"
        actor: Instructor
        preconditions: ["pipeline_state == REPORT_READY"]
        side_effects: ["increments Submission.version by 1", "report regeneration refreshes exclusion_snapshot from the assignment's current settings"]
      - from: REPORT_READY
        to: SUPERSEDED
        trigger: "POST /integrity/assignments/{id}/submissions with supersedes_submission_id == this submission"
        actor: Student
        preconditions: ["pipeline_state == REPORT_READY or FAILED", "same student_id and assignment_id as the new submission"]
        side_effects: ["increments Submission.version by 1", "cascade: any RepositoryDeposit of this submission in STORED flips to WITHDRAWN and Institution.comparable_submission_count is recomputed"]
      - from: FAILED
        to: SUPERSEDED
        trigger: "POST /integrity/assignments/{id}/submissions with supersedes_submission_id == this submission"
        actor: Student
        preconditions: ["same student_id and assignment_id"]
        side_effects: ["increments Submission.version by 1"]
  - entity: SourceDocument
    initial_state: ACTIVE
    terminal_states: [RETRACTED]
    transitions:
      - from: ACTIVE
        to: RETRACTED
        trigger: "POST /integrity/source-documents/{id}/retract, or cascade from RepositoryDeposit withdraw"
        actor: InstitutionalAdmin
        preconditions: ["status == ACTIVE"]
        side_effects:
          - "cascade depth-2: every MatchFragment referencing this source gets excluded=true"
          - "cascade depth-3: every SimilarityReport whose submission holds one of those fragments flips DRAFT|FINALIZED -> STALE, which in turn flips RELEASED GradeEntries to PROVISIONAL"

  - entity: SimilarityReport
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /integrity/similarity-reports/{id}/finalize"
        actor: Instructor
        preconditions: ["report_state == DRAFT", "instructor_interpretation provided in payload", "acting instructor owns the submission's assignment"]
        side_effects:
          - "sets finalized_at to logical clock; increments SimilarityReport.version by 1"
          - "cascade depth-2: every GradeEntry of the submission in grade_state==PROVISIONAL flips to RELEASED (grading workflow integration)"
      - from: DRAFT
        to: STALE
        trigger: "system: cascade from PATCH /integrity/assignments/{id} changing any exclusion setting, or from POST /integrity/source-documents/{id}/retract touching a referenced fragment"
        actor: system
        preconditions: []
        side_effects:
          - "increments SimilarityReport.version by 1"
          - "cascade depth-3: every GradeEntry of the submission in grade_state==RELEASED flips back to PROVISIONAL (compensation of the finalize cascade)"
      - from: FINALIZED
        to: STALE
        trigger: "system: same cascades as DRAFT -> STALE"
        actor: system
        preconditions: []
        side_effects: ["increments SimilarityReport.version by 1", "cascade: RELEASED GradeEntries flip to PROVISIONAL"]
      - from: STALE
        to: DRAFT
        trigger: "POST /integrity/submissions/{id}/process re-run on the owning submission"
        actor: Instructor
        preconditions: ["owning submission pipeline_state == REPORT_READY"]
        side_effects: ["exclusion_snapshot refreshed from current assignment settings; scores recomputed; increments SimilarityReport.version by 1"]
        note: "branching with revert: DRAFT<->STALE loop plus FINALIZED exit"

  - entity: AiWritingAssessment
    initial_state: PENDING
    terminal_states: [SUPPRESSED]
    transitions:
      - from: PENDING
        to: COMPLETE
        trigger: "system: completion of POST /integrity/submissions/{id}/process"
        actor: system
        preconditions: ["institution.ai_detection_enabled == true", "word_count >= 250", "ai_burstiness, ai_perplexity, ai_stylometry all present on the submission"]
        side_effects: ["scores per calc ai_confidence_score"]
      - from: PENDING
        to: SUPPRESSED
        trigger: "system: completion of POST /integrity/submissions/{id}/process"
        actor: system
        preconditions: ["institution.ai_detection_enabled == false OR word_count < 250"]
        side_effects: ["ai_score_bps, confidence_band, conservative_score_bps set to null"]

  - entity: RepositoryDeposit
    initial_state: STORED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: STORED
        to: WITHDRAWN
        trigger: "POST /integrity/repository-deposits/{id}/withdraw"
        actor: InstitutionalAdmin
        preconditions: ["deposit_state == STORED or QUARANTINED"]
        side_effects: ["recomputes Institution.comparable_submission_count", "increments RepositoryDeposit.version by 1", "the auto-created STUDENT_REPOSITORY SourceDocument flips to RETRACTED (cascade depth-2), which excludes its MatchFragments (depth-3: dependent reports go STALE)"]
      - from: QUARANTINED
        to: WITHDRAWN
        trigger: "POST /integrity/repository-deposits/{id}/withdraw"
        actor: InstitutionalAdmin
        preconditions: []
        side_effects: ["recomputes Institution.comparable_submission_count", "increments RepositoryDeposit.version by 1"]
      - from: STORED
        to: QUARANTINED
        trigger: "system: cascade from PATCH /integrity/institutions/{id} setting repository_participation=OPT_OUT, or from consent WITHDRAW"
        actor: system
        preconditions: []
        side_effects: ["recomputes Institution.comparable_submission_count", "increments RepositoryDeposit.version by 1"]
      - from: QUARANTINED
        to: STORED
        trigger: "system: cascade from PATCH /integrity/institutions/{id} restoring repository_participation to GLOBAL_SHARED or INSTITUTION_ONLY (only deposits quarantined by that participation change; consent-quarantined deposits stay QUARANTINED)"
        actor: system
        preconditions: ["deposit was quarantined by participation cascade, not by consent withdrawal"]
        side_effects: ["recomputes Institution.comparable_submission_count", "increments RepositoryDeposit.version by 1"]

  - entity: DataRetentionPolicy
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: lazy auto-transition when logical clock >= retention_end, evaluated on read and on run-purge"
        actor: system
        preconditions: ["logical clock >= retention_end"]
        side_effects: ["increments DataRetentionPolicy.version by 1"]

  - entity: GradeEntry
    initial_state: PROVISIONAL
    terminal_states: []
    transitions:
      - from: PROVISIONAL
        to: RELEASED
        trigger: "system: cascade from SimilarityReport DRAFT -> FINALIZED"
        actor: system
        preconditions: ["grade_state == PROVISIONAL"]
        side_effects: ["increments GradeEntry.version by 1"]
      - from: RELEASED
        to: PROVISIONAL
        trigger: "system: compensation cascade from SimilarityReport -> STALE"
        actor: system
        preconditions: ["grade_state == RELEASED"]
        side_effects: ["increments GradeEntry.version by 1"]

# =============================================================================
# Concurrency Rules (OCC on parent version; see SKILL.md §1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: assignment-settings-stale-version
    parent_entity: Assignment
    write_endpoint: "PATCH /integrity/assignments/{id}"
    occ_field: "expected_assignment_version"
    description: |
      Updating an assignment whose version has advanced since the client last
      observed it is rejected: an earlier accepted update (settings change or
      the lazy auto-close bump) has legitimately superseded the client's view.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: student-consent-stale-version
    parent_entity: Student
    write_endpoint: "POST /integrity/students/{id}/consents"
    occ_field: "expected_student_version"
    description: |
      Recording consent against a Student whose version has advanced since the
      client last observed it is rejected: the latest consent state supersedes
      the one the client read.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: institution-policy-stale-version
    parent_entity: Institution
    write_endpoint: "PATCH /integrity/institutions/{id}"
    occ_field: "expected_institution_version"
    description: |
      Updating institutional policy against an Institution whose version has
      advanced since the client last observed it is rejected: repository
      participation and residency changes must apply to the freshest state.
    error_id: ERR_STALE_VERSION
    http_status: 412
# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: similarity_score
    trigger: "POST /integrity/submissions/{id}/process (report creation or regeneration)"
    algorithm: aggregation
    formula: |
      # Step 1 (dedup): cluster the submission's MatchFragments whose word intervals
      # [offset_start, offset_start + matched_word_count) overlap transitively; within each
      # cluster keep only the fragment with the largest weighted_words (tie-break: earliest
      # created_at). Excluded fragments (excluded==true) never participate.
      # Step 2 (sum): matched = sum of weighted_words over surviving fragments.
      # Step 3 (score): score_bps = round_half_up(10000 * min(1, matched / submission.word_count)).
      # raw variant: input set = ALL non-excluded fragments.
      # filtered variant: input set = non-excluded fragments minus
      #   DIRECT_QUOTE when exclusion_snapshot.exclude_quotes,
      #   BIBLIOGRAPHY_ENTRY when exclusion_snapshot.exclude_bibliography,
      #   fragments with matched_word_count < exclusion_snapshot.small_match_threshold_words
      #   when exclusion_snapshot.exclude_small_matches (boundary: exactly at threshold is KEPT).
    input_set: "MatchFragments of the submission; raw variant uses all non-excluded, filtered variant applies exclusion_snapshot flags"
    constants:
      DIRECT_QUOTE_MULT: 1.0
      PARAPHRASE_MULT: 0.8
      BIBLIOGRAPHY_ENTRY_MULT: 1.0
      BOILERPLATE_MULT: 0.5
    precision: "integer basis points 0..10000, round_half_up"
    variants:
      - name: raw
        when: "always computed; stored as raw_score_bps"
        difference: "no exclusion filtering applied"
      - name: filtered
        when: "always computed; stored as filtered_score_bps"
        difference: "exclusion_snapshot flags remove categories and small matches before summing"

  - name: match_weighting
    trigger: "POST /integrity/_matches/inject (fragment creation)"
    algorithm: weighted_scoring
    formula: |
      weighted_words = round_half_up(matched_word_count * MULT(match_category)).
      Rounding is per-fragment BEFORE summation: the server rounds each fragment's
      weighted_words to an integer at injection time and similarity_score sums those
      integers. Summing raw matched_word_count values and rounding once afterwards is
      NOT equivalent and is forbidden (e.g. three PARAPHRASE fragments of 1 word each:
      per-fragment round gives 3 * round_half_up(0.8) = 3 * 1 = 3; sum-then-round gives
      round_half_up(2.4) = 2).
    input_set: "the single injected MatchFragment"
    constants:
      DIRECT_QUOTE_MULT: 1.0
      PARAPHRASE_MULT: 0.8
      BIBLIOGRAPHY_ENTRY_MULT: 1.0
      BOILERPLATE_MULT: 0.5
    precision: "integer words, round_half_up per fragment"

  - name: ai_confidence_score
    trigger: "system: AiWritingAssessment PENDING -> COMPLETE during process"
    algorithm: weighted_scoring
    formula: |
      base = ai_burstiness * 0.5 + ai_perplexity * 0.3 + ai_stylometry * 0.2
      ai_score_bps = round_half_up(10000 * base)
      spread = max(signals) - min(signals)
      confidence_band = HIGH if spread <= 0.15 else MEDIUM if spread <= 0.30 else LOW
      conservative_score_bps = max(0, ai_score_bps - MARGIN[confidence_band])
    input_set: "the submission's three ai_* signal fields"
    constants:
      W_BURSTINESS: 0.5
      W_PERPLEXITY: 0.3
      W_STYLOMETRY: 0.2
      BAND_HIGH_MAX_SPREAD: 0.15
      BAND_MEDIUM_MAX_SPREAD: 0.30
      MARGIN:
        LOW: 2500
        MEDIUM: 1500
        HIGH: 500
    precision: "integer basis points, round_half_up"
    variants:
      - name: point_estimate
        when: "stored as ai_score_bps"
        difference: "raw weighted blend"
      - name: conservative_bound
        when: "stored as conservative_score_bps"
        difference: "point estimate minus the confidence-band margin, floored at 0; institutional policy guidance treats the conservative bound as the only actionable indicator"

  - name: comparable_submission_count
    trigger: "RepositoryDeposit create / STORED<->QUARANTINED / ->WITHDRAWN transitions"
    algorithm: aggregation
    formula: |
      Institution.comparable_submission_count =
        count(RepositoryDeposit where institution_id == this Institution.id
              AND deposit_state == STORED AND scope == GLOBAL_SHARED)
    input_set: "RepositoryDeposits of the institution with deposit_state==STORED and scope==GLOBAL_SHARED only"
    precision: "integer count"

  - name: submission_count_rollup
    trigger: "Submission intake (create) and supersede transitions"
    algorithm: aggregation
    formula: |
      Assignment.submission_count =
        count(Submission where assignment_id == this Assignment.id
              AND pipeline_state != SUPERSEDED)
    input_set: "Submissions of the assignment excluding SUPERSEDED"
    precision: "integer count"

  - name: deposit_scope
    trigger: "RepositoryDeposit creation during process"
    algorithm: threshold
    formula: |
      scope = GLOBAL_SHARED if institution.repository_participation == GLOBAL_SHARED
              else INSTITUTION_ONLY
      deposit_state = QUARANTINED if institution.repository_participation == OPT_OUT
                      else STORED
    input_set: "the owning institution's repository_participation"
    precision: "enum"

  - name: purge_candidate_set
    trigger: "POST /integrity/retention-policies/{id}/run-purge"
    algorithm: chronological
    formula: |
      candidates = Submissions of the institution where
        submitted_at IN [retention_start, retention_end)  (half-open: start inclusive, end exclusive)
        AND (applies_to IN {SUBMISSIONS, BOTH})
        AND pipeline_state != SUPERSEDED
      ordered by submitted_at ASC, tie-break created_at ASC.
      grace conflict: if any candidate owns a RepositoryDeposit in deposit_state==STORED whose
      stored_at lies in the CLOSED interval [retention_start - 7 days, retention_end]
      (both endpoints included), the whole run is rejected with ERR_PURGE_GRACE_CONFLICT
      (aggregate validation; boundary: stored_at == retention_end exactly IS a conflict here,
      even though submitted_at == retention_end would NOT be a candidate).
    input_set: "institution's non-SUPERSEDED submissions inside the half-open retention window"
    constants:
      GRACE_DAYS: 7
    precision: "instants compared at millisecond precision"
# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role known", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "role permitted for the endpoint per RBAC matrix; ownership checks (Instructor instructor_id == X-User-ID on assignment writes, Student student_id == X-User-ID on intake/consents)", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "path and body referenced resources exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: existence, check: "required request body fields present, enums and types well-formed", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 5, category: state, check: "LmsIntegration.status == ACTIVE when creating an Assignment under it", error_id: ERR_INTEGRATION_NOT_ACTIVE, http_status: 409, applies_to: "POST /integrity/lms-integrations/{id}/assignments" }
  - { priority: 6, category: state, check: "Assignment.accepting_state == OPEN at submission intake (lazy due_at auto-close applied first)", error_id: ERR_ASSIGNMENT_CLOSED, http_status: 409, applies_to: "POST /integrity/assignments/{id}/submissions" }
  - { priority: 7, category: state, check: "Submission.pipeline_state in {RECEIVED, FAILED, REPORT_READY} for process; SimilarityReport.report_state == DRAFT for finalize", error_id: ERR_INVALID_SUBMISSION_STATE, http_status: 409, applies_to: "POST /integrity/submissions/{id}/process, POST /integrity/similarity-reports/{id}/finalize" }
  - { priority: 8, category: state, check: "SimilarityReport.report_state != STALE when finalizing (a stale report must be regenerated first)", error_id: ERR_REPORT_STALE, http_status: 409, applies_to: "POST /integrity/similarity-reports/{id}/finalize" }
  - { priority: 9, category: business_safety, check: "consent gate at intake: STRICT integration requires Student.consent_status == GRANTED; LENIENT allows NOT_GIVEN but rejects WITHDRAWN", error_id: ERR_CONSENT_MISSING, http_status: 422, applies_to: "POST /integrity/assignments/{id}/submissions" }
  - { priority: 10, category: business_safety, check: "data residency: when institution.data_residency_locked, Student.home_region must equal institution.residency_region at intake", error_id: ERR_RESIDENCY_VIOLATION, http_status: 422, applies_to: "POST /integrity/assignments/{id}/submissions" }
  - { priority: 11, category: business_safety, check: "residency_region is immutable while data_residency_locked is true", error_id: ERR_RESIDENCY_LOCKED, http_status: 409, applies_to: "PATCH /integrity/institutions/{id}" }
  - { priority: 12, category: business_safety, check: "cross-region / cross-institution comparison: injected fragment rejected unless (a) source.region == submission institution residency_region, OR (b) source is STUDENT_REPOSITORY with a STORED GLOBAL_SHARED deposit and both institutions have cross_institution_comparison_enabled", error_id: ERR_CROSS_REGION_COMPARISON, http_status: 422, applies_to: "POST /integrity/_matches/inject" }
  - { priority: 13, category: business_constraint, check: "content_text non-empty and word_count >= 1 after tokenization", error_id: ERR_CONTENT_INVALID, http_status: 422, applies_to: "POST /integrity/assignments/{id}/submissions" }
  - { priority: 14, category: business_constraint, check: "small_match_threshold_words in 1..32 when provided", error_id: ERR_THRESHOLD_OUT_OF_RANGE, http_status: 422, applies_to: "POST /integrity/lms-integrations/{id}/assignments, PATCH /integrity/assignments/{id}" }
  - { priority: 15, category: business_constraint, check: "manually creating a SourceDocument with source_type == STUDENT_REPOSITORY is forbidden (auto-created per deposit only)", error_id: ERR_VALIDATION, http_status: 400, applies_to: "POST /integrity/institutions/{id}/source-documents" }
  - { priority: 16, category: business_fiscal, check: "non-SUPERSEDED submissions by this student on this assignment < max_submissions_per_student", error_id: ERR_SUBMISSION_LIMIT_REACHED, http_status: 422, applies_to: "POST /integrity/assignments/{id}/submissions" }
  - { priority: 17, category: business_referential, check: "supersedes_submission_id (when present) references a submission of the same student on the same assignment in pipeline_state REPORT_READY or FAILED", error_id: ERR_INVALID_SUPERSEDE_TARGET, http_status: 422, applies_to: "POST /integrity/assignments/{id}/submissions" }
  - { priority: 18, category: business_referential, check: "GradeEntry creation requires the submission to have a SimilarityReport in report_state DRAFT or FINALIZED", error_id: ERR_GRADE_REQUIRES_REPORT, http_status: 409, applies_to: "POST /integrity/submissions/{id}/grade-entries" }
  - { priority: 19, category: business_temporal, check: "retention_start < retention_end and region == institution.residency_region", error_id: ERR_INVALID_RETENTION_WINDOW, http_status: 422, applies_to: "POST /integrity/institutions/{id}/retention-policies" }
  - { priority: 20, category: business_temporal, check: "new ACTIVE policy window [retention_start, retention_end) must not overlap any existing ACTIVE policy of the same institution with colliding applies_to (BOTH collides with everything); half-open semantics: end == other.start is NOT an overlap", error_id: ERR_RETENTION_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /integrity/institutions/{id}/retention-policies" }
  - { priority: 21, category: business_temporal, check: "run-purge grace conflict per calc purge_candidate_set (closed interval)", error_id: ERR_PURGE_GRACE_CONFLICT, http_status: 409, applies_to: "POST /integrity/retention-policies/{id}/run-purge" }
  - { priority: 22, category: state, check: "policy_state == ACTIVE for run-purge (after lazy expiry)", error_id: ERR_POLICY_EXPIRED, http_status: 409, applies_to: "POST /integrity/retention-policies/{id}/run-purge" }
  - { priority: 23, category: state, check: "SourceDocument.status == ACTIVE when injecting fragments against it", error_id: ERR_SOURCE_RETRACTED, http_status: 409, applies_to: "POST /integrity/_matches/inject" }
  - { priority: 24, category: state, check: "OCC: expected_<parent>_version equals the parent's current version on OCC-guarded writes", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PATCH /integrity/assignments/{id}, PATCH /integrity/institutions/{id}, POST /integrity/students/{id}/consents" }
# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/integrity/institutions", description: "Create institution", roles: [PlatformAdmin], code: 201, input: [name, residency_region, "repository_participation?", "cross_institution_comparison_enabled?", "ai_detection_enabled?", "data_residency_locked?"], output: Institution, side_effects: [] }
  - { method: GET, path: "/integrity/institutions/{id}", description: "Read institution", roles: [PlatformAdmin, InstitutionalAdmin, Instructor, Student], code: 200, input: [], output: Institution, side_effects: [] }
  - { method: PATCH, path: "/integrity/institutions/{id}", description: "Update repository participation / residency / flags (OCC-guarded)", roles: [PlatformAdmin], code: 200, input: [expected_institution_version, "repository_participation?", "cross_institution_comparison_enabled?", "residency_region?", "ai_detection_enabled?"], output: Institution, side_effects: ["increments Institution.version by 1", "repository_participation -> OPT_OUT cascades STORED deposits to QUARANTINED (and restores on reversal); comparable_submission_count recomputed"] }
  - { method: POST, path: "/integrity/institutions/{id}/lms-integrations", description: "Create LMS integration", roles: [PlatformAdmin, InstitutionalAdmin], code: 201, input: [provider, external_key, "consent_enforcement?"], output: LmsIntegration, side_effects: [] }
  - { method: GET, path: "/integrity/institutions/{id}/lms-integrations", description: "List integrations of an institution", roles: [PlatformAdmin, InstitutionalAdmin], code: 200, input: [], output: "LmsIntegration[]", side_effects: [] }
  - { method: POST, path: "/integrity/lms-integrations/{id}/activate", description: "Activate integration (from PENDING or SUSPENDED)", roles: [PlatformAdmin, InstitutionalAdmin], code: 200, input: [], output: LmsIntegration, side_effects: ["LmsIntegration PENDING|SUSPENDED -> ACTIVE"] }
  - { method: POST, path: "/integrity/lms-integrations/{id}/suspend", description: "Suspend integration; cascades OPEN assignments to CLOSED", roles: [PlatformAdmin, InstitutionalAdmin], code: 200, input: [], output: LmsIntegration, side_effects: ["LmsIntegration ACTIVE -> SUSPENDED", "conditional cascade: OPEN assignments -> CLOSED"] }
  - { method: POST, path: "/integrity/institutions/{id}/instructors", description: "Create instructor", roles: [PlatformAdmin, InstitutionalAdmin], code: 201, input: [email, full_name], output: Instructor, side_effects: [] }
  - { method: GET, path: "/integrity/institutions/{id}/instructors", description: "List instructors of an institution", roles: [PlatformAdmin, InstitutionalAdmin], code: 200, input: [], output: "Instructor[]", side_effects: [] }
  - { method: POST, path: "/integrity/institutions/{id}/students", description: "Create student", roles: [PlatformAdmin, InstitutionalAdmin], code: 201, input: [external_lms_id, email, full_name, home_region], output: Student, side_effects: [] }
  - { method: GET, path: "/integrity/institutions/{id}/students", description: "List students of an institution", roles: [PlatformAdmin, InstitutionalAdmin, Instructor], code: 200, input: [], output: "Student[]", side_effects: [] }
  - { method: POST, path: "/integrity/students/{id}/consents", description: "Record or withdraw repository consent (OCC-guarded)", roles: [Student, InstitutionalAdmin], code: 200, input: [expected_student_version, consent_action], output: Student, side_effects: ["consent state machine transition", "WITHDRAW cascades STORED deposits to QUARANTINED", "increments Student.version by 1"] }
  - { method: POST, path: "/integrity/lms-integrations/{id}/assignments", description: "Create assignment under an ACTIVE integration", roles: [Instructor], code: 201, input: [instructor_id, title, due_at, "repository_option?", "exclude_quotes?", "exclude_bibliography?", "exclude_small_matches?", "small_match_threshold_words?", "max_submissions_per_student?", "report_visibility?"], output: Assignment, side_effects: [] }
  - { method: GET, path: "/integrity/lms-integrations/{id}/assignments", description: "List assignments of an integration", roles: [PlatformAdmin, InstitutionalAdmin, Instructor], code: 200, input: [], output: "Assignment[]", side_effects: [] }
  - { method: GET, path: "/integrity/assignments/{id}", description: "Read assignment (applies lazy due_at auto-close)", roles: [PlatformAdmin, InstitutionalAdmin, Instructor, Student], code: 200, input: [], output: Assignment, side_effects: ["lazy auto-close when clock >= due_at"] }
  - { method: GET, path: "/integrity/assignments", description: "List assignments with optional filters", roles: [PlatformAdmin, InstitutionalAdmin, Instructor], code: 200, input: ["instructor_id?", "lms_integration_id?"], output: "Assignment[]", side_effects: [] }
  - { method: PATCH, path: "/integrity/assignments/{id}", description: "Update exclusion settings / report visibility (OCC-guarded)", roles: [Instructor], code: 200, input: [expected_assignment_version, "exclude_quotes?", "exclude_bibliography?", "exclude_small_matches?", "small_match_threshold_words?", "report_visibility?", "repository_option?"], output: Assignment, side_effects: ["increments Assignment.version by 1", "exclusion change cascades: DRAFT/FINALIZED reports -> STALE, RELEASED grade entries -> PROVISIONAL"] }
  - { method: POST, path: "/integrity/assignments/{id}/submissions", description: "Submission intake; with supersedes_submission_id performs a resubmission", roles: [Student], code: 201, input: [student_id, content_text, "supersedes_submission_id?", "ai_burstiness?", "ai_perplexity?", "ai_stylometry?"], output: Submission, side_effects: ["computes word_count", "supersede flips prior submission to SUPERSEDED and withdraws its STORED deposit", "recomputes Assignment.submission_count"] }
  - { method: GET, path: "/integrity/assignments/{id}/submissions", description: "List submissions of an assignment", roles: [PlatformAdmin, InstitutionalAdmin, Instructor], code: 200, input: [], output: "Submission[]", side_effects: [] }
  - { method: GET, path: "/integrity/submissions/{id}", description: "Read submission; Student may read only own submissions", roles: [PlatformAdmin, InstitutionalAdmin, Instructor, Student], code: 200, input: [], output: Submission, side_effects: [] }
  - { method: GET, path: "/integrity/submissions", description: "List submissions with optional filters", roles: [PlatformAdmin, InstitutionalAdmin, Instructor], code: 200, input: ["student_id?", "supersedes_submission_id?"], output: "Submission[]", side_effects: [] }
  - { method: POST, path: "/integrity/submissions/{id}/process", description: "Run comparison pipeline: build/refresh report, AI assessment, repository deposit", roles: [Instructor, PlatformAdmin], code: 200, input: [], output: Submission, side_effects: ["Submission -> PROCESSING -> REPORT_READY (or FAILED)", "upserts SimilarityReport DRAFT with fresh exclusion_snapshot", "upserts AiWritingAssessment", "creates RepositoryDeposit + auto STUDENT_REPOSITORY SourceDocument when STORE_AND_COMPARE", "recomputes Institution.comparable_submission_count"] }
  - { method: POST, path: "/integrity/institutions/{id}/source-documents", description: "Register an INTERNET or PUBLICATION source", roles: [PlatformAdmin, InstitutionalAdmin], code: 201, input: [source_type, uri, region, "publication_date?"], output: SourceDocument, side_effects: [] }
  - { method: GET, path: "/integrity/institutions/{id}/source-documents", description: "List sources registered by an institution", roles: [PlatformAdmin, InstitutionalAdmin, Instructor], code: 200, input: [], output: "SourceDocument[]", side_effects: [] }
  - { method: GET, path: "/integrity/source-documents/{id}", description: "Read source document", roles: [PlatformAdmin, InstitutionalAdmin, Instructor], code: 200, input: [], output: SourceDocument, side_effects: [] }
  - { method: POST, path: "/integrity/source-documents/{id}/retract", description: "Retract a source; excludes its fragments and stales dependent reports", roles: [PlatformAdmin, InstitutionalAdmin], code: 200, input: [], output: SourceDocument, side_effects: ["status -> RETRACTED", "cascade: its MatchFragments excluded=true", "dependent SimilarityReports -> STALE", "RELEASED GradeEntries -> PROVISIONAL"] }
  - { method: GET, path: "/integrity/submissions/{id}/match-fragments", description: "List match fragments of a submission (source breakdown)", roles: [PlatformAdmin, InstitutionalAdmin, Instructor], code: 200, input: [], output: "MatchFragment[]", side_effects: [] }
  - { method: GET, path: "/integrity/source-documents/{id}/match-fragments", description: "List fragments referencing a source", roles: [PlatformAdmin, InstitutionalAdmin, Instructor], code: 200, input: [], output: "MatchFragment[]", side_effects: [] }
  - { method: POST, path: "/integrity/_matches/inject", description: "Test-driving endpoint: inject a deterministic MatchFragment against a RECEIVED/REPORT_READY submission and an ACTIVE source", roles: [PlatformAdmin], code: 201, input: [submission_id, source_document_id, matched_word_count, match_category, offset_start], output: MatchFragment, side_effects: ["computes weighted_words per calc match_weighting"] }
  - { method: GET, path: "/integrity/submissions/{id}/similarity-reports", description: "Read the submission's similarity report (array of 0..1); Students may read only when assignment.report_visibility == RELEASED and only own submissions", roles: [PlatformAdmin, InstitutionalAdmin, Instructor, Student], code: 200, input: [], output: "SimilarityReport[]", side_effects: [] }
  - { method: POST, path: "/integrity/similarity-reports/{id}/finalize", description: "Instructor finalizes report with interpretation; releases grade entries", roles: [Instructor], code: 200, input: [instructor_interpretation], output: SimilarityReport, side_effects: ["DRAFT -> FINALIZED", "cascade: PROVISIONAL GradeEntries -> RELEASED"] }
  - { method: GET, path: "/integrity/submissions/{id}/ai-writing-assessments", description: "Read the submission's AI writing assessment (array of 0..1)", roles: [PlatformAdmin, InstitutionalAdmin, Instructor], code: 200, input: [], output: "AiWritingAssessment[]", side_effects: [] }
  - { method: GET, path: "/integrity/submissions/{id}/repository-deposits", description: "List repository deposits of a submission", roles: [PlatformAdmin, InstitutionalAdmin, Instructor], code: 200, input: [], output: "RepositoryDeposit[]", side_effects: [] }
  - { method: GET, path: "/integrity/institutions/{id}/repository-deposits", description: "List repository deposits of an institution", roles: [PlatformAdmin, InstitutionalAdmin], code: 200, input: [], output: "RepositoryDeposit[]", side_effects: [] }
  - { method: POST, path: "/integrity/repository-deposits/{id}/withdraw", description: "Withdraw a deposit from the repository", roles: [PlatformAdmin, InstitutionalAdmin], code: 200, input: [], output: RepositoryDeposit, side_effects: ["-> WITHDRAWN", "auto SourceDocument -> RETRACTED (fragments excluded, reports STALE)", "recomputes Institution.comparable_submission_count"] }
  - { method: POST, path: "/integrity/institutions/{id}/retention-policies", description: "Create an ACTIVE retention purge window", roles: [PlatformAdmin, InstitutionalAdmin], code: 201, input: [region, applies_to, retention_start, retention_end], output: DataRetentionPolicy, side_effects: [] }
  - { method: GET, path: "/integrity/institutions/{id}/retention-policies", description: "List retention policies of an institution (applies lazy expiry)", roles: [PlatformAdmin, InstitutionalAdmin], code: 200, input: [], output: "DataRetentionPolicy[]", side_effects: ["lazy EXPIRED transition when clock >= retention_end"] }
  - { method: POST, path: "/integrity/retention-policies/{id}/run-purge", description: "Execute purge over the policy window per calc purge_candidate_set", roles: [PlatformAdmin, InstitutionalAdmin], code: 200, input: [], output: "{ purged_count: integer, purged_submission_ids: array }", side_effects: ["deletes candidate submissions, their fragments and reports", "their STORED/QUARANTINED deposits -> WITHDRAWN with comparable_submission_count recompute"] }
  - { method: POST, path: "/integrity/submissions/{id}/grade-entries", description: "Create a grade entry pinned to the current report version", roles: [Instructor], code: 201, input: [score_points, "feedback_text?"], output: GradeEntry, side_effects: ["pins pinned_report_version to the report's current version"] }
  - { method: GET, path: "/integrity/submissions/{id}/grade-entries", description: "List grade entries of a submission", roles: [PlatformAdmin, InstitutionalAdmin, Instructor], code: 200, input: [], output: "GradeEntry[]", side_effects: [] }
  - { method: POST, path: "/integrity/_clock/set_current_utc", description: "Test-driving endpoint: set the logical clock. Default startup time is 2026-09-01T00:00:00Z; the server MUST NOT use wall-clock time", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["sets logical clock"] }
# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for endpoint, or ownership check failed (Instructor vs assignment.instructor_id; Student vs student_id; Student reading another student's resource or an unreleased report)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist (path ids left-to-right, then body ids)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request: missing required field, bad enum value, or forbidden source_type STUDENT_REPOSITORY on manual source creation" }
  - { id: ERR_INTEGRATION_NOT_ACTIVE, http: 409, condition: "Assignment creation under an integration whose status != ACTIVE" }
  - { id: ERR_ASSIGNMENT_CLOSED, http: 409, condition: "Submission intake when assignment.accepting_state == CLOSED (including lazy due_at auto-close)" }
  - { id: ERR_INVALID_SUBMISSION_STATE, http: 409, condition: "process/finalize invoked from a pipeline/report state that does not allow it (e.g. process on SUPERSEDED, finalize on FINALIZED)" }
  - { id: ERR_REPORT_STALE, http: 409, condition: "Finalize attempted on a STALE report; regenerate via process first" }
  - { id: ERR_CONSENT_MISSING, http: 422, condition: "Consent gate failed at intake (STRICT: consent_status != GRANTED; LENIENT: consent_status == WITHDRAWN)" }
  - { id: ERR_RESIDENCY_VIOLATION, http: 422, condition: "Student.home_region != institution.residency_region while data_residency_locked" }
  - { id: ERR_RESIDENCY_LOCKED, http: 409, condition: "PATCH attempting to change residency_region while data_residency_locked is true" }
  - { id: ERR_CROSS_REGION_COMPARISON, http: 422, condition: "Injected fragment crosses residency or institutional visibility boundaries without GLOBAL_SHARED scope and mutual cross_institution_comparison_enabled" }
  - { id: ERR_CONTENT_INVALID, http: 422, condition: "content_text empty or tokenizes to zero words" }
  - { id: ERR_THRESHOLD_OUT_OF_RANGE, http: 422, condition: "small_match_threshold_words outside 1..32" }
  - { id: ERR_SUBMISSION_LIMIT_REACHED, http: 422, condition: "Student already has max_submissions_per_student non-SUPERSEDED submissions on the assignment" }
  - { id: ERR_INVALID_SUPERSEDE_TARGET, http: 422, condition: "supersedes_submission_id missing, belongs to another student/assignment, or target not in REPORT_READY/FAILED" }
  - { id: ERR_GRADE_REQUIRES_REPORT, http: 409, condition: "GradeEntry creation without a DRAFT/FINALIZED SimilarityReport on the submission" }
  - { id: ERR_INVALID_RETENTION_WINDOW, http: 422, condition: "retention_start >= retention_end, or policy region != institution.residency_region" }
  - { id: ERR_RETENTION_WINDOW_OVERLAP, http: 409, condition: "Half-open window collides with an existing ACTIVE policy of colliding applies_to; adjacency (end == start) is allowed" }
  - { id: ERR_PURGE_GRACE_CONFLICT, http: 409, condition: "A purge candidate holds a STORED deposit inside the closed 7-day grace interval" }
  - { id: ERR_POLICY_EXPIRED, http: 409, condition: "run-purge on an EXPIRED policy" }
  - { id: ERR_SOURCE_RETRACTED, http: 409, condition: "Injecting a fragment against a RETRACTED source" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_<parent>_version does not match the parent's current version" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Cross-tenant operator; manages institutions, integrations, sources, retention, clock, and test-driving injection"
    identity: opaque
    exclusive_operations:
      - "POST /integrity/institutions"
      - "PATCH /integrity/institutions/{id}"
      - "POST /integrity/_matches/inject"
      - "POST /integrity/_clock/set_current_utc"
    shared_operations:
      - "all GET endpoints"
      - "integration activate/suspend, source create/retract, deposit withdraw, retention policy create/run-purge, submission process"
  - name: InstitutionalAdmin
    description: "Tenant-scoped administrator for one institution (integrations, instructors, students, sources, deposits, retention)"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /integrity/institutions/{id}/lms-integrations, activate, suspend"
      - "POST /integrity/institutions/{id}/instructors, students"
      - "POST /integrity/students/{id}/consents"
      - "source create/retract, deposit withdraw, retention policy create/run-purge"
      - "GET endpoints within own institution scope"
  - name: Instructor
    description: "Faculty member; owns assignments, runs processing, interprets and finalizes reports, grades"
    identity: "entity_backed:Instructor"
    exclusive_operations:
      - "POST /integrity/lms-integrations/{id}/assignments"
      - "PATCH /integrity/assignments/{id}"
      - "POST /integrity/similarity-reports/{id}/finalize"
      - "POST /integrity/submissions/{id}/grade-entries"
    shared_operations:
      - "POST /integrity/submissions/{id}/process"
      - "GET endpoints for own institution's assignments, submissions, reports, fragments, assessments, deposits, grade entries"
  - name: Student
    description: "Author of submissions; grants/withdraws consent, submits and resubmits own work, reads own reports only once released"
    identity: "entity_backed:Student"
    exclusive_operations:
      - "POST /integrity/assignments/{id}/submissions (student_id must equal X-User-ID)"
    shared_operations:
      - "POST /integrity/students/{id}/consents (own record only)"
      - "GET /integrity/submissions/{id} and GET /integrity/submissions/{id}/similarity-reports for own submissions (reports only when assignment.report_visibility == RELEASED)"
