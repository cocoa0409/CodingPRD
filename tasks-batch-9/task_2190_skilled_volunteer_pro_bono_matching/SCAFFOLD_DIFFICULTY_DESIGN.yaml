      - name: agreement_sent_countered_cycle_exhausts_rounds
        grounds:
          - state_machines.EngagementAgreement.SENT_to_COUNTERED
          - state_machines.EngagementAgreement.COUNTERED_to_SENT
          - state_machines.EngagementAgreement.SENT_to_EXECUTED
          - entities.EngagementAgreement.fields.counter_round
          - entities.EngagementAgreement.fields.terms_revision_no
          - validations[priority=37]
        distinguishing_aspect: |
          EngagementAgreement is cyclic: SENT -> COUNTERED -> SENT can be traversed repeatedly, and
          the SAME endpoint POST /agreements/{id}/execute is non-idempotent in the opposite direction -
          the first call only stamps one signature slot and leaves status SENT, while the countersign
          completes the transition. Each counter must alternate parties, bumps counter_round and
          terms_revision_no = counter_round + 1, and clears BOTH signature stamps, so a signature
          collected on revision 1 cannot survive into revision 2. After the third counter the loop is
          closed: P37 rejects a fourth with ERR_COUNTER_LIMIT_EXCEEDED (409) and the agreement remains
          SENT rather than looping again or being voided.
