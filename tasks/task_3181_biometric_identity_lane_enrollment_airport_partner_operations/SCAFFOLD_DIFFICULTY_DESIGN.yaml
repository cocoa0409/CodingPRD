  - rule_id: priority_pair_validation_conflict
    instances:
      - name: expired_document_and_underage_both_fail_safety_order_pinned
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_MEMBER_UNDERAGE]
          - errors[ERR_DOCUMENT_EXPIRED]
        distinguishing_aspect: |
          Pair: business_safety(age, p5) vs business_safety(document, p6) —
          same category, two different safety checks with a pinned internal
          order: age is evaluated first. A request with BOTH an underage
          member and an expired document returns ERR_MEMBER_UNDERAGE, not
          ERR_DOCUMENT_EXPIRED.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Airport + ACTIVE agreement + enrollment center."
            - "Member born 2015-01-01 (age 11 < 18) with an enrollment whose document_expiry 2026-01-01 is in the past."
