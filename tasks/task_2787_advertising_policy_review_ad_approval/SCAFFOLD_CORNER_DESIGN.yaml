              captures: { e_read: "$.data.error_id" }
            - call: "POST /ad-policy/ad-creatives/${cr_a}/withdraw"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_b}"
              captures: { e_withdraw: "$.data.error_id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_a}", headline: "B authoring for A", body_text: "Advertiser B trying to author a creative under advertiser A's account.", declared_category_codes: ["FIN_CREDIT"], target_country_codes: ["US"], landing_page_url: "https://www.harbourcellars.example/one", display_url: "https://www.harbourcellars.example/one" }
