scaffold_corner_design:
  - section: entities
    instances:
      - name: facility_create_success_returns_computed_defaults
        claim_type: creation_defaults
        grounds: [entities.Facility, endpoints."POST /fca/facilities"]
        distinguishing_aspect: "POST /fca/facilities with all required fields returns 201 with system-minted id, version 1, and computed fields initialized to zero/epoch 0."
        test_recipe:
          setup: ["Client exists"]
          setup_api_calls:
            - call: "POST /fca/clients"
              payload: { name: "Tau LLC", contact_email: "tau@tau.example" }
              as: Consultant
              captures: { client_id: "$.data.id" }
          trigger:
            - call: "POST /fca/facilities"
              payload: { client_id: "${client_id}", name: "HQ", address: "1 Plaza", gross_square_feet: 100000 }
              as: Consultant
              captures: { fac_id: "$.data.id", crv: "$.data.current_replacement_value_cents", backlog: "$.data.backlog_cost_cents", fci: "$.data.facility_condition_index", epoch: "$.data.assessment_epoch", ver: "$.data.version" }
          assert:
            - "response 201; id is a server-minted UUID"
            - "current_replacement_value_cents == 0, backlog_cost_cents == 0, facility_condition_index == 0, assessment_epoch == 0"
            - "version == 1"
      - name: facility_get_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Facility, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /fca/facilities/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Consultant
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_NOT_FOUND; http 404"
      - name: asset_system_invalid_enum_category_rejected
        claim_type: type_constraint
        grounds: [entities.AssetSystem.fields.system_category, "validations[priority=10]"]
        distinguishing_aspect: "system_category outside the declared Uniformat enum set is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Client + Facility exist"]
          setup_api_calls:
            - call: "POST /fca/clients"
              payload: { name: "Upsilon", contact_email: "u@upsilon.example" }
              as: Consultant
              captures: { client_id: "$.data.id" }
            - call: "POST /fca/facilities"
              payload: { client_id: "${client_id}", name: "F", address: "2 Rd", gross_square_feet: 1000 }
              as: Consultant
              captures: { fac_id: "$.data.id" }
          trigger:
            - call: "POST /fca/asset-systems"
              payload: { facility_id: "${fac_id}", system_category: "SOLAR_ARRAY", name: "X", install_year: 2020, design_life_years: 10, replacement_cost_cents: 1000, condition_rating: 3 }
              as: Consultant
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_INVALID_REQUEST (SOLAR_ARRAY not in the declared enum set)"
      - name: asset_system_condition_rating_out_of_range_rejected
        claim_type: type_constraint
        grounds: [entities.AssetSystem.fields.condition_rating, "validations[priority=10]"]
        distinguishing_aspect: "condition_rating 0 and 6 both violate the [1,5] range; check the upper bound 6."
        test_recipe:
          setup: ["Client + Facility exist"]
          setup_api_calls:
            - call: "POST /fca/clients"
              payload: { name: "Phi", contact_email: "p@phi.example" }
              as: Consultant
              captures: { client_id: "$.data.id" }
            - call: "POST /fca/facilities"
              payload: { client_id: "${client_id}", name: "F", address: "3 Rd", gross_square_feet: 1000 }
              as: Consultant
              captures: { fac_id: "$.data.id" }
          trigger:
            - call: "POST /fca/asset-systems"
              payload: { facility_id: "${fac_id}", system_category: "HVAC", name: "X", install_year: 2020, design_life_years: 10, replacement_cost_cents: 1000, condition_rating: 6 }
              as: Consultant
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_INVALID_REQUEST"
      - name: deficiency_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.Deficiency.fields.cost_estimate_cents, "validations[priority=10]"]
        distinguishing_aspect: "Omitting required cost_estimate_cents yields ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Facility + ACTIVE system exist"]
          setup_api_calls:
            - call: "POST /fca/clients"
              payload: { name: "Chi", contact_email: "c@chi.example" }
              as: Consultant
              captures: { client_id: "$.data.id" }
            - call: "POST /fca/facilities"
              payload: { client_id: "${client_id}", name: "F", address: "4 Rd", gross_square_feet: 1000 }
              as: Consultant
              captures: { fac_id: "$.data.id" }
            - call: "POST /fca/asset-systems"
              payload: { facility_id: "${fac_id}", system_category: "ROOF", name: "R", install_year: 2010, design_life_years: 25, replacement_cost_cents: 5000000, condition_rating: 3 }
              as: Consultant
              captures: { sys_id: "$.data.id" }
          trigger:
            - call: "POST /fca/deficiencies"
              payload: { asset_system_id: "${sys_id}", description: "x", severity: 3, urgency: 3, recommended_year: 2027 }
              as: Consultant
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_INVALID_REQUEST (missing cost_estimate_cents)"
      - name: deficiency_boolean_defaults_applied
        claim_type: defaults
        grounds: [entities.Deficiency.fields.is_code_violation, entities.Deficiency.fields.is_accessibility_violation]
        distinguishing_aspect: "Omitting both boolean flags defaults them to false; priority_score reflects no bonuses."
        test_recipe:
          setup: ["Facility + ACTIVE system exist"]
          setup_api_calls:
            - call: "POST /fca/clients"
              payload: { name: "Psi", contact_email: "p@psi.example" }
              as: Consultant
              captures: { client_id: "$.data.id" }
            - call: "POST /fca/facilities"
              payload: { client_id: "${client_id}", name: "F", address: "5 Rd", gross_square_feet: 1000 }
              as: Consultant
              captures: { fac_id: "$.data.id" }
            - call: "POST /fca/asset-systems"
              payload: { facility_id: "${fac_id}", system_category: "ROOF", name: "R", install_year: 2010, design_life_years: 25, replacement_cost_cents: 5000000, condition_rating: 3 }
              as: Consultant
              captures: { sys_id: "$.data.id" }
          trigger:
            - call: "POST /fca/deficiencies"
              payload: { asset_system_id: "${sys_id}", description: "plain", cost_estimate_cents: 1000000, severity: 4, urgency: 2, recommended_year: 2027 }
              as: Consultant
              captures: { def_id: "$.data.id", code: "$.data.is_code_violation", acc: "$.data.is_accessibility_violation", score: "$.data.priority_score" }
          assert:
            - "is_code_violation == false and is_accessibility_violation == false (defaults)"
            - "priority_score == 3.20 (0.6*4 + 0.4*2, no bonuses)"
      - name: condition_snapshot_immutable_no_update_endpoint
        claim_type: immutability
        grounds: [entities.ConditionSnapshot]
        distinguishing_aspect: "ConditionSnapshot has common_fields: false (append-only audit log); no PATCH/PUT/DELETE endpoint exists for it and no version field is exposed."
        test_recipe:
          setup: ["Facility + system + refresh cycle; one assess performed so a snapshot exists"]
          setup_api_calls:
            - call: "POST /fca/clients"
              payload: { name: "Omega", contact_email: "o@omega.example" }
              as: Consultant
              captures: { client_id: "$.data.id" }
            - call: "POST /fca/facilities"
              payload: { client_id: "${client_id}", name: "F", address: "6 Rd", gross_square_feet: 1000 }
              as: Consultant
              captures: { fac_id: "$.data.id" }
            - call: "POST /fca/asset-systems"
              payload: { facility_id: "${fac_id}", system_category: "ROOF", name: "R", install_year: 2010, design_life_years: 25, replacement_cost_cents: 5000000, condition_rating: 3 }
              as: Consultant
              captures: { sys_id: "$.data.id" }
            - call: "POST /fca/facilities/${fac_id}/refresh-cycles"
              payload: {}
              as: Consultant
            - call: "POST /fca/asset-systems/${sys_id}/assess"
              payload: { condition_rating: 2, note: "worn" }
              as: Consultant
          trigger:
            - call: "GET /fca/asset-systems/${sys_id}/condition-snapshots"
              payload: {}
              as: Consultant
              captures: { snap0: "$.data[0].id", snap0_epoch: "$.data[0].epoch" }
          assert:
            - "exactly one ConditionSnapshot exists with epoch == 1, condition_rating == 2, remaining_useful_life_years == 2 (rating-2 RUL cap: min(max(0, 25-16), 2) = 2)"
            - "snapshot rows carry id and created_at but no version field (common_fields: false)"
      - name: list_endpoints_paginate_with_envelope_fields
        claim_type: listing
        grounds: [response_envelope, endpoints."GET /fca/deficiencies"]
        distinguishing_aspect: "GET /fca/deficiencies honors limit/offset and returns total_count + has_more per the fixed envelope."
        test_recipe:
          setup: ["Facility + system with 3 deficiencies"]
          setup_api_calls:
            - call: "POST /fca/clients"
              payload: { name: "A1", contact_email: "a1@a1.example" }
              as: Consultant
              captures: { client_id: "$.data.id" }
            - call: "POST /fca/facilities"
              payload: { client_id: "${client_id}", name: "F", address: "7 Rd", gross_square_feet: 1000 }
              as: Consultant
              captures: { fac_id: "$.data.id" }
            - call: "POST /fca/asset-systems"
              payload: { facility_id: "${fac_id}", system_category: "HVAC", name: "S", install_year: 2015, design_life_years: 20, replacement_cost_cents: 50000000, condition_rating: 4 }
              as: Consultant
              captures: { sys_id: "$.data.id" }
            - call: "POST /fca/deficiencies"
              payload: { asset_system_id: "${sys_id}", description: "d1", cost_estimate_cents: 100000, severity: 1, urgency: 1, recommended_year: 2027 }
              as: Consultant
            - call: "POST /fca/deficiencies"
              payload: { asset_system_id: "${sys_id}", description: "d2", cost_estimate_cents: 200000, severity: 1, urgency: 1, recommended_year: 2027 }
              as: Consultant
            - call: "POST /fca/deficiencies"
              payload: { asset_system_id: "${sys_id}", description: "d3", cost_estimate_cents: 300000, severity: 1, urgency: 1, recommended_year: 2027 }
              as: Consultant
          trigger:
            - call: "GET /fca/deficiencies"
              payload: { asset_system_id: "${sys_id}", limit: 2, offset: 0 }
              as: Consultant
          assert:
            - "response data array length == 2"
            - "envelope exposes total_count == 3 and has_more == true"

  - section: state_machines
    instances:
      - name: capital_plan_initial_state_is_draft
        claim_type: initial_state
        grounds: [state_machines.CapitalPlan]
        distinguishing_aspect: "A newly created CapitalPlan starts in DRAFT with total_programmed_cents 0."
        test_recipe:
          setup: ["Facility exists"]
          setup_api_calls:
            - call: "POST /fca/clients"
              payload: { name: "B1", contact_email: "b1@b1.example" }
              as: Consultant
              captures: { client_id: "$.data.id" }
            - call: "POST /fca/facilities"
              payload: { client_id: "${client_id}", name: "F", address: "8 Rd", gross_square_feet: 1000 }
              as: Consultant
              captures: { fac_id: "$.data.id", fac_v: "$.data.version" }
          trigger:
            - call: "POST /fca/capital-plans"
              payload: { facility_id: "${fac_id}", title: "P", start_year: 2027, horizon_years: 5, expected_facility_version: "${fac_v}" }
              as: CapitalPlanner
              captures: { plan_id: "$.data.id", st: "$.data.status", tot: "$.data.total_programmed_cents" }
          assert:
            - "status == DRAFT and total_programmed_cents == 0"
      - name: submit_without_funded_items_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.CapitalPlan.DRAFT_to_SUBMITTED, "validations[priority=13]", "errors[ERR_PRECONDITION_UNMET]"]
        distinguishing_aspect: "Submitting a DRAFT plan with zero FUNDED line items fails with ERR_PRECONDITION_UNMET."
        test_recipe:
          setup: ["DRAFT plan P with no scenario run"]
          setup_api_calls:
            - call: "POST /fca/clients"
              payload: { name: "B2", contact_email: "b2@b2.example" }
              as: Consultant
              captures: { client_id: "$.data.id" }
            - call: "POST /fca/facilities"
              payload: { client_id: "${client_id}", name: "F", address: "9 Rd", gross_square_feet: 1000 }
              as: Consultant
              captures: { fac_id: "$.data.id", fac_v: "$.data.version" }
            - call: "POST /fca/capital-plans"
              payload: { facility_id: "${fac_id}", title: "P", start_year: 2027, horizon_years: 5, expected_facility_version: "${fac_v}" }
              as: CapitalPlanner
              captures: { plan_id: "$.data.id" }
          trigger:
            - call: "POST /fca/capital-plans/${plan_id}/submit"
              payload: {}
              as: CapitalPlanner
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_PRECONDITION_UNMET; plan remains DRAFT"
      - name: terminal_approved_plan_rejects_revise
        claim_type: terminal_state_lockdown
        grounds: [state_machines.CapitalPlan, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From terminal APPROVED, the revise trigger is not a declared transition and must fail with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Plan P fully driven to APPROVED (deficiency funded, submitted, approved by a different approver id)"]
          setup_api_calls:
            - call: "POST /fca/clients"
              payload: { name: "B3", contact_email: "b3@b3.example" }
              as: Consultant
              captures: { client_id: "$.data.id" }
            - call: "POST /fca/facilities"
              payload: { client_id: "${client_id}", name: "F", address: "10 Rd", gross_square_feet: 1000 }
              as: Consultant
              captures: { fac_id: "$.data.id", fac_v: "$.data.version" }
            - call: "POST /fca/asset-systems"
              payload: { facility_id: "${fac_id}", system_category: "HVAC", name: "S", install_year: 2010, design_life_years: 25, replacement_cost_cents: 50000000, condition_rating: 3 }
              as: Consultant
              captures: { sys_id: "$.data.id" }
            - call: "POST /fca/deficiencies"
              payload: { asset_system_id: "${sys_id}", description: "d", cost_estimate_cents: 5000000, severity: 3, urgency: 3, recommended_year: 2027 }
              as: Consultant
              captures: { def_id: "$.data.id" }
            - call: "POST /fca/capital-plans"
              payload: { facility_id: "${fac_id}", title: "P", start_year: 2027, horizon_years: 1, expected_facility_version: "${fac_v}" }
              as: CapitalPlanner
              captures: { plan_id: "$.data.id", plan_v: "$.data.version" }
            - call: "POST /fca/funding-scenarios"
              payload: { capital_plan_id: "${plan_id}", name: "S", annual_budget_cents: 10000000, escalation_rate: 0.0 }
              as: CapitalPlanner
              captures: { scen_id: "$.data.id" }
            - call: "POST /fca/funding-scenarios/${scen_id}/run"
              payload: { expected_capital_plan_version: "${plan_v}" }
              as: CapitalPlanner
            - call: "POST /fca/capital-plans/${plan_id}/submit"
              payload: {}
              as: CapitalPlanner
              as_user_id: "planner-x"
            - call: "POST /fca/capital-plans/${plan_id}/approve"
              payload: {}
              as: Approver
              as_user_id: "approver-y"
          trigger:
            - call: "POST /fca/capital-plans/${plan_id}/revise"
              payload: {}
              as: CapitalPlanner
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_INVALID_STATE (no APPROVED->DRAFT transition declared)"
      - name: refresh_cycle_close_with_unassessed_system_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.RefreshCycle.OPEN_to_CLOSED, "errors[ERR_PRECONDITION_UNMET]"]
        distinguishing_aspect: "Closing a cycle while a non-RETIRED system has last_assessed_epoch != cycle.epoch fails with ERR_PRECONDITION_UNMET."
        test_recipe:
          setup: ["Facility F with one ACTIVE system never assessed in epoch 1; cycle C1 OPEN"]
          setup_api_calls:
            - call: "POST /fca/clients"
              payload: { name: "B4", contact_email: "b4@b4.example" }
              as: Consultant
              captures: { client_id: "$.data.id" }
            - call: "POST /fca/facilities"
              payload: { client_id: "${client_id}", name: "F", address: "11 Rd", gross_square_feet: 1000 }
              as: Consultant
              captures: { fac_id: "$.data.id" }
            - call: "POST /fca/asset-systems"
              payload: { facility_id: "${fac_id}", system_category: "ROOF", name: "R", install_year: 2010, design_life_years: 25, replacement_cost_cents: 5000000, condition_rating: 3 }
              as: Consultant
              captures: { sys_id: "$.data.id" }
            - call: "POST /fca/facilities/${fac_id}/refresh-cycles"
              payload: {}
              as: Consultant
              captures: { cyc_id: "$.data.id" }
          trigger:
            - call: "POST /fca/refresh-cycles/${cyc_id}/close"
              payload: {}
              as: Consultant
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_PRECONDITION_UNMET (system last_assessed_epoch 0 != cycle epoch 1)"
      - name: refresh_cycle_close_success_advances_epoch_and_opens_next
        claim_type: side_effect_execution
        grounds: [state_machines.RefreshCycle.OPEN_to_CLOSED]
        distinguishing_aspect: "Successful close sets Facility.assessment_epoch to the closed epoch and auto-opens the next cycle with epoch+1."
        test_recipe:
          setup: ["Facility F, one ACTIVE system; cycle C1 open; system assessed in epoch 1 and assessment accepted (back to ACTIVE)"]
          setup_api_calls:
            - call: "POST /fca/clients"
              payload: { name: "B5", contact_email: "b5@b5.example" }
              as: Consultant
              captures: { client_id: "$.data.id" }
            - call: "POST /fca/facilities"
              payload: { client_id: "${client_id}", name: "F", address: "12 Rd", gross_square_feet: 1000 }
              as: Consultant
              captures: { fac_id: "$.data.id" }
            - call: "POST /fca/asset-systems"
              payload: { facility_id: "${fac_id}", system_category: "ROOF", name: "R", install_year: 2010, design_life_years: 25, replacement_cost_cents: 5000000, condition_rating: 3 }
              as: Consultant
              captures: { sys_id: "$.data.id" }
            - call: "POST /fca/facilities/${fac_id}/refresh-cycles"
              payload: {}
              as: Consultant
              captures: { cyc_id: "$.data.id" }
            - call: "POST /fca/asset-systems/${sys_id}/assess"
              payload: { condition_rating: 3 }
              as: Consultant
            - call: "POST /fca/asset-systems/${sys_id}/accept-assessment"
              payload: {}
              as: FacilityManager
          trigger:
            - call: "POST /fca/refresh-cycles/${cyc_id}/close"
              payload: {}
              as: Consultant
            - call: "GET /fca/facilities/${fac_id}"
              payload: {}
              as: Consultant
              captures: { epoch_after: "$.data.assessment_epoch" }
            - call: "GET /fca/facilities/${fac_id}/refresh-cycles"
              payload: {}
              as: Consultant
          assert:
            - "RefreshCycle.${cyc_id}.status == CLOSED"
            - "Facility.${fac_id}.assessment_epoch == 1"
            - "the facility's refresh-cycle list now contains exactly 2 rows: epochs {1 (CLOSED), 2 (OPEN)} — the epoch-2 OPEN row is the auto-opened successor"
      - name: verify_from_open_remediation_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Deficiency, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /fca/deficiencies/{id}/verify while remediation_status == OPEN violates the CORRECTED precondition and returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["OPEN deficiency"]
          setup_api_calls:
            - call: "POST /fca/clients"
              payload: { name: "B6", contact_email: "b6@b6.example" }
              as: Consultant
              captures: { client_id: "$.data.id" }
            - call: "POST /fca/facilities"
              payload: { client_id: "${client_id}", name: "F", address: "13 Rd", gross_square_feet: 1000 }
              as: Consultant
              captures: { fac_id: "$.data.id" }
            - call: "POST /fca/asset-systems"
              payload: { facility_id: "${fac_id}", system_category: "HVAC", name: "S", install_year: 2015, design_life_years: 20, replacement_cost_cents: 5000000, condition_rating: 4 }
              as: Consultant
              captures: { sys_id: "$.data.id" }
            - call: "POST /fca/deficiencies"
              payload: { asset_system_id: "${sys_id}", description: "d", cost_estimate_cents: 1000000, severity: 3, urgency: 3, recommended_year: 2027 }
              as: Consultant
              captures: { def_id: "$.data.id" }
          trigger:
            - call: "POST /fca/deficiencies/${def_id}/verify"
              payload: {}
              as: Consultant
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_INVALID_STATE"
      - name: approve_side_effect_moves_open_deficiency_to_in_progress
        claim_type: side_effect_execution
        grounds: [state_machines.CapitalPlan.SUBMITTED_to_APPROVED]
        distinguishing_aspect: "Approval cascades: each FUNDED item's Deficiency in OPEN moves to IN_PROGRESS; Facility backlog fields recompute but IN_PROGRESS stays in the backlog set."
        test_recipe:
          setup: ["Plan approved with one funded OPEN deficiency D cost 5000000 on system replacement 50000000"]
          setup_api_calls:
            - call: "POST /fca/clients"
              payload: { name: "B7", contact_email: "b7@b7.example" }
              as: Consultant
              captures: { client_id: "$.data.id" }
            - call: "POST /fca/facilities"
              payload: { client_id: "${client_id}", name: "F", address: "14 Rd", gross_square_feet: 1000 }
              as: Consultant
              captures: { fac_id: "$.data.id", fac_v: "$.data.version" }
            - call: "POST /fca/asset-systems"
              payload: { facility_id: "${fac_id}", system_category: "HVAC", name: "S", install_year: 2010, design_life_years: 25, replacement_cost_cents: 50000000, condition_rating: 3 }
              as: Consultant
              captures: { sys_id: "$.data.id" }
            - call: "POST /fca/deficiencies"
              payload: { asset_system_id: "${sys_id}", description: "d", cost_estimate_cents: 5000000, severity: 3, urgency: 3, recommended_year: 2027 }
              as: Consultant
              captures: { def_id: "$.data.id" }
            - call: "POST /fca/capital-plans"
              payload: { facility_id: "${fac_id}", title: "P", start_year: 2027, horizon_years: 1, expected_facility_version: "${fac_v}" }
              as: CapitalPlanner
              captures: { plan_id: "$.data.id", plan_v: "$.data.version" }
            - call: "POST /fca/funding-scenarios"
              payload: { capital_plan_id: "${plan_id}", name: "S", annual_budget_cents: 10000000, escalation_rate: 0.0 }
              as: CapitalPlanner
              captures: { scen_id: "$.data.id" }
            - call: "POST /fca/funding-scenarios/${scen_id}/run"
              payload: { expected_capital_plan_version: "${plan_v}" }
              as: CapitalPlanner
            - call: "POST /fca/capital-plans/${plan_id}/submit"
              payload: {}
              as: CapitalPlanner
              as_user_id: "planner-a"
          trigger:
            - call: "POST /fca/capital-plans/${plan_id}/approve"
              payload: {}
              as: Approver
              as_user_id: "approver-b"
            - call: "GET /fca/deficiencies/${def_id}"
              payload: {}
              as: Consultant
              captures: { rem: "$.data.remediation_status" }
          assert:
