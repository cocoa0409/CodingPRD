              captures: { recon_a_v: $.data.version }
            - call: "POST /reconciliations/${recon_a_id}/post"
              payload: { expected_reconciliation_version: "${recon_a_v}" }
              as: Accountant
              as_user_id: "acct-001"
            - call: "POST /reconciliations"
              payload: { lease_id: "${lease_b_id}", pool_id: "${pool_id}", recon_year: 2025 }
              as: PropertyManager
              captures: { recon_b_id: $.data.id }
            - call: "POST /reconciliations/${recon_b_id}/submit"
