scaffold_corner_design:
- section: entities
  instances:
  - name: facility_creation_applies_defaults
    claim_type: defaults
    grounds:
    - entities.Facility.fields.sir_high_threshold
    - entities.Facility.fields.hh_min_opportunities
    distinguishing_aspect: Omitting sir_high_threshold and hh_min_opportunities applies defaults 1.25 and 30; system fields id/created_at/updated_at/version are server-stamped and version starts at 1.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /api/facilities
        payload:
          name: F-Def
          nhsn_org_id: ORG-D
          clabsi_baseline_per_1000: 2.0
          cauti_baseline_per_1000: 1.5
          ssi_baseline_per_procedure: 0.25
        as: PlatformAdmin
        captures:
          fac_id: $.data.id
          fac_v: $.data.version
      assert:
      - Facility.${fac_id}.sir_high_threshold == 1.25
      - Facility.${fac_id}.hh_min_opportunities == 30
      - Facility.${fac_id}.version == 1 and id is a bare UUID without type prefix
  - name: facility_creation_missing_required_field_returns_invalid_request
    claim_type: required_fields
    grounds:
    - entities.Facility.fields.nhsn_org_id
    - validations[priority=3]
    distinguishing_aspect: Omitting required nhsn_org_id yields ERR_INVALID_REQUEST (400), not a 500 or silent default.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /api/facilities
        payload:
          name: F-X
          clabsi_baseline_per_1000: 2.0
          cauti_baseline_per_1000: 1.5
          ssi_baseline_per_procedure: 0.25
        as: PlatformAdmin
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_INVALID_REQUEST and HTTP status == 400
  - name: unit_create_with_unknown_facility_returns_not_found
    claim_type: parent_relationships
    grounds:
    - entities.Unit.fields.facility_id
    - errors[ERR_FACILITY_NOT_FOUND]
    distinguishing_aspect: Unit create referencing a non-existent facility_id fails referential existence at priority 4 with ERR_FACILITY_NOT_FOUND.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /api/units
        payload:
          facility_id: 00000000-0000-0000-0000-000000000000
          name: ICU-X
          unit_type: ICU
          nhsn_location_code: X1
        as: PlatformAdmin
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_FACILITY_NOT_FOUND and HTTP status == 404
  - name: patient_creation_seeds_unit_stay_and_posture_defaults
    claim_type: computed_fields
    grounds:
    - entities.Patient.fields.unit_stays
    - entities.Unit.fields.surveillance_posture
    distinguishing_aspect: Patient creation derives current_unit_id and a single open unit_stays entry {unit_id, admitted_at, null}; Unit creation computes surveillance_posture NORMAL.
    test_recipe:
      setup:
      - facility + unit exist
      setup_api_calls:
      - call: POST /api/facilities
        payload:
          name: F1
          nhsn_org_id: ORG-1
          clabsi_baseline_per_1000: 2.0
          cauti_baseline_per_1000: 1.5
          ssi_baseline_per_procedure: 0.25
        as: PlatformAdmin
        captures:
          fac_id: $.data.id
      - call: POST /api/units
        payload:
          facility_id: ${fac_id}
          name: ICU-P
          unit_type: ICU
          nhsn_location_code: IP1
        as: PlatformAdmin
        captures:
          unit_id: $.data.id
          unit_posture: $.data.surveillance_posture
      trigger:
      - call: POST /api/patients
        payload:
          mrn: MRN-P1
          admitted_at: '2026-08-01T08:00:00Z'
          unit_id: ${unit_id}
        as: UnitNurseManager
        captures:
          pat_id: $.data.id
      assert:
      - unit_posture == NORMAL at creation
      - Patient.${pat_id}.status == ADMITTED
      - Patient.${pat_id}.current_unit_id == ${unit_id}
      - Patient.${pat_id}.unit_stays has exactly 1 entry with arrived_at == 2026-08-01T08:00:00Z and departed_at null
  - name: infection_case_create_computes_iwp_and_unit
    claim_type: computed_fields
    grounds:
    - calculations.infection_window_period
    - entities.InfectionCase.fields.unit_id
    distinguishing_aspect: Case creation computes infection_window_start/end from the specimen date (specimen 2026-08-10 -> 2026-08-07..2026-08-13) and takes unit_id from the patient's current unit; client-supplied
      unit_id is not accepted (schema rejects unknown field with ERR_INVALID_REQUEST — see note).
    test_recipe:
      setup:
      - facility + unit + admitted patient + CENTRAL_LINE episode
      setup_api_calls:
      - call: POST /api/facilities
        payload:
          name: F1
          nhsn_org_id: ORG-1
          clabsi_baseline_per_1000: 2.0
          cauti_baseline_per_1000: 1.5
          ssi_baseline_per_procedure: 0.25
        as: PlatformAdmin
        captures:
          fac_id: $.data.id
      - call: POST /api/units
        payload:
          facility_id: ${fac_id}
          name: ICU-Q
          unit_type: ICU
          nhsn_location_code: IQ1
        as: PlatformAdmin
        captures:
          unit_id: $.data.id
      - call: POST /api/patients
        payload:
          mrn: MRN-Q1
          admitted_at: '2026-08-01T08:00:00Z'
          unit_id: ${unit_id}
        as: UnitNurseManager
        captures:
          pat_id: $.data.id
      - call: POST /api/device-episodes
        payload:
          patient_id: ${pat_id}
          device_type: CENTRAL_LINE
          placed_at: '2026-08-01T10:00:00Z'
        as: UnitNurseManager
        captures:
          ep_id: $.data.id
      trigger:
      - call: POST /api/infection-cases
        payload:
          patient_id: ${pat_id}
          case_type: CLABSI
          suspected_organism: Serratia marcescens
          first_positive_specimen_at: '2026-08-10T10:00:00Z'
          linked_device_episode_id: ${ep_id}
        as: InfectionPreventionist
        captures:
          case_id: $.data.id
      assert:
      - InfectionCase.${case_id}.status == SUSPECTED (initial state)
      - InfectionCase.${case_id}.infection_window_start == 2026-08-07T00:00:00Z
      - InfectionCase.${case_id}.infection_window_end == 2026-08-13T23:59:59Z
      - InfectionCase.${case_id}.unit_id == ${unit_id}
      - InfectionCase.${case_id}.date_of_event is null and rit_blocked_until is null
  - name: exposure_creation_seeds_baseline_due
    claim_type: computed_fields
    grounds:
    - calculations.exposure_draw_schedule
    - entities.EmployeeExposure.fields.next_draw_due_at
    distinguishing_aspect: Exposure creation at occurred 2026-08-01T10:00 yields status REPORTED and next_draw_due_at == 2026-08-04T10:00:00Z (occurred + 72h).
    test_recipe:
      setup:
      - facility + unit + employee
      setup_api_calls:
      - call: POST /api/facilities
        payload:
          name: F1
          nhsn_org_id: ORG-1
          clabsi_baseline_per_1000: 2.0
          cauti_baseline_per_1000: 1.5
          ssi_baseline_per_procedure: 0.25
        as: PlatformAdmin
        captures:
          fac_id: $.data.id
      - call: POST /api/units
        payload:
          facility_id: ${fac_id}
          name: WARD-E
          unit_type: WARD
          nhsn_location_code: WE1
        as: PlatformAdmin
        captures:
          unit_id: $.data.id
      - call: POST /api/employees
        payload:
          employee_code: EMP-1
          role_title: RN
          home_unit_id: ${unit_id}
        as: EmployeeHealthNurse
        captures:
          emp_id: $.data.id
      trigger:
      - call: POST /api/employee-exposures
        payload:
          employee_id: ${emp_id}
          exposure_type: PERCUTANEOUS
          occurred_at: '2026-08-01T10:00:00Z'
          source_hbv_status: UNKNOWN
          source_hcv_status: UNKNOWN
          source_hiv_status: UNKNOWN
        as: EmployeeHealthNurse
        captures:
          exp_id: $.data.id
      assert:
      - EmployeeExposure.${exp_id}.status == REPORTED
      - EmployeeExposure.${exp_id}.next_draw_due_at == 2026-08-04T10:00:00Z
      - EmployeeExposure.${exp_id}.current_stage_overdue == false (clock at default 2026-08-01T00:00:00Z is before the due)
      - EmployeeExposure.${exp_id}.recorded_stages == []
  - name: hand_hygiene_observation_is_immutable_event
    claim_type: immutability
    grounds:
    - entities.HandHygieneObservation
    - endpoints
    distinguishing_aspect: HandHygieneObservation has no PUT/PATCH/DELETE endpoint in §1.5 — the event log is append-only; only create + list + get exist.
    test_recipe:
      setup:
      - facility + unit
      setup_api_calls:
      - call: POST /api/facilities
        payload:
          name: F1
          nhsn_org_id: ORG-1
          clabsi_baseline_per_1000: 2.0
          cauti_baseline_per_1000: 1.5
          ssi_baseline_per_procedure: 0.25
        as: PlatformAdmin
        captures:
          fac_id: $.data.id
      - call: POST /api/units
        payload:
          facility_id: ${fac_id}
          name: WARD-H
          unit_type: WARD
          nhsn_location_code: WH1
        as: PlatformAdmin
        captures:
          unit_id: $.data.id
      trigger:
      - call: POST /api/hand-hygiene-observations
        payload:
          unit_id: ${unit_id}
          observed_at: '2026-08-03T08:00:00Z'
          opportunity_type: ASEPTIC_TASK
          action: COMPLIANT
        as: UnitNurseManager
        captures:
          obs_id: $.data.id
          obs_user: $.data.observer_user_id
      assert:
      - HandHygieneObservation.${obs_id} persists with all four input fields echoed
      - observer_user_id == the X-User-ID sent on the create call (system-stamped, input ignored)
      - no PUT/PATCH/DELETE exists for /api/hand-hygiene-observations/{id} in §1.5 (structural assert over the endpoint table)
  - name: list_endpoints_paginate_with_defaults
    claim_type: listing
    grounds:
    - response_envelope
    - endpoints
    distinguishing_aspect: 'Default pagination limit 10 / offset 0: 12 observations listed with no params return 10 items, total_count 12, has_more true; limit=5&offset=10 returns 2 items, has_more false.'
    test_recipe:
