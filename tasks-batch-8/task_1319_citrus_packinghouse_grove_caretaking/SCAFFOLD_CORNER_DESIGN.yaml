            - "Pool.${ca8_p}.provisional_price_cents_per_ge_box == 444 (round_half_up(42960/96.8); all finite channels exhausted so no projection component)"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: unauthenticated_request_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Missing X-User-Role header is priority 1: rejected before role, existence, or body checks."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
          trigger:
            - { call: "GET /packinghouse/growers/00000000-0000-0000-0000-000000000000", payload: {}, as: "", captures: { v1_err: "$.data.error_id" } }
          assert:
            - "${v1_err} == ERR_UNAUTHENTICATED (401) even though the id does not exist (auth precedes existence)"

      - name: existence_checked_before_request_shape
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=5]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "A POST to a nonexistent grove path with an ALSO-invalid body returns ERR_NOT_FOUND (existence, priority 4) rather than ERR_INVALID_REQUEST (shape, priority 5)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
          trigger:
            - { call: "POST /packinghouse/groves/00000000-0000-0000-0000-000000000000/maturity-tests", payload: {}, as: QualityInspector, as_user_id: "qi_v2", captures: { v2_err: "$.data.error_id" } }
          assert:
            - "${v2_err} == ERR_NOT_FOUND (404) despite the empty body missing every required field"

      - name: quarantine_safety_beats_maturity_temporal
        claim_type: priority_ordering
        grounds: ["validations[priority=7]", "validations[priority=11]", "errors[ERR_GROVE_QUARANTINED]", "errors[ERR_MATURITY_TEST_EXPIRED]"]
        distinguishing_aspect: "Third distinct priority pair: business_safety (quarantine, 7) beats business_temporal (expired maturity, 11) on delivery create."
        test_recipe:
          setup:
            - "Grower; grove with maturity test sampled 2026-07-26T00:00:00Z (expired 2026-07-31T00:00:00Z); pool OPEN; assignment started at clock 2026-07-30T12:00:00Z"
            - "Clock at 2026-08-01T00:00:01Z (maturity expired); grove under ACTIVE GROVE quarantine"
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-07-30T12:00:00Z" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-V3", display_name: "Safety Temporal Groves" }, as: PackinghouseAdmin, captures: { v3_g: "$.data.id" } }
            - { call: "POST /packinghouse/groves", payload: { grower_id: "${v3_g}", block_code: "B1", variety: HAMLIN, acreage: 50, county_code: "POLK" }, as: PackinghouseAdmin, captures: { v3_gr: "$.data.id", v3_gr_v: "$.data.version" } }
            - { call: "POST /packinghouse/groves/${v3_gr}/maturity-tests", payload: { sampled_at: "2026-07-26T00:00:00Z", brix: 9.0, acid_pct: 1.0, juice_pct: 45.0, expected_grove_version: "${v3_gr_v}" }, as: QualityInspector, as_user_id: "qi_v3" }
            - { call: "POST /packinghouse/pools", payload: { variety: HAMLIN, week_start: "2026-07-27" }, as: PoolAccountant }
            - { call: "POST /packinghouse/crews", payload: { crew_code: "CR-V3", daily_capacity_boxes: 400 }, as: PackinghouseAdmin, captures: { v3_c: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments", payload: { crew_id: "${v3_c}", grove_id: "${v3_gr}", window_start: "2026-07-30T06:00:00Z", window_end: "2026-08-01T06:00:00Z", planned_boxes: 50 }, as: FieldSupervisor, captures: { v3_a: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments/${v3_a}/start", payload: {}, as: FieldSupervisor }
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:01Z" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/quarantine-orders", payload: { scope_type: GROVE, grove_id: "${v3_gr}", pest_type: CANKER }, as: ComplianceOfficer, as_user_id: "co_v3" }
          trigger:
            - { call: "POST /packinghouse/deliveries", payload: { grove_id: "${v3_gr}", assignment_id: "${v3_a}", gross_boxes: 10, tare_boxes: 0 }, as: FieldSupervisor, captures: { v3_err: "$.data.error_id" } }
          assert:
            - "${v3_err} == ERR_GROVE_QUARANTINED (safety 7 beats temporal 11; NOT ERR_MATURITY_TEST_EXPIRED)"

