        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[deed-create-stale-plot]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After a first deed create advances Plot.version, a second create still carrying the old expected_plot_version is rejected with ERR_STALE_VERSION (412), before any state check."
        test_recipe:
          setup: ["An AVAILABLE plot observed at version 1; a first deed create then advances it."]
          setup_api_calls:
            - { call: "POST /cemetery-mgmt/cemeteries", payload: { name: "Oakwood" }, as: CemeteryDirector, captures: { cem_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/plots", payload: { cemetery_id: "${cem_id}", section_code: "A", row: "1", plot_number: "1", gis_lat: 1.0, gis_lng: 2.0, plot_type: "GRAVE", interment_capacity: 2 }, as: Registrar, captures: { plot_id: "$.data.id", plot_v: "$.data.version" } }
