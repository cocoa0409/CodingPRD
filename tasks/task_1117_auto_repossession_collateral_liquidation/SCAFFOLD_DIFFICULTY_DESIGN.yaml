          breach site while A4 is only reachable transitively.
        test_recipe:
          setup:
            - "Four cases all CURE_EXPIRED at 2026-05-16; one agent (max_active 10, CA-licensed) holds A1..A4 with disjoint half-open windows; A1 and A2 already BREACHED_PEACE (rolling score 50); A3 ACCEPTED, A4 still ASSIGNED"
