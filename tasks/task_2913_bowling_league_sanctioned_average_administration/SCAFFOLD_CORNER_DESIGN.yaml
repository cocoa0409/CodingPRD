      - name: corner_one_membership_per_league_and_one_live_remittance_listing
        claim_type: violation_to_error
        grounds:
          - validations[priority=38]
          - validations[priority=21]
          - errors[ERR_DUPLICATE_MEMBERSHIP]
          - errors[ERR_MEMBERSHIP_STATE_INVALID]
        distinguishing_aspect: "Priority 38 is two uniqueness clauses that fail on different rows, and the second one is only observable through a DRAFT remittance: a membership listed on an unsubmitted draft is still UNPAID (so priority 21 lets the request through) yet is already spoken for, while a membership listed on a SUBMITTED remittance is INVOICED and therefore stopped one rule earlier by priority 21. Rejecting the submitted remittance releases both gates on the same memberships."
