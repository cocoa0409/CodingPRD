          assert:
            - "HTTP 404 and ${e11_error} == \"ERR_AGREEMENT_NOT_FOUND\" — priority 4 beats priority 3 for path ids"

      - name: member_assignment_junction_resolves_from_both_parents
        claim_type: many_to_many_junction_entities_work
        grounds:
          - complexity_profile.entity_topology
