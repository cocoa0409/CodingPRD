        grounds:
          - calculations.reroute_sector_load
          - errors[ERR_SECTOR_CAPACITY_EXCEEDED]
        distinguishing_aspect: "Sector rate 1: the first assignment into the 13:00-hour bucket succeeds, the second with the same bucket is rejected (load 1 >= rate 1), but updating the flight's ETA to 14:00 rolls it into the empty 14:00 bucket and the assignment succeeds — the boundary is load >= rate, and the bucket truncates to the hour."
        test_recipe:
          setup:
            - "Sector ZDC42 base_acceptance_rate 1; ACTIVE REROUTE TMI 13:00-16:00Z; flights X1 and X2 of op_a, both ETA 13:59"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: SystemAdministrator
            - call: "POST /atfm/facilities"
              payload: { ident: "KEWR", facility_type: "AIRPORT", base_acceptance_rate: 30 }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /atfm/facilities"
              payload: { ident: "ZDC42", facility_type: "EN_ROUTE_SECTOR", base_acceptance_rate: 1 }
              as: SystemAdministrator
              captures: { zdc: $.data.id }
            - call: "POST /atfm/operators"
              payload: { name: "Alpha Air", operator_type: "SCHEDULED_CARRIER" }
              as: SystemAdministrator
              captures: { op_a: $.data.id }
            - call: "POST /atfm/operators/${op_a}/flights"
              payload: { designator: "AALX1", origin: "KORD", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:59:00Z" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { x1: $.data.id }
            - call: "POST /atfm/operators/${op_a}/flights"
              payload: { designator: "AALX2", origin: "KORD", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:59:00Z" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { x2: $.data.id, x2_v: $.data.version }
            - call: "POST /atfm/facilities/${fac}/tmis"
              payload: { tmi_type: "REROUTE", program_start: "2026-09-15T13:00:00Z", program_end: "2026-09-15T16:00:00Z" }
              as: FlowManager
              as_user_id: "fm-1"
              captures: { r1: $.data.id }
            - call: "POST /atfm/tmis/${r1}/publish"
              as: CommandCenterAdmin
              as_user_id: "cc-1"
            - call: "POST /atfm/tmis/${r1}/activate"
              as: FlowManager
          trigger:
            - call: "POST /atfm/tmis/${r1}/reroute-assignments"
              payload: { flight_id: "${x1}", via_sector_id: "${zdc}", assigned_route: "J60" }
              as: FlowManager
              captures: { ra1_bucket: $.data.hourly_bucket }
            - call: "POST /atfm/tmis/${r1}/reroute-assignments"
              payload: { flight_id: "${x2}", via_sector_id: "${zdc}", assigned_route: "J60" }
              as: FlowManager
              captures: { err: $.data.error_id }
            - call: "POST /atfm/flights/${x2}/updates"
              payload: { new_eta: "2026-09-15T14:00:00Z", expected_flight_version: "${x2_v}" }
              as: Operator
              as_user_id: "${op_a}"
            - call: "POST /atfm/tmis/${r1}/reroute-assignments"
              payload: { flight_id: "${x2}", via_sector_id: "${zdc}", assigned_route: "J64" }
              as: FlowManager
              captures: { ra2_bucket: $.data.hourly_bucket }
          assert:
            - "ra1_bucket == 2026-09-15T13:00:00Z (13:59 truncates to the 13:00 hour)"
            - "err == ERR_SECTOR_CAPACITY_EXCEEDED (second assignment: load 1 >= rate 1 — the == case rejects)"
            - "after the ETA update rolls X2 into the 14:00 bucket: ra2_bucket == 2026-09-15T14:00:00Z and the assignment succeeds (201)"

  - section: validations
    instances:
      - name: missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request without X-User-Role/X-User-ID headers fails with ERR_UNAUTHENTICATED (401) before any role, existence, or state check runs."
        test_recipe:
          setup:
            - "a facility exists (id irrelevant — auth fires first; an unknown id is used to prove ordering)"
          setup_api_calls: []
          trigger:
            - call: "GET /atfm/facilities/11111111-2222-3333-4444-555555555555"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHENTICATED with http 401 (not ERR_FACILITY_NOT_FOUND — auth precedes existence)"

      - name: program_window_in_past_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_PROGRAM_WINDOW_IN_PAST]
        distinguishing_aspect: "A GDP whose program_end precedes the logical clock is rejected at propose with ERR_PROGRAM_WINDOW_IN_PAST (422), even though start < end."
        test_recipe:
          setup:
            - "clock at 2026-09-15T12:00:00Z; facility exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: SystemAdministrator
            - call: "POST /atfm/facilities"
              payload: { ident: "KEWR", facility_type: "AIRPORT", base_acceptance_rate: 30 }
              as: SystemAdministrator
              captures: { fac: $.data.id }
          trigger:
            - call: "POST /atfm/facilities/${fac}/tmis"
              payload: { tmi_type: "GROUND_DELAY_PROGRAM", program_start: "2026-09-15T10:00:00Z", program_end: "2026-09-15T11:00:00Z", controlled_rate: 6 }
              as: FlowManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PROGRAM_WINDOW_IN_PAST with http 422 (window itself is well-formed: 10:00 < 11:00)"

      - name: invalid_window_start_not_before_end
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors[ERR_INVALID_WINDOW]
        distinguishing_aspect: "window_start == window_end is rejected with ERR_INVALID_WINDOW (422) — the window must be non-degenerate, not merely ordered."
        test_recipe:
          setup:
            - "facility exists"
          setup_api_calls:
            - call: "POST /atfm/facilities"
              payload: { ident: "KEWR", facility_type: "AIRPORT", base_acceptance_rate: 30 }
              as: SystemAdministrator
              captures: { fac: $.data.id }
          trigger:
            - call: "POST /atfm/facilities/${fac}/constraint-events"
              payload: { event_type: "WEATHER", severity: 2, window_start: "2026-09-15T14:00:00Z", window_end: "2026-09-15T14:00:00Z" }
              as: FlowManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_WINDOW with http 422"

      - name: invalid_rate_seven_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=15]
          - errors[ERR_INVALID_RATE]
        distinguishing_aspect: "GDP controlled_rate 7 is rejected with ERR_INVALID_RATE (422): 7 is in [6,60] but 3600 % 7 != 0 — the divisibility rule is what fires."
        test_recipe:
          setup:
            - "clock pinned; facility exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: SystemAdministrator
            - call: "POST /atfm/facilities"
              payload: { ident: "KEWR", facility_type: "AIRPORT", base_acceptance_rate: 30 }
              as: SystemAdministrator
              captures: { fac: $.data.id }
          trigger:
            - call: "POST /atfm/facilities/${fac}/tmis"
              payload: { tmi_type: "GROUND_DELAY_PROGRAM", program_start: "2026-09-15T13:00:00Z", program_end: "2026-09-15T15:00:00Z", controlled_rate: 7 }
              as: FlowManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_RATE with http 422"

      - name: substitution_same_flight_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=18]
          - errors[ERR_SUBSTITUTION_SAME_FLIGHT]
        distinguishing_aspect: "flight_id_1 == flight_id_2 is rejected with ERR_SUBSTITUTION_SAME_FLIGHT (422) — the same-flight sub-check fires before in-program and shift checks."
        test_recipe:
          setup:
            - "ACTIVE GDP rate 6, 13:00-15:00Z; F1 (op_a) slotted at 13:00; data fresh (clock 12:00 == last_eta_reported_at)"
