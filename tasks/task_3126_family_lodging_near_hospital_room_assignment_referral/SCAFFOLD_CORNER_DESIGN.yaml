      - name: waitlist_tie_break_waitlisted_since_then_created_at
        claim_type: ordering_tie_break
        grounds: [calculations.waitlist_ranking]
        distinguishing_aspect: "Two requests with identical verified_score are promoted in waitlisted_since order: the request created first (earlier timestamp) wins the single free room, and the later one stays WAITLISTED."
