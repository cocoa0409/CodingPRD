            - "PhoneNumber.${pn3_id}.status == AVAILABLE"
            - "NumberBlock.${blk_id}.minted_count == 3, available_count == 1, reserved_count == 2, assigned_count == 0, parked_count == 0"
            - "GET /voip/number-reservations?block_id=${blk_id}&status=HELD returns exactly 2 rows"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: second_port_request_cannot_schedule_a_slot_the_first_already_booked
        grounds:
          - state_machines.CutoverSlot.OPEN_to_BOOKED
          - validations[priority=14]
          - errors[ERR_SLOT_NOT_OPEN]
          - endpoints[POST /voip/port-requests/{id}/schedule]
        distinguishing_aspect: |
          The scheduling operation on PortRequest B is legal in every respect that can be read off
          PortRequest B itself - it is VALIDATED, the slot belongs to its own losing carrier and the
          window sits after its FOC floor - and is refused solely because a different entity, the
          CutoverSlot, was moved OPEN -> BOOKED by an unrelated PortRequest A.
        test_recipe:
          setup:
            - "clock at 2026-08-03T09:00:00Z; one STRICT carrier with foc_business_days 3 and porting_buffer_minutes 60"
            - "two port requests A and B on the same account with disjoint requested_numbers, both driven to VALIDATED by matching CSR snapshots"
            - "exactly one OPEN slot [2026-08-10T14:00Z, 2026-08-10T18:00Z) on that carrier"
            - "A schedules onto the slot, moving it OPEN -> BOOKED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/accounts"
              payload: { account_number: "ACCT0013", billing_name: "MAPLE GMBH", service_state_code: "CA", status: "ACTIVE" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /voip/carriers"
              payload: { name: "Sierra Legacy", ocn: "SL04", csr_match_policy: "STRICT", porting_buffer_minutes: 60, foc_business_days: 3 }
              as: PlatformAdmin
              captures: { car_id: $.data.id }
            - call: "POST /voip/port-requests"
              payload: { account_id: "${acct_id}", losing_carrier_id: "${car_id}", requested_numbers: ["+14155550013"], claimed_account_number: "CSR-ACC-013", claimed_pin: "1313", claimed_billing_name: "MAPLE GMBH", claimed_address_line1: "13 MAPLE ROW", claimed_zip: "94578" }
              as: PortingSpecialist
              as_user_id: "porting-1"
              captures: { pra_id: $.data.id, pra_v1: $.data.version }
            - call: "POST /voip/port-requests/${pra_id}/csr-snapshots"
              payload: { account_number_on_file: "CSR-ACC-013", pin_on_file: "1313", billing_name_on_file: "MAPLE GMBH", address_line1_on_file: "13 MAPLE ROW", zip_on_file: "94578", expected_port_request_version: "${pra_v1}" }
              as: CarrierLiaison
              as_user_id: "liaison-1"
            - call: "POST /voip/port-requests"
              payload: { account_id: "${acct_id}", losing_carrier_id: "${car_id}", requested_numbers: ["+14155550014"], claimed_account_number: "CSR-ACC-014", claimed_pin: "1414", claimed_billing_name: "MAPLE GMBH", claimed_address_line1: "13 MAPLE ROW", claimed_zip: "94578" }
              as: PortingSpecialist
              as_user_id: "porting-1"
              captures: { prb_id: $.data.id, prb_v1: $.data.version }
            - call: "POST /voip/port-requests/${prb_id}/csr-snapshots"
              payload: { account_number_on_file: "CSR-ACC-014", pin_on_file: "1414", billing_name_on_file: "MAPLE GMBH", address_line1_on_file: "13 MAPLE ROW", zip_on_file: "94578", expected_port_request_version: "${prb_v1}" }
              as: CarrierLiaison
              as_user_id: "liaison-1"
            - call: "POST /voip/cutover-slots"
              payload: { carrier_id: "${car_id}", window_start: "2026-08-10T14:00:00Z", window_end: "2026-08-10T18:00:00Z" }
              as: PortingSpecialist
              as_user_id: "porting-1"
              captures: { slot_id: $.data.id }
            - call: "POST /voip/port-requests/${pra_id}/schedule"
              payload: { cutover_slot_id: "${slot_id}" }
              as: PortingSpecialist
              as_user_id: "porting-1"
          trigger:
            - call: "POST /voip/port-requests/${prb_id}/schedule"
              payload: { cutover_slot_id: "${slot_id}" }
              as: PortingSpecialist
              as_user_id: "porting-1"
          assert:
            - "the trigger returns HTTP 409 with error_id ERR_SLOT_NOT_OPEN"
            - "the trigger does NOT return ERR_PORT_REQUEST_NOT_SCHEDULABLE, ERR_SLOT_CARRIER_MISMATCH or ERR_CUTOVER_BEFORE_FOC"
            - "PortRequest.${prb_id}.status == VALIDATED, cutover_slot_id == null and earliest_cutover_at == 2026-08-06T00:00:00Z"
            - "PortRequest.${pra_id}.status == SCHEDULED and cutover_slot_id == '${slot_id}'"
            - "CutoverSlot.${slot_id}.status == BOOKED and booked_port_request_id == '${pra_id}'"

      - name: review_unblock_refused_while_the_devices_registration_is_stale
        grounds:
          - state_machines.Device.INTL_BLOCKED_to_UNRESTRICTED
          - state_machines.E911Registration.VERIFIED_to_STALE
          - validations[priority=28]
          - errors[ERR_UNBLOCK_REVIEW_SCORE_TOO_HIGH]
          - calculations.toll_fraud_risk_score
        distinguishing_aspect: |
          The unblock is refused although the device's own DAILY_REVIEW risk score is 0 - the device
          has never placed a call attempt - because the gate also reads a second entity: the device's
          current E911Registration went VERIFIED -> STALE when the cross-jurisdiction network report
          landed, and only a VERIFIED dispatchable location satisfies priority 28. The dependency runs
          Device -> E911Registration, whereas the scheduling instance runs PortRequest -> CutoverSlot.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; ACTIVE account, one nomadic device holding a number with a VERIFIED CA registration"
            - "a CROSS_JURISDICTION network report from NV drives the registration VERIFIED -> STALE, the account COMPLIANT -> AT_RISK and the device UNRESTRICTED -> INTL_BLOCKED"
            - "no CallAttempt row is ever created, so the DAILY_REVIEW score is 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
