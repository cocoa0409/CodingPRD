    success_status: 200
    side_effects: ["-> TERMINATED; cancels every SCHEDULED or ON_HOLD visit and releases the partner's committed hours"]
  - method: POST
    path: /maintenance-visits
    roles: [ServicePartnerTech]
    input: ["pm_program_id", "serialized_asset_id", "scheduled_date", "reserved_units?"]
    output: MaintenanceVisit
    success_status: 201
    side_effects: ["reserves spare units from the partner's on-hand stock"]
  - method: GET
    path: /maintenance-visits
    roles: [ProductEngineer, ComplianceOfficer, OrderPlanner, FacilityManager, ServicePartnerTech, ServiceOpsAdmin]
    input: ["pm_program_id?", "serialized_asset_id?", "status?", "limit?", "offset?"]
    output: MaintenanceVisit[]
    success_status: 200
    side_effects: []
  - method: GET
    path: /maintenance-visits/{id}
    roles: [ProductEngineer, ComplianceOfficer, OrderPlanner, FacilityManager, ServicePartnerTech, ServiceOpsAdmin]
    input: []
    output: MaintenanceVisit
    success_status: 200
    side_effects: []
  - method: POST
    path: /maintenance-visits/{id}/complete
    roles: [ServicePartnerTech]
    input: [labor_hours]
    output: MaintenanceVisit
    success_status: 200
    side_effects: ["SCHEDULED -> COMPLETED; consumes the reserved spare units and grows the asset's service history (which lowers a later trade-in valuation)"]
  - method: POST
    path: /maintenance-visits/{id}/cancel
    roles: [ServicePartnerTech, ServiceOpsAdmin]
    input: [cancel_reason]
    output: MaintenanceVisit
    success_status: 200
    side_effects: ["SCHEDULED or ON_HOLD -> CANCELLED; releases the reserved spare units"]

  # ---- Test-driving support ------------------------------------------------
  - method: POST
    path: /_clock/set_current_utc
    roles: [ProductEngineer, ComplianceOfficer, OrderPlanner, FacilityManager, ServicePartnerTech, ServiceOpsAdmin]
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    success_status: 200
    side_effects: ["sets the logical clock that every temporal rule reads. The clock starts at 2026-08-01T00:00:00Z (a Saturday) and moves only when this endpoint is called; it never advances on its own."]

# =============================================================================
# §1.6 Error Catalog (46 codes)
# =============================================================================
errors:
  - { error_id: ERR_UNAUTHENTICATED, http_status: 401, when: "X-Role or X-User-ID header missing, empty or naming an unknown role" }
  - { error_id: ERR_ROLE_NOT_PERMITTED, http_status: 403, when: "the caller's role is not listed on the endpoint" }
  - { error_id: ERR_FACILITY_SCOPE_VIOLATION, http_status: 403, when: "a FacilityManager touches a facility, order or program that is not its own" }
  - { error_id: ERR_PARTNER_SCOPE_VIOLATION, http_status: 403, when: "a ServicePartnerTech touches an install job, program or visit belonging to another partner" }
  - { error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, when: "the ComplianceOfficer certifying or rejecting a firmware certification is the same user who submitted it" }
  - { error_id: ERR_INVALID_REQUEST, http_status: 400, when: "body or query schema violation: missing required field, wrong type, unknown enum value, out-of-range number, empty required array, duplicate array member, bad pagination" }
  - { error_id: ERR_INVALID_TIME_WINDOW, http_status: 422, when: "window_end is not strictly after window_start" }
  - { error_id: ERR_STALE_VERSION, http_status: 412, when: "the supplied expected_<parent>_version does not match the current parent version" }
  - { error_id: ERR_MODEL_NOT_FOUND, http_status: 404, when: "no EquipmentModel with the referenced id" }
  - { error_id: ERR_REVISION_NOT_FOUND, http_status: 404, when: "no ModelRevision with the referenced id" }
  - { error_id: ERR_TEST_RESOURCE_NOT_FOUND, http_status: 404, when: "no DurabilityTestRig or DurabilityTestRun with the referenced id" }
  - { error_id: ERR_FIRMWARE_NOT_FOUND, http_status: 404, when: "no FirmwareRelease or FirmwareCertification with the referenced id" }
  - { error_id: ERR_FACILITY_NOT_FOUND, http_status: 404, when: "no Facility with the referenced id (including buyer_facility_id on resale)" }
  - { error_id: ERR_ORDER_NOT_FOUND, http_status: 404, when: "no Order or OrderLine with the referenced id" }
  - { error_id: ERR_PARTNER_NOT_FOUND, http_status: 404, when: "no ServicePartner with the referenced id" }
  - { error_id: ERR_INSTALL_JOB_NOT_FOUND, http_status: 404, when: "no InstallJob with the referenced id" }
  - { error_id: ERR_ASSET_NOT_FOUND, http_status: 404, when: "no SerializedAsset with the referenced id" }
  - { error_id: ERR_SERVICE_PLAN_NOT_FOUND, http_status: 404, when: "no PMProgram or MaintenanceVisit with the referenced id" }
  - { error_id: ERR_INVALID_STATE_TRANSITION, http_status: 409, when: "the entity's current state has no such transition declared in §1.2" }
  - { error_id: ERR_ORDER_NOT_QUOTED, http_status: 409, when: "confirming an order whose billing_status is not QUOTED" }
  - { error_id: ERR_REVISION_NOT_RELEASED, http_status: 409, when: "configuring an order line against a revision that is not RELEASED" }
  - { error_id: ERR_FIRMWARE_NOT_CERTIFIED, http_status: 409, when: "releasing a connected revision without a CERTIFIED firmware certification, or loading an uncertified build onto a connected asset" }
  - { error_id: ERR_CYCLE_TARGET_NOT_MET, http_status: 422, when: "qualifying with verified_cycle_count below min_required_cycles or with a RESERVED / RUNNING run outstanding" }
  - { error_id: ERR_REWORK_LIMIT_EXCEEDED, http_status: 409, when: "a fourth rework loop is requested on the same revision" }
  - { error_id: ERR_PARTNER_TRAINING_EXPIRED, http_status: 409, when: "the partner's service-network training currency has lapsed at the current logical clock" }
  - { error_id: ERR_PARTNER_NOT_CERTIFIED_FOR_CATEGORY, http_status: 422, when: "the partner is not certified for an equipment category it is being asked to install or service" }
  - { error_id: ERR_FIRMWARE_SUPPORT_EXPIRED, http_status: 409, when: "refurbishment-certifying or reselling a connected asset whose console support horizon has passed" }
  - { error_id: ERR_SUPPORT_WINDOW_ACTIVE, http_status: 409, when: "marking a revision obsolete while its firmware support commitment is still running" }
  - { error_id: ERR_FINISH_NOT_ALLOWED, http_status: 422, when: "a requested finish code is not in the model's allowed_finish_codes" }
  - { error_id: ERR_PLATFORM_INCOMPATIBLE, http_status: 422, when: "the firmware build's console_platform does not match the model's, or the model is not connected" }
  - { error_id: ERR_DUPLICATE_CERTIFICATION, http_status: 409, when: "a SUBMITTED or CERTIFIED certification already exists for that firmware and revision pair" }
  - { error_id: ERR_DUPLICATE_REVISION_CODE, http_status: 409, when: "a uniqueness constraint is violated: revision_code within a model, or a model / rig / partner name or firmware version_string globally" }
  - { error_id: ERR_SUPERSEDE_CYCLE, http_status: 422, when: "supersedes_model_id is self-referential, closes a cycle, or exceeds SUPERSEDE_CHAIN_MAX_DEPTH" }
  - { error_id: ERR_RIG_DUTY_CLASS_UNSUPPORTED, http_status: 422, when: "the rig does not support the revision's duty class" }
  - { error_id: ERR_ASSET_NOT_COVERED, http_status: 422, when: "the visit's asset is not an IN_SERVICE asset of the program's facility" }
  - { error_id: ERR_FACILITY_SUSPENDED, http_status: 409, when: "the facility in scope is SUSPENDED" }
  - { error_id: ERR_ORDER_HAS_NO_LINES, http_status: 422, when: "quoting, confirming or scheduling an install for an order with no ACTIVE line" }
  - { error_id: ERR_INSTALL_JOB_ALREADY_OPEN, http_status: 409, when: "the order already has an install job in SCHEDULED, ON_SITE or PUNCH_LIST" }
  - { error_id: ERR_INSTALL_BLACKOUT_DAY, http_status: 422, when: "an install window touches a weekday in the facility's install_blackout_weekdays" }
  - { error_id: ERR_INSTALL_WINDOW_CONFLICT, http_status: 409, when: "the partner already has a job whose travel-buffered half-open interval intersects the requested one" }
  - { error_id: ERR_RIG_CAPACITY_EXCEEDED, http_status: 409, when: "every station of the rig is already reserved or running across the inclusive-overlap window" }
  - { error_id: ERR_PARTNER_CAPACITY_EXCEEDED, http_status: 409, when: "the requested commitment would push committed_hours past certified_hours_capacity" }
  - { error_id: ERR_INSUFFICIENT_PART_STOCK, http_status: 409, when: "the partner has fewer spare units on hand than the visit wants to reserve" }
  - { error_id: ERR_CREDIT_LIMIT_EXCEEDED, http_status: 402, when: "confirming would push the facility's open exposure past its credit limit" }
  - { error_id: ERR_INSUFFICIENT_TRADEIN_CREDIT, http_status: 402, when: "the requested trade-in credit exceeds the facility's balance or the order's outstanding total" }
  - { error_id: ERR_TRADEIN_CREDIT_ALREADY_APPLIED, http_status: 409, when: "reversing a trade-in whose credit has already been spent on an order" }

# =============================================================================
# §1.7 RBAC Table (6 roles, segregation of duties)
# =============================================================================
rbac:
  - role: ProductEngineer
    identity: opaque
    description: "Owns product development: models, revisions, durability testing and firmware builds. Cannot release, sunset or certify anything."
    exclusive_operations:
      - "POST /equipment-models"
      - "POST /model-revisions"
      - "POST /model-revisions/{id}/submit-for-testing"
      - "POST /model-revisions/{id}/rework"
      - "POST /model-revisions/{id}/qualify"
      - "POST /test-runs (+ start, complete, abort)"
      - "POST /firmware-releases"
    shared_operations:
      - "POST /test-rigs (with ServiceOpsAdmin)"
      - "POST /firmware-certifications (with ComplianceOfficer)"
      - "POST /serialized-assets/{id}/load-firmware (with ServicePartnerTech)"
      - "all engineering and catalogue reads"

  - role: ComplianceOfficer
    identity: opaque
    description: "The gatekeeper: releases qualified revisions, certifies firmware/console pairings, announces sunsets, withdraws builds and declares obsolescence. Never creates the artefacts it signs off."
    exclusive_operations:
      - "POST /model-revisions/{id}/release"
      - "POST /model-revisions/{id}/sunset"
      - "POST /model-revisions/{id}/mark-obsolete"
      - "POST /firmware-releases/{id}/withdraw"
      - "POST /firmware-certifications/{id}/certify"
      - "POST /firmware-certifications/{id}/reject"
    shared_operations:
      - "POST /firmware-certifications (with ProductEngineer)"
      - "all catalogue, asset and service reads"

  - role: OrderPlanner
    identity: opaque
    description: "Owns commercial configuration and money: orders, lines, quotes, confirmation, installation scheduling, settlement and the secondary market."
    exclusive_operations:
      - "POST /orders/{id}/quote"
      - "POST /orders/{id}/production/complete"
      - "POST /orders/{id}/apply-tradein-credit"
      - "POST /orders/{id}/settle"
      - "POST /install-jobs"
      - "POST /serialized-assets/{id}/trade-in"
      - "POST /serialized-assets/{id}/trade-in/reverse"
      - "POST /serialized-assets/{id}/resell"
    shared_operations:
      - "POST /facilities and POST /facilities/{id}/suspend (with ServiceOpsAdmin)"
      - "POST /orders, POST /orders/{id}/lines, POST /order-lines/{id}/void, POST /orders/{id}/confirm (with FacilityManager)"
      - "POST /install-jobs/{id}/abort (with ServicePartnerTech)"

  - role: FacilityManager
    identity: "entity_backed:Facility"
    description: "A gym customer. X-User-ID is the Facility.id; may configure and confirm its own orders and request a PM program, and may read only what belongs to its own facility."
    exclusive_operations: []
    shared_operations:
      - "POST /orders, POST /orders/{id}/lines, POST /order-lines/{id}/void, POST /orders/{id}/confirm (with OrderPlanner)"
      - "POST /pm-programs (with ServiceOpsAdmin)"
      - "reads of its own facility, orders, install jobs, assets, programs and visits"

  - role: ServicePartnerTech
    identity: "entity_backed:ServicePartner"
    description: "A field technician of a service-network partner. X-User-ID is the ServicePartner.id; owns on-site execution and preventive maintenance delivery for its own partner only."
    exclusive_operations:
      - "POST /install-jobs/{id}/arrive"
      - "POST /install-jobs/{id}/complete"
      - "POST /install-jobs/{id}/resolve-punch-list"
      - "POST /serialized-assets/{id}/usage-report"
      - "POST /maintenance-visits"
      - "POST /maintenance-visits/{id}/complete"
    shared_operations:
      - "POST /serialized-assets/{id}/load-firmware (with ProductEngineer)"
      - "POST /install-jobs/{id}/abort (with OrderPlanner)"
      - "POST /maintenance-visits/{id}/cancel (with ServiceOpsAdmin)"

  - role: ServiceOpsAdmin
    identity: opaque
    description: "Runs the service network: partner onboarding, parts distribution, PM program lifecycle, refurbishment intake and scrapping."
    exclusive_operations:
      - "POST /service-partners"
      - "POST /service-partners/{id}/parts-receipt"
      - "POST /pm-programs/{id}/activate"
      - "POST /pm-programs/{id}/revise"
      - "POST /pm-programs/{id}/terminate"
      - "POST /serialized-assets/{id}/refurb/intake"
      - "POST /serialized-assets/{id}/refurb/certify"
      - "POST /serialized-assets/{id}/scrap"
    shared_operations:
      - "POST /facilities and POST /facilities/{id}/suspend (with OrderPlanner)"
      - "POST /test-rigs (with ProductEngineer)"
      - "POST /pm-programs (with FacilityManager)"
      - "POST /maintenance-visits/{id}/cancel (with ServicePartnerTech)"
