  - section: cross_cutting_layers
    instances:
      - name: job_create_with_a_stale_furnace_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.job-create-stale-furnace
          - errors.ERR_STALE_FURNACE_VERSION
          - entities.Furnace.common_fields
        distinguishing_aspect: |
          The furnace version observed before the campaign create is already stale by the time the job is
          scheduled, so the first create is 412 with nothing reserved; the current version succeeds, and
          because a successful job create itself bumps the furnace the freshly-used value is stale for the
          very next create.
        test_recipe:
          setup:
            - "Furnace FUR-CC1 (300.00 tpd) observed at version 1 before any campaign existed"
            - "ACTIVE Campaign CMP-CC1 (300.00 tpd, 2026-08-01 to 2026-08-11), FLINT recipe BR-CC1, machine IS-CC1, plant-owned design BD-CC1"
          setup_api_calls:
            - call: "POST /glass-plant/furnaces"
              payload: { code: "FUR-CC1", design_pull_tpd: 300.00, refractory_life_total_units: 100000.00 }
              as: PlantManager
              captures: { f: "$.data.id", fv1: "$.data.version" }
            - call: "POST /glass-plant/campaigns"
              payload: { furnace_id: "${f}", code: "CMP-CC1", target_pull_tpd: 300.00, window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-08-11T00:00:00Z" }
              as: PlantManager
              captures: { cmp: "$.data.id" }
            - call: "POST /glass-plant/campaigns/${cmp}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /glass-plant/batch-recipes"
              payload: { furnace_id: "${f}", code: "BR-CC1", color: "FLINT", cullet_ratio_pct: 40.00, soda_ash_kg_per_ton: 180.00, colorant_kg_per_ton: 0.00 }
              as: BatchHouseTech
              captures: { br: "$.data.id" }
            - call: "POST /glass-plant/forming-machines"
              payload: { furnace_id: "${f}", code: "IS-CC1", section_count: 10, max_cavities: 40, primary_mold_family: "NNPB", changeover_buffer_minutes: 45 }
              as: PlantManager
              captures: { m: "$.data.id" }
            - call: "POST /glass-plant/customers"
              payload: { name: "Xi2 Filling", account_code: "CUST-CC1", palletization_standard: "EURO_1200x800", complaint_ppm_threshold: 5000.00 }
              as: PlantManager
              captures: { c: "$.data.id" }
            - call: "POST /glass-plant/bottle-designs"
              payload: { customer_id: "${c}", code: "BD-CC1", color: "FLINT", capacity_ml: 500.00, nominal_weight_g: 190.00, min_wall_thickness_mm: 1.80, cavity_count: 8, target_line_speed_bpm: 500.00, container_price_usd: 0.1500, mold_owner: "PLANT" }
              as: MoldEngineer
              captures: { d: "$.data.id" }
            - call: "GET /glass-plant/furnaces/${f}"
              payload: {}
              as: PlantScheduler
              captures: { fv2: "$.data.version" }
          trigger:
            - call: "POST /glass-plant/production-jobs"
              payload: { campaign_id: "${cmp}", furnace_id: "${f}", forming_machine_id: "${m}", batch_recipe_id: "${br}", bottle_design_id: "${d}", code: "PJ-CC1-A", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-08-03T00:00:00Z", planned_pull_tpd: 300.00, expected_furnace_version: "${fv1}" }
              as: PlantScheduler
          assert:
            - "HTTP 412 and data.error_id == ERR_STALE_FURNACE_VERSION"
            - "${fv1} == 1 while ${fv2} == 2 (the campaign create bumped the furnace; the activate did not)"
