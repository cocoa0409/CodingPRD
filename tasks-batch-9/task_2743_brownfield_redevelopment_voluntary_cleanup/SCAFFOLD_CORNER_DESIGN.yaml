  # ===========================================================================
  # §1.7 RBAC — the catalog names the priority 2 code ERR_FORBIDDEN_ROLE (403),
  # which is this scaffold's ERR_UNAUTHORIZED equivalent. Because priority 2
  # precedes the priority 4/5 existence checks, a forbidden-role probe needs no
  # real target row.
  # ===========================================================================
  - section: rbac
    instances:

      - name: redeveloper_exclusive_operations_return_forbidden_role_for_other_roles
        claim_type: role_boundary
        grounds:
          - roles.Redeveloper.exclusive_operations
          - validations[2].ERR_FORBIDDEN_ROLE
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Five of the Redeveloper's exclusive operations are refused with 403 ERR_FORBIDDEN_ROLE to five different impostor roles even when the path id is fabricated, because priority 2 runs before the priority 4 existence check; the same POST /sites body succeeds for the Redeveloper."
        test_recipe:
          setup:
            - "Clock 2026-08-01 with the three entity-backed parties registered."
          setup_api_calls:
            - *c_clock0
            - *c_redev
            - *c_consult
            - *c_insurer
          trigger:
            - call: "POST /sites"
              payload: { owner_party_id: "${redev_id}", site_name: "Consultant-filed parcel", county_code: "OH-035", acreage: 2.0, intended_reuse: COMMERCIAL, planned_acquisition_date: "2026-10-15" }
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
              captures: { r1a: $.data.error_id }
            - call: "POST /liability-protections"
              payload: { site_id: "ghost-site-0001" }
              as: Lender
              as_user_id: "lender-1"
              captures: { r1b: $.data.error_id }
            - call: "POST /sites/ghost-site-0001/acquisition"
              payload: { acquisition_date: "2026-10-15" }
              as: StateAgencyReviewer
              as_user_id: "reviewer-alpha"
              captures: { r1c: $.data.error_id }
            - call: "POST /vcp-enrollments"
              payload: { site_id: "ghost-site-0001", program_track: RESTRICTED_CLOSURE, applicant_statement: "Filed by the platform operator." }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { r1d: $.data.error_id }
            - call: "POST /nfa-letters"
              payload: { site_id: "ghost-site-0001", vcp_enrollment_id: "ghost-enrollment-0001", requested_scope: RESTRICTED_WITH_CONTROLS }
              as: Insurer
              as_user_id: "${insurer_id}"
              captures: { r1e: $.data.error_id }
            - *c_site
          assert:
            - "all five impostor calls return HTTP 403 with ${r1a} == ${r1b} == ${r1c} == ${r1d} == ${r1e} == 'ERR_FORBIDDEN_ROLE'"
            - "no 404 is returned even though ghost-site-0001 and ghost-enrollment-0001 do not exist — priority 2 precedes priority 4"
            - "no Site, LiabilityProtection, VcpEnrollment or NoFurtherActionLetter row is created by the refused calls"
            - "the identical POST /sites body as Redeveloper returns HTTP 201 with Site.${site_id}.owner_party_id == ${redev_id}"

      - name: consultant_exclusive_operations_return_forbidden_role_for_other_roles
        claim_type: role_boundary
        grounds:
          - roles.EnvironmentalConsultant.exclusive_operations
          - validations[2].ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "Assessment authorship, plan authorship and monitoring reporting are the consultant's alone: the Redeveloper cannot open a phase or complete the inquiry, the reviewer cannot submit a phase or PATCH a plan, and the Lender cannot schedule monitoring — while the consultant's own phase creation, finding and submit all succeed."
        test_recipe:
          setup:
            - "Clock 2026-08-01, the parties, a site and its liability protection."
          setup_api_calls:
            - *c_clock0
            - *c_redev
            - *c_consult
            - *c_insurer
            - *c_site
            - *c_prot
          trigger:
            - call: "POST /assessment-phases"
              payload: { site_id: "${site_id}", consultant_party_id: "${consult_id}", phase_type: PHASE_I, field_start_date: "2026-06-01", field_end_date: "2026-07-10", delineation_confidence: SCREENING, aai_report_date: "2026-07-20" }
              as: Redeveloper
              as_user_id: "${redev_id}"
              captures: { r2a: $.data.error_id }
            - call: "POST /liability-protections/${prot_id}/inquiry-completion"
              payload: { aai_phase_id: "ghost-phase-0001" }
              as: Redeveloper
              as_user_id: "${redev_id}"
              captures: { r2b: $.data.error_id }
            - call: "POST /assessment-phases/ghost-phase-0001/submit"
              payload: {}
              as: StateAgencyReviewer
              as_user_id: "reviewer-alpha"
              captures: { r2c: $.data.error_id }
            - call: "PATCH /remedial-action-plans/ghost-plan-0001"
              payload: { years_to_construction_start: 5 }
              as: StateAgencyReviewer
              as_user_id: "reviewer-alpha"
              captures: { r2d: $.data.error_id }
            - call: "POST /monitoring-events"
              payload: { site_id: "${site_id}", laboratory_id: "ghost-lab-0001", cleanup_goal_id: "ghost-goal-0001", event_type: SAMPLING, monitoring_period_code: "X-2027-M01", sample_date: "2027-02-05", window_start: "2027-02-01", window_end: "2027-02-10" }
              as: Lender
              as_user_id: "lender-1"
              captures: { r2e: $.data.error_id }
            - *c_p1
            - *c_p1f
            - *c_p1sub
          assert:
            - "all five impostor calls return HTTP 403 with ${r2a} == ${r2b} == ${r2c} == ${r2d} == ${r2e} == 'ERR_FORBIDDEN_ROLE'"
            - "LiabilityProtection.${prot_id}.inquiry_state is still 'AAI_PENDING' and its version is unchanged"
            - "the consultant's own POST /assessment-phases returns 201, the finding returns 201 and the submit returns 200 with AssessmentPhase.${p1_id}.status == 'UNDER_REVIEW'"
            - "GET /assessment-phases?site_id=${site_id} returns total_count == 1 — the refused Redeveloper attempt created nothing"

      - name: insurer_exclusive_operations_return_forbidden_role_for_other_roles
        claim_type: role_boundary
        grounds:
          - roles.Insurer.exclusive_operations
          - roles.Insurer.shared_operations
          - validations[2].ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "Quoting and binding the cost cap are the carrier's exclusive operations — refused to the consultant, the reviewer and the Lender — while the Insurer's shared read of GET /cost-cap-policies succeeds with the §1.0 envelope."
        test_recipe:
          setup:
            - "Clock 2026-08-01 with the three entity-backed parties registered."
          setup_api_calls:
            - *c_clock0
            - *c_redev
            - *c_consult
            - *c_insurer
          trigger:
            - call: "POST /cost-cap-policies"
              payload: { remedial_action_plan_id: "ghost-plan-0001", insurer_party_id: "${insurer_id}", policy_reference: "CCP-X", term_years: 5 }
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
              captures: { r3a: $.data.error_id }
            - call: "POST /cost-cap-policies"
              payload: { remedial_action_plan_id: "ghost-plan-0001", insurer_party_id: "${insurer_id}", policy_reference: "CCP-Y", term_years: 5 }
              as: StateAgencyReviewer
              as_user_id: "reviewer-alpha"
              captures: { r3b: $.data.error_id }
            - call: "POST /cost-cap-policies/ghost-policy-0001/bind"
              payload: {}
              as: Lender
              as_user_id: "lender-1"
              captures: { r3c: $.data.error_id }
            - call: "POST /cost-cap-policies/ghost-policy-0001/bind"
              payload: {}
              as: Redeveloper
              as_user_id: "${redev_id}"
              captures: { r3d: $.data.error_id }
            - call: "GET /cost-cap-policies"
              payload: {}
              as: Insurer
              as_user_id: "${insurer_id}"
          assert:
            - "all four impostor calls return HTTP 403 with ${r3a} == ${r3b} == ${r3c} == ${r3d} == 'ERR_FORBIDDEN_ROLE'"
            - "the Insurer's shared read returns HTTP 200 with data == [], total_count == 0, limit == 10, offset == 0 and has_more == false"
            - "no CostCapPolicy row exists after the refused quote attempts"
            - "the two refused quotes omit expected_remedial_action_plan_version entirely and still return 403 rather than 422 or 412 — priority 2 precedes both the priority 3 shape check and the priority 14 OCC check"

      - name: reviewer_exclusive_operations_return_forbidden_role_for_other_roles
        claim_type: role_boundary
        grounds:
          - roles.StateAgencyReviewer.exclusive_operations
          - validations[2].ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "Every adjudication is the agency's alone: the sweep, the phase review, obligation imposition, the eligibility decision, plan approval, the funding decision and letter issuance are all refused to the parties they affect, while the reviewer's own empty sweep succeeds."
        test_recipe:
          setup:
            - "Clock 2026-08-01 with the three entity-backed parties registered."
          setup_api_calls:
            - *c_clock0
            - *c_redev
            - *c_consult
            - *c_insurer
          trigger:
            - call: "POST /compliance-sweeps"
              payload: { as_of_date: "2026-08-01" }
              as: Redeveloper
              as_user_id: "${redev_id}"
              captures: { r4a: $.data.error_id }
            - call: "POST /assessment-phases/ghost-phase-0001/review"
