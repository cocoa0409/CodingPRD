        excluded_because:
          difficulty_instance: "boundary_precision_check / daily_credit_cap_exact_boundary"
          rationale: |
            Both threshold families already have dedicated coverage.
            daily_credit_cap_exact_boundary pins the cumulative
            DAILY_CREDIT_CAP_MINUTES=180 ceiling at cap-1, cap and cap+1 and
            shows the truncate-then-clamp order, seminar_credit_ratio_exact_threshold
            pins the instantaneous 0.75 credit ratio at the exact boundary, and
            the §1.9 validations instance
            third_ninety_minute_session_exceeds_weekly_cap demonstrates the
            window reset by re-issuing the refused 90-minute session in ISO week
            2026-W33 and getting 201. Nothing observable is left for a separate
            layer instance.

