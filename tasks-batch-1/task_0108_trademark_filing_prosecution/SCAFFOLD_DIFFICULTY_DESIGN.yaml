  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: open_application_count_conserved_file_then_abandon
        grounds:
          - state_machines.TrademarkApplication.DRAFT_to_FILED
          - state_machines.TrademarkApplication.OFFICE_ACTION_ISSUED_to_ABANDONED
          - entities.Applicant.fields.open_application_count
        distinguishing_aspect: |
          Conserved quantity 1: Applicant.open_application_count MUST equal the count of that applicant's
          applications NOT in {REGISTERED, ABANDONED}. Filing increments it (+1); abandonment via office
          -action expiry decrements it (-1); after file-then-abandon the count returns to 0 with zero
          drift.
        test_recipe:
          setup:
            - "clock 2026-01-01; class 9; Attorney; US Applicant; one USE app filed (count becomes 1), examined, FINAL OA issued; clock 2026-04-02"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Examiner
            - call: "POST /nice-classes"
              payload: { class_number: 9, title: "Software" }
              as: Examiner
              captures: { nc9: $.data.id }
            - call: "POST /attorneys"
              payload: { full_name: "A. Counsel", bar_number: "BAR-116", bar_state: "NY" }
              as: Attorney
              captures: { att_id: $.data.id }
            - call: "POST /applicants"
              payload: { legal_name: "Acme US", entity_type: "CORPORATION", country_code: "US" }
              as: Attorney
              captures: { acme_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${acme_id}", attorney_id: "${att_id}", mark_text: "CONSERVE", filing_basis: "USE", filing_tier: "TEAS_STANDARD" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/goods-services"
              payload: { nice_class_id: "${nc9}", description: "downloadable software" }
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /applications/${app_id}/file"
              payload: {}
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /applications/${app_id}/assign-examination"
              payload: {}
              as: Examiner
            - call: "POST /office-actions"
              payload: { application_id: "${app_id}", ground: "LIKELIHOOD_OF_CONFUSION", is_final: true }
              as: Examiner
              captures: { oa_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: Examiner
          trigger:
            - call: "POST /office-actions/${oa_id}/expire"
              payload: {}
              as: Examiner
          assert:
            - "Applicant.${acme_id}.open_application_count == 0"
            - "TrademarkApplication.${app_id}.status == ABANDONED"

      - name: pending_answer_deadline_conserved_institute_then_withdraw
        grounds:
          - state_machines.TTABProceeding.claim_status=PLEADED_to_claim_status=WITHDRAWN
          - entities.DocketDeadline.fields.status
          - entities.TTABProceeding.fields.claim_status
        distinguishing_aspect: |
          Conserved quantity 2 (different from a count on Applicant): the number of PENDING
          OPPOSITION_ANSWER DocketDeadline rows for a proceeding. Institution creates exactly one PENDING
          OPPOSITION_ANSWER deadline; withdrawing the proceeding cancels it (status CANCELLED), leaving
          zero PENDING OPPOSITION_ANSWER deadlines — no orphaned pending deadline drift.
        test_recipe:
          setup:
            - "clock 2026-01-01; class 9; Attorney; owner + rival; USE app published; rival institutes an opposition (PLEADED, one PENDING OPPOSITION_ANSWER deadline)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Examiner
            - call: "POST /nice-classes"
              payload: { class_number: 9, title: "Software" }
              as: Examiner
              captures: { nc9: $.data.id }
            - call: "POST /attorneys"
              payload: { full_name: "A. Counsel", bar_number: "BAR-117", bar_state: "NY" }
              as: Attorney
              captures: { att_id: $.data.id }
            - call: "POST /applicants"
              payload: { legal_name: "Owner Co", entity_type: "CORPORATION", country_code: "US" }
              as: Attorney
              captures: { owner_id: $.data.id }
            - call: "POST /applicants"
              payload: { legal_name: "Rival Co", entity_type: "CORPORATION", country_code: "US" }
              as: Attorney
              captures: { rival_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${owner_id}", attorney_id: "${att_id}", mark_text: "ANSWER", filing_basis: "USE", filing_tier: "TEAS_STANDARD" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/goods-services"
              payload: { nice_class_id: "${nc9}", description: "downloadable software" }
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /applications/${app_id}/file"
              payload: {}
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /applications/${app_id}/assign-examination"
              payload: {}
              as: Examiner
            - call: "POST /applications/${app_id}/approve-publication"
              payload: {}
              as: Examiner
            - call: "POST /ttab-proceedings"
              payload: { proceeding_type: "OPPOSITION", target_application_id: "${app_id}", petitioner_applicant_id: "${rival_id}" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { proc_id: $.data.id }
          trigger:
            - call: "POST /ttab-proceedings/${proc_id}/withdraw"
              payload: {}
              as: Applicant
              as_user_id: "${rival_id}"
          assert:
            - "TTABProceeding.${proc_id}.claim_status == WITHDRAWN"
            - "GET /docket-deadlines?subject_type=OPPOSITION_ANSWER&subject_id=${proc_id}&status=PENDING returns total_count == 0"
