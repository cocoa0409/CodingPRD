              payload: {}
              as: REVOCATION_OFFICER
              as_user_id: "u_rev_1"
            - call: "POST /ca/revocation-requests/${rev_id}/execute"
              payload: {}
              as: REVOCATION_OFFICER
              as_user_id: "u_rev_1"
              captures: { err1: $.data.error_id }
          assert:
            - "before the refund the invariant holds: Subscriber.${sub_id}.outstanding_balance_cents == 8000 == Certificate.${cert_id}.charged_amount_cents, the only certificate with refunded_at null"
            - "after the execute: Certificate.${cert_id}.revocation_status == REVOKED, lifecycle_status still PREISSUANCE, refunded_at == 2026-08-01T00:30:00Z"
            - "after the refund the invariant still holds with an empty summand set: Subscriber.${sub_id}.outstanding_balance_cents == 0"
            - "Certificate.${cert_id}.charged_amount_cents is STILL 8000 (the compensation records a refund, it does not rewrite history)"
            - "the second execute is rejected with HTTP 409 ERR_REVOCATION_REQUEST_NOT_OPEN and the balance stays 0, so the credit cannot be replayed"
            - "CertificateProfile.${prof_id}.revoked_certificate_count == 1 and pending_crl_entry_count == 1 (the CRL ledger is unaffected by the money compensation)"
      - name: dcv_reuse_count_conservation_on_authorization_invalidation
        grounds:
          - state_machines.DomainAuthorization.VALIDATED_to_PENDING
          - state_machines.CertificateRequest.READY_TO_ISSUE_to_SUBMITTED
          - entities.DomainAuthorization.fields.reuse_count
          - entities.CertificateRequest.fields.consumed_authorization_ids
          - validations[priority=75]
        distinguishing_aspect: |
          A third conserved quantity - REUSE CREDITS - conserved against a rollback rather
          than against a hand-off or a monetary refund: reuse_count must always equal the
          number of requests currently holding the authorization in
          consumed_authorization_ids. Invalidation rolls the consuming request back to
          SUBMITTED and must release exactly one credit, so the reuse budget checked by
          validations[priority=75] can neither leak nor be double-charged across a
          validate / clear / invalidate / re-validate / re-clear cycle.
        test_recipe:
          setup:
            - "An ACTIVE DV profile with max_dcv_reuse_count 2 and dcv_reuse_days 30."
            - "One VALIDATED authorization for d1.example.org (validated 2026-08-01T00:00:00Z) and one request that cleared validation against it, so reuse_count is 1."
          setup_api_calls:
            - call: "POST /ca/certificate-profiles"
              payload: { name: "dv-reuse-1", validation_type: "DV", max_validity_days: 90, dcv_reuse_days: 30, max_dcv_reuse_count: 2, org_vetting_reuse_days: 30, allowed_dcv_methods: ["DNS_TXT"], required_sct_count: 1, base_fee_cents: 8000, crl_trigger_threshold: 100, max_crl_validity_hours: 24 }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
              captures: { prof_id: $.data.id }
            - call: "POST /ca/certificate-profiles/${prof_id}/activate"
              payload: {}
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
            - call: "POST /ca/subscribers"
              payload: { legal_name: "Quebec AG", jurisdiction_code: "CH", registry_id: "CH-660123456", contact_email: "ops@quebec.example", callback_phone: "+41445550111", credit_limit_cents: 1000000 }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
              captures: { sub_id: $.data.id }
            - call: "POST /ca/domain-authorizations"
              payload: { subscriber_id: "${sub_id}", profile_id: "${prof_id}", domain_name: "d1.example.org", method: "DNS_TXT" }
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
              captures: { auth_id: $.data.id, tok1: $.data.challenge_token }
            - call: "POST /ca/domain-authorizations/${auth_id}/validate"
              payload: { challenge_token: "${tok1}" }
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
            - call: "POST /ca/certificate-requests"
              payload: { subscriber_id: "${sub_id}", profile_id: "${prof_id}", requested_domains: ["d1.example.org"], requested_validity_days: 90, csr_key_bits: 2048, expedited: false }
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
              captures: { req_id: $.data.id }
            - call: "POST /ca/certificate-requests/${req_id}/submit"
              payload: {}
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
            - call: "POST /ca/certificate-requests/${req_id}/clear-validation"
              payload: {}
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
          trigger:
            - call: "POST /ca/domain-authorizations/${auth_id}/invalidate"
              payload: { reason: "the DNS TXT record was removed by the registrant" }
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
              captures: { tok2: $.data.challenge_token }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
            - call: "POST /ca/domain-authorizations/${auth_id}/validate"
              payload: { challenge_token: "${tok2}" }
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
            - call: "POST /ca/certificate-requests/${req_id}/clear-validation"
              payload: {}
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
          assert:
            - "charged state before the trigger: DomainAuthorization.${auth_id}.reuse_count == 1 and CertificateRequest.${req_id}.consumed_authorization_ids == [${auth_id}] - exactly one holder, one credit"
            - "after invalidate: reuse_count == 0, consumed_authorization_ids == [] and CertificateRequest.${req_id}.state == SUBMITTED - the credit was released, not leaked"
            - "after invalidate the request's projected_not_before, projected_not_after, projected_charge_cents, validation_cleared_by_user_id, validation_cleared_at and blocked_reason are all null"
            - "re-validating alone leaves reuse_count == 0 (validation does not consume a credit; only clearance does)"
            - "after the second clear-validation: reuse_count == 1 again and consumed_authorization_ids == [${auth_id}] - the invariant is restored exactly, never 2"
            - "the re-derived projection uses the SECOND clearance clock: projected_not_before == 2026-08-02T00:00:00Z and projected_not_after == 2026-10-31T00:00:00Z (the first clearance had projected 2026-10-30T00:00:00Z)"
            - "DomainAuthorization.${auth_id}.expires_at == 2026-09-01T00:00:00Z and invalidation_count == 1"
            - "a third clear-validation cycle would still pass validations[priority=75] because reuse_count (1) stays strictly below max_dcv_reuse_count (2)"
