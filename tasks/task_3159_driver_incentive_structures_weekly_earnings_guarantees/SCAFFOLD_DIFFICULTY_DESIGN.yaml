# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3159_driver_incentive_structures_weekly_earnings_guarantees
#
# Nine Difficulty Rules x >=2 instances. Every instance grounds in
# SCAFFOLD.yaml §1.1–§1.7 and carries an executable setup_api_calls chain.
#
# Shared fixture conventions:
#   - Logical clock is set explicitly at the start of every chain.
#   - Guarantee week: Monday 2026-09-07T00:00:00Z .. 2026-09-14T00:00:00Z.
#   - Program windows covering that week use [2026-09-07T00:00:00Z,
#     2026-09-14T00:00:00Z) half-open.
#   - Drivers start ELIGIBLE; rolling-rate posture does not move until
#     offers_total >= 20 (MIN_OFFERS), so short ride chains keep ELIGIBLE.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: guarantee_make_up_provisional_excludes_under_review_final_includes
        grounds:
          - calculations.guarantee_make_up
          - state_machines.Ride.COMPLETED_to_UNDER_REVIEW
          - state_machines.GuaranteeSettlement.DRAFT_to_FINALIZED
          - entities.GuaranteeSettlement.fields.basis_variant
        distinguishing_aspect: |
          Same driver, same week, same ride set: the PROVISIONAL variant (DRAFT
          compute) excludes the UNDER_REVIEW ride so qualifying_ride_count (1)
          falls below guaranteed_min_rides (2) and make_up_cents == 0, while the
          FINAL variant (finalize, after the ride clears review) includes it and
          yields make_up_cents == 300000. Entity domain: GuaranteeSettlement/Ride.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; Market SFO budget 10000000 cells [cellA]."
            - "GUARANTEE program ACTIVE: guaranteed_weekly_cents=500000, guaranteed_min_rides=2, window 2026-09-07..2026-09-14."
            - "Driver enrolled; two COMPLETED STANDARD rides of 100000 base in cellA during the week; ride1 later flagged UNDER_REVIEW before compute."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /markets"
              payload: { market_code: "SFO", geo_cells: ["cellA"], incentive_budget_cents: 10000000 }
              as: PlatformAdmin
              captures: { mkt: $.data.id }
            - call: "POST /drivers"
              payload: { market_id: "${mkt}", display_name: "Dee One" }
              as: IncentiveOps
              captures: { drv: $.data.id }
            - call: "POST /incentive-programs"
              payload: { market_id: "${mkt}", program_type: "GUARANTEE", title: "G", window_start_utc: "2026-09-07T00:00:00Z", window_end_utc: "2026-09-14T00:00:00Z", stacking_class: "STACKABLE", excluded_ride_types: [], guaranteed_weekly_cents: 500000, guaranteed_min_rides: 2 }
              as: IncentiveOps
              captures: { prog: $.data.id }
            - call: "POST /incentive-programs/${prog}/activate"
              payload: {}
              as: IncentiveOps
            - call: "POST /incentive-programs/${prog}/enrollments"
              payload: { driver_id: "${drv}" }
              as: IncentiveOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rides"
              payload: { driver_id: "${drv}", market_id: "${mkt}", ride_type: "STANDARD", geo_cell_id: "cellA", base_fare_cents: 100000, tips_cents: 0 }
              as: Driver
              as_user_id: "${drv}"
              captures: { ride1: $.data.id }
            - call: "POST /rides/${ride1}/accept"
              payload: {}
              as: Driver
              as_user_id: "${drv}"
            - call: "POST /rides/${ride1}/complete"
              payload: {}
              as: Driver
              as_user_id: "${drv}"
            - call: "POST /rides"
              payload: { driver_id: "${drv}", market_id: "${mkt}", ride_type: "STANDARD", geo_cell_id: "cellA", base_fare_cents: 100000, tips_cents: 0 }
              as: Driver
              as_user_id: "${drv}"
              captures: { ride2: $.data.id }
            - call: "POST /rides/${ride2}/accept"
              payload: {}
              as: Driver
              as_user_id: "${drv}"
            - call: "POST /rides/${ride2}/complete"
              payload: {}
              as: Driver
              as_user_id: "${drv}"
            - call: "POST /rides/${ride1}/flag-review"
              payload: {}
              as: FraudAnalyst
          trigger:
            - call: "POST /settlements/compute"
              payload: { driver_id: "${drv}", program_id: "${prog}", week_start_utc: "2026-09-07T00:00:00Z" }
              as: PaymentsOfficer
              captures: { stl: $.data.id }
            - call: "POST /rides/${ride1}/clear-review"
              payload: {}
              as: FraudAnalyst
            - call: "POST /settlements/${stl}/finalize"
              payload: {}
              as: PaymentsOfficer
          assert:
            - "GuaranteeSettlement.${stl} at compute time: basis_variant == PROVISIONAL, qualifying_ride_count == 1, actual_gross_cents == 100000, make_up_cents == 0 (ride1 UNDER_REVIEW excluded; count below guaranteed_min_rides=2)"
            - "GuaranteeSettlement.${stl} after finalize: basis_variant == FINAL, qualifying_ride_count == 2, actual_gross_cents == 200000, make_up_cents == 300000"
            - "The two variants diverge on identical underlying ride data: 0 (PROVISIONAL) vs 300000 (FINAL)"

      - name: fraud_score_acute_flat_vs_chronic_decayed
        grounds:
          - calculations.fraud_score
          - state_machines.FraudFlag.OPEN_to_CONFIRMED
          - entities.Driver.fields.fraud_posture
        distinguishing_aspect: |
          Same CONFIRMED flag set on one driver produces two different scores:
          acute_score is the flat sum (12), chronic_score decays each flag's
          severity by one 4-week bucket (9). Entity domain: FraudFlag/Driver —
          distinct from the GuaranteeSettlement domain of the sibling instance.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; Market ATX; driver with one COMPLETED ride (fraud anchor)."
            - "FraudFlag F1 severity 6 CONFIRMED at week 0."
            - "Clock advanced 5 weeks (> one 4-week decay bucket); second ride + FraudFlag F2 severity 6 CONFIRMED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /markets"
              payload: { market_code: "ATX", geo_cells: ["cellA"], incentive_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { mkt: $.data.id }
            - call: "POST /drivers"
              payload: { market_id: "${mkt}", display_name: "Dee Two" }
              as: IncentiveOps
              captures: { drv: $.data.id }
            - call: "POST /rides"
              payload: { driver_id: "${drv}", market_id: "${mkt}", ride_type: "STANDARD", geo_cell_id: "cellA", base_fare_cents: 5000, tips_cents: 0 }
              as: Driver
              as_user_id: "${drv}"
              captures: { ride1: $.data.id }
            - call: "POST /rides/${ride1}/accept"
              payload: {}
              as: Driver
              as_user_id: "${drv}"
            - call: "POST /rides/${ride1}/complete"
              payload: {}
              as: Driver
              as_user_id: "${drv}"
            - call: "POST /fraud-flags"
              payload: { driver_id: "${drv}", ride_id: "${ride1}", signal_type: "INFLATED_RIDE", severity: 6 }
              as: FraudAnalyst
              captures: { f1: $.data.id }
            - call: "POST /fraud-flags/${f1}/confirm"
              payload: {}
              as: FraudAnalyst
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rides"
              payload: { driver_id: "${drv}", market_id: "${mkt}", ride_type: "STANDARD", geo_cell_id: "cellA", base_fare_cents: 5000, tips_cents: 0 }
              as: Driver
              as_user_id: "${drv}"
              captures: { ride2: $.data.id }
            - call: "POST /rides/${ride2}/accept"
              payload: {}
              as: Driver
              as_user_id: "${drv}"
            - call: "POST /rides/${ride2}/complete"
              payload: {}
              as: Driver
              as_user_id: "${drv}"
            - call: "POST /fraud-flags"
              payload: { driver_id: "${drv}", ride_id: "${ride2}", signal_type: "COLLUSION", severity: 6 }
              as: FraudAnalyst
              captures: { f2: $.data.id }
          trigger:
            - call: "POST /fraud-flags/${f2}/confirm"
              payload: {}
              as: FraudAnalyst
            - call: "GET /drivers/${drv}"
              payload: {}
              as: FraudAnalyst
          assert:
            - "FraudFlag.${f2}.acute_score == 12 (flat sum 6 + 6)"
            - "FraudFlag.${f2}.chronic_score == 9 (F1 decayed one bucket: floor(600/2)/100 = 3; F2 fresh: 6)"
            - "Driver.${drv}.fraud_posture == RESTRICTED (acute_score 12 >= RESTRICT_MIN 10) even though chronic_score 9 < 10"
            - "acute and chronic variants disagree on the same flag set: 12 != 9"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: streak_payout_zone_boost_and_budget_min
        grounds:
          - calculations.streak_payout
          - state_machines.IncentiveEnrollment.ACTIVE_to_COMPLETED
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: the streak payout
          combines streak_length gating, zone_multiplier boost (floor), EXCLUSIVE
          suppression branch, and a nested min() against market.budget_available_cents.
          With no suppression and ample budget: 5000 + floor(5000*5000/10000) = 7500.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; Market PDX budget 10000000 cells [cellA]."
            - "STREAK program ACTIVE: streak_length=2, streak_payout_cents=5000, STACKABLE, window 2026-09-07..2026-09-14."
            - "BONUS_ZONE program ACTIVE: cellA, zone_multiplier_bps=15000, capacity=10, same window."
            - "Driver enrolled in BOTH programs."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /markets"
              payload: { market_code: "PDX", geo_cells: ["cellA"], incentive_budget_cents: 10000000 }
              as: PlatformAdmin
              captures: { mkt: $.data.id }
            - call: "POST /drivers"
              payload: { market_id: "${mkt}", display_name: "Streak Sam" }
              as: IncentiveOps
              captures: { drv: $.data.id }
            - call: "POST /incentive-programs"
              payload: { market_id: "${mkt}", program_type: "STREAK", title: "S", window_start_utc: "2026-09-07T00:00:00Z", window_end_utc: "2026-09-14T00:00:00Z", stacking_class: "STACKABLE", excluded_ride_types: [], streak_length: 2, streak_payout_cents: 5000 }
              as: IncentiveOps
              captures: { prog: $.data.id }
            - call: "POST /incentive-programs/${prog}/activate"
              payload: {}
              as: IncentiveOps
            - call: "POST /incentive-programs"
              payload: { market_id: "${mkt}", program_type: "BONUS_ZONE", title: "Z", window_start_utc: "2026-09-07T00:00:00Z", window_end_utc: "2026-09-14T00:00:00Z", stacking_class: "STACKABLE", excluded_ride_types: [], geo_cell_id: "cellA", zone_multiplier_bps: 15000, capacity: 10 }
              as: IncentiveOps
              captures: { zone: $.data.id }
            - call: "POST /incentive-programs/${zone}/activate"
              payload: {}
              as: IncentiveOps
            - call: "POST /incentive-programs/${prog}/enrollments"
              payload: { driver_id: "${drv}" }
              as: IncentiveOps
              captures: { enr: $.data.id }
            - call: "POST /incentive-programs/${zone}/enrollments"
              payload: { driver_id: "${drv}" }
              as: IncentiveOps
              captures: { zenr: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rides"
              payload: { driver_id: "${drv}", market_id: "${mkt}", ride_type: "STANDARD", geo_cell_id: "cellA", base_fare_cents: 20000, tips_cents: 0 }
              as: Driver
              as_user_id: "${drv}"
              captures: { ride1: $.data.id }
            - call: "POST /rides/${ride1}/accept"
              payload: {}
              as: Driver
              as_user_id: "${drv}"
            - call: "POST /rides/${ride1}/complete"
              payload: {}
              as: Driver
              as_user_id: "${drv}"
          trigger:
            - call: "POST /rides"
              payload: { driver_id: "${drv}", market_id: "${mkt}", ride_type: "STANDARD", geo_cell_id: "cellA", base_fare_cents: 20000, tips_cents: 0 }
              as: Driver
              as_user_id: "${drv}"
              captures: { ride2: $.data.id }
            - call: "POST /rides/${ride2}/accept"
              payload: {}
              as: Driver
              as_user_id: "${drv}"
            - call: "POST /rides/${ride2}/complete"
              payload: {}
              as: Driver
              as_user_id: "${drv}"
          assert:
            - "IncentiveEnrollment.${enr}.status == COMPLETED (streak_length 2 reached)"
            - "IncentiveEnrollment.${enr}.payout_cents == 7500 (5000 base + floor(5000 * 5000 / 10000) = 2500 zone boost)"
            - "IncentiveEnrollment.${zenr}.payout_cents == 20000 (two rides x floor(20000 * 5000 / 10000) = 10000 each)"
            - "Market.${mkt}.budget_spent_cents == 27500"

      - name: zone_bonus_per_ride_floor_beats_sum_then_round
        grounds:
          - calculations.zone_bonus
          - calculations.weekly_earnings_total
          - entities.IncentiveEnrollment.fields.payout_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: three 333-cent rides at
          multiplier 15000 yield 3 * floor(333*5000/10000) = 498 with the pinned
          per-ride rounding; sum-then-round would give floor(999*5000/10000) = 499.
          The scaffold pins per-ride; 498 is the only correct answer.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; Market BOI budget 10000000 cells [cellA]."
            - "BONUS_ZONE program ACTIVE: cellA, zone_multiplier_bps=15000, capacity=10, window 2026-09-07..2026-09-14."
            - "Driver enrolled."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /markets"
              payload: { market_code: "BOI", geo_cells: ["cellA"], incentive_budget_cents: 10000000 }
              as: PlatformAdmin
              captures: { mkt: $.data.id }
            - call: "POST /drivers"
              payload: { market_id: "${mkt}", display_name: "Round Robin" }
              as: IncentiveOps
              captures: { drv: $.data.id }
            - call: "POST /incentive-programs"
              payload: { market_id: "${mkt}", program_type: "BONUS_ZONE", title: "Z", window_start_utc: "2026-09-07T00:00:00Z", window_end_utc: "2026-09-14T00:00:00Z", stacking_class: "STACKABLE", excluded_ride_types: [], geo_cell_id: "cellA", zone_multiplier_bps: 15000, capacity: 10 }
              as: IncentiveOps
              captures: { zone: $.data.id }
            - call: "POST /incentive-programs/${zone}/activate"
              payload: {}
              as: IncentiveOps
            - call: "POST /incentive-programs/${zone}/enrollments"
              payload: { driver_id: "${drv}" }
              as: IncentiveOps
              captures: { zenr: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T10:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /rides"
              payload: { driver_id: "${drv}", market_id: "${mkt}", ride_type: "STANDARD", geo_cell_id: "cellA", base_fare_cents: 333, tips_cents: 0 }
              as: Driver
              as_user_id: "${drv}"
              captures: { ride1: $.data.id }
            - call: "POST /rides/${ride1}/accept"
              payload: {}
              as: Driver
              as_user_id: "${drv}"
            - call: "POST /rides/${ride1}/complete"
              payload: {}
              as: Driver
              as_user_id: "${drv}"
            - call: "POST /rides"
              payload: { driver_id: "${drv}", market_id: "${mkt}", ride_type: "STANDARD", geo_cell_id: "cellA", base_fare_cents: 333, tips_cents: 0 }
              as: Driver
              as_user_id: "${drv}"
              captures: { ride2: $.data.id }
            - call: "POST /rides/${ride2}/accept"
              payload: {}
              as: Driver
              as_user_id: "${drv}"
            - call: "POST /rides/${ride2}/complete"
              payload: {}
              as: Driver
              as_user_id: "${drv}"
            - call: "POST /rides"
              payload: { driver_id: "${drv}", market_id: "${mkt}", ride_type: "STANDARD", geo_cell_id: "cellA", base_fare_cents: 333, tips_cents: 0 }
              as: Driver
              as_user_id: "${drv}"
              captures: { ride3: $.data.id }
            - call: "POST /rides/${ride3}/accept"
              payload: {}
              as: Driver
              as_user_id: "${drv}"
            - call: "POST /rides/${ride3}/complete"
              payload: {}
              as: Driver
              as_user_id: "${drv}"
          assert:
            - "IncentiveEnrollment.${zenr}.payout_cents == 498 (per-ride floor: 3 x 166), NOT 499 (sum-then-round)"
            - "Market.${mkt}.budget_spent_cents == 498"

      - name: cost_forecast_pinned_evaluation_order
        grounds:
          - calculations.cost_forecast
          - entities.CostForecast.fields.projected_cost_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order:
          projected cost feeds forecast headroom which gates activation which
          changes realized volume; the pinned order (1)-(4) makes the value
          well-defined at write time. STREAK: floor(1000*2000/10000)=200 incremental,
          floor(200*2500/10000)=50 cannibalized, net 150,
          floor(150/3)*5000 = 250000.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; Market TUL budget 10000000."
            - "STREAK program DRAFT: streak_length=3, streak_payout_cents=5000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /markets"
              payload: { market_code: "TUL", geo_cells: ["cellA"], incentive_budget_cents: 10000000 }
              as: PlatformAdmin
              captures: { mkt: $.data.id }
            - call: "POST /incentive-programs"
              payload: { market_id: "${mkt}", program_type: "STREAK", title: "S3", window_start_utc: "2026-09-07T00:00:00Z", window_end_utc: "2026-09-14T00:00:00Z", stacking_class: "STACKABLE", excluded_ride_types: [], streak_length: 3, streak_payout_cents: 5000 }
              as: IncentiveOps
              captures: { prog: $.data.id }
          trigger:
            - call: "POST /incentive-programs/${prog}/cost-forecasts"
              payload: { baseline_rides: 1000, lift_bps: 2000, cannibalization_bps: 2500 }
              as: IncentiveOps
              captures: { fc: $.data.id }
          assert:
            - "CostForecast.${fc}.projected_incremental_rides == 200"
            - "CostForecast.${fc}.projected_cannibalized_rides == 50"
            - "CostForecast.${fc}.projected_cost_cents == 250000 (floor(150 / 3) * 5000, order (1)-(4) pinned)"
            - "CostForecast.${fc}.forecast_revision == 1 and status == DRAFT"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: appeal_cyclic_info_rounds_then_escalate
        grounds:
          - state_machines.Appeal.UNDER_REVIEW_to_MORE_INFO
          - state_machines.Appeal.MORE_INFO_to_UNDER_REVIEW
          - state_machines.Appeal.UNDER_REVIEW_to_ESCALATED
        distinguishing_aspect: |
          Cyclic shape on Appeal: UNDER_REVIEW -> MORE_INFO -> UNDER_REVIEW loops
          exactly twice (round_count 0 -> 1 -> 2), and only then is ESCALATED
          reachable — the loop guard (round_count < 2) is part of the cycle.
        test_recipe:
          setup:
            - "Clock default; Market OKC; driver with account ACTIVE."
            - "ELIGIBILITY appeal FILED, moved to UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /markets"
              payload: { market_code: "OKC", geo_cells: ["cellA"], incentive_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { mkt: $.data.id }
            - call: "POST /drivers"
              payload: { market_id: "${mkt}", display_name: "Appeal Anne" }
              as: IncentiveOps
              captures: { drv: $.data.id }
            - call: "POST /appeals"
              payload: { driver_id: "${drv}", subject_type: "ELIGIBILITY", reason: "rate mis-measured" }
              as: Driver
              as_user_id: "${drv}"
              captures: { apl: $.data.id }
            - call: "POST /appeals/${apl}/start-review"
              payload: {}
              as: PaymentsOfficer
          trigger:
            - call: "POST /appeals/${apl}/request-info"
              payload: {}
              as: PaymentsOfficer
            - call: "POST /appeals/${apl}/provide-info"
              payload: {}
              as: Driver
              as_user_id: "${drv}"
            - call: "POST /appeals/${apl}/request-info"
              payload: {}
              as: PaymentsOfficer
            - call: "POST /appeals/${apl}/provide-info"
              payload: {}
              as: Driver
              as_user_id: "${drv}"
            - call: "POST /appeals/${apl}/escalate"
              payload: {}
              as: PaymentsOfficer
          assert:
            - "Appeal.${apl}.round_count == 2 after the two MORE_INFO -> UNDER_REVIEW cycles"
            - "Appeal.${apl}.status == ESCALATED (reachable only after round_count == 2)"
            - "A third request-info before escalate would have failed ERR_APPEAL_ROUNDS_EXHAUSTED (loop guard)"

      - name: driver_parallel_rate_and_fraud_postures_move_independently
        grounds:
          - state_machines.Driver
          - calculations.rate_posture_derivation
          - calculations.fraud_score
          - entities.Driver.fields.rate_posture
          - entities.Driver.fields.fraud_posture
        distinguishing_aspect: |
          Parallel state dimensions on Driver: rate_posture is driven INELIGIBLE
          by 20 rate events (acceptance 1500 bps) while fraud_posture stays CLEAR;
          then a CONFIRMED severity-4 flag moves fraud_posture to WATCH while
          rate_posture remains INELIGIBLE — the two dimensions never share a
          transition trigger.
        test_recipe:
          setup:
            - "Clock default; Market AMA; one driver."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /markets"
              payload: { market_code: "AMA", geo_cells: ["cellA"], incentive_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { mkt: $.data.id }
            - call: "POST /drivers"
              payload: { market_id: "${mkt}", display_name: "Parallel Pam" }
              as: IncentiveOps
              captures: { drv: $.data.id }
            - call: "POST /drivers/${drv}/rate-events"
