  - rule_id: resource_temporal_overlap
    instances:
      - name: interview_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - calculations.interview_overlap_check
          - errors[ERR_INTERVIEW_OVERLAP]
        distinguishing_aspect: |
          Half-open interval semantics on the interviewer resource: a new interview whose start
          EQUALS an existing SCHEDULED interview's end (15:00 after 14:00-15:00) is adjacent,
          not overlapping, and MUST succeed, while a strictly overlapping window (14:30-15:30)
          MUST fail with ERR_INTERVIEW_OVERLAP — contrasted with the aggregate-capacity
          semantics of cohort_overlap_aggregate_capacity_semantics.
