            - call: POST /engineered-orders/${order_id}/commissioning-jobs
              payload: { shipment_release_id: "${shipment_id}", mobilization_at: "2026-06-01T08:00:00Z", lead_field_user_id: "u-field-1" }
              as: FieldServiceEngineer
              captures: { job_id: "$.data.id" }
            - call: POST /commissioning-jobs/${job_id}/punch-list-items
              payload: { severity: "BLOCKING", description_text: "Bushing torque out of spec" }
              as: FieldServiceEngineer
          trigger:
            - call: POST /commissioning-jobs/${job_id}/punch-list-items
              payload: { severity: "MINOR", description_text: "Touch-up paint on cabinet door" }
              as: QualityEngineer
          assert:
            - "HTTP 201 with data.status == \"OPEN\", data.severity == \"MINOR\", data.reject_count == 0."
            - "GET /commissioning-jobs/${job_id} as FieldServiceEngineer shows open_punch_count == 2."
            - "The same GET shows blocking_punch_count == 1 and completion_ratio_bp == 0."
            - "GET /commissioning-jobs/${job_id}/punch-list-items?status=OPEN as PlantAdmin returns total_count == 2."

      - name: single_final_stage_shipment_release_bills_entire_net_contract_value
        claim_type: correct_result
        grounds:
          - calculations.stage_billing_allocation
          - endpoints[create_shipment_release]
          - entities.EngineeredOrder.fields.net_contract_value_cents
        distinguishing_aspect: "One stage holding all 10000 bp is the degenerate waterfall: floor(net * 10000/10000) leaves remainder 0 and the is_final_stage holder receives exactly net_contract_value_cents, with billed_to_date_cents still 0 because the stage has not shipped."
        test_recipe:
          setup:
            - "One order with contract_value_cents 4000000, no escalation accepted and no warranty credit, so net_contract_value_cents == 4000000."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
            - call: POST /engineered-orders
              payload:
                order_number: "ORD-CORNER-CA4"
                customer_name: "Riverbend Utility"
                product_family: "MV_SWITCHGEAR"
                rated_kv: 15
                contract_value_cents: 4000000
                sold_at: "2026-01-05T00:00:00Z"
                promised_ship_at: "2026-10-01T00:00:00Z"
                owning_sales_user_id: "u-sales-1"
