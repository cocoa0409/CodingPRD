          grounds: "§1.4 priority 10 (path-id 404s) and priority 11 (body-FK 404s, which lists POST /finops/allocation-runs/{id}/manual-adjustments); §1.5 the adjustment links an AllocationLine to a BusinessUnit inside a run."
          distinguishing_aspect: "The same endpoint is missed from two directions — an unknown run in the path and an unknown unit in the body — and the two produce different error ids at different priorities, after which the valid link must be visible from the run's own line listing filtered by unit."
          test_recipe:
            setup:
