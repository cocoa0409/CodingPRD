            - call: "POST /itineraries/${k_itin2}/confirm"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409, error_id == ERR_UNCONFIRMED_VISITS_REMAIN"

  # ===========================================================================
  - section: errors
    instances:
      - name: error_slot_not_open
        claim_type: violation_to_error
        grounds: [errors.ERR_SLOT_NOT_OPEN]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / aggregate_capacity_pool_consumption_distinct_from_intervals
          rationale: "Slot-state rejection paths are exercised by the capacity instance; the explicit ERR_SLOT_NOT_OPEN trigger is separately covered by endpoints.slot_hold_on_non_open_slot_rejected."

      - name: error_capacity_exhausted
        claim_type: violation_to_error
        grounds: [errors.ERR_CAPACITY_EXHAUSTED]
        excluded_because:
          difficulty_instance: boundary_precision_check / capacity_boundary_exactly_at_pool_size
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_stale_estimate_letter
        claim_type: violation_to_error
        grounds: [errors.ERR_STALE_ESTIMATE_LETTER]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / authorize_travel_depends_on_logistics_and_letter_state
          rationale: "Staleness/interpreter gating asserted in §1.8; the isolated stale-letter path is additionally covered by validations.stale_estimate_letter_blocks_authorize_travel."

  # ===========================================================================
  - section: rbac
    instances:
      - name: case_reviewer_cannot_create_referral
        claim_type: RBAC denial
        grounds: [roles.CaseReviewer, roles.IntakeCoordinator]
        distinguishing_aspect: "POST /referrals is exclusive to IntakeCoordinator; a CaseReviewer gets 403 ERR_INSUFFICIENT_PERMISSIONS."
        test_recipe:
          setup: ["Logical clock 2026-09-01."]
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /referrals"
              payload: { patient: { full_name: "X", date_of_birth: "1970-01-01", residence_country: "US", residence_state: "WI", preferred_language: "en" }, referring_physician_name: "Dr. X", referring_physician_contact: "x@x.org", reason: "r" }
              as: CaseReviewer
              as_user_id: "cr-boris"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403, error_id == ERR_INSUFFICIENT_PERMISSIONS"

      - name: financial_counselor_cannot_record_reviews
        claim_type: RBAC denial
        grounds: [roles.FinancialCounselor, roles.CaseReviewer]
        distinguishing_aspect: "POST /visit-cases/{id}/reviews is exclusive to CaseReviewer; FinancialCounselor is denied."
        test_recipe:
          setup: ["Case in INTAKE."]
          setup_api_calls:
            - *k_clock
            - *k_svc_card
            - *k_svc_neur
            - *k_ref_dom
            - *k_rec1
            - *k_rec1_verify
            - *k_ref_submit
            - *k_case_create
          trigger:
            - call: "POST /visit-cases/${k_case_id}/reviews"
              payload: { outcome: "APPROVE", notes: "fc attempt" }
              as: FinancialCounselor
              as_user_id: "fc-cora"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403, error_id == ERR_INSUFFICIENT_PERMISSIONS"

      - name: intake_coordinator_cannot_waive_deposit
        claim_type: RBAC denial
        grounds: [roles.IntakeCoordinator, roles.FinancialCounselor]
        distinguishing_aspect: "financial-clearance/waive is exclusive to FinancialCounselor; the IntakeCoordinator — who owns the rest of the case workflow — is denied, enforcing segregation across the financial boundary."
        test_recipe:
          setup: ["Case approved, clearance PENDING."]
          setup_api_calls:
            - *k_clock
            - *k_svc_card
            - *k_svc_neur
            - *k_ref_dom
            - *k_rec1
            - *k_rec1_verify
            - *k_ref_submit
            - *k_case_create
            - *k_case_approve
          trigger:
            - call: "POST /visit-cases/${k_case_id}/financial-clearance/waive"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403, error_id == ERR_INSUFFICIENT_PERMISSIONS"

      - name: logistics_coordinator_cannot_confirm_slots
        claim_type: RBAC denial
        grounds: [roles.LogisticsCoordinator]
        distinguishing_aspect: "POST /slots/{id}/confirm is exclusive to IntakeCoordinator; LogisticsCoordinator is denied even on a legitimately HELD slot."
        test_recipe:
          setup: ["One HELD slot on a cleared case."]
          setup_api_calls:
            - *k_clock
            - *k_svc_card
            - *k_svc_neur
            - *k_slot1
            - *k_ref_dom
            - *k_rec1
            - *k_rec1_verify
            - *k_ref_submit
            - *k_case_create
            - *k_case_approve
            - *k_deposit
            - *k_case_v1
            - *k_hold1
          trigger:
            - call: "POST /slots/${k_slot1}/confirm"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "lc-erin"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403, error_id == ERR_INSUFFICIENT_PERMISSIONS"

      - name: all_roles_can_read_shared_get_endpoints
        claim_type: RBAC allow
        grounds: [roles.PlatformAdmin, roles.CaseReviewer, roles.FinancialCounselor, roles.LogisticsCoordinator]
        distinguishing_aspect: "Every declared role can GET /referrals/{id} — the shared read surface is genuinely role-agnostic."
        test_recipe:
          setup: ["One referral exists."]
          setup_api_calls:
