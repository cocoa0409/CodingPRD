              payload: {league_id: "${lg_id}", name: "Cross Section Crew", home_facility_id: "${fac2_id}"}
              as: Captain
              as_user_id: "${pa1_id}"
          assert:
            - "HTTP 404"
            - "$.data.error_id == 'ERR_SECTION_SCOPE_MISMATCH'"
            - "$.data.error_id != 'ERR_FACILITY_SECTION_MISMATCH'"
            - "a follow-up GET /tennis/teams with league_id=${lg_id} returns $.data.total_count == 0"
            - "a follow-up GET /tennis/leagues/${lg_id} returns $.data.registered_team_count == 0"

  - section: state_machines
    instances:
      - name: league_created_in_draft_and_open_registration_moves_to_registration_open
        claim_type: Initial State
        grounds:
          - state_machines.League.initial_state
          - state_machines.League.DRAFT_to_REGISTRATION_OPEN
        distinguishing_aspect: "League.status is a system field with default DRAFT, and DRAFT is not merely a label: it is the only state from which open-registration is declared. This pins both halves in one observation — the row is born DRAFT with all four counters at zero, and the single declared exit writes REGISTRATION_OPEN while bumping League.version from 1 to 2 (the transition's only declared side effect)."
        test_recipe:
          setup:
            - "A Section and an opened SECTION-tier parent league exist; a DISTRICT child league has just been created and is untouched."
          setup_api_calls:
            - *c_t0
            - *a_sec
            - *a_lgp
            - *a_lgp_open
            - *a_lg
          trigger:
            - call: "POST /tennis/leagues/${lg_id}/open-registration"
              as: SectionAdmin
          assert:
            - "HTTP 200"
            - "$.data.id == ${lg_id}"
            - "$.data.status == 'REGISTRATION_OPEN'"
            - "$.data.version == 2"
            - "$.data.registered_team_count == 0"
            - "$.data.noncompliant_team_count == 0"
            - "a GET /tennis/leagues/${lg_id} issued before this trigger would have returned $.data.status == 'DRAFT' and $.data.version == 1"

      - name: league_open_registration_twice_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.League.DRAFT_to_REGISTRATION_OPEN
          - errors.ERR_INVALID_STATE
          - errors.ERR_LEAGUE_ALREADY_TERMINAL
          - validations.priority_20
          - validations.priority_23
        distinguishing_aspect: "open-registration is not idempotent: replaying it must fail rather than return the same 200. Two rules cover the replay — priority 20 (no declared transition from REGISTRATION_OPEN) and priority 23 (lifecycle endpoint does not match the current stage) — and the ordered list makes 20 the winner, so the observable is ERR_INVALID_STATE and the version must not advance a second time."
        test_recipe:
          setup:
            - "The DISTRICT league has already been taken from DRAFT to REGISTRATION_OPEN once."
          setup_api_calls:
            - *c_t0
            - *a_sec
            - *a_lgp
            - *a_lgp_open
            - *a_lg
            - *a_lg_open
          trigger:
            - call: "POST /tennis/leagues/${lg_id}/open-registration"
              as: SectionAdmin
          assert:
            - "HTTP 409"
            - "$.data.error_id == 'ERR_INVALID_STATE'"
            - "$.data.error_id != 'ERR_LEAGUE_ALREADY_TERMINAL'"
            - "a follow-up GET /tennis/leagues/${lg_id} returns $.data.status == 'REGISTRATION_OPEN' and $.data.version == 2"

      - name: team_register_with_only_one_active_spot_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Team.DRAFT_to_REGISTERED
          - errors.ERR_INVALID_STATE
          - validations.priority_20
        distinguishing_aspect: "The DRAFT -> REGISTERED edge carries four preconditions, and `active_roster_size >= 2` is the only one with no dedicated error code in §1.6 — it must therefore surface as the generic priority-20 ERR_INVALID_STATE, and specifically NOT as ERR_ROSTER_QUOTA_NOT_MET (which §1.4 scopes to lock-rosters and start-play only). The pending second spot must not be counted toward the two."
        test_recipe:
          setup:
            - "A DISTRICT league in REGISTRATION_OPEN with a DRAFT team holding one ACTIVE spot and one PENDING spot, inside the registration window (current_utc 2026-08-01, window [2026-08-01, 2026-08-10))."
          setup_api_calls:
            - *c_t0
            - *a_sec
            - *a_fac
            - *a_lgp
            - *a_lgp_open
            - *a_lg
            - *a_lg_open
            - *a_pa1
            - *a_pa2
            - *a_ra1
            - *a_ra2
            - *a_tma
            - *a_xa1
            - *a_ya1
            - *a_gta2
            - *a_xa2
          trigger:
            - call: "POST /tennis/teams/${tma_id}/register"
              as: Captain
              as_user_id: "${pa1_id}"
          assert:
            - "HTTP 409"
            - "$.data.error_id == 'ERR_INVALID_STATE'"
            - "$.data.error_id != 'ERR_ROSTER_QUOTA_NOT_MET'"
            - "$.data.error_id != 'ERR_OUTSIDE_REGISTRATION_WINDOW'"
            - "a follow-up GET /tennis/teams/${tma_id} returns $.data.status == 'DRAFT' and $.data.active_roster_size == 1"
            - "a follow-up GET /tennis/leagues/${lg_id} returns $.data.registered_team_count == 0"

      - name: team_register_with_two_active_spots_moves_to_registered_and_bumps_league_counter
        claim_type: Valid Transition
        grounds:
          - state_machines.Team.DRAFT_to_REGISTERED
          - calculations.league_standings_ledger_invariant
        distinguishing_aspect: "Registration is a cross-entity write: the edge must move Team.status AND recompute League.registered_team_count AND bump BOTH versions in the same request. The scaffold declares registered_team_count over five team statuses, so a single REGISTERED team must lift it to exactly 1 while noncompliant_team_count stays 0 (that counter only sees ROSTER_LOCKED and IN_PLAY teams)."
        test_recipe:
          setup:
            - "The team from the previous instance, with its second spot now activated so active_roster_size is 2 and roster_compliant is true against min_active_roster_size 2."
          setup_api_calls:
            - *c_t0
            - *a_sec
            - *a_fac
            - *a_lgp
            - *a_lgp_open
            - *a_lg
            - *a_lg_open
            - *a_pa1
            - *a_pa2
            - *a_ra1
            - *a_ra2
            - *a_tma
            - *a_xa1
            - *a_ya1
            - *a_gta2
            - *a_xa2
