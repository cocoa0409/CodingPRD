              as: OrderClerk
              captures: { oid: $.data.id }
            # Deliberately skip adding lines so order is empty
          trigger:
            - call: "POST /tenants/${tid}/orders/${oid}/submit"
              payload: {}
              as: OrderClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ONBOARDING_INCOMPLETE"
            - "HTTP status == 409"
            - "Order.${oid}.status == DRAFT"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: block_threshold_at_exactly_100k
        grounds:
          - calculations.order_block_threshold
          - errors[ERR_BLOCKED_EXPOSURE_AT_LIMIT]
          - entities.Customer.fields.blocked_exposure_cents
        distinguishing_aspect: |
          >= boundary on a cents metric: customer.blocked_exposure_cents == 10,000,000
          (exactly $100,000.00) MUST block ship; == 9,999,999 ($99,999.99) MUST
          allow. Reached through POST /orders/{id}/ship.
        test_recipe:
          setup:
            - "Tenant, CA jurisdiction, RESALE reason"
            - "Customer C1 onboarded"
            - "Order O1 with line value exactly $100,000.00 exempt-claimed, submitted -> HELD_FOR_CERT with uncovered=10_000_000; blocked_exposure_cents=10_000_000"
            - "Force O1 to READY_TO_SHIP via cert approval, then revoke cert and re-approve so O1 returns to READY_TO_SHIP; simpler: instead create O2 with line 1 cent, gets HELD_FOR_CERT at blocked=1; then add cert covering CA so O1 (the big one) returns to READY_TO_SHIP — but blocked_exposure drops. To land exactly at boundary we engineer a state where customer.blocked_exposure_cents=10_000_000 AND order is in READY_TO_SHIP. Path: create O_big with line 10_000_000 (exempt), submit (HELD, blocked=10_000_000). Create a cert for a DIFFERENT state TX (so O_big stays HELD). Approve cert TX. Then create O_small with line 1 in TX exempt, submit -> READY_TO_SHIP (TX cert covers it). blocked_exposure is still 10_000_000 from O_big. Attempt ship O_small -> ERR_BLOCKED_EXPOSURE_AT_LIMIT."
          setup_api_calls:
            - call: "POST /tenants"
              payload: { legal_name: "T1 Inc", home_state_code: "NY" }
              as: TenantAdmin
              captures: { tid: $.data.id }
            - call: "POST /tenants/${tid}/jurisdiction_rules"
              payload: { state_code: "CA", accepted_form_types: ["RESALE"], validity_window_days: 0, anchor_rule: "EFFECTIVE_DATE", allows_drop_ship_resale: false, requires_state_registration_number: false, blanket_cert_allowed: false }
              as: TenantAdmin
            - call: "POST /tenants/${tid}/jurisdiction_rules"
              payload: { state_code: "TX", accepted_form_types: ["RESALE"], validity_window_days: 0, anchor_rule: "EFFECTIVE_DATE", allows_drop_ship_resale: false, requires_state_registration_number: false, blanket_cert_allowed: false }
              as: TenantAdmin
            - call: "POST /tenants/${tid}/exemption_reasons"
              payload: { code: "RES", description: "Resale", tax_engine_code: "R", requires_certificate: true, allowed_form_types: ["RESALE"] }
              as: TenantAdmin
            - call: "POST /tenants/${tid}/customers"
              payload: { external_ref: "C1", legal_name: "Cust 1", primary_ship_to_state: "CA", exemption_reason_code: "RES" }
              as: ComplianceOfficer
              captures: { cid: $.data.id, cv0: $.data.version }
            - call: "POST /tenants/${tid}/customers/${cid}/complete_onboarding"
              payload: {}
              as: ComplianceOfficer
              captures: { cv1: $.data.version }
            - call: "POST /tenants/${tid}/customers/${cid}/orders"
              payload: { order_ref: "O_big", ship_to_state: "CA", exemption_reason_code: "RES" }
              as: OrderClerk
              captures: { oid_big: $.data.id }
            - call: "POST /tenants/${tid}/orders/${oid_big}/lines"
              payload: { sku: "BIG", quantity: 1, unit_price_cents: 10000000, is_exempt_claimed: true }
              as: OrderClerk
            - call: "POST /tenants/${tid}/orders/${oid_big}/submit"
              payload: {}
              as: OrderClerk
            # Create TX cert so small TX order can be READY_TO_SHIP
            - call: "POST /tenants/${tid}/customers/${cid}/certificates"
              payload: { ship_to_state: "TX", form_type: "RESALE", exemption_reason_code: "RES", state_registration_number: "", signed_date: "2026-01-01", effective_date: "2026-01-01" }
              as: ComplianceOfficer
              as_user_id: "u_co1"
              captures: { cert_tx: $.data.id }
            - call: "POST /tenants/${tid}/certificates/${cert_tx}/versions"
              payload: { file_uri: "s3://tx.pdf", form_type: "RESALE", signed_date: "2026-01-01", effective_date: "2026-01-01" }
              as: ComplianceOfficer
              as_user_id: "u_co1"
            - call: "POST /tenants/${tid}/certificates/${cert_tx}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_co1"
            - call: "POST /tenants/${tid}/certificates/${cert_tx}/begin_review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_co2"
            - call: "GET /tenants/${tid}/customers/${cid}"
              payload: {}
              as: ComplianceOfficer
              captures: { cv2: $.data.version }
            - call: "POST /tenants/${tid}/certificates/${cert_tx}/approve"
              payload: { expected_customer_version: "${cv2}" }
              as: ComplianceOfficer
              as_user_id: "u_co2"
            - call: "POST /tenants/${tid}/customers/${cid}/orders"
              payload: { order_ref: "O_small", ship_to_state: "TX", exemption_reason_code: "RES" }
              as: OrderClerk
              captures: { oid_small: $.data.id }
            - call: "POST /tenants/${tid}/orders/${oid_small}/lines"
              payload: { sku: "SMALL", quantity: 1, unit_price_cents: 1, is_exempt_claimed: true }
              as: OrderClerk
            - call: "POST /tenants/${tid}/orders/${oid_small}/submit"
              payload: {}
              as: OrderClerk
              captures: { small_status: $.data.status }
          trigger:
            - call: "POST /tenants/${tid}/orders/${oid_small}/ship"
              payload: {}
              as: FulfillmentClerk
              captures: { err: $.data.error_id }
          assert:
            - "small_status == READY_TO_SHIP"
            - "err == ERR_BLOCKED_EXPOSURE_AT_LIMIT"
            - "HTTP status == 409"
            - "Order.${oid_small}.status == READY_TO_SHIP (unchanged)"

      - name: outreach_empty_candidate_set
        grounds:
          - calculations.outreach_send_schedule
          - entities.OutreachCampaign.fields.sent_count
        distinguishing_aspect: |
          Empty-set boundary on a count metric: an outreach campaign whose filter
          matches zero candidate certs MUST emit zero OutreachNotice rows and
          still transition SENDING->DONE (not error, not skip). Different metric
          (count vs cents) and different endpoint (advance_day vs ship) than
          instance 1.
        test_recipe:
          setup:
            - "Tenant, CA jurisdiction with validity_window_days=365"
