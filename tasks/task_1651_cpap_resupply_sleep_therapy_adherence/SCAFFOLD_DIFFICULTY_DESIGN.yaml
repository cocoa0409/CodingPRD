            - "approve on 2026-09-01 rejected: ${window_err} == 'ERR_EXCHANGE_WINDOW_EXPIRED'   # window closed at 2026-08-31 inclusive"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap: ≥2 instances with DIFFERENT interval
  # semantics on DIFFERENT resources
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: component_resupply_half_open_cadence_window
        grounds:
          - calculations.cadence_eligibility_per_component
          - validations[priority=8]
          - entities.ComponentSupplyPlan.fields.next_eligible_on
        distinguishing_aspect: |
          Interval semantics = half-open [last_dispensed_on, next_eligible_on)
          on resource ComponentSupplyPlan. A second dispense is rejected while
          current_date < next_eligible_on (the interval is still occupied) and
          permitted when current_date >= next_eligible_on. Adjacency at exactly
          next_eligible_on is NOT a collision (inclusive start of the new window).
        test_recipe:
          setup:
            - "PayerPolicy p1 with mask_cadence_days=90; Patient pat15 PURCHASE setup complete 2026-08-01"
            - "First MASK dispensed 2026-08-01 -> plan occupies [2026-08-01, 2026-10-30)"
          setup_api_calls:
            - call: "POST /sleep-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /sleep-therapy/payer-policies"
              payload: { payer_name: "Payer A", plan_code: "PAYER-A", compliance_threshold_pct: 70, compliance_min_hours_per_night: 4.0, compliance_window_days: 30, compliance_min_nights: 21, rental_months_to_own: 3, mask_cadence_days: 90, cushion_cadence_days: 30, filter_cadence_days: 14, tubing_cadence_days: 90, mask_exchange_window_days: 30, max_exchanges_per_window: 1, requires_prior_auth: false }
              as: OpsAdmin
