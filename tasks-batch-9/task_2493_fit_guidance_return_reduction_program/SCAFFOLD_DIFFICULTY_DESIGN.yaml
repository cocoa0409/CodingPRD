          - entities.ReturnCostPosting.fields.amount_cents
          - entities.CatalogItem.fields.return_cost_accrued_cents
        distinguishing_aspect: |
          Mode (b) - pinned rounding order: five cost components are each round_half_up'ed to
          whole cents and only then summed, so total_cost_cents == 2489, whereas summing the
