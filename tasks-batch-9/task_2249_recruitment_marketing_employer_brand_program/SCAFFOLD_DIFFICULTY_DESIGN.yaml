          assert:
            - "Before the trigger: Channel.${ch1_id}.credited_qualified_bp == 10000, blended_target_cents == 15000, cpqa_cents == 0, pacing_status == ON_TARGET, active_flight_count == 1; MediaFlight.${flight_id}.state == ACTIVE and reserved_cents == 360500"
            - "Trigger call 1 returns 200: Channel.${ch1_id}.cpqa_cents == 18000, which is exactly round_half_up(15000 * 12 / 10) == 18000, so pacing_status is still ON_TARGET"
            - "After trigger call 1: MediaFlight.${flight_id}.state == ACTIVE, spent_cents == 18000, reserved_cents == 360500, release_reason == null; Program.${program_id}.committed_budget_cents == 360500"
            - "Trigger call 2 returns 200: Channel.${ch1_id}.cpqa_cents == 18001 > 18000, pacing_status == THROTTLED"
            - "After trigger call 2: MediaFlight.${flight_id}.state == PAUSED_PACING, release_reason == PACING_THROTTLE, reserved_cents == 0, spent_cents == 18001"
            - "Exactly one RELEASE BudgetLedgerEntry (bucket FAMILY_DEDICATED, delta_cents -360500) exists, Program.${program_id}.committed_budget_cents == 0 and JobFamily.${family_id}.reserved_cents == 0"
            - "Channel.${ch1_id}.active_flight_count == 0 with pacing_status THROTTLED and idle_since null - THROTTLED outranks IDLE inside the same request"

  # =========================================================================
  # Rule 7 - cross_entity_state_dependency
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: posting_publish_requires_approved_persona_of_its_own_job_family
        grounds:
          - validations[priority=28].ERR_NO_APPROVED_PERSONA
          - state_machines.JobPosting.OPTIMIZED_to_PUBLISHED
          - state_machines.CandidatePersona.IN_REVIEW_to_APPROVED
          - entities.CandidatePersona.fields.state
          - entities.CandidatePersona.fields.job_family_id
        distinguishing_aspect: |
          JobPosting cannot advance on the strength of its own fields alone: publication depends on
          the state of a different entity, CandidatePersona, and the dependency is scoped by
          job_family_id. The fixture keeps an APPROVED persona on a sibling family and an
          IN_REVIEW persona on the posting's own family, so an implementation that checks "some
          approved persona exists" passes where it must fail. Approving the own-family persona -
          touching nothing on the posting - is what makes the identical publish call succeed.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "One Program with two JobFamilies: SWE (the posting's family) and SALES."
            - "SALES owns an APPROVED persona; SWE owns a persona that is only IN_REVIEW (submitted, not yet reviewed)."
            - "One JobPosting of SWE, content_status OPTIMIZED with optimization_score 100 and compliance_status CLEARED, so every other publish precondition already holds."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026, attribution_model: "LINEAR" }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${program_id}", name: "Software Engineering", code: "SWE", cpqa_target_cents: 15000, dedicated_budget_cents: 0, priority_rank: 1 }
              as: BrandProgramLead
              captures: { swe_id: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${program_id}", name: "Enterprise Sales", code: "SALES", cpqa_target_cents: 22000, dedicated_budget_cents: 0, priority_rank: 2 }
              as: BrandProgramLead
              captures: { sales_id: $.data.id }
            - call: "POST /channels"
              payload: { program_id: "${program_id}", name: "Board A", channel_type: "JOB_BOARD", daily_capacity_cents: 100000, min_flight_days: 1 }
              as: BrandProgramLead
              captures: { ch1_id: $.data.id }
            - call: "POST /candidate-personas"
              payload: { job_family_id: "${sales_id}", name: "Enterprise AE", mix_method: "SURVEY_WEIGHTED", research_window_days: 180 }
              as: PersonaResearcher
              as_user_id: "u-res-1"
              captures: { sales_persona_id: $.data.id }
            - call: "POST /channel-preference-signals"
              payload: { persona_id: "${sales_persona_id}", channel_id: "${ch1_id}", preference_score: 60, sample_size: 400, engagement_events: 50, collected_at: "2026-07-20T00:00:00Z" }
              as: PersonaResearcher
              as_user_id: "u-res-1"
            - call: "POST /candidate-personas/${sales_persona_id}/submit"
              as: PersonaResearcher
              as_user_id: "u-res-1"
            - call: "POST /candidate-personas/${sales_persona_id}/review"
              payload: { decision: "APPROVE", review_note: "sales research approved" }
              as: BrandProgramLead
              as_user_id: "u-lead-1"
            - call: "POST /candidate-personas"
              payload: { job_family_id: "${swe_id}", name: "Backend IC", mix_method: "SURVEY_WEIGHTED", research_window_days: 180 }
              as: PersonaResearcher
              as_user_id: "u-res-1"
              captures: { swe_persona_id: $.data.id }
            - call: "POST /channel-preference-signals"
              payload: { persona_id: "${swe_persona_id}", channel_id: "${ch1_id}", preference_score: 70, sample_size: 400, engagement_events: 100, collected_at: "2026-07-20T00:00:00Z" }
              as: PersonaResearcher
              as_user_id: "u-res-1"
            - call: "POST /candidate-personas/${swe_persona_id}/submit"
              as: PersonaResearcher
              as_user_id: "u-res-1"
            - call: "POST /job-postings"
              payload: { job_family_id: "${swe_id}", title: "Senior Backend Engineer", responsibility_count: 6, benefit_count: 5, pay_range_min_cents: 12000000, pay_range_max_cents: 18000000, eeo_statement_included: true, superlative_claim_included: false }
              as: BrandProgramLead
              captures: { posting_id: $.data.id, posting_version: $.data.version }
            - call: "POST /job-postings/${posting_id}/optimize"
              payload: { expected_posting_version: "${posting_version}" }
              as: BrandProgramLead
              as_user_id: "u-lead-1"
            - call: "POST /job-postings/${posting_id}/compliance-review"
              payload: { decision: "CLEAR", note: "clean" }
              as: ComplianceReviewer
              as_user_id: "u-comp-1"
          trigger:
            - call: "POST /job-postings/${posting_id}/publish"
              as: BrandProgramLead
              as_user_id: "u-lead-1"
            - call: "POST /candidate-personas/${swe_persona_id}/review"
              payload: { decision: "APPROVE", review_note: "engineering research approved" }
              as: BrandProgramLead
              as_user_id: "u-lead-1"
            - call: "POST /job-postings/${posting_id}/publish"
              as: BrandProgramLead
              as_user_id: "u-lead-1"
          assert:
            - "Trigger call 1 returns 409 with error_id ERR_NO_APPROVED_PERSONA even though CandidatePersona.${sales_persona_id} is APPROVED - it belongs to a different job_family_id"
            - "After trigger call 1: JobPosting.${posting_id}.content_status is still OPTIMIZED and its version is unchanged"
            - "Trigger call 2 returns 200 with CandidatePersona.${swe_persona_id}.state == APPROVED and reviewed_by_user_id == u-lead-1"
            - "Trigger call 3 returns 200 with JobPosting.${posting_id}.content_status == PUBLISHED, compliance_status == CLEARED and suspended_reason == null"
            - "Nothing on the posting changed between the failed and the successful publish - only the state of a foreign entity did"
            - "A subsequent POST /candidate-personas/${swe_persona_id}/retire returns 409 ERR_PERSONA_IN_USE, the mirror-image dependency: the persona cannot leave APPROVED while it is the only approved persona of a family with a PUBLISHED posting"

      - name: flight_activation_requires_its_posting_to_be_published
        grounds:
          - validations[priority=31].ERR_POSTING_NOT_PUBLISHED
          - state_machines.MediaFlight.RESERVED_to_ACTIVE
          - state_machines.JobPosting.OPTIMIZED_to_PUBLISHED
          - entities.MediaFlight.fields.job_posting_id
          - entities.Channel.fields.active_flight_count
        distinguishing_aspect: |
          A different entity pair - MediaFlight depends on JobPosting - and a different direction of
          travel: money may be reserved against a posting that is merely OPTIMIZED, but it may not
          start delivering until the posting reaches PUBLISHED. The reservation therefore exists
          with committed budget while activation is refused, and the identical activate call
          succeeds after the posting alone moves, which also proves the compliance clearance
          (priority 25) was already satisfied and is not what is blocking.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Program with all pools 0 and no EmployerReview rows, so brand_health_score is 100.00 and the priority-27 gate passes."
            - "JobFamily SWE with dedicated_budget_cents 500000 and an APPROVED persona."
            - "One JobPosting of SWE that is OPTIMIZED (score 100) and CLEARED but deliberately not published."
            - "One MediaFlight on Board A over 2026-08-01 -> 2026-08-08 at 50000 per day, state RESERVED with reserved_cents 360500."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026, attribution_model: "LINEAR", pool_job_board_cents: 0, pool_social_cents: 0, pool_programmatic_cents: 0, flex_reserve_cents: 0 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${program_id}", name: "Software Engineering", code: "SWE", cpqa_target_cents: 15000, dedicated_budget_cents: 500000, priority_rank: 1 }
              as: BrandProgramLead
              captures: { family_id: $.data.id }
            - call: "POST /channels"
              payload: { program_id: "${program_id}", name: "Board A", channel_type: "JOB_BOARD", daily_capacity_cents: 100000, min_flight_days: 1 }
              as: BrandProgramLead
              captures: { ch1_id: $.data.id }
            - call: "POST /candidate-personas"
              payload: { job_family_id: "${family_id}", name: "Backend IC", mix_method: "SURVEY_WEIGHTED", research_window_days: 180 }
              as: PersonaResearcher
              as_user_id: "u-res-1"
              captures: { persona_id: $.data.id }
            - call: "POST /channel-preference-signals"
              payload: { persona_id: "${persona_id}", channel_id: "${ch1_id}", preference_score: 70, sample_size: 400, engagement_events: 100, collected_at: "2026-07-20T00:00:00Z" }
              as: PersonaResearcher
              as_user_id: "u-res-1"
            - call: "POST /candidate-personas/${persona_id}/submit"
              as: PersonaResearcher
              as_user_id: "u-res-1"
            - call: "POST /candidate-personas/${persona_id}/review"
              payload: { decision: "APPROVE", review_note: "approved" }
              as: BrandProgramLead
              as_user_id: "u-lead-1"
            - call: "POST /job-postings"
              payload: { job_family_id: "${family_id}", title: "Senior Backend Engineer", responsibility_count: 6, benefit_count: 5, pay_range_min_cents: 12000000, pay_range_max_cents: 18000000, eeo_statement_included: true, superlative_claim_included: false }
              as: BrandProgramLead
              captures: { posting_id: $.data.id, posting_version: $.data.version }
            - call: "POST /job-postings/${posting_id}/optimize"
              payload: { expected_posting_version: "${posting_version}" }
              as: BrandProgramLead
              as_user_id: "u-lead-1"
            - call: "POST /job-postings/${posting_id}/compliance-review"
              payload: { decision: "CLEAR", note: "clean" }
              as: ComplianceReviewer
              as_user_id: "u-comp-1"
            - call: "GET /programs/${program_id}"
              as: MediaBuyer
              captures: { program_version: $.data.version }
            - call: "POST /media-flights"
              payload: { channel_id: "${ch1_id}", job_family_id: "${family_id}", job_posting_id: "${posting_id}", start_date: "2026-08-01", end_date: "2026-08-08", daily_cap_cents: 50000, expected_program_version: "${program_version}" }
              as: MediaBuyer
              captures: { flight_id: $.data.id }
          trigger:
            - call: "POST /media-flights/${flight_id}/activate"
              as: MediaBuyer
            - call: "POST /job-postings/${posting_id}/publish"
              as: BrandProgramLead
              as_user_id: "u-lead-1"
            - call: "POST /media-flights/${flight_id}/activate"
              as: MediaBuyer
          assert:
            - "Trigger call 1 returns 409 with error_id ERR_POSTING_NOT_PUBLISHED, not ERR_POSTING_COMPLIANCE_NOT_CLEARED - the posting is already CLEARED"
            - "After trigger call 1: MediaFlight.${flight_id}.state == RESERVED, activated_at == null, reserved_cents == 360500; Channel.${ch1_id}.active_flight_count == 0 and Program.${program_id}.committed_budget_cents == 360500"
            - "Trigger call 2 returns 200 with JobPosting.${posting_id}.content_status == PUBLISHED"
            - "Trigger call 3 returns 200: MediaFlight.${flight_id}.state == ACTIVE and activated_at == 2026-08-01T00:00:00Z"
            - "Channel.${ch1_id}.active_flight_count == 1, idle_since == null, credited_qualified_bp == 0 so pacing_status == PACING_UNKNOWN and blended_target_cents == null"
            - "Program.${program_id}.committed_budget_cents is still 360500 - activation moves no money"

  # =========================================================================
  # Rule 8 - resource_temporal_overlap
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: flight_windows_are_half_open_so_touching_is_legal_and_one_day_back_is_not
        grounds:
          - validations[priority=40].ERR_FLIGHT_WINDOW_OVERLAP
          - validations[priority=47].ERR_CHANNEL_DAILY_CAPACITY_EXCEEDED
          - state_machines.MediaFlight.null_to_RESERVED
          - entities.MediaFlight.fields.start_date
          - entities.MediaFlight.fields.end_date
        distinguishing_aspect: |
          The contended resource is a (Channel, JobFamily) pair booked over date ranges with
          half-open [start_date, end_date) semantics: Flight B starting exactly on Flight A's
          end_date is accepted because the intervals touch without intersecting, while Flight C
          starting one day earlier intersects A by a single day and is refused. C also busts the
          channel's daily capacity, so the priority-40 temporal error must surface rather than the
          priority-47 fiscal one. A closed-interval implementation rejects B; an inclusive-capacity-first
          implementation returns the wrong error for C.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Program with all pools 0; JobFamily SWE with dedicated_budget_cents 1000000 (enough for two flights of 360500)."
            - "Channel Board A (JOB_BOARD) with daily_capacity_cents 100000 and min_flight_days 1."
            - "One OPTIMIZED, CLEARED JobPosting of SWE (flights may be reserved before publication)."
            - "Flight A reserved over 2026-08-01 -> 2026-08-08 at daily_cap_cents 50000."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026, attribution_model: "LINEAR", pool_job_board_cents: 0, pool_social_cents: 0, pool_programmatic_cents: 0, flex_reserve_cents: 0 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${program_id}", name: "Software Engineering", code: "SWE", cpqa_target_cents: 15000, dedicated_budget_cents: 1000000, priority_rank: 1 }
              as: BrandProgramLead
              captures: { family_id: $.data.id }
            - call: "POST /channels"
              payload: { program_id: "${program_id}", name: "Board A", channel_type: "JOB_BOARD", daily_capacity_cents: 100000, min_flight_days: 1 }
              as: BrandProgramLead
              captures: { ch1_id: $.data.id }
            - call: "POST /job-postings"
              payload: { job_family_id: "${family_id}", title: "Senior Backend Engineer", responsibility_count: 6, benefit_count: 5, pay_range_min_cents: 12000000, pay_range_max_cents: 18000000, eeo_statement_included: true, superlative_claim_included: false }
              as: BrandProgramLead
              captures: { posting_id: $.data.id, posting_version: $.data.version }
            - call: "POST /job-postings/${posting_id}/optimize"
              payload: { expected_posting_version: "${posting_version}" }
              as: BrandProgramLead
              as_user_id: "u-lead-1"
            - call: "GET /programs/${program_id}"
              as: MediaBuyer
              captures: { pv1: $.data.version }
            - call: "POST /media-flights"
              payload: { channel_id: "${ch1_id}", job_family_id: "${family_id}", job_posting_id: "${posting_id}", start_date: "2026-08-01", end_date: "2026-08-08", daily_cap_cents: 50000, expected_program_version: "${pv1}" }
              as: MediaBuyer
              captures: { flight_a_id: $.data.id }
            - call: "GET /programs/${program_id}"
              as: MediaBuyer
              captures: { pv2: $.data.version }
          trigger:
            - call: "POST /media-flights"
              payload: { channel_id: "${ch1_id}", job_family_id: "${family_id}", job_posting_id: "${posting_id}", start_date: "2026-08-08", end_date: "2026-08-15", daily_cap_cents: 50000, expected_program_version: "${pv2}" }
              as: MediaBuyer
              captures: { flight_b_id: $.data.id }
            - call: "GET /programs/${program_id}"
              as: MediaBuyer
              captures: { pv3: $.data.version }
            - call: "POST /media-flights"
              payload: { channel_id: "${ch1_id}", job_family_id: "${family_id}", job_posting_id: "${posting_id}", start_date: "2026-08-07", end_date: "2026-08-14", daily_cap_cents: 50000, expected_program_version: "${pv3}" }
              as: MediaBuyer
          assert:
            - "Trigger call 1 returns 201 - [2026-08-08, 2026-08-15) only touches [2026-08-01, 2026-08-08) and does not intersect it"
            - "MediaFlight.${flight_b_id}.flight_days == 7, total_cost_cents == 360500, state == RESERVED"
            - "Program.${program_id}.committed_budget_cents == 721000 and JobFamily.${family_id}.reserved_cents == 721000 after trigger call 1"
            - "Trigger call 3 returns 409 with error_id ERR_FLIGHT_WINDOW_OVERLAP - [2026-08-07, 2026-08-14) intersects Flight A on 2026-08-07 and Flight B from 2026-08-08"
            - "Trigger call 3 does not return ERR_CHANNEL_DAILY_CAPACITY_EXCEEDED even though 50000 + 50000 + 50000 exceeds daily_capacity_cents 100000 - priority 40 precedes priority 47"
            - "No third MediaFlight row was created, Program.${program_id}.committed_budget_cents is still 721000 and Program.version was not incremented by the rejected call"
            - "A fourth flight for the same window on a different job_family_id would pass the priority-40 check, because the contended resource is the (channel_id, job_family_id) pair"

      - name: event_buffer_is_a_closed_interval_gap_of_exactly_48_hours_per_job_family
        grounds:
          - validations[priority=41].ERR_EVENT_BUFFER_CONFLICT
          - state_machines.EventPresence.PLANNED_to_CONFIRMED
          - entities.EventPresence.fields.start_at
          - entities.EventPresence.fields.end_at
          - entities.EventPresence.fields.job_family_id
          - calculations.media_budget_waterfall
        distinguishing_aspect: |
          A different resource - the recruiter team of one job family - contended over
          closed intervals [start_at, end_at] with a 48-hour separation requirement, measured
          between interval ends rather than by intersection. A gap of exactly 48 hours is legal
          and a gap of 47 hours 59 minutes is not, so the boundary is inclusive here while the
          flight-window rule of the sibling instance is exclusive. Only CONFIRMED and COMPLETED
          presences occupy the resource, so a cancelled presence frees it, and a presence of a
          different job family may sit inside the buffer.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Program with flex_reserve_cents 0; JobFamily SWE with dedicated_budget_cents 1000000 and JobFamily SALES with dedicated_budget_cents 500000."
            - "Presence A for SWE at venue CAMPUS-A over [2026-08-10T09:00:00Z, 2026-08-10T17:00:00Z], booth_cost_cents 200000, already CONFIRMED."
            - "Presence B for SWE at CAMPUS-B over [2026-08-12T17:00:00Z, 2026-08-13T01:00:00Z] - its start is exactly 48 hours after A's end."
            - "Presence C for SWE at CAMPUS-C over [2026-08-12T16:59:00Z, 2026-08-13T00:59:00Z] - one minute short of the buffer."
            - "Presence E for SALES at CAMPUS-A over [2026-08-10T12:00:00Z, 2026-08-10T20:00:00Z], overlapping A but on another job family."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026, attribution_model: "LINEAR", pool_job_board_cents: 0, pool_social_cents: 0, pool_programmatic_cents: 0, flex_reserve_cents: 0 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${program_id}", name: "Software Engineering", code: "SWE", cpqa_target_cents: 15000, dedicated_budget_cents: 1000000, priority_rank: 1 }
              as: BrandProgramLead
              captures: { swe_id: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${program_id}", name: "Enterprise Sales", code: "SALES", cpqa_target_cents: 22000, dedicated_budget_cents: 500000, priority_rank: 2 }
              as: BrandProgramLead
              captures: { sales_id: $.data.id }
            - call: "POST /event-presences"
              payload: { program_id: "${program_id}", job_family_id: "${swe_id}", venue_code: "CAMPUS-A", start_at: "2026-08-10T09:00:00Z", end_at: "2026-08-10T17:00:00Z", booth_cost_cents: 200000 }
              as: MediaBuyer
              captures: { pres_a_id: $.data.id }
            - call: "POST /event-presences/${pres_a_id}/confirm"
              as: MediaBuyer
            - call: "POST /event-presences"
              payload: { program_id: "${program_id}", job_family_id: "${swe_id}", venue_code: "CAMPUS-B", start_at: "2026-08-12T17:00:00Z", end_at: "2026-08-13T01:00:00Z", booth_cost_cents: 200000 }
              as: MediaBuyer
              captures: { pres_b_id: $.data.id }
            - call: "POST /event-presences"
              payload: { program_id: "${program_id}", job_family_id: "${swe_id}", venue_code: "CAMPUS-C", start_at: "2026-08-12T16:59:00Z", end_at: "2026-08-13T00:59:00Z", booth_cost_cents: 200000 }
              as: MediaBuyer
              captures: { pres_c_id: $.data.id }
            - call: "POST /event-presences"
              payload: { program_id: "${program_id}", job_family_id: "${sales_id}", venue_code: "CAMPUS-A", start_at: "2026-08-10T12:00:00Z", end_at: "2026-08-10T20:00:00Z", booth_cost_cents: 200000 }
              as: MediaBuyer
              captures: { pres_e_id: $.data.id }
          trigger:
            - call: "POST /event-presences/${pres_b_id}/confirm"
              as: MediaBuyer
            - call: "POST /event-presences/${pres_c_id}/confirm"
              as: MediaBuyer
            - call: "POST /event-presences/${pres_b_id}/cancel"
              payload: { reason: "venue withdrew" }
              as: MediaBuyer
            - call: "POST /event-presences/${pres_c_id}/confirm"
              as: MediaBuyer
            - call: "POST /event-presences/${pres_e_id}/confirm"
              as: MediaBuyer
          assert:
            - "Trigger call 1 returns 200 - the gap between A's end 2026-08-10T17:00:00Z and B's start 2026-08-12T17:00:00Z is exactly 48 hours, which is allowed; EventPresence.${pres_b_id}.state == CONFIRMED with reserved_cents 200000"
            - "Trigger call 2 returns 409 with error_id ERR_EVENT_BUFFER_CONFLICT and EventPresence.${pres_c_id}.state stays PLANNED with reserved_cents 0"
            - "Trigger call 3 returns 200: EventPresence.${pres_b_id}.state == CANCELLED, reserved_cents == 0 and one RELEASE BudgetLedgerEntry of -200000 was written"
            - "Trigger call 4 still returns 409 ERR_EVENT_BUFFER_CONFLICT - cancelling B freed nothing that mattered, because C is 47 hours 59 minutes after CONFIRMED presence A"
            - "Trigger call 5 returns 200: EventPresence.${pres_e_id}.state == CONFIRMED although its window overlaps A entirely - the buffer is scoped to job_family_id"
            - "After all triggers: Program.${program_id}.committed_budget_cents == 400000 (A 200000 plus E 200000), JobFamily.${swe_id}.reserved_cents == 200000 and JobFamily.${sales_id}.reserved_cents == 200000"
            - "Every reservation drew from FAMILY_DEDICATED only, so no FLEX_RESERVE ledger row exists"

  # =========================================================================
  # Rule 9 - compensating_invariant
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: attribution_basis_points_stay_conserved_when_a_qualified_application_is_disqualified
        grounds:
          - state_machines.Application.QUALIFIED_to_DISQUALIFIED
          - calculations.application_touch_credit
          - entities.Channel.fields.credited_qualified_bp
          - entities.Application.fields.attributed_credit_bp_total
          - entities.JobPosting.fields.qualified_count
        distinguishing_aspect: |
          The conserved quantity is attribution credit in basis points: at every observable moment
          sum(Channel.credited_qualified_bp) must equal 10000 * count(Application with status
          QUALIFIED). Two qualified applications push the sum to 20000 across two channels;
          disqualifying one of them must run the compensating action - zero its touchpoints and
          subtract exactly the amounts previously added - taking the sum back to 10000, not to
          15000 (subtracting only one channel) and not to 20000 (forgetting the reversal). The
          channel that loses all of its credit must also fall back to PACING_UNKNOWN with
          cpqa_cents and blended_target_cents null, while the channel that keeps credit is untouched.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z, advanced to 2026-08-02T00:00:00Z before the applications are submitted."
            - "Program with attribution_model LINEAR; JobFamily SWE with cpqa_target_cents 15000; Channels Board A (JOB_BOARD) and Social B (SOCIAL), created in that order."
            - "One PUBLISHED, CLEARED posting of SWE with an APPROVED persona; no MediaFlight and no spend anywhere, so all cpqa values stay 0."
            - "Application 1 carries two touchpoints - Board A at 2026-08-01T09:00:00Z and Social B at 2026-08-01T10:00:00Z - so LINEAR gives 5000 bp each."
            - "Application 2 carries a single touchpoint on Social B at 2026-08-01T11:00:00Z, worth the full 10000 bp."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026, attribution_model: "LINEAR" }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${program_id}", name: "Software Engineering", code: "SWE", cpqa_target_cents: 15000, dedicated_budget_cents: 0, priority_rank: 1 }
              as: BrandProgramLead
              captures: { family_id: $.data.id }
            - call: "POST /channels"
              payload: { program_id: "${program_id}", name: "Board A", channel_type: "JOB_BOARD", daily_capacity_cents: 100000, min_flight_days: 1 }
              as: BrandProgramLead
              captures: { ch1_id: $.data.id }
            - call: "POST /channels"
              payload: { program_id: "${program_id}", name: "Social B", channel_type: "SOCIAL", daily_capacity_cents: 100000, min_flight_days: 1 }
              as: BrandProgramLead
              captures: { ch2_id: $.data.id }
            - call: "POST /candidate-personas"
              payload: { job_family_id: "${family_id}", name: "Backend IC", mix_method: "SURVEY_WEIGHTED", research_window_days: 180 }
              as: PersonaResearcher
              as_user_id: "u-res-1"
              captures: { persona_id: $.data.id }
            - call: "POST /channel-preference-signals"
              payload: { persona_id: "${persona_id}", channel_id: "${ch1_id}", preference_score: 70, sample_size: 400, engagement_events: 100, collected_at: "2026-07-20T00:00:00Z" }
              as: PersonaResearcher
              as_user_id: "u-res-1"
            - call: "POST /candidate-personas/${persona_id}/submit"
              as: PersonaResearcher
              as_user_id: "u-res-1"
            - call: "POST /candidate-personas/${persona_id}/review"
              payload: { decision: "APPROVE", review_note: "approved" }
              as: BrandProgramLead
              as_user_id: "u-lead-1"
            - call: "POST /job-postings"
              payload: { job_family_id: "${family_id}", title: "Senior Backend Engineer", responsibility_count: 6, benefit_count: 5, pay_range_min_cents: 12000000, pay_range_max_cents: 18000000, eeo_statement_included: true, superlative_claim_included: false }
              as: BrandProgramLead
              captures: { posting_id: $.data.id, posting_version: $.data.version }
            - call: "POST /job-postings/${posting_id}/optimize"
              payload: { expected_posting_version: "${posting_version}" }
              as: BrandProgramLead
              as_user_id: "u-lead-1"
            - call: "POST /job-postings/${posting_id}/compliance-review"
              payload: { decision: "CLEAR", note: "clean" }
              as: ComplianceReviewer
              as_user_id: "u-comp-1"
            - call: "POST /job-postings/${posting_id}/publish"
              as: BrandProgramLead
              as_user_id: "u-lead-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: RecruitingOps
            - call: "POST /applications"
              payload: { job_posting_id: "${posting_id}", candidate_email: "keep@example.com" }
              as: Anonymous
              captures: { app1_id: $.data.id }
            - call: "POST /applications/${app1_id}/submit"
              as: Anonymous
            - call: "POST /touchpoints"
              payload: { application_id: "${app1_id}", channel_id: "${ch1_id}", touch_type: "IMPRESSION", occurred_at: "2026-08-01T09:00:00Z", media_cost_cents: 0 }
              as: MediaBuyer
              captures: { a1_tp1_id: $.data.id }
            - call: "POST /touchpoints"
              payload: { application_id: "${app1_id}", channel_id: "${ch2_id}", touch_type: "CLICK", occurred_at: "2026-08-01T10:00:00Z", media_cost_cents: 0 }
              as: MediaBuyer
              captures: { a1_tp2_id: $.data.id }
            - call: "POST /applications/${app1_id}/screen"
              as: RecruitingOps
            - call: "POST /applications"
              payload: { job_posting_id: "${posting_id}", candidate_email: "stay@example.com" }
              as: Anonymous
              captures: { app2_id: $.data.id }
            - call: "POST /applications/${app2_id}/submit"
              as: Anonymous
            - call: "POST /touchpoints"
              payload: { application_id: "${app2_id}", channel_id: "${ch2_id}", touch_type: "CLICK", occurred_at: "2026-08-01T11:00:00Z", media_cost_cents: 0 }
              as: MediaBuyer
              captures: { a2_tp1_id: $.data.id }
            - call: "POST /applications/${app2_id}/screen"
              as: RecruitingOps
            - call: "POST /applications/${app1_id}/decide"
              payload: { outcome: "QUALIFIED" }
              as: RecruitingOps
            - call: "POST /applications/${app2_id}/decide"
              payload: { outcome: "QUALIFIED" }
              as: RecruitingOps
          trigger:
            - call: "POST /applications/${app1_id}/decide"
              payload: { outcome: "DISQUALIFIED" }
              as: RecruitingOps
          assert:
            - "Before the trigger: Touchpoint.${a1_tp1_id}.credit_bp == 5000, Touchpoint.${a1_tp2_id}.credit_bp == 5000, Touchpoint.${a2_tp1_id}.credit_bp == 10000; Channel.${ch1_id}.credited_qualified_bp == 5000 and Channel.${ch2_id}.credited_qualified_bp == 15000, summing to 20000 == 10000 * 2 QUALIFIED applications"
            - "Before the trigger: JobPosting.${posting_id}.qualified_count == 2, apply_start_count == 2, submitted_count == 2, conversion_rate_bp == 10000"
            - "After the trigger: Application.${app1_id}.state == DISQUALIFIED, attributed_credit_bp_total == 0, attribution_model_applied == null, eligible_touch_count == 2 is retained as evidence of the reversed run"
            - "After the trigger: Touchpoint.${a1_tp1_id}.credit_bp == 0 and Touchpoint.${a1_tp2_id}.credit_bp == 0, while Touchpoint.${a2_tp1_id}.credit_bp is still 10000"
            - "After the trigger: Channel.${ch1_id}.credited_qualified_bp == 0 and Channel.${ch2_id}.credited_qualified_bp == 10000 - the sum is 10000 == 10000 * 1 QUALIFIED application, not 15000 and not 20000"
            - "Channel.${ch1_id}.pacing_status == PACING_UNKNOWN with cpqa_cents == null and blended_target_cents == null; Channel.${ch2_id} keeps blended_target_cents 15000 and cpqa_cents 0 with pacing_status ON_TARGET"
            - "JobPosting.${posting_id}.qualified_count == 1 while submitted_count stays 2 and conversion_rate_bp stays 10000"

      - name: budget_cents_are_conserved_across_a_three_bucket_reservation_and_its_cancellation
        grounds:
          - calculations.media_budget_waterfall
          - state_machines.MediaFlight.RESERVED_to_CANCELLED
          - entities.BudgetLedgerEntry.fields.delta_cents
          - entities.BudgetLedgerEntry.fields.sequence_no
          - entities.Program.fields.committed_budget_cents
          - entities.JobFamily.fields.reserved_cents
        distinguishing_aspect: |
          A different conserved quantity - cents - and a different reversal path. The invariant is
          Program.committed_budget_cents == sum(BudgetLedgerEntry.delta_cents) for the program at
          all times, with JobFamily.reserved_cents equal to the FAMILY_DEDICATED subtotal. The
          fixture forces a three-bucket draw (100000 dedicated, 200000 job-board pool, 60500 flex)
          so the cancellation must emit three mirroring RELEASE rows in the ascending sequence_no
          order of the originals rather than one lump sum, and every bucket's availability must
          return to its opening value - a single aggregated release row satisfies the total while
          breaking per-bucket availability, which the follow-up re-reservation detects.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Program with pool_job_board_cents 200000, pool_social_cents 0, pool_programmatic_cents 0 and flex_reserve_cents 100000."
            - "JobFamily SWE with dedicated_budget_cents 100000."
            - "Channel Board A (JOB_BOARD) with daily_capacity_cents 100000 and min_flight_days 1."
            - "One OPTIMIZED, CLEARED posting of SWE."
            - "One flight over 2026-08-01 -> 2026-08-08 at daily_cap_cents 50000: total_cost_cents 360500, which is exactly the sum of the three buckets' availability."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026, attribution_model: "LINEAR", pool_job_board_cents: 200000, pool_social_cents: 0, pool_programmatic_cents: 0, flex_reserve_cents: 100000 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${program_id}", name: "Software Engineering", code: "SWE", cpqa_target_cents: 15000, dedicated_budget_cents: 100000, priority_rank: 1 }
              as: BrandProgramLead
              captures: { family_id: $.data.id }
            - call: "POST /channels"
              payload: { program_id: "${program_id}", name: "Board A", channel_type: "JOB_BOARD", daily_capacity_cents: 100000, min_flight_days: 1 }
              as: BrandProgramLead
              captures: { ch1_id: $.data.id }
            - call: "POST /job-postings"
              payload: { job_family_id: "${family_id}", title: "Senior Backend Engineer", responsibility_count: 6, benefit_count: 5, pay_range_min_cents: 12000000, pay_range_max_cents: 18000000, eeo_statement_included: true, superlative_claim_included: false }
              as: BrandProgramLead
              captures: { posting_id: $.data.id, posting_version: $.data.version }
            - call: "POST /job-postings/${posting_id}/optimize"
              payload: { expected_posting_version: "${posting_version}" }
              as: BrandProgramLead
              as_user_id: "u-lead-1"
            - call: "GET /programs/${program_id}"
              as: MediaBuyer
              captures: { pv1: $.data.version }
            - call: "POST /media-flights"
              payload: { channel_id: "${ch1_id}", job_family_id: "${family_id}", job_posting_id: "${posting_id}", start_date: "2026-08-01", end_date: "2026-08-08", daily_cap_cents: 50000, expected_program_version: "${pv1}" }
              as: MediaBuyer
              captures: { flight_id: $.data.id, flight_cost: $.data.total_cost_cents }
          trigger:
            - call: "POST /media-flights/${flight_id}/cancel"
              payload: { reason: "campaign pulled" }
              as: MediaBuyer
            - call: "GET /programs/${program_id}"
              as: MediaBuyer
              captures: { pv2: $.data.version }
            - call: "POST /media-flights"
              payload: { channel_id: "${ch1_id}", job_family_id: "${family_id}", job_posting_id: "${posting_id}", start_date: "2026-08-01", end_date: "2026-08-08", daily_cap_cents: 50000, expected_program_version: "${pv2}" }
              as: MediaBuyer
              captures: { flight2_id: $.data.id }
          assert:
            - "Before the trigger: three RESERVE BudgetLedgerEntry rows exist for MediaFlight.${flight_id} in bucket order with ascending sequence_no - FAMILY_DEDICATED 100000, POOL_JOB_BOARD 200000, FLEX_RESERVE 60500 - summing to 360500"
            - "Before the trigger: Program.${program_id}.committed_budget_cents == 360500 == the sum of all delta_cents, and JobFamily.${family_id}.reserved_cents == 100000 == the FAMILY_DEDICATED subtotal"
            - "Trigger call 1 returns 200: MediaFlight.${flight_id}.state == CANCELLED, release_reason == CANCELLED, reserved_cents == 0"
            - "Trigger call 1 writes exactly three RELEASE rows mirroring the originals - FAMILY_DEDICATED -100000, POOL_JOB_BOARD -200000, FLEX_RESERVE -60500 - in the ascending sequence_no order of the RESERVE rows"
            - "After trigger call 1: sum of every BudgetLedgerEntry.delta_cents of the program == 0, Program.${program_id}.committed_budget_cents == 0, available_budget_cents back to its opening value, JobFamily.${family_id}.reserved_cents == 0 and dedicated_available_cents == 100000"
            - "Trigger call 3 returns 201 and reproduces the identical three-bucket draw (100000 / 200000 / 60500), which is only possible if each bucket's availability was restored individually rather than in aggregate"
            - "After trigger call 3: Program.${program_id}.committed_budget_cents == 360500 again and the ledger holds six rows whose delta_cents sum to 360500"
