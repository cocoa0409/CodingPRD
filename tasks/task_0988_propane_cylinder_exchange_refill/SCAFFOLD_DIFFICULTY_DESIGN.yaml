              payload: { serial_number: "FI-011", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: EMPTY, current_site_id: "${s_id}" }
              as: PlatformAdmin
