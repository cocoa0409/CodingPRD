              as: TransactionCoordinator
            - call: "GET /regions/${region_id}"
              payload: {}
              as: PlatformAdmin
              captures: { pipeline_before: $.data.clients_in_pipeline }
          trigger:
            - call: "POST /transactions/${transaction_id}/close"
              payload: {}
              as: TransactionCoordinator
            - call: "GET /regions/${region_id}"
              payload: {}
              as: PlatformAdmin
              captures: { pipeline_after: $.data.clients_in_pipeline }
          assert:
            - "pipeline_before == 1"
            - "pipeline_after == 0 on the very next read, with no intervening checkpoint"
            - "GET /agents/${agent_id}/open-client-counts returns active_client_count == 0 in the same breath"
            - "Agent.${agent_id}.close_rate == 1.0 already reflects the new CLOSED transaction"