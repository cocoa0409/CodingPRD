        distinguishing_aspect: >
          Crew resource, closed-interval + 1-day buffer semantics: a WorkOrder on 2026-11-11 is
          rejected because it sits within the 1-day buffer of an existing crew job on 2026-11-10
          (adjacency does NOT clear; needs a strictly greater than 1-day gap).
