              captures: { bk_id: $.data.id }
          trigger:
            - call: "GET /convention-center/bookings/${bk_id}"
              payload: {}
              as: VenueAdmin
            - call: "GET /convention-center/bookings/${bk_id}"
              payload: {}
              as: SalesManager
            - call: "GET /convention-center/bookings/${bk_id}"
              payload: {}
              as: EventServicesManager
            - call: "GET /convention-center/bookings/${bk_id}"
              payload: {}
              as: SettlementAnalyst
              as_user_id: "analyst-1"
            - call: "GET /convention-center/bookings/${bk_id}"
              payload: {}
              as: FacilitiesPlanner
            - call: "GET /convention-center/bookings/${bk_id}"
              payload: {}
