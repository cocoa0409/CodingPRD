  - name: door_to_imaging_deviation_fires_at_forty_six_but_not_at_forty_five
    claim_type: constants_applied
    grounds:
    - calculations.clock_interval_metrics constant DTI_TARGET_MIN 45
    - 'state_machines.CodeStrokeCase ACTIVATED -> IMAGING_COMPLETE side effect ''when door_to_imaging_minutes > DTI_TARGET_MIN: create SYSTEM_DETECTED ProtocolDeviation(DTI_EXCEEDED, MINOR)'''
    distinguishing_aspect: 'The threshold is a strict `>`, so the constant''s exact value is observable: imaging at door+45 must raise NOTHING while door+46 must auto-open a MINOR DTI_EXCEEDED deviation with source SYSTEM_DETECTED and opened_by_user_id ''system''. Using >= would wrongly flag the 45-minute case.'
