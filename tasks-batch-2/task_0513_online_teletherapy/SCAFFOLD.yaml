scenario: "Online Teletherapy Subscription (BetterHelp/Talkspace style): intake questionnaire & therapist matching, license-by-state routing, weekly subscription & financial-aid tier, async messaging + live-session credits, reassignment/switch therapist, crisis escalation & safety resources, superbill/HSA reimbursement, cancellation/pause"
domain_name: online-teletherapy
api_prefix: /

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_actions
    - optimistic_concurrency
  entity_topology: hybrid
  # Client/Therapist are flat peers linked by Match (junction); Subscription, BillingCycle,
  # SessionCredit, LiveSession, Message, CrisisEscalation, Superbill hang off Client/Match by FK.
  state_machine_shape: cyclic
  # Match supports a reassignment cycle (ACTIVE -> SWITCH_REQUESTED -> ACTIVE on a *new* match);
  # Subscription supports a pause/resume cycle (ACTIVE -> PAUSED -> ACTIVE).
  relationship_patterns:
    - one_to_many        # Client 1:N Subscription/BillingCycle/Message/CrisisEscalation/Superbill
    - many_to_many       # Client N:M Therapist resolved through Match
    - cross_aggregate    # LiveSession references both Match and SessionCredit
  role_model: peer_roles
  # Client owns own resources; Therapist owns matched-client interactions; ClinicalAdmin and
  # BillingAdmin are opaque operational roles owning licensing/financial-aid/superbill surfaces.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: unique login email
        constraints: unique; lowercased
      - name: full_name
        type: string
        source: input
        description: client legal name
      - name: state_code
        type: enum
        source: input
        description: two-letter US state of residence; drives license-by-state routing
        constraints: one of {CA, NY, TX, FL, WA, IL}
      - name: status
        type: enum
        source: system
        description: account lifecycle state
        default: PENDING_INTAKE
        constraints: one of {PENDING_INTAKE, AWAITING_MATCH, ACTIVE, SUSPENDED, CLOSED}
      - name: financial_aid_tier
        type: enum
        source: system
        description: aid tier set by an approved FinancialAidApplication; drives subscription discount
        default: NONE
        constraints: one of {NONE, TIER_1, TIER_2, TIER_3}
      - name: wallet_credit_cents
        type: integer
        source: computed
        description: client-held account credit in cents, accrued from cancellation/pause refunds; consumed on next billing cycle
        default: 0
        constraints: ">= 0"
      - name: risk_flag
        type: enum
        source: system
        description: clinical risk posture; raised by crisis escalation, cleared by ClinicalAdmin
        default: NONE
        constraints: one of {NONE, ELEVATED, ACUTE}
  - name: Therapist
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: therapist display name
      - name: status
        type: enum
        source: system
        description: roster availability state
        default: ONBOARDING
        constraints: one of {ONBOARDING, ACCEPTING, FULL, INACTIVE}
      - name: max_active_caseload
        type: integer
        source: input
        description: maximum simultaneous ACTIVE matches this therapist accepts
        default: 30
        constraints: ">= 1"
      - name: active_caseload
        type: integer
        source: computed
        description: count of Match rows for this therapist in state ACTIVE; transitions ACCEPTING<->FULL at the cap boundary
        default: 0
        constraints: "0 <= active_caseload <= max_active_caseload"
      - name: specialties
        type: array
        source: input
        description: list of specialty tags used in match ranking
        constraints: subset of {ANXIETY, DEPRESSION, TRAUMA, COUPLES, GRIEF, ADHD}
  - name: TherapistLicense
    parent: Therapist
    common_fields: true
    fields:
      - name: therapist_id
        type: string
        source: input
        description: FK -> Therapist.id; the licensed provider
      - name: state_code
        type: enum
        source: input
        description: state this license authorizes practice in
        constraints: one of {CA, NY, TX, FL, WA, IL}
      - name: expires_on
        type: datetime
        source: input
        description: license expiry instant (ISO 8601 UTC); license is valid only when current clock < expires_on
      - name: status
        type: enum
        source: system
        description: license validity, recomputed against the logical clock
        default: VALID
        constraints: one of {VALID, EXPIRED, REVOKED}
  - name: IntakeQuestionnaire
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: FK -> Client.id; the client who submitted intake
        constraints: unique per Client (one submitted intake of record)
      - name: presenting_concerns
        type: array
        source: input
        description: concern tags the client selected; matched against Therapist.specialties
        constraints: non-empty subset of {ANXIETY, DEPRESSION, TRAUMA, COUPLES, GRIEF, ADHD}
      - name: severity_score
        type: integer
        source: input
        description: self-reported severity 0-10; >= 8 forces a clinician review before matching
        constraints: "0 <= severity_score <= 10"
      - name: crisis_indicator
        type: boolean
        source: input
        description: client self-reported active-crisis flag; true requires ClinicalAdmin clearance before matching
        default: false
      - name: submitted_at
        type: datetime
        source: system
        description: logical-clock timestamp at intake submission
  - name: Match
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: FK -> Client.id; the matched client
      - name: therapist_id
        type: string
        source: input
        description: FK -> Therapist.id; the matched therapist
      - name: status
        type: enum
        source: system
        description: assignment lifecycle
        default: PROPOSED
        constraints: one of {PROPOSED, ACTIVE, SWITCH_REQUESTED, ENDED}
      - name: match_score
        type: integer
        source: computed
        description: weighted specialty/severity/state fit score at proposal time; higher is better
        default: 0
      - name: switch_reason
        type: enum
        source: input
        description: reason captured on a switch request
        default: null
        constraints: one of {FIT, AVAILABILITY, CLINICAL, OTHER} or null
      - name: superseded_by_match_id
        type: string
        source: system
        description: FK -> Match.id; set on the old match when a reassignment creates its successor
        default: null
  - name: Subscription
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: FK -> Client.id; subscriber
        constraints: one non-terminal Subscription per Client
      - name: status
        type: enum
        source: system
        description: subscription lifecycle
        default: TRIALING
        constraints: one of {TRIALING, ACTIVE, PAUSED, CANCEL_SCHEDULED, CANCELLED}
      - name: base_weekly_fee_cents
        type: integer
        source: input
        description: list weekly fee before financial-aid discount
        default: 9900
        constraints: ">= 0"
      - name: weekly_credit_grant
        type: integer
        source: input
        description: live-session credits granted at the start of each billing cycle
        default: 1
        constraints: "0 <= weekly_credit_grant <= 4"
      - name: current_period_start
        type: datetime
        source: system
        description: start instant of the current weekly billing period
      - name: pause_resumes_on
        type: datetime
        source: system
        description: scheduled instant a PAUSED subscription auto-resumes; null when not paused
        default: null
      - name: cancel_effective_on
        type: datetime
        source: system
        description: scheduled instant a CANCEL_SCHEDULED subscription becomes CANCELLED (end of paid period)
        default: null
  - name: BillingCycle
    parent: Subscription
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: input
        description: FK -> Subscription.id; owning subscription
      - name: period_start
        type: datetime
        source: system
        description: inclusive start instant of this weekly period
      - name: period_end
        type: datetime
        source: system
        description: exclusive end instant (period_start + 7 days)
      - name: list_amount_cents
        type: integer
        source: computed
        description: base_weekly_fee_cents after financial-aid discount, before wallet credit
        default: 0
      - name: wallet_applied_cents
        type: integer
        source: computed
        description: amount of client wallet credit applied to this cycle
        default: 0
      - name: charged_amount_cents
        type: integer
        source: computed
        description: amount actually charged = list_amount_cents - wallet_applied_cents
        default: 0
      - name: status
        type: enum
        source: system
        description: billing-cycle payment state
        default: PENDING
        constraints: one of {PENDING, PAID, REFUNDED, VOID}
      - name: credits_granted
        type: integer
        source: computed
        description: SessionCredit count granted when this cycle was charged
        default: 0
  - name: SessionCredit
    parent: Client
    common_fields: false
    fields:
      - name: client_id
        type: string
        source: input
        description: FK -> Client.id; owner of the credit
      - name: billing_cycle_id
        type: string
        source: input
        description: FK -> BillingCycle.id; cycle that granted this credit
      - name: status
        type: enum
        source: system
        description: credit lifecycle
        default: AVAILABLE
        constraints: one of {AVAILABLE, RESERVED, CONSUMED, EXPIRED}
      - name: expires_on
        type: datetime
        source: system
        description: instant this credit expires if unused (granting period_end + 28 days)
      - name: live_session_id
        type: string
        source: system
        description: FK -> LiveSession.id; the session that reserved/consumed this credit
        default: null
  - name: LiveSession
    parent: null
    common_fields: true
    fields:
      - name: match_id
        type: string
        source: input
        description: FK -> Match.id; the matched relationship this session belongs to
      - name: session_credit_id
        type: string
        source: system
        description: FK -> SessionCredit.id; the credit reserved for this session
        default: null
      - name: starts_at
        type: datetime
        source: input
        description: scheduled session start (ISO 8601 UTC)
      - name: ends_at
        type: datetime
        source: input
        description: scheduled session end (ISO 8601 UTC); must be after starts_at
      - name: status
        type: enum
        source: system
        description: session lifecycle
        default: SCHEDULED
        constraints: one of {SCHEDULED, COMPLETED, CANCELLED, NO_SHOW}
      - name: cancelled_within_window
        type: boolean
        source: computed
        description: true when a cancellation occurs less than 24h before starts_at (forfeits the credit)
        default: false
  - name: MessageThread
    parent: Match
    common_fields: true
    fields:
      - name: match_id
        type: string
        source: input
        description: FK -> Match.id; the relationship this async thread belongs to
        constraints: one thread per Match
      - name: status
        type: enum
        source: system
        description: thread state
        default: OPEN
        constraints: one of {OPEN, FROZEN, ARCHIVED}
      - name: unread_for_therapist
        type: integer
        source: computed
        description: count of client messages not yet acknowledged by the therapist
        default: 0
  - name: Message
    parent: MessageThread
    common_fields: false
    fields:
      - name: thread_id
        type: string
        source: input
        description: FK -> MessageThread.id; owning thread
      - name: sender_role
        type: enum
        source: system
        description: who sent this message
        constraints: one of {CLIENT, THERAPIST}
      - name: body
        type: string
        source: input
        description: message text
        constraints: non-empty; max 4000 chars
  - name: CrisisEscalation
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: FK -> Client.id; subject of the escalation
      - name: raised_by_role
        type: enum
        source: system
        description: role that raised the escalation
        constraints: one of {CLIENT, THERAPIST, SYSTEM}
      - name: severity
        type: enum
        source: input
        description: escalation severity, sets the client risk posture
        constraints: one of {ELEVATED, ACUTE}
      - name: status
        type: enum
        source: system
        description: escalation lifecycle
        default: OPEN
        constraints: one of {OPEN, ACKNOWLEDGED, RESOLVED}
      - name: safety_resources_sent
        type: boolean
        source: system
        description: whether the standardized safety-resource packet was attached on open
        default: false
  - name: FinancialAidApplication
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: FK -> Client.id; applicant
      - name: annual_income_cents
        type: integer
        source: input
        description: declared annual household income in cents; drives tier banding
        constraints: ">= 0"
      - name: household_size
        type: integer
        source: input
        description: declared household size; raises the income bands
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: application lifecycle
        default: SUBMITTED
        constraints: one of {SUBMITTED, APPROVED, DENIED}
      - name: awarded_tier
        type: enum
        source: computed
        description: tier banded from income/household at approval; copied onto Client.financial_aid_tier
        default: NONE
        constraints: one of {NONE, TIER_1, TIER_2, TIER_3}
  - name: Superbill
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: FK -> Client.id; the client the superbill is issued to
      - name: period_start
        type: datetime
        source: input
        description: inclusive start of the reimbursement reporting window
      - name: period_end
        type: datetime
        source: input
        description: exclusive end of the reimbursement reporting window
      - name: status
        type: enum
        source: system
        description: superbill lifecycle
        default: DRAFT
        constraints: one of {DRAFT, ISSUED, VOID}
      - name: session_count
        type: integer
        source: computed
        description: count of COMPLETED LiveSessions for the client whose starts_at falls in [period_start, period_end)
        default: 0
      - name: reimbursable_amount_cents
        type: integer
        source: computed
        description: HSA-reimbursable total computed from completed sessions and paid cycles in window
        default: 0

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Client
    initial_state: PENDING_INTAKE
    terminal_states: [CLOSED]
    transitions:
      - from: PENDING_INTAKE
        to: AWAITING_MATCH
        trigger: "POST /clients/{id}/intake"
        actor: Client
        preconditions:
          - "Client.status == PENDING_INTAKE"
          - "no prior IntakeQuestionnaire exists for this client"
        side_effects:
          - "create IntakeQuestionnaire with submitted_at = current clock"
          - "if crisis_indicator == true OR severity_score >= 8: leave Client.status = PENDING_INTAKE and require ClinicalAdmin clearance (transition rejected back to PENDING_INTAKE is not taken; instead matching is blocked) — Client moves to AWAITING_MATCH only when neither hold"
        note: "When crisis_indicator or severity gate fires, Client stays PENDING_INTAKE; ClinicalAdmin clearance is the only path forward."
      - from: PENDING_INTAKE
        to: AWAITING_MATCH
        trigger: "POST /clients/{id}/clear-intake"
        actor: ClinicalAdmin
        preconditions:
          - "Client.status == PENDING_INTAKE"
          - "an IntakeQuestionnaire exists for this client"
        side_effects:
          - "set Client.status = AWAITING_MATCH"
        note: "Clears the severity>=8 / crisis_indicator gate."
      - from: AWAITING_MATCH
        to: ACTIVE
        trigger: "system: first Match for this client transitions PROPOSED -> ACTIVE"
        actor: system
        preconditions:
          - "Client.status == AWAITING_MATCH"
        side_effects:
          - "set Client.status = ACTIVE"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: CrisisEscalation opened with severity == ACUTE"
        actor: system
        preconditions:
          - "Client.status == ACTIVE"
        side_effects:
          - "set Client.risk_flag = ACUTE"
          - "freeze the client's MessageThread(s): OPEN -> FROZEN"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /crisis-escalations/{id}/resolve"
        actor: ClinicalAdmin
        preconditions:
          - "Client.status == SUSPENDED"
          - "the escalation being resolved is the client's only OPEN/ACKNOWLEDGED ACUTE escalation"
        side_effects:
          - "set Client.risk_flag = NONE"
          - "unfreeze MessageThread(s): FROZEN -> OPEN"
          - "set Client.status = ACTIVE"
      - from: ACTIVE
        to: CLOSED
        trigger: "system: Subscription reaches CANCELLED"
        actor: system
        preconditions:
          - "Client.status IN {ACTIVE, SUSPENDED}"
          - "client has no other non-terminal Subscription"
        side_effects:
          - "end all ACTIVE Matches: ACTIVE -> ENDED"
          - "expire all AVAILABLE/RESERVED SessionCredits: -> EXPIRED"
          - "archive all OPEN/FROZEN MessageThreads: -> ARCHIVED"
  - entity: Therapist
    initial_state: ONBOARDING
    terminal_states: [INACTIVE]
    transitions:
      - from: ONBOARDING
        to: ACCEPTING
        trigger: "POST /therapists/{id}/activate"
        actor: ClinicalAdmin
        preconditions:
          - "Therapist.status == ONBOARDING"
          - "therapist has >= 1 TherapistLicense in status VALID"
        side_effects:
          - "set Therapist.status = ACCEPTING"
      - from: ACCEPTING
        to: FULL
        trigger: "system: active_caseload reaches max_active_caseload after a Match -> ACTIVE"
        actor: system
        preconditions:
          - "Therapist.status == ACCEPTING"
          - "active_caseload == max_active_caseload"
        side_effects:
          - "set Therapist.status = FULL"
      - from: FULL
        to: ACCEPTING
        trigger: "system: active_caseload drops below max_active_caseload after a Match leaves ACTIVE"
        actor: system
        preconditions:
          - "Therapist.status == FULL"
          - "active_caseload < max_active_caseload"
        side_effects:
          - "set Therapist.status = ACCEPTING"
      - from: ACCEPTING
        to: INACTIVE
        trigger: "POST /therapists/{id}/deactivate"
        actor: ClinicalAdmin
        preconditions:
          - "Therapist.status IN {ACCEPTING, FULL, ONBOARDING}"
          - "therapist has zero Matches in status ACTIVE"
        side_effects:
          - "set Therapist.status = INACTIVE"
  - entity: Match
    initial_state: PROPOSED
    terminal_states: [ENDED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /matches/{id}/accept"
        actor: Client
        preconditions:
          - "Match.status == PROPOSED"
          - "Client.risk_flag != ACUTE"
          - "Therapist.status == ACCEPTING"
          - "Therapist.active_caseload < Therapist.max_active_caseload"
          - "the therapist holds a VALID TherapistLicense for Client.state_code"
        side_effects:
          - "set Match.status = ACTIVE"
          - "increment Therapist.active_caseload by 1 (may bubble ACCEPTING -> FULL)"
          - "create MessageThread for this Match in status OPEN"
          - "if Client.status == AWAITING_MATCH: set Client.status = ACTIVE"
      - from: ACTIVE
        to: SWITCH_REQUESTED
        trigger: "POST /matches/{id}/request-switch"
        actor: Client | Therapist
        preconditions:
          - "Match.status == ACTIVE"
          - "switch_reason is provided"
        side_effects:
          - "set Match.status = SWITCH_REQUESTED"
          - "freeze this Match's MessageThread: OPEN -> FROZEN"
      - from: SWITCH_REQUESTED
        to: ENDED
        trigger: "POST /matches/{id}/reassign"
        actor: ClinicalAdmin
        preconditions:
          - "Match.status == SWITCH_REQUESTED"
          - "a candidate Therapist exists who is ACCEPTING, has a VALID license for Client.state_code, and active_caseload < max_active_caseload (selector below)"
        side_effects:
          - "create a successor Match in status ACTIVE for the selected new therapist (this successor's own ACTIVE side effects fire: increment new therapist active_caseload; create new OPEN MessageThread)"
          - "set old Match.superseded_by_match_id = successor.id"
          - "set old Match.status = ENDED"
          - "decrement old Therapist.active_caseload by 1 (may bubble FULL -> ACCEPTING)"
          - "archive old Match's MessageThread: FROZEN -> ARCHIVED"
        note: "Reassignment selector — eligibility: Therapist.status == ACCEPTING AND a TherapistLicense with status VALID and state_code == Client.state_code exists AND active_caseload < max_active_caseload AND therapist_id != old Match.therapist_id. Ranking: match_score DESC. Tie-break: Therapist.created_at ASC. Empty candidate set -> ERR_NO_ELIGIBLE_THERAPIST."
      - from: ACTIVE
        to: ENDED
        trigger: "system: Client closes (Subscription CANCELLED) OR therapist switch with no successor needed"
        actor: system
        preconditions:
          - "Match.status == ACTIVE"
        side_effects:
          - "set Match.status = ENDED"
          - "decrement Therapist.active_caseload by 1 (may bubble FULL -> ACCEPTING)"
          - "archive this Match's MessageThread"
  - entity: Subscription
    initial_state: TRIALING
    terminal_states: [CANCELLED]
    transitions:
      - from: TRIALING
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/charge-cycle (first paid cycle)"
        actor: BillingAdmin
        preconditions:
          - "Subscription.status == TRIALING"
        side_effects:
          - "create BillingCycle, run billing calculation (list_amount, wallet_applied, charged_amount)"
          - "set BillingCycle.status = PAID"
          - "grant weekly_credit_grant SessionCredits (AVAILABLE) with expires_on = period_end + 28 days"
          - "debit Client.wallet_credit_cents by wallet_applied_cents"
          - "set Subscription.current_period_start = period_start"
          - "set Subscription.status = ACTIVE"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/charge-cycle (renewal)"
        actor: BillingAdmin
        preconditions:
          - "Subscription.status == ACTIVE"
          - "current clock >= current_period_start + 7 days"
        side_effects:
          - "create next BillingCycle, run billing calculation"
          - "set new BillingCycle.status = PAID"
          - "grant weekly_credit_grant SessionCredits"
          - "debit Client.wallet_credit_cents by wallet_applied_cents"
          - "advance Subscription.current_period_start by 7 days"
        note: "Self-loop renewal — cyclic shape on Subscription."
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /subscriptions/{id}/pause"
        actor: Client
        preconditions:
          - "Subscription.status == ACTIVE"
          - "resume_on is provided and is strictly after the current clock and <= current_period_start + 84 days"
        side_effects:
          - "set Subscription.status = PAUSED"
          - "set Subscription.pause_resumes_on = resume_on"
          - "compute unused-period refund and credit Client.wallet_credit_cents (pause refund calc)"
          - "expire the current period's AVAILABLE SessionCredits: -> EXPIRED"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/resume (manual) OR system at pause_resumes_on"
        actor: Client | system
        preconditions:
          - "Subscription.status == PAUSED"
        side_effects:
          - "set Subscription.status = ACTIVE"
          - "set Subscription.pause_resumes_on = null"
          - "set Subscription.current_period_start = current clock"
        note: "Cyclic resume back to ACTIVE."
      - from: ACTIVE
        to: CANCEL_SCHEDULED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: Client
        preconditions:
          - "Subscription.status IN {ACTIVE, TRIALING}"
        side_effects:
          - "set Subscription.status = CANCEL_SCHEDULED"
          - "set cancel_effective_on = current_period_start + 7 days (end of paid period); for TRIALING, cancel_effective_on = current clock"
      - from: CANCEL_SCHEDULED
        to: CANCELLED
        trigger: "system at cancel_effective_on OR POST /subscriptions/{id}/finalize-cancel"
        actor: system | BillingAdmin
        preconditions:
          - "Subscription.status == CANCEL_SCHEDULED"
          - "current clock >= cancel_effective_on"
        side_effects:
          - "set Subscription.status = CANCELLED"
          - "cascade: Client ACTIVE/SUSPENDED -> CLOSED with its own cascade (end matches, expire credits, archive threads)"
  - entity: LiveSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /live-sessions/{id}/complete"
        actor: Therapist
        preconditions:
          - "LiveSession.status == SCHEDULED"
          - "current clock >= starts_at"
          - "the reserved SessionCredit.status == RESERVED"
        side_effects:
          - "set LiveSession.status = COMPLETED"
          - "set reserved SessionCredit.status = CONSUMED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /live-sessions/{id}/cancel"
        actor: Client | Therapist
        preconditions:
          - "LiveSession.status == SCHEDULED"
        side_effects:
          - "set LiveSession.status = CANCELLED"
          - "set cancelled_within_window = (starts_at - current clock < 24h)"
          - "if cancelled_within_window: reserved SessionCredit -> CONSUMED (forfeited); else reserved SessionCredit -> AVAILABLE (returned)"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /live-sessions/{id}/no-show"
        actor: Therapist
        preconditions:
          - "LiveSession.status == SCHEDULED"
          - "current clock >= ends_at"
        side_effects:
          - "set LiveSession.status = NO_SHOW"
          - "set reserved SessionCredit.status = CONSUMED (forfeited)"
  - entity: MessageThread
    initial_state: OPEN
    terminal_states: [ARCHIVED]
    transitions:
      - from: OPEN
        to: FROZEN
        trigger: "system: Match -> SWITCH_REQUESTED OR Client -> SUSPENDED (ACUTE escalation)"
        actor: system
        preconditions:
          - "MessageThread.status == OPEN"
        side_effects:
          - "set MessageThread.status = FROZEN (no new messages accepted)"
      - from: FROZEN
        to: OPEN
        trigger: "system: ACUTE escalation resolved restoring Client to ACTIVE"
        actor: system
        preconditions:
          - "MessageThread.status == FROZEN"
          - "the owning Match.status == ACTIVE"
        side_effects:
          - "set MessageThread.status = OPEN"
      - from: OPEN
        to: ARCHIVED
        trigger: "system: owning Match -> ENDED OR owning Client -> CLOSED"
        actor: system
        preconditions:
          - "MessageThread.status IN {OPEN, FROZEN}"
        side_effects:
          - "set MessageThread.status = ARCHIVED"
  - entity: CrisisEscalation
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /crisis-escalations/{id}/acknowledge"
        actor: ClinicalAdmin
        preconditions:
          - "CrisisEscalation.status == OPEN"
        side_effects:
          - "set CrisisEscalation.status = ACKNOWLEDGED"
      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "POST /crisis-escalations/{id}/resolve"
        actor: ClinicalAdmin
        preconditions:
          - "CrisisEscalation.status == ACKNOWLEDGED"
        side_effects:
          - "set CrisisEscalation.status = RESOLVED"
          - "if this was an ACUTE escalation and the client has no other OPEN/ACKNOWLEDGED ACUTE escalation: restore Client SUSPENDED -> ACTIVE (with its unfreeze cascade) and set Client.risk_flag = NONE"
          - "if it was an ELEVATED escalation and no other open escalations: set Client.risk_flag = NONE"
  - entity: FinancialAidApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /financial-aid-applications/{id}/approve"
        actor: BillingAdmin
        preconditions:
          - "FinancialAidApplication.status == SUBMITTED"
        side_effects:
          - "compute awarded_tier from income/household banding"
          - "set FinancialAidApplication.awarded_tier and copy onto Client.financial_aid_tier"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /financial-aid-applications/{id}/deny"
        actor: BillingAdmin
        preconditions:
          - "FinancialAidApplication.status == SUBMITTED"
        side_effects:
          - "set FinancialAidApplication.status = DENIED"
          - "Client.financial_aid_tier unchanged"
  - entity: Superbill
    initial_state: DRAFT
    terminal_states: [VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /superbills/{id}/issue"
        actor: BillingAdmin
        preconditions:
          - "Superbill.status == DRAFT"
          - "session_count >= 1 (at least one COMPLETED session in window)"
        side_effects:
          - "recompute session_count and reimbursable_amount_cents over the window"
          - "set Superbill.status = ISSUED"
      - from: ISSUED
        to: VOID
        trigger: "POST /superbills/{id}/void"
        actor: BillingAdmin
        preconditions:
          - "Superbill.status == ISSUED"
        side_effects:
          - "set Superbill.status = VOID"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on parent.version — true races only)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: live-session-schedule-stale-match
    parent_entity: Match
    write_endpoint: "POST /matches/{id}/live-sessions"
    occ_field: "expected_match_version"
    description: |
      Scheduling a LiveSession reserves one AVAILABLE SessionCredit against the
      client's match. A second schedule whose expected_match_version is behind
      the Match's current version is rejected: the version advanced because a
      prior schedule already reserved a credit (and may have exhausted the pool),
      so the loser's view of the match is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: subscription-pause-stale
    parent_entity: Subscription
    write_endpoint: "POST /subscriptions/{id}/pause"
    occ_field: "expected_subscription_version"
    description: |
      Pausing a Subscription against a version older than the Subscription's
      current version is rejected. The version advanced because a prior pause or
      charge already mutated the subscription (e.g., a renewal charge advanced
      current_period_start), so the refund the stale request would compute is
      keyed off a period that no longer exists.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: financial_aid_tier_banding
    trigger: "POST /financial-aid-applications/{id}/approve"
    algorithm: threshold
    formula: |
      adjusted_income = annual_income_cents - (household_size - 1) * HOUSEHOLD_ALLOWANCE_CENTS
      if adjusted_income < 0: adjusted_income = 0
      if   adjusted_income <  TIER_3_CEILING_CENTS: awarded_tier = TIER_3
      elif adjusted_income <  TIER_2_CEILING_CENTS: awarded_tier = TIER_2
      elif adjusted_income <  TIER_1_CEILING_CENTS: awarded_tier = TIER_1
      else:                                         awarded_tier = NONE
      # banding is strictly '<' at every ceiling: an adjusted_income exactly equal
      # to a ceiling falls into the NEXT-LESS-generous band.
    input_set: "single FinancialAidApplication being approved; uses its own annual_income_cents and household_size"
    constants:
      HOUSEHOLD_ALLOWANCE_CENTS: 600000
      TIER_1_CEILING_CENTS: 6000000
      TIER_2_CEILING_CENTS: 4000000
      TIER_3_CEILING_CENTS: 2500000
    precision: "integer cents; no rounding (subtraction only)"
  - name: cycle_billing_amount
    trigger: "POST /subscriptions/{id}/charge-cycle"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is pinned: discount FIRST (over base fee), wallet LAST.
      discount_pct = TIER_DISCOUNT[Client.financial_aid_tier]   # NONE->0.00, TIER_1->0.20, TIER_2->0.40, TIER_3->0.60
      # list_amount: discount the integer base fee, round half-up to whole cents.
      list_amount_cents = round_half_up(base_weekly_fee_cents * (1 - discount_pct))
      # wallet applied is min(available wallet, list amount) — wallet can zero a cycle but never go negative.
      wallet_applied_cents = min(Client.wallet_credit_cents, list_amount_cents)
      charged_amount_cents = list_amount_cents - wallet_applied_cents
      credits_granted = Subscription.weekly_credit_grant
    input_set: "the Subscription being charged + its Client.financial_aid_tier + Client.wallet_credit_cents at charge time"
    constants:
      TIER_DISCOUNT: { NONE: 0.00, TIER_1: 0.20, TIER_2: 0.40, TIER_3: 0.60 }
    precision: "2 decimal places at the dollar level == whole cents, round_half_up; discount applied before wallet, never the reverse"
    variants:
      - name: trialing_first_cycle
        when: "Subscription.status == TRIALING at charge time (first paid cycle)"
        difference: "identical formula; this is the first cycle so current_period_start is set rather than advanced"
      - name: renewal_cycle
        when: "Subscription.status == ACTIVE at charge time"
        difference: "identical formula; current_period_start advances by exactly 7 days"
  - name: pause_proration_refund
    trigger: "POST /subscriptions/{id}/pause"
    algorithm: forward_looking
    formula: |
      # Forward-looking: refund the UNUSED remainder of the current paid week, projecting
      # forward from 'now' to the period end. Whole-day granularity, days rounded DOWN.
      paid_cents          = latest PAID BillingCycle.charged_amount_cents for this subscription
      total_days          = 7
      elapsed_days        = floor((current_clock - current_period_start) / 1 day)   # days fully elapsed
      remaining_days      = max(0, total_days - elapsed_days)
      refund_cents        = round_half_up(paid_cents * remaining_days / total_days)
      # refund is credited to Client.wallet_credit_cents (NOT charged back to card).
    input_set: "the latest PAID BillingCycle for the subscription; current clock vs current_period_start"
    constants:
      TOTAL_DAYS_PER_PERIOD: 7
    precision: "whole cents, round_half_up; elapsed_days uses floor (whole-day granularity)"
    variants:
      - name: same_day_pause
        when: "elapsed_days == 0 (pause on day of charge)"
        difference: "remaining_days == 7 -> full paid_cents refunded to wallet"
      - name: late_week_pause
        when: "elapsed_days >= 7"
        difference: "remaining_days == 0 -> zero refund"
  - name: superbill_reimbursable_amount
    trigger: "POST /superbills/{id}/issue"
    algorithm: aggregation
    formula: |
      # Chronological aggregation over COMPLETED sessions in the window, attributing each
      # session to the per-session list value of the billing cycle it fell within.
      sessions = LiveSessions where match.client_id == Superbill.client_id
                 AND status == COMPLETED
                 AND period_start <= starts_at < period_end          # half-open window
                 ORDER BY starts_at ASC, created_at ASC               # deterministic order
      session_count = count(sessions)
      reimbursable_amount_cents = 0
      for s in sessions:
        cycle = the BillingCycle (status PAID) whose [period_start, period_end) contains s.starts_at
        per_session_value = floor(cycle.list_amount_cents / cycle.credits_granted)   # credits_granted >= 1
        reimbursable_amount_cents += per_session_value
      # Uses list_amount_cents (pre-wallet) NOT charged_amount_cents: HSA reimburses the
      # service value, not the out-of-pocket net of account credit.
    input_set: "COMPLETED LiveSessions for the client with starts_at in [period_start, period_end); their containing PAID BillingCycles"
    constants: {}
    precision: "integer cents; per_session_value uses floor; sum is exact (no post-sum rounding)"
    variants:
      - name: service_value_basis
        when: "always for superbill issuance"
        difference: "attributes list_amount_cents (service value) per session — diverges from the cash a client actually paid when wallet credit was applied"
  - name: match_score
    trigger: "system: Match created (POST /matches and POST /matches/{id}/reassign)"
    algorithm: weighted_scoring
    formula: |
      specialty_overlap = | set(IntakeQuestionnaire.presenting_concerns) ∩ set(Therapist.specialties) |
      score = SPECIALTY_WEIGHT * specialty_overlap
            + STATE_WEIGHT     * (1 if therapist holds VALID license for Client.state_code else 0)
            + SEVERITY_WEIGHT  * (IntakeQuestionnaire.severity_score)
      # integer arithmetic; no rounding.
    input_set: "the proposed Match's Client intake + candidate Therapist.specialties + license state coverage"
    constants:
      SPECIALTY_WEIGHT: 10
      STATE_WEIGHT: 25
      SEVERITY_WEIGHT: 2
    precision: "integer; higher score is a better fit"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "acting role is permitted for the operation per §1.7 RBAC"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "entity_backed role acting on a resource it does not own (Client X-User-ID != resource client_id; Therapist X-User-ID != match.therapist_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "client-owned and therapist-owned resource operations"
  - priority: 4
    category: existence
    check: "every path-referenced resource exists, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 5
    category: existence
    check: "every FK in the request body references an existing resource"
    error_id: ERR_REFERENCED_NOT_FOUND
    http_status: 404
    applies_to: "create endpoints with body FKs"
  - priority: 6
    category: state
    check: "request body well-formed: required fields present, enums in allowed set, numeric ranges respected, ends_at > starts_at"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 7
    category: state
    check: "target resource is in a valid state for this transition (state-machine from-state)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 8
    category: business_safety
    check: "client risk_flag == ACUTE blocks match acceptance and new live-session scheduling"
    error_id: ERR_CLIENT_RISK_BLOCKED
    http_status: 409
    applies_to: "POST /matches/{id}/accept, POST /matches/{id}/live-sessions"
  - priority: 9
    category: business_safety
    check: "client with crisis_indicator==true or intake severity_score>=8 cannot be matched until ClinicalAdmin clears intake"
    error_id: ERR_INTAKE_NOT_CLEARED
    http_status: 409
    applies_to: "POST /matches (proposal creation)"
  - priority: 10
    category: business_referential
    check: "therapist must hold a VALID TherapistLicense for the Client.state_code to be matched/accepted/reassigned"
    error_id: ERR_LICENSE_STATE_MISMATCH
    http_status: 409
    applies_to: "POST /matches, POST /matches/{id}/accept, POST /matches/{id}/reassign"
  - priority: 11
    category: business_constraint
    check: "OCC: expected_<parent>_version must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /matches/{id}/live-sessions, POST /subscriptions/{id}/pause"
  - priority: 12
    category: business_temporal
    check: "a new LiveSession for a match must not overlap [starts_at, ends_at) with another non-terminal LiveSession on the SAME match (closed-adjacency allowed: end==start is OK)"
    error_id: ERR_SESSION_OVERLAP
    http_status: 409
    applies_to: "POST /matches/{id}/live-sessions"
  - priority: 13
    category: business_temporal
    check: "a new LiveSession must not fall within the therapist BUFFER of another non-terminal session for the SAME therapist across ANY of their matches (buffered adjacency: sessions must be >= 15 min apart)"
    error_id: ERR_THERAPIST_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /matches/{id}/live-sessions"
  - priority: 14
    category: business_constraint
    check: "scheduling a LiveSession requires >= 1 AVAILABLE SessionCredit (not expired) for the client"
    error_id: ERR_NO_CREDIT
    http_status: 409
    applies_to: "POST /matches/{id}/live-sessions"
  - priority: 15
    category: business_constraint
    check: "messages may only be posted to a thread in status OPEN; FROZEN/ARCHIVED reject"
    error_id: ERR_THREAD_NOT_OPEN
    http_status: 409
    applies_to: "POST /threads/{id}/messages"
  - priority: 16
    category: business_constraint
    check: "a Client may hold only one non-terminal Subscription; creating a second rejects"
    error_id: ERR_DUPLICATE_SUBSCRIPTION
    http_status: 409
    applies_to: "POST /subscriptions"
  - priority: 17
    category: business_temporal
    check: "renewal charge-cycle only valid once current clock >= current_period_start + 7 days"
    error_id: ERR_CYCLE_NOT_DUE
    http_status: 409
    applies_to: "POST /subscriptions/{id}/charge-cycle"
  - priority: 18
    category: business_constraint
    check: "reassignment requires a non-empty eligible-therapist candidate set"
    error_id: ERR_NO_ELIGIBLE_THERAPIST
    http_status: 409
    applies_to: "POST /matches/{id}/reassign"
  - priority: 19
    category: business_temporal
    check: "finalize-cancel only valid once current clock >= cancel_effective_on"
    error_id: ERR_CANCEL_NOT_DUE
    http_status: 409
    applies_to: "POST /subscriptions/{id}/finalize-cancel"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Clients ----
  - method: POST
    path: "/clients"
    description: "register a client account (starts PENDING_INTAKE)"
    roles: [Client]
    code: 201
    input: [email, full_name, state_code]
    output: Client
    side_effects: ["create Client with status=PENDING_INTAKE, financial_aid_tier=NONE, wallet_credit_cents=0, risk_flag=NONE"]
  - method: GET
    path: "/clients/{id}"
    description: "fetch a client"
    roles: [Client, Therapist, ClinicalAdmin, BillingAdmin]
    code: 200
    input: []
    output: Client
    side_effects: []
  - method: GET
    path: "/clients"
    description: "list clients (paginated; filterable by status)"
    roles: [ClinicalAdmin, BillingAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Client[]
    side_effects: []
  - method: POST
    path: "/clients/{id}/intake"
    description: "submit the intake questionnaire (PENDING_INTAKE -> AWAITING_MATCH unless severity/crisis gate fires)"
    roles: [Client]
    code: 201
    input: [presenting_concerns, severity_score, "crisis_indicator?"]
    output: IntakeQuestionnaire
    side_effects: ["create IntakeQuestionnaire", "set submitted_at = clock", "if neither gate fires: Client.status -> AWAITING_MATCH", "increments Client.version by 1"]
  - method: GET
    path: "/clients/{id}/intake"
    description: "fetch the client's intake questionnaire (array of 0-1)"
    roles: [Client, ClinicalAdmin]
    code: 200
    input: []
    output: IntakeQuestionnaire[]
    side_effects: []
  - method: POST
    path: "/clients/{id}/clear-intake"
    description: "ClinicalAdmin clears the severity/crisis intake gate (PENDING_INTAKE -> AWAITING_MATCH)"
    roles: [ClinicalAdmin]
    code: 200
    input: []
    output: Client
    side_effects: ["Client.status -> AWAITING_MATCH", "increments Client.version by 1"]
  - method: GET
    path: "/clients/{id}/subscriptions"
    description: "list a client's subscriptions"
    roles: [Client, BillingAdmin]
    code: 200
    input: []
    output: Subscription[]
    side_effects: []
  - method: GET
    path: "/clients/{id}/session-credits"
    description: "list a client's session credits"
    roles: [Client, ClinicalAdmin, BillingAdmin]
    code: 200
    input: ["status?"]
    output: SessionCredit[]
    side_effects: []
  - method: GET
    path: "/clients/{id}/crisis-escalations"
    description: "list a client's crisis escalations"
    roles: [Client, Therapist, ClinicalAdmin]
    code: 200
    input: []
    output: CrisisEscalation[]
    side_effects: []
  - method: GET
    path: "/clients/{id}/financial-aid-applications"
    description: "list a client's financial-aid applications"
    roles: [Client, BillingAdmin]
    code: 200
    input: []
    output: FinancialAidApplication[]
    side_effects: []
  - method: GET
    path: "/clients/{id}/superbills"
    description: "list a client's superbills"
    roles: [Client, BillingAdmin]
    code: 200
    input: []
    output: Superbill[]
    side_effects: []
  # ---- Therapists & licenses ----
  - method: POST
    path: "/therapists"
    description: "create a therapist (ClinicalAdmin onboards; starts ONBOARDING)"
    roles: [ClinicalAdmin]
    code: 201
    input: [full_name, specialties, "max_active_caseload?"]
    output: Therapist
    side_effects: ["create Therapist status=ONBOARDING, active_caseload=0"]
  - method: GET
    path: "/therapists/{id}"
    description: "fetch a therapist"
    roles: [Client, Therapist, ClinicalAdmin, BillingAdmin]
    code: 200
    input: []
    output: Therapist
    side_effects: []
  - method: GET
    path: "/therapists"
    description: "list therapists (paginated; filter by status/state coverage)"
    roles: [ClinicalAdmin, BillingAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Therapist[]
    side_effects: []
  - method: POST
    path: "/therapists/{id}/licenses"
    description: "add a state license to a therapist"
    roles: [ClinicalAdmin]
    code: 201
    input: [state_code, expires_on]
    output: TherapistLicense
    side_effects: ["create TherapistLicense status=VALID if expires_on > clock else EXPIRED"]
  - method: GET
    path: "/therapists/{id}/licenses"
    description: "list a therapist's licenses"
    roles: [ClinicalAdmin, BillingAdmin]
    code: 200
    input: ["state_code?"]
    output: TherapistLicense[]
    side_effects: []
  - method: POST
    path: "/therapists/{id}/activate"
    description: "ClinicalAdmin activates an onboarded therapist (ONBOARDING -> ACCEPTING)"
    roles: [ClinicalAdmin]
    code: 200
    input: []
    output: Therapist
    side_effects: ["Therapist.status -> ACCEPTING", "increments Therapist.version by 1"]
  - method: POST
    path: "/therapists/{id}/deactivate"
    description: "ClinicalAdmin deactivates a therapist with no ACTIVE matches (-> INACTIVE)"
    roles: [ClinicalAdmin]
    code: 200
    input: []
    output: Therapist
    side_effects: ["Therapist.status -> INACTIVE", "increments Therapist.version by 1"]
  - method: GET
    path: "/therapists/{id}/matches"
    description: "list matches for a therapist"
    roles: [Therapist, ClinicalAdmin]
    code: 200
    input: ["status?"]
    output: Match[]
    side_effects: []
  # ---- Matches ----
  - method: POST
    path: "/matches"
    description: "ClinicalAdmin proposes a Match between an AWAITING_MATCH client and a therapist (computes match_score)"
    roles: [ClinicalAdmin]
    code: 201
    input: [client_id, therapist_id]
    output: Match
    side_effects: ["create Match status=PROPOSED", "compute match_score"]
  - method: GET
    path: "/matches/{id}"
    description: "fetch a match"
    roles: [Client, Therapist, ClinicalAdmin]
    code: 200
    input: []
    output: Match
    side_effects: []
  - method: GET
    path: "/matches"
    description: "list matches (filter by client_id/therapist_id/status/superseded_by_match_id)"
    roles: [ClinicalAdmin]
    code: 200
    input: ["client_id?", "therapist_id?", "status?", "superseded_by_match_id?", "limit?", "offset?"]
    output: Match[]
    side_effects: []
  - method: POST
    path: "/matches/{id}/accept"
    description: "client accepts a proposed match (PROPOSED -> ACTIVE)"
    roles: [Client]
    code: 200
    input: []
    output: Match
    side_effects: ["Match.status -> ACTIVE", "Therapist.active_caseload += 1 (may -> FULL)", "create OPEN MessageThread", "Client AWAITING_MATCH -> ACTIVE", "increments Match.version by 1"]
  - method: POST
    path: "/matches/{id}/request-switch"
    description: "client or therapist requests a therapist switch (ACTIVE -> SWITCH_REQUESTED)"
    roles: [Client, Therapist]
    code: 200
    input: [switch_reason]
    output: Match
    side_effects: ["Match.status -> SWITCH_REQUESTED", "freeze MessageThread OPEN -> FROZEN", "increments Match.version by 1"]
  - method: POST
    path: "/matches/{id}/reassign"
    description: "ClinicalAdmin reassigns a switch-requested match to a new eligible therapist (SWITCH_REQUESTED -> ENDED; successor ACTIVE)"
    roles: [ClinicalAdmin]
    code: 201
    input: []
    output: Match
    side_effects: ["create successor Match ACTIVE (its ACTIVE side-effects fire)", "old Match.superseded_by_match_id = successor.id", "old Match -> ENDED", "old Therapist.active_caseload -= 1 (may FULL -> ACCEPTING)", "archive old thread", "increments old Match.version by 1"]
  - method: GET
    path: "/matches/{id}/thread"
    description: "fetch the match's message thread (array of 0-1)"
    roles: [Client, Therapist, ClinicalAdmin]
    code: 200
    input: []
    output: MessageThread[]
    side_effects: []
  - method: GET
    path: "/matches/{id}/live-sessions"
    description: "list a match's live sessions"
    roles: [Client, Therapist, ClinicalAdmin]
    code: 200
    input: ["status?"]
    output: LiveSession[]
    side_effects: []
  - method: POST
    path: "/matches/{id}/live-sessions"
    description: "schedule a live session against an ACTIVE match (reserves one AVAILABLE credit; OCC on match.version)"
    roles: [Client, Therapist]
    code: 201
    input: [starts_at, ends_at, expected_match_version]
    output: LiveSession
    side_effects: ["create LiveSession SCHEDULED", "reserve one AVAILABLE SessionCredit -> RESERVED, set its live_session_id", "increments Match.version by 1"]
  # ---- Live sessions ----
  - method: GET
    path: "/live-sessions/{id}"
    description: "fetch a live session"
    roles: [Client, Therapist, ClinicalAdmin]
    code: 200
    input: []
    output: LiveSession
    side_effects: []
  - method: GET
    path: "/live-sessions/{id}/session-credits"
    description: "list session credits reserved/consumed by a live session (array of 0-1)"
    roles: [Client, Therapist, ClinicalAdmin, BillingAdmin]
    code: 200
    input: []
    output: SessionCredit[]
    side_effects: []
  - method: POST
    path: "/live-sessions/{id}/complete"
    description: "therapist marks a session COMPLETED (consumes the reserved credit)"
    roles: [Therapist]
    code: 200
    input: []
    output: LiveSession
    side_effects: ["LiveSession.status -> COMPLETED", "reserved SessionCredit -> CONSUMED", "increments LiveSession.version by 1"]
  - method: POST
    path: "/live-sessions/{id}/cancel"
    description: "client/therapist cancels a session (credit returned or forfeited per 24h window)"
    roles: [Client, Therapist]
    code: 200
    input: []
    output: LiveSession
    side_effects: ["LiveSession.status -> CANCELLED", "set cancelled_within_window", "credit -> AVAILABLE (outside window) or CONSUMED (inside window)", "increments LiveSession.version by 1"]
  - method: POST
    path: "/live-sessions/{id}/no-show"
    description: "therapist marks a no-show after ends_at (credit forfeited)"
    roles: [Therapist]
    code: 200
    input: []
    output: LiveSession
    side_effects: ["LiveSession.status -> NO_SHOW", "reserved SessionCredit -> CONSUMED", "increments LiveSession.version by 1"]
  # ---- Threads & messages ----
  - method: GET
    path: "/threads/{id}"
    description: "fetch a message thread"
    roles: [Client, Therapist, ClinicalAdmin]
    code: 200
    input: []
    output: MessageThread
    side_effects: []
  - method: POST
    path: "/threads/{id}/messages"
    description: "post an async message to an OPEN thread"
    roles: [Client, Therapist]
    code: 201
    input: [body]
    output: Message
    side_effects: ["create Message with sender_role from acting role", "if sender is CLIENT: increment thread.unread_for_therapist"]
  - method: GET
    path: "/threads/{id}/messages"
    description: "list messages in a thread (paginated)"
    roles: [Client, Therapist, ClinicalAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Message[]
    side_effects: []
  # ---- Subscriptions & billing ----
  - method: POST
    path: "/subscriptions"
    description: "create a subscription for a client (starts TRIALING)"
    roles: [Client, BillingAdmin]
    code: 201
    input: [client_id, "base_weekly_fee_cents?", "weekly_credit_grant?"]
    output: Subscription
    side_effects: ["create Subscription status=TRIALING"]
  - method: GET
    path: "/subscriptions/{id}"
    description: "fetch a subscription"
    roles: [Client, BillingAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: POST
    path: "/subscriptions/{id}/charge-cycle"
    description: "BillingAdmin charges a billing cycle (first paid cycle activates; subsequent renewals self-loop)"
    roles: [BillingAdmin]
    code: 201
    input: []
    output: BillingCycle
    side_effects: ["create BillingCycle, run cycle_billing_amount", "BillingCycle PAID", "grant weekly_credit_grant SessionCredits", "debit wallet_credit_cents by wallet_applied", "Subscription TRIALING->ACTIVE or advance current_period_start"]
  - method: GET
    path: "/subscriptions/{id}/billing-cycles"
    description: "list a subscription's billing cycles"
    roles: [Client, BillingAdmin]
    code: 200
    input: ["status?"]
    output: BillingCycle[]
    side_effects: []
  - method: POST
    path: "/subscriptions/{id}/pause"
    description: "client pauses a subscription with a resume date (ACTIVE -> PAUSED; prorated refund to wallet; OCC on subscription.version)"
    roles: [Client]
    code: 200
    input: [resume_on, expected_subscription_version]
    output: Subscription
    side_effects: ["Subscription -> PAUSED", "set pause_resumes_on", "run pause_proration_refund -> credit wallet", "expire current AVAILABLE credits", "increments Subscription.version by 1"]
  - method: POST
    path: "/subscriptions/{id}/resume"
    description: "client resumes a paused subscription (PAUSED -> ACTIVE)"
    roles: [Client]
    code: 200
    input: []
    output: Subscription
    side_effects: ["Subscription -> ACTIVE", "clear pause_resumes_on", "set current_period_start = clock", "increments Subscription.version by 1"]
  - method: POST
    path: "/subscriptions/{id}/cancel"
    description: "client schedules cancellation at end of paid period (ACTIVE/TRIALING -> CANCEL_SCHEDULED)"
    roles: [Client]
    code: 200
    input: []
    output: Subscription
    side_effects: ["Subscription -> CANCEL_SCHEDULED", "set cancel_effective_on", "increments Subscription.version by 1"]
  - method: POST
    path: "/subscriptions/{id}/finalize-cancel"
    description: "BillingAdmin finalizes a scheduled cancellation once due (CANCEL_SCHEDULED -> CANCELLED; cascades Client CLOSED)"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: ["Subscription -> CANCELLED", "cascade Client -> CLOSED (end matches, expire credits, archive threads)", "increments Subscription.version by 1"]
  - method: GET
    path: "/billing-cycles/{id}"
    description: "fetch a billing cycle"
    roles: [Client, BillingAdmin]
    code: 200
    input: []
    output: BillingCycle
    side_effects: []
  - method: GET
    path: "/billing-cycles/{id}/session-credits"
    description: "list session credits granted by a billing cycle"
    roles: [Client, BillingAdmin]
    code: 200
    input: []
    output: SessionCredit[]
    side_effects: []
  - method: GET
    path: "/session-credits/{id}"
    description: "fetch a session credit"
    roles: [Client, ClinicalAdmin, BillingAdmin]
    code: 200
    input: []
    output: SessionCredit
    side_effects: []
  - method: GET
    path: "/session-credits/{id}/live-sessions"
    description: "list the live session that reserved/consumed this credit (array of 0-1)"
    roles: [Client, Therapist, ClinicalAdmin, BillingAdmin]
    code: 200
    input: []
    output: LiveSession[]
    side_effects: []
  # ---- Crisis escalations ----
  - method: POST
    path: "/clients/{id}/crisis-escalations"
    description: "raise a crisis escalation for a client (attaches safety resources; ACUTE suspends client)"
    roles: [Client, Therapist, ClinicalAdmin]
    code: 201
    input: [severity]
    output: CrisisEscalation
    side_effects: ["create CrisisEscalation OPEN, safety_resources_sent=true", "if ACUTE: Client -> SUSPENDED, risk_flag=ACUTE, freeze threads", "if ELEVATED: Client.risk_flag=ELEVATED"]
  - method: GET
    path: "/crisis-escalations/{id}"
    description: "fetch a crisis escalation"
    roles: [Client, Therapist, ClinicalAdmin]
    code: 200
    input: []
    output: CrisisEscalation
    side_effects: []
  - method: POST
    path: "/crisis-escalations/{id}/acknowledge"
    description: "ClinicalAdmin acknowledges an escalation (OPEN -> ACKNOWLEDGED)"
    roles: [ClinicalAdmin]
    code: 200
    input: []
    output: CrisisEscalation
    side_effects: ["CrisisEscalation -> ACKNOWLEDGED", "increments CrisisEscalation.version by 1"]
  - method: POST
    path: "/crisis-escalations/{id}/resolve"
    description: "ClinicalAdmin resolves an escalation (ACKNOWLEDGED -> RESOLVED; may restore client ACTIVE)"
    roles: [ClinicalAdmin]
    code: 200
    input: []
    output: CrisisEscalation
    side_effects: ["CrisisEscalation -> RESOLVED", "if ACUTE and no other open ACUTE: Client SUSPENDED -> ACTIVE, risk_flag=NONE, unfreeze threads", "increments CrisisEscalation.version by 1"]
  # ---- Financial aid ----
  - method: POST
    path: "/clients/{id}/financial-aid-applications"
    description: "client submits a financial-aid application"
    roles: [Client]
    code: 201
    input: [annual_income_cents, household_size]
    output: FinancialAidApplication
    side_effects: ["create FinancialAidApplication SUBMITTED"]
  - method: GET
    path: "/financial-aid-applications/{id}"
    description: "fetch a financial-aid application"
    roles: [Client, BillingAdmin]
    code: 200
    input: []
    output: FinancialAidApplication
    side_effects: []
  - method: POST
    path: "/financial-aid-applications/{id}/approve"
    description: "BillingAdmin approves aid (bands awarded_tier, copies onto Client)"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: FinancialAidApplication
    side_effects: ["run financial_aid_tier_banding", "set awarded_tier", "copy to Client.financial_aid_tier", "increments FinancialAidApplication.version by 1"]
  - method: POST
    path: "/financial-aid-applications/{id}/deny"
    description: "BillingAdmin denies aid (no tier change)"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: FinancialAidApplication
    side_effects: ["FinancialAidApplication -> DENIED", "increments FinancialAidApplication.version by 1"]
  # ---- Superbills ----
  - method: POST
    path: "/clients/{id}/superbills"
    description: "BillingAdmin drafts a superbill for a reimbursement window"
    roles: [BillingAdmin]
    code: 201
    input: [period_start, period_end]
    output: Superbill
    side_effects: ["create Superbill DRAFT", "compute session_count and reimbursable_amount_cents over window"]
  - method: GET
    path: "/superbills/{id}"
    description: "fetch a superbill"
    roles: [Client, BillingAdmin]
    code: 200
    input: []
    output: Superbill
    side_effects: []
  - method: POST
    path: "/superbills/{id}/issue"
    description: "BillingAdmin issues a drafted superbill (recomputes totals; requires >=1 completed session)"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: Superbill
    side_effects: ["run superbill_reimbursable_amount", "Superbill -> ISSUED", "increments Superbill.version by 1"]
  - method: POST
    path: "/superbills/{id}/void"
    description: "BillingAdmin voids an issued superbill"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: Superbill
    side_effects: ["Superbill -> VOID", "increments Superbill.version by 1"]
  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "set the logical clock to an arbitrary UTC instant. Server startup default is 2026-05-01T00:00:00Z; before any set_current_utc the clock reads exactly this default and never falls back to wall-clock time."
    roles: [ClinicalAdmin, BillingAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["set logical clock; recompute TherapistLicense.status against new clock; auto-resume PAUSED subscriptions whose pause_resumes_on <= clock; auto-finalize CANCEL_SCHEDULED subscriptions whose cancel_effective_on <= clock; expire SessionCredits whose expires_on <= clock"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/unknown X-User-Role or missing X-User-ID"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "acting role not permitted for the operation"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "entity_backed role acting on a resource it does not own"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a path-referenced resource does not exist"
  - id: ERR_REFERENCED_NOT_FOUND
    http: 404
    condition: "a body FK references a non-existent resource"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, bad enum, out-of-range number, or ends_at <= starts_at"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "target resource not in a valid state for the requested transition"
  - id: ERR_CLIENT_RISK_BLOCKED
    http: 409
    condition: "client risk_flag == ACUTE blocks match acceptance / session scheduling"
  - id: ERR_INTAKE_NOT_CLEARED
    http: 409
    condition: "matching a client whose intake severity>=8 or crisis_indicator==true has not been cleared"
  - id: ERR_LICENSE_STATE_MISMATCH
    http: 409
    condition: "therapist holds no VALID license for the client's state_code"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not equal the parent's current version"
  - id: ERR_SESSION_OVERLAP
    http: 409
    condition: "new live session overlaps another non-terminal session on the same match"
  - id: ERR_THERAPIST_DOUBLE_BOOKED
    http: 409
    condition: "new live session falls within the 15-minute therapist buffer of another non-terminal session for the same therapist"
  - id: ERR_NO_CREDIT
    http: 409
    condition: "no AVAILABLE (non-expired) session credit to reserve"
  - id: ERR_THREAD_NOT_OPEN
    http: 409
    condition: "posting a message to a FROZEN or ARCHIVED thread"
  - id: ERR_DUPLICATE_SUBSCRIPTION
    http: 409
    condition: "client already has a non-terminal subscription"
  - id: ERR_CYCLE_NOT_DUE
    http: 409
    condition: "renewal charge before current_period_start + 7 days"
  - id: ERR_NO_ELIGIBLE_THERAPIST
    http: 409
    condition: "reassignment found no eligible candidate therapist"
  - id: ERR_CANCEL_NOT_DUE
    http: 409
    condition: "finalize-cancel before cancel_effective_on"
  - id: ERR_VALIDATION
    http: 422
    condition: "semantically invalid combination not caught by ERR_INVALID_REQUEST (e.g., resume_on beyond the 84-day pause cap, severity_score out of 0-10 after type check)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Client
    description: "a person who registers, completes intake, subscribes, messages, schedules sessions, and manages their own account"
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /clients/{id}/intake (own)"
      - "POST /matches/{id}/accept (own)"
      - "POST /subscriptions/{id}/pause (own)"
      - "POST /subscriptions/{id}/resume (own)"
      - "POST /subscriptions/{id}/cancel (own)"
      - "POST /clients/{id}/financial-aid-applications (own)"
    shared_operations:
      - "POST /clients (self-register)"
      - "POST /matches/{id}/request-switch (with Therapist)"
      - "POST /matches/{id}/live-sessions (with Therapist)"
      - "POST /live-sessions/{id}/cancel (with Therapist)"
      - "POST /threads/{id}/messages (with Therapist)"
      - "POST /clients/{id}/crisis-escalations (with Therapist/ClinicalAdmin)"
      - "POST /subscriptions (with BillingAdmin)"
      - "GET own resources"
  - name: Therapist
    description: "a licensed provider matched to clients; messages, schedules/completes sessions on own matches"
    identity: "entity_backed:Therapist"
    exclusive_operations:
      - "POST /live-sessions/{id}/complete (own match)"
      - "POST /live-sessions/{id}/no-show (own match)"
    shared_operations:
      - "POST /matches/{id}/request-switch (with Client)"
      - "POST /matches/{id}/live-sessions (with Client)"
      - "POST /live-sessions/{id}/cancel (with Client)"
      - "POST /threads/{id}/messages (with Client)"
      - "POST /clients/{id}/crisis-escalations (with Client/ClinicalAdmin)"
      - "GET own matches/threads/sessions"
  - name: ClinicalAdmin
    description: "operational clinician-ops role: onboards/licenses therapists, proposes/reassigns matches, clears intake, manages crisis escalations"
    identity: "opaque"
    exclusive_operations:
      - "POST /therapists, POST /therapists/{id}/licenses"
      - "POST /therapists/{id}/activate, POST /therapists/{id}/deactivate"
      - "POST /matches (proposal)"
      - "POST /matches/{id}/reassign"
      - "POST /clients/{id}/clear-intake"
      - "POST /crisis-escalations/{id}/acknowledge"
      - "POST /crisis-escalations/{id}/resolve"
    shared_operations:
      - "POST /clients/{id}/crisis-escalations (with Client/Therapist)"
      - "GET clinical resources"
  - name: BillingAdmin
    description: "operational finance role: subscriptions billing, financial-aid decisions, superbills"
    identity: "opaque"
    exclusive_operations:
      - "POST /subscriptions/{id}/charge-cycle"
      - "POST /subscriptions/{id}/finalize-cancel"
      - "POST /financial-aid-applications/{id}/approve"
      - "POST /financial-aid-applications/{id}/deny"
      - "POST /clients/{id}/superbills"
      - "POST /superbills/{id}/issue, POST /superbills/{id}/void"
    shared_operations:
      - "POST /subscriptions (with Client)"
      - "GET billing resources"
