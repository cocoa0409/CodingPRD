              payload: { locality_name: "Ratify One", state_code: "KS", contact_email: "pw@r1.gov" }
              as: ProgramAdministrator
              captures: { loc1: $.data.id }
            - call: "POST /localities"
              payload: { locality_name: "Ratify Two", state_code: "KS", contact_email: "pw@r2.gov" }
