            - { call: "POST /api/visits", payload: { facility_id: "${fI}", visit_type: "ROUTINE", inspector_user_id: "sup-4", scheduled_start: "2026-07-01T09:00:00Z", scheduled_end: "2026-07-01T12:00:00Z" }, as: AccountManager, captures: { vI2: $.data.id, vI2_st: $.data.status } }
