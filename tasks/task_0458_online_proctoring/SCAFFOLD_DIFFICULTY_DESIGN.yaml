              as: SchedulingCoordinator
              captures: { exam_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T09:00:00Z" }
              as: SchedulingCoordinator
            - call: "POST /appointments"
              payload: { exam_id: "${exam_id}", candidate_id: "${cand_id}", proctor_id: "${opener_id}", scheduled_start_utc: "2026-07-01T09:00:00Z" }
              as: SchedulingCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/check-in"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /sessions/${sess_id}/pause"
              payload: {}
              as: Proctor
              as_user_id: "${opener_id}"
            - call: "POST /sessions/${sess_id}/resume"
              payload: {}
              as: Proctor
              as_user_id: "${opener_id}"
            - call: "POST /sessions/${sess_id}/flags"
              payload: { kind: "GAZE_OFF_SCREEN", severity: "MINOR" }
              as: Proctor
              as_user_id: "${opener_id}"
              captures: { flag_id: $.data.id }
            - call: "POST /escalations"
              payload: { session_id: "${sess_id}", incident_flag_id: "${flag_id}" }
              as: Proctor
              as_user_id: "${opener_id}"
              captures: { esc_id: $.data.id }
            - call: "POST /escalations/${esc_id}/claim"
              payload: {}
