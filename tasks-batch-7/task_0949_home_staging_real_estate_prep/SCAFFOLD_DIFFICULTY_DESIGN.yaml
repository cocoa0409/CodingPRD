          assert:
            - "DamageAssessment.${as_id}.depreciated_replacement_value == 840.00"
            - "DamageAssessment.${as_id}.repair_cost_estimate == 504.01"
            - "DamageAssessment.${as_id}.disposition == REPLACE"
