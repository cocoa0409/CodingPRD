      - name: case_list_missing_auth_headers_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role/X-User-ID is rejected ERR_UNAUTHENTICATED (401) before any role/existence check runs."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /v1/plans", as: RolloverProcessor, captures: { err: "$.data.error_id" } }
          assert:
            - "when the harness strips auth headers: error_id == ERR_UNAUTHENTICATED, HTTP 401 (the call's declared role documents intent only)"

      - name: amount_exceeds_vested_rejected
        claim_type: violation_to_error
