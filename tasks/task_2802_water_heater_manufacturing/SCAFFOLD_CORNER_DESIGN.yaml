  - section: endpoints
    instances:
      - name: clock_set_and_read_roundtrip_drives_every_timestamp
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /mfg/_clock/set_current_utc]
          - endpoints[GET /mfg/_clock]
          - entities.Supplier.fields.created_at
          - roles.PlantAdmin.exclusive_operations
        distinguishing_aspect: >
          The clock endpoints are the only writable time source, and every other endpoint must read them rather
          than the host wall clock: a row created after a set carries exactly the set instant in created_at AND
          updated_at, and a later mutation moves updated_at only. GET /mfg/_clock is also the single endpoint
          exempted from the authentication rule at priority 1, while the setter is PlantAdmin-exclusive.
        test_recipe:
          setup:
            - "Nothing exists yet; the logical clock is at its declared default 2026-08-01T00:00:00Z."
          setup_api_calls:

          trigger:
            - call: "GET /mfg/_clock"
              payload: {}
              as: WarrantyAnalyst
            - call: "POST /mfg/_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T13:45:00Z" }
              as: PlantAdmin
            - call: "GET /mfg/_clock"
              payload: {}
              as: PlantOperator
            - call: "POST /mfg/suppliers"
              payload: { name: "Meridian Controls", component_category: "GAS_VALVE", audit_score: 96, defect_ppm: 1000, open_capa_count: 0 }
              as: SupplierQualityManager
              captures: { s1_id: $.data.id }
            - call: "POST /mfg/_clock/set_current_utc"
              payload: { current_utc: "2026-09-16T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /mfg/suppliers/${s1_id}/qualify"
              payload: { audit_score: 96, defect_ppm: 1000, open_capa_count: 0, qualified_until: "2027-06-30T00:00:00Z" }
              as: SupplierQualityManager
            - call: "GET /mfg/suppliers/${s1_id}"
              payload: {}
              as: PlantAdmin
          assert:
            - "the first read returns 200 with current_utc == '2026-08-01T00:00:00Z' (the declared default, not the host clock)"
            - "the set returns 200 and the following read returns current_utc == '2026-09-15T13:45:00Z'"
            - "the created Supplier has created_at == '2026-09-15T13:45:00Z' and updated_at == '2026-09-15T13:45:00Z' with version == 1"
            - "after the second set the qualify returns 200 and the Supplier has updated_at == '2026-09-16T00:00:00Z' while created_at is still '2026-09-15T13:45:00Z'"
            - "Supplier.${s1_id}.version == 2 and qualification_status == QUALIFIED"
            - "every GET response carries meta.api_request_id and meta.api_request_timestamp with response_type == 'object'"
      - name: warranty_analysis_read_hardness_mix_and_empty_cohort
        claim_type: computed_read
        grounds:
          - endpoints[GET /mfg/product-models/{id}/warranty-analysis]
          - calculations.tank_failure_rate_by_period
          - calculations.water_hardness_band_factor
          - calculations.unit_months_in_service
          - validations[priority 3]
          - validations[priority 4]
          - errors[ERR_PRODUCT_MODEL_NOT_FOUND]
        distinguishing_aspect: >
          A pure computed read with three separable outputs: the water-chemistry census of the cohort, the
          exposure denominator, and the rate. With no claim on file the numerator is 0, so the rate must be 0.0
