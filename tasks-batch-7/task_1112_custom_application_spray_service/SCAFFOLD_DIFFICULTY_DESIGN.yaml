  # ------------------------------------------------------------- rule 6 -----
  - rule_id: boundary_precision_check
    instances:
      - name: wind_exactly_at_envelope_max_passes
        grounds:
          - calculations.mix_weather_envelope
          - errors[ERR_WEATHER_WINDOW_VIOLATION]
        distinguishing_aspect: |
          Wind-speed metric on the start endpoint: wind_mph exactly equal to the
          effective cap min(10,15)=10 must PASS (<= semantics), while 10.1 must
          FAIL — a one-tenth mph difference flips the outcome.
        test_recipe:
          setup:
            - "Base fixture; WO1 SCHEDULED 2026-05-10 08:00-11:00Z; clock 2026-05-10T08:00:00Z"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Green Acres", billing_email: "g1@farm.test", rate_per_acre_cents: 1200, credit_limit_cents: 2000000 }, as: CoopAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /api/fields", payload: { customer_id: "${c_id}", label: "North 40", crop: "CORN", acres: 100, buffer_clearance_ft: 300 }, as: Grower, as_user_id: "${c_id}", captures: { f_id: $.data.id } }
            - { call: "POST /api/products", payload: { name: "WeedOut", epa_registration_no: "EPA-100-1", category: "HERBICIDE", rei_hours: 24, max_wind_mph: 10, min_temp_f: 40, max_temp_f: 85, required_buffer_ft: 100, unit_cost_cents: 5000, markup_pct: 10 }, as: CoopAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/products", payload: { name: "FungiStop", epa_registration_no: "EPA-200-2", category: "FUNGICIDE", rei_hours: 48, max_wind_mph: 15, min_temp_f: 50, max_temp_f: 90, required_buffer_ft: 0, unit_cost_cents: 2500, markup_pct: 20 }, as: CoopAdmin, captures: { p2: $.data.id } }
            - { call: "POST /api/prescriptions", payload: { field_id: "${f_id}", season_year: 2026, valid_from: "2026-05-01T00:00:00Z", valid_to: "2026-06-30T23:59:59Z", carrier_gpa: 12, lines: [ { product_id: "${p1}", rate_per_acre: 1.5 }, { product_id: "${p2}", rate_per_acre: 0.4 } ] }, as: Agronomist, captures: { rx: $.data.id } }
            - { call: "GET /api/fields/${f_id}", as: CoopAdmin, captures: { f_v: $.data.version } }
            - { call: "POST /api/prescriptions/${rx}/approve", payload: { expected_field_version: "${f_v}" }, as: Agronomist }
            - { call: "POST /api/applicators", payload: { display_name: "Ann", license_no: "L-100", license_expires_on: "2027-01-01T00:00:00Z", license_categories: ["HERBICIDE", "FUNGICIDE"] }, as: CoopAdmin, captures: { ap: $.data.id } }
            - { call: "POST /api/equipment", payload: { unit_label: "Sprayer-1", tank_capacity_gal: 400 }, as: CoopAdmin, captures: { eq: $.data.id } }
            - { call: "POST /api/calibration-records", payload: { equipment_id: "${eq}", target_gpa: 20.0, measured_gpa: 20.5 }, as: Applicator, as_user_id: "${ap}" }
            - { call: "POST /api/work-orders", payload: { customer_id: "${c_id}", field_id: "${f_id}", prescription_id: "${rx}", acres_to_treat: 100 }, as: Grower, as_user_id: "${c_id}", captures: { wo: $.data.id } }
            - { call: "POST /api/work-orders/${wo}/schedule", payload: { applicator_id: "${ap}", equipment_id: "${eq}", scheduled_start: "2026-05-10T08:00:00Z", scheduled_end: "2026-05-10T11:00:00Z" }, as: Dispatcher }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T08:00:00Z" }, as: CoopAdmin }
          trigger:
            - { call: "POST /api/weather-observations", payload: { observed_at: "2026-05-10T07:30:00Z", wind_mph: 10.0, temp_f: 65, inversion_present: false }, as: Applicator, as_user_id: "${ap}" }
            - { call: "POST /api/work-orders/${wo}/start", as: Applicator, as_user_id: "${ap}", captures: { st: $.data.status } }
          assert:
            - "start with wind_mph == 10.0 (exactly the effective cap) succeeds: WorkOrder.${wo}.status == IN_PROGRESS"

      - name: calibration_error_exactly_5_pct_passes
        grounds:
          - calculations.calibration_verdict
          - errors[ERR_CALIBRATION_OVERDUE]
        distinguishing_aspect: |
          Calibration-error metric on the calibration-records endpoint (a
          different metric and endpoint than the wind boundary): error_pct
          exactly 5.0 must PASS (<= semantics) while 5.5 must FAIL.
        test_recipe:
          setup:
            - "Applicator AP1 exists; two sprayers EQ_A and EQ_B freshly created (no calibration yet)"
          setup_api_calls:
            - { call: "POST /api/applicators", payload: { display_name: "Ann", license_no: "L-100", license_expires_on: "2027-01-01T00:00:00Z", license_categories: ["HERBICIDE"] }, as: CoopAdmin, captures: { ap: $.data.id } }
            - { call: "POST /api/equipment", payload: { unit_label: "Sprayer-A", tank_capacity_gal: 400 }, as: CoopAdmin, captures: { eqa: $.data.id } }
            - { call: "POST /api/equipment", payload: { unit_label: "Sprayer-B", tank_capacity_gal: 400 }, as: CoopAdmin, captures: { eqb: $.data.id } }
          trigger:
            - { call: "POST /api/calibration-records", payload: { equipment_id: "${eqa}", target_gpa: 20.0, measured_gpa: 21.0 }, as: Applicator, as_user_id: "${ap}", captures: { v_a: $.data.verdict, e_a: $.data.error_pct } }
            - { call: "POST /api/calibration-records", payload: { equipment_id: "${eqb}", target_gpa: 20.0, measured_gpa: 21.1 }, as: Applicator, as_user_id: "${ap}", captures: { v_b: $.data.verdict, e_b: $.data.error_pct } }
            - { call: "GET /api/equipment/${eqa}", as: CoopAdmin, captures: { eqa_status: $.data.status, eqa_valid: $.data.calibration_valid_until } }
            - { call: "GET /api/equipment/${eqb}", as: CoopAdmin, captures: { eqb_status: $.data.status } }
          assert:
            - "EQ_A calibration error_pct == 5.0 and verdict == PASS (boundary is inclusive)"
            - "Equipment.${eqa}.calibration_valid_until == 2026-10-28T00:00:00Z (performed at default clock 2026-05-01T00:00:00Z + 180 days)"
            - "EQ_B calibration error_pct == 5.5 and verdict == FAIL; Equipment.${eqb}.status == CALIBRATION_DUE"

  # ------------------------------------------------------------- rule 7 -----
  - rule_id: cross_entity_state_dependency
    instances:
      - name: schedule_blocked_by_draft_prescription
        grounds:
          - state_machines.WorkOrder.DRAFT_to_SCHEDULED
          - state_machines.Prescription
          - errors[ERR_PRESCRIPTION_NOT_APPROVED]
        distinguishing_aspect: |
          Entity pair WorkOrder -> Prescription: scheduling requires the LINKED
          prescription's state to be APPROVED; a DRAFT prescription rejects the
          work-order transition even though the work order itself is in a valid
          from-state.
        test_recipe:
          setup:
            - "Base fixture but prescription RX1 left in DRAFT (never approved); applicator + calibrated equipment ready"
          setup_api_calls:
