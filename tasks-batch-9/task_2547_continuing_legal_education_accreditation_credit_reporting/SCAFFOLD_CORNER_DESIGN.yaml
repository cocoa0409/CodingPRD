              as: BoardAdmin
            - call: "POST /cle/attendance-reports"
              payload: { course_id: "${rb}", session_date: "2026-05-01T09:00:00Z", entries: [ { bar_number: "BAR-2220", attended_minutes: 360 } ] }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { rep_late: $.data.id }
          assert:
            - "AttendanceReport.${rep_ontime}: due_at == '2026-05-31T09:00:00Z', submitted_at == '2026-05-31T09:00:00Z', days_late == 0, status == 'ACCEPTED', entry_count == 1, accepted_entry_count == 1, rejected_entry_count == 0"
            - "AttendanceReport.${rep_late}: due_at == '2026-05-31T09:00:00Z', submitted_at == '2026-05-31T09:00:01Z', days_late == 1 (a one-second overrun is a whole late day), status == 'ACCEPTED_LATE'"
            - "AttendanceReport.${rep_ontime}.session_end == '2026-05-01T15:00:00Z' (session_date + course.total_minutes)"
            - "Provider.${prov_id}.attendance_reports_total_count == 2 and attendance_reports_late_count == 1"
            - "Provider.${prov_id}.risk_score == 0.18 — 0.35*(1/2) + 0.30*0 + 0.25*0 + 0.10*0 = 0.175 rounded HALF UP to two places (0.17 is the truncated or banker's-rounded answer)"
            - "Provider.${prov_id}.risk_score_variant == 'SELF_CERTIFIED_WEIGHTING'"
            - "GET /cle/credit-records?attorney_id=${att_id} returns total_count == 2, both status 'VERIFIED', verification_method 'ROSTER', effective_format 'LIVE' (the webcast counts as LIVE because it was roster-verified)"
            - "ComplianceCycle.${cyc_id}.earned_countable_minutes == 720 and earned_live_minutes == 720"

      - name: the_same_stored_records_yield_two_different_credit_pictures
        claim_type: variant
        grounds:
          - calculations.cycle_credit_application
        excluded_because:
          difficulty_instance: provisional_versus_final_cycle_credit_application_on_compliance_cycle
          rationale: "The PROVISIONAL / FINAL variant pair, including the way an early pending record consumes cap room a later verified record would have taken, is the whole subject of that §1.8 instance."

      - name: the_same_counters_yield_two_different_risk_scores
        claim_type: variant
        grounds:
          - calculations.provider_risk_score
        excluded_because:
          difficulty_instance: self_certified_versus_reviewed_provider_risk_weighting
          rationale: "The REVIEWED_WEIGHTING / SELF_CERTIFIED_WEIGHTING denominator swap on identical counters is exactly that §1.8 instance, which also pins the post-cascade variant selection."

      - name: three_format_ceilings_bind_one_after_another
        claim_type: correct_result
        grounds:
          - calculations.cycle_credit_application
          - domain_constants.NONLIVE_CAP_MINUTES
        excluded_because:
          difficulty_instance: nested_min_format_cap_room_across_three_simultaneous_ceilings
          rationale: "That §1.8 instance already walks a four-record chain in which a different ceiling of the nested min binds for each record, including the shared non-live cap binding on a record that spent none of its own allowance."

      - name: category_minutes_are_rounded_before_they_are_summed
        claim_type: precision
        grounds:
          - calculations.credit_record_category_proration
        excluded_because:
          difficulty_instance: per_category_rounding_before_summation_on_partial_attendance
          rationale: "The round-then-sum order on partial attendance is that §1.8 instance's single claim; the corner probe here would only restate its arithmetic with different literals."

      - name: the_sample_target_reads_a_frozen_risk_score
        claim_type: constants_applied
        grounds:
          - calculations.audit_sample_selection
          - calculations.provider_risk_score
        excluded_because:
          difficulty_instance: frozen_risk_at_open_resolves_the_sample_size_risk_score_circularity
          rationale: "The circularity between the live risk score and the frozen risk_score_at_open that decides the sample tier is resolved and asserted there, including a draw taken after the live score has moved."

      - name: the_self_study_ceiling_is_inclusive_at_exactly_its_cap
        claim_type: threshold
        grounds:
          - calculations.cycle_credit_application
          - domain_constants.SELF_STUDY_CAP_MINUTES
        excluded_because:
          difficulty_instance: self_study_cap_exactly_at_360_minutes_then_one_record_past_it
          rationale: "The exactly-at-360 boundary and the first record past it are that §1.8 instance's subject, so the inclusive-cap claim is already covered."

  # ===========================================================================
  - section: validations
    instances:

      - name: missing_and_unknown_auth_headers_are_refused_unauthenticated_before_any_other_check
        claim_type: violation_to_error
        grounds:
          - validations[priority 10 -> ERR_UNAUTHENTICATED]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Priority 10 fires on three distinct header defects — no headers at all, a role string that names none of the five §1.7 roles, and an empty X-User-ID beside a legal role — and it fires even when the same request would also fail path existence, role permission and body validation."
        test_recipe:
          setup:
            - "Empty database, logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "GET /cle/providers/00000000-0000-4000-8000-00000000dead"
              as: NONE
              expect_error: ERR_UNAUTHENTICATED
            - call: "POST /cle/providers"
              payload: { name: "", provider_type: "NOT_A_TYPE" }
              as: UNKNOWN_ROLE
              expect_error: ERR_UNAUTHENTICATED
            - call: "POST /cle/reporting-sweeps"
              payload: {}
              as: BoardAdmin
              as_user_id: ""
              expect_error: ERR_UNAUTHENTICATED
          assert:
            - "All three calls returned HTTP 401 with error code ERR_UNAUTHENTICATED"
            - "Call 1 returned 401 rather than the 404 ERR_PROVIDER_NOT_FOUND that priority 30 would give the reserved unknown id — priority 10 outranks priority 30"
            - "Call 2 returned 401 rather than 403 ERR_ROLE_NOT_PERMITTED (an unrecognised role is not a role) and rather than 422 ERR_INVALID_REQUEST for its empty name and undeclared provider_type"
            - "Call 3 returned 401 because X-User-ID must be present and non-empty even for a role that is not entity_backed"
            - "No Provider and no ReportingSweep row exists after the three calls"

      - name: a_forbidden_role_is_refused_before_the_unknown_path_id_is_looked_up
        claim_type: priority_ordering
        grounds:
          - validations[priority 20 -> ERR_ROLE_NOT_PERMITTED]
          - validations[priority 30 -> path existence]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - endpoints[POST /cle/providers/{id}/accreditation-actions]
          - endpoints[POST /cle/credit-records]
        distinguishing_aspect: "Priority 20 is evaluated against the endpoint's declared roles list alone, so a wrong role on an unknown path id yields 403 rather than 404, and a wrong role on a malformed body yields 403 rather than 422; the same request with the right role then reaches the 404."
        test_recipe:
          setup:
            - "Empty database, logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Meridian Continuing Studies", provider_type: "LAW_SCHOOL" }
              as: BoardAdmin
              captures: { real_prov_id: $.data.id, real_prov_v1: $.data.version }
          trigger:
            - call: "POST /cle/providers/00000000-0000-4000-8000-00000000dead/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${real_prov_v1}" }
              as: ProviderAdmin
              as_user_id: "00000000-0000-4000-8000-00000000dead"
              expect_error: ERR_ROLE_NOT_PERMITTED
            - call: "POST /cle/credit-records"
              payload: { attorney_id: "00000000-0000-4000-8000-00000000dead", course_id: "00000000-0000-4000-8000-00000000dead", verification_method: "NOT_A_METHOD", attended_minutes: -5, completion_date: "not-a-date" }
              as: AccreditationReviewer
              as_user_id: "33333333-3333-4333-8333-333333333333"
              expect_error: ERR_ROLE_NOT_PERMITTED
            - call: "POST /cle/providers/00000000-0000-4000-8000-00000000dead/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${real_prov_v1}" }
              as: BoardAdmin
              expect_error: ERR_PROVIDER_NOT_FOUND
          assert:
            - "Call 1 returned HTTP 403 ERR_ROLE_NOT_PERMITTED — accreditation-actions declares roles [BoardAdmin] only, and that verdict precedes the priority-30 lookup of the reserved unknown provider id"
            - "Call 2 returned HTTP 403 ERR_ROLE_NOT_PERMITTED — POST /cle/credit-records declares roles [Attorney] only — rather than 404 for its two unknown body foreign keys or 422 for its undeclared enum, negative minutes and unparsable date"
            - "Call 3, identical to call 1 except for the role, returned HTTP 404 ERR_PROVIDER_NOT_FOUND — proving the 403 in call 1 was the role check and not a disguised existence check"
            - "No CreditRecord row exists and Provider.${real_prov_id}.accreditation_status is still 'APPLIED' with version 1 — none of the three calls touched the one real provider"

      - name: an_unknown_body_foreign_key_outranks_an_invalid_enum_in_the_same_request
        claim_type: priority_ordering
        grounds:
          - validations[priority 35 -> body foreign key existence]
          - validations[priority 45 -> ERR_INVALID_REQUEST]
          - endpoints[POST /cle/credit-records]
          - errors[ERR_ATTORNEY_NOT_FOUND]
          - errors[ERR_COURSE_NOT_FOUND]
        distinguishing_aspect: "Body foreign keys are resolved at priority 35, before the priority-45 shape check, and they are resolved in the order the fields appear in the endpoint's input list — so with both attorney_id and course_id unknown the answer is ERR_ATTORNEY_NOT_FOUND, and only after the attorney is real does the same request surface ERR_COURSE_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty database, logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /cle/attorneys"
              payload: { bar_number: "V3-0001", full_name: "Dana Okonjo", admission_date: "2015-06-01T00:00:00Z", compliance_group: "GROUP_1", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { att_id: $.data.id }
          trigger:
            - call: "POST /cle/credit-records"
              payload: { attorney_id: "00000000-0000-4000-8000-00000000dead", course_id: "00000000-0000-4000-8000-00000000dead", verification_method: "NOT_A_METHOD", attended_minutes: 600, completion_date: "2026-07-01T00:00:00Z" }
              as: Attorney
              as_user_id: "${att_id}"
              expect_error: ERR_ATTORNEY_NOT_FOUND
            - call: "POST /cle/credit-records"
              payload: { attorney_id: "${att_id}", course_id: "00000000-0000-4000-8000-00000000dead", verification_method: "NOT_A_METHOD", attended_minutes: 600, completion_date: "2026-07-01T00:00:00Z" }
              as: Attorney
              as_user_id: "${att_id}"
              expect_error: ERR_COURSE_NOT_FOUND
          assert:
            - "Trigger call 1 returned HTTP 404 ERR_ATTORNEY_NOT_FOUND — attorney_id precedes course_id in the input list of POST /cle/credit-records, so the first unresolved key decides the error"
            - "Trigger call 2 returned HTTP 404 ERR_COURSE_NOT_FOUND, not 422 ERR_INVALID_REQUEST for the undeclared verification_method — priority 35 outranks priority 45"
            - "Neither call created a CreditRecord and Attorney.${att_id}.version is unchanged"

      - name: an_attorney_cannot_file_an_affirmation_or_read_a_summary_on_another_attorneys_cycle
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 40 -> ERR_NOT_RESOURCE_OWNER]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - endpoints[POST /cle/compliance-cycles/{id}/affirmations]
          - endpoints[GET /cle/compliance-cycles/{id}/summary]
          - roles.Attorney
        distinguishing_aspect: "Ownership for the entity_backed Attorney role is not a property of the request body — it is X-User-ID against the addressed cycle's attorney_id — so the same well-formed affirmation is refused for attorney B and accepted for attorney A, and the refusal covers the computed read as well as the write."
        test_recipe:
          setup:
            - "Empty database, logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /cle/attorneys"
              payload: { bar_number: "V4-0001", full_name: "Ana Restrepo", admission_date: "2011-01-10T00:00:00Z", compliance_group: "GROUP_1", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { att_a: $.data.id }
            - call: "POST /cle/attorneys"
              payload: { bar_number: "V4-0002", full_name: "Bo Lindqvist", admission_date: "2012-02-20T00:00:00Z", compliance_group: "GROUP_1", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { att_b: $.data.id }
            - call: "POST /cle/attorneys/${att_a}/compliance-cycles"
              payload: { period_start: "2026-02-01T00:00:00Z", period_end: "2028-02-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cyc_a: $.data.id }
          trigger:
            - call: "POST /cle/compliance-cycles/${cyc_a}/affirmations"
              payload: { affirmation_type: "FINAL_COMPLIANCE_AFFIRMATION", statement: "I affirm the credits reported for this period are accurate." }
              as: Attorney
              as_user_id: "${att_b}"
              expect_error: ERR_NOT_RESOURCE_OWNER
            - call: "GET /cle/compliance-cycles/${cyc_a}/summary"
              as: Attorney
              as_user_id: "${att_b}"
              expect_error: ERR_NOT_RESOURCE_OWNER
            - call: "POST /cle/compliance-cycles/${cyc_a}/affirmations"
              payload: { affirmation_type: "FINAL_COMPLIANCE_AFFIRMATION", statement: "I affirm the credits reported for this period are accurate." }
              as: Attorney
              as_user_id: "${att_a}"
              captures: { aff_id: $.data.id }
          assert:
            - "Trigger call 1 returned HTTP 403 ERR_NOT_RESOURCE_OWNER although attorney B holds a permitted role and the cycle id exists"
            - "Trigger call 2 returned HTTP 403 ERR_NOT_RESOURCE_OWNER — the ownership rule guards the computed read too"
            - "Trigger call 3 returned HTTP 201 with Affirmation.${aff_id}.cycle_id == '${cyc_a}' and affirmed_by_user_id == '${att_a}'"
            - "GET /cle/compliance-cycles/${cyc_a}/affirmations as BoardAdmin returns exactly one row"

      - name: a_stale_provider_version_outranks_the_undeclared_transition_it_would_attempt
        claim_type: priority_conflict
        grounds:
          - validations[priority 50 -> ERR_STALE_VERSION]
          - validations[priority 55 -> ERR_INVALID_STATE_TRANSITION]
          - errors[ERR_STALE_VERSION]
          - concurrency_rules
          - endpoints[POST /cle/providers/{id}/accreditation-actions]
        distinguishing_aspect: "One request is doubly wrong — it carries the pre-denial version AND asks for a transition that DENIED does not declare — and priority 50 decides it: 412 ERR_STALE_VERSION, no version bump; replaying the very same body with the current version then reaches priority 55 and yields 409."
        test_recipe:
          setup:
            - "Empty database, logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Lakeshore Advocacy Institute", provider_type: "COMMERCIAL" }
              as: BoardAdmin
              captures: { prov_id: $.data.id, prov_v1: $.data.version }
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "DENY", expected_provider_version: "${prov_v1}", probation_reason: "Faculty roster was never produced." }
              as: BoardAdmin
              captures: { prov_v2: $.data.version }
          trigger:
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_PROBATIONARY", expected_provider_version: "${prov_v1}" }
              as: BoardAdmin
              expect_error: ERR_STALE_VERSION
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_PROBATIONARY", expected_provider_version: "${prov_v2}" }
              as: BoardAdmin
              expect_error: ERR_INVALID_STATE_TRANSITION
          assert:
            - "Trigger call 1 returned HTTP 412 ERR_STALE_VERSION even though DENIED -> PROBATIONARY is not a declared transition — the OCC check at priority 50 runs before the state check at priority 55"
            - "Trigger call 2, identical except for the fresh version, returned HTTP 409 ERR_INVALID_STATE_TRANSITION"
            - "Provider.${prov_id}.accreditation_status is still 'DENIED' and version is still ${prov_v2} — a refused call never increments the version"
            - "GET /cle/fee-assessments?provider_id=${prov_id} returns 0 rows: DENY creates no annual fee and neither refusal created one"

      - name: a_completion_date_outside_the_half_open_cycle_window_finds_no_owning_cycle
        claim_type: temporal_validation
        grounds:
          - validations[priority 68 -> ERR_OUTSIDE_COMPLIANCE_PERIOD]
          - errors[ERR_OUTSIDE_COMPLIANCE_PERIOD]
          - entities.CreditRecord.fields.cycle_id
          - entities.ComplianceCycle.fields.period_start
          - endpoints[POST /cle/credit-records]
        distinguishing_aspect: "The owning cycle is resolved from completion_date against the half-open window [period_start, period_end), so period_start itself is inside and period_end itself is outside; this is the record-to-window test, distinct from the §1.8 cycle-to-cycle adjacency claim, and it is the one validation whose failure means 'no cycle at all' rather than 'the wrong cycle'."
        test_recipe:
          setup:
            - "One ACCREDITED self-certifying law-school provider with one APPROVED ON_DEMAND course, and one attorney holding a single 2026-01-01 -> 2028-01-01 cycle."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Statehouse Law School", provider_type: "LAW_SCHOOL" }
              as: BoardAdmin
              captures: { prov_id: $.data.id, prov_v1: $.data.version }
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${prov_v1}" }
              as: BoardAdmin
            - call: "POST /cle/courses"
              payload: { title: "Recorded Ethics Survey", delivery_format: "ON_DEMAND", total_minutes: 600, presented_at: "2025-06-01T00:00:00Z", attendance_verification_method: "CERTIFICATE", credit_allocations: [ { category: "GENERAL", minutes: 600 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { course_id: $.data.id }
            - call: "POST /cle/attorneys"
              payload: { bar_number: "V6-0001", full_name: "Iris Vandermeer", admission_date: "2009-09-09T00:00:00Z", compliance_group: "GROUP_1", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { att_id: $.data.id }
            - call: "POST /cle/attorneys/${att_id}/compliance-cycles"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cyc_id: $.data.id }
          trigger:
            - call: "POST /cle/credit-records"
              payload: { attorney_id: "${att_id}", course_id: "${course_id}", verification_method: "CERTIFICATE", certificate_reference: "CERT-A", attended_minutes: 600, completion_date: "2025-12-31T23:59:59Z" }
              as: Attorney
              as_user_id: "${att_id}"
              expect_error: ERR_OUTSIDE_COMPLIANCE_PERIOD
            - call: "POST /cle/credit-records"
              payload: { attorney_id: "${att_id}", course_id: "${course_id}", verification_method: "CERTIFICATE", certificate_reference: "CERT-B", attended_minutes: 600, completion_date: "2028-01-01T00:00:00Z" }
              as: Attorney
              as_user_id: "${att_id}"
              expect_error: ERR_OUTSIDE_COMPLIANCE_PERIOD
            - call: "POST /cle/credit-records"
              payload: { attorney_id: "${att_id}", course_id: "${course_id}", verification_method: "CERTIFICATE", certificate_reference: "CERT-C", attended_minutes: 600, completion_date: "2026-01-01T00:00:00Z" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { rec_id: $.data.id }
          assert:
            - "Trigger call 1 returned HTTP 409 ERR_OUTSIDE_COMPLIANCE_PERIOD — one second before period_start there is no owning cycle"
            - "Trigger call 2 returned HTTP 409 ERR_OUTSIDE_COMPLIANCE_PERIOD — period_end is excluded, so the instant that ends the window belongs to no cycle either"
            - "Trigger call 3 returned HTTP 201 with CreditRecord.${rec_id}.cycle_id == '${cyc_id}' — period_start is included, so the first instant of the window is creditable"
            - "CreditRecord.${rec_id}.status == 'PENDING_VERIFICATION' and effective_format == 'ON_DEMAND'"
            - "GET /cle/credit-records?cycle_id=${cyc_id} returns exactly one row — the two refusals persisted nothing"

      - name: course_allocations_are_checked_as_a_set_for_distinctness_then_sum_then_increment
        claim_type: aggregate_validation
        grounds:
          - validations[priority 45 -> ERR_INVALID_REQUEST]
          - validations[priority 72 -> ERR_ALLOCATION_SUM_MISMATCH]
          - validations[priority 72 -> ERR_ALLOCATION_NOT_MULTIPLE_OF_15]
          - errors[ERR_ALLOCATION_SUM_MISMATCH]
          - errors[ERR_ALLOCATION_NOT_MULTIPLE_OF_15]
          - domain_constants.ROUNDING_INCREMENT_MINUTES
          - endpoints[POST /cle/courses]
        distinguishing_aspect: "Three different defects of the same array produce three different verdicts in a fixed order — duplicate categories are a priority-45 shape error, an unequal sum is a priority-72 aggregate error, and a correctly-summing but off-increment split is a separate priority-72 error — and a request carrying both a duplicate category and a wrong sum answers with the 422, proving 45 precedes 72."
        test_recipe:
          setup:
            - "One ACCREDITED self-certifying bar-association provider; logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "County Bar Association", provider_type: "BAR_ASSOCIATION" }
              as: BoardAdmin
              captures: { prov_id: $.data.id, prov_v1: $.data.version }
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${prov_v1}" }
              as: BoardAdmin
          trigger:
            - call: "POST /cle/courses"
              payload: { title: "Duplicate Category Split", delivery_format: "LIVE_IN_PERSON", total_minutes: 600, presented_at: "2026-09-01T09:00:00Z", attendance_verification_method: "ROSTER", credit_allocations: [ { category: "GENERAL", minutes: 300 }, { category: "GENERAL", minutes: 200 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              expect_error: ERR_INVALID_REQUEST
            - call: "POST /cle/courses"
              payload: { title: "Short Sum Split", delivery_format: "LIVE_IN_PERSON", total_minutes: 600, presented_at: "2026-09-01T09:00:00Z", attendance_verification_method: "ROSTER", credit_allocations: [ { category: "GENERAL", minutes: 300 }, { category: "ETHICS", minutes: 195 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              expect_error: ERR_ALLOCATION_SUM_MISMATCH
            - call: "POST /cle/courses"
              payload: { title: "Off Increment Split", delivery_format: "LIVE_IN_PERSON", total_minutes: 600, presented_at: "2026-09-01T09:00:00Z", attendance_verification_method: "ROSTER", credit_allocations: [ { category: "GENERAL", minutes: 590 }, { category: "ETHICS", minutes: 10 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              expect_error: ERR_ALLOCATION_NOT_MULTIPLE_OF_15
            - call: "POST /cle/courses"
              payload: { title: "Balanced Split", delivery_format: "LIVE_IN_PERSON", total_minutes: 600, presented_at: "2026-09-01T09:00:00Z", attendance_verification_method: "ROSTER", credit_allocations: [ { category: "GENERAL", minutes: 450 }, { category: "ETHICS", minutes: 90 }, { category: "TECHNOLOGY", minutes: 60 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { course_id: $.data.id }
          assert:
            - "Trigger call 1 returned HTTP 422 ERR_INVALID_REQUEST — two GENERAL rows violate the distinctness rule at priority 45, and that verdict is reached even though the same array also sums to 500 against a declared 600"
            - "Trigger call 2 returned HTTP 409 ERR_ALLOCATION_SUM_MISMATCH — 300 + 195 = 495, not 600 — and note 195 is itself off-increment, so the sum check is the earlier of the two priority-72 clauses"
            - "Trigger call 3 returned HTTP 409 ERR_ALLOCATION_NOT_MULTIPLE_OF_15 — the array sums to exactly 600 but 590 and 10 are not multiples of 15"
            - "Trigger call 4 returned HTTP 201 with Course.${course_id}.credited_minutes_total == 600 and status == 'APPROVED' (self-certified pathway)"
            - "GET /cle/courses/${course_id}/credit-allocations returns exactly three rows: GENERAL 450, ETHICS 90, TECHNOLOGY 60"
            - "GET /cle/courses?provider_id=${prov_id} returns exactly one row and Provider.${prov_id}.courses_total_count == 1 — the three refusals cascaded nothing"

      - name: the_complaint_filer_cannot_dispose_of_its_own_complaint
        claim_type: violation_to_error
        grounds:
          - validations[priority 60 -> ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - state_machines.Complaint.UNDER_REVIEW_to_SUBSTANTIATED
          - endpoints[POST /cle/complaints/{id}/disposition]
        distinguishing_aspect: "Segregation of duties is an identity comparison inside one role: both actors are BoardAdmin and both are permitted by §1.7, yet the X-User-ID that filed the complaint is refused 403 on its own disposition while a different BoardAdmin's identical body succeeds — and the refusal happens after the state check has already been satisfied."
        test_recipe:
          setup:
            - "One ACCREDITED provider; complaint filed by BoardAdmin 11111111-1111-4111-8111-111111111111 and reviewed by BoardAdmin 22222222-2222-4222-8222-222222222222."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Northgate CLE Partners", provider_type: "GOVERNMENT" }
              as: BoardAdmin
              as_user_id: "22222222-2222-4222-8222-222222222222"
              captures: { prov_id: $.data.id, prov_v1: $.data.version }
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${prov_v1}" }
              as: BoardAdmin
              as_user_id: "22222222-2222-4222-8222-222222222222"
            - call: "POST /cle/complaints"
              payload: { subject_type: "PROVIDER", subject_id: "${prov_id}", allegation: "Marketing claims 6.0 ethics hours for a 60-minute segment.", allegation_category: "MISREPRESENTED_CREDIT" }
              as: BoardAdmin
              as_user_id: "11111111-1111-4111-8111-111111111111"
              captures: { comp_id: $.data.id }
            - call: "POST /cle/complaints/${comp_id}/disposition"
              payload: { action: "OPEN_REVIEW" }
              as: BoardAdmin
              as_user_id: "22222222-2222-4222-8222-222222222222"
          trigger:
            - call: "POST /cle/complaints/${comp_id}/disposition"
              payload: { action: "SUBSTANTIATE", disposition_reason: "Marketing copy overstated the ethics allocation." }
              as: BoardAdmin
              as_user_id: "11111111-1111-4111-8111-111111111111"
              expect_error: ERR_SEGREGATION_OF_DUTIES
            - call: "POST /cle/complaints/${comp_id}/disposition"
              payload: { action: "DISMISS", disposition_reason: "The disputed segment was corrected before any attorney relied on it." }
              as: BoardAdmin
              as_user_id: "22222222-2222-4222-8222-222222222222"
          assert:
            - "Trigger call 1 returned HTTP 403 ERR_SEGREGATION_OF_DUTIES — the complaint was in UNDER_REVIEW so UNDER_REVIEW -> SUBSTANTIATED was a legal transition and disposition_reason was supplied; only the identity blocked it"
            - "Trigger call 2 returned HTTP 200 with Complaint.${comp_id}.status == 'DISMISSED' and disposition_reason recorded"
            - "Provider.${prov_id}.substantiated_complaint_count == 0 and accreditation_status == 'ACCREDITED' — the refused SUBSTANTIATE cascaded nothing"
            - "Complaint.${comp_id}.complainant_user_id == '11111111-1111-4111-8111-111111111111' and complainant_role == 'BOARD_ADMIN'"

