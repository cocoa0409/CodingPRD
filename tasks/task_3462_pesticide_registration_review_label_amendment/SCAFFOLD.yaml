# =============================================================================
# SCAFFOLD — Pesticide Registration Review & Label Amendment (EPA)
# §1.0–§1.7 seed tables. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml. Neither key appears here.
# =============================================================================

scenario: |
  Pesticide Registration Review & Label Amendment (Environmental Protection Agency): registration applications with efficacy, toxicology, environmental fate and residue data requirements by use pattern, risk assessment across dietary, occupational and ecological exposure with tolerance establishment for food uses, registration review cycles reevaluating existing products on a recurring schedule with new data calls, label amendment requests for new uses, rate changes and application methods with review timelines, restricted use classification and applicator certification requirements, endangered species consultation obligations affecting use restrictions by geography, cancellation and suspension proceedings with existing stocks provisions, state registration layered on federal approval with additional restrictions

domain_name: epa-pesticide-registration-review
api_prefix: /pesticide-registry

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Workflow orchestration"
  complexity_layers:
    - optimistic_concurrency      # OCC on Product.version guards label amendment creation
    - cascading_side_effects      # cancellation order -> product -> tolerances -> amendments; DCI delinquency -> case -> proceeding -> product -> state registrations
    - ops_run_checkpoint          # POST /_clock/set_current_utc runs a pinned 4-step batch sweep
    - dual_variant_calculation    # screening vs refined risk; FIXED vs DEPLETION stocks deadlines
  entity_topology: flat           # peer entities joined by FK references; sub-resource GETs for reverse reachability
  state_machine_shape: cyclic     # Product REGISTERED<->UNDER_REVIEW<->SUSPENDED cycles, application deficiency loop, cert expiry/renew loop, state-reg lapse/renew loop
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic                 # StudySubmission has exactly one of application_id / data_call_in_id
  role_model: segregation_of_duties  # risk assessor of record cannot approve; proceeding initiator cannot issue its order
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table (§1.1)
# All entities carry common_fields (id, created_at, updated_at, version).
# ids are server-minted UUIDs with no type prefix and are never used for
# ranking, tie-breaks, or any observable business decision.
# =============================================================================
entities:
  - name: ActiveIngredient
    parent: null
    common_fields: true
    fields:
      - { name: common_name, type: string, source: input, description: "Public common name of the chemical (e.g. chlorpyrifos)" }
      - { name: cas_number, type: string, source: input, description: "CAS registry number; unique across ActiveIngredient rows", constraints: "unique" }
      - { name: tox_category, type: enum, source: input, description: "Acute toxicity category", constraints: "I | II | III | IV" }
      - { name: reference_dose_mg_kg_day, type: number, source: input, description: "Chronic reference dose (RfD), mg/kg/day; > 0" }
      - { name: aquatic_lc50_ppm, type: number, source: input, description: "Aquatic LC50 used for ecological risk quotient; > 0" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: product_name, type: string, source: input, description: "Trade name of the formulated product" }
      - { name: active_ingredient_id, type: string, source: input, description: "FK -> ActiveIngredient.id; the single active ingredient of this product" }
      - { name: registrant_ref, type: string, source: system, description: "Opaque X-User-ID of the owning RegistrantRepresentative, stamped at creation; ownership checks compare X-User-ID to this field" }
      - { name: formulation_type, type: enum, source: input, description: "Formulation", constraints: "EMULSIFIABLE_CONCENTRATE | GRANULAR | WETTABLE_POWDER | READY_TO_USE | SEED_TREATMENT" }
      - { name: classification, type: enum, source: system, description: "GENERAL_USE | RESTRICTED_USE; defaults GENERAL_USE pre-registration; set to the approving decision's final_classification at approval; immutable thereafter", default: "GENERAL_USE" }
      - { name: status, type: enum, source: system, description: "UNREGISTERED | REGISTERED | UNDER_REVIEW | SUSPENDED | CANCELLED", default: "UNREGISTERED" }
      - { name: signal_word, type: enum, source: computed, description: "Derived from ActiveIngredient.tox_category at approval: I->DANGER_POISON, II->WARNING, III->CAUTION, IV->CAUTION; null until first approval", default: null }
      - { name: epa_registration_number, type: string, source: system, description: "Minted at first approval as 'EPA-RR-' + zero-padded 6-digit sequence (count of previously APPROVED applications + 1); null until approved", default: null }

  - name: RegistrationApplication
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; product seeking registration" }
      - { name: registrant_ref, type: string, source: system, description: "Opaque X-User-ID of the creating RegistrantRepresentative (must equal Product.registrant_ref)" }
      - { name: use_pattern, type: enum, source: input, description: "FOOD_USE | NON_FOOD_USE | MIXED_USE; drives required study types and review timeline" }
      - { name: requested_classification, type: enum, source: input, description: "GENERAL_USE | RESTRICTED_USE; applicant's requested classification" }
      - { name: proposed_use_sites, type: array, source: input, description: "Array of use-site objects {site_code, pest_code, max_application_rate_lbs_acre, max_applications_per_season, preharvest_interval_days, application_method, restricted_entry_interval_hours}; each becomes a PROPOSED UseSite row at creation" }
      - { name: status, type: enum, source: system, description: "DRAFT | IN_REVIEW | DATA_DEFICIENCY | APPROVED | DENIED | WITHDRAWN", default: "DRAFT" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical clock time of the most recent DRAFT->IN_REVIEW or DATA_DEFICIENCY->IN_REVIEW submit", default: null }
      - { name: review_due_at, type: datetime, source: computed, description: "submitted_at + APPLICATION_REVIEW_DAYS[use_pattern]; computed ONLY on the first DRAFT->IN_REVIEW submit; resubmission from DATA_DEFICIENCY does not recompute it", default: null }
      - { name: deficiency_count, type: integer, source: system, description: "Increments by 1 on each IN_REVIEW->DATA_DEFICIENCY decision", default: 0 }
      - { name: payment_cents, type: integer, source: system, description: "Filing fee captured on the first submit; must equal APPLICATION_FEE_CENTS[use_pattern]", default: null }
      - { name: decided_at, type: datetime, source: system, description: "Logical clock time of APPROVE/DENY decision", default: null }
      - { name: final_classification, type: enum, source: system, description: "GENERAL_USE | RESTRICTED_USE; stamped from the APPROVE decision payload; null unless APPROVED", default: null }

  - name: StudySubmission
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> RegistrationApplication.id; set exactly when the study supports an application (XOR with data_call_in_id); null otherwise", default: null }
      - { name: data_call_in_id, type: string, source: input, description: "FK -> DataCallIn.id; set exactly when the study responds to a data call-in (XOR with application_id); null otherwise", default: null }
      - { name: study_type, type: enum, source: input, description: "EFFICACY | TOXICOLOGY | ENVIRONMENTAL_FATE | RESIDUE_CHEMISTRY | OCCUPATIONAL_EXPOSURE | ECOLOGICAL_EFFECTS" }
      - { name: guideline_reference, type: string, source: input, description: "OCSPP guideline reference string (free-form)" }
      - { name: commodity_code, type: string, source: input, description: "Commodity the residue trial measured; required iff study_type == RESIDUE_CHEMISTRY, forbidden otherwise; must exist in CONSUMPTION_G_DAY", default: null }
      - { name: field_trial_residue_ppm, type: number, source: input, description: "Measured field-trial residue; required iff study_type == RESIDUE_CHEMISTRY, forbidden otherwise; >= 0", default: null }
      - { name: status, type: enum, source: system, description: "RECEIVED | ACCEPTED | REJECTED", default: "RECEIVED" }
      - { name: submitted_by_ref, type: string, source: system, description: "Opaque X-User-ID of the submitting RegistrantRepresentative" }
      - { name: decided_by_ref, type: string, source: system, description: "Opaque X-User-ID of the RiskAssessor who decided; null while RECEIVED", default: null }
      - { name: decided_at, type: datetime, source: system, description: "Logical clock time of ACCEPT/REJECT decision", default: null }

  - name: UseSite
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: system, description: "FK -> Product.id; label owner (from the owning application or amendment)" }
      - { name: origin, type: enum, source: system, description: "INITIAL_APPLICATION (minted by application creation) | AMENDMENT (minted by NEW_USE amendment approval)" }
      - { name: site_code, type: string, source: input, description: "Crop/site code, e.g. CORN, WHEAT, TURF" }
      - { name: pest_code, type: string, source: input, description: "Target pest code" }
      - { name: max_application_rate_lbs_acre, type: number, source: input, description: "Maximum single application rate; must be > 0 and <= 8.0 (ABSOLUTE_RATE_CAP_LBS_ACRE)" }
      - { name: max_applications_per_season, type: integer, source: input, description: "Maximum applications per growing season; >= 1" }
      - { name: preharvest_interval_days, type: integer, source: input, description: "Pre-harvest interval in days; >= 0" }
      - { name: application_method, type: enum, source: input, description: "GROUND | AERIAL | CHEMIGATION | SEED_TREATMENT" }
      - { name: restricted_entry_interval_hours, type: integer, source: input, description: "REI in hours; >= 0" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ACTIVE | REMOVED", default: "PROPOSED" }
      - { name: pre_removal_status, type: enum, source: system, description: "Set to the prior status ONLY when removal is caused by a cancellation-order cascade (drives vacatur restore); null for application deny/withdraw removals", default: null }
      - { name: removed_at, type: datetime, source: system, description: "Logical clock time of removal; null while not REMOVED", default: null }

  - name: RiskAssessment
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> RegistrationApplication.id; application under review" }
      - { name: assessor_ref, type: string, source: system, description: "Opaque X-User-ID of the creating RiskAssessor (segregation-of-duties anchor)" }
      - { name: tier, type: enum, source: input, description: "SCREENING | REFINED" }
      - { name: pct_crop_treated, type: number, source: input, description: "Fraction of crop treated, 0 < x <= 1; required iff tier == REFINED, forbidden otherwise", default: null }
      - { name: assessment_seq, type: integer, source: system, description: "Per-application sequence, 1-based, in creation order; the 'latest' assessment is the max assessment_seq" }
      - { name: dietary_exposure_mg_day, type: number, source: computed, description: "Per calculations.dietary_exposure_and_risk_quotient (per-commodity round-half-up to 4 dp, sum, round to 3 dp)" }
      - { name: dietary_rq, type: number, source: computed, description: "round_half_up(dietary_exposure_mg_day / (reference_dose * 70), 3)" }
      - { name: occupational_rq, type: number, source: computed, description: "round_half_up(max application rate over PROPOSED/ACTIVE use sites * 0.01 / (reference_dose * 70), 3); identical across tiers" }
      - { name: ecological_rq, type: number, source: computed, description: "round_half_up(max over PROPOSED/ACTIVE use sites of rate * RUNOFF_FACTOR[method] / aquatic_lc50_ppm, 3); identical across tiers" }
      - { name: level_of_concern_exceeded, type: boolean, source: computed, description: "dietary_rq >= 1.0 OR occupational_rq >= 1.0 OR ecological_rq >= 0.5, compared on the ROUNDED stored values" }
      - { name: assessed_at, type: datetime, source: system, description: "Logical clock time of creation" }

  - name: Tolerance
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; product the tolerance covers" }
      - { name: origin, type: enum, source: system, description: "INITIAL_APPLICATION (registrant-proposed via POST /tolerances) | AMENDMENT (created by NEW_USE amendment approval)" }
      - { name: commodity_code, type: string, source: input, description: "Commodity covered; must exist in CONSUMPTION_G_DAY" }
      - { name: tolerance_ppm, type: number, source: input, description: "Maximum residue limit; > 0" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ESTABLISHED | REVOKED", default: "PROPOSED" }
      - { name: established_at, type: datetime, source: system, description: "Logical clock time of establishment", default: null }
      - { name: revoked_at, type: datetime, source: system, description: "Logical clock time of revocation", default: null }
      - { name: pre_revocation_status, type: enum, source: system, description: "Set to the prior status ONLY when revocation is caused by a cancellation-order cascade (drives vacatur restore); null for application deny/withdraw revocations", default: null }

  - name: LabelAmendment
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; product whose label is amended" }
      - { name: registrant_ref, type: string, source: system, description: "Opaque X-User-ID of the creating RegistrantRepresentative" }
      - { name: amendment_type, type: enum, source: input, description: "NEW_USE | RATE_CHANGE | METHOD_CHANGE" }
      - { name: payload, type: object, source: input, description: "Type-keyed change set. NEW_USE: { use_site: {site_code, pest_code, max_application_rate_lbs_acre, max_applications_per_season, preharvest_interval_days, application_method, restricted_entry_interval_hours}, commodity_code?, tolerance_ppm? }. RATE_CHANGE: { use_site_id, new_max_application_rate_lbs_acre }. METHOD_CHANGE: { use_site_id, new_application_method, expedited? }" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | REJECTED | WITHDRAWN", default: "SUBMITTED" }
      - { name: priia_category, type: string, source: computed, description: "'<amendment_type>' or '<amendment_type>-EXPEDITED' when payload.expedited applied" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical clock time of creation" }
      - { name: review_due_at, type: datetime, source: computed, description: "submitted_at + amendment_review_timeline days" }
      - { name: decided_at, type: datetime, source: system, description: "Logical clock time of APPROVE/REJECT decision or auto-rejection", default: null }

  - name: ApplicatorCertification
    parent: null
    common_fields: true
    fields:
      - { name: applicator_name, type: string, source: input, description: "Certified applicator's name" }
      - { name: state_code, type: string, source: input, description: "State of certification (e.g. TX)" }
      - { name: category, type: enum, source: input, description: "AGRICULTURAL_PEST_CONTROL | AERIAL_APPLICATION | STRUCTURAL | AQUATIC" }
      - { name: certified_until, type: datetime, source: input, description: "Certification expiry instant; must be strictly after the logical clock at creation and at renewal" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPIRED; EXPIRED when certified_until < logical clock (swept on clock set), restored to ACTIVE by renew", default: "ACTIVE" }
      - { name: renewed_count, type: integer, source: system, description: "Number of renewals applied", default: 0 }

  - name: EndangeredSpeciesBulletin
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; product under consultation" }
      - { name: county_fips, type: string, source: input, description: "5-digit county FIPS code; geography of the restriction" }
      - { name: restriction_code, type: enum, source: input, description: "PROHIBITED | RATE_CAP | SEASONAL_WINDOW" }
      - { name: rate_cap_lbs_acre, type: number, source: input, description: "Maximum rate under the bulletin; required iff restriction_code == RATE_CAP, forbidden otherwise; > 0", default: null }
      - { name: window_start_month, type: integer, source: input, description: "First restricted month, 1-12 inclusive; window is the CLOSED set of months from start to end, wrapping past December (11->2 means {11,12,1,2})" }
      - { name: window_end_month, type: integer, source: input, description: "Last restricted month, 1-12 inclusive" }
      - { name: consultation_reference, type: string, source: input, description: "Biological Opinion / consultation reference string" }
      - { name: status, type: enum, source: system, description: "IN_EFFECT | LIFTED", default: "IN_EFFECT" }
      - { name: effective_at, type: datetime, source: system, description: "Logical clock time of creation" }
      - { name: lifted_at, type: datetime, source: system, description: "Logical clock time of lift; null while IN_EFFECT", default: null }

  - name: RegistrationReviewCase
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; product under registration review" }
      - { name: cycle_number, type: integer, source: system, description: "1 + count of pre-existing cases for the product at creation time" }
      - { name: opened_at, type: datetime, source: input, description: "Instant the case opens (SCHEDULED -> OPEN when the logical clock reaches it); on auto-scheduled cases = approval/completion clock + 5475 days" }
      - { name: due_at, type: datetime, source: computed, description: "opened_at + REVIEW_COMPLETION_DAYS (180) when not supplied explicitly on manual creation" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPEN | DCI_PENDING | UNDER_REVIEW | COMPLETED | REFERRED", default: "SCHEDULED" }
      - { name: completed_at, type: datetime, source: system, description: "Logical clock time of completion", default: null }

  - name: DataCallIn
    parent: null
    common_fields: true
    fields:
      - { name: review_case_id, type: string, source: input, description: "FK -> RegistrationReviewCase.id; case issuing the data call" }
      - { name: required_study_types, type: array, source: input, description: "Non-empty array of study_type enum values the registrant must deliver" }
      - { name: response_deadline, type: datetime, source: input, description: "Must be strictly after the logical clock at issuance; delinquency sweeps when response_deadline < clock" }
      - { name: status, type: enum, source: system, description: "ISSUED | RESPONDED | DEFICIENT | SATISFIED | DELINQUENT", default: "ISSUED" }
      - { name: issued_at, type: datetime, source: system, description: "Logical clock time of creation" }
      - { name: responded_at, type: datetime, source: system, description: "Logical clock time of the latest respond call", default: null }
      - { name: satisfied_study_types, type: array, source: computed, description: "Required types with >= 1 ACCEPTED StudySubmission bearing data_call_in_id == this DCI" }
      - { name: pending_study_types, type: array, source: computed, description: "Required types with no ACCEPTED but >= 1 RECEIVED StudySubmission bearing this DCI" }
      - { name: outstanding_study_types, type: array, source: computed, description: "required_study_types minus satisfied_study_types minus pending_study_types; invariant: required == satisfied + pending + outstanding as sets" }

  - name: CancellationProceeding
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; target product" }
      - { name: proceeding_type, type: enum, source: input, description: "CANCELLATION | SUSPENSION" }
      - { name: reason, type: enum, source: input, description: "RISK_FINDING | IMMINENT_HAZARD | DCI_DELINQUENCY | REGISTRANT_REQUEST; auto-created delinquency proceedings carry DCI_DELINQUENCY" }
      - { name: status, type: enum, source: system, description: "INITIATED | HEARING_HELD | EFFECTIVE | VACATED", default: "INITIATED" }
      - { name: auto_created, type: boolean, source: system, description: "True only for the system-created EFFECTIVE suspension issued by the DCI-delinquency cascade", default: false }
      - { name: initiated_by_ref, type: string, source: system, description: "Opaque X-User-ID of the initiating RegistrationReviewer; 'system' for auto-created proceedings; segregation-of-duties anchor for issue-order" }
      - { name: initiated_at, type: datetime, source: system, description: "Logical clock time of creation" }
      - { name: hearing_held_at, type: datetime, source: system, description: "Logical clock time of the hearing; CANCELLATION only", default: null }
      - { name: effective_at, type: datetime, source: system, description: "Logical clock time the order took effect", default: null }
      - { name: vacated_at, type: datetime, source: system, description: "Logical clock time of vacatur", default: null }
      - { name: pre_effective_product_status, type: enum, source: system, description: "Product.status captured at issue-order; vacatur of an EFFECTIVE CANCELLATION restores the product to this value", default: null }
      - { name: existing_stocks_authorized_units, type: integer, source: input, description: "Units authorized for sell-through; required on CANCELLATION issue-order, forbidden on SUSPENSION; >= 0", default: null }
      - { name: stocks_method, type: enum, source: input, description: "FIXED | DEPLETION; required on CANCELLATION issue-order, forbidden on SUSPENSION", default: null }
      - { name: depletion_rate_units_per_month, type: integer, source: input, description: "Required iff stocks_method == DEPLETION; > 0", default: null }
      - { name: allow_sale_until, type: datetime, source: computed, description: "Per calculations.existing_stocks_deadlines; null when no stocks provision", default: null }
      - { name: allow_use_until, type: datetime, source: computed, description: "Per calculations.existing_stocks_deadlines; null when no stocks provision", default: null }
      - { name: existing_stocks_disposals, type: array, source: system, description: "Append-only array of disposal records {disposed_at, units, method} (method SALE | RETURN | DESTRUCTION)", default: [] }
      - { name: existing_stocks_disposed_units, type: integer, source: computed, description: "Sum of units over existing_stocks_disposals", default: 0 }

  - name: StateRegistration
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; federally registered product seeking state registration" }
      - { name: registrant_ref, type: string, source: system, description: "Opaque X-User-ID of the creating RegistrantRepresentative" }
      - { name: state_code, type: string, source: input, description: "Target state; must exist in STATE_BASE_FEE_CENTS" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | GRANTED | DENIED | REVOKED | LAPSED", default: "SUBMITTED" }
      - { name: additional_restrictions, type: array, source: system, description: "State-imposed restriction codes beyond the federal label, captured from the GRANT decision payload (default [])", default: [] }
      - { name: annual_fee_cents, type: integer, source: system, description: "STATE_BASE_FEE_CENTS[state_code] + RUP_SURCHARGE_CENTS if the product is RESTRICTED_USE at grant time; stamped at grant and used as the renewal subtotal", default: null }
      - { name: submitted_at, type: datetime, source: system, description: "Logical clock time of creation" }
      - { name: granted_at, type: datetime, source: system, description: "Logical clock time of the most recent GRANT", default: null }
      - { name: renewal_due_at, type: datetime, source: system, description: "granted_at + RENEWAL_PERIOD_DAYS (365) at grant; each renewal advances it by 365 days FROM ITS PREVIOUS VALUE, never from the payment date", default: null }
      - { name: last_renewal_at, type: datetime, source: system, description: "Logical clock time of the most recent renewal", default: null }
      - { name: renewal_count, type: integer, source: system, description: "Number of successful renewals", default: 0 }

# =============================================================================
# Table 2: State Machine Table (§1.2)
# =============================================================================
state_machines:
  - entity: Product
    initial_state: UNREGISTERED
    terminal_states: [CANCELLED]   # CANCELLED has exactly one documented exception: the vacatur restore below
    transitions:
      - from: UNREGISTERED
        to: REGISTERED
        trigger: "POST /pesticide-registry/registration-applications/{id}/review-decisions with decision=APPROVE"
        actor: RegistrationReviewer
        preconditions:
          - "Application in IN_REVIEW and all approval gates pass (see application machine)"
        side_effects:
          - "Product.classification := application.final_classification; signal_word derived from tox_category; epa_registration_number minted"
          - "First RegistrationReviewCase auto-created: cycle_number 1, SCHEDULED, opened_at = clock + 5475 days, due_at = opened_at + 180 days"
          - "Application's UseSites PROPOSED -> ACTIVE; application's PROPOSED Tolerances -> ESTABLISHED (established_at = clock)"
      - from: REGISTERED
        to: UNDER_REVIEW
        trigger: "system (clock sweep opens a SCHEDULED RegistrationReviewCase of this product)"
        actor: system
        preconditions: ["Case.opened_at <= clock, case in SCHEDULED, product REGISTERED"]
        side_effects: []
      - from: UNDER_REVIEW
        to: REGISTERED
        trigger: "POST /pesticide-registry/registration-review-cases/{id}/complete completing the product's last non-terminal case; also POST .../products/{id}/reinstate fallback"
        actor: RegistrationReviewer
        preconditions: ["No other case of the product in OPEN/DCI_PENDING/UNDER_REVIEW"]
        side_effects: []
      - from: REGISTERED
        to: SUSPENDED
        trigger: "POST .../cancellation-proceedings/{id}/issue-order on a SUSPENSION proceeding, or system auto-suspension from the DCI-delinquency cascade"
        actor: RegistrationReviewer | system
        preconditions: ["Proceeding EFFECTIVE with type SUSPENSION"]
        side_effects:
          - "Hop A: StateRegistrations of this product in SUBMITTED -> DENIED"
      - from: UNDER_REVIEW
        to: SUSPENDED
        trigger: "same as REGISTERED -> SUSPENDED"
        actor: RegistrationReviewer | system
        preconditions: ["Proceeding EFFECTIVE with type SUSPENSION"]
        side_effects:
          - "Hop A: StateRegistrations of this product in SUBMITTED -> DENIED"
      - from: SUSPENDED
        to: REGISTERED
        trigger: "POST /pesticide-registry/products/{id}/reinstate"
        actor: RegistrationReviewer
        preconditions:
          - "Product SUSPENDED (ERR_PRODUCT_NOT_SUSPENDED otherwise)"
          - "No CancellationProceeding of this product in EFFECTIVE (ERR_REINSTATEMENT_BLOCKED)"
          - "No DataCallIn of any case of this product in ISSUED/RESPONDED/DEFICIENT/DELINQUENT (ERR_REINSTATEMENT_BLOCKED)"
        side_effects:
          - "Product -> UNDER_REVIEW instead when a case of the product is in OPEN/DCI_PENDING/UNDER_REVIEW (a merely SCHEDULED future cycle does not hold the product under review)"
      - from: SUSPENDED
        to: UNDER_REVIEW
        trigger: "POST /pesticide-registry/products/{id}/reinstate (when a non-terminal case exists)"
        actor: RegistrationReviewer
        preconditions: ["same as SUSPENDED -> REGISTERED"]
        side_effects: []
      - from: REGISTERED
        to: CANCELLED
        trigger: "POST .../cancellation-proceedings/{id}/issue-order on a CANCELLATION proceeding in HEARING_HELD"
        actor: RegistrationReviewer
        preconditions: ["Proceeding order validations pass"]
        side_effects:
          - "Proceeding.pre_effective_product_status captured before the flip"
          - "Hop 1: product CANCELLED"
          - "Hop 2 (caused by hop 1): Tolerances of the product in PROPOSED or ESTABLISHED -> REVOKED, pre_revocation_status := prior status, revoked_at := clock; UseSites in ACTIVE -> REMOVED, pre_removal_status := ACTIVE, removed_at := clock; non-terminal RegistrationApplications (DRAFT/IN_REVIEW/DATA_DEFICIENCY) -> WITHDRAWN and their PROPOSED UseSites/Tolerances removed/revoked with pre_*_status left null; StateRegistrations GRANTED or LAPSED -> REVOKED, SUBMITTED -> DENIED"
          - "Hop 3 (caused by hop 2's tolerance revocations): LabelAmendments of the product in SUBMITTED with amendment_type == NEW_USE whose payload.commodity_code equals a just-revoked tolerance's commodity_code -> REJECTED (decided_at := clock); other pending amendments are NOT touched"
      - from: UNDER_REVIEW
        to: CANCELLED
        trigger: "same cascade as REGISTERED -> CANCELLED"
        actor: RegistrationReviewer
        preconditions: ["Proceeding order validations pass"]
        side_effects: ["same cascade as REGISTERED -> CANCELLED"]
      - from: SUSPENDED
        to: CANCELLED
        trigger: "same cascade as REGISTERED -> CANCELLED"
        actor: RegistrationReviewer
        preconditions: ["Proceeding order validations pass"]
        side_effects: ["same cascade as REGISTERED -> CANCELLED"]
      - from: CANCELLED
        to: REGISTERED
        trigger: "POST .../cancellation-proceedings/{id}/vacate on the EFFECTIVE CANCELLATION proceeding"
        actor: RegistrationReviewer
        preconditions: ["Proceeding EFFECTIVE with type CANCELLATION"]
        side_effects:
          - "Product := proceeding.pre_effective_product_status (may restore UNDER_REVIEW or SUSPENDED instead of REGISTERED — target of this transition is the stored value; the three rows here enumerate the stored possibilities)"
          - "Tolerances with pre_revocation_status non-null and revoked_at == proceeding.effective_at -> restored to pre_revocation_status (pre_revocation_status cleared)"
          - "UseSites with pre_removal_status == ACTIVE and removed_at == proceeding.effective_at -> ACTIVE (pre_removal_status cleared)"
          - "NOT restored (documented asymmetry): StateRegistrations stay REVOKED/DENIED, applications stay WITHDRAWN, cascade-rejected amendments stay REJECTED"
        note: "Sole documented exception to CANCELLED terminality; models court vacatur of a cancellation order"
      - from: CANCELLED
        to: UNDER_REVIEW
        trigger: "vacatur restore when pre_effective_product_status == UNDER_REVIEW"
        actor: RegistrationReviewer
        preconditions: ["same as CANCELLED -> REGISTERED"]
        side_effects: ["same restore rules as CANCELLED -> REGISTERED"]
      - from: CANCELLED
        to: SUSPENDED
        trigger: "vacatur restore when pre_effective_product_status == SUSPENDED"
        actor: RegistrationReviewer
        preconditions: ["same as CANCELLED -> REGISTERED"]
        side_effects: ["same restore rules as CANCELLED -> REGISTERED"]

  - entity: RegistrationApplication
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST .../registration-applications/{id}/submit"
        actor: RegistrantRepresentative
        preconditions:
          - "Application in DRAFT (ERR_APPLICATION_NOT_SUBMITTABLE otherwise)"
          - "Product in UNREGISTERED (ERR_PRODUCT_NOT_UNREGISTERED otherwise)"
          - "No other application of the same product in DRAFT/IN_REVIEW/DATA_DEFICIENCY (ERR_DUPLICATE_OPEN_APPLICATION)"
          - "Every required study type for use_pattern has >= 1 StudySubmission (any status) on this application: FOOD_USE and MIXED_USE require EFFICACY+TOXICOLOGY+ENVIRONMENTAL_FATE+RESIDUE_CHEMISTRY; NON_FOOD_USE requires EFFICACY+TOXICOLOGY+ENVIRONMENTAL_FATE (ERR_MISSING_REQUIRED_STUDIES)"
          - "payment_cents present and equal to APPLICATION_FEE_CENTS[use_pattern] (ERR_INCORRECT_FEE_PAYMENT)"
        side_effects:
          - "submitted_at := clock; review_due_at := clock + APPLICATION_REVIEW_DAYS[use_pattern]; payment_cents stored"
      - from: DATA_DEFICIENCY
        to: IN_REVIEW
        trigger: "POST .../registration-applications/{id}/submit (resubmission)"
        actor: RegistrantRepresentative
        preconditions:
          - "Application in DATA_DEFICIENCY (ERR_APPLICATION_NOT_SUBMITTABLE otherwise)"
          - "Required-study-type completeness re-checked (ERR_MISSING_REQUIRED_STUDIES)"
          - "payment_cents MUST be omitted; no second fee is charged"
        side_effects: ["submitted_at := clock; review_due_at NOT recomputed"]
      - from: IN_REVIEW
        to: DATA_DEFICIENCY
        trigger: "POST .../registration-applications/{id}/review-decisions with decision=DEFICIENCY"
        actor: RegistrationReviewer
        preconditions: ["Application in IN_REVIEW (ERR_APPLICATION_NOT_IN_REVIEW otherwise)"]
        side_effects: ["deficiency_count += 1"]
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST .../registration-applications/{id}/review-decisions with decision=APPROVE"
        actor: RegistrationReviewer
        preconditions:
          - "Application in IN_REVIEW (ERR_APPLICATION_NOT_IN_REVIEW otherwise)"
          - "Every required study type for use_pattern has >= 1 ACCEPTED StudySubmission on this application (ERR_MISSING_REQUIRED_STUDIES)"
          - "At least one RiskAssessment exists for the application (ERR_NO_RISK_ASSESSMENT)"
          - "Latest RiskAssessment (max assessment_seq) has level_of_concern_exceeded == false (ERR_LOC_EXCEEDED)"
          - "use_pattern in {FOOD_USE, MIXED_USE} requires >= 1 Tolerance of the product in PROPOSED (ERR_NO_PROPOSED_TOLERANCE)"
          - "final_classification present in payload (ERR_INVALID_REQUEST)"
          - "Segregation of duties: deciding X-User-ID != latest RiskAssessment.assessor_ref (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects:
          - "decided_at := clock; final_classification stored"
          - "Product UNREGISTERED -> REGISTERED cascade (see Product machine): classification, signal_word, epa_registration_number, first review case, use sites ACTIVE, tolerances ESTABLISHED"
      - from: IN_REVIEW
        to: DENIED
        trigger: "POST .../registration-applications/{id}/review-decisions with decision=DENY"
        actor: RegistrationReviewer
        preconditions: ["Application in IN_REVIEW (ERR_APPLICATION_NOT_IN_REVIEW otherwise)"]
        side_effects:
          - "decided_at := clock"
          - "Application's UseSites in PROPOSED -> REMOVED (pre_removal_status stays null)"
          - "Application's Tolerances in PROPOSED -> REVOKED (pre_revocation_status stays null)"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST .../registration-applications/{id}/withdraw"
        actor: RegistrantRepresentative
        preconditions: ["Application in DRAFT/IN_REVIEW/DATA_DEFICIENCY (ERR_APPLICATION_ALREADY_DECIDED otherwise)"]
        side_effects: ["same PROPOSED cleanup as DENY"]
      - from: IN_REVIEW
        to: WITHDRAWN
        trigger: "POST .../registration-applications/{id}/withdraw, or system cascade on product cancellation"
        actor: RegistrantRepresentative | system
        preconditions: ["Application in DRAFT/IN_REVIEW/DATA_DEFICIENCY"]
        side_effects: ["same PROPOSED cleanup as DENY"]
      - from: DATA_DEFICIENCY
        to: WITHDRAWN
        trigger: "POST .../registration-applications/{id}/withdraw, or system cascade on product cancellation"
        actor: RegistrantRepresentative | system
        preconditions: ["Application in DRAFT/IN_REVIEW/DATA_DEFICIENCY"]
        side_effects: ["same PROPOSED cleanup as DENY"]

  - entity: StudySubmission
    initial_state: RECEIVED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: RECEIVED
        to: ACCEPTED
        trigger: "POST .../study-submissions/{id}/review-decisions with decision=ACCEPT"
        actor: RiskAssessor
        preconditions: ["Study in RECEIVED (ERR_STUDY_NOT_DECIDABLE otherwise)"]
        side_effects:
