      - name: consent_ticket_expires_exactly_at_ttl
        grounds:
          - state_machines.ConsentTicket.GRANTED_to_EXPIRED
          - entities.ConsentTicket.fields.expires_at
          - errors.ERR_CONSENT_EXPIRED
          - endpoints.POST_/agdata/_clock/set_current_utc
        distinguishing_aspect: "Metric: consent age in hours against CONSENT_TTL_HOURS 72, on the diagnostic-session endpoint. At expires_at minus one second the ticket is still GRANTED; at exactly expires_at the clock sweep flips it to EXPIRED (>= semantics) and session creation fails with ERR_CONSENT_EXPIRED."
