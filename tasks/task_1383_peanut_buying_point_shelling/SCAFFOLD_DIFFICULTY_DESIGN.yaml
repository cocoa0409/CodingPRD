          - entities.Warehouse.fields.reserved_tons
        distinguishing_aspect: |
          Depth-4 chain from the deliver trigger: hop1 AllocationLine.shipped_tons
          written; hop2 StorageReceipt.tons_remaining debited (caused by hop1);
          hop3 Warehouse.stored_tons/reserved_tons recomputed (caused by hop2);
          hop4 BuyingPoint.intake_posture recomputed (caused by hop3) — posture
          flips SUSPENDED -> RESTRICTED only because the chain ran end to end.
          Different trigger than the run_ops cascade instance.
