  # ===========================================================================
  # Section: rbac (Table 7 claims: exclusive ops denied to other roles,
  # entity-backed identity, segregation of duties)
  # ===========================================================================
  - section: rbac
    instances:
      - name: cross_role_write_denials
        claim_type: role_denied
        grounds:
          - roles.EVSAdministrator
          - roles.EVSDispatcher
          - roles.EVSTechnician
          - roles.QualityAuditor
          - roles.BedPlacementCoordinator
          - roles.InfectionPreventionist
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: |
          The peer/segregated role model has NO superset role: the
          administrator cannot create clean requests or discharge beds, the
          dispatcher cannot restock or pull, the technician cannot audit, and
          the auditor cannot file demands — ten denials, ten identical 403s.
        test_recipe:
          setup:
            - "Clock 08:00; staff T1 (CLEAN) and A1 (AUDIT) exist so entity-backed role headers resolve"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/staff"
              payload: { employee_code: "T1", display_name: "Tech One", capabilities: ["CLEAN"], certifications: [] }
              as: EVSAdministrator
              captures: { t1: $.data.id }
            - call: "POST /evs/staff"
              payload: { employee_code: "A1", display_name: "Auditor One", capabilities: ["AUDIT"], certifications: [] }
              as: EVSAdministrator
              captures: { a1: $.data.id }
          trigger:
            - { call: "POST /evs/units", payload: { unit_code: "UX", display_name: "Nope" }, as: EVSDispatcher, captures: { d1: $.data.error_id } }
            - { call: "POST /evs/clean-requests", payload: { bed_id: "00000000-0000-0000-0000-000000000000", clean_type: "ROUTINE" }, as: EVSAdministrator, captures: { d2: $.data.error_id } }
            - { call: "POST /evs/beds/00000000-0000-0000-0000-000000000000/discharge", payload: {}, as: EVSAdministrator, captures: { d3: $.data.error_id } }
            - { call: "POST /evs/quality-audits", payload: { clean_request_id: "00000000-0000-0000-0000-000000000000", audit_method: "ATP_SWAB", rlu_reading: 100 }, as: EVSTechnician, as_user_id: "${t1}", captures: { d4: $.data.error_id } }
            - { call: "POST /evs/placement-demands", payload: { unit_id: "00000000-0000-0000-0000-000000000000", required_bed_kind: "STANDARD", urgency_tier: "URGENT", needed_by: "2026-08-01T20:00:00Z" }, as: QualityAuditor, as_user_id: "${a1}", captures: { d5: $.data.error_id } }
            - { call: "POST /evs/outbreak-events", payload: { unit_id: "00000000-0000-0000-0000-000000000000", pathogen_class: "MRSA" }, as: BedPlacementCoordinator, captures: { d6: $.data.error_id } }
            - { call: "POST /evs/quality-audits/00000000-0000-0000-0000-000000000000/void", payload: {}, as: EVSAdministrator, captures: { d7: $.data.error_id } }
            - { call: "POST /evs/supply-items/00000000-0000-0000-0000-000000000000/restock", payload: { quantity: 5 }, as: EVSDispatcher, captures: { d8: $.data.error_id } }
            - { call: "POST /evs/clean-requests/pull", payload: {}, as: EVSDispatcher, captures: { d9: $.data.error_id } }
            - { call: "POST /evs/maintenance-windows", payload: { bed_id: "00000000-0000-0000-0000-000000000000", start_at: "2026-08-01T10:00:00Z", end_at: "2026-08-01T11:00:00Z" }, as: BedPlacementCoordinator, captures: { d10: $.data.error_id } }
          assert:
            - "d1 == ERR_INSUFFICIENT_PERMISSIONS (403): units are EVSAdministrator-only"
            - "d2 == ERR_INSUFFICIENT_PERMISSIONS: admin is NOT a superset — clean-request creation is EVSDispatcher-only"
            - "d3 == ERR_INSUFFICIENT_PERMISSIONS: discharge is BedPlacementCoordinator-only"
            - "d4 == ERR_INSUFFICIENT_PERMISSIONS: audit submission is QualityAuditor-only"
            - "d5 == ERR_INSUFFICIENT_PERMISSIONS: demand creation is BedPlacementCoordinator-only"
            - "d6 == ERR_INSUFFICIENT_PERMISSIONS: outbreak declaration is InfectionPreventionist-only"
            - "d7 == ERR_INSUFFICIENT_PERMISSIONS: audit void is InfectionPreventionist-only"
            - "d8 == ERR_INSUFFICIENT_PERMISSIONS: restock is EVSAdministrator-only"
            - "d9 == ERR_INSUFFICIENT_PERMISSIONS: pull is EVSTechnician-only"
            - "d10 == ERR_INSUFFICIENT_PERMISSIONS: maintenance windows are EVSAdministrator-only"
            - "Every denial returned 403 before any existence check ran (all path/body ids were bogus yet no 404 surfaced)"

      - name: segregation_of_duties_auditor_cannot_audit_own_clean
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=6]
          - entities.QualityAudit.fields.auditor_id
          - entities.CleanRequest.fields.last_completed_by_staff_id
          - errors[ERR_AUDITOR_IS_CLEANER]
        distinguishing_aspect: |
          Segregation of duties binds even when one person holds BOTH
          capabilities: T1 (CLEAN+AUDIT) completes the clean as a technician
          and is then refused as its auditor (422 ERR_AUDITOR_IS_CLEANER);
          an independent auditor's PASS on the identical reading succeeds.
        test_recipe:
          setup:
            - "Clock 08:00; unit U1; ROUTINE standard; DISINFECTANT/CLOTH; bed B1"
            - "T1 dual-capable (CLEAN, AUDIT) ON_SHIFT; A1 (AUDIT) independent auditor"
            - "R1 assigned to T1, started 08:00, completed 08:45 (last_completed_by_staff_id == T1)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/units"
              payload: { unit_code: "U1", display_name: "Unit One" }
              as: EVSAdministrator
              captures: { u1: $.data.id }
            - call: "POST /evs/clean-standards"
              payload: { clean_type: "ROUTINE", base_minutes: 45, outbreak_multiplier_bps: 15000, atp_rlu_threshold: 250 }
              as: EVSAdministrator
            - call: "POST /evs/supply-items"
              payload: { item_code: "DISINFECTANT", display_name: "Disinfectant", initial_on_hand: 100, reorder_threshold: 10 }
              as: EVSAdministrator
            - call: "POST /evs/supply-items"
              payload: { item_code: "CLOTH", display_name: "Cloths", initial_on_hand: 200, reorder_threshold: 20 }
              as: EVSAdministrator
            - call: "POST /evs/staff"
              payload: { employee_code: "T1", display_name: "Tech One", capabilities: ["CLEAN", "AUDIT"], certifications: [] }
              as: EVSAdministrator
              captures: { t1: $.data.id }
            - call: "POST /evs/staff"
              payload: { employee_code: "A1", display_name: "Auditor One", capabilities: ["AUDIT"], certifications: [] }
              as: EVSAdministrator
              captures: { a1: $.data.id }
            - call: "POST /evs/staff/${t1}/clock-in"
              payload: {}
              as: EVSTechnician
              as_user_id: "${t1}"
            - call: "POST /evs/beds"
              payload: { unit_id: "${u1}", bed_code: "B1", bed_kind: "STANDARD" }
              as: EVSAdministrator
              captures: { b1: $.data.id }
            - call: "POST /evs/clean-requests"
              payload: { bed_id: "${b1}", clean_type: "ROUTINE" }
              as: EVSDispatcher
              captures: { r1: $.data.id }
            - call: "POST /evs/clean-requests/${r1}/assign"
              payload: { staff_id: "${t1}" }
              as: EVSDispatcher
            - call: "POST /evs/clean-requests/${r1}/start"
              payload: {}
              as: EVSTechnician
              as_user_id: "${t1}"
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:45:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/clean-requests/${r1}/complete"
              payload: {}
              as: EVSTechnician
              as_user_id: "${t1}"
          trigger:
            - call: "POST /evs/quality-audits"
              payload: { clean_request_id: "${r1}", audit_method: "ATP_SWAB", rlu_reading: 100 }
              as: QualityAuditor
              as_user_id: "${t1}"
              captures: { err: $.data.error_id }
            - call: "POST /evs/quality-audits"
              payload: { clean_request_id: "${r1}", audit_method: "ATP_SWAB", rlu_reading: 100 }
              as: QualityAuditor
              as_user_id: "${a1}"
              captures: { au_ok: $.data.id }
          assert:
            - "err == ERR_AUDITOR_IS_CLEANER (422): auditor X-User-ID == request's last_completed_by_staff_id"
            - "After the rejection, CleanRequest.${r1}.status == PENDING_QA (no result recorded from the barred audit)"
            - "QualityAuditor ${a1}'s identical reading (rlu 100) is accepted: QualityAudit.${au_ok}.result == PASS and CleanRequest.${r1}.status == VERIFIED"

      - name: entity_backed_role_capability_enforced
        claim_type: role_denied
        grounds:
          - validations[priority=3.5]
          - roles.EVSTechnician
          - roles.QualityAuditor
          - errors[ERR_ROLE_CAPABILITY_MISMATCH]
        distinguishing_aspect: |
          Entity-backed roles check the StaffMember row behind X-User-ID: an
          AUDIT-only member acting as EVSTechnician and a CLEAN-only member
          acting as QualityAuditor both fail 403 ERR_ROLE_CAPABILITY_MISMATCH
          even though the role NAME is on the endpoint's role list.
        test_recipe:
          setup:
            - "Clock 08:00; staff A1 (capabilities [AUDIT]) and T1 (capabilities [CLEAN])"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/staff"
              payload: { employee_code: "A1", display_name: "Auditor One", capabilities: ["AUDIT"], certifications: [] }
              as: EVSAdministrator
              captures: { a1: $.data.id }
            - call: "POST /evs/staff"
              payload: { employee_code: "T1", display_name: "Tech One", capabilities: ["CLEAN"], certifications: [] }
              as: EVSAdministrator
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /evs/staff/${a1}/clock-in"
              payload: {}
              as: EVSTechnician
              as_user_id: "${a1}"
              captures: { e1: $.data.error_id }
            - call: "POST /evs/quality-audits"
              payload: { clean_request_id: "00000000-0000-0000-0000-000000000000", audit_method: "ATP_SWAB", rlu_reading: 100 }
              as: QualityAuditor
              as_user_id: "${t1}"
              captures: { e2: $.data.error_id }
          assert:
            - "e1 == ERR_ROLE_CAPABILITY_MISMATCH (403): EVSTechnician requires the CLEAN capability, A1 has only AUDIT"
            - "e2 == ERR_ROLE_CAPABILITY_MISMATCH (403): QualityAuditor requires AUDIT, T1 has only CLEAN — capability check (3.5) precedes existence (4), so the bogus clean_request_id never surfaces"

      - name: staff_self_service_identity_enforced
        claim_type: role_denied
        grounds:
          - validations[priority=4.5]
          - state_machines.StaffMember.OFF_SHIFT_to_ON_SHIFT
          - errors[ERR_STAFF_IDENTITY_MISMATCH]
        distinguishing_aspect: |
