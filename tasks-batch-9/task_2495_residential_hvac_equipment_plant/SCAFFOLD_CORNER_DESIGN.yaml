  - section: calculations
    instances:
      - name: c_leak_limit_for_a1_class_uses_full_helium_allowance
        claim_type: constants_applied
        grounds:
          - calculations.leak_test_verdict
          - entities.RefrigerantProgram.fields.flammability_class
          - entities.LeakTest.fields.applied_limit
        distinguishing_aspect: "On an A1 program the class_factor is 1.000, so the helium limit is the full 3.000 g/year and a measurement of exactly 3.00 passes - the A2L tightening factor must not be applied, and the at-limit comparison is inclusive."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
