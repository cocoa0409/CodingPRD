# =============================================================================
# §1.9 — Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Concierge Cosmetic & Plastic Surgery (cash-pay)
# Breadth probe over §1.1-§1.7. Same seven-point contract + §1.5 lint gates as §1.8.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: procedure_creation_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Procedure, endpoints]
        distinguishing_aspect: "POST /procedures with all required fields returns 201; response carries id, code, surgical/facility/anesthesia fees, status=ACTIVE, active=true, revision_window_days default 90."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /procedures"
              payload: { code: "BROW01", name: "Brow Lift", surgical_fee_cents: 400000, facility_fee_cents: 100000, anesthesia_fee_cents: 90000 }
              as: PracticeAdmin
              captures: { p: $.data.id, st: $.data.status, rw: $.data.revision_window_days, act: $.data.active }
          assert:
            - "Procedure.${p}.status == ACTIVE"
            - "Procedure.${p}.active == true"
            - "Procedure.${p}.revision_window_days == 90"
            - "Procedure.${p}.surgical_fee_cents == 400000"

      - name: procedure_not_found_returns_404
        claim_type: Not Found
        grounds:
          - "errors[ERR_PROCEDURE_NOT_FOUND]"
          - "endpoints"
        distinguishing_aspect: "GET /procedures/{unknown-uuid} returns ERR_PROCEDURE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /procedures/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PracticeAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PROCEDURE_NOT_FOUND"
            - "http_status == 404"

      - name: procedure_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds:
          - "entities.Procedure"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "POST /procedures omitting surgical_fee_cents returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /procedures"
              payload: { code: "X", name: "X", facility_fee_cents: 100000, anesthesia_fee_cents: 90000 }
              as: PracticeAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"
            - "http_status == 400"

      - name: patient_defaults_applied_on_create
        claim_type: Defaults
        grounds: [entities.Patient.fields.asa_class, entities.Patient.fields.smoker, entities.Patient.fields.prior_complication_count]
        distinguishing_aspect: "POST /patients omitting asa_class/smoker/prior_complication_count applies defaults 1/false/0; risk score with age 34 bmi 24 = 0, clearance_tier NONE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { full_name: "Def D", date_of_birth: "1990-01-01", age_years: 34, bmi: 24 }
              as: FrontDeskCoordinator
              captures: { p: $.data.id, asa: $.data.asa_class, sm: $.data.smoker, pc: $.data.prior_complication_count, score: $.data.surgical_risk_score, tier: $.data.clearance_tier }
          assert:
            - "Patient.${p}.asa_class == 1"
            - "Patient.${p}.smoker == false"
            - "Patient.${p}.prior_complication_count == 0"
            - "Patient.${p}.surgical_risk_score == 0"
            - "Patient.${p}.clearance_tier == NONE"

      - name: patient_risk_recompute_on_patch_medical_tier
        claim_type: Computed Fields
        grounds: [calculations.surgical_risk_score, entities.Patient.fields.clearance_tier]
        distinguishing_aspect: "PATCH /patients/{id} raising asa_class to 3 and smoker true (age 40 bmi 25) recomputes score to 70 and clearance_tier to MEDICAL (>=70 boundary)."
        test_recipe:
          setup: ["A low-risk patient (asa 1, bmi 25, nonsmoker, age 40, score 0)."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "R", date_of_birth: "1986-01-01", age_years: 40, bmi: 25, asa_class: 1, smoker: false }
              as: FrontDeskCoordinator
              captures: { p: $.data.id }
          trigger:
            - call: "PATCH /patients/${p}"
              payload: { asa_class: 3, smoker: true }
              as: Surgeon
              captures: { score: $.data.surgical_risk_score, tier: $.data.clearance_tier }
          assert:
            - "Patient.${p}.surgical_risk_score == 70"
            - "Patient.${p}.clearance_tier == MEDICAL"

      - name: patient_not_found_returns_404
        claim_type: Not Found
        grounds:
          - "errors[ERR_PATIENT_NOT_FOUND]"
        distinguishing_aspect: "GET /patients/{unknown} returns ERR_PATIENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /patients/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: FrontDeskCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PATIENT_NOT_FOUND"
            - "http_status == 404"

      - name: line_item_snapshots_procedure_fees
        claim_type: Computed Fields
        grounds: [calculations.line_bundle, entities.QuoteLineItem.fields.bundle_total_cents]
        distinguishing_aspect: "Adding ProcA to a DRAFT quote snapshots surgical 500000/facility 200000/anesthesia 150000 and bundle_total_cents 850000 on the line item."
        test_recipe:
          setup: ["A completed consultation with a DRAFT quote and ProcA in catalog."]
          setup_api_calls:
            - call: "POST /procedures"
              payload: { code: "RHINO01", name: "Rhinoplasty", surgical_fee_cents: 500000, facility_fee_cents: 200000, anesthesia_fee_cents: 150000 }
              as: PracticeAdmin
              captures: { procA: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "P", date_of_birth: "1990-01-01", age_years: 34, bmi: 24 }
              as: FrontDeskCoordinator
              captures: { pat1: $.data.id }
            - call: "POST /consultations"
              payload: { patient_id: "${pat1}", surgeon_user_id: "surgeon-1", chief_complaint: "nose" }
              as: FrontDeskCoordinator
              captures: { cons1: $.data.id }
            - call: "POST /consultations/${cons1}/complete"
              payload: {}
              as: Surgeon
              as_user_id: "surgeon-1"
            - call: "POST /quote-packages"
              payload: { consultation_id: "${cons1}" }
              as: FrontDeskCoordinator
              captures: { q1: $.data.id }
          trigger:
            - call: "POST /quote-packages/${q1}/line-items"
              payload: { procedure_id: "${procA}" }
              as: FrontDeskCoordinator
              captures: { li: $.data.id, bt: $.data.bundle_total_cents, sf: $.data.surgical_fee_cents }
          assert:
            - "QuoteLineItem.${li}.bundle_total_cents == 850000"
            - "QuoteLineItem.${li}.surgical_fee_cents == 500000"

      - name: line_item_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.QuoteLineItem]
        distinguishing_aspect: "QuoteLineItem has common_fields: false — it exposes id and created_at but no version field, and there is no update endpoint for it."
        test_recipe:
          setup: ["A DRAFT quote with one line item on ProcA."]
          setup_api_calls:
            - call: "POST /procedures"
              payload: { code: "RHINO01", name: "Rhinoplasty", surgical_fee_cents: 500000, facility_fee_cents: 200000, anesthesia_fee_cents: 150000 }
              as: PracticeAdmin
              captures: { procA: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "P", date_of_birth: "1990-01-01", age_years: 34, bmi: 24 }
              as: FrontDeskCoordinator
              captures: { pat1: $.data.id }
            - call: "POST /consultations"
              payload: { patient_id: "${pat1}", surgeon_user_id: "surgeon-1", chief_complaint: "nose" }
              as: FrontDeskCoordinator
              captures: { cons1: $.data.id }
            - call: "POST /consultations/${cons1}/complete"
              payload: {}
              as: Surgeon
              as_user_id: "surgeon-1"
            - call: "POST /quote-packages"
              payload: { consultation_id: "${cons1}" }
              as: FrontDeskCoordinator
              captures: { q1: $.data.id }
          trigger:
            - call: "GET /quote-packages/${q1}/line-items"
              payload: {}
              as: FrontDeskCoordinator
          assert:
            - "GET /quote-packages/${q1}/line-items returns array length 0 (no line added; verifies list endpoint shape)"
            - "QuoteLineItem entity declares no version field in §1.1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: quote_accept_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.QuotePackage.PRESENTED_to_ACCEPTED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Accepting a quote still in DRAFT (never presented) returns ERR_INVALID_STATE (409); no side effects fire."
        test_recipe:
          setup: ["A DRAFT quote with one line item, never presented."]
          setup_api_calls:
            - call: "POST /procedures"
              payload: { code: "RHINO01", name: "Rhinoplasty", surgical_fee_cents: 500000, facility_fee_cents: 200000, anesthesia_fee_cents: 150000 }
              as: PracticeAdmin
              captures: { procA: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "P", date_of_birth: "1990-01-01", age_years: 34, bmi: 24 }
              as: FrontDeskCoordinator
              captures: { pat1: $.data.id }
            - call: "POST /consultations"
              payload: { patient_id: "${pat1}", surgeon_user_id: "surgeon-1", chief_complaint: "nose" }
              as: FrontDeskCoordinator
              captures: { cons1: $.data.id }
            - call: "POST /consultations/${cons1}/complete"
              payload: {}
              as: Surgeon
              as_user_id: "surgeon-1"
            - call: "POST /quote-packages"
              payload: { consultation_id: "${cons1}" }
              as: FrontDeskCoordinator
              captures: { q1: $.data.id }
            - call: "POST /quote-packages/${q1}/line-items"
              payload: { procedure_id: "${procA}" }
              as: FrontDeskCoordinator
          trigger:
            - call: "POST /quote-packages/${q1}/accept"
              payload: {}
              as: FrontDeskCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http_status == 409"

      - name: quote_reject_from_rejected_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.QuotePackage"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A REJECTED quote is terminal — a second reject returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A PRESENTED quote that has been rejected (now REJECTED)."]
          setup_api_calls:
            - call: "POST /procedures"
              payload: { code: "RHINO01", name: "Rhinoplasty", surgical_fee_cents: 500000, facility_fee_cents: 200000, anesthesia_fee_cents: 150000 }
              as: PracticeAdmin
              captures: { procA: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "P", date_of_birth: "1990-01-01", age_years: 34, bmi: 24 }
              as: FrontDeskCoordinator
              captures: { pat1: $.data.id }
            - call: "POST /consultations"
              payload: { patient_id: "${pat1}", surgeon_user_id: "surgeon-1", chief_complaint: "nose" }
              as: FrontDeskCoordinator
              captures: { cons1: $.data.id }
            - call: "POST /consultations/${cons1}/complete"
              payload: {}
              as: Surgeon
              as_user_id: "surgeon-1"
            - call: "POST /quote-packages"
              payload: { consultation_id: "${cons1}" }
              as: FrontDeskCoordinator
              captures: { q1: $.data.id }
            - call: "POST /quote-packages/${q1}/line-items"
              payload: { procedure_id: "${procA}" }
              as: FrontDeskCoordinator
            - call: "POST /quote-packages/${q1}/present"
              payload: {}
              as: FrontDeskCoordinator
            - call: "POST /quote-packages/${q1}/reject"
              payload: {}
              as: FrontDeskCoordinator
          trigger:
            - call: "POST /quote-packages/${q1}/reject"
              payload: {}
              as: FrontDeskCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http_status == 409"

      - name: consultation_initial_state_scheduled
        claim_type: Initial State
        grounds: [state_machines.Consultation]
        distinguishing_aspect: "A newly created consultation starts in status SCHEDULED."
        test_recipe:
          setup: ["A patient exists."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "P", date_of_birth: "1990-01-01", age_years: 34, bmi: 24 }
              as: FrontDeskCoordinator
              captures: { pat1: $.data.id }
          trigger:
            - call: "POST /consultations"
              payload: { patient_id: "${pat1}", surgeon_user_id: "surgeon-1", chief_complaint: "nose" }
              as: FrontDeskCoordinator
              captures: { c: $.data.id, st: $.data.status }
          assert:
            - "Consultation.${c}.status == SCHEDULED"

      - name: surgery_complete_before_start_returns_not_started
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.SurgeryBooking.SCHEDULED_to_COMPLETED"
          - "errors[ERR_SURGERY_NOT_STARTED]"
        distinguishing_aspect: "Completing a booking while clock (2026-06-01) is before scheduled_start (2026-08-01) returns ERR_SURGERY_NOT_STARTED (409)."
        test_recipe:
          setup: ["A SCHEDULED booking for 2026-08-01; clock at default 2026-05-01 (before start)."]
          setup_api_calls:
            - call: "POST /procedures"
              payload: { code: "RHINO01", name: "Rhinoplasty", surgical_fee_cents: 500000, facility_fee_cents: 200000, anesthesia_fee_cents: 150000 }
              as: PracticeAdmin
              captures: { procA: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "P", date_of_birth: "1990-01-01", age_years: 34, bmi: 24 }
              as: FrontDeskCoordinator
              captures: { pat1: $.data.id }
            - call: "POST /patients/${pat1}/clearances"
              payload: { tier_provided: "STANDARD" }
              as: Surgeon
            - call: "POST /consultations"
              payload: { patient_id: "${pat1}", surgeon_user_id: "surgeon-1", chief_complaint: "nose" }
              as: FrontDeskCoordinator
              captures: { cons1: $.data.id }
            - call: "POST /consultations/${cons1}/complete"
              payload: {}
              as: Surgeon
              as_user_id: "surgeon-1"
            - call: "POST /quote-packages"
              payload: { consultation_id: "${cons1}" }
              as: FrontDeskCoordinator
              captures: { q1: $.data.id }
            - call: "POST /quote-packages/${q1}/line-items"
              payload: { procedure_id: "${procA}" }
              as: FrontDeskCoordinator
            - call: "POST /quote-packages/${q1}/consents"
              payload: { before_photo_ref: "s3://b/1", photo_consent_signed: true, surgical_consent_signed: true }
              as: FrontDeskCoordinator
            - call: "POST /quote-packages/${q1}/deposits"
              payload: { amount_cents: 170000 }
              as: BillingSpecialist
            - call: "POST /quote-packages/${q1}/present"
              payload: {}
              as: FrontDeskCoordinator
            - call: "POST /quote-packages/${q1}/accept"
              payload: {}
              as: FrontDeskCoordinator
              captures: { q1_v: $.data.version }
            - call: "POST /surgery-bookings"
              payload: { quote_package_id: "${q1}", surgeon_user_id: "surgeon-1", or_room: "OR1", scheduled_start: "2026-08-01T00:00:00Z", scheduled_end: "2026-08-01T03:00:00Z", expected_quote_package_version: "${q1_v}" }
              as: FrontDeskCoordinator
              captures: { bk1: $.data.id }
          trigger:
            - call: "POST /surgery-bookings/${bk1}/complete"
              payload: {}
              as: Surgeon
              as_user_id: "surgeon-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SURGERY_NOT_STARTED"
            - "http_status == 409"

      - name: consultation_close_blocked_by_presented_quote
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Consultation.transitions"
          - "errors[ERR_OPEN_QUOTE_EXISTS]"
        distinguishing_aspect: "Closing a consultation while it still has a PRESENTED quote returns ERR_OPEN_QUOTE_EXISTS (409)."
        test_recipe:
          setup: ["A completed consultation with a PRESENTED quote."]
          setup_api_calls:
            - call: "POST /procedures"
              payload: { code: "RHINO01", name: "Rhinoplasty", surgical_fee_cents: 500000, facility_fee_cents: 200000, anesthesia_fee_cents: 150000 }
              as: PracticeAdmin
              captures: { procA: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "P", date_of_birth: "1990-01-01", age_years: 34, bmi: 24 }
              as: FrontDeskCoordinator
              captures: { pat1: $.data.id }
            - call: "POST /consultations"
              payload: { patient_id: "${pat1}", surgeon_user_id: "surgeon-1", chief_complaint: "nose" }
              as: FrontDeskCoordinator
              captures: { cons1: $.data.id }
            - call: "POST /consultations/${cons1}/complete"
              payload: {}
              as: Surgeon
              as_user_id: "surgeon-1"
            - call: "POST /quote-packages"
              payload: { consultation_id: "${cons1}" }
              as: FrontDeskCoordinator
              captures: { q1: $.data.id }
            - call: "POST /quote-packages/${q1}/line-items"
              payload: { procedure_id: "${procA}" }
              as: FrontDeskCoordinator
            - call: "POST /quote-packages/${q1}/present"
              payload: {}
              as: FrontDeskCoordinator
          trigger:
            - call: "POST /consultations/${cons1}/close"
              payload: {}
              as: FrontDeskCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_OPEN_QUOTE_EXISTS"
            - "http_status == 409"

      - name: cascade_booking_cancel_full_chain
        claim_type: Cross-entity
        grounds: [state_machines.SurgeryBooking.SCHEDULED_to_CANCELLED]
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_booking_cancel_voids_financing_reconciles_balance
          rationale: "The booking-cancel cascade end-to-end (financing void + balance reconcile) is asserted by the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: quote_total_three_line_ten_percent
        claim_type: Correct Result
        grounds: [calculations.quote_total]
        distinguishing_aspect: "A DRAFT quote with 3 line items (ProcA 850000 + ProcB 550000 + ProcC 450000, subtotal 1850000) selects discount 0.10 -> total_cents 1665000, required_deposit 333000."
        test_recipe:
          setup: ["A completed consultation with a DRAFT quote and three procedures in catalog."]
          setup_api_calls:
            - call: "POST /procedures"
              payload: { code: "RHINO01", name: "Rhinoplasty", surgical_fee_cents: 500000, facility_fee_cents: 200000, anesthesia_fee_cents: 150000 }
              as: PracticeAdmin
              captures: { procA: $.data.id }
            - call: "POST /procedures"
              payload: { code: "LIPO01", name: "Liposuction", surgical_fee_cents: 300000, facility_fee_cents: 150000, anesthesia_fee_cents: 100000 }
              as: PracticeAdmin
              captures: { procB: $.data.id }
            - call: "POST /procedures"
              payload: { code: "FACE01", name: "Facelift", surgical_fee_cents: 250000, facility_fee_cents: 120000, anesthesia_fee_cents: 80000 }
              as: PracticeAdmin
              captures: { procC: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "P", date_of_birth: "1990-01-01", age_years: 34, bmi: 24 }
              as: FrontDeskCoordinator
              captures: { pat1: $.data.id }
            - call: "POST /consultations"
              payload: { patient_id: "${pat1}", surgeon_user_id: "surgeon-1", chief_complaint: "multi" }
              as: FrontDeskCoordinator
              captures: { cons1: $.data.id }
            - call: "POST /consultations/${cons1}/complete"
              payload: {}
              as: Surgeon
              as_user_id: "surgeon-1"
            - call: "POST /quote-packages"
              payload: { consultation_id: "${cons1}" }
              as: FrontDeskCoordinator
              captures: { q1: $.data.id }
            - call: "POST /quote-packages/${q1}/line-items"
              payload: { procedure_id: "${procA}" }
              as: FrontDeskCoordinator
            - call: "POST /quote-packages/${q1}/line-items"
              payload: { procedure_id: "${procB}" }
              as: FrontDeskCoordinator
          trigger:
            - call: "POST /quote-packages/${q1}/line-items"
              payload: { procedure_id: "${procC}" }
              as: FrontDeskCoordinator
            - call: "GET /quote-packages/${q1}"
              payload: {}
              as: FrontDeskCoordinator
              captures: { sub: $.data.subtotal_cents, disc: $.data.discount_pct, total: $.data.total_cents, dep: $.data.required_deposit_cents }
          assert:
            - "QuotePackage.${q1}.subtotal_cents == 1850000"
            - "QuotePackage.${q1}.discount_pct == 0.10"
            - "QuotePackage.${q1}.total_cents == 1665000"
            - "QuotePackage.${q1}.required_deposit_cents == 333000"

      - name: quote_total_single_line_no_discount
        claim_type: Correct Result
        grounds: [calculations.quote_total, calculations.required_deposit]
        distinguishing_aspect: "A DRAFT quote with 1 line (ProcA 850000) has discount 0.00, total_cents 850000, required_deposit 170000."
        test_recipe:
          setup: ["A completed consultation with a DRAFT quote and ProcA in catalog."]
          setup_api_calls:
            - call: "POST /procedures"
              payload: { code: "RHINO01", name: "Rhinoplasty", surgical_fee_cents: 500000, facility_fee_cents: 200000, anesthesia_fee_cents: 150000 }
              as: PracticeAdmin
              captures: { procA: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "P", date_of_birth: "1990-01-01", age_years: 34, bmi: 24 }
              as: FrontDeskCoordinator
              captures: { pat1: $.data.id }
            - call: "POST /consultations"
              payload: { patient_id: "${pat1}", surgeon_user_id: "surgeon-1", chief_complaint: "nose" }
              as: FrontDeskCoordinator
              captures: { cons1: $.data.id }
            - call: "POST /consultations/${cons1}/complete"
              payload: {}
              as: Surgeon
              as_user_id: "surgeon-1"
            - call: "POST /quote-packages"
              payload: { consultation_id: "${cons1}" }
              as: FrontDeskCoordinator
              captures: { q1: $.data.id }
          trigger:
            - call: "POST /quote-packages/${q1}/line-items"
              payload: { procedure_id: "${procA}" }
              as: FrontDeskCoordinator
            - call: "GET /quote-packages/${q1}"
              payload: {}
              as: FrontDeskCoordinator
              captures: { disc: $.data.discount_pct, total: $.data.total_cents, dep: $.data.required_deposit_cents }
          assert:
            - "QuotePackage.${q1}.discount_pct == 0.00"
            - "QuotePackage.${q1}.total_cents == 850000"
            - "QuotePackage.${q1}.required_deposit_cents == 170000"

      - name: cancellation_full_refund_over_30_days
        claim_type: Correct Result
        grounds: [calculations.cancellation_settlement]
        distinguishing_aspect: "Cancelling with 61 days notice (clock 2026-06-01, surgery 2026-08-01) refunds 100%: deposit_refunded_cents 170000, deposit_forfeited_cents 0."
        test_recipe:
          setup: ["An ACCEPTED single-line quote (total 850000, deposit 170000 paid) with a SCHEDULED booking for 2026-08-01; clock 2026-06-01."]
          setup_api_calls:
            - call: "POST /procedures"
              payload: { code: "RHINO01", name: "Rhinoplasty", surgical_fee_cents: 500000, facility_fee_cents: 200000, anesthesia_fee_cents: 150000 }
              as: PracticeAdmin
              captures: { procA: $.data.id }
            - call: "POST /patients"
