      - name: technician_schedule_conflict_error_on_overlapping_jobs
        claim_type: error_triggerable
        grounds:
          - errors.ERR_TECHNICIAN_SCHEDULE_CONFLICT
        excluded_because:
          difficulty_instance: resource_temporal_overlap / technician_schedule_half_open_adjacent_allowed_overlap_rejected
          rationale: "That §1.8 instance accepts the adjacent half-open window and rejects the one-minute overlap with ERR_TECHNICIAN_SCHEDULE_CONFLICT."

      - name: test_window_conflict_error_inside_the_stabilization_buffer
        claim_type: error_triggerable
        grounds:
          - errors.ERR_TEST_WINDOW_CONFLICT
        excluded_because:
          difficulty_instance: resource_temporal_overlap / leakage_test_window_buffered_closed_interval_conflict
          rationale: "That §1.8 instance places the second test exactly on the 30-minute buffered closed-interval endpoint and asserts ERR_TEST_WINDOW_CONFLICT."

  - section: rbac
    intent: >
      §1.7 declares four roles under role_model segregation_of_duties, with FieldTechnician
      entity_backed on Technician and the other three opaque. The breadth risks are: shared
      operations silently narrowed to one role, exclusive operations left open to everyone,
      the 403 ordered after the 404, and — the hard one for this domain — the three
      segregation-of-duties pairs at priority 30, which compare X-User-ID ALONE and so must
      still fire when the same person presents a different X-User-Role.
    instances:
      - name: shared_operations_accept_either_declared_role
        claim_type: shared_operations
        grounds:
          - roles.ProgramAdmin.shared_operations
          - roles.FieldTechnician.shared_operations
          - roles.QAVerifier.shared_operations
