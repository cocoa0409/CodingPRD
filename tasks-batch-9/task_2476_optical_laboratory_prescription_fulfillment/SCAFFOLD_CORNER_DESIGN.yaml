      - name: order_money_block_is_the_sum_of_its_component_charges
        claim_type: aggregation
        grounds:
          - calculations.order_quote_and_patient_portion
        excluded_because:
          difficulty_instance: compensating_invariant / order_cancel_returns_the_allocated_blank_and_conserves_the_lot_quantity_ledger
          rationale: >-
            The aggregate-and-conserve claim is exercised there as a ledger identity across a whole
            cancel cycle (received == on_hand + allocated + consumed + scrapped), which is a strictly
            stronger statement than one component sum; the money aggregation itself is asserted by the
            computed_read corner in the endpoints section.

      - name: expedite_bands_step_by_promised_turnaround
        claim_type: tiered_pricing
        grounds:
          - calculations.turnaround_and_expedite_fee
        excluded_because:
          difficulty_instance: dual_variant_calc / order_quote_provisional_versus_final_diverges_on_rx_order_money
          rationale: >-
            That instance walks the same order across two bands (0.30 provisional at 24 h and 0.20
            final at 36 h) and shows the fee falling from 13646 to 9997 as the tier steps, which
            covers the banding table in the only place where it is load-bearing.

