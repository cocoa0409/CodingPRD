    claim_type: role_denial
    grounds:
    - validations[priority=1]
    - errors[ERR_UNAUTHENTICATED]
    distinguishing_aspect: 'Priority 1 outranks every other rule: a request with no X-User-Role header is 401 even though it would also have failed the role check and the body-shape check.'
    test_recipe:
      setup:
      - One product exists.
      - The logical clock is 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: SystemOperator
      - call: POST /ladder-ops/products
