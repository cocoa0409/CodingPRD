  - rule_id: transitive_cascade
    instances:
      - name: invoice_payment_five_hop_close_cascade
        grounds:
          - state_machines.Invoice.APPROVED_to_PAID
          - state_machines.ConsultantInvoice.WITHHELD_to_RELEASED
          - state_machines.ConsultantSubcontract.EXECUTED_to_CLOSED
          - state_machines.Phase.IN_PROGRESS_to_COMPLETE
          - state_machines.Project.ACTIVE_to_CLOSED
        distinguishing_aspect: |
          Cash receipt propagates through five distinct entities in one request chain:
          Invoice -> ConsultantInvoice payment axis -> ConsultantSubcontract closure ->
          Phase.consultant_committed_open -> the phase-completion precondition, and the
          observable proof of the last hop is that POST /phases/{phase_id}/complete, which
          was blocked before the payment, now succeeds and bubbles the Project to CLOSED.
        test_recipe:
          setup:
            - "logical clock at 2026-06-01T00:00:00Z"
            - "private client with retainage_pct 0.0500; TIME_AND_MATERIALS project activated; one LUMP_SUM phase with phase_fee 200000.00"
            - "one EXECUTED subcontract committed exactly 20000.00 with pay_when_paid true, so a single release closes it"
            - "one approved payable of 20000.00 (billable 22000.00) swept onto an invoice the client has APPROVED (gross 22000.00, retainage 1100.00, net_due 20900.00)"
          setup_api_calls:
