          One walk that touches at least one exclusive operation of each of the six roles, in the
          only order the data dependencies allow: the operator sets the clock, the analyst produces
          every intelligence input and drafts and submits the assessment, the director reviews it
          and suspends a vendor, the manager builds the trip and its leg, the officer verifies the
