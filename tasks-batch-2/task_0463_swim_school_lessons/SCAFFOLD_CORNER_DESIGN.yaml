              payload: { parent_id: "${parent_id}", cycle_start: "2026-01-01T00:00:00Z", cycle_end: "2026-02-01T00:00:00Z", due_at: "2026-02-15T00:00:00Z", variant: "FORWARD_LOOKING" }
              as: BillingAdmin
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: BillingAdmin
          assert:
            - "Invoice.${inv_id}.total_cents == 12000"
            - "Parent.${parent_id}.outstanding_balance_cents == 12000"

      - name: invoice_pay_reverses_balance_compensating
        claim_type: derived_field_reconciliation
        grounds:
          - state_machines.Invoice.ISSUED_to_PAID
          - entities.Parent.fields.outstanding_balance_cents
        distinguishing_aspect: "Paying the issued invoice (correct expected_invoice_version) drives outstanding_balance_cents back to 0 -- forward issue + compensating pay leave the balance conserved at its pre-issue value."
        test_recipe:
          setup: ["Same as invoice_issue_increments_outstanding_balance, then pay with the correct captured version."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: SchoolAdmin
            - call: "POST /locations"
              payload: { name: "Main Pool" }
              as: SchoolAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /levels"
              payload: { name: "Level 1", sequence_order: 1, min_age_months: 0, max_age_months: 200, max_students_per_instructor: 4, monthly_tuition_cents: 12000 }
              as: SchoolAdmin
              captures: { lvl1_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Coach A", certified_level_ids: ["${lvl1_id}"] }
              as: SchoolAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /class-sessions"
              payload: { location_id: "${loc_id}", level_id: "${lvl1_id}", instructor_id: "${inst_id}", lane_number: 1, day_of_week: 1, start_minute: 600, end_minute: 645 }
              as: SchoolAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /class-sessions/${sess_id}/open"
              payload: {}
              as: SchoolAdmin
              captures: { sess_v: $.data.version }
            - call: "POST /parents"
              payload: { full_name: "Pat Parent", email: "pat@x.com" }
              as: SchoolAdmin
              captures: { parent_id: $.data.id }
            - call: "POST /parents/${parent_id}/students"
              payload: { full_name: "Kid One", birthdate: "2021-01-01T00:00:00Z", current_level_id: "${lvl1_id}" }
              as: Parent
              as_user_id: "${parent_id}"
              captures: { stu_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", class_session_id: "${sess_id}", expected_class_session_version: "${sess_v}" }
              as: Parent
              as_user_id: "${parent_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /invoices"
              payload: { parent_id: "${parent_id}", cycle_start: "2026-01-01T00:00:00Z", cycle_end: "2026-02-01T00:00:00Z", due_at: "2026-02-15T00:00:00Z", variant: "FORWARD_LOOKING" }
              as: BillingAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: BillingAdmin
              captures: { inv_v: $.data.version }
          trigger:
            - call: "POST /invoices/${inv_id}/pay"
              payload: { expected_invoice_version: "${inv_v}" }
              as: BillingAdmin
          assert:
            - "Invoice.${inv_id}.status == PAID"
            - "Parent.${parent_id}.outstanding_balance_cents == 0"

      - name: cascade_close_session_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ClassSession.OPEN_to_CLOSED
        excluded_because:
          difficulty_instance: transitive_cascade / student_withdraw_promotes_waitlist_debits_promoted_parent
          rationale: "Multi-hop seat/waitlist cascade is asserted by the named §1.8 transitive_cascade instance (close-session cascade is also covered by §1.9 close_session_cascade_withdraws_all_enrollments)."

