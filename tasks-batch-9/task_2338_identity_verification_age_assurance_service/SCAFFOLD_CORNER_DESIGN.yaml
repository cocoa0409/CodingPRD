  - name: knowledge_based_evidence_quality_truncates_the_ratio
    claim_type: precision
    grounds: [calculations.method_evidence_quality, entities.MethodAttempt.fields.evidence_quality_bps]
    excluded_because:
      difficulty_instance: combinatorial_formula / assurance_contributions_floored_per_attempt_before_summation
      rationale: "That instance already asserts 5 of 7 answers truncating to 7142 bps and 15 * 7142 / 10000 flooring to 10 points, alongside the two other truncating methods."
  - name: tamper_tier_multiplier_selection_from_the_constant_table
    claim_type: constants_applied
    grounds: [calculations.document_authenticity_assessment, entities.DocumentCapture.fields.tamper_tier_multiplier_bps]
    excluded_because:
      difficulty_instance: combinatorial_formula / document_tamper_tier_keyed_on_pre_penalty_base_score
      rationale: "That instance pins TIER_MULTIPLIER_MID_BPS and TAMPER_UNIT_BPS by asserting base 8889, multiplier 15000 and penalty 2700 in one request."
  - name: disparity_disclosure_and_gating_variants_diverge
    claim_type: variant_divergence
    grounds: [calculations.cohort_disparity_evaluation, entities.BiasAudit.fields.disparity_ratio_max_to_min_bps]
    excluded_because: {difficulty_instance: dual_variant_calc / disparity_disclosure_variant_diverges_from_gating_variant_on_same_cohorts, rationale: That instance runs both variants over identical cohorts
        and shows 12500 disclosure against 11338 gating with only the gating variant deciding MONITORED.}
  - name: bias_haircut_reconciled_when_the_final_variant_supersedes_provisional
    claim_type: reconciliation
    grounds: [calculations.assurance_score, entities.VerificationSession.fields.assurance_score_final]
    excluded_because:
      difficulty_instance: dual_variant_calc / assurance_final_variant_applies_bias_haircut_absent_from_provisional
      rationale: "That instance is the provisional-to-final reconciliation: the RESTRICTED profile halves one accepted attempt in FINAL only, and the delta is asserted on both fields."
  - name: age_estimation_gate_at_exactly_the_required_minimum_months
    claim_type: threshold
    grounds: [calculations.age_assurance_decision, entities.AgeAssuranceResult.fields.decision]
    excluded_because:
      difficulty_instance: boundary_precision_check / effective_age_exactly_at_required_minimum_months_is_assured
      rationale: "That instance sits the buffered effective age exactly on required_min_age_years * 12 and asserts ASSURED, which is the boundary claim for this calculation."
  - name: rolling_window_quota_aggregate_boundary
    claim_type: aggregation
    grounds:
    - calculations.client_rolling_window_usage
    - "validations[priority=49]"
    excluded_because: {difficulty_instance: resource_temporal_overlap / client_rolling_quota_window_closed_at_both_ends_with_aggregate_capacity, rationale: That instance tests the closed window at both
        ends and the aggregate count that trips ERR_CLIENT_DAILY_QUOTA_EXCEEDED.}
  - name: retention_sweep_deletes_at_the_exact_expiry_instant
    claim_type: threshold
    grounds: [calculations.retention_schedule, entities.BiometricTemplate.fields.retention_expires_at]
    excluded_because:
      difficulty_instance: boundary_precision_check / purge_scheduled_template_deleted_at_exact_retention_expiry_instant
      rationale: "That instance exercises the inclusive clock >= retention_expires_at comparison one second early and then exactly on the instant."
- section: validations
  instances:
  - name: duplicate_method_code_and_vendor_code_pair_is_rejected
    claim_type: violation_error
    grounds:
    - "validations[priority=35]"
    - "errors[ERR_METHOD_PROFILE_DUPLICATE]"
    - "endpoints[POST /idv/method-profiles]"
    distinguishing_aspect: "Uniqueness is on the pair, not on vendor_code alone: re-registering DOCUMENT_SCAN with vendor docv1 is rejected while DATABASE_CHECK with the same vendor_code docv1 would be\
      \ admissible."
    test_recipe:
      setup:
      - "The clock is 2026-08-01T00:00:00Z and one MethodProfile (DOCUMENT_SCAN, docv1) already exists."
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: "2026-08-01T00:00:00Z"
        as: PlatformAdmin
        as_user_id: admin-1
      - call: POST /idv/method-profiles
        payload: {method_code: DOCUMENT_SCAN, vendor_code: docv1, assurance_weight: 45, acceptance_floor_bps: 8000, far_bps: 30, frr_bps: 400, strong_evidence: true, cost_cents: 120}
        as: PlatformAdmin
        as_user_id: admin-1
        captures: {p_doc_id: $.data.id}
      trigger:
      - call: POST /idv/method-profiles
        payload: {method_code: DOCUMENT_SCAN, vendor_code: docv1, assurance_weight: 40, acceptance_floor_bps: 7000, far_bps: 50, frr_bps: 500, strong_evidence: true, cost_cents: 90}
        as: PlatformAdmin
        as_user_id: admin-1
        captures: *id001
      assert:
      - response status is 409 and $.data.error_id == ERR_METHOD_PROFILE_DUPLICATE
      - "the stored MethodProfile.${p_doc_id} still has assurance_weight == 45 and cost_cents == 120"
      - "GET /idv/method-profiles/${p_doc_id} shows version == 1, so the rejected request performed no write"
  - name: duplicate_client_and_policy_version_pair_is_rejected
    claim_type: violation_error
    grounds:
    - "validations[priority=36]"
    - "errors[ERR_POLICY_VERSION_DUPLICATE]"
    - "endpoints[POST /idv/verification-policies]"
    distinguishing_aspect: "policy_version is unique per client and the check ignores state, so a second policy_version 1 is rejected even though the first one is already PUBLISHED rather than DRAFT."
    test_recipe:
      setup:
      - "PlatformAdmin admin-1 sets the clock to 2026-08-01T00:00:00Z, onboards a LIVE client and the vendor method profiles, ComplianceOfficer co-1 publishes policy v1, and the ClientIntegrator opens a\
        \ session."
      - Policy v1 of the client is PUBLISHED.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: "2026-08-01T00:00:00Z"
        as: PlatformAdmin
        as_user_id: admin-1
      - call: POST /idv/clients
        payload: {name: Acme PolDup, home_jurisdiction_code: US, biometric_retention_mode: DELETE_ON_COMPLETE, daily_session_quota: 50, granted_review_credits: 1}
        as: PlatformAdmin
        as_user_id: admin-1
        captures: {client_id: $.data.id}
      - call: "PATCH /idv/clients/${client_id}"
        payload: {integration_state: LIVE}
        as: PlatformAdmin
        as_user_id: admin-1
        captures: {client_v: $.data.version}
      - call: POST /idv/method-profiles
        payload: {method_code: DOCUMENT_SCAN, vendor_code: docv1, assurance_weight: 45, acceptance_floor_bps: 8000, far_bps: 30, frr_bps: 400, strong_evidence: true, cost_cents: 120}
        as: PlatformAdmin
        as_user_id: admin-1
        captures: {p_doc_id: $.data.id}
      - call: POST /idv/verification-policies
        payload:
          client_id: "${client_id}"
          policy_version: 1
          allowed_method_codes: [DOCUMENT_SCAN]
          min_assurance_score: 40
        as: ClientIntegrator
        as_user_id: "${client_id}"
        captures: {policy_id: $.data.id}
      - call: "POST /idv/verification-policies/${policy_id}/publish"
        payload:
          expected_client_version: "${client_v}"
        as: ComplianceOfficer
        as_user_id: co-1
      trigger:
      - call: POST /idv/verification-policies
        payload:
          client_id: "${client_id}"
          policy_version: 1
          allowed_method_codes: [DATABASE_CHECK]
          min_assurance_score: 20
        as: ClientIntegrator
        as_user_id: "${client_id}"
        captures: *id001
      assert:
      - response status is 409 and $.data.error_id == ERR_POLICY_VERSION_DUPLICATE
      - "GET /idv/verification-policies?client_id=${client_id} returns total_count == 1"
