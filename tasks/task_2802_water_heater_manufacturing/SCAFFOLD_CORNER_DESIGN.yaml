          setup:
            - "Model GX50-T has three PASSED UEF tests plus PASSED first-hour-rating and recovery tests."
            - "Certification cert1 was created and then submitted by user 'eng-1'."
            - "Certification cert2 is created FIRST and cert1 second, so the create of cert1 drove cert2 from DRAFT to SUPERSEDED - cert2 is the terminal-state target used to prove the precedence of priority 8 over priority 9."
