# ===========================================================================
# 1.9 Scaffold Corner Design (Breadth Index)
# task_2818 - Community Risk Reduction & Smoke Alarm Program
# Sections and claim_type values come from
# skills/prd-bench-scaffold-generator/references/claim-extraction-guide.md.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as
# excluded_because: stubs with no test_recipe.
# ===========================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: zone_create_returns_full_envelope_and_initial_derived_fields
        claim_type: creation
        grounds:
          - entities.RiskZone
          - endpoints[POST /crr/zones]
          - response_envelope
        distinguishing_aspect: "A zone created with all 11 required inputs returns 201 inside the fixed { meta, response_type, data } envelope, with zone_kind LEAF, assessment_status UNASSESSED, risk_score null, version 1 and every counter at 0."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /crr/zones"
              payload: { zone_code: "Z-NEW", name: "New Leaf", occupied_units: 2000, structure_fire_count_5yr: 15, fire_injury_count_5yr: 2, pre_1980_unit_pct: 40.0, senior_household_pct: 20.0, under5_household_pct: 8.0, disability_household_pct: 4.0, assumed_alarm_absence_pct: 50.0, daily_visit_cap: 12 }
              as: RiskAnalyst
              captures: { z_id: $.data.id }
          assert:
            - "response.status == 201"
            - "response.meta.api_request_id is present and response.response_type == object"
            - "response.data carries the entity directly (no error_id / message keys)"
            - "RiskZone.${z_id}.zone_kind == LEAF"
            - "RiskZone.${z_id}.assessment_status == UNASSESSED"
            - "RiskZone.${z_id}.risk_score == null"
            - "RiskZone.${z_id}.risk_tier == null"
            - "RiskZone.${z_id}.parent_zone_id == null"
            - "RiskZone.${z_id}.surveyed_units == 0"
            - "RiskZone.${z_id}.served_household_count == 0"
            - "RiskZone.${z_id}.post_service_alarm_loss_units == 0"
            - "RiskZone.${z_id}.version == 1 (versions start at 1)"
            - "RiskZone.${z_id}.created_at == 2026-08-01T00:00:00Z"

      - name: household_get_by_id_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - entities.Household
          - endpoints[GET /crr/households/{id}]
        distinguishing_aspect: "GET /crr/households/{id} echoes every stored input field and the computed required_* counts of the row created in setup, with no list wrapper."
        test_recipe:
          setup:
            - "One assessed TIER_2 zone holding one household with 2 sleeping areas, 2 storeys, a fuel-burning appliance and one hearing-impaired occupant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /crr/zones"
              payload: { zone_code: "Z-B54", name: "Birchwood Leaf", occupied_units: 2000, structure_fire_count_5yr: 15, fire_injury_count_5yr: 2, pre_1980_unit_pct: 40.0, senior_household_pct: 20.0, under5_household_pct: 8.0, disability_household_pct: 4.0, assumed_alarm_absence_pct: 50.0, daily_visit_cap: 12 }
              as: RiskAnalyst
              captures: { z_id: $.data.id, z_v0: $.data.version }
            - call: "POST /crr/zones/${z_id}/assessments"
              payload: { basis: "PROVISIONAL", expected_zone_version: "${z_v0}" }
              as: RiskAnalyst
            - call: "POST /crr/households"
              payload: { zone_id: "${z_id}", address_line: "9 Birch Road", occupant_count: 3, sleeping_areas_count: 2, storeys: 2, hearing_impaired_occupants: 1, fuel_burning_appliance: true }
              as: CanvassCoordinator
              captures: { hh_id: $.data.id }
          trigger:
            - call: "GET /crr/households/${hh_id}"
              payload: {}
              as: CanvassCoordinator
          assert:
            - "response.status == 200"
            - "response.data.id == ${hh_id}"
            - "response.data.zone_id == ${z_id}"
            - "response.data.address_line == 9 Birch Road"
            - "response.data.required_smoke_devices == 4"
            - "response.data.required_co_devices == 1"
            - "response.data.required_strobe_devices == 1"
            - "response.data.status == INTAKE_QUEUED"
            - "response.data.priority_band == P1_PRIORITY"

      - name: households_list_is_paginated_and_filterable_by_zone
        claim_type: listing
        grounds:
          - endpoints[GET /crr/households]
          - pagination_defaults
        distinguishing_aspect: "With three households in one zone and limit 2, the list returns 2 rows plus total_count 3 and has_more true; offset 2 returns the remaining row with has_more false."
        test_recipe:
          setup:
            - "One assessed TIER_2 zone with exactly three households."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /crr/zones"
              payload: { zone_code: "Z-B54", name: "Birchwood Leaf", occupied_units: 2000, structure_fire_count_5yr: 15, fire_injury_count_5yr: 2, pre_1980_unit_pct: 40.0, senior_household_pct: 20.0, under5_household_pct: 8.0, disability_household_pct: 4.0, assumed_alarm_absence_pct: 50.0, daily_visit_cap: 12 }
              as: RiskAnalyst
              captures: { z_id: $.data.id, z_v0: $.data.version }
            - call: "POST /crr/zones/${z_id}/assessments"
              payload: { basis: "PROVISIONAL", expected_zone_version: "${z_v0}" }
              as: RiskAnalyst
            - call: "POST /crr/households"
              payload: { zone_id: "${z_id}", address_line: "1 Birch Road", occupant_count: 2, sleeping_areas_count: 1, storeys: 1 }
              as: CanvassCoordinator
            - call: "POST /crr/households"
              payload: { zone_id: "${z_id}", address_line: "2 Birch Road", occupant_count: 2, sleeping_areas_count: 1, storeys: 1 }
              as: CanvassCoordinator
            - call: "POST /crr/households"
              payload: { zone_id: "${z_id}", address_line: "3 Birch Road", occupant_count: 2, sleeping_areas_count: 1, storeys: 1 }
              as: CanvassCoordinator
          trigger:
            - call: "GET /crr/households"
              payload: { zone_id: "${z_id}", limit: 2, offset: 0 }
              as: CanvassCoordinator
            - call: "GET /crr/households"
              payload: { zone_id: "${z_id}", limit: 2, offset: 2 }
              as: CanvassCoordinator
          assert:
            - "the first read returns response.data length 2 with response.pagination.total_count == 3 and response.pagination.has_more == true"
            - "the second read returns response.data length 1 with response.pagination.has_more == false"
            - "response.pagination.limit == 2"
            - "every returned row has zone_id == ${z_id}"

      - name: visit_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors.ERR_VISIT_NOT_FOUND
          - endpoints[GET /crr/visits/{id}]
        distinguishing_aspect: "A syntactically valid but unknown visit id on the single-resource read returns 404 ERR_VISIT_NOT_FOUND, never 200 with a null body."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /crr/visits/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CanvassCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.error_id == ERR_VISIT_NOT_FOUND"
            - "response.response_type == error and response.data.message is a non-empty string"

      - name: household_create_without_sleeping_areas_count_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /crr/households]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Omitting the required sleeping_areas_count field returns 400 ERR_INVALID_REQUEST and creates no Household row, since the required_* counts cannot be derived without it."
        test_recipe:
          setup:
            - "One assessed TIER_2 zone."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /crr/zones"
              payload: { zone_code: "Z-B54", name: "Birchwood Leaf", occupied_units: 2000, structure_fire_count_5yr: 15, fire_injury_count_5yr: 2, pre_1980_unit_pct: 40.0, senior_household_pct: 20.0, under5_household_pct: 8.0, disability_household_pct: 4.0, assumed_alarm_absence_pct: 50.0, daily_visit_cap: 12 }
              as: RiskAnalyst
              captures: { z_id: $.data.id, z_v0: $.data.version }
            - call: "POST /crr/zones/${z_id}/assessments"
              payload: { basis: "PROVISIONAL", expected_zone_version: "${z_v0}" }
              as: RiskAnalyst
          trigger:
            - call: "POST /crr/households"
              payload: { zone_id: "${z_id}", address_line: "4 Birch Road", occupant_count: 2, storeys: 1 }
              as: CanvassCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.error_id == ERR_INVALID_REQUEST"
            - "GET /crr/households?zone_id=${z_id} returns total_count 0"

      - name: household_create_omitting_optional_occupant_counts_defaults_them_to_zero
        claim_type: defaults
        grounds:
          - entities.Household.fields.children_under5
          - entities.Household.fields.adults_65plus
          - entities.Household.fields.mobility_impaired_occupants
          - entities.Household.fields.hearing_impaired_occupants
          - entities.Household.fields.fuel_burning_appliance
        distinguishing_aspect: "With every optional vulnerability input omitted, all four counts default to 0, both appliance flags default to false, required_co_devices and required_strobe_devices are 0, and priority_band is decided by the zone tier alone."
        test_recipe:
          setup:
            - "One zone assessed at 54.52 / TIER_2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /crr/zones"
              payload: { zone_code: "Z-B54", name: "Birchwood Leaf", occupied_units: 2000, structure_fire_count_5yr: 15, fire_injury_count_5yr: 2, pre_1980_unit_pct: 40.0, senior_household_pct: 20.0, under5_household_pct: 8.0, disability_household_pct: 4.0, assumed_alarm_absence_pct: 50.0, daily_visit_cap: 12 }
              as: RiskAnalyst
              captures: { z_id: $.data.id, z_v0: $.data.version }
            - call: "POST /crr/zones/${z_id}/assessments"
              payload: { basis: "PROVISIONAL", expected_zone_version: "${z_v0}" }
              as: RiskAnalyst
          trigger:
            - call: "POST /crr/households"
              payload: { zone_id: "${z_id}", address_line: "5 Birch Road", occupant_count: 2, sleeping_areas_count: 1, storeys: 1 }
              as: CanvassCoordinator
              captures: { hh_id: $.data.id }
          assert:
            - "Household.${hh_id}.children_under5 == 0"
            - "Household.${hh_id}.adults_65plus == 0"
            - "Household.${hh_id}.mobility_impaired_occupants == 0"
            - "Household.${hh_id}.hearing_impaired_occupants == 0"
            - "Household.${hh_id}.fuel_burning_appliance == false"
            - "Household.${hh_id}.attached_garage == false"
            - "Household.${hh_id}.required_smoke_devices == 2"
            - "Household.${hh_id}.required_co_devices == 0"
            - "Household.${hh_id}.required_strobe_devices == 0"
            - "Household.${hh_id}.priority_band == P3_STANDARD"
            - "Household.${hh_id}.canvass_attempt_count == 0"
            - "Household.${hh_id}.alarm_retention_flag == null"

      - name: household_create_computed_counts_ignore_extra_field_in_body
        claim_type: computed_fields
        grounds:
          - calculations.alarm_placement_requirement
          - entities.Household.fields.required_smoke_devices
          - entities.Household.fields.priority_band
        distinguishing_aspect: "A body that also carries required_smoke_devices 99 and priority_band P1_PRIORITY must not override the computed values: the stored row still reads required_smoke_devices 3 (1 sleeping area + 2 storeys) and priority_band P3_STANDARD."
        test_recipe:
          setup:
            - "One zone assessed at 54.52 / TIER_2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /crr/zones"
              payload: { zone_code: "Z-B54", name: "Birchwood Leaf", occupied_units: 2000, structure_fire_count_5yr: 15, fire_injury_count_5yr: 2, pre_1980_unit_pct: 40.0, senior_household_pct: 20.0, under5_household_pct: 8.0, disability_household_pct: 4.0, assumed_alarm_absence_pct: 50.0, daily_visit_cap: 12 }
              as: RiskAnalyst
              captures: { z_id: $.data.id, z_v0: $.data.version }
            - call: "POST /crr/zones/${z_id}/assessments"
              payload: { basis: "PROVISIONAL", expected_zone_version: "${z_v0}" }
              as: RiskAnalyst
          trigger:
            - call: "POST /crr/households"
              payload: { zone_id: "${z_id}", address_line: "6 Birch Road", occupant_count: 2, sleeping_areas_count: 1, storeys: 2, required_smoke_devices: 99, priority_band: "P1_PRIORITY" }
              as: CanvassCoordinator
              captures: { hh_id: $.data.id }
          assert:
            - "Household.${hh_id}.required_smoke_devices == 3"
            - "Household.${hh_id}.priority_band == P3_STANDARD"
            - "Household.${hh_id}.storeys == 2"

      - name: zone_create_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - common_fields
          - entities.RiskZone
        distinguishing_aspect: "A body carrying id, created_at and version is ignored for those three fields: the server mints its own id, stamps created_at from the logical clock 2026-08-01T00:00:00Z and starts version at 0."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /crr/zones"
              payload: { zone_code: "Z-SYS", name: "System Fields Leaf", occupied_units: 2000, structure_fire_count_5yr: 15, fire_injury_count_5yr: 2, pre_1980_unit_pct: 40.0, senior_household_pct: 20.0, under5_household_pct: 8.0, disability_household_pct: 4.0, assumed_alarm_absence_pct: 50.0, daily_visit_cap: 12, id: "11111111-1111-4111-8111-111111111111", created_at: "2020-01-01T00:00:00Z", version: 42 }
              as: RiskAnalyst
              captures: { z_id: $.data.id }
          assert:
            - "RiskZone.${z_id}.id != 11111111-1111-4111-8111-111111111111"
            - "RiskZone.${z_id}.created_at == 2026-08-01T00:00:00Z"
            - "RiskZone.${z_id}.updated_at == 2026-08-01T00:00:00Z"
            - "RiskZone.${z_id}.version == 1"

      - name: zone_create_with_percentage_above_one_hundred_rejected
        claim_type: type_constraints
        grounds:
          - errors.ERR_INVALID_REQUEST
          - entities.RiskZone.fields.pre_1980_unit_pct
        distinguishing_aspect: "pre_1980_unit_pct 120.5 is outside the declared 0.00-100.00 range and returns 400 ERR_INVALID_REQUEST before any scoring runs; no RiskZone row is created."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /crr/zones"
              payload: { zone_code: "Z-BAD", name: "Bad Pct Leaf", occupied_units: 2000, structure_fire_count_5yr: 15, fire_injury_count_5yr: 2, pre_1980_unit_pct: 120.5, senior_household_pct: 20.0, under5_household_pct: 8.0, disability_household_pct: 4.0, assumed_alarm_absence_pct: 50.0, daily_visit_cap: 12 }
              as: RiskAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.error_id == ERR_INVALID_REQUEST"
            - "GET /crr/zones returns total_count 0"

      - name: fire_incident_row_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.FireIncident
          - endpoints[POST /crr/zones/{id}/fire-incidents]
          - endpoints[GET /crr/zones/{id}/fire-incidents]
        distinguishing_aspect: "FireIncident is declared common_fields false: the created row exposes id and created_at but no version and no updated_at, and §1.5 offers no update or delete endpoint for it - the append-only ledger the outcome calculation replays."
        test_recipe:
          setup:
            - "One assessed TIER_2 zone."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /crr/zones"
              payload: { zone_code: "Z-B54", name: "Birchwood Leaf", occupied_units: 2000, structure_fire_count_5yr: 15, fire_injury_count_5yr: 2, pre_1980_unit_pct: 40.0, senior_household_pct: 20.0, under5_household_pct: 8.0, disability_household_pct: 4.0, assumed_alarm_absence_pct: 50.0, daily_visit_cap: 12 }
              as: RiskAnalyst
              captures: { z_id: $.data.id, z_v0: $.data.version }
            - call: "POST /crr/zones/${z_id}/assessments"
              payload: { basis: "PROVISIONAL", expected_zone_version: "${z_v0}" }
              as: RiskAnalyst
          trigger:
            - call: "POST /crr/zones/${z_id}/fire-incidents"
              payload: { incident_number: "INC-2026-0001", occurred_at: "2026-05-01T03:20:00Z", working_alarm_present: false, injuries: 2 }
              as: RiskAnalyst
              captures: { inc_id: $.data.id }
          assert:
            - "response.status == 201"
            - "FireIncident.${inc_id}.zone_id == ${z_id}"
            - "FireIncident.${inc_id}.occurred_at == 2026-05-01T03:20:00Z"
            - "FireIncident.${inc_id}.injuries == 2"
            - "FireIncident.${inc_id}.fatalities == 0"
            - "the FireIncident response body contains no version field and no updated_at field"
            - "GET /crr/zones/${z_id}/fire-incidents returns exactly 1 row"

      - name: household_create_under_unknown_zone_returns_zone_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Household.fields.zone_id
          - errors.ERR_ZONE_NOT_FOUND
        distinguishing_aspect: "A body zone_id that matches no RiskZone returns 404 ERR_ZONE_NOT_FOUND (body-referenced existence, priority 5) rather than a 400 schema error or a dangling household."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /crr/households"
              payload: { zone_id: "00000000-0000-4000-8000-000000000000", address_line: "7 Birch Road", occupant_count: 2, sleeping_areas_count: 1, storeys: 1 }
              as: CanvassCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.error_id == ERR_ZONE_NOT_FOUND"

      - name: zone_create_under_a_child_zone_rejected_for_nesting_depth
        claim_type: graph_topology
        grounds:
          - validations[priority 28 - business_constraint - ERR_ZONE_NESTING_DEPTH]
          - calculations.district_risk_rollup
          - errors.ERR_ZONE_NESTING_DEPTH
        distinguishing_aspect: "The zone graph is capped at two levels: creating a zone whose parent_zone_id is itself a child returns 422 ERR_ZONE_NESTING_DEPTH, so no rollup can ever recurse."
        test_recipe:
          setup:
            - "A district zone D with one child zone B, so B.parent_zone_id is not null."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /crr/zones"
              payload: { zone_code: "Z-DIST", name: "Downtown District", occupied_units: 1, structure_fire_count_5yr: 0, fire_injury_count_5yr: 0, pre_1980_unit_pct: 0.0, senior_household_pct: 0.0, under5_household_pct: 0.0, disability_household_pct: 0.0, assumed_alarm_absence_pct: 0.0, daily_visit_cap: 4 }
              as: RiskAnalyst
              captures: { d_id: $.data.id }
            - call: "POST /crr/zones"
              payload: { zone_code: "Z-B54", name: "Birchwood Leaf", occupied_units: 2000, structure_fire_count_5yr: 15, fire_injury_count_5yr: 2, pre_1980_unit_pct: 40.0, senior_household_pct: 20.0, under5_household_pct: 8.0, disability_household_pct: 4.0, assumed_alarm_absence_pct: 50.0, daily_visit_cap: 12, parent_zone_id: "${d_id}" }
              as: RiskAnalyst
              captures: { z_b_id: $.data.id }
          trigger:
            - call: "POST /crr/zones"
              payload: { zone_code: "Z-GRAND", name: "Grandchild Leaf", occupied_units: 500, structure_fire_count_5yr: 2, fire_injury_count_5yr: 0, pre_1980_unit_pct: 10.0, senior_household_pct: 5.0, under5_household_pct: 2.0, disability_household_pct: 1.0, assumed_alarm_absence_pct: 20.0, daily_visit_cap: 2, parent_zone_id: "${z_b_id}" }
              as: RiskAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.error_id == ERR_ZONE_NESTING_DEPTH"
            - "RiskZone.${d_id}.zone_kind == DISTRICT"
            - "RiskZone.${z_b_id}.zone_kind == LEAF"

  - section: state_machines
    instances:
      - name: grant_create_starts_in_draft_with_an_empty_money_ledger
        claim_type: initial_state
        grounds:
          - state_machines[PartnerGrant].initial_state
          - entities.PartnerGrant
        distinguishing_aspect: "A freshly created PartnerGrant is DRAFT with reserved_cents 0, committed_cents 0, reported_grant_share_cents 0 and available_cents equal to authorized_cents - the ledger identity holds before any device movement."
        test_recipe:
          setup:
            - "One partner with a signed agreement."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /crr/partners"
              payload: { org_name: "Firesafe Trust", org_type: "NONPROFIT", contact_email: "grants@firesafe.example", agreement_signed: true }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /crr/grants"
