              as: FieldSupervisor
          trigger:
            - call: "POST /cases/${case_id}/attempts"
              payload: { mode: "IN_PERSON", window_start: "2026-03-01T10:00:00Z", window_end: "2026-03-01T11:00:00Z", disposition: "NO_ONE_HOME", mileage_miles: 0 }
              as: Enumerator
              as_user_id: "${en1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_AREA_BUDGET_EXCEEDED"

  # ---------------------------- Calculations ----------------------------------
  - section: calculations
    instances:
      - name: reverse_pay_line_updates_totals
        claim_type: correct_result
        grounds:
          - state_machines.PayLine.ACCRUED_to_REVERSED
          - entities.Enumerator.fields.reversed_pay_cents
          - entities.PayPeriod.fields.provisional_total_cents
        distinguishing_aspect: "Reversing a 2300 STIPEND line drives provisional_total_cents 2300->0, enumerator reversed_pay_cents 0->2300, net_pay_cents 2300->0."
        test_recipe:
          setup: ["A project with E1 and an OPEN pay period carrying one 2300 STIPEND line (provisional 2300, E1 gross 2300)."]
          setup_api_calls:
            - call: "POST /survey-projects"
              payload: { name: "Wave AM", region_code: "R1", default_language: "EN", supported_languages: ["EN"] }
              as: SurveyAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /survey-projects/${proj_id}/enumerators"
              payload: { full_name: "E1", languages: ["EN"], hourly_rate_cents: 3000 }
              as: SurveyAdmin
              captures: { en1_id: $.data.id }
            - call: "POST /survey-projects/${proj_id}/pay-periods"
              payload: { label: "P1" }
              as: SurveyAdmin
              captures: { pp_id: $.data.id }
            - call: "POST /pay-periods/${pp_id}/pay-lines"
              payload: { enumerator_id: "${en1_id}", line_type: "STIPEND", amount_cents: 2300 }
              as: SurveyAdmin
              captures: { pl_id: $.data.id }
          trigger:
            - call: "POST /pay-lines/${pl_id}/reverse"
              payload: {}
              as: SurveyAdmin
          assert:
            - "PayLine.${pl_id}.status == REVERSED"
            - "PayPeriod.${pp_id}.provisional_total_cents == 0"
            - "Enumerator.${en1_id}.reversed_pay_cents == 2300"
            - "Enumerator.${en1_id}.net_pay_cents == 0"

      - name: coverage_dual_variant_covered_by_difficulty
        claim_type: variant
        grounds:
          - calculations.area_coverage
        excluded_because:
          difficulty_instance: coverage_projected_vs_final_area
          rationale: "Projected vs final coverage divergence is asserted by the named §1.8 dual_variant_calc instance."

