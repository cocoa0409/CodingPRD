# =============================================================================
# PRD Benchmark Scaffold — Closeout Sourcing & Deal-Driven Store Set
# Task: task_3009_closeout_sourcing_deal_driven_store_set
# §1.0–§1.7 seed tables. Difficulty design (§1.8) and corner design (§1.9)
# live in sibling files; neither key appears here.
# =============================================================================

scenario: |
  Closeout Sourcing & Deal-Driven Store Set (Ollie's Bargain Outlet):
  manufacturer overrun, package-change and insurance-salvage lot acquisition
  with per-lot cost and condition grading, deal-dependent store layout where
  aisle assignment changes with each buy, quantity-limited signage and
  sell-through pacing across a store fleet fed from one lot, retail price
  setting against a substantiated comparison price with jurisdictional
  advertising rules, loyalty club member pricing and early-access events,
  salvage and distressed goods safety screening including recall and
  expiration checks, warehouse allocation of finite lots by store performance
  tier, unsold lot disposition through further markdown or secondary
  liquidation.

domain_name: closeout-deal-stores
api_prefix: ""

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Pricing engine"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Vendor display name" }
      - { name: vendor_code, type: string, source: input, description: "Unique vendor code", constraints: "unique across all vendors" }

  - name: JurisdictionRule
    parent: null
    common_fields: true
    fields:
      - { name: jurisdiction_code, type: string, source: input, description: "Unique jurisdiction code (e.g. CA, TX, NT)", constraints: "unique across all jurisdiction rules" }
      - { name: comparison_rule, type: enum, source: input, description: "WAS_NOW_WINDOW | MSRP_REFERENCE | COMPARISON_PROHIBITED" }
      - { name: window_days, type: integer, source: input, description: "Substantiation lookback window in days (required for WAS_NOW_WINDOW)", default: null }
      - { name: required_offer_days, type: integer, source: input, description: "Days the comparison price must have been offered inside the window (required for WAS_NOW_WINDOW)", default: null }
      - { name: max_advertised_discount_pct, type: integer, source: input, description: "Maximum advertised discount percent vs comparison price, 0-100" }
      - { name: member_discount_cap_pct, type: integer, source: input, description: "Maximum combined member discount percent off retail price, 0-100" }

  - name: Store
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Store display name" }
      - { name: store_code, type: string, source: input, description: "Unique store code", constraints: "unique across all stores" }
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> JurisdictionRule.id; governing advertising jurisdiction" }
      - { name: performance_tier, type: enum, source: input, description: "TIER_1 | TIER_2 | TIER_3; allocation waterfall priority, TIER_1 first" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: "ACTIVE" }

  - name: BuyLot
    parent: null
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; sourcing vendor" }
      - { name: home_jurisdiction_id, type: string, source: input, description: "FK -> JurisdictionRule.id; jurisdiction governing lot-level price substantiation" }
      - { name: title, type: string, source: input, description: "Lot title" }
      - { name: source_type, type: enum, source: input, description: "MFR_OVERRUN | PACKAGE_CHANGE | INSURANCE_SALVAGE" }
      - { name: condition_grade, type: enum, source: input, description: "A | B | C | MIXED; buyer-declared grade, revised by regrade" }
      - { name: quantity_total, type: integer, source: input, description: "Total sellable units acquired in the lot" }
      - { name: total_cost_cents, type: integer, source: input, description: "All-in acquisition cost for the lot, cents" }
      - { name: est_sellable_qty, type: integer, source: input, description: "Estimated sellable units at sourcing time (provisional cost basis)" }
      - { name: comparison_price_cents, type: integer, source: input, description: "Substantiated comparison (was/MSRP) unit price, cents" }
      - { name: vendor_msrp_cents, type: integer, source: input, description: "Vendor-declared MSRP unit price, cents (used by MSRP_REFERENCE rule)" }
      - { name: pace_target_units_per_week, type: integer, source: input, description: "Sell-through pace target: units per trailing 7-day window" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the SourcingBuyer who created the lot (segregation-of-duties anchor)" }
      - { name: safety_status, type: enum, source: system, description: "PENDING_SCREEN | CLEARED | BLOCKED", default: "PENDING_SCREEN" }
      - { name: commercial_status, type: enum, source: system, description: "SOURCED | SCREENING | CLEARED | PRICED | ON_SALE | DISPOSITION_REVIEW | BLOCKED | CLOSED_SOLD_OUT | CLOSED_LIQUIDATED | CLOSED_SCRAPPED", default: "SOURCED" }
      - { name: retail_price_cents, type: integer, source: system, description: "Current retail unit price, cents; set at pricing, reduced by markdowns", default: null }
      - { name: advertises_comparison, type: boolean, source: system, description: "Whether signage advertises the comparison price; fixed at pricing", default: false }
      - { name: sellable_qty_confirmed, type: integer, source: system, description: "Sum of screening grade counts of the latest PASSED screening; null until first PASSED", default: null }
      - { name: landed_unit_cost_cents, type: integer, source: computed, description: "Dual-variant unit cost: provisional before first PASSED screening, final after; see calculations.landed_unit_cost" }
      - { name: markdown_rounds, type: integer, source: system, description: "Count of applied MARKDOWN dispositions", default: 0 }
      - { name: on_sale_since, type: datetime, source: system, description: "Logical-clock timestamp of PRICED -> ON_SALE entry; null until first sale", default: null }
      - { name: qty_pool, type: integer, source: computed, description: "Unallocated warehouse units: quantity_total - outstanding - sold - liquidated - scrapped" }
      - { name: qty_allocated_outstanding, type: integer, source: computed, description: "Sum of qty_granted over allocations in CONFIRMED|SHIPPED plus store_on_hand_qty over allocations in RECEIVED" }
      - { name: qty_sold, type: integer, source: computed, description: "Sum of qty over purchases in COMPLETED status" }
      - { name: qty_liquidated, type: integer, source: system, description: "Units sent to secondary liquidation", default: 0 }
      - { name: qty_scrapped, type: integer, source: system, description: "Units scrapped", default: 0 }

  - name: SafetyScreening
    parent: BuyLot
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: system, description: "FK -> BuyLot.id; screened lot (path)" }
      - { name: round_number, type: integer, source: system, description: "1-based screening round for the lot" }
      - { name: screener_user_id, type: string, source: system, description: "X-User-ID of the SafetyOfficer who opened the screening" }
      - { name: status, type: enum, source: system, description: "PENDING | COMPLETED", default: "PENDING" }
      - { name: recall_check, type: enum, source: input, description: "PASS | FAIL; set at completion", default: null }
      - { name: expiration_check, type: enum, source: input, description: "PASS | FAIL | NA; set at completion", default: null }
      - { name: condition_verified, type: boolean, source: input, description: "Whether observed condition matches declared grade; set at completion", default: null }
      - { name: qty_grade_a, type: integer, source: input, description: "Units observed grade A; set at completion", default: null }
      - { name: qty_grade_b, type: integer, source: input, description: "Units observed grade B; set at completion", default: null }
      - { name: qty_grade_c, type: integer, source: input, description: "Units observed grade C; set at completion", default: null }
      - { name: result, type: enum, source: computed, description: "PASSED | FAILED_RECALL | FAILED_EXPIRATION | FAILED_CONDITION; derived at completion", default: null }
      - { name: notes, type: string, source: input, description: "Optional notes", default: null }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock completion timestamp", default: null }

  - name: Allocation
    parent: BuyLot
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: system, description: "FK -> BuyLot.id; allocated lot (path)" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; destination store" }
      - { name: qty_requested, type: integer, source: input, description: "Units requested by the allocator" }
      - { name: qty_granted, type: integer, source: system, description: "Units granted by the waterfall commit; 0 until committed", default: 0 }
      - { name: store_on_hand_qty, type: integer, source: system, description: "Units on the store floor from this allocation; set to qty_granted on RECEIVED, decremented by purchases, restored by refunds", default: 0 }
      - { name: status, type: enum, source: system, description: "PROPOSED | CONFIRMED | SHIPPED | RECEIVED | RELEASED | CANCELLED", default: "PROPOSED" }

  - name: AisleAssignment
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: system, description: "FK -> Store.id; store whose layout changes (path)" }
      - { name: lot_id, type: string, source: input, description: "FK -> BuyLot.id; deal occupying the aisle" }
      - { name: aisle_code, type: string, source: input, description: "Aisle identifier within the store" }
      - { name: daily_unit_limit, type: integer, source: input, description: "Quantity-limited signage: max units per member (or shared guest bucket) per UTC day at this store" }
      - { name: valid_from, type: datetime, source: input, description: "Window start (inclusive); defaults to current logical clock time", default: "now" }
      - { name: valid_to, type: datetime, source: input, description: "Window end (inclusive); null = open-ended", default: null }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED", default: "ACTIVE" }

  - name: LoyaltyMember
    parent: null
    common_fields: true
    fields:
      - { name: member_code, type: string, source: input, description: "Unique loyalty club member code", constraints: "unique across all members" }
      - { name: tier, type: enum, source: input, description: "BRONZE | SILVER | GOLD" }
      - { name: home_store_id, type: string, source: input, description: "FK -> Store.id; member home store" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: "ACTIVE" }

  - name: EarlyAccessEvent
    parent: BuyLot
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: system, description: "FK -> BuyLot.id; lot offered early (path)" }
      - { name: starts_at, type: datetime, source: input, description: "Window start (inclusive), half-open interval semantics" }
      - { name: ends_at, type: datetime, source: input, description: "Window end (exclusive), half-open interval semantics" }
      - { name: min_tier, type: enum, source: input, description: "BRONZE | SILVER | GOLD; minimum member tier admitted" }
      - { name: extra_discount_pct, type: integer, source: input, description: "Extra member discount percent during the event, 0-100" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ACTIVE | ENDED | CANCELLED", default: "SCHEDULED" }

  - name: Purchase
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: system, description: "FK -> Store.id; selling store (path)" }
      - { name: lot_id, type: string, source: input, description: "FK -> BuyLot.id; lot being sold" }
      - { name: member_id, type: string, source: input, description: "FK -> LoyaltyMember.id; null/absent for guest purchases", default: null }
      - { name: qty, type: integer, source: input, description: "Units purchased" }
      - { name: pricing_variant, type: enum, source: computed, description: "EVENT | STANDARD | GUEST; which price variant was applied" }
      - { name: discount_pct_applied, type: integer, source: computed, description: "Combined discount percent applied off retail (0 for guests)" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Per-unit charged price, cents (per-unit rounding pinned; see calculations.member_price)" }
      - { name: line_total_cents, type: integer, source: computed, description: "unit_price_cents * qty" }
      - { name: status, type: enum, source: system, description: "COMPLETED | REFUNDED", default: "COMPLETED" }
      - { name: refunded_at, type: datetime, source: system, description: "Logical-clock refund timestamp", default: null }

  - name: Disposition
    parent: BuyLot
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: system, description: "FK -> BuyLot.id; lot being disposed (path)" }
      - { name: action, type: enum, source: input, description: "MARKDOWN | LIQUIDATE | SCRAP" }
      - { name: markdown_pct, type: integer, source: input, description: "Markdown percent off current retail, 1-50; required for MARKDOWN", default: null }
      - { name: liquidator_ref, type: string, source: input, description: "Secondary liquidator reference; required for LIQUIDATE", default: null }
      - { name: recovery_cents, type: integer, source: input, description: "Total liquidation recovery, cents; required for LIQUIDATE", default: null }
      - { name: status, type: enum, source: system, description: "PENDING | APPLIED | SUPERSEDED", default: "PENDING" }
      - { name: applied_at, type: datetime, source: system, description: "Logical-clock application timestamp", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: BuyLot
    field: commercial_status
    initial_state: SOURCED
    terminal_states: [CLOSED_SOLD_OUT, CLOSED_LIQUIDATED, CLOSED_SCRAPPED]
    transitions:
      - from: SOURCED
        to: SCREENING
        trigger: "POST /lots/{lot_id}/screenings"
        actor: SafetyOfficer
        preconditions:
          - "lot.commercial_status == SOURCED"
          - "X-User-ID of the SafetyOfficer != lot.created_by_user_id (segregation of duties)"
        side_effects:
          - "SafetyScreening created with status PENDING, round_number = count of prior screenings for the lot + 1"

      - from: SCREENING
        to: CLEARED
        trigger: "POST /lots/{lot_id}/screenings/{id}/complete with recall_check=PASS, expiration_check in {PASS, NA}, condition_verified=true"
        actor: SafetyOfficer
        preconditions:
          - "target screening status == PENDING"
          - "qty_grade_a + qty_grade_b + qty_grade_c == lot.quantity_total"
        side_effects:
          - "screening.result = PASSED, status = COMPLETED, completed_at = now"
          - "lot.safety_status = CLEARED"
          - "lot.sellable_qty_confirmed = qty_grade_a + qty_grade_b + qty_grade_c"
          - "lot.landed_unit_cost_cents recomputed with the final variant (see calculations.landed_unit_cost)"

      - from: SCREENING
        to: BLOCKED
        trigger: "POST /lots/{lot_id}/screenings/{id}/complete with recall_check=FAIL or expiration_check=FAIL"
        actor: SafetyOfficer
        preconditions:
          - "target screening status == PENDING"
          - "qty_grade_a + qty_grade_b + qty_grade_c == lot.quantity_total"
        side_effects:
          - "screening.result = FAILED_RECALL if recall_check=FAIL else FAILED_EXPIRATION; status = COMPLETED"
          - "lot.safety_status = BLOCKED"
          - "Cascade link 1 (lot blocked): every Allocation of this lot in PROPOSED or CONFIRMED -> CANCELLED; each cancelled CONFIRMED allocation returns qty_granted to lot.qty_pool"
          - "Cascade link 2 (allocation cancelled by block): for each store whose allocation was cancelled by link 1, that store's AisleAssignment rows referencing this lot in ACTIVE -> SUPERSEDED, valid_to := block timestamp"

      - from: ON_SALE
        to: BLOCKED
        trigger: "POST /lots/{lot_id}/screenings + complete with recall_check=FAIL or expiration_check=FAIL (post-market recall re-screen)"
        actor: SafetyOfficer
        preconditions:
          - "lot.commercial_status == ON_SALE (screening may be opened from SOURCED, ON_SALE, or DISPOSITION_REVIEW)"
          - "target screening status == PENDING"
          - "qty_grade_a + qty_grade_b + qty_grade_c == lot.quantity_total"
        side_effects:
          - "screening.result = FAILED_RECALL if recall_check=FAIL else FAILED_EXPIRATION; status = COMPLETED"
          - "lot.safety_status = BLOCKED"
          - "Cascade link 1: every Allocation of this lot in PROPOSED or CONFIRMED -> CANCELLED; each cancelled CONFIRMED allocation returns qty_granted to lot.qty_pool"
          - "Cascade link 2: for each store whose allocation was cancelled by link 1, that store's ACTIVE AisleAssignment rows for this lot -> SUPERSEDED, valid_to := block timestamp"

      - from: DISPOSITION_REVIEW
        to: BLOCKED
        trigger: "POST /lots/{lot_id}/screenings + complete with recall_check=FAIL or expiration_check=FAIL (post-market recall re-screen)"
        actor: SafetyOfficer
        preconditions:
          - "lot.commercial_status == DISPOSITION_REVIEW"
          - "target screening status == PENDING"
          - "qty_grade_a + qty_grade_b + qty_grade_c == lot.quantity_total"
        side_effects:
          - "screening.result = FAILED_RECALL if recall_check=FAIL else FAILED_EXPIRATION; status = COMPLETED"
          - "lot.safety_status = BLOCKED"
          - "Cascade link 1: every Allocation of this lot in PROPOSED or CONFIRMED -> CANCELLED; each cancelled CONFIRMED allocation returns qty_granted to lot.qty_pool"
          - "Cascade link 2: for each store whose allocation was cancelled by link 1, that store's ACTIVE AisleAssignment rows for this lot -> SUPERSEDED, valid_to := block timestamp"

      - from: SCREENING
        to: SOURCED
        trigger: "POST /lots/{lot_id}/regrade"
        actor: SourcingBuyer
        preconditions:
          - "lot.commercial_status == SCREENING"
          - "latest COMPLETED screening for the lot has result == FAILED_CONDITION"
        side_effects:
          - "lot.condition_grade := regrade payload value"
          - "lot.safety_status = PENDING_SCREEN"
        note: "Revision loop: a condition-only failure sends the lot back for re-grading and a fresh screening round."

      - from: CLEARED
        to: PRICED
        trigger: "POST /lots/{lot_id}/price"
        actor: PricingLead
        preconditions:
          - "lot.commercial_status == CLEARED"
          - "lot.safety_status == CLEARED"
          - "advertised_price_legality passes against lot.home_jurisdiction_id (see calculations.advertised_price_legality)"
        side_effects:
          - "lot.retail_price_cents := payload retail_price_cents"
          - "lot.advertises_comparison := payload advertises_comparison"

      - from: PRICED
        to: ON_SALE
        trigger: "POST /lots/{lot_id}/allocations/commit (first commit whose total granted qty > 0)"
        actor: system
        preconditions:
          - "lot.commercial_status == PRICED"
          - "at least one PROPOSED allocation received qty_granted > 0 in this commit"
        side_effects:
          - "lot.on_sale_since := current logical clock time"

      - from: ON_SALE
        to: DISPOSITION_REVIEW
        trigger: "POST /_clock/set_current_utc (automatic pacing evaluation)"
        actor: system
        preconditions:
          - "floor((now - lot.on_sale_since) / 86400s) >= 3 selling days"
          - "units_sold_trailing_7d * 2 < lot.pace_target_units_per_week (strictly below 50% of pace target)"
        side_effects: []
        note: "units_sold_trailing_7d = sum of qty over COMPLETED purchases of this lot with created_at in [now - 7 days, now)."

      - from: DISPOSITION_REVIEW
        to: ON_SALE
        trigger: "POST /lots/{lot_id}/dispositions/{id}/apply with action=MARKDOWN"
        actor: SourcingBuyer
        preconditions:
          - "disposition.status == PENDING"
          - "disposition.action == MARKDOWN"
          - "1 <= markdown_pct <= 50"
        side_effects:
          - "lot.retail_price_cents := round_half_up(lot.retail_price_cents * (100 - markdown_pct) / 100)"
          - "lot.markdown_rounds += 1"
          - "disposition.status = APPLIED, applied_at = now"
        note: "Markdown loop: the lot returns to ON_SALE at the reduced price and pacing restarts against the same on_sale_since."

      - from: DISPOSITION_REVIEW
        to: CLOSED_LIQUIDATED
        trigger: "POST /lots/{lot_id}/dispositions/{id}/apply with action=LIQUIDATE"
        actor: SourcingBuyer
        preconditions:
          - "disposition.status == PENDING"
          - "disposition.action == LIQUIDATE"
          - "liquidator_ref present and recovery_cents >= 0"
          - "no allocation of this lot in PROPOSED, CONFIRMED, SHIPPED, or RECEIVED (qty_allocated_outstanding == 0)"
        side_effects:
          - "lot.qty_liquidated := lot.qty_pool; lot.qty_pool := 0"
          - "disposition.status = APPLIED, applied_at = now"
          - "Cascade link 1 (lot closed): every ACTIVE AisleAssignment referencing this lot -> SUPERSEDED, valid_to := close timestamp"
          - "Cascade link 1 (lot closed): every EarlyAccessEvent of this lot in SCHEDULED or ACTIVE -> CANCELLED"

      - from: DISPOSITION_REVIEW
        to: CLOSED_SCRAPPED
        trigger: "POST /lots/{lot_id}/dispositions/{id}/apply with action=SCRAP"
        actor: SourcingBuyer
        preconditions:
          - "disposition.status == PENDING"
          - "disposition.action == SCRAP"
          - "no allocation of this lot in PROPOSED, CONFIRMED, SHIPPED, or RECEIVED (qty_allocated_outstanding == 0)"
        side_effects:
          - "lot.qty_scrapped := lot.qty_pool; lot.qty_pool := 0"
          - "disposition.status = APPLIED, applied_at = now"

      - from: BLOCKED
        to: CLOSED_SCRAPPED
        trigger: "POST /lots/{lot_id}/dispositions/{id}/apply with action=SCRAP"
        actor: SourcingBuyer
        preconditions:
          - "disposition.status == PENDING"
          - "disposition.action == SCRAP"
          - "no allocation of this lot in PROPOSED, CONFIRMED, SHIPPED, or RECEIVED (qty_allocated_outstanding == 0)"
        side_effects:
          - "lot.qty_scrapped := lot.qty_pool; lot.qty_pool := 0"
          - "disposition.status = APPLIED, applied_at = now"

      - from: ON_SALE
        to: CLOSED_SOLD_OUT
        trigger: "system (evaluated after every purchase or refund on this lot)"
        actor: system
        preconditions:
          - "lot.qty_pool == 0 AND lot.qty_allocated_outstanding == 0 AND lot.qty_liquidated == 0 AND lot.qty_scrapped == 0"
        side_effects: []

      - from: CLOSED_SOLD_OUT
        to: ON_SALE
        trigger: "system (a refund returns units while lot is CLOSED_SOLD_OUT)"
        actor: system
        preconditions:
          - "a Purchase of this lot transitions COMPLETED -> REFUNDED"
        side_effects:
          - "lot reopens for sale at current retail_price_cents"

  - entity: SafetyScreening
    field: status
    initial_state: PENDING
    terminal_states: [COMPLETED]
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: "POST /lots/{lot_id}/screenings/{id}/complete"
        actor: SafetyOfficer
        preconditions:
          - "screening.status == PENDING"
          - "qty_grade_a + qty_grade_b + qty_grade_c == lot.quantity_total"
        side_effects:
          - "result computed: recall_check=FAIL -> FAILED_RECALL; else expiration_check=FAIL -> FAILED_EXPIRATION; else condition_verified=false -> FAILED_CONDITION; else PASSED"
          - "lot commercial/safety transitions per BuyLot machine (CLEARED / BLOCKED / stays SCREENING for FAILED_CONDITION)"
        note: "COMPLETED is terminal; a failed screening is never edited — a regrade opens a new round instead."

  - entity: Allocation
    field: status
    initial_state: PROPOSED
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /lots/{lot_id}/allocations/commit"
        actor: AllocationManager
        preconditions:
          - "allocation.status == PROPOSED"
          - "waterfall grants this allocation qty_granted > 0 (see calculations.allocation_waterfall)"
        side_effects:
          - "allocation.qty_granted := min(qty_requested, remaining pool at this allocation's waterfall turn)"
          - "lot.qty_pool decremented by qty_granted (qty_allocated_outstanding correspondingly increases)"
        note: "A PROPOSED allocation whose waterfall grant is 0 remains PROPOSED; later allocations in the order still process."

      - from: CONFIRMED
        to: SHIPPED
        trigger: "POST /lots/{lot_id}/allocations/{id}/ship"
        actor: AllocationManager
        preconditions:
          - "allocation.status == CONFIRMED"
        side_effects: []

      - from: SHIPPED
        to: CONFIRMED
        trigger: "POST /lots/{lot_id}/allocations/{id}/recall"
        actor: AllocationManager
        preconditions:
          - "allocation.status == SHIPPED"
        side_effects: []
        note: "Shipment-recall cycle: units stay allocated to the store; no pool movement."

      - from: SHIPPED
        to: RECEIVED
        trigger: "POST /lots/{lot_id}/allocations/{id}/receive"
        actor: AllocationManager
        preconditions:
          - "allocation.status == SHIPPED"
        side_effects:
          - "allocation.store_on_hand_qty := allocation.qty_granted"

      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /lots/{lot_id}/allocations/{id}/release"
        actor: AllocationManager
        preconditions:
          - "allocation.status == CONFIRMED"
        side_effects:
          - "lot.qty_pool += allocation.qty_granted (compensating return to the pool)"

      - from: RECEIVED
        to: RELEASED
        trigger: "POST /lots/{lot_id}/allocations/{id}/release"
        actor: AllocationManager
        preconditions:
          - "allocation.status == RECEIVED"
        side_effects:
          - "lot.qty_pool += allocation.store_on_hand_qty; allocation.store_on_hand_qty := 0 (units already sold stay counted in lot.qty_sold)"

      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /lots/{lot_id}/allocations/{id}/cancel"
        actor: AllocationManager
        preconditions:
          - "allocation.status == PROPOSED"
        side_effects: []
        note: "PROPOSED holds no pool units; cancel is a pure status change."

  - entity: AisleAssignment
    field: status
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /stores/{store_id}/aisle-assignments with supersede=true for the same (store, aisle_code)"
        actor: StoreManager
        preconditions:
          - "new assignment passes the closed-interval conflict and OCC checks"
        side_effects:
          - "prior assignment.valid_to := new assignment.valid_from - 1 second (closed-interval semantics: touching endpoints conflict)"

      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system cascade (lot blocked or lot closed-liquidated)"
        actor: system
        preconditions:
          - "referenced BuyLot transitioned to BLOCKED or CLOSED_LIQUIDATED"
        side_effects:
          - "valid_to := timestamp of the lot transition"

  - entity: EarlyAccessEvent
    field: status
    initial_state: SCHEDULED
    terminal_states: [ENDED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /_clock/set_current_utc (now >= starts_at and now < ends_at)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: ENDED
        trigger: "POST /_clock/set_current_utc (now >= ends_at)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /lots/{lot_id}/early-access-events/{id}/cancel, or system cascade on lot CLOSED_LIQUIDATED"
        actor: PricingLead
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /lots/{lot_id}/early-access-events/{id}/cancel, or system cascade on lot CLOSED_LIQUIDATED"
        actor: PricingLead
        preconditions: []
        side_effects: []

  - entity: Purchase
    field: status
    initial_state: COMPLETED
    terminal_states: [REFUNDED]
    transitions:
      - from: COMPLETED
        to: REFUNDED
        trigger: "POST /purchases/{purchase_id}/refund"
        actor: StoreManager
        preconditions:
          - "purchase.status == COMPLETED"
          - "now - purchase.created_at <= 14 days (REFUND_WINDOW_DAYS; boundary: exactly 14 days is allowed)"
          - "lot.commercial_status NOT IN {CLOSED_LIQUIDATED, CLOSED_SCRAPPED}"
        side_effects:
          - "allocation.store_on_hand_qty += purchase.qty (the RECEIVED allocation that stocked the store for this lot)"
          - "lot.qty_sold -= purchase.qty (recomputed from COMPLETED purchases)"
          - "if lot.commercial_status == CLOSED_SOLD_OUT: lot -> ON_SALE"
          - "purchase.refunded_at := now"

  - entity: Disposition
    field: status
    initial_state: PENDING
    terminal_states: [APPLIED, SUPERSEDED]
    transitions:
      - from: PENDING
        to: SUPERSEDED
        trigger: "POST /lots/{lot_id}/dispositions (a new PENDING disposition supersedes the prior one)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PENDING
        to: APPLIED
        trigger: "POST /lots/{lot_id}/dispositions/{id}/apply"
        actor: SourcingBuyer
        preconditions:
          - "disposition.status == PENDING"
          - "action-specific preconditions per BuyLot machine"
        side_effects:
          - "BuyLot transition per action (markdown loop / liquidation / scrap)"

  - entity: Store
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /stores/{store_id} with status=SUSPENDED"
        actor: Admin
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /stores/{store_id} with status=ACTIVE"
        actor: Admin
        preconditions: []
        side_effects: []

  - entity: LoyaltyMember
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /members/{member_id} with status=SUSPENDED"
        actor: Admin
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /members/{member_id} with status=ACTIVE"
        actor: Admin
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; true create-with-supersede races)
# =============================================================================
concurrency_rules:
  - rule_id: aisle-assignment-supersede-stale-store
    parent_entity: Store
    write_endpoint: "POST /stores/{store_id}/aisle-assignments"
    occ_field: "expected_store_version"
    description: |
      Creating an AisleAssignment on a Store legitimately supersedes any prior
      ACTIVE assignment on the same aisle. A client whose view of the store is
      stale (its version has advanced since the client last observed it) is
      rejected with ERR_STALE_VERSION so it cannot supersede on an outdated
      layout basis.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: disposition-create-stale-lot
    parent_entity: BuyLot
    write_endpoint: "POST /lots/{lot_id}/dispositions"
    occ_field: "expected_lot_version"
    description: |
      Creating a Disposition legitimately supersedes the lot's prior PENDING
      disposition. A client carrying an expected_lot_version that no longer
      matches BuyLot.version is rejected with ERR_STALE_VERSION because its
      view of the lot's pricing and allocation state is out of date.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: landed_unit_cost
    trigger: "lot creation (provisional variant); screening completion with result=PASSED (final variant)"
    algorithm: aggregation
    formula: |
      provisional variant (lot in SOURCED/SCREENING, no PASSED screening yet):
        landed_unit_cost_cents = round_half_up(total_cost_cents / est_sellable_qty)
      final variant (latest screening for the lot has result == PASSED):
        effective_qty = qty_grade_a * 1.0 + qty_grade_b * 0.8 + qty_grade_c * 0.6
        landed_unit_cost_cents = round_half_up(total_cost_cents / effective_qty)
      Grade factors: A=1.0, B=0.8, C=0.6 (GRADE_B_FACTOR, GRADE_C_FACTOR).
      The two variants produce different values for identical lot cost data
      whenever the observed grade mix deviates from est_sellable_qty.
    input_set: "BuyLot fields total_cost_cents, est_sellable_qty; latest COMPLETED SafetyScreening with result=PASSED for the lot"
    constants:
      GRADE_B_FACTOR: 0.8
      GRADE_C_FACTOR: 0.6
    precision: "0 decimal places (integer cents), round_half_up"
    variants:
      - name: provisional
        when: "before the first PASSED screening"
        difference: "divides by the buyer-estimated sellable quantity"
      - name: final
        when: "after the first PASSED screening"
        difference: "divides by grade-weighted effective quantity from observed grade counts"

  - name: advertised_price_legality
    trigger: "POST /lots/{lot_id}/price; aisle-assignment creation re-checks the COMPARISON_PROHIBITED branch against the store's jurisdiction"
    algorithm: threshold
    formula: |
      rule = JurisdictionRule(lot.home_jurisdiction_id).comparison_rule
      anchor_premium_cents = round_half_up(retail_price_cents * 120 / 100)   # MIN_ANCHOR_PREMIUM_PCT = 20
      if rule == COMPARISON_PROHIBITED:
        require advertises_comparison == false, else ERR_COMPARISON_ADVERTISING_PROHIBITED
      elif rule == WAS_NOW_WINDOW:
        require comparison_price_cents >= anchor_premium_cents (>=, boundary inclusive),
          else ERR_ANCHOR_PREMIUM_INSUFFICIENT
        discount_pct = round_half_up((comparison_price_cents - retail_price_cents) * 10000 / comparison_price_cents) / 100
        require discount_pct <= max_advertised_discount_pct (<=, boundary inclusive),
          else ERR_ADVERTISED_DISCOUNT_TOO_DEEP
      elif rule == MSRP_REFERENCE:
        require comparison_price_cents == vendor_msrp_cents, else ERR_COMPARISON_NOT_MSRP
        require retail_price_cents <= comparison_price_cents, else ERR_ADVERTISED_DISCOUNT_TOO_DEEP
      Aisle-assignment gate: if Store.jurisdiction.comparison_rule == COMPARISON_PROHIBITED
      and lot.advertises_comparison == true, reject with ERR_COMPARISON_ADVERTISING_PROHIBITED.
    input_set: "BuyLot retail_price_cents (payload), comparison_price_cents, vendor_msrp_cents, advertises_comparison; JurisdictionRule comparison_rule, max_advertised_discount_pct"
    constants:
      MIN_ANCHOR_PREMIUM_PCT: 20
    precision: "discount_pct to 2 decimal places, round_half_up; anchor in integer cents, round_half_up"

  - name: member_price
    trigger: "POST /stores/{store_id}/purchases (pricing step, after all gates pass)"
    algorithm: tiered_pricing
    formula: |
      PINNED EVALUATION ORDER (rounding order matters — never round at line level):
        step 1: pct = discount percent for this purchase (see variants)
        step 2: unit_price_cents = round_half_up(retail_price_cents * (100 - pct) / 100)
        step 3: line_total_cents = unit_price_cents * qty        # integer multiply, no second rounding
      Tier discounts: BRONZE=5, SILVER=10, GOLD=15 (TIER_DISCOUNT_PCT).
      Guest (no member_id): pct = 0, variant = GUEST, unit = retail_price_cents.
      Cap gate (before charging): if member purchase and pct >
      Store.jurisdiction.member_discount_cap_pct -> ERR_MEMBER_DISCOUNT_CAP_EXCEEDED
      (strictly greater; pct == cap is allowed).
    input_set: "BuyLot.retail_price_cents (current, post-markdown); LoyaltyMember.tier; ACTIVE EarlyAccessEvent covering now for the lot, if any; Store.jurisdiction.member_discount_cap_pct"
    constants:
      TIER_DISCOUNT_PCT: { BRONZE: 5, SILVER: 10, GOLD: 15 }
    precision: "integer cents, round_half_up at the per-unit step only"
    variants:
      - name: event
        when: "an EarlyAccessEvent of the lot is ACTIVE at purchase time (now in [starts_at, ends_at)) and member.tier >= event.min_tier"
        difference: "pct = TIER_DISCOUNT_PCT[tier] + event.extra_discount_pct; pricing_variant = EVENT"
      - name: standard
        when: "member purchase with no ACTIVE event covering now"
        difference: "pct = TIER_DISCOUNT_PCT[tier]; pricing_variant = STANDARD"

  - name: allocation_waterfall
    trigger: "POST /lots/{lot_id}/allocations/commit"
    algorithm: waterfall_allocation
    formula: |
      candidates = allocations of the lot with status == PROPOSED
      order: sort by (store.performance_tier ASC as TIER_1 < TIER_2 < TIER_3, allocation.created_at ASC)
      pool = lot.qty_pool
      for each allocation in that order:
        grant = min(allocation.qty_requested, pool)
        allocation.qty_granted = grant
        if grant > 0: allocation -> CONFIRMED; pool -= grant
        else: allocation stays PROPOSED
      if total granted this commit > 0 and lot.commercial_status == PRICED: lot -> ON_SALE
      Ties in tier break by allocation.created_at ASC; id is never consulted.
    input_set: "Allocation rows of the lot in PROPOSED; Store.performance_tier for each; BuyLot.qty_pool"
    precision: "integer units"

  - name: sell_through_pacing
    trigger: "POST /_clock/set_current_utc (after event transitions)"
    algorithm: threshold
    formula: |
      PINNED EVALUATION ORDER (circular-looking dependency made explicit):
        step 1: selling_days = floor((now - lot.on_sale_since) / 86400 seconds)
        step 2: eligibility gate — only lots with commercial_status == ON_SALE
                and selling_days >= MIN_SELLING_DAYS are evaluated at all
        step 3: units_sold_trailing_7d = sum of qty over Purchase rows of the lot
                with status == COMPLETED and created_at in [now - PACE_WINDOW_DAYS days, now)
                (half-open on the left boundary: created_at >= now - 7 days)
        step 4: if units_sold_trailing_7d * 2 < lot.pace_target_units_per_week
                then lot -> DISPOSITION_REVIEW (strict <: exactly 50% of target does NOT trigger)
      Refunded purchases are excluded because their status is REFUNDED, not COMPLETED.
    input_set: "BuyLot rows in ON_SALE; Purchase rows of the lot in COMPLETED within the trailing window"
    constants:
      PACE_WINDOW_DAYS: 7
      MIN_SELLING_DAYS: 3
    precision: "integer arithmetic (sold*2 < target); no floats"

  - name: lot_unit_conservation
    trigger: "invariant, evaluated after every allocation or purchase mutation (asserted by GET /lots/{lot_id}/summary)"
    algorithm: aggregation
    formula: |
      quantity_total == qty_pool + qty_allocated_outstanding + qty_sold + qty_liquidated + qty_scrapped
      where qty_allocated_outstanding =
        sum(qty_granted) over allocations in {CONFIRMED, SHIPPED}
        + sum(store_on_hand_qty) over allocations in {RECEIVED}
      Allocation CONFIRMED/RECEIVED -> RELEASED is the compensating action that
      returns units to qty_pool; the sum MUST be unchanged before and after.
    input_set: "BuyLot plus all its Allocation and Purchase rows"
    precision: "integer units"

  - name: refund_restoration
    trigger: "POST /purchases/{purchase_id}/refund"
    algorithm: aggregation
    formula: |
      A COMPLETED purchase followed by its refund MUST leave the following
      quantities identical to their pre-purchase values:
        lot.qty_sold, allocation.store_on_hand_qty,
        sum(line_total_cents) over COMPLETED purchases of the lot.
      (qty_sold is derived from COMPLETED purchases; the refund flips the
      purchase to REFUNDED and credits store_on_hand_qty back.)
    input_set: "Purchase, its store's RECEIVED Allocation for the lot, BuyLot"
    precision: "integer cents and units"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles; X-User-ID present for all roles except Anonymous"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role is permitted for the endpoint per §1.5 roles; for ClubMember purchases with member_id, X-User-ID must equal member_id; Anonymous must not supply member_id"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path resource ids exist, validated left-to-right; body FK references (vendor_id, home_jurisdiction_id, jurisdiction_id, store_id, lot_id, member_id, home_store_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path params or body FK references"

  - priority: 4
    category: state
    check: "Target resource in a valid state for the requested lifecycle action (per §1.2). For purchases, lot.commercial_status must be in {ON_SALE, DISPOSITION_REVIEW, BLOCKED} — BLOCKED passes through to the safety check at priority 5"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition/action endpoints"

  - priority: 5
    category: business_safety
    check: "lot.safety_status must be CLEARED for purchases, aisle-assignment creation, and allocation proposals; BLOCKED (or never-screened) lots are rejected here"
    error_id: ERR_LOT_SAFETY_BLOCKED
    http_status: 409
    applies_to: "POST /stores/{store_id}/purchases, POST /stores/{store_id}/aisle-assignments, POST /lots/{lot_id}/allocations"

  - priority: 6
    category: business_referential
    check: "Referenced store must be ACTIVE (store.status == SUSPENDED rejects allocation proposals, assignment creation, and purchases at that store)"
    error_id: ERR_STORE_SUSPENDED
    http_status: 409
    applies_to: "POST /lots/{lot_id}/allocations, POST /stores/{store_id}/aisle-assignments, POST /stores/{store_id}/purchases"

  - priority: 7
    category: business_referential
    check: "An AisleAssignment in ACTIVE status covering now (valid_from <= now AND (valid_to IS NULL OR now <= valid_to)) must exist for (store, lot) — deal-dependent layout gate for selling"
    error_id: ERR_NO_ACTIVE_ASSIGNMENT
    http_status: 409
    applies_to: "POST /stores/{store_id}/purchases"

  - priority: 8
    category: business_referential
    check: "member_id, when supplied, must reference a LoyaltyMember with status == ACTIVE"
    error_id: ERR_MEMBER_SUSPENDED
    http_status: 409
    applies_to: "POST /stores/{store_id}/purchases"

  - priority: 9
    category: business_constraint
    check: "Segregation of duties: X-User-ID of the SafetyOfficer opening a screening must differ from lot.created_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /lots/{lot_id}/screenings"

  - priority: 10
    category: business_constraint
    check: "Screening grade counts must reconcile: qty_grade_a + qty_grade_b + qty_grade_c == lot.quantity_total"
    error_id: ERR_GRADE_SUM_MISMATCH
    http_status: 422
    applies_to: "POST /lots/{lot_id}/screenings/{id}/complete"

  - priority: 11
    category: business_constraint
    check: "Early-access windows on the same lot must not overlap under half-open semantics: [starts_at, ends_at); touching endpoints (a.ends_at == b.starts_at) are allowed. Checked against events in {SCHEDULED, ACTIVE}"
    error_id: ERR_EVENT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /lots/{lot_id}/early-access-events"

  - priority: 12
    category: business_constraint
    check: "Aisle assignments on the same (store, aisle_code) use closed-interval semantics: touching endpoints conflict. An overlapping ACTIVE assignment rejects unless supersede=true (then the prior is superseded with valid_to := new valid_from - 1 second)"
    error_id: ERR_AISLE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /stores/{store_id}/aisle-assignments"

  - priority: 13
    category: business_constraint
    check: "While an EarlyAccessEvent for the lot is ACTIVE (now in [starts_at, ends_at)), purchases require a member_id (member-only early access)"
    error_id: ERR_EARLY_ACCESS_MEMBER_ONLY
    http_status: 403
    applies_to: "POST /stores/{store_id}/purchases"

  - priority: 14
    category: business_constraint
    check: "During an ACTIVE early-access event, member.tier must rank >= event.min_tier (BRONZE < SILVER < GOLD)"
    error_id: ERR_MEMBER_TIER_TOO_LOW
    http_status: 403
    applies_to: "POST /stores/{store_id}/purchases"

  - priority: 15
    category: business_constraint
    check: "Combined member discount pct (tier + event extra) must be <= member_discount_cap_pct of the selling store's jurisdiction (== cap allowed)"
    error_id: ERR_MEMBER_DISCOUNT_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /stores/{store_id}/purchases"

  - priority: 16
    category: business_constraint
    check: "Quantity-limited signage: units already purchased for (store, lot) on the current UTC day by this member (or by the shared guest bucket for memberless purchases) + qty <= aisle assignment daily_unit_limit"
    error_id: ERR_SIGNAGE_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /stores/{store_id}/purchases"

  - priority: 17
    category: business_constraint
    check: "COMPARISON_PROHIBITED jurisdiction: advertises_comparison must be false (lot pricing vs home jurisdiction; assignment creation vs store jurisdiction)"
    error_id: ERR_COMPARISON_ADVERTISING_PROHIBITED
    http_status: 422
    applies_to: "POST /lots/{lot_id}/price, POST /stores/{store_id}/aisle-assignments"

  - priority: 18
    category: business_constraint
    check: "MSRP_REFERENCE jurisdiction: comparison_price_cents must equal vendor_msrp_cents and retail_price_cents <= comparison_price_cents"
    error_id: ERR_COMPARISON_NOT_MSRP
    http_status: 422
    applies_to: "POST /lots/{lot_id}/price"

  - priority: 19
    category: business_constraint
    check: "WAS_NOW_WINDOW jurisdiction: comparison_price_cents >= round_half_up(retail_price_cents * 1.20) (inclusive boundary)"
    error_id: ERR_ANCHOR_PREMIUM_INSUFFICIENT
    http_status: 422
    applies_to: "POST /lots/{lot_id}/price"

  - priority: 20
    category: business_constraint
    check: "WAS_NOW_WINDOW jurisdiction: advertised discount pct vs comparison price must be <= max_advertised_discount_pct (inclusive boundary)"
    error_id: ERR_ADVERTISED_DISCOUNT_TOO_DEEP
    http_status: 422
    applies_to: "POST /lots/{lot_id}/price"

  - priority: 21
    category: business_temporal
    check: "Event window must be strictly positive: ends_at > starts_at"
    error_id: ERR_INVALID_EVENT_WINDOW
    http_status: 422
    applies_to: "POST /lots/{lot_id}/early-access-events"

  - priority: 22
    category: business_temporal
    check: "Refund must occur within 14 days of purchase.created_at (now - created_at <= 14 days; exactly 14 days allowed)"
    error_id: ERR_REFUND_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /purchases/{purchase_id}/refund"

  - priority: 23
    category: business_fiscal
    check: "Allocation proposal: qty_requested <= lot.qty_pool (the unallocated pool at proposal time)"
    error_id: ERR_INSUFFICIENT_LOT_QUANTITY
    http_status: 409
    applies_to: "POST /lots/{lot_id}/allocations"

  - priority: 24
    category: business_fiscal
    check: "Purchase: qty <= store_on_hand_qty of the store's RECEIVED allocation for the lot"
    error_id: ERR_INSUFFICIENT_STORE_STOCK
    http_status: 409
    applies_to: "POST /stores/{store_id}/purchases"

  - priority: 25
    category: business_constraint
    check: "Request shape: required fields present, correct types, valid enum members, integer quantities >= 1, no unknown fields, markdown_pct in 1..50 for MARKDOWN dispositions, OCC expected_*_version fields present where required"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"

  - priority: 26
    category: state
    check: "OCC: expected_store_version must equal Store.version on aisle-assignment creation; expected_lot_version must equal BuyLot.version on disposition creation (evaluated after auth/existence, expressed as its own error)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /stores/{store_id}/aisle-assignments, POST /lots/{lot_id}/dispositions"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Vendor ---
  - method: POST
    path: "/vendors"
    description: "Register a closeout vendor"
    roles: [SourcingBuyer, Admin]
    code: 201
    input: [name, vendor_code]
    output: Vendor
    side_effects: []

  - method: GET
    path: "/vendors/{id}"
    description: "Get a vendor"
    roles: [Admin, SourcingBuyer, SafetyOfficer, PricingLead, AllocationManager, StoreManager, ClubMember, Anonymous]
    code: 200
    input: []
    output: Vendor
    side_effects: []

  - method: GET
    path: "/vendors/{id}/lots"
    description: "List lots sourced from a vendor (reverse reachability for BuyLot.vendor_id)"
    roles: [Admin, SourcingBuyer, SafetyOfficer, PricingLead, AllocationManager, StoreManager, ClubMember, Anonymous]
    code: 200
    input: []
    output: BuyLot[]
    side_effects: []

  # --- JurisdictionRule ---
  - method: POST
    path: "/jurisdiction-rules"
    description: "Create a jurisdictional advertising rule"
    roles: [PricingLead, Admin]
    code: 201
    input: [jurisdiction_code, comparison_rule, max_advertised_discount_pct, member_discount_cap_pct, "window_days?", "required_offer_days?"]
    output: JurisdictionRule
    side_effects: []

  - method: GET
    path: "/jurisdiction-rules/{id}"
    description: "Get a jurisdiction rule"
    roles: [Admin, SourcingBuyer, SafetyOfficer, PricingLead, AllocationManager, StoreManager, ClubMember, Anonymous]
    code: 200
    input: []
    output: JurisdictionRule
    side_effects: []

  - method: GET
    path: "/jurisdiction-rules/{id}/stores"
    description: "List stores governed by a jurisdiction (reverse reachability for Store.jurisdiction_id)"
    roles: [Admin, SourcingBuyer, SafetyOfficer, PricingLead, AllocationManager, StoreManager, ClubMember, Anonymous]
    code: 200
    input: []
    output: Store[]
    side_effects: []

  - method: GET
    path: "/jurisdiction-rules/{id}/lots"
    description: "List lots priced under a home jurisdiction (reverse reachability for BuyLot.home_jurisdiction_id)"
    roles: [Admin, SourcingBuyer, SafetyOfficer, PricingLead, AllocationManager, StoreManager, ClubMember, Anonymous]
    code: 200
    input: []
    output: BuyLot[]
    side_effects: []

  # --- Store ---
  - method: POST
    path: "/stores"
    description: "Register a store in the fleet"
    roles: [Admin]
    code: 201
    input: [name, store_code, jurisdiction_id, performance_tier]
    output: Store
    side_effects: ["status initialized to ACTIVE, version = 1"]

  - method: GET
    path: "/stores/{id}"
    description: "Get a store"
    roles: [Admin, SourcingBuyer, SafetyOfficer, PricingLead, AllocationManager, StoreManager, ClubMember, Anonymous]
    code: 200
    input: []
    output: Store
    side_effects: []

  - method: PATCH
    path: "/stores/{id}"
    description: "Suspend/reactivate a store or change its performance tier"
    roles: [Admin]
    code: 200
    input: ["status?", "performance_tier?"]
    output: Store
    side_effects: ["increments Store.version by 1"]

  - method: GET
    path: "/stores/{id}/allocations"
    description: "List allocations destined for a store (reverse reachability for Allocation.store_id)"
    roles: [Admin, SourcingBuyer, SafetyOfficer, PricingLead, AllocationManager, StoreManager, ClubMember, Anonymous]
    code: 200
    input: []
    output: Allocation[]
    side_effects: []

  - method: GET
    path: "/stores/{id}/aisle-assignments"
    description: "List aisle assignments of a store (reverse reachability for AisleAssignment.store_id)"
    roles: [Admin, SourcingBuyer, SafetyOfficer, PricingLead, AllocationManager, StoreManager, ClubMember, Anonymous]
    code: 200
    input: []
    output: AisleAssignment[]
    side_effects: []

  - method: GET
    path: "/stores/{id}/members"
    description: "List loyalty members whose home store this is (reverse reachability for LoyaltyMember.home_store_id)"
    roles: [Admin, SourcingBuyer, SafetyOfficer, PricingLead, AllocationManager, StoreManager, ClubMember, Anonymous]
    code: 200
    input: []
    output: LoyaltyMember[]
    side_effects: []

  - method: GET
    path: "/stores/{id}/purchases"
    description: "List purchases at a store (reverse reachability for Purchase.store_id)"
    roles: [Admin, SourcingBuyer, SafetyOfficer, PricingLead, AllocationManager, StoreManager, ClubMember, Anonymous]
    code: 200
    input: []
    output: Purchase[]
    side_effects: []

  # --- BuyLot ---
  - method: POST
    path: "/lots"
    description: "Acquire a closeout lot (created directly in SOURCED with safety_status PENDING_SCREEN)"
    roles: [SourcingBuyer, Admin]
    code: 201
    input: [vendor_id, home_jurisdiction_id, title, source_type, condition_grade, quantity_total, total_cost_cents, est_sellable_qty, comparison_price_cents, vendor_msrp_cents, pace_target_units_per_week]
    output: BuyLot
    side_effects:
      - "created_by_user_id := X-User-ID"
      - "qty_pool := quantity_total; landed_unit_cost_cents := provisional variant"
      - "increments BuyLot.version by 1 relative to creation (version = 1)"

  - method: GET
    path: "/lots/{id}"
    description: "Get a lot"
    roles: [Admin, SourcingBuyer, SafetyOfficer, PricingLead, AllocationManager, StoreManager, ClubMember, Anonymous]
    code: 200
    input: []
    output: BuyLot
    side_effects: []

  - method: GET
    path: "/lots"
    description: "List lots with filters and pagination"
    roles: [Admin, SourcingBuyer, SafetyOfficer, PricingLead, AllocationManager, StoreManager, ClubMember, Anonymous]
    code: 200
    input: ["commercial_status?", "vendor_id?", "source_type?", "limit?", "offset?"]
    output: BuyLot[]
    side_effects: []

  - method: GET
    path: "/lots/{id}/summary"
    description: "Computed lot snapshot: conservation fields, cost, pacing"
    roles: [Admin, SourcingBuyer, SafetyOfficer, PricingLead, AllocationManager, StoreManager, ClubMember, Anonymous]
    code: 200
    input: []
    output: "{ qty_pool: integer, qty_allocated_outstanding: integer, qty_sold: integer, qty_liquidated: integer, qty_scrapped: integer, landed_unit_cost_cents: integer, markdown_rounds: integer, commercial_status: string, safety_status: string, pace_window_units_sold: integer }"
    side_effects: []

  - method: POST
    path: "/lots/{lot_id}/regrade"
    description: "Re-grade a lot after a condition-only screening failure (SCREENING -> SOURCED loop)"
    roles: [SourcingBuyer]
    code: 200
    input: [condition_grade]
    output: BuyLot
    side_effects: ["lot.condition_grade updated; lot.safety_status := PENDING_SCREEN; increments BuyLot.version by 1"]

  # --- SafetyScreening ---
  - method: POST
    path: "/lots/{id}/screenings"
    description: "Open a safety screening round for a lot (also used for post-market recall re-screens on ON_SALE / DISPOSITION_REVIEW lots)"
    roles: [SafetyOfficer]
    code: 201
    input: []
    output: SafetyScreening
    side_effects:
      - "screening created PENDING with next round_number; screener_user_id := X-User-ID"
      - "if lot.commercial_status == SOURCED: lot -> SCREENING"
      - "segregation of duties enforced against lot.created_by_user_id"

  - method: GET
    path: "/lots/{id}/screenings"
    description: "List screening rounds of a lot (reverse reachability for SafetyScreening.lot_id)"
    roles: [Admin, SourcingBuyer, SafetyOfficer, PricingLead, AllocationManager, StoreManager, ClubMember, Anonymous]
    code: 200
    input: []
    output: SafetyScreening[]
    side_effects: []

  - method: POST
    path: "/lots/{lot_id}/screenings/{id}/complete"
    description: "Complete a PENDING screening with recall/expiration/condition results"
    roles: [SafetyOfficer]
    code: 200
    input: [recall_check, expiration_check, condition_verified, qty_grade_a, qty_grade_b, qty_grade_c, "notes?"]
    output: SafetyScreening
    side_effects:
      - "result computed; screening -> COMPLETED with completed_at"
      - "BuyLot transition per result (CLEARED / BLOCKED / stays SCREENING for FAILED_CONDITION)"
      - "on PASSED: sellable_qty_confirmed and landed_unit_cost_cents (final variant) recomputed"
      - "on BLOCKED: cascade cancels PROPOSED/CONFIRMED allocations and supersedes affected stores' ACTIVE assignments"

  # --- Pricing ---
  - method: POST
    path: "/lots/{lot_id}/price"
    description: "Set the retail price against the substantiated comparison price (CLEARED -> PRICED)"
    roles: [PricingLead]
    code: 200
    input: [retail_price_cents, advertises_comparison]
    output: BuyLot
    side_effects:
      - "advertised_price_legality validated against lot.home_jurisdiction_id"
      - "lot.retail_price_cents and advertises_comparison set; increments BuyLot.version by 1"

  # --- Allocation ---
  - method: POST
    path: "/lots/{lot_id}/allocations"
    description: "Propose a warehouse allocation of lot units to a store"
    roles: [AllocationManager]
    code: 201
    input: [store_id, qty_requested]
    output: Allocation
    side_effects: ["allocation created PROPOSED with qty_granted = 0 (no pool units held until commit)"]

  - method: GET
    path: "/lots/{id}/allocations"
    description: "List allocations of a lot (reverse reachability for Allocation.lot_id)"
    roles: [Admin, SourcingBuyer, SafetyOfficer, PricingLead, AllocationManager, StoreManager, ClubMember, Anonymous]
    code: 200
    input: []
    output: Allocation[]
    side_effects: []

  - method: GET
    path: "/lots/{lot_id}/allocations/{id}"
    description: "Get a single allocation of a lot"
    roles: [Admin, SourcingBuyer, SafetyOfficer, PricingLead, AllocationManager, StoreManager, ClubMember, Anonymous]
    code: 200
    input: []
    output: Allocation
    side_effects: []

  - method: POST
    path: "/lots/{lot_id}/allocations/commit"
    description: "Run the tier-ordered waterfall over all PROPOSED allocations of the lot"
    roles: [AllocationManager]
    code: 200
    input: []
    output: "{ granted_count: integer, total_granted_qty: integer }"
    side_effects:
      - "allocation_waterfall grants qty_granted per allocation; grants > 0 -> CONFIRMED"
      - "lot.qty_pool reduced by total granted"
      - "first commit with total_granted_qty > 0 on a PRICED lot -> ON_SALE, on_sale_since := now"

  - method: POST
    path: "/lots/{lot_id}/allocations/{id}/ship"
    description: "Ship a CONFIRMED allocation"
    roles: [AllocationManager]
    code: 200
    input: []
    output: Allocation
    side_effects: ["CONFIRMED -> SHIPPED"]

  - method: POST
    path: "/lots/{lot_id}/allocations/{id}/receive"
    description: "Receive a SHIPPED allocation at the store"
    roles: [AllocationManager]
    code: 200
    input: []
    output: Allocation
    side_effects: ["SHIPPED -> RECEIVED; store_on_hand_qty := qty_granted"]

  - method: POST
    path: "/lots/{lot_id}/allocations/{id}/recall"
    description: "Recall a SHIPPED allocation back to CONFIRMED (shipment-recall cycle)"
    roles: [AllocationManager]
    code: 200
    input: []
    output: Allocation
    side_effects: ["SHIPPED -> CONFIRMED"]

  - method: POST
    path: "/lots/{lot_id}/allocations/{id}/release"
    description: "Release a CONFIRMED or RECEIVED allocation back to the warehouse pool"
    roles: [AllocationManager]
    code: 200
    input: []
    output: Allocation
    side_effects: ["-> RELEASED; lot.qty_pool += qty_granted (CONFIRMED) or += store_on_hand_qty with store_on_hand_qty := 0 (RECEIVED)"]

  - method: POST
    path: "/lots/{lot_id}/allocations/{id}/cancel"
    description: "Cancel a PROPOSED allocation"
    roles: [AllocationManager]
    code: 200
    input: []
    output: Allocation
    side_effects: ["PROPOSED -> CANCELLED"]

  # --- AisleAssignment ---
  - method: POST
    path: "/stores/{store_id}/aisle-assignments"
    description: "Assign a deal lot to an aisle with quantity-limited signage; supersedes the prior ACTIVE assignment on that aisle when supersede=true"
    roles: [StoreManager]
    code: 201
    input: [lot_id, aisle_code, daily_unit_limit, expected_store_version, "valid_from?", "valid_to?", "supersede?"]
    output: AisleAssignment
    side_effects:
      - "OCC check on expected_store_version; increments Store.version by 1"
      - "on supersede: prior ACTIVE assignment on (store, aisle_code) -> SUPERSEDED with valid_to := new valid_from - 1 second"
      - "COMPARISON_PROHIBITED store jurisdiction + advertises_comparison lot -> rejected"

  - method: GET
    path: "/lots/{id}/aisle-assignments"
    description: "List aisle assignments referencing a lot (reverse reachability for AisleAssignment.lot_id)"
    roles: [Admin, SourcingBuyer, SafetyOfficer, PricingLead, AllocationManager, StoreManager, ClubMember, Anonymous]
    code: 200
    input: []
    output: AisleAssignment[]
    side_effects: []

  # --- LoyaltyMember ---
  - method: POST
    path: "/members"
    description: "Register a loyalty club member"
    roles: [Anonymous, Admin]
    code: 201
    input: [member_code, tier, home_store_id]
    output: LoyaltyMember
    side_effects: ["status initialized to ACTIVE"]

  - method: GET
    path: "/members/{id}"
    description: "Get a member"
    roles: [Admin, SourcingBuyer, SafetyOfficer, PricingLead, AllocationManager, StoreManager, ClubMember, Anonymous]
    code: 200
    input: []
    output: LoyaltyMember
    side_effects: []

  - method: PATCH
    path: "/members/{id}"
    description: "Suspend/reactivate a member or change tier"
    roles: [Admin]
    code: 200
    input: ["status?", "tier?"]
    output: LoyaltyMember
    side_effects: ["increments LoyaltyMember.version by 1"]

  - method: GET
    path: "/members/{id}/purchases"
    description: "List purchases of a member (reverse reachability for Purchase.member_id)"
    roles: [Admin, SourcingBuyer, SafetyOfficer, PricingLead, AllocationManager, StoreManager, ClubMember, Anonymous]
    code: 200
    input: []
    output: Purchase[]
    side_effects: []

  # --- EarlyAccessEvent ---
  - method: POST
    path: "/lots/{id}/early-access-events"
    description: "Schedule a member early-access event window on a lot (lot must be PRICED or ON_SALE)"
    roles: [PricingLead]
    code: 201
    input: [starts_at, ends_at, min_tier, extra_discount_pct]
    output: EarlyAccessEvent
    side_effects: ["event created SCHEDULED; half-open overlap check against SCHEDULED/ACTIVE events of the lot"]

  - method: GET
    path: "/lots/{id}/early-access-events"
    description: "List early-access events of a lot (reverse reachability for EarlyAccessEvent.lot_id)"
    roles: [Admin, SourcingBuyer, SafetyOfficer, PricingLead, AllocationManager, StoreManager, ClubMember, Anonymous]
    code: 200
    input: []
    output: EarlyAccessEvent[]
    side_effects: []

  - method: POST
    path: "/lots/{lot_id}/early-access-events/{id}/cancel"
    description: "Cancel a SCHEDULED or ACTIVE event"
    roles: [PricingLead]
    code: 200
    input: []
    output: EarlyAccessEvent
    side_effects: ["-> CANCELLED"]

  # --- Purchase ---
  - method: POST
    path: "/stores/{store_id}/purchases"
    description: "Sell units of a lot at a store (member or guest); drives sell-through pacing"
    roles: [ClubMember, Anonymous]
    code: 201
    input: [lot_id, qty, "member_id?"]
    output: Purchase
    side_effects:
      - "member_price computed per pinned rounding order; purchase created COMPLETED"
      - "RECEIVED allocation.store_on_hand_qty -= qty; lot.qty_sold recomputed"
      - "if qty_pool == 0 and qty_allocated_outstanding == 0 and nothing liquidated/scrapped: lot -> CLOSED_SOLD_OUT"

  - method: GET
    path: "/purchases/{id}"
    description: "Get a purchase"
    roles: [Admin, SourcingBuyer, SafetyOfficer, PricingLead, AllocationManager, StoreManager, ClubMember, Anonymous]
    code: 200
    input: []
    output: Purchase
    side_effects: []

  - method: POST
    path: "/purchases/{id}/refund"
    description: "Refund a COMPLETED purchase within 14 days"
    roles: [StoreManager]
    code: 200
    input: []
    output: Purchase
    side_effects:
      - "COMPLETED -> REFUNDED; refunded_at := now"
      - "store_on_hand_qty restored; lot.qty_sold recomputed; CLOSED_SOLD_OUT lot reopens to ON_SALE"

  - method: GET
    path: "/lots/{id}/purchases"
    description: "List purchases of a lot across the fleet (reverse reachability for Purchase.lot_id)"
    roles: [Admin, SourcingBuyer, SafetyOfficer, PricingLead, AllocationManager, StoreManager, ClubMember, Anonymous]
    code: 200
    input: []
    output: Purchase[]
    side_effects: []

  # --- Disposition ---
  - method: POST
    path: "/lots/{id}/dispositions"
    description: "Create a disposition (MARKDOWN / LIQUIDATE / SCRAP); supersedes the lot's prior PENDING disposition"
    roles: [SourcingBuyer]
    code: 201
    input: [action, expected_lot_version, "markdown_pct?", "liquidator_ref?", "recovery_cents?"]
    output: Disposition
    side_effects:
      - "OCC check on expected_lot_version; increments BuyLot.version by 1"
      - "prior PENDING disposition of the lot -> SUPERSEDED"
      - "MARKDOWN/LIQUIDATE require lot in {ON_SALE, DISPOSITION_REVIEW}; SCRAP requires {BLOCKED, DISPOSITION_REVIEW}"

  - method: GET
    path: "/lots/{id}/dispositions"
    description: "List dispositions of a lot (reverse reachability for Disposition.lot_id)"
    roles: [Admin, SourcingBuyer, SafetyOfficer, PricingLead, AllocationManager, StoreManager, ClubMember, Anonymous]
    code: 200
    input: []
    output: Disposition[]
    side_effects: []

  - method: POST
    path: "/lots/{lot_id}/dispositions/{id}/apply"
    description: "Apply a PENDING disposition (markdown loop, liquidation cascade, or scrap)"
    roles: [SourcingBuyer]
    code: 200
    input: []
    output: Disposition
    side_effects:
      - "MARKDOWN: retail reduced, markdown_rounds += 1, lot DISPOSITION_REVIEW -> ON_SALE"
      - "LIQUIDATE: qty_liquidated := qty_pool, lot -> CLOSED_LIQUIDATED; cascade supersedes ACTIVE assignments and cancels SCHEDULED/ACTIVE events"
      - "SCRAP: qty_scrapped := qty_pool, lot -> CLOSED_SCRAPPED"

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default (before any call) is exactly 2026-09-01T00:00:00Z; the clock never falls back to wall-clock time."
    roles: [Admin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects:
      - "EarlyAccessEvent: SCHEDULED -> ACTIVE when now >= starts_at and now < ends_at; ACTIVE -> ENDED when now >= ends_at"
      - "sell_through_pacing evaluation: eligible ON_SALE lots -> DISPOSITION_REVIEW"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/unknown field, type mismatch, invalid enum member, qty < 1, markdown_pct out of 1..50, missing required OCC field" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role, or missing X-User-ID for non-Anonymous roles" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for endpoint; ClubMember acting on another member's member_id; Anonymous supplying member_id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource in wrong state for the requested transition (per §1.2)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC mismatch on expected_store_version / expected_lot_version" }
  - { id: ERR_LOT_SAFETY_BLOCKED, http: 409, condition: "lot.safety_status != CLEARED on purchase, assignment creation, or allocation proposal" }
  - { id: ERR_STORE_SUSPENDED, http: 409, condition: "Referenced store is SUSPENDED" }
  - { id: ERR_NO_ACTIVE_ASSIGNMENT, http: 409, condition: "No ACTIVE aisle assignment covering now for (store, lot) at purchase time" }
  - { id: ERR_MEMBER_SUSPENDED, http: 409, condition: "Purchase references a SUSPENDED member" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "Screening opened by the same user id that created the lot" }
  - { id: ERR_GRADE_SUM_MISMATCH, http: 422, condition: "Screening grade counts do not sum to lot.quantity_total" }
  - { id: ERR_EVENT_WINDOW_OVERLAP, http: 409, condition: "Half-open overlap with an existing SCHEDULED/ACTIVE event on the same lot" }
  - { id: ERR_AISLE_WINDOW_CONFLICT, http: 409, condition: "Closed-interval conflict with an ACTIVE assignment on the same (store, aisle_code) without supersede=true" }
  - { id: ERR_EARLY_ACCESS_MEMBER_ONLY, http: 403, condition: "Guest purchase attempted while an early-access event is ACTIVE for the lot" }
  - { id: ERR_MEMBER_TIER_TOO_LOW, http: 403, condition: "Member tier below the ACTIVE event's min_tier" }
  - { id: ERR_MEMBER_DISCOUNT_CAP_EXCEEDED, http: 422, condition: "Combined member discount pct exceeds the selling store jurisdiction's member_discount_cap_pct" }
  - { id: ERR_SIGNAGE_LIMIT_EXCEEDED, http: 409, condition: "Daily unit limit for (store, lot, member-or-guest-bucket) would be exceeded" }
  - { id: ERR_COMPARISON_ADVERTISING_PROHIBITED, http: 422, condition: "advertises_comparison=true under a COMPARISON_PROHIBITED jurisdiction (pricing or assignment)" }
  - { id: ERR_COMPARISON_NOT_MSRP, http: 422, condition: "MSRP_REFERENCE jurisdiction: comparison price != vendor MSRP, or retail > comparison" }
  - { id: ERR_ANCHOR_PREMIUM_INSUFFICIENT, http: 422, condition: "WAS_NOW_WINDOW: comparison price below retail * 1.20 anchor" }
  - { id: ERR_ADVERTISED_DISCOUNT_TOO_DEEP, http: 422, condition: "WAS_NOW_WINDOW: advertised discount pct above max_advertised_discount_pct" }
  - { id: ERR_INVALID_EVENT_WINDOW, http: 422, condition: "Event ends_at <= starts_at" }
  - { id: ERR_REFUND_WINDOW_EXPIRED, http: 409, condition: "Refund attempted more than 14 days after purchase.created_at" }
  - { id: ERR_INSUFFICIENT_LOT_QUANTITY, http: 409, condition: "Allocation qty_requested exceeds lot.qty_pool" }
  - { id: ERR_INSUFFICIENT_STORE_STOCK, http: 409, condition: "Purchase qty exceeds the store's on-hand units for the lot" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Admin
    description: "Platform operator; manages stores, members, and the logical clock; can perform any operation"
    identity: opaque
    exclusive_operations:
      - "POST /stores, PATCH /stores/{id}"
      - "PATCH /members/{id}"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints; POST /vendors; POST /lots; POST /jurisdiction-rules; POST /members"

  - name: SourcingBuyer
    description: "Acquires closeout lots, re-grades failed lots, creates and applies dispositions"
    identity: opaque
    exclusive_operations:
      - "POST /lots/{lot_id}/regrade"
      - "POST /lots/{lot_id}/dispositions, POST /lots/{lot_id}/dispositions/{id}/apply"
    shared_operations:
      - "POST /vendors, POST /lots (shared with Admin); all GET endpoints"

  - name: SafetyOfficer
    description: "Screens lots for recall/expiration/condition; must not screen lots they sourced (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /lots/{lot_id}/screenings, POST /lots/{lot_id}/screenings/{id}/complete"
    shared_operations:
      - "All GET endpoints"

  - name: PricingLead
    description: "Owns jurisdictional advertising rules, retail pricing, and early-access events"
    identity: opaque
    exclusive_operations:
      - "POST /lots/{lot_id}/price"
      - "POST /lots/{lot_id}/early-access-events, POST /lots/{lot_id}/early-access-events/{id}/cancel"
    shared_operations:
      - "POST /jurisdiction-rules (shared with Admin); all GET endpoints"

  - name: AllocationManager
    description: "Allocates finite lot quantities across the store fleet and manages shipment lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /lots/{lot_id}/allocations, POST /lots/{lot_id}/allocations/commit"
      - "POST /lots/{lot_id}/allocations/{id}/ship|receive|recall|release|cancel"
    shared_operations:
      - "All GET endpoints"

  - name: StoreManager
    description: "Sets deal-driven aisle layouts and signage limits; processes refunds"
    identity: opaque
    exclusive_operations:
      - "POST /stores/{store_id}/aisle-assignments"
      - "POST /purchases/{id}/refund"
    shared_operations:
      - "All GET endpoints"

  - name: ClubMember
    description: "Loyalty club member; purchases with member pricing and early access; X-User-ID equals the LoyaltyMember id"
    identity: "entity_backed:LoyaltyMember"
    exclusive_operations: []
    shared_operations:
      - "POST /stores/{store_id}/purchases with member_id == X-User_ID (shared with Anonymous for guest purchases); all GET endpoints"

  - name: Anonymous
    description: "Unauthenticated public caller; guest purchases and member registration"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /members (shared with Admin); POST /stores/{store_id}/purchases without member_id; all GET endpoints"
