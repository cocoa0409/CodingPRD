              as: ReceivingClerk
              captures: { rcpt_r: "$.data.id" }
            - call: "POST /raw-receipts/${rcpt_r}/disposition"
              payload: { decision: "ACCEPT", trim_loss_lb: 0.00 }
              as: QATechnician
            - call: "POST /lines/${l2}/sanitation-events"
