      - name: property_reported_then_remitted_cascade
        claim_type: cascade_down
        grounds:
          - "state_machines.Property.REPORTABLE_to_REPORTED"
          - "state_machines.Property.REPORTED_to_REMITTED"
        distinguishing_aspect: "Stubbed: the REPORTABLE -> REPORTED hop fires at report accept and REPORTED -> REMITTED at remittance confirm; the remitted end-state is asserted by a difficulty instance."
        excluded_because:
          difficulty_instance: liquidation_settle_cascade_line_report_remittance
          rationale: "That instance's final asserts verify property REMITTED after confirm; the REPORTED intermediate is exercised in its setup chain."
  # (continued in the same file: calculations, validations, endpoints, errors, rbac, cross-cutting, consistency)

  # ===========================================================================
  - section: calculations
    instances:
      - name: securities_provisional_at_line_inclusion
        claim_type: correct_result
        grounds:
          - "calculations.securities_valuation"
        distinguishing_aspect: "Provisional variant correctness at line inclusion (462500c for 100sh @ 4500c + 12500c dividends)."
        excluded_because:
          difficulty_instance: securities_valuation_provisional_vs_liquidation_final
          rationale: "The difficulty instance captures and asserts provisional_value_cents == 462500 at inclusion and final_value_cents == 480000 after settle."

      - name: claim_payout_variant_selection
        claim_type: variant_selection
        grounds:
          - "calculations.claim_payout"
        distinguishing_aspect: "Variant selected by claim_type: CASH accrues interest, SECURITIES does not."
        excluded_because:
          difficulty_instance: claim_payout_cash_interest_vs_securities_proceeds
          rationale: "The difficulty instance asserts both variants' payouts and interest components on identical days_held."

      - name: report_totals_exclude_removed_lines
        claim_type: input_set_filtering
        grounds:
          - "calculations.report_totals"
          - "entities.HolderReport.fields.total_provisional_cents"
        distinguishing_aspect: "Only lines with status IN {INCLUDED, FINAL} feed the totals; a REMOVED line drops out of total_provisional, total_final, and line_count immediately."
        test_recipe:
          setup:
            - "Two CA SAVINGS properties (50000c, 70000c), both REPORTABLE after letter expiry, both lined into a DRAFT CA 2026 report (total 120000c, version 3)."
          setup_api_calls:
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "CA", property_type: "SAVINGS", dormancy_years: 3, effective_from: "2020-01-01" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/owners", payload: { full_name: "Tot Als", last_known_address: "18 Q St, Davis, CA", state_code: "CA" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { own1: $.data.id } }
            - { call: "POST /escheatment/properties", payload: { owner_id: "${own1}", property_type: "SAVINGS", state_code: "CA", original_value_cents: 50000, last_contact_date: "2023-03-15" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { p1: $.data.id } }
            - { call: "POST /escheatment/properties", payload: { owner_id: "${own1}", property_type: "SAVINGS", state_code: "CA", original_value_cents: 70000, last_contact_date: "2023-03-15" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { p2: $.data.id } }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/properties/${p1}/due-diligence-letters", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/properties/${p2}/due-diligence-letters", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/holder-reports", payload: { state_code: "CA", report_year: 2026 }, as: ComplianceOfficer, as_user_id: "co-1", captures: { r1: $.data.id, r1_v1: $.data.version } }
            - { call: "POST /escheatment/holder-reports/${r1}/line-items", payload: { property_id: "${p1}", expected_report_version: "${r1_v1}" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { li1: $.data.id } }
            - { call: "GET /escheatment/holder-reports/${r1}", as: Any, captures: { r1_v2: $.data.version } }
            - { call: "POST /escheatment/holder-reports/${r1}/line-items", payload: { property_id: "${p2}", expected_report_version: "${r1_v2}" }, as: ComplianceOfficer, as_user_id: "co-1" }
          trigger:
            - { call: "POST /escheatment/holder-reports/${r1}/line-items/${li1}/remove", as: ComplianceOfficer, as_user_id: "co-1", captures: { li_st: $.data.status } }
            - { call: "GET /escheatment/holder-reports/${r1}", as: Any, captures: { r_prov: $.data.total_provisional_cents, r_fin: $.data.total_final_cents, r_cnt: $.data.line_count, r_ver: $.data.version } }
          assert:
            - "Removed line status == REMOVED; report total_provisional_cents == 70000, total_final_cents == 70000, line_count == 1 (removed 50000c line excluded from all aggregates)"
            - "Report version incremented (3 -> 4) by the removal"

      - name: audit_exposure_estimate_computed
        claim_type: correct_result
        grounds:
          - "calculations.audit_exposure_estimate"
          - "entities.AuditCase.fields.estimated_exposure_cents"
        distinguishing_aspect: "Exposure composes the penalty cap and per-item interest for dormant-in-window properties: 200000 + min(25000*638, 50000) + round_half_up(200000*1200*638/3650000) = 291951c."
        test_recipe:
          setup:
            - "CA SAVINGS rule (3y); property 200000c last contacted 2021-04-01 -> dormancy_date 2024-04-02 (inside lookback [2024, 2025]); never lettered or reported; clock at default 2026-08-01."
          setup_api_calls:
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "CA", property_type: "SAVINGS", dormancy_years: 3, effective_from: "2020-01-01" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/owners", payload: { full_name: "Aud It", last_known_address: "19 R St, Davis, CA", state_code: "CA" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { own1: $.data.id } }
            - { call: "POST /escheatment/properties", payload: { owner_id: "${own1}", property_type: "SAVINGS", state_code: "CA", original_value_cents: 200000, last_contact_date: "2021-04-01" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { p1: $.data.id } }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/audit-cases", payload: { state_code: "CA", lookback_start_year: 2024, lookback_end_year: 2025 }, as: StateAuditor, as_user_id: "sa-1", captures: { a1: $.data.id } }
            - { call: "POST /escheatment/audit-cases/${a1}/advance", as: StateAuditor, as_user_id: "sa-1" }
          trigger:
            - { call: "POST /escheatment/audit-cases/${a1}/advance", as: StateAuditor, as_user_id: "sa-1", captures: { expo: $.data.estimated_exposure_cents, a_st: $.data.status } }
            - { call: "GET /escheatment/audit-cases/${a1}/exposure", as: Any, captures: { expo2: $.data.estimated_exposure_cents } }
          assert:
            - "advance to FINDINGS_ISSUED: estimated_exposure_cents == 291951 (base 200000 + capped penalty 50000 + interest 41951; days_past_due == 638 from missed due 2024-11-01 to 2026-08-01)"
            - "GET exposure returns the same 291951 with candidate_property_ids == [${p1}]"

      - name: late_penalty_zero_when_on_time
        claim_type: correct_result
        grounds:
