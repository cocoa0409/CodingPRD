    side_effects: ["recomputes effective_measurement_method", "increments Employee.version by 1"]
  - method: POST
    path: "/ale-reporting/employees/{employee_id}/full-time-recompute"
    description: "Run full_time_month_determination for one employee under its effective measurement method and, when a non-VOIDED Form1095C exists, refresh that form's MonthlyCoverageLine.full_time_flag and ft_source."
    roles: [BenefitsAdmin, Preparer]
    code: 200
    input: []
    output: Employee
    side_effects: ["writes full_time_months, full_time_month_count, measured_average_hours, ft_source_by_month, last_recomputed_at", "refreshes MonthlyCoverageLine.full_time_flag, ft_source and assessable on the employee's non-VOIDED form"]

  # ---------------- HoursRecord ----------------
  - method: POST
    path: "/ale-reporting/hours-records"
    description: "Record hours of service for a set of months of one measurement year. One HoursRecord row is created per entry in months with the same hour values; counted_hours = hours_of_service + paid_leave_hours and excluded_from_denominator = (special_unpaid_leave_hours >= 130) are computed per row. The call is atomic, so a duplicate month anywhere in the array creates nothing."
    roles: [BenefitsAdmin]
    code: 201
    input: [employee_id, measurement_year, months, hours_of_service, "paid_leave_hours?", "special_unpaid_leave_hours?"]
    output: HoursRecord[]
    side_effects: ["computes counted_hours and excluded_from_denominator per created row"]
  - method: GET
    path: "/ale-reporting/hours-records"
    description: "List hours records; filter by employee_id (FK reverse lookup), measurement_year or month."
    roles: [ComplianceOfficer, Preparer, FilingAgent, BenefitsAdmin]
    code: 200
    input: ["employee_id?", "measurement_year?", "month?"]
    output: HoursRecord[]
    side_effects: []
  - method: GET
    path: "/ale-reporting/hours-records/{id}"
    description: "Read one hours record including counted_hours and excluded_from_denominator."
    roles: [ComplianceOfficer, Preparer, FilingAgent, BenefitsAdmin]
    code: 200
    input: []
    output: HoursRecord
    side_effects: []

  # ---------------- EmploymentEvent ----------------
  - method: POST
    path: "/ale-reporting/employment-events"
    description: "Record a leave start, leave end, transfer, termination or rehire. This is the only writer of Employee.employment_status, termination_date and group_member_id, and the entry point of the LINK 1..LINK 5 termination cascade in §1.2."
    roles: [BenefitsAdmin]
    code: 201
    input: [employee_id, event_type, effective_date, "leave_type?", "to_group_member_id?", "note?"]
    output: EmploymentEvent
    side_effects: ["moves Employee through the §1.2 Employee transition for this event_type", "TERMINATION runs the LINK 1..LINK 5 cascade down to FilingSeason.open_correction_count", "TRANSFER moves group_member_id and may flip effective_measurement_method", "sets resulting_status and recorded_by_user_id"]
  - method: GET
    path: "/ale-reporting/employment-events"
    description: "List employment events; filter by employee_id or to_group_member_id (both FK reverse lookups) or event_type. Ordered by created_at ASC."
    roles: [ComplianceOfficer, Preparer, FilingAgent, BenefitsAdmin]
    code: 200
    input: ["employee_id?", "to_group_member_id?", "event_type?"]
    output: EmploymentEvent[]
    side_effects: []
  - method: GET
    path: "/ale-reporting/employment-events/{id}"
    description: "Read one employment event including resulting_status."
    roles: [ComplianceOfficer, Preparer, FilingAgent, BenefitsAdmin]
    code: 200
    input: []
    output: EmploymentEvent
    side_effects: []

  # ---------------- CoverageOffer ----------------
  - method: POST
    path: "/ale-reporting/coverage-offers"
    description: "Record an offer of coverage over a half-open date interval [effective_start_date, effective_end_date). covered_months is computed as the months the interval covers in full."
    roles: [BenefitsAdmin]
    code: 201
    input: [employee_id, offer_kind, minimum_value, lowest_cost_self_only_cents, effective_start_date, effective_end_date, "offers_spouse?", "offers_dependents?", "conditional_spouse_offer?", "enrolled?"]
    output: CoverageOffer
    side_effects: ["computes covered_months"]
  - method: GET
    path: "/ale-reporting/coverage-offers"
    description: "List coverage offers; filter by employee_id (FK reverse lookup)."
    roles: [ComplianceOfficer, Preparer, FilingAgent, BenefitsAdmin]
    code: 200
    input: ["employee_id?"]
    output: CoverageOffer[]
    side_effects: []
  - method: GET
    path: "/ale-reporting/coverage-offers/{id}"
    description: "Read one coverage offer including covered_months."
    roles: [ComplianceOfficer, Preparer, FilingAgent, BenefitsAdmin]
    code: 200
    input: []
    output: CoverageOffer
    side_effects: []

  # ---------------- FurnishingConsent ----------------
  - method: POST
    path: "/ale-reporting/furnishing-consents"
    description: "Create the electronic-furnishing consent record for one employee; at most one consent exists per employee."
    roles: [EmployeeSelfService, BenefitsAdmin]
    code: 201
    input: [employee_id, electronic_address]
    output: FurnishingConsent
    side_effects: ["consent_status = PENDING", "grant_count = 0"]
  - method: GET
    path: "/ale-reporting/furnishing-consents"
    description: "List consents; filter by employee_id (FK reverse lookup) or consent_status."
    roles: [ComplianceOfficer, Preparer, FilingAgent, BenefitsAdmin, EmployeeSelfService]
    code: 200
    input: ["employee_id?", "consent_status?"]
    output: FurnishingConsent[]
    side_effects: []
  - method: GET
    path: "/ale-reporting/furnishing-consents/{id}"
    description: "Read one consent including grant_count, granted_at and withdrawn_at."
    roles: [ComplianceOfficer, Preparer, FilingAgent, BenefitsAdmin, EmployeeSelfService]
    code: 200
    input: []
    output: FurnishingConsent
    side_effects: []
  - method: POST
    path: "/ale-reporting/furnishing-consents/{consent_id}/grant"
    description: "Employee grants (or re-grants after withdrawal) consent to electronic furnishing. X-User-ID must equal the consent's employee_id."
    roles: [EmployeeSelfService]
    code: 200
    input: []
    output: FurnishingConsent
    side_effects: ["consent_status = GRANTED", "granted_at set from the logical clock", "increments grant_count by 1"]
  - method: POST
    path: "/ale-reporting/furnishing-consents/{consent_id}/withdraw"
    description: "Employee withdraws consent. Every already electronically furnished form of the employee is pushed back to REDELIVERY_REQUIRED, which opens a correction on the group and the season."
    roles: [EmployeeSelfService]
    code: 200
    input: []
    output: FurnishingConsent
    side_effects: ["consent_status = WITHDRAWN", "withdrawn_at set", "Form1095C rows with furnishing_status == FURNISHED_ELECTRONIC move to REDELIVERY_REQUIRED", "ControlledGroup.open_correction_count and FilingSeason.open_correction_count increment"]

  # ---------------- Form1095C ----------------
  - method: POST
    path: "/ale-reporting/forms-1095c"
    description: "Generate the original Form 1095-C for one employee: runs full_time_month_determination, then monthly_code_assignment for all twelve months in its pinned seven-step order (line 14 codes first, then the offered-month count the W-2 safe harbor divides by, then line 15, then line 16, then assessability)."
    roles: [Preparer]
    code: 201
    input: [employee_id, plan_start_month, "safe_harbor_preference?"]
    output: Form1095C
    side_effects: ["creates 12 MonthlyCoverageLine rows", "runs full_time_month_determination, affordability_safe_harbor_test and monthly_code_assignment", "writes all_12_months_code, ft_month_count, offered_month_count, assessable_month_count, line15_total_cents, generated_by_user_id", "increments GroupMember.generated_form_count and unattached_form_count"]
  - method: GET
    path: "/ale-reporting/forms-1095c"
    description: "List forms; filter by employee_id, transmittal_id or corrected_from_form_id (all three FK reverse lookups) or by either status dimension."
    roles: [ComplianceOfficer, Preparer, FilingAgent, BenefitsAdmin]
    code: 200
    input: ["employee_id?", "transmittal_id?", "corrected_from_form_id?", "furnishing_status?", "filing_status?", "form_type?"]
    output: Form1095C[]
    side_effects: []
  - method: GET
    path: "/ale-reporting/forms-1095c/{id}"
    description: "Read one form including both status dimensions, the roll-ups and late_furnishing_penalty_cents."
    roles: [ComplianceOfficer, Preparer, FilingAgent, BenefitsAdmin, EmployeeSelfService]
    code: 200
    input: []
    output: Form1095C
    side_effects: []
  - method: POST
    path: "/ale-reporting/forms-1095c/{form_id}/regenerate"
    description: "Recompute the twelve coverage lines against current data. On a form that has already been furnished this drafts a CORRECTED form with corrected_from_form_id set and voids the original instead of editing it in place."
    roles: [Preparer]
    code: 200
    input: ["correction_reason?"]
    output: Form1095C
    side_effects: ["re-runs monthly_code_assignment", "on an already furnished or filed form: creates the CORRECTED successor, voids this one, opens a correction on the group and the season"]
  - method: POST
    path: "/ale-reporting/forms-1095c/{form_id}/furnish"
    description: "Furnish the statement to the employee on paper or electronically. Electronic delivery requires a GRANTED consent; the furnishing user may not be the user who generated the form; the penalty tier is computed by late_furnishing_penalty from the logical clock."
    roles: [Preparer, BenefitsAdmin]
    code: 200
    input: [delivery_channel, "intentional_disregard?"]
    output: Form1095C
    side_effects: ["furnishing_status = FURNISHED_PAPER or FURNISHED_ELECTRONIC", "sets furnished_at and furnished_by_user_id", "computes late_furnishing_penalty_cents and adds the delta to GroupMember.furnishing_penalty_total_cents", "re-furnishing a REDELIVERY_REQUIRED form closes the correction on the group and the season"]

  # ---------------- MonthlyCoverageLine ----------------
  - method: GET
    path: "/ale-reporting/monthly-coverage-lines"
    description: "List the per-month coverage lines; filter by form_1095c_id (FK reverse lookup) or month. This is the only discovery channel for these cascade-created rows."
    roles: [ComplianceOfficer, Preparer, FilingAgent, BenefitsAdmin, EmployeeSelfService]
    code: 200
    input: ["form_1095c_id?", "month?"]
    output: MonthlyCoverageLine[]
    side_effects: []
  - method: GET
    path: "/ale-reporting/monthly-coverage-lines/{id}"
    description: "Read one coverage line including line14_code, line15_amount_cents, line16_code, full_time_flag, ft_source, affordability_threshold_cents, safe_harbor_applied, special_situation and assessable."
    roles: [ComplianceOfficer, Preparer, FilingAgent, BenefitsAdmin, EmployeeSelfService]
    code: 200
    input: []
    output: MonthlyCoverageLine
    side_effects: []

  # ---------------- Transmittal ----------------
  - method: POST
    path: "/ale-reporting/transmittals"
    description: "Open a 1094-C transmittal for one member. OCC-guarded on the member's version (§1.2.1 transmittal-create-stale-member)."
    roles: [Preparer]
    code: 201
    input: [group_member_id, transmission_type, expected_group_member_version, "authoritative_indicator?"]
    output: Transmittal
    side_effects: ["status = DRAFT", "cycle_number = 1", "sets GroupMember.open_transmittal_id", "increments GroupMember.version by 1"]
  - method: GET
    path: "/ale-reporting/transmittals"
    description: "List transmittals; filter by group_member_id (FK reverse lookup) or status."
    roles: [ComplianceOfficer, Preparer, FilingAgent, BenefitsAdmin]
    code: 200
    input: ["group_member_id?", "status?"]
    output: Transmittal[]
    side_effects: []
  - method: GET
    path: "/ale-reporting/transmittals/{id}"
    description: "Read one transmittal including form_count, aggregate_return_count, required_channel, monthly_ft_counts, error_count, open_error_count and cycle_number."
    roles: [ComplianceOfficer, Preparer, FilingAgent, BenefitsAdmin]
    code: 200
    input: []
    output: Transmittal
    side_effects: []
  - method: POST
    path: "/ale-reporting/transmittals/{transmittal_id}/attach-forms"
    description: "Attach one or more generated forms of the same member to a DRAFT transmittal. Atomic: if any named form is not NOT_FILED, nothing is attached."
    roles: [Preparer]
    code: 200
    input: [form_ids]
    output: Transmittal
    side_effects: ["each form's filing_status NOT_FILED -> ATTACHED and transmittal_id set", "increments Transmittal.form_count", "moves GroupMember.unattached_form_count into attached_form_count", "increments GroupMember.version by 1"]
  - method: POST
    path: "/ale-reporting/transmittals/{transmittal_id}/detach-form"
    description: "Compensating action for attach-forms: return one attached form to NOT_FILED. A BUILT transmittal reverts to DRAFT and drops its build outputs."
    roles: [Preparer]
    code: 200
    input: [form_id]
    output: Transmittal
    side_effects: ["form filing_status ATTACHED -> NOT_FILED and transmittal_id cleared", "decrements Transmittal.form_count", "moves GroupMember.attached_form_count back into unattached_form_count", "BUILT -> DRAFT with aggregate_return_count = 0, required_channel = ANY, monthly_ft_counts = [] and built_at cleared", "increments GroupMember.version by 1"]
  - method: POST
    path: "/ale-reporting/transmittals/{transmittal_id}/build"
    description: "Build the transmittal: computes aggregate_return_count and required_channel via transmission_channel_requirement, freezes the reporting-year monthly full-time counts, and supersedes any other BUILT transmittal of the member. Also used for the replacement and correction rounds, which increment cycle_number."
    roles: [Preparer]
    code: 200
    input: []
    output: Transmittal
    side_effects: ["status = BUILT", "runs transmission_channel_requirement", "freezes monthly_ft_counts", "sets built_by_user_id and built_at", "other BUILT transmittals of the member move to SUPERSEDED", "from REJECTED or CORRECTION_REQUIRED: increments cycle_number by 1"]
  - method: POST
    path: "/ale-reporting/transmittals/{transmittal_id}/transmit"
    description: "Transmit the built submission on the given channel. PAPER is refused when required_channel == ELECTRONIC, and the transmitting user may not be the user who built it."
    roles: [FilingAgent]
    code: 200
    input: [channel]
    output: Transmittal
    side_effects: ["status = TRANSMITTED", "sets channel, transmitted_by_user_id, transmitted_at", "every attached form moves filing_status ATTACHED -> PENDING_FILING"]
  - method: POST
    path: "/ale-reporting/transmittals/{transmittal_id}/agency-response"
    description: "Record the agency's response to a transmitted submission. ACCEPTED_WITH_ERRORS and PARTIALLY_ACCEPTED create one TransmittalError per errors[] entry and run the LINK 1..LINK 5 cascade down to FilingSeason.open_correction_count."
    roles: [FilingAgent]
    code: 200
    input: [response_status, "receipt_id?", "errors?"]
    output: Transmittal
    side_effects: ["status = ACCEPTED | ACCEPTED_WITH_ERRORS | PARTIALLY_ACCEPTED | REJECTED", "creates TransmittalError rows and sets error_count / open_error_count", "attached forms move to FILED_ACCEPTED, FILED_WITH_ERRORS or back to ATTACHED", "furnished forms named by a FATAL or ERROR entry move to REDELIVERY_REQUIRED, incrementing ControlledGroup.open_correction_count and FilingSeason.open_correction_count"]
  - method: POST
    path: "/ale-reporting/transmittals/{transmittal_id}/start-correction-cycle"
    description: "Move an errored submission into CORRECTION_REQUIRED so it can be rebuilt once every error is resolved; refused at the correction-cycle limit."
    roles: [Preparer]
    code: 200
    input: []
    output: Transmittal
    side_effects: ["status = CORRECTION_REQUIRED"]

  # ---------------- TransmittalError ----------------
  - method: POST
    path: "/ale-reporting/transmittal-errors"
    description: "Record an additional agency error against an already errored submission (status IN {ACCEPTED_WITH_ERRORS, PARTIALLY_ACCEPTED, REJECTED}). Counters only: this endpoint never moves a form's filing_status, because the agency-response cascade is the sole path into FILED_WITH_ERRORS."
    roles: [FilingAgent]
    code: 201
    input: [transmittal_id, form_1095c_id, error_code, error_field, severity]
    output: TransmittalError
    side_effects: ["resolution_status = OPEN", "increments Transmittal.error_count and open_error_count"]
  - method: GET
    path: "/ale-reporting/transmittal-errors"
    description: "List agency errors; filter by transmittal_id, form_1095c_id or corrected_form_id (all three FK reverse lookups) or resolution_status. This is the only discovery channel for errors created by the agency-response cascade."
    roles: [ComplianceOfficer, Preparer, FilingAgent, BenefitsAdmin]
    code: 200
    input: ["transmittal_id?", "form_1095c_id?", "corrected_form_id?", "resolution_status?"]
    output: TransmittalError[]
    side_effects: []
  - method: GET
    path: "/ale-reporting/transmittal-errors/{id}"
    description: "Read one agency error including severity, resolution_status, corrected_form_id and resolution_note."
    roles: [ComplianceOfficer, Preparer, FilingAgent, BenefitsAdmin]
    code: 200
    input: []
    output: TransmittalError
    side_effects: []
  - method: POST
    path: "/ale-reporting/transmittal-errors/{error_id}/resolve"
    description: "Resolve one agency error either by drafting a correction form (CORRECT_FORM) or by accepting the filing as-is (ACCEPT_AS_FILED, WARNING severity only)."
    roles: [Preparer]
    code: 200
    input: [resolution, "resolution_note?"]
    output: TransmittalError
    side_effects: ["CORRECT_FORM: creates a CORRECTED Form1095C, sets corrected_form_id, moves the named form FILED_WITH_ERRORS -> CORRECTION_DRAFTED and opens a correction on the group and the season", "decrements Transmittal.open_error_count", "sets resolved_by_user_id and resolution_note"]

  # ---------------- PenaltyNotice / PenaltyEvidence ----------------
  - method: POST
    path: "/ale-reporting/penalty-notices"
    description: "Record a proposed-penalty notice against a controlled group, with the months the agency asserts under section (a) and the employee-months it asserts under section (b)."
    roles: [ComplianceOfficer]
    code: 201
    input: [controlled_group_id, notice_number, notice_date, response_due_date, proposed_amount_cents, asserted_a_months, asserted_b_employee_months]
    output: PenaltyNotice
    side_effects: ["status = RECEIVED", "evidence_count = 0", "allocated_total_cents = 0"]
  - method: GET
    path: "/ale-reporting/penalty-notices"
    description: "List penalty notices; filter by controlled_group_id (FK reverse lookup) or status."
    roles: [ComplianceOfficer, Preparer, FilingAgent]
    code: 200
    input: ["controlled_group_id?", "status?"]
    output: PenaltyNotice[]
    side_effects: []
  - method: GET
    path: "/ale-reporting/penalty-notices/{id}"
    description: "Read one notice including a_month_penalty_cents, b_month_penalty_cents, recalculated_amount_cents, allocated_total_cents, unallocated_amount_cents, evidence_count and applied_evidence_count."
    roles: [ComplianceOfficer, Preparer, FilingAgent]
    code: 200
    input: []
    output: PenaltyNotice
    side_effects: []
  - method: POST
    path: "/ale-reporting/penalty-notices/{notice_id}/evidence"
    description: "File one piece of evidence against the notice: proof of a group-wide MEC offer for an asserted (a) month, proof of an offer for an asserted employee-month, or a dispute of an employee's full-time status. Filing evidence invalidates any prior recomputation."
    roles: [ComplianceOfficer]
    code: 201
    input: [evidence_type, month, document_ref, "employee_id?", "asserted_line14_code?", "asserted_line16_code?"]
    output: PenaltyEvidence
    side_effects: ["notice status moves to EVIDENCE_GATHERING", "increments evidence_count and sets last_evidence_user_id", "clears any prior recomputation and resets every member's allocated_penalty_cents to 0"]
  - method: POST
    path: "/ale-reporting/penalty-notices/{notice_id}/recompute"
    description: "Run penalty_recomputation_and_allocation in its pinned order: apply evidence, recompute reporting-year monthly full-time counts, price section (a) months above the allocated 30-employee exclusion, price the surviving section (b) employee-months, then allocate the exclusion and the dollars across members by largest remainder."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: PenaltyNotice
    side_effects: ["status = RECOMPUTED", "writes a_month_penalty_cents, b_month_penalty_cents, recalculated_amount_cents, allocated_total_cents, unallocated_amount_cents, applied_evidence_count, recomputed_at", "writes GroupMember.allocated_exclusion_employees and allocated_penalty_cents for every ACTIVE member"]
  - method: POST
    path: "/ale-reporting/penalty-notices/{notice_id}/allocation/reset"
    description: "Compensating action for the allocation step of recompute: zero every member's allocated_penalty_cents and move the whole recalculated amount back into unallocated_amount_cents. The conserved quantity is cents."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: PenaltyNotice
    side_effects: ["every ACTIVE member's allocated_penalty_cents = 0", "allocated_total_cents = 0", "unallocated_amount_cents = recalculated_amount_cents"]
  - method: POST
    path: "/ale-reporting/penalty-notices/{notice_id}/submit-response"
    description: "Submit the response to the agency. Requires a settled allocation, a clock inside the response window, and a user other than the one who last filed evidence."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: PenaltyNotice
    side_effects: ["status = RESPONSE_SUBMITTED", "sets response_submitted_at and response_submitted_by_user_id"]
  - method: POST
    path: "/ale-reporting/penalty-notices/{notice_id}/agency-determination"
    description: "Record the agency's determination on the response: full abatement, partial abatement, or the penalty sustained in full (which reallocates the full proposed amount across members)."
    roles: [ComplianceOfficer]
    code: 200
    input: [determination, abated_amount_cents]
    output: PenaltyNotice
    side_effects: ["status = ABATED_FULL | ABATED_PARTIAL | SUSTAINED", "sets determination and abated_amount_cents", "ABATED_FULL zeroes every member allocation; SUSTAINED reallocates proposed_amount_cents by largest remainder"]
  - method: GET
    path: "/ale-reporting/penalty-evidence"
    description: "List evidence rows; filter by penalty_notice_id or employee_id (both FK reverse lookups) or evidence_type. Ordered by created_at ASC, which is also the order in which recompute applies them."
    roles: [ComplianceOfficer, Preparer, FilingAgent]
    code: 200
    input: ["penalty_notice_id?", "employee_id?", "evidence_type?"]
    output: PenaltyEvidence[]
    side_effects: []
  - method: GET
    path: "/ale-reporting/penalty-evidence/{id}"
    description: "Read one evidence row including its computed applied flag."
    roles: [ComplianceOfficer, Preparer, FilingAgent]
    code: 200
    input: []
    output: PenaltyEvidence
    side_effects: []

  # ---------------- test-driving endpoint ----------------
  - method: POST
    path: "/ale-reporting/_clock/set_current_utc"
    description: "Set the server's logical clock, which every deadline, window and penalty-tier rule reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z — that fixed default, never real wall-clock time, is the startup value, and it sits at or before every fixture date in this scaffold."
    roles: [ComplianceOfficer, Preparer, FilingAgent, BenefitsAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["no entity is mutated; subsequent requests evaluate deadlines, furnishing windows, notice response windows and penalty tiers against the new value"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # ---- authentication / authorization / request shape ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or naming a role not declared in §1.7"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed in the endpoint's §1.5 roles, or an EmployeeSelfService actor whose X-User-ID is not the consent's employee_id calls grant or withdraw"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong type, enum value out of range, month outside 1..12, empty months array, ownership_pct outside (0,100], malformed date, or intra-body date ordering violated (validation priority 3, evaluated before any existence lookup)"

  # ---- existence ----
  - id: ERR_FILING_SEASON_NOT_FOUND
    http: 404
    condition: "no FilingSeason with the given id"
  - id: ERR_CONTROLLED_GROUP_NOT_FOUND
    http: 404
    condition: "no ControlledGroup with the given id"
  - id: ERR_GROUP_MEMBER_NOT_FOUND
    http: 404
    condition: "no GroupMember with the given id, including single_member_id and to_group_member_id references"
  - id: ERR_EMPLOYEE_NOT_FOUND
    http: 404
    condition: "no Employee with the given id"
  - id: ERR_CONSENT_NOT_FOUND
    http: 404
    condition: "no FurnishingConsent with the given id"
  - id: ERR_FORM_NOT_FOUND
    http: 404
    condition: "no Form1095C with the given id, including form_ids[] and form_1095c_id references"
  - id: ERR_TRANSMITTAL_NOT_FOUND
    http: 404
    condition: "no Transmittal with the given id"
  - id: ERR_TRANSMITTAL_ERROR_NOT_FOUND
    http: 404
    condition: "no TransmittalError with the given id"
  - id: ERR_PENALTY_NOTICE_NOT_FOUND
    http: 404
    condition: "no PenaltyNotice with the given id"
  - id: ERR_RECORD_NOT_FOUND
    http: 404
    condition: "no immutable ledger row with the given id on the single-row reads for MonthlyHeadcount, MeasurementCycle, HoursRecord, EmploymentEvent, CoverageOffer, MonthlyCoverageLine or PenaltyEvidence"

  # ---- cross-aggregate scope ----
  - id: ERR_SCOPE_MISMATCH
    http: 409
    condition: "a referenced resource belongs to a different aggregate than the path resource: form's employee under another member on attach-forms, single_member_id outside the group, MeasurementCycle employee under another member, TransmittalError form on another transmittal, evidence employee outside the notice's group, transfer target in another controlled group"

  # ---- state preconditions ----
  - id: ERR_SEASON_LOCKED
    http: 409
    condition: "the governing FilingSeason has status == LOCKED"
  - id: ERR_DETERMINATION_LOCKED
    http: 409
    condition: "the ControlledGroup has determination_state == LOCKED; observable on its own on POST /ale-reporting/group-members and PATCH /ale-reporting/group-members/{member_id}, which validation priority 7 does not cover"
  - id: ERR_GROUP_NOT_DETERMINED_ALE
    http: 409
    condition: "form generation or transmittal build attempted while the ControlledGroup is not in {DETERMINED_ALE, CORRECTION_OPEN}"
  - id: ERR_EMPLOYMENT_EVENT_NOT_APPLICABLE
    http: 409
    condition: "the event_type is not a declared transition out of the employee's current employment_status (LEAVE_START while ON_LEAVE, LEAVE_END while ACTIVE, TRANSFER or TERMINATION while TERMINATED, REHIRE while not TERMINATED)"
  - id: ERR_CONSENT_ALREADY_GRANTED
    http: 409
    condition: "grant attempted while consent_status == GRANTED"
  - id: ERR_CONSENT_NOT_GRANTED
    http: 409
    condition: "withdraw attempted while consent_status != GRANTED (validation priority 12), or electronic furnishing attempted for an employee with no GRANTED consent (validation priority 29)"
  - id: ERR_FORM_ALREADY_FURNISHED
    http: 409
    condition: "furnish attempted while furnishing_status is FURNISHED_PAPER, FURNISHED_ELECTRONIC or VOIDED"
  - id: ERR_FORM_ALREADY_ATTACHED
    http: 409
    condition: "attach-forms names a form whose filing_status is not NOT_FILED"
  - id: ERR_FORM_NOT_ATTACHED
    http: 409
    condition: "detach-form names a form that is not ATTACHED to this transmittal"
  - id: ERR_FORM_VOIDED
    http: 409
    condition: "regenerate or full-time recompute targets a form whose furnishing_status or filing_status is VOIDED"
  - id: ERR_TRANSMITTAL_STATE_INVALID
    http: 409
    condition: "the transmittal's status does not admit the operation: build outside {DRAFT, REJECTED, CORRECTION_REQUIRED}, attach-forms outside DRAFT, detach-form outside {DRAFT, BUILT}, agency-response outside TRANSMITTED, start-correction-cycle outside {ACCEPTED_WITH_ERRORS, PARTIALLY_ACCEPTED}, or a direct TransmittalError create outside {ACCEPTED_WITH_ERRORS, PARTIALLY_ACCEPTED, REJECTED}"
  - id: ERR_TRANSMITTAL_NOT_BUILT
    http: 409
    condition: "transmit attempted while Transmittal.status != BUILT; outranks ERR_ELECTRONIC_FILING_REQUIRED because state sits at priority 20 and the channel threshold at priority 43"
  - id: ERR_ERROR_ALREADY_RESOLVED
    http: 409
    condition: "resolve attempted while TransmittalError.resolution_status != OPEN, or ACCEPT_AS_FILED attempted on a FATAL or ERROR severity row"
  - id: ERR_NOTICE_STATE_INVALID
    http: 409
    condition: "the notice's status does not admit the operation: evidence outside {RECEIVED, EVIDENCE_GATHERING, RECOMPUTED}, recompute outside EVIDENCE_GATHERING or with evidence_count == 0, agency-determination outside RESPONSE_SUBMITTED"
  - id: ERR_NOTICE_NOT_RECOMPUTED
    http: 409
    condition: "submit-response or allocation/reset attempted while PenaltyNotice.status != RECOMPUTED"

  # ---- optimistic concurrency (§1.2.1) ----
  - id: ERR_STALE_GROUP_VERSION
    http: 412
    condition: "expected_controlled_group_version does not equal the ControlledGroup's current version"
  - id: ERR_STALE_MEMBER_VERSION
    http: 412
    condition: "expected_group_member_version does not equal the GroupMember's current version"

  # ---- compliance / safety ----
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "X-User-ID equals Form1095C.generated_by_user_id on furnish, Transmittal.built_by_user_id on transmit, or PenaltyNotice.last_evidence_user_id on submit-response"

  # ---- data completeness / cross-entity referential ----
  - id: ERR_HEADCOUNT_INCOMPLETE
    http: 409
    condition: "ale-determination run while a counted member lacks any of the 12 PRIOR_YEAR MonthlyHeadcount months"
  - id: ERR_MEASUREMENT_METHOD_CONFLICT
    http: 409
    condition: "an employee whose effective_measurement_method == LOOK_BACK has neither an own INITIAL MeasurementCycle nor a STANDARD cycle on its member"
  - id: ERR_NO_HOURS_DATA
    http: 422
    condition: "the LOOK_BACK denominator is empty — no HoursRecord in the measurement window survives the excluded_from_denominator filter"
  - id: ERR_NO_FORMS_ATTACHED
    http: 409
    condition: "build attempted with form_count == 0"
  - id: ERR_OPEN_TRANSMITTAL_ERRORS
    http: 409
    condition: "build from CORRECTION_REQUIRED attempted while open_error_count >= 1"
  - id: ERR_SEASON_NOT_LOCKABLE
    http: 409
    condition: "lock attempted while FilingSeason.open_correction_count > 0 or some transmittal of the season is not in {ACCEPTED, SUPERSEDED}"
  - id: ERR_EVIDENCE_FORM_NOT_FILED
    http: 409
    condition: "recompute attempted while a Form1095C named by FT_STATUS_DISPUTE or OFFER_PROOF evidence is not in {FILED_ACCEPTED, FILED_WITH_ERRORS, CORRECTION_DRAFTED}"
  - id: ERR_EVIDENCE_MONTH_NOT_ASSERTED
    http: 422
    condition: "MEC_OFFER_PROOF names a month absent from asserted_a_months, or FT_STATUS_DISPUTE / OFFER_PROOF names an (employee_id, month) pair absent from asserted_b_employee_months"

  # ---- temporal ----
  - id: ERR_STABILITY_PERIOD_OVERLAP
    http: 409
    condition: "a new MeasurementCycle's closed stability interval [stability_start_date, stability_end_date] touches or overlaps an existing cycle of the same employee (or the same member for STANDARD cycles)"
  - id: ERR_COVERAGE_OFFER_OVERLAP
    http: 409
    condition: "a new CoverageOffer's half-open interval [effective_start_date, effective_end_date) overlaps an existing offer of the same employee; starting exactly on an existing offer's end date does NOT overlap"
  - id: ERR_FURNISHING_WINDOW_NOT_OPEN
    http: 409
    condition: "furnish attempted while the logical clock date is on or before {FilingSeason.tax_year}-12-31"
  - id: ERR_NOTICE_RESPONSE_WINDOW_CLOSED
    http: 409
    condition: "evidence, recompute or submit-response attempted while the logical clock date is after PenaltyNotice.response_due_date"

  # ---- uniqueness / threshold constraints ----
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "a declared uniqueness key is taken: FilingSeason.tax_year, GroupMember.ein within its controlled group, PenaltyNotice.notice_number, or a second FurnishingConsent for one employee"
  - id: ERR_DUPLICATE_HEADCOUNT_MONTH
    http: 409
    condition: "a MonthlyHeadcount already exists for some (group_member_id, count_year, month) in the request; nothing is created"
  - id: ERR_DUPLICATE_HOURS_MONTH
    http: 409
    condition: "a HoursRecord already exists for some (employee_id, measurement_year, month) in the request; nothing is created"
  - id: ERR_DUPLICATE_FORM
    http: 409
    condition: "the employee already has a Form1095C with form_type == ORIGINAL and furnishing_status != VOIDED"
  - id: ERR_TRANSFER_TARGET_INVALID
    http: 409
    condition: "a TRANSFER names the employee's current group_member_id or a member whose member_status == INACTIVE"
  - id: ERR_CORRECTION_CYCLE_LIMIT
    http: 409
    condition: "build from REJECTED or CORRECTION_REQUIRED, or start-correction-cycle, attempted while cycle_number >= CORRECTION_CYCLE_LIMIT (3)"
  - id: ERR_ELECTRONIC_FILING_REQUIRED
    http: 409
    condition: "transmit with channel == PAPER while aggregate_return_count >= FilingSeason.electronic_filing_threshold, i.e. required_channel == ELECTRONIC"

  # ---- fiscal ----
  - id: ERR_ALLOCATION_NOT_SETTLED
    http: 409
    condition: "submit-response attempted while recalculated_amount_cents is null or unallocated_amount_cents != 0"
  - id: ERR_ABATEMENT_AMOUNT_INVALID
    http: 422
    condition: "agency-determination amounts contradict the determination: ABATED_FULL without abated_amount_cents == proposed_amount_cents, ABATED_PARTIAL outside (0, proposed_amount_cents), or SUSTAINED with abated_amount_cents != 0"

# =============================================================================
# §1.7 RBAC Matrix (role_model: segregation_of_duties)
# =============================================================================
# Three compliance controls compare X-User-ID against a stored actor id rather
# than against a role: a form may not be furnished by the user who generated it,
# a submission may not be transmitted by the user who built it, and a penalty
# response may not be submitted by the user who last filed evidence. All three
# are enforced at validation priority 23 (ERR_SEGREGATION_OF_DUTIES).
roles:
  - name: ComplianceOfficer
    description: "Owns the season, the controlled-group structure, the ALE determination and the whole proposed-penalty response workflow."
    identity: opaque
    exclusive_operations:
      - "POST /ale-reporting/filing-seasons"
      - "POST /ale-reporting/filing-seasons/{season_id}/lock"
      - "POST /ale-reporting/controlled-groups"
      - "POST /ale-reporting/controlled-groups/{group_id}/ale-determination"
      - "POST /ale-reporting/controlled-groups/{group_id}/reopen"
      - "POST /ale-reporting/group-members"
      - "PATCH /ale-reporting/group-members/{member_id}"
      - "POST /ale-reporting/penalty-notices"
      - "POST /ale-reporting/penalty-notices/{notice_id}/evidence"
      - "POST /ale-reporting/penalty-notices/{notice_id}/recompute"
      - "POST /ale-reporting/penalty-notices/{notice_id}/allocation/reset"
      - "POST /ale-reporting/penalty-notices/{notice_id}/submit-response"
      - "POST /ale-reporting/penalty-notices/{notice_id}/agency-determination"
    shared_operations:
      - "POST /ale-reporting/monthly-headcounts (with BenefitsAdmin)"
      - "POST /ale-reporting/measurement-cycles (with BenefitsAdmin)"
      - "POST /ale-reporting/_clock/set_current_utc (with every operator role)"
      - "every GET endpoint except the employee-scoped reads reserved to EmployeeSelfService"

  - name: BenefitsAdmin
    description: "Owns workforce data: hires, hours of service, leaves, transfers, terminations, rehires and offers of coverage."
    identity: opaque
    exclusive_operations:
      - "POST /ale-reporting/employees"
      - "PATCH /ale-reporting/employees/{employee_id}"
      - "POST /ale-reporting/hours-records"
      - "POST /ale-reporting/employment-events"
      - "POST /ale-reporting/coverage-offers"
    shared_operations:
      - "POST /ale-reporting/monthly-headcounts (with ComplianceOfficer)"
      - "POST /ale-reporting/measurement-cycles (with ComplianceOfficer)"
      - "POST /ale-reporting/employees/{employee_id}/full-time-recompute (with Preparer)"
      - "POST /ale-reporting/forms-1095c/{form_id}/furnish (with Preparer)"
      - "POST /ale-reporting/furnishing-consents (with EmployeeSelfService)"
      - "POST /ale-reporting/_clock/set_current_utc (with every operator role)"
      - "every GET endpoint except the employee-scoped reads reserved to EmployeeSelfService"

  - name: Preparer
    description: "Produces the statements and assembles the transmittal: generates and corrects Form 1095-C, attaches and detaches forms, builds submissions and resolves agency errors."
    identity: opaque
    exclusive_operations:
      - "POST /ale-reporting/forms-1095c"
      - "POST /ale-reporting/forms-1095c/{form_id}/regenerate"
      - "POST /ale-reporting/transmittals"
      - "POST /ale-reporting/transmittals/{transmittal_id}/attach-forms"
      - "POST /ale-reporting/transmittals/{transmittal_id}/detach-form"
      - "POST /ale-reporting/transmittals/{transmittal_id}/build"
      - "POST /ale-reporting/transmittals/{transmittal_id}/start-correction-cycle"
      - "POST /ale-reporting/transmittal-errors/{error_id}/resolve"
    shared_operations:
      - "POST /ale-reporting/employees/{employee_id}/full-time-recompute (with BenefitsAdmin)"
      - "POST /ale-reporting/forms-1095c/{form_id}/furnish (with BenefitsAdmin)"
      - "POST /ale-reporting/_clock/set_current_utc (with every operator role)"
      - "every GET endpoint except the employee-scoped reads reserved to EmployeeSelfService"

  - name: FilingAgent
    description: "Transmits submissions to the agency and records what the agency sent back."
    identity: opaque
    exclusive_operations:
      - "POST /ale-reporting/transmittals/{transmittal_id}/transmit"
      - "POST /ale-reporting/transmittals/{transmittal_id}/agency-response"
      - "POST /ale-reporting/transmittal-errors"
    shared_operations:
      - "POST /ale-reporting/_clock/set_current_utc (with every operator role)"
      - "every GET endpoint except the employee-scoped reads reserved to EmployeeSelfService"

  - name: EmployeeSelfService
    description: "The employee acting on their own consent to electronic delivery. X-User-ID is the Employee id, so grant and withdraw are refused unless X-User-ID == FurnishingConsent.employee_id."
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /ale-reporting/furnishing-consents/{consent_id}/grant"
      - "POST /ale-reporting/furnishing-consents/{consent_id}/withdraw"
    shared_operations:
      - "POST /ale-reporting/furnishing-consents (with BenefitsAdmin)"
      - "GET /ale-reporting/employees/{id}, GET /ale-reporting/forms-1095c/{id}, GET /ale-reporting/monthly-coverage-lines, GET /ale-reporting/monthly-coverage-lines/{id}, GET /ale-reporting/furnishing-consents, GET /ale-reporting/furnishing-consents/{id}"
