              as: ShowSecretary
              captures: { class102_id: $.data.id }
            - call: "POST /shows/${show_id}/license-submission"
              payload: {}
              as: ShowSecretary
            - call: "POST /shows/${show_id}/license-decision"
              payload: { decision: "APPROVE" }
              as: FederationOfficer
            - call: "POST /classes/${class101_id}/open"
              payload: {}
              as: ShowSecretary
            - call: "POST /riders"
              payload: { federation_member_number: "M-1001", full_name: "Ada Rider", membership_expires_on: "2027-06-30T00:00:00Z", trainer_name: "Bluegrass Barn" }
              as: FederationOfficer
              captures: { rider1_id: $.data.id }
            - call: "POST /horses"
              payload: { federation_registration_number: "H-2001", name: "Comet", owner_name: "Ada Rider", coggins_drawn_on: "2026-03-01T00:00:00Z" }
