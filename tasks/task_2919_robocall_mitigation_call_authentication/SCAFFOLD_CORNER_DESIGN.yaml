      - name: closed_regulatory_artifacts_are_rejected_on_repeat_transitions
        claim_type: error_triggerable
        grounds:
          - "validations[priority=18]"
          - "validations[priority=19]"
          - "validations[priority=20]"
          - "validations[priority=21]"
          - "errors[ERR_NOTICE_ALREADY_CLOSED]"
          - "errors[ERR_DISPUTE_STATE_INVALID]"
          - "errors[ERR_ENFORCEMENT_STATE_INVALID]"
          - "errors[ERR_REPORT_STATE_INVALID]"
        distinguishing_aspect: "Four independent lifecycles each refuse a step their current state does not offer - investigate on an already investigated notice, resolve on a FILED dispute, adjudicate on a PROPOSED action, file on a GENERATED report - and each returns its own 409 identifier rather than a shared conflict code."
        test_recipe:
          setup:
            - "One provider with an investigated notice, a filed blocking dispute, a proposed enforcement action and a generated effectiveness report"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-17T00:00:00Z" }
              as: Regulator
            - call: "POST /rmd/providers"
              payload: { legal_name: "Repeat Transition Voice", provider_type: "FACILITIES_BASED" }
              as: Regulator
              captures: { prov_id: $.data.id }
            - call: "POST /rmd/customers"
              payload: { provider_id: "${prov_id}", legal_name: "Repeat Co", contact_email: "ops@repeat.example", kyc_evidence_level: "CONTRACT_ONLY" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { cust_id: $.data.id }
            - call: "POST /rmd/illegal-traffic-notices"
              payload: { provider_id: "${prov_id}", calling_number: "+12025551801", description: "Robocall traffic already under investigation" }
              as: Regulator
              captures: { notice_id: $.data.id }
            - call: "POST /rmd/illegal-traffic-notices/${notice_id}/investigate"
              payload: { customer_id: "${cust_id}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /rmd/blocking-events"
              payload: { provider_id: "${prov_id}", customer_id: "${cust_id}", calling_number: "+12025551801", analytics_score: 0.8000, reason: "NOTICE_MANDATE" }
              as: FraudAnalyst
              as_user_id: "fraud-1"
              captures: { evt_id: $.data.id }
            - call: "POST /rmd/blocking-disputes"
              payload: { blocking_event_id: "${evt_id}", claim_note: "Survey calls placed to opted-in respondents" }
              as: Caller
              as_user_id: "${cust_id}"
              captures: { dispute_id: $.data.id }
            - call: "POST /rmd/enforcement-actions"
              payload: { provider_id: "${prov_id}", basis: "UNMITIGATED_NOTICE", violation_count: 2, violation_days: 5, assessment_basis: "PER_VIOLATION" }
              as: Regulator
              captures: { action_id: $.data.id }
            - call: "GET /rmd/providers/${prov_id}"
              payload: {}
              as: Regulator
              captures: { prov_vN: $.data.version }
            - call: "POST /rmd/effectiveness-reports"
              payload: { provider_id: "${prov_id}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", variant: "CERTIFIED", expected_provider_version: "${prov_vN}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { report_id: $.data.id }
          trigger:
            - call: "POST /rmd/illegal-traffic-notices/${notice_id}/investigate"
              payload: { customer_id: "${cust_id}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              expect: { status: 409, error_id: ERR_NOTICE_ALREADY_CLOSED }
            - call: "POST /rmd/blocking-disputes/${dispute_id}/resolve"
              payload: { outcome: "UPHOLD", resolution_note: "Resolved before review was ever opened" }
              as: FraudAnalyst
              as_user_id: "fraud-2"
              expect: { status: 409, error_id: ERR_DISPUTE_STATE_INVALID }
            - call: "POST /rmd/enforcement-actions/${action_id}/adjudicate"
              payload: { outcome: "SUSTAIN" }
              as: Regulator
              expect: { status: 409, error_id: ERR_ENFORCEMENT_STATE_INVALID }
            - call: "POST /rmd/effectiveness-reports/${report_id}/file"
