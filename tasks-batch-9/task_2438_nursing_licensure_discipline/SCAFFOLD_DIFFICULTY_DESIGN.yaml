            - call: "POST /license-applications"
              payload: { nurse_id: "${nurse_id}", board_config_id: "${board_id}", pathway: "EXAMINATION", credential_type: "RN", education_program_id: "${prog_id}", nclex_result: "PASS" }
              as: LicensureAnalyst
              captures: { app_id: $.data.id }
            - call: "POST /license-applications/${app_id}/submit"
              payload: {}
              as: LicensureAnalyst
            - call: "POST /license-applications/${app_id}/qualification-verification"
              payload: {}
              as: LicensureAnalyst
            - call: "POST /license-applications/${app_id}/screening-result"
              payload: { screening_offense_records: [] }
              as: LicensureAnalyst
            - call: "POST /licenses"
              payload: { source_application_id: "${app_id}" }
              as: LicensureAnalyst
              captures: { lic_id: $.data.id }
            - call: "POST /complaints"
              payload: { license_id: "${lic_id}", complainant_type: "PATIENT", violation_category: "PRACTICE_STANDARD", incident_date: "2026-07-22T00:00:00Z", employer_custodian_codes: ["MERCY-GEN"] }
              as: Investigator
              as_user_id: "inv-6"
              captures: { comp_id: $.data.id }
            - call: "POST /complaints/${comp_id}/triage"
              payload: { jurisdiction_finding: "JURISDICTION_CONFIRMED" }
              as: Investigator
