# =============================================================================
# §1.9 Scaffold Corner Design — task_2908 Wholesale Auction Arbitration
#
# Breadth probe. Walks references/claim-extraction-guide.md section by section
# against SCAFFOLD.yaml §1.1–§1.7. Corners already asserted by a named instance
# in SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as `excluded_because:` stubs with no
# test_recipe.
#
# Shared literals used by every recipe below (all pinned, none derived at test time):
#   logical clock default            2026-08-01T00:00:00Z
#   MECHANICAL policy                window_hours 48, mileage_limit 250,
#                                    min_claim_amount_cents 60000, 3p false,
#                                    max_allowance_bps 2000, psi_extension_hours 96,
#                                    psi_clean_waives_rights true
#   FRAME_DAMAGE policy              window_hours 168, mileage_limit 1000,
#                                    min_claim_amount_cents 50000, 3p true,
#                                    max_allowance_bps 3000, psi_extension_hours 72,
#                                    psi_clean_waives_rights false
#   sale 1450000 cents               MECHANICAL cap 290000, FRAME_DAMAGE cap 435000
#   transport bands                  8500 + 185*min(mi,100) + 155*min(max(mi-100,0),400)
#                                    + 130*max(mi-500,0)
#   actor ids                        admin-01, clerk-01, arb-intake-01, arb-decide-02,
#                                    insp-01 (BuyerRep/SellerRep act as the entity id)
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Section 1 — Entities (§1.1)
  # ===========================================================================
  - section: entities
    instances:

      - name: seller_creation_returns_good_standing_and_zero_counters
        claim_type: creation
        grounds:
          - entities.Seller
          - endpoints[POST /arbitration/sellers]
        distinguishing_aspect: "A Seller created with only name and dealer_license_no comes back with policy_tier GOOD_STANDING, all seven counters at 0, blocked_at_utc null and version 1."
        test_recipe:
          setup: ["Empty database; the logical clock sits at its default 2026-08-01T00:00:00Z."]
          setup_api_calls: []
          trigger:
            - call: "POST /arbitration/sellers"
              payload: { name: "Ridgeline Motors", dealer_license_no: "SL-1001" }
              as: AuctionAdmin
              as_user_id: "admin-01"
          assert:
            - "HTTP 201 and response.response_type == \"object\""
            - "response.data.name == \"Ridgeline Motors\" and response.data.dealer_license_no == \"SL-1001\""
            - "response.data.policy_tier == \"GOOD_STANDING\""
            - "response.data.rolling_arbitration_rate_bps == 0 and response.data.lifetime_arbitration_rate_bps == 0"
            - "response.data.rolling_window_sales_count == 0 and response.data.rolling_window_upheld_count == 0"
            - "response.data.lifetime_sales_count == 0 and response.data.lifetime_upheld_count == 0"
            - "response.data.open_claim_count == 0 and response.data.reinstated_count == 0"
            - "response.data.blocked_at_utc == null"
            - "response.data.version == 1 and response.data.id is a non-empty string"

      - name: sale_retrieval_returns_the_stored_block_data
        claim_type: retrieval
        grounds:
          - entities.AuctionSale
          - endpoints[GET /arbitration/sales/{id}]
        distinguishing_aspect: "GET /arbitration/sales/{id} echoes all eight input fields exactly as posted and reports settlement_status UNSETTLED, arbitration_status NONE, open_case_count 0, settlement_hold false, settled_at_utc null."
        test_recipe:
          setup: ["One Seller, one Buyer and one AuctionSale exist; nothing else has happened."]
          setup_api_calls:
            - call: "POST /arbitration/sellers"
              payload: { name: "Ridgeline Motors", dealer_license_no: "SL-1001" }
              as: AuctionAdmin
              as_user_id: "admin-01"
              captures: { seller_id: $.data.id }
            - call: "POST /arbitration/buyers"
              payload: { name: "Harbor Auto Group", dealer_license_no: "BL-2001" }
              as: AuctionAdmin
              as_user_id: "admin-01"
              captures: { buyer_id: $.data.id }
            - call: "POST /arbitration/sales"
              payload: { vin: "1FTFW1E50JKE12345", seller_id: "${seller_id}", buyer_id: "${buyer_id}", sale_price_cents: 1450000, hammer_time_utc: "2026-08-01T00:00:00Z", announced_odometer_miles: 84000, light_channel: "GREEN", title_status: "CLEAN" }
              as: BlockClerk
              as_user_id: "clerk-01"
              captures: { sale_id: $.data.id }
          trigger:
            - call: "GET /arbitration/sales/${sale_id}"
              payload: {}
              as: BlockClerk
              as_user_id: "clerk-01"
          assert:
            - "HTTP 200 and response.data.vin == \"1FTFW1E50JKE12345\""
            - "response.data.sale_price_cents == 1450000 and response.data.announced_odometer_miles == 84000"
            - "response.data.light_channel == \"GREEN\" and response.data.title_status == \"CLEAN\""
            - "response.data.settlement_status == \"UNSETTLED\" and response.data.settled_at_utc == null"
            - "response.data.arbitration_status == \"NONE\" and response.data.open_case_count == 0"
            - "response.data.settlement_hold == false and response.data.version == 1"

      - name: sales_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - entities.AuctionSale
          - endpoints[GET /arbitration/sales]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three sales, limit=2&offset=0 returns 2 rows with meta.total_count 3 and meta.has_more true, while offset=2 returns 1 row with meta.has_more false — total_count is the pre-limit count in both."
        test_recipe:
          setup: ["One Seller, one Buyer and exactly three AuctionSale rows exist, created in VIN order."]
          setup_api_calls:
            - call: "POST /arbitration/sellers"
              payload: { name: "Ridgeline Motors", dealer_license_no: "SL-1001" }
              as: AuctionAdmin
              as_user_id: "admin-01"
              captures: { seller_id: $.data.id }
            - call: "POST /arbitration/buyers"
              payload: { name: "Harbor Auto Group", dealer_license_no: "BL-2001" }
              as: AuctionAdmin
              as_user_id: "admin-01"
              captures: { buyer_id: $.data.id }
            - call: "POST /arbitration/sales"
              payload: { vin: "1FTFW1E50JKE10001", seller_id: "${seller_id}", buyer_id: "${buyer_id}", sale_price_cents: 900000, hammer_time_utc: "2026-08-01T00:00:00Z", announced_odometer_miles: 60000, light_channel: "GREEN", title_status: "CLEAN" }
              as: BlockClerk
              as_user_id: "clerk-01"
            - call: "POST /arbitration/sales"
              payload: { vin: "1FTFW1E50JKE10002", seller_id: "${seller_id}", buyer_id: "${buyer_id}", sale_price_cents: 910000, hammer_time_utc: "2026-08-01T00:00:00Z", announced_odometer_miles: 61000, light_channel: "GREEN", title_status: "CLEAN" }
              as: BlockClerk
              as_user_id: "clerk-01"
            - call: "POST /arbitration/sales"
              payload: { vin: "1FTFW1E50JKE10003", seller_id: "${seller_id}", buyer_id: "${buyer_id}", sale_price_cents: 920000, hammer_time_utc: "2026-08-01T00:00:00Z", announced_odometer_miles: 62000, light_channel: "GREEN", title_status: "CLEAN" }
              as: BlockClerk
              as_user_id: "clerk-01"
          trigger:
            - call: "GET /arbitration/sales?limit=2&offset=0"
              payload: {}
              as: AuctionAdmin
              as_user_id: "admin-01"
            - call: "GET /arbitration/sales?limit=2&offset=2"
              payload: {}
              as: AuctionAdmin
              as_user_id: "admin-01"
          assert:
            - "the first response is HTTP 200 with response_type == \"array\", len(response.data) == 2, meta.total_count == 3, meta.limit == 2, meta.offset == 0, meta.has_more == true"
            - "the second response has len(response.data) == 1, meta.total_count == 3, meta.offset == 2, meta.has_more == false"
            - "the two responses together cover all three VINs 1FTFW1E50JKE10001, 1FTFW1E50JKE10002 and 1FTFW1E50JKE10003 with no row repeated"

      - name: case_lookup_on_unknown_uuid_returns_not_found
        claim_type: not_found
        grounds:
          - entities.ArbitrationCase
          - validations[priority 6 ERR_CASE_NOT_FOUND]
          - errors[ERR_CASE_NOT_FOUND]
        distinguishing_aspect: "GET /arbitration/cases/{id} for a syntactically valid but unused UUID returns 404 ERR_CASE_NOT_FOUND, and the error payload carries only error_id and message."
        test_recipe:
          setup: ["Empty database; no ArbitrationCase has ever been created."]
          setup_api_calls: []
          trigger:
            - call: "GET /arbitration/cases/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Arbitrator
              as_user_id: "arb-intake-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 and response.response_type == \"error\""
            - "response.data.error_id == \"ERR_CASE_NOT_FOUND\""
            - "the error payload carries only error_id and message, per the declared response envelope"

      - name: sale_creation_without_vin_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.AuctionSale.fields.vin
          - validations[priority 4 ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting the required input field vin returns 400 ERR_INVALID_REQUEST and persists no AuctionSale — GET /arbitration/sales still reports meta.total_count 0."
        test_recipe:
          setup: ["One Seller and one Buyer exist; no sale has been created."]
          setup_api_calls:
            - call: "POST /arbitration/sellers"
              payload: { name: "Ridgeline Motors", dealer_license_no: "SL-1001" }
              as: AuctionAdmin
              as_user_id: "admin-01"
              captures: { seller_id: $.data.id }
            - call: "POST /arbitration/buyers"
              payload: { name: "Harbor Auto Group", dealer_license_no: "BL-2001" }
              as: AuctionAdmin
              as_user_id: "admin-01"
              captures: { buyer_id: $.data.id }
          trigger:
            - call: "POST /arbitration/sales"
              payload: { seller_id: "${seller_id}", buyer_id: "${buyer_id}", sale_price_cents: 1450000, hammer_time_utc: "2026-08-01T00:00:00Z", announced_odometer_miles: 84000, light_channel: "GREEN", title_status: "CLEAN" }
              as: BlockClerk
              as_user_id: "clerk-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 and response.data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /arbitration/sales as AuctionAdmin returns meta.total_count == 0 and len(response.data) == 0"

      - name: policy_defaults_null_window_null_mileage_and_24_hour_seller_response
        claim_type: defaults
        grounds:
          - entities.ArbitrationPolicy.fields.window_hours
          - entities.ArbitrationPolicy.fields.mileage_limit
          - entities.ArbitrationPolicy.fields.seller_response_hours
          - endpoints[POST /arbitration/policies]
        distinguishing_aspect: "Omitting window_hours, mileage_limit and seller_response_hours stores null, null and 24 respectively — the unlimited-window shape used by TITLE_BRANDED, not zeros."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /arbitration/policies"
              payload: { defect_class: "TITLE_BRANDED", min_claim_amount_cents: 0, requires_third_party_verification: true, max_allowance_bps: 0, psi_extension_hours: 0, psi_clean_waives_rights: false }
              as: AuctionAdmin
              as_user_id: "admin-01"
          assert:
            - "HTTP 201 and response.data.defect_class == \"TITLE_BRANDED\""
            - "response.data.window_hours == null and response.data.mileage_limit == null"
            - "response.data.seller_response_hours == 24"
            - "response.data.max_allowance_bps == 0 and response.data.psi_extension_hours == 0"
            - "response.data.version == 1"

      - name: case_window_fields_are_computed_and_client_values_are_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.ArbitrationCase.fields.window_eligible
          - entities.ArbitrationCase.fields.effective_window_hours
          - entities.ArbitrationCase.fields.hours_elapsed_at_claim
          - calculations.arbitration_window_evaluation
        distinguishing_aspect: "A POST /arbitration/cases body that also carries window_eligible false, effective_window_hours 9999, hours_elapsed_at_claim 12.5 and status \"UNWOUND\" is stored with the server-computed 48 / 0.0 / SUBMITTED instead — every client-supplied computed field is discarded."
        test_recipe:
          setup: ["One Seller, one Buyer, the MECHANICAL policy and one AuctionSale hammered at the clock default exist."]
          setup_api_calls:
            - call: "POST /arbitration/sellers"
              payload: { name: "Ridgeline Motors", dealer_license_no: "SL-1001" }
              as: AuctionAdmin
              as_user_id: "admin-01"
              captures: { seller_id: $.data.id }
            - call: "POST /arbitration/buyers"
              payload: { name: "Harbor Auto Group", dealer_license_no: "BL-2001" }
              as: AuctionAdmin
              as_user_id: "admin-01"
              captures: { buyer_id: $.data.id }
            - call: "POST /arbitration/policies"
              payload: { defect_class: "MECHANICAL", window_hours: 48, mileage_limit: 250, min_claim_amount_cents: 60000, requires_third_party_verification: false, max_allowance_bps: 2000, psi_extension_hours: 96, psi_clean_waives_rights: true }
              as: AuctionAdmin
              as_user_id: "admin-01"
            - call: "POST /arbitration/sales"
              payload: { vin: "1FTFW1E50JKE12345", seller_id: "${seller_id}", buyer_id: "${buyer_id}", sale_price_cents: 1450000, hammer_time_utc: "2026-08-01T00:00:00Z", announced_odometer_miles: 84000, light_channel: "GREEN", title_status: "CLEAN" }
              as: BlockClerk
              as_user_id: "clerk-01"
              captures: { sale_id: $.data.id }
          trigger:
            - call: "POST /arbitration/cases"
              payload: { sale_id: "${sale_id}", defect_class: "MECHANICAL", claim_amount_cents: 60000, odometer_at_claim: 84100, complaint_text: "Transmission slips under load", window_eligible: false, effective_window_hours: 9999, hours_elapsed_at_claim: 12.5, status: "UNWOUND" }
              as: BuyerRep
              as_user_id: "${buyer_id}"
          assert:
            - "HTTP 201 and response.data.status == \"SUBMITTED\" — the client-supplied UNWOUND is ignored"
            - "response.data.window_eligible == true — the client-supplied false is ignored"
            - "response.data.effective_window_hours == 48 — the client-supplied 9999 is ignored"
            - "response.data.hours_elapsed_at_claim == 0.0 and response.data.miles_driven_at_claim == 100"
            - "response.data.psi_extension_applied_hours == 0 and response.data.policy_version_at_intake == 1"
            - "response.data.current_round_index == 0 and response.data.fault_party == \"NONE\""

      - name: evidence_system_fields_are_server_minted_and_input_ignored
        claim_type: system_fields
        grounds:
          - entities.ClaimEvidence.fields.verified
          - entities.ClaimEvidence.fields.submitted_by_role
          - entities.ClaimEvidence.fields.recorded_at_utc
          - endpoints[POST /arbitration/cases/{id}/evidence]
        distinguishing_aspect: "A DIAGNOSTIC_SCAN posted with verified true, submitted_by_role \"Inspector\" and recorded_at_utc \"2020-01-01T00:00:00Z\" is stored with verified false, submitted_by_role \"BuyerRep\" and recorded_at_utc equal to the current logical clock 2026-08-01T00:00:00Z."
        test_recipe:
          setup: ["A SUBMITTED MECHANICAL ArbitrationCase exists on a sale hammered at the clock default; no evidence has been filed."]
          setup_api_calls:
            - call: "POST /arbitration/sellers"
              payload: { name: "Ridgeline Motors", dealer_license_no: "SL-1001" }
              as: AuctionAdmin
              as_user_id: "admin-01"
              captures: { seller_id: $.data.id }
            - call: "POST /arbitration/buyers"
              payload: { name: "Harbor Auto Group", dealer_license_no: "BL-2001" }
              as: AuctionAdmin
              as_user_id: "admin-01"
              captures: { buyer_id: $.data.id }
            - call: "POST /arbitration/policies"
              payload: { defect_class: "MECHANICAL", window_hours: 48, mileage_limit: 250, min_claim_amount_cents: 60000, requires_third_party_verification: false, max_allowance_bps: 2000, psi_extension_hours: 96, psi_clean_waives_rights: true }
              as: AuctionAdmin
              as_user_id: "admin-01"
            - call: "POST /arbitration/sales"
              payload: { vin: "1FTFW1E50JKE12345", seller_id: "${seller_id}", buyer_id: "${buyer_id}", sale_price_cents: 1450000, hammer_time_utc: "2026-08-01T00:00:00Z", announced_odometer_miles: 84000, light_channel: "GREEN", title_status: "CLEAN" }
              as: BlockClerk
              as_user_id: "clerk-01"
              captures: { sale_id: $.data.id }
            - call: "POST /arbitration/cases"
              payload: { sale_id: "${sale_id}", defect_class: "MECHANICAL", claim_amount_cents: 60000, odometer_at_claim: 84100, complaint_text: "Transmission slips under load" }
              as: BuyerRep
              as_user_id: "${buyer_id}"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /arbitration/cases/${case_id}/evidence"
              payload: { evidence_type: "DIAGNOSTIC_SCAN", provider_name: "Blue Ridge Diagnostics", document_reference: "DS-4410", verified: true, submitted_by_role: "Inspector", recorded_at_utc: "2020-01-01T00:00:00Z" }
              as: BuyerRep
              as_user_id: "${buyer_id}"
          assert:
            - "HTTP 201 and response.data.verified == false — verified is computed from evidence_type alone and DIAGNOSTIC_SCAN is never verified"
            - "response.data.submitted_by_role == \"BuyerRep\" and response.data.submitted_by_user_id == the buyer id used as X-User-ID"
            - "response.data.recorded_at_utc == \"2026-08-01T00:00:00.000Z\" — the client-supplied 2020 timestamp is ignored"
            - "response.data.case_version_after == 2 and GET /arbitration/cases/${case_id} returns version == 2"

      - name: sale_creation_with_an_unknown_light_channel_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.AuctionSale.fields.light_channel
          - validations[priority 4 ERR_INVALID_REQUEST]
        distinguishing_aspect: "light_channel \"AMBER\" is not a member of {GREEN, YELLOW, RED} so the sale is refused with 400 ERR_INVALID_REQUEST — the enum is closed, not free text."
        test_recipe:
          setup: ["One Seller and one Buyer exist."]
          setup_api_calls:
            - call: "POST /arbitration/sellers"
              payload: { name: "Ridgeline Motors", dealer_license_no: "SL-1001" }
              as: AuctionAdmin
              as_user_id: "admin-01"
              captures: { seller_id: $.data.id }
            - call: "POST /arbitration/buyers"
              payload: { name: "Harbor Auto Group", dealer_license_no: "BL-2001" }
              as: AuctionAdmin
              as_user_id: "admin-01"
              captures: { buyer_id: $.data.id }
          trigger:
            - call: "POST /arbitration/sales"
              payload: { vin: "1FTFW1E50JKE12345", seller_id: "${seller_id}", buyer_id: "${buyer_id}", sale_price_cents: 1450000, hammer_time_utc: "2026-08-01T00:00:00Z", announced_odometer_miles: 84000, light_channel: "AMBER", title_status: "CLEAN" }
              as: BlockClerk
              as_user_id: "clerk-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 and response.data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /arbitration/sales as AuctionAdmin returns meta.total_count == 0"

      - name: claim_evidence_rows_are_immutable_and_carry_no_version
        claim_type: immutability
        grounds:
          - entities.ClaimEvidence
          - endpoints[GET /arbitration/cases/{id}/evidence]
        distinguishing_aspect: "ClaimEvidence declares common_fields false, so its rows expose no version and no updated_at, §1.5 declares no update or delete route for them, and two posts of the same document_reference produce two distinct append-only rows."
        test_recipe:
          setup: ["A SUBMITTED MECHANICAL ArbitrationCase exists with no evidence."]
          setup_api_calls:
            - call: "POST /arbitration/sellers"
              payload: { name: "Ridgeline Motors", dealer_license_no: "SL-1001" }
              as: AuctionAdmin
              as_user_id: "admin-01"
              captures: { seller_id: $.data.id }
            - call: "POST /arbitration/buyers"
              payload: { name: "Harbor Auto Group", dealer_license_no: "BL-2001" }
              as: AuctionAdmin
              as_user_id: "admin-01"
              captures: { buyer_id: $.data.id }
            - call: "POST /arbitration/policies"
              payload: { defect_class: "MECHANICAL", window_hours: 48, mileage_limit: 250, min_claim_amount_cents: 60000, requires_third_party_verification: false, max_allowance_bps: 2000, psi_extension_hours: 96, psi_clean_waives_rights: true }
              as: AuctionAdmin
              as_user_id: "admin-01"
            - call: "POST /arbitration/sales"
              payload: { vin: "1FTFW1E50JKE12345", seller_id: "${seller_id}", buyer_id: "${buyer_id}", sale_price_cents: 1450000, hammer_time_utc: "2026-08-01T00:00:00Z", announced_odometer_miles: 84000, light_channel: "GREEN", title_status: "CLEAN" }
              as: BlockClerk
              as_user_id: "clerk-01"
              captures: { sale_id: $.data.id }
            - call: "POST /arbitration/cases"
              payload: { sale_id: "${sale_id}", defect_class: "MECHANICAL", claim_amount_cents: 60000, odometer_at_claim: 84100, complaint_text: "Transmission slips under load" }
              as: BuyerRep
              as_user_id: "${buyer_id}"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /arbitration/cases/${case_id}/evidence"
              payload: { evidence_type: "INSPECTION_REPORT", provider_name: "Statewide Vehicle Inspection", document_reference: "IR-77120", repair_estimate_cents: 285000 }
              as: BuyerRep
              as_user_id: "${buyer_id}"
              captures: { ev1_id: $.data.id }
            - call: "POST /arbitration/cases/${case_id}/evidence"
              payload: { evidence_type: "INSPECTION_REPORT", provider_name: "Statewide Vehicle Inspection", document_reference: "IR-77120", repair_estimate_cents: 285000 }
              as: BuyerRep
              as_user_id: "${buyer_id}"
              captures: { ev2_id: $.data.id }
          assert:
            - "both calls return HTTP 201 and ${ev1_id} != ${ev2_id} — evidence is append-only, not upserted"
            - "GET /arbitration/cases/${case_id}/evidence returns exactly 2 rows in created_at ASC order with case_version_after 2 then 3"
            - "no row in that response carries a version key and no row carries an updated_at key"
            - "§1.5 declares no PUT, PATCH or DELETE route under /arbitration/cases/{id}/evidence"

      - name: case_creation_against_an_unknown_sale_returns_sale_not_found
        claim_type: parent_relationships
        grounds:
          - entities.ArbitrationCase.fields.sale_id
          - validations[priority 13 ERR_SALE_NOT_FOUND]
        distinguishing_aspect: "A case whose sale_id is an unused UUID is refused with 404 ERR_SALE_NOT_FOUND before any policy, window or buyer check runs, and no case row is created."
        test_recipe:
          setup: ["One Buyer and the MECHANICAL policy exist; no AuctionSale exists at all."]
          setup_api_calls:
            - call: "POST /arbitration/buyers"
              payload: { name: "Harbor Auto Group", dealer_license_no: "BL-2001" }
              as: AuctionAdmin
              as_user_id: "admin-01"
              captures: { buyer_id: $.data.id }
            - call: "POST /arbitration/policies"
              payload: { defect_class: "MECHANICAL", window_hours: 48, mileage_limit: 250, min_claim_amount_cents: 60000, requires_third_party_verification: false, max_allowance_bps: 2000, psi_extension_hours: 96, psi_clean_waives_rights: true }
              as: AuctionAdmin
              as_user_id: "admin-01"
          trigger:
            - call: "POST /arbitration/cases"
              payload: { sale_id: "00000000-0000-4000-8000-0000000000aa", defect_class: "MECHANICAL", claim_amount_cents: 60000, odometer_at_claim: 84100, complaint_text: "Transmission slips under load" }
              as: BuyerRep
              as_user_id: "${buyer_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 and response.data.error_id == \"ERR_SALE_NOT_FOUND\""
