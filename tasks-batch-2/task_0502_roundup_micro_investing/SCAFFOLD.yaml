# =============================================================================
# Round-Up Micro-Investing & Robo-Advisor — Scaffold (SCAFFOLD.yaml)
# §1.0–§1.7 + preamble. Expert tier.
# =============================================================================

scenario: |
  502. Round-Up Micro-Investing & Robo-Advisor (Acorns/Stash style): linked-card round-up & multiplier,
  recurring + found-money brand rebates, risk-tiered model portfolio & auto-rebalance, custodial (UTMA)
  & IRA buckets, withdrawal & tax-lot selection, tiered subscription fee, referral bonus,
  sweep-to-invest threshold

domain_name: roundup-micro-investing
api_prefix: /
# Flat topology: each entity owns a top-level collection (/accounts, /buckets, /orders, ...),
# so the API has no single shared resource prefix; api_prefix is the root.

# -----------------------------------------------------------------------------
# Complexity Profile (§0.1–§0.4) — Expert band
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities (Account, LinkedCard, Bucket, Order, TaxLot, RoundUpAccrual,
  # FoundMoneyReward, Referral, SubscriptionPlan, ModelPortfolio, FoundMoneyOffer,
  # RecurringContribution, CashTransaction) linked by FK references, no deep URL nesting.

  state_machine_shape: parallel
  # Account carries TWO independent state dimensions (kyc_status × billing_status);
  # Order has a branching invest/withdraw lifecycle; Referral is cyclic-with-revert;
  # RoundUpAccrual has a swept/cancelled fork; Bucket aggregate state derives from children.

  relationship_patterns:
    - one_to_many        # Account -> Bucket, Account -> LinkedCard, Bucket -> Order, Order -> TaxLot
    - cross_aggregate    # FoundMoneyReward references FoundMoneyOffer (config); Referral references two Accounts

  role_model: peer_roles
  # Investor owns own Account + children; CustodialGuardian acts on UTMA buckets only;
  # PlatformAdmin manages config (offers, plans, portfolios) + operational sweeps; Anonymous registers.

  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: SubscriptionPlan
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: tier, type: enum, source: input, description: "LITE | PERSONAL | FAMILY", constraints: "unique per tier; one plan row per tier" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Flat monthly subscription fee in cents", constraints: ">= 0" }
      - { name: allows_custodial, type: boolean, source: input, description: "True if this tier may open UTMA buckets" }
      - { name: allows_ira, type: boolean, source: input, description: "True if this tier may open IRA buckets" }
      - { name: management_fee_bps, type: integer, source: input, description: "Annual AUM management fee in basis points charged on sweeps", constraints: "0..100" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED", default: ACTIVE }

  - name: ModelPortfolio
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: risk_tier, type: integer, source: input, description: "Risk tier 1 (conservative) .. 5 (aggressive)", constraints: "1..5; unique" }
      - { name: name, type: string, source: input, description: "Human-readable portfolio name" }
      - { name: target_allocation, type: object, source: input, description: "Map of asset_class -> target weight (integer percent); weights MUST sum to exactly 100" }
      - { name: drift_band_bps, type: integer, source: input, description: "Per-asset drift tolerance in bps before rebalance is required", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED", default: ACTIVE }

  - name: FoundMoneyOffer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: brand_name, type: string, source: input, description: "Partner brand name" }
      - { name: rebate_mode, type: enum, source: input, description: "PERCENT | FLAT — PERCENT rebates a fraction of spend, FLAT rebates a fixed amount" }
      - { name: rebate_percent_bps, type: integer, source: input, required: false, description: "Rebate rate in bps of qualifying spend (required when rebate_mode=PERCENT)", constraints: "0..10000" }
      - { name: rebate_flat_cents, type: integer, source: input, required: false, description: "Fixed rebate amount in cents (required when rebate_mode=FLAT)", constraints: ">= 0" }
      - { name: max_rebate_cents, type: integer, source: input, description: "Per-reward cap in cents on PERCENT rebates", constraints: ">= 0" }
      - { name: min_spend_cents, type: integer, source: input, description: "Minimum qualifying spend in cents to earn the rebate", constraints: ">= 0" }
      - { name: hold_days, type: integer, source: input, description: "Days a reward stays PENDING before it may be confirmed", constraints: ">= 0" }
      - { name: active_from, type: datetime, source: input, description: "Inclusive start of the offer's active window (ISO 8601 UTC)" }
      - { name: active_until, type: datetime, source: input, description: "Exclusive end of the offer's active window (half-open [active_from, active_until)); MUST be > active_from" }
      - { name: status, type: enum, source: system, description: "ACTIVE | PAUSED", default: ACTIVE }

  - name: Account
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: email, type: string, source: input, description: "Investor login email", constraints: "unique across Accounts" }
      - { name: full_name, type: string, source: input, description: "Account holder legal name" }
      - { name: plan_id, type: string, source: input, description: "FK -> SubscriptionPlan.id; chosen subscription tier" }
      - { name: model_portfolio_id, type: string, source: input, description: "FK -> ModelPortfolio.id; selected risk-tiered model portfolio" }
      - { name: kyc_status, type: enum, source: system, description: "PENDING_KYC | VERIFIED | RESTRICTED — identity dimension gating investing", default: PENDING_KYC }
      - { name: billing_status, type: enum, source: system, description: "TRIAL | ACTIVE | PAST_DUE | CLOSED — billing dimension; independent of kyc_status", default: TRIAL }
      - { name: cash_balance_cents, type: integer, source: computed, description: "Un-invested settled cash held for the account (sweep buffer); never negative" }
      - { name: pending_roundup_cents, type: integer, source: computed, description: "Sum of RoundUpAccrual.effective_amount_cents for accruals in PENDING state" }
      - { name: lifetime_invested_cents, type: integer, source: computed, description: "Cumulative settled invest-order principal across all buckets" }
      - { name: referral_credits_cents, type: integer, source: computed, description: "Cumulative referral bonus cash granted, conserved into cash_balance" }
      - { name: months_billed, type: integer, source: computed, description: "Count of CONFIRMED subscription-fee CashTransactions", default: 0 }
      - { name: sweep_threshold_cents, type: integer, source: input, description: "Cash buffer level at or above which a sweep auto-invests; >= 100", default: 500, constraints: ">= 100" }

  - name: LinkedCard
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; owning account" }
      - { name: last_four, type: string, source: input, description: "Last four digits of the funding card" }
      - { name: roundup_multiplier, type: integer, source: input, description: "Multiplier applied to each round-up (1,2,3,10)", default: 1, constraints: "one of {1,2,3,10}" }
      - { name: status, type: enum, source: system, description: "LINKED | PAUSED | UNLINKED", default: LINKED }

  - name: RoundUpAccrual
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; owning account" }
      - { name: linked_card_id, type: string, source: input, description: "FK -> LinkedCard.id; card whose transaction generated the round-up" }
      - { name: purchase_amount_cents, type: integer, source: input, description: "Raw purchase amount that produced the round-up", constraints: ">= 1" }
      - { name: base_roundup_cents, type: integer, source: computed, description: "ceil-to-dollar minus purchase amount; 0 when purchase is a whole dollar" }
      - { name: effective_amount_cents, type: integer, source: computed, description: "base_roundup_cents * card.roundup_multiplier captured at accrual time" }
      - { name: status, type: enum, source: system, description: "PENDING | SWEPT | CANCELLED", default: PENDING }

  - name: RecurringContribution
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; owning account" }
      - { name: amount_cents, type: integer, source: input, description: "Per-run contribution amount in cents", constraints: ">= 100" }
      - { name: cadence, type: enum, source: input, description: "DAILY | WEEKLY | MONTHLY" }
      - { name: run_day_index, type: integer, source: input, description: "Calendar day-of-cycle the run fires (0-based); collision uses a +/-1 inclusive buffer window on the same account", constraints: ">= 0" }
      - { name: next_run_at, type: datetime, source: system, description: "Logical clock instant of next scheduled run" }
      - { name: runs_completed, type: integer, source: computed, description: "Count of successful runs", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | PAUSED | CANCELLED", default: ACTIVE }

  - name: Bucket
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; owning account" }
      - { name: bucket_type, type: enum, source: input, description: "TAXABLE | UTMA | IRA" }
      - { name: beneficiary_name, type: string, source: input, required: false, description: "Minor beneficiary name; required when bucket_type=UTMA" }
      - { name: ytd_ira_contributed_cents, type: integer, source: computed, description: "Sum of settled invest-order principal in this IRA bucket within the current contribution year; only meaningful for IRA", default: 0 }
      - { name: invested_principal_cents, type: integer, source: computed, description: "Sum of remaining cost basis across OPEN TaxLots in this bucket" }
      - { name: market_value_cents, type: integer, source: computed, description: "Sum of OPEN TaxLot.market_value_cents in this bucket" }
      - { name: total_drift_bps, type: integer, source: computed, description: "Max absolute per-asset deviation from model target in bps" }
      - { name: needs_rebalance, type: boolean, source: computed, description: "True when total_drift_bps > model_portfolio.drift_band_bps", default: false }
      - { name: status, type: enum, source: system, description: "OPEN | FROZEN | CLOSED — FROZEN blocks new invest/withdraw orders", default: OPEN }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; owning account" }
      - { name: bucket_id, type: string, source: input, description: "FK -> Bucket.id; target bucket" }
      - { name: order_kind, type: enum, source: input, description: "INVEST | WITHDRAW" }
      - { name: source, type: enum, source: input, description: "SWEEP | RECURRING | FOUND_MONEY | REFERRAL | MANUAL — origin of an INVEST; MANUAL for WITHDRAW", default: MANUAL }
      - { name: requested_amount_cents, type: integer, source: input, description: "Requested principal (INVEST) or proceeds target (WITHDRAW) in cents", constraints: ">= 1" }
      - { name: lot_selection_method, type: enum, source: input, required: false, description: "FIFO | HIFO | SPEC_ID — tax-lot selection for WITHDRAW; required for WITHDRAW", default: FIFO }
      - { name: settled_amount_cents, type: integer, source: computed, description: "Actual settled principal (INVEST) or gross proceeds (WITHDRAW)" }
      - { name: realized_gain_cents, type: integer, source: computed, description: "Signed realized gain/loss across consumed lots on a settled WITHDRAW", default: 0 }
      - { name: management_fee_cents, type: integer, source: computed, description: "AUM management fee withheld on a settled INVEST", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | SETTLED | REJECTED | CANCELLED" }

  - name: TaxLot
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: bucket_id, type: string, source: input, description: "FK -> Bucket.id; owning bucket" }
      - { name: open_order_id, type: string, source: input, description: "FK -> Order.id; the settled INVEST order that opened this lot" }
      - { name: cost_basis_cents, type: integer, source: system, description: "Original cost basis of the lot at open", constraints: ">= 1" }
      - { name: remaining_basis_cents, type: integer, source: computed, description: "Cost basis still open after partial sells" }
      - { name: unit_gain_ratio_bps, type: integer, source: system, description: "Per-lot appreciation in bps used to derive market value (signed); defaults to 0 at open, set via POST /_lots/{id}/set_valuation", default: 0 }
      - { name: market_value_cents, type: integer, source: computed, description: "remaining_basis_cents adjusted by unit_gain_ratio_bps" }
      - { name: acquired_at, type: datetime, source: system, description: "Logical clock instant when the opening INVEST settled; FIFO/HIFO order key" }
      - { name: status, type: enum, source: system, description: "OPEN | DEPLETED", default: OPEN }

  - name: FoundMoneyReward
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; earning account" }
      - { name: offer_id, type: string, source: input, description: "FK -> FoundMoneyOffer.id; offer that produced this reward" }
      - { name: qualifying_spend_cents, type: integer, source: input, description: "Spend amount that triggered the reward", constraints: ">= 1" }
      - { name: rebate_amount_cents, type: integer, source: computed, description: "Computed rebate captured from the offer at earn time" }
      - { name: eligible_at, type: datetime, source: system, description: "Logical clock instant (earned_at + offer.hold_days) when reward may be confirmed" }
      - { name: status, type: enum, source: system, description: "PENDING | CONFIRMED | REVERSED", default: PENDING }

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: referrer_account_id, type: string, source: input, description: "FK -> Account.id; account that issued the referral" }
      - { name: referred_account_id, type: string, source: input, required: false, description: "FK -> Account.id; account that redeemed the code (set on redeem)" }
      - { name: code, type: string, source: input, description: "Referral code", constraints: "unique across Referrals" }
      - { name: bonus_cents, type: integer, source: input, description: "Bonus granted to each side on qualification", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "ISSUED | REDEEMED | QUALIFIED | EXPIRED | REVOKED", default: ISSUED }

  - name: CashTransaction
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; owning account" }
      - { name: tx_type, type: enum, source: input, description: "SUBSCRIPTION_FEE | MANAGEMENT_FEE | REFERRAL_BONUS | FOUND_MONEY | WITHDRAW_PROCEEDS | SWEEP_DEBIT | CONTRIBUTION_DEPOSIT" }
      - { name: amount_cents, type: integer, source: input, description: "Signed amount in cents (credit positive, debit negative)" }
      - { name: status, type: enum, source: system, description: "PENDING | CONFIRMED | VOID", default: PENDING }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---- Account.kyc_status (identity dimension) ----
  - entity: Account
    field: kyc_status
    initial_state: PENDING_KYC
    terminal_states: [RESTRICTED]
    transitions:
      - from: PENDING_KYC
        to: VERIFIED
        trigger: "POST /accounts/{id}/verify-kyc"
        actor: PlatformAdmin
        preconditions: ["account.kyc_status == PENDING_KYC"]
        side_effects:
          - "increments Account.version by 1"
        note: "Investing (invest orders & sweeps) requires kyc_status == VERIFIED."
      - from: PENDING_KYC
        to: RESTRICTED
        trigger: "POST /accounts/{id}/restrict"
        actor: PlatformAdmin
        preconditions: ["account.kyc_status IN {PENDING_KYC, VERIFIED}"]
        side_effects:
          - "sets every Bucket of the account whose status == OPEN to FROZEN (cascade down)"
          - "increments Account.version by 1"
      - from: VERIFIED
        to: RESTRICTED
        trigger: "POST /accounts/{id}/restrict"
        actor: PlatformAdmin
        preconditions: ["account.kyc_status IN {PENDING_KYC, VERIFIED}"]
        side_effects:
          - "sets every Bucket of the account whose status == OPEN to FROZEN (cascade down)"
          - "increments Account.version by 1"

  # ---- Account.billing_status (billing dimension, independent of kyc) ----
  - entity: Account
    field: billing_status
    initial_state: TRIAL
    terminal_states: [CLOSED]
    transitions:
      - from: TRIAL
        to: ACTIVE
        trigger: "POST /accounts/{id}/billing/charge-subscription"
        actor: PlatformAdmin
        preconditions: ["account.billing_status IN {TRIAL, ACTIVE}"]
        side_effects:
          - "runs subscription_fee_charge to compute fee_cents (first-cycle prorated when months_billed==0)"
          - "creates CashTransaction(tx_type=SUBSCRIPTION_FEE, amount = -fee_cents, status=CONFIRMED)"
          - "debits Account.cash_balance_cents by fee_cents (floored at 0; shortfall recorded)"
          - "increments Account.months_billed by 1"
          - "increments Account.version by 1"
        note: "Charging the monthly subscription fee. Billing dimension evolves independently of kyc_status. fee_cents is the subscription_fee_charge output, not necessarily the full monthly_fee_cents."
      - from: ACTIVE
        to: PAST_DUE
        trigger: "POST /accounts/{id}/billing/mark-past-due"
        actor: PlatformAdmin
        preconditions: ["account.billing_status == ACTIVE", "account.cash_balance_cents < plan.monthly_fee_cents"]
        side_effects:
          - "increments Account.version by 1"
      - from: PAST_DUE
        to: ACTIVE
        trigger: "POST /accounts/{id}/billing/charge-subscription"
        actor: PlatformAdmin
        preconditions: ["account.billing_status == PAST_DUE", "account.cash_balance_cents >= plan.monthly_fee_cents"]
        side_effects:
          - "runs subscription_fee_charge to compute fee_cents (months_billed>=1 here, so the full monthly_fee_cents applies)"
          - "creates CashTransaction(tx_type=SUBSCRIPTION_FEE, amount = -fee_cents, status=CONFIRMED)"
          - "debits Account.cash_balance_cents by fee_cents"
          - "increments Account.months_billed by 1"
          - "increments Account.version by 1"
      - from: TRIAL
        to: CLOSED
        trigger: "POST /accounts/{id}/close"
        actor: Investor
        preconditions: ["account.billing_status IN {TRIAL, ACTIVE, PAST_DUE}", "every Bucket of the account has status IN {CLOSED}"]
        side_effects:
          - "sets RecurringContribution rows of the account whose status == ACTIVE to CANCELLED (cascade down)"
          - "increments Account.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /accounts/{id}/close"
        actor: Investor
        preconditions: ["account.billing_status IN {TRIAL, ACTIVE, PAST_DUE}", "every Bucket of the account has status IN {CLOSED}"]
        side_effects:
          - "sets RecurringContribution rows of the account whose status == ACTIVE to CANCELLED (cascade down)"
          - "increments Account.version by 1"
      - from: PAST_DUE
        to: CLOSED
        trigger: "POST /accounts/{id}/close"
        actor: Investor
        preconditions: ["account.billing_status IN {TRIAL, ACTIVE, PAST_DUE}", "every Bucket of the account has status IN {CLOSED}"]
        side_effects:
          - "sets RecurringContribution rows of the account whose status == ACTIVE to CANCELLED (cascade down)"
          - "increments Account.version by 1"

  # ---- RoundUpAccrual (fork: swept vs cancelled) ----
  - entity: RoundUpAccrual
    field: status
    initial_state: PENDING
    terminal_states: [SWEPT, CANCELLED]
    transitions:
      - from: PENDING
        to: SWEPT
        trigger: "system: included in POST /accounts/{id}/sweep"
        actor: system
        preconditions: ["accrual.status == PENDING", "owning Account.kyc_status == VERIFIED"]
        side_effects:
          - "credits Account.cash_balance_cents by accrual.effective_amount_cents"
          - "decrements Account.pending_roundup_cents by accrual.effective_amount_cents (derived recompute)"
        note: "Sweep moves PENDING round-ups into cash, then may trigger a threshold INVEST order."
      - from: PENDING
        to: CANCELLED
        trigger: "POST /roundup-accruals/{id}/cancel"
        actor: Investor
        preconditions: ["accrual.status == PENDING"]
        side_effects:
          - "decrements Account.pending_roundup_cents by accrual.effective_amount_cents (derived recompute)"

  # ---- Order (branching: INVEST vs WITHDRAW; with revert/reject) ----
  - entity: Order
    field: status
    initial_state: DRAFT
    terminal_states: [SETTLED, REJECTED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /orders/{id}/submit"
        actor: Investor
        preconditions:
          - "order.status == DRAFT"
          - "target Bucket.status == OPEN"
          - "owning Account.kyc_status == VERIFIED"
        side_effects:
          - "increments Order.version by 1"
      - from: SUBMITTED
        to: SETTLED
        trigger: "POST /orders/{id}/settle"
        actor: PlatformAdmin
        preconditions:
          - "order.status == SUBMITTED"
          - "target Bucket.status == OPEN"
          - "for WITHDRAW: sum of selected OPEN TaxLot.remaining_basis_cents in bucket >= order proceeds requirement"
          - "for INVEST: owning Account.cash_balance_cents >= order.requested_amount_cents"
        side_effects:
          - "INVEST: runs invest_settlement (debits cash, withholds management_fee_cents, opens a TaxLot, increments lifetime_invested_cents, increments IRA ytd if IRA)"
          - "WITHDRAW: runs withdraw_settlement (consumes TaxLots per lot_selection_method, computes realized_gain_cents, credits proceeds via CashTransaction, depletes lots)"
          - "recomputes Bucket.invested_principal_cents, market_value_cents, total_drift_bps, needs_rebalance"
          - "increments Order.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /orders/{id}/reject"
        actor: PlatformAdmin
        preconditions: ["order.status == SUBMITTED"]
        side_effects:
          - "increments Order.version by 1"
        note: "Compensation-free reject: a SUBMITTED order holds no funds, so no ledger is reversed."
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Investor
        preconditions: ["order.status == DRAFT"]
        side_effects:
          - "increments Order.version by 1"

  # ---- FoundMoneyReward (fork: confirmed vs reversed) ----
  - entity: FoundMoneyReward
    field: status
    initial_state: PENDING
    terminal_states: [CONFIRMED, REVERSED]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /found-money-rewards/{id}/confirm"
        actor: PlatformAdmin
        preconditions:
          - "reward.status == PENDING"
          - "current logical clock >= reward.eligible_at"
          - "owning Account.kyc_status == VERIFIED"
        side_effects:
          - "credits Account.cash_balance_cents by reward.rebate_amount_cents"
          - "creates CashTransaction(tx_type=FOUND_MONEY, amount = +reward.rebate_amount_cents, status=CONFIRMED)"
        note: "Confirmed found-money is conserved: the credit to cash equals the CashTransaction amount equals rebate_amount_cents."
      - from: PENDING
        to: REVERSED
        trigger: "POST /found-money-rewards/{id}/reverse"
        actor: PlatformAdmin
        preconditions: ["reward.status == PENDING"]
        side_effects: []

  # ---- Referral (cyclic-with-revert: ISSUED -> REDEEMED -> QUALIFIED, REDEEMED -> ISSUED on revoke-back) ----
  - entity: Referral
    field: status
    initial_state: ISSUED
    terminal_states: [QUALIFIED, EXPIRED, REVOKED]
    transitions:
      - from: ISSUED
        to: REDEEMED
        trigger: "POST /referrals/{id}/redeem"
        actor: Investor
        preconditions:
          - "referral.status == ISSUED"
          - "redeeming Account.id != referral.referrer_account_id"
          - "current logical clock < referral.created_at + 30 days"
        side_effects:
          - "sets Referral.referred_account_id to the redeeming account"
      - from: REDEEMED
        to: ISSUED
        trigger: "POST /referrals/{id}/release-redemption"
        actor: Investor
        preconditions: ["referral.status == REDEEMED"]
        side_effects:
          - "clears Referral.referred_account_id to null"
        note: "Cycle edge: a redeemer who has not yet qualified can release back to ISSUED for re-redemption by another account."
      - from: REDEEMED
        to: QUALIFIED
        trigger: "POST /referrals/{id}/qualify"
        actor: PlatformAdmin
        preconditions:
          - "referral.status == REDEEMED"
          - "referred Account.lifetime_invested_cents >= 500"
        side_effects:
          - "credits referrer Account.cash_balance_cents by referral.bonus_cents"
          - "credits referred Account.cash_balance_cents by referral.bonus_cents"
          - "increments referrer Account.referral_credits_cents by referral.bonus_cents (derived)"
          - "increments referred Account.referral_credits_cents by referral.bonus_cents (derived)"
          - "creates two CashTransaction(tx_type=REFERRAL_BONUS, amount = +bonus_cents, status=CONFIRMED), one per side"
      - from: ISSUED
        to: EXPIRED
        trigger: "POST /referrals/{id}/expire"
        actor: PlatformAdmin
        preconditions: ["referral.status == ISSUED", "current logical clock >= referral.created_at + 30 days"]
        side_effects: []
      - from: ISSUED
        to: REVOKED
        trigger: "POST /referrals/{id}/revoke"
        actor: Investor
        preconditions: ["referral.status == ISSUED", "actor account == referral.referrer_account_id"]
        side_effects: []

  # ---- Bucket (compound: aggregate derived from children TaxLots; manual freeze/close) ----
  - entity: Bucket
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: FROZEN
        trigger: "POST /buckets/{id}/freeze (or cascade from Account restrict)"
        actor: PlatformAdmin
        preconditions: ["bucket.status == OPEN"]
        side_effects:
          - "increments Bucket.version by 1"
      - from: FROZEN
        to: OPEN
        trigger: "POST /buckets/{id}/unfreeze"
        actor: PlatformAdmin
        preconditions: ["bucket.status == FROZEN", "owning Account.kyc_status == VERIFIED"]
        side_effects:
          - "increments Bucket.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /buckets/{id}/close"
        actor: Investor
        preconditions: ["bucket.status == OPEN", "bucket has no TaxLot with status == OPEN", "bucket has no Order with status IN {DRAFT, SUBMITTED}"]
        side_effects:
          - "increments Bucket.version by 1"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on parent version — sequential, deterministic)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: order-submit-stale-bucket
    parent_entity: Bucket
    write_endpoint: "POST /orders/{id}/submit"
    occ_field: "expected_bucket_version"
    description: |
      Submitting an Order against a Bucket whose version has advanced since the
      client last observed it is rejected. A prior submit/settle/freeze on the
      same bucket legitimately advanced the bucket version, so the current
      submitter's view of the bucket is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: sweep-stale-account
    parent_entity: Account
    write_endpoint: "POST /accounts/{id}/sweep"
    occ_field: "expected_account_version"
    description: |
      Running a sweep against an Account whose version has advanced since the
      client last observed it is rejected. A prior sweep or fee charge that
      mutated cash_balance_cents advanced the account version, making the
      caller's view of available cash stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # --- (1) Round-up effective amount: combinatorial mode (a) — nested ceil + multiplier + whole-dollar branch ---
  - name: roundup_effective_amount
    trigger: "POST /roundup-accruals (accrual creation)"
    algorithm: threshold
    formula: |
      base_roundup_cents = (100 - (purchase_amount_cents mod 100)) mod 100
      # whole-dollar purchases (purchase_amount_cents mod 100 == 0) yield base_roundup_cents == 0
      effective_amount_cents = base_roundup_cents * card.roundup_multiplier
      # card.roundup_multiplier and base computed once at accrual time, then frozen on the row
    input_set: "Single RoundUpAccrual; multiplier read from the referenced LinkedCard at creation"
    constants: {}
    precision: "integer cents; no rounding (modular arithmetic)"
    variants:
      - name: whole_dollar_no_roundup
        when: "purchase_amount_cents is an exact multiple of 100"
        difference: "base_roundup_cents == 0, so effective_amount_cents == 0 regardless of multiplier"

  # --- (2) Subscription billing: dual-variant on Account (TRIAL pro-rate vs flat) ---
  - name: subscription_fee_charge
    trigger: "billing.charge-subscription transition (Account.billing_status)"
    algorithm: tiered_pricing
    formula: |
      fee_cents = plan.monthly_fee_cents
      # FULL variant (steady-state ACTIVE/PAST_DUE): charge the entire plan fee.
      # FIRST_CYCLE variant (the FIRST charge out of TRIAL): half-month proration.
      if account.months_billed == 0:   # first ever charge (leaving TRIAL)
          fee_cents = ceil(plan.monthly_fee_cents / 2)
    input_set: "Single Account + its SubscriptionPlan; months_billed read before increment"
    constants: { FIRST_CYCLE_NUMERATOR: 1, FIRST_CYCLE_DENOMINATOR: 2 }
    precision: "integer cents, ceil on the half-month proration"
    variants:
      - name: first_cycle_prorated
        when: "account.months_billed == 0 at charge time (first charge leaving TRIAL)"
        difference: "fee = ceil(monthly_fee_cents / 2) instead of the full monthly_fee_cents"
      - name: steady_state_full
        when: "account.months_billed >= 1"
        difference: "fee = full monthly_fee_cents"

  # --- (3) Invest settlement: combinatorial mode (c) — pinned eval order, fee keyed on net, opens lot ---
  - name: invest_settlement
    trigger: "Order SUBMITTED->SETTLED transition where order_kind == INVEST"
    algorithm: aggregation
    formula: |
      # Evaluation order is PINNED and load-bearing:
      # 1) gross = order.requested_amount_cents
      # 2) management_fee_cents = floor(gross * plan.management_fee_bps / 10000)
      # 3) net_principal = gross - management_fee_cents
      # 4) settled_amount_cents = net_principal
      # 5) open TaxLot with cost_basis_cents = net_principal, remaining_basis_cents = net_principal
      # 6) debit Account.cash_balance_cents by gross (full gross leaves cash; fee is withheld to the platform)
      # 7) Account.lifetime_invested_cents += net_principal
      # 8) if bucket_type == IRA: Bucket.ytd_ira_contributed_cents += net_principal
      management_fee_cents = floor(gross * plan.management_fee_bps / 10000)
      net_principal = gross - management_fee_cents
    input_set: "Single INVEST Order, its Bucket, owning Account, Account.plan"
    constants: { BPS_DENOMINATOR: 10000, IRA_ANNUAL_CAP_CENTS: 700000 }
    precision: "integer cents, floor on the fee"
    variants:
      - name: ira_contribution_tracked
        when: "bucket_type == IRA"
        difference: "net_principal additionally accumulates into Bucket.ytd_ira_contributed_cents (subject to IRA annual cap validation)"

  # --- (4) Withdraw settlement: DUAL-VARIANT on Order (FIFO vs HIFO) + realized gain (different domain from #2) ---
  - name: withdraw_settlement
    trigger: "Order SUBMITTED->SETTLED transition where order_kind == WITHDRAW"
    algorithm: chronological
    formula: |
      target = order.requested_amount_cents          # gross proceeds target (in market value)
      remaining = target
      proceeds = 0
      realized_gain = 0
      lots = OPEN TaxLots in bucket ordered by lot_selection_method:
        FIFO   -> acquired_at ASC, then created_at ASC
        HIFO   -> unit_gain_ratio_bps DESC, then acquired_at ASC, then created_at ASC
        SPEC_ID-> the explicit lot id list in order.requested order (must be supplied); else acquired_at ASC
      for lot in lots while remaining > 0:
        lot_mv = lot.remaining_basis_cents * (10000 + lot.unit_gain_ratio_bps) / 10000   # floor
        take_mv = min(lot_mv, remaining)
        # basis consumed is proportional to the market value taken from the lot:
        basis_consumed = floor(lot.remaining_basis_cents * take_mv / lot_mv)   # lot_mv > 0
        realized_gain += (take_mv - basis_consumed)
        lot.remaining_basis_cents -= basis_consumed
        if lot.remaining_basis_cents == 0: lot.status = DEPLETED
        proceeds += take_mv
        remaining -= take_mv
      settled_amount_cents = proceeds         # gross proceeds actually realized (may be < target if lots run out -> handled by precondition)
      realized_gain_cents = realized_gain
      credit Account.cash_balance_cents by proceeds via CashTransaction(WITHDRAW_PROCEEDS)
    input_set: "OPEN TaxLots of the bucket; processing order set by lot_selection_method"
    constants: { BPS_DENOMINATOR: 10000 }
    precision: "integer cents, floor per-lot market value and per-lot basis_consumed (round per-lot, then sum)"
    variants:
      - name: fifo_selection
        when: "lot_selection_method == FIFO"
        difference: "lots consumed oldest acquired_at first; realized gain reflects oldest cost basis"
      - name: hifo_selection
        when: "lot_selection_method == HIFO"
        difference: "lots consumed highest unit_gain_ratio_bps first; minimizes realized gain vs FIFO on identical inventory"

  # --- (5) Found-money rebate: combinatorial mode (a) — branch on mode, min-spend gate, percent-with-cap ---
  - name: found_money_rebate
    trigger: "POST /found-money-rewards (reward creation)"
    algorithm: threshold
    formula: |
      if qualifying_spend_cents < offer.min_spend_cents: REJECT (ERR_MIN_SPEND_NOT_MET)
      if offer.rebate_mode == FLAT:
          rebate_amount_cents = offer.rebate_flat_cents
      else:  # PERCENT
          raw = floor(qualifying_spend_cents * offer.rebate_percent_bps / 10000)
          rebate_amount_cents = min(raw, offer.max_rebate_cents)
      eligible_at = current_logical_clock + offer.hold_days days
    input_set: "Single FoundMoneyReward + its FoundMoneyOffer config"
    constants: { BPS_DENOMINATOR: 10000 }
    precision: "integer cents, floor on the percent rebate before the cap"
    variants:
      - name: percent_capped
        when: "rebate_mode == PERCENT and floor(spend*bps/10000) > max_rebate_cents"
        difference: "rebate clamps to max_rebate_cents (the cap binds)"
      - name: flat_rebate
        when: "rebate_mode == FLAT"
        difference: "rebate is the fixed rebate_flat_cents, independent of spend (min_spend still gates)"

  # --- (6) Sweep + threshold auto-invest: combinatorial mode (b) — round-then-sum vs sum-then-round pinned ---
  - name: sweep_and_threshold_invest
    trigger: "POST /accounts/{id}/sweep"
    algorithm: threshold
    formula: |
      # Step A — gather: all RoundUpAccrual with status==PENDING for the account.
      # Per the PINNED rounding order, the swept total is the SUM of each accrual's
      # already-frozen effective_amount_cents (round-per-accrual at accrual time, THEN sum here).
      # We do NOT re-derive from raw purchase amounts and round once.
      swept_total = sum(accrual.effective_amount_cents for accrual in PENDING accruals)   # each already an integer
      set those accruals to SWEPT; Account.cash_balance_cents += swept_total
      # Step B — threshold: if post-sweep cash >= account.sweep_threshold_cents, auto-create a SETTLED
      # INVEST Order (source=SWEEP) into the account's primary TAXABLE bucket for the WHOLE cash balance.
      if Account.cash_balance_cents >= account.sweep_threshold_cents:
          invest_amount = Account.cash_balance_cents
          create + settle INVEST Order(source=SWEEP, requested_amount_cents=invest_amount) via invest_settlement
    input_set: "PENDING RoundUpAccrual rows of the account; threshold from Account.sweep_threshold_cents"
    constants: {}
    precision: "integer cents; pinned order is round-per-accrual then sum (NOT sum-of-raw then round)"
    variants:
      - name: below_threshold_no_invest
        when: "post-sweep cash_balance_cents < sweep_threshold_cents"
        difference: "cash is swept but no INVEST order is created; cash sits in the buffer"
      - name: at_or_above_threshold_invest
        when: "post-sweep cash_balance_cents >= sweep_threshold_cents (>= is inclusive)"
        difference: "an INVEST order for the entire cash balance is auto-created and settled"

  # --- (7) Portfolio drift: weighted scoring over lots, drives needs_rebalance threshold ---
  - name: bucket_drift
    trigger: "recomputed on any TaxLot open/deplete in the bucket (INVEST/WITHDRAW settle)"
    algorithm: weighted_scoring
    formula: |
      total_mv = sum(OPEN TaxLot.market_value_cents in bucket)
      if total_mv == 0: total_drift_bps = 0; needs_rebalance = false
      else:
        for each asset_class in model.target_allocation:
            actual_weight_bps = floor( asset_mv * 10000 / total_mv )     # asset_mv = OPEN lots tagged to class
            target_bps = model.target_allocation[asset_class] * 100
            drift = abs(actual_weight_bps - target_bps)
        total_drift_bps = max(drift over asset classes)
        needs_rebalance = (total_drift_bps > model.drift_band_bps)       # strict >
    input_set: "OPEN TaxLots of the bucket grouped by asset class; model.target_allocation"
    constants: { BPS_DENOMINATOR: 10000 }
    precision: "integer bps, floor per-asset weight"
    variants:
      - name: empty_bucket_zero_drift
        when: "bucket has no OPEN TaxLot (total_mv == 0)"
        difference: "total_drift_bps == 0 and needs_rebalance == false by definition (empty-set edge)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and (for entity_backed roles) X-User-ID headers present", error_id: ERR_MISSING_AUTH, http_status: 401, applies_to: "all except POST /accounts/register and config GETs" }
  - { priority: 2, category: auth, check: "X-User-Role is a role permitted for this endpoint per §1.7", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Investor/CustodialGuardian acting on a resource must own the owning Account (X-User-ID == resource.account_id)", error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, applies_to: "all owner-scoped writes" }
  - { priority: 4, category: existence, check: "Every path/body id resolves to an existing resource, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: business_constraint, check: "Required body fields present and well-typed; enums within domain", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all writes" }
  - { priority: 6, category: business_constraint, check: "Pagination limit in [1,100], offset >= 0", error_id: ERR_INVALID_PAGINATION, http_status: 400, applies_to: "all list endpoints" }
  - { priority: 7, category: state, check: "Target resource is in a valid state for the requested transition", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all state transitions" }
  - { priority: 8, category: business_referential, check: "CustodialGuardian may only act on buckets with bucket_type == UTMA; Investor may not invest into another holder's bucket", error_id: ERR_BUCKET_TYPE_NOT_PERMITTED, http_status: 403, applies_to: "UTMA bucket writes" }
  - { priority: 9, category: business_safety, check: "Account.kyc_status must be VERIFIED before invest orders, sweeps, found-money confirms (compliance gate)", error_id: ERR_KYC_NOT_VERIFIED, http_status: 409, applies_to: "POST /orders/{id}/submit (INVEST), POST /accounts/{id}/sweep, POST /found-money-rewards/{id}/confirm" }
  - { priority: 10, category: business_referential, check: "Bucket of type the plan does not allow cannot be opened (allows_custodial / allows_ira)", error_id: ERR_BUCKET_NOT_ALLOWED_BY_PLAN, http_status: 409, applies_to: "POST /buckets" }
  - { priority: 11, category: business_referential, check: "UTMA bucket requires beneficiary_name", error_id: ERR_BENEFICIARY_REQUIRED, http_status: 400, applies_to: "POST /buckets" }
  - { priority: 12, category: business_temporal, check: "Found-money reward cannot be confirmed before reward.eligible_at (hold period)", error_id: ERR_HOLD_PERIOD_ACTIVE, http_status: 409, applies_to: "POST /found-money-rewards/{id}/confirm" }
  - { priority: 13, category: business_temporal, check: "Referral cannot be redeemed after 30-day window; expire requires window elapsed", error_id: ERR_REFERRAL_WINDOW, http_status: 409, applies_to: "POST /referrals/{id}/redeem, POST /referrals/{id}/expire" }
  - { priority: 14, category: business_constraint, check: "Referral self-redemption forbidden (redeemer != referrer)", error_id: ERR_SELF_REFERRAL, http_status: 409, applies_to: "POST /referrals/{id}/redeem" }
  - { priority: 15, category: business_constraint, check: "Found-money qualifying_spend_cents >= offer.min_spend_cents", error_id: ERR_MIN_SPEND_NOT_MET, http_status: 409, applies_to: "POST /found-money-rewards" }
  - { priority: 16, category: business_fiscal, check: "INVEST settle requires Account.cash_balance_cents >= requested_amount_cents", error_id: ERR_INSUFFICIENT_CASH, http_status: 409, applies_to: "POST /orders/{id}/settle (INVEST)" }
  - { priority: 17, category: business_fiscal, check: "WITHDRAW settle requires selected OPEN lot market value >= requested proceeds", error_id: ERR_INSUFFICIENT_LOTS, http_status: 409, applies_to: "POST /orders/{id}/settle (WITHDRAW)" }
  - { priority: 18, category: business_fiscal, check: "IRA bucket annual contribution cap: ytd_ira_contributed_cents + net_principal must not exceed IRA_ANNUAL_CAP_CENTS = 700000 ($7,000)", error_id: ERR_IRA_CAP_EXCEEDED, http_status: 409, applies_to: "POST /orders/{id}/settle (INVEST into IRA)" }
  - { priority: 19, category: business_constraint, check: "roundup_multiplier must be one of {1,2,3,10}", error_id: ERR_INVALID_MULTIPLIER, http_status: 400, applies_to: "POST /linked-cards, PATCH /linked-cards/{id}" }
  - { priority: 20, category: business_constraint, check: "ModelPortfolio target_allocation weights must sum to exactly 100", error_id: ERR_ALLOCATION_SUM, http_status: 400, applies_to: "POST /model-portfolios" }
  - { priority: 21, category: state, check: "OCC: expected_<parent>_version must equal the live parent version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /orders/{id}/submit, POST /accounts/{id}/sweep" }
  - { priority: 22, category: business_constraint, check: "Cannot close a Bucket with OPEN TaxLots or non-terminal Orders", error_id: ERR_BUCKET_NOT_EMPTY, http_status: 409, applies_to: "POST /buckets/{id}/close" }
  - { priority: 23, category: business_constraint, check: "Cannot close an Account with any non-CLOSED Bucket", error_id: ERR_ACCOUNT_HAS_OPEN_BUCKETS, http_status: 409, applies_to: "POST /accounts/{id}/close" }
  - { priority: 24, category: business_temporal, check: "New FoundMoneyOffer's half-open window [active_from, active_until) must not overlap any existing ACTIVE offer of the same brand_name; touching at a boundary (one's active_until == other's active_from) is allowed (half-open semantics)", error_id: ERR_OFFER_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /found-money-offers" }
  - { priority: 25, category: business_temporal, check: "New ACTIVE RecurringContribution's run_day_index must not fall within +/-1 inclusive buffer of any existing ACTIVE contribution's run_day_index on the same account (closed buffered interval [d-1, d+1])", error_id: ERR_CONTRIBUTION_DAY_COLLISION, http_status: 409, applies_to: "POST /recurring-contributions" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- Config: SubscriptionPlan ----
  - { method: POST, path: "/subscription-plans", description: "Create a subscription plan tier", roles: [PlatformAdmin], code: 201, input: [tier, monthly_fee_cents, allows_custodial, allows_ira, management_fee_bps], output: SubscriptionPlan, side_effects: [] }
  - { method: GET, path: "/subscription-plans/{id}", description: "Read a subscription plan", roles: [PlatformAdmin, Investor, CustodialGuardian], code: 200, input: [], output: SubscriptionPlan, side_effects: [] }

  # ---- Config: ModelPortfolio ----
  - { method: POST, path: "/model-portfolios", description: "Create a risk-tiered model portfolio", roles: [PlatformAdmin], code: 201, input: [risk_tier, name, target_allocation, drift_band_bps], output: ModelPortfolio, side_effects: ["validates target_allocation sums to 100"] }
  - { method: GET, path: "/model-portfolios/{id}", description: "Read a model portfolio", roles: [PlatformAdmin, Investor, CustodialGuardian], code: 200, input: [], output: ModelPortfolio, side_effects: [] }

  # ---- Config: FoundMoneyOffer ----
  - { method: POST, path: "/found-money-offers", description: "Create a found-money brand offer with a half-open active window", roles: [PlatformAdmin], code: 201, input: [brand_name, rebate_mode, "rebate_percent_bps?", "rebate_flat_cents?", max_rebate_cents, min_spend_cents, hold_days, active_from, active_until], output: FoundMoneyOffer, side_effects: ["rejects overlap with another ACTIVE offer of the same brand_name"] }
  - { method: GET, path: "/found-money-offers/{id}", description: "Read a found-money offer", roles: [PlatformAdmin, Investor, CustodialGuardian], code: 200, input: [], output: FoundMoneyOffer, side_effects: [] }

  # ---- Account ----
  - { method: POST, path: "/accounts/register", description: "Register a new investor account (Anonymous); creates Account in PENDING_KYC/TRIAL", roles: [Anonymous], code: 201, input: [email, full_name, plan_id, model_portfolio_id, "sweep_threshold_cents?"], output: Account, side_effects: ["Account.kyc_status=PENDING_KYC, billing_status=TRIAL, cash_balance_cents=0"] }
  - { method: GET, path: "/accounts/{id}", description: "Read an account (with computed balances)", roles: [PlatformAdmin, Investor, CustodialGuardian], code: 200, input: [], output: Account, side_effects: [] }
  - { method: GET, path: "/accounts", description: "List accounts (admin; filter by plan_id/model_portfolio_id — reverse-reachability for Account.plan_id and Account.model_portfolio_id)", roles: [PlatformAdmin], code: 200, input: ["plan_id?", "model_portfolio_id?", "kyc_status?", "billing_status?", "limit?", "offset?"], output: "Account[]", side_effects: [] }
  - { method: POST, path: "/accounts/{id}/verify-kyc", description: "Mark KYC verified", roles: [PlatformAdmin], code: 200, input: [], output: Account, side_effects: ["kyc_status PENDING_KYC->VERIFIED", "increments Account.version"] }
  - { method: POST, path: "/accounts/{id}/restrict", description: "Restrict account; cascade-freeze OPEN buckets", roles: [PlatformAdmin], code: 200, input: [], output: Account, side_effects: ["kyc_status->RESTRICTED", "freezes OPEN buckets (cascade)", "increments Account.version"] }
  - { method: POST, path: "/accounts/{id}/billing/charge-subscription", description: "Charge monthly subscription fee", roles: [PlatformAdmin], code: 200, input: [], output: Account, side_effects: ["subscription_fee_charge", "creates SUBSCRIPTION_FEE CashTransaction", "debits cash", "increments months_billed", "billing_status TRIAL/PAST_DUE->ACTIVE", "increments Account.version"] }
  - { method: POST, path: "/accounts/{id}/billing/mark-past-due", description: "Flag account past due", roles: [PlatformAdmin], code: 200, input: [], output: Account, side_effects: ["billing_status ACTIVE->PAST_DUE", "increments Account.version"] }
  - { method: POST, path: "/accounts/{id}/sweep", description: "Sweep PENDING round-ups to cash; auto-invest above threshold (OCC on account version)", roles: [PlatformAdmin, Investor], code: 200, input: [expected_account_version], output: Account, side_effects: ["sweep_and_threshold_invest", "accruals PENDING->SWEPT", "may auto-create+settle SWEEP INVEST Order", "increments Account.version"] }
  - { method: POST, path: "/accounts/{id}/close", description: "Close account (requires all buckets CLOSED)", roles: [Investor], code: 200, input: [], output: Account, side_effects: ["billing_status->CLOSED", "cancels ACTIVE recurring contributions (cascade)", "increments Account.version"] }
  - { method: GET, path: "/accounts/{id}/cash-transactions", description: "List cash transactions for an account (reverse-reachability for CashTransaction.account_id)", roles: [PlatformAdmin, Investor, CustodialGuardian], code: 200, input: ["tx_type?", "status?", "limit?", "offset?"], output: "CashTransaction[]", side_effects: [] }

  # ---- LinkedCard ----
  - { method: POST, path: "/linked-cards", description: "Link a funding card with a round-up multiplier", roles: [Investor], code: 201, input: [account_id, last_four, "roundup_multiplier?"], output: LinkedCard, side_effects: [] }
  - { method: GET, path: "/linked-cards/{id}", description: "Read a linked card", roles: [PlatformAdmin, Investor], code: 200, input: [], output: LinkedCard, side_effects: [] }
  - { method: GET, path: "/linked-cards", description: "List linked cards (filter by account_id)", roles: [PlatformAdmin, Investor], code: 200, input: ["account_id?", "status?", "limit?", "offset?"], output: "LinkedCard[]", side_effects: [] }
  - { method: PATCH, path: "/linked-cards/{id}", description: "Update multiplier or pause/unlink a card", roles: [Investor], code: 200, input: ["roundup_multiplier?", "status?"], output: LinkedCard, side_effects: [] }

  # ---- RoundUpAccrual ----
  - { method: POST, path: "/roundup-accruals", description: "Record a card purchase round-up accrual (PENDING)", roles: [Investor], code: 201, input: [account_id, linked_card_id, purchase_amount_cents], output: RoundUpAccrual, side_effects: ["roundup_effective_amount", "increments Account.pending_roundup_cents"] }
  - { method: GET, path: "/roundup-accruals/{id}", description: "Read a round-up accrual", roles: [PlatformAdmin, Investor], code: 200, input: [], output: RoundUpAccrual, side_effects: [] }
  - { method: GET, path: "/roundup-accruals", description: "List round-up accruals (filter by account_id, linked_card_id, status)", roles: [PlatformAdmin, Investor], code: 200, input: ["account_id?", "linked_card_id?", "status?", "limit?", "offset?"], output: "RoundUpAccrual[]", side_effects: [] }
  - { method: POST, path: "/roundup-accruals/{id}/cancel", description: "Cancel a PENDING accrual", roles: [Investor], code: 200, input: [], output: RoundUpAccrual, side_effects: ["status PENDING->CANCELLED", "decrements Account.pending_roundup_cents"] }

  # ---- RecurringContribution ----
  - { method: POST, path: "/recurring-contributions", description: "Create a recurring contribution schedule", roles: [Investor], code: 201, input: [account_id, amount_cents, cadence, run_day_index], output: RecurringContribution, side_effects: ["sets next_run_at from current clock + cadence", "rejects collision with another ACTIVE contribution on the same account within +/-1 day buffer of run_day_index"] }
  - { method: GET, path: "/recurring-contributions/{id}", description: "Read a recurring contribution", roles: [PlatformAdmin, Investor], code: 200, input: [], output: RecurringContribution, side_effects: [] }
  - { method: GET, path: "/recurring-contributions", description: "List recurring contributions (filter by account_id)", roles: [PlatformAdmin, Investor], code: 200, input: ["account_id?", "status?", "limit?", "offset?"], output: "RecurringContribution[]", side_effects: [] }
  - { method: POST, path: "/recurring-contributions/{id}/cancel", description: "Cancel a recurring contribution", roles: [Investor], code: 200, input: [], output: RecurringContribution, side_effects: ["status ACTIVE/PAUSED->CANCELLED"] }

  # ---- Bucket ----
  - { method: POST, path: "/buckets", description: "Open an investing bucket (TAXABLE/UTMA/IRA), gated by plan", roles: [Investor, CustodialGuardian], code: 201, input: [account_id, bucket_type, "beneficiary_name?"], output: Bucket, side_effects: ["status=OPEN"] }
  - { method: GET, path: "/buckets/{id}", description: "Read a bucket (with computed drift + valuations)", roles: [PlatformAdmin, Investor, CustodialGuardian], code: 200, input: [], output: Bucket, side_effects: [] }
  - { method: GET, path: "/buckets", description: "List buckets (filter by account_id, bucket_type)", roles: [PlatformAdmin, Investor, CustodialGuardian], code: 200, input: ["account_id?", "bucket_type?", "status?", "limit?", "offset?"], output: "Bucket[]", side_effects: [] }
  - { method: POST, path: "/buckets/{id}/freeze", description: "Freeze a bucket (block orders)", roles: [PlatformAdmin], code: 200, input: [], output: Bucket, side_effects: ["status OPEN->FROZEN", "increments Bucket.version"] }
  - { method: POST, path: "/buckets/{id}/unfreeze", description: "Unfreeze a bucket", roles: [PlatformAdmin], code: 200, input: [], output: Bucket, side_effects: ["status FROZEN->OPEN", "increments Bucket.version"] }
  - { method: POST, path: "/buckets/{id}/close", description: "Close an empty bucket", roles: [Investor, CustodialGuardian], code: 200, input: [], output: Bucket, side_effects: ["status OPEN->CLOSED", "increments Bucket.version"] }

  # ---- Order ----
  - { method: POST, path: "/orders", description: "Create a DRAFT invest/withdraw order", roles: [Investor, CustodialGuardian], code: 201, input: [account_id, bucket_id, order_kind, "source?", requested_amount_cents, "lot_selection_method?"], output: Order, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/orders/{id}", description: "Read an order", roles: [PlatformAdmin, Investor, CustodialGuardian], code: 200, input: [], output: Order, side_effects: [] }
  - { method: GET, path: "/orders", description: "List orders (filter by account_id, bucket_id, status)", roles: [PlatformAdmin, Investor, CustodialGuardian], code: 200, input: ["account_id?", "bucket_id?", "status?", "order_kind?", "limit?", "offset?"], output: "Order[]", side_effects: [] }
  - { method: POST, path: "/orders/{id}/submit", description: "Submit a DRAFT order (OCC on bucket version)", roles: [Investor, CustodialGuardian], code: 200, input: [expected_bucket_version], output: Order, side_effects: ["status DRAFT->SUBMITTED", "increments Order.version", "validates bucket OPEN, kyc VERIFIED"] }
  - { method: POST, path: "/orders/{id}/settle", description: "Settle a SUBMITTED order (invest/withdraw ledger + tax lots)", roles: [PlatformAdmin], code: 200, input: ["spec_lot_ids?"], output: Order, side_effects: ["invest_settlement OR withdraw_settlement", "opens/depletes TaxLots", "recomputes bucket drift", "status SUBMITTED->SETTLED", "increments Order.version"] }
  - { method: POST, path: "/orders/{id}/reject", description: "Reject a SUBMITTED order", roles: [PlatformAdmin], code: 200, input: [], output: Order, side_effects: ["status SUBMITTED->REJECTED", "increments Order.version"] }
  - { method: POST, path: "/orders/{id}/cancel", description: "Cancel a DRAFT order", roles: [Investor, CustodialGuardian], code: 200, input: [], output: Order, side_effects: ["status DRAFT->CANCELLED", "increments Order.version"] }

  # ---- TaxLot (reverse-reachability for TaxLot.bucket_id and TaxLot.open_order_id) ----
  - { method: GET, path: "/tax-lots/{id}", description: "Read a tax lot", roles: [PlatformAdmin, Investor, CustodialGuardian], code: 200, input: [], output: TaxLot, side_effects: [] }
  - { method: GET, path: "/tax-lots", description: "List tax lots (filter by bucket_id, open_order_id, status)", roles: [PlatformAdmin, Investor, CustodialGuardian], code: 200, input: ["bucket_id?", "open_order_id?", "status?", "limit?", "offset?"], output: "TaxLot[]", side_effects: [] }

  # ---- FoundMoneyReward ----
  - { method: POST, path: "/found-money-rewards", description: "Earn a found-money reward from an offer (PENDING)", roles: [Investor], code: 201, input: [account_id, offer_id, qualifying_spend_cents], output: FoundMoneyReward, side_effects: ["found_money_rebate", "sets eligible_at = clock + hold_days"] }
  - { method: GET, path: "/found-money-rewards/{id}", description: "Read a found-money reward", roles: [PlatformAdmin, Investor], code: 200, input: [], output: FoundMoneyReward, side_effects: [] }
  - { method: GET, path: "/found-money-rewards", description: "List found-money rewards (filter by account_id, offer_id, status)", roles: [PlatformAdmin, Investor], code: 200, input: ["account_id?", "offer_id?", "status?", "limit?", "offset?"], output: "FoundMoneyReward[]", side_effects: [] }
  - { method: POST, path: "/found-money-rewards/{id}/confirm", description: "Confirm a PENDING reward after hold (credits cash)", roles: [PlatformAdmin], code: 200, input: [], output: FoundMoneyReward, side_effects: ["status PENDING->CONFIRMED", "credits cash", "creates FOUND_MONEY CashTransaction"] }
  - { method: POST, path: "/found-money-rewards/{id}/reverse", description: "Reverse a PENDING reward", roles: [PlatformAdmin], code: 200, input: [], output: FoundMoneyReward, side_effects: ["status PENDING->REVERSED"] }

  # ---- Referral ----
  - { method: POST, path: "/referrals", description: "Issue a referral code", roles: [Investor], code: 201, input: [referrer_account_id, code, bonus_cents], output: Referral, side_effects: ["status=ISSUED"] }
  - { method: GET, path: "/referrals/{id}", description: "Read a referral", roles: [PlatformAdmin, Investor], code: 200, input: [], output: Referral, side_effects: [] }
  - { method: GET, path: "/referrals", description: "List referrals (filter by referrer_account_id, referred_account_id, status)", roles: [PlatformAdmin, Investor], code: 200, input: ["referrer_account_id?", "referred_account_id?", "status?", "limit?", "offset?"], output: "Referral[]", side_effects: [] }
  - { method: POST, path: "/referrals/{id}/redeem", description: "Redeem a referral code as the referred account", roles: [Investor], code: 200, input: [referred_account_id], output: Referral, side_effects: ["status ISSUED->REDEEMED", "sets referred_account_id"] }
  - { method: POST, path: "/referrals/{id}/release-redemption", description: "Release a REDEEMED referral back to ISSUED", roles: [Investor], code: 200, input: [], output: Referral, side_effects: ["status REDEEMED->ISSUED", "clears referred_account_id"] }
  - { method: POST, path: "/referrals/{id}/qualify", description: "Qualify a REDEEMED referral; pay both sides", roles: [PlatformAdmin], code: 200, input: [], output: Referral, side_effects: ["status REDEEMED->QUALIFIED", "credits both accounts bonus_cents", "creates two REFERRAL_BONUS CashTransactions"] }
  - { method: POST, path: "/referrals/{id}/expire", description: "Expire an ISSUED referral past its 30-day window", roles: [PlatformAdmin], code: 200, input: [], output: Referral, side_effects: ["status ISSUED->EXPIRED"] }
  - { method: POST, path: "/referrals/{id}/revoke", description: "Revoke an ISSUED referral (by referrer)", roles: [Investor], code: 200, input: [], output: Referral, side_effects: ["status ISSUED->REVOKED"] }

  # ---- Test-driving: logical clock ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server logical clock. Startup default is 2026-01-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: null, side_effects: ["advances logical clock used for eligible_at, next_run_at, referral windows"] }

  # ---- Test-driving: lot market valuation injection ----
  - { method: POST, path: "/_lots/{id}/set_valuation", description: "Inject a per-lot appreciation rate (unit_gain_ratio_bps, signed) on an OPEN TaxLot, simulating a market-data feed; recomputes the lot market_value_cents and its bucket drift. No business endpoint sets appreciation, so this is the sanctioned channel.", roles: [PlatformAdmin], code: 200, input: [unit_gain_ratio_bps], output: TaxLot, side_effects: ["sets TaxLot.unit_gain_ratio_bps", "recomputes TaxLot.market_value_cents", "recomputes owning Bucket.market_value_cents, total_drift_bps, needs_rebalance"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH, http: 401, condition: "X-User-Role (or required X-User-ID) header absent on a protected endpoint" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Authenticated role not permitted for this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Investor/CustodialGuardian acting on an account/resource they do not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/ill-typed required field or out-of-domain enum" }
  - { id: ERR_INVALID_PAGINATION, http: 400, condition: "limit outside [1,100] or offset < 0" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition invalid from the resource's current state" }
  - { id: ERR_BUCKET_TYPE_NOT_PERMITTED, http: 403, condition: "CustodialGuardian acting on a non-UTMA bucket, or Investor acting outside their permitted bucket scope" }
  - { id: ERR_KYC_NOT_VERIFIED, http: 409, condition: "Investing/sweep/found-money confirm attempted while Account.kyc_status != VERIFIED" }
  - { id: ERR_BUCKET_NOT_ALLOWED_BY_PLAN, http: 409, condition: "Opening UTMA/IRA bucket not allowed by the account's subscription plan" }
  - { id: ERR_BENEFICIARY_REQUIRED, http: 400, condition: "UTMA bucket created without beneficiary_name" }
  - { id: ERR_HOLD_PERIOD_ACTIVE, http: 409, condition: "Found-money reward confirm attempted before reward.eligible_at" }
  - { id: ERR_REFERRAL_WINDOW, http: 409, condition: "Referral redeemed after, or expired before, the 30-day window boundary" }
  - { id: ERR_SELF_REFERRAL, http: 409, condition: "Referral redeemer equals the referrer account" }
  - { id: ERR_MIN_SPEND_NOT_MET, http: 409, condition: "Found-money qualifying_spend_cents below offer.min_spend_cents" }
  - { id: ERR_INSUFFICIENT_CASH, http: 409, condition: "INVEST settle with cash_balance_cents < requested_amount_cents" }
  - { id: ERR_INSUFFICIENT_LOTS, http: 409, condition: "WITHDRAW settle with selected OPEN lot market value below requested proceeds" }
  - { id: ERR_IRA_CAP_EXCEEDED, http: 409, condition: "IRA invest would push ytd_ira_contributed_cents past the annual cap" }
  - { id: ERR_INVALID_MULTIPLIER, http: 400, condition: "roundup_multiplier not in {1,2,3,10}" }
  - { id: ERR_ALLOCATION_SUM, http: 400, condition: "ModelPortfolio target_allocation weights do not sum to exactly 100" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the live parent version (OCC)" }
  - { id: ERR_BUCKET_NOT_EMPTY, http: 409, condition: "Closing a bucket that still has OPEN TaxLots or non-terminal Orders" }
  - { id: ERR_ACCOUNT_HAS_OPEN_BUCKETS, http: 409, condition: "Closing an account with any non-CLOSED bucket" }
  - { id: ERR_DUPLICATE_TIER, http: 409, condition: "Creating a SubscriptionPlan for a tier that already exists, or a ModelPortfolio for a risk_tier that already exists, or a Referral code that already exists" }
  - { id: ERR_OFFER_WINDOW_OVERLAP, http: 409, condition: "New found-money offer window overlaps an existing ACTIVE offer of the same brand (half-open interval semantics)" }
  - { id: ERR_CONTRIBUTION_DAY_COLLISION, http: 409, condition: "New recurring contribution run_day_index collides within +/-1 buffer of an existing ACTIVE contribution on the same account" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller; may register an account and read public config"
    identity: "opaque"
    exclusive_operations:
      - "POST /accounts/register"
    shared_operations: []

  - name: Investor
    description: "Account holder acting on own account, cards, accruals, buckets, orders, rewards, referrals"
    identity: "entity_backed:Account"
    exclusive_operations:
      - "POST /linked-cards / PATCH /linked-cards/{id}"
      - "POST /roundup-accruals / POST /roundup-accruals/{id}/cancel"
      - "POST /recurring-contributions / POST /recurring-contributions/{id}/cancel"
      - "POST /found-money-rewards"
      - "POST /referrals / POST /referrals/{id}/redeem / release-redemption / revoke"
      - "POST /accounts/{id}/close"
    shared_operations:
      - "POST /buckets (TAXABLE/IRA), POST /buckets/{id}/close (with CustodialGuardian)"
      - "POST /orders, POST /orders/{id}/submit, POST /orders/{id}/cancel (with CustodialGuardian)"
      - "POST /accounts/{id}/sweep (with PlatformAdmin)"
      - "GET reads of own resources (with PlatformAdmin/CustodialGuardian)"

  - name: CustodialGuardian
    description: "Adult custodian acting strictly on UTMA buckets and their orders for a minor beneficiary"
    identity: "entity_backed:Account"
    exclusive_operations: []
    shared_operations:
      - "POST /buckets (UTMA), POST /buckets/{id}/close"
      - "POST /orders, POST /orders/{id}/submit, POST /orders/{id}/cancel (UTMA buckets only)"
      - "GET reads of own account resources"

  - name: PlatformAdmin
    description: "Operator managing config and lifecycle: KYC, billing, settlement, sweeps, confirmations, qualifications"
    identity: "opaque"
    exclusive_operations:
      - "POST /subscription-plans, POST /model-portfolios, POST /found-money-offers"
      - "POST /accounts/{id}/verify-kyc, /restrict, /billing/charge-subscription, /billing/mark-past-due"
      - "POST /orders/{id}/settle, /reject"
      - "POST /buckets/{id}/freeze, /unfreeze"
      - "POST /found-money-rewards/{id}/confirm, /reverse"
      - "POST /referrals/{id}/qualify, /expire"
      - "POST /_clock/set_current_utc, POST /_lots/{id}/set_valuation"
    shared_operations:
      - "POST /accounts/{id}/sweep (with Investor)"
      - "GET reads (with Investor/CustodialGuardian)"
