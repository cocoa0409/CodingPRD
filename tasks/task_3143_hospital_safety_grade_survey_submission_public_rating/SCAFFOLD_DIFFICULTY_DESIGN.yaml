            - "CorrectionRequest.${cor0_id}.delta_points == 0 while PENDING"
            - "ReleaseCycle.${rc_b0_id}.correction_request_count == 0 once the correction leaves PENDING or ACCEPTED"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: survey_verification_round_idempotency_key_collision
        grounds:
          - state_machines.Survey.SUBMITTED_to_DISCREPANCY_OPEN
          - entities.Survey.fields.verification_cycle
          - endpoints.POST_/hospital-safety-rating/surveys/{id}/verify
          - errors.ERR_SURVEY_VERIFICATION_ALREADY_OPEN
        distinguishing_aspect: |
          Interval semantics are POINT-IDEMPOTENT: a second verification round
          whose (survey_id, verification_cycle) key has already been claimed is
          refused, so the same key cannot be opened twice even though a
          DIFFERENT key value is free — a different interval treatment from the
          appointment-style half-open containment the second instance carries.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Hospital P6 has a fresh SUBMITTED survey at verification_cycle 0 with one measure lacking a source program, and every response row is stamped 2026-06-01T00:00:00Z so verification lands on cycle 0."
          setup_api_calls:
            - *k_clock
            - *k_meth_main
            - *k_meth_b0
            - *k_meth_mg
            - *k_hp0
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/methodology-versions"
              payload: { methodology_version_id: "${meth_b0_id}" }
              as: RatingAdmin
            - &k_hp6
              call: "POST /hospital-safety-rating/hospitals"
              payload: { name: "P6 Regional Medical Center", ccn: "260007", state_code: "MO", bed_count: 100, teaching_status: "NON_TEACHING", annual_discharges: 2000, survey_contact_email: "p6@example.org" }
              as: RatingAdmin
              captures: { p6_id: $.data.id, p6_v0: $.data.version }
            - call: "POST /hospital-safety-rating/hospitals/${p6_id}/methodology-versions"
              payload: { methodology_version_id: "${meth_b0_id}" }
              as: RatingAdmin
            - call: "POST /hospital-safety-rating/hospitals/${p6_id}/surveys"
              payload: { started_survey_count: 800, completed_survey_count: 600, entity_annual_discharges: 1000, validation_method: "ATTESTATION" }
              as: HospitalRespondent
              as_user_id: "${p6_id}"
              captures: { s6_id: $.data.id }
            - call: "POST /hospital-safety-rating/hospitals/${p6_id}/survey-measures"
              payload: { survey_id: "${s6_id}", measure_code: "o1", raw_value: 70.0 }
              as: HospitalRespondent
              as_user_id: "${p6_id}"
            - call: "POST /hospital-safety-rating/surveys/${s6_id}/submit"
              payload: {}
              as: HospitalRespondent
              as_user_id: "${p6_id}"
          trigger:
            - call: "POST /hospital-safety-rating/surveys/${s6_id}/verify"
              payload: { verification_response: "DISCREPANCY_REQUEST" }
              as: VerificationAnalyst
              as_user_id: "va-owen"
              captures: { s6_cycle: $.data.verification_cycle, s6_status: $.data.af_status }
            - call: "POST /hospital-safety-rating/surveys/${s6_id}/verify"
              payload: { verification_response: "ACCEPT" }
              as: VerificationAnalyst
              as_user_id: "va-owen"
              captures: { err_claim: $.data.error_id }
          assert:
            - "Survey.${s6_id}.verification_cycle == 1 after the first round, so the (survey_id, cycle-1) key is claimed"
            - "the second round returns 409 ERR_SURVEY_VERIFICATION_ALREADY_OPEN, so the claimed key cannot be reopened"
            - "a distinct key value is free: the same survey at DISCREPANCY_RESOLVED accepts a subsequent verify with ACCEPT because the point no longer overlaps a claimed round"
            - "verification_cycle is unchanged at 1 by the refused call"

      - name: employer_benefit_window_strict_containment
        grounds:
          - validations[priority=9.5]
          - entities.Employer.fields.benefit_window_to
          - errors.ERR_BENEFIT_WINDOW_CONTAINMENT_CONFLICT
          - state_machines.Employer.ACTIVE_to_ACTIVE
        distinguishing_aspect: |
          Interval semantics are STRICT CONTAINMENT with a half-open
          [from, to) treatment: a window whose benefit_window_to equals another
          window's benefit_window_from is ALLOWED because the intervals merely
          touch, while a window that strictly swallows another is rejected — a
          different interval treatment from the point-idempotent key the first
          instance carries.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Employer E1 holds the half-open window [2026-01-01, 2026-12-31) under minimum_acceptable_letter B."
          setup_api_calls:
            - *k_clock
            - *k_meth_main
            - *k_meth_b0
            - *k_meth_mg
            - *k_hp0
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/methodology-versions"
              payload: { methodology_version_id: "${meth_b0_id}" }
              as: RatingAdmin
            - call: "POST /hospital-safety-rating/employers"
              payload: { name: "E1 Benefits Trust", purchaser_type: "SELF_INSURED_EMPLOYER", minimum_acceptable_letter: "B", benefit_window_from: "2026-01-01T00:00:00Z", benefit_window_to: "2026-12-31T00:00:00Z", network_hospital_ids: ["${p0_id}"] }
              as: PurchaserAdmin
              as_user_id: "emp-e1"
              captures: { emp1_id: $.data.id }
          trigger:
            - call: "POST /hospital-safety-rating/employers"
              payload: { name: "E2 Benefits Trust", purchaser_type: "SELF_INSURED_EMPLOYER", minimum_acceptable_letter: "B", benefit_window_from: "2026-03-01T00:00:00Z", benefit_window_to: "2026-09-30T00:00:00Z", network_hospital_ids: ["${p0_id}"] }
              as: PurchaserAdmin
              as_user_id: "emp-e2"
              captures: { err_contain: $.data.error_id }
            - call: "POST /hospital-safety-rating/employers"
              payload: { name: "E3 Benefits Trust", purchaser_type: "SELF_INSURED_EMPLOYER", minimum_acceptable_letter: "B", benefit_window_from: "2026-12-31T00:00:00Z", benefit_window_to: "2027-06-30T00:00:00Z", network_hospital_ids: ["${p0_id}"] }
              as: PurchaserAdmin
              as_user_id: "emp-e3"
              captures: { emp3_id: $.data.id }
            - call: "POST /hospital-safety-rating/employers"
              payload: { name: "E4 Benefits Trust", purchaser_type: "SELF_INSURED_EMPLOYER", minimum_acceptable_letter: "B", benefit_window_from: "2026-01-01T00:00:00Z", benefit_window_to: "2026-12-31T00:00:00Z", network_hospital_ids: ["${p0_id}"] }
              as: PurchaserAdmin
              as_user_id: "emp-e4"
              captures: { err_exact: $.data.error_id }
          assert:
            - "the strictly contained window returns 409 and err_contain == ERR_BENEFIT_WINDOW_CONTAINMENT_CONFLICT"
            - "the merely touching window is accepted with 201 because the intervals are half-open and share only the endpoint"
            - "Employer.${emp3_id}.benefit_window_from == 2026-12-31T00:00:00Z, so touching is admitted"
            - "the exactly coincident window returns 409 ERR_BENEFIT_WINDOW_CONTAINMENT_CONFLICT, because containment includes equality"
            - "no rejected call mutated Employer 1, whose own window and network stay intact"

  # ===========================================================================
  # Rule 9 — compensating_invariant
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: reanalysis_grant_then_refresh_restores_baseline_composite
        grounds:
          - state_machines.ReanalysisRequest.UNDER_REVIEW_to_GRANTED
          - state_machines.HospitalMeasureSet.READY_to_READY
          - calculations.composite_adjusted_for_reanalysis
          - calculations.composite_score
        distinguishing_aspect: |
          A conserved POINT QUANTITY: the forward GRANT moves the composite by
          exactly the signed adjusted_delta, and the compensating measure
          refresh clears reanalysis_adjustment_delta so the composite returns
          to the stored baseline — the pinned invariant is
          composite_after_refresh == baseline + 0.00, a different type of
          conserved quantity from the hospital-count conservation the second
          instance carries.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Hospital P7 is pinned to M_MAIN, has a fresh VERIFIED survey at verification_cycle 0, a SCORED grade at composite 60.38, and a reanalysis against one CPOE measure is UNDER_REVIEW."
