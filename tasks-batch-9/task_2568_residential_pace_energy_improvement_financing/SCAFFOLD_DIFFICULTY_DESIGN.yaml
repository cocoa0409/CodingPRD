# =============================================================================
# §1.8 Scaffold Difficulty Design — Residential PACE Energy-Improvement Financing
#   Test-targeting index for SCAFFOLD.yaml (domain residential-pace-financing,
#   api_prefix /pace). Nine §0.5 rule_ids, 22 instances.
#
#   Clock discipline: every chain opens with POST /_clock/set_current_utc, so no
#   instance depends on the 2026-08-01T00:00:00Z startup default or on wall time.
#   Every numeric assert below was computed by executing the named §1.3 formula
#   with Decimal/ROUND_HALF_UP against the fixture pinned in `setup:`.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: sir_per_measure_gate_vs_portfolio_blend_divergence_on_measures
        grounds:
          - calculations.savings_to_investment_ratio
          - entities.ProjectMeasure.fields.sir_bps
          - entities.Application.fields.portfolio_sir_bps
          - entities.Application.fields.min_measure_sir_bps
          - state_machines.Application.UNDER_REVIEW_to_CONSENT_PENDING
        distinguishing_aspect: |
          Entity domain = ProjectMeasure / Application: on one identical measure set the
          per_measure_gate variant rules the windows measure INELIGIBLE at 5951 bps while the
          portfolio_blended variant reports 12371 bps over the same two PROPOSED measures, and
          the blended number itself moves to 14511 bps at underwrite because the variant's input
          set narrows from PROPOSED to APPROVED.
        test_recipe:
          setup:
            - "Clock 2026-08-12T00:00:00Z. Products SOLAR_PV (useful_life_years 25) and WINDOWS (useful_life_years 20), both ACTIVE."
            - "Parcel in county 06073, assessed_value_cents 40000000, one ACTIVE first-position lien of 25000000 (equity 3750 bps)."
            - "One DRAFT Application, requested_term_years 20, with two PROPOSED measures: solar 3000000 cents cost / 250000 cents annual savings, windows 1000000 / 40000."
            - "AF(3%,25) = 17.4131476913 and AF(3%,20) = 14.8774748605 give pv 4353287 (solar) and 595099 (windows)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /pace/products"
              payload: { product_code: "SOLAR_PV_ROOF", category: "SOLAR_PV", useful_life_years: 25, max_annual_savings_cents: 300000, requires_permit: true }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { prod_solar: $.data.id }
            - call: "POST /pace/products"
              payload: { product_code: "WINDOWS_LOWE", category: "WINDOWS", useful_life_years: 20, max_annual_savings_cents: 60000, requires_permit: false }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { prod_win: $.data.id }
            - call: "POST /pace/contractors"
              payload: { legal_name: "Ridgeline Retrofit LLC", license_number: "CSLB-884120", license_expires_on: "2030-06-30", workmanship_warranty_years: 10, counties_served: ["06073"] }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { c1: $.data.id }
            - call: "POST /pace/contractors/${c1}/enroll"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /pace/properties"
              payload: { apn: "06073-118-204-011", county_code: "06073", owner_full_name: "Ada Ruiz", owner_birth_date: "1971-04-09", owner_email: "ada@example.com", occupancy_type: "OWNER_OCCUPIED", assessed_value_cents: 40000000, annual_property_tax_cents: 420000, preferred_language: "EN" }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { p1: $.data.id }
            - call: "POST /pace/mortgage-liens"
              payload: { property_id: "${p1}", holder_name: "Harbor Federal Savings", lien_position: 1, current_balance_cents: 25000000, recorded_on: "2019-03-14" }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { l1: $.data.id }
            - call: "POST /pace/applications"
              payload: { property_id: "${p1}", contractor_id: "${c1}", requested_term_years: 20 }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { a1: $.data.id, a1_v0: $.data.version }
            - call: "POST /pace/applications/${a1}/measures"
              payload: { product_id: "${prod_solar}", installed_cost_cents: 3000000, estimated_annual_savings_cents: 250000, expected_application_version: "${a1_v0}" }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { m_solar: $.data.id }
            - call: "GET /pace/applications/${a1}"
              payload: {}
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { a1_v1: $.data.version }
            - call: "POST /pace/applications/${a1}/measures"
              payload: { product_id: "${prod_win}", installed_cost_cents: 1000000, estimated_annual_savings_cents: 40000, expected_application_version: "${a1_v1}" }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { m_win: $.data.id }
          trigger:
            - call: "POST /pace/applications/${a1}/submit"
              payload: {}
              as: PropertyOwner
              as_user_id: "${p1}"
            - call: "POST /pace/applications/${a1}/underwrite"
              payload: { decision: "PROCEED", valuation_basis: "ASSESSED" }
              as: UnderwritingAnalyst
              as_user_id: "u_ana_1"
          assert:
            - "After submit: ProjectMeasure.${m_solar}.pv_savings_cents == 4353287 and sir_bps == 14511"
            - "After submit: ProjectMeasure.${m_win}.pv_savings_cents == 595099 and sir_bps == 5951"
            - "After submit: Application.${a1}.min_measure_sir_bps == 5951 (per_measure_gate variant) while Application.${a1}.portfolio_sir_bps == 12371 (portfolio_blended over both PROPOSED measures) — the two variants disagree on identical data"
            - "After submit: Application.${a1}.requested_principal_cents == 4000000 and weighted_useful_life_years == 23"
            - "After underwrite: ProjectMeasure.${m_solar}.status == APPROVED and ProjectMeasure.${m_win}.status == INELIGIBLE"
            - "After underwrite: Application.${a1}.requested_principal_cents == 3000000 (APPROVED subset only) and portfolio_sir_bps == 14511 (blend recomputed over the APPROVED subset)"
            - "After underwrite: Application.${a1}.status == CONSENT_PENDING and underwriting_cltv_bps == 7000 — the portfolio gate passing at 12371 did NOT rescue the windows measure"

      - name: workmanship_trailing_24m_vs_lifetime_blocks_reinstatement
        grounds:
          - calculations.contractor_workmanship_score
          - entities.Contractor.fields.workmanship_score
          - entities.Contractor.fields.lifetime_workmanship_score
          - state_machines.Contractor.PROBATION_to_ENROLLED
          - validations[priority=55]
          - errors[ERR_WORKMANSHIP_GATE_NOT_MET]
        distinguishing_aspect: |
          Entity domain = Contractor (a different domain from the ProjectMeasure/Application SIR
          instance): after the clock passes the 730-day trailing window the trailing_24m variant
          recovers to 9200 bps and would clear REINSTATE_TRAILING_BPS, while the lifetime variant
          stays at 7200 bps and fails REINSTATE_LIFETIME_BPS, so reinstatement is refused.
        test_recipe:
          setup:
            - "Clock starts 2026-08-12T00:00:00Z; contractor license_expires_on 2030-06-30 so the licence never gates the reinstatement."
            - "One funded single-measure application (solar 3000000 / 220000) so complaints can be filed against it."
            - "Complaint 1 SEVERE upheld on 2026-08-20 (deduction 2000 bps -> trailing 8000 -> PROBATION), remedy verified 2026-08-25 within deadline 2026-09-30."
            - "Clock then moves to 2028-09-01, which is 742 days after complaint 1 was created, so complaint 1 leaves the 730-day trailing window."
            - "Complaint 2 MAJOR filed and upheld on 2028-09-01 (deduction 800 bps), remedy verified 2028-09-05 within deadline 2028-10-31, so upheld_open_remedy_count is back to 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /pace/products"
              payload: { product_code: "SOLAR_PV_ROOF", category: "SOLAR_PV", useful_life_years: 25, max_annual_savings_cents: 300000, requires_permit: true }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { prod_solar: $.data.id }
            - call: "POST /pace/contractors"
              payload: { legal_name: "Ridgeline Retrofit LLC", license_number: "CSLB-884120", license_expires_on: "2030-06-30", workmanship_warranty_years: 10, counties_served: ["06073"] }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { c1: $.data.id }
            - call: "POST /pace/contractors/${c1}/enroll"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /pace/properties"
              payload: { apn: "06073-118-204-011", county_code: "06073", owner_full_name: "Ada Ruiz", owner_birth_date: "1971-04-09", owner_email: "ada@example.com", occupancy_type: "OWNER_OCCUPIED", assessed_value_cents: 40000000, annual_property_tax_cents: 420000, preferred_language: "EN" }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { p1: $.data.id }
            - call: "POST /pace/mortgage-liens"
              payload: { property_id: "${p1}", holder_name: "Harbor Federal Savings", lien_position: 1, current_balance_cents: 25000000, recorded_on: "2019-03-14" }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { l1: $.data.id }
            - call: "POST /pace/applications"
              payload: { property_id: "${p1}", contractor_id: "${c1}", requested_term_years: 20 }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { a1: $.data.id, a1_v0: $.data.version }
            - call: "POST /pace/applications/${a1}/measures"
              payload: { product_id: "${prod_solar}", installed_cost_cents: 3000000, estimated_annual_savings_cents: 220000, expected_application_version: "${a1_v0}" }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { m_solar: $.data.id }
            - call: "POST /pace/applications/${a1}/submit"
              payload: {}
              as: PropertyOwner
              as_user_id: "${p1}"
            - call: "POST /pace/applications/${a1}/underwrite"
              payload: { decision: "PROCEED", valuation_basis: "ASSESSED" }
              as: UnderwritingAnalyst
              as_user_id: "u_ana_1"
            - call: "POST /pace/mortgage-liens/${l1}/consent-response"
              payload: { response: "CONSENT" }
              as: ComplianceOfficer
              as_user_id: "u_comp_1"
            - call: "POST /pace/applications/${a1}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_comp_1"
              captures: { a1_v2: $.data.version }
            - call: "POST /pace/financing-agreements"
              payload: { application_id: "${a1}", term_years: 20, apr_bps: 800, expected_application_version: "${a1_v2}" }
              as: UnderwritingAnalyst
              as_user_id: "u_ana_1"
              captures: { fa1: $.data.id }
            - call: "POST /pace/financing-agreements/${fa1}/sign"
              payload: { signature_name: "Ada Ruiz" }
              as: PropertyOwner
              as_user_id: "${p1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-18T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /pace/completion-certificates"
              payload: { application_id: "${a1}", measure_ids: ["${m_solar}"], certified_cost_cents: 3000000 }
              as: Contractor
              as_user_id: "${c1}"
              captures: { cc1: $.data.id }
            - call: "POST /pace/completion-certificates/${cc1}/sign"
              payload: { homeowner_signature_name: "Ada Ruiz" }
              as: PropertyOwner
              as_user_id: "${p1}"
            - call: "POST /pace/completion-certificates/${cc1}/verify"
              payload: { decision: "APPROVE" }
              as: FundingOfficer
              as_user_id: "u_fund_v"
            - call: "POST /pace/disbursements"
              payload: { application_id: "${a1}", completion_certificate_id: "${cc1}", contractor_id: "${c1}", amount_cents: 3000000 }
              as: FundingOfficer
              as_user_id: "u_fund_v"
              captures: { d1: $.data.id }
            - call: "POST /pace/disbursements/${d1}/release"
              payload: {}
              as: FundingOfficer
              as_user_id: "u_fund_r"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /pace/complaints"
              payload: { application_id: "${a1}", contractor_id: "${c1}", category: "INSTALLATION_DEFECT", severity: "SEVERE", description: "Array racking detached from rafters" }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { cmp1: $.data.id }
            - call: "POST /pace/complaints/${cmp1}/adjudicate"
              payload: { decision: "UPHOLD_REMEDY", remedy_deadline_on: "2026-09-30" }
              as: ComplianceOfficer
              as_user_id: "u_comp_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /pace/complaints/${cmp1}/adjudicate"
              payload: { decision: "REMEDY_VERIFIED" }
              as: ComplianceOfficer
              as_user_id: "u_comp_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2028-09-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /pace/complaints"
              payload: { application_id: "${a1}", contractor_id: "${c1}", category: "WORKMANSHIP", severity: "MAJOR", description: "Inverter mounting corroded through" }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { cmp2: $.data.id }
            - call: "POST /pace/complaints/${cmp2}/adjudicate"
              payload: { decision: "UPHOLD_REMEDY", remedy_deadline_on: "2028-10-31" }
              as: ComplianceOfficer
              as_user_id: "u_comp_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2028-09-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /pace/complaints/${cmp2}/adjudicate"
              payload: { decision: "REMEDY_VERIFIED" }
              as: ComplianceOfficer
              as_user_id: "u_comp_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2028-09-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin"
          trigger:
            - call: "POST /pace/contractors/${c1}/reinstate"
              payload: { note: "Both remedies verified" }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { err: $.data.error_id }
          assert:
            - "The reinstate call returns 422 with data.error_id == ERR_WORKMANSHIP_GATE_NOT_MET"
            - "Contractor.${c1}.workmanship_score == 9200 (trailing_24m: only the 2028 MAJOR complaint is inside the 730-day window, 10000 - 800)"
            - "Contractor.${c1}.lifetime_workmanship_score == 7200 (lifetime: 10000 - 2000 - 800, the 2026 SEVERE deduction never ages out)"
            - "Contractor.${c1}.upheld_open_remedy_count == 0, so the remedy gate at priority 56 was NOT the blocker"
            - "Contractor.${c1}.enrollment_status is still PROBATION and suspension_reason is still 'WORKMANSHIP_SCORE_BELOW_9000'"
            - "WorkmanshipComplaint.${cmp1}.status == CLOSED_REMEDIED and WorkmanshipComplaint.${cmp2}.status == CLOSED_REMEDIED — remediation did not refund either deduction"

      - name: cltv_assessed_vs_market_basis_divergence_on_property
        grounds:
          - calculations.combined_lien_to_value_ratio
          - entities.Property.fields.market_value_cents
          - entities.Property.fields.appraisal_effective_on
          - entities.Application.fields.valuation_basis
          - entities.Application.fields.underwriting_cltv_bps
        distinguishing_aspect: |
          Entity domain = Property (a third, distinct domain): on one parcel the assessed_basis
          variant returns exactly 9700 bps and the market_basis variant returns 8435 bps for the
          same debt stack, and the underwrite that elects MARKET stamps 8435 while the same call
          electing ASSESSED would stamp 9700.
        test_recipe:
          setup:
            - "Clock 2026-08-12T00:00:00Z. Parcel assessed_value_cents 40000000, market_value_cents 46000000, appraisal_effective_on 2026-07-01 (42 days old, inside APPRAISAL_STALENESS_DAYS 180)."
            - "Senior first-position lien 34000000, so equity_ratio_bps is 1500 and committed_pace_principal_cents starts at 0."
            - "One UNDER_REVIEW Application with two PROPOSED measures: solar 3600000 / 280000 and hvac 1200000 / 100000 (principal 4800000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /pace/products"
              payload: { product_code: "SOLAR_PV_ROOF", category: "SOLAR_PV", useful_life_years: 25, max_annual_savings_cents: 300000, requires_permit: true }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { prod_solar: $.data.id }
            - call: "POST /pace/products"
              payload: { product_code: "HVAC_HEATPUMP", category: "HVAC", useful_life_years: 18, max_annual_savings_cents: 120000, requires_permit: true }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { prod_hvac: $.data.id }
            - call: "POST /pace/contractors"
              payload: { legal_name: "Ridgeline Retrofit LLC", license_number: "CSLB-884120", license_expires_on: "2030-06-30", workmanship_warranty_years: 10, counties_served: ["06073"] }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { c1: $.data.id }
            - call: "POST /pace/contractors/${c1}/enroll"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /pace/properties"
              payload: { apn: "06073-118-204-088", county_code: "06073", owner_full_name: "Cleo Marsh", owner_birth_date: "1968-11-02", owner_email: "cleo@example.com", occupancy_type: "OWNER_OCCUPIED", assessed_value_cents: 40000000, annual_property_tax_cents: 430000, preferred_language: "EN", market_value_cents: 46000000, appraisal_effective_on: "2026-07-01" }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { p1: $.data.id }
            - call: "POST /pace/mortgage-liens"
              payload: { property_id: "${p1}", holder_name: "Harbor Federal Savings", lien_position: 1, current_balance_cents: 34000000, recorded_on: "2021-05-19" }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { l1: $.data.id }
            - call: "POST /pace/applications"
              payload: { property_id: "${p1}", contractor_id: "${c1}", requested_term_years: 20 }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { a1: $.data.id, a1_v0: $.data.version }
            - call: "POST /pace/applications/${a1}/measures"
              payload: { product_id: "${prod_solar}", installed_cost_cents: 3600000, estimated_annual_savings_cents: 280000, expected_application_version: "${a1_v0}" }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { m_solar: $.data.id }
            - call: "GET /pace/applications/${a1}"
              payload: {}
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { a1_v1: $.data.version }
            - call: "POST /pace/applications/${a1}/measures"
              payload: { product_id: "${prod_hvac}", installed_cost_cents: 1200000, estimated_annual_savings_cents: 100000, expected_application_version: "${a1_v1}" }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { m_hvac: $.data.id }
            - call: "POST /pace/applications/${a1}/submit"
              payload: {}
              as: PropertyOwner
              as_user_id: "${p1}"
          trigger:
            - call: "GET /pace/applications/${a1}/eligibility-report"
              payload: {}
              as: UnderwritingAnalyst
              as_user_id: "u_ana_1"
            - call: "POST /pace/applications/${a1}/underwrite"
              payload: { decision: "PROCEED", valuation_basis: "MARKET" }
              as: UnderwritingAnalyst
              as_user_id: "u_ana_1"
          assert:
            - "eligibility-report data.cltv_bps_assessed == 9700 and data.cltv_bps_market == 8435 — a 1265 bps divergence on identical debt and principal"
            - "eligibility-report data.appraisal_stale == false, data.valuation_basis_applied == 'ASSESSED' (nothing underwritten yet) and data.blocking_error_id == null"
            - "eligibility-report data.ptv_bps == 1200, data.equity_bps == 1500, data.portfolio_sir_bps == 13023, data.min_measure_sir_bps == 11461"
            - "eligibility-report data.approved_principal_cents == 4800000 and data.proposed_principal_cents == 4800000"
            - "After underwrite: Application.${a1}.valuation_basis == MARKET and underwriting_cltv_bps == 8435 (NOT 9700)"
            - "Application.${a1}.screening_cltv_bps == 9700 — the submit-time screen is locked to assessed_basis while the binding underwrite used market_basis"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: amortization_interest_first_rounding_order_pinned
        grounds:
          - calculations.level_payment_amortization_schedule
          - calculations.financed_amount_composition
          - entities.AmortizationInstallment.fields.interest_cents
          - entities.AmortizationInstallment.fields.principal_cents
          - entities.AmortizationInstallment.fields.total_due_cents
          - state_machines.Assessment.null_to_PENDING_ROLL
        distinguishing_aspect: |
          Mode (b) — pinned rounding order: interest is quantized to whole cents from the opening
          balance FIRST and principal is derived as payment minus that rounded interest, so year 1
          splits 439441 into 345160 interest and 94281 principal; the final year absorbs the whole
          residual balance and its total_due is 443463, 22 cents higher than every other year.
        test_recipe:
          setup:
            - "Clock 2026-08-12T00:00:00Z, advanced to 2026-08-18 for funding and 2026-08-20 for recording."
            - "Parcel assessed 40000000, senior lien 25000000; measures solar 3000000 / 220000 (sir 12770) and hvac 1200000 / 100000 (sir 11461); principal 4200000."
            - "ADMIN_FEE_BPS 250 on 4200000 = 105000, plus COUNTY_RECORDING_FEE_CENTS 9500, so financed_amount_cents = 4314500; term 20 years at 800 bps; ANNUAL_SERVICING_FEE_CENTS 4000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /pace/products"
              payload: { product_code: "SOLAR_PV_ROOF", category: "SOLAR_PV", useful_life_years: 25, max_annual_savings_cents: 300000, requires_permit: true }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { prod_solar: $.data.id }
            - call: "POST /pace/products"
              payload: { product_code: "HVAC_HEATPUMP", category: "HVAC", useful_life_years: 18, max_annual_savings_cents: 120000, requires_permit: true }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { prod_hvac: $.data.id }
            - call: "POST /pace/contractors"
              payload: { legal_name: "Ridgeline Retrofit LLC", license_number: "CSLB-884120", license_expires_on: "2030-06-30", workmanship_warranty_years: 10, counties_served: ["06073"] }
              as: ProgramAdmin
              as_user_id: "u_admin"
