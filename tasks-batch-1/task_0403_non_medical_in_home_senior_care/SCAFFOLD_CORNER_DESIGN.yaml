# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage)
# Non-Medical In-Home Senior Care — Expert tier
# Walks references/claim-extraction-guide.md against this scaffold's §1.1-§1.7.
# Agency defaults used: base_hourly_rate=30, live_in_day_rate=250, mileage_rate=0.70,
# evv_rounding_minutes=15, overtime_threshold_hours=40, overtime_multiplier=1.5,
# travel_buffer_minutes=30.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_caregiver_returns_pending_applicant_defaults
        claim_type: Creation
        grounds: [entities.Caregiver.fields.background_tier, entities.Caregiver.fields.employment_status]
        distinguishing_aspect: "POST /caregivers with required fields -> 201; background_tier=PENDING, employment_status=APPLICANT, max_weekly_hours defaults to 50."
        test_recipe:
          setup: ["An Agency exists."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "A", base_hourly_rate: 30.00, live_in_day_rate: 250.00 }
              as: AgencyAdmin
              captures: { ag: $.data.id }
          trigger:
            - call: "POST /caregivers"
              payload: { agency_id: "${ag}", full_name: "CG", hire_state_code: "CA" }
              as: AgencyAdmin
              captures: { cg: $.data.id }
          assert:
            - "Caregiver.${cg}.background_tier == PENDING"
            - "Caregiver.${cg}.employment_status == APPLICANT"
            - "Caregiver.${cg}.max_weekly_hours == 50"
            - "Caregiver.${cg}.version == 1"

      - name: get_caregiver_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_CAREGIVER_NOT_FOUND]", endpoints]
        distinguishing_aspect: "GET /caregivers/{id} with a non-existent UUID -> ERR_CAREGIVER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB (no caregivers)."]
          setup_api_calls: []
          trigger:
            - call: "GET /caregivers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: AgencyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CAREGIVER_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_visit_missing_required_field
        claim_type: Required Fields
        grounds: [entities.Visit.fields.billing_mode, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /visits omitting billing_mode -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Agency, caregiver, client, plan exist."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "A", base_hourly_rate: 30.00, live_in_day_rate: 250.00 }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /caregivers"
              payload: { agency_id: "${ag}", full_name: "CG", hire_state_code: "CA" }
              as: AgencyAdmin
              captures: { cg: $.data.id }
            - call: "POST /clients"
              payload: { agency_id: "${ag}", full_name: "CL", residence_state_code: "CA" }
              as: AgencyAdmin
              captures: { cl: $.data.id }
            - call: "POST /clients/${cl}/care-plans"
              payload: { title: "Plan" }
              as: Scheduler
              captures: { plan: $.data.id }
          trigger:
            - call: "POST /visits"
              payload: { caregiver_id: "${cg}", client_id: "${cl}", care_plan_id: "${plan}", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: create_visit_end_before_start_invalid
        claim_type: Type Constraints
        grounds: [entities.Visit.fields.scheduled_end, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /visits with scheduled_end <= scheduled_start -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Agency, caregiver, client, plan exist."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "A", base_hourly_rate: 30.00, live_in_day_rate: 250.00 }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /caregivers"
              payload: { agency_id: "${ag}", full_name: "CG", hire_state_code: "CA" }
              as: AgencyAdmin
              captures: { cg: $.data.id }
            - call: "POST /clients"
              payload: { agency_id: "${ag}", full_name: "CL", residence_state_code: "CA" }
              as: AgencyAdmin
              captures: { cl: $.data.id }
            - call: "POST /clients/${cl}/care-plans"
              payload: { title: "Plan" }
              as: Scheduler
              captures: { plan: $.data.id }
          trigger:
            - call: "POST /visits"
              payload: { caregiver_id: "${cg}", client_id: "${cl}", care_plan_id: "${plan}", billing_mode: "HOURLY", scheduled_start: "2026-06-01T11:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: create_caregiver_unknown_agency_not_found
        claim_type: Parent Relationships
        grounds: [entities.Caregiver.fields.agency_id, "errors[ERR_AGENCY_NOT_FOUND]"]
        distinguishing_aspect: "POST /caregivers with a non-existent agency_id -> ERR_AGENCY_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /caregivers"
              payload: { agency_id: "00000000-0000-4000-8000-000000000000", full_name: "CG", hire_state_code: "CA" }
              as: AgencyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_AGENCY_NOT_FOUND"
            - "HTTP status == 404"

      - name: system_fields_generated_on_create
        claim_type: System Fields
        grounds: [entities.Client.fields.status, entities.Client.fields.continuity_score]
        distinguishing_aspect: "POST /clients ignores any client-supplied status/continuity_score; server sets status=INTAKE, continuity_score=0, version=1."
        test_recipe:
          setup: ["An Agency exists."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "A", base_hourly_rate: 30.00, live_in_day_rate: 250.00 }
              as: AgencyAdmin
              captures: { ag: $.data.id }
          trigger:
            - call: "POST /clients"
              payload: { agency_id: "${ag}", full_name: "CL", residence_state_code: "CA" }
              as: AgencyAdmin
              captures: { cl: $.data.id }
          assert:
            - "Client.${cl}.status == INTAKE"
            - "Client.${cl}.continuity_score == 0"
            - "Client.${cl}.version == 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: clear_background_twice_returns_not_pending
        claim_type: Idempotency
        grounds: [state_machines.Caregiver.background_tier_PENDING_to_TIER, "errors[ERR_BACKGROUND_NOT_PENDING]"]
        distinguishing_aspect: "A second CLEAR_BACKGROUND on an already-tiered caregiver -> ERR_BACKGROUND_NOT_PENDING (409)."
        test_recipe:
          setup: ["A caregiver cleared to TIER_1."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "A", base_hourly_rate: 30.00, live_in_day_rate: 250.00 }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /caregivers"
              payload: { agency_id: "${ag}", full_name: "CG", hire_state_code: "CA" }
              as: AgencyAdmin
              captures: { cg: $.data.id }
            - call: "POST /caregivers/${cg}/transition"
              payload: { action: "CLEAR_BACKGROUND", target_tier: "TIER_1" }
              as: AgencyAdmin
          trigger:
            - call: "POST /caregivers/${cg}/transition"
              payload: { action: "CLEAR_BACKGROUND", target_tier: "TIER_2" }
              as: AgencyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_BACKGROUND_NOT_PENDING"
            - "HTTP status == 409"

      - name: activate_caregiver_without_background_cleared
        claim_type: Precondition Enforcement
        grounds: [state_machines.Caregiver.employment_status_APPLICANT_to_ACTIVE, "errors[ERR_BACKGROUND_NOT_CLEARED]"]
        distinguishing_aspect: "ACTIVATE a still-PENDING caregiver -> ERR_BACKGROUND_NOT_CLEARED (409); employment_status stays APPLICANT."
        test_recipe:
          setup: ["A freshly registered (PENDING, APPLICANT) caregiver."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "A", base_hourly_rate: 30.00, live_in_day_rate: 250.00 }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /caregivers"
              payload: { agency_id: "${ag}", full_name: "CG", hire_state_code: "CA" }
              as: AgencyAdmin
              captures: { cg: $.data.id }
          trigger:
            - call: "POST /caregivers/${cg}/transition"
              payload: { action: "ACTIVATE" }
              as: AgencyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_BACKGROUND_NOT_CLEARED"
            - "HTTP status == 409"
            - "Caregiver.${cg}.employment_status == APPLICANT"

      - name: finalize_invoice_twice_returns_not_draft
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Invoice.DRAFT_to_ISSUED, "errors[ERR_INVOICE_NOT_DRAFT]"]
        distinguishing_aspect: "A second finalize on an ISSUED invoice -> ERR_INVOICE_NOT_DRAFT (409)."
        test_recipe:
          setup: ["An ISSUED invoice (one COMPLETED 8h visit)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T07:00:00Z" }
              as: AgencyAdmin
            - call: "POST /agencies"
              payload: { name: "A", base_hourly_rate: 30.00, live_in_day_rate: 250.00, evv_rounding_minutes: 15 }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /caregivers"
              payload: { agency_id: "${ag}", full_name: "CG", hire_state_code: "CA" }
              as: AgencyAdmin
              captures: { cg: $.data.id }
            - call: "POST /caregivers/${cg}/transition"
              payload: { action: "CLEAR_BACKGROUND", target_tier: "TIER_1" }
              as: AgencyAdmin
            - call: "POST /caregivers/${cg}/transition"
              payload: { action: "ACTIVATE" }
              as: AgencyAdmin
            - call: "POST /clients"
              payload: { agency_id: "${ag}", full_name: "CL", residence_state_code: "CA" }
              as: AgencyAdmin
              captures: { cl: $.data.id }
            - call: "POST /clients/${cl}/transition"
              payload: { action: "ACTIVATE" }
              as: Scheduler
            - call: "POST /clients/${cl}/care-plans"
              payload: { title: "Plan" }
              as: Scheduler
              captures: { plan: $.data.id }
            - call: "POST /care-plans/${plan}/transition"
              payload: { action: "PUBLISH" }
              as: Scheduler
            - call: "POST /matches"
              payload: { caregiver_id: "${cg}", client_id: "${cl}", is_primary: true }
              as: Scheduler
              captures: { mt: $.data.id }
            - call: "POST /matches/${mt}/transition"
              payload: { action: "ACTIVATE" }
              as: Scheduler
            - call: "POST /visits"
              payload: { caregiver_id: "${cg}", client_id: "${cl}", care_plan_id: "${plan}", billing_mode: "HOURLY", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T17:00:00Z" }
              as: Scheduler
              captures: { v1: $.data.id }
            - call: "POST /visits/${v1}/clock-in"
              payload: { event_at: "2026-06-01T09:00:00Z" }
              as: Caregiver
              as_user_id: "${cg}"
            - call: "POST /visits/${v1}/clock-out"
              payload: { event_at: "2026-06-01T17:00:00Z" }
              as: Caregiver
              as_user_id: "${cg}"
            - call: "POST /invoices"
              payload: { agency_id: "${ag}", caregiver_id: "${cg}", client_id: "${cl}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-08T00:00:00Z" }
              as: BillingClerk
              captures: { inv: $.data.id }
            - call: "POST /invoices/${inv}/finalize"
              payload: {}
              as: BillingClerk
          trigger:
            - call: "POST /invoices/${inv}/finalize"
              payload: {}
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVOICE_NOT_DRAFT"
            - "HTTP status == 409"

      - name: finalize_invoice_no_billable_visits
        claim_type: Precondition Enforcement
        grounds: [state_machines.Invoice.DRAFT_to_ISSUED, "errors[ERR_NO_BILLABLE_VISITS]"]
        distinguishing_aspect: "Finalize a DRAFT invoice whose window contains no COMPLETED visits -> ERR_NO_BILLABLE_VISITS (409)."
        test_recipe:
          setup: ["A DRAFT invoice with no completed visits in the period."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "A", base_hourly_rate: 30.00, live_in_day_rate: 250.00 }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /caregivers"
              payload: { agency_id: "${ag}", full_name: "CG", hire_state_code: "CA" }
              as: AgencyAdmin
              captures: { cg: $.data.id }
            - call: "POST /clients"
              payload: { agency_id: "${ag}", full_name: "CL", residence_state_code: "CA" }
              as: AgencyAdmin
              captures: { cl: $.data.id }
            - call: "POST /invoices"
              payload: { agency_id: "${ag}", caregiver_id: "${cg}", client_id: "${cl}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-08T00:00:00Z" }
              as: BillingClerk
              captures: { inv: $.data.id }
          trigger:
            - call: "POST /invoices/${inv}/finalize"
              payload: {}
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NO_BILLABLE_VISITS"
            - "HTTP status == 409"

      - name: clockout_when_not_in_progress
        claim_type: Invalid Transitions
        grounds: [state_machines.Visit.IN_PROGRESS_to_COMPLETED, "errors[ERR_VISIT_NOT_IN_PROGRESS]"]
        distinguishing_aspect: "clock-out on a SCHEDULED visit (never clocked in) -> ERR_VISIT_NOT_IN_PROGRESS (409)."
        test_recipe:
          setup: ["A SCHEDULED visit with active match/client/published plan."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "A", base_hourly_rate: 30.00, live_in_day_rate: 250.00 }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /caregivers"
              payload: { agency_id: "${ag}", full_name: "CG", hire_state_code: "CA" }
              as: AgencyAdmin
              captures: { cg: $.data.id }
            - call: "POST /caregivers/${cg}/transition"
              payload: { action: "CLEAR_BACKGROUND", target_tier: "TIER_1" }
              as: AgencyAdmin
            - call: "POST /caregivers/${cg}/transition"
              payload: { action: "ACTIVATE" }
              as: AgencyAdmin
            - call: "POST /clients"
              payload: { agency_id: "${ag}", full_name: "CL", residence_state_code: "CA" }
              as: AgencyAdmin
              captures: { cl: $.data.id }
            - call: "POST /clients/${cl}/transition"
              payload: { action: "ACTIVATE" }
              as: Scheduler
            - call: "POST /clients/${cl}/care-plans"
              payload: { title: "Plan" }
              as: Scheduler
              captures: { plan: $.data.id }
            - call: "POST /care-plans/${plan}/transition"
              payload: { action: "PUBLISH" }
              as: Scheduler
            - call: "POST /matches"
              payload: { caregiver_id: "${cg}", client_id: "${cl}", is_primary: true }
              as: Scheduler
              captures: { mt: $.data.id }
            - call: "POST /matches/${mt}/transition"
              payload: { action: "ACTIVATE" }
              as: Scheduler
            - call: "POST /visits"
              payload: { caregiver_id: "${cg}", client_id: "${cl}", care_plan_id: "${plan}", billing_mode: "HOURLY", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: Scheduler
              captures: { v1: $.data.id }
          trigger:
            - call: "POST /visits/${v1}/clock-out"
              payload: { event_at: "2026-06-01T10:00:00Z" }
              as: Caregiver
              as_user_id: "${cg}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VISIT_NOT_IN_PROGRESS"
            - "HTTP status == 409"

      - name: clockout_event_before_clockin_invalid_window
        claim_type: Precondition Enforcement
        grounds: [state_machines.Visit.IN_PROGRESS_to_COMPLETED, "errors[ERR_INVALID_CLOCK_WINDOW]", "validations[priority=15]"]
        distinguishing_aspect: "clock-out whose event_at is not strictly greater than clock_in_at -> ERR_INVALID_CLOCK_WINDOW (409)."
        test_recipe:
          setup: ["An IN_PROGRESS visit clocked in at 2026-06-01T10:00:00Z."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "A", base_hourly_rate: 30.00, live_in_day_rate: 250.00 }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /caregivers"
              payload: { agency_id: "${ag}", full_name: "CG", hire_state_code: "CA" }
              as: AgencyAdmin
              captures: { cg: $.data.id }
            - call: "POST /caregivers/${cg}/transition"
              payload: { action: "CLEAR_BACKGROUND", target_tier: "TIER_1" }
              as: AgencyAdmin
            - call: "POST /caregivers/${cg}/transition"
              payload: { action: "ACTIVATE" }
              as: AgencyAdmin
            - call: "POST /clients"
              payload: { agency_id: "${ag}", full_name: "CL", residence_state_code: "CA" }
              as: AgencyAdmin
              captures: { cl: $.data.id }
            - call: "POST /clients/${cl}/transition"
              payload: { action: "ACTIVATE" }
              as: Scheduler
            - call: "POST /clients/${cl}/care-plans"
              payload: { title: "Plan" }
              as: Scheduler
              captures: { plan: $.data.id }
            - call: "POST /care-plans/${plan}/transition"
              payload: { action: "PUBLISH" }
              as: Scheduler
            - call: "POST /matches"
              payload: { caregiver_id: "${cg}", client_id: "${cl}", is_primary: true }
              as: Scheduler
              captures: { mt: $.data.id }
            - call: "POST /matches/${mt}/transition"
              payload: { action: "ACTIVATE" }
              as: Scheduler
            - call: "POST /visits"
              payload: { caregiver_id: "${cg}", client_id: "${cl}", care_plan_id: "${plan}", billing_mode: "HOURLY", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T12:00:00Z" }
              as: Scheduler
              captures: { v1: $.data.id }
            - call: "POST /visits/${v1}/clock-in"
              payload: { event_at: "2026-06-01T10:00:00Z" }
              as: Caregiver
              as_user_id: "${cg}"
          trigger:
            - call: "POST /visits/${v1}/clock-out"
              payload: { event_at: "2026-06-01T10:00:00Z" }
              as: Caregiver
              as_user_id: "${cg}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_CLOCK_WINDOW"
            - "HTTP status == 409"
            - "Visit.${v1}.status == IN_PROGRESS"

      - name: approve_claim_not_submitted_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.LtcClaim.SUBMITTED_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "APPROVE a DRAFT (un-submitted) claim -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A DRAFT claim on an ISSUED invoice (not yet submitted)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T07:00:00Z" }
              as: AgencyAdmin
            - call: "POST /agencies"
              payload: { name: "A", base_hourly_rate: 30.00, live_in_day_rate: 250.00, evv_rounding_minutes: 15 }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /caregivers"
              payload: { agency_id: "${ag}", full_name: "CG", hire_state_code: "CA" }
              as: AgencyAdmin
              captures: { cg: $.data.id }
            - call: "POST /caregivers/${cg}/transition"
              payload: { action: "CLEAR_BACKGROUND", target_tier: "TIER_1" }
              as: AgencyAdmin
            - call: "POST /caregivers/${cg}/transition"
              payload: { action: "ACTIVATE" }
              as: AgencyAdmin
            - call: "POST /clients"
              payload: { agency_id: "${ag}", full_name: "CL", residence_state_code: "CA" }
              as: AgencyAdmin
              captures: { cl: $.data.id }
            - call: "POST /clients/${cl}/transition"
              payload: { action: "ACTIVATE" }
              as: Scheduler
            - call: "POST /clients/${cl}/care-plans"
              payload: { title: "Plan" }
              as: Scheduler
              captures: { plan: $.data.id }
            - call: "POST /care-plans/${plan}/transition"
              payload: { action: "PUBLISH" }
              as: Scheduler
            - call: "POST /matches"
              payload: { caregiver_id: "${cg}", client_id: "${cl}", is_primary: true }
              as: Scheduler
              captures: { mt: $.data.id }
            - call: "POST /matches/${mt}/transition"
              payload: { action: "ACTIVATE" }
              as: Scheduler
            - call: "POST /visits"
              payload: { caregiver_id: "${cg}", client_id: "${cl}", care_plan_id: "${plan}", billing_mode: "HOURLY", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T17:00:00Z" }
              as: Scheduler
              captures: { v1: $.data.id }
            - call: "POST /visits/${v1}/clock-in"
              payload: { event_at: "2026-06-01T09:00:00Z" }
              as: Caregiver
              as_user_id: "${cg}"
            - call: "POST /visits/${v1}/clock-out"
              payload: { event_at: "2026-06-01T17:00:00Z" }
              as: Caregiver
              as_user_id: "${cg}"
            - call: "POST /invoices"
              payload: { agency_id: "${ag}", caregiver_id: "${cg}", client_id: "${cl}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-08T00:00:00Z" }
              as: BillingClerk
              captures: { inv: $.data.id }
            - call: "POST /invoices/${inv}/finalize"
              payload: {}
              as: BillingClerk
              captures: { iv: $.data.version }
            - call: "POST /ltc-claims"
              payload: { client_id: "${cl}", invoice_id: "${inv}", insurer_name: "Ins", policy_number: "P1", covered_pct: 0.50, daily_benefit_max: 500, covered_days: 5, expected_invoice_version: "${iv}" }
              as: BillingClerk
              captures: { claim: $.data.id }
          trigger:
            - call: "POST /ltc-claims/${claim}/transition"
              payload: { action: "APPROVE" }
              as: AgencyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"
            - "LtcClaim.${claim}.status == DRAFT"

      - name: visit_reset_from_already_scheduled_invalid
        claim_type: invalid_transition
        grounds: [state_machines.Visit.EN_ROUTE_or_IN_PROGRESS_to_SCHEDULED, "errors[ERR_INVALID_STATE]"]
