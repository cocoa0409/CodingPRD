            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-V33", original_balance_usd: 12000000, current_principal_balance_usd: 10000000, note_rate_pct: 6.0, monthly_debt_service_usd: 65000, maturity_date: "2029-06-01T00:00:00Z", securitization_value_usd: 15000000 }
