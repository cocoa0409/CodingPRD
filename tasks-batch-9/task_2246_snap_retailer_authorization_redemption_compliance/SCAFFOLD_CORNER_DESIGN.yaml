      - name: cmp_election_deadline_outranks_the_hardship_availability_gate
        claim_type: Priority Ordering
        grounds:
          - validations.priority_12_business_temporal
          - validations.priority_18_business_fiscal
          - errors.ERR_CMP_ELECTION_WINDOW_CLOSED
        excluded_because:
          difficulty_instance: cmp_election_deadline_priority_12_beats_hardship_gate_priority_18
          rationale: "The late election on a non-hardship store is asserted there to answer ERR_CMP_ELECTION_WINDOW_CLOSED rather than ERR_CMP_NOT_AVAILABLE, which is the only place that error code is reachable."

      - name: criterion_b_submit_at_exactly_fifty_percent_is_refused
        claim_type: Violation → Error
        grounds:
          - validations.priority_16_eligibility
          - errors.ERR_CRITERION_B_NOT_MET
        excluded_because:
          difficulty_instance: criterion_b_strict_boundary_at_exactly_five_thousand_bps
          rationale: "ERR_CRITERION_B_NOT_MET at exactly 5000 bps and the acceptance at 5001 are asserted as a boundary pair there."

      - name: anomaly_investigation_naming_an_unflagged_trigger_period_is_refused
        claim_type: Violation → Error
        grounds:
          - validations.priority_17_evidence
          - errors.ERR_TRIGGER_PERIOD_NOT_FLAGGED
        excluded_because:
          difficulty_instance: anomaly_investigation_requires_trigger_period_actually_at_flag_l3
          rationale: "That cross-entity-state instance triggers ERR_TRIGGER_PERIOD_NOT_FLAGGED from a FLAG_L2 period and then succeeds against the FLAG_L3 one."

      - name: ownership_transfer_is_blocked_by_predecessor_owner_cmp_debt
        claim_type: Violation → Error
        grounds:
          - validations.priority_20_business_integrity
          - errors.ERR_TRANSFER_CMP_OUTSTANDING
        excluded_because:
          difficulty_instance: reauthorization_approval_blocked_by_predecessor_owner_cmp_debt
          rationale: "ERR_TRANSFER_CMP_OUTSTANDING and the successful approval after the debt is paid are both asserted there."

      - name: inspector_and_terminal_interval_conflicts_and_the_store_slot_ceiling
        claim_type: Violation → Error
        grounds:
          - validations.priority_13_overlap
          - validations.priority_15_capacity
        excluded_because:
          difficulty_instance: terminal_deployment_closed_interval_touching_endpoint_collides
          rationale: "ERR_TERMINAL_ALREADY_COMMITTED is asserted there, ERR_INSPECTOR_WINDOW_CONFLICT by inspector_half_open_window_with_travel_buffer_boundary_one_minute_apart, and ERR_STORE_TERMINAL_SLOTS_EXCEEDED by store_terminal_slot_aggregate_capacity_allows_equality_refuses_third."

  - section: endpoints
    instances:
      - name: store_crud_round_trip_recomputes_criterion_b_and_bumps_the_version
        claim_type: Standard CRUD
        grounds:
          - endpoints.POST_/stores
          - endpoints.GET_/stores/{storeId}
          - endpoints.PATCH_/stores/{storeId}
          - endpoints.GET_/stores
          - calculations.criterion_b_staple_sales_share
        distinguishing_aspect: "The full create/read/update/list cycle on the one PATCH-able entity: the update re-derives staple_sales_bps from 5555 to exactly 5000, which flips criterion_b_pass to false because the rule is a strict greater-than, and the version advances by exactly one."
        test_recipe:
          setup:
            - "One owner."
          setup_api_calls:
            - *k_owner
          trigger:
            - call: "POST /stores"
              payload: { owner_id: "${owner_id}", store_name: "Rio Convenience", state_code: "TX", store_type: "CONVENIENCE", checkout_lane_count: 2, staple_shelf_linear_feet: 30, annual_gross_sales_cents: 36000000, annual_staple_sales_cents: 20000000, max_terminal_slots: 2, tax_rate_bps: 825, hardship_designated: true }
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { crud_store_id: $.data.id, crud_store_v: $.data.version }
            - call: "GET /stores/${crud_store_id}"
              payload: {}
              as: RetailerOwner
              as_user_id: "${owner_id}"
            - call: "PATCH /stores/${crud_store_id}"
              payload: { expected_store_version: "${crud_store_v}", store_name: "Rio Convenience #1", annual_staple_sales_cents: 18000000 }
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { crud_store_v2: $.data.version }
            - call: "GET /stores?owner_id=${owner_id}&store_type=CONVENIENCE&limit=10&offset=0"
              payload: {}
              as: RetailerOwner
              as_user_id: "${owner_id}"
          assert:
            - "the create is 201; the read, the patch and the list are all 200"
            - "on create staple_sales_bps == 5555 and criterion_b_pass == true"
            - "the read returns exactly the created row including tax_rate_bps == 825 and hardship_designated == true"
            - "after the patch staple_sales_bps == 5000 and criterion_b_pass == false (strict > 5000 fails at equality)"
            - "${crud_store_v2} == ${crud_store_v} + 1 and updated_at > created_at"
            - "the list returns total_count == 1, has_more == false and the patched store_name Rio Convenience #1"
            - "no DELETE route exists for Store; withdrawal is a state transition, not a delete"

      - name: equipment_order_action_endpoints_place_fulfill_and_cancel
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/equipment-orders/{orderId}/place
          - endpoints.POST_/equipment-orders/{orderId}/fulfill
