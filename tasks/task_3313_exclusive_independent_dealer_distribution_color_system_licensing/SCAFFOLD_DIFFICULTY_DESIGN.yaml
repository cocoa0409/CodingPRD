        grounds:
          - state_machines.EquipmentUnit.CALIBRATED_to_INSTALLED
          - state_machines.ColorLicense.ACTIVE_to_SUSPENDED
          - validations[priority=7]
        distinguishing_aspect: |
          Depth-3 chain across three entities: FAIL calibration mutates
          EquipmentUnit (CALIBRATED -> INSTALLED); that mutation itself
