      - name: violation_approving_a_prohibited_category_finding_returns_prohibited_category_blocked
        claim_type: Violation → Error
        grounds:
          - validations[priority=50].ERR_PROHIBITED_CATEGORY_BLOCKED
          - calculations.screening_disposition
        distinguishing_aspect: |
          A PROHIBITED rule matched below its auto threshold reaches a human queue rather
          than an automatic disapproval, and the priority 50 rule is what stops the human
          from approving it: APPROVE is 422 while DISAPPROVE on the identical task succeeds,
          and the rejected APPROVE must leave the task CLAIMED with no notice written.
        test_recipe:
          setup:
            - "Rule PROH_WEAPONS (PROHIBITED, weight 12.00, requires_certification false, auto 0.95, manual 0.20, default_queue STANDARD) with no country override, so strictest_disposition is BLOCKED by class default."
            - "One verified advertiser, one reviewer on STANDARD authorised for US."
