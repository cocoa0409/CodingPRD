              payload: { name: "C9", jurisdiction_code: "CA", jurisdiction_registration_number: "CA-PAD-009", medical_director_id: "md-pending", response_time_target_seconds: 240 }
              as: PlatformAdmin
              captures: { campus_id: $.data.id }
            - call: "POST /api/responders"
              payload: { campus_id: "${campus_id}", full_name: "MD1", badge_number: "MD-9a", responder_role: "MEDICAL_DIRECTOR" }
              as: ProgramManager
              captures: { md1: $.data.id }
