              payload: { amending_item_id: "${itemA}", reference_item_id: "${itemB}", new_case_price_cents: 113000, new_unit_price_cents: 10400, expected_schedule_version: "${v1}" }
              as: FilingAgent
              as_user_id: "${agentA}"
              captures: { amend2: $.data.id }
          assert:
            - "The first amendment returns HTTP 201 with status == \"PENDING\"."
            - "The replay with ${v0} returns HTTP 412 with data.error_id == \"ERR_STALE_SCHEDULE_VERSION\" and creates nothing."
            - "${v1} is exactly one greater than ${v0}."
            - "The retry with ${v1} returns HTTP 201 and GET /price-schedules/${schedA} then reports a version exactly one greater than ${v1}."
            - "GET /hold-amendments?amending_item_id=${itemA} returns total_count == 2, both PENDING."
            - "GET /price-schedule-items/${itemA} still shows case_price_cents == 120000 — a PENDING amendment changes no price."

      - name: audit_creation_uses_the_wholesaler_version_which_an_unrelated_license_change_invalidates
        claim_type: optimistic_concurrency
        grounds: [concurrency_rules.audit-create-stale-wholesaler, "errors[ERR_STALE_WHOLESALER_VERSION]", "endpoints[POST /wholesalers/{id}/license-status]"]
        distinguishing_aspect: "The staleness source is a DIFFERENT endpoint touching the same aggregate: a license-status change the auditor never made bumps Wholesaler.version and invalidates a token captured beforehand. This distinguishes a real aggregate version from a per-endpoint or per-audit counter, and the successful retry must itself bump the version again because open_audit_count changes."
        test_recipe:
          setup:
            - "Wholesaler A exists with license_status ACTIVE and its version has been read once."
            - "No audit exists for period 2026-08."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-programs"
              payload: { state_code: "TX", program_name: "Texas Price Posting Program" }
              as: ComplianceOfficer
              captures: { prog: $.data.id }
            - call: "POST /wholesalers"
              payload: { license_number: "W-1001", legal_name: "Lone Star Distributing", state_program_id: "${prog}" }
              as: ComplianceOfficer
              captures: { whA: $.data.id }
            - call: "POST /licensee-users"
              payload: { wholesaler_id: "${whA}", full_name: "Agent A", user_role: "FILING_AGENT" }
              as: ComplianceOfficer
              captures: { agentA: $.data.id }
            - call: "POST /licensee-users"
              payload: { wholesaler_id: "${whA}", full_name: "Officer A", user_role: "CERTIFYING_OFFICER" }
              as: ComplianceOfficer
              captures: { certA: $.data.id }
            - call: "POST /brands"
              payload: { wholesaler_id: "${whA}", brand_name: "Rio Reserve", supplier_name: "Rio Supply Co", beverage_class: "SPIRITS", registration_effective_from: "2026-01-01T00:00:00Z", registration_expires_on: "2027-12-31T23:59:59Z" }
              as: FilingAgent
              as_user_id: "${agentA}"
              captures: { brandA: $.data.id }
            - call: "POST /brands/${brandA}/approve"
              as: ComplianceOfficer
            - call: "GET /wholesalers/${whA}"
              as: ComplianceOfficer
              captures: { v0: $.data.version }
          trigger:
            - call: "POST /wholesalers/${whA}/license-status"
              payload: { license_status: "SUSPENDED" }
              as: ComplianceOfficer
            - call: "POST /compliance-audits"
              payload: { wholesaler_id: "${whA}", state_program_id: "${prog}", audit_period_month: "2026-08", expected_wholesaler_version: "${v0}" }
              as: ComplianceOfficer
              captures: { e1: $.data.error_id }
            - call: "GET /wholesalers/${whA}"
              as: ComplianceOfficer
              captures: { v1: $.data.version }
            - call: "POST /compliance-audits"
              payload: { wholesaler_id: "${whA}", state_program_id: "${prog}", audit_period_month: "2026-08", expected_wholesaler_version: "${v1}" }
              as: ComplianceOfficer
              captures: { audit1: $.data.id }
          assert:
            - "The license-status call returns HTTP 200 with license_status == \"SUSPENDED\"."
            - "${v1} is exactly one greater than ${v0}."
            - "The audit create with ${v0} returns HTTP 412 with data.error_id == \"ERR_STALE_WHOLESALER_VERSION\" and GET /compliance-audits returns total_count == 0 afterwards."
            - "The audit create with ${v1} returns HTTP 201 with status == \"OPEN\", audit_period_month == \"2026-08\" and penalty_assessed_cents == 0."
            - "GET /wholesalers/${whA} then shows open_audit_count == 1 and a version exactly one greater than ${v1}."

      - name: approving_an_error_correction_cascades_through_the_item_the_tier_and_both_correction_counters
        claim_type: cascading_side_effects
        grounds: [state_machines.ErrorCorrection.transitions.PENDING_to_APPROVED, calculations.tier_discounted_case_price, entities.PriceSchedule.correction_count]
        distinguishing_aspect: "One approve must write four places at once — the item's prices, the item's and the schedule's correction_count, and the recomputed discounted_case_price of every ACTIVE tier hanging off that item — while withholding the repeat-correction penalty, which is due only when the schedule's count REACHES 2. A cascade that stops at the item, or that recomputes tiers lazily on read, is caught by the stored tier price."
        test_recipe:
          setup:
            - "Wholesaler A certified a 2026-09 schedule at 2026-08-01T00:00:00Z holding one item at 120000/11000 with an ACTIVE 10% tier at min_cases 5 (discounted 108000)."
            - "The clock is at 2026-08-05T00:00:00Z, inside the 15-day correction window."
            - "A PENDING correction to 114000/10500 (variance 0.05, within the 0.10 clerical limit) is on file."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-programs"
              payload: { state_code: "TX", program_name: "Texas Price Posting Program" }
              as: ComplianceOfficer
              captures: { prog: $.data.id }
            - call: "POST /wholesalers"
