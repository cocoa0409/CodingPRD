  # =========================================================================
  # §1.5 Endpoints
  # =========================================================================
  - section: endpoints
    instances:
      - name: patient_creation_read_and_listing_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints.POST_/patients
          - endpoints.GET_/patients/{id}
          - endpoints.GET_/patients
          - response_envelope.pagination_placement
        distinguishing_aspect: >-
          The create-read-list triple on the one entity that has no state machine: the read echoes
          every stored field including the system-initialised benefit_used_cents 0, and the list
          reports the plan filter and the four pagination fields in meta rather than in data.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; VSP-BASIC plan; one insured patient and one self-pay patient already registered."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
