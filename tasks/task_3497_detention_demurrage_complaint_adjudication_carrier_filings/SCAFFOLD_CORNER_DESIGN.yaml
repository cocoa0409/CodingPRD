              as_user_id: "${carrier_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the second B1 fails: 409 ERR_DUPLICATE_BOND_REF"
            - "GET /fmc/carriers/${carrier_id}/oti-licenses shows total_available_coverage_cents == 1000000 (only the first bond) and license_status == PENDING_BOND"

      - name: request_shape_violations_return_400_family
        claim_type: Violation → Error
        grounds:
          - validations[priority=5.5]
          - errors.ERR_INVALID_REQUEST
          - errors.ERR_INVALID_INVOICE_DATES
        distinguishing_aspect: "Scalar and coherence failures are 400s with specific ids: VIOLATION_FOUND without violation_count and SETTLED without settlement_amount_cents are ERR_INVALID_REQUEST; availability_date after return_date is ERR_INVALID_INVOICE_DATES; a non-Monday week_start is ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Standard carrier/shipper/tariff/invoice setup; a DOCKETED complaint in OMBUDS under om-1; a NOTICE_ISSUED proceeding."
          setup_api_calls:
            - *c_clock
            - *c_carrier
            - *c_shipper
            - *c_tariff
            - *c_clock3
            - *c_publish
            - *c_clock10
            - *c_invoice
            - call: "POST /fmc/complaints"
              payload: { respondent_carrier_id: "${carrier_id}", subject_invoice_ids: ["${inv_id}"], reparations_claimed_cents: 50000 }
              as: ShipperRep
              as_user_id: "${shipper_id}"
              captures: { comp_id: $.data.id }
            - call: "POST /fmc/complaints/${comp_id}/refer-ombuds"
              payload: { ombuds_officer_id: "om-1" }
              as: CommissionDocket
            - call: "POST /fmc/enforcement-proceedings"
              payload: { target_carrier_id: "${carrier_id}", basis: "TARIFF_VIOLATION" }
              as: EnforcementCounsel
              as_user_id: "ec-1"
              captures: { proc_id: $.data.id }
          trigger:
            - call: "POST /fmc/enforcement-proceedings/${proc_id}/determine"
              payload: { determination: "VIOLATION_FOUND" }
              as: AdministrativeLawJudge
              as_user_id: "alj-1"
              captures: { err_vc: $.data.error_id }
            - call: "POST /fmc/complaints/${comp_id}/close-ombuds"
              payload: { outcome: "SETTLED" }
              as: OmbudsOfficer
              as_user_id: "om-1"
              captures: { err_settle: $.data.error_id }
            - call: "POST /fmc/carriers/${carrier_id}/invoices"
              payload: { invoice_number: "INV-DATE-1", charge_basis: "TARIFF", tariff_id: "${t_id}", billed_party_shipper_id: "${shipper_id}", container_number: "MSKU9200008", port_code: "USNYC", availability_date: "2026-09-08T00:00:00Z", return_date: "2026-09-04T00:00:00Z", last_accrual_date: "2026-09-08T00:00:00Z" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { err_dates: $.data.error_id }
            - call: "POST /fmc/port-congestion-reports"
              payload: { port_code: "USHOU", terminal_code: "TERM-1", week_start: "2026-09-01T00:00:00Z", berth_occupancy_hours: 10, gate_closures_hours: 0, vessel_dwell_hours_avg: 5.0 }
              as: CommissionDocket
              captures: { err_week: $.data.error_id }
          assert:
            - "VIOLATION_FOUND without violation_count: 400 ERR_INVALID_REQUEST (proceeding stays NOTICE_ISSUED)"
            - "SETTLED without settlement_amount_cents: 400 ERR_INVALID_REQUEST (complaint stays OMBUDS)"
            - "availability after return: 400 ERR_INVALID_INVOICE_DATES"
            - "week_start 2026-09-01 (a Tuesday): 400 ERR_INVALID_REQUEST"

      - name: reduce_not_lower_and_deny_without_justification_rejected
        claim_type: Violation → Error
        grounds:
          - errors.ERR_REDUCED_AMOUNT_NOT_LOWER
          - errors.ERR_JUSTIFICATION_REQUIRED
          - state_machines.InvoiceDispute.PENDING_to_UPHELD_REDUCED
        distinguishing_aspect: "REDUCE requires a strictly lower amount (10000 -> 10000 fails ERR_REDUCED_AMOUNT_NOT_LOWER; 10000 -> 4000 succeeds and reprices the invoice) and DENY requires a justification — the dispute and invoice states move only on the accepted path."
        test_recipe:
          setup:
            - "Standard setup; two disputes on two identical 10000-cent invoices, both filed 2026-09-10 (timely responses)."
          setup_api_calls:
            - *c_clock
            - *c_carrier
            - *c_shipper
            - *c_tariff
            - *c_clock3
            - *c_publish
            - *c_clock10
            - *c_invoice
            - call: "POST /fmc/carriers/${carrier_id}/invoices"
              payload: { invoice_number: "INV-COR-4", charge_basis: "TARIFF", tariff_id: "${t_id}", billed_party_shipper_id: "${shipper_id}", container_number: "MSKU9200009", port_code: "USNYC", availability_date: "2026-09-04T00:00:00Z", return_date: "2026-09-08T00:00:00Z", last_accrual_date: "2026-09-08T00:00:00Z" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { inv4: $.data.id }
            - call: "POST /fmc/invoices/${inv_id}/disputes"
              payload: { dispute_reason: "CHARGE_EXCEEDS_PUBLISHED" }
              as: ShipperRep
              as_user_id: "${shipper_id}"
              captures: { d1: $.data.id }
            - call: "POST /fmc/invoices/${inv4}/disputes"
              payload: { dispute_reason: "OTHER" }
              as: ShipperRep
              as_user_id: "${shipper_id}"
              captures: { d2: $.data.id }
          trigger:
            - call: "POST /fmc/invoice-disputes/${d1}/respond"
              payload: { resolution: "REDUCE", reduced_amount_cents: 10000 }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { err_same: $.data.error_id }
            - call: "POST /fmc/invoice-disputes/${d2}/respond"
              payload: { resolution: "DENY" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { err_deny: $.data.error_id }
            - call: "POST /fmc/invoice-disputes/${d1}/respond"
              payload: { resolution: "REDUCE", reduced_amount_cents: 4000 }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { res_reduce: $.data.resolution }
          assert:
            - "REDUCE to the same amount fails: 400 ERR_REDUCED_AMOUNT_NOT_LOWER (dispute stays PENDING)"
            - "DENY without justification fails: 400 ERR_JUSTIFICATION_REQUIRED (dispute stays PENDING)"
            - "the accepted REDUCE resolves InvoiceDispute.${d1} as UPHELD_REDUCED with resolved_amount_cents == 4000, and Invoice.${inv_id} returns to ISSUED with amount_cents == 4000"

      - name: complaint_over_voided_invoice_rejected_not_actionable
        claim_type: Violation → Error
        grounds:
          - validations[priority=6.5]
          - errors.ERR_INVOICE_NOT_ACTIONABLE
        distinguishing_aspect: "A VOIDED invoice leaves nothing to adjudicate: a complaint naming it fails 409 ERR_INVOICE_NOT_ACTIONABLE even though the invoice exists and the party matches."
        test_recipe:
          setup:
            - "Standard invoice VOIDED via a timely WAIVE dispute response; clock 2026-09-10."
          setup_api_calls:
            - *c_clock
            - *c_carrier
            - *c_shipper
            - *c_tariff
            - *c_clock3
            - *c_publish
            - *c_clock10
            - *c_invoice
            - call: "POST /fmc/invoices/${inv_id}/disputes"
              payload: { dispute_reason: "MISSING_ELEMENTS" }
              as: ShipperRep
              as_user_id: "${shipper_id}"
              captures: { d1: $.data.id }
            - call: "POST /fmc/invoice-disputes/${d1}/respond"
              payload: { resolution: "WAIVE" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
          trigger:
            - call: "POST /fmc/complaints"
              payload: { respondent_carrier_id: "${carrier_id}", subject_invoice_ids: ["${inv_id}"], reparations_claimed_cents: 10000 }
              as: ShipperRep
              as_user_id: "${shipper_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVOICE_NOT_ACTIONABLE"

      - name: suspended_contract_blocks_service_contract_invoicing
        claim_type: Violation → Error
        grounds:
          - validations[priority=6.5]
          - state_machines.ServiceContract.EFFECTIVE_to_SUSPENDED
          - errors.ERR_CONTRACT_NOT_EFFECTIVE
        distinguishing_aspect: "The bond cascade's third hop is itself a live gate: after a small draw suspends the NVOCC's license and its contract, SERVICE_CONTRACT-basis invoicing fails 409 ERR_CONTRACT_NOT_EFFECTIVE until a reversal restores both."
        test_recipe:
          setup:
            - "NVOCC carrier with ACTIVE license (7500000 bond) and EFFECTIVE contract for the shipper; clock 2026-09-10."
          setup_api_calls:
            - *c_clock
            - call: "POST /fmc/carriers"
              payload: { org_name: "Gate NVOCC", org_type: "NVOCC" }
              as: CommissionAdmin
              captures: { carrier_id: $.data.id }
            - *c_shipper
            - call: "POST /fmc/carriers/${carrier_id}/oti-licenses"
              payload: { license_type: "NVOCC" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { lic_id: $.data.id }
            - call: "POST /fmc/oti-licenses/${lic_id}/surety-bonds"
              payload: { bond_ref: "B1", surety_name: "Pacific Surety", coverage_cents: 7500000 }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { lic_v: $.data.version }
            - *c_clock3
            - *c_contract
            - *c_clock10
            - call: "POST /fmc/oti-licenses/${lic_id}/draws"
              payload: { bond_ref: "B1", amount_cents: 100, reason: "small claim", expected_license_version: "${lic_v}" }
              as: EnforcementCounsel
              as_user_id: "ec-1"
              captures: { lic_v2: $.data.version }
          trigger:
            - call: "POST /fmc/carriers/${carrier_id}/invoices"
              payload: { invoice_number: "INV-GATED-1", charge_basis: "SERVICE_CONTRACT", service_contract_id: "${sc_id}", billed_party_shipper_id: "${shipper_id}", container_number: "MSKU9200010", port_code: "USNYC", availability_date: "2026-09-04T00:00:00Z", return_date: "2026-09-09T00:00:00Z", last_accrual_date: "2026-09-09T00:00:00Z" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { err_gated: $.data.error_id }
            - call: "POST /fmc/oti-licenses/${lic_id}/draws"
              payload: { bond_ref: "B1", amount_cents: -100, reason: "claim repaid", expected_license_version: "${lic_v2}" }
              as: EnforcementCounsel
              as_user_id: "ec-1"
            - call: "POST /fmc/carriers/${carrier_id}/invoices"
              payload: { invoice_number: "INV-GATED-2", charge_basis: "SERVICE_CONTRACT", service_contract_id: "${sc_id}", billed_party_shipper_id: "${shipper_id}", container_number: "MSKU9200011", port_code: "USNYC", availability_date: "2026-09-04T00:00:00Z", return_date: "2026-09-09T00:00:00Z", last_accrual_date: "2026-09-09T00:00:00Z" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { inv_gated: $.data.id }
          assert:
            - "while the contract is SUSPENDED (license lost coverage): 409 ERR_CONTRACT_NOT_EFFECTIVE"
            - "after the 100-cent reversal restores coverage (license ACTIVE, contract EFFECTIVE again): 201 and Invoice.${inv_gated}.amount_cents == 24000"

  # ===========================================================================
  - section: rbac
    instances:

      - name: role_denials_return_insufficient_permissions
        claim_type: Violation → Error
        grounds:
          - validations[priority=2]
          - roles.CarrierRep
          - roles.ShipperRep
          - roles.OmbudsOfficer
          - errors.ERR_INSUFFICIENT_PERMISSIONS
        distinguishing_aspect: "Role exclusivity is enforced before existence: ShipperRep creating a carrier, CarrierRep determining a proceeding, and OmbudsOfficer referring to ombuds each get 403 ERR_INSUFFICIENT_PERMISSIONS even with fabricated path ids."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z; one shipper exists for a realistic X-User-ID."]
          setup_api_calls:
            - *c_clock
            - *c_shipper
          trigger:
            - call: "POST /fmc/carriers"
              payload: { org_name: "Shipper Pretending", org_type: "VOCC" }
              as: ShipperRep
              as_user_id: "${shipper_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /fmc/enforcement-proceedings/00000000-0000-4000-8000-000000000000/determine"
              payload: { determination: "VIOLATION_FOUND", violation_count: 1, willful: false }
              as: CarrierRep
              as_user_id: "00000000-0000-4000-8000-000000000000"
              captures: { err2: $.data.error_id }
            - call: "POST /fmc/complaints/00000000-0000-4000-8000-000000000000/refer-ombuds"
              payload: { ombuds_officer_id: "om-x" }
              as: OmbudsOfficer
              as_user_id: "om-x"
              captures: { err3: $.data.error_id }
          assert:
            - "all three responses are 403 with error_id == ERR_INSUFFICIENT_PERMISSIONS (role check precedes the 404 the fabricated ids would otherwise earn)"

      - name: ownership_identity_mismatches_return_forbidden
        claim_type: Violation → Error
        grounds:
          - validations[priority=3]
          - errors.ERR_FORBIDDEN_RESOURCE_ACCESS
        distinguishing_aspect: "Entity-backed identity binds to the resource owner: carrier B cannot invoice on carrier A's path or answer A's dispute; ombuds officer om-2 cannot close om-1's round; shipper S2 cannot dispute or pay S1's invoice — all 403 ERR_FORBIDDEN_RESOURCE_ACCESS."
        test_recipe:
          setup:
            - "Carrier A with PUBLISHED tariff and one DISPUTED invoice billed to S1 (dispute open); carrier B and shipper S2 exist; a complaint in OMBUDS under om-1."
          setup_api_calls:
            - *c_clock
            - *c_carrier
            - *c_shipper
            - call: "POST /fmc/shippers"
              payload: { company_name: "Stranger Shippers", contact_email: "ops@stranger.example" }
              as: CommissionAdmin
              captures: { shipper2_id: $.data.id }
            - call: "POST /fmc/carriers"
              payload: { org_name: "Interloper Lines", org_type: "VOCC" }
              as: CommissionAdmin
              captures: { carrier_b: $.data.id }
            - *c_tariff
            - *c_clock3
            - *c_publish
            - *c_clock10
            - *c_invoice
            - call: "POST /fmc/invoices/${inv_id}/disputes"
              payload: { dispute_reason: "OTHER" }
              as: ShipperRep
              as_user_id: "${shipper_id}"
              captures: { d1: $.data.id }
            - call: "POST /fmc/complaints"
              payload: { respondent_carrier_id: "${carrier_id}", subject_invoice_ids: ["${inv_id}"], reparations_claimed_cents: 50000 }
              as: ShipperRep
              as_user_id: "${shipper_id}"
              captures: { comp_id: $.data.id }
            - call: "POST /fmc/complaints/${comp_id}/refer-ombuds"
              payload: { ombuds_officer_id: "om-1" }
              as: CommissionDocket
          trigger:
            - call: "POST /fmc/carriers/${carrier_id}/invoices"
              payload: { invoice_number: "INV-STEAL-1", charge_basis: "TARIFF", tariff_id: "${t_id}", billed_party_shipper_id: "${shipper_id}", container_number: "MSKU9300001", port_code: "USNYC", availability_date: "2026-09-04T00:00:00Z", return_date: "2026-09-08T00:00:00Z", last_accrual_date: "2026-09-08T00:00:00Z" }
              as: CarrierRep
              as_user_id: "${carrier_b}"
              captures: { err_path: $.data.error_id }
            - call: "POST /fmc/invoice-disputes/${d1}/respond"
              payload: { resolution: "WAIVE" }
              as: CarrierRep
              as_user_id: "${carrier_b}"
              captures: { err_respond: $.data.error_id }
            - call: "POST /fmc/complaints/${comp_id}/close-ombuds"
              payload: { outcome: "FAILED" }
              as: OmbudsOfficer
              as_user_id: "om-2"
              captures: { err_officer: $.data.error_id }
            - call: "POST /fmc/invoices/${inv_id}/disputes"
              payload: { dispute_reason: "OTHER" }
              as: ShipperRep
              as_user_id: "${shipper2_id}"
              captures: { err_dispute: $.data.error_id }
            - call: "POST /fmc/invoices/${inv_id}/mark-paid"
              payload: {}
              as: ShipperRep
              as_user_id: "${shipper2_id}"
              captures: { err_pay: $.data.error_id }
          assert:
            - "all five responses are 403 with error_id == ERR_FORBIDDEN_RESOURCE_ACCESS"
            - "the dispute stays PENDING, the invoice stays DISPUTED, and the complaint stays OMBUDS"

      - name: adjudicator_conflict_bars_former_ombuds_officer
        claim_type: Violation → Error
        grounds:
          - validations[priority=11]
          - errors.ERR_ADJUDICATOR_CONFLICT
          - roles.AdministrativeLawJudge
          - roles.OmbudsOfficer
        distinguishing_aspect: "Segregation of duties: the officer who ran the most recent ombuds round (om-7) may not open formal adjudication on the same complaint — 403 ERR_ADJUDICATOR_CONFLICT — while a different judge (alj-9) may."
        test_recipe:
          setup:
            - "Complaint back in DOCKETED after a FAILED ombuds round run by officer om-7."
          setup_api_calls:
            - *c_clock
            - *c_carrier
            - *c_shipper
            - *c_tariff
            - *c_clock3
            - *c_publish
            - *c_clock10
            - *c_invoice
            - call: "POST /fmc/complaints"
              payload: { respondent_carrier_id: "${carrier_id}", subject_invoice_ids: ["${inv_id}"], reparations_claimed_cents: 50000 }
              as: ShipperRep
              as_user_id: "${shipper_id}"
              captures: { comp_id: $.data.id }
            - call: "POST /fmc/complaints/${comp_id}/refer-ombuds"
              payload: { ombuds_officer_id: "om-7" }
              as: CommissionDocket
            - call: "POST /fmc/complaints/${comp_id}/close-ombuds"
              payload: { outcome: "FAILED" }
              as: OmbudsOfficer
