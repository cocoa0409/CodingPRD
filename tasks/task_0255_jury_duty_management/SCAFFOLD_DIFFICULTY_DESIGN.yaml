  - rule_id: resource_temporal_overlap
    instances:
      - name: checkin_same_service_date_rejected
        grounds:
          - validations[priority=41]
          - state_machines.Summons.REPORTING_to_REPORTING
          - entities.CheckIn.fields.service_date
        distinguishing_aspect: |
          Point-interval (single calendar day) overlap on the Summons check-in stream: two
          CheckIns may not share the same service_date (exact-day equality collision), enforced
