  # =====================================================================
  # RULE 3 — non_linear_state_machine
  # Differentiation: three different entities — SupportCase (three parallel
  # dimensions), PaternityAction (a true cycle AOP_SIGNED -> AOP_RESCINDED ->
  # AOP_SIGNED with a bounded loop count), IncomeWithholdingOrder (two
  # independent dimensions on one row).
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: case_parallel_dimensions_evolve_independently
        grounds:
          - state_machines.SupportCase.case_status
          - state_machines.SupportCase.enforcement_posture.NORMAL_to_ESCALATED
          - state_machines.SupportCase.interstate_role.NONE_to_RESPONDING
          - state_machines.InterstateReferral.status.REGISTERED_to_ENFORCING
          - state_machines.EnforcementAction.status.NOTICE_SENT_to_ACTIVE
          - calculations.enforcement_eligibility_thresholds
          - entities.SupportCase.fields.enforcement_posture
          - entities.SupportCase.fields.interstate_role
        distinguishing_aspect: |
          SupportCase carries three orthogonal dimensions: registering a
          RESPONDING referral moves interstate_role NONE -> RESPONDING and
          activating a remedy moves enforcement_posture NORMAL -> ESCALATED,
          yet case_status stays ENFORCEMENT throughout — no single trigger
          advances more than one dimension of the case.
        test_recipe:
          setup:
            - "Clock starts at 2026-08-01T00:00:00Z."
            - "DIRECT_APPLICATION MN case, child_count 2, tanf_assistance false, good_cause_claim false; CP income 200000, NCP income 300000, both VERIFIED_WAGE_RECORD; NCP LOCATED."
            - "PRESUMED_MARITAL paternity; one CURRENT_SUPPORT MN order effective 2026-08-01 ENTERED at 75000, so case_status is ENFORCEMENT, enforcement_posture NORMAL and interstate_role NONE."
            - "Three OPEN CURRENT_SUPPORT charges of 75000 (due 2026-08-15, 2026-09-15, 2026-10-15), nothing paid: arrears_principal_cents 225000."
            - "Clock advanced to 2026-11-01T00:00:00Z with one accrual run, so statutory certified arrears are 226125."
            - "One RESPONDING interstate referral (other_state_code TX, child_home_state_code MN, transmittal_type ENFORCEMENT) registered, which picks the MN order as the controlling order."
            - "One CREDIT_BUREAU_REPORT enforcement action (threshold 100000) noticed on 2026-11-01, contest window closing 2026-12-01, never contested; clock then moved to 2026-12-02T00:00:00Z."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Rosa Vance", ssn_last4: "7171", residence_state_code: "MN", monthly_gross_income_cents: 200000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { cp_id: $.data.id }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Seth Vance", ssn_last4: "7272", residence_state_code: "MN", monthly_gross_income_cents: 300000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncp_id: $.data.id }
            - call: "POST /child-support/participants/${ncp_id}/locate-results"
              payload: { locate_outcome: "LOCATED" }
              as: CaseWorker
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", child_count: 2, tanf_assistance: false, good_cause_claim: false }
              as: CaseWorker
              captures: { case_id: $.data.id }
            - call: "POST /child-support/cases/${case_id}/paternity-actions"
              payload: { method: "PRESUMED_MARITAL" }
              as: CaseWorker
            - call: "POST /child-support/cases/${case_id}/orders"
              payload: { order_type: "CURRENT_SUPPORT", origin_state_code: "MN", effective_date: "2026-08-01" }
              as: CaseWorker
              captures: { order_id: $.data.id }
            - call: "POST /child-support/orders/${order_id}/guideline-calculation"
              payload: {}
              as: CaseWorker
            - call: "POST /child-support/orders/${order_id}/entry"
              payload: {}
              as: SupervisingAttorney
            - call: "POST /child-support/orders/${order_id}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-08-01", period_end_date: "2026-09-01", due_date: "2026-08-15" }
              as: FinanceOfficer
            - call: "POST /child-support/orders/${order_id}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-09-01", period_end_date: "2026-10-01", due_date: "2026-09-15" }
              as: FinanceOfficer
            - call: "POST /child-support/orders/${order_id}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-10-01", period_end_date: "2026-11-01", due_date: "2026-10-15" }
              as: FinanceOfficer
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/cases/${case_id}/accrual-runs"
              payload: {}
              as: FinanceOfficer
            - call: "POST /child-support/cases/${case_id}/interstate-referrals"
              payload: { direction: "RESPONDING", other_state_code: "TX", child_home_state_code: "MN", transmittal_type: "ENFORCEMENT" }
              as: InterstateLiaison
              captures: { ref_id: $.data.id, ref_st0: $.data.status }
            - call: "POST /child-support/interstate-referrals/${ref_id}/registration"
              payload: {}
              as: InterstateLiaison
              captures: { ref_st1: $.data.status, coi: $.data.controlling_order_id, cos: $.data.controlling_order_state_code }
            - call: "GET /child-support/cases/${case_id}"
              as: CaseWorker
              captures: { cs_mid: $.data.case_status, posture_mid: $.data.enforcement_posture, role_mid: $.data.interstate_role }
            - call: "POST /child-support/cases/${case_id}/enforcement-actions"
              payload: { action_type: "CREDIT_BUREAU_REPORT" }
              as: CaseWorker
              captures: { ea_id: $.data.id, certified: $.data.arrears_certified_snapshot_cents, thresh: $.data.eligibility_threshold_cents }
            - call: "POST /child-support/enforcement-actions/${ea_id}/notice"
              payload: {}
              as: CaseWorker
              captures: { deadline: $.data.contest_deadline_at }
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-02T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /child-support/enforcement-actions/${ea_id}/activation"
              payload: {}
              as: CaseWorker
              captures: { ea_st: $.data.status, remedy: $.data.remedy_applied, act_at: $.data.activated_at }
            - call: "GET /child-support/cases/${case_id}"
              as: CaseWorker
              captures: { cs_end: $.data.case_status, posture_end: $.data.enforcement_posture, role_end: $.data.interstate_role }
            - call: "GET /child-support/interstate-referrals/${ref_id}"
              as: InterstateLiaison
              captures: { ref_st2: $.data.status }
            - call: "GET /child-support/participants/${ncp_id}"
              as: CaseWorker
              captures: { cbr: $.data.credit_bureau_reported, lic: $.data.license_suspension_active, lien: $.data.lien_recorded }
          assert:
            - "${ref_st0} == \"DRAFT\""
            - "${ref_st1} == \"REGISTERED\""
            - "${coi} == ${order_id}  # the only ENTERED CURRENT_SUPPORT order, and it is a home-state (MN) order"
            - "${cos} == \"MN\""
            - "${cs_mid} == \"ENFORCEMENT\"   # registration did NOT move case_status"
            - "${posture_mid} == \"NORMAL\"   # registration did NOT move enforcement_posture"
            - "${role_mid} == \"RESPONDING\""
            - "${certified} == 226125  # 225000 principal + 1125 statutory_per_charge interest at 2026-11-01"
            - "${thresh} == 100000    # ENFORCEMENT_THRESHOLDS[CREDIT_BUREAU_REPORT]"
            - "${deadline} == \"2026-12-01T00:00:00Z\"  # notice_sent_at 2026-11-01 + 30 days"
            - "${ea_st} == \"ACTIVE\""
            - "${remedy} == true"
            - "${act_at} == \"2026-12-02T00:00:00Z\""
            - "${cs_end} == \"ENFORCEMENT\"   # activation did NOT move case_status either"
            - "${posture_end} == \"ESCALATED\""
            - "${role_end} == \"RESPONDING\"  # activation did NOT move interstate_role"
            - "${ref_st2} == \"ENFORCING\"    # the REGISTERED referral advanced because an EnforcementAction reached ACTIVE"
            - "${cbr} == true"
            - "${lic} == false  # only the CREDIT_BUREAU_REPORT flag is set"
            - "${lien} == false"

      - name: paternity_aop_rescission_cycle_returns_to_aop_signed
        grounds:
          - state_machines.PaternityAction.status.AOP_SIGNED_to_AOP_RESCINDED
          - state_machines.PaternityAction.status.AOP_RESCINDED_to_AOP_SIGNED
          - entities.PaternityAction.fields.rescission_count
          - entities.PaternityAction.fields.aop_signed_at
          - entities.PaternityAction.fields.rescission_deadline_at
          - validations[priority=29]
          - errors[ERR_RESCISSION_LIMIT]
        distinguishing_aspect: |
          PaternityAction cycles AOP_SIGNED -> AOP_RESCINDED -> AOP_SIGNED and
          the re-signature re-derives rescission_deadline_at from the clock, but
          the loop is bounded at RESCISSION_LIMIT 1, so the second rescission is
          refused with ERR_RESCISSION_LIMIT even though the statutory window is
          still open.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "DIRECT_APPLICATION MN case, child_count 1, tanf_assistance false; CP income 180000 VERIFIED_WAGE_RECORD; NCP income 240000 VERIFIED_WAGE_RECORD, LOCATED."
            - "One VOLUNTARY_ACKNOWLEDGMENT paternity action, so the case sits in PATERNITY_PENDING."
            - "The AOP is signed (notarised), rescinded once, then signed again — status back at AOP_SIGNED with rescission_count 1."
            - "The clock never moves, so the re-derived rescission_deadline_at is still in the future."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Tara Lund", ssn_last4: "8181", residence_state_code: "MN", monthly_gross_income_cents: 180000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { cp_id: $.data.id }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Uri Lund", ssn_last4: "8282", residence_state_code: "MN", monthly_gross_income_cents: 240000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncp_id: $.data.id }
            - call: "POST /child-support/participants/${ncp_id}/locate-results"
              payload: { locate_outcome: "LOCATED" }
              as: CaseWorker
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", child_count: 1, tanf_assistance: false, good_cause_claim: false }
              as: CaseWorker
              captures: { case_id: $.data.id, cs0: $.data.case_status }
            - call: "POST /child-support/cases/${case_id}/paternity-actions"
              payload: { method: "VOLUNTARY_ACKNOWLEDGMENT" }
              as: CaseWorker
              captures: { pa_id: $.data.id, pa_st0: $.data.status }
            - call: "POST /child-support/paternity-actions/${pa_id}/acknowledgment"
              payload: { notary_verified: true, signed_by_participant_id: "${ncp_id}" }
              as: CaseWorker
              captures: { pa_st1: $.data.status, signed1: $.data.aop_signed_at, dl1: $.data.rescission_deadline_at }
            - call: "POST /child-support/paternity-actions/${pa_id}/rescission"
              payload: {}
              as: NoncustodialParty
              as_user_id: "${ncp_id}"
              captures: { pa_st2: $.data.status, rc1: $.data.rescission_count, signed2: $.data.aop_signed_at }
            - call: "POST /child-support/paternity-actions/${pa_id}/acknowledgment"
              payload: { notary_verified: true, signed_by_participant_id: "${ncp_id}" }
              as: CaseWorker
              captures: { pa_st3: $.data.status, signed3: $.data.aop_signed_at, dl3: $.data.rescission_deadline_at, rc2: $.data.rescission_count }
          trigger:
            - call: "POST /child-support/paternity-actions/${pa_id}/rescission"
              payload: {}
              as: NoncustodialParty
              as_user_id: "${ncp_id}"
              captures: { err: $.data.error_id }
            - call: "GET /child-support/paternity-actions/${pa_id}"
              as: CaseWorker
              captures: { pa_st4: $.data.status, rc3: $.data.rescission_count }
          assert:
            - "${cs0} == \"OPENED\""
            - "${pa_st0} == \"PENDING\""
            - "${pa_st1} == \"AOP_SIGNED\""
            - "${signed1} == \"2026-08-01T00:00:00Z\""
            - "${dl1} == \"2026-09-30T00:00:00Z\"  # aop_signed_at + 60 days"
            - "${pa_st2} == \"AOP_RESCINDED\""
            - "${rc1} == 1"
            - "${signed2} == null  # rescission clears aop_signed_at and rescission_deadline_at"
            - "${pa_st3} == \"AOP_SIGNED\"  # the cycle closes back on the same state"
            - "${signed3} == \"2026-08-01T00:00:00Z\""
            - "${dl3} == \"2026-09-30T00:00:00Z\"  # deadline re-derived from the clock, not inherited"
            - "${rc2} == 1  # re-signing does not reset the loop counter"
            - "${err} == \"ERR_RESCISSION_LIMIT\"  # HTTP 409; the window is still open (clock 2026-08-01 <= 2026-09-30) so priority 18 passes and priority 29 fires"
