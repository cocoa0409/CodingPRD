            - call: "POST /irb/protocols/${proto_id}/determinations"
              payload: { determined_review_level: "EXPEDITED" }
              as: IrbCoordinator
            - call: "POST /irb/protocols/${proto_id}/review-assignments"
              payload: { reviewer_id: "${rev_g}", reviewer_role: "PRIMARY" }
              as: IrbCoordinator
              captures: { asg_g: $.data.id }
            - call: "POST /irb/protocols/${proto_id}/review-assignments"
              payload: { reviewer_id: "${rev_h}", reviewer_role: "SECONDARY" }
              as: IrbCoordinator
              captures: { asg_h: $.data.id }
            - call: "POST /irb/review-assignments/${asg_g}/respond"
              payload: { response: "ACCEPT" }
              as: Reviewer
