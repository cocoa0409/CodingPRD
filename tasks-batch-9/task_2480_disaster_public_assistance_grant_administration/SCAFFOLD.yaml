# =============================================================================
# PRD Benchmark Seed Tables — Disaster Public Assistance Grant Administration
# §1.0–§1.7 (scaffold_difficulty_design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
#            scaffold_corner_design lives in SCAFFOLD_CORNER_DESIGN.yaml)
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2480. Disaster Public Assistance Grant Administration (state emergency management public assistance program): disaster declaration and incident period definition with damage assessment data collection, applicant eligibility across local governments, tribes and private nonprofits with facility eligibility screening, project formulation by category with small and large project thresholds, cost eligibility review including force account labor, equipment rates and contracted work procurement compliance, insurance requirement and duplication of benefits reduction, mitigation measure funding attached to repair projects, obligation, drawdown and quarterly progress reporting, closeout, audit and deobligation appeals

domain_name: disaster-public-assistance
api_prefix: /public-assistance

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Thirteen peer entities linked by explicit foreign keys; every collection is a
  # top-level path segment under /public-assistance (no nested resource URLs
  # beyond action sub-paths). Ownership is expressed by FK fields, not by URL
  # nesting, so cross-aggregate references (CostLineItem -> Contract,
  # Appeal -> Appeal) are first-class rather than special cases.

  state_machine_shape: cyclic
  # Project cycles UNDER_REVIEW -> RFI_ISSUED -> UNDER_REVIEW (bounded at 2 RFI
  # rounds). Deobligation cycles PROPOSED -> FINAL -> PROPOSED when an Appeal is
  # REMANDED, which puts the withdrawn money back on the obligation ledger.
  # Facility cycles INELIGIBLE -> PENDING -> ELIGIBLE via re-screening.
  # ProgressReport cycles DELINQUENT -> SUBMITTED. Applicant carries three
  # independent (orthogonal) status dimensions on one row, one of which
  # (drawdown_status) oscillates ACTIVE <-> SUSPENDED. Appeal, Project cost
  # review, DamageAssessmentSite validation and Drawdown disbursement are
  # branching fork points with divergent side-effect sets per branch.

  relationship_patterns:
    - one_to_many          # Disaster -> Applicant -> Facility -> DamageAssessmentSite / Project
    - self_referential     # Appeal.prior_appeal_id -> Appeal.id (second-level appeals)
    - cross_aggregate      # CostLineItem -> ForceAccountResource / Contract (sibling aggregates)
    - polymorphic_optional # CostLineItem carries either a resource FK or a contract FK by cost_type

  role_model: segregation_of_duties
  # Two hard separations, both keyed on X-User-ID within the same role:
  #   (1) the GrantsOfficer user who obligated a Project may not disburse a
  #       Drawdown against that Project;
  #   (2) the user who determined a Deobligation may not decide an Appeal
  #       against it (an AppealsAdjudicator who also holds GrantsOfficer duty).
  # Layered on peer roles: ApplicantAgent owns applicant-side records,
  # ProgramSpecialist owns eligibility/cost review, GrantsOfficer owns the
  # obligation ledger, StateAuditor owns closeout certification.

  consistency_model: immediate
  # Every cascade (obligation ledger, audit threshold, monitoring escalation,
  # report creation, insurance re-allocation, deobligation, suspension) is
  # applied inside the triggering request and observable in its response.

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Disaster
    parent: null
    common_fields: true
    fields:
      - { name: declaration_number, type: string, source: input, description: "Federal declaration number, globally unique", constraints: "non-empty; unique across all Disaster rows" }
      - { name: state_code, type: string, source: input, description: "Two-letter state or territory code owning the declaration", constraints: "exactly 2 uppercase letters" }
      - { name: incident_type, type: enum, source: input, description: "Incident type driving eligibility of emergency work", constraints: "SEVERE_STORM | FLOOD | WILDFIRE | HURRICANE | EARTHQUAKE" }
      - { name: incident_start_at, type: datetime, source: input, description: "First instant of the incident period (inclusive)" }
      - { name: incident_end_at, type: datetime, source: input, description: "Last instant of the incident period (inclusive); may be extended forward only" }
      - { name: population, type: integer, source: input, description: "Population of the declared area, denominator of the per-capita indicator", constraints: ">= 1" }
      - { name: federal_cost_share_pct, type: number, source: input, default: 0.75, description: "Federal share of eligible cost applied at obligation", constraints: "one of 0.75, 0.90, 1.00" }
      - { name: small_project_threshold_cents, type: integer, source: input, default: 4000000, description: "Repair-basis value at or above which a Project is LARGE", constraints: ">= 1" }
      - { name: status, type: enum, source: system, default: DECLARED, description: "DECLARED | OBLIGATION_CLOSED", constraints: "DECLARED | OBLIGATION_CLOSED" }
      - { name: total_validated_loss_cents, type: integer, source: computed, default: 0, description: "Sum of validated_loss_cents over VALIDATED damage sites in this declaration" }
      - { name: per_capita_impact_cents, type: integer, source: computed, default: 0, description: "floor(total_validated_loss_cents / population)" }
      - { name: indicator_met, type: boolean, source: computed, default: false, description: "true when per_capita_impact_cents >= PER_CAPITA_INDICATOR_CENTS" }
      - { name: total_obligated_cents, type: integer, source: computed, default: 0, description: "Sum of Applicant.total_obligated_cents for this declaration" }
      - { name: total_drawn_cents, type: integer, source: computed, default: 0, description: "Sum of Applicant.cash_on_hand_cents for this declaration" }
      - { name: enhanced_monitoring_applicant_count, type: integer, source: computed, default: 0, description: "Count of Applicants under this Disaster with monitoring_status == ENHANCED" }
      - { name: suspended_applicant_count, type: integer, source: computed, default: 0, description: "Count of Applicants under this Disaster with drawdown_status == SUSPENDED" }

  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - { name: disaster_id, type: string, source: input, description: "FK -> Disaster.id; declaration this applicant is registered under" }
      - { name: name, type: string, source: input, description: "Legal name of the applicant entity", constraints: "non-empty" }
      - { name: applicant_type, type: enum, source: input, description: "Statutory applicant class", constraints: "LOCAL_GOVERNMENT | TRIBE | STATE_AGENCY | PRIVATE_NONPROFIT" }
      - { name: pnp_service_type, type: enum, source: input, default: null, description: "Service class for private nonprofits; null for public applicants", constraints: "CRITICAL | ESSENTIAL_NON_CRITICAL | NON_ELIGIBLE | null" }
      - { name: pnp_sba_referral_completed, type: boolean, source: input, default: false, description: "SBA disaster-loan referral completed; prerequisite for ESSENTIAL_NON_CRITICAL PNP eligibility" }
      - { name: tax_exempt_letter_on_file, type: boolean, source: input, default: false, description: "IRS tax-exempt determination letter on file; prerequisite for any PNP facility" }
      - { name: population_served, type: integer, source: input, description: "Population served by the applicant", constraints: ">= 0" }
      - { name: eligibility_status, type: enum, source: system, default: PENDING, description: "Dimension 1 of three orthogonal status dimensions", constraints: "PENDING | ELIGIBLE | INELIGIBLE" }
      - { name: eligibility_rationale, type: string, source: system, default: null, description: "Rationale recorded with the eligibility determination" }
      - { name: monitoring_status, type: enum, source: computed, default: STANDARD, description: "Dimension 2; escalates to ENHANCED and never returns to STANDARD", constraints: "STANDARD | ENHANCED" }
      - { name: drawdown_status, type: enum, source: computed, default: ACTIVE, description: "Dimension 3; oscillates ACTIVE <-> SUSPENDED as delinquency and pending deobligations appear and clear", constraints: "ACTIVE | SUSPENDED" }
      - { name: audit_requirement, type: enum, source: computed, default: NONE, description: "High-water mark: once SINGLE_AUDIT it never returns to NONE", constraints: "NONE | SINGLE_AUDIT" }
      - { name: risk_score_screening, type: number, source: computed, default: 0, description: "SCREENING variant of applicant_risk_score, 2 decimal places" }
      - { name: risk_score_monitoring, type: number, source: computed, default: null, description: "MONITORING variant of applicant_risk_score, 2 decimal places; null until first reporting sweep" }
      - { name: monitoring_scored_at, type: datetime, source: computed, default: null, description: "Logical-clock instant of the most recent MONITORING scoring" }
      - { name: risk_tier, type: enum, source: computed, default: LOW, description: "Tier of risk_score_monitoring when monitoring_scored_at is non-null, else of risk_score_screening", constraints: "LOW | MEDIUM | HIGH" }
      - { name: total_obligated_cents, type: integer, source: computed, default: 0, description: "Sum over this applicant's Projects of (federal_share_obligated_cents - deobligated_cents) for status IN {OBLIGATED, CLOSEOUT_REQUESTED, CLOSED}" }
      - { name: total_drawn_cents, type: integer, source: computed, default: 0, description: "Sum of Drawdown.approved_cents for status IN {PAID, REFUNDED}" }
      - { name: total_refunded_cents, type: integer, source: computed, default: 0, description: "Sum of Drawdown.refunded_cents for status == REFUNDED" }
      - { name: cash_on_hand_cents, type: integer, source: computed, default: 0, description: "total_drawn_cents - total_refunded_cents" }
      - { name: available_drawdown_cents, type: integer, source: computed, default: 0, description: "total_obligated_cents - cash_on_hand_cents" }
      - { name: pending_deobligation_cents, type: integer, source: computed, default: 0, description: "Sum of Deobligation.amount_cents for this applicant's Projects with status == PROPOSED" }
      - { name: delinquent_report_count, type: integer, source: computed, default: 0, description: "Count of this applicant's ProgressReports with status == DELINQUENT" }

  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id; owner of the facility" }
      - { name: name, type: string, source: input, description: "Facility name", constraints: "non-empty" }
      - { name: facility_type, type: enum, source: input, description: "Facility class", constraints: "ROAD_BRIDGE | WATER_CONTROL | BUILDING_EQUIPMENT | UTILITY | PARK_RECREATION | EMERGENCY_PROTECTIVE" }
      - { name: ownership, type: enum, source: input, description: "Ownership form used by facility screening", constraints: "PUBLIC | PNP_OWNED | LEASED" }
      - { name: in_active_use, type: boolean, source: input, default: true, description: "Facility was in active use at incident start" }
      - { name: legal_responsibility_documented, type: boolean, source: input, default: true, description: "Applicant's legal responsibility for repair is documented" }
      - { name: flood_zone, type: boolean, source: input, default: false, description: "Facility sits in a special flood hazard area" }
      - { name: prior_disaster_flood_damage, type: boolean, source: input, default: false, description: "Facility received flood assistance in a prior declaration (triggers the obtain-and-maintain insurance bar)" }
      - { name: eligibility_status, type: enum, source: computed, default: PENDING, description: "Result of facility_eligibility_screening; reset to PENDING by any attribute amendment", constraints: "PENDING | ELIGIBLE | INELIGIBLE" }
      - { name: screening_failure_reason, type: string, source: computed, default: null, description: "First failed screening rule, in the pinned cascade order", constraints: "null | LEGAL_RESPONSIBILITY_NOT_DOCUMENTED | NOT_IN_ACTIVE_USE | PNP_MUST_OWN_FACILITY | TAX_EXEMPT_DOCUMENTATION_MISSING | PNP_SERVICE_NOT_ELIGIBLE" }
      - { name: screened_at, type: datetime, source: computed, default: null, description: "Logical-clock instant of the most recent screening" }

  - name: DamageAssessmentSite
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; facility the damage was observed on" }
      - { name: category, type: enum, source: input, description: "Public Assistance work category of the observed damage", constraints: "A | B | C | D | E | F | G" }
      - { name: reported_loss_cents, type: integer, source: input, description: "Applicant-reported loss at data collection", constraints: ">= 0" }
      - { name: damage_observed_at, type: datetime, source: input, description: "Observation instant; must fall inside the declaration's incident period" }
      - { name: work_completed_pct, type: number, source: input, default: 0, description: "Share of repair work already complete at observation", constraints: "0 <= value <= 100" }
      - { name: validated_loss_cents, type: integer, source: computed, default: 0, description: "State-validated loss; 0 until VALIDATED and 0 forever if REJECTED" }
      - { name: validation_status, type: enum, source: system, default: REPORTED, description: "REPORTED | VALIDATED | REJECTED", constraints: "REPORTED | VALIDATED | REJECTED" }
      - { name: rejection_reason, type: string, source: system, default: null, description: "Reason recorded when the site is REJECTED" }

  - name: Project
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id; grantee of record" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; facility the scope of work repairs" }
      - { name: category, type: enum, source: input, description: "Work category", constraints: "A | B | C | D | E | F | G" }
      - { name: work_type, type: enum, source: computed, description: "EMERGENCY when category IN {A, B}, else PERMANENT", constraints: "EMERGENCY | PERMANENT" }
      - { name: title, type: string, source: input, description: "Project title", constraints: "non-empty" }
      - { name: scope_of_work, type: string, source: input, description: "Narrative scope of work", constraints: "non-empty" }
      - { name: estimated_repair_cost_cents, type: integer, source: input, description: "Applicant estimate of repair cost; basis of the PROVISIONAL variant", constraints: ">= 0" }
      - { name: mitigation_requested_cents, type: integer, source: input, default: 0, description: "Requested mitigation-measure funding attached to this repair project", constraints: ">= 0; <= estimated_repair_cost_cents" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Lifecycle state", constraints: "DRAFT | UNDER_REVIEW | RFI_ISSUED | VALIDATED | OBLIGATED | CLOSEOUT_REQUESTED | CLOSED | DENIED" }
      - { name: size_class, type: enum, source: computed, default: null, description: "SMALL below small_project_threshold_cents, LARGE at or above it; provisional at submit, re-derived at cost review", constraints: "null | SMALL | LARGE" }
      - { name: rfi_round_count, type: integer, source: system, default: 0, description: "Number of RFIs issued; capped at MAX_RFI_ROUNDS = 2" }
      - { name: last_rfi_question, type: string, source: system, default: null, description: "Text of the most recent RFI" }
      - { name: repair_eligible_cents, type: integer, source: computed, default: 0, description: "Obligation-basis repair cost fixed by project_review_basis at cost review" }
      - { name: anticipated_insurance_cents, type: integer, source: computed, default: 0, description: "Anticipated insurance proceeds on the current repair basis (duplication-of-benefits estimate)" }
      - { name: settlement_allocated_cents, type: integer, source: computed, default: 0, description: "Actual insurance proceeds allocated to this project by the settlement waterfall" }
      - { name: insurance_reduction_cents, type: integer, source: computed, default: 0, description: "max(anticipated_insurance_cents, settlement_allocated_cents); the reduction applied at obligation" }
      - { name: mitigation_approved_cents, type: integer, source: computed, default: 0, description: "Mitigation funding after the size-class cap; frozen at cost review and reused by the FINAL variant" }
      - { name: eligible_cost_provisional_cents, type: integer, source: computed, default: 0, description: "PROVISIONAL variant of project_eligible_cost (estimate basis, anticipated insurance)" }
      - { name: eligible_cost_final_cents, type: integer, source: computed, default: null, description: "FINAL variant of project_eligible_cost (documented-actuals basis, actual settlement proceeds)" }
      - { name: federal_share_obligated_cents, type: integer, source: computed, default: 0, description: "Federal share written to the obligation ledger at obligation" }
      - { name: federal_share_final_cents, type: integer, source: computed, default: null, description: "Federal share recomputed at closeout certification" }
      - { name: deobligated_cents, type: integer, source: computed, default: 0, description: "Sum of Deobligation.amount_cents with status == FINAL minus reversed_cents on this project" }
      - { name: pending_deobligation_cents, type: integer, source: computed, default: 0, description: "Sum of Deobligation.amount_cents with status == PROPOSED on this project" }
      - { name: closeout_variance_cents, type: integer, source: computed, default: null, description: "federal_share_final_cents - federal_share_obligated_cents at closeout certification" }
      - { name: cost_reviewed_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the ProgramSpecialist who validated or denied cost review" }
      - { name: obligated_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the GrantsOfficer who obligated the project; barred from disbursing its drawdowns" }
      - { name: denial_reason, type: string, source: system, default: null, description: "Reason recorded when cost review denies the project" }

  - name: CostLineItem
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; project the claimed cost belongs to" }
      - { name: cost_type, type: enum, source: input, description: "Claim class selecting the eligibility branch", constraints: "FORCE_ACCOUNT_LABOR | FORCE_ACCOUNT_EQUIPMENT | MATERIALS | CONTRACT" }
      - { name: force_account_resource_id, type: string, source: input, default: null, description: "FK -> ForceAccountResource.id; required for FORCE_ACCOUNT_LABOR and FORCE_ACCOUNT_EQUIPMENT, must be null otherwise" }
      - { name: contract_id, type: string, source: input, default: null, description: "FK -> Contract.id; required for CONTRACT, must be null otherwise" }
      - { name: claimed_cents, type: integer, source: input, description: "Amount claimed by the applicant", constraints: ">= 0" }
      - { name: work_start_at, type: datetime, source: input, description: "First instant of the charged work interval (inclusive)" }
      - { name: work_end_at, type: datetime, source: input, description: "Last instant of the charged work interval (inclusive); must be > work_start_at" }
      - { name: straight_time_hours, type: number, source: input, default: 0, description: "Straight-time hours charged (FORCE_ACCOUNT_LABOR)", constraints: ">= 0" }
      - { name: overtime_hours, type: number, source: input, default: 0, description: "Overtime hours charged (FORCE_ACCOUNT_LABOR)", constraints: ">= 0" }
      - { name: equipment_hours, type: number, source: input, default: 0, description: "Equipment operating hours charged (FORCE_ACCOUNT_EQUIPMENT)", constraints: ">= 0" }
      - { name: eligible_cents, type: integer, source: computed, default: 0, description: "Eligible amount from cost_line_item_eligible_cost" }
      - { name: review_status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED until reviewed; then ALLOWED, PARTIALLY_ALLOWED or DISALLOWED", constraints: "SUBMITTED | ALLOWED | PARTIALLY_ALLOWED | DISALLOWED" }
      - { name: disallowance_reason, type: string, source: computed, default: null, description: "Reason when eligible_cents is 0 or below claimed_cents", constraints: "null | STRAIGHT_TIME_NOT_ELIGIBLE_FOR_EMERGENCY_WORK | FRINGE_RATE_CAPPED | LESSER_OF_RATE_APPLIED | CLAIM_EXCEEDS_COMPUTED_COST | PROCUREMENT_NONCOMPLIANT | CONTRACT_AWARD_CEILING_REACHED" }
      - { name: reviewed_at, type: datetime, source: computed, default: null, description: "Logical-clock instant of the most recent review" }

  - name: ForceAccountResource
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id; owner of the labor or equipment resource" }
      - { name: resource_kind, type: enum, source: input, description: "LABOR for an employee, EQUIPMENT for an owned unit", constraints: "LABOR | EQUIPMENT" }
      - { name: label, type: string, source: input, description: "Employee name or equipment description", constraints: "non-empty" }
      - { name: employee_type, type: enum, source: input, default: null, description: "Required when resource_kind == LABOR, null otherwise", constraints: "PERMANENT | TEMPORARY | null" }
      - { name: base_hourly_rate_cents, type: integer, source: input, default: 0, description: "Straight-time hourly rate in cents (LABOR)", constraints: ">= 0" }
      - { name: fringe_benefit_pct, type: number, source: input, default: 0, description: "Fringe benefit rate as a fraction; capped by FRINGE_CAP_PCT at review", constraints: "0 <= value <= 1" }
      - { name: equipment_code, type: string, source: input, default: null, description: "Published equipment schedule code (EQUIPMENT)" }
      - { name: published_hourly_rate_cents, type: integer, source: input, default: 0, description: "Applicant's own published equipment rate (EQUIPMENT)", constraints: ">= 0" }
      - { name: schedule_hourly_rate_cents, type: integer, source: input, default: 0, description: "State equipment-rate schedule value (EQUIPMENT)", constraints: ">= 0" }
      - { name: charged_hours_total, type: number, source: computed, default: 0, description: "Sum of straight_time_hours + overtime_hours + equipment_hours over all CostLineItems referencing this resource" }

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id; contracting applicant" }
      - { name: vendor_name, type: string, source: input, description: "Awarded vendor", constraints: "non-empty" }
      - { name: contract_type, type: enum, source: input, description: "Procurement method used", constraints: "SEALED_BID | COMPETITIVE_PROPOSAL | NONCOMPETITIVE | SMALL_PURCHASE | TIME_AND_MATERIALS | COST_PLUS_PERCENTAGE_OF_COST" }
      - { name: award_amount_cents, type: integer, source: input, description: "Awarded contract value", constraints: ">= 0" }
      - { name: bids_received, type: integer, source: input, default: 0, description: "Number of responsive bids received", constraints: ">= 0" }
      - { name: advertised, type: boolean, source: input, default: false, description: "Solicitation was publicly advertised" }
      - { name: sole_source_justification_on_file, type: boolean, source: input, default: false, description: "Written sole-source justification on file" }
      - { name: debarment_check_completed, type: boolean, source: input, default: false, description: "Vendor exclusion (debarment) check completed" }
      - { name: awarded_at, type: datetime, source: input, description: "Award instant" }
      - { name: procurement_status, type: enum, source: system, default: PENDING_REVIEW, description: "PENDING_REVIEW until reviewed, then COMPLIANT or NONCOMPLIANT", constraints: "PENDING_REVIEW | COMPLIANT | NONCOMPLIANT" }
      - { name: noncompliance_reason, type: string, source: computed, default: null, description: "First failed procurement rule in the pinned cascade order", constraints: "null | PROHIBITED_CONTRACT_TYPE | TIME_AND_MATERIALS_CEILING_EXCEEDED | SOLE_SOURCE_UNJUSTIFIED | INADEQUATE_COMPETITION | DEBARMENT_CHECK_MISSING" }
      - { name: allowed_cost_total_cents, type: integer, source: computed, default: 0, description: "Sum of eligible_cents over CostLineItems referencing this contract with review_status IN {ALLOWED, PARTIALLY_ALLOWED}" }

  - name: InsurancePolicy
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; insured facility" }
      - { name: insurer_name, type: string, source: input, description: "Insurer of record", constraints: "non-empty" }
      - { name: policy_type, type: enum, source: input, description: "FLOOD satisfies the obtain-and-maintain bar; PROPERTY does not", constraints: "FLOOD | PROPERTY" }
      - { name: is_nfip, type: boolean, source: input, default: false, description: "Policy is written through the national flood insurance program" }
      - { name: coverage_limit_cents, type: integer, source: input, description: "Policy coverage limit", constraints: ">= 0" }
      - { name: deductible_cents, type: integer, source: input, default: 0, description: "Policy deductible", constraints: ">= 0" }
      - { name: effective_start_at, type: datetime, source: input, description: "First instant of coverage (inclusive)" }
      - { name: effective_end_at, type: datetime, source: input, description: "Last instant of coverage (inclusive)" }
      - { name: settlement_amount_cents, type: integer, source: computed, default: 0, description: "Recorded settlement proceeds (0 until a settlement is recorded)" }
      - { name: settled_at, type: datetime, source: computed, default: null, description: "Settlement instant supplied at recording" }
      - { name: allocated_cents, type: integer, source: computed, default: 0, description: "Portion of settlement_amount_cents absorbed by the waterfall" }
      - { name: unallocated_cents, type: integer, source: computed, default: 0, description: "settlement_amount_cents - allocated_cents (waterfall remainder)" }

  - name: Drawdown
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id; grantee drawing federal cash" }
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; obligated project the cash is drawn against" }
      - { name: requested_cents, type: integer, source: input, description: "Requested cash amount", constraints: ">= 1" }
      - { name: approved_cents, type: integer, source: computed, default: 0, description: "Amount disbursed; equals requested_cents when the disbursement decision is PAY, else 0" }
      - { name: refunded_cents, type: integer, source: computed, default: 0, description: "Amount returned by the compensating refund action" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | PAID | REJECTED | REFUNDED", constraints: "REQUESTED | PAID | REJECTED | REFUNDED" }
      - { name: disbursed_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the GrantsOfficer who disbursed; must differ from Project.obligated_by_user_id" }
      - { name: rejection_reason, type: string, source: system, default: null, description: "Reason recorded when the disbursement decision is REJECT" }

  - name: ProgressReport
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id; reporting grantee" }
      - { name: quarter_label, type: string, source: input, description: "Reporting quarter in YYYY-Qn form; unique per applicant", constraints: "matches ^\\d{4}-Q[1-4]$" }
      - { name: period_start_at, type: datetime, source: computed, description: "First instant of the quarter derived from quarter_label" }
      - { name: period_end_at, type: datetime, source: computed, description: "First instant of the following quarter (exclusive end)" }
      - { name: due_at, type: datetime, source: computed, description: "period_end_at + REPORT_GRACE_DAYS" }
      - { name: expenditures_to_date_cents, type: integer, source: input, default: 0, description: "Cumulative expenditures reported for the quarter", constraints: ">= 0" }
      - { name: pct_complete, type: number, source: input, default: 0, description: "Reported physical completion", constraints: "0 <= value <= 100" }
      - { name: submitted_at, type: datetime, source: computed, default: null, description: "Logical-clock instant of submission; null while DUE or DELINQUENT" }
      - { name: status, type: enum, source: system, default: DUE, description: "DUE when auto-created by monitoring escalation; SUBMITTED or LATE on filing; DELINQUENT after a sweep past due_at", constraints: "DUE | SUBMITTED | LATE | DELINQUENT" }

  - name: Deobligation
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; project whose obligation is reduced" }
      - { name: reason, type: enum, source: input, description: "Basis of the reduction", constraints: "CLOSEOUT_UNDERRUN | INSURANCE_DOB | DISALLOWED_COST | PROCUREMENT_NONCOMPLIANCE | SCOPE_REDUCTION" }
      - { name: amount_cents, type: integer, source: input, description: "Federal share to be withdrawn; supplied by the GrantsOfficer on manual creation and computed by the system on cascade creation", constraints: ">= 1; <= Project.federal_share_obligated_cents - Project.deobligated_cents - Project.pending_deobligation_cents" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "PROPOSED | FINAL | REVERSED", constraints: "PROPOSED | FINAL | REVERSED" }
      - { name: determined_by_user_id, type: string, source: system, description: "X-User-ID that created the determination; barred from deciding its appeals" }
      - { name: finalized_at, type: datetime, source: computed, default: null, description: "Logical-clock instant of finalization; reset to null when a REMANDED appeal sends the determination back to PROPOSED" }
      - { name: appeal_deadline_at, type: datetime, source: computed, default: null, description: "finalized_at + APPEAL_WINDOW_DAYS = 60 days; null while PROPOSED, and reset to null on remand" }
      - { name: reversed_cents, type: integer, source: computed, default: 0, description: "Amount restored by a granted appeal" }

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - { name: deobligation_id, type: string, source: input, description: "FK -> Deobligation.id; determination under appeal" }
      - { name: prior_appeal_id, type: string, source: input, default: null, description: "FK -> Appeal.id; the first-level appeal a second-level appeal escalates from, null for a first-level appeal" }
      - { name: level, type: enum, source: computed, description: "FIRST when prior_appeal_id is null, else SECOND", constraints: "FIRST | SECOND" }
      - { name: grounds, type: string, source: input, description: "Written grounds for the appeal", constraints: "non-empty" }
      - { name: relief_requested_cents, type: integer, source: input, description: "Federal share the applicant asks to have restored", constraints: ">= 1; <= Deobligation.amount_cents" }
      - { name: relief_granted_cents, type: integer, source: computed, default: 0, description: "Federal share actually restored by the decision" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | GRANTED | PARTIALLY_GRANTED | DENIED | REMANDED", constraints: "SUBMITTED | GRANTED | PARTIALLY_GRANTED | DENIED | REMANDED" }
      - { name: filed_at, type: datetime, source: computed, description: "Logical-clock instant of filing, compared against Deobligation.appeal_deadline_at" }
      - { name: decided_at, type: datetime, source: computed, default: null, description: "Logical-clock instant of the decision" }
      - { name: decided_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the adjudicator; must differ from Deobligation.determined_by_user_id" }
      - { name: decision_rationale, type: string, source: system, default: null, description: "Rationale recorded with the decision" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Disaster
    initial_state: DECLARED
    terminal_states: [OBLIGATION_CLOSED]
    transitions:
      - from: DECLARED
        to: OBLIGATION_CLOSED
        trigger: "POST /public-assistance/disasters/{disaster_id}/close-obligations"
        actor: PlatformAdmin
        preconditions:
          - "disaster.status == DECLARED"
          - "no Project P with P.applicant_id IN (Applicants of this disaster) AND P.status IN {UNDER_REVIEW, RFI_ISSUED} (else ERR_PROJECT_REVIEWS_OPEN)"
        side_effects:
          - "Disaster.status = OBLIGATION_CLOSED"
          - "increments Disaster.version by 1"
        note: "Compound gate: the parent transition is blocked by child Project states — every review under the declaration must have concluded first. A VALIDATED project may still be waiting for money, and once the declaration is OBLIGATION_CLOSED both POST /public-assistance/projects/{project_id}/obligate and POST /public-assistance/projects/{project_id}/submit under this declaration fail with ERR_DISASTER_NOT_OPEN."

  - entity: Applicant
    initial_state: "ELIGIBILITY:PENDING + MONITORING:STANDARD + DRAWDOWN:ACTIVE"
    terminal_states: ["ELIGIBILITY:INELIGIBLE"]
    transitions:
      - from: "ELIGIBILITY:PENDING"
        to: "ELIGIBILITY:ELIGIBLE"
        trigger: "POST /public-assistance/applicants/{applicant_id}/eligibility-determination with decision=ELIGIBLE"
        actor: ProgramSpecialist
        preconditions:
          - "applicant.eligibility_status == PENDING"
          - "if applicant.applicant_type == PRIVATE_NONPROFIT AND applicant.pnp_service_type == ESSENTIAL_NON_CRITICAL then applicant.pnp_sba_referral_completed == true (else ERR_PNP_SBA_REFERRAL_REQUIRED)"
        side_effects:
          - "Applicant.eligibility_status = ELIGIBLE; Applicant.eligibility_rationale = rationale"
          - "recompute applicant_risk_score SCREENING variant -> Applicant.risk_score_screening, Applicant.risk_tier"
          - "increments Applicant.version by 1"
      - from: "ELIGIBILITY:PENDING"
        to: "ELIGIBILITY:INELIGIBLE"
        trigger: "POST /public-assistance/applicants/{applicant_id}/eligibility-determination with decision=INELIGIBLE"
        actor: ProgramSpecialist
        preconditions:
          - "applicant.eligibility_status == PENDING"
        side_effects:
          - "Applicant.eligibility_status = INELIGIBLE; Applicant.eligibility_rationale = rationale"
          - "recompute applicant_risk_score SCREENING variant -> Applicant.risk_score_screening, Applicant.risk_tier"
          - "increments Applicant.version by 1"
        note: "Divergent branch: the INELIGIBLE branch performs no ledger work and permanently blocks project submission (ERR_APPLICANT_NOT_ELIGIBLE)."
      - from: "MONITORING:STANDARD"
        to: "MONITORING:ENHANCED"
        trigger: "system, inside POST /public-assistance/projects/{project_id}/obligate when the obligation ledger update pushes Applicant.total_obligated_cents to or past SINGLE_AUDIT_THRESHOLD_CENTS"
        actor: system
        preconditions:
          - "Applicant.total_obligated_cents (after the ledger update) >= SINGLE_AUDIT_THRESHOLD_CENTS"
          - "Applicant.monitoring_status == STANDARD"
        side_effects:
          - "Applicant.audit_requirement = SINGLE_AUDIT (high-water mark, never reverts)"
          - "Applicant.monitoring_status = ENHANCED"
          - "because monitoring_status became ENHANCED, the system creates one ProgressReport for this applicant in status DUE for the quarter containing the current logical clock (quarter_label, period_start_at, period_end_at, due_at derived by progress_report_schedule_status)"
          - "because that ProgressReport row now exists, Disaster.enhanced_monitoring_applicant_count is recomputed"
          - "increments Applicant.version by 1"
        note: "Hop 3 and hop 4 of the obligate cascade; each hop is caused by the preceding hop, not by the obligate call itself."
      - from: "DRAWDOWN:ACTIVE"
        to: "DRAWDOWN:SUSPENDED"
        trigger: "system, whenever Applicant.delinquent_report_count > 0 OR Applicant.pending_deobligation_cents > 0 after any recomputation of applicant_grant_ledger"
        actor: system
        preconditions:
          - "Applicant.drawdown_status == ACTIVE"
          - "Applicant.delinquent_report_count > 0 OR Applicant.pending_deobligation_cents > 0"
        side_effects:
          - "Applicant.drawdown_status = SUSPENDED"
          - "because drawdown_status became SUSPENDED, Disaster.suspended_applicant_count is recomputed"
          - "increments Applicant.version by 1"
      - from: "DRAWDOWN:SUSPENDED"
        to: "DRAWDOWN:ACTIVE"
        trigger: "system, whenever Applicant.delinquent_report_count == 0 AND Applicant.pending_deobligation_cents == 0 after any recomputation of applicant_grant_ledger"
        actor: system
        preconditions:
          - "Applicant.drawdown_status == SUSPENDED"
          - "Applicant.delinquent_report_count == 0 AND Applicant.pending_deobligation_cents == 0"
        side_effects:
          - "Applicant.drawdown_status = ACTIVE"
          - "because drawdown_status became ACTIVE, Disaster.suspended_applicant_count is recomputed"
          - "increments Applicant.version by 1"
        note: "Cycle on the DRAWDOWN dimension: suspension and reinstatement alternate as delinquency is cured (late filing) or a PROPOSED deobligation is finalized or reversed."

  - entity: Facility
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: ELIGIBLE
        trigger: "POST /public-assistance/facilities/{facility_id}/screen"
        actor: ProgramSpecialist
        preconditions:
          - "facility.eligibility_status == PENDING"
          - "facility_eligibility_screening returns ELIGIBLE"
        side_effects:
          - "Facility.eligibility_status = ELIGIBLE; Facility.screening_failure_reason = null; Facility.screened_at = clock"
          - "increments Facility.version by 1"
      - from: PENDING
        to: INELIGIBLE
        trigger: "POST /public-assistance/facilities/{facility_id}/screen"
        actor: ProgramSpecialist
        preconditions:
          - "facility.eligibility_status == PENDING"
          - "facility_eligibility_screening returns INELIGIBLE"
        side_effects:
          - "Facility.eligibility_status = INELIGIBLE; Facility.screening_failure_reason = first failed rule; Facility.screened_at = clock"
          - "increments Facility.version by 1"
      - from: ELIGIBLE
        to: PENDING
        trigger: "PATCH /public-assistance/facilities/{facility_id}"
        actor: ApplicantAgent
        preconditions:
          - "facility.applicant_id == X-User-ID"
          - "no Project P with P.facility_id == facility.id AND P.status IN {VALIDATED, OBLIGATED, CLOSEOUT_REQUESTED} (else ERR_FACILITY_AMENDMENT_LOCKED)"
        side_effects:
          - "amended attributes are written; Facility.eligibility_status = PENDING; Facility.screening_failure_reason = null; Facility.screened_at = null"
          - "because eligibility_status became PENDING, every Project P on this facility with P.status IN {UNDER_REVIEW, RFI_ISSUED} can no longer pass cost review (ERR_FACILITY_INELIGIBLE)"
          - "increments Facility.version by 1"
      - from: INELIGIBLE
        to: PENDING
        trigger: "PATCH /public-assistance/facilities/{facility_id}"
        actor: ApplicantAgent
        preconditions:
          - "facility.applicant_id == X-User-ID"
        side_effects:
          - "amended attributes are written; Facility.eligibility_status = PENDING; Facility.screening_failure_reason = null; Facility.screened_at = null"
          - "increments Facility.version by 1"
        note: "Cycle INELIGIBLE -> PENDING -> ELIGIBLE: a documentation defect can be cured and the facility re-screened."

  - entity: DamageAssessmentSite
    initial_state: REPORTED
    terminal_states: [VALIDATED, REJECTED]
    transitions:
      - from: REPORTED
        to: VALIDATED
        trigger: "POST /public-assistance/damage-sites/{damage_site_id}/validate with decision=VALIDATE"
        actor: ProgramSpecialist
        preconditions:
          - "site.validation_status == REPORTED"
          - "validated_loss_cents is present and >= 0"
        side_effects:
          - "DamageAssessmentSite.validated_loss_cents = validated_loss_cents; validation_status = VALIDATED"
          - "recompute disaster_validated_loss_indicator -> Disaster.total_validated_loss_cents, Disaster.per_capita_impact_cents, Disaster.indicator_met"
          - "increments DamageAssessmentSite.version by 1; increments Disaster.version by 1"
      - from: REPORTED
        to: REJECTED
        trigger: "POST /public-assistance/damage-sites/{damage_site_id}/validate with decision=REJECT"
        actor: ProgramSpecialist
        preconditions:
          - "site.validation_status == REPORTED"
          - "rejection_reason is present"
        side_effects:
          - "DamageAssessmentSite.validated_loss_cents = 0; validation_status = REJECTED; rejection_reason = rejection_reason"
          - "Disaster aggregates are NOT recomputed and Disaster.version is unchanged"
          - "increments DamageAssessmentSite.version by 1"
        note: "Branch with divergent side-effect sets: only the VALIDATE branch touches the declaration-level indicator."

  - entity: Project
    initial_state: DRAFT
    terminal_states: [CLOSED, DENIED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /public-assistance/projects/{project_id}/submit"
        actor: ApplicantAgent
        preconditions:
          - "project.status == DRAFT"
          - "project.applicant_id == X-User-ID"
          - "Applicant.eligibility_status == ELIGIBLE (else ERR_APPLICANT_NOT_ELIGIBLE)"
          - "Facility.eligibility_status == ELIGIBLE (else ERR_FACILITY_INELIGIBLE)"
          - "Disaster.status == DECLARED (else ERR_DISASTER_NOT_OPEN)"
        side_effects:
          - "Project.status = UNDER_REVIEW; Project.work_type = EMERGENCY when category IN {A, B} else PERMANENT"
          - "recompute project_eligible_cost PROVISIONAL variant -> Project.size_class, Project.anticipated_insurance_cents, Project.mitigation_approved_cents, Project.eligible_cost_provisional_cents"
          - "increments Project.version by 1"
      - from: UNDER_REVIEW
        to: RFI_ISSUED
        trigger: "POST /public-assistance/projects/{project_id}/rfi"
        actor: ProgramSpecialist
        preconditions:
          - "project.status == UNDER_REVIEW"
          - "project.rfi_round_count < MAX_RFI_ROUNDS (else ERR_RFI_ROUNDS_EXHAUSTED)"
        side_effects:
          - "Project.status = RFI_ISSUED; Project.rfi_round_count += 1; Project.last_rfi_question = question"
          - "increments Project.version by 1"
      - from: RFI_ISSUED
        to: UNDER_REVIEW
        trigger: "POST /public-assistance/projects/{project_id}/rfi-response"
        actor: ApplicantAgent
        preconditions:
          - "project.status == RFI_ISSUED"
          - "project.applicant_id == X-User-ID"
        side_effects:
          - "Project.status = UNDER_REVIEW; when revised_estimate_cents is supplied, Project.estimated_repair_cost_cents = revised_estimate_cents"
          - "recompute project_eligible_cost PROVISIONAL variant -> Project.size_class, Project.anticipated_insurance_cents, Project.mitigation_approved_cents, Project.eligible_cost_provisional_cents"
          - "increments Project.version by 1"
        note: "Cycle UNDER_REVIEW -> RFI_ISSUED -> UNDER_REVIEW, bounded by MAX_RFI_ROUNDS = 2."
      - from: UNDER_REVIEW
        to: VALIDATED
        trigger: "POST /public-assistance/projects/{project_id}/cost-review with decision=VALIDATE"
        actor: ProgramSpecialist
        preconditions:
          - "project.status == UNDER_REVIEW"
          - "Facility.eligibility_status == ELIGIBLE (else ERR_FACILITY_INELIGIBLE)"
          - "no CostLineItem on this project has review_status == SUBMITTED (else ERR_UNREVIEWED_COST_LINE_ITEMS)"
        side_effects:
          - "recompute project_review_basis -> Project.repair_eligible_cents, Project.size_class, Project.anticipated_insurance_cents, Project.insurance_reduction_cents"
          - "recompute mitigation_cap_allocation -> Project.mitigation_approved_cents (frozen for the FINAL variant)"
          - "Project.status = VALIDATED; Project.cost_reviewed_by_user_id = X-User-ID"
          - "increments Project.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /public-assistance/projects/{project_id}/cost-review with decision=DENY"
        actor: ProgramSpecialist
        preconditions:
          - "project.status == UNDER_REVIEW"
          - "denial_reason is present"
        side_effects:
          - "Project.status = DENIED; Project.denial_reason = denial_reason; Project.cost_reviewed_by_user_id = X-User-ID"
          - "Project.repair_eligible_cents, mitigation_approved_cents, insurance_reduction_cents are left untouched and no ledger field on Applicant or Disaster moves"
          - "increments Project.version by 1"
        note: "Branch with divergent side-effect sets: VALIDATE fixes the obligation basis, DENY freezes the project without touching any basis or ledger field."
      - from: VALIDATED
        to: OBLIGATED
        trigger: "POST /public-assistance/projects/{project_id}/obligate"
        actor: GrantsOfficer
        preconditions:
          - "project.status == VALIDATED"
          - "Disaster.status == DECLARED (else ERR_DISASTER_NOT_OPEN)"
          - "NOT (Facility.flood_zone == true AND Facility.prior_disaster_flood_damage == true AND no InsurancePolicy on the facility has policy_type == FLOOD with effective_start_at <= Disaster.incident_start_at <= effective_end_at) (else ERR_INSURANCE_REQUIREMENT_UNMET)"
        side_effects:
          - "recompute federal_share_obligation -> Project.federal_share_obligated_cents; Project.status = OBLIGATED; Project.obligated_by_user_id = X-User-ID"
          - "because Project.federal_share_obligated_cents moved, recompute applicant_grant_ledger -> Applicant.total_obligated_cents, Applicant.available_drawdown_cents"
          - "because Applicant.total_obligated_cents moved, when it is now >= SINGLE_AUDIT_THRESHOLD_CENTS and Applicant.monitoring_status == STANDARD, Applicant.audit_requirement = SINGLE_AUDIT and Applicant.monitoring_status = ENHANCED"
          - "because Applicant.monitoring_status became ENHANCED, the system creates a ProgressReport row in status DUE for the quarter containing the current logical clock"
          - "because that ProgressReport row exists, Disaster.enhanced_monitoring_applicant_count is recomputed; Disaster.total_obligated_cents is recomputed from the applicant ledgers"
          - "increments Project.version by 1; increments Applicant.version by 1; increments Disaster.version by 1"
        note: "Cascade origin A, depth 4: Project -> Applicant ledger -> audit/monitoring escalation -> ProgressReport creation -> Disaster counters."
      - from: OBLIGATED
        to: CLOSEOUT_REQUESTED
        trigger: "POST /public-assistance/projects/{project_id}/closeout-request"
        actor: ApplicantAgent
        preconditions:
          - "project.status == OBLIGATED"
          - "project.applicant_id == X-User-ID"
          - "at least one CostLineItem on this project has review_status IN {ALLOWED, PARTIALLY_ALLOWED} (else ERR_NO_DOCUMENTED_COSTS)"
        side_effects:
          - "recompute project_eligible_cost FINAL variant -> Project.eligible_cost_final_cents"
          - "Project.status = CLOSEOUT_REQUESTED"
          - "increments Project.version by 1"
      - from: CLOSEOUT_REQUESTED
        to: CLOSED
        trigger: "POST /public-assistance/projects/{project_id}/closeout-certify"
        actor: StateAuditor
        preconditions:
          - "project.status == CLOSEOUT_REQUESTED"
        side_effects:
          - "recompute closeout_reconciliation -> Project.federal_share_final_cents, Project.closeout_variance_cents; Project.status = CLOSED"
          - "when Project.size_class == LARGE AND Project.federal_share_final_cents < Project.federal_share_obligated_cents, the system creates a Deobligation row with reason=CLOSEOUT_UNDERRUN, amount_cents = federal_share_obligated_cents - federal_share_final_cents, status=PROPOSED, determined_by_user_id = X-User-ID"
          - "because that Deobligation row exists, Project.pending_deobligation_cents and Applicant.pending_deobligation_cents are recomputed"
          - "because Applicant.pending_deobligation_cents became > 0, Applicant.drawdown_status = SUSPENDED and Disaster.suspended_applicant_count is recomputed"
          - "increments Project.version by 1; increments Applicant.version by 1 when the ledger moved"
  - entity: CostLineItem
    initial_state: SUBMITTED
    terminal_states: []
    transitions:
      - from: SUBMITTED
        to: ALLOWED
        trigger: "POST /public-assistance/cost-line-items/{cost_line_item_id}/review"
        actor: ProgramSpecialist
        preconditions:
          - "Project.status IN {DRAFT, UNDER_REVIEW, RFI_ISSUED, OBLIGATED} (else ERR_COST_LINE_ITEM_LOCKED)"
          - "when cost_type == CONTRACT, Contract.procurement_status != PENDING_REVIEW (else ERR_PROCUREMENT_REVIEW_PENDING)"
          - "cost_line_item_eligible_cost returns eligible_cents == claimed_cents"
        side_effects:
          - "CostLineItem.eligible_cents = claimed_cents; review_status = ALLOWED; disallowance_reason = null; reviewed_at = clock"
          - "recompute ForceAccountResource.charged_hours_total and, for CONTRACT lines, Contract.allowed_cost_total_cents"
          - "increments CostLineItem.version by 1"
      - from: SUBMITTED
        to: PARTIALLY_ALLOWED
        trigger: "POST /public-assistance/cost-line-items/{cost_line_item_id}/review"
        actor: ProgramSpecialist
        preconditions:
          - "Project.status IN {DRAFT, UNDER_REVIEW, RFI_ISSUED, OBLIGATED} (else ERR_COST_LINE_ITEM_LOCKED)"
          - "cost_line_item_eligible_cost returns 0 < eligible_cents < claimed_cents"
        side_effects:
          - "CostLineItem.eligible_cents = computed value; review_status = PARTIALLY_ALLOWED; disallowance_reason = the pinned reason code; reviewed_at = clock"
          - "recompute ForceAccountResource.charged_hours_total and, for CONTRACT lines, Contract.allowed_cost_total_cents"
          - "increments CostLineItem.version by 1"
      - from: SUBMITTED
        to: DISALLOWED
        trigger: "POST /public-assistance/cost-line-items/{cost_line_item_id}/review"
        actor: ProgramSpecialist
        preconditions:
          - "Project.status IN {DRAFT, UNDER_REVIEW, RFI_ISSUED, OBLIGATED} (else ERR_COST_LINE_ITEM_LOCKED)"
          - "cost_line_item_eligible_cost returns eligible_cents == 0"
        side_effects:
          - "CostLineItem.eligible_cents = 0; review_status = DISALLOWED; disallowance_reason = the pinned reason code; reviewed_at = clock"
          - "increments CostLineItem.version by 1"
      - from: ALLOWED
        to: DISALLOWED
        trigger: "POST /public-assistance/cost-line-items/{cost_line_item_id}/review"
        actor: ProgramSpecialist
        preconditions:
          - "Project.status IN {DRAFT, UNDER_REVIEW, RFI_ISSUED, OBLIGATED} (else ERR_COST_LINE_ITEM_LOCKED)"
          - "cost_line_item_eligible_cost now returns 0 (the reachable path is the CONTRACT branch's created_at ASC ceiling consumption: an earlier-created sibling line on the same contract was allowed after this line was, which drops this line's headroom_cents to 0)"
        side_effects:
          - "CostLineItem.eligible_cents = 0; review_status = DISALLOWED; disallowance_reason = the pinned reason code returned by the recomputation (CONTRACT_AWARD_CEILING_REACHED on the ceiling path); reviewed_at = clock"
          - "recompute Contract.allowed_cost_total_cents"
          - "increments CostLineItem.version by 1"
        note: "Re-review cycle: a line item may be re-reviewed while the project is still open, so review states are not terminal. Because the CONTRACT ceiling counts only siblings with created_at < this line's created_at, reviewing lines out of creation order can allow a line that a later re-review must take back."

  - entity: Contract
    initial_state: PENDING_REVIEW
    terminal_states: [COMPLIANT, NONCOMPLIANT]
    transitions:
      - from: PENDING_REVIEW
        to: COMPLIANT
        trigger: "POST /public-assistance/contracts/{contract_id}/procurement-review"
        actor: ProgramSpecialist
        preconditions:
          - "contract.procurement_status == PENDING_REVIEW (else ERR_CONTRACT_ALREADY_REVIEWED)"
          - "procurement_compliance_review returns COMPLIANT"
        side_effects:
          - "Contract.procurement_status = COMPLIANT; noncompliance_reason = null"
          - "increments Contract.version by 1"
      - from: PENDING_REVIEW
        to: NONCOMPLIANT
        trigger: "POST /public-assistance/contracts/{contract_id}/procurement-review"
        actor: ProgramSpecialist
        preconditions:
          - "contract.procurement_status == PENDING_REVIEW (else ERR_CONTRACT_ALREADY_REVIEWED)"
          - "procurement_compliance_review returns NONCOMPLIANT"
        side_effects:
          - "Contract.procurement_status = NONCOMPLIANT; noncompliance_reason = first failed rule"
          - "every future POST /public-assistance/cost-line-items with cost_type=CONTRACT referencing this contract fails with ERR_PROCUREMENT_NONCOMPLIANT"
          - "increments Contract.version by 1"

  - entity: Drawdown
    initial_state: REQUESTED
    terminal_states: [REJECTED, REFUNDED]
    transitions:
      - from: REQUESTED
        to: PAID
        trigger: "POST /public-assistance/drawdowns/{drawdown_id}/disburse with decision=PAY"
        actor: GrantsOfficer
        preconditions:
          - "drawdown.status == REQUESTED"
          - "X-User-ID != Project.obligated_by_user_id for drawdown.project_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "Applicant.drawdown_status == ACTIVE (else ERR_DRAWDOWN_SUSPENDED)"
        side_effects:
          - "Drawdown.approved_cents = requested_cents; status = PAID; disbursed_by_user_id = X-User-ID"
          - "because Drawdown.approved_cents moved, recompute applicant_grant_ledger -> Applicant.total_drawn_cents, cash_on_hand_cents, available_drawdown_cents"
          - "because Applicant.cash_on_hand_cents moved, Disaster.total_drawn_cents is recomputed"
          - "increments Drawdown.version by 1; increments Applicant.version by 1; increments Disaster.version by 1"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /public-assistance/drawdowns/{drawdown_id}/disburse with decision=REJECT"
        actor: GrantsOfficer
        preconditions:
          - "drawdown.status == REQUESTED"
          - "rejection_reason is present"
        side_effects:
          - "Drawdown.status = REJECTED; rejection_reason = rejection_reason; approved_cents stays 0"
          - "no Applicant or Disaster ledger field moves and neither version increments"
          - "increments Drawdown.version by 1"
        note: "Branch with divergent side-effect sets: PAY moves the cash ledger, REJECT moves nothing."
      - from: PAID
        to: REFUNDED
        trigger: "POST /public-assistance/drawdowns/{drawdown_id}/refund"
        actor: ApplicantAgent
        preconditions:
          - "drawdown.status == PAID"
          - "drawdown.applicant_id == X-User-ID"
          - "refund_cents <= drawdown.approved_cents (else ERR_REFUND_EXCEEDS_DRAWDOWN)"
        side_effects:
          - "Drawdown.refunded_cents = refund_cents; status = REFUNDED"
          - "because Drawdown.refunded_cents moved, recompute applicant_grant_ledger -> Applicant.total_refunded_cents, cash_on_hand_cents, available_drawdown_cents"
          - "because Applicant.cash_on_hand_cents moved, Disaster.total_drawn_cents is recomputed"
          - "increments Drawdown.version by 1; increments Applicant.version by 1; increments Disaster.version by 1"
        note: "Compensating action for the PAY branch; the conserved quantity is Applicant.cash_on_hand_cents (see calculations.applicant_grant_ledger)."

  - entity: ProgressReport
    initial_state: DUE
    terminal_states: []
    transitions:
      - from: DUE
        to: SUBMITTED
        trigger: "POST /public-assistance/progress-reports/{progress_report_id}/submit"
        actor: ApplicantAgent
        preconditions:
          - "report.status IN {DUE, DELINQUENT} (else ERR_REPORT_ALREADY_SUBMITTED)"
          - "report.applicant_id == X-User-ID"
          - "clock <= report.due_at"
        side_effects:
          - "ProgressReport.expenditures_to_date_cents and pct_complete are written; status = SUBMITTED; submitted_at = clock"
          - "increments ProgressReport.version by 1"
      - from: DUE
        to: LATE
        trigger: "POST /public-assistance/progress-reports/{progress_report_id}/submit"
        actor: ApplicantAgent
        preconditions:
          - "report.status IN {DUE, DELINQUENT} (else ERR_REPORT_ALREADY_SUBMITTED)"
          - "report.applicant_id == X-User-ID"
          - "clock > report.due_at"
        side_effects:
          - "ProgressReport.expenditures_to_date_cents and pct_complete are written; status = LATE; submitted_at = clock"
          - "increments ProgressReport.version by 1"
      - from: DUE
        to: DELINQUENT
        trigger: "POST /public-assistance/applicants/{applicant_id}/reporting-sweep"
        actor: PlatformAdmin
        preconditions:
          - "report.status == DUE"
          - "clock > report.due_at"
        side_effects:
          - "ProgressReport.status = DELINQUENT"
          - "because a report became DELINQUENT, recompute applicant_grant_ledger -> Applicant.delinquent_report_count"
          - "because Applicant.delinquent_report_count became > 0, Applicant.drawdown_status = SUSPENDED"
          - "because Applicant.drawdown_status became SUSPENDED, Disaster.suspended_applicant_count is recomputed"
          - "recompute applicant_risk_score MONITORING variant -> Applicant.risk_score_monitoring, Applicant.monitoring_scored_at, Applicant.risk_tier"
          - "increments ProgressReport.version by 1; increments Applicant.version by 1; increments Disaster.version by 1"
        note: "Cascade origin B, depth 4: ProgressReport -> Applicant.delinquent_report_count -> drawdown_status -> Disaster counters."
      - from: DELINQUENT
        to: LATE
        trigger: "POST /public-assistance/progress-reports/{progress_report_id}/submit"
        actor: ApplicantAgent
        preconditions:
          - "report.status == DELINQUENT"
          - "report.applicant_id == X-User-ID"
        side_effects:
          - "ProgressReport.status = LATE; submitted_at = clock; expenditures_to_date_cents and pct_complete are written"
          - "because the report left DELINQUENT, recompute applicant_grant_ledger -> Applicant.delinquent_report_count"
          - "because Applicant.delinquent_report_count returned to 0 and pending_deobligation_cents == 0, Applicant.drawdown_status = ACTIVE"
          - "because Applicant.drawdown_status became ACTIVE, Disaster.suspended_applicant_count is recomputed"
          - "increments ProgressReport.version by 1; increments Applicant.version by 1; increments Disaster.version by 1"
        note: "Cycle DUE -> DELINQUENT -> LATE: late filing cures delinquency and lifts the drawdown suspension."

  - entity: Deobligation
    initial_state: PROPOSED
    terminal_states: [REVERSED]
    transitions:
      - from: PROPOSED
        to: FINAL
        trigger: "POST /public-assistance/deobligations/{deobligation_id}/finalize"
        actor: GrantsOfficer
        preconditions:
          - "deobligation.status == PROPOSED"
          - "Project.status IN {OBLIGATED, CLOSEOUT_REQUESTED, CLOSED}"
        side_effects:
          - "Deobligation.status = FINAL; finalized_at = clock; appeal_deadline_at = clock + APPEAL_WINDOW_DAYS"
          - "because the determination became FINAL, Project.deobligated_cents += amount_cents and Project.pending_deobligation_cents -= amount_cents"
          - "because Project.deobligated_cents moved, recompute applicant_grant_ledger -> Applicant.total_obligated_cents, pending_deobligation_cents, available_drawdown_cents"
          - "because Applicant.pending_deobligation_cents returned to 0 and delinquent_report_count == 0, Applicant.drawdown_status = ACTIVE and Disaster.suspended_applicant_count is recomputed"
          - "Disaster.total_obligated_cents is recomputed"
          - "increments Deobligation.version by 1; increments Project.version by 1; increments Applicant.version by 1; increments Disaster.version by 1"
      - from: FINAL
        to: REVERSED
        trigger: "system, inside POST /public-assistance/appeals/{appeal_id}/decide with decision=GRANT or decision=PARTIALLY_GRANT"
        actor: system
        preconditions:
          - "deobligation.status == FINAL"
          - "relief_granted_cents > 0"
        side_effects:
          - "Deobligation.reversed_cents = relief_granted_cents; status = REVERSED when reversed_cents == amount_cents, and stays FINAL when 0 < reversed_cents < amount_cents"
          - "because Deobligation.reversed_cents moved, Project.deobligated_cents -= relief_granted_cents"
          - "because Project.deobligated_cents moved, recompute applicant_grant_ledger -> Applicant.total_obligated_cents, available_drawdown_cents; Disaster.total_obligated_cents is recomputed"
          - "increments Deobligation.version by 1; increments Project.version by 1; increments Applicant.version by 1; increments Disaster.version by 1"
        note: "Compensating action for FINAL; the conserved quantity is Applicant.total_obligated_cents (see calculations.applicant_grant_ledger)."
      - from: FINAL
        to: PROPOSED
        trigger: "system, inside POST /public-assistance/appeals/{appeal_id}/decide with decision=REMAND"
        actor: system
        preconditions:
          - "deobligation.status == FINAL"
          - "the deciding appeal has level == FIRST"
        side_effects:
          - "Deobligation.status = PROPOSED; finalized_at = null; appeal_deadline_at = null; reversed_cents stays 0"
          - "because the determination is no longer FINAL, Project.deobligated_cents -= amount_cents and Project.pending_deobligation_cents += amount_cents"
          - "because Project.deobligated_cents moved, recompute applicant_grant_ledger -> Applicant.total_obligated_cents, pending_deobligation_cents, available_drawdown_cents"
          - "because Applicant.pending_deobligation_cents became > 0, Applicant.drawdown_status = SUSPENDED and Disaster.suspended_applicant_count is recomputed; Disaster.total_obligated_cents is recomputed"
          - "increments Deobligation.version by 1; increments Project.version by 1; increments Applicant.version by 1; increments Disaster.version by 1"
        note: "Cycle PROPOSED -> FINAL -> PROPOSED: a remand sends the determination back for re-work, restores the obligation and re-suspends drawdowns. The determination may then be finalized again, which re-opens a fresh 60-day appeal window."

  - entity: Appeal
    initial_state: SUBMITTED
    terminal_states: [GRANTED, PARTIALLY_GRANTED, DENIED, REMANDED]
    transitions:
      - from: SUBMITTED
        to: GRANTED
        trigger: "POST /public-assistance/appeals/{appeal_id}/decide with decision=GRANT"
        actor: AppealsAdjudicator
        preconditions:
          - "appeal.status == SUBMITTED (else ERR_APPEAL_ALREADY_DECIDED)"
          - "X-User-ID != Deobligation.determined_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Appeal.relief_granted_cents = appeal.relief_requested_cents; status = GRANTED; decided_at = clock; decided_by_user_id = X-User-ID"
          - "the appealed Deobligation runs its FINAL -> REVERSED transition with relief_granted_cents"
          - "increments Appeal.version by 1"
      - from: SUBMITTED
        to: PARTIALLY_GRANTED
        trigger: "POST /public-assistance/appeals/{appeal_id}/decide with decision=PARTIALLY_GRANT"
        actor: AppealsAdjudicator
        preconditions:
          - "appeal.status == SUBMITTED (else ERR_APPEAL_ALREADY_DECIDED)"
          - "X-User-ID != Deobligation.determined_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "0 < relief_granted_cents < appeal.relief_requested_cents"
        side_effects:
          - "Appeal.relief_granted_cents = relief_granted_cents; status = PARTIALLY_GRANTED; decided_at = clock; decided_by_user_id = X-User-ID"
          - "the appealed Deobligation runs its FINAL -> REVERSED transition with relief_granted_cents (staying FINAL when the reversal is partial)"
          - "increments Appeal.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /public-assistance/appeals/{appeal_id}/decide with decision=DENY"
        actor: AppealsAdjudicator
        preconditions:
          - "appeal.status == SUBMITTED (else ERR_APPEAL_ALREADY_DECIDED)"
          - "X-User-ID != Deobligation.determined_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Appeal.relief_granted_cents = 0; status = DENIED; decided_at = clock; decided_by_user_id = X-User-ID"
          - "no Deobligation, Project, Applicant or Disaster field moves; a SECOND-level appeal now becomes admissible"
          - "increments Appeal.version by 1"
      - from: SUBMITTED
        to: REMANDED
        trigger: "POST /public-assistance/appeals/{appeal_id}/decide with decision=REMAND"
        actor: AppealsAdjudicator
        preconditions:
          - "appeal.status == SUBMITTED (else ERR_APPEAL_ALREADY_DECIDED)"
          - "X-User-ID != Deobligation.determined_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "appeal.level == FIRST"
        side_effects:
          - "Appeal.relief_granted_cents = 0; status = REMANDED; decided_at = clock; decided_by_user_id = X-User-ID"
          - "the appealed Deobligation runs its FINAL -> PROPOSED transition, which restores Project.deobligated_cents, raises Project.pending_deobligation_cents and Applicant.pending_deobligation_cents, re-suspends the applicant's drawdowns and refreshes the Disaster counters"
          - "increments Appeal.version by 1"
        note: "Four-way branch with fully divergent side-effect sets: GRANT reverses the ledger permanently, PARTIALLY_GRANT reverses part of it, DENY moves nothing outside the Appeal row and unlocks the second level, REMAND puts the determination back in PROPOSED so the money returns to the obligation ledger while the case is re-worked."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's version — the only mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: drawdown-create-stale-applicant
    parent_entity: Applicant
    write_endpoint: "POST /public-assistance/drawdowns"
    occ_field: "expected_applicant_version"
    description: |
      Creating a Drawdown against an Applicant whose version has advanced since
      the client last read it is rejected with a stale-version error. A drawdown
      request is legitimately repeatable — the product allows an applicant to
      draw again against the same obligation — so the second create cannot be
      screened out by any state precondition; only the version check can tell a
      client whose view of total_obligated_cents, cash_on_hand_cents and
      drawdown_status predates an intervening ledger movement.
    error_id: ERR_STALE_APPLICANT_VERSION
    http_status: 412

  - rule_id: deobligation-create-stale-project
    parent_entity: Project
    write_endpoint: "POST /public-assistance/deobligations"
    occ_field: "expected_project_version"
    description: |
      Creating a Deobligation against a Project whose version has advanced since
      the client last read it is rejected with a stale-version error. A second
      determination on the same project is legitimate (a project can be reduced
      for both DISALLOWED_COST and INSURANCE_DOB), so no state precondition
      rejects it; the version check is what stops a determination whose
      amount_cents was sized against a superseded view of
      federal_share_obligated_cents and deobligated_cents.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: disaster_validated_loss_indicator
    trigger: "POST /public-assistance/damage-sites/{damage_site_id}/validate with decision=VALIDATE (the REJECT branch does not run this calculation)"
    algorithm: aggregation
    formula: |
      # (a) source + status filter, (b) window, (c) order-insensitive (pure sum)
      sites = { s : DamageAssessmentSite
                  | Facility(s.facility_id).applicant_id IN {A.id : Applicant A, A.disaster_id == disaster.id}
                  AND s.validation_status == VALIDATED }
      total_validated_loss_cents = sum(s.validated_loss_cents for s in sites)   # 0 when sites is empty
      per_capita_impact_cents    = floor(total_validated_loss_cents / disaster.population)
      indicator_met              = (per_capita_impact_cents >= PER_CAPITA_INDICATOR_CENTS)
    input_set: "Every DamageAssessmentSite whose facility rolls up to this Disaster and whose validation_status == VALIDATED. REPORTED and REJECTED sites are excluded; no time window is applied; the sum is order-insensitive so no tie-break is required."
    constants:
      PER_CAPITA_INDICATOR_CENTS: 189
    precision: "integer cents; per_capita_impact_cents uses floor division (truncation toward zero for non-negative values)"

  - name: facility_eligibility_screening
    trigger: "POST /public-assistance/facilities/{facility_id}/screen"
    algorithm: eligibility_cascade
    formula: |
      # Rules are evaluated in exactly this order; the FIRST failure decides
      # both eligibility_status and screening_failure_reason.
      applicant = Applicant(facility.applicant_id)
      1. if facility.legal_responsibility_documented == false
             -> INELIGIBLE, reason = LEGAL_RESPONSIBILITY_NOT_DOCUMENTED
      2. if facility.in_active_use == false
             -> INELIGIBLE, reason = NOT_IN_ACTIVE_USE
      3. if applicant.applicant_type == PRIVATE_NONPROFIT:
           3a. if facility.ownership != PNP_OWNED
                 -> INELIGIBLE, reason = PNP_MUST_OWN_FACILITY
           3b. if applicant.tax_exempt_letter_on_file == false
                 -> INELIGIBLE, reason = TAX_EXEMPT_DOCUMENTATION_MISSING
           3c. if applicant.pnp_service_type == NON_ELIGIBLE
                 -> INELIGIBLE, reason = PNP_SERVICE_NOT_ELIGIBLE
      4. otherwise -> ELIGIBLE, reason = null
    input_set: "The facility's own attributes plus the owning Applicant's applicant_type, tax_exempt_letter_on_file and pnp_service_type. Screening never inspects Project or DamageAssessmentSite rows."
    constants: {}
    precision: "not numeric"

  - name: procurement_compliance_review
    trigger: "POST /public-assistance/contracts/{contract_id}/procurement-review"
    algorithm: eligibility_cascade
    formula: |
      # Rules are evaluated in exactly this order; the FIRST failure decides
      # both procurement_status and noncompliance_reason.
      1. if contract.contract_type == COST_PLUS_PERCENTAGE_OF_COST
             -> NONCOMPLIANT, reason = PROHIBITED_CONTRACT_TYPE
      2. if contract.contract_type == TIME_AND_MATERIALS
             AND contract.award_amount_cents > SMALL_PURCHASE_CEILING_CENTS
             -> NONCOMPLIANT, reason = TIME_AND_MATERIALS_CEILING_EXCEEDED
      3. if contract.award_amount_cents >= SIMPLIFIED_ACQUISITION_THRESHOLD_CENTS:
           3a. if contract.contract_type == NONCOMPETITIVE
                 AND contract.sole_source_justification_on_file == false
                 -> NONCOMPLIANT, reason = SOLE_SOURCE_UNJUSTIFIED
           3b. if contract.contract_type IN {SEALED_BID, COMPETITIVE_PROPOSAL}
                 AND (contract.advertised == false
                      OR contract.bids_received < MIN_COMPETITIVE_BIDS)
                 -> NONCOMPLIANT, reason = INADEQUATE_COMPETITION
      4. if contract.award_amount_cents >= SMALL_PURCHASE_CEILING_CENTS
             AND contract.debarment_check_completed == false
             -> NONCOMPLIANT, reason = DEBARMENT_CHECK_MISSING
      5. otherwise -> COMPLIANT, reason = null
    input_set: "The contract row only. Both threshold comparisons are inclusive at the boundary (>=), so an award of exactly SIMPLIFIED_ACQUISITION_THRESHOLD_CENTS is inside rule 3 and an award of exactly SMALL_PURCHASE_CEILING_CENTS is inside rule 4, while rule 2 uses a strict > so an award of exactly SMALL_PURCHASE_CEILING_CENTS passes rule 2."
    constants:
      SMALL_PURCHASE_CEILING_CENTS: 2500000
      SIMPLIFIED_ACQUISITION_THRESHOLD_CENTS: 25000000
      MIN_COMPETITIVE_BIDS: 2
    precision: "integer cents"

  - name: cost_line_item_eligible_cost
    trigger: "POST /public-assistance/cost-line-items/{cost_line_item_id}/review"
    algorithm: threshold
    formula: |
      project  = Project(line.project_id)
      resource = ForceAccountResource(line.force_account_resource_id)   # LABOR / EQUIPMENT branches
      contract = Contract(line.contract_id)                            # CONTRACT branch

      if line.cost_type == FORCE_ACCOUNT_LABOR:
          # branch on work_type x employee_type: for EMERGENCY work only a
          # permanent employee's overtime is eligible; a temporary employee
          # hired for the disaster is eligible for both hour classes.
          if resource.employee_type == PERMANENT and project.work_type == EMERGENCY:
              billable_straight_hours = 0
              reason_if_reduced       = STRAIGHT_TIME_NOT_ELIGIBLE_FOR_EMERGENCY_WORK
          else:
              billable_straight_hours = line.straight_time_hours
              reason_if_reduced       = CLAIM_EXCEEDS_COMPUTED_COST
          billable_overtime_hours = line.overtime_hours
          straight_cost = round_half_up(billable_straight_hours * resource.base_hourly_rate_cents)
          overtime_cost = round_half_up(billable_overtime_hours * resource.base_hourly_rate_cents * OVERTIME_MULTIPLIER)
          applied_fringe_pct = min(resource.fringe_benefit_pct, FRINGE_CAP_PCT)
          fringe_cost = round_half_up((straight_cost + overtime_cost) * applied_fringe_pct)
          # PINNED ROUNDING ORDER: each of the three components is rounded to
          # whole cents BEFORE they are summed. Summing the unrounded products
          # and rounding once is NOT the rule.
          computed_cents = straight_cost + overtime_cost + fringe_cost
          if resource.fringe_benefit_pct > FRINGE_CAP_PCT:
              reason_if_reduced = FRINGE_RATE_CAPPED

      elif line.cost_type == FORCE_ACCOUNT_EQUIPMENT:
          applied_rate_cents = min(resource.published_hourly_rate_cents,
                                   resource.schedule_hourly_rate_cents)   # lesser-of rule
          computed_cents = round_half_up(line.equipment_hours * applied_rate_cents)
          reason_if_reduced = (LESSER_OF_RATE_APPLIED
                               if resource.published_hourly_rate_cents > resource.schedule_hourly_rate_cents
                               else CLAIM_EXCEEDS_COMPUTED_COST)

      elif line.cost_type == MATERIALS:
          computed_cents    = line.claimed_cents
          reason_if_reduced = CLAIM_EXCEEDS_COMPUTED_COST

      else:  # line.cost_type == CONTRACT
          if contract.procurement_status == NONCOMPLIANT:
              computed_cents    = 0
              reason_if_reduced = PROCUREMENT_NONCOMPLIANT
          else:
              # cumulative award ceiling shared by every line on this contract,
              # consumed in created_at ASC order (never by id)
              already_allowed = sum(o.eligible_cents
                                    for o : CostLineItem
                                    where o.contract_id == contract.id
                                      and o.id != line.id
                                      and o.review_status IN {ALLOWED, PARTIALLY_ALLOWED}
                                      and o.created_at < line.created_at)
              headroom_cents = max(0, contract.award_amount_cents - already_allowed)
              computed_cents = min(line.claimed_cents, headroom_cents)
              reason_if_reduced = (CONTRACT_AWARD_CEILING_REACHED
                                   if headroom_cents < line.claimed_cents
                                   else CLAIM_EXCEEDS_COMPUTED_COST)

      eligible_cents = min(computed_cents, line.claimed_cents)   # never pay above the claim
      review_status  = ALLOWED            if eligible_cents == line.claimed_cents
                       else DISALLOWED    if eligible_cents == 0
                       else PARTIALLY_ALLOWED
      disallowance_reason = null if review_status == ALLOWED else reason_if_reduced
    input_set: "The line item, its project's work_type, and either the referenced ForceAccountResource (rates, employee_type) or the referenced Contract (procurement_status, award_amount_cents plus every sibling line on that contract whose review_status IN {ALLOWED, PARTIALLY_ALLOWED} and created_at < this line's created_at). Sibling consumption order is created_at ASC; id is never consulted."
    constants:
      OVERTIME_MULTIPLIER: 1.5
      FRINGE_CAP_PCT: 0.40
    precision: "integer cents; every multiplication is rounded with round_half_up to whole cents at the point shown in the formula (three separate roundings for labor)"

  - name: project_review_basis
    trigger: "POST /public-assistance/projects/{project_id}/cost-review with decision=VALIDATE (the DENY branch does not run this calculation)"
    algorithm: aggregation
    formula: |
      reviewed = { c : CostLineItem
                     | c.project_id == project.id
                     AND c.review_status IN {ALLOWED, PARTIALLY_ALLOWED} }
      if reviewed is empty:
          repair_eligible_cents = project.estimated_repair_cost_cents   # empty-set fallback
      else:
          repair_eligible_cents = sum(c.eligible_cents for c in reviewed)

      covering_policies = { p : InsurancePolicy
                              | p.facility_id == project.facility_id
                              AND p.effective_start_at <= disaster.incident_start_at <= p.effective_end_at }
      anticipated_insurance_cents = min(repair_eligible_cents,
                                        sum(max(0, p.coverage_limit_cents - p.deductible_cents)
                                            for p in covering_policies))
      insurance_reduction_cents   = max(anticipated_insurance_cents,
                                        project.settlement_allocated_cents)
      size_class = SMALL if repair_eligible_cents < disaster.small_project_threshold_cents else LARGE
    input_set: "CostLineItems on this project with review_status IN {ALLOWED, PARTIALLY_ALLOWED} (SUBMITTED items cannot exist at this point because cost review requires all lines reviewed; DISALLOWED items are excluded). Insurance uses only policies on the project's facility whose closed effective interval contains the declaration's incident_start_at. The empty-reviewed-set fallback to estimated_repair_cost_cents is the pinned behaviour, not an error."
    constants: {}
    precision: "integer cents"

  - name: mitigation_cap_allocation
    trigger: "POST /public-assistance/projects/{project_id}/cost-review with decision=VALIDATE, immediately after project_review_basis"
    algorithm: threshold
    formula: |
      # The size class is what selects the cap percentage, and the cap
      # percentage is what sizes the mitigation award, and the mitigation award
      # is what makes the total project cost cross the small-project threshold.
      # The dependency only LOOKS circular; this evaluation order is pinned and
      # the size class is NEVER re-derived from the total.
      step 1: repair_eligible_cents  = project.repair_eligible_cents        # from project_review_basis
      step 2: size_class             = SMALL if repair_eligible_cents < disaster.small_project_threshold_cents
                                       else LARGE                          # mitigation is EXCLUDED here
      step 3: cap_pct                = MITIGATION_CAP_PCT_SMALL if size_class == SMALL
                                       else MITIGATION_CAP_PCT_LARGE
      step 4: mitigation_approved_cents = min(project.mitigation_requested_cents,
                                              floor(repair_eligible_cents * cap_pct))
      step 5: total_project_cost_cents  = repair_eligible_cents + mitigation_approved_cents
              # step 5 may exceed disaster.small_project_threshold_cents; the
              # size_class from step 2 stands regardless.
    input_set: "project.repair_eligible_cents as fixed by project_review_basis in the same request, project.mitigation_requested_cents, and disaster.small_project_threshold_cents. The mitigation award is silently capped — exceeding the cap is not an error."
    constants:
      MITIGATION_CAP_PCT_SMALL: 0.20
      MITIGATION_CAP_PCT_LARGE: 0.15
    precision: "integer cents; step 4 uses floor on the cap product (never round_half_up), so the cap can never be rounded upward"

  - name: federal_share_obligation
    trigger: "POST /public-assistance/projects/{project_id}/obligate"
    algorithm: tiered_pricing
    formula: |
      net_repair_cents = max(0, project.repair_eligible_cents - project.insurance_reduction_cents)
      # PINNED ROUNDING ORDER: the cost share is applied to each component and
      # each product is rounded to whole cents SEPARATELY, then the two rounded
      # values are summed. Summing the components first and rounding once is
      # NOT the rule and can differ by one cent.
      repair_share_cents     = round_half_up(net_repair_cents * disaster.federal_cost_share_pct)
      mitigation_share_cents = round_half_up(project.mitigation_approved_cents * disaster.federal_cost_share_pct)
      federal_share_obligated_cents = repair_share_cents + mitigation_share_cents
    input_set: "project.repair_eligible_cents, project.insurance_reduction_cents and project.mitigation_approved_cents as frozen by cost review, and disaster.federal_cost_share_pct."
    constants: {}
    precision: "integer cents; two independent round_half_up operations, one per component, then an exact integer addition"

  - name: insurance_dob_waterfall
    trigger: "POST /public-assistance/insurance-policies/{insurance_policy_id}/record-settlement"
    algorithm: waterfall_allocation
    formula: |
      candidates = [ p : Project
                       | p.facility_id == policy.facility_id
                       AND p.status IN {UNDER_REVIEW, RFI_ISSUED, VALIDATED,
                                        OBLIGATED, CLOSEOUT_REQUESTED} ]
      # ordered by category ASC (A < B < C < D < E < F < G), then created_at ASC;
      # id is never used as an ordering key
      candidates = sort(candidates, key=(category ASC, created_at ASC))
      available = settlement_amount_cents
      for p in candidates:
          room = max(0, p.repair_eligible_cents - p.settlement_allocated_cents)
          take = min(available, room)
          p.settlement_allocated_cents += take
          p.insurance_reduction_cents   = max(p.anticipated_insurance_cents,
                                              p.settlement_allocated_cents)
          available -= take
          if p.status IN {OBLIGATED, CLOSEOUT_REQUESTED} and take > 0:
              recomputed_share = federal_share_obligation(p)
              shortfall = p.federal_share_obligated_cents - p.deobligated_cents - recomputed_share
              if shortfall > 0:
                  create Deobligation(project_id=p.id, reason=INSURANCE_DOB,
                                      amount_cents=shortfall, status=PROPOSED,
                                      determined_by_user_id=X-User-ID)
      policy.allocated_cents   = settlement_amount_cents - available
      policy.unallocated_cents = available
    input_set: "Projects on the settled policy's facility whose status IN {UNDER_REVIEW, RFI_ISSUED, VALIDATED, OBLIGATED, CLOSEOUT_REQUESTED}; DRAFT, CLOSED and DENIED projects never absorb proceeds. Each project absorbs at most repair_eligible_cents - settlement_allocated_cents. Any remainder stays on the policy as unallocated_cents."
    constants: {}
    precision: "integer cents; no rounding occurs in the allocation itself, only inside the nested federal_share_obligation recomputation"

  - name: project_eligible_cost
    trigger: "PROVISIONAL variant on POST /public-assistance/projects/{project_id}/submit and POST /public-assistance/projects/{project_id}/rfi-response; FINAL variant on POST /public-assistance/projects/{project_id}/closeout-request"
    algorithm: forward_looking
    formula: |
      # shared skeleton
      eligible = max(0, repair_basis_cents - insurance_offset_cents) + mitigation_component_cents
    input_set: "See each variant. The two variants are stored side by side on the project (eligible_cost_provisional_cents and eligible_cost_final_cents) and are expected to differ whenever documented actuals or recorded settlements differ from the estimate and the anticipated proceeds."
    constants: {}
    precision: "integer cents; floor is used for the mitigation cap inside the PROVISIONAL variant"
    variants:
      - name: PROVISIONAL
        when: "Project submission and every RFI response, i.e. before any cost line item has been reviewed"
        difference: |
          repair_basis_cents      = project.estimated_repair_cost_cents
          covering_policies       = policies on project.facility_id whose closed effective
                                    interval contains disaster.incident_start_at
          anticipated_insurance_cents = min(repair_basis_cents,
                                        sum(max(0, coverage_limit_cents - deductible_cents)))
          insurance_offset_cents  = anticipated_insurance_cents      # anticipated, never actual
          size_class              = SMALL if repair_basis_cents < disaster.small_project_threshold_cents else LARGE
          cap_pct                 = MITIGATION_CAP_PCT_SMALL if size_class == SMALL else MITIGATION_CAP_PCT_LARGE
          mitigation_component_cents = min(project.mitigation_requested_cents,
                                           floor(repair_basis_cents * cap_pct))
          -> written to Project.eligible_cost_provisional_cents (and it also sets
             size_class, anticipated_insurance_cents, mitigation_approved_cents)
      - name: FINAL
        when: "Closeout request, i.e. after actual costs have been documented and reviewed and after any insurance settlement has been recorded"
        difference: |
          repair_basis_cents      = sum(c.eligible_cents for c : CostLineItem
                                        where c.project_id == project.id
                                          and c.review_status IN {ALLOWED, PARTIALLY_ALLOWED})
                                    # no estimate fallback: an empty set is rejected
                                    # upstream with ERR_NO_DOCUMENTED_COSTS
          insurance_offset_cents  = project.settlement_allocated_cents   # actual proceeds only,
                                    # anticipated proceeds are deliberately ignored here
          mitigation_component_cents = project.mitigation_approved_cents  # frozen at cost review,
                                    # never recomputed from the actual basis
          -> written to Project.eligible_cost_final_cents

  - name: applicant_risk_score
    trigger: "SCREENING variant on POST /public-assistance/applicants/{applicant_id}/eligibility-determination; MONITORING variant on POST /public-assistance/applicants/{applicant_id}/reporting-sweep and on every ProgressReport DUE -> DELINQUENT transition"
    algorithm: weighted_scoring
    formula: |
      type_points = { LOCAL_GOVERNMENT: 20, TRIBE: 30, STATE_AGENCY: 10,
                      PRIVATE_NONPROFIT: 60 }[applicant.applicant_type]
      score = round_half_up(W_TYPE * type_points
                            + W_SECOND * second_points
                            + W_THIRD  * third_points, 2)
      risk_tier = HIGH   if score >= TIER_HIGH_MIN
                  else MEDIUM if score >= TIER_MEDIUM_MIN
                  else LOW
      # Applicant.risk_tier is the tier of risk_score_monitoring when
      # monitoring_scored_at is non-null, otherwise the tier of
      # risk_score_screening.
    input_set: "See each variant. Both variants write their own score field; only the tier selection rule above decides which score drives Applicant.risk_tier."
    constants:
      W_TYPE: 0.30
      W_SECOND: 0.30
      W_THIRD: 0.40
      TIER_HIGH_MIN: 60
      TIER_MEDIUM_MIN: 30
      FACILITY_POINTS_PER_FACILITY: 10
      DELINQUENCY_POINTS_PER_REPORT: 25
    precision: "2 decimal places, round_half_up"
    variants:
      - name: SCREENING
        when: "Eligibility determination, before any money moves"
        difference: |
          second_points = min(100, FACILITY_POINTS_PER_FACILITY
                                   * count(Facility F where F.applicant_id == applicant.id))
                          # every facility counts, whatever its eligibility_status
          third_points  = 100 if count(Facility F where F.applicant_id == applicant.id
                                        and F.flood_zone == true
                                        and no InsurancePolicy P with P.facility_id == F.id
                                            and P.policy_type == FLOOD) >= 1
                          else 0
          -> Applicant.risk_score_screening
      - name: MONITORING
        when: "Every reporting sweep, i.e. after obligations, drawdowns and reporting behaviour exist"
        difference: |
          second_points = min(100, DELINQUENCY_POINTS_PER_REPORT
                                   * applicant.delinquent_report_count)
          third_points  = 100 if applicant.total_obligated_cents == 0 and applicant.cash_on_hand_cents > 0
                          else min(100, floor(100 * applicant.cash_on_hand_cents
                                              / max(1, applicant.total_obligated_cents)))
          -> Applicant.risk_score_monitoring, Applicant.monitoring_scored_at = clock

  - name: applicant_grant_ledger
    trigger: "Recomputed inside every request that moves a Project obligation, a Deobligation status, a Drawdown status or a ProgressReport status"
    algorithm: aggregation
    formula: |
      total_obligated_cents = sum(p.federal_share_obligated_cents - p.deobligated_cents
                                  for p : Project
                                  where p.applicant_id == applicant.id
                                    and p.status IN {OBLIGATED, CLOSEOUT_REQUESTED, CLOSED})
      total_drawn_cents     = sum(d.approved_cents for d : Drawdown
                                  where d.applicant_id == applicant.id
                                    and d.status IN {PAID, REFUNDED})
      total_refunded_cents  = sum(d.refunded_cents for d : Drawdown
                                  where d.applicant_id == applicant.id
                                    and d.status == REFUNDED)
      cash_on_hand_cents        = total_drawn_cents - total_refunded_cents
      available_drawdown_cents  = total_obligated_cents - cash_on_hand_cents
      pending_deobligation_cents = sum(o.amount_cents for o : Deobligation
                                       where Project(o.project_id).applicant_id == applicant.id
                                         and o.status == PROPOSED)
      delinquent_report_count   = count(r : ProgressReport
                                        where r.applicant_id == applicant.id
                                          and r.status == DELINQUENT)
      drawdown_status = SUSPENDED if (delinquent_report_count > 0
                                      or pending_deobligation_cents > 0) else ACTIVE
      audit_requirement = SINGLE_AUDIT if (audit_requirement == SINGLE_AUDIT
                                           or total_obligated_cents >= SINGLE_AUDIT_THRESHOLD_CENTS)
                          else NONE
      # CONSERVED QUANTITY 1 (obligation ledger):
      #   total_obligated_cents == sum over the applicant's OBLIGATED /
      #   CLOSEOUT_REQUESTED / CLOSED projects of
      #   (federal_share_obligated_cents - deobligated_cents).
      #   obligate(P, N) followed by a FINAL deobligation of exactly N, and
      #   equally a FINAL deobligation of N followed by a granted appeal that
      #   reverses N, must each leave total_obligated_cents (and
      #   Disaster.total_obligated_cents) exactly where it started.
      # CONSERVED QUANTITY 2 (cash ledger):
      #   cash_on_hand_cents == total_drawn_cents - total_refunded_cents.
      #   A PAID drawdown of N followed by a full refund of N must leave
      #   cash_on_hand_cents, available_drawdown_cents and
      #   Disaster.total_drawn_cents exactly where they started, while
      #   total_drawn_cents and total_refunded_cents each rise by N.
    input_set: "All Projects, Drawdowns, Deobligations and ProgressReports of the applicant, filtered by the status sets shown. DRAFT, UNDER_REVIEW, RFI_ISSUED, VALIDATED and DENIED projects contribute nothing; REQUESTED and REJECTED drawdowns contribute nothing; PROPOSED deobligations feed pending_deobligation_cents only."
    constants:
      SINGLE_AUDIT_THRESHOLD_CENTS: 75000000
    precision: "integer cents; no rounding (pure integer addition and subtraction)"

  - name: progress_report_schedule_status
    trigger: "ProgressReport creation (auto-created DUE row on monitoring escalation, or applicant-filed row), POST /public-assistance/progress-reports/{progress_report_id}/submit, and POST /public-assistance/applicants/{applicant_id}/reporting-sweep"
    algorithm: interval_merge
    formula: |
      # quarter_label "YYYY-Qn" -> half-open period [period_start_at, period_end_at)
      period_start_at = first instant of quarter n of year YYYY (UTC)
      period_end_at   = first instant of the following quarter (UTC)
      due_at          = period_end_at + REPORT_GRACE_DAYS days
      # on creation by an applicant filing:
      status = SUBMITTED if clock <= due_at else LATE ; submitted_at = clock
      # on the auto-created row (monitoring escalation):
      status = DUE ; submitted_at = null
      # on submit of a DUE or DELINQUENT row:
      status = SUBMITTED if clock <= due_at else LATE ; submitted_at = clock
      # on a reporting sweep:
      for r in ProgressReports of the applicant with r.status == DUE and clock > r.due_at:
          r.status = DELINQUENT
    input_set: "The applicant's own ProgressReport rows. The quarter derivation is purely a function of quarter_label; the status is a function of the logical clock relative to due_at. Reporting periods are half-open, so 2026-Q2 [2026-04-01T00:00:00Z, 2026-07-01T00:00:00Z) and 2026-Q3 [2026-07-01T00:00:00Z, 2026-10-01T00:00:00Z) are adjacent and never overlapping."
    constants:
      REPORT_GRACE_DAYS: 30
    precision: "instants are ISO 8601 UTC with three fractional digits; comparisons at due_at are inclusive (clock == due_at is on time)"

  - name: closeout_reconciliation
    trigger: "POST /public-assistance/projects/{project_id}/closeout-certify"
    algorithm: chronological
    formula: |
      if project.size_class == SMALL:
          # small projects are funded on the estimate and are never reconciled
          # against actuals, so no underrun can be recovered
          federal_share_final_cents = project.federal_share_obligated_cents
          closeout_variance_cents   = 0
          # no Deobligation is created, whatever the documented actuals say
      else:  # LARGE
          net_final_cents = max(0, project.eligible_cost_final_cents
                                   - project.mitigation_approved_cents)
          # same pinned per-component rounding order as federal_share_obligation
          federal_share_final_cents = round_half_up(net_final_cents * disaster.federal_cost_share_pct) \
                                    + round_half_up(project.mitigation_approved_cents * disaster.federal_cost_share_pct)
          closeout_variance_cents   = federal_share_final_cents - project.federal_share_obligated_cents
          if closeout_variance_cents < 0:
              create Deobligation(project_id=project.id, reason=CLOSEOUT_UNDERRUN,
                                  amount_cents = -closeout_variance_cents,
                                  status=PROPOSED, determined_by_user_id=X-User-ID)
          # a positive variance is recorded only; closeout never obligates more
    input_set: "project.eligible_cost_final_cents as written by the FINAL variant of project_eligible_cost at closeout request, project.mitigation_approved_cents, project.federal_share_obligated_cents, project.size_class as fixed at cost review, and disaster.federal_cost_share_pct."
    constants: {}
    precision: "integer cents; two independent round_half_up operations, one per component, matching federal_share_obligation exactly"

# =============================================================================
# §1.4 Validation Rules Table (evaluated in ascending priority order)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the six roles in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the role in X-User-Role is listed in the target endpoint's roles in §1.5"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "when X-User-Role == ApplicantAgent, X-User-ID equals the Applicant.id that owns every applicant-scoped resource named in the path and in the body (Facility.applicant_id, Project.applicant_id, ForceAccountResource.applicant_id, Contract.applicant_id, Facility of an InsurancePolicy, Project of a CostLineItem, Drawdown.applicant_id, ProgressReport.applicant_id, Project of the appealed Deobligation)"
    error_id: ERR_APPLICANT_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all ApplicantAgent endpoints"

  - priority: 4
    category: existence
    check: "every id embedded in the path resolves, validated left to right"
    error_id: "ERR_DISASTER_NOT_FOUND | ERR_APPLICANT_NOT_FOUND | ERR_FACILITY_NOT_FOUND | ERR_DAMAGE_SITE_NOT_FOUND | ERR_PROJECT_NOT_FOUND | ERR_COST_LINE_ITEM_NOT_FOUND | ERR_RESOURCE_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_POLICY_NOT_FOUND | ERR_DRAWDOWN_NOT_FOUND | ERR_PROGRESS_REPORT_NOT_FOUND | ERR_DEOBLIGATION_NOT_FOUND | ERR_APPEAL_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 5
    category: business_constraint
    check: "request shape: every required body field is present, enum values are members of their declared sets, integers are within their declared ranges, datetimes are ISO 8601, work_end_at > work_start_at, quarter_label matches ^\\d{4}-Q[1-4]$, cost_type-to-FK pairing is respected (force_account_resource_id required for FORCE_ACCOUNT_LABOR / FORCE_ACCOUNT_EQUIPMENT, contract_id required for CONTRACT, both null for MATERIALS), and pagination limit is within [1, 100] with offset >= 0"
    error_id: "ERR_INVALID_REQUEST | ERR_INVALID_PAGINATION"
    http_status: 422
    applies_to: all

  - priority: 6
    category: existence
    check: "every foreign key supplied in the body resolves to an existing row (disaster_id, applicant_id, facility_id, project_id, force_account_resource_id, contract_id, insurance_policy_id, deobligation_id, prior_appeal_id)"
    error_id: "ERR_DISASTER_NOT_FOUND | ERR_APPLICANT_NOT_FOUND | ERR_FACILITY_NOT_FOUND | ERR_PROJECT_NOT_FOUND | ERR_RESOURCE_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_POLICY_NOT_FOUND | ERR_DEOBLIGATION_NOT_FOUND | ERR_APPEAL_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with body foreign keys"

  - priority: 7
    category: state
    check: "OCC: expected_applicant_version equals Applicant.version on POST /public-assistance/drawdowns; expected_project_version equals Project.version on POST /public-assistance/deobligations"
    error_id: "ERR_STALE_APPLICANT_VERSION | ERR_STALE_PROJECT_VERSION"
    http_status: 412
    applies_to: "POST /public-assistance/drawdowns, POST /public-assistance/deobligations"

  - priority: 8
    category: state
    check: "the target row (and, for Drawdown creation and Deobligation creation, the referenced Project) is in a state that admits the operation per §1.2"
    error_id: "ERR_PROJECT_INVALID_STATE | ERR_DISASTER_INVALID_STATE | ERR_DAMAGE_SITE_ALREADY_ADJUDICATED | ERR_CONTRACT_ALREADY_REVIEWED | ERR_COST_LINE_ITEM_LOCKED | ERR_FACILITY_AMENDMENT_LOCKED | ERR_DRAWDOWN_INVALID_STATE | ERR_DEOBLIGATION_NOT_FINAL | ERR_APPEAL_ALREADY_DECIDED | ERR_REPORT_ALREADY_SUBMITTED"
    http_status: 409
    applies_to: "all state-changing endpoints"

  - priority: 9
    category: state
    check: "cost review requires that no CostLineItem on the project is still in review_status == SUBMITTED"
    error_id: ERR_UNREVIEWED_COST_LINE_ITEMS
    http_status: 409
    applies_to: "POST /public-assistance/projects/{project_id}/cost-review"

  - priority: 10
    category: business_temporal
    check: "damage_observed_at, and the whole charged interval [work_start_at, work_end_at], fall inside the declaration's inclusive incident period [incident_start_at, incident_end_at]"
    error_id: ERR_OUTSIDE_INCIDENT_PERIOD
    http_status: 422
    applies_to: "POST /public-assistance/damage-sites, POST /public-assistance/cost-line-items"

  - priority: 11
    category: business_temporal
    check: "an appeal is filed at a clock instant <= the appealed Deobligation.appeal_deadline_at, which is finalized_at + APPEAL_WINDOW_DAYS = 60 days"
    error_id: ERR_APPEAL_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /public-assistance/appeals"

  - priority: 12
    category: business_temporal
    check: "incident_end_at > incident_start_at at declaration, and an incident-period amendment moves incident_end_at strictly forward"
    error_id: ERR_INCIDENT_PERIOD_INVALID
    http_status: 422
    applies_to: "POST /public-assistance/disasters, PATCH /public-assistance/disasters/{disaster_id}/incident-period"

  - priority: 13
    category: business_temporal
    check: "the settled policy's closed effective interval contains the declaration's incident_start_at"
    error_id: ERR_POLICY_NOT_EFFECTIVE_AT_INCIDENT
    http_status: 422
    applies_to: "POST /public-assistance/insurance-policies/{insurance_policy_id}/record-settlement"

  - priority: 14
    category: business_safety
    check: "the project's Facility has eligibility_status == ELIGIBLE"
    error_id: ERR_FACILITY_INELIGIBLE
    http_status: 409
    applies_to: "POST /public-assistance/projects/{project_id}/submit, POST /public-assistance/projects/{project_id}/cost-review"

  - priority: 15
    category: business_safety
    check: "a PRIVATE_NONPROFIT applicant with pnp_service_type == ESSENTIAL_NON_CRITICAL has pnp_sba_referral_completed == true before it can be determined ELIGIBLE"
    error_id: ERR_PNP_SBA_REFERRAL_REQUIRED
    http_status: 409
    applies_to: "POST /public-assistance/applicants/{applicant_id}/eligibility-determination"

  - priority: 16
    category: business_safety
    check: "a CONTRACT cost line item may not be created against a Contract whose procurement_status == NONCOMPLIANT"
    error_id: ERR_PROCUREMENT_NONCOMPLIANT
    http_status: 409
    applies_to: "POST /public-assistance/cost-line-items"

  - priority: 17
    category: business_safety
    check: "a CONTRACT cost line item may not be reviewed while its Contract is still PENDING_REVIEW"
    error_id: ERR_PROCUREMENT_REVIEW_PENDING
    http_status: 409
    applies_to: "POST /public-assistance/cost-line-items/{cost_line_item_id}/review"

  - priority: 18
    category: business_safety
    check: "obligation is barred when the project's Facility has flood_zone == true and prior_disaster_flood_damage == true and no InsurancePolicy on that facility has policy_type == FLOOD with an effective interval containing the declaration's incident_start_at"
    error_id: ERR_INSURANCE_REQUIREMENT_UNMET
    http_status: 409
    applies_to: "POST /public-assistance/projects/{project_id}/obligate"

  - priority: 19
    category: business_referential
    check: "the owning Applicant has eligibility_status == ELIGIBLE"
    error_id: ERR_APPLICANT_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /public-assistance/projects/{project_id}/submit, POST /public-assistance/cost-line-items, POST /public-assistance/drawdowns"

  - priority: 20
    category: business_referential
    check: "the declaration has status == DECLARED"
    error_id: ERR_DISASTER_NOT_OPEN
    http_status: 409
    applies_to: "POST /public-assistance/projects/{project_id}/submit, POST /public-assistance/projects/{project_id}/obligate"

  - priority: 21
    category: business_referential
    check: "cross-aggregate references stay inside one applicant: a CostLineItem's ForceAccountResource or Contract belongs to the same Applicant as its Project, and a Drawdown's Project belongs to the Drawdown's Applicant"
    error_id: ERR_CROSS_APPLICANT_REFERENCE
    http_status: 409
    applies_to: "POST /public-assistance/cost-line-items, POST /public-assistance/drawdowns"

  - priority: 22
    category: business_referential
    check: "closing obligations requires that no Project under the declaration is still in status UNDER_REVIEW or RFI_ISSUED, i.e. every review has concluded"
    error_id: ERR_PROJECT_REVIEWS_OPEN
    http_status: 409
    applies_to: "POST /public-assistance/disasters/{disaster_id}/close-obligations"

  - priority: 23
    category: business_constraint
    check: "declaration_number is unique across all Disasters; (applicant_id, quarter_label) is unique across all ProgressReports"
    error_id: "ERR_DECLARATION_NUMBER_DUPLICATE | ERR_DUPLICATE_REPORT_PERIOD"
    http_status: 409
    applies_to: "POST /public-assistance/disasters, POST /public-assistance/progress-reports"

  - priority: 24
    category: business_constraint
    check: "half-open incident-period exclusivity: for a given (state_code, incident_type) no two Disasters may have overlapping periods, where the occupied interval is [incident_start_at, incident_end_at) — an incoming period whose start equals an existing period's end is adjacent and therefore allowed"
    error_id: ERR_INCIDENT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /public-assistance/disasters, PATCH /public-assistance/disasters/{disaster_id}/incident-period"

  - priority: 25
    category: business_constraint
    check: "closed-interval-plus-buffer exclusivity on a LABOR ForceAccountResource: a new labor line collides when [work_start_at - LABOR_REST_BUFFER_MINUTES, work_end_at + LABOR_REST_BUFFER_MINUTES] intersects any existing labor line's closed interval [work_start_at, work_end_at] on the same resource, with LABOR_REST_BUFFER_MINUTES = 30, so back-to-back entries and entries exactly 30 minutes apart are both rejected while an entry 31 minutes later is accepted"
    error_id: ERR_LABOR_ENTRY_OVERLAP
    http_status: 409
    applies_to: "POST /public-assistance/cost-line-items"

  - priority: 26
    category: business_constraint
    check: "aggregate daily capacity on an EQUIPMENT ForceAccountResource: for every UTC calendar day touched by the new line's interval, the sum of equipment_hours over that resource's existing lines touching the same day plus the new line's equipment_hours may not exceed EQUIPMENT_DAILY_HOURS_CAP = 16 (a total of exactly 16 is accepted); overlapping equipment intervals are permitted, only the daily aggregate is capped"
    error_id: ERR_EQUIPMENT_DAILY_HOURS_EXCEEDED
    http_status: 409
    applies_to: "POST /public-assistance/cost-line-items"

  - priority: 27
    category: business_constraint
    check: "rfi_round_count < MAX_RFI_ROUNDS = 2 before an RFI may be issued"
    error_id: ERR_RFI_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /public-assistance/projects/{project_id}/rfi"

  - priority: 28
    category: business_constraint
    check: "mitigation_requested_cents <= estimated_repair_cost_cents at project creation"
    error_id: ERR_MITIGATION_EXCEEDS_REPAIR
    http_status: 422
    applies_to: "POST /public-assistance/projects"

  - priority: 29
    category: business_constraint
    check: "segregation of duties on X-User-ID: the GrantsOfficer disbursing a Drawdown may not be the user in Project.obligated_by_user_id, and the adjudicator deciding an Appeal may not be the user in Deobligation.determined_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /public-assistance/drawdowns/{drawdown_id}/disburse, POST /public-assistance/appeals/{appeal_id}/decide"

  - priority: 30
    category: business_constraint
    check: "appeal admissibility: a SECOND-level appeal's prior_appeal_id must reference an Appeal on the same Deobligation whose status IN {DENIED, PARTIALLY_GRANTED}; no other Appeal on that Deobligation may still be SUBMITTED; and no third level may be filed once a SECOND-level appeal exists"
    error_id: "ERR_SECOND_APPEAL_REQUIRES_FIRST_DENIED | ERR_DUPLICATE_APPEAL | ERR_APPEAL_LEVEL_EXHAUSTED"
    http_status: 409
    applies_to: "POST /public-assistance/appeals"

  - priority: 31
    category: business_constraint
    check: "relief_requested_cents <= Deobligation.amount_cents; and on a PARTIALLY_GRANT decision 0 < relief_granted_cents < relief_requested_cents"
    error_id: ERR_RELIEF_EXCEEDS_DEOBLIGATION
    http_status: 422
    applies_to: "POST /public-assistance/appeals, POST /public-assistance/appeals/{appeal_id}/decide"

  - priority: 32
    category: business_constraint
    check: "settlement_amount_cents <= InsurancePolicy.coverage_limit_cents"
    error_id: ERR_SETTLEMENT_EXCEEDS_COVERAGE
    http_status: 422
    applies_to: "POST /public-assistance/insurance-policies/{insurance_policy_id}/record-settlement"

  - priority: 33
    category: business_constraint
    check: "a Deobligation's amount_cents may not exceed Project.federal_share_obligated_cents - Project.deobligated_cents - Project.pending_deobligation_cents"
    error_id: ERR_DEOBLIGATION_EXCEEDS_OBLIGATION
    http_status: 422
    applies_to: "POST /public-assistance/deobligations"

  - priority: 34
    category: business_fiscal
    check: "the Applicant has drawdown_status == ACTIVE"
    error_id: ERR_DRAWDOWN_SUSPENDED
    http_status: 409
    applies_to: "POST /public-assistance/drawdowns"

  - priority: 35
    category: business_fiscal
    check: "requested_cents <= Applicant.available_drawdown_cents (equality is allowed)"
    error_id: ERR_DRAWDOWN_EXCEEDS_AVAILABLE
    http_status: 402
    applies_to: "POST /public-assistance/drawdowns"

  - priority: 36
    category: business_fiscal
    check: "refund_cents <= Drawdown.approved_cents"
    error_id: ERR_REFUND_EXCEEDS_DRAWDOWN
    http_status: 422
    applies_to: "POST /public-assistance/drawdowns/{drawdown_id}/refund"

  - priority: 37
    category: business_fiscal
    check: "closeout request requires at least one CostLineItem on the project with review_status IN {ALLOWED, PARTIALLY_ALLOWED}"
    error_id: ERR_NO_DOCUMENTED_COSTS
    http_status: 409
    applies_to: "POST /public-assistance/projects/{project_id}/closeout-request"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- logical clock (test-driving endpoint, §1.5 priority ladder rung 3) ----
  - method: POST
    path: "/public-assistance/_clock/set_current_utc"
    description: "Sets the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z (the fixed startup default); it never falls back to real wall-clock time. Every due_at, appeal_deadline_at, screened_at, reviewed_at, filed_at, decided_at and quarter derivation reads this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock is set; no entity row is mutated"]

  # ---- Disaster ----
  - method: POST
    path: "/public-assistance/disasters"
    description: "Declare a disaster and define its incident period"
    roles: [PlatformAdmin]
    code: 201
    input: [declaration_number, state_code, incident_type, incident_start_at, incident_end_at, population, "federal_cost_share_pct?", "small_project_threshold_cents?"]
    output: Disaster
    side_effects: ["Disaster created in status DECLARED with zeroed aggregates", "declaration_number uniqueness and half-open incident-period exclusivity for (state_code, incident_type) are enforced"]
  - method: GET
    path: "/public-assistance/disasters/{disaster_id}"
    description: "Read one declaration with its rolled-up aggregates"
    roles: [PlatformAdmin, ApplicantAgent, ProgramSpecialist, GrantsOfficer, AppealsAdjudicator, StateAuditor]
    code: 200
    input: []
    output: Disaster
    side_effects: []
  - method: GET
    path: "/public-assistance/disasters"
    description: "List declarations with filters and pagination"
    roles: [PlatformAdmin, ApplicantAgent, ProgramSpecialist, GrantsOfficer, AppealsAdjudicator, StateAuditor]
    code: 200
    input: ["state_code?", "incident_type?", "status?", "limit?", "offset?"]
    output: Disaster[]
    side_effects: []
  - method: PATCH
    path: "/public-assistance/disasters/{disaster_id}/incident-period"
    description: "Extend the incident period forward; re-runs the half-open overlap check"
    roles: [PlatformAdmin]
    code: 200
    input: [incident_end_at]
    output: Disaster
    side_effects: ["Disaster.incident_end_at is extended", "increments Disaster.version by 1"]
  - method: POST
    path: "/public-assistance/disasters/{disaster_id}/close-obligations"
    description: "Close the declaration to further submissions and obligations; refused while any project review is still open"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Disaster
    side_effects: ["Disaster.status = OBLIGATION_CLOSED", "increments Disaster.version by 1"]

  # ---- Applicant ----
  - method: POST
    path: "/public-assistance/applicants"
    description: "Register an applicant under a declaration"
    roles: [PlatformAdmin]
    code: 201
    input: [disaster_id, name, applicant_type, population_served, "pnp_service_type?", "pnp_sba_referral_completed?", "tax_exempt_letter_on_file?"]
    output: Applicant
    side_effects: ["Applicant created with eligibility_status PENDING, monitoring_status STANDARD, drawdown_status ACTIVE, audit_requirement NONE and a zeroed ledger"]
  - method: GET
    path: "/public-assistance/applicants/{applicant_id}"
    description: "Read one applicant with its three status dimensions and its ledger"
    roles: [PlatformAdmin, ApplicantAgent, ProgramSpecialist, GrantsOfficer, AppealsAdjudicator, StateAuditor]
    code: 200
    input: []
    output: Applicant
    side_effects: []
  - method: GET
    path: "/public-assistance/applicants"
    description: "List applicants, filterable by declaration and status dimensions"
    roles: [PlatformAdmin, ApplicantAgent, ProgramSpecialist, GrantsOfficer, AppealsAdjudicator, StateAuditor]
    code: 200
    input: ["disaster_id?", "eligibility_status?", "monitoring_status?", "drawdown_status?", "limit?", "offset?"]
    output: Applicant[]
    side_effects: []
  - method: POST
    path: "/public-assistance/applicants/{applicant_id}/eligibility-determination"
    description: "Determine applicant eligibility and score the SCREENING risk variant"
    roles: [ProgramSpecialist]
    code: 200
    input: [decision, rationale]
    output: Applicant
    side_effects: ["Applicant.eligibility_status = ELIGIBLE or INELIGIBLE", "recompute applicant_risk_score SCREENING variant -> risk_score_screening, risk_tier", "increments Applicant.version by 1"]
  - method: POST
    path: "/public-assistance/applicants/{applicant_id}/reporting-sweep"
    description: "Advance the reporting epoch for one applicant: flag overdue DUE reports DELINQUENT and re-score the MONITORING risk variant"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Applicant
    side_effects: ["every ProgressReport of this applicant with status DUE and due_at < clock becomes DELINQUENT", "recompute applicant_grant_ledger -> delinquent_report_count, drawdown_status", "recompute applicant_risk_score MONITORING variant -> risk_score_monitoring, monitoring_scored_at, risk_tier", "Disaster.suspended_applicant_count is recomputed", "increments Applicant.version by 1"]

  # ---- Facility ----
  - method: POST
    path: "/public-assistance/facilities"
    description: "Register a facility owned by the acting applicant"
    roles: [ApplicantAgent]
    code: 201
    input: [applicant_id, name, facility_type, ownership, "in_active_use?", "legal_responsibility_documented?", "flood_zone?", "prior_disaster_flood_damage?"]
    output: Facility
    side_effects: ["Facility created with eligibility_status PENDING"]
  - method: GET
    path: "/public-assistance/facilities/{facility_id}"
    description: "Read one facility with its screening outcome"
    roles: [PlatformAdmin, ApplicantAgent, ProgramSpecialist, GrantsOfficer, AppealsAdjudicator, StateAuditor]
    code: 200
    input: []
    output: Facility
    side_effects: []
  - method: GET
    path: "/public-assistance/facilities"
    description: "List facilities, filterable by applicant and screening outcome"
    roles: [PlatformAdmin, ApplicantAgent, ProgramSpecialist, GrantsOfficer, AppealsAdjudicator, StateAuditor]
    code: 200
    input: ["applicant_id?", "eligibility_status?", "facility_type?", "limit?", "offset?"]
    output: Facility[]
    side_effects: []
  - method: PATCH
    path: "/public-assistance/facilities/{facility_id}"
    description: "Amend facility attributes; resets the screening outcome to PENDING"
    roles: [ApplicantAgent]
    code: 200
    input: ["in_active_use?", "legal_responsibility_documented?", "ownership?", "flood_zone?", "prior_disaster_flood_damage?"]
    output: Facility
    side_effects: ["amended attributes are written", "Facility.eligibility_status = PENDING; screening_failure_reason = null; screened_at = null", "increments Facility.version by 1"]
  - method: POST
    path: "/public-assistance/facilities/{facility_id}/screen"
    description: "Run facility eligibility screening"
    roles: [ProgramSpecialist]
    code: 200
    input: []
    output: Facility
    side_effects: ["Facility.eligibility_status = ELIGIBLE or INELIGIBLE with screening_failure_reason set to the first failed rule", "Facility.screened_at = clock", "increments Facility.version by 1"]

  # ---- DamageAssessmentSite ----
  - method: POST
    path: "/public-assistance/damage-sites"
    description: "Collect a damage assessment observation on a facility"
    roles: [ApplicantAgent]
    code: 201
    input: [facility_id, category, reported_loss_cents, damage_observed_at, "work_completed_pct?"]
    output: DamageAssessmentSite
    side_effects: ["DamageAssessmentSite created in validation_status REPORTED with validated_loss_cents 0"]
  - method: GET
    path: "/public-assistance/damage-sites/{damage_site_id}"
    description: "Read one damage assessment site"
    roles: [PlatformAdmin, ApplicantAgent, ProgramSpecialist, GrantsOfficer, AppealsAdjudicator, StateAuditor]
    code: 200
    input: []
    output: DamageAssessmentSite
    side_effects: []
  - method: GET
    path: "/public-assistance/damage-sites"
    description: "List damage assessment sites, filterable by facility and validation status"
    roles: [PlatformAdmin, ApplicantAgent, ProgramSpecialist, GrantsOfficer, AppealsAdjudicator, StateAuditor]
    code: 200
    input: ["facility_id?", "validation_status?", "category?", "limit?", "offset?"]
    output: DamageAssessmentSite[]
    side_effects: []
  - method: POST
    path: "/public-assistance/damage-sites/{damage_site_id}/validate"
    description: "Validate or reject a reported damage site; the VALIDATE branch refreshes the declaration's per-capita indicator"
    roles: [ProgramSpecialist]
    code: 200
    input: [decision, "validated_loss_cents?", "rejection_reason?"]
    output: DamageAssessmentSite
    side_effects: ["validation_status = VALIDATED (with validated_loss_cents written) or REJECTED (with rejection_reason written)", "on VALIDATE only: recompute disaster_validated_loss_indicator -> Disaster.total_validated_loss_cents, per_capita_impact_cents, indicator_met and increments Disaster.version by 1", "increments DamageAssessmentSite.version by 1"]

  # ---- ForceAccountResource ----
  - method: POST
    path: "/public-assistance/force-account-resources"
    description: "Register a force account labor or equipment resource"
    roles: [ApplicantAgent]
    code: 201
    input: [applicant_id, resource_kind, label, "employee_type?", "base_hourly_rate_cents?", "fringe_benefit_pct?", "equipment_code?", "published_hourly_rate_cents?", "schedule_hourly_rate_cents?"]
    output: ForceAccountResource
    side_effects: ["ForceAccountResource created with charged_hours_total 0"]
  - method: GET
    path: "/public-assistance/force-account-resources/{force_account_resource_id}"
    description: "Read one force account resource"
    roles: [PlatformAdmin, ApplicantAgent, ProgramSpecialist, GrantsOfficer, AppealsAdjudicator, StateAuditor]
    code: 200
    input: []
    output: ForceAccountResource
    side_effects: []
  - method: GET
    path: "/public-assistance/force-account-resources"
    description: "List force account resources, filterable by applicant and kind"
    roles: [PlatformAdmin, ApplicantAgent, ProgramSpecialist, GrantsOfficer, AppealsAdjudicator, StateAuditor]
    code: 200
    input: ["applicant_id?", "resource_kind?", "limit?", "offset?"]
    output: ForceAccountResource[]
    side_effects: []

  # ---- Contract ----
  - method: POST
    path: "/public-assistance/contracts"
    description: "Register a procurement award"
    roles: [ApplicantAgent]
    code: 201
    input: [applicant_id, vendor_name, contract_type, award_amount_cents, awarded_at, "bids_received?", "advertised?", "sole_source_justification_on_file?", "debarment_check_completed?"]
    output: Contract
    side_effects: ["Contract created in procurement_status PENDING_REVIEW"]
  - method: GET
    path: "/public-assistance/contracts/{contract_id}"
    description: "Read one contract with its procurement outcome"
    roles: [PlatformAdmin, ApplicantAgent, ProgramSpecialist, GrantsOfficer, AppealsAdjudicator, StateAuditor]
    code: 200
    input: []
    output: Contract
    side_effects: []
  - method: GET
    path: "/public-assistance/contracts"
    description: "List contracts, filterable by applicant and procurement outcome"
    roles: [PlatformAdmin, ApplicantAgent, ProgramSpecialist, GrantsOfficer, AppealsAdjudicator, StateAuditor]
    code: 200
    input: ["applicant_id?", "procurement_status?", "contract_type?", "limit?", "offset?"]
    output: Contract[]
    side_effects: []
  - method: POST
    path: "/public-assistance/contracts/{contract_id}/procurement-review"
    description: "Run the procurement compliance cascade on a contract"
    roles: [ProgramSpecialist]
    code: 200
    input: []
    output: Contract
    side_effects: ["Contract.procurement_status = COMPLIANT or NONCOMPLIANT with noncompliance_reason set to the first failed rule", "increments Contract.version by 1"]

  # ---- InsurancePolicy ----
  - method: POST
    path: "/public-assistance/insurance-policies"
    description: "Register an insurance policy on a facility"
    roles: [ApplicantAgent]
    code: 201
    input: [facility_id, insurer_name, policy_type, coverage_limit_cents, effective_start_at, effective_end_at, "deductible_cents?", "is_nfip?"]
    output: InsurancePolicy
    side_effects: ["InsurancePolicy created with settlement_amount_cents 0"]
  - method: GET
    path: "/public-assistance/insurance-policies/{insurance_policy_id}"
    description: "Read one insurance policy with its settlement allocation"
    roles: [PlatformAdmin, ApplicantAgent, ProgramSpecialist, GrantsOfficer, AppealsAdjudicator, StateAuditor]
    code: 200
    input: []
    output: InsurancePolicy
    side_effects: []
  - method: GET
    path: "/public-assistance/insurance-policies"
    description: "List insurance policies, filterable by facility and type"
    roles: [PlatformAdmin, ApplicantAgent, ProgramSpecialist, GrantsOfficer, AppealsAdjudicator, StateAuditor]
    code: 200
    input: ["facility_id?", "policy_type?", "limit?", "offset?"]
    output: InsurancePolicy[]
    side_effects: []
  - method: POST
    path: "/public-assistance/insurance-policies/{insurance_policy_id}/record-settlement"
    description: "Record insurance proceeds and run the duplication-of-benefits waterfall across the facility's projects"
    roles: [GrantsOfficer]
    code: 200
    input: [settlement_amount_cents, settled_at]
    output: InsurancePolicy
    side_effects: ["InsurancePolicy.settlement_amount_cents, settled_at, allocated_cents, unallocated_cents written", "run insurance_dob_waterfall: each candidate Project's settlement_allocated_cents and insurance_reduction_cents rise in (category ASC, created_at ASC) order", "for every OBLIGATED or CLOSEOUT_REQUESTED project whose recomputed federal share falls short, a Deobligation with reason INSURANCE_DOB is created in status PROPOSED", "each such Deobligation raises Project.pending_deobligation_cents and Applicant.pending_deobligation_cents, which suspends the applicant's drawdowns and refreshes Disaster.suspended_applicant_count", "increments InsurancePolicy.version by 1 and the version of every touched Project, Applicant and Disaster"]

  # ---- Project ----
  - method: POST
    path: "/public-assistance/projects"
    description: "Formulate a project in DRAFT against an eligible facility"
    roles: [ApplicantAgent]
    code: 201
    input: [applicant_id, facility_id, category, title, scope_of_work, estimated_repair_cost_cents, "mitigation_requested_cents?"]
    output: Project
    side_effects: ["Project created in status DRAFT with size_class null and every basis field zeroed"]
  - method: GET
    path: "/public-assistance/projects/{project_id}"
    description: "Read one project with both cost variants and its obligation ledger fields"
    roles: [PlatformAdmin, ApplicantAgent, ProgramSpecialist, GrantsOfficer, AppealsAdjudicator, StateAuditor]
    code: 200
    input: []
    output: Project
    side_effects: []
  - method: GET
    path: "/public-assistance/projects"
    description: "List projects, filterable by applicant, facility, status and size class"
    roles: [PlatformAdmin, ApplicantAgent, ProgramSpecialist, GrantsOfficer, AppealsAdjudicator, StateAuditor]
    code: 200
    input: ["applicant_id?", "facility_id?", "status?", "size_class?", "category?", "limit?", "offset?"]
    output: Project[]
    side_effects: []
  - method: POST
    path: "/public-assistance/projects/{project_id}/submit"
    description: "Submit a drafted project for state review; computes the PROVISIONAL cost variant"
    roles: [ApplicantAgent]
    code: 200
    input: []
    output: Project
    side_effects: ["Project.status = UNDER_REVIEW; work_type derived from category", "recompute project_eligible_cost PROVISIONAL variant -> size_class, anticipated_insurance_cents, mitigation_approved_cents, eligible_cost_provisional_cents", "increments Project.version by 1"]
  - method: POST
    path: "/public-assistance/projects/{project_id}/rfi"
    description: "Issue a request for information, bounded by MAX_RFI_ROUNDS = 2"
    roles: [ProgramSpecialist]
    code: 200
    input: [question]
    output: Project
    side_effects: ["Project.status = RFI_ISSUED; rfi_round_count += 1; last_rfi_question written", "increments Project.version by 1"]
  - method: POST
    path: "/public-assistance/projects/{project_id}/rfi-response"
    description: "Answer an outstanding RFI and optionally revise the estimate; re-computes the PROVISIONAL cost variant"
    roles: [ApplicantAgent]
    code: 200
    input: [response, "revised_estimate_cents?"]
    output: Project
    side_effects: ["Project.status = UNDER_REVIEW; estimated_repair_cost_cents replaced when revised_estimate_cents is supplied", "recompute project_eligible_cost PROVISIONAL variant -> size_class, anticipated_insurance_cents, mitigation_approved_cents, eligible_cost_provisional_cents", "increments Project.version by 1"]
  - method: POST
    path: "/public-assistance/projects/{project_id}/cost-review"
    description: "Validate or deny the project after cost eligibility review; the VALIDATE branch fixes the obligation basis and freezes the mitigation award"
    roles: [ProgramSpecialist]
    code: 200
    input: [decision, "denial_reason?"]
    output: Project
    side_effects: ["on VALIDATE: recompute project_review_basis then mitigation_cap_allocation -> repair_eligible_cents, size_class, anticipated_insurance_cents, insurance_reduction_cents, mitigation_approved_cents; status = VALIDATED", "on DENY: status = DENIED with denial_reason and no basis or ledger field touched", "cost_reviewed_by_user_id = X-User-ID", "increments Project.version by 1"]
  - method: POST
    path: "/public-assistance/projects/{project_id}/obligate"
    description: "Obligate the federal share and post it to the applicant and declaration ledgers"
    roles: [GrantsOfficer]
    code: 200
    input: []
    output: Project
    side_effects: ["recompute federal_share_obligation -> federal_share_obligated_cents; status = OBLIGATED; obligated_by_user_id = X-User-ID", "recompute applicant_grant_ledger -> Applicant.total_obligated_cents, available_drawdown_cents", "when Applicant.total_obligated_cents reaches SINGLE_AUDIT_THRESHOLD_CENTS: audit_requirement = SINGLE_AUDIT and monitoring_status = ENHANCED", "when monitoring_status became ENHANCED: a ProgressReport for the current quarter is created in status DUE", "Disaster.total_obligated_cents and enhanced_monitoring_applicant_count recomputed", "increments Project.version, Applicant.version and Disaster.version by 1 each"]
  - method: POST
    path: "/public-assistance/projects/{project_id}/closeout-request"
    description: "Request closeout with documented actual costs; computes the FINAL cost variant"
    roles: [ApplicantAgent]
    code: 200
    input: []
    output: Project
    side_effects: ["recompute project_eligible_cost FINAL variant -> eligible_cost_final_cents", "Project.status = CLOSEOUT_REQUESTED", "increments Project.version by 1"]
  - method: POST
    path: "/public-assistance/projects/{project_id}/closeout-certify"
    description: "Audit and certify closeout; LARGE projects are reconciled against actuals and SMALL projects are not"
    roles: [StateAuditor]
    code: 200
    input: [audit_finding]
    output: Project
    side_effects: ["recompute closeout_reconciliation -> federal_share_final_cents, closeout_variance_cents; status = CLOSED", "for a LARGE project with a negative variance, a Deobligation with reason CLOSEOUT_UNDERRUN is created in status PROPOSED with determined_by_user_id = X-User-ID", "that Deobligation raises Project.pending_deobligation_cents and Applicant.pending_deobligation_cents, suspends the applicant's drawdowns and refreshes Disaster.suspended_applicant_count", "increments Project.version by 1 and Applicant.version by 1 when the ledger moved"]

  # ---- CostLineItem ----
  - method: POST
    path: "/public-assistance/cost-line-items"
    description: "Claim a force account labor, force account equipment, materials or contracted cost against a project"
    roles: [ApplicantAgent]
    code: 201
    input: [project_id, cost_type, claimed_cents, work_start_at, work_end_at, "force_account_resource_id?", "contract_id?", "straight_time_hours?", "overtime_hours?", "equipment_hours?"]
    output: CostLineItem
    side_effects: ["CostLineItem created in review_status SUBMITTED with eligible_cents 0", "labor entries are checked against the closed-interval-plus-buffer rule on the resource; equipment entries against the aggregate daily hours cap"]
  - method: GET
    path: "/public-assistance/cost-line-items/{cost_line_item_id}"
    description: "Read one cost line item with its eligibility outcome"
    roles: [PlatformAdmin, ApplicantAgent, ProgramSpecialist, GrantsOfficer, AppealsAdjudicator, StateAuditor]
    code: 200
    input: []
    output: CostLineItem
    side_effects: []
  - method: GET
    path: "/public-assistance/cost-line-items"
    description: "List cost line items, filterable by project, resource, contract and review outcome"
    roles: [PlatformAdmin, ApplicantAgent, ProgramSpecialist, GrantsOfficer, AppealsAdjudicator, StateAuditor]
    code: 200
    input: ["project_id?", "force_account_resource_id?", "contract_id?", "review_status?", "cost_type?", "limit?", "offset?"]
    output: CostLineItem[]
    side_effects: []
  - method: POST
    path: "/public-assistance/cost-line-items/{cost_line_item_id}/review"
    description: "Run cost eligibility review on one claimed line"
    roles: [ProgramSpecialist]
    code: 200
    input: []
    output: CostLineItem
    side_effects: ["recompute cost_line_item_eligible_cost -> eligible_cents, review_status, disallowance_reason, reviewed_at", "ForceAccountResource.charged_hours_total and, for CONTRACT lines, Contract.allowed_cost_total_cents recomputed", "increments CostLineItem.version by 1"]

  # ---- Drawdown ----
  - method: POST
    path: "/public-assistance/drawdowns"
    description: "Request a cash drawdown against an obligated project; guarded by optimistic concurrency on the applicant's version"
    roles: [ApplicantAgent]
    code: 201
    input: [applicant_id, project_id, requested_cents, expected_applicant_version]
    output: Drawdown
    side_effects: ["Drawdown created in status REQUESTED", "increments Applicant.version by 1"]
  - method: GET
    path: "/public-assistance/drawdowns/{drawdown_id}"
    description: "Read one drawdown"
    roles: [PlatformAdmin, ApplicantAgent, ProgramSpecialist, GrantsOfficer, AppealsAdjudicator, StateAuditor]
    code: 200
    input: []
    output: Drawdown
    side_effects: []
  - method: GET
    path: "/public-assistance/drawdowns"
    description: "List drawdowns, filterable by applicant, project and status"
    roles: [PlatformAdmin, ApplicantAgent, ProgramSpecialist, GrantsOfficer, AppealsAdjudicator, StateAuditor]
    code: 200
    input: ["applicant_id?", "project_id?", "status?", "limit?", "offset?"]
    output: Drawdown[]
    side_effects: []
  - method: POST
    path: "/public-assistance/drawdowns/{drawdown_id}/disburse"
    description: "Pay or reject a requested drawdown; the paying officer may not be the officer who obligated the project"
    roles: [GrantsOfficer]
    code: 200
    input: [decision, "rejection_reason?"]
    output: Drawdown
    side_effects: ["on PAY: approved_cents = requested_cents, status = PAID, disbursed_by_user_id = X-User-ID, Applicant cash ledger and Disaster.total_drawn_cents recomputed, Applicant.version and Disaster.version incremented", "on REJECT: status = REJECTED with rejection_reason and no ledger movement", "increments Drawdown.version by 1"]
  - method: POST
    path: "/public-assistance/drawdowns/{drawdown_id}/refund"
    description: "Return disbursed cash; the compensating action for a paid drawdown"
    roles: [ApplicantAgent]
    code: 200
    input: [refund_cents]
    output: Drawdown
    side_effects: ["Drawdown.refunded_cents written; status = REFUNDED", "recompute applicant_grant_ledger -> total_refunded_cents, cash_on_hand_cents, available_drawdown_cents; Disaster.total_drawn_cents recomputed", "increments Drawdown.version, Applicant.version and Disaster.version by 1 each"]

  # ---- ProgressReport ----
  - method: POST
    path: "/public-assistance/progress-reports"
    description: "File a quarterly progress report the system did not pre-create"
    roles: [ApplicantAgent]
    code: 201
    input: [applicant_id, quarter_label, "expenditures_to_date_cents?", "pct_complete?"]
    output: ProgressReport
    side_effects: ["period_start_at, period_end_at and due_at derived from quarter_label", "status = SUBMITTED when clock <= due_at, else LATE; submitted_at = clock", "(applicant_id, quarter_label) uniqueness enforced"]
  - method: GET
    path: "/public-assistance/progress-reports/{progress_report_id}"
    description: "Read one progress report"
    roles: [PlatformAdmin, ApplicantAgent, ProgramSpecialist, GrantsOfficer, AppealsAdjudicator, StateAuditor]
    code: 200
    input: []
    output: ProgressReport
    side_effects: []
  - method: GET
    path: "/public-assistance/progress-reports"
    description: "List progress reports, filterable by applicant and status"
    roles: [PlatformAdmin, ApplicantAgent, ProgramSpecialist, GrantsOfficer, AppealsAdjudicator, StateAuditor]
    code: 200
    input: ["applicant_id?", "status?", "quarter_label?", "limit?", "offset?"]
    output: ProgressReport[]
    side_effects: []
  - method: POST
    path: "/public-assistance/progress-reports/{progress_report_id}/submit"
    description: "File data against a DUE or DELINQUENT report row; a DELINQUENT filing cures the applicant's suspension"
    roles: [ApplicantAgent]
    code: 200
    input: [expenditures_to_date_cents, pct_complete]
    output: ProgressReport
    side_effects: ["status = SUBMITTED when clock <= due_at else LATE; submitted_at = clock", "when the row was DELINQUENT: Applicant.delinquent_report_count recomputed, drawdown_status returns to ACTIVE when pending_deobligation_cents == 0, Disaster.suspended_applicant_count recomputed", "increments ProgressReport.version by 1 and Applicant.version by 1 when the ledger moved"]

  # ---- Deobligation ----
  - method: POST
    path: "/public-assistance/deobligations"
    description: "Record a deobligation determination against an obligated project; guarded by optimistic concurrency on the project's version"
    roles: [GrantsOfficer, StateAuditor]
    code: 201
    input: [project_id, reason, amount_cents, expected_project_version]
    output: Deobligation
    side_effects: ["Deobligation created in status PROPOSED with determined_by_user_id = X-User-ID", "Project.pending_deobligation_cents and Applicant.pending_deobligation_cents recomputed, which sets Applicant.drawdown_status = SUSPENDED and refreshes Disaster.suspended_applicant_count", "increments Project.version by 1 and Applicant.version by 1"]
  - method: GET
    path: "/public-assistance/deobligations/{deobligation_id}"
    description: "Read one deobligation determination with its appeal deadline"
    roles: [PlatformAdmin, ApplicantAgent, ProgramSpecialist, GrantsOfficer, AppealsAdjudicator, StateAuditor]
    code: 200
    input: []
    output: Deobligation
    side_effects: []
  - method: GET
    path: "/public-assistance/deobligations"
    description: "List deobligation determinations, filterable by project and status"
    roles: [PlatformAdmin, ApplicantAgent, ProgramSpecialist, GrantsOfficer, AppealsAdjudicator, StateAuditor]
    code: 200
    input: ["project_id?", "status?", "reason?", "limit?", "offset?"]
    output: Deobligation[]
    side_effects: []
  - method: POST
    path: "/public-assistance/deobligations/{deobligation_id}/finalize"
    description: "Finalize a proposed determination, reduce the obligation ledger and open the appeal window"
    roles: [GrantsOfficer]
    code: 200
    input: []
    output: Deobligation
    side_effects: ["status = FINAL; finalized_at = clock; appeal_deadline_at = clock + APPEAL_WINDOW_DAYS", "Project.deobligated_cents += amount_cents and pending_deobligation_cents -= amount_cents", "recompute applicant_grant_ledger -> total_obligated_cents, pending_deobligation_cents, available_drawdown_cents, drawdown_status; Disaster.total_obligated_cents and suspended_applicant_count recomputed", "increments Deobligation.version, Project.version, Applicant.version and Disaster.version by 1 each"]

  # ---- Appeal ----
  - method: POST
    path: "/public-assistance/appeals"
    description: "File a first- or second-level appeal against a finalized deobligation"
    roles: [ApplicantAgent]
    code: 201
    input: [deobligation_id, grounds, relief_requested_cents, "prior_appeal_id?"]
    output: Appeal
    side_effects: ["Appeal created in status SUBMITTED with filed_at = clock and level derived from prior_appeal_id"]
  - method: GET
    path: "/public-assistance/appeals/{appeal_id}"
    description: "Read one appeal"
    roles: [PlatformAdmin, ApplicantAgent, ProgramSpecialist, GrantsOfficer, AppealsAdjudicator, StateAuditor]
    code: 200
    input: []
    output: Appeal
    side_effects: []
  - method: GET
    path: "/public-assistance/appeals"
    description: "List appeals, filterable by deobligation, escalation parent and status"
    roles: [PlatformAdmin, ApplicantAgent, ProgramSpecialist, GrantsOfficer, AppealsAdjudicator, StateAuditor]
    code: 200
    input: ["deobligation_id?", "prior_appeal_id?", "status?", "level?", "limit?", "offset?"]
    output: Appeal[]
    side_effects: []
  - method: POST
    path: "/public-assistance/appeals/{appeal_id}/decide"
    description: "Decide an appeal: grant, partially grant, deny or remand, each with its own side-effect set"
    roles: [AppealsAdjudicator]
    code: 200
    input: [decision, decision_rationale, "relief_granted_cents?"]
    output: Appeal
    side_effects: ["status = GRANTED | PARTIALLY_GRANTED | DENIED | REMANDED; decided_at = clock; decided_by_user_id = X-User-ID", "on GRANT and PARTIALLY_GRANT: the Deobligation absorbs relief_granted_cents, Project.deobligated_cents falls, and the Applicant and Disaster obligation ledgers are restored", "on DENY: nothing outside the Appeal row moves and a SECOND-level appeal becomes admissible", "on REMAND: the Deobligation returns to PROPOSED with finalized_at and appeal_deadline_at cleared, Project.deobligated_cents falls back, Project.pending_deobligation_cents rises, and the applicant's drawdowns are suspended again", "increments Appeal.version by 1 plus the versions of every touched Deobligation, Project, Applicant and Disaster"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six declared roles" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "the acting role is not listed for the endpoint in §1.5" }
  - { id: ERR_APPLICANT_SCOPE_VIOLATION, http: 403, condition: "an ApplicantAgent acts on a resource that does not roll up to the Applicant identified by X-User-ID" }
  - { id: ERR_DISASTER_NOT_FOUND, http: 404, condition: "disaster_id in the path or body does not resolve" }
  - { id: ERR_APPLICANT_NOT_FOUND, http: 404, condition: "applicant_id in the path or body does not resolve" }
  - { id: ERR_FACILITY_NOT_FOUND, http: 404, condition: "facility_id in the path or body does not resolve" }
  - { id: ERR_DAMAGE_SITE_NOT_FOUND, http: 404, condition: "damage_site_id in the path does not resolve" }
  - { id: ERR_PROJECT_NOT_FOUND, http: 404, condition: "project_id in the path or body does not resolve" }
  - { id: ERR_COST_LINE_ITEM_NOT_FOUND, http: 404, condition: "cost_line_item_id in the path does not resolve" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "force_account_resource_id in the path or body does not resolve" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "contract_id in the path or body does not resolve" }
  - { id: ERR_POLICY_NOT_FOUND, http: 404, condition: "insurance_policy_id in the path does not resolve" }
  - { id: ERR_DRAWDOWN_NOT_FOUND, http: 404, condition: "drawdown_id in the path does not resolve" }
  - { id: ERR_PROGRESS_REPORT_NOT_FOUND, http: 404, condition: "progress_report_id in the path does not resolve" }
  - { id: ERR_DEOBLIGATION_NOT_FOUND, http: 404, condition: "deobligation_id in the path or body does not resolve" }
  - { id: ERR_APPEAL_NOT_FOUND, http: 404, condition: "appeal_id in the path, or prior_appeal_id in the body, does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "a required body field is missing, an enum value is not a declared member, a number is out of range, a datetime is not ISO 8601, work_end_at <= work_start_at, quarter_label is malformed, or the cost_type-to-foreign-key pairing is violated" }
  - { id: ERR_INVALID_PAGINATION, http: 422, condition: "limit outside [1, 100] or offset < 0 on any list endpoint" }
  - { id: ERR_STALE_APPLICANT_VERSION, http: 412, condition: "expected_applicant_version on POST /public-assistance/drawdowns does not equal the Applicant's current version" }
  - { id: ERR_STALE_PROJECT_VERSION, http: 412, condition: "expected_project_version on POST /public-assistance/deobligations does not equal the Project's current version" }
  - { id: ERR_PROJECT_INVALID_STATE, http: 409, condition: "the project is not in a status that admits the requested operation (including drawdown creation against a project that is not OBLIGATED)" }
  - { id: ERR_DISASTER_INVALID_STATE, http: 409, condition: "the declaration is not in status DECLARED for an incident-period amendment or a second close-obligations call" }
  - { id: ERR_DAMAGE_SITE_ALREADY_ADJUDICATED, http: 409, condition: "the damage site's validation_status is already VALIDATED or REJECTED" }
  - { id: ERR_CONTRACT_ALREADY_REVIEWED, http: 409, condition: "the contract's procurement_status is already COMPLIANT or NONCOMPLIANT" }
  - { id: ERR_COST_LINE_ITEM_LOCKED, http: 409, condition: "a cost line item is created or reviewed while its project is VALIDATED, CLOSEOUT_REQUESTED, CLOSED or DENIED" }
  - { id: ERR_FACILITY_AMENDMENT_LOCKED, http: 409, condition: "a facility amendment is attempted while a project on that facility is VALIDATED, OBLIGATED or CLOSEOUT_REQUESTED" }
  - { id: ERR_DRAWDOWN_INVALID_STATE, http: 409, condition: "a drawdown is disbursed when not REQUESTED, or refunded when not PAID" }
  - { id: ERR_DEOBLIGATION_NOT_FINAL, http: 409, condition: "an appeal is filed against a determination whose status is not FINAL" }
  - { id: ERR_APPEAL_ALREADY_DECIDED, http: 409, condition: "an appeal decision is issued on an appeal whose status is not SUBMITTED" }
  - { id: ERR_REPORT_ALREADY_SUBMITTED, http: 409, condition: "a progress report submission targets a row whose status is already SUBMITTED or LATE" }
  - { id: ERR_UNREVIEWED_COST_LINE_ITEMS, http: 409, condition: "cost review is requested while at least one cost line item on the project is still SUBMITTED" }
  - { id: ERR_OUTSIDE_INCIDENT_PERIOD, http: 422, condition: "damage_observed_at, or any part of [work_start_at, work_end_at], falls outside the declaration's inclusive incident period" }
  - { id: ERR_APPEAL_WINDOW_EXPIRED, http: 422, condition: "the logical clock is past the appealed determination's appeal_deadline_at" }
  - { id: ERR_INCIDENT_PERIOD_INVALID, http: 422, condition: "incident_end_at <= incident_start_at at declaration, or an amendment that does not move incident_end_at strictly forward" }
  - { id: ERR_POLICY_NOT_EFFECTIVE_AT_INCIDENT, http: 422, condition: "a settlement is recorded on a policy whose effective interval does not contain the declaration's incident_start_at" }
  - { id: ERR_FACILITY_INELIGIBLE, http: 409, condition: "project submission or cost review while the project's facility is not ELIGIBLE" }
  - { id: ERR_PNP_SBA_REFERRAL_REQUIRED, http: 409, condition: "an ESSENTIAL_NON_CRITICAL private nonprofit is determined ELIGIBLE without a completed SBA referral" }
  - { id: ERR_PROCUREMENT_NONCOMPLIANT, http: 409, condition: "a CONTRACT cost line item is created against a contract whose procurement_status is NONCOMPLIANT" }
  - { id: ERR_PROCUREMENT_REVIEW_PENDING, http: 409, condition: "a CONTRACT cost line item is reviewed while its contract is still PENDING_REVIEW" }
  - { id: ERR_INSURANCE_REQUIREMENT_UNMET, http: 409, condition: "obligation of a project on a flood-zone facility with prior flood damage that carries no FLOOD policy covering the incident start" }
  - { id: ERR_APPLICANT_NOT_ELIGIBLE, http: 409, condition: "project submission, cost line item creation or drawdown creation while the applicant is not ELIGIBLE" }
  - { id: ERR_DISASTER_NOT_OPEN, http: 409, condition: "project submission or obligation while the declaration is OBLIGATION_CLOSED" }
  - { id: ERR_CROSS_APPLICANT_REFERENCE, http: 409, condition: "a cost line item references a resource or contract of another applicant, or a drawdown references a project of another applicant" }
  - { id: ERR_PROJECT_REVIEWS_OPEN, http: 409, condition: "close-obligations is called while a project under the declaration is still UNDER_REVIEW or RFI_ISSUED" }
  - { id: ERR_DECLARATION_NUMBER_DUPLICATE, http: 409, condition: "declaration_number already exists" }
  - { id: ERR_DUPLICATE_REPORT_PERIOD, http: 409, condition: "a progress report already exists for this (applicant_id, quarter_label)" }
  - { id: ERR_INCIDENT_PERIOD_OVERLAP, http: 409, condition: "the half-open interval [incident_start_at, incident_end_at) collides with another declaration of the same state_code and incident_type" }
  - { id: ERR_LABOR_ENTRY_OVERLAP, http: 409, condition: "a labor line's interval, widened by the 30-minute rest buffer on both sides, intersects an existing labor line on the same resource" }
  - { id: ERR_EQUIPMENT_DAILY_HOURS_EXCEEDED, http: 409, condition: "equipment hours charged on one resource for a single UTC calendar day would exceed EQUIPMENT_DAILY_HOURS_CAP" }
  - { id: ERR_RFI_ROUNDS_EXHAUSTED, http: 409, condition: "a third RFI is issued on the same project" }
  - { id: ERR_MITIGATION_EXCEEDS_REPAIR, http: 422, condition: "mitigation_requested_cents exceeds estimated_repair_cost_cents at project creation" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "the disbursing officer is the obligating officer of the project, or the deciding adjudicator determined the deobligation under appeal" }
  - { id: ERR_SECOND_APPEAL_REQUIRES_FIRST_DENIED, http: 409, condition: "prior_appeal_id does not reference an appeal on the same determination whose status is DENIED or PARTIALLY_GRANTED" }
  - { id: ERR_DUPLICATE_APPEAL, http: 409, condition: "another appeal on the same determination is still SUBMITTED" }
  - { id: ERR_APPEAL_LEVEL_EXHAUSTED, http: 409, condition: "an appeal is filed against a determination that already carries a SECOND-level appeal" }
  - { id: ERR_RELIEF_EXCEEDS_DEOBLIGATION, http: 422, condition: "relief_requested_cents exceeds the determination's amount_cents, or relief_granted_cents is not strictly between 0 and relief_requested_cents on a PARTIALLY_GRANT decision" }
  - { id: ERR_SETTLEMENT_EXCEEDS_COVERAGE, http: 422, condition: "settlement_amount_cents exceeds the policy's coverage_limit_cents" }
  - { id: ERR_DEOBLIGATION_EXCEEDS_OBLIGATION, http: 422, condition: "amount_cents exceeds the project's remaining obligation net of prior final and proposed determinations" }
  - { id: ERR_DRAWDOWN_SUSPENDED, http: 409, condition: "a drawdown is requested while the applicant's drawdown_status is SUSPENDED" }
  - { id: ERR_DRAWDOWN_EXCEEDS_AVAILABLE, http: 402, condition: "requested_cents exceeds the applicant's available_drawdown_cents" }
  - { id: ERR_REFUND_EXCEEDS_DRAWDOWN, http: 422, condition: "refund_cents exceeds the drawdown's approved_cents" }
  - { id: ERR_NO_DOCUMENTED_COSTS, http: 409, condition: "closeout is requested with no ALLOWED or PARTIALLY_ALLOWED cost line item on the project" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "State program office administrator: declares disasters, defines and extends incident periods, registers applicants, advances the reporting epoch and drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /public-assistance/disasters"
      - "PATCH /public-assistance/disasters/{disaster_id}/incident-period"
      - "POST /public-assistance/disasters/{disaster_id}/close-obligations"
      - "POST /public-assistance/applicants"
      - "POST /public-assistance/applicants/{applicant_id}/reporting-sweep"
      - "POST /public-assistance/_clock/set_current_utc"
    shared_operations: ["every GET endpoint"]

  - name: ApplicantAgent
    description: "Authorized agent of one applicant: registers facilities, resources, contracts and policies, collects damage data, formulates projects, claims costs, requests and refunds cash, files reports and appeals"
    identity: "entity_backed:Applicant"
    exclusive_operations:
      - "POST /public-assistance/facilities"
      - "PATCH /public-assistance/facilities/{facility_id}"
      - "POST /public-assistance/damage-sites"
      - "POST /public-assistance/force-account-resources"
      - "POST /public-assistance/contracts"
      - "POST /public-assistance/insurance-policies"
      - "POST /public-assistance/projects"
      - "POST /public-assistance/projects/{project_id}/submit"
      - "POST /public-assistance/projects/{project_id}/rfi-response"
      - "POST /public-assistance/projects/{project_id}/closeout-request"
      - "POST /public-assistance/cost-line-items"
      - "POST /public-assistance/drawdowns"
      - "POST /public-assistance/drawdowns/{drawdown_id}/refund"
      - "POST /public-assistance/progress-reports"
      - "POST /public-assistance/progress-reports/{progress_report_id}/submit"
      - "POST /public-assistance/appeals"
    shared_operations: ["every GET endpoint"]

  - name: ProgramSpecialist
    description: "State reviewer: determines applicant eligibility, screens facilities, validates damage assessments, reviews procurement and cost eligibility, issues RFIs, and validates or denies projects"
    identity: opaque
    exclusive_operations:
      - "POST /public-assistance/applicants/{applicant_id}/eligibility-determination"
      - "POST /public-assistance/facilities/{facility_id}/screen"
      - "POST /public-assistance/damage-sites/{damage_site_id}/validate"
      - "POST /public-assistance/contracts/{contract_id}/procurement-review"
      - "POST /public-assistance/cost-line-items/{cost_line_item_id}/review"
      - "POST /public-assistance/projects/{project_id}/rfi"
      - "POST /public-assistance/projects/{project_id}/cost-review"
    shared_operations: ["every GET endpoint"]

  - name: GrantsOfficer
    description: "Obligation and cash officer: obligates validated projects, records insurance settlements, disburses drawdowns and finalizes deobligation determinations. Segregation of duties bars the officer who obligated a project from disbursing its drawdowns"
    identity: opaque
    exclusive_operations:
      - "POST /public-assistance/projects/{project_id}/obligate"
      - "POST /public-assistance/insurance-policies/{insurance_policy_id}/record-settlement"
      - "POST /public-assistance/drawdowns/{drawdown_id}/disburse"
      - "POST /public-assistance/deobligations/{deobligation_id}/finalize"
    shared_operations:
      - "POST /public-assistance/deobligations"
      - "every GET endpoint"

  - name: AppealsAdjudicator
    description: "Independent adjudicator: decides first- and second-level appeals. Segregation of duties bars the user who determined a deobligation from deciding an appeal against it"
    identity: opaque
    exclusive_operations:
      - "POST /public-assistance/appeals/{appeal_id}/decide"
    shared_operations: ["every GET endpoint"]

  - name: StateAuditor
    description: "Closeout auditor: certifies project closeout, records audit-driven deobligation determinations, and reads every record"
    identity: opaque
    exclusive_operations:
      - "POST /public-assistance/projects/{project_id}/closeout-certify"
    shared_operations:
      - "POST /public-assistance/deobligations"
      - "every GET endpoint"
