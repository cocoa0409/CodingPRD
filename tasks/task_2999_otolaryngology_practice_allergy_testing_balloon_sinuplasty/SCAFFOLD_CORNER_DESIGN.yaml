            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10233", full_name: "Quinn Adeyemi", date_of_birth: "1974-07-07", epinephrine_on_file: true }
              as: PracticeAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /diagnostic-studies"
              payload: { patient_id: "${pat_id}", study_type: "SLEEP_HSAT" }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
              captures: { study_id: $.data.id }
            - call: "POST /diagnostic-studies/${study_id}/results"
              payload: { ahi: 20.0 }
              as: Audiologist
              as_user_id: "u_aud_1"
            - call: "POST /diagnostic-studies/${study_id}/interpretation"
              payload: {}
              as: Audiologist
              as_user_id: "u_aud_2"
              captures: { study_v: $.data.version, rec: $.data.recommendation }
            - call: "POST /supply-lots"
              payload: { item_type: "HEARING_AID", lot_number: "LOT-1018", quantity_received: 4, expires_at: "2028-01-01T00:00:00Z" }
              as: PracticeAdmin
              captures: { lot_hearing: $.data.id }
            - call: "POST /supply-lots"
              payload: { item_type: "ORAL_APPLIANCE", lot_number: "LOT-1019", quantity_received: 4, expires_at: "2028-01-01T00:00:00Z" }
              as: PracticeAdmin
              captures: { lot_appliance: $.data.id }
          trigger:
            - call: "POST /device-dispenses"
              payload: { diagnostic_study_id: "${study_id}", supply_lot_id: "${lot_hearing}", device_type: "ORAL_APPLIANCE", device_serial: "OA500001", ear: "NA", price_cents: 140000, expected_study_version: "${study_v}" }
              as: Audiologist
              as_user_id: "u_aud_1"
            - call: "POST /device-dispenses"
              payload: { diagnostic_study_id: "${study_id}", supply_lot_id: "${lot_hearing}", device_type: "HEARING_AID", device_serial: "HA400004", ear: "LEFT", price_cents: 140000, expected_study_version: "${study_v}" }
              as: Audiologist
              as_user_id: "u_aud_1"
            - call: "POST /device-dispenses"
              payload: { diagnostic_study_id: "${study_id}", supply_lot_id: "${lot_appliance}", device_type: "ORAL_APPLIANCE", device_serial: "OA500001", ear: "NA", price_cents: 140000, expected_study_version: "${study_v}" }
              as: Audiologist
              as_user_id: "u_aud_1"
              captures: { disp_id: $.data.id }
          assert:
            - "${rec} == \"ORAL_APPLIANCE\" — SLEEP_HSAT with ahi 20 sits inside the inclusive 5..30 band"
            - "Call 1 returns HTTP 409 with error.id == \"ERR_LOT_ITEM_TYPE_MISMATCH\" — the device_type matches the recommendation, so only the lot limb is violated"
            - "Call 2 returns HTTP 409 with error.id == \"ERR_DEVICE_TYPE_NOT_RECOMMENDED\" — the lot matches the device_type, so only the recommendation limb is violated"
            - "Call 3 returns HTTP 201 and links both rows: DeviceDispense.${disp_id}.diagnostic_study_id == \"${study_id}\" and supply_lot_id == \"${lot_appliance}\""
            - "DeviceDispense.${disp_id}.device_type == \"ORAL_APPLIANCE\", ear == \"NA\", fit_status == \"FITTED\", billing_status == \"INVOICED\", adjustment_count == 0"
            - "SupplyLot.${lot_hearing}.quantity_consumed == 0 and quantity_reserved == 0 — the two rejected calls moved no units"
            - "SupplyLot.${lot_appliance} still satisfies the conserved identity 4 == quantity_on_hand + quantity_consumed + quantity_wasted"
            - "DiagnosticStudy.${study_id}.superseded_dispense_count == 0 — only one dispense was created"

