              payload: { case_number: "CASE-RB4", agency_affiliate_code: "AFF-01", household_size: 1, scheduled_arrival_date: "2026-08-10" }
              as: CaseManager
              captures: { case_id: $.data.id }
            - call: "POST /housing-units"
              payload: { address: "650 Rosewood Ave", bedrooms: 0 }
              as: HousingCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /housing-setups"
              payload: { case_id: "${case_id}", housing_unit_id: "${unit_id}", occupancy_start: "2026-08-10", occupancy_end: "2027-02-10" }
              as: HousingCoordinator
              captures: { setup_id: $.data.id }
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "BED" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "LINENS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "TABLE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "CHAIRS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "COOKWARE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "CLEANING_SUPPLIES" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/ready"
              as: HousingCoordinator
            - call: "POST /cases/${case_id}/arrive"
              payload: { actual_arrival_date: "2026-08-10" }
              as: CaseManager
            - call: "GET /cases/${case_id}"
              as: EmploymentSpecialist
              captures: { case_v: $.data.version }
            - call: "POST /employment-plans"
              payload: { case_id: "${case_id}", expected_case_version: "${case_v}" }
              as: EmploymentSpecialist
              captures: { plan_id: $.data.id }
          trigger:
            - call: "PATCH /employment-plans/${plan_id}"
              payload: { monthly_income_cents: 100000 }
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_FORBIDDEN' with http 403"

      - name: notes_denied_for_federal_officer
        claim_type: rbac_denial
        grounds:
          - roles[FederalOfficer]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "POST /case-notes is shared by the four affiliate roles but NOT by FederalOfficer: an officer attempting to write a case note gets ERR_FORBIDDEN (403)."
        test_recipe:
          setup:
            - "Case CASE-RB5 exists (PRE_ARRIVAL)"
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_number: "CASE-RB5", agency_affiliate_code: "AFF-01", household_size: 1, scheduled_arrival_date: "2026-08-10" }
              as: CaseManager
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /case-notes"
              payload: { case_id: "${case_id}", note_type: "GENERAL", body: "Officer note attempt" }
              as: FederalOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_FORBIDDEN' with http 403"

      - name: notes_shared_for_housing_coordinator
        claim_type: rbac_allow
        grounds:
          - roles[HousingCoordinator].shared_operations
          - entities.CaseNote.fields.author_role
        distinguishing_aspect: "The shared note operation works for a non-case-manager role: a HousingCoordinator's note is created with author_role mapped to HOUSING_COORDINATOR."
        test_recipe:
          setup:
            - "Case CASE-RB6 exists (PRE_ARRIVAL)"
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_number: "CASE-RB6", agency_affiliate_code: "AFF-01", household_size: 1, scheduled_arrival_date: "2026-08-10" }
              as: CaseManager
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /case-notes"
              payload: { case_id: "${case_id}", note_type: "GENERAL", body: "Unit inspected", service_date: "2026-08-05" }
              as: HousingCoordinator
              captures: { note_id: $.data.id, note_role: $.data.author_role }
          assert:
            - "note created (201) with author_role == 'HOUSING_COORDINATOR' (mapped from X-User-Role, not from the payload)"

  # ===========================================================================
  # Section: complexity_layers — optimistic_concurrency (OCC), derived-field
  # reconciliation. Cascades and rate thresholds are §1.8-covered (stubs).
  # ===========================================================================
  - section: complexity_layers
    instances:
      - name: plan_create_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[plan-create-stale-case]
          - errors[ERR_STALE_VERSION]
          - entities.Case.fields.version
        distinguishing_aspect: "OCC on Case.version: after plan A is created (Case.version advances), a second create carrying the pre-A expected_case_version is rejected with ERR_STALE_VERSION (412) — two strictly sequential requests, deterministic."
        test_recipe:
          setup:
            - "Case CASE-CL1 (household_size 1, no members), READY 0-bedroom housing, arrived 2026-08-10; client observed Case.version V0 via GET before any plan existed"
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_number: "CASE-CL1", agency_affiliate_code: "AFF-01", household_size: 1, scheduled_arrival_date: "2026-08-10" }
              as: CaseManager
              captures: { case_id: $.data.id }
            - call: "POST /housing-units"
              payload: { address: "660 Gardenia St", bedrooms: 0 }
              as: HousingCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /housing-setups"
              payload: { case_id: "${case_id}", housing_unit_id: "${unit_id}", occupancy_start: "2026-08-10", occupancy_end: "2027-02-10" }
              as: HousingCoordinator
              captures: { setup_id: $.data.id }
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "BED" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "LINENS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "TABLE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "CHAIRS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "COOKWARE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "CLEANING_SUPPLIES" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/ready"
              as: HousingCoordinator
            - call: "POST /cases/${case_id}/arrive"
              payload: { actual_arrival_date: "2026-08-10" }
              as: CaseManager
            - call: "GET /cases/${case_id}"
              as: EmploymentSpecialist
              captures: { case_v0: $.data.version }
          trigger:
            - call: "POST /employment-plans"
              payload: { case_id: "${case_id}", expected_case_version: "${case_v0}" }
              as: EmploymentSpecialist
              captures: { plan_a: $.data.id }
            - call: "POST /employment-plans"
              payload: { case_id: "${case_id}", expected_case_version: "${case_v0}" }
              as: EmploymentSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "first create succeeds (201) with plan ${plan_a}"
            - "second create with the same expected_case_version: error_id == 'ERR_STALE_VERSION' with http 412 (Case.version advanced when plan A was created)"

      - name: plan_create_supersedes_active
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[plan-create-stale-case]
          - state_machines.EmploymentPlan.ACTIVE_to_SUPERSEDED
        distinguishing_aspect: "With a FRESH expected_case_version the second create succeeds and legitimately supersedes: plan A becomes SUPERSEDED, plan B is ACTIVE, and Case.version has advanced by exactly 2 from the observed base."
        test_recipe:
          setup:
            - "Case CASE-CL2 (household_size 1, no members), READY 0-bedroom housing, arrived 2026-08-10; plan A created at observed version V0"
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_number: "CASE-CL2", agency_affiliate_code: "AFF-01", household_size: 1, scheduled_arrival_date: "2026-08-10" }
              as: CaseManager
              captures: { case_id: $.data.id }
            - call: "POST /housing-units"
              payload: { address: "670 Gardenia Ave", bedrooms: 0 }
              as: HousingCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /housing-setups"
              payload: { case_id: "${case_id}", housing_unit_id: "${unit_id}", occupancy_start: "2026-08-10", occupancy_end: "2027-02-10" }
              as: HousingCoordinator
              captures: { setup_id: $.data.id }
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "BED" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "LINENS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "TABLE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "CHAIRS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "COOKWARE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "CLEANING_SUPPLIES" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/ready"
              as: HousingCoordinator
            - call: "POST /cases/${case_id}/arrive"
              payload: { actual_arrival_date: "2026-08-10" }
              as: CaseManager
            - call: "GET /cases/${case_id}"
              as: EmploymentSpecialist
              captures: { case_v0: $.data.version }
            - call: "POST /employment-plans"
              payload: { case_id: "${case_id}", expected_case_version: "${case_v0}" }
              as: EmploymentSpecialist
              captures: { plan_a: $.data.id }
          trigger:
            - call: "GET /cases/${case_id}"
              as: EmploymentSpecialist
              captures: { case_v1: $.data.version }
            - call: "POST /employment-plans"
              payload: { case_id: "${case_id}", expected_case_version: "${case_v1}" }
              as: EmploymentSpecialist
              captures: { plan_b: $.data.id }
            - call: "GET /cases/${case_id}/employment-plans"
              as: EmploymentSpecialist
          assert:
            - "second create succeeds (201): plan B ${plan_b} status == 'ACTIVE'"
            - "GET /cases/${case_id}/employment-plans shows plan A ${plan_a} with status == 'SUPERSEDED' and plan B with status == 'ACTIVE'"
            - "Case.version advanced by exactly 2 from the observed base (one bump per plan creation)"

      - name: topics_completed_recomputed_on_complete
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Case.fields.topics_completed
          - state_machines.OrientationSession.SCHEDULED_to_COMPLETED
        distinguishing_aspect: "topics_completed is reconciled on every completion: after one US_LAWS completion the case reads topics_completed == ['US_LAWS'] while the CULTURAL_ORIENTATION benchmark stays PENDING (only one of six topics delivered)."
        test_recipe:
          setup:
            - "Case CASE-CL3 (household_size 1, no members), READY 0-bedroom housing, arrived 2026-08-10; one SCHEDULED US_LAWS session; clock 2026-08-13"
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_number: "CASE-CL3", agency_affiliate_code: "AFF-01", household_size: 1, scheduled_arrival_date: "2026-08-10" }
              as: CaseManager
              captures: { case_id: $.data.id }
            - call: "POST /housing-units"
              payload: { address: "680 Gardenia Ct", bedrooms: 0 }
              as: HousingCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /housing-setups"
              payload: { case_id: "${case_id}", housing_unit_id: "${unit_id}", occupancy_start: "2026-08-10", occupancy_end: "2027-02-10" }
              as: HousingCoordinator
              captures: { setup_id: $.data.id }
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "BED" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "LINENS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "TABLE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "CHAIRS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "COOKWARE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "CLEANING_SUPPLIES" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/ready"
              as: HousingCoordinator
            - call: "POST /cases/${case_id}/arrive"
              payload: { actual_arrival_date: "2026-08-10" }
              as: CaseManager
            - call: "POST /orientation-sessions"
              payload: { case_id: "${case_id}", topic: "US_LAWS", start_at: "2026-08-12T09:00:00Z", end_at: "2026-08-12T10:00:00Z" }
              as: CaseManager
              captures: { s1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-13T10:00:00Z" }
              as: AgencyDirector
          trigger:
            - call: "POST /orientation-sessions/${s1}/complete"
              as: CaseManager
            - call: "GET /cases/${case_id}"
              as: CaseManager
              captures: { topics: $.data.topics_completed }
            - call: "GET /cases/${case_id}/benchmarks"
              payload: { service_type: "CULTURAL_ORIENTATION" }
              as: CaseManager
              captures: { co_status: "$.data[0].status" }
          assert:
            - "Case.${case_id}.topics_completed == ['US_LAWS'] immediately after the completion"
            - "CULTURAL_ORIENTATION benchmark status == 'PENDING' (auto-MET only fires when all six topics are delivered)"

      - name: cascading_side_effects_full_chain
        claim_type: cascading_side_effects
        grounds: [state_machines.Case.ARRIVED_to_TRANSFERRED_OUT]
        excluded_because:
          difficulty_instance: "transitive_cascade / transfer_accept_depth3_cascade"
          rationale: "The N-level transfer cascade is asserted hop-by-hop in the named §1.8 instance."

      - name: rate_threshold_self_sufficiency
        claim_type: rate_threshold_triggers
        grounds: [calculations.self_sufficiency_determination]
        excluded_because:
          difficulty_instance: "combinatorial_formula / self_sufficiency_tiered_threshold_boundary"
          rationale: "Tier selection and the inclusive threshold boundary are asserted with literal cents in the named §1.8 instance."

  # ===========================================================================
  # Section: consistency_model — immediate consistency of mutations.
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: plan_patch_immediately_visible
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - endpoints: "PATCH /employment-plans/{id}"
        distinguishing_aspect: "Immediate consistency: a PATCHed income value is visible in the PATCH response AND in a subsequent list read, with no reconciliation delay."
        test_recipe:
          setup:
            - "Case CASE-CM1 (household_size 1, no members), READY 0-bedroom housing, arrived 2026-08-10; an ACTIVE EmploymentPlan exists"
          setup_api_calls:
