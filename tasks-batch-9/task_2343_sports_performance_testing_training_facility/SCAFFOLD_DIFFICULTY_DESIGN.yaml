              captures: { gs_a_id: $.data.id, gs_a_v0: $.data.version }
            - call: "POST /group-sessions/${gs_a_id}/coaches"
              payload: { staff_member_id: "${coach_id}", expected_group_session_version: "${gs_a_v0}" }
              as: PerformanceDirector
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PerformanceDirector
            - call: "POST /staff-members/${coach_id}/credential-review"
              payload: {}
              as: PerformanceDirector
            - call: "POST /group-sessions"
              payload: { start_at: "2026-08-25T10:30:00Z", end_at: "2026-08-25T11:30:00Z", site_code: "ONSITE", station_count: 3, phase_focus: "GENERAL_PREP", max_athletes: 10 }
              as: PerformanceDirector
              captures: { gs_b_id: $.data.id, gs_b_v0: $.data.version }
          trigger:
            - call: "POST /group-sessions/${gs_b_id}/coaches"
              payload: { staff_member_id: "${coach_id}", expected_group_session_version: "${gs_b_v0}" }
              as: PerformanceDirector
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "error_id == ERR_STAFF_CREDENTIAL_LAPSED"
            - "error_id != ERR_STAFF_SCHEDULE_CONFLICT"
            - "Certification.${cert_id}.status == LAPSED"
            - "StaffMember.${coach_id}.credential_status == LAPSED"
            - "GroupSession.${gs_a_id}.compliant_coach_count == 0"
            - "GroupSession.${gs_a_id}.session_status == SCHEDULED"
            - "GroupSession.${gs_b_id}.assigned_staff == []"
            - "GroupSession.${gs_b_id}.staffing_status == STAFF_PENDING"
            - "GroupSession.${gs_b_id}.version == ${gs_b_v0}"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: readiness_index_exactly_at_competition_minimum_admits_enrollment
        grounds:
          - calculations.athlete_readiness_index
          - calculations.performance_composite_percentile
          - validations[priority=12]
          - entities.Athlete.fields.readiness_index
        distinguishing_aspect: |
          Metric under test: readiness_index against COMPETITION_READINESS_MIN, on
          POST /enrollments. The metrics CMJ_CM 42.5 / SPRINT_10M_S 1.74 / IMTP_N 1850 make
          every per-metric percentile exactly 60.0 for BASKETBALL/GUARD age 16, so the
          weighted composite and hence readiness_index land on exactly 60.00 — the inclusive
          edge that must admit, not refuse, the COMPETITION enrollment.
        test_recipe:
          setup:
            - "One StaffMember acting as Coach, credential_status COMPLIANT (insurance to 2027-12-31 plus one VALID CPR_AED certification)."
            - "One BASKETBALL/GUARD athlete born 2010-01-15, maturity_offset_months 0, CLEARED by an all-threes screen (risk 0.00)."
            - "A PERFORMANCE_BATTERY finalized at the default clock with CMJ_CM 42.5, SPRINT_10M_S 1.74 and IMTP_N 1850, giving composite_percentile 60.0 and last_performance_test_at 2026-08-01T00:00:00Z."
            - "The athlete has zero attended and zero no-show enrollments (attendance_adjust is 0.0) and no open ReturnToSportPlan (no RTS_PENALTY), so readiness_index is exactly the composite."
            - "A COMPETITION-focus ONSITE GroupSession on 2026-08-10T10:00Z-11:00Z, station_count 3, max_athletes 10, with one compliant coach assigned."
