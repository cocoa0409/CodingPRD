scaffold_corner_design:

  # =====================================================================
  - section: entities
    instances:
      - name: create_customer_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Customer, endpoints./copack/customers]
        distinguishing_aspect: "POST /copack/customers with name+code returns 201, data.id is a bare UUID (no prefix), version==1, owns_components defaults false."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /copack/customers"
              payload: { name: "Acme Foods", code: "ACME" }
              as: Receiver
              captures: { cid: $.data.id, v: $.data.version, owns: $.data.owns_components }
          assert:
            - "http status == 201"
            - "Customer.${cid}.version == 1"
            - "Customer.${cid}.owns_components == false"

      - name: component_customer_owned_computed_from_owner_flag
        claim_type: Computed Fields
        grounds: [entities.Component.fields.customer_owned, endpoints./copack/components]
        distinguishing_aspect: "Component.customer_owned is computed true when owning Customer.owns_components==true at create time; client cannot set it directly."
        test_recipe:
          setup: ["Customer with owns_components=true"]
          setup_api_calls:
            - call: "POST /copack/customers"
              payload: { name: "Acme", code: "ACME", owns_components: true }
              as: Receiver
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /copack/components"
              payload: { customer_id: "${cid}", sku: "ALMOND", name: "Almonds", kind: "INGREDIENT" }
              as: Receiver
              captures: { comp_id: $.data.id, owned: $.data.customer_owned }
          assert:
            - "Component.${comp_id}.customer_owned == true"

      - name: get_customer_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]", "endpoints./copack/customers/{id}"]
        distinguishing_aspect: "GET /copack/customers/{random-uuid} returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /copack/customers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Receiver
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "http status == 404"

      - name: create_component_missing_required_kind_returns_invalid_request
        claim_type: Required Fields
        grounds: ["validations[priority=4]", entities.Component.fields.kind]
        distinguishing_aspect: "POST /copack/components without kind returns ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["Customer exists"]
          setup_api_calls:
            - call: "POST /copack/customers"
              payload: { name: "Acme", code: "ACME" }
              as: Receiver
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /copack/components"
              payload: { customer_id: "${cid}", sku: "ALMOND", name: "Almonds" }
              as: Receiver
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "http status == 400"

      - name: create_component_invalid_kind_enum_rejected
        claim_type: Type Constraints
        grounds: ["validations[priority=9]", "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "POST /copack/components with kind='WIDGET' (not in {INGREDIENT,PACKAGING,LABEL}) returns ERR_INVALID_ENUM 422."
        test_recipe:
          setup: ["Customer exists"]
          setup_api_calls:
            - call: "POST /copack/customers"
              payload: { name: "Acme", code: "ACME" }
              as: Receiver
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /copack/components"
              payload: { customer_id: "${cid}", sku: "WIDGET", name: "Widget", kind: "WIDGET" }
              as: Receiver
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_ENUM"
            - "http status == 422"

      - name: receive_lot_nonpositive_qty_rejected
        claim_type: Type Constraints
        grounds: ["validations[priority=8]", "errors[ERR_INVALID_QUANTITY]", entities.ComponentLot.fields.received_qty]
        distinguishing_aspect: "POST /copack/components/{id}/lots with received_qty=0 returns ERR_INVALID_QUANTITY 422."
        test_recipe:
          setup: ["Customer + component exist"]
          setup_api_calls:
            - call: "POST /copack/customers"
              payload: { name: "Acme", code: "ACME" }
              as: Receiver
              captures: { cid: $.data.id }
            - call: "POST /copack/components"
              payload: { customer_id: "${cid}", sku: "ALMOND", name: "Almonds", kind: "INGREDIENT" }
              as: Receiver
              captures: { comp_id: $.data.id }
          trigger:
            - call: "POST /copack/components/${comp_id}/lots"
              payload: { supplier_lot_code: "ALM-0", received_qty: 0, expiration_date: "2026-12-31T00:00:00Z" }
              as: Receiver
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_QUANTITY"
            - "http status == 422"

      - name: recipe_fill_tolerance_out_of_range_rejected
        claim_type: Type Constraints
        grounds: ["validations[priority=8]", entities.Recipe.fields.fill_tolerance_pct, "errors[ERR_INVALID_QUANTITY]"]
        distinguishing_aspect: "POST /copack/recipes with fill_tolerance_pct=60 (>50) returns ERR_INVALID_QUANTITY 422."
        test_recipe:
          setup: ["Customer exists"]
          setup_api_calls:
            - call: "POST /copack/customers"
              payload: { name: "Acme", code: "ACME" }
              as: Receiver
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /copack/recipes"
              payload: { customer_id: "${cid}", name: "Granola", target_fill_weight_g: 200, fill_tolerance_pct: 60, shelf_life_days: 90 }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_QUANTITY"
            - "http status == 422"

      - name: duplicate_customer_code_rejected
        claim_type: Type Constraints
        grounds: ["validations[priority=5]", "errors[ERR_DUPLICATE_CODE]", entities.Customer.fields.code]
        distinguishing_aspect: "Two customers with code='ACME': second returns ERR_DUPLICATE_CODE 409."
        test_recipe:
          setup: ["one customer code=ACME exists"]
          setup_api_calls:
            - call: "POST /copack/customers"
              payload: { name: "Acme One", code: "ACME" }
              as: Receiver
          trigger:
            - call: "POST /copack/customers"
              payload: { name: "Acme Two", code: "ACME" }
              as: Receiver
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE_CODE"
            - "http status == 409"

      - name: duplicate_sku_within_customer_rejected
        claim_type: Type Constraints
        grounds: ["validations[priority=6]", "errors[ERR_DUPLICATE_SKU]", entities.Component.fields.sku]
        distinguishing_aspect: "Two components SKU='ALMOND' under the SAME customer: second returns ERR_DUPLICATE_SKU 409."
        test_recipe:
          setup: ["Customer with one ALMOND component"]
          setup_api_calls:
            - call: "POST /copack/customers"
              payload: { name: "Acme", code: "ACME" }
              as: Receiver
              captures: { cid: $.data.id }
            - call: "POST /copack/components"
              payload: { customer_id: "${cid}", sku: "ALMOND", name: "Almonds", kind: "INGREDIENT" }
              as: Receiver
          trigger:
            - call: "POST /copack/components"
              payload: { customer_id: "${cid}", sku: "ALMOND", name: "Almonds 2", kind: "INGREDIENT" }
              as: Receiver
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE_SKU"
            - "http status == 409"

      - name: same_sku_different_customer_allowed
        claim_type: Creation
        grounds: ["validations[priority=6]", entities.Component.fields.sku]
        distinguishing_aspect: "SKU uniqueness is scoped per customer_id; two different customers may each have SKU='ALMOND' (second 201)."
        test_recipe:
          setup: ["two customers each with no components"]
          setup_api_calls:
            - call: "POST /copack/customers"
              payload: { name: "Acme", code: "ACME" }
              as: Receiver
              captures: { c1: $.data.id }
            - call: "POST /copack/customers"
              payload: { name: "Beta", code: "BETA" }
              as: Receiver
              captures: { c2: $.data.id }
            - call: "POST /copack/components"
              payload: { customer_id: "${c1}", sku: "ALMOND", name: "Almonds", kind: "INGREDIENT" }
              as: Receiver
          trigger:
            - call: "POST /copack/components"
              payload: { customer_id: "${c2}", sku: "ALMOND", name: "Almonds", kind: "INGREDIENT" }
              as: Receiver
              captures: { comp2: $.data.id }
          assert:
            - "http status == 201"

      - name: create_lot_sets_remaining_equal_received
        claim_type: Computed Fields
        grounds: [entities.ComponentLot.fields.remaining_qty, "endpoints./copack/components/{id}/lots"]
        distinguishing_aspect: "A freshly received lot has remaining_qty == received_qty and status AVAILABLE."
        test_recipe:
          setup: ["Customer + component exist"]
          setup_api_calls:
            - call: "POST /copack/customers"
              payload: { name: "Acme", code: "ACME" }
              as: Receiver
              captures: { cid: $.data.id }
            - call: "POST /copack/components"
              payload: { customer_id: "${cid}", sku: "ALMOND", name: "Almonds", kind: "INGREDIENT" }
              as: Receiver
              captures: { comp_id: $.data.id }
          trigger:
            - call: "POST /copack/components/${comp_id}/lots"
              payload: { supplier_lot_code: "ALM-1", received_qty: 500, expiration_date: "2026-12-31T00:00:00Z" }
              as: Receiver
              captures: { lot_id: $.data.id, rem: $.data.remaining_qty, st: $.data.status }
          assert:
            - "ComponentLot.${lot_id}.remaining_qty == 500.000"
            - "ComponentLot.${lot_id}.status == AVAILABLE"

  # =====================================================================
  - section: state_machines
    instances:
      - name: approve_recipe_from_draft_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Recipe.PENDING_APPROVAL_to_APPROVED, "validations[priority=20]"]
        distinguishing_aspect: "Approving a recipe still in DRAFT (never submitted) returns ERR_INVALID_STATE 409; no transition fires."
        test_recipe:
          setup: ["Recipe in DRAFT"]
          setup_api_calls:
            - call: "POST /copack/customers"
              payload: { name: "Acme", code: "ACME" }
              as: Receiver
              captures: { cid: $.data.id }
            - call: "POST /copack/recipes"
              payload: { customer_id: "${cid}", name: "Granola", target_fill_weight_g: 200, fill_tolerance_pct: 5, shelf_life_days: 90 }
              as: Scheduler
              captures: { recipe_id: $.data.id }
          trigger:
            - call: "POST /copack/recipes/${recipe_id}/approve"
              payload: {}
              as: QAInspector
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http status == 409"

      - name: submit_recipe_without_ingredient_line_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.Recipe.DRAFT_to_PENDING_APPROVAL, "validations[priority=20]"]
        distinguishing_aspect: "Submitting a DRAFT recipe that has no INGREDIENT BomLine fails the submit precondition with ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["DRAFT recipe with only a PACKAGING bom-line"]
          setup_api_calls:
            - call: "POST /copack/customers"
              payload: { name: "Acme", code: "ACME" }
              as: Receiver
              captures: { cid: $.data.id }
            - call: "POST /copack/components"
              payload: { customer_id: "${cid}", sku: "POUCH", name: "Pouch", kind: "PACKAGING" }
              as: Receiver
              captures: { pouch_id: $.data.id }
            - call: "POST /copack/recipes"
              payload: { customer_id: "${cid}", name: "Granola", target_fill_weight_g: 200, fill_tolerance_pct: 5, shelf_life_days: 90 }
              as: Scheduler
              captures: { recipe_id: $.data.id, rv0: $.data.version }
            - call: "POST /copack/recipes/${recipe_id}/bom-lines"
              payload: { component_id: "${pouch_id}", qty_per_unit: 1, expected_recipe_version: "${rv0}" }
              as: Scheduler
          trigger:
            - call: "POST /copack/recipes/${recipe_id}/submit"
              payload: {}
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http status == 409"

      - name: complete_run_from_scheduled_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.ProductionRun.RUNNING_to_PENDING_QA, "validations[priority=20]"]
        distinguishing_aspect: "Completing a run still SCHEDULED (never started) returns ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["A SCHEDULED run (recipe approved, line, crew, lots all present)"]
          setup_api_calls:
            - call: "POST /copack/customers"
              payload: { name: "Acme", code: "ACME" }
              as: Receiver
              captures: { cid: $.data.id }
            - call: "POST /copack/components"
              payload: { customer_id: "${cid}", sku: "ALMOND", name: "Almonds", kind: "INGREDIENT" }
              as: Receiver
              captures: { comp_id: $.data.id }
            - call: "POST /copack/components"
              payload: { customer_id: "${cid}", sku: "POUCH", name: "Pouch", kind: "PACKAGING" }
              as: Receiver
              captures: { pouch_id: $.data.id }
            - call: "POST /copack/components/${comp_id}/lots"
              payload: { supplier_lot_code: "ALM-1", received_qty: 1000, expiration_date: "2026-12-31T00:00:00Z" }
              as: Receiver
            - call: "POST /copack/components/${pouch_id}/lots"
              payload: { supplier_lot_code: "POU-1", received_qty: 1000, expiration_date: "2027-12-31T00:00:00Z" }
              as: Receiver
            - call: "POST /copack/recipes"
              payload: { customer_id: "${cid}", name: "Granola", target_fill_weight_g: 200, fill_tolerance_pct: 5, shelf_life_days: 90 }
              as: Scheduler
              captures: { recipe_id: $.data.id, rv0: $.data.version }
            - call: "POST /copack/recipes/${recipe_id}/bom-lines"
              payload: { component_id: "${comp_id}", qty_per_unit: 2, expected_recipe_version: "${rv0}" }
              as: Scheduler
              captures: { rv1: $.data.version }
            - call: "POST /copack/recipes/${recipe_id}/bom-lines"
              payload: { component_id: "${pouch_id}", qty_per_unit: 1, expected_recipe_version: "${rv1}" }
              as: Scheduler
            - call: "POST /copack/recipes/${recipe_id}/submit"
              payload: {}
              as: Scheduler
            - call: "POST /copack/recipes/${recipe_id}/approve"
              payload: {}
              as: QAInspector
            - call: "POST /copack/production-lines"
              payload: { name: "Line A", rated_units_per_hour: 50 }
              as: Scheduler
              captures: { line_id: $.data.id }
            - call: "POST /copack/crews"
              payload: { name: "Day Crew" }
              as: Scheduler
              captures: { crew_id: $.data.id }
            - call: "POST /copack/production-runs"
              payload: { recipe_id: "${recipe_id}", line_id: "${line_id}", crew_id: "${crew_id}", planned_units: 100, scheduled_start: "2026-06-01T08:00:00Z" }
              as: Scheduler
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /copack/production-runs/${run_id}/complete"
              payload: { actual_units_good: 100, actual_units_scrapped: 0 }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http status == 409"

      - name: cancel_released_run_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.ProductionRun.PENDING_QA_to_RELEASED, "validations[priority=20]"]
        distinguishing_aspect: "RELEASED is terminal; cancelling a RELEASED run returns ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["A run in RELEASED state"]
          setup_api_calls:
            - call: "POST /copack/customers"
              payload: { name: "Acme", code: "ACME" }
              as: Receiver
              captures: { cid: $.data.id }
            - call: "POST /copack/components"
              payload: { customer_id: "${cid}", sku: "ALMOND", name: "Almonds", kind: "INGREDIENT" }
              as: Receiver
              captures: { comp_id: $.data.id }
            - call: "POST /copack/components"
              payload: { customer_id: "${cid}", sku: "POUCH", name: "Pouch", kind: "PACKAGING" }
              as: Receiver
              captures: { pouch_id: $.data.id }
            - call: "POST /copack/components/${comp_id}/lots"
              payload: { supplier_lot_code: "ALM-1", received_qty: 1000, expiration_date: "2026-12-31T00:00:00Z" }
              as: Receiver
            - call: "POST /copack/components/${pouch_id}/lots"
              payload: { supplier_lot_code: "POU-1", received_qty: 1000, expiration_date: "2027-12-31T00:00:00Z" }
              as: Receiver
            - call: "POST /copack/recipes"
              payload: { customer_id: "${cid}", name: "Granola", target_fill_weight_g: 200, fill_tolerance_pct: 5, shelf_life_days: 90 }
              as: Scheduler
              captures: { recipe_id: $.data.id, rv0: $.data.version }
            - call: "POST /copack/recipes/${recipe_id}/bom-lines"
              payload: { component_id: "${comp_id}", qty_per_unit: 2, expected_recipe_version: "${rv0}" }
              as: Scheduler
              captures: { rv1: $.data.version }
            - call: "POST /copack/recipes/${recipe_id}/bom-lines"
              payload: { component_id: "${pouch_id}", qty_per_unit: 1, expected_recipe_version: "${rv1}" }
              as: Scheduler
            - call: "POST /copack/recipes/${recipe_id}/submit"
              payload: {}
              as: Scheduler
            - call: "POST /copack/recipes/${recipe_id}/approve"
              payload: {}
              as: QAInspector
            - call: "POST /copack/production-lines"
              payload: { name: "Line A", rated_units_per_hour: 50 }
              as: Scheduler
              captures: { line_id: $.data.id, lv0: $.data.version }
            - call: "POST /copack/crews"
              payload: { name: "Day Crew" }
              as: Scheduler
              captures: { crew_id: $.data.id }
            - call: "POST /copack/production-runs"
              payload: { recipe_id: "${recipe_id}", line_id: "${line_id}", crew_id: "${crew_id}", planned_units: 100, scheduled_start: "2026-06-01T08:00:00Z" }
              as: Scheduler
              captures: { run_id: $.data.id }
            - call: "POST /copack/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: Scheduler
            - call: "POST /copack/production-runs/${run_id}/start"
              payload: { expected_line_version: "${lv0}" }
              as: Scheduler
            - call: "POST /copack/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: Scheduler
            - call: "POST /copack/production-runs/${run_id}/complete"
              payload: { actual_units_good: 100, actual_units_scrapped: 0 }
              as: Scheduler
            - call: "POST /copack/production-runs/${run_id}/checkweigh-samples"
              payload: { measured_weight_g: 200 }
              as: QAInspector
            - call: "POST /copack/production-runs/${run_id}/release"
              payload: {}
              as: QAInspector
          trigger:
            - call: "POST /copack/production-runs/${run_id}/cancel"
              payload: {}
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http status == 409"

      - name: newly_created_run_initial_state_scheduled
        claim_type: Initial State
        grounds: [state_machines.ProductionRun, entities.ProductionRun.fields.status]
        distinguishing_aspect: "A freshly scheduled ProductionRun starts in status SCHEDULED."
        test_recipe:
          setup: ["approved recipe + line + crew"]
          setup_api_calls:
            - call: "POST /copack/customers"
              payload: { name: "Acme", code: "ACME" }
              as: Receiver
              captures: { cid: $.data.id }
            - call: "POST /copack/components"
              payload: { customer_id: "${cid}", sku: "ALMOND", name: "Almonds", kind: "INGREDIENT" }
              as: Receiver
              captures: { comp_id: $.data.id }
            - call: "POST /copack/components"
              payload: { customer_id: "${cid}", sku: "POUCH", name: "Pouch", kind: "PACKAGING" }
              as: Receiver
              captures: { pouch_id: $.data.id }
            - call: "POST /copack/recipes"
              payload: { customer_id: "${cid}", name: "Granola", target_fill_weight_g: 200, fill_tolerance_pct: 5, shelf_life_days: 90 }
              as: Scheduler
              captures: { recipe_id: $.data.id, rv0: $.data.version }
            - call: "POST /copack/recipes/${recipe_id}/bom-lines"
              payload: { component_id: "${comp_id}", qty_per_unit: 2, expected_recipe_version: "${rv0}" }
              as: Scheduler
              captures: { rv1: $.data.version }
            - call: "POST /copack/recipes/${recipe_id}/bom-lines"
              payload: { component_id: "${pouch_id}", qty_per_unit: 1, expected_recipe_version: "${rv1}" }
              as: Scheduler
            - call: "POST /copack/recipes/${recipe_id}/submit"
              payload: {}
              as: Scheduler
            - call: "POST /copack/recipes/${recipe_id}/approve"
              payload: {}
              as: QAInspector
            - call: "POST /copack/production-lines"
              payload: { name: "Line A", rated_units_per_hour: 50 }
              as: Scheduler
              captures: { line_id: $.data.id }
            - call: "POST /copack/crews"
              payload: { name: "Day Crew" }
              as: Scheduler
              captures: { crew_id: $.data.id }
          trigger:
            - call: "POST /copack/production-runs"
              payload: { recipe_id: "${recipe_id}", line_id: "${line_id}", crew_id: "${crew_id}", planned_units: 100, scheduled_start: "2026-06-01T08:00:00Z" }
              as: Scheduler
              captures: { run_id: $.data.id, st: $.data.status }
          assert:
            - "ProductionRun.${run_id}.status == SCHEDULED"

      - name: start_run_with_expired_lot_rejected
        claim_type: Precondition Enforcement
        grounds: ["validations[priority=22]", "errors[ERR_LOT_EXPIRED]", state_machines.ProductionRun.SCHEDULED_to_RUNNING]
        distinguishing_aspect: "Starting a run whose only available lot expired at/before the logical clock returns ERR_LOT_EXPIRED 409."
        test_recipe:
          setup: ["ALMOND lot expires 2026-05-01; clock set to 2026-06-01 at start so the lot is expired"]
          setup_api_calls:
            - call: "POST /copack/customers"
              payload: { name: "Acme", code: "ACME" }
              as: Receiver
              captures: { cid: $.data.id }
            - call: "POST /copack/components"
              payload: { customer_id: "${cid}", sku: "ALMOND", name: "Almonds", kind: "INGREDIENT" }
              as: Receiver
              captures: { comp_id: $.data.id }
            - call: "POST /copack/components"
              payload: { customer_id: "${cid}", sku: "POUCH", name: "Pouch", kind: "PACKAGING" }
              as: Receiver
              captures: { pouch_id: $.data.id }
