  # --- SupervisionVisit ---
  - method: POST
    path: "/api/visits"
    description: "Schedule a visit. INITIAL requires facility PENDING_REVIEW; other types require facility not DECOMMISSIONED. UNANNOUNCED creatable only by CertificationReviewer. Inspector conflict (TRAVEL_BUFFER_HOURS=2): reject iff new_start < existing_end + 2h AND new_end > existing_start - 2h for any of the inspector's SCHEDULED/IN_PROGRESS visits — STRICT inequalities, so a visit starting exactly at existing_end + 2h is allowed"
    roles: [AccountManager, CertificationReviewer]
