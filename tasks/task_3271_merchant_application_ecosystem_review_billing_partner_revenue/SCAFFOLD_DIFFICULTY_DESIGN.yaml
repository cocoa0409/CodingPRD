scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: developer_accrual_provisional_includes_unpaid_final_excludes
        grounds:
          - calculations.developer_accrual
          - calculations.charge_net_computation
          - state_machines.MonthlyInvoice.OPEN_to_ISSUED
          - state_machines.MonthlyInvoice.ISSUED_to_PAID
          - state_machines.AppBillingCharge.APPROVED_to_INVOICED
        distinguishing_aspect: |
          Dual variant on the revenue-accrual entity domain: the PROVISIONAL
          variant (at invoice issue) accrues the 120000-cent invoiced charge of an
          UNPAID invoice, while the FINAL variant (at mark-paid, after a reversal
          of a sibling charge) excludes reversed and unpaid rows — same developer,
          same charge set, different accrued totals (300000 vs 0 platform share
          cents, lifetime_gross 120000000 vs 100000000).
        test_recipe:
          setup:
            - "Developer d1 owns listed app a1 with one ACTIVE installation inst1 for merchant m1"
            - "inst1 has TWO APPROVED ONE_TIME charges in cycle 2026-09: c1 = 120000000 cents and c2 = 20000000 cents"
            - "Invoice inv1 (merchant m1, cycle 2026-09) is OPEN"
          setup_api_calls:
            - call: "POST /developers"
              payload: { company_name: "D1", contact_email: "d1@x.com", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /apps"
              payload: { developer_id: "${d1_id}", name: "AppOne", category: "PRODUCTIVITY" }
              as: Developer
              as_user_id: "${d1_id}"
              captures: { a1_id: $.data.id }
            - call: "POST /apps/${a1_id}/versions"
              payload: { semver: "1.0.0" }
              as: Developer
              as_user_id: "${d1_id}"
              captures: { v1_id: $.data.id }
            - call: "POST /apps/${a1_id}/submit"
              payload: {}
              as: Developer
              as_user_id: "${d1_id}"
            - call: "POST /app-versions/${v1_id}/approve"
              payload: { reviewer_id: "rev-1" }
              as: Reviewer
            - call: "POST /apps/${a1_id}/publish"
              payload: {}
              as: Developer
              as_user_id: "${d1_id}"
            - call: "POST /merchants"
              payload: { shop_domain: "m1.myshop.com", plan_tier: "BASIC" }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /installations"
              payload: { app_id: "${a1_id}", merchant_id: "${m1_id}" }
              as: Merchant
              as_user_id: "${m1_id}"
              captures: { inst1_id: $.data.id }
            - call: "POST /installations/${inst1_id}/consent"
              payload: {}
              as: Merchant
              as_user_id: "${m1_id}"
            - call: "POST /installations/${inst1_id}/billing-charges"
              payload: { charge_type: "ONE_TIME", base_amount_cents: 120000000, description: "big one-time" }
              as: Developer
              as_user_id: "${d1_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /billing-charges/${c1_id}/approve"
              payload: {}
              as: Merchant
              as_user_id: "${m1_id}"
            - call: "POST /installations/${inst1_id}/billing-charges"
              payload: { charge_type: "ONE_TIME", base_amount_cents: 20000000, description: "small one-time" }
              as: Developer
              as_user_id: "${d1_id}"
              captures: { c2_id: $.data.id }
            - call: "POST /billing-charges/${c2_id}/approve"
              payload: {}
              as: Merchant
              as_user_id: "${m1_id}"
            - call: "POST /merchants/${m1_id}/invoices"
              payload: { cycle: "2026-09" }
              as: PlatformAdmin
              captures: { inv1_id: $.data.id, inv1_v: $.data.version }
            - call: "POST /invoices/${inv1_id}/issue"
              payload: { expected_invoice_version: "${inv1_v}" }
              as: PlatformAdmin
            - call: "POST /billing-charges/${c2_id}/reverse"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /invoices/${inv1_id}/mark-paid"
              payload: {}
              as: PlatformAdmin
            - call: "GET /developers/${d1_id}"
              payload: {}
              as: PlatformAdmin
              captures: { d1_gross: $.data.lifetime_gross_cents }
            - call: "GET /billing-charges/${c1_id}"
              payload: {}
              as: PlatformAdmin
              captures: { c1_share: $.data.platform_share_cents }
            - call: "GET /developers/${d1_id}/ledger-entries"
              payload: {}
              as: PlatformAdmin
              captures: { ledger0_variant: "$.data[0].entry_variant" }
          assert:
            - "Developer.${d1_id}.lifetime_gross_cents == 120000000 (FINAL variant excluded the reversed 20000000-cent charge that PROVISIONAL had accrued)"
            - "AppBillingCharge.${c1_id}.platform_share_cents == 18000000 (per-charge flat rate: developer tier at invoice time is T1, 0.15 * 120000000 == 18000000)"
            - "RevenueShareLedgerEntry[0].entry_variant == 'FINAL' (FINAL supersedes PROVISIONAL for cycle 2026-09)"
      - name: storefront_performance_mean_vs_budget_dual_window
        grounds:
          - calculations.storefront_performance_score
          - entities.PerformanceSample.fields.storefront_load_ms
        distinguishing_aspect: |
          Dual variant on the performance entity domain: the same sample set yields
          COMPLIANT under the rolling 7-day window semantics (window
          [sampled_at-7d, sampled_at] excludes the stale 400ms outlier sampled 8
          days earlier) but DEGRADED under a naive lifetime-average reading —
          proving the windowed and lifetime interpretations of the same prose
          diverge (window mean 100ms -> impact 200 <= 200 COMPLIANT vs lifetime
          mean (400+100)/2 = 250ms -> impact 500 > 200 DEGRADED).
        test_recipe:
          setup:
            - "Listed app a2 with ACTIVE installation inst2 for merchant m2"
            - "One stale PerformanceSample of 400ms at 2026-09-01T00:00:00Z (8 days before the trigger sample)"
          setup_api_calls:
            - call: "POST /developers"
              payload: { company_name: "D2", contact_email: "d2@x.com", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { d2_id: $.data.id }
            - call: "POST /apps"
              payload: { developer_id: "${d2_id}", name: "AppTwo", category: "ANALYTICS" }
              as: Developer
              as_user_id: "${d2_id}"
              captures: { a2_id: $.data.id }
            - call: "POST /apps/${a2_id}/versions"
              payload: { semver: "1.0.0" }
              as: Developer
              as_user_id: "${d2_id}"
              captures: { v2_id: $.data.id }
            - call: "POST /apps/${a2_id}/submit"
              payload: {}
              as: Developer
              as_user_id: "${d2_id}"
            - call: "POST /app-versions/${v2_id}/approve"
              payload: { reviewer_id: "rev-1" }
              as: Reviewer
            - call: "POST /apps/${a2_id}/publish"
              payload: {}
              as: Developer
              as_user_id: "${d2_id}"
            - call: "POST /merchants"
              payload: { shop_domain: "m2.myshop.com", plan_tier: "GROWTH" }
              as: PlatformAdmin
              captures: { m2_id: $.data.id }
            - call: "POST /installations"
              payload: { app_id: "${a2_id}", merchant_id: "${m2_id}" }
              as: Merchant
              as_user_id: "${m2_id}"
              captures: { inst2_id: $.data.id }
            - call: "POST /installations/${inst2_id}/consent"
              payload: {}
              as: Merchant
              as_user_id: "${m2_id}"
            - call: "POST /installations/${inst2_id}/performance-samples"
              payload: { storefront_load_ms: 400, sampled_at: "2026-09-01T00:00:00Z" }
              as: Developer
              as_user_id: "${d2_id}"
          trigger:
            - call: "POST /installations/${inst2_id}/performance-samples"
              payload: { storefront_load_ms: 100, sampled_at: "2026-09-09T00:00:00Z" }
              as: Developer
              as_user_id: "${d2_id}"
            - call: "GET /apps/${a2_id}"
              payload: {}
              as: Developer
              as_user_id: "${d2_id}"
              captures: { a2_perf: $.data.performance_state }
          assert:
            - "App.${a2_id}.performance_state == 'COMPLIANT' (window [2026-09-02, 2026-09-09] contains only the 100ms sample: mean 100.00, impact 200 <= 200 inclusive boundary passes)"
            - "The stale 400ms sample at 2026-09-01 is excluded from the window; a lifetime average would have produced impact 500 and DEGRADED"

  - rule_id: combinatorial_formula
    instances:
      - name: charge_net_computation_pinned_evaluation_order
        grounds:
          - calculations.charge_net_computation
          - calculations.revenue_share_tier_assignment
        distinguishing_aspect: |
          Mode (c) circular-looking dependency pinned by evaluation order:
          discount rounds BEFORE the share is computed, and the share rate depends
          on the app tier which depends on lifetime gross which the charge itself
          mutates — the scaffold pins order (discount -> share -> net) so a
          10000-cent ONE_TIME charge with coupon LAUNCH10 at tier T0 yields
          discount 1000, final 9000, share 0, net 9000, and never a
          share-first-then-discount order.
        test_recipe:
          setup:
            - "Developer d3 (lifetime_gross 0 -> tier T0) with listed app a3 and ACTIVE installation inst3 for merchant m3"
          setup_api_calls:
            - call: "POST /developers"
              payload: { company_name: "D3", contact_email: "d3@x.com", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { d3_id: $.data.id }
            - call: "POST /apps"
              payload: { developer_id: "${d3_id}", name: "AppThree", category: "FINANCE" }
              as: Developer
              as_user_id: "${d3_id}"
              captures: { a3_id: $.data.id }
            - call: "POST /apps/${a3_id}/versions"
              payload: { semver: "1.0.0" }
              as: Developer
              as_user_id: "${d3_id}"
              captures: { v3_id: $.data.id }
            - call: "POST /apps/${a3_id}/submit"
              payload: {}
              as: Developer
              as_user_id: "${d3_id}"
            - call: "POST /app-versions/${v3_id}/approve"
              payload: { reviewer_id: "rev-1" }
              as: Reviewer
            - call: "POST /apps/${a3_id}/publish"
              payload: {}
              as: Developer
              as_user_id: "${d3_id}"
            - call: "POST /merchants"
              payload: { shop_domain: "m3.myshop.com", plan_tier: "BASIC" }
              as: PlatformAdmin
              captures: { m3_id: $.data.id }
            - call: "POST /installations"
              payload: { app_id: "${a3_id}", merchant_id: "${m3_id}" }
              as: Merchant
              as_user_id: "${m3_id}"
              captures: { inst3_id: $.data.id }
            - call: "POST /installations/${inst3_id}/consent"
              payload: {}
              as: Merchant
              as_user_id: "${m3_id}"
          trigger:
            - call: "POST /installations/${inst3_id}/billing-charges"
              payload: { charge_type: "ONE_TIME", base_amount_cents: 10000, description: "setup fee", discount_code: "LAUNCH10" }
              as: Developer
              as_user_id: "${d3_id}"
              captures: { c3_id: $.data.id }
            - call: "GET /billing-charges/${c3_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "AppBillingCharge.${c3_id}.discount_amount_cents == 1000 (round_half_up(10000 * 0.10))"
            - "AppBillingCharge.${c3_id}.final_amount_cents == 9000"
            - "AppBillingCharge.${c3_id}.platform_share_cents == 0 (tier T0 rate 0.00 applied AFTER discount, not before)"
            - "AppBillingCharge.${c3_id}.developer_net_cents == 9000"
      - name: usage_proration_aggregation_over_mixed_charges
        grounds:
          - calculations.usage_charge_proration
          - calculations.invoice_total
        distinguishing_aspect: |
          Mode (a) formula with >= 3 inputs and non-linear interaction:
          invoice_total aggregates one prorated USAGE charge (base 1000,
          installed 15 days into the 30-day window -> 500) with three flat
          ONE_TIME charges (600, 4000, 5000) — the proration min(days,30)/30
          interacts with the charge-type branch and the invoice cycle filter,
          yielding total 10100 and not the unprorated 10600.
        test_recipe:
          setup:
            - "Developer d4, listed app a4, ACTIVE installation inst4 for merchant m4 with installed_at = 2026-09-01T00:00:00Z (logical clock default)"
            - "inst4 has APPROVED charges in cycle 2026-09: USAGE base 1000 (created at 2026-09-16 -> prorated to 500), ONE_TIME 600, ONE_TIME 4000, ONE_TIME 5000"
            - "Invoice inv4 (m4, 2026-09) OPEN"
          setup_api_calls:
            - call: "POST /developers"
              payload: { company_name: "D4", contact_email: "d4@x.com", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { d4_id: $.data.id }
            - call: "POST /apps"
              payload: { developer_id: "${d4_id}", name: "AppFour", category: "FULFILLMENT" }
              as: Developer
              as_user_id: "${d4_id}"
              captures: { a4_id: $.data.id }
            - call: "POST /apps/${a4_id}/versions"
              payload: { semver: "1.0.0" }
              as: Developer
              as_user_id: "${d4_id}"
              captures: { v4_id: $.data.id }
            - call: "POST /apps/${a4_id}/submit"
              payload: {}
              as: Developer
              as_user_id: "${d4_id}"
            - call: "POST /app-versions/${v4_id}/approve"
              payload: { reviewer_id: "rev-1" }
              as: Reviewer
            - call: "POST /apps/${a4_id}/publish"
              payload: {}
              as: Developer
              as_user_id: "${d4_id}"
            - call: "POST /merchants"
              payload: { shop_domain: "m4.myshop.com", plan_tier: "ENTERPRISE" }
              as: PlatformAdmin
              captures: { m4_id: $.data.id }
            - call: "POST /installations"
              payload: { app_id: "${a4_id}", merchant_id: "${m4_id}" }
              as: Merchant
              as_user_id: "${m4_id}"
              captures: { inst4_id: $.data.id }
            - call: "POST /installations/${inst4_id}/consent"
              payload: {}
              as: Merchant
              as_user_id: "${m4_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /installations/${inst4_id}/billing-charges"
              payload: { charge_type: "USAGE", base_amount_cents: 1000, description: "usage sep" }
              as: Developer
              as_user_id: "${d4_id}"
              captures: { cu_id: $.data.id }
            - call: "POST /billing-charges/${cu_id}/approve"
              payload: {}
              as: Merchant
              as_user_id: "${m4_id}"
            - call: "POST /installations/${inst4_id}/billing-charges"
              payload: { charge_type: "ONE_TIME", base_amount_cents: 600, description: "t1" }
              as: Developer
              as_user_id: "${d4_id}"
              captures: { ct1_id: $.data.id }
            - call: "POST /billing-charges/${ct1_id}/approve"
              payload: {}
              as: Merchant
              as_user_id: "${m4_id}"
            - call: "POST /installations/${inst4_id}/billing-charges"
              payload: { charge_type: "ONE_TIME", base_amount_cents: 4000, description: "t2" }
              as: Developer
              as_user_id: "${d4_id}"
              captures: { ct2_id: $.data.id }
            - call: "POST /billing-charges/${ct2_id}/approve"
              payload: {}
              as: Merchant
              as_user_id: "${m4_id}"
            - call: "POST /installations/${inst4_id}/billing-charges"
              payload: { charge_type: "ONE_TIME", base_amount_cents: 5000, description: "t3" }
              as: Developer
              as_user_id: "${d4_id}"
              captures: { ct3_id: $.data.id }
            - call: "POST /billing-charges/${ct3_id}/approve"
              payload: {}
              as: Merchant
              as_user_id: "${m4_id}"
            - call: "POST /merchants/${m4_id}/invoices"
              payload: { cycle: "2026-09" }
              as: PlatformAdmin
              captures: { inv4_id: $.data.id, inv4_v: $.data.version }
          trigger:
            - call: "POST /invoices/${inv4_id}/issue"
              payload: { expected_invoice_version: "${inv4_v}" }
              as: PlatformAdmin
              captures: { inv4_total: $.data.total_cents }
            - call: "GET /billing-charges/${cu_id}"
              payload: {}
              as: PlatformAdmin
              captures: { cu_final: $.data.final_amount_cents }
          assert:
            - "AppBillingCharge.${cu_id}.final_amount_cents == 500 (round_half_up(1000 * min(15,30) / 30))"
            - "MonthlyInvoice.${inv4_id}.total_cents == 10100 (500 + 600 + 4000 + 5000)"

  - rule_id: non_linear_state_machine
    instances:
      - name: app_version_review_cycle_resubmission_increments_round
        grounds:
          - state_machines.AppVersion.IN_REVIEW_to_CHANGES_REQUESTED
          - state_machines.AppVersion.CHANGES_REQUESTED_to_IN_REVIEW
          - state_machines.App.CHANGES_REQUESTED_to_IN_REVIEW
        distinguishing_aspect: |
          Cyclic machine on AppVersion: IN_REVIEW -> CHANGES_REQUESTED ->
          IN_REVIEW loops, and the second pass through IN_REVIEW carries
          review_round == 1 — the cycle is observable, not just structural.
        test_recipe:
          setup:
            - "Developer d5 with app a5 in CHANGES_REQUESTED after one review round (version v5 review_round 0 -> CHANGES_REQUESTED)"
          setup_api_calls:
            - call: "POST /developers"
              payload: { company_name: "D5", contact_email: "d5@x.com", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { d5_id: $.data.id }
            - call: "POST /apps"
              payload: { developer_id: "${d5_id}", name: "AppFive", category: "MARKETING" }
              as: Developer
              as_user_id: "${d5_id}"
              captures: { a5_id: $.data.id }
            - call: "POST /apps/${a5_id}/versions"
              payload: { semver: "1.0.0" }
              as: Developer
              as_user_id: "${d5_id}"
              captures: { v5_id: $.data.id }
            - call: "POST /apps/${a5_id}/submit"
              payload: {}
              as: Developer
              as_user_id: "${d5_id}"
            - call: "POST /app-versions/${v5_id}/request-changes"
              payload: { reviewer_id: "rev-1", note: "fix onboarding" }
              as: Reviewer
          trigger:
            - call: "POST /apps/${a5_id}/submit"
              payload: {}
              as: Developer
              as_user_id: "${d5_id}"
            - call: "GET /app-versions/${v5_id}"
              payload: {}
              as: Reviewer
              captures: { v5_round: $.data.review_round, v5_status: $.data.status }
          assert:
            - "AppVersion.${v5_id}.status == 'IN_REVIEW'"
            - "AppVersion.${v5_id}.review_round == 1 (incremented exactly once by the resubmission)"
      - name: installation_consent_revocation_parallel_dimensions
        grounds:
          - state_machines.Installation.ACTIVE_to_RECONSENT_REQUIRED
          - state_machines.ConsentRecord.GRANTED_to_REVOKED
          - state_machines.Installation.RECONSENT_REQUIRED_to_ACTIVE
        distinguishing_aspect: |
          Parallel-dimension machine on Installation x ConsentRecord: revoking one
          GRANTED consent flips the installation ACTIVE -> RECONSENT_REQUIRED
          while the OTHER consent record of the same installation stays GRANTED —
          the two state axes evolve independently on linked rows, and re-consent
          restores ACTIVE without resurrecting the REVOKED record.
        test_recipe:
          setup:
            - "Listed app a6 whose published version has TWO APPROVED scope requests (read_products LOW, read_orders LOW)"
            - "ACTIVE installation inst6 for merchant m6 with two GRANTED ConsentRecords cr1, cr2"
          setup_api_calls:
            - call: "POST /developers"
              payload: { company_name: "D6", contact_email: "d6@x.com", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { d6_id: $.data.id }
            - call: "POST /apps"
              payload: { developer_id: "${d6_id}", name: "AppSix", category: "PRODUCTIVITY" }
              as: Developer
              as_user_id: "${d6_id}"
              captures: { a6_id: $.data.id }
            - call: "POST /apps/${a6_id}/versions"
              payload: { semver: "1.0.0" }
              as: Developer
              as_user_id: "${d6_id}"
              captures: { v6_id: $.data.id }
            - call: "POST /permission-scopes"
              payload: { code: "read_products", risk_level: "LOW" }
              as: PlatformAdmin
            - call: "POST /permission-scopes"
              payload: { code: "read_orders", risk_level: "LOW" }
              as: PlatformAdmin
            - call: "POST /app-versions/${v6_id}/scope-requests"
              payload: { scope_code: "read_products" }
              as: Developer
              as_user_id: "${d6_id}"
              captures: { sr1_id: $.data.id }
            - call: "POST /app-versions/${v6_id}/scope-requests"
              payload: { scope_code: "read_orders" }
              as: Developer
              as_user_id: "${d6_id}"
              captures: { sr2_id: $.data.id }
            - call: "POST /apps/${a6_id}/submit"
              payload: {}
              as: Developer
              as_user_id: "${d6_id}"
            - call: "POST /scope-requests/${sr1_id}/decide"
              payload: { decision: "APPROVED" }
              as: Reviewer
            - call: "POST /scope-requests/${sr2_id}/decide"
              payload: { decision: "APPROVED" }
              as: Reviewer
            - call: "POST /app-versions/${v6_id}/approve"
              payload: { reviewer_id: "rev-1" }
              as: Reviewer
            - call: "POST /apps/${a6_id}/publish"
              payload: {}
              as: Developer
              as_user_id: "${d6_id}"
            - call: "POST /merchants"
              payload: { shop_domain: "m6.myshop.com", plan_tier: "BASIC" }
              as: PlatformAdmin
              captures: { m6_id: $.data.id }
            - call: "POST /installations"
              payload: { app_id: "${a6_id}", merchant_id: "${m6_id}" }
              as: Merchant
              as_user_id: "${m6_id}"
              captures: { inst6_id: $.data.id }
            - call: "POST /installations/${inst6_id}/consent"
              payload: {}
              as: Merchant
              as_user_id: "${m6_id}"
            - call: "GET /installations/${inst6_id}/consent-records"
              payload: {}
              as: Merchant
              as_user_id: "${m6_id}"
              captures: { cr1_id: "$.data[0].id", cr2_id: "$.data[1].id" }
          trigger:
            - call: "POST /installations/${inst6_id}/consent-records/${cr1_id}/revoke"
              payload: {}
              as: Merchant
              as_user_id: "${m6_id}"
            - call: "GET /installations/${inst6_id}"
              payload: {}
              as: Merchant
              as_user_id: "${m6_id}"
              captures: { inst6_status: $.data.status }
            - call: "GET /consent-records/${cr2_id}"
              payload: {}
              as: Merchant
              as_user_id: "${m6_id}"
              captures: { cr2_status: $.data.status }
          assert:
            - "Installation.${inst6_id}.status == 'RECONSENT_REQUIRED'"
            - "ConsentRecord.${cr2_id}.status == 'GRANTED' (independent dimension untouched by the sibling revocation)"

  - rule_id: transitive_cascade
    instances:
      - name: app_suspend_cascades_to_installations_and_pending_charges
        grounds:
          - state_machines.App.LISTED_to_SUSPENDED
          - state_machines.Installation.ACTIVE_to_SUSPENDED
          - state_machines.App.LISTED_to_DELISTED
        distinguishing_aspect: |
          Depth-3 cascade triggered by POST /apps/{id}/delist from SUSPENDED:
          App SUSPENDED -> DELISTED (hop 1) forces Installation ACTIVE/SUSPENDED
