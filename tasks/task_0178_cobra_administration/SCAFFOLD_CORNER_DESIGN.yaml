              as: PlanSponsor
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/send-notice"
              payload: {}
              as: PlanAdministrator
              captures: { notice_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-04-10T00:00:00.000Z" }
              as: PlanAdministrator
            - call: "POST /notices/${notice_id}/elect"
              payload: {}
              as: QualifiedBeneficiary
              as_user_id: "${ben_id}"
              captures: { enr_id: $.data.id }
            - call: "GET /accounts?enrollment_id=${enr_id}"
              payload: {}
              as: BillingAgent
              captures: { acct_id: $.data.0.id }
            - call: "POST /accounts/${acct_id}/invoices"
              payload: { coverage_month: "2026-04" }
              as: BillingAgent
            - call: "POST /accounts/${acct_id}/payments"
              payload: { amount_cents: 70000, target_coverage_month: "2026-04" }
              as: BillingAgent
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: BillingAgent
              captures: { acct_v_pre: $.data.version }
            - call: "POST /accounts/${acct_id}/refund"
              payload: { refund_amount_cents: 4000, expected_account_version: "${acct_v_pre}" }
              as: BillingAgent
          trigger:
            - call: "POST /accounts/${acct_id}/refund"
              payload: { refund_amount_cents: 2000, expected_account_version: "${acct_v_pre}" }
              as: BillingAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"
            - "PremiumAccount.${acct_id}.amount_refunded_cents == 4000"

      - name: refund_correct_version_succeeds_and_increments
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[account-refund-stale-version]
          - entities.PremiumAccount.fields.version
        distinguishing_aspect: "A refund with the current expected_account_version succeeds (200) and increments PremiumAccount.version by 1 while reducing credit_balance_cents."
        test_recipe:
          setup: ["Plan A account A1 with credit_balance 8800 (April invoice 61200, payment 70000)."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-03-20T00:00:00.000Z" }
              as: PlanAdministrator
            - call: "POST /plans"
              payload: { name: "Acme Plan A", applicable_premium_cents: 60000 }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { plan_id: "${plan_id}", full_name: "B OCC2", relationship: "EMPLOYEE", original_coverage_start: "2024-01-01T00:00:00.000Z" }
              as: PlanSponsor
              captures: { ben_id: $.data.id }
            - call: "POST /events"
              payload: { plan_id: "${plan_id}", beneficiary_id: "${ben_id}", event_type: "TERMINATION", event_date: "2026-03-31T00:00:00.000Z", coverage_loss_date: "2026-04-01T00:00:00.000Z" }
              as: PlanSponsor
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/send-notice"
              payload: {}
              as: PlanAdministrator
              captures: { notice_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-04-10T00:00:00.000Z" }
              as: PlanAdministrator
            - call: "POST /notices/${notice_id}/elect"
              payload: {}
              as: QualifiedBeneficiary
              as_user_id: "${ben_id}"
              captures: { enr_id: $.data.id }
            - call: "GET /accounts?enrollment_id=${enr_id}"
              payload: {}
              as: BillingAgent
              captures: { acct_id: $.data.0.id }
            - call: "POST /accounts/${acct_id}/invoices"
              payload: { coverage_month: "2026-04" }
              as: BillingAgent
            - call: "POST /accounts/${acct_id}/payments"
              payload: { amount_cents: 70000, target_coverage_month: "2026-04" }
              as: BillingAgent
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: BillingAgent
              captures: { acct_v: $.data.version }
          trigger:
            - call: "POST /accounts/${acct_id}/refund"
              payload: { refund_amount_cents: 8800, expected_account_version: "${acct_v}" }
              as: BillingAgent
          assert:
            - "response.status == 200"
            - "PremiumAccount.${acct_id}.credit_balance_cents == 0"
            - "PremiumAccount.${acct_id}.amount_refunded_cents == 8800"

      - name: scheduled_election_expiry_via_tick
        claim_type: scheduled_actions
        grounds:
          - state_machines.ElectionNotice.OUTSTANDING_to_EXPIRED
        excluded_because:
          difficulty_instance: non_linear_state_machine / qualifying_event_branch_elected_vs_lapsed
          rationale: "The scheduled tick-driven election expiry is exercised by the named §1.8 branch instance."

      - name: cascade_election_chain_three_levels
        claim_type: cascading_side_effects
        grounds:
          - state_machines.QualifyingEvent.NOTICE_SENT_to_ELECTED
        excluded_because:
          difficulty_instance: transitive_cascade / election_cascade_event_to_notice_to_enrollment_to_account
          rationale: "The 3-level election cascade is the named §1.8 transitive_cascade instance."

      - name: derived_paid_through_date_after_payment
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.paid_through_date
        excluded_because:
          difficulty_instance: combinatorial_formula / paid_through_date_circular_order_payment_then_threshold
          rationale: "paid_through_date reconciliation after payment is asserted by the named §1.8 instance."

  # ---------------------------------------------------------------------------
  # Section 9 — Consistency Model
  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_invoice_visible_in_same_response
        claim_type: immediate
        grounds:
