    side_effects: []
  - method: GET
    path: "/studios/{studioId}/licenses"
    description: "List licenses; filter by project_id (reverse-reachability for License.project_id)"
    roles: [StudioOps, BillingOps]
    code: 200
    input: ["project_id?", "limit?", "offset?"]
    output: License[]
    side_effects: []
  - method: POST
    path: "/studios/{studioId}/licenses/{licenseId}/clear"
    description: "Mark license rights cleared (RESERVED->CLEARED)"
    roles: [StudioOps]
    code: 200
    input: []
    output: License
    side_effects: []

  # ---- ChangeOrder ----
  - method: POST
    path: "/studios/{studioId}/change-orders"
    description: "Propose a ChangeOrder against a project; OCC-guarded on Project.version"
    roles: [StudioOps]
    code: 201
    input: ["project_id", "reason", "delta_cents", "expected_project_version", "concept_id?", "extra_revisions?"]
    output: ChangeOrder
    side_effects: ["status=PROPOSED"]
  - method: GET
    path: "/studios/{studioId}/change-orders/{changeOrderId}"
    description: "Get a ChangeOrder"
    roles: [StudioOps, BillingOps, Client]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: []
  - method: GET
    path: "/studios/{studioId}/change-orders"
    description: "List change orders; filter by project_id or concept_id (reverse-reachability for ChangeOrder.project_id and ChangeOrder.concept_id)"
    roles: [StudioOps, BillingOps, Client]
    code: 200
    input: ["project_id?", "concept_id?", "limit?", "offset?"]
    output: ChangeOrder[]
    side_effects: []
  - method: POST
    path: "/studios/{studioId}/change-orders/{changeOrderId}/approve"
    description: "Client approves change order; recomputes contract_value and final_deposit; bumps Project.version"
    roles: [Client]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: ["contract_value_cents and final_deposit_cents recomputed; Project.version += 1"]
  - method: POST
    path: "/studios/{studioId}/change-orders/{changeOrderId}/reject"
    description: "Client rejects change order (PROPOSED->REJECTED)"
    roles: [Client]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: []

  # ---- Retainer ----
  - method: POST
    path: "/studios/{studioId}/retainers"
    description: "Create a care-plan Retainer for a client"
    roles: [StudioOps]
    code: 201
    input: ["client_id", "monthly_fee_cents", "included_hours?", "tier1_rate_cents", "tier2_rate_cents"]
    output: Retainer
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/studios/{studioId}/retainers/{retainerId}"
    description: "Get a Retainer"
    roles: [StudioOps, BillingOps, Client]
    code: 200
    input: []
    output: Retainer
    side_effects: []
  - method: GET
    path: "/studios/{studioId}/retainers"
    description: "List retainers; filter by client_id (reverse-reachability for Retainer.client_id)"
    roles: [StudioOps, BillingOps, Client]
    code: 200
    input: ["client_id?", "limit?", "offset?"]
    output: Retainer[]
    side_effects: []
  - method: POST
    path: "/studios/{studioId}/retainers/{retainerId}/pause"
    description: "Pause retainer (ACTIVE->PAUSED)"
    roles: [StudioOps]
    code: 200
    input: []
    output: Retainer
    side_effects: []
  - method: POST
    path: "/studios/{studioId}/retainers/{retainerId}/resume"
    description: "Resume retainer (PAUSED->ACTIVE)"
    roles: [StudioOps]
    code: 200
    input: []
    output: Retainer
    side_effects: []
  - method: POST
    path: "/studios/{studioId}/retainers/{retainerId}/cancel"
    description: "Cancel retainer (ACTIVE/PAUSED->CANCELLED)"
    roles: [StudioOps]
    code: 200
    input: []
    output: Retainer
    side_effects: []

  # ---- CareCycle ----
  - method: POST
    path: "/studios/{studioId}/retainers/{retainerId}/care-cycles"
    description: "Open a billing CareCycle on a retainer; rejects overlapping half-open windows"
    roles: [StudioOps]
    code: 201
    input: ["period_start", "period_end", "hours_used?"]
    output: CareCycle
    side_effects: ["status=OPEN"]
  - method: GET
    path: "/studios/{studioId}/retainers/{retainerId}/care-cycles"
    description: "List care cycles of a retainer (reverse-reachability for CareCycle.retainer_id)"
    roles: [StudioOps, BillingOps]
    code: 200
    input: ["limit?", "offset?"]
    output: CareCycle[]
    side_effects: []
  - method: GET
    path: "/studios/{studioId}/retainers/{retainerId}/care-cycles/{careCycleId}"
    description: "Get a CareCycle"
    roles: [StudioOps, BillingOps]
    code: 200
    input: []
    output: CareCycle
    side_effects: []
  - method: POST
    path: "/studios/{studioId}/retainers/{retainerId}/care-cycles/{careCycleId}/close"
    description: "Close cycle after period_end; computes tiered overage and billed total"
    roles: [StudioOps]
    code: 200
    input: []
    output: CareCycle
    side_effects: ["overage_cents and billed_cents computed"]
  - method: POST
    path: "/studios/{studioId}/retainers/{retainerId}/care-cycles/{careCycleId}/bill"
    description: "Bill a closed cycle (CLOSED->BILLED)"
    roles: [BillingOps]
    code: 200
    input: []
    output: CareCycle
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID header" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for operation, or entity_backed role acting on a resource it does not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist or is outside the path scope" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, invalid enum, or numeric constraint violated" }
  - { id: ERR_STALE_PROJECT_VERSION, http: 412, condition: "expected_project_version on change-order create does not match current Project.version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not defined from the resource's current state" }
  - { id: ERR_PROJECT_WRONG_STAGE, http: 409, condition: "Parent Project not in the stage required for this child operation" }
  - { id: ERR_PROJECT_NOT_ACTIVATED, http: 409, condition: "Operation requires an activated project but project is still DRAFT" }
  - { id: ERR_NO_MILESTONES, http: 409, condition: "Activation requires at least one milestone" }
  - { id: ERR_CLIENT_NOT_ACTIVE, http: 409, condition: "Project activation requires the client to be ACTIVE" }
  - { id: ERR_MOODBOARD_NOT_APPROVED, http: 409, condition: "DISCOVERY->CONCEPT requires an APPROVED moodboard" }
  - { id: ERR_NO_APPROVED_CONCEPT, http: 409, condition: "CONCEPT->DELIVERY requires an APPROVED concept" }
  - { id: ERR_DELIVERABLES_INCOMPLETE, http: 409, condition: "DELIVERY->HANDOFF requires all handoff-required deliverables ACCEPTED" }
  - { id: ERR_DEPOSIT_UNPAID, http: 402, condition: "DELIVERY->HANDOFF requires deposit_collected_cents >= final_deposit_cents" }
  - { id: ERR_OPEN_INVOICES, http: 409, condition: "HANDOFF->COMPLETED requires no ISSUED/OVERDUE invoices" }
  - { id: ERR_REVISION_LIMIT_REACHED, http: 409, condition: "request-revision would exceed the concept's effective revision limit" }
  - { id: ERR_INTERVAL_OVERLAP, http: 409, condition: "License window overlaps another on the project, or CareCycle window overlaps another on the retainer" }
  - { id: ERR_ZERO_AMOUNT_MILESTONE, http: 409, condition: "Cannot issue an invoice for a milestone whose amount_cents is 0" }
  - { id: ERR_NOT_YET_DUE, http: 409, condition: "mark-overdue called before the logical clock passes the invoice due_date" }
  - { id: ERR_CYCLE_NOT_ENDED, http: 409, condition: "care-cycle close called before the logical clock reaches period_end" }
  - { id: ERR_OPEN_CYCLE, http: 409, condition: "Retainer pause/cancel blocked while a CareCycle is OPEN" }
  - { id: ERR_INVALID_INTERVAL, http: 400, condition: "valid_from >= valid_until on a License, or period_start >= period_end on a CareCycle" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: StudioOps
    description: "Studio operator: manages projects, scope, milestones, licenses, retainers, change-order proposals, and stage advancement."
    identity: "opaque"
    exclusive_operations:
      - "POST /studios — create studio"
      - "POST /studios/{studioId}/clients — register client"
      - "POST /studios/{studioId}/clients/{clientId}/archive — archive client"
      - "POST /studios/{studioId}/projects — create project"
      - "POST /studios/{studioId}/projects/{projectId}/activate — activate"
      - "POST /studios/{studioId}/projects/{projectId}/advance — advance stage"
      - "POST /studios/{studioId}/projects/{projectId}/complete — complete"
      - "POST /studios/{studioId}/projects/{projectId}/cancel — cancel"
      - "POST /studios/{studioId}/projects/{projectId}/milestones — create milestone"
      - "POST /studios/{studioId}/licenses — reserve license"
      - "POST /studios/{studioId}/licenses/{licenseId}/clear — clear license"
      - "POST /studios/{studioId}/change-orders — propose change order"
      - "POST /studios/{studioId}/retainers — create retainer"
      - "POST /studios/{studioId}/retainers/{retainerId}/pause — pause retainer"
      - "POST /studios/{studioId}/retainers/{retainerId}/resume — resume retainer"
      - "POST /studios/{studioId}/retainers/{retainerId}/cancel — cancel retainer"
      - "POST /studios/{studioId}/retainers/{retainerId}/care-cycles — open care cycle"
      - "POST /studios/{studioId}/retainers/{retainerId}/care-cycles/{careCycleId}/close — close cycle"
    shared_operations:
      - "POST /studios/{studioId}/projects/{projectId}/deliverables — create deliverable (shared with Designer)"
      - "POST /_clock/set_current_utc — set clock (shared with BillingOps)"
      - "GET endpoints on studio/project/moodboard/concept/milestone/deliverable/license/change-order/retainer/care-cycle"

  - name: Designer
    description: "Creative producer: authors moodboards, concepts, and deliverables and presents them."
    identity: "opaque"
    exclusive_operations:
      - "POST /studios/{studioId}/projects/{projectId}/moodboards — create moodboard"
      - "POST /studios/{studioId}/projects/{projectId}/moodboards/{moodboardId}/submit — submit moodboard"
      - "POST /studios/{studioId}/projects/{projectId}/concepts — create concept"
      - "POST /studios/{studioId}/projects/{projectId}/concepts/{conceptId}/present — present concept"
      - "POST /studios/{studioId}/projects/{projectId}/deliverables/{deliverableId}/deliver — deliver asset"
    shared_operations:
      - "POST /studios/{studioId}/projects/{projectId}/deliverables — create deliverable (shared with StudioOps)"
      - "GET endpoints on project/moodboard/concept/deliverable"

  - name: Client
    description: "Commissioning client: approves/rejects moodboards, concepts, deliverables, and change orders; requests revisions. Acts only on resources under its own client_id."
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /studios/{studioId}/projects/{projectId}/moodboards/{moodboardId}/approve — approve moodboard"
      - "POST /studios/{studioId}/projects/{projectId}/moodboards/{moodboardId}/reject — reject moodboard"
      - "POST /studios/{studioId}/projects/{projectId}/concepts/{conceptId}/request-revision — request revision"
      - "POST /studios/{studioId}/projects/{projectId}/concepts/{conceptId}/approve — approve concept"
      - "POST /studios/{studioId}/projects/{projectId}/concepts/{conceptId}/reject — reject concept"
      - "POST /studios/{studioId}/projects/{projectId}/deliverables/{deliverableId}/accept — accept asset"
      - "POST /studios/{studioId}/projects/{projectId}/deliverables/{deliverableId}/request-revision — request asset revision"
      - "POST /studios/{studioId}/change-orders/{changeOrderId}/approve — approve change order"
      - "POST /studios/{studioId}/change-orders/{changeOrderId}/reject — reject change order"
    shared_operations:
      - "GET endpoints scoped to the client's own projects/resources"

  - name: BillingOps
    description: "Billing operator: issues/pays invoices, marks overdue, records deposits, bills care cycles."
    identity: "opaque"
    exclusive_operations:
      - "POST /studios/{studioId}/projects/{projectId}/deposits — record deposit"
      - "POST /studios/{studioId}/invoices — issue invoice"
      - "POST /studios/{studioId}/invoices/{invoiceId}/mark-overdue — mark overdue"
      - "POST /studios/{studioId}/invoices/{invoiceId}/pay — record payment"
      - "POST /studios/{studioId}/retainers/{retainerId}/care-cycles/{careCycleId}/bill — bill care cycle"
    shared_operations:
      - "POST /_clock/set_current_utc — set clock (shared with StudioOps)"
      - "GET endpoints on invoice/milestone/project/license/retainer/care-cycle"
