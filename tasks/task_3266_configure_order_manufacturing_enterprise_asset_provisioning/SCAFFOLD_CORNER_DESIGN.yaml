        test_recipe:
          setup: ["shortage-blocked job with PENDING substitution request"]
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "SM8", account_tier: "STANDARD", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { sm8_a: $.data.id } }
