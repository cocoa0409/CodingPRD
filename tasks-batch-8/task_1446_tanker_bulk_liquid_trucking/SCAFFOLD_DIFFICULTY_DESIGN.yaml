            - { call: "POST /bulk-liquid/wash-bays", payload: { bay_code: "WB-1", supported_wash_levels: [FLUSH], cleanup_buffer_minutes: 30 }, as: FleetAdmin, captures: { bay: $.data.id } }
            - { call: "POST /bulk-liquid/tank-wash-certificates", payload: { trailer_id: "${trl1}", wash_bay_id: "${bay}", wash_level: FLUSH, window_start: "2026-08-02T09:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: WashOperator, captures: { c1: $.data.id } }
