scaffold_corner_design:
  # ================================================================
  - section: entities
    instances:
      - name: create_partner_returns_201_with_fields
        claim_type: creation
        grounds: [entities.CharityPartner, endpoints]
        distinguishing_aspect: "POST /partners with all required fields returns 201 and a CharityPartner with server-minted id, version 1, ytd_donation_value_cents 0, diverted_weight_lbs 0."
        test_recipe:
          setup: ["No prerequisites."]
          setup_api_calls: []
          trigger:
            - call: "POST /partners"
              payload: { name: "AcmeCharity", region_code: "CA-BAY", tax_id: "EIN-C1", accepted_categories: ["FURNITURE", "HOUSEHOLD"] }
              as: PlatformAdmin
              captures: { partner_id: $.data.id }
          assert:
            - "response code 201"
            - "data.status == ACTIVE"
            - "data.ytd_donation_value_cents == 0"
            - "data.diverted_weight_lbs == 0"
            - "data.version == 1"

      - name: create_request_missing_required_disposition_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.PickupRequest.fields.disposition, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /pickup-requests omitting the required disposition field returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A partner and a donor exist."]
          setup_api_calls:
            - call: "POST /partners"
              payload: { name: "ReqCo", region_code: "CA-BAY", tax_id: "EIN-C2", accepted_categories: ["FURNITURE"] }
              as: PlatformAdmin
              captures: { partner_id: $.data.id }
            - call: "POST /donors"
              payload: { email: "c2@x.com", full_name: "C Two", address: "1 B St", region_code: "CA-BAY" }
              as: Anonymous
              captures: { donor_id: $.data.id }
          trigger:
            - call: "POST /pickup-requests"
              payload: { donor_id: "${donor_id}", partner_id: "${partner_id}", pickup_mode: "ATTENDED", address: "1 B St" }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response code 400"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: get_partner_nonexistent_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_PARTNER_NOT_FOUND]", entities.CharityPartner]
        distinguishing_aspect: "GET /partners/{id} with a non-existent UUID returns ERR_PARTNER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /partners/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response code 404"
            - "response error_id == ERR_PARTNER_NOT_FOUND"

      - name: request_declared_volume_computed_from_items
        claim_type: computed_fields
        grounds: [entities.PickupRequest.fields.declared_volume_cf, entities.PickupRequest.fields.is_free_donation, calculations.declared_volume]
        distinguishing_aspect: "Adding items volume 30 then 20 to a DONATION request drives declared_volume_cf to 50 and is_free_donation to true (<= 50 cap)."
        test_recipe:
          setup: ["Partner accepts FURNITURE; donor; DONATION request created."]
          setup_api_calls:
            - call: "POST /partners"
              payload: { name: "VolCo", region_code: "CA-BAY", tax_id: "EIN-C3", accepted_categories: ["FURNITURE"] }
              as: PlatformAdmin
              captures: { partner_id: $.data.id }
            - call: "POST /donors"
              payload: { email: "c3@x.com", full_name: "C Three", address: "3 B St", region_code: "CA-BAY" }
              as: Anonymous
              captures: { donor_id: $.data.id }
            - call: "POST /pickup-requests"
              payload: { donor_id: "${donor_id}", partner_id: "${partner_id}", pickup_mode: "ATTENDED", disposition: "DONATION", address: "3 B St" }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { req_id: $.data.id }
            - call: "POST /pickup-requests/${req_id}/items"
              payload: { category: "FURNITURE", volume_cf: 30, weight_lbs: 5, declared_value_cents: 1000, declared_condition: "GOOD" }
              as: Donor
              as_user_id: "${donor_id}"
          trigger:
            - call: "POST /pickup-requests/${req_id}/items"
              payload: { category: "FURNITURE", volume_cf: 20, weight_lbs: 5, declared_value_cents: 1000, declared_condition: "GOOD" }
              as: Donor
              as_user_id: "${donor_id}"
          assert:
            - "GET /pickup-requests/${req_id} data.declared_volume_cf == 50"
            - "GET /pickup-requests/${req_id} data.is_free_donation == true"

      - name: create_request_invalid_disposition_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.PickupRequest.fields.disposition, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /pickup-requests with disposition 'SELL' (not in {DONATION, HAUL}) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Partner and donor exist."]
          setup_api_calls:
            - call: "POST /partners"
              payload: { name: "EnumCo", region_code: "CA-BAY", tax_id: "EIN-C4", accepted_categories: ["FURNITURE"] }
              as: PlatformAdmin
              captures: { partner_id: $.data.id }
            - call: "POST /donors"
              payload: { email: "c4@x.com", full_name: "C Four", address: "4 B St", region_code: "CA-BAY" }
              as: Anonymous
              captures: { donor_id: $.data.id }
          trigger:
            - call: "POST /pickup-requests"
              payload: { donor_id: "${donor_id}", partner_id: "${partner_id}", pickup_mode: "ATTENDED", disposition: "SELL", address: "4 B St" }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

  # ================================================================
  - section: state_machines
    instances:
      - name: complete_from_requested_returns_invalid_state
        claim_type: invalid_transitions
        grounds: [state_machines.PickupRequest.SCHEDULED_to_COMPLETED, "errors[ERR_REQUEST_INVALID_STATE]"]
        distinguishing_aspect: "Completing a request still in REQUESTED (never scheduled) returns ERR_REQUEST_INVALID_STATE (409); no receipt or invoice is created."
        test_recipe:
          setup: ["Partner accepts FURNITURE; donor; REQUESTED request with one item (not scheduled)."]
          setup_api_calls:
            - call: "POST /partners"
              payload: { name: "InvCo", region_code: "CA-BAY", tax_id: "EIN-C5", accepted_categories: ["FURNITURE"] }
              as: PlatformAdmin
              captures: { partner_id: $.data.id }
            - call: "POST /donors"
              payload: { email: "c5@x.com", full_name: "C Five", address: "5 B St", region_code: "CA-BAY" }
              as: Anonymous
              captures: { donor_id: $.data.id }
            - call: "POST /pickup-requests"
              payload: { donor_id: "${donor_id}", partner_id: "${partner_id}", pickup_mode: "ATTENDED", disposition: "HAUL", address: "5 B St" }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { req_id: $.data.id }
            - call: "POST /pickup-requests/${req_id}/items"
              payload: { category: "FURNITURE", volume_cf: 10, weight_lbs: 5, declared_value_cents: 1000, declared_condition: "GOOD" }
              as: Donor
              as_user_id: "${donor_id}"
          trigger:
            - call: "POST /pickup-requests/${req_id}/complete"
              payload: { measured_volume_cf: 10 }
              as: Driver
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_REQUEST_INVALID_STATE"

      - name: cancel_completed_request_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.PickupRequest.SCHEDULED_to_CANCELLED, "errors[ERR_REQUEST_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a request already in terminal COMPLETED returns ERR_REQUEST_INVALID_STATE (409)."
        test_recipe:
          setup: ["A DONATION request has been scheduled and completed (COMPLETED)."]
          setup_api_calls:
            - call: "POST /partners"
              payload: { name: "TermCo", region_code: "CA-BAY", tax_id: "EIN-C6", accepted_categories: ["FURNITURE"] }
              as: PlatformAdmin
              captures: { partner_id: $.data.id }
            - call: "POST /vehicles"
              payload: { label: "TC6", capacity_cf: 100, home_depot_code: "D1" }
              as: PlatformAdmin
              captures: { vehicle_id: $.data.id }
            - call: "POST /routes"
              payload: { vehicle_id: "${vehicle_id}", partner_id: "${partner_id}", service_date: "2026-03-15", window_start: "2026-03-15T09:00:00Z", window_end: "2026-03-15T17:00:00Z" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/open"
              payload: {}
              as: Dispatcher
              captures: { route_v: $.data.version }
            - call: "POST /donors"
              payload: { email: "c6@x.com", full_name: "C Six", address: "6 B St", region_code: "CA-BAY" }
              as: Anonymous
              captures: { donor_id: $.data.id }
            - call: "POST /pickup-requests"
              payload: { donor_id: "${donor_id}", partner_id: "${partner_id}", pickup_mode: "ATTENDED", disposition: "DONATION", address: "6 B St" }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { req_id: $.data.id }
            - call: "POST /pickup-requests/${req_id}/items"
              payload: { category: "FURNITURE", volume_cf: 20, weight_lbs: 5, declared_value_cents: 1000, declared_condition: "GOOD" }
              as: Donor
              as_user_id: "${donor_id}"
            - call: "POST /pickup-requests/${req_id}/schedule"
              payload: { route_id: "${route_id}", slot_start: "2026-03-15T10:00:00Z", slot_end: "2026-03-15T10:30:00Z", expected_route_version: "${route_v}" }
              as: Dispatcher
            - call: "POST /pickup-requests/${req_id}/complete"
              payload: { measured_volume_cf: 20 }
              as: Driver
          trigger:
            - call: "POST /pickup-requests/${req_id}/cancel"
              payload: {}
              as: Donor
              as_user_id: "${donor_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_REQUEST_INVALID_STATE"

      - name: pause_already_paused_plan_idempotency_rejected
        claim_type: idempotency
        grounds: [state_machines.RecurringPlan.ACTIVE_to_PAUSED, "errors[ERR_PLAN_INVALID_STATE]"]
        distinguishing_aspect: "Pausing a plan already in PAUSED returns ERR_PLAN_INVALID_STATE (409) — pause is not idempotent."
        test_recipe:
          setup: ["Partner; donor; plan created then paused (PAUSED)."]
          setup_api_calls:
            - call: "POST /partners"
              payload: { name: "PauseCo", region_code: "CA-BAY", tax_id: "EIN-C7", accepted_categories: ["FURNITURE"] }
              as: PlatformAdmin
              captures: { partner_id: $.data.id }
            - call: "POST /donors"
              payload: { email: "c7@x.com", full_name: "C Seven", address: "7 B St", region_code: "CA-BAY" }
              as: Anonymous
              captures: { donor_id: $.data.id }
            - call: "POST /recurring-plans"
              payload: { donor_id: "${donor_id}", partner_id: "${partner_id}", pickup_mode: "ATTENDED", address: "7 B St", default_disposition: "DONATION", frequency: "WEEKLY" }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /recurring-plans/${plan_id}/pause"
              payload: {}
              as: Donor
              as_user_id: "${donor_id}"
          trigger:
            - call: "POST /recurring-plans/${plan_id}/pause"
              payload: {}
              as: Donor
              as_user_id: "${donor_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PLAN_INVALID_STATE"

      - name: recurring_generate_materializes_requested_pickup
        claim_type: valid_transition
        grounds: [endpoints, entities.PickupRequest.fields.recurring_plan_id, state_machines.PickupRequest.REQUESTED_to_SCHEDULED]
        distinguishing_aspect: "POST /recurring-plans/{id}/generate on an ACTIVE plan creates a REQUESTED PickupRequest stamped with recurring_plan_id and disposition from the plan."
        test_recipe:
          setup: ["Partner; donor; ACTIVE plan default_disposition DONATION."]
          setup_api_calls:
            - call: "POST /partners"
              payload: { name: "GenCo", region_code: "CA-BAY", tax_id: "EIN-C8", accepted_categories: ["FURNITURE"] }
              as: PlatformAdmin
              captures: { partner_id: $.data.id }
            - call: "POST /donors"
              payload: { email: "c8@x.com", full_name: "C Eight", address: "8 B St", region_code: "CA-BAY" }
              as: Anonymous
              captures: { donor_id: $.data.id }
            - call: "POST /recurring-plans"
              payload: { donor_id: "${donor_id}", partner_id: "${partner_id}", pickup_mode: "ATTENDED", address: "8 B St", default_disposition: "DONATION", frequency: "MONTHLY" }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /recurring-plans/${plan_id}/generate"
              payload: {}
              as: Dispatcher
              captures: { new_req_id: $.data.id }
          assert:
            - "response code 201"
            - "data.status == REQUESTED"
            - "data.disposition == DONATION"
            - "data.recurring_plan_id == ${plan_id}"

      - name: close_route_with_reserved_stop_returns_invalid_state
        claim_type: invalid_transitions
        grounds: [state_machines.Route.OPEN_to_CLOSED, "errors[ERR_ROUTE_INVALID_STATE]"]
        distinguishing_aspect: "Closing an OPEN route that still has a RESERVED stop returns ERR_ROUTE_INVALID_STATE (409)."
        test_recipe:
          setup: ["Route OPEN with one scheduled (RESERVED) stop."]
          setup_api_calls:
            - call: "POST /partners"
              payload: { name: "CloseCo", region_code: "CA-BAY", tax_id: "EIN-C9", accepted_categories: ["FURNITURE"] }
              as: PlatformAdmin
              captures: { partner_id: $.data.id }
            - call: "POST /vehicles"
              payload: { label: "TC9", capacity_cf: 200, home_depot_code: "D1" }
              as: PlatformAdmin
              captures: { vehicle_id: $.data.id }
            - call: "POST /routes"
              payload: { vehicle_id: "${vehicle_id}", partner_id: "${partner_id}", service_date: "2026-03-15", window_start: "2026-03-15T09:00:00Z", window_end: "2026-03-15T17:00:00Z" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/open"
              payload: {}
              as: Dispatcher
              captures: { route_v: $.data.version }
            - call: "POST /donors"
              payload: { email: "c9@x.com", full_name: "C Nine", address: "9 B St", region_code: "CA-BAY" }
              as: Anonymous
              captures: { donor_id: $.data.id }
            - call: "POST /pickup-requests"
              payload: { donor_id: "${donor_id}", partner_id: "${partner_id}", pickup_mode: "ATTENDED", disposition: "DONATION", address: "9 B St" }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { req_id: $.data.id }
            - call: "POST /pickup-requests/${req_id}/items"
              payload: { category: "FURNITURE", volume_cf: 20, weight_lbs: 5, declared_value_cents: 1000, declared_condition: "GOOD" }
              as: Donor
              as_user_id: "${donor_id}"
            - call: "POST /pickup-requests/${req_id}/schedule"
              payload: { route_id: "${route_id}", slot_start: "2026-03-15T10:00:00Z", slot_end: "2026-03-15T10:30:00Z", expected_route_version: "${route_v}" }
              as: Dispatcher
          trigger:
            - call: "POST /routes/${route_id}/close"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ROUTE_INVALID_STATE"

  # ================================================================
  - section: calculations
    instances:
      - name: attended_surcharge_applied_to_haul_fee
        claim_type: constants_applied
        grounds: [calculations.haul_fee, entities.HaulInvoice.fields.final_cents]
        distinguishing_aspect: "An ATTENDED HAUL of volume 50, weight 0 bills final_cents 5500 (= 3500 base + 2000 tiered + 2000 attended surcharge), confirming the ATTENDED_SURCHARGE_CENTS constant is applied."
        test_recipe:
          setup: ["ATTENDED HAUL request volume 50 weight 0 scheduled then completed measured 50."]
          setup_api_calls:
            - call: "POST /partners"
              payload: { name: "SurCo", region_code: "CA-BAY", tax_id: "EIN-C10", accepted_categories: ["FURNITURE"] }
              as: PlatformAdmin
              captures: { partner_id: $.data.id }
            - call: "POST /vehicles"
              payload: { label: "TC10", capacity_cf: 100, home_depot_code: "D1" }
              as: PlatformAdmin
              captures: { vehicle_id: $.data.id }
            - call: "POST /routes"
              payload: { vehicle_id: "${vehicle_id}", partner_id: "${partner_id}", service_date: "2026-03-15", window_start: "2026-03-15T09:00:00Z", window_end: "2026-03-15T17:00:00Z" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/open"
              payload: {}
              as: Dispatcher
              captures: { route_v: $.data.version }
            - call: "POST /donors"
              payload: { email: "c10@x.com", full_name: "C Ten", address: "10 B St", region_code: "CA-BAY" }
              as: Anonymous
              captures: { donor_id: $.data.id }
            - call: "POST /pickup-requests"
              payload: { donor_id: "${donor_id}", partner_id: "${partner_id}", pickup_mode: "ATTENDED", disposition: "HAUL", address: "10 B St" }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { req_id: $.data.id }
            - call: "POST /pickup-requests/${req_id}/items"
              payload: { category: "FURNITURE", volume_cf: 50, weight_lbs: 0, declared_value_cents: 100, declared_condition: "GOOD" }
              as: Donor
              as_user_id: "${donor_id}"
            - call: "POST /pickup-requests/${req_id}/schedule"
              payload: { route_id: "${route_id}", slot_start: "2026-03-15T10:00:00Z", slot_end: "2026-03-15T10:30:00Z", expected_route_version: "${route_v}" }
              as: Dispatcher
          trigger:
            - call: "POST /pickup-requests/${req_id}/complete"
              payload: { measured_volume_cf: 50 }
              as: Driver
          assert:
            - "GET /pickup-requests/${req_id}/haul-invoices data[0].final_cents == 5500"
            - "data[0].amount_due_cents == 5500"

      - name: reserved_volume_excludes_serviced_stop
        claim_type: input_set_filtering
        grounds: [calculations.route_reserved_volume, entities.RouteStop.fields.status, entities.Route.fields.reserved_volume_cf]
        distinguishing_aspect: "After a scheduled stop (reserved 30) is completed (SERVICED), route.reserved_volume_cf drops to 0 while serviced_stop_count becomes 1 — SERVICED stops are excluded from the RESERVED sum."
        test_recipe:
          setup: ["DONATION request volume 30 scheduled then completed."]
          setup_api_calls:
            - call: "POST /partners"
              payload: { name: "FiltCo", region_code: "CA-BAY", tax_id: "EIN-C11", accepted_categories: ["FURNITURE"] }
              as: PlatformAdmin
              captures: { partner_id: $.data.id }
            - call: "POST /vehicles"
              payload: { label: "TC11", capacity_cf: 200, home_depot_code: "D1" }
              as: PlatformAdmin
              captures: { vehicle_id: $.data.id }
            - call: "POST /routes"
              payload: { vehicle_id: "${vehicle_id}", partner_id: "${partner_id}", service_date: "2026-03-15", window_start: "2026-03-15T09:00:00Z", window_end: "2026-03-15T17:00:00Z" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/open"
              payload: {}
              as: Dispatcher
              captures: { route_v: $.data.version }
            - call: "POST /donors"
              payload: { email: "c11@x.com", full_name: "C Eleven", address: "11 B St", region_code: "CA-BAY" }
              as: Anonymous
              captures: { donor_id: $.data.id }
            - call: "POST /pickup-requests"
              payload: { donor_id: "${donor_id}", partner_id: "${partner_id}", pickup_mode: "ATTENDED", disposition: "DONATION", address: "11 B St" }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { req_id: $.data.id }
            - call: "POST /pickup-requests/${req_id}/items"
              payload: { category: "FURNITURE", volume_cf: 30, weight_lbs: 5, declared_value_cents: 1000, declared_condition: "GOOD" }
              as: Donor
              as_user_id: "${donor_id}"
            - call: "POST /pickup-requests/${req_id}/schedule"
              payload: { route_id: "${route_id}", slot_start: "2026-03-15T10:00:00Z", slot_end: "2026-03-15T10:30:00Z", expected_route_version: "${route_v}" }
              as: Dispatcher
          trigger:
            - call: "POST /pickup-requests/${req_id}/complete"
              payload: { measured_volume_cf: 30 }
              as: Driver
          assert:
            - "GET /routes/${route_id} data.reserved_volume_cf == 0"
            - "GET /routes/${route_id} data.serviced_stop_count == 1"

      - name: donation_over_volume_limit_boundary_50_vs_51
        claim_type: correct_result
        grounds: ["validations[priority=12]", "errors[ERR_DONATION_OVER_LIMIT]", entities.PickupRequest.fields.declared_volume_cf]
        distinguishing_aspect: "A DONATION request of declared_volume 51 is rejected at schedule with ERR_DONATION_OVER_LIMIT while 50 (the cap) is allowed — the DONATION_MAX_CF boundary."
        test_recipe:
          setup: ["DONATION request with a single item volume 51 (> 50 cap)."]
          setup_api_calls:
            - call: "POST /partners"
              payload: { name: "LimitCo", region_code: "CA-BAY", tax_id: "EIN-C12", accepted_categories: ["FURNITURE"] }
              as: PlatformAdmin
              captures: { partner_id: $.data.id }
            - call: "POST /vehicles"
              payload: { label: "TC12", capacity_cf: 200, home_depot_code: "D1" }
              as: PlatformAdmin
              captures: { vehicle_id: $.data.id }
            - call: "POST /routes"
              payload: { vehicle_id: "${vehicle_id}", partner_id: "${partner_id}", service_date: "2026-03-15", window_start: "2026-03-15T09:00:00Z", window_end: "2026-03-15T17:00:00Z" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/open"
              payload: {}
              as: Dispatcher
              captures: { route_v: $.data.version }
            - call: "POST /donors"
              payload: { email: "c12@x.com", full_name: "C Twelve", address: "12 B St", region_code: "CA-BAY" }
              as: Anonymous
              captures: { donor_id: $.data.id }
            - call: "POST /pickup-requests"
              payload: { donor_id: "${donor_id}", partner_id: "${partner_id}", pickup_mode: "ATTENDED", disposition: "DONATION", address: "12 B St" }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { req_id: $.data.id }
            - call: "POST /pickup-requests/${req_id}/items"
              payload: { category: "FURNITURE", volume_cf: 51, weight_lbs: 5, declared_value_cents: 1000, declared_condition: "GOOD" }
              as: Donor
              as_user_id: "${donor_id}"
