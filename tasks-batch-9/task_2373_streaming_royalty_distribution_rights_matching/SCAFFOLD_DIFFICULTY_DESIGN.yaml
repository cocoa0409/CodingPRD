            - "H3, starting one day later at 2026-07-01, promulgates to EFFECTIVE — a one-day gap is enough."
            - "W promulgates to EFFECTIVE despite spanning the whole year and intersecting both GB windows in time: WORLD is a separate specificity layer and does NOT collide with a concrete territory."
            - "Selection, exact territory first: the GB pool resolves to H1 (usage_end 2026-06-30 is inside H1's INCLUSIVE window, the window's very last day) with distributable_cents 999999; H3 is not selected because 2026-06-30 precedes its effective_from."
            - "Selection, WORLD fallback: the IE pool resolves to W with distributable_cents 857142 — identical pool inputs, a different rate layer, and therefore a different distributable amount."

  - rule_id: compensating_invariant
    instances:
      - name: royalty_pool_value_conservation
        grounds:
          - invariants.royalty_pool_value_conservation
          - state_machines.RightsRegistration.UNDER_REVIEW_to_APPROVED
          - state_machines.RightsRegistration.APPROVED_to_DISPUTED
        distinguishing_aspect: |
          matched_attributed_cents + holding_cents + rounding_residual_cents must equal
          distributable_cents at every observation point, and the dispute transition must move
          exactly the 99999 cents that the approve transition moved, in the opposite direction,
          leaving distributable_cents 999999 and rounding_residual_cents 2 bit-identical — a
          re-derivation that recomputed the residual instead of preserving it would drift.
        test_recipe:
          setup:
            - "The canonical GB/INDIVIDUAL fixture with the third line UNMATCHED at confidence 5000; the pool is CALCULATED (not finalized) so both directions re-run attribution."
            - "A MASTER registration over the 'Neon Ledger' recording by a LABEL holder in UNDER_REVIEW, plus a second LABEL holder that will raise the dispute."
