            - *k_entry_0401
            - call: "POST /hour-entries/${e1}/void"
              payload: {}
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { sv_void: $.data.submission_version }
          trigger:
            - call: "POST /hour-entries/${e1}/void"
              payload: {}
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
          assert:
            - "response code is 409 with data.error_id == ERR_HOUR_ENTRY_VOIDED"
            - "HourEntry.${e1}.entry_status == VOID and version is unchanged by the refused second call"
            - "QuarterlySubmission.${sub}.version == ${sv_void}, proving the refused call applied no side effect"
            - "QuarterlySubmission.${sub}.total_raw_hours == 0.00"

      - name: census_day_disputed_then_patched_and_reconciled_again
        claim_type: valid_transition
        grounds:
          - state_machines.CensusDay.REPORTED_to_DISPUTED
          - state_machines.CensusDay.DISPUTED_to_RECONCILED
          - endpoints[PATCH /census-days/{id}]
        distinguishing_aspect: "Cyclic shape on CensusDay: a DISPUTED day is corrected through PATCH and re-reconciled to RECONCILED, and the CENSUS_VARIANCE finding raised on the first reconcile is resolved rather than duplicated."
        test_recipe:
          setup:
            - "A DRAFT submission with a census day for 2026-04-01 at resident_count 110 against mds 100, already reconciled once and therefore DISPUTED with variance_pct 0.1000"
          setup_api_calls:
            - *k_fac
            - *k_per
            - *k_jc_rn
            - *k_jc_split
            - *k_jc_admin
            - *k_w_coord
            - *k_w_admin
            - *k_w_rn
            - *k_sub
            - call: "POST /census-days"
              payload: { submission_id: "${sub}", census_date: "2026-04-01", resident_count: 110, mds_resident_count: 100 }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { cd: $.data.id }
            - call: "POST /census-days/${cd}/reconcile"
              payload: {}
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
          trigger:
            - call: "PATCH /census-days/${cd}"
              payload: { resident_count: 100 }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
            - call: "POST /census-days/${cd}/reconcile"
              payload: {}
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
          assert:
            - "before the patch, CensusDay.${cd}.status == DISPUTED with variance_pct == 0.1000"
            - "after the patch and re-reconcile, CensusDay.${cd}.resident_count == 100, variance_pct == 0.0000, status == RECONCILED"
            - "GET /submissions/${sub}/findings with code CENSUS_VARIANCE returns exactly 1 row, now with status RESOLVED"
            - "QuarterlySubmission.${sub}.total_resident_days == 100"

      - name: hour_entry_unsupported_then_supported_resolves_finding
        claim_type: valid_transition
        grounds:
          - state_machines.HourEntry.UNVERIFIED_to_UNSUPPORTED
          - state_machines.HourEntry.UNSUPPORTED_to_SUPPORTED
          - endpoints[POST /hour-entries/{id}/verify]
        distinguishing_aspect: "The verification dimension is re-enterable: an UNSUPPORTED verdict raises an UNSUPPORTED_HOURS warning, and a later SUPPORTED verdict on the same entry resolves that finding and drops open_warning_finding_count back."
        test_recipe:
          setup:
            - "A DRAFT submission with one payroll-supported 8.00-hour RN shift on 2026-04-01 in verification_status UNVERIFIED"
          setup_api_calls:
            - *k_fac
            - *k_per
            - *k_jc_rn
            - *k_jc_split
            - *k_jc_admin
            - *k_w_coord
            - *k_w_admin
            - *k_w_rn
            - *k_sub
            - *k_pr_0401
            - *k_entry_0401
            - *k_census_0401
          trigger:
            - call: "POST /hour-entries/${e1}/verify"
              payload: { outcome: "UNSUPPORTED" }
              as: StateAuditor
              as_user_id: "auditor-verify-01"
            - call: "POST /hour-entries/${e1}/verify"
              payload: { outcome: "SUPPORTED" }
              as: StateAuditor
              as_user_id: "auditor-verify-02"
          assert:
            - "after the first verify: HourEntry.${e1}.verification_status == UNSUPPORTED, verified_by_user_id == auditor-verify-01, and GET /submissions/${sub}/findings with code UNSUPPORTED_HOURS returns 1 OPEN row"
            - "after the second verify: HourEntry.${e1}.verification_status == SUPPORTED and verified_by_user_id == auditor-verify-02"
            - "the UNSUPPORTED_HOURS finding is now status RESOLVED and QuarterlySubmission.${sub}.open_warning_finding_count no longer counts it"
            - "HourEntry.${e1}.entry_status == ACTIVE throughout, since the two dimensions are independent"

      - name: verify_supported_without_payroll_record_rejected
        claim_type: precondition_enforcement
        grounds:
          - validations[priority 20 ERR_SUPPORT_DOCUMENT_MISSING]
          - state_machines.HourEntry.UNVERIFIED_to_SUPPORTED
        distinguishing_aspect: "A SUPPORTED verdict requires payroll_record_id to be non-null on the entry; the audit-readiness claim that every reported hour is backed by payroll is enforced at the transition, not merely reported as a warning."
        test_recipe:
          setup:
            - "A DRAFT submission with one 8.00-hour RN shift on 2026-04-02 created without payroll_record_id"
          setup_api_calls:
            - *k_fac
            - *k_per
            - *k_jc_rn
            - *k_jc_split
            - *k_jc_admin
            - *k_w_coord
            - *k_w_admin
            - *k_w_rn
            - *k_sub
            - call: "POST /hour-entries"
              payload: { submission_id: "${sub}", worker_id: "${w_rn}", job_category_id: "${jc_rn}", work_date: "2026-04-02", shift_start: "07:00", shift_end: "15:00", allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }], expected_submission_version: "${sv}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { e_ns: $.data.id }
          trigger:
            - call: "POST /hour-entries/${e_ns}/verify"
              payload: { outcome: "SUPPORTED" }
              as: StateAuditor
              as_user_id: "auditor-verify-01"
          assert:
            - "response code is 409 with data.error_id == ERR_SUPPORT_DOCUMENT_MISSING"
            - "HourEntry.${e_ns}.verification_status is still UNVERIFIED with verified_by_user_id == null"
            - "the same call with outcome UNSUPPORTED would be permitted, since the precondition applies only to the SUPPORTED verdict"

      - name: staffing_measure_publication_and_audit_dimensions_move_independently
        claim_type: valid_transition
        grounds:
          - state_machines.StaffingMeasure.PROVISIONAL_to_PUBLISHED
          - state_machines.StaffingMeasure.NOT_AUDITED_to_UNDER_AUDIT
          - state_machines.StaffingMeasure.UNDER_AUDIT_to_AUDIT_CONFIRMED
        distinguishing_aspect: "Parallel dimensions: publishing changes publication_status while audit_status stays NOT_AUDITED, and the later case-driven UNDER_AUDIT then AUDIT_CONFIRMED moves leave publication_status PUBLISHED and the rating untouched."
        test_recipe:
          setup:
            - "An ACCEPTED 2026Q2 submission with one SUPPORTED 8.00-hour RN shift and one RECONCILED census day of resident_count 5"
            - "A StaffingMeasure computed and published for that submission"
            - "A DiscrepancyCase naming that measure, walked to UNDER_REVIEW so the measure entered UNDER_AUDIT"
          setup_api_calls:
            - *k_fac
            - *k_per
            - *k_jc_rn
            - *k_jc_split
            - *k_jc_admin
            - *k_w_coord
            - *k_w_admin
            - *k_w_rn
            - *k_sub
            - *k_pr_0401
            - *k_entry_0401
            - *k_census_0401
            - *k_reconcile_c1
            - *k_verify_e1
            - *k_validate
            - *k_submit
            - *k_accept
            - &k_measure
              call: "POST /staffing-measures"
              payload: { submission_id: "${sub}" }
              as: CmsPublisher
              as_user_id: "publisher-01"
              captures: { meas: $.data.id, mver: $.data.version }
            - &k_publish
              call: "POST /staffing-measures/${meas}/publish"
              payload: {}
              as: CmsPublisher
              as_user_id: "publisher-01"
              captures: { mver2: $.data.version }
            - &k_case
              call: "POST /discrepancy-cases"
              payload: { facility_id: "${fac}", submission_id: "${sub}", staffing_measure_id: "${meas}", trigger_reason: "PUBLIC_COMPLAINT", detail: "Complaint alleges overstated night-shift RN coverage." }
              as: StateAuditor
              as_user_id: "auditor-case-01"
              captures: { case: $.data.id }
            - &k_request_info
              call: "POST /discrepancy-cases/${case}/request-info"
              payload: { request_note: "Provide the 2026-04-01 nurse assignment sheet." }
              as: StateAuditor
              as_user_id: "auditor-case-01"
            - &k_respond
              call: "POST /discrepancy-cases/${case}/respond"
              payload: { response_note: "Assignment sheet attached; coverage as reported." }
              as: FacilityAdministrator
              as_user_id: "${w_admin}"
          trigger:
            - call: "POST /discrepancy-cases/${case}/dismiss"
              payload: { resolution_note: "Assignment sheet matches the reported hours." }
              as: StateAuditor
              as_user_id: "auditor-case-01"
          assert:
            - "before the dismiss, StaffingMeasure.${meas}.publication_status == PUBLISHED and audit_status == UNDER_AUDIT"
            - "after the dismiss, StaffingMeasure.${meas}.audit_status == AUDIT_CONFIRMED and publication_status is still PUBLISHED"
            - "StaffingMeasure.${meas}.measure_variant is still AS_SUBMITTED with total_nurse_hprd == 1.6000 unchanged"
            - "DiscrepancyCase.${case}.status == DISMISSED and Facility.${fac}.posture == REPORTING_OPEN with substantiated_case_count == 0"

      - name: vendor_batch_reject_then_resubmit_clears_rejection_reason
        claim_type: valid_transition
        grounds:
          - state_machines.VendorHourSubmission.SUBMITTED_to_REJECTED
          - state_machines.VendorHourSubmission.REJECTED_to_SUBMITTED
        distinguishing_aspect: "Cyclic shape on VendorHourSubmission: rejecting stores a rejection_reason and the re-submit from REJECTED clears it and re-stamps submitted_at, so the loop is observable in the fields rather than only in the status."
        test_recipe:
          setup:
