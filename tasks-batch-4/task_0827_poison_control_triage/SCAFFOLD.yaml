scenario: "Poison Control & Toxicology Triage: call intake & exposure (substance/dose/route), risk assessment & protocol, home-management vs ED referral, scheduled follow-up calls, healthcare-facility consult, NPDS surveillance & reporting, interpreter, documentation"
domain_name: "poison-control-triage"
api_prefix: "/"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_actions
    - optimistic_concurrency
  entity_topology: hybrid
  # ExposureCase is the aggregate root (tree over Exposure/RiskAssessment/Disposition/
  # FollowUpCall/CaseNote), with cross-cutting flat references to config entities
  # (Substance, HealthcareFacility, Protocol, Specialist) and peer resources
  # (FacilityConsult, NpdsReport).
  state_machine_shape: branching
  # ExposureCase branches TRIAGED->{MONITORING,REFERRED} and cycles
  # MONITORING->RETRIAGE->MONITORING; FollowUpCall cycles SCHEDULED->ATTEMPTED->SCHEDULED.
  relationship_patterns:
    - one_to_many          # ExposureCase -> Exposure / FollowUpCall / CaseNote
    - flat_reference        # Exposure.substance_id, RiskAssessment.protocol_id, etc.
    - cross_aggregate       # FacilityConsult / NpdsReport reference ExposureCase from outside the tree
  role_model: hierarchical_override
  # Toxicologist is a clinical superset of Specialist (finalize severe assessments,
  # order facility consults, override safety blocks); SystemAdmin owns config;
  # SurveillanceOfficer owns NPDS reporting.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Substance
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Substance / product name (e.g. acetaminophen)"
      - name: category
        type: enum
        source: input
        description: "Toxicologic class"
        constraints: "one of {ANALGESIC, HOUSEHOLD_CHEMICAL, PESTICIDE, PLANT, PHARMACEUTICAL, HYDROCARBON, HEAVY_METAL}"
      - name: toxic_dose_mg_per_kg
        type: number
        source: input
        description: "Reference toxic dose in mg per kg body weight; denominator of the dose-ratio calc"
        constraints: "> 0"
      - name: onset_hours
        type: number
        source: input
        description: "Expected symptom onset window in hours; drives the time-attenuation factor"
        constraints: "> 0"
      - name: reference_route
        type: enum
        source: input
        description: "Canonical exposure route for the reference dose"
        constraints: "one of {INGESTION, INHALATION, DERMAL, OCULAR, INJECTION}"
      - name: aggregate_case_count
        type: integer
        source: computed
        description: "Surveillance counter: number of SUBMITTED NpdsReport rows whose primary_substance_id equals this substance's id. Incremented on report submit, decremented on retract."
        default: 0
  - name: HealthcareFacility
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Facility name"
      - name: facility_type
        type: enum
        source: input
        description: "Facility category"
        constraints: "one of {ED, URGENT_CARE, ICU, CLINIC}"
      - name: status
        type: enum
        source: input
        description: "Consult-acceptance posture"
        default: ACCEPTING
        constraints: "one of {ACCEPTING, DIVERTING, OFFLINE}"
      - name: consult_capacity
        type: integer
        source: input
        description: "Maximum simultaneous ACTIVE FacilityConsult rows this facility may hold"
        constraints: ">= 1"
      - name: active_consult_count
        type: integer
        source: computed
        description: "Number of FacilityConsult rows in ACTIVE state referencing this facility. Incremented on consult create, decremented on close/cancel."
        default: 0
  - name: Protocol
    parent: null
    common_fields: true
    fields:
      - name: risk_tier
        type: enum
        source: input
        description: "Risk tier this protocol applies to"
        constraints: "one of {MINIMAL, MODERATE, SEVERE, CRITICAL}"
      - name: management_setting
        type: enum
        source: input
        description: "Care setting the protocol prescribes"
        constraints: "one of {HOME, ED}"
      - name: followup_count
        type: integer
        source: input
        description: "Number of scheduled follow-up calls generated when this protocol is applied under HOME management"
        constraints: ">= 0"
      - name: followup_interval_hours
        type: number
        source: input
        description: "Hours between consecutive scheduled follow-up calls"
        constraints: "> 0"
      - name: requires_toxicologist
        type: boolean
        source: input
        description: "If true, a RiskAssessment on this tier may only be FINALIZED by a Toxicologist"
        default: false
  - name: Specialist
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Poison-information specialist name"
      - name: credential
        type: enum
        source: input
        description: "Certification level; TOXICOLOGIST credential is required behind the Toxicologist role"
        constraints: "one of {SPI, TOXICOLOGIST}"
      - name: certification_active
        type: boolean
        source: input
        description: "Whether the specialist may currently act on cases"
        default: true
  - name: ExposureCase
    parent: null
    common_fields: true
    fields:
      - name: patient_age_years
        type: number
        source: input
        description: "Patient age in years"
        constraints: ">= 0"
      - name: patient_weight_kg
        type: number
        source: input
        description: "Patient weight in kg; per-kg denominator for the toxicity calc"
        constraints: "> 0"
      - name: patient_sex
        type: enum
        source: input
        description: "Patient sex"
        constraints: "one of {MALE, FEMALE, UNKNOWN}"
      - name: chief_complaint
        type: string
        source: input
        description: "Free-text presenting complaint"
      - name: interpreter_required
        type: boolean
        source: input
        description: "Whether a language interpreter was engaged on the call"
        default: false
      - name: interpreter_language
        type: string
        source: input
        description: "ISO language code of interpreter (e.g. es, zh); required when interpreter_required is true"
        default: null
      - name: intake_specialist_id
        type: string
        source: system
        description: "FK -> Specialist.id; set from X-User-ID of the Specialist who created the case"
      - name: status
        type: enum
        source: computed
        description: "Case lifecycle state"
        default: INTAKE
        constraints: "one of {INTAKE, TRIAGED, MONITORING, REFERRED, RETRIAGE, RESOLVED, CLOSED}"
      - name: risk_tier
        type: enum
        source: computed
        description: "Mirror of the case's active (non-SUPERSEDED) RiskAssessment.risk_tier; null until an assessment exists"
        default: null
        constraints: "one of {MINIMAL, MODERATE, SEVERE, CRITICAL} or null"
      - name: pending_followup_count
        type: integer
        source: computed
        description: "Count of this case's FollowUpCall rows in SCHEDULED or ATTEMPTED state"
        default: 0
      - name: resolved_at
        type: datetime
        source: computed
        description: "Logical-clock timestamp when the case entered RESOLVED; null otherwise"
        default: null
  - name: Exposure
    parent: ExposureCase
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: system
        description: "FK -> ExposureCase.id; owning case (from path)"
      - name: substance_id
        type: string
        source: input
        description: "FK -> Substance.id; the substance involved"
      - name: route
        type: enum
        source: input
        description: "Route of exposure; selects the bioavailability factor"
        constraints: "one of {INGESTION, INHALATION, DERMAL, OCULAR, INJECTION}"
      - name: dose_range_low_mg
        type: number
        source: input
        description: "Lower bound of the reported ingested/absorbed dose in mg"
        constraints: ">= 0"
      - name: dose_range_high_mg
        type: number
        source: input
        description: "Upper bound of the reported dose in mg; used by the ESTIMATED toxicity variant"
        constraints: ">= dose_range_low_mg"
      - name: time_since_exposure_hours
        type: number
        source: input
        description: "Hours elapsed since exposure; drives the time-attenuation factor"
        constraints: ">= 0"
      - name: confirmed_dose_mg
        type: number
        source: system
        description: "Lab/facility-confirmed dose in mg, written by facility-consult close; null until confirmed. Used by the CONFIRMED toxicity variant."
        default: null
      - name: identified
        type: boolean
        source: computed
        description: "True once substance_id resolves to a Substance; triage requires all exposures identified"
        default: true
      - name: toxicity_score
        type: number
        source: computed
        description: "Two-decimal toxicity score (see exposure_toxicity_score); reflects CONFIRMED variant once confirmed_dose_mg is set, else ESTIMATED"
        default: 0
      - name: severity_band
        type: enum
        source: computed
        description: "Band of toxicity_score"
        constraints: "one of {MINIMAL, MODERATE, SEVERE, CRITICAL}"
  - name: RiskAssessment
    parent: ExposureCase
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: system
        description: "FK -> ExposureCase.id; owning case (from path)"
      - name: protocol_id
        type: string
        source: computed
        description: "FK -> Protocol.id; protocol selected by protocol_selection for this assessment's risk_tier; null if no protocol matches"
        default: null
      - name: aggregate_score_max
        type: number
        source: computed
        description: "MAX variant of case_aggregate_risk; drives risk_tier and disposition"
      - name: aggregate_score_additive
        type: number
        source: computed
        description: "ADDITIVE variant of case_aggregate_risk (co-ingestant weighted); drives NPDS medical outcome"
      - name: risk_tier
        type: enum
        source: computed
        description: "Band of aggregate_score_max"
        constraints: "one of {MINIMAL, MODERATE, SEVERE, CRITICAL}"
      - name: status
        type: enum
        source: computed
        description: "Assessment lifecycle"
        default: COMPLETED
        constraints: "one of {COMPLETED, FINALIZED, SUPERSEDED}"
  - name: Disposition
    parent: ExposureCase
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: system
        description: "FK -> ExposureCase.id; owning case (from path)"
      - name: risk_assessment_id
        type: string
        source: input
        description: "FK -> RiskAssessment.id; the FINALIZED assessment this disposition is based on"
      - name: disposition_type
        type: enum
        source: input
        description: "Care-setting decision"
        constraints: "one of {HOME_MANAGEMENT, ED_REFERRAL}"
      - name: facility_id
        type: string
        source: input
        description: "FK -> HealthcareFacility.id; referral target; required for ED_REFERRAL, must be null for HOME_MANAGEMENT"
        default: null
      - name: status
        type: enum
        source: computed
        description: "Disposition lifecycle"
        default: ACTIVE
        constraints: "one of {ACTIVE, SUPERSEDED}"
  - name: FollowUpCall
    parent: ExposureCase
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: system
        description: "FK -> ExposureCase.id; owning case (from path)"
      - name: assigned_specialist_id
        type: string
        source: input
        description: "FK -> Specialist.id; specialist responsible for placing the call; overlap of this specialist's calls is buffered"
      - name: sequence_index
        type: integer
        source: input
        description: "Ordinal of the call within the case's follow-up plan (0-based)"
        constraints: ">= 0"
      - name: scheduled_start
        type: datetime
        source: input
        description: "Logical-clock start of the scheduled call window"
      - name: scheduled_end
        type: datetime
        source: input
        description: "Logical-clock end of the scheduled call window; must be > scheduled_start"
      - name: attempt_count
        type: integer
        source: computed
        description: "Number of placement attempts made"
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Call lifecycle"
        default: SCHEDULED
        constraints: "one of {SCHEDULED, ATTEMPTED, COMPLETED, CANCELLED}"
      - name: outcome
        type: enum
        source: computed
        description: "Clinical outcome recorded at completion; null until COMPLETED"
        default: null
        constraints: "one of {RESOLVED, WORSENED, LOST_TO_FOLLOWUP} or null"
  - name: FacilityConsult
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> ExposureCase.id; case being consulted on"
      - name: facility_id
        type: string
        source: input
        description: "FK -> HealthcareFacility.id; consulting facility"
      - name: requesting_specialist_id
        type: string
        source: system
        description: "FK -> Specialist.id; set from X-User-ID of the Toxicologist who opened the consult"
      - name: consult_duration_minutes
        type: number
        source: input
        description: "Billed consult duration in minutes; input to consult_billing_units"
        constraints: "> 0"
      - name: confirmed_dose_mg
        type: number
        source: input
        description: "Facility-confirmed dose in mg supplied at close; propagated to the case's exposures"
        default: null
      - name: billing_units
        type: number
        source: computed
        description: "Two-decimal net billing units (see consult_billing_units); computed at close"
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Consult lifecycle"
        default: ACTIVE
        constraints: "one of {ACTIVE, CLOSED, CANCELLED}"
  - name: NpdsReport
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> ExposureCase.id; case being reported to NPDS surveillance"
      - name: primary_substance_id
        type: string
        source: input
        description: "FK -> Substance.id; the substance credited in surveillance counters"
      - name: medical_outcome
        type: enum
        source: computed
        description: "NPDS medical outcome derived from the case's active RiskAssessment.aggregate_score_additive"
        constraints: "one of {MINOR, MODERATE, MAJOR}"
      - name: report_status
        type: enum
        source: computed
        description: "Report lifecycle"
        default: SUBMITTED
        constraints: "one of {SUBMITTED, RETRACTED}"
      - name: reported_at
        type: datetime
        source: computed
        description: "Logical-clock timestamp of submission"
  - name: CaseNote
    parent: ExposureCase
    common_fields: false
    fields:
      - name: case_id
        type: string
        source: system
        description: "FK -> ExposureCase.id; owning case (from path)"
      - name: author_ref
        type: string
        source: system
        description: "X-User-ID of the note author (opaque or Specialist id); documentation attribution only, never a business decision input"
      - name: note_type
        type: enum
        source: input
        description: "Documentation category"
        constraints: "one of {INTAKE, CLINICAL, INTERPRETER, DISPOSITION, FOLLOWUP}"
      - name: body
        type: string
        source: input
        description: "Free-text note body"

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: ExposureCase
    initial_state: INTAKE
    terminal_states: [CLOSED]
    transitions:
      - from: INTAKE
        to: TRIAGED
        trigger: "POST /exposure-cases/{id}/triage"
        actor: Specialist
        preconditions:
          - "case has >= 1 Exposure (empty exposure set rejected)"
          - "every Exposure.identified == true"
        side_effects:
          - "no field mutations beyond status; enables risk assessment creation"
      - from: TRIAGED
        to: MONITORING
        trigger: "POST /exposure-cases/{id}/dispositions with disposition_type=HOME_MANAGEMENT"
        actor: Specialist
        preconditions:
          - "referenced RiskAssessment.status == FINALIZED"
          - "RiskAssessment.risk_tier IN {MINIMAL, MODERATE} (home management safety gate)"
        side_effects:
          - "Disposition created with status ACTIVE"
          - "followup_schedule runs: creates protocol.followup_count FollowUpCall rows (cascade)"
          - "case.pending_followup_count set to number of scheduled calls"
      - from: TRIAGED
        to: REFERRED
        trigger: "POST /exposure-cases/{id}/dispositions with disposition_type=ED_REFERRAL"
        actor: Specialist
        preconditions:
          - "referenced RiskAssessment.status == FINALIZED"
          - "facility_id references a HealthcareFacility"
        side_effects:
          - "Disposition created with status ACTIVE; case awaits FacilityConsult"
      - from: MONITORING
        to: RETRIAGE
        trigger: "POST /exposure-cases/{id}/exposures (adding a new exposure to a monitoring case)"
        actor: Specialist
        preconditions:
          - "case.status == MONITORING"
        side_effects:
          - "the case's active RiskAssessment transitions COMPLETED/FINALIZED -> SUPERSEDED"
          - "active Disposition transitions ACTIVE -> SUPERSEDED"
        note: "cyclic edge; case must be re-assessed and re-dispositioned"
      - from: RETRIAGE
        to: MONITORING
        trigger: "POST /exposure-cases/{id}/dispositions with disposition_type=HOME_MANAGEMENT"
        actor: Specialist
        preconditions:
          - "a new FINALIZED RiskAssessment exists with risk_tier IN {MINIMAL, MODERATE}"
        side_effects:
          - "new Disposition ACTIVE; followup_schedule re-runs"
      - from: RETRIAGE
        to: REFERRED
        trigger: "POST /exposure-cases/{id}/dispositions with disposition_type=ED_REFERRAL"
        actor: Specialist
        preconditions:
          - "a new FINALIZED RiskAssessment exists"
        side_effects:
          - "new Disposition ACTIVE"
      - from: MONITORING
        to: RESOLVED
        trigger: "system: bubble-up when a FollowUpCall completes with outcome=RESOLVED and all FollowUpCall rows are terminal (COMPLETED/CANCELLED) and none has outcome WORSENED"
        actor: system
        preconditions:
          - "every FollowUpCall for the case in {COMPLETED, CANCELLED}"
          - "no FollowUpCall.outcome == WORSENED"
        side_effects:
          - "case.resolved_at stamped with logical clock"
          - "the case's active RiskAssessment (if COMPLETED) transitions -> FINALIZED (cascade hop)"
      - from: REFERRED
        to: RESOLVED
        trigger: "system: on FacilityConsult close when no home follow-ups remain scheduled"
        actor: system
        preconditions:
          - "the case's FacilityConsult.status == CLOSED"
        side_effects:
          - "case.resolved_at stamped"
      - from: MONITORING
        to: REFERRED
        trigger: "system: cascade from FacilityConsult close that escalates the case's risk_tier to CRITICAL"
        actor: system
        preconditions:
          - "recomputed active RiskAssessment.risk_tier == CRITICAL"
        side_effects:
          - "active HOME_MANAGEMENT Disposition -> SUPERSEDED"
          - "all SCHEDULED/ATTEMPTED FollowUpCall rows -> CANCELLED (cascade)"
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /exposure-cases/{id}/close"
        actor: Specialist
        preconditions:
          - "case.status == RESOLVED"
        side_effects:
          - "no further transitions permitted"
      - from: REFERRED
        to: CLOSED
        trigger: "POST /exposure-cases/{id}/close"
        actor: Toxicologist
        preconditions:
          - "the case's FacilityConsult.status IN {CLOSED, CANCELLED}"
        side_effects:
          - "no further transitions permitted"
  - entity: RiskAssessment
    initial_state: COMPLETED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: COMPLETED
        to: FINALIZED
        trigger: "POST /risk-assessments/{id}/finalize"
        actor: Specialist | Toxicologist
        preconditions:
          - "assessment.status == COMPLETED"
          - "if selected Protocol.requires_toxicologist == true, actor role MUST be Toxicologist"
        side_effects:
          - "assessment locked for disposition; case.risk_tier mirror refreshed"
      - from: COMPLETED
        to: SUPERSEDED
        trigger: "system: a newer RiskAssessment is created for the same case, or the case is retriaged"
        actor: system
        preconditions:
          - "a newer RiskAssessment row now exists for case_id, OR case entered RETRIAGE"
        side_effects:
          - "prior assessment no longer the case's active assessment"
      - from: FINALIZED
        to: SUPERSEDED
        trigger: "system: case retriaged (new exposure added in MONITORING)"
        actor: system
        preconditions:
          - "case entered RETRIAGE"
        side_effects:
          - "case.risk_tier mirror cleared until re-assessment"
  - entity: FollowUpCall
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ATTEMPTED
        trigger: "POST /follow-up-calls/{id}/attempt"
        actor: Specialist
        preconditions:
          - "call.status == SCHEDULED"
          - "owning case.status NOT IN {CLOSED}"
        side_effects:
          - "attempt_count incremented by 1"
      - from: ATTEMPTED
        to: SCHEDULED
        trigger: "POST /follow-up-calls/{id}/complete with outcome=NO_ANSWER and attempt_count < 3"
        actor: Specialist
        preconditions:
          - "call.status == ATTEMPTED"
          - "call.attempt_count < 3"
        side_effects:
          - "scheduled_start/end pushed by FOLLOWUP_RETRY_INTERVAL_HOURS from current logical clock"
        note: "cyclic revert edge (SCHEDULED->ATTEMPTED->SCHEDULED)"
      - from: ATTEMPTED
        to: COMPLETED
        trigger: "POST /follow-up-calls/{id}/complete with outcome IN {RESOLVED, WORSENED}, or NO_ANSWER with attempt_count >= 3"
        actor: Specialist
        preconditions:
          - "call.status == ATTEMPTED"
        side_effects:
          - "outcome set (LOST_TO_FOLLOWUP when NO_ANSWER and attempt_count >= 3)"
          - "case.pending_followup_count decremented"
          - "if outcome==RESOLVED and all calls terminal: bubble up case -> RESOLVED (cascade)"
          - "if outcome==WORSENED: case -> RETRIAGE (active RiskAssessment/Disposition SUPERSEDED)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: cascade from case escalation to REFERRED or case close"
        actor: system
        preconditions:
          - "owning case escalated to REFERRED or closed"
        side_effects:
          - "case.pending_followup_count decremented"
      - from: ATTEMPTED
        to: CANCELLED
        trigger: "system: cascade from case escalation to REFERRED"
        actor: system
        preconditions:
          - "owning case escalated to REFERRED"
        side_effects:
          - "case.pending_followup_count decremented"
  - entity: FacilityConsult
    initial_state: ACTIVE
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /facility-consults/{id}/close"
        actor: Toxicologist
        preconditions:
          - "consult.status == ACTIVE"
          - "confirmed_dose_mg provided"
        side_effects:
          - "consult_billing_units computed into billing_units"
          - "facility.active_consult_count decremented by 1 (invariant)"
          - "each Exposure on the case gets confirmed_dose_mg set; toxicity_score recomputed to CONFIRMED variant (cascade hop 1)"
          - "the case's active RiskAssessment aggregate scores + risk_tier recomputed (cascade hop 2)"
          - "if risk_tier escalates to CRITICAL, case MONITORING -> REFERRED and follow-ups CANCELLED (cascade hop 3)"
      - from: ACTIVE
        to: CANCELLED
        trigger: "system/Toxicologist: consult withdrawn before completion"
        actor: Toxicologist
        preconditions:
          - "consult.status == ACTIVE"
        side_effects:
          - "facility.active_consult_count decremented by 1 (invariant)"
  - entity: NpdsReport
    initial_state: SUBMITTED
    terminal_states: [RETRACTED]
    transitions:
      - from: SUBMITTED
        to: RETRACTED
        trigger: "POST /npds-reports/{id}/retract"
        actor: SurveillanceOfficer
        preconditions:
          - "report.report_status == SUBMITTED"
        side_effects:
          - "Substance.aggregate_case_count for primary_substance_id decremented by 1 (compensating invariant)"

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: risk-assessment-create-stale-case
    parent_entity: ExposureCase
    write_endpoint: "POST /exposure-cases/{id}/risk-assessments"
    occ_field: "expected_case_version"
    description: |
      Creating a RiskAssessment against an ExposureCase whose version has
      advanced since the client last observed it is rejected. A newly created
      assessment legitimately supersedes the prior active assessment; if another
      writer has already created a superseding assessment (or added an exposure)
      the current writer's view of the case is stale and the create is refused.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: exposure_toxicity_score
    trigger: "on POST /exposure-cases/{id}/exposures (ESTIMATED variant); recomputed to CONFIRMED variant on FacilityConsult close"
    algorithm: threshold
    formula: |
      bioavail   = ROUTE_BIOAVAILABILITY[route]
      dose_mg    = (confirmed_dose_mg if confirmed_dose_mg is not null else dose_range_high_mg)
      eff_dose   = dose_mg * bioavail
      dose_per_kg = eff_dose / case.patient_weight_kg
      dose_ratio = dose_per_kg / substance.toxic_dose_mg_per_kg
      onset      = substance.onset_hours
      if time_since_exposure_hours <= onset:
          time_factor = 1.0
      else:
          time_factor = max(0.5, 1.0 - 0.1 * floor((time_since_exposure_hours - onset) / onset))
      toxicity_score = round(dose_ratio * time_factor, 2)   # round_half_up, 2 dp
      severity_band =
          MINIMAL   if toxicity_score < 0.25
          MODERATE  if 0.25 <= toxicity_score < 0.75
          SEVERE    if 0.75 <= toxicity_score < 1.5
          CRITICAL  if toxicity_score >= 1.5
    input_set: "the single Exposure row; pulls case.patient_weight_kg and the referenced Substance"
    constants:
      ROUTE_BIOAVAILABILITY: { INGESTION: 1.0, INHALATION: 0.8, DERMAL: 0.4, OCULAR: 0.3, INJECTION: 1.0 }
    precision: "2 decimal places, round_half_up"
    variants:
      - name: ESTIMATED
        when: "at exposure creation, before any facility confirmation (confirmed_dose_mg is null)"
        difference: "dose_mg = dose_range_high_mg (worst-case upper bound of the reported range)"
      - name: CONFIRMED
        when: "after a FacilityConsult closes with confirmed_dose_mg"
        difference: "dose_mg = confirmed_dose_mg (lab-verified); typically diverges from the ESTIMATED score"
  - name: case_aggregate_risk
    trigger: "on RiskAssessment create; recomputed on FacilityConsult close cascade"
    algorithm: weighted_scoring
    formula: |
      scores = [ e.toxicity_score for e in case Exposures ]   # current variant per exposure
      # --- MAX variant ---
      aggregate_score_max = max(scores)                        # empty set impossible (triage requires >=1)
      risk_tier = band(aggregate_score_max)                    # same bands as exposure severity_band
      # --- ADDITIVE variant (co-ingestant weighted) ---
      # round each per-exposure contribution to 2 dp FIRST, then sum, then round product (pinned order)
      contrib = [ round(e.toxicity_score * INTERACTION_WEIGHT[band(e.toxicity_score)], 2) for e in Exposures ]
      co_ingestant_multiplier = 1.15 if count(e.toxicity_score >= 0.25) >= 2 else 1.00
      aggregate_score_additive = round(sum(contrib) * co_ingestant_multiplier, 2)
    input_set: "all Exposure rows of the case (every state; exposures are never soft-deleted)"
    constants:
      INTERACTION_WEIGHT: { MINIMAL: 0.5, MODERATE: 1.0, SEVERE: 1.25, CRITICAL: 1.5 }
      CO_INGESTANT_MULTIPLIER: 1.15
      CO_INGESTANT_THRESHOLD_COUNT: 2
    precision: "2 decimal places, round_half_up; per-exposure contribution rounded BEFORE summation"
    variants:
      - name: MAX
        when: "used to set risk_tier and drive disposition/protocol selection"
        difference: "max over exposure scores; ignores co-ingestant interaction"
      - name: ADDITIVE
        when: "used to derive the NPDS medical_outcome"
        difference: "weighted sum with co-ingestant multiplier; diverges from MAX whenever >1 exposure contributes"
  - name: protocol_selection
    trigger: "on RiskAssessment create, after risk_tier is known"
    algorithm: aggregation
    formula: |
      candidates = [ p for p in Protocol if p.risk_tier == assessment.risk_tier ]
      if candidates is empty: protocol_id = null   # ERR_NO_PROTOCOL raised at finalize if still null
      else: protocol_id = (candidates sorted by created_at ASC)[0].id
    input_set: "all Protocol config rows whose risk_tier equals the assessment's risk_tier"
    constants: {}
    precision: "n/a"
  - name: followup_schedule
    trigger: "on Disposition create with disposition_type=HOME_MANAGEMENT"
    algorithm: projection
    formula: |
      n        = selected Protocol.followup_count
      interval = selected Protocol.followup_interval_hours
      now      = logical clock
      for i in 0 .. n-1:
          start_i = now + (i + 1) * interval hours
          end_i   = start_i + FOLLOWUP_WINDOW_MINUTES minutes
          create FollowUpCall(sequence_index=i, scheduled_start=start_i, scheduled_end=end_i,
                              assigned_specialist_id = case.intake_specialist_id, status=SCHEDULED)
    input_set: "the selected Protocol of the active FINALIZED RiskAssessment"
    constants:
      FOLLOWUP_WINDOW_MINUTES: 30
      FOLLOWUP_RETRY_INTERVAL_HOURS: 6
      FOLLOWUP_SPECIALIST_BUFFER_MINUTES: 15
    precision: "n/a"
  - name: consult_billing_units
    trigger: "on POST /facility-consults/{id}/close"
    algorithm: tiered_pricing
    formula: |
      # Circular-looking: the volume discount is keyed on gross units, and net = gross*(1-discount).
      # Evaluation order is PINNED: compute gross first, key the discount on GROSS (pre-discount),
      # then compute net. specialist_units rate is keyed on the case's active risk_tier (independent).
      specialist_units = round(SPECIALIST_RATE_UNITS[case.risk_tier] * consult_duration_minutes / 60, 2)
      gross_units      = round(CONSULT_BASE_UNITS + specialist_units, 2)
      discount_pct     = 0.00 if gross_units < 5 else (0.10 if gross_units < 10 else 0.20)
      billing_units    = round(gross_units * (1 - discount_pct), 2)
    input_set: "the single FacilityConsult and its case's active RiskAssessment.risk_tier"
    constants:
      CONSULT_BASE_UNITS: 2
      SPECIALIST_RATE_UNITS: { MINIMAL: 1, MODERATE: 2, SEVERE: 3, CRITICAL: 4 }
      DISCOUNT_TIER_1_THRESHOLD: 5
      DISCOUNT_TIER_2_THRESHOLD: 10
    precision: "2 decimal places, round_half_up; discount keyed on GROSS units"
  - name: npds_medical_outcome
    trigger: "on POST /npds-reports"
    algorithm: threshold
    formula: |
      add = case active RiskAssessment.aggregate_score_additive
      medical_outcome =
          MINOR     if add < 0.5
          MODERATE  if 0.5 <= add < 1.5
          MAJOR     if add >= 1.5
    input_set: "the case's active (non-SUPERSEDED) RiskAssessment"
    constants:
      OUTCOME_MODERATE_THRESHOLD: 0.5
      OUTCOME_MAJOR_THRESHOLD: 1.5
    precision: "n/a"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /_clock/set_current_utc when unauthenticated is disallowed too"
  - priority: 2
    category: auth
    check: "role is permitted for the operation per §1.7 RBAC"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "path-referenced resources exist, validated left-to-right (case, then sub-resource)"
    error_id: ERR_CASE_NOT_FOUND
    http_status: 404
    applies_to: "all /exposure-cases/{id}/* and nested id lookups"
  - priority: 3
    category: existence
    check: "sub-resource id in path exists (exposure/risk-assessment/follow-up-call/consult/npds-report)"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "GET/POST on /exposures/{id}, /risk-assessments/{id}, /follow-up-calls/{id}, /facility-consults/{id}, /npds-reports/{id}, /dispositions/{id}"
  - priority: 4
    category: existence
    check: "referenced FK body resource exists (substance_id, facility_id, protocol match, risk_assessment_id, primary_substance_id)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /exposures, POST /dispositions, POST /facility-consults, POST /npds-reports"
  - priority: 5
    category: state
    check: "target entity is in a state that permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-changing endpoints (triage, dispositions, finalize, attempt, complete, close, retract)"
  - priority: 6
    category: business_constraint
    check: "triage requires the case to have >= 1 Exposure"
    error_id: ERR_NO_EXPOSURES
    http_status: 422
    applies_to: "POST /exposure-cases/{id}/triage"
  - priority: 7
    category: business_safety
    check: "HOME_MANAGEMENT disposition allowed only when RiskAssessment.risk_tier IN {MINIMAL, MODERATE}"
    error_id: ERR_UNSAFE_DISPOSITION
    http_status: 422
    applies_to: "POST /exposure-cases/{id}/dispositions"
  - priority: 8
    category: business_safety
    check: "finalizing a RiskAssessment whose selected Protocol.requires_toxicologist==true (SEVERE/CRITICAL tiers) requires the Toxicologist role"
    error_id: ERR_TOXICOLOGIST_REQUIRED
    http_status: 403
    applies_to: "POST /risk-assessments/{id}/finalize"
  - priority: 9
    category: business_referential
    check: "disposition of type ED_REFERRAL requires facility_id; HOME_MANAGEMENT requires facility_id to be null"
    error_id: ERR_DISPOSITION_FACILITY_MISMATCH
    http_status: 422
    applies_to: "POST /exposure-cases/{id}/dispositions"
  - priority: 10
    category: business_referential
    check: "FacilityConsult create requires the referenced HealthcareFacility.status == ACCEPTING"
    error_id: ERR_FACILITY_NOT_ACCEPTING
    http_status: 409
    applies_to: "POST /facility-consults"
  - priority: 11
    category: business_constraint
    check: "FacilityConsult create requires facility.active_consult_count < facility.consult_capacity"
    error_id: ERR_FACILITY_AT_CAPACITY
    http_status: 409
    applies_to: "POST /facility-consults"
  - priority: 12
    category: business_temporal
    check: "a new FollowUpCall for a case must not overlap (half-open [start,end)) any existing SCHEDULED/ATTEMPTED FollowUpCall of the same case; adjacency (end==start) allowed"
    error_id: ERR_FOLLOWUP_OVERLAP
    http_status: 409
    applies_to: "POST /exposure-cases/{id}/follow-up-calls"
  - priority: 13
    category: business_temporal
    check: "a new FollowUpCall must not double-book its assigned_specialist_id: across ALL cases, the gap between this call's closed interval [start,end] and every existing SCHEDULED/ATTEMPTED call of the same specialist must be >= FOLLOWUP_SPECIALIST_BUFFER_MINUTES (15); a gap of exactly 15 minutes is allowed, a smaller gap (including touching intervals) is rejected"
    error_id: ERR_SPECIALIST_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /exposure-cases/{id}/follow-up-calls"
  - priority: 14
    category: business_constraint
    check: "scheduled_end must be strictly greater than scheduled_start"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /exposure-cases/{id}/follow-up-calls"
  - priority: 15
    category: business_constraint
    check: "OCC: expected_case_version must equal current ExposureCase.version"
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    applies_to: "POST /exposure-cases/{id}/risk-assessments"
  - priority: 16
    category: business_referential
    check: "NpdsReport create requires the case to have an active (non-SUPERSEDED) RiskAssessment"
    error_id: ERR_NO_ACTIVE_ASSESSMENT
    http_status: 409
    applies_to: "POST /npds-reports"
  - priority: 17
    category: business_referential
    check: "protocol_selection produced no protocol for the risk_tier (protocol_id null) at finalize"
    error_id: ERR_NO_PROTOCOL
    http_status: 409
    applies_to: "POST /risk-assessments/{id}/finalize"
  - priority: 18
    category: business_constraint
    check: "required body field missing or of wrong type / invalid enum"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"
  - priority: 19
    category: business_constraint
    check: "interpreter_language required when interpreter_required==true"
    error_id: ERR_INTERPRETER_LANGUAGE_REQUIRED
    http_status: 422
    applies_to: "POST /exposure-cases"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  - method: POST
    path: "/substances"
    description: "Create a substance reference row"
    roles: [SystemAdmin]
    code: 201
    input: [name, category, toxic_dose_mg_per_kg, onset_hours, reference_route]
    output: Substance
    side_effects: []
  - method: GET
    path: "/substances/{id}"
    description: "Fetch a substance including its aggregate_case_count surveillance counter"
    roles: [SystemAdmin, Specialist, Toxicologist, SurveillanceOfficer]
    code: 200
    input: []
    output: Substance
    side_effects: []
  - method: POST
    path: "/healthcare-facilities"
    description: "Create a healthcare facility"
    roles: [SystemAdmin]
    code: 201
    input: [name, facility_type, "status?", consult_capacity]
    output: HealthcareFacility
    side_effects: []
  - method: GET
    path: "/healthcare-facilities/{id}"
    description: "Fetch a facility including active_consult_count"
    roles: [SystemAdmin, Specialist, Toxicologist, SurveillanceOfficer]
    code: 200
    input: []
    output: HealthcareFacility
    side_effects: []
  - method: POST
    path: "/protocols"
    description: "Create a management protocol for a risk tier"
    roles: [SystemAdmin]
    code: 201
    input: [risk_tier, management_setting, followup_count, followup_interval_hours, "requires_toxicologist?"]
    output: Protocol
    side_effects: []
  - method: POST
    path: "/specialists"
    description: "Create a poison-information specialist / toxicologist"
    roles: [SystemAdmin]
    code: 201
    input: [full_name, credential, "certification_active?"]
    output: Specialist
    side_effects: []
  - method: POST
    path: "/exposure-cases"
    description: "Open a new exposure case (call intake)"
    roles: [Specialist, Toxicologist]
    code: 201
    input: [patient_age_years, patient_weight_kg, patient_sex, chief_complaint, "interpreter_required?", "interpreter_language?"]
    output: ExposureCase
    side_effects: ["intake_specialist_id set from X-User-ID", "status=INTAKE"]
  - method: GET
    path: "/exposure-cases/{id}"
    description: "Fetch a case with computed status/risk_tier/pending_followup_count"
    roles: [Specialist, Toxicologist, SurveillanceOfficer]
    code: 200
    input: []
    output: ExposureCase
    side_effects: []
  - method: GET
    path: "/exposure-cases"
    description: "List cases (filterable)"
    roles: [Specialist, Toxicologist, SurveillanceOfficer]
    code: 200
    input: ["status?", "intake_specialist_id?", "limit?", "offset?"]
    output: ExposureCase[]
    side_effects: []
  - method: POST
    path: "/exposure-cases/{id}/triage"
    description: "Advance a case INTAKE -> TRIAGED"
    roles: [Specialist, Toxicologist]
    code: 200
    input: []
    output: ExposureCase
    side_effects: ["status INTAKE->TRIAGED"]
  - method: POST
    path: "/exposure-cases/{id}/close"
    description: "Close a case (RESOLVED->CLOSED, or REFERRED->CLOSED for Toxicologist)"
    roles: [Specialist, Toxicologist]
    code: 200
    input: []
    output: ExposureCase
    side_effects: ["status ->CLOSED"]
  - method: POST
    path: "/exposure-cases/{id}/exposures"
    description: "Record a substance exposure on the case; adding to a MONITORING case triggers RETRIAGE"
    roles: [Specialist, Toxicologist]
    code: 201
    input: [substance_id, route, dose_range_low_mg, dose_range_high_mg, time_since_exposure_hours]
    output: Exposure
    side_effects: ["exposure_toxicity_score (ESTIMATED) computed", "if case MONITORING: case->RETRIAGE, active RiskAssessment/Disposition ->SUPERSEDED"]
  - method: GET
    path: "/exposures/{id}"
    description: "Fetch a single exposure with toxicity_score/severity_band"
    roles: [Specialist, Toxicologist, SurveillanceOfficer]
    code: 200
    input: []
    output: Exposure
    side_effects: []
  - method: GET
    path: "/exposures"
    description: "List exposures filtered by case or substance"
    roles: [Specialist, Toxicologist, SurveillanceOfficer]
    code: 200
    input: ["case_id?", "substance_id?", "limit?", "offset?"]
    output: Exposure[]
    side_effects: []
  - method: POST
    path: "/exposure-cases/{id}/risk-assessments"
    description: "Create a risk assessment for the case (create-with-supersede; OCC on case.version)"
    roles: [Specialist, Toxicologist]
    code: 201
    input: [expected_case_version]
    output: RiskAssessment
    side_effects: ["case_aggregate_risk (MAX+ADDITIVE) computed", "protocol_selection sets protocol_id", "prior active RiskAssessment ->SUPERSEDED", "increments ExposureCase.version by 1"]
  - method: GET
    path: "/risk-assessments/{id}"
    description: "Fetch a risk assessment"
    roles: [Specialist, Toxicologist, SurveillanceOfficer]
    code: 200
    input: []
    output: RiskAssessment
    side_effects: []
  - method: GET
    path: "/risk-assessments"
    description: "List risk assessments filtered by case or protocol"
    roles: [Specialist, Toxicologist, SurveillanceOfficer]
    code: 200
    input: ["case_id?", "protocol_id?", "limit?", "offset?"]
    output: RiskAssessment[]
    side_effects: []
  - method: POST
    path: "/risk-assessments/{id}/finalize"
    description: "Finalize a risk assessment (COMPLETED->FINALIZED). SEVERE/CRITICAL protocols (requires_toxicologist=true) admit only the Toxicologist role; lower tiers admit either."
    roles: [Specialist, Toxicologist]
    code: 200
    input: []
    output: RiskAssessment
    side_effects: ["status COMPLETED->FINALIZED", "case.risk_tier mirror refreshed"]
  - method: POST
    path: "/exposure-cases/{id}/dispositions"
    description: "Record home-management or ED-referral disposition"
    roles: [Specialist, Toxicologist]
    code: 201
    input: [risk_assessment_id, disposition_type, "facility_id?"]
    output: Disposition
    side_effects: ["case TRIAGED/RETRIAGE -> MONITORING or REFERRED", "HOME_MANAGEMENT: followup_schedule generates FollowUpCall rows", "case.pending_followup_count set"]
  - method: GET
    path: "/dispositions/{id}"
    description: "Fetch a disposition"
    roles: [Specialist, Toxicologist, SurveillanceOfficer]
    code: 200
    input: []
    output: Disposition
    side_effects: []
  - method: GET
    path: "/dispositions"
    description: "List dispositions filtered by case, risk assessment, or facility"
    roles: [Specialist, Toxicologist, SurveillanceOfficer]
    code: 200
    input: ["case_id?", "risk_assessment_id?", "facility_id?", "limit?", "offset?"]
    output: Disposition[]
    side_effects: []
  - method: POST
    path: "/exposure-cases/{id}/follow-up-calls"
    description: "Schedule a follow-up call on the case (overlap + specialist buffer enforced)"
    roles: [Specialist, Toxicologist]
    code: 201
    input: [assigned_specialist_id, sequence_index, scheduled_start, scheduled_end]
    output: FollowUpCall
    side_effects: ["status=SCHEDULED", "case.pending_followup_count incremented"]
  - method: GET
    path: "/follow-up-calls/{id}"
    description: "Fetch a follow-up call"
    roles: [Specialist, Toxicologist, SurveillanceOfficer]
    code: 200
    input: []
    output: FollowUpCall
    side_effects: []
  - method: GET
    path: "/follow-up-calls"
    description: "List follow-up calls filtered by case or assigned specialist"
    roles: [Specialist, Toxicologist, SurveillanceOfficer]
    code: 200
    input: ["case_id?", "assigned_specialist_id?", "limit?", "offset?"]
    output: FollowUpCall[]
    side_effects: []
  - method: POST
    path: "/follow-up-calls/{id}/attempt"
    description: "Record a call attempt (SCHEDULED->ATTEMPTED)"
    roles: [Specialist, Toxicologist]
    code: 200
    input: []
    output: FollowUpCall
    side_effects: ["attempt_count incremented", "status SCHEDULED->ATTEMPTED"]
  - method: POST
    path: "/follow-up-calls/{id}/complete"
    description: "Complete a call with an outcome (ATTEMPTED->COMPLETED, or ->SCHEDULED on NO_ANSWER retry)"
    roles: [Specialist, Toxicologist]
    code: 200
    input: [outcome]
    output: FollowUpCall
    side_effects: ["outcome set / reschedule", "case.pending_followup_count decremented on terminal", "bubble-up case->RESOLVED on RESOLVED; case->RETRIAGE on WORSENED"]
  - method: POST
    path: "/facility-consults"
    description: "Open a healthcare-facility consult for a referred case"
    roles: [Toxicologist]
    code: 201
    input: [case_id, facility_id, consult_duration_minutes]
    output: FacilityConsult
    side_effects: ["status=ACTIVE", "facility.active_consult_count incremented", "requesting_specialist_id set from X-User-ID"]
  - method: GET
    path: "/facility-consults/{id}"
    description: "Fetch a facility consult"
    roles: [Specialist, Toxicologist, SurveillanceOfficer]
    code: 200
    input: []
    output: FacilityConsult
    side_effects: []
  - method: GET
    path: "/facility-consults"
    description: "List facility consults filtered by case, facility, or requesting specialist"
    roles: [Specialist, Toxicologist, SurveillanceOfficer]
    code: 200
    input: ["case_id?", "facility_id?", "requesting_specialist_id?", "limit?", "offset?"]
    output: FacilityConsult[]
    side_effects: []
  - method: POST
    path: "/facility-consults/{id}/close"
    description: "Close a consult, confirm the dose, and cascade re-scoring"
    roles: [Toxicologist]
    code: 200
    input: [confirmed_dose_mg]
    output: FacilityConsult
    side_effects: ["consult_billing_units computed", "facility.active_consult_count decremented", "exposures CONFIRMED re-scored", "RiskAssessment recomputed", "possible case MONITORING->REFERRED escalation + follow-up cancellation"]
  - method: POST
    path: "/npds-reports"
    description: "Submit an NPDS surveillance report for a case"
    roles: [SurveillanceOfficer]
    code: 201
    input: [case_id, primary_substance_id]
    output: NpdsReport
    side_effects: ["npds_medical_outcome computed", "Substance.aggregate_case_count incremented", "reported_at stamped"]
  - method: GET
    path: "/npds-reports/{id}"
    description: "Fetch an NPDS report"
    roles: [SurveillanceOfficer, Toxicologist]
    code: 200
    input: []
    output: NpdsReport
    side_effects: []
  - method: GET
    path: "/npds-reports"
    description: "List NPDS reports filtered by case or primary substance"
    roles: [SurveillanceOfficer, Toxicologist]
    code: 200
    input: ["case_id?", "primary_substance_id?", "limit?", "offset?"]
    output: NpdsReport[]
    side_effects: []
  - method: POST
    path: "/npds-reports/{id}/retract"
    description: "Retract a submitted NPDS report (compensating decrement)"
    roles: [SurveillanceOfficer, Toxicologist]
    code: 200
    input: []
    output: NpdsReport
    side_effects: ["report_status SUBMITTED->RETRACTED", "Substance.aggregate_case_count decremented"]
  - method: POST
    path: "/exposure-cases/{id}/notes"
    description: "Append a documentation note to a case (append-only)"
    roles: [Specialist, Toxicologist]
    code: 201
    input: [note_type, body]
    output: CaseNote
    side_effects: ["author_ref set from X-User-ID"]
  - method: GET
    path: "/exposure-cases/{id}/notes"
    description: "List a case's documentation notes"
    roles: [Specialist, Toxicologist, SurveillanceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: CaseNote[]
    side_effects: []
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving clock control. Sets the logical clock used for all scheduling/expiry. Server startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set to to_iso8601"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role or X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for this operation"
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "path case id does not resolve"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "path sub-resource id (exposure/assessment/call/consult/report/disposition) does not resolve"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "referenced FK body id (substance/facility/risk_assessment/primary_substance) does not resolve"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "entity not in a state that permits the requested transition"
  - id: ERR_NO_EXPOSURES
    http: 422
    condition: "triage attempted on a case with zero exposures"
  - id: ERR_UNSAFE_DISPOSITION
    http: 422
    condition: "HOME_MANAGEMENT disposition on a case whose risk_tier is SEVERE or CRITICAL"
  - id: ERR_TOXICOLOGIST_REQUIRED
    http: 403
    condition: "finalize of a protocol requiring toxicologist attempted by non-Toxicologist"
  - id: ERR_DISPOSITION_FACILITY_MISMATCH
    http: 422
    condition: "ED_REFERRAL without facility_id, or HOME_MANAGEMENT with a facility_id"
  - id: ERR_FACILITY_NOT_ACCEPTING
    http: 409
    condition: "facility consult opened against a facility whose status != ACCEPTING"
  - id: ERR_FACILITY_AT_CAPACITY
    http: 409
    condition: "facility consult opened when active_consult_count >= consult_capacity"
  - id: ERR_FOLLOWUP_OVERLAP
    http: 409
    condition: "new follow-up window overlaps an existing SCHEDULED/ATTEMPTED call of the same case (half-open)"
  - id: ERR_SPECIALIST_DOUBLE_BOOKED
    http: 409
    condition: "new follow-up violates the assigned specialist's closed-interval + buffer schedule across cases"
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "scheduled_end not strictly after scheduled_start"
  - id: ERR_STALE_CASE_VERSION
    http: 412
    condition: "expected_case_version != current ExposureCase.version on risk-assessment create"
  - id: ERR_NO_ACTIVE_ASSESSMENT
    http: 409
    condition: "NPDS report submitted for a case with no active (non-SUPERSEDED) RiskAssessment"
  - id: ERR_NO_PROTOCOL
    http: 409
    condition: "finalize when no protocol matched the assessment's risk_tier"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong type, or invalid enum value"
  - id: ERR_INTERPRETER_LANGUAGE_REQUIRED
    http: 422
    condition: "interpreter_required true but interpreter_language absent"
  - id: ERR_VALIDATION
    http: 422
    condition: "generic semantic validation failure not covered by a more specific code"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Specialist
    description: "Front-line poison information specialist (SPI): intake, triage, exposures, assessments, dispositions, follow-ups, documentation"
    identity: "entity_backed:Specialist"
    exclusive_operations:
      - "POST /exposure-cases/{id}/triage"
      - "POST /exposure-cases/{id}/follow-up-calls"
      - "POST /follow-up-calls/{id}/attempt"
      - "POST /follow-up-calls/{id}/complete"
    shared_operations:
      - "POST /exposure-cases"
      - "POST /exposure-cases/{id}/exposures"
      - "POST /exposure-cases/{id}/risk-assessments"
      - "POST /exposure-cases/{id}/dispositions"
      - "POST /exposure-cases/{id}/notes"
      - "POST /exposure-cases/{id}/close"
      - "POST /risk-assessments/{id}/finalize (MINIMAL/MODERATE tiers)"
      - "GET reads on cases and children"
  - name: Toxicologist
    description: "Senior medical toxicologist; clinical superset of Specialist plus assessment finalize and facility-consult authority"
    identity: "entity_backed:Specialist"
    exclusive_operations:
      - "POST /facility-consults"
      - "POST /facility-consults/{id}/close"
      - "POST /risk-assessments/{id}/finalize on SEVERE/CRITICAL (requires_toxicologist) protocols"
    shared_operations:
      - "all Specialist shared_operations"
      - "POST /risk-assessments/{id}/finalize on MINIMAL/MODERATE protocols"
      - "POST /npds-reports/{id}/retract"
      - "POST /exposure-cases/{id}/close (REFERRED->CLOSED)"
  - name: SurveillanceOfficer
    description: "NPDS surveillance & reporting operator"
    identity: "opaque"
    exclusive_operations:
      - "POST /npds-reports"
    shared_operations:
      - "POST /npds-reports/{id}/retract"
      - "GET reads on cases, exposures, assessments, reports"
  - name: SystemAdmin
    description: "Configuration operator: substances, facilities, protocols, specialists, and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /substances"
      - "POST /healthcare-facilities"
      - "POST /protocols"
      - "POST /specialists"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads on config resources"
