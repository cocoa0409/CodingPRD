              as_user_id: "dp-01"
              captures: { e1_minutes: $.data.cumulative_excursion_minutes, e1_max: $.data.max_excursion_temp_c, e1_cold: $.data.cold_chain_status, e1_status: $.data.status }
            - call: "POST /allocations/${a1_id}/cold-chain-event"
              payload: { excursion_minutes: 140.00, max_temp_c: 15.0 }
              as: DistributionPlanner
              as_user_id: "dp-01"
              captures: { e2_minutes: $.data.cumulative_excursion_minutes, e2_max: $.data.max_excursion_temp_c, e2_cold: $.data.cold_chain_status, e2_status: $.data.status }
            - call: "POST /allocations/${a1_id}/cold-chain-event"
              payload: { excursion_minutes: 1.00, max_temp_c: 10.0 }
              as: DistributionPlanner
              as_user_id: "dp-01"
              captures: { e3_minutes: $.data.cumulative_excursion_minutes, e3_max: $.data.max_excursion_temp_c, e3_cold: $.data.cold_chain_status, e3_status: $.data.status, e3_reason: $.data.quarantine_reason }
            - call: "GET /reagent-lots/${rl_id}"
              payload: {}
              as: DistributionPlanner
              captures: { rl_quarantined: $.data.quarantined_units, rl_shipped: $.data.shipped_units, rl_available_after: $.data.available_units }
            - call: "POST /allocations/${a2_id}/cold-chain-event"
              payload: { excursion_minutes: 5.00, max_temp_c: 8.0, delivery_confirmed: true }
              as: DistributionPlanner
              as_user_id: "dp-01"
              captures: { a2_minutes: $.data.cumulative_excursion_minutes, a2_cold: $.data.cold_chain_status, a2_status: $.data.status }
          assert:
            - "at ship time allocation 1 carries cold_chain_status INTACT and cumulative_excursion_minutes 0, the declared defaults"
            - "after the first event cumulative_excursion_minutes is 100.00, max_excursion_temp_c is 12.0 and cold_chain_status is EXCURSION_ACCEPTABLE, because the aggregate is above zero but under both limits"
            - "after the second event cumulative_excursion_minutes is EXACTLY 240.00 and max_excursion_temp_c is EXACTLY 15.0, and cold_chain_status is still EXCURSION_ACCEPTABLE with status SHIPPED — both comparisons are strict, so sitting on a limit is not an excursion rejection"
            - "the third event of only 1.00 minute takes the aggregate to 241.00 and flips cold_chain_status to EXCURSION_REJECTED, moving the allocation SHIPPED -> QUARANTINED with quarantine_reason COLD_CHAIN_EXCURSION, even though max_excursion_temp_c stays at 15.0"
            - "the lot ledger follows the flip: quarantined_units 100, shipped_units 50 (allocation 2 only) and available_units 150"
            - "allocation 2, whose single 5.00-minute event at 8.0 C leaves it EXCURSION_ACCEPTABLE, moves to status DELIVERED on the same call because delivery_confirmed was true — the aggregate governs the delivery decision, not the presence of an excursion"

      - name: four_level_recall_cascade_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: complaint_removal_recall_cascades_through_lot_allocation_order_and_material
          rationale: "The §1.8 transitive-cascade instance drives the full four-hop chain from the field-action decision down through the lot, its allocations, their orders and the critical MaterialLot quarantine, asserting every hop's fields and the ordering between them."
      - name: upward_ledger_cascade_from_a_leaf_event
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: cold_chain_excursion_cascades_from_allocation_up_to_order_ledger
          rationale: "The §1.8 instance asserts the three upward hops from one cold-chain event to the lot's unit buckets and the parent order's allocated_units and shortfall_units."
      - name: acceptance_mode_variants_diverge_on_identical_measurements
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
        excluded_because:
          difficulty_instance: material_acceptance_all_pass_versus_weighted_score_divergence
          rationale: "The §1.8 dual-variant instance feeds identical measurements to an ALL_PASS specification and a WEIGHTED_SCORE specification and asserts the opposite qualification outcomes and the delta between them."
      - name: stability_study_type_variants_diverge_on_shelf_life
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
        excluded_because:
          difficulty_instance: stability_shelf_life_real_time_versus_accelerated_divergence
          rationale: "The §1.8 dual-variant instance runs the REAL_TIME and ACCELERATED variants over the same timepoint data and asserts the two different shelf lives and the basis recorded on the released lot."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: every_derived_field_and_cross_entity_ledger_move_is_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.material_lot_acceptance_score
          - calculations.material_quantity_conservation
          - calculations.complaint_reportability
        distinguishing_aspect: "The declared model is `immediate`, which forbids any deferred or background recomputation: the response body of the very call that causes a change must already carry the recomputed value, and a read issued immediately afterwards with no clock advance must agree with it field for field. The instance checks this on three different shapes — a computed field on the written entity itself (TestResult.outcome), a derived field on the entity's own body after a decision (MaterialLot.acceptance_score and qualification_status), and a CROSS-ENTITY ledger move (dispensing a component decrements the MaterialLot's available_quantity_units, observable on the next read without any intervening trigger)."
        test_recipe:
          setup:
            - "Clock at 2026-08-22T00:00:00Z. One WEIGHTED_SCORE MaterialSpecification AB-CN-1 and one PLANNED ReagentLot CN-LOT-1 of the uncleared product IVD-CN-1, so nothing in the chain needs a clearance."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-22T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /material-specifications"
              payload: { material_code: "AB-CN-1", material_type: "ANTIBODY", potency_min_pct: 90.0, potency_max_pct: 110.0, endotoxin_max_eu_per_ml: 2.0, purity_min_pct: 95.0, required_test_codes: ["POTENCY", "PURITY"], is_critical: true, acceptance_mode: "WEIGHTED_SCORE" }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { ms_id: $.data.id }
            - call: "POST /material-lots"
              payload: { material_specification_id: "${ms_id}", vendor_lot_code: "V-CN-1", received_quantity_units: 500.0, expiry_date: "2027-12-31T00:00:00Z" }
              as: ProductionOperator
              captures: { ml_id: $.data.id, ml_available_at_receipt: $.data.available_quantity_units, ml_consumed_at_receipt: $.data.consumed_quantity_units }
            - call: "POST /product-specifications"
              payload: { product_code: "IVD-CN-1", reference_material_code: "REF-CN1", required_material_codes: ["AB-CN-1"], release_test_codes: ["ACTIVITY"], max_reference_bias_pct: 5.0, shelf_life_months_claim: 12, storage_condition: "TWO_TO_EIGHT_C", min_shelf_life_days_at_ship: 30 }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { ps_id: $.data.id }
            - call: "POST /reagent-lots"
              payload: { product_specification_id: "${ps_id}", lot_code: "CN-LOT-1", planned_units: 100 }
              as: ProductionOperator
              captures: { rl_id: $.data.id, rl_v: $.data.version }
          trigger:
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${ml_id}", test_code: "POTENCY", measured_value: 100.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
              captures: { t1_outcome: $.data.outcome, t1_performed_at: $.data.performed_at }
            - call: "GET /material-lots/${ml_id}"
              payload: {}
              as: QCAnalyst
              captures: { ml_status_after_first_test: $.data.qualification_status }
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${ml_id}", test_code: "PURITY", measured_value: 99.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
              captures: { t2_outcome: $.data.outcome }
            - call: "POST /material-lots/${ml_id}/disposition"
              payload: { decision: "QUALIFY" }
              as: QAReleaser
              as_user_id: "qa-01"
              captures: { disp_status: $.data.qualification_status, disp_score: $.data.acceptance_score, disp_by: $.data.dispositioned_by_user_id, disp_at: $.data.dispositioned_at }
            - call: "GET /material-lots/${ml_id}"
              payload: {}
              as: QAReleaser
              captures: { read_status: $.data.qualification_status, read_score: $.data.acceptance_score, read_by: $.data.dispositioned_by_user_id }
            - call: "POST /reagent-lots/${rl_id}/components"
              payload: { material_lot_id: "${ml_id}", component_role: "ANTIBODY", quantity_used: 120.0, expected_reagent_lot_version: "${rl_v}" }
              as: ProductionOperator
              captures: { comp_id: $.data.id, comp_snapshot: $.data.vendor_lot_code_snapshot }
            - call: "GET /material-lots/${ml_id}"
              payload: {}
              as: ProductionOperator
              captures: { ml_available_after: $.data.available_quantity_units, ml_consumed_after: $.data.consumed_quantity_units }
            - call: "GET /material-lots?material_specification_id=${ms_id}"
              payload: {}
              as: ProductionOperator
              captures: { list_available: "$.data[0].available_quantity_units", list_status: "$.data[0].qualification_status" }
            - call: "POST /complaints"
              payload: { reagent_lot_id: "${rl_id}", complaint_code: "CPL-CN-1", narrative: "Immediate-visibility probe on the reportability derivation." }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { cpl_id: $.data.id, cpl_reportable_before: $.data.reportable, cpl_due_before: $.data.report_due_at }
            - call: "POST /complaints/${cpl_id}/triage"
              payload: { severity: "HIGH", malfunction_suspected: true }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { cpl_reportable: $.data.reportable, cpl_due: $.data.report_due_at, cpl_status: $.data.status }
            - call: "GET /complaints/${cpl_id}"
              payload: {}
              as: RegulatoryAffairs
              captures: { cpl_reportable_read: $.data.reportable, cpl_due_read: $.data.report_due_at }
          assert:
            - "each POST /test-results response already carries outcome PASS — the computed field is in the body of the call that created it, not filled in later"
            - "the MaterialLot read after the first test already shows qualification_status UNDER_TEST, so the parent's state moved in the same request that recorded the child"
            - "the disposition response itself carries qualification_status QUALIFIED, acceptance_score 99.60 (0.45*1.0 + 0.30*0.99 over the present-set denominator 0.75), dispositioned_by_user_id qa-01 and dispositioned_at 2026-08-22T00:00:00.000Z"
            - "the immediately following GET returns the identical qualification_status, acceptance_score and dispositioned_by_user_id — no lag, no second write needed to settle the derived fields"
            - "the MaterialLot showed available_quantity_units 500.0 and consumed_quantity_units 0.0 at receipt, and immediately after the component add the same lot shows available_quantity_units 380.0 and consumed_quantity_units 120.0, so a cross-entity ledger move is visible on the very next read"
            - "the filtered LIST view agrees with the single read: available_quantity_units 380.0 and qualification_status QUALIFIED, so the denormalised list projection is not stale"
            - "the complaint carries reportable false and report_due_at null before triage, and its triage response already carries reportable true with report_due_at 2026-09-21T00:00:00.000Z and status TRIAGED, which the immediate re-read reproduces exactly"
