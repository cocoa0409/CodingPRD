          expected_review_version: ${rev_v1}
          title: Voluntary quality initiative
          milestone_count: 3
          target_completion_on: '2026-12-31'
        as: QualityOfficer
        as_user_id: ${qo_id}
      assert:
      - HTTP 422 with error_id ERR_PLAN_NOT_REQUIRED in the response envelope's error block
      - ProgramOutcomeReview.${rev_id}.oe_ratio == 1.0000, flag_level == NONE, requires_improvement_plan
        == false
      - GET /outcome-reviews/${rev_id}/improvement-plans returns data == [] and total_count == 0
