            - "GET /complaints/${cx} after that refusal still returns status == APPEALED and the DisciplinaryAction is still IN_EFFECT with points == 10"
            - "sixth trigger, sent with X-User-ID pa-002, returns HTTP 200 with ${cx_status5} == UPHELD; the sanction stays IN_EFFECT and rolling_12_month_score is still 60"

  # =========================================================================
  - section: Cross-Cutting Complexity Layers
    instances:

      - name: a_stale_expected_version_returns_412_on_both_declared_occ_write_endpoints
        claim_type: optimistic_concurrency
        grounds: [concurrency_rules.assignment-create-stale-hearing, concurrency_rules.credential-create-stale-interpreter, "errors[ERR_STALE_HEARING_VERSION]", "errors[ERR_STALE_INTERPRETER_VERSION]", "validations[priority=8]"]
        distinguishing_aspect: "Both OCC rules guard a create whose side effect silently retires another row — a replacement assignment supersedes the incumbent, a higher-tier credential withdraws the pending application — so the guarded field belongs to the parent (Hearing.version, Interpreter.version) while the write creates a child. Each rule reports its own 412 code, and the parent version advances on writes the client never issued against the parent directly."
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Languages spa (DESIGNATED, oral_exam_available true) and kor (NON_DESIGNATED, oral_exam_available true)."
            - "Courthouse Central Justice Center (county CAS, CERTIFIED_VRI, capacity 2, budget 5000000); open-ended RateSchedule from 2026-01-01."
            - "Interpreters Ana Reyes (iA) and Carla Diaz (iC), each ACTIVE with a CERTIFIED spa credential and ethics COMPLETED. iC's version at creation (1) is captured and kept as the deliberately stale value."
            - "Hearing h1: spa, PLEA, in_custody true, 2026-09-15 09:00-10:00, IN_PERSON. The replacement create always names iC, never iA, so the interval-conflict rule cannot interfere."
          setup_api_calls:
            - call: "POST /languages"
              payload: { code: "spa", name: "Spanish", tier_class: "DESIGNATED", oral_exam_available: true }
              as: ProgramAdmin
              captures: { lang_spa: "$.data.id" }
            - call: "POST /languages"
              payload: { code: "kor", name: "Korean", tier_class: "NON_DESIGNATED", oral_exam_available: true }
              as: ProgramAdmin
              captures: { lang_kor: "$.data.id" }
            - call: "POST /courthouses"
              payload: { name: "Central Justice Center", county_code: "CAS", courtroom_count: 12, remote_equipment_tier: "CERTIFIED_VRI", vri_concurrent_capacity: 2, pay_budget_cents: 5000000 }
              as: ProgramAdmin
              captures: { ch_main: "$.data.id" }
            - call: "POST /rate-schedules"
              payload: { effective_from: "2026-01-01", master_hourly_cents: 10500, certified_hourly_cents: 8750, registered_hourly_cents: 6500, provisional_hourly_cents: 4900, minimum_call_hours: 2.0, travel_mileage_rate_cents: 67.5, travel_free_radius_miles: 30.0, remote_rate_multiplier: 0.90, late_cancellation_hours: 48, late_cancellation_pay_hours: 2.0, rare_premium_low_pct: 0.10, rare_premium_high_pct: 0.15, rare_premium_bracket_cents: 30000 }
              as: ProgramAdmin
              captures: { rs1: "$.data.id" }
            - call: "POST /interpreters"
              payload: { full_name: "Ana Reyes", email: "ana.reyes@courts.example.gov", home_county_code: "CAS" }
              as: CredentialingOfficer
              captures: { iA: "$.data.id" }
            - call: "POST /interpreters/${iA}/ethics-training"
              payload: { completed_on: "2026-08-01", provider: "AOC Court Interpreter Ethics" }
              as: CredentialingOfficer
              captures: { iA_v2: "$.data.version" }
            - call: "POST /credentials"
              payload: { interpreter_id: "${iA}", language_id: "${lang_spa}", target_tier: "CERTIFIED", expected_interpreter_version: "${iA_v2}" }
              as: CredentialingOfficer
              captures: { credA: "$.data.id" }
            - call: "POST /credentials/${credA}/exam-attempts"
              payload: { exam_type: "WRITTEN", score: 86, taken_on: "2026-08-01" }
              as: CredentialingOfficer
            - call: "POST /credentials/${credA}/advance"
              payload: {}
              as: CredentialingOfficer
            - call: "POST /credentials/${credA}/exam-attempts"
              payload: { exam_type: "ORAL", score: 74, taken_on: "2026-08-01" }
              as: CredentialingOfficer
            - call: "POST /credentials/${credA}/advance"
              payload: {}
              as: CredentialingOfficer
            - call: "POST /credentials/${credA}/advance"
              payload: {}
              as: CredentialingOfficer
            - call: "POST /interpreters"
              payload: { full_name: "Carla Diaz", email: "carla.diaz@courts.example.gov", home_county_code: "CAS" }
              as: CredentialingOfficer
