  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: stations_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "List endpoint honors limit/offset and reports total_count and has_more per the fixed envelope (limit 2 over 3 rows -> has_more true; offset 2 -> 1 row, has_more false)."
        test_recipe:
          setup: ["Three stations KAAA, KBBB, KCCC"]
          setup_api_calls:
            - { call: "POST /dispatch/stations", payload: { iata_code: "KAAA", runway_length_m: 2500, alternate_distance_nm: 10, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { s1: $.data.id } }
            - { call: "POST /dispatch/stations", payload: { iata_code: "KBBB", runway_length_m: 2500, alternate_distance_nm: 20, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { s2: $.data.id } }
            - { call: "POST /dispatch/stations", payload: { iata_code: "KCCC", runway_length_m: 2500, alternate_distance_nm: 30, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { s3: $.data.id } }
          trigger:
            - { call: "GET /dispatch/stations?limit=2", as: DispatchSupervisor, captures: { pg_total: $.meta.total_count, pg_more: $.meta.has_more } }
            - { call: "GET /dispatch/stations?limit=2&offset=2", as: DispatchSupervisor, captures: { pg2_more: $.meta.has_more } }
          assert:
            - "pg_total == 3 and pg_more == true and page 1 length == 2"
            - "pg2_more == false and page 2 length == 1"

      - name: pagination_limit_bounds_rejected
        claim_type: type_constraints
        grounds: [response_envelope, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "limit outside [1, 100] -> ERR_INVALID_REQUEST (0 and 101 both rejected)."
        test_recipe:
          setup: ["One station exists"]
          setup_api_calls:
            - { call: "POST /dispatch/stations", payload: { iata_code: "KAAA", runway_length_m: 2500, alternate_distance_nm: 10, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { s1: $.data.id } }
          trigger:
            - { call: "GET /dispatch/stations?limit=0", as: DispatchSupervisor, captures: { lim0_err: $.data.error_id } }
            - { call: "GET /dispatch/stations?limit=101", as: DispatchSupervisor, captures: { lim101_err: $.data.error_id } }
          assert:
            - "lim0_err == ERR_INVALID_REQUEST and lim101_err == ERR_INVALID_REQUEST"

      - name: response_envelope_shape_on_success_and_error
        claim_type: creation
        grounds: [response_envelope]
        distinguishing_aspect: "Success body has meta.api_request_id + response_type object + data; error body has response_type error + data.error_id/message."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /dispatch/stations", payload: { iata_code: "KAAA", runway_length_m: 2500, alternate_distance_nm: 10, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { s1: $.data.id } }
            - { call: "GET /dispatch/aircraft/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: DispatchSupervisor, captures: { nf_err: $.data.error_id } }
          assert:
            - "success: meta.api_request_id present, meta.api_request_timestamp present, response_type == object, data holds the station"
            - "error: response_type == error, data.error_id == ERR_NOT_FOUND, data.message present"

      - name: plans_list_filter_by_leg
        claim_type: retrieval
        grounds: [endpoints]
        distinguishing_aspect: "Filtered list GET /dispatch/plans?leg_id=X returns only that leg's plans (reverse-FK reachability for FlightPlan.leg_id)."
        test_recipe:
          setup: ["Two legs each with one COMPUTED plan"]
          setup_api_calls:
