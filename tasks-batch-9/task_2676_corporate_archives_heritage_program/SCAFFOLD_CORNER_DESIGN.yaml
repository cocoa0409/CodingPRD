          rationale: "Aggregate peak counting at and beyond max_overlapping_migration_jobs is asserted in full by the named §1.8 instance."

      - name: validations_loan_window_conflict_on_create
        claim_type: temporal_validation
        grounds:
          - validations[priority=44]
          - errors[ERR_LOAN_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / exhibit_loan_half_open_window_plus_light_recovery_buffer_on_item
          rationale: "The colliding and non-colliding endpoint cases under half-open plus buffer semantics are the named §1.8 instance's subject."

      - name: validations_zone_not_compliant_on_migration_start
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=45]
          - errors[ERR_ZONE_NOT_COMPLIANT]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / migration_job_cannot_start_while_zone_environment_marginal
          rationale: "The MARGINAL near-miss and the COMPLIANT success are both asserted by the named §1.8 instance."

      - name: validations_series_suspended_blocks_begin_screening
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=25]
          - errors[ERR_SERIES_DISPOSITION_SUSPENDED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / access_request_cannot_begin_screening_while_series_suspended
          rationale: "The suspended-series guard on begin-screening, including the post-release success, is the named §1.8 instance."

      - name: validations_retention_period_not_elapsed_on_dispose
        claim_type: temporal_validation
        grounds:
          - validations[priority=29]
          - errors[ERR_RETENTION_PERIOD_NOT_ELAPSED]
        excluded_because:
          difficulty_instance: boundary_precision_check / retention_expiry_instant_inclusive_to_the_millisecond
          rationale: "The one-millisecond-before rejection and the exact-instant success are asserted by the named §1.8 instance."

      - name: validations_no_qualifying_evidence_on_certify
        claim_type: violation_to_error
        grounds:
          - validations[priority=47]
          - errors[ERR_NO_QUALIFYING_EVIDENCE]
        excluded_because:
          difficulty_instance: boundary_precision_check / trademark_certify_rejects_zero_qualifying_evidence_then_accepts_one
          rationale: "The zero-evidence rejection followed by the one-evidence acceptance is the named §1.8 instance."

      - name: validations_item_has_active_loan_on_deaccession_approve
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=42]
          - errors[ERR_ITEM_HAS_ACTIVE_LOAN]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / deaccession_cannot_be_approved_while_item_has_confirmed_loan
          rationale: "The CONFIRMED-loan block and the post-cancellation success are the named §1.8 instance's two halves."

      - name: validations_risk_threshold_versus_referential_priority_on_approve
        claim_type: priority_ordering
        grounds:
          - validations[priority=48]
          - validations[priority=33]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / access_approve_referential_priority_beats_risk_threshold_constraint
          rationale: "The stacked violation where the priority-33 referential check outranks the priority-48 risk-threshold constraint is exactly the named §1.8 instance; the standalone positive trigger of ERR_RISK_THRESHOLD_REQUIRES_REDACTION lives in this file's errors section."

  # ==========================================================================
  # §1.9 Section 5 — Endpoints (Table 5)
  # No endpoint in §1.5 is a bulk action, so the bulk-action row of the
  # extraction guide has no instance; every other endpoint pattern is covered.
  # ==========================================================================
  - section: endpoints
    instances:

      - name: endpoints_storage_zone_create_read_and_list_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints[POST /storage-zones]
          - endpoints[GET /storage-zones/{id}]
          - endpoints[GET /storage-zones]
        distinguishing_aspect: "The create-read-list triad round-trips one zone: the POST body is echoed with a computed environmental_status, the single-row GET returns the identical values, and the collection GET reports total_count 2 with has_more false once a second zone exists. §1.5 declares no PATCH or DELETE for any resource, so the CRUD surface is deliberately create-and-read only."
        test_recipe:
          setup:
            - "No zones exist yet."
          setup_api_calls:
            - call: "POST /storage-zones"
              payload: { zone_code: "Z-CRUD-1", temperature_c: 14.0, relative_humidity_pct: 36.0, max_overlapping_migration_jobs: 2 }
              as: PreservationOfficer
              as_user_id: "preserv-a"
              captures: { zone_a_id: $.data.id, zone_a_status: $.data.environmental_status }
            - call: "POST /storage-zones"
              payload: { zone_code: "Z-CRUD-2", temperature_c: 20.0, relative_humidity_pct: 52.0, max_overlapping_migration_jobs: 1 }
              as: PreservationOfficer
              as_user_id: "preserv-a"
              captures: { zone_b_id: $.data.id, zone_b_status: $.data.environmental_status }
          trigger:
            - call: "GET /storage-zones/${zone_a_id}"
              payload: {}
              as: PreservationOfficer
              as_user_id: "preserv-a"
          assert:
            - "HTTP status is 200"
            - "${zone_a_status} == COMPLIANT"
            - "${zone_b_status} == MARGINAL"
            - "StorageZone.${zone_a_id}.zone_code == \"Z-CRUD-1\""
            - "StorageZone.${zone_a_id}.temperature_c == 14.0"
            - "StorageZone.${zone_a_id}.max_overlapping_migration_jobs == 2"
            - "StorageZone.${zone_a_id}.version == 1"
            - "GET /storage-zones returns total_count 2 and has_more false"
            - "GET /storage-zones?environmental_status=MARGINAL returns exactly [${zone_b_id}]"

      - name: endpoints_dispose_series_withdraws_published_finding_aid
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /record-series/{id}/dispose]
          - state_machines.RecordSeries.ELIGIBLE_FOR_DISPOSITION_to_DISPOSED
          - state_machines.FindingAid.PUBLISHED_to_WITHDRAWN
          - calculations.retention_expiry
        distinguishing_aspect: "The full disposal pipeline in one instance: retention_expiry_utc is 2022-12-31T23:59:59.000Z (2020 + 2 years) so the 2026 clock has elapsed, the FINAL appraisal score 21.60 falls below the 90.00 permanence threshold and yields REVIEW, the series moves ACTIVE -> ELIGIBLE_FOR_DISPOSITION on finalize and then to DISPOSED, and the PUBLISHED finding aid is withdrawn as a side effect."
        setup_notes: "SCREENING variant admits brand_heritage_value 2 (score 31.00); the FINAL variant zeroes it and applies PROVENANCE_UNVERIFIED_MULT 0.80 to raw 27, giving 21.60."
        test_recipe:
          setup:
            - "Series with an elapsed retention period, a processed accession, a PUBLISHED finding aid and a finalised non-permanent appraisal."
          setup_api_calls:
            - call: "POST /retention-schedules"
              payload: { code: "EP-01", retention_years: 2, disposition_action: "REVIEW", legal_citation: "Corp Policy 5.1", min_appraisal_score_for_permanent: 90.00 }
              as: ArchivesDirector
              as_user_id: "director-a"
              captures: { sched_id: $.data.id }
            - call: "POST /record-series"
              payload: { title: "Routine Purchase Orders", business_unit: "Procurement", retention_schedule_id: "${sched_id}", sensitivity_ceiling: "INTERNAL", annual_volume_linear_feet: 20, earliest_record_year: 1995, latest_record_year: 2020 }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { series_id: $.data.id, series_v1: $.data.version, expiry: $.data.retention_expiry_utc }
            - call: "POST /storage-zones"
              payload: { zone_code: "Z-EP01", temperature_c: 16.0, relative_humidity_pct: 44.0, max_overlapping_migration_jobs: 1 }
              as: PreservationOfficer
              as_user_id: "preserv-a"
              captures: { zone_id: $.data.id }
            - call: "POST /accessions"
              payload: { record_series_id: "${series_id}", donor_name: "Procurement", transfer_instrument: "INTERNAL_TRANSFER", declared_unit_count: 2 }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { acc_id: $.data.id }
            - call: "POST /archival-items"
              payload: { accession_id: "${acc_id}", storage_zone_id: "${zone_id}", item_label: "PO-1995-2020", unit_count: 2, condition_grade: "GOOD", original_format: "PAPER", sensitivity_level: "INTERNAL" }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { item_id: $.data.id }
            - call: "POST /accessions/${acc_id}/verify-provenance"
              payload: { provenance_statement: "Routine procurement paperwork.", transfer_instrument_reference: "IT-2026-1216" }
              as: Archivist
              as_user_id: "archivist-a"
            - call: "POST /accessions/${acc_id}/process"
              payload: {}
              as: Archivist
              as_user_id: "archivist-a"
            - call: "POST /finding-aids"
              payload: { accession_id: "${acc_id}", title: "Purchase Orders, 1995-2020", arrangement_level: "SERIES", version_label: "v1.0" }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { aid_id: $.data.id }
            - call: "POST /finding-aids/${aid_id}/submit-review"
              payload: {}
              as: Archivist
              as_user_id: "archivist-a"
            - call: "POST /finding-aids/${aid_id}/publish"
              payload: {}
              as: ArchivesDirector
              as_user_id: "director-a"
            - call: "POST /appraisals"
              payload: { record_series_id: "${series_id}", informational_value: 3, evidential_value: 3, brand_heritage_value: 2, uniqueness_factor: 2, provenance_verified: false, expected_series_version: "${series_v1}" }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { appr_id: $.data.id }
            - call: "POST /appraisals/${appr_id}/screen"
              payload: {}
              as: Archivist
              as_user_id: "archivist-a"
              captures: { screening_score: $.data.screening_score }
            - call: "POST /appraisals/${appr_id}/finalize"
              payload: {}
              as: ArchivesDirector
              as_user_id: "director-a"
          trigger:
            - call: "POST /record-series/${series_id}/dispose"
              payload: { disposition_certificate_reference: "DISP-2026-0007" }
              as: ArchivesDirector
              as_user_id: "director-a"
          assert:
            - "HTTP status is 200"
            - "${expiry} == \"2022-12-31T23:59:59.000Z\""
            - "${screening_score} == 31.00"
            - "AppraisalRecord.${appr_id}.final_score == 21.60"
            - "AppraisalRecord.${appr_id}.recommended_disposition == REVIEW"
            - "RecordSeries.${series_id}.disposition_state == DISPOSED"
            - "RecordSeries.${series_id}.disposition_certificate_reference == \"DISP-2026-0007\""
            - "FindingAid.${aid_id}.status == WITHDRAWN"
            - "ArchivalItem.${item_id}.status == ACCESSIONED"

