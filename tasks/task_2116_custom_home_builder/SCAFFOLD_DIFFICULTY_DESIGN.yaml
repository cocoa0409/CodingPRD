  # ===========================================================================
  # Rule 8 - Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: crew_capacity_halfopen_interval_allows_adjacency_rejects_overlap
        grounds:
          - validations[priority=160]
          - errors[ERR_CREW_CAPACITY_CONFLICT]
          - entities.Subcontractor.fields.crew_capacity
          - entities.ScheduleTask.fields.planned_start
          - entities.ScheduleTask.fields.planned_finish
        distinguishing_aspect: |
          Resource = Subcontractor crew, interval semantics = HALF-OPEN [planned_start,
          planned_finish) with an aggregate capacity count: a task starting exactly when the
          previous one finishes (2026-10-15T00:00:00.000Z) is accepted, while a task starting one
          day earlier collides and is rejected because the overlap count reaches crew_capacity 1.
        test_recipe:
          setup:
            - "Subcontractor 'Ridgeline Framing' has crew_capacity 1."
            - "Project P1 is in PLANNING with one PLANNED framing task over 2026-09-01..2026-10-15."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Dana Reyes", email: "dana@example.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Pat Morgan", staff_function: "PROJECT_MANAGER" }
              as: PlatformAdmin
              captures: { pm_id: $.data.id }
            - call: "POST /subcontractors"
              payload: { company_name: "Ridgeline Framing", trade: "FRAMING", lead_time_days: 5, crew_capacity: 1, waiver_required: true }
              as: PlatformAdmin
              captures: { sub_frame_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", address: "18 Kestrel Ridge", contract_type: "FIXED_PRICE", base_contract_amount: 900000.00, target_substantial_completion_date: "2027-06-30T00:00:00.000Z" }
              as: PlatformAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /schedule-tasks"
              payload: { project_id: "${proj_id}", subcontractor_id: "${sub_frame_id}", task_name: "Frame shell", planned_start: "2026-09-01T00:00:00.000Z", planned_finish: "2026-10-15T00:00:00.000Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { task_frame_id: $.data.id }
          trigger:
            - call: "POST /schedule-tasks"
              payload: { project_id: "${proj_id}", subcontractor_id: "${sub_frame_id}", task_name: "Frame punch adjacent", planned_start: "2026-10-15T00:00:00.000Z", planned_finish: "2026-11-01T00:00:00.000Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { task_adj_id: $.data.id }
            - call: "POST /schedule-tasks"
              payload: { project_id: "${proj_id}", subcontractor_id: "${sub_frame_id}", task_name: "Frame punch overlapping", planned_start: "2026-10-14T00:00:00.000Z", planned_finish: "2026-11-01T00:00:00.000Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { err_overlap: $.data.error_id }
          assert:
            - "the adjacent task is created with HTTP 201 and ScheduleTask.${task_adj_id}.status == PLANNED"
            - "the overlapping task returns HTTP 409 with data.error_id == ERR_CREW_CAPACITY_CONFLICT"
            - "GET /schedule-tasks with subcontractor_id == ${sub_frame_id} returns total_count == 2"

      - name: jobsite_exclusive_closed_interval_plus_cure_buffer_rejects_adjacency
        grounds:
          - validations[priority=165]
          - errors[ERR_JOBSITE_EXCLUSIVE_CONFLICT]
          - entities.ScheduleTask.fields.exclusive_use
          - entities.ScheduleTask.fields.planned_finish
        distinguishing_aspect: |
          Resource = Project jobsite (a different resource entity from the subcontractor crew) and
          interval semantics = CLOSED interval extended by JOBSITE_CURE_BUFFER_DAYS = 1 on the
          upper end: the occupied window of a slab poured 2026-09-01..2026-09-10 runs through
          2026-09-11 inclusive, so a second exclusive task starting 2026-09-11 is rejected while
          one starting 2026-09-12 is accepted - the opposite adjacency verdict from the half-open
          crew rule.
        test_recipe:
          setup:
            - "Subcontractor 'Granite Flatwork' has crew_capacity 3, so the crew rule can never fire in this instance."
            - "Project P1 is in PLANNING with one exclusive_use CONCRETE task over 2026-09-01..2026-09-10."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Dana Reyes", email: "dana@example.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Pat Morgan", staff_function: "PROJECT_MANAGER" }
              as: PlatformAdmin
              captures: { pm_id: $.data.id }
            - call: "POST /subcontractors"
              payload: { company_name: "Granite Flatwork", trade: "CONCRETE", lead_time_days: 2, crew_capacity: 3, waiver_required: false }
              as: PlatformAdmin
              captures: { sub_conc_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", address: "18 Kestrel Ridge", contract_type: "FIXED_PRICE", base_contract_amount: 900000.00, target_substantial_completion_date: "2027-06-30T00:00:00.000Z" }
              as: PlatformAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /schedule-tasks"
              payload: { project_id: "${proj_id}", subcontractor_id: "${sub_conc_id}", task_name: "Slab pour", planned_start: "2026-09-01T00:00:00.000Z", planned_finish: "2026-09-10T00:00:00.000Z", exclusive_use: true }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { task_slab_id: $.data.id }
          trigger:
            - call: "POST /schedule-tasks"
              payload: { project_id: "${proj_id}", subcontractor_id: "${sub_conc_id}", task_name: "Driveway pour touching the cure buffer", planned_start: "2026-09-11T00:00:00.000Z", planned_finish: "2026-09-20T00:00:00.000Z", exclusive_use: true }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { err_buffer: $.data.error_id }
            - call: "POST /schedule-tasks"
              payload: { project_id: "${proj_id}", subcontractor_id: "${sub_conc_id}", task_name: "Driveway pour clear of the cure buffer", planned_start: "2026-09-12T00:00:00.000Z", planned_finish: "2026-09-20T00:00:00.000Z", exclusive_use: true }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { task_drive_id: $.data.id }
          assert:
            - "the 2026-09-11 start returns HTTP 409 with data.error_id == ERR_JOBSITE_EXCLUSIVE_CONFLICT"
            - "the 2026-09-12 start is created with HTTP 201 and ScheduleTask.${task_drive_id}.exclusive_use == true"
            - "GET /schedule-tasks with project_id == ${proj_id} returns total_count == 2"

  # ===========================================================================
  # Rule 9 - Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: change_order_void_restores_contract_sum_exactly
        grounds:
          - state_machines.ChangeOrder.SUBMITTED_to_APPROVED
          - state_machines.ChangeOrder.APPROVED_to_VOIDED
          - state_machines.AllowanceItem.FROZEN_to_OPEN
          - calculations.project_contract_position
          - entities.Project.fields.contract_sum_current
        distinguishing_aspect: |
          Conserved quantity = the contract revenue sum, pinned as
          Project.contract_sum_current == base_contract_amount + sum(ChangeOrder.priced_amount
          where status == APPROVED) + allowance_variance_total. Approving then voiding the same
          change order must land contract_sum_current back on exactly 900000.00 with zero drift,
          and must unwind the posture and allowance freeze it caused.
        test_recipe:
          setup:
            - "Project is UNDER_CONSTRUCTION with base_contract_amount 900000.00 and gmp_cap 950000.00."
            - "One AllowanceItem is OPEN before the change order is approved."
            - "A ChangeOrder priced at 50315.50 has been approved, so contract_sum_current is 950315.50, budget_posture is OVER_GMP and the allowance item is FROZEN."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Dana Reyes", email: "dana@example.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Pat Morgan", staff_function: "PROJECT_MANAGER" }
              as: PlatformAdmin
              captures: { pm_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Elle Sato", staff_function: "ESTIMATOR" }
              as: PlatformAdmin
              captures: { est_id: $.data.id }
