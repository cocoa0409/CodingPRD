      - name: crl_publication_is_append_only_and_carries_no_version_field
        claim_type: immutability
        grounds:
          - entities.CrlPublication
          - endpoints[POST /ca/certificate-profiles/{id}/crl-publications]
          - endpoints[GET /ca/certificate-profiles/{id}/crl-publications]
          - calculations.crl_publication_drain
        distinguishing_aspect: "CrlPublication is declared common_fields false: the 201 body exposes crl_number, entry_count and revoked_serials but no version and no updated_at, and §1.5 declares no PATCH or DELETE for the resource - the only way to change the series is to append a new publication."
        test_recipe:
          setup:
            - "One ACTIVE DV profile with no revoked certificates; the first publication therefore drains an empty queue, which is legal."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: POLICY_ADMIN
