            - { call: "POST /midway/operating-days/${day_b}/open-gates", payload: {}, as: FairManager, as_user_id: "${sup_b}" }
            - { call: "POST /midway/ticket-products", payload: { fair_id: "${fair_a}", name: "Credits A", kind: "CREDIT_BUNDLE", base_price_cents: 100 }, as: FairManager, as_user_id: "${sup_a}", captures: { prod_a: "$.data.id" } }
            - { call: "POST /midway/ticket-sales", payload: { product_id: "${prod_a}", operating_day_id: "${day_a}", quantity: 3, holder_height_in: 60 }, as: TicketClerk, as_user_id: "${clerk_a}", captures: { sale_a: "$.data.id" } }
          trigger:
