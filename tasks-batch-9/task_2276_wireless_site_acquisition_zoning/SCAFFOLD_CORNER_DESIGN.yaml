  # =========================================================================
  - section: errors
    instances:
      - name: corner_unknown_path_ids_return_entity_specific_not_found
        claim_type: triggerability
        grounds:
          - validations[priority=5]
          - errors[ERR_SEARCH_RING_NOT_FOUND]
          - errors[ERR_ON_AIR_PLAN_NOT_FOUND]
        distinguishing_aspect: "Each single-entity read resolves to its own 404 code rather than a generic one: the same unknown UUID returns ERR_SEARCH_RING_NOT_FOUND, ERR_CANDIDATE_NOT_FOUND, ERR_LANDLORD_NOT_FOUND, ERR_JURISDICTION_NOT_FOUND, ERR_LEASE_NOT_FOUND, ERR_ZONING_APPLICATION_NOT_FOUND, ERR_STRUCTURAL_ANALYSIS_NOT_FOUND, ERR_MODIFICATION_DESIGN_NOT_FOUND, ERR_ENVIRONMENTAL_REVIEW_NOT_FOUND, ERR_PERMIT_NOT_FOUND, ERR_UTILITY_PROVIDER_NOT_FOUND, ERR_BACKHAUL_ORDER_NOT_FOUND and ERR_ON_AIR_PLAN_NOT_FOUND on its own path."
        test_recipe:
          setup:
            - "empty database, logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "GET /search-rings/00000000-0000-0000-0000-0000000000ff"
              as: ProgramDirector
              captures: { err_ring: $.data.error_id }
            - call: "GET /candidates/00000000-0000-0000-0000-0000000000ff"
              as: ProgramDirector
              captures: { err_cand: $.data.error_id }
            - call: "GET /on-air-plans/00000000-0000-0000-0000-0000000000ff"
              as: ProgramDirector
              captures: { err_plan: $.data.error_id }
          assert:
            - "every read returns status 404"
            - "the search-ring read returns error_id == ERR_SEARCH_RING_NOT_FOUND"
            - "the candidate read returns error_id == ERR_CANDIDATE_NOT_FOUND"
            - "the on-air-plan read returns error_id == ERR_ON_AIR_PLAN_NOT_FOUND"
            - "each error body carries exactly the fields error_id and message under data"

      - name: corner_missing_role_header_returns_unauthenticated
        claim_type: triggerability
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Authentication precedes everything: a POST /search-rings with a valid body but no X-User-Role header returns 401 ERR_UNAUTHENTICATED before any field or business check runs, and no ring is created."
        test_recipe:
          setup:
            - "empty database, logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /search-rings"
              payload: { name: "Ring 2276-A", market_code: "MKT-NE-01", center_lat: 42.3500, center_lon: -71.0600, radius_m: 800, required_agl_m: 45, objective_type: "COVERAGE_AND_CAPACITY", target_rsrp_dbm: -95, target_capacity_gbps: 10, market_benchmark_monthly_rent_usd: 2400.00, capex_budget_usd: 250000.00, priority_rank: 1 }
              as: NONE
              captures: { err: $.data.error_id }
          assert:
            - "response status == 401"
            - "error_id == ERR_UNAUTHENTICATED"
            - "GET /search-rings as ProgramDirector returns total_count == 0"

      - name: corner_invalid_pagination_limit_rejected
        claim_type: triggerability
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_PAGINATION]
          - response_envelope.pagination_defaults
        distinguishing_aspect: "limit 101 exceeds the declared maximum of 100, so the list read returns 400 ERR_INVALID_PAGINATION instead of silently clamping; limit 100 is accepted."
        test_recipe:
          setup:
            - "empty database, logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "GET /search-rings"
              payload: { limit: 101, offset: 0 }
              as: ProgramDirector
              captures: { err: $.data.error_id }
            - call: "GET /search-rings"
              payload: { limit: 100, offset: 0 }
              as: ProgramDirector
          assert:
            - "the first read returns status 400 with error_id == ERR_INVALID_PAGINATION"
            - "the second read returns status 200 with limit == 100, offset == 0, total_count == 0, has_more == false"

