  # ===========================================================================
  # From Table 6 (Errors) — every catalogue code must be triggerable
  # ===========================================================================
  - section: errors
    instances:

      - name: identity_headers_are_the_outermost_gate
        claim_type: violation_to_error
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_INVALID_ROLE]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - validations[priority=1]
          - validations[priority=2]
          - validations[priority=3]
        distinguishing_aspect: "The three header failures are distinct and strictly ordered: an absent header is 401, a header naming a role outside the declared five is 403 ERR_INVALID_ROLE, and a real role hitting an endpoint it does not own is 403 ERR_ROLE_NOT_PERMITTED — a malformed body never gets a chance to be reported."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One malt product exists so the target endpoint has a valid payload available."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /malt-products"
              payload: { sku: "PALE-ALE", name: "Pale Ale Malt", malt_class: "BASE", list_price_cents_per_lb: 68.50, max_moisture_pct: 5.0, min_diastatic_power: 60.0, pallet_quantity_lbs: 2200, min_order_lbs: 55 }
              as: WarehouseOperator
              captures: { hg_prod_id: $.data.id }
          trigger:
            - call: "POST /malt-lots"
              payload: { malt_product_id: "${hg_prod_id}", lot_code: "LOT-HG-1", quantity_lbs: 1000 }
              as: NONE
              as_user_id: ""
              captures: { hg_err_401: $.data.error_id }
            - call: "POST /malt-lots"
              payload: { malt_product_id: "${hg_prod_id}", lot_code: "LOT-HG-1", quantity_lbs: 1000 }
              as: Sommelier
              as_user_id: "someone"
              captures: { hg_err_role: $.data.error_id }
            - call: "POST /malt-lots"
              payload: { malt_product_id: "${hg_prod_id}", lot_code: "LOT-HG-1", quantity_lbs: 1000 }
              as: CreditManager
              captures: { hg_err_perm: $.data.error_id }
            - call: "POST /malt-lots"
              payload: { quantity_lbs: 1000 }
              as: CreditManager
              captures: { hg_err_perm_over_shape: $.data.error_id }
            - call: "POST /malt-lots"
              payload: { malt_product_id: "${hg_prod_id}", lot_code: "LOT-HG-1", quantity_lbs: 1000 }
              as: WarehouseOperator
              captures: { hg_lot_id: $.data.id }
          assert:
            - "no identity headers: HTTP 401 with ${hg_err_401} == ERR_UNAUTHENTICATED"
            - "unknown role Sommelier: HTTP 403 with ${hg_err_role} == ERR_INVALID_ROLE"
            - "CreditManager on a WarehouseOperator-only endpoint: HTTP 403 with ${hg_err_perm} == ERR_ROLE_NOT_PERMITTED"
            - "CreditManager with a malformed body: HTTP 403 with ${hg_err_perm_over_shape} == ERR_ROLE_NOT_PERMITTED — priority 3 outranks priority 4, so the missing malt_product_id is never reported"
            - "WarehouseOperator with the same body: HTTP 201 and MaltLot.${hg_lot_id}.status == RECEIVED"
            - "GET /malt-lots with no headers is also 401 — the gate covers reads as well as writes"

      - name: every_unresolved_reference_names_its_own_entity
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CROP_YEAR_PROGRAM_NOT_FOUND]
          - errors[ERR_HOP_CONTRACT_NOT_FOUND]
          - errors[ERR_SUBSTITUTION_OFFER_NOT_FOUND]
          - errors[ERR_BREWER_RECIPE_NOT_FOUND]
          - errors[ERR_YEAST_JOB_NOT_FOUND]
          - errors[ERR_COLD_STORAGE_ZONE_NOT_FOUND]
          - errors[ERR_COLD_CHAIN_SHIPMENT_NOT_FOUND]
          - validations[priority=5]
          - validations[priority=7]
        distinguishing_aspect: "Each unresolved id reports the code for the SEGMENT that failed rather than a generic 404, and a body-borne foreign key is judged by the same rule as a path id — so a contract creation naming a phantom program blames the program, not the contract."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One brewer, one Citra variety and one WLP001 strain exist; nothing else."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Dangling Reference Brewing", brewery_license_no: "BR-1046", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: true, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { dr_id: $.data.id }
            - call: "POST /hop-varieties"
              payload: { variety_code: "CITRA", name: "Citra", substitution_group: "AROMA_HIGH_ALPHA", alpha_acid_target_pct: 12.50, spot_price_cents_per_lb: 51.00, available_spot_lbs: 20000, cold_storage_required: true, pallet_quantity_lbs: 880, min_order_lbs: 44 }
              as: AllocationManager
              captures: { dr_citra_id: $.data.id }
            - call: "POST /yeast-strains"
              payload: { strain_code: "WLP001", name: "California Ale", fermentation_type: "ALE", propagation_lead_time_days: 7, list_price_cents_per_l: 1200.00, viability_pct_at_ship: 92.0, cells_per_ml_slurry_billion: 1.2, min_batch_l: 20.0, vessel_max_l: 2000.0 }
              as: WarehouseOperator
              captures: { dr_strain_id: $.data.id }
          trigger:
            - call: "POST /hop-contracts"
              payload: { brewer_id: "${dr_id}", variety_id: "${dr_citra_id}", crop_year_program_id: "00000000-0000-4000-8000-000000000901", contract_type: "FIXED_CROP_YEAR", contracted_lbs: 5000, price_per_lb_cents: 250.00, delivery_window_start: "2026-09-01T00:00:00Z", delivery_window_end: "2026-12-31T00:00:00Z" }
              as: AllocationManager
              captures: { dr_err_program: $.data.error_id }
            - call: "GET /hop-contracts/00000000-0000-4000-8000-000000000902"
              payload: {}
              as: AllocationManager
              captures: { dr_err_contract: $.data.error_id }
            - call: "GET /substitution-offers/00000000-0000-4000-8000-000000000903"
              payload: {}
              as: AllocationManager
              captures: { dr_err_offer: $.data.error_id }
            - call: "POST /yeast-propagation-jobs"
              payload: { brewer_id: "${dr_id}", recipe_id: "00000000-0000-4000-8000-000000000904", yeast_strain_id: "${dr_strain_id}", pitch_date: "2026-08-20T00:00:00Z" }
              as: WarehouseOperator
              captures: { dr_err_recipe: $.data.error_id }
            - call: "GET /yeast-propagation-jobs/00000000-0000-4000-8000-000000000905"
              payload: {}
              as: WarehouseOperator
              captures: { dr_err_job: $.data.error_id }
            - call: "GET /cold-storage-zones/00000000-0000-4000-8000-000000000906"
              payload: {}
              as: WarehouseOperator
              captures: { dr_err_zone: $.data.error_id }
            - call: "GET /cold-chain-shipments/00000000-0000-4000-8000-000000000907"
              payload: {}
              as: WarehouseOperator
              captures: { dr_err_shipment: $.data.error_id }
          assert:
            - "contract creation with a phantom program: HTTP 404 with ${dr_err_program} == ERR_CROP_YEAR_PROGRAM_NOT_FOUND, and no HopContract row is created"
            - "${dr_err_contract} == ERR_HOP_CONTRACT_NOT_FOUND, ${dr_err_offer} == ERR_SUBSTITUTION_OFFER_NOT_FOUND, ${dr_err_job} == ERR_YEAST_JOB_NOT_FOUND, ${dr_err_zone} == ERR_COLD_STORAGE_ZONE_NOT_FOUND and ${dr_err_shipment} == ERR_COLD_CHAIN_SHIPMENT_NOT_FOUND, all HTTP 404"
            - "propagation request with a phantom recipe: HTTP 404 with ${dr_err_recipe} == ERR_BREWER_RECIPE_NOT_FOUND — priority 7 blames the body-borne FK, and the request never reaches the priority 10 strain-recipe agreement check"
            - "GET /hop-contracts returns total_count 0 — none of the seven refusals wrote anything"

      - name: a_line_id_from_another_order_is_not_found
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ORDER_LINE_NOT_FOUND]
          - endpoints[DELETE /sales-orders/{id}/lines/{line_id}]
        distinguishing_aspect: "The nested line id is resolved WITHIN the named order, so a line that genuinely exists but hangs off a different order is reported as not found rather than deleted from its real parent — cross-order deletion is impossible even between two orders of the same brewer."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One brewer; ambient PALE-ALE with a RELEASED 5000 lb lot; two DRAFT orders, each holding one 1000 lb malt line."
