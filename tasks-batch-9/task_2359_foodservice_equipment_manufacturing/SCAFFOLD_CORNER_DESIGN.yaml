              as_user_id: "ce-1"
          trigger:
            - call: "POST /certification-listings/${listing_id}/agency-decisions"
              payload: { decision: "GRANT" }
              as: ListingReviewer
              as_user_id: "lr-1"
              captures: { err: $.data.error_id }
          assert:
