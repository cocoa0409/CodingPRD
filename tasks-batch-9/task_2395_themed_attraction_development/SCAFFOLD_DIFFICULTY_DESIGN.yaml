          setup:
            - "Project at design_phase DESIGN_DEVELOPMENT with budget_ceiling_cents 3600000000 and one APPROVED DesignPackage, so committed_cost_cents is 3080000000 and readiness_posture is OPEN."
            - "restricted_utilisation_cents is floor(3600000000 * 90 / 100) = 3240000000, so 160000000 of change order lands exactly on the threshold."
