  - rule_id: combinatorial_formula
    instances:
      - name: per_bag_fee_rounded_half_up_before_summation
        grounds:
          - calculations.bag_processing_fee
          - entities.SealedBag.fields.processing_fee_cents
          - entities.DepositTicket.fields.processing_fee_total_cents
          - state_machines.CountSession.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          Mode (b) nested-rounding-order instance: two bags whose raw fees are exactly
          253.50 and 260.50 cents. Rounding half-up per bag first and then summing
          yields 515; summing first (514.00) and rounding once yields 514. The scaffold
          pins per-bag-then-sum, so processing_fee_total_cents must be 515.
        test_recipe:
          setup:
            - "Vault CV-03 OPEN; CustomerAccount ACC-3001 tier STANDARD; machine SORT-C CURRENCY_SORTER."
            - "Ticket MAN-301 with 2 bags both VAULT_RECEIVED and VERIFIED; bag S-3001 counted over exactly 100 notes, bag S-3002 counted over exactly 300 notes, no coin weight, neither MIXED."
            - "Session for bag S-3001 already COMPLETED; session for bag S-3002 IN_PROGRESS."
