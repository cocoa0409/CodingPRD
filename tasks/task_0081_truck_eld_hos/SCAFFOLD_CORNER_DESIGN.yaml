  # =========================================================================
  # Section: rbac
  # =========================================================================
  - section: rbac
    instances:
      - name: driver_cannot_create_driver
        claim_type: rbac_denial
        grounds: [roles, "validations[priority=2]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "POST /eld/drivers is a CarrierAdmin exclusive op; a Driver caller -> 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["A driver D exists to provide a valid X-User-ID."]
          setup_api_calls:
            - call: "POST /eld/drivers"
              payload: { license_number: "CDL-Z28", full_name: "RBAC Driver", home_terminal_tz_offset_minutes: 0 }
              as: CarrierAdmin
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /eld/drivers"
              payload: { license_number: "CDL-Z29", full_name: "Sneaky" }
              as: Driver
              as_user_id: "${d_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Status 403 with data.error_id == ERR_UNAUTHORIZED."
      - name: carrieradmin_cannot_approve_adverse_claim
        claim_type: peer_roles_isolation
        grounds: [roles, "validations[priority=2]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "approve is a SafetyOfficer exclusive op; a CarrierAdmin -> 403 ERR_UNAUTHORIZED (peer role cannot touch another role's exclusive op)."
        test_recipe:
          setup: ["A PENDING adverse claim exists."]
          setup_api_calls:
            - call: "POST /eld/drivers"
              payload: { license_number: "CDL-Z30", full_name: "Claim Driver", home_terminal_tz_offset_minutes: 0 }
              as: CarrierAdmin
              captures: { d_id: $.data.id }
            - call: "POST /eld/adverse-claims"
              payload: { driver_id: "${d_id}", log_date: "2026-06-01", reason: "WEATHER", narrative: "Fog." }
              as: Driver
              as_user_id: "${d_id}"
              captures: { claim_id: $.data.id, claim_v0: $.data.version }
          trigger:
            - call: "POST /eld/adverse-claims/${claim_id}/approve"
              payload: { expected_adverseconditionsclaim_version: "${claim_v0}" }
              as: CarrierAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Status 403 with data.error_id == ERR_UNAUTHORIZED; claim remains PENDING."
      - name: missing_role_header_unauthenticated
        claim_type: unauthenticated
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request whose X-User-Role is missing/invalid -> 401 ERR_UNAUTHENTICATED."
        test_recipe:
