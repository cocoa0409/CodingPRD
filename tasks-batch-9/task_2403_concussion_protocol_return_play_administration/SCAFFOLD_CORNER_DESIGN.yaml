  - section: errors
    instances:
      - name: error_envelope_is_uniform_when_requests_are_rejected
        claim_type: error_triggerable
        grounds:
          - response_envelope.error
          - errors.ERR_INVALID_REQUEST
          - errors.ERR_UNIQUENESS_VIOLATION
          - errors.ERR_RESOURCE_NOT_FOUND
        distinguishing_aspect: "Three different error families share one envelope: each response carries response_type error with data.error_id and data.message and no data payload fields, the HTTP statuses are 400 / 409 / 404 respectively, and none of the three attempts leaves a row behind."
        test_recipe:
          setup: ["Harbor City registered with market_code HCK"]
          setup_api_calls:
            - *k_clock_aug1
            - *k_club_h
          trigger:
            - call: "POST /concussion-program/clubs"
              payload: { market_code: "ZZZ", exemption_slots_total: 2 }
              as: LeagueAdmin
              captures: { err_invalid: $.data.error_id }
            - call: "POST /concussion-program/clubs"
              payload: { name: "Harbor City Imposters", market_code: "HCK" }
              as: LeagueAdmin
              captures: { err_dupe: $.data.error_id }
            - call: "GET /concussion-program/baseline-tests/00000000-0000-0000-0000-000000000000"
              as: LeagueAdmin
              captures: { err_missing: $.data.error_id }
          assert:
            - "trigger 1: response status 400, ${err_invalid} == ERR_INVALID_REQUEST (name is required and has no default)"
            - "trigger 2: response status 409, ${err_dupe} == ERR_UNIQUENESS_VIOLATION"
            - "trigger 3: response status 404, ${err_missing} == ERR_RESOURCE_NOT_FOUND (not a Player- or Club-specific code)"
            - "all three: response_type == error, data contains exactly error_id and message, and meta.api_request_id / meta.api_request_timestamp are still present"
            - "GET /concussion-program/clubs returns meta.total_count == 1 (only Harbor City)"

      - name: frozen_case_stage_write_error_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_CASE_STAGE_FROZEN
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / frozen_case_state_error_precedes_stage_sequence_error
          rationale: "That §1.8 instance triggers ERR_CASE_STAGE_FROZEN on a sanctioned club's frozen case and pins its precedence over the stage-sequence error."

      - name: consultant_exam_window_conflict_error_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_INC_EXAM_WINDOW_CONFLICT
        excluded_because:
          difficulty_instance: resource_temporal_overlap / consultant_exam_block_closed_interval_rejects_touching_start
          rationale: "That §1.8 instance triggers ERR_INC_EXAM_WINDOW_CONFLICT at the exact closed-interval boundary of the consultant's 30-minute block."

      - name: stage_rest_buffer_error_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_STAGE_REST_BUFFER_VIOLATION
        excluded_because:
          difficulty_instance: resource_temporal_overlap / stage_rest_buffer_half_open_admits_exact_boundary_start
          rationale: "That §1.8 instance triggers ERR_STAGE_REST_BUFFER_VIOLATION one second before the buffer elapses and shows the boundary second succeeding."

      - name: rtp_stages_incomplete_error_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_RTP_STAGES_INCOMPLETE
          - errors.ERR_NO_RETURN_STEPS_RECORDED
        excluded_because:
          difficulty_instance: boundary_precision_check / inc_clearance_request_empty_versus_partial_step_collection
          rationale: "That §1.8 instance separates the empty-collection error from the partial-collection error on the same endpoint."

      - name: symptom_outcome_mismatch_error_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_SYMPTOM_OUTCOME_MISMATCH
        excluded_because:
          difficulty_instance: boundary_precision_check / stage_pass_symptom_score_at_recurrence_threshold_boundary
          rationale: "That §1.8 instance triggers ERR_SYMPTOM_OUTCOME_MISMATCH at symptom_score 4 and shows 3 passing."

      - name: club_fine_cap_error_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_CLUB_FINE_CAP_EXCEEDED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / findings_segregation_of_duties_error_precedes_fine_cap_error
          rationale: "That §1.8 instance triggers ERR_CLUB_FINE_CAP_EXCEEDED once the segregation-of-duties check is satisfied by a distinct auditor."
  - section: rbac
    instances:
      - name: missing_role_header_rejected
        claim_type: role_denied_operations
        grounds:
          - validations.priority_1
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "Authentication precedes everything: a read of an existing club with no X-User-Role or X-User-ID header returns ERR_UNAUTHENTICATED (401) rather than the club body, and an unrecognised role string is refused the same way."
        test_recipe:
          setup: ["Harbor City registered"]
          setup_api_calls:
            - *k_clock_aug1
            - *k_club_h
          trigger:
            - call: "GET /concussion-program/clubs/${club_h_id}"
              as: "(no X-User-Role and no X-User-ID header sent)"
            - call: "GET /concussion-program/clubs/${club_h_id}"
              as: "(X-User-Role: TeamOwner, an unknown role, with X-User-ID: someone)"
          assert:
            - "both triggers: response status 401 with error_id ERR_UNAUTHENTICATED and response_type == error"
            - "no data payload is returned for either call"

      - name: club_physician_cannot_open_protocol_audit
        claim_type: role_denied_operations
        grounds:
          - roles.LeagueAuditor.exclusive_operations
          - validations.priority_2
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "Opening an audit is the auditor's exclusive operation: a fully credentialed club physician calling POST /protocol-audits is refused with ERR_UNAUTHORIZED (403) and no audit row appears."
        test_recipe:
          setup: ["Harbor City with Dr Vance credentialed"]
          setup_api_calls:
            - *k_clock_aug1
            - *k_club_h
            - *k_doc_h
          trigger:
            - call: "POST /concussion-program/protocol-audits"
              payload: { club_id: "${club_h_id}" }
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
          assert:
            - "response status 403 with error_id ERR_UNAUTHORIZED"
            - "GET /concussion-program/protocol-audits?club_id=${club_h_id} returns meta.total_count == 0"
            - "Club.${club_h_id}.open_violation_count == 0"

      - name: club_physician_cannot_claim_observer_trigger_source
        claim_type: role_denied_operations
        grounds:
          - roles.UnaffiliatedObserver.exclusive_operations
