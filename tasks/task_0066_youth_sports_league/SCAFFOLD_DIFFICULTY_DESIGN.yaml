scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: seeding_variant_diverges_from_draft_picks_on_team_domain
    grounds:
    - calculations.playoff_seeding
    - state_machines.League.SEASON_to_PLAYOFFS
    - entities.Team.fields.seed
    distinguishing_aspect: 'Two valid seeding algorithms (win_pct DESC vs total-wins DESC) assign DIFFERENT seeds to the same Teams: with X at 1-0 (1.000, 1 win) and Y at 3-1 (.750, 3 wins), win_pct seeding gives X seed 1 / Y seed 2, while total-wins seeding gives Y seed 1 / X seed 2 — the divergence is on the Team domain.'
    test_recipe:
      setup:
      - League in SEASON, draft_snake=true so win_pct_seeding applies; one division with three teams X,Y,Z (slots 1,2,3).
      - FINAL regular games yield X 1-0, Y 3-1, Z 0-3.
      setup_api_calls:
      - call: POST /leagues
        payload:
          name: Spring
          season_year: 2026
          age_cutoff_date: '2026-08-31'
          registration_open_iso: '2026-01-01T00:00:00Z'
          registration_close_iso: '2026-12-31T00:00:00Z'
          draft_snake: true
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          lg: $.data.id
      - call: POST /divisions
        payload:
          league_id: ${lg}
          name: Majors
          min_league_age: 9
          max_league_age: 12
          roster_cap: 12
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          div: $.data.id
      - call: POST /teams
        payload:
          league_id: ${lg}
          division_id: ${div}
          name: X
          coach_user_id: cx
          draft_slot: 1
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          tx: $.data.id
      - call: POST /teams
        payload:
          league_id: ${lg}
          division_id: ${div}
          name: Y
          coach_user_id: cy
          draft_slot: 2
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          ty: $.data.id
      - call: POST /teams
        payload:
          league_id: ${lg}
          division_id: ${div}
          name: Z
          coach_user_id: cz
          draft_slot: 3
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          tz: $.data.id
      - call: POST /fields
        payload:
          league_id: ${lg}
          name: Field 1
          turnover_buffer_minutes: 30
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          fld: $.data.id
      - call: POST /referees
        payload:
          league_id: ${lg}
          user_id: ref-1
          full_name: Ref One
          max_games_per_day: 10
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          ref: $.data.id
      - call: POST /leagues/${lg}/advance
        payload:
          target: REGISTRATION
        as: LeagueAdmin
        as_user_id: admin-1
      - call: POST /leagues/${lg}/advance
        payload:
          target: EVALUATION
        as: LeagueAdmin
        as_user_id: admin-1
      - call: POST /leagues/${lg}/advance
        payload:
          target: DRAFT
        as: LeagueAdmin
        as_user_id: admin-1
      - call: POST /leagues/${lg}/advance
        payload:
          target: SEASON
        as: LeagueAdmin
        as_user_id: admin-1
      - call: POST /games
        payload:
          league_id: ${lg}
          division_id: ${div}
          home_team_id: ${tx}
          away_team_id: ${ty}
          field_id: ${fld}
