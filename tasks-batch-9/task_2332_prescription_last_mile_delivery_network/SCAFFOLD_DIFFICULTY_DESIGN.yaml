        grounds:
          - state_machines.ExceptionCase.UNDER_REVIEW_to_RESHIP_AUTHORIZED
          - entities.Delivery.fields.reship_of_delivery_id
          - calculations.window_slot_occupancy
          - entities.PlanGrant.fields.status
        cascade_depth: 4
        cascade_chain: |
          POST /exception-cases/{id}/adjudicate {disposition: RESHIP}
            L1 case.status := RESHIP_AUTHORIZED -> a replacement Delivery is created on the
               reship window with reship_of_delivery_id = the original delivery
              L2 BECAUSE that Delivery was created -> a PROVISIONAL FeeAllocation is computed for it
                L3 BECAUSE that allocation was created -> PlanGrant.committed_cents 150 -> 300
                  L4 BECAUSE committed_cents rose to the full budget -> remaining_cents := 0 and
                     PlanGrant.status := EXHAUSTED
