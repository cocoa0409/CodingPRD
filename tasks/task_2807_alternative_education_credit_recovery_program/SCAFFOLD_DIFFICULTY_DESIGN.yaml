  - rule_id: compensating_invariant
    instances:
      - name: void_award_restores_credit_ledger_and_gpa
        conserved_quantity: "the student's credit ledger (GraduationPlan.credits_earned == Student.credits_earned_total == PASSED prior credits + POSTED award credits), together with gpa and PriorCourseRecord.replacement_status"
        grounds:
          - calculations.credit_ledger_invariant
          - state_machines.CreditAward.POSTED_to_VOIDED
          - state_machines.GraduationPlan.COMPLETED_to_ACTIVE
          - calculations.transcript_gpa
          - calculations.cohort_accountability
          - endpoints[POST /credit-awards/{credit_award_id}/void]
        distinguishing_aspect: |
          The void is a true compensation, not a second forward transition: every value the four-hop
          award cascade moved returns to its exact pre-award reading (credits_earned 0.00, gpa 0.00
          from the un-replaced F row, alt_ed_credits 0.00, prior record NOT_REPLACED, plan back to
          ACTIVE with posture OFF_TRACK, student back to PLACED_ALT, home-school adjusted_grad_rate
          back to 0.0000 with cohort_flag PRIORITY) while the enrollment returns to
          SUBMITTED_FOR_AWARD rather than IN_PROGRESS and every version counter still moves forward.
          Drift of a single hundredth, or a plan left COMPLETED, fails.
        test_recipe:
          setup:
            - "one home school with accountability_cohort_year 2026 and one center with seat_capacity 10, certified_teacher_fte 4.00, max_students_per_teacher 12"
            - "one PACKET course ALG1 with credit_value 1.00, total_modules 8, proctoring_required false"
            - "one grade-12 student in cohort_year 2026 with a FAILED ALG1 PriorCourseRecord (original_percent 48.00, grade F, credits_attempted 1.00)"
            - "an ACTIVE plan with required_credits_total 1.00 and grade_replacement_policy REPLACE_ON_RECOVERY"
            - "a COMPETENCY placement whose CREDIT_RECOVERY enrollment was submitted at final_percent 84.00 and awarded 1.00 credit, so the plan is COMPLETED, the student is GRADUATED, gpa is 3.00 and the home school reads adjusted_grad_rate 1.0000 / cohort_flag COMPLIANT"
          setup_api_calls:
            - call: "POST /home-schools"
              payload: { name: "North High", district_code: "NHS-01", accountability_cohort_year: 2026 }
              as: DistrictAdmin
              captures: { hs_id: $.data.id }
            - call: "POST /centers"
              payload: { name: "Cedar AEC", seat_capacity: 10, certified_teacher_fte: 4.00, support_staff_fte: 2.00, max_students_per_teacher: 12 }
              as: DistrictAdmin
              captures: { ctr_id: $.data.id, ctr_v1: $.data.version }
            - call: "POST /courses"
              payload: { code: "ALG1", title: "Algebra I", subject_area: "MATH", credit_value: 1.00, modality: "PACKET", total_modules: 8, required_seat_hours: 60.00, pacing_days: 40, proctoring_required: false, ncaa_approved: false, min_passing_percent: 60.00 }
              as: DistrictAdmin
              captures: { crs_id: $.data.id }
            - call: "POST /students"
              payload: { home_school_id: "${hs_id}", state_student_id: "S-9801", full_name: "Yara Chen", cohort_year: 2026, grade_level: 12 }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /prior-course-records"
              payload: { student_id: "${stu_id}", course_id: "${crs_id}", term_code: "2025-S1", original_percent: 48.00, credits_attempted: 1.00, outcome: "FAILED" }
              as: Registrar
              captures: { pcr_id: $.data.id }
            - call: "POST /graduation-plans"
              payload: { student_id: "${stu_id}", required_credits_total: 1.00, grade_replacement_policy: "REPLACE_ON_RECOVERY", projected_completion_term: "2026-S2" }
              as: Registrar
              captures: { plan_id: $.data.id }
            - call: "POST /graduation-plans/${plan_id}/activate"
              payload: {}
              as: Registrar
              captures: { plan_v1: $.data.version }
            - call: "POST /referrals"
              payload: { student_id: "${stu_id}", center_id: "${ctr_id}", pathway: "CREDIT_DEFICIENCY", deficiency_credits: 1.00, behavior_incident_count: 0, days_disengaged: 0 }
              as: HomeSchoolCounselor
              as_user_id: "${hs_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/screen"
              payload: {}
              as: PlacementCoordinator
              as_user_id: "${ctr_id}"
            - call: "POST /referrals/${ref_id}/offer"
              payload: { offer_valid_days: 10, expected_center_version: "${ctr_v1}" }
              as: PlacementCoordinator
              as_user_id: "${ctr_id}"
            - call: "POST /referrals/${ref_id}/accept-offer"
              payload: { credit_policy: "COMPETENCY", start_date: "2026-08-03" }
              as: HomeSchoolCounselor
              as_user_id: "${hs_id}"
              captures: { pl_id: $.data.id, pl_v1: $.data.version }
            - call: "POST /course-enrollments"
              payload: { placement_id: "${pl_id}", course_id: "${crs_id}", enrollment_type: "CREDIT_RECOVERY", prior_course_record_id: "${pcr_id}", expected_placement_version: "${pl_v1}" }
              as: AltEdTeacher
              as_user_id: "teach-01"
              captures: { enr_id: $.data.id }
            - call: "POST /course-enrollments/${enr_id}/progress"
              payload: { modules_passed_delta: 7, seat_hours_delta: 12.00, module_avg_percent: 84.00 }
              as: AltEdTeacher
              as_user_id: "teach-01"
            - call: "POST /course-enrollments/${enr_id}/submit-for-award"
              payload: { final_percent: 84.00 }
              as: AltEdTeacher
              as_user_id: "teach-01"
            - call: "POST /course-enrollments/${enr_id}/award-credit"
              payload: { expected_graduation_plan_version: "${plan_v1}" }
              as: Registrar
              as_user_id: "reg-01"
              captures: { award_id: $.data.id }
          trigger:
            - call: "POST /credit-awards/${award_id}/void"
              payload: { void_reason: "course substitution approved by the district" }
              as: Registrar
              as_user_id: "reg-01"
          assert:
            - "before the trigger, Student.${stu_id}.credits_earned_total == 1.00, alt_ed_credits == 1.00, gpa == 3.00 and status == GRADUATED; GraduationPlan.${plan_id}.status == COMPLETED; PriorCourseRecord.${pcr_id}.replacement_status == REPLACED; GET /home-schools/${hs_id} reads adjusted_grad_rate 1.0000 and cohort_flag COMPLIANT"
            - "hop 1 - CreditAward.${award_id}.status == VOIDED and void_reason == 'course substitution approved by the district'"
            - "hop 1 - CourseEnrollment.${enr_id}.awarded_credits == 0.00 and progress_state == SUBMITTED_FOR_AWARD (the compensation rewinds exactly one step, never to IN_PROGRESS)"
            - "hop 2 - PriorCourseRecord.${pcr_id}.replacement_status == NOT_REPLACED, so the F row re-enters the GPA input set"
            - "hop 2 - Student.${stu_id}.credits_earned_total == 0.00, alt_ed_credits == 0.00, ncaa_acceptable_credits == 0.00 and gpa == 0.00 (one F row worth 1.00 credit: 0.000 quality points over 1.00 credits), exactly the pre-award readings and not null"
            - "hop 3 - GraduationPlan.${plan_id}.credits_earned == 0.00, credits_remaining == 1.00, status == ACTIVE and posture == OFF_TRACK"
            - "hop 3 - Student.${stu_id}.status == PLACED_ALT (re-derived from the still-ACTIVE placement, not left at GRADUATED)"
            - "hop 4 - GET /home-schools/${hs_id} reads cohort_size 1, graduates_count 0, alt_ed_placed_count 1, adjusted_grad_rate 0.0000 and cohort_flag PRIORITY"
            - "the invariant holds: GraduationPlan.${plan_id}.credits_earned == Student.${stu_id}.credits_earned_total == 0.00"
            - "GraduationPlan.${plan_id}.version == 4 (create, activate, award cascade, void cascade) - the ledger is restored but versions only move forward"
            - "GET /credit-awards?student_id=${stu_id}&status=POSTED returns 0 rows"

      - name: withdraw_offer_restores_center_seat_conservation
        conserved_quantity: "the center's funded seats (seats_available + seats_committed == seat_capacity, with seats_committed == active_student_count + seats_reserved)"
        grounds:
          - calculations.center_seat_conservation_invariant
          - state_machines.Referral.PLACEMENT_OFFERED_to_SCREENING
          - calculations.center_intake_posture
          - endpoints[POST /referrals/{referral_id}/withdraw-offer]
          - entities.Center.fields.seats_reserved
        distinguishing_aspect: |
          A different conserved quantity on a different entity: withdrawing an outstanding offer must
          return seats_reserved, seats_committed and seats_available to their exact pre-offer readings
          (0 / 0 / 4 of a 4-seat center) and null out offer_expires_on, while Center.version still
          advances to 3. An implementation that decrements seats_available instead of seats_reserved,
          or that forgets to release the reservation, breaks
          seats_available + seats_committed == seat_capacity.
        test_recipe:
          setup:
            - "one home school and one center with seat_capacity 4, certified_teacher_fte 4.00, support_staff_fte 2.00, max_students_per_teacher 12 (restricted_seat_margin floor(4 * 0.10) == 0, so intake_posture is OPEN with any seat free)"
            - "one grade-10 student whose referral has been screened and then offered a seat, so seats_reserved is 1, seats_committed is 1, seats_available is 3 and Center.version is 2"
            - "the logical clock is at its startup default 2026-08-01T00:00:00Z, so offer_expires_on reads 2026-08-11"
          setup_api_calls:
            - call: "POST /home-schools"
              payload: { name: "North High", district_code: "NHS-01", accountability_cohort_year: 2026 }
              as: DistrictAdmin
              captures: { hs_id: $.data.id }
            - call: "POST /centers"
              payload: { name: "Alder AEC", seat_capacity: 4, certified_teacher_fte: 4.00, support_staff_fte: 2.00, max_students_per_teacher: 12 }
              as: DistrictAdmin
              captures: { ctr_id: $.data.id, ctr_v1: $.data.version }
            - call: "POST /students"
              payload: { home_school_id: "${hs_id}", state_student_id: "S-9901", full_name: "Zane Ilic", cohort_year: 2028, grade_level: 10 }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /referrals"
              payload: { student_id: "${stu_id}", center_id: "${ctr_id}", pathway: "RE_ENGAGEMENT", deficiency_credits: 2.00, behavior_incident_count: 0, days_disengaged: 45 }
              as: HomeSchoolCounselor
              as_user_id: "${hs_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/screen"
              payload: { screening_note: "re-engagement intake" }
              as: PlacementCoordinator
              as_user_id: "${ctr_id}"
            - call: "POST /referrals/${ref_id}/offer"
              payload: { offer_valid_days: 10, expected_center_version: "${ctr_v1}" }
              as: PlacementCoordinator
              as_user_id: "${ctr_id}"
          trigger:
            - call: "POST /referrals/${ref_id}/withdraw-offer"
              payload: { screening_note: "family declined; returning to screening" }
              as: PlacementCoordinator
              as_user_id: "${ctr_id}"
          assert:
            - "before the trigger, Center.${ctr_id}.seats_reserved == 1, seats_committed == 1, seats_available == 3, active_student_count == 0, intake_posture == OPEN and version == 2; Referral.${ref_id}.status == PLACEMENT_OFFERED with offer_expires_on == '2026-08-11'"
            - "after the trigger Center.${ctr_id}.seats_reserved == 0, seats_committed == 0, seats_available == 4 and active_student_count == 0 - exactly the pre-offer readings"
            - "the invariant holds: Center.${ctr_id}.seats_available + Center.${ctr_id}.seats_committed == 4 == seat_capacity, and seats_committed == active_student_count + seats_reserved"
            - "Referral.${ref_id}.status == SCREENING, offer_expires_on == null and promoted_from_waitlist == false"
            - "Center.${ctr_id}.intake_posture == OPEN and student_teacher_ratio == 0.00"
            - "Center.${ctr_id}.version == 3 (create 1, offer 2, withdraw 3): the seat ledger is restored while the version counter only moves forward"
            - "GET /placements?center_id=${ctr_id} returns 0 rows (a withdrawn offer never produced a placement)"
