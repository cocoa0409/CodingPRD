            - call: "GET /parking/allocations/${alloc_a}"
              as: ParkingAdmin
              captures: { v_a: $.data.version }
            - call: "POST /parking/permits"
              payload: { patron_id: "${s_id}", allocation_id: "${alloc_a}", plate_number: "S777", expected_allocation_version: "${v_a}" }
              as: ParkingAdmin
            - call: "POST /parking/citations"
              payload: { lot_id: "${lot_b}", plate_number: "S777", violation_type: "NO_VALID_PERMIT" }
              as: EnforcementOfficer
              as_user_id: "off-7"
              captures: { cit_id: $.data.id }
            - call: "POST /parking/citations/${cit_id}/appeal"
              payload: { reason: "not my car" }
