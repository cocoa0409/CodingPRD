scenario: "Field Service Dispatch, Flat-Rate Pricebook & Membership Plans (ServiceTitan): job intake through booking and dispatch boards with technician skill, location and capacity matching, flat-rate pricebook management where task pricing is standardized with option tiers presented to homeowners, technician performance pay tied to sold revenue with approval controls to prevent overselling, membership plan sales with recurring maintenance visits, scheduling obligations and deferred revenue recognition, financing offers presented at the point of sale with approval workflows, inventory on trucks with replenishment and job costing, call recording and coaching with conversion measurement, marketing attribution from campaign to booked job to revenue"
domain_name: "field-service-dispatch-pricebook-membership"
api_prefix: "/api"

complexity_profile:
  primary_archetype: "temporal windowing"
  secondary_archetype: "pricing engine"
  complexity_layers:
    - "optimistic concurrency"
    - "cascading side effects"
    - "dual-variant calculation"
    - "scheduled / deferred actions"
    - "derived field reconciliation"
    - "selector policy"
  entity_topology: "flat"
  state_machine_shape: "parallel"
  relationship_patterns:
    - "one_to_many"
    - "cross_aggregate"
  role_model: "segregation_of_duties"
  consistency_model: "immediate"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  # ---------------------------------------------------------------- config
  - name: Branch
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: branch display name
        constraints: required, non-empty
      - name: postal_code
        type: string
        source: input
        description: branch service postal code; the geographic anchor for technician location matching
        constraints: required, exactly 5 digits
      - name: daily_dispatch_capacity_hours
        type: number
        source: input
        description: technician-hours this branch may consume in one dispatch day
        default: 80
        constraints: "> 0"
      - name: capacity_consumed_hours
        type: number
        source: computed
        description: sum of Appointment.estimated_hours over Appointments of this branch with status IN {SCHEDULED, DISPATCHED}
      - name: membership_count_active
        type: integer
        source: computed
        description: count of MembershipAgreement rows of this branch with status == ACTIVE

  - name: MembershipPlan
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: plan display name
        constraints: required
      - name: annual_price_cents
        type: integer
        source: input
        description: membership list price for a twelve-month agreement
        constraints: "> 0"
      - name: included_service_visit_count
        type: integer
        source: input
        description: maintenance visits owed per agreement year
        constraints: ">= 1"
      - name: maintenance_visit_interval_days
        type: integer
        source: input
        description: calendar days between consecutive maintenance visits
        constraints: ">= 1"
      - name: included_labor_discount_pct
        type: number
        source: input
        description: percentage discount applied to labor on appointments booked under a plan of this type
        constraints: "0 <= value <= 1"
      - name: status
        type: enum
        source: input
        description: plan catalog status
        default: DRAFT
        constraints: "one of {DRAFT, PUBLISHED, RETIRED}"

  - name: Campaign
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: marketing campaign name
        constraints: required
      - name: channel
        type: enum
        source: input
        description: source channel of the campaign
        constraints: "one of {SEARCH, YARD_SIGN, REFERRAL, DIRECT_MAIL, ORGANIC}"
      - name: spend_cents
        type: integer
        source: input
        description: campaign spend in integer cents
        default: 0
        constraints: ">= 0"
      - name: attributed_job_count
        type: integer
        source: computed
        description: count of Appointment rows whose campaign_id equals this campaign's id
      - name: attributed_revenue_cents
        type: integer
        source: computed
        description: sum of AppointmentLine.sold_price_cents over lines with status SOLD on COMPLETED appointments attributed to this campaign
      - name: conversion_rate
        type: number
        source: computed
        description: marketing_attribution_denominator output for this campaign, computed on read

  - name: PricebookTask
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: flat-rate pricebook task code; shared by every revision of the same logical task
        constraints: required, uppercase A-Z0-9 and dashes
      - name: revision
        type: integer
        source: system
        description: revision number, 1 for the first row carrying a code and one greater than the highest existing revision on each later row
      - name: category
        type: enum
        source: input
        description: trade category of the task
        constraints: "one of {HVAC, PLUMBING, ELECTRICAL, APPLIANCE, GENERAL}"
      - name: display_name
        type: string
        source: input
        description: homeowner-facing task name
        constraints: required
      - name: required_skill_code
        type: string
        source: input
        description: skill code a technician must hold to execute this task
        constraints: required, uppercase A-Z0-9 and dashes
      - name: estimated_hours
        type: number
        source: input
        description: nominal on-site hours for the task; drives dispatch capacity and labor-hour credits
        constraints: "> 0"
      - name: flat_rate_cents
        type: integer
        source: input
        description: base flat-rate price in integer cents
        constraints: ">= 0"
      - name: status
        type: enum
        source: input
        description: publication state of this revision
        default: DRAFT
        constraints: "one of {DRAFT, PUBLISHED, RETIRED}"
      - name: published_at_utc
        type: datetime
        source: computed
        description: logical clock reading when this revision first became PUBLISHED, null while DRAFT
      - name: options
        type: array
        source: input
        description: "option tiers presented to the homeowner; each element is {tier, label, price_cents, included_materials_cents, warranty_months} with tier one of GOOD, BETTER, BEST and at most one element per tier"
        default: []

  # ------------------------------------------------------------ resources
  - name: Technician
    parent: Branch
    common_fields: true
    fields:
      - name: home_branch_id
        type: string
        source: input
        description: the Branch the technician reports to
      - name: name
        type: string
        source: input
        description: technician display name
        constraints: required
      - name: postal_code
        type: string
        source: input
        description: technician's working postal code; drives location matching within a dispatch day
        constraints: required, exactly 5 digits
      - name: skill_codes
        type: array
        source: input
        description: skill codes the technician currently holds
        default: []
        constraints: "array of uppercase skill-code strings"
      - name: shift_segments
        type: array
        source: input
        description: "working-shift segments; each element is {start_utc, end_utc} with end_utc strictly later than start_utc"
        constraints: required, at least one element
      - name: daily_capacity_hours
        type: number
        source: input
        description: maximum estimated hours the technician may be dispatched in one dispatch day
        constraints: "> 0"
      - name: status
        type: enum
        source: input
        description: availability dimension; independent of performance_status
        default: AVAILABLE
        constraints: "one of {AVAILABLE, ON_SHIFT, ON_JOB, OFF_SHIFT}"
      - name: performance_status
        type: enum
        source: system
        description: parallel performance dimension maintained by override rejections and revenue thresholds
        default: CLEAR
        constraints: "one of {CLEAR, COACHING, PROBATION}"
      - name: sales_coaching_strike_count
        type: integer
        source: computed
        description: cumulative count of REJECTED pricebook override decisions on this technician's appointments
        default: 0
      - name: scheduled_hours
        type: number
        source: computed
        description: sum of Appointment.estimated_hours over Appointments of this technician with status == SCHEDULED
      - name: dispatched_hours
        type: number
        source: computed
        description: sum of Appointment.estimated_hours over Appointments of this technician with dispatch_status == DISPATCHED
      - name: technician_revenue_ledger_cents
        type: integer
        source: computed
        description: running total of the technician's revenue ledger entries, read as the amount of the latest entry
      - name: revenue_window_cents
        type: integer
        source: computed
        description: the technician_performance_review calculation's ninety-day window sum over the ledger
      - name: performance_grade
        type: enum
        source: computed
        description: the technician_performance_review calculation's grade
        default: DOES_NOT_MEET
        constraints: "one of {DOES_NOT_MEET, MEETS, EXCEEDS, OUTSTANDING}"

  - name: RevenueLedgerEntry
    parent: Technician
    common_fields: false
    fields:
      - name: technician_id
        type: string
        source: input
        description: the Technician.id whose revenue ledger receives this entry
      - name: appointment_id
        type: string
        source: input
        description: the Appointment.id that generated this entry
      - name: entry_type
        type: enum
        source: computed
        description: direction of the entry
        constraints: "one of {ACCRUAL, REVERSAL}"
      - name: amount_cents
        type: integer
        source: computed
        description: signed integer cents; positive for ACCRUAL, negative for REVERSAL
      - name: running_total_cents
        type: integer
        source: computed
        description: the technician's technician_revenue_ledger_cents immediately after this entry is appended
      - name: recorded_at_utc
        type: datetime
        source: computed
        description: logical clock reading when the entry was appended

  - name: Appointment
    parent: Branch
    common_fields: true
    fields:
      - name: branch_id
        type: string
        source: input
        description: "FK -> Branch.id; the branch that owns the dispatch commitment"
      - name: technician_id
        type: string
        source: computed
        description: the Technician.id assigned by the dispatch endpoint, null while unassigned
      - name: membership_agreement_id
        type: string
        source: input
        description: the MembershipAgreement.id this appointment services, null for non-member calls
      - name: membership_visit_sequence_number
        type: integer
        source: input
        description: the MembershipVisit.sequence_number on membership_agreement_id that this appointment fulfils
        default: null
      - name: campaign_id
        type: string
        source: input
        description: "FK -> Campaign.id; attribution source captured at booking, immutable after creation"
      - name: call_record_id
        type: string
        source: input
        description: the CallRecord.id of the intake call that produced this booking, null for self-service bookings
      - name: customer_name
        type: string
        source: input
        description: homeowner name for this service call
        constraints: required
      - name: postal_code
        type: string
        source: input
        description: service location postal code used for location matching
        constraints: required, exactly 5 digits
      - name: window_start_utc
        type: datetime
        source: input
        description: start of the committed service window
        constraints: required
      - name: window_end_utc
        type: datetime
        source: input
        description: end of the committed service window, strictly later than window_start_utc
        constraints: required
      - name: estimated_hours
        type: number
        source: computed
        description: sum of PricebookTask.estimated_hours over the appointment's AppointmentLine rows whose referenced revision is PUBLISHED; 0 while no such lines exist
      - name: labor_base_cents
        type: integer
        source: computed
        description: sum of AppointmentLine.flat_rate_cents over the appointment's lines with status == SOLD
      - name: quoted_price_cents
        type: integer
        source: computed
        description: price committed to the homeowner; the initial auto-quote freezes after dispatch
      - name: authorization_required
        type: boolean
        source: computed
        description: true when quoted_price_cents exceeds 1.20 times labor_base_cents
      - name: current_pricebook_version_id
        type: string
        source: computed
        description: id of the highest-revision PricebookTask referenced by any line of this appointment, null while no lines exist
      - name: repriced_at
        type: datetime
        source: computed
        description: logical clock reading of the most recent reprice, null when never repriced
      - name: load_units_trace
        type: array
        source: computed
        description: the household_load_propagation calculation's per-hop load sequence for this appointment, recomputed whenever a line is added
      - name: sold_price_cents
        type: integer
        source: computed
        description: sum of AppointmentLine.sold_price_cents over the appointment's lines with status == SOLD
      - name: pricing_status
        type: enum
        source: system
        description: pricing dimension; tracks the committed quote and any pending override approval
        default: NOT_QUOTED
        constraints: "one of {NOT_QUOTED, AUTO_QUOTED, OVERRIDE_PENDING, QUOTE_APPROVED, QUOTE_REJECTED}"
      - name: status
        type: enum
        source: system
        description: job lifecycle dimension
        default: SCHEDULED
        constraints: "one of {SCHEDULED, DISPATCHED, COMPLETED, CANCELLED}"
      - name: dispatch_status
        type: enum
        source: system
        description: technician capacity dimension
        default: UNASSIGNED
        constraints: "one of {UNASSIGNED, DISPATCHED, IN_SERVICE, RELEASED}"

  - name: AppointmentLine
    parent: Appointment
    common_fields: false
    fields:
      - name: appointment_id
        type: string
        source: input
        description: the Appointment this task line belongs to
      - name: pricebook_task_id
        type: string
        source: input
        description: the PricebookTask revision quoted on this line
        constraints: required
      - name: option_tier
        type: enum
        source: input
        description: the option tier chosen by the homeowner, null when the task is sold without a tier
        default: null
        constraints: "one of {GOOD, BETTER, BEST} or null"
      - name: status
        type: enum
        source: input
        description: line lifecycle status
        default: PROPOSED
        constraints: "one of {PROPOSED, SOLD, DECLINED}"
      - name: flat_rate_cents
        type: integer
        source: computed
        description: flat_rate_cents captured from the referenced pricebook revision at add time
      - name: sold_price_cents
        type: integer
        source: computed
        description: the matching PricebookTask option's price_cents when option_tier is set, otherwise flat_rate_cents; snapped when the line becomes SOLD

  - name: PricebookOverrideRequest
    parent: Appointment
    common_fields: true
    fields:
      - name: appointment_id
        type: string
        source: input
        description: the Appointment whose quote is submitted for approval
      - name: original_quote_cents
        type: integer
        source: computed
        description: the appointment's quoted_price_cents captured at submission
      - name: requested_price_cents
        type: integer
        source: input
        description: the price the technician wants to commit to the homeowner
        constraints: "> 0"
      - name: max_approved_price_cents
        type: integer
        source: computed
        description: labor_base_cents multiplied by 1.25 and then by 1.10, truncated to an integer number of cents
      - name: status
        type: enum
        source: system
        description: override decision status
        default: PENDING
        constraints: "one of {PENDING, APPROVED, REJECTED}"
      - name: decided_by_user_id
        type: string
        source: computed
        description: X-User-ID of the manager who decided the request, null until decided

  - name: MembershipAgreement
    parent: MembershipPlan
    common_fields: true
    fields:
      - name: membership_plan_id
        type: string
        source: input
        description: the MembershipPlan whose price and entitlement this agreement captures
      - name: branch_id
        type: string
        source: input
        description: the Branch.id responsible for servicing this agreement
      - name: homeowner_name
        type: string
        source: input
        description: homeowner display name
        constraints: required
      - name: homeowner_postal_code
        type: string
        source: input
        description: homeowner postal code; must equal the owning branch's postal_code
        constraints: required, exactly 5 digits
      - name: status
        type: enum
        source: system
        description: agreement lifecycle status
        default: PENDING_PAYMENT
        constraints: "one of {PENDING_PAYMENT, ACTIVE, OVERDUE, CANCELLED}"
      - name: term_months
        type: integer
        source: input
        description: agreement term length in months
        default: 12
        constraints: "one of {12, 24}"
      - name: agreement_start_utc
        type: datetime
        source: computed
        description: logical clock reading when the agreement became ACTIVE; anchors the alive-window used by visit intervals
      - name: annual_price_cents
        type: integer
        source: computed
        description: plan list price captured at sale time and frozen for the life of the agreement
      - name: collected_amount_cents
        type: integer
        source: computed
        description: cumulative cash collected on this agreement
      - name: revenue_recognized_cents
        type: integer
        source: computed
        description: cumulative revenue recognized from completed maintenance visits
      - name: unearned_revenue_balance_cents
        type: integer
        source: computed
        description: deferred revenue liability; the agreement's annual_price_cents minus its revenue_recognized_cents
      - name: visits_fulfilled_count
        type: integer
        source: computed
        description: count of MembershipVisit rows on this agreement with status == COMPLETED

  - name: MembershipVisit
    parent: MembershipAgreement
    common_fields: true
    fields:
      - name: membership_agreement_id
        type: string
        source: input
        description: the MembershipAgreement parent of this visit; it is reachable through the parent agreement's membership-visits collection
      - name: branch_id
        type: string
        source: input
        description: the Branch.id covering this visit; it must equal the parent agreement's branch_id and is reachable through the branch's technician roster rather than a dedicated list
      - name: sequence_number
        type: integer
        source: input
        description: 1-based position of this visit within the agreement's service sequence
        constraints: ">= 1"
      - name: scheduled_date
        type: datetime
        source: input
        description: date on which the maintenance visit is owed
        constraints: required
      - name: status
        type: enum
        source: system
        description: visit lifecycle status
        default: SCHEDULED
        constraints: "one of {SCHEDULED, COMPLETED, MISSED}"
      - name: completed_appointment_id
        type: string
        source: computed
        description: the Appointment through which this visit was fulfilled, null until completed
      - name: completed_at_utc
        type: datetime
        source: computed
        description: logical clock reading when the visit reached COMPLETED, null otherwise
      - name: deferred_revenue_cents
        type: integer
        source: computed
        description: the revenue bucket assigned at creation by the deferred_revenue_recognition_waterfall calculation

  - name: CallRecord
    parent: Campaign
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: the Campaign this call is attributed to
      - name: cs_user_id
        type: string
        source: input
        description: opaque X-User-ID of the call center representative who handled the call
      - name: started_at_utc
        type: datetime
        source: input
        description: call start instant; defaults to the logical clock reading when omitted
      - name: duration_seconds
        type: integer
        source: input
        description: call duration in seconds
        constraints: ">= 0"
      - name: recording_uri
        type: string
        source: input
        description: object-store URI of the call recording
        constraints: required, non-empty
      - name: coaching_status
        type: enum
        source: system
        description: coaching disposition of the recorded call
        default: UNREVIEWED
        constraints: "one of {UNREVIEWED, COACHING_ASSIGNED, REVIEWED}"
      - name: attributed_appointment_id
        type: string
        source: computed
        description: the Appointment attributed to this call through the booking it produced, null while unattributed
      - name: coached_by_user_id
        type: string
        source: computed
        description: X-User-ID of the manager who assigned coaching, null until assigned
concurrency_rules:
  - rule_id: reprice-stale-pricebook-task-version
    parent_entity: PricebookTask
    write_endpoint: "POST /appointments/{id}/reprice"
    occ_field: "expected_pricebook_task_version"
    description: |
      Repricing an Appointment against a PricebookTask revision whose version has advanced
      since the client last observed it is rejected, because the client's view of the
      revision's flat_rate_cents is stale and the recomputed quote would be anchored to a
      price the pricebook no longer publishes.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: override-approve-stale-appointment-version
    parent_entity: Appointment
    write_endpoint: "POST /override-requests/{id}/approve"
    occ_field: "expected_appointment_version"
    description: |
      Approving a PricebookOverrideRequest against an Appointment whose version has advanced
      since the manager last observed it is rejected, because the appointment's
      labor_base_cents and max_approved_price_cents have been recomputed by a reprice or a
      line sale, so the approved price would no longer be bounded by the current ceiling.
    error_id: ERR_STALE_VERSION
    http_status: 412

state_machines:
  # ==================================================================
  # Appointment — PARALLEL state dimensions
  #   status          : SCHEDULED -> DISPATCHED -> COMPLETED, or CANCELLED
  #   dispatch_status : UNASSIGNED <-> DISPATCHED <-> IN_SERVICE -> RELEASED
  #   pricing_status  : NOT_QUOTED -> AUTO_QUOTED <-> OVERRIDE_PENDING -> QUOTE_APPROVED / QUOTE_REJECTED
  # ==================================================================
  - entity: Appointment
    dimensions: [status, dispatch_status, pricing_status]
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - dimension: status
        from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /appointments (creation)"
        actor: Dispatcher
        preconditions:
          - "the referenced branch exists"
          - "window_end_utc is strictly later than window_start_utc"
          - "when membership_agreement_id is supplied, the referenced MembershipAgreement.branch_id equals this appointment's branch_id and its status is in {PENDING_PAYMENT, ACTIVE}"
          - "the appointment's [window_start_utc, window_end_utc) interval does not collide with any other Appointment on the same branch (see validations priority 8)"
        side_effects:
          - "Appointment.status := SCHEDULED; dispatch_status := UNASSIGNED; pricing_status := NOT_QUOTED"
          - "Appointment.current_pricebook_version_id := null; repriced_at := null; quoted_price_cents := 0; authorization_required := false"
          - "Appointment.version incremented by 1"
        note: "Creation transition. It establishes the three parallel start values rather than changing a state."
      - dimension: status
        from: SCHEDULED
        to: DISPATCHED
        trigger: "POST /dispatch/orders"
        actor: Dispatcher
        preconditions:
          - "Appointment.status == SCHEDULED"
          - "Appointment.dispatch_status in {UNASSIGNED, RELEASED}"
          - "the appointment carries at least one AppointmentLine"
        side_effects:
          - "Appointment.technician_id := the technician selected by the technician_eligibility_filter calculation"
          - "Appointment.status := DISPATCHED; Appointment.dispatch_status := DISPATCHED"
          - "Appointment.estimated_hours := sum of PricebookTask.estimated_hours over this appointment's AppointmentLine rows whose referenced revision is PUBLISHED"
          - "Appointment.pricing_status := AUTO_QUOTED"
          - "Appointment.quoted_price_cents := round_half_up(Appointment.labor_base_cents * (1 - discount_pct)), where discount_pct is the parent MembershipPlan.included_labor_discount_pct divided by 2 when membership_agreement_id names a MembershipAgreement whose status == ACTIVE, otherwise 0"
          - "Appointment.authorization_required := quoted_price_cents > 1.20 * labor_base_cents"
          - "Technician.status := ON_SHIFT; Technician.dispatched_hours := Technician.dispatched_hours + Appointment.estimated_hours"
          - "Branch.capacity_consumed_hours := Branch.capacity_consumed_hours + Appointment.estimated_hours"
          - "Appointment.version incremented by 1"
      - dimension: dispatch_status
        from: DISPATCHED
        to: IN_SERVICE
        trigger: "POST /appointments/{id}/complete"
        actor: Technician
        preconditions:
          - "Appointment.status == DISPATCHED"
          - "Appointment.dispatch_status == DISPATCHED"
        side_effects:
          - "Appointment.dispatch_status := IN_SERVICE; Technician.status := ON_JOB"
          - "Appointment.version incremented by 1"
        note: "Only the first hop of the completion flow; it exists so that the DISPATCHED-to-COMPLETED transition has an observable intermediate state."
      - dimension: status
        from: DISPATCHED
        to: COMPLETED
        trigger: "POST /appointments/{id}/complete"
        actor: Technician
        preconditions:
          - "Appointment.status == DISPATCHED"
          - "Appointment.dispatch_status == DISPATCHED (the first call moved it to IN_SERVICE and did not complete the job)"
        side_effects:
          - "Appointment.status := COMPLETED; Appointment.dispatch_status := RELEASED"
          - "Technician.status := AVAILABLE; Technician.dispatched_hours := Technician.dispatched_hours - Appointment.estimated_hours"
          - "Branch.capacity_consumed_hours := Branch.capacity_consumed_hours - Appointment.estimated_hours"
          - "for each AppointmentLine with status == SOLD: a RevenueLedgerEntry is appended with entry_type ACCRUAL, amount_cents := +AppointmentLine.sold_price_cents, and amount_cents is added to the technician's revenue ledger total"
          - "each MembershipVisit on membership_agreement_id whose sequence_number equals this appointment's membership_visit_sequence_number and whose status == SCHEDULED transitions to COMPLETED with completed_appointment_id := this appointment's id"
          - "Appointment.version incremented by 1"
        note: "Completion is a two-call flow: DISPATCHED-to-IN_SERVICE then DISPATCHED-to-COMPLETED."
      - dimension: status
        from: SCHEDULED
        to: CANCELLED
        trigger: "POST /appointments/{id}/cancel"
        actor: Dispatcher
        preconditions:
          - "Appointment.status == SCHEDULED"
          - "Appointment.dispatch_status in {UNASSIGNED, RELEASED}"
        side_effects:
          - "Appointment.status := CANCELLED"
          - "Appointment.version incremented by 1"
      - dimension: status
        from: DISPATCHED
        to: CANCELLED
        trigger: "POST /appointments/{id}/cancel"
        actor: Dispatcher
        preconditions:
          - "Appointment.status == DISPATCHED"
          - "Appointment.dispatch_status == DISPATCHED"
          - "no RevenueLedgerEntry with entry_type ACCRUAL names this appointment"
        side_effects:
          - "Appointment.status := CANCELLED; Appointment.dispatch_status := RELEASED; Appointment.technician_id := null"
          - "Technician.status := AVAILABLE; Technician.dispatched_hours := Technician.dispatched_hours - Appointment.estimated_hours"
          - "Branch.capacity_consumed_hours := Branch.capacity_consumed_hours - Appointment.estimated_hours"
          - "the MembershipVisit named by membership_visit_sequence_number, whose status is SCHEDULED, is detached: its completed_appointment_id stays null and its status returns to SCHEDULED"
          - "Appointment.version incremented by 1"
      - dimension: status
        from: COMPLETED
        to: CANCELLED
        trigger: "POST /appointments/{id}/cancel"
        actor: Manager
        preconditions:
          - "Appointment.status == COMPLETED"
          - "an ACCRUAL RevenueLedgerEntry names this appointment"
        side_effects:
          - "Appointment.status := CANCELLED"
          - "a RevenueLedgerEntry is appended with entry_type REVERSAL and amount_cents := -Appointment.sold_price_cents"
          - "the technician's revenue ledger total is reduced by Appointment.sold_price_cents"
          - "the MembershipVisit named by membership_visit_sequence_number, whose status == COMPLETED, transitions back to SCHEDULED and its completed_appointment_id is cleared"
          - "Appointment.version incremented by 1"
        note: "R1-a reversal link. Cancelling a completed appointment must leave the technician's revenue ledger total exactly where it stood before completion."
      - dimension: pricing_status
        from: NOT_QUOTED
        to: AUTO_QUOTED
        trigger: "POST /dispatch/orders"
        actor: Dispatcher
        preconditions:
          - "the SCHEDULED-to-DISPATCHED transition above succeeds"
        side_effects:
          - "Appointment.pricing_status := AUTO_QUOTED"
          - "PricebookTask.version incremented by 1"
      - dimension: pricing_status
        from: AUTO_QUOTED
        to: AUTO_QUOTED
        trigger: "POST /appointments/{id}/reprice"
        actor: Dispatcher
        preconditions:
          - "Appointment.status == SCHEDULED"
          - "expected_pricebook_task_version equals the current version of every PricebookTask revision referenced by this appointment's AppointmentLine rows"
          - "at least one AppointmentLine references a PricebookTask whose code also has another row with a strictly higher revision and status == PUBLISHED"
        side_effects:
          - "each AppointmentLine.flat_rate_cents := the flat_rate_cents of the PUBLISHED row with the highest revision for that code"
          - "each AppointmentLine whose option_id is set has its sold_price_cents recomputed from that revision's option price and its status reset to PROPOSED"
          - "Appointment.quoted_price_cents := round_half_up(Appointment.labor_base_cents * (1 - discount_pct))"
          - "Appointment.authorization_required := quoted_price_cents > 1.20 * labor_base_cents"
          - "Appointment.repriced_at := logical clock reading; Appointment.current_pricebook_version_id := the highest-revision task id"
          - "PricebookTask.version incremented by 1"
          - "Appointment.version incremented by 1"
      - dimension: pricing_status
        from: AUTO_QUOTED
        to: OVERRIDE_PENDING
        trigger: "POST /appointments/{id}/override-requests"
        actor: Technician
        preconditions:
          - "Appointment.status in {SCHEDULED, DISPATCHED}"
          - "requested_price_cents > 0"
          - "no PricebookOverrideRequest on this appointment has status == PENDING"
        side_effects:
          - "a PricebookOverrideRequest row is created with status PENDING, original_quote_cents := Appointment.quoted_price_cents, and max_approved_price_cents := floor(Appointment.labor_base_cents * 1.25 * 1.10)"
          - "Appointment.pricing_status := OVERRIDE_PENDING"
          - "Appointment.version incremented by 1"
      - dimension: pricing_status
        from: OVERRIDE_PENDING
        to: OVERRIDE_PENDING
        trigger: "POST /api/appointments/{id}/override-requests"
        actor: Technician
        preconditions:
          - "Appointment.status in {SCHEDULED, DISPATCHED}"
          - "requested_price_cents > 0"
          - "no PricebookOverrideRequest on this appointment has status == PENDING, so a second filing while one is unresolved is refused by validations priority 6"
        side_effects:
          - "a new PricebookOverrideRequest row is created with status PENDING"
          - "Appointment.version incremented by 1"
        note: "Self-transition declared so that re-filing is state-legal and the pending-request guard is enforced by ERR_OVERRIDE_ALREADY_PENDING rather than by a state rejection."
      - dimension: pricing_status
        from: QUOTE_REJECTED
        to: OVERRIDE_PENDING
        trigger: "POST /appointments/{id}/override-requests"
        actor: Technician
        preconditions:
          - "Appointment.status in {SCHEDULED, DISPATCHED}"
          - "requested_price_cents > 0"
          - "no PricebookOverrideRequest on this appointment has status == PENDING"
        side_effects:
          - "a new PricebookOverrideRequest row is created with status PENDING"
          - "Appointment.pricing_status := OVERRIDE_PENDING"
          - "Appointment.version incremented by 1"
        note: "Cycle: a rejected quote can be re-submitted, so pricing_status loops QUOTE_REJECTED -> OVERRIDE_PENDING."
      - dimension: pricing_status
        from: OVERRIDE_PENDING
        to: QUOTE_APPROVED
        trigger: "POST /override-requests/{id}/approve"
        actor: Manager
        preconditions:
          - "PricebookOverrideRequest.status == PENDING"
          - "requested_price_cents <= max_approved_price_cents"
          - "expected_appointment_version equals the appointment's current version (see concurrency rule override-approve-stale-appointment-version)"
          - "Appointment.quoted_price_cents equals PricebookOverrideRequest.original_quote_cents, i.e. the appointment has not been repriced since the request was filed"
        side_effects:
          - "PricebookOverrideRequest.status := APPROVED; decided_by_user_id := the acting X-User-ID"
          - "Appointment.quoted_price_cents := PricebookOverrideRequest.requested_price_cents"
          - "Appointment.pricing_status := QUOTE_APPROVED"
          - "Appointment.authorization_required := quoted_price_cents > 1.20 * labor_base_cents"
          - "Appointment.version incremented by 1"
      - dimension: pricing_status
        from: OVERRIDE_PENDING
        to: QUOTE_REJECTED
        trigger: "POST /override-requests/{id}/reject"
        actor: Manager
        preconditions:
          - "PricebookOverrideRequest.status == PENDING"
        side_effects:
          - "PricebookOverrideRequest.status := REJECTED; decided_by_user_id := the acting X-User-ID"
          - "Appointment.pricing_status := QUOTE_REJECTED"
          - "the appointment's technician has sales_coaching_strike_count incremented by 1"
          - "the appointment's technician has performance_status set to COACHING when sales_coaching_strike_count >= 2, and to PROBATION when it reaches 3"
          - "Appointment.version incremented by 1"

  # ==================================================================
  # MembershipAgreement — linear with a cyclic side machine on its child
  #   visit_completion_cascade: Appointment COMPLETED -> MembershipVisit
  #   COMPLETED -> agreement ACTIVE, all visits COMPLETED/terminal -> OVERDUE
  # ==================================================================
  - entity: MembershipAgreement
    initial_state: PENDING_PAYMENT
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING_PAYMENT
        to: PENDING_PAYMENT
        trigger: "POST /membership-agreements (sale)"
        actor: Technician
        preconditions:
          - "the referenced MembershipPlan.status == PUBLISHED"
          - "the referenced branch exists and its postal_code equals homeowner_postal_code"
        side_effects:
          - "MembershipAgreement.annual_price_cents := MembershipPlan.annual_price_cents"
          - "MembershipAgreement.collected_amount_cents := 0; revenue_recognized_cents := 0; unearned_revenue_balance_cents := 0"
          - "Branch.membership_count_active recomputed"
          - "MembershipAgreement.version incremented by 1"
        note: "Sale transition; the agreement stays PENDING_PAYMENT until its first payment."
      - from: PENDING_PAYMENT
        to: ACTIVE
        trigger: "POST /membership-agreements/{id}/payments with amount_cents equal to the plan's thirty-percent down payment"
        actor: Dispatcher
        preconditions:
          - "MembershipAgreement.status == PENDING_PAYMENT"
          - "amount_cents > 0"
          - "collected_amount_cents + amount_cents <= annual_price_cents"
        side_effects:
          - "MembershipAgreement.collected_amount_cents := collected_amount_cents + amount_cents"
          - "MembershipAgreement.status := ACTIVE when collected_amount_cents >= round_half_up(0.30 * annual_price_cents)"
          - "MembershipAgreement.agreement_start_utc := logical clock reading"
          - "the MembershipVisit rows already created on this agreement have their deferred_revenue_cents buckets recomputed by the deferred_revenue_recognition_waterfall calculation"
          - "Branch.membership_count_active recomputed"
          - "MembershipAgreement.version incremented by 1"
        note: "The down-payment threshold is 0.30 of annual_price_cents; a smaller first payment leaves the agreement PENDING_PAYMENT."
      - from: ACTIVE
        to: OVERDUE
        trigger: "system: membership overdue sweep, evaluated whenever a visit on this agreement becomes MISSED"
        actor: system
        preconditions:
          - "MembershipAgreement.status == ACTIVE"
          - "at least one MembershipVisit on this agreement has status == MISSED"
        side_effects:
          - "MembershipAgreement.status := OVERDUE"
          - "Branch.membership_count_active recomputed"
          - "MembershipAgreement.version incremented by 1"
        note: "Second hop of the visit_overdue_cascade chain: agreement ACTIVE -> OVERDUE -> branch membership_count_active recomputed."
      - from: OVERDUE
        to: ACTIVE
        trigger: "POST /membership-visits/{id}/reschedule"
        actor: Dispatcher
        preconditions:
          - "MembershipAgreement.status == OVERDUE"
          - "the reschedule moves the agreement's last membership visit with status == MISSED back to SCHEDULED at a scheduled_date strictly later than the logical clock reading"
        side_effects:
          - "MembershipAgreement.status := ACTIVE"
          - "Branch.membership_count_active recomputed"
          - "MembershipAgreement.version incremented by 1"
      - from: PENDING_PAYMENT
        to: CANCELLED
        trigger: "POST /membership-agreements/{id}/cancel"
        actor: Manager
        preconditions:
          - "MembershipAgreement.status == PENDING_PAYMENT"
        side_effects:
          - "MembershipAgreement.status := CANCELLED"
          - "Branch.membership_count_active recomputed"
          - "MembershipAgreement.version incremented by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /membership-agreements/{id}/cancel"
        actor: Manager
        preconditions:
          - "MembershipAgreement.status == ACTIVE"
          - "the agreement's visits_fulfilled_count is 0, OR using this agreement's annual_price_cents as the value of the variable x, the refund_amount_cents formula evaluates to a value strictly less than annual_price_cents"
          - "every MembershipVisit on this agreement whose status == MISSED has already been rescheduled"
        side_effects:
          - "MembershipAgreement.status := CANCELLED"
          - "MembershipAgreement.unearned_revenue_balance_cents := 0"
          - "MembershipAgreement.revenue_recognized_cents := annual_price_cents"
          - "Branch.membership_count_active recomputed"
          - "MembershipAgreement.version incremented by 1"
      - from: OVERDUE
        to: CANCELLED
        trigger: "POST /membership-agreements/{id}/cancel"
        actor: Manager
        preconditions:
          - "MembershipAgreement.status == OVERDUE"
        side_effects:
          - "MembershipAgreement.status := CANCELLED"
          - "Branch.membership_count_active recomputed"
          - "MembershipAgreement.version incremented by 1"

  # ==================================================================
  # MembershipVisit — CYCLIC machine
  #   SCHEDULED -> MISSED -> SCHEDULED (reschedule) -> MISSED ...
  #   SCHEDULED -> COMPLETED (via appointment completion)
  # ==================================================================
  - entity: MembershipVisit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /membership-agreements/{id}/membership-visits (creation)"
        actor: Dispatcher
        preconditions:
          - "the parent MembershipAgreement.status is in {PENDING_PAYMENT, ACTIVE, OVERDUE}"
          - "sequence_number is not already present on this agreement"
          - "sequence_number <= MembershipPlan.included_service_visit_count * MembershipAgreement.term_months / 12"
        side_effects:
          - "MembershipVisit.deferred_revenue_cents := the bucket assigned by the deferred_revenue_recognition_waterfall calculation"
          - "MembershipVisit.version incremented by 1"
      - from: SCHEDULED
        to: MISSED
        trigger: "system: membership overdue sweep"
        actor: system
        preconditions:
          - "MembershipVisit.status == SCHEDULED"
          - "scheduled_date is strictly earlier than the logical clock reading"
        side_effects:
          - "MembershipVisit.status := MISSED"
          - "the parent MembershipAgreement transitions to OVERDUE when its status is ACTIVE"
          - "MembershipVisit.version incremented by 1"
        note: "First hop of visit_overdue_cascade: visit SCHEDULED -> MISSED -> agreement ACTIVE -> OVERDUE -> Branch.membership_count_active recomputed."
      - from: MISSED
        to: SCHEDULED
        trigger: "POST /membership-visits/{id}/reschedule"
        actor: Dispatcher
        preconditions:
          - "scheduled_date is strictly later than the logical clock reading"
          - "the rescheduled interval [scheduled_date, scheduled_date + MembershipPlan.maintenance_visit_interval_days) does not overlap the identically-shaped interval of another MembershipVisit on the same agreement whose status is in {SCHEDULED, COMPLETED}"
        side_effects:
          - "MembershipVisit.status := SCHEDULED; MembershipVisit.scheduled_date := the new value"
          - "the parent MembershipAgreement transitions back to ACTIVE when its status is OVERDUE and no other visit on it remains MISSED"
          - "MembershipVisit.version incremented by 1"
        note: "Cycle hop: MISSED -> SCHEDULED reopens the visit so it can be missed again."
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /appointments/{id}/complete on the appointment whose membership_visit_sequence_number names this visit"
        actor: Technician
        preconditions:
          - "the completing Appointment carries this agreement's id as membership_agreement_id and this visit's sequence_number as membership_visit_sequence_number"
          - "MembershipVisit.status == SCHEDULED"
        side_effects:
          - "MembershipVisit.status := COMPLETED; MembershipVisit.completed_appointment_id := the appointment's id; MembershipVisit.completed_at_utc := logical clock reading"
          - "the parent MembershipAgreement.visits_fulfilled_count := visits_fulfilled_count + 1"
          - "the parent MembershipAgreement.revenue_recognized_cents := the value computed by the membership_revenue_recognition calculation"
          - "the parent MembershipAgreement.unearned_revenue_balance_cents := annual_price_cents - revenue_recognized_cents"
          - "MembershipVisit.version incremented by 1"
      - from: COMPLETED
        to: SCHEDULED
        trigger: "POST /appointments/{id}/cancel on the completed appointment that fulfilled this visit"
        actor: Manager
        preconditions:
          - "MembershipVisit.status == COMPLETED"
          - "the cancelling Appointment is the one named in completed_appointment_id"
        side_effects:
          - "MembershipVisit.status := SCHEDULED; MembershipVisit.completed_appointment_id := null; MembershipVisit.completed_at_utc := null"
          - "the parent MembershipAgreement.visits_fulfilled_count := visits_fulfilled_count - 1"
          - "the parent MembershipAgreement.revenue_recognized_cents := the value computed by the membership_revenue_recognition calculation after this transition"
          - "MembershipVisit.version incremented by 1"
        note: "Cycle hop back: COMPLETED -> SCHEDULED, the compensating half of the revenue invariant."

  # ==================================================================
  # CallRecord — linear coaching pipeline with a cross-entity guard
  # ==================================================================
  - entity: CallRecord
    initial_state: UNREVIEWED
    terminal_states: [REVIEWED]
    transitions:
      - from: UNREVIEWED
        to: COACHING_ASSIGNED
        trigger: "POST /call-records/{id}/coaching"
        actor: Manager
        preconditions:
          - "CallRecord.coaching_status == UNREVIEWED"
        side_effects:
          - "CallRecord.coaching_status := COACHING_ASSIGNED; CallRecord.coached_by_user_id := the acting X-User-ID"
          - "CallRecord.version incremented by 1"
      - from: COACHING_ASSIGNED
        to: REVIEWED
        trigger: "POST /call-records/{id}/complete-review"
        actor: Manager
        preconditions:
          - "CallRecord.coaching_status == COACHING_ASSIGNED"
          - "the call has an attributed_appointment_id and that Appointment.status == COMPLETED"
        side_effects:
          - "CallRecord.coaching_status := REVIEWED"
          - "CallRecord.version incremented by 1"
        note: "Cross-entity guard: the coaching review cannot close until the attributed job is complete."
      - from: UNREVIEWED
        to: REVIEWED
        trigger: "POST /call-records/{id}/complete-review"
        actor: Manager
        preconditions:
          - "CallRecord.coaching_status == UNREVIEWED"
          - "the call has an attributed_appointment_id and that Appointment.status == COMPLETED"
        side_effects:
          - "CallRecord.coaching_status := REVIEWED"
          - "CallRecord.version incremented by 1"
        note: "Fast path for calls that never needed coaching; the same cross-entity guard applies."

calculations:
  # ==================================================================
  # C1  R1-a dual variant, domain: membership revenue recognition
  # ==================================================================
  - name: membership_revenue_recognition
    trigger: "on POST /api/appointments/{id}/complete when the transition completes a MembershipVisit, and on POST /api/appointments/{id}/cancel when it reopens one"
    algorithm: "forward_looking"
    formula: |
      visits := MembershipVisit rows of the agreement whose status is in {SCHEDULED, MISSED, COMPLETED}
      completed := count of those rows whose status == COMPLETED
      owed := count of those rows whose status is in {SCHEDULED, MISSED, COMPLETED}   # BASE denominator
      owed_net := count of those rows whose status is in {SCHEDULED, COMPLETED}       # variant denominator
      BASE      : revenue_recognized_cents := round_half_up(agreement.annual_price_cents * completed / owed)
      VARIANT   : revenue_recognized_cents := round_half_up(agreement.annual_price_cents * completed / owed_net)
      unearned_revenue_balance_cents := agreement.annual_price_cents - revenue_recognized_cents
    input_set: "MembershipVisit rows on the agreement whose status is in {SCHEDULED, MISSED, COMPLETED}; rows in any other status are excluded from both the numerator and every denominator"
    constants:
      NUMERATOR_STATUS: COMPLETED
      BASE_DENOMINATOR_STATUSES: "{SCHEDULED, MISSED, COMPLETED}"
      VARIANT_DENOMINATOR_STATUSES: "{SCHEDULED, COMPLETED}"
      ROUNDING: round_half_up
    precision: "integer cents; the division is rounded once, half-up, at the end"
    variants:
      - name: owed_including_missed
        when: "the agreement's revenue is recognised against every visit the plan still owes, missed ones included"
        difference: "BASE; a missed visit inflates the denominator without contributing to the numerator, so two completed visits out of four owed recognises 50000 cents on a 100000-cent agreement"
      - name: owed_excluding_missed
        when: "the agreement's revenue is recognised only against the visits it still expects to honour"
        difference: "drops MISSED visits from the denominator, so the identical agreement recognises 66667 cents instead of BASE's 50000 and its unearned balance is 33333 rather than 50000"

  # ==================================================================
  # C2  R1-b dual variant, domain: marketing attribution
  # ==================================================================
  - name: campaign_attribution_revenue
    trigger: "on GET /campaigns/{id} with include_attribution=true"
    algorithm: "chronological"
    formula: |
      # BASE VARIANT (chronological_created_at)
      booked = [a for a in Appointment if a.campaign_id == campaign.id]
      booked.sort(key=lambda a: (a.created_at, a.window_start_utc))
      attributed_job_count := len(booked)
      attributed_revenue_cents := sum(
          line.sold_price_cents
          for a in booked
          if a.status == COMPLETED
          for line in AppointmentLine(a) if line.status == SOLD)
      cac_cents := round_half_up(campaign.spend_cents / attributed_job_count) if attributed_job_count > 0 else 0

      # VISIT-WATERFALL VARIANT (visit_completion_waterfall)
      booked.reverse()   # later bookings first, still ordered by created_at within a bucket
      attributed_job_count := sum(1 for a in booked if a.membership_agreement_id is None
                                  or any(v.status == COMPLETED
                                         and v.membership_agreement_id == a.membership_agreement_id
                                         and v.sequence_number == a.membership_visit_sequence_number
                                         for v in MembershipVisit))
      attributed_revenue_cents := the same summation over that narrower set
    input_set: "Appointment rows whose campaign_id equals the campaign's id; the revenue sum narrows further to status == COMPLETED appointments and status == SOLD lines"
    constants:
      APPOINTMENT_STATUS_FILTER: COMPLETED
      LINE_STATUS_FILTER: SOLD
      CAC_ROUNDING: round_half_up
    precision: "integer cents, no rounding except cac_cents"
    variants:
      - name: chronological_created_at
        when: "the campaign's booked jobs are counted from its attribution history"
        difference: "BASE; counts every attributed appointment whether or not the underlying visit completed"
      - name: visit_completion_waterfall
        when: "the campaign's report is rendered from the visit-completion read model"
        difference: "drops attributed appointments whose named membership visit is not COMPLETED, so attributed_job_count and cac_cents are strictly smaller than BASE whenever any attributed appointment maps to an incomplete visit"

  # ==================================================================
  # C3  R2-a combinatorial mode (a): 3+ inputs, non-linear interaction
  # ==================================================================
  - name: technician_eligibility_filter
    trigger: "on POST /dispatch/orders"
    algorithm: "weighted_scoring"
    formula: |
      appointment.a := the appointment being dispatched
      appointment.d.allowed := [line.pricebook_task.required_skill_code for line in AppointmentLine(appointment.a)
                                if line.pricebook_task.status == PUBLISHED]
      candidates = [t for t in Technician if t.status == AVAILABLE
                    and t.scheduled_hours < t.daily_capacity_hours
                    and t.scheduled_hours + appointment.a.estimated_hours <= t.daily_capacity_hours]
      for t in candidates:
          t.shift_ok := any(seg.end_utc > appointment.a.window_start_utc
                            and seg.start_utc < appointment.a.window_end_utc for seg in t.shift_segments)
          t.skill_ok := all(code in t.skill_codes for code in appointment.d.allowed)
          t.comp_ok  := t.postal_code[0:3] == appointment.a.postal_code[0:3]
          t.branch_ok := appointment.a.branch_id == t.home_branch_id
      eligible = [t for t in candidates if t.shift_ok and t.skill_ok and t.comp_ok and t.branch_ok]
      eligible.sort(key=lambda t: (t.scheduled_hours, t.dispatched_hours, t.postal_code, t.created_at))
      selected := eligible[0]
    input_set: "Technician rows with status == AVAILABLE; the appointment's AppointmentLine rows filtered to lines whose referenced PricebookTask.status == PUBLISHED"
    constants:
      CANDIDATE_STATUS: AVAILABLE
      COMP_PREFIX_LENGTH: 3
      EXCLUSION_ON_RETRY: "a technician who was released from this appointment is excluded from its later dispatches"
    precision: "hours compared as decimals rounded to 2 places, half-up"
    variants:
      - name: strict_shift_overlap
        when: "a technician's shift ends exactly at the appointment window start"
        difference: "BASE; the overlap test is strict, so a shift ending exactly at window_start_utc does not count as overlap and the technician is ineligible"
      - name: touching_shift_inclusive
        when: "a branch configures inclusive shift touching"
        difference: "accepts a technician whose shift end equals the appointment window start, admitting one more candidate than BASE"

  # ==================================================================
  # C4  R2-b combinatorial mode (b): nested rounding, order pinned
  # ==================================================================
  - name: technician_monthly_incentive_pay
    trigger: "on GET /technicians/{id}/incentive-statement"
    algorithm: "tiered_pricing"
    formula: |
      # STEP 1 — per-appointment component, each rounded individually
      for each Appointment a of the technician with a.status == COMPLETED:
          base := a.sold_price_cents
          if base < 20000:    rate := 0.02
          elif base < 50000:  rate := 0.04
          else:               rate := 0.06
          component(a) := round_half_up(base * rate)
      gross := sum(component(a) for a in the technician's COMPLETED appointments)

      # STEP 2 — clamp the ALREADY-SUMMED gross
      clamped := min(gross, 150000)

      # STEP 3 — charges subtracted AFTER the clamp
      f := clamped - 1500 * technician.sales_coaching_strike_count

      # STEP 4 — floor, then step, then round
      if f < 0:            p := 0.000
      elif f <= 25000:     p := 0.020
      elif f <= 75000:     p := 0.035
      else:                p := 0.050
      incentive_cents := round_half_up(f * p)
    input_set: "the technician's Appointment rows with status == COMPLETED; AppointmentLine rows with status == SOLD supply sold_price_cents through the appointment's sold_price_cents"
    constants:
      TIER1_UPPER_CENTS: 20000
      TIER2_UPPER_CENTS: 50000
      RATE_T1: 0.02
      RATE_T2: 0.04
      RATE_T3: 0.06
      GROSS_CAP_CENTS: 150000
      STRIKE_CHARGE_CENTS: 1500
      PAY_TIER1_UPPER_CENTS: 25000
      PAY_TIER2_UPPER_CENTS: 75000
      PAY_RATE_T1: 0.020
      PAY_RATE_T2: 0.035
      PAY_RATE_T3: 0.050
    precision: "integer cents; round_half_up is applied per appointment at STEP 1 and once at STEP 4; the clamped sum at STEP 3 is NOT rounded"
    variants:
      - name: per_appointment_rounding
        when: "the statement is generated with the pinned rounding order"
        difference: "BASE; rounding each component before summing can differ from rounding the raw total once, so gross can sit on a different side of the 150000 clamp or the 25000/75000 pay boundaries"
      - name: rounded_total
        when: "an implementation rounds the raw total once at the end"
        difference: "gross diverges from BASE by up to (number_of_appointments / 2) cents, and because the pay tiers use <= boundaries a one-cent divergence can move incentive_cents to a different rate"

  # ==================================================================
  # C5  R9-a compensating invariant, conserved quantity A: ledger cents
  # ==================================================================
  - name: technician_revenue_ledger_total
    trigger: "on every POST /appointments/{id}/complete and every POST /appointments/{id}/cancel that names a completed appointment"
    algorithm: "aggregation"
    formula: |
      technician_revenue_ledger_total(t) := sum(e.amount_cents for e in RevenueLedgerEntry if e.technician_id == t.id)
      on COMPLETION : append {entry_type: ACCRUAL,  amount_cents: +appointment.sold_price_cents}
      on CANCELLATION of a COMPLETED appointment:
                      append {entry_type: REVERSAL, amount_cents: -appointment.sold_price_cents}
      INVARIANT: after an ACCRUAL and its paired REVERSAL, technician_revenue_ledger_total(t) equals
                 its value immediately before the ACCRUAL was appended.
    input_set: "every RevenueLedgerEntry row of the technician; ACCRUAL rows contribute positively and REVERSAL rows negatively"
    constants:
      ACCRUAL_SIGN: "+1"
      REVERSAL_SIGN: "-1"
    precision: "integer cents, no rounding"

  # ==================================================================
  # C6  R9-b compensating invariant, conserved quantity B: booked hours
  # ==================================================================
  - name: technician_booked_hours
    trigger: "on POST /dispatch/orders, POST /appointments/{id}/complete and POST /appointments/{id}/cancel"
    algorithm: "aggregation"
    formula: |
      booked_hours(t) := sum(a.estimated_hours for a in Appointment
                             if a.technician_id == t.id and a.status in {SCHEDULED, DISPATCHED})
      on DISPATCH (a.status := DISPATCHED)   : booked_hours(t) := booked_hours(t) + a.estimated_hours
      on COMPLETION (a.status := COMPLETED)  : booked_hours(t) := booked_hours(t) - a.estimated_hours
      on CANCELLATION of a DISPATCHED        : booked_hours(t) := booked_hours(t) - a.estimated_hours
      INVARIANT: after a DISPATCH and its paired COMPLETION or CANCELLATION, booked_hours(t) equals its
                 value immediately before the DISPATCH, and Branch.capacity_consumed_hours likewise returns
                 to its pre-dispatch value.
    input_set: "Appointment rows whose technician_id names the technician and whose status is SCHEDULED or DISPATCHED"
    constants:
      DISPATCH_SIGN: "+1"
      COMPLETE_SIGN: "-1"
      CANCEL_SIGN: "-1"
    precision: "hours at 2 decimal places, round_half_up"

  # ==================================================================
  # C7  deferred revenue waterfall
  # ==================================================================
  - name: deferred_revenue_recognition_waterfall
    trigger: "on POST /membership-agreements/{id}/membership-visits and on the payment that activates the agreement"
    algorithm: "waterfall_allocation"
    formula: |
      total_buckets := MembershipPlan.included_service_visit_count * MembershipAgreement.term_months / 12
      base := MembershipAgreement.annual_price_cents // total_buckets
      remainder := MembershipAgreement.annual_price_cents - base * total_buckets
      order := MembershipVisit rows of the agreement sorted by (sequence_number, created_at) ascending
      for index i, visit in enumerate(order):
          visit.deferred_revenue_cents := base + 1 if i < remainder else base
      INVARIANT: sum(v.deferred_revenue_cents for v in order) == annual_price_cents
                 whenever len(order) == total_buckets
    input_set: "MembershipVisit rows of the agreement ordered by (sequence_number, created_at) ascending; the bucket index is the row's position in that order, not its sequence_number"
    constants:
      REMAINDER_ALLOCATION: "the first `remainder` buckets in order receive one extra cent"
      TOTAL_BUCKETS: "included_service_visit_count * term_months / 12"
    precision: "integer cents, no rounding"

  # ==================================================================
  # C8  household load propagation (constraint_propagation)
  # ==================================================================
  - name: household_load_propagation
    trigger: "on POST /api/appointments/{id}/lines"
    algorithm: "constraint_propagation"
    formula: |
      # PINNED EVALUATION ORDER. At hop n the increment's size is chosen from a bucket keyed on
      # the running total, while the running total is itself what the increment updates — a
      # circular-looking dependency. The scaffold pins that the bucket is selected from the
      # PRE-increment total E_{n-1}:
      #
      #   E_0 := 0
      #   for n, hop in enumerate(hops, start=1):
      #       m := 300 if E_{n-1} < 500 else (600 if E_{n-1} < 1500 else 900)
      #       theta := 115 if hop.pricebook_task.category == APPLIANCE else 100
      #       E_n := E_{n-1} + m * theta / 100
      # load_units_trace := [E_1, ..., E_len(hops)]
      #
      # Evaluating the bucket selection AFTER adding hop n's own increment would pick the next
      # bucket up on every hop, so the pinned order is observable in the trace.
    input_set: "AppointmentLine rows of the appointment whose referenced PricebookTask.status == PUBLISHED, ordered by (created_at of the Appointment row's payload order, pricebook_task.code) ascending; lines whose revision is DRAFT or RETIRED are skipped entirely"
    constants:
      BUCKET1_MAX_EXCLUSIVE: 500
      BUCKET2_MAX_EXCLUSIVE: 1500
      INCREMENT_BUCKET1: 300
      INCREMENT_BUCKET2: 600
      INCREMENT_BUCKET3: 900
      APPLIANCE_NUMERATOR: 115
      DEFAULT_NUMERATOR: 100
    precision: "exact integers; each increment is an exact integer because every bucket increment is divisible by 20"
    variants:
      - name: bucket_selected_before_increment
        when: "the pinned evaluation order is honoured"
        difference: "BASE; the bucket is read from E_{n-1}, so an all-HVAC five-line appointment traces 300, 600, 1200, 1800, 2700"
      - name: bucket_selected_after_increment
        when: "an implementation selects the bucket from the partially updated total"
        difference: "the bucket advances one hop earlier, so the same five-line appointment traces 300, 900, 2400, 4200, 8100 and differs from BASE from hop 2 onward"

  # ==================================================================
  # C9  marketing attribution denominator (polymorphic numerator)
  # ==================================================================
  - name: marketing_attribution_denominator
    trigger: "on GET /campaigns/{id} with include_attribution=true"
    algorithm: "threshold"
    formula: |
      numerator := the attributed_job_count chosen by the selected variant of campaign_attribution_revenue
      denominator := count(distinct Campaign rows referenced by Appointment.campaign_id or CallRecord.campaign_id)
      if numerator == 0:
          conversion_rate := 0.000
      elif numerator == denominator:
          conversion_rate := 1.000
      else:
          conversion_rate := round_half_down(numerator / denominator, 3)
    input_set: "numerator from the attributed rows of the campaign; denominator from every Campaign row reachable as an Appointment.campaign_id or a CallRecord.campaign_id, evaluated over the whole database rather than this campaign alone"
    constants:
      SCALE: 3
      ZERO_RATE: 0.000
      FULL_RATE: 1.000
      ROUNDING: round_half_down
    precision: "3 decimal places, round_half_down"

  # ==================================================================
  # C10 appointment settlement balance (dual variant, same entity, different algorithm)
  # ==================================================================
  - name: appointment_settlement_balance
    trigger: "on POST /appointments/{id}/complete"
    algorithm: "chronological"
    formula: |
      # VARIANT A (appointment_outstanding — BASE, evaluated on read)
      appointment_outstanding := Appointment.sold_price_cents - round_half_up(
          Appointment.sold_price_cents * MembershipPlan.included_labor_discount_pct / 2)
      appointment_outstanding := appointment_outstanding - MembershipAgreement.collected_amount_cents

      # VARIANT B (agreement_covered — evaluated at write time)
      agreement_covered := is a MembershipVisit fulfilled by this appointment COMPLETED?
                          then 0
                          else Appointment.sold_price_cents
    input_set: "AppointmentLine rows with status == SOLD supply sold_price_cents; MembershipAgreement.collected_amount_cents is read from the linked agreement, 0 when no agreement is linked"
    constants:
      DISCOUNT_HALVING: 2
      ROUNDING: round_half_up
    precision: "integer cents, round_half_up applied before the subtraction"
    variants:
      - name: appointment_outstanding
        when: "the appointment is rendered on an invoice"
        difference: "BASE; nets the member's collected amounts against the discounted sold price, so it can go negative when the member has prepaid more than this visit is worth"
      - name: agreement_covered
        when: "the appointment is a membership visit"
        difference: "returns 0 for a fulfilled membership visit regardless of the collected amounts, so it never disagrees in sign with BASE but disagrees in magnitude whenever collected_amount_cents is non-zero"

  # ==================================================================
  # C11 description quality gate (threshold at exact equality)
  # ==================================================================
  - name: appointment_description_quality
    trigger: "on POST /appointments/{id}/complete"
    algorithm: "threshold"
    formula: |
      required_words := max(10, ceil(0.05 * Appointment.estimated_hours * 60))
      supplied_words := len(completion_description.split()) if completion_description is present else 0
      quality_gate_passed := supplied_words >= required_words
    input_set: "the requiring completion_description field of the completing request; estimated_hours of the appointment being completed"
    constants:
      MIN_WORDS: 10
      WORDS_PER_MINUTE_FRACTION: 0.05
    precision: "exact integer word counts; the comparison is >=, so a description of exactly required_words passes"

  # ==================================================================
  # C13 technician performance review (threshold, 90-day rolling window)
  # ==================================================================
  - name: technician_performance_review
    trigger: "on GET /technicians/{id}/performance"
    algorithm: "threshold"
    formula: |
      window_start := logical clock reading - 90 days   (exclusive lower bound)
      window_end := logical clock reading               (inclusive upper bound)
      window_sum := sum(e.amount_cents for e in RevenueLedgerEntry
                        if e.technician_id == t.id
                        and e.recorded_at_utc > window_start
                        and e.recorded_at_utc <= window_end)
      if window_sum < 400000:      grade := DOES_NOT_MEET
      elif window_sum < 600000:    grade := MEETS
      elif window_sum <= 900000:   grade := EXCEEDS
      else:                        grade := OUTSTANDING
    input_set: "RevenueLedgerEntry rows of the technician whose recorded_at_utc lies strictly after the window start and at or before the window end; ACCRUAL rows are positive and REVERSAL rows negative, so a reversal can pull the sum below a boundary"
    constants:
      WINDOW_DAYS: 90
      BOUNDARY_MEETS_CENTS: 400000
      BOUNDARY_EXCEEDS_CENTS: 600000
      BOUNDARY_OUTSTANDING_CENTS: 900000
    precision: "integer cents; boundaries use >= and <= exactly as written"

  # ==================================================================
  # C14 pricebook revision selection (selector policy)
  # ==================================================================
  - name: pricebook_revision_selection
    trigger: "on POST /appointments/{id}/lines and on POST /appointments/{id}/reprice"
    algorithm: "topological"
    formula: |
      candidates := PricebookTask rows whose code equals the requested code and whose status == PUBLISHED
      candidates.sort(key=lambda t: (-t.revision, t.published_at_utc, t.created_at))
      selected := candidates[0]
      if candidates is empty: raise ERR_PRICEBOOK_REVISION_NOT_PUBLISHED
    input_set: "PricebookTask rows sharing the requested code; only rows whose status == PUBLISHED enter the candidate set"
    constants:
      RANKING: "revision descending, then published_at_utc ascending, then created_at ascending"
      EMPTY_POOL: "ERR_PRICEBOOK_REVISION_NOT_PUBLISHED"
    precision: "not applicable"

  # ==================================================================
  # C15 discount floor (aggregation over sellable lines)
  # ==================================================================
  - name: discount_floor_check
    trigger: "on POST /appointments/{id}/complete and on POST /membership-agreements"
    algorithm: "threshold"
    formula: |
      denominator := sum(line.flat_rate_cents for line in AppointmentLine(a) if line.status == SOLD)
      numerator   := Appointment.quoted_price_cents
      effective_discount_pct := (denominator - numerator) / denominator
      rejected when effective_discount_pct > 0.20
    input_set: "AppointmentLine rows with status == SOLD on the appointment; sold_price_cents is compared through the appointment's quoted_price_cents"
    constants:
      SALES_FLOOR_PCT: 0.20
      EMPTY_DENOMINATOR: "denominator == 0 leaves effective_discount_pct at 0 and the check passes"
    precision: "exact rational comparison; no rounding before the comparison"

validations:
  # ---- priority 1-3: auth, existence --------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role names a role declared in the RBAC matrix and X-User-ID is present and non-empty"
    error_id: ERR_UNAUTHORIZED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "the acting role is listed in the endpoint's roles list"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all mutating endpoints"
  - priority: 3
    category: existence
    check: "the target resource named in the path exists; path parameters are validated left to right, so an unparseable or unknown parent id is reported before any child id"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint carrying a path parameter"
  # ---- priority 4-6: state preconditions ----------------------------
  - priority: 4
    category: state
    check: "the target entity is in a state from which the requested transition is declared in the state_machines table"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /appointments/{id}/complete, POST /appointments/{id}/cancel, POST /membership-visits/{id}/reschedule, POST /membership-agreements/{id}/cancel, POST /override-requests/{id}/decide, POST /call-records/{id}/coaching"
  - priority: 5
    category: state
    check: "the appointment carries at least one AppointmentLine before it may be dispatched; an appointment with no lines has estimated_hours 0 and is not dispatchable"
    error_id: ERR_NO_APPOINTMENT_LINES
    http_status: 409
    applies_to: "POST /dispatch/orders"
  - priority: 6
    category: state
    check: "the appointment already carries a PricebookOverrideRequest with status PENDING"
    error_id: ERR_OVERRIDE_ALREADY_PENDING
    http_status: 409
    applies_to: "POST /appointments/{id}/override-requests"
  # ---- priority 7-9: business safety (temporal collisions) ----------
  - priority: 7
    category: business_safety
    check: "on POST /appointments the new appointment's [window_start_utc, window_end_utc) interval does not overlap the identically-shaped interval of any other Appointment on the same branch whose status is in {SCHEDULED, DISPATCHED}"
    error_id: ERR_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /appointments"
  - priority: 8
    category: business_temporal
    check: "on POST /appointments the window_end_utc is not strictly later than window_start_utc"
    error_id: ERR_WINDOW_INVALID
    http_status: 400
    applies_to: "POST /appointments"
  - priority: 9
    category: business_safety
    check: "on POST /membership-visits/{id}/reschedule the new [scheduled_date, scheduled_date + MembershipPlan.maintenance_visit_interval_days) half-open interval does not overlap the identically-shaped interval of any other MembershipVisit on the same agreement whose status is in {SCHEDULED, COMPLETED}, where both intervals are additionally clipped to the agreement's alive window starting at agreement_start_utc"
    error_id: ERR_VISIT_OVERLAP
    http_status: 409
    applies_to: "POST /membership-visits/{id}/reschedule"
  # ---- priority 10-12: business referential -------------------------
  - priority: 10
    category: business_referential
    check: "on POST /dispatch/orders no Technician passes the skill clause of the technician_eligibility_filter, i.e. no candidate holds every required_skill_code of the appointment's published task revisions"
    error_id: ERR_NO_ELIGIBLE_TECHNICIAN
    http_status: 422
    applies_to: "POST /dispatch/orders"
  - priority: 11
    category: business_referential
    check: "on POST /appointments the membership_visit_sequence_number does not name a MembershipVisit on membership_agreement_id, or that visit's status is COMPLETED"
    error_id: ERR_MEMBER_VISIT_SEQUENCE_INVALID
    http_status: 422
    applies_to: "POST /appointments"
  - priority: 12
    category: business_referential
    check: "on POST /appointments/{id}/lines the requested code has no PricebookTask revision whose status is PUBLISHED"
    error_id: ERR_PRICEBOOK_REVISION_NOT_PUBLISHED
    http_status: 422
    applies_to: "POST /appointments/{id}/lines"
  # ---- priority 13-16: business constraint / fiscal -----------------
  - priority: 13
    category: business_constraint
    check: "on POST /dispatch/orders the technician selected by the technician_eligibility_filter already has scheduled_hours at or above daily_capacity_hours"
    error_id: ERR_TECHNICIAN_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /dispatch/orders"
  - priority: 14
    category: business_constraint
    check: "on POST /membership-agreements/{id}/membership-visits the requested sequence_number is already present on the agreement"
    error_id: ERR_DUPLICATE_VISIT_SEQUENCE
    http_status: 409
    applies_to: "POST /membership-agreements/{id}/membership-visits"
  - priority: 15
    category: business_constraint
    check: "on POST /membership-agreements/{id}/membership-visits the requested sequence_number exceeds MembershipPlan.included_service_visit_count multiplied by MembershipAgreement.term_months and divided by twelve"
    error_id: ERR_SUBSCRIPTION_TERM_EXCEEDED
    http_status: 422
    applies_to: "POST /membership-agreements/{id}/membership-visits"
  - priority: 16
    category: business_fiscal
    check: "on POST /override-requests/{id}/decide with decision APPROVE the request's requested_price_cents exceeds its computed max_approved_price_cents"
    error_id: ERR_OVERRIDE_EXCEEDS_LIMIT
    http_status: 422
    applies_to: "POST /override-requests/{id}/decide"
  - priority: 17
    category: business_fiscal
    check: "on POST /appointments/{id}/complete the appointment's effective_discount_pct, computed by the discount_floor_check calculation, is strictly greater than 0.20"
    error_id: ERR_DISCOUNT_FLOOR_REACHED
    http_status: 422
    applies_to: "POST /appointments/{id}/complete"
  - priority: 18
    category: business_fiscal
    check: "on POST /membership-agreements/{id}/payments the payment would push collected_amount_cents beyond annual_price_cents"
    error_id: ERR_OVER_COLLECTION
    http_status: 422
    applies_to: "POST /membership-agreements/{id}/payments"
  - priority: 19
    category: business_fiscal
    check: "on POST /membership-agreements/{id}/cancel the surviving-recognition guard fails: the agreement's visits_fulfilled_count is greater than zero AND, using this agreement's annual_price_cents as the value of the refund formula's variable x, refund_amount_cents evaluates to a value not strictly less than annual_price_cents"
    error_id: ERR_MEMBERSHIP_CANCEL_BLOCKED
    http_status: 409
    applies_to: "POST /membership-agreements/{id}/cancel"
  - priority: 20
    category: business_constraint
    check: "on POST /appointments the linked MembershipAgreement's status is neither PENDING_PAYMENT nor ACTIVE"
    error_id: ERR_AGREEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /appointments, POST /membership-visits/{id}/reschedule"
  - priority: 21
    category: business_constraint
    check: "on POST /appointments/{id}/complete the completion_description is absent or contains fewer words than the appointment_description_quality calculation's required_words"
    error_id: ERR_DESCRIPTION_TOO_SHORT
    http_status: 422
    applies_to: "POST /appointments/{id}/complete"
  - priority: 22
    category: business_referential
    check: "on POST /call-records/{id}/coaching with decision COMPLETE_REVIEW the call has no attributed_appointment_id, or that Appointment's status is not COMPLETED"
    error_id: ERR_CALL_NOT_REVIEWABLE
    http_status: 409
    applies_to: "POST /call-records/{id}/coaching"
  # ---- priority 23-25: optimistic concurrency and duty separation ---
  - priority: 23
    category: state
    check: "on POST /appointments/{id}/reprice the supplied expected_pricebook_task_version differs from the current version of a PricebookTask revision referenced by this appointment's lines"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /appointments/{id}/reprice"
  - priority: 24
    category: state
    check: "on POST /override-requests/{id}/decide the supplied expected_appointment_version differs from the appointment's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /override-requests/{id}/decide"
  - priority: 25
    category: auth
    check: "on POST /appointments/{id}/cancel of a COMPLETED appointment the acting X-User-ID equals the technician_id recorded on that appointment's ACCRUAL RevenueLedgerEntry, so the same user may not both earn and void the creditable revenue"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /appointments/{id}/cancel"

errors:
  - id: ERR_UNAUTHORIZED
    http: 401
    condition: "X-User-Role header missing, or X-User-ID missing, or the named role is not declared in the RBAC matrix"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "the acting role is not permitted on this endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "the resource named by a path parameter does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target entity is not in a state from which the requested transition is declared"
  - id: ERR_NO_APPOINTMENT_LINES
    http: 409
    condition: "dispatching an appointment that carries no AppointmentLine rows"
  - id: ERR_OVERRIDE_ALREADY_PENDING
    http: 409
    condition: "filing a pricebook override request while another request on the same appointment is still PENDING"
  - id: ERR_WINDOW_OVERLAP
    http: 409
    condition: "the new appointment's half-open window overlaps another live appointment's half-open window on the same branch"
  - id: ERR_WINDOW_INVALID
    http: 400
    condition: "window_end_utc is not strictly later than window_start_utc"
  - id: ERR_VISIT_OVERLAP
    http: 409
    condition: "the rescheduled membership visit's half-open maintenance interval overlaps another live visit interval on the same agreement"
  - id: ERR_NO_ELIGIBLE_TECHNICIAN
    http: 422
    condition: "no AVAILABLE technician on the appointment's branch holds every required skill code of its published task revisions"
  - id: ERR_MEMBER_VISIT_SEQUENCE_INVALID
    http: 422
    condition: "the appointment names a membership visit sequence number that does not exist on the linked agreement, or that visit is already COMPLETED"
  - id: ERR_PRICEBOOK_REVISION_NOT_PUBLISHED
    http: 422
    condition: "the requested pricebook task code has no revision whose status is PUBLISHED"
  - id: ERR_TECHNICIAN_CAPACITY_EXCEEDED
    http: 422
    condition: "the selected technician's scheduled_hours is already at or above daily_capacity_hours"
  - id: ERR_DUPLICATE_VISIT_SEQUENCE
    http: 409
    condition: "a membership visit with this sequence number already exists on the agreement"
  - id: ERR_SUBSCRIPTION_TERM_EXCEEDED
    http: 422
    condition: "the requested membership visit sequence number exceeds the agreement's total visit entitlement"
  - id: ERR_OVERRIDE_EXCEEDS_LIMIT
    http: 422
    condition: "the override price exceeds the computed maximum approvable price for this appointment"
  - id: ERR_DISCOUNT_FLOOR_REACHED
    http: 422
    condition: "the appointment's effective discount exceeds the twenty-percent sales floor"
  - id: ERR_OVER_COLLECTION
    http: 422
    condition: "a membership payment would push collected amounts beyond the agreement's annual price"
  - id: ERR_MEMBERSHIP_CANCEL_BLOCKED
    http: 409
    condition: "the agreement has fulfilled visits and the refund formula does not leave an amount strictly below the annual price"
  - id: ERR_AGREEMENT_NOT_ACTIVE
    http: 409
    condition: "the linked membership agreement is neither PENDING_PAYMENT nor ACTIVE"
  - id: ERR_DESCRIPTION_TOO_SHORT
    http: 422
    condition: "the completion description is missing or shorter than the appointment's required word count"
  - id: ERR_CALL_NOT_REVIEWABLE
    http: 409
    condition: "the call has no attributed appointment, or the attributed appointment is not COMPLETED"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "an expected_version field supplied by the client does not match the server's current version of the parent entity"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting user both earned and is now voiding the same appointment's creditable revenue"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required request field is missing or not parseable"

roles:
  - name: Dispatcher
    description: "runs the dispatch board, books jobs, assigns technicians, and owns catalog operations"
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /pricebook/tasks"
      - "POST /appointments"
      - "POST /appointments/{id}/lines"
      - "POST /appointments/{id}/reprice"
      - "POST /appointments/{id}/cancel"
      - "POST /dispatch/orders"
      - "POST /membership-agreements/{id}/payments"
      - "POST /membership-agreements/{id}/membership-visits"
      - "POST /membership-visits/{id}/reschedule"
    shared_operations:
      - "GET /appointments"
      - "GET /appointments/{id}"
      - "GET /appointments/{id}/lines"
      - "GET /appointments/{id}/override-requests"
      - "GET /membership-agreements"
      - "GET /membership-agreements/{id}"
      - "GET /membership-agreements/{id}/membership-visits"
      - "GET /campaigns/{id}"
      - "GET /campaigns/{id}/call-records"
      - "GET /technicians/{id}"
      - "GET /branches/{id}/technicians"
  - name: Technician
    description: "field technician who executes jobs, sells pricebook options, and files price override requests"
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /appointments/{id}/complete"
      - "POST /appointments/{id}/override-requests"
      - "POST /membership-agreements"
    shared_operations:
      - "GET /appointments"
      - "GET /appointments/{id}"
      - "GET /appointments/{id}/lines"
      - "GET /appointments/{id}/override-requests"
      - "GET /technicians/{id}"
      - "GET /campaigns/{id}"
  - name: Manager
    description: "approves or rejects price overrides, cancels agreements and appointments, and owns coaching"
    identity: "opaque"
    exclusive_operations:
      - "POST /override-requests/{id}/decide"
      - "POST /membership-agreements/{id}/cancel"
      - "POST /call-records/{id}/coaching"
    shared_operations:
      - "GET /appointments"
      - "GET /appointments/{id}"
      - "GET /appointments/{id}/override-requests"
      - "GET /membership-agreements"
      - "GET /membership-agreements/{id}"
      - "GET /technicians/{id}"
      - "GET /campaigns/{id}"
      - "GET /campaigns/{id}/call-records"
  - name: CustomerService
    description: "call center representative who records calls and captures the marketing attribution of each intake"
    identity: "opaque"
    exclusive_operations:
      - "POST /call-records"
    shared_operations:
      - "GET /appointments"
      - "GET /appointments/{id}"
      - "GET /campaigns/{id}"
      - "GET /campaigns/{id}/call-records"
  - name: PlatformAdmin
    description: "operator who owns tenant-level configuration: branches, plans, campaigns, and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /branches"
      - "POST /branches/{id}/technicians"
      - "POST /membership-plans"
      - "POST /campaigns"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /branches/{id}/technicians"
      - "GET /technicians/{id}"
      - "GET /appointments"
      - "GET /membership-agreements"

endpoints:
  # ------------------------------------------------- platform configuration
  - method: POST
    path: "/api/branches"
    description: "create a branch; the geographic anchor for dispatch capacity and technician matching"
    roles: [PlatformAdmin]
    code: 201
    input: ["name", "postal_code", "daily_dispatch_capacity_hours?"]
    output: Branch
    side_effects: ["Branch.capacity_consumed_hours := 0; Branch.membership_count_active := 0"]
  - method: POST
    path: "/api/campaigns"
    description: "create a marketing campaign that appointments and call records can be attributed to"
    roles: [PlatformAdmin]
    code: 201
    input: ["name", "channel", "spend_cents?"]
    output: Campaign
    side_effects: ["Campaign.attributed_job_count := 0; Campaign.attributed_revenue_cents := 0; Campaign.conversion_rate := null"]
  - method: POST
    path: "/api/membership-plans"
    description: "create a membership plan catalogue entry with its annual price, visit entitlement and labor discount"
    roles: [PlatformAdmin]
    code: 201
    input: ["name", "annual_price_cents", "included_service_visit_count", "maintenance_visit_interval_days", "included_labor_discount_pct", "status?"]
    output: MembershipPlan
    side_effects: []
  - method: POST
    path: "/api/branches/{id}/technicians"
    description: "hire a technician into a branch with skills, shift segments and a daily capacity"
    roles: [PlatformAdmin]
    code: 201
    input: ["name", "postal_code", "skill_codes", "shift_segments", "daily_capacity_hours", "status?"]
    output: Technician
    side_effects: ["Technician.scheduled_hours := 0; Technician.dispatched_hours := 0; Technician.sales_coaching_strike_count := 0; Technician.performance_status := CLEAR; Technician.technician_revenue_ledger_cents := 0"]
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "set the logical clock. The server starts with its logical clock fixed at 2026-09-01T00:00:00Z and never falls back to wall-clock time, so every interval, deadline and rolling window is deterministic until this endpoint is called"
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["every MembershipVisit whose scheduled_date is strictly earlier than the new reading and whose status is SCHEDULED transitions to MISSED", "every MembershipAgreement whose status is ACTIVE and which now carries a MISSED visit transitions to OVERDUE", "Branch.membership_count_active recomputed for every affected branch"]
  # ------------------------------------------------------------ pricebook
  - method: POST
    path: "/api/pricebook/tasks"
    description: "create a pricebook task revision with its homeowner-facing option tiers; supplying an existing code creates the next revision, which supersedes every lower revision of that code"
    roles: [Dispatcher]
    code: 201
    input: ["code", "category", "display_name", "required_skill_code", "estimated_hours", "flat_rate_cents", "options?", "status?"]
    output: PricebookTask
    side_effects: ["PricebookTask.revision := 1 when the code is new, otherwise one greater than the highest existing revision for that code", "PricebookTask.published_at_utc := the logical clock reading when status is PUBLISHED"]
  # ---------------------------------------------------------- service calls
  - method: POST
    path: "/api/call-records"
    description: "register a recorded intake call and the marketing source it belongs to"
    roles: [CustomerService]
    code: 201
    input: ["campaign_id", "cs_user_id", "duration_seconds", "recording_uri", "started_at_utc?"]
    output: CallRecord
    side_effects: ["CallRecord.coaching_status := UNREVIEWED; coached_by_user_id := null; attributed_appointment_id := null"]
  - method: POST
    path: "/api/call-records/{id}/coaching"
    description: "assign coaching on a call, or close its coaching review once the attributed job is complete"
    roles: [Manager]
    code: 200
    input: [decision]
    output: CallRecord
    side_effects: ["decision ASSIGN_COACHING: CallRecord.coaching_status := COACHING_ASSIGNED; coached_by_user_id := the acting X-User-ID", "decision COMPLETE_REVIEW: CallRecord.coaching_status := REVIEWED"]
  # -------------------------------------------------------------- bookings
  - method: POST
    path: "/api/appointments"
    description: "book an appointment from an intake call and freeze its attribution source and membership link"
    roles: [Dispatcher]
    code: 201
    input: ["branch_id", "customer_name", "postal_code", "window_start_utc", "window_end_utc", "campaign_id?", "call_record_id?", "membership_agreement_id?", "membership_visit_sequence_number?"]
    output: Appointment
    side_effects: ["Appointment.status := SCHEDULED; dispatch_status := UNASSIGNED; pricing_status := NOT_QUOTED; quoted_price_cents := 0; estimated_hours := 0; authorization_required := false", "Appointment.campaign_id := the call's campaign when call_record_id is supplied without campaign_id", "the referenced CallRecord.attributed_appointment_id := the new appointment's id", "Branch.capacity_consumed_hours recomputed"]
  - method: GET
    path: "/api/appointments"
    description: "list appointments, filterable by branch, technician, status, campaign and linked agreement"
    roles: [Dispatcher, Technician, Manager, CustomerService]
    code: 200
    input: ["branch_id?", "technician_id?", "status?", "campaign_id?", "membership_agreement_id?", "call_record_id?", "limit?", "offset?"]
    output: "Appointment[]"
    side_effects: []
  - method: GET
    path: "/api/appointments/{id}"
    description: "read one appointment with all three of its parallel state dimensions"
    roles: [Dispatcher, Technician, Manager, CustomerService]
    code: 200
    input: []
    output: Appointment
    side_effects: []
  - method: POST
    path: "/api/appointments/{id}/lines"
    description: "add a pricebook task line to the appointment, quoted against the highest published revision of the requested code"
    roles: [Dispatcher]
    code: 201
    input: ["pricebook_task_code", "option_tier?", "status?"]
    output: AppointmentLine
    side_effects: ["AppointmentLine.flat_rate_cents := the selected revision's flat_rate_cents", "AppointmentLine.sold_price_cents := the matching option's price when option_tier is set, otherwise flat_rate_cents", "Appointment.estimated_hours recomputed over the appointment's published lines", "Appointment.current_pricebook_version_id := the selected revision's id", "Appointment.version incremented by 1"]
  - method: GET
    path: "/api/appointments/{id}/lines"
    description: "list the pricebook lines of an appointment"
    roles: [Dispatcher, Technician, Manager]
    code: 200
    input: ["limit?", "offset?"]
    output: "AppointmentLine[]"
    side_effects: []
  - method: POST
    path: "/api/appointments/{id}/reprice"
    description: "re-quote every line of the appointment against the highest published revision of its code, guarded by optimistic concurrency on the pricebook revision"
    roles: [Dispatcher]
    code: 200
    input: ["expected_pricebook_task_version", "pricebook_task_id?"]
    output: Appointment
    side_effects: ["every AppointmentLine.flat_rate_cents recomputed from the current published revision of its code", "Appointment.quoted_price_cents recomputed from the new labour base; Appointment.authorization_required recomputed", "Appointment.repriced_at := the logical clock reading; Appointment.current_pricebook_version_id := the highest published revision's id", "PricebookTask.version incremented by 1", "Appointment.version incremented by 1"]
  # -------------------------------------------------------------- dispatch
  - method: POST
    path: "/api/dispatch/orders"
    description: "dispatch an appointment: select an eligible technician, commit the estimated hours, and publish the automatic labour quote"
    roles: [Dispatcher]
    code: 201
    input: [appointment_id]
    output: Appointment
    side_effects: ["Appointment.technician_id := the technician selected by the technician_eligibility_filter calculation", "Appointment.status := DISPATCHED; dispatch_status := DISPATCHED; pricing_status := AUTO_QUOTED", "Appointment.quoted_price_cents := the automatic labour quote; Appointment.authorization_required recomputed", "Technician.dispatched_hours recomputed; Technician.status := ON_SHIFT", "Branch.capacity_consumed_hours recomputed", "PricebookTask.version incremented by 1", "Appointment.version incremented by 1"]
  - method: POST
    path: "/api/appointments/{id}/complete"
    description: "complete an appointment: the first call moves it into service, the second finishes the job, recognises any linked maintenance visit and accrues the technician's revenue"
    roles: [Technician]
    code: 200
    input: [completion_description]
    output: Appointment
    side_effects: ["first call: Appointment.dispatch_status := IN_SERVICE; Technician.status := ON_JOB", "second call: Appointment.status := COMPLETED; dispatch_status := RELEASED; Technician.status := AVAILABLE; Technician.dispatched_hours recomputed", "second call: a RevenueLedgerEntry with entry_type ACCRUAL is appended for every SOLD line and the technician's revenue ledger total advanced", "second call: the MembershipVisit named by membership_visit_sequence_number transitions to COMPLETED and the agreement's revenue is recomputed by the membership_revenue_recognition calculation", "Appointment.version incremented by 1"]
  - method: POST
    path: "/api/appointments/{id}/cancel"
    description: "cancel an appointment; cancelling a completed appointment appends a compensating REVERSAL ledger entry and reopens the maintenance visit it had fulfilled"
    roles: [Dispatcher, Manager]
    code: 200
    input: ["reason?"]
    output: Appointment
    side_effects: ["Appointment.status := CANCELLED", "when it was DISPATCHED: dispatch_status := RELEASED; Technician.dispatched_hours recomputed; Branch.capacity_consumed_hours recomputed", "when it was COMPLETED: a RevenueLedgerEntry with entry_type REVERSAL is appended and the technician's revenue ledger total reduced, and the fulfilled MembershipVisit returns to SCHEDULED with its completion fields cleared", "Appointment.version incremented by 1"]
  # -------------------------------------------------------- price overrides
  - method: POST
    path: "/api/appointments/{id}/override-requests"
    description: "file a price override request against an appointment's committed quote"
    roles: [Technician]
    code: 201
    input: [requested_price_cents]
    output: PricebookOverrideRequest
    side_effects: ["PricebookOverrideRequest.status := PENDING; original_quote_cents := the appointment's current quoted_price_cents; max_approved_price_cents := the appointment's current labour-base ceiling", "Appointment.pricing_status := OVERRIDE_PENDING", "Appointment.version incremented by 1"]
  - method: GET
    path: "/api/branches/{id}"
    description: "read one branch with its consumed capacity and active membership count"
    roles: [PlatformAdmin, Dispatcher, Manager]
    code: 200
    input: []
    output: Branch
    side_effects: []
  - method: POST
    path: "/api/override-requests/{id}/decide"
    description: "approve or reject a pending price override request; approval replaces the appointment's committed quote"
    roles: [Manager]
    code: 200
    input: ["decision", "expected_appointment_version"]
    output: PricebookOverrideRequest
    side_effects: ["PricebookOverrideRequest.status := APPROVED or REJECTED; decided_by_user_id := the acting X-User-ID", "on APPROVE: Appointment.quoted_price_cents := requested_price_cents; Appointment.pricing_status := QUOTE_APPROVED; Appointment.authorization_required recomputed", "on REJECT: Appointment.pricing_status := QUOTE_REJECTED; the technician's sales_coaching_strike_count incremented and performance_status advanced to COACHING at two strikes and PROBATION at three", "Appointment.version incremented by 1"]
  # ------------------------------------------------------------ membership
  - method: POST
    path: "/api/membership-agreements"
    description: "sell a membership plan to a homeowner; the agreement starts awaiting its down payment"
    roles: [Technician]
    code: 201
    input: ["membership_plan_id", "branch_id", "homeowner_name", "homeowner_postal_code", "term_months?"]
    output: MembershipAgreement
    side_effects: ["MembershipAgreement.annual_price_cents := the plan's annual_price_cents", "MembershipAgreement.status := PENDING_PAYMENT; collected_amount_cents := 0; revenue_recognized_cents := 0; unearned_revenue_balance_cents := 0; visits_fulfilled_count := 0", "Branch.membership_count_active recomputed"]
  - method: GET
    path: "/api/membership-agreements"
    description: "list membership agreements, filterable by branch, plan and status"
    roles: [Dispatcher, Manager, PlatformAdmin]
    code: 200
    input: ["branch_id?", "membership_plan_id?", "status?", "limit?", "offset?"]
    output: "MembershipAgreement[]"
    side_effects: []
  - method: POST
    path: "/api/membership-agreements/{id}/payments"
    description: "record a membership payment; a first payment reaching thirty percent of the annual price activates the agreement"
    roles: [Dispatcher]
    code: 200
    input: [amount_cents]
    output: MembershipAgreement
    side_effects: ["MembershipAgreement.collected_amount_cents incremented", "MembershipAgreement.status := ACTIVE when collected_amount_cents reaches thirty percent of annual_price_cents, stamping agreement_start_utc", "the deferred_revenue_recognition_waterfall calculation redistributes the agreement's visit buckets", "Branch.membership_count_active recomputed"]
  - method: POST
    path: "/api/membership-agreements/{id}/membership-visits"
    description: "schedule one maintenance visit in the agreement's service sequence"
    roles: [Dispatcher]
    code: 201
    input: [sequence_number, scheduled_date]
    output: MembershipVisit
    side_effects: ["MembershipVisit.status := SCHEDULED", "MembershipVisit.deferred_revenue_cents := the bucket assigned by the deferred_revenue_recognition_waterfall calculation"]
  - method: GET
    path: "/api/membership-agreements/{id}/membership-visits"
    description: "list the maintenance visits on an agreement, ordered by sequence number then creation"
    roles: [Dispatcher, Manager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "MembershipVisit[]"
    side_effects: []
  - method: POST
    path: "/api/membership-visits/{id}/reschedule"
    description: "reschedule a missed or scheduled maintenance visit, subject to the maintenance-interval overlap rule"
    roles: [Dispatcher]
    code: 200
    input: [scheduled_date]
    output: MembershipVisit
    side_effects: ["MembershipVisit.status := SCHEDULED; scheduled_date := the new value", "the parent membership agreement returns to ACTIVE when it was OVERDUE and no other visit on it remains MISSED", "the parent agreement's visit buckets recomputed by the deferred_revenue_recognition_waterfall calculation"]
  - method: POST
    path: "/api/membership-agreements/{id}/cancel"
    description: "cancel a membership agreement once the surviving-recognition guard passes"
    roles: [Manager]
    code: 200
    input: ["reason?"]
    output: MembershipAgreement
    side_effects: ["MembershipAgreement.status := CANCELLED; unearned_revenue_balance_cents := 0; revenue_recognized_cents := annual_price_cents", "Branch.membership_count_active recomputed"]
  # ------------------------------------------------------- performance pay
  - method: GET
    path: "/api/technicians/{id}"
    description: "read one technician with capacity, ledger and performance state"
    roles: [Dispatcher, Technician, Manager, PlatformAdmin]
    code: 200
    input: []
    output: Technician
    side_effects: []
  - method: GET
    path: "/api/technicians/{id}/incentive-statement"
    description: "compute the technician's monthly incentive statement from completed appointments, the gross cap and the coaching-strike charges"
    roles: [Manager, Technician]
    code: 200
    input: [period_year, period_month]
    output: "{ gross_component_cents: integer, clamped_component_cents: integer, charge_cents: integer, incentive_cents: integer }"
    side_effects: []
  - method: GET
    path: "/api/technicians/{id}/performance"
    description: "grade the technician over the rolling ninety-day revenue window"
    roles: [Manager, Technician]
    code: 200
    input: []
    output: "{ window_start_utc: datetime, window_end_utc: datetime, window_revenue_cents: integer, grade: string }"
    side_effects: []
  # ------------------------------------------------------------ marketing
  - method: GET
    path: "/api/campaigns/{id}"
    description: "read one campaign; with include_attribution=true it also returns the attributed job count, attributed revenue and conversion rate, optionally computed under the visit-completion variant"
    roles: [Dispatcher, Technician, Manager, CustomerService]
    code: 200
    input: ["include_attribution?", "attribution_variant?"]
    output: Campaign
    side_effects: ["when include_attribution is true: Campaign.conversion_rate := the marketing_attribution_denominator calculation's output"]
  - method: GET
    path: "/api/campaigns/{id}/call-records"
    description: "list the recorded calls attributed to a campaign"
    roles: [Manager, CustomerService]
    code: 200
    input: ["coaching_status?", "limit?", "offset?"]
    output: "CallRecord[]"
    side_effects: []
