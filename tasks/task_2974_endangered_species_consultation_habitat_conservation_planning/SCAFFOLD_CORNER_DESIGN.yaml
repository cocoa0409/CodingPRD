      - name: primary_species_tie_break_uses_the_smallest_recovery_population
        claim_type: correct_result
        grounds:
          - calculations.incidental_take_authorization
          - constants.LISTING_RANK
          - entities.BiologicalOpinion.fields.primary_species_scientific_name
          - entities.BiologicalOpinion.fields.exposed_acres
        distinguishing_aspect: >-
          Two ENDANGERED species tie on LISTING_RANK, so the first tie-break
          decides: the species with recovery_unit_population 1200 becomes primary
          over the one with 4000. exposed_acres then sums ONLY that species' rows
          (12.50 of the 22.50 total), so picking the wrong primary changes the
          acreage, the take, the jeopardy fraction and the permit's whole budget.
        test_recipe:
          setup:
            - "SP-E (Gopherus agassizii, ENDANGERED, population 4000, density 0.40) and SP-R (Rana muscosa, ENDANGERED, population 1200, density 0.40) registered in that order."
            - "One proponent; one 200.00-acre NON_FEDERAL action; PD1 FIELD_SURVEY / DETECTED on SP-E with 10.00 acres; PD2 FIELD_SURVEY / DETECTED on SP-R with 12.50 acres. Neither cites a critical habitat unit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-10-01T00:00:00Z"}
