        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Path ids are validated left-to-right in scope: a scout-package id belonging to production A addressed under production B's path returns 404 ERR_NOT_FOUND, not a cross-scope read."
        test_recipe:
          setup: ["J1, owner, location; productions A and B; scout package created under A"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "LA-CITY", name: "Los Angeles City", lead_time_business_days: 5, notification_lead_calendar_days: 3, notification_radius_ft: 500, base_fee_cents: 100000, per_day_fee_cents: 50000, per_lane_fee_cents: 20000, large_cast_threshold: 50, large_cast_multiplier_bps: 12500, min_liability_limit_cents: 100000000, police_monitor_lane_threshold: 2, holidays: [] }
