  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: auditorium_double_book_with_turnaround_buffer
        grounds:
          - validations[priority=8]
          - entities.Auditorium.fields.turnaround_minutes
          - entities.Showtime.fields.ends_at
          - errors[ERR_AUDITORIUM_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Auditorium resource: a new showtime is rejected when its start falls
          within the prior showtime's [starts_at, ends_at) PLUS the auditorium's
          turnaround_minutes buffer. Existing 20:00 + 90 + 15 pad = ends 21:45,
          +20 turnaround = blocked until 22:05; a 22:00 start is rejected. Buffer-
          inflated interval semantics.
        test_recipe:
          setup:
            - "Auditorium turnaround 20m; existing showtime 20:00 (ends 21:45); new showtime at 22:00 still inside the 22:05 buffer boundary"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Acme Films", minimum_guarantee_cents: 0 }
              as: CinemaManager
              captures: { dist_id: "$.data.id" }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 90, distributor_id: "${dist_id}", release_date: "2026-06-01T00:00:00.000Z", split_schedule: [ { week_index: 0, distributor_pct: 0.70 } ] }
              as: CinemaManager
              captures: { film_id: "$.data.id" }
            - call: "POST /auditoriums"
              payload: { name: "Hall 1", seat_count: 4, turnaround_minutes: 20 }
              as: CinemaManager
              captures: { aud_id: "$.data.id" }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-02T09:00:00.000Z" }
              as: CinemaManager
            - call: "POST /auditoriums/${aud_id}/showtimes"
              payload: { film_id: "${film_id}", starts_at: "2026-06-10T20:00:00.000Z", pricing_profile: "STANDARD", base_price_cents: 1000 }
              as: CinemaManager
              captures: { st_id: "$.data.id" }
          trigger:
            - call: "POST /auditoriums/${aud_id}/showtimes"
              payload: { film_id: "${film_id}", starts_at: "2026-06-10T22:00:00.000Z", pricing_profile: "STANDARD", base_price_cents: 1000 }
              as: CinemaManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_AUDITORIUM_DOUBLE_BOOKED"
            - "HTTP status 409 (22:00 < 22:05 buffer boundary)"

      - name: member_double_book_zero_buffer_overlap
        grounds:
          - validations[priority=13]
          - entities.Showtime.fields.starts_at
          - entities.Showtime.fields.ends_at
          - errors[ERR_MEMBER_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Member resource (different entity than Auditorium): a member with a live
          order on showtime X cannot create an order on showtime Y whose
          [starts_at, ends_at) overlaps X's — ZERO buffer, pure half-open overlap
          (distinct interval semantics from the turnaround-buffered auditorium
          check). Two showtimes in DIFFERENT auditoriums both 20:00–21:45.
        test_recipe:
          setup:
