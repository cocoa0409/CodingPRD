              payload: { destroyed_units: 60 }
              as: DestructionOfficer
              as_user_id: "officer-12"
              captures: { cert1: $.data.id }
            - call: "POST /sharps/destruction-certificates/${cert1}/void"
              payload: { void_reason: "destroyed unit count mis-keyed at the scale" }
              as: DestructionOfficer
              as_user_id: "officer-12"
              captures: { cert1_v: $.data.version }
          trigger:
