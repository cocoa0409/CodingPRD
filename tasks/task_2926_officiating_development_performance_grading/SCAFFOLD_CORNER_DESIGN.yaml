            - "${sod_status_review} == UNDER_REVIEW and ${sod_status_decided} == UPHELD with ${sod_decider} == sup-review-2 — same role, different user"
            - "${sod_grade_appeal_state} == APPEAL_RESOLVED while ${sod_grade_code} == MISSED_CALL and ${sod_grade_points} == 0.75 — UPHELD leaves the grade intact"

