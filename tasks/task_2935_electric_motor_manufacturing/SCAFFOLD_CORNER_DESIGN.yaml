              captures: { perm_1: $.data.permissible_unbalance_g_mm }
            - call: "POST /assembly-records"
              payload: { work_order_id: "${wo1_id}", stator_build_id: "${sb1_id}", rotor_build_id: "${rb1_id}", de_bearing_lot: "DE-2026-0431", nde_bearing_lot: "NDE-2026-0177", bearing_install_method: "INDUCTION_HEAT", shaft_measured_diameter_mm: 38.001, grease_fill_pct: 35.00 }
              as: BuildTechnician
              as_user_id: "u_tech_1"
              captures: { e_shaft: $.data.error_id }
            - call: "POST /assembly-records"
              payload: { work_order_id: "${wo1_id}", stator_build_id: "${sb1_id}", rotor_build_id: "${rb1_id}", de_bearing_lot: "DE-2026-0431", nde_bearing_lot: "NDE-2026-0177", bearing_install_method: "INDUCTION_HEAT", shaft_measured_diameter_mm: 38.010, grease_fill_pct: 35.00 }
              as: BuildTechnician
              as_user_id: "u_tech_1"
              captures: { e_grease: $.data.error_id }
            - call: "POST /assembly-records"
              payload: { work_order_id: "${wo1_id}", stator_build_id: "${sb1_id}", rotor_build_id: "${rb1_id}", de_bearing_lot: "DE-2026-0431", nde_bearing_lot: "NDE-2026-0177", bearing_install_method: "INDUCTION_HEAT", shaft_measured_diameter_mm: 38.018, grease_fill_pct: 60.00 }
              as: BuildTechnician
              as_user_id: "u_tech_1"
              captures: { ar_id: $.data.id, fit_um: $.data.shaft_fit_deviation_um }
          assert:
            - "setup leaves ${gap_1} == 0.450 with air_gap_deviation_mm == 0.000 and RotorBuild.${rb1_id}.status == MACHINED"
            - "${e_unbalance} == ERR_UNBALANCE_EXCEEDS_GRADE_LIMIT with HTTP 422 (296.1 against the permissible 296.0) and RotorBuild.${rb1_id}.status still MACHINED"
            - "trigger 2 returns HTTP 200 with ${perm_1} == 296.0, status == ACCEPTED and WorkOrder.${wo1_id}.build_status == SUBASSEMBLIES_DONE"
            - "${e_shaft} == ERR_SHAFT_FIT_OUT_OF_TOLERANCE with HTTP 422 — the grease value 35.00 is also illegal, so this proves priority 66 outranks priority 67"
            - "${e_grease} == ERR_LUBRICATION_FILL_OUT_OF_RANGE with HTTP 422 (35.00 below the GREASE_REGREASABLE minimum 40.00)"
            - "trigger 5 returns HTTP 201: AssemblyRecord.${ar_id}.status == BUILT, ${fit_um} == 18 (the inclusive k6 upper limit), grease_fill_pct == 60.00, lubrication_spec_applied == GREASE_REGREASABLE"
            - "WorkOrder.${wo1_id}.build_status == ASSEMBLED and rework_reject_count == 0"
            - "GET /assembly-records with work_order_id == ${wo1_id} returns total_count == 1"

