              payload: { school_id: "${s1}", student_local_id: "STU-39", referral_type: "INITIAL", requested_domains: ["COGNITIVE"] }
              as: IntakeCoordinator
              captures: { r1: $.data.id }
            - call: "POST /psych-services/referrals/${r1}/consent-events"
              payload: { event_type: "CONSENT_RECEIVED", effective_at: "2026-06-01T09:00:00Z", parent_signature_reference: "SIG-39" }
              as: IntakeCoordinator
              captures: { eval1: $.data.active_evaluation_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-09T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/compliance-runs"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /psych-services/evaluations/${eval1}/timeline-breaches"
              payload: {}
              as: ComplianceOfficer
              captures: { breach1: "$.data[0].id" }
          trigger:
            - call: "POST /psych-services/timeline-breaches/${breach1}/propose-remedy"
              payload: { remedy_basis: "BREACH_DAY_BASIS", additional_minutes: 5, corrective_action_note: "Compensatory sessions plus staff retraining." }
              as: ComplianceOfficer
          assert:
            - "The breach detected in setup has breach_days == 40, severity == SEVERE, minutes_breach_day_basis == 1800 (40 * 30 * 1.5) and minutes_missed_service_basis == 1350 (ceil(40/7) == 6 weeks * 150 * 1.5)"
            - "HTTP 422 with data.error_id == \"ERR_REMEDY_MINUTES_EXCEED_CAP\" (1800 + 5 == 1805 > 1800)"
            - "TimelineBreach.${breach1}.remedy_basis == null, additional_minutes == 0, remedy_minutes_awarded == 0 — nothing was clamped or stored"
            - "The same call with additional_minutes 0 is accepted with remedy_minutes_awarded == 1800 (equality passes)"
            - "The same call with remedy_basis MISSED_SERVICE_BASIS and additional_minutes 5 is accepted with remedy_minutes_awarded == 1355"

