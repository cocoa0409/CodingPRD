        distinguishing_aspect: "Tiling semantics: the FIRST report may start any quarter (no predecessor, gap check vacuous); a later report must start exactly at the latest period_end — one month late -> ERR_PERIOD_GAP; overlapping an existing period -> ERR_PERIOD_OVERLAP; a non-quarter-aligned window -> ERR_PERIOD_NOT_QUARTER."
