            - "No read mutated the row: Vehicle.${v1_id}.version is the same across all four responses"

      - name: the_same_user_cannot_prepare_and_file_one_return
        claim_type: segregation_of_duties
        grounds:
          - complexity_profile.role_model
          - validations[26].ERR_SEGREGATION_OF_DUTIES
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / segregation_of_duties_beats_bond_ceiling_on_return_filing
          rationale: "That §1.8 instance drives the identical prepared_by_user_id / X-User-ID collision on file and additionally proves it outranks the bond ceiling, so a separate plain segregation test would be strictly weaker."

