            - call: "POST /inland-marine/coverage-parts/${cp_sched}/equipment-items"
              payload: { description: "Second crane after the decline", equipment_type: "CRANE", model_year: 2024, original_cost_cents: 30000000, ownership: "OWNED", valuation_basis: "AGREED_VALUE", stated_value_cents: 60000000, expected_policy_version: "${pol_v1}" }
