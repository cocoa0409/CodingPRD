            - call: "POST /ad-policy/review-tasks/${task_alc}/decision"
              payload: { resolution: "APPROVE", note: "Attempting to approve a disclaimer-bearing category with no disclaimer" }
              as: PolicyReviewer
              as_user_id: "${rev_id}"
              captures: { err: "$.data.error_id" }
            - call: "GET /ad-policy/ad-creatives/${cr_sup}"
              payload: {}
              as: PolicyAdmin
            - call: "GET /ad-policy/ad-creatives/${cr_alc}"
              payload: {}
              as: PolicyAdmin
          assert:
            - "The SUP_HEALTH approval returns HTTP 200 with AdCreative.${cr_sup}.review_status == AUTO_APPROVED"
            - "The ALC_SPIRITS approval returns HTTP 422 with error_id ERR_POLITICAL_DISCLOSURE_MISSING even though the creative is not political"
            - "AdCreative.${cr_alc}.review_status is still PENDING_MANUAL_REVIEW and ReviewTask.${task_alc}.status is still CLAIMED"
            - "Reviewer.${rev_id}.claimed_task_count == 1 (only the resolved task released its slot)"

      - name: cascading_reason_code_consistency_is_checked_against_the_live_destination_axis
        claim_type: Violation → Error
        grounds:
          - validations[priority=86].ERR_INVALID_REASON_CODE
          - calculations.destination_check_result
          - calculations.disapproval_points_assessment
        distinguishing_aspect: |
          The same DISAPPROVE payload is rejected and then accepted: DESTINATION_MISMATCH is
          only admissible once a destination check has actually driven the axis to
          MISMATCH_FLAGGED, so the reason-code check reads state produced by another
          endpoint rather than validating the list in isolation.
        test_recipe:
          setup:
            - "Rule FIN_CREDIT (REGULATED, weight 4.00, requires_certification false, auto 0.90, manual 0.55, default_queue STANDARD) with no override."
            - "One verified advertiser, one reviewer on STANDARD authorised for US."
            - "One creative whose display_url host is www.beaconlending.example, screened at confidence 0.70 so it routes to manual review, then claimed."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "FIN_CREDIT", title: "Consumer credit offers", category_class: "REGULATED", base_severity_weight: 4.00, requires_certification: false, confidence_auto_disapprove_threshold: 0.90, confidence_manual_threshold: 0.55, default_queue: "STANDARD" }
              as: PolicyAdmin
              captures: { fin_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Beacon Lending Co", country_code: "US", industry_code: "CONSUMER_FINANCE" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "IDENTITY", outcome: "VERIFIED" }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "BUSINESS_STANDING", outcome: "VERIFIED" }
              as: PolicyAdmin
            - call: "POST /ad-policy/reviewers"
              payload: { display_name: "R. Alvarez", queue_specialties: ["STANDARD"], country_authorizations: ["US"], max_concurrent_claims: 3 }
              as: PolicyAdmin
              captures: { rev_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Redirected offer", body_text: "An offer whose landing page later resolves to a partner host.", declared_category_codes: ["FIN_CREDIT"], target_country_codes: ["US"], landing_page_url: "https://www.beaconlending.example/redirect", display_url: "https://www.beaconlending.example/redirect" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_v: "$.data.version" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/screening-runs"
              payload: { classifier_version: "clf-2026.07", decisions: [{ policy_rule_id: "${fin_id}", confidence: 0.70, matched_snippet: "partner host" }], expected_ad_creative_version: "${cr_v}" }
              as: PolicyAdmin
            - call: "GET /ad-policy/review-tasks"
              payload: { ad_creative_id: "${cr_id}" }
              as: PolicyAdmin
              captures: { task_id: "$.data[0].id" }
            - call: "POST /ad-policy/review-tasks/${task_id}/claim"
              payload: {}
              as: PolicyReviewer
              as_user_id: "${rev_id}"
          trigger:
            - call: "POST /ad-policy/review-tasks/${task_id}/decision"
              payload: { resolution: "DISAPPROVE", reason_codes: ["MANUAL_REVIEW", "DESTINATION_MISMATCH"], note: "Claiming a mismatch before any destination evidence exists" }
              as: PolicyReviewer
              as_user_id: "${rev_id}"
              captures: { err_early: "$.data.error_id" }
            - call: "POST /ad-policy/review-tasks/${task_id}/decision"
              payload: { resolution: "DISAPPROVE", reason_codes: ["AUTO_SCREENING"], note: "Claiming an automated reason on a human decision" }
              as: PolicyReviewer
              as_user_id: "${rev_id}"
              captures: { err_auto: "$.data.error_id" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/destination-checks"
              payload: { check_type: "INITIAL", user_agent_variant: "CRAWLER", fetched_final_url: "https://partner-lp.example/redirect", fetched_content_category: "GENERAL", http_status: 200 }
              as: IntegrityAnalyst
              captures: { chk_id: "$.data.id" }
            - call: "POST /ad-policy/review-tasks/${task_id}/decision"
              payload: { resolution: "DISAPPROVE", reason_codes: ["MANUAL_REVIEW", "DESTINATION_MISMATCH"], note: "Destination now confirmed to resolve to a partner host" }
              as: PolicyReviewer
              as_user_id: "${rev_id}"
            - call: "GET /ad-policy/disapproval-notices"
              payload: { ad_creative_id: "${cr_id}" }
              as: PolicyAdmin
              captures: { notice_id: "$.data[0].id" }
          assert:
            - "The first DISAPPROVE returns HTTP 422 with error_id ERR_INVALID_REASON_CODE (destination_status is DESTINATION_PENDING)"
            - "The AUTO_SCREENING attempt also returns HTTP 422 with error_id ERR_INVALID_REASON_CODE — that code is never admissible on a reviewer decision"
            - "DestinationCheck.${chk_id}.result == MISMATCH with mismatch_detail HOST_MISMATCH; the creative's destination_status becomes MISMATCH_FLAGGED while review_status stays PENDING_MANUAL_REVIEW and ReviewTask.${task_id} stays CLAIMED"
            - "The third DISAPPROVE returns HTTP 200 and DisapprovalNotice.${notice_id}.reason_codes == [MANUAL_REVIEW, DESTINATION_MISMATCH]"
            - "DisapprovalNotice.${notice_id}.assessment_lines == [{ policy_rule_code: FIN_CREDIT, reason_code: MANUAL_REVIEW, line_points: 4.00 }, { policy_rule_code: null, reason_code: DESTINATION_MISMATCH, line_points: 12.50 }] with assessed_points 16.50"
            - "AdCreative.${cr_id}.review_status == DISAPPROVED and Advertiser.${adv_id}.account_status == WARNED (severity_index 16.50)"

      - name: violation_policy_rule_creation_rejects_threshold_inversion_and_duplicate_codes
        claim_type: Violation → Error
        grounds:
          - validations[priority=92].ERR_INVALID_THRESHOLD_ORDER
          - validations[priority=90].ERR_DUPLICATE_POLICY_CODE
        distinguishing_aspect: |
          Threshold inversion is a cross-field business rule at priority 92, not a type
          check at priority 20: equal thresholds must return 422 ERR_INVALID_THRESHOLD_ORDER
          rather than 400 ERR_INVALID_REQUEST, and the same catalogue rejects a duplicate
          rule code and a duplicate (rule, country) override pair with 409.
        test_recipe:
          setup:
            - "One rule FIN_CREDIT already exists with a US override."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "FIN_CREDIT", title: "Consumer credit offers", category_class: "REGULATED", base_severity_weight: 4.00, confidence_auto_disapprove_threshold: 0.90, confidence_manual_threshold: 0.55 }
              as: PolicyAdmin
              captures: { fin_id: "$.data.id" }
            - call: "POST /ad-policy/policy-rules/${fin_id}/country-overrides"
              payload: { country_code: "US", disposition: "ALLOWED", severity_multiplier: 1.50 }
              as: PolicyAdmin
          trigger:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "SUP_HEALTH", title: "Health supplements", category_class: "REGULATED", base_severity_weight: 3.00, confidence_auto_disapprove_threshold: 0.50, confidence_manual_threshold: 0.50 }
              as: PolicyAdmin
              captures: { err_equal: "$.data.error_id" }
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "FIN_CREDIT", title: "Consumer credit offers, second attempt", category_class: "REGULATED", base_severity_weight: 9.00 }
              as: PolicyAdmin
              captures: { err_dup: "$.data.error_id" }
            - call: "POST /ad-policy/policy-rules/${fin_id}/country-overrides"
              payload: { country_code: "US", disposition: "BLOCKED", severity_multiplier: 2.00 }
              as: PolicyAdmin
              captures: { err_dup_override: "$.data.error_id" }
            - call: "GET /ad-policy/policy-rules"
              payload: {}
              as: PolicyAdmin
            - call: "GET /ad-policy/policy-rules/${fin_id}"
              payload: {}
              as: PolicyAdmin
          assert:
            - "The equal-threshold create returns HTTP 422 with error_id ERR_INVALID_THRESHOLD_ORDER (not 400 ERR_INVALID_REQUEST)"
            - "The duplicate code returns HTTP 409 with error_id ERR_DUPLICATE_POLICY_CODE"
            - "The duplicate (rule, country) override returns HTTP 409 with error_id ERR_DUPLICATE_POLICY_CODE as well"
            - "GET /ad-policy/policy-rules reports total_count == 1 and PolicyRule.${fin_id}.country_override_count == 1 with version 2 — no rejected write left a trace"

      - name: priority_ordering_the_role_check_outranks_body_validation_on_the_same_request
        claim_type: Priority Ordering
        grounds:
          - validations[priority=12].ERR_FORBIDDEN_ROLE
          - validations[priority=20].ERR_INVALID_REQUEST
          - validations[priority=22].ERR_INVALID_PAGINATION
        distinguishing_aspect: |
          A single request that is both role-forbidden and structurally invalid must report
          ERR_FORBIDDEN_ROLE, and a list read that is both role-allowed and badly paginated
          must report ERR_INVALID_PAGINATION — the 10/12/14/20/22 ladder is evaluated in
          number order, not in the order the checks are cheapest to run.
        test_recipe:
          setup:
            - "One rule exists so the list read has something to page over."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "FIN_CREDIT", title: "Consumer credit offers", category_class: "REGULATED", base_severity_weight: 4.00 }
              as: PolicyAdmin
          trigger:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "BAD_CODE" }
              as: PolicyReviewer
              as_user_id: "reviewer-not-yet-created"
              captures: { err_role: "$.data.error_id" }
            - call: "GET /ad-policy/policy-rules"
              payload: { limit: 500 }
              as: PolicyAdmin
              captures: { err_page: "$.data.error_id" }
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "SUP_HEALTH", category_class: "REGULATED", base_severity_weight: 3.00 }
              as: PolicyAdmin
              captures: { err_body: "$.data.error_id" }
            - call: "GET /ad-policy/policy-rules"
              payload: {}
              as: PolicyAdmin
          assert:
            - "The reviewer's create returns HTTP 403 with error_id ERR_FORBIDDEN_ROLE even though title and base_severity_weight are also missing"
            - "The over-limit list read returns HTTP 400 with error_id ERR_INVALID_PAGINATION (limit 500 exceeds the declared maximum of 100)"
            - "The admin's create with title omitted returns HTTP 400 with error_id ERR_INVALID_REQUEST, showing the body check does run once the role check passes"
            - "GET /ad-policy/policy-rules still reports total_count == 1"

      - name: priority_ordering_path_id_resolution_outranks_body_foreign_key_resolution
        claim_type: Priority Ordering
        grounds:
          - validations[priority=30].ERR_AD_CREATIVE_NOT_FOUND
          - validations[priority=32].ERR_POLICY_RULE_NOT_FOUND
        distinguishing_aspect: |
          A screening run posted to an unknown creative with an unknown rule id in its
          decisions must report ERR_AD_CREATIVE_NOT_FOUND: the priority 30 path ladder runs
          before the priority 32 body ladder, so the deeper body error is never reached.
        test_recipe:
          setup:
            - "One real rule and one real submitted creative exist, so both 404s are genuinely about the ids supplied."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "FIN_CREDIT", title: "Consumer credit offers", category_class: "REGULATED", base_severity_weight: 4.00 }
              as: PolicyAdmin
              captures: { fin_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Beacon Lending Co", country_code: "US", industry_code: "CONSUMER_FINANCE" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Real creative", body_text: "A real creative used as the control for the two 404 paths.", declared_category_codes: ["FIN_CREDIT"], target_country_codes: ["US"], landing_page_url: "https://www.beaconlending.example/real", display_url: "https://www.beaconlending.example/real" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_v: "$.data.version" }
          trigger:
            - call: "POST /ad-policy/ad-creatives/00000000-0000-4000-8000-000000000000/screening-runs"
              payload: { classifier_version: "clf-2026.07", decisions: [{ policy_rule_id: "00000000-0000-4000-8000-000000000001", confidence: 0.50, matched_snippet: "unknown on unknown" }], expected_ad_creative_version: "${cr_v}" }
              as: PolicyAdmin
              captures: { err_path: "$.data.error_id" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/screening-runs"
              payload: { classifier_version: "clf-2026.07", decisions: [{ policy_rule_id: "00000000-0000-4000-8000-000000000001", confidence: 0.50, matched_snippet: "unknown rule on a real creative" }], expected_ad_creative_version: "${cr_v}" }
              as: PolicyAdmin
              captures: { err_body: "$.data.error_id" }
            - call: "GET /ad-policy/ad-creatives/${cr_id}/screening-runs"
              payload: {}
              as: PolicyAdmin
          assert:
            - "The first trigger returns HTTP 404 with error_id ERR_AD_CREATIVE_NOT_FOUND, never ERR_POLICY_RULE_NOT_FOUND"
            - "The second trigger returns HTTP 404 with error_id ERR_POLICY_RULE_NOT_FOUND once the path resolves"
            - "GET the real creative's screening runs reports total_count == 0 and AdCreative.${cr_id}.screening_run_count == 0"

      - name: priority_conflict_task_state_outranks_reviewer_capacity
        claim_type: Priority Ordering
        grounds:
          - validations[priority=40].ERR_INVALID_TASK_STATE
          - validations[priority=66].ERR_REVIEWER_CAPACITY_EXCEEDED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / task_state_error_outranks_reviewer_capacity_error_on_claim
          rationale: "That instance constructs a claim that violates both rules at once and pins the 409 to the priority 40 error."

      - name: priority_conflict_appeal_window_outranks_certification_ownership
        claim_type: Priority Ordering
        grounds:
          - validations[priority=74].ERR_APPEAL_WINDOW_CLOSED
          - validations[priority=88].ERR_CERTIFICATION_OWNER_MISMATCH
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / appeal_window_closed_error_outranks_certification_owner_mismatch
          rationale: "That instance files one appeal that is both out of window and backed by another advertiser's certification."

      - name: priority_conflict_political_disclosure_outranks_certification_missing
        claim_type: Priority Ordering
        grounds:
          - validations[priority=56].ERR_POLITICAL_DISCLOSURE_MISSING
          - validations[priority=70].ERR_CERTIFICATION_MISSING
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / political_disclosure_error_outranks_certification_missing_on_approval
          rationale: "That instance drives one APPROVE_WITH_LIMITS decision that violates both the disclosure rule and the certification rule."

  # ===========================================================================
  - section: "From Table 5 (Endpoints)"
    instances:

      - name: standard_crud_reviewer_patch_changes_availability_without_disturbing_held_tasks
        claim_type: Standard CRUD
        grounds:
          - endpoints.POST_/ad-policy/reviewers
          - endpoints.GET_/ad-policy/reviewers/{id}
          - endpoints.PATCH_/ad-policy/reviewers/{id}
          - validations[priority=62].ERR_REVIEWER_OFFLINE
        distinguishing_aspect: |
          The PATCH endpoint's declared side effect is deliberately narrow: taking a reviewer
          OFFLINE and rewriting their queue specialties blocks the next claim but does not
          retroactively release the task they already hold, so claimed_task_count and the
          task's CLAIMED status survive a PATCH that would have made the claim impossible.
        test_recipe:
          setup:
            - "Rule FIN_CREDIT (REGULATED, weight 4.00, auto 0.90, manual 0.20, default_queue STANDARD)."
            - "One verified advertiser and two creatives, each submitted and screened at confidence 0.50, giving two QUEUED STANDARD tasks."
            - "One reviewer created with queue_specialties [STANDARD], country_authorizations [US] and status omitted, who claims the first task."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "FIN_CREDIT", title: "Consumer credit offers", category_class: "REGULATED", base_severity_weight: 4.00, confidence_auto_disapprove_threshold: 0.90, confidence_manual_threshold: 0.20, default_queue: "STANDARD" }
              as: PolicyAdmin
              captures: { fin_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Beacon Lending Co", country_code: "US", industry_code: "CONSUMER_FINANCE" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "IDENTITY", outcome: "VERIFIED" }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "BUSINESS_STANDING", outcome: "VERIFIED" }
              as: PolicyAdmin
            - call: "POST /ad-policy/reviewers"
              payload: { display_name: "R. Alvarez", queue_specialties: ["STANDARD"], country_authorizations: ["US"] }
              as: PolicyAdmin
              captures: { rev_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Offer one", body_text: "The first credit offer routed into the standard queue.", declared_category_codes: ["FIN_CREDIT"], target_country_codes: ["US"], landing_page_url: "https://www.beaconlending.example/one", display_url: "https://www.beaconlending.example/one" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr1: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives/${cr1}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr1_v: "$.data.version" }
            - call: "POST /ad-policy/ad-creatives/${cr1}/screening-runs"
              payload: { classifier_version: "clf-2026.07", decisions: [{ policy_rule_id: "${fin_id}", confidence: 0.50, matched_snippet: "credit offer" }], expected_ad_creative_version: "${cr1_v}" }
              as: PolicyAdmin
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Offer two", body_text: "The second credit offer routed into the standard queue.", declared_category_codes: ["FIN_CREDIT"], target_country_codes: ["US"], landing_page_url: "https://www.beaconlending.example/two", display_url: "https://www.beaconlending.example/two" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr2: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives/${cr2}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr2_v: "$.data.version" }
            - call: "POST /ad-policy/ad-creatives/${cr2}/screening-runs"
              payload: { classifier_version: "clf-2026.07", decisions: [{ policy_rule_id: "${fin_id}", confidence: 0.50, matched_snippet: "credit offer" }], expected_ad_creative_version: "${cr2_v}" }
