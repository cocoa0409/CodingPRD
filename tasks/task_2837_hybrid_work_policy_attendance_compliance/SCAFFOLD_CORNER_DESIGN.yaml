  - section: state_machines
    instances:

      - name: policy_cycle_posture_round_trip_then_locked_rejects_every_target
        claim_type: invalid_transitions
        grounds:
          - state_machines.PolicyCycle
          - errors[ERR_INVALID_POSTURE_TRANSITION]
          - validations[priority=50, ERR_INVALID_POSTURE_TRANSITION]
        distinguishing_aspect: "The OPEN -> RECALIBRATING -> OPEN cycle really is a loop (posture returns and version keeps climbing), a self-target is not a silent no-op, and LOCKED is a hard terminal: both remaining targets are refused from it."
        test_recipe:
          setup:
            - "One cycle, nothing else. No child rows, so no ERR_CYCLE_LOCKED path can interfere."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: WorkplaceProgramOffice
            - call: "POST /policy-cycles"
              payload: { cycle_label: "FY27-CRN20", effective_from: "2026-09-01", effective_to: "2026-12-31", days_in_office_floor: 2, badge_weight: 0.60, network_weight: 0.40, collaboration_target_score: 70.00, equity_variance_threshold_pct: 20.00 }
              as: WorkplaceProgramOffice
              captures: { cyc_id: $.data.id }
          trigger:
            - call: "POST /policy-cycles/${cyc_id}/posture"
              payload: { target_posture: "RECALIBRATING", note: "H1 measurement window" }
              as: WorkplaceProgramOffice
              as_user_id: "wpo-1"
            - call: "POST /policy-cycles/${cyc_id}/posture"
              payload: { target_posture: "RECALIBRATING" }
              as: WorkplaceProgramOffice
              as_user_id: "wpo-1"
              captures: { e_self: "$.data.error_id" }
            - call: "POST /policy-cycles/${cyc_id}/posture"
              payload: { target_posture: "OPEN" }
              as: WorkplaceProgramOffice
              as_user_id: "wpo-1"
            - call: "POST /policy-cycles/${cyc_id}/posture"
              payload: { target_posture: "LOCKED" }
              as: WorkplaceProgramOffice
              as_user_id: "wpo-1"
            - call: "POST /policy-cycles/${cyc_id}/posture"
              payload: { target_posture: "OPEN" }
              as: WorkplaceProgramOffice
              as_user_id: "wpo-1"
              captures: { e_out1: "$.data.error_id" }
            - call: "POST /policy-cycles/${cyc_id}/posture"
              payload: { target_posture: "RECALIBRATING" }
              as: WorkplaceProgramOffice
              as_user_id: "wpo-1"
              captures: { e_out2: "$.data.error_id" }
          assert:
            - "Call 1: HTTP 200, posture == 'RECALIBRATING', version == 2"
            - "Call 2: HTTP 409 ERR_INVALID_POSTURE_TRANSITION - RECALIBRATING -> RECALIBRATING is not a declared edge, and version stays 2, so the refusal is not a silent success"
            - "Call 3: HTTP 200, posture == 'OPEN', version == 3 - the loop closed and the version did NOT reset"
            - "Call 4: HTTP 200, posture == 'LOCKED', version == 4"
            - "Calls 5 and 6: HTTP 409 ERR_INVALID_POSTURE_TRANSITION with version still 4 - LOCKED is terminal for every target"

