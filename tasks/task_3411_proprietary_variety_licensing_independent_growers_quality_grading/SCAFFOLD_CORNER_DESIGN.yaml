  # ===========================================================================
  - section: cross_cutting
    instances:
      - name: occ_stale_agreement_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[planting-create-stale-agreement]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "Creating a planting with expected_agreement_version one behind the agreement's current version (2 observed, then bumped) is rejected 412 ERR_STALE_VERSION — the write never happens."
        test_recipe:
          setup: ["V1 RELEASED; G1 with ACTIVE A1 (version 2 after decide); lot L1."]
          setup_api_calls:
            - *c_clock
            - *c_v1
            - *c_v1_rel
            - *c_g1
            - *c_a1
            - *c_a1_dec
            - *c_l1
          trigger:
            - call: "POST /licensing/plantings"
              payload: { agreement_id: "${a1_id}", plant_lot_id: "${l1_id}", planned_plants: 100, expected_agreement_version: "${a1_v} - 1" }
              as: GrowerPrincipal
              as_user_id: "${g1_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 412 with error_id == ERR_STALE_VERSION"
            - "GET /licensing/plantings?agreement_id=${a1_id} returns 0 rows; agreement.version stays ${a1_v}"

      - name: occ_correct_version_succeeds_then_stale_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[planting-create-stale-agreement]
          - entities.GrowerAgreement
        distinguishing_aspect: "The happy path increments the parent's version: a planting create with the current version (2) succeeds and bumps the agreement to 3; replaying the same request with the now-stale version 2 is then rejected 412 — a deterministic two-step serialization."
        test_recipe:
          setup: ["V1 RELEASED; G1 with ACTIVE A1 (version 2); lot L1 (2000 plants)."]
          setup_api_calls:
            - *c_clock
            - *c_v1
            - *c_v1_rel
            - *c_g1
            - *c_a1
            - *c_a1_dec
            - *c_l1
          trigger:
            - call: "POST /licensing/plantings"
              payload: { agreement_id: "${a1_id}", plant_lot_id: "${l1_id}", planned_plants: 100, expected_agreement_version: "${a1_v}" }
              as: GrowerPrincipal
              as_user_id: "${g1_id}"
              captures: { px_id: $.data.id }
            - call: "GET /licensing/agreements/${a1_id}"
              payload: {}
              as: PlatformAdmin
            - call: "POST /licensing/plantings"
              payload: { agreement_id: "${a1_id}", plant_lot_id: "${l1_id}", planned_plants: 100, expected_agreement_version: "${a1_v}" }
              as: GrowerPrincipal
              as_user_id: "${g1_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "first create: 201, Planting.${px_id} PLANNED, and GrowerAgreement.${a1_id}.version == 3 (was 2 — creation bumps the parent's version)"
            - "second create with the same expected version 2: 412 ERR_STALE_VERSION"
            - "exactly 1 planting exists for the agreement afterwards"

      - name: occ_stale_planting_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[harvest-lot-create-stale-planting]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "The second OCC guard sits on harvest-lot creation: expected_planting_version one behind the planting's current version (2 after confirm) is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Canonical chain through P1 confirmed (version 2); clock 2026-08-04."]
          setup_api_calls:
            - *c_clock
            - *c_v1
            - *c_v1_rel
            - *c_g1
            - *c_a1
            - *c_a1_dec
            - *c_l1
            - *c_w1
            - *c_p1
            - *c_clock_aug
            - *c_p1_conf
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /licensing/harvest-lots"
              payload: { planting_id: "${p1_id}", harvested_at: "2026-08-03T06:00:00Z", gross_weight_kg: 100, expected_planting_version: "${p1_v} - 1" }
              as: GrowerPrincipal
              as_user_id: "${g1_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 412 with error_id == ERR_STALE_VERSION"
            - "GET /licensing/harvest-lots?planting_id=${p1_id} returns 0 rows; Planting.${p1_id} stays PLANTED (no auto-HARVESTING fired)"

      - name: suspend_cascade_suspends_only_active_agreements
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Grower.ACTIVE_to_SUSPENDED
          - state_machines.GrowerAgreement.ACTIVE_to_SUSPENDED
        distinguishing_aspect: "The suspend cascade is conditional on child state: the ACTIVE agreement flips to SUSPENDED (version bumped), while the same grower's PENDING_REVIEW agreement is untouched — cascade selectivity, not blanket mutation."
        test_recipe:
          setup: ["V1 RELEASED; G1 with A1 ACTIVE and A1B PENDING_REVIEW (disjoint 2028 window)."]
          setup_api_calls:
            - *c_clock
            - *c_v1
            - *c_v1_rel
            - *c_g1
            - *c_a1
            - *c_a1_dec
            - call: "POST /licensing/agreements"
              payload: { grower_id: "${g1_id}", variety_id: "${v1_id}", region_code: "CA-SALINAS", max_planting_units: 500, cultural_practice_codes: ["ORGANIC"], effective_from: "2028-01-01T00:00:00Z", effective_to: "2028-12-31T00:00:00Z", exclusive_marketing: true }
              as: GrowerPrincipal
              as_user_id: "${g1_id}"
              captures: { a1b_id: $.data.id }
          trigger:
            - call: "POST /licensing/growers/${g1_id}/suspend"
              payload: { reason: "compliance investigation" }
              as: ComplianceOfficer
            - call: "GET /licensing/agreements/${a1_id}"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /licensing/agreements/${a1b_id}"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "Grower.${g1_id}: status SUSPENDED, suspended_at set, version == 2"
            - "GrowerAgreement.${a1_id}: status SUSPENDED, version == 3 (create 1, decide 2, cascade 3)"
            - "GrowerAgreement.${a1b_id}: status stays PENDING_REVIEW, version == 1 — the cascade touches only ACTIVE agreements"

      - name: dual_variant_pool_corner
        claim_type: dual_variant_calculation
        grounds: [calculations.pool_rate]
        excluded_because:
          difficulty_instance: dual_variant_calc / pool_rate_provisional_vs_final
          rationale: "Both pool variants and their persisted per-lot deltas are asserted there."

      - name: dual_variant_royalty_corner
        claim_type: dual_variant_calculation
        grounds: [calculations.royalty_charge]
        excluded_because:
          difficulty_instance: dual_variant_calc / royalty_provisional_vs_tiered_final
          rationale: "Both royalty variants and the adjustment reconciliation are asserted there."

      - name: exit_cascade_corner
        claim_type: cascading_side_effects
        grounds: [state_machines.Grower.ACTIVE_to_EXITED]
        excluded_because:
          difficulty_instance: transitive_cascade / grower_exit_depth_cascade
          rationale: "The depth-3 exit cascade with reservation release is asserted there."

      - name: recall_cascade_corner
        claim_type: cascading_side_effects
        grounds: [state_machines.RecallOrder.ISSUED_to_COMPLETE]
        excluded_because:
          difficulty_instance: transitive_cascade / recall_enforce_depth_cascade
          rationale: "The depth-4 recall-enforce cascade with lot destruction and window unbooking is asserted there."

  # ===========================================================================
  - section: consistency
    instances:
      - name: receive_response_carries_computed_fields_immediately
        claim_type: immediate
        grounds:
          - entities.HarvestLot.fields.precool_hours
          - entities.HarvestLot.fields.cold_chain_compliant
        distinguishing_aspect: "Immediate consistency: the receive RESPONSE itself carries the computed precool_hours (6.0), cold_chain_compliant (true), net_kg (1150), lot_status (RECEIVED) and received_by_user_id (co-1) — no re-read is needed to observe the cold-chain evaluation."
        test_recipe:
          setup: ["Canonical chain through H1 created (IN_TRANSIT); clock 2026-10-06T12:30."]
          setup_api_calls:
            - *c_clock
            - *c_v1
            - *c_v1_rel
            - *c_g1
            - *c_a1
            - *c_a1_dec
            - *c_l1
            - *c_w1
            - *c_p1
            - *c_clock_aug
            - *c_p1_conf
            - *c_clock_h1a
            - *c_h1
            - *c_clock_h1b
          trigger:
            - call: "POST /licensing/harvest-lots/${h1_id}/receive"
              payload: { received_at: "2026-10-06T12:00:00Z", pulp_temp_c_at_receipt: 3.5 }
              as: CoolingOperator
              as_user_id: "co-1"
          assert:
            - "the 200 response body has lot_status == RECEIVED, precool_hours == 6.0, cold_chain_compliant == true"
            - "the same response carries net_kg == 1150, received_at == 2026-10-06T12:00:00Z, received_by_user_id == \"co-1\""
            - "updated_at == 2026-10-06T12:30:00Z (logical clock) and version == 2"
