              captures: { seg_cde_id: $.data.id }
          trigger:
            - call: "POST /engagements/${eng_id}/system-components"
              payload: { hostname: "fw-01", component_type: "FIREWALL", function_class: "SECURITY_SERVICE", stores_chd: false, facility_name: "DC-EAST", facility_type: "DATA_CENTER", segment_id: "${seg_cde_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { err_enum: $.data.error_id }
          assert:
            - "HTTP 400 with ${err_enum} == ERR_INVALID_REQUEST"
            - "GET /system-components?engagement_id=${eng_id} returns 0 rows"
            - "Engagement.${eng_id}.cde_component_count == 0 and assessment_fee_total == 43200.00 - a rejected write re-prices nothing"

      - name: entity_component_segment_from_another_engagement_returns_cross_engagement_reference
        claim_type: Parent Relationships
        grounds:
          - validations[priority=7]
          - entities.SystemComponent.fields.segment_id
          - errors[ERR_CROSS_ENGAGEMENT_REFERENCE]
        distinguishing_aspect: "The segment_id in the body resolves (it is a real NetworkSegment, so priority 5 passes) but belongs to a different engagement than the path id, so priority 7 answers 422 ERR_CROSS_ENGAGEMENT_REFERENCE - the graph topology's cross-aggregate integrity check, distinct from a 404."
        test_recipe:
          setup:
            - "Two engagements exist, each led by a different assessor: 'Northwind Retail Inc' (E1) and 'Harbor Fuel Stops LLC' (E2)."
            - "E2 holds a DECLARED CDE segment 'OTHER-CDE'; E1 holds no segment."
            - "The two leads have non-overlapping fieldwork windows so the priority-12 calendar rule stays silent."
          setup_api_calls:
            - call: "POST /assessors"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: false }
              as: PlatformAdmin
              captures: { lead_1_id: $.data.id }
            - call: "POST /assessors"
              payload: { full_name: "Owen Marsh", email: "owen.marsh@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: false }
              as: PlatformAdmin
              captures: { lead_2_id: $.data.id }
            - call: "POST /assessors"
              payload: { full_name: "Kim Vance", email: "kim.vance@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: true }
              as: PlatformAdmin
              captures: { qa_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_legal_name: "Northwind Retail Inc", merchant_level: "L1", assessment_year: 2026, acquirer_name: "First Coast Bank", fieldwork_start_date: "2026-08-10", fieldwork_end_date: "2026-08-28", approved_budget_amount: 200000.00, lead_assessor_id: "${lead_1_id}", qa_reviewer_id: "${qa_id}" }
              as: LeadAssessor
              as_user_id: "${lead_1_id}"
              captures: { eng_1_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_legal_name: "Harbor Fuel Stops LLC", merchant_level: "L1", assessment_year: 2026, acquirer_name: "Second Harbor Bank", fieldwork_start_date: "2026-08-10", fieldwork_end_date: "2026-08-28", approved_budget_amount: 200000.00, lead_assessor_id: "${lead_2_id}", qa_reviewer_id: "${qa_id}" }
              as: LeadAssessor
              as_user_id: "${lead_2_id}"
              captures: { eng_2_id: $.data.id }
            - call: "POST /engagements/${eng_2_id}/network-segments"
              payload: { name: "OTHER-CDE", segment_class: "CDE" }
              as: LeadAssessor
              as_user_id: "${lead_2_id}"
              captures: { seg_other_id: $.data.id }
          trigger:
            - call: "POST /engagements/${eng_1_id}/system-components"
              payload: { hostname: "app-01", component_type: "SERVER", function_class: "SECURITY_SERVICE", stores_chd: false, facility_name: "DC-EAST", facility_type: "DATA_CENTER", segment_id: "${seg_other_id}" }
              as: LeadAssessor
              as_user_id: "${lead_1_id}"
              captures: { err_cross: $.data.error_id }
          assert:
            - "HTTP 422 with ${err_cross} == ERR_CROSS_ENGAGEMENT_REFERENCE - not ERR_SEGMENT_NOT_FOUND, because the id does resolve"
            - "GET /system-components?engagement_id=${eng_1_id} returns 0 rows and GET /system-components?engagement_id=${eng_2_id} returns 0 rows"
            - "NetworkSegment.${seg_other_id}.engagement_id == ${eng_2_id} and its version is unchanged"

      - name: entity_segment_reparent_into_own_subtree_returns_segment_cycle
        claim_type: Parent Relationships
        grounds:
          - validations[priority=7]
          - entities.NetworkSegment.fields.parent_segment_id
          - errors[ERR_SEGMENT_CYCLE]
        distinguishing_aspect: "The segment forest is self-referential, so the only way to break it is a re-parent: with A the parent of B, PATCH /network-segments/A {parent_segment_id: B} would close a two-node loop and is refused with 422 ERR_SEGMENT_CYCLE, while re-parenting A under an unrelated sibling C succeeds - the check walks the proposed parent's chain, it does not simply compare ids."
        test_recipe:
          setup:
            - "One engagement in SCOPING holds three DECLARED segments: 'ZONE-A' (CDE, no parent), 'ZONE-B' (CONNECTED, parent ZONE-A) and 'ZONE-C' (CONNECTED, no parent)."
            - "No segment has been tested, so all three are DECLARED and re-parentable; none has components."
          setup_api_calls:
            - call: "POST /assessors"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: false }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /assessors"
              payload: { full_name: "Kim Vance", email: "kim.vance@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: true }
              as: PlatformAdmin
              captures: { qa_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_legal_name: "Northwind Retail Inc", merchant_level: "L1", assessment_year: 2026, acquirer_name: "First Coast Bank", fieldwork_start_date: "2026-08-10", fieldwork_end_date: "2026-08-28", approved_budget_amount: 200000.00, lead_assessor_id: "${lead_id}", qa_reviewer_id: "${qa_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/network-segments"
              payload: { name: "ZONE-A", segment_class: "CDE" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { seg_a_id: $.data.id }
            - call: "POST /engagements/${eng_id}/network-segments"
              payload: { name: "ZONE-B", segment_class: "CONNECTED", parent_segment_id: "${seg_a_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { seg_b_id: $.data.id }
            - call: "POST /engagements/${eng_id}/network-segments"
              payload: { name: "ZONE-C", segment_class: "CONNECTED" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { seg_c_id: $.data.id }
          trigger:
            - call: "PATCH /network-segments/${seg_a_id}"
              payload: { parent_segment_id: "${seg_b_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { err_cycle: $.data.error_id }
            - call: "PATCH /network-segments/${seg_a_id}"
              payload: { parent_segment_id: "${seg_c_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
          assert:
            - "The first call returns HTTP 422 with ${err_cycle} == ERR_SEGMENT_CYCLE"
            - "NetworkSegment.${seg_a_id}.parent_segment_id is still null after the refusal and its version is unchanged"
            - "The second call returns HTTP 200 with NetworkSegment.${seg_a_id}.parent_segment_id == ${seg_c_id} and version incremented by 1"
            - "NetworkSegment.${seg_b_id}.parent_segment_id == ${seg_a_id} throughout - the chain is now C -> A -> B, still a forest"
            - "All three segments keep segmentation_status == DECLARED and effective_class == their own segment_class; Engagement.${eng_id}.cde_component_count == 0"
            - "Engagement.${eng_id}.unvalidated_segment_count == 3 and posture == RESTRICTED across both calls"

      - name: entity_computed_partition_counts_recomputed_from_source_rows
        claim_type: Computed Fields
        grounds:
          - entities.Engagement.fields.cde_component_count
          - entities.Engagement.fields.in_scope_component_count
        excluded_because:
          difficulty_instance: scope_partition_conserved_across_segment_fail_and_revalidation
          rationale: "That §1.8 instance asserts every partition counter as a literal at four successive states (baseline, after FAIL, after re-plan, after PASS), which subsumes a standalone computed-field check."

      - name: entity_engagement_fee_recomputed_on_every_scope_write
        claim_type: Computed Fields
        grounds:
          - entities.Engagement.fields.assessment_fee_total
          - calculations.assessment_fee_total
        excluded_because:
          difficulty_instance: assessment_fee_total_seven_step_ordering
          rationale: "The seven-step fee ordering instance pins estimated_hours and assessment_fee_total as literals for two different engagements, covering the computed-field claim at higher resolution."

  # ---------------------------------------------------------------------------
  # Section 2 — State Machines (Table 2 claim types + `parallel` shape rows)
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:

      - name: state_machine_engagement_and_segment_start_in_declared_initial_states
        claim_type: Initial State
        grounds:
          - state_machines.Engagement.initial_state
          - state_machines.NetworkSegment.initial_state
          - calculations.engagement_posture
        distinguishing_aspect: "A freshly created engagement starts in SCOPING with scope_locked false, and a freshly created segment starts in DECLARED with revalidation_round 0 - and because DECLARED is inside UNVALIDATED_SEGMENT_STATES, the very act of declaring the first segment flips the engagement's posture from OPEN to RESTRICTED without any transition being triggered."
        test_recipe:
          setup:
            - "Two ACTIVE assessors exist; no engagement exists yet."
          setup_api_calls:
            - call: "POST /assessors"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: false }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /assessors"
              payload: { full_name: "Kim Vance", email: "kim.vance@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: true }
              as: PlatformAdmin
              captures: { qa_id: $.data.id }
          trigger:
            - call: "POST /engagements"
              payload: { client_legal_name: "Northwind Retail Inc", merchant_level: "L1", assessment_year: 2026, acquirer_name: "First Coast Bank", fieldwork_start_date: "2026-08-10", fieldwork_end_date: "2026-08-28", approved_budget_amount: 200000.00, lead_assessor_id: "${lead_id}", qa_reviewer_id: "${qa_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/network-segments"
              payload: { name: "CDE-CORE", segment_class: "CDE" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { seg_cde_id: $.data.id }
          assert:
            - "Immediately after the first call: Engagement.${eng_id}.status == SCOPING (the declared initial_state), posture == OPEN, scope_locked == false, unvalidated_segment_count == 0"
            - "NetworkSegment.${seg_cde_id}.segmentation_status == DECLARED (the declared initial_state), test_method is null, planned_date is null, revalidation_round == 0, last_validated_at is null"
            - "NetworkSegment.${seg_cde_id}.effective_class == CDE and scope_expanded_by_failure == false"
            - "After the second call: Engagement.${eng_id}.unvalidated_segment_count == 1 and posture == RESTRICTED - DECLARED is an unvalidated state"
            - "Engagement.${eng_id}.status is still SCOPING - declaring a segment is not an engagement transition"

      - name: state_machine_segment_verdict_from_declared_returns_invalid_segment_state
        claim_type: Invalid Transitions
        grounds:
          - validations[priority=9]
          - state_machines.NetworkSegment.DECLARED_to_TEST_PLANNED
          - errors[ERR_INVALID_SEGMENT_STATE]
        distinguishing_aspect: "There is no DECLARED -> VALIDATED edge: a verdict may only be recorded from TEST_PLANNED, so posting a PASS to a freshly declared segment answers 409 ERR_INVALID_SEGMENT_STATE and the segment does not become VALIDATED by shortcut. The same call succeeds once a test plan exists."
        test_recipe:
          setup:
            - "One engagement in SCOPING holds a single DECLARED CDE segment with no test plan."
          setup_api_calls:
            - call: "POST /assessors"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: false }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /assessors"
              payload: { full_name: "Kim Vance", email: "kim.vance@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: true }
              as: PlatformAdmin
              captures: { qa_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_legal_name: "Northwind Retail Inc", merchant_level: "L1", assessment_year: 2026, acquirer_name: "First Coast Bank", fieldwork_start_date: "2026-08-10", fieldwork_end_date: "2026-08-28", approved_budget_amount: 200000.00, lead_assessor_id: "${lead_id}", qa_reviewer_id: "${qa_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/network-segments"
              payload: { name: "CDE-CORE", segment_class: "CDE" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { seg_cde_id: $.data.id }
          trigger:
            - call: "POST /network-segments/${seg_cde_id}/validation-result"
              payload: { outcome: "PASS", note: "Verbal confirmation from the network team." }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { err_state: $.data.error_id }
            - call: "POST /network-segments/${seg_cde_id}/segmentation-test-plan"
              payload: { test_method: "PEN_TEST", planned_date: "2026-08-05" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /network-segments/${seg_cde_id}/validation-result"
              payload: { outcome: "PASS", note: "Penetration test confirmed isolation." }
              as: LeadAssessor
              as_user_id: "${lead_id}"
          assert:
            - "The first call returns HTTP 409 with ${err_state} == ERR_INVALID_SEGMENT_STATE"
            - "After the refusal NetworkSegment.${seg_cde_id}.segmentation_status == DECLARED and last_validated_at is still null"
            - "The second call returns HTTP 200 with segmentation_status == TEST_PLANNED, test_method == PEN_TEST and planned_date == 2026-08-05"
            - "The third call returns HTTP 200 with segmentation_status == VALIDATED and last_validated_at == 2026-08-01T00:00:00Z"
            - "Engagement.${eng_id}.unvalidated_segment_count == 0 and posture == OPEN only after the third call"

      - name: state_machine_withdrawn_segment_rejects_a_new_test_plan
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.NetworkSegment.DECLARED_to_WITHDRAWN
          - validations[priority=9]
          - errors[ERR_INVALID_SEGMENT_STATE]
        distinguishing_aspect: "WITHDRAWN is terminal: no edge leaves it, so planning a test on a withdrawn segment answers 409 ERR_INVALID_SEGMENT_STATE. The withdrawal also removes the row from UNVALIDATED_SEGMENT_STATES, which is why the engagement's posture relaxes even though the segment was never validated."
        test_recipe:
          setup:
            - "One engagement in SCOPING holds two DECLARED segments: 'CDE-CORE' (CDE) and 'LEGACY-DMZ' (OUT_OF_SCOPE), neither with components or children."
          setup_api_calls:
            - call: "POST /assessors"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: false }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /assessors"
              payload: { full_name: "Kim Vance", email: "kim.vance@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: true }
              as: PlatformAdmin
              captures: { qa_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_legal_name: "Northwind Retail Inc", merchant_level: "L1", assessment_year: 2026, acquirer_name: "First Coast Bank", fieldwork_start_date: "2026-08-10", fieldwork_end_date: "2026-08-28", approved_budget_amount: 200000.00, lead_assessor_id: "${lead_id}", qa_reviewer_id: "${qa_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/network-segments"
              payload: { name: "CDE-CORE", segment_class: "CDE" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { seg_cde_id: $.data.id }
            - call: "POST /engagements/${eng_id}/network-segments"
              payload: { name: "LEGACY-DMZ", segment_class: "OUT_OF_SCOPE" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { seg_dmz_id: $.data.id }
          trigger:
            - call: "POST /network-segments/${seg_dmz_id}/withdraw"
              payload: { reason: "The client removed the legacy DMZ from the network before fieldwork began." }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /network-segments/${seg_dmz_id}/segmentation-test-plan"
              payload: { test_method: "CONFIG_REVIEW", planned_date: "2026-08-06" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { err_terminal: $.data.error_id }
            - call: "POST /network-segments/${seg_dmz_id}/withdraw"
              payload: { reason: "Duplicate withdrawal attempt recorded by the coordinator." }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { err_terminal_2: $.data.error_id }
          assert:
            - "The withdrawal returns HTTP 200 with NetworkSegment.${seg_dmz_id}.segmentation_status == WITHDRAWN"
            - "The test-plan call returns HTTP 409 with ${err_terminal} == ERR_INVALID_SEGMENT_STATE and leaves test_method null"
            - "The repeated withdrawal returns HTTP 409 with ${err_terminal_2} == ERR_INVALID_SEGMENT_STATE - a terminal state is not idempotently re-enterable"
            - "Engagement.${eng_id}.unvalidated_segment_count == 1 after the withdrawal (only CDE-CORE remains unvalidated) and posture == RESTRICTED"
            - "NetworkSegment.${seg_cde_id}.segmentation_status == DECLARED throughout - withdrawal touches one row only"

      - name: state_machine_second_start_testing_on_the_same_requirement_is_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.RequirementAssessment.NOT_STARTED_to_IN_TESTING
          - validations[priority=9]
          - errors[ERR_INVALID_REQUIREMENT_STATE]
        distinguishing_aspect: "start-testing is not idempotent: replaying it while the requirement is already IN_TESTING answers 409 ERR_INVALID_REQUIREMENT_STATE and, critically, does NOT bump requirement.version a second time - a rejected transition must leave the OCC token untouched so a concurrent worksheet write is not spuriously invalidated."
        test_recipe:
          setup:
            - "Engagement 'Northwind Retail Inc' is in FIELDWORK with a VALIDATED CDE segment, three sampled components at DC-EAST, an ACTIVE FINAL sampling plan, and requirement 1.2.1 created as APPLICABLE."
          setup_api_calls:
            - call: "POST /assessors"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: false }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /assessors"
              payload: { full_name: "Kim Vance", email: "kim.vance@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: true }
              as: PlatformAdmin
              captures: { qa_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_legal_name: "Northwind Retail Inc", merchant_level: "L1", assessment_year: 2026, acquirer_name: "First Coast Bank", fieldwork_start_date: "2026-08-10", fieldwork_end_date: "2026-08-28", approved_budget_amount: 200000.00, lead_assessor_id: "${lead_id}", qa_reviewer_id: "${qa_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/network-segments"
              payload: { name: "CDE-CORE", segment_class: "CDE" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { seg_cde_id: $.data.id }
            - call: "POST /network-segments/${seg_cde_id}/segmentation-test-plan"
              payload: { test_method: "PEN_TEST", planned_date: "2026-08-05" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /network-segments/${seg_cde_id}/validation-result"
              payload: { outcome: "PASS", note: "Segmentation verified." }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /engagements/${eng_id}/system-components"
              payload: { hostname: "app-01", component_type: "SERVER", function_class: "SECURITY_SERVICE", stores_chd: false, facility_name: "DC-EAST", facility_type: "DATA_CENTER", segment_id: "${seg_cde_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /engagements/${eng_id}/system-components"
              payload: { hostname: "pay-01", component_type: "APPLICATION", function_class: "PAYMENT_APPLICATION", stores_chd: true, facility_name: "DC-EAST", facility_type: "DATA_CENTER", segment_id: "${seg_cde_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /engagements/${eng_id}/system-components"
              payload: { hostname: "pay-02", component_type: "APPLICATION", function_class: "PAYMENT_APPLICATION", stores_chd: true, facility_name: "DC-EAST", facility_type: "DATA_CENTER", segment_id: "${seg_cde_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "GET /engagements/${eng_id}"
              payload: {}
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { eng_v1: $.data.version }
            - call: "POST /engagements/${eng_id}/sampling-plans"
              payload: { plan_variant: "FINAL", justification_text: "Full coverage of the in-scope inventory.", expected_engagement_version: "${eng_v1}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /engagements/${eng_id}/scope-lock"
              payload: {}
              as: LeadAssessor
