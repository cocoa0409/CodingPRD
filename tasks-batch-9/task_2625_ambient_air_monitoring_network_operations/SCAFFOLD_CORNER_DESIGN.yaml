              captures: { site_v1: "$.data.version" }
            - call: "POST /design-values"
              payload: { site_id: "${site_a_id}", pollutant_id: "${pm25_id}", period_end_year: 2025, variant: "WITH_EVENT_DATA", expected_monitoring_site_version: "${site_v1}" }
              as: ProgramManager
              captures: { dv1_id: "$.data.id" }
          trigger:
            - call: "POST /design-values"
              payload: { site_id: "${site_a_id}", pollutant_id: "${pm25_id}", period_end_year: 2025, variant: "WITH_EVENT_DATA", expected_monitoring_site_version: "${site_v1}" }
              as: ProgramManager
              captures: { err: "$.data.error_id" }
            - call: "GET /monitoring-sites/${site_a_id}"
              payload: {}
              as: ProgramManager
              captures: { site_v2: "$.data.version" }
            - call: "POST /design-values"
              payload: { site_id: "${site_a_id}", pollutant_id: "${pm25_id}", period_end_year: 2025, variant: "WITH_EVENT_DATA", expected_monitoring_site_version: "${site_v2}" }
              as: ProgramManager
              captures: { dv2_id: "$.data.id" }
          assert:
            - "the replayed call returns HTTP 412 with error_id == ERR_STALE_SITE_VERSION"
            - "${site_v2} == ${site_v1} + 1"
            - "the retried call returns HTTP 201 and DesignValue.${dv2_id}.status == PROVISIONAL with design_value == 9.1"
            - "DesignValue.${dv1_id}.status == SUPERSEDED with stale_reason == RECOMPUTED"
            - "GET /design-values?site_id=${site_a_id}&status=PROVISIONAL returns total_count == 1"

      - name: the_site_version_increments_on_every_write_that_touches_it
        claim_type: optimistic_concurrency
        grounds:
          - entities.MonitoringSite
          - state_machines.MonitoringSite
        distinguishing_aspect: "The site's version advances on its own transitions AND on a child monitor's commission, so the four observed values are strictly increasing by one each - a version that only moves on direct site writes would stall at the commission step."
        test_recipe:
          setup:
            - "one network with an APPROVED monitor pending commission on a freshly created site"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pollutants"
              payload: { code: "PM25", averaging_period_hours: 24, standard_form: "ANNUAL_MEAN", primary_standard_value: 9.0 }
              as: NetworkAdmin
              captures: { pm25_id: "$.data.id" }
            - call: "POST /reference-methods"
              payload: { pollutant_id: "${pm25_id}", method_code: "RFPS-0617-001", designation_type: "FRM", effective_from: "2020-01-01T00:00:00Z", max_span_drift_pct: 5.0, zero_drift_limit: 1.5, required_span_check_interval_days: 14, required_calibration_interval_days: 365 }
              as: NetworkAdmin
              captures: { frm_id: "$.data.id" }
            - call: "POST /monitoring-networks"
              payload: { name: "State Ambient Network", agency_code: "AQ01", metropolitan_population: 1200000 }
              as: NetworkAdmin
              captures: { net_id: "$.data.id" }
          trigger:
            - call: "POST /monitoring-sites"
              payload: { network_id: "${net_id}", site_code: "S-001", site_type: "POPULATION_ORIENTED", latitude: 39.75, longitude: -104.99, population_served: 400000, probe_height_m: 4.0, distance_to_roadway_m: 25.0, distance_to_obstruction_m: 12.0, obstruction_height_m: 6.0, distance_to_source_m: 0.0 }
              as: NetworkAdmin
              captures: { site_a_id: "$.data.id", v_create: "$.data.version" }
            - call: "POST /monitoring-sites/${site_a_id}/siting-approval"
              payload: { waiver_granted: false }
              as: EpaRegionalReviewer
              captures: { v_siting: "$.data.version" }
            - call: "POST /monitoring-sites/${site_a_id}/commence-operations"
              payload: {}
              as: ProgramManager
              captures: { v_operating: "$.data.version" }
            - call: "POST /monitors"
              payload: { site_id: "${site_a_id}", reference_method_id: "${frm_id}", poc: 1, is_primary_for_design_value: true, installed_at: "2026-01-01T00:00:00Z" }
              as: NetworkAdmin
              captures: { mon_id: "$.data.id" }
            - call: "POST /monitors/${mon_id}/approve"
              payload: {}
              as: EpaRegionalReviewer
            - call: "POST /monitors/${mon_id}/commission"
              payload: {}
              as: FieldTechnician
            - call: "GET /monitoring-sites/${site_a_id}"
              payload: {}
              as: ProgramManager
              captures: { v_after_commission: "$.data.version" }
          assert:
            - "${v_siting} == ${v_create} + 1 and ${v_operating} == ${v_siting} + 1"
            - "${v_after_commission} == ${v_operating} + 1 - the child monitor's commission bumps the parent site"
            - "the two GET calls in this instance did not change the version"
            - "MonitoringSite.${site_a_id}.operating_monitor_count == 1"

      - name: the_consecutive_failure_counter_accumulates_and_resets
        claim_type: rate_threshold_triggers
        grounds:
          - entities.Monitor.fields.consecutive_qc_failure_count
          - calculations.qc_event_outcome_evaluation
          - state_machines.Monitor
        distinguishing_aspect: "Two failing span checks drive consecutive_qc_failure_count to 2 while the monitor stays OUT_OF_SERVICE, and a single passing check resets the counter to 0 in one step rather than decrementing it."
        test_recipe:
          setup:
            - "one OPERATING monitor whose method allows at most 5.0 percent span drift"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pollutants"
              payload: { code: "PM25", averaging_period_hours: 24, standard_form: "ANNUAL_MEAN", primary_standard_value: 9.0, design_value_years: 3, completeness_threshold_pct: 75.0, rounding_decimals: 1 }
              as: NetworkAdmin
              captures: { pm25_id: "$.data.id" }
            - call: "POST /reference-methods"
              payload: { pollutant_id: "${pm25_id}", method_code: "RFPS-0617-001", designation_type: "FRM", effective_from: "2020-01-01T00:00:00Z", max_span_drift_pct: 5.0, zero_drift_limit: 1.5, required_span_check_interval_days: 14, required_calibration_interval_days: 365 }
              as: NetworkAdmin
              captures: { frm_id: "$.data.id" }
            - call: "POST /monitoring-networks"
              payload: { name: "State Ambient Network", agency_code: "AQ01", metropolitan_population: 1200000 }
              as: NetworkAdmin
              captures: { net_id: "$.data.id" }
            - call: "POST /monitoring-sites"
              payload: { network_id: "${net_id}", site_code: "S-001", site_type: "POPULATION_ORIENTED", latitude: 39.75, longitude: -104.99, population_served: 400000, probe_height_m: 4.0, distance_to_roadway_m: 25.0, distance_to_obstruction_m: 12.0, obstruction_height_m: 6.0, distance_to_source_m: 0.0 }
              as: NetworkAdmin
              captures: { site_a_id: "$.data.id" }
            - call: "POST /monitoring-sites/${site_a_id}/siting-approval"
              payload: { waiver_granted: false }
              as: EpaRegionalReviewer
            - call: "POST /monitoring-sites/${site_a_id}/commence-operations"
              payload: {}
              as: ProgramManager
            - call: "POST /monitors"
              payload: { site_id: "${site_a_id}", reference_method_id: "${frm_id}", poc: 1, is_primary_for_design_value: true, installed_at: "2022-12-20T00:00:00Z" }
              as: NetworkAdmin
              captures: { mon_id: "$.data.id" }
            - call: "POST /monitors/${mon_id}/approve"
              payload: {}
              as: EpaRegionalReviewer
            - call: "POST /monitors/${mon_id}/commission"
              payload: {}
              as: FieldTechnician
            - call: "POST /monitors/${mon_id}/qc-events"
              payload: { event_type: "SPAN_CHECK", performed_at: "2026-01-02T00:00:00Z", span_drift_pct: 2.0 }
              as: FieldTechnician
          trigger:
            - call: "POST /monitors/${mon_id}/qc-events"
              payload: { event_type: "SPAN_CHECK", performed_at: "2026-01-03T00:00:00Z", span_drift_pct: 7.0 }
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { qc1_id: "$.data.id" }
            - call: "POST /monitors/${mon_id}/qc-events"
              payload: { event_type: "SPAN_CHECK", performed_at: "2026-01-04T00:00:00Z", span_drift_pct: 9.0 }
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { qc2_id: "$.data.id" }
            - call: "POST /monitors/${mon_id}/qc-events"
              payload: { event_type: "SPAN_CHECK", performed_at: "2026-01-05T00:00:00Z", span_drift_pct: 1.0 }
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { qc3_id: "$.data.id" }
          assert:
            - "QcEvent.${qc1_id}.outcome == FAIL, and after it Monitor.${mon_id}.consecutive_qc_failure_count == 1 with monitor_status == OUT_OF_SERVICE and out_of_service_since == 2026-01-05T00:00:00Z"
            - "QcEvent.${qc2_id}.outcome == FAIL and consecutive_qc_failure_count == 2 with monitor_status still OUT_OF_SERVICE"
            - "QcEvent.${qc3_id}.outcome == PASS and consecutive_qc_failure_count == 0 in one step"
            - "Monitor.${mon_id}.last_span_check_at == 2026-01-05T00:00:00Z after the passing check and is unchanged by the two failures, so it still reads 2026-01-02T00:00:00Z between them"
            - "Monitor.${mon_id}.monitor_status is still OUT_OF_SERVICE after the PASS - a passing check clears the counter but does not itself return the instrument to service"

      - name: the_concurrence_cascade_runs_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: transitive_cascade / concurrence_cascade_exclusion_to_hour_accounting_to_design_value
          rationale: "The three-hop chain from EventExclusion through batch hour accounting to the superseded design value is asserted hop by hop by the named difficulty instance."

      - name: the_shutdown_cascade_runs_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: transitive_cascade / site_shutdown_cascade_monitor_batch_package_submission
          rationale: "The five-hop chain from site shutdown through monitor decommission, batch invalidation, package demotion and submission reset is asserted hop by hop by the named difficulty instance."

      - name: both_design_value_variants_are_computed_from_the_same_quarters
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: dual_variant_calc / design_value_variant_divergence_flips_site_attainment
          rationale: "Both variants and the attainment flip between them are asserted by the named difficulty instance."

  - section: consistency_model
    instances:
      - name: every_derived_field_is_current_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.batch_hour_accounting
          - calculations.certification_package_rollup
        distinguishing_aspect: "The invalidation POST response already carries hours_affected, and the very next reads show the batch counters, the package rollup and the site's attainment status recomputed - nothing lags behind a second call."
        test_recipe:
          setup:
            - "twelve VALIDATED quarters and one DRAFT 2025 certification package"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pollutants"
              payload: { code: "PM25", averaging_period_hours: 24, standard_form: "ANNUAL_MEAN", primary_standard_value: 9.0, design_value_years: 3, completeness_threshold_pct: 75.0, rounding_decimals: 1 }
              as: NetworkAdmin
              captures: { pm25_id: "$.data.id" }
            - call: "POST /reference-methods"
              payload: { pollutant_id: "${pm25_id}", method_code: "RFPS-0617-001", designation_type: "FRM", effective_from: "2020-01-01T00:00:00Z", max_span_drift_pct: 5.0, zero_drift_limit: 1.5, required_span_check_interval_days: 14, required_calibration_interval_days: 365 }
              as: NetworkAdmin
              captures: { frm_id: "$.data.id" }
            - call: "POST /monitoring-networks"
              payload: { name: "State Ambient Network", agency_code: "AQ01", metropolitan_population: 1200000 }
              as: NetworkAdmin
              captures: { net_id: "$.data.id" }
            - call: "POST /monitoring-sites"
              payload: { network_id: "${net_id}", site_code: "S-001", site_type: "POPULATION_ORIENTED", latitude: 39.75, longitude: -104.99, population_served: 400000, probe_height_m: 4.0, distance_to_roadway_m: 25.0, distance_to_obstruction_m: 12.0, obstruction_height_m: 6.0, distance_to_source_m: 0.0 }
              as: NetworkAdmin
              captures: { site_a_id: "$.data.id" }
            - call: "POST /monitoring-sites/${site_a_id}/siting-approval"
              payload: { waiver_granted: false }
              as: EpaRegionalReviewer
            - call: "POST /monitoring-sites/${site_a_id}/commence-operations"
              payload: {}
              as: ProgramManager
            - call: "POST /monitors"
              payload: { site_id: "${site_a_id}", reference_method_id: "${frm_id}", poc: 1, is_primary_for_design_value: true, installed_at: "2022-12-20T00:00:00Z" }
              as: NetworkAdmin
              captures: { mon_id: "$.data.id" }
            - call: "POST /monitors/${mon_id}/approve"
              payload: {}
              as: EpaRegionalReviewer
            - call: "POST /monitors/${mon_id}/commission"
              payload: {}
              as: FieldTechnician
            - call: "POST /monitors/${mon_id}/qc-events"
              payload: { event_type: "SPAN_CHECK", performed_at: "2026-01-02T00:00:00Z", span_drift_pct: 2.0 }
              as: FieldTechnician
            - call: "POST /data-batches/bulk-ingest"
              payload:
                monitor_id: "${mon_id}"
                batches:
                  - { year: 2023, quarter: 1, scheduled_hour_count: 2160, quarterly_mean_concentration: 9.2 }
                  - { year: 2023, quarter: 2, scheduled_hour_count: 2184, quarterly_mean_concentration: 9.4 }
                  - { year: 2023, quarter: 3, scheduled_hour_count: 2208, quarterly_mean_concentration: 9.3 }
                  - { year: 2023, quarter: 4, scheduled_hour_count: 2208, quarterly_mean_concentration: 9.1 }
                  - { year: 2024, quarter: 1, scheduled_hour_count: 2184, quarterly_mean_concentration: 9.0 }
                  - { year: 2024, quarter: 2, scheduled_hour_count: 2184, quarterly_mean_concentration: 9.1 }
                  - { year: 2024, quarter: 3, scheduled_hour_count: 2208, quarterly_mean_concentration: 9.2, quarterly_mean_concentration_event_adjusted: 7.9 }
                  - { year: 2024, quarter: 4, scheduled_hour_count: 2208, quarterly_mean_concentration: 8.9 }
                  - { year: 2025, quarter: 1, scheduled_hour_count: 2160, quarterly_mean_concentration: 8.9 }
                  - { year: 2025, quarter: 2, scheduled_hour_count: 2184, quarterly_mean_concentration: 9.0 }
                  - { year: 2025, quarter: 3, scheduled_hour_count: 2208, quarterly_mean_concentration: 9.1 }
                  - { year: 2025, quarter: 4, scheduled_hour_count: 2208, quarterly_mean_concentration: 8.8 }
              as: QaOfficer
              captures: { b25q1_id: "$.data[8].id" }
            - call: "POST /data-batches/bulk-validate"
              payload: { monitor_id: "${mon_id}" }
              as: QaOfficer
              as_user_id: "qa-1"
