          setup:
            - "One reference Building with a 12000 sf and a 5000 sf STANDARD_EXAM suite."
            - "A HEALTH_SYSTEM_ANCHOR tenant EXECUTED on the 12000 sf suite at 28.00 psf and an INDEPENDENT_PRACTICE tenant certified but not yet executed on the 5000 sf suite at 30.00 psf."
