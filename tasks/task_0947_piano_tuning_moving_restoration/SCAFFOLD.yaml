  - name: PartsAllocation
    parent: null
    common_fields: true
    fields:
      - name: parts_lot_id
        type: string
        source: input
        description: "FK -> PartsLot.id; the lot drawn from."
      - name: service_order_id
        type: string
        source: input
        description: "FK -> ServiceOrder.id; the rebuild consuming the parts."
      - name: requested_qty
        type: integer
        source: input
        constraints: "integer 1..50 (PARTS_MAX_REQUEST_QTY)"
