            - "SearchFirm.${firm_id}.committed_fee_cents != 27475016 (the value produced by summing the raw products and rounding once)"
            - "SearchFirm.${firm_id}.retainer_credit_applied_cents == 5000000"
            - "SearchFirm.${firm_id}.net_payable_cents == 22475017"
            - "NominationSlate.${slate_id}.committed_search_fee_cents == 27475017"
            - "NominationSlate.${slate_id}.nominee_count == 3 and independent_nominee_count == 3 and independent_nominee_pct == 100.00"
            - "NominationSlate.${slate_id}.independence_shortfall == false"
