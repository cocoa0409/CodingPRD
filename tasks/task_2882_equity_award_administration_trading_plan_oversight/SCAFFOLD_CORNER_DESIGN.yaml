  # ===========================================================================
  - section: state_machines
    instances:

      - name: grant_submit_valid_transition_draft_to_pending_approval
        claim_type: valid_transition
        grounds:
          - state_machines.Grant.DRAFT_to_PENDING_APPROVAL
          - endpoints[POST /grants/{id}/submit]
          - entities.Grant.fields.submitted_by_user_id
        distinguishing_aspect: |
          POST /grants/{id}/submit on a DRAFT grant moves it to PENDING_APPROVAL and stamps
          submitted_by_user_id with the acting X-User-ID admin-1, while leaving
          weighted_reserve_shares at 0 - nothing is committed against the reserve at submit.
        test_recipe:
          setup:
            - "Logical clock 2026-01-05T09:00:00Z; ACTIVE plan with 1000000 authorized shares and 1000000 common shares outstanding; ACTIVE participant; DRAFT RSU grant of 1000 shares with one TIME tranche of 1000 shares scheduled 2026-07-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T09:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /equity-plans"
              payload: { name: "Corner Plan Hotel", total_authorized_shares: 1000000, common_shares_outstanding: 1000000, fiscal_year_start_date: "2026-01-01" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "Sam Submit", employee_number: "E-C-70", home_country_code: "US", home_state_code: "CA", hire_date: "2020-01-06", birth_date: "1986-06-06" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { p_id: $.data.id }
            - call: "POST /grants"
              payload: { plan_id: "${plan_id}", participant_id: "${p_id}", award_type: "RSU", target_shares: 1000 }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { g_id: $.data.id }
            - call: "POST /grants/${g_id}/vesting-tranches"
              payload: { tranche_index: 1, vest_type: "TIME", scheduled_vest_date: "2026-07-01", target_shares: 1000 }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /grants/${g_id}/submit"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
          assert:
            - "HTTP status is 200"
            - "Grant.status == PENDING_APPROVAL"
            - "Grant.submitted_by_user_id == \"admin-1\""
            - "Grant.changes_requested_count == 0"
            - "Grant.weighted_reserve_shares == 0 and Grant.grant_date is null"
            - "Grant.version incremented from 1 to 2"
            - "EquityPlan.shares_committed_cumulative == 0 and EquityPlan.available_reserve_shares == 1000000"

      - name: grant_submit_twice_second_attempt_rejected
        claim_type: idempotency
        grounds:
          - state_machines.Grant.DRAFT_to_PENDING_APPROVAL
          - validations[priority=40]
          - errors[ERR_GRANT_INVALID_STATE]
        distinguishing_aspect: |
          Submit is not idempotent: the second POST /grants/{id}/submit against an already
          PENDING_APPROVAL grant returns ERR_GRANT_INVALID_STATE (409) and leaves
          submitted_by_user_id and Grant.version untouched.
        test_recipe:
          setup:
            - "As grant_submit_valid_transition_draft_to_pending_approval, then the grant already submitted once by admin-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T09:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /equity-plans"
              payload: { name: "Corner Plan India", total_authorized_shares: 1000000, common_shares_outstanding: 1000000, fiscal_year_start_date: "2026-01-01" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "Ida Idem", employee_number: "E-C-71", home_country_code: "US", home_state_code: "CA", hire_date: "2020-01-06", birth_date: "1986-07-07" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { p_id: $.data.id }
            - call: "POST /grants"
              payload: { plan_id: "${plan_id}", participant_id: "${p_id}", award_type: "RSU", target_shares: 1000 }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { g_id: $.data.id }
            - call: "POST /grants/${g_id}/vesting-tranches"
              payload: { tranche_index: 1, vest_type: "TIME", scheduled_vest_date: "2026-07-01", target_shares: 1000 }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /grants/${g_id}/submit"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
          trigger:
            - call: "POST /grants/${g_id}/submit"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-2"
          assert:
            - "HTTP status is 409 and data.error_id == ERR_GRANT_INVALID_STATE"
            - "Grant.status is still PENDING_APPROVAL"
            - "Grant.submitted_by_user_id is still \"admin-1\" (the rejected call did not overwrite it with admin-2)"

      - name: grant_approve_from_draft_status_is_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.Grant
          - endpoints[POST /grants/{id}/approve]
          - validations[priority=40]
          - errors[ERR_GRANT_INVALID_STATE]
        distinguishing_aspect: |
          DRAFT has no outgoing approve transition, so POST /grants/{id}/approve on a DRAFT
          grant returns ERR_GRANT_INVALID_STATE (409) and the plan reserve is untouched -
          the state gate fires before the fiscal ladder (68/70/75/78) is ever evaluated.
        test_recipe:
          setup:
            - "ACTIVE plan with 1000000 authorized shares; DRAFT RSU grant of 1000 shares with one tranche; the grant was never submitted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
