# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2785 - Municipal Bond Underwriting & Official Statement Preparation
# Nine rule_ids from SKILL.md section 0.5, two differentiated instances each.
# Every numeric literal in an assert was computed by executing the pinned
# formula in section 1.3 with Decimal / ROUND_HALF_UP.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: tranche_yield_to_worst_variant_divergence
        grounds:
          - calculations.tranche_reoffering_price
          - entities.MaturityTranche.fields.price_to_maturity_pct
          - entities.MaturityTranche.fields.price_to_call_pct
          - entities.MaturityTranche.fields.reoffering_price_pct
          - entities.MaturityTranche.fields.is_priced_to_call
        distinguishing_aspect: |
          Entity domain is MaturityTranche bond pricing: the two variants are the same
          actuarial discounting run to two different horizons, and the winner is the LOWER
          price, so a premium callable tranche prices to call (108.176 < 113.678) while a
          discount callable tranche with an identical call feature prices to maturity
          (86.322 < 91.824). Variant selection therefore flips on the coupon/yield relation,
          not on any workflow stage.
        test_recipe:
          setup:
            - "One municipal advisory firm and one city issuer exist."
            - "Two deals of the same issuer are dated 2026-08-01T00:00:00.000Z, each authorizing USD 5,000,000."
            - "Logical clock is at its 2026-08-01T00:00:00Z default; no clock call is needed."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Beta Municipal Advisors", firm_type: "MUNICIPAL_ADVISOR", msrb_registration_id: "MA0001" }
              as: ComplianceOfficer
              captures: { ma_firm_id: $.data.id }
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Fairhaven", state_code: "OH", entity_type: "CITY" }
              as: ComplianceOfficer
              captures: { issuer_id: $.data.id }
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2026A", tax_status: "TAX_EXEMPT", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 5000000, municipal_advisor_firm_id: "${ma_firm_id}" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { deal_prem_id: $.data.id }
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2026B", tax_status: "TAX_EXEMPT", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 5000000, municipal_advisor_firm_id: "${ma_firm_id}" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { deal_disc_id: $.data.id }
          trigger:
            - call: "POST /bond-offerings/deals/${deal_prem_id}/maturity-tranches"
              payload: { sequence_number: 1, maturity_date: "2046-08-01T00:00:00.000Z", principal_amount_usd: 5000000, coupon_rate_pct: 5.000, yield_pct: 4.000, is_callable: true, first_call_date: "2036-08-01T00:00:00.000Z", call_price_pct: 100.000 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { t_prem_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_disc_id}/maturity-tranches"
              payload: { sequence_number: 1, maturity_date: "2046-08-01T00:00:00.000Z", principal_amount_usd: 5000000, coupon_rate_pct: 3.000, yield_pct: 4.000, is_callable: true, first_call_date: "2036-08-01T00:00:00.000Z", call_price_pct: 100.000 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { t_disc_id: $.data.id }
          assert:
            - "MaturityTranche.${t_prem_id}.periods_to_maturity == 40"
            - "MaturityTranche.${t_prem_id}.periods_to_call == 20"
            - "MaturityTranche.${t_prem_id}.price_to_maturity_pct == 113.678"
            - "MaturityTranche.${t_prem_id}.price_to_call_pct == 108.176"
            - "MaturityTranche.${t_prem_id}.reoffering_price_pct == 108.176"
            - "MaturityTranche.${t_prem_id}.is_priced_to_call == true"
            - "MaturityTranche.${t_disc_id}.price_to_maturity_pct == 86.322"
            - "MaturityTranche.${t_disc_id}.price_to_call_pct == 91.824"
            - "MaturityTranche.${t_disc_id}.reoffering_price_pct == 86.322"
            - "MaturityTranche.${t_disc_id}.is_priced_to_call == false"

      - name: gross_spread_negotiated_versus_competitive_divergence
        grounds:
          - calculations.gross_spread_disclosure
          - calculations.deal_issue_price_total
          - entities.Deal.fields.gross_spread_basis
          - entities.Deal.fields.gross_spread_total_usd
          - state_machines.Deal.STRUCTURING_to_PRICING_NEGOTIATED
          - state_machines.Deal.STRUCTURING_to_PRICING_COMPETITIVE
        distinguishing_aspect: |
          Entity domain is Deal-level underwriter compensation, not tranche pricing: two deals
          carrying byte-identical maturity schedules disclose 87,500.00 (negotiated, built up
          from per-bond takedown + management fee + expenses) versus 111,700.00 (competitive,
          backed out of a 106.000 winning bid against the same 10,711,700.00 issue price), a
          24,200.00 delta driven purely by gross_spread_basis.
        test_recipe:
          setup:
            - "One municipal advisor firm, one underwriting firm and one issuer exist."
            - "Deal N (Series 2026N) is NEGOTIATED with a single senior manager holding 100.0000 percent liability; Deal C (Series 2026C) is COMPETITIVE with no syndicate."
            - "Both deals carry the same two tranches: 5,000,000 at 5.000/4.250 maturing 2036-08-01 and 5,000,000 at 5.000/4.000 maturing 2046-08-01 callable 2036-08-01 at 100.000."
            - "Both deals have an ACTIVE undertaking, an official statement in PRELIMINARY_POSTED, and one institutional order period that was opened and closed with zero orders."
            - "Logical clock stands at 2026-08-05T14:00:00.000Z."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Beta Municipal Advisors", firm_type: "MUNICIPAL_ADVISOR", msrb_registration_id: "MA0001" }
              as: ComplianceOfficer
              captures: { ma_firm_id: $.data.id }
            - call: "POST /bond-offerings/firms"
              payload: { name: "Alpha Underwriting", firm_type: "UNDERWRITER", msrb_registration_id: "AU0001" }
              as: ComplianceOfficer
