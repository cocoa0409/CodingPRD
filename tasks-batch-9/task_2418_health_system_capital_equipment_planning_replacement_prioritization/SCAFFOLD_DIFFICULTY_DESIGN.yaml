  # =========================================================================
  # 8. resource_temporal_overlap — two instances with DIFFERENT interval
  #    semantics on DIFFERENT resource entities: the department downtime slot is
  #    buffered and half-open, the facility construction slot is raw, closed and
  #    capacity-counted.
