              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "err == ERR_INVALID_BOOKING_STATE"
            - "EventBooking.${bk}.status == HELD, unchanged"
            - "EventBooking.${bk}.hold_expires_at == 2026-08-02T00:00:00.000Z, not re-stamped by the refused call"
            - "Venue.${venue_id}.open_hold_count == 1"
            - "Venue.${venue_id}.version == ${v1}, unchanged"

      - name: released_booking_cannot_be_held_again_from_its_terminal_state
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.EventBooking.terminal_states
          - state_machines.EventBooking.transitions.DRAFT_to_RELEASED
          - errors.ERR_INVALID_BOOKING_STATE
        distinguishing_aspect: "RELEASED is terminal: a hold attempt on a released booking returns 409 ERR_INVALID_BOOKING_STATE and the stored release_reason survives."
