  - section: cross_cutting_layers
    instances:
      - name: occ_policy_create_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[policy-create-stale-season]", "errors[ERR_STALE_VERSION]", entities.Season.fields.current_waiver_version]
        distinguishing_aspect: "Two sequential policy creates carrying the same observed Season.version: the first succeeds (version advances), the second is rejected 412 because its expected_season_version is now stale — deterministic with zero parallelism."
        test_recipe:
          setup: ["season created (version 1) and activated (version 2, captured)"]
          setup_api_calls:
            - { call: "POST /farm/seasons", payload: { name: "2026 Harvest", start_date: "2026-08-01", end_date: "2026-08-31", waiver_text: "WAIVER-V1" }, as: FarmManager, captures: { s_id: $.data.id, s_v1: $.data.version } }
            - { call: "POST /farm/seasons/${s_id}/activate", payload: {}, as: FarmManager, captures: { s_v2: $.data.version } }
          trigger:
            - { call: "POST /farm/pricing-policies", payload: { season_id: "${s_id}", expected_season_version: "${s_v2}", admission_per_person_cents: 650, container_fee_cents: 200, weekend_surge_bps: 12500, bundle_discount_bps: 1000, bundle_cap_cents: 1500 }, as: FarmManager, captures: { pol1: $.data.id, pol1_ver: $.data.policy_version, pol1_status: $.data.status } }
            - { call: "POST /farm/pricing-policies", payload: { season_id: "${s_id}", expected_season_version: "${s_v2}", admission_per_person_cents: 700, container_fee_cents: 250, weekend_surge_bps: 10000, bundle_discount_bps: 0, bundle_cap_cents: 0 }, as: FarmManager, captures: { err: $.data.error_id } }
            - { call: "GET /farm/seasons/${s_id}", payload: {}, as: FarmManager, captures: { s_v_end: $.data.version } }
          assert:
            - "First create: policy_version == 1, status == ACTIVE"
            - "Second create with the same expected_season_version: error_id == ERR_STALE_VERSION, HTTP 412"
            - "Season.version == 3 afterwards (1 create + 1 activate + 1 policy create; the rejected create bumped nothing)"

