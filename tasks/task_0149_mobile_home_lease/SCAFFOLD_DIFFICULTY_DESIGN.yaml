scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: rent_cap_capped_vs_uncapped_on_lease
        grounds:
          - calculations.rent_cap_application
          - state_machines.RentIncreaseNotice.DRAFT_to_ISSUED
          - entities.RentIncreaseNotice.fields.capped_new_rent_cents
          - entities.Park.fields.state_code
        distinguishing_aspect: |
          Two interpretations operate on the same RentIncreaseNotice + Park inputs and produce different capped_new_rent_cents: CA/OR/AZ apply a statutory percent ceiling that overrides proposed_new_rent_cents, while FL/TX have no cap and pass proposed through unchanged. This is the rent-pricing domain — entity subject is RentIncreaseNotice/Park.
        test_recipe:
          setup:
            - "Create Park P1 state_code=CA, master_cpi_pct=2.00"
            - "Create Park P2 state_code=FL, master_cpi_pct=2.00"
            - "Create Lot L_CA under P1 with base_rent_cents=100000"
            - "Create Lot L_FL under P2 with base_rent_cents=100000"
            - "Create Resident R_CA and R_FL"
            - "Create Lease, sign on each lot (monthly_rent_cents=100000 on both)"
            - "Create RentIncreaseNotice N_CA on L_CA's lease proposed_new_rent_cents=108000 effective_on=now()+100 days"
            - "Create RentIncreaseNotice N_FL on L_FL's lease proposed_new_rent_cents=108000 effective_on=now()+100 days"
          trigger:
            - "POST /rent-increase-notices/{N_CA}/issue"
            - "POST /rent-increase-notices/{N_FL}/issue"
          assert:
            - "N_CA.capped_new_rent_cents == 107000   # CA cap = min(5+2,10)=7%, round(100000*1.07)"
            - "N_FL.capped_new_rent_cents == 108000   # FL uncapped: proposed unchanged"
            - "N_CA.capped_new_rent_cents != N_FL.capped_new_rent_cents"
      - name: utility_apportionment_sub_meter_vs_equal_split_on_lot
        grounds:
          - calculations.utility_apportionment
          - entities.Park.fields.utility_apportionment_method
          - entities.Lot.fields.sub_meter_reading_kwh
          - entities.UtilityBill.fields.lot_share_cents
          - endpoints[POST /_sweep/billing]
        distinguishing_aspect: |
          Two distinct algorithms over the same set of UtilityBill rows on the Lot domain (different entity domain from rule 1's RentIncreaseNotice): SUB_METER assigns shares by reading-ratio while EQUAL_SPLIT divides evenly. With identical inputs and skewed readings the two methods produce different lot_share_cents on the same Lot.
        test_recipe:
          setup:
            - "Create Park P_SUB method=SUB_METER, P_EQ method=EQUAL_SPLIT"
            - "Create 3 lots under each park with identical lot_numbers L01,L02,L03 base_rent_cents=0 to isolate utility"
            - "Set sub_meter_reading_kwh: L01=1.0, L02=3.0, L03=6.0 on BOTH parks' lots"
            - "Sign leases on all six lots; residents distinct"
            - "Run /_sweep/billing on each park with master_total_cents=10000, identical period"
          trigger:
            - "POST /_sweep/billing for P_SUB"
            - "POST /_sweep/billing for P_EQ"
          assert:
            - "P_SUB lots' UtilityBill.lot_share_cents == [1000, 3000, 6000]   # ratio 1:3:6 of 10000"
            - "P_EQ lots' UtilityBill.lot_share_cents  == [3334, 3333, 3333]   # 10000//3=3333, +1 remainder to ascending lot_number"
            - "Sum of shares per park == 10000 (conservation)"
            - "P_SUB L01 share (1000) != P_EQ L01 share (3334)"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: rent_cap_mode_a_three_input_state_branching
        grounds:
          - calculations.rent_cap_application
          - entities.Park.fields.state_code
          - entities.Park.fields.master_cpi_pct
          - entities.Lease.fields.monthly_rent_cents
          - entities.RentIncreaseNotice.fields.proposed_new_rent_cents
        distinguishing_aspect: |
          MODE (a): ≥3 inputs (state_code, master_cpi_pct, current monthly_rent_cents, proposed_new_rent_cents) interact non-linearly through nested min() with state-branching: CA/OR use min(base_pct + cpi, 10.0), AZ flat 10.0 (no CPI), FL/TX no cap. Same proposed value produces 3+ distinct capped outputs depending on branch.
        test_recipe:
          setup:
            - "Create three parks: P_CA(CA, cpi=8.00), P_OR(OR, cpi=2.00), P_AZ(AZ, cpi=8.00)"
            - "Create one Lot per park with base_rent_cents=100000 and sign lease"
            - "Create RentIncreaseNotice per lease proposed_new_rent_cents=120000 (20% nominal), effective_on=now()+100 days"
          trigger:
            - "POST /rent-increase-notices/{N_CA}/issue"
            - "POST /rent-increase-notices/{N_OR}/issue"
            - "POST /rent-increase-notices/{N_AZ}/issue"
          assert:
            - "N_CA.capped_new_rent_cents == 110000   # min(5+8,10)=10, round(100000*1.10)"
            - "N_OR.capped_new_rent_cents == 109000   # min(7+2,10)=9,  round(100000*1.09)"
            - "N_AZ.capped_new_rent_cents == 110000   # flat 10 (cpi ignored), round(100000*1.10)"
            - "N_CA.capped_new_rent_cents != N_OR.capped_new_rent_cents   # state branch matters"
      - name: utility_apportionment_mode_b_rounding_order_pinned
        grounds:
          - calculations.utility_apportionment
          - entities.UtilityBill.fields.lot_share_cents
        distinguishing_aspect: |
          MODE (b): nested rounding where order matters. The scaffold pins "floor each lot's raw cents first, then distribute the remainder one-cent-at-a-time to lots in ascending lot_number order" — the alternative ("round each share to nearest cent then accept the small drift") would give different per-lot values and a sum drift; the scaffold's pinned order conserves the master_total exactly. Different mode than rule 2 instance 1's branching formula.
        test_recipe:
          setup:
            - "Create Park P method=SUB_METER"
            - "Create lots L01, L02, L03 with sub_meter_reading_kwh = 1.0, 1.0, 1.0"
            - "Sign leases on all three; residents distinct"
          trigger:
            - "POST /_sweep/billing on P with master_total_cents=10001"
          assert:
            - "Per-lot raw_share = (1/3)*10001 = 3333.6667 cents"
            - "floor(3333.6667) = 3333 for each → sum 9999, remainder = 2"
            - "L01.UtilityBill.lot_share_cents == 3334   # first remainder cent goes to lowest lot_number"
            - "L02.UtilityBill.lot_share_cents == 3334   # second remainder cent"
            - "L03.UtilityBill.lot_share_cents == 3333"
            - "Sum == 10001 (conservation; differs from naive round-then-sum which would yield 9999 or 10002)"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: eviction_case_branching_fork_join
        grounds:
          - state_machines.EvictionCase.FILED_to_IN_CURE
          - state_machines.EvictionCase.FILED_to_FINALIZED_FOR_CAUSE
          - state_machines.EvictionCase.IN_CURE_to_CURED
          - state_machines.EvictionCase.IN_CURE_to_FINALIZED_FOR_CAUSE
          - state_machines.EvictionCase.IN_CURE_to_DISMISSED
          - state_machines.EvictionCase.CURED_to_DISMISSED
        distinguishing_aspect: |
          EvictionCase exhibits true branching: from FILED, fork either to IN_CURE (cure-bearing violations) or directly to FINALIZED_FOR_CAUSE (ILLEGAL_USE bypass). From IN_CURE, three divergent outcomes with different side-effect sets (CURED, FINALIZED_FOR_CAUSE, DISMISSED). Entity = EvictionCase.
        test_recipe:
          setup:
            - "Create Park, Lot, Resident, sign Lease in CURRENT"
            - "Snapshot Lease.status"
          trigger:
            - "POST /leases/{lease_id}/eviction-cases violation_type=ILLEGAL_USE → expect FILED→FINALIZED_FOR_CAUSE direct"
            - "(parallel test) POST /leases/{lease_id}/eviction-cases violation_type=RULE_VIOLATION → expect FILED→IN_CURE then dismiss"
          assert:
            - "Case from ILLEGAL_USE: status == 'FINALIZED_FOR_CAUSE' immediately (no IN_CURE)"
            - "Lease status after ILLEGAL_USE case == 'TERMINATED'"
            - "Case from RULE_VIOLATION: status == 'IN_CURE' immediately after POST"
            - "After POST /eviction-cases/{rule_case}/dismiss: case.status == 'DISMISSED', lease.status == 'CURRENT'"
      - name: lease_branching_grace_three_way_outcome
        grounds:
          - state_machines.Lease.CURRENT_to_GRACE
          - state_machines.Lease.DELINQUENT_to_GRACE
          - state_machines.Lease.GRACE_to_CURRENT
          - state_machines.Lease.GRACE_to_DELINQUENT
          - state_machines.Lease.GRACE_to_TERMINATED
        distinguishing_aspect: |
          Lease exhibits a branching shape (different entity from EvictionCase): GRACE can resolve to one of three distinct successor states — CURRENT, DELINQUENT, or TERMINATED — with different side-effect sets per branch (rent-increase voiding only on TERMINATED; balance-driven choice between CURRENT/DELINQUENT). Not a linear pipeline.
        test_recipe:
          setup:
            - "Setup A: Lease in GRACE with outstanding_balance_cents == 0"
            - "Setup B: Lease in GRACE with outstanding_balance_cents > 0 (1 unpaid UtilityBill, balance = 5000)"
            - "Setup C: Lease in GRACE with EvictionCase about to finalize for cause"
          trigger:
            - "Setup A: POST /eviction-cases/{id}/dismiss → expect GRACE→CURRENT"
            - "Setup B: POST /eviction-cases/{id}/dismiss → expect GRACE→DELINQUENT"
            - "Setup C: advance clock past cure_deadline, POST /_sweep/evictions → expect GRACE→TERMINATED"
          assert:
            - "Setup A Lease.status == 'CURRENT'"
            - "Setup B Lease.status == 'DELINQUENT'"
            - "Setup C Lease.status == 'TERMINATED' AND any RentIncreaseNotice on lease has status == 'VOIDED'"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: illegal_use_eviction_three_hop_cascade
        grounds:
          - state_machines.EvictionCase.FILED_to_FINALIZED_FOR_CAUSE
          - state_machines.Lease.GRACE_to_TERMINATED
          - state_machines.RentIncreaseNotice.ISSUED_to_VOIDED
          - state_machines.RentIncreaseNotice.DRAFT_to_VOIDED
          - entities.Resident.fields.violation_count_12mo
        distinguishing_aspect: |
          Depth ≥ 3 originating from POST /leases/{id}/eviction-cases (ILLEGAL_USE): (1) EvictionCase mutates to FINALIZED_FOR_CAUSE, (2) that mutation triggers Lease GRACE→TERMINATED (link caused by case status change, not by the API call directly), (3) Lease TERMINATED triggers RentIncreaseNotice ISSUED→VOIDED on any associated notice (link caused by lease status change), (4) and Resident.violation_count_12mo increments (caused by lease's TERMINATED side-effect). Each hop is consequence of the previous, not a fan-out.
        test_recipe:
          setup:
            - "Create Park, Lot, Resident R, sign Lease L"
            - "Create RentIncreaseNotice N on L, issue it (status=ISSUED, effective_on=now()+100d)"
            - "Snapshot R.violation_count_12mo (=0)"
          trigger:
            - "POST /leases/{L.id}/eviction-cases violation_type=ILLEGAL_USE"
          assert:
            - "EvictionCase.status == 'FINALIZED_FOR_CAUSE'   # hop 1"
            - "Lease.status == 'TERMINATED'                    # hop 2 (caused by hop 1)"
            - "RentIncreaseNotice.status == 'VOIDED'           # hop 3 (caused by hop 2)"
            - "Resident.violation_count_12mo == 1              # hop 4 (caused by hop 2's TERMINATED side-effect)"
            - "Lot.current_lease_id == None                    # part of hop 2 cascade"
      - name: home_sale_close_cascade_lease_assumption
        grounds:
          - state_machines.HomeSaleTransfer.APPROVED_to_CLOSED
          - state_machines.Lease.CURRENT_to_ASSUMED
          - state_machines.RentIncreaseNotice.DRAFT_to_VOIDED
          - entities.Home.fields.owner_resident_id
          - entities.Lot.fields.current_lease_id
        distinguishing_aspect: |
          Depth ≥ 2, different trigger than rule 4 instance 1: POST /home-sale-transfers/{id}/close → (1) HomeSaleTransfer mutates to CLOSED, (2) that mutation triggers Lease CURRENT→ASSUMED (caused by hop 1, not by API directly), (3) ASSUMED triggers RentIncreaseNotice VOIDED on the predecessor lease's notices (caused by hop 2). Distinct propagation pattern (home sale, not violation eviction) and origin transition.
        test_recipe:
          setup:
            - "Park, Lot with ownership_mode=RESIDENT_OWNED (via prior conversion), Home owned by seller R_S"
            - "Lease L_old in CURRENT for R_S; create DRAFT RentIncreaseNotice N_draft on L_old"
            - "Create Resident R_B with zero violations"
            - "POST /home-sale-transfers (R_S→R_B), approve"
          trigger:
            - "POST /home-sale-transfers/{transfer_id}/close"
          assert:
            - "HomeSaleTransfer.status == 'CLOSED'                       # hop 1"
            - "Lease(L_old).status == 'ASSUMED'                          # hop 2"
            - "HomeSaleTransfer.new_lease_id is not None and successor Lease.status == 'CURRENT' and resident_id == R_B.id"
            - "RentIncreaseNotice(N_draft).status == 'VOIDED'            # hop 3 caused by hop 2"
            - "Home.owner_resident_id == R_B.id"
            - "Lot.current_lease_id == successor lease id"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_temporal_on_rent_increase_issue
        grounds:
          - validations[priority=6]
          - validations[priority=13]
          - validations[priority=15]
          - errors.ERR_INVALID_STATE
          - errors.ERR_NOTICE_WINDOW_TOO_SHORT
        distinguishing_aspect: |
          Pair = state (priority 6 ERR_INVALID_STATE) vs business_temporal (priority 13 ERR_NOTICE_WINDOW_TOO_SHORT). Build a request that fails BOTH: notice already in ISSUED state AND effective_on < now()+90d. Priority order requires state to win (lower priority number wins).
        test_recipe:
          setup:
            - "Park, Lot, Resident, signed Lease (CURRENT)"
            - "Create RentIncreaseNotice N with effective_on = now()+30 days (window too short)"
            - "Force N.status = ISSUED via a normal issuance flow first (or by an admin path), then call issue again"
          trigger:
            - "POST /rent-increase-notices/{N.id}/issue   # state already ISSUED + window too short"
          assert:
            - "response status == 409"
            - "response error_id == 'ERR_INVALID_STATE'   # state check wins; ERR_NOTICE_WINDOW_TOO_SHORT not returned"
      - name: business_safety_vs_business_referential_on_home_sale_approve
        grounds:
          - validations[priority=9]
          - validations[priority=12]
          - errors.ERR_BUYER_INELIGIBLE
          - errors.ERR_HOME_NOT_RESIDENT_OWNED
        distinguishing_aspect: |
          Pair = business_safety (priority 9 ERR_BUYER_INELIGIBLE) vs business_referential (priority 12 ERR_HOME_NOT_RESIDENT_OWNED). DIFFERENT error-category pair than instance 1. Build a request failing both: buyer has prior eviction AND lot is still PARK_OWNED. Priority order requires safety (priority 9) to win over referential (priority 12).
        test_recipe:
          setup:
            - "Park, PARK_OWNED Lot (no conversion yet), Home owned by seller R_S"
            - "Resident R_B with one EvictionCase finalized FOR_CAUSE 60 days ago (violation_count_12mo = 1)"
            - "POST /home-sale-transfers (R_S→R_B)"
          trigger:
            - "POST /home-sale-transfers/{transfer_id}/approve"
          assert:
            - "response status == 422"
            - "response error_id == 'ERR_BUYER_INELIGIBLE'   # safety beats referential per priority"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: rent_increase_window_exactly_90_days
        grounds:
          - validations[priority=13]
          - endpoints[POST /rent-increase-notices/{notice_id}/issue]
          - errors.ERR_NOTICE_WINDOW_TOO_SHORT
        distinguishing_aspect: |
          Numeric-threshold metric: days between effective_on and now() at issue time. The scaffold pins effective_on >= now() + 90 days (inclusive boundary, ≥ not >). Reached through POST /rent-increase-notices/{id}/issue endpoint.
        test_recipe:
          setup:
            - "Park, Lot, signed Lease, draft RentIncreaseNotice"
          trigger:
            - "Variant A: set effective_on = now() + exactly 90 days, POST /issue"
            - "Variant B: set effective_on = now() + 89 days, POST /issue"
          assert:
            - "Variant A: HTTP 200, RentIncreaseNotice.status == 'ISSUED'   # boundary inclusive"
            - "Variant B: HTTP 422, error_id == 'ERR_NOTICE_WINDOW_TOO_SHORT'"
      - name: utility_apportionment_zero_reading_empty_set_collapse
        grounds:
          - calculations.utility_apportionment
          - endpoints[POST /_sweep/billing]
          - entities.Lot.fields.sub_meter_reading_kwh
        distinguishing_aspect: |
          Different metric/endpoint than instance 1: empty/zero-collection edge case. When method=SUB_METER and ALL sub_meter_reading_kwh == 0.0 (zero-sum boundary), scaffold pins fallback to EQUAL_SPLIT behavior rather than divide-by-zero. Reached through POST /_sweep/billing.
        test_recipe:
          setup:
            - "Park P method=SUB_METER"
            - "Create 2 lots with sub_meter_reading_kwh=0.0 each, sign leases"
          trigger:
            - "POST /_sweep/billing master_total_cents=10001"
          assert:
            - "Both UtilityBills created (not zero count)"
            - "L01.lot_share_cents == 5001   # 10001//2=5000, +1 remainder to ascending lot_number"
            - "L02.lot_share_cents == 5000"
            - "Sum == 10001 (no divide-by-zero error, no NaN)"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: rent_increase_issue_gated_by_lease_state
        grounds:
          - state_machines.RentIncreaseNotice.DRAFT_to_ISSUED
          - validations[priority=15]
          - errors.ERR_RENT_INCREASE_BLOCKED_DURING_EVICTION
          - state_machines.Lease.CURRENT_to_GRACE
        distinguishing_aspect: |
          Pair = RentIncreaseNotice ↔ Lease. RentIncreaseNotice cannot transition DRAFT→ISSUED when its target Lease.status is GRACE. Different transition outcome depending on sibling Lease state.
        test_recipe:
          setup:
            - "Park, Lot, Resident, signed Lease (CURRENT)"
            - "Create DRAFT RentIncreaseNotice N effective_on=now()+100 days"
            - "File EvictionCase RULE_VIOLATION → Lease moves to GRACE"
          trigger:
            - "POST /rent-increase-notices/{N.id}/issue"
          assert:
            - "response status == 409"
            - "response error_id == 'ERR_RENT_INCREASE_BLOCKED_DURING_EVICTION'"
            - "After /eviction-cases/{id}/dismiss the same POST succeeds (lease returns to CURRENT and notice issues)"
      - name: home_sale_approve_gated_by_resident_violation_state
        grounds:
          - state_machines.HomeSaleTransfer.PENDING_PARK_APPROVAL_to_APPROVED
          - validations[priority=9]
          - errors.ERR_BUYER_INELIGIBLE
          - calculations.resident_violation_count_12mo
          - entities.Resident.fields.violation_count_12mo
        distinguishing_aspect: |
          Different entity pair than instance 1: HomeSaleTransfer ↔ Resident (buyer's derived state violation_count_12mo). Approval transition is conditional on buyer Resident's aggregated past-eviction state.
        test_recipe:
          setup:
            - "Park, Lot RESIDENT_OWNED, Home owned by R_S"
            - "Resident R_B_clean (0 violations); Resident R_B_dirty with 1 FINALIZED_FOR_CAUSE EvictionCase 60 days ago"
            - "POST /home-sale-transfers for R_S→R_B_clean = T_clean"
            - "POST /home-sale-transfers for R_S→R_B_dirty = T_dirty"
          trigger:
            - "POST /home-sale-transfers/{T_clean}/approve"
            - "POST /home-sale-transfers/{T_dirty}/approve"
          assert:
            - "T_clean.status == 'APPROVED'"
            - "T_dirty response status == 422, error_id == 'ERR_BUYER_INELIGIBLE'"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: lot_lease_occupancy_half_open_interval
        grounds:
          - validations[priority=10]
          - errors.ERR_LOT_OCCUPIED
          - state_machines.Lease.DRAFT_to_CURRENT
          - entities.Lot.fields.current_lease_id
        distinguishing_aspect: |
          Resource = Lot. Interval semantics = "Lot.current_lease_id slot is occupied while ≥1 lease references the lot in a non-terminal status; reservation released only on transition to TERMINATED or ASSUMED." Adjacency rule: a new Lease can be signed on the SAME Lot the instant the previous lease enters TERMINATED/ASSUMED (back-to-back permitted) — half-open occupancy. A second sign attempt during occupancy is rejected.
        test_recipe:
          setup:
            - "Park P, Lot L (PARK_OWNED), Resident R1, R2"
            - "Create + sign Lease A for R1 on L → L.current_lease_id = A.id"
            - "Create draft Lease B for R2 on L"
          trigger:
            - "POST /leases/{B.id}/sign while A still in CURRENT"
          assert:
            - "Sign response status == 409, error_id == 'ERR_LOT_OCCUPIED'"
            - "After terminating Lease A (e.g., via ILLEGAL_USE eviction) → L.current_lease_id == None"
            - "POST /leases/{B.id}/sign now succeeds   # half-open boundary: lease ends inclusive of TERMINATED moment, new lease may start at same instant"
      - name: home_position_uniqueness_aggregate_capacity
        grounds:
          - entities.Home.fields.lot_id
          - state_machines.HomeSaleTransfer.APPROVED_to_CLOSED
          - state_machines.ConversionRequest.ACCEPTED_to_CLOSED
          - concurrency_rules[Concurrent POST /conversion-requests/{id}/finalize and POST /home-sale-transfers/{id}/close on the same Lot]
          - errors.ERR_LOT_OCCUPIED_BY_PENDING_OP
        distinguishing_aspect: |
          Different resource (Lot ownership/home position) and different interval semantics than instance 1: aggregate-capacity-of-one (a Lot has capacity 1 for ownership-mutating operations) rather than time-window occupancy. Two concurrent mutations (conversion finalize vs home-sale close) compete for the same Lot capacity-of-1 slot. Interval is logically zero-duration but exclusive — only one writer per Lot.version per instant.
        test_recipe:
          setup:
            - "Park, Lot L PARK_OWNED with current_lease_id null, Home H on L"
            - "Create ConversionRequest C OFFERED, resident accepts → ACCEPTED"
            - "Create HomeSaleTransfer T for H to a different buyer, approve → APPROVED  (note: this requires temporarily RESIDENT_OWNED — but for the race we set up two LOTs only differing in start state; alternatively use distinct conversion+sale on same lot in a contrived race window — see test harness ordering)"
          trigger:
            - "Issue POST /conversion-requests/{C.id}/finalize and POST /home-sale-transfers/{T.id}/close simultaneously via concurrent threads"
          assert:
            - "Exactly one of the two responses is 200; the other is 409 with error_id == 'ERR_LOT_OCCUPIED_BY_PENDING_OP'"
            - "Lot.version incremented exactly once"
            - "Lot.ownership_mode reflects the winner's operation; loser's state machine remains in its pre-call state"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: lease_balance_pay_then_dismiss_preserves_total
        grounds:
          - state_machines.Lease.DELINQUENT_to_CURRENT
          - state_machines.EvictionCase.IN_CURE_to_DISMISSED
          - calculations.lease_outstanding_balance
          - entities.Lease.fields.outstanding_balance_cents
          - entities.UtilityBill.fields.paid_at
        distinguishing_aspect: |
          Conserved quantity = sum across Lease of (paid bills' total_due_cents) PLUS Lease.outstanding_balance_cents. Forward action (POST /leases/{id}/pay) moves N cents from "outstanding" into "paid"; compensating action (POST /eviction-cases/{id}/dismiss when the case had been blocking) leaves THIS conserved quantity unchanged. Formal: sum(UtilityBill.total_due_cents for paid bills) + Lease.outstanding_balance_cents is invariant across the dismiss.
        test_recipe:
          setup:
            - "Park, Lot, Resident, signed Lease"
            - "Run /_sweep/billing creating 1 UtilityBill total_due_cents=5000"
            - "Lease is DELINQUENT, outstanding_balance_cents=5000, paid_sum=0; conserved Q_before = 5000+0=5000"
            - "File RULE_VIOLATION EvictionCase → Lease GRACE"
            - "POST /leases/{id}/pay → bill.paid_at set, outstanding=0; intermediate Q = 0+5000=5000"
          trigger:
            - "POST /eviction-cases/{case_id}/dismiss"
          assert:
            - "Q_after = sum(UtilityBill.total_due_cents WHERE paid_at NOT NULL) + Lease.outstanding_balance_cents == 5000"
            - "Q_after == Q_before   # named invariant pinned over UtilityBill + Lease fields"
            - "Lease.status == 'CURRENT'"
      - name: lot_ownership_pool_conversion_finalize_decrements_exactly_once
        grounds:
          - state_machines.ConversionRequest.ACCEPTED_to_CLOSED
          - entities.Park.fields.ownership_pool_count
          - entities.Lot.fields.ownership_mode
          - concurrency_rules[Concurrent POST /conversion-requests/{id}/finalize and POST /home-sale-transfers/{id}/close on the same Lot]
        distinguishing_aspect: |
          Different conserved quantity than instance 1 (ownership counts, not monetary balances): Park.ownership_pool_count + count(Lot WHERE ownership_mode=RESIDENT_OWNED in park) is invariant across any sequence of conversion + counter-attempt-of-second-finalize. Forward action (finalize) decrements ownership_pool_count by 1 and increments RESIDENT_OWNED count by 1; compensating concurrent loser receives ERR_LOT_OCCUPIED_BY_PENDING_OP and does NOT mutate counts. Total Lots = ownership_pool_count + resident_owned_count remains exactly len(park.lots).
        test_recipe:
          setup:
            - "Park P with 3 lots, all PARK_OWNED → ownership_pool_count=3, resident_owned=0, Q_before = 3+0=3 = len(park.lots)"
            - "Create ConversionRequest on L01, resident accepts (ACCEPTED)"
            - "Snapshot park.ownership_pool_count"
          trigger:
            - "POST /conversion-requests/{C.id}/finalize"
            - "POST /conversion-requests/{C.id}/finalize  (second call, should fail with ERR_INVALID_STATE because already CLOSED)"
          assert:
            - "First call: 200, Lot.ownership_mode == 'RESIDENT_OWNED', park.ownership_pool_count == 2"
            - "Second call: 409, error_id == 'ERR_INVALID_STATE'   # no double-decrement"
            - "Q_after = park.ownership_pool_count + count(Lot WHERE ownership_mode='RESIDENT_OWNED' AND park_id=P) == 2+1 == 3 == Q_before"
            - "len(park.lots) == 3 (conservation invariant holds across both attempts)"
