            - "the first decide attempt returns HTTP 409 ERR_REVIEWER_NOT_ACTIVE, not ERR_REVIEWER_NOT_CERTIFIED — the status gate at priority 40 pre-empts the certification gate at priority 50"
            - "the certification grant returns HTTP 200 with status == ACTIVE, pending_retraining_version_ids == [] and certified_policy_version_ids still == [${pv1_id}] (idempotent set semantics)"
            - "the second decide attempt then succeeds with HTTP 200: ModerationCase ${case4_id}.status == DECIDED, decision_outcome NO_ACTION, and the flag is satisfied because v1 is still the category's CURRENT active_version_id"
            - "Account ${acct_id}.strike_points == 0 and standing == GOOD_STANDING throughout — every decision was NO_ACTION"
      - name: case_cyclic_shape_covered_by_difficulty_design
        claim_type: cyclic
        grounds:
          - state_machines.ModerationCase.transitions.ESCALATED_to_ASSIGNED
          - state_machines.ModerationCase.transitions.ASSIGNED_to_ESCALATED
        excluded_because:
          difficulty_instance: case_cycle_escalated_back_to_assigned_and_queue
          rationale: "That §1.8 instance drives ModerationCase around ASSIGNED -> ESCALATED -> PENDING_ASSIGNMENT -> ASSIGNED and asserts the reassignment_count, escalation_tier and queue-counter evolution on every hop; the AuditSample loop is covered here instead so the two cycles are not tested twice."
      - name: content_item_parallel_shape_covered_by_difficulty_design
        claim_type: parallel
        grounds:
          - state_machines.ContentItem
        excluded_because:
          difficulty_instance: content_item_parallel_dimensions_independent
          rationale: "The independence of ContentItem's visibility_status and review_status dimensions, and the correctness of the combined state, is asserted end-to-end there."
      - name: policy_activation_cascade_down_covered_by_difficulty_design
        claim_type: cascade_down
        grounds:
          - state_machines.PolicyVersion.transitions.BACKTESTING_to_ACTIVE
        excluded_because:
          difficulty_instance: policy_activation_cascade_supersede_decert_and_case_recert_flag
          rationale: "The four-level parent-to-children cascade of an activation (supersede, decertify, flag open cases, bubble the category) including the only-non-terminal-children restriction is fully asserted there."
      - name: appeal_overturn_compensation_covered_by_difficulty_design
        claim_type: compensation
        grounds:
          - state_machines.Appeal.transitions.INDEPENDENT_REVIEW_to_OVERTURNED
        excluded_because:
          difficulty_instance: strike_point_ledger_restored_by_appeal_overturn
          rationale: "The undo semantics of an OVERTURNED appeal — every decide side effect reversed with no drift on the strike ledger, the standing, the removal count or the credit balance — is asserted there."
      - name: decide_ledger_sync_covered_by_difficulty_design
        claim_type: ledger_sync
        grounds:
          - state_machines.ModerationCase.transitions.ASSIGNED_to_DECIDED
          - calculations.account_strike_ledger
        excluded_because:
          difficulty_instance: strike_points_multiply_then_ceil_once
          rationale: "The ancestor Account.strike_points ledger is reconciled before and after each decide in that instance, which also pins the per-decision rounding."
      - name: decide_cross_entity_effects_covered_by_difficulty_design
        claim_type: cross_entity
        grounds:
          - state_machines.ModerationCase.transitions.ASSIGNED_to_DECIDED
          - state_machines.ModerationCase.transitions.ASSIGNED_to_ESCALATED
        excluded_because:
          difficulty_instance: case_branch_escalate_vs_decide_divergent_side_effects
          rationale: "The decide branch's effects on ContentItem, ReviewQueue, Reviewer and Account are compared field by field against the escalate branch there."
      - name: decide_guarded_transition_covered_by_difficulty_design
        claim_type: guarded transitions
        grounds:
          - state_machines.ModerationCase.transitions.ASSIGNED_to_DECIDED
          - validations[priority=50]
        excluded_because:
          difficulty_instance: decide_blocked_when_reviewer_certification_voided_by_activation
          rationale: "The cross-entity guard on ASSIGNED -> DECIDED (the case may only be decided while the reviewer holds the required certification) is asserted there in both the passing and the blocked configuration."

  - section: calculations
