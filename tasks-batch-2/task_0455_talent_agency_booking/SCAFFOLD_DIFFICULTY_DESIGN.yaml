# =============================================================================
# task_0455_talent_agency_booking — §1.8 Scaffold Difficulty Design
# Test Targeting Index: 9 Difficulty Rules x 2 instances = 18 instances.
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1–§1.7.
# All formula-derived asserts are precomputed literals.
# Canonical fixtures: agency commission_rate_bps=1000 (10%); SAG P&H=1850 bps.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: commission_provisional_vs_final_diverges
        grounds:
          - calculations.provisional_commission
          - calculations.final_commission
          - entities.Booking.fields.provisional_commission_cents
          - entities.Booking.fields.final_commission_cents
          - state_machines.Booking.PENDING_to_CONFIRMED
          - state_machines.Booking_payment_dimension.UNPAID_to_PAID
        distinguishing_aspect: |
          Provisional commission is forward-looking on the quoted gross_fee_cents
          (Booking domain) while final commission is chronological on the actual
          remitted gross_amount_cents (Payment domain); with quoted gross 1000000
          and actual gross 1050000 at 10% they differ: 100000 vs 105000.
        test_recipe:
          setup:
            - "Agency at 10% commission; SAG talent ROSTERED with one comp card."
            - "DealMemo ACCEPTED at day rate 200000; CONFIRMED_BOOKING hold for 2026-03-15..2026-03-19."
            - "Booking CONFIRMED for 5 inclusive days (gross 1000000, provisional 100000), then COMPLETED after clock advance."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Stellar Talent", commission_rate_bps: 1000 }
              as: Agent
              captures: { agency_id: $.data.id }
            - call: "POST /casting-directors"
              payload: { display_name: "Dana Cast", studio: "BigPic" }
              as: Agent
              captures: { cd_id: $.data.id }
            - call: "POST /talents"
              payload: { agency_id: "${agency_id}", full_name: "Tess Lead", union_status: "SAG", scale_rate_cents: 100000 }
              as: Agent
              captures: { talent_id: $.data.id }
            - call: "POST /comp-cards"
              payload: { talent_id: "${talent_id}", headshot_url: "http://x/h.jpg", height_cm: 170, skills: ["dance"] }
              as: Agent
              captures: { cc_id: $.data.id }
            - call: "POST /talents/${talent_id}/roster"
              payload: {}
              as: Agent
            - call: "POST /casting-calls"
              payload: { casting_director_id: "${cd_id}", title: "Lead Spot", media_type: "STREAMING", usage_term_months: 12, shoot_start_date: "2026-03-15T00:00:00Z", shoot_end_date: "2026-03-19T00:00:00Z", offered_day_rate_cents: 200000 }
              as: CastingDirector
              as_user_id: "${cd_id}"
              captures: { call_id: $.data.id }
            - call: "POST /submissions"
              payload: { casting_call_id: "${call_id}", talent_id: "${talent_id}", comp_card_id: "${cc_id}" }
              as: Agent
              captures: { sub_id: $.data.id }
            - call: "POST /deal-memos"
              payload: { casting_call_id: "${call_id}", talent_id: "${talent_id}", submission_id: "${sub_id}" }
              as: CastingDirector
              as_user_id: "${cd_id}"
              captures: { dm_id: $.data.id }
            - call: "POST /deal-memos/${dm_id}/offer"
              payload: { offer_day_rate_cents: 200000, offer_usage_term_months: 12 }
              as: CastingDirector
              as_user_id: "${cd_id}"
            - call: "POST /deal-memos/${dm_id}/accept"
              payload: {}
              as: Talent
              as_user_id: "${talent_id}"
            - call: "POST /availability-holds"
              payload: { talent_id: "${talent_id}", start_date: "2026-03-15T00:00:00Z", end_date: "2026-03-19T00:00:00Z", hold_kind: "CONFIRMED_BOOKING" }
              as: Agent
              captures: { hold_id: $.data.id }
            - call: "GET /talents/${talent_id}"
              payload: {}
              as: Agent
              captures: { tv1: $.data.version }
            - call: "POST /bookings"
              payload: { deal_memo_id: "${dm_id}", talent_id: "${talent_id}", casting_call_id: "${call_id}", availability_hold_id: "${hold_id}", start_date: "2026-03-15T00:00:00Z", end_date: "2026-03-19T00:00:00Z", expected_talent_version: "${tv1}" }
              as: Agent
              captures: { booking_id: $.data.id }
            - call: "GET /talents/${talent_id}"
              payload: {}
              as: Agent
              captures: { tv2: $.data.version }
            - call: "POST /bookings/${booking_id}/confirm"
              payload: { expected_talent_version: "${tv2}" }
              as: Agent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-20T00:00:00Z" }
              as: Agent
            - call: "POST /bookings/${booking_id}/complete"
              payload: {}
              as: Agent
          trigger:
            - call: "POST /payments"
              payload: { booking_id: "${booking_id}", talent_id: "${talent_id}", gross_amount_cents: 1050000 }
              as: Agent
              captures: { pay_id: $.data.id }
          assert:
            - "Booking.${booking_id}.provisional_commission_cents == 100000"
            - "Booking.${booking_id}.final_commission_cents == 105000"
            - "Payment.${pay_id}.commission_withheld_cents == 105000"
            - "Booking.${booking_id}.final_commission_cents != Booking.${booking_id}.provisional_commission_cents"

      - name: availability_projection_vs_committed_diverges
        grounds:
          - calculations.talent_availability_projection
          - calculations.talent_committed_days
          - entities.AvailabilityHold.fields.hold_kind
          - endpoints[GET /talents/{id}/availability-summary]
        distinguishing_aspect: |
          On the Talent domain (not Booking), the forward-looking projection counts
          all ACTIVE holds (FIRST_REFUSAL 3 days + CONFIRMED_BOOKING 5 days = 8),
          while the committed variant counts only CONFIRMED_BOOKING days (5); same
          rows, two algorithms, projected_blocked_days=8 != committed_days=5.
        test_recipe:
          setup:
            - "ROSTERED talent with two ACTIVE holds: FIRST_REFUSAL 2026-03-10..2026-03-12 (3 days) and CONFIRMED_BOOKING 2026-03-15..2026-03-19 (5 days)."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Stellar Talent", commission_rate_bps: 1000 }
              as: Agent
              captures: { agency_id: $.data.id }
            - call: "POST /talents"
              payload: { agency_id: "${agency_id}", full_name: "Ava Hold", union_status: "SAG", scale_rate_cents: 100000 }
              as: Agent
              captures: { talent_id: $.data.id }
            - call: "POST /comp-cards"
              payload: { talent_id: "${talent_id}", headshot_url: "http://x/h.jpg", height_cm: 168, skills: ["sing"] }
              as: Agent
            - call: "POST /talents/${talent_id}/roster"
              payload: {}
              as: Agent
            - call: "POST /availability-holds"
              payload: { talent_id: "${talent_id}", start_date: "2026-03-10T00:00:00Z", end_date: "2026-03-12T00:00:00Z", hold_kind: "FIRST_REFUSAL" }
              as: Agent
            - call: "POST /availability-holds"
              payload: { talent_id: "${talent_id}", start_date: "2026-03-15T00:00:00Z", end_date: "2026-03-19T00:00:00Z", hold_kind: "CONFIRMED_BOOKING" }
              as: Agent
          trigger:
            - call: "GET /talents/${talent_id}/availability-summary"
              payload: {}
              as: Agent
          assert:
            - "response.data.projected_blocked_days == 8"
            - "response.data.committed_days == 5"
            - "response.data.projected_blocked_days != response.data.committed_days"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: sag_residual_tiered_media_period_nonlinear
        grounds:
          - calculations.sag_residual
          - entities.CastingCall.fields.media_type
          - entities.Talent.fields.union_status
          - entities.ResidualSchedule.fields.period_index
