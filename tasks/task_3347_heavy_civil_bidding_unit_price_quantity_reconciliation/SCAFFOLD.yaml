      - "GET /construction/bonds"
      - "GET /construction/bonds/{id}"
      - "GET /construction/sureties/{id}"
      - "GET /construction/surety-commitments"
  - name: Anonymous
    description: "Unauthenticated caller permitted only to open a session"
    identity: "opaque"
    exclusive_operations:
      - "POST /construction/sessions"
    shared_operations: []