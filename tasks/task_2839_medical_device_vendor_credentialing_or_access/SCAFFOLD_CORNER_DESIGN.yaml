      - name: late_fee_precision_rounds_per_tray_before_multiplying
        claim_type: precision
        grounds:
          - calculations.loaner_late_fee
          - global_constants.PER_TRAY_BASE_RATE_CENTS_PER_MINUTE
        excluded_because:
          difficulty_instance: combinatorial_formula / late_fee_rounds_per_tray_before_multiplying_by_tray_count
          rationale: "That §1.8 instance pins 1125 against the sum-then-round wrong answer 1124, which is exactly the rounding-order precision claim."

      - name: compliance_score_weights_sum_across_incident_severities
        claim_type: weighted_scoring
        grounds:
          - calculations.vendor_compliance_score
          - global_constants.W_INCIDENT_MAJOR
        excluded_because:
          difficulty_instance: dual_variant_calc / vendor_provisional_vs_adjudicated_score_diverge_on_open_incident
          rationale: "That §1.8 instance sums a MINOR and a MAJOR incident weight into both score variants and asserts the 3-point delta."

      - name: spd_occupation_interval_collision_at_zero_gap
        claim_type: interval_merge
        grounds:
          - calculations.spd_bay_occupation
          - global_constants.SPD_BAY_BUFFER_MINUTES
        excluded_because:
          difficulty_instance: resource_temporal_overlap / spd_bay_capacity_rejects_buffered_touching_occupation
          rationale: "That §1.8 instance is the zero-gap adjacency case made colliding by the ±30-minute buffer."

      - name: badge_window_interval_adjacency_is_not_a_collision
        claim_type: interval_merge
        grounds:
          - calculations.badge_validity_window
          - validations.priority_28_ERR_REP_BADGE_WINDOW_CONFLICT
        excluded_because:
          difficulty_instance: resource_temporal_overlap / badge_window_overlap_rejected_while_adjacent_window_is_legal
          rationale: "That §1.8 instance approves two exactly adjacent half-open badge windows and rejects only the genuinely overlapping third."

      - name: deadline_variant_pinned_versus_current_basis
        claim_type: variant_divergence
        grounds:
          - calculations.loaner_delivery_deadline.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / loaner_pinned_versus_current_deadline_basis_after_reschedule
          rationale: "That §1.8 instance holds both deadline bases on one set after a reschedule and asserts 37 pinned late minutes against 0 current."

      - name: fee_reversal_reconciles_the_vendor_ledger_delta
        claim_type: reconciliation
        grounds:
          - calculations.loaner_late_fee
          - entities.LoanerSet.fields.fee_status
        excluded_because:
          difficulty_instance: compensating_invariant / fee_reversal_conserves_vendor_ledger_against_resum
          rationale: "That §1.8 instance applies the REVERSED delta to Vendor.late_fee_balance_cents and reconciles it against the retained historical assessment."

      - name: quota_and_tier_propagate_through_the_pinned_sweep_order
        claim_type: constraint_propagation
        grounds:
          - calculations.vendor_scorecard_tier_and_quota
          - global_constants.TIER_STEP
        excluded_because:
          difficulty_instance: combinatorial_formula / sweep_quota_tier_reset_pinned_evaluation_order
          rationale: "That §1.8 instance walks all eight pinned steps and contrasts the correct 60 / TIER_PROBATION / quota 1 outcome with the wrong-order 72 / TIER_STANDARD / quota 4."

      - name: expiry_threshold_at_exact_equality
        claim_type: threshold
        grounds:
          - calculations.rep_credential_posture
          - global_constants.EXPIRY_WARNING_DAYS
        excluded_because:
          difficulty_instance: boundary_precision_check / credential_expiry_equality_expires_one_second_later_only_warns
          rationale: "That §1.8 instance puts one credential exactly on the expiry instant and another one second later, covering both sides of the threshold."

  - section: validations
    instances:

      - name: duplicate_vendor_code_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_32
          - errors[ERR_DUPLICATE_VENDOR_CODE]
        distinguishing_aspect: "The natural-key uniqueness rule fires on vendor_code alone: a second vendor with a different legal_name but vendor_code DUPV is refused 409 and no second row appears."
        test_recipe:
          setup:
            - "One Vendor already holds vendor_code DUPV."
          setup_api_calls:
            - call: "POST /vendor-access/vendors"
              payload: { legal_name: "Duplicate Devices One", vendor_code: "DUPV" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { v_dupv_id: $.data.id }
          trigger:
            - call: "POST /vendor-access/vendors"
              payload: { legal_name: "Duplicate Devices Two", vendor_code: "DUPV" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { dup_vendor_err: $.data.error_id }
          assert:
            - "HTTP status is 409 and ${dup_vendor_err} == ERR_DUPLICATE_VENDOR_CODE"
            - "GET /vendor-access/vendors?vendor_code=DUPV returns total_count == 1 whose id == ${v_dupv_id} and legal_name == Duplicate Devices One"

      - name: duplicate_pending_credential_of_the_same_type_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_31
          - errors[ERR_DUPLICATE_CREDENTIAL]
        distinguishing_aspect: "PENDING_VERIFICATION already occupies the (rep, type) slot: the second BACKGROUND_CHECK is refused 409 even though nobody has verified the first one yet."
        test_recipe:
          setup:
            - "Vendor DUPCV has rep Dana with one PENDING_VERIFICATION BACKGROUND_CHECK."
          setup_api_calls:
            - call: "POST /vendor-access/vendors"
              payload: { legal_name: "Duplicate Credential Devices", vendor_code: "DUPCV" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { v_dupcv_id: $.data.id }
            - call: "POST /vendor-access/vendor-reps"
              payload: { vendor_id: "${v_dupcv_id}", full_name: "Dana Dup", email: "dana@dupcv.example" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { rep_dana_id: $.data.id }
            - call: "POST /vendor-access/credentials"
              payload: { vendor_rep_id: "${rep_dana_id}", credential_type: "BACKGROUND_CHECK", issued_at_utc: "2026-07-01T00:00:00Z", expires_at_utc: "2027-07-01T00:00:00Z", document_reference: "BGC-DUP-01" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { cred_dana_bgc_id: $.data.id }
          trigger:
            - call: "POST /vendor-access/credentials"
              payload: { vendor_rep_id: "${rep_dana_id}", credential_type: "BACKGROUND_CHECK", issued_at_utc: "2026-07-10T00:00:00Z", expires_at_utc: "2027-07-10T00:00:00Z", document_reference: "BGC-DUP-02" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { dup_cred_err: $.data.error_id }
          assert:
            - "HTTP status is 409 and ${dup_cred_err} == ERR_DUPLICATE_CREDENTIAL"
            - "GET /vendor-access/vendor-reps/${rep_dana_id}/credentials?credential_type=BACKGROUND_CHECK returns total_count == 1 whose id == ${cred_dana_bgc_id}"
            - "VendorRep.${rep_dana_id}.credential_posture is still INCOMPLETE"

      - name: case_end_before_start_rejects_with_invalid_time_range
        claim_type: violation_to_error
        grounds:
          - validations.priority_4
          - errors[ERR_INVALID_TIME_RANGE]
        distinguishing_aspect: "Instant ordering is checked before any business rule and returns 400 (not 422): scheduled_end_utc equal to one second before scheduled_start_utc is refused, and no SurgicalCase row is created."
        test_recipe:
          setup:
            - "Facility TR-45 exists."
          setup_api_calls:
            - call: "POST /vendor-access/facilities"
              payload: { name: "Time Range Hospital", code: "TR-45", spd_turnaround_hours: 4, spd_bay_count: 2 }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { f_tr_id: $.data.id }
          trigger:
            - call: "POST /vendor-access/surgical-cases"
              payload: { facility_id: "${f_tr_id}", case_number: "CASE-15030", procedure_name: "Backwards Window Case", scheduled_start_utc: "2026-09-10T08:00:00Z", scheduled_end_utc: "2026-09-10T07:59:59Z" }
              as: ORCoordinator
              as_user_id: "user_orc_1"
              captures: { bad_range_err: $.data.error_id }
          assert:
            - "HTTP status is 400 and ${bad_range_err} == ERR_INVALID_TIME_RANGE"
            - "GET /vendor-access/surgical-cases?facility_id=${f_tr_id} returns total_count == 0"

