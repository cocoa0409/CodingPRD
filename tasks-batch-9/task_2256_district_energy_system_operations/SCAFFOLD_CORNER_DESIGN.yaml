            - "ProductionAsset.${p_g1_id}.availability_state == OUTAGE"
            - "the ACTIVE response status is 409 with data.error_id == ERR_AVAILABILITY_STATE_INVALID"
            - "the SUSPENDED response status is 409 with data.error_id == ERR_AVAILABILITY_STATE_INVALID"
            - "FuelSupplyContract.${fcg_p_id}.status == EXPIRED"
            - "ProductionAsset.${p_g1_id}.availability_state == OUTAGE"

