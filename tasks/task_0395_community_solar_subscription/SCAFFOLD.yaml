# =============================================================================
# Community Solar Subscription — Seed Tables (SCAFFOLD.yaml)
# §1.0–§1.7  (Expert band per §0.4)
# =============================================================================

scenario: |
  Community Solar Subscription: project/garden capacity & subscriber share,
  allocation & bill-credit calculation, monthly savings reconciliation (utility
  on-bill), waitlist & churn/transfer, true-up & overproduction, enrollment &
  cancellation, low-income carve-out, REC tracking

domain_name: community-solar
api_prefix: ""

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation       # provisional bill-credit vs final metered credit
    - cascading_side_effects         # period reconcile → allocations → credits → reconciliations → project ledger
    - derived_field_reconciliation   # project committed_kw / available_kw / rec balances stay consistent
    - optimistic_concurrency         # OCC on SolarProject.version and BillingPeriod.version for true races
    - ops_run_checkpoint             # monthly period metering/close advances the billing epoch

  entity_topology: flat
  # Peer entities linked by foreign keys. Subscription, Allocation, Reconciliation,
  # RECBatch, WaitlistEntry are flat resources keyed by FK to SolarProject /
  # BillingPeriod / Subscriber rather than nested in URL paths.

  state_machine_shape: parallel
  # Reconciliation carries two independent state dimensions (credit_status ×
  # dispute_status). Subscription is cyclic (suspend↔resume, transfer loop),
  # Enrollment is cyclic (reject→resubmit), BillingPeriod is compound, RECBatch
  # is branching fork-join.

  relationship_patterns:
    - one_to_many        # SolarProject → BillingPeriod, Subscription, WaitlistEntry
    - cross_aggregate    # Allocation references both BillingPeriod and Subscription
    - self_referential   # Subscription.transferred_from_subscription_id

  role_model: peer_roles
  # GridOperator owns projects/periods/metering; Subscriber acts on own
  # subscription/enrollment/cancellation; ProgramAdmin handles carve-out,
  # waitlist promotion, dispute resolution, REC retirement.

  consistency_model: immediate
  # All cascades (period reconcile, allocation distribution, credit issuance,
  # reconciliation, ledger recompute) complete atomically within one request.

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table  (10 entities)
# =============================================================================
entities:
  - name: SolarProject
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Solar garden / project name" }
      - { name: state_code, type: string, source: input, description: "Two-letter utility-jurisdiction code, e.g. NY" }
      - { name: nameplate_capacity_kw, type: number, source: input, description: "Total subscribable capacity in kW DC", constraints: "> 0" }
      - { name: carve_out_pct, type: number, source: input, default: 0.40, description: "Fraction of nameplate_capacity_kw reserved for low-income subscribers", constraints: "0 <= x <= 1" }
      - { name: credit_rate_cents_per_kwh, type: integer, source: input, description: "Utility bill-credit value per kWh in integer cents", constraints: ">= 0" }
      - { name: program_fee_rate, type: number, source: input, default: 0.10, description: "Base program fee as a fraction of gross monthly credit", constraints: "0 <= x < 1" }
      - { name: committed_kw, type: number, source: computed, description: "Sum of share_kw over Subscriptions in status IN {ACTIVE, SUSPENDED, TRANSFERRING}" }
      - { name: carve_out_committed_kw, type: number, source: computed, description: "Sum of share_kw over Subscriptions in status IN {ACTIVE, SUSPENDED, TRANSFERRING} whose is_carve_out == true" }
      - { name: available_kw, type: number, source: computed, description: "nameplate_capacity_kw - committed_kw (never below 0)" }
      - { name: carve_out_available_kw, type: number, source: computed, description: "round(nameplate_capacity_kw * carve_out_pct, 3) - carve_out_committed_kw (floored at 0)" }
      - { name: rec_minted_total, type: integer, source: computed, description: "Cumulative whole RECs minted across all periods in status IN {RECONCILED, TRUED_UP, CLOSED}" }
      - { name: rec_retired_total, type: integer, source: computed, description: "Cumulative whole RECs over RECBatches in status RETIRED" }
      - { name: rec_available_balance, type: integer, source: computed, description: "rec_minted_total - rec_retired_total - (sum of rec_count over RECBatches in status TRANSFERRED)" }
      - { name: total_net_savings_cents, type: integer, source: computed, description: "Sum of net_savings_cents over all Reconciliations of this project in credit_status APPLIED" }
      - { name: status, type: enum, source: system, description: "OPEN | FULL — FULL when available_kw == 0", default: "OPEN", constraints: "OPEN | FULL" }

  - name: Subscriber
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Subscriber legal name" }
      - { name: utility_account_no, type: string, source: input, description: "Utility on-bill account number", constraints: "unique across Subscribers" }
      - { name: state_code, type: string, source: input, description: "Two-letter jurisdiction of the utility account" }
      - { name: is_low_income, type: boolean, source: input, default: false, description: "True if the subscriber qualifies for the low-income carve-out" }
      - { name: annual_usage_kwh, type: integer, source: input, description: "Self-reported annual consumption used to cap requested share", constraints: ">= 0" }
      - { name: churn_risk_score, type: integer, source: computed, description: "0–100 weighted churn-risk score (snapshot variant) recomputed on suspend/resume/cancel/dispute/resolve events" }
      - { name: lifetime_savings_cents, type: integer, source: computed, description: "Sum of net_savings_cents over the subscriber's Reconciliations in credit_status APPLIED" }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> SolarProject.id" }
      - { name: subscriber_id, type: string, source: input, description: "FK -> Subscriber.id" }
      - { name: requested_share_kw, type: number, source: input, description: "Requested capacity share in kW", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | ACTIVATED | REJECTED", default: "DRAFT", constraints: "DRAFT | SUBMITTED | APPROVED | ACTIVATED | REJECTED" }
      - { name: rejection_reason, type: string, source: input, required: false, description: "Reason captured when an enrollment is rejected" }
      - { name: subscription_id, type: string, source: computed, required: false, description: "FK -> Subscription.id; set when the enrollment is ACTIVATED into a Subscription" }

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> SolarProject.id" }
      - { name: subscriber_id, type: string, source: system, description: "FK -> Subscriber.id" }
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id" }
      - { name: share_kw, type: number, source: system, description: "Committed capacity share in kW (copied from the activating Enrollment)", constraints: "> 0" }
      - { name: is_carve_out, type: boolean, source: system, description: "True when the activating Subscriber.is_low_income was true; pins carve-out accounting for this subscription" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | TRANSFERRING | CANCELLED", default: "ACTIVE", constraints: "ACTIVE | SUSPENDED | TRANSFERRING | CANCELLED" }
      - { name: transferred_from_subscription_id, type: string, source: system, required: false, description: "FK -> Subscription.id; self-reference to the originating subscription when this row was created by a transfer" }
      - { name: cancellation_effective_period_id, type: string, source: computed, required: false, description: "FK -> BillingPeriod.id; the period at/after which this subscription stops earning allocations" }

  - name: WaitlistEntry
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> SolarProject.id" }
      - { name: subscriber_id, type: string, source: input, description: "FK -> Subscriber.id" }
      - { name: requested_share_kw, type: number, source: input, description: "Capacity requested while project is FULL", constraints: "> 0" }
      - { name: queued_at, type: datetime, source: system, description: "Server timestamp used as the FIFO ordering key for promotion" }
      - { name: status, type: enum, source: system, description: "QUEUED | PROMOTED | WITHDRAWN", default: "QUEUED", constraints: "QUEUED | PROMOTED | WITHDRAWN" }
      - { name: promoted_enrollment_id, type: string, source: computed, required: false, description: "FK -> Enrollment.id; the enrollment minted when this entry was PROMOTED" }

  - name: BillingPeriod
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> SolarProject.id" }
      - { name: period_month, type: string, source: input, description: "Billing month as YYYY-MM", constraints: "unique per project" }
      - { name: sequence_index, type: integer, source: system, description: "Monotonic per-project ordering index assigned at period creation (0,1,2,...); used to compare period order" }
      - { name: forecast_production_kwh, type: integer, source: input, description: "Forecast production used for provisional credits", constraints: ">= 0" }
      - { name: metered_production_kwh, type: integer, source: input, required: false, description: "Actual metered production set at metering", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "OPEN | METERED | RECONCILED | TRUED_UP | CLOSED", default: "OPEN", constraints: "OPEN | METERED | RECONCILED | TRUED_UP | CLOSED" }
      - { name: distributable_kwh, type: integer, source: computed, description: "metered_production_kwh once status is METERED or later, else forecast_production_kwh; the pool the allocation waterfall distributes" }
      - { name: allocated_kwh_total, type: integer, source: computed, description: "Sum of allocated_kwh across this period's Allocations in status IN {PROVISIONAL, FINAL}" }
      - { name: overproduction_kwh, type: integer, source: computed, description: "distributable_kwh - allocated_kwh_total (unallocated residual carried into true-up)" }
      - { name: rollover_kwh, type: integer, source: computed, description: "Overproduction carried forward at true-up (capped); 0 until TRUED_UP" }
      - { name: forfeited_kwh, type: integer, source: computed, description: "overproduction_kwh - rollover_kwh lost at true-up; 0 until TRUED_UP" }
      - { name: rollover_credit_cents, type: integer, source: computed, description: "rollover_kwh * credit_rate_cents_per_kwh banked at true-up; 0 until TRUED_UP" }
      - { name: rec_minted_count, type: integer, source: computed, description: "Whole RECs minted from this period at RECONCILED (floor(metered_production_kwh / 1000))" }

  - name: Allocation
    parent: null
    common_fields: true
    fields:
      - { name: period_id, type: string, source: system, description: "FK -> BillingPeriod.id" }
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id" }
      - { name: share_kw_snapshot, type: number, source: system, description: "Subscription.share_kw captured at distribution time" }
      - { name: allocated_kwh, type: integer, source: computed, description: "Whole kWh distributed to this subscription by the waterfall" }
      - { name: provisional_credit_cents, type: integer, source: computed, description: "forecast-basis allocated_kwh * project.credit_rate_cents_per_kwh, computed at period OPEN" }
      - { name: final_credit_cents, type: integer, source: computed, required: false, description: "metered-basis allocated_kwh * project.credit_rate_cents_per_kwh, computed at RECONCILED" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | FINAL | VOID", default: "PROVISIONAL", constraints: "PROVISIONAL | FINAL | VOID" }

  - name: Reconciliation
    parent: null
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id" }
      - { name: period_id, type: string, source: system, description: "FK -> BillingPeriod.id" }
      - { name: allocation_id, type: string, source: system, description: "FK -> Allocation.id" }
      - { name: gross_credit_cents, type: integer, source: computed, description: "final_credit_cents of the linked Allocation at reconciliation time" }
      - { name: program_fee_cents, type: integer, source: computed, description: "Tiered program fee charged on the gross credit (carve-out subscriptions get a reduced rate)" }
      - { name: net_savings_cents, type: integer, source: computed, description: "gross_credit_cents - program_fee_cents (on-bill savings)" }
      - { name: credit_status, type: enum, source: system, description: "DRAFT | ISSUED | APPLIED — on-bill posting dimension", default: "DRAFT", constraints: "DRAFT | ISSUED | APPLIED" }
      - { name: dispute_status, type: enum, source: system, description: "NONE | DISPUTED | RESOLVED — dispute dimension evolving independently of credit_status", default: "NONE", constraints: "NONE | DISPUTED | RESOLVED" }

  - name: RECBatch
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> SolarProject.id" }
      - { name: period_id, type: string, source: system, description: "FK -> BillingPeriod.id" }
      - { name: rec_count, type: integer, source: computed, description: "Whole RECs minted from the period (floor(metered_production_kwh / 1000))", constraints: ">= 0" }
      - { name: retirement_beneficiary, type: string, source: input, required: false, description: "Beneficiary recorded on retirement" }
      - { name: transfer_counterparty, type: string, source: input, required: false, description: "Counterparty recorded on transfer" }
      - { name: status, type: enum, source: system, description: "MINTED | ALLOCATED | RETIRED | TRANSFERRED", default: "MINTED", constraints: "MINTED | ALLOCATED | RETIRED | TRANSFERRED" }

  - name: CarveOutAdjustment
    parent: null
    common_fields: false   # id, created_at only — append-only audit event
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> SolarProject.id" }
      - { name: previous_carve_out_pct, type: number, source: system, description: "carve_out_pct before the adjustment" }
      - { name: new_carve_out_pct, type: number, source: input, description: "New carve-out fraction applied to the project", constraints: "0 <= x <= 1" }
      - { name: reason, type: string, source: input, description: "Operator reason for the carve-out change" }

# =============================================================================
# §1.2 State Machine Table  (5 machines: cyclic, parallel, compound, branching)
# =============================================================================
state_machines:
  # -- 1. Enrollment: cyclic (reject → resubmit loop) ------------------------
  - entity: Enrollment
    initial_state: DRAFT
    terminal_states: [ACTIVATED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /enrollments/{id}/submit"
        actor: Subscriber
        preconditions:
          - "Enrollment.status == DRAFT"
          - "SolarProject.status == OPEN (project not FULL) — else ERR_PROJECT_FULL"
          - "requested_share_kw <= SolarProject.available_kw — else ERR_CAPACITY_EXCEEDED"
          - "requested_share_kw * 1000 <= Subscriber.annual_usage_kwh (annual-usage cap) — else ERR_USAGE_CAP_EXCEEDED"
        side_effects:
          - "No capacity is committed yet (commit happens at ACTIVATED)"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /enrollments/{id}/approve"
        actor: ProgramAdmin
        preconditions:
          - "Enrollment.status == SUBMITTED"
          - "If Subscriber.is_low_income: requested_share_kw <= SolarProject.carve_out_available_kw — else ERR_CARVE_OUT_EXCEEDED"
        side_effects:
          - "Enrollment marked APPROVED; capacity still not committed"
      - from: APPROVED
        to: ACTIVATED
        trigger: "POST /enrollments/{id}/activate"
        actor: ProgramAdmin
        preconditions:
          - "Enrollment.status == APPROVED"
          - "requested_share_kw <= SolarProject.available_kw at activation time — else ERR_CAPACITY_EXCEEDED"
          - "If Subscriber.is_low_income: requested_share_kw <= SolarProject.carve_out_available_kw — else ERR_CARVE_OUT_EXCEEDED"
        side_effects:
          - "Create Subscription (status=ACTIVE, share_kw=requested_share_kw, is_carve_out=Subscriber.is_low_income)"
          - "Set Enrollment.subscription_id"
          - "SolarProject.committed_kw += share_kw; recompute available_kw, carve_out_committed_kw, carve_out_available_kw (ledger sync)"
          - "If SolarProject.available_kw == 0 → SolarProject.status = FULL"
          - "increments SolarProject.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /enrollments/{id}/reject"
        actor: ProgramAdmin
        preconditions:
          - "Enrollment.status == SUBMITTED"
        side_effects:
          - "Set Enrollment.rejection_reason"
      - from: APPROVED
        to: REJECTED
        trigger: "POST /enrollments/{id}/reject"
        actor: ProgramAdmin
        preconditions:
          - "Enrollment.status == APPROVED"
        side_effects:
          - "Set Enrollment.rejection_reason"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /enrollments/{id}/submit"
        actor: Subscriber
        preconditions:
          - "Enrollment.status == REJECTED"
          - "SolarProject.status == OPEN — else ERR_PROJECT_FULL"
          - "requested_share_kw <= SolarProject.available_kw — else ERR_CAPACITY_EXCEEDED"
        side_effects:
          - "rejection_reason cleared; enrollment re-enters review (revision loop)"
        note: "Cyclic edge — REJECTED → SUBMITTED makes the enrollment machine non-linear."

  # -- 2. Subscription: cyclic (suspend↔resume) + transfer + cancel ----------
  - entity: Subscription
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /subscriptions/{id}/suspend"
        actor: ProgramAdmin
        preconditions:
          - "Subscription.status == ACTIVE"
        side_effects:
          - "Subscription stops earning new PROVISIONAL allocations from the NEXT OPEN period onward"
          - "share_kw remains counted in SolarProject.committed_kw (still reserved)"
          - "Subscriber.churn_risk_score recomputed (suspend raises risk)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/resume"
        actor: ProgramAdmin
        preconditions:
          - "Subscription.status == SUSPENDED"
        side_effects:
          - "Subscription resumes earning allocations from the next OPEN period"
          - "Subscriber.churn_risk_score recomputed (resume lowers risk)"
        note: "Cyclic edge — ACTIVE↔SUSPENDED loop makes the subscription machine non-linear."
      - from: ACTIVE
        to: TRANSFERRING
        trigger: "POST /subscriptions/{id}/transfer"
        actor: Subscriber
        preconditions:
          - "Subscription.status == ACTIVE"
          - "target Subscriber exists and target.state_code == SolarProject.state_code — else ERR_TRANSFER_JURISDICTION_MISMATCH"
          - "expected_project_version matches SolarProject.version — else ERR_STALE_PROJECT_VERSION"
        side_effects:
          - "Create successor Subscription (status=ACTIVE, subscriber_id=target, share_kw copied, transferred_from_subscription_id=this.id, is_carve_out=target.is_low_income)"
          - "carve_out_committed_kw recomputed because carve-out membership may flip with the new subscriber (ledger sync)"
          - "Original subscription set to TRANSFERRING, then immediately CANCELLED by the system edge below"
          - "increments SolarProject.version by 1"
      - from: TRANSFERRING
        to: CANCELLED
        trigger: "system (completes immediately after successor is ACTIVE)"
        actor: system
        preconditions:
          - "successor Subscription is ACTIVE"
        side_effects:
          - "Original subscription CANCELLED; committed_kw net change is 0 (successor holds the same share_kw)"
          - "cancellation_effective_period_id set to the project's current OPEN period (if any)"
        note: "Transfer loop A→TRANSFERRING→(new ACTIVE)→original CANCELLED; share conserved."
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: Subscriber
        preconditions:
          - "Subscription.status == ACTIVE"
        side_effects:
          - "SolarProject.committed_kw -= share_kw; recompute available_kw, carve_out_committed_kw, carve_out_available_kw (ledger sync)"
          - "If SolarProject.status == FULL and available_kw > 0 → SolarProject.status = OPEN"
          - "cancellation_effective_period_id set to current OPEN period (if any); no new allocations from that period"
          - "Subscriber.churn_risk_score recomputed (cancel sets churn floor)"
          - "increments SolarProject.version by 1"
          - "Auto-promote: oldest QUEUED WaitlistEntry (by queued_at asc, tie-break created_at asc) whose requested_share_kw <= available_kw is PROMOTED, minting an Enrollment (cascade)"
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: Subscriber
        preconditions:
          - "Subscription.status == SUSPENDED"
        side_effects:
          - "Same ledger sync and waitlist auto-promotion as ACTIVE→CANCELLED"
          - "increments SolarProject.version by 1"

  # -- 3. BillingPeriod: compound epoch + reopen cycle -----------------------
  - entity: BillingPeriod
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: METERED
        trigger: "POST /periods/{id}/meter"
        actor: GridOperator
        preconditions:
          - "BillingPeriod.status == OPEN"
          - "metered_production_kwh present and >= 0 — else ERR_METER_READING_REQUIRED"
          - "expected_period_version matches BillingPeriod.version — else ERR_STALE_PERIOD_VERSION"
        side_effects:
          - "distributable_kwh switches from forecast to metered_production_kwh"
          - "Re-run allocation waterfall over eligible subscriptions → each Allocation.allocated_kwh updated, status stays PROVISIONAL"
          - "increments BillingPeriod.version by 1"
      - from: METERED
        to: RECONCILED
        trigger: "POST /periods/{id}/reconcile"
        actor: GridOperator
        preconditions:
          - "BillingPeriod.status == METERED"
          - "expected_period_version matches BillingPeriod.version — else ERR_STALE_PERIOD_VERSION"
        side_effects:
          - "Each Allocation.status PROVISIONAL → FINAL; final_credit_cents computed (cascade depth 1: period→allocation)"
          - "Create one Reconciliation per FINAL Allocation (credit_status=DRAFT, dispute_status=NONE); compute gross/fee/net (cascade depth 2: period→allocation→reconciliation)"
          - "Mint RECBatch (rec_count = floor(metered_production_kwh/1000), status=MINTED); SolarProject.rec_minted_total recomputed (cascade depth 3: period→reconciliation and period→rec_batch→project)"
      - from: RECONCILED
        to: TRUED_UP
        trigger: "POST /periods/{id}/true-up"
        actor: GridOperator
        preconditions:
          - "BillingPeriod.status == RECONCILED"
        side_effects:
          - "Compute overproduction sweep: rollover_kwh, forfeited_kwh, rollover_credit_cents pinned on the period"
      - from: TRUED_UP
        to: CLOSED
        trigger: "POST /periods/{id}/close"
        actor: GridOperator
        preconditions:
          - "BillingPeriod.status == TRUED_UP"
          - "every Reconciliation for this period has dispute_status IN {NONE, RESOLVED} — else ERR_OPEN_DISPUTE_BLOCKS_CLOSE"
        side_effects:
          - "Period locked; CANCELLED subscriptions whose cancellation_effective_period_id == this period stop appearing in future waterfalls"
          - "Subscriber.lifetime_savings_cents recomputed from APPLIED Reconciliations (ledger sync)"
      - from: RECONCILED
        to: METERED
        trigger: "POST /periods/{id}/reopen"
        actor: GridOperator
        preconditions:
          - "BillingPeriod.status == RECONCILED"
          - "no Reconciliation for this period has credit_status == APPLIED — else ERR_RECON_ALREADY_APPLIED"
        side_effects:
          - "All Reconciliations for the period deleted; Allocation.status FINAL → PROVISIONAL; final_credit_cents cleared; minted RECBatch.status set back to nothing (rec_minted_count recomputed at next reconcile)"
        note: "Cyclic edge — RECONCILED → METERED reopen makes the period machine non-linear."

  # -- 4. Reconciliation: PARALLEL dimensions (credit_status × dispute_status)
  - entity: Reconciliation
    initial_state: DRAFT          # credit_status; dispute_status starts NONE in parallel
    terminal_states: [APPLIED]    # terminal on the credit dimension
    transitions:
      # credit_status dimension
      - from: DRAFT
        to: ISSUED
        trigger: "POST /reconciliations/{id}/issue"
        actor: GridOperator
        preconditions:
          - "Reconciliation.credit_status == DRAFT"
          - "linked BillingPeriod.status == RECONCILED"
        side_effects:
          - "On-bill credit posted to the utility account; net_savings_cents frozen"
      - from: ISSUED
        to: APPLIED
        trigger: "POST /reconciliations/{id}/apply"
        actor: GridOperator
        preconditions:
          - "Reconciliation.credit_status == ISSUED"
          - "Reconciliation.dispute_status != DISPUTED — else ERR_DISPUTE_BLOCKS_APPLY"
        side_effects:
          - "Subscriber.lifetime_savings_cents += net_savings_cents; SolarProject.total_net_savings_cents += net_savings_cents (ledger sync)"
      # dispute_status dimension — evolves independently of credit_status
      - from: NONE
        to: DISPUTED
        trigger: "POST /reconciliations/{id}/dispute"
        actor: Subscriber
        preconditions:
          - "Reconciliation.dispute_status == NONE"
          - "Reconciliation.credit_status != APPLIED — else ERR_RECON_ALREADY_APPLIED"
        side_effects:
          - "Subscriber.churn_risk_score recomputed (dispute raises risk)"
        note: "Parallel dimension — dispute_status changes while credit_status may be DRAFT or ISSUED."
      - from: DISPUTED
        to: RESOLVED
        trigger: "POST /reconciliations/{id}/resolve-dispute"
        actor: ProgramAdmin
        preconditions:
          - "Reconciliation.dispute_status == DISPUTED"
        side_effects:
          - "Subscriber.churn_risk_score recomputed (resolution lowers risk)"
          - "credit_status unblocks for apply"

  # -- 5. RECBatch: branching fork-join (ALLOCATED → {RETIRED | TRANSFERRED}) -
  - entity: RECBatch
    initial_state: MINTED
    terminal_states: [RETIRED, TRANSFERRED]
    transitions:
      - from: MINTED
        to: ALLOCATED
        trigger: "POST /rec-batches/{id}/allocate"
        actor: ProgramAdmin
        preconditions:
          - "RECBatch.status == MINTED"
        side_effects:
          - "Batch earmarked for disposition; no ledger change yet"
      - from: ALLOCATED
        to: RETIRED
        trigger: "POST /rec-batches/{id}/retire"
        actor: ProgramAdmin
        preconditions:
          - "RECBatch.status == ALLOCATED"
          - "retirement_beneficiary present — else ERR_REC_BENEFICIARY_REQUIRED"
        side_effects:
          - "SolarProject.rec_retired_total += rec_count; rec_available_balance decreases (branch A side-effect)"
      - from: ALLOCATED
        to: TRANSFERRED
        trigger: "POST /rec-batches/{id}/transfer"
        actor: ProgramAdmin
        preconditions:
          - "RECBatch.status == ALLOCATED"
          - "transfer_counterparty present — else ERR_REC_COUNTERPARTY_REQUIRED"
        side_effects:
          - "SolarProject.rec_available_balance decreases by rec_count; rec_retired_total unchanged (branch B side-effect, divergent from RETIRED)"
        note: "Fork-join: ALLOCATED forks into RETIRED and TRANSFERRED with divergent ledger side-effects."

# =============================================================================
# §1.2.1 Concurrency Rules (true races, OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: transfer-stale-project
    parent_entity: SolarProject
    write_endpoint: "POST /subscriptions/{id}/transfer"
    occ_field: "expected_project_version"
    description: |
      Transferring a Subscription to a new Subscriber legitimately supersedes
      the project's carve-out and committed-capacity accounting. A transfer
      whose expected_project_version is older than SolarProject.version is
      rejected: the project ledger has already advanced (e.g. another
      enrollment activated or another transfer completed), so this client's
      view of carve_out_available_kw is stale and the transfer's carve-out
      revalidation would be computed against an outdated baseline.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
  - rule_id: meter-stale-period
    parent_entity: BillingPeriod
    write_endpoint: "POST /periods/{id}/meter"
    occ_field: "expected_period_version"
    description: |
      Setting a meter reading on a BillingPeriod whose version has advanced
      since the client last read it is rejected. The period's allocation
      waterfall may already have been re-run by a prior meter write that the
      client did not observe, so a second meter write carrying the old
      expected_period_version is operating on a stale distributable pool.
    error_id: ERR_STALE_PERIOD_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table  (6 calculations, 3 dual-variant)
# =============================================================================
calculations:
  # --- allocation waterfall: combinatorial mode (b) nested-rounding order ----
  - name: allocation_distribution
    trigger: "Allocation creation at period OPEN (POST /periods); re-run on BillingPeriod OPEN→METERED"
    algorithm: waterfall_allocation
    formula: |
      pool = BillingPeriod.distributable_kwh   # forecast at OPEN, metered after METERED
      # Eligible subscriptions for a period P:
      #   status == ACTIVE
      #   AND (cancellation_effective_period_id is null
      #        OR BillingPeriod(cancellation_effective_period_id).sequence_index > P.sequence_index)
      # SUSPENDED subscriptions are excluded (earn nothing while suspended).
      eligible = [s for s in Subscriptions if eligible_for(s, P)]
      total_share = sum(s.share_kw for s in eligible)
      if total_share == 0: every allocated_kwh = 0; overproduction_kwh = pool; STOP
      # ROUND-PER-SHARE-THEN-DISTRIBUTE-REMAINDER (pinned order):
      #   1. raw_i    = pool * (s.share_kw / total_share)
      #   2. floor_i  = floor(raw_i)                       # whole kWh per share
      #   3. remainder = pool - sum(floor_i)               # leftover whole kWh
      #   4. distribute remainder one kWh at a time to eligible subscriptions
      #      ordered by descending fractional part (raw_i - floor_i);
      #      tie-break: ascending Subscription.created_at.
      allocated_kwh_i = floor_i (+1 if subscription receives a remainder kWh)
    input_set: "Subscriptions with status==ACTIVE and not yet cancellation-effective for this period; SUSPENDED excluded"
    constants: {}
    precision: "whole kWh; floor per share, integer remainder distributed by fractional part desc then created_at asc"
    variants:
      - name: forecast_basis
        when: "period status OPEN (pool = forecast_production_kwh)"
        difference: "pool is the forecast; produces PROVISIONAL allocations and provisional_credit_cents"
      - name: metered_basis
        when: "period status METERED onward (pool = metered_production_kwh)"
        difference: "pool is the metered reading; re-runs the waterfall and feeds final_credit_cents at RECONCILED"

  # --- bill credit dual variant: provisional vs final (Allocation domain) ----
  - name: bill_credit_provisional_vs_final
    trigger: "provisional_credit_cents at Allocation creation (period OPEN); final_credit_cents at BillingPeriod METERED→RECONCILED"
    algorithm: forward_looking
    formula: |
      provisional_credit_cents = allocation.allocated_kwh(forecast basis) * project.credit_rate_cents_per_kwh
      final_credit_cents       = allocation.allocated_kwh(metered basis)  * project.credit_rate_cents_per_kwh
    input_set: "One credit pair per Allocation; provisional uses forecast-basis allocated_kwh, final uses metered-basis allocated_kwh"
    constants: {}
    precision: "integer cents (allocated_kwh and credit_rate_cents_per_kwh are both integers)"
    variants:
      - name: provisional
        when: "period OPEN, before metering"
        difference: "uses forecast-basis allocated_kwh; subject to revision"
      - name: final
        when: "period RECONCILED"
        difference: "uses metered-basis allocated_kwh; frozen and fed to Reconciliation.gross_credit_cents"

  # --- monthly savings reconciliation: combinatorial mode (a) tiered fee ------
  - name: monthly_savings_reconciliation
    trigger: "Reconciliation creation at BillingPeriod METERED→RECONCILED"
    algorithm: tiered_pricing
    formula: |
      gross = allocation.final_credit_cents
      # Tiered program fee on gross (>= 3 inputs: gross, base rate, carve-out flag, tier table):
      #   base_rate = subscription.is_carve_out ? CARVE_OUT_FEE_RATE : project.program_fee_rate
      #   tier multiplier m selected on gross:
      #     gross <= TIER1_CENTS                       -> m = 1.00
      #     TIER1_CENTS < gross <= TIER2_CENTS         -> m = 0.90   (volume discount)
      #     gross > TIER2_CENTS                        -> m = 0.80
      #   program_fee_cents = round_half_up(gross * base_rate * m)   # single final rounding
      net_savings_cents = gross - program_fee_cents
    input_set: "One Reconciliation per FINAL Allocation of the period"
    constants:
      CARVE_OUT_FEE_RATE: 0.05
      TIER1_CENTS: 5000
      TIER2_CENTS: 20000
    precision: "round_half_up to whole cents, single rounding on the fee"

  # --- churn risk score dual variant: snapshot vs trailing (Subscriber domain)
  - name: churn_risk_score
    trigger: "recomputed on suspend, resume, cancel, dispute, resolve-dispute"
    algorithm: weighted_scoring
    formula: |
      # Weighted 0..100 score; snapshot uses current flags, trailing adds cancel history.
      base = 0
      base += W_SUSPENDED        if subscriber has any Subscription currently SUSPENDED
      base += W_OPEN_DISPUTE     if subscriber has any Reconciliation dispute_status == DISPUTED
      base += W_LOW_INCOME       if subscriber.is_low_income
      score = min(100, base)
    input_set: "Subscriber's own subscriptions and reconciliations"
    constants:
      W_SUSPENDED: 40
      W_OPEN_DISPUTE: 35
      W_LOW_INCOME: 10
      W_RECENT_CANCEL: 50
    precision: "integer 0..100, capped at 100"
    variants:
      - name: snapshot
        when: "default read; reflects current SUSPENDED / open-dispute / low-income flags only"
        difference: "ignores history; W_RECENT_CANCEL not applied"
      - name: trailing
        when: "subscriber has a Subscription cancelled within the last 3 CLOSED periods"
        difference: "adds W_RECENT_CANCEL (50) to base before the min(100, .) cap"

  # --- true-up overproduction: combinatorial mode (c) circular eval order -----
  - name: trueup_overproduction
    trigger: "BillingPeriod RECONCILED→TRUED_UP (POST /periods/{id}/true-up)"
    algorithm: threshold
    formula: |
      overproduction_kwh = period.distributable_kwh - period.allocated_kwh_total   # residual after waterfall
      # Circular-looking dependency pinned by evaluation order:
      #   rollover_kwh depends on a cap that itself depends on committed capacity,
      #   and rollover_credit_cents depends on rollover_kwh — evaluate in THIS order:
      #   (1) cap = min(ROLLOVER_CAP_KWH, ceil(project.committed_kw * CAP_KWH_PER_KW))
      #   (2) rollover_kwh = min(overproduction_kwh, cap)
      #   (3) forfeited_kwh = overproduction_kwh - rollover_kwh
      #   (4) rollover_credit_cents = rollover_kwh * project.credit_rate_cents_per_kwh
    input_set: "Single BillingPeriod's residual; cap derived from project.committed_kw at true-up time"
    constants:
      ROLLOVER_CAP_KWH: 2000
      CAP_KWH_PER_KW: 50
    precision: "whole kWh and integer cents; ceil on the cap term, no intermediate rounding elsewhere"

  # --- REC minting: aggregation/threshold -----------------------------------
  - name: rec_minting
    trigger: "RECBatch mint at BillingPeriod METERED→RECONCILED"
    algorithm: aggregation
    formula: |
      rec_count = floor(period.metered_production_kwh / KWH_PER_REC)
      project.rec_minted_total = sum(rec_count over RECBatches whose period is RECONCILED/TRUED_UP/CLOSED)
      project.rec_available_balance = rec_minted_total - rec_retired_total
                                      - sum(rec_count over RECBatches in status TRANSFERRED)
    input_set: "RECBatches of the project whose period is in status RECONCILED, TRUED_UP, or CLOSED"
    constants:
      KWH_PER_REC: 1000
    precision: "whole RECs, floor"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted to perform this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every resource id in the path exists (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "Every FK in the request body references an existing resource (project_id, subscriber_id, target_subscriber_id)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "create/transfer endpoints"

  - priority: 5
    category: existence
    check: "Required body fields present and well-typed (e.g. requested_share_kw, metered_production_kwh, period_month)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all write endpoints

  - priority: 6
    category: business_constraint
    check: "Field value within allowed range (carve_out_pct in [0,1], share/usage non-negative)"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "POST /projects, POST /subscribers, POST /enrollments, POST /projects/{id}/carve-out-adjustments"

  - priority: 7
    category: business_constraint
    check: "Subscriber.utility_account_no is unique; BillingPeriod.period_month unique per project"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /subscribers, POST /periods"

  - priority: 8
    category: state
    check: "Target resource is in a state from which the requested transition is defined in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 9
    category: business_temporal
    check: "OCC: expected_<parent>_version matches the parent's current version (project on transfer, period on meter/reconcile)"
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /subscriptions/{id}/transfer (project); POST /periods/{id}/meter and POST /periods/{id}/reconcile use ERR_STALE_PERIOD_VERSION"

  - priority: 10
    category: business_safety
    check: "Low-income carve-out reservation not breached: a low-income activation must fit carve_out_available_kw"
    error_id: ERR_CARVE_OUT_EXCEEDED
    http_status: 409
    applies_to: "POST /enrollments/{id}/approve, POST /enrollments/{id}/activate"

  - priority: 11
    category: business_temporal
    check: "Transfer target Subscriber.state_code matches SolarProject.state_code"
    error_id: ERR_TRANSFER_JURISDICTION_MISMATCH
    http_status: 409
    applies_to: "POST /subscriptions/{id}/transfer"

  - priority: 12
    category: business_constraint
    check: "Annual-usage cap: requested_share_kw * 1000 <= Subscriber.annual_usage_kwh"
    error_id: ERR_USAGE_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /enrollments/{id}/submit"

  - priority: 13
    category: business_fiscal
    check: "Capacity availability: requested_share_kw <= SolarProject.available_kw at submit and at activate"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /enrollments/{id}/submit, POST /enrollments/{id}/activate"

  - priority: 14
    category: business_constraint
    check: "Project FULL gate: enrollment submit rejected while SolarProject.status == FULL"
    error_id: ERR_PROJECT_FULL
    http_status: 409
    applies_to: "POST /enrollments/{id}/submit"

  - priority: 15
    category: state
    check: "Dispute gate on apply: a Reconciliation with dispute_status == DISPUTED cannot be APPLIED"
    error_id: ERR_DISPUTE_BLOCKS_APPLY
    http_status: 409
    applies_to: "POST /reconciliations/{id}/apply"

  - priority: 16
    category: state
    check: "Open-dispute gate on close: a period cannot CLOSE while any of its Reconciliations is DISPUTED"
    error_id: ERR_OPEN_DISPUTE_BLOCKS_CLOSE
    http_status: 409
    applies_to: "POST /periods/{id}/close"

  - priority: 17
    category: state
    check: "Reopen/dispute guard: a period cannot reopen, and a reconciliation cannot be disputed, once that reconciliation has credit_status == APPLIED"
    error_id: ERR_RECON_ALREADY_APPLIED
    http_status: 409
    applies_to: "POST /periods/{id}/reopen, POST /reconciliations/{id}/dispute"

  - priority: 18
    category: existence
    check: "Meter reading required and >= 0 when metering"
    error_id: ERR_METER_READING_REQUIRED
    http_status: 400
    applies_to: "POST /periods/{id}/meter"

  - priority: 19
    category: business_constraint
    check: "REC retire requires retirement_beneficiary; REC transfer requires transfer_counterparty"
    error_id: ERR_REC_BENEFICIARY_REQUIRED
    http_status: 400
    applies_to: "POST /rec-batches/{id}/retire (counterpart ERR_REC_COUNTERPARTY_REQUIRED on transfer)"

# =============================================================================
# §1.5 API Endpoint Table  (32 endpoints)
# =============================================================================
endpoints:
  # ---- SolarProject ----
  - method: POST
    path: "/projects"
    description: "Create a solar project / garden"
    roles: [GridOperator]
    code: 201
    input: [name, state_code, nameplate_capacity_kw, "carve_out_pct?", credit_rate_cents_per_kwh, "program_fee_rate?"]
    output: SolarProject
    side_effects: ["status=OPEN; committed_kw=0; rec balances=0; available_kw=nameplate_capacity_kw"]

  - method: GET
    path: "/projects/{id}"
    description: "Get a project with all derived ledger fields (committed/available kW, REC balances, total net savings)"
    roles: [GridOperator, ProgramAdmin, Subscriber]
    code: 200
    input: []
    output: SolarProject
    side_effects: []

  - method: POST
    path: "/projects/{id}/carve-out-adjustments"
    description: "Adjust a project's low-income carve-out percentage"
    roles: [ProgramAdmin]
    code: 201
    input: [new_carve_out_pct, reason]
    output: CarveOutAdjustment
    side_effects: ["SolarProject.carve_out_pct updated; carve_out_available_kw recomputed; increments SolarProject.version by 1"]

  - method: GET
    path: "/projects/{id}/carve-out-adjustments"
    description: "List carve-out adjustments for a project (sub-resource reverse-reachability for CarveOutAdjustment.project_id)"
    roles: [GridOperator, ProgramAdmin]
    code: 200
    input: []
    output: CarveOutAdjustment[]
    side_effects: []

  # ---- Subscriber ----
  - method: POST
    path: "/subscribers"
    description: "Register a utility subscriber"
    roles: [ProgramAdmin]
    code: 201
    input: [full_name, utility_account_no, state_code, "is_low_income?", annual_usage_kwh]
    output: Subscriber
    side_effects: ["churn_risk_score initialized; lifetime_savings_cents=0"]

  - method: GET
    path: "/subscribers/{id}"
    description: "Get a subscriber with computed churn_risk_score and lifetime_savings_cents"
    roles: [GridOperator, ProgramAdmin, Subscriber]
    code: 200
    input: []
    output: Subscriber
    side_effects: []

  # ---- Enrollment ----
  - method: POST
    path: "/enrollments"
    description: "Create a DRAFT enrollment"
    roles: [Subscriber, ProgramAdmin]
    code: 201
    input: [project_id, subscriber_id, requested_share_kw]
    output: Enrollment
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/enrollments"
    description: "List enrollments, filterable by project, subscriber, or subscription (reverse-reachability for Enrollment.project_id, .subscriber_id, .subscription_id)"
    roles: [GridOperator, ProgramAdmin, Subscriber]
    code: 200
    input: ["project_id?", "subscriber_id?", "subscription_id?"]
    output: Enrollment[]
    side_effects: []

  - method: GET
    path: "/enrollments/{id}"
    description: "Get an enrollment"
    roles: [GridOperator, ProgramAdmin, Subscriber]
    code: 200
    input: []
    output: Enrollment
    side_effects: []

  - method: POST
    path: "/enrollments/{id}/submit"
    description: "Submit a DRAFT or resubmit a REJECTED enrollment"
    roles: [Subscriber]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["status DRAFT|REJECTED → SUBMITTED; capacity/usage/full gates enforced"]

  - method: POST
    path: "/enrollments/{id}/approve"
    description: "Approve a SUBMITTED enrollment"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["status → APPROVED; carve-out gate for low-income"]

  - method: POST
    path: "/enrollments/{id}/reject"
    description: "Reject a SUBMITTED or APPROVED enrollment"
    roles: [ProgramAdmin]
    code: 200
    input: [rejection_reason]
    output: Enrollment
    side_effects: ["status → REJECTED; rejection_reason set"]

  - method: POST
    path: "/enrollments/{id}/activate"
    description: "Activate an APPROVED enrollment into a Subscription"
    roles: [ProgramAdmin]
    code: 201
    input: []
    output: Subscription
    side_effects: ["create Subscription ACTIVE; commit share_kw; recompute project ledger; FULL if available_kw==0; increments SolarProject.version by 1"]

  # ---- Subscription ----
  - method: GET
    path: "/subscriptions"
    description: "List subscriptions, filterable by project, subscriber, enrollment, transfer-origin, or cancellation period (reverse-reachability for Subscription.project_id, .subscriber_id, .enrollment_id, .transferred_from_subscription_id, .cancellation_effective_period_id)"
    roles: [GridOperator, ProgramAdmin, Subscriber]
    code: 200
    input: ["project_id?", "subscriber_id?", "enrollment_id?", "transferred_from_subscription_id?", "cancellation_effective_period_id?"]
    output: Subscription[]
    side_effects: []

  - method: GET
    path: "/subscriptions/{id}"
    description: "Get a subscription"
    roles: [GridOperator, ProgramAdmin, Subscriber]
    code: 200
    input: []
    output: Subscription
    side_effects: []

  - method: POST
    path: "/subscriptions/{id}/suspend"
    description: "Suspend an ACTIVE subscription"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: ["status → SUSPENDED; churn_risk_score recomputed"]

  - method: POST
    path: "/subscriptions/{id}/resume"
    description: "Resume a SUSPENDED subscription"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: ["status → ACTIVE; churn_risk_score recomputed"]

  - method: POST
    path: "/subscriptions/{id}/transfer"
    description: "Transfer a subscription's share to another subscriber (OCC on project version)"
    roles: [Subscriber]
    code: 201
    input: [target_subscriber_id, expected_project_version]
    output: Subscription
    side_effects: ["successor Subscription ACTIVE; original → TRANSFERRING → CANCELLED; carve_out recompute; increments SolarProject.version by 1"]

  - method: POST
    path: "/subscriptions/{id}/cancel"
    description: "Cancel an ACTIVE or SUSPENDED subscription"
    roles: [Subscriber]
    code: 200
    input: []
    output: Subscription
    side_effects: ["status → CANCELLED; release committed_kw; FULL→OPEN if room; auto-promote oldest fitting WaitlistEntry; churn_risk_score recomputed; increments SolarProject.version by 1"]

  # ---- WaitlistEntry ----
  - method: POST
    path: "/waitlist-entries"
    description: "Queue for capacity on a FULL project"
    roles: [Subscriber, ProgramAdmin]
    code: 201
    input: [project_id, subscriber_id, requested_share_kw]
    output: WaitlistEntry
    side_effects: ["status=QUEUED; queued_at stamped"]

  - method: GET
    path: "/waitlist-entries"
    description: "List waitlist entries, filterable by project, subscriber, or promoted enrollment (reverse-reachability for WaitlistEntry.project_id, .subscriber_id, .promoted_enrollment_id)"
    roles: [GridOperator, ProgramAdmin, Subscriber]
    code: 200
    input: ["project_id?", "subscriber_id?", "promoted_enrollment_id?"]
    output: WaitlistEntry[]
    side_effects: []

  - method: GET
    path: "/waitlist-entries/{id}"
    description: "Get a waitlist entry"
    roles: [GridOperator, ProgramAdmin, Subscriber]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: []

  - method: POST
    path: "/waitlist-entries/{id}/withdraw"
    description: "Withdraw a QUEUED waitlist entry"
    roles: [Subscriber]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: ["status QUEUED → WITHDRAWN"]

  # ---- BillingPeriod ----
  - method: POST
    path: "/periods"
    description: "Open a billing period for a project; distributes provisional allocations from forecast"
    roles: [GridOperator]
    code: 201
    input: [project_id, period_month, forecast_production_kwh]
    output: BillingPeriod
    side_effects: ["status=OPEN; assign sequence_index; run allocation waterfall (forecast basis); create Allocation per eligible subscription (PROVISIONAL)"]

  - method: GET
    path: "/periods"
    description: "List billing periods, filterable by project (reverse-reachability for BillingPeriod.project_id)"
    roles: [GridOperator, ProgramAdmin, Subscriber]
    code: 200
    input: ["project_id?"]
    output: BillingPeriod[]
    side_effects: []

  - method: GET
    path: "/periods/{id}"
    description: "Get a billing period with computed distributable/allocated/overproduction/rollover"
    roles: [GridOperator, ProgramAdmin, Subscriber]
    code: 200
    input: []
    output: BillingPeriod
    side_effects: []

  - method: POST
    path: "/periods/{id}/meter"
    description: "Set metered production and re-run the allocation waterfall (OCC on period version)"
    roles: [GridOperator]
    code: 200
    input: [metered_production_kwh, expected_period_version]
    output: BillingPeriod
    side_effects: ["status OPEN→METERED; distributable switches to metered; allocations re-run; increments BillingPeriod.version by 1"]

  - method: POST
    path: "/periods/{id}/reconcile"
    description: "Finalize allocations, credits, reconciliations and mint RECs (OCC on period version)"
    roles: [GridOperator]
    code: 200
    input: [expected_period_version]
    output: BillingPeriod
    side_effects: ["status METERED→RECONCILED; Allocation→FINAL; final_credit_cents set; create Reconciliations; mint RECBatch; recompute project rec totals"]

  - method: POST
    path: "/periods/{id}/true-up"
    description: "Sweep overproduction into rollover/forfeit on the period"
    roles: [GridOperator]
    code: 200
    input: []
    output: BillingPeriod
    side_effects: ["status RECONCILED→TRUED_UP; rollover_kwh/forfeited_kwh/rollover_credit_cents pinned"]

  - method: POST
    path: "/periods/{id}/reopen"
    description: "Reopen a RECONCILED period back to METERED (voids reconciliations)"
    roles: [GridOperator]
    code: 200
    input: []
    output: BillingPeriod
    side_effects: ["status RECONCILED→METERED; delete Reconciliations; Allocation→PROVISIONAL; final_credit_cents cleared"]

  - method: POST
    path: "/periods/{id}/close"
    description: "Close a TRUED_UP period"
    roles: [GridOperator]
    code: 200
    input: []
    output: BillingPeriod
    side_effects: ["status TRUED_UP→CLOSED (blocked by open disputes); recompute lifetime_savings_cents"]

  # ---- Allocation ----
  - method: GET
    path: "/allocations"
    description: "List allocations, filterable by period or subscription (reverse-reachability for Allocation.period_id and .subscription_id)"
    roles: [GridOperator, ProgramAdmin, Subscriber]
    code: 200
    input: ["period_id?", "subscription_id?"]
    output: Allocation[]
    side_effects: []

  - method: GET
    path: "/allocations/{id}"
    description: "Get an allocation with provisional/final credit cents"
    roles: [GridOperator, ProgramAdmin, Subscriber]
    code: 200
    input: []
    output: Allocation
    side_effects: []

  # ---- Reconciliation ----
  - method: GET
    path: "/reconciliations"
    description: "List reconciliations, filterable by subscription, period, or allocation (reverse-reachability for Reconciliation.subscription_id, .period_id, .allocation_id)"
    roles: [GridOperator, ProgramAdmin, Subscriber]
    code: 200
    input: ["subscription_id?", "period_id?", "allocation_id?"]
    output: Reconciliation[]
    side_effects: []

  - method: GET
    path: "/reconciliations/{id}"
    description: "Get a reconciliation with gross/fee/net savings and both status dimensions"
    roles: [GridOperator, ProgramAdmin, Subscriber]
    code: 200
    input: []
    output: Reconciliation
    side_effects: []

  - method: POST
    path: "/reconciliations/{id}/issue"
    description: "Issue (post on-bill) a DRAFT reconciliation"
    roles: [GridOperator]
    code: 200
    input: []
    output: Reconciliation
    side_effects: ["credit_status DRAFT→ISSUED"]

  - method: POST
    path: "/reconciliations/{id}/apply"
    description: "Apply an ISSUED reconciliation to lifetime savings (blocked by dispute)"
    roles: [GridOperator]
    code: 200
    input: []
    output: Reconciliation
    side_effects: ["credit_status ISSUED→APPLIED; lifetime_savings_cents and project total_net_savings_cents increased"]

  - method: POST
    path: "/reconciliations/{id}/dispute"
    description: "Raise a dispute on a reconciliation (dispute dimension)"
    roles: [Subscriber]
    code: 200
    input: []
    output: Reconciliation
    side_effects: ["dispute_status NONE→DISPUTED; churn_risk_score recomputed"]

  - method: POST
    path: "/reconciliations/{id}/resolve-dispute"
    description: "Resolve a disputed reconciliation"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Reconciliation
    side_effects: ["dispute_status DISPUTED→RESOLVED; churn_risk_score recomputed"]

  # ---- RECBatch ----
  - method: GET
    path: "/rec-batches"
    description: "List REC batches, filterable by project or period (reverse-reachability for RECBatch.project_id and .period_id)"
    roles: [GridOperator, ProgramAdmin]
    code: 200
    input: ["project_id?", "period_id?"]
    output: RECBatch[]
    side_effects: []

  - method: GET
    path: "/rec-batches/{id}"
    description: "Get a REC batch"
    roles: [GridOperator, ProgramAdmin]
    code: 200
    input: []
    output: RECBatch
    side_effects: []

  - method: POST
    path: "/rec-batches/{id}/allocate"
    description: "Earmark a MINTED REC batch for disposition"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: RECBatch
    side_effects: ["status MINTED→ALLOCATED"]

  - method: POST
    path: "/rec-batches/{id}/retire"
    description: "Retire an ALLOCATED REC batch to a beneficiary"
    roles: [ProgramAdmin]
    code: 200
    input: [retirement_beneficiary]
    output: RECBatch
    side_effects: ["status ALLOCATED→RETIRED; project.rec_retired_total += rec_count"]

  - method: POST
    path: "/rec-batches/{id}/transfer"
    description: "Transfer an ALLOCATED REC batch to a counterparty"
    roles: [ProgramAdmin]
    code: 200
    input: [transfer_counterparty]
    output: RECBatch
    side_effects: ["status ALLOCATED→TRANSFERRED; project.rec_available_balance decreases by rec_count"]

# =============================================================================
# §1.6 Error Code Catalog  (24 errors)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a known role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Resource id in path does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 404, condition: "A FK in the request body references a missing resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing or malformed required body field" }
  - { id: ERR_VALIDATION, http: 422, condition: "Field value out of allowed range (carve_out_pct outside [0,1], negative share/usage)" }
  - { id: ERR_DUPLICATE_RESOURCE, http: 409, condition: "utility_account_no not unique, or period_month duplicated for the project" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which this transition is defined" }
  - { id: ERR_STALE_PROJECT_VERSION, http: 412, condition: "expected_project_version does not match SolarProject.version (transfer)" }
  - { id: ERR_STALE_PERIOD_VERSION, http: 412, condition: "expected_period_version does not match BillingPeriod.version (meter/reconcile)" }
  - { id: ERR_PROJECT_FULL, http: 409, condition: "Enrollment submit attempted while SolarProject.status == FULL" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 409, condition: "requested_share_kw exceeds SolarProject.available_kw at submit or activate" }
  - { id: ERR_CARVE_OUT_EXCEEDED, http: 409, condition: "Low-income activation/approval exceeds carve_out_available_kw" }
  - { id: ERR_USAGE_CAP_EXCEEDED, http: 409, condition: "requested_share_kw * 1000 exceeds Subscriber.annual_usage_kwh" }
  - { id: ERR_TRANSFER_JURISDICTION_MISMATCH, http: 409, condition: "Transfer target Subscriber.state_code != SolarProject.state_code" }
  - { id: ERR_METER_READING_REQUIRED, http: 400, condition: "metered_production_kwh missing or negative on meter" }
  - { id: ERR_DISPUTE_BLOCKS_APPLY, http: 409, condition: "Reconciliation apply attempted while dispute_status == DISPUTED" }
  - { id: ERR_OPEN_DISPUTE_BLOCKS_CLOSE, http: 409, condition: "Period close attempted while a Reconciliation is DISPUTED" }
  - { id: ERR_RECON_ALREADY_APPLIED, http: 409, condition: "Reopen or dispute attempted after a Reconciliation reached credit_status == APPLIED" }
  - { id: ERR_REC_BENEFICIARY_REQUIRED, http: 400, condition: "REC retire missing retirement_beneficiary" }
  - { id: ERR_REC_COUNTERPARTY_REQUIRED, http: 400, condition: "REC transfer missing transfer_counterparty" }
  - { id: ERR_WAITLIST_NOT_QUEUED, http: 409, condition: "Withdraw attempted on a waitlist entry not in QUEUED" }
  - { id: ERR_IMMUTABLE_RESOURCE, http: 409, condition: "Transition/update attempted on a common_fields:false append-only resource" }
  - { id: ERR_PAGINATION_INVALID, http: 400, condition: "limit/offset outside allowed bounds" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: GridOperator
    description: "Utility/grid operator that owns projects, billing periods, metering, reconciliation issuance and REC minting epoch"
    identity: "opaque"
    exclusive_operations:
      - "POST /projects — create project"
      - "POST /periods — open billing period"
      - "POST /periods/{id}/meter — set metered production"
      - "POST /periods/{id}/reconcile — finalize period"
      - "POST /periods/{id}/true-up — sweep overproduction"
      - "POST /periods/{id}/reopen — reopen period"
      - "POST /periods/{id}/close — close period"
      - "POST /reconciliations/{id}/issue — post on-bill credit"
      - "POST /reconciliations/{id}/apply — apply credit to lifetime savings"
    shared_operations:
      - "GET on projects, subscribers, periods, subscriptions, enrollments, allocations, reconciliations, rec-batches"

  - name: ProgramAdmin
    description: "Program administrator handling enrollment review, carve-out config, waitlist, dispute resolution and REC disposition"
    identity: "opaque"
    exclusive_operations:
      - "POST /subscribers — register subscriber"
      - "POST /projects/{id}/carve-out-adjustments — change carve-out pct"
      - "POST /enrollments/{id}/approve — approve enrollment"
      - "POST /enrollments/{id}/reject — reject enrollment"
      - "POST /enrollments/{id}/activate — activate into subscription"
      - "POST /subscriptions/{id}/suspend — suspend subscription"
      - "POST /subscriptions/{id}/resume — resume subscription"
      - "POST /reconciliations/{id}/resolve-dispute — resolve dispute"
      - "POST /rec-batches/{id}/allocate — earmark REC batch"
      - "POST /rec-batches/{id}/retire — retire REC batch"
      - "POST /rec-batches/{id}/transfer — transfer REC batch"
    shared_operations:
      - "POST /enrollments — create enrollment (shared with Subscriber)"
      - "POST /waitlist-entries — queue (shared with Subscriber)"
      - "GET reads shared with GridOperator and Subscriber"

  - name: Subscriber
    description: "Utility customer acting on their own enrollments, subscriptions, transfers, cancellations, waitlist and disputes"
    identity: "entity_backed:Subscriber"
    exclusive_operations:
      - "POST /enrollments/{id}/submit — submit/resubmit own enrollment"
      - "POST /subscriptions/{id}/transfer — transfer own subscription"
      - "POST /subscriptions/{id}/cancel — cancel own subscription"
      - "POST /waitlist-entries/{id}/withdraw — withdraw own waitlist entry"
      - "POST /reconciliations/{id}/dispute — dispute own reconciliation"
    shared_operations:
      - "POST /enrollments — create own enrollment (shared with ProgramAdmin)"
      - "POST /waitlist-entries — queue (shared with ProgramAdmin)"
      - "GET reads of own resources (projects, subscriptions, enrollments, reconciliations, allocations, etc.)"
