      - call: POST /api/device-episodes
        payload:
          patient_id: ${pat_id}
          device_type: CENTRAL_LINE
          placed_at: '2026-08-01T10:00:00Z'
        as: UnitNurseManager
        captures:
          ep_1: $.data.id
      - call: POST /api/infection-cases
        payload:
          patient_id: ${pat_id}
          case_type: CLABSI
          suspected_organism: E. coli
          first_positive_specimen_at: '2026-08-05T09:00:00Z'
          linked_device_episode_id: ${ep_1}
        as: InfectionPreventionist
        captures:
          case_1: $.data.id
      - call: POST /api/infection-cases/${case_1}/begin-review
        payload: {}
        as: InfectionPreventionist
      - call: POST /api/infection-cases/${case_1}/adjudicate
        payload:
          outcome: ADJUDICATED_HAI
          date_of_event: '2026-08-05T00:00:00Z'
          rationale: index case confirmed ok
        as: InfectionPreventionist
      - call: POST /api/device-episodes/${ep_1}/remove
        payload:
          removed_at: '2026-08-10T10:00:00Z'
        as: UnitNurseManager
      - call: POST /api/device-episodes
        payload:
          patient_id: ${pat_id}
          device_type: CENTRAL_LINE
          placed_at: '2026-08-10T10:00:01Z'
        as: UnitNurseManager
        captures:
          ep_2: $.data.id
      trigger:
      - call: POST /api/infection-cases
        payload:
          patient_id: ${pat_id}
          case_type: CLABSI
          suspected_organism: E. coli
          first_positive_specimen_at: '2026-08-18T09:00:00Z'
          linked_device_episode_id: ${ep_2}
        as: InfectionPreventionist
        captures:
          err1: $.data.error_id
      - call: POST /api/infection-cases
        payload:
