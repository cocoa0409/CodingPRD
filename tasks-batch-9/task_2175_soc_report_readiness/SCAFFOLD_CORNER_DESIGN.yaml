        claim_type: role_denial
        grounds: ["roles.ControlOwner", "validations[priority=30]", "errors[ERR_ROLE_NOT_PERMITTED]"]
        distinguishing_aspect: "POST /soc/controls is a ComplianceLead exclusive operation; a ControlOwner attempting it gets 403 ERR_ROLE_NOT_PERMITTED and no Control row is stored."
        test_recipe:
          setup:
            - "One engagement in SCOPING with no controls."
          setup_api_calls:
            - call: "POST /soc/engagements"
              payload: { client_name: "Peer Roles", report_type: "SOC_2_TYPE_2", observation_period_start: "2026-09-01T00:00:00.000Z", observation_period_end: "2026-11-30T00:00:00.000Z", required_criteria_categories: ["SECURITY"] }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { eng: $.data.id }
          trigger:
            - call: "POST /soc/controls"
              payload: { engagement_id: "${eng}", control_ref: "X-99", title: "Sneaky control", frequency: "MONTHLY" }
              as: ControlOwner
              as_user_id: "own-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "${err} == ERR_ROLE_NOT_PERMITTED"
            - "GET /soc/controls?engagement_id=${eng} returns total_count == 0"

      - name: corner_auditor_cannot_create_criteria_mappings_or_engagements
        claim_type: role_denial
        grounds: ["roles.Auditor", "roles.ComplianceLead", "errors[ERR_ROLE_NOT_PERMITTED]"]
        distinguishing_aspect: "Mapping criteria and opening engagements are ComplianceLead exclusives; the Auditor who may approve control design is still denied both with 403 ERR_ROLE_NOT_PERMITTED, which is the segregation-of-duties split between preparer and examiner."
        test_recipe:
          setup:
            - "One engagement, one control and one criterion exist."
          setup_api_calls:
            - call: "POST /soc/trust-criteria"
              payload: { criterion_code: "CC1.1", category: "SECURITY", title: "Control environment", min_primary_controls: 1, applies_to_report_types: ["SOC_2_TYPE_2"] }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { cc: $.data.id }
            - call: "POST /soc/engagements"
              payload: { client_name: "Split Duties", report_type: "SOC_2_TYPE_2", observation_period_start: "2026-09-01T00:00:00.000Z", observation_period_end: "2026-11-30T00:00:00.000Z", required_criteria_categories: ["SECURITY"] }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { eng: $.data.id }
            - call: "POST /soc/controls"
              payload: { engagement_id: "${eng}", control_ref: "K-01", title: "Access provisioning", frequency: "MONTHLY" }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { k: $.data.id }
          trigger:
            - call: "POST /soc/criteria-mappings"
              payload: { control_id: "${k}", trust_criterion_id: "${cc}", mapping_type: "PRIMARY" }
