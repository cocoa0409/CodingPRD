scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: fare_variant_divergence_on_partly_flown_itinerary
        grounds:
          - calculations.fare_refund_entitlement
          - entities.Booking.fields.total_refund_obligated_cents
          - entities.Booking.fields.unused_segment_count
          - endpoints[GET /compliance/bookings/{id}/refund-exposure]
        distinguishing_aspect: |
          The dual variant lives on the Booking fare domain: PROACTIVE_FULL_ITINERARY sums the
          un-flown segments' own fares (80000) while REQUEST_BASED_UNUSED_PRORATION prorates the
          total fare evenly across all three segments and pays two shares (66666), so the same
          booking yields a 13334-cent divergence.
        test_recipe:
          setup:
            - "One PolicyProfile with regulatory defaults, one Passenger, one Booking of 100000 cents paid by CREDIT_CARD."
            - "Three domestic segments priced unevenly at 20000 / 40000 / 40000 cents."
            - "Segment 1 has DEPARTED, so travel_commenced = true and unused_segment_count = 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T18:00:00Z" }
              as: ComplianceAdmin
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /compliance/passengers"
              payload: { email: "pat.dual@example.com", full_name: "Pat Dual" }
              as: ComplianceAdmin
              captures: { pax_id: $.data.id }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "ABC123", total_fare_cents: 100000, payment_method: "CREDIT_CARD" }
              as: ComplianceAdmin
              captures: { bkg_id: $.data.id }
            - call: "POST /compliance/bookings/${bkg_id}/flight-segments"
              payload: { sequence_index: 1, flight_number: "ZQ101", origin_iata: "LAX", destination_iata: "DEN", is_international: false, scheduled_departure_utc: "2026-08-10T14:00:00Z", scheduled_arrival_utc: "2026-08-10T17:00:00Z", segment_fare_cents: 20000 }
              as: OpsController
              captures: { seg1_id: $.data.id }
            - call: "POST /compliance/bookings/${bkg_id}/flight-segments"
              payload: { sequence_index: 2, flight_number: "ZQ202", origin_iata: "DEN", destination_iata: "ORD", is_international: false, scheduled_departure_utc: "2026-08-10T18:30:00Z", scheduled_arrival_utc: "2026-08-10T21:00:00Z", segment_fare_cents: 40000 }
              as: OpsController
              captures: { seg2_id: $.data.id }
            - call: "POST /compliance/bookings/${bkg_id}/flight-segments"
              payload: { sequence_index: 3, flight_number: "ZQ303", origin_iata: "ORD", destination_iata: "BOS", is_international: false, scheduled_departure_utc: "2026-08-11T13:00:00Z", scheduled_arrival_utc: "2026-08-11T16:00:00Z", segment_fare_cents: 40000 }
              as: OpsController
              captures: { seg3_id: $.data.id }
            - call: "POST /compliance/flight-segments/${seg1_id}/record-operation"
              payload: { operation: "DEPARTED", occurred_at_utc: "2026-08-10T14:10:00Z" }
              as: OpsController
          trigger:
            - call: "GET /compliance/bookings/${bkg_id}/refund-exposure"
              payload: {}
              as: ComplianceOfficer
              captures: { proactive_cents: $.data.proactive_full_itinerary_cents, request_based_cents: $.data.request_based_proration_cents }
          assert:
            - "GET /compliance/bookings/${bkg_id}/refund-exposure -> data.proactive_full_itinerary_cents == 80000"
            - "GET /compliance/bookings/${bkg_id}/refund-exposure -> data.request_based_proration_cents == 66666"
            - "GET /compliance/bookings/${bkg_id}/refund-exposure -> data.variant_delta_cents == 13334"
            - "GET /compliance/bookings/${bkg_id}/refund-exposure -> data.segment_count == 3 and data.unused_segment_count == 2 and data.travel_commenced == true"
            - "GET /compliance/bookings/${bkg_id}/refund-exposure -> data.collected_total_cents == 100000 and data.remaining_headroom_cents == 100000"
            - "Booking.${bkg_id}.total_refund_obligated_cents == 0 — refund-exposure is a pure read and persists nothing"

      - name: denied_boarding_involuntary_statutory_vs_voluntary_negotiated
        grounds:
          - calculations.denied_boarding_compensation
          - entities.DeniedBoardingRecord.fields.statutory_compensation_cents
          - entities.DeniedBoardingRecord.fields.compensation_cents
          - state_machines.DeniedBoardingRecord.RECORDED_to_FINALIZED
        distinguishing_aspect: |
          The second dual variant sits on a different entity domain — statutory compensation on a
          DeniedBoardingRecord, not fare accounting on a Booking: identical fare (45000) and
          identical 90-minute substitute delay produce 77500 cents under INVOLUNTARY_STATUTORY and
          50000 cents under VOLUNTARY_NEGOTIATED.
        test_recipe:
          setup:
            - "One PolicyProfile with defaults, one Passenger, one Booking of 90000 cents on CREDIT_CARD."
            - "Two domestic segments; each carries one DeniedBoardingRecord with one_way_fare_cents = 45000 and a substitute arrival exactly 90 minutes after its own scheduled arrival."
            - "Record 1 is declared INVOLUNTARY; record 2 is declared VOLUNTARY with oversale_confirmed = true, written_disclosure_provided = true and voluntary_agreed_amount_cents = 50000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T09:00:00Z" }
              as: ComplianceAdmin
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /compliance/passengers"
              payload: { email: "dbc.pair@example.com", full_name: "Dana Bordeaux" }
              as: ComplianceAdmin
              captures: { pax_id: $.data.id }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "DBC001", total_fare_cents: 90000, payment_method: "CREDIT_CARD" }
              as: ComplianceAdmin
              captures: { bkg_id: $.data.id }
            - call: "POST /compliance/bookings/${bkg_id}/flight-segments"
              payload: { sequence_index: 1, flight_number: "ZQ101", origin_iata: "LAX", destination_iata: "DEN", is_international: false, scheduled_departure_utc: "2026-08-10T14:00:00Z", scheduled_arrival_utc: "2026-08-10T17:00:00Z", segment_fare_cents: 45000 }
              as: OpsController
              captures: { seg1_id: $.data.id }
            - call: "POST /compliance/bookings/${bkg_id}/flight-segments"
              payload: { sequence_index: 2, flight_number: "ZQ202", origin_iata: "DEN", destination_iata: "ORD", is_international: false, scheduled_departure_utc: "2026-08-10T18:30:00Z", scheduled_arrival_utc: "2026-08-10T21:00:00Z", segment_fare_cents: 45000 }
              as: OpsController
              captures: { seg2_id: $.data.id }
            - call: "POST /compliance/denied-boarding-records"
              payload: { booking_id: "${bkg_id}", flight_segment_id: "${seg1_id}", category: "INVOLUNTARY", oversale_confirmed: true, written_disclosure_provided: true, one_way_fare_cents: 45000, substitute_arrival_utc: "2026-08-10T18:30:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { dbc_inv_id: $.data.id }
            - call: "POST /compliance/denied-boarding-records"
              payload: { booking_id: "${bkg_id}", flight_segment_id: "${seg2_id}", category: "VOLUNTARY", oversale_confirmed: true, written_disclosure_provided: true, one_way_fare_cents: 45000, substitute_arrival_utc: "2026-08-10T22:30:00Z", voluntary_agreed_amount_cents: 50000 }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { dbc_vol_id: $.data.id }
          trigger:
            - call: "POST /compliance/denied-boarding-records/${dbc_inv_id}/finalize"
              payload: { finalized_at_utc: "2026-08-11T09:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /compliance/denied-boarding-records/${dbc_vol_id}/finalize"
              payload: { finalized_at_utc: "2026-08-11T09:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
          assert:
            - "DeniedBoardingRecord.${dbc_inv_id}.substitute_delay_minutes == 90 and DeniedBoardingRecord.${dbc_vol_id}.substitute_delay_minutes == 90"
            - "DeniedBoardingRecord.${dbc_inv_id}.statutory_compensation_cents == 77500 (45000 * 2.0 = 90000 capped at 77500)"
            - "DeniedBoardingRecord.${dbc_inv_id}.compensation_cents == 77500 and effective_category == INVOLUNTARY and status == FINALIZED"
            - "DeniedBoardingRecord.${dbc_vol_id}.statutory_compensation_cents == 77500 and compensation_cents == 50000 and effective_category == VOLUNTARY and status == FINALIZED"
            - "The two records diverge by exactly 27500 cents on identical fare and identical substitute_delay_minutes"
            - "Booking.${bkg_id}.total_refund_obligated_cents == 127500 — DENIED_BOARDING obligations are exempt from booking_refund_headroom and may exceed collected_total_cents 90000"

  - rule_id: combinatorial_formula
    instances:
      - name: denied_boarding_tier_ladder_nested_min_and_cap
        grounds:
          - calculations.denied_boarding_compensation
          - entities.DeniedBoardingRecord.fields.substitute_delay_minutes
          - state_machines.DeniedBoardingRecord.RECORDED_to_FINALIZED
        distinguishing_aspect: |
          Mode (a): four interacting inputs (one_way_fare_cents, substitute_delay_minutes,
          segment.is_international, effective_category) feed a nested min over a tiered multiple —
          a 120-minute delay is capped down from 90000 to 77500 while a 121-minute delay jumps
          tier and is capped down from 180000 to 155000, so the output is non-linear in the delay.
        test_recipe:
          setup:
            - "One PolicyProfile with defaults, one Passenger, one Booking of 90000 cents on CREDIT_CARD, two domestic segments."
            - "Two INVOLUNTARY DeniedBoardingRecords, both with one_way_fare_cents = 45000; the first's substitute arrival is exactly 120 minutes late, the second's exactly 121 minutes late."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T09:00:00Z" }
              as: ComplianceAdmin
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /compliance/passengers"
              payload: { email: "tier.ladder@example.com", full_name: "Tia Ladder" }
              as: ComplianceAdmin
              captures: { pax_id: $.data.id }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "TIER01", total_fare_cents: 90000, payment_method: "CREDIT_CARD" }
              as: ComplianceAdmin
              captures: { bkg_id: $.data.id }
            - call: "POST /compliance/bookings/${bkg_id}/flight-segments"
              payload: { sequence_index: 1, flight_number: "ZQ101", origin_iata: "LAX", destination_iata: "DEN", is_international: false, scheduled_departure_utc: "2026-08-10T14:00:00Z", scheduled_arrival_utc: "2026-08-10T17:00:00Z", segment_fare_cents: 45000 }
              as: OpsController
              captures: { seg1_id: $.data.id }
            - call: "POST /compliance/bookings/${bkg_id}/flight-segments"
              payload: { sequence_index: 2, flight_number: "ZQ202", origin_iata: "DEN", destination_iata: "ORD", is_international: false, scheduled_departure_utc: "2026-08-10T18:30:00Z", scheduled_arrival_utc: "2026-08-10T21:00:00Z", segment_fare_cents: 45000 }
              as: OpsController
              captures: { seg2_id: $.data.id }
            - call: "POST /compliance/denied-boarding-records"
              payload: { booking_id: "${bkg_id}", flight_segment_id: "${seg1_id}", category: "INVOLUNTARY", oversale_confirmed: true, written_disclosure_provided: true, one_way_fare_cents: 45000, substitute_arrival_utc: "2026-08-10T19:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { dbc_120_id: $.data.id }
            - call: "POST /compliance/denied-boarding-records"
              payload: { booking_id: "${bkg_id}", flight_segment_id: "${seg2_id}", category: "INVOLUNTARY", oversale_confirmed: true, written_disclosure_provided: true, one_way_fare_cents: 45000, substitute_arrival_utc: "2026-08-10T23:01:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { dbc_121_id: $.data.id }
          trigger:
            - call: "POST /compliance/denied-boarding-records/${dbc_120_id}/finalize"
              payload: { finalized_at_utc: "2026-08-11T09:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /compliance/denied-boarding-records/${dbc_121_id}/finalize"
              payload: { finalized_at_utc: "2026-08-11T09:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
          assert:
            - "DeniedBoardingRecord.${dbc_120_id}.substitute_delay_minutes == 120 and compensation_cents == 77500"
            - "DeniedBoardingRecord.${dbc_121_id}.substitute_delay_minutes == 121 and compensation_cents == 155000"
            - "Both records have effective_category == INVOLUNTARY and status == FINALIZED"
            - "Booking.${bkg_id}.total_refund_obligated_cents == 232500"

      - name: request_based_proration_rounds_per_segment_before_multiplying
        grounds:
          - calculations.fare_refund_entitlement
          - calculations.refund_deadline_resolution
          - endpoints[POST /compliance/refund-obligations]
          - state_machines.FlightSegment.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Mode (b): the pinned rounding order is round-per-segment-then-multiply, so
          round_half_up(100000/3) = 33333 times 2 unused segments yields exactly 66666 — one cent
          below the 66667 that multiply-then-round-once would produce on the same booking.
        test_recipe:
          setup:
            - "Booking of 100000 cents on CREDIT_CARD with three domestic segments priced 20000 / 40000 / 40000."
            - "Segment 1 has DEPARTED; segment 2 was cancelled, which cascaded segment 3 to DISRUPTED_UNUSED and minted a proactive FARE obligation of 80000."
            - "That proactive obligation was voided as CREATED_IN_ERROR, restoring the booking's headroom to the full 100000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T18:00:00Z" }
              as: ComplianceAdmin
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /compliance/passengers"
              payload: { email: "round.order@example.com", full_name: "Rory Round" }
              as: ComplianceAdmin
              captures: { pax_id: $.data.id }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "RND001", total_fare_cents: 100000, payment_method: "CREDIT_CARD" }
              as: ComplianceAdmin
              captures: { bkg_id: $.data.id }
            - call: "POST /compliance/bookings/${bkg_id}/flight-segments"
              payload: { sequence_index: 1, flight_number: "ZQ101", origin_iata: "LAX", destination_iata: "DEN", is_international: false, scheduled_departure_utc: "2026-08-10T14:00:00Z", scheduled_arrival_utc: "2026-08-10T17:00:00Z", segment_fare_cents: 20000 }
              as: OpsController
              captures: { seg1_id: $.data.id }
            - call: "POST /compliance/bookings/${bkg_id}/flight-segments"
              payload: { sequence_index: 2, flight_number: "ZQ202", origin_iata: "DEN", destination_iata: "ORD", is_international: false, scheduled_departure_utc: "2026-08-10T18:30:00Z", scheduled_arrival_utc: "2026-08-10T21:00:00Z", segment_fare_cents: 40000 }
              as: OpsController
              captures: { seg2_id: $.data.id }
            - call: "POST /compliance/bookings/${bkg_id}/flight-segments"
              payload: { sequence_index: 3, flight_number: "ZQ303", origin_iata: "ORD", destination_iata: "BOS", is_international: false, scheduled_departure_utc: "2026-08-11T13:00:00Z", scheduled_arrival_utc: "2026-08-11T16:00:00Z", segment_fare_cents: 40000 }
              as: OpsController
              captures: { seg3_id: $.data.id }
            - call: "POST /compliance/flight-segments/${seg1_id}/record-operation"
              payload: { operation: "DEPARTED", occurred_at_utc: "2026-08-10T14:10:00Z" }
              as: OpsController
            - call: "POST /compliance/flight-segments/${seg2_id}/declare-disruption"
              payload: { disruption_type: "CANCELLATION", declared_at_utc: "2026-08-10T18:00:00Z" }
              as: OpsController
            - call: "GET /compliance/refund-obligations"
              payload: { booking_id: "${bkg_id}", basis: "FARE" }
              as: ComplianceOfficer
              captures: { ob_proactive_id: "$.data[0].id" }
            - call: "POST /compliance/refund-obligations/${ob_proactive_id}/void"
              payload: { void_reason: "CREATED_IN_ERROR" }
              as: ComplianceAdmin
            - call: "GET /compliance/bookings/${bkg_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { bkg_v: $.data.version }
          trigger:
            - call: "POST /compliance/refund-obligations"
              payload: { booking_id: "${bkg_id}", basis: "FARE", issuance_mode: "REQUEST_BASED", expected_booking_version: "${bkg_v}", flight_segment_id: "${seg2_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { ob_request_id: $.data.id }
          assert:
            - "RefundObligation.${ob_request_id}.variant_applied == REQUEST_BASED_UNUSED_PRORATION"
            - "RefundObligation.${ob_request_id}.gross_entitlement_cents == 66666 (NOT 66667)"
            - "RefundObligation.${ob_request_id}.headroom_at_creation_cents == 100000"
            - "RefundObligation.${ob_request_id}.amount_cents == 66666 and payable_total_cents == 66666"
            - "RefundObligation.${ob_request_id}.deadline_utc == 2026-08-17T18:00:00Z and election_deadline_utc == 2026-08-15T18:00:00Z"
            - "Booking.${bkg_id}.total_refund_obligated_cents == 66666 and unused_segment_count == 2"

      - name: headroom_evaluation_order_clamps_cascade_in_pinned_sequence
        grounds:
          - calculations.booking_refund_headroom
          - calculations.booking_ledger_recompute
          - state_machines.FlightSegment.SCHEDULED_to_CANCELLED
          - state_machines.ConsumerComplaint.ACKNOWLEDGED_to_ANSWERED
          - entities.Booking.fields.suppressed_obligation_count
        distinguishing_aspect: |
          Mode (c): the amount depends on the headroom while the headroom depends on the persisted
          amounts, and the pinned five-step order resolves it — the FARE obligation is clamped from
          14000 to exactly 5400 using only strictly pre-existing rows, and the two ancillary
          obligations later in the same cascade are skipped at zero headroom, leaving
          suppressed_obligation_count == 2.
        test_recipe:
          setup:
            - "Booking of 14000 cents on CREDIT_CARD with one domestic segment of 14000, plus ancillaries of 4500 (SEAT_SELECTION) and 1900 (ENTERTAINMENT) on that segment, so collected_total_cents = 20400."
            - "A REFUND complaint on that booking has been acknowledged and answered with disposition REFUND_GRANTED and granted_amount_cents = 15000, creating a GOODWILL_GRANT obligation of 15000 and leaving 5400 of headroom."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: ComplianceAdmin
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /compliance/passengers"
              payload: { email: "head.room@example.com", full_name: "Hedy Room" }
              as: ComplianceAdmin
              captures: { pax_id: $.data.id }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "HRM001", total_fare_cents: 14000, payment_method: "CREDIT_CARD" }
              as: ComplianceAdmin
              captures: { bkg_id: $.data.id }
            - call: "POST /compliance/bookings/${bkg_id}/flight-segments"
              payload: { sequence_index: 1, flight_number: "ZQ101", origin_iata: "LAX", destination_iata: "DEN", is_international: false, scheduled_departure_utc: "2026-08-12T14:00:00Z", scheduled_arrival_utc: "2026-08-12T17:00:00Z", segment_fare_cents: 14000 }
              as: OpsController
              captures: { seg1_id: $.data.id }
            - call: "POST /compliance/ancillary-purchases"
              payload: { booking_id: "${bkg_id}", flight_segment_id: "${seg1_id}", service_type: "SEAT_SELECTION", amount_cents: 4500 }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { anc_seat_id: $.data.id }
            - call: "POST /compliance/ancillary-purchases"
              payload: { booking_id: "${bkg_id}", flight_segment_id: "${seg1_id}", service_type: "ENTERTAINMENT", amount_cents: 1900 }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { anc_ife_id: $.data.id }
            - call: "POST /compliance/consumer-complaints"
              payload: { booking_id: "${bkg_id}", category: "REFUND", channel: "WEB", received_at_utc: "2026-08-11T10:00:00Z", summary: "Requests goodwill refund for repeated schedule changes" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { cmp_id: $.data.id }
            - call: "POST /compliance/consumer-complaints/${cmp_id}/acknowledge"
              payload: { acknowledged_at_utc: "2026-08-11T12:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /compliance/consumer-complaints/${cmp_id}/answer"
              payload: { disposition: "REFUND_GRANTED", answered_at_utc: "2026-08-11T13:00:00Z", granted_amount_cents: 15000 }
              as: ComplianceOfficer
              as_user_id: "officer-a"
          trigger:
            - call: "POST /compliance/flight-segments/${seg1_id}/declare-disruption"
              payload: { disruption_type: "CANCELLATION", declared_at_utc: "2026-08-11T14:00:00Z" }
              as: OpsController
          assert:
            - "The FARE obligation of Booking.${bkg_id} has gross_entitlement_cents == 14000, headroom_at_creation_cents == 5400 and amount_cents == 5400"
            - "GET /compliance/refund-obligations?booking_id=${bkg_id}&basis=ANCILLARY returns total_count == 0 — both ancillary obligations were skipped at zero headroom"
            - "AncillaryPurchase.${anc_seat_id}.delivery_status == NOT_PROVIDED and non_provision_reason == SERVICE_CANCELLED and refund_obligation_created == false"
            - "AncillaryPurchase.${anc_ife_id}.delivery_status == NOT_PROVIDED and refund_obligation_created == false"
            - "Booking.${bkg_id}.suppressed_obligation_count == 2"
            - "Booking.${bkg_id}.collected_total_cents == 20400 and total_refund_obligated_cents == 20400"
            - "Booking.${bkg_id}.disruption_posture == REFUND_OBLIGATED"

  - rule_id: non_linear_state_machine
    instances:
      - name: obligation_election_and_settlement_axes_advance_independently
        grounds:
          - state_machines.RefundObligation
          - state_machines.RefundObligation.PENDING_ELECTION_to_ELECTED_CASH_sweep
          - state_machines.RefundObligation.FAILED_to_INITIATED
          - calculations.compliance_sweep_recount
        distinguishing_aspect: |
          The non-linearity is the parallel_dimensions shape of RefundObligation: the sweep advances
          the election axis to ELECTED_CASH/AUTO_DEFAULT while the settlement axis stays UNSETTLED,
          and the FAILED -> INITIATED retry then advances the settlement axis a second time without
          disturbing the election axis, so settlement_attempt_count reaches 2 while election_source
          is still AUTO_DEFAULT.
        test_recipe:
          setup:
            - "Booking of 100000 cents on CREDIT_CARD with a single domestic segment of 100000."
            - "The segment was cancelled at 2026-08-10T18:00:00Z, minting a proactive FARE obligation of 100000 with deadline 2026-08-17T18:00:00Z and election deadline 2026-08-15T18:00:00Z."
            - "The logical clock is then moved one second past the election deadline so the sweep can auto-default the election axis."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T18:00:00Z" }
              as: ComplianceAdmin
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /compliance/passengers"
              payload: { email: "axes.split@example.com", full_name: "Axel Splitt" }
              as: ComplianceAdmin
              captures: { pax_id: $.data.id }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "AXE001", total_fare_cents: 100000, payment_method: "CREDIT_CARD" }
              as: ComplianceAdmin
              captures: { bkg_id: $.data.id }
            - call: "POST /compliance/bookings/${bkg_id}/flight-segments"
              payload: { sequence_index: 1, flight_number: "ZQ101", origin_iata: "LAX", destination_iata: "DEN", is_international: false, scheduled_departure_utc: "2026-08-10T20:00:00Z", scheduled_arrival_utc: "2026-08-10T23:00:00Z", segment_fare_cents: 100000 }
              as: OpsController
              captures: { seg1_id: $.data.id }
            - call: "POST /compliance/flight-segments/${seg1_id}/declare-disruption"
              payload: { disruption_type: "CANCELLATION", declared_at_utc: "2026-08-10T18:00:00Z" }
              as: OpsController
            - call: "GET /compliance/refund-obligations"
              payload: { booking_id: "${bkg_id}", basis: "FARE" }
              as: ComplianceOfficer
              captures: { ob_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T18:00:01Z" }
              as: ComplianceAdmin
          trigger:
            - call: "POST /compliance/compliance-sweeps"
              payload: { policy_profile_id: "${pol_id}" }
              as: ComplianceAdmin
              captures: { defaulted: $.data.election_auto_defaulted_count, breached: $.data.deadline_breach_flagged_count }
            - call: "POST /compliance/refund-obligations/${ob_id}/initiate-settlement"
              payload: { processor_reference: "PROC-AXE-1" }
              as: ComplianceOfficer
              as_user_id: "officer-b"
            - call: "POST /compliance/refund-obligations/${ob_id}/complete-settlement"
              payload: { outcome: "FAILED", failure_reason: "PROCESSOR_TIMEOUT" }
              as: ComplianceOfficer
              as_user_id: "officer-c"
            - call: "POST /compliance/refund-obligations/${ob_id}/initiate-settlement"
              payload: { processor_reference: "PROC-AXE-2" }
              as: ComplianceOfficer
              as_user_id: "officer-b"
          assert:
            - "POST /compliance/compliance-sweeps -> data.election_auto_defaulted_count == 1 and data.deadline_breach_flagged_count == 0"
            - "After the sweep, RefundObligation.${ob_id}.election_status == ELECTED_CASH, election_source == AUTO_DEFAULT, settlement_method == ORIGINAL_PAYMENT"
            - "After the sweep, RefundObligation.${ob_id}.settlement_status == UNSETTLED and settlement_attempt_count == 0 — the sweep moved only the election axis"
            - "RefundObligation.${ob_id}.credit_bonus_cents == 0 and payable_total_cents == 100000 — auto-default is never TRAVEL_CREDIT"
            - "After the first initiate-settlement, settlement_status == INITIATED and settlement_attempt_count == 1"
            - "After complete-settlement FAILED, settlement_status == FAILED, last_failure_reason == PROCESSOR_TIMEOUT, settlement_initiated_by_user_id == null"
            - "After the retry, RefundObligation.${ob_id}.settlement_status == INITIATED and settlement_attempt_count == 2"
            - "RefundObligation.${ob_id}.election_status is still ELECTED_CASH and election_source is still AUTO_DEFAULT after all three settlement-axis moves"
            - "Booking.${bkg_id}.total_refund_obligated_cents == 100000 throughout — a failed settlement still owes the money"

      - name: tarmac_event_fork_join_exemption_versus_deplane_branches
        grounds:
          - state_machines.TarmacDelayEvent
          - state_machines.TarmacDelayEvent.DELAY_ACTIVE_to_EXEMPTION_INVOKED
          - state_machines.TarmacDelayEvent.DEPLANED_to_REPORT_FILED
          - calculations.tarmac_compliance_evaluation
        distinguishing_aspect: |
          A different non-linear shape on a different entity: TarmacDelayEvent forks from
          DELAY_ACTIVE into two branches with divergent side effects (the exemption branch forces
          is_violation false and does NOT add to segment.cumulative_tarmac_minutes, the deplane
          branch does both) and the two branches join at REPORT_FILED with different payload
          requirements — corrective_action_summary is mandatory only on the violating branch.
        test_recipe:
          setup:
            - "Booking of 60000 cents on CREDIT_CARD with two domestic segments of 30000 each; the deplane deadline is 180 minutes."
            - "Segment 1 carries a tarmac event that will take the exemption branch; segment 2 carries a tarmac event that will take the deplane branch and overrun the deadline by 20 minutes."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T23:00:00Z" }
              as: ComplianceAdmin
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /compliance/passengers"
              payload: { email: "fork.join@example.com", full_name: "Fern Joyner" }
              as: ComplianceAdmin
              captures: { pax_id: $.data.id }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "FRK001", total_fare_cents: 60000, payment_method: "CREDIT_CARD" }
              as: ComplianceAdmin
              captures: { bkg_id: $.data.id }
            - call: "POST /compliance/bookings/${bkg_id}/flight-segments"
              payload: { sequence_index: 1, flight_number: "ZQ101", origin_iata: "LAX", destination_iata: "DEN", is_international: false, scheduled_departure_utc: "2026-08-10T14:00:00Z", scheduled_arrival_utc: "2026-08-10T17:00:00Z", segment_fare_cents: 30000 }
              as: OpsController
              captures: { seg1_id: $.data.id }
            - call: "POST /compliance/bookings/${bkg_id}/flight-segments"
              payload: { sequence_index: 2, flight_number: "ZQ202", origin_iata: "DEN", destination_iata: "ORD", is_international: false, scheduled_departure_utc: "2026-08-10T18:30:00Z", scheduled_arrival_utc: "2026-08-10T21:00:00Z", segment_fare_cents: 30000 }
              as: OpsController
              captures: { seg2_id: $.data.id }
            - call: "POST /compliance/tarmac-delay-events"
              payload: { flight_segment_id: "${seg1_id}", tarmac_start_utc: "2026-08-10T14:10:00Z", phase: "DEPARTURE" }
              as: OpsController
              captures: { evt_exempt_id: $.data.id }
            - call: "POST /compliance/tarmac-delay-events"
              payload: { flight_segment_id: "${seg2_id}", tarmac_start_utc: "2026-08-10T18:40:00Z", phase: "DEPARTURE" }
              as: OpsController
              captures: { evt_deplane_id: $.data.id }
          trigger:
            - call: "POST /compliance/tarmac-delay-events/${evt_exempt_id}/claim-exemption"
              payload: { exemption_reason: "SAFETY", exemption_declared_at_utc: "2026-08-10T14:40:00Z" }
              as: OpsController
            - call: "POST /compliance/tarmac-delay-events/${evt_deplane_id}/deplane"
              payload: { deplane_completed_utc: "2026-08-10T22:00:00Z" }
              as: OpsController
            - call: "POST /compliance/flight-segments/${seg1_id}/record-operation"
              payload: { operation: "DEPARTED", occurred_at_utc: "2026-08-10T15:00:00Z" }
              as: OpsController
            - call: "POST /compliance/flight-segments/${seg2_id}/record-operation"
              payload: { operation: "DEPARTED", occurred_at_utc: "2026-08-10T22:30:00Z" }
              as: OpsController
            - call: "POST /compliance/tarmac-delay-events/${evt_exempt_id}/file-report"
              payload: { report_reference: "TDR-EXEMPT-1", filed_at_utc: "2026-08-10T23:00:00Z" }
              as: ComplianceAdmin
            - call: "POST /compliance/tarmac-delay-events/${evt_deplane_id}/file-report"
              payload: { report_reference: "TDR-VIOL-1", filed_at_utc: "2026-08-10T23:00:00Z" }
              as: ComplianceAdmin
              is_negative_trigger: true
              note: "corrective_action_summary omitted on the violating branch -> ERR_CORRECTIVE_ACTION_REQUIRED (422); the event stays DEPLANED."
            - call: "POST /compliance/tarmac-delay-events/${evt_deplane_id}/file-report"
              payload: { report_reference: "TDR-VIOL-1", filed_at_utc: "2026-08-10T23:00:00Z", corrective_action_summary: "Contingency plan retrained; gate return protocol revised." }
              as: ComplianceAdmin
          assert:
            - "TarmacDelayEvent.${evt_exempt_id} after claim-exemption: status == EXEMPTION_INVOKED, interval_end_utc == 2026-08-10T14:40:00Z, tarmac_minutes == 30, is_violation == false"
            - "TarmacDelayEvent.${evt_deplane_id} after deplane: status == DEPLANED, interval_end_utc == 2026-08-10T22:00:00Z, tarmac_minutes == 200, deadline_minutes == 180, is_violation == true"
            - "FlightSegment.${seg1_id}.exempted_tarmac_event_count == 1 and cumulative_tarmac_minutes == 0 — the exemption branch adds no minutes"
            - "FlightSegment.${seg2_id}.exempted_tarmac_event_count == 0 and cumulative_tarmac_minutes == 200"
            - "The first file-report on ${evt_deplane_id} returns ERR_CORRECTIVE_ACTION_REQUIRED (422) and the event is still DEPLANED"
            - "The file-report on ${evt_exempt_id} succeeds with no corrective_action_summary: status == REPORT_FILED and corrective_action_summary == null"
            - "The second file-report on ${evt_deplane_id} succeeds: status == REPORT_FILED — both fork branches joined at the same terminal state"
            - "PolicyProfile.${pol_id}.open_violation_count == 0 — only the deplane branch produced a violation, but the profile rollup is recomputed exclusively by POST /compliance/compliance-sweeps, which this recipe never runs"

  - rule_id: transitive_cascade
    instances:
      - name: segment_cancellation_depth_four_cascade
        grounds:
          - state_machines.FlightSegment.SCHEDULED_to_CANCELLED
          - calculations.fare_refund_entitlement
          - calculations.non_fare_refund_entitlement
          - calculations.booking_ledger_recompute
        distinguishing_aspect: |
          Depth-4 chain rooted at one segment cancellation, each link caused strictly by the prior
          one: LINK 1 cancels segment 2 -> LINK 2a/2b that cancellation drags sibling segment 3 to
          DISRUPTED_UNUSED and flips both of segment 2's ancillaries to NOT_PROVIDED -> LINK 3a/3b
          those state flips mint three RefundObligations -> LINK 4 those obligations rewrite the
          booking ledger to 106400 with an earliest deadline. Cutting any link changes the
          observable end state.
        test_recipe:
          setup:
            - "Booking of 100000 cents on CREDIT_CARD with three domestic segments priced 20000 / 40000 / 40000; travel has not commenced."
            - "Segment 2 carries a SEAT_SELECTION ancillary of 4500 and an ENTERTAINMENT ancillary of 1900, so collected_total_cents = 106400 and headroom is ample."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T18:00:00Z" }
              as: ComplianceAdmin
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /compliance/passengers"
              payload: { email: "deep.cascade@example.com", full_name: "Dee Cascade" }
              as: ComplianceAdmin
              captures: { pax_id: $.data.id }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "CSC001", total_fare_cents: 100000, payment_method: "CREDIT_CARD" }
              as: ComplianceAdmin
              captures: { bkg_id: $.data.id }
            - call: "POST /compliance/bookings/${bkg_id}/flight-segments"
              payload: { sequence_index: 1, flight_number: "ZQ101", origin_iata: "LAX", destination_iata: "DEN", is_international: false, scheduled_departure_utc: "2026-08-12T14:00:00Z", scheduled_arrival_utc: "2026-08-12T17:00:00Z", segment_fare_cents: 20000 }
              as: OpsController
              captures: { seg1_id: $.data.id }
            - call: "POST /compliance/bookings/${bkg_id}/flight-segments"
              payload: { sequence_index: 2, flight_number: "ZQ202", origin_iata: "DEN", destination_iata: "ORD", is_international: false, scheduled_departure_utc: "2026-08-12T18:30:00Z", scheduled_arrival_utc: "2026-08-12T21:00:00Z", segment_fare_cents: 40000 }
              as: OpsController
              captures: { seg2_id: $.data.id }
            - call: "POST /compliance/bookings/${bkg_id}/flight-segments"
              payload: { sequence_index: 3, flight_number: "ZQ303", origin_iata: "ORD", destination_iata: "BOS", is_international: false, scheduled_departure_utc: "2026-08-13T13:00:00Z", scheduled_arrival_utc: "2026-08-13T16:00:00Z", segment_fare_cents: 40000 }
              as: OpsController
              captures: { seg3_id: $.data.id }
            - call: "POST /compliance/ancillary-purchases"
              payload: { booking_id: "${bkg_id}", flight_segment_id: "${seg2_id}", service_type: "SEAT_SELECTION", amount_cents: 4500 }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { anc_seat_id: $.data.id }
            - call: "POST /compliance/ancillary-purchases"
              payload: { booking_id: "${bkg_id}", flight_segment_id: "${seg2_id}", service_type: "ENTERTAINMENT", amount_cents: 1900 }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { anc_ife_id: $.data.id }
          trigger:
            - call: "POST /compliance/flight-segments/${seg2_id}/declare-disruption"
              payload: { disruption_type: "CANCELLATION", declared_at_utc: "2026-08-10T18:00:00Z" }
              as: OpsController
          assert:
            - "LINK 1: FlightSegment.${seg2_id}.status == CANCELLED, disruption_type == CANCELLATION, disruption_declared_at_utc == 2026-08-10T18:00:00Z"
            - "LINK 2a: FlightSegment.${seg3_id}.status == DISRUPTED_UNUSED with disruption_type == NONE and disruption_declared_at_utc == 2026-08-10T18:00:00Z; FlightSegment.${seg1_id}.status is still SCHEDULED"
            - "LINK 2b: AncillaryPurchase.${anc_seat_id}.delivery_status == NOT_PROVIDED and non_provision_reason == SERVICE_CANCELLED; same for AncillaryPurchase.${anc_ife_id}"
            - "LINK 3a: GET /compliance/refund-obligations?booking_id=${bkg_id}&basis=FARE returns total_count == 1 with amount_cents == 100000, issuance_mode == PROACTIVE, variant_applied == PROACTIVE_FULL_ITINERARY, flight_segment_id == ${seg2_id}"
            - "LINK 3b: GET /compliance/refund-obligations?booking_id=${bkg_id}&basis=ANCILLARY returns total_count == 2 with amount_cents 4500 and 1900, both variant_applied == FEE_FACE_VALUE and refund_obligation_created == true on both ancillaries"
            - "LINK 4: Booking.${bkg_id}.total_refund_obligated_cents == 106400, collected_total_cents == 106400, unused_segment_count == 3, disruption_posture == REFUND_OBLIGATED, suppressed_obligation_count == 0"
            - "LINK 4: Booking.${bkg_id}.earliest_refund_deadline_utc == 2026-08-17T18:00:00Z (7 days for CREDIT_CARD from the 2026-08-10T18:00:00Z obligation start)"
            - "GET /compliance/bookings/${bkg_id}/refund-exposure -> data.remaining_headroom_cents == 0"

      - name: late_bag_delivery_depth_three_cascade
        grounds:
          - state_machines.CheckedBag.IN_TRANSIT_to_DELIVERED_LATE
          - calculations.baggage_delivery_delay
          - calculations.non_fare_refund_entitlement
          - calculations.booking_ledger_recompute
        distinguishing_aspect: |
          A depth-3 chain on an entirely different root than the depth-4 instance — a CheckedBag
          resolution rather than a segment cancellation: LINK 1 computes delivery_delay_hours 12.00
          and moves the bag to DELIVERED_LATE -> LINK 2 that late status mints a BAGGAGE_FEE
          obligation for the full 3500 fee and sets fee_refund_obligated -> LINK 3 that obligation
          rewrites the booking ledger and posture. The bag's own status is unaffected by anything
          the fare cascade does.
        test_recipe:
          setup:
            - "Booking of 50000 cents on CREDIT_CARD with one domestic segment of 50000."
            - "One checked bag with fee_cents = 3500, checked_at_utc = 2026-08-10T12:30:00Z and scheduled_delivery_utc = 2026-08-10T21:00:00Z."
            - "The bag is delivered at 2026-08-11T09:00:00Z, exactly 12.00 hours after the scheduled delivery time, hitting the 12-hour domestic threshold inclusively."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T09:00:00Z" }
              as: ComplianceAdmin
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /compliance/passengers"
              payload: { email: "late.bag@example.com", full_name: "Bagley Lott" }
              as: ComplianceAdmin
              captures: { pax_id: $.data.id }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "BAG001", total_fare_cents: 50000, payment_method: "CREDIT_CARD" }
              as: ComplianceAdmin
              captures: { bkg_id: $.data.id }
            - call: "POST /compliance/bookings/${bkg_id}/flight-segments"
              payload: { sequence_index: 1, flight_number: "ZQ101", origin_iata: "LAX", destination_iata: "DEN", is_international: false, scheduled_departure_utc: "2026-08-10T14:00:00Z", scheduled_arrival_utc: "2026-08-10T17:00:00Z", segment_fare_cents: 50000 }
              as: OpsController
              captures: { seg1_id: $.data.id }
            - call: "POST /compliance/checked-bags"
              payload: { booking_id: "${bkg_id}", tag_number: "ZQ0099001", fee_cents: 3500, checked_at_utc: "2026-08-10T12:30:00Z", scheduled_delivery_utc: "2026-08-10T21:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { bag_id: $.data.id }
          trigger:
            - call: "POST /compliance/checked-bags/${bag_id}/resolve"
              payload: { resolution: "DELIVERED", delivered_at_utc: "2026-08-11T09:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { bag_status: $.data.status, bag_delay: $.data.delivery_delay_hours }
          assert:
            - "LINK 1: CheckedBag.${bag_id}.delivery_delay_hours == 12.00 and status == DELIVERED_LATE and delivered_at_utc == 2026-08-11T09:00:00Z"
            - "LINK 2: CheckedBag.${bag_id}.fee_refund_obligated == true"
            - "LINK 2: GET /compliance/refund-obligations?booking_id=${bkg_id}&basis=BAGGAGE_FEE returns total_count == 1 with amount_cents == 3500, variant_applied == FEE_FACE_VALUE, issuance_mode == PROACTIVE, checked_bag_id == ${bag_id}"
            - "LINK 2: that obligation has obligation_start_utc == 2026-08-11T09:00:00Z and deadline_utc == 2026-08-18T09:00:00Z"
            - "LINK 3: Booking.${bkg_id}.total_refund_obligated_cents == 3500, collected_total_cents == 53500, earliest_refund_deadline_utc == 2026-08-18T09:00:00Z, disruption_posture == REFUND_OBLIGATED"
            - "FlightSegment.${seg1_id}.status is still SCHEDULED — the baggage chain does not touch the segment"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: settled_obligation_state_beats_segregation_of_duties
        grounds:
          - validations[priority 40]
          - validations[priority 50]
          - state_machines.RefundObligation.INITIATED_to_SETTLED
        distinguishing_aspect: |
          Category pair state (priority 40, ERR_OBLIGATION_STATE_INVALID) versus business_safety
          (priority 50, ERR_SEGREGATION_OF_DUTIES). One request violates both: officer-a is the
          obligation's creator AND the obligation is already SETTLED. The state error must win.
          The control call on a second booking proves priority 50 really does fire on its own when
          the state precondition is satisfied.
        test_recipe:
          setup:
            - "Booking 1 of 60000 cents on CREDIT_CARD with one domestic segment of 60000, cancelled so the FARE source is valid for settlement."
            - "The cascade-minted obligation is voided as CREATED_IN_ERROR and replaced by a REQUEST_BASED obligation created by officer-a, so created_by_user_id = officer-a."
            - "That obligation is elected CASH, initiated by officer-b and completed SUCCEEDED by officer-c, so settlement_status = SETTLED."
            - "Booking 2 of 30000 cents receives the same treatment but is left UNSETTLED after election, as the control."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T18:00:00Z" }
              as: ComplianceAdmin
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /compliance/passengers"
              payload: { email: "sod.state@example.com", full_name: "Sonia Duties" }
              as: ComplianceAdmin
              captures: { pax_id: $.data.id }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "SOD001", total_fare_cents: 60000, payment_method: "CREDIT_CARD" }
              as: ComplianceAdmin
              captures: { bkg1_id: $.data.id }
            - call: "POST /compliance/bookings/${bkg1_id}/flight-segments"
              payload: { sequence_index: 1, flight_number: "ZQ101", origin_iata: "LAX", destination_iata: "DEN", is_international: false, scheduled_departure_utc: "2026-08-12T20:00:00Z", scheduled_arrival_utc: "2026-08-12T23:00:00Z", segment_fare_cents: 60000 }
              as: OpsController
              captures: { seg1_id: $.data.id }
            - call: "POST /compliance/flight-segments/${seg1_id}/declare-disruption"
              payload: { disruption_type: "CANCELLATION", declared_at_utc: "2026-08-10T18:00:00Z" }
              as: OpsController
            - call: "GET /compliance/refund-obligations"
              payload: { booking_id: "${bkg1_id}", basis: "FARE" }
              as: ComplianceOfficer
              captures: { ob1_cascade_id: "$.data[0].id" }
            - call: "POST /compliance/refund-obligations/${ob1_cascade_id}/void"
              payload: { void_reason: "CREATED_IN_ERROR" }
              as: ComplianceAdmin
            - call: "GET /compliance/bookings/${bkg1_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { bkg1_v: $.data.version }
            - call: "POST /compliance/refund-obligations"
              payload: { booking_id: "${bkg1_id}", basis: "FARE", issuance_mode: "REQUEST_BASED", expected_booking_version: "${bkg1_v}", flight_segment_id: "${seg1_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { ob1_id: $.data.id }
            - call: "POST /compliance/refund-obligations/${ob1_id}/elect"
              payload: { election: "CASH" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /compliance/refund-obligations/${ob1_id}/initiate-settlement"
              payload: { processor_reference: "PROC-SOD-1" }
              as: ComplianceOfficer
              as_user_id: "officer-b"
            - call: "POST /compliance/refund-obligations/${ob1_id}/complete-settlement"
              payload: { outcome: "SUCCEEDED" }
              as: ComplianceOfficer
              as_user_id: "officer-c"
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "SOD002", total_fare_cents: 30000, payment_method: "CREDIT_CARD" }
              as: ComplianceAdmin
              captures: { bkg2_id: $.data.id }
            - call: "POST /compliance/bookings/${bkg2_id}/flight-segments"
              payload: { sequence_index: 1, flight_number: "ZQ404", origin_iata: "SFO", destination_iata: "SEA", is_international: false, scheduled_departure_utc: "2026-08-12T20:00:00Z", scheduled_arrival_utc: "2026-08-12T22:00:00Z", segment_fare_cents: 30000 }
              as: OpsController
              captures: { seg2_id: $.data.id }
            - call: "POST /compliance/flight-segments/${seg2_id}/declare-disruption"
              payload: { disruption_type: "CANCELLATION", declared_at_utc: "2026-08-10T18:00:00Z" }
              as: OpsController
            - call: "GET /compliance/refund-obligations"
              payload: { booking_id: "${bkg2_id}", basis: "FARE" }
              as: ComplianceOfficer
              captures: { ob2_cascade_id: "$.data[0].id" }
            - call: "POST /compliance/refund-obligations/${ob2_cascade_id}/void"
              payload: { void_reason: "CREATED_IN_ERROR" }
              as: ComplianceAdmin
            - call: "GET /compliance/bookings/${bkg2_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { bkg2_v: $.data.version }
            - call: "POST /compliance/refund-obligations"
              payload: { booking_id: "${bkg2_id}", basis: "FARE", issuance_mode: "REQUEST_BASED", expected_booking_version: "${bkg2_v}", flight_segment_id: "${seg2_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { ob2_id: $.data.id }
            - call: "POST /compliance/refund-obligations/${ob2_id}/elect"
              payload: { election: "CASH" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
          trigger:
            - call: "POST /compliance/refund-obligations/${ob1_id}/initiate-settlement"
              payload: { processor_reference: "PROC-SOD-CONFLICT" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              is_negative_trigger: true
              note: "Violates priority 40 (settlement_status = SETTLED) and priority 50 (X-User-ID = created_by_user_id) at once."
            - call: "POST /compliance/refund-obligations/${ob2_id}/initiate-settlement"
              payload: { processor_reference: "PROC-SOD-CONTROL" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              is_negative_trigger: true
              note: "Control: violates only priority 50, because this obligation is still UNSETTLED."
          assert:
            - "The call on ${ob1_id} returns ERR_OBLIGATION_STATE_INVALID with HTTP 409 — NOT ERR_SEGREGATION_OF_DUTIES"
            - "The control call on ${ob2_id} returns ERR_SEGREGATION_OF_DUTIES with HTTP 403, proving priority 50 is live and was merely outranked on the first call"
            - "RefundObligation.${ob1_id}.settlement_status is still SETTLED and settlement_attempt_count is still 1"
            - "RefundObligation.${ob2_id}.settlement_status is still UNSETTLED and settlement_attempt_count is still 0"
            - "Booking.${bkg1_id}.disruption_posture == CLOSED_OUT and Booking.${bkg2_id}.disruption_posture == REFUND_OBLIGATED"

      - name: tarmac_window_temporal_beats_interval_overlap_constraint
        grounds:
          - validations[priority 55]
          - validations[priority 65]
          - calculations.tarmac_compliance_evaluation
        distinguishing_aspect: |
          A different category pair on a different entity: business_temporal (priority 55,
          ERR_TARMAC_WINDOW_INVALID) versus business_constraint (priority 65,
          ERR_TARMAC_INTERVAL_OVERLAP). A start instant of 18:00:00Z is both before the scheduled
          departure and inside the open-ended interval of the DELAY_ACTIVE event, and the temporal
          rule must win. The control start instant of 21:00:00Z violates only the overlap rule.
        test_recipe:
          setup:
            - "Booking of 30000 cents with one domestic segment whose scheduled_departure_utc is 2026-08-10T18:30:00Z."
            - "One tarmac event on that segment starts at 2026-08-10T18:40:00Z and is left DELAY_ACTIVE, so it occupies [18:40:00Z, +infinity)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T22:00:00Z" }
              as: ComplianceAdmin
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /compliance/passengers"
              payload: { email: "tarmac.pair@example.com", full_name: "Tamar Winder" }
              as: ComplianceAdmin
              captures: { pax_id: $.data.id }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "TWN001", total_fare_cents: 30000, payment_method: "CREDIT_CARD" }
              as: ComplianceAdmin
              captures: { bkg_id: $.data.id }
            - call: "POST /compliance/bookings/${bkg_id}/flight-segments"
              payload: { sequence_index: 1, flight_number: "ZQ202", origin_iata: "DEN", destination_iata: "ORD", is_international: false, scheduled_departure_utc: "2026-08-10T18:30:00Z", scheduled_arrival_utc: "2026-08-10T21:00:00Z", segment_fare_cents: 30000 }
              as: OpsController
              captures: { seg_id: $.data.id }
            - call: "POST /compliance/tarmac-delay-events"
              payload: { flight_segment_id: "${seg_id}", tarmac_start_utc: "2026-08-10T18:40:00Z", phase: "DEPARTURE" }
              as: OpsController
              captures: { evt_active_id: $.data.id }
          trigger:
            - call: "POST /compliance/tarmac-delay-events"
              payload: { flight_segment_id: "${seg_id}", tarmac_start_utc: "2026-08-10T18:00:00Z", phase: "DEPARTURE" }
              as: OpsController
              is_negative_trigger: true
              note: "Violates priority 55 (before scheduled_departure_utc) and priority 65 (inside the DELAY_ACTIVE open-ended interval)."
            - call: "POST /compliance/tarmac-delay-events"
              payload: { flight_segment_id: "${seg_id}", tarmac_start_utc: "2026-08-10T21:00:00Z", phase: "ARRIVAL" }
              as: OpsController
              is_negative_trigger: true
              note: "Control: after scheduled departure, so only priority 65 is violated."
          assert:
            - "The 18:00:00Z call returns ERR_TARMAC_WINDOW_INVALID with HTTP 422 — NOT ERR_TARMAC_INTERVAL_OVERLAP"
            - "The 21:00:00Z control call returns ERR_TARMAC_INTERVAL_OVERLAP with HTTP 409, proving priority 65 is live"
            - "GET /compliance/flight-segments/${seg_id}/tarmac-delay-events -> data.total_count == 1 — neither rejected request created a row"
            - "TarmacDelayEvent.${evt_active_id}.status is still DELAY_ACTIVE with interval_end_utc == null and tarmac_minutes == 0"
            - "FlightSegment.${seg_id}.cumulative_tarmac_minutes == 0"

      - name: segment_booking_mismatch_referential_beats_headroom_fiscal
        grounds:
          - validations[priority 75]
          - validations[priority 81]
          - calculations.booking_refund_headroom
        distinguishing_aspect: |
          A third category pair: business_referential (priority 75,
          ERR_SEGMENT_BOOKING_MISMATCH) versus business_fiscal (priority 81,
          ERR_REFUND_EXCEEDS_HEADROOM). The offending request names a segment from another booking
          AND asks for 10000 cents against only 1000 cents of headroom; the referential error must
          win. The control names the booking's own segment and surfaces the fiscal error.
        test_recipe:
          setup:
            - "Booking A of 10000 cents on CREDIT_CARD with one domestic segment of 10000; a REFUND complaint on A was answered REFUND_GRANTED with granted_amount_cents = 9000, so a GOODWILL_GRANT obligation of 9000 leaves exactly 1000 cents of headroom."
            - "Booking B of 50000 cents on CREDIT_CARD with one domestic segment of 50000, untouched."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T12:00:00Z" }
              as: ComplianceAdmin
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /compliance/passengers"
              payload: { email: "mismatch.fiscal@example.com", full_name: "Mira Mismatch" }
              as: ComplianceAdmin
              captures: { pax_id: $.data.id }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "MSM001", total_fare_cents: 10000, payment_method: "CREDIT_CARD" }
              as: ComplianceAdmin
              captures: { bkgA_id: $.data.id }
            - call: "POST /compliance/bookings/${bkgA_id}/flight-segments"
              payload: { sequence_index: 1, flight_number: "ZQ101", origin_iata: "LAX", destination_iata: "DEN", is_international: false, scheduled_departure_utc: "2026-08-13T14:00:00Z", scheduled_arrival_utc: "2026-08-13T17:00:00Z", segment_fare_cents: 10000 }
              as: OpsController
              captures: { segA_id: $.data.id }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "MSM002", total_fare_cents: 50000, payment_method: "CREDIT_CARD" }
              as: ComplianceAdmin
              captures: { bkgB_id: $.data.id }
            - call: "POST /compliance/bookings/${bkgB_id}/flight-segments"
              payload: { sequence_index: 1, flight_number: "ZQ505", origin_iata: "JFK", destination_iata: "MIA", is_international: false, scheduled_departure_utc: "2026-08-13T15:00:00Z", scheduled_arrival_utc: "2026-08-13T18:00:00Z", segment_fare_cents: 50000 }
              as: OpsController
              captures: { segB_id: $.data.id }
            - call: "POST /compliance/consumer-complaints"
              payload: { booking_id: "${bkgA_id}", category: "REFUND", channel: "WEB", received_at_utc: "2026-08-11T08:00:00Z", summary: "Goodwill refund requested after repeated schedule changes" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { cmp_id: $.data.id }
            - call: "POST /compliance/consumer-complaints/${cmp_id}/acknowledge"
              payload: { acknowledged_at_utc: "2026-08-11T09:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /compliance/consumer-complaints/${cmp_id}/answer"
              payload: { disposition: "REFUND_GRANTED", answered_at_utc: "2026-08-11T10:00:00Z", granted_amount_cents: 9000 }
              as: ComplianceOfficer
              as_user_id: "officer-a"
            - call: "GET /compliance/bookings/${bkgA_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { bkgA_v: $.data.version }
          trigger:
            - call: "POST /compliance/refund-obligations"
              payload: { booking_id: "${bkgA_id}", basis: "FARE", issuance_mode: "REQUEST_BASED", expected_booking_version: "${bkgA_v}", flight_segment_id: "${segB_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              is_negative_trigger: true
              note: "Violates priority 75 (segment belongs to booking B) and priority 81 (gross 10000 > headroom 1000)."
            - call: "POST /compliance/refund-obligations"
              payload: { booking_id: "${bkgA_id}", basis: "FARE", issuance_mode: "REQUEST_BASED", expected_booking_version: "${bkgA_v}", flight_segment_id: "${segA_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              is_negative_trigger: true
              note: "Control: correct segment, so only priority 81 is violated."
          assert:
            - "The ${segB_id} call returns ERR_SEGMENT_BOOKING_MISMATCH with HTTP 422 — NOT ERR_REFUND_EXCEEDS_HEADROOM"
            - "The ${segA_id} control call returns ERR_REFUND_EXCEEDS_HEADROOM with HTTP 422, proving priority 81 is live and was merely outranked"
            - "GET /compliance/refund-obligations?booking_id=${bkgA_id} -> data.total_count == 1 (only the GOODWILL_GRANT row) and neither rejected request wrote a row"
            - "Booking.${bkgA_id}.total_refund_obligated_cents == 9000, collected_total_cents == 10000, and version is unchanged from ${bkgA_v}"
            - "GET /compliance/bookings/${bkgA_id}/refund-exposure -> data.remaining_headroom_cents == 1000 and data.request_based_proration_cents == 10000"

  - rule_id: boundary_precision_check
    instances:
      - name: significant_delay_threshold_inclusive_at_180_minutes
        grounds:
          - calculations.significant_delay_determination
          - state_machines.FlightSegment.SCHEDULED_to_DELAYED
          - endpoints[POST /compliance/flight-segments/{id}/declare-disruption]
        distinguishing_aspect: |
          Metric delay_minutes on endpoint POST /compliance/flight-segments/{id}/declare-disruption,
          with an INCLUSIVE `>=` edge: 179 minutes leaves is_significant_delay false and mints
          nothing, while exactly 180 minutes flips it true and mints a FARE obligation of the full
          100000-cent fare.
        test_recipe:
          setup:
            - "Booking of 100000 cents on CREDIT_CARD with two domestic segments of 50000 each; travel has not commenced, so the domestic threshold is 180 minutes."
            - "Segment 1's scheduled arrival is 2026-08-12T17:00:00Z; segment 2's is 2026-08-12T21:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T09:00:00Z" }
              as: ComplianceAdmin
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /compliance/passengers"
              payload: { email: "delay.edge@example.com", full_name: "Della Edge" }
              as: ComplianceAdmin
              captures: { pax_id: $.data.id }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "DLY001", total_fare_cents: 100000, payment_method: "CREDIT_CARD" }
              as: ComplianceAdmin
              captures: { bkg_id: $.data.id }
            - call: "POST /compliance/bookings/${bkg_id}/flight-segments"
              payload: { sequence_index: 1, flight_number: "ZQ101", origin_iata: "LAX", destination_iata: "DEN", is_international: false, scheduled_departure_utc: "2026-08-12T14:00:00Z", scheduled_arrival_utc: "2026-08-12T17:00:00Z", segment_fare_cents: 50000 }
              as: OpsController
              captures: { seg1_id: $.data.id }
            - call: "POST /compliance/bookings/${bkg_id}/flight-segments"
              payload: { sequence_index: 2, flight_number: "ZQ202", origin_iata: "DEN", destination_iata: "ORD", is_international: false, scheduled_departure_utc: "2026-08-12T18:30:00Z", scheduled_arrival_utc: "2026-08-12T21:00:00Z", segment_fare_cents: 50000 }
              as: OpsController
              captures: { seg2_id: $.data.id }
          trigger:
            - call: "POST /compliance/flight-segments/${seg1_id}/declare-disruption"
              payload: { disruption_type: "DELAY", declared_at_utc: "2026-08-11T09:00:00Z", revised_arrival_utc: "2026-08-12T19:59:00Z" }
              as: OpsController
              captures: { d1_minutes: $.data.delay_minutes, d1_significant: $.data.is_significant_delay }
            - call: "POST /compliance/flight-segments/${seg2_id}/declare-disruption"
              payload: { disruption_type: "DELAY", declared_at_utc: "2026-08-11T09:00:00Z", revised_arrival_utc: "2026-08-13T00:00:00Z" }
              as: OpsController
              captures: { d2_minutes: $.data.delay_minutes, d2_significant: $.data.is_significant_delay }
          assert:
            - "FlightSegment.${seg1_id}.delay_minutes == 179 and is_significant_delay == false and status == DELAYED"
            - "FlightSegment.${seg2_id}.delay_minutes == 180 and is_significant_delay == true and status == DELAYED"
            - "GET /compliance/refund-obligations?booking_id=${bkg_id}&basis=FARE -> data.total_count == 1 and data[0].flight_segment_id == ${seg2_id}"
            - "That obligation has amount_cents == 100000, variant_applied == PROACTIVE_FULL_ITINERARY, obligation_start_utc == 2026-08-11T09:00:00Z, deadline_utc == 2026-08-18T09:00:00Z"
            - "Booking.${bkg_id}.total_refund_obligated_cents == 100000 and disruption_posture == REFUND_OBLIGATED"
            - "The 179-minute declaration alone would have left disruption_posture == DISRUPTED with total_refund_obligated_cents == 0"

      - name: tarmac_deadline_strict_at_180_minutes
        grounds:
          - calculations.tarmac_compliance_evaluation
          - endpoints[POST /compliance/tarmac-delay-events/{id}/deplane]
          - entities.TarmacDelayEvent.fields.is_violation
        distinguishing_aspect: |
          A different metric (tarmac_minutes versus deadline_minutes) on a different endpoint
          (POST /compliance/tarmac-delay-events/{id}/deplane), and deliberately the opposite edge
          convention: STRICT `>`. Exactly 180 minutes on the tarmac is compliant while 181 minutes
          is a violation, which is the mirror image of the inclusive `>=` delay edge.
        test_recipe:
          setup:
            - "Booking of 60000 cents with two domestic segments of 30000 each, so tarmac_deplane_deadline_minutes_domestic = 180 applies to both."
            - "Segment 1 carries a tarmac event starting 2026-08-10T14:10:00Z; segment 2 carries one starting 2026-08-10T18:40:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T22:00:00Z" }
              as: ComplianceAdmin
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /compliance/passengers"
              payload: { email: "tarmac.edge@example.com", full_name: "Tarik Edgemont" }
              as: ComplianceAdmin
              captures: { pax_id: $.data.id }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "TMC001", total_fare_cents: 60000, payment_method: "CREDIT_CARD" }
              as: ComplianceAdmin
              captures: { bkg_id: $.data.id }
            - call: "POST /compliance/bookings/${bkg_id}/flight-segments"
              payload: { sequence_index: 1, flight_number: "ZQ101", origin_iata: "LAX", destination_iata: "DEN", is_international: false, scheduled_departure_utc: "2026-08-10T14:00:00Z", scheduled_arrival_utc: "2026-08-10T17:00:00Z", segment_fare_cents: 30000 }
              as: OpsController
              captures: { seg1_id: $.data.id }
            - call: "POST /compliance/bookings/${bkg_id}/flight-segments"
              payload: { sequence_index: 2, flight_number: "ZQ202", origin_iata: "DEN", destination_iata: "ORD", is_international: false, scheduled_departure_utc: "2026-08-10T18:30:00Z", scheduled_arrival_utc: "2026-08-10T21:00:00Z", segment_fare_cents: 30000 }
              as: OpsController
              captures: { seg2_id: $.data.id }
            - call: "POST /compliance/tarmac-delay-events"
              payload: { flight_segment_id: "${seg1_id}", tarmac_start_utc: "2026-08-10T14:10:00Z", phase: "DEPARTURE" }
              as: OpsController
              captures: { evt_180_id: $.data.id }
            - call: "POST /compliance/tarmac-delay-events"
              payload: { flight_segment_id: "${seg2_id}", tarmac_start_utc: "2026-08-10T18:40:00Z", phase: "DEPARTURE" }
              as: OpsController
              captures: { evt_181_id: $.data.id }
          trigger:
            - call: "POST /compliance/tarmac-delay-events/${evt_180_id}/deplane"
              payload: { deplane_completed_utc: "2026-08-10T17:10:00Z" }
              as: OpsController
              captures: { t180_minutes: $.data.tarmac_minutes, t180_violation: $.data.is_violation }
            - call: "POST /compliance/tarmac-delay-events/${evt_181_id}/deplane"
              payload: { deplane_completed_utc: "2026-08-10T21:41:00Z" }
              as: OpsController
              captures: { t181_minutes: $.data.tarmac_minutes, t181_violation: $.data.is_violation }
          assert:
            - "TarmacDelayEvent.${evt_180_id}.tarmac_minutes == 180, deadline_minutes == 180, is_violation == false, status == DEPLANED"
            - "TarmacDelayEvent.${evt_181_id}.tarmac_minutes == 181, deadline_minutes == 180, is_violation == true, status == DEPLANED"
            - "FlightSegment.${seg1_id}.cumulative_tarmac_minutes == 180 and FlightSegment.${seg2_id}.cumulative_tarmac_minutes == 181"
            - "A later file-report on ${evt_180_id} needs no corrective_action_summary while one on ${evt_181_id} does — the strict edge decides the payload contract"

      - name: refund_exposure_zero_segment_empty_set_guard
        grounds:
          - calculations.fare_refund_entitlement
          - endpoints[GET /compliance/bookings/{id}/refund-exposure]
          - calculations.booking_ledger_recompute
        distinguishing_aspect: |
          A third metric (booking.segment_count as the divisor) on a third endpoint
          (GET /compliance/bookings/{id}/refund-exposure): at the degenerate boundary of zero
          segments the REQUEST_BASED branch returns 0 through the empty-set guard instead of
          dividing by zero, while the PROACTIVE branch still returns the full 100000-cent fare, so
          variant_delta_cents equals the whole fare.
        test_recipe:
          setup:
            - "Booking of 100000 cents on CREDIT_CARD with no flight segments at all, so segment_count = 0, unused_segment_count = 0 and travel_commenced = false."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T09:00:00Z" }
              as: ComplianceAdmin
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /compliance/passengers"
              payload: { email: "zero.segments@example.com", full_name: "Zeno Nought" }
              as: ComplianceAdmin
              captures: { pax_id: $.data.id }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "ZRO001", total_fare_cents: 100000, payment_method: "CREDIT_CARD" }
              as: ComplianceAdmin
              captures: { bkg_id: $.data.id }
          trigger:
            - call: "GET /compliance/bookings/${bkg_id}/refund-exposure"
              payload: {}
              as: ComplianceOfficer
              captures: { zero_request_based: $.data.request_based_proration_cents, zero_segment_count: $.data.segment_count }
          assert:
            - "GET /compliance/bookings/${bkg_id}/refund-exposure -> data.segment_count == 0 and data.unused_segment_count == 0 and data.travel_commenced == false"
            - "GET /compliance/bookings/${bkg_id}/refund-exposure -> data.proactive_full_itinerary_cents == 100000"
            - "GET /compliance/bookings/${bkg_id}/refund-exposure -> data.request_based_proration_cents == 0 — the empty-set guard fires and no division is performed"
            - "GET /compliance/bookings/${bkg_id}/refund-exposure -> data.variant_delta_cents == 100000"
            - "GET /compliance/bookings/${bkg_id}/refund-exposure -> data.collected_total_cents == 100000, data.obligated_total_cents == 0, data.remaining_headroom_cents == 100000"
            - "Booking.${bkg_id}.disruption_posture == NORMAL (segment_count = 0 short-circuits the posture ladder) and the request returns HTTP 200, never a 500"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: settlement_blocked_after_source_delay_restored
        grounds:
          - validations[priority 45]
          - state_machines.FlightSegment.DELAYED_to_SCHEDULED
          - state_machines.RefundObligation.UNSETTLED_to_INITIATED
        distinguishing_aspect: |
          Entity pair RefundObligation x FlightSegment. The obligation's own two axes are both in a
          legal state for settlement (ELECTED_CASH / UNSETTLED), yet the write is refused purely
          because the FOREIGN entity that justified it walked its delay back to SCHEDULED. Restoring
          the delay makes the identical request succeed, so the block is a function of the other
          entity's state alone.
        test_recipe:
          setup:
            - "Booking of 100000 cents on CREDIT_CARD with one domestic segment of 100000 whose scheduled arrival is 2026-08-12T17:00:00Z."
            - "A 180-minute delay was declared, so is_significant_delay = true and a proactive FARE obligation of 100000 was minted and elected CASH."
            - "A RESTORED operation then walked the segment back to SCHEDULED with is_significant_delay = false; the obligation was NOT voided."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T09:00:00Z" }
              as: ComplianceAdmin
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /compliance/passengers"
              payload: { email: "rescinded.delay@example.com", full_name: "Reggie Scind" }
              as: ComplianceAdmin
              captures: { pax_id: $.data.id }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "RSC001", total_fare_cents: 100000, payment_method: "CREDIT_CARD" }
              as: ComplianceAdmin
              captures: { bkg_id: $.data.id }
            - call: "POST /compliance/bookings/${bkg_id}/flight-segments"
              payload: { sequence_index: 1, flight_number: "ZQ101", origin_iata: "LAX", destination_iata: "DEN", is_international: false, scheduled_departure_utc: "2026-08-12T14:00:00Z", scheduled_arrival_utc: "2026-08-12T17:00:00Z", segment_fare_cents: 100000 }
              as: OpsController
              captures: { seg_id: $.data.id }
            - call: "POST /compliance/flight-segments/${seg_id}/declare-disruption"
              payload: { disruption_type: "DELAY", declared_at_utc: "2026-08-11T09:00:00Z", revised_arrival_utc: "2026-08-12T20:00:00Z" }
              as: OpsController
            - call: "GET /compliance/refund-obligations"
              payload: { booking_id: "${bkg_id}", basis: "FARE" }
              as: ComplianceOfficer
              captures: { ob_id: "$.data[0].id" }
            - call: "POST /compliance/refund-obligations/${ob_id}/elect"
              payload: { election: "CASH" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /compliance/flight-segments/${seg_id}/record-operation"
              payload: { operation: "RESTORED", occurred_at_utc: "2026-08-11T10:00:00Z" }
              as: OpsController
          trigger:
            - call: "POST /compliance/refund-obligations/${ob_id}/initiate-settlement"
              payload: { processor_reference: "PROC-RSC-1" }
              as: ComplianceOfficer
              as_user_id: "officer-b"
              is_negative_trigger: true
              note: "The obligation itself is settleable; the source segment is no longer disrupted."
            - call: "POST /compliance/flight-segments/${seg_id}/declare-disruption"
              payload: { disruption_type: "DELAY", declared_at_utc: "2026-08-11T11:00:00Z", revised_arrival_utc: "2026-08-12T20:00:00Z" }
              as: OpsController
            - call: "POST /compliance/refund-obligations/${ob_id}/initiate-settlement"
              payload: { processor_reference: "PROC-RSC-2" }
              as: ComplianceOfficer
              as_user_id: "officer-b"
          assert:
            - "After RESTORED: FlightSegment.${seg_id}.status == SCHEDULED, disruption_type == NONE, delay_minutes == 0, is_significant_delay == false, revised_arrival_utc == null"
            - "After RESTORED: RefundObligation.${ob_id}.settlement_status is still UNSETTLED and amount_cents is still 100000 — the obligation is not voided by the restore"
            - "The first initiate-settlement returns ERR_SOURCE_DISRUPTION_RESCINDED with HTTP 409 and settlement_attempt_count stays 0"
            - "After the delay is re-declared, FlightSegment.${seg_id}.delay_minutes == 180 and is_significant_delay == true, and no SECOND FARE obligation is created (total_count stays 1)"
            - "The second initiate-settlement succeeds: settlement_status == INITIATED, settlement_attempt_count == 1, settlement_initiated_by_user_id == officer-b"
            - "Booking.${bkg_id}.total_refund_obligated_cents == 100000 at every step"

      - name: report_submit_blocked_by_open_complaint_in_period
        grounds:
          - validations[priority 46]
          - state_machines.RegulatorReport.DRAFT_to_SUBMITTED
          - calculations.regulator_report_metrics
        distinguishing_aspect: |
          A different entity pair: RegulatorReport x ConsumerComplaint. The report is a valid DRAFT
          whose period has closed, but the submit is refused because a complaint received inside the
          closed-closed window is still open. Answering that complaint — touching nothing on the
          report — makes the same submit succeed and freezes the seven metrics.
        test_recipe:
          setup:
            - "One PolicyProfile, one Passenger, one Booking of 40000 cents with one domestic segment of 40000."
            - "A REFUND complaint received 2026-06-10T10:00:00Z is acknowledged but left unanswered, so its status is ACKNOWLEDGED."
            - "A DRAFT report covers the closed-closed period 2026-06-01T00:00:00Z .. 2026-06-30T23:59:59Z, and the clock is moved to 2026-07-05T12:00:00Z so the period has ended."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T10:00:00Z" }
              as: ComplianceAdmin
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /compliance/passengers"
              payload: { email: "open.complaint@example.com", full_name: "Olive Pending" }
              as: ComplianceAdmin
              captures: { pax_id: $.data.id }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "OPN001", total_fare_cents: 40000, payment_method: "CREDIT_CARD" }
              as: ComplianceAdmin
              captures: { bkg_id: $.data.id }
            - call: "POST /compliance/bookings/${bkg_id}/flight-segments"
              payload: { sequence_index: 1, flight_number: "ZQ101", origin_iata: "LAX", destination_iata: "DEN", is_international: false, scheduled_departure_utc: "2026-06-12T14:00:00Z", scheduled_arrival_utc: "2026-06-12T17:00:00Z", segment_fare_cents: 40000 }
              as: OpsController
              captures: { seg_id: $.data.id }
            - call: "POST /compliance/consumer-complaints"
              payload: { booking_id: "${bkg_id}", category: "REFUND", channel: "PHONE", received_at_utc: "2026-06-10T10:00:00Z", summary: "Asks why the refund has not arrived" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { cmp_id: $.data.id }
            - call: "POST /compliance/consumer-complaints/${cmp_id}/acknowledge"
              payload: { acknowledged_at_utc: "2026-06-11T09:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
            - call: "GET /compliance/policy-profiles/${pol_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { pol_v: $.data.version }
            - call: "POST /compliance/regulator-reports"
              payload: { policy_profile_id: "${pol_id}", period_start_utc: "2026-06-01T00:00:00Z", period_end_utc: "2026-06-30T23:59:59Z", expected_policy_profile_version: "${pol_v}" }
              as: ComplianceAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T12:00:00Z" }
              as: ComplianceAdmin
          trigger:
            - call: "POST /compliance/regulator-reports/${rep_id}/submit"
              payload: { submitted_at_utc: "2026-07-05T12:00:00Z" }
              as: ComplianceAdmin
              is_negative_trigger: true
              note: "The report is a valid DRAFT and the period has closed; only the foreign complaint's state blocks it."
            - call: "POST /compliance/consumer-complaints/${cmp_id}/answer"
              payload: { disposition: "POLICY_EXPLAINED", answered_at_utc: "2026-07-05T12:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /compliance/regulator-reports/${rep_id}/submit"
              payload: { submitted_at_utc: "2026-07-05T12:00:00Z" }
              as: ComplianceAdmin
          assert:
            - "The first submit returns ERR_OPEN_COMPLAINT_IN_PERIOD with HTTP 409 and RegulatorReport.${rep_id}.status is still DRAFT with all seven metrics still 0"
            - "ConsumerComplaint.${cmp_id}.status == ANSWERED and disposition == POLICY_EXPLAINED after the answer"
            - "The second submit succeeds: RegulatorReport.${rep_id}.status == SUBMITTED and submitted_at_utc == 2026-07-05T12:00:00Z"
            - "RegulatorReport.${rep_id}.complaint_count == 1, disability_complaint_count == 0, late_answer_count == 0, tarmac_violation_count == 0, involuntary_denied_boarding_count == 0, refund_obligation_cents_total == 0, overdue_refund_count == 0"
            - "RegulatorReport.${rep_id}.policy_version_pinned equals the PolicyProfile version observed at submit time"
            - "A complaint received 2026-07-02T10:00:00Z would NOT block this submit — the window is closed-closed on 2026-06-30T23:59:59Z"

      - name: tarmac_report_blocked_while_segment_still_scheduled
        grounds:
          - validations[priority 47]
          - state_machines.TarmacDelayEvent.DEPLANED_to_REPORT_FILED
          - state_machines.FlightSegment.SCHEDULED_to_DEPARTED
        distinguishing_aspect: |
          A third entity pair: TarmacDelayEvent x FlightSegment. The event is DEPLANED and
          non-violating, so its own branch requires no corrective action, yet file-report is refused
          while the parent leg is still SCHEDULED. Recording DEPARTED on the leg — a write against a
          different entity — unblocks the identical request.
        test_recipe:
          setup:
            - "Booking of 30000 cents with one domestic segment of 30000 that is still SCHEDULED."
            - "One tarmac event on that segment ran exactly 180 minutes and was deplaned, so is_violation = false."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T22:00:00Z" }
              as: ComplianceAdmin
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /compliance/passengers"
              payload: { email: "report.gate@example.com", full_name: "Reba Gatewood" }
              as: ComplianceAdmin
              captures: { pax_id: $.data.id }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "RPG001", total_fare_cents: 30000, payment_method: "CREDIT_CARD" }
              as: ComplianceAdmin
              captures: { bkg_id: $.data.id }
            - call: "POST /compliance/bookings/${bkg_id}/flight-segments"
              payload: { sequence_index: 1, flight_number: "ZQ101", origin_iata: "LAX", destination_iata: "DEN", is_international: false, scheduled_departure_utc: "2026-08-10T14:00:00Z", scheduled_arrival_utc: "2026-08-10T17:00:00Z", segment_fare_cents: 30000 }
              as: OpsController
              captures: { seg_id: $.data.id }
            - call: "POST /compliance/tarmac-delay-events"
              payload: { flight_segment_id: "${seg_id}", tarmac_start_utc: "2026-08-10T14:10:00Z", phase: "DEPARTURE" }
              as: OpsController
              captures: { evt_id: $.data.id }
            - call: "POST /compliance/tarmac-delay-events/${evt_id}/deplane"
              payload: { deplane_completed_utc: "2026-08-10T17:10:00Z" }
              as: OpsController
          trigger:
            - call: "POST /compliance/tarmac-delay-events/${evt_id}/file-report"
              payload: { report_reference: "TDR-GATE-1", filed_at_utc: "2026-08-10T22:00:00Z" }
              as: ComplianceAdmin
              is_negative_trigger: true
              note: "Parent FlightSegment is still SCHEDULED, so priority 47 fires even though the event itself is in a legal DEPLANED state."
            - call: "POST /compliance/flight-segments/${seg_id}/record-operation"
              payload: { operation: "DEPARTED", occurred_at_utc: "2026-08-10T17:30:00Z" }
              as: OpsController
            - call: "POST /compliance/tarmac-delay-events/${evt_id}/file-report"
              payload: { report_reference: "TDR-GATE-1", filed_at_utc: "2026-08-10T22:00:00Z" }
              as: ComplianceAdmin
          assert:
            - "TarmacDelayEvent.${evt_id}.tarmac_minutes == 180 and is_violation == false and status == DEPLANED before the first file-report"
            - "The first file-report returns ERR_SEGMENT_STATE_INVALID with HTTP 409 and TarmacDelayEvent.${evt_id}.report_reference is still null"
            - "FlightSegment.${seg_id}.status == DEPARTED and actual_departure_utc == 2026-08-10T17:30:00Z after record-operation"
            - "The second file-report succeeds: status == REPORT_FILED, report_reference == TDR-GATE-1, corrective_action_summary == null (never required on a non-violating event)"
            - "FlightSegment.${seg_id}.cumulative_tarmac_minutes == 180 and exempted_tarmac_event_count == 0 throughout"

  - rule_id: resource_temporal_overlap
    instances:
      - name: tarmac_intervals_touch_allowed_overlap_rejected
        grounds:
          - validations[priority 65]
          - calculations.tarmac_compliance_evaluation
          - entities.FlightSegment.fields.cumulative_tarmac_minutes
        distinguishing_aspect: |
          Resource entity: one FlightSegment as the exclusive tarmac resource. Interval semantics:
          HALF-OPEN [tarmac_start_utc, interval_end_utc), so a second event may begin at the exact
          instant the first ended (21:40:00Z is accepted) while any earlier start inside the closed
          portion is rejected.
        test_recipe:
          setup:
            - "Booking of 30000 cents with one domestic segment of 30000 whose scheduled_departure_utc is 2026-08-10T18:30:00Z."
            - "Event 1 occupies [2026-08-10T18:40:00Z, 2026-08-10T21:40:00Z) after being deplaned at exactly 180 minutes."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T23:00:00Z" }
              as: ComplianceAdmin
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /compliance/passengers"
              payload: { email: "touch.interval@example.com", full_name: "Tova Touchpoint" }
              as: ComplianceAdmin
              captures: { pax_id: $.data.id }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "TCH001", total_fare_cents: 30000, payment_method: "CREDIT_CARD" }
              as: ComplianceAdmin
              captures: { bkg_id: $.data.id }
            - call: "POST /compliance/bookings/${bkg_id}/flight-segments"
              payload: { sequence_index: 1, flight_number: "ZQ202", origin_iata: "DEN", destination_iata: "ORD", is_international: false, scheduled_departure_utc: "2026-08-10T18:30:00Z", scheduled_arrival_utc: "2026-08-10T21:00:00Z", segment_fare_cents: 30000 }
              as: OpsController
              captures: { seg_id: $.data.id }
            - call: "POST /compliance/tarmac-delay-events"
              payload: { flight_segment_id: "${seg_id}", tarmac_start_utc: "2026-08-10T18:40:00Z", phase: "DEPARTURE" }
              as: OpsController
              captures: { evt1_id: $.data.id }
            - call: "POST /compliance/tarmac-delay-events/${evt1_id}/deplane"
              payload: { deplane_completed_utc: "2026-08-10T21:40:00Z" }
              as: OpsController
          trigger:
            - call: "POST /compliance/tarmac-delay-events"
              payload: { flight_segment_id: "${seg_id}", tarmac_start_utc: "2026-08-10T21:40:00Z", phase: "ARRIVAL" }
              as: OpsController
              captures: { evt2_id: $.data.id }
            - call: "POST /compliance/tarmac-delay-events/${evt2_id}/deplane"
              payload: { deplane_completed_utc: "2026-08-10T22:00:00Z" }
              as: OpsController
            - call: "POST /compliance/tarmac-delay-events"
              payload: { flight_segment_id: "${seg_id}", tarmac_start_utc: "2026-08-10T21:50:00Z", phase: "ARRIVAL" }
              as: OpsController
              is_negative_trigger: true
              note: "21:50:00Z falls strictly inside event 2's [21:40:00Z, 22:00:00Z) interval."
          assert:
            - "TarmacDelayEvent.${evt1_id}.tarmac_minutes == 180, interval_end_utc == 2026-08-10T21:40:00Z, is_violation == false"
            - "The event starting at exactly 2026-08-10T21:40:00Z is ACCEPTED with HTTP 201 — touching intervals do not overlap under half-open semantics"
            - "TarmacDelayEvent.${evt2_id}.tarmac_minutes == 20, phase == ARRIVAL, is_violation == false"
            - "The event starting at 2026-08-10T21:50:00Z returns ERR_TARMAC_INTERVAL_OVERLAP with HTTP 409"
            - "GET /compliance/flight-segments/${seg_id}/tarmac-delay-events -> data.total_count == 2"
            - "FlightSegment.${seg_id}.cumulative_tarmac_minutes == 200 (180 + 20), summed in tarmac_start_utc ASC order"

      - name: report_periods_closed_inclusive_boundary_collision
        grounds:
          - validations[priority 66]
          - calculations.regulator_report_metrics
          - concurrency_rules.report-create-stale-policy
        distinguishing_aspect: |
          A different resource entity (PolicyProfile as the reporting-period resource) with the
          OPPOSITE interval semantics: reporting periods are CLOSED on both ends, so sharing the
          single instant 2026-06-30T23:59:59Z IS an intersection and is rejected — exactly the case
          the half-open tarmac resource permits.
        test_recipe:
          setup:
            - "One PolicyProfile with no reports yet; the clock sits at 2026-08-01T00:00:00Z so every period below is already closed."
            - "Report 1 covers the closed-closed period 2026-06-01T00:00:00Z .. 2026-06-30T23:59:59Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdmin
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              captures: { pol_id: $.data.id }
            - call: "GET /compliance/policy-profiles/${pol_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { pol_v0: $.data.version }
            - call: "POST /compliance/regulator-reports"
              payload: { policy_profile_id: "${pol_id}", period_start_utc: "2026-06-01T00:00:00Z", period_end_utc: "2026-06-30T23:59:59Z", expected_policy_profile_version: "${pol_v0}" }
              as: ComplianceAdmin
              captures: { rep1_id: $.data.id }
            - call: "GET /compliance/policy-profiles/${pol_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { pol_v1: $.data.version }
          trigger:
            - call: "POST /compliance/regulator-reports"
              payload: { policy_profile_id: "${pol_id}", period_start_utc: "2026-06-30T23:59:59Z", period_end_utc: "2026-07-31T23:59:59Z", expected_policy_profile_version: "${pol_v1}" }
              as: ComplianceAdmin
              is_negative_trigger: true
              note: "Shares exactly one boundary instant with report 1, which is an intersection under closed-closed semantics."
            - call: "GET /compliance/policy-profiles/${pol_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { pol_v2: $.data.version }
            - call: "POST /compliance/regulator-reports"
              payload: { policy_profile_id: "${pol_id}", period_start_utc: "2026-07-01T00:00:00Z", period_end_utc: "2026-07-31T23:59:59Z", expected_policy_profile_version: "${pol_v2}" }
              as: ComplianceAdmin
              captures: { rep2_id: $.data.id }
          assert:
            - "The period starting exactly 2026-06-30T23:59:59Z returns ERR_REPORT_PERIOD_OVERLAP with HTTP 409"
            - "The rejected create leaves PolicyProfile.${pol_id}.report_count == 1 and its version unchanged, so ${pol_v2} equals ${pol_v1}"
            - "The period starting 2026-07-01T00:00:00Z is ACCEPTED with HTTP 201: RegulatorReport.${rep2_id}.status == DRAFT and period_start_utc == 2026-07-01T00:00:00Z"
            - "PolicyProfile.${pol_id}.report_count == 2 after the accepted create"
            - "GET /compliance/policy-profiles/${pol_id}/regulator-reports -> data.total_count == 2 and no two periods share an instant"
            - "Sharing one instant is rejected here while the tarmac resource accepts a touching start — the two resources use deliberately different interval geometry"

  - rule_id: compensating_invariant
    instances:
      - name: ancillary_obligation_void_restores_obligated_cents_ledger
        grounds:
          - calculations.obligated_cents_conservation
          - state_machines.RefundObligation.UNSETTLED_to_VOIDED
          - calculations.booking_ledger_recompute
        distinguishing_aspect: |
          Conserved quantity Q1 — booking.total_refund_obligated_cents minus the sum of non-VOIDED
          obligation amounts. Voiding the 4500-cent ancillary obligation as CREATED_IN_ERROR must
          drive the ledger from 106400 back to exactly 101900 with no residual drift, and must also
          reverse the ancillary's own delivery flags.
        test_recipe:
          setup:
            - "Booking of 100000 cents on CREDIT_CARD with three domestic segments priced 20000 / 40000 / 40000, plus a 4500 SEAT_SELECTION and a 1900 ENTERTAINMENT ancillary on segment 2, so collected_total_cents = 106400."
            - "Segment 2 was cancelled, which minted three obligations (100000 FARE, 4500 ANCILLARY, 1900 ANCILLARY) and set total_refund_obligated_cents = 106400."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T18:00:00Z" }
              as: ComplianceAdmin
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /compliance/passengers"
              payload: { email: "q1.conserve@example.com", full_name: "Quinn Conserve" }
              as: ComplianceAdmin
              captures: { pax_id: $.data.id }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "QON001", total_fare_cents: 100000, payment_method: "CREDIT_CARD" }
              as: ComplianceAdmin
              captures: { bkg_id: $.data.id }
            - call: "POST /compliance/bookings/${bkg_id}/flight-segments"
              payload: { sequence_index: 1, flight_number: "ZQ101", origin_iata: "LAX", destination_iata: "DEN", is_international: false, scheduled_departure_utc: "2026-08-12T14:00:00Z", scheduled_arrival_utc: "2026-08-12T17:00:00Z", segment_fare_cents: 20000 }
              as: OpsController
              captures: { seg1_id: $.data.id }
            - call: "POST /compliance/bookings/${bkg_id}/flight-segments"
              payload: { sequence_index: 2, flight_number: "ZQ202", origin_iata: "DEN", destination_iata: "ORD", is_international: false, scheduled_departure_utc: "2026-08-12T18:30:00Z", scheduled_arrival_utc: "2026-08-12T21:00:00Z", segment_fare_cents: 40000 }
              as: OpsController
              captures: { seg2_id: $.data.id }
            - call: "POST /compliance/bookings/${bkg_id}/flight-segments"
              payload: { sequence_index: 3, flight_number: "ZQ303", origin_iata: "ORD", destination_iata: "BOS", is_international: false, scheduled_departure_utc: "2026-08-13T13:00:00Z", scheduled_arrival_utc: "2026-08-13T16:00:00Z", segment_fare_cents: 40000 }
              as: OpsController
              captures: { seg3_id: $.data.id }
            - call: "POST /compliance/ancillary-purchases"
              payload: { booking_id: "${bkg_id}", flight_segment_id: "${seg2_id}", service_type: "SEAT_SELECTION", amount_cents: 4500 }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { anc_seat_id: $.data.id }
            - call: "POST /compliance/ancillary-purchases"
              payload: { booking_id: "${bkg_id}", flight_segment_id: "${seg2_id}", service_type: "ENTERTAINMENT", amount_cents: 1900 }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { anc_ife_id: $.data.id }
            - call: "POST /compliance/flight-segments/${seg2_id}/declare-disruption"
              payload: { disruption_type: "CANCELLATION", declared_at_utc: "2026-08-10T18:00:00Z" }
              as: OpsController
            - call: "GET /compliance/refund-obligations"
              payload: { booking_id: "${bkg_id}", ancillary_purchase_id: "${anc_seat_id}" }
              as: ComplianceOfficer
              captures: { ob_seat_id: "$.data[0].id" }
          trigger:
            - call: "POST /compliance/refund-obligations/${ob_seat_id}/void"
              payload: { void_reason: "CREATED_IN_ERROR" }
              as: ComplianceAdmin
          assert:
            - "Before the void: Booking.${bkg_id}.total_refund_obligated_cents == 106400"
            - "RefundObligation.${ob_seat_id}.settlement_status == VOIDED and void_reason == CREATED_IN_ERROR; amount_cents is still 4500 (the row is not deleted)"
            - "After the void: Booking.${bkg_id}.total_refund_obligated_cents == 101900 exactly (106400 - 4500), with zero drift"
            - "Q1 == 0: 101900 equals the sum of the two remaining non-VOIDED obligation amounts (100000 + 1900)"
            - "AncillaryPurchase.${anc_seat_id}.delivery_status == PENDING_DELIVERY, non_provision_reason == null, refund_obligation_created == false"
            - "AncillaryPurchase.${anc_ife_id} is untouched: delivery_status == NOT_PROVIDED and refund_obligation_created == true"
            - "Booking.${bkg_id}.collected_total_cents is still 106400, disruption_posture is still REFUND_OBLIGATED, earliest_refund_deadline_utc is still 2026-08-17T18:00:00Z"
            - "Booking.${bkg_id}.suppressed_obligation_count is still 0 — voiding never rewrites the suppression counter"

      - name: credit_settlement_reversal_restores_travel_credit_balance
        grounds:
          - calculations.travel_credit_conservation
          - calculations.travel_credit_bonus
          - state_machines.RefundObligation.SETTLED_to_VOIDED
        distinguishing_aspect: |
          A different conserved quantity — Q2, the passenger's travel_credit_balance_cents against
          the sum of SETTLED travel-credit payable totals. Q2 includes the 8000-cent goodwill bonus
          that Q1 deliberately excludes, so the reversal must remove 88000 (not 80000) from the
          balance while the booking ledger moves by only 80000.
        test_recipe:
          setup:
            - "Booking of 80000 cents on CREDIT_CARD with one domestic segment of 80000, cancelled at 2026-08-10T18:00:00Z so a proactive FARE obligation of 80000 exists."
            - "The Passenger elects TRAVEL_CREDIT themselves, so no officer consent artifact is needed and a 10 percent bonus of 8000 is added, making payable_total_cents = 88000."
            - "The credit is initiated by officer-b and completed SUCCEEDED by officer-c, raising travel_credit_balance_cents to 88000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T18:00:00Z" }
              as: ComplianceAdmin
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /compliance/passengers"
              payload: { email: "q2.credit@example.com", full_name: "Credence Q. Two" }
              as: ComplianceAdmin
              captures: { pax_id: $.data.id }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "QTW001", total_fare_cents: 80000, payment_method: "CREDIT_CARD" }
              as: ComplianceAdmin
              captures: { bkg_id: $.data.id }
            - call: "POST /compliance/bookings/${bkg_id}/flight-segments"
              payload: { sequence_index: 1, flight_number: "ZQ101", origin_iata: "LAX", destination_iata: "DEN", is_international: false, scheduled_departure_utc: "2026-08-12T14:00:00Z", scheduled_arrival_utc: "2026-08-12T17:00:00Z", segment_fare_cents: 80000 }
              as: OpsController
              captures: { seg_id: $.data.id }
            - call: "POST /compliance/flight-segments/${seg_id}/declare-disruption"
              payload: { disruption_type: "CANCELLATION", declared_at_utc: "2026-08-10T18:00:00Z" }
              as: OpsController
            - call: "GET /compliance/refund-obligations"
              payload: { booking_id: "${bkg_id}", basis: "FARE" }
              as: ComplianceOfficer
              captures: { ob_id: "$.data[0].id" }
            - call: "POST /compliance/refund-obligations/${ob_id}/elect"
              payload: { election: "TRAVEL_CREDIT" }
              as: Passenger
              as_user_id: "${pax_id}"
            - call: "POST /compliance/refund-obligations/${ob_id}/initiate-settlement"
              payload: { processor_reference: "PROC-QTW-1" }
              as: ComplianceOfficer
              as_user_id: "officer-b"
            - call: "POST /compliance/refund-obligations/${ob_id}/complete-settlement"
              payload: { outcome: "SUCCEEDED" }
              as: ComplianceOfficer
              as_user_id: "officer-c"
          trigger:
            - call: "POST /compliance/refund-obligations/${ob_id}/void"
              payload: { void_reason: "SETTLEMENT_REVERSED" }
              as: ComplianceAdmin
          assert:
            - "Before the void: RefundObligation.${ob_id}.amount_cents == 80000, credit_bonus_cents == 8000, payable_total_cents == 88000, settlement_method == TRAVEL_CREDIT, election_source == PASSENGER"
            - "Before the void: Passenger.${pax_id}.travel_credit_balance_cents == 88000 and Booking.${bkg_id}.disruption_posture == CLOSED_OUT"
            - "Before the void: Booking.${bkg_id}.total_refund_obligated_cents == 80000 — the 8000 bonus was never inside Q1"
            - "After the void: RefundObligation.${ob_id}.settlement_status == VOIDED, void_reason == SETTLEMENT_REVERSED, settled_at_utc retained (not null)"
            - "After the void: Passenger.${pax_id}.travel_credit_balance_cents == 0 exactly — the full 88000 including the bonus is clawed back"
            - "Q2 == 0: no obligation of this passenger has settlement_method == TRAVEL_CREDIT with settlement_status == SETTLED, and the balance is 0"
            - "After the void: Booking.${bkg_id}.total_refund_obligated_cents == 0 and earliest_refund_deadline_utc == null"
            - "After the void: Booking.${bkg_id}.disruption_posture == DISRUPTED — no non-VOIDED obligation remains but the segment still carries disruption_type == CANCELLATION"
