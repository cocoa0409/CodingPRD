      - name: an_acquisition_on_a_stale_fund_version_is_refused
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[property-acquire-stale-fund]"
          - "errors[ERR_STALE_FUND_VERSION]"
          - "endpoints[POST /timberland/properties/{id}/acquire]"
          - "calculations.insurance_premium_and_risk_score"
        distinguishing_aspect: |
          Capital commitment is guarded on the FUND version, because the cash that funds a closing can
          be spent by any other treasury write. An insurance placement of 21131.04 moves the fund 1 ->
          2 between the read and the closing, so the acquire must answer 412 ERR_STALE_FUND_VERSION even
          though 378868.96 of cash easily covers the 100000.00 bid — the point is that the closer's view
          of cash is out of date, not that it is insufficient.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; fund with 400000.00 opening cash and 500000.00 committed capital."
            - "Piney Creek Tract (SOUTH, insured 4200000.00) has a cruise-closed LOBLOLLY_PINE stand, a SIGNED appraisal and an APPROVED 100000.00 case."
            - "Fund version 1 is captured, then a risk review places ACTUARIAL cover at 21131.04 (composite 32.40 on a 15960.00 base)."
