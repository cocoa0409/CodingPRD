            - call: "PATCH /child-find/providers/${slp_id}"
              payload: { max_weekly_service_minutes: 200 }
              as: DistrictAdmin
            - call: "PATCH /child-find/providers/${slp_id}"
              payload: { max_weekly_service_minutes: 160 }
              as: DistrictAdmin
            - call: "PATCH /child-find/providers/${slp_id}"
              payload: { status: "ON_LEAVE", max_weekly_service_minutes: 1500 }
              as: DistrictAdmin
            - call: "POST /child-find/service-lines/${line2_id}/staff"
              payload: { provider_id: "${slp_id}", expected_provider_version: "${slp_v2}", delivery_site_id: "${site1_id}" }
              as: PlacementAdministrator
          assert:
            - "first response.data.assigned_weekly_service_minutes == 160"
            - "first response.data.max_weekly_service_minutes == 400"
            - "first response.data.service_capacity_posture == \"OPEN\""
            - "second response.status_code == 200"
            - "second response.data.max_weekly_service_minutes == 200"
            - "second response.data.assigned_weekly_service_minutes == 160"
            - "second response.data.service_capacity_posture == \"NEAR_CAPACITY\""
            - "third response.data.max_weekly_service_minutes == 160"
            - "third response.data.service_capacity_posture == \"AT_CAPACITY\""
            - "fourth response.data.status == \"ON_LEAVE\""
            - "fourth response.data.service_capacity_posture == \"OPEN\""
            - "fifth response.status_code == 412"
            - "fifth response.data.error_id == \"ERR_STALE_PROVIDER_VERSION\""
            - "ServiceLine.${line2_id}.status == \"PROPOSED\""

      - name: an_attended_refer_outcome_opens_a_screening_sourced_referral
        claim_type: conditional_action
        grounds:
          - endpoints[POST /child-find/screening-slots/{id}/outcome].side_effects
          - endpoints[GET /child-find/referrals]
        distinguishing_aspect: |
          The same endpoint with the same attendance value branches on
          screening_result: REFER mints a Referral with source SCREENING,
          originating_screening_slot_id pointing back at the slot, intake
          RECEIVED and consent NOT_REQUESTED, while PASS mints nothing. The new
          row is reachable only through the list filter, and it flips its child's
          status to REFERRED while the passing child stays NO_ACTIVE_REFERRAL.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "An OPEN screening event at host-approved S1 with two children booked into 30-minute slots."
          setup_api_calls:
            - call: "POST /child-find/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /child-find/community-sites"
              payload: { name: "Sunrise Coop", region_code: "R-1", licensed_capacity: 40, iep_seat_capacity: 2, languages_supported: ["en"], screening_host_approved: true, status: "ACTIVE" }
              as: PlacementAdministrator
              captures: { site1_id: "$.data.id" }
            - call: "POST /child-find/children"
              payload: { first_name: "Ann", last_name: "A", date_of_birth: "2023-08-01", guardian_full_name: "G A", district_of_residence: "D-01", primary_language_code: "en" }
              as: ChildFindCoordinator
              captures: { childA_id: "$.data.id" }
            - call: "POST /child-find/children"
              payload: { first_name: "Bo", last_name: "B", date_of_birth: "2023-08-01", guardian_full_name: "G B", district_of_residence: "D-01", primary_language_code: "en" }
              as: ChildFindCoordinator
              captures: { childB_id: "$.data.id" }
            - call: "POST /child-find/screening-events"
              payload: { site_id: "${site1_id}", event_label: "Fall child find", window_start_utc: "2026-08-20T09:00:00Z", window_end_utc: "2026-08-20T12:00:00Z", slot_capacity: 4, slot_length_minutes: 30 }
              as: ChildFindCoordinator
              captures: { event_id: "$.data.id" }
            - call: "POST /child-find/screening-events/${event_id}/status"
              payload: { target_status: "OPEN" }
              as: ChildFindCoordinator
              captures: { event_v1: "$.data.version" }
            - call: "POST /child-find/screening-events/${event_id}/slots"
              payload: { child_id: "${childA_id}", slot_start_utc: "2026-08-20T09:00:00Z", expected_screening_event_version: "${event_v1}" }
              as: ChildFindCoordinator
              captures: { slotA_id: "$.data.id" }
            - call: "GET /child-find/screening-events/${event_id}"
              payload: {}
              as: ChildFindCoordinator
              captures: { event_v2: "$.data.version" }
            - call: "POST /child-find/screening-events/${event_id}/slots"
              payload: { child_id: "${childB_id}", slot_start_utc: "2026-08-20T09:30:00Z", expected_screening_event_version: "${event_v2}" }
              as: ChildFindCoordinator
              captures: { slotB_id: "$.data.id" }
          trigger:
            - call: "POST /child-find/screening-slots/${slotA_id}/outcome"
              payload: { attendance: "ATTENDED", screening_result: "REFER" }
              as: ChildFindCoordinator
            - call: "POST /child-find/screening-slots/${slotB_id}/outcome"
              payload: { attendance: "ATTENDED", screening_result: "PASS" }
              as: ChildFindCoordinator
            - call: "GET /child-find/referrals"
              payload: { originating_screening_slot_id: "${slotA_id}" }
              as: ChildFindCoordinator
            - call: "GET /child-find/referrals"
              payload: { originating_screening_slot_id: "${slotB_id}" }
              as: ChildFindCoordinator
            - call: "GET /child-find/children/${childA_id}"
              payload: {}
              as: ChildFindCoordinator
            - call: "GET /child-find/children/${childB_id}"
              payload: {}
              as: ChildFindCoordinator
          assert:
            - "first response.status_code == 200"
            - "first response.data.status == \"ATTENDED\""
            - "first response.data.screening_result == \"REFER\""
            - "second response.data.screening_result == \"PASS\""
            - "third response.meta.total_count == 1"
            - "third response.data[0].source == \"SCREENING\""
            - "third response.data[0].intake_status == \"RECEIVED\""
            - "third response.data[0].consent_status == \"NOT_REQUESTED\""
            - "third response.data[0].child_id == \"${childA_id}\""
            - "third response.data[0].eligibility_pathway == \"STANDARD_60_DAY\""
            - "fourth response.meta.total_count == 0"
            - "fifth response.data.status == \"REFERRED\""
            - "sixth response.data.status == \"NO_ACTIVE_REFERRAL\""
            - "ScreeningEvent.${event_id}.booked_slot_count == 2"

      - name: referral_list_filters_compose_with_pagination_and_total_count
        claim_type: listing
        grounds:
          - endpoints[GET /child-find/referrals]
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          total_count describes the FILTERED set, not the page and not the table:
          three referrals exist, two still at intake RECEIVED, and an
          intake_status filter with limit 1 reports total_count 2 with has_more
          true on the first page and has_more false on the second, while a
          child_id filter narrows total_count to 1 and a source filter that
          matches nothing returns an empty page with total_count 0.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Three referred children; child C's referral has a consent notice out, so its intake_status is CONSENT_PENDING."
          setup_api_calls:
            - call: "POST /child-find/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /child-find/children"
              payload: { first_name: "Ann", last_name: "A", date_of_birth: "2023-08-01", guardian_full_name: "G A", district_of_residence: "D-01", primary_language_code: "en" }
              as: ChildFindCoordinator
              captures: { childA_id: "$.data.id" }
            - call: "POST /child-find/referrals"
              payload: { child_id: "${childA_id}", source: "PEDIATRICIAN", referring_provider_npi: "1234567893" }
              as: ChildFindCoordinator
              captures: { referralA_id: "$.data.id" }
            - call: "POST /child-find/children"
              payload: { first_name: "Bo", last_name: "B", date_of_birth: "2023-08-01", guardian_full_name: "G B", district_of_residence: "D-01", primary_language_code: "en" }
              as: ChildFindCoordinator
              captures: { childB_id: "$.data.id" }
            - call: "POST /child-find/referrals"
              payload: { child_id: "${childB_id}", source: "PARENT" }
              as: ChildFindCoordinator
              captures: { referralB_id: "$.data.id" }
            - call: "POST /child-find/children"
              payload: { first_name: "Cy", last_name: "C", date_of_birth: "2023-08-01", guardian_full_name: "G C", district_of_residence: "D-01", primary_language_code: "en" }
              as: ChildFindCoordinator
              captures: { childC_id: "$.data.id" }
            - call: "POST /child-find/referrals"
              payload: { child_id: "${childC_id}", source: "SCHOOL" }
              as: ChildFindCoordinator
              captures: { referralC_id: "$.data.id" }
            - call: "POST /child-find/referrals/${referralC_id}/consent-requests"
              payload: { notice_language_code: "en", notice_delivery_method: "MAIL" }
              as: ChildFindCoordinator
              captures: { consentC_id: "$.data.id" }
          trigger:
            - call: "GET /child-find/referrals"
              payload: { intake_status: "RECEIVED", limit: 1, offset: 0 }
              as: ChildFindCoordinator
            - call: "GET /child-find/referrals"
              payload: { intake_status: "RECEIVED", limit: 1, offset: 1 }
              as: ChildFindCoordinator
            - call: "GET /child-find/referrals"
              payload: { child_id: "${childC_id}" }
              as: ChildFindCoordinator
            - call: "GET /child-find/referrals"
              payload: { source: "PART_C_TRANSITION" }
              as: ChildFindCoordinator
            - call: "GET /child-find/referrals"
              payload: { limit: 100, offset: 0 }
              as: ChildFindCoordinator
          assert:
            - "first response.status_code == 200"
            - "first response.meta.total_count == 2"
            - "first response.meta.has_more == true"
            - "first response.meta.limit == 1"
            - "first response.meta.offset == 0"
            - "second response.meta.total_count == 2"
            - "second response.meta.has_more == false"
            - "third response.meta.total_count == 1"
            - "third response.data[0].intake_status == \"CONSENT_PENDING\""
            - "fourth response.meta.total_count == 0"
            - "fifth response.meta.total_count == 3"
            - "fifth response.meta.has_more == false"

      - name: action_endpoint_preconditions_and_transitions
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /child-find/evaluation-cases/{id}/revision-requests]
        excluded_because:
          difficulty_instance: non_linear_state_machine / evaluation_case_report_revision_cycle_terminates_at_two_rounds
          rationale: "The action's transition, its counter side effect and its refusal at the limit are all asserted there."

      - name: computed_read_matches_the_calculation
        claim_type: computed_read
        grounds:
