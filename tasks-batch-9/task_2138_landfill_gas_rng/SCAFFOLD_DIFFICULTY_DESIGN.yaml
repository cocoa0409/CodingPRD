            - "RoyaltyStatement.${rs1_id}.dispute_reason == 'ATTRIBUTE_QA_HOLD'"
            - "RoyaltyStatement.${rs1_id}.royalty_amount_usd == 1711.50"
            - "LandfillSite.${site_id}.royalty_payable_usd == 0.0"
            - "LandfillSite.${site_id}.compliance_posture == WATCH"
            - "LandfillSite.${site_id}.rin_available_count == 3988"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: decommissioned_well_state_beats_lockout_window_conflict
        grounds:
          - validations[priority=80]
          - validations[priority=110]
          - errors[ERR_WELL_DECOMMISSIONED]
          - errors[ERR_WELL_LOCKOUT_CONFLICT]
          - calculations.work_order_lockout_occupancy
        distinguishing_aspect: |
          Error-category pair `state` (priority 80, ERR_WELL_DECOMMISSIONED) versus
          `business_temporal` (priority 110, ERR_WELL_LOCKOUT_CONFLICT). One request violates
          both - the well is DECOMMISSIONED and the buffered window collides with a PLANNED job -
          and the response must be the priority-80 state error, 409 ERR_WELL_DECOMMISSIONED.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T00:00:00Z."
            - "One LandfillSite and one GasWell W-01."
            - "One PLANNED WorkOrder on W-01 with window 2026-08-12T08:00:00Z to 2026-08-12T12:00:00Z, so its buffered occupancy is the closed interval [2026-08-12T06:00:00Z, 2026-08-12T14:00:00Z]."
            - "W-01 then moved to operating_state DECOMMISSIONED; the PLANNED work order is deliberately left in place and keeps occupying its buffered window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectAdmin
            - call: "POST /sites"
              payload: { name: "Rolling Hills Landfill", state_code: "CA", host_royalty_pct: 0.12, royalty_variant: "GROSS_REVENUE_SHARE", permit_nmoc_limit_lb_per_hr: 3.5 }
              as: ProjectAdmin
              captures: { site_id: $.data.id }
            - call: "POST /wells"
              payload: { site_id: "${site_id}", well_code: "W-01", target_flow_scfm: 500.0 }
              as: ProjectAdmin
              captures: { w1_id: $.data.id }
            - call: "POST /work-orders"
              payload: { well_id: "${w1_id}", work_type: "WELL_RETUNE", window_start: "2026-08-12T08:00:00Z", window_end: "2026-08-12T12:00:00Z" }
              as: WellfieldTechnician
              captures: { wo1_id: $.data.id }
            - call: "POST /wells/${w1_id}/status"
              payload: { to_state: "DECOMMISSIONED", reason: "Well abandoned under the closure plan" }
              as: ProjectAdmin
          trigger:
            - call: "POST /work-orders"
              payload: { well_id: "${w1_id}", work_type: "LATERAL_REPAIR", window_start: "2026-08-12T13:00:00Z", window_end: "2026-08-12T15:00:00Z" }
              as: WellfieldTechnician
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 409"
            - "data.error_id == 'ERR_WELL_DECOMMISSIONED'"
            - "data.error_id != 'ERR_WELL_LOCKOUT_CONFLICT'"
            - "GET /work-orders?well_id=${w1_id} still returns total_count == 1 and only WorkOrder.${wo1_id}"
            - "WorkOrder.${wo1_id}.status == PLANNED"

      - name: plant_off_spec_safety_beats_nomination_volume_fiscal
        grounds:
          - validations[priority=90]
          - validations[priority=130]
          - errors[ERR_PLANT_OFF_SPEC]
          - errors[ERR_NOMINATION_VOLUME_EXCEEDED]
          - state_machines.InjectionBatch.ON_SPEC_to_NOMINATED
        distinguishing_aspect: |
          A different error-category pair from the work-order instance: `business_safety`
          (priority 90, ERR_PLANT_OFF_SPEC) versus `business_fiscal` (priority 130,
          ERR_NOMINATION_VOLUME_EXCEEDED). The nominate call violates both - the plant's
          spec_status is OFF_SPEC and 340.14 MMBtu does not fit inside a 100 dth nomination -
          and the safety error must win.
        test_recipe:
          setup:
            - "Producing site with plant in UPGRADING; a CONFIRMED PipelineNomination for only 100.0 dth (committed_dth 0)."
            - "InjectionBatch A with gross_mmbtu 340.14 in status ON_SPEC."
            - "InjectionBatch B with methane_pct 94.0 analysed to OFF_SPEC, which pushed ProcessingPlant.spec_status to OFF_SPEC."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectAdmin
            - call: "POST /sites"
              payload: { name: "Rolling Hills Landfill", state_code: "CA", host_royalty_pct: 0.12, royalty_variant: "GROSS_REVENUE_SHARE", permit_nmoc_limit_lb_per_hr: 3.5 }
              as: ProjectAdmin
              captures: { site_id: $.data.id }
            - call: "POST /plants"
              payload: { site_id: "${site_id}", plant_code: "P1", receipt_point_code: "RP-7", receipt_point_mdq_dth_per_day: 4800.0, min_feed_scfm: 900.0 }
              as: ProjectAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /wells"
              payload: { site_id: "${site_id}", well_code: "W-01", target_flow_scfm: 500.0 }
              as: ProjectAdmin
              captures: { w1_id: $.data.id }
            - call: "POST /wells"
              payload: { site_id: "${site_id}", well_code: "W-02", target_flow_scfm: 500.0 }
              as: ProjectAdmin
              captures: { w2_id: $.data.id }
            - call: "POST /wells/${w1_id}/readings"
              payload: { taken_at: "2026-08-10T01:00:00Z", methane_pct: 55.0, oxygen_pct: 0.8, nitrogen_pct: 4.0, temperature_f: 118.0, flow_scfm: 480.0, vacuum_inhg: 22.5 }
              as: WellfieldTechnician
            - call: "POST /wells/${w2_id}/readings"
              payload: { taken_at: "2026-08-10T01:00:00Z", methane_pct: 55.0, oxygen_pct: 0.8, nitrogen_pct: 4.0, temperature_f: 118.0, flow_scfm: 470.0, vacuum_inhg: 22.5 }
              as: WellfieldTechnician
            - call: "POST /plants/${plant_id}/status"
              payload: { process_mode: "UPGRADING" }
              as: PlantOperator
            - call: "POST /offtake-contracts"
              payload: { site_id: "${site_id}", counterparty_name: "Bluewater Energy", contract_mdq_dth_per_day: 3000.0, price_usd_per_dth: 5.25, term_start: "2026-08-01T00:00:00Z", term_end: "2027-08-01T00:00:00Z" }
              as: CommercialScheduler
              captures: { contract_id: $.data.id }
            - call: "POST /offtake-contracts/${contract_id}/status"
              payload: { to_status: "ACTIVE" }
              as: CommercialScheduler
              captures: { ctr_v1: $.data.version }
            - call: "POST /pipeline-nominations"
              payload: { contract_id: "${contract_id}", plant_id: "${plant_id}", gas_day_start: "2026-08-10T00:00:00Z", gas_day_end: "2026-08-11T00:00:00Z", nominated_dth: 100.0, expected_contract_version: "${ctr_v1}" }
              as: CommercialScheduler
              captures: { nom_id: $.data.id }
            - call: "POST /pipeline-nominations/${nom_id}/status"
              payload: { to_status: "CONFIRMED" }
              as: CommercialScheduler
            - call: "POST /injection-batches"
              payload: { plant_id: "${plant_id}", interval_start: "2026-08-10T02:00:00Z", interval_end: "2026-08-10T05:00:00Z", hourly_volumes_mscf: [115.0, 115.0, 115.0], methane_pct: 97.4, oxygen_pct: 0.1, co2_pct: 1.4 }
              as: PlantOperator
              captures: { ba_id: $.data.id }
            - call: "POST /injection-batches/${ba_id}/status"
              payload: { to_status: "PENDING_ANALYSIS" }
              as: PlantOperator
            - call: "POST /injection-batches"
              payload: { plant_id: "${plant_id}", interval_start: "2026-08-10T06:00:00Z", interval_end: "2026-08-10T08:00:00Z", hourly_volumes_mscf: [110.0, 110.0], methane_pct: 94.0, oxygen_pct: 0.1, co2_pct: 1.4 }
              as: PlantOperator
              captures: { bb_id: $.data.id }
            - call: "POST /injection-batches/${bb_id}/status"
              payload: { to_status: "PENDING_ANALYSIS" }
              as: PlantOperator
          trigger:
            - call: "POST /injection-batches/${ba_id}/status"
              payload: { to_status: "NOMINATED", nomination_id: "${nom_id}" }
              as: CommercialScheduler
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 409"
            - "data.error_id == 'ERR_PLANT_OFF_SPEC'"
            - "data.error_id != 'ERR_NOMINATION_VOLUME_EXCEEDED'"
            - "InjectionBatch.${ba_id}.status == ON_SPEC"
            - "InjectionBatch.${ba_id}.nomination_id is null"
            - "PipelineNomination.${nom_id}.status == CONFIRMED"
            - "PipelineNomination.${nom_id}.committed_dth == 0.0"

  - rule_id: boundary_precision_check
    instances:
      - name: oxygen_at_exactly_five_percent_isolates_while_four_ninety_nine_throttles
        grounds:
          - calculations.reading_quality_classification
          - entities.WellTuningReading.fields.air_intrusion_index
          - state_machines.GasWell.ONLINE_to_THROTTLED
          - state_machines.GasWell.ONLINE_to_ISOLATED
        distinguishing_aspect: |
          Numeric threshold boundary on a single metric, reached through POST /wells/{id}/readings:
          O2_ALARM_PCT is an INCLUSIVE floor, so oxygen_pct 5.00 classifies ALARM and isolates the
          well while 4.99 classifies WATCH and only throttles it. The AII_ALARM constant is 24.00
          precisely so the composite index (17.66 and 17.70) never masks the oxygen comparison.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T00:00:00Z."
            - "One LandfillSite and two GasWells W-01 and W-02, both freshly created and therefore ONLINE with current_flow_scfm 0 and no readings."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectAdmin
            - call: "POST /sites"
              payload: { name: "Rolling Hills Landfill", state_code: "CA", host_royalty_pct: 0.12, royalty_variant: "GROSS_REVENUE_SHARE", permit_nmoc_limit_lb_per_hr: 3.5 }
              as: ProjectAdmin
              captures: { site_id: $.data.id }
            - call: "POST /wells"
              payload: { site_id: "${site_id}", well_code: "W-01", target_flow_scfm: 500.0 }
              as: ProjectAdmin
              captures: { w1_id: $.data.id }
            - call: "POST /wells"
              payload: { site_id: "${site_id}", well_code: "W-02", target_flow_scfm: 500.0 }
              as: ProjectAdmin
              captures: { w2_id: $.data.id }
          trigger:
            - call: "POST /wells/${w1_id}/readings"
              payload: { taken_at: "2026-08-10T02:00:00Z", methane_pct: 60.0, oxygen_pct: 4.99, nitrogen_pct: 2.0, temperature_f: 120.0, flow_scfm: 500.0, vacuum_inhg: 24.0 }
              as: WellfieldTechnician
              captures: { r1_class: $.data.quality_class, r1_aii: $.data.air_intrusion_index }
            - call: "POST /wells/${w2_id}/readings"
              payload: { taken_at: "2026-08-10T02:00:00Z", methane_pct: 60.0, oxygen_pct: 5.00, nitrogen_pct: 2.0, temperature_f: 120.0, flow_scfm: 500.0, vacuum_inhg: 24.0 }
              as: WellfieldTechnician
              captures: { r2_class: $.data.quality_class, r2_aii: $.data.air_intrusion_index }
          assert:
            - "${r1_aii} == 17.66"
            - "${r1_class} == 'WATCH'"
            - "The W-01 reading's resulting_well_state == THROTTLED"
            - "GasWell.${w1_id}.operating_state == THROTTLED"
            - "GasWell.${w1_id}.current_flow_scfm == 300.0"
            - "${r2_aii} == 17.70"
            - "${r2_class} == 'ALARM'"
            - "The W-02 reading's resulting_well_state == ISOLATED"
            - "GasWell.${w2_id}.operating_state == ISOLATED"
            - "GasWell.${w2_id}.current_flow_scfm == 0"
            - "LandfillSite.${site_id}.collected_flow_scfm == 300.0"

      - name: royalty_statement_over_empty_injected_batch_set
        grounds:
          - calculations.royalty_settlement
          - entities.RoyaltyStatement.fields.billable_mmbtu
          - entities.RoyaltyStatement.fields.royalty_amount_usd
          - state_machines.InjectionBatch.ON_SPEC_to_DIVERTED_TO_FLARE
        distinguishing_aspect: |
          A different boundary metric on a different endpoint: empty-collection cardinality on
          POST /royalty-statements. August contains one batch, but it is DIVERTED_TO_FLARE and
          therefore outside the INJECTED-only input set, so the aggregation runs over an empty
          set and every money field including royalty_amount_usd must be exactly 0.0 with the
          statement still created 201 in DRAFT - not an error, not a null.
        test_recipe:
          setup:
            - "Producing site with one InjectionBatch of gross_mmbtu 340.14 that was analysed ON_SPEC and then DIVERTED_TO_FLARE, so no INJECTED batch exists for August 2026."
            - "Logical clock advanced to 2026-09-05T00:00:00Z so period 2026-08 is closed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectAdmin
            - call: "POST /sites"
              payload: { name: "Rolling Hills Landfill", state_code: "CA", host_royalty_pct: 0.12, royalty_variant: "GROSS_REVENUE_SHARE", permit_nmoc_limit_lb_per_hr: 3.5, royalty_floor_usd_per_mmbtu: 0.25 }
              as: ProjectAdmin
              captures: { site_id: $.data.id }
            - call: "POST /plants"
              payload: { site_id: "${site_id}", plant_code: "P1", receipt_point_code: "RP-7", receipt_point_mdq_dth_per_day: 4800.0, min_feed_scfm: 900.0 }
              as: ProjectAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /wells"
              payload: { site_id: "${site_id}", well_code: "W-01", target_flow_scfm: 500.0 }
              as: ProjectAdmin
              captures: { w1_id: $.data.id }
            - call: "POST /wells"
              payload: { site_id: "${site_id}", well_code: "W-02", target_flow_scfm: 500.0 }
              as: ProjectAdmin
              captures: { w2_id: $.data.id }
            - call: "POST /wells/${w1_id}/readings"
              payload: { taken_at: "2026-08-10T01:00:00Z", methane_pct: 55.0, oxygen_pct: 0.8, nitrogen_pct: 4.0, temperature_f: 118.0, flow_scfm: 480.0, vacuum_inhg: 22.5 }
              as: WellfieldTechnician
            - call: "POST /wells/${w2_id}/readings"
              payload: { taken_at: "2026-08-10T01:00:00Z", methane_pct: 55.0, oxygen_pct: 0.8, nitrogen_pct: 4.0, temperature_f: 118.0, flow_scfm: 470.0, vacuum_inhg: 22.5 }
              as: WellfieldTechnician
            - call: "POST /plants/${plant_id}/status"
              payload: { process_mode: "UPGRADING" }
              as: PlantOperator
            - call: "POST /injection-batches"
              payload: { plant_id: "${plant_id}", interval_start: "2026-08-10T02:00:00Z", interval_end: "2026-08-10T05:00:00Z", hourly_volumes_mscf: [115.0, 115.0, 115.0], methane_pct: 97.4, oxygen_pct: 0.1, co2_pct: 1.4 }
              as: PlantOperator
              captures: { b1_id: $.data.id }
            - call: "POST /injection-batches/${b1_id}/status"
              payload: { to_status: "PENDING_ANALYSIS" }
              as: PlantOperator
            - call: "POST /injection-batches/${b1_id}/status"
              payload: { to_status: "DIVERTED_TO_FLARE" }
              as: PlantOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: ProjectAdmin
            - call: "GET /sites/${site_id}"
              as: ProjectAdmin
              captures: { site_v1: $.data.version }
          trigger:
            - call: "POST /royalty-statements"
              payload: { site_id: "${site_id}", period: "2026-08", expected_site_version: "${site_v1}" }
              as: ProjectAdmin
              captures: { rs_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "RoyaltyStatement.${rs_id}.status == DRAFT"
            - "RoyaltyStatement.${rs_id}.variant_applied == GROSS_REVENUE_SHARE"
            - "RoyaltyStatement.${rs_id}.billable_mmbtu == 0.0"
            - "RoyaltyStatement.${rs_id}.gas_revenue_usd == 0.0"
            - "RoyaltyStatement.${rs_id}.attribute_revenue_usd == 0.0"
            - "RoyaltyStatement.${rs_id}.gross_revenue_usd == 0.0"
            - "RoyaltyStatement.${rs_id}.calculated_amount_usd == 0.0"
            - "RoyaltyStatement.${rs_id}.floor_amount_usd == 0.0"
            - "RoyaltyStatement.${rs_id}.royalty_amount_usd == 0.0"
            - "LandfillSite.${site_id}.energy_flared_mmbtu == 340.14"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: batch_analysis_gated_on_processing_plant_process_mode
        grounds:
          - state_machines.InjectionBatch.DRAFT_to_PENDING_ANALYSIS
          - state_machines.ProcessingPlant.STARTUP_to_UPGRADING
          - entities.ProcessingPlant.fields.process_mode
          - errors[ERR_PLANT_NOT_UPGRADING]
        distinguishing_aspect: |
          Entity pair InjectionBatch -> ProcessingPlant. The identical POST
          /injection-batches/{id}/status call fails with ERR_PLANT_NOT_UPGRADING while the plant
          sits in STARTUP and succeeds - landing the batch on ON_SPEC - once and only once the
          plant's process_mode is UPGRADING. The batch's own state (DRAFT) is unchanged between
          the two calls.
