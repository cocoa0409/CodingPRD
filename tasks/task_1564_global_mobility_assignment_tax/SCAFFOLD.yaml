    side_effects: []
  - method: GET
    path: "/mobility/settlements"
    description: "List settlements (FK reverse-reachability) Results ordered by created_at ascending (stable creation order)."
    roles: [MobilityAdmin, BusinessUnitApprover, MobilityApprover, PayrollSpecialist, FinanceController, VendorCoordinator, TaxVendor, Assignee, Any]
    code: 200
    input: ["assignment_id?", "tax_year?", "status?", "vendor_engagement_id?", "limit?", "offset?"]
    output: "Settlement[]"
    side_effects: []
  - method: POST
    path: "/mobility/settlements/{id}/submit"
    description: "Submit settlement for finance review"
    roles: [PayrollSpecialist]
    code: 200
    input: []
    output: Settlement
    side_effects: ["status -> PENDING_REVIEW"]
  - method: POST
    path: "/mobility/settlements/{id}/approve"
    description: "Approve settlement (SoD: approver != creator); ZERO-amount settlements transition directly to SETTLED with no chargeback entry"
    roles: [FinanceController]
    code: 200
    input: []
    output: Settlement
    side_effects: ["status -> APPROVED (nonzero) or -> SETTLED (zero amount, no ChargebackEntry created)"]
  - method: POST
    path: "/mobility/settlements/{id}/dispute"
    description: "Assignee disputes a pending settlement (owner-only)"
    roles: [Assignee]
    code: 200
    input: ["reason?"]
    output: Settlement
    side_effects: ["status -> DISPUTED; dispute_reason recorded"]
  - method: POST
    path: "/mobility/settlements/{id}/recalculate"
    description: "Recompute a disputed settlement from current POSTED records and the filed engagement (cyclic revision loop)"
    roles: [PayrollSpecialist]
    code: 200
    input: []
    output: Settlement
    side_effects: ["status -> CALCULATED; settlement_reconciliation re-run; dispute_reason cleared"]
  - method: POST
    path: "/mobility/settlements/{id}/settle"
    description: "Settle an approved nonzero settlement; creates the SETTLEMENT chargeback entry and cascades YTD + posture"
    roles: [FinanceController]
    code: 200
    input: []
    output: Settlement
    side_effects: ["status -> SETTLED; ChargebackEntry(SETTLEMENT, ACCRUED, amount=settlement_amount_cents) created; Assignment.ytd_chargeback_cents updated; overrun_posture_check"]

  # --- VendorEngagement ---
  - method: POST
    path: "/mobility/vendor-engagements"
    description: "Engage a tax return preparation vendor for a tax year"
    roles: [VendorCoordinator]
    code: 201
    input: [assignment_id, tax_year, scope, vendor_name, fee_cents]
    output: VendorEngagement
    side_effects: ["status=ENGAGED, revision_count=0; ERR_DUPLICATE_ENGAGEMENT when a non-CLOSED engagement exists for the year"]
  - method: GET
    path: "/mobility/vendor-engagements/{id}"
    description: "Get a vendor engagement"
    roles: [MobilityAdmin, BusinessUnitApprover, MobilityApprover, PayrollSpecialist, FinanceController, VendorCoordinator, TaxVendor, Assignee, Any]
    code: 200
    input: []
    output: VendorEngagement
    side_effects: []
  - method: GET
    path: "/mobility/vendor-engagements"
    description: "List vendor engagements (FK reverse-reachability) Results ordered by created_at ascending (stable creation order)."
    roles: [MobilityAdmin, BusinessUnitApprover, MobilityApprover, PayrollSpecialist, FinanceController, VendorCoordinator, TaxVendor, Assignee, Any]
    code: 200
    input: ["assignment_id?", "tax_year?", "status?", "limit?", "offset?"]
    output: "VendorEngagement[]"
    side_effects: []
  - method: POST
    path: "/mobility/vendor-engagements/{id}/send-data"
    description: "Send tax data package to vendor"
    roles: [VendorCoordinator]
    code: 200
    input: []
    output: VendorEngagement
    side_effects: ["status -> DATA_SENT"]
  - method: POST
    path: "/mobility/vendor-engagements/{id}/return-draft"
    description: "Vendor returns a draft return (from DATA_SENT or REVISION_REQUESTED)"
    roles: [TaxVendor]
    code: 200
    input: []
    output: VendorEngagement
    side_effects: ["status -> DRAFT_RETURNED"]
  - method: POST
    path: "/mobility/vendor-engagements/{id}/start-review"
    description: "Begin internal review of the returned draft"
    roles: [VendorCoordinator]
    code: 200
    input: []
    output: VendorEngagement
    side_effects: ["status -> UNDER_REVIEW"]
  - method: POST
    path: "/mobility/vendor-engagements/{id}/request-revision"
    description: "Send draft back for revision (cyclic; increments revision_count)"
    roles: [VendorCoordinator]
    code: 200
    input: []
    output: VendorEngagement
    side_effects: ["status -> REVISION_REQUESTED; revision_count += 1"]
  - method: POST
    path: "/mobility/vendor-engagements/{id}/accept"
    description: "Accept the reviewed draft"
    roles: [VendorCoordinator]
    code: 200
    input: []
    output: VendorEngagement
    side_effects: ["status -> ACCEPTED"]
  - method: POST
    path: "/mobility/vendor-engagements/{id}/mark-filed"
    description: "Record that the return was filed, with filed totals"
    roles: [VendorCoordinator]
    code: 200
    input: [filed_total_gross_cents, filed_home_tax_cents]
    output: VendorEngagement
    side_effects: ["status -> FILED; filed_total_gross_cents/filed_home_tax_cents recorded; unlocks Settlement creation"]
  - method: POST
    path: "/mobility/vendor-engagements/{id}/close"
    description: "Close a filed engagement"
    roles: [VendorCoordinator]
    code: 200
    input: []
    output: VendorEngagement
    side_effects: ["status -> CLOSED"]

  # --- CertificateOfCoverage ---
  - method: POST
    path: "/mobility/certificates-of-coverage"
    description: "Apply for a certificate of coverage under a social security totalization agreement"
    roles: [VendorCoordinator]
    code: 201
    input: [assignment_id, application_ref]
    output: CertificateOfCoverage
    side_effects: ["status=REQUESTED; ERR_COC_ALREADY_OPEN when a REQUESTED/SUBMITTED/ISSUED certificate exists"]
  - method: GET
    path: "/mobility/certificates-of-coverage/{id}"
    description: "Get a certificate"
    roles: [MobilityAdmin, BusinessUnitApprover, MobilityApprover, PayrollSpecialist, FinanceController, VendorCoordinator, TaxVendor, Assignee, Any]
    code: 200
    input: []
    output: CertificateOfCoverage
    side_effects: []
  - method: GET
    path: "/mobility/certificates-of-coverage"
    description: "List certificates (FK reverse-reachability) Results ordered by created_at ascending (stable creation order)."
    roles: [MobilityAdmin, BusinessUnitApprover, MobilityApprover, PayrollSpecialist, FinanceController, VendorCoordinator, TaxVendor, Assignee, Any]
    code: 200
    input: ["assignment_id?", "limit?", "offset?"]
    output: "CertificateOfCoverage[]"
    side_effects: []
  - method: POST
    path: "/mobility/certificates-of-coverage/{id}/submit"
    description: "Submit the totalization application"
    roles: [VendorCoordinator]
    code: 200
    input: []
    output: CertificateOfCoverage
    side_effects: ["status -> SUBMITTED"]
  - method: POST
    path: "/mobility/certificates-of-coverage/{id}/mark-issued"
    description: "Record certificate issuance with coverage window (also re-application path from REJECTED)"
    roles: [VendorCoordinator]
    code: 200
    input: [valid_from, valid_until]
    output: CertificateOfCoverage
    side_effects: ["status -> ISSUED; valid_from/valid_until recorded; PayrollSplit.coc_exempt -> true"]
  - method: POST
    path: "/mobility/certificates-of-coverage/{id}/mark-rejected"
    description: "Record rejection of the application"
    roles: [VendorCoordinator]
    code: 200
    input: []
    output: CertificateOfCoverage
    side_effects: ["status -> REJECTED; frees the one-open-certificate slot"]

  # --- CostProjection ---
  - method: POST
    path: "/mobility/cost-projections"
    description: "Create a cost projection for an assignment (OCC-guarded create-with-supersede); variant is PROVISIONAL before any POSTED record, ACTUALIZED after"
    roles: [FinanceController, MobilityAdmin]
    code: 201
    input: [assignment_id, expected_assignment_version]
    output: CostProjection
    side_effects: ["status=CURRENT; prior CURRENT projection -> SUPERSEDED; computes variant, projected_months, monthly_cost_cents, total_projected_cents; increments Assignment.version by 1; ERR_STALE_ASSIGNMENT_VERSION on OCC mismatch; ERR_PACKAGE_NOT_APPROVED unless an APPROVED CompensationPackage exists; ERR_SPLIT_NOT_ACTIVE unless an ACTIVE PayrollSplit exists"]
  - method: GET
    path: "/mobility/cost-projections/{id}"
    description: "Get a cost projection"
    roles: [MobilityAdmin, BusinessUnitApprover, MobilityApprover, PayrollSpecialist, FinanceController, VendorCoordinator, TaxVendor, Assignee, Any]
    code: 200
    input: []
    output: CostProjection
    side_effects: []
  - method: GET
    path: "/mobility/cost-projections"
    description: "List cost projections (FK reverse-reachability) Results ordered by created_at ascending (stable creation order)."
    roles: [MobilityAdmin, BusinessUnitApprover, MobilityApprover, PayrollSpecialist, FinanceController, VendorCoordinator, TaxVendor, Assignee, Any]
    code: 200
    input: ["assignment_id?", "status?", "limit?", "offset?"]
    output: "CostProjection[]"
    side_effects: []

  # --- ExtensionRequest ---
  - method: POST
    path: "/mobility/extension-requests"
    description: "Request an assignment extension (OCC-guarded create-with-supersede); supersedes any prior PENDING request"
    roles: [MobilityAdmin]
    code: 201
    input: [assignment_id, requested_new_end_date, expected_assignment_version, "reason?"]
    output: ExtensionRequest
    side_effects: ["status=PENDING; prior PENDING request -> SUPERSEDED; increments Assignment.version by 1; ERR_INVALID_STATE unless Assignment.status == ACTIVE; ERR_EXTENSION_NOT_FORWARD; ERR_MAX_DURATION_EXCEEDED; ERR_STALE_ASSIGNMENT_VERSION"]
  - method: GET
    path: "/mobility/extension-requests/{id}"
    description: "Get an extension request"
    roles: [MobilityAdmin, BusinessUnitApprover, MobilityApprover, PayrollSpecialist, FinanceController, VendorCoordinator, TaxVendor, Assignee, Any]
    code: 200
    input: []
    output: ExtensionRequest
    side_effects: []
  - method: GET
    path: "/mobility/extension-requests"
    description: "List extension requests (FK reverse-reachability) Results ordered by created_at ascending (stable creation order)."
    roles: [MobilityAdmin, BusinessUnitApprover, MobilityApprover, PayrollSpecialist, FinanceController, VendorCoordinator, TaxVendor, Assignee, Any]
    code: 200
    input: ["assignment_id?", "status?", "limit?", "offset?"]
    output: "ExtensionRequest[]"
    side_effects: []
  - method: POST
    path: "/mobility/extension-requests/{id}/approve"
    description: "Approve an extension; gates on assignment ACTIVE, cost posture NORMAL, and certificate coverage reaching the new end date"
    roles: [BusinessUnitApprover]
    code: 200
    input: []
    output: ExtensionRequest
    side_effects: ["status -> APPROVED; Assignment.planned_end_date = requested_new_end_date; Assignment.version incremented by 1; ERR_COC_COVERAGE_GAP; ERR_COST_OVERRUN_BLOCKED"]
  - method: POST
    path: "/mobility/extension-requests/{id}/decline"
    description: "Decline an extension request"
    roles: [BusinessUnitApprover]
    code: 200
    input: []
    output: ExtensionRequest
    side_effects: ["status -> DECLINED"]

  # --- ChargebackEntry ---
  - method: GET
    path: "/mobility/chargeback-entries/{id}"
    description: "Get a chargeback entry"
    roles: [MobilityAdmin, BusinessUnitApprover, MobilityApprover, PayrollSpecialist, FinanceController, VendorCoordinator, TaxVendor, Assignee, Any]
    code: 200
    input: []
    output: ChargebackEntry
    side_effects: []
  - method: GET
    path: "/mobility/chargeback-entries"
    description: "List chargeback entries (FK reverse-reachability; sole discovery channel for cascade-created entries) Results ordered by created_at ascending (stable creation order)."
    roles: [MobilityAdmin, BusinessUnitApprover, MobilityApprover, PayrollSpecialist, FinanceController, VendorCoordinator, TaxVendor, Assignee, Any]
    code: 200
    input: ["assignment_id?", "entry_type?", "status?", "source_record_id?", "source_settlement_id?", "limit?", "offset?"]
    output: "ChargebackEntry[]"
    side_effects: []
  - method: POST
    path: "/mobility/chargeback-entries/{id}/post"
    description: "Post an accrued chargeback entry to the business unit"
    roles: [FinanceController]
    code: 200
    input: []
    output: ChargebackEntry
    side_effects: ["status -> POSTED; MobilityProgram.total_posted_chargeback_cents += amount_cents"]
  - method: POST
    path: "/mobility/chargeback-entries/{id}/void"
    description: "Void an accrued or posted chargeback entry (compensates program and assignment totals)"
    roles: [FinanceController]
    code: 200
    input: []
    output: ChargebackEntry
    side_effects: ["status -> VOIDED; if was POSTED: MobilityProgram.total_posted_chargeback_cents -= amount_cents; Assignment.ytd_chargeback_cents -= amount_cents; overrun_posture_check re-runs"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing or empty"
  - id: ERR_FORBIDDEN_FOR_ROLE
    http: 403
    condition: "Role not permitted for this endpoint, or Assignee X-User-ID does not own the target assignment's resource"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path id or body FK references a non-existent resource (validated left-to-right)"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, enum outside declared set, numeric constraint violated (negative amount, pct outside 0..100, period_month outside 1..12), or end date not after start date"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource not in a from-state of the invoked transition; terminal states reject all transitions; creation gated on a parent/aggregate state"
  - id: ERR_STALE_ASSIGNMENT_VERSION
    http: 412
    condition: "expected_assignment_version differs from the Assignment's current version on an OCC-guarded endpoint"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "Same X-User-ID attempted both sides of a controlled step: package creator approving own package, settlement creator approving own settlement, or mobility approver equal to bu_approved_by_user_id"
  - id: ERR_PACKAGE_NOT_APPROVED
    http: 409
    condition: "approve-mobility without an APPROVED CompensationPackage for the assignment"
  - id: ERR_SPLIT_NOT_ACTIVE
    http: 409
    condition: "Shadow payroll record create/post without an ACTIVE PayrollSplit, or approve-mobility without one"
  - id: ERR_COC_REQUIRED
    http: 409
    condition: "approve-mobility on a totalization_applies assignment without an ISSUED CertificateOfCoverage"
  - id: ERR_COC_COVERAGE_GAP
    http: 409
    condition: "Extension approve where the ISSUED certificate's valid_until is before requested_new_end_date (or no ISSUED certificate exists) on a totalization_applies assignment"
  - id: ERR_VENDOR_NOT_FILED
    http: 409
    condition: "Settlement create/recalculate without a FILED (or CLOSED-after-FILED) VendorEngagement for the (assignment_id, tax_year)"
  - id: ERR_ASSIGNMENT_OVERLAP
    http: 409
    condition: "Same employee has another assignment in DRAFT, PENDING_BU_APPROVAL, PENDING_MOBILITY_APPROVAL, ACTIVE, or REPATRIATION_PENDING whose closed [start_date, planned_end_date] interval intersects the new one (touching endpoints conflict)"
  - id: ERR_POLICY_WINDOW_OVERLAP
    http: 409
    condition: "Another AllowancePolicy for the same host_country_code (all policies are ACTIVE in v1) has a half-open [effective_from, effective_to) window intersecting the new one (adjacency allowed)"
  - id: ERR_EXTENSION_NOT_FORWARD
    http: 422
    condition: "requested_new_end_date is not strictly after the assignment's current planned_end_date"
  - id: ERR_MAX_DURATION_EXCEEDED
    http: 422
    condition: "planned_end_date (or requested_new_end_date) would exceed start_date + MobilityProgram.max_assignment_duration_days"
  - id: ERR_PERIOD_OUTSIDE_ASSIGNMENT
    http: 422
    condition: "Shadow payroll record's (tax_year, period_month) does not intersect the assignment's [start_date, planned_end_date] window"
  - id: ERR_SPLIT_SUM_INVALID
    http: 422
    condition: "home_payroll_pct + host_payroll_pct != 100"
  - id: ERR_DUPLICATE_PAYROLL_PERIOD
    http: 409
    condition: "A ShadowPayrollRecord with status DRAFT or POSTED already exists for (assignment_id, tax_year, period_month)"
  - id: ERR_PER_DIEM_DAYS_INVALID
    http: 422
    condition: "per_diem_days exceeds the number of days in the period month (or is negative)"
  - id: ERR_PER_DIEM_ANNUAL_CAP_EXCEEDED
    http: 409
    condition: "Posting would push cumulative per_diem_days for the assignment's tax_year strictly past MobilityProgram.per_diem_annual_day_cap (exactly reaching the cap is allowed)"
  - id: ERR_DUPLICATE_PACKAGE
    http: 409
    condition: "An open (DRAFT/SUBMITTED/APPROVED) CompensationPackage already exists for the assignment"
  - id: ERR_DUPLICATE_SPLIT
    http: 409
    condition: "An open (DRAFT/ACTIVE/SUSPENDED) PayrollSplit already exists for the assignment"
  - id: ERR_DUPLICATE_ENGAGEMENT
    http: 409
    condition: "A non-CLOSED VendorEngagement already exists for (assignment_id, tax_year)"
  - id: ERR_COC_ALREADY_OPEN
    http: 409
    condition: "A CertificateOfCoverage in REQUESTED, SUBMITTED, or ISSUED already exists for the assignment"
  - id: ERR_DUPLICATE_SETTLEMENT
    http: 409
    condition: "An open (CALCULATED/PENDING_REVIEW/APPROVED/DISPUTED) Settlement already exists for (assignment_id, tax_year)"
  - id: ERR_COST_OVERRUN_BLOCKED
    http: 409
    condition: "Extension approve attempted while Assignment.cost_posture == OVERRUN"
  - id: ERR_ENGAGEMENT_NOT_FINAL
    http: 409
    condition: "complete-repatriation attempted while a VendorEngagement for the assignment is neither FILED nor CLOSED"
  - id: ERR_UNSETTLED_LEDGER
    http: 409
    condition: "Assignment close attempted with a non-SETTLED Settlement or a non-POSTED/non-VOIDED ChargebackEntry outstanding"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: MobilityAdmin
    description: "Global mobility program administrator: owns programs, employees, policies, assignment lifecycle, extension requests, and the test clock"
    identity: opaque
    exclusive_operations:
      - "POST /mobility/programs"
      - "POST /mobility/employees"
      - "POST /mobility/allowance-policies"
      - "POST /mobility/assignments and all /mobility/assignments/{id}/* lifecycle actions"
      - "POST /mobility/extension-requests"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /mobility/compensation-packages (with PayrollSpecialist)"
      - "POST /mobility/cost-projections (with FinanceController)"
      - "All GET endpoints (via Any)"
  - name: BusinessUnitApprover
    description: "Host business-unit approver: first step of assignment dual approval; decides extension requests"
    identity: opaque
    exclusive_operations:
      - "POST /mobility/assignments/{id}/approve-bu and reject-bu"
      - "POST /mobility/extension-requests/{id}/approve and decline"
    shared_operations: ["All GET endpoints (via Any)"]
  - name: MobilityApprover
    description: "Mobility program approver: second step of assignment dual approval; approves compensation packages"
    identity: opaque
    exclusive_operations:
      - "POST /mobility/assignments/{id}/approve-mobility and reject-mobility"
      - "POST /mobility/compensation-packages/{id}/approve"
    shared_operations: ["All GET endpoints (via Any)"]
  - name: PayrollSpecialist
    description: "Global payroll operator: compensation packages, payroll splits, shadow payroll records, settlement preparation"
    identity: opaque
    exclusive_operations:
      - "POST /mobility/compensation-packages/{id}/submit and revise"
      - "POST /mobility/payroll-splits and all /mobility/payroll-splits/{id}/* actions"
      - "POST /mobility/shadow-payroll-records and post/void actions"
      - "POST /mobility/settlements and submit/recalculate actions"
    shared_operations:
      - "POST /mobility/compensation-packages (with MobilityAdmin)"
      - "All GET endpoints (via Any)"
  - name: FinanceController
    description: "Finance controller: settlement approval/settlement execution, chargeback posting/voiding, cost projections"
    identity: opaque
    exclusive_operations:
      - "POST /mobility/settlements/{id}/approve and settle"
      - "POST /mobility/chargeback-entries/{id}/post and void"
    shared_operations:
      - "POST /mobility/cost-projections (with MobilityAdmin)"
      - "All GET endpoints (via Any)"
  - name: VendorCoordinator
    description: "Tax vendor and totalization coordinator: drives vendor engagement and certificate-of-coverage lifecycles"
    identity: opaque
    exclusive_operations:
      - "POST /mobility/vendor-engagements and all its lifecycle actions except return-draft"
      - "POST /mobility/certificates-of-coverage and all its lifecycle actions"
    shared_operations: ["All GET endpoints (via Any)"]
  - name: TaxVendor
    description: "External tax preparation vendor operator: returns draft returns"
    identity: opaque
    exclusive_operations:
      - "POST /mobility/vendor-engagements/{id}/return-draft"
    shared_operations: ["All GET endpoints (via Any)"]
  - name: Assignee
    description: "The expatriate employee; acts on own resources only (X-User-ID equals Employee.id)"
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /mobility/settlements/{id}/dispute (own assignment's settlement only)"
    shared_operations: ["All GET endpoints (via Any)"]
  - name: Any
    description: "Any authenticated role may read"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["All GET endpoints"]
