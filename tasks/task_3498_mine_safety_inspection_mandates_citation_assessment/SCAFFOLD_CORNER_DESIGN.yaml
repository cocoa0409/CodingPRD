          - calculations.abatement_deadline
        distinguishing_aspect: "A first (and only) extension requested one second after the current deadline fails ERR_ABATEMENT_WINDOW_PASSED — the window check, not the once-per-citation constraint, fires because the extension budget is still intact."
        test_recipe:
          setup:
            - "SERIOUS citation issued 2026-02-10T09:00:00Z (deadline 2026-02-15T09:00:00Z), never extended; clock at 2026-02-15T09:00:01Z."
          setup_api_calls:
            - *clk_feb10_0800
            - *mk_operator
            - *mk_mine_ug
            - *mk_insp1
            - *mk_spot_feb10
            - *mk_review1
            - *mk_start1
            - *clk_feb10_0900
            - call: "POST /msha/citations"
              payload: { inspection_id: "${insp1}", mine_id: "${m_id}", standard_code: "30 CFR 75.500", kind: "CITATION", negligence: "MODERATE", gravity_likelihood: "REASONABLY_LIKELY", gravity_severity: "SERIOUS", persons_affected: 2, significant_and_substantial: false, repeat_violation: false }
              as: Inspector
              as_user_id: "${i1}"
              captures: { cit1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-15T09:00:01Z" }
              as: MSHAAdmin
          trigger:
            - call: "POST /msha/citations/${cit1}/extend-abatement"
