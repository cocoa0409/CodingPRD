        distinguishing_aspect: "A rival manufacturer calls resubmit on an assessment that is in DRAFT (a status with no resubmit transition at all), so both priority 21 and priority 40 are violated; the answer must be 403 ERR_OWNERSHIP_VIOLATION because the ownership check runs first and must not leak the target's state."
