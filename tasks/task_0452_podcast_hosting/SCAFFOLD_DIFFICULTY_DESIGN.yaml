              payload: {}
              as: PlatformAdmin
            - call: "POST /media-assets/${maOcc}/transcode-result"
              payload: { outcome: "SUCCESS", output_duration_ms: 600000 }
              as: PlatformAdmin
            - call: "POST /episodes/${epOcc}/publish"
              payload: {}
