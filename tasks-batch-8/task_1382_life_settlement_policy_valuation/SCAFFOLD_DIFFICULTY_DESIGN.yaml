  # =========================================================================
  # Rule 6 — boundary_precision_check (different metrics, distinct endpoints)
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: face_amount_exact_minimum_boundary
        grounds:
          - calculations.calc_eligibility_screening
          - validations[priority=10]
