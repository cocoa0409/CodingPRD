# ============================================================================
# §1.9 SCAFFOLD CORNER DESIGN (breadth probe) — Task 2773
# Sections and claim_type values are taken verbatim from
# references/claim-extraction-guide.md. Instances already asserted by a §1.8
# instance are emitted as `excluded_because:` stubs with no test_recipe.
# ============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: collective_creation_returns_all_declared_fields
        claim_type: creation
        grounds: [entities.Collective, 'endpoints."POST /nil/collectives"', response_envelope]
        distinguishing_aspect: "A create call with only the five required inputs must return 201 with every §1.1 Collective field populated, including the derived ledger counters at 0 and version 1, wrapped in the fixed success envelope."
        test_recipe:
          setup: ["Empty database. The logical clock is at its startup default 2026-08-01T00:00:00Z."]
          setup_api_calls: []
          trigger:
            - call: "POST /nil/collectives"
              payload: { name: "Corner Collective", institution_name: "Corner Institution", institution_ipeds_code: "020100", home_state_code: "TX", association_ruleset: "NCAA_2024" }
              as: PlatformAdmin
              captures: { col_id: $.data.id, col_ver: $.data.version }
          assert:
            - "The response status is 201 and the body has exactly the keys success, data, meta, error_id, message with success true, error_id null and message null."
            - "Collective.${col_id}.name == Corner Collective"
            - "Collective.${col_id}.entity_structure == FOR_PROFIT_LLC"
            - "Collective.${col_id}.communication_policy == STRICT_SEPARATION"
            - "Collective.${col_id}.charitable_deduction_enabled == false"
            - "Collective.${col_id}.funding_posture == OPEN"
            - "Collective.${col_id}.settled_net_funds_cents == 0"
            - "Collective.${col_id}.committed_unreleased_cents == 0"
            - "Collective.${col_id}.released_total_cents == 0"
            - "Collective.${col_id}.reversed_total_cents == 0"
            - "Collective.${col_id}.structure_change_count == 0"
            - "Collective.${col_id}.created_at == 2026-08-01T00:00:00Z"
            - "Collective.${col_id}.updated_at == 2026-08-01T00:00:00Z"
            - "${col_ver} == 1"

      - name: deal_contract_retrieval_returns_stored_values
        claim_type: retrieval
        grounds: [entities.DealContract, 'endpoints."GET /nil/deal-contracts/{id}"']
        distinguishing_aspect: "A detail GET must echo the stored contract byte-for-byte, including the three parallel status dimensions and the system-assigned deal_kind INDIVIDUAL with a null allocation_batch_code."
        test_recipe:
          setup: ["One collective, one ENROLLED athlete, and one DRAFT contract worth 100000 covering 2026-08-01 to 2026-12-31."]
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Retrieval Collective", institution_name: "Retrieval Institution", institution_ipeds_code: "020200", home_state_code: "OH", association_ruleset: "NCAA_2026" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/athletes"
              payload: { collective_id: "${col_id}", full_name: "Ret Athlete", portal_user_id: "ath-ret", sport: "FOOTBALL", class_year: 2028 }
              as: CollectiveDirector
              captures: { ath_id: $.data.id }
            - call: "POST /nil/deal-contracts"
              payload: { collective_id: "${col_id}", athlete_id: "${ath_id}", total_value_cents: 100000, effective_start_at: "2026-08-01T00:00:00Z", effective_end_at: "2026-12-31T00:00:00Z" }
              as: CollectiveDirector
              captures: { dc_id: $.data.id }
          trigger:
            - call: "GET /nil/deal-contracts/${dc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { got_kind: $.data.deal_kind, got_life: $.data.lifecycle_status, got_pay: $.data.payment_status, got_disc: $.data.disclosure_status, got_total: $.data.total_value_cents }
          assert:
            - "The response status is 200."
            - "${got_total} == 100000"
            - "${got_kind} == INDIVIDUAL"
            - "${got_life} == DRAFT"
            - "${got_pay} == UNPAID"
            - "${got_disc} == DISCLOSURE_PENDING"
            - "DealContract.${dc_id}.allocation_batch_code == null"
            - "DealContract.${dc_id}.deliverable_value_total_cents == 0"
            - "DealContract.${dc_id}.termination_reason == NONE"

      - name: donor_member_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds: ['endpoints."GET /nil/donor-members"', response_envelope.meta, complexity_profile.consistency_model]
        distinguishing_aspect: "With three donors on one collective, limit 2 and offset 2 must return exactly one row while meta.total_count stays 3 and meta.has_more flips to false, proving offset paging is applied after the collective filter."
        test_recipe:
          setup: ["One collective with one OPEN tier and three donor members created in a fixed order."]
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Paging Collective", institution_name: "Paging Institution", institution_ipeds_code: "020300", home_state_code: "CA", association_ruleset: "NAIA" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/collectives/${col_id}/membership-tiers"
              payload: { tier_code: "T1", tier_name: "Base", annual_dues_cents: 10000, benefit_rank: 1 }
              as: CollectiveDirector
              captures: { tier_id: $.data.id }
            - call: "POST /nil/membership-tiers/${tier_id}/transitions"
              payload: { action: "OPEN" }
              as: CollectiveDirector
            - call: "POST /nil/donor-members"
              payload: { collective_id: "${col_id}", membership_tier_id: "${tier_id}", display_name: "Donor One", email: "one@example.com" }
              as: CollectiveDirector
              captures: { d1_id: $.data.id }
            - call: "POST /nil/donor-members"
              payload: { collective_id: "${col_id}", membership_tier_id: "${tier_id}", display_name: "Donor Two", email: "two@example.com" }
              as: CollectiveDirector
              captures: { d2_id: $.data.id }
            - call: "POST /nil/donor-members"
              payload: { collective_id: "${col_id}", membership_tier_id: "${tier_id}", display_name: "Donor Three", email: "three@example.com" }
              as: CollectiveDirector
              captures: { d3_id: $.data.id }
          trigger:
            - call: "GET /nil/donor-members"
              payload: { collective_id: "${col_id}", limit: 2, offset: 2 }
              as: CollectiveDirector
              captures: { first_id: "$.data[0].id", first_name: "$.data[0].display_name" }
          assert:
            - "The response status is 200 and data contains exactly 1 element."
            - "meta.total_count == 3"
            - "meta.limit == 2"
            - "meta.offset == 2"
            - "meta.has_more == false"
            - "${first_id} == ${d3_id}"
            - "${first_name} == Donor Three"
            - "Ordering is by DonorMember.sequence_no ASC, never by id, so the third-created donor is the only row on the second page."

      - name: get_athlete_with_unknown_uuid_returns_not_found
        claim_type: not_found
        grounds: ['endpoints."GET /nil/athletes/{id}"', errors.ERR_ATHLETE_NOT_FOUND, validations.priority_06_existence_path_entity]
        distinguishing_aspect: "A syntactically valid but absent UUID on the athlete detail endpoint must return the athlete-specific 404 code, not a generic not-found or a 500."
        test_recipe:
          setup: ["One collective exists so the database is non-empty, but no athlete has ever been created."]
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "NotFound Collective", institution_name: "NotFound Institution", institution_ipeds_code: "020400", home_state_code: "FL", association_ruleset: "NCAA_2024" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
          trigger:
            - call: "GET /nil/athletes/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceOfficer
              captures: { err_id: $.data.error_id, err_msg: $.data.message }
          assert:
            - "${err_id} == ERR_ATHLETE_NOT_FOUND"
            - "The response status is 404, success is false and data is null."
            - "${err_msg} is the non-empty catalog message for ERR_ATHLETE_NOT_FOUND."

      - name: create_athlete_missing_portal_user_id_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Athlete.fields.portal_user_id, validations.priority_05_schema_body_shape, errors.ERR_INVALID_REQUEST]
        distinguishing_aspect: "portal_user_id is a required input with no default and is load-bearing for the entity_backed Athlete role, so omitting it must fail schema validation at priority 5 rather than defaulting to null."
        test_recipe:
          setup: ["One collective exists."]
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Required Collective", institution_name: "Required Institution", institution_ipeds_code: "020500", home_state_code: "AL", association_ruleset: "NAIA" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
          trigger:
            - call: "POST /nil/athletes"
              payload: { collective_id: "${col_id}", full_name: "No Portal Id", sport: "SOFTBALL", class_year: 2028 }
              as: CollectiveDirector
              captures: { err_id: $.data.error_id, err_msg: $.data.message }
          assert:
            - "${err_id} == ERR_INVALID_REQUEST"
            - "The response status is 400."
            - "No Athlete row was created, so GET /nil/athletes filtered by this collective returns an empty data array with meta.total_count 0."

      - name: commitment_defaults_installments_total_to_one_when_omitted
        claim_type: defaults
        grounds: [entities.Commitment.fields.installments_total, entities.Commitment.fields.pause_reason, 'endpoints."POST /nil/commitments"']
        distinguishing_aspect: "Omitting the optional installments_total must apply the declared default of 1 (not 0 and not null) while installments_charged starts at 0 and pause_reason starts at NONE."
        test_recipe:
          setup: ["One collective, one OPEN tier and one donor member whose fresh version is captured for the OCC field."]
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Defaults Collective", institution_name: "Defaults Institution", institution_ipeds_code: "020600", home_state_code: "TX", association_ruleset: "NCAA_2026" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/collectives/${col_id}/membership-tiers"
              payload: { tier_code: "T2", tier_name: "Mid", annual_dues_cents: 50000, benefit_rank: 2 }
              as: CollectiveDirector
              captures: { tier_id: $.data.id }
            - call: "POST /nil/membership-tiers/${tier_id}/transitions"
              payload: { action: "OPEN" }
              as: CollectiveDirector
            - call: "POST /nil/donor-members"
              payload: { collective_id: "${col_id}", membership_tier_id: "${tier_id}", display_name: "Def Donor", email: "def@example.com" }
              as: CollectiveDirector
              captures: { donor_id: $.data.id, donor_ver: $.data.version }
          trigger:
            - call: "POST /nil/commitments"
              payload: { donor_member_id: "${donor_id}", kind: "MAJOR_GIFT_PLEDGE", amount_cents: 250000, billing_interval: "NONE", expected_donor_member_version: "${donor_ver}" }
              as: CollectiveDirector
              captures: { cm_id: $.data.id }
          assert:
            - "Commitment.${cm_id}.installments_total == 1"
            - "Commitment.${cm_id}.installments_charged == 0"
            - "Commitment.${cm_id}.status == ACTIVE"
            - "Commitment.${cm_id}.pause_reason == NONE"
            - "Commitment.${cm_id}.superseded_by_commitment_id == null"
            - "Commitment.${cm_id}.sequence_no == 1"
            - "MembershipTier.${tier_id}.active_commitment_count == 1"

      - name: contribution_computed_net_ignores_client_supplied_net_amount
        claim_type: computed_fields
        grounds: [entities.Contribution.fields.net_amount_cents, entities.Contribution.fields.processing_fee_cents, calculations.calc_contribution_processing_fee]
        distinguishing_aspect: "net_amount_cents and processing_fee_cents are source: computed and are not accepted as inputs, so a body carrying them must be rejected at priority 5 for unknown fields rather than silently honouring the client's numbers."
        test_recipe:
          setup: ["One collective with an OPEN tier and one donor member."]
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Computed Collective", institution_name: "Computed Institution", institution_ipeds_code: "020700", home_state_code: "OH", association_ruleset: "NCAA_2024" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/collectives/${col_id}/membership-tiers"
              payload: { tier_code: "T1", tier_name: "Base", annual_dues_cents: 10000, benefit_rank: 1 }
              as: CollectiveDirector
              captures: { tier_id: $.data.id }
            - call: "POST /nil/membership-tiers/${tier_id}/transitions"
              payload: { action: "OPEN" }
              as: CollectiveDirector
            - call: "POST /nil/donor-members"
              payload: { collective_id: "${col_id}", membership_tier_id: "${tier_id}", display_name: "Comp Donor", email: "comp@example.com" }
              as: CollectiveDirector
              captures: { donor_id: $.data.id }
          trigger:
            - call: "POST /nil/contributions"
              payload: { donor_member_id: "${donor_id}", gross_amount_cents: 50000, source_kind: "ONE_TIME_GIFT", designation: "UNRESTRICTED", processor_outcome: "APPROVE", net_amount_cents: 50000 }
              as: CollectiveDirector
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_INVALID_REQUEST"
            - "The response status is 400 because net_amount_cents is not a declared input of POST /nil/contributions."
            - "Repeating the identical call without the net_amount_cents key succeeds and yields processing_fee_cents 1480 and net_amount_cents 48520 for gross 50000, computed from the 290 bps + 30 band."

      - name: athlete_system_fields_generated_and_client_values_ignored
        claim_type: system_fields
        grounds: [entities.Athlete.fields.sequence_no, entities.Athlete.fields.id, determinism_conventions.ordering_key]
        distinguishing_aspect: "id, created_at, updated_at, version and sequence_no are system-assigned: two athletes created in order must receive sequence_no 1 and 2 from the per-entity-type counter regardless of their ids, and no client-supplied sequence_no is accepted."
        test_recipe:
          setup: ["One collective and no athletes yet, so the Athlete counter starts at 1."]
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "System Collective", institution_name: "System Institution", institution_ipeds_code: "020800", home_state_code: "CA", association_ruleset: "NCAA_2026" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
          trigger:
            - call: "POST /nil/athletes"
              payload: { collective_id: "${col_id}", full_name: "Sys One", portal_user_id: "ath-sys1", sport: "BASEBALL", class_year: 2027 }
              as: CollectiveDirector
              captures: { a1_id: $.data.id, a1_seq: $.data.sequence_no, a1_ver: $.data.version, a1_created: $.data.created_at }
            - call: "POST /nil/athletes"
              payload: { collective_id: "${col_id}", full_name: "Sys Two", portal_user_id: "ath-sys2", sport: "BASEBALL", class_year: 2027 }
              as: CollectiveDirector
              captures: { a2_id: $.data.id, a2_seq: $.data.sequence_no }
          assert:
            - "${a1_seq} == 1"
            - "${a2_seq} == 2"
            - "${a1_ver} == 1"
            - "${a1_created} == 2026-08-01T00:00:00Z"
            - "Athlete.${a1_id}.roster_weight == 1"
            - "Athlete.${a1_id}.tax_person_kind == US_PERSON"
            - "Athlete.${a1_id}.taxpayer_doc_on_file == NONE"
            - "Athlete.${a1_id}.treaty_exempt_claimed == false"
            - "Athlete.${a1_id}.eligibility_status == ENROLLED"
            - "Athlete.${a1_id}.tax_form_required == NONE"
            - "${a1_id} != ${a2_id} and neither id is used for ordering anywhere."

      - name: create_athlete_with_unknown_sport_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.Athlete.fields.sport, entities.Athlete.fields.class_year, validations.priority_05_schema_body_shape]
        distinguishing_aspect: "sport is a closed enum of five values and class_year is bounded to 2026..2031, so a LACROSSE sport must be refused at priority 5 before any business rule runs."
        test_recipe:
          setup: ["One collective exists."]
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Enum Collective", institution_name: "Enum Institution", institution_ipeds_code: "020900", home_state_code: "TX", association_ruleset: "NCAA_2024" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
          trigger:
            - call: "POST /nil/athletes"
              payload: { collective_id: "${col_id}", full_name: "Bad Sport", portal_user_id: "ath-bad", sport: "LACROSSE", class_year: 2028 }
              as: CollectiveDirector
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_INVALID_REQUEST"
            - "The response status is 400."
            - "A second attempt with class_year 2025 also returns ERR_INVALID_REQUEST, and only values in 2026..2031 are accepted."

      - name: communication_log_is_immutable_with_no_version_field
        claim_type: immutability
        grounds: [entities.CommunicationLog, calculations.calc_communication_boundary_verdict, 'endpoints."GET /nil/communication-logs/{id}"']
        distinguishing_aspect: "CommunicationLog declares common_fields false, so its rows carry id, logged_at and sequence_no but no updated_at and no version, and §1.5 exposes no mutating endpoint for them; the verdict is frozen at write time."
        test_recipe:
          setup: ["One collective under the default STRICT_SEPARATION communication policy and one ENROLLED athlete."]
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Immutable Collective", institution_name: "Immutable Institution", institution_ipeds_code: "021000", home_state_code: "OH", association_ruleset: "NCAA_2026" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/athletes"
              payload: { collective_id: "${col_id}", full_name: "Imm Athlete", portal_user_id: "ath-imm", sport: "FOOTBALL", class_year: 2028 }
              as: CollectiveDirector
              captures: { ath_id: $.data.id }
          trigger:
            - call: "POST /nil/communication-logs"
              payload: { collective_id: "${col_id}", actor_role: "COLLECTIVE_DIRECTOR", channel: "INSTITUTION_PORTAL", topic: "GENERAL_PROGRAM", athlete_id: "${ath_id}", note: "roster update" }
              as: CollectiveDirector
              captures: { log_id: $.data.id, log_verdict: $.data.verdict, log_seq: $.data.sequence_no }
          assert:
            - "${log_verdict} == PERMITTED"
            - "${log_seq} == 1"
            - "CommunicationLog.${log_id}.rationale_code == POLICY_ALLOWS"
            - "CommunicationLog.${log_id}.logged_at == 2026-08-01T00:00:00Z"
            - "The created row exposes no updated_at and no version key, and §1.5 declares no PATCH, PUT or DELETE on /nil/communication-logs, so the row can never be amended."

      - name: create_membership_tier_under_unknown_collective_returns_not_found
        claim_type: parent_relationships
        grounds: [entities.MembershipTier.parent, validations.priority_06_existence_path_entity, errors.ERR_COLLECTIVE_NOT_FOUND]
        distinguishing_aspect: "MembershipTier is a sub-resource of Collective, so an absent parent id in the path must produce the parent's 404 code and never create an orphan tier."
        test_recipe:
          setup: ["One real collective exists, but the request targets a different, absent collective id."]
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Parent Collective", institution_name: "Parent Institution", institution_ipeds_code: "021100", home_state_code: "FL", association_ruleset: "NAIA" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
          trigger:
            - call: "POST /nil/collectives/00000000-0000-4000-8000-0000000000ff/membership-tiers"
              payload: { tier_code: "T1", tier_name: "Ghost", annual_dues_cents: 10000, benefit_rank: 1 }
              as: CollectiveDirector
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_COLLECTIVE_NOT_FOUND"
            - "The response status is 404."
            - "GET /nil/collectives/${col_id}/membership-tiers returns an empty data array with meta.total_count 0, so no tier leaked onto the real collective."

      - name: cross_collective_donor_and_tier_reference_rejected
        claim_type: parent_relationships
        grounds: [validations.priority_08_referential_same_collective, errors.ERR_CROSS_COLLECTIVE_REFERENCE, complexity_profile.entity_topology]
        distinguishing_aspect: "The entity topology is a graph, so a donor can name any tier id that exists; priority 8 must reject a tier belonging to a different collective with 409 rather than 404, because the referenced row does exist."
        test_recipe:
          setup: ["Two independent collectives, each with its own OPEN membership tier."]
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Alpha Collective", institution_name: "Alpha Institution", institution_ipeds_code: "021200", home_state_code: "TX", association_ruleset: "NCAA_2024" }
              as: PlatformAdmin
              captures: { col_a_id: $.data.id }
            - call: "POST /nil/collectives"
              payload: { name: "Beta Collective", institution_name: "Beta Institution", institution_ipeds_code: "021300", home_state_code: "CA", association_ruleset: "NCAA_2024" }
              as: PlatformAdmin
              captures: { col_b_id: $.data.id }
            - call: "POST /nil/collectives/${col_b_id}/membership-tiers"
              payload: { tier_code: "T1", tier_name: "Beta Base", annual_dues_cents: 10000, benefit_rank: 1 }
              as: CollectiveDirector
              captures: { tier_b_id: $.data.id }
            - call: "POST /nil/membership-tiers/${tier_b_id}/transitions"
              payload: { action: "OPEN" }
              as: CollectiveDirector
          trigger:
            - call: "POST /nil/donor-members"
              payload: { collective_id: "${col_a_id}", membership_tier_id: "${tier_b_id}", display_name: "Wrong Tier Donor", email: "wrong@example.com" }
              as: CollectiveDirector
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_CROSS_COLLECTIVE_REFERENCE"
            - "The response status is 409, not 404, because MembershipTier.${tier_b_id} exists."
            - "MembershipTier.${tier_b_id}.active_commitment_count == 0"
            - "GET /nil/donor-members filtered by collective_id ${col_a_id} returns meta.total_count 0."

  - section: state_machines
    instances:

      - name: membership_tier_open_transition_moves_draft_to_open_then_closed
        claim_type: valid_transition
        grounds: [state_machines.sm_membership_tier_status, 'endpoints."POST /nil/membership-tiers/{id}/transitions"']
        distinguishing_aspect: "The declared DRAFT -> OPEN and OPEN -> CLOSED transitions must each be reachable through the single transitions endpoint and must change only tier_status, leaving benefit_rank and annual_dues_cents untouched."
        test_recipe:
          setup: ["One collective with one DRAFT membership tier."]
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Transition Collective", institution_name: "Transition Institution", institution_ipeds_code: "021400", home_state_code: "TX", association_ruleset: "NCAA_2024" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/collectives/${col_id}/membership-tiers"
              payload: { tier_code: "T3", tier_name: "Gold", annual_dues_cents: 150000, benefit_rank: 3 }
              as: CollectiveDirector
              captures: { tier_id: $.data.id, initial_status: $.data.tier_status }
          trigger:
            - call: "POST /nil/membership-tiers/${tier_id}/transitions"
              payload: { action: "OPEN" }
              as: CollectiveDirector
              captures: { after_open: $.data.tier_status }
            - call: "POST /nil/membership-tiers/${tier_id}/transitions"
              payload: { action: "CLOSE" }
              as: CollectiveDirector
              captures: { after_close: $.data.tier_status }
          assert:
            - "${initial_status} == DRAFT"
            - "${after_open} == OPEN"
            - "${after_close} == CLOSED"
            - "MembershipTier.${tier_id}.annual_dues_cents == 150000"
            - "MembershipTier.${tier_id}.benefit_rank == 3"
            - "MembershipTier.${tier_id}.active_commitment_count == 0"

      - name: activation_before_disclosure_accepted_is_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.sm_deal_contract_lifecycle, errors.ERR_DISCLOSURE_NOT_CLEARED, validations.priority_18_state_contract_disclosure]
        distinguishing_aspect: "The DRAFT -> ACTIVE transition carries a guard on the independent disclosure dimension; a contract above the disclosure threshold whose packet is still DISCLOSURE_PENDING must be refused, proving the guard is checked and not merely documented."
        test_recipe:
          setup: ["One collective, one ENROLLED athlete, and one DRAFT contract worth 100000, which is at or above DISCLOSURE_THRESHOLD_CENTS so its disclosure_status is DISCLOSURE_PENDING and no decision has been recorded."]
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Guard Collective", institution_name: "Guard Institution", institution_ipeds_code: "021500", home_state_code: "OH", association_ruleset: "NCAA_2026" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/athletes"
              payload: { collective_id: "${col_id}", full_name: "Guard Athlete", portal_user_id: "ath-guard", sport: "FOOTBALL", class_year: 2028 }
              as: CollectiveDirector
              captures: { ath_id: $.data.id }
            - call: "POST /nil/deal-contracts"
              payload: { collective_id: "${col_id}", athlete_id: "${ath_id}", total_value_cents: 100000, effective_start_at: "2026-08-01T00:00:00Z", effective_end_at: "2026-12-31T00:00:00Z" }
              as: CollectiveDirector
              captures: { dc_id: $.data.id, disc_status: $.data.disclosure_status }
          trigger:
            - call: "POST /nil/deal-contracts/${dc_id}/activation"
              payload: {}
              as: CollectiveDirector
              captures: { err_id: $.data.error_id }
          assert:
            - "${disc_status} == DISCLOSURE_PENDING"
            - "${err_id} == ERR_DISCLOSURE_NOT_CLEARED"
            - "The response status is 409."
            - "DealContract.${dc_id}.lifecycle_status == DRAFT"
            - "DealContract.${dc_id}.disclosure_submitted_at == null"
            - "After submitting the packet and recording an ACCEPT decision, the identical activation call succeeds and lifecycle_status becomes ACTIVE."

      - name: deferred_contribution_settlement_syncs_collective_and_donor_ledgers
        claim_type: ledger_sync
        grounds: [state_machines.sm_contribution_status, 'endpoints."POST /nil/contributions/{id}/settlements"', entities.Collective.fields.settled_net_funds_cents]
        distinguishing_aspect: "A contribution created with processor_outcome DEFER must leave every ancestor ledger at zero until the settlement call, and the single settlement must then move Contribution, Collective and DonorMember derived fields in one request."
        test_recipe:
          setup:
            - "A NONPROFIT_501C3 collective, so charitable deductibility is enabled."
            - "One OPEN tier and one INDIVIDUAL donor with annual_agi_cents 1000000 (ceiling 600000)."
            - "One contribution of gross 100000 created with processor_outcome DEFER, so it sits in PENDING with all derived money at 0."
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Ledger Sync Collective", institution_name: "Ledger Institution", institution_ipeds_code: "021600", home_state_code: "CA", association_ruleset: "NCAA_2026", entity_structure: "NONPROFIT_501C3" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/collectives/${col_id}/membership-tiers"
              payload: { tier_code: "T2", tier_name: "Sync Club", annual_dues_cents: 50000, benefit_rank: 2 }
              as: CollectiveDirector
              captures: { tier_id: $.data.id }
            - call: "POST /nil/membership-tiers/${tier_id}/transitions"
              payload: { action: "OPEN" }
              as: CollectiveDirector
            - call: "POST /nil/donor-members"
              payload: { collective_id: "${col_id}", membership_tier_id: "${tier_id}", display_name: "Sync Donor", email: "sync@example.com", donor_kind: "INDIVIDUAL", annual_agi_cents: 1000000 }
              as: CollectiveDirector
              captures: { donor_id: $.data.id }
            - call: "POST /nil/contributions"
              payload: { donor_member_id: "${donor_id}", gross_amount_cents: 100000, source_kind: "ONE_TIME_GIFT", designation: "UNRESTRICTED", processor_outcome: "DEFER" }
              as: TreasuryOfficer
              captures: { contrib_id: $.data.id, status_before: $.data.status, net_before: $.data.net_amount_cents }
            - call: "GET /nil/donor-members/${donor_id}"
              payload: {}
              as: TreasuryOfficer
              captures: { donor_status_before: $.data.status, donor_settled_before: $.data.lifetime_settled_cents }
          trigger:
            - call: "POST /nil/contributions/${contrib_id}/settlements"
              payload: { outcome: "APPROVE" }
              as: TreasuryOfficer
              captures: { status_after: $.data.status, fee_after: $.data.processing_fee_cents, net_after: $.data.net_amount_cents, deductible_after: $.data.deductible_amount_cents }
          assert:
            - "${status_before} == PENDING"
            - "${net_before} == 0"
            - "${donor_status_before} == PROSPECT"
            - "${donor_settled_before} == 0"
            - "${status_after} == SETTLED"
            - "${fee_after} == 2530"
            - "${net_after} == 97470"
            - "${deductible_after} == 97470"
            - "Contribution.${contrib_id}.deduction_variant == AT_RECEIPT"
            - "DonorMember.${donor_id}.status == ACTIVE"
            - "DonorMember.${donor_id}.lifetime_settled_cents == 97470"
            - "DonorMember.${donor_id}.lifetime_deductible_cents == 97470"
            - "Collective.${col_id}.settled_net_funds_cents == 97470"
            - "Collective.${col_id}.funding_posture == OPEN"

      - name: cancel_already_cancelled_commitment_returns_state_invalid
        claim_type: invalid_transition
        grounds: [state_machines.sm_commitment_status, errors.ERR_COMMITMENT_STATE_INVALID, 'endpoints."POST /nil/commitments/{id}/transitions"']
        distinguishing_aspect: "CANCELLED is terminal in sm_commitment_status, so a second CANCEL must be refused with the commitment state error and must not re-run the tier counter side effect."
        test_recipe:
          setup: ["One collective, one OPEN tier, one donor, and one ACTIVE MAJOR_GIFT_PLEDGE commitment that has already been cancelled once."]
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Cancel Collective", institution_name: "Cancel Institution", institution_ipeds_code: "021700", home_state_code: "FL", association_ruleset: "NAIA" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/collectives/${col_id}/membership-tiers"
              payload: { tier_code: "T1", tier_name: "Cancel Base", annual_dues_cents: 20000, benefit_rank: 1 }
              as: CollectiveDirector
              captures: { tier_id: $.data.id }
            - call: "POST /nil/membership-tiers/${tier_id}/transitions"
              payload: { action: "OPEN" }
              as: CollectiveDirector
            - call: "POST /nil/donor-members"
              payload: { collective_id: "${col_id}", membership_tier_id: "${tier_id}", display_name: "Cancel Donor", email: "cancel@example.com" }
              as: CollectiveDirector
              captures: { donor_id: $.data.id, donor_ver: $.data.version }
            - call: "POST /nil/commitments"
              payload: { donor_member_id: "${donor_id}", kind: "MAJOR_GIFT_PLEDGE", amount_cents: 300000, billing_interval: "NONE", installments_total: 3, expected_donor_member_version: "${donor_ver}" }
              as: CollectiveDirector
              captures: { cm_id: $.data.id }
            - call: "POST /nil/commitments/${cm_id}/transitions"
              payload: { action: "CANCEL" }
              as: CollectiveDirector
              captures: { status_after_first: $.data.status }
          trigger:
            - call: "POST /nil/commitments/${cm_id}/transitions"
              payload: { action: "CANCEL" }
              as: CollectiveDirector
              captures: { err_id: $.data.error_id }
          assert:
            - "${status_after_first} == CANCELLED"
            - "${err_id} == ERR_COMMITMENT_STATE_INVALID"
            - "The response status is 409."
            - "Commitment.${cm_id}.status == CANCELLED"
            - "Commitment.${cm_id}.installments_charged == 0"
            - "MembershipTier.${tier_id}.active_commitment_count == 0"
            - "A PAUSE or RESUME action on the same cancelled commitment also returns ERR_COMMITMENT_STATE_INVALID."

      - name: new_deal_contract_and_deliverable_start_in_declared_initial_states
        claim_type: initial_state
        grounds: [state_machines.sm_deal_contract_disclosure.initial_state, state_machines.sm_deliverable_status.initial_state, global_constants.DISCLOSURE_THRESHOLD_CENTS]
        distinguishing_aspect: "A contract strictly below DISCLOSURE_THRESHOLD_CENTS must be born DISCLOSURE_NOT_REQUIRED with a null disclosure_due_at (unlike the at-or-above case), and its deliverables must be born PENDING with zeroed evidence and submission counters."
        test_recipe:
          setup: ["One collective and one ENROLLED athlete; the contract is worth 59999, one cent below the 60000 disclosure threshold."]
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Initial Collective", institution_name: "Initial Institution", institution_ipeds_code: "021800", home_state_code: "AL", association_ruleset: "NCAA_2024" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/athletes"
              payload: { collective_id: "${col_id}", full_name: "Init Athlete", portal_user_id: "ath-init", sport: "SOFTBALL", class_year: 2028 }
              as: CollectiveDirector
              captures: { ath_id: $.data.id }
          trigger:
            - call: "POST /nil/deal-contracts"
              payload: { collective_id: "${col_id}", athlete_id: "${ath_id}", total_value_cents: 59999, effective_start_at: "2026-08-01T00:00:00Z", effective_end_at: "2026-12-31T00:00:00Z" }
              as: CollectiveDirector
              captures: { dc_id: $.data.id, disc_status: $.data.disclosure_status, due_at: $.data.disclosure_due_at }
            - call: "POST /nil/deal-contracts/${dc_id}/deliverables"
              payload: { deliverable_kind: "AUTOGRAPH_SESSION", unit_value_cents: 59999, due_at: "2026-09-01T00:00:00Z" }
              as: CollectiveDirector
              captures: { del_id: $.data.id, del_status: $.data.status }
          assert:
            - "${disc_status} == DISCLOSURE_NOT_REQUIRED"
            - "${due_at} == null"
            - "${del_status} == PENDING"
            - "DealContract.${dc_id}.lifecycle_status == DRAFT"
            - "DealContract.${dc_id}.payment_status == UNPAID"
            - "DealContract.${dc_id}.disclosure_return_count == 0"
            - "Deliverable.${del_id}.evidence_count == 0"
            - "Deliverable.${del_id}.submission_count == 0"
            - "Deliverable.${del_id}.late_flag == false"
            - "Deliverable.${del_id}.charity_hours_tenths == 0"
            - "Deliverable.${del_id}.required_charity_hours_tenths == 0"
            - "Deliverable.${del_id}.payout_eligible_cents == 0"
            - "Deliverable.${del_id}.verified_by_user_id == null"
            - "A contract worth exactly 60000 instead is born DISCLOSURE_PENDING with disclosure_due_at 2026-08-08T00:00:00Z, so the threshold is inclusive on the at-or-above side."

      - name: transferred_out_athlete_rejects_further_eligibility_changes
        claim_type: terminal_state_lockdown
        grounds: [state_machines.sm_athlete_eligibility_status.terminal_states, errors.ERR_ATHLETE_STATE_INVALID, 'endpoints."POST /nil/athletes/{id}/eligibility-changes"']
        distinguishing_aspect: "TRANSFERRED_OUT is the only terminal eligibility state; every declared change action must be refused from it, so a REINSTATE that would be legal from INELIGIBLE must fail here."
        test_recipe:
          setup: ["One collective and one athlete taken ENROLLED -> PORTAL_ENTERED -> TRANSFERRED_OUT with no contracts, so no cascade noise."]
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Terminal Collective", institution_name: "Terminal Institution", institution_ipeds_code: "021900", home_state_code: "TX", association_ruleset: "NCAA_2026" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/athletes"
              payload: { collective_id: "${col_id}", full_name: "Term Athlete", portal_user_id: "ath-term", sport: "FOOTBALL", class_year: 2027 }
              as: ComplianceOfficer
              captures: { ath_id: $.data.id }
            - call: "POST /nil/athletes/${ath_id}/eligibility-changes"
              payload: { change: "ENTER_PORTAL" }
              as: ComplianceOfficer
            - call: "POST /nil/athletes/${ath_id}/eligibility-changes"
              payload: { change: "COMPLETE_TRANSFER" }
              as: ComplianceOfficer
              captures: { status_after: $.data.eligibility_status }
          trigger:
            - call: "POST /nil/athletes/${ath_id}/eligibility-changes"
              payload: { change: "REINSTATE" }
              as: ComplianceOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "${status_after} == TRANSFERRED_OUT"
            - "${err_id} == ERR_ATHLETE_STATE_INVALID"
            - "The response status is 409."
            - "Athlete.${ath_id}.eligibility_status == TRANSFERRED_OUT"
            - "ENTER_PORTAL, WITHDRAW_FROM_PORTAL, DECLARE_INELIGIBLE and COMPLETE_TRANSFER from TRANSFERRED_OUT all return ERR_ATHLETE_STATE_INVALID."

      - name: second_activation_of_active_contract_is_rejected
        claim_type: idempotency
        grounds: [state_machines.sm_deal_contract_lifecycle, errors.ERR_CONTRACT_NOT_DRAFT, 'endpoints."POST /nil/deal-contracts/{id}/activation"']
        distinguishing_aspect: "Activation is not idempotent by design: replaying it against an ACTIVE contract must return ERR_CONTRACT_NOT_DRAFT rather than a second success, and must not bump the contract version a second time."
        test_recipe:
          setup: ["One collective, one ENROLLED athlete, and one contract worth 50000 (below the disclosure threshold) that has already been activated once."]
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Idempotency Collective", institution_name: "Idempotency Institution", institution_ipeds_code: "022000", home_state_code: "OH", association_ruleset: "NCAA_2024" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/athletes"
              payload: { collective_id: "${col_id}", full_name: "Idem Athlete", portal_user_id: "ath-idem", sport: "BASEBALL", class_year: 2028 }
              as: CollectiveDirector
              captures: { ath_id: $.data.id }
            - call: "POST /nil/deal-contracts"
              payload: { collective_id: "${col_id}", athlete_id: "${ath_id}", total_value_cents: 50000, effective_start_at: "2026-08-01T00:00:00Z", effective_end_at: "2026-12-31T00:00:00Z" }
              as: CollectiveDirector
              captures: { dc_id: $.data.id }
            - call: "POST /nil/deal-contracts/${dc_id}/activation"
              payload: {}
              as: CollectiveDirector
              captures: { life_after_first: $.data.lifecycle_status }
            - call: "GET /nil/deal-contracts/${dc_id}"
              payload: {}
              as: CollectiveDirector
              captures: { ver_after_first: $.data.version }
          trigger:
            - call: "POST /nil/deal-contracts/${dc_id}/activation"
              payload: {}
              as: CollectiveDirector
              captures: { err_id: $.data.error_id }
          assert:
            - "${life_after_first} == ACTIVE"
            - "${err_id} == ERR_CONTRACT_NOT_DRAFT"
            - "The response status is 409."
            - "DealContract.${dc_id}.lifecycle_status == ACTIVE"
            - "DealContract.${dc_id}.version == ${ver_after_first}"

      - name: contract_completes_when_payment_full_and_all_deliverables_terminal
        claim_type: bubble_up
        grounds: [state_machines.sm_deal_contract_lifecycle, state_machines.sm_deal_contract_payment, validations.priority_22_sod_release_initiator_is_not_verifier]
        distinguishing_aspect: "The ACTIVE -> COMPLETED bubble-up needs BOTH conditions at once: at least one Deliverable with every one terminal, and payment_status FULLY_PAID. Verifying the only deliverable alone must not complete the contract; the completing release must."
        test_recipe:
          setup:
            - "A collective with 116970 cents of settled UNRESTRICTED net funds (gross 120000, fee 3030), so funding_posture stays OPEN against a 60000 commitment."
            - "One ENROLLED FOOTBALL athlete and one contract worth exactly 60000 with disclosure submitted and ACCEPTED, then activated."
            - "One SOCIAL_POST deliverable worth 60000 with one evidence record, submitted on time and VERIFIED by compliance-b, giving payout_eligible_cents 60000 on the strict unit basis."
            - "The release is initiated by treasury-b, a different user from the verifier, so priority 22 is satisfied."
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Bubble Collective", institution_name: "Bubble Institution", institution_ipeds_code: "022100", home_state_code: "CA", association_ruleset: "NCAA_2026" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/collectives/${col_id}/membership-tiers"
              payload: { tier_code: "T2", tier_name: "Bubble Club", annual_dues_cents: 30000, benefit_rank: 2 }
              as: CollectiveDirector
              captures: { tier_id: $.data.id }
            - call: "POST /nil/membership-tiers/${tier_id}/transitions"
              payload: { action: "OPEN" }
              as: CollectiveDirector
            - call: "POST /nil/donor-members"
              payload: { collective_id: "${col_id}", membership_tier_id: "${tier_id}", display_name: "Bub Donor", email: "bub@example.com" }
              as: CollectiveDirector
              captures: { donor_id: $.data.id }
            - call: "POST /nil/contributions"
              payload: { donor_member_id: "${donor_id}", gross_amount_cents: 120000, source_kind: "ONE_TIME_GIFT", designation: "UNRESTRICTED", processor_outcome: "APPROVE" }
              as: CollectiveDirector
              captures: { contrib_id: $.data.id }
            - call: "POST /nil/athletes"
              payload: { collective_id: "${col_id}", full_name: "Bub Athlete", portal_user_id: "ath-bub", sport: "FOOTBALL", class_year: 2028 }
              as: CollectiveDirector
              captures: { ath_id: $.data.id }
            - call: "PATCH /nil/athletes/${ath_id}/tax-profile"
              payload: { taxpayer_doc_on_file: "W9" }
              as: TreasuryOfficer
            - call: "POST /nil/deal-contracts"
              payload: { collective_id: "${col_id}", athlete_id: "${ath_id}", total_value_cents: 60000, effective_start_at: "2026-08-01T00:00:00Z", effective_end_at: "2026-12-31T00:00:00Z", funding_designation: "UNRESTRICTED" }
              as: CollectiveDirector
              captures: { dc_id: $.data.id }
            - call: "POST /nil/deal-contracts/${dc_id}/compliance-submissions"
              payload: { state_law_citation: "CA-AB131", association_rule_citation: "NCAA-2026-12.5" }
              as: CollectiveDirector
            - call: "POST /nil/deal-contracts/${dc_id}/compliance-decisions"
              payload: { decision: "ACCEPT" }
              as: InstitutionReviewer
            - call: "POST /nil/deal-contracts/${dc_id}/activation"
              payload: {}
              as: CollectiveDirector
            - call: "POST /nil/deal-contracts/${dc_id}/deliverables"
              payload: { deliverable_kind: "SOCIAL_POST", unit_value_cents: 60000, due_at: "2026-09-01T00:00:00Z" }
              as: CollectiveDirector
              captures: { del_id: $.data.id }
            - call: "POST /nil/deliverables/${del_id}/evidence"
              payload: { evidence_kind: "ANALYTICS_SCREENSHOT", reference_label: "bub-post" }
              as: CollectiveDirector
            - call: "POST /nil/deliverables/${del_id}/submissions"
              payload: { performed_at: "2026-08-05T00:00:00Z" }
              as: CollectiveDirector
            - call: "POST /nil/deliverables/${del_id}/reviews"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
              as_user_id: "compliance-b"
              captures: { del_status: $.data.status, del_payout: $.data.payout_eligible_cents }
            - call: "GET /nil/deal-contracts/${dc_id}"
              payload: {}
              as: TreasuryOfficer
              captures: { dc_ver: $.data.version, life_before: $.data.lifecycle_status }
          trigger:
            - call: "POST /nil/payment-releases"
              payload: { deal_contract_id: "${dc_id}", deliverable_id: "${del_id}", release_kind: "DELIVERABLE_PAYOUT", requested_amount_cents: 60000, expected_deal_contract_version: "${dc_ver}" }
              as: TreasuryOfficer
              as_user_id: "treasury-b"
              captures: { rel_id: $.data.id, rel_status: $.data.status }
          assert:
            - "${del_status} == VERIFIED"
            - "${del_payout} == 60000"
            - "${life_before} == ACTIVE"
            - "Verifying the deliverable alone did not complete the contract, so the bubble-up requires both conditions."
            - "${rel_status} == RELEASED"
            - "DealContract.${dc_id}.released_total_cents == 60000"
            - "DealContract.${dc_id}.payment_status == FULLY_PAID"
            - "DealContract.${dc_id}.lifecycle_status == COMPLETED"
            - "PaymentRelease.${rel_id}.withholding_basis == NONE"
            - "PaymentRelease.${rel_id}.net_payable_cents == 60000"
            - "Athlete.${ath_id}.tax_year_gross_paid_cents == 60000"
            - "Athlete.${ath_id}.tax_form_required == FORM_1099_NEC"

