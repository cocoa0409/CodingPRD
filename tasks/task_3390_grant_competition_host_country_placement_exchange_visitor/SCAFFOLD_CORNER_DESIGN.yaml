        distinguishing_aspect: "The waiver loop is cyclic and lossless: REQUEST_WAIVER moves ACCRUING -> WAIVER_PENDING storing the reason, and DENY_WAIVER returns the ledger to ACCRUING with accrued_days intact (150 kept, not reset)."
