              as: RealPropertyOfficer
              captures: { decl_id: "$.data.id" }
            - call: "POST /declarations/${decl_id}/adopt"
              payload: { resolution_number: "RES-2026-287" }
              as: BoardClerk
              as_user_id: "clerk-adopt-1"
            - call: "POST /declarations/${decl_id}/issue-notices"
              payload:
                recipient_agency_ids: ["${ah_agency_id}"]
                response_window_days: 60
              as: RealPropertyOfficer
            - call: "GET /notices"
              payload: { declaration_id: "${decl_id}" }
              as: RealPropertyOfficer
              captures: { notice_id: "$.data[0].id" }
          trigger:
            - call: "POST /notices/${notice_id}/respond"
              payload: { response_type: "EXPRESS_INTEREST", claimed_preference_category: "AFFORDABLE_HOUSING", intended_use: "60-unit deed-restricted family apartments" }
              as: AgencyRepresentative
              as_user_id: "${ah_agency_id}"
            - call: "GET /preference-offers"
              payload: { declaration_id: "${decl_id}", limit: 10, offset: 0 }
              as: RealPropertyOfficer
              captures: { offer_id: "$.data[0].id", offer_min_price: "$.data[0].ah_minimum_price_cents" }
            - call: "GET /declarations/${decl_id}"
              payload: {}
              as: RealPropertyOfficer
          assert:
            - "the respond response is HTTP 200 with data.status == INTEREST_EXPRESSED, data.responded_at == 2026-08-01T00:00:00Z and data.claimed_preference_category == AFFORDABLE_HOUSING"
            - "the immediately following GET /preference-offers returns total_count == 1 - the cross-aggregate write is visible with no settling call"
            - "that offer row has offeror_agency_id ${ah_agency_id}, notice_id ${notice_id}, preference_category AFFORDABLE_HOUSING, negotiation_status OPEN and good_faith_status UNREVIEWED"
            - "${offer_min_price} == 65000000, the AFFORDABLE_HOUSING_PREFERENCE variant of round_half_up(100000000 * (1 - 0.35) * (1 - 0)) with no CURED title items to deduct - NOT the 70000000 book-value floor the MARKET_FLOOR variant would have imposed"
            - "that offer row has negotiation_opened_at 2026-08-01T00:00:00Z and negotiation_deadline_at 2026-10-30T00:00:00Z (clock + GOOD_FAITH_NEGOTIATION_DAYS 90)"
            - "the re-read declaration already reports preference_offer_count == 1 and unresolved_preference_count == 1"
