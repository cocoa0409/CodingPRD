            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${ves}", voyage_ref: "VB", scheduled_eta: "2026-08-12T08:00:00Z", scheduled_etd: "2026-08-12T20:00:00Z", booked_embark_pax: 1501, booked_debark_pax: 1498 }, as: VesselAgent, as_user_id: "${ves}", captures: { pcb: $.data.id, pcb_v: $.data.version } }
