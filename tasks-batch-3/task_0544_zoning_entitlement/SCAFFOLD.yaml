# =============================================================================
# PRD Benchmark Scaffold — Planning & Zoning Entitlement (task_0544)
# Difficulty band: Expert
# =============================================================================

scenario: |
  Planning & Zoning Entitlement (variance/rezone/CUP): application intake &
  completeness, staff review & public-notice mailing, hearing (planning
  commission/council) calendar, condition of approval & findings, appeal window,
  plat/subdivision & impact fee, expiration/extension, GIS parcel linkage

domain_name: zoning-entitlement
api_prefix: /

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - scheduled_deferred_actions      # appeal window, notice period, expiration/extension, all clock-driven
    - cascading_side_effects          # decision -> conditions/findings/appeal-window; plat record -> fee -> app -> parcel
    - optimistic_concurrency          # OCC on Hearing.version for agenda placement (finite agenda capacity)
    - rate_threshold_triggers         # tiered impact fee, notice-period minimums, calendar buffer

  entity_topology: flat
  # Peer entities linked by foreign keys (Application, Parcel, Hearing, Appeal,
  # Plat, ImpactFeeAssessment ...). URL nesting is used only for genuine
  # ownership sub-resources (an Application's notices/conditions/findings).

  state_machine_shape: branching
  # Application review is a revision loop (INCOMPLETE <-> SUBMITTED cycle) and
  # the hearing decision forks APPROVE / DENY / CONTINUE with divergent
  # side-effect sets. Appeal forks UPHELD / DENIED / WITHDRAWN.

  relationship_patterns:
    - one_to_many        # Application -> CompletenessReview / NoticeMailing / Condition / Finding / Appeal / Plat
    - cross_aggregate    # HearingAgendaItem links Application <-> Hearing; ImpactFeeAssessment <-> Plat
    - polymorphic        # application_type gates which downstream entities (Plat/ImpactFee) apply

  role_model: segregation_of_duties
  # The Commissioner who records a hearing decision must not be the Planner who
  # authored the completeness/staff review for the same application.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Parcel
    parent: null
    common_fields: true    # id, created_at, updated_at, version
    fields:
      - { name: apn, type: string, source: input, description: "Assessor Parcel Number (GIS parcel key); unique across parcels" }
      - { name: zoning_district, type: enum, source: input, description: "Current zoning: RES | COMM | IND | AG" }
      - { name: area_acres, type: number, source: input, description: "Parcel area in acres (> 0)" }
      - { name: neighbor_parcel_count, type: integer, source: input, description: "GIS-derived count of parcels within the 300ft standard notice radius (>= 0)" }
      - { name: expanded_neighbor_count, type: integer, source: input, description: "GIS-derived count of parcels within the 500ft expanded notice radius (>= neighbor_parcel_count)" }
      - { name: sensitive_area, type: boolean, source: input, default: false, description: "True if parcel is in a sensitive overlay requiring expanded (500ft) notice" }
      - { name: assessed_fee_cents, type: integer, source: computed, default: 0, description: "Conserved fee-liability ledger = sum of total_fee_cents over non-voided assessments for this parcel (see parcel_assessed_fee_ledger)" }
      - { name: status, type: enum, source: system, default: "AVAILABLE", description: "AVAILABLE -> UNDER_APPLICATION -> ENTITLED -> SUBDIVIDED; mutated by application/plat cascades" }

  - name: FeeSchedule
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Fee schedule label (e.g. 'FY26 Impact Fees')" }
      - { name: park_fee_per_lot_cents, type: integer, source: input, description: "Park impact fee charged per subdivision lot, in cents" }
      - { name: road_fee_tier1_per_acre_cents, type: integer, source: input, description: "Road fee per acre for the first 5 acres, in cents" }
      - { name: road_fee_tier2_per_acre_cents, type: integer, source: input, description: "Road fee per acre for acres 5..20, in cents" }
      - { name: road_fee_tier3_per_acre_cents, type: integer, source: input, description: "Road fee per acre for acres above 20, in cents" }
      - { name: admin_pct, type: number, source: input, description: "Administrative surcharge fraction applied to the discounted subtotal (e.g. 0.05)" }
      - { name: affordable_discount_pct, type: number, source: input, description: "Discount fraction applied when application.affordable_housing is true (e.g. 0.20)" }
      - { name: credit_pct, type: number, source: input, description: "Cap fraction limiting prior-payment credit against the gross fee (e.g. 0.10)" }
      - { name: fee_cap_cents, type: integer, source: input, description: "Absolute cap on the gross impact fee, in cents" }

  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Applicant legal name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: organization, type: string, source: input, required: false, description: "Optional firm/org name" }

  - name: EntitlementApplication
    parent: null
    common_fields: true
    fields:
      - { name: application_type, type: enum, source: input, description: "VARIANCE | REZONE | CUP | SUBDIVISION" }
      - { name: parcel_id, type: string, source: input, description: "FK -> Parcel.id; the GIS parcel this entitlement runs with" }
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id; the filing applicant" }
      - { name: requested_use, type: string, source: input, description: "Free-text description of the requested use/relief" }
      - { name: affordable_housing, type: boolean, source: input, default: false, description: "Affordable-housing project flag; enables impact-fee discount for SUBDIVISION plats" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT->SUBMITTED->(INCOMPLETE loop)->ACCEPTED->SCHEDULED->DECIDED_APPROVED|DECIDED_DENIED->EFFECTIVE->EXPIRED|RECORDED; plus WITHDRAWN, DENIED_ON_APPEAL, CLOSED" }
      - { name: submitted_at, type: datetime, source: system, description: "Timestamp of the FIRST submit (start of the parcel review window); null while DRAFT" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Number of INCOMPLETE->SUBMITTED resubmissions" }
      - { name: assigned_planner_user_id, type: string, source: system, description: "X-User-ID of the Planner who recorded the first completeness review; anchors segregation-of-duties" }
      - { name: decision, type: enum, source: system, description: "APPROVED | DENIED; null until a hearing decision is recorded" }
      - { name: decision_at, type: datetime, source: system, description: "Timestamp the hearing decision was recorded" }
      - { name: appeal_deadline, type: datetime, source: system, description: "= decision_at + APPEAL_WINDOW_DAYS; last instant an appeal may be filed" }
      - { name: provisional_expiration_date, type: datetime, source: system, description: "Estimated expiration computed at decision time = decision_at + entitlement_days (null for REZONE)" }
      - { name: effective_date, type: datetime, source: system, description: "Set at effectuate; the instant the entitlement vests (= appeal_deadline)" }
      - { name: final_expiration_date, type: datetime, source: system, description: "Authoritative expiration = effective_date + entitlement_days (+ extensions); null for REZONE" }
      - { name: extension_count, type: integer, source: system, default: 0, description: "Number of granted extensions (<= MAX_EXTENSIONS)" }
      - { name: review_window_closed_at, type: datetime, source: system, description: "End of the parcel active-review interval; set when the application reaches a terminal or EFFECTIVE state; null while active" }

  - name: CompletenessReview
    parent: EntitlementApplication
    common_fields: false   # id + created_at only (append-only staff record)
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> EntitlementApplication.id" }
      - { name: cycle_number, type: integer, source: system, description: "1-based review cycle index (= revision_count at time of review + 1)" }
      - { name: determination, type: enum, source: input, description: "COMPLETE | INCOMPLETE" }
      - { name: deficiency_notes, type: string, source: input, required: false, description: "Required when determination=INCOMPLETE; text of the deficiency list" }
      - { name: reviewed_by, type: string, source: system, description: "X-User-ID of the reviewing Planner" }

  - name: NoticeMailing
    parent: EntitlementApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> EntitlementApplication.id" }
      - { name: notice_kind, type: enum, source: input, description: "MAILED | PUBLISHED | POSTED" }
      - { name: mailed_at, type: datetime, source: system, description: "Logical-clock timestamp the mailing was generated (start of the statutory notice period)" }
      - { name: recipient_count, type: integer, source: computed, description: "Computed from parcel neighbor counts and sensitive_area (see notice_recipient_count)" }
      - { name: used_expanded_radius, type: boolean, source: computed, description: "True when the 500ft expanded radius was applied (parcel.sensitive_area)" }
      - { name: status, type: enum, source: system, default: "SENT", description: "SENT -> VOIDED (on application withdrawal cascade)" }

  - name: Hearing
    parent: null
    common_fields: true
    fields:
      - { name: body, type: enum, source: input, description: "PLANNING_COMMISSION | CITY_COUNCIL" }
      - { name: scheduled_date, type: datetime, source: input, description: "Calendar date/time the hearing convenes" }
      - { name: agenda_capacity, type: integer, source: input, description: "Maximum number of agenda items this hearing may hold (>= 1)" }
      - { name: agenda_slots_remaining, type: integer, source: computed, description: "= agenda_capacity - count(agenda items with status != REMOVED); conserved-quantity for slot invariant" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED -> CANCELLED" }

  - name: HearingAgendaItem
    parent: Hearing
    common_fields: true
    fields:
      - { name: hearing_id, type: string, source: system, description: "FK -> Hearing.id" }
      - { name: application_id, type: string, source: input, description: "FK -> EntitlementApplication.id; the application placed on this agenda" }
      - { name: agenda_position, type: integer, source: system, description: "1-based placement order within the hearing (assignment order = created_at ASC)" }
      - { name: decision, type: enum, source: system, description: "APPROVED | DENIED; null until decided" }
      - { name: continued_to_hearing_id, type: string, source: system, description: "When CONTINUED, the Hearing.id the item was rolled to (a fresh PLACED item is created there)" }
      - { name: status, type: enum, source: system, default: "PLACED", description: "PLACED -> APPROVED | DENIED | CONTINUED | REMOVED" }

  - name: ConditionOfApproval
    parent: EntitlementApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> EntitlementApplication.id" }
      - { name: condition_code, type: string, source: input, description: "Short code, e.g. COA-1" }
      - { name: condition_text, type: string, source: input, description: "Full text of the condition" }
      - { name: satisfied, type: boolean, source: system, default: false, description: "Whether the condition has been marked satisfied" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE -> VOIDED (on DENIED_ON_APPEAL / withdrawal cascade)" }

  - name: Finding
    parent: EntitlementApplication
    common_fields: false   # id + created_at only (immutable evidentiary record)
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> EntitlementApplication.id" }
      - { name: finding_code, type: string, source: input, description: "Finding code, e.g. F-A, F-B" }
      - { name: finding_text, type: string, source: input, description: "Text of the finding of fact" }
      - { name: supports_approval, type: boolean, source: input, description: "Whether this finding supports approval" }

  - name: Appeal
    parent: EntitlementApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> EntitlementApplication.id; the appealed application" }
      - { name: appellant_name, type: string, source: input, description: "Name of the party filing the appeal" }
      - { name: grounds, type: string, source: input, description: "Stated grounds for appeal" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock timestamp the appeal was filed (must be <= application.appeal_deadline)" }
      - { name: status, type: enum, source: system, default: "FILED", description: "FILED -> UPHELD | DENIED | WITHDRAWN" }

  - name: Plat
    parent: EntitlementApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> EntitlementApplication.id; must be a SUBDIVISION application in EFFECTIVE state" }
      - { name: fee_schedule_id, type: string, source: input, description: "FK -> FeeSchedule.id; schedule whose rates are snapshotted onto the assessment" }
      - { name: declared_lot_count, type: integer, source: input, description: "Lot count declared at plat submission (drives provisional fee); >= 1" }
      - { name: declared_gross_acres, type: number, source: input, description: "Gross acres declared at submission (drives provisional fee); > 0" }
      - { name: prior_paid_fee_cents, type: integer, source: input, default: 0, description: "Prior impact fee already paid on this parcel, eligible for credit (>= 0)" }
      - { name: recorded_lot_count, type: integer, source: input, description: "Actual lot count at recordation (drives final fee); provided on record; >= 1" }
      - { name: recorded_gross_acres, type: number, source: input, description: "Actual gross acres at recordation; provided on record; > 0" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING -> RECORDED -> VACATED; or PENDING -> REJECTED" }

  - name: ImpactFeeAssessment
    parent: Plat
    common_fields: true
    fields:
      - { name: plat_id, type: string, source: system, description: "FK -> Plat.id" }
      - { name: provisional_fee_cents, type: integer, source: computed, description: "Net fee computed at plat submission from declared_lot_count/declared_gross_acres (see impact_fee_provisional_vs_final)" }
      - { name: final_fee_cents, type: integer, source: computed, description: "Net fee computed at plat recordation from recorded_lot_count/recorded_gross_acres; null until RECORDED" }
      - { name: total_fee_cents, type: integer, source: computed, description: "Authoritative amount owed = final_fee_cents once ASSESSED (provisional_fee_cents while PROVISIONAL)" }
      - { name: gross_fee_cents, type: integer, source: computed, description: "Gross (pre-credit) fee at the current stage; used for credit cap" }
      - { name: credit_cents, type: integer, source: computed, description: "Prior-payment credit applied (see impact_fee_credit_net)" }
      - { name: amount_paid_cents, type: integer, source: system, default: 0, description: "Cumulative amount paid against this assessment" }
      - { name: status, type: enum, source: system, default: "PROVISIONAL", description: "PROVISIONAL -> ASSESSED -> PAID; ASSESSED|PAID -> VOIDED (plat vacate)" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: EntitlementApplication
    initial_state: DRAFT
    terminal_states: [EXPIRED, RECORDED, WITHDRAWN, DENIED_ON_APPEAL, CLOSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /applications/{id}/submit"
        actor: Applicant
        preconditions:
          - "Acting applicant owns the application (applicant_id == X-User-ID) (ERR_NOT_RESOURCE_OWNER)"
          - "No other EntitlementApplication on the same parcel has an overlapping active review window (ERR_PARCEL_REVIEW_CONFLICT)"
        side_effects:
          - "submitted_at = clock now (first submit only); review_window_closed_at = null"
          - "Parcel.status AVAILABLE -> UNDER_APPLICATION"

      - from: SUBMITTED
        to: INCOMPLETE
        trigger: "POST /applications/{id}/completeness (determination=INCOMPLETE)"
        actor: Planner
        preconditions:
          - "deficiency_notes present (ERR_DEFICIENCY_NOTES_REQUIRED)"
        side_effects:
          - "Create CompletenessReview(cycle_number = revision_count+1, determination=INCOMPLETE)"
          - "assigned_planner_user_id = X-User-ID if not already set"

      - from: INCOMPLETE
        to: SUBMITTED
        trigger: "POST /applications/{id}/submit"
        actor: Applicant
        preconditions:
          - "Acting applicant owns the application (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "revision_count += 1 (revision loop; submitted_at unchanged)"
        note: "Cyclic revision loop: SUBMITTED <-> INCOMPLETE."

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /applications/{id}/completeness (determination=COMPLETE)"
        actor: Planner
        preconditions: []
        side_effects:
          - "Create CompletenessReview(cycle_number = revision_count+1, determination=COMPLETE)"
          - "assigned_planner_user_id = X-User-ID if not already set"

      - from: ACCEPTED
        to: SCHEDULED
        trigger: "POST /hearings/{id}/agenda-items (application_id = this)"
        actor: Clerk
        preconditions:
          - "Hearing.status == SCHEDULED (ERR_HEARING_NOT_OPEN)"
          - "Hearing has remaining agenda capacity (ERR_AGENDA_FULL)"
          - "expected_hearing_version matches Hearing.version (ERR_STALE_HEARING_VERSION)"
          - "A SENT NoticeMailing exists for this application (ERR_NOTICE_MISSING)"
          - "(hearing.scheduled_date - notice.mailed_at) in whole days >= NOTICE_MIN_DAYS for hearing.body (ERR_NOTICE_PERIOD_NOT_MET)"
        side_effects:
          - "Create HearingAgendaItem(status=PLACED); Hearing.agenda_slots_remaining -= 1; increments Hearing.version by 1"

      - from: SCHEDULED
        to: DECIDED_APPROVED
        trigger: "POST /agenda-items/{id}/decide (decision=APPROVE)"
        actor: Commissioner
        preconditions:
          - "Acting Commissioner X-User-ID != application.assigned_planner_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "At least one supporting Finding supplied (ERR_FINDINGS_REQUIRED)"
        side_effects:
          - "decision = APPROVED; decision_at = clock now"
          - "appeal_deadline = decision_at + APPEAL_WINDOW_DAYS"
          - "provisional_expiration_date = decision_at + entitlement_days (null for REZONE)"
          - "Create ConditionOfApproval rows from payload conditions[]"
          - "Create Finding rows from payload findings[]"
          - "HearingAgendaItem.decision=APPROVED, status=APPROVED"

      - from: SCHEDULED
        to: DECIDED_DENIED
        trigger: "POST /agenda-items/{id}/decide (decision=DENY)"
        actor: Commissioner
        preconditions:
          - "Acting Commissioner X-User-ID != application.assigned_planner_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "At least one Finding supplied (ERR_FINDINGS_REQUIRED)"
        side_effects:
          - "decision = DENIED; decision_at = clock now; appeal_deadline = decision_at + APPEAL_WINDOW_DAYS"
          - "Create Finding rows from payload findings[]"
          - "HearingAgendaItem.decision=DENIED, status=DENIED"

      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /agenda-items/{id}/decide (decision=CONTINUE)"
        actor: Commissioner
        preconditions:
          - "continued_to_hearing_id references a SCHEDULED Hearing with remaining capacity (ERR_HEARING_NOT_OPEN)"
        side_effects:
          - "current HearingAgendaItem.status=CONTINUED, continued_to_hearing_id set"
          - "Create fresh HearingAgendaItem(status=PLACED) on the target hearing; target Hearing.agenda_slots_remaining -= 1; increments target Hearing.version by 1"
        note: "Cyclic continuance across agenda items; application stays SCHEDULED."

      - from: DECIDED_APPROVED
        to: EFFECTIVE
        trigger: "POST /applications/{id}/effectuate"
        actor: Clerk
        preconditions:
          - "clock now > appeal_deadline (ERR_APPEAL_WINDOW_OPEN)"
          - "No Appeal for this application is in FILED or UPHELD state (ERR_APPEAL_PENDING)"
        side_effects:
          - "effective_date = appeal_deadline"
          - "final_expiration_date = effective_date + entitlement_days (null for REZONE)"
          - "Parcel.status UNDER_APPLICATION -> ENTITLED"

      - from: DECIDED_APPROVED
        to: DENIED_ON_APPEAL
        trigger: "POST /appeals/{id}/resolve (resolution=UPHELD)"
        actor: Clerk
        preconditions: []
        side_effects:
          - "All ConditionOfApproval rows for the application: status ACTIVE -> VOIDED"
          - "Parcel.status -> AVAILABLE; review_window_closed_at = clock now"
        note: "Compensation: appeal upheld reverses the approval."

      - from: DECIDED_DENIED
        to: CLOSED
        trigger: "POST /applications/{id}/effectuate"
        actor: Clerk
        preconditions:
          - "clock now > appeal_deadline (ERR_APPEAL_WINDOW_OPEN)"
          - "No Appeal in FILED or UPHELD state (ERR_APPEAL_PENDING)"
        side_effects:
          - "Parcel.status -> AVAILABLE; review_window_closed_at = clock now"

      - from: EFFECTIVE
        to: EXPIRED
        trigger: "POST /applications/{id}/effectuate (system re-check) or clock advance past final_expiration_date"
        actor: Clerk
        preconditions:
          - "application_type != REZONE (REZONE never expires)"
          - "clock now > final_expiration_date (ERR_NOT_YET_EXPIRED)"
        side_effects:
          - "Parcel.status ENTITLED -> AVAILABLE; review_window_closed_at = clock now"

      - from: EFFECTIVE
        to: RECORDED
        trigger: "POST /plats/{id}/record (cascade)"
        actor: Clerk
        preconditions:
          - "application_type == SUBDIVISION"
        side_effects:
          - "review_window_closed_at = clock now"
          - "Parcel.status ENTITLED -> SUBDIVIDED"
        note: "Reached transitively from plat recordation; see Plat state machine."

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Applicant
        preconditions:
          - "Acting applicant owns the application (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "review_window_closed_at = clock now; Parcel.status -> AVAILABLE (if it was UNDER_APPLICATION)"

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Applicant
        preconditions: []
        side_effects:
          - "review_window_closed_at = clock now; Parcel.status -> AVAILABLE"

      - from: INCOMPLETE
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Applicant
        preconditions: []
        side_effects:
          - "review_window_closed_at = clock now; Parcel.status -> AVAILABLE"

      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Applicant
        preconditions: []
        side_effects:
          - "review_window_closed_at = clock now; Parcel.status -> AVAILABLE"

      - from: SCHEDULED
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Applicant
        preconditions: []
        side_effects:
          - "Every non-terminal HearingAgendaItem (status=PLACED) for this application: status -> REMOVED"
          - "Each removed item's Hearing.agenda_slots_remaining += 1"
          - "review_window_closed_at = clock now; Parcel.status -> AVAILABLE"
        note: "Cascade origin for the agenda-slot compensating invariant."

  - entity: Hearing
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /hearings/{id}/cancel"
        actor: Clerk
        preconditions:
          - "No PLACED agenda items remain (ERR_AGENDA_NOT_EMPTY)"
        side_effects: []

  - entity: HearingAgendaItem
    initial_state: PLACED
    terminal_states: [APPROVED, DENIED, CONTINUED, REMOVED]
    transitions:
      - from: PLACED
        to: APPROVED
        trigger: "POST /agenda-items/{id}/decide (decision=APPROVE)"
        actor: Commissioner
        preconditions:
          - "parent application.status == SCHEDULED"
        side_effects:
          - "drives EntitlementApplication SCHEDULED -> DECIDED_APPROVED (see application SM)"
      - from: PLACED
        to: DENIED
        trigger: "POST /agenda-items/{id}/decide (decision=DENY)"
        actor: Commissioner
        preconditions:
          - "parent application.status == SCHEDULED"
        side_effects:
          - "drives EntitlementApplication SCHEDULED -> DECIDED_DENIED"
      - from: PLACED
        to: CONTINUED
        trigger: "POST /agenda-items/{id}/decide (decision=CONTINUE)"
        actor: Commissioner
        preconditions:
          - "continued_to_hearing_id is a SCHEDULED Hearing with remaining capacity"
        side_effects:
          - "spawn fresh PLACED item on the target hearing; decrement target Hearing.agenda_slots_remaining"
      - from: PLACED
        to: REMOVED
        trigger: "system (application withdrawal cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "Hearing.agenda_slots_remaining += 1"

  - entity: Appeal
    initial_state: FILED
    terminal_states: [UPHELD, DENIED, WITHDRAWN]
    transitions:
      - from: FILED
        to: UPHELD
        trigger: "POST /appeals/{id}/resolve (resolution=UPHELD)"
        actor: Clerk
        preconditions:
          - "application.status == DECIDED_APPROVED (ERR_INVALID_STATE)"
        side_effects:
          - "drives application DECIDED_APPROVED -> DENIED_ON_APPEAL (voids conditions, reverts parcel)"
      - from: FILED
        to: DENIED
        trigger: "POST /appeals/{id}/resolve (resolution=DENIED)"
        actor: Clerk
        preconditions: []
        side_effects:
          - "application decision stands; application may proceed to effectuate after window"
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /appeals/{id}/resolve (resolution=WITHDRAWN)"
        actor: Clerk
        preconditions: []
        side_effects:
          - "application decision stands"
    note: "Branching fork with divergent side-effect sets (UPHELD reverses; DENIED/WITHDRAWN let the decision stand)."

  - entity: Plat
    initial_state: PENDING
    terminal_states: [REJECTED, VACATED]
    transitions:
      - from: PENDING
        to: RECORDED
        trigger: "POST /plats/{id}/record"
        actor: Clerk
        preconditions:
          - "recorded_lot_count and recorded_gross_acres supplied and valid (ERR_INVALID_REQUEST)"
        side_effects:
          - "Compute final_fee_cents; ImpactFeeAssessment.status PROVISIONAL -> ASSESSED, total_fee_cents = final_fee_cents"
          - "Parcel.assessed-fee ledger increases by final_fee_cents (conserved quantity)"
          - "drives parent EntitlementApplication EFFECTIVE -> RECORDED (caused by ASSESSED)"
          - "drives Parcel ENTITLED -> SUBDIVIDED (caused by application RECORDED)"
        note: "Cascade origin: plat -> fee -> application -> parcel (depth 4)."
      - from: PENDING
        to: REJECTED
        trigger: "POST /plats/{id}/vacate (when still PENDING) or administrative rejection"
        actor: Clerk
        preconditions: []
        side_effects:
          - "ImpactFeeAssessment.status PROVISIONAL -> VOIDED"
      - from: RECORDED
        to: VACATED
        trigger: "POST /plats/{id}/vacate"
        actor: Clerk
        preconditions: []
        side_effects:
          - "ImpactFeeAssessment.status ASSESSED|PAID -> VOIDED; total_fee_cents removed from parcel assessed-fee ledger (compensation)"
          - "parent EntitlementApplication RECORDED -> EFFECTIVE; Parcel.status SUBDIVIDED -> ENTITLED"
        note: "Compensating action restoring the fee-liability invariant."

  - entity: ImpactFeeAssessment
    initial_state: PROVISIONAL
    terminal_states: [VOIDED]
    transitions:
      - from: PROVISIONAL
        to: ASSESSED
        trigger: "system (plat recordation)"
        actor: system
        preconditions: []
        side_effects:
          - "final_fee_cents computed; total_fee_cents = final_fee_cents"
      - from: ASSESSED
        to: PAID
        trigger: "POST /impact-fees/{id}/pay"
        actor: Applicant
        preconditions:
          - "assessment.status == ASSESSED (ERR_FEE_NOT_ASSESSED)"
          - "amount_cents == total_fee_cents (ERR_FEE_AMOUNT_MISMATCH)"
        side_effects:
          - "amount_paid_cents = total_fee_cents; status -> PAID"
      - from: ASSESSED
        to: VOIDED
        trigger: "system (plat vacate)"
        actor: system
        preconditions: []
        side_effects:
          - "remove total_fee_cents from parcel assessed-fee ledger"
      - from: PAID
        to: VOIDED
        trigger: "system (plat vacate)"
        actor: system
        preconditions: []
        side_effects:
          - "remove total_fee_cents from parcel assessed-fee ledger (compensation)"

  - entity: Parcel
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: UNDER_APPLICATION
        trigger: "system (application first submit)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNDER_APPLICATION
        to: ENTITLED
        trigger: "system (application effectuate)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNDER_APPLICATION
        to: AVAILABLE
        trigger: "system (application withdraw / deny-close)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ENTITLED
        to: SUBDIVIDED
        trigger: "system (plat record)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ENTITLED
        to: AVAILABLE
        trigger: "system (application expiration / appeal upheld)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUBDIVIDED
        to: ENTITLED
        trigger: "system (plat vacate)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: agenda-item-create-stale-hearing
    parent_entity: Hearing
    write_endpoint: "POST /hearings/{id}/agenda-items"
    occ_field: "expected_hearing_version"
    description: |
      Placing an application on a Hearing's agenda against a Hearing whose
      version has advanced since the clerk last observed it is rejected. The
      agenda has finite capacity; another placement (which legitimately consumes
      a slot) has already advanced Hearing.version, so this writer's view of the
      hearing is stale and the placement is refused before capacity is re-read.
    error_id: ERR_STALE_HEARING_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: notice_recipient_count
    trigger: "POST /applications/{id}/notices (notice creation)"
    algorithm: threshold
    formula: |
      parcel = application.parcel
      if parcel.sensitive_area:
        recipient_count = parcel.expanded_neighbor_count      # 500ft radius
        used_expanded_radius = true
      else:
        recipient_count = parcel.neighbor_parcel_count        # 300ft radius
        used_expanded_radius = false
    input_set: "The single Parcel linked by application.parcel_id"
    precision: "integer count"

  - name: impact_fee_gross
    trigger: "plat submission (provisional) and plat recordation (final)"
    algorithm: tiered_pricing
    formula: |
      # MODE (a): >=3 inputs, tiered selection + conditional branch + nested min cap.
      lots  = <declared_lot_count | recorded_lot_count>
      acres = <declared_gross_acres | recorded_gross_acres>
      park  = park_fee_per_lot_cents * lots
      # tiered road fee (marginal per-acre rates)
      t1 = min(acres, 5)          * road_fee_tier1_per_acre_cents
      t2 = min(max(acres-5,0),15) * road_fee_tier2_per_acre_cents   # acres 5..20
      t3 = max(acres-20,0)        * road_fee_tier3_per_acre_cents    # acres > 20
      road    = t1 + t2 + t3
      subtotal = park + road
      if application.affordable_housing:
        discount = round_half_up(subtotal * affordable_discount_pct)
      else:
        discount = 0
      subtotal_after = subtotal - discount
      admin = round_half_up(subtotal_after * admin_pct)
      gross_fee_cents = min(fee_cap_cents, subtotal_after + admin)
    input_set: "One Plat + its snapshotted FeeSchedule + parent application.affordable_housing"
    constants:
      PARK_FEE_PER_LOT_CENTS: 250000
      ROAD_TIER1_PER_ACRE_CENTS: 120000
      ROAD_TIER2_PER_ACRE_CENTS: 90000
      ROAD_TIER3_PER_ACRE_CENTS: 60000
      ADMIN_PCT: 0.05
      AFFORDABLE_DISCOUNT_PCT: 0.20
      FEE_CAP_CENTS: 10000000
      TIER1_BOUND_ACRES: 5
      TIER2_BOUND_ACRES: 20
    precision: "integer cents; round_half_up on each of discount and admin exactly once; road computed exactly in cents (no per-tier rounding)"
    note: "Rounding order pinned: subtotal and road are exact integer cents; discount rounded once; admin computed on the discounted subtotal and rounded once."

  - name: impact_fee_credit_net
    trigger: "plat submission (provisional) and plat recordation (final)"
    algorithm: waterfall_allocation
    formula: |
      # MODE (c): circular-looking dependency pinned to evaluation order.
      # Naively credit_cap would key on net_fee (since credit reduces net),
      # which is circular. It is pinned to key on gross_fee, evaluated FIRST.
      gross = impact_fee_gross(...)                     # computed before credit
      credit_cap = round_half_up(gross * credit_pct)
      credit = min(credit_cap, prior_paid_fee_cents)
      net_fee_cents = gross - credit
    input_set: "One Plat (gross_fee_cents, prior_paid_fee_cents) + FeeSchedule.credit_pct"
    constants:
      CREDIT_PCT: 0.10
    precision: "integer cents; credit_cap rounded once (round_half_up)"
    note: "Evaluation order is total = gross; credit_cap = f(gross); credit = min(cap, prior_paid); net = gross - credit. Never key credit_cap on net."

  - name: impact_fee_provisional_vs_final
    trigger: "provisional at plat submission; final at plat recordation"
    algorithm: forward_looking
    formula: |
      provisional_fee_cents = net( impact_fee_gross(lots=declared_lot_count, acres=declared_gross_acres) )
      final_fee_cents       = net( impact_fee_gross(lots=recorded_lot_count, acres=recorded_gross_acres) )
      # total_fee_cents = provisional_fee_cents while PROVISIONAL; = final_fee_cents once ASSESSED.
    input_set: "One Plat; provisional uses declared_* (forward-looking estimate), final uses recorded_* (actual)"
    variants:
      - name: provisional
        when: "computed at plat submission from applicant-declared lot count and acreage"
        difference: "uses declared_lot_count / declared_gross_acres; stored on assessment as provisional_fee_cents"
      - name: final
        when: "computed at plat recordation from clerk-recorded lot count and acreage"
        difference: "uses recorded_lot_count / recorded_gross_acres; may diverge from provisional when recorded quantities differ"
    precision: "integer cents"

  - name: application_expiration
    trigger: "provisional at hearing approval; final at effectuation"
    algorithm: forward_looking
    formula: |
      entitlement_days = { VARIANCE: 730, CUP: 730, SUBDIVISION: 1095, REZONE: null }[application_type]
      # REZONE never expires -> both dates null.
      provisional_expiration_date = (application_type == REZONE) ? null : decision_at   + entitlement_days
      final_expiration_date       = (application_type == REZONE) ? null : effective_date + entitlement_days
      # effective_date = appeal_deadline = decision_at + APPEAL_WINDOW_DAYS,
      # so final is APPEAL_WINDOW_DAYS later than provisional.
    input_set: "One EntitlementApplication; provisional keyed on decision_at, final keyed on effective_date"
    variants:
      - name: provisional
        when: "set at SCHEDULED -> DECIDED_APPROVED"
        difference: "measured from decision_at (before the appeal window elapses)"
      - name: final
        when: "set at DECIDED_APPROVED -> EFFECTIVE"
        difference: "measured from effective_date (= appeal_deadline); later than provisional by APPEAL_WINDOW_DAYS"
    constants:
      ENTITLEMENT_DAYS_VARIANCE: 730
      ENTITLEMENT_DAYS_CUP: 730
      ENTITLEMENT_DAYS_SUBDIVISION: 1095
      APPEAL_WINDOW_DAYS: 15
    precision: "whole-day date arithmetic (UTC)"

  - name: parcel_assessed_fee_ledger
    trigger: "plat record (add), plat vacate (remove)"
    algorithm: aggregation
    formula: |
      Parcel.assessed_fee_cents = sum over ImpactFeeAssessment a
        where a.status IN {ASSESSED, PAID} and a.plat.application.parcel_id == parcel.id
        of a.total_fee_cents
      # Maintained incrementally: += final_fee_cents on plat record; -= total_fee_cents on plat vacate.
    input_set: "All non-voided assessments whose plat's application runs with this parcel"
    precision: "integer cents"
    note: "Conserved quantity (Parcel.assessed_fee_cents) for the fee-liability compensating invariant (record then vacate restores prior value)."

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for the operation per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path/body resource ids exist, validated left-to-right (parcel, applicant, application, hearing, agenda item, appeal, plat, fee, fee_schedule)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints referencing an id

  - priority: 4
    category: business_referential
    check: "Ownership: acting Applicant's X-User-ID equals the target application's applicant_id for applicant-only mutations"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /applications/{id}/submit, /withdraw; POST /impact-fees/{id}/pay"

  - priority: 5
    category: state
    check: "Target resource is in a state from which this transition is allowed"
    error_id: "varies (ERR_INVALID_STATE, ERR_APPLICATION_NOT_ACCEPTED, ERR_HEARING_NOT_OPEN, ERR_FEE_NOT_ASSESSED, ...)"
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: business_safety
    check: "Segregation of duties: Commissioner recording a decision must not be the application's assigned_planner_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /agenda-items/{id}/decide"

  - priority: 7
    category: business_constraint
    check: "Concurrency: expected_hearing_version equals Hearing.version"
    error_id: ERR_STALE_HEARING_VERSION
    http_status: 412
    applies_to: "POST /hearings/{id}/agenda-items"

  - priority: 8
    category: business_constraint
    check: "Findings requirement: decision recording supplies >= 1 Finding (and >= 1 supporting Finding for APPROVE)"
    error_id: ERR_FINDINGS_REQUIRED
    http_status: 422
    applies_to: "POST /agenda-items/{id}/decide"

  - priority: 9
    category: business_constraint
    check: "Notice present: a SENT NoticeMailing exists for the application before agenda placement"
    error_id: ERR_NOTICE_MISSING
    http_status: 409
    applies_to: "POST /hearings/{id}/agenda-items"

  - priority: 10
    category: business_temporal
    check: "Notice period: whole days between notice.mailed_at and hearing.scheduled_date >= NOTICE_MIN_DAYS for the hearing body (PLANNING_COMMISSION=10, CITY_COUNCIL=15)"
    error_id: ERR_NOTICE_PERIOD_NOT_MET
    http_status: 422
    applies_to: "POST /hearings/{id}/agenda-items"

  - priority: 11
    category: business_temporal
    check: "Hearing calendar buffer: a new Hearing for the same body must be >= BODY_MIN_GAP_DAYS (14) from every existing non-CANCELLED hearing of that body"
    error_id: ERR_HEARING_CALENDAR_CONFLICT
    http_status: 409
    applies_to: "POST /hearings"

  - priority: 12
    category: business_temporal
    check: "Parcel review overlap: the new application's active review interval [submitted_at, open) must not overlap another active application's interval on the same parcel (half-open overlap)"
    error_id: ERR_PARCEL_REVIEW_CONFLICT
    http_status: 409
    applies_to: "POST /applications/{id}/submit (first submit)"

  - priority: 13
    category: business_temporal
    check: "Appeal window: appeal.filed_at (clock now) <= application.appeal_deadline (inclusive)"
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /appeals"

  - priority: 14
    category: business_temporal
    check: "Extension window: clock now within [final_expiration_date - EXT_REQUEST_WINDOW_DAYS, final_expiration_date]"
    error_id: ERR_EXTENSION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /applications/{id}/extend"

  - priority: 15
    category: business_constraint
    check: "Extension cap: extension_count < MAX_EXTENSIONS (1)"
    error_id: ERR_MAX_EXTENSIONS_REACHED
    http_status: 409
    applies_to: "POST /applications/{id}/extend"

  - priority: 16
    category: business_fiscal
    check: "Fee payment amount equals total_fee_cents exactly"
    error_id: ERR_FEE_AMOUNT_MISMATCH
    http_status: 402
    applies_to: "POST /impact-fees/{id}/pay"

  - priority: 17
    category: business_constraint
    check: "Field-level request validity (missing required fields, bad enum, non-positive acreage/lot counts, deficiency_notes required on INCOMPLETE)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all write endpoints
    note: "Field validity for a mutation is checked after auth/existence but the specific business rules above take priority when both apply."

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; the clock never falls back to wall-clock time."
    roles: [Admin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock now = to_iso8601"]

  # --- Parcel ---
  - method: POST
    path: "/parcels"
    description: "Create a GIS parcel record"
    roles: [Admin]
    code: 201
    input: [apn, zoning_district, area_acres, neighbor_parcel_count, expanded_neighbor_count, "sensitive_area?"]
    output: Parcel
    side_effects: ["status initialized AVAILABLE"]

  - method: GET
    path: "/parcels/{id}"
    description: "Get a parcel"
    roles: [Admin, Applicant, Planner, Clerk, Commissioner]
    code: 200
    input: []
    output: Parcel
    side_effects: []

  # --- FeeSchedule ---
  - method: POST
    path: "/fee-schedules"
    description: "Create an impact fee schedule"
    roles: [Admin]
    code: 201
    input: [name, park_fee_per_lot_cents, road_fee_tier1_per_acre_cents, road_fee_tier2_per_acre_cents, road_fee_tier3_per_acre_cents, admin_pct, affordable_discount_pct, credit_pct, fee_cap_cents]
    output: FeeSchedule
    side_effects: []

  - method: GET
    path: "/fee-schedules/{id}"
    description: "Get a fee schedule"
    roles: [Admin, Applicant, Planner, Clerk, Commissioner]
    code: 200
    input: []
    output: FeeSchedule
    side_effects: []

  # --- Applicant ---
  - method: POST
    path: "/applicants"
    description: "Register an applicant"
    roles: [Applicant, Admin]
    code: 201
    input: [full_name, email, "organization?"]
    output: Applicant
    side_effects: []

  - method: GET
    path: "/applicants/{id}"
    description: "Get an applicant"
    roles: [Admin, Applicant, Planner, Clerk, Commissioner]
    code: 200
    input: []
    output: Applicant
    side_effects: []

  # --- EntitlementApplication ---
  - method: POST
    path: "/applications"
    description: "Create an entitlement application (DRAFT)"
    roles: [Applicant]
    code: 201
    input: [application_type, parcel_id, applicant_id, requested_use, "affordable_housing?"]
    output: EntitlementApplication
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/applications"
    description: "List applications; filters reverse-reach parcel_id and applicant_id"
    roles: [Admin, Applicant, Planner, Clerk, Commissioner]
    code: 200
    input: ["applicant_id?", "parcel_id?", "status?", "limit?", "offset?"]
    output: "EntitlementApplication[]"
    side_effects: []

  - method: GET
    path: "/applications/{id}"
    description: "Get an application"
    roles: [Admin, Applicant, Planner, Clerk, Commissioner]
    code: 200
    input: []
    output: EntitlementApplication
    side_effects: []

  - method: POST
    path: "/applications/{id}/submit"
    description: "Submit (DRAFT->SUBMITTED) or resubmit after INCOMPLETE (INCOMPLETE->SUBMITTED)"
    roles: [Applicant]
    code: 200
    input: []
    output: EntitlementApplication
    side_effects: ["first submit: submitted_at set, Parcel->UNDER_APPLICATION, parcel-overlap check; resubmit: revision_count+=1"]

  - method: POST
    path: "/applications/{id}/completeness"
    description: "Record a completeness determination (SUBMITTED->ACCEPTED or SUBMITTED->INCOMPLETE)"
    roles: [Planner]
    code: 201
    input: [determination, "deficiency_notes?"]
    output: CompletenessReview
    side_effects: ["create CompletenessReview; set assigned_planner_user_id if unset; application state transition"]

  - method: GET
    path: "/applications/{id}/completeness-reviews"
    description: "List completeness reviews for an application (reverse-reach CompletenessReview.application_id)"
    roles: [Admin, Applicant, Planner, Clerk, Commissioner]
    code: 200
    input: []
    output: "CompletenessReview[]"
    side_effects: []

  - method: POST
    path: "/applications/{id}/notices"
    description: "Generate a public notice mailing (recipient_count computed from parcel)"
    roles: [Clerk]
    code: 201
    input: [notice_kind]
    output: NoticeMailing
    side_effects: ["mailed_at = clock now; recipient_count + used_expanded_radius computed"]

  - method: GET
    path: "/applications/{id}/notices"
    description: "List notice mailings for an application (reverse-reach NoticeMailing.application_id)"
    roles: [Admin, Applicant, Planner, Clerk, Commissioner]
    code: 200
    input: []
    output: "NoticeMailing[]"
    side_effects: []

  - method: POST
    path: "/applications/{id}/withdraw"
    description: "Withdraw an application (any non-terminal state)"
    roles: [Applicant]
    code: 200
    input: []
    output: EntitlementApplication
    side_effects: ["status=WITHDRAWN; cascade remove PLACED agenda items (restore hearing slots); Parcel->AVAILABLE"]

  - method: POST
    path: "/applications/{id}/effectuate"
    description: "Close the appeal window and vest (DECIDED_APPROVED->EFFECTIVE) or close a denial (DECIDED_DENIED->CLOSED); also expires (EFFECTIVE->EXPIRED) when past final_expiration_date"
    roles: [Clerk]
    code: 200
    input: []
    output: EntitlementApplication
    side_effects: ["effective_date/final_expiration_date set on approval path; Parcel status transitions"]

  - method: POST
    path: "/applications/{id}/extend"
    description: "Grant an expiration extension (EFFECTIVE only)"
    roles: [Clerk]
    code: 200
    input: []
    output: EntitlementApplication
    side_effects: ["final_expiration_date += EXTENSION_DAYS (365); extension_count += 1"]

  - method: GET
    path: "/applications/{id}/conditions"
    description: "List conditions of approval (reverse-reach ConditionOfApproval.application_id)"
    roles: [Admin, Applicant, Planner, Clerk, Commissioner]
    code: 200
    input: []
    output: "ConditionOfApproval[]"
    side_effects: []

  - method: GET
    path: "/applications/{id}/findings"
    description: "List findings (reverse-reach Finding.application_id)"
    roles: [Admin, Applicant, Planner, Clerk, Commissioner]
    code: 200
    input: []
    output: "Finding[]"
    side_effects: []

  - method: GET
    path: "/applications/{id}/appeals"
    description: "List appeals for an application (reverse-reach Appeal.application_id)"
    roles: [Admin, Applicant, Planner, Clerk, Commissioner]
    code: 200
    input: []
    output: "Appeal[]"
    side_effects: []

  - method: GET
    path: "/applications/{id}/agenda-items"
    description: "List agenda items for an application (reverse-reach HearingAgendaItem.application_id)"
    roles: [Admin, Applicant, Planner, Clerk, Commissioner]
    code: 200
    input: []
    output: "HearingAgendaItem[]"
    side_effects: []

  # --- Hearing ---
  - method: POST
    path: "/hearings"
    description: "Create a hearing on the body's calendar"
    roles: [Clerk]
    code: 201
    input: [body, scheduled_date, agenda_capacity]
    output: Hearing
    side_effects: ["status=SCHEDULED; agenda_slots_remaining = agenda_capacity; calendar-buffer check vs same-body hearings"]

  - method: GET
    path: "/hearings/{id}"
    description: "Get a hearing"
    roles: [Admin, Applicant, Planner, Clerk, Commissioner]
    code: 200
    input: []
    output: Hearing
    side_effects: []

  - method: POST
    path: "/hearings/{id}/agenda-items"
    description: "Place an ACCEPTED application on the hearing agenda (OCC on Hearing.version)"
    roles: [Clerk]
    code: 201
    input: [application_id, expected_hearing_version]
    output: HearingAgendaItem
    side_effects: ["application ACCEPTED->SCHEDULED; agenda_slots_remaining-=1; increments Hearing.version by 1"]

  - method: GET
    path: "/hearings/{id}/agenda-items"
    description: "List agenda items on a hearing (reverse-reach HearingAgendaItem.hearing_id)"
    roles: [Admin, Applicant, Planner, Clerk, Commissioner]
    code: 200
    input: []
    output: "HearingAgendaItem[]"
    side_effects: []

  - method: POST
    path: "/hearings/{id}/cancel"
    description: "Cancel a SCHEDULED hearing (only when it holds no PLACED agenda items)"
    roles: [Clerk]
    code: 200
    input: []
    output: Hearing
    side_effects: ["status SCHEDULED -> CANCELLED"]

  - method: GET
    path: "/agenda-items/{id}"
    description: "Get an agenda item"
    roles: [Admin, Applicant, Planner, Clerk, Commissioner]
    code: 200
    input: []
    output: HearingAgendaItem
    side_effects: []

  - method: POST
    path: "/agenda-items/{id}/decide"
    description: "Record a hearing decision on the item (APPROVE / DENY / CONTINUE)"
    roles: [Commissioner]
    code: 200
    input: [decision, "conditions?", "findings?", "continued_to_hearing_id?"]
    output: HearingAgendaItem
    side_effects: ["APPROVE/DENY drives application decision, appeal window, conditions/findings; CONTINUE spawns new agenda item"]

  # --- Appeal ---
  - method: POST
    path: "/appeals"
    description: "File an appeal within the appeal window"
    roles: [Applicant, Clerk]
    code: 201
    input: [application_id, appellant_name, grounds]
    output: Appeal
    side_effects: ["filed_at = clock now; status=FILED"]

  - method: GET
    path: "/appeals/{id}"
    description: "Get an appeal"
    roles: [Admin, Applicant, Planner, Clerk, Commissioner]
    code: 200
    input: []
    output: Appeal
    side_effects: []

  - method: POST
    path: "/appeals/{id}/resolve"
    description: "Resolve an appeal (UPHELD / DENIED / WITHDRAWN)"
    roles: [Clerk]
    code: 200
    input: [resolution]
    output: Appeal
    side_effects: ["UPHELD drives application DECIDED_APPROVED->DENIED_ON_APPEAL (void conditions, revert parcel)"]

  # --- Plat / Impact Fee ---
  - method: POST
    path: "/plats"
    description: "Submit a subdivision plat (creates provisional ImpactFeeAssessment)"
    roles: [Applicant]
    code: 201
    input: [application_id, fee_schedule_id, declared_lot_count, declared_gross_acres, "prior_paid_fee_cents?"]
    output: Plat
    side_effects: ["requires application_type==SUBDIVISION and status==EFFECTIVE (ERR_APPLICATION_NOT_EFFECTIVE); status=PENDING; create ImpactFeeAssessment(PROVISIONAL) with provisional_fee_cents"]

  - method: GET
    path: "/plats"
    description: "List plats; filters reverse-reach application_id and fee_schedule_id"
    roles: [Admin, Applicant, Planner, Clerk, Commissioner]
    code: 200
    input: ["application_id?", "fee_schedule_id?", "limit?", "offset?"]
    output: "Plat[]"
    side_effects: []

  - method: GET
    path: "/plats/{id}"
    description: "Get a plat"
    roles: [Admin, Applicant, Planner, Clerk, Commissioner]
    code: 200
    input: []
    output: Plat
    side_effects: []

  - method: POST
    path: "/plats/{id}/record"
    description: "Record a pending plat (finalize fee; cascade to application and parcel)"
    roles: [Clerk]
    code: 200
    input: [recorded_lot_count, recorded_gross_acres]
    output: Plat
    side_effects: ["Plat->RECORDED; assessment->ASSESSED with final_fee_cents; application EFFECTIVE->RECORDED; Parcel->SUBDIVIDED; Parcel.assessed_fee_cents += final_fee_cents"]

  - method: POST
    path: "/plats/{id}/vacate"
    description: "Vacate a recorded plat (compensation) or reject a pending plat"
    roles: [Clerk]
    code: 200
    input: []
    output: Plat
    side_effects: ["RECORDED->VACATED: assessment->VOIDED, Parcel.assessed_fee_cents -= total_fee_cents, application RECORDED->EFFECTIVE, Parcel SUBDIVIDED->ENTITLED; PENDING->REJECTED: assessment->VOIDED"]

  - method: GET
    path: "/plats/{id}/impact-fee"
    description: "List the impact fee assessment(s) for a plat (reverse-reach ImpactFeeAssessment.plat_id)"
    roles: [Admin, Applicant, Planner, Clerk, Commissioner]
    code: 200
    input: []
    output: "ImpactFeeAssessment[]"
    side_effects: []

  - method: GET
    path: "/impact-fees/{id}"
    description: "Get an impact fee assessment"
    roles: [Admin, Applicant, Planner, Clerk, Commissioner]
    code: 200
    input: []
    output: ImpactFeeAssessment
    side_effects: []

  - method: POST
    path: "/impact-fees/{id}/pay"
    description: "Pay an assessed impact fee in full"
    roles: [Applicant]
    code: 200
    input: [amount_cents]
    output: ImpactFeeAssessment
    side_effects: ["status ASSESSED->PAID; amount_paid_cents = total_fee_cents"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 401, condition: "X-User-Role/X-User-ID missing or role unknown" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Acting applicant's X-User-ID does not equal the target application's applicant_id" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Commissioner recording a decision equals the application's assigned_planner_user_id" }
  # --- Not found ---
  - { id: ERR_PARCEL_NOT_FOUND, http: 404, condition: "parcel_id does not exist" }
  - { id: ERR_FEE_SCHEDULE_NOT_FOUND, http: 404, condition: "fee_schedule_id does not exist" }
  - { id: ERR_APPLICANT_NOT_FOUND, http: 404, condition: "applicant_id does not exist" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "application id does not exist" }
  - { id: ERR_HEARING_NOT_FOUND, http: 404, condition: "hearing id does not exist" }
  - { id: ERR_AGENDA_ITEM_NOT_FOUND, http: 404, condition: "agenda item id does not exist" }
  - { id: ERR_APPEAL_NOT_FOUND, http: 404, condition: "appeal id does not exist" }
  - { id: ERR_PLAT_NOT_FOUND, http: 404, condition: "plat id does not exist" }
  - { id: ERR_FEE_NOT_FOUND, http: 404, condition: "impact fee assessment id does not exist" }
  # --- Request validity ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid field, bad enum, non-positive acreage/lots, or deficiency_notes missing on INCOMPLETE" }
  - { id: ERR_DEFICIENCY_NOTES_REQUIRED, http: 400, condition: "INCOMPLETE completeness determination without deficiency_notes" }
  # --- State ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic: entity not in a state permitting this transition" }
  - { id: ERR_APPLICATION_NOT_ACCEPTED, http: 409, condition: "Agenda placement requires application.status == ACCEPTED" }
  - { id: ERR_HEARING_NOT_OPEN, http: 409, condition: "Target hearing is not SCHEDULED (HELD/CANCELLED)" }
  - { id: ERR_AGENDA_FULL, http: 409, condition: "Hearing has no remaining agenda capacity" }
  - { id: ERR_AGENDA_NOT_EMPTY, http: 409, condition: "Cancelling a hearing that still holds PLACED agenda items" }
  - { id: ERR_APPEAL_WINDOW_OPEN, http: 409, condition: "Effectuate attempted while clock now <= appeal_deadline" }
  - { id: ERR_APPEAL_PENDING, http: 409, condition: "Effectuate blocked by an Appeal in FILED or UPHELD state" }
  - { id: ERR_NOT_YET_EXPIRED, http: 409, condition: "Expire attempted before final_expiration_date" }
  - { id: ERR_FEE_NOT_ASSESSED, http: 409, condition: "Fee payment attempted while assessment not ASSESSED" }
  - { id: ERR_APPLICATION_NOT_EFFECTIVE, http: 409, condition: "Plat submission requires a SUBDIVISION application in EFFECTIVE state" }
  # --- Business ---
  - { id: ERR_FINDINGS_REQUIRED, http: 422, condition: "Decision recorded without required Finding(s)" }
  - { id: ERR_NOTICE_MISSING, http: 409, condition: "Agenda placement without a SENT NoticeMailing" }
  - { id: ERR_NOTICE_PERIOD_NOT_MET, http: 422, condition: "Days between mailed_at and hearing.scheduled_date < NOTICE_MIN_DAYS for the body" }
  - { id: ERR_HEARING_CALENDAR_CONFLICT, http: 409, condition: "New hearing within BODY_MIN_GAP_DAYS of an existing same-body hearing" }
  - { id: ERR_PARCEL_REVIEW_CONFLICT, http: 409, condition: "Two applications with overlapping active review windows on the same parcel" }
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 422, condition: "Appeal filed after appeal_deadline" }
  - { id: ERR_EXTENSION_WINDOW_CLOSED, http: 422, condition: "Extension requested outside [final_expiration_date - EXT_REQUEST_WINDOW_DAYS, final_expiration_date]" }
  - { id: ERR_MAX_EXTENSIONS_REACHED, http: 409, condition: "extension_count already == MAX_EXTENSIONS" }
  - { id: ERR_FEE_AMOUNT_MISMATCH, http: 402, condition: "Payment amount_cents != total_fee_cents" }
  # --- Concurrency ---
  - { id: ERR_STALE_HEARING_VERSION, http: 412, condition: "expected_hearing_version != Hearing.version" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Applicant
    description: "Files and manages entitlement applications, plats, appeals, and pays impact fees"
    identity: "entity_backed:Applicant"
    exclusive_operations:
      - "POST /applications — create application"
      - "POST /applications/{id}/submit — submit/resubmit"
      - "POST /applications/{id}/withdraw — withdraw"
      - "POST /plats — submit plat"
      - "POST /impact-fees/{id}/pay — pay impact fee"
    shared_operations:
      - "POST /applicants — register applicant (shared with Admin)"
      - "POST /appeals — file appeal (shared with Clerk)"
      - "GET endpoints (reads) — shared with all roles"

  - name: Planner
    description: "Staff reviewer: records completeness determinations; anchors segregation-of-duties"
    identity: "opaque"
    exclusive_operations:
      - "POST /applications/{id}/completeness — record completeness determination"
    shared_operations:
      - "GET endpoints (reads)"

  - name: Clerk
    description: "Records-clerk: notices, hearing calendar, agenda placement, effectuation, extension, plat recording/vacating, appeal resolution"
    identity: "opaque"
    exclusive_operations:
      - "POST /applications/{id}/notices — generate notice"
      - "POST /applications/{id}/effectuate — close appeal window / expire"
      - "POST /applications/{id}/extend — grant extension"
      - "POST /hearings — create hearing"
      - "POST /hearings/{id}/agenda-items — place on agenda (OCC)"
      - "POST /hearings/{id}/cancel — cancel hearing"
      - "POST /appeals/{id}/resolve — resolve appeal"
      - "POST /plats/{id}/record — record plat"
      - "POST /plats/{id}/vacate — vacate plat"
    shared_operations:
      - "POST /appeals — file appeal (shared with Applicant)"
      - "GET endpoints (reads)"

  - name: Commissioner
    description: "Hearing decision-maker (planning commission / council); records APPROVE/DENY/CONTINUE"
    identity: "opaque"
    exclusive_operations:
      - "POST /agenda-items/{id}/decide — record hearing decision"
    shared_operations:
      - "GET endpoints (reads)"

  - name: Admin
    description: "System operator: parcels, fee schedules, applicant registration, logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /parcels — create parcel"
      - "POST /fee-schedules — create fee schedule"
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "POST /applicants — register applicant (shared with Applicant)"
      - "GET endpoints (reads)"
