        claim_type: priority_ordering
        grounds:
          - "validations[priority=3]"
          - "validations[priority=4]"
        distinguishing_aspect: "Priority ordering: a request that has BOTH a malformed payload (unknown assessment kind) AND a non-existent path barrel returns ERR_VALIDATION (priority 3), not ERR_NOT_FOUND (priority 4)."
        test_recipe:
          setup: ["Default clock; no barrels exist."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - call: "POST /barrel-aging/barrels/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/assessments"
              payload: { kind: "BOGUS_KIND" }
              as: WarehouseManager
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_VALIDATION (payload checks run before existence checks)"

