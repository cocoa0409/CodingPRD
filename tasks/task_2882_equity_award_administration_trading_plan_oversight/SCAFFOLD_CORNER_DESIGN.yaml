            - "Grant.${g_id}.status is still PENDING_APPROVAL and approved_by_user_id is null"
            - "the board-1 approval returns HTTP 200 with status APPROVED and approved_by_user_id == \"board-1\""
            - "EquityPlan.shares_committed_cumulative == 400 only after the successful approval"

      - name: delegated_approval_blocked_for_psu_award
        claim_type: violation_to_error
        grounds:
