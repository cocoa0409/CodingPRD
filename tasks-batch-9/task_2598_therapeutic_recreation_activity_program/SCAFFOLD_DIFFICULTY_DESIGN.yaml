  - rule_id: cross_entity_state_dependency
    instances:
      - name: plan_activation_requires_admitted_resident
        entity_pair: "ActivityPlan depends on Resident.status"
        grounds:
          - state_machines.ActivityPlan.DRAFT_to_ACTIVE
          - validations.priority_28_ERR_RESIDENT_NOT_ADMITTED
          - entities.Resident.fields.status
        distinguishing_aspect: |
          The gating entity is the Resident and the dependent entity is the ActivityPlan: the plan
          is itself in a perfectly legal DRAFT state and every field on it is valid, so the only
          reason ACTIVATE fails is the state of a DIFFERENT entity. The returned error must be the
          cross-entity ERR_RESIDENT_NOT_ADMITTED, never the self-state ERR_PLAN_INVALID_STATE.
        test_recipe:
          setup:
            - "one resident created ADMITTED with a non-superseded governing assessment"
            - "one ActivityPlan for that resident, still DRAFT, created while the resident was ADMITTED"
            - "the resident is then PATCHed to status DISCHARGED, so the gating entity leaves the admitting state after the plan already exists"
          setup_api_calls:
            - call: "POST /recreation/residents"
              payload: { full_name: "Harold Vance", room_number: "140A", admission_date: "2026-01-11" }
              as: ActivityDirector
              captures: { res_id: $.data.id }
            - call: "POST /recreation/residents/${res_id}/assessments"
              payload: { cognitive_level: "MILD_IMPAIRMENT", functional_mobility: "ASSIST_1", interest_domains: ["SOCIAL"], preferred_group_size: "SMALL", effective_date: "2026-07-20" }
              as: RecreationTherapist
              captures: { asmt_id: $.data.id }
            - call: "GET /recreation/residents/${res_id}"
              as: RecreationTherapist
              captures: { res_ver: $.data.version }
            - call: "POST /recreation/activity-plans"
              payload: { resident_id: "${res_id}", source_assessment_id: "${asmt_id}", cycle_start_at: "2026-08-01T00:00:00Z", domain_frequency_targets: { SOCIAL: 2, COGNITIVE: 1, PHYSICAL: 0, SPIRITUAL: 0, CREATIVE: 0 }, expected_resident_version: "${res_ver}" }
              as: RecreationTherapist
              captures: { plan_id: $.data.id }
            - call: "PATCH /recreation/residents/${res_id}"
              payload: { status: "DISCHARGED" }
              as: ActivityDirector
          trigger:
            - call: "POST /recreation/activity-plans/${plan_id}/transition"
              payload: { action: "ACTIVATE" }
              as: RecreationTherapist
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409"
            - "${err_id} == \"ERR_RESIDENT_NOT_ADMITTED\""
            - "${err_id} != \"ERR_PLAN_INVALID_STATE\", because the plan's own status DRAFT does admit ACTIVATE"
            - "ActivityPlan.${plan_id}.status == DRAFT"
            - "ActivityPlan.${plan_id}.activated_at == null"
            - "Resident.${res_id}.status == DISCHARGED"
      - name: transport_booking_requires_available_vehicle
        entity_pair: "Outing depends on Vehicle.status"
        grounds:
          - state_machines.Outing.PLANNING_to_TRANSPORT_BOOKED
          - validations.priority_48_ERR_VEHICLE_OUT_OF_SERVICE
          - entities.Vehicle.fields.status
        distinguishing_aspect: |
          A different entity pair on a different endpoint: the Outing is the dependent entity and
          the Vehicle is the gating one. Because the vehicle PATCH bumps Vehicle.version, the test
          deliberately re-reads the vehicle first so expected_vehicle_version is FRESH — proving
          the rejection comes from the vehicle's status and not from the OCC guard.
        test_recipe:
          setup:
            - "one ADMITTED resident with functional_mobility INDEPENDENT"
            - "one vehicle created AVAILABLE with 8 ambulatory_seats and 2 wheelchair_stations"
            - "one Outing on that vehicle in logistics_status PLANNING with one REQUESTED consent, so calculations.outing_seat_allocation would yield seat_shortfall_total 0"
            - "the vehicle is then PATCHed to status OUT_OF_SERVICE and re-read, so the booking carries a matching expected_vehicle_version"
          setup_api_calls:
            - call: "POST /recreation/residents"
              payload: { full_name: "Pearl Adeyemi", room_number: "121A", admission_date: "2026-04-04" }
              as: ActivityDirector
              captures: { res_id: $.data.id }
            - call: "POST /recreation/residents/${res_id}/assessments"
              payload: { cognitive_level: "INTACT", functional_mobility: "INDEPENDENT", interest_domains: ["SOCIAL"], preferred_group_size: "LARGE", effective_date: "2026-07-20" }
              as: RecreationTherapist
            - call: "POST /recreation/programs"
              payload: { name: "Museum Outing", domain: "COGNITIVE", staffing_ratio_denominator: 4, max_group_size: 12, max_supervision_tier: "TIER_3" }
              as: ActivityDirector
              captures: { prog_id: $.data.id }
            - call: "POST /recreation/vehicles"
              payload: { label: "Van 2", ambulatory_seats: 8, wheelchair_stations: 2, turnaround_minutes: 30 }
              as: ActivityDirector
              captures: { veh_id: $.data.id }
            - call: "POST /recreation/outings"
              payload: { program_id: "${prog_id}", vehicle_id: "${veh_id}", destination: "County Art Museum", departure_at: "2026-08-14T09:00:00Z", return_at: "2026-08-14T14:00:00Z", escort_count: 1 }
              as: ActivityDirector
              captures: { outing_id: $.data.id }
            - call: "POST /recreation/outings/${outing_id}/consents"
              payload: { resident_id: "${res_id}", responsible_party_name: "Femi Adeyemi", responsible_party_relation: "ADULT_CHILD" }
              as: ActivityDirector
            - call: "PATCH /recreation/vehicles/${veh_id}"
              payload: { status: "OUT_OF_SERVICE" }
              as: ActivityDirector
            - call: "GET /recreation/vehicles/${veh_id}"
              as: ActivityDirector
              captures: { veh_ver: $.data.version }
          trigger:
            - call: "POST /recreation/outings/${outing_id}/transport-booking"
              payload: { expected_vehicle_version: "${veh_ver}" }
              as: ActivityDirector
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409"
            - "${err_id} == \"ERR_VEHICLE_OUT_OF_SERVICE\""
            - "${err_id} != \"ERR_STALE_VEHICLE_VERSION\", because expected_vehicle_version was re-read after the PATCH and therefore matches Vehicle.version"
            - "Outing.${outing_id}.logistics_status == PLANNING"
            - "Outing.${outing_id}.ambulatory_seats_required == 0"
            - "Vehicle.${veh_id}.reserved_ambulatory_seats == 0"
  - rule_id: resource_temporal_overlap
    instances:
      - name: room_buffer_widens_interval_on_both_sides
        resource_entity: ActivityRoom
        interval_semantics: "[starts_at, ends_at) widened by buffer_minutes on BOTH sides, half-open so a boundary touch is not an intersection"
        grounds:
          - validations.priority_25_ERR_ROOM_TIME_CONFLICT
          - entities.ActivityRoom.fields.buffer_minutes
        distinguishing_aspect: |
          The contested resource is a ROOM and the interval semantics are symmetric widening: with
          buffer_minutes 15 the occupied span of a 10:00-11:00 session is effectively
          [09:45, 11:15), and a candidate 11:10-12:10 session is itself widened to [10:55, 12:25),
          so the two intersect. Sliding the candidate five minutes later to 11:15-12:15 widens to
          exactly [11:00, 12:30), which only TOUCHES the excluded upper boundary and must be
          admitted. An implementation that widens on one side only, or that treats the touch as an
          overlap, fails one of the two calls.
        test_recipe:
          setup:
            - "one room with buffer_minutes 15 and capacity 10"
            - "one SCHEDULED session A in that room from 2026-08-10T10:00:00Z to 2026-08-10T11:00:00Z"
          setup_api_calls:
            - call: "POST /recreation/programs"
              payload: { name: "Bingo", domain: "COGNITIVE", staffing_ratio_denominator: 4, max_group_size: 10, max_supervision_tier: "TIER_3" }
              as: ActivityDirector
              captures: { prog_id: $.data.id }
            - call: "POST /recreation/rooms"
              payload: { name: "Buffered Hall", capacity: 10, buffer_minutes: 15 }
              as: ActivityDirector
              captures: { room_id: $.data.id }
            - call: "POST /recreation/sessions"
              payload: { program_id: "${prog_id}", room_id: "${room_id}", starts_at: "2026-08-10T10:00:00Z", ends_at: "2026-08-10T11:00:00Z", assigned_staff_count: 2 }
              as: ActivityDirector
              captures: { sess_a_id: $.data.id }
          trigger:
            - call: "POST /recreation/sessions"
              payload: { program_id: "${prog_id}", room_id: "${room_id}", starts_at: "2026-08-10T11:10:00Z", ends_at: "2026-08-10T12:10:00Z", assigned_staff_count: 2 }
              as: ActivityDirector
              captures: { err_id: $.data.error_id }
            - call: "POST /recreation/sessions"
              payload: { program_id: "${prog_id}", room_id: "${room_id}", starts_at: "2026-08-10T11:15:00Z", ends_at: "2026-08-10T12:15:00Z", assigned_staff_count: 2 }
              as: ActivityDirector
              captures: { sess_c_id: $.data.id }
          assert:
            - "the 11:10 candidate returns 409 and ${err_id} == \"ERR_ROOM_TIME_CONFLICT\": widened to [10:55, 12:25) it intersects session A's widened span [09:45, 11:15)"
            - "the 11:15 candidate returns 201 and creates ${sess_c_id}: widened to [11:00, 12:30) it only meets session A's widened span at the excluded boundary 11:15"
            - "ActivitySession.${sess_c_id}.status == SCHEDULED"
            - "ActivitySession.${sess_a_id}.status == SCHEDULED"
      - name: volunteer_double_booking_allows_back_to_back
        resource_entity: Volunteer
        interval_semantics: "[starts_at, ends_at) half-open with NO buffer on a person, so a gap of exactly zero is legal"
        grounds:
          - validations.priority_27_ERR_VOLUNTEER_TIME_CONFLICT
          - calculations.volunteer_hours
          - entities.Volunteer.fields.scheduled_hours_week
        distinguishing_aspect: |
          A different contested resource (a person, not a room) with deliberately different
          interval semantics: no buffer is applied, so back-to-back 10:00-12:00 and 12:00-14:00
          assignments are both legal, while a genuinely straddling 11:00-13:00 session is
          rejected. The straddling session is deliberately placed in a SECOND room so the room
          rule cannot fire first, and the cumulative 6.0 hours stay under the 8.0 weekly cap so
          the hour-cap rule cannot fire either — ERR_VOLUNTEER_TIME_CONFLICT is the only
          reachable error.
        test_recipe:
          setup:
            - "logical clock at 2026-08-05T08:00:00Z, inside the ISO week Monday 2026-08-03 .. Sunday 2026-08-09"
            - "one CLEARED volunteer with screening_level FULL"
            - "two rooms, each with buffer_minutes 0, so no room rule interferes"
            - "three sessions on 2026-08-06: V1 10:00-12:00 in room 1, V2 12:00-14:00 in room 1, V3 11:00-13:00 in room 2"
            - "the volunteer already holds a PROPOSED assignment on V1, so Volunteer.scheduled_hours_week == 2.0 before the trigger"
          setup_api_calls:
            - call: "POST /recreation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T08:00:00Z" }
              as: ActivityDirector
            - call: "POST /recreation/programs"
              payload: { name: "Pet Visit", domain: "SOCIAL", staffing_ratio_denominator: 4, max_group_size: 10, max_supervision_tier: "TIER_2", volunteer_eligible: true, required_screening_level: "BASIC" }
              as: ActivityDirector
              captures: { prog_id: $.data.id }
            - call: "POST /recreation/rooms"
              payload: { name: "Lounge East", capacity: 10, buffer_minutes: 0 }
              as: ActivityDirector
              captures: { room1_id: $.data.id }
            - call: "POST /recreation/rooms"
              payload: { name: "Lounge West", capacity: 10, buffer_minutes: 0 }
              as: ActivityDirector
              captures: { room2_id: $.data.id }
            - call: "POST /recreation/sessions"
              payload: { program_id: "${prog_id}", room_id: "${room1_id}", starts_at: "2026-08-06T10:00:00Z", ends_at: "2026-08-06T12:00:00Z", assigned_staff_count: 2 }
              as: ActivityDirector
              captures: { v1_id: $.data.id }
            - call: "POST /recreation/sessions"
              payload: { program_id: "${prog_id}", room_id: "${room1_id}", starts_at: "2026-08-06T12:00:00Z", ends_at: "2026-08-06T14:00:00Z", assigned_staff_count: 2 }
              as: ActivityDirector
              captures: { v2_id: $.data.id }
            - call: "POST /recreation/sessions"
              payload: { program_id: "${prog_id}", room_id: "${room2_id}", starts_at: "2026-08-06T11:00:00Z", ends_at: "2026-08-06T13:00:00Z", assigned_staff_count: 2 }
              as: ActivityDirector
              captures: { v3_id: $.data.id }
            - call: "POST /recreation/volunteers"
              payload: { full_name: "Grace Lindqvist", volunteer_type: "ADULT_COMMUNITY" }
              as: VolunteerCoordinator
              captures: { vol_id: $.data.id }
            - call: "POST /recreation/volunteers/${vol_id}/screening"
              payload: { event_type: "BACKGROUND_CHECK_CLEARED", cleared_on: "2026-07-01" }
              as: VolunteerCoordinator
            - call: "POST /recreation/volunteers/${vol_id}/screening"
              payload: { event_type: "ORIENTATION_COMPLETED", completed_on: "2026-07-05" }
              as: VolunteerCoordinator
            - call: "POST /recreation/volunteer-assignments"
              payload: { volunteer_id: "${vol_id}", session_id: "${v1_id}", role_type: "COMPANION" }
              as: VolunteerCoordinator
              captures: { asg1_id: $.data.id }
          trigger:
            - call: "POST /recreation/volunteer-assignments"
              payload: { volunteer_id: "${vol_id}", session_id: "${v2_id}", role_type: "COMPANION" }
              as: VolunteerCoordinator
              captures: { asg2_id: $.data.id }
            - call: "POST /recreation/volunteer-assignments"
              payload: { volunteer_id: "${vol_id}", session_id: "${v3_id}", role_type: "COMPANION" }
              as: VolunteerCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "the V2 assignment returns 201 and creates ${asg2_id}: [10:00, 12:00) and [12:00, 14:00) share only the excluded boundary 12:00"
            - "VolunteerAssignment.${asg2_id}.hours == 2.0"
            - "Volunteer.${vol_id}.scheduled_hours_week == 4.0"
            - "the V3 assignment returns 409 and ${err_id} == \"ERR_VOLUNTEER_TIME_CONFLICT\": [11:00, 13:00) genuinely intersects both existing assignments"
            - "${err_id} != \"ERR_VOLUNTEER_HOUR_CAP_EXCEEDED\", because 4.0 + 2.0 == 6.0 is still under the VOLUNTEER_WEEKLY_HOUR_CAP of 8.0"
            - "Volunteer.${vol_id}.scheduled_hours_week == 4.0 after the rejected call, unchanged"
  - rule_id: compensating_invariant
    instances:
      - name: outing_cancel_restores_vehicle_seat_conservation
        conserved_quantity: "Vehicle.reserved_ambulatory_seats and Vehicle.reserved_wheelchair_stations, each defined as the sum of the matching *_required field over this vehicle's Outings whose logistics_status IN {TRANSPORT_BOOKED, READY, DEPARTED}"
        grounds:
          - state_machines.Outing.TRANSPORT_BOOKED_to_CANCELLED
          - calculations.outing_seat_allocation
          - entities.Vehicle.fields.reserved_ambulatory_seats
          - entities.Vehicle.fields.reserved_wheelchair_stations
        distinguishing_aspect: |
          The conserved quantity is physical seat inventory on a Vehicle. Booking reserves 2
          ambulatory seats (one non-wheelchair rider plus escort_count 1) and 0 wheelchair
          stations; cancelling from TRANSPORT_BOOKED must return the counters to exactly their
          pre-booking values with no drift, and a second outing must then be able to book the same
          seats. An implementation that decrements the counters instead of re-deriving them from
          the reserving set, or that forgets the release entirely, leaves a permanent phantom
          reservation.
        test_recipe:
          setup:
            - "one ADMITTED resident with functional_mobility INDEPENDENT"
            - "one vehicle with 8 ambulatory_seats, 2 wheelchair_stations and turnaround_minutes 30, freshly created so both reservation counters are 0"
            - "one Outing on that vehicle departing 2026-08-16T09:00:00Z, returning 2026-08-16T13:00:00Z, escort_count 1, with one REQUESTED consent for the resident"
            - "transport is booked, so immediately before the trigger Vehicle.reserved_ambulatory_seats == 2, Vehicle.reserved_wheelchair_stations == 0 and Outing.logistics_status == TRANSPORT_BOOKED"
          setup_api_calls:
            - call: "POST /recreation/residents"
              payload: { full_name: "Lucien Marchetti", room_number: "150A", admission_date: "2026-03-09" }
              as: ActivityDirector
              captures: { res_id: $.data.id }
            - call: "POST /recreation/residents/${res_id}/assessments"
              payload: { cognitive_level: "INTACT", functional_mobility: "INDEPENDENT", interest_domains: ["SOCIAL"], preferred_group_size: "LARGE", effective_date: "2026-07-20" }
              as: RecreationTherapist
            - call: "POST /recreation/programs"
              payload: { name: "Lakeside Picnic", domain: "SOCIAL", staffing_ratio_denominator: 4, max_group_size: 12, max_supervision_tier: "TIER_3" }
              as: ActivityDirector
              captures: { prog_id: $.data.id }
            - call: "POST /recreation/vehicles"
              payload: { label: "Van 3", ambulatory_seats: 8, wheelchair_stations: 2, turnaround_minutes: 30 }
              as: ActivityDirector
              captures: { veh_id: $.data.id }
            - call: "POST /recreation/outings"
              payload: { program_id: "${prog_id}", vehicle_id: "${veh_id}", destination: "Lakeside Park", departure_at: "2026-08-16T09:00:00Z", return_at: "2026-08-16T13:00:00Z", escort_count: 1 }
              as: ActivityDirector
              captures: { outing_id: $.data.id }
            - call: "POST /recreation/outings/${outing_id}/consents"
              payload: { resident_id: "${res_id}", responsible_party_name: "Gia Marchetti", responsible_party_relation: "ADULT_CHILD" }
              as: ActivityDirector
              captures: { consent_id: $.data.id }
            - call: "GET /recreation/vehicles/${veh_id}"
              as: ActivityDirector
              captures: { veh_ver: $.data.version }
            - call: "POST /recreation/outings/${outing_id}/transport-booking"
              payload: { expected_vehicle_version: "${veh_ver}" }
              as: ActivityDirector
          trigger:
            - call: "POST /recreation/outings/${outing_id}/logistics"
              payload: { action: "CANCEL", cancel_reason: "Storm warning" }
              as: ActivityDirector
          assert:
            - "Outing.${outing_id}.logistics_status == CANCELLED"
            - "Outing.${outing_id}.cancel_reason == \"Storm warning\""
            - "Vehicle.${veh_id}.reserved_ambulatory_seats == 0"
            - "Vehicle.${veh_id}.reserved_wheelchair_stations == 0"
            - "the conservation law holds with no drift: reserved_ambulatory_seats (0) equals the sum of ambulatory_seats_required over this vehicle's Outings whose logistics_status IN {TRANSPORT_BOOKED, READY, DEPARTED}, which is now the empty sum"
            - "OutingConsent.${consent_id}.status == REQUESTED, untouched by the logistics dimension"
      - name: plan_supersede_restores_resident_gate_conservation
        conserved_quantity: "the Resident gate posture: care_plan_review_due is true and enrollment_gate is THERAPIST_REVIEW exactly while the resident's one live ActivityPlan is UNDER_REVISION, and at most one ActivityPlan per resident is ever in {ACTIVE, UNDER_REVISION}"
        grounds:
          - state_machines.ActivityPlan.UNDER_REVISION_to_SUPERSEDED
          - state_machines.ActivityPlan.DRAFT_to_ACTIVE
          - entities.Resident.fields.care_plan_review_due
          - entities.Resident.fields.enrollment_gate
          - entities.ResidentAssessment.fields.superseded
        distinguishing_aspect: |
          A different conserved quantity in a different subsystem: not a physical seat count but a
          logical single-live-plan invariant plus the resident-level gate flags it implies.
          Activating a replacement plan supersedes the UNDER_REVISION predecessor, and that
          supersession must itself compensate the gate fields the REVISE leg raised. An
          implementation that only lowers the gate on REACTIVATE strands the resident permanently
          gated even though no plan is under revision any more.
        test_recipe:
          setup:
            - "one ADMITTED resident with assessment A1 effective 2026-07-20"
            - "plan P1 sourced from A1, taken DRAFT -> ACTIVE -> UNDER_REVISION with review_reason THERAPIST_REQUEST, so Resident.care_plan_review_due == true and Resident.enrollment_gate == THERAPIST_REVIEW"
            - "a newer assessment A2 effective 2026-08-02 is filed, which supersedes A1"
            - "plan P2 sourced from A2 is created in DRAFT with a freshly re-read expected_resident_version"
          setup_api_calls:
            - call: "POST /recreation/residents"
              payload: { full_name: "Verna Duplessis", room_number: "160A", admission_date: "2026-01-20" }
              as: ActivityDirector
              captures: { res_id: $.data.id }
            - call: "POST /recreation/residents/${res_id}/assessments"
              payload: { cognitive_level: "MILD_IMPAIRMENT", functional_mobility: "ASSIST_1", interest_domains: ["SOCIAL", "SPIRITUAL"], preferred_group_size: "SMALL", effective_date: "2026-07-20" }
              as: RecreationTherapist
              captures: { asmt1_id: $.data.id }
            - call: "GET /recreation/residents/${res_id}"
              as: RecreationTherapist
              captures: { res_ver1: $.data.version }
            - call: "POST /recreation/activity-plans"
              payload: { resident_id: "${res_id}", source_assessment_id: "${asmt1_id}", cycle_start_at: "2026-08-01T00:00:00Z", domain_frequency_targets: { SOCIAL: 2, COGNITIVE: 0, PHYSICAL: 0, SPIRITUAL: 1, CREATIVE: 0 }, expected_resident_version: "${res_ver1}" }
              as: RecreationTherapist
              captures: { plan1_id: $.data.id }
            - call: "POST /recreation/activity-plans/${plan1_id}/transition"
              payload: { action: "ACTIVATE" }
              as: RecreationTherapist
            - call: "POST /recreation/activity-plans/${plan1_id}/transition"
              payload: { action: "REVISE", review_reason: "THERAPIST_REQUEST" }
              as: RecreationTherapist
            - call: "POST /recreation/residents/${res_id}/assessments"
              payload: { cognitive_level: "MODERATE_IMPAIRMENT", functional_mobility: "ASSIST_2", interest_domains: ["SPIRITUAL"], preferred_group_size: "ONE_TO_ONE", effective_date: "2026-08-02" }
              as: RecreationTherapist
              captures: { asmt2_id: $.data.id }
            - call: "GET /recreation/residents/${res_id}"
              as: RecreationTherapist
              captures: { res_ver2: $.data.version }
            - call: "POST /recreation/activity-plans"
              payload: { resident_id: "${res_id}", source_assessment_id: "${asmt2_id}", cycle_start_at: "2026-08-01T00:00:00Z", domain_frequency_targets: { SOCIAL: 0, COGNITIVE: 0, PHYSICAL: 0, SPIRITUAL: 3, CREATIVE: 0 }, expected_resident_version: "${res_ver2}" }
              as: RecreationTherapist
              captures: { plan2_id: $.data.id }
          trigger:
            - call: "POST /recreation/activity-plans/${plan2_id}/transition"
              payload: { action: "ACTIVATE" }
              as: RecreationTherapist
          assert:
            - "ActivityPlan.${plan2_id}.status == ACTIVE"
            - "ActivityPlan.${plan1_id}.status == SUPERSEDED"
            - "ActivityPlan.${plan1_id}.revision_count == 0, because P1 was superseded out of UNDER_REVISION and never reactivated"
            - "Resident.${res_id}.care_plan_review_due == false"
            - "Resident.${res_id}.enrollment_gate == NONE"
            - "exactly one ActivityPlan of ${res_id} has status IN {ACTIVE, UNDER_REVISION}, namely ${plan2_id}, so the single-live-plan invariant is restored with no drift"
            - "ResidentAssessment.${asmt1_id}.superseded == true"
            - "ResidentAssessment.${asmt2_id}.superseded == false"
