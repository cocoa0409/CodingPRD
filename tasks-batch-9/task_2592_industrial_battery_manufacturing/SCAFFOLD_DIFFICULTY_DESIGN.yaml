            - "the refused RECEIVE left every figure untouched: BatteryUnit.${unit_a_id}.received_lead_kg was null until the accepted call"

      - name: invariant_c1_core_deposit_liability_closes_by_refund_or_by_forfeit
        grounds:
          - state_machines.BatteryUnit.core_status.RECEIVED_to_RECYCLED
          - state_machines.BatteryUnit.core_status.IN_TRANSIT_to_REJECTED
          - calculations.plant_lead_mass_balance.constants.CORE_DEPOSIT_CENTS
          - endpoints[GET /plants/{id}/lead-mass-balance]
        distinguishing_aspect: |
          A third conserved quantity, in whole CENTS rather than grams or kilograms: the
          core-deposit liability the plant owes its customers. Every LEAD_ACID shipment
          opens exactly 12500 cents of liability and every terminal core disposition
          closes exactly 12500 - but by two economically opposite routes. RECYCLE closes
          it by ISSUING a credit (money leaves the plant), REJECT closes it by FORFEIT
          (no credit is ever issued), so liability alone returns to 0 while the issued
          credits do NOT: the pair proves the liability account is conserved
          independently of the cash account.
