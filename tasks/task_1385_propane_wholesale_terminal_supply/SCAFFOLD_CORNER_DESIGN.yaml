            - call: "POST /allocation-runs"
              payload: { terminal_id: "${term}", expected_terminal_version: "${t_v}" }
              as: SupplyPlanner
              captures: { run: $.data.id }
          trigger:
            - call: "POST /allocation-runs/${run}/compute"
              payload: {}
              as: SupplyPlanner
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_TERMINAL_NOT_CURTAILED (http 409); run stays OPEN"
      - name: schedule_outside_contract_window_rejected
