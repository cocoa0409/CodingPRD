        claim_type: computed_read
        grounds: [endpoints: "GET /turnarounds/{id}/cost-summary"]
        distinguishing_aspect: "Computed read exposing both forecast variants, posture and contingency remaining."
        excluded_because:
          difficulty_instance: eac_provisional_diverges_from_committed_on_turnaround_cost
          rationale: "All six cost-summary fields are captured and asserted with literal values in that §1.8 instance."

