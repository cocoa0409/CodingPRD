              as: ModelOwner
              as_user_id: u_own_a
              captures: { doc_id: $.data.id }
            - call: "POST /mrm/models/${m_id}/documentations/${doc_id}/decide"
              payload: { decision: "APPROVE" }
              as: ModelRiskOfficer
              as_user_id: u_cro
            - call: "POST /mrm/models/${m_id}/validation-engagements"
              payload: { scope_conceptual_soundness: true, scope_outcomes_analysis: true, period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-01T06:00:00Z" }
              as: ModelValidator
              as_user_id: u_val
              captures: { eng_id: $.data.id }
            - call: "POST /mrm/validation-engagements/${eng_id}/complete"
              payload: { outcome: "EFFECTIVE", assessed_complexity: "LOW" }
              as: ModelValidator
              as_user_id: u_val
            - call: "POST /mrm/models/${m_id}/findings"
              payload: { severity: "CRITICAL", title: "blocker" }
              as: ModelRiskOfficer
              as_user_id: u_cro
          trigger:
            - call: "POST /mrm/models/${m_id}/approve"
              payload: {}
              as: ModelRiskOfficer
              as_user_id: u_cro
              captures: { err: $.data.error_id }
          assert:
            - "captured ${err} == ERR_OPEN_CRITICAL_FINDINGS"
            - "Model.${m_id}.status == REGISTERED (unchanged)"

      - name: approve_blocked_by_validation_overdue
        claim_type: violation_to_error
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_VALIDATION_OVERDUE]"
        distinguishing_aspect: "Approval is blocked when logical-clock now > validation_due_at: a non-vendor model registered at 2026-08-01 (TIER_3, due 2028-08-01) approved at 2028-08-02 fails ERR_VALIDATION_OVERDUE."
        test_recipe:
