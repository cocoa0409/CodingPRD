            - { call: "POST /screening-sessions/${scr_v15}/submit", payload: {}, as: Patient, as_user_id: "${pat_v15}" }
            - { call: "POST /patients/${pat_v15}/device-orders", payload: { model: "NEO", dome_size: "M", tip_type: "OPEN", list_price_cents: 200000, discount_cents: 0, accessory_subtotal_cents: 0, shipping_cents: 1495 }, as: Patient, as_user_id: "${pat_v15}", captures: { ord_v15: "$.data.id" } }
            - { call: "POST /_payments/simulate", payload: { device_order_id: "${ord_v15}", outcome: "AUTHORIZED" }, as: PlatformAdmin }
