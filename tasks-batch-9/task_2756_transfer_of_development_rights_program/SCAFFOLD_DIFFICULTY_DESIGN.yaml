        distinguishing_aspect: |
          A true cycle on SeveranceApplication: SUBMITTED -> UNDER_REVIEW ->
          REVISION_REQUESTED -> SUBMITTED, re-entered twice, with a counter
          (revision_round, MAX_REVISION_ROUNDS 2) as the only termination condition.
