  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_batch_add_stale_version_rejected_then_current_succeeds
        claim_type: violation_to_error
        grounds: ["concurrency_rules[batch-add-encounter-occ]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After one successful add advances the batch to version 2, a second add carrying the pre-add version is rejected with 412 ERR_STALE_VERSION; re-issuing it with the current version succeeds and advances the batch to version 3."
        test_recipe:
          setup: ["Program; cycle; member; provider; e1 and e2 both VALIDATED; DRAFT batch at version 1"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-OCC1", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency, captures: { cyc_id: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M1", aid_category: "TANF", enrolled_from: "2026-08-01" }, as: McoEncounterOps, captures: { m1: $.data.id } }
            - { call: "POST /programs/providers", payload: { program_id: "${prog_id}", npi: "1234567890", taxonomy_code: "207Q00000X" }, as: McoEncounterOps, captures: { prov_id: $.data.id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "E1", service_from_date: "2026-08-10", service_to_date: "2026-08-10", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 10000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, paid_amount_cents: 10000 }] }, as: McoEncounterOps, captures: { e1: $.data.id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "E2", service_from_date: "2026-08-11", service_to_date: "2026-08-11", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 4000, lines: [{ line_number: 1, procedure_code: "99212", units: 1, billed_amount_cents: 4000, paid_amount_cents: 4000 }] }, as: McoEncounterOps, captures: { e2: $.data.id } }
            - { call: "POST /programs/encounters/${e1}/validate", payload: {}, as: McoEncounterOps }
            - { call: "POST /programs/encounters/${e2}/validate", payload: {}, as: McoEncounterOps }
            - { call: "POST /programs/batches", payload: { cycle_id: "${cyc_id}" }, as: McoEncounterOps, captures: { b_id: $.data.id, b_v1: $.data.version } }
            - { call: "POST /programs/batches/${b_id}/encounters", payload: { encounter_id: "${e1}", expected_batch_version: "${b_v1}" }, as: McoEncounterOps, captures: { b_v2: $.data.version } }
          trigger:
            - { call: "POST /programs/batches/${b_id}/encounters", payload: { encounter_id: "${e2}", expected_batch_version: "${b_v2} - 1" }, as: McoEncounterOps, captures: { err: $.data.error_id } }
            - { call: "POST /programs/batches/${b_id}/encounters", payload: { encounter_id: "${e2}", expected_batch_version: "${b_v2}" }, as: McoEncounterOps, captures: { b_v3: $.data.version } }
          assert:
            - "stale add (expected ${b_v1}, batch already at 2) fails with ERR_STALE_VERSION and http 412"
            - "retry with the current version succeeds: batch version == 3 and encounter_count == 2"
            - "Encounter.${e2}.status == STAGED after the successful retry"

      - name: occ_extension_request_stale_cycle_version_rejected
        claim_type: violation_to_error
        grounds: ["concurrency_rules[extension-request-occ]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A second extension request carrying the cycle version observed before the first request is rejected with 412; the fresh request would otherwise legitimately supersede the PENDING one, so the OCC pin is the serialization point."
        test_recipe:
          setup: ["Program; August cycle at version 1; clock at default (window open)"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-OCC2", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency, captures: { cyc_id: $.data.id, c_v1: $.data.version } }
            - { call: "POST /programs/cycles/${cyc_id}/request-extension", payload: { requested_new_deadline_at: "2026-09-29T00:00:00Z", reason: "first", expected_cycle_version: "${c_v1}" }, as: McoCompliance, captures: { c_v2: $.data.version } }
          trigger:
            - { call: "POST /programs/cycles/${cyc_id}/request-extension", payload: { requested_new_deadline_at: "2026-10-05T00:00:00Z", reason: "stale writer", expected_cycle_version: "${c_v2} - 1" }, as: McoCompliance, captures: { err: $.data.error_id } }
            - { call: "POST /programs/cycles/${cyc_id}/request-extension", payload: { requested_new_deadline_at: "2026-10-05T00:00:00Z", reason: "fresh writer supersedes pending", expected_cycle_version: "${c_v2}" }, as: McoCompliance, captures: { cyc_after: $.data.requested_new_deadline_at } }
          assert:
            - "stale request fails with ERR_STALE_VERSION (http 412)"
            - "fresh request succeeds and supersedes the pending one: requested_new_deadline_at == 2026-10-05T00:00:00Z, extension_status == PENDING"

      - name: cascading_side_effects_layer_covered
        claim_type: violation_to_error
        grounds: [complexity_profile]
        excluded_because: { difficulty_instance: "transitive_cascade / audit_fail_penalty_posture_transmit_block", rationale: "N-level cascade verified end-to-end by the §1.8 cascade instances." }
      - name: dual_variant_calculation_layer_covered
        claim_type: violation_to_error
        grounds: [complexity_profile]
        excluded_because: { difficulty_instance: "dual_variant_calc / capitation_provisional_vs_final_divergence", rationale: "Both variants exercised with pinned divergence." }
      - name: rate_threshold_layer_covered
        claim_type: violation_to_error
        grounds: [complexity_profile]
        excluded_because: { difficulty_instance: "boundary_precision_check / audit_accuracy_exactly_at_threshold_passes", rationale: "Threshold boundary semantics (>=) pinned at the audit accuracy gate; provider tier thresholds exercised by the scorecard gating instance." }

