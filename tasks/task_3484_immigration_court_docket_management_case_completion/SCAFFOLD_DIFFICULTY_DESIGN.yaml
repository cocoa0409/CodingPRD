              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { judge_id: $.data.id }
            - call: "POST /eoir/cases"
              payload: { court_id: "${court_id}", case_number: "B-A", respondent_full_name: "R Alpha", custody_status: "NON_DETAINED", primary_language_code: "eng", representation_status: "PRO_SE", interpreter_required: false }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case_a: $.data.id }
            - call: "POST /eoir/cases/${case_a}/assign-judge"
              payload: { judge_id: "${judge_id}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { a_v2: $.data.version }
            - call: "POST /eoir/hearings"
              payload: { case_id: "${case_a}", hearing_type: "MASTER_CALENDAR", scheduled_start: "2026-09-03T10:00:00Z", expected_case_version: "${a_v2}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { h_a: $.data.id }
            - call: "POST /eoir/cases"
              payload: { court_id: "${court_id}", case_number: "B-B", respondent_full_name: "R Beta", custody_status: "NON_DETAINED", primary_language_code: "eng", representation_status: "PRO_SE", interpreter_required: false }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case_b: $.data.id }
            - call: "POST /eoir/cases/${case_b}/assign-judge"
              payload: { judge_id: "${judge_id}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { b_v2: $.data.version }
            - call: "POST /eoir/hearings"
              payload: { case_id: "${case_b}", hearing_type: "MASTER_CALENDAR", scheduled_start: "2026-09-03T11:00:00Z", expected_case_version: "${b_v2}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { h_b: $.data.id }
            - call: "POST /eoir/continuance-requests"
              payload: { case_id: "${case_b}", hearing_id: "${h_b}", reason_code: "EVIDENCE_GATHERING" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { cont_b: $.data.id }
            - call: "POST /eoir/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T10:30:00Z" }
              as: CourtAdministrator
