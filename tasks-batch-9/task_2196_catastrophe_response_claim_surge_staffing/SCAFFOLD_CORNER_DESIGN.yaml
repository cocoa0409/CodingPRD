  - section: cross_cutting_complexity_layers
    instances:
      - name: corner_ccl_occ_loss_estimate_current_event_version_accepted
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.loss-estimate-stale-event
          - endpoints.POST /loss-estimates
          - calculations.event_loss_estimate
          - entities.CatastropheEvent.fields.version
        distinguishing_aspect: "With expected_event_version equal to the event's current version the snapshot is created and the event's version advances from 2 to 3 in the same request, proving the OCC field is compared and then bumped rather than ignored."
        test_recipe:
          setup: ["One DECLARED CatastropheEvent (exposure_count 1000, avg_insured_value 250000, expected_severity_index 0.1000, HURRICANE) at version 2 with no claims and no reserve entries."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00.000Z" }
              as: CatastropheManager
              as_user_id: "mgr-01"
            - call: "POST /catastrophe-events"
              payload: { cat_code: "CAT-2026-125", peril_type: "HURRICANE", jurisdiction_state: "FL", event_start_utc: "2026-09-01T00:00:00.000Z", exposure_count: 1000, avg_insured_value: 250000, expected_severity_index: 0.1000 }
              as: CatastropheManager
              as_user_id: "mgr-01"
              captures: { ev: $.data.id }
