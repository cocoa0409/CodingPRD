            - "Base kit; 2026-08-04 record FINAL (nav 10.0000); distribution of retained 51.00 paid in cash on 2026-08-10 (income_per_share 0.0051)"
            - "2026-08-11 record FINAL (price 101.00 -> nav 10.1000)"
