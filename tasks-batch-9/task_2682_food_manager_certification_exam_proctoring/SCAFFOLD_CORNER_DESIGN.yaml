        distinguishing_aspect: |
          The role model is segregation_of_duties, NOT hierarchical_override: PlatformAdmin is the most
          powerful role and still cannot book a sitting, register a candidate or report an incident, because
          those endpoints simply do not list it. Every denial is 403 ERR_UNAUTHORIZED decided at §1.4 priority
          2 — before any id in the path or body is resolved — which is why the bogus UUIDs below still produce
          403 and never 404. The closing calls confirm the shared_operations that DO cross roles.
