          - errors[ERR_INVALID_PANEL]
        distinguishing_aspect: |
          Pair (business_safety vs business_constraint): On POST /interviews, the panel both
          contains the candidate's referrer_user_id AND is oversized (6 panelists, exceeding the
          1..5 cap). Priority 8 (ERR_PANELIST_CONFLICT, business_safety) MUST win over priority
          12 (ERR_INVALID_PANEL, business_constraint).
        test_recipe:
          setup:
            - "Candidate C with source_channel=REFERRAL, referrer_user_id=emp_ref_z"
            - "Application A on approved Requisition; ready to schedule interview"
            - "Submitted panel_user_ids of size 6 including emp_ref_z (both violations active)"
          setup_api_calls:
            - call: "POST /ats/departments"
              payload: { name: "PanelDept", cost_center_code: "PNL-001", hiring_budget_cents: 100000000 }
              as: PlatformAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /ats/requisitions"
              payload: { department_id: "${dept_id}", title: "PanelRole", target_level: "MID", base_salary_min_cents: 10000000, base_salary_max_cents: 15000000, openings: 1 }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { req_id: $.data.id }
            - call: "POST /ats/requisitions/${req_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/requisitions/${req_id}/approve"
              payload: {}
              as: HiringManager
              as_user_id: "hm_bob"
            - call: "POST /ats/candidates"
              payload: { full_name: "Panel Cand", email: "pcand@example.com", source_channel: "REFERRAL", referrer_user_id: "emp_ref_z", eeo_ethnicity: "WHITE", eeo_gender: "FEMALE", eeo_veteran: false, eeo_disability: false }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { cand_id: $.data.id }
            - call: "POST /ats/applications"
              payload: { candidate_id: "${cand_id}", requisition_id: "${req_id}" }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { app_id: $.data.id }
            - call: "POST /ats/applications/${app_id}/screen"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
          trigger:
            - call: "POST /ats/interviews"
              payload: { application_id: "${app_id}", round_number: 1, scheduled_at: "2026-08-01T10:00:00Z", duration_minutes: 60, panel_user_ids: ["emp_p1", "emp_p2", "emp_p3", "emp_p4", "emp_p5", "emp_ref_z"] }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { err_id: $.data.error_id }
          assert:
