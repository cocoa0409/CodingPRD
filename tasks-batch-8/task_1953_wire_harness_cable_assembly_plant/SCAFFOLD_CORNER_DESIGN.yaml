  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: c_build_order_patch_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[build-order-patch-stale-version]
          - "errors[ERR_STALE_BUILD_ORDER_VERSION]"
        distinguishing_aspect: "OCC on BuildOrder.version: a patch carrying the version observed before a successful patch is stale and rejected 412 ERR_STALE_BUILD_ORDER_VERSION; the successful patch incremented version 1 -> 2."
        test_recipe:
          setup: ["Released drawing; build order qty 1 OPEN (version 1)"]
          setup_api_calls:
            - { call: "POST /plant/drawings", payload: { drawing_number: "DWG-L1", customer_code: "ACME", revision: "A", workmanship_class: "IPC_CLASS_2" }, as: HarnessEngineer, captures: { dr: $.data.id } }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr}", find_number: "T1", component_type: "TERMINAL", mpn: "TERM-20", qty_per_harness: 1, supply_type: "FACTORY_STOCK", unit_cost_cents: 100 }, as: HarnessEngineer }
            - { call: "POST /plant/drawings/${dr}/release", payload: {}, as: HarnessEngineer }
            - { call: "POST /plant/build-orders", payload: { order_code: "BO-L1", drawing_id: "${dr}", qty_ordered: 1 }, as: ProductionPlanner, captures: { bo: $.data.id, bo_v: $.data.version } }
          trigger:
            - { call: "PATCH /plant/build-orders/${bo}", payload: { expected_build_order_version: "${bo_v}", qty_ordered: 5 }, as: ProductionPlanner, captures: { v2: $.data.version } }
            - { call: "PATCH /plant/build-orders/${bo}", payload: { expected_build_order_version: "${bo_v}", qty_ordered: 6 }, as: ProductionPlanner, captures: { err: $.data.error_id } }
          assert:
            - "captured v2 == 2   # first patch succeeded and incremented version"
            - "captured err == ERR_STALE_BUILD_ORDER_VERSION (HTTP 412)   # stale expected version rejected"
            - "BuildOrder.${bo}.qty_ordered == 5   # losing patch did not apply"

      - name: c_program_patch_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[machine-program-patch-stale-version]
          - "errors[ERR_STALE_PROGRAM_VERSION]"
        distinguishing_aspect: "OCC on MachineProgram.version (a second, distinct parent entity): stale expected_machine_program_version on the DRAFT patch is rejected 412 ERR_STALE_PROGRAM_VERSION."
        test_recipe:
          setup: ["Released drawing; applicator; DRAFT program (version 1)"]
          setup_api_calls:
            - { call: "POST /plant/drawings", payload: { drawing_number: "DWG-L2", customer_code: "ACME", revision: "A", workmanship_class: "IPC_CLASS_2" }, as: HarnessEngineer, captures: { dr: $.data.id } }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr}", find_number: "T1", component_type: "TERMINAL", mpn: "TERM-20", qty_per_harness: 1, supply_type: "FACTORY_STOCK", unit_cost_cents: 100 }, as: HarnessEngineer }
            - { call: "POST /plant/drawings/${dr}/release", payload: {}, as: HarnessEngineer }
            - { call: "POST /plant/applicators", payload: { applicator_code: "AP-L2", compatible_terminal_mpn: "TERM-20" }, as: ProcessEngineer, captures: { ap: $.data.id } }
            - { call: "POST /plant/machine-programs", payload: { program_code: "PG-L2", drawing_id: "${dr}", applicator_id: "${ap}", wire_gauge_awg: 20, wire_type: "TXL", cut_length_mm: 500.0, strip_length_mm: 5.0, terminal_mpn: "TERM-20", terminal_type: "OPEN_BARREL" }, as: ProcessEngineer, captures: { pr: $.data.id, pr_v: $.data.version } }
          trigger:
            - { call: "PATCH /plant/machine-programs/${pr}", payload: { expected_machine_program_version: "${pr_v}", cut_length_mm: 600.0 }, as: ProcessEngineer, captures: { v2: $.data.version } }
            - { call: "PATCH /plant/machine-programs/${pr}", payload: { expected_machine_program_version: "${pr_v}", strip_length_mm: 6.0 }, as: ProcessEngineer, captures: { err: $.data.error_id } }
          assert:
            - "captured v2 == 2"
            - "captured err == ERR_STALE_PROGRAM_VERSION (HTTP 412)"
            - "MachineProgram.${pr}.strip_length_mm == 5.0   # losing patch did not apply"

