# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests) — task_3029
#
# Breadth probe over every testable §1.1–§1.7 claim the nine §1.8 difficulty
# rules do not already exercise. Corners §1.8 already covers appear as
# `excluded_because:` stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: protection_state_boundary_on_the_guard
        claim_type: computed_fields
        grounds:
          - calculations.autoship_price_protection
          - entities.AutoshipItem.fields.protection_state
        excluded_because:
          difficulty_instance: protection_guard_boundary_is_inclusive_at_the_rounded_guard
          rationale: "The inclusive rounded-guard boundary is asserted as the core of that §1.8 instance, including the 1691 equality case."

      - name: pet_creation_carries_the_system_fields_and_starts_alive
        claim_type: Creation
        grounds:
          - entities.Pet
          - entities.Pet.fields.pet_lifecycle_state
          - endpoints.POST_/v1/pets
        distinguishing_aspect: "A pet posted with exactly the five declared input fields comes back 201 with system-minted identity and timestamps, pet_status ACTIVE and pet_lifecycle_state ALIVE, and no client-supplied status can override those."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/pets"
              payload: { pet_name: "Biscuit", species: "DOG", breed: "Corgi", weight_kg: 12.5, owner_state: "CA" }
              as: Customer
              captures: { pet_e1: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Pet.${pet_e1}.pet_name == \"Biscuit\" and species == DOG and breed == \"Corgi\" and weight_kg == 12.5 and owner_state == \"CA\""
            - "Pet.${pet_e1}.pet_status == ACTIVE and pet_lifecycle_state == ALIVE"
            - "the response data carries a non-null id, created_at and updated_at"
            - "meta.api_request_id and meta.api_request_timestamp are present per the response envelope"

      - name: pet_weight_update_recalibrates_dosage_and_cadence
        claim_type: Computed Fields
        grounds:
          - endpoints.POST_/v1/pets/{id}/weights
          - calculations.dosage_mg_per_day
          - calculations.run_cadence_days
        distinguishing_aspect: "Recording a new weight recomputes two different projections: the rounded mg/day figure moves from 0.98 to 2.94 while the item's equivalent-duration reading moves from 84 to 30, and the client-supplied weight alone changes neither."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One dog weighing 14.0 kg with a plan carrying a single 28-day item."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/products"
              payload: { sku: "ENT-01", product_name: "Weight calibration chew", medication_scope: "OTC", cold_pack_required: false, unit_dose_mg_per_kg: 0.070, pack_size_units: 30, unit_price_cents: 1400 }
              as: PlatformAdmin
              captures: { prod_e2: $.data.id }
            - call: "POST /v1/pets"
              payload: { pet_name: "Nutmeg", species: "DOG", breed: "Vizsla", weight_kg: 14.0, owner_state: "CA" }
              as: Customer
              captures: { pet_e2: $.data.id }
            - call: "POST /v1/autoship-plans"
              payload: { pet_id: "${pet_e2}" }
              as: Customer
              as_user_id: "${pet_e2}"
              captures: { plan_e2: $.data.id }
            - call: "POST /v1/autoship-plans/${plan_e2}/items"
              payload: { product_id: "${prod_e2}", cadence_days: 28, default_quantity: 1 }
              as: Customer
              as_user_id: "${pet_e2}"
              captures: { item_e2: $.data.id }
          trigger:
            - call: "POST /v1/pets/${pet_e2}/weights"
              payload: { weight_kg: 42.0 }
              as: Customer
              as_user_id: "${pet_e2}"
              captures: { new_weight: $.data.weight_kg }
            - call: "GET /v1/autoship-plans/${plan_e2}/items/${item_e2}"
              payload: {}
              as: Customer
              captures: { equiv_after: $.data.unit_lifecycle_equivalent_days }
          assert:
            - "the recorded weight is echoed back: Pet.${pet_e2}.weight_kg == ${new_weight} == 42.0"
            - "the dosage projection moves to round_half_up(0.070 * 42.0 * 1.2, 2) == 3.53 while it read round_half_up(0.070 * 14.0 * 1.2, 2) == 1.18 before"
            - "the item's equivalent duration is recomputed rather than cached: AutoshipItem.${item_e2}.unit_lifecycle_equivalent_days == ${equiv_after} == 30"
            - "the record is deterministic: the body carries no dosage field, so the same weight posted twice leaves both projections unchanged"

      - name: pet_read_with_an_unknown_id_returns_resource_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/v1/pets/{id}
          - validations[priority=3]
          - errors.ERR_RESOURCE_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated UUID on a path segment yields the existence error at priority 3 with status 404, and it is raised before any state rule could fire."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. No pet has been created."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /v1/pets/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Customer
              captures: { err_e3: $.data.error_id }
          assert:
            - "the response status is 404 and response_type is error"
            - "error_id == ${err_e3} == \"ERR_RESOURCE_NOT_FOUND\""
            - "the message names no pet record, so the lookup happened before any state or business rule"
            - "an equivalent unknown UUID under /v1/autoship-plans returns the same error_id with status 404"

      - name: product_price_change_leaves_the_autoship_item_price_mirrored
        claim_type: Computed Fields
        grounds:
          - endpoints.POST_/v1/products/{id}/price
          - entities.AutoshipItem.fields.unit_price_cents
          - entities.Product.fields.unit_price_cents
        distinguishing_aspect: "The item's unit price is a computed mirror of the catalog price, so changing the catalog price propagates to the item without a plan request, while a protection price already locked on a first order stays untouched."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One plan carrying an item on a 1200-cent product, already composed once so a protection price is locked."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/products"
              payload: { sku: "ENT-04", product_name: "Mirror price pack", medication_scope: "OTC", cold_pack_required: false, unit_dose_mg_per_kg: 0.02, pack_size_units: 10, unit_price_cents: 1200 }
              as: PlatformAdmin
              captures: { prod_e4: $.data.id }
            - call: "POST /v1/pets"
              payload: { pet_name: "Plum", species: "CAT", breed: "Chartreux", weight_kg: 4.0, owner_state: "CA" }
              as: Customer
              captures: { pet_e4: $.data.id }
            - call: "POST /v1/autoship-plans"
              payload: { pet_id: "${pet_e4}" }
              as: Customer
              as_user_id: "${pet_e4}"
              captures: { plan_e4: $.data.id }
            - call: "POST /v1/autoship-plans/${plan_e4}/items"
              payload: { product_id: "${prod_e4}", cadence_days: 28, default_quantity: 1 }
              as: Customer
              as_user_id: "${pet_e4}"
              captures: { item_e4: $.data.id }
            - call: "GET /v1/autoship-plans/${plan_e4}"
              payload: {}
              as: Customer
              as_user_id: "${pet_e4}"
              captures: { plan_e4_v: $.data.version }
            - call: "POST /v1/autoship-plans/${plan_e4}/compose"
              payload: { expected_plan_version: "${plan_e4_v}" }
              as: Customer
              as_user_id: "${pet_e4}"
              captures: { order_e4: $.data.id }
          trigger:
            - call: "POST /v1/products/${prod_e4}/price"
              payload: { unit_price_cents: 1350 }
              as: ComplianceOfficer
              captures: { prod_e4_price: $.data.unit_price_cents }
            - call: "GET /v1/autoship-plans/${plan_e4}/items/${item_e4}"
              payload: {}
              as: Customer
              captures: { item_e4_price: $.data.unit_price_cents, item_e4_protected: $.data.price_protected_unit_price_cents }
          assert:
            - "the catalog price moved: Product.${prod_e4}.unit_price_cents == ${prod_e4_price} == 1350"
            - "the item mirrors the new catalog price without a plan request: AutoshipItem.${item_e4}.unit_price_cents == ${item_e4_price} == 1350"
            - "the locked protection price is not rewritten: AutoshipItem.${item_e4}.price_protected_unit_price_cents == ${item_e4_protected} == 1200"
            - "the computed mirror is idempotent: reposting 1350 as the catalog price leaves both item fields at their current values"

      - name: autoship_plan_filters_children_by_pet
        claim_type: Listing
        grounds:
          - endpoints.GET_/v1/autoship-plans
          - entities.AutoshipPlan.fields.pet_id
          - response_envelope.pagination_defaults
        distinguishing_aspect: "The plan list is the filtered-list surface for the Pet foreign key: filtering by pet_id returns only that pet's plans while the unfiltered list paginates across every pet, with total_count reporting the filtered set."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Two pets, one carrying two plans and the other one plan."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/pets"
              payload: { pet_name: "Clover", species: "DOG", breed: "Mutt", weight_kg: 10.0, owner_state: "CA" }
              as: Customer
              captures: { pet_e5: $.data.id }
            - call: "POST /v1/pets"
              payload: { pet_name: "Basil", species: "CAT", breed: "Moggy", weight_kg: 4.5, owner_state: "NV" }
              as: Customer
              captures: { pet_e5b: $.data.id }
            - call: "POST /v1/autoship-plans"
              payload: { pet_id: "${pet_e5}" }
              as: Customer
              as_user_id: "${pet_e5}"
              captures: { plan_e5a: $.data.id }
            - call: "POST /v1/autoship-plans"
              payload: { pet_id: "${pet_e5}" }
              as: Customer
              as_user_id: "${pet_e5}"
              captures: { plan_e5b: $.data.id }
            - call: "POST /v1/autoship-plans"
              payload: { pet_id: "${pet_e5b}" }
              as: Customer
              as_user_id: "${pet_e5b}"
              captures: { plan_e5c: $.data.id }
          trigger:
            - call: "GET /v1/autoship-plans"
              payload: { pet_id: "${pet_e5}", limit: 1, offset: 0 }
              as: Customer
              as_user_id: "${pet_e5}"
          assert:
            - "the unfiltered call returns all 3 rows as an array with response_type array and total_count == 3"
            - "GET /v1/autoship-plans?pet_id=${pet_e5}&limit=1&offset=1 returns the remaining row with total_count == 2 and has_more == false"
            - "per-line rounding is exercised on a populated basket: an accepted compose returns a strictly positive autoship_discount_cents"
            - "GET /v1/autoship-plans?pet_id=${pet_e5b} returns exactly 1 row, the other pet's plan"
            - "GET /v1/autoship-plans with no query parameters returns all 3 rows with limit defaulting to 10 and offset to 0"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: verification_failure_cascade_through_item_and_plan
        claim_type: side_effect_execution
        grounds:
          - state_machines.Prescription.VERIFICATION_IN_PROGRESS_to_VERIFICATION_FAILED
          - state_machines.AutoshipPlan.ACTIVE_to_SUSPENDED
        excluded_because:
          difficulty_instance: third_callback_failure_suspends_the_plan_and_revokes_discounts
          rationale: "All four hops of that cascade, including the blocked item and the revoked discount eligibility, are asserted there."
      - name: pet_passing_parks_shipment_order_and_plan
        claim_type: side_effect_execution
        grounds:
          - state_machines.Pet.ACTIVE_to_PASSED
          - state_machines.Shipment.DISPATCHED_to_AWAITING_PET_PASSING_DECISION
        excluded_because:
          difficulty_instance: pet_passing_parks_the_shipment_order_and_plan_in_turn
          rationale: "The three-hop passing cascade is asserted hop by hop in that §1.8 instance."

      - name: paise_a_plan_that_is_already_paused_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.AutoshipPlan.PAUSED_to_ACTIVE
          - errors.ERR_INVALID_STATE
          - validations[priority=4]
        distinguishing_aspect: "From the PAUSED state the pause trigger is not a listed transition, so a second pause is refused at priority 4 with ERR_INVALID_STATE and no side effect fires."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An ACTIVE plan that has already been paused once."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/pets"
              payload: { pet_name: "Sable", species: "CAT", breed: "Korat", weight_kg: 4.0, owner_state: "CA" }
              as: Customer
              captures: { pet_s1: $.data.id }
            - call: "POST /v1/autoship-plans"
              payload: { pet_id: "${pet_s1}" }
              as: Customer
              as_user_id: "${pet_s1}"
              captures: { plan_s1: $.data.id }
            - call: "POST /v1/autoship-plans/${plan_s1}/pause"
              payload: {}
              as: Customer
              as_user_id: "${pet_s1}"
          trigger:
            - call: "POST /v1/autoship-plans/${plan_s1}/pause"
              payload: {}
              as: Customer
              as_user_id: "${pet_s1}"
              captures: { err_s1: $.data.error_id }
          assert:
            - "the second pause is refused with error_id == ${err_s1} == \"ERR_INVALID_STATE\" and http status 409"
            - "AutoshipPlan.${plan_s1}.plan_status is still PAUSED rather than reverting to ACTIVE"
            - "the refusal is the pause-from-PAUSED edge alone: state_machines.AutoshipPlan.PAUSED_to_ACTIVE is the only transition out of PAUSED that §1.2 lists"

      - name: terminal_plan_cannot_be_resumed
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.AutoshipPlan.terminal_states
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "CANCELED is a declared terminal state, so no §1.2 transition has it as a from value and the resume trigger is refused there even though the same trigger works from PAUSED and SUSPENDED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A plan canceled while it held a single 28-day item."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/products"
              payload: { sku: "STM-02", product_name: "Terminal test pack", medication_scope: "OTC", cold_pack_required: false, unit_dose_mg_per_kg: 0.02, pack_size_units: 10, unit_price_cents: 900 }
              as: PlatformAdmin
              captures: { prod_s2: $.data.id }
            - call: "POST /v1/pets"
              payload: { pet_name: "Lark", species: "DOG", breed: "Basenji", weight_kg: 9.0, owner_state: "CA" }
              as: Customer
              captures: { pet_s2: $.data.id }
            - call: "POST /v1/autoship-plans"
              payload: { pet_id: "${pet_s2}" }
              as: Customer
              as_user_id: "${pet_s2}"
              captures: { plan_s2: $.data.id }
            - call: "POST /v1/autoship-plans/${plan_s2}/items"
              payload: { product_id: "${prod_s2}", cadence_days: 28, default_quantity: 1 }
              as: Customer
              as_user_id: "${pet_s2}"
              captures: { item_s2: $.data.id }
            - call: "POST /v1/autoship-plans/${plan_s2}/cancel"
              payload: { cancellation_reason: "CUSTOMER_REQUEST" }
              as: Customer
              as_user_id: "${pet_s2}"
          trigger:
            - call: "POST /v1/autoship-plans/${plan_s2}/resume"
              payload: {}
              as: Customer
              as_user_id: "${pet_s2}"
              captures: { err_s2: $.data.error_id }
          assert:
            - "the resume is refused with error_id == ${err_s2} == \"ERR_INVALID_STATE\" and http status 409"
            - "AutoshipPlan.${plan_s2}.plan_status == CANCELED and remained so through the attempt"
            - "the plan's item is untouched by the refused trigger: AutoshipItem.${item_s2}.item_status == ACTIVE"
            - "autoship_item_count for the plan still counts the item, because cancellation of the plan did not cascade into item cancellation"

      - name: delivered_order_refuses_further_shipment_and_cancellation
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Order.terminal_states
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "DELIVERED is a declared terminal state for the Order and all three mutating triggers are refused there, so a completed delivery cannot be re-shipped, re-canceled or re-delivered."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One order shipped and delivered through a licensed CA site."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/pharmacy-sites"
              payload: { site_code: "SAN9", site_state: "CA", licensed_states: ["CA"], cold_pack_capacity_units: 90, csr_registered: true }
              as: ComplianceOfficer
              captures: { site_s3: $.data.id }
            - call: "POST /v1/products"
              payload: { sku: "STM-03", product_name: "Terminal order pack", medication_scope: "OTC", cold_pack_required: false, unit_dose_mg_per_kg: 0.02, pack_size_units: 10, unit_price_cents: 1000 }
              as: PlatformAdmin
              captures: { prod_s3: $.data.id }
            - call: "POST /v1/pets"
              payload: { pet_name: "Juniper", species: "DOG", breed: "Kelpie", weight_kg: 16.0, owner_state: "CA" }
              as: Customer
              captures: { pet_s3: $.data.id }
            - call: "POST /v1/autoship-plans"
              payload: { pet_id: "${pet_s3}" }
              as: Customer
              as_user_id: "${pet_s3}"
              captures: { plan_s3: $.data.id }
            - call: "POST /v1/autoship-plans/${plan_s3}/items"
              payload: { product_id: "${prod_s3}", cadence_days: 28, default_quantity: 1 }
              as: Customer
              as_user_id: "${pet_s3}"
              captures: { item_s3: $.data.id }
            - call: "GET /v1/autoship-plans/${plan_s3}"
              payload: {}
              as: Customer
              as_user_id: "${pet_s3}"
              captures: { plan_s3_v: $.data.version }
            - call: "POST /v1/autoship-plans/${plan_s3}/compose"
              payload: { expected_plan_version: "${plan_s3_v}" }
              as: Customer
              as_user_id: "${pet_s3}"
              captures: { order_s3: $.data.id }
            - call: "POST /v1/shipments"
              payload: { order_id: "${order_s3}" }
              as: PharmacyTechnician
              captures: { ship_s3: $.data.id }
            - call: "POST /v1/orders/${order_s3}/ship"
              payload: {}
              as: PharmacyTechnician
            - call: "POST /v1/orders/${order_s3}/deliver"
              payload: {}
              as: PharmacyTechnician
          trigger:
            - call: "POST /v1/orders/${order_s3}/cancel"
              payload: { cancellation_reason: "CUSTOMER_REQUEST" }
              as: PharmacyTechnician
              captures: { err_s3: $.data.error_id }
          assert:
            - "Order.${order_s3}.order_status == DELIVERED before the trigger"
            - "the cancel is refused with error_id == ${err_s3} == \"ERR_INVALID_STATE\" and http status 409"
            - "Order.${order_s3}.order_status is still DELIVERED and refunded_amount_cents is still 0"
            - "the terminal lock is exhaustive: POST /v1/orders/${order_s3}/ship and POST /v1/orders/${order_s3}/deliver are each refused with ERR_INVALID_STATE as well"
            - "Shipment.${ship_s3}.shipment_status == DELIVERED and it too is locked"

      - name: cancelling_the_same_order_twice_is_refused
        claim_type: Idempotency
        grounds:
          - state_machines.Order.PLACED_to_CANCELED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "The cancel trigger is not idempotent: replaying it against an already CANCELED order is refused rather than silently accepted, so the refund cannot be double-written."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One composed order already canceled."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/products"
              payload: { sku: "STM-04", product_name: "Idempotency pack", medication_scope: "OTC", cold_pack_required: false, unit_dose_mg_per_kg: 0.02, pack_size_units: 10, unit_price_cents: 1770 }
              as: PlatformAdmin
              captures: { prod_s4: $.data.id }
            - call: "POST /v1/pets"
              payload: { pet_name: "Rue", species: "CAT", breed: "Devon Rex", weight_kg: 3.5, owner_state: "CA" }
              as: Customer
              captures: { pet_s4: $.data.id }
            - call: "POST /v1/autoship-plans"
              payload: { pet_id: "${pet_s4}" }
              as: Customer
              as_user_id: "${pet_s4}"
              captures: { plan_s4: $.data.id }
            - call: "POST /v1/autoship-plans/${plan_s4}/items"
              payload: { product_id: "${prod_s4}", cadence_days: 28, default_quantity: 1 }
              as: Customer
              as_user_id: "${pet_s4}"
              captures: { item_s4: $.data.id }
            - call: "GET /v1/autoship-plans/${plan_s4}"
              payload: {}
              as: Customer
              as_user_id: "${pet_s4}"
              captures: { plan_s4_v: $.data.version }
            - call: "POST /v1/autoship-plans/${plan_s4}/compose"
              payload: { expected_plan_version: "${plan_s4_v}" }
              as: Customer
              as_user_id: "${pet_s4}"
              captures: { order_s4: $.data.id }
            - call: "POST /v1/orders/${order_s4}/cancel"
              payload: { cancellation_reason: "CUSTOMER_REQUEST" }
              as: PharmacyTechnician
          trigger:
            - call: "POST /v1/orders/${order_s4}/cancel"
              payload: { cancellation_reason: "NON_DELIVERY" }
              as: PharmacyTechnician
              captures: { err_s4: $.data.error_id }
          assert:
            - "the replay is refused with error_id == ${err_s4} == \"ERR_INVALID_STATE\" and http status 409"
            - "Order.${order_s4}.order_status is still CANCELED and the second reason did not overwrite the first"
            - "the refund was not double-written: Order.${order_s4}.refunded_amount_cents still equals its single-cancel value"
            - "no second Order row was created for the plan, so the refusal left no trace"

      - name: prescription_expires_when_the_clock_crosses_the_stamped_instant
