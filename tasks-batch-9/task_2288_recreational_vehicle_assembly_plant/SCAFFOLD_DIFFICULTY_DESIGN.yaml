  - rule_id: boundary_precision_check
    instances:

      - name: credit_utilization_boundary_9500_is_watch_and_9501_is_credit_hold
        grounds:
          - calculations.dealer_credit_utilization
          - entities.Dealer.fields.credit_utilization_bp
          - entities.Dealer.fields.credit_status
          - state_machines.UnitOrder.FUNDING_REQUESTED_to_FLOOR_PLAN_FUNDED
          - endpoints["POST /unit-orders/{id}/funding-decision"]
        distinguishing_aspect: |
          The metric under test is credit utilisation in basis points, floored
          rather than rounded, on the POST /unit-orders/{id}/funding-decision
          endpoint. Two dealers differ by 2000 cents of credit line and land on
          opposite sides of a strictly-greater-than threshold: 9500 bp is still
