            - call: "POST /interactives/${int1}/commission"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
              captures: { f7: $.data.error_id }
            - call: "POST /exhibit-projects/${proj}/punch-items"
              payload: { severity: "MINOR", description: "Too early to have defects.", case_id: "${case1}" }
              as: MuseumOperations
              as_user_id: ops-01
              captures: { f8: $.data.error_id }
            - call: "POST /exhibit-projects/${proj}/closeout"
              payload: { docent_kit_url: "https://docs.example.org/deep-time/docent-kit.pdf", maintenance_manual_url: "https://docs.example.org/deep-time/maintenance.pdf", parts_commitment_years: 10 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { f9: $.data.error_id }
            - call: "GET /exhibit-projects/${proj}"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
              captures: { ph2: $.data.phase, post2: $.data.posture }
          assert:
            - "${f1} == ERR_INVALID_PROJECT_PHASE with HTTP 409 - FABRICATION is three steps ahead of INTERPRETIVE"
            - "${f2} == ERR_INVALID_PROJECT_PHASE - advancing to the phase the project is already in is not a no-op success"
            - "${f3} == ERR_INVALID_PROJECT_PHASE - artifact-cases create requires SCHEMATIC or DESIGN_DEV, and the zone reference resolved fine"
            - "${ph1} == SCHEMATIC - the single legal successor is accepted with HTTP 200"
            - "${f4} == ERR_INVALID_PROJECT_PHASE - the chain never steps backwards on request; only the two documented system cascades may revert a phase"
            - "${f5} == ERR_INVALID_PROJECT_PHASE - repeating the successful advance is refused, so advance-phase is not idempotent"
            - "the same artifact-case body now succeeds with HTTP 201 and ${cst} == DRAFT - only the phase changed between ${f3} and this call"
            - "${f6} == ERR_INVALID_PROJECT_PHASE and NOT ERR_INVALID_CASE_STATE - shop drawings require FABRICATION, and priority 38 outranks the priority-48 objection that ${case1} is only DRAFT"
            - "${f7} == ERR_INVALID_PROJECT_PHASE and NOT ERR_INVALID_INTERACTIVE_STATE - commission requires COMMISSIONING, and priority 38 outranks the priority-52 objection that the interactive is only SPECIFIED"
            - "${f8} == ERR_INVALID_PROJECT_PHASE - punch items require COMMISSIONING"
            - "${f9} == ERR_INVALID_PROJECT_PHASE with HTTP 409 - closeout requires phase CLOSEOUT, and priority 38 precedes both the posture gate at 42 and the fiscal gate at 96, so the empty committed bucket is never even consulted"
            - "${ph2} == SCHEMATIC and ${post2} == OPEN - nine refused requests left the phase exactly where the one accepted advance put it, and the approved material spec leaves no pending review behind"

      - name: the_four_terminal_states_reached_at_settlement_accept_no_further_trigger
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.ExhibitProject.terminal_states
          - state_machines.InstallWindow.terminal_states
          - state_machines.Interactive.terminal_states
          - state_machines.PunchItem.terminal_states
          - validations.priority_38
          - validations.priority_52
          - validations.priority_53
          - validations.priority_54
        distinguishing_aspect: |
          Settlement leaves four rows in terminal states at once, and each one has to
          refuse its own triggers with its OWN error code rather than with a shared
          "project is closed" objection. Two orderings are pinned. A second closeout
          is ERR_INVALID_PROJECT_PHASE, not ERR_NOTHING_TO_SETTLE, even though
          committed_fabrication_cents is genuinely 0 after the first one - priority
          38 precedes priority 96. And re-starting the COMPLETED window is
          ERR_INVALID_WINDOW_STATE rather than a phase error, because window
          decisions are only phase-gated for create and decision, so the state
          machine is the thing that must say no.
        test_recipe:
          setup:
            - "project driven to COMMISSIONING, INT-STRATA commissioned, one MINOR punch item raised by ops-01 and verified by fab-01, then advanced to CLOSEOUT and settled"
