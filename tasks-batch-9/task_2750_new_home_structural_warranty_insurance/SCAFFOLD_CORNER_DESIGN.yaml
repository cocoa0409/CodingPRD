      - name: the_builder_arm_and_the_insurer_arm_diverge_then_rejoin_at_insurer_adjudication
        claim_type: "branching"
        grounds:
          - state_machines.Claim.transitions
          - complexity_profile.state_machine_shape
        distinguishing_aspect: "The Claim machine branches at obligation routing into a builder-obligation arm and an insurer-backed arm whose side effects are disjoint - only the insurer arm opens a reserve - and both arms can rejoin at INSURER_ADJUDICATION."
        excluded_because:
          difficulty_instance: "claim_fork_arms_carry_disjoint_side_effects_and_rejoin_at_insurer_adjudication"
          rationale: "That instance already drives two claims on the same policy down both arms from a single boundary-date difference, asserts the disjoint side effects on each, and then walks the builder arm back into INSURER_ADJUDICATION to prove the rejoin; a plain branching test would be its first half."

      - name: builder_underwriting_can_re_enter_the_under_review_and_approved_states
        claim_type: "cyclic"
        grounds:
          - state_machines.Builder.transitions
          - endpoints.POST_/warranty/builders/{id}/reassessment
          - endpoints.POST_/warranty/builders/{id}/reinstatement
        distinguishing_aspect: "The Builder machine is cyclic: a referral sends an APPROVED builder back to UNDER_REVIEW and a reinstatement brings a SUSPENDED builder back to APPROVED, so the same state is occupied more than once and the second visit must not replay first-visit defaults."
        excluded_because:
          difficulty_instance: "builder_referral_and_suspension_cycles_re_enter_prior_states"
          rationale: "The difficulty instance walks the whole cycle twice and pins what is preserved versus recomputed across re-entry - review row count, risk class and posture - which strictly contains the claim that the cycle is traversable."

      - name: a_payment_reversal_undoes_every_side_effect_of_the_payment
        claim_type: "Compensation"
        grounds:
          - state_machines.Claim.CLOSED_PAID_to_APPROVED
          - endpoints.POST_/warranty/claims/{id}/payment-reversals
        distinguishing_aspect: "The compensating transition must restore the claim's paid, reserve and incurred figures, the coverage term's consumed and remaining capacity, and the builder ledger, while leaving both the original entry and its reversal in the journal."
        excluded_because:
          difficulty_instance: "payment_reversal_restores_the_claim_incurred_identity_exactly"
          rationale: "That instance asserts the full restoration of the conservation identity after the reversal, and its sibling payment_reversal_restores_coverage_term_capacity_without_resurrecting_the_suspended_sibling covers the cross-entity half including what deliberately does not roll back; a generic compensation test would duplicate both."

