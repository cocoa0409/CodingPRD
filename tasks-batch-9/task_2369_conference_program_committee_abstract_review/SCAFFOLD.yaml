# =============================================================================
# PRD Benchmark Scaffold — task_2369
# Conference Program Committee & Abstract Review
# §1.0–§1.7  (§1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
#             §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml)
# =============================================================================

scenario: |
  2369. Conference Program Committee & Abstract Review (professional conference organizer): call for abstracts with submission categories, formatting requirements and deadlines, reviewer recruitment with expertise matching and conflict-of-interest declarations, blinded review assignment with scoring rubrics and discrepancy resolution, acceptance decisions across oral, poster and workshop formats with capacity constraints, session construction grouping accepted content by theme with chair assignment, presenter notification, registration requirements and no-show policies, continuing education accreditation with disclosure collection and content validation, embargo policies for newsworthy findings and press coordination, program change management close to the event

domain_name: conference-program-committee
api_prefix: "/"

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: flat
  # Every business entity is a top-level collection linked by foreign keys
  # (`/abstracts/{abstractId}`, `/reviews/{reviewId}`, `/sessions/{sessionId}`).
  # No entity is nested inside another's URL path; the only sub-resource GETs are
  # reverse-reachability lookups.

  state_machine_shape: cyclic
  # Conference cycles CFA_CLOSED->CFA_OPEN (deadline extension) and
  # REVIEW_CLOSED->REVIEW_OPEN (discrepancy reopen); Abstract cycles
  # SCORED->REVISION_REQUESTED->SUBMITTED (bounded revision loop); Session cycles
  # PUBLISHED->PLANNED (unpublish). DiscrepancyCase forks
  # ARBITER_ASSIGNED->{THIRD_REVIEW_PENDING, RESOLVED} and joins at RESOLVED.
  # Abstract additionally carries two independent state dimensions
  # (`status` x `embargo_status`).

  relationship_patterns:
    - one_to_many          # Conference -> Abstract, Session -> SessionSlot
    - many_to_many         # Abstract <-> CommitteeMember via Review (junction with payload)
    - self_referential     # SessionSlot.swapped_with_slot_id -> SessionSlot.id
    - cross_aggregate      # DisclosureStatement -> CmeAccreditation -> Abstract -> Session ledgers

  role_model: segregation_of_duties
  # A CommitteeMember who submitted a scored Review on an Abstract may not issue
  # that Abstract's decision, may not arbitrate its DiscrepancyCase; the chair who
  # issued the decision may not validate its CME accreditation.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Conference
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: public conference name
        constraints: 1..200 chars
      - name: code
        type: string
        source: input
        description: short conference code used in blind codes
        constraints: 2..12 chars, uppercase alphanumeric
      - name: status
        type: enum
        source: system
        description: call-for-abstracts / review / program lifecycle state
        default: DRAFT
        constraints: "DRAFT | CFA_OPEN | CFA_CLOSED | REVIEW_OPEN | REVIEW_CLOSED | DECISIONS_RELEASED | PROGRAM_PUBLISHED"
      - name: event_start_utc
        type: datetime
        source: input
        description: first day of the live event, ISO 8601 UTC
      - name: event_end_utc
        type: datetime
        source: input
        description: last day of the live event, ISO 8601 UTC
        constraints: must be > event_start_utc
      - name: abstract_deadline_utc
        type: datetime
        source: input
        description: submission cut-off enforced against the logical clock
        constraints: must be < event_start_utc
      - name: review_deadline_utc
        type: datetime
        source: input
        description: default due date stamped onto new Review rows
        constraints: must be > abstract_deadline_utc
      - name: program_freeze_utc
        type: datetime
        source: input
        description: after this instant slots may only change through an APPLIED ProgramChangeRequest
        constraints: must be > review_deadline_utc and < event_start_utc
      - name: oral_slot_capacity
        type: integer
        source: input
        description: hard number of ORAL presentation slots the program can hold
        constraints: ">= 0"
      - name: poster_slot_capacity
        type: integer
        source: input
        description: hard number of POSTER slots
        constraints: ">= 0"
      - name: workshop_slot_capacity
        type: integer
        source: input
        description: hard number of WORKSHOP slots
        constraints: ">= 0"
      - name: accepted_oral_count
        type: integer
        source: computed
        description: count of Abstract rows of this conference with decision == ORAL and status IN {ACCEPTED, CONFIRMED, SCHEDULED, PRESENTED, NO_SHOW}
        default: 0
      - name: accepted_poster_count
        type: integer
        source: computed
        description: same rule as accepted_oral_count for decision == POSTER
        default: 0
      - name: accepted_workshop_count
        type: integer
        source: computed
        description: same rule as accepted_oral_count for decision == WORKSHOP
        default: 0
      - name: waitlisted_count
        type: integer
        source: computed
        description: count of Abstract rows of this conference with status == WAITLISTED
        default: 0
      - name: cme_minutes_pool_total
        type: integer
        source: input
        description: total accreditable content minutes the accrediting body granted this conference
        default: 0
        constraints: ">= 0"
      - name: cme_minutes_allocated
        type: integer
        source: computed
        description: sum of CmeAccreditation.content_minutes over accreditations of this conference with validation_status == VALIDATED
        default: 0
      - name: cme_minutes_available
        type: integer
        source: computed
        description: cme_minutes_pool_total - cme_minutes_allocated
        default: 0
      - name: cfa_extension_count
        type: integer
        source: system
        description: number of CFA_CLOSED -> CFA_OPEN extensions already granted
        default: 0
        constraints: "<= 1"
      - name: review_reopen_count
        type: integer
        source: system
        description: number of REVIEW_CLOSED -> REVIEW_OPEN reopens already granted
        default: 0
        constraints: "<= 1"
      - name: abstract_sequence
        type: integer
        source: system
        description: monotonic counter used to mint deterministic blind codes
        default: 0

  - name: SubmissionCategory
    parent: null
    common_fields: true
    fields:
      - name: conference_id
        type: string
        source: input
        description: FK -> Conference.id; the conference this category belongs to
      - name: code
        type: string
        source: input
        description: category code, unique within the conference
        constraints: 2..16 chars
      - name: name
        type: string
        source: input
        description: human-readable category name
      - name: max_word_count
        type: integer
        source: input
        description: formatting rule — maximum Abstract.body_word_count accepted
        constraints: 100..600
      - name: requires_structured_body
        type: boolean
        source: input
        description: formatting rule — Abstract.body_structured must be true when this is true
      - name: allowed_formats
        type: array
        source: input
        description: presentation formats this category may be submitted for / decided into
        constraints: non-empty subset of [ORAL, POSTER, WORKSHOP]
      - name: min_reviews_required
        type: integer
        source: input
        description: number of SUBMITTED reviews needed before an Abstract auto-advances to SCORED
        default: 3
        constraints: 2..5
      - name: discrepancy_threshold
        type: number
        source: input
        description: score spread at or above which a DiscrepancyCase is opened
        default: 2.50
        constraints: 0.50..4.00, 2 decimals
      - name: cme_eligible
        type: boolean
        source: input
        description: whether abstracts in this category may carry a CmeAccreditation
        default: false

  - name: Author
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: author display name
      - name: email
        type: string
        source: input
        description: author email; the matching key for conflict-of-interest and coauthor checks
        constraints: unique across Author rows, lowercase
      - name: affiliation
        type: string
        source: input
        description: institution string; matched against ConflictDeclaration AFFILIATION subjects
        default: ""
      - name: is_registered
        type: boolean
        source: system
        description: true once a paid conference registration is recorded
        default: false
      - name: registered_at
        type: datetime
        source: system
        description: logical-clock instant of registration, null before registering
        default: null
      - name: no_show_strikes
        type: integer
        source: computed
        description: count of SessionSlot rows with status == NO_SHOW_RECORDED whose presenter_author_id is this author
        default: 0
      - name: embargo_breach_count
        type: integer
        source: computed
        description: count of Abstract rows with embargo_status == BREACHED whose submitting_author_id is this author
        default: 0
      - name: sanction_status
        type: enum
        source: computed
        description: no-show / embargo sanction posture derived from no_show_strikes and embargo_breach_count
        default: NONE
        constraints: "NONE | WARNED | BARRED"

  - name: Abstract
    parent: null
    common_fields: true
    fields:
      - name: conference_id
        type: string
        source: input
        description: FK -> Conference.id; owning conference
      - name: category_id
        type: string
        source: input
        description: FK -> SubmissionCategory.id; must belong to the same conference
      - name: submitting_author_id
        type: string
        source: input
        description: FK -> Author.id; the submitting (owning) author
      - name: title
        type: string
        source: input
        description: abstract title
        constraints: 1..300 chars
      - name: body_word_count
        type: integer
        source: input
        description: declared body length, checked against category.max_word_count
        constraints: ">= 1"
      - name: body_structured
        type: boolean
        source: input
        description: whether the body uses the structured Background/Methods/Results/Conclusion layout
      - name: requested_format
        type: enum
        source: input
        description: format the author asked for
        constraints: "ORAL | POSTER | WORKSHOP"
      - name: keywords
        type: array
        source: input
        description: lowercase topic keywords used for reviewer expertise matching
        constraints: 1..5 unique lowercase strings
      - name: coauthor_emails
        type: array
        source: input
        description: coauthor emails; participate in conflict-of-interest matching and presenter eligibility
        default: []
        constraints: 0..10 lowercase emails, must not contain the submitting author's email
      - name: is_newsworthy
        type: boolean
        source: input
        description: author flag requesting press/embargo handling
        default: false
      - name: blind_code
        type: string
        source: system
        description: "deterministic blinded label minted at creation as <Conference.code>-B<zero-padded Conference.abstract_sequence after increment>, e.g. NEURO26-B0001"
      - name: status
        type: enum
        source: system
        description: review/decision lifecycle dimension
        default: SUBMITTED
        constraints: "SUBMITTED | UNDER_REVIEW | SCORED | REVISION_REQUESTED | ACCEPTED | WAITLISTED | REJECTED | CONFIRMED | SCHEDULED | PRESENTED | NO_SHOW | WITHDRAWN"
      - name: revision_round
        type: integer
        source: system
        description: number of completed revision loops
        default: 0
        constraints: "<= 2"
      - name: submitted_review_count
        type: integer
        source: computed
        description: count of Review rows for this abstract with status == SUBMITTED and assigned_round == this abstract's revision_round
        default: 0
      - name: provisional_score
        type: number
        source: computed
        description: provisional variant of abstract_consensus_score, refreshed on every review submission
        default: null
      - name: final_score
        type: number
        source: computed
        description: final variant of abstract_consensus_score, written at REVIEW_OPEN -> REVIEW_CLOSED and on discrepancy resolution
        default: null
      - name: score_spread
        type: number
        source: computed
        description: max minus min Review.weighted_score over SUBMITTED reviews of the current round
        default: null
      - name: decision
        type: enum
        source: computed
        description: committee decision; null until a decision is issued
        default: null
        constraints: "ORAL | POSTER | WORKSHOP | REJECTED"
      - name: decision_downgraded
        type: boolean
        source: computed
        description: true when the capacity waterfall moved the decision below the requested format
        default: false
      - name: decided_by_member_id
        type: string
        source: system
        description: FK -> CommitteeMember.id; chair who issued the current decision, null when none
        default: null
      - name: embargo_status
        type: enum
        source: system
        description: press/embargo dimension, independent of `status`
        default: NONE
        constraints: "NONE | EMBARGOED | RELEASED | BREACHED"
      - name: embargo_until_utc
        type: datetime
        source: input
        description: instant before which press coverage is forbidden, set through press-actions
        default: null
      - name: press_outlet_name
        type: string
        source: system
        description: outlet recorded on the press release attempt
        default: null

  - name: CommitteeMember
    parent: null
    common_fields: true
    fields:
      - name: conference_id
        type: string
        source: input
        description: FK -> Conference.id; the conference whose committee this member serves
      - name: full_name
        type: string
        source: input
        description: member display name
      - name: email
        type: string
        source: input
        description: member email; compared against Abstract author/coauthor emails for self-review detection
        constraints: unique within the conference, lowercase
      - name: expertise_keywords
        type: array
        source: input
        description: lowercase keywords driving expertise_match_score
        constraints: 1..8 unique lowercase strings
      - name: member_role
        type: enum
        source: input
        description: committee function; gates which X-User-Role the member may act as
        constraints: "REVIEWER | CHAIR"
      - name: max_review_load
        type: integer
        source: input
        description: maximum number of concurrently ASSIGNED reviews
        default: 4
        constraints: 1..20
      - name: current_review_load
        type: integer
        source: computed
        description: count of Review rows with reviewer_member_id == this member and status == ASSIGNED
        default: 0
      - name: calibration_bias
        type: number
        source: input
        description: calibration offset from prior conferences, ADDED to the weighted rubric total by review_weighted_score when the review is submitted
        default: 0.00
        constraints: -1.00..1.00, 2 decimals
      - name: status
        type: enum
        source: system
        description: recruitment lifecycle
        default: INVITED
        constraints: "INVITED | ACTIVE | SUSPENDED | RESIGNED"
      - name: coi_declaration_status
        type: enum
        source: system
        description: whether the member has filed their conflict-of-interest declaration
        default: PENDING
        constraints: "PENDING | SUBMITTED"
      - name: chaired_session_count
        type: integer
        source: computed
        description: count of Session rows with chair_member_id == this member and status IN {PLANNED, PUBLISHED, LOCKED}
        default: 0

  - name: ConflictDeclaration
    parent: null
    common_fields: false
    fields:
      - name: member_id
        type: string
        source: input
        description: FK -> CommitteeMember.id; the declaring member
      - name: conflict_subject_type
        type: enum
        source: input
        description: what the declared value is matched against
        constraints: "AUTHOR_EMAIL | AFFILIATION | NONE"
      - name: conflict_subject_value
        type: string
        source: input
        description: lowercase email or exact affiliation string; must be null when conflict_subject_type == NONE
        default: null
      - name: conflict_type
        type: enum
        source: input
        description: nature of the conflict
        constraints: "COAUTHOR | INSTITUTIONAL | FINANCIAL | ADVISORY | NONE"
      - name: declared_at
        type: datetime
        source: system
        description: logical-clock instant the declaration was filed

  - name: Review
    parent: null
    common_fields: true
    fields:
      - name: abstract_id
        type: string
        source: input
        description: FK -> Abstract.id; the reviewed abstract
      - name: reviewer_member_id
        type: string
        source: input
        description: FK -> CommitteeMember.id; the assigned reviewer
      - name: status
        type: enum
        source: system
        description: assignment lifecycle
        default: ASSIGNED
        constraints: "ASSIGNED | SUBMITTED | DECLINED | VOIDED"
      - name: assigned_round
        type: integer
        source: system
        description: Abstract.revision_round captured at assignment time
        default: 0
      - name: expertise_match_score
        type: number
        source: computed
        description: Dice coefficient between reviewer keywords and abstract keywords, 4 decimals
      - name: due_utc
        type: datetime
        source: input
        description: review due date; defaults to the conference review_deadline_utc
      - name: is_third_review
        type: boolean
        source: system
        description: true when created by a THIRD_REVIEW discrepancy resolution
        default: false
      - name: score_originality
        type: integer
        source: input
        description: rubric score for originality
        default: null
        constraints: 1..5
      - name: score_methodology
        type: integer
        source: input
        description: rubric score for methodology
        default: null
        constraints: 1..5
      - name: score_relevance
        type: integer
        source: input
        description: rubric score for relevance
        default: null
        constraints: 1..5
      - name: score_clarity
        type: integer
        source: input
        description: rubric score for clarity
        default: null
        constraints: 1..5
      - name: confidence
        type: enum
        source: input
        description: reviewer self-rated confidence, selects the confidence factor
        default: null
        constraints: "LOW | MEDIUM | HIGH"
      - name: recommended_format
        type: enum
        source: input
        description: reviewer's format recommendation, advisory only
        default: null
        constraints: "ORAL | POSTER | WORKSHOP"
      - name: comments_to_authors
        type: string
        source: input
        description: blinded free-text feedback
        default: null
      - name: weighted_score
        type: number
        source: computed
        description: review_weighted_score output, 2 decimals, null until SUBMITTED
        default: null
      - name: submitted_at
        type: datetime
        source: system
        description: logical-clock instant of submission
        default: null
      - name: decline_reason
        type: string
        source: input
        description: reason captured on ASSIGNED -> DECLINED
        default: null

  - name: DiscrepancyCase
    parent: null
    common_fields: true
    fields:
      - name: abstract_id
        type: string
        source: system
        description: FK -> Abstract.id; the abstract whose reviews diverged
      - name: arbiter_member_id
        type: string
        source: input
        description: FK -> CommitteeMember.id; chair arbitrating the case, null until assigned
        default: null
      - name: third_review_id
        type: string
        source: system
        description: FK -> Review.id; review created by a THIRD_REVIEW resolution, null otherwise
        default: null
      - name: status
        type: enum
        source: system
        description: arbitration lifecycle
        default: OPEN
        constraints: "OPEN | ARBITER_ASSIGNED | THIRD_REVIEW_PENDING | RESOLVED | ESCALATED"
      - name: spread_at_open
        type: number
        source: computed
        description: Abstract.score_spread at the instant the case was opened, 2 decimals
      - name: resolution_method
        type: enum
        source: input
        description: chosen arbitration path
        default: null
        constraints: "THIRD_REVIEW | CHAIR_OVERRIDE"
      - name: resolved_score
        type: number
        source: computed
        description: consensus score written back onto the abstract at RESOLVED, 2 decimals
        default: null

  - name: Session
    parent: null
    common_fields: true
    fields:
      - name: conference_id
        type: string
        source: input
        description: FK -> Conference.id; owning conference
      - name: chair_member_id
        type: string
        source: input
        description: FK -> CommitteeMember.id; session chair, must have member_role == CHAIR
      - name: theme_code
        type: string
        source: input
        description: theme grouping key; slots must share it with the session
        constraints: 2..16 chars
      - name: format
        type: enum
        source: input
        description: presentation format this session holds
        constraints: "ORAL | POSTER | WORKSHOP"
      - name: room_code
        type: string
        source: input
        description: room identifier; the occupied resource for room overlap checks
        constraints: 1..16 chars
      - name: start_utc
        type: datetime
        source: input
        description: session window start
      - name: end_utc
        type: datetime
        source: input
        description: session window end, must be > start_utc
      - name: capacity_slots
        type: integer
        source: input
        description: maximum number of SCHEDULED slots
        default: 6
        constraints: 1..20
      - name: cme_designated
        type: boolean
        source: input
        description: whether the session is advertised as CME-designated
        default: false
      - name: status
        type: enum
        source: system
        description: program publication lifecycle
        default: PLANNED
        constraints: "PLANNED | PUBLISHED | LOCKED | CANCELLED"
      - name: slot_count
        type: integer
        source: computed
        description: count of SessionSlot rows of this session with status IN {SCHEDULED, PRESENTED, NO_SHOW_RECORDED}
        default: 0
      - name: committed_minutes
        type: integer
        source: computed
        description: sum of SessionSlot.duration_minutes over slots with status IN {SCHEDULED, PRESENTED, NO_SHOW_RECORDED} plus session_packing changeover allowance
        default: 0
      - name: accredited_credit_total
        type: number
        source: computed
        description: sum of per-abstract CME credits over this session's counted slots whose accreditation is VALIDATED, 2 decimals
        default: 0.00
      - name: accreditation_posture
        type: enum
        source: computed
        description: NOT_APPLICABLE when cme_designated is false; else COMPLIANT when accredited_credit_total >= 0.50, otherwise NON_COMPLIANT
        default: NOT_APPLICABLE
        constraints: "COMPLIANT | NON_COMPLIANT | NOT_APPLICABLE"

  - name: SessionSlot
    parent: null
    common_fields: true
    fields:
      - name: session_id
        type: string
        source: input
        description: FK -> Session.id; owning session
      - name: abstract_id
        type: string
        source: input
        description: FK -> Abstract.id; the scheduled abstract
      - name: presenter_author_id
        type: string
        source: input
        description: FK -> Author.id; presenting author, must be the submitting author or a coauthor email holder
      - name: swapped_with_slot_id
        type: string
        source: system
        description: FK -> SessionSlot.id; counterpart slot of an APPLIED SWAP change request, null otherwise
        default: null
      - name: position
        type: integer
        source: input
        description: 1-based running order inside the session
        constraints: 1..20, unique among the session's counted slots
      - name: duration_minutes
        type: integer
        source: input
        description: presentation length
        constraints: 5..120
      - name: status
        type: enum
        source: system
        description: slot lifecycle
        default: SCHEDULED
        constraints: "SCHEDULED | PRESENTED | NO_SHOW_RECORDED | WITHDRAWN | MOVED"

  - name: CmeAccreditation
    parent: null
    common_fields: true
    fields:
      - name: abstract_id
        type: string
        source: input
        description: FK -> Abstract.id; accredited content
      - name: content_minutes
        type: integer
        source: input
        description: instructional minutes submitted for accreditation
        constraints: 5..240
      - name: commercial_support_disclosed
        type: boolean
        source: input
        description: whether commercial support was declared for this content
        default: false
      - name: commercial_bias_flag
        type: boolean
        source: computed
        description: true when commercial_support_disclosed is true and any linked DisclosureStatement has mitigation_required true and mitigation_completed false
        default: false
      - name: awarded_credits
        type: number
        source: computed
        description: cme_credit_award output in 0.25 steps; 0.00 unless validation_status == VALIDATED
        default: 0.00
      - name: validation_status
        type: enum
        source: system
        description: content-validation lifecycle
        default: PENDING
        constraints: "PENDING | VALIDATED | REJECTED | REVOKED"
      - name: validated_by_member_id
        type: string
        source: system
        description: FK -> CommitteeMember.id; chair who validated the content, null until validated
        default: null
      - name: validated_at
        type: datetime
        source: system
        description: logical-clock instant of validation
        default: null

  - name: DisclosureStatement
    parent: null
    common_fields: true
    fields:
      - name: abstract_id
        type: string
        source: input
        description: FK -> Abstract.id; disclosed content
      - name: accreditation_id
        type: string
        source: input
        description: FK -> CmeAccreditation.id; accreditation this disclosure supports
      - name: author_id
        type: string
        source: input
        description: FK -> Author.id; disclosing author
      - name: has_financial_relationship
        type: boolean
        source: input
        description: whether the author declares a relevant financial relationship
      - name: relationship_entity
        type: string
        source: input
        description: commercial entity name, required when has_financial_relationship is true
        default: null
      - name: mitigation_required
        type: boolean
        source: computed
        description: equals has_financial_relationship
        default: false
      - name: mitigation_completed
        type: boolean
        source: input
        description: whether mitigation steps were completed
        default: false
      - name: status
        type: enum
        source: system
        description: adjudication lifecycle
        default: SUBMITTED
        constraints: "SUBMITTED | VALIDATED | REJECTED"
      - name: rejection_reason
        type: string
        source: input
        description: reason captured on rejection
        default: null

  - name: ProgramChangeRequest
    parent: null
    common_fields: true
    fields:
      - name: conference_id
        type: string
        source: input
        description: FK -> Conference.id; owning conference
      - name: session_slot_id
        type: string
        source: input
        description: FK -> SessionSlot.id; slot the change applies to
      - name: requested_by_author_id
        type: string
        source: input
        description: FK -> Author.id; requesting author; defaults to X-User-ID when the caller is an Author
        default: null
      - name: change_type
        type: enum
        source: input
        description: kind of late program change
        constraints: "MOVE | SWAP | SUBSTITUTE_PRESENTER | WITHDRAW"
      - name: target_session_id
        type: string
        source: input
        description: FK -> Session.id; destination session for MOVE / counterpart session for SWAP
        default: null
      - name: substitute_presenter_author_id
        type: string
        source: input
        description: FK -> Author.id; replacement presenter for SUBSTITUTE_PRESENTER
        default: null
      - name: approver_member_id
        type: string
        source: system
        description: FK -> CommitteeMember.id; chair who adjudicated, null while PENDING
        default: null
      - name: status
        type: enum
        source: system
        description: adjudication lifecycle
        default: PENDING
        constraints: "PENDING | APPLIED | REJECTED"
      - name: submitted_at
        type: datetime
        source: system
        description: logical-clock instant of submission; decides whether the late penalty applies
      - name: days_to_event
        type: integer
        source: computed
        description: floor((Conference.event_start_utc - submitted_at) / 86400 seconds), may be negative
      - name: estimated_fee_cents
        type: integer
        source: computed
        description: program_change_fee pre_freeze_estimate variant, written at creation
        default: 0
      - name: final_fee_cents
        type: integer
        source: computed
        description: program_change_fee post_freeze_final variant, written at adjudication, null while PENDING
        default: null
      - name: rush_pct_applied
        type: number
        source: computed
        description: rush tier percentage selected from the provisional total, null while PENDING
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Conference
    dimension: status
    initial_state: DRAFT
    terminal_states: [PROGRAM_PUBLISHED]
    transitions:
      - from: DRAFT
        to: CFA_OPEN
        trigger: "POST /conferences/{conferenceId}/status-transitions with to_status=CFA_OPEN"
        actor: ConferenceAdmin
        preconditions:
          - "at least one SubmissionCategory exists with conference_id == this conference"
          - "logical clock < Conference.abstract_deadline_utc"
        side_effects:
          - "Conference.version += 1; Conference.updated_at refreshed"
      - from: CFA_OPEN
        to: CFA_CLOSED
        trigger: "POST /conferences/{conferenceId}/status-transitions with to_status=CFA_CLOSED"
        actor: ConferenceAdmin
        preconditions: []
        side_effects:
          - "Conference.version += 1"
        note: "Closing the call is an explicit admin act; passing abstract_deadline_utc does NOT auto-close the call, it only makes POST /abstracts fail with ERR_CFA_DEADLINE_PASSED."
      - from: CFA_CLOSED
        to: CFA_OPEN
        trigger: "POST /conferences/{conferenceId}/status-transitions with to_status=CFA_OPEN and new_abstract_deadline_utc (deadline extension)"
        actor: ConferenceAdmin
        preconditions:
          - "Conference.cfa_extension_count == 0"
          - "new_abstract_deadline_utc is present, > logical clock, > current abstract_deadline_utc, and < Conference.review_deadline_utc"
        side_effects:
          - "Conference.abstract_deadline_utc := new_abstract_deadline_utc"
          - "Conference.cfa_extension_count += 1"
          - "Conference.version += 1"
        note: "Cycle back-edge #1. A second extension attempt fails with ERR_CFA_EXTENSION_LIMIT."
      - from: CFA_CLOSED
        to: REVIEW_OPEN
        trigger: "POST /conferences/{conferenceId}/status-transitions with to_status=REVIEW_OPEN"
        actor: ConferenceAdmin
        preconditions:
          - "at least one Abstract of this conference has status == SUBMITTED"
        side_effects:
          - "Conference.version += 1"
      - from: REVIEW_OPEN
        to: REVIEW_CLOSED
        trigger: "POST /conferences/{conferenceId}/status-transitions with to_status=REVIEW_CLOSED"
        actor: ConferenceAdmin
        preconditions:
          - "no DiscrepancyCase whose abstract_id belongs to this conference has status IN {OPEN, ARBITER_ASSIGNED, THIRD_REVIEW_PENDING, ESCALATED} (else ERR_OPEN_DISCREPANCY)"
        side_effects:
          - "for every Abstract of this conference with status == UNDER_REVIEW and submitted_review_count >= its category.min_reviews_required: status := SCORED"
          - "for every Abstract of this conference with status IN {UNDER_REVIEW, SCORED} and submitted_review_count >= 1: final_score := abstract_consensus_score(variant=final)"
          - "every Review of this conference with status == ASSIGNED := VOIDED; for each voided review its reviewer_member_id's CommitteeMember.current_review_load -= 1 (reviewer_load_ledger invariant preserved)"
          - "Conference.version += 1"
      - from: REVIEW_CLOSED
        to: REVIEW_OPEN
        trigger: "POST /conferences/{conferenceId}/status-transitions with to_status=REVIEW_OPEN and reopen_reason (review reopen)"
        actor: ConferenceAdmin
        preconditions:
          - "Conference.review_reopen_count == 0"
          - "reopen_reason is present and non-empty"
        side_effects:
          - "Conference.review_reopen_count += 1"
          - "for every Abstract of this conference with status == SCORED and decision == null: final_score := null (the final variant is invalidated until review closes again)"
          - "Conference.version += 1"
        note: "Cycle back-edge #2. A second reopen attempt fails with ERR_REVIEW_REOPEN_LIMIT."
      - from: REVIEW_CLOSED
        to: DECISIONS_RELEASED
        trigger: "POST /conferences/{conferenceId}/status-transitions with to_status=DECISIONS_RELEASED"
        actor: ConferenceAdmin
        preconditions:
          - "no Abstract of this conference has status == SCORED (every scored abstract carries a decision or is WAITLISTED) — else ERR_UNDECIDED_ABSTRACTS_REMAIN"
        side_effects:
          - "Conference.version += 1"
        note: "This is the presenter-notification gate: Abstract ACCEPTED -> CONFIRMED is only permitted from DECISIONS_RELEASED onward."
      - from: DECISIONS_RELEASED
        to: PROGRAM_PUBLISHED
        trigger: "POST /conferences/{conferenceId}/status-transitions with to_status=PROGRAM_PUBLISHED"
        actor: ConferenceAdmin
        preconditions:
          - "every Session with conference_id == this conference has status IN {PUBLISHED, CANCELLED}"
          - "at least one Session of this conference has status == PUBLISHED"
        side_effects:
          - "every Session of this conference with status == PUBLISHED := LOCKED; each such Session.version += 1"
          - "Conference.version += 1"

  - entity: Abstract
    dimension: status
    initial_state: SUBMITTED
    terminal_states: [REJECTED, PRESENTED, NO_SHOW, WITHDRAWN]
    transitions:
      - from: "(create)"
        to: SUBMITTED
        trigger: "POST /abstracts"
        actor: Author
        preconditions:
          - "Conference.status == CFA_OPEN"
          - "logical clock <= Conference.abstract_deadline_utc"
          - "SubmissionCategory.conference_id == body conference_id (else ERR_CATEGORY_CONFERENCE_MISMATCH)"
          - "body_word_count <= category.max_word_count"
          - "body_structured == true when category.requires_structured_body"
          - "requested_format IN category.allowed_formats"
          - "Author.sanction_status != BARRED"
        side_effects:
          - "Conference.abstract_sequence += 1; Abstract.blind_code := <Conference.code>-B<abstract_sequence zero-padded to 4>"
          - "Conference.version += 1"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /abstracts/{abstractId}/review-assignments (first Review of the current revision_round)"
        actor: ProgramChair
        preconditions:
          - "Conference.status == REVIEW_OPEN"
        side_effects:
          - "Review created with status ASSIGNED, assigned_round := Abstract.revision_round, expertise_match_score computed"
          - "CommitteeMember.current_review_load += 1 for the assigned reviewer"
      - from: UNDER_REVIEW
        to: SCORED
        trigger: "system, on POST /reviews/{reviewId}/submission when Abstract.submitted_review_count reaches category.min_reviews_required"
        actor: system
        preconditions:
          - "Abstract.submitted_review_count >= category.min_reviews_required (counting only Review rows with assigned_round == Abstract.revision_round)"
        side_effects:
          - "Abstract.provisional_score and Abstract.score_spread refreshed"
          - "a DiscrepancyCase with status OPEN is created when Abstract.score_spread >= category.discrepancy_threshold and no non-terminal case already exists for this abstract"
      - from: SCORED
        to: REVISION_REQUESTED
        trigger: "POST /abstracts/{abstractId}/status-transitions with to_status=REVISION_REQUESTED"
        actor: ProgramChair
        preconditions:
          - "Conference.status == REVIEW_OPEN"
          - "Abstract.revision_round < 2"
          - "no DiscrepancyCase for this abstract has status IN {OPEN, ARBITER_ASSIGNED, THIRD_REVIEW_PENDING, ESCALATED}"
        side_effects:
          - "every Review of this abstract with status == ASSIGNED := VOIDED; each affected reviewer's current_review_load -= 1"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /abstracts/{abstractId}/revisions"
        actor: Author
        preconditions:
          - "acting Author.id == Abstract.submitting_author_id"
          - "Conference.status == REVIEW_OPEN"
          - "logical clock <= Conference.review_deadline_utc"
          - "Abstract.revision_round < 2 (else ERR_REVISION_LIMIT_REACHED)"
          - "body_word_count <= category.max_word_count and body_structured satisfies category.requires_structured_body"
        side_effects:
          - "Abstract.revision_round += 1; body_word_count, body_structured, keywords (and title when supplied) replaced"
          - "Abstract.provisional_score := null, final_score := null, score_spread := null"
          - "Abstract.submitted_review_count recomputes to 0 (prior-round Review rows keep assigned_round of the old round and leave the consensus input set)"
        note: "Cycle back-edge on Abstract: SCORED -> REVISION_REQUESTED -> SUBMITTED. Bounded at 2 rounds."
      - from: SCORED
        to: ACCEPTED
        trigger: "POST /abstracts/{abstractId}/decision with decision IN {ORAL, POSTER, WORKSHOP}"
        actor: ProgramChair
        preconditions:
          - "Conference.status == REVIEW_CLOSED"
          - "expected_conference_version == Conference.version (else ERR_STALE_CONFERENCE_VERSION)"
          - "Abstract.submitted_review_count >= category.min_reviews_required (else ERR_INSUFFICIENT_REVIEWS)"
          - "no DiscrepancyCase for this abstract has status IN {OPEN, ARBITER_ASSIGNED, THIRD_REVIEW_PENDING, ESCALATED} (else ERR_OPEN_DISCREPANCY)"
          - "acting CommitteeMember has no Review on this abstract with status == SUBMITTED (else ERR_SEGREGATION_VIOLATION)"
          - "decision IN category.allowed_formats (else ERR_FORMAT_NOT_ALLOWED)"
          - "format_capacity_waterfall resolves to a committed format (else ERR_FORMAT_CAPACITY_EXHAUSTED)"
        side_effects:
          - "Abstract.decision := waterfall-resolved format; Abstract.decision_downgraded := true when it differs from the requested decision"
          - "Abstract.decided_by_member_id := acting CommitteeMember.id"
          - "Conference.accepted_<format>_count += 1; Conference.version += 1"
      - from: SCORED
        to: WAITLISTED
        trigger: "POST /abstracts/{abstractId}/decision with decision IN {ORAL, POSTER} when the waterfall exhausts both ORAL and POSTER capacity"
        actor: ProgramChair
        preconditions:
          - "same preconditions as SCORED -> ACCEPTED except capacity"
          - "allow_format_downgrade == true and remaining capacity is 0 for every format in the waterfall tail"
        side_effects:
          - "Abstract.decision := null; Abstract.decided_by_member_id := acting CommitteeMember.id"
          - "Conference.waitlisted_count += 1; Conference.version += 1"
      - from: SCORED
        to: REJECTED
        trigger: "POST /abstracts/{abstractId}/decision with decision=REJECTED"
        actor: ProgramChair
        preconditions:
          - "same preconditions as SCORED -> ACCEPTED except the capacity and allowed-format checks (REJECTED consumes no slot)"
        side_effects:
          - "Abstract.decision := REJECTED; Abstract.decided_by_member_id := acting CommitteeMember.id"
          - "Conference.version += 1"
      - from: WAITLISTED
        to: ACCEPTED
        trigger: "system, waitlist promotion when format_capacity_waterfall releases a slot (abstract withdrawal, decision rescission or session cancellation)"
        actor: system
        preconditions:
          - "the released format IS IN the promoted abstract's category.allowed_formats"
          - "the promoted abstract is the highest-ranked WAITLISTED abstract of the conference per format_capacity_waterfall's promotion ranking"
        side_effects:
          - "Abstract.decision := released format; Abstract.decision_downgraded := true when released format != Abstract.requested_format"
          - "Abstract.decided_by_member_id := decided_by_member_id of the abstract whose slot was released"
          - "Conference.accepted_<format>_count += 1; Conference.waitlisted_count -= 1; Conference.version += 1"
      - from: ACCEPTED
        to: SCORED
        trigger: "POST /abstracts/{abstractId}/status-transitions with to_status=SCORED (decision rescission)"
        actor: ProgramChair
        preconditions:
          - "Conference.status IN {REVIEW_CLOSED, DECISIONS_RELEASED}"
          - "no SessionSlot references this abstract with status == SCHEDULED"
        side_effects:
          - "Conference.accepted_<old decision>_count -= 1"
          - "Abstract.decision := null; decided_by_member_id := null; decision_downgraded := false"
          - "waitlist promotion runs for the released format (WAITLISTED -> ACCEPTED)"
          - "Conference.version += 1"
        note: "Compensating action for SCORED -> ACCEPTED; the format-slot conservation invariant must hold exactly afterwards."
      - from: ACCEPTED
        to: CONFIRMED
        trigger: "POST /abstracts/{abstractId}/status-transitions with to_status=CONFIRMED"
        actor: Author
        preconditions:
          - "acting Author.id == Abstract.submitting_author_id"
          - "Conference.status IN {DECISIONS_RELEASED, PROGRAM_PUBLISHED}"
          - "Author.is_registered == true (else ERR_AUTHOR_NOT_REGISTERED)"
          - "Author.sanction_status != BARRED (else ERR_AUTHOR_BARRED)"
        side_effects:
          - "Abstract.version += 1"
      - from: CONFIRMED
        to: SCHEDULED
        trigger: "system, on POST /sessions/{sessionId}/slots"
        actor: system
        preconditions:
          - "the created SessionSlot references this abstract"
        side_effects:
          - "Session.slot_count, committed_minutes, accredited_credit_total and accreditation_posture recomputed"
      - from: SCHEDULED
        to: PRESENTED
        trigger: "system, on POST /session-slots/{slotId}/status-transitions with to_status=PRESENTED"
        actor: system
        preconditions:
          - "the slot's session.status IN {PUBLISHED, LOCKED}"
        side_effects: []
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "system, on POST /session-slots/{slotId}/status-transitions with to_status=NO_SHOW_RECORDED"
        actor: system
        preconditions:
          - "the slot's session.status IN {PUBLISHED, LOCKED}"
        side_effects:
          - "Author.no_show_strikes recomputed for the slot's presenter_author_id, which re-derives Author.sanction_status"
      - from: SUBMITTED | UNDER_REVIEW | SCORED | WAITLISTED | ACCEPTED | CONFIRMED | SCHEDULED
        to: WITHDRAWN
        trigger: "POST /abstracts/{abstractId}/status-transitions with to_status=WITHDRAWN"
        actor: Author | ProgramChair
        preconditions:
          - "acting Author.id == Abstract.submitting_author_id, or the caller is a ProgramChair of this conference"
          - "when the abstract has a SessionSlot with status == SCHEDULED: logical clock < Conference.program_freeze_utc, or a ProgramChangeRequest with change_type == WITHDRAW and status == APPLIED exists for that slot (else ERR_PROGRAM_FROZEN)"
        side_effects:
          - "CASCADE-B link 1: every SessionSlot of this abstract with status == SCHEDULED := WITHDRAWN"
          - "CASCADE-B link 2 (caused by link 1): each affected Session.slot_count -= 1, committed_minutes recomputed, accredited_credit_total and accreditation_posture recomputed, Session.version += 1"
          - "CASCADE-B link 3 (caused by link 2): any affected Session whose slot_count reached 0 and whose status == PUBLISHED := PLANNED (an empty session cannot stay published)"
          - "CASCADE-B' link 2 (caused by link 1 losing the committed slot): when Abstract.decision != null, Conference.accepted_<decision>_count -= 1 and Conference.version += 1"
          - "CASCADE-B' link 3 (caused by the freed capacity): waitlist promotion runs for the released format (WAITLISTED -> ACCEPTED), which re-increments Conference.accepted_<format>_count"

  - entity: Abstract
    dimension: embargo_status
    initial_state: NONE
    terminal_states: [RELEASED, BREACHED]
    transitions:
      - from: NONE
        to: EMBARGOED
        trigger: "POST /abstracts/{abstractId}/press-actions with action=SET_EMBARGO"
        actor: PressOfficer
        preconditions:
          - "Abstract.is_newsworthy == true (else ERR_NOT_NEWSWORTHY)"
          - "Abstract.status IN {ACCEPTED, CONFIRMED, SCHEDULED}"
          - "embargo_until_utc is present, > logical clock and <= Conference.event_end_utc"
        side_effects:
          - "Abstract.embargo_until_utc := body embargo_until_utc"
        note: "This dimension evolves independently of Abstract.status; a BREACHED abstract keeps its review/decision status."
      - from: EMBARGOED
        to: RELEASED
        trigger: "POST /abstracts/{abstractId}/press-actions with action=RELEASE when logical clock >= Abstract.embargo_until_utc"
        actor: PressOfficer
        preconditions:
          - "outlet_name is present"
          - "logical clock >= Abstract.embargo_until_utc"
        side_effects:
          - "Abstract.press_outlet_name := outlet_name"
      - from: EMBARGOED
        to: BREACHED
        trigger: "POST /abstracts/{abstractId}/press-actions with action=RELEASE when logical clock < Abstract.embargo_until_utc"
        actor: PressOfficer
        preconditions:
          - "outlet_name is present"
        side_effects:
          - "CASCADE-E link 1: Abstract.press_outlet_name := outlet_name, embargo_status := BREACHED"
          - "CASCADE-E link 2 (caused by link 1): Author.embargo_breach_count recomputed for Abstract.submitting_author_id"
          - "CASCADE-E link 3 (caused by link 2): Author.sanction_status re-derived from no_show_strikes + embargo_breach_count"
        note: "Branching transition: the same request lands in RELEASED or BREACHED purely on the clock comparison, with disjoint side-effect sets."

  - entity: CommitteeMember
    dimension: status
    initial_state: INVITED
    terminal_states: [RESIGNED]
    transitions:
      - from: INVITED
        to: ACTIVE
        trigger: "POST /committee-members/{memberId}/status-transitions with to_status=ACTIVE"
        actor: Reviewer | ProgramChair | ConferenceAdmin
        preconditions:
          - "at least one ConflictDeclaration exists with member_id == this member (else ERR_COI_NOT_DECLARED)"
        side_effects:
          - "CommitteeMember.coi_declaration_status := SUBMITTED"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /committee-members/{memberId}/status-transitions with to_status=SUSPENDED"
        actor: ConferenceAdmin
        preconditions: []
        side_effects:
          - "CASCADE-C link 1: every Review with reviewer_member_id == this member and status == ASSIGNED := VOIDED"
          - "CASCADE-C link 2 (caused by link 1): CommitteeMember.current_review_load recomputed (drops to 0)"
          - "CASCADE-C link 3 (caused by link 1 leaving each abstract short of reviewers): for every abstract that lost an ASSIGNED review while its status == UNDER_REVIEW, a replacement Review is created by the reviewer selector excluding the suspended member; when the candidate pool is empty no replacement is created and the abstract stays UNDER_REVIEW"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /committee-members/{memberId}/status-transitions with to_status=ACTIVE"
        actor: ConferenceAdmin
        preconditions: []
        side_effects: []
      - from: INVITED | ACTIVE | SUSPENDED
        to: RESIGNED
        trigger: "POST /committee-members/{memberId}/status-transitions with to_status=RESIGNED"
        actor: Reviewer | ProgramChair | ConferenceAdmin
        preconditions:
          - "no Session with chair_member_id == this member has status IN {PLANNED, PUBLISHED, LOCKED} (else ERR_MEMBER_STILL_CHAIRING)"
        side_effects:
          - "every Review with reviewer_member_id == this member and status == ASSIGNED := VOIDED; current_review_load recomputed to 0 (no replacement assignment is created)"

  - entity: Review
    dimension: status
    initial_state: ASSIGNED
    terminal_states: [SUBMITTED, DECLINED, VOIDED]
    transitions:
      - from: "(create)"
        to: ASSIGNED
        trigger: "POST /abstracts/{abstractId}/review-assignments (explicit reviewer_member_id or selector-chosen), or system during CASCADE-C / a THIRD_REVIEW resolution"
        actor: ProgramChair | system
        preconditions:
          - "Conference.status == REVIEW_OPEN"
          - "Abstract.status IN {SUBMITTED, UNDER_REVIEW}"
          - "reviewer CommitteeMember.status == ACTIVE, conference_id matches and coi_declaration_status == SUBMITTED (else ERR_MEMBER_STATE_INVALID)"
          - "reviewer CommitteeMember.member_role IN {REVIEWER, CHAIR} when reviewer_member_id is supplied explicitly - a chair may also carry review load, which is exactly what later makes the segregation-of-duties check at validation priority 11 reachable; the selector of reviewer_selection_by_expertise considers only member_role == REVIEWER"
          - "no ConflictDeclaration of the reviewer matches the abstract's author set (else ERR_REVIEWER_CONFLICT)"
          - "reviewer email NOT IN {submitting author's email} UNION Abstract.coauthor_emails (else ERR_REVIEWER_CONFLICT)"
          - "no Review for this abstract with the same reviewer_member_id has status IN {ASSIGNED, SUBMITTED} (else ERR_DUPLICATE_REVIEW_ASSIGNMENT)"
          - "reviewer.current_review_load < reviewer.max_review_load (else ERR_REVIEWER_LOAD_EXCEEDED)"
        side_effects:
          - "CommitteeMember.current_review_load += 1"
          - "Review.expertise_match_score := expertise_match_score(reviewer, abstract)"
          - "Review.due_utc := body due_utc when supplied, otherwise Conference.review_deadline_utc"
          - "Abstract SUBMITTED -> UNDER_REVIEW when this is the first non-terminal Review of the current round"
      - from: ASSIGNED
        to: SUBMITTED
        trigger: "POST /reviews/{reviewId}/submission"
        actor: Reviewer
        preconditions:
          - "acting CommitteeMember.id == Review.reviewer_member_id (else ERR_NOT_RESOURCE_OWNER)"
          - "Conference.status == REVIEW_OPEN"
          - "Review.assigned_round == Abstract.revision_round (else ERR_REVIEW_STATE_INVALID)"
          - "logical clock <= Review.due_utc (else ERR_REVIEW_PAST_DUE)"
          - "all four rubric scores present and in 1..5, confidence and recommended_format present"
        side_effects:
          - "Review.weighted_score := review_weighted_score(...); Review.submitted_at := logical clock"
          - "CommitteeMember.current_review_load -= 1"
          - "Abstract.submitted_review_count += 1; Abstract.provisional_score and Abstract.score_spread recomputed"
          - "Abstract UNDER_REVIEW -> SCORED when submitted_review_count >= category.min_reviews_required"
          - "a DiscrepancyCase (status OPEN, spread_at_open := Abstract.score_spread) is created when Abstract.score_spread >= category.discrepancy_threshold and no non-terminal case exists for the abstract"
          - "when Review.is_third_review == true, its DiscrepancyCase leaves THIRD_REVIEW_PENDING for RESOLVED or ESCALATED"
      - from: ASSIGNED
        to: DECLINED
        trigger: "POST /reviews/{reviewId}/decline"
        actor: Reviewer
        preconditions:
          - "acting CommitteeMember.id == Review.reviewer_member_id"
          - "Conference.status == REVIEW_OPEN"
          - "decline_reason present"
        side_effects:
          - "CommitteeMember.current_review_load -= 1"
          - "when auto_reassign is true (default): a replacement Review is created by the reviewer selector with exclude set {this reviewer_member_id}; when the candidate pool is empty no replacement is created and the call still succeeds"
      - from: ASSIGNED
        to: VOIDED
        trigger: "system, on CommitteeMember suspension/resignation, on Abstract SCORED -> REVISION_REQUESTED, or on Conference REVIEW_OPEN -> REVIEW_CLOSED"
        actor: system
        preconditions: []
        side_effects:
          - "CommitteeMember.current_review_load -= 1"

  - entity: DiscrepancyCase
    dimension: status
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: "(create)"
        to: OPEN
        trigger: "system, on POST /reviews/{reviewId}/submission when Abstract.score_spread >= category.discrepancy_threshold"
        actor: system
        preconditions:
          - "no DiscrepancyCase for this abstract already has status IN {OPEN, ARBITER_ASSIGNED, THIRD_REVIEW_PENDING, ESCALATED}"
        side_effects:
          - "DiscrepancyCase.spread_at_open := Abstract.score_spread at this instant"
      - from: OPEN
        to: ARBITER_ASSIGNED
        trigger: "POST /discrepancy-cases/{caseId}/arbiter"
        actor: ProgramChair
        preconditions:
          - "arbiter CommitteeMember.member_role == CHAIR, status == ACTIVE, conference_id == the abstract's conference_id"
          - "arbiter has no Review on the abstract with status == SUBMITTED (else ERR_ARBITER_CONFLICT)"
          - "no ConflictDeclaration of the arbiter matches the abstract's author set (else ERR_ARBITER_CONFLICT)"
        side_effects:
          - "DiscrepancyCase.arbiter_member_id := body arbiter_member_id"
      - from: ARBITER_ASSIGNED
        to: RESOLVED
        trigger: "POST /discrepancy-cases/{caseId}/resolution with resolution_method=CHAIR_OVERRIDE"
        actor: ProgramChair
        preconditions:
          - "acting CommitteeMember.id == DiscrepancyCase.arbiter_member_id"
          - "DiscrepancyCase.spread_at_open < 2 * category.discrepancy_threshold (else ERR_OVERRIDE_NOT_PERMITTED)"
          - "override_score present and in 1.00..5.50"
        side_effects:
          - "DiscrepancyCase.resolution_method := CHAIR_OVERRIDE; resolved_score := override_score"
          - "Abstract.final_score := override_score (the final consensus variant is superseded by the override)"
          - "Abstract UNDER_REVIEW -> SCORED when submitted_review_count >= category.min_reviews_required"
        note: "Fork branch A of the ARBITER_ASSIGNED fork; disjoint side-effect set from branch B."
      - from: ARBITER_ASSIGNED
        to: THIRD_REVIEW_PENDING
        trigger: "POST /discrepancy-cases/{caseId}/resolution with resolution_method=THIRD_REVIEW"
        actor: ProgramChair
        preconditions:
          - "acting CommitteeMember.id == DiscrepancyCase.arbiter_member_id"
          - "the reviewer selector finds at least one eligible candidate excluding every existing reviewer of the abstract and the arbiter (else ERR_NO_ELIGIBLE_REVIEWER)"
        side_effects:
          - "DiscrepancyCase.resolution_method := THIRD_REVIEW"
          - "a Review is created with status ASSIGNED, is_third_review := true, selected by expertise_match_score ranking; the selected reviewer's current_review_load += 1"
          - "DiscrepancyCase.third_review_id := the created Review.id"
        note: "Fork branch B of the ARBITER_ASSIGNED fork; both branches rejoin at RESOLVED."
      - from: THIRD_REVIEW_PENDING
        to: RESOLVED
        trigger: "system, on POST /reviews/{reviewId}/submission for the third review when the recomputed Abstract.score_spread < category.discrepancy_threshold"
        actor: system
        preconditions:
          - "Review.is_third_review == true and Review.id == DiscrepancyCase.third_review_id"
          - "recomputed Abstract.score_spread < category.discrepancy_threshold"
        side_effects:
          - "DiscrepancyCase.resolved_score := abstract_consensus_score(variant=final) over the round's SUBMITTED reviews"
          - "Abstract.final_score := DiscrepancyCase.resolved_score"
        note: "Join point of the fork."
      - from: THIRD_REVIEW_PENDING
        to: ESCALATED
        trigger: "system, on POST /reviews/{reviewId}/submission for the third review when the recomputed Abstract.score_spread >= category.discrepancy_threshold"
        actor: system
        preconditions:
          - "Review.is_third_review == true and Review.id == DiscrepancyCase.third_review_id"
          - "recomputed Abstract.score_spread >= category.discrepancy_threshold"
        side_effects:
          - "DiscrepancyCase.resolved_score stays null; Abstract.final_score stays null"
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /discrepancy-cases/{caseId}/resolution with resolution_method=CHAIR_OVERRIDE"
        actor: ProgramChair
        preconditions:
          - "acting CommitteeMember.id == DiscrepancyCase.arbiter_member_id"
          - "override_score present and in 1.00..5.50"
        side_effects:
          - "DiscrepancyCase.resolution_method := CHAIR_OVERRIDE; resolved_score := override_score; Abstract.final_score := override_score"
        note: "From ESCALATED the spread ceiling of ERR_OVERRIDE_NOT_PERMITTED no longer applies — the panel override is the only exit."

  - entity: Session
    dimension: status
    initial_state: PLANNED
    terminal_states: [LOCKED, CANCELLED]
    transitions:
      - from: "(create)"
        to: PLANNED
        trigger: "POST /sessions"
        actor: ProgramChair
        preconditions:
          - "Conference.status IN {REVIEW_CLOSED, DECISIONS_RELEASED}"
          - "chair CommitteeMember.member_role == CHAIR, status == ACTIVE, conference_id matches"
          - "start_utc >= Conference.event_start_utc and end_utc <= Conference.event_end_utc and end_utc > start_utc"
          - "no room conflict per session_room_overlap (else ERR_ROOM_TIME_CONFLICT)"
          - "no chair conflict per session_chair_overlap (else ERR_CHAIR_TIME_CONFLICT)"
        side_effects:
          - "CommitteeMember.chaired_session_count += 1 for chair_member_id"
      - from: PLANNED
        to: PUBLISHED
        trigger: "POST /sessions/{sessionId}/status-transitions with to_status=PUBLISHED"
        actor: ProgramChair
        preconditions:
          - "Conference.status == DECISIONS_RELEASED"
          - "Session.slot_count >= 1 (else ERR_EMPTY_SESSION)"
          - "every counted SessionSlot's Abstract.status == SCHEDULED"
          - "Session.accreditation_posture != NON_COMPLIANT (else ERR_SESSION_NOT_ACCREDITED)"
        side_effects:
          - "Session.version += 1"
      - from: PUBLISHED
        to: PLANNED
        trigger: "POST /sessions/{sessionId}/status-transitions with to_status=PLANNED (manual unpublish), or system on CASCADE-A link 4 / CASCADE-B link 3"
        actor: ProgramChair | system
        preconditions:
          - "for the manual trigger: logical clock < Conference.program_freeze_utc (else ERR_PROGRAM_FROZEN)"
        side_effects:
          - "Session.version += 1"
        note: "Cycle back-edge on Session."
      - from: PUBLISHED
        to: LOCKED
        trigger: "system, on Conference DECISIONS_RELEASED -> PROGRAM_PUBLISHED"
        actor: system
        preconditions: []
        side_effects:
          - "Session.version += 1"
      - from: PLANNED | PUBLISHED
        to: CANCELLED
        trigger: "POST /sessions/{sessionId}/status-transitions with to_status=CANCELLED"
        actor: ProgramChair
        preconditions:
          - "logical clock < Conference.program_freeze_utc (else ERR_PROGRAM_FROZEN)"
        side_effects:
          - "every SessionSlot of this session with status == SCHEDULED := WITHDRAWN"
          - "each affected Abstract SCHEDULED -> CONFIRMED (the acceptance and its committed format slot are retained)"
          - "CommitteeMember.chaired_session_count -= 1 for chair_member_id"
          - "Session.slot_count := 0, committed_minutes := 0, accredited_credit_total := 0.00"

  - entity: SessionSlot
    dimension: status
    initial_state: SCHEDULED
    terminal_states: [PRESENTED, NO_SHOW_RECORDED, WITHDRAWN, MOVED]
    transitions:
      - from: "(create)"
        to: SCHEDULED
        trigger: "POST /sessions/{sessionId}/slots"
        actor: ProgramChair
        preconditions:
          - "Session.status == PLANNED (else ERR_SESSION_STATE_INVALID)"
          - "expected_session_version == Session.version (else ERR_STALE_SESSION_VERSION)"
          - "logical clock < Conference.program_freeze_utc (else ERR_PROGRAM_FROZEN)"
          - "Abstract.status == CONFIRMED (else ERR_ABSTRACT_STATE_INVALID)"
          - "Abstract.decision == Session.format (else ERR_SESSION_FORMAT_MISMATCH)"
          - "Session.theme_code IS IN Abstract.keywords (else ERR_SESSION_THEME_MISMATCH)"
          - "presenter_author_id is Abstract.submitting_author_id or an Author whose email IS IN Abstract.coauthor_emails (else ERR_PRESENTER_NOT_ON_ABSTRACT)"
          - "the presenter has no SCHEDULED SessionSlot in another Session whose window overlaps this session's window per session_presenter_overlap (else ERR_PRESENTER_TIME_CONFLICT)"
          - "Session.slot_count < Session.capacity_slots (else ERR_SESSION_SLOT_CAPACITY_REACHED)"
          - "position is not used by another counted slot of this session"
          - "session_packing admits the new duration (else ERR_SESSION_DURATION_EXCEEDED)"
        side_effects:
          - "Abstract CONFIRMED -> SCHEDULED"
          - "Session.slot_count += 1; committed_minutes, accredited_credit_total and accreditation_posture recomputed; Session.version += 1"
      - from: SCHEDULED
        to: PRESENTED
        trigger: "POST /session-slots/{slotId}/status-transitions with to_status=PRESENTED"
        actor: ProgramChair | ConferenceAdmin
        preconditions:
          - "Session.status IN {PUBLISHED, LOCKED}"
          - "logical clock >= Session.start_utc"
        side_effects:
          - "Abstract SCHEDULED -> PRESENTED"
      - from: SCHEDULED
        to: NO_SHOW_RECORDED
        trigger: "POST /session-slots/{slotId}/status-transitions with to_status=NO_SHOW_RECORDED"
        actor: ProgramChair | ConferenceAdmin
        preconditions:
          - "Session.status IN {PUBLISHED, LOCKED}"
          - "logical clock >= Session.end_utc"
        side_effects:
          - "CASCADE-D link 1: SessionSlot.status := NO_SHOW_RECORDED"
          - "CASCADE-D link 2 (caused by link 1): Abstract SCHEDULED -> NO_SHOW and Author.no_show_strikes recomputed for presenter_author_id"
          - "CASCADE-D link 3 (caused by link 2): Author.sanction_status re-derived — WARNED at a combined strike count of 1, BARRED at 2 or more"
      - from: SCHEDULED
        to: WITHDRAWN
        trigger: "system, on Abstract -> WITHDRAWN (CASCADE-B), Session -> CANCELLED, or an APPLIED WITHDRAW ProgramChangeRequest"
        actor: system
        preconditions: []
        side_effects:
          - "Session.slot_count -= 1; committed_minutes, accredited_credit_total and accreditation_posture recomputed; Session.version += 1"
      - from: SCHEDULED
        to: MOVED
        trigger: "system, on an APPLIED MOVE ProgramChangeRequest that relocates the slot"
        actor: system
        preconditions: []
        side_effects:
          - "a replacement SessionSlot with status SCHEDULED is created in target_session_id carrying the same abstract_id, presenter_author_id and duration_minutes, with position := target Session.slot_count + 1"
          - "both Sessions' slot_count, committed_minutes, accredited_credit_total and accreditation_posture recomputed; both Session.version += 1"

  - entity: CmeAccreditation
    dimension: validation_status
    initial_state: PENDING
    terminal_states: [REJECTED, REVOKED]
    transitions:
      - from: "(create)"
        to: PENDING
        trigger: "POST /accreditations"
        actor: ConferenceAdmin | ProgramChair
        preconditions:
          - "the abstract's SubmissionCategory.cme_eligible == true (else ERR_CATEGORY_NOT_CME_ELIGIBLE)"
          - "Abstract.status IN {ACCEPTED, CONFIRMED, SCHEDULED}"
          - "no other CmeAccreditation for this abstract has validation_status IN {PENDING, VALIDATED}"
        side_effects: []
      - from: PENDING
        to: VALIDATED
        trigger: "POST /accreditations/{accreditationId}/validation with action=VALIDATE"
        actor: ProgramChair
        preconditions:
          - "acting CommitteeMember.id != Abstract.decided_by_member_id (else ERR_ACCREDITATION_SELF_VALIDATION)"
          - "at least one DisclosureStatement exists for this accreditation and every one of them has status == VALIDATED (else ERR_DISCLOSURE_INCOMPLETE)"
          - "CmeAccreditation.commercial_bias_flag == false (else ERR_DISCLOSURE_INCOMPLETE)"
          - "content_minutes <= Conference.cme_minutes_available (else ERR_CME_POOL_EXHAUSTED)"
        side_effects:
          - "CmeAccreditation.awarded_credits := cme_credit_award(content_minutes); validated_by_member_id and validated_at set"
          - "Conference.cme_minutes_allocated += content_minutes; cme_minutes_available recomputed; Conference.version += 1"
          - "the Session holding a counted SessionSlot for this abstract has accredited_credit_total and accreditation_posture recomputed; Session.version += 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /accreditations/{accreditationId}/validation with action=REJECT"
        actor: ProgramChair
        preconditions:
          - "rejection_reason present"
        side_effects:
          - "CmeAccreditation.awarded_credits := 0.00"
      - from: VALIDATED
        to: REVOKED
        trigger: "POST /accreditations/{accreditationId}/validation with action=REVOKE, or system on CASCADE-A link 2"
        actor: ProgramChair | system
        preconditions: []
        side_effects:
          - "CmeAccreditation.awarded_credits := 0.00"
          - "Conference.cme_minutes_allocated -= content_minutes; cme_minutes_available recomputed; Conference.version += 1"
          - "the Session holding a counted SessionSlot for this abstract has accredited_credit_total and accreditation_posture recomputed; Session.version += 1"
          - "when that Session.cme_designated == true and its recomputed accreditation_posture == NON_COMPLIANT and its status == PUBLISHED: Session PUBLISHED -> PLANNED"
        note: "Compensating action for PENDING -> VALIDATED; the CME-minute conservation invariant must hold exactly afterwards."

  - entity: DisclosureStatement
    dimension: status
    initial_state: SUBMITTED
    terminal_states: [REJECTED]
    transitions:
      - from: "(create)"
        to: SUBMITTED
        trigger: "POST /disclosure-statements"
        actor: Author
        preconditions:
          - "CmeAccreditation.validation_status == PENDING"
          - "CmeAccreditation.abstract_id == body abstract_id (else ERR_DISCLOSURE_ABSTRACT_MISMATCH)"
          - "author_id is Abstract.submitting_author_id or an Author whose email IS IN Abstract.coauthor_emails"
          - "relationship_entity present when has_financial_relationship == true"
        side_effects:
          - "DisclosureStatement.mitigation_required := has_financial_relationship"
          - "CmeAccreditation.commercial_bias_flag recomputed"
      - from: SUBMITTED
        to: VALIDATED
        trigger: "POST /disclosure-statements/{disclosureId}/adjudication with outcome=VALIDATED"
        actor: ProgramChair
        preconditions:
          - "mitigation_required == false, or mitigation_completed == true (else ERR_DISCLOSURE_INCOMPLETE)"
        side_effects:
          - "CmeAccreditation.commercial_bias_flag recomputed"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /disclosure-statements/{disclosureId}/adjudication with outcome=REJECTED"
        actor: ProgramChair
        preconditions:
          - "rejection_reason present"
        side_effects:
          - "CmeAccreditation.commercial_bias_flag recomputed"
      - from: VALIDATED
        to: REJECTED
        trigger: "POST /disclosure-statements/{disclosureId}/adjudication with outcome=REJECTED (post-hoc disclosure failure)"
        actor: ProgramChair
        preconditions:
          - "rejection_reason present"
        side_effects:
          - "CASCADE-A link 1: DisclosureStatement.status := REJECTED"
          - "CASCADE-A link 2 (caused by link 1): the linked CmeAccreditation with validation_status == VALIDATED := REVOKED and awarded_credits := 0.00"
          - "CASCADE-A link 3 (caused by link 2): Conference.cme_minutes_allocated -= accreditation.content_minutes, cme_minutes_available recomputed, Conference.version += 1; and the Session holding a counted slot for the abstract recomputes accredited_credit_total and accreditation_posture"
          - "CASCADE-A link 4 (caused by link 3's posture flip): that Session, when cme_designated == true, accreditation_posture == NON_COMPLIANT and status == PUBLISHED, transitions PUBLISHED -> PLANNED and Session.version += 1"

  - entity: ProgramChangeRequest
    dimension: status
    initial_state: PENDING
    terminal_states: [APPLIED, REJECTED]
    transitions:
      - from: "(create)"
        to: PENDING
        trigger: "POST /program-change-requests"
        actor: Author | ProgramChair
        preconditions:
          - "Conference.status IN {DECISIONS_RELEASED, PROGRAM_PUBLISHED}"
          - "SessionSlot.status == SCHEDULED"
          - "logical clock < Conference.event_end_utc"
          - "the caller is a ProgramChair of the conference, or an Author who is the slot's presenter_author_id or the abstract's submitting_author_id (else ERR_NOT_RESOURCE_OWNER)"
          - "change_type IN {MOVE, SWAP} requires target_session_id; SUBSTITUTE_PRESENTER requires substitute_presenter_author_id whose email IS IN Abstract.coauthor_emails"
          - "no other ProgramChangeRequest for this session_slot_id has status == PENDING"
        side_effects:
          - "ProgramChangeRequest.submitted_at := logical clock; days_to_event computed"
          - "ProgramChangeRequest.estimated_fee_cents := program_change_fee(variant=pre_freeze_estimate)"
      - from: PENDING
        to: APPLIED
        trigger: "POST /program-change-requests/{requestId}/adjudication with outcome=APPROVED"
        actor: ProgramChair
        preconditions:
          - "SessionSlot.status is still SCHEDULED"
          - "for MOVE and SWAP: the target Session.format == the slot's Abstract.decision, target Session.theme_code IS IN that abstract's keywords, and target Session.slot_count < target Session.capacity_slots"
        side_effects:
          - "ProgramChangeRequest.final_fee_cents := program_change_fee(variant=post_freeze_final); rush_pct_applied recorded; approver_member_id := acting CommitteeMember.id"
          - "MOVE: the slot SCHEDULED -> MOVED and a replacement SCHEDULED slot is created in the target session"
          - "SWAP: the referenced slot and the target session's slot at the lowest position exchange session_id and position, and both rows get swapped_with_slot_id set to each other"
          - "SUBSTITUTE_PRESENTER: SessionSlot.presenter_author_id := substitute_presenter_author_id"
          - "WITHDRAW: the slot SCHEDULED -> WITHDRAWN and its Abstract transitions to WITHDRAWN with CASCADE-B"
      - from: PENDING
        to: REJECTED
        trigger: "POST /program-change-requests/{requestId}/adjudication with outcome=REJECTED"
        actor: ProgramChair
        preconditions: []
        side_effects:
          - "ProgramChangeRequest.final_fee_cents := 0; approver_member_id := acting CommitteeMember.id"

  - entity: Author
    dimension: sanction_status
    initial_state: NONE
    terminal_states: [BARRED]
    transitions:
      - from: NONE
        to: WARNED
        trigger: "system, on SessionSlot -> NO_SHOW_RECORDED (CASCADE-D) or Abstract embargo_status -> BREACHED (CASCADE-E) when no_show_strikes + embargo_breach_count == 1"
        actor: system
        preconditions:
          - "no_show_strikes + embargo_breach_count == 1"
        side_effects: []
      - from: WARNED
        to: BARRED
        trigger: "system, on a further no-show or embargo breach when no_show_strikes + embargo_breach_count >= 2"
        actor: system
        preconditions:
          - "no_show_strikes + embargo_breach_count >= 2"
        side_effects:
          - "every later Abstract ACCEPTED -> CONFIRMED by this author is rejected with ERR_AUTHOR_BARRED, and POST /abstracts by this author is rejected with ERR_AUTHOR_BARRED"
      - from: NONE
        to: BARRED
        trigger: "system, when a single cascade raises no_show_strikes + embargo_breach_count from 0 to 2 or more"
        actor: system
        preconditions:
          - "no_show_strikes + embargo_breach_count >= 2"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: decision-commit-stale-conference
    parent_entity: Conference
    write_endpoint: "POST /abstracts/{abstractId}/decision"
    occ_field: "expected_conference_version"
    description: |
      Issuing an acceptance decision against a Conference whose version has
      advanced since the chair last read it is rejected. A decision commits a
      format slot out of the conference-level capacity ledger, so a chair whose
      view of accepted_oral_count / accepted_poster_count is stale would commit
      against capacity that another decision already consumed; the natural
      product semantics would let that second decision succeed, so the stale
      version check is what makes the outcome deterministic.
    error_id: ERR_STALE_CONFERENCE_VERSION
    http_status: 412
  - rule_id: slot-create-stale-session
    parent_entity: Session
    write_endpoint: "POST /sessions/{sessionId}/slots"
    occ_field: "expected_session_version"
    description: |
      Adding a SessionSlot to a Session whose version has advanced since the
      chair last read it is rejected. Slot creation is validated against
      Session.slot_count and Session.committed_minutes, both of which any earlier
      slot creation, withdrawal or accreditation recompute has already changed,
      so a stale view would pack the session past its window.
    error_id: ERR_STALE_SESSION_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: review_weighted_score
    description: |
      Rubric roll-up for a single Review. The four rubric axes carry fixed
      weights and the reviewer's personal calibration_bias is added afterwards,
      then the result is clamped into the legal score band.
    trigger: "on POST /reviews/{reviewId}/submission, before Abstract.provisional_score / score_spread are recomputed"
    inputs:
      - Review.score_originality
      - Review.score_methodology
      - Review.score_clarity
      - Review.score_relevance
      - CommitteeMember.calibration_bias (of Review.reviewer_member_id)
    algorithm: weighted_scoring
    formula: |
      raw = 0.40 * score_originality
          + 0.30 * score_methodology
          + 0.15 * score_clarity
          + 0.15 * score_relevance
      biased = raw + calibration_bias
      weighted_score = clamp(round_half_up(biased, 2), SCORE_FLOOR, SCORE_CEILING)
      # Worked example: 5,4,3,3 with calibration_bias 0.00
      #   raw = 2.00 + 1.20 + 0.45 + 0.45 = 4.10  -> weighted_score = 4.10
      # Worked example: 5,4,3,3 with calibration_bias -0.35
      #   biased = 3.75 -> weighted_score = 3.75
    constants:
      WEIGHT_ORIGINALITY: 0.40
      WEIGHT_METHODOLOGY: 0.30
      WEIGHT_CLARITY: 0.15
      WEIGHT_RELEVANCE: 0.15
      SCORE_FLOOR: 1.00
      SCORE_CEILING: 5.50
    precision: "2 decimal places, round_half_up"

  - name: abstract_consensus_score
    description: |
      Consensus score across the reviews of the abstract's CURRENT revision
      round. Two variants coexist for the whole review window: the provisional
      variant is an unweighted mean shown to chairs while reviews arrive, the
      final variant is a confidence-weighted mean and is the only score that may
      drive a decision. Both read exactly the same input set.
    trigger: |
      provisional: on every POST /reviews/{reviewId}/submission (writes Abstract.provisional_score).
      final: on Conference REVIEW_OPEN -> REVIEW_CLOSED, and on DiscrepancyCase
      THIRD_REVIEW_PENDING -> RESOLVED (writes Abstract.final_score).
    inputs:
      - "Review rows with abstract_id == Abstract.id AND status == SUBMITTED AND assigned_round == Abstract.revision_round"
      - Review.weighted_score
      - Review.confidence
    algorithm: weighted_scoring
    formula: |
      S = { r in Review : r.abstract_id == A.id
                          and r.status == SUBMITTED
                          and r.assigned_round == A.revision_round }
      if S is empty: both variants are null

      # variant `provisional`
      provisional_score = round_half_up( sum(r.weighted_score for r in S) / |S| , 2 )

      # variant `final`
      w(r) = CONFIDENCE_WEIGHT[r.confidence]
      final_score = round_half_up( sum(w(r) * r.weighted_score for r in S)
                                   / sum(w(r) for r in S) , 2 )

      # Worked divergence example, |S| = 3:
      #   (4.20, HIGH), (3.00, LOW), (2.40, MEDIUM)
      #   provisional = (4.20 + 3.00 + 2.40) / 3 = 9.60 / 3      = 3.20
      #   final       = (3*4.20 + 1*3.00 + 2*2.40) / (3 + 1 + 2)
      #               = (12.60 + 3.00 + 4.80) / 6 = 20.40 / 6    = 3.40
    constants:
      CONFIDENCE_WEIGHT: { LOW: 1, MEDIUM: 2, HIGH: 3 }
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "written to Abstract.provisional_score on every review submission; the only score visible before review close"
        difference: "unweighted arithmetic mean over the SAME input set; Review.confidence is ignored entirely"
      - name: final
        when: "written to Abstract.final_score at REVIEW_OPEN -> REVIEW_CLOSED and at discrepancy resolution; the score that gates decisions and waitlist promotion"
        difference: "confidence-weighted mean using CONFIDENCE_WEIGHT; a HIGH-confidence review counts three times as much as a LOW-confidence one"

  - name: abstract_score_spread
    description: |
      Disagreement measure that decides whether a DiscrepancyCase is opened.
      Reads the same round-filtered input set as abstract_consensus_score.
    trigger: "on every POST /reviews/{reviewId}/submission, immediately after the consensus recompute"
    inputs:
      - "the round-filtered SUBMITTED Review set S of the abstract"
      - Review.weighted_score
      - SubmissionCategory.discrepancy_threshold
    algorithm: threshold
    formula: |
      if |S| < 2:
        score_spread = null and no DiscrepancyCase is opened
      elif |S| == 2:
        score_spread = round_half_up( abs(S[0].weighted_score - S[1].weighted_score), 2 )
      else:                      # |S| >= 3: the spread that survives discarding ONE outlier
        score_spread = round_half_up(
          min over r in S of ( max(x.weighted_score for x in S \ {r})
                             - min(x.weighted_score for x in S \ {r}) ), 2 )
      opens_case = score_spread >= SubmissionCategory.discrepancy_threshold
      # Boundary: with discrepancy_threshold 1.50, a spread of exactly 1.50 opens
      # a case; 1.49 does not.
      # Why the trim-one branch: a DiscrepancyCase means "at least TWO reviewers
      # disagree materially", not "one reviewer is an outlier". It is also what
      # makes DiscrepancyCase THIRD_REVIEW_PENDING -> RESOLVED reachable: with
      # S = {4.25, 2.60} the spread is 1.65 (case opens at threshold 1.50); after
      # a third review of 3.30 the trim-one value is min(0.70, 0.95, 1.65) = 0.70,
      # which clears the threshold and joins to RESOLVED. A third review of 1.00
      # instead yields min(1.60, 3.25, 1.65) = 1.60, which still exceeds the
      # threshold and joins to ESCALATED.
    constants:
      MIN_REVIEWS_FOR_SPREAD: 2
      OUTLIER_TRIM_COUNT: 1
    precision: "2 decimal places, round_half_up"

  - name: reviewer_selection_by_expertise
    description: |
      Blinded reviewer selector. Scores every committee member against the
      abstract's keyword set with the Dice coefficient, filters out the
      ineligible, ranks the survivors and picks exactly one.
    trigger: |
      POST /abstracts/{abstractId}/review-assignments when reviewer_member_id is
      omitted; the auto_reassign replacement on POST /reviews/{reviewId}/decline;
      CASCADE-C replacement on CommitteeMember ACTIVE -> SUSPENDED; and the
      THIRD_REVIEW branch of POST /discrepancy-cases/{caseId}/resolution.
    inputs:
      - CommitteeMember.expertise_keywords
      - Abstract.keywords
      - CommitteeMember.status
      - CommitteeMember.member_role
      - CommitteeMember.coi_declaration_status
      - CommitteeMember.current_review_load
      - CommitteeMember.max_review_load
      - CommitteeMember.created_at
      - "ConflictDeclaration rows of the candidate"
      - "Abstract.submitting_author_id + Abstract.coauthor_emails (the author set)"
      - "existing Review rows of the abstract"
      - "explicit exclude set (declining reviewer, suspended member, arbiter)"
    algorithm: selector_policy
    formula: |
      # 1. expertise_match_score — Dice coefficient over case-insensitive,
      #    de-duplicated keyword sets
      A = distinct(lowercase(candidate.expertise_keywords))
      K = distinct(lowercase(abstract.keywords))
      expertise_match_score = round_half_up( 2 * |A intersect K| / (|A| + |K|), 4 )
      # Example: A = {oncology, immunotherapy, biostatistics, trials} (4),
      #          K = {oncology, immunotherapy, imaging} (3), |A n K| = 2
      #          -> 2*2 / 7 = 0.5714

      # 2. eligibility filter (ALL must hold)
      candidate.conference_id == abstract.conference_id
      candidate.member_role == REVIEWER
      candidate.status == ACTIVE
      candidate.coi_declaration_status == SUBMITTED
      candidate.current_review_load < candidate.max_review_load
      no ConflictDeclaration of the candidate matches the abstract's author set
      candidate.email NOT IN author set
      no Review of this abstract with reviewer_member_id == candidate.id has
        status IN {ASSIGNED, SUBMITTED}
      candidate.id NOT IN exclude set
      expertise_match_score >= MIN_MATCH_SCORE

      # 3. ranking (lexicographic, deterministic)
      ORDER BY expertise_match_score DESC,
               (max_review_load - current_review_load) DESC,   # spare capacity
               created_at ASC                                  # never id
      -> take the first row

      # 4. empty pool
      explicit assignment / THIRD_REVIEW resolution -> ERR_NO_ELIGIBLE_REVIEWER (422),
        the whole request fails and nothing is written
      decline auto_reassign / CASCADE-C -> no replacement Review is created and
        the triggering request still succeeds
    constants:
      MIN_MATCH_SCORE: 0.2500
    precision: "expertise_match_score: 4 decimal places, round_half_up"

  - name: format_capacity_waterfall
    description: |
      Allocates a conference format slot to an accepted abstract. ORAL demand
      spills into POSTER before it spills onto the waitlist; WORKSHOP demand
      never spills. Also defines the promotion order when a slot is released.
    trigger: "POST /abstracts/{abstractId}/decision; and every capacity release (decision rescission, abstract withdrawal)"
    inputs:
      - Conference.oral_slot_capacity
      - Conference.poster_slot_capacity
      - Conference.workshop_slot_capacity
      - Conference.accepted_oral_count
      - Conference.accepted_poster_count
      - Conference.accepted_workshop_count
      - "request decision and allow_format_downgrade"
      - SubmissionCategory.allowed_formats
      - "Abstract.final_score / Abstract.provisional_score / Abstract.created_at (promotion ranking)"
    algorithm: waterfall_allocation
    formula: |
      remaining(f) = Conference.<f>_slot_capacity - Conference.accepted_<f>_count

      # --- commit path -------------------------------------------------------
      if decision == WORKSHOP:
          remaining(WORKSHOP) >= 1 -> commit WORKSHOP
          else                     -> ERR_FORMAT_CAPACITY_EXHAUSTED (422)
          # workshops are never downgraded, allow_format_downgrade is ignored

      if decision == ORAL:
          remaining(ORAL) >= 1 -> commit ORAL
          elif allow_format_downgrade == false -> ERR_FORMAT_CAPACITY_EXHAUSTED (422)
          elif POSTER IN category.allowed_formats and remaining(POSTER) >= 1
                                -> commit POSTER, decision_downgraded := true
          else                  -> WAITLISTED

      if decision == POSTER:
          remaining(POSTER) >= 1 -> commit POSTER
          elif allow_format_downgrade == false -> ERR_FORMAT_CAPACITY_EXHAUSTED (422)
          else                   -> WAITLISTED

      # --- release / promotion path -----------------------------------------
      # when one slot of format f is released, exactly one abstract is promoted:
      eligible = { A : A.conference_id == C.id
                       and A.status == WAITLISTED
                       and f IN A.category.allowed_formats }
      ORDER BY coalesce(A.final_score, A.provisional_score) DESC,
               A.created_at ASC                      # never id
      -> promote the first row (WAITLISTED -> ACCEPTED with decision := f)
      # empty eligible set -> the slot simply stays free, no error
    constants:
      WATERFALL_ORDER: [ORAL, POSTER]
      WORKSHOP_DOWNGRADABLE: false
    precision: "integer slot counts; scores compared at 2 decimal places"

  - name: cme_credit_award
    description: |
      Converts accreditable content minutes into AMA-style quarter credits. The
      two variants differ ONLY in where the floor is applied — per abstract
      before summing, or once over the summed minutes.
    trigger: |
      per_abstract_award: on CmeAccreditation PENDING -> VALIDATED (writes
      CmeAccreditation.awarded_credits) and on every Session.accredited_credit_total
      recompute. session_bundle_estimate: on GET /conferences/{conferenceId}/capacity-summary
      (writes the response's cme_bundle_credits field).
    inputs:
      - CmeAccreditation.content_minutes
      - "the VALIDATED accreditation set of the conference / of the session's counted slots"
    algorithm: aggregation
    formula: |
      # variant `per_abstract_award`
      award(x) = floor(x.content_minutes / MINUTES_PER_QUARTER_CREDIT) * CREDIT_STEP
      total_per_abstract = sum(award(x) for x in VALIDATED set)

      # variant `session_bundle_estimate`
      total_bundle = floor( sum(x.content_minutes for x in VALIDATED set)
                            / MINUTES_PER_QUARTER_CREDIT ) * CREDIT_STEP

      # Worked divergence example, content_minutes = 20, 25, 40:
      #   per_abstract: floor(20/15)=1 -> 0.25
      #                 floor(25/15)=1 -> 0.25
      #                 floor(40/15)=2 -> 0.50   sum = 1.00
      #   bundle:       floor(85/15)=5 -> 1.25
    constants:
      MINUTES_PER_QUARTER_CREDIT: 15
      CREDIT_STEP: 0.25
    precision: "2 decimal places, round_half_up (values are exact multiples of 0.25)"
    variants:
      - name: per_abstract_award
        when: "the credits actually awarded to an abstract and summed into Session.accredited_credit_total"
        difference: "floor is applied per accreditation FIRST, then the awards are summed — leftover minutes below 15 are lost per abstract"
      - name: session_bundle_estimate
        when: "the conference-level planning figure returned as cme_bundle_credits by GET /conferences/{conferenceId}/capacity-summary"
        difference: "the minutes are summed FIRST and floored ONCE — leftover minutes pool together and can buy extra quarter credits"

  - name: program_change_fee
    description: |
      Administrative fee for a late program change. The estimate quoted at
      submission and the fee actually charged at approval run the same inputs
      through two different constant tables, and only the final variant carries
      the post-freeze surcharge.
    trigger: |
      pre_freeze_estimate: on POST /program-change-requests (writes estimated_fee_cents).
      post_freeze_final: on POST /program-change-requests/{requestId}/adjudication
      with outcome=APPROVED (writes final_fee_cents and rush_pct_applied).
    inputs:
      - ProgramChangeRequest.change_type
      - ProgramChangeRequest.submitted_at
      - ProgramChangeRequest.days_to_event
      - Conference.event_start_utc
      - Conference.program_freeze_utc
    algorithm: tiered_pricing
    formula: |
      days_to_event = floor( (Conference.event_start_utc - submitted_at)
                             / 86400 seconds )        # frozen on the row at creation
      base = BASE_FEE_CENTS[change_type]

      rush_pct_estimate = 0  if days_to_event >= 14
                          10 if 7 <= days_to_event <= 13
                          25 if days_to_event < 7
      rush_pct_final    = 0  if days_to_event >= 14
                          20 if 7 <= days_to_event <= 13
                          50 if days_to_event < 7

      # variant `pre_freeze_estimate`
      estimated_fee_cents = round_half_up( base * (1 + rush_pct_estimate / 100) )

      # variant `post_freeze_final`
      surcharge = POST_FREEZE_SURCHARGE_CENTS
                  if submitted_at >= Conference.program_freeze_utc else 0
      final_fee_cents  = round_half_up( base * (1 + rush_pct_final / 100) ) + surcharge
      rush_pct_applied = rush_pct_final

      # Worked divergence example: change_type = MOVE, days_to_event = 5,
      # submitted_at after program_freeze_utc
      #   estimate = 4000 * 1.25          = 5000
      #   final    = 4000 * 1.50 + 1500   = 7500
    constants:
      BASE_FEE_CENTS: { MOVE: 4000, SWAP: 6000, SUBSTITUTE_PRESENTER: 2500, WITHDRAW: 0 }
      ESTIMATE_RUSH_PCT: { far: 0, near: 10, imminent: 25 }
      FINAL_RUSH_PCT: { far: 0, near: 20, imminent: 50 }
      NEAR_DAYS_LOWER: 7
      FAR_DAYS_LOWER: 14
      POST_FREEZE_SURCHARGE_CENTS: 1500
    precision: "integer cents, round_half_up"
    variants:
      - name: pre_freeze_estimate
        when: "quoted to the requester at PCR creation; stored in estimated_fee_cents and never revised"
        difference: "uses ESTIMATE_RUSH_PCT (0/10/25) and applies NO post-freeze surcharge"
      - name: post_freeze_final
        when: "charged when a ProgramChair approves the request; stored in final_fee_cents with rush_pct_applied"
        difference: "uses FINAL_RUSH_PCT (0/20/50) on the same days_to_event and adds POST_FREEZE_SURCHARGE_CENTS when the request was submitted at or after program_freeze_utc"

  - name: reviewer_load_ledger
    description: |
      Conserved quantity #1. CommitteeMember.current_review_load must equal the
      number of that member's live assignments at all times; every assignment,
      submission, decline and void moves the counter by exactly one.
    trigger: "every Review create, submission, decline and void (including all system-driven voids)"
    inputs:
      - "Review rows with reviewer_member_id == member.id"
      - Review.status
      - CommitteeMember.max_review_load
    algorithm: aggregation
    formula: |
      current_review_load = | { r in Review : r.reviewer_member_id == M.id
                                              and r.status == ASSIGNED } |
      INVARIANT: 0 <= current_review_load <= M.max_review_load
      # assign        -> +1   (rejected with ERR_REVIEWER_LOAD_EXCEEDED at the ceiling)
      # submit        -> -1
      # decline       -> -1
      # void (system) -> -1
      # A full assign -> decline -> reassign -> submit round trip must return the
      # ledger to its starting value for the members involved.
    constants:
      LOAD_STEP: 1
    precision: "exact integer"

  - name: session_packing
    description: |
      Conserved quantity #2 and the admission test for a new SessionSlot. The
      session window must hold the chair buffer, every counted slot's duration
      and one changeover gap between consecutive slots.
    trigger: "POST /sessions/{sessionId}/slots; recomputed whenever a slot becomes WITHDRAWN, MOVED, PRESENTED or NO_SHOW_RECORDED, and on an APPLIED MOVE/SWAP"
    inputs:
      - Session.start_utc
      - Session.end_utc
      - "SessionSlot rows of the session with status IN {SCHEDULED, PRESENTED, NO_SHOW_RECORDED} (the counted set)"
      - SessionSlot.duration_minutes
    algorithm: aggregation
    formula: |
      window_minutes = (Session.end_utc - Session.start_utc) in whole minutes
      n = |counted set|
      committed_minutes = sum(s.duration_minutes for s in counted set)
                          + CHANGEOVER_MINUTES * max(0, n - 1)

      admissible(new_duration) :=
        SESSION_BUFFER_MINUTES
        + sum(durations) + new_duration
        + CHANGEOVER_MINUTES * max(0, (n + 1) - 1)
        <= window_minutes
      violation -> ERR_SESSION_DURATION_EXCEEDED (422)

      # Worked boundary example: window_minutes = 90, two existing slots of 25.
      #   before: committed_minutes = (25 + 25) + 5 * 1 = 55
      #   adding 20: 10 + (25 + 25 + 20) + 5 * 2 = 10 + 70 + 10 = 90 <= 90
      #              -> admissible at the exact boundary
      #   adding 21: 10 + 71 + 10 = 91 > 90 -> ERR_SESSION_DURATION_EXCEEDED
      #   after the 20-minute slot: committed_minutes = 70 + 5 * 2 = 80
    constants:
      CHANGEOVER_MINUTES: 5
      SESSION_BUFFER_MINUTES: 10
    precision: "exact integer minutes"

  - name: session_room_overlap
    description: |
      Room double-booking test, evaluated at Session creation. Rooms use
      HALF-OPEN intervals [start_utc, end_utc): a session that starts exactly
      when another ends is legal because the room empties instantaneously.
    trigger: "POST /sessions"
    inputs:
      - Session.room_code
      - Session.conference_id
      - Session.start_utc
      - Session.end_utc
      - Session.status
    algorithm: interval_merge
    formula: |
      peers = { S : S.conference_id == new.conference_id
                    and S.room_code == new.room_code
                    and S.status != CANCELLED }
      conflict(S) := new.start_utc <  S.end_utc
                 and S.start_utc   <  new.end_utc      # half-open, touching is OK
      any conflict -> ERR_ROOM_TIME_CONFLICT (409)
      # Boundary: new.start_utc == S.end_utc -> NO conflict.
    constants:
      ROOM_TURNAROUND_MINUTES: 0
    precision: "whole-minute UTC instants"

  - name: session_chair_overlap
    description: |
      Chair double-booking test, evaluated at Session creation. A chair needs a
      mandatory turnaround gap, so the interval is INFLATED by
      CHAIR_TURNAROUND_MINUTES on the right-hand side before comparison —
      back-to-back sessions conflict for a chair even though they do not for a room.
    trigger: "POST /sessions"
    inputs:
      - Session.chair_member_id
      - Session.start_utc
      - Session.end_utc
      - Session.status
    algorithm: interval_merge
    formula: |
      peers = { S : S.chair_member_id == new.chair_member_id
                    and S.status != CANCELLED }
      conflict(S) := new.start_utc < (S.end_utc   + CHAIR_TURNAROUND_MINUTES)
                 and S.start_utc   < (new.end_utc + CHAIR_TURNAROUND_MINUTES)
      any conflict -> ERR_CHAIR_TIME_CONFLICT (409)
      # Boundary: a gap of exactly 15 minutes is legal; 14 minutes conflicts.
    constants:
      CHAIR_TURNAROUND_MINUTES: 15
    precision: "whole-minute UTC instants"

  - name: session_presenter_overlap
    description: |
      Presenter double-booking test, evaluated at SessionSlot creation. Presenters
      use FULLY CLOSED intervals [start_utc, end_utc]: touching endpoints DO
      conflict, because a presenter cannot physically be in two rooms at the
      instant one session ends and the next begins.
    trigger: "POST /sessions/{sessionId}/slots"
    inputs:
      - SessionSlot.presenter_author_id
      - SessionSlot.status
      - "the owning Session.start_utc / end_utc / status of every SCHEDULED slot of that presenter"
    algorithm: interval_merge
    formula: |
      peers = { slot : slot.presenter_author_id == new.presenter_author_id
                       and slot.status == SCHEDULED
                       and slot.session_id != new.session_id
                       and slot.session.status != CANCELLED }
      conflict(slot) := new.session.start_utc <= slot.session.end_utc
                    and slot.session.start_utc <= new.session.end_utc
      any conflict -> ERR_PRESENTER_TIME_CONFLICT (409)
      # Boundary: new.session.start_utc == other.session.end_utc -> CONFLICT
      # (the opposite verdict from session_room_overlap on the same instants).
    constants:
      PRESENTER_GAP_MINUTES: 0
    precision: "whole-minute UTC instants"

# =============================================================================
# §1.4 Validation Rules Table (strict priority order — the FIRST violated rule
# in this list decides the response; later violations are never reported)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty, and X-User-Role is one of the five declared roles"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: "all"
    description: "Runs before routing-level existence checks. A request with no headers to a non-existent abstract still returns 401."

  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's authorized_roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
    description: "Pure role-based gate; evaluated from the endpoint table alone, with no database reads."

  - priority: 3
    category: auth
    check: "X-User-ID resolves to the entity backing the claimed role — a CommitteeMember for Reviewer/ProgramChair (with matching member_role) and an Author for Author"
    error_id: ERR_IDENTITY_NOT_FOUND
    http_status: 403
    applies_to: "all endpoints whose authorized_roles include an entity_backed role"
    description: "A syntactically valid but unknown identity, or a REVIEWER member_id presenting X-User-Role: ProgramChair, is rejected here."

  - priority: 4
    category: existence
    check: "every id in the URL path exists"
    error_id: "ERR_CONFERENCE_NOT_FOUND | ERR_CATEGORY_NOT_FOUND | ERR_ABSTRACT_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_REVIEW_NOT_FOUND | ERR_DISCREPANCY_CASE_NOT_FOUND | ERR_SESSION_NOT_FOUND | ERR_SLOT_NOT_FOUND | ERR_ACCREDITATION_NOT_FOUND | ERR_DISCLOSURE_NOT_FOUND | ERR_CHANGE_REQUEST_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"
    description: "Left-to-right in the path: for POST /sessions/{sessionId}/slots a bad sessionId wins over a bad body abstract_id."

  - priority: 5
    category: existence
    check: "every foreign key in the request body references an existing row"
    error_id: "ERR_CONFERENCE_NOT_FOUND | ERR_CATEGORY_NOT_FOUND | ERR_ABSTRACT_NOT_FOUND | ERR_AUTHOR_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_SESSION_NOT_FOUND | ERR_SLOT_NOT_FOUND | ERR_ACCREDITATION_NOT_FOUND"
    http_status: 404
    applies_to: "all POST endpoints carrying foreign keys"
    description: "Body FK existence is checked in the order the fields appear in the endpoint's request_body table, and always AFTER every path id."

  - priority: 6
    category: auth
    check: "the resolved identity owns the resource it is acting on — Author.id == Abstract.submitting_author_id for revisions/confirmation/withdrawal, CommitteeMember.id == Review.reviewer_member_id for review submission/decline, CommitteeMember.id == DiscrepancyCase.arbiter_member_id for resolution"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: ["POST /abstracts/{abstractId}/revisions", "POST /abstracts/{abstractId}/status-transitions", "POST /reviews/{reviewId}/submission", "POST /reviews/{reviewId}/decline", "POST /discrepancy-cases/{caseId}/resolution", "POST /program-change-requests"]
    description: "Ownership needs the row, so it must come after existence; it still precedes any body schema validation."

  - priority: 7
    category: schema
    check: "required fields present; types, enum members, string lengths, numeric ranges and ISO-8601 datetime syntax valid; unknown fields ignored"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST endpoints"
    description: "Includes rubric scores in 1..5, confidence IN {LOW, MEDIUM, HIGH}, duration_minutes >= 1, limit in 1..100 and offset >= 0 on list endpoints."

  - priority: 8
    category: concurrency
    check: "expected_conference_version / expected_session_version equals the parent's current version"
    error_id: "ERR_STALE_CONFERENCE_VERSION | ERR_STALE_SESSION_VERSION"
    http_status: 412
    applies_to: ["POST /abstracts/{abstractId}/decision", "POST /sessions/{sessionId}/slots"]
    description: "The OCC check runs after schema validation (the field must be a well-formed integer first) and before every business rule, so a stale version masks all state and capacity errors."

  - priority: 9
    category: state
    check: "the owning Conference is in a status that permits the operation"
    error_id: ERR_CONFERENCE_STATE_INVALID
    http_status: 409
    applies_to: "all mutating endpoints under a conference"
    description: "Conference-level gate outranks the acted-on resource's own state, e.g. submitting a review while the conference is REVIEW_CLOSED returns ERR_CONFERENCE_STATE_INVALID even if the review is still ASSIGNED."

  - priority: 10
    category: state
    check: "the acted-on resource is in a state from which the requested transition exists"
    error_id: "ERR_ABSTRACT_STATE_INVALID | ERR_REVIEW_STATE_INVALID | ERR_MEMBER_STATE_INVALID | ERR_CASE_STATE_INVALID | ERR_SESSION_STATE_INVALID | ERR_SLOT_STATE_INVALID | ERR_ACCREDITATION_STATE_INVALID | ERR_DISCLOSURE_STATE_INVALID | ERR_CHANGE_REQUEST_STATE_INVALID"
    http_status: 409
    applies_to: "all status-transition, decision, submission, adjudication and validation endpoints"
    description: "Also covers terminal-state lockdown and second-attempt idempotency failures."

  - priority: 11
    category: business_safety
    check: "conflict-of-interest and segregation-of-duties separations hold"
    error_id: "ERR_REVIEWER_CONFLICT | ERR_ARBITER_CONFLICT | ERR_SEGREGATION_VIOLATION | ERR_ACCREDITATION_SELF_VALIDATION"
    http_status: 409
    applies_to: ["POST /abstracts/{abstractId}/review-assignments", "POST /abstracts/{abstractId}/decision", "POST /discrepancy-cases/{caseId}/arbiter", "POST /accreditations/{accreditationId}/validation"]
    description: "Blinding integrity outranks every remaining business rule: a conflicted reviewer is rejected even when the reviewer is also over their load ceiling."

  - priority: 12
    category: business_safety
    check: "the acting or referenced Author is not BARRED by the no-show / embargo sanction ladder"
    error_id: ERR_AUTHOR_BARRED
    http_status: 403
    applies_to: ["POST /abstracts", "POST /abstracts/{abstractId}/status-transitions", "POST /sessions/{sessionId}/slots"]
    description: "A BARRED author cannot submit, confirm or be scheduled as a presenter."

  - priority: 13
    category: business_safety
    check: "disclosure completeness for continuing-education content — at least one DisclosureStatement, all VALIDATED, mitigation completed where required, commercial_bias_flag false"
    error_id: ERR_DISCLOSURE_INCOMPLETE
    http_status: 409
    applies_to: ["POST /accreditations/{accreditationId}/validation", "POST /disclosure-statements/{disclosureId}/adjudication"]
    description: "Accreditation content validation cannot proceed on an incomplete disclosure set, and a disclosure needing mitigation cannot be marked VALIDATED until mitigation_completed is true."

  - priority: 14
    category: referential
    check: "cross-entity coherence — category.conference_id matches the body conference_id, disclosure.abstract_id matches its accreditation's abstract_id, the decision format is in category.allowed_formats, session.theme_code is one of the abstract's keywords, session.format equals abstract.decision, the presenter is on the abstract, the substitute presenter is a coauthor"
    error_id: "ERR_CATEGORY_CONFERENCE_MISMATCH | ERR_DISCLOSURE_ABSTRACT_MISMATCH | ERR_FORMAT_NOT_ALLOWED | ERR_SESSION_THEME_MISMATCH | ERR_SESSION_FORMAT_MISMATCH | ERR_PRESENTER_NOT_ON_ABSTRACT | ERR_CATEGORY_NOT_CME_ELIGIBLE"
    http_status: 422
    applies_to: ["POST /abstracts", "POST /abstracts/{abstractId}/decision", "POST /sessions/{sessionId}/slots", "POST /disclosure-statements", "POST /accreditations", "POST /program-change-requests"]
    description: "All parties exist and are in legal states, but they do not belong together."

  - priority: 15
    category: temporal
    check: "deadline, embargo-window and program-freeze constraints against the logical clock"
    error_id: "ERR_CFA_DEADLINE_PASSED | ERR_REVIEW_PAST_DUE | ERR_PROGRAM_FROZEN | ERR_EMBARGO_WINDOW_INVALID | ERR_INVALID_DATE_RANGE"
    http_status: "422 for deadline/window/range violations, 409 for ERR_PROGRAM_FROZEN"
    applies_to: ["POST /abstracts", "POST /abstracts/{abstractId}/revisions", "POST /reviews/{reviewId}/submission", "POST /sessions", "POST /sessions/{sessionId}/slots", "POST /abstracts/{abstractId}/status-transitions", "POST /abstracts/{abstractId}/press-actions", "POST /conferences", "POST /conferences/{conferenceId}/status-transitions"]
    description: "Temporal rules are evaluated after referential coherence, so a mismatched category on a late submission returns the mismatch, not the deadline error."

  - priority: 16
    category: formatting
    check: "abstract formatting requirements of the chosen category — body_word_count <= max_word_count and body_structured true when requires_structured_body"
    error_id: ERR_ABSTRACT_FORMAT_INVALID
    http_status: 422
    applies_to: ["POST /abstracts", "POST /abstracts/{abstractId}/revisions"]
    description: "Category-conditional rule: it only fires for categories that declare the requirement."

  - priority: 17
    category: business_workflow
    check: "review-workflow completeness and bounds — enough submitted reviews, no non-terminal DiscrepancyCase, no duplicate assignment for the same reviewer, revision and reopen limits, override permitted for the recorded spread, a reviewer candidate exists"
    error_id: "ERR_INSUFFICIENT_REVIEWS | ERR_OPEN_DISCREPANCY | ERR_DUPLICATE_REVIEW_ASSIGNMENT | ERR_REVISION_LIMIT_REACHED | ERR_CFA_EXTENSION_LIMIT | ERR_REVIEW_REOPEN_LIMIT | ERR_OVERRIDE_NOT_PERMITTED | ERR_NO_ELIGIBLE_REVIEWER | ERR_UNDECIDED_ABSTRACTS_REMAIN | ERR_COI_NOT_DECLARED | ERR_MEMBER_STILL_CHAIRING | ERR_EMPTY_SESSION | ERR_SESSION_NOT_ACCREDITED | ERR_NOT_NEWSWORTHY | ERR_EMBARGO_NOT_SET"
    http_status: "409 for workflow-state conflicts, 422 for ERR_NO_ELIGIBLE_REVIEWER and ERR_NOT_NEWSWORTHY"
    applies_to: ["POST /abstracts/{abstractId}/decision", "POST /abstracts/{abstractId}/review-assignments", "POST /abstracts/{abstractId}/revisions", "POST /abstracts/{abstractId}/press-actions", "POST /conferences/{conferenceId}/status-transitions", "POST /committee-members/{memberId}/status-transitions", "POST /discrepancy-cases/{caseId}/resolution", "POST /sessions/{sessionId}/status-transitions"]
    description: "The workflow band sits above every resource-contention rule: an abstract with an open discrepancy is rejected before its format capacity is even consulted."

  - priority: 18
    category: business_safety
    check: "resource-temporal exclusivity — room, chair and presenter interval conflicts"
    error_id: "ERR_ROOM_TIME_CONFLICT | ERR_CHAIR_TIME_CONFLICT | ERR_PRESENTER_TIME_CONFLICT"
    http_status: 409
    applies_to: ["POST /sessions", "POST /sessions/{sessionId}/slots"]
    description: "Room and chair conflicts are checked at session creation (room before chair); presenter conflicts at slot creation."

  - priority: 19
    category: business_safety
    check: "session packing limits — slot_count < capacity_slots, position unused, and session_packing admits the duration"
    error_id: "ERR_SESSION_SLOT_CAPACITY_REACHED | ERR_DUPLICATE_SLOT_POSITION | ERR_SESSION_DURATION_EXCEEDED"
    http_status: 422
    applies_to: ["POST /sessions/{sessionId}/slots", "POST /program-change-requests/{requestId}/adjudication"]
    description: "Checked in the listed order: the slot-count ceiling wins over a duplicate position, which wins over the minute budget."

  - priority: 20
    category: business_workflow
    check: "presenter registration requirement — Author.is_registered is true"
    error_id: ERR_AUTHOR_NOT_REGISTERED
    http_status: 422
    applies_to: ["POST /abstracts/{abstractId}/status-transitions"]
    description: "Only enforced on the ACCEPTED -> CONFIRMED transition; unregistered authors may still submit and be reviewed."

  - priority: 21
    category: business_fiscal
    check: "quota and pool ceilings — format slot capacity, the CME minute pool and the reviewer load ceiling"
    error_id: "ERR_FORMAT_CAPACITY_EXHAUSTED | ERR_CME_POOL_EXHAUSTED | ERR_REVIEWER_LOAD_EXCEEDED"
    http_status: 422
    applies_to: ["POST /abstracts/{abstractId}/decision", "POST /accreditations/{accreditationId}/validation", "POST /abstracts/{abstractId}/review-assignments"]
    description: "The lowest band: every quota check is the last thing evaluated, so a capacity-exhausted conference still reports auth, state, COI and workflow problems first."

# =============================================================================
# §1.5 API Endpoint Table
#
# api_prefix is "/", so every path below is absolute and every business entity
# is a top-level collection. Reverse reachability for every §1.1 foreign key is
# provided by the filtered list endpoints (each FK field appears as an optional
# query filter on that child's list endpoint).
#
# Logical clock: the system exposes POST /_clock/set_current_utc, therefore the
# MANDATORY default logical clock is 2026-08-01T00:00:00Z. Every deadline,
# freeze and embargo comparison reads the logical clock, never wall time.
# =============================================================================
endpoints:
  # --- test-driving -----------------------------------------------------------
  - method: POST
    path: /_clock/set_current_utc
    description: |
      Sets the server's logical clock. Exists because no business endpoint can
      move time forward, yet abstract deadlines, review due dates, the program
      freeze, no-show recording and embargo release/breach all branch on the
      clock (priority-ladder step 3: test-driving endpoint).
      DEFAULT LOGICAL CLOCK: 2026-08-01T00:00:00Z until this endpoint is called.
    roles: [ConferenceAdmin]
    success_code: 200
    input: ["current_utc"]
    output: "{ current_utc: datetime }"
    side_effects:
      - "no entity is mutated; all subsequent temporal comparisons use the new value"

  # --- Conference -------------------------------------------------------------
  - method: POST
    path: /conferences
    description: Create a conference in DRAFT.
    roles: [ConferenceAdmin]
    success_code: 201
    input: ["name", "code", "event_start_utc", "event_end_utc", "abstract_deadline_utc", "review_deadline_utc", "program_freeze_utc", "oral_slot_capacity", "poster_slot_capacity", "workshop_slot_capacity", "cme_minutes_pool_total?"]
    output: Conference
    side_effects:
      - "status := DRAFT; all counters 0; cme_minutes_available := cme_minutes_pool_total"

  - method: GET
    path: /conferences
    description: Paginated conference list.
    roles: [ConferenceAdmin, ProgramChair, Reviewer, Author, PressOfficer]
    success_code: 200
    input: ["status?", "limit?", "offset?"]
    output: Conference[]
    side_effects: []

  - method: GET
    path: /conferences/{conferenceId}
    description: Read one conference including every derived capacity and CME counter.
    roles: [ConferenceAdmin, ProgramChair, Reviewer, Author, PressOfficer]
    success_code: 200
    input: []
    output: Conference
    side_effects: []

  - method: GET
    path: /conferences/{conferenceId}/capacity-summary
    description: |
      Computed read. Remaining format capacity, waitlist depth, remaining CME
      minutes and the `session_bundle_estimate` variant of cme_credit_award
      (cme_bundle_credits) — which deliberately differs from the sum of the
      per-abstract awarded_credits.
    roles: [ConferenceAdmin, ProgramChair]
    success_code: 200
    input: []
    output: "{ conference_id: string, oral_remaining: integer, poster_remaining: integer, workshop_remaining: integer, waitlisted_count: integer, cme_minutes_available: integer, cme_bundle_credits: number, awarded_credits_sum: number, accredited_session_count: integer }"
    side_effects: []

  - method: POST
    path: /conferences/{conferenceId}/status-transitions
    description: |
      Drives the Conference lifecycle, including the two back-edges (CFA
      extension and review reopen) and the fan-out side effects at REVIEW_CLOSED
      and PROGRAM_PUBLISHED.
    roles: [ConferenceAdmin]
    success_code: 200
    input: ["to_status", "new_abstract_deadline_utc?", "reopen_reason?"]
    output: Conference
    side_effects:
      - "REVIEW_CLOSED: UNDER_REVIEW abstracts with enough reviews advance to SCORED; final_score written for every reviewed abstract; ASSIGNED reviews VOIDED with load decrements"
      - "CFA_OPEN extension: abstract_deadline_utc replaced, cfa_extension_count += 1"
      - "REVIEW_OPEN reopen: review_reopen_count += 1, final_score cleared on undecided SCORED abstracts"
      - "PROGRAM_PUBLISHED: every PUBLISHED session LOCKED"
      - "version += 1"

  # --- SubmissionCategory -----------------------------------------------------
  - method: POST
    path: /categories
    description: Declare a submission category with its formatting, review and CME policy.
    roles: [ConferenceAdmin]
    success_code: 201
    input: ["conference_id", "code", "name", "max_word_count", "allowed_formats", "requires_structured_body?", "min_reviews_required?", "discrepancy_threshold?", "cme_eligible?"]
    output: SubmissionCategory
    side_effects: []

  - method: GET
    path: /categories
    description: Filtered category list — reverse reachability for SubmissionCategory.conference_id.
    roles: [ConferenceAdmin, ProgramChair, Reviewer, Author, PressOfficer]
    success_code: 200
    input: ["conference_id?", "cme_eligible?", "limit?", "offset?"]
    output: SubmissionCategory[]
    side_effects: []

  - method: GET
    path: /categories/{categoryId}
    description: Read one submission category.
    roles: [ConferenceAdmin, ProgramChair, Reviewer, Author, PressOfficer]
    success_code: 200
    input: []
    output: SubmissionCategory
    side_effects: []

  # --- Author -----------------------------------------------------------------
  - method: POST
    path: /authors
    description: Register an author record (not the same as event registration).
    roles: [ConferenceAdmin, Author]
    success_code: 201
    input: ["full_name", "email", "affiliation?"]
    output: Author
    side_effects:
      - "is_registered := false; no_show_strikes := 0; embargo_breach_count := 0; sanction_status := NONE"

  - method: GET
    path: /authors
    description: Filtered author list.
    roles: [ConferenceAdmin, ProgramChair, PressOfficer]
    success_code: 200
    input: ["email?", "is_registered?", "sanction_status?", "limit?", "offset?"]
    output: Author[]
    side_effects: []

  - method: GET
    path: /authors/{authorId}
    description: Read one author with the sanction ladder state.
    roles: [ConferenceAdmin, ProgramChair, Author, PressOfficer]
    success_code: 200
    input: []
    output: Author
    side_effects: []

  - method: POST
    path: /authors/{authorId}/registration
    description: |
      Records or clears event registration. Exists because ACCEPTED -> CONFIRMED
      requires Author.is_registered == true and no other business endpoint can
      set it (priority-ladder step 2: a general business endpoint).
    roles: [ConferenceAdmin, Author]
    success_code: 200
    input: ["is_registered"]
    output: Author
    side_effects:
      - "registered_at := logical clock when is_registered becomes true, null when it becomes false"

  # --- Abstract ---------------------------------------------------------------
  - method: POST
    path: /abstracts
    description: Submit an abstract to an open call. Mints the blind code.
    roles: [Author]
    success_code: 201
    input: ["conference_id", "category_id", "submitting_author_id", "title", "body_word_count", "requested_format", "keywords", "body_structured?", "coauthor_emails?", "is_newsworthy?"]
    output: Abstract
    side_effects:
      - "status := SUBMITTED; embargo_status := NONE; revision_round := 0"
      - "blind_code minted from Conference.code + Conference.abstract_sequence; Conference.abstract_sequence += 1; Conference.version += 1"

  - method: GET
    path: /abstracts
    description: |
      Filtered abstract list — reverse reachability for Abstract.conference_id,
      category_id, submitting_author_id and decided_by_member_id.
    roles: [ConferenceAdmin, ProgramChair, Reviewer, Author, PressOfficer]
    success_code: 200
    input: ["conference_id?", "category_id?", "submitting_author_id?", "decided_by_member_id?", "status?", "decision?", "embargo_status?", "is_newsworthy?", "limit?", "offset?"]
    output: Abstract[]
    side_effects: []

  - method: GET
    path: /abstracts/{abstractId}
    description: Read one abstract with both score variants, the decision and the embargo dimension.
    roles: [ConferenceAdmin, ProgramChair, Reviewer, Author, PressOfficer]
    success_code: 200
    input: []
    output: Abstract
    side_effects: []

  - method: POST
    path: /abstracts/{abstractId}/revisions
    description: Author resubmission after REVISION_REQUESTED; re-runs the formatting rules.
    roles: [Author]
    success_code: 200
    input: ["body_word_count", "title?", "body_structured?", "keywords?"]
    output: Abstract
    side_effects:
      - "revision_round += 1; status REVISION_REQUESTED -> SUBMITTED"
      - "provisional_score, final_score, score_spread reset to null; submitted_review_count recomputes to 0"

  - method: POST
    path: /abstracts/{abstractId}/status-transitions
    description: |
      Every non-decision Abstract.status move: REVISION_REQUESTED, CONFIRMED,
      WITHDRAWN and the SCORED rescission of an acceptance.
    roles: [ProgramChair, Author]
    success_code: 200
    input: ["to_status", "reason?"]
    output: Abstract
    side_effects:
      - "REVISION_REQUESTED: ASSIGNED reviews VOIDED with load decrements"
      - "SCORED (rescission): accepted_<format>_count -= 1, decision cleared, waitlist promotion runs, Conference.version += 1"
      - "CONFIRMED: gated on Conference.status, Author.is_registered and the sanction ladder"
      - "WITHDRAWN: CASCADE-B (slot withdrawal -> session recompute -> unpublish) plus capacity release and waitlist promotion"

  - method: POST
    path: /abstracts/{abstractId}/decision
    description: |
      Commits an acceptance decision through format_capacity_waterfall under OCC
      on the Conference. The only endpoint that writes Abstract.decision.
    roles: [ProgramChair]
    success_code: 200
    input: ["decision", "expected_conference_version", "allow_format_downgrade?"]
    output: Abstract
    side_effects:
      - "status -> ACCEPTED | WAITLISTED | REJECTED per the waterfall"
      - "decision_downgraded set when the waterfall spilled ORAL into POSTER"
      - "Conference.accepted_<format>_count or waitlisted_count += 1; Conference.version += 1"
      - "decided_by_member_id := the acting chair (later blocks that chair from validating the abstract's CME accreditation)"

  - method: POST
    path: /abstracts/{abstractId}/review-assignments
    description: |
      Assigns a blinded reviewer. With reviewer_member_id the named member is
      used; without it reviewer_selection_by_expertise picks one.
    roles: [ProgramChair]
    success_code: 201
    input: ["reviewer_member_id?", "due_utc?"]
    output: Review
    side_effects:
      - "Review created ASSIGNED with assigned_round := Abstract.revision_round and expertise_match_score computed"
      - "reviewer.current_review_load += 1"
      - "Abstract SUBMITTED -> UNDER_REVIEW on the first live review of the round"

  - method: POST
    path: /abstracts/{abstractId}/press-actions
    description: |
      Embargo dimension driver: SET_EMBARGO and RELEASE. A RELEASE before
      embargo_until_utc lands in BREACHED and triggers the sanction cascade.
    roles: [PressOfficer]
    success_code: 200
    input: ["action", "embargo_until_utc?", "outlet_name?"]
    output: Abstract
    side_effects:
      - "SET_EMBARGO: embargo_status := EMBARGOED, embargo_until_utc stored"
      - "RELEASE at or after the embargo instant: embargo_status := RELEASED"
      - "RELEASE before the embargo instant: embargo_status := BREACHED, CASCADE-E raises Author.embargo_breach_count and re-derives sanction_status"

  # --- CommitteeMember --------------------------------------------------------
  - method: POST
    path: /committee-members
    description: Recruit a reviewer or chair onto a conference committee (INVITED).
    roles: [ConferenceAdmin]
    success_code: 201
    input: ["conference_id", "full_name", "email", "member_role", "expertise_keywords", "max_review_load?", "calibration_bias?"]
    output: CommitteeMember
    side_effects:
      - "status := INVITED; coi_declaration_status := PENDING; current_review_load := 0"

  - method: GET
    path: /committee-members
    description: Filtered committee list — reverse reachability for CommitteeMember.conference_id.
    roles: [ConferenceAdmin, ProgramChair, Reviewer]
    success_code: 200
    input: ["conference_id?", "member_role?", "status?", "coi_declaration_status?", "limit?", "offset?"]
    output: CommitteeMember[]
    side_effects: []

  - method: GET
    path: /committee-members/{memberId}
    description: Read one committee member including the live review-load ledger.
    roles: [ConferenceAdmin, ProgramChair, Reviewer]
    success_code: 200
    input: []
    output: CommitteeMember
    side_effects: []

  - method: PATCH
    path: /committee-members/{memberId}
    description: |
      Maintains the selector inputs — expertise keywords, load ceiling and the
      reviewer's calibration bias.
    roles: [ConferenceAdmin]
    success_code: 200
    input: ["expertise_keywords?", "max_review_load?", "calibration_bias?"]
    output: CommitteeMember
    side_effects:
      - "already-computed Review.weighted_score values are NOT retroactively rescored; only later submissions use the new calibration_bias"

  - method: POST
    path: /committee-members/{memberId}/status-transitions
    description: Activation, suspension (CASCADE-C), reinstatement and resignation.
    roles: [ConferenceAdmin, ProgramChair, Reviewer]
    success_code: 200
    input: ["to_status", "reason?"]
    output: CommitteeMember
    side_effects:
      - "ACTIVE: coi_declaration_status := SUBMITTED (requires a declaration on file)"
      - "SUSPENDED: CASCADE-C voids ASSIGNED reviews, zeroes current_review_load and auto-reassigns each affected abstract"
      - "RESIGNED: voids ASSIGNED reviews with no reassignment"

  # --- ConflictDeclaration ----------------------------------------------------
  - method: POST
    path: /conflict-declarations
    description: Immutable conflict-of-interest declaration for a committee member.
    roles: [ConferenceAdmin, ProgramChair, Reviewer]
    success_code: 201
    input: ["member_id", "conflict_subject_type", "conflict_type", "conflict_subject_value?"]
    output: ConflictDeclaration
    side_effects:
      - "declared_at := logical clock; the row has no version field and no update endpoint"

  - method: GET
    path: /conflict-declarations
    description: Filtered declaration list — reverse reachability for ConflictDeclaration.member_id.
    roles: [ConferenceAdmin, ProgramChair, Reviewer]
    success_code: 200
    input: ["member_id?", "conflict_subject_type?", "conflict_type?", "limit?", "offset?"]
    output: ConflictDeclaration[]
    side_effects: []

  - method: GET
    path: /conflict-declarations/{declarationId}
    description: Read one conflict declaration.
    roles: [ConferenceAdmin, ProgramChair, Reviewer]
    success_code: 200
    input: []
    output: ConflictDeclaration
    side_effects: []

  # --- Review -----------------------------------------------------------------
  - method: GET
    path: /reviews
    description: |
      Filtered review list — reverse reachability for Review.abstract_id and
      Review.reviewer_member_id.
    roles: [ConferenceAdmin, ProgramChair, Reviewer]
    success_code: 200
    input: ["abstract_id?", "reviewer_member_id?", "status?", "assigned_round?", "is_third_review?", "limit?", "offset?"]
    output: Review[]
    side_effects: []

  - method: GET
    path: /reviews/{reviewId}
    description: Read one review with its weighted score and expertise match.
    roles: [ConferenceAdmin, ProgramChair, Reviewer]
    success_code: 200
    input: []
    output: Review
    side_effects: []

  - method: POST
    path: /reviews/{reviewId}/submission
    description: |
      Reviewer submits the rubric. Recomputes review_weighted_score,
      abstract_consensus_score (provisional), abstract_score_spread and may open
      or close a DiscrepancyCase.
    roles: [Reviewer, ProgramChair]
    success_code: 200
    input: ["score_originality", "score_methodology", "score_relevance", "score_clarity", "confidence", "recommended_format", "comments_to_authors?"]
    output: Review
    side_effects:
      - "weighted_score computed with the reviewer's calibration_bias; submitted_at stamped"
      - "reviewer.current_review_load -= 1"
      - "Abstract.submitted_review_count, provisional_score and score_spread recomputed; UNDER_REVIEW -> SCORED at the category minimum"
      - "DiscrepancyCase opened at the spread threshold; a third review's submission resolves or escalates its case"

  - method: POST
    path: /reviews/{reviewId}/decline
    description: Reviewer declines an assignment, optionally triggering auto-reassignment.
    roles: [Reviewer, ProgramChair]
    success_code: 200
    input: ["decline_reason", "auto_reassign?"]
    output: Review
    side_effects:
      - "status := DECLINED; reviewer.current_review_load -= 1"
      - "auto_reassign (default true): a replacement Review is created by the selector excluding the declining member; an empty candidate pool leaves no replacement and the call still returns 200"

  # --- DiscrepancyCase --------------------------------------------------------
  - method: GET
    path: /discrepancy-cases
    description: |
      Filtered case list — reverse reachability for DiscrepancyCase.abstract_id,
      arbiter_member_id and third_review_id.
    roles: [ConferenceAdmin, ProgramChair]
    success_code: 200
    input: ["abstract_id?", "arbiter_member_id?", "third_review_id?", "status?", "limit?", "offset?"]
    output: DiscrepancyCase[]
    side_effects: []

  - method: GET
    path: /discrepancy-cases/{caseId}
    description: Read one discrepancy case with spread_at_open and the resolution record.
    roles: [ConferenceAdmin, ProgramChair]
    success_code: 200
    input: []
    output: DiscrepancyCase
    side_effects: []

  - method: POST
    path: /discrepancy-cases/{caseId}/arbiter
    description: Assigns a conflict-free chair as arbiter (OPEN -> ARBITER_ASSIGNED).
    roles: [ProgramChair]
    success_code: 200
    input: ["arbiter_member_id"]
    output: DiscrepancyCase
    side_effects:
      - "arbiter_member_id stored; only this member may later resolve the case"

  - method: POST
    path: /discrepancy-cases/{caseId}/resolution
    description: |
      The fork: CHAIR_OVERRIDE resolves immediately (bounded by the recorded
      spread), THIRD_REVIEW commissions a tie-breaking review that later joins
      back into RESOLVED or ESCALATED.
    roles: [ProgramChair]
    success_code: 200
    input: ["resolution_method", "override_score?"]
    output: DiscrepancyCase
    side_effects:
      - "CHAIR_OVERRIDE: resolved_score := override_score and Abstract.final_score := override_score"
      - "THIRD_REVIEW: a Review with is_third_review true is created by the selector; third_review_id stored; that reviewer's load += 1"

  # --- Session ----------------------------------------------------------------
  - method: POST
    path: /sessions
    description: |
      Builds a themed session and assigns its chair, enforcing the three
      distinct interval semantics (room half-open, chair inflated by a 15-minute
      turnaround).
    roles: [ProgramChair]
    success_code: 201
    input: ["conference_id", "chair_member_id", "theme_code", "format", "room_code", "start_utc", "end_utc", "capacity_slots", "cme_designated?"]
    output: Session
    side_effects:
      - "status := PLANNED; slot_count 0; committed_minutes 0; accredited_credit_total 0.00; accreditation_posture := NOT_APPLICABLE when cme_designated is false, else NON_COMPLIANT"
      - "chair.chaired_session_count += 1"

  - method: GET
    path: /sessions
    description: Filtered session list — reverse reachability for Session.conference_id and chair_member_id.
    roles: [ConferenceAdmin, ProgramChair, Reviewer, Author, PressOfficer]
    success_code: 200
    input: ["conference_id?", "chair_member_id?", "status?", "format?", "theme_code?", "room_code?", "limit?", "offset?"]
    output: Session[]
    side_effects: []

  - method: GET
    path: /sessions/{sessionId}
    description: Read one session with its packing and accreditation ledgers.
    roles: [ConferenceAdmin, ProgramChair, Reviewer, Author, PressOfficer]
    success_code: 200
    input: []
    output: Session
    side_effects: []

  - method: POST
    path: /sessions/{sessionId}/status-transitions
    description: Publish, unpublish (back-edge) and cancel a session.
    roles: [ProgramChair, ConferenceAdmin]
    success_code: 200
    input: ["to_status", "reason?"]
    output: Session
    side_effects:
      - "PUBLISHED: requires a non-empty session, all slot abstracts SCHEDULED and a compliant accreditation posture"
      - "CANCELLED: slots WITHDRAWN, their abstracts revert SCHEDULED -> CONFIRMED, chair.chaired_session_count -= 1"
      - "version += 1"

  - method: POST
    path: /sessions/{sessionId}/slots
    description: |
      Places a confirmed abstract into a session under OCC on the Session,
      enforcing theme match, presenter identity, the fully-closed presenter
      interval rule and session_packing.
    roles: [ProgramChair]
    success_code: 201
    input: ["abstract_id", "presenter_author_id", "position", "duration_minutes", "expected_session_version"]
    output: SessionSlot
    side_effects:
      - "Abstract CONFIRMED -> SCHEDULED"
      - "Session.slot_count += 1, committed_minutes, accredited_credit_total and accreditation_posture recomputed, Session.version += 1"

  - method: GET
    path: /session-slots
    description: |
      Filtered slot list — reverse reachability for SessionSlot.session_id,
      abstract_id, presenter_author_id and the self-referential
      swapped_with_slot_id.
    roles: [ConferenceAdmin, ProgramChair, Reviewer, Author, PressOfficer]
    success_code: 200
    input: ["session_id?", "abstract_id?", "presenter_author_id?", "swapped_with_slot_id?", "status?", "limit?", "offset?"]
    output: SessionSlot[]
    side_effects: []

  - method: GET
    path: /session-slots/{slotId}
    description: Read one session slot.
    roles: [ConferenceAdmin, ProgramChair, Reviewer, Author, PressOfficer]
    success_code: 200
    input: []
    output: SessionSlot
    side_effects: []

  - method: POST
    path: /session-slots/{slotId}/status-transitions
    description: On-site outcome recording — PRESENTED or NO_SHOW_RECORDED (CASCADE-D).
    roles: [ProgramChair, ConferenceAdmin]
    success_code: 200
    input: ["to_status", "reason?"]
    output: SessionSlot
    side_effects:
      - "PRESENTED: Abstract SCHEDULED -> PRESENTED"
      - "NO_SHOW_RECORDED: Abstract -> NO_SHOW, Author.no_show_strikes recomputed, Author.sanction_status re-derived (WARNED then BARRED)"

  # --- CmeAccreditation -------------------------------------------------------
  - method: POST
    path: /accreditations
    description: Open a continuing-education accreditation on CME-eligible content.
    roles: [ConferenceAdmin, ProgramChair]
    success_code: 201
    input: ["abstract_id", "content_minutes", "commercial_support_disclosed?"]
    output: CmeAccreditation
    side_effects:
      - "validation_status := PENDING; awarded_credits := 0.00; commercial_bias_flag derived from commercial_support_disclosed and the (still empty) disclosure set"

  - method: GET
    path: /accreditations
    description: |
      Filtered accreditation list — reverse reachability for
      CmeAccreditation.abstract_id and validated_by_member_id.
    roles: [ConferenceAdmin, ProgramChair, Author]
    success_code: 200
    input: ["abstract_id?", "validated_by_member_id?", "validation_status?", "limit?", "offset?"]
    output: CmeAccreditation[]
    side_effects: []

  - method: GET
    path: /accreditations/{accreditationId}
    description: Read one accreditation with its awarded credits.
    roles: [ConferenceAdmin, ProgramChair, Author]
    success_code: 200
    input: []
    output: CmeAccreditation
    side_effects: []

  - method: POST
    path: /accreditations/{accreditationId}/validation
    description: |
      Content validation by a chair other than the deciding chair. VALIDATE
      debits the conference CME minute pool; REVOKE returns it exactly.
    roles: [ProgramChair]
    success_code: 200
    input: ["action", "rejection_reason?"]
    output: CmeAccreditation
    side_effects:
      - "VALIDATE: awarded_credits := per_abstract_award variant; Conference.cme_minutes_allocated += content_minutes; Conference.version += 1; owning Session's accredited_credit_total and accreditation_posture recomputed"
      - "REVOKE: awarded_credits := 0.00; the exact same minute count is returned to the pool; a cme_designated session may be forced PUBLISHED -> PLANNED"

  # --- DisclosureStatement ----------------------------------------------------
  - method: POST
    path: /disclosure-statements
    description: Author financial-relationship disclosure supporting an accreditation.
    roles: [Author, ConferenceAdmin]
    success_code: 201
    input: ["abstract_id", "accreditation_id", "author_id", "has_financial_relationship", "relationship_entity?"]
    output: DisclosureStatement
    side_effects:
      - "status := SUBMITTED; mitigation_required := has_financial_relationship; accreditation.commercial_bias_flag recomputed"

  - method: GET
    path: /disclosure-statements
    description: |
      Filtered disclosure list — reverse reachability for
      DisclosureStatement.abstract_id, accreditation_id and author_id.
    roles: [ConferenceAdmin, ProgramChair, Author]
    success_code: 200
    input: ["abstract_id?", "accreditation_id?", "author_id?", "status?", "limit?", "offset?"]
    output: DisclosureStatement[]
    side_effects: []

  - method: GET
    path: /disclosure-statements/{disclosureId}
    description: Read one disclosure statement.
    roles: [ConferenceAdmin, ProgramChair, Author]
    success_code: 200
    input: []
    output: DisclosureStatement
    side_effects: []

  - method: POST
    path: /disclosure-statements/{disclosureId}/adjudication
    description: |
      Chair adjudication of a disclosure. A post-hoc REJECTED outcome on an
      already VALIDATED disclosure starts the four-link CASCADE-A.
    roles: [ProgramChair]
    success_code: 200
    input: ["outcome", "rejection_reason?", "mitigation_completed?"]
    output: DisclosureStatement
    side_effects:
      - "VALIDATED: requires mitigation_completed when mitigation_required"
      - "REJECTED from VALIDATED: CASCADE-A revokes the accreditation, releases the CME minutes and can unpublish the session"
      - "accreditation.commercial_bias_flag recomputed"

  # --- ProgramChangeRequest ---------------------------------------------------
  - method: POST
    path: /program-change-requests
    description: |
      Late program change (MOVE, SWAP, SUBSTITUTE_PRESENTER, WITHDRAW). Quotes
      the pre_freeze_estimate fee variant.
    roles: [Author, ProgramChair]
    success_code: 201
    input: ["session_slot_id", "change_type", "requested_by_author_id?", "target_session_id?", "substitute_presenter_author_id?", "reason?"]
    output: ProgramChangeRequest
    side_effects:
      - "status := PENDING; submitted_at stamped from the logical clock; days_to_event frozen; estimated_fee_cents := pre_freeze_estimate"

  - method: GET
    path: /program-change-requests
    description: |
      Filtered change-request list — reverse reachability for
      ProgramChangeRequest.conference_id, session_slot_id,
      requested_by_author_id, target_session_id,
      substitute_presenter_author_id and approver_member_id.
    roles: [ConferenceAdmin, ProgramChair, Author]
    success_code: 200
    input: ["conference_id?", "session_slot_id?", "requested_by_author_id?", "target_session_id?", "substitute_presenter_author_id?", "approver_member_id?", "change_type?", "status?", "limit?", "offset?"]
    output: ProgramChangeRequest[]
    side_effects: []

  - method: GET
    path: /program-change-requests/{requestId}
    description: Read one change request with both fee variants side by side.
    roles: [ConferenceAdmin, ProgramChair, Author]
    success_code: 200
    input: []
    output: ProgramChangeRequest
    side_effects: []

  - method: POST
    path: /program-change-requests/{requestId}/adjudication
    description: |
      Chair approval or rejection. Approval charges the post_freeze_final fee
      variant and applies the structural change to the program.
    roles: [ProgramChair]
    success_code: 200
    input: ["outcome", "note?"]
    output: ProgramChangeRequest
    side_effects:
      - "APPROVED: final_fee_cents := post_freeze_final variant, rush_pct_applied recorded, approver_member_id set"
      - "APPROVED MOVE: slot SCHEDULED -> MOVED and a replacement SCHEDULED slot appears in the target session; both sessions' ledgers recomputed"
      - "APPROVED SWAP: the two slots exchange session_id and position and cross-reference each other via swapped_with_slot_id"
      - "APPROVED SUBSTITUTE_PRESENTER: SessionSlot.presenter_author_id replaced"
      - "APPROVED WITHDRAW: slot WITHDRAWN and its abstract runs CASCADE-B even after the program freeze"
      - "REJECTED: final_fee_cents := 0"

# =============================================================================
# §1.6 Error Code Catalog
# (grouped by §1.4 priority band; every code is reachable by at least one
#  §1.8/§1.9 instance)
# =============================================================================
errors:
  # -- band 1..3: authentication and identity ---------------------------------
  - id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    condition: "X-User-Role or X-User-ID absent/empty, or X-User-Role is not one of the five declared roles"
    applies_to: ["all endpoints"]
  - id: ERR_UNAUTHORIZED
    http_status: 403
    condition: "the presented role is not in the endpoint's roles list"
    applies_to: ["all endpoints"]
  - id: ERR_IDENTITY_NOT_FOUND
    http_status: 403
    condition: "X-User-ID does not resolve to the entity backing the claimed role, or resolves to a CommitteeMember whose member_role contradicts the claimed role"
    applies_to: ["all endpoints with an entity_backed role"]
  - id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    condition: "the resolved identity is not the abstract's submitting author, the review's assigned reviewer, the case's arbiter or the slot's presenter"
    applies_to: ["POST /abstracts/{abstractId}/revisions", "POST /abstracts/{abstractId}/status-transitions", "POST /reviews/{reviewId}/submission", "POST /reviews/{reviewId}/decline", "POST /discrepancy-cases/{caseId}/resolution", "POST /program-change-requests"]

  # -- band 4..5: existence ---------------------------------------------------
  - id: ERR_CONFERENCE_NOT_FOUND
    http_status: 404
    condition: "conferenceId path parameter or conference_id body field does not exist"
    applies_to: ["GET /conferences/{conferenceId}", "GET /conferences/{conferenceId}/capacity-summary", "POST /conferences/{conferenceId}/status-transitions", "POST /categories", "POST /committee-members", "POST /sessions", "POST /abstracts"]
  - id: ERR_CATEGORY_NOT_FOUND
    http_status: 404
    condition: "categoryId path parameter or category_id body field does not exist"
    applies_to: ["GET /categories/{categoryId}", "POST /abstracts"]
  - id: ERR_AUTHOR_NOT_FOUND
    http_status: 404
    condition: "authorId path parameter or an author-valued body field does not exist"
    applies_to: ["GET /authors/{authorId}", "POST /authors/{authorId}/registration", "POST /abstracts", "POST /sessions/{sessionId}/slots", "POST /disclosure-statements", "POST /program-change-requests"]
  - id: ERR_ABSTRACT_NOT_FOUND
    http_status: 404
    condition: "abstractId path parameter or abstract_id body field does not exist"
    applies_to: ["GET /abstracts/{abstractId}", "POST /abstracts/{abstractId}/revisions", "POST /abstracts/{abstractId}/status-transitions", "POST /abstracts/{abstractId}/decision", "POST /abstracts/{abstractId}/review-assignments", "POST /abstracts/{abstractId}/press-actions", "POST /sessions/{sessionId}/slots", "POST /accreditations", "POST /disclosure-statements"]
  - id: ERR_MEMBER_NOT_FOUND
    http_status: 404
    condition: "memberId path parameter or a member-valued body field does not exist"
    applies_to: ["GET /committee-members/{memberId}", "PATCH /committee-members/{memberId}", "POST /committee-members/{memberId}/status-transitions", "POST /conflict-declarations", "POST /abstracts/{abstractId}/review-assignments", "POST /discrepancy-cases/{caseId}/arbiter", "POST /sessions"]
  - id: ERR_DECLARATION_NOT_FOUND
    http_status: 404
    condition: "declarationId path parameter does not exist"
    applies_to: ["GET /conflict-declarations/{declarationId}"]
  - id: ERR_REVIEW_NOT_FOUND
    http_status: 404
    condition: "reviewId path parameter does not exist"
    applies_to: ["GET /reviews/{reviewId}", "POST /reviews/{reviewId}/submission", "POST /reviews/{reviewId}/decline"]
  - id: ERR_DISCREPANCY_CASE_NOT_FOUND
    http_status: 404
    condition: "caseId path parameter does not exist"
    applies_to: ["GET /discrepancy-cases/{caseId}", "POST /discrepancy-cases/{caseId}/arbiter", "POST /discrepancy-cases/{caseId}/resolution"]
  - id: ERR_SESSION_NOT_FOUND
    http_status: 404
    condition: "sessionId path parameter or target_session_id body field does not exist"
    applies_to: ["GET /sessions/{sessionId}", "POST /sessions/{sessionId}/status-transitions", "POST /sessions/{sessionId}/slots", "POST /program-change-requests"]
  - id: ERR_SLOT_NOT_FOUND
    http_status: 404
    condition: "slotId path parameter or session_slot_id body field does not exist"
    applies_to: ["GET /session-slots/{slotId}", "POST /session-slots/{slotId}/status-transitions", "POST /program-change-requests"]
  - id: ERR_ACCREDITATION_NOT_FOUND
    http_status: 404
    condition: "accreditationId path parameter or accreditation_id body field does not exist"
    applies_to: ["GET /accreditations/{accreditationId}", "POST /accreditations/{accreditationId}/validation", "POST /disclosure-statements"]
  - id: ERR_DISCLOSURE_NOT_FOUND
    http_status: 404
    condition: "disclosureId path parameter does not exist"
    applies_to: ["GET /disclosure-statements/{disclosureId}", "POST /disclosure-statements/{disclosureId}/adjudication"]
  - id: ERR_CHANGE_REQUEST_NOT_FOUND
    http_status: 404
    condition: "requestId path parameter does not exist"
    applies_to: ["GET /program-change-requests/{requestId}", "POST /program-change-requests/{requestId}/adjudication"]

  # -- band 7: schema ---------------------------------------------------------
  - id: ERR_VALIDATION
    http_status: 400
    condition: "missing required body field, wrong type, unknown enum member, string too long, rubric score outside 1..5, duration_minutes < 1, limit outside 1..100, offset < 0"
    applies_to: ["all POST/PATCH endpoints", "all list endpoints"]

  # -- band 8: optimistic concurrency ----------------------------------------
  - id: ERR_STALE_CONFERENCE_VERSION
    http_status: 412
    condition: "expected_conference_version != Conference.version"
    applies_to: ["POST /abstracts/{abstractId}/decision"]
  - id: ERR_STALE_SESSION_VERSION
    http_status: 412
    condition: "expected_session_version != Session.version"
    applies_to: ["POST /sessions/{sessionId}/slots"]

  # -- band 9..10: state ------------------------------------------------------
  - id: ERR_CONFERENCE_STATE_INVALID
    http_status: 409
    condition: "the Conference is not in a status that permits the operation, or the requested to_status has no transition from its current status"
    applies_to: ["POST /conferences/{conferenceId}/status-transitions", "POST /abstracts", "POST /abstracts/{abstractId}/revisions", "POST /abstracts/{abstractId}/status-transitions", "POST /abstracts/{abstractId}/decision", "POST /abstracts/{abstractId}/review-assignments", "POST /reviews/{reviewId}/submission", "POST /reviews/{reviewId}/decline", "POST /sessions", "POST /sessions/{sessionId}/status-transitions", "POST /program-change-requests"]
  - id: ERR_ABSTRACT_STATE_INVALID
    http_status: 409
    condition: "the Abstract's status has no transition to the requested to_status, or a dependent operation requires a status it is not in"
    applies_to: ["POST /abstracts/{abstractId}/revisions", "POST /abstracts/{abstractId}/status-transitions", "POST /abstracts/{abstractId}/decision", "POST /abstracts/{abstractId}/review-assignments", "POST /abstracts/{abstractId}/press-actions", "POST /sessions/{sessionId}/slots", "POST /accreditations"]
  - id: ERR_REVIEW_STATE_INVALID
    http_status: 409
    condition: "the Review is not ASSIGNED, or its assigned_round no longer matches the abstract's revision_round"
    applies_to: ["POST /reviews/{reviewId}/submission", "POST /reviews/{reviewId}/decline"]
  - id: ERR_MEMBER_STATE_INVALID
    http_status: 409
    condition: "the CommitteeMember's status has no transition to the requested to_status, or an operation requires an ACTIVE member"
    applies_to: ["POST /committee-members/{memberId}/status-transitions", "POST /abstracts/{abstractId}/review-assignments", "POST /discrepancy-cases/{caseId}/arbiter", "POST /sessions"]
  - id: ERR_CASE_STATE_INVALID
    http_status: 409
    condition: "the DiscrepancyCase is not OPEN when an arbiter is assigned, or not ARBITER_ASSIGNED/ESCALATED when a resolution is posted"
    applies_to: ["POST /discrepancy-cases/{caseId}/arbiter", "POST /discrepancy-cases/{caseId}/resolution"]
  - id: ERR_SESSION_STATE_INVALID
    http_status: 409
    condition: "the Session's status has no transition to the requested to_status, or slot creation is attempted on a session that is not PLANNED"
    applies_to: ["POST /sessions/{sessionId}/status-transitions", "POST /sessions/{sessionId}/slots", "POST /program-change-requests/{requestId}/adjudication"]
  - id: ERR_SLOT_STATE_INVALID
    http_status: 409
    condition: "the SessionSlot is not SCHEDULED, its session has not started/ended as the requested outcome requires, or the slot's status has no transition to the requested to_status"
    applies_to: ["POST /session-slots/{slotId}/status-transitions", "POST /program-change-requests", "POST /program-change-requests/{requestId}/adjudication"]
  - id: ERR_ACCREDITATION_STATE_INVALID
    http_status: 409
    condition: "the CmeAccreditation is not PENDING for VALIDATE/REJECT or not VALIDATED for REVOKE, or a second live accreditation is opened for the same abstract"
    applies_to: ["POST /accreditations", "POST /accreditations/{accreditationId}/validation", "POST /disclosure-statements"]
  - id: ERR_DISCLOSURE_STATE_INVALID
    http_status: 409
    condition: "the DisclosureStatement is already REJECTED, or an outcome of VALIDATED is posted to a VALIDATED row"
    applies_to: ["POST /disclosure-statements/{disclosureId}/adjudication"]
  - id: ERR_CHANGE_REQUEST_STATE_INVALID
    http_status: 409
    condition: "the ProgramChangeRequest is not PENDING, or another PENDING request already exists for the same slot"
    applies_to: ["POST /program-change-requests", "POST /program-change-requests/{requestId}/adjudication"]

  # -- band 11: conflict of interest / segregation of duties -----------------
  - id: ERR_REVIEWER_CONFLICT
    http_status: 409
    condition: "the candidate reviewer has a matching ConflictDeclaration against the abstract's author set, or is themself an author/coauthor of the abstract"
    applies_to: ["POST /abstracts/{abstractId}/review-assignments"]
  - id: ERR_ARBITER_CONFLICT
    http_status: 409
    condition: "the proposed arbiter already submitted a review on the abstract, or holds a matching ConflictDeclaration against its authors"
    applies_to: ["POST /discrepancy-cases/{caseId}/arbiter"]
  - id: ERR_SEGREGATION_VIOLATION
    http_status: 409
    condition: "the chair issuing the decision has a SUBMITTED review on that abstract"
    applies_to: ["POST /abstracts/{abstractId}/decision"]
  - id: ERR_ACCREDITATION_SELF_VALIDATION
    http_status: 409
    condition: "the chair validating the accreditation is the same member recorded in Abstract.decided_by_member_id"
    applies_to: ["POST /accreditations/{accreditationId}/validation"]

  # -- band 12..13: author sanction and disclosure completeness --------------
  - id: ERR_AUTHOR_BARRED
    http_status: 403
    condition: "the acting or referenced Author has sanction_status == BARRED"
    applies_to: ["POST /abstracts", "POST /abstracts/{abstractId}/status-transitions", "POST /sessions/{sessionId}/slots"]
  - id: ERR_DISCLOSURE_INCOMPLETE
    http_status: 409
    condition: "the accreditation has no disclosure, has a non-VALIDATED disclosure, or commercial_bias_flag is true; or a disclosure requiring mitigation is adjudicated VALIDATED without mitigation_completed"
    applies_to: ["POST /accreditations/{accreditationId}/validation", "POST /disclosure-statements/{disclosureId}/adjudication"]

  # -- band 14: referential coherence ---------------------------------------
  - id: ERR_CATEGORY_CONFERENCE_MISMATCH
    http_status: 422
    condition: "SubmissionCategory.conference_id != the submitted conference_id"
    applies_to: ["POST /abstracts"]
  - id: ERR_DISCLOSURE_ABSTRACT_MISMATCH
    http_status: 422
    condition: "the disclosure's abstract_id differs from its accreditation's abstract_id"
    applies_to: ["POST /disclosure-statements"]
  - id: ERR_FORMAT_NOT_ALLOWED
    http_status: 422
    condition: "the requested or decided format is not in SubmissionCategory.allowed_formats"
    applies_to: ["POST /abstracts", "POST /abstracts/{abstractId}/decision"]
  - id: ERR_SESSION_THEME_MISMATCH
    http_status: 422
    condition: "Session.theme_code is not one of the abstract's keywords"
    applies_to: ["POST /sessions/{sessionId}/slots", "POST /program-change-requests/{requestId}/adjudication"]
  - id: ERR_SESSION_FORMAT_MISMATCH
    http_status: 422
    condition: "Session.format != Abstract.decision"
    applies_to: ["POST /sessions/{sessionId}/slots", "POST /program-change-requests/{requestId}/adjudication"]
  - id: ERR_PRESENTER_NOT_ON_ABSTRACT
    http_status: 422
    condition: "presenter_author_id (or substitute_presenter_author_id) is neither the submitting author nor the holder of a coauthor email"
    applies_to: ["POST /sessions/{sessionId}/slots", "POST /program-change-requests"]
  - id: ERR_CATEGORY_NOT_CME_ELIGIBLE
    http_status: 422
    condition: "an accreditation is opened on an abstract whose category has cme_eligible == false"
    applies_to: ["POST /accreditations"]

  # -- band 15: temporal ----------------------------------------------------
  - id: ERR_CFA_DEADLINE_PASSED
    http_status: 422
    condition: "the logical clock is past Conference.abstract_deadline_utc at submission, or past review_deadline_utc at revision"
    applies_to: ["POST /abstracts", "POST /abstracts/{abstractId}/revisions"]
  - id: ERR_REVIEW_PAST_DUE
    http_status: 422
    condition: "the logical clock is strictly after Review.due_utc at submission"
    applies_to: ["POST /reviews/{reviewId}/submission"]
  - id: ERR_PROGRAM_FROZEN
    http_status: 409
    condition: "a structural program change is attempted at or after Conference.program_freeze_utc without an APPLIED ProgramChangeRequest"
    applies_to: ["POST /sessions/{sessionId}/slots", "POST /sessions/{sessionId}/status-transitions", "POST /abstracts/{abstractId}/status-transitions"]
  - id: ERR_EMBARGO_WINDOW_INVALID
    http_status: 422
    condition: "embargo_until_utc is missing, at/before the logical clock, or after Conference.event_end_utc"
    applies_to: ["POST /abstracts/{abstractId}/press-actions"]
  - id: ERR_INVALID_DATE_RANGE
    http_status: 422
    condition: "conference or session datetime ordering is violated (end <= start, deadline after event start, freeze outside the review..event window, session window outside the event window)"
    applies_to: ["POST /conferences", "POST /sessions"]

  # -- band 16: formatting --------------------------------------------------
  - id: ERR_ABSTRACT_FORMAT_INVALID
    http_status: 422
    condition: "body_word_count > category.max_word_count, or body_structured false while the category requires a structured body"
    applies_to: ["POST /abstracts", "POST /abstracts/{abstractId}/revisions"]

  # -- band 17: review workflow --------------------------------------------
  - id: ERR_INSUFFICIENT_REVIEWS
    http_status: 409
    condition: "Abstract.submitted_review_count < category.min_reviews_required at decision time"
    applies_to: ["POST /abstracts/{abstractId}/decision"]
  - id: ERR_OPEN_DISCREPANCY
    http_status: 409
    condition: "a non-terminal DiscrepancyCase exists for the abstract (decision, revision request) or anywhere in the conference (review close)"
    applies_to: ["POST /abstracts/{abstractId}/decision", "POST /abstracts/{abstractId}/status-transitions", "POST /conferences/{conferenceId}/status-transitions"]
  - id: ERR_DUPLICATE_REVIEW_ASSIGNMENT
    http_status: 409
    condition: "the named reviewer already holds an ASSIGNED or SUBMITTED review on this abstract"
    applies_to: ["POST /abstracts/{abstractId}/review-assignments"]
  - id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    condition: "a third revision round is requested or submitted (revision_round would exceed 2)"
    applies_to: ["POST /abstracts/{abstractId}/status-transitions", "POST /abstracts/{abstractId}/revisions"]
  - id: ERR_CFA_EXTENSION_LIMIT
    http_status: 409
    condition: "a second CFA_CLOSED -> CFA_OPEN extension is requested"
    applies_to: ["POST /conferences/{conferenceId}/status-transitions"]
  - id: ERR_REVIEW_REOPEN_LIMIT
    http_status: 409
    condition: "a second REVIEW_CLOSED -> REVIEW_OPEN reopen is requested"
    applies_to: ["POST /conferences/{conferenceId}/status-transitions"]
  - id: ERR_OVERRIDE_NOT_PERMITTED
    http_status: 409
    condition: "CHAIR_OVERRIDE is posted from ARBITER_ASSIGNED while spread_at_open >= 2 * category.discrepancy_threshold (a third review is mandatory)"
    applies_to: ["POST /discrepancy-cases/{caseId}/resolution"]
  - id: ERR_NO_ELIGIBLE_REVIEWER
    http_status: 422
    condition: "reviewer_selection_by_expertise finds no eligible candidate for an explicit selector assignment or a THIRD_REVIEW resolution"
    applies_to: ["POST /abstracts/{abstractId}/review-assignments", "POST /discrepancy-cases/{caseId}/resolution"]
  - id: ERR_UNDECIDED_ABSTRACTS_REMAIN
    http_status: 409
    condition: "DECISIONS_RELEASED is requested while at least one abstract of the conference is still SCORED"
    applies_to: ["POST /conferences/{conferenceId}/status-transitions"]
  - id: ERR_COI_NOT_DECLARED
    http_status: 409
    condition: "a member is activated with no ConflictDeclaration on file"
    applies_to: ["POST /committee-members/{memberId}/status-transitions"]
  - id: ERR_MEMBER_STILL_CHAIRING
    http_status: 409
    condition: "resignation is requested while the member still chairs a PLANNED, PUBLISHED or LOCKED session"
    applies_to: ["POST /committee-members/{memberId}/status-transitions"]
  - id: ERR_EMPTY_SESSION
    http_status: 409
    condition: "PUBLISHED is requested for a session with slot_count == 0"
    applies_to: ["POST /sessions/{sessionId}/status-transitions"]
  - id: ERR_SESSION_NOT_ACCREDITED
    http_status: 409
    condition: "PUBLISHED is requested for a cme_designated session whose accreditation_posture is NON_COMPLIANT"
    applies_to: ["POST /sessions/{sessionId}/status-transitions"]
  - id: ERR_NOT_NEWSWORTHY
    http_status: 422
    condition: "SET_EMBARGO is posted for an abstract with is_newsworthy == false"
    applies_to: ["POST /abstracts/{abstractId}/press-actions"]
  - id: ERR_EMBARGO_NOT_SET
    http_status: 409
    condition: "RELEASE is posted while embargo_status == NONE"
    applies_to: ["POST /abstracts/{abstractId}/press-actions"]

  # -- band 18: resource-temporal exclusivity ------------------------------
  - id: ERR_ROOM_TIME_CONFLICT
    http_status: 409
    condition: "session_room_overlap finds a half-open interval collision in the same room"
    applies_to: ["POST /sessions"]
  - id: ERR_CHAIR_TIME_CONFLICT
    http_status: 409
    condition: "session_chair_overlap finds a collision once the chair's intervals are inflated by the 15-minute turnaround"
    applies_to: ["POST /sessions"]
  - id: ERR_PRESENTER_TIME_CONFLICT
    http_status: 409
    condition: "session_presenter_overlap finds a fully-closed interval collision for the presenter, including exactly touching endpoints"
    applies_to: ["POST /sessions/{sessionId}/slots"]

  # -- band 19: session packing -------------------------------------------
  - id: ERR_SESSION_SLOT_CAPACITY_REACHED
    http_status: 422
    condition: "Session.slot_count == Session.capacity_slots"
    applies_to: ["POST /sessions/{sessionId}/slots", "POST /program-change-requests/{requestId}/adjudication"]
  - id: ERR_DUPLICATE_SLOT_POSITION
    http_status: 422
    condition: "another counted slot of the session already occupies the requested position"
    applies_to: ["POST /sessions/{sessionId}/slots"]
  - id: ERR_SESSION_DURATION_EXCEEDED
    http_status: 422
    condition: "session_packing rejects the new duration once the buffer and changeover gaps are added"
    applies_to: ["POST /sessions/{sessionId}/slots"]

  # -- band 20..21: registration and quota ceilings -----------------------
  - id: ERR_AUTHOR_NOT_REGISTERED
    http_status: 422
    condition: "ACCEPTED -> CONFIRMED is attempted while Author.is_registered is false"
    applies_to: ["POST /abstracts/{abstractId}/status-transitions"]
  - id: ERR_FORMAT_CAPACITY_EXHAUSTED
    http_status: 422
    condition: "the waterfall cannot place the abstract: WORKSHOP is full, or downgrade is disallowed and the requested format is full"
    applies_to: ["POST /abstracts/{abstractId}/decision"]
  - id: ERR_CME_POOL_EXHAUSTED
    http_status: 422
    condition: "content_minutes > Conference.cme_minutes_available at validation time"
    applies_to: ["POST /accreditations/{accreditationId}/validation"]
  - id: ERR_REVIEWER_LOAD_EXCEEDED
    http_status: 422
    condition: "the named reviewer's current_review_load already equals max_review_load"
    applies_to: ["POST /abstracts/{abstractId}/review-assignments"]

# =============================================================================
# §1.7 RBAC Permission Matrix
# =============================================================================
roles:
  - name: ConferenceAdmin
    description: |
      Conference operations staff. Owns the conference lifecycle, the category
      catalog, committee recruitment, author registration and the logical clock.
      Deliberately CANNOT touch review content or decisions.
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /conferences"
      - "POST /conferences/{conferenceId}/status-transitions"
      - "POST /categories"
      - "POST /committee-members"
      - "PATCH /committee-members/{memberId}"
    shared_operations:
      - "POST /authors and POST /authors/{authorId}/registration (with Author)"
      - "POST /committee-members/{memberId}/status-transitions (with ProgramChair, Reviewer)"
      - "POST /conflict-declarations (with ProgramChair, Reviewer)"
      - "POST /accreditations (with ProgramChair)"
      - "POST /disclosure-statements (with Author)"
      - "POST /sessions/{sessionId}/status-transitions and POST /session-slots/{slotId}/status-transitions (with ProgramChair)"
      - "all GET endpoints"

  - name: ProgramChair
    description: |
      A CommitteeMember with member_role == CHAIR. Runs review assignment,
      discrepancy arbitration, decisions, session construction, accreditation
      validation, disclosure adjudication and change-request approval. Subject to
      segregation of duties: a chair who reviewed an abstract cannot decide it,
      and the chair who decided it cannot validate its accreditation.
    identity: "entity_backed:CommitteeMember"
    exclusive_operations:
      - "POST /abstracts/{abstractId}/decision"
      - "POST /abstracts/{abstractId}/review-assignments"
      - "POST /discrepancy-cases/{caseId}/arbiter"
      - "POST /discrepancy-cases/{caseId}/resolution"
      - "POST /sessions"
      - "POST /sessions/{sessionId}/slots"
      - "POST /accreditations/{accreditationId}/validation"
      - "POST /disclosure-statements/{disclosureId}/adjudication"
      - "POST /program-change-requests/{requestId}/adjudication"
    shared_operations:
      - "POST /abstracts/{abstractId}/status-transitions (with Author)"
      - "POST /reviews/{reviewId}/submission and POST /reviews/{reviewId}/decline (with Reviewer — only for reviews assigned to this member)"
      - "POST /program-change-requests (with Author)"
      - "POST /accreditations (with ConferenceAdmin)"
      - "POST /sessions/{sessionId}/status-transitions and POST /session-slots/{slotId}/status-transitions (with ConferenceAdmin)"
      - "POST /committee-members/{memberId}/status-transitions and POST /conflict-declarations (with ConferenceAdmin, Reviewer)"
      - "all GET endpoints except GET /authors is limited to ConferenceAdmin, ProgramChair and PressOfficer"

  - name: Reviewer
    description: |
      A CommitteeMember with member_role == REVIEWER. May only act on reviews
      assigned to them, declare their own conflicts and manage their own
      membership status.
    identity: "entity_backed:CommitteeMember"
    exclusive_operations: []
    shared_operations:
      - "POST /reviews/{reviewId}/submission and POST /reviews/{reviewId}/decline (with ProgramChair; ownership enforced)"
      - "POST /conflict-declarations and POST /committee-members/{memberId}/status-transitions (with ConferenceAdmin, ProgramChair)"
      - "GET /conferences, /categories, /abstracts, /committee-members, /conflict-declarations, /reviews, /sessions, /session-slots"

  - name: Author
    description: |
      A submitting or co-presenting author. May submit and revise abstracts,
      confirm or withdraw their own accepted work, register for the event, file
      disclosures and request late program changes.
    identity: "entity_backed:Author"
    exclusive_operations:
      - "POST /abstracts"
      - "POST /abstracts/{abstractId}/revisions"
    shared_operations:
      - "POST /authors and POST /authors/{authorId}/registration (with ConferenceAdmin)"
      - "POST /abstracts/{abstractId}/status-transitions (with ProgramChair; ownership enforced)"
      - "POST /disclosure-statements (with ConferenceAdmin)"
      - "POST /program-change-requests (with ProgramChair; ownership enforced)"
      - "GET /conferences, /categories, /authors/{authorId}, /abstracts, /sessions, /session-slots, /accreditations, /disclosure-statements, /program-change-requests"

  - name: PressOfficer
    description: |
      Communications staff. Sole holder of the embargo dimension: sets embargoes
      on newsworthy findings and records outlet releases, which land in RELEASED
      or BREACHED purely on the logical clock. Cannot touch review, decision or
      program data.
    identity: opaque
    exclusive_operations:
      - "POST /abstracts/{abstractId}/press-actions"
    shared_operations:
      - "GET /conferences, /categories, /authors, /abstracts, /sessions, /session-slots"
