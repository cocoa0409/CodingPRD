              as_user_id: "so-alpha"
              captures: { j1_id: $.data.id, j1_v: $.data.version }
            - call: "POST /dog-shows/shows"
              payload: { club_id: "${club_id}", show_name: "Autumn Classic", show_date: "2026-09-12", show_type: "CONFORMATION", venue_name: "Northshore Park", outdoor_venue: false, entry_open_at: "2026-08-05T00:00:00Z", entry_close_at: "2026-09-01T23:59:59Z", max_total_entries: 100, championship_points_scale: "SCALE_A" }
              as: ClubOfficer
              as_user_id: "${club_id}"
              captures: { show_id: $.data.id }
          trigger:
            - call: "POST /dog-shows/shows/${show_id}/temperature-readings"
              payload: { recorded_temp_c: 29.0, relative_humidity_pct: 65 }
