      - name: slot_buffer_minutes_opens_a_gap_that_belongs_to_no_slot
        claim_type: interval_merge
        grounds:
          - calculations.slot_window_assignment.formula
          - entities.SelectionEvent.fields.slot_buffer_minutes
        distinguishing_aspect: |
          slot_start advances by (slot_minutes + slot_buffer_minutes) per rank
          while slot_end is only slot_start + slot_minutes, so consecutive slots
          are DISJOINT with a real gap rather than adjacent. With slot_minutes 60
          and slot_buffer_minutes 30, slot 0 is [00:00, 01:00) and slot 1 is
          [01:30, 02:30) — the interval [01:00, 01:30) belongs to nobody. An
          implementation that adds the buffer to slot_end, or that ignores it,
          produces [01:00, 02:00) or [01:00, 02:30).
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00.000Z."
            - "Donor P at certified_points 25.00 (2000000 cents RECEIVED) and Donor Q at certified_points 15.00 (1000000 cents RECEIVED), so P ranks 1 and Q ranks 2."
