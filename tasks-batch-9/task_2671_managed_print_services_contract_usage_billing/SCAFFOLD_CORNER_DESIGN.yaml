        excluded_because:
          difficulty_instance: compensating_invariant / void_newest_read_restores_device_meter_watermarks_and_lifetime_counters
          rationale: "The named §1.8 instance asserts the full undo: watermarks, lifetime counters, toner level and the cascaded order cancellation all return to their pre-acceptance values with no drift."

