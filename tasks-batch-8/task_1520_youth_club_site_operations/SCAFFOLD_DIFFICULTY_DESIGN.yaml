# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Youth Club Site Operations
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: meal_claim_provisional_includes_closed_final_requires_reconciled
        grounds:
          - calculations.meal_claim_reimbursement
          - state_machines.MealClaim.DRAFT_to_SUBMITTED
          - state_machines.ClubDay.CLOSED_to_RECONCILED
        distinguishing_aspect: |
          Dual-variant logic on the MealClaim (fiscal reimbursement) domain:
          identical raw meal-count data yields provisional_total_cents == 1486
          (CLOSED+RECONCILED days) but final_total_cents == 743 (RECONCILED
          only) because one counted day is CLOSED-but-not-RECONCILED at submit.
        test_recipe:
          setup:
            - "Site with default rates; 3 FREE-tier ACTIVE members with walker_ok=true"
            - "Day 2026-08-03 RECONCILED with BREAKFAST FREE count 3; day 2026-08-04 CLOSED (not reconciled) with BREAKFAST FREE count 3"
            - "August is summer: seasonal multiplier 1.10; per-line rounding: round(3 x 225 x 1.10) = round(742.5) = 743"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /sites"
              payload: { name: "Club A", youth_capacity: 60, standard_ratio: 15, elevated_ratio: 8, base_weekly_fee_cents: 5000, registration_fee_cents: 2500, max_arrears_cents: 10000, meal_rates_cents: { BREAKFAST: { FREE: 225, REDUCED: 195, PAID: 45 }, SNACK: { FREE: 110, REDUCED: 55, PAID: 15 }, SUPPER: { FREE: 315, REDUCED: 275, PAID: 55 } } }
              as: PlatformAdmin
              captures: { site_id: $.data.id }
            - call: "POST /staff"
              payload: { site_id: "${site_id}", full_name: "Dir One", position: "DIRECTOR" }
              as: PlatformAdmin
              captures: { dir_id: $.data.id }
            - { call: "POST /staff/${dir_id}/credentials", payload: { kind: "BACKGROUND_CHECK", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /staff/${dir_id}/credentials", payload: { kind: "TRAINING", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /members"
              payload: { site_id: "${site_id}", legal_name: "Kid One", date_of_birth: "2012-05-01", grade: 7, household_size: 1, household_income_cents: 1000000, walker_ok: true }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { m1: $.data.id }
            - call: "POST /members"
              payload: { site_id: "${site_id}", legal_name: "Kid Two", date_of_birth: "2012-06-01", grade: 7, household_size: 1, household_income_cents: 1000000, walker_ok: true }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { m2: $.data.id }
            - call: "POST /members"
              payload: { site_id: "${site_id}", legal_name: "Kid Three", date_of_birth: "2012-07-01", grade: 7, household_size: 1, household_income_cents: 1000000, walker_ok: true }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { m3: $.data.id }
            - { call: "POST /members/${m1}/decide", payload: { decision: "APPROVE" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /members/${m2}/decide", payload: { decision: "APPROVE" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /members/${m3}/decide", payload: { decision: "APPROVE" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /club-days"
              payload: { site_id: "${site_id}", date: "2026-08-03" }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { d1: $.data.id }
            - call: "POST /attendance-records"
              payload: { club_day_id: "${d1}", member_id: "${m1}" }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { a1: $.data.id }
            - call: "POST /attendance-records"
              payload: { club_day_id: "${d1}", member_id: "${m2}" }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { a2: $.data.id }
            - call: "POST /attendance-records"
              payload: { club_day_id: "${d1}", member_id: "${m3}" }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { a3: $.data.id }
            - { call: "POST /club-days/${d1}/meal-counts", payload: { meal_type: "BREAKFAST", free_count: 3, reduced_count: 0, paid_count: 0 }, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /attendance-records/${a1}/sign-out", payload: { sign_out_type: "WALKER" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /attendance-records/${a2}/sign-out", payload: { sign_out_type: "WALKER" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /attendance-records/${a3}/sign-out", payload: { sign_out_type: "WALKER" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /club-days/${d1}/close", payload: {}, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /club-days/${d1}/reconcile", payload: {}, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /club-days"
              payload: { site_id: "${site_id}", date: "2026-08-04" }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { d2: $.data.id }
            - call: "POST /attendance-records"
              payload: { club_day_id: "${d2}", member_id: "${m1}" }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { b1: $.data.id }
            - call: "POST /attendance-records"
              payload: { club_day_id: "${d2}", member_id: "${m2}" }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { b2: $.data.id }
            - call: "POST /attendance-records"
              payload: { club_day_id: "${d2}", member_id: "${m3}" }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { b3: $.data.id }
            - { call: "POST /club-days/${d2}/meal-counts", payload: { meal_type: "BREAKFAST", free_count: 3, reduced_count: 0, paid_count: 0 }, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /attendance-records/${b1}/sign-out", payload: { sign_out_type: "WALKER" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /attendance-records/${b2}/sign-out", payload: { sign_out_type: "WALKER" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /attendance-records/${b3}/sign-out", payload: { sign_out_type: "WALKER" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /club-days/${d2}/close", payload: {}, as: SiteDirector, as_user_id: "${dir_id}" }
            - call: "POST /meal-claims"
              payload: { site_id: "${site_id}", claim_month: "2026-08" }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - { call: "POST /meal-claims/${claim_id}/submit", payload: {}, as: SiteDirector, as_user_id: "${dir_id}" }
          assert:
            - "MealClaim.${claim_id}.provisional_total_cents == 1486  (two days x round(3 x 225 x 1.10)=743)"
            - "MealClaim.${claim_id}.final_total_cents == 743  (only the RECONCILED day counts)"
            - "MealClaim.${claim_id}.final_total_cents != MealClaim.${claim_id}.provisional_total_cents"
            - "MealClaim.${claim_id}.status == SUBMITTED and submitted_by_user_id == ${dir_id}"

      - name: funder_report_attendance_rate_enrollment_vs_capacity_basis
        grounds:
          - calculations.attendance_rate
          - entities.FunderReport.fields.headline_attendance_rate
        distinguishing_aspect: |
          Dual-variant logic on the FunderReport (outcome measurement) domain —
          a different entity domain than MealClaim: identical attendance inputs
          yield attendance_rate_enrollment_basis == 0.5833 (denominator 12
          enrolled member-days) vs attendance_rate_capacity_basis == 0.0389
          (denominator 60 capacity x 3 days), and funder_type=UNITED_WAY selects
          the enrollment basis as headline.
        test_recipe:
          setup:
            - "Site capacity 60; 4 ACTIVE members approved 2026-08-01 (before all days)"
            - "Days 08-03 (4 sign-ins), 08-04 (2 sign-ins), 08-05 (1 sign-in), all CLOSED"
            - "member_days_attended = 7; member_days_enrolled = 4 x 3 = 12; capacity denominator = 180"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /sites"
              payload: { name: "Club B", youth_capacity: 60, standard_ratio: 15, elevated_ratio: 8, base_weekly_fee_cents: 5000, registration_fee_cents: 2500, max_arrears_cents: 10000, meal_rates_cents: { BREAKFAST: { FREE: 225, REDUCED: 195, PAID: 45 }, SNACK: { FREE: 110, REDUCED: 55, PAID: 15 }, SUPPER: { FREE: 315, REDUCED: 275, PAID: 55 } } }
              as: PlatformAdmin
              captures: { site_id: $.data.id }
            - call: "POST /staff"
              payload: { site_id: "${site_id}", full_name: "Dir One", position: "DIRECTOR" }
              as: PlatformAdmin
              captures: { dir_id: $.data.id }
            - { call: "POST /staff/${dir_id}/credentials", payload: { kind: "BACKGROUND_CHECK", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /staff/${dir_id}/credentials", payload: { kind: "TRAINING", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /members"
              payload: { site_id: "${site_id}", legal_name: "Kid A", date_of_birth: "2012-01-01", grade: 7, household_size: 1, household_income_cents: 1000000, walker_ok: true }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { m1: $.data.id }
            - call: "POST /members"
              payload: { site_id: "${site_id}", legal_name: "Kid B", date_of_birth: "2012-02-01", grade: 7, household_size: 1, household_income_cents: 1000000, walker_ok: true }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { m2: $.data.id }
            - call: "POST /members"
              payload: { site_id: "${site_id}", legal_name: "Kid C", date_of_birth: "2012-03-01", grade: 7, household_size: 1, household_income_cents: 1000000, walker_ok: true }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { m3: $.data.id }
            - call: "POST /members"
              payload: { site_id: "${site_id}", legal_name: "Kid D", date_of_birth: "2012-04-01", grade: 7, household_size: 1, household_income_cents: 1000000, walker_ok: true }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { m4: $.data.id }
            - { call: "POST /members/${m1}/decide", payload: { decision: "APPROVE" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /members/${m2}/decide", payload: { decision: "APPROVE" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /members/${m3}/decide", payload: { decision: "APPROVE" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /members/${m4}/decide", payload: { decision: "APPROVE" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /club-days"
              payload: { site_id: "${site_id}", date: "2026-08-03" }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { d1: $.data.id }
            - { call: "POST /attendance-records", payload: { club_day_id: "${d1}", member_id: "${m1}" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /attendance-records", payload: { club_day_id: "${d1}", member_id: "${m2}" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /attendance-records", payload: { club_day_id: "${d1}", member_id: "${m3}" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /attendance-records", payload: { club_day_id: "${d1}", member_id: "${m4}" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /club-days/${d1}/close", payload: {}, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /club-days"
              payload: { site_id: "${site_id}", date: "2026-08-04" }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { d2: $.data.id }
            - { call: "POST /attendance-records", payload: { club_day_id: "${d2}", member_id: "${m1}" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /attendance-records", payload: { club_day_id: "${d2}", member_id: "${m2}" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /club-days/${d2}/close", payload: {}, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /club-days"
              payload: { site_id: "${site_id}", date: "2026-08-05" }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { d3: $.data.id }
            - { call: "POST /attendance-records", payload: { club_day_id: "${d3}", member_id: "${m1}" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /club-days/${d3}/close", payload: {}, as: SiteDirector, as_user_id: "${dir_id}" }
          trigger:
            - call: "POST /funder-reports"
              payload: { site_id: "${site_id}", report_month: "2026-08", funder_type: "UNITED_WAY" }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { rep_id: $.data.id }
          assert:
            - "FunderReport.${rep_id}.operating_days == 3"
            - "FunderReport.${rep_id}.member_days_attended == 7"
            - "FunderReport.${rep_id}.member_days_enrolled == 12"
            - "FunderReport.${rep_id}.attendance_rate_enrollment_basis == 0.5833  (7/12, 4dp round_half_up)"
            - "FunderReport.${rep_id}.attendance_rate_capacity_basis == 0.0389  (7/180, 4dp round_half_up)"
            - "FunderReport.${rep_id}.headline_attendance_rate == 0.5833  (UNITED_WAY selects enrollment basis)"
            - "FunderReport.${rep_id}.average_daily_attendance == 2.3333  (7/3)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: scholarship_disbursement_nested_min_weekly_cap_then_annual_cap
        grounds:
          - calculations.weekly_fee_assessment
          - state_machines.ScholarshipAward.ACTIVE_to_EXHAUSTED
        distinguishing_aspect: |
          Mode (a) combinatorial: weekly disbursement = min(weekly_cap_cents,
          remaining_cap_cents, round_half_up(gross x discount_pct)) — a nested
          min over 3 inputs whose binding input changes across weeks: week 1
          and 2 bind on weekly_cap (2000 < 3000), week 3 binds on
          remaining_cap (1000 < 2000), then the award auto-EXHAUSTs.
        test_recipe:
          setup:
            - "PAID member (weekly_fee 5000), fund budget 100000, award discount 0.60, weekly_cap 2000, annual_cap 5000, ACTIVATED"
            - "Fridays 2026-08-07 / 08-14 / 08-21 each closed (site fee_accrual_weekday defaults to 5=Friday)"
            - "discount_amount = round(5000 x 0.60) = 3000 each week"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /sites"
              payload: { name: "Club C", youth_capacity: 60, standard_ratio: 15, elevated_ratio: 8, base_weekly_fee_cents: 5000, registration_fee_cents: 2500, max_arrears_cents: 10000, meal_rates_cents: { BREAKFAST: { FREE: 225, REDUCED: 195, PAID: 45 }, SNACK: { FREE: 110, REDUCED: 55, PAID: 15 }, SUPPER: { FREE: 315, REDUCED: 275, PAID: 55 } } }
              as: PlatformAdmin
              captures: { site_id: $.data.id }
            - call: "POST /staff"
              payload: { site_id: "${site_id}", full_name: "Dir One", position: "DIRECTOR" }
              as: PlatformAdmin
              captures: { dir_id: $.data.id }
            - { call: "POST /staff/${dir_id}/credentials", payload: { kind: "BACKGROUND_CHECK", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /staff/${dir_id}/credentials", payload: { kind: "TRAINING", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /members"
              payload: { site_id: "${site_id}", legal_name: "Pay Kid", date_of_birth: "2011-01-01", grade: 8, household_size: 1, household_income_cents: 5000000 }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { m1: $.data.id }
            - { call: "POST /members/${m1}/decide", payload: { decision: "APPROVE" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - call: "POST /scholarship-funds"
              payload: { site_id: "${site_id}", name: "Fund C", budget_cents: 100000 }
              as: PlatformAdmin
              captures: { fund_id: $.data.id, fund_v: $.data.version }
            - call: "POST /scholarship-awards"
              payload: { fund_id: "${fund_id}", member_id: "${m1}", discount_pct: 0.60, weekly_cap_cents: 2000, annual_cap_cents: 5000 }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { aw1: $.data.id }
            - { call: "POST /scholarship-awards/${aw1}/activate", payload: { expected_fund_version: "${fund_v}" }, as: SiteDirector, as_user_id: "${dir_id}" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T16:00:00Z" }, as: PlatformAdmin }
            - call: "POST /club-days"
              payload: { site_id: "${site_id}", date: "2026-08-07" }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { w1: $.data.id }
            - { call: "POST /club-days/${w1}/close", payload: {}, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-14T16:00:00Z" }, as: PlatformAdmin }
            - call: "POST /club-days"
              payload: { site_id: "${site_id}", date: "2026-08-14" }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { w2: $.data.id }
            - { call: "POST /club-days/${w2}/close", payload: {}, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-21T16:00:00Z" }, as: PlatformAdmin }
            - call: "POST /club-days"
              payload: { site_id: "${site_id}", date: "2026-08-21" }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { w3: $.data.id }
            - { call: "POST /club-days/${w3}/close", payload: {}, as: SiteDirector, as_user_id: "${dir_id}" }
          assert:
            - "after close of 2026-08-07: Member.${m1}.fee_balance_cents == 5500  (2500 registration + 5000 gross - min(2000, 5000, 3000) = 2000)"
            - "after close of 2026-08-14: Member.${m1}.fee_balance_cents == 8500  (disbursement min(2000, 3000, 3000) = 2000)"
            - "after close of 2026-08-21: Member.${m1}.fee_balance_cents == 12500  (disbursement min(2000, 1000, 3000) = 1000)"
            - "ScholarshipAward.${aw1}.disbursed_cents == 5000 and remaining_cap_cents == 0 and status == EXHAUSTED"
            - "ScholarshipFund.${fund_id}: reserved_cents == 0, disbursed_cents == 5000, available_cents == 95000"
            - "ClubDay ${w1}/${w2}/${w3}.weekly_fees_accrued == true"

      - name: meal_claim_per_line_rounding_beats_sum_then_round
        grounds:
          - calculations.meal_claim_reimbursement
          - state_machines.MealClaim.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Mode (b) combinatorial — a DIFFERENT mode than the nested-min instance:
          rounding order is pinned per (day, meal_type, tier) line THEN summed.
          Two lines of round(3 x 225 x 1.10) = round(742.5) = 743 give a final of
          1486, whereas the forbidden sum-then-round order gives round(1485.0) =
          1485 — the one-cent delta is the observable.
        test_recipe:
          setup:
            - "Site default rates; 3 FREE-tier ACTIVE members with walker_ok=true"
            - "Days 2026-08-03 and 2026-08-04 BOTH RECONCILED, each BREAKFAST FREE count 3"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /sites"
              payload: { name: "Club D", youth_capacity: 60, standard_ratio: 15, elevated_ratio: 8, base_weekly_fee_cents: 5000, registration_fee_cents: 2500, max_arrears_cents: 10000, meal_rates_cents: { BREAKFAST: { FREE: 225, REDUCED: 195, PAID: 45 }, SNACK: { FREE: 110, REDUCED: 55, PAID: 15 }, SUPPER: { FREE: 315, REDUCED: 275, PAID: 55 } } }
              as: PlatformAdmin
              captures: { site_id: $.data.id }
            - call: "POST /staff"
              payload: { site_id: "${site_id}", full_name: "Dir One", position: "DIRECTOR" }
              as: PlatformAdmin
              captures: { dir_id: $.data.id }
            - { call: "POST /staff/${dir_id}/credentials", payload: { kind: "BACKGROUND_CHECK", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /staff/${dir_id}/credentials", payload: { kind: "TRAINING", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /members"
              payload: { site_id: "${site_id}", legal_name: "Kid One", date_of_birth: "2012-05-01", grade: 7, household_size: 1, household_income_cents: 1000000, walker_ok: true }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { m1: $.data.id }
            - call: "POST /members"
              payload: { site_id: "${site_id}", legal_name: "Kid Two", date_of_birth: "2012-06-01", grade: 7, household_size: 1, household_income_cents: 1000000, walker_ok: true }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { m2: $.data.id }
            - call: "POST /members"
              payload: { site_id: "${site_id}", legal_name: "Kid Three", date_of_birth: "2012-07-01", grade: 7, household_size: 1, household_income_cents: 1000000, walker_ok: true }
              as: SiteDirector
              as_user_id: "${dir_id}"
