              payload: { depository_id: "${dep_id}", custodian_id: "${cust_a}", beneficiary_type: "DEPOSIT_ACCOUNT", deposit_account_id: "${acct_a}", agreement_number: "AG-0001", governing_law_state: "OH" }
              as: BankCollateralOfficer
