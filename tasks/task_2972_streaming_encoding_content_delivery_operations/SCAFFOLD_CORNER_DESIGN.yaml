            - "filtered list: exactly 1 window returned and window[0].id == ${w_us}"
            - "both windows are in state SCHEDULED"

      - name: stale_package_repackage_without_a_rebind_is_rejected
        claim_type: conditional_action
        grounds:
          - endpoints.POST_/drm-packages/{id}/package
          - validations[priority=11]
          - errors[ERR_LADDER_NOT_LOCKED]
          - entities.DrmPackage.fields.stale_reason
        distinguishing_aspect: "A STALE package whose ladder was superseded cannot be repackaged by an empty body — that returns 409 ERR_LADDER_NOT_LOCKED because the bound ladder is now SUPERSEDED — and succeeds only when ladder_id names the Title's current LOCKED ladder, which also clears stale_reason back to NONE."
        test_recipe:
          setup:
            - "One ACTIVE DeviceProfile, one Title with a QC_PASSED asset, a first LOCKED ladder carrying a PACKAGED package, and a second LOCKED ladder of the same codec family whose lock superseded the first and drove the package STALE."
          setup_api_calls:
            - call: "POST /device-profiles"
              payload: { device_class: "MOBILE_HIGH", max_height_px: 1080, supported_codecs: ["H264"], min_bitrate_kbps: 500, max_bitrate_kbps: 8000, hdcp_required: false, required_drm_system: "NONE", market_share_pct: 45.00, quality_normalization_factor: 1.00 }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /titles"
              payload: { external_ref: "TTL-REBIND", title_name: "Rebind Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
