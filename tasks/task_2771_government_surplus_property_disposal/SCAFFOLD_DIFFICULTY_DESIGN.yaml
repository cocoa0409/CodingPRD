              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /screening-cycles/${cyc}/advance-tier"
              payload: {}
              as: DisposalOfficer
              as_user_id: "officer-01"
          assert:
            - "on creation: ScreeningCycle.${cyc}.current_tier == STATE_AGENCY, tier_opened_at == 2026-08-01T00:00:00Z, tier_deadline_at == 2026-08-06T00:00:00Z, tier_advance_count == 0, open_request_count == 0"
            - "the first advance at 2026-08-01T00:00:00Z returns 200 even though the window has 5 days left, because open_request_count == 0 — the empty-set branch of the disjunction"
            - "after the first advance: current_tier == LOCAL_GOVERNMENT, tier_advance_count == 1, tier_opened_at == 2026-08-01T00:00:00Z, tier_deadline_at == 2026-08-06T00:00:00Z"
            - "after r1 is filed: ScreeningCycle.${cyc}.open_request_count == 1 and ScreeningRequest.${r1}.tier_at_submission == LOCAL_GOVERNMENT"
            - "the advance at 2026-08-05T23:59:59Z returns 409 with error.code == ERR_TIER_WINDOW_OPEN — one second before the deadline is still inside the window"
            - "the refused advance changes nothing: current_tier == LOCAL_GOVERNMENT, tier_advance_count == 1, ScreeningCycle.${cyc}.version unchanged at 2"
            - "the advance at exactly 2026-08-06T00:00:00Z returns 200 — the gate is logical clock >= tier_deadline_at, so the deadline instant qualifies"
            - "after the second advance: current_tier == ELIGIBLE_NONPROFIT, tier_advance_count == 2, tier_opened_at == 2026-08-06T00:00:00Z, tier_deadline_at == 2026-08-11T00:00:00Z, version == 3"
            - "ScreeningRequest.${r1}.status == SUBMITTED and open_request_count == 1 after the tier moved on — advancing past a tier does not deny its pending requests"
            - "a new POST /screening-requests from CITY-77 now returns 409 ERR_TIER_PRIORITY_VIOLATION because the cycle screens ELIGIBLE_NONPROFIT"

      - name: bpc_federal_use_period_end_date_inclusive
        grounds:
          - calculations.federal_use_period_end
          - calculations.federal_use_period_end.constants.USE_PERIOD_MONTHS
          - validations[priority=50]
          - errors.ERR_FEDERAL_USE_PERIOD_ACTIVE
          - entities.SurplusAsset.fields.federal_use_period_end_on
        distinguishing_aspect: |
          Two date boundaries in one calculation: the disposal gate is inclusive on the end date, so
          2026-08-14 is refused and 2026-08-15 is admitted for a period ending 2026-08-15; and
          add_months clamps to the last valid day, so a VEHICLE whose period starts 2024-12-31 ends
          2026-06-30 rather than an invalid 2026-06-31 or a rolled-over 2026-07-01. This is a calendar
          boundary rather than the monetary rounding boundary in
          bpc_deposit_threshold_at_exactly_500000_reserve.
        test_recipe:
          setup:
            - "logical clock at 2026-08-14T00:00:00Z, later 2026-08-15T00:00:00Z"
            - "one STATE_AGENCY organization DOT-01 with an ACCEPTED turn-in holding two federally donated assets"
            - "asset F: IT_EQUIPMENT (12-month period), cost 1449920, acquired 2023-11-02, federal_source true, federal_use_period_start_on 2025-08-15; assessed C2 / functional / repair 0 -> fair_market_value_cents 985946"
            - "asset C: VEHICLE (18-month period), cost 3217467, acquired 2019-03-15, federal_source true, federal_use_period_start_on 2024-12-31; assessed C4 / functional / repair 185000 -> fair_market_value_cents 297620"
