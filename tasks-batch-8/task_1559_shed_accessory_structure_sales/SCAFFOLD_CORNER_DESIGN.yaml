# =============================================================================
# §1.9 Scaffold Corner Design — Shed & Accessory Structure Sales
# Breadth coverage of every §1.1–§1.7 claim NOT already probed by §1.8.
# Error-code cross-check: all 18 catalog errors are triggered either here or
# in §1.8 (window/crew conflict errors are triggered by §1.8 instances and
# stubbed below).
# Fixture math reference: see SCAFFOLD_DIFFICULTY_DESIGN.yaml header.
#   8x8 no-option CASH order: total 427200; deposit 85440.
#   8x8 + [WINDOW] CASH order: subtotal 421200, tax 22050, total 443250.
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: order_create_computed_input_ignored
        claim_type: computed_fields
        grounds: ["entities.Order.fields.area_sqft", "entities.Order.fields.quoted_total_cents"]
        distinguishing_aspect: "Client-supplied area_sqft / quoted_total_cents are ignored; the server computes both from configuration."
        test_recipe:
          setup: ["Jurisdiction, model, customer exist"]
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { name: "Marion County, IN", state_code: "IN", county_name: "Marion", permit_threshold_sqft: 120, setback_front_ft: 10, setback_side_ft: 5, setback_rear_ft: 5, max_building_height_ft: 12, anchoring_required: true, permit_base_fee_cents: 15000, permit_per_sqft_cents: 50, tax_rate_bp: 700 }
              as: PermitCoordinator
              captures: { jur_id: $.data.id }
            - call: "POST /api/models"
              payload: { name: "GardenPro", sku: "GP-01", min_width_ft: 8, max_width_ft: 16, min_depth_ft: 8, max_depth_ft: 24, wall_height_ft: 8, supported_delivery_modes: ["PRE_BUILT", "ON_SITE_BUILD"], base_price_cents: 300000, overage_rate_tier1_cents: 1500, overage_rate_tier2_cents: 2000 }
              as: SalesRep
              captures: { model_id: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", phone: "317-555-0100", street: "1200 Fern Ave", city: "Indianapolis", state_code: "IN", zip: "46201" }
              as: SalesRep
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /api/orders"
              payload: { customer_id: "${cust_id}", model_id: "${model_id}", jurisdiction_id: "${jur_id}", width_ft: 10, depth_ft: 12, delivery_mode: "PRE_BUILT", foundation_type: "GRAVEL_PAD", anchor_type: "AUGER_STRAP", purchase_type: "CASH", options: ["WINDOW"], area_sqft: 999, quoted_total_cents: 1 }
              as: SalesRep
              captures: { order_id: $.data.id }
          assert:
            - "Order.${order_id}.area_sqft == 120 (computed 10*12, not the smuggled 999)"
            - "Order.${order_id}.quoted_total_cents == 601490 (computed, not the smuggled 1)"

      - name: order_get_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "endpoints.GET_/api/orders/{orderId}"]
        distinguishing_aspect: "GET with a well-formed but non-existent id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/orders/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee"
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND and HTTP status == 404"

      - name: order_create_missing_required_model_id
        claim_type: required_fields
        grounds: ["endpoints.POST_/api/orders", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required model_id yields ERR_INVALID_REQUEST (400); other required fields behave identically."
        test_recipe:
          setup: ["Jurisdiction and customer exist; no model created"]
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { name: "Marion County, IN", state_code: "IN", county_name: "Marion", permit_threshold_sqft: 120, setback_front_ft: 10, setback_side_ft: 5, setback_rear_ft: 5, max_building_height_ft: 12, anchoring_required: true, permit_base_fee_cents: 15000, permit_per_sqft_cents: 50, tax_rate_bp: 700 }
              as: PermitCoordinator
              captures: { jur_id: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", phone: "317-555-0100", street: "1200 Fern Ave", city: "Indianapolis", state_code: "IN", zip: "46201" }
              as: SalesRep
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /api/orders"
              payload: { customer_id: "${cust_id}", jurisdiction_id: "${jur_id}", width_ft: 10, depth_ft: 12, delivery_mode: "PRE_BUILT", foundation_type: "GRAVEL_PAD", anchor_type: "AUGER_STRAP", purchase_type: "CASH" }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST and HTTP status == 400"

      - name: order_create_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: ["entities.Order.fields.delivery_mode", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "An enum value outside {PRE_BUILT, ON_SITE_BUILD} is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Jurisdiction, model, customer exist"]
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { name: "Marion County, IN", state_code: "IN", county_name: "Marion", permit_threshold_sqft: 120, setback_front_ft: 10, setback_side_ft: 5, setback_rear_ft: 5, max_building_height_ft: 12, anchoring_required: true, permit_base_fee_cents: 15000, permit_per_sqft_cents: 50, tax_rate_bp: 700 }
              as: PermitCoordinator
              captures: { jur_id: $.data.id }
            - call: "POST /api/models"
              payload: { name: "GardenPro", sku: "GP-01", min_width_ft: 8, max_width_ft: 16, min_depth_ft: 8, max_depth_ft: 24, wall_height_ft: 8, supported_delivery_modes: ["PRE_BUILT", "ON_SITE_BUILD"], base_price_cents: 300000, overage_rate_tier1_cents: 1500, overage_rate_tier2_cents: 2000 }
              as: SalesRep
              captures: { model_id: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", phone: "317-555-0100", street: "1200 Fern Ave", city: "Indianapolis", state_code: "IN", zip: "46201" }
              as: SalesRep
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /api/orders"
              payload: { customer_id: "${cust_id}", model_id: "${model_id}", jurisdiction_id: "${jur_id}", width_ft: 10, depth_ft: 12, delivery_mode: "HELICOPTER", foundation_type: "GRAVEL_PAD", anchor_type: "AUGER_STRAP", purchase_type: "CASH" }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST and HTTP status == 400"

      - name: order_defaults_applied
        claim_type: defaults
        grounds: ["entities.Order.fields.options", "entities.Order.fields.removal_requested", "entities.Order.fields.structure_state"]
        distinguishing_aspect: "Omitting optional fields yields documented defaults: options [], removal_requested false, structure_state NOT_INSTALLED, collected/refunded/retained 0."
        test_recipe:
          setup: ["Jurisdiction, model, customer exist"]
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { name: "Marion County, IN", state_code: "IN", county_name: "Marion", permit_threshold_sqft: 120, setback_front_ft: 10, setback_side_ft: 5, setback_rear_ft: 5, max_building_height_ft: 12, anchoring_required: true, permit_base_fee_cents: 15000, permit_per_sqft_cents: 50, tax_rate_bp: 700 }
              as: PermitCoordinator
              captures: { jur_id: $.data.id }
            - call: "POST /api/models"
              payload: { name: "GardenPro", sku: "GP-01", min_width_ft: 8, max_width_ft: 16, min_depth_ft: 8, max_depth_ft: 24, wall_height_ft: 8, supported_delivery_modes: ["PRE_BUILT", "ON_SITE_BUILD"], base_price_cents: 300000, overage_rate_tier1_cents: 1500, overage_rate_tier2_cents: 2000 }
              as: SalesRep
              captures: { model_id: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", phone: "317-555-0100", street: "1200 Fern Ave", city: "Indianapolis", state_code: "IN", zip: "46201" }
              as: SalesRep
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /api/orders"
              payload: { customer_id: "${cust_id}", model_id: "${model_id}", jurisdiction_id: "${jur_id}", width_ft: 8, depth_ft: 8, delivery_mode: "PRE_BUILT", foundation_type: "GRAVEL_PAD", anchor_type: "AUGER_STRAP", purchase_type: "CASH" }
              as: SalesRep
              captures: { order_id: $.data.id }
          assert:
            - "Order.${order_id}.options == [] and removal_requested == false"
            - "Order.${order_id}.structure_state == NOT_INSTALLED and site_prep_required == false"
            - "Order.${order_id}.collected_cents == 0 and refunded_cents == 0 and retained_cents == 0"
            - "Order.${order_id}.quoted_total_cents == 427200 (no-option 8x8 total)"

      - name: payment_immutable_record
        claim_type: immutability
        grounds: ["entities.Payment"]
        distinguishing_aspect: "Payment declares common_fields: false — rows carry id and created_at only, no version/updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["A CASH order in SITE_REVIEW with one payment recorded"]
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { name: "Marion County, IN", state_code: "IN", county_name: "Marion", permit_threshold_sqft: 120, setback_front_ft: 10, setback_side_ft: 5, setback_rear_ft: 5, max_building_height_ft: 12, anchoring_required: true, permit_base_fee_cents: 15000, permit_per_sqft_cents: 50, tax_rate_bp: 700 }
              as: PermitCoordinator
              captures: { jur_id: $.data.id }
            - call: "POST /api/models"
              payload: { name: "GardenPro", sku: "GP-01", min_width_ft: 8, max_width_ft: 16, min_depth_ft: 8, max_depth_ft: 24, wall_height_ft: 8, supported_delivery_modes: ["PRE_BUILT", "ON_SITE_BUILD"], base_price_cents: 300000, overage_rate_tier1_cents: 1500, overage_rate_tier2_cents: 2000 }
              as: SalesRep
              captures: { model_id: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", phone: "317-555-0100", street: "1200 Fern Ave", city: "Indianapolis", state_code: "IN", zip: "46201" }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /api/orders"
              payload: { customer_id: "${cust_id}", model_id: "${model_id}", jurisdiction_id: "${jur_id}", width_ft: 8, depth_ft: 8, delivery_mode: "PRE_BUILT", foundation_type: "GRAVEL_PAD", anchor_type: "AUGER_STRAP", purchase_type: "CASH", options: [] }
              as: SalesRep
              captures: { order_id: $.data.id }
            - call: "POST /api/orders/${order_id}/submit-site-check"
              payload: { assessor_id: "asr-1", scheduled_date: "2026-08-02", window_start_hour: 10 }
              as: SalesRep
            - call: "POST /api/orders/${order_id}/payments"
              payload: { amount_cents: 50000, method: "CARD", idempotency_key: "imm-1" }
              as: FinanceManager
              captures: { pay_id: $.data.id }
          trigger:
            - call: "GET /api/payments/${pay_id}"
              as: FinanceManager
          assert:
            - "Payment.${pay_id}.amount_cents == 50000 and kind == DEPOSIT (first cash payment)"
            - "Payment.${pay_id} response contains id and created_at but NO version or updated_at fields"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: order_initial_state_draft
        claim_type: initial_state
        grounds: ["state_machines.Order"]
        distinguishing_aspect: "A newly created order starts in DRAFT with version == 1."
        test_recipe:
          setup: ["Jurisdiction, model, customer exist"]
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { name: "Marion County, IN", state_code: "IN", county_name: "Marion", permit_threshold_sqft: 120, setback_front_ft: 10, setback_side_ft: 5, setback_rear_ft: 5, max_building_height_ft: 12, anchoring_required: true, permit_base_fee_cents: 15000, permit_per_sqft_cents: 50, tax_rate_bp: 700 }
              as: PermitCoordinator
              captures: { jur_id: $.data.id }
            - call: "POST /api/models"
              payload: { name: "GardenPro", sku: "GP-01", min_width_ft: 8, max_width_ft: 16, min_depth_ft: 8, max_depth_ft: 24, wall_height_ft: 8, supported_delivery_modes: ["PRE_BUILT", "ON_SITE_BUILD"], base_price_cents: 300000, overage_rate_tier1_cents: 1500, overage_rate_tier2_cents: 2000 }
              as: SalesRep
              captures: { model_id: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", phone: "317-555-0100", street: "1200 Fern Ave", city: "Indianapolis", state_code: "IN", zip: "46201" }
              as: SalesRep
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /api/orders"
              payload: { customer_id: "${cust_id}", model_id: "${model_id}", jurisdiction_id: "${jur_id}", width_ft: 8, depth_ft: 8, delivery_mode: "PRE_BUILT", foundation_type: "GRAVEL_PAD", anchor_type: "AUGER_STRAP", purchase_type: "CASH", options: [] }
              as: SalesRep
              captures: { order_id: $.data.id, order_v: $.data.version }
          assert:
            - "Order.${order_id}.status == DRAFT and version == 1"

      - name: order_start_from_ready_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Order.SCHEDULED_to_IN_PROGRESS", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "start is only valid from SCHEDULED; from READY_TO_SCHEDULE it fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["An 8x8 CASH order in READY_TO_SCHEDULE (permit NOT_REQUIRED; no payment needed since schedule is never called)"]
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { name: "Marion County, IN", state_code: "IN", county_name: "Marion", permit_threshold_sqft: 120, setback_front_ft: 10, setback_side_ft: 5, setback_rear_ft: 5, max_building_height_ft: 12, anchoring_required: true, permit_base_fee_cents: 15000, permit_per_sqft_cents: 50, tax_rate_bp: 700 }
              as: PermitCoordinator
              captures: { jur_id: $.data.id }
            - call: "POST /api/models"
              payload: { name: "GardenPro", sku: "GP-01", min_width_ft: 8, max_width_ft: 16, min_depth_ft: 8, max_depth_ft: 24, wall_height_ft: 8, supported_delivery_modes: ["PRE_BUILT", "ON_SITE_BUILD"], base_price_cents: 300000, overage_rate_tier1_cents: 1500, overage_rate_tier2_cents: 2000 }
              as: SalesRep
              captures: { model_id: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", phone: "317-555-0100", street: "1200 Fern Ave", city: "Indianapolis", state_code: "IN", zip: "46201" }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /api/orders"
              payload: { customer_id: "${cust_id}", model_id: "${model_id}", jurisdiction_id: "${jur_id}", width_ft: 8, depth_ft: 8, delivery_mode: "PRE_BUILT", foundation_type: "GRAVEL_PAD", anchor_type: "AUGER_STRAP", purchase_type: "CASH", options: [] }
              as: SalesRep
              captures: { order_id: $.data.id }
            - call: "POST /api/orders/${order_id}/submit-site-check"
              payload: { assessor_id: "asr-1", scheduled_date: "2026-08-02", window_start_hour: 10 }
              as: SalesRep
              captures: { asm_id: $.data.id }
            - call: "POST /api/site-assessments/${asm_id}/report"
              payload: { measured_access_width_in: 140, measured_slope_pct: 4, setback_front_ft: 12, setback_side_ft: 6, setback_rear_ft: 8, ground_prep_needed: false }
              as: InstallCrew
          trigger:
            - call: "POST /api/orders/${order_id}/start"
              payload: {}
              as: InstallCrew
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE and Order.${order_id}.status == READY_TO_SCHEDULE"

      - name: order_double_cancel_rejected
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Order.DRAFT_to_CANCELLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CANCELLED is terminal: a second cancel returns ERR_INVALID_STATE and creates no additional refund."
        test_recipe:
          setup: ["A DRAFT order already cancelled once"]
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { name: "Marion County, IN", state_code: "IN", county_name: "Marion", permit_threshold_sqft: 120, setback_front_ft: 10, setback_side_ft: 5, setback_rear_ft: 5, max_building_height_ft: 12, anchoring_required: true, permit_base_fee_cents: 15000, permit_per_sqft_cents: 50, tax_rate_bp: 700 }
              as: PermitCoordinator
              captures: { jur_id: $.data.id }
            - call: "POST /api/models"
              payload: { name: "GardenPro", sku: "GP-01", min_width_ft: 8, max_width_ft: 16, min_depth_ft: 8, max_depth_ft: 24, wall_height_ft: 8, supported_delivery_modes: ["PRE_BUILT", "ON_SITE_BUILD"], base_price_cents: 300000, overage_rate_tier1_cents: 1500, overage_rate_tier2_cents: 2000 }
              as: SalesRep
              captures: { model_id: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", phone: "317-555-0100", street: "1200 Fern Ave", city: "Indianapolis", state_code: "IN", zip: "46201" }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /api/orders"
              payload: { customer_id: "${cust_id}", model_id: "${model_id}", jurisdiction_id: "${jur_id}", width_ft: 8, depth_ft: 8, delivery_mode: "PRE_BUILT", foundation_type: "GRAVEL_PAD", anchor_type: "AUGER_STRAP", purchase_type: "CASH", options: [] }
              as: SalesRep
              captures: { order_id: $.data.id }
            - call: "POST /api/orders/${order_id}/cancel"
              payload: { reason: "first cancel" }
              as: SalesRep
          trigger:
            - call: "POST /api/orders/${order_id}/cancel"
              payload: { reason: "second cancel" }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE and Order.${order_id}.status == CANCELLED"
            - "Order.${order_id}.refunded_cents == 0 (nothing was ever collected, so no refund rows)"

      - name: cancel_from_in_progress_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Order", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancellation closes once work begins: cancel from IN_PROGRESS fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["A 10x12 CASH order fully permitted, deposit paid (120298), SCHEDULED and STARTED"]
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { name: "Marion County, IN", state_code: "IN", county_name: "Marion", permit_threshold_sqft: 120, setback_front_ft: 10, setback_side_ft: 5, setback_rear_ft: 5, max_building_height_ft: 12, anchoring_required: true, permit_base_fee_cents: 15000, permit_per_sqft_cents: 50, tax_rate_bp: 700 }
              as: PermitCoordinator
              captures: { jur_id: $.data.id }
            - call: "POST /api/models"
              payload: { name: "GardenPro", sku: "GP-01", min_width_ft: 8, max_width_ft: 16, min_depth_ft: 8, max_depth_ft: 24, wall_height_ft: 8, supported_delivery_modes: ["PRE_BUILT", "ON_SITE_BUILD"], base_price_cents: 300000, overage_rate_tier1_cents: 1500, overage_rate_tier2_cents: 2000 }
              as: SalesRep
              captures: { model_id: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", phone: "317-555-0100", street: "1200 Fern Ave", city: "Indianapolis", state_code: "IN", zip: "46201" }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /api/orders"
              payload: { customer_id: "${cust_id}", model_id: "${model_id}", jurisdiction_id: "${jur_id}", width_ft: 10, depth_ft: 12, delivery_mode: "PRE_BUILT", foundation_type: "GRAVEL_PAD", anchor_type: "AUGER_STRAP", purchase_type: "CASH", options: ["WINDOW"] }
              as: SalesRep
              captures: { order_id: $.data.id }
            - call: "POST /api/orders/${order_id}/submit-site-check"
              payload: { assessor_id: "asr-1", scheduled_date: "2026-08-02", window_start_hour: 10 }
              as: SalesRep
              captures: { asm_id: $.data.id }
            - call: "POST /api/site-assessments/${asm_id}/report"
              payload: { measured_access_width_in: 140, measured_slope_pct: 4, setback_front_ft: 12, setback_side_ft: 6, setback_rear_ft: 8, ground_prep_needed: false }
              as: InstallCrew
            - call: "GET /api/orders/${order_id}/permit-applications"
              as: PermitCoordinator
              captures: { app_id: "$.data[0].id" }
            - call: "POST /api/permit-applications/${app_id}/approve"
              payload: {}
              as: PermitCoordinator
            - call: "POST /api/orders/${order_id}/payments"
              payload: { amount_cents: 120298, method: "CARD", idempotency_key: "dep-1" }
              as: FinanceManager
            - call: "POST /api/orders/${order_id}/schedule"
              payload: { scheduled_date: "2026-08-01", crew_id: "crew-1" }
              as: SalesRep
            - call: "POST /api/orders/${order_id}/start"
              payload: {}
              as: InstallCrew
          trigger:
            - call: "POST /api/orders/${order_id}/cancel"
              payload: { reason: "too late" }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE and Order.${order_id}.status == IN_PROGRESS"
            - "Order.${order_id}.refunded_cents == 0 (no compensation fired)"

      - name: cancel_cascades_requested_assessment
        claim_type: conditional_cascade
        grounds: ["state_machines.Order.SITE_REVIEW_to_CANCELLED", "state_machines.SiteAssessment.REQUESTED_to_CANCELLED"]
        distinguishing_aspect: "Cancelling from SITE_REVIEW cancels only the still-REQUESTED assessment; the assessment row remains queryable in CANCELLED."
        test_recipe:
          setup: ["A CASH order in SITE_REVIEW with its assessment REQUESTED (no report filed)"]
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { name: "Marion County, IN", state_code: "IN", county_name: "Marion", permit_threshold_sqft: 120, setback_front_ft: 10, setback_side_ft: 5, setback_rear_ft: 5, max_building_height_ft: 12, anchoring_required: true, permit_base_fee_cents: 15000, permit_per_sqft_cents: 50, tax_rate_bp: 700 }
              as: PermitCoordinator
              captures: { jur_id: $.data.id }
            - call: "POST /api/models"
              payload: { name: "GardenPro", sku: "GP-01", min_width_ft: 8, max_width_ft: 16, min_depth_ft: 8, max_depth_ft: 24, wall_height_ft: 8, supported_delivery_modes: ["PRE_BUILT", "ON_SITE_BUILD"], base_price_cents: 300000, overage_rate_tier1_cents: 1500, overage_rate_tier2_cents: 2000 }
              as: SalesRep
              captures: { model_id: $.data.id }
