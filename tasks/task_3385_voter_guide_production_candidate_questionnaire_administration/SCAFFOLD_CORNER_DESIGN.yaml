# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3385_voter_guide_production_candidate_questionnaire_administration
#
# Breadth probe: every claim the §1.1-§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners already
# covered by §1.8 appear as excluded_because stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: cycle_create_returns_declared_fields_and_starts_draft
        claim_type: Creation
        grounds: ["entities.ElectionCycle", "endpoints.POST_/election-cycles"]
        distinguishing_aspect: "Creating a cycle with only cycle_name and election_date returns 201 with status DRAFT, version 1, distributed_edition_count 0 and system-minted id/created_at/updated_at; status is never client-supplied."
        test_recipe:
          setup: ["Empty database; logical clock at its startup default 2026-09-01T00:00:00Z."]
          setup_api_calls: []
          trigger:
            - { call: "POST /election-cycles", payload: { cycle_name: "2026 General", election_date: "2026-11-03" }, as: LeagueAdmin, captures: { cyc_id: "$.data.id" } }
          assert:
            - "HTTP 201, response_type object, meta.api_request_id and meta.api_request_timestamp present"
            - "ElectionCycle.${cyc_id}: status == DRAFT, version == 1, distributed_edition_count == 0"
            - "id is a bare UUID (no type prefix); created_at == updated_at == 2026-09-01T00:00:00Z (logical clock default)"

      - name: jurisdiction_duplicate_fips_in_same_cycle_rejected
        claim_type: Type Constraints
        grounds: ["entities.Jurisdiction.fields.fips_code", "validations[priority=24]", "errors[ERR_DUPLICATE_FIPS]"]
        distinguishing_aspect: "fips_code uniqueness is scoped to the parent cycle: a second jurisdiction with the same fips_code in the same cycle fails 409, while the same fips_code in a different cycle succeeds."
        test_recipe:
          setup: ["Two OPEN cycles exist (A and B); cycle A already has a jurisdiction with fips_code 06001."]
          setup_api_calls:
            - { call: "POST /election-cycles", payload: { cycle_name: "Cycle A", election_date: "2026-11-03" }, as: LeagueAdmin, captures: { cyc_a: "$.data.id" } }
            - { call: "POST /election-cycles", payload: { cycle_name: "Cycle B", election_date: "2026-11-03" }, as: LeagueAdmin, captures: { cyc_b: "$.data.id" } }
            - { call: "POST /election-cycles/${cyc_a}/jurisdictions", payload: { jurisdiction_name: "Springfield", fips_code: "06001", supported_language_codes: ["EN"], reading_level_metric: "FLESCH_KINCAID" }, as: LeagueAdmin }
          trigger:
            - { call: "POST /election-cycles/${cyc_a}/jurisdictions", payload: { jurisdiction_name: "Springfield Heights", fips_code: "06001", supported_language_codes: ["EN"], reading_level_metric: "SMOG" }, as: LeagueAdmin, captures: { err: "$.data.error_id" } }
            - { call: "POST /election-cycles/${cyc_b}/jurisdictions", payload: { jurisdiction_name: "Other Springfield", fips_code: "06001", supported_language_codes: ["EN"], reading_level_metric: "SMOG" }, as: LeagueAdmin, captures: { jur_b: "$.data.id" } }
          assert:
            - "Same-cycle duplicate: error_id == ERR_DUPLICATE_FIPS, HTTP 409"
            - "Cross-cycle reuse: 201, Jurisdiction.${jur_b} created with fips_code 06001"

      - name: filing_reference_reuse_rejected_in_same_contest_only
        claim_type: Type Constraints
        grounds: ["entities.CandidateFiling.fields.filing_reference", "validations[priority=25]", "errors[ERR_DUPLICATE_FILING_REFERENCE]"]
        distinguishing_aspect: "filing_reference uniqueness is scoped to the contest: duplicate inside one contest fails 409; the same reference in a sibling contest succeeds."
        test_recipe:
          setup: ["OPEN cycle, one jurisdiction, two CANDIDATE_RACE contests in FILING_OPEN (clock before both deadlines); contest 1 already holds a filing with reference F-1."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-01T00:00:00Z" }, as: LeagueAdmin }
            - { call: "POST /volunteers", payload: { volunteer_name: "Cara Coordinator", chapter_code: "CH1", roles: ["COORDINATOR"] }, as: LeagueAdmin, captures: { coord_id: "$.data.id" } }
            - { call: "POST /election-cycles", payload: { cycle_name: "2026 General", election_date: "2026-11-03" }, as: LeagueAdmin, captures: { cyc_id: "$.data.id" } }
            - { call: "POST /election-cycles/${cyc_id}/transitions", payload: { to: "OPEN" }, as: LeagueAdmin }
            - { call: "POST /election-cycles/${cyc_id}/jurisdictions", payload: { jurisdiction_name: "Springfield", fips_code: "06001", supported_language_codes: ["EN"], reading_level_metric: "FLESCH_KINCAID" }, as: LeagueAdmin, captures: { jur_id: "$.data.id" } }
            - { call: "POST /jurisdictions/${jur_id}/contests", payload: { kind: "CANDIDATE_RACE", office_name: "Mayor", filing_deadline: "2026-09-15T17:00:00Z" }, as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { ct1: "$.data.id" } }
            - { call: "POST /jurisdictions/${jur_id}/contests", payload: { kind: "CANDIDATE_RACE", office_name: "Clerk", filing_deadline: "2026-09-15T17:00:00Z" }, as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { ct2: "$.data.id" } }
            - { call: "POST /contests/${ct1}/filings", payload: { candidate_name: "Ana One", party_label: "Nonpartisan", filing_reference: "F-1" }, as: ChapterCoordinator, as_user_id: "${coord_id}" }
          trigger:
            - { call: "POST /contests/${ct1}/filings", payload: { candidate_name: "Copy Cat", party_label: "Nonpartisan", filing_reference: "F-1" }, as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { err: "$.data.error_id" } }
            - { call: "POST /contests/${ct2}/filings", payload: { candidate_name: "Other Person", party_label: "Nonpartisan", filing_reference: "F-1" }, as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { f_ok: "$.data.id" } }
          assert:
            - "Same-contest duplicate: error_id == ERR_DUPLICATE_FILING_REFERENCE, HTTP 409"
            - "Sibling-contest reuse: 201, CandidateFiling.${f_ok} created with filing_reference F-1"

      - name: contest_get_with_random_uuid_returns_not_found
        claim_type: Not Found
        grounds: ["entities.Contest", "endpoints.GET_/contests/{id}", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Reading a contest by a well-formed UUID that was never issued returns the error envelope with ERR_NOT_FOUND and HTTP 404."
        test_recipe:
          setup: ["One coordinator volunteer exists (the caller); no contests exist."]
          setup_api_calls:
            - { call: "POST /volunteers", payload: { volunteer_name: "Cara Coordinator", chapter_code: "CH1", roles: ["COORDINATOR"] }, as: LeagueAdmin, captures: { coord_id: "$.data.id" } }
          trigger:
            - { call: "GET /contests/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 404, response_type error, error_id == ERR_NOT_FOUND"

      - name: filings_list_paginates_with_limit_offset_and_envelope_fields
        claim_type: Listing
        grounds: ["response_envelope", "endpoints.GET_/contests/{id}/filings"]
        distinguishing_aspect: "The list endpoint honors limit/offset and reports total_count and has_more: with 3 filings, limit=2&offset=0 returns 2 rows with has_more true; offset=2 returns 1 row with has_more false."
        test_recipe:
          setup: ["One CANDIDATE_RACE contest in FILING_OPEN holding three filings."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-01T00:00:00Z" }, as: LeagueAdmin }
            - { call: "POST /volunteers", payload: { volunteer_name: "Cara Coordinator", chapter_code: "CH1", roles: ["COORDINATOR"] }, as: LeagueAdmin, captures: { coord_id: "$.data.id" } }
            - { call: "POST /election-cycles", payload: { cycle_name: "2026 General", election_date: "2026-11-03" }, as: LeagueAdmin, captures: { cyc_id: "$.data.id" } }
            - { call: "POST /election-cycles/${cyc_id}/transitions", payload: { to: "OPEN" }, as: LeagueAdmin }
            - { call: "POST /election-cycles/${cyc_id}/jurisdictions", payload: { jurisdiction_name: "Springfield", fips_code: "06001", supported_language_codes: ["EN"], reading_level_metric: "FLESCH_KINCAID" }, as: LeagueAdmin, captures: { jur_id: "$.data.id" } }
            - { call: "POST /jurisdictions/${jur_id}/contests", payload: { kind: "CANDIDATE_RACE", office_name: "Mayor", filing_deadline: "2026-09-15T17:00:00Z" }, as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { ct_id: "$.data.id" } }
            - { call: "POST /contests/${ct_id}/filings", payload: { candidate_name: "Ana One", party_label: "Nonpartisan", filing_reference: "F-1" }, as: ChapterCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /contests/${ct_id}/filings", payload: { candidate_name: "Bob Two", party_label: "Nonpartisan", filing_reference: "F-2" }, as: ChapterCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /contests/${ct_id}/filings", payload: { candidate_name: "Cid Three", party_label: "Nonpartisan", filing_reference: "F-3" }, as: ChapterCoordinator, as_user_id: "${coord_id}" }
          trigger:
            - { call: "GET /contests/${ct_id}/filings", payload: { limit: 2, offset: 0 }, as: ChapterCoordinator, as_user_id: "${coord_id}" }
            - { call: "GET /contests/${ct_id}/filings", payload: { limit: 2, offset: 2 }, as: ChapterCoordinator, as_user_id: "${coord_id}" }
          assert:
            - "Page 1: response_type array, 2 data rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Page 2: 1 data row, total_count == 3, has_more == false"

      - name: contest_create_with_undeclared_or_computed_field_rejected
        claim_type: Computed Fields
        grounds: ["validations[priority=3]", "entities.Contest.fields.completion_index", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "The request schema is strict: a payload carrying the computed field completion_index (or any undeclared key) is rejected 400 rather than silently ignored."
        test_recipe:
          setup: ["OPEN cycle with one jurisdiction."]
          setup_api_calls:
            - { call: "POST /volunteers", payload: { volunteer_name: "Cara Coordinator", chapter_code: "CH1", roles: ["COORDINATOR"] }, as: LeagueAdmin, captures: { coord_id: "$.data.id" } }
            - { call: "POST /election-cycles", payload: { cycle_name: "2026 General", election_date: "2026-11-03" }, as: LeagueAdmin, captures: { cyc_id: "$.data.id" } }
            - { call: "POST /election-cycles/${cyc_id}/transitions", payload: { to: "OPEN" }, as: LeagueAdmin }
            - { call: "POST /election-cycles/${cyc_id}/jurisdictions", payload: { jurisdiction_name: "Springfield", fips_code: "06001", supported_language_codes: ["EN"], reading_level_metric: "FLESCH_KINCAID" }, as: LeagueAdmin, captures: { jur_id: "$.data.id" } }
          trigger:
            - { call: "POST /jurisdictions/${jur_id}/contests", payload: { kind: "CANDIDATE_RACE", office_name: "Mayor", filing_deadline: "2026-09-15T17:00:00Z", completion_index: 99.9 }, as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 400; the computed field is never client-settable"

      - name: volunteer_created_with_current_attestation_and_ninety_day_expiry
        claim_type: Defaults
        grounds: ["entities.Volunteer.fields.attestation_status", "entities.Volunteer.fields.attestation_expires_at", "entities.Volunteer.fields.advocacy_flag"]
        distinguishing_aspect: "A volunteer created without advocacy_flag defaults it to false, starts attestation_status CURRENT with attestation_expires_at exactly created_at + 90 days, status ACTIVE, substantiated_incident_count 0."
        test_recipe:
          setup: ["Clock pinned at 2026-09-01T00:00:00Z."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-01T00:00:00Z" }, as: LeagueAdmin }
          trigger:
            - { call: "POST /volunteers", payload: { volunteer_name: "Vic Volunteer", chapter_code: "CH9", roles: ["EDITOR", "REVIEWER"] }, as: LeagueAdmin, captures: { v_id: "$.data.id" } }
          assert:
            - "Volunteer.${v_id}: advocacy_flag == false, status == ACTIVE, attestation_status == CURRENT"
            - "attestation_expires_at == 2026-11-30T00:00:00Z (created_at + 90 days)"
            - "substantiated_incident_count == 0 and version == 1"

      - name: measure_contest_with_office_name_rejected
        claim_type: Type Constraints
        grounds: ["entities.Contest.fields.office_name", "validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "office_name is conditional on kind: supplying it for a BALLOT_MEASURE contest is a 400, and omitting it for a CANDIDATE_RACE contest is a 400."
        test_recipe:
          setup: ["OPEN cycle with one jurisdiction."]
          setup_api_calls:
            - { call: "POST /volunteers", payload: { volunteer_name: "Cara Coordinator", chapter_code: "CH1", roles: ["COORDINATOR"] }, as: LeagueAdmin, captures: { coord_id: "$.data.id" } }
            - { call: "POST /election-cycles", payload: { cycle_name: "2026 General", election_date: "2026-11-03" }, as: LeagueAdmin, captures: { cyc_id: "$.data.id" } }
            - { call: "POST /election-cycles/${cyc_id}/transitions", payload: { to: "OPEN" }, as: LeagueAdmin }
            - { call: "POST /election-cycles/${cyc_id}/jurisdictions", payload: { jurisdiction_name: "Springfield", fips_code: "06001", supported_language_codes: ["EN"], reading_level_metric: "FLESCH_KINCAID" }, as: LeagueAdmin, captures: { jur_id: "$.data.id" } }
          trigger:
            - { call: "POST /jurisdictions/${jur_id}/contests", payload: { kind: "BALLOT_MEASURE", office_name: "Measure Office", filing_deadline: "2026-09-15T17:00:00Z" }, as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { err1: "$.data.error_id" } }
            - { call: "POST /jurisdictions/${jur_id}/contests", payload: { kind: "CANDIDATE_RACE", filing_deadline: "2026-09-15T17:00:00Z" }, as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { err2: "$.data.error_id" } }
          assert:
            - "office_name on BALLOT_MEASURE: error_id == ERR_INVALID_REQUEST, HTTP 400"
            - "office_name omitted on CANDIDATE_RACE: error_id == ERR_INVALID_REQUEST, HTTP 400"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: contest_lock_from_filing_open_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Contest", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "LOCKED is only reachable from GUIDE_READY: requesting to=LOCKED from FILING_OPEN is rejected with ERR_INVALID_STATE even though LOCKED is a declared state."
        test_recipe:
          setup: ["OPEN cycle, one jurisdiction, one CANDIDATE_RACE contest in FILING_OPEN."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-01T00:00:00Z" }, as: LeagueAdmin }
            - { call: "POST /volunteers", payload: { volunteer_name: "Cara Coordinator", chapter_code: "CH1", roles: ["COORDINATOR"] }, as: LeagueAdmin, captures: { coord_id: "$.data.id" } }
            - { call: "POST /election-cycles", payload: { cycle_name: "2026 General", election_date: "2026-11-03" }, as: LeagueAdmin, captures: { cyc_id: "$.data.id" } }
            - { call: "POST /election-cycles/${cyc_id}/transitions", payload: { to: "OPEN" }, as: LeagueAdmin }
            - { call: "POST /election-cycles/${cyc_id}/jurisdictions", payload: { jurisdiction_name: "Springfield", fips_code: "06001", supported_language_codes: ["EN"], reading_level_metric: "FLESCH_KINCAID" }, as: LeagueAdmin, captures: { jur_id: "$.data.id" } }
            - { call: "POST /jurisdictions/${jur_id}/contests", payload: { kind: "CANDIDATE_RACE", office_name: "Mayor", filing_deadline: "2026-09-15T17:00:00Z" }, as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { ct_id: "$.data.id" } }
            - { call: "GET /contests/${ct_id}", as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { ct_ver: "$.data.version" } }
          trigger:
            - { call: "POST /contests/${ct_id}/transitions", payload: { to: "LOCKED", expected_contest_version: "${ct_ver}" }, as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_STATE, HTTP 409; Contest.${ct_id}.status stays FILING_OPEN"

      - name: disqualified_filing_cannot_refile
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.CandidateFiling", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DISQUALIFIED is terminal: refile from DISQUALIFIED is rejected, unlike the legal WITHDRAWN -> FILED refile loop."
        test_recipe:
          setup: ["Contest in FILING_OPEN; one filing verified then disqualified."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-01T00:00:00Z" }, as: LeagueAdmin }
            - { call: "POST /volunteers", payload: { volunteer_name: "Cara Coordinator", chapter_code: "CH1", roles: ["COORDINATOR"] }, as: LeagueAdmin, captures: { coord_id: "$.data.id" } }
            - { call: "POST /election-cycles", payload: { cycle_name: "2026 General", election_date: "2026-11-03" }, as: LeagueAdmin, captures: { cyc_id: "$.data.id" } }
            - { call: "POST /election-cycles/${cyc_id}/transitions", payload: { to: "OPEN" }, as: LeagueAdmin }
            - { call: "POST /election-cycles/${cyc_id}/jurisdictions", payload: { jurisdiction_name: "Springfield", fips_code: "06001", supported_language_codes: ["EN"], reading_level_metric: "FLESCH_KINCAID" }, as: LeagueAdmin, captures: { jur_id: "$.data.id" } }
            - { call: "POST /jurisdictions/${jur_id}/contests", payload: { kind: "CANDIDATE_RACE", office_name: "Mayor", filing_deadline: "2026-09-15T17:00:00Z" }, as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { ct_id: "$.data.id" } }
            - { call: "POST /contests/${ct_id}/filings", payload: { candidate_name: "Ana One", party_label: "Nonpartisan", filing_reference: "F-1" }, as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { f1: "$.data.id" } }
            - { call: "POST /filings/${f1}/verify", as: ChapterCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /filings/${f1}/disqualify", payload: { reason: "Filing fee bounced." }, as: ChapterCoordinator, as_user_id: "${coord_id}" }
          trigger:
            - { call: "POST /filings/${f1}/refile", as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_STATE, HTTP 409; filing stays DISQUALIFIED and withdrawal_count == 0"

      - name: questionnaire_close_before_deadline_rejected
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Questionnaire.ISSUED_to_CLOSED", "validations[priority=20]", "errors[ERR_CLOSE_BEFORE_DEADLINE]"]
        distinguishing_aspect: "Close requires current_utc strictly greater than due_at: closing at exactly due_at is rejected with ERR_CLOSE_BEFORE_DEADLINE."
        test_recipe:
          setup: ["Contest in QUESTIONNAIRE_PHASE; one-question questionnaire ISSUED with due_at 2026-10-01T17:00:00Z; clock set to exactly 2026-10-01T17:00:00Z."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-01T00:00:00Z" }, as: LeagueAdmin }
            - { call: "POST /volunteers", payload: { volunteer_name: "Cara Coordinator", chapter_code: "CH1", roles: ["COORDINATOR"] }, as: LeagueAdmin, captures: { coord_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { volunteer_name: "Edna Editor", chapter_code: "CH1", roles: ["EDITOR"] }, as: LeagueAdmin, captures: { ed_id: "$.data.id" } }
            - { call: "POST /election-cycles", payload: { cycle_name: "2026 General", election_date: "2026-11-03" }, as: LeagueAdmin, captures: { cyc_id: "$.data.id" } }
            - { call: "POST /election-cycles/${cyc_id}/transitions", payload: { to: "OPEN" }, as: LeagueAdmin }
            - { call: "POST /election-cycles/${cyc_id}/jurisdictions", payload: { jurisdiction_name: "Springfield", fips_code: "06001", supported_language_codes: ["EN"], reading_level_metric: "FLESCH_KINCAID" }, as: LeagueAdmin, captures: { jur_id: "$.data.id" } }
            - { call: "POST /jurisdictions/${jur_id}/contests", payload: { kind: "CANDIDATE_RACE", office_name: "Mayor", filing_deadline: "2026-09-15T17:00:00Z" }, as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { ct_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-16T00:00:00Z" }, as: LeagueAdmin }
            - { call: "GET /contests/${ct_id}", as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { ct_ver: "$.data.version" } }
            - { call: "POST /contests/${ct_id}/transitions", payload: { to: "QUESTIONNAIRE_PHASE", expected_contest_version: "${ct_ver}" }, as: ChapterCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /contests/${ct_id}/questionnaire", payload: { due_at: "2026-10-01T17:00:00Z", questions: [{ position_index: 1, prompt_text: "Why are you running?" }] }, as: QuestionnaireEditor, as_user_id: "${ed_id}", captures: { q_id: "$.data.id" } }
            - { call: "POST /questionnaires/${q_id}/issue", as: QuestionnaireEditor, as_user_id: "${ed_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-10-01T17:00:00Z" }, as: LeagueAdmin }
          trigger:
            - { call: "POST /questionnaires/${q_id}/close", as: QuestionnaireEditor, as_user_id: "${ed_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_CLOSE_BEFORE_DEADLINE, HTTP 422; questionnaire stays ISSUED"

      - name: resubmit_from_submitted_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.CandidateResponse", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "resubmit is defined only from OVER_LIMIT_RETURNED: calling it on a SUBMITTED shell is ERR_INVALID_STATE, not a silent overwrite (unedited publication is locked once accepted)."
        test_recipe:
          setup: ["Contest in QUESTIONNAIRE_PHASE; questionnaire ISSUED; one candidate SUBMITTED in-window."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-01T00:00:00Z" }, as: LeagueAdmin }
            - { call: "POST /volunteers", payload: { volunteer_name: "Cara Coordinator", chapter_code: "CH1", roles: ["COORDINATOR"] }, as: LeagueAdmin, captures: { coord_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { volunteer_name: "Edna Editor", chapter_code: "CH1", roles: ["EDITOR"] }, as: LeagueAdmin, captures: { ed_id: "$.data.id" } }
            - { call: "POST /election-cycles", payload: { cycle_name: "2026 General", election_date: "2026-11-03" }, as: LeagueAdmin, captures: { cyc_id: "$.data.id" } }
            - { call: "POST /election-cycles/${cyc_id}/transitions", payload: { to: "OPEN" }, as: LeagueAdmin }
            - { call: "POST /election-cycles/${cyc_id}/jurisdictions", payload: { jurisdiction_name: "Springfield", fips_code: "06001", supported_language_codes: ["EN"], reading_level_metric: "FLESCH_KINCAID" }, as: LeagueAdmin, captures: { jur_id: "$.data.id" } }
