            - call: "POST /medication-orders"
              payload: { inmate_id: "${inm}", drug_name: "Sertraline", drug_class: "PSYCHOTROPIC", route_mode: "DOT", doses_per_day: 1, start_date: "2026-05-01T00:00:00Z", end_date: "2026-05-10T00:00:00Z", expected_inmate_version: "${inm_v1}" }
              as: Provider
              as_user_id: "u-prov-1"
              captures: { ord: $.data.id }
            - call: "POST /medication-orders/${ord}/discontinue"
              payload: {}
              as: Provider
              as_user_id: "u-prov-1"
          trigger:
            - call: "GET /reports/facility-adherence"
              payload: { facility_code: "FAC-02" }
              as: HealthServicesAdmin
          assert:
            - "response data order_count == 0"
            - "response data adherence_index == 0.00"
            - "The call returns 200, not 404"
            - "MedicationOrder.${ord}.status == DISCONTINUED"

