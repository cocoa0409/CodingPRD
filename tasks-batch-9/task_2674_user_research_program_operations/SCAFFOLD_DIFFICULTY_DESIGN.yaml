# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Domain: user-research-program-operations (task_2674)
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 only. All numeric asserts are literals
# computed from the §1.3 formulas and their constants at authoring time.
# Fixed operator ids used throughout: u_stake_1 (Stakeholder), u_lead_1 (ResearchLead),
# u_res_1 (Researcher), u_priv_1 (PrivacyOfficer), u_ops_1 (ResearchOpsAdmin).
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: finding_strength_provisional_vs_corroborated
        grounds:
          - calculations.evidence_strength
          - entities.Finding.fields.strength_variant
          - entities.Finding.fields.evidence_strength
          - state_machines.Finding.DRAFT_to_EVIDENCE_LOCKED
        distinguishing_aspect: |
          This dual variant lives in the qualitative-evidence domain on Finding: the same three
          admissible EvidenceLink rows score 0.71 under PROVISIONAL (divisor 4.00, no breadth
          factor) and 0.56 under CORROBORATED (divisor 3.00 times a participant-breadth factor),
          so locking the finding changes the number without touching a single link.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "IRREVERSIBLE RoadmapDecision, deadline 2026-08-15T00:00:00Z, 12000 impacted users"
            - "BEHAVIORAL_LONGITUDINAL request triaged APPROVED, so approved_method == DIARY_STUDY"
            - "Pool with a 100000-cent incentive budget and three POWER_USER / en-US participants"
            - "DIARY_STUDY study fielded 2026-08-03..2026-08-21 with an APPROVED guide"
            - "All three participants consented, invited, screened in at 90.00, scheduled, completed"
            - "One RECORDING artifact per completed session"
            - "One DRAFT Finding with severity HIGH carrying three OBSERVED_BEHAVIOR links, one per artifact"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
            - call: "POST /roadmap-decisions"
              payload: { title: "Rebuild team onboarding", reversibility: "IRREVERSIBLE", decision_deadline: "2026-08-15T00:00:00Z", impacted_user_count: 12000 }
              as: Stakeholder
              as_user_id: "u_stake_1"
              captures: { dec_id: $.data.id }
            - call: "POST /research-requests"
              payload: { roadmap_decision_id: "${dec_id}", question: "How do new teams behave across their first two weeks of setup?", question_type: "BEHAVIORAL_LONGITUDINAL", evidence_gap: "FULL" }
              as: Stakeholder
              as_user_id: "u_stake_1"
              captures: { req_id: $.data.id }
            - call: "POST /research-requests/${req_id}/triage"
              payload: { outcome: "APPROVED" }
              as: ResearchLead
              as_user_id: "u_lead_1"
              captures: { appr_method: $.data.approved_method }
            - call: "POST /participant-pools"
              payload: { name: "Core customer list", pool_type: "CUSTOMER_LIST", contact_cap_per_window: 2, contact_window_days: 30, incentive_budget_cents: 100000 }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
              captures: { pool_id: $.data.id }
            - call: "POST /participant-pools/${pool_id}/participants"
              payload: { external_ref: "P-001", segment: "POWER_USER", locale: "en-US", pii_on_file: true }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
              captures: { p1_id: $.data.id }
            - call: "POST /participant-pools/${pool_id}/participants"
              payload: { external_ref: "P-002", segment: "POWER_USER", locale: "en-US", pii_on_file: true }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
              captures: { p2_id: $.data.id }
            - call: "POST /participant-pools/${pool_id}/participants"
              payload: { external_ref: "P-003", segment: "POWER_USER", locale: "en-US", pii_on_file: true }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
              captures: { p3_id: $.data.id }
            - call: "POST /studies"
              payload: { research_request_id: "${req_id}", participant_pool_id: "${pool_id}", method: "DIARY_STUDY", target_participant_count: 3, screening_criteria: { required_segment: "POWER_USER", required_locale: "en-US", target_answers: ["A1", "A3"], disqualifying_answers: ["X9"] }, incentive_amount_cents: 5000, fielding_start: "2026-08-03T00:00:00Z", fielding_end: "2026-08-21T00:00:00Z" }
              as: Researcher
              as_user_id: "u_res_1"
              captures: { study_id: $.data.id }
            - call: "PUT /studies/${study_id}/guide"
              payload: { guide_version_label: "G1", guide_question_count: 12 }
              as: Researcher
              as_user_id: "u_res_1"
            - call: "POST /studies/${study_id}/guide/approve"
              payload: {}
              as: ResearchLead
              as_user_id: "u_lead_1"
            - call: "POST /studies/${study_id}/field"
              payload: {}
              as: Researcher
              as_user_id: "u_res_1"
            - call: "POST /consent-records"
              payload: { participant_id: "${p1_id}", study_id: "${study_id}", scopes: ["RECORDING", "TRANSCRIPT"], retention_days: 120 }
