        distinguishing_aspect: "A BATTERY_ONLY site with battery_runtime_minutes 0 has backup_minutes_remaining 0 the moment backup engages, so ESCALATE lands on tier 3 and flips Site.status to OFF_AIR, after which any talkpath request returns HTTP 409 ERR_SITE_OFF_AIR."
