# =============================================================================
# PRD Benchmark Scaffold — Guardian-ad-Litem & CASA Volunteer Management
# Difficulty band: Expert
# =============================================================================

scenario: |
  894. Guardian-ad-Litem & CASA Volunteer Management: volunteer screening & training,
  case appointment & child, visit & contact log, court-report & hearing,
  background/renewal, supervisor review, mileage/expense, outcome

domain_name: guardian-ad-litem-casa
api_prefix: ""   # Flat multi-root API: /volunteers, /supervisors, /cases, /court-reports,
                 # /expense-claims, /hearings, /background-checks are peer top-level collections.

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities linked by foreign keys; no single ownership tree. Volunteers,
  # Supervisors and Cases are independent roots joined through CaseAssignment,
  # Visit, CourtReport and ExpenseClaim reference rows.

  state_machine_shape: branching
  # CourtReport is cyclic (revision loop); ExpenseClaim is branching fork-join;
  # BackgroundCheck / Hearing branch; Case is cyclic (assign/unassign). Not linear.

  relationship_patterns:
    - one_to_many        # Case -> Visit / Hearing / CourtReport; Volunteer -> BackgroundCheck / TrainingRecord
    - many_to_many       # Volunteer <-> Case via CaseAssignment junction
    - cross_aggregate    # ExpenseClaim references both a Volunteer and a Case

  role_model: segregation_of_duties
  # Report author (Volunteer) can never review/approve; the reviewing Supervisor
  # must be the Case's own supervisor and cannot be the author. Peer ownership
  # otherwise (Volunteer owns visits/reports; Supervisor owns reviews/approvals).

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Volunteer
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: full_name, type: string, source: input, description: "Volunteer legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique among volunteers" }
      - { name: home_zip, type: string, source: input, description: "Home ZIP used for mileage context" }
      - { name: max_caseload, type: integer, source: input, default: 2, description: "Maximum simultaneous ACTIVE case assignments this volunteer may hold" }
      - { name: status, type: enum, source: system, description: "PROSPECT | SCREENING | TRAINING | ACTIVE | INACTIVE | RESIGNED", constraints: "enum: PROSPECT, SCREENING, TRAINING, ACTIVE, INACTIVE, RESIGNED" }
      - { name: sworn_in_at, type: datetime, source: system, default: null, description: "Logical-clock time the volunteer was sworn in (TRAINING->ACTIVE); null until sworn in" }
      - { name: deactivation_reason, type: string, source: system, default: null, description: "Reason captured on ACTIVE->INACTIVE; null otherwise" }
      - { name: training_hours_total, type: number, source: computed, description: "Read-only: sum of hours over all this volunteer's TrainingRecord rows" }
      - { name: background_status, type: enum, source: computed, description: "Read-only: derived from the volunteer's most recent BackgroundCheck. NONE | PENDING | CLEARED | FLAGGED | EXPIRED", constraints: "enum: NONE, PENDING, CLEARED, FLAGGED, EXPIRED" }
      - { name: background_expiry_date, type: datetime, source: computed, default: null, description: "Read-only: expiry_date of the most recent CLEARED BackgroundCheck; null if none" }
      - { name: active_case_count, type: integer, source: computed, description: "Read-only conserved counter: number of CaseAssignment rows for this volunteer whose status == ACTIVE. Starts at 0." }

  - name: Supervisor
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Supervisor legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique among supervisors" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "Supervisor account status; always ACTIVE in this version (no deactivation flow)", constraints: "enum: ACTIVE" }

  - name: Case
    parent: null
    common_fields: true
    fields:
      - { name: child_initials, type: string, source: input, description: "De-identified child initials (the subject child of the case)" }
      - { name: child_dob, type: string, source: input, description: "Child date of birth, ISO date (YYYY-MM-DD)" }
      - { name: jurisdiction, type: string, source: input, description: "Court jurisdiction code" }
      - { name: supervisor_id, type: string, source: input, description: "FK -> Supervisor.id; the staff supervisor who owns review/approval on this case" }
      - { name: status, type: enum, source: system, description: "INTAKE | ASSIGNED | UNASSIGNED | CLOSED", constraints: "enum: INTAKE, ASSIGNED, UNASSIGNED, CLOSED" }
      - { name: outcome, type: enum, source: system, default: null, description: "Permanency outcome set at close; null until CLOSED. REUNIFICATION | ADOPTION | GUARDIANSHIP | APPEAL", constraints: "enum: REUNIFICATION, ADOPTION, GUARDIANSHIP, APPEAL" }
      - { name: reimbursement_budget_cents, type: integer, source: input, default: 20000, description: "Total reimbursement budget (cents) available to volunteers on this case" }
      - { name: reimbursement_committed_cents, type: integer, source: computed, default: 0, description: "Read-only conserved quantity: sum of final_reimbursement_cents over this case's ExpenseClaim rows in status APPROVED or PAID. Starts at 0." }
      - { name: contact_compliance_pct, type: number, source: computed, description: "Read-only: STANDARD-variant monthly contact compliance percentage (see calc case_contact_compliance). One decimal." }
      - { name: audit_compliance_pct, type: number, source: computed, default: null, description: "Read-only: STRICT-variant compliance percentage pinned at close; null until CLOSED." }

  - name: CaseAssignment
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id" }
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; the advocate appointed to the case" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ENDED", constraints: "enum: ACTIVE, ENDED" }
      - { name: ended_reason, type: string, source: system, default: null, description: "Reason recorded when the assignment moves ACTIVE->ENDED (supersede, manual end, or volunteer deactivation cascade)" }

  - name: Visit
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id" }
      - { name: volunteer_id, type: string, source: system, description: "FK -> Volunteer.id; set to the case's currently-ACTIVE-assignment volunteer at log time" }
      - { name: contact_type, type: enum, source: input, description: "IN_PERSON | VIDEO | PHONE | COLLATERAL", constraints: "enum: IN_PERSON, VIDEO, PHONE, COLLATERAL" }
      - { name: contact_start, type: datetime, source: input, description: "Contact start instant (ISO 8601 UTC)" }
      - { name: contact_end, type: datetime, source: input, description: "Contact end instant (ISO 8601 UTC); must be strictly after contact_start" }
      - { name: miles, type: number, source: input, default: 0, description: "Round-trip miles driven for this contact (0 for non-driving contact types)" }
      - { name: notes, type: string, source: input, default: null, description: "Free-text contact notes" }
      - { name: status, type: enum, source: system, description: "LOGGED | VOIDED", constraints: "enum: LOGGED, VOIDED" }
      - { name: duration_minutes, type: number, source: computed, description: "Read-only: (contact_end - contact_start) in whole minutes" }

  - name: Hearing
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id" }
      - { name: hearing_type, type: enum, source: input, description: "STATUS | REVIEW | PERMANENCY | ADJUDICATION", constraints: "enum: STATUS, REVIEW, PERMANENCY, ADJUDICATION" }
      - { name: scheduled_at, type: datetime, source: input, description: "Scheduled hearing instant (ISO 8601 UTC)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | HELD | CONTINUED | CANCELLED", constraints: "enum: SCHEDULED, HELD, CONTINUED, CANCELLED" }
      - { name: report_due_date, type: datetime, source: computed, description: "Read-only: scheduled_at minus REPORT_LEAD_DAYS days (court-report filing deadline)" }

  - name: CourtReport
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id" }
      - { name: hearing_id, type: string, source: input, description: "FK -> Hearing.id; the hearing this report is filed for" }
      - { name: author_volunteer_id, type: string, source: system, description: "FK -> Volunteer.id; the advocate who authored the report (the acting volunteer at creation)" }
      - { name: reviewer_supervisor_id, type: string, source: system, default: null, description: "FK -> Supervisor.id; supervisor who reviewed the report; null until first review" }
      - { name: content_summary, type: string, source: input, description: "Narrative summary of the child's situation" }
      - { name: recommendation, type: string, source: input, description: "Advocate recommendation to the court" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | RETURNED | FILED", constraints: "enum: DRAFT, SUBMITTED, APPROVED, RETURNED, FILED" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the latest DRAFT->SUBMITTED; null until first submit" }
      - { name: revision_count, type: integer, source: computed, default: 0, description: "Read-only: number of times the report has cycled RETURNED->DRAFT via revise" }

  - name: ReviewNote
    parent: CourtReport
    common_fields: false   # id + created_at only; immutable audit event
    fields:
      - { name: report_id, type: string, source: system, description: "FK -> CourtReport.id" }
      - { name: supervisor_id, type: string, source: system, description: "FK -> Supervisor.id; the reviewing supervisor" }
      - { name: decision, type: enum, source: input, description: "APPROVE | RETURN", constraints: "enum: APPROVE, RETURN" }
      - { name: comments, type: string, source: input, default: null, description: "Reviewer comments" }

  - name: BackgroundCheck
    parent: Volunteer
    common_fields: true
    fields:
      - { name: volunteer_id, type: string, source: system, description: "FK -> Volunteer.id" }
      - { name: check_type, type: enum, source: input, description: "STATE_ONLY | STATE_AND_FEDERAL", constraints: "enum: STATE_ONLY, STATE_AND_FEDERAL" }
      - { name: status, type: enum, source: system, description: "PENDING | CLEARED | FLAGGED | EXPIRED", constraints: "enum: PENDING, CLEARED, FLAGGED, EXPIRED" }
      - { name: cleared_at, type: datetime, source: system, default: null, description: "Logical-clock instant cleared (PENDING->CLEARED); null otherwise" }
      - { name: expiry_date, type: datetime, source: computed, default: null, description: "Read-only: cleared_at plus BACKGROUND_VALID_DAYS days; null until cleared" }
      - { name: flag_reason, type: string, source: system, default: null, description: "Reason recorded on PENDING->FLAGGED" }

  - name: TrainingRecord
    parent: Volunteer
    common_fields: false   # id + created_at only; immutable log entry
    fields:
      - { name: volunteer_id, type: string, source: system, description: "FK -> Volunteer.id" }
      - { name: module_name, type: string, source: input, description: "Training module completed (e.g., CORE, ADVANCED)" }
      - { name: hours, type: number, source: input, description: "Credited training hours for this module (> 0)" }
      - { name: completed_at, type: datetime, source: input, description: "Completion instant (ISO 8601 UTC)" }

  - name: ExpenseClaim
    parent: Volunteer
    common_fields: true
    fields:
      - { name: volunteer_id, type: string, source: system, description: "FK -> Volunteer.id; the acting volunteer who submitted the claim" }
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; case the reimbursement is charged against" }
      - { name: period_month, type: string, source: input, description: "Reimbursement period as YYYY-MM" }
      - { name: total_miles, type: number, source: input, description: "Total reimbursable miles claimed for the period (>= 0)" }
      - { name: other_expense_cents, type: integer, source: input, default: 0, description: "Non-mileage out-of-pocket expense in cents (>= 0)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | REJECTED | PAID | VOIDED", constraints: "enum: SUBMITTED, APPROVED, REJECTED, PAID, VOIDED" }
      - { name: estimated_reimbursement_cents, type: integer, source: computed, description: "Read-only PROVISIONAL variant: flat-rate estimate pinned at submission (see calc expense_reimbursement)" }
      - { name: final_reimbursement_cents, type: integer, source: computed, default: null, description: "Read-only FINAL variant: tiered/capped amount pinned at approval; null until APPROVED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Volunteer
    initial_state: PROSPECT
    terminal_states: [RESIGNED]
    transitions:
      - from: PROSPECT
        to: SCREENING
        trigger: "POST /volunteers/{id}/start-screening"
        actor: ProgramAdmin
        preconditions: ["Volunteer.status == PROSPECT (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: SCREENING
        to: TRAINING
        trigger: "system: automatic when the volunteer's newest BackgroundCheck moves PENDING->CLEARED"
        actor: system
        preconditions: ["Volunteer.status == SCREENING", "the just-cleared BackgroundCheck is the volunteer's most recent"]
        side_effects: ["Volunteer.background_status recomputed to CLEARED", "Volunteer.background_expiry_date recomputed"]
      - from: TRAINING
        to: ACTIVE
        trigger: "POST /volunteers/{id}/swear-in"
        actor: ProgramAdmin
        preconditions:
          - "Volunteer.status == TRAINING (else ERR_INVALID_STATE)"
          - "Volunteer.background_status == CLEARED and now < background_expiry_date (else ERR_BACKGROUND_EXPIRED)"
          - "Volunteer.training_hours_total >= TRAINING_HOURS_REQUIRED (else ERR_TRAINING_INCOMPLETE)"
        side_effects: ["sworn_in_at = clock now"]
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /volunteers/{id}/deactivate"
        actor: ProgramAdmin
        preconditions: ["Volunteer.status == ACTIVE (else ERR_INVALID_STATE)"]
        side_effects:
          - "deactivation_reason set"
          - "CASCADE L1: every CaseAssignment of this volunteer with status ACTIVE -> ENDED (ended_reason=VOLUNTEER_DEACTIVATED); active_case_count decremented to 0"
          - "CASCADE L2: each Case whose ACTIVE assignment just ENDED and was ASSIGNED -> UNASSIGNED"
          - "CASCADE L3: for each such Case now UNASSIGNED, every CourtReport in status DRAFT or RETURNED -> VOIDED"
      - from: ACTIVE
        to: RESIGNED
        trigger: "POST /volunteers/{id}/resign"
        actor: ProgramAdmin
        preconditions: ["Volunteer.status in {ACTIVE, INACTIVE} (else ERR_INVALID_STATE)"]
        side_effects: ["same CASCADE L1-L3 as deactivate when moving from ACTIVE"]
      - from: INACTIVE
        to: RESIGNED
        trigger: "POST /volunteers/{id}/resign"
        actor: ProgramAdmin
        preconditions: ["Volunteer.status in {ACTIVE, INACTIVE}"]
        side_effects: []

  - entity: BackgroundCheck
    initial_state: PENDING
    terminal_states: [FLAGGED]
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /background-checks/{id}/clear"
        actor: ProgramAdmin
        preconditions: ["BackgroundCheck.status == PENDING (else ERR_INVALID_STATE)"]
        side_effects:
          - "cleared_at = clock now; expiry_date = cleared_at + BACKGROUND_VALID_DAYS"
          - "if owning Volunteer.status == SCREENING and this is the newest check -> Volunteer SCREENING->TRAINING"
      - from: PENDING
        to: FLAGGED
        trigger: "POST /background-checks/{id}/flag"
        actor: ProgramAdmin
        preconditions: ["BackgroundCheck.status == PENDING (else ERR_INVALID_STATE)"]
        side_effects: ["flag_reason set"]
      - from: CLEARED
        to: EXPIRED
        trigger: "system: evaluated on access when clock now >= expiry_date"
        actor: system
        preconditions: ["BackgroundCheck.status == CLEARED", "clock now >= expiry_date"]
        side_effects: ["owning Volunteer.background_status recomputed to EXPIRED"]

  - entity: Case
    initial_state: INTAKE
    terminal_states: [CLOSED]
    transitions:
      - from: INTAKE
        to: ASSIGNED
        trigger: "POST /cases/{id}/assignments"
        actor: Supervisor
        preconditions:
          - "Case.status in {INTAKE, UNASSIGNED} (else ERR_INVALID_STATE)"
          - "expected_case_version == Case.version (else ERR_STALE_CASE_VERSION)"
          - "target Volunteer.status == ACTIVE (else ERR_VOLUNTEER_NOT_ACTIVE)"
          - "target Volunteer.active_case_count < max_caseload (else ERR_CASELOAD_EXCEEDED)"
        side_effects:
          - "new CaseAssignment(status=ACTIVE) created"
          - "any prior ACTIVE CaseAssignment on this case -> ENDED (ended_reason=SUPERSEDED)"
          - "target Volunteer.active_case_count incremented by 1"
          - "increments Case.version by 1"
      - from: UNASSIGNED
        to: ASSIGNED
        trigger: "POST /cases/{id}/assignments"
        actor: Supervisor
        preconditions: ["Case.status in {INTAKE, UNASSIGNED}", "expected_case_version == Case.version", "target Volunteer.status == ACTIVE", "target Volunteer.active_case_count < max_caseload"]
        side_effects: ["same as INTAKE->ASSIGNED", "increments Case.version by 1"]
      - from: ASSIGNED
        to: UNASSIGNED
        trigger: "POST /cases/{id}/assignments/{assignmentId}/end"
        actor: Supervisor
        preconditions: ["Case.status == ASSIGNED (else ERR_INVALID_STATE)", "CaseAssignment.status == ACTIVE (else ERR_INVALID_STATE)"]
        side_effects:
          - "CaseAssignment -> ENDED (ended_reason=MANUAL_END)"
          - "owning Volunteer.active_case_count decremented by 1"
          - "increments Case.version by 1"
      - from: ASSIGNED
        to: CLOSED
        trigger: "POST /cases/{id}/close"
        actor: Supervisor
        preconditions:
          - "Case.status in {ASSIGNED, UNASSIGNED} (else ERR_INVALID_STATE)"
          - "at least one Visit with status LOGGED exists on the case (else ERR_NO_VISITS_LOGGED)"
        side_effects:
          - "outcome set from request"
          - "audit_compliance_pct pinned to STRICT variant of case_contact_compliance"
          - "any ACTIVE CaseAssignment -> ENDED (ended_reason=CASE_CLOSED); volunteer.active_case_count decremented"
          - "CASCADE: every Hearing of this case with status SCHEDULED -> CANCELLED"
          - "increments Case.version by 1"
      - from: UNASSIGNED
        to: CLOSED
        trigger: "POST /cases/{id}/close"
        actor: Supervisor
        preconditions: ["Case.status in {ASSIGNED, UNASSIGNED}", "at least one LOGGED Visit exists"]
        side_effects: ["same as ASSIGNED->CLOSED (no active assignment to end)"]

  - entity: CaseAssignment
    initial_state: ACTIVE
    terminal_states: [ENDED]
    transitions:
      - from: ACTIVE
        to: ENDED
        trigger: "POST /cases/{id}/assignments/{assignmentId}/end, or cascade from case close / volunteer deactivate / supersede"
        actor: Supervisor
        preconditions: ["CaseAssignment.status == ACTIVE (else ERR_INVALID_STATE)"]
        side_effects: ["ended_reason set", "owning Volunteer.active_case_count decremented by 1"]

  - entity: Hearing
    initial_state: SCHEDULED
    terminal_states: [HELD, CONTINUED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /hearings/{id}/hold"
        actor: Supervisor
        preconditions: ["Hearing.status == SCHEDULED (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: SCHEDULED
        to: CONTINUED
        trigger: "POST /hearings/{id}/continue"
        actor: Supervisor
        preconditions: ["Hearing.status == SCHEDULED (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /hearings/{id}/cancel, or cascade from case close"
        actor: Supervisor
        preconditions: ["Hearing.status == SCHEDULED (else ERR_INVALID_STATE)"]
        side_effects: []

  - entity: CourtReport
    initial_state: DRAFT
    terminal_states: [FILED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /court-reports/{id}/submit"
        actor: Volunteer
        preconditions:
          - "CourtReport.status == DRAFT (else ERR_INVALID_STATE)"
          - "linked Hearing.status == SCHEDULED (else ERR_HEARING_NOT_SCHEDULED)"
          - "clock now <= Hearing.scheduled_at - REPORT_LEAD_DAYS days (else ERR_REPORT_DEADLINE_PASSED)"
        side_effects: ["submitted_at = clock now"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /court-reports/{id}/review (decision=APPROVE)"
        actor: Supervisor
        preconditions:
          - "CourtReport.status == SUBMITTED (else ERR_INVALID_STATE)"
          - "acting supervisor.id == Case.supervisor_id (else ERR_UNAUTHORIZED) — segregation of duties: the review role (Supervisor) is disjoint from the author role (Volunteer), and only the case's own supervisor may review"
        side_effects: ["reviewer_supervisor_id set", "new ReviewNote(decision=APPROVE) appended"]
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /court-reports/{id}/review (decision=RETURN)"
        actor: Supervisor
        preconditions: ["CourtReport.status == SUBMITTED", "acting supervisor.id == Case.supervisor_id"]
        side_effects: ["reviewer_supervisor_id set", "new ReviewNote(decision=RETURN) appended"]
      - from: RETURNED
        to: DRAFT
        trigger: "POST /court-reports/{id}/revise"
        actor: Volunteer
        preconditions: ["CourtReport.status == RETURNED (else ERR_INVALID_STATE)", "acting volunteer.id == author_volunteer_id (else ERR_UNAUTHORIZED)"]
        side_effects: ["content_summary/recommendation optionally updated", "revision_count incremented by 1"]
      - from: APPROVED
        to: FILED
        trigger: "POST /court-reports/{id}/file"
        actor: Supervisor
        preconditions: ["CourtReport.status == APPROVED (else ERR_INVALID_STATE)", "acting supervisor.id == Case.supervisor_id"]
        side_effects: []
      - from: DRAFT
        to: VOIDED
        trigger: "system: cascade L3 from volunteer deactivate/resign"
        actor: system
        preconditions: ["CourtReport.status in {DRAFT, RETURNED}"]
        side_effects: []
        note: "VOIDED is reached only by cascade; there is no direct void endpoint for reports."
      - from: RETURNED
        to: VOIDED
        trigger: "system: cascade L3 from volunteer deactivate/resign"
        actor: system
        preconditions: ["CourtReport.status in {DRAFT, RETURNED}"]
        side_effects: []

  - entity: ExpenseClaim
    initial_state: SUBMITTED
    terminal_states: [REJECTED, PAID, VOIDED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /expense-claims/{id}/approve"
        actor: Supervisor
        preconditions:
          - "ExpenseClaim.status == SUBMITTED (else ERR_INVALID_STATE)"
          - "acting supervisor.id == Case.supervisor_id of the claim's case (else ERR_UNAUTHORIZED)"
          - "referenced Case.status != CLOSED (else ERR_CASE_CLOSED)"
          - "Case.reimbursement_committed_cents + final_reimbursement_cents <= Case.reimbursement_budget_cents (else ERR_EXPENSE_EXCEEDS_BUDGET)"
        side_effects:
          - "final_reimbursement_cents pinned via FINAL variant of expense_reimbursement"
          - "Case.reimbursement_committed_cents increased by final_reimbursement_cents"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /expense-claims/{id}/reject"
        actor: Supervisor
        preconditions: ["ExpenseClaim.status == SUBMITTED (else ERR_INVALID_STATE)", "acting supervisor.id == Case.supervisor_id"]
        side_effects: ["no committed change (never entered the ledger)"]
      - from: APPROVED
        to: PAID
        trigger: "POST /expense-claims/{id}/pay"
        actor: Supervisor
        preconditions: ["ExpenseClaim.status == APPROVED (else ERR_INVALID_STATE)"]
        side_effects: ["no committed change (remains committed, now disbursed)"]
      - from: APPROVED
        to: VOIDED
        trigger: "POST /expense-claims/{id}/void"
        actor: Supervisor
        preconditions: ["ExpenseClaim.status == APPROVED (else ERR_INVALID_STATE)", "acting supervisor.id == Case.supervisor_id"]
        side_effects: ["Case.reimbursement_committed_cents decreased by final_reimbursement_cents (compensation restores the conserved quantity)"]

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: assignment-create-stale-case
    parent_entity: Case
    write_endpoint: "POST /cases/{id}/assignments"
    occ_field: "expected_case_version"
    description: |
      Appointing a volunteer to a Case whose version has advanced since the client
      last observed it is rejected. A new CaseAssignment legitimately supersedes any
      prior ACTIVE assignment (ended with reason SUPERSEDED); a client whose
      expected_case_version is behind the current Case.version has therefore acted on
      a stale view of the case's assignment state and is rejected on the version check.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: expense_reimbursement
    trigger: "ExpenseClaim submission (PROVISIONAL) and approval (FINAL)"
    algorithm: tiered_pricing
    formula: |
      Inputs: total_miles, other_expense_cents.
      PROVISIONAL (pinned into estimated_reimbursement_cents at submission):
        estimated = round_half_up(total_miles * STD_RATE_CENTS_PER_MILE) + other_expense_cents
        (flat per-mile rate, no caps)
      FINAL (pinned into final_reimbursement_cents at approval):
        mileage_cents = round_half_up( min(total_miles, TIER1_MILES) * TIER1_RATE_CENTS
                        + max(0, total_miles - TIER1_MILES) * TIER2_RATE_CENTS )
        other_cents   = min(other_expense_cents, OTHER_EXPENSE_CAP_CENTS)
        final = min(mileage_cents + other_cents, MONTHLY_REIMBURSEMENT_CAP_CENTS)
      Evaluation order is fixed: compute mileage, then cap other, then sum, then apply
      the monthly cap last.
    input_set: "A single ExpenseClaim's own fields; no aggregation across claims."
    constants:
      STD_RATE_CENTS_PER_MILE: 50
      TIER1_MILES: 100
      TIER1_RATE_CENTS: 50
      TIER2_RATE_CENTS: 35
      OTHER_EXPENSE_CAP_CENTS: 5000
      MONTHLY_REIMBURSEMENT_CAP_CENTS: 15000
    precision: "integer cents, round_half_up on mileage products"
    variants:
      - name: PROVISIONAL
        when: "at submission (status SUBMITTED)"
        difference: "flat STD_RATE_CENTS_PER_MILE per mile, other_expense uncapped, no monthly cap"
      - name: FINAL
        when: "at approval (status -> APPROVED)"
        difference: "tiered mileage (TIER1_RATE up to TIER1_MILES, TIER2_RATE beyond), other capped at OTHER_EXPENSE_CAP_CENTS, whole capped at MONTHLY_REIMBURSEMENT_CAP_CENTS"

  - name: case_contact_compliance
    trigger: "read of Case.contact_compliance_pct (STANDARD, live); pinned into audit_compliance_pct at close (STRICT)"
    algorithm: aggregation
    formula: |
      Let months = the set of calendar months from the month of the case's earliest
      CaseAssignment.created_at through the current clock month, inclusive.
      REQUIRED_MONTHS = count(months).
      For each month m in months:
        q_m = count of the case's Visit rows with status LOGGED whose contact_start
              falls in m AND whose contact_type is in the variant's QUALIFYING_TYPES set.
        month_score_m = round_half_up( min(1.0, q_m / CONTACT_STANDARD_PER_MONTH), 2 )
      compliance_pct = round_half_up( (sum over m of month_score_m) / REQUIRED_MONTHS * 100, 1 )
      Rounding order is fixed: round EACH month_score to 2 decimals FIRST, then sum,
      then divide, then multiply by 100 and round to 1 decimal. (Rounding raw ratios
      only at the end yields a different number and is NOT used.)
    input_set: "LOGGED visits of the case, bucketed by calendar month of contact_start."
    constants:
      CONTACT_STANDARD_PER_MONTH: 3
    precision: "month_score 2 decimals; compliance_pct 1 decimal; round_half_up"
    variants:
      - name: STANDARD
        when: "live read of Case.contact_compliance_pct"
        difference: "QUALIFYING_TYPES = {IN_PERSON, VIDEO}"
      - name: STRICT
        when: "pinned into audit_compliance_pct at case close"
        difference: "QUALIFYING_TYPES = {IN_PERSON} only; VIDEO/PHONE/COLLATERAL do not count"

  - name: volunteer_active_case_count
    trigger: "assignment create (+1), assignment end / case close / volunteer deactivate cascade (-1)"
    algorithm: aggregation
    formula: |
      Volunteer.active_case_count == count( CaseAssignment where volunteer_id == V.id
                                            AND status == ACTIVE ).
      Conserved: an assign followed by its compensating end leaves active_case_count
      exactly as it began.
    input_set: "CaseAssignment rows of the volunteer in status ACTIVE."
    precision: "integer count, floor 0"

  - name: case_reimbursement_committed
    trigger: "expense approve (+final), expense void (-final)"
    algorithm: aggregation
    formula: |
      Case.reimbursement_committed_cents == sum( ExpenseClaim.final_reimbursement_cents
        where case_id == C.id AND status in {APPROVED, PAID} ).
      Conserved money: approve then void the same claim leaves committed unchanged.
    input_set: "ExpenseClaim rows of the case in status APPROVED or PAID."
    precision: "integer cents"

  - name: background_expiry
    trigger: "BackgroundCheck clear"
    algorithm: threshold
    formula: |
      expiry_date = cleared_at + BACKGROUND_VALID_DAYS days.
      A CLEARED check with clock now >= expiry_date is treated as EXPIRED and the
      owning Volunteer.background_status becomes EXPIRED (gates swear-in / visit logging).
    constants:
      BACKGROUND_VALID_DAYS: 365
    precision: "day-granular datetime"

  - name: hearing_report_due
    trigger: "Hearing create"
    algorithm: threshold
    formula: |
      report_due_date = scheduled_at - REPORT_LEAD_DAYS days.
      A CourtReport for the hearing may move DRAFT->SUBMITTED only while
      clock now <= report_due_date (i.e. at least REPORT_LEAD_DAYS days before the hearing).
    constants:
      REPORT_LEAD_DAYS: 3
    precision: "second-granular datetime; boundary is inclusive (now == due is allowed)"

  - name: training_requirement
    trigger: "Volunteer swear-in (TRAINING->ACTIVE)"
    algorithm: threshold
    formula: |
      swear-in allowed only if Volunteer.training_hours_total >= TRAINING_HOURS_REQUIRED.
      Boundary is inclusive: exactly TRAINING_HOURS_REQUIRED hours passes; one hour short fails
      with ERR_TRAINING_INCOMPLETE.
    constants:
      TRAINING_HOURS_REQUIRED: 30
    precision: "hours compared with >=; boundary inclusive"

  - name: visit_interval_overlap
    trigger: "POST /cases/{id}/visits (interval occupation on the acting volunteer)"
    algorithm: interval_merge
    formula: |
      Resource = the acting Volunteer's calendar (across ALL that volunteer's cases).
      Treat each LOGGED Visit as the HALF-OPEN interval [contact_start, contact_end).
      Reject the new visit (ERR_VISIT_OVERLAP) iff there exists a LOGGED Visit V of the same
      volunteer with new.contact_start < V.contact_end AND V.contact_start < new.contact_end.
      Half-open semantics: exact adjacency (new.contact_start == V.contact_end, or
      new.contact_end == V.contact_start) does NOT overlap and is allowed.
    input_set: "The acting volunteer's LOGGED visits; VOIDED visits are ignored."
    precision: "second-granular; strict-inequality overlap test (half-open intervals)"

  - name: hearing_buffer_conflict
    trigger: "POST /cases/{id}/hearings (interval occupation on the case's hearing calendar)"
    algorithm: interval_merge
    formula: |
      Resource = the Case's hearing calendar. Each hearing is a POINT event at scheduled_at
      guarded by a symmetric BUFFER. Reject the new hearing (ERR_HEARING_BUFFER_CONFLICT) iff
      there exists a SCHEDULED Hearing H on the same case with
      abs(new.scheduled_at - H.scheduled_at) < HEARING_BUFFER_DAYS days.
      Buffer semantics: exactly HEARING_BUFFER_DAYS apart is allowed (strict <), and HELD /
      CONTINUED / CANCELLED hearings do not occupy the calendar.
    input_set: "The case's SCHEDULED hearings only."
    constants:
      HEARING_BUFFER_DAYS: 7
    precision: "day-granular buffer; strict-inequality (< buffer) rejects"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Acting role is permitted for the operation (RBAC), including ownership: Supervisor must equal Case.supervisor_id for case-scoped review/approval; Volunteer must own the addressed volunteer/expense resource. NOTE: the 'acting volunteer is the case's ACTIVE-assignment volunteer' gate for visit logging is a business_referential check at priority 6, NOT this auth rule."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path/body resource ids exist (volunteer, supervisor, case, assignment, hearing, report, background-check, expense-claim)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all
  - priority: 4
    category: state
    check: "Target/related resource is in a valid state for the operation (includes ERR_CASE_CLOSED on expense approve, ERR_HEARING_NOT_SCHEDULED on report submit, ERR_VOLUNTEER_NOT_ACTIVE on assign)"
    error_id: "varies (ERR_INVALID_STATE, ERR_CASE_CLOSED, ERR_HEARING_NOT_SCHEDULED, ERR_VOLUNTEER_NOT_ACTIVE)"
    http_status: 409
    applies_to: "state-transition and cross-entity-gated endpoints"
  - priority: 5
    category: business_temporal
    check: "Deadline & interval-overlap checks: report lead-time; visit intervals per volunteer must not overlap (half-open); hearings on a case must be >= HEARING_BUFFER_DAYS apart"
    error_id: "varies (ERR_REPORT_DEADLINE_PASSED, ERR_VISIT_OVERLAP, ERR_HEARING_BUFFER_CONFLICT)"
    http_status: 409
    applies_to: "POST court-reports submit, POST cases/{id}/visits, POST cases/{id}/hearings"
  - priority: 6
    category: business_referential
    check: "Relationship integrity: acting volunteer must be the case's ACTIVE-assignment volunteer to log a visit; hearing referenced by a court report must belong to the report's case"
    error_id: "varies (ERR_NOT_ASSIGNED_VOLUNTEER, ERR_HEARING_CASE_MISMATCH)"
    http_status: 409
    applies_to: "POST cases/{id}/visits, POST court-reports review, POST cases/{id}/court-reports"
  - priority: 7
    category: business_safety
    check: "Eligibility/compliance: acting volunteer background_status must be CLEARED and not expired to log visits or be sworn in; training hours must meet requirement to be sworn in"
    error_id: "varies (ERR_BACKGROUND_EXPIRED, ERR_TRAINING_INCOMPLETE)"
    http_status: 422
    applies_to: "POST cases/{id}/visits, POST volunteers/{id}/swear-in"
  - priority: 8
    category: business_constraint
    check: "Caseload cap: target volunteer active_case_count must be < max_caseload before a new assignment"
    error_id: ERR_CASELOAD_EXCEEDED
    http_status: 409
    applies_to: "POST cases/{id}/assignments"
  - priority: 9
    category: business_fiscal
    check: "Budget: Case.reimbursement_committed_cents + this claim's final_reimbursement_cents must not exceed reimbursement_budget_cents"
    error_id: ERR_EXPENSE_EXCEEDS_BUDGET
    http_status: 402
    applies_to: "POST expense-claims/{id}/approve"
  - priority: 10
    category: business_constraint
    check: "Field validity: required fields present, enums valid, contact_end > contact_start, hours > 0, miles >= 0, expected_case_version matches (OCC 412)"
    error_id: "varies (ERR_VALIDATION, ERR_STALE_CASE_VERSION)"
    http_status: 400
    applies_to: all writes

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["logical clock advanced to to_iso8601"]

  # --- Volunteer ---
  - method: POST
    path: "/volunteers"
    description: "Register a prospective volunteer"
    roles: [ProgramAdmin]
    code: 201
    input: [full_name, email, home_zip, "max_caseload?"]
    output: Volunteer
    side_effects: ["status=PROSPECT; active_case_count=0; background_status=NONE"]
  - method: GET
    path: "/volunteers"
    description: "List volunteers"
    roles: [ProgramAdmin, Supervisor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Volunteer[]"
    side_effects: []
  - method: GET
    path: "/volunteers/{id}"
    description: "Get a volunteer (background_status/expiry re-evaluated against the clock on read)"
    roles: [ProgramAdmin, Supervisor, Volunteer]
    code: 200
    input: []
    output: Volunteer
    side_effects: ["lazy BackgroundCheck CLEARED->EXPIRED evaluation reflected in background_status"]
  - method: POST
    path: "/volunteers/{id}/start-screening"
    description: "Begin screening (PROSPECT->SCREENING)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Volunteer
    side_effects: ["status->SCREENING"]
  - method: POST
    path: "/volunteers/{id}/swear-in"
    description: "Swear in a trained, background-cleared volunteer (TRAINING->ACTIVE)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Volunteer
    side_effects: ["status->ACTIVE; sworn_in_at set"]
  - method: POST
    path: "/volunteers/{id}/deactivate"
    description: "Deactivate an active volunteer (ACTIVE->INACTIVE) with cascade L1-L3"
    roles: [ProgramAdmin]
    code: 200
    input: ["reason?"]
    output: Volunteer
    side_effects: ["status->INACTIVE; end ACTIVE assignments; unassign their cases; void those cases' DRAFT/RETURNED reports; active_case_count->0"]
  - method: POST
    path: "/volunteers/{id}/resign"
    description: "Resign a volunteer (ACTIVE/INACTIVE->RESIGNED)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Volunteer
    side_effects: ["status->RESIGNED; if leaving ACTIVE, same cascade as deactivate"]
  - method: GET
    path: "/volunteers/{id}/assignments"
    description: "List a volunteer's case assignments (reverse of CaseAssignment.volunteer_id)"
    roles: [ProgramAdmin, Supervisor, Volunteer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CaseAssignment[]"
    side_effects: []
  - method: GET
    path: "/volunteers/{id}/visits"
    description: "List visits logged by a volunteer (reverse of Visit.volunteer_id)"
    roles: [ProgramAdmin, Supervisor, Volunteer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Visit[]"
    side_effects: []
  - method: GET
    path: "/volunteers/{id}/training-records"
    description: "List a volunteer's training records (reverse of TrainingRecord.volunteer_id)"
    roles: [ProgramAdmin, Supervisor, Volunteer]
    code: 200
    input: ["limit?", "offset?"]
    output: "TrainingRecord[]"
    side_effects: []
  - method: POST
    path: "/volunteers/{id}/training-records"
    description: "Record completion of a training module"
    roles: [ProgramAdmin, Volunteer]
    code: 201
    input: [module_name, hours, completed_at]
    output: TrainingRecord
    side_effects: ["Volunteer.training_hours_total recomputed"]
  - method: GET
    path: "/volunteers/{id}/background-checks"
    description: "List a volunteer's background checks (reverse of BackgroundCheck.volunteer_id)"
    roles: [ProgramAdmin, Supervisor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "BackgroundCheck[]"
    side_effects: []
  - method: POST
    path: "/volunteers/{id}/background-checks"
    description: "Order a background check for a volunteer"
    roles: [ProgramAdmin]
    code: 201
    input: [check_type]
    output: BackgroundCheck
    side_effects: ["status=PENDING"]

  # --- BackgroundCheck actions ---
  - method: POST
    path: "/background-checks/{id}/clear"
    description: "Clear a pending background check (PENDING->CLEARED)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: BackgroundCheck
    side_effects: ["cleared_at/expiry_date set; if owner in SCREENING, auto SCREENING->TRAINING"]
  - method: POST
    path: "/background-checks/{id}/flag"
    description: "Flag a pending background check (PENDING->FLAGGED)"
    roles: [ProgramAdmin]
    code: 200
    input: ["reason?"]
    output: BackgroundCheck
    side_effects: ["flag_reason set"]

  # --- Supervisor ---
  - method: POST
    path: "/supervisors"
    description: "Create a staff supervisor"
    roles: [ProgramAdmin]
    code: 201
    input: [full_name, email]
    output: Supervisor
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/supervisors/{id}"
    description: "Get a supervisor"
    roles: [ProgramAdmin, Supervisor]
    code: 200
    input: []
    output: Supervisor
    side_effects: []
  - method: GET
    path: "/supervisors/{id}/review-notes"
    description: "List review notes authored by a supervisor (reverse of ReviewNote.supervisor_id)"
    roles: [ProgramAdmin, Supervisor]
    code: 200
    input: ["limit?", "offset?"]
    output: "ReviewNote[]"
    side_effects: []

  # --- Case ---
  - method: POST
    path: "/cases"
    description: "Open a case for a child"
    roles: [ProgramAdmin]
    code: 201
    input: [child_initials, child_dob, jurisdiction, supervisor_id, "reimbursement_budget_cents?"]
    output: Case
    side_effects: ["status=INTAKE; reimbursement_committed_cents=0"]
  - method: GET
    path: "/cases"
    description: "List cases, optionally filtered by supervisor (reverse of Case.supervisor_id)"
    roles: [ProgramAdmin, Supervisor]
    code: 200
    input: ["supervisor_id?", "status?", "limit?", "offset?"]
    output: "Case[]"
    side_effects: []
  - method: GET
    path: "/cases/{id}"
    description: "Get a case (contact_compliance_pct computed live, STANDARD variant)"
    roles: [ProgramAdmin, Supervisor, Volunteer]
    code: 200
    input: []
    output: Case
    side_effects: []
  - method: POST
    path: "/cases/{id}/assignments"
    description: "Appoint a volunteer to the case (INTAKE/UNASSIGNED->ASSIGNED); OCC on Case.version; supersedes any prior ACTIVE assignment"
    roles: [Supervisor]
    code: 201
    input: [volunteer_id, expected_case_version]
    output: CaseAssignment
    side_effects: ["new ACTIVE CaseAssignment; prior ACTIVE assignment->ENDED(SUPERSEDED); volunteer.active_case_count += 1; increments Case.version by 1"]
  - method: GET
    path: "/cases/{id}/assignments"
    description: "List the case's assignments (reverse of CaseAssignment.case_id)"
    roles: [ProgramAdmin, Supervisor, Volunteer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CaseAssignment[]"
    side_effects: []
  - method: POST
    path: "/cases/{id}/assignments/{assignmentId}/end"
    description: "End an active assignment (ASSIGNED->UNASSIGNED)"
    roles: [Supervisor]
    code: 200
    input: ["reason?"]
    output: CaseAssignment
    side_effects: ["assignment->ENDED(MANUAL_END); volunteer.active_case_count -= 1; case->UNASSIGNED; increments Case.version by 1"]
  - method: POST
    path: "/cases/{id}/close"
    description: "Close the case with a permanency outcome (->CLOSED)"
    roles: [Supervisor]
    code: 200
    input: [outcome]
    output: Case
    side_effects: ["outcome set; audit_compliance_pct pinned (STRICT); end active assignment; cancel SCHEDULED hearings; increments Case.version by 1"]
  - method: POST
    path: "/cases/{id}/visits"
    description: "Log a visit/contact on the case (acting volunteer must be the case's ACTIVE-assignment volunteer)"
    roles: [Volunteer]
    code: 201
    input: [contact_type, contact_start, contact_end, "miles?", "notes?"]
    output: Visit
    side_effects: ["status=LOGGED; volunteer_id set; duration_minutes computed"]
  - method: GET
    path: "/cases/{id}/visits"
    description: "List the case's visits (reverse of Visit.case_id)"
    roles: [ProgramAdmin, Supervisor, Volunteer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Visit[]"
    side_effects: []
  - method: POST
    path: "/cases/{id}/hearings"
    description: "Schedule a hearing on the case (buffer conflict check against other SCHEDULED hearings)"
    roles: [Supervisor]
    code: 201
    input: [hearing_type, scheduled_at]
    output: Hearing
    side_effects: ["status=SCHEDULED; report_due_date computed"]
  - method: GET
    path: "/cases/{id}/hearings"
    description: "List the case's hearings (reverse of Hearing.case_id)"
    roles: [ProgramAdmin, Supervisor, Volunteer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Hearing[]"
    side_effects: []
  - method: POST
    path: "/cases/{id}/court-reports"
    description: "Create a draft court report for a hearing on this case"
    roles: [Volunteer]
    code: 201
    input: [hearing_id, content_summary, recommendation]
    output: CourtReport
    side_effects: ["status=DRAFT; author_volunteer_id set to acting volunteer"]

  # --- Hearing actions ---
  - method: POST
    path: "/hearings/{id}/hold"
    description: "Mark a hearing held (SCHEDULED->HELD)"
    roles: [Supervisor]
    code: 200
    input: []
    output: Hearing
    side_effects: ["status->HELD"]
  - method: POST
    path: "/hearings/{id}/continue"
    description: "Continue (postpone) a hearing (SCHEDULED->CONTINUED)"
    roles: [Supervisor]
    code: 200
    input: []
    output: Hearing
    side_effects: ["status->CONTINUED"]
  - method: POST
    path: "/hearings/{id}/cancel"
    description: "Cancel a hearing (SCHEDULED->CANCELLED)"
    roles: [Supervisor]
    code: 200
    input: []
    output: Hearing
    side_effects: ["status->CANCELLED"]

  # --- CourtReport ---
  - method: GET
    path: "/court-reports/{id}"
    description: "Get a court report"
    roles: [ProgramAdmin, Supervisor, Volunteer]
    code: 200
    input: []
    output: CourtReport
    side_effects: []
  - method: GET
    path: "/court-reports"
    description: "List/filter court reports (reverse of case_id, hearing_id, author_volunteer_id, reviewer_supervisor_id)"
    roles: [ProgramAdmin, Supervisor]
    code: 200
    input: ["case_id?", "hearing_id?", "author_volunteer_id?", "reviewer_supervisor_id?", "status?", "limit?", "offset?"]
    output: "CourtReport[]"
    side_effects: []
  - method: GET
    path: "/court-reports/{id}/review-notes"
    description: "List review notes for a report (reverse of ReviewNote.report_id)"
    roles: [ProgramAdmin, Supervisor, Volunteer]
    code: 200
    input: ["limit?", "offset?"]
    output: "ReviewNote[]"
    side_effects: []
  - method: POST
    path: "/court-reports/{id}/submit"
    description: "Submit a draft report for supervisor review (DRAFT->SUBMITTED); enforces hearing-scheduled and lead-time"
    roles: [Volunteer]
    code: 200
    input: []
    output: CourtReport
    side_effects: ["submitted_at set"]
  - method: POST
    path: "/court-reports/{id}/review"
    description: "Supervisor reviews a submitted report (SUBMITTED->APPROVED or ->RETURNED); appends a ReviewNote"
    roles: [Supervisor]
    code: 200
    input: [decision, "comments?"]
    output: CourtReport
    side_effects: ["reviewer_supervisor_id set; ReviewNote appended; status per decision"]
  - method: POST
    path: "/court-reports/{id}/revise"
    description: "Author revises a returned report (RETURNED->DRAFT); increments revision_count"
    roles: [Volunteer]
    code: 200
    input: ["content_summary?", "recommendation?"]
    output: CourtReport
    side_effects: ["revision_count += 1"]
  - method: POST
    path: "/court-reports/{id}/file"
    description: "File an approved report with the court (APPROVED->FILED)"
    roles: [Supervisor]
    code: 200
    input: []
    output: CourtReport
    side_effects: ["status->FILED"]

  # --- Visit action ---
  - method: POST
    path: "/visits/{id}/void"
    description: "Void a logged visit (LOGGED->VOIDED); removes it from compliance counting"
    roles: [Supervisor, Volunteer]
    code: 200
    input: ["reason?"]
    output: Visit
    side_effects: ["status->VOIDED"]

  # --- ExpenseClaim ---
  - method: POST
    path: "/expense-claims"
    description: "Submit a mileage/expense claim against a case"
    roles: [Volunteer]
    code: 201
    input: [case_id, period_month, total_miles, "other_expense_cents?"]
    output: ExpenseClaim
    side_effects: ["status=SUBMITTED; estimated_reimbursement_cents pinned (PROVISIONAL variant)"]
  - method: GET
    path: "/expense-claims/{id}"
    description: "Get an expense claim"
    roles: [ProgramAdmin, Supervisor, Volunteer]
    code: 200
    input: []
    output: ExpenseClaim
    side_effects: []
  - method: GET
    path: "/expense-claims"
    description: "List/filter expense claims (reverse of volunteer_id and case_id)"
    roles: [ProgramAdmin, Supervisor]
    code: 200
    input: ["volunteer_id?", "case_id?", "status?", "limit?", "offset?"]
    output: "ExpenseClaim[]"
    side_effects: []
  - method: POST
    path: "/expense-claims/{id}/approve"
    description: "Approve a submitted claim (SUBMITTED->APPROVED); pins final amount and commits budget"
    roles: [Supervisor]
    code: 200
    input: []
    output: ExpenseClaim
    side_effects: ["final_reimbursement_cents pinned (FINAL variant); Case.reimbursement_committed_cents += final"]
  - method: POST
    path: "/expense-claims/{id}/reject"
    description: "Reject a submitted claim (SUBMITTED->REJECTED)"
    roles: [Supervisor]
    code: 200
    input: ["reason?"]
    output: ExpenseClaim
    side_effects: ["no budget change"]
  - method: POST
    path: "/expense-claims/{id}/pay"
    description: "Mark an approved claim paid (APPROVED->PAID)"
    roles: [Supervisor, ProgramAdmin]
    code: 200
    input: []
    output: ExpenseClaim
    side_effects: ["no budget change (remains committed)"]
  - method: POST
    path: "/expense-claims/{id}/void"
    description: "Void an approved claim (APPROVED->VOIDED); releases committed budget"
    roles: [Supervisor]
    code: 200
    input: ["reason?"]
    output: ExpenseClaim
    side_effects: ["Case.reimbursement_committed_cents -= final_reimbursement_cents"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or invalid" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, bad enum, contact_end <= contact_start, hours <= 0, miles < 0, negative cents" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role/identity not permitted (RBAC or ownership: supervisor not the case's supervisor; volunteer not owner)" }
  - { id: ERR_VOLUNTEER_NOT_FOUND, http: 404, condition: "volunteerId does not exist" }
  - { id: ERR_SUPERVISOR_NOT_FOUND, http: 404, condition: "supervisorId does not exist" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "caseId does not exist" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "assignmentId does not exist on the case" }
  - { id: ERR_VISIT_NOT_FOUND, http: 404, condition: "visitId does not exist" }
  - { id: ERR_HEARING_NOT_FOUND, http: 404, condition: "hearingId does not exist (path or referenced hearing_id)" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "reportId does not exist" }
  - { id: ERR_BACKGROUND_CHECK_NOT_FOUND, http: 404, condition: "backgroundCheckId does not exist" }
  - { id: ERR_EXPENSE_CLAIM_NOT_FOUND, http: 404, condition: "expenseClaimId does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_CASE_CLOSED, http: 409, condition: "Operation requires the referenced case not be CLOSED (e.g. approving an expense on a closed case)" }
  - { id: ERR_VOLUNTEER_NOT_ACTIVE, http: 409, condition: "Assignment target volunteer is not in ACTIVE status" }
  - { id: ERR_HEARING_NOT_SCHEDULED, http: 409, condition: "Report submit requires the linked hearing to be SCHEDULED" }
  - { id: ERR_REPORT_DEADLINE_PASSED, http: 409, condition: "Report submitted fewer than REPORT_LEAD_DAYS days before the hearing (now > scheduled_at - REPORT_LEAD_DAYS)" }
  - { id: ERR_VISIT_OVERLAP, http: 409, condition: "Acting volunteer already has a LOGGED visit whose [contact_start, contact_end) interval overlaps the new one" }
  - { id: ERR_HEARING_BUFFER_CONFLICT, http: 409, condition: "Another SCHEDULED hearing on the case is within HEARING_BUFFER_DAYS days of scheduled_at" }
  - { id: ERR_NOT_ASSIGNED_VOLUNTEER, http: 409, condition: "Acting volunteer is not the case's ACTIVE-assignment volunteer" }
  - { id: ERR_HEARING_CASE_MISMATCH, http: 409, condition: "hearing_id on a court report belongs to a different case" }
  - { id: ERR_BACKGROUND_EXPIRED, http: 422, condition: "Acting/target volunteer background is not CLEARED or is past expiry_date" }
  - { id: ERR_TRAINING_INCOMPLETE, http: 422, condition: "Volunteer training_hours_total below TRAINING_HOURS_REQUIRED at swear-in" }
  - { id: ERR_CASELOAD_EXCEEDED, http: 409, condition: "Target volunteer active_case_count already at max_caseload" }
  - { id: ERR_NO_VISITS_LOGGED, http: 409, condition: "Closing a case with zero LOGGED visits" }
  - { id: ERR_EXPENSE_EXCEEDS_BUDGET, http: 402, condition: "Approval would push case reimbursement_committed_cents past reimbursement_budget_cents" }
  - { id: ERR_STALE_CASE_VERSION, http: 412, condition: "expected_case_version does not match current Case.version on assignment create" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Program staff who onboard volunteers/supervisors and open cases; run screening, background checks, swear-in, deactivation."
    identity: "opaque"
    exclusive_operations:
      - "POST /volunteers — register volunteer"
      - "POST /volunteers/{id}/start-screening, /swear-in, /deactivate, /resign"
      - "POST /volunteers/{id}/background-checks; POST /background-checks/{id}/clear, /flag"
      - "POST /supervisors — create supervisor"
      - "POST /cases — open case"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /volunteers/{id}/training-records (with Volunteer)"
      - "POST /expense-claims/{id}/pay (with Supervisor)"
      - "GET reads across volunteers, supervisors, cases, reports, expense-claims"
  - name: Supervisor
    description: "Staff supervisor who owns cases: appoints volunteers, schedules hearings, reviews/approves reports, approves/rejects/voids expenses, closes cases. Ownership: must equal Case.supervisor_id for case-scoped actions."
    identity: "entity_backed:Supervisor"
    exclusive_operations:
      - "POST /cases/{id}/assignments, /assignments/{aid}/end, /close"
      - "POST /cases/{id}/hearings; POST /hearings/{id}/hold, /continue, /cancel"
      - "POST /court-reports/{id}/review, /file"
      - "POST /expense-claims/{id}/approve, /reject, /void"
    shared_operations:
      - "POST /expense-claims/{id}/pay (with ProgramAdmin)"
      - "POST /visits/{id}/void (with Volunteer)"
      - "GET reads across cases, reports, visits, expense-claims, review-notes"
  - name: Volunteer
    description: "CASA/GAL advocate: logs visits, authors/submits/revises court reports, submits expense claims, records own training. Ownership: must be the case's ACTIVE-assignment volunteer / own resource."
    identity: "entity_backed:Volunteer"
    exclusive_operations:
      - "POST /cases/{id}/visits — log visit"
      - "POST /cases/{id}/court-reports — create draft report"
      - "POST /court-reports/{id}/submit, /revise"
      - "POST /expense-claims — submit expense claim"
    shared_operations:
      - "POST /volunteers/{id}/training-records (with ProgramAdmin)"
      - "POST /visits/{id}/void (with Supervisor)"
      - "GET own volunteer, assignments, visits, cases, reports, expense-claims"
