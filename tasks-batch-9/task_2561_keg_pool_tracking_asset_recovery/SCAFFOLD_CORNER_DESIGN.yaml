            - "KegPool.${p1_id}.kegs_available == 2 and kegs_servicing == 0 and available_pct == 100.00 and posture == OPEN"

      - name: repeat_activation_of_an_active_agreement_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.FloatAgreement.transitions.DRAFT_to_ACTIVE
          - validations[priority=10]
          - validations[priority=39]
        distinguishing_aspect: "Re-activating the SAME agreement is a state error, not a uniqueness error: priority 10 fires first with 409 ERR_INVALID_STATE, so ERR_AGREEMENT_ALREADY_ACTIVE is reserved for a second, distinct DRAFT agreement on the same (brewer, pool) pair."
        test_recipe:
          setup:
            - "Clock 2026-08-01T23:00:00Z; brewer RDG; pool HB-50L with two kegs; agreement fa1 activated effective 2026-08-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T23:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /commodity-index"
              payload: { effective_date: "2026-07-01", usd_cents_per_kg: 480, source: "LME_SS304" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /brewers"
              payload: { name: "Ridgeline Brewing", brand_code: "RDG", credit_limit_cents: 400000 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { b1_id: "$.data.id" }
            - call: "POST /pools"
              payload: { pool_code: "HB-50L", size_liters: 50, stainless_weight_kg: 12.5, replacement_cost_cents: 23500, region_code: "CO" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { p1_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0001" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0002" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /float-agreements"
              payload: { brewer_id: "${b1_id}", pool_id: "${p1_id}", float_size_kegs: 2, per_fill_rate_cents: 2200 }
              as: PoolOperator
              as_user_id: "op-1"
