          assert:
            - "setup GET /race-editions/${ed_id} (before the trigger) returns appearance_committed_cents == 1216000, purse_allocated_cents == 1000000 and purse_unallocated_cents == 9000000"
            - "trigger call 1 (hop 1) returns 200 with status == ADVERSE"
            - "trigger call 2 (hop 2) returns certification_status == DISQUALIFIED, dq_reason == ADVERSE_ANALYTICAL_FINDING, place_overall == null, place_division == null, tie_group_size == 1, and record_claim_status == REJECTED (hop 3, cross-dimension)"
            - "trigger call 3 (hop 3) returns status == CLAWBACK_PENDING with gross_amount_cents still 1000000 and paid_at unchanged — the money already left, so the award is NOT VOID"
            - "trigger call 4 (hop 3) returns status == BREACHED, guaranteed_commitment_cents == 0 and bib_number == null"
            - "trigger call 5 (hop 4) returns total_count == 1 with data[0].status == RELEASED"
            - "trigger call 6 (hop 4) returns appearance_committed_cents == 0, appearance_uncommitted_cents == 10000000, purse_allocated_cents == 1000000 and purse_unallocated_cents == 9000000 — INV-2 holds because CLAWBACK_PENDING cents stay allocated"
            - "trigger call 7 returns status == CLEARED — the IN_COMPETITION test is untouched by the cascade"

