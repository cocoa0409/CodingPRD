      - name: cured_dues_reset_the_late_fee_clock_and_later_sweeps_add_nothing
        claim_type: threshold_reset
        grounds:
          - calculations.dues_late_fee
          - endpoints["POST /ops/dues-delinquency-run"]
          - endpoints["POST /dues-invoices/{id}/payments"]
          - state_machines.DuesInvoice
        distinguishing_aspect: "The reset half of the threshold layer: once the invoice is PAID the accrual stops, so two further sweeps 40 and 80 days later must add nothing at all — no new late fee on the settled invoice, no second invoice, no return to GRACE — even though the invoice's own due_date recedes ever further into the past. A naive implementation that re-derives dues_status from days_past_due instead of from the set of unsettled invoices re-delinquents this membership on the second sweep."
        test_recipe:
          setup:
            - "One CLASSIC membership sold at clock 2026-08-01 with a 45360 invoice due 2026-08-31, swept once at 2026-09-29 (29 days past due) so it carries a 680 late fee and dues_status GRACE before the cure"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /membership-tiers"
