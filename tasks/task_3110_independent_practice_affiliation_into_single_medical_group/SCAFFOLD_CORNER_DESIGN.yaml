  # ===========================================================================
  - section: validations
    instances:

      - name: missing_headers_returns_user_context_error
        claim_type: Violation to Error
        grounds:
          - validations[priority=1]
          - errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
        distinguishing_aspect: "A request with no X-User-ID/X-User-Role headers fails at priority 1 with 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER — before role, existence, or any business check, even when the path id does not exist."
        test_recipe:
          setup: ["Clock set; nothing else."]
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /api/practices/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ""
              captures: { error_id: $.data.error_id }
          assert:
            - "the request without auth headers returns 400 and error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (not 404)"

      - name: required_field_error_precedes_not_found
        claim_type: Priority Ordering
        grounds:
          - validations[priority=3.5]
          - validations[priority=4]
        distinguishing_aspect: "A batch create missing the required period AND referencing an unknown practice fails with 400 ERR_INVALID_REQUEST — request shape (3.5) precedes FK existence (4)."
        test_recipe:
          setup: ["Clock set; nothing else needed."]
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /api/collection-batches"
              payload: { practice_id: "00000000-0000-4000-8000-000000000001", payer_contract_id: "00000000-0000-4000-8000-000000000002", posted_amount_cents: 1000 }
              as: DistributionAccountant
              as_user_id: "da-roy"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "error_id != ERR_PRACTICE_NOT_FOUND"

