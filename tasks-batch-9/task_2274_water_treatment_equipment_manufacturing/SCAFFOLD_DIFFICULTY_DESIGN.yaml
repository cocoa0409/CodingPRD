              payload: { deliverable_type: "SPARE_PARTS_LIST", decision: "ACCEPT" }
              as: OwnerRepresentative
              as_user_id: "own-1"
            - call: "POST /water-treatment/performance-demos"
              payload: { project_id: "${proj_id}", skid_id: "${skid_f_id}", window_start_at: "2026-08-20T00:00:00.000Z", window_end_at: "2026-08-27T00:00:00.000Z", readings: [{ parameter: "TURBIDITY_NTU", measured_value: 0.250 }] }
              as: CommissioningEngineer
              as_user_id: "comm-1"
              captures: { demo_id: "$.data.id" }
            - call: "POST /water-treatment/projects/${proj_id}/service-agreements"
              payload: { term_months: 60, annual_fee_cents: 4800000, reserve_funded_cents: 12200000, membrane_installed_at: "2026-08-01T00:00:00.000Z" }
              as: ContractsAdministrator
              as_user_id: "ca-1"
              captures: { agr_id: "$.data.id" }
            - call: "POST /water-treatment/performance-demos/${demo_id}/certify"
              payload: { certification: "PASS" }
