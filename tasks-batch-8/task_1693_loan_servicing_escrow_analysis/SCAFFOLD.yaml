    path: "/servicing/analyses/{id}"
    description: "Get one analysis cycle"
    roles: [ComplianceOfficer, EscrowAnalyst, DisbursementProcessor, PayeeVerifier, InsuranceSpecialist, Borrower]
    code: 200
    input: []
    output: EscrowAnalysisCycle
    side_effects: []
  - method: POST
    path: "/servicing/analyses/{id}/compute"
    description: "Run the trial-balance projection and shortage/deficiency/surplus determination"
    roles: [EscrowAnalyst]
    code: 200
    input: []
    output: EscrowAnalysisCycle
    side_effects: ["DRAFT|REOPENED -> COMPUTED; all computed fields populated per trial_balance_projection + shortage_deficiency_surplus + monthly_escrow_payment; increments EscrowAnalysisCycle.version by 1"]
  - method: POST
    path: "/servicing/analyses/{id}/issue-statement"
    description: "Issue the annual escrow statement (RESPA: within 30 days of compute)"
    roles: [EscrowAnalyst]
    code: 200
    input: []
    output: EscrowAnalysisCycle
    side_effects: ["COMPUTED -> STATEMENT_ISSUED; statement_issued_at, statement_due_date, statement_timeliness set; increments EscrowAnalysisCycle.version by 1"]
  - method: POST
    path: "/servicing/analyses/{id}/finalize"
    description: "Make the analysis EFFECTIVE; creates the payment-change notice and handles surplus"
    roles: [EscrowAnalyst]
    code: 200
    input: []
    output: EscrowAnalysisCycle
    side_effects: ["STATEMENT_ISSUED -> EFFECTIVE; create PaymentChangeNotice (DRAFT); surplus >= 5000 posts SURPLUS_REFUND entry -surplus_cents; prior EFFECTIVE cycle -> SUPERSEDED; account last_analysis_year and next_analysis_due_date updated; increments EscrowAnalysisCycle.version and EscrowAccount.version by 1"]
