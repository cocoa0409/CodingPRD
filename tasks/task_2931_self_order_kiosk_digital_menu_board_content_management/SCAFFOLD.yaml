  # ---- PriceChangeRequest ----------------------------------------------------
  - method: POST
    path: "/kiosk-ops/price-change-requests"
    description: "Open a zone price change request. The baseline, uplift_bp and required_approvals are computed here and pinned for the request's lifetime. Guarded by optimistic concurrency on the menu item's `version`."
    roles: [PricingAnalyst]
    code: 201
    input: [menu_item_id, price_zone_id, proposed_price_cents, justification, effective_from_utc, expected_menu_item_version]
    output: PriceChangeRequest
    side_effects:
      - "increments MenuItem.version by 1"
      - "computes baseline_price_cents, uplift_bp and required_approvals per calculation price_uplift_and_approval_tier"
      - "sets state to DRAFT, revision_round to 0, requested_by_user_id to X-User-ID and pinned_menu_item_version to the item's new version; the request enters the approval queue only after action=SUBMIT"
      - "increments MenuItem.pending_price_request_count by 1 and sets MenuItem.pricing_lock_state to PENDING_CHANGE"
      - "appends an AuditEvent with subject_kind PRICE_CHANGE_REQUEST and action REQUEST_OPENED"

  - method: GET
    path: "/kiosk-ops/price-change-requests"
    description: "List price change requests; filter by menu item, price zone or workflow state."
    roles: [PlatformAdmin, PricingAnalyst, PricingApprover, ComplianceOfficer]
    code: 200
    input: ["menu_item_id?", "price_zone_id?", "state?", "limit?", "offset?"]
    output: PriceChangeRequest[]
    side_effects: []

  - method: GET
    path: "/kiosk-ops/price-change-requests/{request_id}"
    description: "Fetch one price change request with its pinned baseline, uplift_bp, required_approvals and approval_user_ids."
    roles: [PlatformAdmin, PricingAnalyst, PricingApprover, ComplianceOfficer]
    code: 200
    input: []
    output: PriceChangeRequest
    side_effects: []

  - method: POST
    path: "/kiosk-ops/price-change-requests/{request_id}/actions"
    description: "Drive the price approval workflow. `action` is one of SUBMIT, APPROVE, REJECT, REQUEST_CHANGES, APPLY, WITHDRAW, ROLLBACK; the permitted verbs per role are listed in §1.7 and the permitted verbs per state in §1.2."
    roles: [PricingAnalyst, PricingApprover, PlatformAdmin]
    code: 200
    input: [action, "comment?", "proposed_price_cents?"]
    output: PriceChangeRequest
    side_effects:
      - "APPROVE appends X-User-ID to approval_user_ids and moves to APPROVED once COUNT(approval_user_ids) >= required_approvals"
      - "SUBMIT moves DRAFT -> PENDING_APPROVAL; REQUEST_CHANGES moves to CHANGES_REQUESTED and clears approval_user_ids; a second SUBMIT out of CHANGES_REQUESTED increments revision_round, re-derives baseline_price_cents/uplift_bp/required_approvals from the optional proposed_price_cents, and returns to PENDING_APPROVAL"
      - "APPLY writes or replaces the MenuItem.zone_price_overrides entry for price_zone_id, sets applied_price_cents, recomputes zone_override_total_cents, decrements pending_price_request_count, and cascades: marks every affected ContentBundle stale_flag true, marks every Device caching such a bundle cache_state STALE, and re-derives each such Device's owning Store.content_posture"
      - "APPLY increments MenuItem.version by 1"
      - "ROLLBACK restores the previous override value (or removes the override when there was none) and re-runs the same cascade"
      - "every action appends an AuditEvent with the acting role, before_value_cents and after_value_cents"

  # ---- StoreItemAvailability -------------------------------------------------
  - method: POST
    path: "/kiosk-ops/stores/{store_id}/item-availabilities"
    description: "Attach a menu item to a store's inventory feed with its on-hand, reserved and par units."
    roles: [PlatformAdmin, StoreOperator]
    code: 201
    input: [menu_item_id, on_hand_units, "reserved_units?", par_units]
    output: StoreItemAvailability
    side_effects:
      - "derives available_units, supply_state and availability_state per calculation availability_rollup"
      - "sets listing_state to LISTED, eighty_six_state to NONE and last_sync_utc to the logical clock"
      - "re-derives MenuItem.chainwide_availability_state from every availability row of the item"

  - method: GET
    path: "/kiosk-ops/item-availabilities"
    description: "List store/item availability rows; filter by store, by menu item or by derived availability state."
    roles: [PlatformAdmin, ContentManager, PricingAnalyst, PricingApprover, ComplianceOfficer, StoreOperator]
    code: 200
    input: ["store_id?", "menu_item_id?", "availability_state?", "limit?", "offset?"]
    output: StoreItemAvailability[]
    side_effects: []

  - method: GET
    path: "/kiosk-ops/item-availabilities/{availability_id}"
    description: "Fetch one availability row with its recomputed available_units, supply_state and 86 window."
    roles: [PlatformAdmin, ContentManager, PricingAnalyst, PricingApprover, ComplianceOfficer, StoreOperator]
    code: 200
    input: []
    output: StoreItemAvailability
    side_effects:
      - "re-derives supply_state and availability_state, and expires an eighty_six_until_utc that the logical clock has passed"

  - method: POST
    path: "/kiosk-ops/item-availabilities/{availability_id}/actions"
    description: "Drive the availability/86 workflow. `action` is one of SYNC_ON_HAND, EIGHTY_SIX, RESTORE, DISCONTINUE."
    roles: [PlatformAdmin, StoreOperator]
    code: 200
    input: [action, "on_hand_units?", "reserved_units?", "eighty_six_reason?", "until_utc?"]
    output: StoreItemAvailability
    side_effects:
      - "SYNC_ON_HAND overwrites on_hand_units/reserved_units, sets last_sync_utc, and re-derives available_units, supply_state and availability_state"
      - "an inventory sync that drives available_units to 0 auto-86s the row: listing_state EIGHTY_SIXED, eighty_six_state AUTO_86, eighty_six_reason INVENTORY_DEPLETED, eighty_six_until_utc = clock + AUTO_86_HOLD_MINUTES (120 minutes)"
      - "EIGHTY_SIX sets eighty_six_state MANUAL_86 with eighty_six_until_utc taken from until_utc, then runs cascade links 1-5 of §1.2 StoreItemAvailability: MenuItem.chainwide_availability_state re-derived, every ACTIVE UpsellRule whose suggested_item_id became chain-wide UNAVAILABLE moves to SUSPENDED with suspended_reason SUGGESTED_ITEM_UNAVAILABLE, every PUBLISHED ContentBundle of each suspended rule's cluster sets stale_flag true and increments its version by 1, every Device caching such a bundle becomes cache_state STALE, and each owning Store re-derives content_posture"
      - "RESTORE reverses the cascade: listing_state LISTED, eighty_six_state NONE, eighty_six_until_utc and eighty_six_reason cleared, and every UpsellRule suspended with suspended_reason SUGGESTED_ITEM_UNAVAILABLE whose suggested item is available again returns to ACTIVE"
      - "DISCONTINUE is terminal: availability_state becomes UNAVAILABLE permanently and RESTORE is refused thereafter"
      - "appends an AuditEvent with subject_kind STORE_ITEM_AVAILABILITY"

  # ---- PromoCampaignVersion --------------------------------------------------
  - method: POST
    path: "/kiosk-ops/campaign-versions"
    description: "Draft a numbered version of a promotional campaign for a cluster, with its closed activation window, stacking group and priority rank."
    roles: [ContentManager]
    code: 201
    input: [campaign_code, version_no, cluster_id, discount_kind, discount_value, window_start_utc, window_end_utc, stacking_group, priority_rank]
    output: PromoCampaignVersion
    side_effects:
      - "sets state to DRAFT"
      - "rejects window_end_utc <= window_start_utc with ERR_CAMPAIGN_WINDOW_EXPIRED"

  - method: GET
    path: "/kiosk-ops/campaign-versions"
    description: "List campaign versions; filter by cluster, campaign code or lifecycle state."
    roles: [PlatformAdmin, ContentManager, PricingAnalyst, PricingApprover, ComplianceOfficer, StoreOperator]
    code: 200
    input: ["cluster_id?", "campaign_code?", "state?", "limit?", "offset?"]
    output: PromoCampaignVersion[]
    side_effects: []

  - method: GET
    path: "/kiosk-ops/campaign-versions/{version_id}"
    description: "Fetch one campaign version; the clock is re-evaluated so a SCHEDULED version whose window has opened reads ACTIVE and an ACTIVE version whose window has closed reads EXPIRED."
    roles: [PlatformAdmin, ContentManager, PricingAnalyst, PricingApprover, ComplianceOfficer, StoreOperator]
    code: 200
    input: []
    output: PromoCampaignVersion
    side_effects:
      - "re-evaluates the window against the logical clock and advances state SCHEDULED -> ACTIVE -> EXPIRED accordingly"

  - method: POST
    path: "/kiosk-ops/campaign-versions/{version_id}/actions"
    description: "Drive campaign versioning. `action` is one of SCHEDULE (DRAFT -> SCHEDULED, enforcing the stacking-group window conflict check) or WITHDRAW."
    roles: [ContentManager, PlatformAdmin]
    code: 200
    input: [action]
    output: PromoCampaignVersion
    side_effects:
      - "SCHEDULE supersedes any SCHEDULED or ACTIVE version with the same campaign_code and a lower version_no, moving it to SUPERSEDED"
      - "SCHEDULE pins pinned_bundle_version to the cluster's published_bundle_version"
      - "SCHEDULE is rejected with ERR_CAMPAIGN_WINDOW_CONFLICT when the closed window intersects another SCHEDULED or ACTIVE version of the same stacking_group in the same cluster"
      - "appends an AuditEvent with subject_kind PROMO_CAMPAIGN_VERSION"

