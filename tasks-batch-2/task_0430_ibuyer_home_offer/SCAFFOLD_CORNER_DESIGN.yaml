              payload: { transaction_id: "${txn_id}", list_price: 560000, resale_commission_pct: 0.03 }
              as: PricingAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_TRANSACTION_NOT_CLOSED"
            - "HTTP status == 409"

      - name: withdraw_locked_property_in_transaction_returns_error
        claim_type: Violation -> Error
        grounds:
          - validations[priority=5]
          - state_machines.Property.UNDER_OFFER_to_WITHDRAWN
