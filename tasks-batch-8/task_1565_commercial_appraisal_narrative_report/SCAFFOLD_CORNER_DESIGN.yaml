              as_user_id: "${aa_id}"
              captures: { rep1: $.data.id }
            - call: "POST /engagements/${eng_id}/reports"
              payload: { expected_engagement_version: "${eng_v}" }
              as: StaffAppraiser
              as_user_id: "${aa_id}"
              captures: { err: $.data.error_id }
            - call: "GET /engagements/${eng_id}"
              as: EngagementManager
              captures: { eng_v_fresh: $.data.version }
            - call: "POST /engagements/${eng_id}/reports"
              payload: { expected_engagement_version: "${eng_v_fresh}" }
              as: StaffAppraiser
              as_user_id: "${aa_id}"
              captures: { rep2: $.data.id, rep2_no: $.data.report_version_no }
          assert:
            - "first create succeeds (version matched)"
            - "second create with the same (now stale) version: error_id == ERR_STALE_ENGAGEMENT_VERSION (412)"
            - "retry with fresh version succeeds: Report.${rep2}.report_version_no == 2"

      - name: occ_revision_accept_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[revision-accept-stale-report]", "errors[ERR_STALE_REPORT_VERSION]"]
        distinguishing_aspect: "Revision accept carries expected_report_version: accepting R1 bumps report.version, so a later accept of R2 carrying the pre-R1 version fails 412; the value adjustment of the accepted request is applied exactly once."
        test_recipe:
          setup: ["report in CLIENT_REVIEW (value_conclusion_cents 106571429); request R1 created (report REVISION_REQUESTED)"]
          setup_api_calls:
            - call: "POST /clients"
