      - name: corner_validation_conditional_estimated_read_suppresses_the_irrigation_submeter_credit
        claim_type: conditional_validation
        grounds:
          - calculations.sewer_charge_with_submeter_credit
          - entities.Bill.fields.estimated_flag
        distinguishing_aspect: |
          The irrigation-submeter sewer credit is conditional on the bill being actually read. Two
          bills on the same master meter with identical 41000-gallon master consumption and identical
          9000 gallons of submeter volume price differently purely because of read_type: the ACTUAL
          bill takes an 8000-gallon credit and pays 2440 cents of sewer for a 40059 total, while the
          ESTIMATED bill takes no credit at all and pays the full capped 7320 for a 44939 total. An
          implementation that applies the credit unconditionally collapses the two.
        test_recipe:
          setup:
            - "RS-STD-2026 exists with SUMMER periods 2025-06 and 2025-07; the clock is 2026-08-01T00:00:00Z."
            - "ServiceAccount ACC-4005 has master meter MTR-Z-1 and an IRRIGATION_SUBMETER MTR-Z-2 hanging off it."
            - "Master reads 100000 / 141000 / 182000 give 41000 gallons in each period; submeter reads 5000 / 14000 / 23000 give 9000 gallons of irrigation volume in each period."
