      - name: staging_inclusive_window_aggregate_capacity
        grounds:
          - calculations.staging_capacity_utilization
          - errors[ERR_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Interval semantics: INCLUSIVE date ranges with per-day aggregate capacity
          summation on the dealership staging resource — windows sharing only their
          boundary date both count toward that day's total, and disjoint adjacent
