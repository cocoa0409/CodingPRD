scaffold_corner_design:
  # =====================================================================
  # Section: entities
  # =====================================================================
  - section: entities
    instances:
      - name: create_case_with_all_required_fields_returns_201
        claim_type: creation
        grounds:
          - "entities.EasementCase"
          - "\"endpoints[POST /easement-cases\"]"
        distinguishing_aspect: "POST with all required input fields returns 201 and echoes the fields."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /easement-cases"
              payload: { case_code: "ESM-C01", utility_district: "D1", county: "King", parcel_id: "P-C01", easement_width_ft: 50, easement_area_sqft: 10000, fair_market_value_per_sqft: 10, acquisition_budget_cents: 50000000 }
              as: RightOfWayAgent
              captures: { cid: $.data.id }
          assert:
            - "response.status_code == 201"
            - "EasementCase.${cid}.case_code == 'ESM-C01'"
            - "EasementCase.${cid}.status == INTAKE"
            - "EasementCase.${cid}.compensation_committed_cents == 0"
            - "EasementCase.${cid}.compensation_balance_cents == 50000000"
            - "EasementCase.${cid}.title_cleared == false"
            - "EasementCase.${cid}.version == 1"

      - name: create_case_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.EasementCase.fields.case_code"
          - "\"errors[ERR_INVALID_REQUEST\"]"
        distinguishing_aspect: "Omitting case_code yields 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /easement-cases"
              payload: { utility_district: "D1", county: "King", parcel_id: "P-C02", easement_width_ft: 50, easement_area_sqft: 10000, fair_market_value_per_sqft: 10, acquisition_budget_cents: 50000000 }
              as: RightOfWayAgent
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: get_case_by_id_returns_stored_data
        claim_type: retrieval
        grounds:
          - "\"endpoints[GET /easement-cases/{caseId}\"]"
        distinguishing_aspect: "GET returns the persisted entity with system fields populated."
        test_recipe:
          setup: ["One EasementCase exists"]
          setup_api_calls:
            - call: "POST /easement-cases"
              payload: { case_code: "ESM-C03", utility_district: "D1", county: "King", parcel_id: "P-C03", easement_width_ft: 50, easement_area_sqft: 10000, fair_market_value_per_sqft: 10, acquisition_budget_cents: 50000000 }
              as: RightOfWayAgent
              captures: { cid: $.data.id }
          trigger:
            - call: "GET /easement-cases/${cid}"
              payload: {}
              as: RightOfWayAgent
          assert:
            - "EasementCase.${cid}.case_code == 'ESM-C03'"
            - "EasementCase.${cid}.id is a UUID"
            - "EasementCase.${cid}.created_at is ISO8601"

      - name: list_cases_paginates
        claim_type: listing
        grounds:
          - "\"endpoints[GET /easement-cases\"]"
          - "response_envelope"
        distinguishing_aspect: "GET /easement-cases returns pagination_fields with defaults."
        test_recipe:
          setup: ["Three cases exist"]
          setup_api_calls:
            - call: "POST /easement-cases"
              payload: { case_code: "ESM-C04a", utility_district: "D1", county: "King", parcel_id: "P-1", easement_width_ft: 50, easement_area_sqft: 10000, fair_market_value_per_sqft: 10, acquisition_budget_cents: 100 }
              as: RightOfWayAgent
            - call: "POST /easement-cases"
              payload: { case_code: "ESM-C04b", utility_district: "D1", county: "King", parcel_id: "P-2", easement_width_ft: 50, easement_area_sqft: 10000, fair_market_value_per_sqft: 10, acquisition_budget_cents: 100 }
              as: RightOfWayAgent
            - call: "POST /easement-cases"
              payload: { case_code: "ESM-C04c", utility_district: "D1", county: "King", parcel_id: "P-3", easement_width_ft: 50, easement_area_sqft: 10000, fair_market_value_per_sqft: 10, acquisition_budget_cents: 100 }
              as: RightOfWayAgent
          trigger:
            - call: "GET /easement-cases"
              payload: { limit: 2, offset: 0 }
              as: RightOfWayAgent
          assert:
            - "len(response.data) == 2"
            - "response.data.total_count == 3"
            - "response.data.has_more == true"

      - name: get_nonexistent_case_returns_404
        claim_type: not_found
        grounds:
          - "\"errors[ERR_CASE_NOT_FOUND\"]"
        distinguishing_aspect: "GET with random UUID returns 404 ERR_CASE_NOT_FOUND."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "GET /easement-cases/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: RightOfWayAgent
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CASE_NOT_FOUND"

      - name: system_fields_input_ignored_on_case_create
        claim_type: system_fields
        grounds:
          - "entities.EasementCase"
        distinguishing_aspect: "Client-supplied id/version/created_at on POST are ignored."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /easement-cases"
              payload: { id: "11111111-1111-1111-1111-111111111111", version: 99, created_at: "2000-01-01T00:00:00Z", case_code: "ESM-C05", utility_district: "D1", county: "King", parcel_id: "P-C05", easement_width_ft: 50, easement_area_sqft: 10000, fair_market_value_per_sqft: 10, acquisition_budget_cents: 100 }
              as: RightOfWayAgent
              captures: { cid: $.data.id }
          assert:
            - "EasementCase.${cid}.id != '11111111-1111-1111-1111-111111111111'"
            - "EasementCase.${cid}.version == 1"
            - "EasementCase.${cid}.created_at > '2026-01-01T00:00:00Z'"

      - name: computed_fields_input_ignored_on_offer_create
        claim_type: computed_fields
        grounds:
          - "entities.AcquisitionOffer.fields.base_compensation_cents"
        distinguishing_aspect: "base_compensation_cents supplied by client is ignored; computed server-side."
        test_recipe:
          setup: ["EasementCase ACTIVE_MONITORING with title_cleared"]
          setup_api_calls:
            - call: "POST /easement-cases"
              payload: { case_code: "ESM-C06", utility_district: "D1", county: "King", parcel_id: "P-C06", easement_width_ft: 50, easement_area_sqft: 10000, fair_market_value_per_sqft: 10, acquisition_budget_cents: 50000000 }
              as: RightOfWayAgent
              captures: { cid: $.data.id }
            - call: "POST /easement-cases/${cid}/documents"
              payload: { doc_kind: "DEED", instrument_number: "INST-C06", recording_date: "2026-07-01T00:00:00Z", grantor_name: "S", grantee_name: "CU", gis_polygon_wkt: "POLYGON((0 0,1 0,1 1,0 1,0 0))", width_ft: 50 }
              as: TitleExaminer
              captures: { did: $.data.id }
            - call: "POST /easement-cases/${cid}/title-searches"
              payload: { search_scope: "FULL_CHAIN" }
              as: TitleExaminer
              captures: { tid: $.data.id }
            - call: "POST /easement-cases/${cid}/title-searches/${tid}/begin"
              payload: {}
              as: TitleExaminer
            - call: "POST /easement-cases/${cid}/title-searches/${tid}/complete"
              payload: { liens_found: 0, defects_found: 0, chain_of_title_json: { links: [] } }
              as: TitleExaminer
            - call: "POST /easement-cases/${cid}/documents/${did}/record"
              payload: {}
              as: TitleExaminer
            - call: "POST /easement-cases/${cid}/begin-mapping"
              payload: {}
              as: RightOfWayAgent
            - call: "POST /easement-cases/${cid}/activate-monitoring"
              payload: {}
              as: RightOfWayAgent
          trigger:
            - call: "POST /easement-cases/${cid}/offers"
              payload: { landowner_name: "X", landowner_contact: "x@x.com", offered_area_sqft: 100, severance_damages_cents: 0, base_compensation_cents: 999999 }
              as: RightOfWayAgent
              captures: { oid: $.data.id }
          assert:
            - "AcquisitionOffer.${oid}.base_compensation_cents == 100000"
            - "AcquisitionOffer.${oid}.base_compensation_cents != 999999"

      - name: enum_field_rejects_invalid_value
        claim_type: type_constraints
        grounds:
          - "entities.EasementDocument.fields.doc_kind"
        distinguishing_aspect: "Invalid doc_kind enum value yields 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["EasementCase exists"]
          setup_api_calls:
            - call: "POST /easement-cases"
              payload: { case_code: "ESM-C07", utility_district: "D1", county: "King", parcel_id: "P-C07", easement_width_ft: 50, easement_area_sqft: 10000, fair_market_value_per_sqft: 10, acquisition_budget_cents: 100 }
              as: RightOfWayAgent
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /easement-cases/${cid}/documents"
              payload: { doc_kind: "NOT_A_KIND", instrument_number: "INST-C07", recording_date: "2026-07-01T00:00:00Z", grantor_name: "S", grantee_name: "CU", gis_polygon_wkt: "POLYGON((0 0,1 0,1 1,0 1,0 0))", width_ft: 50 }
              as: TitleExaminer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: fk_reverse_reachable_via_filtered_list
        claim_type: parent_relationships
        grounds:
          - "\"endpoints[GET /easement-cases/{caseId}/documents\"]"
          - "entities.EasementDocument.fields.case_id"
        distinguishing_aspect: "Documents created under a case are discoverable via the sub-resource list."
        test_recipe:
          setup: ["Case with two documents"]
          setup_api_calls:
            - call: "POST /easement-cases"
              payload: { case_code: "ESM-C08", utility_district: "D1", county: "King", parcel_id: "P-C08", easement_width_ft: 50, easement_area_sqft: 10000, fair_market_value_per_sqft: 10, acquisition_budget_cents: 100 }
              as: RightOfWayAgent
              captures: { cid: $.data.id }
            - call: "POST /easement-cases/${cid}/documents"
              payload: { doc_kind: "DEED", instrument_number: "INST-C08a", recording_date: "2026-07-01T00:00:00Z", grantor_name: "S", grantee_name: "CU", gis_polygon_wkt: "POLYGON((0 0,1 0,1 1,0 1,0 0))", width_ft: 50 }
              as: TitleExaminer
            - call: "POST /easement-cases/${cid}/documents"
              payload: { doc_kind: "PLAT", instrument_number: "INST-C08b", recording_date: "2026-07-02T00:00:00Z", grantor_name: "S", grantee_name: "CU", gis_polygon_wkt: "POLYGON((0 0,2 0,2 1,0 1,0 0))", width_ft: 50 }
              as: TitleExaminer
          trigger:
            - call: "GET /easement-cases/${cid}/documents"
              payload: {}
              as: TitleExaminer
          assert:
            - "len(response.data) == 2"
            - "all docs have case_id == ${cid}"

  # =====================================================================
  # Section: state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: case_initial_state_is_intake
        claim_type: initial_state
        grounds:
          - "state_machines.EasementCase"
        distinguishing_aspect: "Newly created case starts in INTAKE."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /easement-cases"
              payload: { case_code: "ESM-S01", utility_district: "D1", county: "King", parcel_id: "P-S01", easement_width_ft: 50, easement_area_sqft: 10000, fair_market_value_per_sqft: 10, acquisition_budget_cents: 100 }
              as: RightOfWayAgent
              captures: { cid: $.data.id }
          assert:
            - "EasementCase.${cid}.status == INTAKE"

      - name: begin_mapping_from_intake_succeeds
        claim_type: valid_transition
        grounds:
          - "state_machines.EasementCase.INTAKE_to_MAPPING"
        distinguishing_aspect: "begin-mapping with one document present succeeds."
        test_recipe:
          setup: ["Case INTAKE with one DRAFT document"]
          setup_api_calls:
            - call: "POST /easement-cases"
              payload: { case_code: "ESM-S02", utility_district: "D1", county: "King", parcel_id: "P-S02", easement_width_ft: 50, easement_area_sqft: 10000, fair_market_value_per_sqft: 10, acquisition_budget_cents: 100 }
              as: RightOfWayAgent
              captures: { cid: $.data.id }
            - call: "POST /easement-cases/${cid}/documents"
              payload: { doc_kind: "DEED", instrument_number: "INST-S02", recording_date: "2026-07-01T00:00:00Z", grantor_name: "S", grantee_name: "CU", gis_polygon_wkt: "POLYGON((0 0,1 0,1 1,0 1,0 0))", width_ft: 50 }
              as: TitleExaminer
          trigger:
            - call: "POST /easement-cases/${cid}/begin-mapping"
              payload: {}
              as: RightOfWayAgent
          assert:
            - "EasementCase.${cid}.status == MAPPING"

      - name: begin_mapping_with_no_documents_fails
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.EasementCase.INTAKE_to_MAPPING"
          - "\"errors[ERR_NO_DOCUMENTS_ON_CASE\"]"
        distinguishing_aspect: "begin-mapping with zero documents returns ERR_NO_DOCUMENTS_ON_CASE."
        test_recipe:
          setup: ["Case INTAKE, no documents"]
          setup_api_calls:
            - call: "POST /easement-cases"
              payload: { case_code: "ESM-S03", utility_district: "D1", county: "King", parcel_id: "P-S03", easement_width_ft: 50, easement_area_sqft: 10000, fair_market_value_per_sqft: 10, acquisition_budget_cents: 100 }
              as: RightOfWayAgent
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /easement-cases/${cid}/begin-mapping"
              payload: {}
              as: RightOfWayAgent
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NO_DOCUMENTS_ON_CASE"

      - name: terminal_state_lockdown_on_closed_case
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.EasementCase"
        distinguishing_aspect: "After CLOSED_ABANDONED, no further transitions are permitted."
        test_recipe:
          setup: ["Case CLOSED_ABANDONED"]
          setup_api_calls:
            - call: "POST /easement-cases"
              payload: { case_code: "ESM-S04", utility_district: "D1", county: "King", parcel_id: "P-S04", easement_width_ft: 50, easement_area_sqft: 10000, fair_market_value_per_sqft: 10, acquisition_budget_cents: 100 }
              as: RightOfWayAgent
              captures: { cid: $.data.id }
            - call: "POST /easement-cases/${cid}/abandon"
              payload: {}
              as: DepartmentDirector
          trigger:
            - call: "POST /easement-cases/${cid}/begin-mapping"
              payload: {}
              as: RightOfWayAgent
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CASE_ALREADY_CLOSED"

      - name: idempotency_second_begin_mapping_rejected
        claim_type: idempotency
        grounds:
          - "state_machines.EasementCase.INTAKE_to_MAPPING"
        distinguishing_aspect: "Second begin-mapping call is rejected as invalid state."
        test_recipe:
          setup: ["Case MAPPING"]
          setup_api_calls:
            - call: "POST /easement-cases"
              payload: { case_code: "ESM-S05", utility_district: "D1", county: "King", parcel_id: "P-S05", easement_width_ft: 50, easement_area_sqft: 10000, fair_market_value_per_sqft: 10, acquisition_budget_cents: 100 }
              as: RightOfWayAgent
              captures: { cid: $.data.id }
            - call: "POST /easement-cases/${cid}/documents"
              payload: { doc_kind: "DEED", instrument_number: "INST-S05", recording_date: "2026-07-01T00:00:00Z", grantor_name: "S", grantee_name: "CU", gis_polygon_wkt: "POLYGON((0 0,1 0,1 1,0 1,0 0))", width_ft: 50 }
              as: TitleExaminer
            - call: "POST /easement-cases/${cid}/begin-mapping"
              payload: {}
              as: RightOfWayAgent
          trigger:
            - call: "POST /easement-cases/${cid}/begin-mapping"
              payload: {}
              as: RightOfWayAgent
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: invalid_transition_on_encroachment_from_discovered_to_negotiating
        claim_type: invalid_transition
        grounds:
          - "state_machines.Encroachment"
        distinguishing_aspect: "begin-negotiation on a DISCOVERED encroachment (not yet NOTIFIED) is rejected."
        test_recipe:
          setup: ["Case ACTIVE_MONITORING with encroachment DISCOVERED"]
          setup_api_calls:
            - call: "POST /easement-cases"
              payload: { case_code: "ESM-S06", utility_district: "D1", county: "King", parcel_id: "P-S06", easement_width_ft: 50, easement_area_sqft: 10000, fair_market_value_per_sqft: 10, acquisition_budget_cents: 50000000 }
              as: RightOfWayAgent
              captures: { cid: $.data.id }
            - call: "POST /easement-cases/${cid}/documents"
              payload: { doc_kind: "DEED", instrument_number: "INST-S06", recording_date: "2026-07-01T00:00:00Z", grantor_name: "S", grantee_name: "CU", gis_polygon_wkt: "POLYGON((0 0,1 0,1 1,0 1,0 0))", width_ft: 50 }
              as: TitleExaminer
              captures: { did: $.data.id }
            - call: "POST /easement-cases/${cid}/title-searches"
              payload: { search_scope: "FULL_CHAIN" }
              as: TitleExaminer
              captures: { tid: $.data.id }
            - call: "POST /easement-cases/${cid}/title-searches/${tid}/begin"
              payload: {}
              as: TitleExaminer
            - call: "POST /easement-cases/${cid}/title-searches/${tid}/complete"
              payload: { liens_found: 0, defects_found: 0, chain_of_title_json: { links: [] } }
              as: TitleExaminer
            - call: "POST /easement-cases/${cid}/documents/${did}/record"
              payload: {}
              as: TitleExaminer
            - call: "POST /easement-cases/${cid}/begin-mapping"
              payload: {}
              as: RightOfWayAgent
            - call: "POST /easement-cases/${cid}/activate-monitoring"
              payload: {}
              as: RightOfWayAgent
            - call: "POST /easement-cases/${cid}/encroachments"
              payload: { discovered_via: "FIELD_INSPECTION", encroachment_type: "FENCE", encroachment_area_sqft: 100, depth_into_easement_ft: 1, encroaches_document_id: "${did}", estimated_removal_cost_cents: 100 }
              as: RightOfWayAgent
              captures: { eid: $.data.id }
          trigger:
            - call: "POST /easement-cases/${cid}/encroachments/${eid}/begin-negotiation"
              payload: {}
              as: RightOfWayAgent
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: waive_only_minor_encroachment
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Encroachment.NEGOTIATING_to_WAIVED"
          - "\"errors[ERR_ONLY_MINOR_WAIVABLE\"]"
        distinguishing_aspect: "Waive on a SEVERE encroachment is rejected."
        test_recipe:
          setup: ["Case ACTIVE_MONITORING with SEVERE encroachment in NEGOTIATING"]
          setup_api_calls:
            - call: "POST /easement-cases"
              payload: { case_code: "ESM-S07", utility_district: "D1", county: "King", parcel_id: "P-S07", easement_width_ft: 50, easement_area_sqft: 10000, fair_market_value_per_sqft: 10, acquisition_budget_cents: 50000000 }
              as: RightOfWayAgent
              captures: { cid: $.data.id }
            - call: "POST /easement-cases/${cid}/documents"
              payload: { doc_kind: "DEED", instrument_number: "INST-S07", recording_date: "2026-07-01T00:00:00Z", grantor_name: "S", grantee_name: "CU", gis_polygon_wkt: "POLYGON((0 0,1 0,1 1,0 1,0 0))", width_ft: 50 }
              as: TitleExaminer
              captures: { did: $.data.id }
            - call: "POST /easement-cases/${cid}/title-searches"
              payload: { search_scope: "FULL_CHAIN" }
              as: TitleExaminer
              captures: { tid: $.data.id }
            - call: "POST /easement-cases/${cid}/title-searches/${tid}/begin"
              payload: {}
              as: TitleExaminer
            - call: "POST /easement-cases/${cid}/title-searches/${tid}/complete"
              payload: { liens_found: 0, defects_found: 0, chain_of_title_json: { links: [] } }
              as: TitleExaminer
            - call: "POST /easement-cases/${cid}/documents/${did}/record"
              payload: {}
              as: TitleExaminer
            - call: "POST /easement-cases/${cid}/begin-mapping"
              payload: {}
              as: RightOfWayAgent
            - call: "POST /easement-cases/${cid}/activate-monitoring"
              payload: {}
              as: RightOfWayAgent
            - call: "POST /easement-cases/${cid}/encroachments"
              payload: { discovered_via: "FIELD_INSPECTION", encroachment_type: "STRUCTURE", encroachment_area_sqft: 2500, depth_into_easement_ft: 10, encroaches_document_id: "${did}", estimated_removal_cost_cents: 100 }
              as: RightOfWayAgent
              captures: { eid: $.data.id }
            - call: "GET /easement-cases/${cid}"
              payload: {}
              as: RightOfWayAgent
              captures: { cv: $.data.version }
            - call: "POST /easement-cases/${cid}/encroachments/${eid}/notify"
              payload: { expected_case_version: "${cv}" }
              as: RightOfWayAgent
            - call: "POST /easement-cases/${cid}/encroachments/${eid}/begin-negotiation"
              payload: {}
              as: RightOfWayAgent
          trigger:
            - call: "POST /easement-cases/${cid}/encroachments/${eid}/waive"
              payload: {}
              as: DepartmentDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ONLY_MINOR_WAIVABLE"

      - name: escalate_requires_rounds_exhausted
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Encroachment.NEGOTIATING_to_ESCALATED_TO_LEGAL"
          - "\"errors[ERR_NEGOTIATION_ROUNDS_NOT_EXHAUSTED\"]"
        distinguishing_aspect: "Escalate before negotiation_round reaches MAX_NEGOTIATION_ROUNDS is rejected."
        test_recipe:
          setup: ["Encroachment NEGOTIATING with negotiation_round=1"]
          setup_api_calls:
            - call: "POST /easement-cases"
              payload: { case_code: "ESM-S08", utility_district: "D1", county: "King", parcel_id: "P-S08", easement_width_ft: 50, easement_area_sqft: 10000, fair_market_value_per_sqft: 10, acquisition_budget_cents: 50000000 }
              as: RightOfWayAgent
              captures: { cid: $.data.id }
            - call: "POST /easement-cases/${cid}/documents"
              payload: { doc_kind: "DEED", instrument_number: "INST-S08", recording_date: "2026-07-01T00:00:00Z", grantor_name: "S", grantee_name: "CU", gis_polygon_wkt: "POLYGON((0 0,1 0,1 1,0 1,0 0))", width_ft: 50 }
              as: TitleExaminer
              captures: { did: $.data.id }
            - call: "POST /easement-cases/${cid}/title-searches"
              payload: { search_scope: "FULL_CHAIN" }
              as: TitleExaminer
              captures: { tid: $.data.id }
            - call: "POST /easement-cases/${cid}/title-searches/${tid}/begin"
              payload: {}
              as: TitleExaminer
