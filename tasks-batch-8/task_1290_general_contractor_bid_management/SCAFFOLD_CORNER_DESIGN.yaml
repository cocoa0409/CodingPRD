        claim_type: creation
        grounds: [entities.Addendum.fields.number, entities.BidPackage.fields.issued_addendum_count]
        distinguishing_aspect: "Per-package sequence: two addenda on the same package get numbers 1 then 2; a different package starts its own sequence at 1."
        test_recipe:
