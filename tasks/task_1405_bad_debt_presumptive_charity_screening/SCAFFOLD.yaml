scenario: |
  Bad Debt & Presumptive Charity Screening (hospital self-pay unit): self-pay
  account aging & statement cycle, screening for presumptive charity eligibility,
  early-out vendor placement & performance, bad debt write-off criteria &
  Medicare bad-debt log, collection agency placement & recall rules, patient
  dispute & credit reporting policy, payment plan default handling, recovery
  accounting & reserve.

domain_name: bad-debt-presumptive-charity
api_prefix: /self-pay

# =============================================================================
# Complexity Profile (§0)
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
# Topology: flat — every entity is a peer addressed at /<api_prefix>/<collection>/{id}.
# FK fields link children to SelfPayAccount (or to each other). Sub-resource GETs
# are provided on the account for each FK to satisfy reverse-reachability.
entities:
  - name: SelfPayAccount
    parent: null
    common_fields: true
    fields:
      - { name: patient_mrn, type: string, source: input, description: "Patient medical record number (unique per unit)" }
      - { name: patient_name, type: string, source: input, description: "Patient display name" }
      - { name: original_balance_cents, type: integer, source: input, description: "Self-pay balance at guarantor liability date" }
      - { name: current_balance_cents, type: integer, source: computed, description: "original_balance_cents - sum(applied payments) - sum(charity/write-off/recovery adjustments). Never negative; mutation attempts that would drive it below 0 are rejected." }
      - { name: guarantor_liability_date, type: string, source: input, description: "ISO8601 date (YYYY-MM-DD) on which the balance became patient responsibility; day 0 of the aging clock" }
      - { name: aging_bucket, type: enum, source: computed, description: "CURRENT | BUCKET_30 | BUCKET_60 | BUCKET_90 | BUCKET_120_PLUS — derived from (logical_clock_date - guarantor_liability_date) using inclusive lower bound, exclusive upper bound" }
      - { name: aging_bucket_entered_at, type: string, source: computed, description: "ISO8601 datetime the account entered its current aging_bucket; reset on every bucket change" }
      - { name: statements_sent_count, type: integer, source: computed, default: 0, description: "Count of Statement rows with status IN {SENT, DELIVERED} for this account" }
      - { name: charity_writeoff_total_cents, type: integer, source: computed, default: 0, description: "Sum of BadDebtWriteOff.amount_cents for write_offs of this account with write_off_kind == CHARITY_CARE and status == POSTED" }
      - { name: bad_debt_writeoff_total_cents, type: integer, source: computed, default: 0, description: "Sum of BadDebtWriteOff.amount_cents for write_offs of this account with write_off_kind == BAD_DEBT and status == POSTED" }
      - { name: recovery_total_cents, type: integer, source: computed, default: 0, description: "Sum of RecoveryTransaction.amount_cents for this account" }
      - { name: credit_reporting_status, type: enum, source: computed, default: "NOT_REPORTED", description: "NOT_REPORTED | REPORTABLE | REPORTED | FROZEN_BY_DISPUTE | SUPPRESSED_BY_CHARITY" }
      - { name: status, type: enum, source: system, description: "OPEN | IN_EARLY_OUT | IN_COLLECTIONS | WRITTEN_OFF | CLOSED_PAID | CLOSED_CHARITY" }
      - { name: status_reason, type: string, source: system, description: "Free-text reason recorded on terminal transition" }

  - name: Statement
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> SelfPayAccount.id; owning account" }
      - { name: statement_index, type: integer, source: computed, description: "1-based sequence number of the statement for this account; increments per issuance" }
      - { name: issued_at, type: string, source: computed, description: "ISO8601 datetime the statement was issued (set from logical clock)" }
      - { name: due_date, type: string, source: computed, description: "ISO8601 date = (guarantor_liability_date + statement_index * STATEMENT_CYCLE_DAYS days)" }
      - { name: balance_at_issue_cents, type: integer, source: computed, description: "Snapshot of account.current_balance_cents at issue time" }
      - { name: status, type: enum, source: system, description: "DRAFT | SENT | DELIVERED | RETURNED_UNDELIVERABLE" }

  - name: PresumptiveCharityScreening
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> SelfPayAccount.id; screening target" }
      - { name: screening_model, type: enum, source: input, description: "FPL_TIERED | SCORE_BASED — which algorithm variant is applied" }
      - { name: household_size, type: integer, source: input, description: "Household size used for FPL lookup (required when screening_model == FPL_TIERED)" }
      - { name: household_income_cents, type: integer, source: input, description: "Annual household income in cents (required when screening_model == FPL_TIERED)" }
      - { name: third_party_score, type: integer, source: input, description: "Vendor presumptive score 0-1000 (required when screening_model == SCORE_BASED)" }
      - { name: fpl_percent, type: integer, source: computed, description: "Computed household income as % of FPL for household_size; null when screening_model == SCORE_BASED" }
      - { name: eligibility_outcome, type: enum, source: computed, description: "FULL_CHARITY | PARTIAL_CHARITY | NOT_ELIGIBLE | PENDING — derived at screening evaluation; PENDING until /evaluate is called" }
      - { name: charity_writeoff_percent, type: integer, source: computed, description: "100 for FULL_CHARITY, 50 for PARTIAL_CHARITY, 0 otherwise" }
      - { name: screened_at, type: string, source: computed, description: "ISO8601 datetime the /evaluate call ran (logical clock); null while PENDING" }
      - { name: status, type: enum, source: system, description: "PENDING | EVALUATED | SUPERSEDED | APPLIED" }

  - name: EarlyOutPlacement
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> SelfPayAccount.id; account placed with vendor" }
      - { name: vendor_name, type: string, source: input, description: "Vendor identifier (e.g. VENDOR_A, VENDOR_B)" }
      - { name: placement_balance_cents, type: integer, source: computed, description: "Snapshot of account.current_balance_cents at placement time" }
      - { name: contingency_fee_bps, type: integer, source: input, description: "Vendor contingency fee in basis points (1 bps = 0.01%)" }
      - { name: placed_at, type: string, source: computed, description: "ISO8601 datetime placed (logical clock)" }
      - { name: recall_deadline, type: string, source: computed, description: "ISO8601 date = guarantor_liability_date + EARLY_OUT_RECALL_DAYS days; account must be recalled or escalated by this date" }
      - { name: recovered_cents, type: integer, source: computed, default: 0, description: "Sum of RecoveryTransaction.amount_cents attributed to this placement" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RECALLED | ESCALATED_TO_AGENCY | COMPLETED_PAID" }

  - name: CollectionAgencyPlacement
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> SelfPayAccount.id; account placed with agency" }
      - { name: agency_name, type: string, source: input, description: "Collection agency identifier" }
      - { name: placement_balance_cents, type: integer, source: computed, description: "Snapshot of account.current_balance_cents at placement time" }
      - { name: contingency_fee_bps, type: integer, source: input, description: "Agency contingency fee in basis points" }
      - { name: placed_at, type: string, source: computed, description: "ISO8601 datetime placed (logical clock)" }
      - { name: recall_window_closes_at, type: string, source: computed, description: "ISO8601 date = placed_at + AGENCY_RECALL_WINDOW_DAYS days; recalls after this date incur a recall fee" }
      - { name: recovered_cents, type: integer, source: computed, default: 0, description: "Sum of RecoveryTransaction.amount_cents attributed to this placement" }
      - { name: credit_reported_at, type: string, source: system, description: "ISO8601 datetime the agency reported the debt to a consumer bureau; null until reported" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RECALLED_NO_FEE | RECALLED_WITH_FEE | CLOSED_PAID | CLOSED_DISPUTE" }

  - name: PatientDispute
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> SelfPayAccount.id; disputed account" }
      - { name: dispute_reason, type: string, source: input, description: "Patient-supplied free-text reason" }
      - { name: dispute_amount_cents, type: integer, source: input, description: "Portion of balance under dispute; must be > 0 and <= account.current_balance_cents at filing" }
      - { name: filed_at, type: string, source: computed, description: "ISO8601 datetime dispute filed (logical clock)" }
      - { name: investigation_due_at, type: string, source: computed, description: "ISO8601 date = filed_at + DISPUTE_INVESTIGATION_DAYS days; dispute auto-closes UNRESOLVED_EXPIRED at this date if not resolved" }
      - { name: resolved_at, type: string, source: system, description: "ISO8601 datetime of resolution; null while open" }
      - { name: resolution_outcome, type: enum, source: system, description: "null | UPHELD_PATIENT | UPHELD_PROVIDER | UNRESOLVED_EXPIRED" }
      - { name: status, type: enum, source: system, description: "OPEN | RESOLVED | EXPIRED" }

  - name: PaymentPlan
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> SelfPayAccount.id; plan account" }
      - { name: installment_amount_cents, type: integer, source: input, description: "Per-installment amount; must be > 0" }
      - { name: installment_count, type: integer, source: input, description: "Number of installments; must be >= 2 and <= MAX_INSTALLMENTS" }
      - { name: first_installment_due, type: string, source: input, description: "ISO8601 date of first installment" }
      - { name: installments_paid_count, type: integer, source: computed, default: 0, description: "Count of RecoveryTransaction rows attributed to this plan with payment_kind == INSTALLMENT" }
      - { name: missed_installment_count, type: integer, source: computed, default: 0, description: "Cumulative count of installments that passed their due date without full payment; computed by the advance-clock sweep" }
      - { name: default_flagged_at, type: string, source: system, description: "ISO8601 datetime plan was flagged in default; null until default triggers" }
      - { name: status, type: enum, source: system, description: "ACTIVE | IN_DEFAULT | CURED | COMPLETED | TERMINATED_DEFAULT" }

  - name: BadDebtWriteOff
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> SelfPayAccount.id; written-off account" }
      - { name: write_off_kind, type: enum, source: input, description: "BAD_DEBT | CHARITY_CARE" }
      - { name: amount_cents, type: integer, source: computed, description: "Write-off amount; snapshot of account.current_balance_cents at posting time (full balance only — partial write-offs are not supported)" }
      - { name: screening_id, type: string, source: system, description: "FK -> PresumptiveCharityScreening.id; required iff write_off_kind == CHARITY_CARE, null otherwise" }
      - { name: medicare_cost_report_year, type: integer, source: input, description: "Cost report year the write-off is claimed against (required iff write_off_kind == BAD_DEBT)" }
      - { name: posted_at, type: string, source: computed, description: "ISO8601 datetime write-off posted (logical clock)" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the approving RevenueIntegrityOfficer; segregation of duties: must differ from the requesting Collector's id" }
      - { name: status, type: enum, source: system, description: "PENDING_APPROVAL | POSTED | REVERSED" }

  - name: MedicareBadDebtLogEntry
    parent: null
    common_fields: false
    fields:
      - { name: write_off_id, type: string, source: system, description: "FK -> BadDebtWriteOff.id; source write-off" }
      - { name: account_id, type: string, source: system, description: "FK -> SelfPayAccount.id; denormalized for query" }
      - { name: cost_report_year, type: integer, source: system, description: "Copied from BadDebtWriteOff.medicare_cost_report_year at posting" }
      - { name: claimed_amount_cents, type: integer, source: system, description: "Amount claimed on the Medicare cost report" }
      - { name: indigence_documented, type: boolean, source: system, description: "true iff a PresumptiveCharityScreening row exists for this account with eligibility_outcome IN {FULL_CHARITY, PARTIAL_CHARITY} at log-entry creation time" }
      - { name: collection_effort_days, type: integer, source: system, description: "Days between guarantor_liability_date and write-off posted_at" }
      - { name: logged_at, type: string, source: system, description: "ISO8601 datetime log entry created (immutable)" }
      - { name: voided_at, type: string, source: system, description: "ISO8601 datetime of voiding; non-null iff the parent write-off is later REVERSED" }

  - name: RecoveryTransaction
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> SelfPayAccount.id; account credited" }
      - { name: payment_kind, type: enum, source: input, description: "INSTALLMENT | LUMP_SUM | AGENCY_REMITTANCE | EARLY_OUT_REMITTANCE | POST_WRITEOFF_RECOVERY" }
      - { name: amount_cents, type: integer, source: input, description: "Gross amount applied; must be > 0" }
      - { name: attributed_placement_id, type: string, source: input, description: "FK -> EarlyOutPlacement.id OR CollectionAgencyPlacement.id (required iff payment_kind IN {AGENCY_REMITTANCE, EARLY_OUT_REMITTANCE}); polymorphic reference resolved by payment_kind" }
      - { name: payment_plan_id, type: string, source: input, description: "FK -> PaymentPlan.id (required iff payment_kind == INSTALLMENT)" }
      - { name: write_off_id, type: string, source: input, description: "FK -> BadDebtWriteOff.id (required iff payment_kind == POST_WRITEOFF_RECOVERY)" }
      - { name: net_to_hospital_cents, type: integer, source: computed, description: "amount_cents less vendor/agency contingency fee when attributed; equal to amount_cents otherwise" }
      - { name: posted_at, type: string, source: computed, description: "ISO8601 datetime payment posted (logical clock)" }

  - name: VendorPerformanceSnapshot
    parent: null
    common_fields: false
    fields:
      - { name: vendor_name, type: string, source: input, description: "Vendor identifier this snapshot measures" }
      - { name: snapshot_period_start, type: string, source: input, description: "ISO8601 date (inclusive) of the measurement window" }
      - { name: snapshot_period_end, type: string, source: input, description: "ISO8601 date (exclusive) of the measurement window" }
      - { name: placements_in_window, type: integer, source: computed, description: "Count of EarlyOutPlacement rows for vendor_name with placed_at in [snapshot_period_start, snapshot_period_end)" }
      - { name: recovered_in_window_cents, type: integer, source: computed, description: "Sum of RecoveryTransaction.amount_cents attributed to those placements with posted_at in the window" }
      - { name: recovery_rate_bps, type: integer, source: computed, description: "recovered_in_window_cents * 10000 / sum(placement_balance_cents of placements_in_window); 0 when denominator is 0" }
      - { name: meets_minimum_threshold, type: boolean, source: computed, description: "recovery_rate_bps >= VENDOR_MIN_RECOVERY_BPS" }
      - { name: snapshot_generated_at, type: string, source: system, description: "ISO8601 datetime snapshot was generated (logical clock)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: SelfPayAccount
    initial_state: OPEN
    terminal_states: [CLOSED_PAID, CLOSED_CHARITY]
    transitions:
      - from: OPEN
        to: IN_EARLY_OUT
        trigger: "POST /self-pay/early-out-placements"
        actor: Collector
        preconditions:
          - "account.status == OPEN"
          - "account.aging_bucket IN {BUCKET_30, BUCKET_60} (ERR_ACCOUNT_NOT_IN_EARLY_OUT_BUCKET)"
          - "no other EarlyOutPlacement for this account with status == ACTIVE (ERR_ACTIVE_PLACEMENT_EXISTS)"
          - "no PresumptiveCharityScreening for this account with status == EVALUATED AND eligibility_outcome IN {FULL_CHARITY, PARTIAL_CHARITY} (ERR_CHARITY_ELIGIBLE_BLOCKS_PLACEMENT)"
        side_effects:
          - "account.status → IN_EARLY_OUT"
          - "account.version incremented"
          - "placement_balance_cents snapshot taken from account.current_balance_cents"
          - "recall_deadline computed from guarantor_liability_date + EARLY_OUT_RECALL_DAYS"

      - from: IN_EARLY_OUT
        to: OPEN
        trigger: "POST /self-pay/early-out-placements/{placementId}/recall"
        actor: Collector
        preconditions:
          - "placement.status == ACTIVE"
          - "logical_clock_date <= placement.recall_deadline (ERR_RECALL_DEADLINE_PASSED)"
        side_effects:
          - "placement.status → RECALLED"
          - "account.status → OPEN"
          - "account.version incremented"

      - from: IN_EARLY_OUT
        to: IN_COLLECTIONS
        trigger: "POST /self-pay/collection-agency-placements (escalation path)"
        actor: Collector
        preconditions:
          - "account.status == IN_EARLY_OUT"
          - "there exists an EarlyOutPlacement for this account with status == ACTIVE"
          - "logical_clock_date > active EarlyOutPlacement.recall_deadline (ERR_RECALL_WINDOW_STILL_OPEN)"
        side_effects:
          - "active EarlyOutPlacement.status → ESCALATED_TO_AGENCY"
          - "account.status → IN_COLLECTIONS"
          - "account.version incremented"
          - "agency placement placed_at, recall_window_closes_at stamped from logical clock"

      - from: OPEN
        to: IN_COLLECTIONS
        trigger: "POST /self-pay/collection-agency-placements (direct path)"
        actor: Collector
        preconditions:
          - "account.status == OPEN"
          - "account.aging_bucket == BUCKET_120_PLUS (ERR_ACCOUNT_NOT_IN_AGENCY_BUCKET)"
          - "account.statements_sent_count >= REQUIRED_STATEMENTS_BEFORE_AGENCY (ERR_INSUFFICIENT_STATEMENT_CYCLE)"
          - "no CollectionAgencyPlacement for this account with status == ACTIVE (ERR_ACTIVE_PLACEMENT_EXISTS)"
          - "no PatientDispute for this account with status == OPEN (ERR_OPEN_DISPUTE_BLOCKS_PLACEMENT)"
          - "no PresumptiveCharityScreening for this account with status == EVALUATED AND eligibility_outcome IN {FULL_CHARITY, PARTIAL_CHARITY} (ERR_CHARITY_ELIGIBLE_BLOCKS_PLACEMENT)"
        side_effects:
          - "account.status → IN_COLLECTIONS"
          - "account.version incremented"
          - "credit_reporting_status → REPORTABLE"

      - from: IN_COLLECTIONS
        to: OPEN
        trigger: "POST /self-pay/collection-agency-placements/{placementId}/recall"
        actor: Collector
        preconditions:
          - "placement.status == ACTIVE"
        side_effects:
          - "if logical_clock_date <= placement.recall_window_closes_at: placement.status → RECALLED_NO_FEE"
          - "else: placement.status → RECALLED_WITH_FEE"
          - "account.status → OPEN"
          - "account.version incremented"
          - "if credit_reporting_status == REPORTED: credit_reporting_status stays REPORTED (bureau deletion is a separate manual step outside this API)"

      - from: IN_COLLECTIONS
        to: WRITTEN_OFF
        trigger: "POST /self-pay/bad-debt-write-offs with write_off_kind == BAD_DEBT and the write-off transitions to POSTED"
        actor: RevenueIntegrityOfficer
        preconditions:
          - "write_off.status transitions PENDING_APPROVAL → POSTED in same request"
          - "account.status == IN_COLLECTIONS"
        side_effects:
          - "account.status → WRITTEN_OFF"
          - "account.bad_debt_writeoff_total_cents += write_off.amount_cents"
          - "account.current_balance_cents → 0"
          - "active CollectionAgencyPlacement.status → CLOSED_PAID only if current_balance reaches 0 by recovery; here it stays ACTIVE until recall (no auto-close on write-off)"
          - "MedicareBadDebtLogEntry row created (claimed_amount_cents = amount_cents, indigence_documented computed, collection_effort_days computed)"
          - "account.version incremented"

      - from: OPEN
        to: WRITTEN_OFF
        trigger: "POST /self-pay/bad-debt-write-offs with write_off_kind == BAD_DEBT and the write-off transitions to POSTED"
        actor: RevenueIntegrityOfficer
        preconditions:
          - "write_off.status transitions PENDING_APPROVAL → POSTED in same request"
          - "account.status == OPEN"
          - "account.aging_bucket == BUCKET_120_PLUS (ERR_WRITE_OFF_BEFORE_120_DAYS)"
          - "account.statements_sent_count >= REQUIRED_STATEMENTS_BEFORE_WRITEOFF (ERR_INSUFFICIENT_STATEMENT_CYCLE)"
          - "no PatientDispute with status == OPEN for this account (ERR_OPEN_DISPUTE_BLOCKS_WRITE_OFF)"
          - "no ACTIVE PaymentPlan for this account (ERR_ACTIVE_PAYMENT_PLAN_BLOCKS_WRITE_OFF)"
        side_effects:
          - "same as IN_COLLECTIONS → WRITTEN_OFF side_effects"

      - from: OPEN
        to: CLOSED_CHARITY
        trigger: "POST /self-pay/bad-debt-write-offs with write_off_kind == CHARITY_CARE and the write-off transitions to POSTED"
        actor: RevenueIntegrityOfficer
        preconditions:
          - "account.status == OPEN"
          - "screening_id references a PresumptiveCharityScreening with account_id == this account, status == EVALUATED, eligibility_outcome IN {FULL_CHARITY, PARTIAL_CHARITY}"
          - "no PatientDispute with status == OPEN for this account (ERR_OPEN_DISPUTE_BLOCKS_WRITE_OFF)"
        side_effects:
          - "screening.status → APPLIED"
          - "account.charity_writeoff_total_cents += write_off.amount_cents"
          - "account.current_balance_cents → 0"
          - "account.status → CLOSED_CHARITY"
          - "account.credit_reporting_status → SUPPRESSED_BY_CHARITY"
          - "NO MedicareBadDebtLogEntry is created (charity care is not claimable as Medicare bad debt)"
          - "account.version incremented"

      - from: WRITTEN_OFF
        to: CLOSED_PAID
        trigger: "system (automatic when a POST_WRITEOFF_RECOVERY RecoveryTransaction posts and cumulative post-write-off recoveries >= original write-off amount_cents)"
        actor: system
        preconditions:
          - "account.status == WRITTEN_OFF"
          - "sum(RecoveryTransaction.amount_cents WHERE payment_kind == POST_WRITEOFF_RECOVERY AND account_id == this account) >= BadDebtWriteOff.amount_cents for the most recent POSTED write-off"
        side_effects:
          - "account.status → CLOSED_PAID"
          - "account.credit_reporting_status unchanged"
          - "account.version incremented"

      - from: OPEN
        to: CLOSED_PAID
        trigger: "system (automatic when RecoveryTransaction drives account.current_balance_cents to 0)"
        actor: system
        preconditions:
          - "account.current_balance_cents == 0 after applying the transaction"
        side_effects:
          - "account.status → CLOSED_PAID"
          - "account.version incremented"

      - from: IN_EARLY_OUT
        to: CLOSED_PAID
        trigger: "system (automatic when RecoveryTransaction drives account.current_balance_cents to 0)"
        actor: system
        preconditions:
          - "account.current_balance_cents == 0 after applying the transaction"
        side_effects:
          - "account.status → CLOSED_PAID"
          - "active EarlyOutPlacement.status → COMPLETED_PAID"
          - "account.version incremented"

      - from: IN_COLLECTIONS
        to: CLOSED_PAID
        trigger: "system (automatic when RecoveryTransaction drives account.current_balance_cents to 0)"
        actor: system
        preconditions:
          - "account.current_balance_cents == 0 after applying the transaction"
        side_effects:
          - "account.status → CLOSED_PAID"
          - "active CollectionAgencyPlacement.status → CLOSED_PAID"
          - "account.version incremented"

  - entity: Statement
    initial_state: DRAFT
    terminal_states: [DELIVERED, RETURNED_UNDELIVERABLE]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /self-pay/accounts/{id}/statements (creation issues the statement immediately in SENT status; DRAFT is the pre-persist internal state and is never observable)"
        actor: Collector
        preconditions:
          - "account.status IN {OPEN, IN_EARLY_OUT, IN_COLLECTIONS} (ERR_ACCOUNT_NOT_STATEMENT_ELIGIBLE)"
        side_effects:
          - "statement.status persisted as SENT"
          - "statement.issued_at set from logical clock"
          - "statement.statement_index = prior max + 1"
          - "statement.due_date = guarantor_liability_date + statement_index * STATEMENT_CYCLE_DAYS"
          - "account.statements_sent_count += 1"
          - "account.version incremented"

      - from: SENT
        to: DELIVERED
        trigger: "POST /self-pay/statements/{statementId}/mark-delivered"
        actor: Collector
        preconditions:
          - "statement.status == SENT (ERR_INVALID_STATE)"
        side_effects: []

      - from: SENT
        to: RETURNED_UNDELIVERABLE
        trigger: "POST /self-pay/statements/{statementId}/mark-returned"
        actor: Collector
        preconditions:
          - "statement.status == SENT (ERR_INVALID_STATE)"
        side_effects:
          - "account.statements_sent_count decremented by 1 (a returned statement does not count toward the statement-cycle requirement)"
          - "account.version incremented"

  - entity: PresumptiveCharityScreening
    initial_state: PENDING
    terminal_states: [SUPERSEDED, APPLIED]
    transitions:
      - from: PENDING
        to: EVALUATED
        trigger: "POST /self-pay/presumptive-charity-screenings/{screeningId}/evaluate"
        actor: FinancialCounselor
        preconditions:
          - "screening.status == PENDING (ERR_INVALID_STATE)"
          - "account.status IN {OPEN, IN_EARLY_OUT, IN_COLLECTIONS} (ERR_ACCOUNT_NOT_SCREENABLE)"
        side_effects:
          - "eligibility_outcome computed per charity_eligibility calculation"
          - "fpl_percent populated iff screening_model == FPL_TIERED"
          - "charity_writeoff_percent populated (100 | 50 | 0)"
          - "screened_at set from logical clock"
          - "if outcome IN {FULL_CHARITY, PARTIAL_CHARITY} and account.credit_reporting_status IN {REPORTABLE, REPORTED}: account.credit_reporting_status → SUPPRESSED_BY_CHARITY, account.version incremented"

      - from: PENDING
        to: SUPERSEDED
        trigger: "system (automatic when a new PresumptiveCharityScreening is created for the same account while an older one is still PENDING)"
        actor: system
        preconditions:
          - "an existing PENDING screening for the same account_id exists"
        side_effects:
          - "older screening.status → SUPERSEDED"

      - from: EVALUATED
        to: SUPERSEDED
        trigger: "system (automatic when a new PresumptiveCharityScreening is created for the same account while an older one is EVALUATED)"
        actor: system
        preconditions:
          - "an existing EVALUATED screening for the same account_id exists"
        side_effects:
          - "older screening.status → SUPERSEDED"
          - "if the older EVALUATED screening had outcome IN {FULL_CHARITY, PARTIAL_CHARITY} and account.credit_reporting_status == SUPPRESSED_BY_CHARITY: revert account.credit_reporting_status to REPORTABLE (the new screening may disagree)"

      - from: EVALUATED
        to: APPLIED
        trigger: "system (automatic when a CHARITY_CARE BadDebtWriteOff referencing this screening transitions to POSTED)"
        actor: system
        preconditions:
          - "BadDebtWriteOff.screening_id == this screening.id"
          - "write_off.status transitions PENDING_APPROVAL → POSTED"
        side_effects:
          - "screening.status → APPLIED"

  - entity: EarlyOutPlacement
    initial_state: ACTIVE
    terminal_states: [RECALLED, ESCALATED_TO_AGENCY, COMPLETED_PAID]
    transitions:
      - from: ACTIVE
        to: RECALLED
        trigger: "POST /self-pay/early-out-placements/{placementId}/recall"
        actor: Collector
        preconditions:
          - "placement.status == ACTIVE"
          - "logical_clock_date <= placement.recall_deadline (ERR_RECALL_DEADLINE_PASSED)"
        side_effects:
          - "account.status → OPEN, account.version incremented"

      - from: ACTIVE
        to: ESCALATED_TO_AGENCY
        trigger: "system (automatic when a CollectionAgencyPlacement is created for an account in IN_EARLY_OUT)"
        actor: system
        preconditions:
          - "logical_clock_date > recall_deadline"
        side_effects:
          - "account.status → IN_COLLECTIONS, account.version incremented"

      - from: ACTIVE
        to: COMPLETED_PAID
        trigger: "system (automatic when the account's current_balance_cents reaches 0)"
        actor: system
        preconditions: []
        side_effects:
          - "account.status → CLOSED_PAID, account.version incremented"

  - entity: CollectionAgencyPlacement
    initial_state: ACTIVE
    terminal_states: [RECALLED_NO_FEE, RECALLED_WITH_FEE, CLOSED_PAID, CLOSED_DISPUTE]
    transitions:
      - from: ACTIVE
        to: RECALLED_NO_FEE
        trigger: "POST /self-pay/collection-agency-placements/{placementId}/recall"
        actor: Collector
        preconditions:
          - "placement.status == ACTIVE"
          - "logical_clock_date <= placement.recall_window_closes_at"
        side_effects:
          - "account.status → OPEN, account.version incremented"

      - from: ACTIVE
        to: RECALLED_WITH_FEE
        trigger: "POST /self-pay/collection-agency-placements/{placementId}/recall"
        actor: Collector
        preconditions:
          - "placement.status == ACTIVE"
          - "logical_clock_date > placement.recall_window_closes_at"
        side_effects:
          - "account.status → OPEN, account.version incremented"
          - "recall fee computed per agency_recall_fee calculation and recorded as a negative RecoveryTransaction on the account (payment_kind == POST_WRITEOFF_RECOVERY is NOT used; fee is bookkeeping-only and does NOT alter current_balance_cents, recovered_cents, or any write-off totals — it is observable only via the placement's terminal status)"

      - from: ACTIVE
        to: CLOSED_PAID
        trigger: "system (automatic when the account's current_balance_cents reaches 0)"
        actor: system
        preconditions: []
        side_effects:
          - "account.status → CLOSED_PAID, account.version incremented"

      - from: ACTIVE
        to: CLOSED_DISPUTE
        trigger: "system (automatic when a PatientDispute is filed against the account while a placement is ACTIVE and credit_reported_at is non-null)"
        actor: system
        preconditions:
          - "placement.status == ACTIVE"
          - "placement.credit_reported_at IS NOT NULL"
        side_effects:
          - "account.credit_reporting_status → FROZEN_BY_DISPUTE, account.version incremented"
        note: "If the placement has not yet credit-reported, the placement remains ACTIVE during the dispute — only reporting is frozen. The closure to CLOSED_DISPUTE is reserved for the case where the debt has already been furnished to a bureau."

  - entity: PatientDispute
    initial_state: OPEN
    terminal_states: [RESOLVED, EXPIRED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /self-pay/patient-disputes/{disputeId}/resolve"
        actor: RevenueIntegrityOfficer
        preconditions:
          - "dispute.status == OPEN (ERR_INVALID_STATE)"
          - "resolution_outcome in payload must be UPHELD_PATIENT or UPHELD_PROVIDER"
        side_effects:
          - "dispute.resolved_at set from logical clock"
          - "if outcome == UPHELD_PATIENT: account.current_balance_cents -= dispute.dispute_amount_cents (clamped at 0); if account.credit_reporting_status == FROZEN_BY_DISPUTE, set to REPORTED; account.version incremented"
          - "if outcome == UPHELD_PROVIDER: account.credit_reporting_status reverts from FROZEN_BY_DISPUTE to its pre-dispute value (REPORTABLE if not yet reported, REPORTED otherwise); account.version incremented"

      - from: OPEN
        to: EXPIRED
        trigger: "system (automatic on POST /self-pay/_clock/set_current_utc when the new logical date passes dispute.investigation_due_at)"
        actor: system
        preconditions:
          - "dispute.status == OPEN"
          - "logical_clock_date > dispute.investigation_due_at"
        side_effects:
          - "dispute.resolution_outcome = UNRESOLVED_EXPIRED"
          - "account.credit_reporting_status: if it was FROZEN_BY_DISPUTE, revert to REPORTED (bureau reporting stands; account must re-dispute)"
          - "account.version incremented"

  - entity: PaymentPlan
    initial_state: ACTIVE
    terminal_states: [COMPLETED, TERMINATED_DEFAULT]
    transitions:
      - from: ACTIVE
        to: IN_DEFAULT
        trigger: "system (automatic on POST /self-pay/_clock/set_current_utc when missed_installment_count crosses PAYMENT_PLAN_DEFAULT_MISSED_THRESHOLD)"
        actor: system
        preconditions:
          - "plan.status == ACTIVE"
          - "missed_installment_count >= PAYMENT_PLAN_DEFAULT_MISSED_THRESHOLD"
        side_effects:
          - "plan.default_flagged_at set from logical clock"
          - "plan.status → IN_DEFAULT"

      - from: IN_DEFAULT
        to: CURED
        trigger: "POST /self-pay/payment-plans/{planId}/cure"
        actor: Collector
        preconditions:
          - "plan.status == IN_DEFAULT (ERR_INVALID_STATE)"
          - "catch-up payment (RecoveryTransaction payment_kind == INSTALLMENT, payment_plan_id == this plan, amount >= missed installments * installment_amount_cents) has been posted since default_flagged_at"
        side_effects:
          - "plan.missed_installment_count → 0"
          - "plan.default_flagged_at → null"
          - "plan.status → ACTIVE"
        note: "CURED is transient — the same request that satisfies the precondition returns the plan to ACTIVE. The CURED label is used only in audit log prose; the persisted post-transition state is ACTIVE."

      - from: IN_DEFAULT
        to: TERMINATED_DEFAULT
        trigger: "POST /self-pay/payment-plans/{planId}/terminate"
        actor: RevenueIntegrityOfficer
        preconditions:
          - "plan.status == IN_DEFAULT (ERR_INVALID_STATE)"
        side_effects:
          - "plan.status → TERMINATED_DEFAULT"
          - "account becomes eligible for bad-debt write-off path again (the ERR_ACTIVE_PAYMENT_PLAN_BLOCKS_WRITE_OFF check now passes)"

      - from: ACTIVE
        to: COMPLETED
        trigger: "system (automatic when installments_paid_count == installment_count)"
        actor: system
        preconditions: []
        side_effects:
          - "plan.status → COMPLETED"

  - entity: BadDebtWriteOff
    initial_state: PENDING_APPROVAL
    terminal_states: [POSTED, REVERSED]
    transitions:
      - from: PENDING_APPROVAL
        to: POSTED
        trigger: "POST /self-pay/bad-debt-write-offs/{writeOffId}/approve"
        actor: RevenueIntegrityOfficer
        preconditions:
          - "write_off.status == PENDING_APPROVAL"
          - "approving X-User-ID != write_off creation X-User-ID (segregation of duties; ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
          - "if write_off_kind == CHARITY_CARE: referenced screening is still EVALUATED (not SUPERSEDED or APPLIED) at approval time (ERR_SCREENING_NOT_CURRENT)"
          - "if write_off_kind == BAD_DEBT: account.aging_bucket == BUCKET_120_PLUS at approval time (ERR_WRITE_OFF_BEFORE_120_DAYS)"
          - "if write_off_kind == BAD_DEBT: account.statements_sent_count >= REQUIRED_STATEMENTS_BEFORE_WRITEOFF at approval time (ERR_INSUFFICIENT_STATEMENT_CYCLE)"
          - "no PatientDispute with status == OPEN for this account at approval time (ERR_OPEN_DISPUTE_BLOCKS_WRITE_OFF)"
        side_effects:
          - "write_off.posted_at set from logical clock"
          - "write_off.approved_by_user_id = X-User-ID"
          - "account.current_balance_cents → 0"
          - "account.status: OPEN → CLOSED_CHARITY (CHARITY_CARE) or {OPEN, IN_COLLECTIONS} → WRITTEN_OFF (BAD_DEBT)"
          - "if write_off_kind == CHARITY_CARE: screening.status → APPLIED; account.charity_writeoff_total_cents += amount_cents; account.credit_reporting_status → SUPPRESSED_BY_CHARITY"
          - "if write_off_kind == BAD_DEBT: account.bad_debt_writeoff_total_cents += amount_cents; MedicareBadDebtLogEntry created (claimed_amount_cents = amount_cents, indigence_documented computed at this instant, collection_effort_days computed from guarantor_liability_date)"
          - "account.version incremented"

      - from: POSTED
        to: REVERSED
        trigger: "POST /self-pay/bad-debt-write-offs/{writeOffId}/reverse"
        actor: RevenueIntegrityOfficer
        preconditions:
          - "write_off.status == POSTED"
          - "logical_clock_date - write_off.posted_at.date <= WRITE_OFF_REVERSAL_WINDOW_DAYS (ERR_REVERSAL_WINDOW_PASSED)"
          - "reversing X-User-ID != write_off.approved_by_user_id (segregation of duties on reversal; ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects:
          - "write_off.status → REVERSED"
          - "account.current_balance_cents += write_off.amount_cents (restore)"
          - "account.status: WRITTEN_OFF → IN_COLLECTIONS if an ACTIVE CollectionAgencyPlacement still exists, else → OPEN; CLOSED_CHARITY → OPEN"
          - "if write_off_kind == CHARITY_CARE: account.charity_writeoff_total_cents -= amount_cents; screening.status → EVALUATED (rolls back from APPLIED); account.credit_reporting_status reverts to its pre-writeoff value (REPORTABLE if the placement was reported, NOT_REPORTED otherwise)"
          - "if write_off_kind == BAD_DEBT: account.bad_debt_writeoff_total_cents -= amount_cents; linked MedicareBadDebtLogEntry.voided_at set (entry is voided, not deleted)"
          - "account.version incremented"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: screening-create-stale-account
    parent_entity: SelfPayAccount
    write_endpoint: "POST /self-pay/presumptive-charity-screenings"
    occ_field: "expected_account_version"
    description: |
      Creating a PresumptiveCharityScreening against a SelfPayAccount whose
      version has advanced since the client last observed it is rejected.
      A new screening supersedes any PENDING/EVALUATED screening on the account,
      so a client holding a stale account view would silently supersede state
      it never saw. The OCC check on account.version surfaces the staleness.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: writeoff-approve-stale-account
    parent_entity: SelfPayAccount
    write_endpoint: "POST /self-pay/bad-debt-write-offs/{writeOffId}/approve"
    occ_field: "expected_account_version"
    description: |
      Approving a BadDebtWriteOff against a SelfPayAccount whose version has
      advanced since the approver last observed it is rejected. Approval posts
      the write-off, mutates current_balance_cents, drives account.status, and
      (for BAD_DEBT) creates a MedicareBadDebtLogEntry — the approver must
      re-read the account before signing off. The OCC check on
      account.version surfaces the staleness.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: aging_bucket_derivation
    trigger: "on read of SelfPayAccount AND on every POST /self-pay/_clock/set_current_utc"
    algorithm: threshold
    formula: |
      days_outstanding = (logical_clock_date - guarantor_liability_date) in whole days
      if days_outstanding < 30: bucket = CURRENT
      elif days_outstanding < 60: bucket = BUCKET_30
      elif days_outstanding < 90: bucket = BUCKET_60
      elif days_outstanding < 120: bucket = BUCKET_90
      else: bucket = BUCKET_120_PLUS
      Boundaries are INCLUSIVE of the lower edge: day 30 is BUCKET_30 (not CURRENT),
      day 60 is BUCKET_60, day 90 is BUCKET_90, day 120 is BUCKET_120_PLUS.
      aging_bucket_entered_at updates only when the bucket value changes.
    input_set: "all SelfPayAccount rows regardless of status"
    constants:
      BUCKET_30_EDGE_DAYS: 30
      BUCKET_60_EDGE_DAYS: 60
      BUCKET_90_EDGE_DAYS: 90
      BUCKET_120_EDGE_DAYS: 120
    precision: "whole days; no rounding"

  - name: charity_eligibility
    trigger: "POST /self-pay/presumptive-charity-screenings/{screeningId}/evaluate"
    algorithm: tiered_pricing
    formula: |
      if screening_model == FPL_TIERED:
        fpl_base_cents = FPL_TABLE[household_size]  # see constants
        fpl_percent = floor(household_income_cents * 100 / fpl_base_cents)
        if fpl_percent <= FULL_CHARITY_FPL_CAP: outcome = FULL_CHARITY, writeoff_pct = 100
        elif fpl_percent <= PARTIAL_CHARITY_FPL_CAP: outcome = PARTIAL_CHARITY, writeoff_pct = 50
        else: outcome = NOT_ELIGIBLE, writeoff_pct = 0
      elif screening_model == SCORE_BASED:
        fpl_percent = null
        if third_party_score >= SCORE_FULL_CHARITY_MIN: outcome = FULL_CHARITY, writeoff_pct = 100
        elif third_party_score >= SCORE_PARTIAL_CHARITY_MIN: outcome = PARTIAL_CHARITY, writeoff_pct = 50
        else: outcome = NOT_ELIGIBLE, writeoff_pct = 0
    input_set: "the target screening row"
    constants:
      FPL_TABLE: { 1: 1506000, 2: 2044000, 3: 2582000, 4: 3120000, 5: 3658000, 6: 4196000, 7: 4734000, 8: 5272000 }
      FULL_CHARITY_FPL_CAP: 200
      PARTIAL_CHARITY_FPL_CAP: 300
      SCORE_FULL_CHARITY_MIN: 700
      SCORE_PARTIAL_CHARITY_MIN: 550
    precision: "fpl_percent computed with floor() to integer percent; boundary uses <= (so fpl_percent == 200 qualifies for FULL_CHARITY, fpl_percent == 201 drops to PARTIAL)"
    variants:
      - name: FPL_TIERED
        when: "screening_model == FPL_TIERED"
        difference: "Income-based; produces fpl_percent; uses household_size + household_income_cents"
      - name: SCORE_BASED
        when: "screening_model == SCORE_BASED"
        difference: "Score-based; fpl_percent stays null; uses third_party_score. Two screenings on the SAME account with different screening_model values may yield different eligibility_outcomes — this is intentional and is the dual-variant axis."

  - name: statement_cycle
    trigger: "POST /self-pay/accounts/{id}/statements"
    algorithm: chronological
    formula: |
      statement_index = max(existing statement_index for account_id) + 1   (0 if none)
      due_date = guarantor_liability_date + (statement_index * STATEMENT_CYCLE_DAYS) days
      balance_at_issue_cents = account.current_balance_cents at time of issuance
      statements_sent_count on the account = count of statements with status IN {SENT, DELIVERED}
      (RETURNED_UNDELIVERABLE statements are EXCLUDED from statements_sent_count)
    input_set: "all Statement rows for the account, ordered by statement_index ASC (ties impossible — index is unique per account)"
    constants:
      STATEMENT_CYCLE_DAYS: 30
    precision: "date arithmetic at whole-day granularity"

  - name: agency_recall_fee
    trigger: "POST /self-pay/collection-agency-placements/{placementId}/recall when logical_clock_date > placement.recall_window_closes_at"
    algorithm: threshold
    formula: |
      if logical_clock_date <= recall_window_closes_at: fee_cents = 0
      else:
        days_late = (logical_clock_date - recall_window_closes_at) in whole days
        fee_cents = min(placement_balance_cents * RECALL_FEE_BPS / 10000, RECALL_FEE_CAP_CENTS)
        fee is rounded DOWN to the nearest cent
      The fee is recorded for audit only — it does NOT mutate current_balance_cents
      and is NOT credited to recovered_cents.
    input_set: "the target CollectionAgencyPlacement"
    constants:
      RECALL_FEE_BPS: 1500
      RECALL_FEE_CAP_CENTS: 50000
    precision: "integer cents, round_down"

  - name: vendor_contingency_fee
    trigger: "RecoveryTransaction creation when payment_kind IN {AGENCY_REMITTANCE, EARLY_OUT_REMITTANCE}"
    algorithm: waterfall_allocation
    formula: |
      fee_cents = round_half_up(amount_cents * contingency_fee_bps / 10000)
      net_to_hospital_cents = amount_cents - fee_cents
      attributed_placement.recovered_cents += amount_cents
      account.current_balance_cents -= amount_cents   (gross, NOT net — patient paid gross)
      account.recovery_total_cents += amount_cents
    input_set: "the new RecoveryTransaction + the attributed placement"
    precision: "integer cents, round_half_up on the fee"

  - name: post_writeoff_recovery_accounting
    trigger: "RecoveryTransaction creation when payment_kind == POST_WRITEOFF_RECOVERY"
    algorithm: aggregation
    formula: |
      # Two valid accounting treatments exist — the scaffold pins BOTH and selects by reserve_methodology
      # on the write-off being recovered against.
      #
      # Variant A (NET_AGAINST_RECOVERY — used when reserve_methodology == DIRECT):
      #   account.recovery_total_cents += amount_cents
      #   account.bad_debt_writeoff_total_cents is NOT reduced (write-off stands as historical fact)
      #   recovery goes into the recovery allowance; reserve is unchanged
      #
      # Variant B (RESTORE_THEN_REDUCE — used when reserve_methodology == ALLOWANCE):
      #   account.bad_debt_writeoff_total_cents -= amount_cents  (clamped at 0)
      #   account.recovery_total_cents += amount_cents
      #   this produces a different observable bad_debt_writeoff_total_cents than Variant A
      #
      # Both variants then run the closure check:
      cumulative_recoveries = sum(RecoveryTransaction.amount_cents WHERE payment_kind == POST_WRITEOFF_RECOVERY AND write_off_id == this write_off)
      if cumulative_recoveries >= write_off.amount_cents and account.status == WRITTEN_OFF:
        account.status → CLOSED_PAID
    input_set: "RecoveryTransaction rows for the target write_off_id, ordered by posted_at ASC then created_at ASC"
    constants:
      DEFAULT_RESERVE_METHODOLOGY: DIRECT
    precision: "integer cents; no rounding"
    variants:
      - name: NET_AGAINST_RECOVERY
        when: "the linked BadDebtWriteOff's account has reserve_methodology == DIRECT (the default)"
        difference: "bad_debt_writeoff_total_cents unchanged by the recovery"
      - name: RESTORE_THEN_REDUCE
        when: "the linked BadDebtWriteOff's account has reserve_methodology == ALLOWANCE (set via PATCH on the account)"
        difference: "bad_debt_writeoff_total_cents reduced by recovery amount (clamped at 0); produces a DIFFERENT observable account.bad_debt_writeoff_total_cents than NET_AGAINST_RECOVERY for identical input data"

  - name: vendor_performance_rate
    trigger: "POST /self-pay/vendor-performance-snapshots"
    algorithm: aggregation
    formula: |
      candidate_placements = EarlyOutPlacement rows WHERE vendor_name == input.vendor_name
        AND placed_at >= snapshot_period_start AND placed_at < snapshot_period_end
      placements_in_window = count(candidate_placements)
      recovered_in_window_cents = sum(RecoveryTransaction.amount_cents
        WHERE attributed_placement_id IN candidate_placements
          AND payment_kind == EARLY_OUT_REMITTANCE
          AND posted_at >= snapshot_period_start AND posted_at < snapshot_period_end)
      denominator = sum(placement_balance_cents over candidate_placements)
      if denominator == 0: recovery_rate_bps = 0
      else: recovery_rate_bps = floor(recovered_in_window_cents * 10000 / denominator)
      meets_minimum_threshold = recovery_rate_bps >= VENDOR_MIN_RECOVERY_BPS
      Tie-break for "IN candidate_placements": placement.id ASC (deterministic; never used
      for any observable decision beyond the set membership itself).
    input_set: "EarlyOutPlacement + RecoveryTransaction rows in the named window"
    constants:
      VENDOR_MIN_RECOVERY_BPS: 1200
    precision: "integer bps, floor"

  - name: payment_plan_default_sweep
    trigger: "POST /self-pay/_clock/set_current_utc (after the new logical time is installed)"
    algorithm: chronological
    formula: |
      for each PaymentPlan with status == ACTIVE, ordered by first_installment_due ASC then created_at ASC:
        due_count = number of installment due dates in [first_installment_due, logical_clock_date]
          (installment i is due at first_installment_due + (i-1) * INSTALLMENT_INTERVAL_DAYS days)
        paid_count = installments_paid_count
        missed = max(0, due_count - paid_count)
        if missed != missed_installment_count: missed_installment_count = missed
        if missed_installment_count >= PAYMENT_PLAN_DEFAULT_MISSED_THRESHOLD and status == ACTIVE:
          status → IN_DEFAULT, default_flagged_at = logical_clock now
      Boundary: an installment due TODAY (logical_clock_date == due date) counts as due —
      the boundary is inclusive.
    input_set: "PaymentPlan rows with status == ACTIVE"
    constants:
      INSTALLMENT_INTERVAL_DAYS: 30
      PAYMENT_PLAN_DEFAULT_MISSED_THRESHOLD: 2
    precision: "whole days"

  - name: medicare_collection_effort_days
    trigger: "BadDebtWriteOff transitions to POSTED with write_off_kind == BAD_DEBT"
    algorithm: aggregation
    formula: |
      collection_effort_days = (posted_at.date - guarantor_liability_date) in whole days
      indigence_documented = exists PresumptiveCharityScreening
        WHERE account_id == this.account_id
          AND status IN {EVALUATED, APPLIED}
          AND eligibility_outcome IN {FULL_CHARITY, PARTIAL_CHARITY}
          AND screened_at <= posted_at
      The evaluation set uses screened_at, not created_at; SUPERSEDED screenings are excluded.
    input_set: "screenings for the account, filtered as above"
    precision: "whole days; boolean flag"

  - name: write_off_amount
    trigger: "BadDebtWriteOff transitions to POSTED"
    algorithm: aggregation
    formula: |
      amount_cents = account.current_balance_cents at the moment of approval
      Only FULL-balance write-offs are supported — the entire remaining balance is written off.
      partial write-off attempts (e.g., a request body carrying an explicit amount_cents
      less than current_balance_cents) are rejected ERR_PARTIAL_WRITE_OFF_NOT_SUPPORTED.
    input_set: "target SelfPayAccount"
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role must be in the endpoint's roles list"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path template IDs must resolve (validated left-to-right); body FK references must resolve"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path or body FK references"
    note: "Specific subtypes surface via the `message` field (e.g., 'account not found', 'screening not found'); the catalog uses one ERR_NOT_FOUND to keep the surface tight"

  - priority: 4
    category: business_constraint
    check: "Required payload fields present, types correct, enum values in declared sets, numeric ranges honored (e.g., amount_cents > 0, installment_count in [2, MAX_INSTALLMENTS])"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PUT/PATCH endpoints"

  - priority: 5
    category: business_constraint
    check: "OCC: when expected_account_version is supplied, it MUST equal account.version at request handling time"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /self-pay/presumptive-charity-screenings, POST /self-pay/bad-debt-write-offs/{writeOffId}/approve"

  - priority: 6
    category: state
    check: "Target resource must be in the correct state for the operation (per state machine preconditions)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "state-transition endpoints"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: the approving RevenueIntegrityOfficer's X-User-ID must differ from the write-off creator's X-User-ID; the reversing officer's X-User-ID must differ from the approver's"
    error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http_status: 403
    applies_to: "POST /self-pay/bad-debt-write-offs/{writeOffId}/approve, POST /self-pay/bad-debt-write-offs/{writeOffId}/reverse"

  - priority: 8
    category: business_safety
    check: "Charity-care write-off requires the referenced screening to be in EVALUATED status with eligibility_outcome IN {FULL_CHARITY, PARTIAL_CHARITY} at approval time"
    error_id: ERR_SCREENING_NOT_CURRENT
    http_status: 409
    applies_to: "POST /self-pay/bad-debt-write-offs/{writeOffId}/approve (when write_off_kind == CHARITY_CARE)"

  - priority: 9
    category: business_safety
    check: "An open PatientDispute (status == OPEN) blocks placement into collections and blocks any BadDebtWriteOff approval for the same account"
    error_id: ERR_OPEN_DISPUTE_BLOCKS_PLACEMENT
    http_status: 409
    applies_to: "POST /self-pay/collection-agency-placements"
    note: "For write-off approval the same underlying guard returns ERR_OPEN_DISPUTE_BLOCKS_WRITE_OFF — the two error ids let tests distinguish which guard fired"

  - priority: 10
    category: business_safety
    check: "An EVALUATED screening with outcome IN {FULL_CHARITY, PARTIAL_CHARITY} blocks early-out and collection agency placement"
    error_id: ERR_CHARITY_ELIGIBLE_BLOCKS_PLACEMENT
    http_status: 409
    applies_to: "POST /self-pay/early-out-placements, POST /self-pay/collection-agency-placements"

  - priority: 11
    category: business_temporal
    check: "Aging/statement-cycle prerequisites: early-out placement requires aging_bucket IN {BUCKET_30, BUCKET_60}; agency placement direct path requires BUCKET_120_PLUS AND statements_sent_count >= REQUIRED_STATEMENTS_BEFORE_AGENCY; bad-debt write-off approval requires BUCKET_120_PLUS AND statements_sent_count >= REQUIRED_STATEMENTS_BEFORE_WRITEOFF"
    error_id: ERR_ACCOUNT_NOT_IN_EARLY_OUT_BUCKET
    http_status: 409
    applies_to: "POST /self-pay/early-out-placements"
    note: "Other endpoints in this priority band return ERR_ACCOUNT_NOT_IN_AGENCY_BUCKET, ERR_INSUFFICIENT_STATEMENT_CYCLE, ERR_WRITE_OFF_BEFORE_120_DAYS as appropriate"

  - priority: 12
    category: business_temporal
    check: "Recall deadline: early-out recall requires logical_clock_date <= recall_deadline; escalating an in-early-out account requires logical_clock_date > recall_deadline"
    error_id: ERR_RECALL_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /self-pay/early-out-placements/{placementId}/recall"

  - priority: 13
    category: business_referential
    check: "Polymorphic RecoveryTransaction FK: attributed_placement_id must resolve to an EarlyOutPlacement when payment_kind == EARLY_OUT_REMITTANCE, to a CollectionAgencyPlacement when payment_kind == AGENCY_REMITTANCE; payment_plan_id required iff payment_kind == INSTALLMENT; write_off_id required iff payment_kind == POST_WRITEOFF_RECOVERY"
    error_id: ERR_RECOVERY_FK_MISMATCH
    http_status: 400
    applies_to: "POST /self-pay/recovery-transactions"

  - priority: 14
    category: business_referential
    check: "Recovery amount must not exceed the current balance attributable to the target (account.current_balance_cents for direct payments; remaining plan balance for INSTALLMENT; original write-off amount less prior POST_WRITEOFF_RECOVERY sums for POST_WRITEOFF_RECOVERY)"
    error_id: ERR_RECOVERY_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /self-pay/recovery-transactions"

  - priority: 15
    category: business_fiscal
    check: "Partial write-off requests are rejected; only full-balance write-offs are supported"
    error_id: ERR_PARTIAL_WRITE_OFF_NOT_SUPPORTED
    http_status: 422
    applies_to: "POST /self-pay/bad-debt-write-offs"

  - priority: 16
    category: business_fiscal
    check: "Medicare cost report year on a BAD_DEBT write-off must equal the calendar year of guarantor_liability_date or later, and must not exceed the calendar year of the logical clock at approval time"
    error_id: ERR_INVALID_COST_REPORT_YEAR
    http_status: 422
    applies_to: "POST /self-pay/bad-debt-write-offs (when write_off_kind == BAD_DEBT)"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- SelfPayAccount ---
  - method: POST
    path: "/self-pay/accounts"
    description: "Register a new self-pay account (guarantor liability established)"
    roles: [Collector, RevenueIntegrityOfficer]
    code: 201
    input: [patient_mrn, patient_name, original_balance_cents, guarantor_liability_date]
    output: SelfPayAccount
    side_effects:
      - "current_balance_cents initialized to original_balance_cents"
      - "aging_bucket derived from logical clock"
      - "status initialized to OPEN"

  - method: GET
    path: "/self-pay/accounts"
    description: "List self-pay accounts with optional filters"
    roles: [Collector, FinancialCounselor, RevenueIntegrityOfficer, CollectionAgencyUser]
    code: 200
    input: ["limit?", "offset?", "status?", "aging_bucket?", "credit_reporting_status?"]
    output: "SelfPayAccount[]"
    side_effects: []

  - method: GET
    path: "/self-pay/accounts/{id}"
    description: "Get a single self-pay account (recomputes aging_bucket on read)"
    roles: [Collector, FinancialCounselor, RevenueIntegrityOfficer, CollectionAgencyUser]
    code: 200
    input: []
    output: SelfPayAccount
    side_effects: ["aging_bucket recomputed against the current logical clock"]

  # --- Statement (FK reverse-reachability: GET /self-pay/accounts/{id}/statements) ---
  - method: POST
    path: "/self-pay/accounts/{id}/statements"
    description: "Issue a statement for an account (statement cycle)"
    roles: [Collector]
    code: 201
    input: []
    output: Statement
    side_effects:
      - "statement_index assigned (max+1)"
      - "due_date = guarantor_liability_date + statement_index * STATEMENT_CYCLE_DAYS"
      - "balance_at_issue_cents snapshot taken"
      - "status persisted as SENT"
      - "account.statements_sent_count incremented"
      - "account.version incremented"

  - method: GET
    path: "/self-pay/accounts/{id}/statements"
    description: "List statements for an account (FK reverse-reachability)"
    roles: [Collector, FinancialCounselor, RevenueIntegrityOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Statement[]"
    side_effects: []

  - method: GET
    path: "/self-pay/statements/{statementId}"
    description: "Get a single statement"
    roles: [Collector, FinancialCounselor, RevenueIntegrityOfficer]
    code: 200
    input: []
    output: Statement
    side_effects: []

  - method: POST
    path: "/self-pay/statements/{statementId}/mark-delivered"
    description: "Mark statement DELIVERED"
    roles: [Collector]
    code: 200
    input: []
    output: Statement
    side_effects: ["status SENT → DELIVERED"]

  - method: POST
    path: "/self-pay/statements/{statementId}/mark-returned"
    description: "Mark statement RETURNED_UNDELIVERABLE (decrements statements_sent_count)"
    roles: [Collector]
    code: 200
    input: []
    output: Statement
    side_effects:
      - "status SENT → RETURNED_UNDELIVERABLE"
      - "account.statements_sent_count decremented by 1"
      - "account.version incremented"

  # --- PresumptiveCharityScreening ---
  - method: POST
    path: "/self-pay/presumptive-charity-screenings"
    description: "Create a presumptive charity screening for an account (OCC-guarded)"
    roles: [FinancialCounselor]
    code: 201
    input: [account_id, screening_model, "household_size?", "household_income_cents?", "third_party_score?", expected_account_version]
    output: PresumptiveCharityScreening
    side_effects:
      - "any prior PENDING or EVALUATED screening for the same account_id transitions to SUPERSEDED"
      - "if a prior EVALUATED screening had outcome IN {FULL_CHARITY, PARTIAL_CHARITY} and account.credit_reporting_status == SUPPRESSED_BY_CHARITY, account.credit_reporting_status reverts to REPORTABLE"
      - "account.version incremented by 1"
      - "new screening status initialized to PENDING, eligibility_outcome PENDING"

  - method: GET
    path: "/self-pay/presumptive-charity-screenings/{screeningId}"
    description: "Get a screening"
    roles: [Collector, FinancialCounselor, RevenueIntegrityOfficer]
    code: 200
    input: []
    output: PresumptiveCharityScreening
    side_effects: []

  - method: GET
    path: "/self-pay/accounts/{id}/presumptive-charity-screenings"
    description: "List screenings for an account (FK reverse-reachability)"
    roles: [Collector, FinancialCounselor, RevenueIntegrityOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "PresumptiveCharityScreening[]"
    side_effects: []

  - method: POST
    path: "/self-pay/presumptive-charity-screenings/{screeningId}/evaluate"
    description: "Evaluate a PENDING screening — runs charity_eligibility calculation"
    roles: [FinancialCounselor]
    code: 200
    input: []
    output: PresumptiveCharityScreening
    side_effects:
      - "eligibility_outcome, charity_writeoff_percent, screened_at, fpl_percent populated"
      - "status PENDING → EVALUATED"
      - "if outcome IN {FULL_CHARITY, PARTIAL_CHARITY} and account.credit_reporting_status IN {REPORTABLE, REPORTED}: account.credit_reporting_status → SUPPRESSED_BY_CHARITY, account.version incremented"

  # --- EarlyOutPlacement ---
  - method: POST
    path: "/self-pay/early-out-placements"
    description: "Place an account with an early-out vendor"
    roles: [Collector]
    code: 201
    input: [account_id, vendor_name, contingency_fee_bps]
    output: EarlyOutPlacement
    side_effects:
      - "account.status OPEN → IN_EARLY_OUT"
      - "account.version incremented"
      - "placement_balance_cents snapshot from account.current_balance_cents"
      - "placed_at, recall_deadline stamped from logical clock"

  - method: GET
    path: "/self-pay/early-out-placements/{placementId}"
    description: "Get an early-out placement"
    roles: [Collector, RevenueIntegrityOfficer]
    code: 200
    input: []
    output: EarlyOutPlacement
    side_effects: []

  - method: GET
    path: "/self-pay/accounts/{id}/early-out-placements"
    description: "List early-out placements for an account (FK reverse-reachability)"
    roles: [Collector, RevenueIntegrityOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "EarlyOutPlacement[]"
    side_effects: []

  - method: POST
    path: "/self-pay/early-out-placements/{placementId}/recall"
    description: "Recall an early-out placement (must be before recall_deadline)"
    roles: [Collector]
    code: 200
    input: []
    output: EarlyOutPlacement
    side_effects:
      - "placement.status ACTIVE → RECALLED"
      - "account.status IN_EARLY_OUT → OPEN, account.version incremented"

  # --- CollectionAgencyPlacement ---
  - method: POST
    path: "/self-pay/collection-agency-placements"
    description: "Place an account with a collection agency (direct or escalation-from-early-out)"
    roles: [Collector]
    code: 201
    input: [account_id, agency_name, contingency_fee_bps]
    output: CollectionAgencyPlacement
    side_effects:
      - "if account.status == IN_EARLY_OUT: active EarlyOutPlacement → ESCALATED_TO_AGENCY (requires logical_clock_date > recall_deadline)"
      - "if account.status == OPEN: direct path requires BUCKET_120_PLUS and statements_sent_count >= REQUIRED_STATEMENTS_BEFORE_AGENCY"
      - "account.status → IN_COLLECTIONS, account.version incremented"
      - "credit_reporting_status → REPORTABLE"
      - "placed_at, recall_window_closes_at stamped"

  - method: GET
    path: "/self-pay/collection-agency-placements/{placementId}"
    description: "Get a collection agency placement"
    roles: [Collector, RevenueIntegrityOfficer, CollectionAgencyUser]
    code: 200
    input: []
    output: CollectionAgencyPlacement
    side_effects: []

  - method: GET
    path: "/self-pay/accounts/{id}/collection-agency-placements"
    description: "List collection agency placements for an account (FK reverse-reachability)"
    roles: [Collector, RevenueIntegrityOfficer, CollectionAgencyUser]
    code: 200
    input: ["limit?", "offset?"]
    output: "CollectionAgencyPlacement[]"
    side_effects: []

  - method: POST
    path: "/self-pay/collection-agency-placements/{placementId}/recall"
    description: "Recall an agency placement (fee logic based on recall_window_closes_at)"
    roles: [Collector]
    code: 200
    input: []
    output: CollectionAgencyPlacement
    side_effects:
      - "if logical_clock_date <= recall_window_closes_at: status → RECALLED_NO_FEE"
      - "else: status → RECALLED_WITH_FEE (agency_recall_fee calculation runs; fee is audit-only)"
      - "account.status IN_COLLECTIONS → OPEN, account.version incremented"

  - method: POST
    path: "/self-pay/collection-agency-placements/{placementId}/mark-credit-reported"
    description: "Mark the placement as reported to a consumer bureau"
    roles: [CollectionAgencyUser]
    code: 200
    input: []
    output: CollectionAgencyPlacement
    side_effects:
      - "credit_reported_at set from logical clock"
      - "account.credit_reporting_status → REPORTED (unless FROZEN_BY_DISPUTE or SUPPRESSED_BY_CHARITY already)"
      - "account.version incremented"

  # --- PatientDispute ---
  - method: POST
    path: "/self-pay/patient-disputes"
    description: "File a patient dispute against an account"
    roles: [Collector, FinancialCounselor]
    code: 201
    input: [account_id, dispute_reason, dispute_amount_cents]
    output: PatientDispute
    side_effects:
      - "dispute.filed_at, investigation_due_at stamped from logical clock"
      - "if an ACTIVE CollectionAgencyPlacement exists with credit_reported_at non-null: placement → CLOSED_DISPUTE, account.credit_reporting_status → FROZEN_BY_DISPUTE, account.version incremented"
      - "otherwise account.credit_reporting_status unchanged (placement into collections is blocked while dispute is OPEN, but reporting freeze only kicks in once a bureau was actually furnished)"

  - method: GET
    path: "/self-pay/patient-disputes/{disputeId}"
    description: "Get a dispute"
    roles: [Collector, FinancialCounselor, RevenueIntegrityOfficer]
    code: 200
    input: []
    output: PatientDispute
    side_effects: []

  - method: GET
    path: "/self-pay/accounts/{id}/patient-disputes"
    description: "List disputes for an account (FK reverse-reachability)"
    roles: [Collector, FinancialCounselor, RevenueIntegrityOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "PatientDispute[]"
    side_effects: []

  - method: POST
    path: "/self-pay/patient-disputes/{disputeId}/resolve"
    description: "Resolve an OPEN dispute"
    roles: [RevenueIntegrityOfficer]
    code: 200
    input: [resolution_outcome]
    output: PatientDispute
    side_effects:
      - "status OPEN → RESOLVED, resolved_at set"
      - "if outcome == UPHELD_PATIENT: account.current_balance_cents reduced by dispute_amount_cents (clamped at 0)"
      - "credit_reporting_status reverts per state machine rules"

  # --- PaymentPlan ---
  - method: POST
    path: "/self-pay/payment-plans"
    description: "Set up a payment plan on an account"
    roles: [Collector, FinancialCounselor]
    code: 201
    input: [account_id, installment_amount_cents, installment_count, first_installment_due]
    output: PaymentPlan
    side_effects:
      - "installments_paid_count, missed_installment_count initialized to 0"
      - "status initialized to ACTIVE"

  - method: GET
    path: "/self-pay/payment-plans/{planId}"
    description: "Get a payment plan"
    roles: [Collector, FinancialCounselor, RevenueIntegrityOfficer]
    code: 200
    input: []
    output: PaymentPlan
    side_effects: []

  - method: GET
    path: "/self-pay/accounts/{id}/payment-plans"
    description: "List payment plans for an account (FK reverse-reachability)"
    roles: [Collector, FinancialCounselor, RevenueIntegrityOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "PaymentPlan[]"
    side_effects: []

  - method: POST
    path: "/self-pay/payment-plans/{planId}/cure"
    description: "Cure an IN_DEFAULT plan after catch-up payment"
    roles: [Collector]
    code: 200
    input: []
    output: PaymentPlan
    side_effects:
      - "precondition: catch-up RecoveryTransaction posted since default_flagged_at with amount >= missed_installment_count * installment_amount_cents"
      - "missed_installment_count → 0, default_flagged_at → null, status → ACTIVE"

  - method: POST
    path: "/self-pay/payment-plans/{planId}/terminate"
    description: "Terminate an IN_DEFAULT plan"
    roles: [RevenueIntegrityOfficer]
    code: 200
    input: []
    output: PaymentPlan
    side_effects: ["status IN_DEFAULT → TERMINATED_DEFAULT"]

  # --- BadDebtWriteOff ---
  - method: POST
    path: "/self-pay/bad-debt-write-offs"
    description: "Create a write-off in PENDING_APPROVAL (segregation of duties: creator cannot approve)"
    roles: [Collector, RevenueIntegrityOfficer]
    code: 201
    input: [account_id, write_off_kind, "screening_id?", "medicare_cost_report_year?"]
    output: BadDebtWriteOff
    side_effects:
      - "status initialized to PENDING_APPROVAL"
      - "screening_id required iff write_off_kind == CHARITY_CARE; medicare_cost_report_year required iff write_off_kind == BAD_DEBT"

  - method: GET
    path: "/self-pay/bad-debt-write-offs/{writeOffId}"
    description: "Get a write-off"
    roles: [Collector, RevenueIntegrityOfficer]
    code: 200
    input: []
    output: BadDebtWriteOff
    side_effects: []

  - method: GET
    path: "/self-pay/bad-debt-write-offs"
    description: "List write-offs with optional screening_id filter (FK reverse-reachability for screening_id)"
    roles: [Collector, RevenueIntegrityOfficer]
    code: 200
    input: ["limit?", "offset?", "account_id?", "write_off_kind?", "status?", "screening_id?"]
    output: "BadDebtWriteOff[]"
    side_effects: []

  - method: GET
    path: "/self-pay/accounts/{id}/bad-debt-write-offs"
    description: "List write-offs for an account (FK reverse-reachability)"
    roles: [Collector, RevenueIntegrityOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "BadDebtWriteOff[]"
    side_effects: []

  - method: POST
    path: "/self-pay/bad-debt-write-offs/{writeOffId}/approve"
    description: "Approve a PENDING_APPROVAL write-off (OCC-guarded, segregation of duties enforced)"
    roles: [RevenueIntegrityOfficer]
    code: 200
    input: [expected_account_version]
    output: BadDebtWriteOff
    side_effects:
      - "status PENDING_APPROVAL → POSTED, posted_at stamped, approved_by_user_id stamped"
      - "amount_cents snapshot = account.current_balance_cents at approval instant"
      - "account.current_balance_cents → 0"
      - "account status and computed totals updated per state machine"
      - "if BAD_DEBT: MedicareBadDebtLogEntry created (append-only)"
      - "if CHARITY_CARE: screening.status → APPLIED"
      - "account.version incremented by 1"

  - method: POST
    path: "/self-pay/bad-debt-write-offs/{writeOffId}/reverse"
    description: "Reverse a POSTED write-off within WRITE_OFF_REVERSAL_WINDOW_DAYS"
    roles: [RevenueIntegrityOfficer]
    code: 200
    input: []
    output: BadDebtWriteOff
    side_effects:
      - "status POSTED → REVERSED"
      - "account.current_balance_cents += amount_cents"
      - "if BAD_DEBT: bad_debt_writeoff_total_cents -= amount_cents; linked MedicareBadDebtLogEntry.voided_at set"
      - "if CHARITY_CARE: charity_writeoff_total_cents -= amount_cents; screening.status → EVALUATED"
      - "account.version incremented"

  # --- MedicareBadDebtLogEntry ---
  - method: GET
    path: "/self-pay/medicare-bad-debt-log-entries/{entryId}"
    description: "Get a single log entry"
    roles: [RevenueIntegrityOfficer]
    code: 200
    input: []
    output: MedicareBadDebtLogEntry
    side_effects: []

  - method: GET
    path: "/self-pay/medicare-bad-debt-log-entries"
    description: "List Medicare bad-debt log entries with optional filters (FK reverse-reachability for write_off_id)"
    roles: [RevenueIntegrityOfficer]
    code: 200
    input: ["limit?", "offset?", "cost_report_year?", "write_off_id?", "account_id?"]
    output: "MedicareBadDebtLogEntry[]"
    side_effects: []

  - method: GET
    path: "/self-pay/accounts/{id}/medicare-bad-debt-log-entries"
    description: "List log entries for an account (FK reverse-reachability)"
    roles: [RevenueIntegrityOfficer]
    code: 200
    input: ["limit?", "offset?", "cost_report_year?"]
    output: "MedicareBadDebtLogEntry[]"
    side_effects: []

  - method: GET
    path: "/self-pay/bad-debt-write-offs/{writeOffId}/medicare-bad-debt-log-entries"
    description: "List log entries for a write-off (FK reverse-reachability)"
    roles: [RevenueIntegrityOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "MedicareBadDebtLogEntry[]"
    side_effects: []

  # --- RecoveryTransaction ---
  - method: POST
    path: "/self-pay/recovery-transactions"
    description: "Post a recovery/payment against an account"
    roles: [Collector, CollectionAgencyUser]
    code: 201
    input: [account_id, payment_kind, amount_cents, "attributed_placement_id?", "payment_plan_id?", "write_off_id?"]
    output: RecoveryTransaction
    side_effects:
      - "vendor_contingency_fee calculation runs if attributed to a placement"
      - "post_writeoff_recovery_accounting runs if payment_kind == POST_WRITEOFF_RECOVERY"
      - "account.current_balance_cents reduced by amount_cents"
      - "if attributed: attributed_placement.recovered_cents += amount_cents"
      - "if INSTALLMENT: payment_plan.installments_paid_count += 1; if installments_paid_count == installment_count: plan → COMPLETED"
      - "if account.current_balance_cents reaches 0: account.status → CLOSED_PAID (cascading placement closure per state machine)"
      - "account.version incremented"

  - method: GET
    path: "/self-pay/recovery-transactions/{transactionId}"
    description: "Get a recovery transaction"
    roles: [Collector, RevenueIntegrityOfficer, CollectionAgencyUser]
    code: 200
    input: []
    output: RecoveryTransaction
    side_effects: []

  - method: GET
    path: "/self-pay/recovery-transactions"
    description: "List recovery transactions with optional FK filters (reverse-reachability for attributed_placement_id, payment_plan_id, write_off_id)"
    roles: [Collector, RevenueIntegrityOfficer, CollectionAgencyUser]
    code: 200
    input: ["limit?", "offset?", "account_id?", "payment_kind?", "attributed_placement_id?", "payment_plan_id?", "write_off_id?"]
    output: "RecoveryTransaction[]"
    side_effects: []

  - method: GET
    path: "/self-pay/accounts/{id}/recovery-transactions"
    description: "List recovery transactions for an account (FK reverse-reachability)"
    roles: [Collector, RevenueIntegrityOfficer, CollectionAgencyUser]
    code: 200
    input: ["limit?", "offset?", "payment_kind?"]
    output: "RecoveryTransaction[]"
    side_effects: []

  # --- VendorPerformanceSnapshot ---
  - method: POST
    path: "/self-pay/vendor-performance-snapshots"
    description: "Generate a vendor performance snapshot for a measurement window"
    roles: [RevenueIntegrityOfficer]
    code: 201
    input: [vendor_name, snapshot_period_start, snapshot_period_end]
    output: VendorPerformanceSnapshot
    side_effects:
      - "vendor_performance_rate calculation runs"
      - "snapshot is immutable once created (append-only)"

  - method: GET
    path: "/self-pay/vendor-performance-snapshots/{snapshotId}"
    description: "Get a snapshot"
    roles: [RevenueIntegrityOfficer]
    code: 200
    input: []
    output: VendorPerformanceSnapshot
    side_effects: []

  - method: GET
    path: "/self-pay/vendor-performance-snapshots"
    description: "List snapshots with optional vendor filter"
    roles: [RevenueIntegrityOfficer]
    code: 200
    input: ["limit?", "offset?", "vendor_name?"]
    output: "VendorPerformanceSnapshot[]"
    side_effects: []

  # --- Test-driving endpoints ---
  - method: POST
    path: "/self-pay/_clock/set_current_utc"
    description: "Advance the logical clock. Server default startup time is 2026-08-01T00:00:00Z; the clock does NOT fall back to wall-clock time. Fires payment_plan_default_sweep and dispute-expiry sweeps after install."
    roles: [Collector, FinancialCounselor, RevenueIntegrityOfficer]
    code: 200
    input: [to_iso8601]
    output: { now_iso8601: string, plans_flagged_in_default: integer, disputes_expired: integer }
    side_effects:
      - "logical clock set to to_iso8601 (must be >= previous value)"
      - "payment_plan_default_sweep runs (plans may transition ACTIVE → IN_DEFAULT)"
      - "OPEN disputes with investigation_due_at < new date transition to EXPIRED"
      - "aging_bucket recomputed on next account read"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # Auth
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted to invoke this endpoint" }

  # Existence
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body FK reference does not resolve" }

  # Payload shape
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, wrong type, or value out of declared range" }

  # Concurrency
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_account_version does not match the account's current version" }

  # State machine
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state from which the requested transition is defined" }

  # Segregation of duties
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http: 403, condition: "Same X-User-ID attempted a step that must be performed by a different principal than the prior step" }

  # Charity screening
  - { id: ERR_SCREENING_NOT_CURRENT, http: 409, condition: "CHARITY_CARE write-off references a screening that is SUPERSEDED, APPLIED, or has outcome NOT_ELIGIBLE at approval time" }
  - { id: ERR_CHARITY_ELIGIBLE_BLOCKS_PLACEMENT, http: 409, condition: "Account has an EVALUATED screening with outcome IN {FULL_CHARITY, PARTIAL_CHARITY}; placement into early-out or collections is blocked" }
  - { id: ERR_ACCOUNT_NOT_SCREENABLE, http: 409, condition: "Screening evaluation requires account.status IN {OPEN, IN_EARLY_OUT, IN_COLLECTIONS}" }

  # Statement cycle / aging prerequisites
  - { id: ERR_ACCOUNT_NOT_STATEMENT_ELIGIBLE, http: 409, condition: "Statement issuance requires account.status IN {OPEN, IN_EARLY_OUT, IN_COLLECTIONS}" }
  - { id: ERR_ACCOUNT_NOT_IN_EARLY_OUT_BUCKET, http: 409, condition: "Early-out placement requires aging_bucket IN {BUCKET_30, BUCKET_60}" }
  - { id: ERR_ACCOUNT_NOT_IN_AGENCY_BUCKET, http: 409, condition: "Direct collection-agency placement requires aging_bucket == BUCKET_120_PLUS" }
  - { id: ERR_INSUFFICIENT_STATEMENT_CYCLE, http: 409, condition: "Required number of SENT/DELIVERED statements has not been reached for this operation" }
  - { id: ERR_WRITE_OFF_BEFORE_120_DAYS, http: 409, condition: "Bad-debt write-off approval requires aging_bucket == BUCKET_120_PLUS" }

  # Placement rules
  - { id: ERR_ACTIVE_PLACEMENT_EXISTS, http: 409, condition: "An ACTIVE placement of the same family (early-out or agency) already exists for this account" }
  - { id: ERR_RECALL_DEADLINE_PASSED, http: 409, condition: "Early-out recall attempted after recall_deadline" }
  - { id: ERR_RECALL_WINDOW_STILL_OPEN, http: 409, condition: "Escalation from early-out to agency requires logical_clock_date > recall_deadline" }

  # Disputes
  - { id: ERR_OPEN_DISPUTE_BLOCKS_PLACEMENT, http: 409, condition: "Collection-agency placement attempted while an OPEN PatientDispute exists for the account" }
  - { id: ERR_OPEN_DISPUTE_BLOCKS_WRITE_OFF, http: 409, condition: "Write-off approval attempted while an OPEN PatientDispute exists for the account" }
  - { id: ERR_DISPUTE_AMOUNT_INVALID, http: 422, condition: "dispute_amount_cents <= 0 or exceeds account.current_balance_cents at filing" }

  # Payment plans
  - { id: ERR_ACTIVE_PAYMENT_PLAN_BLOCKS_WRITE_OFF, http: 409, condition: "Bad-debt write-off approval attempted while a PaymentPlan with status == ACTIVE exists for the account" }
  - { id: ERR_PLAN_NOT_IN_DEFAULT, http: 409, condition: "cure or terminate requires plan.status == IN_DEFAULT" }
  - { id: ERR_CATCH_UP_PAYMENT_REQUIRED, http: 422, condition: "cure attempted without a qualifying catch-up RecoveryTransaction since default_flagged_at" }

  # Recovery / fiscal
  - { id: ERR_RECOVERY_FK_MISMATCH, http: 400, condition: "Polymorphic FK on RecoveryTransaction does not match the entity family required by payment_kind" }
  - { id: ERR_RECOVERY_EXCEEDS_BALANCE, http: 422, condition: "Recovery amount exceeds the recoverable balance for the target (account balance, plan remainder, or write-off remainder)" }
  - { id: ERR_PARTIAL_WRITE_OFF_NOT_SUPPORTED, http: 422, condition: "Write-off requests carrying an explicit amount_cents different from the account's full current_balance_cents are rejected" }
  - { id: ERR_INVALID_COST_REPORT_YEAR, http: 422, condition: "medicare_cost_report_year earlier than guarantor_liability_date's calendar year or later than the logical clock's calendar year at approval time" }
  - { id: ERR_REVERSAL_WINDOW_PASSED, http: 409, condition: "Write-off reversal attempted more than WRITE_OFF_REVERSAL_WINDOW_DAYS after posted_at" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Collector
    description: "Hospital self-pay unit collector; registers accounts, issues statements, places accounts with vendors, posts payments, files disputes"
    identity: opaque
    exclusive_operations:
      - "POST /self-pay/accounts/{id}/statements"
      - "POST /self-pay/statements/{statementId}/mark-delivered"
      - "POST /self-pay/statements/{statementId}/mark-returned"
      - "POST /self-pay/early-out-placements"
      - "POST /self-pay/early-out-placements/{placementId}/recall"
      - "POST /self-pay/collection-agency-placements"
      - "POST /self-pay/collection-agency-placements/{placementId}/recall"
      - "POST /self-pay/payment-plans/{planId}/cure"
    shared_operations:
      - "POST /self-pay/accounts"
      - "POST /self-pay/patient-disputes"
      - "POST /self-pay/payment-plans"
      - "POST /self-pay/bad-debt-write-offs"
      - "POST /self-pay/recovery-transactions"
      - "POST /self-pay/_clock/set_current_utc"
      - "GET endpoints per §1.5 roles lists"

  - name: FinancialCounselor
    description: "Runs presumptive charity screenings and evaluates eligibility"
    identity: opaque
    exclusive_operations:
      - "POST /self-pay/presumptive-charity-screenings"
      - "POST /self-pay/presumptive-charity-screenings/{screeningId}/evaluate"
    shared_operations:
      - "POST /self-pay/patient-disputes"
      - "POST /self-pay/payment-plans"
      - "POST /self-pay/_clock/set_current_utc"
      - "GET endpoints per §1.5 roles lists"

  - name: RevenueIntegrityOfficer
    description: "Approves/reverses write-offs, resolves disputes, terminates defaulted plans, generates vendor performance snapshots. Segregation of duties: cannot approve a write-off they created, cannot reverse a write-off they approved."
    identity: opaque
    exclusive_operations:
      - "POST /self-pay/bad-debt-write-offs/{writeOffId}/approve"
      - "POST /self-pay/bad-debt-write-offs/{writeOffId}/reverse"
      - "POST /self-pay/patient-disputes/{disputeId}/resolve"
      - "POST /self-pay/payment-plans/{planId}/terminate"
      - "POST /self-pay/vendor-performance-snapshots"
      - "GET /self-pay/medicare-bad-debt-log-entries/{entryId}"
      - "GET /self-pay/accounts/{id}/medicare-bad-debt-log-entries"
      - "GET /self-pay/bad-debt-write-offs/{writeOffId}/medicare-bad-debt-log-entries"
    shared_operations:
      - "POST /self-pay/accounts"
      - "POST /self-pay/bad-debt-write-offs"
      - "POST /self-pay/_clock/set_current_utc"
      - "GET endpoints per §1.5 roles lists"

  - name: CollectionAgencyUser
    description: "External collection agency user; reports remittances, marks accounts as credit-reported, views accounts and placements"
    identity: opaque
    exclusive_operations:
      - "POST /self-pay/collection-agency-placements/{placementId}/mark-credit-reported"
    shared_operations:
      - "POST /self-pay/recovery-transactions"
      - "GET endpoints per §1.5 roles lists"
