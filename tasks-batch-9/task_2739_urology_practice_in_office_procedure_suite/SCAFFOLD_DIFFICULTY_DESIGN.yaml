              as: PracticeAdmin
              captures: { type_id: $.data.id }
            - call: "POST /urology/scope-assets"
              payload: { serial_number: "SCP-9002", scope_model: "Olympus CYF-VH", channel_count: 1 }
              as: SterileProcessingTech
              as_user_id: "${tech_perf_id}"
              captures: { scope_id: $.data.id, scope_v1: $.data.version }
            - call: "POST /urology/_clock/set_current_utc"
