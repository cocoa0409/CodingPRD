              captures: { qc1_id: $.data.id }
            - call: "POST /certificates"
              payload: { cert_number: "CA-U-8801", scope_codes: ["U"], issued_on: "2026-01-01", expires_on: "2029-01-01" }
              as: ShopAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /vessel-jobs"
              payload: { certificate_id: "${cert_id}", job_number: "J-2885-12", customer_name: "Northline Energy", vessel_type: "PRESSURE_VESSEL", design_code: "DIV1", mawp_psi: 350, design_temp_f: 650, mdmt_f: -20, inside_radius_in: 30, stress_ratio: 1.00 }
              as: ShopAdmin
              captures: { job_id: $.data.id, jv1: $.data.version }
            - call: "POST /vessel-jobs/${job_id}/design-calculations"
              payload: { expected_job_version: "${jv1}", component: "SHELL", rt_extent_declared: "SPOT", allowable_stress_psi: 20000, corrosion_allowance_in: 0.0625, thickness_nominal_in: 1.0000 }
              as: DesignEngineer
              as_user_id: "${de1_id}"
              captures: { c_shell_id: $.data.id }
            - call: "GET /vessel-jobs/${job_id}"
              payload: {}
              as: ShopAdmin
              captures: { jv2: $.data.version }
            - call: "POST /vessel-jobs/${job_id}/design-calculations"
              payload: { expected_job_version: "${jv2}", component: "HEAD", rt_extent_declared: "SPOT", allowable_stress_psi: 20000, corrosion_allowance_in: 0.0625, thickness_nominal_in: 1.0000 }
              as: DesignEngineer
              as_user_id: "${de1_id}"
              captures: { c_head_id: $.data.id }
            - call: "POST /design-calculations/${c_shell_id}/submit"
              payload: {}
              as: DesignEngineer
              as_user_id: "${de1_id}"
            - call: "POST /design-calculations/${c_shell_id}/approve"
              payload: {}
              as: DesignEngineer
              as_user_id: "${de2_id}"
            - call: "POST /design-calculations/${c_head_id}/submit"
              payload: {}
              as: DesignEngineer
              as_user_id: "${de1_id}"
            - call: "POST /design-calculations/${c_head_id}/approve"
              payload: {}
              as: DesignEngineer
              as_user_id: "${de2_id}"
            - call: "POST /material-heats"
              payload: { heat_number: "H-4471", spec: "SA-516-70", form: "PLATE", mtr_received: true, mtr_certified_yield_ksi: 41.0, mtr_certified_tensile_ksi: 75.0, quantity_received_lb: 2000.00 }
              as: QCInspector
              as_user_id: "${qc1_id}"
              captures: { heat_id: $.data.id }
            - call: "POST /material-heats/${heat_id}/mtr-review"
