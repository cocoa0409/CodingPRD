# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ----- Account -----
  - method: POST
    path: "/accounts"
    description: "Create an account"
    roles: [Dispatcher]
    code: 201
    input: [name, billing_email]
    output: Account
    side_effects: ["standing=GOOD, outstanding_balance_cents=0"]

  - method: GET
    path: "/accounts/{id}"
    description: "Get an account"
    roles: [Dispatcher, ComplianceOfficer, FieldTech, Customer]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: GET
    path: "/accounts/{id}/sites"
    description: "List sites for an account (FK reverse-reachability for Site.account_id)"
    roles: [Dispatcher, ComplianceOfficer, FieldTech, Customer]
    code: 200
    input: []
    output: Site[]
    side_effects: []

  - method: POST
    path: "/accounts/{id}/hold"
    description: "Put account on HOLD (cascade-cancels open work orders)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Account
    side_effects:
      - "standing=HOLD; cascade-cancel DRAFT/SCHEDULED/DISPATCHED work orders of account's sites; recompute affected Route counters; increments Account.version by 1"

  - method: POST
    path: "/accounts/{id}/release-hold"
    description: "Release account hold"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Account
    side_effects: ["standing=GOOD; increments Account.version by 1"]

  # ----- Technician -----
  - method: POST
    path: "/technicians"
    description: "Create a technician"
    roles: [Dispatcher]
    code: 201
    input: [name, shift_start_minute, shift_end_minute, "certified_for_wells?"]
    output: Technician
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/technicians/{id}"
    description: "Get a technician"
    roles: [Dispatcher, ComplianceOfficer, FieldTech, Customer]
    code: 200
    input: []
    output: Technician
    side_effects: []

  - method: POST
    path: "/technicians/{id}/suspend"
    description: "Suspend a technician (reverts their DISPATCHED work orders to SCHEDULED)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Technician
    side_effects: ["status=SUSPENDED; DISPATCHED WOs -> SCHEDULED, technician_id cleared"]

  - method: POST
    path: "/technicians/{id}/reinstate"
    description: "Reinstate a technician"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Technician
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/routes/{id}/work-orders"
    description: "List work orders on a route (FK reverse-reachability for WorkOrder.route_id)"
    roles: [Dispatcher, ComplianceOfficer, FieldTech, Customer]
    code: 200
    input: []
    output: WorkOrder[]
    side_effects: []

  # ----- Site -----
  - method: POST
    path: "/sites"
    description: "Create a site under an account"
    roles: [Dispatcher]
    code: 201
    input: [account_id, address, county_code, "service_minutes?"]
    output: Site
    side_effects: ["compliance_status=UNKNOWN, risk_score=0"]

  - method: GET
    path: "/sites/{id}"
    description: "Get a site (includes computed next_pump_due_date, risk_score)"
    roles: [Dispatcher, ComplianceOfficer, FieldTech, Customer]
    code: 200
    input: []
    output: Site
    side_effects: []

  - method: GET
    path: "/sites/{id}/assets"
    description: "List assets for a site (FK reverse-reachability for Asset.site_id)"
    roles: [Dispatcher, ComplianceOfficer, FieldTech, Customer]
    code: 200
    input: []
    output: Asset[]
    side_effects: []

  - method: GET
    path: "/sites/{id}/service-plans"
    description: "List service plans for a site (FK reverse-reachability for ServicePlan.site_id)"
    roles: [Dispatcher, ComplianceOfficer, FieldTech, Customer]
    code: 200
    input: []
    output: ServicePlan[]
    side_effects: []

  - method: GET
    path: "/sites/{id}/reminders"
    description: "List reminders for a site (FK reverse-reachability for Reminder.site_id)"
    roles: [Dispatcher, ComplianceOfficer, FieldTech, Customer]
    code: 200
    input: []
    output: Reminder[]
    side_effects: []

  # ----- Asset -----
  - method: POST
    path: "/assets"
    description: "Create an asset (tank/well profile) on a site"
    roles: [Dispatcher]
    code: 201
    input: [site_id, asset_type, capacity_gallons, install_year]
    output: Asset
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/assets/{id}"
    description: "Get an asset"
    roles: [Dispatcher, ComplianceOfficer, FieldTech, Customer]
    code: 200
    input: []
    output: Asset
    side_effects: []

  # ----- ServicePlan -----
  - method: POST
    path: "/service-plans"
    description: "Create a recurring service plan; supersedes prior ACTIVE plan (OCC on Site.version)"
    roles: [Dispatcher]
    code: 201
    input: [site_id, frequency_months, estimated_gallons, expected_site_version]
    output: ServicePlan
    side_effects:
      - "prior ACTIVE plan -> SUPERSEDED; status=ACTIVE; Site.next_pump_due_date recomputed; increments Site.version by 1"

  - method: GET
    path: "/service-plans/{id}"
    description: "Get a service plan"
    roles: [Dispatcher, ComplianceOfficer, FieldTech, Customer]
    code: 200
    input: []
    output: ServicePlan
    side_effects: []

  # ----- WorkOrder -----
  - method: POST
    path: "/work-orders"
    description: "Create a work order in DRAFT"
    roles: [Dispatcher]
    code: 201
    input: [site_id, work_type, scheduled_date, window_start_minute, "estimated_gallons?"]
    output: WorkOrder
    side_effects: ["status=DRAFT, billing_status=UNBILLED, emergency_surcharge_applies set from work_type"]

  - method: GET
    path: "/work-orders/{id}"
    description: "Get a work order (includes estimated_cost_cents, final_cost_cents, invoice_total_cents)"
    roles: [Dispatcher, ComplianceOfficer, FieldTech, Customer]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []

  - method: GET
    path: "/work-orders"
    description: "List work orders, filterable (FK reverse-reachability for WorkOrder.site_id and WorkOrder.technician_id)"
    roles: [Dispatcher, ComplianceOfficer, FieldTech, Customer]
    code: 200
    input: ["site_id?", "technician_id?", "route_id?", "status?", "limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []

  - method: POST
    path: "/work-orders/{id}/schedule"
    description: "Schedule a DRAFT work order onto an OPEN route"
    roles: [Dispatcher]
    code: 200
    input: [route_id]
    output: WorkOrder
    side_effects:
      - "status=SCHEDULED; route_id set; window_end_minute computed; estimated_gallons defaulted from plan; estimated_cost_cents computed; Route counters recomputed"

  - method: POST
    path: "/work-orders/{id}/dispatch"
    description: "Dispatch a SCHEDULED work order to the route's technician"
    roles: [Dispatcher]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["status=DISPATCHED; technician_id set from Route.technician_id"]

  - method: POST
    path: "/work-orders/{id}/revert"
    description: "Revert a DISPATCHED work order back to SCHEDULED"
    roles: [Dispatcher]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["status=SCHEDULED; technician_id cleared"]

  - method: POST
    path: "/work-orders/{id}/start"
    description: "Field tech starts the visit"
    roles: [FieldTech]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["status=IN_PROGRESS"]

  - method: POST
    path: "/work-orders/{id}/complete"
    description: "Complete the visit; supply measured gallons for PUMPING/EMERGENCY"
    roles: [FieldTech]
    code: 200
    input: ["measured_gallons?"]
    output: WorkOrder
    side_effects:
      - "status=COMPLETED; final_cost_cents + invoice_total_cents computed; Route counters recomputed; Site last_pumped_date/next_pump_due_date recomputed; PUMP_DUE Reminder emitted"

  - method: POST
    path: "/work-orders/{id}/cancel"
    description: "Cancel a non-terminal work order"
    roles: [Dispatcher]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["status=CANCELLED; route_id/technician_id cleared; Route counters recomputed"]

  - method: POST
    path: "/work-orders/{id}/invoice"
    description: "Invoice a COMPLETED work order"
    roles: [Dispatcher]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["billing_status=INVOICED; Account.outstanding_balance_cents += invoice_total_cents"]

  - method: POST
    path: "/work-orders/{id}/pay"
    description: "Record payment of an INVOICED work order"
    roles: [Dispatcher]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["billing_status=PAID; Account.outstanding_balance_cents -= invoice_total_cents"]

  # ----- RepairLine -----
  - method: POST
    path: "/repair-lines"
    description: "Add a parts/labor line to a REPAIR work order"
    roles: [Dispatcher, FieldTech]
    code: 201
    input: [work_order_id, part_name, quantity, unit_price_cents, "tax_rate_bps?"]
    output: RepairLine
    side_effects: ["line_total_cents computed (round per-line)"]

  - method: GET
    path: "/work-orders/{id}/repair-lines"
    description: "List repair lines on a work order (FK reverse-reachability for RepairLine.work_order_id)"
    roles: [Dispatcher, ComplianceOfficer, FieldTech, Customer]
    code: 200
    input: []
    output: RepairLine[]
    side_effects: []

  # ----- Route -----
  - method: POST
    path: "/routes"
    description: "Create a route for a technician+date"
    roles: [Dispatcher]
    code: 201
    input: [technician_id, route_date]
    output: Route
    side_effects: ["status=OPEN, assigned_stop_count=0, booked_minutes=0, optimized_sequence=[]"]

  - method: GET
    path: "/routes/{id}"
    description: "Get a route (includes assigned_stop_count, booked_minutes, optimized_sequence)"
    roles: [Dispatcher, ComplianceOfficer, FieldTech, Customer]
    code: 200
    input: []
    output: Route
    side_effects: []

  - method: GET
    path: "/technicians/{id}/routes"
    description: "List routes for a technician (FK reverse-reachability for Route.technician_id)"
    roles: [Dispatcher, ComplianceOfficer, FieldTech, Customer]
    code: 200
    input: []
    output: Route[]
    side_effects: []

  - method: POST
    path: "/routes/{id}/optimize"
    description: "Compute optimized stop order for the route"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Route
    side_effects: ["optimized_sequence sorted by window_start_minute ASC, tie-break created_at ASC"]

  - method: POST
    path: "/routes/{id}/lock"
    description: "Lock a route (rejects further assignment changes)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Route
    side_effects: ["status=LOCKED"]

  # ----- InspectionReport -----
  - method: POST
    path: "/inspection-reports"
    description: "Open a DRAFT inspection report against a COMPLETED INSPECTION work order"
    roles: [ComplianceOfficer]
    code: 201
    input: [work_order_id, "defect_count?"]
    output: InspectionReport
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/inspection-reports/{id}"
    description: "Get an inspection report"
    roles: [Dispatcher, ComplianceOfficer, FieldTech, Customer]
    code: 200
    input: []
    output: InspectionReport
    side_effects: []

  - method: GET
    path: "/work-orders/{id}/inspection-reports"
    description: "List inspection reports for a work order (FK reverse-reachability for InspectionReport.work_order_id)"
    roles: [Dispatcher, ComplianceOfficer, FieldTech, Customer]
    code: 200
    input: []
    output: InspectionReport[]
    side_effects: []

  - method: PATCH
    path: "/inspection-reports/{id}"
    description: "Edit a DRAFT report (result, defect_count)"
    roles: [ComplianceOfficer]
    code: 200
    input: ["result?", "defect_count?"]
    output: InspectionReport
    side_effects: ["fields updated only while DRAFT"]

  - method: POST
    path: "/inspection-reports/{id}/finalize"
    description: "Finalize a report; sets Site compliance_status + provisional risk"
    roles: [ComplianceOfficer]
    code: 200
    input: [result]
    output: InspectionReport
    side_effects: ["status=FINALIZED; finalized_at set; Site compliance_status + provisional risk_score set"]

  # ----- PermitFiling -----
  - method: POST
    path: "/permit-filings"
    description: "Open a DRAFT permit filing against a FINALIZED report"
    roles: [ComplianceOfficer]
    code: 201
    input: [inspection_report_id, site_id]
    output: PermitFiling
    side_effects: ["status=DRAFT, submission_count=0, county_code copied from Site"]

  - method: GET
    path: "/permit-filings/{id}"
    description: "Get a permit filing"
    roles: [Dispatcher, ComplianceOfficer, FieldTech, Customer]
    code: 200
    input: []
    output: PermitFiling
    side_effects: []

  - method: GET
    path: "/permit-filings"
    description: "List permit filings, filterable (FK reverse-reachability for PermitFiling.inspection_report_id and PermitFiling.site_id)"
    roles: [Dispatcher, ComplianceOfficer, FieldTech, Customer]
    code: 200
    input: ["site_id?", "inspection_report_id?", "status?", "limit?", "offset?"]
    output: PermitFiling[]
    side_effects: []

  - method: POST
    path: "/permit-filings/{id}/submit"
    description: "Submit a DRAFT permit filing to the county"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: PermitFiling
    side_effects: ["status=SUBMITTED; submission_count += 1"]

  - method: POST
    path: "/permit-filings/{id}/decide"
    description: "County decides a SUBMITTED filing"
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "decision_reason?"]
    output: PermitFiling
    side_effects: ["APPROVE -> APPROVED + Site COMPLIANT + final risk; REJECT -> REJECTED + final risk with penalty"]

  - method: POST
    path: "/permit-filings/{id}/reopen"
    description: "Reopen a REJECTED filing back to DRAFT (resubmission cycle)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: PermitFiling
    side_effects: ["status=DRAFT"]

  # ----- Reminder -----
  - method: GET
    path: "/reminders/{id}"
    description: "Get a reminder"
    roles: [Dispatcher, ComplianceOfficer, FieldTech, Customer]
    code: 200
    input: []
    output: Reminder
    side_effects: []

  - method: POST
    path: "/reminders/{id}/acknowledge"
    description: "Acknowledge a PENDING reminder"
    roles: [Dispatcher, Customer]
    code: 200
    input: []
    output: Reminder
    side_effects: ["status=ACKNOWLEDGED"]

  # ----- Test-driving clock -----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's current UTC clock (drives cooling-off / due-date logic deterministically)"
    roles: [Dispatcher, ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server current_utc set to to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource id does not exist" }
  - { id: ERR_FK_NOT_FOUND, http: 422, condition: "Body foreign key references a non-existent resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid required body field or enum value" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not defined from the resource's current state" }
  - { id: ERR_IMMUTABLE, http: 409, condition: "Attempt to mutate a FINALIZED report or terminal work order" }
  - { id: ERR_ROUTE_LOCKED, http: 409, condition: "Route is LOCKED; assignment/revert/optimize rejected" }
  - { id: ERR_ACCOUNT_ON_HOLD, http: 409, condition: "Owning Account.standing == HOLD when scheduling work" }
  - { id: ERR_TECH_SUSPENDED, http: 409, condition: "Technician.status == SUSPENDED on dispatch" }
  - { id: ERR_TECH_NOT_CERTIFIED, http: 409, condition: "WELL job dispatched to a technician without certified_for_wells" }
  - { id: ERR_TECH_WINDOW_CONFLICT, http: 409, condition: "Half-open technician window overlaps another SCHEDULED/DISPATCHED WO same tech+date" }
  - { id: ERR_SITE_BUFFER_CONFLICT, http: 409, condition: "Site window within SITE_BUFFER_MINUTES of another SCHEDULED/DISPATCHED WO same site+date" }
  - { id: ERR_OUTSIDE_SHIFT, http: 409, condition: "Work-order window falls outside technician shift bounds" }
  - { id: ERR_REPORT_NOT_FINALIZED, http: 409, condition: "Permit submit when linked InspectionReport not FINALIZED" }
  - { id: ERR_SITE_NON_COMPLIANT, http: 409, condition: "Permit submit when Site.compliance_status == NON_COMPLIANT" }
  - { id: ERR_COOLING_OFF, http: 409, condition: "Permit submit before COOLING_OFF_HOURS elapsed after finalize" }
  - { id: ERR_MEASUREMENT_REQUIRED, http: 422, condition: "PUMPING/EMERGENCY completion without measured_gallons" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_site_version != Site.version on service-plan create (OCC)" }
  - { id: ERR_VALIDATION, http: 422, condition: "Generic field-range validation failure (e.g., shift_end <= shift_start, capacity <= 0)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Dispatcher
    description: "Operations: creates accounts/sites/assets/plans/routes/work-orders, schedules, dispatches, invoices, payments, account holds, technician suspend/reinstate."
    identity: "opaque"
    exclusive_operations:
      - "POST /accounts, POST /accounts/{id}/hold, POST /accounts/{id}/release-hold"
      - "POST /technicians, POST /technicians/{id}/suspend, POST /technicians/{id}/reinstate"
      - "POST /sites, POST /assets, POST /service-plans"
      - "POST /work-orders, POST /work-orders/{id}/schedule, /dispatch, /revert, /cancel, /invoice, /pay"
      - "POST /routes, POST /routes/{id}/optimize, POST /routes/{id}/lock"
    shared_operations:
      - "POST /repair-lines (with FieldTech)"
      - "POST /reminders/{id}/acknowledge (with Customer)"
      - "POST /_clock/set_current_utc (with ComplianceOfficer)"
      - "All GET reads"

  - name: FieldTech
    description: "Technician in the field: starts and completes their dispatched work orders, adds repair lines."
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /work-orders/{id}/start (own dispatched WO)"
      - "POST /work-orders/{id}/complete (own dispatched WO)"
    shared_operations:
      - "POST /repair-lines (with Dispatcher)"
      - "All GET reads"

  - name: ComplianceOfficer
    description: "Compliance: manages inspection reports and county permit filings."
    identity: "opaque"
    exclusive_operations:
      - "POST /inspection-reports, PATCH /inspection-reports/{id}, POST /inspection-reports/{id}/finalize"
      - "POST /permit-filings, POST /permit-filings/{id}/submit, /decide, /reopen"
    shared_operations:
      - "POST /_clock/set_current_utc (with Dispatcher)"
      - "All GET reads"

  - name: Customer
    description: "Account-facing read-only persona who can acknowledge reminders."
    identity: "entity_backed:Account"
    exclusive_operations: []
    shared_operations:
      - "POST /reminders/{id}/acknowledge (with Dispatcher)"
      - "All GET reads"
