    input: []
    output: "RecoveryClaim[]"
    side_effects: []
  - method: POST
    path: "/fap/recovery-claims/{id}/file"
    description: "DRAFTED|REBUTTED -> FILED"
    roles: [AuditAnalyst]
    code: 200
    input: []
    output: RecoveryClaim
    side_effects: []
  - method: POST
    path: "/fap/recovery-claims/{id}/carrier_respond"
    description: "FILED -> ACKNOWLEDGED (outcome=ACKNOWLEDGE) or REBUTTED (outcome=REBUT); carrier-scoped"
    roles: [CarrierRep]
    code: 200
    input: [outcome]
    output: RecoveryClaim
    side_effects: []
  - method: POST
    path: "/fap/recovery-claims/{id}/collect"
    description: "ACKNOWLEDGED -> COLLECTED"
    roles: [FinanceController]
    code: 200
    input: [recovered_minor]
    output: RecoveryClaim
    side_effects: ["savings_rollup reflects recovery", "ERR_RECOVERY_EXCEEDS_CLAIMED"]
  - method: POST
    path: "/fap/recovery-claims/{id}/abandon"
    description: "DRAFTED|FILED|REBUTTED -> ABANDONED"
    roles: [AuditAnalyst]
    code: 200
    input: []
    output: RecoveryClaim
    side_effects: []

  # --- AnalyticsExport ---
  - method: POST
    path: "/fap/clients/{id}/analytics-exports"
    description: "Create a transportation analytics export; completes synchronously with row_count and checksum"
    roles: [FinanceController]
    code: 201
    input: [date_from, date_to, "include_statuses?"]
    output: AnalyticsExport
    side_effects: ["REQUESTED -> COMPLETED", "ERR_EXPORT_RANGE_INVALID"]
  - method: GET
    path: "/fap/clients/{id}/analytics-exports"
    description: "List analytics exports of a client"
    roles: [FapAdmin, AuditAnalyst, FinanceController, TreasuryApprover, CarrierRep, ClientViewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "AnalyticsExport[]"
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not permitted for endpoint, or entity-backed role acting outside its scope" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist (or is hidden from a scope-limited role)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, unknown field, or invalid enum value" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource in a state that forbids the transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version" }
  - { id: ERR_CLIENT_NOT_ACTIVE, http: 409, condition: "Business mutation attempted while client not ACTIVE" }
  - { id: ERR_CLIENT_NOT_SETTLED, http: 409, condition: "Terminate attempted with outstanding liability or unpaid invoices" }
  - { id: ERR_CARRIER_NOT_ACTIVE, http: 409, condition: "Payment scheduling references a carrier not in ACTIVE status" }
  - { id: ERR_CARRIER_HAS_OPEN_INVOICES, http: 409, condition: "Offboard attempted with UNPAID or SCHEDULED invoices" }
  - { id: ERR_DUPLICATE_PRO_NUMBER, http: 409, condition: "pro_number already used by a non-VOIDED shipment of the same client+carrier" }
  - { id: ERR_DUPLICATE_INVOICE_NUMBER, http: 409, condition: "invoice_number already used by a non-VOIDED invoice of the same client+carrier" }
  - { id: ERR_DUPLICATE_FX_RATE, http: 409, condition: "FxRate already exists for client + currency pair + effective_date" }
  - { id: ERR_CONTRACT_WINDOW_OVERLAP, http: 409, condition: "Activating contract's half-open window intersects another ACTIVE contract of the same carrier with an intersecting lane, and it is not the declared supersedes target" }
  - { id: ERR_CONTRACT_WINDOW_INVALID, http: 422, condition: "effective_from >= effective_to" }
  - { id: ERR_WEIGHT_BREAK_INVALID, http: 422, condition: "Lane weight_breaks not strictly ascending by min_kg" }
  - { id: ERR_AMOUNT_MISMATCH, http: 422, condition: "billed_total_minor != sum of line billed amounts" }
  - { id: ERR_AMOUNT_INVALID, http: 422, condition: "Amount field zero or negative where a positive amount is required" }
  - { id: ERR_ALLOCATION_SUM_INVALID, http: 422, condition: "Allocation percentage_bp values do not sum to exactly 10000" }
  - { id: ERR_GL_ACCOUNT_INACTIVE, http: 409, condition: "GL coding targets an inactive GL account" }
  - { id: ERR_EMPTY_PAYMENT_RUN, http: 409, condition: "Lock attempted on a run with zero items" }
  - { id: ERR_FX_RATE_MISSING, http: 409, condition: "No FX rate path exists from invoice currency to run currency covering run_date" }
  - { id: ERR_INVOICE_NOT_PAYABLE, http: 409, condition: "Invoice not in audit CLEARED + payment UNPAID for scheduling, or write_off preconditions unmet" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Release attempted by the user who created or locked the run" }
  - { id: ERR_EXCEPTION_STILL_ACTIVE, http: 409, condition: "Rerate attempted while an exception is OPEN, CARRIER_NOTIFIED, CARRIER_RESPONDED, or ESCALATED" }
  - { id: ERR_NEGOTIATION_ROUND_LIMIT, http: 409, condition: "Counter attempted when round_count == 3" }
  - { id: ERR_DISPUTE_WINDOW_EXPIRED, http: 409, condition: "Carrier notification/response after opened_date + dispute_window_days" }
  - { id: ERR_CREDIT_EXCEEDS_DISPUTED, http: 409, condition: "Concession credit exceeds disputed_amount_minor" }
  - { id: ERR_CLAIM_EXCEEDS_PAID, http: 409, condition: "claimed_amount_minor exceeds invoice paid_minor" }
  - { id: ERR_RECOVERY_EXCEEDS_CLAIMED, http: 409, condition: "recovered_minor exceeds claimed_amount_minor" }
  - { id: ERR_RUN_DATE_PAST, http: 409, condition: "run_date before current logical date" }
  - { id: ERR_EXPORT_RANGE_INVALID, http: 422, condition: "date_to earlier than date_from" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: FapAdmin
    description: "Audit-provider platform administrator: client onboarding, carrier and contract master data, clock and sweeps, exception force-resolution"
    identity: opaque
    exclusive_operations:
      - "POST /fap/clients and client lifecycle (activate/suspend/terminate)"
      - "POST /fap/clients/{id}/carriers and carrier lifecycle"
      - "POST /fap/carriers/{id}/rate-contracts and contract activate/discard"
      - "POST /fap/_clock/set_current_utc"
      - "POST /fap/clients/{id}/run_daily_sweep"
    shared_operations: ["All GET endpoints", "POST /fap/exceptions/{id}/resolve (force from ESCALATED)"]
  - name: AuditAnalyst
    description: "Provider audit analyst: shipment intake, invoice capture/rating/finalization, exception negotiation, recovery claim drafting"
    identity: opaque
    exclusive_operations:
      - "POST /fap/clients/{id}/shipments and shipment void"
      - "POST /fap/clients/{id}/invoices and invoice capture/rate/finalize_audit/rerate/void"
      - "POST /fap/exceptions/{id}/notify_carrier, counter, escalate"
      - "POST /fap/invoices/{id}/recovery-claims, file, abandon"
    shared_operations: ["All GET endpoints", "POST /fap/exceptions/{id}/resolve"]
  - name: FinanceController
    description: "Provider finance operator: GL master and coding, cost allocations, FX rates, payment run composition, recovery collection, analytics exports"
    identity: opaque
    exclusive_operations:
      - "POST /fap/clients/{id}/gl-accounts"
      - "POST /fap/invoice-lines/{id}/gl-code and allocations"
      - "POST /fap/clients/{id}/fx-rates"
      - "POST /fap/clients/{id}/payment-runs, items, lock, unlock, cancel"
      - "POST /fap/invoices/{id}/write_off"
      - "POST /fap/recovery-claims/{id}/collect"
      - "POST /fap/clients/{id}/analytics-exports"
    shared_operations: ["All GET endpoints"]
  - name: TreasuryApprover
    description: "Payment release authority; segregation of duties forbids releasing a run one created or locked"
    identity: opaque
    exclusive_operations:
      - "POST /fap/payment-runs/{id}/release"
      - "POST /fap/payment-runs/{id}/settle"
    shared_operations: ["All GET endpoints"]
  - name: CarrierRep
    description: "Carrier representative; acts only on resources whose carrier == X-User-ID"
    identity: "entity_backed:Carrier"
    exclusive_operations:
      - "POST /fap/exceptions/{id}/carrier_respond"
      - "POST /fap/recovery-claims/{id}/carrier_respond"
      - "POST /fap/remittance-advices/{id}/acknowledge"
    shared_operations: ["All GET endpoints (carrier-scoped)"]
  - name: ClientViewer
    description: "Shipper read-only user; X-User-ID equals the ClientAccount id; cross-client reads return ERR_NOT_FOUND"
    identity: "entity_backed:ClientAccount"
    exclusive_operations: []
    shared_operations: ["All GET endpoints (client-scoped)"]
  - name: System
    description: "Automation identity for sweeps and system transitions"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["POST /fap/clients/{id}/run_daily_sweep"]
