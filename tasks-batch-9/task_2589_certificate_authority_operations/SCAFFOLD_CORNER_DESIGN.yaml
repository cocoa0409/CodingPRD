      - name: mass_revoke_is_a_bulk_action_over_the_scoped_pool
        claim_type: bulk_action
        excluded_because:
          difficulty_instance: remediation_penalty_round_per_certificate_then_sum
          rationale: "The §1.8 combinatorial_formula instance already drives one mass-revoke batch across two in-scope certificates and asserts the per-certificate effects plus the aggregated penalty, which is the bulk semantics of this endpoint; the single-batch drain and the empty-pool refusal are asserted by the §1.9 calculations instance mass_revocation_scope_is_half_open_at_the_upper_bound."

      - name: crl_publication_read_returns_the_computed_entry_list
        claim_type: computed_read
        excluded_because:
          difficulty_instance: crl_entry_ledger_conservation_across_publications
          rationale: "The §1.8 compensating_invariant instance already reads back both CRL publications and asserts crl_number, entry_count and the revoked_serials ordering against the profile's counters, which is the derived-data claim for this endpoint."

      - name: certificate_activation_is_conditional_on_the_sct_count
        claim_type: conditional_action
        excluded_because:
          difficulty_instance: sct_count_exactly_equal_to_required_threshold_permits_activation
          rationale: "The §1.8 boundary_precision_check instance already refuses activation one SCT short with ERR_INSUFFICIENT_SCTS and allows it at exact equality, covering the conditional-action semantics of POST /ca/certificates/{id}/activate."

  - section: errors
    instances:
      - name: auth_envelope_errors_are_raised_in_declared_priority_order
        claim_type: violation_to_error
        grounds:
          - errors[ERR_MISSING_USER_HEADER]
          - errors[ERR_MISSING_ROLE_HEADER]
          - errors[ERR_UNKNOWN_ROLE]
          - validations[priority=1]
          - validations[priority=2]
          - validations[priority=3]
        distinguishing_aspect: "The three envelope errors are all HTTP 401 but distinct ids, and priority 1 beats priority 3: a POST that carries an empty X-User-ID AND an unknown X-User-Role returns ERR_MISSING_USER_HEADER, not ERR_UNKNOWN_ROLE. GET endpoints never raise ERR_MISSING_USER_HEADER because X-User-ID is not required on them."
        test_recipe:
          setup:
            - "Empty database at the default logical clock; no entity is needed because every envelope check precedes entity resolution."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
          trigger:
            - call: "POST /ca/subscribers"
              payload: { legal_name: "Envelope Probe Ltd", jurisdiction_code: "US-DE", registry_id: "REG-2040", contact_email: "ops@envelope.example", callback_phone: "+1-202-555-0140", credit_limit_cents: 500000 }
              as: POLICY_ADMIN
              as_user_id: ""
              captures: { err_no_user: $.data.error_id }
            - call: "GET /ca/certificate-profiles"
              payload: {}
              as: Anonymous
              captures: { err_no_role: $.data.error_id }
            - call: "GET /ca/certificate-profiles"
              payload: {}
              as: ROOT_ADMIN
              captures: { err_unknown_role: $.data.error_id }
            - call: "POST /ca/subscribers"
              payload: { legal_name: "Envelope Probe Ltd", jurisdiction_code: "US-DE", registry_id: "REG-2040", contact_email: "ops@envelope.example", callback_phone: "+1-202-555-0140", credit_limit_cents: 500000 }
              as: ROOT_ADMIN
              as_user_id: ""
              captures: { err_both_violated: $.data.error_id }
            - call: "GET /ca/subscribers"
              payload: {}
              as: ROOT_ADMIN
              captures: { err_get_unknown_role: $.data.error_id }
          assert:
            - "the first call returns HTTP 401 and ${err_no_user} == ERR_MISSING_USER_HEADER"
            - "the second call returns HTTP 401 and ${err_no_role} == ERR_MISSING_ROLE_HEADER"
            - "the third call returns HTTP 401 and ${err_unknown_role} == ERR_UNKNOWN_ROLE"
            - "the fourth call returns HTTP 401 and ${err_both_violated} == ERR_MISSING_USER_HEADER (priority 1 outranks priority 3)"
            - "the fifth call returns HTTP 401 and ${err_get_unknown_role} == ERR_UNKNOWN_ROLE (a GET still requires a known role)"
            - "no Subscriber row exists after the batch: GET /ca/subscribers as POLICY_ADMIN returns total_count == 0"

      - name: every_entity_lookup_returns_its_own_not_found_error_id
        claim_type: violation_to_error
        grounds:
          - errors[ERR_VETTING_NOT_FOUND]
          - errors[ERR_AUTHORIZATION_NOT_FOUND]
          - errors[ERR_REQUEST_NOT_FOUND]
          - errors[ERR_PARTITION_NOT_FOUND]
          - errors[ERR_REVOCATION_REQUEST_NOT_FOUND]
          - errors[ERR_INCIDENT_NOT_FOUND]
          - errors[ERR_AUDIT_NOT_FOUND]
          - validations[priority=12]
          - validations[priority=13]
          - validations[priority=14]
          - validations[priority=16]
          - validations[priority=18]
          - validations[priority=19]
          - validations[priority=20]
        distinguishing_aspect: "Seven different entities share one syntactically valid but unknown UUID; each read must answer with its own entity-specific 404 id rather than a generic ERR_NOT_FOUND, so a shared lookup helper that returns one code for all of them fails."
