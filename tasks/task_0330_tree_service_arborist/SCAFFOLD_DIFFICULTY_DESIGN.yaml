              as: Dispatcher
              captures: { wo: $.data.id }
            - call: "POST /work-orders/${wo}/trees"
              payload: { species: "Maple", dbh_inches: 20 }
              as: Arborist
              captures: { tree: $.data.id }
            - call: "POST /work-orders/${wo}/assess"
              payload: {}
              as: Arborist
            - call: "POST /work-orders/${wo}/estimates"
              payload: {}
              as: Arborist
              captures: { est: $.data.id }
            - call: "POST /line-items"
              payload: { estimate_id: "${est}", service_type: "REMOVAL", quantity: 1, tree_asset_id: "${tree}" }
              as: Arborist
            - call: "POST /work-orders/${wo}/estimates/${est}/issue"
              payload: {}
              as: Arborist
            - call: "POST /work-orders/${wo}/estimates/${est}/accept"
              payload: {}
              as: Client
              as_user_id: "client-1"
            - call: "GET /work-orders/${wo}"
              payload: {}
              as: Dispatcher
              captures: { v1: $.data.version }
            - call: "POST /bookings"
              payload: { work_order_id: "${wo}", resource_kind: "EQUIPMENT", equipment_id: "${crane_id}", start_at: "2026-07-16T09:00:00Z", end_at: "2026-07-16T12:00:00Z", expected_work_order_version: "${v1}" }
              as: Dispatcher
              captures: { bk1: $.data.id }
            - call: "GET /work-orders/${wo}"
              payload: {}
              as: Dispatcher
              captures: { v2: $.data.version }
          trigger:
            - call: "POST /bookings"
              payload: { work_order_id: "${wo}", resource_kind: "EQUIPMENT", equipment_id: "${crane_id}", start_at: "2026-07-16T12:00:00Z", end_at: "2026-07-16T14:00:00Z", expected_work_order_version: "${v2}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "adjacent crane booking 12:00–14:00 (only 0 min gap, < 30 min buffer) returns HTTP 409 ERR_EQUIPMENT_DOUBLE_BOOKED"
            - "this same end==start adjacency was ACCEPTED for a crew in the sibling instance — confirming different interval semantics"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: disposal_void_conserves_disposal_ledger
        grounds:
          - state_machines.DisposalTicket.RECORDED_to_VOIDED
          - state_machines.DisposalTicket.RECORDED_to_FINALIZED
          - entities.WorkOrder.fields.disposal_cost_accrued_cents
        distinguishing_aspect: |
          Conserved quantity #1: WorkOrder.disposal_cost_accrued_cents. The forward action (finalize)
          would add fee_cents; its compensating action (void on a still-RECORDED ticket) leaves the
          ledger at exactly its pre-ticket value. Invariant pinned: disposal_cost_accrued_cents == 0
          after record+void (no drift).
        test_recipe:
          setup:
            - "SCHEDULED HOURLY work order; one RECORDED disposal ticket 3.5 tons; ledger still 0 (RECORDED never bills)."
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { name: "Northwest", region_code: "NW-01", disposal_fee_cents_per_ton: 8000 }
              as: Dispatcher
              captures: { area_id: $.data.id }
            - call: "POST /work-orders"
              payload: { service_area_id: "${area_id}", client_user_id: "client-1", site_address: "21 Debris St", pricing_mode: "HOURLY" }
              as: Dispatcher
              captures: { wo: $.data.id }
            - call: "POST /work-orders/${wo}/trees"
              payload: { species: "Maple", dbh_inches: 20 }
              as: Arborist
              captures: { tree: $.data.id }
            - call: "POST /work-orders/${wo}/assess"
              payload: {}
              as: Arborist
            - call: "POST /work-orders/${wo}/estimates"
              payload: {}
              as: Arborist
              captures: { est: $.data.id }
            - call: "POST /line-items"
              payload: { estimate_id: "${est}", service_type: "REMOVAL", quantity: 1, tree_asset_id: "${tree}" }
              as: Arborist
            - call: "POST /work-orders/${wo}/estimates/${est}/issue"
              payload: {}
              as: Arborist
            - call: "POST /work-orders/${wo}/estimates/${est}/accept"
              payload: {}
              as: Client
              as_user_id: "client-1"
            - call: "POST /work-orders/${wo}/disposal-tickets"
              payload: { debris_tons: 3.5 }
              as: FinanceClerk
              captures: { ticket: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo}/disposal-tickets/${ticket}/void"
              payload: {}
              as: FinanceClerk
            - call: "GET /work-orders/${wo}"
              payload: {}
              as: Dispatcher
              captures: { ledger: $.data.disposal_cost_accrued_cents }
          assert:
            - "DisposalTicket.${ticket}.status == VOIDED"
            - "WorkOrder.${wo}.disposal_cost_accrued_cents == 0 (unchanged from before the ticket existed)"

      - name: release_conserves_crew_reserved_window
        grounds:
          - state_machines.Booking.RESERVED_to_RELEASED
          - validations[priority=12]
          - entities.Booking.fields.status
        distinguishing_aspect: |
          Conserved quantity #2 (different type than the disposal ledger): a crew's occupied
          calendar window. Reserving a 09:00–12:00 window then releasing it restores the crew's
          reserved-window set to empty — proven because an identical 09:00–12:00 booking that was
          blocked while reserved now succeeds after release (the window is conserved to its pre-state).
        test_recipe:
          setup:
            - "Crew A holds a RESERVED 09:00–12:00 booking on 2026-07-17 (SCHEDULED work order W1)."
            - "A second SCHEDULED work order W2 needs the SAME crew for the SAME window."
