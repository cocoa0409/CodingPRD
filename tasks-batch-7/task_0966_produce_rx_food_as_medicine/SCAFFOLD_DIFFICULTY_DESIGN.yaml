            - { call: "POST /patients", payload: { clinic_id: "${cl}", full_name: "Pat One", date_of_birth: "1980-01-15", household_size: 2 }, as: ClinicStaff, as_user_id: "${cl}", captures: { pt: $.data.id } }
            - { call: "POST /patients/${pt}/grant-consent", payload: {}, as: ClinicStaff, as_user_id: "${cl}" }
            - { call: "POST /referrals", payload: { clinic_id: "${cl}", patient_id: "${pt}", program_id: "${pg}", diagnosis_code: "E11.9", priority: "STANDARD" }, as: ClinicStaff, as_user_id: "${cl}", captures: { rf: $.data.id } }
            - { call: "POST /referrals/${rf}/start-review", payload: {}, as: ProgramAdmin }
            - { call: "POST /referrals/${rf}/approve", payload: {}, as: ProgramAdmin, captures: { en: $.data.enrollment_id } }
            - { call: "POST /programs/${pg}/cycles", payload: { period_index: 1, start_date: "2026-05-01", end_date: "2026-06-01" }, as: ProgramAdmin, captures: { cy: $.data.id } }
            - { call: "POST /cycles/${cy}/open", payload: {}, as: ProgramAdmin }
            - { call: "POST /cycles/${cy}/issue", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /redemptions", payload: { retailer_id: "${rt}", enrollment_id: "${en}", lines: [ { category: "PRODUCE_ELIGIBLE", amount_cents: 2000 }, { category: "STAPLE", amount_cents: 3000 } ] }, as: RetailerStaff, as_user_id: "${rt}", captures: { rd: $.data.id } }
            - { call: "GET /programs/${pg}", payload: {}, as: ProgramAdmin, captures: { m1: $.data.double_up_matched_cents, r1: $.data.double_up_remaining_cents } }
            - { call: "POST /redemptions/${rd}/void", payload: { reason: "register error" }, as: ProgramAdmin }
            - { call: "GET /programs/${pg}", payload: {}, as: ProgramAdmin, captures: { m2: $.data.double_up_matched_cents, r2: $.data.double_up_remaining_cents } }
          assert:
            - "after redemption: double_up_matched_cents == 2000 and double_up_remaining_cents == 3000 (sum 5000)"
