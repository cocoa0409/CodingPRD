      - name: an_untimely_non_renewal_notice_extends_the_term_and_republishes_every_derived_field
        claim_type: computed_read
        grounds:
          - calculations.non_renewal_notice_policy
          - state_machines.ReappointmentReview.RECOMMENDED_NON_RENEW_to_FINALIZED_NON_RENEWED
          - endpoints.GET /reappointment-reviews/{id}
        distinguishing_aspect: "Finalizing on 2027-09-15, fifteen days past the 2027-08-31 deadline, makes notice_timely false and forces the compensating extension: term_extension_days 15, Appointment.term_end_date 2027-10-15 with pre_notice_term_end_date preserved as 2027-09-30, and every field downstream of the term recomputed - term_months 13, cumulative_months_in_rank_at_end 13, encumbrance 84557.81 on a 380-day overlap, and available_balance_usd 215442.19. The read-back through GET /reappointment-reviews/{id} must show the same numbers the finalize response returned."
