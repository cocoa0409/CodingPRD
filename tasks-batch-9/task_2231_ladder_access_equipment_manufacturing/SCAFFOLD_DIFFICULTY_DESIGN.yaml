  instances:
  - name: working_length_exactly_twelve_feet_adds_no_step
    grounds:
    - calculations.required_test_load_derivation
    - entities.Product.fields.working_length_ft
    - entities.Product.fields.safety_factor
    - endpoints[POST /ladder-ops/products]
    distinguishing_aspect: 'Boundary metric: working_length_ft against LENGTH_BASELINE_FT 12 on POST /products — 12.0 ft yields max(0, ceil(0/4)) == 0 steps and safety_factor 4.00 (required 900.00), while
      12.5 ft already buys a whole step: 4.15 and 933.75.'
    test_recipe:
      setup:
      - The database is empty apart from the logical clock at 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
