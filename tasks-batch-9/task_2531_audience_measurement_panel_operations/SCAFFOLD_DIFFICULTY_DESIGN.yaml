              as: PanelOperationsManager
          trigger:
            - call: "POST /households/${hv1_id}/accrue-incentive"
              payload: { period_label: "2027-02" }
              as: PanelOperationsManager
              captures: { accrued_first: "$.data.incentive_accrued_cents" }
            - call: "POST /households/${hv1_id}/reverse-accrual"
              payload: { period_label: "2027-02", memo: "Compliance figure restated by audit" }
              as: PanelOperationsManager
              captures: { accrued_after_reversal: "$.data.incentive_accrued_cents" }
            - call: "POST /households/${hv1_id}/accrue-incentive"
              payload: { period_label: "2027-02" }
              as: PanelOperationsManager
              captures: { accrued_second: "$.data.incentive_accrued_cents" }
          assert:
            - "${hv1_recruited_at} == 2026-08-01T00:00:00Z and Household.${hv1_id}.compliance_rate_rolling_30 == 1.0000 before the trigger"
            - "Before the trigger: Household.${hv1_id}.incentive_accrued_cents == 0 and Market.${m19_id}.incentive_budget_committed_cents == 0 and .incentive_budget_reserved_cents == 0"
            - "Trigger call 1: ${accrued_first} == 3632 - cell_base 3000, tenure_amount 3225, bonus 276, ooh 131, no fault penalty, under the 5000 period cap"
            - "Trigger call 1: Market.${m19_id}.incentive_budget_committed_cents == 3632 and accrual_periods == [{period_label: 2027-02, accrued_cents: 3632, reversed: false}]"
            - "Trigger call 2: ${accrued_after_reversal} == 0 and Market.${m19_id}.incentive_budget_committed_cents == 0 - both sides of the ledger are back to their exact pre-accrual values, with no residual cent"
            - "Trigger call 2: accrual_periods still holds exactly one entry, now {accrued_cents: 3632, reversed: true} - the reversal compensates the balances without erasing the audit trail"
            - "Trigger call 3: HTTP 200 - the reversed period_label became accruable again, so no ERR_INCENTIVE_PERIOD_ALREADY_ACCRUED"
            - "Trigger call 3: ${accrued_second} == 3632 == ${accrued_first} and Market.${m19_id}.incentive_budget_committed_cents == 3632"
            - "Trigger call 3: accrual_periods has exactly 2 entries and incentive_accrued_cents equals the sum of the UNREVERSED entries (3632), never the sum of all of them (7264)"

      - name: fault_repair_conserves_intab_count_and_reserved_boost
        grounds:
          - endpoints[POST /meters/{meter_id}/fault-reports]
          - endpoints[POST /meters/{meter_id}/repairs]
          - calculations.quota_cell_fill
          - calculations.market_recruitment_posture
          - entities.Market.fields.incentive_budget_reserved_cents
          - entities.QuotaCell.fields.intab_count
          - entities.Meter.fields.fault_count
        distinguishing_aspect: |
          A different conserved quantity from the accrual ledger: the boost RESERVE
          (Market.incentive_budget_reserved_cents, invariant INV_BOOST_RESERVE_CENTS) together with the
          in-tab head-count. Two faults arm the reserve once and only once - it stays 2000 and never
          doubles to 4000 - and the two repairs, applied in the reverse order, return intab_count to 2
          and the reserve to 0 exactly, while each meter's lifetime fault_count stays at 1.
        test_recipe:
          setup:
            - "Market DMA-520 with incentive_budget_cents 1000000 and one quota cell (target 2, base incentive 4000), so an armed boost reserves round_half_up(4000 * 0.25 * 2, 0) == 2000 cents."
            - "Households hA (created first) and hB (created second), each ACTIVE with one installed HEALTHY TV_TUNER, so intab_count is 2, the cell is FILLED, the boost is disarmed, incentive_budget_reserved_cents is 0 and the market posture is CLOSED."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Upsilon", market_code: "DMA-520", dma_rank: 20, incentive_budget_cents: 1000000 }
              as: PanelOperationsManager
              captures: { m20_id: "$.data.id" }
            - call: "POST /markets/${m20_id}/quota-cells"
              payload: { age_band: "P18_34", income_band: "MID", geo_zone: "URBAN", target_households: 2, base_incentive_cents: 4000 }
              as: PanelOperationsManager
              captures: { cell_w_id: "$.data.id" }
            - call: "POST /households"
              payload: { market_id: "${m20_id}", quota_cell_id: "${cell_w_id}", recruitment_source: "ADDRESS_SAMPLE", persons_count: 2 }
              as: PanelOperationsManager
              captures: { hw_a_id: "$.data.id" }
            - call: "POST /meters"
              payload: { household_id: "${hw_a_id}", meter_type: "TV_TUNER", serial_no: "MT-001801" }
              as: FieldTechnician
              captures: { mtw_a_id: "$.data.id" }
            - call: "POST /meters/${mtw_a_id}/install-confirmations"
              payload: {}
              as: FieldTechnician
            - call: "POST /households/${hw_a_id}/enumerations"
              payload: { roster_persons_count: 2, tv_sets_count: 1 }
              as: FieldTechnician
            - call: "POST /households"
              payload: { market_id: "${m20_id}", quota_cell_id: "${cell_w_id}", recruitment_source: "RDD_PHONE", persons_count: 3 }
              as: PanelOperationsManager
              captures: { hw_b_id: "$.data.id" }
            - call: "POST /meters"
              payload: { household_id: "${hw_b_id}", meter_type: "TV_TUNER", serial_no: "MT-001802" }
              as: FieldTechnician
              captures: { mtw_b_id: "$.data.id" }
            - call: "POST /meters/${mtw_b_id}/install-confirmations"
              payload: {}
              as: FieldTechnician
            - call: "POST /households/${hw_b_id}/enumerations"
              payload: { roster_persons_count: 3, tv_sets_count: 2 }
              as: FieldTechnician
          trigger:
            - call: "POST /meters/${mtw_a_id}/fault-reports"
              payload: { fault_code: "TUNER_DEAD" }
              as: FieldTechnician
              captures: { a_health_after_fault: "$.data.health_status" }
            - call: "POST /meters/${mtw_b_id}/fault-reports"
              payload: { fault_code: "POWER_LOSS" }
              as: FieldTechnician
              captures: { b_health_after_fault: "$.data.health_status" }
            - call: "POST /meters/${mtw_b_id}/repairs"
              payload: { repair_note: "Power supply replaced" }
              as: FieldTechnician
              captures: { b_health_after_repair: "$.data.health_status" }
            - call: "POST /meters/${mtw_a_id}/repairs"
              payload: { repair_note: "Tuner board replaced" }
              as: FieldTechnician
              captures: { a_health_after_repair: "$.data.health_status" }
          assert:
            - "Before the trigger: QuotaCell.${cell_w_id}.intab_count == 2, .fill_rate == 1.0000, .quota_status == FILLED, .incentive_boost_active == false, .effective_incentive_multiplier == 1.00, Market.${m20_id}.incentive_budget_reserved_cents == 0 and .recruitment_posture == CLOSED"
            - "Trigger call 1: ${a_health_after_fault} == FAULTED, Household.${hw_a_id}.status == FAULT_HOLD, QuotaCell.${cell_w_id}.intab_count == 1 and .fill_rate == 0.5000 with .quota_status == UNDER_TARGET"
            - "Trigger call 1: .incentive_boost_active == true, .effective_incentive_multiplier == 1.25 and Market.${m20_id}.incentive_budget_reserved_cents == 2000"
            - "Trigger call 1: Market.${m20_id}.recruitment_posture == OPEN"
            - "Trigger call 2: ${b_health_after_fault} == FAULTED, Household.${hw_b_id}.status == FAULT_HOLD and QuotaCell.${cell_w_id}.intab_count == 0 with .fill_rate == 0.0000"
            - "Trigger call 2: Market.${m20_id}.incentive_budget_reserved_cents is still 2000 - the boost was already armed, so the reserve is NOT re-added and never reaches 4000"
            - "Trigger call 3: ${b_health_after_repair} == HEALTHY, Household.${hw_b_id}.status == ACTIVE, intab_count == 1, .quota_status == UNDER_TARGET and the reserve is still exactly 2000"
            - "Trigger call 4: ${a_health_after_repair} == HEALTHY, Household.${hw_a_id}.status == ACTIVE and QuotaCell.${cell_w_id}.intab_count == 2 with .fill_rate == 1.0000 and .quota_status == FILLED"
            - "Trigger call 4: .incentive_boost_active == false, .effective_incentive_multiplier == 1.00 and Market.${m20_id}.incentive_budget_reserved_cents == 0 - byte-for-byte the pre-fault reserve"
            - "Trigger call 4: Market.${m20_id}.recruitment_posture == CLOSED - the posture round trip closed exactly"
            - "Meter.${mtw_a_id}.fault_count == 1 and Meter.${mtw_b_id}.fault_count == 1 with missing_minutes_last_scan == 0 - the lifetime counters are the one thing the compensation does NOT undo"

      - name: weight_cap_redistribution_conserves_total_weight_mass
        grounds:
          - calculations.weight_cap_redistribution
          - calculations.household_base_weight
          - calculations.projected_average_audience
          - entities.HouseholdWeight.fields.adjusted_weight
          - entities.HouseholdWeight.fields.capped
          - entities.ProcessingRun.fields.total_weight_mass
          - entities.ProcessingRun.fields.limitation_disclosures
        distinguishing_aspect: |
          A third conserved quantity, neither money nor head-count but statistical weight mass: capping
          one outlier row at 818750.0000 and sharing its 281250.0000 excess by base_weight leaves the
          four adjusted weights summing to 1309999.9999, so the drift repair must add exactly +0.0001
          to the FIRST receiver in created_at order to bring total_weight_mass back to 1310000.0000.
        test_recipe:
          setup:
            - "Market DMA-521 with four quota cells, each target 1 and base incentive 2000, created in this order: cell1, cell2, cell3, cell4."
            - "Published 2026Q3 universe with population_households 100000, 30000, 80000 and 1100000 for cell1..cell4 respectively - the fourth cell is the outlier."
            - "Published edit rule set with outlier_weight_ratio_cap 2.5, invalid_tuning_max_minutes 900, outlier_household_minutes_cap 1200, ascription window 60, fault threshold 1440."
            - "One ACTIVE household per cell, created in cell order (h1..h4), each with one installed HEALTHY TV_TUNER, so every FINAL denominator is 1 and base_weight equals the cell population."
            - "Clock at 2026-08-11T00:00:00Z. On 2026-08-10 the four households report 350, 730, 60 and 900 tuning minutes respectively, all credited at factor 1.0 and all under the 1200-minute outlier cap."
            - "A run over [2026-08-10T00:00:00Z, 2026-08-11T00:00:00Z) (window_minutes 1440), edited before weighting."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Phi", market_code: "DMA-521", dma_rank: 21, incentive_budget_cents: 1000000 }
              as: PanelOperationsManager
              captures: { m21_id: "$.data.id" }
            - call: "POST /markets/${m21_id}/quota-cells"
              payload: { age_band: "P18_34", income_band: "LOW", geo_zone: "URBAN", target_households: 1, base_incentive_cents: 2000 }
              as: PanelOperationsManager
              captures: { c1_id: "$.data.id" }
            - call: "POST /markets/${m21_id}/quota-cells"
              payload: { age_band: "P18_34", income_band: "MID", geo_zone: "SUBURBAN", target_households: 1, base_incentive_cents: 2000 }
              as: PanelOperationsManager
              captures: { c2_id: "$.data.id" }
            - call: "POST /markets/${m21_id}/quota-cells"
              payload: { age_band: "P35_54", income_band: "MID", geo_zone: "RURAL", target_households: 1, base_incentive_cents: 2000 }
              as: PanelOperationsManager
              captures: { c3_id: "$.data.id" }
            - call: "POST /markets/${m21_id}/quota-cells"
              payload: { age_band: "P55_PLUS", income_band: "HIGH", geo_zone: "URBAN", target_households: 1, base_incentive_cents: 2000 }
              as: PanelOperationsManager
              captures: { c4_id: "$.data.id" }
            - call: "POST /edit-rule-sets"
