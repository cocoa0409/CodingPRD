      - name: permit_activation_uses_default_clock_before_window
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_PERMIT_WINDOW_INVALID]", endpoints: "POST /_clock/set_current_utc"]
        distinguishing_aspect: "With no set_current_utc call the logical clock reads exactly the startup default 2026-05-01T00:00:00Z (never wall clock): activating a permit windowed 06-12..06-20 fails ERR_PERMIT_WINDOW_INVALID, then succeeds after the clock is set inside the window."
        test_recipe:
          setup: ["turnaround EXECUTION; W1 FROZEN; I1 VERIFIED; permit P1 ISSUED (window 2026-06-12..2026-06-20); clock untouched at default"]
          setup_api_calls:
            - { call: "POST /turnarounds", payload: { name: "TA-CLK", plant_unit: "CRU-2", planned_start: "2026-06-10T00:00:00Z", planned_end: "2026-07-10T00:00:00Z", authorized_budget_cents: 900000000, contingency_budget_cents: 100000 }, as: TurnaroundManager, captures: { t_id: "$.data.id" } }
