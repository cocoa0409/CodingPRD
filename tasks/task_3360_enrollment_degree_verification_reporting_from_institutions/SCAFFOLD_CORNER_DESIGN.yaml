      - name: err_agreement_lapsed_upload_and_reinstate
        claim_type: violation_to_error
        grounds:
          - validations[priority=24]
          - errors[ERR_AGREEMENT_LAPSED]
        distinguishing_aspect: "An institution that never had an agreement is ACTIVE yet fails the agreement gate: upload returns 409 ERR_AGREEMENT_LAPSED, and after an ops suspend, reinstate also fails with ERR_AGREEMENT_LAPSED because no ACTIVE agreement covers now."
        test_recipe:
