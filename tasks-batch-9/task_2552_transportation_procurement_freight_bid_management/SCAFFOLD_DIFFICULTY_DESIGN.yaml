  - rule_id: transitive_cascade
    instances:
      - name: award_commit_five_link_cascade
        depth: 5
        grounds:
          - state_machines.BidEvent.AWARDING_to_AWARDED
          - state_machines.AwardAllocation.APPROVED_to_EXECUTED
          - state_machines.Lane.LOCKED_to_AWARDED
          - entities.Contract
          - entities.Carrier.fields.committed_volume_loads
        distinguishing_aspect: |
          Trigger: committing the routing guide via POST /bid-events/{id}/award. Depth 5, and
          each link exists only because the previous one happened — allocations execute
          because the event was awarded, lanes award because they hold an executed
          allocation, contracts are minted because those lanes awarded, and carrier capacity
          is re-derived because contracts now exist. A different trigger and a different
          entity chain from the tender-rejection cascade.
        chain:
          - "link 1: BidEvent AWARDING -> AWARDED, awarded_at stamped, award_cost_usd and savings_pct recomputed"
          - "link 2 (because of link 1): every APPROVED AwardAllocation of the PUBLISHED run -> EXECUTED and its LaneBid SHORTLISTED -> AWARDED_PRIMARY"
          - "link 3 (because of link 2): every Lane holding an EXECUTED allocation LOCKED -> AWARDED with awarded_coverage_pct recomputed"
          - "link 4 (because of link 3): one Contract row per (bid_event_id, carrier_id) present in those lanes' EXECUTED allocations"
          - "link 5 (because of link 4): each contracted Carrier's committed_volume_loads and active_primary_lane_count recomputed from its EXECUTED allocations"
        test_recipe:
          setup:
            - "Carrier ALFL qualified (composite 90.60 PROVISIONAL). Two-lane FORECAST event, max_carriers_per_lane 1."
            - "One round closed with a bid on each lane; optimization run published as the routing guide; both allocations APPROVED by user cm-001."
