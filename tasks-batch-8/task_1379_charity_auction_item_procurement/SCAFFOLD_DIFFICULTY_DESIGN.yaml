  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: donor_solicitation_cooldown_window
        grounds:
          - validations[priority=13]
          - errors[ERR_SOLICITATION_COOLDOWN]
        distinguishing_aspect: |
          Resource = Donor; semantics = point-in-half-open-window: a new
          solicitation conflicts iff last_sent_at <= now < last_sent_at + 30 days.
          At exactly +30 days (2026-08-31) the window has expired and creation
          succeeds — adjacency at the window edge is NOT a conflict.
        test_recipe:
          setup:
            - "Event in SOLICITING (cooldown 30 days); donor dn with solicitation so1 sent at the default clock 2026-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /gala-events", payload: { name: "Gala V", gala_date: "2026-11-20", bidding_opens_at: "2026-11-20T18:00:00Z", bidding_closes_at: "2026-11-20T22:00:00Z", min_bid_pct_bps: 3000, min_bid_increment_cents: 500, min_bid_floor_cents: 1000, bid_increment_tiers: [{up_to_cents: 100000, increment_cents: 2500}, {up_to_cents: 500000, increment_cents: 5000}, {up_to_cents: null, increment_cents: 10000}], ack_threshold_cents: 25000, solicitation_cooldown_days: 30, cert_validity_months: 12, cert_grace_days: 30 }, as: GalaAdmin, captures: { ev: "$.data.id" } }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "POST /donors", payload: { full_name: "Donor N", email: "dn2@x.org", donor_type: "INDIVIDUAL" }, as: ProcurementOfficer, captures: { dn: "$.data.id" } }
            - { call: "POST /solicitations", payload: { donor_id: "${dn}", gala_event_id: "${ev}", ask_description: "First ask", ask_estimate_cents: 20000 }, as: ProcurementOfficer, captures: { so1: "$.data.id" } }
            - { call: "POST /solicitations/${so1}/send", payload: {}, as: ProcurementOfficer, captures: { sent1: "$.data.last_sent_at" } }
          trigger:
            - { call: "POST /solicitations", payload: { donor_id: "${dn}", gala_event_id: "${ev}", ask_description: "Second ask too soon", ask_estimate_cents: 25000 }, as: ProcurementOfficer, captures: { err_id: "$.data.error_id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: GalaAdmin }
            - { call: "POST /solicitations", payload: { donor_id: "${dn}", gala_event_id: "${ev}", ask_description: "Second ask after cooldown", ask_estimate_cents: 25000 }, as: ProcurementOfficer, captures: { so2: "$.data.id" } }
          assert:
            - "so1.last_sent_at == 2026-08-01T00:00:00Z (default clock)"
            - "creation at 2026-08-01 rejected with error_id ERR_SOLICITATION_COOLDOWN (point inside [2026-08-01, 2026-08-31))"
            - "creation at exactly 2026-08-31T00:00:00Z succeeds (half-open upper bound), new solicitation id returned"

      - name: blackout_half_open_intersection
        grounds:
          - validations[priority=15]
          - errors[ERR_BLACKOUT_CONFLICT]
        distinguishing_aspect: |
          Resource = experience Item; semantics = half-open interval intersection
          [start, end): a redemption window ending exactly at the blackout start
          (2027-08-05) is ADJACENT and allowed; extending the end by one day into
          the blackout conflicts — adjacency treatment is the opposite of a
          closed-interval reading.
        test_recipe:
          setup:
            - "Event closed; two EXPERIENCE bundles sold for 50000 each and fully paid at default clock; both items carry blackout [2027-08-05, 2027-08-12); certA and certB ISSUED (valid_from 2026-08-01, grace_end 2027-08-31)"
