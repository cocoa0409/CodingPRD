  - rule_id: priority_pair_validation_conflict
    instances:
      - name: build_state_beats_technician_cert_on_station_log
        grounds:
          - validations[priority=26]
          - validations[priority=36]
          - errors[ERR_BUILD_STATE_INVALID]
          - errors[ERR_TECHNICIAN_NOT_CERTIFIED]
        distinguishing_aspect: |
          One station-log request violates both the `state` rule at priority 26 (the build is still PLANNED, so no
          station accepts work) and the `business_safety` rule at priority 36 (the technician is UNCERTIFIED with an
          empty scope list). Only the lower priority number may surface: 409 ERR_BUILD_STATE_INVALID, never
          422 ERR_TECHNICIAN_NOT_CERTIFIED, and no StationLog row may be created either way.
        test_recipe:
          setup:
            - "MachineModel OPL-60-A (certification is irrelevant here: the request dies on build state)"
            - "AssemblyStation DRUM-01 accepting ON_PREMISES work"
            - "Technician T-100 left in UNCERTIFIED with cert_scopes []"
            - "BuildOrder SN-0001 left in PLANNED, never released to the floor"
          setup_api_calls:
            - call: "POST /clm/machine-models"
              payload: { model_code: "OPL-60-A", product_line: "ON_PREMISES", capacity_rating_lb: 60, rated_water_gal_per_cwt: 1.10, rated_kwh_per_cwt: 0.42, drum_alloy_grade: "AISI_304", payment_module_options: [], list_price_cents: 1250000 }
              as: ProductEngineer
              as_user_id: "u-pe-01"
              captures: { m1: $.data.id }
            - call: "POST /clm/assembly-stations"
              payload: { station_code: "DRUM-01", station_type: "DRUM_FAB", parallel_capacity: 1, changeover_buffer_minutes: 30, supported_product_lines: ["ON_PREMISES", "VENDED"] }
