            - "Lease.${la_id}.billing_status == \"ACCRUING\" (an aborted haul does not unwind billing)"

      - name: activate_then_void_conserves_the_customer_ledger
        grounds:
          - state_machines.Lease.lease_unbilled_to_accruing
          - state_machines.Lease.lease_accruing_to_voided
          - state_machines.Lease.lease_pending_to_cancelled
          - calculations.customer_exposure
          - entities.Customer.fields.outstanding_balance_cents
