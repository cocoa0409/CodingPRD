      - name: lot_quarantine_reassay_cycle_bounded_at_three
        grounds:
          - state_machines.GypsumLot.RECEIVED_to_QUARANTINED
          - state_machines.GypsumLot.QUARANTINED_to_QUARANTINED
          - calculations.lot_assay_disposition
          - validations[priority=8]
          - errors[ERR_MAX_ASSAYS_REACHED]
        distinguishing_aspect: |
          The QUARANTINED self-loop is a bounded cycle, not a linear path: the lot re-enters
          QUARANTINED on assays 2 and 3 with quarantine_reason recomputed each time
          (MOISTURE_CEILING, then CHLORIDE_CEILING, then MOISTURE_CEILING again), and the fourth
          assay is refused with ERR_MAX_ASSAYS_REACHED leaving assay_count at 3 and version at 4.
        test_recipe:
          setup:
            - "Plant GYP-1 using the default synthetic_free_moisture_ceiling_pct 12.0 and CHLORIDE_CEILING_PPM 250."
            - "SYNTHETIC lot 300.000 t received (status RECEIVED, assay_count 0, version 1)."
            - "Assay 1 at 12.01 % moisture quarantines on MOISTURE_CEILING; assay 2 at 11.00 % with 250 ppm chloride quarantines on CHLORIDE_CEILING; assay 3 at 12.60 % with 250 ppm quarantines on MOISTURE_CEILING (first failing check wins)."
          setup_api_calls:
            - call: "POST /plant-ops/plants"
              payload: { code: "GYP-1", name: "Front Range Wallboard", calciner_capacity_tph: 60, stucco_silo_capacity_tons: 1200, energy_price_per_mmbtu: 4.20, contribution_margin_per_msf: 38.50 }
              as: PlantAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /plant-ops/gypsum-lots"
              payload: { plant_id: "${plant_id}", source_type: "SYNTHETIC", supplier_name: "Comanche FGD", received_tons: 300.000, declared_free_moisture_pct: 9.50, declared_purity_pct: 94.0 }
              as: MaterialsController
              captures: { lot_id: $.data.id }
            - call: "POST /plant-ops/gypsum-lots/${lot_id}/assay"
              payload: { free_moisture_pct: 12.01, purity_pct: 94.0, chloride_ppm: 120 }
              as: MaterialsController
            - call: "POST /plant-ops/gypsum-lots/${lot_id}/assay"
              payload: { free_moisture_pct: 11.00, purity_pct: 94.0, chloride_ppm: 250 }
              as: MaterialsController
            - call: "POST /plant-ops/gypsum-lots/${lot_id}/assay"
              payload: { free_moisture_pct: 12.60, purity_pct: 94.0, chloride_ppm: 250 }
              as: MaterialsController
              captures: { lot_v_after_three: $.data.version }
          trigger:
            - call: "POST /plant-ops/gypsum-lots/${lot_id}/assay"
              payload: { free_moisture_pct: 8.00, purity_pct: 94.0, chloride_ppm: 100 }
              as: MaterialsController
              captures: { err_id: $.data.error_id }
          assert:
            - "trigger response status == 409 and ${err_id} == ERR_MAX_ASSAYS_REACHED"
            - "GypsumLot.${lot_id}.status == QUARANTINED"
            - "GypsumLot.${lot_id}.quarantine_reason == MOISTURE_CEILING"
            - "GypsumLot.${lot_id}.assay_count == 3"
            - "GypsumLot.${lot_id}.free_moisture_pct == 12.60 and GypsumLot.${lot_id}.chloride_ppm == 250"
            - "GypsumLot.${lot_id}.version == 4 and GypsumLot.${lot_id}.version == ${lot_v_after_three}"
            - "GypsumLot.${lot_id}.remaining_tons == 300.000 and GypsumLot.${lot_id}.consumed_tons == 0.000"

      - name: outage_defer_repropose_cycle_unlocks_seasonality_gate
        grounds:
          - state_machines.MaintenanceOutage.PROPOSED_to_DEFERRED
          - state_machines.MaintenanceOutage.DEFERRED_to_PROPOSED
          - state_machines.MaintenanceOutage.PROPOSED_to_APPROVED
          - calculations.outage_seasonality_gate
          - errors[ERR_SEASONALITY_WINDOW_UNFAVORABLE]
        distinguishing_aspect: |
          The outage cycles PROPOSED -> DEFERRED -> PROPOSED twice, and the cycle itself changes the
          guard: the very same August window (seasonality_index 1.16 > the 0.90 ceiling) is refused
          with ERR_SEASONALITY_WINDOW_UNFAVORABLE at deferral_count 0 and approved at
          deferral_count 2, so the transition's admissibility depends on the loop counter rather
          than on the state pair.
        test_recipe:
          setup:
            - "Plant GYP-1 with LINE-1 AVAILABLE and no production runs on the line."
            - "PLANNED outage proposed by u_planner for 2026-08-20T06:00:00Z-2026-08-22T06:00:00Z (August index 1.16, 48.00 downtime hours, at_risk_msf 0.000)."
