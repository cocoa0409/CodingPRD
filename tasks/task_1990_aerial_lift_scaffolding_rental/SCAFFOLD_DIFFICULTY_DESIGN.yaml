# =============================================================================
# Task 1990 — Aerial Lift & Scaffolding Rental
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_segment_charge
        grounds:
          - calculations.rental_segment_charge
          - entities.RentalLine.fields.provisional_charge_cents
          - entities.RentalLine.fields.accrued_charge_cents
        distinguishing_aspect: |
          Same RentalLine and same rate card produce two different charges because the
          provisional_quote variant projects forward to requested_end_date + 1 day while
          final_settlement uses the actual elapsed on-rent interval; this dual variant
          lives in the RentalLine billing domain (the sibling instance lives in DamageClaim).
        test_recipe:
          setup:
            - "Class S19: daily 14500, weekly 43500, monthly 99000, min_rental_days 1, max height 25ft, AERIAL_LIFT"
            - "Unit AVAILABLE, inspection current (created at logical clock 2026-08-01)"
            - "Customer credit_limit_cents 10000000"
            - "Contract ACTIVE; one line, window 2026-08-10..2026-08-15, delivered at 2026-08-10T09:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: BranchManager
            - call: "POST /customer-accounts"
              payload: { company_name: "Pinnacle Builders", contact_email: "ops@pinnacle.example", credit_limit_cents: 10000000 }
              as: BranchManager
              captures: { cust_id: $.data.id }
            - call: "POST /equipment-classes"
              payload: { class_code: "S19", category: "AERIAL_LIFT", max_working_height_ft: 25, min_rental_days: 1, daily_rate_cents: 14500, weekly_rate_cents: 43500, monthly_rate_cents: 99000, replacement_value_cents: 2500000 }
              as: BranchManager
              captures: { class_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { class_id: "${class_id}", serial_number: "S19-0001", ansi_standard_ref: "ANSI A92.22" }
              as: BranchManager
              captures: { unit_id: $.data.id }
            - call: "POST /rental-contracts"
              payload: { customer_id: "${cust_id}", jobsite_address: "100 Main St", damage_waiver_elected: false }
              as: RentalCoordinator
              captures: { contract_id: $.data.id, cv: $.data.version }
            - call: "POST /rental-lines"
              payload: { contract_id: "${contract_id}", unit_id: "${unit_id}", requested_start_date: "2026-08-10", requested_end_date: "2026-08-15", required_working_height_ft: 20, expected_contract_version: "${cv}" }
              as: RentalCoordinator
              captures: { line_id: $.data.id }
            - call: "POST /rental-contracts/${contract_id}/activate"
              as: RentalCoordinator
            - call: "POST /delivery-trips"
              payload: { contract_id: "${contract_id}", line_id: "${line_id}", trip_type: "DELIVERY", driver_id: "drv-1", planned_start_utc: "2026-08-10T08:00:00Z", planned_end_utc: "2026-08-10T10:00:00Z" }
              as: RentalCoordinator
              captures: { trip_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: BranchManager
            - call: "POST /delivery-trips/${trip_id}/start"
              as: Driver
              as_user_id: "drv-1"
            - call: "POST /delivery-trips/${trip_id}/complete"
              payload: { standby_minutes: 0, crew_labor_hours: 0 }
              as: Driver
              as_user_id: "drv-1"
          trigger:
            - call: "GET /rental-contracts/${contract_id}/invoice"
              as: RentalCoordinator
              captures: { prov_rental: $.data.rental_subtotal_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-18T09:00:00Z" }
              as: BranchManager
            - call: "POST /rental-lines/${line_id}/off-rent"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { final_accrued: $.data.accrued_charge_cents, seg_count: $.data.segment_count }
          assert:
            - "provisional invoice rental_subtotal_cents == 43500 (projected end 2026-08-16T00:00:00Z minus on_rent 2026-08-10T09:00:00Z = 5d15h -> ceil 6 days -> min(14500*6=87000, 43500*1, 99000*1) = 43500)"
            - "after off-rent at exactly 8 elapsed days: RentalLine.accrued_charge_cents == 87000 (min(14500*8=116000, 43500*2=87000, 99000*1=99000))"
            - "RentalLine.segment_count == 1"
            - "provisional 43500 != final segment 87000 for identical rate card and line"

      - name: damage_waiver_vs_standard_chargeback
        grounds:
          - calculations.damage_chargeback
          - entities.DamageClaim.fields.chargeback_cents
          - entities.RentalContract.fields.damage_waiver_elected
        distinguishing_aspect: |
          Identical DAMAGE claims with identical repair estimates produce different
          chargebacks depending only on the contract's damage_waiver_elected flag
          (10% capped liability vs full estimate); this dual variant lives in the
          DamageClaim domain, a different entity domain than the RentalLine billing instance.
        test_recipe:
          setup:
            - "Class BOOM45: daily 20000, weekly 80000, monthly 240000, min_rental_days 4, height 51, replacement_value 4000000, AERIAL_LIFT"
            - "Two units AVAILABLE; one customer credit_limit 100000000"
            - "Contract A damage_waiver_elected=true with line LA OUT_ON_RENT on unit 1"
            - "Contract B damage_waiver_elected=false with line LB OUT_ON_RENT on unit 2"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: BranchManager
            - call: "POST /customer-accounts"
              payload: { company_name: "Ironworks LLC", contact_email: "ar@ironworks.example", credit_limit_cents: 100000000 }
              as: BranchManager
              captures: { cust_id: $.data.id }
            - call: "POST /equipment-classes"
              payload: { class_code: "BOOM45", category: "AERIAL_LIFT", max_working_height_ft: 51, min_rental_days: 4, daily_rate_cents: 20000, weekly_rate_cents: 80000, monthly_rate_cents: 240000, replacement_value_cents: 4000000 }
              as: BranchManager
              captures: { class_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { class_id: "${class_id}", serial_number: "BOOM45-001", ansi_standard_ref: "ANSI A92.20" }
              as: BranchManager
              captures: { unit1_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { class_id: "${class_id}", serial_number: "BOOM45-002", ansi_standard_ref: "ANSI A92.20" }
              as: BranchManager
              captures: { unit2_id: $.data.id }
            - call: "POST /rental-contracts"
              payload: { customer_id: "${cust_id}", jobsite_address: "10 Oak Ave", damage_waiver_elected: true }
              as: RentalCoordinator
              captures: { cA: $.data.id, cvA: $.data.version }
            - call: "POST /rental-lines"
              payload: { contract_id: "${cA}", unit_id: "${unit1_id}", requested_start_date: "2026-08-05", requested_end_date: "2026-08-20", required_working_height_ft: 40, expected_contract_version: "${cvA}" }
              as: RentalCoordinator
              captures: { lA: $.data.id }
            - call: "POST /rental-contracts/${cA}/activate"
              as: RentalCoordinator
            - call: "POST /delivery-trips"
              payload: { contract_id: "${cA}", line_id: "${lA}", trip_type: "DELIVERY", driver_id: "drv-1", planned_start_utc: "2026-08-05T08:00:00Z", planned_end_utc: "2026-08-05T10:00:00Z" }
              as: RentalCoordinator
              captures: { tA: $.data.id }
            - call: "POST /rental-contracts"
              payload: { customer_id: "${cust_id}", jobsite_address: "20 Pine Rd", damage_waiver_elected: false }
              as: RentalCoordinator
              captures: { cB: $.data.id, cvB: $.data.version }
            - call: "POST /rental-lines"
              payload: { contract_id: "${cB}", unit_id: "${unit2_id}", requested_start_date: "2026-08-05", requested_end_date: "2026-08-20", required_working_height_ft: 40, expected_contract_version: "${cvB}" }
              as: RentalCoordinator
              captures: { lB: $.data.id }
            - call: "POST /rental-contracts/${cB}/activate"
              as: RentalCoordinator
            - call: "POST /delivery-trips"
              payload: { contract_id: "${cB}", line_id: "${lB}", trip_type: "DELIVERY", driver_id: "drv-2", planned_start_utc: "2026-08-05T08:00:00Z", planned_end_utc: "2026-08-05T10:00:00Z" }
              as: RentalCoordinator
              captures: { tB: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: BranchManager
            - call: "POST /delivery-trips/${tA}/start"
              as: Driver
              as_user_id: "drv-1"
            - call: "POST /delivery-trips/${tA}/complete"
              payload: { standby_minutes: 0, crew_labor_hours: 0 }
              as: Driver
              as_user_id: "drv-1"
            - call: "POST /delivery-trips/${tB}/start"
              as: Driver
              as_user_id: "drv-2"
            - call: "POST /delivery-trips/${tB}/complete"
              payload: { standby_minutes: 0, crew_labor_hours: 0 }
              as: Driver
              as_user_id: "drv-2"
          trigger:
            - call: "POST /damage-claims"
              payload: { line_id: "${lA}", claim_type: "DAMAGE", description: "bent guardrail" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claimA: $.data.id }
            - call: "POST /damage-claims/${claimA}/assess"
              payload: { repair_estimate_cents: 50000 }
              as: BranchManager
            - call: "POST /damage-claims/${claimA}/charge"
              as: BranchManager
              captures: { cbA: $.data.chargeback_cents }
            - call: "POST /damage-claims"
              payload: { line_id: "${lB}", claim_type: "DAMAGE", description: "bent guardrail" }
              as: RentalCoordinator
              captures: { claimB: $.data.id }
            - call: "POST /damage-claims/${claimB}/assess"
              payload: { repair_estimate_cents: 50000 }
              as: BranchManager
            - call: "POST /damage-claims/${claimB}/charge"
              as: BranchManager
              captures: { cbB: $.data.chargeback_cents }
          assert:
            - "claim A chargeback_cents == 5000 (waiver elected: round_half_up(0.10 * 50000))"
            - "claim B chargeback_cents == 50000 (standard liability: full estimate)"
            - "identical claim inputs produce chargebacks differing by exactly 45000, driven solely by damage_waiver_elected"
            - "contract A damage_subtotal_cents == 5000; contract B damage_subtotal_cents == 50000"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes: (a) tiered selection, (b) nested rounding)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: best_rate_tier_selection
        grounds:
          - calculations.rental_segment_charge
          - calculations.billable_days
        distinguishing_aspect: |
          Mode (a): a >=3-input formula with non-linear interaction — billable days,
          three rate tiers, and nested min()/ceil() tier selection — where the winning
          tier flips with duration (8 days prices as 2 weekly blocks, beating 8 daily
          charges and 1 monthly block).
        test_recipe:
          setup:
            - "Class S32: daily 12000, weekly 40000, monthly 150000, min_rental_days 1, height 38, AERIAL_LIFT"
            - "Unit AVAILABLE; customer credit_limit 10000000"
            - "Contract ACTIVE; line window 2026-08-10..2026-08-20; delivered 2026-08-10T09:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: BranchManager
            - call: "POST /customer-accounts"
              payload: { company_name: "Skyline Contractors", contact_email: "pm@skyline.example", credit_limit_cents: 10000000 }
              as: BranchManager
              captures: { cust_id: $.data.id }
            - call: "POST /equipment-classes"
              payload: { class_code: "S32", category: "AERIAL_LIFT", max_working_height_ft: 38, min_rental_days: 1, daily_rate_cents: 12000, weekly_rate_cents: 40000, monthly_rate_cents: 150000, replacement_value_cents: 3000000 }
              as: BranchManager
              captures: { class_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { class_id: "${class_id}", serial_number: "S32-0001", ansi_standard_ref: "ANSI A92.22" }
              as: BranchManager
              captures: { unit_id: $.data.id }
            - call: "POST /rental-contracts"
              payload: { customer_id: "${cust_id}", jobsite_address: "5 Elm St", damage_waiver_elected: false }
              as: RentalCoordinator
              captures: { contract_id: $.data.id, cv: $.data.version }
            - call: "POST /rental-lines"
              payload: { contract_id: "${contract_id}", unit_id: "${unit_id}", requested_start_date: "2026-08-10", requested_end_date: "2026-08-20", required_working_height_ft: 30, expected_contract_version: "${cv}" }
              as: RentalCoordinator
              captures: { line_id: $.data.id }
            - call: "POST /rental-contracts/${contract_id}/activate"
              as: RentalCoordinator
            - call: "POST /delivery-trips"
              payload: { contract_id: "${contract_id}", line_id: "${line_id}", trip_type: "DELIVERY", driver_id: "drv-1", planned_start_utc: "2026-08-10T08:00:00Z", planned_end_utc: "2026-08-10T10:00:00Z" }
              as: RentalCoordinator
              captures: { trip_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: BranchManager
            - call: "POST /delivery-trips/${trip_id}/start"
              as: Driver
              as_user_id: "drv-1"
            - call: "POST /delivery-trips/${trip_id}/complete"
              payload: { standby_minutes: 0, crew_labor_hours: 0 }
              as: Driver
              as_user_id: "drv-1"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-18T09:00:00Z" }
              as: BranchManager
            - call: "POST /rental-lines/${line_id}/off-rent"
              as: RentalCoordinator
              captures: { accrued: $.data.accrued_charge_cents }
          assert:
            - "RentalLine.accrued_charge_cents == 80000 (8 billable days: daily 12000*8=96000 loses, weekly 40000*ceil(8/7)=80000 wins, monthly 150000*1=150000 loses)"
            - "the winning tier is weekly, proving nested min/ceil tier selection (not flat daily multiplication)"

      - name: per_claim_rounding_then_sum
        grounds:
          - calculations.contract_invoice_total
          - calculations.damage_chargeback
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — each claim's 10% waiver
          chargeback is rounded half-up to integer cents PER CLAIM at charge time and
          the invoice sums stored integers; aggregate sum-then-round of raw percentages
          would yield a different cent total (6667 vs 6668). Distinct mode from the
          tiered-selection instance.
        test_recipe:
          setup:
            - "Class CTLG: daily 10000, weekly 70000, monthly 200000, min_rental_days 1, height 30, AERIAL_LIFT"
            - "Two units; customer credit_limit 100000000; waiver-elected contract ACTIVE"
            - "Lines L1 (unit 1) and L2 (unit 2), both window 2026-08-05..2026-08-06, both delivered 2026-08-05T09:00:00Z and off-rent 2026-08-06T09:00:00Z (1 billable day each -> 10000 each)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: BranchManager
            - call: "POST /customer-accounts"
              payload: { company_name: "Delta Framing", contact_email: "ap@delta.example", credit_limit_cents: 100000000 }
              as: BranchManager
              captures: { cust_id: $.data.id }
            - call: "POST /equipment-classes"
              payload: { class_code: "CTLG", category: "AERIAL_LIFT", max_working_height_ft: 30, min_rental_days: 1, daily_rate_cents: 10000, weekly_rate_cents: 70000, monthly_rate_cents: 200000, replacement_value_cents: 2000000 }
              as: BranchManager
              captures: { class_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { class_id: "${class_id}", serial_number: "CTLG-001", ansi_standard_ref: "ANSI A92.22" }
              as: BranchManager
              captures: { unit1_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { class_id: "${class_id}", serial_number: "CTLG-002", ansi_standard_ref: "ANSI A92.22" }
              as: BranchManager
              captures: { unit2_id: $.data.id }
            - call: "POST /rental-contracts"
              payload: { customer_id: "${cust_id}", jobsite_address: "77 Commerce Dr", damage_waiver_elected: true }
              as: RentalCoordinator
              captures: { cW: $.data.id, cvW: $.data.version }
            - call: "POST /rental-lines"
              payload: { contract_id: "${cW}", unit_id: "${unit1_id}", requested_start_date: "2026-08-05", requested_end_date: "2026-08-06", required_working_height_ft: 25, expected_contract_version: "${cvW}" }
              as: RentalCoordinator
              captures: { l1: $.data.id }
            - call: "GET /rental-contracts/${cW}"
              as: RentalCoordinator
              captures: { cvW2: $.data.version }
            - call: "POST /rental-lines"
              payload: { contract_id: "${cW}", unit_id: "${unit2_id}", requested_start_date: "2026-08-05", requested_end_date: "2026-08-06", required_working_height_ft: 25, expected_contract_version: "${cvW2}" }
              as: RentalCoordinator
              captures: { l2: $.data.id }
            - call: "POST /rental-contracts/${cW}/activate"
              as: RentalCoordinator
            - call: "POST /delivery-trips"
              payload: { contract_id: "${cW}", line_id: "${l1}", trip_type: "DELIVERY", driver_id: "drv-1", planned_start_utc: "2026-08-05T08:00:00Z", planned_end_utc: "2026-08-05T10:00:00Z" }
              as: RentalCoordinator
              captures: { t1: $.data.id }
            - call: "POST /delivery-trips"
              payload: { contract_id: "${cW}", line_id: "${l2}", trip_type: "DELIVERY", driver_id: "drv-2", planned_start_utc: "2026-08-05T08:00:00Z", planned_end_utc: "2026-08-05T10:00:00Z" }
              as: RentalCoordinator
              captures: { t2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: BranchManager
            - call: "POST /delivery-trips/${t1}/start"
              as: Driver
              as_user_id: "drv-1"
            - call: "POST /delivery-trips/${t1}/complete"
              payload: { standby_minutes: 0, crew_labor_hours: 0 }
              as: Driver
              as_user_id: "drv-1"
            - call: "POST /delivery-trips/${t2}/start"
              as: Driver
              as_user_id: "drv-2"
            - call: "POST /delivery-trips/${t2}/complete"
              payload: { standby_minutes: 0, crew_labor_hours: 0 }
              as: Driver
              as_user_id: "drv-2"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T09:00:00Z" }
              as: BranchManager
            - call: "POST /rental-lines/${l1}/off-rent"
              as: RentalCoordinator
            - call: "POST /rental-lines/${l2}/off-rent"
              as: RentalCoordinator
          trigger:
            - call: "POST /damage-claims"
              payload: { line_id: "${l1}", claim_type: "DAMAGE", description: "deck bent" }
              as: RentalCoordinator
              captures: { cl1: $.data.id }
            - call: "POST /damage-claims/${cl1}/assess"
              payload: { repair_estimate_cents: 33335 }
              as: BranchManager
            - call: "POST /damage-claims/${cl1}/charge"
              as: BranchManager
              captures: { cb1: $.data.chargeback_cents }
            - call: "POST /damage-claims"
              payload: { line_id: "${l2}", claim_type: "DAMAGE", description: "deck bent" }
              as: RentalCoordinator
              captures: { cl2: $.data.id }
            - call: "POST /damage-claims/${cl2}/assess"
              payload: { repair_estimate_cents: 33335 }
              as: BranchManager
            - call: "POST /damage-claims/${cl2}/charge"
              as: BranchManager
              captures: { cb2: $.data.chargeback_cents }
            - call: "GET /rental-contracts/${cW}/invoice"
              as: RentalCoordinator
              captures: { inv_dmg: $.data.damage_subtotal_cents, inv_total: $.data.invoice_total_cents }
          assert:
            - "claim 1 chargeback_cents == 3334 (round_half_up(0.10 * 33335) = round_half_up(3333.5) per claim)"
            - "claim 2 chargeback_cents == 3334"
            - "invoice damage_subtotal_cents == 6668 (per-claim rounding then sum; aggregate sum-then-round would give 6667)"
            - "invoice invoice_total_cents == 56668 (rental 20000 + logistics 2*15000=30000 + damage 6668)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: line_off_rent_re_rent_cycle
        grounds:
          - state_machines.RentalLine.OUT_ON_RENT_to_OFF_RENT
          - state_machines.RentalLine.OFF_RENT_to_OUT_ON_RENT
          - state_machines.DeliveryTrip.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          RentalLine's machine is cyclic: OUT_ON_RENT -> OFF_RENT -> OUT_ON_RENT loops
          via re-rent, each pass finalizing a distinct billable segment; the sibling
          instance exercises a cyclic machine on a different entity (DamageClaim).
        test_recipe:
          setup:
            - "Class S19C: daily 14500, weekly 43500, monthly 99000, min 1, height 25, AERIAL_LIFT"
            - "Contract ACTIVE; line window 2026-08-10..2026-08-31 delivered 2026-08-10T09:00:00Z -> OUT_ON_RENT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: BranchManager
            - call: "POST /customer-accounts"
              payload: { company_name: "Anchor GC", contact_email: "rentals@anchor.example", credit_limit_cents: 10000000 }
              as: BranchManager
              captures: { cust_id: $.data.id }
            - call: "POST /equipment-classes"
              payload: { class_code: "S19C", category: "AERIAL_LIFT", max_working_height_ft: 25, min_rental_days: 1, daily_rate_cents: 14500, weekly_rate_cents: 43500, monthly_rate_cents: 99000, replacement_value_cents: 2500000 }
              as: BranchManager
              captures: { class_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { class_id: "${class_id}", serial_number: "S19C-001", ansi_standard_ref: "ANSI A92.22" }
              as: BranchManager
              captures: { unit_id: $.data.id }
            - call: "POST /rental-contracts"
              payload: { customer_id: "${cust_id}", jobsite_address: "9 Harbor Blvd", damage_waiver_elected: false }
              as: RentalCoordinator
              captures: { contract_id: $.data.id, cv: $.data.version }
            - call: "POST /rental-lines"
              payload: { contract_id: "${contract_id}", unit_id: "${unit_id}", requested_start_date: "2026-08-10", requested_end_date: "2026-08-31", required_working_height_ft: 20, expected_contract_version: "${cv}" }
              as: RentalCoordinator
              captures: { line_id: $.data.id }
            - call: "POST /rental-contracts/${contract_id}/activate"
              as: RentalCoordinator
            - call: "POST /delivery-trips"
