              captures: { tool: "$.data.id" }
            - call: "POST /compliance/price-comparison-tools/${tool}/launch"
              payload: {}
              as: PlanSponsorAdmin
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-07-01T09:00:00Z" }
              as: PlatformOperator
