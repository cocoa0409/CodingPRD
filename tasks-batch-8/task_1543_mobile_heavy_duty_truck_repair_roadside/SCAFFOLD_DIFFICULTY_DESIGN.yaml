            - "pu_status == RETURNED and onhand_after == 10 (post + return conserves qty_on_hand)"
            - "inv_parts == 0 and inv_tax == 0 (no POSTED CUSTOMER_PAY usage survives; invoice shows no parts drift)"

      - name: payment_post_then_void_restores_invoice_outstanding
