              as: TrialAgronomist
              captures: { site_id: $.data.id }
            - call: "POST /trial-series"
              payload: { program_id: "${prog_id}", stage: "STAGE_1", season_year: 2027, plot_design: "RCBD", replication_count: 4, min_locations: 1 }
              as: TrialAgronomist
              captures: { series_id: $.data.id }
          trigger:
            - call: "POST /trial-series/${series_id}/entries"
              payload: { line_id: "00000000-0000-0000-0000-0000000000ff", trial_site_id: "00000000-0000-0000-0000-0000000000ff", plot_count: 8, planting_window_start: "2027-04-01", planting_window_end: "2027-08-31" }
              as: TrialAgronomist
            - call: "POST /trial-series/${series_id}/entries"
              payload: { line_id: "${line_id}", trial_site_id: "00000000-0000-0000-0000-0000000000ff", plot_count: 8, planting_window_start: "2027-04-01", planting_window_end: "2027-08-31" }
