# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml
# Machine-readable index of every difficulty feature SCAFFOLD.yaml claims.
# Nine rule_ids, 28 instances. Every numeric literal in an `assert:` line was
# executed against the declared formula and its constants before being written.
# Default logical clock before any /_clock/set_current_utc call: 2026-08-01T00:00:00Z.
# Canonical chemicals used throughout:
#   Bisphenol A / 80-05-7 / REPRODUCTIVE_FEMALE / MADL 0.5 ug per day
#   Benzene     / 71-43-2 / CANCER              / NSRL 6.4 ug per day
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 - dual_variant_calc
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: modeled_vs_lab_tested_diverge_on_incomplete_disclosure
        grounds:
          - calculations.effective_concentration_ppm
          - calculations.daily_exposure_ug
          - calculations.safe_harbor_verdict
          - entities.ExposureAssessment.fields.method
          - entities.Material.fields.disclosure_status
          - state_machines.Material.REQUESTED_to_INCOMPLETE
          - state_machines.MaterialChemical.TEST_REQUESTED_to_TEST_REPORTED
        distinguishing_aspect: |
          Divergence driver is the supplier-disclosure gap: on identical stored rows the MODELED
          variant substitutes MODELED_DEFAULT_PPM (250.0) because the material sits in INCOMPLETE,
          while the LAB_TESTED variant ignores disclosure_status entirely and reads lab_result_ppm
          40.0, so daily_exposure_ug is 3.125 versus 0.500 - a 6.25x gap on the same component.
        test_recipe:
          setup:
            - "Bisphenol A is LISTED with MADL safe harbor 0.5 ug/day."
            - "Material RM-100 carries a declared Bisphenol A concentration of 40.0 ppm and its disclosure_status is INCOMPLETE (supplier answered, answer incomplete)."
            - "The same MaterialChemical link has been lab tested: lab_result_ppm 40.0, lab_loq_ppm 1.0, measurement_basis LAB_TESTED, status TEST_REPORTED."
            - "Product SKU-DV1 has exactly one ACTIVE component of RM-100 with quantity_grams_per_unit 0.25 and contact_factor 0.5."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Bisphenol A", cas_number: "80-05-7", endpoint_type: "REPRODUCTIVE_FEMALE", safe_harbor_basis: "MADL", safe_harbor_level_ug_per_day: 0.5 }
              as: RegistryAdmin
              captures: { chem_bpa: $.data.id }
            - call: "POST /listed-chemicals/${chem_bpa}/transitions"
              payload: { action: "LIST", listing_effective_date: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /suppliers"
              payload: { legal_name: "Northgate Polymers", contact_email: "qa@northgate.example" }
              as: ComplianceAnalyst
              captures: { sup_1: $.data.id }
            - call: "POST /materials"
              payload: { material_code: "RM-100", material_class: "RAW_MATERIAL", supplier_id: "${sup_1}" }
              as: ComplianceAnalyst
              captures: { mat_1: $.data.id }
            - call: "POST /materials/${mat_1}/chemicals"
              payload: { chemical_id: "${chem_bpa}", declared_concentration_ppm: 40.0 }
              as: ComplianceAnalyst
              captures: { link_1: $.data.id }
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "REQUEST" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "RECORD_RESPONSE", response_completeness: "INCOMPLETE" }
              as: ComplianceAnalyst
            - call: "POST /material-chemicals/${link_1}/transitions"
              payload: { action: "REQUEST_TEST" }
              as: ComplianceAnalyst
            - call: "POST /material-chemicals/${link_1}/transitions"
              payload: { action: "REPORT_RESULT", lab_name: "Cascade Analytical", lab_result_ppm: 40.0, lab_loq_ppm: 1.0 }
              as: ComplianceAnalyst
            - call: "POST /products"
              payload: { sku: "SKU-DV1", product_name: "Grip Trainer", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 50000 }
              as: RegistryAdmin
              captures: { prod_1: $.data.id }
            - call: "POST /products/${prod_1}/components"
              payload: { material_id: "${mat_1}", quantity_grams_per_unit: 0.25, contact_factor: 0.5 }
              as: ComplianceAnalyst
              captures: { comp_1: $.data.id }
          trigger:
            - call: "POST /products/${prod_1}/exposure-assessments"
              payload: { chemical_id: "${chem_bpa}", method: "MODELED", route: "DERMAL", uses_per_day: 1.0 }
              as: ComplianceAnalyst
              as_user_id: "ca_1"
              captures: { asmt_modeled: $.data.id }
            - call: "POST /products/${prod_1}/exposure-assessments"
              payload: { chemical_id: "${chem_bpa}", method: "LAB_TESTED", route: "DERMAL", uses_per_day: 1.0 }
              as: ComplianceAnalyst
              as_user_id: "ca_1"
              captures: { asmt_lab: $.data.id }
          assert:
            - "ExposureAssessment.${asmt_modeled}.daily_exposure_ug == 3.125"
            - "ExposureAssessment.${asmt_modeled}.margin_ratio == 6.25"
            - "ExposureAssessment.${asmt_modeled}.result == AT_OR_ABOVE_SAFE_HARBOR"
            - "ExposureAssessment.${asmt_modeled}.contribution_count == 1"
            - "ExposureAssessment.${asmt_lab}.daily_exposure_ug == 0.5"
            - "ExposureAssessment.${asmt_lab}.margin_ratio == 1.0"
            - "ExposureAssessment.${asmt_lab}.result == AT_OR_ABOVE_SAFE_HARBOR"
            - "ExposureAssessment.${asmt_lab}.contribution_count == 1"
            - "ExposureAssessment.${asmt_modeled}.daily_exposure_ug != ExposureAssessment.${asmt_lab}.daily_exposure_ug"
            - "MaterialChemical.${link_1}.measurement_basis == LAB_TESTED and Material.${mat_1}.disclosure_status == INCOMPLETE (neither row differs between the two assessments)"

      - name: modeled_half_loq_vs_lab_tested_zero_on_non_detect
        grounds:
          - calculations.effective_concentration_ppm
          - calculations.daily_exposure_ug
          - entities.MaterialChemical.fields.lab_loq_ppm
          - entities.ExposureAssessment.fields.contribution_count
          - state_machines.MaterialChemical.TEST_REQUESTED_to_TEST_REPORTED
        distinguishing_aspect: |
          Divergence driver is the non-detect substitution rule, not a disclosure gap: with
          lab_result_ppm 4.0 below lab_loq_ppm 8.0 the MODELED variant uses lab_loq_ppm / 2 = 4.0
          and counts the component (daily_exposure_ug 0.050, contribution_count 1) while the
          LAB_TESTED variant uses 0.0 and drops the component entirely (0.000,
          contribution_count 0) - the observable difference is the COUNT, not only the magnitude.
        test_recipe:
          setup:
            - "Bisphenol A is LISTED with MADL safe harbor 0.5 ug/day."
            - "Material RM-200 disclosure_status is VERIFIED, so no worst-case substitution applies to either variant."
            - "Its Bisphenol A link is on measurement_basis LAB_TESTED with lab_result_ppm 4.0 strictly below lab_loq_ppm 8.0 (a non-detect)."
            - "Product SKU-DV3 has exactly one ACTIVE component of RM-200, quantity 0.25 g/unit, contact_factor 0.5."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Bisphenol A", cas_number: "80-05-7", endpoint_type: "REPRODUCTIVE_FEMALE", safe_harbor_basis: "MADL", safe_harbor_level_ug_per_day: 0.5 }
              as: RegistryAdmin
              captures: { chem_bpa: $.data.id }
            - call: "POST /listed-chemicals/${chem_bpa}/transitions"
              payload: { action: "LIST", listing_effective_date: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /suppliers"
              payload: { legal_name: "Basalt Coatings", contact_email: "lab@basalt.example" }
              as: ComplianceAnalyst
              captures: { sup_1: $.data.id }
            - call: "POST /materials"
              payload: { material_code: "RM-200", material_class: "RAW_MATERIAL", supplier_id: "${sup_1}" }
              as: ComplianceAnalyst
              captures: { mat_1: $.data.id }
            - call: "POST /materials/${mat_1}/chemicals"
              payload: { chemical_id: "${chem_bpa}", declared_concentration_ppm: 40.0 }
              as: ComplianceAnalyst
              captures: { link_1: $.data.id }
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "REQUEST" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "RECORD_RESPONSE", response_completeness: "COMPLETE" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "VERIFY" }
              as: ComplianceAnalyst
            - call: "POST /material-chemicals/${link_1}/transitions"
              payload: { action: "REQUEST_TEST" }
              as: ComplianceAnalyst
            - call: "POST /material-chemicals/${link_1}/transitions"
              payload: { action: "REPORT_RESULT", lab_name: "Cascade Analytical", lab_result_ppm: 4.0, lab_loq_ppm: 8.0 }
              as: ComplianceAnalyst
            - call: "POST /products"
              payload: { sku: "SKU-DV3", product_name: "Shelf Liner", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 50000 }
              as: RegistryAdmin
              captures: { prod_1: $.data.id }
            - call: "POST /products/${prod_1}/components"
              payload: { material_id: "${mat_1}", quantity_grams_per_unit: 0.25, contact_factor: 0.5 }
              as: ComplianceAnalyst
          trigger:
            - call: "POST /products/${prod_1}/exposure-assessments"
              payload: { chemical_id: "${chem_bpa}", method: "MODELED", route: "DERMAL", uses_per_day: 1.0 }
              as: ComplianceAnalyst
              as_user_id: "ca_1"
              captures: { asmt_modeled: $.data.id }
            - call: "POST /products/${prod_1}/exposure-assessments"
              payload: { chemical_id: "${chem_bpa}", method: "LAB_TESTED", route: "DERMAL", uses_per_day: 1.0 }
              as: ComplianceAnalyst
              as_user_id: "ca_1"
              captures: { asmt_lab: $.data.id }
          assert:
            - "ExposureAssessment.${asmt_modeled}.daily_exposure_ug == 0.05"
            - "ExposureAssessment.${asmt_modeled}.margin_ratio == 0.1"
            - "ExposureAssessment.${asmt_modeled}.result == BELOW_SAFE_HARBOR"
            - "ExposureAssessment.${asmt_modeled}.contribution_count == 1"
            - "ExposureAssessment.${asmt_lab}.daily_exposure_ug == 0.0"
            - "ExposureAssessment.${asmt_lab}.margin_ratio == 0.0"
            - "ExposureAssessment.${asmt_lab}.result == BELOW_SAFE_HARBOR"
            - "ExposureAssessment.${asmt_lab}.contribution_count == 0"

      - name: defense_score_as_of_today_vs_as_of_service_date
        grounds:
          - calculations.defense_strength_score
          - entities.Supplier.fields.warranty_effective_from
          - entities.Material.fields.data_received_at
          - entities.ExposureAssessment.fields.finalized_at
          - entities.WarningPlacement.fields.effective_from
          - state_machines.Supplier.NONE_to_ACTIVE
          - state_machines.WarningPlacement.IMPLEMENTED_to_VERIFIED
        distinguishing_aspect: |
          Second dual-variant calculation lives in a different entity domain (recordkeeping /
          defense file on Product, not exposure on ExposureAssessment) and its divergence driver is
          a time cut-off rather than a data-substitution rule: identical stored rows score 100
          under AS_OF_TODAY and exactly 20 under AS_OF_SERVICE_DATE, because the placement became
          effective 2026-06-01, the assessment was finalized 2026-07-15 and the disclosure landed
          2026-07-10 - all after the notice served_at of 2026-05-01 - while only the warranty
          window (open-ended from 2026-01-01) straddles both instants.
        test_recipe:
          setup:
            - "Supplier Northgate Polymers holds an ACTIVE warranty, scope ALL_MATERIALS, pass_through_warning_obligation true, effective from 2026-01-01 with no end date."
            - "Material RM-100 disclosure_status is VERIFIED and its data_received_at is 2026-07-10T00:00:00Z."
            - "Product SKU-DEF1 sells only through RETAIL, so its determination's required_channels is exactly [LABEL]."
            - "Its one FINAL exposure assessment was finalized at 2026-07-15T00:00:00Z with daily_exposure_ug 0.500 (AT_OR_ABOVE_SAFE_HARBOR)."
            - "The APPROVED determination's single LABEL placement is VERIFIED and effective from 2026-06-01T00:00:00Z with no end date."
            - "A private-party notice was served at 2026-05-01T00:00:00Z, before every piece of that evidence existed."
            - "The logical clock is back at 2026-08-01T00:00:00Z when both reads are taken."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Bisphenol A", cas_number: "80-05-7", endpoint_type: "REPRODUCTIVE_FEMALE", safe_harbor_basis: "MADL", safe_harbor_level_ug_per_day: 0.5 }
              as: RegistryAdmin
              captures: { chem_bpa: $.data.id }
            - call: "POST /listed-chemicals/${chem_bpa}/transitions"
              payload: { action: "LIST", listing_effective_date: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /suppliers"
              payload: { legal_name: "Northgate Polymers", contact_email: "qa@northgate.example", warranty_scope: "ALL_MATERIALS", pass_through_warning_obligation: true, indemnity_cap_cents: 500000000, warranty_effective_from: "2026-01-01T00:00:00Z" }
              as: ComplianceAnalyst
              captures: { sup_1: $.data.id }
            - call: "POST /suppliers/${sup_1}/transitions"
              payload: { action: "EXECUTE_WARRANTY" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "POST /materials"
              payload: { material_code: "RM-100", material_class: "RAW_MATERIAL", supplier_id: "${sup_1}" }
              as: ComplianceAnalyst
              captures: { mat_1: $.data.id }
            - call: "POST /materials/${mat_1}/chemicals"
              payload: { chemical_id: "${chem_bpa}", declared_concentration_ppm: 40.0 }
              as: ComplianceAnalyst
              captures: { link_1: $.data.id }
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "REQUEST" }
              as: ComplianceAnalyst
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "RECORD_RESPONSE", response_completeness: "COMPLETE" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "VERIFY" }
              as: ComplianceAnalyst
            - call: "POST /products"
              payload: { sku: "SKU-DEF1", product_name: "Cabinet Pull", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 50000 }
              as: RegistryAdmin
              captures: { prod_1: $.data.id }
            - call: "POST /products/${prod_1}/components"
              payload: { material_id: "${mat_1}", quantity_grams_per_unit: 0.25, contact_factor: 0.5 }
              as: ComplianceAnalyst
            - call: "POST /products/${prod_1}/exposure-assessments"
              payload: { chemical_id: "${chem_bpa}", method: "MODELED", route: "DERMAL", uses_per_day: 1.0 }
              as: ComplianceAnalyst
              as_user_id: "ca_1"
              captures: { asmt_1: $.data.id }
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "SUBMIT" }
              as: ComplianceAnalyst
              as_user_id: "ca_1"
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "PEER_REVIEW" }
              as: ToxicologyReviewer
              as_user_id: "tox_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-15T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "FINALIZE" }
              as: ToxicologyReviewer
              as_user_id: "tox_1"
            - call: "GET /products/${prod_1}"
              payload: {}
              as: ComplianceAnalyst
              captures: { pv_1: $.data.version }
            - call: "POST /warning-determinations"
              payload: { product_id: "${prod_1}", assessment_id: "${asmt_1}", decision: "WARNING_REQUIRED", expected_product_version: "${pv_1}" }
              as: LabelingSpecialist
              as_user_id: "ls_1"
              captures: { det_1: $.data.id }
            - call: "POST /warning-determinations/${det_1}/transitions"
              payload: { action: "SUBMIT_FOR_APPROVAL" }
              as: LabelingSpecialist
              as_user_id: "ls_1"
            - call: "POST /warning-determinations/${det_1}/transitions"
              payload: { action: "APPROVE" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "POST /warning-determinations/${det_1}/placements"
              payload: { channel: "LABEL", effective_from: "2026-06-01T00:00:00Z", placement_detail: "Back panel warning block" }
              as: LabelingSpecialist
              as_user_id: "ls_1"
              captures: { plc_1: $.data.id }
            - call: "POST /warning-placements/${plc_1}/transitions"
              payload: { action: "IMPLEMENT" }
              as: LabelingSpecialist
              as_user_id: "ls_1"
            - call: "POST /warning-placements/${plc_1}/transitions"
              payload: { action: "VERIFY" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "POST /notices"
              payload: { product_id: "${prod_1}", chemical_id: "${chem_bpa}", noticing_party_name: "Coastal Compliance Group", noticing_party_type: "PRIVATE_PARTY", alleged_violation_type: "FAILURE_TO_WARN", alleged_units: 4000, earliest_violation_date: "2026-04-01T00:00:00Z", served_at: "2026-05-01T00:00:00Z" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
              captures: { nov_1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
          trigger:
            - call: "GET /products/${prod_1}/compliance-summary"
              payload: {}
              as: ComplianceAnalyst
              captures: { score_today: $.data.defense_strength_score }
            - call: "GET /products/${prod_1}/compliance-summary"
              payload: { as_of_notice_id: "${nov_1}" }
              as: ComplianceAnalyst
              captures: { score_service: $.data.defense_strength_score }
          assert:
            - "first read: variant == AS_OF_TODAY and as_of == 2026-08-01T00:00:00Z"
            - "first read: defense_strength_score == 100"
            - "first read: warning_evidence == 1.0 and assessment_evidence == 1.0 and warranty_evidence == 1.0 and recordkeeping_evidence == 1.0"
            - "first read: required_channel_count == 1 and covered_channel_count == 1 and verified_channel_count == 1"
            - "first read: final_assessment_count == 1 and verified_material_count == 1 and active_component_count == 1"
            - "second read: variant == AS_OF_SERVICE_DATE and as_of == 2026-05-01T00:00:00Z"
            - "second read: defense_strength_score == 20"
            - "second read: warning_evidence == 0.0 and assessment_evidence == 0.0 and warranty_evidence == 1.0 and recordkeeping_evidence == 0.0"
            - "second read: required_channel_count == 1 and covered_channel_count == 0 and verified_channel_count == 0"
            - "second read: final_assessment_count == 0 and active_component_count == 1"

  # ===========================================================================
  # RULE 2 - combinatorial_formula
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: exposure_rounding_order_pinned_per_component
        grounds:
          - calculations.daily_exposure_ug
          - calculations.safe_harbor_verdict
          - entities.ProductComponent.fields.contact_factor
        distinguishing_aspect: |
          Multi-step formula whose pinned evaluation ORDER is observable: two components each
          contributing raw 1.2345 ug must be rounded to 3 decimals first (1.235 each) and only then
          summed, giving daily_exposure_ug 2.470; the forbidden order (sum raw 2.469, round once)
          differs in the third decimal, so a single equality assert falsifies the wrong order.
        test_recipe:
          setup:
            - "Bisphenol A is LISTED with MADL safe harbor 0.5 ug/day."
            - "Two materials RM-A and RM-B each declare Bisphenol A at exactly 12.345 ppm and each has disclosure_status VERIFIED (so effective_concentration_ppm equals the declared value for both)."
            - "Product SKU-CF1 has two ACTIVE components, one per material, each with quantity_grams_per_unit 0.1 and contact_factor 1.0."
            - "The assessment route is ORAL (absorption 1.0) with uses_per_day 1.0, so each component's raw contribution is exactly 12.345 * 0.1 * 1.0 * 1.0 * 1.0 = 1.2345."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Bisphenol A", cas_number: "80-05-7", endpoint_type: "REPRODUCTIVE_FEMALE", safe_harbor_basis: "MADL", safe_harbor_level_ug_per_day: 0.5 }
              as: RegistryAdmin
              captures: { chem_bpa: $.data.id }
            - call: "POST /listed-chemicals/${chem_bpa}/transitions"
              payload: { action: "LIST", listing_effective_date: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /suppliers"
              payload: { legal_name: "Northgate Polymers", contact_email: "qa@northgate.example" }
              as: ComplianceAnalyst
              captures: { sup_1: $.data.id }
            - call: "POST /materials"
              payload: { material_code: "RM-A", material_class: "RAW_MATERIAL", supplier_id: "${sup_1}" }
              as: ComplianceAnalyst
              captures: { mat_a: $.data.id }
            - call: "POST /materials/${mat_a}/chemicals"
              payload: { chemical_id: "${chem_bpa}", declared_concentration_ppm: 12.345 }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_a}/disclosure"
              payload: { action: "REQUEST" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_a}/disclosure"
              payload: { action: "RECORD_RESPONSE", response_completeness: "COMPLETE" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_a}/disclosure"
              payload: { action: "VERIFY" }
              as: ComplianceAnalyst
            - call: "POST /materials"
              payload: { material_code: "RM-B", material_class: "RAW_MATERIAL", supplier_id: "${sup_1}" }
              as: ComplianceAnalyst
              captures: { mat_b: $.data.id }
            - call: "POST /materials/${mat_b}/chemicals"
              payload: { chemical_id: "${chem_bpa}", declared_concentration_ppm: 12.345 }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_b}/disclosure"
              payload: { action: "REQUEST" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_b}/disclosure"
              payload: { action: "RECORD_RESPONSE", response_completeness: "COMPLETE" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_b}/disclosure"
              payload: { action: "VERIFY" }
              as: ComplianceAnalyst
            - call: "POST /products"
              payload: { sku: "SKU-CF1", product_name: "Blend Cup", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 50000 }
              as: RegistryAdmin
              captures: { prod_1: $.data.id }
            - call: "POST /products/${prod_1}/components"
              payload: { material_id: "${mat_a}", quantity_grams_per_unit: 0.1, contact_factor: 1.0 }
              as: ComplianceAnalyst
            - call: "POST /products/${prod_1}/components"
              payload: { material_id: "${mat_b}", quantity_grams_per_unit: 0.1, contact_factor: 1.0 }
              as: ComplianceAnalyst
          trigger:
