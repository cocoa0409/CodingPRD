      - name: immediate_read_after_write_colony
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, "endpoints.GET /api/colonies/{id}"]
        distinguishing_aspect: "Immediate consistency: a colony read in the very next request reflects every creation input plus system defaults (FOUNDING, CLEAR, generation_number 0, snp_panel_interval_weeks 12, last_snp_panel_at at the creation clock)."
        test_recipe:
          setup:
            - "REGISTERED facility, VF room, strain, APPROVED protocol"
          setup_api_calls:
            - call: "POST /api/facilities"
              payload: { name: "Site Alpha", site_code: "SA", registration_number: "REG-001", registration_expires_at: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /api/rooms"
              payload: { facility_id: "${fac_id}", room_code: "R1", barrier_level: "VF", excluded_agents: ["MHV", "MPV"], cage_capacity: 100 }
              as: FacilityManager
              captures: { room_id: $.data.id }
            - call: "POST /api/strains"
              payload: { strain_code: "C57BL6J", species: "MOUSE", immune_class: "IMMUNOCOMPETENT", breeding_type: "INBRED", min_barrier_level: "MPF", gestation_days: 21, wean_age_days: 21, typical_litter_size: 6, base_price_cents: 1000 }
              as: PlatformAdmin
              captures: { strain_id: $.data.id }
            - call: "POST /api/protocols"
              payload: { facility_id: "${fac_id}", protocol_number: "P-100", pi_name: "Dr. Xu", species: "MOUSE", approved_animal_quota: 1000, effective_date: "2026-09-01T00:00:00Z", expiration_date: "2029-09-01T00:00:00Z" }
              as: FacilityManager
              as_user_id: "fm_1"
              captures: { prot_id: $.data.id }
            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "SUBMITTED" }
              as: FacilityManager
              as_user_id: "fm_1"
            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "UNDER_REVIEW" }
              as: IACUCReviewer
              as_user_id: "rev_1"
            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "APPROVED" }
              as: IACUCReviewer
              as_user_id: "rev_1"
            - call: "POST /api/colonies"
              payload: { room_id: "${room_id}", strain_id: "${strain_id}", protocol_id: "${prot_id}", breeding_pair_count: 10 }
              as: FacilityManager
              captures: { col_id: $.data.id }
          trigger:
            - call: "GET /api/colonies/${col_id}"
              as: Veterinarian
          assert:
            - "Colony.${col_id}.lifecycle_status == FOUNDING and genetic_status == CLEAR  (initial states)"
            - "Colony.${col_id}.generation_number == 0 and snp_panel_interval_weeks == 12  (defaults applied)"
            - "Colony.${col_id}.last_snp_panel_at == 2026-09-01T00:00:00Z  (creation clock)"
            - "Colony.${col_id}.breeding_pair_count == 10 and version == 1"
