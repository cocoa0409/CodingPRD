            - "the consumer's WEB implementation is SHIPPED with zero-defect AA evidence, so Component.coverage_state == WEB_ONLY and Team.blocked_implementation_count == 0"
            - "a BREAKING_CHANGE proposal on the provider sits in READY_FOR_ACCEPTANCE with all five required evidence kinds filed"
