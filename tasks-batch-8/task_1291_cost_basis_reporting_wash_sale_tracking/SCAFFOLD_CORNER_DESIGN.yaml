      - name: error_stale_account_version_triggered
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_ACCOUNT_VERSION]", "concurrency_rules[transfer-deliver-stale-account]"]
        distinguishing_aspect: "deliver with an expected_account_version older than the account's current version fails 412 ERR_STALE_ACCOUNT_VERSION."
        test_recipe:
          setup: ["customer, account with lot 100 sh; OUTBOUND statement TS1; account version captured at creation, then bumped by a restrict call"]
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Firm ER1" }
