              as: LeagueDraftAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /draft-ops/prospects/${p1_id}/declaration"
              payload: { action: "DECLARE" }
              as: ProspectAgent
              as_user_id: "${p1_id}"
            - call: "POST /draft-ops/prospects/${p1_id}/eligibility-determination"
              payload: { action: "DECLARE_ELIGIBLE" }
