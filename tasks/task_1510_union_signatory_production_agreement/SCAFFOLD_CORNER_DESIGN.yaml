  # ===================================================================
  # Section: cross_cutting_layers
  # ===================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_on_budget_revision_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[budget-revision-stale-production]"
          - "errors[ERR_STALE_VERSION]"
          - "entities.Production.fields.version"
        distinguishing_aspect: "OCC on Production.version: after a successful revision advances the version, a second revision carrying the previously observed version is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["SIGNATORY company; ULB production STAFFING (bond posted); client holds version V from a GET"]
          setup_api_calls:
            - { call: "POST /union-compliance/producer-companies", payload: { legal_name: "Whorl LLC", fein: "20-0000050" }, as: ProducerRep, captures: { co_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications", payload: { producer_company_id: "${co_id}", requested_agreement_scope: "THEATRICAL", estimated_slate_budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/decide", payload: { decision: "APPROVE" }, as: UnionRep }
            - { call: "POST /union-compliance/productions", payload: { producer_company_id: "${co_id}", title: "Whorl Pool", agreement_tier: "ULTRA_LOW_BUDGET", budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { prod_id: $.data.id } }
            - { call: "GET /union-compliance/productions/${prod_id}/bonds", payload: {}, as: ProducerRep, as_user_id: "${co_id}", captures: { bond_id: "$.data[0].id" } }
            - { call: "POST /union-compliance/bonds/${bond_id}/post", payload: { amount_cents: 2500000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "GET /union-compliance/productions/${prod_id}", payload: {}, as: ProducerRep, as_user_id: "${co_id}", captures: { prod_v: $.data.version } }
          trigger:
            - { call: "POST /union-compliance/productions/${prod_id}/budget-revisions", payload: { new_budget_cents: 21000000, expected_production_version: "${prod_v}" }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/productions/${prod_id}/budget-revisions", payload: { new_budget_cents: 22000000, expected_production_version: "${prod_v}" }, as: ProducerRep, as_user_id: "${co_id}", captures: { err: $.data.error_id } }
          assert:
