              captures: { v_release: $.data.version }
            - call: "POST /wire-lots/${wire_id}/release"
              payload: {}
              as: QualityInspector
              as_user_id: "insp-1"
              captures: { rerelease_err: $.data.error_id }
            - call: "GET /wire-lots/${wire_id}"
              payload: {}
              as: ShippingClerk
              as_user_id: "ship-1"
              captures: { v_read2: $.data.version }
            - call: "POST /production-lots"
              payload: { lot_code: "L-VER1", part_spec_id: "${spec_id}", wire_lot_id: "${wire_id}", heading_tool_id: "${tool_id}", press_code: "PRESS-3", press_window_start_at: "2026-09-01T06:00:00Z", press_window_end_at: "2026-09-01T08:00:00Z", planned_pieces: 1000, expected_wire_lot_version: "${v_read2}" }
