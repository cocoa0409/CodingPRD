# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Convention fixture "C1" repeated across instances:
#   starts 2026-10-15T09:00:00Z, ends 2026-10-18T18:00:00Z (4 selling days),
#   renewal_open 2026-08-05, application_open 2026-08-12, close 2026-08-25,
#   early_bird_deadline 2026-08-20T00:00:00Z, deposit_window_days 14 (default),
#   tax_permit_required true, sales_tax_rate_bp 875,
#   quotas: ARTIST_ALLEY 2/2, DEALER 1/1 ; dock doors D1, D2.
scaffold_difficulty_design:
  # ============================================================
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_quote_vs_final_invoice_space_count_divergence
        grounds:
          - calculations.space_pricing
          - entities.Application.fields.provisional_quote_cents
          - entities.Application.fields.final_invoice_cents
        distinguishing_aspect: |
          Same application inputs priced by two variants on the Application domain:
          provisional (submit-time, scope = requested_space_count = 3, early-bird
          assumed) yields 240000; final (accept-time, scope = 1 RESERVED space)
          yields 90000 — the variants disagree by 150000 cents on identical inputs.
        test_recipe:
          setup:
            - "Convention C1 with clock at 2026-08-13 (OPEN window, before early-bird deadline), phase APPLICATIONS_OPEN"
            - "SpaceUnit S1 BOOTH_10X10 MAIN block A unit 101 base 100000"
            - "Exhibitor DE (DEALER) with Application requesting 3 BOOTH_10X10, estimated_daily_sales_cents 33333, submitted"
            - "Application juried to JURIED_ACCEPTED, convention in PLACEMENT, S1 RESERVED for the application (only 1 space placed), permit VERIFIED"
          setup_api_calls:
            - { call: "POST /conventions", payload: { name: "InkExpo 2026", starts_at: "2026-10-15T09:00:00Z", ends_at: "2026-10-18T18:00:00Z", renewal_open_at: "2026-08-05T00:00:00Z", application_open_at: "2026-08-12T00:00:00Z", application_close_at: "2026-08-25T00:00:00Z", early_bird_deadline: "2026-08-20T00:00:00Z", tax_permit_required: true, sales_tax_rate_bp: 875, category_quotas: [{category: "ARTIST_ALLEY", max_accepted: 2, max_waitlisted: 2}, {category: "DEALER", max_accepted: 1, max_waitlisted: 1}], dock_doors: [{door_code: "D1"}, {door_code: "D2"}] }, as: ShowDirector, captures: { conv: $.data.id } }
            - { call: "POST /space-units", payload: { convention_id: "${conv}", space_code: "A-101", block: "A", unit_number: 101, hall: "MAIN", kind: "BOOTH_10X10", base_price_cents: 100000 }, as: ShowDirector, captures: { sp1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-13T00:00:00Z" }, as: ShowDirector }
            - { call: "POST /conventions/${conv}/advance-phase", payload: {}, as: ShowDirector }
            - { call: "POST /exhibitors", payload: { legal_name: "Dealer One LLC", category: "DEALER", prior_years_completed: 2, prior_on_time_payments: 3 }, as: Anonymous, captures: { ex: $.data.id } }
            - { call: "POST /applications", payload: { convention_id: "${conv}", category: "DEALER", channel: "OPEN", requested_space_kinds: ["BOOTH_10X10"], requested_space_count: 3, estimated_daily_sales_cents: 33333 }, as: Exhibitor, as_user_id: "${ex}", captures: { app: $.data.id } }
            - { call: "POST /applications/${app}/submit", payload: {}, as: Exhibitor, as_user_id: "${ex}", captures: { prov_q: $.data.provisional_quote_cents, tax_est: $.data.tax_estimate_cents } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-26T00:00:00Z" }, as: ShowDirector }
            - { call: "POST /conventions/${conv}/advance-phase", payload: {}, as: ShowDirector }
            - { call: "POST /jury-scores", payload: { application_id: "${app}", originality: 80, craft: 90, category_fit: 70, professionalism: 60 }, as: JuryMember, as_user_id: "juror-1" }
            - { call: "POST /jury-scores", payload: { application_id: "${app}", originality: 90, craft: 80, category_fit: 80, professionalism: 80 }, as: JuryMember, as_user_id: "juror-2" }
            - { call: "POST /jury-scores", payload: { application_id: "${app}", originality: 70, craft: 70, category_fit: 80, professionalism: 70 }, as: JuryMember, as_user_id: "juror-3" }
            - { call: "POST /applications/${app}/decide", payload: { decision: "ACCEPTED" }, as: ShowDirector }
            - { call: "POST /conventions/${conv}/advance-phase", payload: {}, as: ShowDirector }
            - { call: "POST /placements", payload: { application_id: "${app}", space_unit_id: "${sp1}" }, as: ShowDirector }
            - { call: "POST /applications/${app}/submit-permit", payload: { permit_number: "ST-4432", permit_expires_at: "2027-01-01T00:00:00Z" }, as: Exhibitor, as_user_id: "${ex}" }
            - { call: "POST /applications/${app}/verify-permit", payload: {}, as: ShowDirector }
          trigger:
            - { call: "POST /applications/${app}/accept-offer", payload: { deposit_cents: 22500 }, as: Exhibitor, as_user_id: "${ex}", captures: { fin: $.data.final_invoice_cents, dep: $.data.deposit_cents, st: $.data.status } }
          assert:
            - "captured provisional_quote_cents == 240000 (3 hypothetical spaces: subtotal 300000, pre-discount-tier 10% + early-bird 10%, single rounding)"
            - "captured tax_estimate_cents == 11668 (per-day round_half_up(33333*875/10000)=2917 times 4 selling days)"
            - "final_invoice_cents == 90000 (1 RESERVED space: subtotal 100000, no multi-space discount, early-bird 10%)"
            - "deposit_cents == 22500 and amount_paid_cents == 22500 and balance_due_cents == 67500"
            - "status == CONTRACTED and provisional_quote_cents != final_invoice_cents (240000 vs 90000)"

      - name: tax_estimate_vs_settlement_rounding_divergence
        grounds:
          - calculations.sales_tax_estimate
          - calculations.sales_tax_settlement
          - entities.SalesReport.fields.tax_settlement_cents
        distinguishing_aspect: |
          Different entity domain than space pricing: on SalesReport, the settlement
          variant (per-line rounding then sum over 3 actual lines of 33333) yields
          8751, while the estimate variant on Application (projected per-day rounding
          times days) yields 11668; a naive sum-then-round of the same lines (8750)
          matches neither pinned variant.
        test_recipe:
          setup:
            - "Convention C1, application PLACED with estimated_daily_sales_cents 33333 (tax_estimate_cents 11668 computed at submit)"
            - "Convention advanced to LIVE (clock >= starts_at)"
          setup_api_calls:
            - { call: "POST /conventions", payload: { name: "InkExpo 2026", starts_at: "2026-10-15T09:00:00Z", ends_at: "2026-10-18T18:00:00Z", renewal_open_at: "2026-08-05T00:00:00Z", application_open_at: "2026-08-12T00:00:00Z", application_close_at: "2026-08-25T00:00:00Z", early_bird_deadline: "2026-08-20T00:00:00Z", tax_permit_required: true, sales_tax_rate_bp: 875, category_quotas: [{category: "ARTIST_ALLEY", max_accepted: 2, max_waitlisted: 2}, {category: "DEALER", max_accepted: 1, max_waitlisted: 1}], dock_doors: [{door_code: "D1"}, {door_code: "D2"}] }, as: ShowDirector, captures: { conv: $.data.id } }
            - { call: "POST /space-units", payload: { convention_id: "${conv}", space_code: "A-101", block: "A", unit_number: 101, hall: "MAIN", kind: "BOOTH_10X10", base_price_cents: 100000 }, as: ShowDirector, captures: { sp1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-13T00:00:00Z" }, as: ShowDirector }
            - { call: "POST /conventions/${conv}/advance-phase", payload: {}, as: ShowDirector }
            - { call: "POST /exhibitors", payload: { legal_name: "Dealer One LLC", category: "DEALER", prior_years_completed: 2, prior_on_time_payments: 3 }, as: Anonymous, captures: { ex: $.data.id } }
            - { call: "POST /applications", payload: { convention_id: "${conv}", category: "DEALER", channel: "OPEN", requested_space_kinds: ["BOOTH_10X10"], requested_space_count: 1, estimated_daily_sales_cents: 33333 }, as: Exhibitor, as_user_id: "${ex}", captures: { app: $.data.id } }
            - { call: "POST /applications/${app}/submit", payload: {}, as: Exhibitor, as_user_id: "${ex}", captures: { tax_est: $.data.tax_estimate_cents } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-26T00:00:00Z" }, as: ShowDirector }
            - { call: "POST /conventions/${conv}/advance-phase", payload: {}, as: ShowDirector }
            - { call: "POST /jury-scores", payload: { application_id: "${app}", originality: 80, craft: 90, category_fit: 70, professionalism: 60 }, as: JuryMember, as_user_id: "juror-1" }
            - { call: "POST /jury-scores", payload: { application_id: "${app}", originality: 90, craft: 80, category_fit: 80, professionalism: 80 }, as: JuryMember, as_user_id: "juror-2" }
            - { call: "POST /jury-scores", payload: { application_id: "${app}", originality: 70, craft: 70, category_fit: 80, professionalism: 70 }, as: JuryMember, as_user_id: "juror-3" }
            - { call: "POST /applications/${app}/decide", payload: { decision: "ACCEPTED" }, as: ShowDirector }
            - { call: "POST /conventions/${conv}/advance-phase", payload: {}, as: ShowDirector }
            - { call: "POST /placements", payload: { application_id: "${app}", space_unit_id: "${sp1}" }, as: ShowDirector, captures: { plc: $.data.id } }
            - { call: "POST /applications/${app}/submit-permit", payload: { permit_number: "ST-4432", permit_expires_at: "2027-01-01T00:00:00Z" }, as: Exhibitor, as_user_id: "${ex}" }
            - { call: "POST /applications/${app}/verify-permit", payload: {}, as: ShowDirector }
            - { call: "POST /applications/${app}/accept-offer", payload: { deposit_cents: 22500 }, as: Exhibitor, as_user_id: "${ex}" }
            - { call: "POST /placements/${plc}/confirm", payload: {}, as: ShowDirector }
            - { call: "POST /conventions/${conv}/advance-phase", payload: {}, as: ShowDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-15T09:00:00Z" }, as: ShowDirector }
            - { call: "POST /conventions/${conv}/advance-phase", payload: {}, as: ShowDirector }
            - { call: "POST /sales-reports", payload: { application_id: "${app}", lines: [{sale_date: "2026-10-15", gross_cents: 33333}, {sale_date: "2026-10-16", gross_cents: 33333}, {sale_date: "2026-10-17", gross_cents: 33333}] }, as: Exhibitor, as_user_id: "${ex}", captures: { srep: $.data.id } }
          trigger:
            - { call: "POST /sales-reports/${srep}/submit", payload: {}, as: Exhibitor, as_user_id: "${ex}", captures: { settle: $.data.tax_settlement_cents } }
          assert:
            - "Application tax_estimate_cents == 11668 (estimate variant: 2917 per day x 4 days)"
            - "SalesReport tax_settlement_cents == 8751 (settlement variant: 3 x round_half_up(33333*0.0875)=2917)"
            - "8751 != 8750 (the sum-then-round value of 99999*0.0875=8749.91 -> 8750 is NOT the pinned order)"
            - "8751 != 11668 and the two variants operate on different entity domains (SalesReport vs Application)"

  # ============================================================
  - rule_id: combinatorial_formula
    instances:
      - name: jury_composite_weighted_quorum_gating
        grounds:
          - calculations.jury_composite_score
          - state_machines.Application.UNDER_REVIEW_to_JURIED_ACCEPTED
        distinguishing_aspect: |
          Mode (a): a formula with 4 weighted inputs, a distinct-juror quorum gate,
          and a non-linear decision branch (>= 70.00 ACCEPT-eligible, 50.00-69.99
          waitlist-only) — per-juror rounding happens before the mean.
        test_recipe:
          setup:
            - "Convention C1 in JURY_REVIEW (clock 2026-08-26); application SUBMITTED"
            - "Three jurors post scores (80,90,70,60), (90,80,80,80), (70,70,80,70)"
          setup_api_calls:
            - { call: "POST /conventions", payload: { name: "InkExpo 2026", starts_at: "2026-10-15T09:00:00Z", ends_at: "2026-10-18T18:00:00Z", renewal_open_at: "2026-08-05T00:00:00Z", application_open_at: "2026-08-12T00:00:00Z", application_close_at: "2026-08-25T00:00:00Z", early_bird_deadline: "2026-08-20T00:00:00Z", tax_permit_required: true, sales_tax_rate_bp: 875, category_quotas: [{category: "ARTIST_ALLEY", max_accepted: 2, max_waitlisted: 2}, {category: "DEALER", max_accepted: 1, max_waitlisted: 1}], dock_doors: [{door_code: "D1"}, {door_code: "D2"}] }, as: ShowDirector, captures: { conv: $.data.id } }
            - { call: "POST /space-units", payload: { convention_id: "${conv}", space_code: "A-101", block: "A", unit_number: 101, hall: "MAIN", kind: "BOOTH_10X10", base_price_cents: 100000 }, as: ShowDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-13T00:00:00Z" }, as: ShowDirector }
            - { call: "POST /conventions/${conv}/advance-phase", payload: {}, as: ShowDirector }
            - { call: "POST /exhibitors", payload: { legal_name: "Dealer One LLC", category: "DEALER" }, as: Anonymous, captures: { ex: $.data.id } }
            - { call: "POST /applications", payload: { convention_id: "${conv}", category: "DEALER", channel: "OPEN", requested_space_kinds: ["BOOTH_10X10"], requested_space_count: 1, estimated_daily_sales_cents: 33333 }, as: Exhibitor, as_user_id: "${ex}", captures: { app: $.data.id } }
            - { call: "POST /applications/${app}/submit", payload: {}, as: Exhibitor, as_user_id: "${ex}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-26T00:00:00Z" }, as: ShowDirector }
            - { call: "POST /conventions/${conv}/advance-phase", payload: {}, as: ShowDirector }
            - { call: "POST /jury-scores", payload: { application_id: "${app}", originality: 80, craft: 90, category_fit: 70, professionalism: 60 }, as: JuryMember, as_user_id: "juror-1", captures: { w1: $.data.weighted_total } }
            - { call: "POST /jury-scores", payload: { application_id: "${app}", originality: 90, craft: 80, category_fit: 80, professionalism: 80 }, as: JuryMember, as_user_id: "juror-2" }
            - { call: "POST /jury-scores", payload: { application_id: "${app}", originality: 70, craft: 70, category_fit: 80, professionalism: 70 }, as: JuryMember, as_user_id: "juror-3" }
          trigger:
            - { call: "POST /applications/${app}/decide", payload: { decision: "ACCEPTED" }, as: ShowDirector, captures: { comp: $.data.jury_composite_score, st: $.data.status } }
          assert:
            - "first juror weighted_total == 77.00 (0.35*80 + 0.25*90 + 0.25*70 + 0.15*60)"
            - "jury_composite_score == 77.67 (round_half_up of 233.00/3 = 77.6666...)"
            - "decision ACCEPTED succeeds because 77.67 >= 70.00 and quota has room; status == JURIED_ACCEPTED"

      - name: final_invoice_discount_keyed_on_prediscount_subtotal
        grounds:
          - calculations.space_pricing
          - state_machines.Application.JURIED_ACCEPTED_to_CONTRACTED
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — the 10% discount tier is keyed on
          the PRE-discount subtotal (300000) while applying to produce the total;
          an implementation keying on the discounted value (270000 < 300000 -> 5%)
          yields 285000, proving the pinned evaluation order is load-bearing.
        test_recipe:
          setup:
            - "Convention C1; THREE MAIN BOOTH_10X10 spaces (A-101/102/103, base 100000 each)"
            - "Application requesting 3 BOOTH_10X10 submitted AFTER the early-bird deadline (2026-08-22, no early-bird), juried ACCEPTED, all three spaces RESERVED"
          setup_api_calls:
            - { call: "POST /conventions", payload: { name: "InkExpo 2026", starts_at: "2026-10-15T09:00:00Z", ends_at: "2026-10-18T18:00:00Z", renewal_open_at: "2026-08-05T00:00:00Z", application_open_at: "2026-08-12T00:00:00Z", application_close_at: "2026-08-25T00:00:00Z", early_bird_deadline: "2026-08-20T00:00:00Z", tax_permit_required: true, sales_tax_rate_bp: 875, category_quotas: [{category: "ARTIST_ALLEY", max_accepted: 2, max_waitlisted: 2}, {category: "DEALER", max_accepted: 1, max_waitlisted: 1}], dock_doors: [{door_code: "D1"}, {door_code: "D2"}] }, as: ShowDirector, captures: { conv: $.data.id } }
            - { call: "POST /space-units", payload: { convention_id: "${conv}", space_code: "A-101", block: "A", unit_number: 101, hall: "MAIN", kind: "BOOTH_10X10", base_price_cents: 100000 }, as: ShowDirector, captures: { sp1: $.data.id } }
            - { call: "POST /space-units", payload: { convention_id: "${conv}", space_code: "A-102", block: "A", unit_number: 102, hall: "MAIN", kind: "BOOTH_10X10", base_price_cents: 100000 }, as: ShowDirector, captures: { sp2: $.data.id } }
            - { call: "POST /space-units", payload: { convention_id: "${conv}", space_code: "A-103", block: "A", unit_number: 103, hall: "MAIN", kind: "BOOTH_10X10", base_price_cents: 100000 }, as: ShowDirector, captures: { sp3: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-22T00:00:00Z" }, as: ShowDirector }
            - { call: "POST /conventions/${conv}/advance-phase", payload: {}, as: ShowDirector }
            - { call: "POST /exhibitors", payload: { legal_name: "Dealer One LLC", category: "DEALER" }, as: Anonymous, captures: { ex: $.data.id } }
            - { call: "POST /applications", payload: { convention_id: "${conv}", category: "DEALER", channel: "OPEN", requested_space_kinds: ["BOOTH_10X10"], requested_space_count: 3, estimated_daily_sales_cents: 33333 }, as: Exhibitor, as_user_id: "${ex}", captures: { app: $.data.id } }
            - { call: "POST /applications/${app}/submit", payload: {}, as: Exhibitor, as_user_id: "${ex}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-26T00:00:00Z" }, as: ShowDirector }
            - { call: "POST /conventions/${conv}/advance-phase", payload: {}, as: ShowDirector }
            - { call: "POST /jury-scores", payload: { application_id: "${app}", originality: 80, craft: 90, category_fit: 70, professionalism: 60 }, as: JuryMember, as_user_id: "juror-1" }
            - { call: "POST /jury-scores", payload: { application_id: "${app}", originality: 90, craft: 80, category_fit: 80, professionalism: 80 }, as: JuryMember, as_user_id: "juror-2" }
            - { call: "POST /jury-scores", payload: { application_id: "${app}", originality: 70, craft: 70, category_fit: 80, professionalism: 70 }, as: JuryMember, as_user_id: "juror-3" }
            - { call: "POST /applications/${app}/decide", payload: { decision: "ACCEPTED" }, as: ShowDirector }
            - { call: "POST /conventions/${conv}/advance-phase", payload: {}, as: ShowDirector }
            - { call: "POST /placements", payload: { application_id: "${app}", space_unit_id: "${sp1}" }, as: ShowDirector }
            - { call: "POST /placements", payload: { application_id: "${app}", space_unit_id: "${sp2}" }, as: ShowDirector }
            - { call: "POST /placements", payload: { application_id: "${app}", space_unit_id: "${sp3}" }, as: ShowDirector }
            - { call: "POST /applications/${app}/submit-permit", payload: { permit_number: "ST-4432", permit_expires_at: "2027-01-01T00:00:00Z" }, as: Exhibitor, as_user_id: "${ex}" }
            - { call: "POST /applications/${app}/verify-permit", payload: {}, as: ShowDirector }
          trigger:
            - { call: "POST /applications/${app}/accept-offer", payload: { deposit_cents: 67500 }, as: Exhibitor, as_user_id: "${ex}", captures: { fin: $.data.final_invoice_cents, dep: $.data.deposit_cents } }
          assert:
            - "final_invoice_cents == 270000 (subtotal 300000 >= 300000 -> 10% keyed on PRE-discount subtotal; no early-bird)"
            - "final_invoice_cents != 285000 (the value produced if the discount were keyed on the discounted total: 300000*0.95)"
            - "deposit_cents == 67500 (round_half_up(270000 * 0.25)); balance_due_cents == 202500"

      - name: sales_tax_settlement_per_line_rounding_order
        grounds:
          - calculations.sales_tax_settlement
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — per-line round_half_up
          then sum yields 8751 for three 33333-cent lines at 875bp, while
          sum-then-round yields 8750; the scaffold pins per-line-then-sum.
        test_recipe:
          setup:
            - "Convention C1 with a PLACED application and phase LIVE (same chain as tax_estimate_vs_settlement_rounding_divergence)"
          setup_api_calls:
            - { call: "POST /conventions", payload: { name: "InkExpo 2026", starts_at: "2026-10-15T09:00:00Z", ends_at: "2026-10-18T18:00:00Z", renewal_open_at: "2026-08-05T00:00:00Z", application_open_at: "2026-08-12T00:00:00Z", application_close_at: "2026-08-25T00:00:00Z", early_bird_deadline: "2026-08-20T00:00:00Z", tax_permit_required: true, sales_tax_rate_bp: 875, category_quotas: [{category: "ARTIST_ALLEY", max_accepted: 2, max_waitlisted: 2}, {category: "DEALER", max_accepted: 1, max_waitlisted: 1}], dock_doors: [{door_code: "D1"}, {door_code: "D2"}] }, as: ShowDirector, captures: { conv: $.data.id } }
            - { call: "POST /space-units", payload: { convention_id: "${conv}", space_code: "A-101", block: "A", unit_number: 101, hall: "MAIN", kind: "BOOTH_10X10", base_price_cents: 100000 }, as: ShowDirector, captures: { sp1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-13T00:00:00Z" }, as: ShowDirector }
            - { call: "POST /conventions/${conv}/advance-phase", payload: {}, as: ShowDirector }
            - { call: "POST /exhibitors", payload: { legal_name: "Dealer One LLC", category: "DEALER" }, as: Anonymous, captures: { ex: $.data.id } }
            - { call: "POST /applications", payload: { convention_id: "${conv}", category: "DEALER", channel: "OPEN", requested_space_kinds: ["BOOTH_10X10"], requested_space_count: 1, estimated_daily_sales_cents: 33333 }, as: Exhibitor, as_user_id: "${ex}", captures: { app: $.data.id } }
            - { call: "POST /applications/${app}/submit", payload: {}, as: Exhibitor, as_user_id: "${ex}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-26T00:00:00Z" }, as: ShowDirector }
            - { call: "POST /conventions/${conv}/advance-phase", payload: {}, as: ShowDirector }
            - { call: "POST /jury-scores", payload: { application_id: "${app}", originality: 80, craft: 90, category_fit: 70, professionalism: 60 }, as: JuryMember, as_user_id: "juror-1" }
            - { call: "POST /jury-scores", payload: { application_id: "${app}", originality: 90, craft: 80, category_fit: 80, professionalism: 80 }, as: JuryMember, as_user_id: "juror-2" }
            - { call: "POST /jury-scores", payload: { application_id: "${app}", originality: 70, craft: 70, category_fit: 80, professionalism: 70 }, as: JuryMember, as_user_id: "juror-3" }
            - { call: "POST /applications/${app}/decide", payload: { decision: "ACCEPTED" }, as: ShowDirector }
            - { call: "POST /conventions/${conv}/advance-phase", payload: {}, as: ShowDirector }
            - { call: "POST /placements", payload: { application_id: "${app}", space_unit_id: "${sp1}" }, as: ShowDirector, captures: { plc: $.data.id } }
            - { call: "POST /applications/${app}/submit-permit", payload: { permit_number: "ST-4432", permit_expires_at: "2027-01-01T00:00:00Z" }, as: Exhibitor, as_user_id: "${ex}" }
