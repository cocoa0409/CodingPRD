        distinguishing_aspect: "Load cancellation is the compensating edge for both of the create-and-assign side effects: the per-order allocation fields must be wound back to their creation defaults (freight_load_id null, allocated_freight_cents 0, freight_sequence null) AND the dealer's staged_kit_count must drop so the yard slot is genuinely reusable. Proving the slot release requires a create that fails with ERR_YARD_SLOTS_EXHAUSTED before the cancel and the identical create succeeding after it. An implementation that only flips FreightLoad.status leaves the orders permanently welded to a cancelled load, which then shows up as ERR_ORDER_ALREADY_ON_LOAD on the re-assignment."
