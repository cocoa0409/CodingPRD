        grounds:
          - calculations.roster_workload_compliance.precision
          - state_machines.ShiftRoster.COMPLIANT_to_AT_LIMIT
          - validations[priority=16]
        distinguishing_aspect: |
          Exercises the inclusive/exclusive seam of the credit ceiling: assigned_credits of exactly
          4.00 against effective_credit_cap of exactly 4.00 must be ACCEPTED and land on AT_LIMIT,
          because the rule is strictly-greater. An implementation that uses >= anywhere in the ceiling
          comparison returns ERR_CREDIT_CAP_EXCEEDED here and an implementation that forgets the
