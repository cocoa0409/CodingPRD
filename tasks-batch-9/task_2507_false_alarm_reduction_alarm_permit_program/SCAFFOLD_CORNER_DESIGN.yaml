          - state_machines.DispatchRequest.SUBMITTED_to_REFUSED
        distinguishing_aspect: "Refusal is available ONLY from SUBMITTED (the fork opposite validate) and stores an enum reason, after which no FalseAlarmIncident may ever name the request — yet §1.3 still counts a REFUSED request in the company's reported-dispatch reconciliation, because the company did ask for a dispatch."
        test_recipe:
          setup:
            - "Clock 2026-09-15T03:00:00Z; a TWO_CALL_ECV request from Guardian sits in SUBMITTED against permitted system 1."
          setup_api_calls:
