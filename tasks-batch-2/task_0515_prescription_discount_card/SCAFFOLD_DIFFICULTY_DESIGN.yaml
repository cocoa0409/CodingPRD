  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: adjudicate_requires_card_issued_claim_to_pharmacy
        grounds:
          - state_machines.Claim.SUBMITTED_to_ADJUDICATED
          - state_machines.DiscountCard.ISSUED_to_REDEEMED
