          - entities.EsopLoan.fields.status
        distinguishing_aspect: "The payment that drives principal_balance_cents to 0 bypasses the ratio entirely and releases the whole remaining suspense balance of 540000 shares, flipping EsopLoan.status to REPAID."
        test_recipe:
          setup:
            - "One OPEN plan with a PRINCIPAL_ONLY loan of 4000000000 cents principal, 1600000000 cents interest and 600000 pledged shares, on which one payment of 400000000 principal has already released 60000 shares."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-30T00:00:00Z" }
              as: PlanAdministrator
