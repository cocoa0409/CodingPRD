  - rule_id: non_linear_state_machine
    instances:
      - name: valve_unit_service_dimension_moves_while_cert_dimension_holds
        grounds:
          - state_machines.ValveUnit.service_status_NONE_to_OPEN
          - state_machines.ValveUnit.service_status_OPEN_to_PARTS_RESERVED
          - entities.ValveUnit.fields.build_status
          - entities.ValveUnit.fields.cert_status
          - entities.ValveModel.fields.repair_kit_stock_qty
        distinguishing_aspect: |
          ValveUnit carries three orthogonal dimensions: driving service_status NONE -> OPEN -> PARTS_RESERVED
          leaves cert_status CERTIFIED and build_status PACKAGED untouched while decrementing the model's
          repair-kit stock — a linear single-status machine cannot represent this combined state.
