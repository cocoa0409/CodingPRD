# =============================================================================
# SCAFFOLD: Bearings & Power-Transmission Distribution
# §1.0–§1.7 seed tables. Difficulty design (§1.8) and corner design (§1.9)
# live in sibling files SCAFFOLD_DIFFICULTY_DESIGN.yaml /
# SCAFFOLD_CORNER_DESIGN.yaml and are NOT emitted here.
# =============================================================================

scenario: |
  Bearings & Power-Transmission Distribution (Motion Industries): application
  sizing & interchange lookup, emergency after-hours branch call-out, stock vs
  factory lead time & expedite, repair-shop referral & service integration,
  consigned stock at customer plant, price-file update & customer contract lag,
  warranty & failed-bearing analysis, surplus & obsolete return

domain_name: bearings-power-transmission-distribution
api_prefix: /motion

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Manufacturer part number; unique across catalog" }
      - { name: description, type: string, source: input, description: "Free-text product description" }
      - { name: family, type: enum, source: input, description: "BEARING | GEARBOX | BELT | CHAIN | SEAL" }
      - { name: list_price_cents, type: integer, source: input, description: "Current list price in cents; mutated only when a PriceFileVersion becomes EFFECTIVE" }
      - { name: last_price_change_at, type: datetime, source: system, default: null, description: "Timestamp of the most recent EFFECTIVE price-file application; null until first price change" }
      - { name: superseded_by_id, type: string, source: input, default: null, description: "FK -> Product.id; optional forward pointer set when status becomes OBSOLETE" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | PHASEOUT | OBSOLETE" }

  - name: InterchangeRecord
    parent: null
    common_fields: false
    fields:
      - { name: competitor_part_number, type: string, source: input, description: "Competitor or legacy part number to map" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the in-catalog product this part interchanges to" }
      - { name: interchange_class, type: enum, source: input, description: "EXACT | DIMENSIONAL | FUNCTIONAL" }
      - { name: min_shaft_diameter_mm, type: number, source: input, description: "Lower bound of application shaft-diameter envelope (inclusive)" }
      - { name: max_shaft_diameter_mm, type: number, source: input, description: "Upper bound of application shaft-diameter envelope (inclusive)" }
      - { name: requires_engineering_review, type: boolean, source: computed, description: "true iff interchange_class == FUNCTIONAL" }

  - name: CustomerAccount
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer plant name" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum permitted open receivables + new order total" }
      - { name: credit_status, type: enum, source: system, default: GOOD, description: "GOOD | HOLD; set via PATCH /customers/{id}" }
      - { name: open_receivables_cents, type: integer, source: computed, default: 0, description: "Derived: unpaid invoiced order balances + outstanding consignment billings + fulfilled call-out charges - issued warranty credits - issued return credit memos (may go negative)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | INACTIVE" }

  - name: CustomerContract
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> CustomerAccount.id" }
      - { name: family, type: enum, source: input, description: "Product family scope: BEARING | GEARBOX | BELT | CHAIN | SEAL" }
      - { name: price_basis, type: enum, source: input, description: "LIST_LESS | CONTRACT_FIXED" }
      - { name: discount_pct, type: number, source: input, default: 0, description: "Fraction in [0,1]; used iff price_basis == LIST_LESS" }
      - { name: fixed_unit_price_cents, type: integer, source: input, default: null, description: "Required iff price_basis == CONTRACT_FIXED; pinned unit price regardless of list" }
      - { name: lag_protection_days, type: integer, source: input, default: 0, description: "Days after a list-price increase during which the prior (lower) price still applies for this customer" }
      - { name: effective_from, type: datetime, source: input, description: "Window start (inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "Window end (exclusive); must be > effective_from" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | EXPIRED | TERMINATED" }

  - name: Branch
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Branch code; unique" }
      - { name: timezone_offset_hours, type: integer, source: input, description: "Fixed offset from UTC used for all local-time rules (business hours, cutoffs)" }
      - { name: business_open_hour, type: integer, source: input, description: "Local hour business opens (0-23); after-hours := local_hour < open OR local_hour >= close" }
      - { name: business_close_hour, type: integer, source: input, description: "Local hour business closes (0-23); must be > business_open_hour" }
      - { name: expedite_cutoff_hour, type: integer, source: input, description: "Local hour of same-day factory-order cutoff; at/after this hour the after-cutoff fee multiplier applies" }
      - { name: after_hours_fee_cents, type: integer, source: input, description: "Base call-out fee charged for after-hours service" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | CLOSED" }

  - name: BranchStock
    parent: null
    common_fields: true
    fields:
      - { name: branch_id, type: string, source: input, description: "FK -> Branch.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: on_hand_qty, type: integer, source: input, description: "Physical units on the shelf; mutated by consignment placement/close, allocation, factory receipt, call-out fulfillment, surplus return receipt, and /adjust" }
      - { name: reserved_qty, type: integer, source: computed, default: 0, description: "Sum of qty over StockReservations of this stock with status ACTIVE" }
      - { name: available_qty, type: integer, source: computed, description: "on_hand_qty - reserved_qty" }
      - { name: factory_lead_time_days, type: integer, source: input, description: "Factory-direct lead time in days for this branch+product" }
      - { name: reorder_point, type: integer, source: input, default: 0, description: "Replenishment trigger point (informational)" }

  - name: PriceFileVersion
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: new_list_price_cents, type: integer, source: input, description: "List price that takes effect at effective_at" }
      - { name: effective_at, type: datetime, source: input, description: "Instant the new price takes effect; must be strictly in the future at publish time" }
      - { name: published_by, type: string, source: system, description: "X-User-ID of the PricingAnalyst who published" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | EFFECTIVE | SUPERSEDED | CANCELLED" }

  - name: SalesOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> CustomerAccount.id" }
      - { name: branch_id, type: string, source: input, description: "FK -> Branch.id; fulfilling branch" }
      - { name: price_variant, type: enum, source: input, default: ORDER_DATE, description: "ORDER_DATE anchors pricing at order creation; SHIP_DATE anchors at each line's shipment instant" }
      - { name: fulfillment_status, type: enum, source: system, default: DRAFT, description: "DRAFT | CONFIRMED | FULLY_SOURCED | PARTIALLY_SHIPPED | SHIPPED | CLOSED | CANCELLED" }
      - { name: billing_status, type: enum, source: system, default: UNBILLED, description: "UNBILLED | INVOICED | PARTIALLY_PAID | PAID (parallel axis, independent of fulfillment_status)" }
      - { name: subtotal_cents, type: integer, source: computed, default: 0, description: "Sum of line goods amounts (round(unit_price*qty) per line, then summed)" }
      - { name: expedite_fees_cents, type: integer, source: computed, default: 0, description: "Sum of per-line expedite_fee_cents" }
      - { name: total_cents, type: integer, source: computed, default: 0, description: "subtotal_cents + expedite_fees_cents" }
      - { name: paid_cents, type: integer, source: system, default: 0, description: "Cumulative payments recorded against the invoice" }
      - { name: priced_at, type: datetime, source: system, default: null, description: "Instant of last price computation (confirm or reprice)" }

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> SalesOrder.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: qty, type: integer, source: input, description: "Quantity ordered; >= 1" }
      - { name: expedite_tier, type: enum, source: input, default: NONE, description: "NONE | STANDARD | RUSH | EMERGENCY" }
      - { name: unit_price_cents, type: integer, source: computed, default: null, description: "Final per-unit price after contract basis and lag protection; null until order is priced" }
      - { name: price_protection_applied, type: boolean, source: computed, default: false, description: "true iff lag protection lowered the price below the current list-derived price" }
      - { name: expedite_fee_cents, type: integer, source: computed, default: 0, description: "Per-line expedite charge per expedite_fee_stacking rule" }
      - { name: line_total_cents, type: integer, source: computed, default: 0, description: "round(unit_price_cents * qty) + expedite_fee_cents" }
      - { name: factory_ordered_at, type: datetime, source: system, default: null, description: "Instant factory order was placed (null unless factory-sourced)" }
      - { name: shipped_at, type: datetime, source: system, default: null, description: "Instant the line shipped (SHIP_DATE pricing anchor)" }
      - { name: sourcing_status, type: enum, source: system, default: PENDING_SOURCING, description: "PENDING_SOURCING | STOCK_RESERVED | FACTORY_ORDERED | FACTORY_RECEIVED | ALLOCATED | SHIPPED | CANCELLED" }

  - name: StockReservation
    parent: null
    common_fields: true
    fields:
      - { name: order_line_id, type: string, source: system, description: "FK -> OrderLine.id" }
      - { name: branch_stock_id, type: string, source: input, description: "FK -> BranchStock.id" }
      - { name: qty, type: integer, source: input, description: "Reserved units; must equal the order line qty (full-line reservation)" }
      - { name: expires_at, type: datetime, source: system, description: "created_at + RESERVATION_TTL_HOURS (72h)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | CONSUMED | RELEASED | EXPIRED | PREEMPTED" }

  - name: CallOut
    parent: null
    common_fields: true
    fields:
      - { name: branch_id, type: string, source: input, description: "FK -> Branch.id" }
      - { name: customer_id, type: string, source: input, description: "FK -> CustomerAccount.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: qty, type: integer, source: input, description: "Units demanded; >= 1" }
      - { name: call_out_fee_cents, type: integer, source: computed, default: 0, description: "After-hours fee per call_out_fee rule; computed at dispatch" }
      - { name: parts_amount_cents, type: integer, source: computed, default: 0, description: "qty * contract-lag unit price at fulfillment instant" }
      - { name: total_charge_cents, type: integer, source: computed, default: 0, description: "call_out_fee_cents + parts_amount_cents" }
      - { name: responder_id, type: string, source: system, default: null, description: "X-User-ID of the OnCallTechnician who dispatched" }
      - { name: preempted_reservation_ids, type: array, source: system, default: [], description: "StockReservation ids seized to satisfy this call-out, in preemption order (created_at DESC)" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | DISPATCHED | FULFILLED | STOCK_UNAVAILABLE | CANCELLED" }

  - name: ConsignmentAgreement
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> CustomerAccount.id" }
      - { name: branch_id, type: string, source: input, description: "FK -> Branch.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: consigned_qty, type: integer, source: input, description: "Total units placed at the customer plant; amendable via PATCH with OCC" }
      - { name: consumed_qty, type: integer, source: computed, default: 0, description: "Sum of qty over consumptions with status IN {REPORTED, INVOICED, DISPUTED} (CREDITED excluded)" }
      - { name: remaining_qty, type: integer, source: computed, description: "consigned_qty - consumed_qty" }
      - { name: pinned_unit_price_cents, type: integer, source: system, description: "Unit price pinned at creation via contract_lag_unit_price at creation instant (version-pinned on approval)" }
      - { name: billing_variant, type: enum, source: input, default: CONSUMPTION_FIFO, description: "CONSUMPTION_FIFO bills at pinned price; MONTHLY_SNAPSHOT bills at list price effective at month-end of the report month" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED | CLOSED" }

  - name: ConsignmentConsumption
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> ConsignmentAgreement.id" }
      - { name: qty, type: integer, source: input, description: "Units consumed; >= 1 and <= agreement.remaining_qty" }
      - { name: reported_at, type: datetime, source: system, description: "Logical clock instant when the customer reported the consumption" }
      - { name: unit_price_cents, type: integer, source: computed, default: null, description: "Priced at INVOICE time: pinned price (FIFO) or month-end list price (MONTHLY_SNAPSHOT); null until invoiced" }
      - { name: billed_amount_cents, type: integer, source: computed, default: 0, description: "unit_price_cents * qty once invoiced" }
      - { name: offset_applied_cents, type: integer, source: system, default: 0, description: "Portion of this invoice extinguished by return-credit netting" }
      - { name: status, type: enum, source: system, default: REPORTED, description: "REPORTED | INVOICED | DISPUTED | CREDITED" }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: order_line_id, type: string, source: input, default: null, description: "FK -> OrderLine.id; nullable, exactly one of order_line_id / consumption_id required" }
      - { name: consumption_id, type: string, source: input, default: null, description: "FK -> ConsignmentConsumption.id; nullable, exactly one of order_line_id / consumption_id required" }
      - { name: filed_by, type: string, source: system, description: "X-User-ID of the filing WarrantyAnalyst" }
      - { name: failure_mode, type: enum, source: input, description: "FATIGUE | CONTAMINATION | MISALIGNMENT | LUBRICATION | BRINELLING | OTHER" }
      - { name: operating_hours, type: integer, source: input, description: "Hours in service at failure; >= 0" }
      - { name: qty, type: integer, source: input, description: "Failed units; >= 1, may not exceed source line/consumption qty" }
      - { name: verdict, type: enum, source: system, default: NONE, description: "NONE | CONFIRMED_DEFECT | MISAPPLICATION | WEAR_OUT" }
      - { name: verdict_by, type: string, source: system, default: null, description: "X-User-ID of the QualityEngineer rendering the verdict (must differ from filed_by)" }
      - { name: coverage_pct, type: number, source: computed, default: 0, description: "Tiered by operating_hours when CONFIRMED_DEFECT per warranty_credit_tiered" }
      - { name: credit_amount_cents, type: integer, source: computed, default: 0, description: "round(source_unit_price * qty * coverage_pct), round_half_up" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | UNDER_ANALYSIS | APPROVED | DENIED | CREDIT_ISSUED" }

  - name: ReturnAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> CustomerAccount.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: branch_id, type: string, source: input, description: "FK -> Branch.id; receiving branch" }
      - { name: qty, type: integer, source: input, description: "Units authorized for return; >= 1 and <= customer's shipped qty of this product" }
      - { name: condition, type: enum, source: input, description: "SURPLUS | OBSOLETE" }
      - { name: original_unit_price_cents, type: integer, source: input, description: "Claimed original purchase unit price" }
      - { name: requested_by, type: string, source: system, description: "X-User-ID of the requester" }
      - { name: approved_by, type: string, source: system, default: null, description: "X-User-ID of approver; must differ from requested_by (segregation of duties)" }
      - { name: eligible_credit_cents, type: integer, source: computed, default: 0, description: "received_qty * min(original_unit_price_cents, current list) * (1 - RESTOCK_FEE_PCT); computed at receipt" }
      - { name: write_down_cents, type: integer, source: computed, default: 0, description: "OBSOLETE only: round(eligible_credit_cents * OBSOLETE_WRITE_DOWN_PCT)" }
      - { name: offset_applied_cents, type: integer, source: computed, default: 0, description: "Amount netted against outstanding consignment invoices, oldest first" }
      - { name: credit_memo_cents, type: integer, source: computed, default: 0, description: "eligible_credit_cents - write_down_cents - offset_applied_cents (>= 0 by construction)" }
      - { name: received_qty, type: integer, source: system, default: 0, description: "Units physically received (one-shot receipt, 1..qty)" }
      - { name: approved_at, type: datetime, source: system, default: null, description: "Approval instant; RMA receipt window is approved_at + RMA_WINDOW_DAYS" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | APPROVED | REJECTED | RECEIVED | CREDIT_ISSUED | EXPIRED" }

  - name: ServiceShop
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Repair shop name" }
      - { name: capabilities, type: array, source: input, description: "Product families the shop services (subset of family enum)" }
      - { name: region, type: string, source: input, description: "Service region tag" }
      - { name: labor_rate_cents, type: integer, source: input, description: "Hourly labor rate; used as selector ranking key" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | INACTIVE" }

  - name: ServiceReferral
    parent: null
    common_fields: true
    fields:
      - { name: warranty_claim_id, type: string, source: input, description: "FK -> WarrantyClaim.id; claim must have verdict MISAPPLICATION" }
      - { name: service_shop_id, type: string, source: system, description: "FK -> ServiceShop.id; chosen by referral_shop_selector (never client-supplied)" }
      - { name: region, type: string, source: input, description: "Required service region; selector eligibility filter" }
      - { name: quoted_amount_cents, type: integer, source: input, default: null, description: "Shop's repair quote, supplied at accept" }
      - { name: referral_fee_cents, type: integer, source: computed, default: 0, description: "min(round(quoted_amount_cents * REFERRAL_FEE_PCT), REFERRAL_FEE_CAP_CENTS); computed at completion" }
      - { name: declined_shop_ids, type: array, source: system, default: [], description: "ServiceShop ids that declined this claim; excluded from re-selection" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | ACCEPTED | DECLINED | COMPLETED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Product
    initial_state: ACTIVE
    terminal_states: [OBSOLETE]
    transitions:
      - from: ACTIVE
        to: PHASEOUT
        trigger: "PATCH /motion/products/{id} with status=PHASEOUT"
        actor: PricingAnalyst
        preconditions:
          - "Product must be ACTIVE (ERR_PRODUCT_NOT_ACTIVE)"
        side_effects: []
      - from: PHASEOUT
        to: OBSOLETE
        trigger: "PATCH /motion/products/{id} with status=OBSOLETE"
        actor: PricingAnalyst
        preconditions:
          - "Product must be PHASEOUT (ERR_PRODUCT_NOT_PHASEOUT)"
          - "If superseded_by_id supplied, target product must exist and be ACTIVE (ERR_SUPERSEDE_TARGET_INVALID)"
        side_effects:
          - "superseded_by_id persisted"
      - from: ACTIVE
        to: OBSOLETE
        trigger: "PATCH /motion/products/{id} with status=OBSOLETE"
        actor: PricingAnalyst
        preconditions:
          - "Product must be ACTIVE or PHASEOUT"
          - "If superseded_by_id supplied, target product must exist and be ACTIVE (ERR_SUPERSEDE_TARGET_INVALID)"
        side_effects:
          - "superseded_by_id persisted"

  - entity: CustomerContract
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /motion/contracts/{id}/activate"
        actor: ContractAdministrator
        preconditions:
          - "Contract must be DRAFT (ERR_CONTRACT_NOT_DRAFT)"
          - "effective_from < effective_to (ERR_CONTRACT_WINDOW_INVALID)"
          - "price_basis == CONTRACT_FIXED requires fixed_unit_price_cents present (ERR_CONTRACT_FIXED_PRICE_MISSING)"
          - "No other ACTIVE contract for same (customer_id, family) whose [effective_from, effective_to) half-open window overlaps this one; adjacency (this.effective_from == other.effective_to or this.effective_to == other.effective_from) is allowed (ERR_CONTRACT_WINDOW_OVERLAP)"
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic when logical clock >= effective_to; the half-open window end is exclusive)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: TERMINATED
        trigger: "POST /motion/contracts/{id}/terminate"
        actor: ContractAdministrator
        preconditions:
          - "Contract must be DRAFT or ACTIVE (ERR_CONTRACT_NOT_TERMINABLE)"
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /motion/contracts/{id}/terminate"
        actor: ContractAdministrator
        preconditions:
          - "Contract must be DRAFT or ACTIVE (ERR_CONTRACT_NOT_TERMINABLE)"
        side_effects: []

  - entity: PriceFileVersion
    initial_state: PENDING
    terminal_states: [EFFECTIVE, CANCELLED]
    transitions:
      - from: PENDING
        to: EFFECTIVE
        trigger: "system (automatic when logical clock >= effective_at)"
        actor: system
        preconditions: []
        side_effects:
          - "Product.list_price_cents := new_list_price_cents"
          - "Product.last_price_change_at := effective_at"
          - "Product.version += 1 and Product.updated_at refreshed"
          - "Any other PriceFileVersion of the same product in EFFECTIVE becomes SUPERSEDED"
      - from: EFFECTIVE
        to: SUPERSEDED
        trigger: "system (automatic when a newer PENDING price file of the same product becomes EFFECTIVE)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING
        to: CANCELLED
        trigger: "POST /motion/price-files/{id}/cancel"
        actor: PricingAnalyst
        preconditions:
          - "Price file must be PENDING (ERR_PRICE_FILE_NOT_PENDING)"
        side_effects: []
      - from: PENDING
        to: SUPERSEDED
        trigger: "system (automatic when a newer PENDING price file for the same product is published)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SalesOrder
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /motion/orders/{id}/confirm"
        actor: CounterSalesRep
        preconditions:
          - "Order must be DRAFT (ERR_ORDER_NOT_CONFIRMABLE)"
          - "At least one OrderLine exists (ERR_ORDER_HAS_NO_LINES)"
          - "CustomerAccount.credit_status == GOOD (ERR_CUSTOMER_CREDIT_HOLD)"
          - "CustomerAccount.open_receivables_cents + order.total_cents <= CustomerAccount.credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "priced_at := now; every line priced per contract_lag_unit_price with anchor T = order.created_at when price_variant == ORDER_DATE, else T = now (provisional)"
          - "expedite_fee_cents recomputed per line per expedite_fee_stacking"
          - "subtotal_cents / expedite_fees_cents / total_cents recomputed per order_total_aggregation"
      - from: CONFIRMED
        to: FULLY_SOURCED
        trigger: "system (automatic when every line's sourcing_status is in {STOCK_RESERVED, FACTORY_ORDERED, FACTORY_RECEIVED, ALLOCATED, SHIPPED})"
        actor: system
        preconditions: []
        side_effects: []
      - from: FULLY_SOURCED
        to: CONFIRMED
        trigger: "system (automatic when any line reverts to PENDING_SOURCING)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: PARTIALLY_SHIPPED
        trigger: "system (automatic when >= 1 line SHIPPED and >= 1 line not SHIPPED/CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FULLY_SOURCED
        to: PARTIALLY_SHIPPED
        trigger: "system (automatic when >= 1 line SHIPPED and >= 1 line not SHIPPED/CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: SHIPPED
        trigger: "system (automatic when all lines SHIPPED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FULLY_SOURCED
        to: SHIPPED
        trigger: "system (automatic when all lines SHIPPED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PARTIALLY_SHIPPED
        to: SHIPPED
        trigger: "system (automatic when all remaining lines reach SHIPPED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /motion/orders/{id}/cancel"
        actor: CounterSalesRep
        preconditions:
          - "fulfillment_status in {DRAFT, CONFIRMED, FULLY_SOURCED} and no line is SHIPPED (ERR_ORDER_NOT_CANCELLABLE)"
          - "billing_status == UNBILLED (ERR_ORDER_ALREADY_INVOICED)"
        side_effects:
          - "All non-terminal lines -> CANCELLED"
          - "All ACTIVE reservations of those lines -> RELEASED; BranchStock.reserved_qty recomputed (stock availability restored)"
          - "billing axis unchanged (remains UNBILLED)"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /motion/orders/{id}/cancel"
        actor: CounterSalesRep
        preconditions:
          - "fulfillment_status in {DRAFT, CONFIRMED, FULLY_SOURCED} and no line is SHIPPED (ERR_ORDER_NOT_CANCELLABLE)"
          - "billing_status == UNBILLED (ERR_ORDER_ALREADY_INVOICED)"
        side_effects:
          - "All non-terminal lines -> CANCELLED"
          - "All ACTIVE reservations of those lines -> RELEASED; BranchStock.reserved_qty recomputed"
      - from: FULLY_SOURCED
        to: CANCELLED
        trigger: "POST /motion/orders/{id}/cancel"
        actor: CounterSalesRep
        preconditions:
          - "fulfillment_status in {DRAFT, CONFIRMED, FULLY_SOURCED} and no line is SHIPPED (ERR_ORDER_NOT_CANCELLABLE)"
          - "billing_status == UNBILLED (ERR_ORDER_ALREADY_INVOICED)"
        side_effects:
          - "All non-terminal lines -> CANCELLED"
          - "All ACTIVE reservations of those lines -> RELEASED; BranchStock.reserved_qty recomputed"
      - from: SHIPPED
        to: CLOSED
        trigger: "POST /motion/orders/{id}/close"
        actor: BranchManager
        preconditions:
          - "fulfillment_status == SHIPPED (ERR_ORDER_NOT_FULLY_SHIPPED)"
          - "billing_status == PAID (ERR_ORDER_NOT_PAID)"
        side_effects: []
    parallel_axes_note: "billing_status evolves independently: UNBILLED -> INVOICED (POST /invoice, requires fulfillment_status == SHIPPED) -> PARTIALLY_PAID (0 < paid_cents < total_cents) -> PAID (paid_cents == total_cents). Neither axis mutation alters the other."

  - entity: OrderLine
    initial_state: PENDING_SOURCING
    terminal_states: [SHIPPED, CANCELLED]
    transitions:
      - from: PENDING_SOURCING
        to: STOCK_RESERVED
        trigger: "POST /motion/order-lines/{id}/reserve"
        actor: CounterSalesRep
        preconditions:
          - "Line must be PENDING_SOURCING (ERR_LINE_NOT_SOURCABLE)"
          - "Order must be CONFIRMED or FULLY_SOURCED (ERR_ORDER_NOT_CONFIRMABLE)"
          - "BranchStock must belong to the order's branch and reference the line's product (ERR_STOCK_LINE_MISMATCH)"
          - "qty must equal line qty (ERR_PARTIAL_RESERVATION)"
          - "BranchStock.available_qty >= qty (ERR_INSUFFICIENT_AVAILABLE_STOCK)"
        side_effects:
          - "StockReservation created (ACTIVE, expires_at = now + 72h)"
          - "BranchStock.reserved_qty recomputed"
          - "Order fulfillment re-evaluated (may become FULLY_SOURCED)"
      - from: STOCK_RESERVED
        to: PENDING_SOURCING
        trigger: "system (reservation RELEASED via /release, EXPIRED via clock, or PREEMPTED via call-out fulfillment)"
        actor: system
        preconditions: []
        side_effects:
          - "BranchStock.reserved_qty recomputed"
          - "Order fulfillment re-evaluated (FULLY_SOURCED reverts to CONFIRMED)"
      - from: PENDING_SOURCING
        to: FACTORY_ORDERED
        trigger: "POST /motion/order-lines/{id}/place-factory-order"
        actor: CounterSalesRep
        preconditions:
          - "Line must be PENDING_SOURCING (ERR_LINE_NOT_SOURCABLE)"
          - "Order must be CONFIRMED or FULLY_SOURCED (ERR_ORDER_NOT_CONFIRMABLE)"
          - "If expedite_tier == NONE or STANDARD and local hour >= branch.expedite_cutoff_hour, rejected (ERR_FACTORY_ORDER_CUTOFF_PASSED); RUSH/EMERGENCY exempt"
        side_effects:
          - "factory_ordered_at := now"
          - "Order fulfillment re-evaluated"
      - from: FACTORY_ORDERED
        to: FACTORY_RECEIVED
        trigger: "POST /motion/order-lines/{id}/receive-factory"
        actor: BranchManager
        preconditions:
          - "Line must be FACTORY_ORDERED (ERR_LINE_NOT_FACTORY_ORDERED)"
          - "now >= factory_ordered_at + effective lead time (ERR_FACTORY_LEAD_TIME_UNMET); effective lead = factory_lead_time_days, halved (floor 1 day) for RUSH, 0 days for EMERGENCY"
        side_effects:
          - "BranchStock.on_hand_qty += qty for the order's branch+product stock record (goods land on shelf before allocation)"
          - "Order fulfillment re-evaluated"
      - from: STOCK_RESERVED
        to: ALLOCATED
        trigger: "POST /motion/order-lines/{id}/allocate"
        actor: BranchManager
        preconditions:
          - "Line must be STOCK_RESERVED or FACTORY_RECEIVED (ERR_LINE_NOT_ALLOCATABLE)"
        side_effects:
          - "Reservation -> CONSUMED; BranchStock.on_hand_qty -= qty; reserved_qty recomputed"
      - from: FACTORY_RECEIVED
        to: ALLOCATED
        trigger: "POST /motion/order-lines/{id}/allocate"
        actor: BranchManager
        preconditions:
          - "Line must be STOCK_RESERVED or FACTORY_RECEIVED (ERR_LINE_NOT_ALLOCATABLE)"
        side_effects:
          - "BranchStock.on_hand_qty -= qty (picked from shelf)"
      - from: ALLOCATED
        to: SHIPPED
        trigger: "POST /motion/order-lines/{id}/ship"
        actor: BranchManager
        preconditions:
          - "Line must be ALLOCATED (ERR_LINE_NOT_SHIPPABLE)"
        side_effects:
          - "shipped_at := now"
          - "If order.price_variant == SHIP_DATE: line re-priced per contract_lag_unit_price with anchor T = shipped_at; line_total_cents, order subtotal/expedite_fees/total recomputed"
          - "Order fulfillment re-evaluated (PARTIALLY_SHIPPED or SHIPPED)"
      - from: PENDING_SOURCING
        to: CANCELLED
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: STOCK_RESERVED
        to: CANCELLED
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "ACTIVE reservation -> RELEASED; BranchStock.reserved_qty recomputed"
      - from: FACTORY_ORDERED
        to: CANCELLED
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FACTORY_RECEIVED
        to: CANCELLED
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: StockReservation
    initial_state: ACTIVE
    terminal_states: [CONSUMED, RELEASED, EXPIRED, PREEMPTED]
    transitions:
      - from: ACTIVE
        to: CONSUMED
        trigger: "system (line allocation)"
        actor: system
        preconditions: []
        side_effects:
          - "BranchStock.reserved_qty recomputed"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /motion/stock-reservations/{id}/release or order cancel cascade"
        actor: CounterSalesRep | BranchManager | system
        preconditions:
          - "Reservation must be ACTIVE (ERR_RESERVATION_NOT_ACTIVE)"
        side_effects:
          - "OrderLine STOCK_RESERVED -> PENDING_SOURCING; BranchStock.reserved_qty recomputed; order fulfillment re-evaluated"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic when logical clock > expires_at)"
        actor: system
        preconditions: []
        side_effects:
          - "OrderLine STOCK_RESERVED -> PENDING_SOURCING (hop 2)"
          - "BranchStock.reserved_qty recomputed (hop 2)"
          - "Order FULLY_SOURCED reverts to CONFIRMED (hop 3)"
      - from: ACTIVE
        to: PREEMPTED
        trigger: "system (call-out fulfillment seizes reserved stock)"
        actor: system
        preconditions: []
        side_effects:
          - "OrderLine STOCK_RESERVED -> PENDING_SOURCING (hop 2)"
          - "BranchStock.reserved_qty recomputed (hop 2)"
          - "Order FULLY_SOURCED reverts to CONFIRMED (hop 3)"

  - entity: CallOut
    initial_state: REQUESTED
    terminal_states: [FULFILLED, STOCK_UNAVAILABLE, CANCELLED]
    transitions:
      - from: REQUESTED
        to: DISPATCHED
        trigger: "POST /motion/call-outs/{id}/dispatch"
        actor: OnCallTechnician
        preconditions:
          - "Call-out must be REQUESTED (ERR_CALL_OUT_NOT_REQUESTED)"
          - "Branch local time must be after-hours: local_hour < business_open_hour OR local_hour >= business_close_hour (ERR_CALL_OUT_NOT_AFTER_HOURS)"
          - "Branch must have zero other call-outs in DISPATCHED status (one-truck capacity) (ERR_BRANCH_CALLOUT_CAPACITY)"
        side_effects:
          - "responder_id := X-User-ID"
          - "call_out_fee_cents computed per call_out_fee (weekend multiplier applies)"
      - from: DISPATCHED
        to: FULFILLED
        trigger: "POST /motion/call-outs/{id}/fulfill"
        actor: OnCallTechnician
        preconditions:
          - "Call-out must be DISPATCHED (ERR_CALL_OUT_NOT_DISPATCHED)"
          - "BranchStock.on_hand_qty >= qty for the branch+product (else -> STOCK_UNAVAILABLE)"
        side_effects:
          - "If available_qty < qty: seize ACTIVE reservations for this branch+product in created_at DESC order until covered; each seized reservation -> PREEMPTED (hop 1), its OrderLine -> PENDING_SOURCING (hop 2), its order fulfillment re-evaluated (hop 3)"
          - "BranchStock.on_hand_qty -= qty; reserved_qty recomputed"
          - "parts_amount_cents := qty * contract_lag_unit_price(T = now) for the customer+product"
          - "total_charge_cents := call_out_fee_cents + parts_amount_cents"
          - "CustomerAccount.open_receivables_cents += total_charge_cents"
      - from: DISPATCHED
        to: STOCK_UNAVAILABLE
        trigger: "system (fulfill when on_hand_qty < qty)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /motion/call-outs/{id}/cancel"
        actor: OnCallTechnician | CustomerPlant
        preconditions:
          - "Call-out must be REQUESTED or DISPATCHED (ERR_CALL_OUT_NOT_CANCELLABLE)"
          - "CustomerPlant may only cancel own customer's call-out"
        side_effects: []
      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /motion/call-outs/{id}/cancel"
        actor: OnCallTechnician | CustomerPlant
        preconditions:
          - "Call-out must be REQUESTED or DISPATCHED (ERR_CALL_OUT_NOT_CANCELLABLE)"
        side_effects: []

  - entity: ConsignmentAgreement
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /motion/consignment-agreements/{id}/suspend"
        actor: ContractAdministrator
        preconditions:
          - "Agreement must be ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /motion/consignment-agreements/{id}/resume"
        actor: ContractAdministrator
        preconditions:
          - "Agreement must be SUSPENDED (ERR_AGREEMENT_NOT_SUSPENDED)"
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /motion/consignment-agreements/{id}/close"
        actor: ContractAdministrator
        preconditions:
          - "Agreement must be ACTIVE or SUSPENDED (ERR_AGREEMENT_NOT_CLOSABLE)"
          - "No consumptions in REPORTED or DISPUTED status (ERR_AGREEMENT_CLOSE_BLOCKED)"
        side_effects:
          - "BranchStock.on_hand_qty += remaining_qty (unconsumed stock returns to branch shelf)"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /motion/consignment-agreements/{id}/close"
        actor: ContractAdministrator
        preconditions:
          - "Agreement must be ACTIVE or SUSPENDED (ERR_AGREEMENT_NOT_CLOSABLE)"
          - "No consumptions in REPORTED or DISPUTED status (ERR_AGREEMENT_CLOSE_BLOCKED)"
        side_effects:
          - "BranchStock.on_hand_qty += remaining_qty"

  - entity: ConsignmentConsumption
    initial_state: REPORTED
    terminal_states: [INVOICED, CREDITED]
    transitions:
      - from: REPORTED
        to: INVOICED
        trigger: "POST /motion/consignment-consumptions/{id}/invoice"
        actor: BranchManager
        preconditions:
          - "Consumption must be REPORTED (ERR_CONSUMPTION_NOT_REPORTED)"
        side_effects:
          - "unit_price_cents / billed_amount_cents computed per consignment_consumption_billing (variant-dependent)"
          - "CustomerAccount.open_receivables_cents += billed_amount_cents"
      - from: INVOICED
        to: DISPUTED
        trigger: "POST /motion/consignment-consumptions/{id}/dispute"
        actor: CustomerPlant
        preconditions:
          - "Consumption must be INVOICED (ERR_CONSUMPTION_NOT_INVOICED)"
          - "CustomerPlant identity must match the agreement's customer"
        side_effects: []
      - from: DISPUTED
        to: CREDITED
        trigger: "POST /motion/consignment-consumptions/{id}/credit"
        actor: BranchManager
        preconditions:
          - "Consumption must be DISPUTED or INVOICED (ERR_CONSUMPTION_NOT_CREDITABLE)"
        side_effects:
          - "CustomerAccount.open_receivables_cents -= (billed_amount_cents - offset_applied_cents)"
          - "Agreement consumed_qty recomputed excluding CREDITED (remaining_qty restored)"
      - from: INVOICED
        to: CREDITED
        trigger: "POST /motion/consignment-consumptions/{id}/credit or system (warranty cross-effect at claim issue-credit)"
        actor: BranchManager | system
        preconditions:
          - "Consumption must be DISPUTED or INVOICED (ERR_CONSUMPTION_NOT_CREDITABLE)"
        side_effects:
          - "CustomerAccount.open_receivables_cents -= (billed_amount_cents - offset_applied_cents)"
          - "Agreement consumed_qty recomputed excluding CREDITED (remaining_qty restored)"

  - entity: WarrantyClaim
    initial_state: SUBMITTED
    terminal_states: [DENIED, CREDIT_ISSUED]
    transitions:
      - from: SUBMITTED
        to: UNDER_ANALYSIS
        trigger: "POST /motion/warranty-claims/{id}/begin-analysis"
        actor: QualityEngineer
        preconditions:
          - "Claim must be SUBMITTED (ERR_CLAIM_NOT_SUBMITTED)"
        side_effects: []
      - from: UNDER_ANALYSIS
        to: SUBMITTED
        trigger: "POST /motion/warranty-claims/{id}/request-info"
        actor: QualityEngineer
        preconditions:
          - "Claim must be UNDER_ANALYSIS (ERR_CLAIM_NOT_UNDER_ANALYSIS)"
        side_effects: []
      - from: UNDER_ANALYSIS
        to: APPROVED
        trigger: "POST /motion/warranty-claims/{id}/verdict with verdict=CONFIRMED_DEFECT"
        actor: QualityEngineer
        preconditions:
          - "Claim must be UNDER_ANALYSIS (ERR_CLAIM_NOT_UNDER_ANALYSIS)"
          - "X-User-ID != filed_by (segregation of duties) (ERR_WARRANTY_SOD_VERDICT)"
          - "If order_line_id set: line sourcing_status must be SHIPPED (ERR_CLAIM_SOURCE_NOT_FINAL); if consumption_id set: consumption status must be INVOICED or REPORTED"
        side_effects:
          - "verdict, verdict_by persisted"
          - "coverage_pct and credit_amount_cents computed per warranty_credit_tiered"
      - from: UNDER_ANALYSIS
        to: DENIED
        trigger: "POST /motion/warranty-claims/{id}/verdict with verdict=MISAPPLICATION or WEAR_OUT"
        actor: QualityEngineer
        preconditions:
          - "Claim must be UNDER_ANALYSIS (ERR_CLAIM_NOT_UNDER_ANALYSIS)"
          - "X-User-ID != filed_by (ERR_WARRANTY_SOD_VERDICT)"
        side_effects:
          - "verdict, verdict_by persisted; coverage_pct := 0; credit_amount_cents := 0"
      - from: APPROVED
        to: CREDIT_ISSUED
        trigger: "POST /motion/warranty-claims/{id}/issue-credit"
        actor: BranchManager
        preconditions:
          - "Claim must be APPROVED (ERR_CLAIM_NOT_APPROVED)"
        side_effects:
          - "CustomerAccount.open_receivables_cents -= credit_amount_cents"
          - "If consumption_id set and claim qty == consumption qty: consumption INVOICED -> CREDITED (hop 1); agreement consumed_qty/remaining_qty recomputed excluding CREDITED (hop 2); receivables adjustment for the consumption folds into the claim credit (no double count: consumption credit path skipped when warranty credit already applied)"

  - entity: ReturnAuthorization
    initial_state: REQUESTED
    terminal_states: [REJECTED, CREDIT_ISSUED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /motion/return-authorizations/{id}/approve"
        actor: BranchManager
        preconditions:
          - "Return must be REQUESTED (ERR_RETURN_NOT_REQUESTED)"
          - "X-User-ID != requested_by (segregation of duties) (ERR_RETURN_SOD_APPROVAL)"
          - "qty <= customer's cumulative shipped qty for this product across all orders (ERR_RETURN_QTY_EXCEEDS_SHIPPED)"
        side_effects:
          - "approved_by, approved_at persisted"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /motion/return-authorizations/{id}/reject"
        actor: BranchManager
        preconditions:
          - "Return must be REQUESTED (ERR_RETURN_NOT_REQUESTED)"
          - "X-User-ID != requested_by (ERR_RETURN_SOD_APPROVAL)"
        side_effects: []
      - from: APPROVED
        to: RECEIVED
        trigger: "POST /motion/return-authorizations/{id}/receive"
        actor: BranchManager
        preconditions:
          - "Return must be APPROVED (ERR_RETURN_NOT_APPROVED)"
          - "now <= approved_at + RMA_WINDOW_DAYS (ERR_RMA_WINDOW_EXPIRED)"
          - "1 <= received_qty <= qty (ERR_INVALID_RECEIVED_QTY)"
        side_effects:
          - "eligible_credit_cents / write_down_cents computed per return_credit_netting_waterfall (using received_qty)"
          - "If condition == SURPLUS and product status == ACTIVE: BranchStock.on_hand_qty += received_qty; OBSOLETE units are scrapped (no stock addition)"
      - from: APPROVED
        to: EXPIRED
        trigger: "system (automatic when logical clock > approved_at + RMA_WINDOW_DAYS and not yet RECEIVED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RECEIVED
        to: CREDIT_ISSUED
        trigger: "POST /motion/return-authorizations/{id}/issue-credit"
        actor: BranchManager
        preconditions:
          - "Return must be RECEIVED (ERR_RETURN_NOT_RECEIVED)"
        side_effects:
          - "Netting waterfall: nettable = eligible_credit_cents - write_down_cents; offset consignment consumptions of this customer with status INVOICED and outstanding (billed - offset_applied > 0), oldest created_at first, until nettable exhausted; each consumption.offset_applied_cents increased (hop 1); offset_applied_cents := total offset"
          - "credit_memo_cents := nettable - offset_applied_cents"
          - "CustomerAccount.open_receivables_cents -= offset_applied_cents (receivable extinguished) and -= credit_memo_cents (memo reduces future obligations) (hop 2)"

  - entity: ServiceReferral
    initial_state: OPEN
    terminal_states: [COMPLETED]
    transitions:
      - from: OPEN
        to: ACCEPTED
        trigger: "POST /motion/service-referrals/{id}/accept"
        actor: ServiceShop
        preconditions:
          - "Referral must be OPEN (ERR_REFERRAL_NOT_OPEN)"
          - "X-User-ID must equal service_shop_id (ERR_REFERRAL_SHOP_MISMATCH)"
          - "quoted_amount_cents >= 1 (ERR_INVALID_REQUEST)"
        side_effects:
          - "quoted_amount_cents persisted"
      - from: OPEN
        to: DECLINED
        trigger: "POST /motion/service-referrals/{id}/decline"
        actor: ServiceShop
        preconditions:
          - "Referral must be OPEN (ERR_REFERRAL_NOT_OPEN)"
          - "X-User-ID must equal service_shop_id (ERR_REFERRAL_SHOP_MISMATCH)"
        side_effects:
          - "shop id appended to declined_shop_ids of the claim's referral chain"
          - "system immediately creates a successor ServiceReferral (OPEN) for the same claim via referral_shop_selector excluding all declined_shop_ids; if no eligible shop remains, no successor is created (claim stays without an open referral)"
      - from: ACCEPTED
        to: COMPLETED
        trigger: "POST /motion/service-referrals/{id}/complete"
        actor: ServiceShop
        preconditions:
          - "Referral must be ACCEPTED (ERR_REFERRAL_NOT_ACCEPTED)"
          - "X-User-ID must equal service_shop_id (ERR_REFERRAL_SHOP_MISMATCH)"
        side_effects:
          - "referral_fee_cents := min(round(quoted_amount_cents * REFERRAL_FEE_PCT), REFERRAL_FEE_CAP_CENTS)"


# =============================================================================
# §1.2.1 Concurrency Rules (OCC only — true races per serial-observability filter)
# =============================================================================
concurrency_rules:
  - rule_id: order-reprice-stale-version
    parent_entity: SalesOrder
    write_endpoint: "POST /motion/orders/{id}/reprice"
    occ_field: expected_order_version
    description: |
      Re-pricing an order against a SalesOrder.version the client no longer
      holds is rejected. A reprice issued after any other mutation of the order
      (line add, expedite change, confirm, or an earlier reprice) would
      otherwise legitimately succeed on a stale view; the OCC check forces the
      client to re-read the order before re-pricing.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: agreement-amend-stale-version
    parent_entity: ConsignmentAgreement
    write_endpoint: "PATCH /motion/consignment-agreements/{id}"
    occ_field: expected_agreement_version
    description: |
      Amending consigned_qty against a ConsignmentAgreement.version the client
      no longer holds is rejected. A consumption reported after the client's
      last read legitimately advanced the agreement (consumed_qty changed), so
      the amendment must be rebased on a fresh read before it may proceed.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: price-file-publish-stale-product
    parent_entity: Product
    write_endpoint: "POST /motion/price-files"
    occ_field: expected_product_version
    description: |
      Publishing a price file against a Product.version the client no longer
      holds is rejected. Publishing legitimately supersedes the product's
      currently PENDING price file (create-with-supersede), so a writer whose
      view predates another publish would unknowingly supersede a file it never
      saw; the OCC check forces a fresh read of the product first.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: contract_lag_unit_price
    trigger: "Order confirm, order reprice, line ship (SHIP_DATE variant), consignment agreement creation (pins pinned_unit_price_cents), call-out fulfillment (parts pricing)"
    algorithm: tiered_pricing
    formula: |
      Inputs: customer, product, anchor instant T, order-variant context.
      1. list_price(T) := new_list_price_cents of the EFFECTIVE PriceFileVersion
         of this product with the greatest effective_at <= T; if none, the
         product's list_price_cents as originally created (i.e., current
         list_price_cents when last_price_change_at is null).
      2. Contract lookup: the ACTIVE CustomerContract with
         customer_id == customer, family == product.family, and
         effective_from <= T < effective_to (half-open). At most one can exist.
      3. If contract present:
           CONTRACT_FIXED -> candidate := fixed_unit_price_cents
           LIST_LESS      -> candidate := round_half_up(list_price(T) * (1 - discount_pct)) to integer cents
         else candidate := list_price(T).
      4. Lag protection (one-way, protects against increases only):
           If contract present AND lag_protection_days > 0 AND
           product.last_price_change_at E is not null AND T < E + lag_days
           AND list_price(E) [new price] > list_price just before E
           [previous price, i.e. the EFFECTIVE file with greatest
           effective_at < E, else the pre-change product price]:
             protected_candidate := price recomputed as in step 3 but with
               list_price(T) replaced by the pre-increase price;
             if protected_candidate < candidate:
               candidate := protected_candidate; price_protection_applied := true
           else price_protection_applied := false.
      5. Price decreases always pass through immediately (no protection).
    input_set: "The single ACTIVE overlapping contract (status == ACTIVE, window contains T); price files of the product with status EFFECTIVE and effective_at <= T; PENDING/CANCELLED/SUPERSEDED files excluded"
    constants:
      ROUNDING: round_half_up to integer cents
    precision: "0 decimal places (integer cents), round_half_up"
    variants:
      - name: ORDER_DATE
        when: "SalesOrder.price_variant == ORDER_DATE (confirm, reprice)"
        difference: "Anchor T := SalesOrder.created_at; price is locked at confirm and never recomputed at ship"
      - name: SHIP_DATE
        when: "SalesOrder.price_variant == SHIP_DATE (confirm/reprice provisional; ship final)"
        difference: "Anchor T := now at confirm/reprice (provisional), then T := shipped_at at ship (final); the two anchors may straddle a price-file effective instant and produce different unit prices for identical line data"

  - name: expedite_fee_stacking
    trigger: "Order confirm, reprice, line expedite-tier change; recomputed again only if the underlying protected amount changes"
    algorithm: tiered_pricing
    formula: |
      Per line, in this exact order (stacking order pinned):
      1. protected_amount := unit_price_cents * qty   (post-lag-protection unit price)
      2. pct portion by tier:
           NONE      -> 0
           STANDARD  -> 0   (STANDARD is flat-only)
           RUSH      -> round_half_up(0.08 * protected_amount)
           EMERGENCY -> round_half_up(0.15 * protected_amount)
      3. after-cutoff multiplier applied to the pct portion ONLY:
           if local confirm hour >= branch.expedite_cutoff_hour and tier in {RUSH, EMERGENCY}:
             pct := round_half_up(pct * 1.25)
      4. flat portion by tier:
           NONE -> 0; STANDARD -> 1500; RUSH -> 0; EMERGENCY -> 0
      5. fee := flat + pct, then floored at tier minimum:
           RUSH floor 2500; EMERGENCY floor 5000; others no floor.
         expedite_fee_cents := max(fee, tier_minimum)
    input_set: "Lines of the order being priced; branch = order's branch"
    constants:
      RUSH_PCT: 0.08
      EMERGENCY_PCT: 0.15
      AFTER_CUTOFF_MULT: 1.25
      STANDARD_FLAT_CENTS: 1500
      RUSH_MIN_CENTS: 2500
      EMERGENCY_MIN_CENTS: 5000
    precision: "0 decimal places (integer cents), round_half_up at each rounding step"

  - name: order_total_aggregation
    trigger: "Any line add/expedite/confirm/reprice/ship that changes a line price or fee"
    algorithm: aggregation
    formula: |
      Rounding order is pinned (nested rounding, per-line first):
      1. Per line: goods := round_half_up(unit_price_cents * qty)   [unit price already integer cents, so this is exact unless a discount produced fractional cents upstream]
      2. line_total_cents := goods + expedite_fee_cents (fee already rounded)
      3. subtotal_cents := SUM(goods) over non-CANCELLED lines
      4. expedite_fees_cents := SUM(expedite_fee_cents) over non-CANCELLED lines
      5. total_cents := subtotal_cents + expedite_fees_cents
      (Sum-then-round at order level is FORBIDDEN: unit-price rounding happens
      per line before summation; the two orders can differ by cents.)
    input_set: "OrderLines of the order with sourcing_status != CANCELLED"
    precision: "0 decimal places (integer cents), round_half_up, per-line before sum"

  - name: consignment_consumption_billing
    trigger: "POST /motion/consignment-consumptions/{id}/invoice"
    algorithm: aggregation
    formula: |
      Variant CONSUMPTION_FIFO:
        unit_price_cents := agreement.pinned_unit_price_cents
      Variant MONTHLY_SNAPSHOT:
        month_end := last instant of the calendar month (UTC) containing reported_at
        unit_price_cents := list_price(month_end) per the price-file history
          (greatest effective_at <= month_end; else product creation list price)
      billed_amount_cents := unit_price_cents * qty (integer cents, exact)
    input_set: "The single consumption being invoiced; its agreement; price files of the agreement's product with status EFFECTIVE"
    precision: "0 decimal places (integer cents)"
    variants:
      - name: CONSUMPTION_FIFO
        when: "agreement.billing_variant == CONSUMPTION_FIFO"
        difference: "Bills at the agreement's pinned_unit_price_cents (price at agreement creation); later list changes never affect it"
      - name: MONTHLY_SNAPSHOT
        when: "agreement.billing_variant == MONTHLY_SNAPSHOT"
        difference: "Bills at the list price effective at month-end of the report month; a mid-month price increase between agreement creation and month-end yields a different billed amount than CONSUMPTION_FIFO for identical consumption data"

  - name: warranty_credit_tiered
    trigger: "POST /motion/warranty-claims/{id}/verdict with verdict=CONFIRMED_DEFECT"
    algorithm: threshold
    formula: |
      If verdict == CONFIRMED_DEFECT:
        coverage_pct := 1.00 if operating_hours < 2000
                        0.50 if 2000 <= operating_hours < 5000
                        0.25 if operating_hours >= 5000
        source_unit := order-linked: OrderLine.unit_price_cents
                       consignment-linked: ConsignmentConsumption.unit_price_cents
                       if invoiced else agreement.pinned_unit_price_cents
        credit_amount_cents := round_half_up(source_unit * qty * coverage_pct)
      If verdict in {MISAPPLICATION, WEAR_OUT}: coverage_pct := 0; credit := 0
      Boundaries: operating_hours == 2000 -> 0.50; == 5000 -> 0.25 (lower bound inclusive).
    input_set: "The claim; its source OrderLine or ConsignmentConsumption"
    constants:
      TIER1_HOURS: 2000
      TIER2_HOURS: 5000
      TIER1_COVERAGE: 1.00
      TIER2_COVERAGE: 0.50
      TIER3_COVERAGE: 0.25
    precision: "0 decimal places (integer cents), round_half_up"

  - name: return_credit_netting_waterfall
    trigger: "POST /motion/return-authorizations/{id}/receive (credit computation), POST /motion/return-authorizations/{id}/issue-credit (waterfall application)"
    algorithm: waterfall_allocation
    formula: |
      At receive:
        base := received_qty * min(original_unit_price_cents, current list_price_cents of product)
        eligible_credit_cents := round_half_up(base * (1 - 0.15))
        write_down_cents := round_half_up(eligible_credit_cents * 0.50) if condition == OBSOLETE else 0
      At issue-credit (buckets in strict order):
        nettable := eligible_credit_cents - write_down_cents
        Bucket 1: outstanding consignment invoices of this customer
                  (status == INVOICED, outstanding = billed_amount_cents - offset_applied_cents > 0),
                  filled oldest-first by ConsignmentConsumption.created_at ASC;
                  each bucket filled to its full outstanding before the next.
        offset_applied_cents := sum applied to bucket 1 (<= nettable)
        Bucket 2: credit_memo_cents := nettable - offset_applied_cents
      Conservation invariant: eligible_credit_cents == write_down_cents + offset_applied_cents + credit_memo_cents at all times after issue-credit.
    input_set: "The return; the customer's ConsignmentConsumptions with status == INVOICED and outstanding > 0, ordered created_at ASC (ties broken by reported_at ASC)"
    constants:
      RESTOCK_FEE_PCT: 0.15
      OBSOLETE_WRITE_DOWN_PCT: 0.50
    precision: "0 decimal places (integer cents), round_half_up"

  - name: available_stock
    trigger: "Read of BranchStock; reservation create/release/expire/preempt/consume; consignment create/close; call-out fulfill; factory receive; return receive; /adjust"
    algorithm: aggregation
    formula: |
      reserved_qty := SUM(qty) over StockReservations of this BranchStock with status == ACTIVE
      (CONSUMED, RELEASED, EXPIRED, PREEMPTED excluded)
      available_qty := on_hand_qty - reserved_qty
    input_set: "StockReservations of this BranchStock with status == ACTIVE only"
    precision: "integer units, exact"

  - name: call_out_fee
    trigger: "POST /motion/call-outs/{id}/dispatch"
    algorithm: tiered_pricing
    formula: |
      local_time := now shifted by branch.timezone_offset_hours
      is_weekend := local_time weekday is Saturday or Sunday
      fee := branch.after_hours_fee_cents
      if is_weekend: fee := round_half_up(fee * 1.5)
      call_out_fee_cents := fee + qty * 250
      (After-hours eligibility is a dispatch precondition, not part of the fee.)
    input_set: "The call-out; its branch"
    constants:
      WEEKEND_FEE_MULTIPLIER: 1.5
      PER_UNIT_HANDLING_CENTS: 250
    precision: "0 decimal places (integer cents), round_half_up"

  - name: referral_shop_selector
    trigger: "POST /motion/service-referrals; also automatic successor creation after a decline"
    algorithm: weighted_scoring
    formula: |
      Eligibility filter (all must hold):
        shop.status == ACTIVE
        claim product family IN shop.capabilities
        shop.region == referral region
        shop.id NOT IN declined_shop_ids of this claim's referral chain
      Ranking: labor_rate_cents ASC; tie-break: shop.created_at ASC.
      Fallback: empty candidate set -> POST fails with ERR_NO_ELIGIBLE_SHOP;
        on decline-driven re-selection, empty set -> no successor created.
      (Selector must never use shop.id for ranking or tie-break.)
    input_set: "All ServiceShops; the claim's declined_shop_ids"
    constants: {}
    precision: "n/a"

  - name: open_receivables_reconciliation
    trigger: "Order invoice/payment, consumption invoice/credit, call-out fulfill, warranty issue-credit, return issue-credit"
    algorithm: aggregation
    formula: |
      open_receivables_cents :=
          SUM over SalesOrders of customer with billing_status IN {INVOICED, PARTIALLY_PAID}
              of (total_cents - paid_cents)
        + SUM over ConsignmentConsumptions of customer's agreements with status == INVOICED
              of (billed_amount_cents - offset_applied_cents)
        + SUM over CallOuts of customer with status == FULFILLED of total_charge_cents
        - SUM over WarrantyClaims of customer with status == CREDIT_ISSUED of credit_amount_cents
        - SUM over ReturnAuthorizations of customer with status == CREDIT_ISSUED
              of (offset_applied_cents + credit_memo_cents)
      May go negative (credit balance). Recomputed eagerly on every contributing
      mutation; the value is visible in the same response that caused the change
      (immediate consistency).
    input_set: "Per-customer sets exactly as filtered above (status filters are part of the definition)"
    precision: "0 decimal places (integer cents)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role must be permitted for this endpoint per §1.5 roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path resource ids must exist, validated left-to-right; body-supplied FK references (customer_id, branch_id, product_id, order_line_id, consumption_id, branch_stock_id, warranty_claim_id) must also exist before any state or business rule runs"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (ERR_PRODUCT_NOT_FOUND, ERR_CUSTOMER_NOT_FOUND, ERR_CONTRACT_NOT_FOUND, ERR_BRANCH_NOT_FOUND, ERR_BRANCH_STOCK_NOT_FOUND, ERR_PRICE_FILE_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_ORDER_LINE_NOT_FOUND, ERR_RESERVATION_NOT_FOUND, ERR_CALL_OUT_NOT_FOUND, ERR_AGREEMENT_NOT_FOUND, ERR_CONSUMPTION_NOT_FOUND, ERR_CLAIM_NOT_FOUND, ERR_RETURN_NOT_FOUND, ERR_SHOP_NOT_FOUND, ERR_REFERRAL_NOT_FOUND, ERR_INTERCHANGE_NOT_FOUND)"
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: auth
    check: "Entity-backed identity: CustomerPlant may only act on resources of its own customer account; ServiceShop may only act on referrals whose service_shop_id equals its id"
    error_id: ERR_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "POST /motion/consignment-agreements/{id}/consumptions, POST /motion/consignment-consumptions/{id}/dispute, POST /motion/call-outs/{id}/cancel (CustomerPlant), POST /motion/service-referrals/{id}/accept|decline|complete, POST /motion/return-authorizations (CustomerPlant body customer_id)"

  - priority: 5
    category: state
    check: "Target resource must be in the required state for the requested transition (per §1.2 preconditions)"
    error_id: "state-specific (ERR_ORDER_NOT_CONFIRMABLE, ERR_LINE_NOT_SOURCABLE, ERR_LINE_NOT_ALLOCATABLE, ERR_LINE_NOT_SHIPPABLE, ERR_LINE_NOT_FACTORY_ORDERED, ERR_ORDER_NOT_CANCELLABLE, ERR_ORDER_ALREADY_INVOICED, ERR_ORDER_NOT_FULLY_SHIPPED, ERR_ORDER_NOT_PAID, ERR_ORDER_HAS_NO_LINES, ERR_RESERVATION_NOT_ACTIVE, ERR_CALL_OUT_NOT_REQUESTED, ERR_CALL_OUT_NOT_DISPATCHED, ERR_CALL_OUT_NOT_CANCELLABLE, ERR_AGREEMENT_NOT_ACTIVE, ERR_AGREEMENT_NOT_SUSPENDED, ERR_AGREEMENT_NOT_CLOSABLE, ERR_CONSUMPTION_NOT_REPORTED, ERR_CONSUMPTION_NOT_INVOICED, ERR_CONSUMPTION_NOT_CREDITABLE, ERR_CLAIM_NOT_SUBMITTED, ERR_CLAIM_NOT_UNDER_ANALYSIS, ERR_CLAIM_NOT_APPROVED, ERR_RETURN_NOT_REQUESTED, ERR_RETURN_NOT_APPROVED, ERR_RETURN_NOT_RECEIVED, ERR_REFERRAL_NOT_OPEN, ERR_REFERRAL_NOT_ACCEPTED, ERR_PRICE_FILE_NOT_PENDING, ERR_PRODUCT_NOT_ACTIVE, ERR_PRODUCT_NOT_PHASEOUT, ERR_CONTRACT_NOT_DRAFT, ERR_CONTRACT_NOT_TERMINABLE)"
    http_status: 409
    applies_to: "all action/transition endpoints"

  - priority: 6
    category: business_safety
    check: "Segregation of duties: warranty verdict X-User-ID must differ from claim.filed_by; return approve/reject X-User-ID must differ from return.requested_by"
    error_id: "ERR_WARRANTY_SOD_VERDICT | ERR_RETURN_SOD_APPROVAL"
    http_status: 403
    applies_to: "POST /motion/warranty-claims/{id}/verdict, POST /motion/return-authorizations/{id}/approve, POST /motion/return-authorizations/{id}/reject"

  - priority: 7
    category: business_constraint
    check: "Shape/uniqueness constraints: required fields present (ERR_INVALID_REQUEST); qty >= 1; branch business_close_hour > business_open_hour; contract effective_from < effective_to (ERR_CONTRACT_WINDOW_INVALID); CONTRACT_FIXED requires fixed_unit_price_cents (ERR_CONTRACT_FIXED_PRICE_MISSING); product sku unique (ERR_DUPLICATE_SKU); branch code unique (ERR_DUPLICATE_BRANCH_CODE); no overlapping ACTIVE contract window per (customer_id, family) (ERR_CONTRACT_WINDOW_OVERLAP); at most one non-CLOSED consignment agreement per (customer_id, branch_id, product_id) (ERR_DUPLICATE_AGREEMENT); claim references exactly one of order_line_id / consumption_id (ERR_CLAIM_REFERENCE_INVALID)"
    error_id: "constraint-specific (listed in check)"
    http_status: 400
    applies_to: "create and activate endpoints"

  - priority: 8
    category: business_temporal
    check: "Time-window rules: price file effective_at strictly in the future at publish (ERR_EFFECTIVE_AT_IN_PAST); call-out dispatch only after-hours (ERR_CALL_OUT_NOT_AFTER_HOURS); one DISPATCHED call-out per branch at a time (ERR_BRANCH_CALLOUT_CAPACITY); factory order cutoff for NONE/STANDARD tiers (ERR_FACTORY_ORDER_CUTOFF_PASSED); factory receipt only after effective lead time (ERR_FACTORY_LEAD_TIME_UNMET); return receipt within RMA window (ERR_RMA_WINDOW_EXPIRED)"
    error_id: "temporal-specific (listed in check)"
    http_status: 409
    applies_to: "POST /motion/price-files, POST /motion/call-outs/{id}/dispatch, POST /motion/order-lines/{id}/place-factory-order, POST /motion/order-lines/{id}/receive-factory, POST /motion/return-authorizations/{id}/receive"

  - priority: 9
    category: business_referential
    check: "Cross-entity referential rules: order line product must exist and be ACTIVE (ERR_PRODUCT_NOT_ACTIVE); reserve branch_stock must match order branch and line product (ERR_STOCK_LINE_MISMATCH); reserve qty must equal line qty (ERR_PARTIAL_RESERVATION); claim qty <= source qty (ERR_CLAIM_QTY_EXCEEDS_SOURCE); claim source must be final (order line SHIPPED / consumption REPORTED or INVOICED) (ERR_CLAIM_SOURCE_NOT_FINAL); return qty <= customer cumulative shipped qty of product (ERR_RETURN_QTY_EXCEEDS_SHIPPED); supersede target must exist and be ACTIVE (ERR_SUPERSEDE_TARGET_INVALID); referral claim verdict must be MISAPPLICATION (ERR_REFERRAL_VERDICT_NOT_MISAPPLICATION); referral eligibility per selector else ERR_NO_ELIGIBLE_SHOP; received_qty within authorized qty (ERR_INVALID_RECEIVED_QTY); stock adjust result must stay >= reserved_qty (ERR_STOCK_BELOW_RESERVED); agreement amend consigned_qty >= consumed_qty (ERR_CONSIGNMENT_QTY_BELOW_CONSUMED); consumption qty <= agreement.remaining_qty (ERR_CONSUMPTION_EXCEEDS_REMAINING); agreement close blocked by REPORTED/DISPUTED consumptions (ERR_AGREEMENT_CLOSE_BLOCKED)"
    error_id: "referential-specific (listed in check)"
    http_status: 409
    applies_to: "mutation endpoints with cross-entity references"

  - priority: 10
    category: business_fiscal
    check: "Capacity/credit rules last: reserve requires available_qty >= qty (ERR_INSUFFICIENT_AVAILABLE_STOCK); order confirm requires customer credit_status GOOD (ERR_CUSTOMER_CREDIT_HOLD) and open_receivables + order total <= credit_limit (ERR_CREDIT_LIMIT_EXCEEDED); consignment placement requires available_qty >= consigned_qty (ERR_INSUFFICIENT_AVAILABLE_STOCK)"
    error_id: "fiscal-specific (listed in check)"
    http_status: "409 for ERR_INSUFFICIENT_AVAILABLE_STOCK; 402 for ERR_CUSTOMER_CREDIT_HOLD and ERR_CREDIT_LIMIT_EXCEEDED"
    applies_to: "POST /motion/order-lines/{id}/reserve, POST /motion/orders/{id}/confirm, POST /motion/consignment-agreements"

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving clock ---
  - method: POST
    path: "/motion/_clock/set_current_utc"
    description: "Advance the logical clock. Server startup default is exactly 2026-08-01T00:00:00Z; before any set call the logical clock reads this default and never falls back to wall-clock time. Setting the clock fires all scheduled transitions whose instant has been reached (price files PENDING->EFFECTIVE, contracts ACTIVE->EXPIRED, reservations ACTIVE->EXPIRED, returns APPROVED->EXPIRED), in created_at ASC order within the same instant."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Fires every due scheduled transition per state machines"]

  # --- Product ---
  - method: POST
    path: "/motion/products"
    description: "Create a catalog product"
    roles: [PricingAnalyst]
    code: 201
    input: [sku, description, family, list_price_cents]
    output: Product
    side_effects: ["status = ACTIVE", "last_price_change_at = null"]
  - method: GET
    path: "/motion/products"
    description: "List products"
    roles: [Any]
    code: 200
    input: ["sku?", "family?", "status?", "superseded_by_id?", "limit?", "offset?"]
    output: "Product[]"
    side_effects: []
  - method: GET
    path: "/motion/products/{id}"
    description: "Get a product"
    roles: [Any]
    code: 200
    input: []
    output: Product
    side_effects: []
  - method: PATCH
    path: "/motion/products/{id}"
    description: "Lifecycle update: ACTIVE->PHASEOUT->OBSOLETE (or ACTIVE->OBSOLETE), optional superseded_by_id"
    roles: [PricingAnalyst]
    code: 200
    input: [status, "superseded_by_id?"]
    output: Product
    side_effects: ["status transition per Product state machine", "increments Product.version by 1"]

  # --- InterchangeRecord ---
  - method: POST
    path: "/motion/interchange-records"
    description: "Create a competitor-part interchange/sizing mapping (immutable)"
    roles: [PricingAnalyst]
    code: 201
    input: [competitor_part_number, product_id, interchange_class, min_shaft_diameter_mm, max_shaft_diameter_mm]
    output: InterchangeRecord
    side_effects: ["requires_engineering_review computed (true iff FUNCTIONAL)"]
  - method: GET
    path: "/motion/interchange-records"
    description: "Interchange/sizing lookup: filter by competitor part, product, or shaft diameter contained in [min,max]"
    roles: [Any]
    code: 200
    input: ["product_id?", "competitor_part_number?", "shaft_diameter_mm?", "limit?", "offset?"]
    output: "InterchangeRecord[]"
    side_effects: []
  - method: GET
    path: "/motion/interchange-records/{id}"
    description: "Get an interchange record"
    roles: [Any]
    code: 200
    input: []
    output: InterchangeRecord
    side_effects: []

  # --- CustomerAccount ---
  - method: POST
    path: "/motion/customers"
    description: "Onboard a customer plant"
    roles: [ContractAdministrator]
    code: 201
    input: [name, credit_limit_cents]
    output: CustomerAccount
    side_effects: ["credit_status = GOOD", "open_receivables_cents = 0"]
  - method: GET
    path: "/motion/customers"
    description: "List customers"
    roles: [Any]
    code: 200
    input: ["credit_status?", "limit?", "offset?"]
    output: "CustomerAccount[]"
    side_effects: []
  - method: GET
    path: "/motion/customers/{id}"
    description: "Get a customer (includes derived open_receivables_cents)"
    roles: [Any]
    code: 200
    input: []
    output: CustomerAccount
    side_effects: []
  - method: PATCH
    path: "/motion/customers/{id}"
    description: "Update credit_status (GOOD|HOLD) or status (ACTIVE|INACTIVE)"
    roles: [ContractAdministrator]
    code: 200
    input: ["credit_status?", "status?"]
    output: CustomerAccount
    side_effects: ["increments CustomerAccount.version by 1"]

  # --- CustomerContract ---
  - method: POST
    path: "/motion/contracts"
    description: "Draft a customer family contract"
    roles: [ContractAdministrator]
    code: 201
    input: [customer_id, family, price_basis, "discount_pct?", "fixed_unit_price_cents?", "lag_protection_days?", effective_from, effective_to]
    output: CustomerContract
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/motion/contracts"
    description: "List contracts"
    roles: [Any]
    code: 200
    input: ["customer_id?", "family?", "status?", "limit?", "offset?"]
    output: "CustomerContract[]"
    side_effects: []
  - method: GET
    path: "/motion/contracts/{id}"
    description: "Get a contract"
    roles: [Any]
    code: 200
    input: []
    output: CustomerContract
    side_effects: []
  - method: POST
    path: "/motion/contracts/{id}/activate"
    description: "Activate a DRAFT contract; enforces half-open window non-overlap per (customer_id, family)"
    roles: [ContractAdministrator]
    code: 200
    input: []
    output: CustomerContract
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/motion/contracts/{id}/terminate"
    description: "Terminate a DRAFT or ACTIVE contract"
    roles: [ContractAdministrator]
    code: 200
    input: []
    output: CustomerContract
    side_effects: ["status -> TERMINATED"]

  # --- Branch ---
  - method: POST
    path: "/motion/branches"
    description: "Create a distribution branch"
    roles: [SystemAdmin]
    code: 201
    input: [code, timezone_offset_hours, business_open_hour, business_close_hour, expedite_cutoff_hour, after_hours_fee_cents]
    output: Branch
    side_effects: ["status = OPEN"]
  - method: GET
    path: "/motion/branches"
    description: "List branches"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "Branch[]"
    side_effects: []
  - method: GET
    path: "/motion/branches/{id}"
    description: "Get a branch"
    roles: [Any]
    code: 200
    input: []
    output: Branch
    side_effects: []
  - method: PATCH
    path: "/motion/branches/{id}"
    description: "Update branch status (OPEN|CLOSED)"
    roles: [SystemAdmin]
    code: 200
    input: [status]
    output: Branch
    side_effects: ["status updated", "increments Branch.version by 1"]

  # --- BranchStock ---
  - method: POST
    path: "/motion/branch-stocks"
    description: "Create a branch+product stock record"
    roles: [BranchManager]
    code: 201
    input: [branch_id, product_id, on_hand_qty, factory_lead_time_days, "reorder_point?"]
    output: BranchStock
    side_effects: ["reserved_qty = 0", "available_qty = on_hand_qty"]
  - method: GET
    path: "/motion/branch-stocks"
    description: "List stock records"
    roles: [Any]
    code: 200
    input: ["branch_id?", "product_id?", "limit?", "offset?"]
    output: "BranchStock[]"
    side_effects: []
  - method: GET
    path: "/motion/branch-stocks/{id}"
    description: "Get a stock record (includes computed reserved_qty/available_qty)"
    roles: [Any]
    code: 200
    input: []
    output: BranchStock
    side_effects: []
  - method: POST
    path: "/motion/branch-stocks/{id}/adjust"
    description: "Adjust on-hand quantity (restock or cycle-count correction); result must stay >= reserved_qty"
    roles: [BranchManager]
    code: 200
    input: [qty_delta, reason]
    output: BranchStock
    side_effects: ["on_hand_qty += qty_delta", "available_qty recomputed", "increments BranchStock.version by 1"]

  # --- PriceFileVersion ---
  - method: POST
    path: "/motion/price-files"
    description: "Publish a price-file update (OCC on Product.version via expected_product_version); supersedes the product's currently PENDING price file"
    roles: [PricingAnalyst]
    code: 201
    input: [product_id, new_list_price_cents, effective_at, expected_product_version]
    output: PriceFileVersion
    side_effects: ["status = PENDING", "prior PENDING price file of same product -> SUPERSEDED", "increments Product.version by 1"]
  - method: GET
    path: "/motion/price-files"
    description: "List price files"
    roles: [Any]
    code: 200
    input: ["product_id?", "status?", "limit?", "offset?"]
    output: "PriceFileVersion[]"
    side_effects: []
  - method: GET
    path: "/motion/price-files/{id}"
    description: "Get a price file"
    roles: [Any]
    code: 200
    input: []
    output: PriceFileVersion
    side_effects: []
  - method: POST
    path: "/motion/price-files/{id}/cancel"
    description: "Cancel a PENDING price file"
    roles: [PricingAnalyst]
    code: 200
    input: []
    output: PriceFileVersion
    side_effects: ["status -> CANCELLED"]

  # --- SalesOrder ---
  - method: POST
    path: "/motion/orders"
    description: "Create an order (DRAFT x UNBILLED)"
    roles: [CounterSalesRep]
    code: 201
    input: [customer_id, branch_id, "price_variant?"]
    output: SalesOrder
    side_effects: ["fulfillment_status = DRAFT", "billing_status = UNBILLED"]
  - method: GET
    path: "/motion/orders"
    description: "List orders"
    roles: [Any]
    code: 200
    input: ["customer_id?", "branch_id?", "fulfillment_status?", "billing_status?", "limit?", "offset?"]
    output: "SalesOrder[]"
    side_effects: []
  - method: GET
    path: "/motion/orders/{id}"
    description: "Get an order (includes computed totals)"
    roles: [Any]
    code: 200
    input: []
    output: SalesOrder
    side_effects: []
  - method: POST
    path: "/motion/orders/{id}/lines"
    description: "Add an order line (order must be DRAFT)"
    roles: [CounterSalesRep]
    code: 201
    input: [product_id, qty, "expedite_tier?"]
    output: OrderLine
    side_effects: ["line sourcing_status = PENDING_SOURCING", "increments SalesOrder.version by 1"]
  - method: POST
    path: "/motion/orders/{id}/confirm"
    description: "Price and confirm the order; runs credit checks"
    roles: [CounterSalesRep]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["all lines priced per contract_lag_unit_price", "fees per expedite_fee_stacking", "totals per order_total_aggregation", "priced_at := now", "fulfillment_status -> CONFIRMED", "increments SalesOrder.version by 1"]
  - method: POST
    path: "/motion/orders/{id}/reprice"
    description: "Re-run pricing on a DRAFT or CONFIRMED order (OCC on SalesOrder.version); picks up newly ACTIVE contracts and newly EFFECTIVE price files"
    roles: [CounterSalesRep]
    code: 200
    input: [expected_order_version]
    output: SalesOrder
    side_effects: ["lines re-priced per contract_lag_unit_price", "totals recomputed", "priced_at := now", "increments SalesOrder.version by 1"]
  - method: POST
    path: "/motion/orders/{id}/cancel"
    description: "Cancel a pre-shipment order; releases reservations"
    roles: [CounterSalesRep]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["fulfillment_status -> CANCELLED", "lines -> CANCELLED", "ACTIVE reservations -> RELEASED", "increments SalesOrder.version by 1"]
  - method: POST
    path: "/motion/orders/{id}/invoice"
    description: "Invoice a fully shipped order (billing axis)"
    roles: [BranchManager]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["billing_status UNBILLED -> INVOICED", "CustomerAccount.open_receivables_cents += total_cents", "increments SalesOrder.version by 1"]
  - method: POST
    path: "/motion/orders/{id}/record-payment"
    description: "Record a payment against an invoiced order"
    roles: [BranchManager]
    code: 200
    input: [amount_cents]
    output: SalesOrder
    side_effects: ["paid_cents += amount_cents (must be > 0 and <= total_cents - paid_cents)", "billing_status -> PARTIALLY_PAID or PAID", "open_receivables_cents recomputed", "increments SalesOrder.version by 1"]
  - method: POST
    path: "/motion/orders/{id}/close"
    description: "Close a SHIPPED + PAID order"
    roles: [BranchManager]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["fulfillment_status -> CLOSED"]

  # --- OrderLine ---
  - method: GET
    path: "/motion/order-lines"
    description: "List order lines"
    roles: [Any]
    code: 200
    input: ["order_id?", "product_id?", "sourcing_status?", "limit?", "offset?"]
    output: "OrderLine[]"
    side_effects: []
  - method: GET
    path: "/motion/order-lines/{id}"
    description: "Get an order line"
    roles: [Any]
    code: 200
    input: []
    output: OrderLine
    side_effects: []
  - method: POST
    path: "/motion/order-lines/{id}/expedite"
    description: "Change expedite tier while order is DRAFT; fees recompute at confirm"
    roles: [CounterSalesRep]
    code: 200
    input: [expedite_tier]
    output: OrderLine
    side_effects: ["expedite_tier updated", "increments SalesOrder.version by 1"]
  - method: POST
    path: "/motion/order-lines/{id}/reserve"
    description: "Reserve branch stock for the full line quantity; creates a StockReservation (72h TTL)"
    roles: [CounterSalesRep]
    code: 201
    input: [branch_stock_id, qty]
    output: StockReservation
    side_effects: ["StockReservation ACTIVE, expires_at = now + 72h", "line -> STOCK_RESERVED", "BranchStock.reserved_qty recomputed", "order fulfillment re-evaluated"]
  - method: POST
    path: "/motion/order-lines/{id}/place-factory-order"
    description: "Source the line factory-direct; NONE/STANDARD tiers blocked at/after branch expedite cutoff"
    roles: [CounterSalesRep]
    code: 200
    input: []
    output: OrderLine
    side_effects: ["line -> FACTORY_ORDERED", "factory_ordered_at := now", "order fulfillment re-evaluated"]
  - method: POST
    path: "/motion/order-lines/{id}/receive-factory"
    description: "Receive factory goods after the tier-adjusted lead time has elapsed"
    roles: [BranchManager]
    code: 200
    input: []
    output: OrderLine
    side_effects: ["line -> FACTORY_RECEIVED", "BranchStock.on_hand_qty += qty"]
  - method: POST
    path: "/motion/order-lines/{id}/allocate"
    description: "Pick stock: consumes reservation (stock-sourced) or decrements shelf (factory-received)"
    roles: [BranchManager]
    code: 200
    input: []
    output: OrderLine
    side_effects: ["line -> ALLOCATED", "reservation -> CONSUMED (if stock-sourced)", "BranchStock.on_hand_qty -= qty", "reserved_qty recomputed"]
  - method: POST
    path: "/motion/order-lines/{id}/ship"
    description: "Ship an allocated line; SHIP_DATE orders re-price this line at the ship instant"
    roles: [BranchManager]
    code: 200
    input: []
    output: OrderLine
    side_effects: ["line -> SHIPPED", "shipped_at := now", "SHIP_DATE re-price + totals recompute", "order fulfillment re-evaluated"]

  # --- StockReservation ---
  - method: GET
    path: "/motion/stock-reservations"
    description: "List reservations"
    roles: [Any]
    code: 200
    input: ["order_line_id?", "branch_stock_id?", "status?", "limit?", "offset?"]
    output: "StockReservation[]"
    side_effects: []
  - method: GET
    path: "/motion/stock-reservations/{id}"
    description: "Get a reservation"
    roles: [Any]
    code: 200
    input: []
    output: StockReservation
    side_effects: []
  - method: POST
    path: "/motion/stock-reservations/{id}/release"
    description: "Release an ACTIVE reservation; line reverts to PENDING_SOURCING"
    roles: [CounterSalesRep, BranchManager]
    code: 200
    input: []
    output: StockReservation
    side_effects: ["reservation -> RELEASED", "line -> PENDING_SOURCING", "reserved_qty recomputed", "order fulfillment re-evaluated"]

  # --- CallOut ---
  - method: POST
    path: "/motion/call-outs"
    description: "Request an emergency after-hours call-out"
    roles: [CustomerPlant, CounterSalesRep]
    code: 201
    input: [branch_id, customer_id, product_id, qty]
    output: CallOut
    side_effects: ["status = REQUESTED"]
  - method: GET
    path: "/motion/call-outs"
    description: "List call-outs"
    roles: [Any]
    code: 200
    input: ["branch_id?", "customer_id?", "product_id?", "status?", "limit?", "offset?"]
    output: "CallOut[]"
    side_effects: []
  - method: GET
    path: "/motion/call-outs/{id}"
    description: "Get a call-out"
    roles: [Any]
    code: 200
    input: []
    output: CallOut
    side_effects: []
  - method: POST
    path: "/motion/call-outs/{id}/dispatch"
    description: "Dispatch an on-call technician (after-hours only; one DISPATCHED per branch)"
    roles: [OnCallTechnician]
    code: 200
    input: []
    output: CallOut
    side_effects: ["status -> DISPATCHED", "responder_id := X-User-ID", "call_out_fee_cents computed per call_out_fee"]
  - method: POST
    path: "/motion/call-outs/{id}/fulfill"
    description: "Fulfill from branch stock; seizes ACTIVE reservations (newest created_at first) when available_qty is short"
    roles: [OnCallTechnician]
    code: 200
    input: []
    output: CallOut
    side_effects: ["status -> FULFILLED", "preemption cascade (reservation PREEMPTED -> line PENDING_SOURCING -> order fulfillment re-evaluated)", "on_hand_qty -= qty", "parts_amount_cents priced per contract_lag_unit_price(T=now)", "total_charge_cents computed", "CustomerAccount.open_receivables_cents += total_charge_cents"]
  - method: POST
    path: "/motion/call-outs/{id}/cancel"
    description: "Cancel a REQUESTED or DISPATCHED call-out"
    roles: [OnCallTechnician, CustomerPlant]
    code: 200
    input: []
    output: CallOut
    side_effects: ["status -> CANCELLED"]

  # --- ConsignmentAgreement ---
  - method: POST
    path: "/motion/consignment-agreements"
    description: "Place consigned stock at a customer plant; pins unit price at creation; moves stock off the branch shelf"
    roles: [ContractAdministrator]
    code: 201
    input: [customer_id, branch_id, product_id, consigned_qty, "billing_variant?"]
    output: ConsignmentAgreement
    side_effects: ["status = ACTIVE", "pinned_unit_price_cents := contract_lag_unit_price(T=now)", "BranchStock.available_qty >= consigned_qty required", "BranchStock.on_hand_qty -= consigned_qty"]
  - method: GET
    path: "/motion/consignment-agreements"
    description: "List consignment agreements"
    roles: [Any]
    code: 200
    input: ["customer_id?", "branch_id?", "product_id?", "status?", "limit?", "offset?"]
    output: "ConsignmentAgreement[]"
    side_effects: []
  - method: GET
    path: "/motion/consignment-agreements/{id}"
    description: "Get an agreement"
    roles: [Any]
    code: 200
    input: []
    output: ConsignmentAgreement
    side_effects: []
  - method: PATCH
    path: "/motion/consignment-agreements/{id}"
    description: "Amend consigned_qty (OCC on ConsignmentAgreement.version); new qty must be >= consumed_qty"
    roles: [ContractAdministrator]
    code: 200
    input: [consigned_qty, expected_agreement_version]
    output: ConsignmentAgreement
    side_effects: ["consigned_qty updated", "remaining_qty recomputed", "BranchStock.on_hand_qty adjusted by the delta", "increments ConsignmentAgreement.version by 1"]
  - method: POST
    path: "/motion/consignment-agreements/{id}/suspend"
    description: "Suspend an agreement (blocks new consumption reports)"
    roles: [ContractAdministrator]
    code: 200
    input: []
    output: ConsignmentAgreement
    side_effects: ["status -> SUSPENDED"]
  - method: POST
    path: "/motion/consignment-agreements/{id}/resume"
    description: "Resume a suspended agreement"
    roles: [ContractAdministrator]
    code: 200
    input: []
    output: ConsignmentAgreement
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/motion/consignment-agreements/{id}/close"
    description: "Close an agreement; unconsumed stock returns to the branch shelf"
    roles: [ContractAdministrator]
    code: 200
    input: []
    output: ConsignmentAgreement
    side_effects: ["status -> CLOSED", "BranchStock.on_hand_qty += remaining_qty"]

  # --- ConsignmentConsumption ---
  - method: POST
    path: "/motion/consignment-agreements/{id}/consumptions"
    description: "Customer reports consumption from consigned stock"
    roles: [CustomerPlant]
    code: 201
    input: [qty]
    output: ConsignmentConsumption
    side_effects: ["status = REPORTED", "reported_at := now", "agreement consumed_qty/remaining_qty recomputed", "increments ConsignmentAgreement.version by 1"]
  - method: GET
    path: "/motion/consignment-consumptions"
    description: "List consumption events"
    roles: [Any]
    code: 200
    input: ["agreement_id?", "status?", "limit?", "offset?"]
    output: "ConsignmentConsumption[]"
    side_effects: []
  - method: GET
    path: "/motion/consignment-consumptions/{id}"
    description: "Get a consumption event"
    roles: [Any]
    code: 200
    input: []
    output: ConsignmentConsumption
    side_effects: []
  - method: POST
    path: "/motion/consignment-consumptions/{id}/invoice"
    description: "Invoice a REPORTED consumption; prices per agreement billing variant"
    roles: [BranchManager]
    code: 200
    input: []
    output: ConsignmentConsumption
    side_effects: ["status -> INVOICED", "unit_price_cents/billed_amount_cents per consignment_consumption_billing", "CustomerAccount.open_receivables_cents += billed_amount_cents"]
  - method: POST
    path: "/motion/consignment-consumptions/{id}/dispute"
    description: "Customer disputes an INVOICED consumption"
    roles: [CustomerPlant]
    code: 200
    input: []
    output: ConsignmentConsumption
    side_effects: ["status -> DISPUTED"]
  - method: POST
    path: "/motion/consignment-consumptions/{id}/credit"
    description: "Credit a DISPUTED or INVOICED consumption; restores consignment remaining stock"
    roles: [BranchManager]
    code: 200
    input: []
    output: ConsignmentConsumption
    side_effects: ["status -> CREDITED", "open_receivables_cents -= (billed_amount_cents - offset_applied_cents)", "agreement consumed_qty/remaining_qty recomputed"]

  # --- WarrantyClaim ---
  - method: POST
    path: "/motion/warranty-claims"
    description: "File a failed-bearing warranty claim against a shipped order line or a consignment consumption"
    roles: [WarrantyAnalyst]
    code: 201
    input: [product_id, "order_line_id?", "consumption_id?", failure_mode, operating_hours, qty]
    output: WarrantyClaim
    side_effects: ["status = SUBMITTED", "filed_by := X-User-ID"]
  - method: GET
    path: "/motion/warranty-claims"
    description: "List warranty claims"
    roles: [Any]
    code: 200
    input: ["product_id?", "order_line_id?", "consumption_id?", "status?", "limit?", "offset?"]
    output: "WarrantyClaim[]"
    side_effects: []
  - method: GET
    path: "/motion/warranty-claims/{id}"
    description: "Get a warranty claim"
    roles: [Any]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: POST
    path: "/motion/warranty-claims/{id}/begin-analysis"
    description: "Open failure analysis on a claim"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status -> UNDER_ANALYSIS"]
  - method: POST
    path: "/motion/warranty-claims/{id}/request-info"
    description: "Return claim to filer for more information (analysis loop)"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status -> SUBMITTED"]
  - method: POST
    path: "/motion/warranty-claims/{id}/verdict"
    description: "Render failure-analysis verdict; CONFIRMED_DEFECT approves and computes tiered credit; MISAPPLICATION/WEAR_OUT deny. Verdict user must differ from filer."
    roles: [QualityEngineer]
    code: 200
    input: [verdict]
    output: WarrantyClaim
    side_effects: ["status -> APPROVED or DENIED", "coverage_pct/credit_amount_cents per warranty_credit_tiered"]
  - method: POST
    path: "/motion/warranty-claims/{id}/issue-credit"
    description: "Issue the approved warranty credit; consignment-linked claims credit the consumption and restore consignment stock"
    roles: [BranchManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status -> CREDIT_ISSUED", "open_receivables_cents -= credit_amount_cents", "if consumption_id set and qty == consumption qty: consumption -> CREDITED, agreement quantities recomputed"]

  # --- ReturnAuthorization ---
  - method: POST
    path: "/motion/return-authorizations"
    description: "Request a surplus or obsolete return"
    roles: [CustomerPlant, CounterSalesRep]
    code: 201
    input: [customer_id, product_id, branch_id, qty, condition, original_unit_price_cents]
    output: ReturnAuthorization
    side_effects: ["status = REQUESTED", "requested_by := X-User-ID"]
  - method: GET
    path: "/motion/return-authorizations"
    description: "List return authorizations"
    roles: [Any]
    code: 200
    input: ["customer_id?", "product_id?", "branch_id?", "status?", "limit?", "offset?"]
    output: "ReturnAuthorization[]"
    side_effects: []
  - method: GET
    path: "/motion/return-authorizations/{id}"
    description: "Get a return authorization"
    roles: [Any]
    code: 200
    input: []
    output: ReturnAuthorization
    side_effects: []
  - method: POST
    path: "/motion/return-authorizations/{id}/approve"
    description: "Approve a return (approver must differ from requester)"
    roles: [BranchManager]
    code: 200
    input: []
    output: ReturnAuthorization
    side_effects: ["status -> APPROVED", "approved_by/approved_at persisted"]
  - method: POST
    path: "/motion/return-authorizations/{id}/reject"
    description: "Reject a return (rejector must differ from requester)"
    roles: [BranchManager]
    code: 200
    input: []
    output: ReturnAuthorization
    side_effects: ["status -> REJECTED"]
  - method: POST
    path: "/motion/return-authorizations/{id}/receive"
    description: "Receive returned goods within the RMA window; computes eligible credit and obsolete write-down"
    roles: [BranchManager]
    code: 200
    input: [received_qty]
    output: ReturnAuthorization
    side_effects: ["status -> RECEIVED", "eligible_credit_cents/write_down_cents per return_credit_netting_waterfall", "SURPLUS + ACTIVE product: BranchStock.on_hand_qty += received_qty"]
  - method: POST
    path: "/motion/return-authorizations/{id}/issue-credit"
    description: "Issue return credit: nets against the customer's outstanding consignment invoices (oldest first), remainder as credit memo"
    roles: [BranchManager]
    code: 200
    input: []
    output: ReturnAuthorization
    side_effects: ["status -> CREDIT_ISSUED", "consumption offsets applied per waterfall", "open_receivables_cents -= offset_applied_cents + credit_memo_cents"]

  # --- ServiceShop ---
  - method: POST
    path: "/motion/service-shops"
    description: "Register a repair shop"
    roles: [SystemAdmin]
    code: 201
    input: [name, capabilities, region, labor_rate_cents]
    output: ServiceShop
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/motion/service-shops"
    description: "List repair shops"
    roles: [Any]
    code: 200
    input: ["region?", "capability?", "status?", "limit?", "offset?"]
    output: "ServiceShop[]"
    side_effects: []
  - method: GET
    path: "/motion/service-shops/{id}"
    description: "Get a repair shop"
    roles: [Any]
    code: 200
    input: []
    output: ServiceShop
    side_effects: []
  - method: PATCH
    path: "/motion/service-shops/{id}"
    description: "Update shop status (ACTIVE|INACTIVE); INACTIVE shops are excluded from referral selector eligibility"
    roles: [SystemAdmin]
    code: 200
    input: [status]
    output: ServiceShop
    side_effects: ["status updated", "increments ServiceShop.version by 1"]

  # --- ServiceReferral ---
  - method: POST
    path: "/motion/service-referrals"
    description: "Refer a MISAPPLICATION-verdict claim to the selector-chosen repair shop"
    roles: [WarrantyAnalyst]
    code: 201
    input: [warranty_claim_id, region]
    output: ServiceReferral
    side_effects: ["service_shop_id chosen per referral_shop_selector", "status = OPEN"]
  - method: GET
    path: "/motion/service-referrals"
    description: "List referrals"
    roles: [Any]
    code: 200
    input: ["warranty_claim_id?", "service_shop_id?", "status?", "limit?", "offset?"]
    output: "ServiceReferral[]"
    side_effects: []
  - method: GET
    path: "/motion/service-referrals/{id}"
    description: "Get a referral"
    roles: [Any]
    code: 200
    input: []
    output: ServiceReferral
    side_effects: []
  - method: POST
    path: "/motion/service-referrals/{id}/accept"
    description: "Selected shop accepts with a repair quote"
    roles: [ServiceShop]
    code: 200
    input: [quoted_amount_cents]
    output: ServiceReferral
    side_effects: ["status -> ACCEPTED", "quoted_amount_cents persisted"]
  - method: POST
    path: "/motion/service-referrals/{id}/decline"
    description: "Selected shop declines; system re-refers to the next eligible shop excluding all prior decliners"
    roles: [ServiceShop]
    code: 200
    input: []
    output: ServiceReferral
    side_effects: ["status -> DECLINED", "declined_shop_ids updated", "successor OPEN referral created if any eligible shop remains"]
  - method: POST
    path: "/motion/service-referrals/{id}/complete"
    description: "Selected shop completes the repair; referral fee computed and capped"
    roles: [ServiceShop]
    code: 200
    input: []
    output: ServiceReferral
    side_effects: ["status -> COMPLETED", "referral_fee_cents := min(round(quoted * 0.10), 25000)"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint per §1.5" }
  - { id: ERR_IDENTITY_MISMATCH, http: 403, condition: "Entity-backed role acting on a resource owned by a different entity (wrong customer / wrong shop)" }
  # --- Not found ---
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "Product id does not exist" }
  - { id: ERR_INTERCHANGE_NOT_FOUND, http: 404, condition: "InterchangeRecord id does not exist" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "CustomerAccount id does not exist" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "CustomerContract id does not exist" }
  - { id: ERR_BRANCH_NOT_FOUND, http: 404, condition: "Branch id does not exist" }
  - { id: ERR_BRANCH_STOCK_NOT_FOUND, http: 404, condition: "BranchStock id does not exist" }
  - { id: ERR_PRICE_FILE_NOT_FOUND, http: 404, condition: "PriceFileVersion id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "SalesOrder id does not exist" }
  - { id: ERR_ORDER_LINE_NOT_FOUND, http: 404, condition: "OrderLine id does not exist" }
  - { id: ERR_RESERVATION_NOT_FOUND, http: 404, condition: "StockReservation id does not exist" }
  - { id: ERR_CALL_OUT_NOT_FOUND, http: 404, condition: "CallOut id does not exist" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "ConsignmentAgreement id does not exist" }
  - { id: ERR_CONSUMPTION_NOT_FOUND, http: 404, condition: "ConsignmentConsumption id does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "WarrantyClaim id does not exist" }
  - { id: ERR_RETURN_NOT_FOUND, http: 404, condition: "ReturnAuthorization id does not exist" }
  - { id: ERR_SHOP_NOT_FOUND, http: 404, condition: "ServiceShop id does not exist" }
  - { id: ERR_REFERRAL_NOT_FOUND, http: 404, condition: "ServiceReferral id does not exist" }
  # --- Request shape / constraints ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, invalid enum member, or qty/amount out of domain (qty < 1, amount_cents <= 0, business_close_hour <= business_open_hour)" }
  - { id: ERR_DUPLICATE_SKU, http: 400, condition: "Product sku already exists" }
  - { id: ERR_DUPLICATE_BRANCH_CODE, http: 400, condition: "Branch code already exists" }
  - { id: ERR_CONTRACT_WINDOW_INVALID, http: 400, condition: "effective_from >= effective_to" }
  - { id: ERR_CONTRACT_FIXED_PRICE_MISSING, http: 400, condition: "price_basis CONTRACT_FIXED without fixed_unit_price_cents" }
  - { id: ERR_CONTRACT_WINDOW_OVERLAP, http: 409, condition: "Another ACTIVE contract for same (customer_id, family) has overlapping half-open [effective_from, effective_to) window" }
  - { id: ERR_DUPLICATE_AGREEMENT, http: 409, condition: "A non-CLOSED consignment agreement already exists for (customer_id, branch_id, product_id)" }
  - { id: ERR_CLAIM_REFERENCE_INVALID, http: 400, condition: "Warranty claim must reference exactly one of order_line_id / consumption_id" }
  # --- State ---
  - { id: ERR_PRODUCT_NOT_ACTIVE, http: 409, condition: "Operation requires Product.status == ACTIVE (or PHASEOUT for the PATCH transition)" }
  - { id: ERR_PRODUCT_NOT_PHASEOUT, http: 409, condition: "PHASEOUT->OBSOLETE requires current status PHASEOUT" }
  - { id: ERR_SUPERSEDE_TARGET_INVALID, http: 409, condition: "superseded_by_id must reference an existing ACTIVE product" }
  - { id: ERR_CONTRACT_NOT_DRAFT, http: 409, condition: "activate requires contract DRAFT" }
  - { id: ERR_CONTRACT_NOT_TERMINABLE, http: 409, condition: "terminate requires contract DRAFT or ACTIVE" }
  - { id: ERR_PRICE_FILE_NOT_PENDING, http: 409, condition: "cancel requires price file PENDING" }
  - { id: ERR_ORDER_NOT_CONFIRMABLE, http: 409, condition: "confirm/reserve/factory-order/reprice require order DRAFT, CONFIRMED, or FULLY_SOURCED as applicable; e.g. confirm requires DRAFT" }
  - { id: ERR_ORDER_HAS_NO_LINES, http: 409, condition: "confirm requires at least one line" }
  - { id: ERR_ORDER_NOT_CANCELLABLE, http: 409, condition: "cancel blocked once any line is SHIPPED or order not in DRAFT/CONFIRMED/FULLY_SOURCED" }
  - { id: ERR_ORDER_ALREADY_INVOICED, http: 409, condition: "cancel/invoice requires billing_status UNBILLED / INVOICED respectively" }
  - { id: ERR_ORDER_NOT_FULLY_SHIPPED, http: 409, condition: "invoice/close require fulfillment_status == SHIPPED" }
  - { id: ERR_ORDER_NOT_PAID, http: 409, condition: "close requires billing_status == PAID" }
  - { id: ERR_LINE_NOT_SOURCABLE, http: 409, condition: "reserve/place-factory-order require line PENDING_SOURCING" }
  - { id: ERR_LINE_NOT_ALLOCATABLE, http: 409, condition: "allocate requires line STOCK_RESERVED or FACTORY_RECEIVED" }
  - { id: ERR_LINE_NOT_SHIPPABLE, http: 409, condition: "ship requires line ALLOCATED" }
  - { id: ERR_LINE_NOT_FACTORY_ORDERED, http: 409, condition: "receive-factory requires line FACTORY_ORDERED" }
  - { id: ERR_RESERVATION_NOT_ACTIVE, http: 409, condition: "release requires reservation ACTIVE" }
  - { id: ERR_CALL_OUT_NOT_REQUESTED, http: 409, condition: "dispatch requires call-out REQUESTED" }
  - { id: ERR_CALL_OUT_NOT_DISPATCHED, http: 409, condition: "fulfill requires call-out DISPATCHED" }
  - { id: ERR_CALL_OUT_NOT_CANCELLABLE, http: 409, condition: "cancel requires call-out REQUESTED or DISPATCHED" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "consumption report / suspend require agreement ACTIVE" }
  - { id: ERR_AGREEMENT_NOT_SUSPENDED, http: 409, condition: "resume requires agreement SUSPENDED" }
  - { id: ERR_AGREEMENT_NOT_CLOSABLE, http: 409, condition: "close requires agreement ACTIVE or SUSPENDED" }
  - { id: ERR_AGREEMENT_CLOSE_BLOCKED, http: 409, condition: "close blocked while consumptions in REPORTED or DISPUTED status exist" }
  - { id: ERR_CONSUMPTION_NOT_REPORTED, http: 409, condition: "invoice requires consumption REPORTED" }
  - { id: ERR_CONSUMPTION_NOT_INVOICED, http: 409, condition: "dispute requires consumption INVOICED" }
  - { id: ERR_CONSUMPTION_NOT_CREDITABLE, http: 409, condition: "credit requires consumption DISPUTED or INVOICED" }
  - { id: ERR_CLAIM_NOT_SUBMITTED, http: 409, condition: "begin-analysis requires claim SUBMITTED" }
  - { id: ERR_CLAIM_NOT_UNDER_ANALYSIS, http: 409, condition: "verdict/request-info require claim UNDER_ANALYSIS" }
  - { id: ERR_CLAIM_NOT_APPROVED, http: 409, condition: "issue-credit requires claim APPROVED" }
  - { id: ERR_RETURN_NOT_REQUESTED, http: 409, condition: "approve/reject require return REQUESTED" }
  - { id: ERR_RETURN_NOT_APPROVED, http: 409, condition: "receive requires return APPROVED" }
  - { id: ERR_RETURN_NOT_RECEIVED, http: 409, condition: "issue-credit requires return RECEIVED" }
  - { id: ERR_REFERRAL_NOT_OPEN, http: 409, condition: "accept/decline require referral OPEN" }
  - { id: ERR_REFERRAL_NOT_ACCEPTED, http: 409, condition: "complete requires referral ACCEPTED" }
  - { id: ERR_REFERRAL_SHOP_MISMATCH, http: 403, condition: "Acting ServiceShop id does not equal referral.service_shop_id" }
  # --- Business: safety (SoD) ---
  - { id: ERR_WARRANTY_SOD_VERDICT, http: 403, condition: "Verdict X-User-ID equals claim.filed_by (segregation of duties)" }
  - { id: ERR_RETURN_SOD_APPROVAL, http: 403, condition: "Approve/reject X-User-ID equals return.requested_by (segregation of duties)" }
  # --- Business: temporal ---
  - { id: ERR_EFFECTIVE_AT_IN_PAST, http: 409, condition: "Price file effective_at must be strictly after the current logical time at publish" }
  - { id: ERR_CALL_OUT_NOT_AFTER_HOURS, http: 409, condition: "Dispatch requires branch-local after-hours (local_hour < open or >= close)" }
  - { id: ERR_BRANCH_CALLOUT_CAPACITY, http: 409, condition: "Branch already has a DISPATCHED call-out (one-truck capacity)" }
  - { id: ERR_FACTORY_ORDER_CUTOFF_PASSED, http: 409, condition: "NONE/STANDARD tier factory order at/after branch expedite cutoff hour" }
  - { id: ERR_FACTORY_LEAD_TIME_UNMET, http: 409, condition: "Factory receipt before factory_ordered_at + tier-adjusted lead time" }
  - { id: ERR_RMA_WINDOW_EXPIRED, http: 409, condition: "Return receipt attempted after approved_at + 30 days" }
  # --- Business: referential ---
  - { id: ERR_STOCK_BELOW_RESERVED, http: 409, condition: "Stock adjust would drop on_hand_qty below reserved_qty" }
  - { id: ERR_STOCK_LINE_MISMATCH, http: 409, condition: "BranchStock branch/product does not match the order's branch / line's product" }
  - { id: ERR_PARTIAL_RESERVATION, http: 409, condition: "Reservation qty must equal the full order line qty" }
  - { id: ERR_CLAIM_QTY_EXCEEDS_SOURCE, http: 409, condition: "Claim qty exceeds the source line/consumption qty" }
  - { id: ERR_CLAIM_SOURCE_NOT_FINAL, http: 409, condition: "Order line not SHIPPED, or consumption not REPORTED/INVOICED" }
  - { id: ERR_RETURN_QTY_EXCEEDS_SHIPPED, http: 409, condition: "Return qty exceeds customer's cumulative shipped qty of the product" }
  - { id: ERR_REFERRAL_VERDICT_NOT_MISAPPLICATION, http: 409, condition: "Referral requires claim verdict == MISAPPLICATION" }
  - { id: ERR_NO_ELIGIBLE_SHOP, http: 409, condition: "Selector found no eligible shop (capability/region/declined exclusions)" }
  - { id: ERR_INVALID_RECEIVED_QTY, http: 409, condition: "received_qty outside 1..authorized qty" }
  - { id: ERR_CONSIGNMENT_QTY_BELOW_CONSUMED, http: 409, condition: "Amended consigned_qty < consumed_qty" }
  - { id: ERR_CONSUMPTION_EXCEEDS_REMAINING, http: 409, condition: "Consumption qty > agreement.remaining_qty" }
  # --- Business: fiscal ---
  - { id: ERR_INSUFFICIENT_AVAILABLE_STOCK, http: 409, condition: "available_qty < requested qty (reserve or consignment placement)" }
  - { id: ERR_CUSTOMER_CREDIT_HOLD, http: 402, condition: "Customer credit_status == HOLD blocks order confirm" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "open_receivables_cents + order total_cents > credit_limit_cents at confirm" }
  # --- Concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SystemAdmin
    description: "Platform operator; owns branches, repair-shop registry, and the test-driving logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /motion/branches"
      - "PATCH /motion/branches/{id}"
      - "POST /motion/service-shops"
      - "PATCH /motion/service-shops/{id}"
      - "POST /motion/_clock/set_current_utc"
    shared_operations: ["All GET endpoints (role Any)"]
  - name: PricingAnalyst
    description: "Owns the product catalog, interchange mappings, and price-file publications; cannot touch customer contracts"
    identity: opaque
    exclusive_operations:
      - "POST /motion/products"
      - "PATCH /motion/products/{id}"
      - "POST /motion/interchange-records"
      - "POST /motion/price-files"
      - "POST /motion/price-files/{id}/cancel"
    shared_operations: ["All GET endpoints (role Any)"]
  - name: ContractAdministrator
    description: "Owns customer onboarding, contracts, and consignment agreements; cannot publish price files"
    identity: opaque
    exclusive_operations:
      - "POST /motion/customers"
      - "PATCH /motion/customers/{id}"
      - "POST /motion/contracts + activate/terminate"
      - "POST /motion/consignment-agreements + PATCH/suspend/resume/close"
    shared_operations: ["All GET endpoints (role Any)"]
  - name: CounterSalesRep
    description: "Front-counter sales: builds and prices orders, sources lines, manages reservations and return requests"
    identity: opaque
    exclusive_operations:
      - "POST /motion/orders + lines/confirm/reprice/cancel"
      - "POST /motion/order-lines/{id}/expedite|reserve|place-factory-order"
      - "POST /motion/stock-reservations/{id}/release"
    shared_operations:
      - "All GET endpoints (role Any)"
      - "POST /motion/call-outs (with CustomerPlant)"
      - "POST /motion/return-authorizations (with CustomerPlant)"
  - name: BranchManager
    description: "Branch operations: stock, allocation, shipping, invoicing, consumption billing, warranty credit issuance, return adjudication"
    identity: opaque
    exclusive_operations:
      - "POST /motion/branch-stocks + /adjust"
      - "POST /motion/order-lines/{id}/receive-factory|allocate|ship"
      - "POST /motion/orders/{id}/invoice|record-payment|close"
      - "POST /motion/consignment-consumptions/{id}/invoice|credit"
      - "POST /motion/warranty-claims/{id}/issue-credit"
      - "POST /motion/return-authorizations/{id}/approve|reject|receive|issue-credit"
    shared_operations:
      - "All GET endpoints (role Any)"
      - "POST /motion/stock-reservations/{id}/release (with CounterSalesRep)"
  - name: OnCallTechnician
    description: "After-hours responder: dispatches and fulfills emergency call-outs"
    identity: opaque
    exclusive_operations:
      - "POST /motion/call-outs/{id}/dispatch"
      - "POST /motion/call-outs/{id}/fulfill"
    shared_operations:
      - "All GET endpoints (role Any)"
      - "POST /motion/call-outs/{id}/cancel (with CustomerPlant)"
  - name: WarrantyAnalyst
    description: "Files failed-bearing warranty claims and initiates repair-shop referrals; may not render verdicts"
    identity: opaque
    exclusive_operations:
      - "POST /motion/warranty-claims"
      - "POST /motion/service-referrals"
    shared_operations: ["All GET endpoints (role Any)"]
  - name: QualityEngineer
    description: "Renders failure-analysis verdicts; segregation of duties forbids verdicting a claim the same user filed"
    identity: opaque
    exclusive_operations:
      - "POST /motion/warranty-claims/{id}/begin-analysis|request-info|verdict"
    shared_operations: ["All GET endpoints (role Any)"]
  - name: CustomerPlant
    description: "Entity-backed customer actor: reports consignment consumption, disputes billings, requests call-outs and returns"
    identity: "entity_backed:CustomerAccount"
    exclusive_operations:
      - "POST /motion/consignment-agreements/{id}/consumptions"
      - "POST /motion/consignment-consumptions/{id}/dispute"
    shared_operations:
      - "All GET endpoints (role Any)"
      - "POST /motion/call-outs, POST /motion/call-outs/{id}/cancel"
      - "POST /motion/return-authorizations (with CounterSalesRep)"
  - name: ServiceShop
    description: "Entity-backed repair shop: accepts/declines/completes its own referrals"
    identity: "entity_backed:ServiceShop"
    exclusive_operations:
      - "POST /motion/service-referrals/{id}/accept|decline|complete"
    shared_operations: ["All GET endpoints (role Any)"]
  - name: Any
    description: "Pseudo-role granted on all read (GET) endpoints; any authenticated role may read"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["Every GET /motion/* endpoint"]
