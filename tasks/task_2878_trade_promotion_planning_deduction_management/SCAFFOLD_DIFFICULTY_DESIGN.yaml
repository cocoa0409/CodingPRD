  - rule_id: resource_temporal_overlap
    instances:
      - name: display_exclusivity_uses_half_open_windows_on_customer_and_brand
        interval_semantics: "half-open [window_start, window_end): touching endpoints do not overlap"
        grounds:
          - validations.priority_73
          - errors.ERR_DISPLAY_WINDOW_CONFLICT
          - entities.PromotionTactic.fields.window_start
        distinguishing_aspect: |
          The contended resource is the retailer's display real estate for one customer and one
          brand, and the interval algebra is half-open. A DISPLAY running 2026-08-03 -> 2026-08-17
          and one running 2026-08-17 -> 2026-08-31 share the instant 2026-08-17 as one's exclusive
          end and the other's inclusive start, and BOTH must be accepted. A third DISPLAY running
          2026-08-10 -> 2026-08-24 genuinely overlaps both and must be refused with 409. An
          implementation using closed intervals refuses the legal adjacent pair; one that compares
          only window_start values, or that tests containment rather than overlap, accepts the
          straddling third.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01."
            - "One program, brand and customer; one APPROVED allocation with planned_amount 100000.00."
            - "One DRAFT promotion, window 2026-08-03 -> 2026-08-31, wide enough to hold every candidate DISPLAY window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
            - call: "POST /trade-marketing/programs"
              payload: { fiscal_year: 2026, name: "FY2026 National Trade Fund", total_budget_amount: 5000000.00, accrual_method_default: "SHIPMENT" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { prog_id: $.data.id }
            - call: "POST /trade-marketing/brands"
              payload: { program_id: "${prog_id}", name: "Crisp Oat Cereal", list_price_per_case: 24.00, cogs_per_case: 8.70, baseline_units_per_week: 1200 }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { brand_id: $.data.id }
            - call: "POST /trade-marketing/customers"
              payload: { program_id: "${prog_id}", name: "MegaMart", channel: "GROCERY", deduction_validation_policy: "EVIDENCE_BASED" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { cust_id: $.data.id }
            - call: "POST /trade-marketing/budget-allocations"
              payload: { program_id: "${prog_id}", customer_id: "${cust_id}", brand_id: "${brand_id}", event_type: "SEASONAL", planned_amount: 100000.00, baseline_units: 40000, planned_incremental_units: 20000 }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { alloc_id: $.data.id }
            - call: "POST /trade-marketing/budget-allocations/${alloc_id}/approve"
              payload: {}
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { alloc_v1: $.data.version }
            - call: "POST /trade-marketing/promotions"
              payload: { allocation_id: "${alloc_id}", name: "Endcap Programme", window_start: "2026-08-03", window_end: "2026-08-31", accrual_method: "SHIPMENT", expected_allocation_version: "${alloc_v1}" }
              as: KeyAccountManager
              as_user_id: "kam-1"
              captures: { promo_id: $.data.id }
          trigger:
            - call: "POST /trade-marketing/promotions/${promo_id}/tactics"
              payload: { tactic_type: "DISPLAY", planned_units: 3000, window_start: "2026-08-03", window_end: "2026-08-17", fixed_fee: 4000.00 }
              as: KeyAccountManager
              as_user_id: "kam-1"
              captures: { display_1_id: $.data.id }
            - call: "POST /trade-marketing/promotions/${promo_id}/tactics"
              payload: { tactic_type: "DISPLAY", planned_units: 3000, window_start: "2026-08-17", window_end: "2026-08-31", fixed_fee: 4000.00 }
              as: KeyAccountManager
              as_user_id: "kam-1"
              captures: { display_2_id: $.data.id }
            - call: "POST /trade-marketing/promotions/${promo_id}/tactics"
              payload: { tactic_type: "DISPLAY", planned_units: 3000, window_start: "2026-08-10", window_end: "2026-08-24", fixed_fee: 4000.00 }
              as: KeyAccountManager
              as_user_id: "kam-1"
          assert:
            - "first DISPLAY (2026-08-03 -> 2026-08-17) -> 201, week_count == 2, line_planned_spend == 4000.00"
            - "second DISPLAY (2026-08-17 -> 2026-08-31) -> 201: bare adjacency at 2026-08-17 is NOT an overlap"
            - "third DISPLAY (2026-08-10 -> 2026-08-24) -> 409 ERR_DISPLAY_WINDOW_CONFLICT"
            - "GET /trade-marketing/promotions/${promo_id}/tactics returns total_count 2, holding exactly ${display_1_id} and ${display_2_id}"
            - "Promotion.${promo_id}.tactic_subtotal_amount == 8000.00, allowance_rate == 0.000, off_invoice_allowance_amount == 0.00, planned_total_spend == 8000.00 (the refused line contributed nothing)"
            - "Promotion.${promo_id}.commitment_verified == false, because two DISPLAY tactics now require a VERIFIED COMMITMENT document before approval"

      - name: feature_cooldown_is_a_seven_day_buffer_on_brand_across_customers
        interval_semantics: "buffered: the requested window must be separated from every other live FEATURE window on the brand by at least FEATURE_COOLDOWN_DAYS (7); a 7-day gap passes, adjacency (gap 0) fails"
        grounds:
          - validations.priority_74
          - constants.FEATURE_COOLDOWN_DAYS
          - errors.ERR_FEATURE_COOLDOWN_CONFLICT
        distinguishing_aspect: |
          Different interval semantics and a different scoping key from the DISPLAY instance.
          FEATURE conflicts are buffered rather than overlap-based, and the scope is the brand
          across ALL customers rather than the customer-and-brand pair. A FEATURE for customer B
          starting 2026-08-17, exactly where customer A's FEATURE ends, is refused even though the
          intervals do not overlap at all and even though the customers differ — this is precisely
          the case the DISPLAY instance says must be accepted. Moving the request one week later
          to 2026-08-24 puts the gap at exactly 7 days and must be accepted, pinning the >= on the
          cooldown. An implementation that reuses the DISPLAY overlap predicate for FEATURE
          accepts the adjacent request; one that scopes the cooldown by customer as well as brand
          accepts it too; one that uses a strict > on the 7-day gap refuses the legal request.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01."
            - "One program and one brand, shared by two customers A and B."
            - "One APPROVED allocation per customer (planned_amount 100000.00)."
            - "Promotion FA for customer A, window 2026-08-03 -> 2026-08-17, DRAFT, carrying one FEATURE tactic over its whole window."
            - "Promotion FB for customer B, window 2026-08-17 -> 2026-09-14, DRAFT, with no tactics yet."
