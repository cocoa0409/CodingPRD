  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: crew_window_thirty_minute_buffer
        grounds:
          - calculations.crew_window_conflict
          - errors[ERR_CREW_WINDOW_CONFLICT]
          - entities.AssemblyJob.fields.window_start
        distinguishing_aspect: |
          Interval semantics = buffered closed intervals on the provider-crew
          resource: a 30-minute buffer is applied on both sides of every
          existing window and strict inequality governs, so a job starting
          exactly 30 minutes after a window ends (11:30 after 10:00-11:00) is
          legal while 11:29 conflicts — adjacency-with-exact-buffer is free.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001. Customer N. Article ASM (requires_assembly, standard 30), stock 10. Three separate FULFILLED orders O1/O2/O3 (qty 1 each). Job on O1: CREW-A, 2026-09-10 10:00-11:00."
