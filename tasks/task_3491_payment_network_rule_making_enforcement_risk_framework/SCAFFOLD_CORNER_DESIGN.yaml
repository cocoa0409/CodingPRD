              as: PlatformAdmin
              captures: { tc_web: $.data.id }
            - call: "POST /network/settlement-windows"
              payload: { window_code: "W1", cutoff_time_utc: "17:00", per_entry_limit_cents: 100000000, odfi_window_cap_cents: 2500000000 }
              as: PlatformAdmin
              captures: { w1: $.data.id }
            - call: "POST /network/originators"
              payload: { legal_name: "Alpha Payroll Corp", risk_tier: "STANDARD", exposure_limit_cents: 1000000000 }
              as: ParticipantOfficer
              as_user_id: "${p1}"
              captures: { o1: $.data.id }
            - call: "POST /network/originators/${o1}/transition"
              payload: { to_state: "APPROVED" }
              as: ParticipantOfficer
              as_user_id: "${p1}"
            - call: "POST /network/account-validations"
              payload: { originator_id: "${o1}", account_number_hash: "acct-web-1", method: "MICRO_DEPOSIT" }
              as: ParticipantOfficer
              as_user_id: "${p1}"
              captures: { av: $.data.id, av_until: $.data.validated_until }
          trigger:
            - call: "POST /network/payment-entries"
              payload: { originator_id: "${o1}", transaction_code_id: "${tc_web}", amount_cents: 2000, receiver_account_number_hash: "acct-web-1", receiver_name: "R W", authorization_type: "ORAL_RECORDED", same_day: false }
              as: ParticipantOfficer
              as_user_id: "${p1}"
