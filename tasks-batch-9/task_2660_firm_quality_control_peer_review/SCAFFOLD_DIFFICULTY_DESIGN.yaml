  # =====================================================================
  # Rule 5 - priority_pair_validation_conflict
  # The three pinned pairs from §1.4 validation_priority_notes, each on a
  # different endpoint and a different pair of error categories.
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: eqr_window_state_check_outranks_cooling_off_safety_check
        grounds:
          - validations[priority=18]
          - validations[priority=38]
          - errors[ERR_ENGAGEMENT_NOT_IN_EQR_WINDOW]
          - errors[ERR_COOLING_OFF_NOT_MET]
          - calculations.eqr_reviewer_eligibility
          - concurrency_rules[eqr-assign-stale-engagement]
        distinguishing_aspect: |
          Pair: state (priority 18) versus business_safety (priority 38) on the same request. The
          engagement is REPORT_RELEASED (outside the {FIELDWORK, EQR_PENDING} assignment window) AND
          the named reviewer left that client's engagement team only 400 days before period_end
          (below the 730-day cooling-off floor), so both checks fail on one call. The response must be
          exactly one error, ERR_ENGAGEMENT_NOT_IN_EQR_WINDOW, never ERR_COOLING_OFF_NOT_MET and never
          a multi-error body, and no EngagementQualityReview row may be created.
        test_recipe:
          setup:
