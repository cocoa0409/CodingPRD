# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3181 — Biometric Identity Lane Enrollment & Airport Partner Ops
# Nine Difficulty Rules, 2 instances each (18 instances total).
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 and is reachable from
# empty-DB via the structured setup_api_calls chain.
#
# Shared setup idiom (replayed per-instance, no YAML anchors — each instance
# is self-contained so the unit-test-generator can transcribe it verbatim):
#   OPS  = OpsAdmin (opaque, any X-User-ID)
#   PM   = PartnerManager (opaque)
#   CO   = ComplianceOfficer (opaque)
#   Member calls carry as_user_id bound to the captured member id.
# Logical clock starts at the fixed default 2026-09-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: settlement_fee_airport_formula_vs_venue_formula_diverge
        grounds:
          - calculations.partner_monthly_fee
          - calculations.partner_monthly_fee.variants.venue_event_payout
        distinguishing_aspect: |
          Two different entity domains: the AIRPORT variant computes the fee
          from subscription MRR + verification revenue against a monthly
          minimum; the VENUE variant computes it from seat capacity + a
          per-event fee against a venue minimum. Identical
          verification_revenue_cents (1000000) yields fee_cents 74000
          (airport, revenue variable wins over the 25000 floor) vs 5000
          (venue, capacity 8000 * 0.02 = 160 + 3 events below threshold = 160,
          floored to 5000).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Airport DFW with an ACTIVE agreement (rev_share 0.12, subscription_share 0.02, minimum 25000)."
            - "Venue STADIUM A."
          setup_api_calls:
            - call: "POST /airports"
              payload: { iata_code: "DFW", name: "Dallas Fort Worth", city: "Dallas", state_code: "TX" }
              as: OpsAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /partner-agreements"
              payload: { airport_id: "${ap_id}", rev_share_rate: 0.12, subscription_share_rate: 0.02, monthly_minimum_cents: 25000, federal_integration: true, staffing_footprint_seats: 4, term_months: 12, effective_from: "2026-09-01T00:00:00Z" }
              as: PartnerManager
              captures: { agr_id: $.data.id }
            - call: "POST /partner-agreements/${agr_id}/activate"
              payload: {}
              as: PartnerManager
            - call: "POST /venues"
              payload: { name: "Stadium A", venue_type: "STADIUM", city: "Dallas", state_code: "TX", access_rule_mode: "AGE_18_PLUS" }
              as: VenueOps
              captures: { ven_id: $.data.id }
          trigger:
            - call: "POST /partner-agreements/${agr_id}/settlements"
              payload: { period_start: "2026-09-01", period_end: "2026-10-01", attributable_mrr_cents: 450000, verification_revenue_cents: 1000000 }
              as: PartnerManager
              captures: { set_air: $.data.id }
            - call: "POST /venues/${ven_id}/payout-settlements"
              payload: { period_start: "2026-09-01", period_end: "2026-10-01", verification_revenue_cents: 1000000, events_count: 3, venue_capacity_seats: 8000 }
              as: VenueOps
              captures: { set_ven: $.data.id }
          assert:
            - "AgreementSettlement.${set_air}.calculation_variant == AIRPORT"
            - "AgreementSettlement.${set_air}.fee_cents == 74000"
            - "AgreementSettlement.${set_ven}.calculation_variant == VENUE"
            - "AgreementSettlement.${set_ven}.fee_cents == 5000"
            - "AgreementSettlement.${set_air}.fee_cents != AgreementSettlement.${set_ven}.fee_cents"

      - name: settlement_draft_provisional_recomputes_vs_finalized_frozen
        grounds:
          - calculations.partner_monthly_fee
          - calculations.partner_monthly_fee.variants.provisional_vs_final
          - state_machines.AgreementSettlement.DRAFT_to_FINALIZED
        distinguishing_aspect: |
          Same entity domain as the base variant but a different axis: a DRAFT
          settlement recomputes fee_cents from current inputs, while FINALIZED
          freezes it. With MRR 10000 + REV 0 against a 30000 minimum the DRAFT
          fee is 30000 (floor); after finalize the fee stays 30000 even though
          the agreement inputs would still evaluate the same — the observable
          divergence is that a second settlement created DRAFT and read after
          finalize of the first still shows the freshly computed value while
          the finalized one is pinned.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, then advanced to 2026-10-02 so the September period has ended."
            - "Airport PDX with ACTIVE agreement (rates 0.12/0.02, minimum 30000)."
          setup_api_calls:
            - call: "POST /airports"
              payload: { iata_code: "PDX", name: "Portland Intl", city: "Portland", state_code: "OR" }
              as: OpsAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /partner-agreements"
              payload: { airport_id: "${ap_id}", rev_share_rate: 0.12, subscription_share_rate: 0.02, monthly_minimum_cents: 30000, federal_integration: false, staffing_footprint_seats: 4, term_months: 12, effective_from: "2026-09-01T00:00:00Z" }
              as: PartnerManager
              captures: { agr_id: $.data.id }
            - call: "POST /partner-agreements/${agr_id}/activate"
              payload: {}
              as: PartnerManager
            - call: "POST /partner-agreements/${agr_id}/settlements"
              payload: { period_start: "2026-09-01", period_end: "2026-10-01", attributable_mrr_cents: 10000, verification_revenue_cents: 0 }
              as: PartnerManager
              captures: { set_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: OpsAdmin
          trigger:
            - call: "POST /agreement-settlements/${set_id}/finalize"
              payload: {}
              as: PartnerManager
            - call: "POST /agreement-settlements/${set_id}/mark-paid"
              payload: {}
              as: PartnerManager
          assert:
            - "Before finalize: AgreementSettlement.${set_id}.fee_cents == 30000 (floor wins over variable 200)"
            - "After finalize: AgreementSettlement.${set_id}.status == FINALIZED and fee_cents still == 30000 (frozen)"
            - "After mark-paid: AgreementSettlement.${set_id}.status == PAID"
            - "A second finalize attempt on the PAID settlement is rejected with ERR_INVALID_STATE (409)"

      - name: plan_upgrade_deferred_vs_downgrade_immediate_diverge
        grounds:
          - calculations.invoice_amount
          - calculations.invoice_amount.variants.pro_rata_midcycle_upgrade
          - concurrency_rules[plan-change-stale-subscription-version]
        distinguishing_aspect: |
          Subscription-domain dual variant: INDIVIDUAL -> FAMILY is deferred
          (pending_plan set, plan and price_cents unchanged, no mid-cycle
          invoice), while FAMILY -> INDIVIDUAL applies immediately. Same
          subscription, two directions, observably different post-call state.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Two members enrolled to ACTIVE via enrollment-center enrollments: A (INDIVIDUAL sub) and B (FAMILY sub)."
          setup_api_calls:
            - call: "POST /airports"
              payload: { iata_code: "AUS", name: "Austin Bergstrom", city: "Austin", state_code: "TX" }
              as: OpsAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /partner-agreements"
              payload: { airport_id: "${ap_id}", rev_share_rate: 0.10, subscription_share_rate: 0.02, monthly_minimum_cents: 10000, federal_integration: false, staffing_footprint_seats: 4, term_months: 12, effective_from: "2026-09-01T00:00:00Z" }
              as: PartnerManager
              captures: { agr_id: $.data.id }
            - call: "POST /partner-agreements/${agr_id}/activate"
              payload: {}
              as: PartnerManager
            - call: "POST /enrollment-centers"
              payload: { airport_id: "${ap_id}", name: "AUS Center", ambassador_capacity: 4 }
              as: OpsAdmin
              captures: { ec_id: $.data.id }
            - call: "POST /members/register"
              payload: { email: "a@x.com", full_name: "Member A", date_of_birth: "1990-01-01" }
              as: Member
              captures: { ma_id: $.data.id }
            - call: "POST /enrollments"
              payload: { member_id: "${ma_id}", site_type: "ENROLLMENT_CENTER", site_id: "${ec_id}", document_type: "PASSPORT", document_number: "PA1111111", document_expiry: "2030-01-01", biometric_capture_ok: true }
              as: Member
              as_user_id: "${ma_id}"
              captures: { ea_id: $.data.id }
            - call: "POST /enrollments/${ea_id}/submit-document"
              payload: {}
              as: Member
              as_user_id: "${ma_id}"
            - call: "POST /enrollments/${ea_id}/capture-biometric"
              payload: {}
              as: Member
              as_user_id: "${ma_id}"
            - call: "POST /enrollments/${ea_id}/complete"
              payload: {}
              as: Member
              as_user_id: "${ma_id}"
            - call: "POST /subscriptions"
              payload: { member_id: "${ma_id}", plan: "INDIVIDUAL", billing_cycle_day: 1 }
              as: Member
              as_user_id: "${ma_id}"
              captures: { suba_id: $.data.id, suba_v: $.data.version }
            - call: "POST /members/register"
              payload: { email: "b@x.com", full_name: "Member B", date_of_birth: "1991-01-01" }
              as: Member
              captures: { mb_id: $.data.id }
            - call: "POST /enrollments"
              payload: { member_id: "${mb_id}", site_type: "ENROLLMENT_CENTER", site_id: "${ec_id}", document_type: "PASSPORT", document_number: "PB2222222", document_expiry: "2030-01-01", biometric_capture_ok: true }
              as: Member
              as_user_id: "${mb_id}"
              captures: { eb_id: $.data.id }
            - call: "POST /enrollments/${eb_id}/submit-document"
              payload: {}
              as: Member
              as_user_id: "${mb_id}"
            - call: "POST /enrollments/${eb_id}/capture-biometric"
              payload: {}
              as: Member
              as_user_id: "${mb_id}"
            - call: "POST /enrollments/${eb_id}/complete"
              payload: {}
              as: Member
              as_user_id: "${mb_id}"
            - call: "POST /subscriptions"
              payload: { member_id: "${mb_id}", plan: "FAMILY", billing_cycle_day: 1 }
              as: Member
              as_user_id: "${mb_id}"
              captures: { subb_id: $.data.id, subb_v: $.data.version }
          trigger:
            - call: "POST /subscriptions/${suba_id}/change-plan"
              payload: { new_plan: "FAMILY", expected_subscription_version: "${suba_v}" }
              as: Member
              as_user_id: "${ma_id}"
            - call: "POST /subscriptions/${subb_id}/change-plan"
              payload: { new_plan: "INDIVIDUAL", expected_subscription_version: "${subb_v}" }
              as: Member
              as_user_id: "${mb_id}"
          assert:
            - "Subscription.${suba_id}.plan == INDIVIDUAL (deferred) and pending_plan == FAMILY"
            - "Subscription.${suba_id}.price_cents == 18900 (unchanged mid-cycle)"
            - "Subscription.${subb_id}.plan == INDIVIDUAL (applied immediately) and pending_plan is null"
            - "Subscription.${suba_id}.version == ${suba_v} + 1 and Subscription.${subb_id}.version == ${subb_v} + 1"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: airport_fee_minimum_applied_after_two_rounded_shares
        grounds:
          - calculations.partner_monthly_fee
        distinguishing_aspect: |
          Mode (a) >= 3 inputs with non-linear interaction: fee = max(F,
          round(MRR*S) + round(REV*R)) — the max picks the winner AFTER two
          independently rounded shares. Agreement X: F=25000, MRR=450000,
          REV=1000000, R=0.12, S=0.02 → variable 54000+20000=74000 wins.
          Agreement Y (same airport revenue, F=30000, MRR=10000, REV=1000000):
          variable 200+12000=12200 < 30000 → floor wins at 30000.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Two airports (BWI, DCA), each with an ACTIVE agreement; BWI: minimum 25000, MRR-heavy inputs; DCA: minimum 30000, MRR 10000."
          setup_api_calls:
            - call: "POST /airports"
              payload: { iata_code: "BWI", name: "Baltimore Washington", city: "Baltimore", state_code: "MD" }
              as: OpsAdmin
              captures: { ap1: $.data.id }
            - call: "POST /partner-agreements"
              payload: { airport_id: "${ap1}", rev_share_rate: 0.12, subscription_share_rate: 0.02, monthly_minimum_cents: 25000, federal_integration: false, staffing_footprint_seats: 4, term_months: 12, effective_from: "2026-09-01T00:00:00Z" }
              as: PartnerManager
              captures: { ag1: $.data.id }
            - call: "POST /partner-agreements/${ag1}/activate"
              payload: {}
              as: PartnerManager
            - call: "POST /airports"
              payload: { iata_code: "DCA", name: "Reagan National", city: "Arlington", state_code: "VA" }
              as: OpsAdmin
              captures: { ap2: $.data.id }
            - call: "POST /partner-agreements"
              payload: { airport_id: "${ap2}", rev_share_rate: 0.12, subscription_share_rate: 0.02, monthly_minimum_cents: 30000, federal_integration: false, staffing_footprint_seats: 4, term_months: 12, effective_from: "2026-09-01T00:00:00Z" }
              as: PartnerManager
              captures: { ag2: $.data.id }
            - call: "POST /partner-agreements/${ag2}/activate"
              payload: {}
              as: PartnerManager
          trigger:
            - call: "POST /partner-agreements/${ag1}/settlements"
              payload: { period_start: "2026-09-01", period_end: "2026-10-01", attributable_mrr_cents: 450000, verification_revenue_cents: 1000000 }
              as: PartnerManager
              captures: { s1: $.data.id }
            - call: "POST /partner-agreements/${ag2}/settlements"
              payload: { period_start: "2026-09-01", period_end: "2026-10-01", attributable_mrr_cents: 10000, verification_revenue_cents: 1000000 }
              as: PartnerManager
              captures: { s2: $.data.id }
          assert:
            - "AgreementSettlement.${s1}.fee_cents == 74000 (variable 54000 + 20000 beats floor 25000)"
            - "AgreementSettlement.${s2}.fee_cents == 30000 (floor beats variable 200 + 12000 = 12200)"

      - name: invoice_per_line_round_then_sum_order_pinned
        grounds:
          - calculations.invoice_amount
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-per-line-then-sum.
          FAMILY with a 15% discount and 2 dependants: base round(18900*0.85)
          = 16065; each member line round(9900*0.85) = 8415; total 32895.
          Summing-then-rounding the member lines (round(19800*0.85)) would
          also give 16830, so the pinned order is additionally probed by the
          single-dependant case: 16065 + 8415 = 24480 where the alternative
          round((18900+9900)*0.85) = 24480 — equal, so the assertion pins the
          per-line intermediate value 8415 itself via Subscription.price_cents
          == 16065 and invoice amount_cents == 32895 with slots_used == 3.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Primary member ACTIVE with FAMILY subscription + 15% discount + two ACTIVE dependants occupying both remaining slots."
          setup_api_calls:
            - call: "POST /airports"
              payload: { iata_code: "SEA", name: "Seattle Tacoma", city: "Seattle", state_code: "WA" }
              as: OpsAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /partner-agreements"
              payload: { airport_id: "${ap_id}", rev_share_rate: 0.10, subscription_share_rate: 0.02, monthly_minimum_cents: 10000, federal_integration: false, staffing_footprint_seats: 4, term_months: 12, effective_from: "2026-09-01T00:00:00Z" }
              as: PartnerManager
              captures: { agr_id: $.data.id }
            - call: "POST /partner-agreements/${agr_id}/activate"
              payload: {}
              as: PartnerManager
            - call: "POST /enrollment-centers"
              payload: { airport_id: "${ap_id}", name: "SEA Center", ambassador_capacity: 4 }
              as: OpsAdmin
              captures: { ec_id: $.data.id }
            - call: "POST /members/register"
              payload: { email: "primary@x.com", full_name: "Pri Mary", date_of_birth: "1990-01-01" }
              as: Member
              captures: { m_id: $.data.id }
            - call: "POST /enrollments"
              payload: { member_id: "${m_id}", site_type: "ENROLLMENT_CENTER", site_id: "${ec_id}", document_type: "PASSPORT", document_number: "P1234567", document_expiry: "2030-01-01", biometric_capture_ok: true }
              as: Member
              as_user_id: "${m_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/submit-document"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /enrollments/${enr_id}/capture-biometric"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /enrollments/${enr_id}/complete"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /subscriptions"
              payload: { member_id: "${m_id}", plan: "FAMILY", billing_cycle_day: 1 }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /partner-discounts"
              payload: { airport_id: "${ap_id}", code: "SEA15", percent_off: 15, max_redemptions: 10, expires_at: "2027-01-01T00:00:00Z" }
              as: PartnerManager
            - call: "POST /subscriptions/${sub_id}/attach-discount"
              payload: { discount_code: "SEA15" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /members/register"
              payload: { email: "dep1@x.com", full_name: "Dep One", date_of_birth: "1992-02-02" }
              as: Member
              captures: { d1_id: $.data.id }
            - call: "POST /members/register"
              payload: { email: "dep2@x.com", full_name: "Dep Two", date_of_birth: "1994-03-03" }
              as: Member
              captures: { d2_id: $.data.id }
            - call: "POST /enrollments"
              payload: { member_id: "${d1_id}", site_type: "ENROLLMENT_CENTER", site_id: "${ec_id}", document_type: "PASSPORT", document_number: "P7654321", document_expiry: "2030-01-01", biometric_capture_ok: true }
              as: Member
              as_user_id: "${d1_id}"
              captures: { enr_d1: $.data.id }
            - call: "POST /enrollments/${enr_d1}/submit-document"
              payload: {}
              as: Member
              as_user_id: "${d1_id}"
            - call: "POST /enrollments/${enr_d1}/capture-biometric"
              payload: {}
              as: Member
              as_user_id: "${d1_id}"
            - call: "POST /enrollments/${enr_d1}/complete"
              payload: {}
              as: Member
              as_user_id: "${d1_id}"
            - call: "POST /enrollments"
              payload: { member_id: "${d2_id}", site_type: "ENROLLMENT_CENTER", site_id: "${ec_id}", document_type: "PASSPORT", document_number: "P7654322", document_expiry: "2030-01-01", biometric_capture_ok: true }
              as: Member
              as_user_id: "${d2_id}"
              captures: { enr_d2: $.data.id }
            - call: "POST /enrollments/${enr_d2}/submit-document"
              payload: {}
              as: Member
              as_user_id: "${d2_id}"
            - call: "POST /enrollments/${enr_d2}/capture-biometric"
              payload: {}
              as: Member
              as_user_id: "${d2_id}"
            - call: "POST /enrollments/${enr_d2}/complete"
              payload: {}
              as: Member
              as_user_id: "${d2_id}"
            - call: "GET /family-groups"
              payload: { primary_subscription_id: "${sub_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { fg_id: "$.data[0].id" }
            - call: "POST /family-groups/${fg_id}/members"
              payload: { member_id: "${d1_id}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /family-groups/${fg_id}/members"
              payload: { member_id: "${d2_id}" }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /subscriptions/${sub_id}/invoices/run-cycle"
              payload: {}
              as: OpsAdmin
              captures: { inv_id: $.data.id }
          assert:
            - "SubscriptionInvoice.${inv_id}.amount_cents == 32895"
            - "Subscription.${sub_id}.price_cents == 16065"
            - "FamilyGroup.${fg_id}.slots_used == 3"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: lane_open_maintenance_open_cycle_before_close
        grounds:
          - state_machines.Lane
          - state_machines.Lane.OPEN_to_MAINTENANCE
          - state_machines.Lane.MAINTENANCE_to_OPEN
        distinguishing_aspect: |
          Lane has a true cycle PLANNED → OPEN → MAINTENANCE → OPEN on the
          Lane entity (branching with revert), distinct from the Enrollment
          cycle. Asserts: cycle round-trip preserves lane_capacity (MAINTENANCE
          lanes still count), and CLOSED is reachable only forward.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Airport SFO, ACTIVE agreement with staffing_footprint_seats=4 (capacity limit 16 hours), one lane L (capacity_hours 6) OPEN."
          setup_api_calls:
            - call: "POST /airports"
              payload: { iata_code: "SFO", name: "San Francisco Intl", city: "San Francisco", state_code: "CA" }
              as: OpsAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /partner-agreements"
              payload: { airport_id: "${ap_id}", rev_share_rate: 0.10, subscription_share_rate: 0.02, monthly_minimum_cents: 10000, federal_integration: false, staffing_footprint_seats: 4, term_months: 12, effective_from: "2026-09-01T00:00:00Z" }
              as: PartnerManager
              captures: { agr_id: $.data.id }
            - call: "POST /partner-agreements/${agr_id}/activate"
              payload: {}
              as: PartnerManager
            - call: "POST /lanes"
              payload: { airport_id: "${ap_id}", agreement_id: "${agr_id}", terminal: "T2", position_index: 1, open_time: "05:00", close_time: "22:00", capacity_hours: 6 }
              as: OpsAdmin
              captures: { lane_id: $.data.id }
            - call: "POST /lanes/${lane_id}/open"
              payload: {}
              as: OpsAdmin
          trigger:
            - call: "POST /lanes/${lane_id}/close"
              payload: { mode: "MAINTENANCE" }
              as: OpsAdmin
            - call: "POST /lanes/${lane_id}/open"
              payload: {}
              as: OpsAdmin
            - call: "GET /partner-agreements/${agr_id}"
              payload: {}
              as: PartnerManager
              captures: { cap_after: $.data.lane_capacity }
          assert:
            - "Lane.${lane_id}.status == OPEN after the MAINTENANCE → OPEN revert"
            - "PartnerAgreement.${agr_id}.lane_capacity == 6 after the full cycle (MAINTENANCE lanes still count, so capacity never dropped)"
            - "Lane.${lane_id}.version advanced by exactly 3 since creation (open, close, reopen)"

      - name: enrollment_fraud_review_branch_approve_vs_reject
        grounds:
          - state_machines.Enrollment
          - state_machines.Enrollment.FRAUD_REVIEW_to_COMPLETED
          - state_machines.Enrollment.FRAUD_REVIEW_to_REJECTED
        distinguishing_aspect: |
          Enrollment has a branching fork at submission: DOCUMENT_VERIFIED
          (low risk) vs FRAUD_REVIEW (score in [15,20)) vs REJECTED (>=20),
          with divergent side-effect sets per branch (approve completes with
          member activation; reject increments document_reject_count_90d).
          Fixture drives score exactly 17 (VELOCITY 8 + WATCHLIST 8 +
