# =============================================================================
# Scaffold: registry-operations benchmark seed tables (v1)
# Task: task_3272_registry_operations_renewal_grace_periods_registrar_accreditation
# =============================================================================

scenario: |
  Registry Operations, Renewal Grace Periods & Registrar Accreditation (Verisign): registry database of second-level domain registrations with authoritative name server operation, registrar accreditation and registry agreement requirements including technical testing and financial standing, domain lifecycle management across registration, auto-renew grace, redemption grace and pending delete with fee differences, wholesale pricing to registrars under contractual price caps and increase notice requirements, transfer between registrars with authorization codes and dispute handling, registry lock and security services for high-value names, abuse reporting, court order compliance and domain suspension processes, resolution infrastructure capacity and availability commitments

domain_name: registry-operations
api_prefix: /registry

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Registrar
    parent: null
    common_fields: true
    fields:
      - { name: iana_number, type: integer, source: input, description: "IANA-assigned registrar number; unique across registrars", constraints: "unique; 1 <= iana_number <= 99999" }
      - { name: legal_name, type: string, source: input, description: "Legal entity name of the registrar applicant" }
      - { name: application_fee_cents, type: integer, source: input, description: "Non-refundable accreditation application fee in cents", constraints: ">= 0" }
      - { name: annual_fee_cents, type: integer, source: input, description: "Annual accreditation fee in cents before proration", constraints: ">= 0" }
      - { name: escrow_deposit_cents, type: integer, source: input, description: "Financial-standing escrow deposit held by the registry, in cents", constraints: ">= 0" }
      - { name: technical_test_score, type: integer, source: input, description: "OT&E technical test score, integer 0..100; accreditation requires >= 80", constraints: "0 <= technical_test_score <= 100" }
      - { name: financial_statement_verified, type: boolean, source: input, description: "Whether audited financial statements were verified by the registry" }
      - { name: credit_hold, type: boolean, source: input, description: "Registry finance hold flag; blocks new creates and transfers-in", default: false }
      - { name: status, type: enum, source: system, description: "PENDING_TESTS | ACTIVE | SUSPENDED | TERMINATED" }
      - { name: accredited_on, type: datetime, source: system, description: "Timestamp of PENDING_TESTS -> ACTIVE; null until accredited" }
      - { name: accredited_version, type: integer, source: system, description: "Registrar.version snapshot captured at accreditation; price-increase effectiveness is gated against it" }
      - { name: all_in_cost_cents, type: integer, source: computed, description: "Accreditation all-in cost per calculations.accreditation_all_in_cost (PROVISIONAL or AUDIT variant)" }
      - { name: annual_fee_mode, type: enum, source: system, description: "PROVISIONAL | AUDIT — which annual-fee basis all_in_cost_cents currently reflects" }

  - name: PriceSchedule
    parent: null
    common_fields: true
    fields:
      - { name: create_fee_cents, type: integer, source: input, description: "Wholesale per-year create price in cents", constraints: ">= 0" }
      - { name: renew_fee_cents, type: integer, source: input, description: "Wholesale per-year renewal price in cents", constraints: ">= 0" }
      - { name: restore_fee_cents, type: integer, source: input, description: "Redemption-grace restore fee in cents", constraints: ">= 0" }
      - { name: transfer_fee_cents, type: integer, source: input, description: "Per-transfer wholesale price in cents; funds the mandatory 1-year extension", constraints: ">= 0" }
      - { name: effective_on, type: datetime, source: input, description: "When this schedule becomes the effective one; must be strictly in the future at submission time" }
      - { name: announced_at, type: datetime, source: system, description: "Submission timestamp; drives the >= 180-day increase-notice check" }
      - { name: supersedes_schedule_id, type: string, source: input, description: "FK -> PriceSchedule.id; the schedule this one replaces (null for the very first schedule)", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "PROPOSED | EFFECTIVE | SUPERSEDED" }

  - name: Domain
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Second-level domain label under the operated TLD, e.g. example", constraints: "unique; lowercase [a-z0-9-], 1..63 chars, no leading/trailing hyphen" }
      - { name: registrar_id, type: string, source: input, description: "FK -> Registrar.id; sponsoring registrar of record" }
      - { name: years, type: integer, source: input, description: "Initial registration term in whole years", constraints: "1 <= years <= 10" }
      - { name: premium, type: boolean, source: input, description: "Premium-name flag; premium names carry a 10% registry service surcharge on every lifecycle invoice", default: false }
      - { name: expires_on, type: datetime, source: system, description: "Current expiry instant; set at creation and extended by renewals, restores, and transfers" }
      - { name: grace_deadline, type: datetime, source: system, description: "expires_on + 45 days; the auto-renew grace window boundary used by explicit renewals" }
      - { name: status, type: enum, source: system, description: "ACTIVE | AUTO_RENEW_GRACE | REDEMPTION_GRACE | PENDING_DELETE | DELETED | TRANSFERRING" }
      - { name: lock_status, type: enum, source: system, description: "NONE | CLIENT_LOCK | REGISTRY_LOCK; independent security dimension", default: "NONE" }
      - { name: suspension_status, type: enum, source: system, description: "NONE | HOLD; independent legal/abuse dimension; HOLD blocks lifecycle mutations", default: "NONE" }
      - { name: registry_lock_token_hash, type: string, source: system, description: "Hash of the registry-lock passphrase; null unless REGISTRY_LOCK is engaged", constraints: "nullable" }
      - { name: auto_renewed_on, type: datetime, source: system, description: "Timestamp the system auto-renewed the domain into AUTO_RENEW_GRACE; null while ACTIVE", constraints: "nullable" }
      - { name: delete_scheduled_on, type: datetime, source: system, description: "Date on which the pending-delete purge will release the name; set at PENDING_DELETE entry", constraints: "nullable" }

  - name: Nameserver
    parent: null
    common_fields: true
    fields:
      - { name: hostname, type: string, source: input, description: "Authoritative nameserver hostname", constraints: "unique" }
      - { name: ip_addresses, type: array, source: input, description: "Glue IP addresses (v4/v6 strings)", constraints: ">= 1 address" }
      - { name: capacity_qps, type: integer, source: input, description: "Provisioned resolution capacity in queries per second", constraints: "capacity_qps > 0" }

  - name: DomainNameserverLink
    parent: null
    common_fields: false
    fields:
      - { name: domain_id, type: string, source: input, description: "FK -> Domain.id; linked domain" }
      - { name: nameserver_id, type: string, source: input, description: "FK -> Nameserver.id; linked nameserver" }

  - name: Transfer
    parent: null
    common_fields: true
    fields:
      - { name: domain_id, type: string, source: input, description: "FK -> Domain.id; domain being transferred" }
      - { name: from_registrar_id, type: string, source: system, description: "FK -> Registrar.id; losing registrar, copied from Domain.registrar_id at request time" }
      - { name: to_registrar_id, type: string, source: input, description: "FK -> Registrar.id; gaining registrar (the requester)" }
      - { name: auth_code, type: string, source: system, description: "Registry-issued plaintext authorization code, returned once in the POST /registry/transfers creation response and never exposed by later GETs" }
      - { name: auth_code_hash, type: string, source: system, description: "Hash of the registry-issued authorization code" }
      - { name: auth_code_expires_at, type: datetime, source: system, description: "Authorization-code expiry: requested_at + 14 days" }
      - { name: requested_at, type: datetime, source: system, description: "Transfer request timestamp; drives the 5-day auto-ack" }
      - { name: status, type: enum, source: system, description: "REQUESTED | ACKED | NACKED | AUTO_ACKED | COMPLETED | DISPUTED | REVERSED" }
      - { name: dispute_reason, type: string, source: input, description: "Losing registrar's reason when disputing a completed transfer", constraints: "required only on dispute" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: registrar_id, type: string, source: system, description: "FK -> Registrar.id; registrar being debited" }
      - { name: domain_id, type: string, source: system, description: "FK -> Domain.id; null on accreditation invoices", constraints: "nullable" }
      - { name: kind, type: enum, source: system, description: "CREATE | RENEW | AUTO_RENEW | RESTORE | TRANSFER | ACCREDITATION" }
      - { name: base_cents, type: integer, source: system, description: "Wholesale base amount before premium surcharge" }
      - { name: premium_surcharge_cents, type: integer, source: system, description: "Premium service surcharge (10% of base, round_half_up); 0 for non-premium names and accreditation invoices" }
      - { name: total_cents, type: integer, source: system, description: "base_cents + premium_surcharge_cents" }
      - { name: price_schedule_id, type: string, source: system, description: "FK -> PriceSchedule.id; the schedule in force when the invoice was minted; null on accreditation invoices", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "OPEN | VOIDED" }

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: registrar_id, type: string, source: system, description: "FK -> Registrar.id; account owner" }
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id; null for top-ups and write-offs", constraints: "nullable" }
      - { name: amount_cents, type: integer, source: system, description: "Signed ledger amount: credits positive, debits negative" }
      - { name: entry_type, type: enum, source: system, description: "TOP_UP | DEBIT | VOID_CREDIT | WRITE_OFF" }

  - name: AbuseReport
    parent: null
    common_fields: true
    fields:
      - { name: domain_id, type: string, source: input, description: "FK -> Domain.id; reported domain" }
      - { name: reporter_contact, type: string, source: input, description: "Reporter email or reference" }
      - { name: category, type: enum, source: input, description: "PHISHING | MALWARE | SPAM | OTHER" }
      - { name: detail, type: string, source: input, description: "Free-text abuse description" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | ACTIONED | DISMISSED" }

  - name: CourtOrder
    parent: null
    common_fields: true
    fields:
      - { name: case_reference, type: string, source: input, description: "Court case identifier", constraints: "unique" }
      - { name: domain_id, type: string, source: input, description: "FK -> Domain.id; domain named in the order" }
      - { name: action, type: enum, source: input, description: "SUSPEND | UNSUSPEND | TRANSFER_TO_REGISTRY" }
      - { name: effective_immediately, type: boolean, source: input, description: "When false, enforcement is deferred 48 hours; when true, enforced at once" }
      - { name: status, type: enum, source: system, description: "LODGED | ENFORCED" }

  - name: RegistrarAccreditationNotice
    parent: null
    common_fields: false
    fields:
      - { name: registrar_id, type: string, source: system, description: "FK -> Registrar.id; notice recipient" }
      - { name: price_schedule_id, type: string, source: system, description: "FK -> PriceSchedule.id; the announced schedule" }
      - { name: notice_kind, type: enum, source: system, description: "PRICE_INCREASE_ANNOUNCED | PRICE_INCREASE_EFFECTIVE" }
      - { name: sent_at, type: datetime, source: system, description: "Logical-clock timestamp when the notice was emitted" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Registrar
    initial_state: PENDING_TESTS
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING_TESTS
        to: ACTIVE
        trigger: "POST /registry/registrars/{id}/accredit"
        actor: RegistryAdmin
        preconditions:
          - "Registrar.status == PENDING_TESTS"
          - "technical_test_score >= 80 (ERR_TECHNICAL_TEST_FAILED)"
          - "financial_statement_verified == true (ERR_FINANCIAL_STANDING_UNVERIFIED)"
        side_effects:
          - "accredited_on = current logical time; accredited_version = Registrar.version BEFORE this transition increments it"
          - "annual_fee_mode = PROVISIONAL and all_in_cost_cents recomputed per calculations.accreditation_all_in_cost (PROVISIONAL)"
          - "Mint ACCREDITATION invoice: base = application_fee_cents + round_half_up(annual_fee_cents * remaining_days_in_calendar_year / days_in_calendar_year) + escrow_deposit_cents, premium_surcharge_cents = 0; LedgerEntry DEBIT -total_cents"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /registry/registrars/{id}/suspend"
        actor: RegistryAdmin
        preconditions:
          - "Registrar.status == ACTIVE"
        side_effects:
          - "Registrar now fails the ACTIVE precondition on domain create, renew, restore, transfer-request (ERR_REGISTRAR_NOT_ACTIVE)"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /registry/registrars/{id}/reinstate"
        actor: RegistryAdmin
        preconditions:
          - "Registrar.status == SUSPENDED"
        side_effects:
          - "annual_fee_mode = AUDIT and all_in_cost_cents recomputed per calculations.accreditation_all_in_cost (AUDIT: annual at face value)"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /registry/registrars/{id}/terminate"
        actor: RegistryAdmin
        preconditions:
          - "Registrar.status == ACTIVE"
          - "No Domain with registrar_id == this registrar in status ACTIVE, AUTO_RENEW_GRACE, REDEMPTION_GRACE, or TRANSFERRING (ERR_REGISTRAR_HAS_LIVE_DOMAINS)"
        side_effects:
          - "Mint LedgerEntry WRITE_OFF crediting back escrow_deposit_cents if positive"

      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /registry/registrars/{id}/terminate"
        actor: RegistryAdmin
        preconditions:
          - "Registrar.status == SUSPENDED"
          - "No Domain with registrar_id == this registrar in status ACTIVE, AUTO_RENEW_GRACE, REDEMPTION_GRACE, or TRANSFERRING (ERR_REGISTRAR_HAS_LIVE_DOMAINS)"
        side_effects:
          - "Mint LedgerEntry WRITE_OFF crediting back escrow_deposit_cents if positive"

  - entity: Domain
    initial_state: ACTIVE
    terminal_states: [DELETED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /registry/domains/{id}/renew (explicit renewal inside the auto-renew grace window, i.e. current time <= grace_deadline)"
        actor: RegistrarOperator
        preconditions:
          - "Domain.status == ACTIVE"
          - "suspension_status == NONE (ERR_DOMAIN_SUSPENDED)"
          - "current time <= grace_deadline (ERR_GRACE_WINDOW_CLOSED)"
          - "years >= 1 and expires_on + years years <= expires_on + 10 years total term cap"
          - "Sponsoring registrar status == ACTIVE and credit_hold == false (ERR_REGISTRAR_NOT_ACTIVE / ERR_REGISTRAR_CREDIT_HOLD)"
        side_effects:
          - "expires_on += years years; grace_deadline recomputed = expires_on + 45 days"
          - "Mint RENEW invoice per calculations.lifecycle_invoice (base = renew_fee_cents * years from effective schedule); LedgerEntry DEBIT"

      - from: ACTIVE
        to: AUTO_RENEW_GRACE
        trigger: "system: POST /_clock/set_current_utc advancing the logical clock past expires_on while status == ACTIVE"
        actor: system
        preconditions:
          - "current time > expires_on and status == ACTIVE"
        side_effects:
          - "auto_renewed_on = expires_on"
          - "expires_on += 1 year; grace_deadline recomputed = expires_on + 45 days"
          - "Mint AUTO_RENEW invoice per calculations.lifecycle_invoice (base = renew_fee_cents from the schedule effective at the auto-renew instant); LedgerEntry DEBIT"

      - from: AUTO_RENEW_GRACE
        to: ACTIVE
        trigger: "POST /registry/domains/{id}/renew"
        actor: RegistrarOperator
        preconditions:
          - "Domain.status == AUTO_RENEW_GRACE"
          - "suspension_status == NONE (ERR_DOMAIN_SUSPENDED)"
          - "Sponsoring registrar status == ACTIVE and credit_hold == false"
        side_effects:
          - "expires_on += years years; grace_deadline recomputed"
          - "auto_renewed_on = null"
          - "Mint RENEW invoice per calculations.lifecycle_invoice; LedgerEntry DEBIT"

      - from: AUTO_RENEW_GRACE
        to: REDEMPTION_GRACE
        trigger: "system: logical clock passes expires_on + 45 days after auto-renew (the auto-renew grace lapse), OR POST /registry/domains/{id}/delete while AUTO_RENEW_GRACE"
        actor: system
        preconditions:
          - "current time > auto_renewed_on + 45 days, or explicit registrar delete"
        side_effects:
          - "AUTO_RENEW invoice status -> VOIDED and LedgerEntry VOID_CREDIT +total_cents reverses the auto-renew debit"
          - "expires_on reverts by 1 year (the auto-renew extension is unwound)"

      - from: ACTIVE
        to: REDEMPTION_GRACE
        trigger: "POST /registry/domains/{id}/delete"
        actor: RegistrarOperator
        preconditions:
          - "Domain.status == ACTIVE"
          - "suspension_status == NONE (ERR_DOMAIN_SUSPENDED)"
          - "Sponsoring registrar status == ACTIVE"
        side_effects: []

      - from: REDEMPTION_GRACE
        to: ACTIVE
        trigger: "POST /registry/domains/{id}/restore"
        actor: RegistrarOperator
        preconditions:
          - "Domain.status == REDEMPTION_GRACE"
          - "current time <= redemption entry time + 30 days (ERR_REDEMPTION_WINDOW_CLOSED)"
          - "suspension_status == NONE (ERR_DOMAIN_SUSPENDED)"
          - "Sponsoring registrar status == ACTIVE and credit_hold == false"
        side_effects:
          - "expires_on += 1 year; grace_deadline recomputed = expires_on + 45 days"
          - "auto_renewed_on = null"
          - "Mint RESTORE invoice per calculations.lifecycle_invoice (base = renew_fee_cents + restore_fee_cents from effective schedule); LedgerEntry DEBIT"

      - from: REDEMPTION_GRACE
        to: PENDING_DELETE
        trigger: "system: logical clock passes redemption entry time + 30 days without a restore"
        actor: system
        preconditions:
          - "current time > redemption entry time + 30 days"
        side_effects:
          - "delete_scheduled_on = date of (redemption entry + 35 days)"

      - from: PENDING_DELETE
        to: DELETED
        trigger: "system: logical clock passes redemption entry time + 35 days"
        actor: system
        preconditions:
          - "current time > redemption entry time + 35 days"
        side_effects:
          - "Name released: a subsequent POST /registry/domains with the same name is permitted (uniqueness excludes DELETED rows)"

      - from: ACTIVE
        to: TRANSFERRING
        trigger: "POST /registry/transfers (gaining registrar requests the transfer)"
        actor: RegistrarOperator
        preconditions:
          - "Domain.status == ACTIVE"
          - "suspension_status == NONE (ERR_DOMAIN_SUSPENDED)"
          - "lock_status == NONE (ERR_DOMAIN_LOCKED)"
          - "current time >= Domain.created_at + 60 days (ERR_TRANSFER_WINDOW_CLOSED)"
          - "No other Transfer for this domain in REQUESTED (ERR_TRANSFER_ALREADY_PENDING)"
          - "Gaining registrar status == ACTIVE and credit_hold == false (ERR_REGISTRAR_NOT_ACTIVE / ERR_REGISTRAR_CREDIT_HOLD)"
        side_effects:
          - "Transfer row created with from_registrar_id = Domain.registrar_id, auth_code_expires_at = requested_at + 14 days"

      - from: TRANSFERRING
        to: ACTIVE
        trigger: "Transfer resolves: POST /registry/transfers/{id}/complete, POST /registry/transfers/{id}/nack, POST /registry/transfers/{id}/reverse, or system auto-ack failure path — Domain follows the Transfer row's resolution"
        actor: system
        preconditions:
          - "Linked Transfer reached ACKED/AUTO_ACKED (complete) or NACKED/REVERSED"
        side_effects:
          - "On complete: Domain.registrar_id = Transfer.to_registrar_id, expires_on += 1 year, grace_deadline recomputed, TRANSFER invoice minted per calculations.lifecycle_invoice against the gaining registrar"
          - "On nack/reverse: Domain.registrar_id unchanged and no invoice"

  - entity: Transfer
    initial_state: REQUESTED
    terminal_states: [COMPLETED, NACKED, REVERSED]
    transitions:
      - from: REQUESTED
        to: ACKED
        trigger: "POST /registry/transfers/{id}/ack"
        actor: RegistrarOperator
        preconditions:
          - "Transfer.status == REQUESTED"
          - "Acting registrar is Transfer.from_registrar_id (ERR_NOT_TRANSFER_PARTY)"
          - "current time <= auth_code_expires_at (ERR_AUTH_CODE_EXPIRED)"
          - "Submitted auth_code matches auth_code_hash (ERR_AUTH_CODE_INVALID)"
        side_effects: []

      - from: REQUESTED
        to: AUTO_ACKED
        trigger: "system: logical clock passes requested_at + 5 days with no ack and no nack"
        actor: system
        preconditions:
          - "current time > requested_at + 5 days and status == REQUESTED"
        side_effects: []

      - from: REQUESTED
        to: NACKED
        trigger: "POST /registry/transfers/{id}/nack"
        actor: RegistrarOperator
        preconditions:
          - "Transfer.status == REQUESTED"
          - "Acting registrar is Transfer.from_registrar_id (ERR_NOT_TRANSFER_PARTY)"
        side_effects:
          - "Domain TRANSFERRING -> ACTIVE (registrar unchanged)"

      - from: ACKED
        to: COMPLETED
        trigger: "POST /registry/transfers/{id}/complete"
        actor: RegistrarOperator
        preconditions:
          - "Transfer.status == ACKED"
          - "Acting registrar is Transfer.to_registrar_id (ERR_NOT_TRANSFER_PARTY)"
        side_effects:
          - "Domain TRANSFERRING -> ACTIVE under the gaining registrar; expires_on += 1 year; grace_deadline recomputed"
          - "Mint TRANSFER invoice (base = transfer_fee_cents from effective schedule) debiting the GAINING registrar"

      - from: AUTO_ACKED
        to: COMPLETED
        trigger: "POST /registry/transfers/{id}/complete"
        actor: RegistrarOperator
        preconditions:
          - "Transfer.status == AUTO_ACKED"
          - "Acting registrar is Transfer.to_registrar_id"
        side_effects:
          - "Same completion side effects as ACKED -> COMPLETED"

      - from: COMPLETED
        to: DISPUTED
        trigger: "POST /registry/transfers/{id}/dispute"
        actor: RegistrarOperator
        preconditions:
          - "Transfer.status == COMPLETED"
          - "Acting registrar is Transfer.from_registrar_id (the loser)"
          - "current time <= completion time + 6 months (ERR_DISPUTE_WINDOW_CLOSED)"
        side_effects:
          - "Domain is frozen for further transfer requests: new POST /registry/transfers on this domain rejected with ERR_TRANSFER_DISPUTED"

      - from: DISPUTED
        to: REVERSED
        trigger: "POST /registry/transfers/{id}/reverse"
        actor: RegistryAdmin
        preconditions:
          - "Transfer.status == DISPUTED"
        side_effects:
          - "Domain.registrar_id reverts to Transfer.from_registrar_id; expires_on -= 1 year (the transfer extension is unwound); grace_deadline recomputed"
          - "TRANSFER invoice status -> VOIDED and LedgerEntry VOID_CREDIT +total_cents repays the gaining registrar"

      - from: DISPUTED
        to: COMPLETED
        trigger: "POST /registry/transfers/{id}/reverse with payload { uphold: true } — registry upholds the original transfer"
        actor: RegistryAdmin
        preconditions:
          - "Transfer.status == DISPUTED"
        side_effects:
          - "Domain stays with the gaining registrar; the transfer extension stands; no invoice movement (cycle back to COMPLETED)"

  - entity: PriceSchedule
    initial_state: PROPOSED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: EFFECTIVE
        trigger: "system: logical clock reaches effective_on"
        actor: system
        preconditions:
          - "current time >= effective_on and status == PROPOSED"
        side_effects:
          - "Previously EFFECTIVE schedule -> SUPERSEDED"
          - "Emit RegistrarAccreditationNotice PRICE_INCREASE_EFFECTIVE to every registrar with status in {ACTIVE, SUSPENDED} whose accredited_version < this PriceSchedule.version (version-pinning on accreditation)"

      - from: EFFECTIVE
        to: SUPERSEDED
        trigger: "system: a later PriceSchedule becomes EFFECTIVE"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AbuseReport
    initial_state: FILED
    terminal_states: [ACTIONED, DISMISSED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /registry/abuse-reports/{id}/review"
        actor: AbuseAnalyst
        preconditions:
          - "AbuseReport.status == FILED"
        side_effects: []

      - from: UNDER_REVIEW
        to: FILED
        trigger: "POST /registry/abuse-reports/{id}/requeue"
        actor: AbuseAnalyst
        preconditions:
          - "AbuseReport.status == UNDER_REVIEW"
        side_effects: []

      - from: UNDER_REVIEW
        to: ACTIONED
        trigger: "POST /registry/abuse-reports/{id}/resolve with payload { action: \"ACTIONED\" }"
        actor: AbuseAnalyst
        preconditions:
          - "AbuseReport.status == UNDER_REVIEW"
        side_effects:
          - "Domain.suspension_status = HOLD (abuse suspension), which blocks renew/delete/restore/transfer-request on the domain"

      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /registry/abuse-reports/{id}/resolve with payload { action: \"DISMISSED\" }"
        actor: AbuseAnalyst
        preconditions:
          - "AbuseReport.status == UNDER_REVIEW"
        side_effects: []

  - entity: CourtOrder
    initial_state: LODGED
    terminal_states: [ENFORCED]
    transitions:
      - from: LODGED
        to: ENFORCED
        trigger: "system: at lodge time when effective_immediately == true; otherwise when the logical clock passes lodged time + 48 hours"
        actor: system
        preconditions:
          - "CourtOrder.status == LODGED and (effective_immediately or current time > lodged_at + 48h)"
        side_effects:
          - "action == SUSPEND: Domain.suspension_status = HOLD"
          - "action == UNSUSPEND: Domain.suspension_status = NONE"
          - "action == TRANSFER_TO_REGISTRY: Domain.registrar_id = null (registry-held), Domain.suspension_status = HOLD, and any in-flight Transfer for the domain (status REQUESTED/ACKED/AUTO_ACKED) -> NACKED"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: registrar-patch-stale-version
    parent_entity: Registrar
    write_endpoint: "PATCH /registry/registrars/{id}"
    occ_field: "expected_registrar_version"
    description: |
      Patching a Registrar whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer has
      just patched the same registrar (e.g., flipped credit_hold) and the
      current writer's view of the registrar record is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: domain-lock-stale-version
    parent_entity: Domain
    write_endpoint: "POST /registry/domains/{id}/lock"
    occ_field: "expected_domain_version"
    description: |
      Engaging or releasing a registry lock on a Domain whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another lock mutation (or a cascaded lifecycle mutation that
      bumped Domain.version) has landed and the current writer's view of the
      domain is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: lifecycle_invoice
    trigger: "Domain create, explicit renew, system auto-renew, redemption restore, and transfer completion"
    algorithm: tiered_pricing
    formula: |
      fee_for(kind):
        CREATE    -> effective_schedule.create_fee_cents * years
        RENEW     -> effective_schedule.renew_fee_cents * years
        AUTO_RENEW-> effective_schedule.renew_fee_cents * 1
        RESTORE   -> effective_schedule.renew_fee_cents + effective_schedule.restore_fee_cents
        TRANSFER  -> effective_schedule.transfer_fee_cents
      base_cents = fee_for(kind)
      premium_surcharge_cents = round_half_up(base_cents * PREMIUM_SURCHARGE_RATE) if domain.premium else 0
      total_cents = base_cents + premium_surcharge_cents
      The effective schedule is the PriceSchedule with status EFFECTIVE at the
      invoice-minting instant (greatest effective_on <= now among EFFECTIVE rows).
    input_set: "Domain (premium flag, years), effective PriceSchedule at minting instant"
    constants:
      PREMIUM_SURCHARGE_RATE: 0.10
      AUTO_RENEW_GRACE_DAYS: 45
      REDEMPTION_GRACE_DAYS: 30
      PENDING_DELETE_DAYS: 5
      MAX_TERM_YEARS: 10
    precision: "integer cents; surcharge rounded round_half_up to whole cents"

  - name: accreditation_all_in_cost
    trigger: "Registrar accreditation (PROVISIONAL) and reinstatement from suspension (AUDIT)"
    algorithm: forward_looking
    formula: |
      remaining_days = days from accredited_on (inclusive) to next Jan 1 (exclusive)
      days_in_year = 366 if accredited_on's calendar year is a leap year else 365
      prorated_annual = round_half_up(annual_fee_cents * remaining_days / days_in_year)
      all_in_cost_cents = application_fee_cents + prorated_annual + escrow_deposit_cents
    input_set: "Registrar application_fee_cents, annual_fee_cents, escrow_deposit_cents, accredited_on"
    constants:
      TECHNICAL_TEST_PASS_SCORE: 80
    precision: "integer cents; proration rounded round_half_up to whole cents"
    variants:
      - name: PROVISIONAL
        when: "At accreditation time (PENDING_TESTS -> ACTIVE)"
        difference: "Annual fee component is the prorated remainder-of-year amount; reflects what the registrar actually pays for the partial first year."
      - name: AUDIT
        when: "On reinstatement (SUSPENDED -> ACTIVE) and on any post-accreditation read in audit context"
        difference: "Annual fee component is the full annual_fee_cents at face value (no proration); for the same fee fields this yields a strictly larger all_in_cost_cents whenever the accreditation year is partial."

  - name: wholesale_price_cap
    trigger: "POST /registry/price-schedules submission"
    algorithm: threshold
    formula: |
      baseline = fee values of the schedule EFFECTIVE on Jan 1 of effective_on's calendar year
        (the EFFECTIVE schedule at that instant; if none existed yet, the first schedule ever proposed is the baseline)
      For each fee f in {create_fee_cents, renew_fee_cents, restore_fee_cents, transfer_fee_cents}:
        require new_f <= round_half_up(baseline_f * (1 + ANNUAL_CAP_RATE))
      Cap is per calendar year of effective_on, evaluated against the Jan-1 baseline — multiple
      intra-year increases compound against the SAME baseline, not against each other.
      Notice: effective_on - announced_at >= NOTICE_DAYS days, and for registrars whose
      accredited_version >= schedule.version the schedule does not take effect for their
      invoices until accredited_version < schedule.version becomes true (version-pinning).
    input_set: "New PriceSchedule fee fields; baseline schedule effective on Jan 1 of the target year; announced_at; effective_on"
    constants:
      ANNUAL_CAP_RATE: 0.10
      NOTICE_DAYS: 180
    precision: "integer cents; cap ceiling rounded round_half_up to whole cents"

  - name: prorated_annual_fee
    trigger: "Accreditation invoice minting (feeds accreditation_all_in_cost PROVISIONAL)"
    algorithm: constraint_propagation
    formula: |
      prorated = round_half_up(annual_fee_cents * remaining_days / days_in_year)
      remaining_days counts accredited_on .. Dec 31 inclusive of the accreditation year.
      Evaluation order is pinned: compute remaining_days from accredited_on FIRST, then
      multiply, then round once at the end. No intermediate rounding.
    input_set: "annual_fee_cents, accredited_on"
    constants: {}
    precision: "integer cents; single final round_half_up"

  - name: capacity_utilization
    trigger: "GET /registry/capacity/summary and nameserver create/update"
    algorithm: aggregation
    formula: |
      provisioned_qps = sum(Nameserver.capacity_qps) over all nameservers
      utilization_ratio = provisioned_qps / CAPACITY_COMMITMENT_QPS
      status: OK if utilization_ratio >= 1.0 else BELOW_COMMITMENT
      Each nameserver MUST also satisfy capacity_qps >= MIN_NAMESERVER_QPS individually.
    input_set: "All Nameserver rows (no status filter — nameservers are not soft-deleted)"
    constants:
      CAPACITY_COMMITMENT_QPS: 8000
      MIN_NAMESERVER_QPS: 2000
    precision: "ratio as exact decimal; no rounding"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles; X-User-ID present for entity-backed roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per the RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path ids exist, validated left-to-right (registrar before domain before transfer)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: state
    check: "Target resource is in a state from which the requested transition exists (domain status, transfer status, registrar status, report status, order status)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_safety
    check: "Domain.suspension_status == NONE for lifecycle mutations (renew, delete, restore, transfer-request); HOLD blocks with ERR_DOMAIN_SUSPENDED"
    error_id: ERR_DOMAIN_SUSPENDED
    http_status: 409
    applies_to: "POST /registry/domains/{id}/renew, POST /registry/domains/{id}/delete, POST /registry/domains/{id}/restore, POST /registry/transfers"

  - priority: 6
    category: business_safety
    check: "Domain.lock_status == NONE for transfer requests (CLIENT_LOCK or REGISTRY_LOCK blocks with ERR_DOMAIN_LOCKED)"
    error_id: ERR_DOMAIN_LOCKED
    http_status: 409
    applies_to: "POST /registry/transfers, POST /registry/domains/{id}/delete"

  - priority: 7
    category: business_temporal
    check: "Temporal windows: transfer only after created_at + 60 days; explicit renewal only at or before grace_deadline; restore only within 30 days of redemption entry; dispute only within 6 months of completion; auth code only within 14 days of request"
    error_id: "ERR_TRANSFER_WINDOW_CLOSED | ERR_GRACE_WINDOW_CLOSED | ERR_REDEMPTION_WINDOW_CLOSED | ERR_DISPUTE_WINDOW_CLOSED | ERR_AUTH_CODE_EXPIRED"
    http_status: 409
    applies_to: "POST /registry/transfers, POST /registry/domains/{id}/renew, POST /registry/domains/{id}/restore, POST /registry/transfers/{id}/dispute, POST /registry/transfers/{id}/ack"

  - priority: 8
    category: business_referential
    check: "Referential integrity: sponsoring/gaining registrar status == ACTIVE; DomainNameserverLink targets exist; nameserver not referenced by any live domain on delete"
    error_id: "ERR_REGISTRAR_NOT_ACTIVE | ERR_NAMESERVER_IN_USE"
    http_status: 409
    applies_to: "POST /registry/domains, POST /registry/domains/{id}/renew, POST /registry/transfers, POST /registry/domains/{id}/nameservers, DELETE /registry/nameservers/{id}"

  - priority: 9
    category: business_constraint
    check: "Constraint satisfaction: domain name unique among non-DELETED rows; case_reference unique; iana_number unique; no second REQUESTED transfer per domain; auth code matches"
    error_id: "ERR_DOMAIN_NAME_TAKEN | ERR_DUPLICATE_CASE_REFERENCE | ERR_DUPLICATE_IANA_NUMBER | ERR_TRANSFER_ALREADY_PENDING | ERR_AUTH_CODE_INVALID"
    http_status: 409
    applies_to: "POST /registry/domains, POST /registry/court-orders, POST /registry/registrars, POST /registry/transfers, POST /registry/transfers/{id}/ack"

  - priority: 10
    category: business_fiscal
    check: "Fiscal: registrar credit_hold must be false for billable mutations; wholesale price cap and 180-day notice on schedule submission; technical/financial accreditation gates"
    error_id: "ERR_REGISTRAR_CREDIT_HOLD | ERR_PRICE_CAP_EXCEEDED | ERR_PRICE_NOTICE_TOO_SHORT | ERR_TECHNICAL_TEST_FAILED | ERR_FINANCIAL_STANDING_UNVERIFIED"
    http_status: 409
    applies_to: "POST /registry/domains, POST /registry/domains/{id}/renew, POST /registry/domains/{id}/restore, POST /registry/transfers, POST /registry/price-schedules, POST /registry/registrars/{id}/accredit"

# =============================================================================
# Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/registry/_clock/set_current_utc"
    description: "Advance the registry's logical clock. The startup default (before any call) is exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time. Advancing the clock fires all time-driven transitions: domain auto-renew into AUTO_RENEW_GRACE, grace-lapse into REDEMPTION_GRACE, pending-delete entry and purge, transfer auto-ack at 5 days, court-order deferred enforcement at 48 hours, and price-schedule effectiveness at effective_on. Input field is named to_iso8601."
    roles: [RegistryAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: "datetime" }
    side_effects: ["all clock-driven state transitions and their cascades"]

  # --- Registrar ---
  - method: POST
    path: "/registry/registrars"
    description: "Create a registrar applicant in PENDING_TESTS"
    roles: [RegistryAdmin]
    code: 201
    input: [iana_number, legal_name, application_fee_cents, annual_fee_cents, escrow_deposit_cents, technical_test_score, financial_statement_verified, "credit_hold?"]
    output: Registrar
    side_effects: ["status=PENDING_TESTS"]

  - method: GET
    path: "/registry/registrars"
    description: "List registrars with pagination and optional status filter"
    roles: [RegistryAdmin, RegistrarOperator, RegistryFinance, AbuseAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Registrar[]
    side_effects: []

  - method: GET
    path: "/registry/registrars/{id}"
    description: "Get one registrar"
    roles: [RegistryAdmin, RegistrarOperator, RegistryFinance]
    code: 200
    input: []
    output: Registrar
    side_effects: []

  - method: PATCH
    path: "/registry/registrars/{id}"
    description: "Mutable-field patch (credit_hold, legal_name); OCC-guarded on Registrar.version"
    roles: [RegistryAdmin]
    code: 200
    input: [expected_registrar_version, "credit_hold?", "legal_name?"]
    output: Registrar
    side_effects: ["increments Registrar.version by 1"]

  - method: POST
    path: "/registry/registrars/{id}/accredit"
    description: "Accredit a PENDING_TESTS registrar"
    roles: [RegistryAdmin]
    code: 200
    input: []
    output: Registrar
    side_effects: ["status -> ACTIVE, accredited_on/accredited_version set", "ACCREDITATION invoice + DEBIT ledger entry", "all_in_cost_cents (PROVISIONAL)"]

  - method: POST
    path: "/registry/registrars/{id}/suspend"
    description: "Suspend an ACTIVE registrar"
    roles: [RegistryAdmin]
    code: 200
    input: []
    output: Registrar
    side_effects: ["status -> SUSPENDED"]

  - method: POST
    path: "/registry/registrars/{id}/reinstate"
    description: "Reinstate a SUSPENDED registrar; recomputes all_in_cost_cents under the AUDIT variant"
    roles: [RegistryAdmin]
    code: 200
    input: []
    output: Registrar
    side_effects: ["status -> ACTIVE", "annual_fee_mode=AUDIT, all_in_cost_cents recomputed"]

  - method: POST
    path: "/registry/registrars/{id}/terminate"
    description: "Terminate an ACTIVE or SUSPENDED registrar with no live domains"
    roles: [RegistryAdmin]
    code: 200
    input: []
    output: Registrar
    side_effects: ["status -> TERMINATED", "escrow WRITE_OFF ledger credit"]

  - method: POST
    path: "/registry/registrars/{id}/ledger-topups"
    description: "Credit a registrar ledger account"
    roles: [RegistryFinance]
    code: 201
    input: [amount_cents]
    output: LedgerEntry
    side_effects: ["LedgerEntry TOP_UP +amount_cents"]

  - method: GET
    path: "/registry/registrars/{id}/ledger"
    description: "List a registrar's ledger entries"
    roles: [RegistryAdmin, RegistryFinance, RegistrarOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

  - method: GET
    path: "/registry/registrars/{id}/domains"
    description: "List domains sponsored by a registrar (FK reverse reachability)"
    roles: [RegistryAdmin, RegistrarOperator, RegistryFinance]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Domain[]
    side_effects: []

  - method: GET
    path: "/registry/registrars/{id}/accreditation-notices"
    description: "List price-increase notices sent to a registrar"
    roles: [RegistryAdmin, RegistrarOperator]
    code: 200
    input: []
    output: RegistrarAccreditationNotice[]
    side_effects: []

  - method: GET
    path: "/registry/accreditation-notices"
    description: "List accreditation notices, filterable by registrar_id or price_schedule_id"
    roles: [RegistryAdmin, RegistrarOperator]
    code: 200
    input: ["registrar_id?", "price_schedule_id?", "limit?", "offset?"]
    output: RegistrarAccreditationNotice[]
    side_effects: []

  - method: GET
    path: "/registry/accreditation-notices/{id}"
    description: "Get one accreditation notice"
    roles: [RegistryAdmin, RegistrarOperator]
    code: 200
    input: []
    output: RegistrarAccreditationNotice
    side_effects: []

  # --- PriceSchedule ---
  - method: POST
    path: "/registry/price-schedules"
    description: "Announce a new wholesale price schedule (cap + 180-day notice validated at submission)"
    roles: [RegistryAdmin]
    code: 201
    input: [create_fee_cents, renew_fee_cents, restore_fee_cents, transfer_fee_cents, effective_on, "supersedes_schedule_id?"]
    output: PriceSchedule
    side_effects: ["status=PROPOSED", "emit PRICE_INCREASE_ANNOUNCED notice to every registrar with status in {ACTIVE, SUSPENDED}"]

  - method: GET
    path: "/registry/price-schedules"
    description: "List price schedules"
    roles: [RegistryAdmin, RegistrarOperator, RegistryFinance]
    code: 200
    input: ["status?", "supersedes_schedule_id?", "limit?", "offset?"]
    output: PriceSchedule[]
    side_effects: []

  - method: GET
    path: "/registry/price-schedules/{id}"
    description: "Get one price schedule"
    roles: [RegistryAdmin, RegistrarOperator, RegistryFinance]
    code: 200
    input: []
    output: PriceSchedule
    side_effects: []

  # --- Domain ---
  - method: POST
    path: "/registry/domains"
    description: "Register a second-level domain under an ACTIVE, non-credit-hold registrar"
    roles: [RegistrarOperator]
    code: 201
    input: [name, registrar_id, years, "premium?"]
    output: Domain
    side_effects: ["status=ACTIVE, expires_on = now + years years, grace_deadline = expires_on + 45 days", "CREATE invoice + DEBIT ledger entry against registrar"]

  - method: GET
    path: "/registry/domains"
    description: "List domains with optional filters (FK reverse reachability via registrar_id)"
    roles: [RegistryAdmin, RegistrarOperator, RegistryFinance, AbuseAnalyst]
    code: 200
    input: ["registrar_id?", "status?", "name?", "limit?", "offset?"]
    output: Domain[]
    side_effects: []

  - method: GET
    path: "/registry/domains/{id}"
    description: "Get one domain"
    roles: [RegistryAdmin, RegistrarOperator, RegistryFinance, AbuseAnalyst]
    code: 200
    input: []
    output: Domain
    side_effects: []

  - method: POST
    path: "/registry/domains/{id}/renew"
    description: "Explicit renewal from ACTIVE (before grace_deadline) or AUTO_RENEW_GRACE"
    roles: [RegistrarOperator]
    code: 200
    input: [years]
    output: Domain
    side_effects: ["expires_on extended", "RENEW invoice + DEBIT"]

  - method: POST
    path: "/registry/domains/{id}/delete"
    description: "Registrar-initiated delete: ACTIVE or AUTO_RENEW_GRACE -> REDEMPTION_GRACE"
    roles: [RegistrarOperator]
    code: 200
    input: []
    output: Domain
    side_effects: ["status -> REDEMPTION_GRACE", "AUTO_RENEW invoice voided if present"]

  - method: POST
    path: "/registry/domains/{id}/restore"
    description: "Restore from REDEMPTION_GRACE within 30 days"
    roles: [RegistrarOperator]
    code: 200
    input: []
    output: Domain
    side_effects: ["status -> ACTIVE", "RESTORE invoice (renew + restore fee) + DEBIT"]

  - method: POST
    path: "/registry/domains/{id}/lock"
    description: "Engage or release CLIENT_LOCK / REGISTRY_LOCK; OCC-guarded on Domain.version"
    roles: [RegistrarOperator, RegistryAdmin]
    code: 200
    input: [lock_action, expected_domain_version, "lock_token?"]
    output: Domain
    side_effects: ["lock_status updated", "increments Domain.version by 1"]

  - method: POST
    path: "/registry/domains/{id}/nameservers"
    description: "Link a nameserver to a domain"
    roles: [RegistrarOperator]
    code: 201
    input: [nameserver_id]
    output: DomainNameserverLink
    side_effects: []

  - method: GET
    path: "/registry/domains/{id}/nameservers"
    description: "List nameserver links for a domain"
    roles: [RegistryAdmin, RegistrarOperator, AbuseAnalyst]
    code: 200
    input: []
    output: DomainNameserverLink[]
    side_effects: []

  # --- Nameserver ---
  - method: POST
    path: "/registry/nameservers"
    description: "Register an authoritative nameserver host"
    roles: [RegistryAdmin]
    code: 201
    input: [hostname, ip_addresses, capacity_qps]
    output: Nameserver
    side_effects: []

  - method: GET
    path: "/registry/nameservers"
    description: "List nameservers (FK reverse reachability via filtered list is on DomainNameserverLink)"
    roles: [RegistryAdmin, RegistrarOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: Nameserver[]
    side_effects: []

  - method: GET
    path: "/registry/nameservers/{id}"
    description: "Get one nameserver"
    roles: [RegistryAdmin, RegistrarOperator]
    code: 200
    input: []
    output: Nameserver
    side_effects: []

  - method: DELETE
    path: "/registry/nameservers/{id}"
    description: "Delete a nameserver not referenced by any live domain"
    roles: [RegistryAdmin]
    code: 204
    input: []
    output: null
    side_effects: []

  - method: GET
    path: "/registry/domain-nameserver-links"
    description: "List nameserver links, filterable by domain_id or nameserver_id"
    roles: [RegistryAdmin, RegistrarOperator, AbuseAnalyst]
    code: 200
    input: ["domain_id?", "nameserver_id?", "limit?", "offset?"]
    output: DomainNameserverLink[]
    side_effects: []

  - method: GET
    path: "/registry/domain-nameserver-links/{id}"
    description: "Get one domain-nameserver link"
    roles: [RegistryAdmin, RegistrarOperator, AbuseAnalyst]
    code: 200
    input: []
    output: DomainNameserverLink
    side_effects: []

  # --- Transfer ---
  - method: POST
    path: "/registry/transfers"
    description: "Gaining registrar requests a transfer of an ACTIVE domain older than 60 days"
    roles: [RegistrarOperator]
    code: 201
    input: [domain_id, to_registrar_id, "auth_code?"]
    output: Transfer
    side_effects: ["Domain ACTIVE -> TRANSFERRING", "auth code issued (14-day TTL); the plaintext auth_code is present in THIS creation response only"]

  - method: GET
    path: "/registry/transfers"
    description: "List transfers, filterable by domain_id / from_registrar_id / to_registrar_id / status"
    roles: [RegistryAdmin, RegistrarOperator]
    code: 200
    input: ["domain_id?", "from_registrar_id?", "to_registrar_id?", "status?", "limit?", "offset?"]
    output: Transfer[]
    side_effects: []

  - method: GET
    path: "/registry/transfers/{id}"
    description: "Get one transfer"
    roles: [RegistryAdmin, RegistrarOperator]
    code: 200
    input: []
    output: Transfer
    side_effects: []

  - method: POST
    path: "/registry/transfers/{id}/ack"
    description: "Losing registrar acknowledges with the auth code"
    roles: [RegistrarOperator]
    code: 200
    input: [auth_code]
    output: Transfer
    side_effects: ["status -> ACKED"]

  - method: POST
    path: "/registry/transfers/{id}/nack"
    description: "Losing registrar refuses the transfer"
    roles: [RegistrarOperator]
    code: 200
    input: []
    output: Transfer
    side_effects: ["status -> NACKED", "Domain TRANSFERRING -> ACTIVE (registrar unchanged)"]

  - method: POST
    path: "/registry/transfers/{id}/complete"
    description: "Gaining registrar completes an ACKED or AUTO_ACKED transfer"
    roles: [RegistrarOperator]
    code: 200
    input: []
    output: Transfer
    side_effects: ["status -> COMPLETED", "Domain registrar switches, +1y extension, TRANSFER invoice to gaining registrar"]

  - method: POST
    path: "/registry/transfers/{id}/dispute"
    description: "Losing registrar disputes a COMPLETED transfer within 6 months"
    roles: [RegistrarOperator]
    code: 200
    input: [dispute_reason]
    output: Transfer
    side_effects: ["status -> DISPUTED", "domain frozen against new transfers"]

  - method: POST
    path: "/registry/transfers/{id}/reverse"
    description: "Registry adjudicates: reverse the transfer, or uphold it (uphold: true cycles back to COMPLETED)"
    roles: [RegistryAdmin]
    code: 200
    input: ["uphold?"]
    output: Transfer
    side_effects: ["status -> REVERSED (registrar reverts, invoice voided) or -> COMPLETED when uphold=true"]

  # --- Invoices ---
  - method: GET
    path: "/registry/invoices"
    description: "List invoices, filterable by registrar_id / domain_id / kind / status"
    roles: [RegistryAdmin, RegistryFinance, RegistrarOperator]
    code: 200
    input: ["registrar_id?", "domain_id?", "kind?", "status?", "price_schedule_id?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []

  - method: GET
    path: "/registry/invoices/{id}"
    description: "Get one invoice"
    roles: [RegistryAdmin, RegistryFinance, RegistrarOperator]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/registry/ledger-entries"
    description: "List ledger entries, filterable by registrar_id or invoice_id"
    roles: [RegistryAdmin, RegistryFinance, RegistrarOperator]
    code: 200
    input: ["registrar_id?", "invoice_id?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

  - method: GET
    path: "/registry/ledger-entries/{id}"
    description: "Get one ledger entry"
    roles: [RegistryAdmin, RegistryFinance, RegistrarOperator]
    code: 200
    input: []
    output: LedgerEntry
    side_effects: []

  # --- Abuse ---
  - method: POST
    path: "/registry/abuse-reports"
    description: "File an abuse report against a domain"
    roles: [AbuseAnalyst, RegistryAdmin]
    code: 201
    input: [domain_id, reporter_contact, category, detail]
    output: AbuseReport
    side_effects: ["status=FILED"]

  - method: GET
    path: "/registry/abuse-reports"
    description: "List abuse reports, filterable by domain_id / status"
    roles: [AbuseAnalyst, RegistryAdmin]
    code: 200
    input: ["domain_id?", "status?", "limit?", "offset?"]
    output: AbuseReport[]
    side_effects: []

  - method: GET
    path: "/registry/abuse-reports/{id}"
    description: "Get one abuse report"
    roles: [AbuseAnalyst, RegistryAdmin]
    code: 200
    input: []
    output: AbuseReport
    side_effects: []

  - method: POST
    path: "/registry/abuse-reports/{id}/review"
    description: "Move a FILED report to UNDER_REVIEW"
    roles: [AbuseAnalyst]
    code: 200
    input: []
    output: AbuseReport
    side_effects: ["status -> UNDER_REVIEW"]

  - method: POST
    path: "/registry/abuse-reports/{id}/requeue"
    description: "Cycle an UNDER_REVIEW report back to FILED"
    roles: [AbuseAnalyst]
    code: 200
    input: []
    output: AbuseReport
    side_effects: ["status -> FILED"]

  - method: POST
    path: "/registry/abuse-reports/{id}/resolve"
    description: "Resolve an UNDER_REVIEW report as ACTIONED (suspends the domain) or DISMISSED"
    roles: [AbuseAnalyst]
    code: 200
    input: [action]
    output: AbuseReport
    side_effects: ["status -> ACTIONED|DISMISSED", "ACTIONED sets Domain.suspension_status=HOLD"]

  # --- Court orders ---
  - method: POST
    path: "/registry/court-orders"
    description: "Lodge a court order against a domain"
    roles: [RegistryAdmin]
    code: 201
    input: [case_reference, domain_id, action, effective_immediately]
    output: CourtOrder
    side_effects: ["status=LODGED; enforced immediately if effective_immediately else at +48h by clock"]

  - method: GET
    path: "/registry/court-orders"
    description: "List court orders, filterable by domain_id / status"
    roles: [RegistryAdmin, AbuseAnalyst]
    code: 200
    input: ["domain_id?", "status?", "limit?", "offset?"]
    output: CourtOrder[]
    side_effects: []

  - method: GET
    path: "/registry/court-orders/{id}"
    description: "Get one court order"
    roles: [RegistryAdmin, AbuseAnalyst]
    code: 200
    input: []
    output: CourtOrder
    side_effects: []

  # --- Capacity ---
  - method: GET
    path: "/registry/capacity/summary"
    description: "Resolution-infrastructure capacity commitment summary"
    roles: [RegistryAdmin]
    code: 200
    input: []
    output: { provisioned_qps: "integer", commitment_qps: "integer", utilization_ratio: "number", status: "string" }
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request body or missing required input field" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role / X-User-ID headers missing or invalid" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist (validated left-to-right)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is in a state from which the requested transition does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_DOMAIN_SUSPENDED, http: 409, condition: "Domain suspension_status == HOLD blocks lifecycle mutations" }
  - { id: ERR_DOMAIN_LOCKED, http: 409, condition: "Domain lock_status != NONE blocks transfer requests and registrar deletes" }
  - { id: ERR_TRANSFER_WINDOW_CLOSED, http: 409, condition: "Domain is younger than 60 days (initial transfer restriction)" }
  - { id: ERR_GRACE_WINDOW_CLOSED, http: 409, condition: "Explicit renewal attempted after grace_deadline" }
  - { id: ERR_REDEMPTION_WINDOW_CLOSED, http: 409, condition: "Restore attempted more than 30 days after redemption-grace entry" }
  - { id: ERR_DISPUTE_WINDOW_CLOSED, http: 409, condition: "Transfer dispute attempted more than 6 months after completion" }
  - { id: ERR_AUTH_CODE_EXPIRED, http: 409, condition: "Transfer ack attempted after auth_code_expires_at" }
  - { id: ERR_AUTH_CODE_INVALID, http: 409, condition: "Submitted auth_code does not match auth_code_hash" }
  - { id: ERR_NOT_TRANSFER_PARTY, http: 403, condition: "Acting registrar is not the from/to party required by this transfer transition" }
  - { id: ERR_TRANSFER_ALREADY_PENDING, http: 409, condition: "Another transfer for the same domain is already REQUESTED" }
  - { id: ERR_TRANSFER_DISPUTED, http: 409, condition: "Domain has a DISPUTED transfer; new transfer requests frozen" }
  - { id: ERR_REGISTRAR_NOT_ACTIVE, http: 409, condition: "Sponsoring or gaining registrar is not ACTIVE" }
  - { id: ERR_REGISTRAR_CREDIT_HOLD, http: 409, condition: "Registrar credit_hold blocks billable mutations" }
  - { id: ERR_REGISTRAR_HAS_LIVE_DOMAINS, http: 409, condition: "Termination blocked: registrar still sponsors non-terminal domains" }
  - { id: ERR_TECHNICAL_TEST_FAILED, http: 409, condition: "technical_test_score < 80 at accreditation" }
  - { id: ERR_FINANCIAL_STANDING_UNVERIFIED, http: 409, condition: "financial_statement_verified is false at accreditation" }
  - { id: ERR_DUPLICATE_IANA_NUMBER, http: 409, condition: "iana_number already registered" }
  - { id: ERR_DOMAIN_NAME_TAKEN, http: 409, condition: "Domain name already registered on a non-DELETED row" }
  - { id: ERR_DUPLICATE_CASE_REFERENCE, http: 409, condition: "Court-order case_reference already lodged" }
  - { id: ERR_PRICE_CAP_EXCEEDED, http: 409, condition: "New schedule fee exceeds Jan-1 baseline * 1.10 for its calendar year" }
  - { id: ERR_PRICE_NOTICE_TOO_SHORT, http: 409, condition: "effective_on - announced_at < 180 days" }
  - { id: ERR_NAMESERVER_IN_USE, http: 409, condition: "Nameserver still linked from a non-DELETED domain" }
  - { id: ERR_CAPACITY_BELOW_MINIMUM, http: 409, condition: "Nameserver capacity_qps below 2000 minimum" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: RegistryAdmin
    description: "Registry operator staff: accreditation, pricing, court orders, nameservers, clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /registry/registrars, PATCH /registry/registrars/{id}, POST /registry/registrars/{id}/accredit|suspend|reinstate|terminate"
      - "POST /registry/price-schedules"
      - "POST /registry/nameservers, DELETE /registry/nameservers/{id}"
      - "POST /registry/court-orders"
      - "POST /registry/transfers/{id}/reverse"
      - "POST /registry/_clock/set_current_utc"
    shared_operations:
      - "GET /registry/registrars*, GET /domains*, GET /transfers*, GET /invoices*, GET /price-schedules*, GET /nameservers*, GET /abuse-reports*, GET /court-orders*, GET /capacity/summary, POST /registry/domains/{id}/lock, POST /abuse-reports"

  - name: RegistrarOperator
    description: "Accredited registrar's operations staff acting on domains their registrar sponsors (or seeks to gain)"
    identity: "entity_backed:Registrar"
    exclusive_operations:
      - "POST /registry/domains, POST /registry/domains/{id}/renew|delete|restore"
      - "POST /registry/domains/{id}/nameservers"
      - "POST /registry/transfers, POST /registry/transfers/{id}/ack|nack|complete|dispute"
    shared_operations:
      - "GET /registry/registrars/{id}, GET /registrars/{id}/domains, GET /registrars/{id}/ledger, GET /registrars/{id}/accreditation-notices, GET /domains*, GET /transfers*, GET /invoices*, GET /price-schedules*, GET /nameservers*, POST /registry/domains/{id}/lock"

  - name: RegistryFinance
    description: "Registry finance staff: ledger top-ups and invoice oversight"
    identity: "opaque"
    exclusive_operations:
      - "POST /registry/registrars/{id}/ledger-topups"
    shared_operations:
      - "GET /registry/registrars*, GET /domains*, GET /invoices*, GET /price-schedules*"

  - name: AbuseAnalyst
    description: "Registry abuse desk: abuse report triage and resolution"
    identity: "opaque"
    exclusive_operations:
      - "POST /registry/abuse-reports/{id}/review|requeue|resolve"
    shared_operations:
      - "POST /registry/abuse-reports, GET /abuse-reports*, GET /domains*, GET /court-orders*, GET /registrars, GET /domain-nameserver-links"
