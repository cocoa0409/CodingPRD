              as_user_id: "tech-001"
          assert:
            - "the response status is 409 and data.error_id is ERR_VFA_NOT_ORDERED"
            - "data.error_id is not ERR_VFA_NOT_ELIGIBLE and not ERR_VFA_NOT_COVERED"
            - "ScanSession.${sess1_id}.vfa_performed == false"
            - "ScanSession.${sess1_id}.vfa_eligibility_code == null"
            - "ScanSession.${sess1_id}.vfa_max_genant_grade == null"
            - "ScanSession.${sess1_id}.vfa_fracture_count == null"
            - "RiskFactorProfile.${rfp_id}.height_loss_cm == 2.0"
      - name: vfa_eligibility_beats_payer_coverage_returns_409
        grounds:
