  - rule_id: resource_temporal_overlap
    instances:
      - name: consent_window_buffer_rejects_a_thirty_day_gap_and_accepts_thirty_one
        grounds:
          - calculations.consent_window_conflict
          - validations[priority=14]
          - errors[ERR_CONSENT_WINDOW_OVERLAP]
          - entities.ConsentRecord.fields.coverage_start_date
          - endpoints[POST /consent-records]
        distinguishing_aspect: |
          Interval semantics: CLOSED intervals on the Employee resource with a symmetric 30-day
          buffer on both sides, so a gap of EXACTLY CONSENT_GAP_DAYS still conflicts and only a
          31-day gap is accepted. This is the opposite endpoint behaviour from the half-open,
          zero-buffer PolicyValuation rule.
        test_recipe:
          setup:
            - "Employee Falk with one EXECUTED consent for the closed window 2026-08-01..2026-08-31."
          setup_api_calls:
            - call: "POST /employees"
              payload: { full_name: "Tova Falk", employee_number: "E-9401", annual_salary_usd: 600000.00 }
              as: BenefitsAnalyst
              captures: { emp_falk_id: $.data.id }
            - call: "POST /consent-records"
              payload: { employee_id: "${emp_falk_id}", coverage_start_date: "2026-08-01T00:00:00Z", coverage_end_date: "2026-08-31T00:00:00Z", consent_form_reference: "CF-9401-A", notice_and_consent_version: "NC-2026.1" }
              as: BenefitsAnalyst
              captures: { consent_falk_a_id: $.data.id }
            - call: "POST /consent-records/${consent_falk_a_id}/execute"
              payload: {}
              as: BenefitsAnalyst
          trigger:
            - call: "POST /consent-records"
              payload: { employee_id: "${emp_falk_id}", coverage_start_date: "2026-09-30T00:00:00Z", coverage_end_date: "2027-03-31T00:00:00Z", consent_form_reference: "CF-9401-B", notice_and_consent_version: "NC-2026.1" }
              as: BenefitsAnalyst
            - call: "POST /consent-records"
              payload: { employee_id: "${emp_falk_id}", coverage_start_date: "2026-10-01T00:00:00Z", coverage_end_date: "2027-03-31T00:00:00Z", consent_form_reference: "CF-9401-C", notice_and_consent_version: "NC-2026.1" }
              as: BenefitsAnalyst
              captures: { consent_falk_c_id: $.data.id }
          assert:
            - "trigger call 1 returns HTTP 409 with data.error_id == ERR_CONSENT_WINDOW_OVERLAP"
            - "the gap between 2026-08-31 and 2026-09-30 is exactly CONSENT_GAP_DAYS 30 whole UTC days, which the <= comparison still treats as a conflict"
            - "no ConsentRecord with consent_form_reference CF-9401-B exists after trigger call 1"
            - "trigger call 2 returns HTTP 201 with ConsentRecord.${consent_falk_c_id}.status == DRAFT"
            - "ConsentRecord.${consent_falk_c_id}.coverage_start_date == 2026-10-01T00:00:00Z"
            - "ConsentRecord.${consent_falk_a_id}.status == EXECUTED"

      - name: valuation_period_accepts_adjacency_then_rejects_one_day_overlap
        grounds:
          - calculations.valuation_period_conflict
          - validations[priority=14]
          - errors[ERR_VALUATION_PERIOD_OVERLAP]
          - entities.PolicyValuation.fields.period_start_date
          - endpoints[POST /policy-valuations]
        distinguishing_aspect: |
          A different resource entity (Policy statement periods rather than Employee consent
          windows) with the opposite interval semantics: HALF-OPEN [period_start_date, as_of_date)
          with no buffer, so a zero-day gap is accepted and only a genuine one-day interior
          overlap is rejected.
        test_recipe:
