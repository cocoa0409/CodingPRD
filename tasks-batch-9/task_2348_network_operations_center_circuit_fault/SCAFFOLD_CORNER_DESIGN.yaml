      - name: corner_failover_failure_marks_surviving_leg_as_spof
        claim_type: cross_entity
        grounds:
          - state_machines.FailoverTest.IN_PROGRESS_to_FAILED
          - validations[priority=73]
          - entities.Circuit.fields.spof_flag
          - endpoints["POST /failover-tests/{id}/record-result"]
        distinguishing_aspect: "A FAILED failover result is a cross-entity write: it must stamp spof_flag true on every circuit of the SURVIVING leg (not the tested one) and restore the tested leg's availability so the path returns to PROTECTED."
        test_recipe:
          setup:
            - "Carrier EWT with two MONITORED, UP circuits EWT-CKT-2001 (LEG_A) and EWT-CKT-2002 (LEG_B) under one GOLD ACTIVE_ACTIVE path with min_surviving_legs 1."
            - "A FailoverTest on LEG_A is SCHEDULED for 01:00-02:00, and at 01:10 it was started, so it is IN_PROGRESS and the path is temporarily DEGRADED_NO_REDUNDANCY."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:30:00Z" }
              as: PlatformAdmin
