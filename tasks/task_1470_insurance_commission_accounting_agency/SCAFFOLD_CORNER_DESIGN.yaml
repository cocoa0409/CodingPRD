        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without the user-context headers fails priority-1 with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /agency/producers"
              payload: {}
              as: Anonymous
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER with http 400 (no headers presented)"

      - name: forbidden_role_beats_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=3]"]
        distinguishing_aspect: "AgencyAccountant calling terminate on a NONEXISTENT producer id gets ERR_FORBIDDEN_FOR_ROLE (403, priority 2), never ERR_NOT_FOUND (priority 3) — role check precedes existence."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /agency/producers/33333333-3333-3333-3333-333333333333/terminate"
              payload: {}
              as: AgencyAccountant
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_FORBIDDEN_FOR_ROLE with http 403"

      - name: overpayment_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_OVERPAYMENT]"]
        distinguishing_aspect: "Payment of 2400001 against a 2400000 invoice fails ERR_OVERPAYMENT; the invoice remainder is the hard ceiling."
        test_recipe:
          setup: ["AGENCY_BILL policy bound; invoice 2400000 OPEN at default clock"]
          setup_api_calls:
            - call: "POST /agency/producers"
              payload: { name: "OP O", license_number: "LIC-V1V" }
