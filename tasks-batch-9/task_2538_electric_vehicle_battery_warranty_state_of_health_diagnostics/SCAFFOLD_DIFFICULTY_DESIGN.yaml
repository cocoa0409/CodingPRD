              as: ProgramAdmin
              captures: { pack_id: $.data.id }
            - call: "POST /battery-warranty/thermal-events"
              payload: { vehicle_id: "${veh_id}", pack_id: "${pack_id}", severity: "S1", detected_at: "2026-07-31T06:00:00Z", source: "TELEMATICS" }
              as: TelematicsGateway
              captures: { event_id: $.data.id }
          trigger:
