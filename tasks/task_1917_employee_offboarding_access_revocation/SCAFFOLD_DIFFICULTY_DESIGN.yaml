scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: pto_payout_state_vs_company_divergence
        grounds:
          - calculations.calc_pto_payout
          - entities.FinalPayStatement.fields.pto_payout_cents
          - entities.OffboardingCase.fields.work_state_code
        distinguishing_aspect: |
          Same PTO inputs produce different payable cents depending on which variant
          wins: TX (state-law variant pays 0) vs company-policy tier cap; the final
          payout is max(state, company), so a TX case yields company-tier value while
          an identical-balance CA case yields the uncapped state value — different
          entity-domain driver (FinalPayStatement payroll math keyed on OffboardingCase
          geography).
        test_recipe:
          setup:
            - "Two cases identical except state: TX vs CA; pto_balance_hours=50.0, tenure_years=1.0, hourly_wage_cents=5000"
            - "Company variant for both: min(50, 40)=40h -> 40*5000=200000 cents"
            - "State variant: TX=0; CA=50*5000=250000"
            - "Expected: TX statement pto_payout_cents=200000; CA statement pto_payout_cents=250000"
          setup_api_calls:
            - call: "POST /offboarding/offboarding-cases"
              payload: { employee_ref: "E-TX-1", case_type: "RESIGNATION", work_state_code: "TX", notice_received_date: "2026-08-01T00:00:00Z", requested_last_day: "2026-08-14T00:00:00Z", pto_balance_hours: 50.0, tenure_years: 1.0, hourly_wage_cents: 5000, intake_hr_ref: "hr-intake-1" }
              as: HRPartner
              as_user_id: "hr-intake-1"
              captures: { case_tx: $.data.id }
            - call: "POST /offboarding/offboarding-cases/${case_tx}/approve"
              payload: {}
              as: HRPartner
              as_user_id: "hr-approver-1"
            - call: "GET /offboarding/offboarding-cases/${case_tx}/final-pay-statements"
              payload: {}
              as: PayrollSpecialist
              captures: { stmt_tx: $.data.0.id, stmt_tx_v: $.data.0.version }
            - call: "POST /offboarding/offboarding-cases"
              payload: { employee_ref: "E-CA-1", case_type: "RESIGNATION", work_state_code: "CA", notice_received_date: "2026-08-01T00:00:00Z", requested_last_day: "2026-08-14T00:00:00Z", pto_balance_hours: 50.0, tenure_years: 1.0, hourly_wage_cents: 5000, intake_hr_ref: "hr-intake-1" }
              as: HRPartner
              as_user_id: "hr-intake-1"
              captures: { case_ca: $.data.id }
            - call: "POST /offboarding/offboarding-cases/${case_ca}/approve"
              payload: {}
              as: HRPartner
              as_user_id: "hr-approver-1"
            - call: "GET /offboarding/offboarding-cases/${case_ca}/final-pay-statements"
              payload: {}
              as: PayrollSpecialist
              captures: { stmt_ca: $.data.0.id, stmt_ca_v: $.data.0.version }
          trigger:
            - call: "POST /offboarding/final-pay-statements/${stmt_tx}/calculate"
              payload: { regular_wages_cents: 100000, expected_final_pay_statement_version: "${stmt_tx_v}" }
              as: PayrollSpecialist
              as_user_id: "payroll-calc-1"
            - call: "POST /offboarding/final-pay-statements/${stmt_ca}/calculate"
              payload: { regular_wages_cents: 100000, expected_final_pay_statement_version: "${stmt_ca_v}" }
              as: PayrollSpecialist
              as_user_id: "payroll-calc-1"
          assert:
            - "FinalPayStatement.${stmt_tx}.pto_payout_cents == 200000"
            - "FinalPayStatement.${stmt_ca}.pto_payout_cents == 250000"
            - "FinalPayStatement.${stmt_tx}.pto_payout_cents != FinalPayStatement.${stmt_ca}.pto_payout_cents"
            - "FinalPayStatement.${stmt_tx}.state_law_variant == NEXT_PAYDAY"
            - "FinalPayStatement.${stmt_ca}.state_law_variant == WITHIN_FIXED_DAYS (CA RESIGNATION with >=72h notice: calendar-day class, due at determined_last_day)"
      - name: asset_deduction_default_vs_damage_divergence
        grounds:
          - calculations.calc_asset_deduction
          - entities.AssetReturnItem.fields.deduction_amount_cents
          - state_machines.AssetReturnItem.OVERDUE_to_DEFAULTED
        distinguishing_aspect: |
          Same laptop (replacement_cost_cents=200000, issued 2026-01-01) produces
          different deduction depending on which variant runs: DEFAULT variant (never
          returned; depreciation by age) yields 110400 cents; DAMAGE variant (returned
          DESTROYED) yields 200000 cents — different entity domain than instance 1
          (asset/payroll-deduction vs PTO payroll), different algorithm shape
          (depreciation-weighted vs flat-fraction).
        test_recipe:
          setup:
            - "Case A (CA, RESIGNATION, notice 2026-08-01, requested 2026-08-10) approved; determined_last_day=2026-08-10; return_due_at=2026-08-13"
            - "Item A1 LAPTOP tag L1 replacement 200000 issued 2026-01-01 -> will DEFAULT (age 224d, dep 4480bps -> 110400)"
            - "Case B identical; item B1 LAPTOP tag L2 same cost/date -> returned DESTROYED on time -> DAMAGE variant -> 200000"
            - "Clock advanced past return_due_at + 7d for case A so mark-defaulted is legal"
          setup_api_calls:
            - call: "POST /offboarding/offboarding-cases"
              payload: { employee_ref: "E-A", case_type: "RESIGNATION", work_state_code: "CA", notice_received_date: "2026-08-01T00:00:00Z", requested_last_day: "2026-08-10T00:00:00Z", pto_balance_hours: 0.0, tenure_years: 1.0, hourly_wage_cents: 5000, intake_hr_ref: "hr-intake-1" }
              as: HRPartner
              as_user_id: "hr-intake-1"
              captures: { case_a: $.data.id }
            - call: "POST /offboarding/offboarding-cases/${case_a}/approve"
              payload: {}
              as: HRPartner
              as_user_id: "hr-approver-1"
            - call: "POST /offboarding/asset-return-items"
              payload: { offboarding_case_id: "${case_a}", asset_tag: "L1", asset_kind: "LAPTOP", replacement_cost_cents: 200000, issued_date: "2026-01-01T00:00:00Z" }
              as: AssetClerk
              captures: { item_a1: $.data.id }
            - call: "POST /offboarding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-21T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /offboarding/offboarding-cases"
              payload: { employee_ref: "E-B", case_type: "RESIGNATION", work_state_code: "CA", notice_received_date: "2026-08-01T00:00:00Z", requested_last_day: "2026-08-10T00:00:00Z", pto_balance_hours: 0.0, tenure_years: 1.0, hourly_wage_cents: 5000, intake_hr_ref: "hr-intake-1" }
              as: HRPartner
              as_user_id: "hr-intake-1"
              captures: { case_b: $.data.id }
            - call: "POST /offboarding/offboarding-cases/${case_b}/approve"
              payload: {}
              as: HRPartner
              as_user_id: "hr-approver-1"
            - call: "POST /offboarding/asset-return-items"
              payload: { offboarding_case_id: "${case_b}", asset_tag: "L2", asset_kind: "LAPTOP", replacement_cost_cents: 200000, issued_date: "2026-01-01T00:00:00Z" }
              as: AssetClerk
              captures: { item_b1: $.data.id, item_b1_v: $.data.version }
          trigger:
            - call: "POST /offboarding/asset-return-items/${item_a1}/mark-defaulted"
              payload: {}
              as: PayrollSpecialist
            - call: "POST /offboarding/asset-return-items/${item_b1}/record-return"
              payload: { condition_on_return: "DESTROYED", expected_asset_return_item_version: "${item_b1_v}" }
              as: AssetClerk
          assert:
            - "AssetReturnItem.${item_a1}.deduction_amount_cents == 110400"
            - "AssetReturnItem.${item_b1}.deduction_amount_cents == 200000"
            - "AssetReturnItem.${item_a1}.deduction_amount_cents != AssetReturnItem.${item_b1}.deduction_amount_cents"
            - "AssetReturnItem.${item_a1}.deduction_status == APPLIED"
            - "AssetReturnItem.${item_b1}.deduction_status == COMPUTED"

  # =========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: pto_tiered_cap_nested_min_max
        grounds:
          - calculations.calc_pto_payout
          - entities.OffboardingCase.fields.tenure_years
        distinguishing_aspect: |
          Mode (a): formula with >=3 inputs and non-linear interaction — tenure-tiered
          cap (40/80/120) nested inside min(balance, cap), then wrapped in
          max(state_variant, company_variant); tier boundaries at tenure 2.0 and 5.0
          are >=-inclusive, balance clipped to half-hour floor. One hour past a tier
          boundary doubles the cap.
        test_recipe:
          setup:
            - "TX case (state variant pays 0 so company variant fully observable)"
            - "pto_balance_hours=100.0, tenure_years=1.9 (<2 -> cap 40), hourly=5000 -> company=40*5000=200000"
            - "Second TX case, tenure_years=2.0 (>=2 -> cap 80), same balance/wage -> company=min(100,80)=80*5000=400000"
            - "Boundary: 1.9 vs 2.0 flips the cap tier"
          setup_api_calls:
            - call: "POST /offboarding/offboarding-cases"
              payload: { employee_ref: "E-T1", case_type: "RESIGNATION", work_state_code: "TX", notice_received_date: "2026-08-01T00:00:00Z", requested_last_day: "2026-08-14T00:00:00Z", pto_balance_hours: 100.0, tenure_years: 1.9, hourly_wage_cents: 5000, intake_hr_ref: "hr-intake-1" }
              as: HRPartner
              as_user_id: "hr-intake-1"
              captures: { case_t1: $.data.id }
            - call: "POST /offboarding/offboarding-cases/${case_t1}/approve"
              payload: {}
              as: HRPartner
              as_user_id: "hr-approver-1"
            - call: "GET /offboarding/offboarding-cases/${case_t1}/final-pay-statements"
              payload: {}
              as: PayrollSpecialist
              captures: { stmt_t1: $.data.0.id, stmt_t1_v: $.data.0.version }
            - call: "POST /offboarding/offboarding-cases"
              payload: { employee_ref: "E-T2", case_type: "RESIGNATION", work_state_code: "TX", notice_received_date: "2026-08-01T00:00:00Z", requested_last_day: "2026-08-14T00:00:00Z", pto_balance_hours: 100.0, tenure_years: 2.0, hourly_wage_cents: 5000, intake_hr_ref: "hr-intake-1" }
              as: HRPartner
              as_user_id: "hr-intake-1"
              captures: { case_t2: $.data.id }
            - call: "POST /offboarding/offboarding-cases/${case_t2}/approve"
              payload: {}
              as: HRPartner
              as_user_id: "hr-approver-1"
            - call: "GET /offboarding/offboarding-cases/${case_t2}/final-pay-statements"
              payload: {}
              as: PayrollSpecialist
              captures: { stmt_t2: $.data.0.id, stmt_t2_v: $.data.0.version }
          trigger:
            - call: "POST /offboarding/final-pay-statements/${stmt_t1}/calculate"
              payload: { regular_wages_cents: 0, expected_final_pay_statement_version: "${stmt_t1_v}" }
              as: PayrollSpecialist
              as_user_id: "payroll-calc-1"
            - call: "POST /offboarding/final-pay-statements/${stmt_t2}/calculate"
              payload: { regular_wages_cents: 0, expected_final_pay_statement_version: "${stmt_t2_v}" }
              as: PayrollSpecialist
              as_user_id: "payroll-calc-1"
          assert:
            - "FinalPayStatement.${stmt_t1}.pto_payout_cents == 200000"
            - "FinalPayStatement.${stmt_t2}.pto_payout_cents == 400000"
      - name: asset_deduction_per_item_rounding_then_sum
        grounds:
          - calculations.calc_asset_deduction
          - calculations.calc_deduction_total
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — scaffold pins round-per-item
          (each deduction rounded to integer cents at item level, then summed). Two
          items each computing a .5-cent result round HALF-UP per item (x+x vs
          round(2x)); with crafted inputs the two orders diverge by exactly 1 cent.
          PHONE, replacement_cost 201 cents, issued 2026-08-01, DL 2026-08-10,
          return_due 2026-08-13: age 12d * 25bps = 300bps -> 201*0.97=194.97 ->
          round_half_up = 195. Two such items: per-item-then-sum = 390; sum-then-round
          of 389.94 would give 390 too — use DESTROYED-damage on odd-cost items
          instead: 101 * 0.5 = 50.5 -> 51 per item; two items: 102 vs sum-then-round
          101 — pinned order yields 102.
        test_recipe:
          setup:
            - "Case (CA) approved; two OTHER-kind assets each replacement_cost_cents=101, issued 2026-01-01"
            - "Both returned DAMAGED on time -> each deduction = round_half_up(101*0.5)=round_half_up(50.5)=51"
            - "Pinned order (round per item, then sum): total = 51+51 = 102"
            - "Wrong order (sum then round): round_half_up(101)=101 — must NOT be observed"
            - "Note: DAMAGE variant marks COMPUTED (not APPLIED), so observe the per-item values and the case-level projected_deduction_cents from summary"
          setup_api_calls:
            - call: "POST /offboarding/offboarding-cases"
              payload: { employee_ref: "E-R", case_type: "RESIGNATION", work_state_code: "CA", notice_received_date: "2026-08-01T00:00:00Z", requested_last_day: "2026-08-10T00:00:00Z", pto_balance_hours: 0.0, tenure_years: 1.0, hourly_wage_cents: 5000, intake_hr_ref: "hr-intake-1" }
              as: HRPartner
              as_user_id: "hr-intake-1"
              captures: { case_r: $.data.id }
            - call: "POST /offboarding/offboarding-cases/${case_r}/approve"
              payload: {}
              as: HRPartner
              as_user_id: "hr-approver-1"
            - call: "POST /offboarding/asset-return-items"
              payload: { offboarding_case_id: "${case_r}", asset_tag: "A1", asset_kind: "OTHER", replacement_cost_cents: 101, issued_date: "2026-01-01T00:00:00Z" }
              as: AssetClerk
              captures: { item_r1: $.data.id, item_r1_v: $.data.version }
            - call: "POST /offboarding/asset-return-items"
              payload: { offboarding_case_id: "${case_r}", asset_tag: "A2", asset_kind: "OTHER", replacement_cost_cents: 101, issued_date: "2026-01-01T00:00:00Z" }
              as: AssetClerk
              captures: { item_r2: $.data.id, item_r2_v: $.data.version }
          trigger:
            - call: "POST /offboarding/asset-return-items/${item_r1}/record-return"
              payload: { condition_on_return: "DAMAGED", expected_asset_return_item_version: "${item_r1_v}" }
              as: AssetClerk
            - call: "POST /offboarding/asset-return-items/${item_r2}/record-return"
              payload: { condition_on_return: "DAMAGED", expected_asset_return_item_version: "${item_r2_v}" }
              as: AssetClerk
            - call: "GET /offboarding/offboarding-cases/${case_r}/summary"
              payload: {}
              as: PayrollSpecialist
              captures: { projected_cents: $.data.projected_deduction_cents }
          assert:
            - "AssetReturnItem.${item_r1}.deduction_amount_cents == 51"
            - "AssetReturnItem.${item_r2}.deduction_amount_cents == 51"
            - "summary.projected_deduction_cents == 102 (per-item rounding then sum; NOT 101)"

  # =========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: revocation_task_failed_retry_cycle
        grounds:
          - state_machines.AccessRevocationTask
          - state_machines.AccessRevocationTask.FAILED_to_RETRY_SCHEDULED
          - calculations.calc_revocation_schedule
        distinguishing_aspect: |
          AccessRevocationTask has a true cycle READY->FAILED->RETRY_SCHEDULED->READY
          (up to MAX_REVOKE_RETRIES=3 loops), with backoff scheduled_at growing per
          cycle and posture flip to BLOCKED at the cap; cyclic, not a linear pipeline.
        test_recipe:
          setup:
            - "CA case approved; determined_last_day=2026-08-10"
            - "Single VPN task sequence_rank=1; scheduled_at=DL (2026-08-10 17:00 UTC)"
            - "Clock at 2026-08-10T17:00:00Z so scheduler flips PENDING->READY"
          setup_api_calls:
            - call: "POST /offboarding/offboarding-cases"
              payload: { employee_ref: "E-CYC", case_type: "RESIGNATION", work_state_code: "CA", notice_received_date: "2026-08-01T00:00:00Z", requested_last_day: "2026-08-10T00:00:00Z", pto_balance_hours: 0.0, tenure_years: 1.0, hourly_wage_cents: 5000, intake_hr_ref: "hr-intake-1" }
              as: HRPartner
              as_user_id: "hr-intake-1"
              captures: { case_cyc: $.data.id }
            - call: "POST /offboarding/offboarding-cases/${case_cyc}/approve"
              payload: {}
              as: HRPartner
              as_user_id: "hr-approver-1"
            - call: "POST /offboarding/access-revocation-tasks"
              payload: { offboarding_case_id: "${case_cyc}", system_name: "VPN", sequence_rank: 1 }
              as: ITManager
              captures: { task_vpn: $.data.id }
            - call: "POST /offboarding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T17:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /offboarding/access-revocation-tasks/${task_vpn}/execute"
              payload: { outcome: "FAILED", failure_reason: "vpn concentrator timeout" }
              as: ITOperator
              as_user_id: "it-op-1"
            - call: "POST /offboarding/access-revocation-tasks/${task_vpn}/retry"
              payload: {}
              as: ITOperator
              as_user_id: "it-op-1"
            - call: "POST /offboarding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T18:00:00Z" }
              as: PlatformAdmin
            - call: "POST /offboarding/access-revocation-tasks/${task_vpn}/execute"
              payload: { outcome: "FAILED", failure_reason: "second failure" }
              as: ITOperator
              as_user_id: "it-op-1"
            - call: "POST /offboarding/access-revocation-tasks/${task_vpn}/retry"
              payload: {}
              as: ITOperator
              as_user_id: "it-op-1"
          assert:
            - "AccessRevocationTask.${task_vpn}.retry_count == 2"
            - "AccessRevocationTask.${task_vpn}.status == RETRY_SCHEDULED after second retry"
            - "AccessRevocationTask.${task_vpn}.scheduled_at advanced by backoff (60 min * retry_count)"
            - "OffboardingCase.${case_cyc}.revocation_posture != COMPLETE while cycles remain"
      - name: exit_interview_reschedule_no_show_rehabilitation_loop
        grounds:
          - state_machines.ExitInterview
          - state_machines.ExitInterview.RESCHEDULE_REQUESTED_to_SCHEDULED
          - state_machines.ExitInterview.NO_SHOW_to_SCHEDULED
        distinguishing_aspect: |
          ExitInterview is cyclic on TWO distinct loops (SCHEDULED->RESCHEDULE_REQUESTED
          ->SCHEDULED and SCHEDULED->NO_SHOW->SCHEDULED), capped by reschedule_count<2
          total across both loops — different entity than AccessRevocationTask and a
          different loop topology (human-initiated vs failure-initiated).
        test_recipe:
          setup:
            - "CA case approved; exit interview scheduled 2026-08-05T10:00-11:00Z"
          setup_api_calls:
            - call: "POST /offboarding/offboarding-cases"
              payload: { employee_ref: "E-EI", case_type: "RESIGNATION", work_state_code: "CA", notice_received_date: "2026-08-01T00:00:00Z", requested_last_day: "2026-08-10T00:00:00Z", pto_balance_hours: 0.0, tenure_years: 1.0, hourly_wage_cents: 5000, intake_hr_ref: "hr-intake-1" }
              as: HRPartner
              as_user_id: "hr-intake-1"
              captures: { case_ei: $.data.id }
            - call: "POST /offboarding/offboarding-cases/${case_ei}/approve"
              payload: {}
              as: HRPartner
              as_user_id: "hr-approver-1"
            - call: "POST /offboarding/exit-interviews"
              payload: { offboarding_case_id: "${case_ei}", interviewer_ref: "hr-int-1", scheduled_start: "2026-08-05T10:00:00Z", scheduled_end: "2026-08-05T11:00:00Z" }
              as: HRPartner
              captures: { interview_ei: $.data.id }
          trigger:
            - call: "POST /offboarding/exit-interviews/${interview_ei}/request-reschedule"
              payload: {}
              as: HRPartner
            - call: "POST /offboarding/exit-interviews/${interview_ei}/reschedule"
              payload: { scheduled_start: "2026-08-06T10:00:00Z", scheduled_end: "2026-08-06T11:00:00Z" }
              as: HRPartner
            - call: "POST /offboarding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /offboarding/exit-interviews/${interview_ei}/reschedule"
              payload: { scheduled_start: "2026-08-07T10:00:00Z", scheduled_end: "2026-08-07T11:00:00Z" }
              as: HRPartner
          assert:
            - "ExitInterview.${interview_ei}.reschedule_count == 2 (one request-reschedule loop + one no-show rehabilitation loop)"
            - "ExitInterview.${interview_ei}.status == SCHEDULED after rehabilitation"
            - "A further request-reschedule now returns ERR_RETRY_CAP_EXCEEDED (cap reached across both loops)"

  # =========================================================================
  # Rule 4 — transitive_cascade (different triggers; depths >=3 and >=2)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: asset_default_cascades_to_statement_and_close_gate
        grounds:
          - state_machines.AssetReturnItem.OVERDUE_to_DEFAULTED
          - calculations.calc_deduction_total
          - calculations.calc_final_net_pay
          - state_machines.OffboardingCase
        distinguishing_aspect: |
          Depth-3 chain triggered by mark-defaulted: (1) AssetReturnItem OVERDUE->
          DEFAULTED applies deduction; (2) that mutation triggers calc_deduction_total
          updating OffboardingCase.deduction_total_cents; (3) the case-level mutation
          triggers calc_final_net_pay recomputing FinalPayStatement.deduction_total_cents
          and net_pay_cents on the already-CALCULATED statement. Each hop is caused by
          the previous hop's mutation, not fan-out from the original call.
        test_recipe:
          setup:
            - "CA case fully approved; revocation complete so case in PAYROLL_PENDING"
            - "Statement CALCULATED with regular_wages=200000, pto_payout=0, deduction_total_cents=0, net_pay=200000"
            - "One OTHER asset overdue; clock past return_due_at+7d"
          setup_api_calls:
            - call: "POST /offboarding/offboarding-cases"
              payload: { employee_ref: "E-CASC", case_type: "RESIGNATION", work_state_code: "CA", notice_received_date: "2026-08-01T00:00:00Z", requested_last_day: "2026-08-10T00:00:00Z", pto_balance_hours: 0.0, tenure_years: 1.0, hourly_wage_cents: 5000, intake_hr_ref: "hr-intake-1" }
              as: HRPartner
              as_user_id: "hr-intake-1"
              captures: { case_casc: $.data.id }
            - call: "POST /offboarding/offboarding-cases/${case_casc}/approve"
              payload: {}
              as: HRPartner
              as_user_id: "hr-approver-1"
            - call: "POST /offboarding/asset-return-items"
              payload: { offboarding_case_id: "${case_casc}", asset_tag: "T1", asset_kind: "TOOLING", replacement_cost_cents: 100000, issued_date: "2026-08-01T00:00:00Z" }
              as: AssetClerk
              captures: { item_casc: $.data.id }
            - call: "GET /offboarding/offboarding-cases/${case_casc}/final-pay-statements"
              payload: {}
              as: PayrollSpecialist
              captures: { stmt_casc: $.data.0.id, stmt_casc_v: $.data.0.version }
            - call: "POST /offboarding/final-pay-statements/${stmt_casc}/calculate"
              payload: { regular_wages_cents: 200000, expected_final_pay_statement_version: "${stmt_casc_v}" }
              as: PayrollSpecialist
              as_user_id: "payroll-calc-1"
            - call: "POST /offboarding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-21T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /offboarding/asset-return-items/${item_casc}/mark-defaulted"
              payload: {}
              as: PayrollSpecialist
          assert:
            - "AssetReturnItem.${item_casc}.status == DEFAULTED"
            - "AssetReturnItem.${item_casc}.deduction_status == APPLIED"
            - "AssetReturnItem.${item_casc}.deduction_amount_cents == 98800 (age 12d * 10bps = 120bps; 100000 * 0.988 = 98800)"
            - "OffboardingCase.${case_casc}.deduction_total_cents == AssetReturnItem.${item_casc}.deduction_amount_cents"
            - "FinalPayStatement.${stmt_casc}.deduction_total_cents == OffboardingCase.${case_casc}.deduction_total_cents (capped at gross)"
            - "FinalPayStatement.${stmt_casc}.net_pay_cents == 200000 - FinalPayStatement.${stmt_casc}.deduction_total_cents"
            - "OffboardingCase.${case_casc}.asset_posture == DEFAULTED"
      - name: revocation_verify_cascades_to_notice_queue_and_covenant_reminder
        grounds:
          - state_machines.AccessRevocationTask.EXECUTED_to_VERIFIED
          - state_machines.OffboardingCase.REVOCATION_IN_PROGRESS_to_PAYROLL_PENDING
          - state_machines.BenefitsNotice.DRAFT_to_QUEUED
        distinguishing_aspect: |
          Depth-3 chain triggered by the final task verification: (1) last
          AccessRevocationTask EXECUTED->VERIFIED recomputes revocation_posture=COMPLETE;
          (2) posture flip cascades OffboardingCase REVOCATION_IN_PROGRESS->PAYROLL_PENDING;
          (3) case transition cascades BenefitsNotice DRAFT->QUEUED stamping send_by AND
          schedules RestrictiveCovenantAck reminders. Different trigger than instance 1.
        test_recipe:
          setup:
            - "CA case approved; one EMAIL task rank 1; clock at DL 17:00 so task READY; one COBRA notice DRAFT; one NON_COMPETE ack PENDING"
          setup_api_calls:
            - call: "POST /offboarding/offboarding-cases"
              payload: { employee_ref: "E-CAS2", case_type: "RESIGNATION", work_state_code: "CA", notice_received_date: "2026-08-01T00:00:00Z", requested_last_day: "2026-08-10T00:00:00Z", pto_balance_hours: 0.0, tenure_years: 1.0, hourly_wage_cents: 5000, intake_hr_ref: "hr-intake-1" }
              as: HRPartner
              as_user_id: "hr-intake-1"
              captures: { case_cas2: $.data.id }
            - call: "POST /offboarding/offboarding-cases/${case_cas2}/approve"
              payload: {}
              as: HRPartner
              as_user_id: "hr-approver-1"
            - call: "POST /offboarding/access-revocation-tasks"
              payload: { offboarding_case_id: "${case_cas2}", system_name: "EMAIL", sequence_rank: 1 }
              as: ITManager
              captures: { task_cas2: $.data.id }
            - call: "POST /offboarding/benefits-notices"
              payload: { offboarding_case_id: "${case_cas2}", notice_kind: "COBRA_ELECTION" }
              as: BenefitsAdministrator
              captures: { notice_cas2: $.data.id }
            - call: "POST /offboarding/restrictive-covenant-acks"
              payload: { offboarding_case_id: "${case_cas2}", covenant_kind: "NON_COMPETE" }
              as: HRPartner
              captures: { ack_cas2: $.data.id }
            - call: "POST /offboarding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /offboarding/access-revocation-tasks/${task_cas2}/execute"
              payload: { outcome: "SUCCESS" }
              as: ITOperator
              as_user_id: "it-op-1"
          trigger:
            - call: "POST /offboarding/access-revocation-tasks/${task_cas2}/verify"
              payload: { outcome: "VERIFIED" }
              as: ITVerifier
              as_user_id: "it-ver-1"
          assert:
            - "AccessRevocationTask.${task_cas2}.status == VERIFIED"
            - "OffboardingCase.${case_cas2}.revocation_posture == COMPLETE"
            - "OffboardingCase.${case_cas2}.status == PAYROLL_PENDING"
            - "BenefitsNotice.${notice_cas2}.status == QUEUED"
            - "BenefitsNotice.${notice_cas2}.send_by == 2026-09-23T17:00:00Z (determined_last_day 2026-08-10 + 44d at 17:00)"
            - "RestrictiveCovenantAck.${ack_cas2}.remind_at == 2026-08-13T09:00:00Z (DL + 3d at 09:00)"

  # =========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_sod_on_case_approve
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - state_machines.OffboardingCase.INTAKE_to_APPROVED
        distinguishing_aspect: |
          Pair state(4) vs business_safety/SoD(5): approving a case already APPROVED
          AND with the same user as intake — the request violates both; state priority
          wins, so ERR_INVALID_STATE (409) must surface, not ERR_SOD_VIOLATION.
        test_recipe:
          setup:
            - "Case created by hr-intake-1 and already approved by hr-approver-1"
          setup_api_calls:
            - call: "POST /offboarding/offboarding-cases"
              payload: { employee_ref: "E-P1", case_type: "RESIGNATION", work_state_code: "TX", notice_received_date: "2026-08-01T00:00:00Z", requested_last_day: "2026-08-14T00:00:00Z", pto_balance_hours: 0.0, tenure_years: 1.0, hourly_wage_cents: 5000, intake_hr_ref: "hr-intake-1" }
              as: HRPartner
              as_user_id: "hr-intake-1"
              captures: { case_p1: $.data.id }
            - call: "POST /offboarding/offboarding-cases/${case_p1}/approve"
              payload: {}
              as: HRPartner
              as_user_id: "hr-approver-1"
          trigger:
            - call: "POST /offboarding/offboarding-cases/${case_p1}/approve"
              payload: {}
              as: HRPartner
              as_user_id: "hr-intake-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (state priority 4 beats SoD priority 5 even though the caller is also the intake recorder)"
      - name: temporal_vs_fiscal_on_case_create
        grounds:
          - validations[priority=6]
          - validations[priority=11]
        distinguishing_aspect: |
          Pair business_temporal(6) vs business_fiscal(11): creating a case with
          requested_last_day BEFORE notice_received_date AND hourly_wage_cents=0 —
          both violated; temporal wins, so ERR_TEMPORAL_INVALID surfaces, not
          ERR_FISCAL_INVALID. Different category pair than instance 1.
        test_recipe:
          setup:
            - "Empty DB; single create call violates both temporal and fiscal"
          setup_api_calls: []
          trigger:
            - call: "POST /offboarding/offboarding-cases"
              payload: { employee_ref: "E-P2", case_type: "RESIGNATION", work_state_code: "TX", notice_received_date: "2026-08-10T00:00:00Z", requested_last_day: "2026-08-05T00:00:00Z", pto_balance_hours: 0.0, tenure_years: 1.0, hourly_wage_cents: 0, intake_hr_ref: "hr-intake-1" }
              as: HRPartner
              as_user_id: "hr-intake-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_TEMPORAL_INVALID (temporal priority 6 beats fiscal priority 11)"

  # =========================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: late_penalty_one_second_past_due
        grounds:
          - calculations.calc_late_penalty
          - state_machines.FinalPayStatement.APPROVED_to_LATE
        distinguishing_aspect: |
          Metric 1 (time boundary, > vs >=): disbursement exactly AT due_at is on-time
          (DISBURSED, penalty 0); one second past due_at yields LATE with ceil rounding
          charging a FULL first day (1 * daily_wage). Off-by-one second changes both
          the state and the penalty by a whole day of wages.
        test_recipe:
          setup:
            - "Two identical CA cases (RESIGNATION, notice 2026-08-01, requested 2026-08-10) -> DL=2026-08-10T00:00:00Z; notice >= 72h so due_at == determined_last_day == 2026-08-10T00:00:00Z"
            - "Both statements CALCULATED then APPROVED (different calculator vs approver, SoD-2)"
            - "Statement A disbursed at current_utc == due_at exactly; statement B disbursed at due_at + 1 second"
            - "daily_wage = 5000 * 8 = 40000; 1 second past due -> ceil((1s)/86400) = 1 late day -> penalty 40000"
          setup_api_calls:
            - call: "POST /offboarding/offboarding-cases"
              payload: { employee_ref: "E-B1A", case_type: "RESIGNATION", work_state_code: "CA", notice_received_date: "2026-08-01T00:00:00Z", requested_last_day: "2026-08-10T00:00:00Z", pto_balance_hours: 0.0, tenure_years: 1.0, hourly_wage_cents: 5000, intake_hr_ref: "hr-intake-1" }
              as: HRPartner
              as_user_id: "hr-intake-1"
              captures: { case_b1a: $.data.id }
            - call: "POST /offboarding/offboarding-cases/${case_b1a}/approve"
              payload: {}
              as: HRPartner
              as_user_id: "hr-approver-1"
            - call: "GET /offboarding/offboarding-cases/${case_b1a}/final-pay-statements"
              payload: {}
              as: PayrollSpecialist
              captures: { stmt_b1a: $.data.0.id, stmt_b1a_v: $.data.0.version }
            - call: "POST /offboarding/final-pay-statements/${stmt_b1a}/calculate"
              payload: { regular_wages_cents: 100000, expected_final_pay_statement_version: "${stmt_b1a_v}" }
              as: PayrollSpecialist
              as_user_id: "payroll-calc-1"
            - call: "POST /offboarding/offboarding-cases"
              payload: { employee_ref: "E-B1B", case_type: "RESIGNATION", work_state_code: "CA", notice_received_date: "2026-08-01T00:00:00Z", requested_last_day: "2026-08-10T00:00:00Z", pto_balance_hours: 0.0, tenure_years: 1.0, hourly_wage_cents: 5000, intake_hr_ref: "hr-intake-1" }
              as: HRPartner
              as_user_id: "hr-intake-1"
              captures: { case_b1b: $.data.id }
            - call: "POST /offboarding/offboarding-cases/${case_b1b}/approve"
              payload: {}
              as: HRPartner
              as_user_id: "hr-approver-1"
            - call: "GET /offboarding/offboarding-cases/${case_b1b}/final-pay-statements"
              payload: {}
              as: PayrollSpecialist
              captures: { stmt_b1b: $.data.0.id, stmt_b1b_v: $.data.0.version }
            - call: "POST /offboarding/final-pay-statements/${stmt_b1b}/calculate"
              payload: { regular_wages_cents: 100000, expected_final_pay_statement_version: "${stmt_b1b_v}" }
              as: PayrollSpecialist
              as_user_id: "payroll-calc-1"
          trigger:
            - call: "POST /offboarding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /offboarding/final-pay-statements/${stmt_b1a}/approve"
              payload: {}
              as: PayrollSpecialist
              as_user_id: "payroll-approver-1"
            - call: "POST /offboarding/final-pay-statements/${stmt_b1a}/disburse"
              payload: {}
              as: PayrollSpecialist
            - call: "POST /offboarding/final-pay-statements/${stmt_b1b}/approve"
              payload: {}
              as: PayrollSpecialist
              as_user_id: "payroll-approver-1"
            - call: "POST /offboarding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:01Z" }
              as: PlatformAdmin
            - call: "POST /offboarding/final-pay-statements/${stmt_b1b}/disburse"
              payload: {}
              as: PayrollSpecialist
          assert:
            - "FinalPayStatement.${stmt_b1a}.status == DISBURSED when current_utc == due_at exactly (boundary is on-time)"
            - "FinalPayStatement.${stmt_b1a}.late_penalty_cents == 0"
            - "FinalPayStatement.${stmt_b1b}.status == LATE when current_utc == due_at + 1 second"
            - "FinalPayStatement.${stmt_b1b}.late_penalty_cents == 40000 (ceil rounds any fraction up to a full first day)"
      - name: kt_plan_zero_required_sessions_never_auto_completes
        grounds:
          - calculations.calc_kt_progress
          - state_machines.KnowledgeTransferPlan.ACTIVE_to_COMPLETE
        distinguishing_aspect: |
          Metric 2 (empty-set / zero-count boundary): a plan with
          required_session_count == 0 sits at the 0>=0 boundary yet must NOT
          auto-complete (aggregate rule requires required_session_count > 0); only the
          explicit complete endpoint transitions it. Different metric (count vs time)
          and different endpoint than instance 1.
        test_recipe:
          setup:
            - "CA case approved; plan auto-created with required_session_count=0 (default for a manager who sets none — but creation requires the field; use 0)"
            - "Plan activated"
          setup_api_calls:
            - call: "POST /offboarding/offboarding-cases"
              payload: { employee_ref: "E-B2", case_type: "RESIGNATION", work_state_code: "CA", notice_received_date: "2026-08-01T00:00:00Z", requested_last_day: "2026-08-10T00:00:00Z", pto_balance_hours: 0.0, tenure_years: 1.0, hourly_wage_cents: 5000, intake_hr_ref: "hr-intake-1" }
              as: HRPartner
              as_user_id: "hr-intake-1"
              captures: { case_b2: $.data.id }
            - call: "POST /offboarding/offboarding-cases/${case_b2}/approve"
              payload: {}
              as: HRPartner
              as_user_id: "hr-approver-1"
            - call: "GET /offboarding/offboarding-cases/${case_b2}/knowledge-transfer-plans"
              payload: {}
              as: Manager
              captures: { plan_b2: $.data.0.id }
            - call: "POST /offboarding/knowledge-transfer-plans/${plan_b2}/activate"
              payload: {}
              as: Manager
          trigger:
            - call: "GET /offboarding/knowledge-transfer-plans/${plan_b2}"
              payload: {}
              as: Manager
              captures: { plan_b2_status: $.data.status }
            - call: "POST /offboarding/knowledge-transfer-plans/${plan_b2}/complete"
              payload: {}
              as: Manager
          assert:
            - "KnowledgeTransferPlan.${plan_b2}.status remains ACTIVE after activation despite 0 >= 0 boundary (no auto-complete when required_session_count == 0)"
            - "After explicit complete: KnowledgeTransferPlan.${plan_b2}.status == COMPLETE"

  # =========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: revoke_execute_gated_on_case_status
        grounds:
          - state_machines.AccessRevocationTask.READY_to_EXECUTED
          - entities.OffboardingCase.fields.status
        distinguishing_aspect: |
          Pair AccessRevocationTask -> OffboardingCase: execute requires the PARENT
          case in {APPROVED, REVOCATION_IN_PROGRESS}; a READY task under an INTAKE
          (or VOIDED) case rejects with ERR_INVALID_STATE even though the task's own
          state is valid.
        test_recipe:
          setup:
            - "CA case approved; EMAIL task rank 1; clock at DL 17:00 (task READY); then case VOIDED — task stays READY-ish? Void cascades PENDING/READY -> WAIVED, so use a different path: create a second case in INTAKE, pre-create task (allowed? creation requires case APPROVED for schedule — instead: approve case, create task, advance clock, then VOID case before execute. Void on APPROVED requires no EXECUTED/VERIFIED tasks — holds)."
          setup_api_calls:
            - call: "POST /offboarding/offboarding-cases"
              payload: { employee_ref: "E-X1", case_type: "RESIGNATION", work_state_code: "CA", notice_received_date: "2026-08-01T00:00:00Z", requested_last_day: "2026-08-10T00:00:00Z", pto_balance_hours: 0.0, tenure_years: 1.0, hourly_wage_cents: 5000, intake_hr_ref: "hr-intake-1" }
              as: HRPartner
              as_user_id: "hr-intake-1"
              captures: { case_x1: $.data.id }
            - call: "POST /offboarding/offboarding-cases/${case_x1}/approve"
              payload: {}
              as: HRPartner
              as_user_id: "hr-approver-1"
            - call: "POST /offboarding/access-revocation-tasks"
              payload: { offboarding_case_id: "${case_x1}", system_name: "EMAIL", sequence_rank: 1 }
              as: ITManager
              captures: { task_x1: $.data.id }
            - call: "POST /offboarding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /offboarding/offboarding-cases/${case_x1}/void"
              payload: { void_reason: "employee rescinded resignation" }
              as: HRPartner
              as_user_id: "hr-approver-1"
          trigger:
            - call: "POST /offboarding/access-revocation-tasks/${task_x1}/execute"
              payload: { outcome: "SUCCESS" }
              as: ITOperator
              as_user_id: "it-op-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (task WAIVED by void cascade / parent case terminal; either path the execute is rejected)"
      - name: rehire_submit_gated_on_case_clearance_stage
        grounds:
          - state_machines.RehireEligibilityReview.DRAFT_to_SUBMITTED
          - state_machines.OffboardingCase
        distinguishing_aspect: |
          Pair RehireEligibilityReview -> OffboardingCase: submit requires parent case
          in {CLEARANCE_IN_PROGRESS, READY_TO_CLOSE}; submitting while the case is
          still APPROVED/REVOCATION_IN_PROGRESS/PAYROLL_PENDING rejects. Different
          entity pair than instance 1.
        test_recipe:
          setup:
            - "CA case approved (still in APPROVED — revocation not started); review auto-created in DRAFT"
          setup_api_calls:
            - call: "POST /offboarding/offboarding-cases"
              payload: { employee_ref: "E-X2", case_type: "RESIGNATION", work_state_code: "CA", notice_received_date: "2026-08-01T00:00:00Z", requested_last_day: "2026-08-10T00:00:00Z", pto_balance_hours: 0.0, tenure_years: 1.0, hourly_wage_cents: 5000, intake_hr_ref: "hr-intake-1" }
              as: HRPartner
              as_user_id: "hr-intake-1"
              captures: { case_x2: $.data.id }
            - call: "POST /offboarding/offboarding-cases/${case_x2}/approve"
              payload: {}
              as: HRPartner
              as_user_id: "hr-approver-1"
            - call: "GET /offboarding/offboarding-cases/${case_x2}/rehire-eligibility-reviews"
              payload: {}
              as: HRReviewer
              captures: { review_x2: $.data.0.id }
          trigger:
            - call: "POST /offboarding/rehire-eligibility-reviews/${review_x2}/submit"
              payload: { recommended_code: "ELIGIBLE", rationale: "solid performer" }
              as: HRReviewer
              as_user_id: "hr-reviewer-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (case APPROVED, not yet CLEARANCE_IN_PROGRESS)"

  # =========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: exit_interview_half_open_adjacency_allowed
        grounds:
          - validations[priority=8]
          - entities.ExitInterview.fields.scheduled_start
        distinguishing_aspect: |
          OVERLAP-A (ExitInterview): half-open [start, end) — an interview starting
          exactly when another SCHEDULED interview of the same case ends is ALLOWED
          (adjacent, not overlapping); overlap by one minute is rejected. Resource =
          employee's interview calendar.
        test_recipe:
          setup:
            - "CA case approved; interview I1 SCHEDULED 2026-08-05T10:00-11:00Z"
          setup_api_calls:
            - call: "POST /offboarding/offboarding-cases"
              payload: { employee_ref: "E-O1", case_type: "RESIGNATION", work_state_code: "CA", notice_received_date: "2026-08-01T00:00:00Z", requested_last_day: "2026-08-10T00:00:00Z", pto_balance_hours: 0.0, tenure_years: 1.0, hourly_wage_cents: 5000, intake_hr_ref: "hr-intake-1" }
              as: HRPartner
              as_user_id: "hr-intake-1"
              captures: { case_o1: $.data.id }
            - call: "POST /offboarding/offboarding-cases/${case_o1}/approve"
              payload: {}
              as: HRPartner
              as_user_id: "hr-approver-1"
            - call: "POST /offboarding/exit-interviews"
              payload: { offboarding_case_id: "${case_o1}", interviewer_ref: "hr-int-1", scheduled_start: "2026-08-05T10:00:00Z", scheduled_end: "2026-08-05T11:00:00Z" }
              as: HRPartner
              captures: { interview_o1: $.data.id }
          trigger:
            - call: "POST /offboarding/exit-interviews"
              payload: { offboarding_case_id: "${case_o1}", interviewer_ref: "hr-int-2", scheduled_start: "2026-08-05T11:00:00Z", scheduled_end: "2026-08-05T12:00:00Z" }
              as: HRPartner
              captures: { interview_o1b: $.data.id }
            - call: "POST /offboarding/exit-interviews"
              payload: { offboarding_case_id: "${case_o1}", interviewer_ref: "hr-int-3", scheduled_start: "2026-08-05T10:59:00Z", scheduled_end: "2026-08-05T12:00:00Z" }
              as: HRPartner
              captures: { err_id: $.data.error_id }
          assert:
            - "Second interview (11:00-12:00, adjacent) created successfully (half-open: 11:00 not < 11:00)"
            - "Third interview (10:59-12:00, overlapping by 1 minute) error_id == ERR_SCHEDULE_OVERLAP"
      - name: kt_session_closed_interval_adjacency_forbidden
        grounds:
          - validations[priority=8]
          - entities.KnowledgeTransferSession.fields.scheduled_start
        distinguishing_aspect: |
          OVERLAP-B (KnowledgeTransferSession): CLOSED interval [start, end] with
          0-minute adjacency FORBIDDEN — a session starting exactly at the prior
          session's end IS rejected (back-to-back sessions need a break). Different
          interval semantics than OVERLAP-A and different resource entity.
        test_recipe:
          setup:
            - "CA case approved; plan with required_session_count=3 activated; session S1 SCHEDULED 2026-08-05T10:00-11:00Z"
          setup_api_calls:
            - call: "POST /offboarding/offboarding-cases"
              payload: { employee_ref: "E-O2", case_type: "RESIGNATION", work_state_code: "CA", notice_received_date: "2026-08-01T00:00:00Z", requested_last_day: "2026-08-10T00:00:00Z", pto_balance_hours: 0.0, tenure_years: 1.0, hourly_wage_cents: 5000, intake_hr_ref: "hr-intake-1" }
              as: HRPartner
              as_user_id: "hr-intake-1"
              captures: { case_o2: $.data.id }
            - call: "POST /offboarding/offboarding-cases/${case_o2}/approve"
              payload: {}
              as: HRPartner
              as_user_id: "hr-approver-1"
            - call: "GET /offboarding/offboarding-cases/${case_o2}/knowledge-transfer-plans"
              payload: {}
              as: Manager
              captures: { plan_o2: $.data.0.id }
            - call: "POST /offboarding/knowledge-transfer-plans/${plan_o2}/activate"
              payload: {}
              as: Manager
            - call: "POST /offboarding/knowledge-transfer-sessions"
              payload: { knowledge_transfer_plan_id: "${plan_o2}", topic: "sys overview", scheduled_start: "2026-08-05T10:00:00Z", scheduled_end: "2026-08-05T11:00:00Z", successor_ref: "succ-1" }
              as: Manager
              captures: { session_o2: $.data.id }
          trigger:
            - call: "POST /offboarding/knowledge-transfer-sessions"
              payload: { knowledge_transfer_plan_id: "${plan_o2}", topic: "adjacent topic", scheduled_start: "2026-08-05T11:00:00Z", scheduled_end: "2026-08-05T12:00:00Z", successor_ref: "succ-1" }
              as: Manager
              captures: { err_id: $.data.error_id }
            - call: "POST /offboarding/knowledge-transfer-sessions"
              payload: { knowledge_transfer_plan_id: "${plan_o2}", topic: "after break", scheduled_start: "2026-08-05T11:15:00Z", scheduled_end: "2026-08-05T12:00:00Z", successor_ref: "succ-1" }
              as: Manager
              captures: { session_o2b: $.data.id }
          assert:
            - "Adjacent session (11:00 start) error_id == ERR_SCHEDULE_OVERLAP (closed interval forbids 0-minute adjacency)"
            - "Session at 11:15 created successfully (gap > 0)"

  # =========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: asset_waive_restores_deduction_total
        grounds:
          - state_machines.AssetReturnItem.OVERDUE_to_WAIVED
          - calculations.calc_deduction_total
          - entities.OffboardingCase.fields.deduction_total_cents
        distinguishing_aspect: |
          Conserved quantity 1: OffboardingCase.deduction_total_cents. Forward action
          mark-defaulted ADDS item.deduction_amount_cents to the case total; the
          compensating waive of the same item MUST subtract exactly the same amount
          (zero drift): after defaulted-then-waived, deduction_total_cents returns to
          its pre-default value.
        test_recipe:
          setup:
            - "CA case approved; one TOOLING asset replacement 100000 issued 2026-08-01; clock past return_due+7d"
            - "Snapshot deduction_total_cents (0) before default"
          setup_api_calls:
            - call: "POST /offboarding/offboarding-cases"
              payload: { employee_ref: "E-INV1", case_type: "RESIGNATION", work_state_code: "CA", notice_received_date: "2026-08-01T00:00:00Z", requested_last_day: "2026-08-10T00:00:00Z", pto_balance_hours: 0.0, tenure_years: 1.0, hourly_wage_cents: 5000, intake_hr_ref: "hr-intake-1" }
              as: HRPartner
              as_user_id: "hr-intake-1"
              captures: { case_inv1: $.data.id }
            - call: "POST /offboarding/offboarding-cases/${case_inv1}/approve"
              payload: {}
              as: HRPartner
              as_user_id: "hr-approver-1"
            - call: "POST /offboarding/asset-return-items"
              payload: { offboarding_case_id: "${case_inv1}", asset_tag: "T1", asset_kind: "TOOLING", replacement_cost_cents: 100000, issued_date: "2026-08-01T00:00:00Z" }
              as: AssetClerk
              captures: { item_inv1: $.data.id }
            - call: "POST /offboarding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-21T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /offboarding/asset-return-items/${item_inv1}/mark-defaulted"
              payload: {}
              as: PayrollSpecialist
          trigger:
            - call: "POST /offboarding/asset-return-items/${item_inv1}/waive"
              payload: { waive_reason: "asset located in storage cage" }
              as: AssetClerk
          assert:
            - "AssetReturnItem.${item_inv1}.status == WAIVED"
            - "AssetReturnItem.${item_inv1}.deduction_status == WAIVED"
            - "AssetReturnItem.${item_inv1}.deduction_amount_cents == 0"
            - "OffboardingCase.${case_inv1}.deduction_total_cents == 0 (compensation restored the conserved total — no drift)"
      - name: rehire_return_resubmit_loop_conserves_review_identity
        grounds:
          - state_machines.RehireEligibilityReview.SUBMITTED_to_RETURNED
          - state_machines.RehireEligibilityReview.RETURNED_to_SUBMITTED
          - entities.RehireEligibilityReview.fields.recommended_code
        distinguishing_aspect: |
          Conserved quantity 2: review cardinality per case (exactly one
          RehireEligibilityReview per OffboardingCase) plus finalized_at nullability.
          The SUBMITTED->RETURNED->SUBMITTED loop must not create a second review row,
          must keep finalized_at null, and must leave the case's rehire_code null —
          the cycle is code-preserving with zero net effect on the parent case.
          Different conserved quantity (cardinality + null-state) than instance 1.
        test_recipe:
          setup:
            - "CA case driven to CLEARANCE_IN_PROGRESS (revocation complete + statement approved)"
            - "Review submitted by hr-reviewer-1"
          setup_api_calls:
            - call: "POST /offboarding/offboarding-cases"
              payload: { employee_ref: "E-INV2", case_type: "RESIGNATION", work_state_code: "CA", notice_received_date: "2026-08-01T00:00:00Z", requested_last_day: "2026-08-10T00:00:00Z", pto_balance_hours: 0.0, tenure_years: 1.0, hourly_wage_cents: 5000, intake_hr_ref: "hr-intake-1" }
              as: HRPartner
              as_user_id: "hr-intake-1"
              captures: { case_inv2: $.data.id }
            - call: "POST /offboarding/offboarding-cases/${case_inv2}/approve"
              payload: {}
              as: HRPartner
              as_user_id: "hr-approver-1"
            - call: "POST /offboarding/access-revocation-tasks"
              payload: { offboarding_case_id: "${case_inv2}", system_name: "EMAIL", sequence_rank: 1 }
              as: ITManager
              captures: { task_inv2: $.data.id }
            - call: "POST /offboarding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /offboarding/access-revocation-tasks/${task_inv2}/execute"
              payload: { outcome: "SUCCESS" }
              as: ITOperator
              as_user_id: "it-op-1"
            - call: "POST /offboarding/access-revocation-tasks/${task_inv2}/verify"
              payload: { outcome: "VERIFIED" }
              as: ITVerifier
              as_user_id: "it-ver-1"
            - call: "GET /offboarding/offboarding-cases/${case_inv2}/final-pay-statements"
              payload: {}
              as: PayrollSpecialist
              captures: { stmt_inv2: $.data.0.id, stmt_inv2_v: $.data.0.version }
            - call: "POST /offboarding/final-pay-statements/${stmt_inv2}/calculate"
              payload: { regular_wages_cents: 100000, expected_final_pay_statement_version: "${stmt_inv2_v}" }
              as: PayrollSpecialist
              as_user_id: "payroll-calc-1"
            - call: "POST /offboarding/final-pay-statements/${stmt_inv2}/approve"
              payload: {}
              as: PayrollSpecialist
              as_user_id: "payroll-approver-1"
            - call: "GET /offboarding/offboarding-cases/${case_inv2}/rehire-eligibility-reviews"
              payload: {}
              as: HRReviewer
              captures: { review_inv2: $.data.0.id }
            - call: "POST /offboarding/rehire-eligibility-reviews/${review_inv2}/submit"
              payload: { recommended_code: "ELIGIBLE", rationale: "v1" }
              as: HRReviewer
              as_user_id: "hr-reviewer-1"
          trigger:
            - call: "POST /offboarding/rehire-eligibility-reviews/${review_inv2}/return"
              payload: { return_reason: "needs exit-interview context" }
              as: HRDirector
              as_user_id: "hr-director-1"
            - call: "POST /offboarding/rehire-eligibility-reviews/${review_inv2}/submit"
              payload: { recommended_code: "ELIGIBLE_WITH_CONDITIONS", rationale: "v2 revised" }
              as: HRReviewer
              as_user_id: "hr-reviewer-1"
            - call: "GET /offboarding/offboarding-cases/${case_inv2}/rehire-eligibility-reviews"
              payload: {}
              as: HRReviewer
              captures: { review_inv2_again: $.data.0.id }
          assert:
            - "GET list response contains exactly 1 row and its id == ${review_inv2} (return+resubmit loop conserves review cardinality — no duplicate row)"
            - "RehireEligibilityReview.${review_inv2}.finalized_at == null after the loop"
            - "RehireEligibilityReview.${review_inv2}.recommended_code == ELIGIBLE_WITH_CONDITIONS (latest submission wins)"
            - "OffboardingCase.${case_inv2}.rehire_code == null (not finalized; loop had zero net effect on parent)"
