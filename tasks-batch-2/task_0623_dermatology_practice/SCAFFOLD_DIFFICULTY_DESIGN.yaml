  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: deductible_conserved_across_post_then_void
        grounds:
          - state_machines.Charge.POSTED_to_VOIDED
          - calculations.charge_patient_responsibility
          - entities.Patient.fields.insurance_deductible_remaining_cents
        distinguishing_aspect: |
          Conserved quantity = patient deductible budget. Invariant:
          insurance_deductible_remaining_cents + SUM(deductible_applied_cents over
          non-VOIDED INSURANCE charges) == initial deductible (5000). Posting an
          allowed=20000 charge draws the full remaining 5000 (remaining ->0);
          voiding it restores the 5000 (remaining back to 5000), leaving the
          budget unchanged.
        test_recipe:
          setup:
            - "Insured patient, coinsurance 0.2, deductible_remaining 5000, MEDICAL encounter BILLING_OPEN."
          setup_api_calls:
            - call: "POST /providers"
              payload: { full_name: "Dr Cons", npi: "NPI-16", active: true }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Cons Pat", date_of_birth: "1966-06-16", has_active_insurance: true, insurance_coinsurance_rate: 0.2, insurance_deductible_remaining_cents: 5000 }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_type: "MEDICAL", scheduled_at: "2026-01-16T09:00:00Z" }
              as: FrontDesk
              captures: { enc_id: $.data.id }
            - call: "POST /charges"
              payload: { patient_id: "${pat_id}", encounter_id: "${enc_id}", source_kind: "ENCOUNTER", charge_kind: "OFFICE_VISIT", billed_amount_cents: 20000, insurer_allowed_cents: 20000 }
              as: BillingSpecialist
              captures: { ch_id: $.data.id }
          trigger:
            - call: "POST /charges/${ch_id}/void"
              payload: {}
              as: BillingSpecialist
              captures: { ch_status: $.data.status }
          assert:
            - "Charge.${ch_id}.status == VOIDED"
            - "Charge.${ch_id}.deductible_applied_cents == 5000"
            - "Patient.${pat_id}.insurance_deductible_remaining_cents == 5000"

      - name: membership_wallet_conserved_across_redeem_then_void
        grounds:
          - state_machines.Charge.POSTED_to_VOIDED
          - calculations.cosmetic_redemption_split
          - entities.CosmeticMembership.fields.unit_balance_cents
        distinguishing_aspect: |
          Conserved quantity = cosmetic prepaid wallet (a different conserved
          quantity from the deductible budget). Invariant: unit_balance_cents +
          SUM(redeemed_cents over non-VOIDED treatments whose charge is live) ==
          granted wallet (55000). A GOLD treatment list=20000 redeems 17000
          (wallet ->38000); voiding the linked COSMETIC_TREATMENT charge restores
          17000 (wallet back to 55000).
        test_recipe:
          setup:
            - "Patient with COSMETIC encounter (CASH). GOLD membership activated -> wallet 55000."
            - "One CosmeticTreatment (list 20000) redeemed -> wallet 38000, then a COSMETIC_TREATMENT charge posted for its out_of_pocket=0 linked via cosmetic_treatment_id."
          setup_api_calls:
            - call: "POST /providers"
              payload: { full_name: "Dr Wal", npi: "NPI-17", active: true }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Wal Pat", date_of_birth: "1987-07-27" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_type: "COSMETIC", scheduled_at: "2026-01-17T09:00:00Z" }
              as: FrontDesk
              captures: { enc_id: $.data.id }
            - call: "POST /cosmetic-memberships"
              payload: { patient_id: "${pat_id}", tier: "GOLD", purchased_unit_cents: 50000 }
              as: BillingSpecialist
              captures: { mem_id: $.data.id }
            - call: "POST /cosmetic-memberships/${mem_id}/activate"
              payload: {}
              as: BillingSpecialist
              captures: { mem_v: $.data.version }
            - call: "POST /cosmetic-treatments"
              payload: { encounter_id: "${enc_id}", membership_id: "${mem_id}", service_name: "botox", list_price_cents: 20000, expected_membership_version: "${mem_v}" }
              as: BillingSpecialist
              captures: { t_id: $.data.id, t_oop: $.data.out_of_pocket_cents }
            - call: "POST /charges"
              payload: { patient_id: "${pat_id}", encounter_id: "${enc_id}", source_kind: "COSMETIC_TREATMENT", charge_kind: "COSMETIC", billed_amount_cents: 0, cosmetic_treatment_id: "${t_id}" }
              as: BillingSpecialist
              captures: { ch_id: $.data.id }
          trigger:
            - call: "POST /charges/${ch_id}/void"
              payload: {}
              as: BillingSpecialist
              captures: { ch_status: $.data.status }
          assert:
            - "Charge.${ch_id}.status == VOIDED"
            - "CosmeticTreatment.${t_id}.redeemed_cents == 17000"
            - "CosmeticMembership.${mem_id}.unit_balance_cents == 55000"
