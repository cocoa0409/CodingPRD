      - name: nedss_transmit_blocked_when_case_reclassified
        grounds:
          - state_machines.NedssExport.GENERATED_to_TRANSMITTED
          - entities.NedssExport.fields.snapshot_classification
          - entities.Case.fields.classification
        distinguishing_aspect: |
          NedssExport transmit legality depends on Case.classification (entity pair
          NedssExport<->Case, different from Case<->Contact): an export snapshotted while the
          case was CONFIRMED cannot transmit (ERR_EXPORT_SNAPSHOT_STALE) once the case is
          reopened and reclassified PROBABLE.
        test_recipe:
          setup:
            - "Program P, condition COVID19 (requires_lab_confirmation false), jurisdiction J1."
            - "Case CN opened+interviewed+classified CONFIRMED; EpiAnalyst generates a NEDSS export E (snapshot CONFIRMED)."
            - "Case CN closed, reopened, re-interviewed, reclassified PROBABLE."
          setup_api_calls:
