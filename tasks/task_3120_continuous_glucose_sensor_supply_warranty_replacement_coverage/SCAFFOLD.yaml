      - "POST /cgm/coverage-verifications/{id}/decide"
    shared_operations:
      - "All GET endpoints"

  - name: FulfillmentAgent
    description: "Warehouse operator; creates orders, picks, ships, delivers, cancels"
    identity: opaque
    exclusive_operations:
