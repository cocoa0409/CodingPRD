  # ===========================================================================
  # Section: complexity_layers (cross-cutting layer claims)
  # ===========================================================================
  - section: complexity_layers
    instances:
      - name: study_amend_occ_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[study-amend-stale-version]", "endpoints[\"PATCH /playtests/studies/{id}\"]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH /playtests/studies/{id} is OCC-guarded: the first amend with the observed version succeeds and bumps version 1 -> 2; a second amend replaying the stale observed version fails 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["study S exists in DRAFT with version 1"]
          setup_api_calls:
            - call: "POST /playtests/studies"
              payload: { title: "OCC1 Study", code: "OCC1", min_age: 18, max_age: 35, allowed_regions: ["US-W"], required_platforms: ["PC"], cohort_capacity: 10, incentive_budget_cents: 1000000 }
              as: ResearchOpsAdmin
              captures: { s_id: "$.data.id", s_ver: "$.data.version"}
          trigger:
            - call: "PATCH /playtests/studies/${s_id}"
              payload: { expected_study_version: "${s_ver}", incentive_budget_cents: 2000000 }
              as: ResearchOpsAdmin
              captures: { ver2: "$.data.version", budget2: "$.data.incentive_budget_cents"}
            - call: "PATCH /playtests/studies/${s_id}"
              payload: { expected_study_version: "${s_ver}", title: "Hijacked title" }
              as: ResearchOpsAdmin
              captures: { err: "$.data.error_id"}
            - call: "GET /playtests/studies/${s_id}"
              as: ResearchOpsAdmin
              captures: { title_now: "$.data.title", ver_now: "$.data.version"}
          assert:
            - "ver2 == 2 and budget2 == 2000000  # fresh version accepted, version incremented"
            - "err == ERR_STALE_VERSION with HTTP 412  # stale replay rejected"
            - "title_now == OCC1 Study and ver_now == 2  # losing write changed nothing"
      - name: session_reschedule_occ_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[session-reschedule-stale-version]", "endpoints[\"PATCH /playtests/sessions/{id}/reschedule\"]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH reschedule is OCC-guarded: the first reschedule with the observed version succeeds and bumps version 1 -> 2; a second reschedule replaying the stale version fails 412 ERR_STALE_VERSION and the window stays put."
        test_recipe:
          setup: ["study S RECRUITING; REMOTE session SCHEDULED at 2026-08-10 10:00-11:00 with version 1"]
          setup_api_calls:
            - call: "POST /playtests/studies"
              payload: { title: "OCC2 Study", code: "OCC2", min_age: 18, max_age: 35, allowed_regions: ["US-W"], required_platforms: ["PC"], cohort_capacity: 10, incentive_budget_cents: 1000000 }
              as: ResearchOpsAdmin
              captures: { s_id: "$.data.id"}
            - call: "POST /playtests/studies/${s_id}/open-recruitment"
              payload: {}
              as: ResearchOpsAdmin
            - call: "POST /playtests/sessions"
              payload: { study_id: "${s_id}", mode: "REMOTE", starts_at: "2026-08-10T10:00:00Z", ends_at: "2026-08-10T11:00:00Z", seat_capacity: 4 }
              as: Researcher
              captures: { sess_id: "$.data.id", sess_ver: "$.data.version"}
          trigger:
            - call: "PATCH /playtests/sessions/${sess_id}/reschedule"
              payload: { expected_session_version: "${sess_ver}", starts_at: "2026-08-11T10:00:00Z", ends_at: "2026-08-11T11:00:00Z" }
              as: Researcher
              captures: { ver2: "$.data.version", starts2: "$.data.starts_at"}
            - call: "PATCH /playtests/sessions/${sess_id}/reschedule"
              payload: { expected_session_version: "${sess_ver}", starts_at: "2026-08-12T10:00:00Z", ends_at: "2026-08-12T11:00:00Z" }
              as: Researcher
              captures: { err: "$.data.error_id"}
            - call: "GET /playtests/sessions/${sess_id}"
              as: Researcher
              captures: { starts_now: "$.data.starts_at", ver_now: "$.data.version"}
          assert:
            - "ver2 == 2 and starts2 == 2026-08-11T10:00:00.000Z"
            - "err == ERR_STALE_VERSION with HTTP 412"
            - "starts_now == 2026-08-11T10:00:00.000Z and ver_now == 2"
      - name: participant_list_pagination_with_region_filter
        claim_type: pagination_with_filtering
        grounds: ["endpoints[\"GET /playtests/participants\"]", response_envelope]
        distinguishing_aspect: "Filter and pagination compose: with two US-W and one US-E participant, region_code=US-W with limit 1 returns total_count 2 and has_more true on page 1, and the second page returns the remaining single item with has_more false."
        test_recipe:
          setup: ["three participants: two in region US-W, one in US-E"]
          setup_api_calls:
            - call: "POST /playtests/participants"
              payload: { email: "pg-1@x.com", full_name: "PG One", age_years: 25, region_code: "US-W", platform_tags: ["PC"] }
              as: ResearchOpsAdmin
            - call: "POST /playtests/participants"
              payload: { email: "pg-2@x.com", full_name: "PG Two", age_years: 26, region_code: "US-W", platform_tags: ["PC"] }
              as: ResearchOpsAdmin
            - call: "POST /playtests/participants"
              payload: { email: "pg-3@x.com", full_name: "PG Three", age_years: 27, region_code: "US-E", platform_tags: ["PC"] }
              as: ResearchOpsAdmin
          trigger:
            - call: "GET /playtests/participants?region_code=US-W&limit=1&offset=0"
              as: ResearchOpsAdmin
              captures: { page1: "$.data"}
            - call: "GET /playtests/participants?region_code=US-W&limit=1&offset=1"
              as: ResearchOpsAdmin
              captures: { page2: "$.data"}
          assert:
            - "page 1: data length 1, total_count == 2, has_more == true   # filter applies before pagination"
            - "page 2: data length 1, total_count == 2, has_more == false"
            - "the union of page1 and page2 contains exactly the two US-W participants"
      - name: breach_cascade_layer_covered
        claim_type: cascading_side_effects
        grounds: [state_machines.BreachCase.UNDER_INVESTIGATION_to_SUBSTANTIATED]
        excluded_because:
          difficulty_instance: transitive_cascade / breach_substantiation_suspends_cancels_promotes
          rationale: "The three-link cascade (substantiate -> suspend -> cancel -> promote, plus key revocation with exposure records) is asserted in the named section-1.8 instance."
      - name: dual_variant_layer_covered
        claim_type: dual_variant_calculation
        grounds: [calculations.screening_fit_score, calculations.incentive_amount]
        excluded_because:
          difficulty_instance: dual_variant_calc / screening_fit_provisional_vs_verified
          rationale: "Both dual-variant calculations (fit score and incentive amount) are asserted with divergent literal outputs in the section-1.8 dual_variant_calc instances."
      - name: key_pool_reconciliation_covered
        claim_type: derived_field_reconciliation
        grounds: [entities.GameBuild.fields.keys_active_count]
        excluded_because:
          difficulty_instance: compensating_invariant / issue_revoke_conserves_key_pool
          rationale: "keys_active_count reconciliation across issue and revoke is asserted at both steps in the named section-1.8 instance."
      # NOTE: the rate_threshold_triggers layer claim is covered by the full
      # corner instance calculations / no_show_strike_threshold_suspends_at_third
      # (2 strikes ACTIVE, exactly 3 strikes SUSPENDED); no stub is emitted here
      # because excluded_because may only cite section-1.8 difficulty instances.

  # ===========================================================================
  # Section: consistency_model (immediate consistency claims)
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: created_participant_immediately_readable
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model, "endpoints[\"GET /playtests/participants/{id}\"]"]
        distinguishing_aspect: "The model is immediate: a participant returned by POST is fully visible via GET in the very next request with identical field values — no read lag, no reconciliation delay."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /playtests/participants"
              payload: { email: "im2@x.com", full_name: "Immediate Two", age_years: 31, region_code: "US-E", platform_tags: ["PS5"] }
              as: ResearchOpsAdmin
              captures: { p_id: "$.data.id"}
          trigger:
            - call: "GET /playtests/participants/${p_id}"
              as: Researcher
              captures: { email: "$.data.email", st: "$.data.status", ver: "$.data.version"}
          assert:
            - "email == im2@x.com"
            - "st == REGISTERED"
            - "ver == 1"
      - name: approve_immediately_reflects_budget_commit
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model, "endpoints[\"POST /playtests/incentive-payouts/{id}/approve\"]"]
        excluded_because:
          difficulty_instance: dual_variant_calc / incentive_provisional_vs_final_recompute
          rationale: "The approve response's amount_final_cents and the immediately-read study.budget_committed_cents (11500) are asserted together in the named section-1.8 instance."
