# =============================================================================
# SCAFFOLD.yaml — task_3265_retail_repair_appointment_depot_routing_coverage_entitlement
# Retail Repair Appointment, Depot Routing & Coverage Entitlement
# =============================================================================
scenario: |
  Retail Repair Appointment, Depot Routing & Coverage Entitlement (Apple): appointment scheduling at retail locations and authorized providers with diagnostic time slots, coverage entitlement lookup across warranty, extended plan and out-of-warranty pricing with proof of purchase, repair triage between same-day in-store service, mail-in depot and whole-unit replacement based on part availability and issue type, activation lock and account security verification before service with ownership proof requirements, parts inventory allocation across stores with express replacement units, accidental damage incident counting under a coverage plan with service fees, data backup responsibilities and privacy handling during service, quality follow-up and repeat repair escalation

domain_name: retail-repair-entitlement
api_prefix: /repair

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - ops_run_checkpoint
    - scheduled_deferred_actions

  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  # ---------------------------------------------------------------------------
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: Customer contact email; unique across all customers.
      - name: full_name
        type: string
        source: input
        description: Legal full name used for ownership proof.
      - name: phone
        type: string
        source: input
        description: Contact phone number.
      - name: account_status
        type: enum
        source: system
        description: "ACTIVE | LOCKED | CLOSED. Set by system on security lock events."
        default: ACTIVE
        constraints: "enum: ACTIVE, LOCKED, CLOSED"

  # ---------------------------------------------------------------------------
  - name: Device
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: FK -> Customer.id
      - name: serial_number
        type: string
        source: input
        description: Device serial number; unique per device model family.
      - name: model_code
        type: string
        source: input
        description: Model identifier, e.g. IPHONE_15_PRO.
      - name: activation_lock_enabled
        type: boolean
        source: input
        description: Whether Find My / Activation Lock is currently enabled.
      - name: proof_of_purchase_on_file
        type: boolean
        source: input
        description: Whether a valid proof of purchase document has been uploaded.
      - name: purchase_date
        type: datetime
        source: input
        description: Original retail purchase date (ISO8601).
      - name: device_status
        type: enum
        source: system
        description: "ACTIVE | IN_SERVICE | RETIRED."
        default: ACTIVE
        constraints: "enum: ACTIVE, IN_SERVICE, RETIRED"

  # ---------------------------------------------------------------------------
  - name: CoveragePlan
    parent: null
    common_fields: true
    fields:
      - name: device_id
        type: string
        source: input
        description: FK -> Device.id
      - name: plan_type
        type: enum
        source: input
        description: "LIMITED_WARRANTY | APPLECARE_PLUS | OUT_OF_WARRANTY."
        constraints: "enum: LIMITED_WARRANTY, APPLECARE_PLUS, OUT_OF_WARRANTY"
      - name: starts_on
        type: datetime
        source: input
        description: Coverage start (ISO8601).
      - name: expires_on
        type: datetime
        source: input
        description: Coverage expiration (ISO8601).
      - name: accidental_damage_incidents_used
        type: integer
        source: system
        description: Count of accidental damage incidents consumed under this plan.
        default: 0
        constraints: "integer >= 0"
      - name: accidental_damage_incident_limit
        type: integer
        source: input
        description: Maximum incidents allowed under the plan.
        constraints: "integer >= 0"
      - name: service_fee_cents
        type: integer
        source: input
        description: Per-incident service fee in cents for accidental damage.
        constraints: "integer >= 0"
      - name: coverage_status
        type: enum
        source: system
        description: "ACTIVE | EXPIRED | EXHAUSTED | CANCELLED."
        default: ACTIVE
        constraints: "enum: ACTIVE, EXPIRED, EXHAUSTED, CANCELLED"

  # ---------------------------------------------------------------------------
  - name: ServiceLocation
    parent: null
    common_fields: true
    fields:
      - name: location_code
        type: string
        source: input
        description: Short code, e.g. NYC-5TH-AVE.
      - name: location_type
        type: enum
        source: input
        description: "RETAIL_STORE | AUTHORIZED_PROVIDER | MAIL_IN_DEPOT."
        constraints: "enum: RETAIL_STORE, AUTHORIZED_PROVIDER, MAIL_IN_DEPOT"
      - name: address
        type: string
        source: input
        description: Physical address.
      - name: supports_same_day_repair
        type: boolean
        source: input
        description: Whether same-day in-store repair is offered.
      - name: supports_express_replacement
        type: boolean
        source: input
        description: Whether express replacement units are stocked.
      - name: diagnostic_slot_duration_minutes
        type: integer
        source: input
        description: Default diagnostic slot length.
        constraints: "integer > 0"
      - name: location_status
        type: enum
        source: system
        description: "ACTIVE | SUSPENDED | CLOSED."
        default: ACTIVE
        constraints: "enum: ACTIVE, SUSPENDED, CLOSED"

  # ---------------------------------------------------------------------------
  - name: Technician
    parent: null
    common_fields: true
    fields:
      - name: location_id
        type: string
        source: input
        description: FK -> ServiceLocation.id
      - name: full_name
        type: string
        source: input
        description: Technician name.
      - name: certification_level
        type: enum
        source: input
        description: "BASIC | ADVANCED | EXPERT."
        constraints: "enum: BASIC, ADVANCED, EXPERT"
      - name: is_active
        type: boolean
        source: system
        description: Whether the technician is currently schedulable.
        default: true

  # ---------------------------------------------------------------------------
  - name: Part
    parent: null
    common_fields: true
    fields:
      - name: part_number
        type: string
        source: input
        description: Manufacturer part number.
      - name: model_code
        type: string
        source: input
        description: Compatible device model code.
      - name: part_category
        type: enum
        source: input
        description: "DISPLAY | BATTERY | LOGIC_BOARD | CAMERA | ENCLOSURE | OTHER."
        constraints: "enum: DISPLAY, BATTERY, LOGIC_BOARD, CAMERA, ENCLOSURE, OTHER"
      - name: is_whole_unit_replacement
        type: boolean
        source: input
        description: Whether this part is a whole-unit replacement (not a component).
      - name: part_status
        type: enum
        source: system
        description: "ACTIVE | DISCONTINUED | RECALLED."
        default: ACTIVE
        constraints: "enum: ACTIVE, DISCONTINUED, RECALLED"

  # ---------------------------------------------------------------------------
  - name: PartInventory
    parent: null
    common_fields: true
    fields:
      - name: location_id
        type: string
        source: input
        description: FK -> ServiceLocation.id
      - name: part_id
        type: string
        source: input
        description: FK -> Part.id
      - name: on_hand_quantity
        type: integer
        source: system
        description: Physical units on hand.
        default: 0
        constraints: "integer >= 0"
      - name: reserved_quantity
        type: integer
        source: system
        description: Units reserved by open repair orders.
        default: 0
        constraints: "integer >= 0"
      - name: express_replacement_quantity
        type: integer
        source: system
        description: Units earmarked for express replacement (subset of on_hand).
        default: 0
        constraints: "integer >= 0"
      - name: available_quantity
        type: integer
        source: computed
        description: "on_hand_quantity - reserved_quantity - express_replacement_quantity. Computed on read."
        constraints: "integer"

  # ---------------------------------------------------------------------------
  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: FK -> Customer.id
      - name: device_id
        type: string
        source: input
        description: FK -> Device.id
      - name: location_id
        type: string
        source: input
        description: FK -> ServiceLocation.id
      - name: technician_id
        type: string
        source: input
        description: FK -> Technician.id
      - name: slot_start
        type: datetime
        source: input
        description: Diagnostic slot start (ISO8601).
      - name: slot_end
        type: datetime
        source: input
        description: Diagnostic slot end (ISO8601).
      - name: issue_category
        type: enum
        source: input
        description: "SCREEN_DAMAGE | BATTERY | WATER_DAMAGE | SOFTWARE | HARDWARE_OTHER."
        constraints: "enum: SCREEN_DAMAGE, BATTERY, WATER_DAMAGE, SOFTWARE, HARDWARE_OTHER"
      - name: appointment_status
        type: enum
        source: system
        description: "SCHEDULED | CHECKED_IN | IN_DIAGNOSIS | COMPLETED | CANCELLED | NO_SHOW."
        default: SCHEDULED
        constraints: "enum: SCHEDULED, CHECKED_IN, IN_DIAGNOSIS, COMPLETED, CANCELLED, NO_SHOW"

  # ---------------------------------------------------------------------------
  - name: RepairOrder
    parent: null
    common_fields: true
    fields:
      - name: appointment_id
        type: string
        source: input
        description: FK -> Appointment.id
      - name: device_id
        type: string
        source: input
        description: FK -> Device.id
      - name: customer_id
        type: string
        source: input
        description: FK -> Customer.id
      - name: origin_location_id
        type: string
        source: input
        description: FK -> ServiceLocation.id
      - name: current_location_id
        type: string
        source: system
        description: FK -> ServiceLocation.id; where the device currently resides.
      - name: issue_category
        type: enum
        source: input
        description: "SCREEN_DAMAGE | BATTERY | WATER_DAMAGE | SOFTWARE | HARDWARE_OTHER."
        constraints: "enum: SCREEN_DAMAGE, BATTERY, WATER_DAMAGE, SOFTWARE, HARDWARE_OTHER"
      - name: is_accidental_damage
        type: boolean
        source: input
        description: Whether the damage is accidental (affects coverage incident counting).
      - name: triage_mode
        type: enum
        source: system
        description: "SAME_DAY_IN_STORE | MAIL_IN_DEPOT | WHOLE_UNIT_REPLACEMENT."
        constraints: "enum: SAME_DAY_IN_STORE, MAIL_IN_DEPOT, WHOLE_UNIT_REPLACEMENT"
      - name: repair_status
        type: enum
        source: system
        description: "TRIAGED | PARTS_ALLOCATED | IN_PROGRESS | QUALITY_CHECK | READY_FOR_PICKUP | SHIPPED_TO_DEPOT | IN_TRANSIT_BACK | COMPLETED | CANCELLED | ESCALATED_REPEAT."
        constraints: "enum: TRIAGED, PARTS_ALLOCATED, IN_PROGRESS, QUALITY_CHECK, READY_FOR_PICKUP, SHIPPED_TO_DEPOT, IN_TRANSIT_BACK, COMPLETED, CANCELLED, ESCALATED_REPEAT"
      - name: quoted_price_cents
        type: integer
        source: system
        description: Final customer-facing price in cents after entitlement resolution.
        constraints: "integer >= 0"
      - name: data_backup_acknowledged
        type: boolean
        source: input
        description: Customer acknowledges data backup responsibility.
      - name: privacy_wipe_consent
        type: boolean
        source: input
        description: Customer consents to privacy wipe if required.
      - name: repeat_repair_count
        type: integer
        source: system
        description: Number of times this repair has been reopened as a repeat.
        default: 0
        constraints: "integer >= 0"

  # ---------------------------------------------------------------------------
  - name: PartAllocation
    parent: null
    common_fields: true
    fields:
      - name: repair_order_id
        type: string
        source: input
        description: FK -> RepairOrder.id
      - name: part_id
        type: string
        source: input
        description: FK -> Part.id
      - name: location_id
        type: string
        source: input
        description: FK -> ServiceLocation.id
      - name: quantity
        type: integer
        source: input
        description: Units allocated.
        constraints: "integer > 0"
      - name: allocation_status
        type: enum
        source: system
        description: "RESERVED | CONSUMED | RELEASED | BACKORDERED."
        default: RESERVED
        constraints: "enum: RESERVED, CONSUMED, RELEASED, BACKORDERED"

  # ---------------------------------------------------------------------------
  - name: CoverageEntitlement
    parent: null
    common_fields: true
    fields:
      - name: repair_order_id
        type: string
        source: input
        description: FK -> RepairOrder.id
      - name: coverage_plan_id
        type: string
        source: input
        description: FK -> CoveragePlan.id
      - name: entitlement_status
        type: enum
        source: system
        description: "PENDING_VERIFICATION | ENTITLED | PARTIALLY_ENTITLED | NOT_ENTITLED | WAIVED."
        constraints: "enum: PENDING_VERIFICATION, ENTITLED, PARTIALLY_ENTITLED, NOT_ENTITLED, WAIVED"
      - name: quoted_price_cents
        type: integer
        source: system
        description: Price quoted to customer under this entitlement.
        constraints: "integer >= 0"
      - name: requires_proof_of_purchase
        type: boolean
        source: system
        description: Whether proof of purchase is required to finalize entitlement.
      - name: incident_counted
        type: boolean
        source: system
        description: Whether this repair consumed one accidental-damage incident.
        default: false

  # ---------------------------------------------------------------------------
  - name: QualityFollowUp
    parent: null
    common_fields: true
    fields:
      - name: repair_order_id
        type: string
        source: input
        description: FK -> RepairOrder.id
      - name: customer_id
        type: string
        source: input
        description: FK -> Customer.id
      - name: follow_up_status
        type: enum
        source: system
        description: "OPEN | RESOLVED_SATISFIED | RESOLVED_REPEAT_REPAIR | ESCALATED."
        default: OPEN
        constraints: "enum: OPEN, RESOLVED_SATISFIED, RESOLVED_REPEAT_REPAIR, ESCALATED"
      - name: opened_at
        type: datetime
        source: system
        description: When the follow-up was opened.
      - name: resolved_at
        type: datetime
        source: system
        description: When the follow-up was resolved.

  # ---------------------------------------------------------------------------
  - name: SecurityVerification
    parent: null
    common_fields: true
    fields:
      - name: repair_order_id
        type: string
        source: input
        description: FK -> RepairOrder.id
      - name: verification_type
        type: enum
        source: input
        description: "ACTIVATION_LOCK_REMOVAL | OWNERSHIP_PROOF | ACCOUNT_UNLOCK."
        constraints: "enum: ACTIVATION_LOCK_REMOVAL, OWNERSHIP_PROOF, ACCOUNT_UNLOCK"
      - name: verification_status
        type: enum
        source: system
        description: "PENDING | VERIFIED | FAILED | EXPIRED."
        default: PENDING
        constraints: "enum: PENDING, VERIFIED, FAILED, EXPIRED"
      - name: verified_by
        type: string
        source: system
        description: Technician or system user id who performed verification.
      - name: verified_at
        type: datetime
        source: system
        description: Timestamp of verification.

  # ---------------------------------------------------------------------------
  - name: RepairShipment
    parent: null
    common_fields: true
    fields:
      - name: repair_order_id
        type: string
        source: input
        description: FK -> RepairOrder.id
      - name: from_location_id
        type: string
        source: input
        description: FK -> ServiceLocation.id
      - name: to_location_id
        type: string
        source: input
        description: FK -> ServiceLocation.id
      - name: shipment_type
        type: enum
        source: input
        description: "CUSTOMER_TO_DEPOT | DEPOT_TO_CUSTOMER | STORE_TO_DEPOT | DEPOT_TO_STORE."
        constraints: "enum: CUSTOMER_TO_DEPOT, DEPOT_TO_CUSTOMER, STORE_TO_DEPOT, DEPOT_TO_STORE"
      - name: shipment_status
        type: enum
        source: system
        description: "LABEL_CREATED | IN_TRANSIT | RECEIVED | DELIVERED | LOST."
        default: LABEL_CREATED
        constraints: "enum: LABEL_CREATED, IN_TRANSIT, RECEIVED, DELIVERED, LOST"
      - name: tracking_number
        type: string
        source: system
        description: Carrier tracking number.
      - name: shipped_at
        type: datetime
        source: system
        description: When the shipment entered transit.
      - name: received_at
        type: datetime
        source: system
        description: When the shipment was received.

state_machines:
  # ---------------------------------------------------------------------------
  - entity: Appointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /appointments/{id}/check-in"
        actor: Customer | Technician
        preconditions:
          - "appointment_status == SCHEDULED"
          - "current_utc >= slot_start - 15 minutes"
          - "current_utc <= slot_end"
        side_effects:
          - "Appointment.appointment_status = CHECKED_IN"
          - "Appointment.version += 1"
      - from: CHECKED_IN
        to: IN_DIAGNOSIS
        trigger: "POST /appointments/{id}/start-diagnosis"
        actor: Technician
        preconditions:
          - "appointment_status == CHECKED_IN"
          - "technician.location_id == appointment.location_id"
          - "technician.is_active == true"
        side_effects:
          - "Appointment.appointment_status = IN_DIAGNOSIS"
          - "Appointment.version += 1"
      - from: IN_DIAGNOSIS
        to: COMPLETED
        trigger: "POST /appointments/{id}/complete-diagnosis"
        actor: Technician
        preconditions:
          - "appointment_status == IN_DIAGNOSIS"
        side_effects:
          - "Appointment.appointment_status = COMPLETED"
          - "Appointment.version += 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /appointments/{id}/cancel"
        actor: Customer | Technician | CustomerService
        preconditions:
          - "appointment_status == SCHEDULED"
        side_effects:
          - "Appointment.appointment_status = CANCELLED"
          - "Appointment.version += 1"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "system clock advance past slot_end without check-in"
        actor: system
        preconditions:
          - "appointment_status == SCHEDULED"
          - "current_utc > slot_end"
        side_effects:
          - "Appointment.appointment_status = NO_SHOW"
          - "Appointment.version += 1"
      - from: CHECKED_IN
        to: CANCELLED
        trigger: "POST /appointments/{id}/cancel"
        actor: CustomerService
        preconditions:
          - "appointment_status == CHECKED_IN"
        side_effects:
          - "Appointment.appointment_status = CANCELLED"
          - "Appointment.version += 1"

  # ---------------------------------------------------------------------------
  - entity: RepairOrder
    initial_state: TRIAGED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: TRIAGED
        to: PARTS_ALLOCATED
        trigger: "POST /repair-orders/{id}/allocate-parts"
        actor: Technician
        preconditions:
          - "repair_status == TRIAGED"
          - "triage_mode != WHOLE_UNIT_REPLACEMENT"
          - "for every required part, PartInventory.available_quantity > 0 at current_location_id"
        side_effects:
          - "RepairOrder.repair_status = PARTS_ALLOCATED"
          - "RepairOrder.version += 1"
          - "for each required part: PartInventory.reserved_quantity += quantity"
          - "create PartAllocation rows with allocation_status = RESERVED"
      - from: PARTS_ALLOCATED
        to: IN_PROGRESS
        trigger: "POST /repair-orders/{id}/start-repair"
        actor: Technician
        preconditions:
          - "repair_status == PARTS_ALLOCATED"
          - "SecurityVerification(verification_type=ACTIVATION_LOCK_REMOVAL).verification_status == VERIFIED OR device.activation_lock_enabled == false"
          - "SecurityVerification(verification_type=OWNERSHIP_PROOF).verification_status == VERIFIED OR device.proof_of_purchase_on_file == true"
          - "data_backup_acknowledged == true"
        side_effects:
          - "RepairOrder.repair_status = IN_PROGRESS"
          - "RepairOrder.version += 1"
      - from: IN_PROGRESS
        to: QUALITY_CHECK
        trigger: "POST /repair-orders/{id}/complete-repair"
        actor: Technician
        preconditions:
          - "repair_status == IN_PROGRESS"
        side_effects:
          - "RepairOrder.repair_status = QUALITY_CHECK"
          - "RepairOrder.version += 1"
      - from: QUALITY_CHECK
        to: READY_FOR_PICKUP
        trigger: "POST /repair-orders/{id}/pass-quality-check"
        actor: Technician
        preconditions:
          - "repair_status == QUALITY_CHECK"
          - "triage_mode == SAME_DAY_IN_STORE"
        side_effects:
          - "RepairOrder.repair_status = READY_FOR_PICKUP"
          - "RepairOrder.version += 1"
      - from: QUALITY_CHECK
        to: SHIPPED_TO_DEPOT
        trigger: "POST /repair-orders/{id}/ship-to-depot"
        actor: Technician
        preconditions:
          - "repair_status == QUALITY_CHECK"
          - "triage_mode == MAIL_IN_DEPOT"
        side_effects:
          - "RepairOrder.repair_status = SHIPPED_TO_DEPOT"
          - "RepairOrder.version += 1"
          - "create RepairShipment with shipment_type=STORE_TO_DEPOT, shipment_status=LABEL_CREATED"
      - from: SHIPPED_TO_DEPOT
        to: IN_TRANSIT_BACK
        trigger: "POST /repair-orders/{id}/receive-at-depot"
        actor: DepotAgent
        preconditions:
          - "repair_status == SHIPPED_TO_DEPOT"
        side_effects:
          - "RepairOrder.repair_status = IN_TRANSIT_BACK"
          - "RepairOrder.current_location_id = depot_location_id"
          - "RepairOrder.version += 1"
      - from: IN_TRANSIT_BACK
        to: READY_FOR_PICKUP
        trigger: "POST /repair-orders/{id}/receive-back-from-depot"
        actor: DepotAgent
        preconditions:
          - "repair_status == IN_TRANSIT_BACK"
        side_effects:
          - "RepairOrder.repair_status = READY_FOR_PICKUP"
          - "RepairOrder.current_location_id = origin_location_id"
          - "RepairOrder.version += 1"
      - from: READY_FOR_PICKUP
        to: COMPLETED
        trigger: "POST /repair-orders/{id}/complete-pickup"
        actor: Customer | Technician
        preconditions:
          - "repair_status == READY_FOR_PICKUP"
        side_effects:
          - "RepairOrder.repair_status = COMPLETED"
          - "RepairOrder.version += 1"
          - "for each PartAllocation: allocation_status = CONSUMED"
          - "PartInventory.on_hand_quantity -= consumed quantity; reserved_quantity -= consumed quantity"
          - "if CoverageEntitlement.entitlement_status == ENTITLED and is_accidental_damage and incident_counted == false: CoveragePlan.accidental_damage_incidents_used += 1; incident_counted = true"
      - from: TRIAGED
        to: CANCELLED
        trigger: "POST /repair-orders/{id}/cancel"
        actor: Customer | CustomerService
        preconditions:
          - "repair_status == TRIAGED"
        side_effects:
          - "RepairOrder.repair_status = CANCELLED"
          - "RepairOrder.version += 1"
      - from: PARTS_ALLOCATED
        to: CANCELLED
        trigger: "POST /repair-orders/{id}/cancel"
        actor: Customer | CustomerService
        preconditions:
          - "repair_status == PARTS_ALLOCATED"
        side_effects:
          - "RepairOrder.repair_status = CANCELLED"
          - "RepairOrder.version += 1"
          - "for each PartAllocation: allocation_status = RELEASED"
          - "PartInventory.reserved_quantity -= released quantity"
      - from: COMPLETED
        to: ESCALATED_REPEAT
        trigger: "POST /repair-orders/{id}/escalate-repeat"
        actor: CustomerService
        preconditions:
          - "repair_status == COMPLETED"
          - "current_utc <= completed_at + 90 days"
          - "QualityFollowUp for this repair_order_id has follow_up_status != RESOLVED_SATISFIED"
        side_effects:
          - "RepairOrder.repair_status = ESCALATED_REPEAT"
          - "RepairOrder.repeat_repair_count += 1"
          - "RepairOrder.version += 1"
          - "QualityFollowUp.follow_up_status = ESCALATED"
      - from: ESCALATED_REPEAT
        to: TRIAGED
        trigger: "POST /repair-orders/{id}/re-triage"
        actor: Technician
        preconditions:
          - "repair_status == ESCALATED_REPEAT"
        side_effects:
          - "RepairOrder.repair_status = TRIAGED"
          - "RepairOrder.version += 1"

  # ---------------------------------------------------------------------------
  - entity: CoverageEntitlement
    initial_state: PENDING_VERIFICATION
    terminal_states: [ENTITLED, PARTIALLY_ENTITLED, NOT_ENTITLED, WAIVED]
    transitions:
      - from: PENDING_VERIFICATION
        to: ENTITLED
        trigger: "POST /coverage-entitlements/{id}/resolve"
        actor: Technician | CustomerService
        preconditions:
          - "entitlement_status == PENDING_VERIFICATION"
          - "coverage_plan.coverage_status == ACTIVE"
          - "device.proof_of_purchase_on_file == true OR requires_proof_of_purchase == false"
          - "for accidental damage: coverage_plan.accidental_damage_incidents_used < coverage_plan.accidental_damage_incident_limit"
        side_effects:
          - "CoverageEntitlement.entitlement_status = ENTITLED"
          - "CoverageEntitlement.quoted_price_cents = service_fee_cents if is_accidental_damage else 0"
          - "CoverageEntitlement.version += 1"
          - "RepairOrder.quoted_price_cents = CoverageEntitlement.quoted_price_cents"
      - from: PENDING_VERIFICATION
        to: PARTIALLY_ENTITLED
        trigger: "POST /coverage-entitlements/{id}/resolve-partial"
        actor: Technician | CustomerService
        preconditions:
          - "entitlement_status == PENDING_VERIFICATION"
          - "coverage_plan.coverage_status == ACTIVE"
          - "device.proof_of_purchase_on_file == true OR requires_proof_of_purchase == false"
          - "for accidental damage: coverage_plan.accidental_damage_incidents_used >= coverage_plan.accidental_damage_incident_limit"
        side_effects:
          - "CoverageEntitlement.entitlement_status = PARTIALLY_ENTITLED"
          - "CoverageEntitlement.quoted_price_cents = out_of_warranty_price_cents"
          - "CoverageEntitlement.version += 1"
          - "RepairOrder.quoted_price_cents = CoverageEntitlement.quoted_price_cents"
      - from: PENDING_VERIFICATION
        to: NOT_ENTITLED
        trigger: "POST /coverage-entitlements/{id}/resolve"
        actor: Technician | CustomerService
        preconditions:
          - "entitlement_status == PENDING_VERIFICATION"
          - "coverage_plan.coverage_status != ACTIVE OR proof_of_purchase requirement not met"
        side_effects:
          - "CoverageEntitlement.entitlement_status = NOT_ENTITLED"
          - "CoverageEntitlement.quoted_price_cents = out_of_warranty_price_cents"
          - "CoverageEntitlement.version += 1"
          - "RepairOrder.quoted_price_cents = CoverageEntitlement.quoted_price_cents"
      - from: PENDING_VERIFICATION
        to: WAIVED
        trigger: "POST /coverage-entitlements/{id}/waive"
        actor: CustomerService
        preconditions:
          - "entitlement_status == PENDING_VERIFICATION"
          - "actor role == CustomerService"
        side_effects:
          - "CoverageEntitlement.entitlement_status = WAIVED"
          - "CoverageEntitlement.quoted_price_cents = 0"
          - "CoverageEntitlement.version += 1"
          - "RepairOrder.quoted_price_cents = 0"

  # ---------------------------------------------------------------------------
  - entity: SecurityVerification
    initial_state: PENDING
    terminal_states: [VERIFIED, FAILED, EXPIRED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /security-verifications/{id}/verify"
        actor: Technician
        preconditions:
          - "verification_status == PENDING"
          - "current_utc <= created_at + 24 hours"
        side_effects:
          - "SecurityVerification.verification_status = VERIFIED"
          - "SecurityVerification.verified_by = actor id"
          - "SecurityVerification.verified_at = current_utc"
          - "SecurityVerification.version += 1"
      - from: PENDING
        to: FAILED
        trigger: "POST /security-verifications/{id}/fail"
        actor: Technician
        preconditions:
          - "verification_status == PENDING"
        side_effects:
          - "SecurityVerification.verification_status = FAILED"
          - "SecurityVerification.version += 1"
      - from: PENDING
        to: EXPIRED
        trigger: "system clock advance past created_at + 24 hours"
        actor: system
        preconditions:
          - "verification_status == PENDING"
          - "current_utc > created_at + 24 hours"
        side_effects:
          - "SecurityVerification.verification_status = EXPIRED"
          - "SecurityVerification.version += 1"

  # ---------------------------------------------------------------------------
  - entity: RepairShipment
    initial_state: LABEL_CREATED
    terminal_states: [DELIVERED, LOST]
    transitions:
      - from: LABEL_CREATED
        to: IN_TRANSIT
        trigger: "POST /repair-shipments/{id}/ship"
        actor: DepotAgent
        preconditions:
          - "shipment_status == LABEL_CREATED"
        side_effects:
          - "RepairShipment.shipment_status = IN_TRANSIT"
          - "RepairShipment.shipped_at = current_utc"
          - "RepairShipment.version += 1"
      - from: IN_TRANSIT
        to: RECEIVED
        trigger: "POST /repair-shipments/{id}/receive"
        actor: DepotAgent
        preconditions:
          - "shipment_status == IN_TRANSIT"
        side_effects:
          - "RepairShipment.shipment_status = RECEIVED"
          - "RepairShipment.received_at = current_utc"
          - "RepairShipment.version += 1"
      - from: RECEIVED
        to: DELIVERED
        trigger: "POST /repair-shipments/{id}/deliver"
        actor: DepotAgent
        preconditions:
          - "shipment_status == RECEIVED"
        side_effects:
          - "RepairShipment.shipment_status = DELIVERED"
          - "RepairShipment.version += 1"
      - from: IN_TRANSIT
        to: LOST
        trigger: "POST /repair-shipments/{id}/mark-lost"
        actor: CustomerService
        preconditions:
          - "shipment_status == IN_TRANSIT"
        side_effects:
          - "RepairShipment.shipment_status = LOST"
          - "RepairShipment.version += 1"
          - "RepairOrder.repair_status = ESCALATED_REPEAT"

  # ---------------------------------------------------------------------------
  - entity: QualityFollowUp
    initial_state: OPEN
    terminal_states: [RESOLVED_SATISFIED, RESOLVED_REPEAT_REPAIR, ESCALATED]
    transitions:
      - from: OPEN
        to: RESOLVED_SATISFIED
        trigger: "POST /quality-follow-ups/{id}/resolve-satisfied"
        actor: Customer | CustomerService
        preconditions:
          - "follow_up_status == OPEN"
        side_effects:
          - "QualityFollowUp.follow_up_status = RESOLVED_SATISFIED"
          - "QualityFollowUp.resolved_at = current_utc"
          - "QualityFollowUp.version += 1"
      - from: OPEN
        to: RESOLVED_REPEAT_REPAIR
        trigger: "POST /quality-follow-ups/{id}/resolve-repeat"
        actor: CustomerService
        preconditions:
          - "follow_up_status == OPEN"
          - "RepairOrder.repair_status == COMPLETED"
        side_effects:
          - "QualityFollowUp.follow_up_status = RESOLVED_REPEAT_REPAIR"
          - "QualityFollowUp.resolved_at = current_utc"
          - "QualityFollowUp.version += 1"
          - "RepairOrder.repair_status = ESCALATED_REPEAT"
      - from: OPEN
        to: ESCALATED
        trigger: "POST /quality-follow-ups/{id}/escalate"
        actor: CustomerService
        preconditions:
          - "follow_up_status == OPEN"
        side_effects:
          - "QualityFollowUp.follow_up_status = ESCALATED"
          - "QualityFollowUp.version += 1"

  # ---------------------------------------------------------------------------
  - entity: CoveragePlan
    initial_state: ACTIVE
    terminal_states: [EXPIRED, EXHAUSTED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system clock advance past expires_on"
        actor: system
        preconditions:
          - "coverage_status == ACTIVE"
          - "current_utc > expires_on"
        side_effects:
          - "CoveragePlan.coverage_status = EXPIRED"
          - "CoveragePlan.version += 1"
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system on CoverageEntitlement resolution when accidental_damage_incidents_used >= accidental_damage_incident_limit"
        actor: system
        preconditions:
          - "coverage_status == ACTIVE"
          - "accidental_damage_incidents_used >= accidental_damage_incident_limit"
        side_effects:
          - "CoveragePlan.coverage_status = EXHAUSTED"
          - "CoveragePlan.version += 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /coverage-plans/{id}/cancel"
        actor: Customer | CustomerService
        preconditions:
          - "coverage_status == ACTIVE"
        side_effects:
          - "CoveragePlan.coverage_status = CANCELLED"
          - "CoveragePlan.version += 1"

  # ---------------------------------------------------------------------------
  - entity: Customer
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: LOCKED
        trigger: "POST /customers/{id}/lock"
        actor: CustomerService
        preconditions:
          - "account_status == ACTIVE"
        side_effects:
          - "Customer.account_status = LOCKED"
          - "Customer.version += 1"
      - from: LOCKED
        to: ACTIVE
        trigger: "POST /customers/{id}/unlock"
        actor: CustomerService
        preconditions:
          - "account_status == LOCKED"
        side_effects:
          - "Customer.account_status = ACTIVE"
          - "Customer.version += 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /customers/{id}/close"
        actor: CustomerService
        preconditions:
          - "account_status == ACTIVE"
        side_effects:
          - "Customer.account_status = CLOSED"
          - "Customer.version += 1"

concurrency_rules:
  - rule_id: repair-order-create-stale-device
    parent_entity: Device
    write_endpoint: "POST /repair-orders"
    occ_field: "expected_device_version"
    description: |
      Creating a RepairOrder against a Device whose version has advanced since
      the client last observed it is rejected. This captures the case where
      another writer has just created a repair order or modified device state
      (e.g. activation lock toggled) and the current writer's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: appointment-create-stale-device
    parent_entity: Device
    write_endpoint: "POST /appointments"
    occ_field: "expected_device_version"
    description: |
      Creating an Appointment against a Device whose version has advanced since
      the client last observed it is rejected. Ensures the client sees the
      latest device state before booking a diagnostic slot.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: entitlement-resolve-stale-plan
    parent_entity: CoveragePlan
    write_endpoint: "POST /coverage-entitlements/{id}/resolve"
    occ_field: "expected_coverage_plan_version"
    description: |
      Resolving a CoverageEntitlement against a CoveragePlan whose version has
      advanced since the client last observed it is rejected. Prevents resolving
      against a plan whose incident count or expiration just changed.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  # ---------------------------------------------------------------------------
  - name: out_of_warranty_price
    trigger: "when CoverageEntitlement transitions to NOT_ENTITLED or PARTIALLY_ENTITLED, or when a repair order is created for a device with no active coverage"
    algorithm: tiered_pricing
    formula: |
      base_price = BASE_PRICE_BY_ISSUE[issue_category]
      age_years = (current_utc - device.purchase_date) / 365.25 days
      age_surcharge = 0
      if age_years > 2:
          age_surcharge = base_price * AGE_SURCHARGE_RATE
      if device.model_code in PREMIUM_MODELS:
          model_multiplier = PREMIUM_MODEL_MULTIPLIER
      else:
          model_multiplier = 1.0
      price = (base_price + age_surcharge) * model_multiplier
      price = round_half_up(price, 0)  # to nearest cent
    input_set: "RepairOrder.issue_category, Device.purchase_date, Device.model_code"
    constants:
      BASE_PRICE_BY_ISSUE:
        SCREEN_DAMAGE: 19900
        BATTERY: 6900
        WATER_DAMAGE: 39900
        SOFTWARE: 4900
        HARDWARE_OTHER: 29900
      AGE_SURCHARGE_RATE: 0.15
      PREMIUM_MODELS: ["IPHONE_15_PRO", "IPHONE_15_PRO_MAX", "MACBOOK_PRO_16"]
      PREMIUM_MODEL_MULTIPLIER: 1.25
    precision: "0 decimal places (whole cents), round_half_up"
    variants:
      - name: provisional_quote
        when: "RepairOrder created but CoverageEntitlement not yet resolved"
        difference: "Uses base_price only; age_surcharge and model_multiplier are not applied until final resolution."
      - name: final_quote
        when: "CoverageEntitlement resolved to NOT_ENTITLED or PARTIALLY_ENTITLED"
        difference: "Applies full formula including age_surcharge and model_multiplier."

  # ---------------------------------------------------------------------------
  - name: entitlement_price
    trigger: "when CoverageEntitlement transitions to ENTITLED"
    algorithm: threshold
    formula: |
      if is_accidental_damage:
          if coverage_plan.accidental_damage_incidents_used < coverage_plan.accidental_damage_incident_limit:
              price = coverage_plan.service_fee_cents
          else:
              price = out_of_warranty_price.final_quote
      else:
          price = 0
    input_set: "RepairOrder.is_accidental_damage, CoveragePlan.accidental_damage_incidents_used, CoveragePlan.accidental_damage_incident_limit, CoveragePlan.service_fee_cents"
    constants: {}
    precision: "0 decimal places (whole cents)"
    variants:
      - name: under_limit
        when: "accidental_damage_incidents_used < accidental_damage_incident_limit"
        difference: "Charges only service_fee_cents."
      - name: at_limit
        when: "accidental_damage_incidents_used >= accidental_damage_incident_limit"
        difference: "Falls back to full out-of-warranty price; no incident is consumed."

  # ---------------------------------------------------------------------------
  - name: part_availability_score
    trigger: "when RepairOrder is triaged to determine SAME_DAY_IN_STORE vs MAIL_IN_DEPOT vs WHOLE_UNIT_REPLACEMENT"
    algorithm: weighted_scoring
    formula: |
      # For each required part at current_location_id:
      #   part_score = min(available_quantity / required_quantity, 1.0)
      # total_score = sum(part_score * PART_WEIGHT[part_category]) / sum(PART_WEIGHT[part_category])
      # if total_score >= SAME_DAY_THRESHOLD: triage_mode = SAME_DAY_IN_STORE
      # elif whole_unit_replacement_available: triage_mode = WHOLE_UNIT_REPLACEMENT
      # else: triage_mode = MAIL_IN_DEPOT
    input_set: "PartInventory.available_quantity for each required part at current_location_id, Part.part_category"
    constants:
      PART_WEIGHT:
        DISPLAY: 3
        BATTERY: 2
        LOGIC_BOARD: 5
        CAMERA: 2
        ENCLOSURE: 1
        OTHER: 1
      SAME_DAY_THRESHOLD: 0.8
    precision: "2 decimal places"
    variants:
      - name: component_repair
        when: "triage_mode != WHOLE_UNIT_REPLACEMENT"
        difference: "Requires all parts available above threshold."
      - name: whole_unit_replacement
        when: "Part.is_whole_unit_replacement == true and PartInventory.express_replacement_quantity > 0"
        difference: "Bypasses component scoring; immediately selects WHOLE_UNIT_REPLACEMENT."

  # ---------------------------------------------------------------------------
  - name: appointment_slot_conflict
    trigger: "when creating or rescheduling an Appointment"
    algorithm: interval_merge
    formula: |
      # A slot [slot_start, slot_end) conflicts if:
      #   new.slot_start < existing.slot_end AND new.slot_end > existing.slot_start
      # Adjacent slots (new.slot_start == existing.slot_end) do NOT conflict.
      # Buffer: BUFFER_MINUTES minutes between back-to-back appointments for same technician.
      effective_start = new.slot_start - BUFFER_MINUTES
      effective_end = new.slot_end + BUFFER_MINUTES
      conflict = effective_start < existing.slot_end AND effective_end > existing.slot_start
    input_set: "Appointment.slot_start, Appointment.slot_end, Technician.technician_id"
    constants:
      BUFFER_MINUTES: 10
    precision: "ISO8601 datetime comparison"
    variants:
      - name: same_technician
        when: "appointments share the same technician_id"
        difference: "Applies buffer and overlap check."
      - name: different_technician
        when: "appointments have different technician_id at same location"
        difference: "No conflict; technicians work in parallel."

  # ---------------------------------------------------------------------------
  - name: repeat_repair_escalation_window
    trigger: "when POST /repair-orders/{id}/escalate-repeat is called"
    algorithm: chronological
    formula: |
      completed_at = RepairOrder.updated_at at the moment repair_status became COMPLETED
      days_since_completion = (current_utc - completed_at) / 86400 seconds
      eligible = days_since_completion <= REPEAT_WINDOW_DAYS
    input_set: "RepairOrder.updated_at, current_utc"
    constants:
      REPEAT_WINDOW_DAYS: 90
    precision: "whole days, floor"
    variants: []

  # ---------------------------------------------------------------------------
  - name: depot_routing_cost
    trigger: "when triage_mode = MAIL_IN_DEPOT and a RepairShipment is created"
    algorithm: constraint_propagation
    formula: |
      base_shipping = BASE_SHIPPING_CENTS
      if origin_location_id == depot_location_id:
          shipping_cost = 0
      else:
          distance_zone = DISTANCE_ZONE[origin_location_id][depot_location_id]
          shipping_cost = base_shipping * ZONE_MULTIPLIER[distance_zone]
      # Propagate to RepairOrder.quoted_price_cents if NOT_ENTITLED or PARTIALLY_ENTITLED
      if CoverageEntitlement.entitlement_status in [NOT_ENTITLED, PARTIALLY_ENTITLED]:
          RepairOrder.quoted_price_cents += shipping_cost
    input_set: "RepairOrder.origin_location_id, RepairOrder.current_location_id, CoverageEntitlement.entitlement_status"
    constants:
      BASE_SHIPPING_CENTS: 1500
      ZONE_MULTIPLIER:
        ZONE_1: 1.0
        ZONE_2: 1.5
        ZONE_3: 2.0
    precision: "0 decimal places (whole cents), round_half_up"
    variants:
      - name: entitled
        when: "CoverageEntitlement.entitlement_status == ENTITLED"
        difference: "Shipping cost absorbed by plan; not added to customer price."
      - name: not_entitled
        when: "CoverageEntitlement.entitlement_status in [NOT_ENTITLED, PARTIALLY_ENTITLED]"
        difference: "Shipping cost added to quoted_price_cents."

validations:
  # ---------------------------------------------------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted for the requested operation per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path parameter entity exists (left-to-right: customer, device, location, appointment, repair_order, etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "Target entity is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all"

  - priority: 5
    category: business_safety
    check: "Activation lock and ownership proof requirements are satisfied before repair starts"
    error_id: ERR_SECURITY_VERIFICATION_REQUIRED
    http_status: 422
    applies_to: ["POST /repair-orders/{id}/start-repair"]

  - priority: 6
    category: business_safety
    check: "Customer account is not LOCKED or CLOSED"
    error_id: ERR_ACCOUNT_LOCKED
    http_status: 403
    applies_to: ["POST /appointments", "POST /repair-orders", "POST /repair-orders/{id}/cancel"]

  - priority: 7
    category: business_constraint
    check: "Appointment slot does not conflict with existing appointments for the same technician (with buffer)"
    error_id: ERR_SLOT_CONFLICT
    http_status: 409
    applies_to: ["POST /appointments", "PUT /appointments/{id}/reschedule"]

  - priority: 8
    category: business_constraint
    check: "ServiceLocation is ACTIVE and supports the requested service type"
    error_id: ERR_LOCATION_UNAVAILABLE
    http_status: 422
    applies_to: ["POST /appointments", "POST /repair-orders"]

  - priority: 9
    category: business_referential
    check: "Device belongs to Customer; CoveragePlan belongs to Device; RepairOrder references valid Appointment"
    error_id: ERR_INVALID_REFERENCE
    http_status: 422
    applies_to: ["POST /appointments", "POST /repair-orders", "POST /coverage-entitlements"]

  - priority: 10
    category: business_fiscal
    check: "CoveragePlan is ACTIVE and has remaining accidental damage incidents (if applicable)"
    error_id: ERR_COVERAGE_EXHAUSTED
    http_status: 422
    applies_to: ["POST /coverage-entitlements/{id}/resolve"]

  - priority: 11
    category: business_temporal
    check: "Appointment slot is in the future and within booking window (<= 30 days ahead)"
    error_id: ERR_INVALID_SLOT_TIME
    http_status: 422
    applies_to: ["POST /appointments", "PUT /appointments/{id}/reschedule"]

  - priority: 12
    category: business_temporal
    check: "Repeat repair escalation is within 90 days of completion"
    error_id: ERR_REPEAT_WINDOW_EXPIRED
    http_status: 422
    applies_to: ["POST /repair-orders/{id}/escalate-repeat"]

  - priority: 13
    category: business_constraint
    check: "PartInventory has sufficient available_quantity for requested allocation"
    error_id: ERR_INSUFFICIENT_PARTS
    http_status: 422
    applies_to: ["POST /repair-orders/{id}/allocate-parts"]

  - priority: 14
    category: business_constraint
    check: "OCC expected_*_version matches current entity version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /repair-orders", "POST /appointments", "POST /coverage-entitlements/{id}/resolve"]

  - priority: 15
    category: business_safety
    check: "Data backup acknowledged and privacy wipe consent recorded before repair starts"
    error_id: ERR_DATA_BACKUP_REQUIRED
    http_status: 422
    applies_to: ["POST /repair-orders/{id}/start-repair"]

  - priority: 16
    category: business_constraint
    check: "RepairOrder is not already in a terminal state (COMPLETED, CANCELLED)"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: ["POST /repair-orders/{id}/allocate-parts", "POST /repair-orders/{id}/start-repair", "POST /repair-orders/{id}/cancel"]

endpoints:
  # ---------------------------------------------------------------------------
  - method: POST
    path: "/repair/_clock/set_current_utc"
    description: "Set the logical clock. Default startup time is 2026-09-01T00:00:00Z. Never falls back to wall-clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []

  # ---------------------------------------------------------------------------
  - method: POST
    path: "/repair/customers"
    description: "Register a new customer."
    roles: [Anonymous]
    code: 201
    input: [email, full_name, phone]
    output: Customer
    side_effects: []

  - method: GET
    path: "/repair/customers/{id}"
    description: "Get customer by id."
    roles: [Customer, CustomerService, PlatformAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: POST
    path: "/repair/customers/{id}/lock"
    description: "Lock a customer account (security hold)."
    roles: [CustomerService]
    code: 200
    input: []
    output: Customer
    side_effects: ["Customer.account_status = LOCKED", "Customer.version += 1"]

  - method: POST
    path: "/repair/customers/{id}/unlock"
    description: "Unlock a customer account."
    roles: [CustomerService]
    code: 200
    input: []
    output: Customer
    side_effects: ["Customer.account_status = ACTIVE", "Customer.version += 1"]

  # ---------------------------------------------------------------------------
  - method: POST
    path: "/repair/devices"
    description: "Register a device for a customer."
    roles: [Customer, CustomerService]
    code: 201
    input: [customer_id, serial_number, model_code, activation_lock_enabled, proof_of_purchase_on_file, purchase_date]
    output: Device
    side_effects: []

  - method: GET
    path: "/repair/devices/{id}"
    description: "Get device by id."
    roles: [Customer, Technician, CustomerService, PlatformAdmin]
    code: 200
    input: []
    output: Device
    side_effects: []

  - method: GET
    path: "/repair/devices"
    description: "List devices with optional filters."
    roles: [Customer, Technician, CustomerService, PlatformAdmin]
    code: 200
    input: ["customer_id?", "model_code?", "device_status?", "limit?", "offset?"]
    output: Device[]
    side_effects: []

  - method: GET
    path: "/repair/customers/{id}/devices"
    description: "List devices for a customer."
    roles: [Customer, CustomerService]
