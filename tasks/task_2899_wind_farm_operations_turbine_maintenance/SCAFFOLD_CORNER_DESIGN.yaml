            - "FaultEvent.${fe2}.cleared_at == 2026-08-01T05:30:00Z, downtime_hours == 1.5 and lost_energy_kwh == 3000.00, with contractual_exclusion_pinned true"
            - "Turbine.${t_id}.cumulative_lost_energy_kwh == 7000.00, the sum of BOTH events"
            - "Turbine.${t_id}.counted_downtime_hours_period == 2.0, the first event only, because the second is contractually excluded"
            - "Turbine.${t_id}.availability_state == ONLINE and active_fault_code == null after each successful reset"
            - "both events end in triage_state CLOSED"
      - name: lost_energy_rounds_half_up_at_the_second_decimal_place
        claim_type: precision
        grounds:
          - entities.FaultEvent.fields.lost_energy_kwh
          - state_machines.FaultEvent
        distinguishing_aspect: |
          A 45 second outage on a 1234 kWh/h turbine gives exactly 15.425 kWh, the one input that
          separates round_half_up from banker's rounding: the answer is 15.43, and downtime_hours
          itself must keep the un-rounded 0.0125 rather than being pre-rounded to two decimals.
        test_recipe:
          setup:
            - "one turbine whose expected_kwh_per_hour is 1234 and one non-excluded RESETTABLE rule"
          setup_api_calls:
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T01:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/farms"
              payload: { name: "Elk Basin", region_code: "MT-E", grid_operator_code: "NWMT", road_levy_pct: 2.5, community_levy_pct: 1.5, landowner_budget_cap_cents: 500000000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { farm_id: $.data.id }
            - call: "POST /wind-ops/turbine-models"
              payload: { model_code: "V150-4.2", rated_power_kw: 4200, hub_height_m: 105, rotor_diameter_m: 150, service_interval_hours: 4000, service_interval_tolerance_hours: 250, gearbox_lead_time_days: 210, blade_lead_time_days: 150, generator_lead_time_days: 120 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { model_id: $.data.id }
            - call: "POST /wind-ops/farms/${farm_id}/turbines"
              payload: { turbine_model_id: "${model_id}", asset_tag: "T-01", commissioning_date: "2024-03-15", expected_kwh_per_hour: 1234 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { t_id: $.data.id }
            - call: "POST /wind-ops/fault-code-rules"
              payload: { fault_code: "F-3001", severity_class: "RESETTABLE", max_remote_resets_per_24h: 2, requires_dispatch: false, contractual_exclusion: false }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/turbines/${t_id}/fault-events"
              payload: { fault_code: "F-3001", raised_at: "2026-08-01T01:00:00Z" }
              as: ControlRoomOperator
              as_user_id: "ops-1"
              captures: { fe_id: $.data.id }
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T01:00:45Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/fault-events/${fe_id}/triage"
              payload: { disposition: "REMOTE_RESET" }
              as: ControlRoomOperator
              as_user_id: "ops-1"
            - call: "POST /wind-ops/fault-events/${fe_id}/remote-reset"
              payload: { reset_outcome: "SUCCEEDED" }
              as: ControlRoomOperator
              as_user_id: "ops-1"
          trigger:
            - call: "POST /wind-ops/fault-events/${fe_id}/close"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "rel-1"
          assert:
            - "FaultEvent.${fe_id}.downtime_hours == 0.0125, that is 45 seconds over 3600, carried un-rounded"
            - "FaultEvent.${fe_id}.lost_energy_kwh == 15.43, because 0.0125 * 1234 == 15.425 and round_half_up goes UP; 15.42 is the banker's-rounding answer and is wrong"
            - "Turbine.${t_id}.cumulative_lost_energy_kwh == 15.43 and counted_downtime_hours_period == 0.0125"
      - name: settlement_run_is_rejected_when_every_turbine_on_the_farm_is_decommissioned
        claim_type: input_set_filtering
        grounds:
          - calculations.availability_and_liquidated_damages
          - validations[priority=77]
          - errors[ERR_NO_TURBINES_IN_SERVICE]
        distinguishing_aspect: |
          The availability turbine_set excludes DECOMMISSIONED rows, so a farm whose only turbine has
          been decommissioned has an empty denominator; the settle run must refuse with a dedicated
          422 rather than divide by zero, return 100 percent, or silently assess zero damages - and
          the agreement must stay ACTIVE so it can be settled once a turbine is back in service.
        test_recipe:
          setup:
            - "one farm whose single turbine is decommissioned, carrying one ACTIVE service agreement"
          setup_api_calls:
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/farms"
              payload: { name: "Elk Basin", region_code: "MT-E", grid_operator_code: "NWMT", road_levy_pct: 2.5, community_levy_pct: 1.5, landowner_budget_cap_cents: 500000000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { farm_id: $.data.id }
            - call: "POST /wind-ops/turbine-models"
              payload: { model_code: "V150-4.2", rated_power_kw: 4200, hub_height_m: 105, rotor_diameter_m: 150, service_interval_hours: 4000, service_interval_tolerance_hours: 250, gearbox_lead_time_days: 210, blade_lead_time_days: 150, generator_lead_time_days: 120 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { model_id: $.data.id }
            - call: "POST /wind-ops/farms/${farm_id}/turbines"
              payload: { turbine_model_id: "${model_id}", asset_tag: "T-01", commissioning_date: "2024-03-15", expected_kwh_per_hour: 2000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { t_id: $.data.id }
            - call: "POST /wind-ops/service-agreements"
              payload: { wind_farm_id: "${farm_id}", guaranteed_availability_pct: 97.0, availability_basis: "TIME_BASED", lda_rate_cents_per_pct_point: 500000, lda_cap_cents: 4000000, period_start_utc: "2026-07-01T00:00:00Z", period_end_utc: "2026-08-01T00:00:00Z" }
              as: CommercialManager
              as_user_id: "comm-1"
              captures: { sa_id: $.data.id }
            - call: "POST /wind-ops/turbines/${t_id}/decommission"
              payload: { decommission_reason: "site repowering" }
              as: SiteAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /wind-ops/service-agreements/${sa_id}/settle"
              payload: {}
              as: CommercialManager
              as_user_id: "comm-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response is HTTP 422 with ${err_id} == ERR_NO_TURBINES_IN_SERVICE"
            - "ServiceAgreement.${sa_id}.state is still ACTIVE, not IN_SETTLEMENT"
            - "ServiceAgreement.${sa_id}.time_based_availability_pct and energy_based_availability_pct are still null and assessed_lda_cents is still 0"
            - "WindFarm.${farm_id}.turbine_count == 0 and installed_capacity_kw == 0"
      - name: availability_variants_diverge_on_identical_period_data
        claim_type: correct_result
        grounds:
          - calculations.availability_and_liquidated_damages
        excluded_because:
          difficulty_instance: availability_time_basis_vs_energy_basis_diverge_on_identical_period_data
          rationale: |
            Variant divergence, variant selection by availability_basis and the resulting liquidated
            damages are all computed there against one shared data set, which is strictly stronger
            than a single-variant correct-result corner.
      - name: royalty_variants_diverge_on_identical_curtailment_data
        claim_type: correct_result
        grounds:
          - calculations.landowner_royalty_settlement
        excluded_because:
          difficulty_instance: landowner_royalty_metered_only_vs_deemed_inclusive_diverge_on_same_curtailment
          rationale: |
            The METERED_ONLY / DEEMED_INCLUSIVE split, including the compensable-curtailment filter
            that drives the delta, is walked there on one shared farm.
      - name: severity_band_constants_are_applied_at_their_declared_values
        claim_type: constants_applied
        grounds:
          - calculations.blade_damage_severity_score
        excluded_because:
          difficulty_instance: blade_severity_bands_pinned_at_forty_sixty_and_eighty_with_one_cent_neighbours
          rationale: |
            BAND_MEDIUM_MIN, BAND_HIGH_MIN and BAND_CRITICAL_MIN are exercised at and either side of
            each declared value there, together with the pinned per-term rounding order.
      - name: crane_tier_pricing_and_waterfall_shares_are_correct
        claim_type: correct_result
        grounds:
          - calculations.crane_cost_and_allocation
        excluded_because:
          difficulty_instance: crane_cost_tier_keyed_on_subtotal_then_waterfall_allocated_by_created_at
          rationale: |
            Tier boundaries, the credit percentage and the floor-based waterfall with its remainder
            going to the earliest created_at are all computed there from one mobilization.
      - name: priority_score_weighted_terms_sum_correctly
        claim_type: correct_result
        grounds:
          - calculations.work_order_priority_score
        excluded_because:
          difficulty_instance: work_order_priority_score_four_weighted_terms_with_nested_min_and_at_risk_branch
          rationale: |
            All four weighted terms, the nested min clamps and the at_risk_flag branch are evaluated
            there with pre-computed literals, so a separate weighted-scoring corner adds nothing.
      - name: service_due_thresholds_are_evaluated_at_their_boundaries
        claim_type: correct_result
        grounds:
          - calculations.scheduled_service_due
        excluded_because:
          difficulty_instance: service_due_gate_and_tolerance_breach_walk_four_exact_operating_hour_boundaries
          rationale: |
            The inclusive due gate, the strict tolerance breach and the PRE_SERVICE_WINDOW_HOURS
            creation gate are each walked at their exact boundary hour there.
  - section: validations
    instances:
