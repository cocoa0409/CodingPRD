  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers; depths 4 and 3)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: overdue_corrective_cascade_suspends_agreement
        grounds:
          - state_machines.CorrectiveAction.OPEN_to_ESCALATED
          - state_machines.LicenseAgreement.ACTIVE_to_SUSPENDED
          - state_machines.LicensedStore.OPERATING_to_SUSPENDED
          - state_machines.SupplyOrder.SUBMITTED_to_CANCELLED
        distinguishing_aspect: |
          Depth-4 chain from the sweep-overdue trigger: each link is caused by the previous one
          (CA ESCALATED -> agreement.breach_strikes hits 2 -> agreement SUSPENDED -> store
          SUSPENDED -> its SUBMITTED order CANCELLED), not by the sweep directly.
        test_recipe:
          setup:
            - "OPERATING store with one SUBMITTED supply order (product unit 500, qty 10, total 5000)"
            - "FAILED inspection (composite 69, two failing categories) creating two OPEN corrective actions due 14 days later"
            - "Clock advanced past both due_at values before the sweep"
