              captures: { error_id: $.data.error_id }
          assert:
            - "status 409, error_id == ERR_SURVEY_INVALID_STATE (survey PLANNED, not CONFIRMED)"
            - "SurveySession.${session_id}.status == SCHEDULED (unchanged)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: surveyor_session_half_open_overlap
        grounds:
          - errors.ERR_SURVEYOR_SESSION_OVERLAP
          - state_machines.SurveySession.SCHEDULED_to_SCHEDULED
        distinguishing_aspect: |
          Half-open [start_minute, end_minute) semantics on the Surveyor
          resource: 540-660 followed by 660-780 on the same date is legal
          (adjacency, end == start), while 630-720 overlaps and is rejected.
        test_recipe:
          setup:
            - "Base chain with PLANNED survey; surveyor holds session 540-660 on 2026-10-05."
          setup_api_calls:
            - *b_clock
            - *b_edition
            - *b_el_um1
            - *b_publish
            - *b_plan
            - *b_scope
            - *b_app
            - *b_submit
            - *b_begin
            - *b_ev1
            - *b_appv2
            - *b_ev2
            - *b_acc1
            - *b_acc2
            - *b_advance
            - *b_appv5
            - *b_survey
            - *b_surveyor
            - *b_session
          trigger:
            - call: "POST /accreditation/surveys/${survey_id}/sessions"
              payload: { surveyor_id: "${surveyor_id}", session_date: "2026-10-05", start_minute: 660, end_minute: 780, is_onsite: false }
              as: AccreditationOfficer
              captures: { session_adj: $.data.id }
            - call: "POST /accreditation/surveys/${survey_id}/sessions"
              payload: { surveyor_id: "${surveyor_id}", session_date: "2026-10-05", start_minute: 630, end_minute: 720, is_onsite: false }
              as: AccreditationOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "adjacent session (660-780) succeeds: SurveySession.${session_adj}.status == SCHEDULED"
            - "overlapping session (630-720): status 409, error_id == ERR_SURVEYOR_SESSION_OVERLAP"
            - "Survey.${survey_id}.scheduled_minutes == 240 (120 + 120; the rejected session added nothing)"

      - name: survey_date_range_closed_interval_overlap
        grounds:
          - errors.ERR_SURVEY_DATE_OVERLAP
          - state_machines.Survey.PLANNED_to_CONFIRMED
        distinguishing_aspect: |
          Closed-interval semantics on a different resource (the
          application's survey set): survey A occupies [2026-10-05,
          2026-10-09] INCLUSIVE, so a second non-CANCELLED survey starting
          exactly on 2026-10-09 overlaps (touching boundary counts) and its
          confirm fails; starting 2026-10-10 is clear. This differs from the
          session rule's half-open adjacency.
        test_recipe:
          setup:
            - "Base chain with survey A [2026-10-05, 2026-10-09] CONFIRMED; survey B created PLANNED."
          setup_api_calls:
            - *b_clock
            - *b_edition
            - *b_el_um1
            - *b_publish
            - *b_plan
            - *b_scope
            - *b_app
            - *b_submit
            - *b_begin
            - *b_ev1
            - *b_appv2
            - *b_ev2
            - *b_acc1
            - *b_acc2
            - *b_advance
            - *b_appv5
            - *b_survey
            - *b_surveyor
            - *b_session
            - *b_confirm
            - call: "GET /accreditation/applications/${app_id}"
              payload: {}
              as: AccreditationOfficer
              captures: { app_v8: $.data.version }
            - call: "POST /accreditation/applications/${app_id}/surveys"
              payload: { survey_type: "FULL", mode: "VIRTUAL", start_date: "2026-10-09", end_date: "2026-10-12", budgeted_surveyor_hours: 4, expected_application_version: "${app_v8}" }
              as: AccreditationOfficer
              captures: { survey_b: $.data.id }
            - call: "POST /accreditation/surveys/${survey_b}/sessions"
              payload: { surveyor_id: "${surveyor_id}", session_date: "2026-10-09", start_minute: 800, end_minute: 860, is_onsite: false }
              as: AccreditationOfficer
          trigger:
            - call: "POST /accreditation/surveys/${survey_b}/confirm"
              payload: {}
              as: AccreditationOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "status 409, error_id == ERR_SURVEY_DATE_OVERLAP (A's end 2026-10-09 == B's start 2026-10-09; closed intervals touch)"
            - "Survey.${survey_b}.status == PLANNED (unchanged)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: element_point_pool_conserved_across_void_refinalize
        grounds:
          - calculations.element_score
          - entities.ElementScore.fields.forfeited_points
        distinguishing_aspect: |
          Conserved quantity: the element point pool. Across the
          finalize-then-void-then-recreate-then-refinalize pair for UM-1,
          awarded_points + forfeited_points == 4.00 at every observation; the
          application's total_awarded_points returns to its pre-pair value
          after the compensating re-finalize.
        test_recipe:
          setup:
            - "Base chain in SCORING with UM-1 FINAL at 4.00 (no gaps) and all other elements FINAL; application total_awarded_points == 16.00 (4+2+4+2+4)."
          setup_api_calls:
            - *b_clock
            - *b_edition
            - *b_el_um1
            - *b_el_um2
            - *b_el_cr1
            - *b_el_mrr1
            - *b_el_qi1
            - *b_publish
            - *b_plan
            - *b_scope
            - *b_app
            - *b_submit
            - *b_begin
            - *b_ev1
            - *b_appv2
            - *b_ev2
            - *b_appv3
            - *b_ev3
            - *b_appv4
            - *b_ev4
            - *b_acc1
            - *b_acc2
            - *b_acc3
            - *b_acc4
            - *b_sample
            - *b_case1
            - *b_case2
            - *b_case3
            - *b_case4
            - *b_case5
            - *b_sample_submit
            - *b_sample_score
            - *b_advance
            - *b_appv5
            - *b_survey
            - *b_surveyor
            - *b_session
            - *b_confirm
            - *b_sess_complete
            - *b_survey_complete
            - *b_sc_um1
            - *b_sc_um2
            - *b_sc_cr1
            - *b_sc_mrr1
            - *b_sc_qi1
            - *b_fin_um1
            - *b_fin_um2
            - *b_fin_cr1
            - *b_fin_mrr1
            - *b_fin_qi1
            - call: "POST /accreditation/applications/${app_id}/outcome"
              payload: {}
              as: AccreditationOfficer
          trigger:
            - call: "GET /accreditation/applications/${app_id}"
              payload: {}
              as: AccreditationOfficer
              captures: { awarded_before: $.data.total_awarded_points }
          assert:
            - "ElementScore.${score_um1}.awarded_points + ElementScore.${score_um1}.forfeited_points == 4.00 (4.00 + 0.00)"
            - "AccreditationApplication.${app_id}.total_awarded_points == 16.00 and total_forfeited_points == 0.00 (4+2+4+2+4 = 16 == sum of all max_points: pool conserved with zero drift)"
            - "AccreditationOutcome status == ACCREDITED (composite 100.00 + bonus... compute: ratios all 1.0000 -> base 1.00 -> composite round(100 + measure_bonus,2); with no measures/consumer data measure_bonus == 0.00 -> composite == 100.00)"

      - name: survey_active_minutes_conserved_across_cancel_replacement
        grounds:
          - calculations.survey_minutes_reconciliation
          - entities.Survey.fields.active_minutes
        distinguishing_aspect: |
          Conserved quantity: Survey.active_minutes (= scheduled + completed
          minutes). The forward action (cancel the 120-minute session) drops
          active_minutes 480 -> 360; the compensating action (schedule an
          equal-duration replacement) restores exactly 480; cancelled_minutes
          accumulates +120 and is NOT part of the conserved quantity.
        test_recipe:
          setup:
            - "Base chain with PLANNED survey, budgeted 8 hours; sessions S1 540-660, S2 660-780, S3 780-900, S4 900-1020 on 2026-10-05 (active 480)."
          setup_api_calls:
            - *b_clock
            - *b_edition
            - *b_el_um1
            - *b_publish
            - *b_plan
            - *b_scope
            - *b_app
            - *b_submit
            - *b_begin
            - *b_ev1
            - *b_appv2
            - *b_ev2
            - *b_acc1
            - *b_acc2
            - *b_advance
            - *b_appv5
            - *b_survey
            - *b_surveyor
            - *b_session
            - call: "POST /accreditation/surveys/${survey_id}/sessions"
              payload: { surveyor_id: "${surveyor_id}", session_date: "2026-10-05", start_minute: 660, end_minute: 780, is_onsite: false }
              as: AccreditationOfficer
            - call: "POST /accreditation/surveys/${survey_id}/sessions"
              payload: { surveyor_id: "${surveyor_id}", session_date: "2026-10-05", start_minute: 780, end_minute: 900, is_onsite: false }
              as: AccreditationOfficer
            - call: "POST /accreditation/surveys/${survey_id}/sessions"
              payload: { surveyor_id: "${surveyor_id}", session_date: "2026-10-05", start_minute: 900, end_minute: 1020, is_onsite: false }
              as: AccreditationOfficer
          trigger:
            - call: "POST /accreditation/survey-sessions/${session_id}/cancel"
              payload: {}
              as: AccreditationOfficer
            - call: "GET /accreditation/surveys/${survey_id}"
              payload: {}
              as: AccreditationOfficer
              captures: { mid_active: $.data.active_minutes, mid_cancelled: $.data.cancelled_minutes }
            - call: "POST /accreditation/surveys/${survey_id}/sessions"
              payload: { surveyor_id: "${surveyor_id}", session_date: "2026-10-06", start_minute: 540, end_minute: 660, is_onsite: false }
              as: AccreditationOfficer
          assert:
            - "after cancel: active_minutes == 360 (480 - 120) and cancelled_minutes == 120"
