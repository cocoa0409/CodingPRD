            - call: "POST /lab/engineers"
              payload: { name: "Ann Second", territory_code: "CA-NORTH", skills: ["BREAK_FIX"] }
              as: ServiceDispatcher
              captures: { e2: $.data.id }
            - call: "POST /lab/instruments"
              payload: { account_id: "${a_id}", model: "SEQ-5000", serial_number: "OWN-1", placement_type: "CAPITAL" }
              as: AccountManager
              captures: { i_id: $.data.id }
            - call: "POST /lab/instruments/${i_id}/install"
              payload: {}
              as: ServiceDispatcher
            - call: "POST /lab/service-requests"
              payload: { instrument_id: "${i_id}", request_type: "BREAK_FIX", severity: "LOW" }
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { sr: $.data.id }
            - call: "POST /lab/service-requests/${sr}/dispatch"
              payload: {}
              as: ServiceDispatcher
              captures: { assigned: $.data.engineer_id }
          trigger:
            - call: "POST /lab/service-requests/${sr}/resolve"
              payload: { hours_on_site: 1, parts_cost_cents: 0 }
              as: FieldEngineer
              as_user_id: "${e2}"
              captures: { err: $.data.error_id }
          assert:
            - "dispatch assigned engineer_id == ${e1} (both at 0 open tickets; created_at tie-break picks the first-created engineer)"
            - "resolve by the unassigned engineer fails with error_id == ERR_FORBIDDEN (HTTP 403)"
            - "ServiceRequest remains DISPATCHED"

  - section: cross_cutting_layers
    instances:
      - name: contract_renew_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[contract-renew-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on the renew endpoint: in RENEWAL_DUE, a renew carrying expected_contract_version one behind the observed version is rejected 412 ERR_STALE_VERSION and end_date does not move."
        test_recipe:
          setup: ["GOLD contract (2026-09-01 to 2027-09-01) on an installed instrument; clock at 2027-08-15T00:00:00Z so the contract is RENEWAL_DUE; client holds version 1."]
          setup_api_calls:
            - call: "POST /lab/accounts"
              payload: { name: "OCC Lab", segment: "PHARMA", priority_class: "STANDARD", territory_code: "CA-NORTH" }
              as: AccountManager
              captures: { a_id: $.data.id }
            - call: "POST /lab/engineers"
              payload: { name: "Igor Install", territory_code: "CA-NORTH", skills: ["INSTALL"] }
              as: ServiceDispatcher
            - call: "POST /lab/instruments"
              payload: { account_id: "${a_id}", model: "SEQ-5000", serial_number: "OCC-1", placement_type: "CAPITAL" }
              as: AccountManager
              captures: { i_id: $.data.id }
            - call: "POST /lab/instruments/${i_id}/install"
              payload: {}
              as: ServiceDispatcher
            - call: "POST /lab/service-contracts"
              payload: { instrument_id: "${i_id}", tier: "GOLD", start_date: "2026-09-01T00:00:00Z", end_date: "2027-09-01T00:00:00Z" }
              as: AccountManager
              captures: { c_id: $.data.id, cv: $.data.version }
            - call: "POST /lab/_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /lab/service-contracts/${c_id}/renew"
              payload: { expected_contract_version: "${cv} - 1" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "renew fails with error_id == ERR_STALE_VERSION (HTTP 412)"
            - "ServiceContract.end_date remains 2027-09-01T00:00:00Z and renewal_count == 0"

      - name: contract_renew_occ_success_bumps_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[contract-renew-stale-version]"]
        excluded_because:
          difficulty_instance: service_contract_renewal_cycle
          rationale: "The success-path renew with the correct ${cv} (version 1 -> 2, end_date +12 months) is asserted in that cyclic-machine instance."

      - name: dispatch_selector_tie_break_created_at
        claim_type: selector_policy
        grounds: ["state_machines.ServiceRequest.OPEN_to_DISPATCHED", "entities.Engineer.fields.open_ticket_count"]
        distinguishing_aspect: "Selector determinism: two equally eligible engineers dispatch in rank order — first ticket ties at 0 open and goes to the first-created engineer (created_at tie-break), second goes to the engineer with fewer open tickets."
        test_recipe:
          setup: ["Two ACTIVE BREAK_FIX engineers in CA-NORTH created in order (first, second); two OPEN BREAK_FIX requests."]
          setup_api_calls:
            - call: "POST /lab/accounts"
              payload: { name: "Selector Lab", segment: "PHARMA", priority_class: "STANDARD", territory_code: "CA-NORTH" }
              as: AccountManager
              captures: { a_id: $.data.id }
            - call: "POST /lab/engineers"
              payload: { name: "Eng First", territory_code: "CA-NORTH", skills: ["INSTALL", "BREAK_FIX"] }
              as: ServiceDispatcher
              captures: { e1: $.data.id }
            - call: "POST /lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:01Z" }
              as: PlatformAdmin
            - call: "POST /lab/engineers"
              payload: { name: "Eng Second", territory_code: "CA-NORTH", skills: ["BREAK_FIX"] }
              as: ServiceDispatcher
              captures: { e2: $.data.id }
            - call: "POST /lab/instruments"
              payload: { account_id: "${a_id}", model: "SEQ-5000", serial_number: "SEL-1", placement_type: "CAPITAL" }
              as: AccountManager
              captures: { i_id: $.data.id }
            - call: "POST /lab/instruments/${i_id}/install"
              payload: {}
              as: ServiceDispatcher
            - call: "POST /lab/service-requests"
              payload: { instrument_id: "${i_id}", request_type: "BREAK_FIX", severity: "LOW" }
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { sr1: $.data.id }
            - call: "POST /lab/service-requests"
              payload: { instrument_id: "${i_id}", request_type: "BREAK_FIX", severity: "LOW" }
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { sr2: $.data.id }
          trigger:
            - call: "POST /lab/service-requests/${sr1}/dispatch"
              payload: {}
              as: ServiceDispatcher
              captures: { pick1: $.data.engineer_id }
            - call: "POST /lab/service-requests/${sr2}/dispatch"
              payload: {}
              as: ServiceDispatcher
              captures: { pick2: $.data.engineer_id }
          assert:
            - "first dispatch picks Engineer.${e1} (open_ticket_count tie 0-0 broken by created_at ASC)"
            - "second dispatch picks Engineer.${e2} (0 open beats 1 open)"

      - name: dispatch_five_tickets_capacity_rejected
        claim_type: rate_threshold_triggers
        grounds: ["validations[priority=7]", "errors[ERR_ENGINEER_CAPACITY_EXCEEDED]"]
        distinguishing_aspect: "Instantaneous capacity threshold: one eligible engineer accepts exactly 4 dispatches on the same UTC day; the 5th dispatch fails 422 ERR_ENGINEER_CAPACITY_EXCEEDED while the eligible set is non-empty."
        test_recipe:
          setup: ["One BREAK_FIX engineer in CA-NORTH; one installed instrument; five OPEN BREAK_FIX requests (MEDIUM, so no operational_status interference)."]
          setup_api_calls:
            - call: "POST /lab/accounts"
              payload: { name: "Capacity Lab", segment: "PHARMA", priority_class: "STANDARD", territory_code: "CA-NORTH" }
              as: AccountManager
              captures: { a_id: $.data.id }
            - call: "POST /lab/engineers"
              payload: { name: "Solo Fixer", territory_code: "CA-NORTH", skills: ["INSTALL", "BREAK_FIX"] }
              as: ServiceDispatcher
            - call: "POST /lab/instruments"
              payload: { account_id: "${a_id}", model: "SEQ-5000", serial_number: "CAP-1", placement_type: "CAPITAL" }
              as: AccountManager
              captures: { i_id: $.data.id }
            - call: "POST /lab/instruments/${i_id}/install"
              payload: {}
              as: ServiceDispatcher
            - call: "POST /lab/service-requests"
              payload: { instrument_id: "${i_id}", request_type: "BREAK_FIX", severity: "MEDIUM" }
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { r1: $.data.id }
            - call: "POST /lab/service-requests"
              payload: { instrument_id: "${i_id}", request_type: "BREAK_FIX", severity: "MEDIUM" }
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { r2: $.data.id }
            - call: "POST /lab/service-requests"
              payload: { instrument_id: "${i_id}", request_type: "BREAK_FIX", severity: "MEDIUM" }
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { r3: $.data.id }
            - call: "POST /lab/service-requests"
              payload: { instrument_id: "${i_id}", request_type: "BREAK_FIX", severity: "MEDIUM" }
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { r4: $.data.id }
            - call: "POST /lab/service-requests"
              payload: { instrument_id: "${i_id}", request_type: "BREAK_FIX", severity: "MEDIUM" }
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { r5: $.data.id }
            - call: "POST /lab/service-requests/${r1}/dispatch"
              payload: {}
              as: ServiceDispatcher
            - call: "POST /lab/service-requests/${r2}/dispatch"
              payload: {}
              as: ServiceDispatcher
            - call: "POST /lab/service-requests/${r3}/dispatch"
              payload: {}
              as: ServiceDispatcher
            - call: "POST /lab/service-requests/${r4}/dispatch"
              payload: {}
              as: ServiceDispatcher
          trigger:
            - call: "POST /lab/service-requests/${r5}/dispatch"
              payload: {}
              as: ServiceDispatcher
              captures: { err: $.data.error_id }
          assert:
            - "first four dispatches succeed (all to the sole eligible engineer)"
            - "fifth dispatch fails with error_id == ERR_ENGINEER_CAPACITY_EXCEEDED (HTTP 422)"
            - "ServiceRequest.${r5} remains OPEN with engineer_id null"

      - name: dispatch_no_eligible_engineer_rejected
        claim_type: selector_policy
        grounds: ["validations[priority=7]", "errors[ERR_NO_ELIGIBLE_ENGINEER]"]
        distinguishing_aspect: "Empty-pool fallback: the account territory (TX-SOUTH) has an INSTALL engineer (so install succeeded) but no BREAK_FIX-skilled engineer, so dispatch fails 422 ERR_NO_ELIGIBLE_ENGINEER — distinct from the capacity failure."
        test_recipe:
          setup: ["Account in TX-SOUTH; INSTALL-only engineer in TX-SOUTH; installed instrument; OPEN BREAK_FIX request."]
          setup_api_calls:
            - call: "POST /lab/accounts"
