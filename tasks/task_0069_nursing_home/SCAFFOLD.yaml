scenario: |
  Nursing home management system: elderly profile with personal information, medical history,
  allergy and dietary requirements, emergency contacts, advance-directive records, and
  admission and discharge history; bed assignment with room and bed inventory, bed-type
  classification (single/double/multi-bed/intensive-care), bed-status (available/occupied/
  maintenance) management, bed-transfer workflow, and waitlist queue; care-level assessment
  with assessment instrument (ADL/cognitive/medical-condition), multi-dimension scoring,
  care-level classification, periodic re-assessment, and care-level-change approval; care
  plan with personalized plan based on care level, daily care task list (bathing/feeding/
  turning/medication), task-execution recording, plan-adjustment workflow, and plan-review
  cycle; medication management with prescription entry, dispensing schedule, administration
  recording, drug-interaction check, refusal-and-omission handling, controlled-substance
  separate management, and medication-error reporting; family visit reservation with
  visit-time slot booking, visitor identity verification, health-screening (epidemic-period
  rules), visit-record archiving, and visit-restriction enforcement; fee billing (care fee
  + meal fee + medical fee) with itemized billing rules, package and a-la-carte combination,
  government subsidy and insurance offset, deposit deduction, periodic billing cycle, refund
  and adjustment handling, and family-side payment workflow; event-driven synchronization
  with payment, IM, hospital, and government-subsidy systems; audit logging for care plans
  and medication records.

domain_name: "nursing-home"
api_prefix: "/elders"

complexity_profile:
  primary_archetype: "compliance_audit"
  secondary_archetype: "pricing_engine"
  complexity_layers:
    - "dual_variant_calculation"
    - "cascading_side_effects"
    - "rate_threshold_triggers"
    - "ops_run_checkpoint"
    - "idempotency"
    - "scheduled_deferred_actions"
    - "derived_field_reconciliation"

  entity_topology: "hybrid"
  state_machine_shape: "branching"
  relationship_patterns:
    - "one_to_many"
    - "many_to_many"
    - "cross_aggregate"
    - "polymorphic"

  role_model: "segregation_of_duties"
  consistency_model: "immediate"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entities
# =============================================================================
entities:
  - name: Elder
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Elder's legal full name"
      - name: date_of_birth
        type: string
        source: input
        description: "ISO date (YYYY-MM-DD)"
      - name: gender
        type: enum
        source: input
        description: "M | F | OTHER"
        constraints: "M | F | OTHER"
      - name: id_card_number
        type: string
        source: input
        description: "Government ID; unique across active elders"
        constraints: "unique among Elder.status != DISCHARGED"
      - name: medical_history
        type: array
        source: input
        description: "Array of {condition: string, since: ISO date}"
      - name: allergies
        type: array
        source: input
        description: "Array of allergen strings, used by medication interaction check"
      - name: dietary_requirements
        type: array
        source: input
        description: "Array of dietary tags (e.g. LOW_SODIUM, DIABETIC, PUREE)"
      - name: emergency_contacts
        type: array
        source: input
        description: "Array of {name, relation, phone}; at least 1 required for admission"
        constraints: "len >= 1 at admission"
      - name: advance_directive
        type: object
        source: input
        description: "{dnr: bool, dni: bool, organ_donation: bool, signed_at: datetime|null}"
        default: "{dnr:false,dni:false,organ_donation:false,signed_at:null}"
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state of the elder"
        constraints: "PENDING_ADMISSION | ADMITTED | ON_LEAVE | DISCHARGED"
        default: "PENDING_ADMISSION"
      - name: admission_history
        type: array
        source: system
        description: "Append-only [{admitted_at, discharged_at|null, bed_id, reason}]"
      - name: current_bed_id
        type: string
        source: computed
        description: "FK to Bed.id where status == ADMITTED; null otherwise"
        default: null
      - name: current_care_level
        type: enum
        source: computed
        description: "Derived from latest approved CareAssessment.classification"
        constraints: "L1 | L2 | L3 | L4 | INTENSIVE | null (before first approval)"
        default: null
      - name: deposit_balance_cents
        type: integer
        source: computed
        description: "Running deposit balance (positive = available, can go negative after deduction failure)"
        default: 0
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: "Aggregate unpaid Bill.amount_due_cents across non-PAID bills"
        default: 0

  - name: Room
    parent: null
    common_fields: true
    fields:
      - name: room_number
        type: string
        source: input
        description: "Floor-prefixed room number, unique"
        constraints: "unique"
      - name: floor
        type: integer
        source: input
        description: "Floor number, >= 1"
      - name: room_type
        type: enum
        source: input
        description: "Permitted bed types may be placed in this room"
        constraints: "STANDARD | INTENSIVE_CARE"

  - name: Bed
    parent: Room
    common_fields: true
    fields:
      - name: room_id
        type: string
        source: input
        description: "FK to Room.id"
      - name: bed_code
        type: string
        source: input
        description: "Identifier within room (e.g. A, B, 1, 2); unique within room_id"
        constraints: "unique within room_id"
      - name: bed_type
        type: enum
        source: input
        description: "Bed classification"
        constraints: "SINGLE | DOUBLE | MULTI | INTENSIVE_CARE"
      - name: monthly_bed_fee_cents
        type: integer
        source: input
        description: "Base monthly bed fee; integer cents"
      - name: status
        type: enum
        source: computed
        description: "Inventory state"
        constraints: "AVAILABLE | OCCUPIED | MAINTENANCE"
        default: "AVAILABLE"
      - name: current_elder_id
        type: string
        source: computed
        description: "FK to Elder.id when status==OCCUPIED; null otherwise"
        default: null

  - name: WaitlistEntry
    parent: null
    common_fields: false
    fields:
      - name: elder_id
        type: string
        source: input
        description: "FK to Elder (must be PENDING_ADMISSION)"
      - name: requested_bed_type
        type: enum
        source: input
        description: "Desired bed type"
        constraints: "SINGLE | DOUBLE | MULTI | INTENSIVE_CARE"
      - name: priority_score
        type: integer
        source: computed
        description: "Computed by waitlist_priority calculation; higher = served first"
      - name: queued_at
        type: datetime
        source: system
        description: "ISO8601 enqueue time; tie-break (earlier wins)"
      - name: status
        type: enum
        source: computed
        description: "Queue state"
        constraints: "QUEUED | OFFERED | FULFILLED | CANCELLED"
        default: "QUEUED"
      - name: offered_bed_id
        type: string
        source: computed
        description: "FK to Bed when status==OFFERED; null otherwise"
        default: null

  - name: CareAssessment
    parent: Elder
    common_fields: true
    fields:
      - name: elder_id
        type: string
        source: input
        description: "FK to Elder"
      - name: adl_score
        type: integer
        source: input
        description: "Activities of Daily Living score, 0-100 (higher = more independent)"
        constraints: "0..100"
      - name: cognitive_score
        type: integer
        source: input
        description: "Cognitive function score, 0-30"
        constraints: "0..30"
      - name: medical_condition_score
        type: integer
        source: input
        description: "Medical condition severity, 0-50 (higher = more severe)"
        constraints: "0..50"
      - name: composite_score
        type: number
        source: computed
        description: "Weighted composite via care_level_classification calculation; 2 decimals"
      - name: classification
        type: enum
        source: computed
        description: "Care level derived from composite_score thresholds"
        constraints: "L1 | L2 | L3 | L4 | INTENSIVE"
      - name: status
        type: enum
        source: computed
        description: "Approval workflow state"
        constraints: "DRAFT | PENDING_APPROVAL | APPROVED | REJECTED"
        default: "DRAFT"
      - name: assessor_id
        type: string
        source: input
        description: "X-User-ID of the Nurse who drafted the assessment"
      - name: approver_id
        type: string
        source: system
        description: "X-User-ID of the Supervisor who approved; null until approval"
        default: null
      - name: effective_from
        type: datetime
        source: system
        description: "Set on APPROVE; controls Elder.current_care_level update"
        default: null
      - name: due_for_reassessment_at
        type: datetime
        source: computed
        description: "effective_from + 90 days if approved; null otherwise"
        default: null

  - name: CarePlan
    parent: Elder
    common_fields: true
    fields:
      - name: elder_id
        type: string
        source: input
        description: "FK to Elder"
      - name: based_on_assessment_id
        type: string
        source: input
        description: "FK to a CareAssessment with status==APPROVED at creation time"
      - name: care_level_snapshot
        type: enum
        source: system
        description: "Frozen CareAssessment.classification at the moment the plan was activated"
        constraints: "L1 | L2 | L3 | L4 | INTENSIVE"
      - name: status
        type: enum
        source: computed
        description: "Plan lifecycle"
        constraints: "DRAFT | ACTIVE | UNDER_REVIEW | SUPERSEDED | ARCHIVED"
        default: "DRAFT"
      - name: daily_tasks
        type: array
        source: input
        description: "Array of {task_type: enum BATHING|FEEDING|TURNING|MEDICATION|VITALS, frequency_per_day: int>=1, notes: string}"
      - name: review_cycle_days
        type: integer
        source: computed
        description: "Derived from care_level_snapshot via care_plan_review_cycle calculation"
      - name: next_review_due_at
        type: datetime
        source: computed
        description: "activated_at + review_cycle_days; updated on review completion"
        default: null
      - name: activated_at
        type: datetime
        source: system
        description: "Timestamp when plan moved DRAFT→ACTIVE"
        default: null

  - name: CareTaskExecution
    parent: CarePlan
    common_fields: false
    fields:
      - name: care_plan_id
        type: string
        source: input
        description: "FK to CarePlan"
      - name: task_type
        type: enum
        source: input
        description: "BATHING | FEEDING | TURNING | MEDICATION | VITALS"
      - name: scheduled_for
        type: datetime
        source: input
        description: "When the task was scheduled (date-time)"
      - name: executed_at
        type: datetime
        source: system
        description: "When the caregiver recorded execution"
      - name: caregiver_id
        type: string
        source: input
        description: "X-User-ID of Caregiver performing the task"
      - name: outcome
        type: enum
        source: input
        description: "Execution outcome"
        constraints: "COMPLETED | REFUSED | OMITTED"
      - name: notes
        type: string
        source: input
        description: "Free-form notes (required when outcome != COMPLETED)"

  - name: Prescription
    parent: Elder
    common_fields: true
    fields:
      - name: elder_id
        type: string
        source: input
        description: "FK to Elder (must be ADMITTED)"
      - name: drug_code
        type: string
        source: input
        description: "Internal drug code"
      - name: drug_name
        type: string
        source: input
        description: "Display name"
      - name: is_controlled_substance
        type: boolean
        source: input
        description: "If true, witness_id required on each administration"
      - name: contraindicated_allergens
        type: array
        source: input
        description: "Array of allergen tags; cross-checked against Elder.allergies"
      - name: interacts_with_drug_codes
        type: array
        source: input
        description: "Array of drug_codes that conflict with this prescription"
      - name: dose_mg
        type: number
        source: input
        description: "Per-administration dose in milligrams"
      - name: frequency_per_day
        type: integer
        source: input
        description: ">=1; determines dispensing schedule slots"
      - name: prescriber_id
        type: string
        source: input
        description: "X-User-ID of the Physician issuing prescription"
      - name: status
        type: enum
        source: computed
        description: "Prescription lifecycle"
        constraints: "PENDING_REVIEW | ACTIVE | SUSPENDED | DISCONTINUED"
        default: "PENDING_REVIEW"
      - name: starts_on
        type: string
        source: input
        description: "ISO date YYYY-MM-DD when administration begins"
      - name: ends_on
        type: string
        source: input
        description: "ISO date YYYY-MM-DD inclusive end; must be >= starts_on"

  - name: MedicationAdministration
    parent: Prescription
    common_fields: false
    fields:
      - name: prescription_id
        type: string
        source: input
        description: "FK to Prescription (must be ACTIVE)"
      - name: scheduled_slot_at
        type: datetime
        source: input
        description: "Slot timestamp from the dispensing schedule"
      - name: administered_at
        type: datetime
        source: system
        description: "Time the nurse recorded administration"
      - name: nurse_id
        type: string
        source: input
        description: "X-User-ID of the Nurse administering; MUST differ from Prescription.prescriber_id"
      - name: witness_id
        type: string
        source: input
        description: "X-User-ID of a second Nurse witness; required iff Prescription.is_controlled_substance"
      - name: outcome
        type: enum
        source: input
        description: "Administration outcome"
        constraints: "ADMINISTERED | REFUSED | OMITTED | ERROR"
      - name: error_report_id
        type: string
        source: computed
        description: "Auto-created MedicationErrorReport.id when outcome==ERROR"
        default: null

  - name: MedicationErrorReport
    parent: null
    common_fields: false
    fields:
      - name: administration_id
        type: string
        source: system
        description: "FK to the originating MedicationAdministration"
      - name: prescription_id
        type: string
        source: system
        description: "FK to Prescription"
      - name: elder_id
        type: string
        source: system
        description: "FK to Elder"
      - name: error_type
        type: enum
        source: input
        description: "Category of error"
        constraints: "WRONG_DRUG | WRONG_DOSE | WRONG_TIME | INTERACTION | OTHER"
      - name: severity
        type: enum
        source: input
        description: "Severity classification"
        constraints: "MINOR | MODERATE | SEVERE"
      - name: description
        type: string
        source: input
        description: "Free text description"

  - name: VisitReservation
    parent: Elder
    common_fields: true
    fields:
      - name: elder_id
        type: string
        source: input
        description: "FK to Elder (must be ADMITTED)"
      - name: visitor_name
        type: string
        source: input
        description: "Visitor's full name"
      - name: visitor_id_number
        type: string
        source: input
        description: "Visitor government ID; required for verification on check-in"
      - name: visitor_relation
        type: enum
        source: input
        description: "Relation to elder"
        constraints: "SPOUSE | CHILD | SIBLING | OTHER_FAMILY | FRIEND | OTHER"
      - name: slot_start_at
        type: datetime
        source: input
        description: "Reservation start time"
      - name: slot_end_at
        type: datetime
        source: input
        description: "Reservation end time; (slot_end_at - slot_start_at) must be in [15min, 120min]"
      - name: status
        type: enum
        source: computed
        description: "Reservation state"
        constraints: "RESERVED | CHECKED_IN | COMPLETED | CANCELLED | DENIED"
        default: "RESERVED"
      - name: health_screening
        type: object
        source: input
        description: "{temperature_c: number, symptoms: array<string>, recent_exposure: bool}"
      - name: epidemic_mode_at_reservation
        type: enum
        source: system
        description: "Snapshot of system EpidemicConfig.mode at the moment of reservation"
        constraints: "NORMAL | RESTRICTED | LOCKDOWN"
      - name: check_in_at
        type: datetime
        source: system
        description: "Set on CHECK_IN"
        default: null
      - name: check_out_at
        type: datetime
        source: system
        description: "Set on COMPLETE"
        default: null

  - name: Bill
    parent: Elder
    common_fields: true
    fields:
      - name: elder_id
        type: string
        source: input
        description: "FK to Elder"
      - name: cycle_start_date
        type: string
        source: input
        description: "ISO date YYYY-MM-DD (inclusive)"
      - name: cycle_end_date
        type: string
        source: input
        description: "ISO date YYYY-MM-DD (inclusive); same calendar month as cycle_start_date"
      - name: billing_mode
        type: enum
        source: input
        description: "PACKAGE = bundled care+meal at care-level rate; A_LA_CARTE = sum of itemized line items"
        constraints: "PACKAGE | A_LA_CARTE"
      - name: line_items
        type: array
        source: computed
        description: "Array of {category: CARE|MEAL|MEDICAL|BED, description, amount_cents}; built by billing calc"
      - name: subtotal_cents
        type: integer
        source: computed
        description: "Sum of line_items.amount_cents (integer cents)"
      - name: government_subsidy_cents
        type: integer
        source: computed
        description: "Computed by government_subsidy calculation; capped by GOV_SUBSIDY_MONTHLY_CAP"
      - name: insurance_offset_cents
        type: integer
        source: computed
        description: "Computed by insurance_offset calculation (after subsidy, before deposit)"
      - name: deposit_applied_cents
        type: integer
        source: computed
        description: "Amount drawn from Elder.deposit_balance_cents on finalize"
      - name: amount_due_cents
        type: integer
        source: computed
        description: "max(0, subtotal - subsidy - insurance - deposit_applied)"
      - name: status
        type: enum
        source: computed
        description: "Bill lifecycle"
        constraints: "DRAFT | FINALIZED | PAID | REFUNDED | ADJUSTED"
        default: "DRAFT"
      - name: finalized_at
        type: datetime
        source: system
        description: "Set on DRAFT->FINALIZED"
        default: null
      - name: paid_at
        type: datetime
        source: system
        description: "Set on FINALIZED->PAID"
        default: null
      - name: external_payment_ref
        type: string
        source: system
        description: "Idempotency key from POST /bills/{id}/pay; collisions yield ERR_DUPLICATE_PAYMENT"
        default: null

  - name: EpidemicConfig
    parent: null
    common_fields: true
    fields:
      - name: mode
        type: enum
        source: input
        description: "Current epidemic posture; updated by Admin only"
        constraints: "NORMAL | RESTRICTED | LOCKDOWN"
        default: "NORMAL"
      - name: max_temperature_c
        type: number
        source: input
        description: "Health-screening temperature threshold (>= triggers DENIED)"
        default: 37.3
      - name: max_visitors_per_day
        type: integer
        source: input
        description: "Per-elder max CHECKED_IN+RESERVED count within a calendar day"
        default: 2

  - name: AuditLog
    parent: null
    common_fields: false
    fields:
      - name: actor_role
        type: enum
        source: system
        description: "X-User-Role at time of action"
        constraints: "Admin | Supervisor | Physician | Nurse | Caregiver | Family | Finance | SystemSync"
      - name: actor_id
        type: string
        source: system
        description: "X-User-ID at time of action"
      - name: entity_type
        type: enum
        source: system
        description: "Domain of the audited event"
        constraints: "CarePlan | Prescription | MedicationAdministration | CareAssessment"
      - name: entity_id
        type: string
        source: system
        description: "ID of the audited entity"
      - name: action
        type: string
        source: system
        description: "Action verb, e.g. CREATE, APPROVE, ADMINISTER, ERROR_REPORT"
      - name: previous_state
        type: string
        source: system
        description: "Prior status value (or null when entity newly created)"
      - name: new_state
        type: string
        source: system
        description: "Post-action status value (or null when none)"
      - name: occurred_at
        type: datetime
        source: system
        description: "ISO 8601 UTC timestamp set from server clock"

  - name: ExternalEvent
    parent: null
    common_fields: false
    fields:
      - name: source
        type: enum
        source: input
        description: "Originating external system"
        constraints: "PAYMENT | IM | HOSPITAL | GOVT_SUBSIDY"
      - name: idempotency_key
        type: string
        source: input
        description: "Unique key supplied by external system; second submission with same (source, idempotency_key) returns first result"
        constraints: "unique within source"
      - name: event_type
        type: string
        source: input
        description: "Source-specific event type, e.g. PAYMENT_RECEIVED, ELDER_TRANSFERRED_TO_HOSPITAL, SUBSIDY_GRANT"
      - name: payload
        type: object
        source: input
        description: "JSON payload (source-specific schema)"
      - name: applied_at
        type: datetime
        source: system
        description: "When the event was processed"
      - name: result_status
        type: enum
        source: system
        description: "Outcome of processing"
        constraints: "APPLIED | DUPLICATE | REJECTED"

# =============================================================================
# §1.2 State Machines
# =============================================================================
state_machines:
  - entity: Elder
    initial_state: PENDING_ADMISSION
    terminal_states: [DISCHARGED]
    transitions:
      - from: PENDING_ADMISSION
        to: ADMITTED
        trigger: "POST /elders/{id}/admit"
        actor: Admin
        preconditions:
          - "Elder has >= 1 emergency_contact"
          - "Elder has at least one APPROVED CareAssessment (sets current_care_level)"
          - "Request body bed_id refers to Bed with status==AVAILABLE"
          - "Elder.deposit_balance_cents >= REQUIRED_ADMISSION_DEPOSIT_CENTS"
        side_effects:
          - "Bed.status: AVAILABLE -> OCCUPIED"
          - "Bed.current_elder_id = elder.id"
          - "Elder.current_bed_id = bed.id"
          - "Append admission_history entry"
          - "Promote oldest matching WaitlistEntry for this bed_type to FULFILLED (if elder was queued)"
          - "AuditLog (entity_type: CarePlan is not yet created — no audit until plan activation)"
      - from: ADMITTED
        to: ON_LEAVE
        trigger: "POST /elders/{id}/leave (e.g. hospital transfer) OR ExternalEvent HOSPITAL/ELDER_TRANSFERRED"
        actor: Admin | system
        preconditions:
          - "Elder.status == ADMITTED"
        side_effects:
          - "Bed.status remains OCCUPIED (held for return)"
          - "Active Prescriptions: status -> SUSPENDED"
          - "Open (DRAFT) Bills continue accruing; subsequent days NOT counted toward care fee while ON_LEAVE"
      - from: ON_LEAVE
        to: ADMITTED
        trigger: "POST /elders/{id}/return"
        actor: Admin
        preconditions:
          - "Elder.status == ON_LEAVE"
          - "Bed.status == OCCUPIED (held)"
        side_effects:
          - "Suspended Prescriptions: status -> ACTIVE"
      - from: ADMITTED
        to: DISCHARGED
        trigger: "POST /elders/{id}/discharge"
        actor: Admin
        preconditions:
          - "Elder.outstanding_balance_cents == 0"
          - "No DRAFT Bill remains; all Bills in {PAID, REFUNDED, ADJUSTED}"
          - "All active Prescriptions discontinued (status DISCONTINUED) prior to discharge"
        side_effects:
          - "Bed.status: OCCUPIED -> AVAILABLE"
          - "Bed.current_elder_id = null"
          - "Elder.current_bed_id = null"
          - "Append admission_history entry with discharged_at"
          - "Refund Elder.deposit_balance_cents > 0 via system payment event (deposit_refund_invariant)"
          - "All open VisitReservation (status RESERVED) -> CANCELLED"
      - from: ON_LEAVE
        to: DISCHARGED
        trigger: "POST /elders/{id}/discharge"
        actor: Admin
        preconditions:
          - "Same as ADMITTED->DISCHARGED preconditions"
        side_effects:
          - "Same as ADMITTED->DISCHARGED side effects"

  - entity: Bed
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: OCCUPIED
        trigger: "POST /elders/{id}/admit OR POST /beds/{id}/assign-transfer"
        actor: Admin
        preconditions:
          - "Bed.status == AVAILABLE"
          - "If bed_type == INTENSIVE_CARE: target Elder.current_care_level == INTENSIVE"
        side_effects:
          - "Set current_elder_id"
      - from: OCCUPIED
        to: AVAILABLE
        trigger: "POST /elders/{id}/discharge OR POST /beds/{id}/release"
        actor: Admin | system
        preconditions:
          - "No Elder.current_bed_id == this bed (after release)"
        side_effects:
          - "current_elder_id = null"
          - "Trigger waitlist_promotion: select highest priority QUEUED WaitlistEntry matching bed_type"
      - from: AVAILABLE
        to: MAINTENANCE
        trigger: "POST /beds/{id}/maintenance"
        actor: Admin
        preconditions:
          - "Bed.status == AVAILABLE"
        side_effects: []
      - from: MAINTENANCE
        to: AVAILABLE
        trigger: "POST /beds/{id}/maintenance-complete"
        actor: Admin
        preconditions:
          - "Bed.status == MAINTENANCE"
        side_effects:
          - "Trigger waitlist_promotion"
      - from: OCCUPIED
        to: OCCUPIED
        trigger: "POST /elders/{id}/transfer"
        actor: Admin
        preconditions:
          - "Source Bed.current_elder_id == elder.id"
          - "Target Bed.status == AVAILABLE"
        note: "Transfer is modeled as release on source + assign on target in one atomic operation"
        side_effects:
          - "Source bed becomes AVAILABLE; target bed becomes OCCUPIED"
          - "Trigger waitlist_promotion (on source release)"

  - entity: CareAssessment
    initial_state: DRAFT
    terminal_states: [REJECTED]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /care-assessments/{id}/submit"
        actor: Nurse
        preconditions:
          - "All three sub-scores present"
        side_effects:
          - "Compute composite_score and classification"
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /care-assessments/{id}/approve"
        actor: Supervisor
        preconditions:
          - "approver_id != assessor_id (segregation of duties)"
        side_effects:
          - "Set effective_from = now"
          - "Set due_for_reassessment_at = effective_from + 90 days"
          - "Update Elder.current_care_level = this.classification"
          - "If Elder has ACTIVE CarePlan whose care_level_snapshot != this.classification: that CarePlan -> UNDER_REVIEW (cross-entity cascade)"
          - "AuditLog (entity_type: CareAssessment, action: APPROVE)"
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /care-assessments/{id}/reject"
        actor: Supervisor
        preconditions:
          - "approver_id != assessor_id"
        side_effects:
          - "AuditLog (entity_type: CareAssessment, action: REJECT)"
      - from: PENDING_APPROVAL
        to: DRAFT
        trigger: "POST /care-assessments/{id}/return-for-revision"
        actor: Supervisor
        preconditions:
          - "approver_id != assessor_id"
        side_effects:
          - "Revision loop (cyclic transition)"

  - entity: CarePlan
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /care-plans/{id}/activate"
        actor: Supervisor
        preconditions:
          - "Referenced CareAssessment.status == APPROVED and matches Elder.current_care_level"
          - "No other ACTIVE CarePlan exists for this elder"
        side_effects:
          - "Snapshot care_level_snapshot = CareAssessment.classification"
          - "Set activated_at, review_cycle_days (per care_plan_review_cycle calc), next_review_due_at"
          - "AuditLog (entity_type: CarePlan, action: ACTIVATE)"
      - from: ACTIVE
        to: UNDER_REVIEW
        trigger: "POST /care-plans/{id}/flag-review OR CareAssessment APPROVED whose classification != snapshot OR now() >= next_review_due_at via POST /_sweep/run"
        actor: Supervisor | system
        preconditions:
          - "Plan.status == ACTIVE"
        side_effects:
          - "AuditLog (action: REVIEW_FLAGGED)"
      - from: UNDER_REVIEW
        to: ACTIVE
        trigger: "POST /care-plans/{id}/confirm-review (no changes needed)"
        actor: Supervisor
        preconditions:
          - "Plan.status == UNDER_REVIEW"
        side_effects:
          - "Reset next_review_due_at = now + review_cycle_days (review cycle restart)"
          - "AuditLog (action: REVIEW_CONFIRM)"
      - from: UNDER_REVIEW
        to: SUPERSEDED
        trigger: "POST /care-plans/{id}/supersede (with new_plan_id)"
        actor: Supervisor
        preconditions:
          - "new_plan_id refers to DRAFT CarePlan for same elder"
        side_effects:
          - "new CarePlan: DRAFT -> ACTIVE (cascade)"
          - "AuditLog (action: SUPERSEDE)"
      - from: SUPERSEDED
        to: ARCHIVED
        trigger: "POST /_sweep/run when now() - superseded_at >= 30 days"
        actor: system
        preconditions: []
        side_effects:
          - "Read-only thereafter"

  - entity: Prescription
    initial_state: PENDING_REVIEW
    terminal_states: [DISCONTINUED]
    transitions:
      - from: PENDING_REVIEW
        to: ACTIVE
        trigger: "POST /prescriptions/{id}/activate"
        actor: Pharmacist (modeled as Supervisor role with pharmacy operations)
        preconditions:
          - "Drug-interaction check: no other ACTIVE Prescription for same elder contains this drug_code in its interacts_with_drug_codes (and vice versa)"
          - "Elder.allergies ∩ contraindicated_allergens == ∅"
          - "Elder.status == ADMITTED"
        side_effects:
          - "Generate dispensing schedule slots (frequency_per_day x calendar days from starts_on..ends_on)"
          - "AuditLog (entity_type: Prescription, action: ACTIVATE)"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "Elder ADMITTED->ON_LEAVE cascade OR POST /prescriptions/{id}/suspend"
        actor: system | Physician
        preconditions:
          - "Prescription.status == ACTIVE"
        side_effects:
          - "Future scheduled MedicationAdministration slots are blocked"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "Elder ON_LEAVE->ADMITTED cascade OR POST /prescriptions/{id}/resume"
        actor: system | Physician
        preconditions:
          - "Elder.status == ADMITTED"
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /prescriptions/{id}/discontinue"
        actor: Physician
        preconditions: []
        side_effects:
          - "AuditLog (action: DISCONTINUE)"
      - from: PENDING_REVIEW
        to: DISCONTINUED
        trigger: "POST /prescriptions/{id}/discontinue"
        actor: Physician
        preconditions: []
        side_effects: []

  - entity: VisitReservation
    initial_state: RESERVED
    terminal_states: [COMPLETED, CANCELLED, DENIED]
    transitions:
      - from: RESERVED
        to: CHECKED_IN
        trigger: "POST /visit-reservations/{id}/check-in"
        actor: Admin
        preconditions:
          - "now() in [slot_start_at - 15min, slot_end_at]"
          - "Elder.status == ADMITTED"
          - "Submitted visitor_id_number matches reservation.visitor_id_number"
          - "EpidemicConfig.mode != LOCKDOWN (else DENIED transition)"
          - "Health screening: temperature_c < EpidemicConfig.max_temperature_c AND symptoms array is empty AND (mode==NORMAL OR recent_exposure==false)"
        side_effects:
          - "Set check_in_at = now"
      - from: RESERVED
        to: DENIED
        trigger: "POST /visit-reservations/{id}/check-in (when health screening fails) OR EpidemicConfig.mode -> LOCKDOWN sweep"
        actor: Admin | system
        preconditions:
          - "Failed health screening OR mode == LOCKDOWN"
        side_effects: []
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /visit-reservations/{id}/check-out"
        actor: Admin
        preconditions:
          - "Reservation.status == CHECKED_IN"
        side_effects:
          - "Set check_out_at = now"
      - from: RESERVED
        to: CANCELLED
        trigger: "DELETE /visit-reservations/{id} OR Elder discharge cascade"
        actor: Family | Admin | system
        preconditions:
          - "now() < slot_start_at OR triggered by discharge"
        side_effects: []

  - entity: Bill
    initial_state: DRAFT
    terminal_states: [PAID, REFUNDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /bills/{id}/finalize"
        actor: Finance
        preconditions:
          - "All days within cycle have either care-level coverage or ON_LEAVE accounting"
          - "Bill.line_items computed for the chosen billing_mode"
        side_effects:
          - "Run billing calculation chain: line_items -> subtotal -> government_subsidy -> insurance_offset -> deposit_applied -> amount_due"
          - "Decrement Elder.deposit_balance_cents by deposit_applied_cents (may go to zero, never negative — cap at remaining balance)"
          - "Recompute Elder.outstanding_balance_cents (derived field reconciliation)"
          - "Set finalized_at"
      - from: FINALIZED
        to: PAID
        trigger: "POST /bills/{id}/pay (Family) OR ExternalEvent PAYMENT/PAYMENT_RECEIVED with idempotency_key"
        actor: Family | system
        preconditions:
          - "Bill.amount_due_cents > 0 OR amount_due_cents == 0 (auto-PAID on finalize for zero-due bills)"
          - "Idempotency: external_payment_ref not already used on a different bill"
        side_effects:
          - "Set paid_at = now"
          - "Recompute Elder.outstanding_balance_cents"
      - from: FINALIZED
        to: ADJUSTED
        trigger: "POST /bills/{id}/adjust"
        actor: Finance
        preconditions:
          - "Provided adjustment_reason"
        side_effects:
          - "Recompute amount_due_cents using provided adjustment overrides"
          - "Recompute Elder.outstanding_balance_cents"
      - from: PAID
        to: REFUNDED
        trigger: "POST /bills/{id}/refund"
        actor: Finance
        preconditions:
          - "Provided refund_amount_cents <= original deposit_applied_cents + paid_amount"
        side_effects:
          - "Increment Elder.deposit_balance_cents by min(refund_amount, deposit_applied) (deposit_refund_invariant)"
          - "Recompute Elder.outstanding_balance_cents"
      - from: DRAFT
        to: DRAFT
        trigger: "POST /_sweep/run when cycle_end_date passes (no-op; finalization is manual)"
        actor: system
        preconditions: []
        side_effects:
          - "Set Bill.amount_due_cents preview only; status remains DRAFT until manual finalize"

  - entity: WaitlistEntry
    initial_state: QUEUED
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: QUEUED
        to: OFFERED
        trigger: "Bed OCCUPIED->AVAILABLE waitlist_promotion (system) OR POST /waitlist/{id}/offer"
        actor: system | Admin
        preconditions:
          - "A Bed with matching bed_type is AVAILABLE"
        side_effects:
          - "Reserve target bed for 24h (Bed remains AVAILABLE; entry holds soft claim)"
          - "Set offered_bed_id"
      - from: OFFERED
        to: FULFILLED
        trigger: "POST /elders/{elder_id}/admit succeeds with this entry's offered_bed_id"
        actor: Admin
        preconditions: []
        side_effects: []
      - from: OFFERED
        to: QUEUED
        trigger: "POST /_sweep/run when 24h elapsed since offer OR POST /waitlist/{id}/decline"
        actor: system | Family
        preconditions: []
        side_effects:
          - "Clear offered_bed_id; re-promote next entry"
      - from: QUEUED
        to: CANCELLED
        trigger: "DELETE /waitlist/{id} OR Elder discharge / PENDING_ADMISSION abandonment"
        actor: Family | Admin | system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two admit requests target the same AVAILABLE Bed simultaneously"
    guarantee: "At most one admit succeeds; second rejected"
    error_id: ERR_BED_ALREADY_OCCUPIED
    http_status: 409
    serialization: "First-writer-wins on Bed.status AVAILABLE->OCCUPIED"

  - scenario: "Two transfers attempt to move different elders into the same target bed"
    guarantee: "At most one transfer succeeds"
    error_id: ERR_BED_ALREADY_OCCUPIED
    http_status: 409
    serialization: "First-writer-wins on target Bed status update"

  - scenario: "Supervisor approves and another Supervisor rejects the same CareAssessment simultaneously"
    guarantee: "Exactly one operation succeeds; loser sees ERR_INVALID_STATE because state has already left PENDING_APPROVAL"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on CareAssessment.status field"

  - scenario: "Bill finalize and external PAYMENT/PAYMENT_RECEIVED event race"
    guarantee: "Finalize completes first; payment then applies; if payment arrives first while bill is DRAFT, payment is rejected"
    error_id: ERR_BILL_NOT_FINALIZED
    http_status: 409
    serialization: "Pay endpoint requires status==FINALIZED"

  - scenario: "Two pay requests with the same external_payment_ref idempotency key"
    guarantee: "First applies and transitions FINALIZED->PAID; second returns first result (200) without state change — but if posted to a DIFFERENT bill, second is rejected"
    error_id: ERR_DUPLICATE_PAYMENT
    http_status: 409
    serialization: "external_payment_ref unique across bills"

  - scenario: "Two MedicationAdministration POSTs for the same scheduled_slot_at on the same prescription"
    guarantee: "At most one administration recorded per slot"
    error_id: ERR_SLOT_ALREADY_ADMINISTERED
    http_status: 409
    serialization: "Unique (prescription_id, scheduled_slot_at)"

  - scenario: "Two VisitReservations for the same elder overlapping in time"
    guarantee: "First-writer-wins; overlapping reservation rejected"
    error_id: ERR_VISIT_SLOT_CONFLICT
    http_status: 409
    serialization: "Half-open intervals [slot_start_at, slot_end_at) per elder must not intersect"

  - scenario: "ExternalEvent submitted twice with same (source, idempotency_key)"
    guarantee: "Second submission returns first result; result_status==DUPLICATE; no domain side effects re-applied"
    error_id: ERR_DUPLICATE_EVENT
    http_status: 409
    serialization: "Unique (source, idempotency_key); deterministic replay"

# =============================================================================
# §1.3 Calculations
# =============================================================================
calculations:
  - name: care_level_classification
    trigger: "POST /care-assessments/{id}/submit (DRAFT->PENDING_APPROVAL)"
    algorithm: weighted_scoring
    formula: |
      # All sub-scores are integers from the assessment
      composite_score = round_half_up(
          (100 - adl_score) * W_ADL          # invert ADL: lower independence -> higher need
        + (30 - cognitive_score) * W_COG     # invert cognitive: lower cognition -> higher need
        + medical_condition_score * W_MED,
        2
      )
      # classification thresholds (inclusive lower bound)
      if composite_score >= 80: classification = INTENSIVE
      elif composite_score >= 60: classification = L4
      elif composite_score >= 40: classification = L3
      elif composite_score >= 20: classification = L2
      else: classification = L1
    input_set: "The three sub-scores on the same CareAssessment row"
    constants:
      W_ADL: 0.5
      W_COG: 1.0
      W_MED: 1.0
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: waitlist_priority
    trigger: "WaitlistEntry insert OR Elder.current_care_level update (recompute on the entry)"
    algorithm: weighted_scoring
    formula: |
      # Higher score is served first; tie-break by queued_at (earliest wins)
      base = CARE_LEVEL_WEIGHT[elder.current_care_level]   # mapping below
      age_bonus = floor((today - elder.date_of_birth_years) / 5)  # +1 per 5 years over 0
      priority_score = base * 100 + age_bonus
    input_set: "Elder.current_care_level (must exist) + Elder.date_of_birth"
    constants:
      CARE_LEVEL_WEIGHT:
        L1: 1
        L2: 2
        L3: 3
        L4: 4
        INTENSIVE: 5
    precision: "integer"
    variants: []

  - name: care_plan_review_cycle
    trigger: "CarePlan DRAFT->ACTIVE OR CareAssessment APPROVED that updates Elder.current_care_level"
    algorithm: threshold
    formula: |
      review_cycle_days = REVIEW_CYCLE_BY_LEVEL[care_level_snapshot]
      next_review_due_at = activated_at + review_cycle_days
    input_set: "CarePlan.care_level_snapshot"
    constants:
      REVIEW_CYCLE_BY_LEVEL:
        L1: 90
        L2: 60
        L3: 45
        L4: 30
        INTENSIVE: 14
    precision: "integer days"
    variants: []

  - name: bill_line_items_and_subtotal
    trigger: "POST /bills/{id}/finalize (DRAFT->FINALIZED)"
    algorithm: aggregation
    formula: |
      # Two variants — same inputs, different outputs.
      # Inputs in scope:
      #   days_in_cycle = (cycle_end_date - cycle_start_date) + 1   # inclusive both ends
      #   admitted_days = number of cycle days where elder was ADMITTED (not ON_LEAVE)
      #                   ON_LEAVE days excluded from CARE/MEAL accrual (but bed fee still accrues — bed is held)
      #   care_level_snapshot = elder.current_care_level at cycle_start_date (frozen)
      #   actual_meal_count = MealLineItem entries posted (a-la-carte mode only)
      #   medical_line_items = MedicalLineItem entries (always itemized in either mode)

      bed_fee_cents = bed.monthly_bed_fee_cents * (days_in_cycle / 30)  # NOT rounded yet
      # Round only at the LAST step (sum then round), pinned order:
      #   line_items computed in full integer cents per line; subtotal_cents = sum of line items.

      if billing_mode == PACKAGE:
          care_fee_cents = PACKAGE_DAILY_CARE_CENTS[care_level_snapshot] * admitted_days
          meal_fee_cents = PACKAGE_DAILY_MEAL_CENTS * admitted_days
          line_items = [
            {category: BED,     amount_cents: round_half_up(bed_fee_cents)},
            {category: CARE,    amount_cents: care_fee_cents},
            {category: MEAL,    amount_cents: meal_fee_cents},
            *medical_line_items,    # category: MEDICAL each
          ]
      elif billing_mode == A_LA_CARTE:
          care_fee_cents = HOURLY_CARE_RATE_CENTS[care_level_snapshot] * sum(CareTaskExecution.minutes_per_task) / 60
          meal_fee_cents = MEAL_UNIT_CENTS * actual_meal_count
          line_items = [
            {category: BED,     amount_cents: round_half_up(bed_fee_cents)},
            {category: CARE,    amount_cents: round_half_up(care_fee_cents)},
            {category: MEAL,    amount_cents: meal_fee_cents},
            *medical_line_items,
          ]

      subtotal_cents = sum(li.amount_cents for li in line_items)
    input_set: "Elder admission_history for cycle, current_care_level snapshot, CareTaskExecution rows in cycle, MealLineItem entries, MedicalLineItem entries, Bed.monthly_bed_fee_cents"
    constants:
      PACKAGE_DAILY_CARE_CENTS:
        L1: 5000
        L2: 8000
        L3: 12000
        L4: 18000
        INTENSIVE: 30000
      PACKAGE_DAILY_MEAL_CENTS: 4000
      HOURLY_CARE_RATE_CENTS:
        L1: 3000
        L2: 4500
        L3: 6500
        L4: 9000
        INTENSIVE: 15000
      MEAL_UNIT_CENTS: 1500
    precision: "integer cents; per-line round_half_up first, then sum (pinned)"
    variants:
      - name: package_mode
        when: "Bill.billing_mode == PACKAGE"
        difference: "Care and meal fees are flat per admitted_day at care-level rate, ignoring per-task duration and meal counts"
      - name: a_la_carte_mode
        when: "Bill.billing_mode == A_LA_CARTE"
        difference: "Care fee derived from actual CareTaskExecution time; meal fee from actual meal counts. Same inputs CAN produce a different subtotal than PACKAGE for the same elder/cycle."

  - name: government_subsidy
    trigger: "Bill finalization OR ExternalEvent GOVT_SUBSIDY/SUBSIDY_GRANT applied"
    algorithm: tiered_pricing
    formula: |
      # Tiered subsidy by care level; applied AFTER subtotal computed.
      # Subsidy is capped per cycle at GOV_SUBSIDY_MONTHLY_CAP_CENTS.
      rate = SUBSIDY_RATE_BY_LEVEL[care_level_snapshot]
      raw = floor(subtotal_cents * rate)
      government_subsidy_cents = min(raw, GOV_SUBSIDY_MONTHLY_CAP_CENTS)
    input_set: "Bill.subtotal_cents + Elder.care_level_snapshot"
    constants:
      SUBSIDY_RATE_BY_LEVEL:
        L1: 0.10
        L2: 0.15
        L3: 0.20
        L4: 0.30
        INTENSIVE: 0.40
      GOV_SUBSIDY_MONTHLY_CAP_CENTS: 200000   # 2,000.00
    precision: "integer cents, floor"
    variants: []

  - name: insurance_offset
    trigger: "Bill finalization (after government_subsidy applied)"
    algorithm: tiered_pricing
    formula: |
      # Apply insurance only on MEDICAL line items (category=MEDICAL).
      medical_total = sum(li.amount_cents for li in Bill.line_items if li.category == MEDICAL)
      raw = floor(medical_total * INSURANCE_COVERAGE_RATE)
      insurance_offset_cents = min(raw, max(0, (subtotal_cents - government_subsidy_cents)))   # never reduces below zero
    input_set: "Bill.line_items (MEDICAL only), subtotal_cents, government_subsidy_cents"
    constants:
      INSURANCE_COVERAGE_RATE: 0.70
    precision: "integer cents, floor"
    variants: []

  - name: deposit_apply_and_amount_due
    trigger: "Bill finalization (after subsidy + insurance)"
    algorithm: waterfall_allocation
    formula: |
      remaining = max(0, subtotal_cents - government_subsidy_cents - insurance_offset_cents)
      deposit_applied_cents = min(remaining, elder.deposit_balance_cents)
      # Invariant: elder.deposit_balance_cents NEVER goes below 0
      elder.deposit_balance_cents -= deposit_applied_cents
      amount_due_cents = remaining - deposit_applied_cents
    input_set: "subtotal_cents, government_subsidy_cents, insurance_offset_cents, elder.deposit_balance_cents"
    constants: {}
    precision: "integer cents"
    variants: []

  - name: outstanding_balance_reconciliation
    trigger: "Any Bill status mutation (FINALIZED/PAID/REFUNDED/ADJUSTED) OR ExternalEvent PAYMENT applied"
    algorithm: aggregation
    formula: |
      Elder.outstanding_balance_cents = sum(
        bill.amount_due_cents
        for bill in Bills
        where bill.elder_id == elder.id
          and bill.status IN {FINALIZED, ADJUSTED}
      )
    input_set: "All Bills for elder with status in {FINALIZED, ADJUSTED}; tie-break n/a (sum)"
    constants: {}
    precision: "integer cents"
    variants: []

# =============================================================================
# §1.4 Validations (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "Request carries valid X-User-Role and X-User-ID headers"
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: "all except POST /_clock/advance and POST /_sweep/run which require Admin"

  - priority: 2
    category: auth
    check: "Role permitted for endpoint per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path-referenced resources exist; checked left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all with path params"

  - priority: 4
    category: existence
    check: "All FK-referenced resources in request body exist"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "all POST/PATCH"

  - priority: 5
    category: state
    check: "Target resource is in a valid state for this transition (per §1.2 preconditions)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_safety
    check: "Segregation of duties — Supervisor approving a CareAssessment cannot be the same X-User-ID as assessor_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /care-assessments/{id}/approve, /reject, /return-for-revision"

  - priority: 7
    category: business_safety
    check: "Segregation of duties — Nurse administering medication cannot be Prescription.prescriber_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /prescriptions/{id}/administrations"

  - priority: 8
    category: business_safety
    check: "Controlled-substance witness — when Prescription.is_controlled_substance, witness_id is required, must differ from nurse_id, prescriber_id"
    error_id: ERR_WITNESS_REQUIRED
    http_status: 422
    applies_to: "POST /prescriptions/{id}/administrations"

  - priority: 9
    category: business_safety
    check: "Drug interaction — prescription's drug_code must not collide with any ACTIVE Prescription's interacts_with_drug_codes for the same elder, and its interacts_with_drug_codes must not contain any ACTIVE Prescription.drug_code"
    error_id: ERR_DRUG_INTERACTION
    http_status: 409
    applies_to: "POST /prescriptions/{id}/activate"

  - priority: 10
    category: business_safety
    check: "Allergy contraindication — Elder.allergies must be disjoint from Prescription.contraindicated_allergens"
    error_id: ERR_ALLERGY_CONFLICT
    http_status: 409
    applies_to: "POST /prescriptions/{id}/activate"

  - priority: 11
    category: business_safety
    check: "Health screening — VisitReservation check-in temperature >= EpidemicConfig.max_temperature_c OR symptoms non-empty OR (epidemic_mode_at_reservation != NORMAL AND recent_exposure==true)"
    error_id: ERR_HEALTH_SCREENING_FAILED
    http_status: 422
    applies_to: "POST /visit-reservations/{id}/check-in"

  - priority: 12
    category: business_safety
    check: "Visit lockdown — EpidemicConfig.mode == LOCKDOWN at check-in time"
    error_id: ERR_VISITATION_LOCKED
    http_status: 403
    applies_to: "POST /visit-reservations/{id}/check-in"

  - priority: 13
    category: business_constraint
    check: "Bed-type / care-level match — INTENSIVE_CARE bed only for elders with current_care_level == INTENSIVE"
    error_id: ERR_BED_TYPE_MISMATCH
    http_status: 409
    applies_to: "POST /elders/{id}/admit, POST /elders/{id}/transfer"

  - priority: 14
    category: business_constraint
    check: "Single ACTIVE CarePlan per elder"
    error_id: ERR_ACTIVE_PLAN_EXISTS
    http_status: 409
    applies_to: "POST /care-plans/{id}/activate"

  - priority: 15
    category: business_constraint
    check: "Visit slot overlap — new RESERVED interval [slot_start_at, slot_end_at) cannot intersect any existing RESERVED/CHECKED_IN reservation for the same elder"
    error_id: ERR_VISIT_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /elders/{id}/visit-reservations"

  - priority: 16
    category: business_constraint
    check: "Per-elder visit daily cap — RESERVED+CHECKED_IN count within the calendar day of slot_start_at must be <= EpidemicConfig.max_visitors_per_day"
    error_id: ERR_VISIT_DAILY_LIMIT
    http_status: 409
    applies_to: "POST /elders/{id}/visit-reservations"

  - priority: 17
    category: business_constraint
    check: "Visit slot duration — (slot_end_at - slot_start_at) must be in [15min, 120min]"
    error_id: ERR_INVALID_SLOT_DURATION
    http_status: 422
    applies_to: "POST /elders/{id}/visit-reservations"

  - priority: 18
    category: business_temporal
    check: "Care-task execution must be recorded within +/- 4h of its scheduled_for"
    error_id: ERR_TASK_RECORD_WINDOW
    http_status: 422
    applies_to: "POST /care-plans/{id}/task-executions"

  - priority: 19
    category: business_temporal
    check: "MedicationAdministration scheduled_slot_at must belong to the prescription's generated dispensing schedule"
    error_id: ERR_SLOT_NOT_SCHEDULED
    http_status: 422
    applies_to: "POST /prescriptions/{id}/administrations"

  - priority: 20
    category: business_referential
    check: "CarePlan activation — based_on_assessment_id.classification must equal Elder.current_care_level"
    error_id: ERR_PLAN_LEVEL_MISMATCH
    http_status: 409
    applies_to: "POST /care-plans/{id}/activate"

  - priority: 21
    category: business_referential
    check: "Bill finalize — admitted_days + on_leave_days within cycle must equal days_in_cycle exactly (no gaps); reject if elder was DISCHARGED before cycle_end_date without partial-cycle flag"
    error_id: ERR_CYCLE_COVERAGE_GAP
    http_status: 422
    applies_to: "POST /bills/{id}/finalize"

  - priority: 22
    category: business_fiscal
    check: "Refund amount must not exceed (Bill.deposit_applied_cents + amount paid externally)"
    error_id: ERR_REFUND_OVER_LIMIT
    http_status: 422
    applies_to: "POST /bills/{id}/refund"

  - priority: 23
    category: business_fiscal
    check: "Admission deposit floor — Elder.deposit_balance_cents >= REQUIRED_ADMISSION_DEPOSIT_CENTS (= 500000, i.e. 5,000.00)"
    error_id: ERR_DEPOSIT_INSUFFICIENT
    http_status: 422
    applies_to: "POST /elders/{id}/admit"

  - priority: 24
    category: business_fiscal
    check: "Discharge fiscal clearance — Elder.outstanding_balance_cents == 0 AND no DRAFT Bills remain"
    error_id: ERR_OUTSTANDING_BALANCE
    http_status: 409
    applies_to: "POST /elders/{id}/discharge"

  - priority: 25
    category: business_constraint
    check: "OCC — request body version field, if provided, must match resource.version"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH and selected POST action endpoints"

  - priority: 26
    category: business_constraint
    check: "Idempotency duplicate — ExternalEvent (source, idempotency_key) already applied; rejected with ERR_DUPLICATE_EVENT"
    error_id: ERR_DUPLICATE_EVENT
    http_status: 409
    applies_to: "POST /_events/external"

# =============================================================================
# §1.5 Endpoints
# =============================================================================
endpoints:
  # ---- Elders ----
  - method: POST
    path: "/elders"
    description: "Create an elder profile (PENDING_ADMISSION)"
    roles: [Admin]
    code: 201
    input: [full_name, date_of_birth, gender, id_card_number, "medical_history?", "allergies?", "dietary_requirements?", emergency_contacts, "advance_directive?"]
    output: Elder
    side_effects: []
  - method: GET
    path: "/elders"
    description: "List elders with filtering by status, current_care_level, current_bed_id"
    roles: [Admin, Supervisor, Nurse, Caregiver, Finance, Physician]
    code: 200
    input: ["limit?", "offset?", "status?", "current_care_level?"]
    output: Elder[]
    side_effects: []
  - method: GET
    path: "/elders/{id}"
    description: "Get elder by id"
    roles: [Admin, Supervisor, Nurse, Caregiver, Finance, Physician, Family]
    code: 200
    input: []
    output: Elder
    side_effects: []
  - method: PATCH
    path: "/elders/{id}"
    description: "Update mutable fields (contacts, dietary, advance_directive)"
    roles: [Admin]
    code: 200
    input: ["emergency_contacts?", "dietary_requirements?", "advance_directive?", "allergies?", "version?"]
    output: Elder
    side_effects: []
  - method: POST
    path: "/elders/{id}/deposit"
    description: "Top up Elder.deposit_balance_cents"
    roles: [Finance, Family]
    code: 200
    input: [amount_cents, "external_payment_ref?"]
    output: Elder
    side_effects: ["increment deposit_balance_cents"]
  - method: POST
    path: "/elders/{id}/admit"
    description: "Admit elder to a specific bed"
    roles: [Admin]
    code: 200
    input: [bed_id]
    output: Elder
    side_effects: ["Bed AVAILABLE->OCCUPIED", "WaitlistEntry OFFERED->FULFILLED (if applicable)", "Append admission_history"]
  - method: POST
    path: "/elders/{id}/leave"
    description: "Mark elder ON_LEAVE (e.g. hospital transfer)"
    roles: [Admin]
    code: 200
    input: ["reason?"]
    output: Elder
    side_effects: ["Suspend active Prescriptions", "Hold bed"]
  - method: POST
    path: "/elders/{id}/return"
    description: "Return elder from leave"
    roles: [Admin]
    code: 200
    input: []
    output: Elder
    side_effects: ["Resume suspended Prescriptions"]
  - method: POST
    path: "/elders/{id}/transfer"
    description: "Atomic bed transfer (release source, occupy target)"
    roles: [Admin]
    code: 200
    input: [target_bed_id]
    output: Elder
    side_effects: ["Source bed AVAILABLE", "Target bed OCCUPIED", "Append admission_history transfer entry", "Trigger waitlist_promotion on source"]
  - method: POST
    path: "/elders/{id}/discharge"
    description: "Discharge elder"
    roles: [Admin]
    code: 200
    input: []
    output: Elder
    side_effects: ["Bed OCCUPIED->AVAILABLE", "Refund deposit_balance", "Cancel open VisitReservations", "Trigger waitlist_promotion"]

  # ---- Rooms / Beds / Waitlist ----
  - method: POST
    path: "/rooms"
    description: "Create a room"
    roles: [Admin]
    code: 201
    input: [room_number, floor, room_type]
    output: Room
    side_effects: []
  - method: GET
    path: "/rooms"
    description: "List rooms"
    roles: [Admin, Supervisor]
    code: 200
    input: ["limit?", "offset?"]
    output: Room[]
    side_effects: []
  - method: POST
    path: "/rooms/{id}/beds"
    description: "Create a bed within a room"
    roles: [Admin]
    code: 201
    input: [bed_code, bed_type, monthly_bed_fee_cents]
    output: Bed
    side_effects: []
  - method: GET
    path: "/beds"
    description: "List beds with filters on status / bed_type"
    roles: [Admin, Supervisor]
    code: 200
    input: ["limit?", "offset?", "status?", "bed_type?"]
    output: Bed[]
    side_effects: []
  - method: POST
    path: "/beds/{id}/maintenance"
    description: "Mark bed MAINTENANCE"
    roles: [Admin]
    code: 200
    input: []
    output: Bed
    side_effects: []
  - method: POST
    path: "/beds/{id}/maintenance-complete"
    description: "Restore bed to AVAILABLE"
    roles: [Admin]
    code: 200
    input: []
    output: Bed
    side_effects: ["Trigger waitlist_promotion"]
  - method: POST
    path: "/waitlist"
    description: "Add an elder to the waitlist"
    roles: [Admin, Family]
    code: 201
    input: [elder_id, requested_bed_type]
    output: WaitlistEntry
    side_effects: ["Compute priority_score"]
  - method: GET
    path: "/waitlist"
    description: "List waitlist entries; sorted by priority_score desc, queued_at asc"
    roles: [Admin]
    code: 200
    input: ["limit?", "offset?", "status?", "requested_bed_type?"]
    output: WaitlistEntry[]
    side_effects: []
  - method: POST
    path: "/waitlist/{id}/decline"
    description: "Family declines offered bed; entry returns to QUEUED"
    roles: [Family, Admin]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: ["Re-trigger waitlist_promotion"]
  - method: DELETE
    path: "/waitlist/{id}"
    description: "Cancel a waitlist entry"
    roles: [Family, Admin]
    code: 204
    input: []
    output: null
    side_effects: []

  # ---- Care Assessments ----
  - method: POST
    path: "/elders/{id}/care-assessments"
    description: "Create draft assessment"
    roles: [Nurse]
    code: 201
    input: [adl_score, cognitive_score, medical_condition_score]
    output: CareAssessment
    side_effects: []
  - method: POST
    path: "/care-assessments/{id}/submit"
    description: "Submit DRAFT for approval"
    roles: [Nurse]
    code: 200
    input: []
    output: CareAssessment
    side_effects: ["Compute composite_score, classification"]
  - method: POST
    path: "/care-assessments/{id}/approve"
    description: "Approve assessment; updates Elder.current_care_level; may flag ACTIVE CarePlan UNDER_REVIEW"
    roles: [Supervisor]
    code: 200
    input: []
    output: CareAssessment
    side_effects: ["Elder.current_care_level := classification", "Possibly CarePlan ACTIVE->UNDER_REVIEW", "AuditLog"]
  - method: POST
    path: "/care-assessments/{id}/reject"
    description: "Reject assessment"
    roles: [Supervisor]
    code: 200
    input: []
    output: CareAssessment
    side_effects: ["AuditLog"]
  - method: POST
    path: "/care-assessments/{id}/return-for-revision"
    description: "Return to DRAFT for revision (cyclic)"
    roles: [Supervisor]
    code: 200
    input: []
    output: CareAssessment
    side_effects: []
  - method: GET
    path: "/elders/{id}/care-assessments"
    description: "List elder's assessments"
    roles: [Admin, Supervisor, Nurse]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: CareAssessment[]
    side_effects: []

  # ---- Care Plans ----
  - method: POST
    path: "/elders/{id}/care-plans"
    description: "Create draft care plan"
    roles: [Supervisor]
    code: 201
    input: [based_on_assessment_id, daily_tasks]
    output: CarePlan
    side_effects: []
  - method: POST
    path: "/care-plans/{id}/activate"
    description: "Activate the plan"
    roles: [Supervisor]
    code: 200
    input: []
    output: CarePlan
    side_effects: ["Snapshot care_level", "Compute review_cycle_days", "Set next_review_due_at", "AuditLog"]
  - method: POST
    path: "/care-plans/{id}/flag-review"
    description: "Move ACTIVE -> UNDER_REVIEW manually"
    roles: [Supervisor]
    code: 200
    input: []
    output: CarePlan
    side_effects: ["AuditLog"]
  - method: POST
    path: "/care-plans/{id}/confirm-review"
    description: "Confirm UNDER_REVIEW without changes; restarts review cycle"
    roles: [Supervisor]
    code: 200
    input: []
    output: CarePlan
    side_effects: ["next_review_due_at := now + review_cycle_days", "AuditLog"]
  - method: POST
    path: "/care-plans/{id}/supersede"
    description: "Replace current ACTIVE plan with a new DRAFT plan"
    roles: [Supervisor]
    code: 200
    input: [new_plan_id]
    output: CarePlan
    side_effects: ["Old plan UNDER_REVIEW->SUPERSEDED", "New plan DRAFT->ACTIVE", "AuditLog"]
  - method: POST
    path: "/care-plans/{id}/task-executions"
    description: "Record a care task execution"
    roles: [Caregiver]
    code: 201
    input: [task_type, scheduled_for, outcome, "notes?"]
    output: CareTaskExecution
    side_effects: []
  - method: GET
    path: "/care-plans/{id}"
    description: "Get plan with daily_tasks and review fields"
    roles: [Admin, Supervisor, Nurse, Caregiver]
    code: 200
    input: []
    output: CarePlan
    side_effects: []
  - method: GET
    path: "/care-plans/{id}/task-executions"
    description: "List task executions for a plan"
    roles: [Admin, Supervisor, Nurse, Caregiver]
    code: 200
    input: ["limit?", "offset?", "task_type?", "outcome?"]
    output: CareTaskExecution[]
    side_effects: []

  # ---- Prescriptions / Medication ----
  - method: POST
    path: "/elders/{id}/prescriptions"
    description: "Create prescription (PENDING_REVIEW)"
    roles: [Physician]
    code: 201
    input: [drug_code, drug_name, is_controlled_substance, "contraindicated_allergens?", "interacts_with_drug_codes?", dose_mg, frequency_per_day, starts_on, ends_on]
    output: Prescription
    side_effects: []
  - method: POST
    path: "/prescriptions/{id}/activate"
    description: "Activate prescription; runs interaction + allergy checks; generates schedule"
    roles: [Supervisor]
    code: 200
    input: []
    output: Prescription
    side_effects: ["Generate dispensing slots", "AuditLog"]
  - method: POST
    path: "/prescriptions/{id}/suspend"
    description: "Suspend an ACTIVE prescription"
    roles: [Physician]
    code: 200
    input: []
    output: Prescription
    side_effects: []
  - method: POST
    path: "/prescriptions/{id}/resume"
    description: "Resume a SUSPENDED prescription"
    roles: [Physician]
    code: 200
    input: []
    output: Prescription
    side_effects: []
  - method: POST
    path: "/prescriptions/{id}/discontinue"
    description: "Discontinue prescription (terminal)"
    roles: [Physician]
    code: 200
    input: []
    output: Prescription
    side_effects: ["AuditLog"]
  - method: POST
    path: "/prescriptions/{id}/administrations"
    description: "Record a MedicationAdministration"
    roles: [Nurse]
    code: 201
    input: [scheduled_slot_at, outcome, "witness_id?"]
    output: MedicationAdministration
    side_effects: ["If outcome==ERROR: auto-create MedicationErrorReport", "AuditLog (entity_type: MedicationAdministration)"]
  - method: POST
    path: "/medication-errors"
    description: "File a freestanding error report (not tied to an administration)"
    roles: [Nurse, Supervisor]
    code: 201
    input: ["administration_id?", elder_id, "prescription_id?", error_type, severity, description]
    output: MedicationErrorReport
    side_effects: ["AuditLog"]
  - method: GET
    path: "/prescriptions/{id}"
    description: "Get a prescription with computed schedule"
    roles: [Admin, Supervisor, Physician, Nurse]
    code: 200
    input: []
    output: Prescription
    side_effects: []
  - method: GET
    path: "/prescriptions/{id}/administrations"
    description: "List administrations for a prescription"
    roles: [Admin, Supervisor, Physician, Nurse]
    code: 200
    input: ["limit?", "offset?", "outcome?"]
    output: MedicationAdministration[]
    side_effects: []

  # ---- Visit Reservations / Epidemic ----
  - method: POST
    path: "/elders/{id}/visit-reservations"
    description: "Create a visit reservation"
    roles: [Family, Admin]
    code: 201
    input: [visitor_name, visitor_id_number, visitor_relation, slot_start_at, slot_end_at]
    output: VisitReservation
    side_effects: ["Snapshot epidemic_mode_at_reservation"]
  - method: POST
    path: "/visit-reservations/{id}/check-in"
    description: "Check visitor in; runs identity + health screening"
    roles: [Admin]
    code: 200
    input: [visitor_id_number, health_screening]
    output: VisitReservation
    side_effects: []
  - method: POST
    path: "/visit-reservations/{id}/check-out"
    description: "Check visitor out"
    roles: [Admin]
    code: 200
    input: []
    output: VisitReservation
    side_effects: []
  - method: DELETE
    path: "/visit-reservations/{id}"
    description: "Cancel a RESERVED reservation"
    roles: [Family, Admin]
    code: 204
    input: []
    output: null
    side_effects: []
  - method: GET
    path: "/elders/{id}/visit-reservations"
    description: "List reservations for elder"
    roles: [Admin, Family]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: VisitReservation[]
    side_effects: []
  - method: PUT
    path: "/epidemic-config"
    description: "Set epidemic posture and screening parameters"
    roles: [Admin]
    code: 200
    input: [mode, "max_temperature_c?", "max_visitors_per_day?"]
    output: EpidemicConfig
    side_effects: ["When mode set to LOCKDOWN, future check-ins DENY"]
  - method: GET
    path: "/epidemic-config"
    description: "Get current epidemic posture"
    roles: [Admin, Family, Supervisor]
    code: 200
    input: []
    output: EpidemicConfig
    side_effects: []

  # ---- Billing ----
  - method: POST
    path: "/elders/{id}/bills"
    description: "Create a draft bill for a cycle"
    roles: [Finance]
    code: 201
    input: [cycle_start_date, cycle_end_date, billing_mode]
    output: Bill
    side_effects: []
  - method: POST
    path: "/bills/{id}/finalize"
    description: "Finalize bill: compute line_items, subtotal, subsidy, insurance, deposit, amount_due"
    roles: [Finance]
    code: 200
    input: []
    output: Bill
    side_effects: ["Decrement Elder.deposit_balance_cents", "Recompute Elder.outstanding_balance_cents"]
  - method: POST
    path: "/bills/{id}/pay"
    description: "Family pays a FINALIZED bill"
    roles: [Family, Finance]
    code: 200
    input: [external_payment_ref]
    output: Bill
    side_effects: ["Bill FINALIZED->PAID", "Recompute outstanding_balance"]
  - method: POST
    path: "/bills/{id}/adjust"
    description: "Adjust a FINALIZED bill"
    roles: [Finance]
    code: 200
    input: [adjustment_reason, override_amount_due_cents]
    output: Bill
    side_effects: ["Recompute outstanding_balance"]
  - method: POST
    path: "/bills/{id}/refund"
    description: "Refund a PAID bill"
    roles: [Finance]
    code: 200
    input: [refund_amount_cents, reason]
    output: Bill
    side_effects: ["Increment Elder.deposit_balance_cents", "Recompute outstanding_balance"]
  - method: GET
    path: "/elders/{id}/bills"
    description: "List bills for elder"
    roles: [Finance, Family, Admin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Bill[]
    side_effects: []
  - method: GET
    path: "/bills/{id}"
    description: "Get bill"
    roles: [Finance, Family, Admin]
    code: 200
    input: []
    output: Bill
    side_effects: []

  # ---- Cross-cutting / Audit / External Events ----
  - method: GET
    path: "/audit-logs"
    description: "List audit logs (CarePlan and Prescription / MedicationAdministration / CareAssessment domains)"
    roles: [Admin, Supervisor]
    code: 200
    input: ["limit?", "offset?", "entity_type?", "entity_id?"]
    output: AuditLog[]
    side_effects: []
  - method: POST
    path: "/_events/external"
    description: "Ingest an external-system event (idempotent)"
    roles: [SystemSync]
    code: 200
    input: [source, idempotency_key, event_type, payload]
    output: ExternalEvent
    side_effects: ["Apply event-specific domain mutation if first occurrence; else return DUPLICATE without re-applying"]
  - method: POST
    path: "/_clock/advance"
    description: "Test-only clock control; advances server clock by seconds (used to drive time-gated transitions)"
    roles: [Admin]
    code: 200
    input: [seconds]
    output: null
    side_effects: []
  - method: POST
    path: "/_sweep/run"
    description: "Run periodic sweep — promote/expire waitlist offers, flag overdue plan reviews, archive superseded plans, deny LOCKDOWN-affected reservations"
    roles: [Admin]
    code: 200
    input: []
    output: null
    side_effects: ["WaitlistEntry OFFERED->QUEUED after 24h", "CarePlan ACTIVE->UNDER_REVIEW when due", "CarePlan SUPERSEDED->ARCHIVED after 30 days", "Pending RESERVED->DENIED if mode==LOCKDOWN"]

# =============================================================================
# §1.6 Error Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_MISSING
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-referenced resource does not exist"
  - id: ERR_FK_NOT_FOUND
    http: 404
    condition: "FK-referenced resource in body does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource is not in a valid state for the operation"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "OCC version mismatch"
  - id: ERR_VALIDATION
    http: 422
    condition: "Generic schema / type validation failure"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Same X-User-ID cannot perform two segregated roles (assess+approve, prescribe+administer)"
  - id: ERR_WITNESS_REQUIRED
    http: 422
    condition: "Controlled-substance administration requires a witness_id distinct from nurse_id and prescriber_id"
  - id: ERR_DRUG_INTERACTION
    http: 409
    condition: "Prescription conflicts with another ACTIVE Prescription on the same elder"
  - id: ERR_ALLERGY_CONFLICT
    http: 409
    condition: "Prescription contraindicated by Elder.allergies"
  - id: ERR_HEALTH_SCREENING_FAILED
    http: 422
    condition: "Visit check-in fails health screening per EpidemicConfig"
  - id: ERR_VISITATION_LOCKED
    http: 403
    condition: "EpidemicConfig.mode == LOCKDOWN forbids visit check-in"
  - id: ERR_BED_TYPE_MISMATCH
    http: 409
    condition: "INTENSIVE_CARE bed assigned to non-INTENSIVE elder (or vice versa)"
  - id: ERR_BED_ALREADY_OCCUPIED
    http: 409
    condition: "Target Bed.status != AVAILABLE"
  - id: ERR_ACTIVE_PLAN_EXISTS
    http: 409
    condition: "Elder already has an ACTIVE CarePlan"
  - id: ERR_PLAN_LEVEL_MISMATCH
    http: 409
    condition: "CarePlan.based_on_assessment_id.classification does not match Elder.current_care_level"
  - id: ERR_VISIT_SLOT_CONFLICT
    http: 409
    condition: "Visit slot overlaps an existing RESERVED/CHECKED_IN reservation for elder"
  - id: ERR_VISIT_DAILY_LIMIT
    http: 409
    condition: "Per-elder daily reservation count exceeded"
  - id: ERR_INVALID_SLOT_DURATION
    http: 422
    condition: "Visit slot duration outside [15min, 120min]"
  - id: ERR_TASK_RECORD_WINDOW
    http: 422
    condition: "CareTaskExecution recorded outside +/- 4h of scheduled_for"
  - id: ERR_SLOT_NOT_SCHEDULED
    http: 422
    condition: "MedicationAdministration.scheduled_slot_at not in prescription's dispensing schedule"
  - id: ERR_SLOT_ALREADY_ADMINISTERED
    http: 409
    condition: "An administration already exists for (prescription_id, scheduled_slot_at)"
  - id: ERR_CYCLE_COVERAGE_GAP
    http: 422
    condition: "Bill cycle days do not match elder's admitted/on_leave coverage"
  - id: ERR_REFUND_OVER_LIMIT
    http: 422
    condition: "Refund amount exceeds eligible refundable amount"
  - id: ERR_DEPOSIT_INSUFFICIENT
    http: 422
    condition: "Elder.deposit_balance_cents below admission deposit floor"
  - id: ERR_OUTSTANDING_BALANCE
    http: 409
    condition: "Discharge blocked by non-zero outstanding_balance_cents"
  - id: ERR_BILL_NOT_FINALIZED
    http: 409
    condition: "Pay attempted on a non-FINALIZED bill"
  - id: ERR_DUPLICATE_PAYMENT
    http: 409
    condition: "external_payment_ref already used on a different bill"
  - id: ERR_DUPLICATE_EVENT
    http: 409
    condition: "ExternalEvent (source, idempotency_key) already processed"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Admin
    description: "Facility admin; manages rooms, beds, admissions, transfers, epidemic posture, sweeps"
    identity: "opaque"
    exclusive_operations:
      - "POST /rooms, /rooms/{id}/beds"
      - "POST /beds/{id}/maintenance, /maintenance-complete"
      - "POST /elders, /elders/{id}/admit, /leave, /return, /transfer, /discharge"
      - "PUT /epidemic-config"
      - "POST /_clock/advance, /_sweep/run"
    shared_operations:
      - "PATCH /elders/{id}"
      - "POST /waitlist, /waitlist/{id}/decline, DELETE /waitlist/{id}"
      - "GET endpoints across the system"
      - "POST visit-reservations + check-in/check-out + cancel"
      - "GET /audit-logs"

  - name: Supervisor
    description: "Nursing supervisor; approves assessments, manages care plans, activates prescriptions"
    identity: "opaque"
    exclusive_operations:
      - "POST /care-assessments/{id}/approve, /reject, /return-for-revision"
      - "POST /care-plans (create), /activate, /flag-review, /confirm-review, /supersede"
      - "POST /prescriptions/{id}/activate"
    shared_operations:
      - "GET endpoints"
      - "POST /medication-errors"
      - "GET /audit-logs"

  - name: Physician
    description: "Doctor who issues, suspends, resumes, discontinues prescriptions"
    identity: "opaque"
    exclusive_operations:
      - "POST /elders/{id}/prescriptions"
      - "POST /prescriptions/{id}/suspend, /resume, /discontinue"
    shared_operations:
      - "GET endpoints relating to elder + prescriptions"

  - name: Nurse
    description: "Drafts care assessments, administers medication"
    identity: "opaque"
    exclusive_operations:
      - "POST /elders/{id}/care-assessments, /care-assessments/{id}/submit"
      - "POST /prescriptions/{id}/administrations"
    shared_operations:
      - "POST /medication-errors"
      - "GET endpoints"

  - name: Caregiver
    description: "Records care-task executions"
    identity: "opaque"
    exclusive_operations:
      - "POST /care-plans/{id}/task-executions"
    shared_operations:
      - "GET /elders/{id}, /care-plans/{id}, /care-plans/{id}/task-executions"

  - name: Family
    description: "Elder's family member; books visits, pays bills, manages waitlist for their elder"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /elders/{id}/visit-reservations, DELETE /visit-reservations/{id}"
      - "POST /waitlist, /waitlist/{id}/decline, DELETE /waitlist/{id}"
      - "POST /elders/{id}/deposit"
      - "POST /bills/{id}/pay"
      - "GET /elders/{id} (only their elder — scoped server-side)"
      - "GET /bills, /visit-reservations, /waitlist for their elder"

  - name: Finance
    description: "Billing officer; creates/finalizes/adjusts/refunds bills"
    identity: "opaque"
    exclusive_operations:
      - "POST /elders/{id}/bills, /bills/{id}/finalize, /adjust, /refund"
    shared_operations:
      - "POST /elders/{id}/deposit"
      - "POST /bills/{id}/pay"
      - "GET endpoints"

  - name: SystemSync
    description: "Service identity for external system integrations (payment, IM, hospital, govt subsidy)"
    identity: "opaque"
    exclusive_operations:
      - "POST /_events/external"
    shared_operations: []
