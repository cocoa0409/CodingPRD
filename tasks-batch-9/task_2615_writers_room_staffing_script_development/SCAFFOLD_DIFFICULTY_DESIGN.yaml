      - name: cascade_b_seat_release_reaches_availability_window_assignment_room_and_season
        grounds:
          - endpoints.POST_/room-seats/{seat_id}/release
          - state_machines.RoomSeat.transitions.CONFIRMED_to_RELEASED
          - state_machines.ScriptAssignment.transitions.to_REASSIGNMENT_PENDING
          - entities.AvailabilityWindow.fields.status
          - entities.AvailabilityWindow.fields.consumed_by_seat_id
          - entities.ScriptAssignment.fields.room_seat_id
          - entities.WritersRoom.fields.confirmed_seat_count
          - entities.WritersRoom.fields.weekly_burn_cents
          - entities.Season.fields.staffing_commitment_weekly_cents
          - entities.Writer.fields.active_seat_count
          - calculations.room_weekly_burn
          - calculations.season_staffing_commitment
          - calculations.script_coverage_index
        distinguishing_aspect: |
          One release fans out across FIVE entities in a fixed order, and the chain crosses from the
          staffing subdomain into the script subdomain: RoomSeat CONFIRMED -> RELEASED, then the
          consumed AvailabilityWindow returns to OPEN with consumed_by_seat_id cleared, then every
          non-terminal ScriptAssignment held through that seat becomes REASSIGNMENT_PENDING with its
          room_seat_id cleared, then the room's counters and weekly_burn_cents are recomputed (the
          subtotal collapses to 0, so the IN_PERSON facility surcharge of 200000 becomes the entire
          burn), then Season.staffing_commitment_weekly_cents follows, and finally the writer's
          active_seat_count drops. Nothing here is reachable by reading only the seat row.
