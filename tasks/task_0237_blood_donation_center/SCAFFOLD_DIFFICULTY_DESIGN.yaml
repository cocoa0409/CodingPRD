  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: slot_capacity_aggregate_occupation_full
        grounds:
          - entities.AppointmentSlot.fields.capacity
          - entities.AppointmentSlot.fields.booked_count
          - validations[priority=12]
          - errors[ERR_SLOT_NOT_BOOKABLE]
        distinguishing_aspect: >
          AppointmentSlot uses AGGREGATE-CAPACITY interval semantics: the slot's
          time window admits up to `capacity` concurrent appointments; a booking
          is rejected when booked_count >= capacity (slot FULL). Resource =
          AppointmentSlot, semantics = aggregate occupancy of one shared window.
        test_recipe:
          setup:
            - "A slot with capacity 1 already has one SCHEDULED appointment (booked_count=1, status FULL). A second donor's booking into the same window is rejected."
          setup_api_calls:
            - call: "POST /blood-bank/centers"
              payload: { name: "Metro Blood", region_code: "US-CA" }
              as: CenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /blood-bank/centers/${center_id}/clock/advance"
              payload: { to_iso8601: "2025-01-01T00:00:00.000Z" }
              as: CenterAdmin
            - call: "POST /blood-bank/donors"
              payload: { center_id: "${center_id}", full_name: "First Donor", date_of_birth: "1990-01-01", weight_kg: 70, blood_type: "O_POS" }
              as: IntakeNurse
              captures: { donor_a_id: $.data.id }
            - call: "POST /blood-bank/donors"
              payload: { center_id: "${center_id}", full_name: "Second Donor", date_of_birth: "1991-01-01", weight_kg: 70, blood_type: "O_NEG" }
              as: IntakeNurse
              captures: { donor_b_id: $.data.id }
            - call: "POST /blood-bank/slots"
              payload: { center_id: "${center_id}", donation_type: "WHOLE", starts_at: "2025-01-02T08:00:00.000Z", ends_at: "2025-01-02T09:00:00.000Z", capacity: 1 }
              as: CenterAdmin
              captures: { slot_id: $.data.id, slot_v0: $.data.version }
            - call: "POST /blood-bank/appointments"
              payload: { donor_id: "${donor_a_id}", slot_id: "${slot_id}", expected_slot_version: "${slot_v0}" }
              as: IntakeNurse
            - call: "GET /blood-bank/slots/${slot_id}"
              payload: {}
              as: IntakeNurse
              captures: { slot_v1: $.data.version, slot_status: $.data.status }
          trigger:
            - call: "POST /blood-bank/appointments"
              payload: { donor_id: "${donor_b_id}", slot_id: "${slot_id}", expected_slot_version: "${slot_v1}" }
              as: IntakeNurse
              captures: { err: $.data.error_id }
          assert:
            - "AppointmentSlot.${slot_id}.status == FULL after the first booking (booked_count 1 == capacity 1)"
            - "response error_id == ERR_SLOT_NOT_BOOKABLE for the second booking"

      - name: donor_interval_minimum_gap_between_donations
        grounds:
          - calculations.inter_donation_next_eligible_at
          - validations[priority=10]
          - errors[ERR_INTERVAL_NOT_ELAPSED]
          - state_machines.Appointment.SCHEDULED_to_CHECKED_IN
        distinguishing_aspect: >
          The Donor's donation timeline uses MINIMUM-GAP (buffer) interval
          semantics: two collections of the same type must be separated by at
          least interval_days; a check-in at collected_at + 55d (< 56d gap) is
          rejected. Resource = Donor timeline, semantics = minimum spacing
          between point events, distinct from slot aggregate occupancy.
        test_recipe:
          setup:
            - "Donor completed a WHOLE collection at 2025-01-01. A second WHOLE appointment is booked; clock advanced to 2025-02-25 (collected_at + 55d, one day short). Check-in is rejected."
          setup_api_calls:
            - call: "POST /blood-bank/centers"
              payload: { name: "Metro Blood", region_code: "US-CA" }
              as: CenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /blood-bank/centers/${center_id}/clock/advance"
              payload: { to_iso8601: "2025-01-01T00:00:00.000Z" }
              as: CenterAdmin
            - call: "POST /blood-bank/donors"
              payload: { center_id: "${center_id}", full_name: "Gap Donor", date_of_birth: "1984-01-01", weight_kg: 80, blood_type: "O_POS" }
              as: IntakeNurse
              captures: { donor_id: $.data.id }
            - call: "POST /blood-bank/slots"
              payload: { center_id: "${center_id}", donation_type: "WHOLE", starts_at: "2025-01-01T08:00:00.000Z", ends_at: "2025-01-01T18:00:00.000Z", capacity: 5 }
              as: CenterAdmin
              captures: { slot1_id: $.data.id, slot1_v: $.data.version }
            - call: "POST /blood-bank/appointments"
              payload: { donor_id: "${donor_id}", slot_id: "${slot1_id}", expected_slot_version: "${slot1_v}" }
              as: IntakeNurse
              captures: { appt1_id: $.data.id }
            - call: "POST /blood-bank/appointments/${appt1_id}/check-in"
              payload: {}
              as: IntakeNurse
            - call: "POST /blood-bank/health-screenings"
              payload: { appointment_id: "${appt1_id}", hemoglobin_g_dl: 14.0, systolic_bp: 120, pulse_bpm: 70, weight_kg: 80, recent_travel_risk: false, disqualifying_medication: false }
              as: IntakeNurse
            - call: "POST /blood-bank/appointments/${appt1_id}/donations"
              payload: { volume_ml: 450 }
              as: IntakeNurse
            - call: "POST /blood-bank/slots"
              payload: { center_id: "${center_id}", donation_type: "WHOLE", starts_at: "2025-02-25T08:00:00.000Z", ends_at: "2025-02-25T18:00:00.000Z", capacity: 5 }
              as: CenterAdmin
              captures: { slot2_id: $.data.id, slot2_v: $.data.version }
            - call: "POST /blood-bank/appointments"
              payload: { donor_id: "${donor_id}", slot_id: "${slot2_id}", expected_slot_version: "${slot2_v}" }
              as: IntakeNurse
              captures: { appt2_id: $.data.id }
            - call: "POST /blood-bank/centers/${center_id}/clock/advance"
              payload: { to_iso8601: "2025-02-25T00:00:00.000Z" }
              as: CenterAdmin
          trigger:
            - call: "POST /blood-bank/appointments/${appt2_id}/check-in"
              payload: {}
              as: IntakeNurse
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INTERVAL_NOT_ELAPSED (current_utc 2025-02-25 < last collected_at 2025-01-01 + 56d = 2025-02-26)"
            - "Appointment.${appt2_id}.status == SCHEDULED (check-in rejected)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: slot_booked_count_conserved_book_then_cancel
        grounds:
          - state_machines.Appointment.SCHEDULED_to_CANCELLED
          - entities.AppointmentSlot.fields.booked_count
          - entities.AppointmentSlot.fields.status
        distinguishing_aspect: >
          Conserved quantity = slot occupancy. Invariant: after book (booked_count
          +1) then cancel (booked_count -1), AppointmentSlot.booked_count equals
          its pre-booking value (0) and status returns to OPEN — a different
          conserved quantity than inventory unit counts.
        test_recipe:
          setup:
            - "A slot with capacity 1 starts at booked_count 0. Book an appointment (booked_count 1, FULL), then cancel it; booked_count returns to 0 and status to OPEN."
          setup_api_calls:
            - call: "POST /blood-bank/centers"
              payload: { name: "Metro Blood", region_code: "US-CA" }
              as: CenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /blood-bank/centers/${center_id}/clock/advance"
              payload: { to_iso8601: "2025-01-01T00:00:00.000Z" }
              as: CenterAdmin
            - call: "POST /blood-bank/donors"
              payload: { center_id: "${center_id}", full_name: "Cody Cancel", date_of_birth: "1990-03-03", weight_kg: 70, blood_type: "A_POS" }
              as: IntakeNurse
              captures: { donor_id: $.data.id }
            - call: "POST /blood-bank/slots"
              payload: { center_id: "${center_id}", donation_type: "WHOLE", starts_at: "2025-01-02T08:00:00.000Z", ends_at: "2025-01-02T09:00:00.000Z", capacity: 1 }
              as: CenterAdmin
              captures: { slot_id: $.data.id, slot_v0: $.data.version }
            - call: "POST /blood-bank/appointments"
              payload: { donor_id: "${donor_id}", slot_id: "${slot_id}", expected_slot_version: "${slot_v0}" }
              as: IntakeNurse
              captures: { appt_id: $.data.id }
            - call: "GET /blood-bank/slots/${slot_id}"
              payload: {}
              as: IntakeNurse
              captures: { booked_mid: $.data.booked_count, status_mid: $.data.status }
          trigger:
            - call: "POST /blood-bank/appointments/${appt_id}/cancel"
              payload: {}
              as: IntakeNurse
            - call: "GET /blood-bank/slots/${slot_id}"
              payload: {}
              as: IntakeNurse
              captures: { booked_after: $.data.booked_count, status_after: $.data.status }
          assert:
            - "AppointmentSlot.${slot_id}.booked_count == 1 and status == FULL after booking"
            - "AppointmentSlot.${slot_id}.booked_count == 0 after cancel (conserved back to pre-booking value)"
            - "AppointmentSlot.${slot_id}.status == OPEN after cancel"

      - name: inventory_total_conserved_reserve_then_unreserve
        grounds:
          - state_machines.BloodUnit.AVAILABLE_to_RESERVED
          - state_machines.BloodUnit.RESERVED_to_AVAILABLE
          - calculations.inventory_recount
          - entities.InventoryBucket.fields.available_count
          - entities.InventoryBucket.fields.reserved_count
        distinguishing_aspect: >
          Conserved quantity = total managed units (available + reserved).
          Invariant: reserve (available -1, reserved +1) then unreserve (reserved
          -1, available +1) leaves available_count + reserved_count unchanged and
          restores each to its pre-reserve value — a different conserved quantity
          than slot occupancy.
        test_recipe:
          setup:
            - "One AVAILABLE O_POS/RBC unit with a bucket showing available_count=1, reserved_count=0. Reserve then unreserve."
          setup_api_calls:
            - call: "POST /blood-bank/centers"
              payload: { name: "Metro Blood", region_code: "US-CA" }
              as: CenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /blood-bank/centers/${center_id}/clock/advance"
              payload: { to_iso8601: "2025-01-01T00:00:00.000Z" }
              as: CenterAdmin
            - call: "POST /blood-bank/donors"
              payload: { center_id: "${center_id}", full_name: "Iggy Inventory", date_of_birth: "1980-04-04", weight_kg: 76, blood_type: "O_POS" }
              as: IntakeNurse
              captures: { donor_id: $.data.id }
            - call: "POST /blood-bank/slots"
              payload: { center_id: "${center_id}", donation_type: "WHOLE", starts_at: "2025-01-01T08:00:00.000Z", ends_at: "2025-01-01T18:00:00.000Z", capacity: 5 }
              as: CenterAdmin
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /blood-bank/appointments"
              payload: { donor_id: "${donor_id}", slot_id: "${slot_id}", expected_slot_version: "${slot_v}" }
              as: IntakeNurse
              captures: { appt_id: $.data.id }
            - call: "POST /blood-bank/appointments/${appt_id}/check-in"
              payload: {}
              as: IntakeNurse
            - call: "POST /blood-bank/health-screenings"
              payload: { appointment_id: "${appt_id}", hemoglobin_g_dl: 14.0, systolic_bp: 120, pulse_bpm: 70, weight_kg: 76, recent_travel_risk: false, disqualifying_medication: false }
              as: IntakeNurse
            - call: "POST /blood-bank/appointments/${appt_id}/donations"
              payload: { volume_ml: 450 }
              as: IntakeNurse
              captures: { don_id: $.data.id }
            - call: "POST /blood-bank/blood-units"
              payload: { donation_id: "${don_id}", component: "RBC", din: "DIN-INV-001" }
              as: LabTechnician
              captures: { unit_id: $.data.id }
            - call: "POST /blood-bank/donations/${don_id}/test-results"
              payload: { panel_outcome: "NEGATIVE" }
              as: LabTechnician
            - call: "POST /blood-bank/inventory-buckets"
              payload: { center_id: "${center_id}", blood_type: "O_POS", component: "RBC" }
              as: InventoryManager
              captures: { bucket_id: $.data.id, avail0: $.data.available_count, reserved0: $.data.reserved_count }
            - call: "POST /blood-bank/blood-units/${unit_id}/reserve"
              payload: {}
              as: InventoryManager
            - call: "GET /blood-bank/inventory-buckets/${bucket_id}"
              payload: {}
              as: InventoryManager
              captures: { avail_mid: $.data.available_count, reserved_mid: $.data.reserved_count }
          trigger:
            - call: "POST /blood-bank/blood-units/${unit_id}/unreserve"
              payload: {}
              as: InventoryManager
            - call: "GET /blood-bank/inventory-buckets/${bucket_id}"
              payload: {}
              as: InventoryManager
              captures: { avail_after: $.data.available_count, reserved_after: $.data.reserved_count }
          assert:
            - "After reserve: InventoryBucket.${bucket_id}.available_count == 0, reserved_count == 1 (sum 1)"
            - "After unreserve: InventoryBucket.${bucket_id}.available_count == 1, reserved_count == 0 (sum 1 conserved; each restored to pre-reserve value)"
