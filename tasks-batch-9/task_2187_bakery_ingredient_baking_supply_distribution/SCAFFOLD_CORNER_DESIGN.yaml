          setup_api_calls:
            - call: "POST /bakery-distribution/customers"
              payload: { legal_name: "Atomic Hop Bakery", allergen_program: "STANDARD", credit_limit_cents: 10000000, min_drop_cents: 1000 }
              as: AccountManager
              as_user_id: "am_1"
              captures: { cust_id: $.data.id }
            - call: "POST /bakery-distribution/products"
              payload: { sku: "FLR-ATA-30", category: "FLOUR", allergen_class: "GLUTEN", shelf_life_days: 365, index_code: "NONE", list_price_cents_per_lb: 30, min_rotation_days: 0 }
              as: PricingController
              as_user_id: "pc_1"
              captures: { prod_a: $.data.id }
            - call: "POST /bakery-distribution/products"
              payload: { sku: "FLR-ATB-45", category: "FLOUR", allergen_class: "GLUTEN", shelf_life_days: 365, index_code: "NONE", list_price_cents_per_lb: 45, min_rotation_days: 0 }
              as: PricingController
              as_user_id: "pc_1"
              captures: { prod_b: $.data.id }
            - call: "POST /bakery-distribution/warehouse-zones"
              payload: { zone_code: "Z-GLU", allergen_class: "GLUTEN" }
              as: WarehouseOperator
              as_user_id: "wo_1"
              captures: { zone_glu: $.data.id }
            - call: "POST /bakery-distribution/lots"
              payload: { lot_code: "LOT-ATA-0001", product_id: "${prod_a}", zone_id: "${zone_glu}", manufactured_on: "2026-07-15T00:00:00Z", quantity_received_lb: 20000 }
              as: WarehouseOperator
              as_user_id: "wo_1"
              captures: { lot_a: $.data.id }
            - call: "POST /bakery-distribution/lots"
              payload: { lot_code: "LOT-ATB-0001", product_id: "${prod_b}", zone_id: "${zone_glu}", manufactured_on: "2026-07-15T00:00:00Z", quantity_received_lb: 1000 }
              as: WarehouseOperator
              as_user_id: "wo_1"
              captures: { lot_b: $.data.id }
            - call: "POST /bakery-distribution/orders"
              payload: { customer_id: "${cust_id}", delivery_mode: "BAGGED", requested_delivery_on: "2026-09-10T00:00:00Z" }
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /bakery-distribution/orders/${order_id}/lines"
              payload: { product_id: "${prod_a}", quantity_lb: 4000 }
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /bakery-distribution/orders/${order_id}/submit"
              payload: {}
              as: CustomerBuyer
              as_user_id: "${cust_id}"
            - call: "POST /bakery-distribution/orders/${order_id}/allocate"
              payload: {}
              as: WarehouseOperator
              as_user_id: "wo_1"
              captures: { ov: $.data.version }
            - call: "POST /bakery-distribution/substitution-requests"
              payload: { order_line_id: "${line_id}", proposed_product_id: "${prod_b}", rationale: "Premium flour offered while the base SKU is short", expected_order_version: "${ov}" }
              as: TechnicalSpecialist
              as_user_id: "ts_1"
              captures: { sub_id: $.data.id }
            - call: "POST /bakery-distribution/substitution-requests/${sub_id}/claim"
              payload: {}
              as: QualityManager
              as_user_id: "qm_1"
          trigger:
            - call: "POST /bakery-distribution/substitution-requests/${sub_id}/approve"
              payload: {}
              as: QualityManager
              as_user_id: "qm_1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409 and ${err} == ERR_NO_ELIGIBLE_LOT"
            - "SubstitutionRequest.${sub_id}.status == UNDER_REVIEW with decided_by_user_id == qm_1"
            - "OrderLine.${line_id}.product_id == ${prod_a}, substituted_from_product_id is null, unit_price_cents == 30 and lot_id == ${lot_a}"
            - "Lot.${lot_a}.quantity_reserved_lb == 4000 and Lot.${lot_b}.quantity_reserved_lb == 0"
            - "Order.${order_id}.total_cents == 121155 and Customer.${cust_id}.open_exposure_cents == 121155 (no partial reprice survives)"
            - "Customer.${cust_id}.allergen_risk_score == 55.00 and risk_tier == AMBER"
