              payload: { partner_id: "${p_pt_id}", order_type: "DROP_SHIP", list_amount_cents: 1000000 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { inv_pt_id: $.data.id }
