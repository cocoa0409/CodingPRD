              as: SanitationTech
              captures: { sanx: "$.data.id" }
            - call: "POST /sanitation-events/${sanx}/start"
              as: SanitationTech
              as_user_id: "sant-1"
            - call: "POST /sanitation-events/${sanx}/submit"
              payload: { disassembled_component_count: 12, atp_rlu: 250, allergen_swab_result: "NEGATIVE" }
              as: SanitationTech
              as_user_id: "sant-1"
            - call: "POST /sanitation-events/${sanx}/validate"
              payload: { outcome: "PASS" }
              as: QATechnician
              as_user_id: "qat-1"
            - call: "GET /lines/${line_id}/corrective-actions"
              as: QAManager
              captures: { ca_id: "$.data[0].id" }
            - call: "POST /process-runs"
              payload: { line_id: "${line_id}", product_id: "${prod_id}", customer_spec_id: "${spec_id}", wash_system_id: "${ws_id}", planned_start_at: "2026-08-04T07:00:00Z", planned_end_at: "2026-08-04T12:00:00Z", crew_size: 6 }
              as: LineOperator
              captures: { runy: "$.data.id" }
          trigger:
            - call: "POST /sanitation-events/${sanx}/start"
              as: SanitationTech
              as_user_id: "sant-2"
              captures: { st2: "$.data.status", attempts: "$.data.attempt_count", atp_reset: "$.data.atp_rlu", comp_reset: "$.data.disassembled_component_count" }
            - call: "POST /sanitation-events/${sanx}/submit"
              payload: { disassembled_component_count: 12, atp_rlu: 120, allergen_swab_result: "NEGATIVE" }
              as: SanitationTech
              as_user_id: "sant-2"
            - call: "POST /sanitation-events/${sanx}/validate"
              payload: { outcome: "PASS" }
              as: QATechnician
              as_user_id: "qat-1"
              captures: { st3: "$.data.status", vat: "$.data.validated_at" }
            - call: "GET /lines/${line_id}"
              as: QAManager
              captures: { posture_mid: "$.data.posture", last_valid: "$.data.last_validated_sanitation_at" }
            - call: "POST /process-runs/${runy}/start"
              as: LineOperator
              captures: { e_line: "$.data.error_id" }
            - call: "POST /corrective-actions/${ca_id}/start"
              as: QATechnician
              as_user_id: "qat-3"
            - call: "POST /corrective-actions/${ca_id}/submit-verification"
              payload: { action_taken: "Replaced the shredder gasket and re-cleaned the flume" }
              as: QATechnician
              as_user_id: "qat-3"
            - call: "POST /corrective-actions/${ca_id}/verify"
              payload: { outcome: "PASS" }
              as: QAManager
              as_user_id: "qam-1"
              captures: { ca_st: "$.data.status", ca_vat: "$.data.verified_at" }
            - call: "GET /lines/${line_id}"
              as: QAManager
              captures: { posture_end: "$.data.posture", ca_count_end: "$.data.open_corrective_action_count" }
            - call: "POST /process-runs/${runy}/start"
              as: LineOperator
              captures: { e_wash: "$.data.error_id" }
          assert:
            - "${st2} == IN_PROGRESS with ${attempts} == 2, ${atp_reset} null and ${comp_reset} == 0: the revert edge reuses the same row and wipes the previous measurements"
            - "${st3} == VALIDATED with ${vat} non-null and ${last_valid} == ${vat}"
            - "${posture_mid} == RESTRICTED all the same: the projection's open_major branch is evaluated before the latest_sanitation branch"
            - "${e_line} == ERR_LINE_NOT_OPEN with HTTP 409 while the corrective action is unverified"
            - "${ca_st} == VERIFIED, ${ca_vat} non-null, ${ca_count_end} == 0 and ${posture_end} == OPEN"
            - "${e_wash} == ERR_WASH_SYSTEM_DUMP_REQUIRED on the second start attempt: verifying the action exposed the next gate at priority 42 rather than letting the run start, and the FROZEN-to-OPEN recompute never un-cancelled RUN_X"

      - name: corner_sanitation_start_blocked_while_a_run_is_running
        claim_type: Precondition Enforcement
        grounds:
          - validations[priority=57]
          - state_machines[SanitationEvent].transitions[SCHEDULED->IN_PROGRESS]
        distinguishing_aspect: "A sanitation start is refused with ERR_LINE_RUN_IN_PROGRESS while any run on the line is RUNNING, and the same call succeeds once that run is CLOSED, so the block is on the RUNNING state and not on the run's existence."
        test_recipe:
          setup: ["execute BASE steps 1-19, so RUN1 on L1 is RUNNING with 30000 lb consumed and the clock is 2026-08-03T07:00:00Z"]
          setup_api_calls:
