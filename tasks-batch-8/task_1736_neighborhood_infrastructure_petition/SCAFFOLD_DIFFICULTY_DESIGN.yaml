      - 'Identity after refund: ${paid1} - ${ref1} == 100000 + ${cred1}  (120000 - 20000 == 100000 + 0)'
  - name: signature_tally_verify_withdraw_conservation
    grounds:
    - state_machines.PetitionSignature.SUBMITTED_to_VERIFIED
    - state_machines.PetitionSignature.VERIFIED_to_WITHDRAWN
    - entities.Petition.fields.verified_signature_count
    - entities.Petition.fields.verified_frontage_ft
    distinguishing_aspect: 'Conserved quantity = petition verified tallies (different conserved quantity than money): the verify/withdraw compensating pair leaves verified_signature_count and verified_frontage_ft
      exactly consistent with the set of VERIFIED signatures at every step (2 / 100.00 after verifies; 1 / 40.00 after withdrawing the 60.00-ft signature).'
    test_recipe:
      setup:
      - District CI2 with parcels P-001 (60.00 ft, owner O1) and P-002 (40.00 ft, owner O2); petition circulating; both owners' signatures SUBMITTED
      setup_api_calls:
      - call: POST /districts
        payload:
          name: CI2
          methodology: PER_PARCEL
          interest_method: SIMPLE
          season_start_mmdd: 03-01
          season_end_mmdd: 11-30
        as: CityClerk
        captures:
          ci2_d: $.data.id
      - call: POST /owners
        payload:
          full_name: Owner ci21
          email: ci2-o1@x.test
          mailing_address: 1 Main St
        as: CityClerk
        captures:
          ci2_o1: $.data.id
      - call: POST /owners
        payload:
          full_name: Owner ci22
          email: ci2-o2@x.test
          mailing_address: 2 Main St
        as: CityClerk
        captures:
          ci2_o2: $.data.id
      - call: POST /parcels
        payload:
          district_id: ${ci2_d}
          owner_id: ${ci2_o1}
          parcel_number: P-001
          frontage_ft: 60.0
        as: CityClerk
        captures:
          ci2_p1: $.data.id
      - call: POST /parcels
        payload:
          district_id: ${ci2_d}
          owner_id: ${ci2_o2}
          parcel_number: P-002
          frontage_ft: 40.0
        as: CityClerk
        captures:
          ci2_p2: $.data.id
      - call: POST /petitions
        payload:
          district_id: ${ci2_d}
        as: CityClerk
        captures:
          ci2_pet: $.data.id
      - call: POST /signatures
        payload:
          petition_id: ${ci2_pet}
          parcel_id: ${ci2_p1}
        as: PropertyOwner
        as_user_id: ${ci2_o1}
        captures:
          ci2_s1: $.data.id
      - call: POST /signatures
        payload:
          petition_id: ${ci2_pet}
          parcel_id: ${ci2_p2}
        as: PropertyOwner
        as_user_id: ${ci2_o2}
        captures:
          ci2_s2: $.data.id
      - call: POST /signatures/${ci2_s1}/verify
        payload: {}
        as: CityClerk
      - call: POST /signatures/${ci2_s2}/verify
        payload: {}
        as: CityClerk
      - call: GET /petitions/${ci2_pet}
        payload: {}
        as: CityClerk
        captures:
          cnt_v: $.data.verified_signature_count
          fr_v: $.data.verified_frontage_ft
      - call: POST /signatures/${ci2_s1}/withdraw
        payload: {}
        as: PropertyOwner
        as_user_id: ${ci2_o1}
      trigger:
      - call: GET /petitions/${ci2_pet}
        payload: {}
        as: CityClerk
        captures:
          cnt_w: $.data.verified_signature_count
          fr_w: $.data.verified_frontage_ft
      - call: GET /signatures/${ci2_s1}
        payload: {}
        as: CityClerk
        captures:
          s1_st: $.data.status
      assert:
      - 'After two verifies: ${cnt_v} == 2 and ${fr_v} == 100.00'
      - 'After withdrawing the 60.00-ft signature: ${cnt_w} == 1 and ${fr_w} == 40.00 (net of the compensating pair == single remaining VERIFIED signature)'
      - Withdrawn signature status == WITHDRAWN
