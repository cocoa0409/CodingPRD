          - "calculations.plan_sample_accounting"
        distinguishing_aspect: "A post-flow reading of 2.2 against pre 2.0 (drift 10.0%) flips the calibration INVALID and immediately invalidates the COLLECTED linked sample with reason PUMP_DRIFT, dropping plan.active_sample_count from 1 to 0."
