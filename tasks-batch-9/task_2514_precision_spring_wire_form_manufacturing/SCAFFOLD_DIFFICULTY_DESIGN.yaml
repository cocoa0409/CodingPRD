      - name: stress_relief_oven_closed_intervals_with_aggregate_multi_batch_capacity
        resource_entity: StressReliefOven
        interval_semantics: "CLOSED [window_start, window_end] with NO buffer, and the resource is MULTI-OCCUPANCY: overlap alone is legal, only the summed load over the intersecting set is capped"
        grounds:
          - calculations.oven_interval_load
          - validations[priority=71]
          - errors.ERR_OVEN_CAPACITY_EXCEEDED
          - entities.StressReliefOven.fields.capacity_kg
          - endpoints["POST /heat-treat-batches"]
        distinguishing_aspect: |
          The oven's semantics are deliberately the opposite of the coiler's on both axes: intervals are CLOSED
          (touching endpoints DO collide) and there is no buffer, and the resource is shared, so the rule is an
          aggregate over the set of batches intersecting the new window instead of a single-occupancy veto. A
          straddling window therefore has to sum TWO different existing batches, and a window that only touches a
          cancelled batch sums nothing at all.
