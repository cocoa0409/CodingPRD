            - "the sent reminder's status == SENT and sent_on == 2027-03-01"

      - name: tickets_filtered_list_reverse_reachable_from_item
        claim_type: Cross-reference link
        grounds:
          - endpoints.GET_/medical-id/verification-tickets
          - entities.VerificationTicket.fields.record_item_id
        distinguishing_aspect: "GET /verification-tickets?record_item_id=<id> returns exactly the tickets for that item across rounds — reverse reachability for cascade-created tickets whose ids never appear in creation responses."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member with one item whose round-1 ticket was REJECTED and round-2 resubmitted (two tickets)."
          setup_api_calls:
