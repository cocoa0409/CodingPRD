      - name: valve_close_reopen_count_parity
        grounds:
          - entities.Device.fields.close_count
          - entities.Device.fields.reopen_count
          - entities.Device.fields.valve_state
          - entities.IrrigationWindow.fields.status
          - entities.IrrigationWindow.fields.suspended_at
          - state_machines.Device.valve_state.OPEN_to_CLOSED
          - state_machines.Device.valve_state.CLOSED_to_OPEN
          - calculations.auto_shutoff_decision
          - validations[priority=22]
        distinguishing_aspect: |
          CONSERVED QUANTITY = the valve parity ledger Device.close_count - Device.reopen_count, which must equal 1
          whenever valve_state == CLOSED and 0 whenever valve_state == OPEN, however many auto and manual cycles ran;
          each CLOSED->OPEN transition must COMPENSATE its own CLOSE side effects, returning every
          SUSPENDED_BY_SHUTOFF IrrigationWindow of the property to ACTIVE with suspended_at back to null. This is a
          physical open/close ledger over Device and IrrigationWindow rows, a different conserved quantity from
          credit_ledger_clawback_reconciliation, which conserves monetary cents on InsurancePolicy.
        test_recipe:
          setup:
            - "Homeowner ${h1} owns Property ${p1} (irrigation_present true); Device ${d1} on that property is install-verified at 62.0 psi by InstallerTech user tech-01."
            - "Three DEVICE readings at 2026-08-01T00:00Z / 00:20Z / 00:40Z closed learning cycle 1: BaselineProfile learning_state COMPLETE, baseline_static_pressure_psi 60.0, baseline_peak_flow_gpm 6.00, drip_threshold_gpm 0.12, baseline_version 3."
            - "Device ${d1} is ARMED with valve_state OPEN and monitor_mode NORMAL; the logical clock stands at 2026-08-01T06:05:00Z."
            - "An ACTIVE IrrigationWindow ${iw1} is registered on Property ${p1} for 2026-08-05T09:00Z..11:00Z with expected_max_flow_gpm 9.0, so every shutoff has a suspend side effect that a reopen must compensate."
            - "At 2026-08-01T07:00:00Z a catastrophic-burst reading (30.0 psi, 12.0 gpm, 6 min, 72.0 gal) minted AnomalyEvent ${ev1} in ALERTED and drove the auto-shutoff: Device ${d1} valve_state == CLOSED, close_count == 1, reopen_count == 0, last_shutoff_at == 2026-08-01T07:00:00Z, and IrrigationWindow ${iw1} == SUSPENDED_BY_SHUTOFF with suspended_at == 2026-08-01T07:00:00Z."
            - "The clock stands at 2026-08-01T07:00:00Z and ${ev1} is still ALERTED, so each OPEN must carry acknowledge_water_damage_risk true plus an override_reason to clear priority-22."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:05:00Z" }
              as: ProgramAdmin
            - call: "POST /homeowners"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", phone_e164: "+14155550101" }
              as: ProgramAdmin
              captures: { h1: $.data.id }
            - call: "POST /properties"
              payload: { homeowner_id: "${h1}", address_line1: "14 Cedar Ln", city: "Somerville", state_code: "MA", postal_code: "02143", year_built: 1968, irrigation_present: true }
              as: Homeowner
              as_user_id: "${h1}"
              captures: { p1: $.data.id }
            - call: "POST /devices"
              payload: { property_id: "${p1}", serial_number: "FLO-000001", model_code: "FLO_SMART_3_4" }
              as: InstallerTech
              as_user_id: "tech-01"
              captures: { d1: $.data.id }
            - call: "POST /devices/${d1}/verify-install"
              payload: { installed_static_pressure_psi: 62.0, pressure_drop_psi: 0.8 }
              as: InstallerTech
              as_user_id: "tech-01"
            - call: "POST /devices/${d1}/telemetry"
