# =============================================================================
# PRD Benchmark Scaffold — Veterans Education Benefit Certification
# task_2396 · §1.0–§1.7
# =============================================================================

scenario: |
  2396. Veterans Education Benefit Certification (university school certifying official): student benefit chapter identification and entitlement verification, enrollment certification of credit hours and term dates with rounding rules, tuition and fee reporting for the covered portion and yellow ribbon matching, change-in-enrollment reporting deadlines and debt creation, prohibition on penalizing students for delayed benefit payments, housing allowance implications for online-only and reduced enrollment, program approval and catalog compliance with the state approving agency, overpayment reconciliation and student debt notification

domain_name: "veterans-education-benefit-certification"
api_prefix: "/"

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Ledger reconciliation"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  # Peer entities linked by foreign keys in request bodies; the only nested URL in
  # the surface is the append-only audit sub-resource. No ownership tree.
  state_machine_shape: cyclic
  # VeteranStudent.coe_status (VERIFIED -> EXPIRED -> VERIFIED), CatalogVersion
  # (REJECTED/SUSPENDED -> PENDING_SAA), Program (APPROVED -> PENDING_SAA),
  # EnrollmentCertification (SUBMITTED -> RETURNED -> DRAFT -> SUBMITTED and
  # CERTIFIED -> AMENDMENT_PENDING -> CERTIFIED). Two entities additionally carry
  # parallel state dimensions (VeteranStudent.coe_status x account_hold_status;
  # BenefitDebt.collection_status x notification_status).
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  # polymorphic: BenefitDebt.debtor_type selects whether the obligor is the
  # VeteranStudent referenced by student_id or the school itself (no entity row),
  # which changes notification and waiver semantics on the same table.
  role_model: segregation_of_duties
  # The official who submits an EnrollmentCertification may not certify it, and the
  # official who reconciles an EnrollmentChangeReport may not waive the resulting
  # BenefitDebt.
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CertifyingOfficial
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Legal name of the school certifying official as filed with VA"
      - name: email
        type: string
        source: input
        description: "Institutional email; unique across CertifyingOfficial rows"
        constraints: "unique"
      - name: official_level
        type: enum
        source: input
        description: "Authority tier of the official"
        constraints: "one of {SCO, SUPERVISORY}"
      - name: status
        type: enum
        source: system
        description: "Lifecycle status; only ACTIVE officials may act"
        default: ACTIVE
        constraints: "one of {ACTIVE, INACTIVE}"

  - name: VeteranStudent
    parent: null
    common_fields: true
    fields:
      - name: student_number
        type: string
        source: input
        description: "Institutional student number; unique across VeteranStudent rows"
        constraints: "unique"
      - name: full_name
        type: string
        source: input
        description: "Student legal name"
      - name: chapter
        type: enum
        source: input
        description: "VA education benefit chapter the student is entitled under"
        constraints: "one of {CH30, CH31, CH33, CH35, CH1606}"
      - name: benefit_level_pct
        type: integer
        source: input
        description: "Percentage of the maximum benefit the student is entitled to, from the Certificate of Eligibility"
        constraints: "one of {40, 50, 60, 70, 80, 90, 100}"
      - name: entitlement_days_granted
        type: integer
        source: input
        description: "Total entitlement days granted on the Certificate of Eligibility; never mutated after creation"
        constraints: ">= 1"
      - name: entitlement_days_remaining
        type: integer
        source: computed
        description: "Entitlement days not yet charged; initialized to entitlement_days_granted, debited on certify and restored on reconcile per INV-1"
      - name: delimiting_date
        type: datetime
        source: input
        description: "Date after which entitlement may no longer be used (ISO 8601 date, 00:00:00Z)"
      - name: coe_issued_on
        type: datetime
        source: input
        description: "Issue date printed on the Certificate of Eligibility; optional at creation, mandatory at COE verification"
        default: null
      - name: coe_status
        type: enum
        source: system
        description: "Entitlement-verification state of the Certificate of Eligibility"
        default: NOT_SUBMITTED
        constraints: "one of {NOT_SUBMITTED, VERIFIED, EXPIRED}"
      - name: coe_verified_on
        type: datetime
        source: computed
        description: "Logical-clock date on which the COE was last verified; null while coe_status != VERIFIED"
        default: null
      - name: verified_document_reference
        type: string
        source: computed
        description: "Document reference recorded by the last COE verification"
        default: null
      - name: protected_until
        type: datetime
        source: computed
        description: "coe_verified_on + COE_PROTECTION_DAYS; end of the 38 USC 3679(e) protection window"
        default: null
      - name: benefit_payment_protected
        type: boolean
        source: computed
        description: "Snapshot of CALC-7's live predicate; recomputed by verify-coe, expire-coe, certify, record-va-payment and every clock advance"
        default: false
      - name: account_hold_status
        type: enum
        source: system
        description: "Bursar hold dimension, independent of coe_status"
        default: NONE
        constraints: "one of {NONE, REGISTRATION_HOLD}"
      - name: open_debt_principal_cents
        type: integer
        source: computed
        description: "Sum of principal_cents over this student's BenefitDebt rows with debtor_type = STUDENT and collection_status IN {OPEN, PARTIALLY_REPAID}"
        default: 0

  - name: AcademicTerm
    parent: null
    common_fields: true
    fields:
      - name: term_code
        type: string
        source: input
        description: "Registrar term code; unique across AcademicTerm rows"
        constraints: "unique"
      - name: academic_year
        type: string
        source: input
        description: "VA award year label used as the annual tuition-cap and Yellow Ribbon scope key, e.g. AY2026-2027"
      - name: term_type
        type: enum
        source: input
        description: "Term kind"
        constraints: "one of {FALL, SPRING, SUMMER, WINTER}"
      - name: start_date
        type: datetime
        source: input
        description: "First instructional day (ISO 8601 date, 00:00:00Z)"
      - name: end_date
        type: datetime
        source: input
        description: "Last instructional day, inclusive"
      - name: drop_deadline
        type: datetime
        source: input
        description: "Last day a student may drop without a punitive grade"
      - name: certification_deadline
        type: datetime
        source: input
        description: "Last day an EnrollmentCertification for this term may be certified"
      - name: status
        type: enum
        source: system
        description: "Term availability for new submissions"
        default: OPEN
        constraints: "one of {OPEN, CLOSED}"

  - name: Program
    parent: null
    common_fields: true
    fields:
      - name: program_code
        type: string
        source: input
        description: "Institutional program code; unique across Program rows"
        constraints: "unique"
      - name: name
        type: string
        source: input
        description: "Program title as printed in the catalog"
      - name: degree_level
        type: enum
        source: input
        description: "Degree level; must equal the YellowRibbonAgreement degree_level to draw on that agreement"
        constraints: "one of {UNDERGRAD, GRADUATE, CERTIFICATE}"
      - name: full_time_credit_hours
        type: integer
        source: input
        description: "Credit hours the institution defines as full time for this program; denominator of CALC-1"
        constraints: ">= 1"
      - name: campus_bah_monthly_cents
        type: integer
        source: input
        description: "Monthly BAH rate for the campus ZIP at the E-5-with-dependents level, in cents; base of CALC-1's residential monthly housing rate"
        constraints: ">= 0"
      - name: approval_status
        type: enum
        source: system
        description: "State Approving Agency approval posture; gates certification"
        default: DRAFT
        constraints: "one of {DRAFT, PENDING_SAA, APPROVED, CONDITIONAL, SUSPENDED}"
      - name: approved_catalog_version_id
        type: string
        source: computed
        description: "FK -> CatalogVersion.id; the catalog version the SAA last approved for this program, null while no approval exists"
        default: null

  - name: CatalogVersion
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; the program this catalog version describes"
      - name: catalog_year
        type: string
        source: input
        description: "Catalog year label, e.g. 2026-2027"
      - name: effective_start
        type: datetime
        source: input
        description: "First day the catalog version governs (half-open interval start, inclusive)"
      - name: effective_end
        type: datetime
        source: input
        description: "Day the catalog version stops governing (half-open interval end, EXCLUSIVE)"
      - name: has_published_tuition_schedule
        type: boolean
        source: input
        description: "Catalog compliance checklist item 1: published tuition and fee schedule"
      - name: has_refund_policy
        type: boolean
        source: input
        description: "Catalog compliance checklist item 2: pro-rata refund policy"
      - name: has_program_length_disclosure
        type: boolean
        source: input
        description: "Catalog compliance checklist item 3: program length and credit-hour disclosure"
      - name: conditions_note
        type: string
        source: computed
        description: "Conditions recorded by the SAA when the decision was APPROVED_WITH_CONDITIONS"
        default: null
      - name: suspension_reason
        type: string
        source: computed
        description: "Reason recorded by the SAA when the catalog version was suspended"
        default: null
      - name: review_status
        type: enum
        source: system
        description: "SAA review state of this catalog version"
        default: DRAFT
        constraints: "one of {DRAFT, PENDING_SAA, APPROVED, APPROVED_WITH_CONDITIONS, REJECTED, SUSPENDED}"

  - name: YellowRibbonAgreement
    parent: null
    common_fields: true
    fields:
      - name: academic_year
        type: string
        source: input
        description: "Award year the agreement covers; must equal the certified term's academic_year"
      - name: degree_level
        type: enum
        source: input
        description: "Degree level the agreement covers; must equal the certified Program.degree_level"
        constraints: "one of {UNDERGRAD, GRADUATE, CERTIFICATE}"
      - name: per_student_annual_cap_cents
        type: integer
        source: input
        description: "Maximum school share this agreement will contribute per student per academic_year"
        constraints: ">= 0"
      - name: annual_pool_cents
        type: integer
        source: input
        description: "Total school share available under this agreement for the academic_year; never mutated after creation"
        constraints: ">= 0"
      - name: max_participants
        type: integer
        source: input
        description: "Maximum number of PROVISIONAL or FINAL awards this agreement may carry"
        constraints: ">= 1"
      - name: pool_remaining_cents
        type: integer
        source: computed
        description: "Unspent school share; initialized to annual_pool_cents, debited on award creation and restored on reversal per INV-2"
      - name: participant_count
        type: integer
        source: computed
        description: "Count of YellowRibbonAward rows on this agreement with status IN {PROVISIONAL, FINAL}"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Agreement availability for new awards"
        default: ACTIVE
        constraints: "one of {ACTIVE, CLOSED}"

  - name: EnrollmentCertification
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> VeteranStudent.id; the certified student"
      - name: term_id
        type: string
        source: input
        description: "FK -> AcademicTerm.id; the term being certified"
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; the program of enrollment"
      - name: pinned_catalog_version_id
        type: string
        source: computed
        description: "FK -> CatalogVersion.id; the effective catalog version pinned at submit, resolved per validation priority 24"
        default: null
      - name: submitted_by_official_id
        type: string
        source: computed
        description: "FK -> CertifyingOfficial.id; X-User-ID of the official who last submitted this certification"
        default: null
      - name: certified_by_official_id
        type: string
        source: computed
        description: "FK -> CertifyingOfficial.id; X-User-ID of the official who certified it, must differ from submitted_by_official_id"
        default: null
      - name: credit_hours_total
        type: number
        source: input
        description: "Total credit hours certified for the term, halves permitted"
        constraints: "> 0"
      - name: credit_hours_online
        type: number
        source: input
        description: "Portion of credit_hours_total delivered fully online; must be <= credit_hours_total"
        constraints: ">= 0"
      - name: term_start_certified
        type: datetime
        source: input
        description: "Certified first day of the student's enrollment period; must fall within the term's start_date..end_date"
      - name: term_end_certified
        type: datetime
        source: input
        description: "Certified last day of the student's enrollment period, inclusive"
      - name: certified_days
        type: integer
        source: computed
        description: "Inclusive day count of term_start_certified..term_end_certified per CALC-1"
      - name: rate_of_pursuit_pct
        type: integer
        source: computed
        description: "Rate of pursuit as an integer percent per CALC-1"
      - name: rop_tier_pct
        type: integer
        source: computed
        description: "Rate of pursuit rounded to the nearest ten and capped at 100 per CALC-1; the housing-allowance and entitlement multiplier"
      - name: training_time
        type: enum
        source: computed
        description: "Training-time band per CALC-1"
        constraints: "one of {FULL_TIME, THREE_QUARTER, HALF_TIME, QUARTER_TIME, LESS_THAN_QUARTER}"
      - name: modality
        type: enum
        source: computed
        description: "Delivery modality derived from credit_hours_online vs credit_hours_total per CALC-1"
        constraints: "one of {RESIDENTIAL, MIXED, ONLINE_ONLY}"
      - name: mha_eligible
        type: boolean
        source: computed
        description: "True iff student.chapter == CH33 AND rate_of_pursuit_pct > MHA_MIN_ROP_PCT per CALC-1"
      - name: mha_monthly_rate_cents
        type: integer
        source: computed
        description: "Monthly housing allowance rate per CALC-1; 0 when mha_eligible is false"
        default: 0
      - name: mha_term_total_cents
        type: integer
        source: computed
        description: "Housing allowance owed for the certified period per CALC-2; written at certify and rewritten at reconcile"
        default: 0
      - name: net_covered_cents
        type: integer
        source: computed
        description: "Covered tuition-and-fee portion per CALC-3 step S1, sourced from the REPORTED TuitionFeeReport"
        default: 0
      - name: ay_cap_remaining_before_cents
        type: integer
        source: computed
        description: "Annual tuition cap left for this student and academic_year before this certification, per CALC-3 step S3"
        default: 0
      - name: va_tuition_cents
        type: integer
        source: computed
        description: "Tuition and fees VA will pay per CALC-3 step S5"
        default: 0
      - name: cap_charged_cents
        type: integer
        source: computed
        description: "Amount this certification charges against the annual tuition cap per CALC-3 step S6; excludes any Yellow Ribbon VA match"
        default: 0
      - name: yr_gap_cents
        type: integer
        source: computed
        description: "Unmet tuition gap eligible for Yellow Ribbon matching per CALC-3 step S7"
        default: 0
      - name: entitlement_days_charged
        type: integer
        source: computed
        description: "Entitlement days this certification consumes per CALC-4"
        default: 0
      - name: tuition_paid_cents
        type: integer
        source: computed
        description: "Tuition actually disbursed by VA, recorded by POST /enrollment-certifications/{id}/record-va-payment"
        default: 0
      - name: mha_paid_cents
        type: integer
        source: computed
        description: "Housing allowance actually disbursed by VA, recorded by POST /enrollment-certifications/{id}/record-va-payment"
        default: 0
      - name: tuition_payment_posted_on
        type: datetime
        source: computed
        description: "Date VA's tuition payment posted; null while VA payment is outstanding, which is what CALC-7 protects the student against"
        default: null
      - name: amount_basis
        type: enum
        source: computed
        description: "Which CALC-3 / CALC-2 / CALC-4 variant produced the currently stored amounts"
        default: null
        constraints: "one of {AS_CERTIFIED, AS_RECONCILED}"
      - name: return_reason
        type: string
        source: computed
        description: "Reason recorded by the last return, whether supervisory or cascaded from a catalog suspension"
        default: null
      - name: status
        type: enum
        source: system
        description: "Certification lifecycle state"
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, RETURNED, CERTIFIED, AMENDMENT_PENDING, TERMINATED, VOID}"

  - name: TuitionFeeReport
    parent: null
    common_fields: true
    fields:
      - name: certification_id
        type: string
        source: input
        description: "FK -> EnrollmentCertification.id; the certification this report prices"
      - name: gross_tuition_cents
        type: integer
        source: input
        description: "Gross tuition assessed for the certified period"
        constraints: ">= 0"
      - name: mandatory_fees_cents
        type: integer
        source: input
        description: "Mandatory fees charged to all students in the program"
        constraints: ">= 0"
      - name: tuition_specific_aid_cents
        type: integer
        source: input
        description: "Aid restricted to tuition and fees; subtracted in CALC-3 step S1"
        constraints: ">= 0"
      - name: non_tuition_aid_cents
        type: integer
        source: input
        description: "Aid not restricted to tuition and fees; deliberately NOT subtracted in CALC-3 step S1"
        constraints: ">= 0"
      - name: net_covered_cents
        type: integer
        source: computed
        description: "CALC-3 step S1 result for this report"
      - name: status
        type: enum
        source: system
        description: "REPORTED for the report in force; SUPERSEDED once a later report for the same certification is accepted"
        default: REPORTED
        constraints: "one of {REPORTED, SUPERSEDED}"

  - name: YellowRibbonAward
    parent: null
    common_fields: true
    fields:
      - name: certification_id
        type: string
        source: input
        description: "FK -> EnrollmentCertification.id; the certification whose yr_gap_cents is being matched"
      - name: agreement_id
        type: string
        source: input
        description: "FK -> YellowRibbonAgreement.id; the agreement drawn on"
      - name: yr_gap_basis_cents
        type: integer
        source: computed
        description: "Snapshot of certification.yr_gap_cents at award creation"
      - name: per_student_remaining_before_cents
        type: integer
        source: computed
        description: "Per-student agreement headroom before this award, per CALC-3 step S8"
      - name: pool_remaining_before_cents
        type: integer
        source: computed
        description: "Snapshot of agreement.pool_remaining_cents before this award"
      - name: school_share_cents
        type: integer
        source: computed
        description: "School contribution per CALC-3 step S8"
      - name: va_match_cents
        type: integer
        source: computed
        description: "VA dollar-for-dollar match, always equal to school_share_cents; never charged against the annual tuition cap"
      - name: student_out_of_pocket_cents
        type: integer
        source: computed
        description: "Residual tuition the student owes after school share and VA match, floored at 0"
      - name: reversal_reason
        type: string
        source: computed
        description: "Reason recorded when the award was reversed"
        default: null
      - name: status
        type: enum
        source: system
        description: "Award lifecycle state"
        default: PROVISIONAL
        constraints: "one of {PROVISIONAL, FINAL, REVERSED}"

  - name: EnrollmentChangeReport
    parent: null
    common_fields: true
    fields:
      - name: certification_id
        type: string
        source: input
        description: "FK -> EnrollmentCertification.id; the certification being amended"
      - name: reconciled_by_official_id
        type: string
        source: computed
        description: "FK -> CertifyingOfficial.id; X-User-ID of the official who reconciled the change, must differ from the official who later waives the resulting debt"
        default: null
      - name: change_type
        type: enum
        source: input
        description: "Kind of change in enrollment being reported"
        constraints: "one of {CREDIT_HOUR_REDUCTION, COMPLETE_WITHDRAWAL, TERM_DATE_CHANGE}"
      - name: effective_date
        type: datetime
        source: input
        description: "Date the change takes effect; must fall within term_start_certified..term_end_certified"
      - name: new_credit_hours
        type: number
        source: input
        description: "Credit hours after the change; required for CREDIT_HOUR_REDUCTION, ignored otherwise"
        default: null
      - name: new_credit_hours_online
        type: number
        source: input
        description: "Online portion after the change; required for CREDIT_HOUR_REDUCTION, ignored otherwise"
        default: null
      - name: new_term_end_certified
        type: datetime
        source: input
        description: "Replacement inclusive end date; required for TERM_DATE_CHANGE, ignored otherwise"
        default: null
      - name: mitigating_circumstances_flag
        type: boolean
        source: input
        description: "True when VA-acceptable mitigating circumstances are on file; suppresses tuition proration for COMPLETE_WITHDRAWAL per CALC-3 variant AS_RECONCILED"
      - name: punitive_grade_flag
        type: boolean
        source: input
        description: "True when the institution intends to assign a punitive grade for the withdrawal"
        default: false
      - name: disbursed_tuition_aid_cents
        type: integer
        source: input
        description: "Tuition aid already disbursed to the student at the time of the change; informational for liability review"
        default: 0
      - name: reported_on
        type: datetime
        source: computed
        description: "Logical-clock date at which this change report was created"
      - name: days_late
        type: integer
        source: computed
        description: "reported_on minus effective_date in whole days per CALC-5; may be negative for advance reporting"
      - name: reporting_status
        type: enum
        source: computed
        description: "Timeliness against REPORTING_DEADLINE_DAYS per CALC-5"
        constraints: "one of {TIMELY, LATE}"
      - name: liability_party
        type: enum
        source: computed
        description: "Who owes any resulting overpayment per CALC-5"
        constraints: "one of {STUDENT, SCHOOL}"
      - name: status
        type: enum
        source: system
        description: "Change report lifecycle state"
        default: REPORTED
        constraints: "one of {REPORTED, RECONCILED}"

  - name: BenefitDebt
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: computed
        description: "FK -> VeteranStudent.id; the student the overpayment relates to, regardless of debtor_type"
      - name: certification_id
        type: string
        source: computed
        description: "FK -> EnrollmentCertification.id; the certification whose amounts moved"
      - name: change_report_id
        type: string
        source: computed
        description: "FK -> EnrollmentChangeReport.id; the reconciliation that created this debt"
      - name: waived_by_official_id
        type: string
        source: computed
        description: "FK -> CertifyingOfficial.id; X-User-ID of the official who waived the debt, null while not waived"
        default: null
      - name: debtor_type
        type: enum
        source: computed
        description: "Obligor selected by CALC-6 step R5 from the change report's liability_party"
        constraints: "one of {STUDENT, SCHOOL}"
      - name: source
        type: enum
        source: computed
        description: "Why the debt exists, per CALC-6 step R5"
        constraints: "one of {AMENDMENT_OVERPAYMENT, LATE_REPORTING_LIABILITY}"
      - name: principal_cents
        type: integer
        source: computed
        description: "tuition_component_cents + mha_component_cents per CALC-6 step R3; never mutated after creation"
      - name: tuition_component_cents
        type: integer
        source: computed
        description: "Tuition overpayment portion per CALC-6 step R3; first bucket of the repayment waterfall"
      - name: mha_component_cents
        type: integer
        source: computed
        description: "Housing allowance overpayment portion per CALC-6 step R3; second bucket of the repayment waterfall"
      - name: repaid_cents
        type: integer
        source: computed
        description: "tuition_repaid_cents + mha_repaid_cents"
        default: 0
      - name: tuition_repaid_cents
        type: integer
        source: computed
        description: "Portion of tuition_component_cents repaid so far"
        default: 0
      - name: mha_repaid_cents
        type: integer
        source: computed
        description: "Portion of mha_component_cents repaid so far"
        default: 0
      - name: outstanding_cents
        type: integer
        source: computed
        description: "principal_cents - repaid_cents"
      - name: collection_status
        type: enum
        source: system
        description: "Collection dimension, independent of notification_status"
        default: OPEN
        constraints: "one of {OPEN, PARTIALLY_REPAID, SATISFIED, WAIVED}"
      - name: notification_status
        type: enum
        source: system
        description: "Debt-notification dimension, independent of collection_status"
        default: PENDING
        constraints: "one of {PENDING, SENT, ACKNOWLEDGED, OVERDUE}"
      - name: notification_due_on
        type: datetime
        source: computed
        description: "Creation clock date + DEBT_NOTIFICATION_DAYS; the deadline for notifying the debtor"
      - name: notified_on
        type: datetime
        source: computed
        description: "Logical-clock date the notification was sent"
        default: null
      - name: acknowledged_on
        type: datetime
        source: computed
        description: "Logical-clock date the student acknowledged the debt"
        default: null
      - name: notification_channel
        type: enum
        source: computed
        description: "Channel used for the notification"
        default: null
        constraints: "one of {EMAIL, POSTAL, PORTAL}"
      - name: waiver_reason
        type: string
        source: computed
        description: "Reason recorded when the debt was waived"
        default: null

  - name: StudentAccountCharge
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> VeteranStudent.id; the charged student"
      - name: term_id
        type: string
        source: input
        description: "FK -> AcademicTerm.id; the term the charge belongs to"
      - name: charge_type
        type: enum
        source: input
        description: "Charge kind; LATE_FEE and REINSTATEMENT_FEE are penalty charges barred by 38 USC 3679(e) during the protection window"
        constraints: "one of {TUITION, MANDATORY_FEE, LATE_FEE, REINSTATEMENT_FEE}"
      - name: amount_cents
        type: integer
        source: input
        description: "Charge amount in cents"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Charge posting state; charges are never reversed in this surface"
        default: POSTED
        constraints: "one of {POSTED}"

  - name: CertificationAuditEntry
    parent: null
    common_fields: false
    fields:
      - name: certification_id
        type: string
        source: computed
        description: "FK -> EnrollmentCertification.id; the certification this append-only entry documents"
      - name: event_type
        type: enum
        source: computed
        description: "Audited event"
        constraints: "one of {CERTIFICATION_SUBMITTED, CERTIFICATION_RETURNED, CERTIFICATION_CERTIFIED, CERTIFICATION_AUTO_RETURNED, CERTIFICATION_VOIDED, AMENDMENT_OPENED, AMENDMENT_RECONCILED, DEBT_CREATED, DEBT_WAIVED, VA_PAYMENT_RECORDED, AWARD_REVERSED}"
      - name: actor_role
        type: enum
        source: computed
        description: "X-User-Role of the actor, or system for cascaded entries"
        constraints: "one of {SchoolCertifyingOfficial, SupervisorySCO, StateApprovingAgent, BursarOfficer, VaProcessingOffice, Student, system}"
      - name: actor_user_id
        type: string
        source: computed
        description: "Raw X-User-ID string of the actor, or the literal system for cascaded entries; deliberately NOT a foreign key, since opaque roles carry ids that match no entity"
      - name: detail
        type: string
        source: computed
        description: "Human-readable summary of the audited event"
      - name: sequence_index
        type: integer
        source: computed
        description: "Per-certification counter starting at 1, assigned in ascending created_at order of the entries on that certification"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CertifyingOfficial
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /certifying-officials/{id}/deactivate"
        actor: VaProcessingOffice
        preconditions:
          - "official.status == ACTIVE, else ERR_OFFICIAL_ALREADY_INACTIVE"
        side_effects:
          - "sets status = INACTIVE; every later request whose X-User-ID equals this official's id is rejected with ERR_OFFICIAL_INACTIVE at validation priority 5"

  - entity: VeteranStudent
    initial_state: NOT_SUBMITTED
    terminal_states: []
    note: "coe_status dimension. VeteranStudent additionally carries the INDEPENDENT account_hold_status dimension declared as a separate machine below; the two dimensions evolve on the same row without constraining each other."
    transitions:
      - from: NOT_SUBMITTED
        to: VERIFIED
        trigger: "POST /veteran-students/{id}/verify-coe"
        actor: SchoolCertifyingOfficial
        preconditions:
          - "student.coe_status IN {NOT_SUBMITTED, EXPIRED}, else ERR_COE_ALREADY_VERIFIED"
        side_effects:
          - "sets coe_issued_on, verified_document_reference, coe_verified_on = logical clock date"
          - "sets protected_until = coe_verified_on + COE_PROTECTION_DAYS (CALC-7)"
          - "recomputes benefit_payment_protected per CALC-7"
      - from: EXPIRED
        to: VERIFIED
        trigger: "POST /veteran-students/{id}/verify-coe"
        actor: SchoolCertifyingOfficial
        preconditions:
          - "student.coe_status IN {NOT_SUBMITTED, EXPIRED}, else ERR_COE_ALREADY_VERIFIED"
        side_effects:
          - "same as NOT_SUBMITTED -> VERIFIED; protected_until restarts from the new coe_verified_on"
        note: "Re-verification cycle: EXPIRED -> VERIFIED closes the loop VERIFIED -> EXPIRED -> VERIFIED."
      - from: VERIFIED
        to: EXPIRED
        trigger: "POST /veteran-students/{id}/expire-coe"
        actor: VaProcessingOffice
        preconditions:
          - "student.coe_status == VERIFIED, else ERR_COE_NOT_VERIFIED"
        side_effects:
          - "sets coe_status = EXPIRED; leaves coe_verified_on and protected_until untouched"
          - "recomputes benefit_payment_protected per CALC-7, which becomes false because the predicate requires coe_status == VERIFIED"

  - entity: VeteranStudent
    initial_state: NONE
    terminal_states: []
    note: "account_hold_status dimension — a parallel state axis on the same VeteranStudent row, independent of coe_status."
    transitions:
      - from: NONE
        to: REGISTRATION_HOLD
        trigger: "POST /veteran-students/{id}/account-holds with hold_status = REGISTRATION_HOLD"
        actor: BursarOfficer
        preconditions:
          - "CALC-7's live protection predicate is false for this student, else ERR_PROTECTED_STUDENT_PENALTY (validation priority 15)"
        side_effects:
          - "sets account_hold_status = REGISTRATION_HOLD; coe_status is unaffected"
      - from: REGISTRATION_HOLD
        to: NONE
        trigger: "POST /veteran-students/{id}/account-holds with hold_status = NONE"
        actor: BursarOfficer
        preconditions: []
        side_effects:
          - "sets account_hold_status = NONE; releasing a hold is never blocked by the protection predicate"

  - entity: AcademicTerm
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /academic-terms/{id}/close"
        actor: SupervisorySCO
        preconditions:
          - "term.status == OPEN, else ERR_TERM_ALREADY_CLOSED"
        side_effects:
          - "sets status = CLOSED; POST /enrollment-certifications/{id}/submit for this term is thereafter rejected with ERR_TERM_CLOSED (cross-entity guard)"

  - entity: CatalogVersion
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: PENDING_SAA
        trigger: "POST /catalog-versions/{id}/submit-to-saa"
        actor: SupervisorySCO
        preconditions:
          - "catalog_version.review_status IN {DRAFT, REJECTED, SUSPENDED}, else ERR_CATALOG_NOT_SUBMITTABLE"
          - "has_published_tuition_schedule AND has_refund_policy AND has_program_length_disclosure are all true, else ERR_CATALOG_COMPLIANCE_INCOMPLETE"
        side_effects:
          - "sets review_status = PENDING_SAA"
          - "cascade L2: sets Program.approval_status = PENDING_SAA for the referenced program regardless of its prior value, because an open SAA re-review suspends the program's certifiable posture"
      - from: REJECTED
        to: PENDING_SAA
        trigger: "POST /catalog-versions/{id}/submit-to-saa"
        actor: SupervisorySCO
        preconditions:
          - "catalog_version.review_status IN {DRAFT, REJECTED, SUSPENDED}, else ERR_CATALOG_NOT_SUBMITTABLE"
          - "the three catalog compliance booleans are all true, else ERR_CATALOG_COMPLIANCE_INCOMPLETE"
        side_effects:
          - "sets review_status = PENDING_SAA; cascade L2 sets Program.approval_status = PENDING_SAA"
        note: "Resubmission cycle after a rejection."
      - from: SUSPENDED
        to: PENDING_SAA
        trigger: "POST /catalog-versions/{id}/submit-to-saa"
        actor: SupervisorySCO
        preconditions:
          - "catalog_version.review_status IN {DRAFT, REJECTED, SUSPENDED}, else ERR_CATALOG_NOT_SUBMITTABLE"
          - "the three catalog compliance booleans are all true, else ERR_CATALOG_COMPLIANCE_INCOMPLETE"
        side_effects:
          - "sets review_status = PENDING_SAA and clears suspension_reason; cascade L2 sets Program.approval_status = PENDING_SAA"
        note: "Reinstatement cycle after a suspension."
      - from: PENDING_SAA
        to: APPROVED
        trigger: "POST /catalog-versions/{id}/saa-decision with decision = APPROVED"
        actor: StateApprovingAgent
        preconditions:
          - "catalog_version.review_status == PENDING_SAA, else ERR_CATALOG_NOT_PENDING_SAA"
        side_effects:
          - "sets review_status = APPROVED"
          - "cascade L2: sets Program.approval_status = APPROVED and Program.approved_catalog_version_id = this catalog version's id"
        note: "Fork branch 1 of 3 — divergent side-effect set: pins the program's approved catalog and unlocks certification."
      - from: PENDING_SAA
        to: APPROVED_WITH_CONDITIONS
        trigger: "POST /catalog-versions/{id}/saa-decision with decision = APPROVED_WITH_CONDITIONS"
        actor: StateApprovingAgent
        preconditions:
          - "catalog_version.review_status == PENDING_SAA, else ERR_CATALOG_NOT_PENDING_SAA"
          - "conditions_note is supplied, else ERR_INVALID_REQUEST"
        side_effects:
          - "sets review_status = APPROVED_WITH_CONDITIONS and stores conditions_note"
          - "cascade L2: sets Program.approval_status = CONDITIONAL and Program.approved_catalog_version_id = this catalog version's id"
        note: "Fork branch 2 of 3 — divergent side-effect set: CONDITIONAL still permits certification but is a distinct program posture."
      - from: PENDING_SAA
        to: REJECTED
        trigger: "POST /catalog-versions/{id}/saa-decision with decision = REJECTED"
        actor: StateApprovingAgent
        preconditions:
          - "catalog_version.review_status == PENDING_SAA, else ERR_CATALOG_NOT_PENDING_SAA"
        side_effects:
          - "sets review_status = REJECTED"
          - "cascade L2: sets Program.approval_status = DRAFT and Program.approved_catalog_version_id = null"
        note: "Fork branch 3 of 3 — divergent side-effect set: clears the pinned catalog instead of setting it."
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /catalog-versions/{id}/suspend"
        actor: StateApprovingAgent
        preconditions:
          - "catalog_version.review_status IN {APPROVED, APPROVED_WITH_CONDITIONS}, else ERR_CATALOG_NOT_SUSPENDABLE"
        side_effects:
          - "CASCADE-B L1: sets review_status = SUSPENDED and stores suspension_reason"
          - "CASCADE-B L2: because this catalog version was suspended, every Program whose approved_catalog_version_id equals this catalog version's id is set to approval_status = SUSPENDED"
          - "CASCADE-B L3: because that Program became SUSPENDED, every EnrollmentCertification with program_id == that program and status == SUBMITTED is set to status = RETURNED with return_reason = PROGRAM_SUSPENDED (conditional cascade: DRAFT, RETURNED, CERTIFIED, AMENDMENT_PENDING, TERMINATED and VOID certifications are untouched)"
          - "CASCADE-B L4: because those certifications were returned, one CertificationAuditEntry with event_type = CERTIFICATION_AUTO_RETURNED, actor_role = system and actor_user_id = system is appended per returned certification, in ascending certification created_at order"
      - from: APPROVED_WITH_CONDITIONS
        to: SUSPENDED
        trigger: "POST /catalog-versions/{id}/suspend"
        actor: StateApprovingAgent
        preconditions:
          - "catalog_version.review_status IN {APPROVED, APPROVED_WITH_CONDITIONS}, else ERR_CATALOG_NOT_SUSPENDABLE"
        side_effects:
          - "identical CASCADE-B L1..L4 chain as APPROVED -> SUSPENDED"

  - entity: Program
    initial_state: DRAFT
    terminal_states: []
    note: "Every Program transition is a cascade consequence of a CatalogVersion transition; Program has no direct action endpoint. The machine is cyclic: APPROVED -> PENDING_SAA -> APPROVED and SUSPENDED -> PENDING_SAA -> APPROVED."
    transitions:
      - from: DRAFT
        to: PENDING_SAA
        trigger: "system cascade L2 from POST /catalog-versions/{id}/submit-to-saa"
        actor: system
        preconditions:
          - "the submitted CatalogVersion.program_id == this program's id"
        side_effects:
          - "sets approval_status = PENDING_SAA"
      - from: APPROVED
        to: PENDING_SAA
        trigger: "system cascade L2 from POST /catalog-versions/{id}/submit-to-saa"
        actor: system
        preconditions:
          - "the submitted CatalogVersion.program_id == this program's id"
        side_effects:
          - "sets approval_status = PENDING_SAA while leaving approved_catalog_version_id pinned to the previously approved version"
        note: "Cycle edge: an already-approved program re-enters review, so certify is blocked with ERR_PROGRAM_NOT_APPROVED until the SAA decides."
      - from: CONDITIONAL
        to: PENDING_SAA
        trigger: "system cascade L2 from POST /catalog-versions/{id}/submit-to-saa"
        actor: system
        preconditions:
          - "the submitted CatalogVersion.program_id == this program's id"
        side_effects:
          - "sets approval_status = PENDING_SAA"
      - from: SUSPENDED
        to: PENDING_SAA
        trigger: "system cascade L2 from POST /catalog-versions/{id}/submit-to-saa"
        actor: system
        preconditions:
          - "the submitted CatalogVersion.program_id == this program's id"
        side_effects:
          - "sets approval_status = PENDING_SAA"
      - from: PENDING_SAA
        to: APPROVED
        trigger: "system cascade L2 from POST /catalog-versions/{id}/saa-decision with decision = APPROVED"
        actor: system
        preconditions: []
        side_effects:
          - "sets approval_status = APPROVED and approved_catalog_version_id = the decided catalog version's id"
      - from: PENDING_SAA
        to: CONDITIONAL
        trigger: "system cascade L2 from POST /catalog-versions/{id}/saa-decision with decision = APPROVED_WITH_CONDITIONS"
        actor: system
        preconditions: []
        side_effects:
          - "sets approval_status = CONDITIONAL and approved_catalog_version_id = the decided catalog version's id"
      - from: PENDING_SAA
        to: DRAFT
        trigger: "system cascade L2 from POST /catalog-versions/{id}/saa-decision with decision = REJECTED"
        actor: system
        preconditions: []
        side_effects:
          - "sets approval_status = DRAFT and approved_catalog_version_id = null"
      - from: APPROVED
        to: SUSPENDED
        trigger: "system CASCADE-B L2 from POST /catalog-versions/{id}/suspend"
        actor: system
        preconditions:
          - "this program's approved_catalog_version_id == the suspended catalog version's id"
        side_effects:
          - "sets approval_status = SUSPENDED, which in turn triggers CASCADE-B L3 on this program's SUBMITTED certifications"
      - from: CONDITIONAL
        to: SUSPENDED
        trigger: "system CASCADE-B L2 from POST /catalog-versions/{id}/suspend"
        actor: system
        preconditions:
          - "this program's approved_catalog_version_id == the suspended catalog version's id"
        side_effects:
          - "sets approval_status = SUSPENDED, which in turn triggers CASCADE-B L3"

  - entity: YellowRibbonAgreement
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /yellow-ribbon-agreements/{id}/close"
        actor: SupervisorySCO
        preconditions:
          - "agreement.status == ACTIVE, else ERR_AGREEMENT_ALREADY_CLOSED"
        side_effects:
          - "sets status = CLOSED; POST /yellow-ribbon-awards against this agreement is thereafter rejected with ERR_AGREEMENT_CLOSED (cross-entity guard)"
          - "existing PROVISIONAL and FINAL awards are untouched and may still be finalized or reversed"

  - entity: EnrollmentCertification
    initial_state: DRAFT
    terminal_states: [TERMINATED, VOID]
    transitions:
      - from: DRAFT
        to: DRAFT
        trigger: "PATCH /enrollment-certifications/{id}"
        actor: SchoolCertifyingOfficial
        preconditions:
          - "certification.status IN {DRAFT, RETURNED}, else ERR_CERTIFICATION_NOT_EDITABLE"
        side_effects:
          - "overwrites the supplied credit_hours_total, credit_hours_online, term_start_certified, term_end_certified"
          - "recomputes certified_days, rate_of_pursuit_pct, rop_tier_pct, training_time, modality, mha_eligible, mha_monthly_rate_cents per CALC-1"
      - from: RETURNED
        to: DRAFT
        trigger: "PATCH /enrollment-certifications/{id}"
        actor: SchoolCertifyingOfficial
        preconditions:
          - "certification.status IN {DRAFT, RETURNED}, else ERR_CERTIFICATION_NOT_EDITABLE"
        side_effects:
          - "sets status = DRAFT and clears return_reason"
          - "recomputes the CALC-1 fields exactly as the DRAFT -> DRAFT edge does"
        note: "Cycle edge: DRAFT -> SUBMITTED -> RETURNED -> DRAFT -> SUBMITTED is the revision loop."
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /enrollment-certifications/{id}/submit"
        actor: SchoolCertifyingOfficial
        preconditions:
          - "certification.status IN {DRAFT, RETURNED}, else ERR_CERTIFICATION_NOT_SUBMITTABLE"
          - "term.status == OPEN, else ERR_TERM_CLOSED"
          - "term_start_certified >= term.start_date AND term_end_certified <= term.end_date, else ERR_CERTIFIED_DATES_OUTSIDE_TERM"
          - "term_end_certified <= student.delimiting_date, else ERR_DELIMITING_DATE_PASSED"
          - "no other EnrollmentCertification for the same student with status IN {SUBMITTED, CERTIFIED, AMENDMENT_PENDING} shares any day with this certified period under CLOSED-interval semantics, else ERR_OVERLAPPING_ENROLLMENT_PERIOD"
          - "a CatalogVersion for this program with review_status IN {APPROVED, APPROVED_WITH_CONDITIONS} covers term_start_certified under HALF-OPEN semantics effective_start <= term_start_certified < effective_end, else ERR_CATALOG_VERSION_NOT_EFFECTIVE"
        side_effects:
          - "sets status = SUBMITTED and submitted_by_official_id = X-User-ID"
          - "sets pinned_catalog_version_id = the resolved effective CatalogVersion.id"
          - "appends a CertificationAuditEntry with event_type = CERTIFICATION_SUBMITTED"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /enrollment-certifications/{id}/submit"
        actor: SchoolCertifyingOfficial
        preconditions:
          - "identical to the DRAFT -> SUBMITTED precondition list"
        side_effects:
          - "identical to the DRAFT -> SUBMITTED side-effect list; return_reason is cleared"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /enrollment-certifications/{id}/return"
        actor: SupervisorySCO
        preconditions:
          - "certification.status == SUBMITTED, else ERR_CERTIFICATION_NOT_SUBMITTED"
        side_effects:
          - "sets status = RETURNED and return_reason = the supplied reason"
          - "appends a CertificationAuditEntry with event_type = CERTIFICATION_RETURNED"
      - from: SUBMITTED
        to: RETURNED
        trigger: "system CASCADE-B L3 from POST /catalog-versions/{id}/suspend"
        actor: system
        preconditions:
          - "this certification's program_id == the program whose approval_status just became SUSPENDED"
        side_effects:
          - "sets status = RETURNED and return_reason = PROGRAM_SUSPENDED"
          - "CASCADE-B L4: appends a CertificationAuditEntry with event_type = CERTIFICATION_AUTO_RETURNED, actor_role = system"
      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /enrollment-certifications/{id}/certify"
        actor: SupervisorySCO
        preconditions:
          - "certification.status == SUBMITTED, else ERR_CERTIFICATION_NOT_SUBMITTED"
          - "student.coe_status == VERIFIED, else ERR_COE_NOT_VERIFIED (cross-entity state gate, evaluated inside the same validation priority 12 band, immediately after the certification's own status)"
          - "X-User-ID != certification.submitted_by_official_id, else ERR_SEGREGATION_OF_DUTIES"
          - "program.approval_status IN {APPROVED, CONDITIONAL}, else ERR_PROGRAM_NOT_APPROVED"
          - "logical clock date <= term.certification_deadline, else ERR_CERTIFICATION_DEADLINE_PASSED"
          - "a TuitionFeeReport for this certification with status == REPORTED exists, else ERR_TUITION_REPORT_MISSING"
          - "the CALC-4 CALENDAR_FULL_TERM result <= student.entitlement_days_remaining, else ERR_INSUFFICIENT_ENTITLEMENT"
        side_effects:
          - "sets status = CERTIFIED, certified_by_official_id = X-User-ID and amount_basis = AS_CERTIFIED"
          - "computes mha_term_total_cents per CALC-2"
          - "computes net_covered_cents, ay_cap_remaining_before_cents, va_tuition_cents, cap_charged_cents and yr_gap_cents per CALC-3 variant AS_CERTIFIED"
          - "computes entitlement_days_charged per CALC-4 variant CALENDAR_FULL_TERM"
          - "debits VeteranStudent.entitlement_days_remaining by entitlement_days_charged, preserving INV-1"
          - "recomputes VeteranStudent.benefit_payment_protected per CALC-7, which becomes true because this certification's tuition_payment_posted_on is null"
          - "appends a CertificationAuditEntry with event_type = CERTIFICATION_CERTIFIED"
      - from: DRAFT
        to: VOID
        trigger: "POST /enrollment-certifications/{id}/void"
        actor: SupervisorySCO
        preconditions:
          - "certification.status IN {DRAFT, RETURNED}, else ERR_CERTIFICATION_NOT_EDITABLE"
        side_effects:
          - "sets status = VOID; no entitlement or money fields were ever written, so no compensation is needed"
          - "appends a CertificationAuditEntry with event_type = CERTIFICATION_VOIDED"
      - from: RETURNED
        to: VOID
        trigger: "POST /enrollment-certifications/{id}/void"
        actor: SupervisorySCO
        preconditions:
          - "certification.status IN {DRAFT, RETURNED}, else ERR_CERTIFICATION_NOT_EDITABLE"
        side_effects:
          - "identical to the DRAFT -> VOID side-effect list"
      - from: CERTIFIED
        to: AMENDMENT_PENDING
        trigger: "POST /enrollment-change-reports"
        actor: SchoolCertifyingOfficial
        preconditions:
          - "certification.status == CERTIFIED, else ERR_CERTIFICATION_NOT_CERTIFIED"
          - "effective_date within term_start_certified..term_end_certified inclusive, else ERR_CHANGE_DATE_OUTSIDE_TERM"
          - "if punitive_grade_flag is true then CALC-7's live protection predicate is false for this student, else ERR_PROTECTED_STUDENT_PENALTY"
        side_effects:
          - "creates the EnrollmentChangeReport with reported_on, days_late, reporting_status and liability_party per CALC-5"
          - "sets certification.status = AMENDMENT_PENDING; stored amounts remain on the AS_CERTIFIED basis until reconciliation"
          - "appends a CertificationAuditEntry with event_type = AMENDMENT_OPENED"
      - from: AMENDMENT_PENDING
        to: CERTIFIED
        trigger: "POST /enrollment-change-reports/{id}/reconcile with change_type IN {CREDIT_HOUR_REDUCTION, TERM_DATE_CHANGE}"
        actor: SupervisorySCO
        preconditions:
          - "change_report.status == REPORTED, else ERR_CHANGE_REPORT_ALREADY_RECONCILED"
          - "certification.status == AMENDMENT_PENDING, else ERR_CERTIFICATION_NOT_CERTIFIED"
        side_effects:
          - "see CASCADE-A on the EnrollmentChangeReport machine; sets status back to CERTIFIED with amount_basis = AS_RECONCILED"
        note: "Cycle edge: CERTIFIED -> AMENDMENT_PENDING -> CERTIFIED may repeat for successive changes."
      - from: AMENDMENT_PENDING
        to: TERMINATED
        trigger: "POST /enrollment-change-reports/{id}/reconcile with change_type = COMPLETE_WITHDRAWAL"
        actor: SupervisorySCO
        preconditions:
          - "change_report.status == REPORTED, else ERR_CHANGE_REPORT_ALREADY_RECONCILED"
          - "certification.status == AMENDMENT_PENDING, else ERR_CERTIFICATION_NOT_CERTIFIED"
        side_effects:
          - "see CASCADE-A; sets status = TERMINATED with amount_basis = AS_RECONCILED. TERMINATED is terminal: submit, certify, return, void, record-va-payment and further change reports are all rejected"

  - entity: TuitionFeeReport
    initial_state: REPORTED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: REPORTED
        to: SUPERSEDED
        trigger: "system cascade from POST /tuition-fee-reports for the same certification_id"
        actor: system
        preconditions:
          - "the existing report's certification_id equals the new report's certification_id"
        side_effects:
          - "sets the prior report's status = SUPERSEDED so that exactly one REPORTED report exists per certification"

  - entity: YellowRibbonAward
    initial_state: PROVISIONAL
    terminal_states: [REVERSED]
    transitions:
      - from: PROVISIONAL
        to: FINAL
        trigger: "POST /yellow-ribbon-awards/{id}/finalize"
        actor: SupervisorySCO
        preconditions:
          - "award.status == PROVISIONAL, else ERR_AWARD_NOT_PROVISIONAL"
        side_effects:
          - "sets status = FINAL; agreement.pool_remaining_cents and agreement.participant_count are unchanged because both PROVISIONAL and FINAL awards are counted by INV-2"
      - from: PROVISIONAL
        to: REVERSED
        trigger: "POST /yellow-ribbon-awards/{id}/reverse"
        actor: SupervisorySCO
        preconditions:
          - "award.status IN {PROVISIONAL, FINAL}, else ERR_AWARD_ALREADY_REVERSED"
        side_effects:
          - "sets status = REVERSED and reversal_reason"
          - "credits agreement.pool_remaining_cents by school_share_cents and decrements agreement.participant_count by 1, restoring INV-2 exactly"
          - "appends a CertificationAuditEntry with event_type = AWARD_REVERSED against the award's certification_id"
      - from: FINAL
        to: REVERSED
        trigger: "POST /yellow-ribbon-awards/{id}/reverse"
        actor: SupervisorySCO
        preconditions:
          - "award.status IN {PROVISIONAL, FINAL}, else ERR_AWARD_ALREADY_REVERSED"
        side_effects:
          - "identical to the PROVISIONAL -> REVERSED side-effect list"
      - from: PROVISIONAL
        to: REVERSED
        trigger: "system CASCADE-A L5 from POST /enrollment-change-reports/{id}/reconcile"
        actor: system
        preconditions:
          - "award.certification_id == the reconciled certification's id AND award.status == PROVISIONAL AND the reconciled yr_gap_cents == 0"
        side_effects:
          - "sets status = REVERSED and reversal_reason = YR_GAP_ELIMINATED_BY_RECONCILIATION"
          - "credits agreement.pool_remaining_cents by school_share_cents and decrements agreement.participant_count by 1"
          - "appends a CertificationAuditEntry with event_type = AWARD_REVERSED"
        note: "Conditional cascade: FINAL awards are deliberately NOT auto-reversed, only PROVISIONAL ones."

  - entity: EnrollmentChangeReport
    initial_state: REPORTED
    terminal_states: [RECONCILED]
    transitions:
      - from: REPORTED
        to: RECONCILED
        trigger: "POST /enrollment-change-reports/{id}/reconcile"
        actor: SupervisorySCO
        preconditions:
          - "change_report.status == REPORTED, else ERR_CHANGE_REPORT_ALREADY_RECONCILED"
          - "certification.status == AMENDMENT_PENDING, else ERR_CERTIFICATION_NOT_CERTIFIED"
        side_effects:
          - "CASCADE-A L1: sets status = RECONCILED and reconciled_by_official_id = X-User-ID"
          - "CASCADE-A L2: because this report was reconciled, the referenced EnrollmentCertification is recomputed on the AS_RECONCILED basis - rate_of_pursuit_pct, rop_tier_pct, training_time, modality, mha_eligible, mha_monthly_rate_cents (CALC-1), mha_term_total_cents (CALC-2 two-rate segmentation), net_covered_cents / ay_cap_remaining_before_cents / va_tuition_cents / cap_charged_cents / yr_gap_cents (CALC-3 variant AS_RECONCILED), entitlement_days_charged (CALC-4 variant PRORATED_ON_CHANGE), amount_basis = AS_RECONCILED, and status = CERTIFIED or TERMINATED by change_type"
          - "CASCADE-A L3a: because the certification's entitlement_days_charged changed, VeteranStudent.entitlement_days_remaining is credited by (old entitlement_days_charged - new entitlement_days_charged), preserving INV-1"
          - "CASCADE-A L3b: because the certification's va_tuition_cents and mha_term_total_cents dropped below tuition_paid_cents and mha_paid_cents, a BenefitDebt is created per CALC-6 (skipped when principal_cents == 0)"
          - "CASCADE-A L4: because that BenefitDebt was created, VeteranStudent.open_debt_principal_cents is increased by principal_cents when debtor_type == STUDENT, the debt's notification_due_on is set to the clock date + DEBT_NOTIFICATION_DAYS, and a CertificationAuditEntry with event_type = DEBT_CREATED is appended"
          - "CASCADE-A L5 (conditional): because the recomputed yr_gap_cents is 0, any PROVISIONAL YellowRibbonAward on this certification is REVERSED and its agreement's pool_remaining_cents and participant_count are restored"
          - "appends a CertificationAuditEntry with event_type = AMENDMENT_RECONCILED before the DEBT_CREATED entry"

  - entity: BenefitDebt
    initial_state: OPEN
    terminal_states: [SATISFIED, WAIVED]
    note: "collection_status dimension; notification_status is the parallel dimension declared below."
    transitions:
      - from: OPEN
        to: PARTIALLY_REPAID
        trigger: "POST /benefit-debts/{id}/repayments"
        actor: BursarOfficer
        preconditions:
          - "debt.collection_status IN {OPEN, PARTIALLY_REPAID}, else ERR_DEBT_ALREADY_SETTLED"
          - "amount_cents <= outstanding_cents, else ERR_REPAYMENT_EXCEEDS_BALANCE"
          - "amount_cents < outstanding_cents for this edge"
        side_effects:
          - "allocates amount_cents by the CALC-6 waterfall (tuition_component first, then mha_component) into tuition_repaid_cents and mha_repaid_cents"
          - "recomputes repaid_cents and outstanding_cents"
          - "decreases VeteranStudent.open_debt_principal_cents by amount_cents when debtor_type == STUDENT"
      - from: OPEN
        to: SATISFIED
        trigger: "POST /benefit-debts/{id}/repayments"
        actor: BursarOfficer
        preconditions:
          - "debt.collection_status IN {OPEN, PARTIALLY_REPAID}, else ERR_DEBT_ALREADY_SETTLED"
          - "amount_cents == outstanding_cents for this edge"
        side_effects:
          - "same allocation as the PARTIALLY_REPAID edge; outstanding_cents becomes 0 and collection_status = SATISFIED"
          - "decreases VeteranStudent.open_debt_principal_cents by amount_cents when debtor_type == STUDENT"
      - from: PARTIALLY_REPAID
        to: SATISFIED
        trigger: "POST /benefit-debts/{id}/repayments"
        actor: BursarOfficer
        preconditions:
          - "debt.collection_status IN {OPEN, PARTIALLY_REPAID}, else ERR_DEBT_ALREADY_SETTLED"
          - "amount_cents == outstanding_cents for this edge"
        side_effects:
          - "same allocation and ledger updates; collection_status = SATISFIED"
      - from: OPEN
        to: WAIVED
        trigger: "POST /benefit-debts/{id}/waive"
        actor: SupervisorySCO
        preconditions:
          - "debt.collection_status IN {OPEN, PARTIALLY_REPAID}, else ERR_DEBT_ALREADY_SETTLED"
          - "X-User-ID != change_report.reconciled_by_official_id for the debt's change_report_id, else ERR_WAIVER_SEGREGATION"
        side_effects:
          - "sets collection_status = WAIVED, waived_by_official_id = X-User-ID, waiver_reason, and outstanding_cents = 0"
          - "decreases VeteranStudent.open_debt_principal_cents by the pre-waiver outstanding_cents when debtor_type == STUDENT"
          - "appends a CertificationAuditEntry with event_type = DEBT_WAIVED"
      - from: PARTIALLY_REPAID
        to: WAIVED
        trigger: "POST /benefit-debts/{id}/waive"
        actor: SupervisorySCO
        preconditions:
          - "identical to the OPEN -> WAIVED precondition list"
        side_effects:
          - "identical to the OPEN -> WAIVED side-effect list"

  - entity: BenefitDebt
    initial_state: PENDING
    terminal_states: [ACKNOWLEDGED]
    note: "notification_status dimension — a parallel state axis on the same BenefitDebt row; a debt may be SATISFIED while still PENDING notification, and vice versa."
    transitions:
      - from: PENDING
        to: SENT
        trigger: "POST /benefit-debts/{id}/notify"
        actor: SchoolCertifyingOfficial
        preconditions:
          - "debt.notification_status == PENDING, else ERR_DEBT_ALREADY_NOTIFIED"
        side_effects:
          - "sets notification_status = SENT, notification_channel and notified_on = logical clock date"
      - from: SENT
        to: ACKNOWLEDGED
        trigger: "POST /benefit-debts/{id}/acknowledge"
        actor: Student
        preconditions:
          - "debt.notification_status IN {SENT, OVERDUE}, else ERR_DEBT_NOT_NOTIFIED"
          - "X-User-ID == debt.student_id, else ERR_STUDENT_SCOPE_VIOLATION"
        side_effects:
          - "sets notification_status = ACKNOWLEDGED and acknowledged_on = logical clock date"
      - from: SENT
        to: OVERDUE
        trigger: "POST /benefit-debts/{id}/mark-overdue"
        actor: VaProcessingOffice
        preconditions:
          - "debt.notification_status IN {PENDING, SENT}, else ERR_DEBT_ALREADY_NOTIFIED"
          - "logical clock date > debt.notification_due_on, else ERR_INVALID_REQUEST"
        side_effects:
          - "sets notification_status = OVERDUE"
      - from: PENDING
        to: OVERDUE
        trigger: "POST /benefit-debts/{id}/mark-overdue"
        actor: VaProcessingOffice
        preconditions:
          - "identical to the SENT -> OVERDUE precondition list"
        side_effects:
          - "sets notification_status = OVERDUE without ever having sent a notification"
      - from: OVERDUE
        to: ACKNOWLEDGED
        trigger: "POST /benefit-debts/{id}/acknowledge"
        actor: Student
        preconditions:
          - "identical to the SENT -> ACKNOWLEDGED precondition list"
        side_effects:
          - "identical to the SENT -> ACKNOWLEDGED side-effect list"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: tuition-report-supersede-stale-certification
    parent_entity: EnrollmentCertification
    write_endpoint: "POST /tuition-fee-reports"
    occ_field: "expected_certification_version"
    description: |
      Creating a TuitionFeeReport against an EnrollmentCertification whose
      version has advanced since the client last observed it is rejected. A new
      report legitimately supersedes the prior REPORTED report for the same
      certification and rewrites the certification's net_covered_cents, so a
      writer holding a stale view of the certification would silently discard a
      pricing revision another writer already accepted.
    error_id: ERR_STALE_CERTIFICATION_VERSION
    http_status: 412

  - rule_id: yr-award-stale-agreement-pool
    parent_entity: YellowRibbonAgreement
    write_endpoint: "POST /yellow-ribbon-awards"
    occ_field: "expected_agreement_version"
    description: |
      Creating a YellowRibbonAward against a YellowRibbonAgreement whose version
      has advanced since the client last observed it is rejected. Award creation
      debits pool_remaining_cents and increments participant_count, so a writer
      whose view of the agreement predates another accepted award would compute
      school_share_cents from a pool balance that no longer exists.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: rate_of_pursuit_and_training_time
    description: "Derives rate of pursuit, its ten-percent tier, the training-time band, the delivery modality, the inclusive certified day count and the monthly housing allowance rate for an EnrollmentCertification."
    trigger: "POST /enrollment-certifications, PATCH /enrollment-certifications/{id}, and CASCADE-A L2 of POST /enrollment-change-reports/{id}/reconcile"
    algorithm: threshold
    input_set: "The certification's own credit_hours_total / credit_hours_online / term_start_certified / term_end_certified, its Program.full_time_credit_hours and Program.campus_bah_monthly_cents, and its VeteranStudent.chapter and benefit_level_pct. No other rows participate."
    formula: |
      certified_days = (term_end_certified - term_start_certified) in whole days + 1      # inclusive

      rate_of_pursuit_pct = round_half_up(credit_hours_total * 100 / program.full_time_credit_hours)   # integer percent
      rop_tier_pct        = min(100, round_half_up(rate_of_pursuit_pct / 10) * 10)

      training_time =
          FULL_TIME          if rate_of_pursuit_pct >= 100
        else THREE_QUARTER   if rate_of_pursuit_pct >= 75
        else HALF_TIME       if rate_of_pursuit_pct >= 50
        else QUARTER_TIME    if rate_of_pursuit_pct >= 25
        else LESS_THAN_QUARTER

      modality =
          ONLINE_ONLY   if credit_hours_online == credit_hours_total
        else RESIDENTIAL if credit_hours_online == 0
        else MIXED

      mha_eligible = (student.chapter == "CH33") AND (rate_of_pursuit_pct > MHA_MIN_ROP_PCT)
      # NOTE the strict > : a rate of pursuit of exactly 50 earns NO housing allowance.

      housing_base_cents =
          0                                if not mha_eligible
        else ONLINE_MHA_MONTHLY_CENTS      if modality == ONLINE_ONLY
        else program.campus_bah_monthly_cents

      # single rounding after BOTH percentage multiplications (pinned order)
      mha_monthly_rate_cents =
          round_half_up(housing_base_cents * student.benefit_level_pct * rop_tier_pct / 10000)
    constants:
      MHA_MIN_ROP_PCT: 50
      ONLINE_MHA_MONTHLY_CENTS: 99650
    precision: "All money in integer cents, round_half_up. rate_of_pursuit_pct and rop_tier_pct are integers, round_half_up. certified_days is an integer day count."
    variants: []

  - name: mha_term_total
    description: "Total housing allowance owed for a certified enrollment period, built by splitting the period into calendar-month segments, rounding each segment, then summing."
    trigger: "POST /enrollment-certifications/{id}/certify (variant AS_CERTIFIED) and CASCADE-A L2 of POST /enrollment-change-reports/{id}/reconcile (variant AS_RECONCILED)"
    algorithm: chronological
    input_set: "Exactly one EnrollmentCertification: its term_start_certified, its effective end date (term_end_certified, or the day before effective_date for a reconciled COMPLETE_WITHDRAWAL, or new_term_end_certified for a reconciled TERM_DATE_CHANGE) and its mha_monthly_rate_cents. Reconciliation additionally uses the pre-change rate for days before effective_date."
    formula: |
      # STEP 1 - segment the period, ascending by start date (chronological, no ties possible)
      #   Cut points: every calendar-month boundary inside the period, PLUS effective_date
      #   when the AS_RECONCILED variant applies. Segments are inclusive [s.start, s.end].
      #
      # STEP 2 - billable days per segment
      #   billable_days(s) = FULL_MONTH_BILLABLE_DAYS                       if s.start is the
      #                        first calendar day of its month AND s.end is the last calendar
      #                        day of the same month
      #                      (s.end - s.start) in whole days + 1            otherwise
      #   A whole calendar month is therefore always billed as 30 days, whether it has 28, 30 or 31.
      #
      # STEP 3 - per-segment amount, ROUNDED PER SEGMENT (pinned order)
      #   seg_amount(s) = round_half_up(rate_for(s) * billable_days(s) / FULL_MONTH_BILLABLE_DAYS)
      #   rate_for(s)   = mha_monthly_rate_cents                            (AS_CERTIFIED)
      #                 = pre-change mha_monthly_rate_cents  if s.end  < effective_date
      #                   post-change mha_monthly_rate_cents if s.start >= effective_date
      #                                                                     (AS_RECONCILED)
      #
      # STEP 4 - sum
      #   mha_term_total_cents = sum over segments of seg_amount(s)
      #
      # ROUNDING ORDER IS PINNED: round each segment THEN sum. The alternative
      # (sum all billable days, then round once) is WRONG here and differs in cents:
      # for 2026-08-24..2026-12-11 at 213700 cents/month the pinned order yields
      # 776444 while sum-then-round yields 776443.
      #
      # If mha_eligible is false for the WHOLE period (AS_CERTIFIED), mha_term_total_cents = 0
      # and no segmentation is performed. Under AS_RECONCILED the eligibility test is applied
      # PER SEGMENT via rate_for(s): segments before effective_date keep the pre-change rate
      # even when the recomputed post-change mha_eligible is false (post-change rate 0), so
      # housing already earned before the change is never retroactively erased.
    constants:
      FULL_MONTH_BILLABLE_DAYS: 30
    precision: "Integer cents, round_half_up, applied once per calendar-month segment before summation."
    variants:
      - name: AS_CERTIFIED
        when: "POST /enrollment-certifications/{id}/certify — the certification has one housing rate for the whole certified period"
        difference: "Cut points are calendar-month boundaries only; rate_for(s) is the single mha_monthly_rate_cents."
      - name: AS_RECONCILED
        when: "CASCADE-A L2 of POST /enrollment-change-reports/{id}/reconcile"
        difference: "effective_date is added as a cut point and each segment is priced at the pre- or post-change mha_monthly_rate_cents, so one term can carry two rates; for COMPLETE_WITHDRAWAL the period ends the day before effective_date."

  - name: covered_tuition_and_yellow_ribbon
    description: "Determines the covered tuition portion VA pays under the annual cap, the residual Yellow Ribbon gap, and the school-share / VA-match / student-out-of-pocket split of that gap."
    trigger: "POST /tuition-fee-reports (step S1 only), POST /enrollment-certifications/{id}/certify (steps S1-S7, variant AS_CERTIFIED), POST /yellow-ribbon-awards (step S8), CASCADE-A L2 of POST /enrollment-change-reports/{id}/reconcile (steps S1-S7, variant AS_RECONCILED)"
    algorithm: waterfall_allocation
    input_set: "The certification's REPORTED TuitionFeeReport (status == REPORTED, exactly one per certification); the student's benefit_level_pct; for step S2 every OTHER EnrollmentCertification of the SAME student whose term.academic_year equals this term's academic_year and whose status IN {CERTIFIED, AMENDMENT_PENDING, TERMINATED}, summed in ascending created_at order; for step S8 the agreement and every YellowRibbonAward of the same student on that agreement with status IN {PROVISIONAL, FINAL}."
    formula: |
      # The steps are evaluated in the pinned order S1..S8. The order matters because the
      # dependency graph LOOKS circular: va_tuition_cents is capped by the annual cap ledger,
      # the ledger is charged by va_tuition_cents, the Yellow Ribbon gap is what the cap did
      # not cover, and the VA match paid in S8 is itself tuition money paid by VA. The
      # scaffold pins the resolution explicitly:
      #   * net_covered_cents is computed ONCE in S1 from the TuitionFeeReport and is NEVER
      #     reduced by any VA payment computed downstream (no second pass, no fixed point).
      #   * cap_charged_cents takes ONLY va_tuition_cents (S6). The Yellow Ribbon
      #     va_match_cents from S8 is VA money but is deliberately NOT charged against
      #     ANNUAL_CAP_CENTS and does NOT feed back into S2 for later terms.

      S1  net_covered_cents = max(0, report.gross_tuition_cents
                                   + report.mandatory_fees_cents
                                   - report.tuition_specific_aid_cents)
          # report.non_tuition_aid_cents is deliberately EXCLUDED from S1.

      S2  prior_cap_charged_cents = sum(c.cap_charged_cents) over EnrollmentCertification c
              where c.student_id == this.student_id
                AND c.term.academic_year == this.term.academic_year
                AND c.id != this.id
                AND c.status IN {CERTIFIED, AMENDMENT_PENDING, TERMINATED}
              accumulated in ascending c.created_at order

      S3  ay_cap_remaining_before_cents = max(0, ANNUAL_CAP_CENTS - prior_cap_charged_cents)

      S4  capped_base_cents = min(net_covered_cents, ay_cap_remaining_before_cents)

      S5  va_tuition_cents = round_half_up(capped_base_cents * student.benefit_level_pct / 100)

      S6  cap_charged_cents = va_tuition_cents

      S7  yr_gap_cents = net_covered_cents - va_tuition_cents

      S8  # POST /yellow-ribbon-awards only
          per_student_remaining_before_cents =
              max(0, agreement.per_student_annual_cap_cents
                     - sum(a.school_share_cents) over YellowRibbonAward a
                       where a.agreement_id == agreement.id
                         AND a.certification.student_id == this.certification.student_id
                         AND a.status IN {PROVISIONAL, FINAL}
                       accumulated in ascending a.created_at order)
          pool_remaining_before_cents = agreement.pool_remaining_cents
          school_share_cents = min(round_half_up(yr_gap_cents / 2),
                                   per_student_remaining_before_cents,
                                   pool_remaining_before_cents)
          va_match_cents = school_share_cents
          student_out_of_pocket_cents = max(0, yr_gap_cents - school_share_cents - va_match_cents)
    constants:
      ANNUAL_CAP_CENTS: 2790000
    precision: "Integer cents, round_half_up. Only S5 and the S8 half-gap division round; every other step is exact integer arithmetic."
    variants:
      - name: AS_CERTIFIED
        when: "POST /enrollment-certifications/{id}/certify"
        difference: "S1 uses the REPORTED TuitionFeeReport amounts verbatim; the full certified period is priced."
      - name: AS_RECONCILED
        when: "CASCADE-A L2 of POST /enrollment-change-reports/{id}/reconcile"
        difference: |
          S1 is replaced by a prorated S1':
            change_type == COMPLETE_WITHDRAWAL AND mitigating_circumstances_flag == false:
              attended_days = (effective_date - term_start_certified) in whole days   # effective_date EXCLUSIVE
              net_covered_cents = round_half_up(as_certified_net_covered_cents
                                                * attended_days / as_certified_certified_days)
            change_type == COMPLETE_WITHDRAWAL AND mitigating_circumstances_flag == true:
              net_covered_cents = as_certified_net_covered_cents      # VA pays the full assessed tuition
            change_type IN {CREDIT_HOUR_REDUCTION, TERM_DATE_CHANGE}:
              net_covered_cents = as_certified_net_covered_cents      # tuition already assessed, unchanged
          S2..S7 then rerun unchanged. Identical input data therefore yields a different
          va_tuition_cents under the two variants whenever the withdrawal branch applies.

  - name: entitlement_days_charged
    description: "Charges entitlement days against the student's remaining entitlement, scaled by the rate-of-pursuit tier."
    trigger: "POST /enrollment-certifications/{id}/certify (variant CALENDAR_FULL_TERM) and CASCADE-A L2 of POST /enrollment-change-reports/{id}/reconcile (variant PRORATED_ON_CHANGE)"
    algorithm: aggregation
    input_set: "Exactly one EnrollmentCertification: certified_days, rop_tier_pct, term_start_certified, term_end_certified; plus the reconciled change report's change_type, effective_date and new_term_end_certified. The student's entitlement_days_remaining is the ledger this result debits."
    formula: |
      # variant CALENDAR_FULL_TERM (at certify)
      entitlement_days_charged = round_half_up(certified_days * rop_tier_pct / 100)

      # variant PRORATED_ON_CHANGE (at reconcile) - the term is split at effective_date and
      # each side is rounded SEPARATELY at its own tier, then summed.
      days_before = (effective_date - term_start_certified) in whole days      # effective_date EXCLUSIVE
      period_end  =
          effective_date - 1 day       if change_type == COMPLETE_WITHDRAWAL
        else new_term_end_certified    if change_type == TERM_DATE_CHANGE
        else term_end_certified        # CREDIT_HOUR_REDUCTION
      days_after  = max(0, (period_end - effective_date) in whole days + 1)
      entitlement_days_charged = round_half_up(days_before * old_rop_tier_pct / 100)
                              + round_half_up(days_after  * new_rop_tier_pct / 100)
      # old_rop_tier_pct is the tier stored before reconciliation; new_rop_tier_pct is the
      # CALC-1 tier recomputed from new_credit_hours (unchanged for TERM_DATE_CHANGE, and
      # irrelevant for COMPLETE_WITHDRAWAL because days_after is 0).
    constants: {}
    precision: "Integer days, round_half_up, applied once per segment before summation."
    variants:
      - name: CALENDAR_FULL_TERM
        when: "POST /enrollment-certifications/{id}/certify"
        difference: "One rounding over the whole inclusive certified period at a single tier."
      - name: PRORATED_ON_CHANGE
        when: "CASCADE-A L2 of POST /enrollment-change-reports/{id}/reconcile"
        difference: "Two roundings, one per side of effective_date, at two different tiers. For 110 certified days reduced from tier 100 to tier 60 on day 53 this yields 52 + 35 = 87 days, whereas re-running CALENDAR_FULL_TERM at the new tier would yield 66 - a divergence of 21 entitlement days on identical data."

  - name: change_report_lateness_and_liability
    description: "Scores a change-in-enrollment report against the 30-day reporting deadline and assigns the overpayment obligor."
    trigger: "POST /enrollment-change-reports"
    algorithm: threshold
    input_set: "Exactly one EnrollmentChangeReport: its effective_date and the logical clock date at creation. No other rows participate."
    formula: |
      reported_on      = logical clock date at creation
      days_late        = (reported_on - effective_date) in whole days     # negative when reported in advance
      reporting_status = TIMELY if days_late <= REPORTING_DEADLINE_DAYS else LATE
      liability_party  = STUDENT if reporting_status == TIMELY else SCHOOL
      # NOTE the non-strict <= : reporting on exactly the 30th day after the effective date
      # is TIMELY and leaves the STUDENT liable; the 31st day flips both fields.
    constants:
      REPORTING_DEADLINE_DAYS: 30
    precision: "Integer whole days; no rounding."
    variants: []

  - name: overpayment_debt_allocation
    description: "Derives the overpayment principal from the delta between what VA already disbursed and the reconciled entitlement, splits it into tuition and housing components, and allocates repayments across those components as a waterfall."
    trigger: "CASCADE-A L3b of POST /enrollment-change-reports/{id}/reconcile (creation) and POST /benefit-debts/{id}/repayments (allocation)"
    algorithm: waterfall_allocation
    input_set: "One EnrollmentCertification's tuition_paid_cents / mha_paid_cents snapshot taken BEFORE recomputation, the AS_RECONCILED results of CALC-3 and CALC-2, and the change report's liability_party. Repayment allocation reads only the debt's own component and repaid fields."
    formula: |
      # The dependency LOOKS circular - the reconciled amounts depend on the certification's
      # amount_basis, and amount_basis is itself flipped by this same reconciliation. The
      # evaluation order is therefore pinned:
      R1  snapshot  paid_tuition = certification.tuition_paid_cents
                    paid_mha     = certification.mha_paid_cents
                    old_va_tuition = certification.va_tuition_cents
                    old_mha_total  = certification.mha_term_total_cents
                    old_days       = certification.entitlement_days_charged
      R2  recompute CALC-3 variant AS_RECONCILED and CALC-2 variant AS_RECONCILED and
                    CALC-4 variant PRORATED_ON_CHANGE, WITHOUT yet writing amount_basis
      R3  tuition_component_cents = max(0, paid_tuition - new_va_tuition_cents)
          mha_component_cents     = max(0, paid_mha     - new_mha_term_total_cents)
          principal_cents         = tuition_component_cents + mha_component_cents
          outstanding_cents       = principal_cents
      R4  write the recomputed fields AND certification.amount_basis = AS_RECONCILED
      R5  if principal_cents > 0 create one BenefitDebt with
              student_id      = certification.student_id
              certification_id, change_report_id
              debtor_type / source =
                  (STUDENT, AMENDMENT_OVERPAYMENT)      if change_report.liability_party == STUDENT
                  (SCHOOL,  LATE_REPORTING_LIABILITY)   if change_report.liability_party == SCHOOL
              notification_due_on = logical clock date + DEBT_NOTIFICATION_DAYS
          if principal_cents == 0 no BenefitDebt row is created at all.

      # Repayment waterfall - tuition bucket fills first, housing second (pinned order)
      applied_to_tuition = min(amount_cents, tuition_component_cents - tuition_repaid_cents)
      applied_to_mha     = min(amount_cents - applied_to_tuition,
                               mha_component_cents - mha_repaid_cents)
      if amount_cents > applied_to_tuition + applied_to_mha -> ERR_REPAYMENT_EXCEEDS_BALANCE
      tuition_repaid_cents += applied_to_tuition
      mha_repaid_cents     += applied_to_mha
      repaid_cents          = tuition_repaid_cents + mha_repaid_cents
      outstanding_cents     = principal_cents - repaid_cents
      collection_status     = SATISFIED if outstanding_cents == 0 else PARTIALLY_REPAID
    constants:
      DEBT_NOTIFICATION_DAYS: 30
    precision: "Integer cents; every quantity is an exact integer difference, no rounding."
    variants: []

  - name: student_protection_window
    description: "Evaluates the 38 USC 3679(e) prohibition on penalizing a student whose VA payment has not yet arrived."
    trigger: "POST /veteran-students/{id}/verify-coe, POST /veteran-students/{id}/expire-coe, POST /enrollment-certifications/{id}/certify, POST /enrollment-certifications/{id}/record-va-payment, POST /_clock/set_current_utc (all of which write VeteranStudent.benefit_payment_protected), and validation priority 15 which reads the same predicate"
    algorithm: threshold
    input_set: "One VeteranStudent's coe_status, coe_verified_on and protected_until, the logical clock date, and that student's EnrollmentCertification rows with status IN {CERTIFIED, AMENDMENT_PENDING}."
    formula: |
      protected_until = coe_verified_on + COE_PROTECTION_DAYS      # written by verify-coe

      benefit_payment_protected =
             student.coe_status == VERIFIED
         AND logical clock date <= student.protected_until
         AND EXISTS an EnrollmentCertification c with
                 c.student_id == student.id
             AND c.status IN {CERTIFIED, AMENDMENT_PENDING}
             AND c.tuition_payment_posted_on IS NULL

      # The stored field and the live predicate can never diverge: every transition that can
      # change any of the three conjuncts - including POST /_clock/set_current_utc - rewrites
      # benefit_payment_protected for the affected students as part of its side effects.
      #
      # While benefit_payment_protected is true the institution MUST NOT:
      #   * post a StudentAccountCharge with charge_type IN {LATE_FEE, REINSTATEMENT_FEE}
      #   * set account_hold_status = REGISTRATION_HOLD
      #   * file an EnrollmentChangeReport with punitive_grade_flag == true
      # All three are rejected with ERR_PROTECTED_STUDENT_PENALTY at validation priority 15.
    constants:
      COE_PROTECTION_DAYS: 90
    precision: "Whole days; protection is inclusive of protected_until itself."
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (evaluated in ascending priority order; the FIRST
# violated row decides the response)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the six §1.7 role names"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is listed in the target endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_constraint
    check: "Request body parses, contains every required input field, every field has the declared type, and every enum field carries a declared member"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 4
    category: auth
    check: "When X-User-Role IN {SchoolCertifyingOfficial, SupervisorySCO}, X-User-ID resolves to a CertifyingOfficial row"
    error_id: ERR_OFFICIAL_NOT_REGISTERED
    http_status: 403
    applies_to: "all endpoints whose roles include SchoolCertifyingOfficial or SupervisorySCO"

  - priority: 5
    category: auth
    check: "The resolved CertifyingOfficial has status == ACTIVE"
    error_id: ERR_OFFICIAL_INACTIVE
    http_status: 403
    applies_to: "all endpoints whose roles include SchoolCertifyingOfficial or SupervisorySCO"

  - priority: 6
    category: auth
    check: "The resolved CertifyingOfficial.official_level is SUPERVISORY when X-User-Role == SupervisorySCO and SCO when X-User-Role == SchoolCertifyingOfficial"
    error_id: ERR_OFFICIAL_LEVEL_MISMATCH
    http_status: 403
    applies_to: "all endpoints whose roles include SchoolCertifyingOfficial or SupervisorySCO"

  - priority: 7
    category: existence
    check: "Every id in the URL path resolves, validated left to right"
    error_id: "ERR_OFFICIAL_NOT_FOUND | ERR_STUDENT_NOT_FOUND | ERR_TERM_NOT_FOUND | ERR_PROGRAM_NOT_FOUND | ERR_CATALOG_VERSION_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_CERTIFICATION_NOT_FOUND | ERR_TUITION_REPORT_NOT_FOUND | ERR_AWARD_NOT_FOUND | ERR_CHANGE_REPORT_NOT_FOUND | ERR_DEBT_NOT_FOUND | ERR_CHARGE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 8
    category: auth
    check: "When X-User-Role == Student, X-User-ID equals the VeteranStudent.id the target resource belongs to (VeteranStudent.id for /veteran-students/{id}, BenefitDebt.student_id for /benefit-debts/{id}/..., and the student_id filter must equal X-User-ID on list reads)"
    error_id: ERR_STUDENT_SCOPE_VIOLATION
    http_status: 403
    applies_to: "GET /veteran-students/{id}, GET /benefit-debts, GET /benefit-debts/{id}, POST /benefit-debts/{id}/acknowledge"

  - priority: 9
    category: existence
    check: "Every foreign key supplied in the request body resolves, validated in the fixed order student_id, term_id, program_id, certification_id, agreement_id"
    error_id: "ERR_STUDENT_NOT_FOUND | ERR_TERM_NOT_FOUND | ERR_PROGRAM_NOT_FOUND | ERR_CERTIFICATION_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /enrollment-certifications, POST /catalog-versions, POST /tuition-fee-reports, POST /yellow-ribbon-awards, POST /enrollment-change-reports, POST /student-account-charges"

  - priority: 10
    category: state
    check: "expected_certification_version equals the referenced EnrollmentCertification's current version (concurrency_rules[tuition-report-supersede-stale-certification])"
    error_id: ERR_STALE_CERTIFICATION_VERSION
    http_status: 412
    applies_to: "POST /tuition-fee-reports"

  - priority: 11
    category: state
    check: "expected_agreement_version equals the referenced YellowRibbonAgreement's current version (concurrency_rules[yr-award-stale-agreement-pool])"
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
    applies_to: "POST /yellow-ribbon-awards"

  - priority: 12
    category: state
    check: "The target resource is in a state from which the requested transition exists, per §1.2. Cross-entity state gates belong to this same priority band and are evaluated in the exact order the §1.2 transition lists them, always after the target resource's own status: student.coe_status == VERIFIED on certify (ERR_COE_NOT_VERIFIED), term.status == OPEN on submit (ERR_TERM_CLOSED), and on award creation certification.status == CERTIFIED (ERR_CERTIFICATION_NOT_CERTIFIED) then agreement.status == ACTIVE (ERR_AGREEMENT_CLOSED)."
    error_id: "ERR_OFFICIAL_ALREADY_INACTIVE | ERR_COE_ALREADY_VERIFIED | ERR_COE_NOT_VERIFIED | ERR_TERM_ALREADY_CLOSED | ERR_AGREEMENT_ALREADY_CLOSED | ERR_CATALOG_NOT_SUBMITTABLE | ERR_CATALOG_NOT_PENDING_SAA | ERR_CATALOG_NOT_SUSPENDABLE | ERR_CERTIFICATION_NOT_SUBMITTABLE | ERR_CERTIFICATION_NOT_SUBMITTED | ERR_CERTIFICATION_NOT_CERTIFIED | ERR_CERTIFICATION_NOT_EDITABLE | ERR_CERTIFICATION_TERMINAL | ERR_AWARD_NOT_PROVISIONAL | ERR_AWARD_ALREADY_REVERSED | ERR_CHANGE_REPORT_ALREADY_RECONCILED | ERR_DEBT_ALREADY_SETTLED | ERR_DEBT_ALREADY_NOTIFIED | ERR_DEBT_NOT_NOTIFIED | ERR_TERM_CLOSED | ERR_AGREEMENT_CLOSED"
    http_status: 409
    applies_to: "all state-changing endpoints"

  - priority: 13
    category: business_safety
    check: "On certify, X-User-ID differs from certification.submitted_by_official_id (segregation of duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /enrollment-certifications/{id}/certify"

  - priority: 14
    category: business_safety
    check: "On certify, the certification's Program.approval_status IN {APPROVED, CONDITIONAL}"
    error_id: ERR_PROGRAM_NOT_APPROVED
    http_status: 422
    applies_to: "POST /enrollment-certifications/{id}/certify"

  - priority: 15
    category: business_safety
    check: "38 USC 3679(e): while CALC-7's live protection predicate is true for the student, no LATE_FEE or REINSTATEMENT_FEE charge may be posted, no REGISTRATION_HOLD may be set, and no change report may carry punitive_grade_flag == true"
    error_id: ERR_PROTECTED_STUDENT_PENALTY
    http_status: 422
    applies_to: "POST /student-account-charges, POST /veteran-students/{id}/account-holds, POST /enrollment-change-reports"

  - priority: 16
    category: business_safety
    check: "On submit-to-saa, has_published_tuition_schedule AND has_refund_policy AND has_program_length_disclosure are all true"
    error_id: ERR_CATALOG_COMPLIANCE_INCOMPLETE
    http_status: 422
    applies_to: "POST /catalog-versions/{id}/submit-to-saa"

  - priority: 17
    category: business_safety
    check: "On waive, X-User-ID differs from the reconciled_by_official_id of the debt's change_report_id (segregation of duties)"
    error_id: ERR_WAIVER_SEGREGATION
    http_status: 422
    applies_to: "POST /benefit-debts/{id}/waive"

  - priority: 18
    category: business_temporal
    check: "On certify, the logical clock date is on or before term.certification_deadline"
    error_id: ERR_CERTIFICATION_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /enrollment-certifications/{id}/certify"

  - priority: 19
    category: business_temporal
    check: "On submit, term_end_certified is on or before student.delimiting_date"
    error_id: ERR_DELIMITING_DATE_PASSED
    http_status: 422
    applies_to: "POST /enrollment-certifications/{id}/submit"

  - priority: 20
    category: business_temporal
    check: "On submit, term_start_certified >= term.start_date AND term_end_certified <= term.end_date"
    error_id: ERR_CERTIFIED_DATES_OUTSIDE_TERM
    http_status: 422
    applies_to: "POST /enrollment-certifications/{id}/submit"

  - priority: 21
    category: business_temporal
    check: "effective_date falls within term_start_certified..term_end_certified inclusive"
    error_id: ERR_CHANGE_DATE_OUTSIDE_TERM
    http_status: 422
    applies_to: "POST /enrollment-change-reports"

  - priority: 22
    category: business_temporal
    check: "CLOSED-interval overlap on the VeteranStudent resource: no other EnrollmentCertification of the same student with status IN {SUBMITTED, CERTIFIED, AMENDMENT_PENDING} may share ANY day with [term_start_certified, term_end_certified]. Touching endpoints count as a collision: other.term_end_certified == this.term_start_certified is rejected."
    error_id: ERR_OVERLAPPING_ENROLLMENT_PERIOD
    http_status: 409
    applies_to: "POST /enrollment-certifications/{id}/submit"

  - priority: 23
    category: business_temporal
    check: "HALF-OPEN interval overlap on the Program resource: no other CatalogVersion of the same program with review_status IN {PENDING_SAA, APPROVED, APPROVED_WITH_CONDITIONS} may overlap [effective_start, effective_end). Touching windows are LEGAL: other.effective_end == this.effective_start is accepted."
    error_id: ERR_CATALOG_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /catalog-versions"

  - priority: 24
    category: business_referential
    check: "On submit, exactly one CatalogVersion of the certification's program with review_status IN {APPROVED, APPROVED_WITH_CONDITIONS} satisfies effective_start <= term_start_certified < effective_end; it is pinned as pinned_catalog_version_id"
    error_id: ERR_CATALOG_VERSION_NOT_EFFECTIVE
    http_status: 422
    applies_to: "POST /enrollment-certifications/{id}/submit"

  - priority: 25
    category: business_referential
    check: "On award creation, agreement.academic_year == certification.term.academic_year AND agreement.degree_level == certification.program.degree_level"
    error_id: ERR_AGREEMENT_SCOPE_MISMATCH
    http_status: 422
    applies_to: "POST /yellow-ribbon-awards"

  - priority: 26
    category: business_constraint
    check: "student_number is not already used by another VeteranStudent"
    error_id: ERR_DUPLICATE_STUDENT_NUMBER
    http_status: 409
    applies_to: "POST /veteran-students"

  - priority: 27
    category: business_constraint
    check: "term_code is not already used by another AcademicTerm"
    error_id: ERR_DUPLICATE_TERM_CODE
    http_status: 409
    applies_to: "POST /academic-terms"

  - priority: 28
    category: business_constraint
    check: "program_code is not already used by another Program"
    error_id: ERR_DUPLICATE_PROGRAM_CODE
    http_status: 409
    applies_to: "POST /programs"

  - priority: 29
    category: business_constraint
    check: "email is not already used by another CertifyingOfficial"
    error_id: ERR_DUPLICATE_OFFICIAL_EMAIL
    http_status: 409
    applies_to: "POST /certifying-officials"

  - priority: 30
    category: business_constraint
    check: "start_date < end_date AND start_date <= drop_deadline <= end_date AND certification_deadline >= start_date"
    error_id: ERR_INVALID_TERM_DATES
    http_status: 422
    applies_to: "POST /academic-terms"

  - priority: 31
    category: business_constraint
    check: "credit_hours_online <= credit_hours_total (and new_credit_hours_online <= new_credit_hours on a change report)"
    error_id: ERR_INVALID_CREDIT_SPLIT
    http_status: 422
    applies_to: "POST /enrollment-certifications, PATCH /enrollment-certifications/{id}, POST /enrollment-change-reports"

  - priority: 32
    category: business_constraint
    check: "On certify, a TuitionFeeReport with status == REPORTED exists for the certification"
    error_id: ERR_TUITION_REPORT_MISSING
    http_status: 422
    applies_to: "POST /enrollment-certifications/{id}/certify"

  - priority: 33
    category: business_constraint
    check: "On award creation, the certification's student has chapter == CH33 AND benefit_level_pct == 100 (Yellow Ribbon is available only at the full CH33 benefit level)"
    error_id: ERR_YR_INELIGIBLE_STUDENT
    http_status: 422
    applies_to: "POST /yellow-ribbon-awards"

  - priority: 34
    category: business_constraint
    check: "No YellowRibbonAward with status IN {PROVISIONAL, FINAL} already exists for the certification"
    error_id: ERR_AWARD_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /yellow-ribbon-awards"

  - priority: 35
    category: business_constraint
    check: "certification.tuition_payment_posted_on IS NULL (a VA payment may be recorded only once per certification)"
    error_id: ERR_VA_PAYMENT_ALREADY_RECORDED
    http_status: 409
    applies_to: "POST /enrollment-certifications/{id}/record-va-payment"

  - priority: 36
    category: business_constraint
    check: "to_iso8601 is on or after the current logical clock value (the clock never moves backwards)"
    error_id: ERR_CLOCK_REWIND
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"

  - priority: 37
    category: business_fiscal
    check: "agreement.participant_count < agreement.max_participants"
    error_id: ERR_YR_PARTICIPANT_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /yellow-ribbon-awards"

  - priority: 38
    category: business_fiscal
    check: "agreement.pool_remaining_cents > 0"
    error_id: ERR_YR_POOL_EXHAUSTED
    http_status: 422
    applies_to: "POST /yellow-ribbon-awards"

  - priority: 39
    category: business_fiscal
    check: "On certify, the CALC-4 CALENDAR_FULL_TERM result is <= student.entitlement_days_remaining"
    error_id: ERR_INSUFFICIENT_ENTITLEMENT
    http_status: 422
    applies_to: "POST /enrollment-certifications/{id}/certify"

  - priority: 40
    category: business_fiscal
    check: "amount_cents <= debt.outstanding_cents"
    error_id: ERR_REPAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /benefit-debts/{id}/repayments"


# =============================================================================
# §1.5 API Endpoint Table
# api_prefix is the root, so every collection is a top-level segment and all
# cross-entity links travel in request bodies (flat topology). The single nested
# path is the append-only audit sub-resource.
# =============================================================================
endpoints:
  # --- logical clock (test-driving endpoint, §1.5 ladder rung 3) --------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock. The clock's startup default is exactly 2026-08-01T00:00:00Z and the server MUST NOT fall back to real wall-clock time before or after this call. Every date-dependent rule (COE protection window, certification deadline, change-report lateness, debt notification deadline) reads this clock."
    roles: [VaProcessingOffice, SupervisorySCO]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "advances the logical clock to to_iso8601; rejected with ERR_CLOCK_REWIND if it would move backwards"
      - "recomputes VeteranStudent.benefit_payment_protected for every student per CALC-7"

  # --- CertifyingOfficial ----------------------------------------------------
  - method: POST
    path: "/certifying-officials"
    description: "Credential a school certifying official. Restricted to the VA processing office so that the officials table can be bootstrapped before any official exists."
    roles: [VaProcessingOffice]
    code: 201
    input: [full_name, email, official_level]
    output: CertifyingOfficial
    side_effects:
      - "creates the official with status = ACTIVE"
  - method: GET
    path: "/certifying-officials/{id}"
    description: "Read one certifying official"
    roles: [VaProcessingOffice, SupervisorySCO, SchoolCertifyingOfficial]
    code: 200
    input: []
    output: CertifyingOfficial
    side_effects: []
  - method: GET
    path: "/certifying-officials"
    description: "List certifying officials"
    roles: [VaProcessingOffice, SupervisorySCO, SchoolCertifyingOfficial]
    code: 200
    input: ["official_level?", "status?", "limit?", "offset?"]
    output: CertifyingOfficial[]
    side_effects: []
  - method: POST
    path: "/certifying-officials/{id}/deactivate"
    description: "Revoke an official's VA credentials"
    roles: [VaProcessingOffice]
    code: 200
    input: []
    output: CertifyingOfficial
    side_effects:
      - "sets status = INACTIVE (§1.2 CertifyingOfficial ACTIVE -> INACTIVE)"

  # --- VeteranStudent --------------------------------------------------------
  - method: POST
    path: "/veteran-students"
    description: "Register a veteran student and their benefit chapter and entitlement"
    roles: [SchoolCertifyingOfficial, SupervisorySCO]
    code: 201
    input: [student_number, full_name, chapter, benefit_level_pct, entitlement_days_granted, delimiting_date, "coe_issued_on?"]
    output: VeteranStudent
    side_effects:
      - "sets entitlement_days_remaining = entitlement_days_granted, coe_status = NOT_SUBMITTED, account_hold_status = NONE, benefit_payment_protected = false, open_debt_principal_cents = 0"
  - method: GET
    path: "/veteran-students/{id}"
    description: "Read one veteran student"
    roles: [SchoolCertifyingOfficial, SupervisorySCO, BursarOfficer, VaProcessingOffice, Student]
    code: 200
    input: []
    output: VeteranStudent
    side_effects: []
  - method: GET
    path: "/veteran-students"
    description: "List veteran students"
    roles: [SchoolCertifyingOfficial, SupervisorySCO, BursarOfficer, VaProcessingOffice]
    code: 200
    input: ["student_number?", "chapter?", "coe_status?", "account_hold_status?", "limit?", "offset?"]
    output: VeteranStudent[]
    side_effects: []
  - method: POST
    path: "/veteran-students/{id}/verify-coe"
    description: "Verify the student's Certificate of Eligibility and open the 38 USC 3679(e) protection window"
    roles: [SchoolCertifyingOfficial, SupervisorySCO]
    code: 200
    input: [coe_issued_on, verified_document_reference]
    output: VeteranStudent
    side_effects:
      - "sets coe_status = VERIFIED, coe_verified_on = clock date, protected_until = coe_verified_on + 90 days"
      - "recomputes benefit_payment_protected per CALC-7"
  - method: POST
    path: "/veteran-students/{id}/expire-coe"
    description: "Mark the Certificate of Eligibility expired following a VA entitlement review"
    roles: [VaProcessingOffice]
    code: 200
    input: []
    output: VeteranStudent
    side_effects:
      - "sets coe_status = EXPIRED and recomputes benefit_payment_protected per CALC-7"
  - method: POST
    path: "/veteran-students/{id}/account-holds"
    description: "Set or release the student's registration hold. Setting REGISTRATION_HOLD while the student is protected is a 38 USC 3679(e) violation."
    roles: [BursarOfficer]
    code: 200
    input: [hold_status]
    output: VeteranStudent
    side_effects:
      - "sets account_hold_status to the supplied value (parallel dimension; coe_status untouched)"

  # --- AcademicTerm ----------------------------------------------------------
  - method: POST
    path: "/academic-terms"
    description: "Create an academic term with its drop and certification deadlines"
    roles: [SupervisorySCO]
    code: 201
    input: [term_code, academic_year, term_type, start_date, end_date, drop_deadline, certification_deadline]
    output: AcademicTerm
    side_effects:
      - "creates the term with status = OPEN"
  - method: GET
    path: "/academic-terms/{id}"
    description: "Read one academic term"
    roles: [SchoolCertifyingOfficial, SupervisorySCO, BursarOfficer, VaProcessingOffice]
    code: 200
    input: []
    output: AcademicTerm
    side_effects: []
  - method: GET
    path: "/academic-terms"
    description: "List academic terms"
    roles: [SchoolCertifyingOfficial, SupervisorySCO, BursarOfficer, VaProcessingOffice]
    code: 200
    input: ["academic_year?", "term_type?", "status?", "limit?", "offset?"]
    output: AcademicTerm[]
    side_effects: []
  - method: POST
    path: "/academic-terms/{id}/close"
    description: "Close a term to new certification submissions"
    roles: [SupervisorySCO]
    code: 200
    input: []
    output: AcademicTerm
    side_effects:
      - "sets status = CLOSED; later submits for this term are rejected with ERR_TERM_CLOSED"

  # --- Program ---------------------------------------------------------------
  - method: POST
    path: "/programs"
    description: "Create a program of study with its full-time credit-hour definition and campus BAH rate"
    roles: [SupervisorySCO]
    code: 201
    input: [program_code, name, degree_level, full_time_credit_hours, campus_bah_monthly_cents]
    output: Program
    side_effects:
      - "creates the program with approval_status = DRAFT and approved_catalog_version_id = null"
  - method: GET
    path: "/programs/{id}"
    description: "Read one program"
    roles: [SchoolCertifyingOfficial, SupervisorySCO, StateApprovingAgent, BursarOfficer, VaProcessingOffice]
    code: 200
    input: []
    output: Program
    side_effects: []
  - method: GET
    path: "/programs"
    description: "List programs; filter by approval posture or by the catalog version currently pinned as approved"
    roles: [SchoolCertifyingOfficial, SupervisorySCO, StateApprovingAgent, BursarOfficer, VaProcessingOffice]
    code: 200
    input: ["approval_status?", "degree_level?", "approved_catalog_version_id?", "limit?", "offset?"]
    output: Program[]
    side_effects: []

  # --- CatalogVersion --------------------------------------------------------
  - method: POST
    path: "/catalog-versions"
    description: "Create a catalog version for a program with its compliance checklist and half-open effective window"
    roles: [SupervisorySCO]
    code: 201
    input: [program_id, catalog_year, effective_start, effective_end, has_published_tuition_schedule, has_refund_policy, has_program_length_disclosure]
    output: CatalogVersion
    side_effects:
      - "creates the catalog version with review_status = DRAFT"
      - "rejected with ERR_CATALOG_WINDOW_OVERLAP when [effective_start, effective_end) intersects another PENDING_SAA / APPROVED / APPROVED_WITH_CONDITIONS version of the same program"
  - method: GET
    path: "/catalog-versions/{id}"
    description: "Read one catalog version"
    roles: [SchoolCertifyingOfficial, SupervisorySCO, StateApprovingAgent, VaProcessingOffice]
    code: 200
    input: []
    output: CatalogVersion
    side_effects: []
  - method: GET
    path: "/catalog-versions"
    description: "List catalog versions, optionally scoped to one program"
    roles: [SchoolCertifyingOfficial, SupervisorySCO, StateApprovingAgent, VaProcessingOffice]
    code: 200
    input: ["program_id?", "review_status?", "catalog_year?", "limit?", "offset?"]
    output: CatalogVersion[]
    side_effects: []
  - method: POST
    path: "/catalog-versions/{id}/submit-to-saa"
    description: "Submit a catalog version to the State Approving Agency for review"
    roles: [SupervisorySCO]
    code: 200
    input: []
    output: CatalogVersion
    side_effects:
      - "sets review_status = PENDING_SAA"
      - "cascade L2: sets the referenced Program.approval_status = PENDING_SAA, which blocks certify with ERR_PROGRAM_NOT_APPROVED until the SAA decides"
  - method: POST
    path: "/catalog-versions/{id}/saa-decision"
    description: "Record the State Approving Agency's decision on a pending catalog version"
    roles: [StateApprovingAgent]
    code: 200
    input: [decision, "conditions_note?"]
    output: CatalogVersion
    side_effects:
      - "APPROVED: review_status = APPROVED, Program.approval_status = APPROVED, Program.approved_catalog_version_id = this id"
      - "APPROVED_WITH_CONDITIONS: review_status = APPROVED_WITH_CONDITIONS with conditions_note, Program.approval_status = CONDITIONAL, Program.approved_catalog_version_id = this id"
      - "REJECTED: review_status = REJECTED, Program.approval_status = DRAFT, Program.approved_catalog_version_id = null"
  - method: POST
    path: "/catalog-versions/{id}/suspend"
    description: "Suspend an approved catalog version for a compliance failure, triggering CASCADE-B"
    roles: [StateApprovingAgent]
    code: 200
    input: [suspension_reason]
    output: CatalogVersion
    side_effects:
      - "CASCADE-B L1: review_status = SUSPENDED with suspension_reason"
      - "CASCADE-B L2: every Program whose approved_catalog_version_id is this id becomes approval_status = SUSPENDED"
      - "CASCADE-B L3: every EnrollmentCertification of that program with status == SUBMITTED becomes RETURNED with return_reason = PROGRAM_SUSPENDED"
      - "CASCADE-B L4: one CertificationAuditEntry with event_type = CERTIFICATION_AUTO_RETURNED per auto-returned certification"

