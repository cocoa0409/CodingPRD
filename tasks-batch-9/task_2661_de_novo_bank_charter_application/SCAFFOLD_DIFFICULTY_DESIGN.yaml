  - rule_id: non_linear_state_machine
    instances:
      - name: filing_info_request_cycle_bounded_at_three_rounds_then_denied
        grounds:
          - state_machines.RegulatoryFiling.FILED_to_ADDITIONAL_INFO_REQUESTED
          - state_machines.RegulatoryFiling.ADDITIONAL_INFO_REQUESTED_to_FILED
          - state_machines.RegulatoryFiling.FILED_to_DENIED
          - state_machines.OrganizingGroup.UNDER_REVIEW_to_ORGANIZING
          - entities.RegulatoryFiling.fields.info_request_round
        distinguishing_aspect: >
          The non-linearity is a bounded CYCLE: FILED and ADDITIONAL_INFO_REQUESTED loop through
          each other, and the same trigger (decision=ADDITIONAL_INFO_REQUESTED) that produced a
          loop on rounds 1-3 produces a different target state (DENIED) on the fourth attempt
          because info_request_round has reached MAX_INFO_ROUNDS - the transition target depends
          on an accumulated counter, not on the trigger alone.
