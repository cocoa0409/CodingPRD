            - { call: "POST /safety/contractor-orgs/${c_id}/submit", payload: { emr: 0.50, trir: 0.0, safety_audit_pct: 80 }, as: ContractorRep, as_user_id: "${c_id}", captures: { s2: $.data.prequal_score } }
            - { call: "POST /safety/contractor-orgs/${c_id}/decide", payload: { decision: "APPROVE" }, as: SafetyManager, as_user_id: "${m_id}", captures: { st2: $.data.status, valid_until: $.data.prequal_valid_until } }
