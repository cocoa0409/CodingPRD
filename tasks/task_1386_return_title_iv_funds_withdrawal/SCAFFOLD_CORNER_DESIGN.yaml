      - name: return_amount_mismatch_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=12]"
          - "errors[ERR_RETURN_AMOUNT_MISMATCH]"
        distinguishing_aspect: "Fiscal exactness: returns are full-amount only — a partial or excess amount is a 422, and no partial state exists."
