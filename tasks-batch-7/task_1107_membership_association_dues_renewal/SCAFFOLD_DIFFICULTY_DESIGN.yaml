              payload: { category_id: "${cat}", effective_from: "2026-01-01T00:00:00Z", effective_to: null, annual_amount_cents: 120000, chapter_share_bps: 2000, increase_notice_days: 60 }
              as: DuesAdministrator
              captures: { s1: $.data.id }
            - call: "POST /api/dues-schedules/${s1}/publish"
              payload: {}
              as: DuesAdministrator
            - call: "POST /api/dues-schedules"
              payload: { category_id: "${cat}", effective_from: "2026-06-01T00:00:00Z", effective_to: null, annual_amount_cents: 130000, chapter_share_bps: 2000, increase_notice_days: 60 }
              as: DuesAdministrator
              captures: { s2: $.data.id }
          trigger:
            # negative test: publish S1 again (state violation) — even though S2 exists, S1's own state is the violation here
            - call: "POST /api/dues-schedules/${s1}/publish"
              payload: {}
              as: DuesAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (state priority 6 beats business_temporal priority 8)"

