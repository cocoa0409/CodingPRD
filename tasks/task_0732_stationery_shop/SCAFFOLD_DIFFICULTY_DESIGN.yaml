  # =====================================================================
  # Rule 9: Compensating-action invariants across DIFFERENT conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:

      - name: cash_conservation_deposit_pay_then_cancel_preserves_customer_ledger
        grounds:
          - calculations.cash_conservation_invariant
          - state_machines.Order.DEPOSIT_PENDING_to_CANCELLED
          - entities.Customer.fields.credit_balance_cents
          - entities.Customer.fields.cumulative_deposits_paid_cents
        distinguishing_aspect: |
          Conserved quantity #1 = MONETARY (cents). Forward action = /_payments/simulate deposit
          (moves $412.50 from external into Order.deposit_paid_cents). Compensating action =
          Order.DEPOSIT_PENDING → CANCELLED (moves same $412.50 into Customer.credit_balance_cents,
          zeroing Order.deposit_paid_cents). Named invariant:
            cust_ledger(c) = Customer.credit_balance_cents
                           + Σ Order.deposit_paid_cents for orders in {DEPOSIT_PENDING, IN_PRODUCTION,
                             READY_TO_SHIP, SHIPPED, DELIVERED}
          MUST equal Customer.cumulative_deposits_paid_cents (41250) after both actions.
