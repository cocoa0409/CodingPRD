# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x 2 instances = 18 instances. Grounds resolve into SCAFFOLD.yaml.
# All literal money/qty values were computed against the §1.3 formulas + constants.
# =============================================================================
scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_quote_vs_final_total
        grounds:
          - calculations.order_total
          - entities.Order.fields.quoted_total_cents
          - entities.Order.fields.final_total_cents
        distinguishing_aspect: |
          On the Order domain, quoted_total_cents (ordered qty 200) and final_total_cents
          (actual good qty 195 after spoilage) diverge: 121300 vs 118405.
        test_recipe:
          setup:
            - "Catalog + non-rush order (in_hands 2026-05-20), one SCREEN_PRINT line qty 200, 3 colors."
            - "Line pushed all the way through production shipping 195 good units (produced 205, spoiled 10)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: CatalogAdmin }
            - { call: "POST /suppliers", payload: { name: "BlankCo", blank_unit_cost_cents: 150, concurrent_capacity_units: 500 }, as: CatalogAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /products", payload: { supplier_id: "${sup_id}", sku: "TOTE", name: "Cotton Tote", min_order_qty: 48 }, as: CatalogAdmin, captures: { prod_id: "$.data.id" } }
            - { call: "POST /products/${prod_id}/price-tiers", payload: { decoration_method: "SCREEN_PRINT", min_quantity: 48, unit_price_cents: 599 }, as: CatalogAdmin }
            - { call: "POST /products/${prod_id}/price-tiers", payload: { decoration_method: "SCREEN_PRINT", min_quantity: 144, unit_price_cents: 499 }, as: CatalogAdmin }
            - { call: "POST /decoration-stations", payload: { name: "Press1", station_type: "SCREEN_PRESS" }, as: CatalogAdmin, captures: { st_id: "$.data.id" } }
            - { call: "POST /customers", payload: { name: "Acme", initial_credit_cents: 500000 }, as: CatalogAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_type: "STANDARD", in_hands_date: "2026-05-20T00:00:00Z" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: "$.data.id" } }
            - { call: "POST /orders/${ord_id}/lines", payload: { product_id: "${prod_id}", decoration_method: "SCREEN_PRINT", quantity: 200, imprint_color_count: 3 }, as: Customer, as_user_id: "${cust_id}", captures: { line_id: "$.data.id", line_v: "$.data.version" } }
            - { call: "POST /order-lines/${line_id}/art-proofs", payload: { proof_url: "http://x/a.png", expected_order_line_version: "${line_v}" }, as: AccountManager, captures: { proof_id: "$.data.id" } }
            - { call: "POST /art-proofs/${proof_id}/submit", payload: {}, as: AccountManager }
            - { call: "POST /art-proofs/${proof_id}/approve", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${ord_id}/quote", payload: {}, as: AccountManager }
            - { call: "POST /orders/${ord_id}/payments", payload: { amount_cents: 60650 }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${ord_id}/confirm", payload: {}, as: AccountManager }
            - { call: "POST /purchase-orders", payload: { order_line_id: "${line_id}", supplier_id: "${sup_id}", ordered_blank_qty: 210, production_start: "2026-05-05T00:00:00Z", production_end: "2026-05-08T00:00:00Z" }, as: AccountManager, captures: { po_id: "$.data.id" } }
            - { call: "POST /purchase-orders/${po_id}/issue", payload: {}, as: AccountManager }
            - { call: "POST /purchase-orders/${po_id}/receive", payload: { received_blank_qty: 205 }, as: ProductionManager }
            - { call: "POST /orders/${ord_id}/start-production", payload: {}, as: ProductionManager }
            - { call: "POST /order-lines/${line_id}/schedule", payload: { station_id: "${st_id}", scheduled_start: "2026-05-10T09:00:00Z", scheduled_end: "2026-05-10T12:00:00Z" }, as: ProductionManager }
            - { call: "POST /order-lines/${line_id}/start-print", payload: {}, as: ProductionManager }
            - { call: "POST /order-lines/${line_id}/complete-run", payload: { produced_qty: 205, spoiled_qty: 10 }, as: ProductionManager }
            - { call: "POST /order-lines/${line_id}/qc", payload: { result: "PASS" }, as: ProductionManager }
          trigger:
            - { call: "POST /shipments", payload: { order_id: "${ord_id}", carrier: "UPS" }, as: ProductionManager }
          assert:
            - "Order.${ord_id}.quoted_total_cents == 121300"
            - "Order.${ord_id}.final_total_cents == 118405"
            - "Order.${ord_id}.quoted_total_cents != Order.${ord_id}.final_total_cents"

      - name: blank_estimated_vs_actual_cost
        grounds:
          - calculations.blank_cost
          - entities.PurchaseOrder.fields.estimated_blank_cost_cents
          - entities.PurchaseOrder.fields.actual_blank_cost_cents
        distinguishing_aspect: |
          On the PurchaseOrder (supplier-sourcing) domain — a different entity from Order —
          estimated_blank_cost_cents (ordered 210 -> 31500) and actual_blank_cost_cents
          (received 205 -> 30750) diverge.
        test_recipe:
          setup:
            - "Confirmed order with one line; a PurchaseOrder for that line ISSUED (ordered 210)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: CatalogAdmin }
            - { call: "POST /suppliers", payload: { name: "BlankCo", blank_unit_cost_cents: 150, concurrent_capacity_units: 500 }, as: CatalogAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /products", payload: { supplier_id: "${sup_id}", sku: "TOTE", name: "Cotton Tote", min_order_qty: 48 }, as: CatalogAdmin, captures: { prod_id: "$.data.id" } }
            - { call: "POST /products/${prod_id}/price-tiers", payload: { decoration_method: "SCREEN_PRINT", min_quantity: 48, unit_price_cents: 599 }, as: CatalogAdmin }
            - { call: "POST /products/${prod_id}/price-tiers", payload: { decoration_method: "SCREEN_PRINT", min_quantity: 144, unit_price_cents: 499 }, as: CatalogAdmin }
            - { call: "POST /customers", payload: { name: "Acme", initial_credit_cents: 500000 }, as: CatalogAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_type: "STANDARD", in_hands_date: "2026-05-20T00:00:00Z" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: "$.data.id" } }
            - { call: "POST /orders/${ord_id}/lines", payload: { product_id: "${prod_id}", decoration_method: "SCREEN_PRINT", quantity: 200, imprint_color_count: 3 }, as: Customer, as_user_id: "${cust_id}", captures: { line_id: "$.data.id", line_v: "$.data.version" } }
            - { call: "POST /order-lines/${line_id}/art-proofs", payload: { proof_url: "http://x/a.png", expected_order_line_version: "${line_v}" }, as: AccountManager, captures: { proof_id: "$.data.id" } }
            - { call: "POST /art-proofs/${proof_id}/submit", payload: {}, as: AccountManager }
            - { call: "POST /art-proofs/${proof_id}/approve", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${ord_id}/quote", payload: {}, as: AccountManager }
            - { call: "POST /orders/${ord_id}/payments", payload: { amount_cents: 60650 }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${ord_id}/confirm", payload: {}, as: AccountManager }
            - { call: "POST /purchase-orders", payload: { order_line_id: "${line_id}", supplier_id: "${sup_id}", ordered_blank_qty: 210, production_start: "2026-05-05T00:00:00Z", production_end: "2026-05-08T00:00:00Z" }, as: AccountManager, captures: { po_id: "$.data.id" } }
            - { call: "POST /purchase-orders/${po_id}/issue", payload: {}, as: AccountManager }
          trigger:
            - { call: "POST /purchase-orders/${po_id}/receive", payload: { received_blank_qty: 205 }, as: ProductionManager }
          assert:
            - "PurchaseOrder.${po_id}.estimated_blank_cost_cents == 31500"
            - "PurchaseOrder.${po_id}.actual_blank_cost_cents == 30750"
            - "PurchaseOrder.${po_id}.estimated_blank_cost_cents != PurchaseOrder.${po_id}.actual_blank_cost_cents"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: line_subtotal_tiered_multicolor
        grounds:
          - calculations.line_subtotal
          - entities.OrderLine.fields.unit_price_cents
          - entities.OrderLine.fields.line_setup_cents
          - entities.OrderLine.fields.line_subtotal_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — quantity-tier selection
          (200 selects the 144 tier -> 499), extra-color run charge (2*40*200), and
          method setup with per-extra-color setup (2500 + 2*1500) combine to 121300.
        test_recipe:
          setup:
            - "Catalog with SCREEN_PRINT tiers 48->599 and 144->499; a draft order."
          setup_api_calls:
            - { call: "POST /suppliers", payload: { name: "BlankCo", blank_unit_cost_cents: 150, concurrent_capacity_units: 500 }, as: CatalogAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /products", payload: { supplier_id: "${sup_id}", sku: "TOTE", name: "Cotton Tote", min_order_qty: 48 }, as: CatalogAdmin, captures: { prod_id: "$.data.id" } }
            - { call: "POST /products/${prod_id}/price-tiers", payload: { decoration_method: "SCREEN_PRINT", min_quantity: 48, unit_price_cents: 599 }, as: CatalogAdmin }
            - { call: "POST /products/${prod_id}/price-tiers", payload: { decoration_method: "SCREEN_PRINT", min_quantity: 144, unit_price_cents: 499 }, as: CatalogAdmin }
            - { call: "POST /customers", payload: { name: "Acme", initial_credit_cents: 500000 }, as: CatalogAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_type: "STANDARD", in_hands_date: "2026-05-20T00:00:00Z" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: "$.data.id" } }
          trigger:
            - { call: "POST /orders/${ord_id}/lines", payload: { product_id: "${prod_id}", decoration_method: "SCREEN_PRINT", quantity: 200, imprint_color_count: 3 }, as: Customer, as_user_id: "${cust_id}", captures: { line_id: "$.data.id" } }
          assert:
            - "OrderLine.${line_id}.unit_price_cents == 499"
            - "OrderLine.${line_id}.line_setup_cents == 5500"
            - "OrderLine.${line_id}.line_subtotal_cents == 121300"

      - name: order_total_rush_rounding_order
        grounds:
          - calculations.order_total
          - entities.Order.fields.quoted_rush_cents
          - entities.Order.fields.quoted_total_cents
        distinguishing_aspect: |
          Mode (b): rounding order is pinned sum-then-round. Two lines with subtotals
          31252 and 76352 give rush = round_half_up(107604*0.20) = 21521; the per-line
          rounding (6250+15270=21520) is the wrong answer — the assert distinguishes them.
        test_recipe:
          setup:
            - "Rush order (in_hands 2026-05-09, lead 8 < 10). Line A qty 48 1-color (subtotal 31252), Line B qty 148 1-color (subtotal 76352)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: CatalogAdmin }
            - { call: "POST /suppliers", payload: { name: "BlankCo", blank_unit_cost_cents: 150, concurrent_capacity_units: 500 }, as: CatalogAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /products", payload: { supplier_id: "${sup_id}", sku: "TOTE", name: "Cotton Tote", min_order_qty: 48 }, as: CatalogAdmin, captures: { prod_id: "$.data.id" } }
            - { call: "POST /products/${prod_id}/price-tiers", payload: { decoration_method: "SCREEN_PRINT", min_quantity: 48, unit_price_cents: 599 }, as: CatalogAdmin }
            - { call: "POST /products/${prod_id}/price-tiers", payload: { decoration_method: "SCREEN_PRINT", min_quantity: 144, unit_price_cents: 499 }, as: CatalogAdmin }
            - { call: "POST /customers", payload: { name: "Acme", initial_credit_cents: 500000 }, as: CatalogAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_type: "STANDARD", in_hands_date: "2026-05-09T00:00:00Z" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: "$.data.id" } }
            - { call: "POST /orders/${ord_id}/lines", payload: { product_id: "${prod_id}", decoration_method: "SCREEN_PRINT", quantity: 48, imprint_color_count: 1 }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${ord_id}/lines", payload: { product_id: "${prod_id}", decoration_method: "SCREEN_PRINT", quantity: 148, imprint_color_count: 1 }, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /orders/${ord_id}/quote", payload: {}, as: AccountManager }
          assert:
            - "Order.${ord_id}.is_rush == true"
            - "Order.${ord_id}.quoted_subtotal_cents == 107604"
            - "Order.${ord_id}.quoted_rush_cents == 21521"
            - "Order.${ord_id}.quoted_total_cents == 129125"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: art_proof_revision_cycle
        grounds:
          - state_machines.ArtProof.PENDING_APPROVAL_to_CHANGES_REQUESTED
          - state_machines.ArtProof.CHANGES_REQUESTED_to_PENDING_APPROVAL
          - state_machines.ArtProof.PENDING_APPROVAL_to_APPROVED
        distinguishing_aspect: |
          ArtProof is cyclic: it re-enters PENDING_APPROVAL after CHANGES_REQUESTED
          (a revision loop) before reaching APPROVED — not a linear pipeline.
        test_recipe:
          setup:
            - "A line with one submitted proof in PENDING_APPROVAL."
          setup_api_calls:
            - { call: "POST /suppliers", payload: { name: "BlankCo", blank_unit_cost_cents: 150, concurrent_capacity_units: 500 }, as: CatalogAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /products", payload: { supplier_id: "${sup_id}", sku: "TOTE", name: "Cotton Tote", min_order_qty: 48 }, as: CatalogAdmin, captures: { prod_id: "$.data.id" } }
            - { call: "POST /products/${prod_id}/price-tiers", payload: { decoration_method: "SCREEN_PRINT", min_quantity: 48, unit_price_cents: 599 }, as: CatalogAdmin }
            - { call: "POST /products/${prod_id}/price-tiers", payload: { decoration_method: "SCREEN_PRINT", min_quantity: 144, unit_price_cents: 499 }, as: CatalogAdmin }
            - { call: "POST /customers", payload: { name: "Acme", initial_credit_cents: 500000 }, as: CatalogAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_type: "STANDARD", in_hands_date: "2026-05-20T00:00:00Z" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: "$.data.id" } }
            - { call: "POST /orders/${ord_id}/lines", payload: { product_id: "${prod_id}", decoration_method: "SCREEN_PRINT", quantity: 200, imprint_color_count: 3 }, as: Customer, as_user_id: "${cust_id}", captures: { line_id: "$.data.id", line_v: "$.data.version" } }
            - { call: "POST /order-lines/${line_id}/art-proofs", payload: { proof_url: "http://x/a.png", expected_order_line_version: "${line_v}" }, as: AccountManager, captures: { proof_id: "$.data.id" } }
            - { call: "POST /art-proofs/${proof_id}/submit", payload: {}, as: AccountManager }
          trigger:
            - { call: "POST /art-proofs/${proof_id}/request-changes", payload: { notes: "make logo bigger" }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /art-proofs/${proof_id}/submit", payload: {}, as: AccountManager }
            - { call: "POST /art-proofs/${proof_id}/approve", payload: {}, as: Customer, as_user_id: "${cust_id}" }
          assert:
            - "ArtProof.${proof_id}.status == APPROVED"
            - "ArtProof.${proof_id}.approved_version == 2"
            - "OrderLine.${line_id}.status == ART_READY"

      - name: order_parallel_payment_fulfillment
        grounds:
          - state_machines.Order.UNPAID_to_DEPOSIT_PAID
          - state_machines.Order.QUOTED_to_CONFIRMED
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: |
          Order carries two independent axes on one row: payment_status advances to
          DEPOSIT_PAID via /payments while fulfillment_status is still QUOTED, then
          fulfillment advances to CONFIRMED while payment_status stays DEPOSIT_PAID.
        test_recipe:
          setup:
            - "Quoted order (non-rush, total 121300, deposit_required 60650) with approved art."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: CatalogAdmin }
            - { call: "POST /suppliers", payload: { name: "BlankCo", blank_unit_cost_cents: 150, concurrent_capacity_units: 500 }, as: CatalogAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /products", payload: { supplier_id: "${sup_id}", sku: "TOTE", name: "Cotton Tote", min_order_qty: 48 }, as: CatalogAdmin, captures: { prod_id: "$.data.id" } }
            - { call: "POST /products/${prod_id}/price-tiers", payload: { decoration_method: "SCREEN_PRINT", min_quantity: 48, unit_price_cents: 599 }, as: CatalogAdmin }
            - { call: "POST /products/${prod_id}/price-tiers", payload: { decoration_method: "SCREEN_PRINT", min_quantity: 144, unit_price_cents: 499 }, as: CatalogAdmin }
            - { call: "POST /customers", payload: { name: "Acme", initial_credit_cents: 500000 }, as: CatalogAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_type: "STANDARD", in_hands_date: "2026-05-20T00:00:00Z" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: "$.data.id" } }
            - { call: "POST /orders/${ord_id}/lines", payload: { product_id: "${prod_id}", decoration_method: "SCREEN_PRINT", quantity: 200, imprint_color_count: 3 }, as: Customer, as_user_id: "${cust_id}", captures: { line_id: "$.data.id", line_v: "$.data.version" } }
            - { call: "POST /order-lines/${line_id}/art-proofs", payload: { proof_url: "http://x/a.png", expected_order_line_version: "${line_v}" }, as: AccountManager, captures: { proof_id: "$.data.id" } }
            - { call: "POST /art-proofs/${proof_id}/submit", payload: {}, as: AccountManager }
            - { call: "POST /art-proofs/${proof_id}/approve", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${ord_id}/quote", payload: {}, as: AccountManager }
          trigger:
            - { call: "POST /orders/${ord_id}/payments", payload: { amount_cents: 60650 }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${ord_id}/confirm", payload: {}, as: AccountManager }
          assert:
            - "Order.${ord_id}.fulfillment_status == CONFIRMED"
            - "Order.${ord_id}.payment_status == DEPOSIT_PAID"
            - "Order.${ord_id}.escrow_cents == 60650"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: order_cancel_line_po_supplier
        grounds:
          - state_machines.Order.CONFIRMED_to_CANCELLED
          - state_machines.OrderLine.CONFIRMED_to_CANCELLED
          - state_machines.PurchaseOrder.ISSUED_to_CANCELLED
          - entities.Supplier.fields.reserved_blank_qty
        distinguishing_aspect: |
          Depth-3 chain from Order cancel: Order->CANCELLED bumps OrderLine->CANCELLED,
          which itself cancels the line's ISSUED PurchaseOrder, which itself releases
          Supplier.reserved_blank_qty (210 -> 0). Each hop is caused by the prior.
        test_recipe:
          setup:
            - "Confirmed order (deposit 60650 paid), one line, its PurchaseOrder ISSUED (ordered 210, supplier reserved 210)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: CatalogAdmin }
            - { call: "POST /suppliers", payload: { name: "BlankCo", blank_unit_cost_cents: 150, concurrent_capacity_units: 500 }, as: CatalogAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /products", payload: { supplier_id: "${sup_id}", sku: "TOTE", name: "Cotton Tote", min_order_qty: 48 }, as: CatalogAdmin, captures: { prod_id: "$.data.id" } }
            - { call: "POST /products/${prod_id}/price-tiers", payload: { decoration_method: "SCREEN_PRINT", min_quantity: 48, unit_price_cents: 599 }, as: CatalogAdmin }
            - { call: "POST /products/${prod_id}/price-tiers", payload: { decoration_method: "SCREEN_PRINT", min_quantity: 144, unit_price_cents: 499 }, as: CatalogAdmin }
            - { call: "POST /customers", payload: { name: "Acme", initial_credit_cents: 500000 }, as: CatalogAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_type: "STANDARD", in_hands_date: "2026-05-20T00:00:00Z" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: "$.data.id" } }
            - { call: "POST /orders/${ord_id}/lines", payload: { product_id: "${prod_id}", decoration_method: "SCREEN_PRINT", quantity: 200, imprint_color_count: 3 }, as: Customer, as_user_id: "${cust_id}", captures: { line_id: "$.data.id", line_v: "$.data.version" } }
            - { call: "POST /order-lines/${line_id}/art-proofs", payload: { proof_url: "http://x/a.png", expected_order_line_version: "${line_v}" }, as: AccountManager, captures: { proof_id: "$.data.id" } }
            - { call: "POST /art-proofs/${proof_id}/submit", payload: {}, as: AccountManager }
            - { call: "POST /art-proofs/${proof_id}/approve", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${ord_id}/quote", payload: {}, as: AccountManager }
            - { call: "POST /orders/${ord_id}/payments", payload: { amount_cents: 60650 }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${ord_id}/confirm", payload: {}, as: AccountManager }
            - { call: "POST /purchase-orders", payload: { order_line_id: "${line_id}", supplier_id: "${sup_id}", ordered_blank_qty: 210, production_start: "2026-05-05T00:00:00Z", production_end: "2026-05-08T00:00:00Z" }, as: AccountManager, captures: { po_id: "$.data.id" } }
            - { call: "POST /purchase-orders/${po_id}/issue", payload: {}, as: AccountManager }
          trigger:
            - { call: "POST /orders/${ord_id}/cancel", payload: {}, as: AccountManager }
          assert:
            - "Order.${ord_id}.fulfillment_status == CANCELLED"
            - "OrderLine.${line_id}.status == CANCELLED"
            - "PurchaseOrder.${po_id}.status == CANCELLED"
            - "Supplier.${sup_id}.reserved_blank_qty == 0"
            - "Customer.${cust_id}.credit_balance_cents == 500000"

      - name: art_approve_line_order_artcomplete
        grounds:
          - state_machines.ArtProof.PENDING_APPROVAL_to_APPROVED
          - state_machines.OrderLine.PENDING_ART_to_ART_READY
          - entities.Order.fields.art_complete
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (art approve): ArtProof->APPROVED bumps
          OrderLine->ART_READY, which itself bubbles Order.art_complete to true.
        test_recipe:
          setup:
            - "A line with one submitted proof PENDING_APPROVAL; Order.art_complete is false."
          setup_api_calls:
