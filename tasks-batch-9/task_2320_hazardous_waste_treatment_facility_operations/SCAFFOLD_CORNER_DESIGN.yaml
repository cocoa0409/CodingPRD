        grounds:
          - validations[priority=19]
          - errors[ERR_CONTAINER_OVERFILLED]
          - entities.Container.fields.net_weight_kg
        distinguishing_aspect: |
          The 95% fill ceiling is a cross-field business rule, not a schema bound: 195.0 kg in a
          200.0 kg drum is a well-formed request that is refused at priority 19 with 422, while
          190.0 kg — exactly the ceiling — is accepted.
        test_recipe:
          setup:
            - "Standard chain to a received manifest line; unit CA-01 empty"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
