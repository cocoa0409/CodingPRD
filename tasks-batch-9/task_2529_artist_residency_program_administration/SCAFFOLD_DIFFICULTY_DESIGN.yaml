      - name: residency_state_check_beats_meal_plan_unavailable
        grounds: "§1.4 P26 ERR_RESIDENCY_NOT_SCHEDULED (state, 409) with conflict_note, P57 ERR_MEAL_PLAN_NOT_AVAILABLE (business_constraint, 422); §1.5 POST /housing-assignments; §1.3 calculations.housing_occupancy meal plan gate"
        distinguishing_aspect: |
          Category pair: state < business_constraint - the third distinct pair, on a third
          endpoint. Housing may only be booked while a residency is still SCHEDULED, and a meal
          plan may only be selected on a unit that includes meals. A request that asks for meals
          on a no-meal unit FOR AN ALREADY CHECKED-IN RESIDENT breaks both. The state answer wins
          because it is the one that cannot be fixed by editing the payload: dropping
          meal_plan_selected would still leave an IN_RESIDENCE residency ineligible, so reporting
          the meal-plan problem first sends the caller down a dead end.
        test_recipe:
          setup: |
            One cycle, one discipline, two applicants, two invited residencies A and B, both
            scheduled for 8 weeks from 2026-11-02 while the clock is at 2026-08-10. Residency A
            records both trainings, the clock is advanced to the session start and A is CHECKED IN,
            so A.status is IN_RESIDENCE. Residency B is left SCHEDULED. A single housing unit H-01
            is created with meal_plan_included = false and bed_count 2, so neither P69 capacity nor
            P47 interval can interfere with the pair under test.
