# =============================================================================
# task_0175_art_auction_consignment — §1.8 Scaffold Difficulty Design
# Test Targeting Index: nine §0.5 Difficulty Rules x >=2 instances each.
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1-§1.7.
# Numeric asserts are literals pre-computed against §1.3 formulas + constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dual_variant_buyers_premium_vs_seller_net_diverge
        grounds:
          - calculations.buyers_premium
          - calculations.seller_net_payable
          - state_machines.Lot.NONE_to_INVOICED
          - state_machines.Lot.INVOICED_to_STATEMENTED
        distinguishing_aspect: |
          The two computed charges operate on different entity domains from the
          same hammer: buyers_premium is a buyer-side charge on Invoice
          (1,250,000 hammer -> +325,000 premium, total 1,575,000), while
          seller_net_payable is a seller-side payout on SellerStatement
          (same 1,250,000 hammer -> -125,000 commission -50,000 royalty =
          1,075,000 net). Identical hammer, two different subjects, two
          different numbers.
        test_recipe:
          setup:
            - "PremiumSchedule 'Standard' (26%/20%/14.5% marginal tiers)."
            - "Consignment ACTIVE, commission 1000 bps; Seller exists."
            - "AuctionSale CLOSED with one SOLD lot at hammer 1,250,000, artist_alive=true."
            - "Invoice ISSUED then PAID; lot at settlement_status INVOICED ready to statement."
          setup_api_calls:
            - call: "POST /premium-schedules"
              payload: { name: "Standard", tiers: [ { upper_bound_cents: 3000000, rate_bps: 2600 }, { upper_bound_cents: 60000000, rate_bps: 2000 }, { upper_bound_cents: null, rate_bps: 1450 } ] }
              as: SaleAdministrator
              captures: { sched_id: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Acme Estate", email: "estate@x.com", country_code: "FR", payout_iban: "FR7600000000000000000000001" }
              as: SaleAdministrator
              captures: { seller_id: $.data.id }
            - call: "POST /bidders"
              payload: { legal_name: "Buyer One", email: "b1@x.com", country_code: "US", credit_limit_cents: 500000000 }
              as: SaleAdministrator
              captures: { bidder_id: $.data.id }
            - call: "POST /consignments"
              payload: { seller_id: "${seller_id}", seller_commission_bps: 1000 }
              as: SaleAdministrator
              captures: { cons_id: $.data.id, cons_v: $.data.version }
            - call: "POST /consignments/${cons_id}/activate"
              payload: { expected_consignment_version: "${cons_v}" }
              as: SaleAdministrator
            - call: "POST /auction-sales"
              payload: { title: "June Modern", sale_date_utc: "2026-06-20T15:00:00Z", currency: "USD", buyers_premium_schedule_id: "${sched_id}" }
              as: SaleAdministrator
              captures: { sale_id: $.data.id }
            - call: "POST /auction-sales/${sale_id}/lots"
              payload: { consignment_id: "${cons_id}", lot_number: 1, title: "Composition", artist_name: "Living Artist", artist_alive: true, low_estimate_cents: 1300000, high_estimate_cents: 1800000, reserve_cents: 1000000 }
              as: SaleAdministrator
              captures: { lot_id: $.data.id }
            - call: "POST /paddle-registrations"
              payload: { auction_sale_id: "${sale_id}", bidder_id: "${bidder_id}", registration_type: "FLOOR" }
              as: SaleAdministrator
              captures: { paddle_id: $.data.id }
            - call: "GET /auction-sales/${sale_id}"
              payload: {}
              as: SaleAdministrator
              captures: { sale_v1: $.data.version }
            - call: "POST /auction-sales/${sale_id}/publish"
              payload: { expected_auction_sale_version: "${sale_v1}" }
              as: SaleAdministrator
              captures: { sale_v2: $.data.version }
            - call: "POST /auction-sales/${sale_id}/open-bidding"
              payload: { expected_auction_sale_version: "${sale_v2}" }
              as: Auctioneer
              captures: { sale_v3: $.data.version }
            - call: "POST /lots/${lot_id}/bids"
              payload: { paddle_registration_id: "${paddle_id}", amount_cents: 1000000, bid_channel: "FLOOR" }
              as: Auctioneer
            - call: "POST /lots/${lot_id}/bids"
              payload: { paddle_registration_id: "${paddle_id}", amount_cents: 1250000, bid_channel: "FLOOR" }
              as: Auctioneer
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: Auctioneer
              captures: { lot_v_kd: $.data.version }
            - call: "POST /lots/${lot_id}/knock-down"
              payload: { expected_lot_version: "${lot_v_kd}" }
              as: Auctioneer
            - call: "GET /auction-sales/${sale_id}"
              payload: {}
              as: Auctioneer
              captures: { sale_v4: $.data.version }
            - call: "POST /auction-sales/${sale_id}/close"
              payload: { expected_auction_sale_version: "${sale_v4}" }
              as: Auctioneer
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: FinanceOfficer
              captures: { lot_v_inv: $.data.version }
            - call: "POST /lots/${lot_id}/invoice"
              payload: { expected_lot_version: "${lot_v_inv}" }
              as: FinanceOfficer
              captures: { inv_id: $.data.id, inv_v: $.data.version, total_due: $.data.total_due_cents }
            - call: "POST /invoices/${inv_id}/payments"
              payload: { amount_cents: 1575000, expected_invoice_version: "${inv_v}" }
              as: FinanceOfficer
          trigger:
            - call: "GET /invoices/${inv_id}"
              payload: {}
              as: FinanceOfficer
              captures: { bp: $.data.buyers_premium_cents, td: $.data.total_due_cents }
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: FinanceOfficer
              captures: { lot_v_stmt: $.data.version }
            - call: "POST /lots/${lot_id}/statement"
              payload: { expected_lot_version: "${lot_v_stmt}" }
              as: FinanceOfficer
              captures: { stmt_comm: $.data.seller_commission_cents, stmt_net: $.data.net_payable_cents }
          assert:
            - "Invoice.${inv_id}.buyers_premium_cents == 325000"
            - "Invoice.${inv_id}.total_due_cents == 1575000"
            - "SellerStatement.seller_commission_cents == 125000"
            - "SellerStatement.net_payable_cents == 1075000"
            - "Invoice.${inv_id}.total_due_cents (1575000) != SellerStatement.net_payable_cents (1075000)"

      - name: dual_variant_royalty_eligible_vs_ineligible
        grounds:
          - calculations.resale_royalty_due
          - calculations.seller_net_payable
          - state_machines.Lot.NONE_to_INVOICED
          - entities.Lot.fields.artist_alive
        distinguishing_aspect: |
          resale_royalty_due (artist-royalty domain on ResaleRoyalty) and
          seller_net_payable (seller-payout domain on SellerStatement) yield
          different ledgers for the same hammer 1,250,000 depending on
          artist_alive: with artist_alive=false NO ResaleRoyalty row exists and
          net = 1,250,000 - commission(187,500 at 15%) - 0 = 1,062,500; the
          royalty domain produces nothing while the payout domain still bills
          commission. Different entity domains, demonstrably divergent outputs.
        test_recipe:
          setup:
            - "Same Standard schedule; Consignment ACTIVE commission 1500 bps."
            - "SOLD lot hammer 1,250,000 with artist_alive=false; sale CLOSED; invoice PAID."
          setup_api_calls:
            - call: "POST /premium-schedules"
              payload: { name: "Standard", tiers: [ { upper_bound_cents: 3000000, rate_bps: 2600 }, { upper_bound_cents: 60000000, rate_bps: 2000 }, { upper_bound_cents: null, rate_bps: 1450 } ] }
              as: SaleAdministrator
              captures: { sched_id: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Estate B", email: "estateb@x.com", country_code: "US", payout_iban: "US00000000000000000000002" }
              as: SaleAdministrator
              captures: { seller_id: $.data.id }
            - call: "POST /bidders"
              payload: { legal_name: "Buyer Two", email: "b2@x.com", country_code: "US", credit_limit_cents: 500000000 }
              as: SaleAdministrator
              captures: { bidder_id: $.data.id }
            - call: "POST /consignments"
              payload: { seller_id: "${seller_id}", seller_commission_bps: 1500 }
              as: SaleAdministrator
              captures: { cons_id: $.data.id, cons_v: $.data.version }
            - call: "POST /consignments/${cons_id}/activate"
              payload: { expected_consignment_version: "${cons_v}" }
              as: SaleAdministrator
            - call: "POST /auction-sales"
              payload: { title: "Estate B Sale", sale_date_utc: "2026-07-01T15:00:00Z", currency: "USD", buyers_premium_schedule_id: "${sched_id}" }
              as: SaleAdministrator
              captures: { sale_id: $.data.id }
            - call: "POST /auction-sales/${sale_id}/lots"
              payload: { consignment_id: "${cons_id}", lot_number: 1, title: "Old Master", artist_name: "Deceased Master", artist_alive: false, low_estimate_cents: 1300000, high_estimate_cents: 1800000, reserve_cents: 1000000 }
              as: SaleAdministrator
              captures: { lot_id: $.data.id }
            - call: "POST /paddle-registrations"
              payload: { auction_sale_id: "${sale_id}", bidder_id: "${bidder_id}", registration_type: "FLOOR" }
              as: SaleAdministrator
              captures: { paddle_id: $.data.id }
            - call: "GET /auction-sales/${sale_id}"
              payload: {}
              as: SaleAdministrator
              captures: { sale_v1: $.data.version }
            - call: "POST /auction-sales/${sale_id}/publish"
              payload: { expected_auction_sale_version: "${sale_v1}" }
              as: SaleAdministrator
              captures: { sale_v2: $.data.version }
            - call: "POST /auction-sales/${sale_id}/open-bidding"
              payload: { expected_auction_sale_version: "${sale_v2}" }
              as: Auctioneer
            - call: "POST /lots/${lot_id}/bids"
              payload: { paddle_registration_id: "${paddle_id}", amount_cents: 1000000, bid_channel: "FLOOR" }
              as: Auctioneer
            - call: "POST /lots/${lot_id}/bids"
              payload: { paddle_registration_id: "${paddle_id}", amount_cents: 1250000, bid_channel: "FLOOR" }
              as: Auctioneer
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: Auctioneer
              captures: { lot_v_kd: $.data.version }
            - call: "POST /lots/${lot_id}/knock-down"
              payload: { expected_lot_version: "${lot_v_kd}" }
              as: Auctioneer
            - call: "GET /auction-sales/${sale_id}"
              payload: {}
              as: Auctioneer
              captures: { sale_v4: $.data.version }
            - call: "POST /auction-sales/${sale_id}/close"
              payload: { expected_auction_sale_version: "${sale_v4}" }
              as: Auctioneer
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: FinanceOfficer
              captures: { lot_v_inv: $.data.version }
            - call: "POST /lots/${lot_id}/invoice"
              payload: { expected_lot_version: "${lot_v_inv}" }
              as: FinanceOfficer
              captures: { inv_id: $.data.id, inv_v: $.data.version }
            - call: "POST /invoices/${inv_id}/payments"
              payload: { amount_cents: 1575000, expected_invoice_version: "${inv_v}" }
              as: FinanceOfficer
          trigger:
            - call: "GET /lots/${lot_id}/resale-royalties"
              payload: {}
              as: FinanceOfficer
              captures: { roy_list: $.data }
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: FinanceOfficer
              captures: { lot_v_stmt: $.data.version }
            - call: "POST /lots/${lot_id}/statement"
              payload: { expected_lot_version: "${lot_v_stmt}" }
              as: FinanceOfficer
              captures: { stmt_net: $.data.net_payable_cents, stmt_roy: $.data.resale_royalty_withheld_cents }
          assert:
            - "GET /lots/${lot_id}/resale-royalties returns an empty array (no ResaleRoyalty created when artist_alive=false)"
            - "SellerStatement.resale_royalty_withheld_cents == 0"
            - "SellerStatement.seller_commission_cents == 187500"
            - "SellerStatement.net_payable_cents == 1062500"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: combinatorial_royalty_marginal_tiers_with_cap
        grounds:
          - calculations.resale_royalty_due
          - state_machines.Lot.NONE_to_INVOICED
        distinguishing_aspect: |
          Mode (a): >=3 inputs (hammer, artist_alive flag, 5-band marginal
          schedule) with non-linear interaction — marginal tier accumulation
          plus a min() cap. At hammer 200,000,000 the uncapped marginal sum
          exceeds ROYALTY_CAP_CENTS so royalty_cents == 1,250,000 (the cap),
          not the raw marginal total; the cap branch is what makes it non-linear.
        test_recipe:
          setup:
            - "Standard schedule; Consignment ACTIVE; lot hammer 200,000,000, artist_alive=true; sale CLOSED."
          setup_api_calls:
            - call: "POST /premium-schedules"
              payload: { name: "Standard", tiers: [ { upper_bound_cents: 3000000, rate_bps: 2600 }, { upper_bound_cents: 60000000, rate_bps: 2000 }, { upper_bound_cents: null, rate_bps: 1450 } ] }
              as: SaleAdministrator
              captures: { sched_id: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Estate C", email: "estatec@x.com", country_code: "FR", payout_iban: "FR0000000000000000000000003" }
              as: SaleAdministrator
              captures: { seller_id: $.data.id }
            - call: "POST /bidders"
              payload: { legal_name: "Whale Buyer", email: "whale@x.com", country_code: "US", credit_limit_cents: 9000000000 }
              as: SaleAdministrator
              captures: { bidder_id: $.data.id }
            - call: "POST /consignments"
              payload: { seller_id: "${seller_id}", seller_commission_bps: 1000 }
              as: SaleAdministrator
              captures: { cons_id: $.data.id, cons_v: $.data.version }
            - call: "POST /consignments/${cons_id}/activate"
              payload: { expected_consignment_version: "${cons_v}" }
              as: SaleAdministrator
            - call: "POST /auction-sales"
              payload: { title: "Masterworks", sale_date_utc: "2026-08-01T15:00:00Z", currency: "USD", buyers_premium_schedule_id: "${sched_id}" }
              as: SaleAdministrator
              captures: { sale_id: $.data.id }
            - call: "POST /auction-sales/${sale_id}/lots"
              payload: { consignment_id: "${cons_id}", lot_number: 1, title: "Iconic Work", artist_name: "Living Master", artist_alive: true, low_estimate_cents: 150000000, high_estimate_cents: 250000000, reserve_cents: 100000000 }
              as: SaleAdministrator
              captures: { lot_id: $.data.id }
            - call: "POST /paddle-registrations"
              payload: { auction_sale_id: "${sale_id}", bidder_id: "${bidder_id}", registration_type: "FLOOR" }
              as: SaleAdministrator
              captures: { paddle_id: $.data.id }
            - call: "GET /auction-sales/${sale_id}"
              payload: {}
              as: SaleAdministrator
              captures: { sale_v1: $.data.version }
            - call: "POST /auction-sales/${sale_id}/publish"
              payload: { expected_auction_sale_version: "${sale_v1}" }
              as: SaleAdministrator
              captures: { sale_v2: $.data.version }
            - call: "POST /auction-sales/${sale_id}/open-bidding"
              payload: { expected_auction_sale_version: "${sale_v2}" }
              as: Auctioneer
            - call: "POST /lots/${lot_id}/bids"
              payload: { paddle_registration_id: "${paddle_id}", amount_cents: 150000000, bid_channel: "FLOOR" }
              as: Auctioneer
            - call: "POST /lots/${lot_id}/bids"
              payload: { paddle_registration_id: "${paddle_id}", amount_cents: 200000000, bid_channel: "FLOOR" }
              as: Auctioneer
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: Auctioneer
              captures: { lot_v_kd: $.data.version }
            - call: "POST /lots/${lot_id}/knock-down"
              payload: { expected_lot_version: "${lot_v_kd}" }
              as: Auctioneer
            - call: "GET /auction-sales/${sale_id}"
              payload: {}
              as: Auctioneer
              captures: { sale_v4: $.data.version }
            - call: "POST /auction-sales/${sale_id}/close"
              payload: { expected_auction_sale_version: "${sale_v4}" }
              as: Auctioneer
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: FinanceOfficer
              captures: { lot_v_inv: $.data.version }
          trigger:
            - call: "POST /lots/${lot_id}/invoice"
              payload: { expected_lot_version: "${lot_v_inv}" }
              as: FinanceOfficer
            - call: "GET /lots/${lot_id}/resale-royalties"
              payload: {}
              as: FinanceOfficer
              captures: { roy0: "$.data[0].royalty_cents" }
          assert:
            - "GET /lots/${lot_id}/resale-royalties[0].royalty_cents == 1250000 (capped at ROYALTY_CAP_CENTS, below the uncapped marginal sum)"
            - "GET /lots/${lot_id}/resale-royalties[0].status == ACCRUED"

      - name: combinatorial_buyers_premium_rounding_order_pinned
        grounds:
          - calculations.buyers_premium
          - state_machines.Lot.NONE_to_INVOICED
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. With a 2-tier schedule
          (25.50% then 10.50%) at hammer 100,150 the pinned 'sum-exact-then-
          round-once' gives buyers_premium_cents == 25523, whereas the wrong
          'round-each-tier-then-sum' gives 25524 — a one-cent divergence the
          scaffold resolves in favor of sum-then-round.
        test_recipe:
          setup:
            - "PremiumSchedule 'HalfCent' tiers: {upper 100050, 2550 bps},{open, 1050 bps}."
            - "SOLD lot hammer 100,150 in a CLOSED sale."
          setup_api_calls:
            - call: "POST /premium-schedules"
              payload: { name: "HalfCent", tiers: [ { upper_bound_cents: 100050, rate_bps: 2550 }, { upper_bound_cents: null, rate_bps: 1050 } ] }
              as: SaleAdministrator
              captures: { sched_id: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Estate D", email: "estated@x.com", country_code: "US", payout_iban: "US00000000000000000000004" }
              as: SaleAdministrator
              captures: { seller_id: $.data.id }
            - call: "POST /bidders"
              payload: { legal_name: "Buyer D", email: "bd@x.com", country_code: "US", credit_limit_cents: 500000000 }
              as: SaleAdministrator
              captures: { bidder_id: $.data.id }
            - call: "POST /consignments"
              payload: { seller_id: "${seller_id}", seller_commission_bps: 1000 }
              as: SaleAdministrator
              captures: { cons_id: $.data.id, cons_v: $.data.version }
            - call: "POST /consignments/${cons_id}/activate"
              payload: { expected_consignment_version: "${cons_v}" }
              as: SaleAdministrator
            - call: "POST /auction-sales"
              payload: { title: "Small Works", sale_date_utc: "2026-09-01T15:00:00Z", currency: "USD", buyers_premium_schedule_id: "${sched_id}" }
              as: SaleAdministrator
              captures: { sale_id: $.data.id }
            - call: "POST /auction-sales/${sale_id}/lots"
              payload: { consignment_id: "${cons_id}", lot_number: 1, title: "Sketch", artist_name: "Minor Artist", artist_alive: false, low_estimate_cents: 110000, high_estimate_cents: 150000, reserve_cents: 90000 }
              as: SaleAdministrator
              captures: { lot_id: $.data.id }
            - call: "POST /paddle-registrations"
              payload: { auction_sale_id: "${sale_id}", bidder_id: "${bidder_id}", registration_type: "FLOOR" }
              as: SaleAdministrator
              captures: { paddle_id: $.data.id }
            - call: "GET /auction-sales/${sale_id}"
              payload: {}
              as: SaleAdministrator
              captures: { sale_v1: $.data.version }
            - call: "POST /auction-sales/${sale_id}/publish"
              payload: { expected_auction_sale_version: "${sale_v1}" }
              as: SaleAdministrator
              captures: { sale_v2: $.data.version }
            - call: "POST /auction-sales/${sale_id}/open-bidding"
              payload: { expected_auction_sale_version: "${sale_v2}" }
              as: Auctioneer
            - call: "POST /lots/${lot_id}/bids"
              payload: { paddle_registration_id: "${paddle_id}", amount_cents: 100150, bid_channel: "FLOOR" }
              as: Auctioneer
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: Auctioneer
              captures: { lot_v_kd: $.data.version }
            - call: "POST /lots/${lot_id}/knock-down"
              payload: { expected_lot_version: "${lot_v_kd}" }
              as: Auctioneer
            - call: "GET /auction-sales/${sale_id}"
              payload: {}
              as: Auctioneer
              captures: { sale_v4: $.data.version }
            - call: "POST /auction-sales/${sale_id}/close"
              payload: { expected_auction_sale_version: "${sale_v4}" }
              as: Auctioneer
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: FinanceOfficer
              captures: { lot_v_inv: $.data.version }
          trigger:
            - call: "POST /lots/${lot_id}/invoice"
              payload: { expected_lot_version: "${lot_v_inv}" }
              as: FinanceOfficer
              captures: { bp: $.data.buyers_premium_cents, td: $.data.total_due_cents }
          assert:
            - "Invoice.buyers_premium_cents == 25523 (sum-exact-then-round-once; NOT 25524)"
            - "Invoice.total_due_cents == 125673"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: nonlinear_lot_parallel_dimensions
        grounds:
          - state_machines.Lot.CATALOGED_to_OPEN
          - state_machines.Lot.OPEN_to_SOLD
          - state_machines.Lot.NONE_to_INVOICED
          - entities.Lot.fields.sale_status
          - entities.Lot.fields.settlement_status
        distinguishing_aspect: |
          Lot carries two independent state dimensions: sale_status
          (CATALOGED->OPEN->SOLD) and settlement_status (NONE->INVOICED). After
          knock-down sale_status==SOLD while settlement_status is still NONE;
          only the invoice action advances settlement_status to INVOICED while
          sale_status stays SOLD — the two axes evolve on the same Lot row
          independently.
        test_recipe:
          setup:
            - "Standard schedule, ACTIVE consignment, registered paddle."
            - "Sale taken LIVE, one lot bid up and knocked down SOLD, sale CLOSED."
          setup_api_calls:
            - call: "POST /premium-schedules"
              payload: { name: "Standard", tiers: [ { upper_bound_cents: 3000000, rate_bps: 2600 }, { upper_bound_cents: 60000000, rate_bps: 2000 }, { upper_bound_cents: null, rate_bps: 1450 } ] }
              as: SaleAdministrator
              captures: { sched_id: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Estate E", email: "estatee@x.com", country_code: "US", payout_iban: "US00000000000000000000005" }
              as: SaleAdministrator
              captures: { seller_id: $.data.id }
            - call: "POST /bidders"
              payload: { legal_name: "Buyer E", email: "be@x.com", country_code: "US", credit_limit_cents: 500000000 }
              as: SaleAdministrator
              captures: { bidder_id: $.data.id }
            - call: "POST /consignments"
              payload: { seller_id: "${seller_id}", seller_commission_bps: 1000 }
              as: SaleAdministrator
              captures: { cons_id: $.data.id, cons_v: $.data.version }
            - call: "POST /consignments/${cons_id}/activate"
              payload: { expected_consignment_version: "${cons_v}" }
              as: SaleAdministrator
            - call: "POST /auction-sales"
              payload: { title: "Parallel Sale", sale_date_utc: "2026-06-25T15:00:00Z", currency: "USD", buyers_premium_schedule_id: "${sched_id}" }
              as: SaleAdministrator
              captures: { sale_id: $.data.id }
            - call: "POST /auction-sales/${sale_id}/lots"
