- rule_id: non_linear_state_machine
  instances:
  - name: participant_three_parallel_dimensions_evolve_independently
    grounds:
    - state_machines.Participant_license_relief.PETITION_SUBMITTED_to_INFO_REQUESTED
    - state_machines.Participant_license_relief.INFO_REQUESTED_to_PETITION_SUBMITTED
    - state_machines.Participant_suspension.NONE_to_SUSPENDED
    - state_machines.Participant_stage.RELEASE_READY_to_POST_RELEASE
    - calculations.participant_engagement_posture
    - entities.Participant.fields.petition_rounds_used
    distinguishing_aspect: 'The non-linear machine here belongs to the Participant entity: three parallel dimensions
      (stage, suspension_status, license_relief_status) advance independently and the license_relief dimension is
      cyclic — PETITION_SUBMITTED -> INFO_REQUESTED -> PETITION_SUBMITTED re-enters a state it already left while
      stage stays POST_RELEASE.'
    test_recipe:
      setup:
      - Logical clock at 2026-08-01T08:00:00.000Z.
      - 'Participant p1 released: stage POST_RELEASE, doc_completeness_pct 80.0, barrier_score 66.3.'
      - Licensing petition filed for occupation_code 31-1131, the board asked for more information, and the petition
        was refiled — petition_rounds_used 1, license_relief_status back at PETITION_SUBMITTED.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T08:00:00.000Z'
        as: CaseManager
        as_user_id: cm-1
      - call: POST /participants
        payload:
          full_name: Andre Colwell
          facility_name: Northgate Correctional
          facility_state: OH
          expected_release_date: '2026-08-10'
          record_categories:
          - PROPERTY_OFFENSE
          required_document_types:
          - STATE_ID
          - SSN_CARD
          - BIRTH_CERTIFICATE
          - WORK_HISTORY
          - MEDICAID_APPLICATION
          assigned_case_manager_user_id: cm-1
        as: CaseManager
        as_user_id: cm-1
        captures:
          p1_id: $.data.id
      - call: POST /participants/${p1_id}/assessment
        payload:
          assessment_domain_scores:
            housing_score: 3
            transportation_score: 2
            health_score: 1
            work_history_score: 4
            documentation_score: 2
        as: CaseManager
        as_user_id: cm-1
      - call: POST /participants/${p1_id}/document-verifications
        payload:
          document_type: STATE_ID
        as: CaseManager
        as_user_id: cm-1
      - call: POST /participants/${p1_id}/document-verifications
        payload:
          document_type: SSN_CARD
        as: CaseManager
        as_user_id: cm-1
      - call: POST /participants/${p1_id}/document-verifications
        payload:
          document_type: BIRTH_CERTIFICATE
        as: CaseManager
        as_user_id: cm-1
      - call: POST /participants/${p1_id}/document-verifications
        payload:
          document_type: WORK_HISTORY
        as: CaseManager
        as_user_id: cm-1
      - call: GET /participants/${p1_id}
        as: CaseManager
        as_user_id: cm-1
        captures:
          p1_v_a: $.data.version
      - call: PUT /participants/${p1_id}/release-plan
        payload:
          expected_participant_version: ${p1_v_a}
          housing_plan_type: TRANSITIONAL_HOUSING
          transportation_plan_type: TRANSIT_PASS
          health_coverage_target: MEDICAID
          planned_release_date: '2026-08-10'
        as: CaseManager
        as_user_id: cm-1
      - call: POST /participants/${p1_id}/release-plan/approve
        payload: {}
        as: ProgramDirector
        as_user_id: pd-1
      - call: POST /participants/${p1_id}/release
        payload:
          actual_release_date: '2026-08-01'
        as: CaseManager
        as_user_id: cm-1
      - call: POST /participants/${p1_id}/license-relief
        payload:
          to_status: PETITION_SUBMITTED
          occupation_code: 31-1131
        as: CaseManager
        as_user_id: cm-1
      - call: POST /participants/${p1_id}/license-relief
        payload:
          to_status: INFO_REQUESTED
        as: CaseManager
        as_user_id: cm-1
      - call: POST /participants/${p1_id}/license-relief
        payload:
          to_status: PETITION_SUBMITTED
        as: CaseManager
        as_user_id: cm-1
      trigger:
      - call: POST /participants/${p1_id}/suspension
        payload:
          to_status: SUSPENDED
          suspension_reason: Missed two supervision appointments
        as: ProgramDirector
        as_user_id: pd-1
      assert:
      - Participant.${p1_id}.suspension_status == SUSPENDED
      - Participant.${p1_id}.suspension_reason == "Missed two supervision appointments"
      - Participant.${p1_id}.stage == POST_RELEASE (the suspension dimension does not move the stage dimension)
      - Participant.${p1_id}.license_relief_status == PETITION_SUBMITTED (re-entered after the INFO_REQUESTED detour)
      - Participant.${p1_id}.petition_rounds_used == 1
      - Participant.${p1_id}.license_relief_occupation_code == "31-1131"
