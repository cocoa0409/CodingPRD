  - rule_id: non_linear_state_machine
    instances:
      - name: customer_kyc_and_origination_dimensions_move_independently
        grounds:
          - state_machines.Customer.kyc_state.VERIFIED_to_UNDER_REVIEW
          - state_machines.Customer.origination_state.ENABLED_to_SUSPENDED
          - state_machines.Customer.origination_state.SUSPENDED_to_ENABLED
          - entities.Customer.fields.suspension_cause
        distinguishing_aspect: |
          Customer carries two parallel dimensions on one row: kyc_state walks
          VERIFIED -> UNDER_REVIEW -> REJECTED while origination_state stays
          SUSPENDED with suspension_cause PROVIDER_REQUEST untouched, and a
          ProviderAdmin RESTORE then moves origination back to ENABLED without
          changing kyc_state — no single combined status could represent both walks.
        test_recipe:
          setup:
            - "Provider with one kyc-VERIFIED, origination-ENABLED customer holding one ACTIVE assignment (+12025550111)"
            - "Provider.active_assigned_number_count == 1 before the trigger"
            - "Logical clock at the 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /rmd/providers"
              payload: { legal_name: "Northwind Voice LLC", provider_type: "FACILITIES_BASED" }
              as: Regulator
              captures: { prov_id: $.data.id }
            - call: "POST /rmd/customers"
              payload: { provider_id: "${prov_id}", legal_name: "Vantage Outreach Inc", contact_email: "ops@vantage.example", kyc_evidence_level: "BUSINESS_REGISTRY_VERIFIED" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { cust_id: $.data.id }
            - call: "POST /rmd/customers/${cust_id}/kyc-submit"
              payload: {}
              as: KycAnalyst
              as_user_id: "kyc-1"
            - call: "POST /rmd/customers/${cust_id}/kyc-decision"
              payload: { decision: "VERIFY" }
              as: KycAnalyst
              as_user_id: "kyc-2"
            - call: "POST /rmd/customers/${cust_id}/origination-actions"
              payload: { action: "ENABLE" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
            - call: "POST /rmd/number-assignments"
              payload: { provider_id: "${prov_id}", customer_id: "${cust_id}", telephone_number: "+12025550111", ownership_evidence: "DIRECT_ALLOCATION", effective_from: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { asg_id: $.data.id }
          trigger:
            - call: "POST /rmd/customers/${cust_id}/origination-actions"
              payload: { action: "SUSPEND", suspension_cause: "PROVIDER_REQUEST" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
            - call: "POST /rmd/customers/${cust_id}/kyc-submit"
              payload: {}
              as: KycAnalyst
              as_user_id: "kyc-1"
            - call: "POST /rmd/customers/${cust_id}/kyc-decision"
              payload: { decision: "REJECT" }
              as: KycAnalyst
              as_user_id: "kyc-2"
            - call: "POST /rmd/customers/${cust_id}/origination-actions"
              payload: { action: "RESTORE" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
          assert:
            - "Customer.${cust_id}.kyc_state == REJECTED"
            - "Customer.${cust_id}.origination_state == ENABLED"
            - "Customer.${cust_id}.suspension_cause == null"
            - "Customer.${cust_id}.suspension_source_id == null"
            - "NumberAssignment.${asg_id}.status == ACTIVE"
            - "Provider.${prov_id}.active_assigned_number_count == 1"
            - "Customer.${cust_id}.kyc_decided_by_user_id == kyc-2"

      - name: enforcement_fork_join_dismiss_and_sustain_branches_diverge
        grounds:
          - state_machines.EnforcementAction.PROPOSED_to_CONTESTED
          - state_machines.EnforcementAction.CONTESTED_to_DISMISSED
          - state_machines.EnforcementAction.CONTESTED_to_SUSTAINED
          - state_machines.EnforcementAction.SUSTAINED_to_PAID
          - calculations.provider_outstanding_forfeiture
        distinguishing_aspect: |
          EnforcementAction forks PROPOSED -> CONTESTED -> {SUSTAINED -> PAID |
          DISMISSED} with divergent side-effect sets on a different entity from the
          Customer parallel walk: the DISMISSED branch removes 3000000 cents from
          Provider.outstanding_forfeiture_cents while the SUSTAINED branch leaves the
          amount outstanding until payment clears it.
        test_recipe:
          setup:
            - "Provider with no effectiveness report, so score_band is NONE and no mitigation credit applies"
            - "Action A1: violation_count 3, PER_VIOLATION -> total_forfeiture_cents 3000000"
            - "Action A2: violation_days 10, CONTINUING_DAILY -> total_forfeiture_cents 2500000"
            - "Provider.outstanding_forfeiture_cents == 5500000 before the trigger"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /rmd/providers"
              payload: { legal_name: "Sentinel Telecom LLC", provider_type: "GATEWAY" }
              as: Regulator
              captures: { prov_id: $.data.id }
            - call: "POST /rmd/enforcement-actions"
              payload: { provider_id: "${prov_id}", basis: "UNFILED_PLAN", violation_count: 3, violation_days: 10, assessment_basis: "PER_VIOLATION" }
              as: Regulator
              captures: { a1_id: $.data.id }
            - call: "POST /rmd/enforcement-actions"
              payload: { provider_id: "${prov_id}", basis: "UNMITIGATED_NOTICE", violation_count: 3, violation_days: 10, assessment_basis: "CONTINUING_DAILY" }
              as: Regulator
              captures: { a2_id: $.data.id }
          trigger:
            - call: "POST /rmd/enforcement-actions/${a1_id}/contest"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /rmd/enforcement-actions/${a2_id}/contest"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /rmd/enforcement-actions/${a1_id}/adjudicate"
              payload: { outcome: "DISMISS" }
              as: Regulator
            - call: "POST /rmd/enforcement-actions/${a2_id}/adjudicate"
              payload: { outcome: "SUSTAIN" }
              as: Regulator
            - call: "POST /rmd/enforcement-actions/${a2_id}/pay"
              payload: { amount_cents: 2500000 }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
          assert:
            - "EnforcementAction.${a1_id}.score_band == NONE and EnforcementAction.${a1_id}.mitigation_credit_cents == 0"
            - "EnforcementAction.${a1_id}.total_forfeiture_cents == 3000000"
            - "EnforcementAction.${a2_id}.total_forfeiture_cents == 2500000"
            - "EnforcementAction.${a1_id}.status == DISMISSED"
            - "EnforcementAction.${a2_id}.status == PAID"
            - "EnforcementAction.${a2_id}.paid_amount_cents == 2500000"
            - "Provider.${prov_id}.outstanding_forfeiture_cents == 0"

  - rule_id: transitive_cascade
    instances:
      - name: notice_expiry_cascades_four_hops_to_provider_posture
        grounds:
          - state_machines.IllegalTrafficNotice.UNDER_INVESTIGATION_to_EXPIRED_UNMITIGATED
          - state_machines.NumberAssignment.ACTIVE_to_SUSPENDED_BY_CUSTOMER
          - calculations.provider_assignment_and_blocking_metrics
          - calculations.provider_posture_recompute
        distinguishing_aspect: |
          Depth 4, triggered by the deadline sweep: notice EXPIRED_UNMITIGATED (hop 1)
          -> attributed Customer origination SUSPENDED with cause NOTICE_EXPIRY (hop 2)
          -> both of that customer's ACTIVE NumberAssignments SUSPENDED_BY_CUSTOMER
          (hop 3) -> Provider.active_assigned_number_count 2 -> 0 and, from the
          separately accumulated penalty_points, Provider.auth_posture
          FULL_ATTESTATION -> GATEWAY_LIMITED (hop 4). Each hop is caused by the
          previous hop, and none of them is written by the sweep request body.
        test_recipe:
          setup:
            - "Provider with an ACTIVE certificate (not_after 2027-07-01) and an ACCEPTED plan, so rmd_filing_status COMPLETE and auth_posture FULL_ATTESTATION"
            - "One kyc-VERIFIED, origination-ENABLED customer holding two ACTIVE assignments (+12025550111, +12025550222) so active_assigned_number_count == 2"
            - "At clock 2026-08-10T00:00:00Z: one illegal-traffic notice, investigated and attributed to that customer, with mitigation_deadline_at 2026-08-12T00:00:00Z"
            - "At the same instant: one traceback request with response_deadline_at 2026-08-11T00:00:00Z and hard_cutoff_at 2026-08-13T00:00:00Z, left unanswered"
