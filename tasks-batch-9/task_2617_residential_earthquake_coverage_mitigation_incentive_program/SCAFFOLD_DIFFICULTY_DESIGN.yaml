# Scaffold Difficulty Design (1.8) - Residential Earthquake Coverage & Mitigation
# Incentive Program. 9 rule_ids, 23 instances. Every numeric literal in every
# assert was computed by executing the 1.3 formulas with their declared
# constants. The logical clock starts at 2026-08-01T00:00:00Z.
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: premium_quote_time_vs_renewal_time_on_self_declared_retrofit
        grounds:
          - calculations.hazard_base_premium
          - entities.Dwelling.fields.retrofit_status
          - entities.Policy.fields.rating_variant
          - state_machines.Policy.lifecycle_status.ACTIVE_to_ACTIVE
        distinguishing_aspect: |
          The two variants of hazard_base_premium disagree on ONE input only - an unverified
          SELF_DECLARED retrofit is worth factor 0.95 at QUOTE_TIME and factor 1.00 at
          RENEWAL_TIME - so byte-identical dwelling data yields 254904 at quote and 268320 at
          renewal, a divergence of exactly 13416 cents on the Policy entity.
        test_recipe:
          setup:
            - "One participating insurer, one policyholder, one pre-1980 cripple-wall dwelling in a TIER_2 county on SOFT soil with a 50,000,000 cent Coverage A limit"
            - "The policyholder self-attests a CRIPPLE_WALL_BRACING retrofit with no inspection behind it, so Dwelling.retrofit_status == SELF_DECLARED"
            - "The mandatory offer is accepted, the policy is quoted at the default clock and bound, and the clock is then advanced into the 45-day renewal window"
          setup_api_calls:
            - call: "POST /eqp/insurers"
              payload: { name: "Pacific Residential Mutual", naic_code: "11001", market_share_pct: 41.0 }
              as: ProgramAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /eqp/policyholders"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", county_code: "CA-ALA", outreach_campaign_code: "TAKEUP-2026" }
              as: ProgramAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /eqp/dwellings"
              payload: { policyholder_id: "${ph_id}", street_address: "12 Cripple Wall Way", county_hazard_tier: "TIER_2", soil_class: "SOFT", structure_type: "WOOD_FRAME_CRIPPLE_WALL", year_built: 1955, dwelling_limit_cents: 50000000 }
              as: ProgramAdmin
              captures: { dw_id: $.data.id }
            - call: "POST /eqp/dwellings/${dw_id}/declare-retrofit"
              payload: { declared_scope: "CRIPPLE_WALL_BRACING" }
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /eqp/mandatory-offers"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", dwelling_id: "${dw_id}", campaign_code: "TAKEUP-2026" }
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { off_id: $.data.id }
            - call: "POST /eqp/mandatory-offers/${off_id}/respond"
              payload: { response: "ACCEPT" }
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /eqp/policies"
              payload: { dwelling_id: "${dw_id}", insurer_id: "${ins_id}", accepted_offer_id: "${off_id}", deductible_pct: 15, contents_sublimit_cents: 2500000, loss_of_use_sublimit_cents: 1500000 }
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { pol_id: $.data.id, quote_base: $.data.base_premium_cents, quote_variant: $.data.rating_variant }
            - call: "POST /eqp/policies/${pol_id}/bind"
              payload: {}
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
            - call: "POST /eqp/_clock/set_current_utc"
              payload: { current_utc: "2027-07-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /eqp/policies/${pol_id}/renew"
              payload: {}
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { renew_base: $.data.base_premium_cents, renew_variant: $.data.rating_variant, renew_term: $.data.term_number }
          assert:
            - "${quote_base} == 254904"
            - "${quote_variant} == QUOTE_TIME"
            - "${renew_base} == 268320"
            - "${renew_variant} == RENEWAL_TIME"
            - "${renew_base} - ${quote_base} == 13416"
            - "${renew_term} == 2"
            - "Dwelling.${dw_id}.retrofit_status == SELF_DECLARED (the renewal re-rates but never rewrites the dwelling)"
            - "Policy.${pol_id}.annual_premium_cents == 268320 and Policy.${pol_id}.mitigation_discount_cents == 0"

      - name: claim_provisional_vs_final_settlement_divergence
        grounds:
          - calculations.claim_settlement
          - entities.Claim.fields.provisional_payable_cents
          - entities.Claim.fields.final_payable_cents
          - state_machines.Claim.adjustment_status.PROVISIONAL_ADJUSTED_to_FINAL_ADJUSTED
        distinguishing_aspect: |
          The two variants of claim_settlement disagree on the damage basis AND on what the
          deductible attaches to: PROVISIONAL pays 16200000 (structural only, deductible against
          Coverage A alone) while FINAL pays 18200000 (cosmetic admitted up to 10% of structural,
          deductible against the combined A+C basis) on the same four reported damage figures.
        test_recipe:
          setup:
            - "The bound fixture-A policy (limit 50,000,000, deductible 15%, contents sublimit 2,500,000, loss-of-use sublimit 1,500,000) with no retrofit"
            - "A 2026 reinsurance tower and a declared magnitude 6.4 event that struck inside the policy term"
            - "One claim at FNOL_RECEIVED reporting structural 20,000,000, cosmetic 3,000,000, contents 4,000,000 and loss of use 1,200,000"
          setup_api_calls:
            - call: "POST /eqp/insurers"
              payload: { name: "Pacific Residential Mutual", naic_code: "11001", market_share_pct: 41.0 }
              as: ProgramAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /eqp/policyholders"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", county_code: "CA-ALA" }
              as: ProgramAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /eqp/dwellings"
              payload: { policyholder_id: "${ph_id}", street_address: "12 Cripple Wall Way", county_hazard_tier: "TIER_2", soil_class: "SOFT", structure_type: "WOOD_FRAME_CRIPPLE_WALL", year_built: 1955, dwelling_limit_cents: 50000000 }
              as: ProgramAdmin
              captures: { dw_id: $.data.id }
            - call: "POST /eqp/mandatory-offers"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", dwelling_id: "${dw_id}" }
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { off_id: $.data.id }
            - call: "POST /eqp/mandatory-offers/${off_id}/respond"
              payload: { response: "ACCEPT" }
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /eqp/policies"
              payload: { dwelling_id: "${dw_id}", insurer_id: "${ins_id}", accepted_offer_id: "${off_id}", deductible_pct: 15, contents_sublimit_cents: 2500000, loss_of_use_sublimit_cents: 1500000 }
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { pol_id: $.data.id }
            - call: "POST /eqp/policies/${pol_id}/bind"
              payload: {}
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
            - call: "POST /eqp/reinsurance-layers"
              payload: { treaty_year: 2026, layer_index: 1, attachment_point_cents: 100000000, limit_cents: 50000000, ceded_pct: 0.90 }
              as: ProgramAdmin
              captures: { l1_id: $.data.id }
            - call: "POST /eqp/reinsurance-layers"
              payload: { treaty_year: 2026, layer_index: 2, attachment_point_cents: 150000000, limit_cents: 60000000, ceded_pct: 0.75 }
              as: ProgramAdmin
              captures: { l2_id: $.data.id }
            - call: "POST /eqp/_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /eqp/catastrophe-events"
              payload: { event_code: "EQ-2026-HAYWARD", magnitude: 6.4, epicenter_county_code: "CA-ALA", occurred_at: "2026-09-10T00:00:00Z", retention_cents: 100000000 }
              as: ProgramAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /eqp/catastrophe-events/${ev_id}/declare"
              payload: {}
              as: ProgramAdmin
              captures: { ev_v: $.data.version }
            - call: "POST /eqp/claims"
              payload: { policy_id: "${pol_id}", event_id: "${ev_id}", structural_damage_cents: 20000000, cosmetic_damage_cents: 3000000, contents_damage_cents: 4000000, loss_of_use_cents: 1200000, expected_event_version: "${ev_v}" }
              as: ClaimAdjuster
              captures: { cl_id: $.data.id }
          trigger:
            - call: "POST /eqp/claims/${cl_id}/adjust-provisional"
              payload: {}
              as: ClaimAdjuster
              as_user_id: "adj-1"
              captures: { prov_pay: $.data.provisional_payable_cents, prov_dwell: $.data.dwelling_part_cents, prov_cont: $.data.contents_part_cents, prov_lou: $.data.loss_of_use_part_cents, ded: $.data.deductible_applied_cents }
            - call: "POST /eqp/claims/${cl_id}/finalize-adjustment"
              payload: {}
              as: ClaimAdjuster
              as_user_id: "adj-2"
              captures: { fin_pay: $.data.final_payable_cents, fin_dwell: $.data.dwelling_part_cents, fin_cont: $.data.contents_part_cents, fin_lou: $.data.loss_of_use_part_cents }
          assert:
            - "${ded} == 7500000"
            - "${prov_pay} == 16200000 with ${prov_dwell} == 12500000, ${prov_cont} == 2500000, ${prov_lou} == 1200000"
            - "${fin_pay} == 18200000 with ${fin_dwell} == 15265306, ${fin_cont} == 1734694, ${fin_lou} == 1200000"
            - "${fin_pay} - ${prov_pay} == 2000000"
            - "Claim.${cl_id}.payable_cents == 18200000 and Claim.${cl_id}.adjustment_status == FINAL_ADJUSTED"
            - "Claim.${cl_id}.structural_damage_cents == 20000000 (neither adjustment rewrites the reported figures)"

  - rule_id: combinatorial_formula
    instances:
      - name: premium_eight_factor_product_clamps_at_both_ends
        grounds:
          - calculations.hazard_base_premium
          - entities.Dwelling.fields.county_hazard_tier
          - entities.Dwelling.fields.soil_class
          - entities.Policy.fields.deductible_pct
        distinguishing_aspect: |
          hazard_base_premium multiplies eight independently-sourced factors (tier rate, soil,
          structure, vintage, retrofit, deductible, high-limit load, exposure units) and then
          applies min(max(raw, 18000), 4000000) ONCE - a URM on liquefaction soil with a
          300,000,000 limit prices at raw 8333757.9 and must clamp to exactly 4000000, while a
          post-code slab with a 5,000,000 limit and a 25% deductible prices at raw 5049 and must
          clamp UP to exactly 18000.
        test_recipe:
          setup:
            - "One insurer and one policyholder who owns two very different dwellings"
            - "Dwelling HIGH: TIER_3 county, LIQUEFACTION soil, MASONRY_URM built 1930, limit 300,000,000, quoted at a 5% deductible"
            - "Dwelling LOW: TIER_1 county, ROCK soil, WOOD_FRAME_SLAB built 2005, limit 5,000,000, quoted at a 25% deductible"
            - "Both dwellings have retrofit_status NONE and both mandatory offers are accepted"
          setup_api_calls:
            - call: "POST /eqp/insurers"
              payload: { name: "Golden State Fire & Casualty", naic_code: "11002", market_share_pct: 24.5 }
              as: ProgramAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /eqp/policyholders"
              payload: { full_name: "Bo Tran", email: "bo@example.com", county_code: "CA-SCL" }
              as: ProgramAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /eqp/dwellings"
              payload: { policyholder_id: "${ph_id}", street_address: "1 Liquefaction Row", county_hazard_tier: "TIER_3", soil_class: "LIQUEFACTION", structure_type: "MASONRY_URM", year_built: 1930, dwelling_limit_cents: 300000000 }
              as: ProgramAdmin
              captures: { dw_hi: $.data.id }
            - call: "POST /eqp/dwellings"
              payload: { policyholder_id: "${ph_id}", street_address: "2 Bedrock Court", county_hazard_tier: "TIER_1", soil_class: "ROCK", structure_type: "WOOD_FRAME_SLAB", year_built: 2005, dwelling_limit_cents: 5000000 }
              as: ProgramAdmin
              captures: { dw_lo: $.data.id }
            - call: "POST /eqp/mandatory-offers"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", dwelling_id: "${dw_hi}" }
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { off_hi: $.data.id }
            - call: "POST /eqp/mandatory-offers/${off_hi}/respond"
              payload: { response: "ACCEPT" }
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /eqp/mandatory-offers"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", dwelling_id: "${dw_lo}" }
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { off_lo: $.data.id }
            - call: "POST /eqp/mandatory-offers/${off_lo}/respond"
              payload: { response: "ACCEPT" }
              as: Policyholder
              as_user_id: "${ph_id}"
          trigger:
            - call: "POST /eqp/policies"
              payload: { dwelling_id: "${dw_hi}", insurer_id: "${ins_id}", accepted_offer_id: "${off_hi}", deductible_pct: 5, contents_sublimit_cents: 5000000, loss_of_use_sublimit_cents: 2000000 }
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { pol_hi: $.data.id, base_hi: $.data.base_premium_cents }
            - call: "POST /eqp/policies"
              payload: { dwelling_id: "${dw_lo}", insurer_id: "${ins_id}", accepted_offer_id: "${off_lo}", deductible_pct: 25, contents_sublimit_cents: 500000, loss_of_use_sublimit_cents: 250000 }
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { pol_lo: $.data.id, base_lo: $.data.base_premium_cents }
          assert:
            - "${base_hi} == 4000000 (MAX_PREMIUM_CENTS clamp; the unclamped product is 8333757.9)"
            - "${base_lo} == 18000 (MIN_PREMIUM_CENTS clamp; the unclamped product is 5049)"
            - "Policy.${pol_hi}.annual_premium_cents == 4000000 and Policy.${pol_lo}.annual_premium_cents == 18000"
            - "Policy.${pol_hi}.rated_dwelling_limit_cents == 300000000 and Policy.${pol_lo}.rated_dwelling_limit_cents == 5000000"

      - name: claim_final_contents_share_rounded_first_dwelling_absorbs_residual
        grounds:
          - calculations.claim_settlement
          - entities.Claim.fields.contents_part_cents
          - entities.Claim.fields.dwelling_part_cents
          - entities.Policy.fields.contents_sublimit_cents
        distinguishing_aspect: |
          The FINAL variant's allocation order is pinned: the Coverage C share is rounded half-up
          FIRST (500000.5 -> 500001) and Coverage A takes the residual (500000), so the two parts
          sum to exactly after_deductible 1000001; rounding both shares independently would give
          500001 + 500001 == 1000002 and overpay one cent.
        test_recipe:
          setup:
            - "A bound policy on a dwelling with limit 20,000,004 and a 25% deductible, so deductible_applied_cents == 5,000,001 (odd)"
            - "contents_sublimit_cents 3,000,001 and loss_of_use_sublimit_cents 100,000"
            - "A declared 2026 event inside the policy term and a claim reporting structural 2,727,274, cosmetic 500,000, contents 4,000,000, loss of use 0"
            - "The 10% cosmetic allowance admits exactly 272,727, making the Coverage A basis 3,000,001 - identical to the Coverage C basis"
          setup_api_calls:
            - call: "POST /eqp/insurers"
              payload: { name: "Sierra Mutual", naic_code: "11003", market_share_pct: 12.0 }
              as: ProgramAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /eqp/policyholders"
              payload: { full_name: "Cleo Vance", email: "cleo@example.com", county_code: "CA-SON" }
              as: ProgramAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /eqp/dwellings"
              payload: { policyholder_id: "${ph_id}", street_address: "3 Split Cent Lane", county_hazard_tier: "TIER_1", soil_class: "ROCK", structure_type: "WOOD_FRAME_SLAB", year_built: 2005, dwelling_limit_cents: 20000004 }
              as: ProgramAdmin
              captures: { dw_id: $.data.id }
            - call: "POST /eqp/mandatory-offers"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", dwelling_id: "${dw_id}" }
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { off_id: $.data.id }
            - call: "POST /eqp/mandatory-offers/${off_id}/respond"
              payload: { response: "ACCEPT" }
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /eqp/policies"
              payload: { dwelling_id: "${dw_id}", insurer_id: "${ins_id}", accepted_offer_id: "${off_id}", deductible_pct: 25, contents_sublimit_cents: 3000001, loss_of_use_sublimit_cents: 100000 }
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { pol_id: $.data.id }
            - call: "POST /eqp/policies/${pol_id}/bind"
              payload: {}
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
            - call: "POST /eqp/reinsurance-layers"
              payload: { treaty_year: 2026, layer_index: 1, attachment_point_cents: 100000000, limit_cents: 50000000, ceded_pct: 0.90 }
              as: ProgramAdmin
              captures: { l1_id: $.data.id }
            - call: "POST /eqp/_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /eqp/catastrophe-events"
              payload: { event_code: "EQ-2026-ROGERS", magnitude: 5.9, epicenter_county_code: "CA-SON", occurred_at: "2026-09-10T00:00:00Z", retention_cents: 100000000 }
              as: ProgramAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /eqp/catastrophe-events/${ev_id}/declare"
              payload: {}
              as: ProgramAdmin
              captures: { ev_v: $.data.version }
            - call: "POST /eqp/claims"
              payload: { policy_id: "${pol_id}", event_id: "${ev_id}", structural_damage_cents: 2727274, cosmetic_damage_cents: 500000, contents_damage_cents: 4000000, loss_of_use_cents: 0, expected_event_version: "${ev_v}" }
              as: ClaimAdjuster
              captures: { cl_id: $.data.id }
            - call: "POST /eqp/claims/${cl_id}/adjust-provisional"
              payload: {}
              as: ClaimAdjuster
              as_user_id: "adj-1"
              captures: { prov_pay: $.data.provisional_payable_cents, prov_ded: $.data.deductible_applied_cents }
          trigger:
            - call: "POST /eqp/claims/${cl_id}/finalize-adjustment"
              payload: {}
              as: ClaimAdjuster
              as_user_id: "adj-2"
              captures: { fin_pay: $.data.final_payable_cents, fin_dwell: $.data.dwelling_part_cents, fin_cont: $.data.contents_part_cents, fin_lou: $.data.loss_of_use_part_cents }
          assert:
            - "${prov_ded} == 5000001"
            - "${prov_pay} == 3000001 (PROVISIONAL: the 5,000,001 deductible wipes out the 2,727,274 structural basis, Coverage C pays its 3,000,001 sublimit)"
            - "${fin_cont} == 500001"
            - "${fin_dwell} == 500000"
            - "${fin_dwell} + ${fin_cont} == 1000001 (exactly after_deductible; no cent is created)"
            - "${fin_lou} == 0"
            - "${fin_pay} == 1000001, which is LOWER than the provisional 3000001 because the deductible now attaches to the combined A+C basis"

  - rule_id: non_linear_state_machine
    instances:
      - name: policy_active_self_loop_swaps_discount_channel_without_leaving_active
        grounds:
          - state_machines.Policy.lifecycle_status.ACTIVE_to_ACTIVE_renew
          - state_machines.Policy.mitigation_status.DISCOUNT_APPLIED_to_RETROFIT_VERIFIED
          - calculations.hazard_base_premium.variants.RENEWAL_TIME
        distinguishing_aspect: |
          The renew transition is an ACTIVE -> ACTIVE self-loop: lifecycle_status does not move at
          all, yet the OTHER state dimension walks backwards (DISCOUNT_APPLIED -> RETROFIT_VERIFIED),
          the mid-term discount channel is zeroed, and the premium is re-derived through the
          retrofit_factor channel instead - 268320 becomes 201240 while mitigation_discount_cents
          drops from 53664 to 0, so the billed premium falls from 214656 to 201240 across a
          transition that changes no lifecycle state.
        test_recipe:
          setup:
            - "A bound policy on a 1955 cripple-wall dwelling in a TIER_2 / SOFT-soil county, limit 50,000,000, 15% deductible, quoted with retrofit_status NONE so base_premium_cents == 268320"
            - "A funded BRACE_AND_BOLT grant cycle with a 1,000,000 pool; a TIER_MID grant on a 400,000 estimate approved at 300,000"
            - "The grant reserved by a second reviewer, a project performed by a CRIPPLE_WALL_BRACING-certified contractor, and a PASS inspection recorded at clock 2026-10-01T00:00:00Z"
            - "The PASS cascade therefore leaves mitigation_status DISCOUNT_APPLIED with mitigation_discount_cents 53664, annual_premium_cents 214656 and prorated_credit_cents 44695"
            - "The clock is then advanced to 2027-07-01T00:00:00Z, inside the 45-day renewal window before expires_at 2027-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /eqp/insurers"
              payload: { name: "Coast Range Indemnity", naic_code: "11004", market_share_pct: 18.0 }
              as: ProgramAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /eqp/policyholders"
              payload: { full_name: "Dara Okafor", email: "dara@example.com", county_code: "CA-SCL" }
              as: ProgramAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /eqp/dwellings"
              payload: { policyholder_id: "${ph_id}", street_address: "10 Cripple Wall Way", county_hazard_tier: "TIER_2", soil_class: "SOFT", structure_type: "WOOD_FRAME_CRIPPLE_WALL", year_built: 1955, dwelling_limit_cents: 50000000 }
              as: ProgramAdmin
              captures: { dw_id: $.data.id }
            - call: "POST /eqp/mandatory-offers"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", dwelling_id: "${dw_id}" }
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { off_id: $.data.id }
            - call: "POST /eqp/mandatory-offers/${off_id}/respond"
              payload: { response: "ACCEPT" }
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /eqp/policies"
              payload: { dwelling_id: "${dw_id}", insurer_id: "${ins_id}", accepted_offer_id: "${off_id}", deductible_pct: 15, contents_sublimit_cents: 15000000, loss_of_use_sublimit_cents: 5000000 }
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { pol_id: $.data.id, q_base: $.data.base_premium_cents }
            - call: "POST /eqp/policies/${pol_id}/bind"
              payload: {}
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
            - call: "POST /eqp/grant-cycles"
              payload: { program_track: "BRACE_AND_BOLT", label: "2026 Fall", opens_at: "2026-07-01T00:00:00Z", closes_at: "2026-12-31T00:00:00Z", total_pool_cents: 1000000 }
              as: ProgramAdmin
              captures: { gc_id: $.data.id, gc_v: $.data.version }
            - call: "POST /eqp/retrofit-grants"
              payload: { dwelling_id: "${dw_id}", grant_cycle_id: "${gc_id}", income_tier: "TIER_MID", project_cost_estimate_cents: 400000, requested_scope: "CRIPPLE_WALL_BRACING", policy_id: "${pol_id}" }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { gr_id: $.data.id }
            - call: "POST /eqp/retrofit-grants/${gr_id}/begin-review"
