# =============================================================================
# Task 1933: Equine Rescue & Sanctuary Operations — §1.9 Corner Design
# (breadth index over §1.1–§1.7 claims not already covered by §1.8)
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: horse_creation_initial_state
        claim_type: creation
        grounds: [entities.Horse, state_machines.Horse, entities.QuarantineProtocol]
        distinguishing_aspect: "POST /horses returns 201 with status QUARANTINE, current_location QUARANTINE_STALL, version 1, computed ration 25.0 (1000 lbs, BCS 3) and auto-creates an ACTIVE 14-day quarantine protocol."
        test_recipe:
          setup: ["empty DB; logical clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /rescue-ops/horses", payload: { name: "H", sex: MARE, breed_class: LIGHT, estimated_weight_lbs: 1000, age_years: 6, body_condition_score: 3, training_level: GREEN }, as: IntakeCoordinator, captures: { h: $.data.id, st: $.data.status, loc: $.data.current_location, ration: $.data.daily_feed_ration_lbs, v: $.data.version } }
            - { call: "GET /rescue-ops/quarantine-protocols?horse_id=${h}", as: IntakeCoordinator, captures: { q_status: "$.data[0].status", q_min: "$.data[0].min_days", q_reason: "$.data[0].reason" } }
          assert:
            - "st == QUARANTINE AND loc == QUARANTINE_STALL AND v == 1"
            - "ration == 25.0 (1000*0.02*1.30 = 26.0 capped at 1000*0.025 = 25.0)"
            - "q_status == ACTIVE AND q_min == 14 AND q_reason == INTAKE (auto-created protocol)"

      - name: horse_defaults_applied
        claim_type: defaults
        grounds: [entities.Horse.fields.temperament_score, entities.Horse.fields.bonded_companion_id]
        distinguishing_aspect: "Omitting temperament_score yields default 5; bonded_companion_id defaults to null; adopt_with_bonded_companion defaults false on applications."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /rescue-ops/horses", payload: { name: "H", sex: GELDING, breed_class: DRAFT, estimated_weight_lbs: 1400, age_years: 9, body_condition_score: 5, training_level: UNHANDLED }, as: IntakeCoordinator, captures: { h: $.data.id, temp: $.data.temperament_score, bond: $.data.bonded_companion_id } }
          assert:
            - "temp == 5 (default applied)"
            - "bond is null"
            - "Horse.${h}.daily_feed_ration_lbs == 28.0 (1400*0.02, no factor)"

      - name: horse_ration_recompute_on_patch
        claim_type: computed_fields
        grounds: [calculations.daily_feed_ration, entities.Horse.fields.daily_feed_ration_lbs]
        distinguishing_aspect: "PATCH changing body_condition_score 3 -> 8 on a 1000-lb horse recomputes the ration 25.0 -> 16.0 and bumps version by exactly 1; a PATCH touching only temperament leaves the ration unchanged."
        test_recipe:
          setup: ["Horse H (1000 lbs, BCS 3, ration 25.0, version 1)"]
          setup_api_calls:
            - { call: "POST /rescue-ops/horses", payload: { name: "H", sex: MARE, breed_class: LIGHT, estimated_weight_lbs: 1000, age_years: 6, body_condition_score: 3, training_level: GREEN }, as: IntakeCoordinator, captures: { h: $.data.id } }
          trigger:
            - { call: "PATCH /rescue-ops/horses/${h}", payload: { temperament_score: 7 }, as: IntakeCoordinator, captures: { r1: $.data.daily_feed_ration_lbs, v1: $.data.version } }
            - { call: "PATCH /rescue-ops/horses/${h}", payload: { body_condition_score: 8 }, as: IntakeCoordinator, captures: { r2: $.data.daily_feed_ration_lbs, v2: $.data.version } }
          assert:
            - "r1 == 25.0 AND v1 == 2 (temperament-only patch: ration unchanged, version +1)"
            - "r2 == 16.0 AND v2 == 3 (BCS 8 -> 1000*0.02*0.80 = 16.0)"

      - name: horse_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns 404 ERR_NOT_FOUND in the error envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /rescue-ops/horses/00000000-0000-0000-0000-000000000000", as: SanctuaryDirector, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND with http status 404"

      - name: invalid_enum_values_rejected
        claim_type: type_constraints
        grounds: [entities.Horse.fields.sex, entities.IntakeEvaluation.fields.evaluation_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "An out-of-set enum on horse creation (sex=GELDINGX) and on evaluation scheduling (evaluation_type=DENTAL) both fail with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Horse H exists (for the evaluation call)"]
          setup_api_calls:
            - { call: "POST /rescue-ops/horses", payload: { name: "H", sex: MARE, breed_class: LIGHT, estimated_weight_lbs: 1000, age_years: 6, body_condition_score: 5, training_level: GREEN }, as: IntakeCoordinator, captures: { h: $.data.id } }
          trigger:
            - { call: "POST /rescue-ops/horses", payload: { name: "X", sex: GELDINGX, breed_class: LIGHT, estimated_weight_lbs: 1000, age_years: 6, body_condition_score: 5, training_level: GREEN }, as: IntakeCoordinator, captures: { err1: $.data.error_id } }
            - { call: "POST /rescue-ops/intake-evaluations", payload: { horse_id: "${h}", evaluation_type: DENTAL, scheduled_date: "2026-08-02T00:00:00Z" }, as: IntakeCoordinator, captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_INVALID_REQUEST AND err2 == ERR_INVALID_REQUEST (400)"

      - name: health_log_immutable_no_version
        claim_type: immutability
        grounds: [entities.DailyHealthLog]
        distinguishing_aspect: "DailyHealthLog is common_fields:false: responses carry id and created_at but no version/updated_at; two appends both persist (append-only)."
        test_recipe:
          setup: ["Horse H exists"]
          setup_api_calls:
            - { call: "POST /rescue-ops/horses", payload: { name: "H", sex: MARE, breed_class: LIGHT, estimated_weight_lbs: 1000, age_years: 6, body_condition_score: 5, training_level: GREEN }, as: IntakeCoordinator, captures: { h: $.data.id } }
          trigger:
            - { call: "POST /rescue-ops/daily-health-logs", payload: { horse_id: "${h}", temp_f: 101.0, appetite: NORMAL }, as: IntakeCoordinator, captures: { l1: $.data.id } }
            - { call: "POST /rescue-ops/daily-health-logs", payload: { horse_id: "${h}", temp_f: 101.2, appetite: REDUCED }, as: IntakeCoordinator, captures: { l2: $.data.id } }
            - { call: "GET /rescue-ops/daily-health-logs?horse_id=${h}", as: IntakeCoordinator }
          assert:
            - "DailyHealthLog.${l1} and .${l2} both returned; neither entity carries version or updated_at fields"
            - "no PATCH/PUT/DELETE endpoint exists for daily-health-logs in §1.5 (append-only by construction)"

      - name: bonded_companion_fk_reverse_lookup
        claim_type: parent_relationships
        grounds: [entities.Horse.fields.bonded_companion_id]
        distinguishing_aspect: "Self-referential FK: H2 created with bonded_companion_id=H1 is discoverable via GET /horses?bonded_companion_id=<H1>; a nonexistent companion id is rejected ERR_HORSE_NOT_FOUND."
        test_recipe:
          setup: ["Horse H1 exists"]
          setup_api_calls:
            - { call: "POST /rescue-ops/horses", payload: { name: "H1", sex: MARE, breed_class: LIGHT, estimated_weight_lbs: 1000, age_years: 6, body_condition_score: 5, training_level: GREEN }, as: IntakeCoordinator, captures: { h1: $.data.id } }
          trigger:
            - { call: "POST /rescue-ops/horses", payload: { name: "H2", sex: GELDING, breed_class: LIGHT, estimated_weight_lbs: 950, age_years: 7, body_condition_score: 4, training_level: GREEN, bonded_companion_id: "${h1}" }, as: IntakeCoordinator, captures: { h2: $.data.id } }
            - { call: "GET /rescue-ops/horses?bonded_companion_id=${h1}", as: IntakeCoordinator }
            - { call: "POST /rescue-ops/horses", payload: { name: "HX", sex: MARE, breed_class: LIGHT, estimated_weight_lbs: 900, age_years: 5, body_condition_score: 5, training_level: GREEN, bonded_companion_id: "00000000-0000-0000-0000-000000000000" }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "GET /horses?bonded_companion_id=${h1} returns exactly [${h2}]"
            - "err == ERR_HORSE_NOT_FOUND for the dangling companion reference"

      - name: adopter_registration_identity_establishing
        claim_type: creation
        grounds: ["validations[priority=2]", roles.Adopter]
        distinguishing_aspect: "POST /adopters succeeds without a resolvable X-User-ID (identity-establishing exemption); the minted id then works as X-User-ID for self-scoped calls."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /rescue-ops/adopters", payload: { full_name: "Ad N", contact_email: "an@x.com", experience_level: NOVICE, has_stall_facility: false }, as: Adopter, captures: { ad: $.data.id, st: $.data.status } }
            - { call: "GET /rescue-ops/adopters/${ad}", as: Adopter, as_user_id: "${ad}", captures: { got: $.data.id } }
          assert:
            - "registration returns 201 with st == ACTIVE despite no pre-existing identity"
            - "got == ${ad} (minted id is a valid identity thereafter)"

  - section: state_machines
    instances:
      - name: euthanasia_full_path_deceased_lockdown
        claim_type: valid_transition
        grounds: [state_machines.EuthanasiaCase, state_machines.Horse.END_OF_LIFE_REVIEW_to_DECEASED, state_machines.Sponsorship.ACTIVE_to_CANCELLED, state_machines.SanctuaryCarePlan.DRAFT_to_CLOSED]
        distinguishing_aspect: "PROPOSED -> CERTIFIED -> AUTHORIZED -> EXECUTED after the 72h cooling-off drives the DECEASED cascade (sponsorship CANCELLED/HORSE_DECEASED, care plan CLOSED, appointment CANCELLED, stall ENDED with end_date=now) and locks the horse terminally."
        test_recipe:
          setup:
            - "Horse H in SANCTUARY with: DRAFT care plan, ACTIVE sponsorship (3000) from SP, ACTIVE stall assignment (MAIN_BARN), REQUESTED VET_EXAM appointment"
            - "Case proposed by vet1 (suffering_score 5), certified by vet2 (CONCUR, no emergency), authorized at 2026-08-15T00:00:00Z; clock advanced to 2026-08-18T00:00:00Z"
          setup_api_calls:
            - { call: "POST /rescue-ops/practitioners", payload: { name: "Dr V1", specialty: VETERINARIAN }, as: SanctuaryDirector, captures: { vet1: $.data.id } }
            - { call: "POST /rescue-ops/practitioners", payload: { name: "Dr V2", specialty: VETERINARIAN }, as: SanctuaryDirector, captures: { vet2: $.data.id } }
            - { call: "POST /rescue-ops/horses", payload: { name: "H", sex: MARE, breed_class: LIGHT, estimated_weight_lbs: 1000, age_years: 18, body_condition_score: 4, training_level: GREEN }, as: IntakeCoordinator, captures: { h: $.data.id } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-14T12:00:00Z" }, as: SanctuaryDirector }
            - { call: "POST /rescue-ops/intake-evaluations", payload: { horse_id: "${h}", evaluation_type: MEDICAL, scheduled_date: "2026-08-14T12:00:00Z" }, as: IntakeCoordinator, captures: { ev: $.data.id } }
            - { call: "POST /rescue-ops/intake-evaluations/${ev}/complete", payload: { outcome: PASS }, as: IntakeCoordinator }
            - { call: "GET /rescue-ops/quarantine-protocols?horse_id=${h}", as: IntakeCoordinator, captures: { q: "$.data[0].id" } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: SanctuaryDirector }
            - { call: "POST /rescue-ops/quarantine-protocols/${q}/clear", payload: {}, as: Veterinarian, as_user_id: "${vet1}" }
            - { call: "POST /rescue-ops/horses/${h}/release-quarantine", payload: { target_status: REHABILITATION }, as: IntakeCoordinator }
            - { call: "POST /rescue-ops/horses/${h}/designate-sanctuary", payload: { reason: "old and lame" }, as: SanctuaryDirector }
            - { call: "GET /rescue-ops/horses/${h}", as: SanctuaryDirector, captures: { h_v: $.data.version } }
            - { call: "POST /rescue-ops/sanctuary-care-plans", payload: { horse_id: "${h}", expected_horse_version: "${h_v}", variant: STRAIGHT_LINE }, as: SanctuaryDirector, captures: { plan: $.data.id } }
            - { call: "POST /rescue-ops/sponsors", payload: { name: "SP", contact_email: "sp@x.com" }, as: Sponsor, captures: { sp: $.data.id } }
            - { call: "POST /rescue-ops/sponsorships", payload: { sponsor_id: "${sp}", horse_id: "${h}", monthly_pledge_cents: 3000 }, as: Sponsor, as_user_id: "${sp}", captures: { s1: $.data.id } }
            - { call: "POST /rescue-ops/sponsorships/${s1}/activate", payload: {}, as: Sponsor, as_user_id: "${sp}" }
            - { call: "POST /rescue-ops/stalls", payload: { stall_code: "M-09", barn_zone: MAIN_BARN }, as: SanctuaryDirector, captures: { st: $.data.id } }
            - { call: "POST /rescue-ops/stall-assignments", payload: { horse_id: "${h}", stall_id: "${st}", start_date: "2026-08-15T00:00:00Z" }, as: IntakeCoordinator, captures: { sa: $.data.id } }
            - { call: "POST /rescue-ops/care-service-appointments", payload: { horse_id: "${h}", practitioner_id: "${vet1}", service_type: VET_EXAM, scheduled_start: "2026-08-20T09:00:00Z", scheduled_end: "2026-08-20T09:45:00Z" }, as: IntakeCoordinator, captures: { appt: $.data.id } }
            - { call: "POST /rescue-ops/euthanasia-cases", payload: { horse_id: "${h}", clinical_summary: "chronic laminitis", suffering_score: 5 }, as: Veterinarian, as_user_id: "${vet1}", captures: { ec: $.data.id } }
            - { call: "POST /rescue-ops/euthanasia-cases/${ec}/certify", payload: { decision: CONCUR, emergency_attestation: false }, as: Veterinarian, as_user_id: "${vet2}" }
            - { call: "POST /rescue-ops/euthanasia-cases/${ec}/authorize", payload: {}, as: SanctuaryDirector }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-18T00:00:00Z" }, as: SanctuaryDirector }
          trigger:
            - { call: "POST /rescue-ops/euthanasia-cases/${ec}/execute", payload: {}, as: Veterinarian, as_user_id: "${vet1}", captures: { ec_st: $.data.status, ex_at: $.data.executed_at } }
            - { call: "GET /rescue-ops/horses/${h}", as: SanctuaryDirector, captures: { h_st: $.data.status, h_loc: $.data.current_location } }
            - { call: "GET /rescue-ops/sponsorships/${s1}", as: SanctuaryDirector, captures: { s_st: $.data.status, s_reason: $.data.cancellation_reason } }
            - { call: "GET /rescue-ops/sanctuary-care-plans/${plan}", as: SanctuaryDirector, captures: { plan_st: $.data.status } }
            - { call: "GET /rescue-ops/care-service-appointments/${appt}", as: IntakeCoordinator, captures: { appt_st: $.data.status, appt_reason: $.data.cancellation_reason } }
            - { call: "GET /rescue-ops/stall-assignments/${sa}", as: IntakeCoordinator, captures: { sa_st: $.data.status, sa_end: $.data.end_date } }
            - { call: "PATCH /rescue-ops/horses/${h}", payload: { body_condition_score: 5 }, as: IntakeCoordinator, captures: { lock_err: $.data.error_id } }
          assert:
            - "ec_st == EXECUTED AND ex_at == 2026-08-18T00:00:00Z (exactly authorized_at + 72h)"
            - "h_st == DECEASED AND h_loc == NOT_APPLICABLE"
            - "s_st == CANCELLED AND s_reason == HORSE_DECEASED; sponsor SP status becomes INACTIVE"
            - "plan_st == CLOSED (DRAFT plan closed by the cascade)"
            - "appt_st == CANCELLED AND appt_reason == HORSE_DECEASED"
            - "sa_st == ENDED AND sa_end == 2026-08-18T00:00:00Z"
            - "lock_err == ERR_INVALID_STATE (DECEASED is terminal; mutations rejected)"

      - name: finalized_terminal_resident_gating_and_feed_exclusion
        claim_type: terminal_state_lockdown
        grounds: [state_machines.AdoptionApplication, "validations[priority=9]", calculations.feed_supply_projection]
        distinguishing_aspect: "A FINALIZED application rejects reject/withdraw with ERR_INVALID_STATE; its ADOPTED horse rejects appointment booking with ERR_HORSE_NOT_RESIDENT and drops out of feed demand (grass 8.75 -> 0.00 lbs/day, days-of-supply becomes null)."
        test_recipe:
          setup:
            - "Horse H (1000 lbs, BCS 3, ration 25.0; sole resident: grass demand 8.75 lbs/day) ADOPTED via FINALIZED application APP (fee 100000 paid; finalized at 2026-08-18)"
          setup_api_calls:
            - { call: "POST /rescue-ops/practitioners", payload: { name: "Dr V", specialty: VETERINARIAN }, as: SanctuaryDirector, captures: { vet_id: $.data.id } }
            - { call: "POST /rescue-ops/horses", payload: { name: "H", sex: MARE, breed_class: LIGHT, estimated_weight_lbs: 1000, age_years: 8, body_condition_score: 3, training_level: TRAINED_RIDDEN }, as: IntakeCoordinator, captures: { h: $.data.id } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-14T12:00:00Z" }, as: SanctuaryDirector }
            - { call: "POST /rescue-ops/intake-evaluations", payload: { horse_id: "${h}", evaluation_type: MEDICAL, scheduled_date: "2026-08-14T12:00:00Z" }, as: IntakeCoordinator, captures: { ev: $.data.id } }
            - { call: "POST /rescue-ops/intake-evaluations/${ev}/complete", payload: { outcome: PASS }, as: IntakeCoordinator }
            - { call: "GET /rescue-ops/quarantine-protocols?horse_id=${h}", as: IntakeCoordinator, captures: { q: "$.data[0].id" } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: SanctuaryDirector }
            - { call: "POST /rescue-ops/quarantine-protocols/${q}/clear", payload: {}, as: Veterinarian, as_user_id: "${vet_id}" }
            - { call: "POST /rescue-ops/horses/${h}/release-quarantine", payload: { target_status: ADOPTABLE }, as: IntakeCoordinator }
            - { call: "POST /rescue-ops/adopters", payload: { full_name: "Ad T", contact_email: "at@x.com", experience_level: EXPERT, has_stall_facility: true }, as: Adopter, captures: { ad: $.data.id } }
            - { call: "POST /rescue-ops/adoption-applications", payload: { adopter_id: "${ad}", horse_id: "${h}", proposed_pickup_date: "2026-08-20T00:00:00Z" }, as: Adopter, as_user_id: "${ad}", captures: { app: $.data.id } }
            - { call: "POST /rescue-ops/adoption-applications/${app}/start-review", payload: {}, as: AdoptionOfficer, as_user_id: "officer-1" }
            - { call: "POST /rescue-ops/home-checks", payload: { application_id: "${app}", scheduled_date: "2026-08-15T10:00:00Z" }, as: AdoptionOfficer, as_user_id: "officer-1", captures: { hc: $.data.id } }
            - { call: "POST /rescue-ops/home-checks/${hc}/complete", payload: { outcome: PASSED }, as: AdoptionOfficer, as_user_id: "officer-1" }
            - { call: "POST /rescue-ops/adoption-applications/${app}/approve", payload: {}, as: AdoptionOfficer, as_user_id: "officer-2" }
            - { call: "POST /rescue-ops/adoption-applications/${app}/pay-fee", payload: { amount_cents: 100000 }, as: Adopter, as_user_id: "${ad}" }
            - { call: "GET /rescue-ops/feed-inventory/summary", as: BarnManager, captures: { sum_before: $.data.summaries } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-18T00:00:00Z" }, as: SanctuaryDirector }
            - { call: "POST /rescue-ops/adoption-applications/${app}/finalize", payload: {}, as: AdoptionOfficer, as_user_id: "officer-2" }
          trigger:
            - { call: "POST /rescue-ops/adoption-applications/${app}/reject", payload: { reason: "second thoughts" }, as: AdoptionOfficer, as_user_id: "officer-1", captures: { err_reject: $.data.error_id } }
            - { call: "POST /rescue-ops/adoption-applications/${app}/withdraw", payload: {}, as: Adopter, as_user_id: "${ad}", captures: { err_withdraw: $.data.error_id } }
            - { call: "POST /rescue-ops/care-service-appointments", payload: { horse_id: "${h}", practitioner_id: "${vet_id}", service_type: VET_EXAM, scheduled_start: "2026-08-19T09:00:00Z", scheduled_end: "2026-08-19T09:45:00Z" }, as: IntakeCoordinator, captures: { err_resident: $.data.error_id } }
            - { call: "GET /rescue-ops/feed-inventory/summary", as: BarnManager, captures: { sum_after: $.data.summaries } }
          assert:
            - "err_reject == ERR_INVALID_STATE AND err_withdraw == ERR_INVALID_STATE (FINALIZED is terminal)"
            - "err_resident == ERR_HORSE_NOT_RESIDENT (ADOPTED horse not bookable)"
            - "sum_before GRASS_HAY daily_demand_lbs == 8.75; sum_after GRASS_HAY daily_demand_lbs == 0.00 with days_of_supply_tight == null and reorder_required == false"

      - name: eval_double_complete_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.IntakeEvaluation, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Completing an already-COMPLETED evaluation is an invalid self-transition -> ERR_INVALID_STATE; no duplicate side effects (quarantine extension fires once)."
        test_recipe:
          setup: ["Horse H in QUARANTINE; MEDICAL evaluation EV completed once with FAIL (extension_days == 7)"]
          setup_api_calls:
            - { call: "POST /rescue-ops/horses", payload: { name: "H", sex: GELDING, breed_class: LIGHT, estimated_weight_lbs: 1000, age_years: 6, body_condition_score: 5, training_level: GREEN }, as: IntakeCoordinator, captures: { h: $.data.id } }
            - { call: "POST /rescue-ops/intake-evaluations", payload: { horse_id: "${h}", evaluation_type: MEDICAL, scheduled_date: "2026-08-02T00:00:00Z" }, as: IntakeCoordinator, captures: { ev: $.data.id } }
            - { call: "POST /rescue-ops/intake-evaluations/${ev}/complete", payload: { outcome: FAIL, findings: "strangles suspected" }, as: IntakeCoordinator }
          trigger:
            - { call: "POST /rescue-ops/intake-evaluations/${ev}/complete", payload: { outcome: PASS }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
            - { call: "GET /rescue-ops/quarantine-protocols?horse_id=${h}", as: IntakeCoordinator, captures: { ext: "$.data[0].extension_days" } }
          assert:
            - "err == ERR_INVALID_STATE"
            - "ext == 7 (the FAIL extension fired exactly once; the rejected second complete added nothing)"

      - name: quarantine_extensions_stack
        claim_type: side_effect_execution
        grounds: [state_machines.QuarantineProtocol.ACTIVE_to_ACTIVE, entities.DailyHealthLog.fields.temp_f]
        distinguishing_aspect: "Each fever log (temp_f >= 103.0) adds exactly 7 extension days and a MEDICAL FAIL adds 7 more (total 14); a 102.9F log is below the >= threshold and adds nothing."
        test_recipe:
          setup: ["Horse H in QUARANTINE (intake protocol, extension_days 0)"]
          setup_api_calls:
            - { call: "POST /rescue-ops/horses", payload: { name: "H", sex: MARE, breed_class: LIGHT, estimated_weight_lbs: 1000, age_years: 6, body_condition_score: 5, training_level: GREEN }, as: IntakeCoordinator, captures: { h: $.data.id } }
          trigger:
            - { call: "POST /rescue-ops/daily-health-logs", payload: { horse_id: "${h}", temp_f: 103.0, appetite: REDUCED }, as: IntakeCoordinator }
            - { call: "POST /rescue-ops/intake-evaluations", payload: { horse_id: "${h}", evaluation_type: MEDICAL, scheduled_date: "2026-08-02T00:00:00Z" }, as: IntakeCoordinator, captures: { ev: $.data.id } }
