            - call: "POST /solar-dist/allocations/${alloc}/release"
              payload: {}
              as: InstallerRep
              as_user_id: "${inst_id}"
            - call: "GET /solar-dist/inventory-lots/${lot_mod}"
              payload: {}
              as: DistributionAdmin
              captures: { avail_after: $.data.qty_available }
          assert:
            - "qty_available before allocation == 10"
            - "After allocate(4): qty_available == 6"
            - "After release: qty_available == 10 (invariant restored)"
            - "InventoryLot.${lot_mod}.qty_available == 10"
            - "qty_available_after == qty_available_before"

      - name: payment_post_then_reverse_preserves_invoice_balance
        grounds:
          - state_machines.Payment.POSTED_to_REVERSED
          - entities.Invoice.fields.balance_due_cents
        distinguishing_aspect: |
          Conserved quantity = Invoice.balance_due_cents (different conserved
          quantity from lot qty_available). Forward: payment post reduces
          balance_due_cents. Compensation: payment reverse increases it back.
          The pair MUST leave balance_due_cents unchanged.
        test_recipe:
          setup:
            - "Invoice with balance_due=275000"
            - "Post a payment of 100000 → balance = 175000"
            - "Reverse the payment → balance back to 275000"
          setup_api_calls:
            - call: "POST /solar-dist/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DistributionAdmin
            - call: "POST /solar-dist/tariff-rates"
              payload: { hts_code: "8541.43", duty_rate_bp: 1000, effective_from: "2026-07-01T00:00:00Z" }
              as: DistributionAdmin
            - call: "POST /solar-dist/products"
              payload: { sku: "M", product_kind: "MODULE", manufacturer_name: "S", wattage_w: 400, ac_output_w: 0, dc_input_max_w: 0, technology_generation: 3, hts_code: "8541.43", list_price_cents: 22000 }
              as: DistributionAdmin
              captures: { mod_id: $.data.id }
            - call: "POST /solar-dist/products"
              payload: { sku: "I", product_kind: "INVERTER", manufacturer_name: "I", wattage_w: 0, ac_output_w: 5000, dc_input_max_w: 8000, technology_generation: 3, hts_code: "8504.40", list_price_cents: 250000 }
              as: DistributionAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /solar-dist/tariff-rates"
              payload: { hts_code: "8504.40", duty_rate_bp: 500, effective_from: "2026-07-01T00:00:00Z" }
              as: DistributionAdmin
            - call: "POST /solar-dist/compatibility-rules"
              payload: { module_product_id: "${mod_id}", inverter_product_id: "${inv_id}", max_modules_per_inverter: 20, min_modules_per_inverter: 5, effective_from: "2026-07-01T00:00:00Z" }
              as: DistributionAdmin
            - call: "POST /solar-dist/installers"
              payload: { legal_name: "P", license_number: "L", credit_limit_cents: 100000000, progress_payment_pct_bp: 10000, payment_terms_days: 30 }
              as: ChannelManager
              captures: { inst_id: $.data.id }
            - call: "POST /solar-dist/installers/${inst_id}/activate"
              payload: {}
              as: ChannelManager
            - call: "POST /solar-dist/installers/${inst_id}/projects"
              payload: { project_name: "P1", site_postal_code: "94110", module_product_id: "${mod_id}", inverter_product_id: "${inv_id}", module_qty: 5, inverter_qty: 1 }
              as: InstallerRep
              as_user_id: "${inst_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /solar-dist/projects/${proj_id}/lock-design"
              payload: {}
              as: InstallerRep
              as_user_id: "${inst_id}"
            - call: "POST /solar-dist/containers"
              payload: { container_number: "C", bol_number: "B", origin_port: "P", eta_utc: "2026-08-05T00:00:00Z", freight_cost_cents: 0, insurance_cost_cents: 0 }
              as: DistributionAdmin
              captures: { cont_id: $.data.id }
            - call: "POST /solar-dist/containers/${cont_id}/lines"
              payload: { product_id: "${mod_id}", qty_booked: 5, declared_unit_value_cents: 50000 }
              as: DistributionAdmin
              captures: { line_mod: $.data.id, lot_mod: $.data.inventory_lot_id }
            - call: "POST /solar-dist/containers/${cont_id}/depart"
              payload: {}
              as: DistributionAdmin
            - call: "POST /solar-dist/containers/${cont_id}/arrive"
              payload: {}
              as: DistributionAdmin
              captures: { cv: $.data.version }
            - call: "POST /solar-dist/containers/${cont_id}/receive"
              payload:
                expected_container_version: "${cv}"
                line_receipts: [{ container_line_id: "${line_mod}", qty_received: 5, qty_damaged: 0 }]
              as: DistributionAdmin
            - call: "GET /solar-dist/inventory-lots/${lot_mod}"
              payload: {}
              as: DistributionAdmin
              captures: { lot_v: $.data.version }
            - call: "POST /solar-dist/projects/${proj_id}/allocations"
              payload: { inventory_lot_id: "${lot_mod}", qty_allocated: 5, expected_lot_version: "${lot_v}" }
              as: InstallerRep
              as_user_id: "${inst_id}"
              captures: { alloc: $.data.id }
            - call: "POST /solar-dist/allocations/${alloc}/ship"
              payload: {}
              as: DistributionAdmin
            - call: "GET /solar-dist/projects/${proj_id}/invoices"
              payload: {}
              as: ChannelManager
              captures: { prog_inv: $.data.0.id, bal_before: $.data.0.balance_due_cents }
          trigger:
            - call: "POST /solar-dist/invoices/${prog_inv}/payments"
              payload: { amount_cents: 100000 }
              as: CreditOfficer
              captures: { pmt: $.data.id }
            - call: "POST /solar-dist/payments/${pmt}/reverse"
              payload: {}
              as: CreditOfficer
            - call: "GET /solar-dist/invoices/${prog_inv}"
              payload: {}
              as: CreditOfficer
              captures: { bal_after: $.data.balance_due_cents, inv_status: $.data.status }
          assert:
            - "balance_due_cents before payment == 275000"
            - "After payment of 100000: balance == 175000, status == PARTIALLY_PAID"
            - "After reverse: balance == 275000, status back to OPEN"
            - "Invoice.${prog_inv}.balance_due_cents == 275000"
            - "Invoice.${prog_inv}.status == OPEN"
            - "balance_after == balance_before"
