    instances:
      - name: safety_factor_exactly_one_five_passes
        grounds:
          - calculations.engineering_safety_factor
          - state_machines.EngineeringReview.PENDING_to_APPROVED
        distinguishing_aspect: |
          Metric: safety factor (>= semantics). sf_static exactly 1.50
          (6000 / 4000) sits ON the SF_STATIC_MIN boundary and the approve
          must PASS — a strict-greater reading would wrongly reject it.
        test_recipe:
          setup:
            - "Production SCHEDULED; one PENDING STRUCTURAL review with design_load_lb 4000, member_capacity_lb 6000 (sf exactly 1.50)"
          setup_api_calls:
            - call: "POST /scenic/shops"
              payload: { name: "Metro Scenic", weekly_crew_hours_capacity: 100, horizon_weeks: 4, bay_count: 2, truck_fleet_size: 6, labor_rate_cents_per_hour: 8000, overtime_multiplier_bp: 15000, overhead_pct_bp: 1000, margin_pct_bp: 2000 }
