      - name: completing_an_already_completed_session_returns_session_state_invalid
        claim_type: idempotency
        grounds:
          - validations[priority=13]
          - errors[ERR_SESSION_STATE_INVALID]
          - state_machines.SnowmakingSession.RUNNING_to_COMPLETED
          - calculations.season_snow_accounting
        distinguishing_aspect: |
          Session completion is the single most side-effect-heavy call in the system: it meters water,
          prices energy, and moves three season ledgers plus two counters on the pump house. Replaying
          it must be rejected at priority 13 rather than idempotently re-applied, because re-applying
          would double-count water_used_af and snow_produced_swe_af against a water right that is a
          legal limit. The full metered figures are asserted first so the replay assertion has a
          baseline to compare against.
