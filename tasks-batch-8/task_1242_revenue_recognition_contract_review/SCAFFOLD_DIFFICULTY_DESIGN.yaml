            - call: "POST /revrec/ssp-prices"
              payload: { product_code: "WIDGET", region: "US", ssp_cents: 500000, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: RevenueManager
              as_user_id: "mgr-1"
