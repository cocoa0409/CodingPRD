      - name: program_catalog_axis_reverse_edge_and_cross_axis_guard
        grounds:
          - state_machines.AcademicProgram.LISTED_to_MARKETING_SUPPRESSED
          - state_machines.AcademicProgram.MARKETING_SUPPRESSED_to_LISTED
          - state_machines.AcademicProgram.MARKETING_SUPPRESSED_to_ADMISSIONS_CLOSED
          - state_machines.AcademicProgram.ADMISSIONS_CLOSED_to_CATALOG_WITHDRAWN
          - validations[priority=13]
        distinguishing_aspect: |
          AcademicProgram carries two independent state axes on one row: the
          catalog axis walks LISTED -> MARKETING_SUPPRESSED -> LISTED (a reverse
          edge no linear machine has) and then on to ADMISSIONS_CLOSED, all while
          the lifecycle axis moves ACTIVE -> UNDER_REVIEW on a completely
          different trigger; the catalog axis is then blocked at its own terminal
          state by a cross-axis guard because the lifecycle axis is not terminal.
        test_recipe:
          setup:
            - "Program HIST-BA freshly registered: lifecycle_state ACTIVE, catalog_status LISTED."
            - "The registrar suppresses marketing, reverses that suppression, a review cycle is opened (lifecycle moves to UNDER_REVIEW while the catalog axis is untouched at LISTED), marketing is suppressed again and admissions are then closed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Registrar
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST" }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/catalog-status"
              payload: { target_catalog_status: "MARKETING_SUPPRESSED", suppression_note: "Pre-emptive pause on paid recruitment" }
              as: Registrar
            - call: "POST /provost/academic-programs/${prog_id}/catalog-status"
              payload: { target_catalog_status: "LISTED", suppression_note: "Suppression lifted, recruitment resumed" }
              as: Registrar
            - call: "POST /provost/academic-programs/${prog_id}/review-cycles"
              payload: { cycle_year: 2026, self_study_due_at: "2026-09-01T00:00:00Z", required_section_codes: ["S1"] }
              as: ReviewCoordinator
              captures: { cycle_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/catalog-status"
              payload: { target_catalog_status: "MARKETING_SUPPRESSED", suppression_note: "Suppressed for the duration of the review" }
              as: Registrar
            - call: "POST /provost/academic-programs/${prog_id}/catalog-status"
              payload: { target_catalog_status: "ADMISSIONS_CLOSED", suppression_note: "No further admissions during the review" }
              as: Registrar
          trigger:
            - call: "POST /provost/academic-programs/${prog_id}/catalog-status"
              payload: { target_catalog_status: "CATALOG_WITHDRAWN", suppression_note: "Attempting an early catalog withdrawal" }
              as: Registrar
          assert:
            - "immediately after the review-cycle call: AcademicProgram.${prog_id}.lifecycle_state == UNDER_REVIEW and catalog_status == LISTED — the two axes moved independently"
            - "the trigger returns 409 with error_id ERR_CATALOG_TRANSITION_INVALID"
            - "AcademicProgram.${prog_id}.catalog_status == ADMISSIONS_CLOSED"
            - "AcademicProgram.${prog_id}.lifecycle_state == UNDER_REVIEW"
            - "AcademicProgram.${prog_id}.catalog_status_pre_decision == null (no decision cascade has captured a pre-decision value)"

  - rule_id: transitive_cascade
    instances:
      - name: ratify_four_hop_cascade_cycle_program_catalog_notifications
        grounds:
          - state_machines.DecisionRecord.PROPOSED_to_RATIFIED
          - state_machines.ReviewCycle.DECISION_PROPOSED_to_DECIDED
          - calculations.agency_notice_deadline
          - entities.AcademicProgram.fields.catalog_status_pre_decision
          - entities.ReviewCycle.fields.compliance_posture
        distinguishing_aspect: |
          One RATIFY call fires a four-hop chain in which every hop exists only
          because the previous hop happened: hop 1 closes the parent ReviewCycle
          into DECIDED, hop 2 fires because the cycle became DECIDED and moves
          AcademicProgram.lifecycle_state onto the DISCONTINUATION branch, hop 3
          fires because the program left UNDER_REVIEW and both snapshots and
          suppresses the catalog axis while minting two AgencyNotification rows
          with computed statutory deadlines, and hop 4 fires because those rows
          now exist and flips the cycle's compliance_posture. Nothing but the one
          RATIFY request is issued.
        test_recipe:
          setup:
            - "Program HIST-BA carried all the way to a PROPOSED DISCONTINUATION decision: three-term Fixture A snapshot history (composite 29.06, band NONVIABLE), self-study accepted, reviewer visit completed and reported, program response concurring."
            - "The logical clock is parked at 2026-09-15T10:00:00Z before the proposal, so the ratified_at instant and both computed notice deadlines are fully determined."
            - "The proposal is filed by user provost-proposer; the ratification is issued by the different user provost-ratifier, satisfying segregation of duties."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST", host_capacity_per_day: 2 }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
