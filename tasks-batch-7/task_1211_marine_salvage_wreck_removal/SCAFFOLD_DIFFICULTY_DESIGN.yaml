  - rule_id: cross_entity_state_dependency
    instances:
      - name: wreck_removal_requires_both_agency_permits
        grounds:
          - state_machines.OperationPhase.PLANNED_to_ACTIVE
          - calculations.phase_permit_requirement
          - "errors[ERR_PERMIT_MISSING]"
        distinguishing_aspect: |
          Entity pair OperationPhase -> Permit: WRECK_REMOVAL requires
          COAST_GUARD and ENV_AGENCY; with only COAST_GUARD GRANTED the
          activation fails with ERR_PERMIT_MISSING, and succeeds after the
          ENV_AGENCY grant — the phase's valid transition depends on a
          different entity's state. Distinct pair from Award -> Property.
        test_recipe:
          setup:
            - "NCNP contract ACTIVE; COAST_GUARD permit GRANTED; ENV_AGENCY permit absent; WRECK_REMOVAL phase PLANNED (96h); CRANE_BARGE charter ON_HIRE; weather window feasible"
          setup_api_calls:
            - { call: "POST /casualties", payload: { vessel_name: "MV Kara", casualty_type: SUNK, declared_salved_value_cents: 800000000, position: "32N 64W" }, as: SalvageMaster, as_user_id: "sm-01", captures: { cas_id: $.data.id, cas_v: $.data.version } }
