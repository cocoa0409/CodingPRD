            - { call: "GET /api/city-programs/${cp}/partners", as: ProgramAdmin, captures: { listed: "$.data[0].id", used: "$.data[0].nominations_used" } }
          assert:
            - "The very next GET lists the partner (captured ${listed} == ${np}) with nominations_used == 0 (captured ${used}) — no reconciliation lag"

  - section: state_machines
    instances:
      - name: waitlist_cycle_covered_by_difficulty
        claim_type: valid_transition
        grounds: [state_machines.Nominee.WAITLISTED_to_SELECTED]
        excluded_because:
          difficulty_instance: nominee_waitlist_selection_cycle
          rationale: "ROUND_3 -> WAITLISTED -> SELECTED round trip asserted there."
      - name: lock_unlock_revert_covered_by_difficulty
        claim_type: valid_transition
        grounds: [state_machines.Cohort.LOCKED_to_FORMING]
        excluded_because:
