          a DRAFT pool (scorecard not even submitted) the pool-state rule at
          priority 64 fires with ERR_POOL_STATE_INVALID and beats the
          plan-phase rule at 62 that the same call also violates (the plan is
          still DRAFT, not ALLOCATION_OPEN) — 64 is the lower priority number.
