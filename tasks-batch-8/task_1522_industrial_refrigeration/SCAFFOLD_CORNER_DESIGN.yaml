# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Industrial Refrigeration (Ammonia) Service & PSM
# Sections and claim_type values follow references/claim-extraction-guide.md.
# Every chain is replayable from empty DB against SCAFFOLD.yaml §1.5.
# =============================================================================

scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: facility_created_with_defaults
        claim_type: creation_and_defaults
        grounds: [entities.Facility]
        distinguishing_aspect: "POST with only the required name applies documented defaults: threshold_lbs 10000.0, ledger zeroed, postures at their initial enums, version 1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /psm/facilities"
              payload: { name: "ColdCo Plant" }
              as: FacilityAdmin
              captures: { fac: $.data.id }
          trigger:
            - call: "GET /psm/facilities/${fac}"
              as: FacilityAdmin
              captures: { thr: $.data.threshold_lbs, tot: $.data.total_charge_lbs, cpost: $.data.charge_posture, psm: $.data.psm_program_status, post: $.data.compliance_posture, score: $.data.posture_score, ver: $.data.version }
          assert:
            - "threshold_lbs == 10000.0 (default applied)"
            - "total_charge_lbs == 0.0, charge_posture == 'BELOW_THRESHOLD', psm_program_status == 'NOT_REQUIRED'"
            - "compliance_posture == 'COMPLIANT', posture_score == 0, version == 1"

      - name: facility_missing_name_rejected
        claim_type: required_fields
        grounds:
          - "entities.Facility.fields.name"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "Omitting the required input field name yields ERR_VALIDATION (400); no facility is persisted."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /psm/facilities"
              payload: { threshold_lbs: 5000 }
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == 'ERR_VALIDATION' with http 400"

      - name: equipment_invalid_enum_rejected
        claim_type: type_constraints
        grounds:
          - "entities.Equipment.fields.equipment_type"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "equipment_type 'BOILER' is outside {VESSEL, COMPRESSOR, PIPING_CIRCUIT, PRV} and is rejected."
        test_recipe:
          setup: ["Facility + system exist"]
          setup_api_calls:
            - call: "POST /psm/facilities"
              payload: { name: "ColdCo Plant" }
              as: FacilityAdmin
              captures: { fac: $.data.id }
            - call: "POST /psm/refrigeration-systems"
              payload: { facility_id: "${fac}", name: "ER1", design_charge_lbs: 3000 }
              as: FacilityAdmin
              captures: { sys: $.data.id }
          trigger:
            - call: "POST /psm/equipment"
              payload: { system_id: "${sys}", tag_number: "B-901", equipment_type: "BOILER", inspection_interval_days: 180, inspection_method: "FIXED" }
              as: MaintenanceLead
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == 'ERR_VALIDATION' with http 400"

      - name: get_nonexistent_facility_not_found
        claim_type: not_found
        grounds:
          - "entities.Facility"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns ERR_NOT_FOUND (404), never a 500 or empty object."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /psm/facilities/11111111-2222-3333-4444-555555555555"
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == 'ERR_NOT_FOUND' with http 404"

      - name: system_list_pagination_envelope
        claim_type: listing
        grounds: [entities.RefrigerationSystem, response_envelope]
        distinguishing_aspect: "List endpoint honors the fixed envelope: default limit 10, total_count 11, has_more true; offset 10 returns the 11th row with has_more false."
        test_recipe:
          setup: ["Facility with 11 refrigeration systems S01..S11"]
          setup_api_calls:
            - call: "POST /psm/facilities"
              payload: { name: "ColdCo Plant" }
              as: FacilityAdmin
              captures: { fac: $.data.id }
            - call: "POST /psm/refrigeration-systems"
              payload: { facility_id: "${fac}", name: "S01", design_charge_lbs: 100 }
              as: FacilityAdmin
            - call: "POST /psm/refrigeration-systems"
              payload: { facility_id: "${fac}", name: "S02", design_charge_lbs: 100 }
              as: FacilityAdmin
            - call: "POST /psm/refrigeration-systems"
              payload: { facility_id: "${fac}", name: "S03", design_charge_lbs: 100 }
              as: FacilityAdmin
            - call: "POST /psm/refrigeration-systems"
              payload: { facility_id: "${fac}", name: "S04", design_charge_lbs: 100 }
              as: FacilityAdmin
            - call: "POST /psm/refrigeration-systems"
              payload: { facility_id: "${fac}", name: "S05", design_charge_lbs: 100 }
              as: FacilityAdmin
            - call: "POST /psm/refrigeration-systems"
              payload: { facility_id: "${fac}", name: "S06", design_charge_lbs: 100 }
              as: FacilityAdmin
            - call: "POST /psm/refrigeration-systems"
              payload: { facility_id: "${fac}", name: "S07", design_charge_lbs: 100 }
              as: FacilityAdmin
            - call: "POST /psm/refrigeration-systems"
              payload: { facility_id: "${fac}", name: "S08", design_charge_lbs: 100 }
              as: FacilityAdmin
            - call: "POST /psm/refrigeration-systems"
              payload: { facility_id: "${fac}", name: "S09", design_charge_lbs: 100 }
              as: FacilityAdmin
            - call: "POST /psm/refrigeration-systems"
              payload: { facility_id: "${fac}", name: "S10", design_charge_lbs: 100 }
              as: FacilityAdmin
            - call: "POST /psm/refrigeration-systems"
              payload: { facility_id: "${fac}", name: "S11", design_charge_lbs: 100 }
              as: FacilityAdmin
          trigger:
            - call: "GET /psm/refrigeration-systems"
              payload: { facility_id: "${fac}" }
              as: FacilityAdmin
            - call: "GET /psm/refrigeration-systems"
              payload: { facility_id: "${fac}", offset: 10 }
              as: FacilityAdmin
          assert:
            - "Page 1: response_type == 'array', data length == 10 (default limit), total_count == 11, has_more == true"
            - "Page 2 (offset=10): data length == 1, total_count == 11, has_more == false"

      - name: charge_adjustment_immutable_ledger_entry
        claim_type: immutability
        grounds: [entities.ChargeAdjustment]
        distinguishing_aspect: "ChargeAdjustment has common_fields: false — the create response exposes id and created_at but no version or updated_at, and no update/delete endpoint exists for it."
        test_recipe:
          setup: ["Facility + operator employee"]
          setup_api_calls:
            - call: "POST /psm/facilities"
              payload: { name: "ColdCo Plant" }
              as: FacilityAdmin
              captures: { fac: $.data.id, fac_v: $.data.version }
            - call: "POST /psm/employees"
              payload: { facility_id: "${fac}", full_name: "Olivia Operator" }
              as: FacilityAdmin
              captures: { emp: $.data.id }
          trigger:
            - call: "POST /psm/charge-adjustments"
              payload: { facility_id: "${fac}", adjustment_type: "ADD", quantity_lbs: 250.0, reason: "initial charge", expected_facility_version: "${fac_v}" }
              as: Operator
              as_user_id: "${emp}"
              captures: { adj: $.data.id, rb: $.data.rounded_lbs, pb: $.data.posted_by_employee_id }
          assert:
            - "Response data contains id, created_at, facility_id, adjustment_type, quantity_lbs, rounded_lbs == 250.0, reason, posted_by_employee_id == ${emp}"
            - "Response data has NO 'version' and NO 'updated_at' key (append-only event entity)"
            - "§1.5 declares no PUT/PATCH/DELETE endpoint for /psm/charge-adjustments"

      - name: ungauged_in_service_system_contributes_design_charge
        claim_type: computed_fields
        grounds: [calculations.facility_charge_rollup, entities.RefrigerationSystem.fields.design_charge_lbs]
        distinguishing_aspect: "Gauge-variant fallback: an IN_SERVICE system with no gauge reading contributes design_charge_lbs (3500) while a gauged system contributes its reading (4100) — gauge total 7600.0."
        test_recipe:
          setup: ["Facility; ER1 (design 4000) gauged at 4100.0; ER2 (design 3500) never gauged; empty ledger"]
          setup_api_calls:
            - call: "POST /psm/facilities"
              payload: { name: "ColdCo Plant" }
              as: FacilityAdmin
              captures: { fac: $.data.id }
            - call: "POST /psm/employees"
              payload: { facility_id: "${fac}", full_name: "Olivia Operator" }
              as: FacilityAdmin
              captures: { emp: $.data.id }
            - call: "POST /psm/refrigeration-systems"
              payload: { facility_id: "${fac}", name: "ER1", design_charge_lbs: 4000 }
              as: FacilityAdmin
              captures: { sys1: $.data.id }
            - call: "POST /psm/refrigeration-systems"
              payload: { facility_id: "${fac}", name: "ER2", design_charge_lbs: 3500 }
              as: FacilityAdmin
              captures: { sys2: $.data.id }
            - call: "POST /psm/refrigeration-systems/${sys1}/gauge-readings"
              payload: { reading_lbs: 4100.0 }
              as: Operator
              as_user_id: "${emp}"
          trigger:
            - call: "GET /psm/facilities/${fac}/charge-summary"
              as: FacilityAdmin
              captures: { gauge: $.data.gauge_charge_lbs, book: $.data.book_charge_lbs }
          assert:
            - "gauge_charge_lbs == 7600.0 (4100.0 reading + 3500 design fallback for the ungauged system)"
            - "book_charge_lbs == 0.0 (empty ledger — variants independent)"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: reaffirm_current_document_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.PsidDocument.UNDER_REVIEW_to_CURRENT"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "reaffirm is only declared from UNDER_REVIEW; invoking it on a CURRENT document returns ERR_INVALID_STATE and stamps nothing."
        test_recipe:
          setup: ["Facility + system + CURRENT PsidDocument Rev A"]
          setup_api_calls:
            - call: "POST /psm/facilities"
              payload: { name: "ColdCo Plant" }
              as: FacilityAdmin
              captures: { fac: $.data.id }
            - call: "POST /psm/refrigeration-systems"
              payload: { facility_id: "${fac}", name: "ER1", design_charge_lbs: 3000 }
              as: FacilityAdmin
              captures: { sys: $.data.id, sys_v: $.data.version }
            - call: "POST /psm/psid-documents"
              payload: { system_id: "${sys}", doc_type: "PID", revision_label: "Rev A", content_uri: "s3://docs/pid-rev-a.pdf", expected_system_version: "${sys_v}" }
              as: PsCoordinator
              captures: { doc1: $.data.id }
          trigger:
            - call: "POST /psm/psid-documents/${doc1}/reaffirm"
              as: PsCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == 'ERR_INVALID_STATE' with http 409"
            - "Document remains status == 'CURRENT' with last_reaffirmed_at == null"

      - name: void_closed_permit_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.HotWorkPermit"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "CLOSED is terminal for void: REQUESTED->ISSUED->IN_PROGRESS->CLOSED, then void returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Facility + system + QUALIFIED contractor; permit driven to CLOSED (clock moved inside window for start)"]
          setup_api_calls:
            - call: "POST /psm/facilities"
              payload: { name: "ColdCo Plant" }
              as: FacilityAdmin
              captures: { fac: $.data.id }
            - call: "POST /psm/refrigeration-systems"
              payload: { facility_id: "${fac}", name: "ER1", design_charge_lbs: 3000 }
              as: FacilityAdmin
              captures: { sys: $.data.id }
            - call: "POST /psm/contractors"
              payload: { company_name: "WeldPros Inc", safety_score: 80 }
              as: MaintenanceLead
              captures: { ctr: $.data.id }
            - call: "POST /psm/contractors/${ctr}/qualify"
              payload: { qualified_until: "2027-06-01T00:00:00Z" }
              as: MaintenanceLead
            - call: "POST /psm/hot-work-permits"
              payload: { facility_id: "${fac}", system_id: "${sys}", contractor_id: "${ctr}", work_description: "weld repair", valid_from: "2026-09-01T08:00:00Z", valid_until: "2026-09-01T12:00:00Z" }
              as: ContractorRep
              as_user_id: "${ctr}"
              captures: { perm: $.data.id }
            - call: "POST /psm/hot-work-permits/${perm}/issue"
              as: MaintenanceLead
            - call: "POST /psm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /psm/hot-work-permits/${perm}/start"
              as: ContractorRep
              as_user_id: "${ctr}"
            - call: "POST /psm/hot-work-permits/${perm}/close"
              as: ContractorRep
              as_user_id: "${ctr}"
              captures: { st_closed: $.data.status }
          trigger:
            - call: "POST /psm/hot-work-permits/${perm}/void"
              as: MaintenanceLead
              captures: { err: $.data.error_id }
          assert:
            - "Permit reached status == 'CLOSED'"
            - "Void from CLOSED: error_id == 'ERR_INVALID_STATE' with http 409; permit stays CLOSED"

      - name: system_decommission_with_charge_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.RefrigerationSystem.OUT_OF_SERVICE_to_DECOMMISSIONED"
          - "errors[ERR_SYSTEM_NOT_EMPTY]"
        distinguishing_aspect: "Decommission requires zero net book charge attributed to the system; 100 lbs present yields ERR_SYSTEM_NOT_EMPTY."
        test_recipe:
          setup: ["Facility + system with 100.0 lbs net charge; system OUT_OF_SERVICE"]
          setup_api_calls:
            - call: "POST /psm/facilities"
              payload: { name: "ColdCo Plant" }
              as: FacilityAdmin
              captures: { fac: $.data.id, fac_v: $.data.version }
            - call: "POST /psm/employees"
              payload: { facility_id: "${fac}", full_name: "Olivia Operator" }
              as: FacilityAdmin
              captures: { emp: $.data.id }
            - call: "POST /psm/refrigeration-systems"
              payload: { facility_id: "${fac}", name: "ER1", design_charge_lbs: 3000 }
              as: FacilityAdmin
              captures: { sys: $.data.id }
            - call: "POST /psm/charge-adjustments"
              payload: { facility_id: "${fac}", system_id: "${sys}", adjustment_type: "ADD", quantity_lbs: 100.0, reason: "charge ER1", expected_facility_version: "${fac_v}" }
              as: Operator
              as_user_id: "${emp}"
            - call: "POST /psm/refrigeration-systems/${sys}/status"
              payload: { to_status: "OUT_OF_SERVICE" }
              as: FacilityAdmin
          trigger:
            - call: "POST /psm/refrigeration-systems/${sys}/status"
              payload: { to_status: "DECOMMISSIONED" }
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == 'ERR_SYSTEM_NOT_EMPTY' with http 409"
            - "System remains status == 'OUT_OF_SERVICE'"

      - name: inspection_overdue_then_late_completion
        claim_type: side_effect_execution
        grounds: [state_machines.Inspection.SCHEDULED_to_OVERDUE, state_machines.Inspection.OVERDUE_to_COMPLETED, entities.Inspection.fields.completed_late]
        distinguishing_aspect: "Checkpoint flips SCHEDULED -> OVERDUE (due_at < now) and raises the facility overdue count; completing from OVERDUE records completed_late == true and returns the facility to COMPLIANT."
        test_recipe:
          setup: ["Facility + system + equipment (FIXED 180d); inspection due 2026-08-05T00:00:00Z; clock at 2026-08-10T00:00:00Z"]
          setup_api_calls:
            - call: "POST /psm/facilities"
              payload: { name: "ColdCo Plant" }
              as: FacilityAdmin
              captures: { fac: $.data.id }
            - call: "POST /psm/refrigeration-systems"
              payload: { facility_id: "${fac}", name: "ER1", design_charge_lbs: 3000 }
              as: FacilityAdmin
              captures: { sys: $.data.id }
            - call: "POST /psm/equipment"
              payload: { system_id: "${sys}", tag_number: "V-101", equipment_type: "VESSEL", inspection_interval_days: 180, inspection_method: "FIXED" }
              as: MaintenanceLead
              captures: { eq: $.data.id }
            - call: "POST /psm/inspections"
              payload: { equipment_id: "${eq}", due_at: "2026-08-05T00:00:00Z" }
              as: MaintenanceLead
              captures: { insp: $.data.id }
            - call: "POST /psm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: FacilityAdmin
            - call: "POST /psm/checkpoints/run"
              as: ComplianceOfficer
              captures: { n_overdue: $.data.inspections_marked_overdue }
          trigger:
            - call: "GET /psm/facilities/${fac}"
              as: ComplianceOfficer
              captures: { oic1: $.data.overdue_inspection_count, score1: $.data.posture_score }
            - call: "POST /psm/inspections/${insp}/complete"
              payload: { result: "PASS", findings: "no anomalies" }
              as: MaintenanceLead
              captures: { st: $.data.status, late: $.data.completed_late }
            - call: "GET /psm/facilities/${fac}"
              as: ComplianceOfficer
              captures: { oic2: $.data.overdue_inspection_count, cpost2: $.data.compliance_posture }
          assert:
            - "Checkpoint marked inspections_marked_overdue == 1"
            - "After checkpoint: Facility.overdue_inspection_count == 1, posture_score == 5 (DEGRADED)"
            - "Completion from OVERDUE: status == 'COMPLETED', completed_late == true"
            - "After completion: overdue_inspection_count == 0, compliance_posture == 'COMPLIANT'"

      - name: equipment_fail_cascade_suspends_permits_then_resume
        claim_type: conditional_cascade
        grounds: [state_machines.Inspection.SCHEDULED_to_COMPLETED, state_machines.HotWorkPermit.ISSUED_to_SUSPENDED, state_machines.HotWorkPermit.SUSPENDED_to_IN_PROGRESS]
        distinguishing_aspect: "Conditional cross-entity cascade: FAIL only suspends permits in {ISSUED, IN_PROGRESS} on the failed equipment's system; a later PASS restores integrity and the SUSPENDED permit can start again."
        test_recipe:
          setup: ["Facility + system + QUALIFIED contractor + FIXED equipment; permit ISSUED (window 2026-09-01 08:00-12:00); inspection due 2026-08-05; clock 2026-08-10"]
          setup_api_calls:
            - call: "POST /psm/facilities"
              payload: { name: "ColdCo Plant" }
              as: FacilityAdmin
              captures: { fac: $.data.id }
            - call: "POST /psm/refrigeration-systems"
              payload: { facility_id: "${fac}", name: "ER1", design_charge_lbs: 3000 }
              as: FacilityAdmin
              captures: { sys: $.data.id }
            - call: "POST /psm/contractors"
              payload: { company_name: "WeldPros Inc", safety_score: 80 }
              as: MaintenanceLead
              captures: { ctr: $.data.id }
            - call: "POST /psm/contractors/${ctr}/qualify"
              payload: { qualified_until: "2027-06-01T00:00:00Z" }
              as: MaintenanceLead
            - call: "POST /psm/equipment"
              payload: { system_id: "${sys}", tag_number: "C-201", equipment_type: "COMPRESSOR", inspection_interval_days: 180, inspection_method: "FIXED" }
              as: MaintenanceLead
              captures: { eq: $.data.id }
            - call: "POST /psm/hot-work-permits"
              payload: { facility_id: "${fac}", system_id: "${sys}", contractor_id: "${ctr}", work_description: "weld repair", valid_from: "2026-09-01T08:00:00Z", valid_until: "2026-09-01T12:00:00Z" }
              as: ContractorRep
              as_user_id: "${ctr}"
              captures: { perm: $.data.id }
            - call: "POST /psm/hot-work-permits/${perm}/issue"
              as: MaintenanceLead
            - call: "POST /psm/inspections"
              payload: { equipment_id: "${eq}", due_at: "2026-08-05T00:00:00Z" }
              as: MaintenanceLead
              captures: { insp1: $.data.id }
            - call: "POST /psm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: FacilityAdmin
          trigger:
            - call: "POST /psm/inspections/${insp1}/complete"
              payload: { result: "FAIL", findings: "corrosion under insulation" }
              as: MaintenanceLead
            - call: "GET /psm/hot-work-permits/${perm}"
              as: MaintenanceLead
              captures: { perm_st1: $.data.status }
            - call: "GET /psm/equipment/${eq}"
              as: MaintenanceLead
              captures: { eq_int1: $.data.integrity_status }
            - call: "POST /psm/inspections"
              payload: { equipment_id: "${eq}", due_at: "2026-08-10T00:00:00Z" }
              as: MaintenanceLead
              captures: { insp2: $.data.id }
            - call: "POST /psm/inspections/${insp2}/complete"
              payload: { result: "PASS", findings: "remediated" }
              as: MaintenanceLead
            - call: "GET /psm/equipment/${eq}"
              as: MaintenanceLead
              captures: { eq_int2: $.data.integrity_status }
            - call: "POST /psm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /psm/hot-work-permits/${perm}/start"
              as: ContractorRep
              as_user_id: "${ctr}"
              captures: { perm_st2: $.data.status }
          assert:
            - "After FAIL: HotWorkPermit.status == 'SUSPENDED' (cascade) and Equipment.integrity_status == 'FAILED'"
            - "After PASS re-inspection: Equipment.integrity_status == 'CURRENT'"
            - "Start from SUSPENDED inside the window succeeds: permit status == 'IN_PROGRESS'"

      - name: contractor_expires_via_checkpoint
        claim_type: valid_transition
        grounds:
          - "state_machines.Contractor.QUALIFIED_to_EXPIRED"
          - "endpoints[POST /psm/checkpoints/run]"
        distinguishing_aspect: "System auto-transition: QUALIFIED with qualified_until < now flips to EXPIRED only at checkpoint, not at read time."
        test_recipe:
          setup: ["Contractor QUALIFIED until 2026-08-15T00:00:00Z; clock advanced to 2026-08-16T00:00:00Z"]
          setup_api_calls:
            - call: "POST /psm/contractors"
              payload: { company_name: "WeldPros Inc", safety_score: 80 }
              as: MaintenanceLead
              captures: { ctr: $.data.id }
            - call: "POST /psm/contractors/${ctr}/qualify"
              payload: { qualified_until: "2026-08-15T00:00:00Z" }
              as: MaintenanceLead
            - call: "POST /psm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /psm/checkpoints/run"
              as: ComplianceOfficer
              captures: { n_exp: $.data.contractors_expired }
            - call: "GET /psm/contractors/${ctr}"
              as: MaintenanceLead
              captures: { st: $.data.qualification_status }
          assert:
            - "Checkpoint contractors_expired == 1"
            - "Contractor.qualification_status == 'EXPIRED'"

      - name: permit_expires_via_checkpoint
        claim_type: valid_transition
        grounds:
          - "state_machines.HotWorkPermit.ISSUED_to_EXPIRED"
          - "endpoints[POST /psm/checkpoints/run]"
        distinguishing_aspect: "ISSUED permit whose valid_until <= now flips to EXPIRED at checkpoint; EXPIRED is terminal (start afterwards fails)."
        test_recipe:
          setup: ["Facility + system + QUALIFIED contractor; permit ISSUED with window 2026-08-10T08:00:00Z..2026-08-10T12:00:00Z; clock advanced to 2026-08-20T00:00:00Z"]
          setup_api_calls:
            - call: "POST /psm/facilities"
              payload: { name: "ColdCo Plant" }
              as: FacilityAdmin
              captures: { fac: $.data.id }
            - call: "POST /psm/refrigeration-systems"
