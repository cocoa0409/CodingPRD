# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource does not exist (validated left-to-right)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed payload, missing required field, or scalar out of range (amount < 0, escalation_after_hours < 24, min_approvers < 1)" }
  - { id: ERR_CROSS_TENANT_REFERENCE, http: 422, condition: "Body references a resource owned by a different tenant" }
  - { id: ERR_TENANT_NOT_ACTIVE, http: 409, condition: "Mutation attempted on a SUSPENDED or RETIRED tenant" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a state permitting the requested transition (generic state-machine rejection)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "Actor is the initiator (or same-person counterpart) forbidden from approving, returning, cancelling, or accepting handoff" }
  - { id: ERR_PRODUCTION_TENANT_RETIREMENT_FORBIDDEN, http: 422, condition: "Retire attempted on a PRODUCTION tenant, or refresh job targets a non-SANDBOX tenant / sources from a non-PRODUCTION tenant" }
  - { id: ERR_NOT_STEP_APPROVER, http: 403, condition: "Acting worker lacks ACTIVE membership in the pending step's approver group" }
  - { id: ERR_STEP_NOT_PENDING, http: 409, condition: "step_order in the path is not the instance's current pending step" }
  - { id: ERR_STEP_NOT_RETURNABLE, http: 422, condition: "Return attempted on a non-APPROVAL step or a step without return_target_step_order" }
  - { id: ERR_STALE_DEFINITION, http: 409, condition: "LATEST pin policy and the governing definition version changed in ways that removed the pending step" }
  - { id: ERR_HIERARCHY_VIOLATION, http: 422, condition: "Org-unit cycle, manager cycle, non-contiguous step_order, or return_target_step_order >= step_order" }
  - { id: ERR_ROLE_DERIVED_MEMBERSHIP_IMMUTABLE, http: 422, condition: "DELETE attempted on a ROLE_DERIVED membership, or ROLE_BASED group created without org_unit_id" }
  - { id: ERR_GROUP_IN_USE, http: 409, condition: "Disable attempted on a group referenced by an ACTIVE step of an ACTIVE definition" }
  - { id: ERR_GROUP_INELIGIBLE, http: 422, condition: "Definition activation references a group that is DISABLED or below min_approvers" }
  - { id: ERR_NO_APPROVAL_STEP, http: 422, condition: "Definition activation attempted with zero ACTIVE APPROVAL steps" }
  - { id: ERR_DUPLICATE_ACTIVE_DEFINITION, http: 409, condition: "An ACTIVE definition already exists for (tenant, transaction_type), or a name-uniqueness rule is violated" }
  - { id: ERR_OPT_IN_WINDOW_CLOSED, http: 422, condition: "Enrollment, record-testing, adopt, or defer attempted while train is not OPT_IN_OPEN" }
  - { id: ERR_TEST_EVIDENCE_MISSING, http: 422, condition: "record-testing without resolvable sandbox test evidence" }
  - { id: ERR_SCHEDULE_CONFLICT, http: 422, condition: "Refresh scheduled outside the maintenance hour or colliding with a weekly-update application on source or target" }
  - { id: ERR_INVALID_DATE_RANGE, http: 422, condition: "child effective_date < parent effective_date, or train window dates out of order" }
  - { id: ERR_REFRESH_IN_FLIGHT, http: 409, condition: "Tenant suspend attempted while a refresh job involves the tenant in PLANNED or RUNNING" }
  - { id: ERR_OPEN_TRANSACTIONS_EXIST, http: 409, condition: "Retire attempted while IN_PROGRESS transaction instances exist on the tenant or definition" }
  - { id: ERR_HAS_ACTIVE_CHILDREN, http: 409, condition: "Org unit deactivation attempted with ACTIVE descendant units" }
  - { id: ERR_UNIT_NOT_EMPTY, http: 409, condition: "Org unit deactivation attempted with headcount > 0" }
  - { id: ERR_HAS_ACTIVE_REPORTS, http: 409, condition: "Worker termination attempted while ACTIVE direct reports exist" }
  - { id: ERR_INVALID_TRIGGER_CONFIG, http: 422, condition: "Connector activation without required schedule_cron or subscribed_event for its trigger_mode" }
  - { id: ERR_INVALID_BLACKOUT_WINDOW, http: 422, condition: "Connector activation with blackout_window_start_utc == blackout_window_end_utc" }
  - { id: ERR_RUNS_IN_FLIGHT, http: 409, condition: "Connector retire attempted with QUEUED or RUNNING runs" }
  - { id: ERR_RETRY_LIMIT_EXCEEDED, http: 409, condition: "Retry attempted when attempt_count == 3" }
  - { id: ERR_NO_SUCCESSOR_TRAIN, http: 422, condition: "Train retire attempted without a later FEATURE_RELEASE train in MANDATORY_LIVE" }
  - { id: ERR_NOT_IMPLEMENTATION_TENANT, http: 422, condition: "Handoff advance attempted on a non-IMPLEMENTATION tenant" }
  - { id: ERR_NO_ACTIVE_BP_DEFINITION, http: 422, condition: "Handoff advance to HANDOFF_READY attempted with no ACTIVE business process definition on the tenant" }
  - { id: ERR_BLACKOUT_CONFLICT, http: 422, condition: "Weekly update application or refresh scheduled_at whose maintenance window overlaps the tenant's maintenance-hour blackout already claimed by another scheduled platform activity in the same week (covers the two interval semantics: [slot, slot+1h) vs [slot, slot+2h))" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: PlatformOperator
    description: "Platform-side operator managing tenants and release trains; not tied to any customer worker"
    identity: opaque
    exclusive_operations:
      - "POST /tenants (create tenant)"
      - "POST /tenants/{id}/suspend, /resume, /retire"
      - "POST /release-trains, POST /release-trains/{id}/retire"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET endpoints across all resources"
      - "PUT /tenants/{id}"
      - "POST /tenants/{tid}/integration-connectors/{cid}/runs (simulated trigger)"

  - name: TenantAdministrator
    description: "Customer-side administrator; identity is a Worker on the tenant being administered (for segregation-of-duties checks)"
    identity: entity_backed:Worker
    exclusive_operations:
      - "POST /tenants/{id}/acknowledge-weekly-update"
      - "org unit deactivate, worker terminate"
      - "security group disable, membership create/delete"
      - "business process definition activate/retire"
      - "transaction instance cancel"
      - "feature adoption enroll/record-testing/adopt/defer"
      - "refresh job create/complete/fail/cancel"
    shared_operations:
      - "PUT /tenants/{id}"
      - "POST /tenants/{id}/handoff/advance (HANDOFF_READY → ACCEPTED leg)"
      - "org unit / worker / group / definition / transaction creation and all GETs"

  - name: ImplementationPartner
    description: "Implementation partner consultant building an IMPLEMENTATION tenant before handoff; identity is a Worker on the IMPLEMENTATION tenant"
    identity: entity_backed:Worker
    exclusive_operations:
      - "POST /tenants/{id}/handoff/advance (IN_BUILD → HANDOFF_READY leg)"
    shared_operations:
      - "org unit / worker / group / definition creation and GETs on tenants in IN_BUILD"
      - "transaction instance creation and GETs"

  - name: Approver
    description: "Worker empowered to act on transaction steps via security group membership; identity is a Worker"
    identity: entity_backed:Worker
    exclusive_operations:
      - "POST .../steps/{step_order}/approve"
      - "POST .../steps/{step_order}/return"
    shared_operations:
      - "GET org units, workers, groups, definitions, instances, events, notifications"

  - name: IntegrationDeveloper
    description: "Integration builder owning connectors and runs; platform-side or customer-side integration specialist, not tied to a worker record"
    identity: opaque
    exclusive_operations:
      - "integration connector create/activate/suspend/resume/retire"
      - "integration run create (manual), complete, fail, retry, dead-letter"
    shared_operations:
      - "GET connectors and runs"
