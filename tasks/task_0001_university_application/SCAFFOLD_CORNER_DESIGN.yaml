      - name: validation_priority_21_school_deadline_order
        claim_type: Violation → Error
        grounds:
          - validations[priority=21]
          - errors[ERR_SCHOOL_DEADLINE_ORDER]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / school_deadline_zero_width_touch_rejected_half_open
          rationale: "The school-deadline ordering rule is the §1.8 temporal-overlap instance."

      - name: validation_priority_19_yield_cooldown_active
        claim_type: Violation → Error
        grounds:
          - validations[priority=19]
          - errors[ERR_YIELD_COOLDOWN_ACTIVE]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / yield_cooldown_closed_lower_bound_buffer
          rationale: "Yield cooldown is the §1.8 closed-lower-bound interval instance."

      - name: validation_priority_20_recommender_capacity_inclusive
        claim_type: Violation → Error
        grounds:
          - validations[priority=20]
          - errors[ERR_RECOMMENDER_OVER_CAPACITY]
        excluded_because:
          difficulty_instance: boundary_precision_check / recommender_inprogress_capacity_boundary_inclusive
          rationale: "The capacity boundary is the §1.8 boundary-precision instance."

