              as: FieldMarshal
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_BOOKING_INVALID_STATE"

      - name: temporal_slot_beats_fiscal_damage_distinct_pair
        grounds:
          - validations[priority=10]
          - validations[priority=14]
          - errors[ERR_FIELD_SLOT_CONFLICT]
          - errors[ERR_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Different error-category pair {business_temporal (priority 10) vs business_constraint
          (priority 14)}: a new booking whose window overlaps an existing live booking on the same
          field AND whose party_size exceeds capacity returns the higher-priority temporal error
          ERR_FIELD_SLOT_CONFLICT, not the capacity error ERR_CAPACITY_EXCEEDED.
        test_recipe:
          setup:
            - "Arena OPEN clock 2026-06-15T09:00:00Z; field capacity_max 5 turnaround 0; an existing CONFIRMED booking occupying 10:00-12:00"
          setup_api_calls:
            - call: "POST /arenas"
