  - rule_id: boundary_precision_check
    instances:
      - name: swap_allowance_rejects_at_exact_monthly_cap
        grounds:
          - "1.4 validation priority 51 ERR_SWAP_ALLOWANCE_EXHAUSTED"
          - "1.3 calculation swap_allowance_window"
          - "1.1 Member.swaps_used_current_month and MembershipPlan.monthly_swaps_allowed"
          - "1.5 POST /reservations/{reservation_id}/swap with expected_member_version"
          - "1.1 Reservation.is_swap and superseded_reservation_id"
        distinguishing_aspect: >-
          The metric is swaps_used_current_month against monthly_swaps_allowed 2, and the check is a strict less-than,
          so the second swap must succeed at count 1 and the third must fail at count exactly 2. The boundary is
          walked from below: after swap one the counter reads 1, after swap two it reads exactly the cap, and the
          third identical call is refused. An off-by-one that compares with less-than-or-equal accepts a third swap
          and leaves swaps_used_current_month at 3.
        test_recipe:
          setup:
            - "logical clock parked at 2026-08-03T09:00:00Z"
            - "membership plan SIG4 with monthly_swaps_allowed 2 and item_slots 3"
            - "style AUR-GOWN-01 with two grade-A size-M units so a superseding allocation always finds a unit"
            - "member on SIG4 books 2026-08-10 to 2026-08-16 and is MATCHED"
            - "each swap is preceded by a read of the member so expected_member_version is fresh, because every reservation write bumps Member.version"
            - "all three swap attempts happen inside the same UTC calendar month, which is the window swaps_used_current_month counts over"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /membership-plans"
              payload: { code: "SIG4", name: "Signature 4", item_slots: 3, monthly_fee_cents: 10000, monthly_swaps_allowed: 2, shipping_cadence_days: 7, waiver_monthly_fee_cents: 1800, waiver_coverage_cents: 10000 }
              as: PlatformAdmin
              captures: { plan_sig4_id: "$.data.id" }
            - call: "POST /styles"
              payload: { style_code: "AUR-GOWN-01", brand: "Aurelia", category: "GOWN", retail_price_cents: 48000, acquisition_cost_cents: 21000, size_run: ["S", "M", "L"], expected_rental_turns_per_unit: 12, planned_eol_value_cents: 9000, forecast_monthly_requests: 8, avg_rental_days: 6, planned_depth_units: 3 }
              as: InventoryPlanner
              captures: { style_gown_id: "$.data.id" }
            - call: "POST /styles/${style_gown_id}/rental-units"
              payload: { unit_code: "AUR-GOWN-01-M-001", size: "M", acquisition_cost_cents: 21000, condition_grade: "A" }
              as: InventoryPlanner
              captures: { unit1_id: "$.data.id" }
            - call: "POST /styles/${style_gown_id}/rental-units"
              payload: { unit_code: "AUR-GOWN-01-M-002", size: "M", acquisition_cost_cents: 21000, condition_grade: "A" }
              as: InventoryPlanner
              captures: { unit2_id: "$.data.id" }
            - call: "POST /members"
              payload: { membership_plan_id: "${plan_sig4_id}", email: "nora@example.com", full_name: "Nora Ellery", waiver_active: false, preferred_categories: ["GOWN", "DRESS"], size_profile: "M" }
              as: PlatformAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /reservations"
              payload: { style_id: "${style_gown_id}", requested_size: "M", requested_start_date: "2026-08-10", requested_end_date: "2026-08-16" }
              as: Member
              as_user_id: "${member_id}"
              captures: { res1_id: "$.data.id" }
            - call: "GET /members/${member_id}"
              payload: {}
              as: Member
              as_user_id: "${member_id}"
              captures: { member_v1: "$.data.version" }
          trigger:
            - call: "POST /reservations/${res1_id}/swap"
              payload: { expected_member_version: "${member_v1}", style_id: "${style_gown_id}", requested_size: "M", requested_start_date: "2026-08-11", requested_end_date: "2026-08-17" }
              as: Member
              as_user_id: "${member_id}"
              captures: { res2_id: "$.data.id" }
            - call: "GET /members/${member_id}"
              payload: {}
              as: Member
              as_user_id: "${member_id}"
              captures: { member_v2: "$.data.version" }
            - call: "POST /reservations/${res2_id}/swap"
              payload: { expected_member_version: "${member_v2}", style_id: "${style_gown_id}", requested_size: "M", requested_start_date: "2026-08-12", requested_end_date: "2026-08-18" }
              as: Member
              as_user_id: "${member_id}"
              captures: { res3_id: "$.data.id" }
            - call: "GET /members/${member_id}"
              payload: {}
              as: Member
              as_user_id: "${member_id}"
              captures: { member_v3: "$.data.version" }
            - call: "POST /reservations/${res3_id}/swap"
              payload: { expected_member_version: "${member_v3}", style_id: "${style_gown_id}", requested_size: "M", requested_start_date: "2026-08-13", requested_end_date: "2026-08-19" }
              as: Member
              as_user_id: "${member_id}"
              captures: { swap_error_id: "$.data.error_id" }
          assert:
            - "the first swap succeeds: the new reservation reports is_swap == true, state == MATCHED and superseded_reservation_id equal to the original reservation, and the original reports state == SUPERSEDED"
            - "after the first swap the member reports swaps_used_current_month == 1, which is below monthly_swaps_allowed 2"
            - "the second swap succeeds and the member reports swaps_used_current_month == 2, exactly at monthly_swaps_allowed"
            - "the third swap returns HTTP 409 with error_id == ERR_SWAP_ALLOWANCE_EXHAUSTED"
            - "the third swap is NOT rejected with ERR_STALE_MEMBER_VERSION, because expected_member_version was re-read immediately before the call"
            - "after the rejection the member still reports swaps_used_current_month == 2 and the third reservation still reports state == MATCHED"
            - "GET /reservations?member_id={member_id} reports total_count == 3, so the refused swap created nothing"
      - name: required_depth_ceil_at_exact_planning_month_multiple
        grounds:
          - "1.3 calculation style_depth_requirement with DAYS_PER_PLANNING_MONTH 30, RECONDITION_BUFFER_DAYS 2 and REPLENISH_TRIGGER_UNITS 1"
          - "1.5 PATCH /styles/{style_id}/depth-plan and GET /styles/{style_id}"
          - "1.1 Style.required_depth_units, depth_gap_units, replenishment_flag, active_unit_count"
          - "1.1 Style.forecast_monthly_requests and avg_rental_days"
        distinguishing_aspect: >-
          committed_days is forecast_monthly_requests times (avg_rental_days + 2), and required_depth_units is that
          quantity divided by 30 and rounded up. The fixture sits exactly on the multiple: 10 times 6 equals 60, which
          must give 2 and not 3, so a ceil implemented as floor plus one fails immediately. Raising the forecast by a
          single request moves committed_days to 66, which is 2.2 planning months and must round up to 3.
          depth_gap_units follows from 2 to 3 on a style with no units, so both the ceiling boundary and its
          downstream derived counter are pinned.
        test_recipe:
          setup:
            - "logical clock parked at 2026-08-03T09:00:00Z"
            - "style VER-KNIT-02 is created with forecast_monthly_requests 10, avg_rental_days 4 and planned_depth_units 2, and no rental units are created for it"
            - "committed_days is therefore 10 times (4 + 2) == 60, which is exactly two planning months of 30 days"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /styles"
              payload: { style_code: "VER-KNIT-02", brand: "Verdant", category: "KNITWEAR", retail_price_cents: 12000, acquisition_cost_cents: 4800, size_run: ["S", "M"], expected_rental_turns_per_unit: 10, planned_eol_value_cents: 900, forecast_monthly_requests: 10, avg_rental_days: 4, planned_depth_units: 2 }
              as: InventoryPlanner
              captures: { style_knit_id: "$.data.id" }
          trigger:
            - call: "GET /styles/${style_knit_id}"
              payload: {}
              as: InventoryPlanner
            - call: "PATCH /styles/${style_knit_id}/depth-plan"
              payload: { forecast_monthly_requests: 11 }
              as: InventoryPlanner
            - call: "GET /styles/${style_knit_id}"
              payload: {}
              as: InventoryPlanner
          assert:
            - "the first read reports required_depth_units == 2, which is ceil(60 / 30) at the exact multiple and not 3"
            - "the first read reports active_unit_count == 0, depth_gap_units == 2 and replenishment_flag == true"
            - "after the depth-plan patch the style reports forecast_monthly_requests == 11 and avg_rental_days == 4"
            - "the second read reports required_depth_units == 3, because committed_days == 66 is 2.2 planning months and rounds up"
            - "the second read reports depth_gap_units == 3 and replenishment_flag == true, so the derived gap tracked the ceiling change"
            - "planned_depth_units stays 2, proving required_depth_units is computed rather than read from the plan field"
      - name: listing_expiration_allowed_exactly_at_window_edge
        grounds:
          - "1.4 validation priority 44 ERR_LISTING_WINDOW_OPEN with LISTING_WINDOW_DAYS 30"
          - "1.5 POST /resale-listings/{listing_id}/expiration and POST /_clock/set_current_utc"
          - "1.2 ResaleListing LISTED to EXPIRED"
          - "1.1 ResaleListing.listed_at and markdown_step"
          - "1.3 calculation resale_pricing for the initial listing figures"
        distinguishing_aspect: >-
          The metric is calendar days between listed_at and the logical clock, and the gate is greater-than-or-equal,
          so 2026-09-01 (day 29 after a 2026-08-03 listing) must be refused while 2026-09-02 (day 30 exactly) must be
          accepted. Only the clock changes between the two calls, and the listing is otherwise untouched, so an
          implementation that uses a strict greater-than, or that counts from created_at instead of listed_at, flips
          exactly one of the two assertions.
        test_recipe:
          setup:
            - "logical clock parked at 2026-08-03T09:00:00Z"
            - "style AUR-GOWN-01 with retail_price_cents 48000 and one grade-D size-M unit that has never rented"
            - "the unit is retired with retirement_reason PLANNED_REFRESH and the returned version is captured"
            - "an OUTLET listing is created, so listed_at is 2026-08-03T09:00:00Z, base_price_cents is 48000 times RESALE_RATE_BY_GRADE[D] 0.08 == 3840, tier LOW gives channel_fee_cents 192 and net_recovery_cents 3248, which is above MIN_NET_RECOVERY_CENTS so no floor correction applies"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /styles"
              payload: { style_code: "AUR-GOWN-01", brand: "Aurelia", category: "GOWN", retail_price_cents: 48000, acquisition_cost_cents: 21000, size_run: ["S", "M", "L"], expected_rental_turns_per_unit: 12, planned_eol_value_cents: 9000, forecast_monthly_requests: 8, avg_rental_days: 6, planned_depth_units: 3 }
              as: InventoryPlanner
              captures: { style_gown_id: "$.data.id" }
            - call: "POST /styles/${style_gown_id}/rental-units"
              payload: { unit_code: "AUR-GOWN-01-M-005", size: "M", acquisition_cost_cents: 21000, condition_grade: "D" }
              as: InventoryPlanner
              captures: { unit1_id: "$.data.id" }
            - call: "POST /rental-units/${unit1_id}/retirement"
              payload: { retirement_reason: "PLANNED_REFRESH" }
              as: InventoryPlanner
              captures: { unit1_version: "$.data.version" }
            - call: "POST /resale-listings"
              payload: { rental_unit_id: "${unit1_id}", expected_rental_unit_version: "${unit1_version}", channel: "OUTLET" }
              as: InventoryPlanner
              captures: { listing1_id: "$.data.id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /resale-listings/${listing1_id}/expiration"
              payload: {}
              as: InventoryPlanner
              captures: { expire_error_id: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /resale-listings/${listing1_id}/expiration"
              payload: {}
              as: InventoryPlanner
          assert:
            - "at clock 2026-09-01 the expiration returns HTTP 409 with error_id == ERR_LISTING_WINDOW_OPEN"
            - "after that refusal the listing still reports state == LISTED, markdown_step == 0 and list_price_cents == 3840"
            - "at clock 2026-09-02, exactly listed_at plus LISTING_WINDOW_DAYS 30, the expiration succeeds and the listing reports state == EXPIRED"
            - "the expired listing still reports markdown_step == 0, base_price_cents == 3840, channel_fee_cents == 192 and net_recovery_cents == 3248, so expiry does not reprice"
            - "the unit still reports availability_state == RETIRED, because expiry of a listing does not move the unit"
      - name: late_fee_zero_on_receipt_exactly_at_grace_edge
        grounds:
          - "1.3 calculation late_return_fee with RETURN_GRACE_DAYS 2, LATE_FEE_PER_DAY_CENTS 500 and LATE_FEE_CAP_CENTS 5000"
          - "1.5 POST /shipments/{shipment_id}/receipt"
          - "1.1 Reservation.late_days and late_fee_cents"
          - "1.1 Member.outstanding_fee_cents and late_return_count"
          - "1.1 FeeLedgerEntry kind LATE_FEE"
        distinguishing_aspect: >-
          late_days is max(0, receipt date minus (requested_end_date + 2)), so a receipt on exactly 2026-08-18 for a
          turn ending 2026-08-16 must produce late_days 0, late_fee_cents 0 and no ledger entry at all, while one day
          later would produce 500. The assertion pins the inclusive edge and its downstream silence: total_count 0 on
          the ledger, outstanding_fee_cents 0 and late_return_count 0. An implementation that treats the grace date
