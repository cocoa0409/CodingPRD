          trigger:
            - { call: "POST /v1/ops-runs", payload: {}, as: PlantManager, captures: { sweep1: $.data.customers_suspended_count } }
            - { call: "POST /v1/shipment-orders", payload: { customer_id: "${cust_id}", formula_id: "${form_id}", channel: "FOODSERVICE", requested_delivery_date: "2026-08-20", units_requested: 500 }, as: CustomerServiceRep, captures: { ord_id: $.data.id, ord_v: $.data.version } }
