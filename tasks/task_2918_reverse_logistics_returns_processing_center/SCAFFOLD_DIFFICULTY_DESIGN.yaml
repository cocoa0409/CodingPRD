            - call: "POST /catalog-items"
              payload: { client_id: "${c_id}", sku: "WIDGET-1", description: "Standard widget", declared_value_cents: 20000, unit_weight_grams: 1200, serialized: false, refurb_eligible: false, secondary_market_floor_cents: 1000, hazard_class: "NONE", regulated_flag: false }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { item_id: $.data.id }
            - call: "POST /secondary-market-channels"
              payload: { name: "Alpha Auction", channel_code: "AUC1", channel_type: "AUCTION", accepted_grades: ["A", "B", "C", "D"], fee_pct: 0.12, hazard_certified: false, recall_certified: false, min_lot_value_cents: 0, concurrent_lot_capacity: 5 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { ch_id: $.data.id }
            - call: "POST /return-authorizations"
              payload: { client_id: "${c_id}", order_reference: "ORD-1022", customer_reference: "CUST-22", order_placed_at: "2026-07-25T00:00:00Z", expires_at: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_id: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/lines"
              payload: { catalog_item_id: "${item_id}", authorized_quantity: 1, reason_code: "DEFECTIVE" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_line_id: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/issue"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
            - call: "POST /receipts"
              payload: { rma_id: "${rma_id}", tracking_reference: "TRK-22", gross_weight_grams: 1400 }
              as: ReceivingClerk
              as_user_id: "u_clerk"
              captures: { rcpt_id: $.data.id }
            - call: "POST /receipts/${rcpt_id}/lines"
              payload: { rma_line_id: "${rma_line_id}", quantity: 1, reason_code: "DEFECTIVE" }
              as: ReceivingClerk
              as_user_id: "u_clerk"
              captures: { line_id: $.data.id }
            - call: "POST /return-lines/${line_id}/grade"
              payload: { condition_grade: "C" }
              as: GradingInspector
              as_user_id: "u_grader"
              captures: { line_ver: $.data.version }
            - call: "POST /disposition-orders"
              payload: { return_line_id: "${line_id}", expected_return_line_version: "${line_ver}", channel_id: "${ch_id}" }
              as: DispositionSupervisor
              as_user_id: "u_super"
              captures: { ord_id: $.data.id }
            - call: "POST /disposition-orders/${ord_id}/approve"
              payload: {}
              as: DispositionSupervisor
              as_user_id: "u_super"
            - call: "POST /disposition-orders/${ord_id}/execute"
              payload: { realized_unit_price_cents: 25000 }
              as: DispositionSupervisor
              as_user_id: "u_super"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
          trigger:
            - call: "POST /return-lines/${line_id}/release-refund"
              payload: {}
              as: RefundAnalyst
              as_user_id: "u_analyst"
            - call: "GET /clients/${c_id}/disposition-audit"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
            - call: "POST /return-lines/${line_id}/reverse-refund"
              payload: { reversal_memo: "Chargeback won by the center" }
              as: RefundAnalyst
              as_user_id: "u_analyst"
            - call: "GET /clients/${c_id}/disposition-audit"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
          assert:
            - "Immediately after execution Client.settlement_balance_cents == 20350: gross 25000 lands on MID_LOT (>= 25000), band surcharge 0.00, effective_fee_pct 0.12, channel_fee_cents 3000, net_recovery_cents 22000, RECOVERY_CREDIT 22000 - round_half_up(22000 * 0.075) == 1650"
            - "The release returns 200 with net_refund_cents 18000 and financial_state REFUNDED; the appended REFUND_DEBIT is -18000"
            - "Checkpoint after release: settlement_balance_cents == 2350 (20350 - 18000), recovery_credit_cents 20350, refund_debit_cents -18000, reversal_cents 0, money_conservation_ok true"
            - "The reversal returns 200 with financial_state CLAWED_BACK and appends a REVERSAL entry of exactly +18000 carrying the reversal_memo"
            - "Checkpoint after reversal: settlement_balance_cents == 20350 EXACTLY — identical to the pre-release value, with no one-cent drift from re-rounding, because the reversal reuses the stored net_refund_cents instead of recomputing the fee"
            - "Checkpoint after reversal: recovery_credit_cents 20350, refund_debit_cents -18000, reversal_cents 18000, money_conservation_ok true, and GET /shrink-ledger-entries?client_id=${c_id} returns total_count 3 — the compensation is an append, never an edit or a delete"
            - "ReturnLine.${line_id}.disposition_state is still DISPOSITIONED: reversing the money never rewinds the physical dimension"
