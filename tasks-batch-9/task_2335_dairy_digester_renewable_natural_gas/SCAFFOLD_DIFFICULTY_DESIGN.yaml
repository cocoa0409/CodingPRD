          A different entity pair, RevenueStatement -> DigesterFacility, and a graded gate
          rather than a binary one: at distribution_posture RESTRICTED the DRAFT -> APPROVED
          transition is still allowed (only LOCKED blocks it) while APPROVED -> PAID is
