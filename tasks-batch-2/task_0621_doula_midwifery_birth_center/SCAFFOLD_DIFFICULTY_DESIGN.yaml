  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      # ---- Instance 1: kit conservation — reserve + transfer-consume keeps total constant
      - name: ci_kit_total_conserved_on_transfer
        grounds:
          - calculations.supply_kit_counters
          - entities.SupplyKit.fields.reserved_count
          - entities.SupplyKit.fields.consumed_count
          - state_machines.Episode.transitions.ACTIVE_to_TRANSFERRED
        distinguishing_aspect: |
          Conserved quantity #1 = physical kit units = on_hand_count (constant). The reserve at
          episode-create moves one unit reserved (reserved 1, consumed 0), and the transfer
          compensating action moves it reserved->consumed (reserved 0, consumed 1); the invariant
          on_hand_count == 1 and reserved_count + consumed_count <= on_hand_count holds throughout.
        test_recipe:
          setup:
            - "SupplyKit BK1 on_hand=1; package PKG_BIRTH uses BK1; episode created (reserved 1) and ACTIVE."
          setup_api_calls:
            - call: "POST /birth-center/supply-kits"
              payload: { sku: "BK1", name: "Birth Kit", on_hand_count: 1 }
              as: CenterAdmin
            - call: "POST /birth-center/care-packages"
              payload: { code: "PKG_BIRTH", package_type: "BIRTH", global_fee_cents: 800000, prenatal_visits_included: 3, postpartum_visits_included: 2, kit_sku: "BK1" }
              as: CenterAdmin
            - call: "POST /birth-center/clients"
              payload: { full_name: "Ada A", date_of_birth: "1994-03-02", parity: 0 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /birth-center/episodes"
              payload: { client_id: "${client_id}", package_code: "PKG_BIRTH", edd: "2026-08-01" }
              as: IntakeCoordinator
              captures: { ep_id: $.data.id }
            - call: "POST /birth-center/episodes/${ep_id}/activate"
              payload: {}
              as: Midwife
          trigger:
            - call: "POST /birth-center/episodes/${ep_id}/transfer"
              payload: {}
              as: Midwife
          assert:
            - "before trigger, SupplyKit.BK1.reserved_count == 1 and consumed_count == 0"
            - "after trigger, SupplyKit.BK1.reserved_count == 0 and consumed_count == 1"
            - "throughout, SupplyKit.BK1.on_hand_count == 1 (named quantity unchanged) and reserved_count + consumed_count == 1"

      # ---- Instance 2: provider load conservation — stand-down + promote keeps total primary coverage constant
      - name: ci_provider_coverage_conserved_on_promote
        grounds:
          - calculations.provider_capacity_load
          - entities.Provider.fields.active_assignment_count
          - state_machines.OnCallAssignment.transitions.ASSIGNED_to_STOOD_DOWN
          - state_machines.OnCallAssignment.transitions.ASSIGNED_to_PROMOTED
        distinguishing_aspect: |
          Conserved quantity #2 (different type from kit units) = the episode's total active
          primary on-call coverage count across providers. Transfer stands the primary down
          (PRI count 1->0) and promotes the backup (BAK count 0->1) in the same cascade; the sum
          of active_assignment_count over {PRI, BAK} stays exactly 1 — coverage is conserved, not
          dropped.
        test_recipe:
          setup:
            - "Standard kit+package+client+episode; episode ACTIVE."
            - "PRI PRIMARY ASSIGNED (active 1); BAK BACKUP ASSIGNED (active 0)."
          setup_api_calls:
            - call: "POST /birth-center/supply-kits"
              payload: { sku: "BK1", name: "Birth Kit", on_hand_count: 5 }
              as: CenterAdmin
            - call: "POST /birth-center/care-packages"
              payload: { code: "PKG_BIRTH", package_type: "BIRTH", global_fee_cents: 800000, prenatal_visits_included: 3, postpartum_visits_included: 2, kit_sku: "BK1" }
              as: CenterAdmin
            - call: "POST /birth-center/clients"
              payload: { full_name: "Ada A", date_of_birth: "1994-03-02", parity: 0 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /birth-center/episodes"
              payload: { client_id: "${client_id}", package_code: "PKG_BIRTH", edd: "2026-08-01" }
              as: IntakeCoordinator
              captures: { ep_id: $.data.id }
            - call: "POST /birth-center/episodes/${ep_id}/activate"
              payload: {}
              as: Midwife
            - call: "POST /birth-center/providers"
              payload: { full_name: "Pri Midwife", role_type: "MIDWIFE", license_number: "L-PRI", max_active_episodes: 2 }
              as: CenterAdmin
              captures: { pri_id: $.data.id }
            - call: "POST /birth-center/providers"
              payload: { full_name: "Bak Midwife", role_type: "MIDWIFE", license_number: "L-BAK", max_active_episodes: 2 }
              as: CenterAdmin
              captures: { bak_id: $.data.id }
            - call: "POST /birth-center/on-call-assignments"
              payload: { episode_id: "${ep_id}", provider_id: "${pri_id}", coverage_start: "2026-07-25T00:00:00Z", coverage_end: "2026-08-10T00:00:00Z" }
              as: CenterAdmin
              captures: { pri_asg_id: $.data.id }
            - call: "POST /birth-center/on-call-assignments/${pri_asg_id}/name-backup"
              payload: { provider_id: "${bak_id}", coverage_start: "2026-07-25T00:00:00Z", coverage_end: "2026-08-10T00:00:00Z" }
              as: CenterAdmin
              captures: { bak_asg_id: $.data.id }
          trigger:
            - call: "POST /birth-center/episodes/${ep_id}/transfer"
              payload: {}
              as: Midwife
          assert:
            - "before trigger, Provider.${pri_id}.active_assignment_count == 1 and Provider.${bak_id}.active_assignment_count == 0 (sum 1)"
            - "after trigger, Provider.${pri_id}.active_assignment_count == 0 and Provider.${bak_id}.active_assignment_count == 1 (sum 1)"
            - "the named quantity (sum of active_assignment_count over {PRI, BAK}) is conserved at 1"
