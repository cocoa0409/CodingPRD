  # ================= Cross-Cutting Complexity Layers =================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_route_version_on_second_dispatch
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[dispatch-visit-stale-route]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Two sequential dispatches reusing the same pre-dispatch expected_crewroute_version: the first succeeds (route version advances), the second carrying the stale version is rejected with ERR_STALE_VERSION (412)."
        excluded_because:
          difficulty_instance: boundary_precision_check / route_capacity_zero_empty_slot_boundary
          rationale: "OCC version advance and capacity consumption on the dispatch endpoint are observed in the capacity-boundary §1.8 instance, which captures r_ver1 from the first dispatch's response; the stale-version path is the same endpoint with a deliberately stale ${var}."

      - name: scheduled_action_clock_drives_offseason_autotransition
        claim_type: scheduled_actions
        grounds:
          - endpoints
          - state_machines.Subscription.ACTIVE_to_OFF_SEASON
        distinguishing_aspect: "Advancing the logical clock past season_end_date auto-fires ACTIVE -> OFF_SEASON without an explicit close-season call."
        excluded_because:
          difficulty_instance: transitive_cascade / offseason_cascade_subscription_to_visits_skip_depth2
          rationale: "The clock-driven auto-transition is the trigger of the §1.8 off-season cascade instance."

      - name: default_clock_is_april_first_2026
        claim_type: scheduled_actions
        grounds:
          - endpoints
        distinguishing_aspect: "Before any set_current_utc call the logical clock reads exactly 2026-04-01T00:00:00Z (fixed startup default), so a subscription whose season starts 2026-05-01 sees all visits in the future at activation."
        test_recipe:
          setup:
            - "Fresh server (clock never set); an ACTIVE PER_VISIT subscription season 2026-05-01..2026-08-31; no clock-set call made."
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { tier: "BASIC", visit_interval_days: 21, per_visit_price_cents: 5000, seasonal_price_cents: 30000, includes_tick_barrier: false, retreat_guarantee_days: 7 }
