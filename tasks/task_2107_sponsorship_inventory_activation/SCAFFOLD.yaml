# =============================================================================
# PRD Benchmark Seed Tables — task_2107_sponsorship_inventory_activation
# Generated per skills/prd-bench-scaffold-generator/SKILL.md §1.0–§1.7
# §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml, §1.9 in SCAFFOLD_CORNER_DESIGN.yaml
# =============================================================================

scenario: |
  desgin task harder than expert level.!!!!  2107. Sponsorship Inventory & Activation Reporting
  (sports property sponsorship team): rate card & package builder by property,
  proof-of-performance capture (photos/impressions/social), asset scheduling conflicts
  across sponsors, entitlement tracking per contract clause, in-kind/trade valuation,
  activation staffing & event execution, sponsor survey & renewal likelihood scoring,
  ROI/ROO reporting

domain_name: sponsorship-inventory-activation

# Flat/graph topology: every resource is a top-level collection linked by foreign keys,
# so the API root is "/" and no single business object owns the URL namespace.
api_prefix: "/"

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: graph
  # Entitlement is a junction between Contract and InventoryAsset; StaffAssignment is a
  # junction between AssetBooking and StaffMember; RateCard carries a self-referential
  # supersession edge. All collections are flat/top-level; nesting appears only for
  # strictly-owned children (rate card lines, proofs, surveys, assignments).

  state_machine_shape: cyclic
  # Contract cycles SUBMITTED -> DRAFT -> SUBMITTED (revision rounds, capped at 3) AND
  # carries a second, independent state dimension (fulfillment_status) that advances from
  # the delivery cascade without touching the lifecycle axis. ProofOfPerformance and
  # AssetBooking are branching (fork with divergent side-effect sets per branch);
  # Entitlement is compound (status derived from booking aggregates).

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The operator who submits a contract may not countersign it; the operator who captures
  # a proof of performance may not adjudicate it. Roles are otherwise peer-scoped, with a
  # single entity_backed role (SponsorContact -> Sponsor).

  consistency_model: immediate

  difficulty_level: expert_plus
  # 12 entities / 43 endpoints / 36 errors / 8 calculations (3 dual-variant) / 7 state machines

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Property
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Display name of the sports property"
        constraints: "1..120 chars, required"
      - name: sport_code
        type: enum
        source: input
        description: "Sport the property competes in"
        constraints: "one of FOOTBALL, BASKETBALL, SOCCER, HOCKEY, BASEBALL"
      - name: season_year
        type: integer
        source: input
        description: "Calendar year the season belongs to"
        constraints: "2020..2100"
      - name: season_start
        type: datetime
        source: input
        description: "ISO 8601 UTC instant at which the season opens"
      - name: season_end
        type: datetime
        source: input
        description: "ISO 8601 UTC instant at which the season closes; must be strictly after season_start"
      - name: status
        type: enum
        source: system
        default: PLANNING
        description: "Lifecycle stage of the property; gates rate-card publication, contract activation and booking creation"
        constraints: "one of PLANNING, SELLING, IN_SEASON, CLOSED"
      - name: seasonality_index
        type: number
        source: input
        default: 1.00
        description: "Multiplier applied to every rate-card unit price when an entitlement is valued"
        constraints: "0.50..2.00, 2 decimal places"
      - name: inventory_target_value_cents
        type: integer
        source: input
        description: "Sellable inventory value target for the season, in cents; denominator of sellout_pct and base of the oversell ceiling"
        constraints: ">= 0"
      - name: committed_gross_value_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of total_recognized_value_cents over Contracts of this property whose status is COUNTERSIGNED or ACTIVE"
      - name: delivered_media_value_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of delivered_media_value_cents over Contracts of this property whose status is ACTIVE or CLOSED"
      - name: sellout_pct
        type: number
        source: computed
        default: 0.00
        description: "committed_gross_value_cents as a percentage of inventory_target_value_cents, 2 decimal places, 0.00 when the target is 0"

  - name: RateCard
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the property whose inventory this card prices"
      - name: label
        type: string
        source: input
        description: "Human label for the card, e.g. '2026 Season Card v2'"
        constraints: "1..80 chars"
      - name: effective_year
        type: integer
        source: input
        description: "Season year the card prices"
        constraints: "2020..2100"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Publication state of the card"
        constraints: "one of DRAFT, PUBLISHED, SUPERSEDED"
      - name: published_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant at which the card was published; null while DRAFT"
      - name: superseded_by_rate_card_id
        type: string
        source: system
        default: null
        description: "FK -> RateCard.id; set on the previously PUBLISHED card of the same property when a newer card is published"
      - name: line_count
        type: integer
        source: computed
        default: 0
        description: "Number of RateCardLine rows attached to this card"

  - name: RateCardLine
    parent: RateCard
    common_fields: false
    fields:
      - name: rate_card_id
        type: string
        source: input
        description: "FK -> RateCard.id; owning card, taken from the request path"
      - name: asset_class
        type: enum
        source: input
        description: "Inventory class this line prices; at most one line per class per card"
        constraints: "one of SIGNAGE, DIGITAL_BOARD, MEDIA_SPOT, HOSPITALITY, IP_RIGHTS, ACTIVATION_SPACE"
      - name: base_unit_price_cents
        type: integer
        source: input
        description: "List price per unit in cents before tier, seasonality and exclusivity adjustments"
        constraints: ">= 1"
      - name: tier_breaks
        type: array
        source: input
        default: []
        description: "Volume breaks as objects with keys min_units (integer >= 1) and unit_price_cents (integer >= 1); the highest break whose min_units is <= promised_units wins"
        constraints: "0..5 entries, min_units values must be unique"
      - name: exclusivity_multiplier
        type: number
        source: input
        default: 1.00
        description: "Multiplier applied to the unit price when the buying contract holds CATEGORY exclusivity"
        constraints: "1.00..2.00, 2 decimal places"

  - name: InventoryAsset
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the property that owns this physical or digital asset"
      - name: name
        type: string
        source: input
        description: "Display name of the asset, e.g. 'North LED Ribbon'"
        constraints: "1..120 chars"
      - name: asset_class
        type: enum
        source: input
        description: "Inventory class; must match the class of the rate-card line used to value entitlements on this asset"
        constraints: "one of SIGNAGE, DIGITAL_BOARD, MEDIA_SPOT, HOSPITALITY, IP_RIGHTS, ACTIVATION_SPACE"
      - name: capacity_units
        type: integer
        source: input
        description: "Maximum number of units that may be occupied by intersecting bookings at any instant"
        constraints: ">= 1"
      - name: changeover_buffer_minutes
        type: integer
        source: input
        default: 0
        description: "Minimum idle gap required between two non-intersecting bookings that belong to different contracts"
        constraints: "0..240"
      - name: requires_staffing
        type: boolean
        source: input
        default: false
        description: "When true, a booking on this asset may only be delivered once min_staff_count assignments are CHECKED_IN"
      - name: min_staff_count
        type: integer
        source: input
        default: 0
        description: "Number of CHECKED_IN StaffAssignments required before delivery when requires_staffing is true"
        constraints: "0..20"
      - name: status
        type: enum
        source: input
        default: AVAILABLE
        description: "Operational availability of the asset; only AVAILABLE assets accept new bookings"
        constraints: "one of AVAILABLE, MAINTENANCE, RETIRED"
      - name: reserved_units_total
        type: integer
        source: computed
        default: 0
        description: "Sum of units_booked over AssetBookings on this asset whose status is SCHEDULED; conserved quantity of the booking/cancel invariant"

  - name: Sponsor
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Brand name of the sponsor"
        constraints: "1..120 chars"
      - name: category
        type: enum
        source: input
        description: "Exclusivity category the brand competes in"
        constraints: "one of BEVERAGE, AUTOMOTIVE, FINANCIAL, TELECOM, APPAREL, TECH"
      - name: contact_email
        type: string
        source: input
        description: "Primary contact mailbox for the sponsor"
        constraints: "must contain '@'"
      - name: status
        type: enum
        source: system
        default: PROSPECT
        description: "Commercial standing; ACTIVE once any contract is countersigned, CHURNED when a contract closes with renewal_band LOW and no other COUNTERSIGNED or ACTIVE contract remains"
        constraints: "one of PROSPECT, ACTIVE, CHURNED"
      - name: renewal_likelihood_score
        type: number
        source: computed
        default: 0.00
        description: "Renewal likelihood on a 0..100 scale, 2 decimal places, recomputed on contract close and on survey submission"
      - name: renewal_band
        type: enum
        source: computed
        default: LOW
        description: "Band of renewal_likelihood_score; HIGH at >= 70, MEDIUM at >= 40, otherwise LOW"
        constraints: "one of LOW, MEDIUM, HIGH"

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - name: sponsor_id
        type: string
        source: input
        description: "FK -> Sponsor.id; the buying brand"
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the selling property"
      - name: rate_card_id
        type: string
        source: system
        default: null
        description: "FK -> RateCard.id; pinned at countersign to the property's PUBLISHED card and never re-pinned afterwards"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Lifecycle dimension of the contract"
        constraints: "one of DRAFT, SUBMITTED, COUNTERSIGNED, ACTIVE, CLOSED, TERMINATED"
      - name: fulfillment_status
        type: enum
        source: computed
        default: NOT_STARTED
        description: "Delivery dimension of the contract, advanced by the booking-delivery cascade independently of status"
        constraints: "one of NOT_STARTED, IN_PROGRESS, FULFILLED, SHORTFALL"
      - name: term_start
        type: datetime
        source: input
        description: "First instant of the sponsorship term; must be >= property.season_start"
      - name: term_end
        type: datetime
        source: input
        description: "Last instant of the sponsorship term; must be strictly after term_start and <= property.season_end"
      - name: exclusivity_scope
        type: enum
        source: input
        default: NONE
        description: "CATEGORY locks the sponsor's category on the property for the term and applies the rate-line exclusivity multiplier"
        constraints: "one of NONE, CATEGORY"
      - name: in_kind_declared_value_cents
        type: integer
        source: input
        default: 0
        description: "Face value of the trade/in-kind component as declared by the sponsor, in cents"
        constraints: ">= 0"
      - name: in_kind_category
        type: enum
        source: input
        default: PRODUCT
        description: "Trade category that selects the in-kind haircut rate"
        constraints: "one of MEDIA_TRADE, PRODUCT, SERVICES, TICKETS"
      - name: gross_entitlement_value_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of gross_value_cents over this contract's Entitlements whose status is not WAIVED"
      - name: volume_discount_pct
        type: number
        source: computed
        default: 0.00
        description: "Volume discount rate selected from gross_entitlement_value_cents alone, 2 decimal places"
      - name: cash_value_cents
        type: integer
        source: computed
        default: 0
        description: "gross_entitlement_value_cents less the rounded volume discount; the cash leg of the deal"
      - name: in_kind_recognized_value_cents
        type: integer
        source: computed
        default: 0
        description: "Recognized value of the trade component after haircut and cap, variant-dependent"
      - name: total_recognized_value_cents
        type: integer
        source: computed
        default: 0
        description: "cash_value_cents plus in_kind_recognized_value_cents"
      - name: delivered_media_value_cents
        type: integer
        source: computed
        default: 0
        description: "Sum over DELIVERED bookings whose proof_state is not DEFICIENT of units_booked times the owning entitlement's unit_value_cents"
      - name: makegood_credit_cents
        type: integer
        source: computed
        default: 0
        description: "Shortfall credit pool allocated at close; 0 before close"
      - name: revision_round
        type: integer
        source: system
        default: 0
        description: "Number of times the contract has been returned to DRAFT from SUBMITTED; a 4th submit is rejected"
      - name: submitted_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the operator who last submitted the contract; cleared on return"
      - name: countersigned_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the operator who countersigned the contract"

  - name: Entitlement
    parent: Contract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; owning contract, taken from the request path"
      - name: inventory_asset_id
        type: string
        source: input
        description: "FK -> InventoryAsset.id; the asset that satisfies this clause"
      - name: clause_ref
        type: string
        source: input
        description: "Contract clause reference such as '4.2(a)'; unique within the contract"
        constraints: "1..24 chars"
      - name: asset_class
        type: enum
        source: computed
        description: "Copied from the linked InventoryAsset at creation; selects the rate-card line at countersign"
        constraints: "one of SIGNAGE, DIGITAL_BOARD, MEDIA_SPOT, HOSPITALITY, IP_RIGHTS, ACTIVATION_SPACE"
      - name: promised_units
        type: integer
        source: input
        description: "Units the property owes the sponsor under this clause"
        constraints: ">= 1"
      - name: unit_value_cents
        type: integer
        source: computed
        default: 0
        description: "Per-unit value pinned at countersign from the rate-card line, seasonality and exclusivity"
      - name: gross_value_cents
        type: integer
        source: computed
        default: 0
        description: "unit_value_cents times promised_units"
      - name: delivered_units
        type: integer
        source: computed
        default: 0
        description: "Sum of units_booked over this entitlement's AssetBookings whose status is DELIVERED and whose proof_state is not DEFICIENT"
      - name: delivery_pct
        type: number
        source: computed
        default: 0.00
        description: "delivered_units as a percentage of promised_units, 2 decimal places"
      - name: status
        type: enum
        source: computed
        default: PENDING
        description: "Delivery standing of the clause"
        constraints: "one of PENDING, PARTIAL, FULFILLED, SHORTFALL, WAIVED"
      - name: makegood_credit_cents
        type: integer
        source: computed
        default: 0
        description: "This clause's slice of the contract makegood pool, allocated at close"

  - name: AssetBooking
    parent: null
    common_fields: true
    fields:
      - name: entitlement_id
        type: string
        source: input
        description: "FK -> Entitlement.id; the clause this occupation delivers against"
      - name: inventory_asset_id
        type: string
        source: input
        description: "FK -> InventoryAsset.id; must equal the entitlement's inventory_asset_id"
      - name: window_start
        type: datetime
        source: input
        description: "Inclusive start of the occupation window"
      - name: window_end
        type: datetime
        source: input
        description: "Exclusive end of the occupation window; must be strictly after window_start"
      - name: units_booked
        type: integer
        source: input
        description: "Units of the asset occupied for the whole window"
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: "CANCELLED is operator-initiated, PREEMPTED is produced only by the contract-termination cascade"
        constraints: "one of SCHEDULED, DELIVERED, CANCELLED, PREEMPTED"
      - name: proof_state
        type: enum
        source: computed
        default: NONE
        description: "DEFICIENT when any proof is REJECTED, else VERIFIED when any proof is VERIFIED, else PENDING_REVIEW when any proof is SUBMITTED, else NONE"
        constraints: "one of NONE, PENDING_REVIEW, VERIFIED, DEFICIENT"
      - name: verified_impressions
        type: integer
        source: computed
        default: 0
        description: "Sum of measured_value over this booking's VERIFIED proofs whose evidence_type is IMPRESSIONS or SOCIAL"
      - name: delivered_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant at which the booking was delivered"

  - name: ProofOfPerformance
    parent: AssetBooking
    common_fields: true
    fields:
      - name: asset_booking_id
        type: string
        source: input
        description: "FK -> AssetBooking.id; the occupation this evidence documents"
      - name: evidence_type
        type: enum
        source: input
        description: "Kind of evidence captured"
        constraints: "one of PHOTO, IMPRESSIONS, SOCIAL"
      - name: measured_value
        type: integer
        source: input
        description: "Impressions or engagements evidenced; must be 0 for PHOTO evidence"
        constraints: ">= 0"
      - name: media_uri
        type: string
        source: input
        default: null
        description: "Pointer to the stored artefact"
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: "Adjudication state of the evidence"
        constraints: "one of SUBMITTED, VERIFIED, REJECTED"
      - name: captured_by_user_id
        type: string
        source: system
        description: "X-User-ID of the operator who captured the evidence"
      - name: adjudicated_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the auditor who adjudicated the evidence"
      - name: reject_reason
        type: string
        source: system
        default: null
        description: "Reason recorded when the decision is REJECTED"

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Name of the activation staffer"
        constraints: "1..120 chars"
      - name: hourly_rate_cents
        type: integer
        source: input
        description: "Pay rate in cents per hour"
        constraints: ">= 0"
      - name: status
        type: enum
        source: input
        default: ACTIVE
        description: "Only ACTIVE staff may receive new assignments"
        constraints: "one of ACTIVE, INACTIVE"
      - name: scheduled_minutes
        type: integer
        source: computed
        default: 0
        description: "Total minutes across this member's StaffAssignments whose status is ASSIGNED or CHECKED_IN"

  - name: StaffAssignment
    parent: AssetBooking
    common_fields: true
    fields:
      - name: asset_booking_id
        type: string
        source: input
        description: "FK -> AssetBooking.id; the occupation being staffed"
      - name: staff_member_id
        type: string
        source: input
        description: "FK -> StaffMember.id; the staffer working the shift"
      - name: shift_start
        type: datetime
        source: input
        description: "Inclusive start of the shift"
      - name: shift_end
        type: datetime
        source: input
        description: "Inclusive end of the shift; must be strictly after shift_start"
      - name: role_label
        type: string
        source: input
        description: "On-site role such as 'Brand Ambassador'"
        constraints: "1..60 chars"
      - name: status
        type: enum
        source: system
        default: ASSIGNED
        description: "NO_SHOW is stamped by the delivery cascade on still-ASSIGNED shifts; RELEASED by delivery on CHECKED_IN shifts and by booking cancellation or preemption"
        constraints: "one of ASSIGNED, CHECKED_IN, NO_SHOW, RELEASED"

  - name: SponsorSurvey
    parent: Contract
    common_fields: false
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; the contract being rated, taken from the request path"
      - name: satisfaction_score
        type: integer
        source: input
        description: "Overall satisfaction rating"
        constraints: "1..10"
      - name: activation_quality_score
        type: integer
        source: input
        description: "Rating of on-site activation quality"
        constraints: "1..10"
      - name: reporting_quality_score
        type: integer
        source: input
        description: "Rating of reporting quality"
        constraints: "1..10"
      - name: renewal_intent
        type: enum
        source: input
        description: "Stated intent to renew"
        constraints: "one of NO, MAYBE, YES"
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the sponsor contact who filed the survey; equals the contract's sponsor_id"
      - name: composite_score
        type: number
        source: computed
        description: "Weighted 0..100 composite of the three ratings plus the renewal-intent adjustment, 2 decimal places"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Property
    initial_state: PLANNING
    terminal_states: [CLOSED]
    dimension: status
    transitions:
      - from: PLANNING
        to: SELLING
        trigger: "POST /properties/{id}/transition with to_status=SELLING"
        actor: PropertyAdmin
        preconditions:
          - "at least one RateCard of this property has status PUBLISHED, else ERR_NO_PUBLISHED_RATE_CARD"
        side_effects:
          - "property.status = SELLING"
          - "increments Property.version by 1"
      - from: SELLING
        to: IN_SEASON
        trigger: "POST /properties/{id}/transition with to_status=IN_SEASON"
        actor: PropertyAdmin
        preconditions:
          - "logical clock current_utc >= property.season_start, else ERR_SEASON_NOT_STARTED"
        side_effects:
          - "property.status = IN_SEASON"
          - "increments Property.version by 1"
      - from: IN_SEASON
        to: CLOSED
        trigger: "POST /properties/{id}/transition with to_status=CLOSED"
        actor: PropertyAdmin
        preconditions:
          - "no Contract of this property has status COUNTERSIGNED or ACTIVE, else ERR_OPEN_CONTRACTS"
        side_effects:
          - "property.status = CLOSED"
          - "increments Property.version by 1"
      - from: any
        to: any
        trigger: "POST /properties/{id}/transition with any to_status not listed above (including backwards moves and skips such as PLANNING -> IN_SEASON)"
        actor: PropertyAdmin
        preconditions: ["rejected unconditionally"]
        side_effects: []
        note: "Rejected with ERR_INVALID_STATE (409); no field is written and Property.version does not change."

  - entity: RateCard
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /rate-cards/{id}/publish"
        actor: PropertyAdmin
        preconditions:
          - "rate_card.line_count >= 1, else ERR_VALIDATION_FAILED"
          - "owning property.status is PLANNING, SELLING or IN_SEASON (not CLOSED), else ERR_INVALID_STATE"
        side_effects:
          - "rate_card.status = PUBLISHED and published_at = current_utc"
          - "cascade hop 1: the property's previously PUBLISHED card (at most one) transitions PUBLISHED -> SUPERSEDED and its superseded_by_rate_card_id is set to the newly published card id"
          - "increments Property.version by 1 (the property's published-card pointer changed), which invalidates any expected_property_version captured before this call"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system cascade from POST /rate-cards/{id}/publish on a newer card of the same property"
        actor: system
        preconditions:
          - "a newer card of the same property reaches PUBLISHED"
        side_effects:
          - "rate_card.status = SUPERSEDED"
          - "rate_card.superseded_by_rate_card_id = id of the newly published card"
          - "Contracts already pinned to this card keep rate_card_id unchanged (version pinning survives supersession)"
      - from: PUBLISHED
        to: PUBLISHED
        trigger: "POST /rate-cards/{id}/publish on an already PUBLISHED or SUPERSEDED card"
        actor: PropertyAdmin
        preconditions: ["rejected unconditionally"]
        side_effects: []
        note: "Rejected with ERR_INVALID_STATE (409)."

  - entity: Contract
    initial_state: DRAFT
    terminal_states: [CLOSED, TERMINATED]
    dimension: status
    shape_note: "Cyclic: SUBMITTED -> DRAFT -> SUBMITTED revision loop, capped at 3 completed rounds."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /contracts/{id}/submit"
        actor: SponsorshipSeller
        preconditions:
          - "contract has >= 1 Entitlement, else ERR_NO_ENTITLEMENTS"
          - "contract.revision_round <= 3, else ERR_REVISION_LIMIT_REACHED"
          - "owning property.status is SELLING or IN_SEASON, else ERR_PROPERTY_NOT_SELLING"
        side_effects:
          - "contract.status = SUBMITTED"
          - "contract.submitted_by_user_id = X-User-ID of the caller"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /contracts/{id}/return"
        actor: ContractApprover
        preconditions: []
        side_effects:
          - "contract.status = DRAFT"
          - "contract.revision_round increases by 1"
          - "contract.submitted_by_user_id = null"
      - from: SUBMITTED
        to: COUNTERSIGNED
        trigger: "POST /contracts/{id}/countersign"
        actor: ContractApprover
        preconditions:
          - "X-User-ID differs from contract.submitted_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "expected_property_version equals property.version, else ERR_PROPERTY_VERSION_STALE"
          - "the owning property has exactly one RateCard with status PUBLISHED, else ERR_NO_PUBLISHED_RATE_CARD"
          - "that card carries a RateCardLine for every distinct entitlement asset_class, else ERR_RATE_LINE_MISSING"
          - "no category-exclusivity clash on the property, else ERR_CATEGORY_EXCLUSIVITY_CONFLICT"
          - "property.committed_gross_value_cents + this contract's total_recognized_value_cents <= round_half_up(property.inventory_target_value_cents * 1.10), else ERR_INVENTORY_VALUE_EXCEEDED"
        side_effects:
          - "contract.rate_card_id pinned to the PUBLISHED card id"
          - "contract.countersigned_by_user_id = X-User-ID of the caller"
          - "each Entitlement gets unit_value_cents and gross_value_cents from calculation entitlement_unit_valuation"
          - "contract gross_entitlement_value_cents / volume_discount_pct / cash_value_cents / in_kind_recognized_value_cents (CONSERVATIVE variant) / total_recognized_value_cents from calculation contract_value_rollup"
          - "contract.status = COUNTERSIGNED"
          - "sponsor.status = ACTIVE when it was PROSPECT"
          - "cascade hop 1: property.committed_gross_value_cents recomputed by calculation property_inventory_rollup, which also refreshes sellout_pct and increments Property.version by 1"
      - from: COUNTERSIGNED
        to: ACTIVE
        trigger: "POST /contracts/{id}/activate"
        actor: ContractApprover
        preconditions:
          - "owning property.status is IN_SEASON, else ERR_PROPERTY_NOT_SELLING"
          - "logical clock current_utc >= contract.term_start, else ERR_TERM_NOT_STARTED"
        side_effects:
          - "contract.status = ACTIVE"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /contracts/{id}/close"
        actor: ContractApprover
        preconditions:
          - "logical clock current_utc >= contract.term_end, else ERR_TERM_NOT_ENDED"
          - "no AssetBooking of this contract's entitlements has status SCHEDULED, else ERR_OPEN_BOOKINGS"
        side_effects:
          - "contract.in_kind_recognized_value_cents and total_recognized_value_cents recomputed with the AUDITED variant of calculation in_kind_recognized_valuation"
          - "calculation makegood_credit_allocation writes contract.makegood_credit_cents and each entitlement's makegood_credit_cents"
          - "every Entitlement with status PENDING or PARTIAL moves to SHORTFALL; entitlements already FULFILLED or WAIVED are untouched"
          - "contract.fulfillment_status = SHORTFALL when any entitlement ends SHORTFALL, otherwise FULFILLED"
          - "contract.status = CLOSED"
          - "cascade hop 1: property_inventory_rollup drops this contract from committed_gross_value_cents and keeps it inside delivered_media_value_cents, refreshes sellout_pct and increments Property.version by 1"
          - "cascade hop 2: renewal_likelihood_scoring recomputes sponsor.renewal_likelihood_score and sponsor.renewal_band; sponsor.status = CHURNED when the band is LOW and the sponsor has no remaining COUNTERSIGNED or ACTIVE contract"
      - from: COUNTERSIGNED
        to: TERMINATED
        trigger: "POST /contracts/{id}/terminate"
        actor: ContractApprover
        preconditions: []
        side_effects:
          - "contract.status = TERMINATED and makegood_credit_cents stays 0"
          - "cascade hop 1: every Entitlement whose status is PENDING or PARTIAL moves to WAIVED"
          - "cascade hop 2: each newly WAIVED entitlement moves its own SCHEDULED AssetBookings to PREEMPTED"
          - "cascade hop 3: each PREEMPTED booking releases units, so inventory_asset.reserved_units_total drops by units_booked and InventoryAsset.version increments by 1"
          - "cascade hop 4: each PREEMPTED booking moves its ASSIGNED or CHECKED_IN StaffAssignments to RELEASED, which lowers staff_member.scheduled_minutes"
          - "cascade hop 1b: property_inventory_rollup removes the contract from committed_gross_value_cents, refreshes sellout_pct and increments Property.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /contracts/{id}/terminate"
        actor: ContractApprover
        preconditions: []
        side_effects:
          - "identical cascade to the COUNTERSIGNED -> TERMINATED transition"
      - from: any
        to: any
        trigger: "any lifecycle action not listed above for the current status (submit on SUBMITTED, countersign on DRAFT, activate on ACTIVE, close on COUNTERSIGNED, terminate on CLOSED, any action on CLOSED or TERMINATED)"
        actor: any
        preconditions: ["rejected unconditionally"]
        side_effects: []
        note: "Rejected with ERR_INVALID_STATE (409); no side effect fires."

  - entity: Contract
    initial_state: NOT_STARTED
    terminal_states: [FULFILLED, SHORTFALL]
    dimension: fulfillment_status
    shape_note: "Second, independent state dimension on the same row; it advances from the delivery cascade while status stays ACTIVE, and is finalized at close."
    transitions:
      - from: NOT_STARTED
        to: IN_PROGRESS
        trigger: "system cascade when an Entitlement of this contract reaches PARTIAL or FULFILLED while other entitlements remain PENDING or PARTIAL"
        actor: system
        preconditions:
          - "contract.status is COUNTERSIGNED or ACTIVE"
        side_effects:
          - "contract.fulfillment_status = IN_PROGRESS"
      - from: IN_PROGRESS
        to: FULFILLED
        trigger: "system cascade when every Entitlement of this contract has status FULFILLED or WAIVED"
        actor: system
        preconditions:
          - "contract.status is COUNTERSIGNED or ACTIVE"
        side_effects:
          - "contract.fulfillment_status = FULFILLED"
      - from: IN_PROGRESS
        to: NOT_STARTED
        trigger: "system cascade when every Entitlement falls back to PENDING (for example after the only delivered booking is marked DEFICIENT by a rejected proof)"
        actor: system
        preconditions:
          - "contract.status is COUNTERSIGNED or ACTIVE"
        side_effects:
          - "contract.fulfillment_status = NOT_STARTED"
      - from: any
        to: SHORTFALL
        trigger: "POST /contracts/{id}/close when at least one Entitlement ends in SHORTFALL"
        actor: ContractApprover
        preconditions: []
        side_effects:
          - "contract.fulfillment_status = SHORTFALL"

  - entity: Entitlement
    initial_state: PENDING
    terminal_states: [FULFILLED, SHORTFALL, WAIVED]
    shape_note: "Compound: status is a pure function of delivered_units versus promised_units, recomputed by calculation delivery_rollup."
    transitions:
      - from: PENDING
        to: PARTIAL
        trigger: "system cascade from POST /asset-bookings/{id}/deliver"
        actor: system
        preconditions:
          - "0 < delivered_units < promised_units"
        side_effects:
          - "entitlement.delivered_units and delivery_pct refreshed"
          - "cascade continues to the owning contract's fulfillment_status and delivered_media_value_cents"
      - from: PARTIAL
        to: FULFILLED
        trigger: "system cascade from POST /asset-bookings/{id}/deliver"
        actor: system
        preconditions:
          - "delivered_units >= promised_units"
        side_effects:
          - "entitlement.delivery_pct refreshed"
          - "cascade continues to the owning contract's fulfillment_status"
      - from: PARTIAL
        to: PENDING
        trigger: "system cascade from POST /proofs/{id}/adjudicate with decision=REJECTED"
        actor: system
        preconditions:
          - "the rejected proof flips its booking's proof_state to DEFICIENT, which removes that booking's units from delivered_units, leaving delivered_units = 0"
        side_effects:
          - "entitlement.delivered_units and delivery_pct refreshed downward"
          - "cascade continues to the owning contract's fulfillment_status and delivered_media_value_cents"
      - from: PENDING
        to: SHORTFALL
        trigger: "system cascade from POST /contracts/{id}/close"
        actor: system
        preconditions:
          - "delivered_units < promised_units at close"
        side_effects:
          - "entitlement.makegood_credit_cents assigned by makegood_credit_allocation"
      - from: PARTIAL
        to: SHORTFALL
        trigger: "system cascade from POST /contracts/{id}/close"
        actor: system
        preconditions:
          - "delivered_units < promised_units at close"
        side_effects:
          - "entitlement.makegood_credit_cents assigned by makegood_credit_allocation"
      - from: PENDING
        to: WAIVED
        trigger: "system cascade from POST /contracts/{id}/terminate"
        actor: system
        preconditions:
          - "owning contract moves to TERMINATED"
        side_effects:
          - "entitlement leaves gross_entitlement_value_cents, but the contract value is no longer recomputed after termination"
          - "cascade continues to this entitlement's SCHEDULED bookings"
      - from: PARTIAL
        to: WAIVED
        trigger: "system cascade from POST /contracts/{id}/terminate"
        actor: system
        preconditions:
          - "owning contract moves to TERMINATED"
        side_effects:
          - "cascade continues to this entitlement's SCHEDULED bookings"

  - entity: AssetBooking
    initial_state: SCHEDULED
    terminal_states: [DELIVERED, CANCELLED, PREEMPTED]
    shape_note: "Branching fork with three exits whose side-effect sets differ."
    transitions:
      - from: SCHEDULED
        to: DELIVERED
        trigger: "POST /asset-bookings/{id}/deliver"
        actor: ActivationManager
        preconditions:
          - "the owning entitlement's contract.status is ACTIVE, else ERR_CONTRACT_NOT_ACTIVE"
          - "logical clock current_utc >= booking.window_end, else ERR_DELIVERY_WINDOW_OPEN"
          - "when the asset has requires_staffing true, the number of this booking's StaffAssignments with status CHECKED_IN is >= asset.min_staff_count, else ERR_STAFFING_INCOMPLETE"
        side_effects:
          - "booking.status = DELIVERED and delivered_at = current_utc"
          - "this booking's StaffAssignments still ASSIGNED become NO_SHOW; those CHECKED_IN become RELEASED; both lower staff_member.scheduled_minutes"
          - "inventory_asset.reserved_units_total drops by units_booked and InventoryAsset.version increments by 1"
          - "cascade hop 1: the owning Entitlement recomputes delivered_units, delivery_pct and status via delivery_rollup"
          - "cascade hop 2: that entitlement status change recomputes the owning Contract's fulfillment_status and delivered_media_value_cents"
          - "cascade hop 3: that contract value change recomputes property.delivered_media_value_cents via property_inventory_rollup and increments Property.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /asset-bookings/{id}/cancel"
        actor: ActivationManager
        preconditions:
          - "the owning entitlement's contract.status is COUNTERSIGNED or ACTIVE, else ERR_CONTRACT_NOT_ACTIVE"
        side_effects:
          - "booking.status = CANCELLED"
          - "inventory_asset.reserved_units_total drops by units_booked, restoring the value it held before the booking was created, and InventoryAsset.version increments by 1"
          - "this booking's ASSIGNED or CHECKED_IN StaffAssignments become RELEASED and staff_member.scheduled_minutes drops accordingly"
          - "no entitlement or contract value changes, because a SCHEDULED booking never contributed to delivered_units"
      - from: SCHEDULED
        to: PREEMPTED
        trigger: "system cascade from POST /contracts/{id}/terminate"
        actor: system
        preconditions:
          - "the booking's entitlement moved to WAIVED in the same cascade"
        side_effects:
          - "booking.status = PREEMPTED"
          - "inventory_asset.reserved_units_total drops by units_booked and InventoryAsset.version increments by 1"
          - "this booking's ASSIGNED or CHECKED_IN StaffAssignments become RELEASED"
      - from: any
        to: any
        trigger: "deliver or cancel on a booking whose status is DELIVERED, CANCELLED or PREEMPTED"
        actor: ActivationManager
        preconditions: ["rejected unconditionally"]
        side_effects: []
        note: "Rejected with ERR_INVALID_STATE (409)."

  - entity: ProofOfPerformance
    initial_state: SUBMITTED
    terminal_states: [VERIFIED, REJECTED]
    shape_note: "Branching fork whose two exits carry disjoint side-effect sets."
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /proofs/{id}/adjudicate with decision=VERIFIED"
        actor: PerformanceAuditor
        preconditions:
          - "X-User-ID differs from proof.captured_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "the owning booking's status is DELIVERED, else ERR_INVALID_STATE"
        side_effects:
          - "proof.status = VERIFIED and adjudicated_by_user_id = X-User-ID"
          - "booking.verified_impressions increases by measured_value when evidence_type is IMPRESSIONS or SOCIAL"
          - "booking.proof_state becomes VERIFIED unless a REJECTED proof already made it DEFICIENT"
          - "no change to delivered_units, because a non-DEFICIENT delivered booking already counted"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /proofs/{id}/adjudicate with decision=REJECTED"
        actor: PerformanceAuditor
        preconditions:
          - "X-User-ID differs from proof.captured_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "the owning booking's status is DELIVERED, else ERR_INVALID_STATE"
          - "reject_reason is present, else ERR_VALIDATION_FAILED"
        side_effects:
          - "proof.status = REJECTED, adjudicated_by_user_id = X-User-ID and reject_reason stored"
          - "cascade hop 1: booking.proof_state = DEFICIENT (rejection dominates any VERIFIED sibling proof and is not reversible)"
          - "cascade hop 2: that booking's units leave the owning Entitlement's delivered_units, so delivery_pct and status are recomputed downward by delivery_rollup"
          - "cascade hop 3: the owning Contract recomputes fulfillment_status and delivered_media_value_cents"
          - "cascade hop 4: property.delivered_media_value_cents recomputed and Property.version incremented by 1"
      - from: any
        to: any
        trigger: "POST /proofs/{id}/adjudicate on a proof whose status is VERIFIED or REJECTED"
        actor: PerformanceAuditor
        preconditions: ["rejected unconditionally"]
        side_effects: []
        note: "Rejected with ERR_INVALID_STATE (409)."

  - entity: StaffAssignment
    initial_state: ASSIGNED
    terminal_states: [NO_SHOW, RELEASED]
    transitions:
      - from: ASSIGNED
        to: CHECKED_IN
        trigger: "POST /staff-assignments/{id}/check-in"
        actor: ActivationManager
        preconditions:
          - "the owning booking's status is SCHEDULED, else ERR_INVALID_STATE"
          - "logical clock current_utc >= assignment.shift_start, else ERR_SHIFT_NOT_STARTED"
        side_effects:
          - "assignment.status = CHECKED_IN"
      - from: ASSIGNED
        to: NO_SHOW
        trigger: "system cascade from POST /asset-bookings/{id}/deliver"
        actor: system
        preconditions:
          - "the assignment is still ASSIGNED when its booking is delivered"
        side_effects:
          - "assignment.status = NO_SHOW"
          - "staff_member.scheduled_minutes drops by the shift length in whole minutes"
      - from: CHECKED_IN
        to: RELEASED
        trigger: "system cascade from POST /asset-bookings/{id}/deliver, /cancel, or the termination preemption cascade"
        actor: system
        preconditions: []
        side_effects:
          - "assignment.status = RELEASED"
          - "staff_member.scheduled_minutes drops by the shift length in whole minutes"
      - from: ASSIGNED
        to: RELEASED
        trigger: "system cascade from POST /asset-bookings/{id}/cancel or the termination preemption cascade"
        actor: system
        preconditions: []
        side_effects:
          - "assignment.status = RELEASED"
          - "staff_member.scheduled_minutes drops by the shift length in whole minutes"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on a parent entity's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: booking-create-stale-asset
    parent_entity: InventoryAsset
    write_endpoint: "POST /asset-bookings"
    occ_field: "expected_inventory_asset_version"
    description: |
      Creating an AssetBooking against an InventoryAsset whose version has advanced since
      the client last read it is rejected. The stale writer's view of remaining capacity,
      of the buffer neighbourhood and of reserved_units_total predates an earlier accepted
      booking, cancellation or delivery on the same asset, so the request is refused even
      when the residual capacity would still admit the units.
    error_id: ERR_ASSET_VERSION_STALE
    http_status: 412

  - rule_id: countersign-stale-property
    parent_entity: Property
    write_endpoint: "POST /contracts/{id}/countersign"
    occ_field: "expected_property_version"
    description: |
      Countersigning a Contract against a Property whose version has advanced since the
      approver last read it is rejected. A newer rate card may have been published (which
      supersedes the card this countersign would pin) or another countersign may have moved
      committed_gross_value_cents, so the approver's pricing view is stale.
    error_id: ERR_PROPERTY_VERSION_STALE
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: entitlement_unit_valuation
    trigger: "POST /contracts/{id}/countersign, once per Entitlement of the contract, before contract_value_rollup"
    algorithm: tiered_pricing
    formula: |
      line = the RateCardLine of the pinned rate card whose asset_class == entitlement.asset_class
             (exactly one exists; ERR_RATE_LINE_MISSING otherwise)
      unit_price = line.base_unit_price_cents
      for tb in line.tier_breaks sorted by tb.min_units ASC:
          if entitlement.promised_units >= tb.min_units:      # inclusive boundary
              unit_price = tb.unit_price_cents
      excl = line.exclusivity_multiplier if contract.exclusivity_scope == "CATEGORY" else 1.00
      # rounding order is pinned: round the per-unit value FIRST, then multiply
      entitlement.unit_value_cents  = round_half_up(unit_price * property.seasonality_index * excl)
      entitlement.gross_value_cents = entitlement.unit_value_cents * entitlement.promised_units
    input_set: "Every Entitlement of the contract regardless of status (no entitlement can be WAIVED before countersign)"
    constants:
      TIER_BOUNDARY_OPERATOR: ">="
    precision: "integer cents, round_half_up on the per-unit value only; the multiplication by promised_units is exact"
    note: "Three interacting inputs (volume tier, seasonality index, exclusivity multiplier) with a conditional branch on contract.exclusivity_scope."

  - name: contract_value_rollup
    trigger: "POST /contracts/{id}/countersign (CONSERVATIVE in-kind variant) and POST /contracts/{id}/close (AUDITED in-kind variant)"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is pinned and MUST be followed exactly; the dependency looks
      # circular (discount -> cash -> in-kind cap -> total) but is not, because the
      # discount tier is keyed on the PRE-DISCOUNT, CASH-ONLY gross and never on the total.
      step 1: gross_entitlement_value_cents = sum(e.gross_value_cents
                  for e in contract.entitlements if e.status != "WAIVED")
      step 2: volume_discount_pct = VOLUME_DISCOUNT_TIERS applied to gross_entitlement_value_cents:
                  gross >= 5000000 -> 0.12
                  gross >= 2500000 -> 0.08
                  gross >= 1000000 -> 0.04
                  otherwise        -> 0.00
      step 3: cash_value_cents = gross_entitlement_value_cents
                                 - round_half_up(gross_entitlement_value_cents * volume_discount_pct)
      step 4: in_kind_recognized_value_cents = in_kind_recognized_valuation(contract, variant)
      step 5: total_recognized_value_cents = cash_value_cents + in_kind_recognized_value_cents
    input_set: "Entitlements of the contract whose status is not WAIVED; the in-kind leg comes from contract.in_kind_declared_value_cents and in_kind_category"
    constants:
      VOLUME_DISCOUNT_TIERS: "[[5000000, 0.12], [2500000, 0.08], [1000000, 0.04]]"
      TIER_BOUNDARY_OPERATOR: ">="
    precision: "integer cents, round_half_up on the discount amount; volume_discount_pct stored with 2 decimals"
    note: "Never key volume_discount_pct on total_recognized_value_cents, even though that is the headline contract value."

  - name: in_kind_recognized_valuation
    trigger: "step 4 of contract_value_rollup"
    algorithm: threshold
    formula: |
      haircut = IN_KIND_HAIRCUT[contract.in_kind_category]
      cap     = round_half_up(cash_value_cents * IN_KIND_CAP_PCT)
      declared = contract.in_kind_declared_value_cents
      # CONSERVATIVE: haircut first, then cap
      conservative = min(round_half_up(declared * (1 - haircut)), cap)
      # AUDITED: cap first, then haircut
      audited      = round_half_up(min(declared, cap) * (1 - haircut))
    input_set: "The contract's own declared in-kind value and category, plus cash_value_cents from step 3"
    constants:
      IN_KIND_CAP_PCT: 0.25
      IN_KIND_HAIRCUT: "{MEDIA_TRADE: 0.50, PRODUCT: 0.35, SERVICES: 0.40, TICKETS: 0.20}"
    precision: "integer cents, round_half_up"
    variants:
      - name: CONSERVATIVE
        when: "POST /contracts/{id}/countersign — the value booked into committed inventory at signature"
        difference: "Applies the category haircut to the declared value first and caps the haircut result; the cap therefore bites on an already-discounted number."
      - name: AUDITED
        when: "POST /contracts/{id}/close — the value recognized after post-season audit"
        difference: "Caps the raw declared value first and applies the haircut to the capped number, which is strictly lower than CONSERVATIVE whenever the cap binds."
    note: "Dual-variant instance on the Contract money domain: identical inputs, two orderings, different cents."

  - name: delivery_rollup
    trigger: "system cascade from POST /asset-bookings/{id}/deliver and from POST /proofs/{id}/adjudicate with decision=REJECTED"
    algorithm: aggregation
    formula: |
      # per entitlement
      delivered_units = sum(b.units_booked
                            for b in AssetBooking
                            where b.entitlement_id == e.id
                              and b.status == "DELIVERED"
                              and b.proof_state != "DEFICIENT")
      delivery_pct = round_half_up(100 * delivered_units / e.promised_units, 2)
      if e.status == "WAIVED": keep WAIVED
      elif delivered_units == 0: e.status = "PENDING"
      elif delivered_units < e.promised_units: e.status = "PARTIAL"
      else: e.status = "FULFILLED"
      # per contract (only while contract.status is COUNTERSIGNED or ACTIVE)
      if contract has zero entitlements: fulfillment_status = "FULFILLED"
      elif every entitlement is FULFILLED or WAIVED: fulfillment_status = "FULFILLED"
      elif every entitlement is PENDING or WAIVED: fulfillment_status = "NOT_STARTED"
      else: fulfillment_status = "IN_PROGRESS"
      delivered_media_value_cents = sum(b.units_booked * entitlement_of(b).unit_value_cents
                                        for b in the contract's bookings
                                        where b.status == "DELIVERED"
                                          and b.proof_state != "DEFICIENT")
    input_set: "AssetBookings with status DELIVERED and proof_state in {NONE, PENDING_REVIEW, VERIFIED}; SCHEDULED, CANCELLED and PREEMPTED bookings are excluded, as are DEFICIENT ones"
    constants: {}
    precision: "delivery_pct 2 decimal places, round_half_up; values in integer cents"

  - name: makegood_credit_allocation
    trigger: "POST /contracts/{id}/close, after in_kind_recognized_valuation(AUDITED) and before entitlement statuses are frozen"
    algorithm: waterfall_allocation
    formula: |
      shortfall_value(e) = max(0, e.promised_units - e.delivered_units) * e.unit_value_cents
                           for every entitlement whose status is not WAIVED
      total_shortfall = sum(shortfall_value(e))
      credit_pool = min(total_shortfall, floor(contract.cash_value_cents * MAX_MAKEGOOD_PCT))
      if total_shortfall == 0: every makegood_credit_cents = 0 and contract.makegood_credit_cents = 0
      order = entitlements with shortfall_value > 0 sorted by shortfall_value DESC,
              ties broken by created_at ASC (never by id)
      # rounding order is pinned: floor EACH share first, then hand the whole remainder
      # to the first bucket. Summing first and rounding once is NOT equivalent.
      for e in order:
          e.makegood_credit_cents = floor(credit_pool * shortfall_value(e) / total_shortfall)
      remainder = credit_pool - sum(e.makegood_credit_cents for e in order)
      order[0].makegood_credit_cents += remainder
      contract.makegood_credit_cents = credit_pool
    input_set: "Entitlements of the closing contract whose status is not WAIVED, evaluated after the final delivery rollup"
    constants:
      MAX_MAKEGOOD_PCT: 0.15
    precision: "integer cents; per-bucket floor then remainder to the highest-shortfall bucket"

  - name: renewal_likelihood_scoring
    trigger: "POST /contracts/{id}/close and POST /contracts/{id}/surveys, recomputed for the contract's sponsor"
    algorithm: weighted_scoring
    formula: |
      target = the sponsor's Contract with status CLOSED and the greatest term_end,
               ties broken by created_at ASC (never by id); if none, score stays 0.00 / LOW
      promised = sum(e.promised_units for e in target.entitlements if e.status != "WAIVED")
      delivered = sum(e.delivered_units for e in target.entitlements if e.status != "WAIVED")
      delivery_factor = 100.00 if promised == 0 else round_half_up(100 * delivered / promised, 2)
      penalty = 0.00 if target.cash_value_cents == 0
                else round_half_up(100 * target.makegood_credit_cents / target.cash_value_cents, 2)
      reliability = 100 - min(100, penalty)
      surveys = SponsorSurveys of target
      survey_composite = round_half_up(mean(s.composite_score for s in surveys), 2)   # only when surveys is non-empty
      where composite_score(s) = clamp(
              round_half_up((s.satisfaction_score * 0.40
                             + s.activation_quality_score * 0.35
                             + s.reporting_quality_score * 0.25) * 10, 2)
              + INTENT_ADJUSTMENT[s.renewal_intent], 0, 100)
      raw = 0.50 * survey_composite + 0.35 * delivery_factor + 0.15 * reliability   # SURVEY_WEIGHTED
      raw = 0.75 * delivery_factor + 0.25 * reliability                             # DELIVERY_ONLY
      sponsor.renewal_likelihood_score = round_half_up(clamp(raw, 0, 100), 2)
      sponsor.renewal_band = "HIGH" if score >= 70 else "MEDIUM" if score >= 40 else "LOW"
    input_set: "The sponsor's most recently ending CLOSED contract, its non-WAIVED entitlements, and all SponsorSurveys filed against that contract"
    constants:
      INTENT_ADJUSTMENT: "{YES: 10, MAYBE: 0, NO: -15}"
      BAND_HIGH_MIN: 70
      BAND_MEDIUM_MIN: 40
    precision: "2 decimal places, round_half_up; bands use >= comparisons"
    variants:
      - name: SURVEY_WEIGHTED
        when: "at least one SponsorSurvey exists for the target contract"
        difference: "Survey composite carries half the weight and delivery only 35%, so identical delivery data scores differently than DELIVERY_ONLY."
      - name: DELIVERY_ONLY
        when: "the target contract has no SponsorSurvey"
        difference: "Delivery carries 75% and reliability 25%; the survey term is absent rather than treated as zero."
    note: "Dual-variant instance on the Sponsor scoring domain — a different entity and a different unit (points, not cents) than in_kind_recognized_valuation."

  - name: roi_roo_report
    trigger: "GET /contracts/{id}/roi-report (read-only projection; persists nothing)"
    algorithm: projection
    formula: |
      basis = request basis, default "VERIFIED"
      counted_bookings = bookings of the contract with status DELIVERED and
          proof_state == "VERIFIED"                                   if basis == "VERIFIED"
          proof_state in {"NONE", "PENDING_REVIEW", "VERIFIED"}       if basis == "GROSS"
      media_value_cents = sum(b.units_booked * entitlement_of(b).unit_value_cents
                              for b in counted_bookings)
      counted_proofs = proofs of the contract's bookings with evidence_type in {IMPRESSIONS, SOCIAL} and
          status == "VERIFIED"                     if basis == "VERIFIED"
          status in {"SUBMITTED", "VERIFIED"}      if basis == "GROSS"
      impressions_total = sum(p.measured_value for p in counted_proofs)
      roi_ratio = 0.0 if contract.total_recognized_value_cents == 0
                  else round_half_up(media_value_cents / contract.total_recognized_value_cents, 4)
      promised = sum(e.promised_units for e in contract.entitlements if e.status != "WAIVED")
      delivered_capped = sum(min(e.delivered_units, e.promised_units)
                             for e in contract.entitlements if e.status != "WAIVED")
      roo_attainment_pct = 100.00 if promised == 0
                           else round_half_up(100 * delivered_capped / promised, 2)
      cost_per_thousand_impressions_cents = null if impressions_total == 0
          else round_half_up(contract.total_recognized_value_cents / (impressions_total / 1000), 2)
    input_set: "Only the contract's own bookings and their proofs; CANCELLED and PREEMPTED bookings never count under either basis"
    constants: {}
    precision: "roi_ratio 4 decimal places, percentages and CPM 2 decimal places, all round_half_up"
    variants:
      - name: VERIFIED
        when: "basis omitted or basis=VERIFIED"
        difference: "Only adjudicated evidence counts, so a delivered booking with no proof contributes zero media value."
      - name: GROSS
        when: "basis=GROSS"
        difference: "Unadjudicated evidence counts too, so the same delivered inventory yields a higher impressions_total and a lower CPM."

  - name: property_inventory_rollup
    trigger: "system cascade from countersign, terminate, close and from every delivery or proof-rejection that changes a contract's delivered_media_value_cents"
    algorithm: aggregation
    formula: |
      committed_gross_value_cents = sum(c.total_recognized_value_cents
                                        for c in property.contracts
                                        if c.status in {"COUNTERSIGNED", "ACTIVE"})
      delivered_media_value_cents = sum(c.delivered_media_value_cents
                                        for c in property.contracts
                                        if c.status in {"ACTIVE", "CLOSED"})
      sellout_pct = 0.00 if property.inventory_target_value_cents == 0
                    else round_half_up(100 * committed_gross_value_cents
                                       / property.inventory_target_value_cents, 2)
    input_set: "Contracts of the property filtered by the explicit status sets above; DRAFT, SUBMITTED and TERMINATED contracts never contribute"
    constants:
      OVERSELL_ALLOWANCE: 1.10
    precision: "integer cents; sellout_pct 2 decimal places, round_half_up"
    note: "Every write of these fields increments Property.version by 1, which is exactly what makes a previously captured expected_property_version stale."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the caller's role appears in the endpoint's roles list in §1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "every id in the request path resolves, validated left to right"
    error_id: ERR_PROPERTY_NOT_FOUND | ERR_RATE_CARD_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_INVENTORY_ASSET_NOT_FOUND | ERR_SPONSOR_NOT_FOUND | ERR_ENTITLEMENT_NOT_FOUND | ERR_BOOKING_NOT_FOUND | ERR_PROOF_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 4
    category: auth
    check: "when the caller's role is SponsorContact, X-User-ID equals the sponsor_id of the contract in the path (or of every contract in a filtered list result)"
    error_id: ERR_SPONSOR_SCOPE_VIOLATION
    http_status: 403
    applies_to: "GET /contracts/{id}, GET /contracts, GET /contracts/{id}/roi-report, GET /contracts/{id}/surveys, POST /contracts/{id}/surveys"

  - priority: 5
    category: business_constraint
    check: "request body carries every required field with the declared type, enum membership and numeric range; unknown fields are ignored; measured_value must be 0 when evidence_type is PHOTO; reject_reason is required when decision is REJECTED; season_end > season_start; limit within 1..100 and offset >= 0"
    error_id: ERR_VALIDATION_FAILED
    http_status: 422
    applies_to: "all write endpoints and all paginated list endpoints"

  - priority: 6
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row"
    error_id: ERR_SPONSOR_NOT_FOUND | ERR_PROPERTY_NOT_FOUND | ERR_INVENTORY_ASSET_NOT_FOUND | ERR_ENTITLEMENT_NOT_FOUND | ERR_STAFF_MEMBER_NOT_FOUND
    http_status: 404
    applies_to: "POST /contracts, POST /contracts/{id}/entitlements, POST /asset-bookings, POST /asset-bookings/{id}/assignments"

  - priority: 7
    category: state
    check: "the target resource is in a state from which the requested transition is declared in §1.2; additionally a SponsorSurvey may only be filed against a contract whose status is ACTIVE or CLOSED, and a rate-card line may only be added while the card is DRAFT, and an entitlement may only be added while the contract is DRAFT"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 8
    category: state
    check: "cross-entity state guards hold — property.status is SELLING or IN_SEASON for contract submit (ERR_PROPERTY_NOT_SELLING); property.status is IN_SEASON for contract activate (ERR_PROPERTY_NOT_SELLING); the property has a PUBLISHED rate card for SELLING transition and countersign (ERR_NO_PUBLISHED_RATE_CARD); the entitlement's contract is ACTIVE for booking create and deliver and COUNTERSIGNED or ACTIVE for booking cancel (ERR_CONTRACT_NOT_ACTIVE); inventory_asset.status is AVAILABLE for booking create (ERR_ASSET_UNAVAILABLE); staff_member.status is ACTIVE for assignment create (ERR_STAFF_INACTIVE); the property has no COUNTERSIGNED or ACTIVE contract for the CLOSED transition (ERR_OPEN_CONTRACTS)"
    error_id: ERR_PROPERTY_NOT_SELLING | ERR_NO_PUBLISHED_RATE_CARD | ERR_CONTRACT_NOT_ACTIVE | ERR_ASSET_UNAVAILABLE | ERR_STAFF_INACTIVE | ERR_OPEN_CONTRACTS
    http_status: 409
    applies_to: "POST /properties/{id}/transition, POST /contracts/{id}/submit, POST /contracts/{id}/countersign, POST /contracts/{id}/activate, POST /asset-bookings, POST /asset-bookings/{id}/cancel, POST /asset-bookings/{id}/deliver, POST /asset-bookings/{id}/assignments"

  - priority: 9
    category: business_temporal
    check: "logical-clock gates hold — current_utc >= season_start for IN_SEASON (ERR_SEASON_NOT_STARTED); current_utc >= term_start for activate (ERR_TERM_NOT_STARTED); current_utc >= term_end for close (ERR_TERM_NOT_ENDED); current_utc >= window_end for deliver (ERR_DELIVERY_WINDOW_OPEN); current_utc >= shift_start for check-in (ERR_SHIFT_NOT_STARTED)"
    error_id: ERR_SEASON_NOT_STARTED | ERR_TERM_NOT_STARTED | ERR_TERM_NOT_ENDED | ERR_DELIVERY_WINDOW_OPEN | ERR_SHIFT_NOT_STARTED
    http_status: 409
    applies_to: "POST /properties/{id}/transition, POST /contracts/{id}/activate, POST /contracts/{id}/close, POST /asset-bookings/{id}/deliver, POST /staff-assignments/{id}/check-in"

  - priority: 10
    category: business_constraint
    check: "the OCC field matches the parent's current version — expected_inventory_asset_version equals inventory_asset.version on booking create; expected_property_version equals property.version on countersign"
    error_id: ERR_ASSET_VERSION_STALE | ERR_PROPERTY_VERSION_STALE
    http_status: 412
    applies_to: "POST /asset-bookings, POST /contracts/{id}/countersign"

  - priority: 11
    category: business_safety
    check: "segregation of duties — X-User-ID differs from contract.submitted_by_user_id on countersign, and differs from proof.captured_by_user_id on adjudicate"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /contracts/{id}/countersign, POST /proofs/{id}/adjudicate"

  - priority: 12
    category: business_safety
    check: "category exclusivity — at countersign, no other Contract of the same property with status COUNTERSIGNED or ACTIVE both shares the sponsor's category and either holds exclusivity_scope CATEGORY or faces a countersigning contract that holds it"
    error_id: ERR_CATEGORY_EXCLUSIVITY_CONFLICT
    http_status: 409
    applies_to: "POST /contracts/{id}/countersign"

  - priority: 13
    category: business_referential
    check: "referential coherence — booking.inventory_asset_id equals the entitlement's inventory_asset_id (ERR_ASSET_MISMATCH); the pinned rate card carries a line for every distinct entitlement asset_class (ERR_RATE_LINE_MISSING)"
    error_id: ERR_ASSET_MISMATCH | ERR_RATE_LINE_MISSING
    http_status: 409
    applies_to: "POST /asset-bookings, POST /contracts/{id}/countersign"

  - priority: 14
    category: business_temporal
    check: "interval bounds — window_end > window_start and shift_end > shift_start (ERR_INVALID_WINDOW, 422); the booking window lies inside [contract.term_start, contract.term_end] and the shift lies inside [booking.window_start, booking.window_end] (ERR_WINDOW_OUTSIDE_TERM, 409)"
    error_id: ERR_INVALID_WINDOW | ERR_WINDOW_OUTSIDE_TERM
    http_status: 422
    applies_to: "POST /asset-bookings, POST /asset-bookings/{id}/assignments"

  - priority: 15
    category: business_temporal
    check: "asset changeover buffer — for every existing booking e on the same asset with status SCHEDULED or DELIVERED that does NOT intersect the new half-open window [start, end) and whose entitlement belongs to a different contract, the idle gap must satisfy gap >= asset.changeover_buffer_minutes, where gap = new.window_start - e.window_end when the new window follows e, or e.window_start - new.window_end when it precedes e (ERR_BOOKING_WINDOW_CONFLICT). Staff shifts use different geometry — intervals are CLOSED, so touching endpoints collide (new.shift_start <= e.shift_end and e.shift_start <= new.shift_end), and non-touching shifts of the same staff member must be separated by MIN_REST_MINUTES = 45 (ERR_STAFF_SHIFT_CONFLICT), evaluated only against that member's ASSIGNED or CHECKED_IN assignments"
    error_id: ERR_BOOKING_WINDOW_CONFLICT | ERR_STAFF_SHIFT_CONFLICT
    http_status: 409
    applies_to: "POST /asset-bookings, POST /asset-bookings/{id}/assignments"

  - priority: 16
    category: business_constraint
    check: "capacity and completeness — sum of units_booked over SCHEDULED or DELIVERED bookings whose half-open window intersects the new one, plus the new units_booked, must be <= asset.capacity_units (ERR_ASSET_CAPACITY_EXCEEDED); a booking on an asset with requires_staffing true needs at least min_staff_count CHECKED_IN assignments before delivery (ERR_STAFFING_INCOMPLETE); clause_ref is unique within a contract (ERR_DUPLICATE_CLAUSE_REF); asset_class is unique within a rate card (ERR_DUPLICATE_RATE_LINE); a contract needs >= 1 entitlement to be submitted (ERR_NO_ENTITLEMENTS); revision_round <= 3 on submit (ERR_REVISION_LIMIT_REACHED); no SCHEDULED booking may remain at close (ERR_OPEN_BOOKINGS)"
    error_id: ERR_ASSET_CAPACITY_EXCEEDED | ERR_STAFFING_INCOMPLETE | ERR_DUPLICATE_CLAUSE_REF | ERR_DUPLICATE_RATE_LINE | ERR_NO_ENTITLEMENTS | ERR_REVISION_LIMIT_REACHED | ERR_OPEN_BOOKINGS
    http_status: 409
    applies_to: "POST /asset-bookings, POST /asset-bookings/{id}/deliver, POST /contracts/{id}/entitlements, POST /rate-cards/{id}/lines, POST /contracts/{id}/submit, POST /contracts/{id}/close"

  - priority: 17
    category: business_fiscal
    check: "oversell ceiling — property.committed_gross_value_cents + the countersigning contract's total_recognized_value_cents must be <= round_half_up(property.inventory_target_value_cents * OVERSELL_ALLOWANCE) with OVERSELL_ALLOWANCE = 1.10"
    error_id: ERR_INVENTORY_VALUE_EXCEEDED
    http_status: 409
    applies_to: "POST /contracts/{id}/countersign"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Property -------------------------------------------------------------
  - method: POST
    path: "/properties"
    description: "Register a sports property and its season envelope"
    roles: [PropertyAdmin]
    code: 201
    input: [name, sport_code, season_year, season_start, season_end, inventory_target_value_cents, "seasonality_index?"]
    output: Property
    side_effects: ["status = PLANNING", "committed_gross_value_cents = 0", "delivered_media_value_cents = 0", "sellout_pct = 0.00", "version = 1"]

  - method: GET
    path: "/properties/{id}"
    description: "Read one property including its committed/delivered rollups and current version"
    roles: [PropertyAdmin, SponsorshipSeller, ContractApprover, ActivationManager, PerformanceAuditor]
    code: 200
    input: []
    output: Property
    side_effects: []

  - method: POST
    path: "/properties/{id}/transition"
    description: "Advance the property along PLANNING -> SELLING -> IN_SEASON -> CLOSED"
    roles: [PropertyAdmin]
    code: 200
    input: [to_status]
    output: Property
    side_effects: ["property.status updated", "increments Property.version by 1"]

  # ---- Rate cards -----------------------------------------------------------
  - method: POST
    path: "/properties/{id}/rate-cards"
    description: "Open a new DRAFT rate card for the property"
    roles: [PropertyAdmin]
    code: 201
    input: [label, effective_year]
    output: RateCard
    side_effects: ["status = DRAFT", "line_count = 0"]

  - method: GET
    path: "/rate-cards/{id}"
    description: "Read one rate card"
    roles: [PropertyAdmin, SponsorshipSeller, ContractApprover]
    code: 200
    input: []
    output: RateCard
    side_effects: []

  - method: GET
    path: "/rate-cards"
    description: "List rate cards, filtered by property, by status, or by the card that superseded them"
    roles: [PropertyAdmin, SponsorshipSeller, ContractApprover]
    code: 200
    input: ["property_id?", "status?", "superseded_by_rate_card_id?", "limit?", "offset?"]
    output: RateCard[]
    side_effects: []

  - method: POST
    path: "/rate-cards/{id}/lines"
    description: "Add a priced line for one asset class to a DRAFT card"
    roles: [PropertyAdmin]
    code: 201
    input: [asset_class, base_unit_price_cents, "tier_breaks?", "exclusivity_multiplier?"]
    output: RateCardLine
    side_effects: ["rate_card.line_count increases by 1", "increments RateCard.version by 1"]

  - method: GET
    path: "/rate-cards/{id}/lines"
    description: "List the priced lines of one rate card"
    roles: [PropertyAdmin, SponsorshipSeller, ContractApprover]
    code: 200
    input: []
    output: RateCardLine[]
    side_effects: []

  - method: POST
    path: "/rate-cards/{id}/publish"
    description: "Publish a DRAFT card and supersede the property's previously published card"
    roles: [PropertyAdmin]
    code: 200
    input: []
    output: RateCard
    side_effects: ["status = PUBLISHED", "published_at = current_utc", "previous PUBLISHED card of the property becomes SUPERSEDED with superseded_by_rate_card_id set", "increments Property.version by 1"]

  # ---- Inventory assets -----------------------------------------------------
  - method: POST
    path: "/properties/{id}/inventory-assets"
    description: "Create a sellable inventory asset under the property"
    roles: [PropertyAdmin]
    code: 201
    input: [name, asset_class, capacity_units, "changeover_buffer_minutes?", "requires_staffing?", "min_staff_count?", "status?"]
    output: InventoryAsset
    side_effects: ["reserved_units_total = 0", "version = 1"]

  - method: GET
    path: "/inventory-assets/{id}"
    description: "Read one inventory asset including reserved_units_total and version"
    roles: [PropertyAdmin, SponsorshipSeller, ContractApprover, ActivationManager, PerformanceAuditor]
    code: 200
    input: []
    output: InventoryAsset
    side_effects: []

  - method: GET
    path: "/inventory-assets"
    description: "List inventory assets, filtered by property, class or availability"
    roles: [PropertyAdmin, SponsorshipSeller, ContractApprover, ActivationManager]
    code: 200
    input: ["property_id?", "asset_class?", "status?", "limit?", "offset?"]
    output: InventoryAsset[]
    side_effects: []

  # ---- Sponsors -------------------------------------------------------------
  - method: POST
    path: "/sponsors"
    description: "Register a sponsor brand"
    roles: [SponsorshipSeller]
    code: 201
    input: [name, category, contact_email]
    output: Sponsor
    side_effects: ["status = PROSPECT", "renewal_likelihood_score = 0.00", "renewal_band = LOW"]

  - method: GET
    path: "/sponsors/{id}"
    description: "Read one sponsor including renewal scoring"
    roles: [PropertyAdmin, SponsorshipSeller, ContractApprover, PerformanceAuditor]
    code: 200
    input: []
    output: Sponsor
    side_effects: []

  # ---- Contracts ------------------------------------------------------------
  - method: POST
    path: "/contracts"
    description: "Draft a sponsorship contract between a sponsor and a property"
    roles: [SponsorshipSeller]
    code: 201
    input: [sponsor_id, property_id, term_start, term_end, "exclusivity_scope?", "in_kind_declared_value_cents?", "in_kind_category?"]
    output: Contract
    side_effects: ["status = DRAFT", "fulfillment_status = NOT_STARTED", "revision_round = 0", "all money fields = 0"]

  - method: GET
    path: "/contracts/{id}"
    description: "Read one contract with both state dimensions and every money field"
    roles: [PropertyAdmin, SponsorshipSeller, ContractApprover, ActivationManager, PerformanceAuditor, SponsorContact]
    code: 200
    input: []
    output: Contract
    side_effects: []

  - method: GET
    path: "/contracts"
    description: "List contracts, filtered by sponsor, property, pinned rate card or status"
    roles: [PropertyAdmin, SponsorshipSeller, ContractApprover, PerformanceAuditor, SponsorContact]
    code: 200
    input: ["sponsor_id?", "property_id?", "rate_card_id?", "status?", "limit?", "offset?"]
    output: Contract[]
    side_effects: []

  - method: POST
    path: "/contracts/{id}/entitlements"
    description: "Add a clause-level entitlement to a DRAFT contract"
    roles: [SponsorshipSeller]
    code: 201
    input: [inventory_asset_id, clause_ref, promised_units]
    output: Entitlement
    side_effects: ["asset_class copied from the linked asset", "status = PENDING", "unit_value_cents = 0 until countersign"]

  - method: GET
    path: "/entitlements/{id}"
    description: "Read one entitlement including delivery rollups"
    roles: [PropertyAdmin, SponsorshipSeller, ContractApprover, ActivationManager, PerformanceAuditor]
    code: 200
    input: []
    output: Entitlement
    side_effects: []

  - method: GET
    path: "/entitlements"
    description: "List entitlements, filtered by contract, by asset or by delivery status"
    roles: [PropertyAdmin, SponsorshipSeller, ContractApprover, ActivationManager, PerformanceAuditor]
    code: 200
    input: ["contract_id?", "inventory_asset_id?", "status?", "limit?", "offset?"]
    output: Entitlement[]
    side_effects: []

  - method: POST
    path: "/contracts/{id}/submit"
    description: "Submit a DRAFT contract for approval"
    roles: [SponsorshipSeller]
    code: 200
    input: []
    output: Contract
    side_effects: ["status = SUBMITTED", "submitted_by_user_id = X-User-ID"]

  - method: POST
    path: "/contracts/{id}/return"
    description: "Return a SUBMITTED contract to DRAFT for revision"
    roles: [ContractApprover]
    code: 200
    input: ["reason?"]
    output: Contract
    side_effects: ["status = DRAFT", "revision_round increases by 1", "submitted_by_user_id cleared"]

  - method: POST
    path: "/contracts/{id}/countersign"
    description: "Countersign a SUBMITTED contract, pinning the published rate card and pricing every entitlement"
    roles: [ContractApprover]
    code: 200
    input: [expected_property_version]
    output: Contract
    side_effects: ["rate_card_id pinned", "entitlement_unit_valuation for each entitlement", "contract_value_rollup with the CONSERVATIVE in-kind variant", "status = COUNTERSIGNED", "sponsor.status = ACTIVE when PROSPECT", "property_inventory_rollup", "increments Property.version by 1"]

  - method: POST
    path: "/contracts/{id}/activate"
    description: "Activate a countersigned contract once the term has started and the property is IN_SEASON"
    roles: [ContractApprover]
    code: 200
    input: []
    output: Contract
    side_effects: ["status = ACTIVE"]

  - method: POST
    path: "/contracts/{id}/terminate"
    description: "Terminate a countersigned or active contract and unwind its inventory holds"
    roles: [ContractApprover]
    code: 200
    input: ["reason?"]
    output: Contract
    side_effects: ["status = TERMINATED", "entitlements WAIVED", "their SCHEDULED bookings PREEMPTED", "asset reserved_units_total released and InventoryAsset.version incremented", "staff assignments RELEASED", "property_inventory_rollup", "increments Property.version by 1"]

  - method: POST
    path: "/contracts/{id}/close"
    description: "Close an active contract after term end, audit the in-kind leg and allocate makegood credit"
    roles: [ContractApprover]
    code: 200
    input: []
    output: Contract
    side_effects: ["in_kind_recognized_valuation with the AUDITED variant", "makegood_credit_allocation", "undelivered entitlements SHORTFALL", "fulfillment_status finalized", "status = CLOSED", "property_inventory_rollup", "renewal_likelihood_scoring for the sponsor", "increments Property.version by 1"]

  - method: GET
    path: "/contracts/{id}/roi-report"
    description: "Computed ROI/ROO report for one contract under the VERIFIED (default) or GROSS evidence basis"
    roles: [PropertyAdmin, ContractApprover, PerformanceAuditor, SponsorContact]
    code: 200
    input: ["basis?"]
    output: { contract_id: string, basis: string, media_value_cents: integer, impressions_total: integer, roi_ratio: number, roo_attainment_pct: number, cost_per_thousand_impressions_cents: number, makegood_credit_cents: integer }
    side_effects: []

  # ---- Asset bookings -------------------------------------------------------
  - method: POST
    path: "/asset-bookings"
    description: "Schedule an occupation window of an inventory asset against an entitlement"
    roles: [ActivationManager]
    code: 201
    input: [entitlement_id, inventory_asset_id, window_start, window_end, units_booked, expected_inventory_asset_version]
    output: AssetBooking
    side_effects: ["status = SCHEDULED", "proof_state = NONE", "inventory_asset.reserved_units_total increases by units_booked", "increments InventoryAsset.version by 1"]

  - method: GET
    path: "/asset-bookings/{id}"
    description: "Read one booking including proof_state and verified_impressions"
    roles: [PropertyAdmin, ContractApprover, ActivationManager, PerformanceAuditor]
    code: 200
    input: []
    output: AssetBooking
    side_effects: []

  - method: GET
    path: "/asset-bookings"
    description: "List bookings, filtered by entitlement, asset or status"
    roles: [PropertyAdmin, ContractApprover, ActivationManager, PerformanceAuditor]
    code: 200
    input: ["entitlement_id?", "inventory_asset_id?", "status?", "limit?", "offset?"]
    output: AssetBooking[]
    side_effects: []

  - method: POST
    path: "/asset-bookings/{id}/cancel"
    description: "Cancel a scheduled booking and release its units"
    roles: [ActivationManager]
    code: 200
    input: ["reason?"]
    output: AssetBooking
    side_effects: ["status = CANCELLED", "inventory_asset.reserved_units_total decreases by units_booked", "increments InventoryAsset.version by 1", "staff assignments RELEASED"]

  - method: POST
    path: "/asset-bookings/{id}/deliver"
    description: "Mark a scheduled booking delivered once its window has closed and staffing is satisfied"
    roles: [ActivationManager]
    code: 200
    input: []
    output: AssetBooking
    side_effects: ["status = DELIVERED", "delivered_at = current_utc", "still-ASSIGNED shifts become NO_SHOW and CHECKED_IN shifts become RELEASED", "reserved_units_total released and InventoryAsset.version incremented", "delivery_rollup on the entitlement", "contract fulfillment_status and delivered_media_value_cents refreshed", "property_inventory_rollup and Property.version incremented"]

  - method: POST
    path: "/asset-bookings/{id}/proofs"
    description: "Capture a proof of performance (photo, impressions or social) against a booking"
    roles: [ActivationManager]
    code: 201
    input: [evidence_type, measured_value, "media_uri?"]
    output: ProofOfPerformance
    side_effects: ["status = SUBMITTED", "captured_by_user_id = X-User-ID", "booking.proof_state becomes PENDING_REVIEW unless already VERIFIED or DEFICIENT"]

  - method: GET
    path: "/asset-bookings/{id}/proofs"
    description: "List the proofs captured against one booking"
    roles: [PropertyAdmin, ContractApprover, ActivationManager, PerformanceAuditor]
    code: 200
    input: []
    output: ProofOfPerformance[]
    side_effects: []

  - method: POST
    path: "/proofs/{id}/adjudicate"
    description: "Verify or reject a submitted proof; rejection makes the booking deficient and unwinds its delivered value"
    roles: [PerformanceAuditor]
    code: 200
    input: [decision, "reject_reason?"]
    output: ProofOfPerformance
    side_effects: ["status = VERIFIED or REJECTED", "adjudicated_by_user_id = X-User-ID", "booking.proof_state and verified_impressions refreshed", "on REJECTED: delivery_rollup, contract and property value recomputation"]

  # ---- Staffing -------------------------------------------------------------
  - method: POST
    path: "/staff-members"
    description: "Register an activation staffer"
    roles: [ActivationManager]
    code: 201
    input: [full_name, hourly_rate_cents, "status?"]
    output: StaffMember
    side_effects: ["scheduled_minutes = 0"]

  - method: POST
    path: "/asset-bookings/{id}/assignments"
    description: "Assign a staffer to a shift inside the booking window"
    roles: [ActivationManager]
    code: 201
    input: [staff_member_id, shift_start, shift_end, role_label]
    output: StaffAssignment
    side_effects: ["status = ASSIGNED", "staff_member.scheduled_minutes increases by the shift length in whole minutes"]

  - method: GET
    path: "/staff-assignments/{id}"
    description: "Read one staff assignment"
    roles: [PropertyAdmin, ContractApprover, ActivationManager, PerformanceAuditor]
    code: 200
    input: []
    output: StaffAssignment
    side_effects: []

  - method: GET
    path: "/staff-assignments"
    description: "List staff assignments, filtered by booking, staffer or status"
    roles: [PropertyAdmin, ContractApprover, ActivationManager, PerformanceAuditor]
    code: 200
    input: ["asset_booking_id?", "staff_member_id?", "status?", "limit?", "offset?"]
    output: StaffAssignment[]
    side_effects: []

  - method: POST
    path: "/staff-assignments/{id}/check-in"
    description: "Check a staffer in for the shift once it has started"
    roles: [ActivationManager]
    code: 200
    input: []
    output: StaffAssignment
    side_effects: ["status = CHECKED_IN"]

  # ---- Survey ---------------------------------------------------------------
  - method: POST
    path: "/contracts/{id}/surveys"
    description: "File an immutable post-season sponsor survey against an active or closed contract"
    roles: [SponsorContact]
    code: 201
    input: [satisfaction_score, activation_quality_score, reporting_quality_score, renewal_intent]
    output: SponsorSurvey
    side_effects: ["composite_score computed", "submitted_by_user_id = X-User-ID", "renewal_likelihood_scoring recomputes sponsor.renewal_likelihood_score and renewal_band"]

  - method: GET
    path: "/contracts/{id}/surveys"
    description: "List the surveys filed against one contract"
    roles: [PropertyAdmin, ContractApprover, PerformanceAuditor, SponsorContact]
    code: 200
    input: []
    output: SponsorSurvey[]
    side_effects: []

  # ---- Test-driving surface (outside the public business API) ---------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time."
    roles: [PropertyAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["every subsequent clock-gated precondition is evaluated against the new instant"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the six declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the caller's role is not listed in the endpoint's roles"
  - id: ERR_SPONSOR_SCOPE_VIOLATION
    http: 403
    condition: "a SponsorContact touches a contract whose sponsor_id differs from the caller's X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the countersigner equals the submitter, or the adjudicator equals the proof capturer"
  - id: ERR_VALIDATION_FAILED
    http: 422
    condition: "missing required field, wrong type, enum value outside the declared set, numeric range breach, PHOTO evidence with a non-zero measured_value, REJECTED decision without reject_reason, publish of a card with zero lines, or limit/offset outside 1..100 / >= 0"
  - id: ERR_PROPERTY_NOT_FOUND
    http: 404
    condition: "property_id in the path or body does not resolve"
  - id: ERR_RATE_CARD_NOT_FOUND
    http: 404
    condition: "rate card id in the path does not resolve"
  - id: ERR_INVENTORY_ASSET_NOT_FOUND
    http: 404
    condition: "inventory_asset_id in the path or body does not resolve"
  - id: ERR_SPONSOR_NOT_FOUND
    http: 404
    condition: "sponsor_id in the path or body does not resolve"
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "contract id in the path does not resolve"
  - id: ERR_ENTITLEMENT_NOT_FOUND
    http: 404
    condition: "entitlement id in the path or entitlement_id in the body does not resolve"
  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "asset booking id in the path does not resolve"
  - id: ERR_PROOF_NOT_FOUND
    http: 404
    condition: "proof id in the path does not resolve"
  - id: ERR_STAFF_MEMBER_NOT_FOUND
    http: 404
    condition: "staff_member_id in the body does not resolve"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "staff assignment id in the path does not resolve"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the requested transition is not declared from the resource's current state — filing a survey against a DRAFT, SUBMITTED, COUNTERSIGNED or TERMINATED contract, adding a line to a PUBLISHED or SUPERSEDED card, adding an entitlement to a non-DRAFT contract, republishing a PUBLISHED card, submitting a SUBMITTED contract, countersigning a DRAFT contract, activating an ACTIVE contract, closing a COUNTERSIGNED contract, acting on a CLOSED or TERMINATED contract, delivering or cancelling a terminal booking, adjudicating an already adjudicated proof, checking in against a non-SCHEDULED booking, or a property transition that skips or reverses the declared order"
  - id: ERR_PROPERTY_NOT_SELLING
    http: 409
    condition: "contract submit while the property is PLANNING or CLOSED, or contract activate while the property is not IN_SEASON"
  - id: ERR_NO_PUBLISHED_RATE_CARD
    http: 409
    condition: "property transition to SELLING or contract countersign while the property has no PUBLISHED rate card"
  - id: ERR_OPEN_CONTRACTS
    http: 409
    condition: "property transition to CLOSED while a contract of the property is COUNTERSIGNED or ACTIVE"
  - id: ERR_CONTRACT_NOT_ACTIVE
    http: 409
    condition: "booking create or deliver while the owning contract is not ACTIVE, or booking cancel while it is neither COUNTERSIGNED nor ACTIVE"
  - id: ERR_ASSET_UNAVAILABLE
    http: 409
    condition: "booking create against an inventory asset whose status is MAINTENANCE or RETIRED"
  - id: ERR_STAFF_INACTIVE
    http: 409
    condition: "assignment create for a staff member whose status is INACTIVE"
  - id: ERR_SEASON_NOT_STARTED
    http: 409
    condition: "property transition to IN_SEASON while current_utc < property.season_start"
  - id: ERR_TERM_NOT_STARTED
    http: 409
    condition: "contract activate while current_utc < contract.term_start"
  - id: ERR_TERM_NOT_ENDED
    http: 409
    condition: "contract close while current_utc < contract.term_end"
  - id: ERR_DELIVERY_WINDOW_OPEN
    http: 409
    condition: "booking deliver while current_utc < booking.window_end"
  - id: ERR_SHIFT_NOT_STARTED
    http: 409
    condition: "assignment check-in while current_utc < assignment.shift_start"
  - id: ERR_ASSET_VERSION_STALE
    http: 412
    condition: "expected_inventory_asset_version differs from the asset's current version on booking create"
  - id: ERR_PROPERTY_VERSION_STALE
    http: 412
    condition: "expected_property_version differs from the property's current version on countersign"
  - id: ERR_CATEGORY_EXCLUSIVITY_CONFLICT
    http: 409
    condition: "countersign would place two contracts of the same sponsor category on one property while either of them holds CATEGORY exclusivity"
  - id: ERR_ASSET_MISMATCH
    http: 409
    condition: "booking create whose inventory_asset_id differs from the entitlement's inventory_asset_id"
  - id: ERR_RATE_LINE_MISSING
    http: 409
    condition: "countersign while the pinned rate card has no line for some entitlement's asset_class"
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "window_end <= window_start on booking create, or shift_end <= shift_start on assignment create"
  - id: ERR_WINDOW_OUTSIDE_TERM
    http: 409
    condition: "booking window falls outside the contract term, or a shift falls outside the booking window"
  - id: ERR_BOOKING_WINDOW_CONFLICT
    http: 409
    condition: "a non-intersecting booking of a different contract on the same asset sits closer than changeover_buffer_minutes"
  - id: ERR_STAFF_SHIFT_CONFLICT
    http: 409
    condition: "the staffer's new shift touches or overlaps an ASSIGNED or CHECKED_IN shift (closed intervals), or is separated from it by less than 45 minutes of rest"
  - id: ERR_ASSET_CAPACITY_EXCEEDED
    http: 409
    condition: "units already occupied by intersecting SCHEDULED or DELIVERED bookings plus the requested units exceed capacity_units"
  - id: ERR_STAFFING_INCOMPLETE
    http: 409
    condition: "deliver of a booking on a requires_staffing asset with fewer than min_staff_count CHECKED_IN assignments"
  - id: ERR_DUPLICATE_CLAUSE_REF
    http: 409
    condition: "clause_ref already used by another entitlement of the same contract"
  - id: ERR_DUPLICATE_RATE_LINE
    http: 409
    condition: "the rate card already carries a line for that asset_class"
  - id: ERR_NO_ENTITLEMENTS
    http: 409
    condition: "contract submit while the contract has zero entitlements"
  - id: ERR_REVISION_LIMIT_REACHED
    http: 409
    condition: "contract submit while revision_round is already 4 or more (a 4th return exhausts the loop)"
  - id: ERR_OPEN_BOOKINGS
    http: 409
    condition: "contract close while any booking of its entitlements is still SCHEDULED"
  - id: ERR_INVENTORY_VALUE_EXCEEDED
    http: 409
    condition: "countersign would push property.committed_gross_value_cents above inventory_target_value_cents * 1.10"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PropertyAdmin
    description: "Owns the sellable inventory: properties, rate cards, priced lines and physical assets, plus the season clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /properties"
      - "POST /properties/{id}/transition"
      - "POST /properties/{id}/rate-cards"
      - "POST /rate-cards/{id}/lines"
      - "POST /rate-cards/{id}/publish"
      - "POST /properties/{id}/inventory-assets"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /properties/{id}"
      - "GET /rate-cards/{id}"
      - "GET /rate-cards"
      - "GET /rate-cards/{id}/lines"
      - "GET /inventory-assets/{id}"
      - "GET /inventory-assets"
      - "GET /sponsors/{id}"
      - "GET /contracts/{id}"
      - "GET /contracts"
      - "GET /entitlements/{id}"
      - "GET /entitlements"
      - "GET /asset-bookings/{id}"
      - "GET /asset-bookings"
      - "GET /asset-bookings/{id}/proofs"
      - "GET /staff-assignments/{id}"
      - "GET /staff-assignments"
      - "GET /contracts/{id}/roi-report"
      - "GET /contracts/{id}/surveys"

  - name: SponsorshipSeller
    description: "Builds the deal: registers sponsors, drafts contracts and clause entitlements, and submits them for approval"
    identity: "opaque"
    exclusive_operations:
      - "POST /sponsors"
      - "POST /contracts"
      - "POST /contracts/{id}/entitlements"
      - "POST /contracts/{id}/submit"
    shared_operations:
      - "GET /properties/{id}"
      - "GET /rate-cards/{id}"
      - "GET /rate-cards"
      - "GET /rate-cards/{id}/lines"
      - "GET /inventory-assets/{id}"
      - "GET /inventory-assets"
      - "GET /sponsors/{id}"
      - "GET /contracts/{id}"
      - "GET /contracts"
      - "GET /entitlements/{id}"
      - "GET /entitlements"

  - name: ContractApprover
    description: "Approves and unwinds deals: returns, countersigns, activates, terminates and closes contracts. May never be the same operator who submitted the contract"
    identity: "opaque"
    exclusive_operations:
      - "POST /contracts/{id}/return"
      - "POST /contracts/{id}/countersign"
      - "POST /contracts/{id}/activate"
      - "POST /contracts/{id}/terminate"
      - "POST /contracts/{id}/close"
    shared_operations:
      - "GET /properties/{id}"
      - "GET /rate-cards/{id}"
      - "GET /rate-cards"
      - "GET /rate-cards/{id}/lines"
      - "GET /inventory-assets/{id}"
      - "GET /inventory-assets"
      - "GET /sponsors/{id}"
      - "GET /contracts/{id}"
      - "GET /contracts"
      - "GET /entitlements/{id}"
      - "GET /entitlements"
      - "GET /asset-bookings/{id}"
      - "GET /asset-bookings"
      - "GET /asset-bookings/{id}/proofs"
      - "GET /staff-assignments/{id}"
      - "GET /staff-assignments"
      - "GET /contracts/{id}/roi-report"
      - "GET /contracts/{id}/surveys"

  - name: ActivationManager
    description: "Runs delivery: schedules and cancels asset occupations, staffs shifts, checks staffers in, marks bookings delivered and captures proof of performance"
    identity: "opaque"
    exclusive_operations:
      - "POST /asset-bookings"
      - "POST /asset-bookings/{id}/cancel"
      - "POST /asset-bookings/{id}/deliver"
      - "POST /asset-bookings/{id}/proofs"
      - "POST /staff-members"
      - "POST /asset-bookings/{id}/assignments"
      - "POST /staff-assignments/{id}/check-in"
    shared_operations:
      - "GET /properties/{id}"
      - "GET /inventory-assets/{id}"
      - "GET /inventory-assets"
      - "GET /contracts/{id}"
      - "GET /entitlements/{id}"
      - "GET /entitlements"
      - "GET /asset-bookings/{id}"
      - "GET /asset-bookings"
      - "GET /asset-bookings/{id}/proofs"
      - "GET /staff-assignments/{id}"
      - "GET /staff-assignments"

  - name: PerformanceAuditor
    description: "Adjudicates captured evidence and reads reporting. May never adjudicate evidence they captured themselves"
    identity: "opaque"
    exclusive_operations:
      - "POST /proofs/{id}/adjudicate"
    shared_operations:
      - "GET /properties/{id}"
      - "GET /sponsors/{id}"
      - "GET /contracts/{id}"
      - "GET /contracts"
      - "GET /entitlements/{id}"
      - "GET /entitlements"
      - "GET /asset-bookings/{id}"
      - "GET /asset-bookings"
      - "GET /asset-bookings/{id}/proofs"
      - "GET /staff-assignments/{id}"
      - "GET /staff-assignments"
      - "GET /contracts/{id}/roi-report"
      - "GET /contracts/{id}/surveys"

  - name: SponsorContact
    description: "The buying brand. X-User-ID is the Sponsor id, and every contract-scoped read or write must target a contract whose sponsor_id equals it"
    identity: "entity_backed:Sponsor"
    exclusive_operations:
      - "POST /contracts/{id}/surveys"
    shared_operations:
      - "GET /contracts/{id}"
      - "GET /contracts"
      - "GET /contracts/{id}/roi-report"
      - "GET /contracts/{id}/surveys"
