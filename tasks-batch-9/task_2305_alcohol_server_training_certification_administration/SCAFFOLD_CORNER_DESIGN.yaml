      - name: cooling_off_gates_every_retry_and_the_ceiling_binds_after_the_third_counted_attempt
        claim_type: Violation → Error
        grounds:
          - validations.priority_34_ERR_RETAKE_COOLING_OFF
          - validations.priority_31_ERR_RETAKE_LIMIT_EXCEEDED
          - calculations.retake_gate_evaluation
          - entities.Enrollment.fields.attempt_count
