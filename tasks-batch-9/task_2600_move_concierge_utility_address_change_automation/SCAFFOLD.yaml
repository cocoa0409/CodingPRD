scenario: |
  2600. Move Concierge & Utility/Address Change Automation (Updater): move record creation from
  property-manager or mover feed, identity verification before address change submission, utility
  provider mapping by service address and required account data, service start/stop scheduling with
  deposit and credit-check handoff, USPS change-of-address filing and mail-forwarding confirmation,
  partner referral placement (internet, insurance, movers) with attribution and revenue share,
  duplicate/cancelled move detection, resident data-sharing consent and opt-out
domain_name: move-concierge-utility-automation
api_prefix: "/"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  difficulty_level: "beyond-expert (14 entities, 64 endpoints, 58 error codes, 50 ordered validations, 5 calculations with 4 dual-variant pairs, 8 state machines across 7 entities including one parallel-dimension entity)"
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: graph
  entity_topology_note: |
    MoveRecord is a hub with two distinct FKs into ServiceAddress (origin, destination) and two
    self-referential FKs (duplicate_of_move_id, reactivation_candidate_move_id).
    ProviderServiceTerritory is a junction row binding UtilityProvider to a (postal_code, state_code,
    effective interval) tuple, so provider selection is a many-to-many resolution rather than a tree
    walk. URLs are flat (/moves/{id}, /utility-orders/{id}) even where ownership is nested.

  state_machine_shape: parallel
  state_machine_shape_note: |
    UtilityOrder carries two independent state dimensions on one row (provision_status x
    credit_status). AddressChangeFiling is cyclic (SUBMITTED -> REJECTED -> SUBMITTED).
    MoveRecord branches (IDENTITY_PENDING -> {VERIFIED, IDENTITY_FAILED}) and cycles
    (SCHEDULING -> ATTENTION_REQUIRED -> SCHEDULING). ReferralPlacement forks at ACCEPTED
    ({CONVERTED, DECLINED}) with disjoint side-effect sets per branch.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  role_model_note: |
    The ComplianceOfficer X-User-ID that recorded a MANUAL_OVERRIDE IdentityVerification for a move
    is barred from submitting that move's USPS AddressChangeFiling (ERR_SEGREGATION_OF_DUTIES).
    Layered on top of peer ownership: FeedIntegrator owns its FeedSource's moves, ProviderAgent owns
    its provider's utility orders, PartnerAgent owns its partner's placements, Resident owns its own
    consent records and marketing preference.

  consistency_model: saga
  consistency_model_note: |
    Utility provisioning is a compensating multi-step saga: mapping -> credit handoff -> schedule ->
    activation, with consent revocation, provision failure and duplicate merge each unwinding the
    partially-completed legs (occupancy windows released, credit handoffs voided, referral accruals
    reversed) so the named conserved quantities return to their pre-action values.

entities:
  - name: FeedSource
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Display name of the property manager or mover integration"
        constraints: "1..120 chars, required"
      - name: source_type
        type: enum
        source: input
        description: "Which feed family this account represents"
        constraints: "PROPERTY_MANAGER | MOVER"
      - name: dedupe_window_days
        type: integer
        source: input
        description: "Half-width in days of the move_date proximity window used by duplicate_match_score"
        default: 30
        constraints: "1..120"
      - name: trust_tier
        type: enum
        source: input
        description: "TIER_A feeds auto-dismiss duplicates below threshold, TIER_B feeds always park them for review"
        default: TIER_B
        constraints: "TIER_A | TIER_B"
      - name: referral_revenue_share_pct
        type: number
        source: input
        description: "Fraction of platform referral commission owed back to this feed source"
        constraints: "0.0000..0.5000, 4 decimal places"
      - name: accrued_share_cents
        type: integer
        source: computed
        description: "Per-placement-rounded sum of this feed source's share of referral commissions (see calculations.referral_attributed_share_cents)"
        default: 0
      - name: feed_status
        type: enum
        source: system
        description: "ACTIVE feeds may ingest moves, SUSPENDED feeds are rejected at intake"
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED"

  - name: Resident
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Legal name of the mover, normalized (case-folded, whitespace-collapsed) for duplicate matching"
        constraints: "1..120 chars, required"
      - name: email
        type: string
        source: input
        description: "Contact email, case-folded before comparison"
        constraints: "must contain one @, required"
      - name: phone_last4
        type: string
        source: input
        description: "Last four digits of the contact phone"
        constraints: "exactly 4 digits"
      - name: date_of_birth
        type: string
        source: input
        description: "ISO 8601 date, required for identity verification"
        constraints: "YYYY-MM-DD"
      - name: ssn_last4
        type: string
        source: input
        description: "Last four digits of the national identifier, required by KBA vendors"
        constraints: "exactly 4 digits"
      - name: marketing_opt_out
        type: boolean
        source: input
        description: "When true no referral placement may be created for any of this resident's moves"
        default: false
      - name: opted_out_at
        type: datetime
        source: system
        description: "Logical-clock instant at which marketing_opt_out last flipped from false to true, null otherwise"
        default: null

  - name: ServiceAddress
    parent: null
    common_fields: true
    fields:
      - name: line1
        type: string
        source: input
        description: "Street line, normalized (case-folded, whitespace-collapsed) for duplicate matching"
        constraints: "1..160 chars, required"
      - name: unit
        type: string
        source: input
        description: "Apartment or unit designator, null for single-family addresses"
        default: null
      - name: city
        type: string
        source: input
        description: "City name"
        constraints: "required"
      - name: state_code
        type: string
        source: input
        description: "Two-letter US state code, upper-cased"
        constraints: "exactly 2 uppercase letters"
      - name: postal_code
        type: string
        source: input
        description: "Five-digit ZIP, the join key against ProviderServiceTerritory"
        constraints: "exactly 5 digits"
      - name: address_hash
        type: string
        source: computed
        description: "Deterministic digest of lower(line1) + | + lower(coalesce(unit, empty)) + | + postal_code, used as the exact-match key by duplicate_match_score"
      - name: usps_deliverable
        type: boolean
        source: system
        description: "True unless postal_code is in the non-deliverable list; a false value blocks USPS filing submission"
        default: true

  - name: UtilityProvider
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Provider trade name"
        constraints: "1..120 chars, required"
      - name: utility_type
        type: enum
        source: input
        description: "Commodity this provider supplies"
        constraints: "ELECTRIC | GAS | WATER | INTERNET"
      - name: required_account_fields
        type: array
        source: input
        description: "Field names that must all be present as keys of UtilityOrder.account_data before scheduling is accepted"
        constraints: "1..6 entries drawn from {account_holder_name, service_start_date, ssn_last4, prior_account_number, unit_designator}"
      - name: deposit_policy
        type: enum
        source: input
        description: "How the deposit base is derived when a credit check returns DEPOSIT_REQUIRED"
        constraints: "NONE | FLAT | CREDIT_SCORE_BASED"
      - name: flat_deposit_cents
        type: integer
        source: input
        description: "Deposit base used when deposit_policy is FLAT, ignored otherwise"
        default: 0
        constraints: ">= 0"
      - name: credit_check_required
        type: boolean
        source: input
        description: "When true a new UtilityOrder starts with credit_status PENDING_CHECK, when false NOT_REQUIRED"
      - name: scheduling_lead_days
        type: integer
        source: input
        description: "Minimum whole days between the logical clock date and requested_service_date for START orders"
        constraints: "0..30"
      - name: same_day_stop_allowed
        type: boolean
        source: input
        description: "When true STOP orders are exempt from the scheduling_lead_days floor"
        default: false
      - name: provider_status
        type: enum
        source: system
        description: "Only ACTIVE providers are eligible candidates during provider mapping"
        default: ACTIVE
        constraints: "ACTIVE | INACTIVE"

  - name: ProviderServiceTerritory
    parent: UtilityProvider
    common_fields: true
    fields:
      - name: provider_id
        type: string
        source: input
        description: "FK -> UtilityProvider.id; the provider that serves this territory row"
      - name: postal_code
        type: string
        source: input
        description: "Five-digit ZIP served by the provider"
        constraints: "exactly 5 digits"
      - name: state_code
        type: string
        source: input
        description: "Two-letter state code, must equal the served address state_code"
        constraints: "exactly 2 uppercase letters"
      - name: effective_from
        type: string
        source: input
        description: "First date (inclusive) on which this territory row may serve a move_date"
        constraints: "YYYY-MM-DD"
      - name: effective_to
        type: string
        source: input
        description: "Last date (inclusive) on which this row may serve a move_date, null means open-ended"
        default: null
        constraints: "YYYY-MM-DD, must be >= effective_from when present"
      - name: is_default_carrier
        type: boolean
        source: input
        description: "Default-carrier rows for one (postal_code, utility_type) must be separated by a gap of at least one full day, non-default rows may overlap freely"
        default: false
      - name: priority_rank
        type: integer
        source: input
        description: "Primary ranking key (ascending) among eligible candidates after is_default_carrier"
        constraints: "1..999"

  - name: MoveRecord
    parent: null
    common_fields: true
    fields:
      - name: resident_id
        type: string
        source: input
        description: "FK -> Resident.id; the mover this record belongs to"
      - name: feed_source_id
        type: string
        source: input
        description: "FK -> FeedSource.id; the property-manager or mover feed that produced this record"
      - name: origin_address_id
        type: string
        source: input
        description: "FK -> ServiceAddress.id; address being vacated, anchors STOP orders"
      - name: destination_address_id
        type: string
        source: input
        description: "FK -> ServiceAddress.id; address being occupied, anchors START orders and provider mapping"
      - name: duplicate_of_move_id
        type: string
        source: system
        description: "FK -> MoveRecord.id; set only by a MERGE_INTO duplicate resolution to the survivor move, null otherwise"
        default: null
      - name: reactivation_candidate_move_id
        type: string
        source: computed
        description: "FK -> MoveRecord.id; highest-scoring CANCELLED or DUPLICATE_MERGED candidate at intake when its duplicate_match_score >= 0.80, null otherwise"
        default: null
      - name: move_date
        type: string
        source: input
        description: "Physical move date driving territory eligibility, lead-time floors and completion"
        constraints: "YYYY-MM-DD, within [clock_date - 30 days, clock_date + 180 days] at intake"
      - name: external_reference
        type: string
        source: input
        description: "Feed-side identifier echoed back to the property manager"
        default: null
      - name: lifecycle_status
        type: enum
        source: system
        description: "Primary state machine, see state_machines.MoveRecord"
        default: INTAKE
        constraints: "INTAKE | IDENTITY_PENDING | IDENTITY_FAILED | VERIFIED | SCHEDULING | ATTENTION_REQUIRED | IN_SERVICE | COMPLETED | CANCELLED | DUPLICATE_MERGED"
      - name: duplicate_flag
        type: enum
        source: computed
        description: "NONE or SUSPECTED at intake from duplicate_match_score, then CONFIRMED_DUPLICATE or DISMISSED after duplicate resolution"
        default: NONE
        constraints: "NONE | SUSPECTED | CONFIRMED_DUPLICATE | DISMISSED"
      - name: duplicate_match_score
        type: number
        source: computed
        description: "Best open-candidate score from calculations.duplicate_match_score, 2 decimal places, 0.00 when the candidate pool is empty"
        default: 0.00
      - name: duplicate_candidate_move_id
        type: string
        source: computed
        description: "FK -> MoveRecord.id; highest-scoring open candidate evaluated at intake, retained even when the score is below threshold, null when the pool is empty"
        default: null
      - name: consent_gate
        type: enum
        source: computed
        description: "BLOCKED when any ConsentRecord linked to this move with scope in {UTILITY_SETUP, USPS_FILING} is in state REVOKED or EXPIRED, else OPEN"
        default: OPEN
        constraints: "OPEN | BLOCKED"
      - name: blocked_reason
        type: enum
        source: system
        description: "Why the move is parked, set by the cascade that parked it and cleared to NONE by an attention clearance"
        default: NONE
        constraints: "NONE | DUPLICATE_SUSPECTED | CONSENT_REVOKED | CREDIT_DECLINED | PROVISION_FAILED | FILING_REJECTED"
      - name: readiness_score
        type: integer
        source: computed
        description: "AUTO-variant output of calculations.move_readiness_score, recomputed by every transition listed in that rule's trigger"
        default: 0
        constraints: "0..100"
      - name: verified_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the move first reached VERIFIED, null before that"
        default: null
      - name: identity_attempt_count
        type: integer
        source: system
        description: "Number of IdentityVerification rows ever created for this move, capped by MAX_IDENTITY_ATTEMPTS"
        default: 0
      - name: mapped_order_count
        type: integer
        source: computed
        description: "Count of UtilityOrder rows whose move_id is this move, regardless of status"
        default: 0
      - name: unmapped_utility_types
        type: array
        source: system
        description: "Utility types requested during the last provider mapping run that had an empty eligible candidate pool"
        default: []

  - name: IdentityVerification
    parent: MoveRecord
    common_fields: true
    fields:
      - name: move_id
        type: string
        source: system
        description: "FK -> MoveRecord.id; the move whose address change this verification authorizes"
      - name: resident_id
        type: string
        source: system
        description: "FK -> Resident.id; copied from the move at creation"
      - name: method
        type: enum
        source: input
        description: "KBA opens a PENDING attempt awaiting a vendor result, MANUAL_OVERRIDE is decided in-band by a ComplianceOfficer"
        constraints: "KBA | MANUAL_OVERRIDE"
      - name: attempt_no
        type: integer
        source: computed
        description: "MoveRecord.identity_attempt_count + 1 at creation time"
        constraints: "1..3"
      - name: status
        type: enum
        source: system
        description: "See state_machines.IdentityVerification"
        default: PENDING
        constraints: "PENDING | PASSED | FAILED | EXPIRED"
      - name: kba_score
        type: integer
        source: input
        description: "Vendor confidence score supplied with the KBA result, null for MANUAL_OVERRIDE"
        default: null
        constraints: "0..1000"
      - name: reviewer_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer that recorded a MANUAL_OVERRIDE, null for KBA attempts; the segregation-of-duties key"
        default: null
      - name: override_reason
        type: string
        source: input
        description: "Free-text justification, required when method is MANUAL_OVERRIDE"
        default: null
      - name: expires_at
        type: datetime
        source: computed
        description: "Creation clock instant + PENDING_TTL_HOURS, after which a fresh attempt supersedes this one as EXPIRED"
      - name: decided_at
        type: datetime
        source: system
        description: "Logical-clock instant at which status left PENDING, null while PENDING"
        default: null

  - name: UtilityOrder
    parent: MoveRecord
    common_fields: true
    fields:
      - name: move_id
        type: string
        source: system
        description: "FK -> MoveRecord.id; the move this service order serves"
      - name: provider_id
        type: string
        source: system
        description: "FK -> UtilityProvider.id; winner of the provider-mapping selector for this order's utility type"
      - name: service_address_id
        type: string
        source: system
        description: "FK -> ServiceAddress.id; destination address for START orders, origin address for STOP orders"
      - name: territory_id
        type: string
        source: system
        description: "FK -> ProviderServiceTerritory.id; the territory row that won the selector, pinned for audit"
      - name: order_kind
        type: enum
        source: system
        description: "START opens service at the destination, STOP closes service at the origin"
        constraints: "START | STOP"
      - name: utility_type
        type: enum
        source: system
        description: "Copied from the selected provider, the occupancy key together with service_address_id"
        constraints: "ELECTRIC | GAS | WATER | INTERNET"
      - name: provision_status
        type: enum
        source: system
        description: "First state dimension, see state_machines.UtilityOrder (state_field provision_status)"
        default: DRAFT
        constraints: "DRAFT | SCHEDULED | ACTIVE_SERVICE | CLOSED | SUSPENDED | PROVISION_FAILED | CANCELLED | NOT_APPLICABLE"
      - name: credit_status
        type: enum
        source: system
        description: "Second, independent state dimension, see state_machines.UtilityOrder (state_field credit_status)"
        default: PENDING_CHECK
        constraints: "NOT_REQUIRED | PENDING_CHECK | CLEARED | DEPOSIT_DUE | DEPOSIT_PAID | DECLINED | VOIDED"
      - name: account_data
        type: object
        source: input
        description: "Provider-specific account payload supplied at scheduling, keys must cover UtilityProvider.required_account_fields"
        default: {}
      - name: requested_service_date
        type: string
        source: input
        description: "Date on which service should start or stop, subject to the provider lead-time floor"
        default: null
        constraints: "YYYY-MM-DD"
      - name: scheduled_window_start
        type: datetime
        source: input
        description: "Half-open occupancy window start on (service_address_id, utility_type), cleared when the order leaves SCHEDULED for SUSPENDED or CANCELLED"
        default: null
      - name: scheduled_window_end
        type: datetime
        source: input
        description: "Half-open occupancy window end, exclusive, so a window starting exactly at another window's end does not collide"
        default: null
      - name: deposit_estimate_cents
        type: integer
        source: computed
        description: "estimate_at_mapping variant of calculations.credit_deposit_amount_cents, written at order creation"
        default: 0
      - name: deposit_amount_cents
        type: integer
        source: computed
        description: "final_at_bureau_response variant of calculations.credit_deposit_amount_cents, written when the bureau returns DEPOSIT_REQUIRED, 0 otherwise"
        default: 0
      - name: deposit_paid_cents
        type: integer
        source: input
        description: "Cumulative deposit amount recorded against this order, must equal deposit_amount_cents to reach DEPOSIT_PAID"
        default: 0
      - name: readiness_snapshot
        type: integer
        source: computed
        description: "MoveRecord.readiness_score captured at the instant the credit-check handoff was accepted, the only readiness input the deposit formula may read"
        default: null
      - name: confirmation_code
        type: string
        source: input
        description: "Provider-issued activation confirmation, required to reach ACTIVE_SERVICE"
        default: null
      - name: cancellation_reason
        type: enum
        source: system
        description: "Why a terminal cancellation happened, null unless provision_status is CANCELLED"
        default: null
        constraints: "MOVE_CANCELLED | DUPLICATE_MERGED"
      - name: failure_reason
        type: string
        source: input
        description: "Provider-reported reason recorded with a provision failure, null otherwise"
        default: null
      - name: waiver_reason
        type: string
        source: input
        description: "Why the utility is not applicable to this move (for example included in rent), null unless NOT_APPLICABLE"
        default: null

  - name: CreditCheckHandoff
    parent: UtilityOrder
    common_fields: true
    fields:
      - name: utility_order_id
        type: string
        source: system
        description: "FK -> UtilityOrder.id; the order whose deposit exposure this handoff resolves"
      - name: bureau
        type: enum
        source: input
        description: "Bureau the handoff was dispatched to"
        constraints: "EXPERIAN | EQUIFAX | TRANSUNION"
      - name: handoff_status
        type: enum
        source: system
        description: "See state_machines.CreditCheckHandoff"
        default: SUBMITTED
        constraints: "SUBMITTED | RESPONDED | VOIDED"
      - name: score
        type: integer
        source: input
        description: "Bureau score returned in the response, null while SUBMITTED"
        default: null
        constraints: "300..850"
      - name: result
        type: enum
        source: computed
        description: "Band derived from score by calculations.credit_deposit_amount_cents, null while SUBMITTED"
        default: null
        constraints: "CLEAR | DEPOSIT_REQUIRED | DECLINED"
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the MoveOpsAgent that dispatched the handoff"
      - name: responded_at
        type: datetime
        source: system
        description: "Logical-clock instant of the bureau response, null while SUBMITTED"
        default: null

  - name: AddressChangeFiling
    parent: MoveRecord
    common_fields: true
    fields:
      - name: move_id
        type: string
        source: system
        description: "FK -> MoveRecord.id; the move whose USPS change-of-address this filing represents"
      - name: resident_id
        type: string
        source: system
        description: "FK -> Resident.id; copied from the move, the aggregate key for the one-active-forward rule"
      - name: filing_type
        type: enum
        source: input
        description: "USPS COA family"
        constraints: "INDIVIDUAL | FAMILY | BUSINESS"
      - name: forward_start_date
        type: string
        source: input
        description: "First date mail is forwarded, anchors the FORWARD_TERM_DAYS (365) forwarding period"
        constraints: "YYYY-MM-DD, must be >= the logical clock date at submission"
      - name: forward_end_date
        type: string
        source: computed
        description: "forward_start_date + FORWARD_TERM_DAYS (365) - 1 day, the inclusive end of the forwarding period, so forward_start_date 2026-08-20 yields forward_end_date 2027-08-19"
      - name: status
        type: enum
        source: system
        description: "See state_machines.AddressChangeFiling, cyclic through REJECTED"
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | CONFIRMED | REJECTED | CANCELLED"
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the most recent submitter, compared against the move's MANUAL_OVERRIDE reviewer_user_id"
        default: null
      - name: resubmit_count
        type: integer
        source: system
        description: "Number of submissions after the first, capped by MAX_FILING_RESUBMITS"
        default: 0
      - name: usps_confirmation_code
        type: string
        source: input
        description: "Confirmation code returned by USPS, set only on CONFIRMED"
        default: null
      - name: reject_reason
        type: string
        source: input
        description: "USPS rejection detail, set only on REJECTED"
        default: null
      - name: mail_forwarding_confirmed_at
        type: datetime
        source: system
        description: "Logical-clock instant of USPS confirmation, cleared when the filing is later cancelled"
        default: null
      - name: cancellation_reason
        type: string
        source: input
        description: "Why the filing was withdrawn, null unless CANCELLED"
        default: null

  - name: ReferralPartner
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Partner trade name"
        constraints: "1..120 chars, required"
      - name: vertical
        type: enum
        source: input
        description: "Referral category, at most one non-terminal placement per (move, vertical)"
        constraints: "INTERNET | INSURANCE | MOVERS"
      - name: payout_model
        type: enum
        source: input
        description: "FLAT_BOUNTY pays a fixed commission per conversion, REV_SHARE_PCT a fraction of reported gross"
        constraints: "FLAT_BOUNTY | REV_SHARE_PCT"
      - name: bounty_cents
        type: integer
        source: input
        description: "Commission per conversion when payout_model is FLAT_BOUNTY, ignored otherwise"
        default: 0
        constraints: ">= 0"
      - name: rev_share_pct
        type: number
        source: input
        description: "Commission fraction of gross revenue when payout_model is REV_SHARE_PCT, ignored otherwise"
        default: 0.0000
        constraints: "0.0000..0.9000, 4 decimal places"
      - name: attribution_window_days
        type: integer
        source: input
        description: "Whole days after the attribution anchor during which a conversion is still attributable, inclusive of the exact anchor + N days instant"
        constraints: "1..90"
      - name: attribution_basis
        type: enum
        source: input
        description: "PLACEMENT_CLICK anchors the window at placed_at, PLACEMENT_ACCEPTANCE anchors it at accepted_at"
        constraints: "PLACEMENT_CLICK | PLACEMENT_ACCEPTANCE"
      - name: monthly_placement_cap
        type: integer
        source: input
        description: "Maximum placements this partner may receive within the calendar month of the logical clock"
        constraints: "1..1000"
      - name: partner_status
        type: enum
        source: system
        description: "Only ACTIVE partners may receive new placements"
        default: ACTIVE
        constraints: "ACTIVE | PAUSED"

  - name: ReferralPlacement
    parent: MoveRecord
    common_fields: true
    fields:
      - name: move_id
        type: string
        source: system
        description: "FK -> MoveRecord.id; the move the resident was referred from"
      - name: partner_id
        type: string
        source: input
        description: "FK -> ReferralPartner.id; the partner receiving the referral"
      - name: vertical
        type: enum
        source: computed
        description: "Copied from the partner at placement time, the uniqueness key together with move_id"
        constraints: "INTERNET | INSURANCE | MOVERS"
      - name: placement_status
        type: enum
        source: system
        description: "See state_machines.ReferralPlacement, forks at ACCEPTED"
        default: PLACED
        constraints: "PLACED | ACCEPTED | DECLINED | CONVERTED | SETTLED | REVERSED | VOIDED"
      - name: placed_at
        type: datetime
        source: system
        description: "Logical-clock instant of placement creation, the PLACEMENT_CLICK attribution anchor"
      - name: accepted_at
        type: datetime
        source: system
        description: "Logical-clock instant of partner acceptance, the PLACEMENT_ACCEPTANCE attribution anchor, null before acceptance"
        default: null
      - name: converted_at
        type: datetime
        source: system
        description: "Logical-clock instant the partner reported the conversion, null before that"
        default: null
      - name: gross_revenue_cents
        type: integer
        source: input
        description: "Partner-reported gross revenue for the conversion, 0 until reported"
        default: 0
        constraints: ">= 0"
      - name: settled_gross_revenue_cents
        type: integer
        source: input
        description: "Reconciled gross revenue supplied at settlement, 0 until settled"
        default: 0
        constraints: ">= 0"
      - name: attributed_share_cents
        type: integer
        source: computed
        description: "Platform commission attributed to this placement, provisional_at_conversion variant then overwritten by settled_at_settlement"
        default: 0
      - name: feed_source_share_cents
        type: integer
        source: computed
        description: "Portion of attributed_share_cents owed to the move's feed source, rounded per placement"
        default: 0
      - name: decline_reason
        type: string
        source: input
        description: "Partner-supplied reason, null unless DECLINED"
        default: null
      - name: reversal_reason
        type: string
        source: input
        description: "Clawback justification, null unless REVERSED"
        default: null

  - name: ConsentRecord
    parent: Resident
    common_fields: true
    fields:
      - name: resident_id
        type: string
        source: system
        description: "FK -> Resident.id; the data subject that granted this consent"
      - name: move_id
        type: string
        source: input
        description: "FK -> MoveRecord.id; the move this consent is scoped to, null for resident-wide consents"
        default: null
      - name: scope
        type: enum
        source: input
        description: "Which downstream data sharing the resident authorized"
        constraints: "UTILITY_SETUP | USPS_FILING | PARTNER_MARKETING"
      - name: source_channel
        type: enum
        source: input
        description: "How the consent was captured, recorded for audit"
        constraints: "PM_FEED | WEB_PORTAL | PHONE_ATTESTATION"
      - name: consent_text_version
        type: string
        source: input
        description: "Version tag of the disclosure text the resident agreed to"
        constraints: "1..16 chars, required"
      - name: state
        type: enum
        source: system
        description: "See state_machines.ConsentRecord"
        default: GRANTED
        constraints: "GRANTED | SUPERSEDED | REVOKED | EXPIRED"
      - name: granted_at
        type: datetime
        source: system
        description: "Logical-clock instant of creation"
      - name: expires_at
        type: datetime
        source: input
        description: "Optional expiry instant, null means the consent does not lapse"
        default: null
      - name: revoked_at
        type: datetime
        source: system
        description: "Logical-clock instant of revocation, null otherwise"
        default: null
      - name: revocation_reason
        type: string
        source: input
        description: "Free-text reason captured with a revocation"
        default: null

  - name: RevenueShareLedgerEntry
    parent: ReferralPlacement
    common_fields: false
    fields:
      - name: placement_id
        type: string
        source: system
        description: "FK -> ReferralPlacement.id; the placement whose economics this immutable entry records"
      - name: move_id
        type: string
        source: system
        description: "FK -> MoveRecord.id; copied from the placement for reporting"
      - name: feed_source_id
        type: string
        source: system
        description: "FK -> FeedSource.id; copied from the move, the payee for FEED_SOURCE_* entries"
      - name: entry_type
        type: enum
        source: system
        description: "Which leg of the revenue-share saga this entry records"
        constraints: "ACCRUAL | FEED_SOURCE_SHARE | ADJUSTMENT | FEED_SOURCE_SHARE_ADJUSTMENT | REVERSAL | FEED_SOURCE_SHARE_REVERSAL"
      - name: amount_cents
        type: integer
        source: computed
        description: "Signed amount from the platform's perspective, positive for platform inflow and negative for amounts owed out to the feed source"
      - name: posted_at
        type: datetime
        source: system
        description: "Logical-clock instant the entry was posted, the chronological replay key"

state_machines:
  - entity: MoveRecord
    state_field: lifecycle_status
    initial_state: INTAKE
    terminal_states: [COMPLETED, CANCELLED, DUPLICATE_MERGED]
    shape: "branching at IDENTITY_PENDING plus two cycles (IDENTITY_PENDING <-> IDENTITY_FAILED, SCHEDULING <-> ATTENTION_REQUIRED)"
    transitions:
      - transition_id: CREATION_to_INTAKE
        from: null
        to: INTAKE
        trigger: "POST /moves"
        actor: FeedIntegrator | MoveOpsAgent
        preconditions:
          - "FeedSource.feed_status == ACTIVE"
          - "acting FeedIntegrator X-User-ID == body feed_source_id (MoveOpsAgent exempt)"
          - "move_date within [clock_date - MOVE_DATE_PAST_GRACE_DAYS (30) days, clock_date + MOVE_DATE_HORIZON_DAYS (180) days]"
          - "origin_address_id != destination_address_id"
        side_effects:
          - "runs calculations.duplicate_match_score open_candidate_pass; writes duplicate_match_score, duplicate_candidate_move_id"
          - "when duplicate_match_score >= DUP_SUSPECT_THRESHOLD: duplicate_flag = SUSPECTED and blocked_reason = DUPLICATE_SUSPECTED"
          - "when duplicate_match_score < DUP_SUSPECT_THRESHOLD and FeedSource.trust_tier == TIER_A: duplicate_flag = DISMISSED; TIER_B leaves duplicate_flag = NONE"
          - "runs calculations.duplicate_match_score cancelled_candidate_pass when the open pass produced no SUSPECTED match; writes reactivation_candidate_move_id when that pass scores >= DUP_SUSPECT_THRESHOLD, and overwrites duplicate_match_score with the cancelled-pass score when the open pass found no candidate"
          - "runs calculations.move_readiness_score pre_verification variant; writes readiness_score"
      - transition_id: INTAKE_to_IDENTITY_PENDING
        from: INTAKE
        to: IDENTITY_PENDING
        trigger: "POST /moves/{id}/identity-verifications with method KBA"
        actor: MoveOpsAgent | ComplianceOfficer
        preconditions:
          - "Resident.ssn_last4 and Resident.date_of_birth are both non-null"
          - "MoveRecord.identity_attempt_count < MAX_IDENTITY_ATTEMPTS"
        side_effects:
          - "creates IdentityVerification (status PENDING, attempt_no = identity_attempt_count + 1, expires_at = clock + PENDING_TTL_HOURS)"
          - "increments MoveRecord.identity_attempt_count by 1"
          - "any pre-existing PENDING IdentityVerification whose expires_at < clock transitions to EXPIRED"
          - "recomputes readiness_score (pre_verification variant)"
      - transition_id: INTAKE_to_VERIFIED
        from: INTAKE
        to: VERIFIED
        trigger: "POST /moves/{id}/identity-verifications with method MANUAL_OVERRIDE"
        actor: ComplianceOfficer
        preconditions:
          - "override_reason is present and non-empty"
          - "MoveRecord.identity_attempt_count < MAX_IDENTITY_ATTEMPTS"
        side_effects:
          - "creates IdentityVerification (status PASSED, reviewer_user_id = X-User-ID, decided_at = clock)"
          - "increments MoveRecord.identity_attempt_count by 1"
          - "sets MoveRecord.verified_at = clock"
          - "recomputes readiness_score (post_verification variant)"
      - transition_id: IDENTITY_PENDING_to_VERIFIED
        from: IDENTITY_PENDING
        to: VERIFIED
        trigger: "POST /identity-verifications/{id}/kba-result with outcome PASSED"
        actor: ExternalServiceGateway
        preconditions:
          - "IdentityVerification.status == PENDING"
          - "clock <= IdentityVerification.expires_at"
          - "score >= KBA_PASS_SCORE"
        side_effects:
          - "IdentityVerification.status = PASSED, decided_at = clock, kba_score = score"
          - "sets MoveRecord.verified_at = clock"
          - "recomputes readiness_score (post_verification variant)"
      - transition_id: IDENTITY_PENDING_to_IDENTITY_FAILED
        from: IDENTITY_PENDING
        to: IDENTITY_FAILED
        trigger: "POST /identity-verifications/{id}/kba-result with outcome FAILED, or with outcome PASSED and score < KBA_PASS_SCORE"
        actor: ExternalServiceGateway
        preconditions:
          - "IdentityVerification.status == PENDING"
        side_effects:
          - "IdentityVerification.status = FAILED, decided_at = clock, kba_score = score"
          - "recomputes readiness_score (pre_verification variant)"
      - transition_id: IDENTITY_FAILED_to_IDENTITY_PENDING
        from: IDENTITY_FAILED
        to: IDENTITY_PENDING
        trigger: "POST /moves/{id}/identity-verifications with method KBA (retry, closes the IDENTITY_PENDING <-> IDENTITY_FAILED cycle)"
        actor: MoveOpsAgent | ComplianceOfficer
        preconditions:
          - "MoveRecord.identity_attempt_count < MAX_IDENTITY_ATTEMPTS"
        side_effects:
          - "creates a new IdentityVerification (status PENDING, attempt_no = identity_attempt_count + 1)"
          - "increments MoveRecord.identity_attempt_count by 1"
      - transition_id: IDENTITY_FAILED_to_VERIFIED
        from: IDENTITY_FAILED
        to: VERIFIED
        trigger: "POST /moves/{id}/identity-verifications with method MANUAL_OVERRIDE"
        actor: ComplianceOfficer
        preconditions:
          - "override_reason is present and non-empty"
          - "MoveRecord.identity_attempt_count < MAX_IDENTITY_ATTEMPTS"
        side_effects:
          - "creates IdentityVerification (status PASSED, reviewer_user_id = X-User-ID)"
          - "sets MoveRecord.verified_at = clock, increments identity_attempt_count by 1"
          - "recomputes readiness_score (post_verification variant)"
      - transition_id: VERIFIED_to_SCHEDULING
        from: VERIFIED
        to: SCHEDULING
        trigger: "POST /moves/{id}/provider-mapping"
        actor: MoveOpsAgent
        preconditions:
          - "MoveRecord.consent_gate == OPEN"
          - "a ConsentRecord with scope UTILITY_SETUP and state GRANTED exists for (resident_id, move_id or null)"
          - "MoveRecord.duplicate_flag NOT IN {SUSPECTED}"
          - "at least one requested utility_type has a non-empty eligible territory candidate pool"
        side_effects:
          - "creates one UtilityOrder per requested utility_type with a non-empty candidate pool (order_kind START at destination_address_id, plus order_kind STOP at origin_address_id when include_stop_orders is true and the origin postal_code also has coverage)"
          - "each new UtilityOrder gets provision_status DRAFT, credit_status PENDING_CHECK when the winning provider has credit_check_required true else NOT_REQUIRED, territory_id = winning territory, deposit_estimate_cents = calculations.credit_deposit_amount_cents estimate_at_mapping variant"
          - "writes MoveRecord.unmapped_utility_types with the requested types whose candidate pool was empty"
          - "recomputes mapped_order_count and readiness_score (post_verification variant)"
        note: "Re-running the mapping while already in SCHEDULING is allowed for utility types that have no order in DRAFT, SCHEDULED, ACTIVE_SERVICE or SUSPENDED; a request whose every requested type already has one is rejected with ERR_TYPE_ALREADY_MAPPED."
      - transition_id: SCHEDULING_to_ATTENTION_REQUIRED_ON_ORDER_FAILURE
        from: SCHEDULING
        to: ATTENTION_REQUIRED
        trigger: "system, second hop of the cascade started by POST /utility-orders/{id}/provision-failure or by a DECLINED bureau response"
        actor: system
        preconditions:
          - "the mutated UtilityOrder belongs to this move and reached provision_status PROVISION_FAILED"
        side_effects:
          - "blocked_reason = PROVISION_FAILED when the trigger was a provider failure, CREDIT_DECLINED when the trigger was a DECLINED bureau response"
          - "recomputes readiness_score (post_verification variant)"
      - transition_id: SCHEDULING_to_ATTENTION_REQUIRED_ON_CONSENT_REVOCATION
        from: SCHEDULING
        to: ATTENTION_REQUIRED
        trigger: "system, second hop of the cascade started by POST /consent-records/{id}/revocation for scope UTILITY_SETUP or USPS_FILING"
        actor: system
        preconditions:
          - "the revoked ConsentRecord is linked to this move (move_id equal, or move_id null and resident_id equal)"
        side_effects:
          - "recomputes consent_gate to BLOCKED, blocked_reason = CONSENT_REVOKED"
          - "recomputes readiness_score (post_verification variant, consent_component 0)"
      - transition_id: SCHEDULING_to_ATTENTION_REQUIRED_ON_FILING_REJECTION
        from: SCHEDULING
        to: ATTENTION_REQUIRED
        trigger: "system, second hop of the cascade started by POST /address-change-filings/{id}/usps-response with outcome REJECTED"
        actor: system
        preconditions:
          - "the rejected AddressChangeFiling belongs to this move"
        side_effects:
          - "blocked_reason = FILING_REJECTED"
          - "recomputes readiness_score (post_verification variant, filing_component 0)"
      - transition_id: ATTENTION_REQUIRED_to_SCHEDULING
        from: ATTENTION_REQUIRED
        to: SCHEDULING
        trigger: "POST /moves/{id}/attention-clearances (closes the SCHEDULING <-> ATTENTION_REQUIRED cycle)"
        actor: MoveOpsAgent
        preconditions:
          - "MoveRecord.consent_gate == OPEN"
          - "no AddressChangeFiling of this move has status REJECTED"
          - "every UtilityOrder of this move whose provision_status == PROVISION_FAILED or whose credit_status == DECLINED has a replacement UtilityOrder for the same (utility_type, order_kind) with provision_status IN {DRAFT, SCHEDULED, ACTIVE_SERVICE}"
        side_effects:
          - "blocked_reason = NONE"
          - "recomputes readiness_score (post_verification variant)"
      - transition_id: SCHEDULING_to_SCHEDULING
        from: SCHEDULING
        to: SCHEDULING
        trigger: "POST /moves/{id}/provider-mapping re-run for a utility type that has no non-terminal order (self-loop)"
        actor: MoveOpsAgent
        preconditions:
          - "MoveRecord.consent_gate == OPEN"
          - "at least one requested utility_type has no UtilityOrder in provision_status IN {DRAFT, SCHEDULED, ACTIVE_SERVICE, SUSPENDED}"
        side_effects:
          - "creates the missing UtilityOrder rows exactly as VERIFIED_to_SCHEDULING does; already-mapped types are skipped"
          - "recomputes mapped_order_count and readiness_score (post_verification variant)"
      - transition_id: ATTENTION_REQUIRED_to_ATTENTION_REQUIRED
        from: ATTENTION_REQUIRED
        to: ATTENTION_REQUIRED
        trigger: "POST /moves/{id}/provider-mapping re-run to replace a PROVISION_FAILED or credit-DECLINED order (self-loop)"
        actor: MoveOpsAgent
        preconditions:
          - "MoveRecord.consent_gate == OPEN"
          - "at least one requested utility_type has no UtilityOrder in provision_status IN {DRAFT, SCHEDULED, ACTIVE_SERVICE, SUSPENDED}"
        side_effects:
          - "creates the replacement UtilityOrder rows, which is what makes ATTENTION_REQUIRED_to_SCHEDULING satisfiable after a provider failure"
          - "recomputes mapped_order_count and readiness_score (post_verification variant)"
      - transition_id: SCHEDULING_to_IN_SERVICE
        from: SCHEDULING
        to: IN_SERVICE
        trigger: "system bubble-up on the last qualifying child mutation (POST /utility-orders/{id}/activation or POST /address-change-filings/{id}/usps-response with outcome CONFIRMED)"
        actor: system
        preconditions:
          - "mapped_order_count >= 1"
          - "every UtilityOrder of this move has provision_status IN {ACTIVE_SERVICE, CLOSED, CANCELLED, NOT_APPLICABLE}"
          - "at least one UtilityOrder of this move has provision_status ACTIVE_SERVICE"
          - "exactly one AddressChangeFiling of this move has status CONFIRMED"
        side_effects:
          - "recomputes readiness_score (post_verification variant)"
      - transition_id: IN_SERVICE_to_ATTENTION_REQUIRED
        from: IN_SERVICE
        to: ATTENTION_REQUIRED
        trigger: "system, second hop of the cascade started by POST /consent-records/{id}/revocation or POST /utility-orders/{id}/provision-failure"
        actor: system
        preconditions:
          - "a child of this move left an ACTIVE_SERVICE or CONFIRMED state"
        side_effects:
          - "blocked_reason set per the triggering cascade (CONSENT_REVOKED or PROVISION_FAILED)"
          - "recomputes readiness_score (post_verification variant)"
      - transition_id: IN_SERVICE_to_COMPLETED
        from: IN_SERVICE
        to: COMPLETED
        trigger: "POST /moves/{id}/completion"
        actor: MoveOpsAgent
        preconditions:
          - "clock_date >= MoveRecord.move_date"
          - "every UtilityOrder of this move has provision_status IN {ACTIVE_SERVICE, CLOSED, CANCELLED, NOT_APPLICABLE}"
          - "MoveRecord.consent_gate == OPEN"
        side_effects:
          - "recomputes readiness_score (post_verification variant)"
          - "no further mutation of this move or its children is accepted (terminal lockdown)"
      - transition_id: NON_TERMINAL_to_CANCELLED
        from: [INTAKE, IDENTITY_PENDING, IDENTITY_FAILED, VERIFIED, SCHEDULING, ATTENTION_REQUIRED, IN_SERVICE]
        to: CANCELLED
        trigger: "POST /moves/{id}/cancellation"
        actor: MoveOpsAgent | FeedIntegrator | PlatformAdmin
        preconditions:
          - "MoveRecord.lifecycle_status is not terminal"
        side_effects:
          - "every UtilityOrder of this move with provision_status IN {DRAFT, SCHEDULED, ACTIVE_SERVICE, SUSPENDED} -> CANCELLED with cancellation_reason MOVE_CANCELLED, clearing scheduled_window_start and scheduled_window_end (releases the occupancy window)"
          - "each such cancelled order with credit_status IN {PENDING_CHECK, DEPOSIT_DUE} -> VOIDED, and its CreditCheckHandoff with handoff_status IN {SUBMITTED, RESPONDED} -> VOIDED"
          - "every AddressChangeFiling of this move with status IN {DRAFT, SUBMITTED, REJECTED} -> CANCELLED with mail_forwarding_confirmed_at cleared"
          - "every ReferralPlacement of this move with placement_status IN {PLACED, ACCEPTED} -> VOIDED"
          - "blocked_reason = NONE, readiness_score recomputed"
      - transition_id: NON_TERMINAL_to_DUPLICATE_MERGED
        from: [INTAKE, IDENTITY_PENDING, IDENTITY_FAILED, VERIFIED, SCHEDULING, ATTENTION_REQUIRED]
        to: DUPLICATE_MERGED
        trigger: "POST /moves/{id}/duplicate-resolution with resolution MERGE_INTO"
        actor: MoveOpsAgent | ComplianceOfficer
        preconditions:
          - "expected_move_version == MoveRecord.version"
          - "survivor_move_id resolves to an existing MoveRecord whose lifecycle_status IN {INTAKE, IDENTITY_PENDING, IDENTITY_FAILED, VERIFIED, SCHEDULING, ATTENTION_REQUIRED, IN_SERVICE}"
          - "survivor_move_id != this move id"
          - "survivor move resident_id == this move resident_id OR survivor destination address_hash == this move destination address_hash"
        side_effects:
          - "hop 1: duplicate_flag = CONFIRMED_DUPLICATE, duplicate_of_move_id = survivor_move_id, version incremented by 1"
          - "hop 2 (caused by hop 1 reaching a terminal state): every UtilityOrder of this move with provision_status IN {DRAFT, SCHEDULED, ACTIVE_SERVICE, SUSPENDED} -> CANCELLED with cancellation_reason DUPLICATE_MERGED and both window fields cleared"
          - "hop 3 (caused by hop 2): each cancelled order with credit_status IN {PENDING_CHECK, DEPOSIT_DUE} -> VOIDED and its CreditCheckHandoff -> VOIDED"
          - "hop 2b (caused by hop 1): every AddressChangeFiling of this move with status IN {DRAFT, SUBMITTED, REJECTED} -> CANCELLED, mail_forwarding_confirmed_at cleared"
          - "hop 2c (caused by hop 1): every ReferralPlacement of this move with placement_status IN {PLACED, ACCEPTED} -> VOIDED"
        note: "resolution DISMISS is the sibling branch: it leaves lifecycle_status untouched, sets duplicate_flag = DISMISSED, clears blocked_reason when it was DUPLICATE_SUSPECTED, and increments version by 1."

  - entity: IdentityVerification
    state_field: status
    initial_state: PENDING
    terminal_states: [PASSED, FAILED, EXPIRED]
    shape: "linear with three-way fan-out from PENDING"
    transitions:
      - transition_id: PENDING_to_PASSED
        from: PENDING
        to: PASSED
        trigger: "POST /identity-verifications/{id}/kba-result with outcome PASSED and score >= KBA_PASS_SCORE"
        actor: ExternalServiceGateway
        preconditions:
          - "status == PENDING"
          - "clock <= expires_at"
        side_effects:
          - "decided_at = clock, kba_score = score"
          - "parent MoveRecord IDENTITY_PENDING -> VERIFIED"
      - transition_id: PENDING_to_FAILED
        from: PENDING
        to: FAILED
        trigger: "POST /identity-verifications/{id}/kba-result with outcome FAILED, or outcome PASSED with score < KBA_PASS_SCORE"
        actor: ExternalServiceGateway
        preconditions:
          - "status == PENDING"
        side_effects:
          - "decided_at = clock, kba_score = score"
          - "parent MoveRecord IDENTITY_PENDING -> IDENTITY_FAILED"
      - transition_id: PENDING_to_EXPIRED
        from: PENDING
        to: EXPIRED
        trigger: "system, when POST /moves/{id}/identity-verifications creates a fresh attempt while this row is PENDING and clock > expires_at"
        actor: system
        preconditions:
          - "status == PENDING"
          - "clock > expires_at"
        side_effects:
          - "decided_at = clock"
          - "the superseding attempt becomes the move's latest IdentityVerification"

  - entity: UtilityOrder
    state_field: provision_status
    initial_state: DRAFT
    terminal_states: [CLOSED, PROVISION_FAILED, CANCELLED, NOT_APPLICABLE]
    shape: "first of two parallel dimensions on the same row; contains the SCHEDULED -> SUSPENDED -> DRAFT recovery cycle"
    transitions:
      - transition_id: DRAFT_to_SCHEDULED
        from: DRAFT
        to: SCHEDULED
        trigger: "POST /utility-orders/{id}/schedule"
        actor: MoveOpsAgent
        preconditions:
          - "parent MoveRecord.lifecycle_status IN {SCHEDULING}"
          - "parent MoveRecord.consent_gate == OPEN"
          - "the parent move's latest IdentityVerification has status PASSED and clock <= MoveRecord.verified_at + IDENTITY_VALIDITY_DAYS"
          - "credit_status IN {NOT_REQUIRED, PENDING_CHECK, CLEARED, DEPOSIT_DUE, DEPOSIT_PAID}: the credit dimension does NOT gate scheduling, only activation, which is what makes the two dimensions independent on one row"
          - "every entry of the winning provider's required_account_fields is a key of account_data with a non-empty value"
          - "for order_kind START: requested_service_date >= clock_date + UtilityProvider.scheduling_lead_days; for order_kind STOP the floor is waived when UtilityProvider.same_day_stop_allowed is true"
          - "scheduled_window_start date == requested_service_date, scheduled_window_end > scheduled_window_start, and the window spans at most MAX_WINDOW_HOURS"
          - "no other UtilityOrder with the same (service_address_id, utility_type) and provision_status IN {SCHEDULED, ACTIVE_SERVICE} has a half-open window [start, end) intersecting this one"
          - "deposit_amount_cents <= DEPOSIT_CAP_CENTS"
        side_effects:
          - "writes requested_service_date, scheduled_window_start, scheduled_window_end, account_data"
          - "adds one occupied window to occupied_window_count(service_address_id, utility_type)"
          - "recomputes parent MoveRecord.readiness_score (utility_component rises)"
      - transition_id: SCHEDULED_to_ACTIVE_SERVICE
        from: SCHEDULED
        to: ACTIVE_SERVICE
        trigger: "POST /utility-orders/{id}/activation"
        actor: ProviderAgent
        preconditions:
          - "acting ProviderAgent X-User-ID == UtilityOrder.provider_id"
          - "clock >= scheduled_window_start"
          - "credit_status IN {NOT_REQUIRED, CLEARED, DEPOSIT_PAID} — this is the ONLY point at which the credit dimension gates the provision dimension"
          - "parent MoveRecord.consent_gate == OPEN"
          - "confirmation_code is present and non-empty"
        side_effects:
          - "writes confirmation_code"
          - "keeps the occupancy window occupied (ACTIVE_SERVICE still counts)"
          - "recomputes parent MoveRecord.readiness_score, then bubbles up SCHEDULING -> IN_SERVICE when that transition's preconditions now hold"
      - transition_id: ACTIVE_SERVICE_to_CLOSED
        from: ACTIVE_SERVICE
        to: CLOSED
        trigger: "POST /utility-orders/{id}/closure"
        actor: ProviderAgent
        preconditions:
          - "acting ProviderAgent X-User-ID == UtilityOrder.provider_id"
          - "clock >= scheduled_window_end"
        side_effects:
          - "releases the occupancy window (occupied_window_count decreases by 1) while keeping both window fields for audit"
          - "recomputes parent MoveRecord.readiness_score"
      - transition_id: SCHEDULED_to_PROVISION_FAILED
        from: SCHEDULED
        to: PROVISION_FAILED
        trigger: "POST /utility-orders/{id}/provision-failure"
        actor: ProviderAgent
        preconditions:
          - "acting ProviderAgent X-User-ID == UtilityOrder.provider_id"
          - "failure_reason is present and non-empty"
        side_effects:
          - "hop 1: writes failure_reason, clears scheduled_window_start and scheduled_window_end (releases the occupancy window)"
          - "hop 2 (caused by hop 1): credit_status IN {PENDING_CHECK, DEPOSIT_DUE} -> VOIDED and the order's CreditCheckHandoff with handoff_status IN {SUBMITTED, RESPONDED} -> VOIDED"
          - "hop 3 (caused by hop 1): parent MoveRecord SCHEDULING -> ATTENTION_REQUIRED with blocked_reason PROVISION_FAILED, or IN_SERVICE -> ATTENTION_REQUIRED"
      - transition_id: DRAFT_to_PROVISION_FAILED
        from: DRAFT
        to: PROVISION_FAILED
        trigger: "system, second hop of the cascade started by POST /credit-check-handoffs/{id}/bureau-response with a score below CREDIT_DEPOSIT_FLOOR"
        actor: system
        preconditions:
          - "the order's credit_status just became DECLINED"
        side_effects:
          - "failure_reason = CREDIT_DECLINED"
          - "third hop: parent MoveRecord SCHEDULING -> ATTENTION_REQUIRED with blocked_reason CREDIT_DECLINED"
      - transition_id: OPEN_PROVISION_to_SUSPENDED
        from: [DRAFT, SCHEDULED, ACTIVE_SERVICE]
        to: SUSPENDED
        trigger: "system, third hop of the cascade started by POST /consent-records/{id}/revocation for scope UTILITY_SETUP or USPS_FILING"
        actor: system
        preconditions:
          - "parent MoveRecord.consent_gate just became BLOCKED"
        side_effects:
          - "clears scheduled_window_start and scheduled_window_end, releasing the occupancy window when the order had one"
          - "fourth hop (caused by this suspension): credit_status IN {PENDING_CHECK, DEPOSIT_DUE} -> VOIDED and the order's CreditCheckHandoff -> VOIDED"
      - transition_id: SUSPENDED_to_DRAFT
        from: SUSPENDED
        to: DRAFT
        trigger: "system, third hop of the cascade started by POST /residents/{id}/consent-records granting the revoked scope again"
        actor: system
        preconditions:
          - "parent MoveRecord.consent_gate just became OPEN again"
        side_effects:
          - "requested_service_date, scheduled_window_start and scheduled_window_end stay null so the order must be re-scheduled from DRAFT (closes the SCHEDULED -> SUSPENDED -> DRAFT cycle)"
          - "credit_status VOIDED stays VOIDED; a fresh POST /utility-orders/{id}/credit-checks is required when the provider demands one"
      - transition_id: OPEN_PROVISION_to_CANCELLED
        from: [DRAFT, SCHEDULED, ACTIVE_SERVICE, SUSPENDED]
        to: CANCELLED
        trigger: "system, second hop of the cascade started by POST /moves/{id}/cancellation or POST /moves/{id}/duplicate-resolution with resolution MERGE_INTO"
        actor: system
        preconditions:
          - "parent MoveRecord reached CANCELLED or DUPLICATE_MERGED"
        side_effects:
          - "cancellation_reason = MOVE_CANCELLED or DUPLICATE_MERGED per the triggering transition"
          - "clears both window fields, restoring occupied_window_count(service_address_id, utility_type) to its pre-schedule value"
          - "next hop: credit_status IN {PENDING_CHECK, DEPOSIT_DUE} -> VOIDED and the CreditCheckHandoff -> VOIDED"
      - transition_id: DRAFT_to_NOT_APPLICABLE
        from: DRAFT
        to: NOT_APPLICABLE
        trigger: "POST /utility-orders/{id}/waiver"
        actor: MoveOpsAgent
        preconditions:
          - "parent MoveRecord.lifecycle_status IN {SCHEDULING, ATTENTION_REQUIRED}"
          - "waiver_reason is present and non-empty"
        side_effects:
          - "credit_status IN {PENDING_CHECK, DEPOSIT_DUE} -> VOIDED and any CreditCheckHandoff -> VOIDED"
          - "recomputes parent MoveRecord.readiness_score (NOT_APPLICABLE counts as satisfied in utility_component)"

  - entity: UtilityOrder
    state_field: credit_status
    initial_state: "PENDING_CHECK when the winning provider has credit_check_required true, otherwise NOT_REQUIRED"
    terminal_states: [CLEARED, DEPOSIT_PAID, DECLINED, VOIDED]
    shape: "second, independent dimension on the same row; advances on bureau traffic regardless of provision_status"
    transitions:
      - transition_id: PENDING_CHECK_to_CLEARED
        from: PENDING_CHECK
        to: CLEARED
        trigger: "POST /credit-check-handoffs/{id}/bureau-response with score >= CREDIT_CLEAR_THRESHOLD"
        actor: ExternalServiceGateway
        preconditions:
          - "the handoff's handoff_status == SUBMITTED"
        side_effects:
          - "CreditCheckHandoff.result = CLEAR, handoff_status = RESPONDED, responded_at = clock"
          - "deposit_amount_cents stays 0"
      - transition_id: PENDING_CHECK_to_DEPOSIT_DUE
        from: PENDING_CHECK
        to: DEPOSIT_DUE
        trigger: "POST /credit-check-handoffs/{id}/bureau-response with CREDIT_DEPOSIT_FLOOR <= score < CREDIT_CLEAR_THRESHOLD"
        actor: ExternalServiceGateway
        preconditions:
          - "the handoff's handoff_status == SUBMITTED"
        side_effects:
          - "CreditCheckHandoff.result = DEPOSIT_REQUIRED, handoff_status = RESPONDED"
          - "writes deposit_amount_cents from calculations.credit_deposit_amount_cents final_at_bureau_response variant, reading readiness_snapshot (never the live readiness_score)"
          - "raises open_deposit_liability_cents(move) by the new deposit_amount_cents"
      - transition_id: PENDING_CHECK_to_DECLINED
        from: PENDING_CHECK
        to: DECLINED
        trigger: "POST /credit-check-handoffs/{id}/bureau-response with score < CREDIT_DEPOSIT_FLOOR"
        actor: ExternalServiceGateway
        preconditions:
          - "the handoff's handoff_status == SUBMITTED"
        side_effects:
          - "CreditCheckHandoff.result = DECLINED, handoff_status = RESPONDED"
          - "second hop: provision_status DRAFT -> PROVISION_FAILED with failure_reason CREDIT_DECLINED"
          - "third hop: parent MoveRecord SCHEDULING -> ATTENTION_REQUIRED with blocked_reason CREDIT_DECLINED"
      - transition_id: DEPOSIT_DUE_to_DEPOSIT_PAID
        from: DEPOSIT_DUE
        to: DEPOSIT_PAID
        trigger: "POST /utility-orders/{id}/deposit-payments"
        actor: MoveOpsAgent
        preconditions:
          - "amount_cents == deposit_amount_cents (exact match, no partial payment)"
          - "provision_status IN {DRAFT, SCHEDULED}"
        side_effects:
          - "deposit_paid_cents = amount_cents"
          - "drops open_deposit_liability_cents(move) by deposit_amount_cents"
      - transition_id: OPEN_CREDIT_to_VOIDED
        from: [PENDING_CHECK, DEPOSIT_DUE]
        to: VOIDED
        trigger: "system, final hop of the suspension, waiver, provision-failure, cancellation and duplicate-merge cascades"
        actor: system
        preconditions:
          - "the order's provision_status just became SUSPENDED, NOT_APPLICABLE, PROVISION_FAILED or CANCELLED"
        side_effects:
          - "the order's CreditCheckHandoff with handoff_status IN {SUBMITTED, RESPONDED} -> VOIDED"
          - "restores open_deposit_liability_cents(move) to its pre-handoff value; deposit_amount_cents is retained for audit but no longer counted"

  - entity: CreditCheckHandoff
    state_field: handoff_status
    initial_state: SUBMITTED
    terminal_states: [RESPONDED, VOIDED]
    shape: "linear with a compensating exit to VOIDED"
    transitions:
      - transition_id: CREATION_to_SUBMITTED
        from: null
        to: SUBMITTED
        trigger: "POST /utility-orders/{id}/credit-checks"
        actor: MoveOpsAgent
        preconditions:
          - "UtilityOrder.credit_status == PENDING_CHECK"
          - "UtilityOrder.provision_status IN {DRAFT}"
          - "parent MoveRecord.lifecycle_status IN {SCHEDULING, ATTENTION_REQUIRED} and consent_gate == OPEN"
          - "no other CreditCheckHandoff for this order has handoff_status SUBMITTED"
        side_effects:
          - "writes submitted_by_user_id = X-User-ID"
          - "writes UtilityOrder.readiness_snapshot = parent MoveRecord.readiness_score at this instant (the evaluation-order pin for the deposit formula)"
      - transition_id: SUBMITTED_to_RESPONDED
        from: SUBMITTED
        to: RESPONDED
        trigger: "POST /credit-check-handoffs/{id}/bureau-response"
        actor: ExternalServiceGateway
        preconditions:
          - "handoff_status == SUBMITTED"
          - "300 <= score <= 850"
        side_effects:
          - "writes score, result and responded_at"
          - "advances the order's credit_status dimension per the score band"
      - transition_id: OPEN_HANDOFF_to_VOIDED
        from: [SUBMITTED, RESPONDED]
        to: VOIDED
        trigger: "system, hop of the suspension, waiver, provision-failure, cancellation and duplicate-merge cascades"
        actor: system
        preconditions:
          - "the parent UtilityOrder left the set {DRAFT, SCHEDULED, ACTIVE_SERVICE} for SUSPENDED, NOT_APPLICABLE, PROVISION_FAILED or CANCELLED"
        side_effects:
          - "no bureau response is accepted afterwards"

  - entity: AddressChangeFiling
    state_field: status
    initial_state: DRAFT
    terminal_states: [CONFIRMED, CANCELLED]
    shape: "cyclic: SUBMITTED -> REJECTED -> SUBMITTED, bounded by MAX_FILING_RESUBMITS"
    transitions:
      - transition_id: CREATION_to_DRAFT
        from: null
        to: DRAFT
        trigger: "POST /moves/{id}/address-change-filings"
        actor: MoveOpsAgent | ComplianceOfficer
        preconditions:
          - "parent MoveRecord.lifecycle_status IN {IDENTITY_PENDING, IDENTITY_FAILED, VERIFIED, SCHEDULING, ATTENTION_REQUIRED, IN_SERVICE}: the lifecycle gate is deliberately permissive here so that the identity gate (validations priority 16, ERR_IDENTITY_NOT_VERIFIED) is the rule that actually rejects a filing prepared before identity cleared, rather than the coarser ERR_MOVE_NOT_ACTIONABLE"
          - "MoveRecord.verified_at is non-null (a filing may not be opened for an unverified move; this is the precondition that surfaces ERR_IDENTITY_NOT_VERIFIED from IDENTITY_PENDING and IDENTITY_FAILED)"
          - "no other AddressChangeFiling of this move has status IN {DRAFT, SUBMITTED, CONFIRMED}"
        side_effects:
          - "writes resident_id from the move and forward_end_date = forward_start_date + FORWARD_TERM_DAYS (365) - 1 day"
          - "recomputes parent MoveRecord.readiness_score (filing_component stays 0 while DRAFT)"
      - transition_id: DRAFT_to_SUBMITTED
        from: DRAFT
        to: SUBMITTED
        trigger: "POST /address-change-filings/{id}/submission"
        actor: MoveOpsAgent | ComplianceOfficer
        preconditions:
          - "parent MoveRecord.lifecycle_status IN {VERIFIED, SCHEDULING, ATTENTION_REQUIRED, IN_SERVICE}"
          - "the parent move's latest IdentityVerification has status PASSED and clock <= MoveRecord.verified_at + IDENTITY_VALIDITY_DAYS"
          - "a ConsentRecord with scope USPS_FILING and state GRANTED exists for this resident (move_id equal to this move or null)"
          - "X-User-ID != the reviewer_user_id of any PASSED MANUAL_OVERRIDE IdentityVerification of this move (segregation of duties)"
          - "destination ServiceAddress.usps_deliverable == true"
          - "forward_start_date >= clock_date"
          - "no other AddressChangeFiling with the same resident_id and status IN {SUBMITTED, CONFIRMED} has a forwarding period [forward_start_date, forward_end_date] intersecting this one (MAX_ACTIVE_FORWARDS_PER_RESIDENT is 1)"
        side_effects:
          - "writes submitted_by_user_id = X-User-ID"
          - "recomputes parent MoveRecord.readiness_score (filing_component becomes 60)"
      - transition_id: SUBMITTED_to_CONFIRMED
        from: SUBMITTED
        to: CONFIRMED
        trigger: "POST /address-change-filings/{id}/usps-response with outcome CONFIRMED"
        actor: ExternalServiceGateway
        preconditions:
          - "status == SUBMITTED"
          - "usps_confirmation_code is present and non-empty"
        side_effects:
          - "writes usps_confirmation_code and mail_forwarding_confirmed_at = clock"
          - "recomputes parent MoveRecord.readiness_score (filing_component becomes 100), then bubbles up SCHEDULING -> IN_SERVICE when that transition's preconditions now hold"
      - transition_id: SUBMITTED_to_REJECTED
        from: SUBMITTED
        to: REJECTED
        trigger: "POST /address-change-filings/{id}/usps-response with outcome REJECTED"
        actor: ExternalServiceGateway
        preconditions:
          - "status == SUBMITTED"
          - "reject_reason is present and non-empty"
        side_effects:
          - "writes reject_reason"
          - "second hop: parent MoveRecord SCHEDULING -> ATTENTION_REQUIRED with blocked_reason FILING_REJECTED"
      - transition_id: REJECTED_to_SUBMITTED
        from: REJECTED
        to: SUBMITTED
        trigger: "POST /address-change-filings/{id}/submission (resubmission, closes the cycle)"
        actor: MoveOpsAgent | ComplianceOfficer
        preconditions:
          - "resubmit_count < MAX_FILING_RESUBMITS"
          - "every DRAFT_to_SUBMITTED precondition holds again at resubmission time"
        side_effects:
          - "increments resubmit_count by 1, clears reject_reason, rewrites submitted_by_user_id"
          - "recomputes parent MoveRecord.readiness_score (filing_component returns to 60)"
      - transition_id: OPEN_FILING_to_CANCELLED
        from: [DRAFT, SUBMITTED, REJECTED]
        to: CANCELLED
        trigger: "POST /address-change-filings/{id}/cancellation, or system as a hop of the move cancellation and duplicate-merge cascades"
        actor: ComplianceOfficer | system
        preconditions:
          - "status IN {DRAFT, SUBMITTED, REJECTED}"
        side_effects:
          - "writes cancellation_reason and clears mail_forwarding_confirmed_at"
          - "recomputes parent MoveRecord.readiness_score (filing_component returns to 0) when the move is still non-terminal"

  - entity: ReferralPlacement
    state_field: placement_status
    initial_state: PLACED
    terminal_states: [DECLINED, SETTLED, REVERSED, VOIDED]
    shape: "fork-join branching at ACCEPTED with disjoint side-effect sets: the CONVERTED branch posts ledger entries, the DECLINED branch posts none"
    transitions:
      - transition_id: CREATION_to_PLACED
        from: null
        to: PLACED
        trigger: "POST /moves/{id}/referral-placements"
        actor: MoveOpsAgent
        preconditions:
          - "expected_move_version == MoveRecord.version"
          - "parent MoveRecord.lifecycle_status IN {VERIFIED, SCHEDULING, ATTENTION_REQUIRED, IN_SERVICE}"
          - "Resident.marketing_opt_out == false"
          - "a ConsentRecord with scope PARTNER_MARKETING and state GRANTED exists for this resident"
          - "ReferralPartner.partner_status == ACTIVE"
          - "no other ReferralPlacement of this move with the same vertical has placement_status IN {PLACED, ACCEPTED, CONVERTED, SETTLED}"
          - "count of this partner's placements whose placed_at falls in the calendar month of the logical clock < monthly_placement_cap"
        side_effects:
          - "writes vertical from the partner, placed_at = clock"
          - "increments MoveRecord.version by 1"
      - transition_id: PLACED_to_ACCEPTED
        from: PLACED
        to: ACCEPTED
        trigger: "POST /referral-placements/{id}/acceptance"
        actor: PartnerAgent
        preconditions:
          - "acting PartnerAgent X-User-ID == ReferralPlacement.partner_id"
          - "placement_status == PLACED"
          - "parent MoveRecord.consent_gate == OPEN"
        side_effects:
          - "writes accepted_at = clock (the PLACEMENT_ACCEPTANCE attribution anchor)"
      - transition_id: ACCEPTED_to_CONVERTED
        from: ACCEPTED
        to: CONVERTED
        trigger: "POST /referral-placements/{id}/conversions"
        actor: PartnerAgent
        preconditions:
          - "acting PartnerAgent X-User-ID == ReferralPlacement.partner_id"
          - "clock <= attribution anchor + ReferralPartner.attribution_window_days (inclusive), where the anchor is placed_at for PLACEMENT_CLICK and accepted_at for PLACEMENT_ACCEPTANCE"
          - "gross_revenue_cents >= 1"
          - "Resident.marketing_opt_out == false"
        side_effects:
          - "writes gross_revenue_cents, converted_at = clock"
          - "writes attributed_share_cents from calculations.referral_attributed_share_cents provisional_at_conversion variant and feed_source_share_cents from the same rule"
          - "posts a RevenueShareLedgerEntry ACCRUAL of +attributed_share_cents and a FEED_SOURCE_SHARE of -feed_source_share_cents"
          - "recomputes FeedSource.accrued_share_cents (per-placement rounding, then sum)"
      - transition_id: ACCEPTED_to_DECLINED
        from: ACCEPTED
        to: DECLINED
        trigger: "POST /referral-placements/{id}/decline"
        actor: PartnerAgent
        preconditions:
          - "acting PartnerAgent X-User-ID == ReferralPlacement.partner_id"
          - "decline_reason is present and non-empty"
        side_effects:
          - "writes decline_reason"
          - "posts no RevenueShareLedgerEntry, leaves attributed_share_cents at 0 and FeedSource.accrued_share_cents unchanged (this is the branch divergence against ACCEPTED_to_CONVERTED)"
      - transition_id: CONVERTED_to_SETTLED
        from: CONVERTED
        to: SETTLED
        trigger: "POST /referral-placements/{id}/settlement"
        actor: PlatformAdmin
        preconditions:
          - "placement_status == CONVERTED"
          - "settled_gross_revenue_cents >= 1"
        side_effects:
          - "writes settled_gross_revenue_cents and overwrites attributed_share_cents and feed_source_share_cents with the settled_at_settlement variant"
          - "posts an ADJUSTMENT entry for (settled commission - provisional commission) and a FEED_SOURCE_SHARE_ADJUSTMENT entry for -(settled feed share - provisional feed share)"
          - "recomputes FeedSource.accrued_share_cents"
      - transition_id: CONVERTED_to_REVERSED
        from: CONVERTED
        to: REVERSED
        trigger: "POST /referral-placements/{id}/reversal"
        actor: PlatformAdmin | PartnerAgent
        preconditions:
          - "placement_status == CONVERTED"
          - "for PartnerAgent: X-User-ID == ReferralPlacement.partner_id"
          - "reversal_reason is present and non-empty"
        side_effects:
          - "posts a REVERSAL entry of -attributed_share_cents and a FEED_SOURCE_SHARE_REVERSAL entry of +feed_source_share_cents, driving placement_ledger_net_cents(placement) back to exactly 0"
          - "resets attributed_share_cents and feed_source_share_cents to 0 and recomputes FeedSource.accrued_share_cents"
      - transition_id: OPEN_PLACEMENT_to_VOIDED
        from: [PLACED, ACCEPTED]
        to: VOIDED
        trigger: "system, hop of the cascades started by POST /consent-records/{id}/revocation (scope PARTNER_MARKETING or a gate scope), PATCH /residents/{id}/marketing-preferences with marketing_opt_out true, POST /moves/{id}/cancellation, or a MERGE_INTO duplicate resolution"
        actor: system
        preconditions:
          - "the placement had never reached CONVERTED (so no ledger entry exists to reverse)"
        side_effects:
          - "posts no ledger entry; attributed_share_cents stays 0"
          - "frees the (move_id, vertical) uniqueness slot for a future placement"

  - entity: ConsentRecord
    state_field: state
    initial_state: GRANTED
    terminal_states: [SUPERSEDED, REVOKED, EXPIRED]
    shape: "linear with a create-with-supersede entry point guarded by OCC on Resident.version"
    transitions:
      - transition_id: CREATION_to_GRANTED
        from: null
        to: GRANTED
        trigger: "POST /residents/{id}/consent-records"
        actor: Resident | MoveOpsAgent | ComplianceOfficer
        preconditions:
          - "expected_resident_version == Resident.version"
          - "for actor Resident: X-User-ID == path resident id"
          - "when move_id is present it resolves to a MoveRecord whose resident_id equals the path resident id"
          - "expires_at, when present, is strictly after the logical clock"
        side_effects:
          - "writes granted_at = clock, state = GRANTED"
          - "any prior ConsentRecord for the same (resident_id, scope) in state GRANTED -> SUPERSEDED"
          - "increments Resident.version by 1"
          - "recomputes consent_gate and readiness_score for every non-terminal MoveRecord of this resident; a gate flip to OPEN cascades SUSPENDED UtilityOrders back to DRAFT"
      - transition_id: GRANTED_to_SUPERSEDED
        from: GRANTED
        to: SUPERSEDED
        trigger: "system, when POST /residents/{id}/consent-records creates a newer GRANTED record for the same (resident_id, scope)"
        actor: system
        preconditions:
          - "state == GRANTED"
        side_effects:
          - "does not set revoked_at; a SUPERSEDED record never blocks the consent gate"
      - transition_id: GRANTED_to_REVOKED
        from: GRANTED
        to: REVOKED
        trigger: "POST /consent-records/{id}/revocation"
        actor: Resident | ComplianceOfficer
        preconditions:
          - "state == GRANTED"
          - "for actor Resident: X-User-ID == ConsentRecord.resident_id"
        side_effects:
          - "hop 1: writes revoked_at = clock and revocation_reason"
          - "hop 2 (caused by hop 1, scopes UTILITY_SETUP and USPS_FILING): every linked non-terminal MoveRecord recomputes consent_gate to BLOCKED, sets blocked_reason CONSENT_REVOKED, recomputes readiness_score and moves SCHEDULING or IN_SERVICE -> ATTENTION_REQUIRED"
          - "hop 3 (caused by hop 2): every UtilityOrder of those moves with provision_status IN {DRAFT, SCHEDULED, ACTIVE_SERVICE} -> SUSPENDED, clearing its window fields"
          - "hop 4 (caused by hop 3): each suspended order with credit_status IN {PENDING_CHECK, DEPOSIT_DUE} -> VOIDED and its CreditCheckHandoff -> VOIDED"
          - "hop 2b (scope PARTNER_MARKETING only): Resident.marketing_opt_out = true and opted_out_at = clock; hop 3b (caused by hop 2b): every ReferralPlacement of the resident's non-terminal moves in {PLACED, ACCEPTED} -> VOIDED"
      - transition_id: GRANTED_to_EXPIRED
        from: GRANTED
        to: EXPIRED
        trigger: "POST /moves/{id}/consent-evaluations (ops-run checkpoint)"
        actor: MoveOpsAgent | ComplianceOfficer
        preconditions:
          - "state == GRANTED"
          - "expires_at is non-null and clock > expires_at"
        side_effects:
          - "the same cascade hops as GRANTED_to_REVOKED fire for the affected move, with blocked_reason CONSENT_REVOKED"

concurrency_rules:
  - rule_id: consent-create-stale-resident
    parent_entity: Resident
    write_endpoint: "POST /residents/{id}/consent-records"
    occ_field: "expected_resident_version"
    description: |
      Creating a ConsentRecord against a Resident whose version has advanced since the client last
      observed it is rejected. The new record legitimately supersedes the prior GRANTED record for the
      same scope, so a writer holding a stale view of the resident would silently discard a consent
      decision it never saw.
    error_id: ERR_STALE_RESIDENT_VERSION
    http_status: 412
  - rule_id: referral-placement-create-stale-move
    parent_entity: MoveRecord
    write_endpoint: "POST /moves/{id}/referral-placements"
    occ_field: "expected_move_version"
    description: |
      Placing a referral against a MoveRecord whose version has advanced since the client last read it
      is rejected. Placement eligibility is derived from move-level state (lifecycle, consent gate,
      per-vertical slot occupancy), so a stale-version writer may be placing against a move that has
      since been merged, cancelled or gated.
    error_id: ERR_STALE_MOVE_VERSION
    http_status: 412
  - rule_id: duplicate-resolution-stale-move
    parent_entity: MoveRecord
    write_endpoint: "POST /moves/{id}/duplicate-resolution"
    occ_field: "expected_move_version"
    description: |
      Resolving a suspected duplicate against a MoveRecord whose version has advanced since the client
      read the match evidence is rejected. A merge supersedes the whole move aggregate, so it must be
      decided against the exact version whose duplicate_match_score the reviewer inspected.
    error_id: ERR_STALE_MOVE_VERSION
    http_status: 412

calculations:
  - name: duplicate_match_score
    trigger: "on POST /moves (immediately after the MoveRecord row is written), and re-run on POST /moves/{id}/duplicate-resolution with resolution RESCORE"
    algorithm: weighted_scoring
    formula: |
      # All arithmetic uses Decimal with ROUND_HALF_UP; the score is a 0.00..1.00 ratio at 2dp.
      candidate_pool(new_move, pool_kind):
        base = every MoveRecord M where
                 M.id != new_move.id
                 AND M.created_at < new_move.created_at                     # strict: only earlier rows
                 AND abs(days_between(M.move_date, new_move.move_date)) <= FeedSource(new_move).dedupe_window_days
                 AND ( M.resident_id == new_move.resident_id
                       OR ServiceAddress(M.destination_address_id).address_hash
                          == ServiceAddress(new_move.destination_address_id).address_hash
                       OR lower(Resident(M.resident_id).email) == lower(Resident(new_move.resident_id).email) )
        if pool_kind == OPEN:      base AND M.lifecycle_status IN OPEN_LIFECYCLE_STATES
        if pool_kind == CANCELLED: base AND M.lifecycle_status IN {CANCELLED, DUPLICATE_MERGED}

      name_component(M):
        1.00 if lower(trim(Resident(M).full_name)) == lower(trim(Resident(new).full_name))
        else PARTIAL_NAME_SCORE if the two names share an identical last token (surname match)
        else 0.00
      email_component(M):
        1.00 if lower(Resident(M).email) == lower(Resident(new).email) else 0.00
      address_component(M):
        1.00 if ServiceAddress(M.destination_address_id).address_hash == ServiceAddress(new.destination_address_id).address_hash
        else PARTIAL_ADDRESS_SCORE if same postal_code AND same state_code
        else 0.00
      recency_component(M):
        window = FeedSource(new).dedupe_window_days
        gap    = abs(days_between(M.move_date, new.move_date))
        max(Decimal("0.00"), (window - gap) / window)                        # linear decay, 0 at the edge

      raw(M) = name_component(M)    * W_NAME
             + email_component(M)   * W_EMAIL
             + address_component(M) * W_ADDRESS
             + recency_component(M) * W_RECENCY
      score(M) = round_half_up(raw(M), 2)

      # Ranking is deterministic and never reads id: score DESC, then created_at ASC, then move_date ASC.
      best = first(sort(candidate_pool, by=[score DESC, created_at ASC, move_date ASC]))
      if best is null:  duplicate_match_score = 0.00 ; duplicate_flag = NONE ; candidate fk = null
      else:             duplicate_match_score = score(best)
                        duplicate_candidate_move_id (OPEN pool) / reactivation_candidate_move_id (CANCELLED pool) = best.id
                        duplicate_flag = SUSPECTED if score(best) >= DUP_SUSPECT_THRESHOLD else NONE
    input_set: |
      OPEN_LIFECYCLE_STATES = {INTAKE, IDENTITY_PENDING, IDENTITY_FAILED, VERIFIED, SCHEDULING,
      ATTENTION_REQUIRED, IN_SERVICE}. The OPEN variant scans only those; the CANCELLED variant scans only
      {CANCELLED, DUPLICATE_MERGED}. Moves already flagged CONFIRMED_DUPLICATE are excluded from both pools
      (they are represented by their survivor). Both pools additionally require created_at strictly earlier
      than the new move, so scoring is a pure function of the rows that existed before this POST.
    constants:
      DUP_SUSPECT_THRESHOLD: 0.80
      W_NAME: 0.35
      W_EMAIL: 0.25
      W_ADDRESS: 0.25
      W_RECENCY: 0.15
      PARTIAL_NAME_SCORE: 0.60
      PARTIAL_ADDRESS_SCORE: 0.50
      DEFAULT_DEDUPE_WINDOW_DAYS: 30
    precision: "each component is an exact 2dp Decimal constant; the weighted sum is rounded once to 2 decimal places with ROUND_HALF_UP; comparison against DUP_SUSPECT_THRESHOLD uses >= on the rounded value"
    variants:
      - name: open_candidate_pass
        when: "always runs first on POST /moves; pool_kind OPEN"
        difference: "writes duplicate_candidate_move_id and may set duplicate_flag SUSPECTED, which sets blocked_reason DUPLICATE_SUSPECTED and holds the move in INTAKE until POST /moves/{id}/duplicate-resolution decides"
      - name: cancelled_candidate_pass
        when: "runs on the same POST /moves only when the OPEN pass produced no SUSPECTED match; pool_kind CANCELLED"
        difference: "writes reactivation_candidate_move_id, and also writes duplicate_match_score when the OPEN pass found no candidate at all (so the score is observable); it NEVER sets duplicate_flag, never sets duplicate_candidate_move_id, and never blocks the move, because a cancelled predecessor is a re-book signal rather than a live collision. Identical resident/address/date data therefore yields the same numeric score but a different observable outcome in the two variants."

  - name: move_readiness_score
    trigger: "recomputed at the end of every write that touches a move's identity, utility orders, filing, or consent state, and read by GET /moves/{id}/readiness"
    algorithm: weighted_scoring
    formula: |
      # Components are integers 0..100. Each component is rounded to 0dp BEFORE weighting;
      # the weighted sum is rounded to 0dp AFTER summing. No intermediate float is retained.
      identity_component:
        100 if the move's latest IdentityVerification (by created_at DESC) has status PASSED
             AND clock <= MoveRecord.verified_at + IDENTITY_VALIDITY_DAYS
        50  if that latest verification has status PENDING
        0   otherwise (FAILED, EXPIRED, none, or a PASSED verification whose validity window has lapsed)

      utility_component:
        mapped = count(UtilityOrder WHERE move_id == M AND provision_status != CANCELLED)
        done   = count(UtilityOrder WHERE move_id == M
                       AND provision_status IN {SCHEDULED, ACTIVE_SERVICE, CLOSED, NOT_APPLICABLE})
        0 if mapped == 0 else round_half_up(100 * done / mapped, 0)

      filing_component:
        100 if the move's newest non-CANCELLED AddressChangeFiling is CONFIRMED
        60  if it is SUBMITTED
        0   otherwise (DRAFT, REJECTED, none, all-cancelled)

      consent_component:
        0   if MoveRecord.consent_gate == BLOCKED
        100 if gate OPEN and GRANTED consents exist for BOTH scopes UTILITY_SETUP and USPS_FILING
        50  if gate OPEN and exactly one of those two scopes has a GRANTED consent
        0   if gate OPEN and neither does

      post_verification: raw = W_IDENTITY*identity + W_UTILITY*utility + W_FILING*filing + W_CONSENT*consent
      pre_verification:  raw = (W_UTILITY*utility + W_FILING*filing + W_CONSENT*consent) / PRE_VERIFICATION_DIVISOR
      readiness_score = clamp(round_half_up(raw, 0), 0, 100)
    input_set: "only the move's own children: its IdentityVerifications, its non-CANCELLED UtilityOrders, its newest non-CANCELLED AddressChangeFiling, and the ConsentRecords in state GRANTED for its resident whose move_id is null or equal to this move"
    constants:
      W_IDENTITY: 0.30
      W_UTILITY: 0.30
      W_FILING: 0.20
      W_CONSENT: 0.20
      PRE_VERIFICATION_DIVISOR: 0.70
      IDENTITY_VALIDITY_DAYS: 30
    precision: "components rounded to 0 decimal places with ROUND_HALF_UP before weighting; weighted sum rounded to 0 decimal places with ROUND_HALF_UP after summing; result clamped to the inclusive range 0..100"
    variants:
      - name: pre_verification
        when: "MoveRecord.lifecycle_status IN {INTAKE, IDENTITY_PENDING, IDENTITY_FAILED}; also selectable explicitly via GET /moves/{id}/readiness?variant=pre_verification"
        difference: "drops the identity term entirely and renormalizes the remaining three weights by dividing by PRE_VERIFICATION_DIVISOR (0.70), so an unverified move is scored on what it can control. For utility=100, filing=0, consent=50 this yields round_half_up((0.30*100 + 0.20*0 + 0.20*50)/0.70, 0) = 57."
      - name: post_verification
        when: "MoveRecord.lifecycle_status IN {VERIFIED, SCHEDULING, ATTENTION_REQUIRED, IN_SERVICE, COMPLETED, CANCELLED, DUPLICATE_MERGED} (the two terminal states keep the four-weight form so a cancelled or merged move still reports a defined score); also selectable explicitly via GET /moves/{id}/readiness?variant=post_verification"
        difference: "applies all four weights with no renormalization. The same utility=100, filing=0, consent=50 data yields 0.30*100 + 0.30*100 + 0.20*0 + 0.20*50 = 70 when identity is 100, and 40 when identity is 0 — three different numbers from one snapshot of children, decided purely by variant and identity state."

  - name: credit_deposit_amount_cents
    trigger: "the estimate variant runs during POST /moves/{id}/provider-mapping for every credit-check-required order; the final variant runs on POST /credit-check-handoffs/{id}/bureau-response"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is PINNED and observable, because the deposit reads a snapshot that an
      # earlier call froze:
      #   (1) POST /utility-orders/{id}/credit-checks writes UtilityOrder.readiness_snapshot =
      #       the move's readiness_score as of that instant;
      #   (2) POST /credit-check-handoffs/{id}/bureau-response computes the deposit from that
      #       frozen snapshot (never from the live readiness_score);
      #   (3) after the deposit is written, the move's readiness_score is recomputed.
      # So a readiness change landing between (1) and (2) does NOT move the deposit, while the
      # same change landing before (1) does.

      band(score):
        CLEAR    if score >= CREDIT_CLEAR_THRESHOLD          # 640 and above
        DEPOSIT  if CREDIT_DEPOSIT_FLOOR <= score < CREDIT_CLEAR_THRESHOLD   # 580..639
        DECLINED if score < CREDIT_DEPOSIT_FLOOR             # 579 and below

      if band == CLEAR:    deposit_amount_cents = 0 ; credit_status = CLEARED
      if band == DECLINED: deposit_amount_cents = 0 ; credit_status = DECLINED
      if band == DEPOSIT:
        base = UtilityProvider.flat_deposit_cents  if deposit_policy == FLAT
               DEPOSIT_BASE_CENTS                  if deposit_policy == CREDIT_SCORE_BASED
        score_multiplier =
          SCORE_MULT_LOW  if CREDIT_DEPOSIT_FLOOR <= score <= 599      # 1.50
          SCORE_MULT_MID  if 600 <= score <= 619                       # 1.25
          SCORE_MULT_HIGH if 620 <= score <= 639                       # 1.00
        readiness_multiplier =                       # reads UtilityOrder.readiness_snapshot ONLY
          READINESS_MULT_WEAK   if readiness_snapshot < 50             # 1.20
          READINESS_MULT_NORMAL if 50 <= readiness_snapshot <= 79      # 1.00
          READINESS_MULT_STRONG if readiness_snapshot >= 80            # 0.90
        deposit_amount_cents = min(
            round_half_up(base * score_multiplier * readiness_multiplier, 0),
            DEPOSIT_CAP_CENTS)
        credit_status = DEPOSIT_DUE
    input_set: "the single UtilityOrder under check, its UtilityProvider's deposit_policy/flat_deposit_cents, the bureau score on the CreditCheckHandoff, and the order's frozen readiness_snapshot"
    constants:
      CREDIT_CLEAR_THRESHOLD: 640
      CREDIT_DEPOSIT_FLOOR: 580
      DEPOSIT_BASE_CENTS: 15000
      DEPOSIT_CAP_CENTS: 50000
      SCORE_MULT_LOW: 1.50
      SCORE_MULT_MID: 1.25
      SCORE_MULT_HIGH: 1.00
      READINESS_MULT_WEAK: 1.20
      READINESS_MULT_NORMAL: 1.00
      READINESS_MULT_STRONG: 0.90
      ESTIMATE_SCORE_MULTIPLIER: 1.50
    precision: "the product base * score_multiplier * readiness_multiplier is computed as an exact Decimal and rounded once to 0 decimal places (whole cents) with ROUND_HALF_UP, then capped at DEPOSIT_CAP_CENTS; band comparisons use >= on the integer bureau score"
    variants:
      - name: estimate_at_mapping
        when: "POST /moves/{id}/provider-mapping, before any bureau score exists"
        difference: "assumes the worst score band (score_multiplier = ESTIMATE_SCORE_MULTIPLIER 1.50) and a neutral readiness_multiplier of 1.00, writing the result to UtilityOrder.deposit_estimate_cents and leaving deposit_amount_cents 0. For DEPOSIT_BASE_CENTS this is 22500."
      - name: final_at_bureau_response
        when: "POST /credit-check-handoffs/{id}/bureau-response with band DEPOSIT"
        difference: "uses the real score band and the frozen readiness_snapshot, writing deposit_amount_cents. Identical provider data therefore diverges from the estimate: score 639 with readiness_snapshot 40 gives round_half_up(15000*1.00*1.20)=18000 against an estimate of 22500, and score 639 with snapshot 85 gives 13500."

  - name: referral_attributed_share_cents
    trigger: "on POST /referral-placements/{id}/conversions (provisional), POST /referral-placements/{id}/settlement (settled), and POST /referral-placements/{id}/reversal (zeroing)"
    algorithm: waterfall_allocation
    formula: |
      # Three ordered buckets per placement: partner commission -> feed-source share -> platform remainder.
      # Rounding happens exactly twice per placement (commission, then feed share); the platform
      # remainder is a subtraction and is NEVER rounded a second time.

      commission_cents =
        ReferralPartner.bounty_cents                                             if payout_model == FLAT_BOUNTY
        round_half_up(gross * ReferralPartner.rev_share_pct * (1 - PROVISIONAL_HOLDBACK_PCT), 0)
                                                                                 if payout_model == REV_SHARE_PCT and variant == provisional_at_conversion
        round_half_up(settled_gross * ReferralPartner.rev_share_pct, 0)           if payout_model == REV_SHARE_PCT and variant == settled_at_settlement

      feed_source_share_cents = round_half_up(commission_cents * FeedSource.referral_revenue_share_pct, 0)
      platform_remainder_cents = commission_cents - feed_source_share_cents      # exact, no rounding

      attributed_share_cents = commission_cents

      # Ledger postings (RevenueShareLedgerEntry, immutable append-only):
      #   conversion : ACCRUAL              +commission_cents
      #                FEED_SOURCE_SHARE    -feed_source_share_cents
      #   settlement : ADJUSTMENT                    +(settled_commission - provisional_commission)
      #                FEED_SOURCE_SHARE_ADJUSTMENT  -(settled_feed_share - provisional_feed_share)
      #   reversal   : REVERSAL                      -attributed_share_cents
      #                FEED_SOURCE_SHARE_REVERSAL    +feed_source_share_cents
      # Conserved quantity:
      #   placement_ledger_net_cents(P) = sum(amount_cents WHERE placement_id == P)
      #   equals the placement's current attributed_share_cents - feed_source_share_cents at all times,
      #   and equals exactly 0 once the placement is REVERSED.

      # PINNED aggregation order — round per placement, then sum (never sum-then-round):
      FeedSource.accrued_share_cents =
        sum over ReferralPlacement P of this feed source with placement_status IN {CONVERTED, SETTLED}
            of P.feed_source_share_cents        # each term already rounded above
    input_set: "the placement being converted/settled/reversed, its ReferralPartner payout terms, and the FeedSource of the placement's move; the accrued_share_cents roll-up includes only placements in CONVERTED or SETTLED (DECLINED, VOIDED and REVERSED placements contribute nothing)"
    constants:
      PROVISIONAL_HOLDBACK_PCT: 0.10
    precision: "commission and feed-source share are each rounded to 0 decimal places (whole cents) with ROUND_HALF_UP; the platform remainder is exact subtraction; FeedSource.accrued_share_cents sums the already-rounded per-placement shares, so two placements of gross 3715 at rev_share_pct 0.30 and referral_revenue_share_pct 0.175 accrue 176 + 176 = 352, not the 351 a sum-then-round would produce"
    variants:
      - name: provisional_at_conversion
        when: "POST /referral-placements/{id}/conversions"
        difference: "withholds PROVISIONAL_HOLDBACK_PCT (10%) of the gross-based commission against chargeback risk: gross 100000 at rev_share_pct 0.30 gives round_half_up(100000*0.30*0.90)=27000, feed share round_half_up(27000*0.175)=4725, platform remainder 22275"
      - name: settled_at_settlement
        when: "POST /referral-placements/{id}/settlement"
        difference: "drops the holdback and recomputes on the settled gross: the same 100000 settled gross gives commission 30000 and feed share 5250, so the settlement posts an ADJUSTMENT of +3000 and a FEED_SOURCE_SHARE_ADJUSTMENT of -525 on top of the provisional entries — different results for identical partner terms"

  - name: identity_kba_evaluation
    trigger: "POST /identity-verifications/{id}/kba-result, and the expiry sweep inside POST /moves/{id}/consent-evaluations"
    algorithm: threshold
    formula: |
      attempt_no = count(IdentityVerification WHERE move_id == M) at creation time  # 1-based
      if attempt_no > MAX_IDENTITY_ATTEMPTS: POST /moves/{id}/identity-verifications is rejected

      status =
        PASSED if outcome == PASSED AND score >= KBA_PASS_SCORE
        FAILED otherwise                     # includes outcome PASSED with score < KBA_PASS_SCORE
      # A PENDING verification whose created_at + PENDING_TTL_HOURS < clock becomes EXPIRED and is
      # treated exactly like FAILED for lifecycle purposes, but does not consume a further attempt.

      on PASSED:  MoveRecord.verified_at = clock ; lifecycle IDENTITY_PENDING|IDENTITY_FAILED -> VERIFIED
      on FAILED:  MoveRecord.lifecycle_status -> IDENTITY_FAILED
      identity_valid(M) = MoveRecord.verified_at is not null
                          AND clock <= MoveRecord.verified_at + IDENTITY_VALIDITY_DAYS
      # A MANUAL_OVERRIDE verification (ComplianceOfficer) passes without a bureau score but records
      # reviewer_user_id, which the filing-submission segregation-of-duties check reads.
    input_set: "all IdentityVerification rows of the move (for the attempt cap), plus the single verification being decided"
    constants:
      KBA_PASS_SCORE: 700
      MAX_IDENTITY_ATTEMPTS: 3
      PENDING_TTL_HOURS: 72
      IDENTITY_VALIDITY_DAYS: 30
    precision: "integer comparison, >= on KBA_PASS_SCORE; the validity window is inclusive of the instant verified_at + IDENTITY_VALIDITY_DAYS"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the eight declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the acting role appears in the target endpoint's roles list, and where an operation is reserved by a role's exclusive_operations entry the acting role is one of that entry's holders (in particular POST /moves/{id}/identity-verifications with method MANUAL_OVERRIDE is reachable only by ComplianceOfficer and PlatformAdmin, so a MoveOpsAgent that may post a KBA verification on the same path is refused the override)"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every id in the request path resolves to an existing row, validated left-to-right; the first miss decides the error (ERR_MOVE_NOT_FOUND, ERR_RESIDENT_NOT_FOUND, ERR_UTILITY_ORDER_NOT_FOUND, ERR_HANDOFF_NOT_FOUND, ERR_FILING_NOT_FOUND, ERR_PLACEMENT_NOT_FOUND, ERR_CONSENT_NOT_FOUND, ERR_VERIFICATION_NOT_FOUND)"
    error_id: ERR_MOVE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id"
  - priority: 4
    category: existence
    check: "every id supplied in the request body (resident_id, feed_source_id, origin_address_id, destination_address_id, provider_id, partner_id, territory_id, survivor_move_id, move_id) resolves to an existing row"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /moves, POST /provider-service-territories, POST /moves/{id}/referral-placements, POST /moves/{id}/duplicate-resolution, POST /residents/{id}/consent-records"
  - priority: 5
    category: auth
    check: "for entity_backed roles the acting X-User-ID owns the addressed resource: Resident owns its own consent records and the resident path id; PartnerAgent owns placements whose partner_id equals X-User-ID; ProviderAgent owns utility orders whose provider_id equals X-User-ID; FeedIntegrator owns moves whose feed_source_id equals X-User-ID"
    error_id: ERR_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "all endpoints reachable by an entity_backed role"
  - priority: 6
    category: business_constraint
    check: "the request body conforms to the endpoint's input schema: every required field present and non-null, no unknown enum member, integers within their declared ranges (priority_rank 1..999, rev_share_pct 0.0000..1.0000, monthly_placement_cap >= 1, gross_revenue_cents >= 1, scores 300..850), dates in YYYY-MM-DD form, timestamps in ISO-8601 Z form, and a ConsentRecord expires_at strictly after the logical clock"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all write endpoints"
  - priority: 7
    category: state
    check: "the addressed MoveRecord's lifecycle_status permits the requested operation (mapping, scheduling, filing creation, placement creation, attention clearance, completion, cancellation)"
    error_id: ERR_MOVE_NOT_ACTIONABLE
    http_status: 409
    applies_to: "all POST endpoints under /moves/{id}, and every child write that resolves to a move"
  - priority: 8
    category: state
    check: "the addressed UtilityOrder's provision_status permits the requested operation (schedule from DRAFT, credit-check from DRAFT, deposit-payment from a DEPOSIT_DUE credit_status, activation from SCHEDULED, closure from ACTIVE_SERVICE, waiver from DRAFT)"
    error_id: ERR_ORDER_NOT_SCHEDULABLE
    http_status: 409
    applies_to: "POST /utility-orders/{id}/schedule, /credit-checks, /deposit-payments, /activation, /provision-failure, /closure, /waiver"
  - priority: 9
    category: state
    check: "the addressed AddressChangeFiling's status permits the requested operation (submission from DRAFT or REJECTED, usps-response from SUBMITTED, cancellation from a non-terminal status)"
    error_id: ERR_FILING_NOT_SUBMITTABLE
    http_status: 409
    applies_to: "POST /address-change-filings/{id}/submission, /usps-response, /cancellation"
  - priority: 10
    category: state
    check: "the addressed ReferralPlacement's placement_status permits the requested operation (acceptance from PLACED, decline from ACCEPTED, conversion from ACCEPTED, settlement from CONVERTED, reversal from CONVERTED)"
    error_id: ERR_PLACEMENT_NOT_CONVERTIBLE
    http_status: 409
    applies_to: "POST /referral-placements/{id}/acceptance, /decline, /conversions, /settlement, /reversal"
  - priority: 11
    category: state
    check: "the addressed ConsentRecord is still in state GRANTED (SUPERSEDED, REVOKED and EXPIRED records cannot be revoked again)"
    error_id: ERR_CONSENT_ALREADY_TERMINAL
    http_status: 409
    applies_to: "POST /consent-records/{id}/revocation"
  - priority: 12
    category: state
    check: "the addressed IdentityVerification is still PENDING (a PASSED, FAILED or EXPIRED verification cannot receive a KBA result)"
    error_id: ERR_VERIFICATION_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /identity-verifications/{id}/kba-result"
  - priority: 13
    category: state
    check: "the addressed CreditCheckHandoff is still SUBMITTED when a bureau response arrives"
    error_id: ERR_HANDOFF_NOT_OPEN
    http_status: 409
    applies_to: "POST /credit-check-handoffs/{id}/bureau-response"
  - priority: 14
    category: state
    check: "expected_resident_version equals the addressed Resident's current version"
    error_id: ERR_STALE_RESIDENT_VERSION
    http_status: 412
    applies_to: "POST /residents/{id}/consent-records"
  - priority: 15
    category: state
    check: "expected_move_version equals the addressed MoveRecord's current version"
    error_id: ERR_STALE_MOVE_VERSION
    http_status: 412
    applies_to: "POST /moves/{id}/referral-placements, POST /moves/{id}/duplicate-resolution"
  - priority: 16
    category: business_safety
    check: "the move has a PASSED IdentityVerification (MoveRecord.verified_at is non-null) before any address-change or service-provisioning write"
    error_id: ERR_IDENTITY_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /utility-orders/{id}/schedule, POST /moves/{id}/address-change-filings, POST /address-change-filings/{id}/submission"
  - priority: 17
    category: business_safety
    check: "the passed identity is still inside its validity window: clock <= MoveRecord.verified_at + IDENTITY_VALIDITY_DAYS"
    error_id: ERR_IDENTITY_VERIFICATION_EXPIRED
    http_status: 422
    applies_to: "POST /utility-orders/{id}/schedule, POST /address-change-filings/{id}/submission"
  - priority: 18
    category: business_safety
    check: "MoveRecord.identity_attempt_count < MAX_IDENTITY_ATTEMPTS before a new verification attempt is opened"
    error_id: ERR_VERIFICATION_ATTEMPTS_EXHAUSTED
    http_status: 409
    applies_to: "POST /moves/{id}/identity-verifications"
  - priority: 19
    category: business_safety
    check: "the submitting X-User-ID differs from the reviewer_user_id of every PASSED MANUAL_OVERRIDE IdentityVerification of the same move (segregation of duties: whoever waved identity through cannot also file the postal redirect)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /address-change-filings/{id}/submission"
  - priority: 20
    category: business_referential
    check: "a ConsentRecord in state GRANTED exists for the resident with the scope the operation needs (UTILITY_SETUP for provisioning writes, USPS_FILING for filing submission, PARTNER_MARKETING for placement creation), with move_id null or equal to this move"
    error_id: ERR_CONSENT_MISSING
    http_status: 422
    applies_to: "POST /moves/{id}/provider-mapping, POST /utility-orders/{id}/schedule, POST /address-change-filings/{id}/submission, POST /moves/{id}/referral-placements"
  - priority: 21
    category: business_referential
    check: "MoveRecord.consent_gate is OPEN (a revoked or expired gate scope blocks every downstream write until a fresh consent is recorded)"
    error_id: ERR_CONSENT_REVOKED
    http_status: 409
    applies_to: "POST /moves/{id}/provider-mapping, POST /utility-orders/{id}/schedule, POST /utility-orders/{id}/activation, POST /address-change-filings/{id}/submission, POST /referral-placements/{id}/acceptance, POST /referral-placements/{id}/conversions"
  - priority: 22
    category: business_referential
    check: "Resident.marketing_opt_out is false"
    error_id: ERR_MARKETING_OPT_OUT
    http_status: 422
    applies_to: "POST /moves/{id}/referral-placements, POST /referral-placements/{id}/conversions"
  - priority: 23
    category: business_referential
    check: "at least one ACTIVE UtilityProvider has a ProviderServiceTerritory covering the service address postal_code and the move_date for each requested utility_type"
    error_id: ERR_NO_PROVIDER_COVERAGE
    http_status: 422
    applies_to: "POST /moves/{id}/provider-mapping"
  - priority: 24
    category: business_referential
    check: "the account_data object supplies every key listed in the provider's required_account_fields, each non-empty"
    error_id: ERR_MISSING_ACCOUNT_DATA
    http_status: 422
    applies_to: "POST /utility-orders/{id}/schedule"
  - priority: 25
    category: business_referential
    check: "the UtilityProvider behind the order is still ACTIVE at scheduling and activation time"
    error_id: ERR_PROVIDER_INACTIVE
    http_status: 409
    applies_to: "POST /utility-orders/{id}/schedule, POST /utility-orders/{id}/activation"
  - priority: 26
    category: business_referential
    check: "the FeedSource named by feed_source_id has feed_status ACTIVE"
    error_id: ERR_FEED_SUSPENDED
    http_status: 409
    applies_to: "POST /moves"
  - priority: 27
    category: business_referential
    check: "MoveRecord.duplicate_flag is not SUSPECTED (a suspected duplicate must be resolved through POST /moves/{id}/duplicate-resolution before any downstream work)"
    error_id: ERR_DUPLICATE_MOVE_UNRESOLVED
    http_status: 409
    applies_to: "POST /moves/{id}/identity-verifications, POST /moves/{id}/provider-mapping, POST /moves/{id}/address-change-filings, POST /moves/{id}/referral-placements"
  - priority: 28
    category: business_referential
    check: "the destination ServiceAddress has usps_deliverable true"
    error_id: ERR_ADDRESS_NOT_DELIVERABLE
    http_status: 422
    applies_to: "POST /address-change-filings/{id}/submission"
  - priority: 29
    category: business_temporal
    check: "move_date lies within [clock_date - MOVE_DATE_PAST_GRACE_DAYS (30), clock_date + MOVE_DATE_HORIZON_DAYS (180)] inclusive"
    error_id: ERR_MOVE_DATE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /moves"
  - priority: 30
    category: business_temporal
    check: "scheduled_window_start < scheduled_window_end, both fall on requested_service_date, and the span is at most MAX_WINDOW_HOURS (8)"
    error_id: ERR_INVALID_SERVICE_WINDOW
    http_status: 422
    applies_to: "POST /utility-orders/{id}/schedule"
  - priority: 31
    category: business_temporal
    check: "for order_kind START, requested_service_date >= clock_date + UtilityProvider.scheduling_lead_days; for order_kind STOP the same floor applies unless the provider has same_day_stop_allowed true"
    error_id: ERR_LEAD_TIME_VIOLATION
    http_status: 422
    applies_to: "POST /utility-orders/{id}/schedule"
  - priority: 32
    category: business_temporal
    check: "the requested [scheduled_window_start, scheduled_window_end) half-open interval does not intersect the window of any other UtilityOrder with the same service_address_id and utility_type whose provision_status is SCHEDULED or ACTIVE_SERVICE; touching endpoints (one window ending exactly when the next begins) do NOT intersect"
    error_id: ERR_SERVICE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /utility-orders/{id}/schedule"
  - priority: 33
    category: business_temporal
    check: "a new default-carrier ProviderServiceTerritory for a (postal_code, utility_type) must start at least TERRITORY_GAP_BUFFER_DAYS (1) full day after the inclusive effective_to of every existing default-carrier row for that pair; the intervals are closed on both ends, so effective_from == previous effective_to + 1 day is still a conflict"
    error_id: ERR_TERRITORY_OVERLAP
    http_status: 409
    applies_to: "POST /provider-service-territories"
  - priority: 34
    category: business_temporal
    check: "forward_start_date >= clock_date at submission time"
    error_id: ERR_FORWARD_DATE_INVALID
    http_status: 422
    applies_to: "POST /address-change-filings/{id}/submission"
  - priority: 35
    category: business_temporal
    check: "the resident has no other AddressChangeFiling in status SUBMITTED or CONFIRMED whose closed [forward_start_date, forward_end_date] period intersects this filing's period (MAX_ACTIVE_FORWARDS_PER_RESIDENT is 1, so the aggregate capacity is one active forwarding period)"
    error_id: ERR_FORWARDING_PERIOD_CONFLICT
    http_status: 409
    applies_to: "POST /address-change-filings/{id}/submission"
  - priority: 36
    category: business_temporal
    check: "clock <= attribution anchor + ReferralPartner.attribution_window_days, inclusive of the exact boundary instant; the anchor is placed_at for attribution_basis PLACEMENT_CLICK and accepted_at for PLACEMENT_ACCEPTANCE"
    error_id: ERR_ATTRIBUTION_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /referral-placements/{id}/conversions"
  - priority: 37
    category: business_temporal
    check: "clock >= scheduled_window_start for the order being activated"
    error_id: ERR_ACTIVATION_TOO_EARLY
    http_status: 409
    applies_to: "POST /utility-orders/{id}/activation"
  - priority: 38
    category: business_temporal
    check: "clock_date >= MoveRecord.move_date before a move may be completed"
    error_id: ERR_MOVE_DATE_NOT_REACHED
    http_status: 409
    applies_to: "POST /moves/{id}/completion"
  - priority: 39
    category: business_constraint
    check: "no UtilityOrder already exists for this move with the same (utility_type, order_kind) pair in provision_status IN {DRAFT, SCHEDULED, ACTIVE_SERVICE, SUSPENDED} when mapping runs; an order that is CANCELLED, CLOSED, NOT_APPLICABLE or PROVISION_FAILED does not block a replacement, which is what makes the ATTENTION_REQUIRED self-loop re-mapping reachable"
    error_id: ERR_TYPE_ALREADY_MAPPED
    http_status: 409
    applies_to: "POST /moves/{id}/provider-mapping"
  - priority: 40
    category: business_constraint
    check: "the UtilityOrder has no CreditCheckHandoff in status SUBMITTED"
    error_id: ERR_HANDOFF_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /utility-orders/{id}/credit-checks"
  - priority: 41
    category: business_constraint
    check: "the move has no other ReferralPlacement in the partner's vertical with placement_status in {PLACED, ACCEPTED, CONVERTED, SETTLED}"
    error_id: ERR_DUPLICATE_VERTICAL_PLACEMENT
    http_status: 409
    applies_to: "POST /moves/{id}/referral-placements"
  - priority: 42
    category: business_constraint
    check: "AddressChangeFiling.resubmit_count < MAX_FILING_RESUBMITS (2) when resubmitting a REJECTED filing"
    error_id: ERR_RESUBMIT_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /address-change-filings/{id}/submission"
  - priority: 43
    category: business_constraint
    check: "survivor_move_id differs from the path move id"
    error_id: ERR_SELF_MERGE_FORBIDDEN
    http_status: 422
    applies_to: "POST /moves/{id}/duplicate-resolution"
  - priority: 44
    category: business_constraint
    check: "for resolution MERGE_INTO the survivor move is non-terminal and shares either the resident_id or the destination address_hash of the move being merged"
    error_id: ERR_SURVIVOR_MOVE_INVALID
    http_status: 422
    applies_to: "POST /moves/{id}/duplicate-resolution"
  - priority: 45
    category: business_constraint
    check: "every UtilityOrder of the move that is PROVISION_FAILED or credit-DECLINED has a replacement order for the same (utility_type, order_kind) in DRAFT, SCHEDULED or ACTIVE_SERVICE before the move may leave ATTENTION_REQUIRED"
    error_id: ERR_UNRESOLVED_PROVISION_FAILURE
    http_status: 409
    applies_to: "POST /moves/{id}/attention-clearances"
  - priority: 46
    category: business_fiscal
    check: "flat_deposit_cents does not exceed DEPOSIT_CAP_CENTS (50000) when deposit_policy is FLAT"
    error_id: ERR_DEPOSIT_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /utility-providers"
  - priority: 47
    category: business_fiscal
    check: "the paid amount_cents equals UtilityOrder.deposit_amount_cents exactly (no partial and no over-payment)"
    error_id: ERR_DEPOSIT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /utility-orders/{id}/deposit-payments"
  - priority: 48
    category: business_fiscal
    check: "ReferralPartner.partner_status is ACTIVE"
    error_id: ERR_PARTNER_PAUSED
    http_status: 409
    applies_to: "POST /moves/{id}/referral-placements"
  - priority: 49
    category: business_fiscal
    check: "the partner's placements whose placed_at falls in the logical clock's calendar month number fewer than monthly_placement_cap"
    error_id: ERR_PARTNER_CAP_REACHED
    http_status: 409
    applies_to: "POST /moves/{id}/referral-placements"
  - priority: 50
    category: business_fiscal
    check: "settled_gross_revenue_cents >= 1 and does not exceed twice the recorded gross_revenue_cents"
    error_id: ERR_SETTLEMENT_AMOUNT_INVALID
    http_status: 422
    applies_to: "POST /referral-placements/{id}/settlement"

endpoints:
  # ---- Configuration surface: feed sources, residents, addresses ----------
  - method: POST
    path: "/feed-sources"
    description: "Register a property-manager or mover feed that may ingest move records"
    roles: [PlatformAdmin]
    code: 201
    input: [name, source_type, referral_revenue_share_pct, "dedupe_window_days?", "trust_tier?"]
    output: FeedSource
    side_effects: ["initialises accrued_share_cents to 0 and feed_status to ACTIVE"]
  - method: GET
    path: "/feed-sources/{id}"
    description: "Read one feed source, including its accrued revenue-share balance"
    roles: [PlatformAdmin, FeedIntegrator, MoveOpsAgent, ComplianceOfficer]
    code: 200
    input: []
    output: FeedSource
    side_effects: []
  - method: PATCH
    path: "/feed-sources/{id}/status"
    description: "Suspend or reactivate a feed; SUSPENDED feeds are rejected at move intake"
    roles: [PlatformAdmin]
    code: 200
    input: [feed_status]
    output: FeedSource
    side_effects: ["sets feed_status; existing moves are untouched"]
  - method: POST
    path: "/residents"
    description: "Create the resident who is moving; holds the identity attributes the KBA check consumes"
    roles: [PlatformAdmin, FeedIntegrator, MoveOpsAgent]
    code: 201
    input: [full_name, email, phone_last4, date_of_birth, ssn_last4, "marketing_opt_out?"]
    output: Resident
    side_effects: ["initialises version to 1 and opted_out_at to null"]
  - method: GET
    path: "/residents/{id}"
    description: "Read one resident, including the current version needed for consent OCC"
    roles: [PlatformAdmin, MoveOpsAgent, ComplianceOfficer, Resident]
    code: 200
    input: []
    output: Resident
    side_effects: []
  - method: PATCH
    path: "/residents/{id}/marketing-preferences"
    description: "Record a resident-level marketing opt-out or opt-in"
    roles: [PlatformAdmin, ComplianceOfficer, Resident]
    code: 200
    input: [marketing_opt_out]
    output: Resident
    side_effects:
      - "on a false -> true flip: sets opted_out_at = clock and voids every ReferralPlacement of the resident's non-terminal moves whose placement_status is PLACED or ACCEPTED"
      - "on a true -> false flip: clears opted_out_at; already-voided placements are not resurrected"
      - "increments Resident.version by 1"
  - method: POST
    path: "/service-addresses"
    description: "Create an origin or destination service address; usps_deliverable is derived as false when postal_code starts with the non-deliverable prefix 000"
    roles: [PlatformAdmin, FeedIntegrator, MoveOpsAgent]
    code: 201
    input: [line1, city, state_code, postal_code, "unit?"]
    output: ServiceAddress
    side_effects: ["computes address_hash from lower(line1) + | + lower(coalesce(unit, empty)) + | + postal_code", "computes usps_deliverable"]
  - method: GET
    path: "/service-addresses/{id}"
    description: "Read one service address, including its derived address_hash and deliverability flag"
    roles: [PlatformAdmin, MoveOpsAgent, ComplianceOfficer]
    code: 200
    input: []
    output: ServiceAddress
    side_effects: []

  # ---- Provider and territory configuration ------------------------------
  - method: POST
    path: "/utility-providers"
    description: "Register a utility provider with its required account data, deposit policy and lead time"
    roles: [PlatformAdmin]
    code: 201
    input: [name, utility_type, required_account_fields, deposit_policy, credit_check_required, scheduling_lead_days, "flat_deposit_cents?", "same_day_stop_allowed?"]
    output: UtilityProvider
    side_effects: ["rejects a FLAT policy whose flat_deposit_cents exceeds DEPOSIT_CAP_CENTS", "initialises provider_status to ACTIVE"]
  - method: GET
    path: "/utility-providers/{id}"
    description: "Read one utility provider"
    roles: [PlatformAdmin, MoveOpsAgent, ComplianceOfficer, ProviderAgent]
    code: 200
    input: []
    output: UtilityProvider
    side_effects: []
  - method: PATCH
    path: "/utility-providers/{id}/status"
    description: "Deactivate or reactivate a provider; INACTIVE providers are ineligible for mapping, scheduling and activation"
    roles: [PlatformAdmin]
    code: 200
    input: [provider_status]
    output: UtilityProvider
    side_effects: ["sets provider_status; existing UtilityOrders keep their provider_id"]
  - method: POST
    path: "/provider-service-territories"
    description: "Declare that a provider serves a postal code over a closed effective-date interval"
    roles: [PlatformAdmin, ProviderAgent]
    code: 201
    input: [provider_id, postal_code, state_code, effective_from, priority_rank, "effective_to?", "is_default_carrier?"]
    output: ProviderServiceTerritory
    side_effects: ["enforces the default-carrier gap buffer of TERRITORY_GAP_BUFFER_DAYS against existing default rows for the same (postal_code, utility_type)"]
  - method: GET
    path: "/provider-service-territories/{id}"
    description: "Read one territory row"
    roles: [PlatformAdmin, MoveOpsAgent, ProviderAgent]
    code: 200
    input: []
    output: ProviderServiceTerritory
    side_effects: []
  - method: GET
    path: "/provider-service-territories"
    description: "List territory rows, filterable by provider and postal code"
    roles: [PlatformAdmin, MoveOpsAgent, ProviderAgent]
    code: 200
    input: ["provider_id?", "postal_code?", "state_code?", "is_default_carrier?", "limit?", "offset?"]
    output: ProviderServiceTerritory[]
    side_effects: []
  - method: POST
    path: "/referral-partners"
    description: "Register an internet, insurance or mover partner with its payout and attribution terms"
    roles: [PlatformAdmin]
    code: 201
    input: [name, vertical, payout_model, attribution_window_days, attribution_basis, monthly_placement_cap, "rev_share_pct?", "bounty_cents?"]
    output: ReferralPartner
    side_effects: ["requires bounty_cents for FLAT_BOUNTY and rev_share_pct for REV_SHARE_PCT", "initialises partner_status to ACTIVE"]
  - method: GET
    path: "/referral-partners/{id}"
    description: "Read one referral partner"
    roles: [PlatformAdmin, MoveOpsAgent, PartnerAgent]
    code: 200
    input: []
    output: ReferralPartner
    side_effects: []
  - method: PATCH
    path: "/referral-partners/{id}/status"
    description: "Pause or resume a partner; PAUSED partners cannot receive new placements"
    roles: [PlatformAdmin]
    code: 200
    input: [partner_status]
    output: ReferralPartner
    side_effects: ["sets partner_status; placements already PLACED or ACCEPTED continue to settle"]

  # ---- Move intake and lifecycle -----------------------------------------
  - method: POST
    path: "/moves"
    description: "Ingest a move record from a property-manager or mover feed; runs both duplicate-detection passes"
    roles: [PlatformAdmin, FeedIntegrator, MoveOpsAgent]
    code: 201
    input: [resident_id, feed_source_id, origin_address_id, destination_address_id, move_date, "external_reference?"]
    output: MoveRecord
    side_effects:
      - "for FeedIntegrator, feed_source_id must equal X-User-ID"
      - "runs calculations.duplicate_match_score open_candidate_pass then cancelled_candidate_pass"
      - "sets lifecycle_status INTAKE, consent_gate from the resident's GRANTED consents, readiness_score via the pre_verification variant"
      - "sets duplicate_flag SUSPECTED and blocked_reason DUPLICATE_SUSPECTED when the open pass score >= DUP_SUSPECT_THRESHOLD"
  - method: GET
    path: "/moves/{id}"
    description: "Read one move record with its derived duplicate, consent and readiness fields"
    roles: [PlatformAdmin, FeedIntegrator, MoveOpsAgent, ComplianceOfficer, Resident]
    code: 200
    input: []
    output: MoveRecord
    side_effects: []
  - method: GET
    path: "/moves"
    description: "List move records with filtering and pagination; supports every foreign key as a filter"
    roles: [PlatformAdmin, FeedIntegrator, MoveOpsAgent, ComplianceOfficer]
    code: 200
    input: ["resident_id?", "feed_source_id?", "origin_address_id?", "destination_address_id?", "duplicate_of_move_id?", "reactivation_candidate_move_id?", "duplicate_candidate_move_id?", "lifecycle_status?", "duplicate_flag?", "limit?", "offset?"]
    output: MoveRecord[]
    side_effects: []
  - method: GET
    path: "/moves/{id}/readiness"
    description: "Computed read of the move readiness score and its four components; variant defaults to the one implied by lifecycle_status"
    roles: [PlatformAdmin, MoveOpsAgent, ComplianceOfficer]
    code: 200
    input: ["variant?"]
    output: "{move_id: string, variant: string, identity_component: integer, utility_component: integer, filing_component: integer, consent_component: integer, readiness_score: integer}"
    side_effects: []
  - method: POST
    path: "/moves/{id}/identity-verifications"
    description: "Open a KBA identity verification attempt, or record a compliance manual override"
    roles: [PlatformAdmin, MoveOpsAgent, ComplianceOfficer]
    code: 201
    input: [method, "override_reason?"]
    output: IdentityVerification
    side_effects:
      - "method MANUAL_OVERRIDE is restricted to ComplianceOfficer and PlatformAdmin, requires override_reason, lands PASSED immediately and records reviewer_user_id = X-User-ID"
      - "method KBA lands PENDING with expires_at = clock + PENDING_TTL_HOURS"
      - "increments MoveRecord.identity_attempt_count and moves lifecycle INTAKE -> IDENTITY_PENDING (KBA) or -> VERIFIED (override)"
      - "recomputes MoveRecord.readiness_score"
  - method: GET
    path: "/identity-verifications/{id}"
    description: "Read one identity verification attempt"
    roles: [PlatformAdmin, MoveOpsAgent, ComplianceOfficer]
    code: 200
    input: []
    output: IdentityVerification
    side_effects: []
  - method: GET
    path: "/identity-verifications"
    description: "List identity verification attempts, filterable by move, resident and status"
    roles: [PlatformAdmin, MoveOpsAgent, ComplianceOfficer]
    code: 200
    input: ["move_id?", "resident_id?", "status?", "method?", "limit?", "offset?"]
    output: IdentityVerification[]
    side_effects: []
  - method: POST
    path: "/identity-verifications/{id}/kba-result"
    description: "External KBA vendor posts the outcome and score for a PENDING verification"
    roles: [ExternalServiceGateway, PlatformAdmin]
    code: 200
    input: [outcome, score]
    output: IdentityVerification
    side_effects:
      - "applies calculations.identity_kba_evaluation: PASSED only when outcome is PASSED and score >= KBA_PASS_SCORE"
      - "writes kba_score and decided_at, sets MoveRecord.verified_at on PASSED"
      - "moves MoveRecord IDENTITY_PENDING -> VERIFIED or -> IDENTITY_FAILED and recomputes readiness_score under the matching variant"
  - method: POST
    path: "/moves/{id}/provider-mapping"
    description: "Map the move's service addresses to utility providers and create the resulting service orders"
    roles: [PlatformAdmin, MoveOpsAgent]
    code: 200
    input: [utility_types, "include_stop_orders?"]
    output: MoveRecord
    side_effects:
      - "selects the winning ProviderServiceTerritory per utility_type by is_default_carrier DESC, priority_rank ASC, effective_from DESC, created_at ASC"
      - "creates one UtilityOrder per covered (utility_type, order_kind), with credit_status PENDING_CHECK when the provider requires a credit check and deposit_estimate_cents from the estimate_at_mapping variant"
      - "writes mapped_order_count and unmapped_utility_types, moves lifecycle VERIFIED -> SCHEDULING, recomputes readiness_score"
      - "on re-run it creates replacement orders only for (utility_type, order_kind) pairs that have no order in DRAFT, SCHEDULED, ACTIVE_SERVICE or SUSPENDED, satisfying the ATTENTION_REQUIRED clearance precondition"
  - method: POST
    path: "/moves/{id}/duplicate-resolution"
    description: "Resolve a suspected duplicate: dismiss it, rescore it, or merge this move into a survivor"
    roles: [PlatformAdmin, MoveOpsAgent]
    code: 200
    input: [resolution, expected_move_version, "survivor_move_id?"]
    output: MoveRecord
    side_effects:
      - "resolution DISMISS sets duplicate_flag DISMISSED and clears blocked_reason DUPLICATE_SUSPECTED"
      - "resolution RESCORE re-runs calculations.duplicate_match_score and may clear or keep the SUSPECTED flag"
      - "resolution MERGE_INTO sets duplicate_flag CONFIRMED_DUPLICATE, duplicate_of_move_id = survivor_move_id, lifecycle -> DUPLICATE_MERGED, and runs the three-hop merge cascade over orders, filings, placements and handoffs"
      - "increments MoveRecord.version by 1"
  - method: POST
    path: "/moves/{id}/cancellation"
    description: "Cancel a move and unwind its open service orders, filings and placements"
    roles: [PlatformAdmin, MoveOpsAgent, FeedIntegrator]
    code: 200
    input: [cancellation_reason]
    output: MoveRecord
    side_effects:
      - "lifecycle -> CANCELLED, cancels open UtilityOrders (clearing both window fields), cancels open AddressChangeFilings, voids open ReferralPlacements and open CreditCheckHandoffs"
      - "the cancelled move becomes eligible as a cancelled_candidate_pass reactivation candidate for later intakes"
  - method: POST
    path: "/moves/{id}/attention-clearances"
    description: "Return a move parked in ATTENTION_REQUIRED to SCHEDULING once every blocker has a remedy"
    roles: [PlatformAdmin, MoveOpsAgent]
    code: 200
    input: ["clearance_note?"]
    output: MoveRecord
    side_effects: ["clears blocked_reason to NONE and recomputes readiness_score", "rejects the call while any failed or declined order lacks a replacement"]
  - method: POST
    path: "/moves/{id}/completion"
    description: "Close out a move whose service orders and postal filing are all settled"
    roles: [PlatformAdmin, MoveOpsAgent]
    code: 200
    input: []
    output: MoveRecord
    side_effects: ["lifecycle IN_SERVICE -> COMPLETED and recomputes readiness_score a final time"]
  - method: POST
    path: "/moves/{id}/consent-evaluations"
    description: "Ops-run checkpoint that expires lapsed consents and PENDING verifications, then re-derives the move's gate and readiness"
    roles: [PlatformAdmin, MoveOpsAgent, ComplianceOfficer]
    code: 200
    input: []
    output: MoveRecord
    side_effects:
      - "every GRANTED ConsentRecord of this resident whose expires_at is before the clock -> EXPIRED, running the same cascade as a revocation"
      - "every PENDING IdentityVerification of this move past its expires_at -> EXPIRED without consuming a further attempt"
      - "recomputes consent_gate, blocked_reason and readiness_score"

  # ---- Utility orders, credit handoffs, deposits --------------------------
  - method: GET
    path: "/utility-orders/{id}"
    description: "Read one utility service order with both of its state dimensions and its deposit figures"
    roles: [PlatformAdmin, MoveOpsAgent, ComplianceOfficer, ProviderAgent]
    code: 200
    input: []
    output: UtilityOrder
    side_effects: []
  - method: GET
    path: "/utility-orders"
    description: "List utility service orders with filtering and pagination"
    roles: [PlatformAdmin, MoveOpsAgent, ComplianceOfficer, ProviderAgent]
    code: 200
    input: ["move_id?", "provider_id?", "service_address_id?", "territory_id?", "provision_status?", "credit_status?", "order_kind?", "utility_type?", "limit?", "offset?"]
    output: UtilityOrder[]
    side_effects: []
  - method: POST
    path: "/utility-orders/{id}/schedule"
    description: "Schedule the service start or stop window and record the provider's required account data"
    roles: [PlatformAdmin, MoveOpsAgent]
    code: 200
    input: [requested_service_date, scheduled_window_start, scheduled_window_end, account_data]
    output: UtilityOrder
    side_effects:
      - "provision_status DRAFT -> SCHEDULED, occupying the [start, end) window for this (service_address_id, utility_type)"
      - "recomputes the parent MoveRecord.readiness_score utility_component"
  - method: POST
    path: "/utility-orders/{id}/credit-checks"
    description: "Hand the order off to a credit bureau and freeze the readiness snapshot the deposit formula will read"
    roles: [PlatformAdmin, MoveOpsAgent]
    code: 201
    input: [bureau]
    output: CreditCheckHandoff
    side_effects:
      - "creates a CreditCheckHandoff in status SUBMITTED with submitted_by_user_id = X-User-ID"
      - "writes UtilityOrder.readiness_snapshot = the parent move's current readiness_score (evaluation-order pin for calculations.credit_deposit_amount_cents)"
  - method: GET
    path: "/credit-check-handoffs/{id}"
    description: "Read one credit-check handoff"
    roles: [PlatformAdmin, MoveOpsAgent, ComplianceOfficer]
    code: 200
    input: []
    output: CreditCheckHandoff
    side_effects: []
  - method: GET
    path: "/credit-check-handoffs"
    description: "List credit-check handoffs, filterable by order and status"
    roles: [PlatformAdmin, MoveOpsAgent, ComplianceOfficer]
    code: 200
    input: ["utility_order_id?", "handoff_status?", "result?", "limit?", "offset?"]
    output: CreditCheckHandoff[]
    side_effects: []
  - method: POST
    path: "/credit-check-handoffs/{id}/bureau-response"
    description: "Credit bureau returns a score; the deposit is computed from the frozen readiness snapshot"
    roles: [ExternalServiceGateway, PlatformAdmin]
    code: 200
    input: [score]
    output: CreditCheckHandoff
    side_effects:
      - "handoff_status SUBMITTED -> RESPONDED with result CLEAR, DEPOSIT_REQUIRED or DECLINED per the score bands"
      - "sets UtilityOrder.credit_status to CLEARED, DEPOSIT_DUE or DECLINED and writes deposit_amount_cents from the final_at_bureau_response variant"
      - "on DECLINED: provision_status DRAFT -> PROVISION_FAILED with failure_reason CREDIT_DECLINED, then the parent move SCHEDULING -> ATTENTION_REQUIRED with blocked_reason CREDIT_DECLINED"
      - "recomputes the parent MoveRecord.readiness_score after the deposit is written"
  - method: POST
    path: "/utility-orders/{id}/deposit-payments"
    description: "Record payment of the exact deposit due on an order"
    roles: [PlatformAdmin, MoveOpsAgent, Resident]
    code: 200
    input: [amount_cents]
    output: UtilityOrder
    side_effects: ["credit_status DEPOSIT_DUE -> DEPOSIT_PAID, writes deposit_paid_cents, and drives open_deposit_liability_cents for the move down by deposit_amount_cents"]
  - method: POST
    path: "/utility-orders/{id}/activation"
    description: "Provider confirms the service is live at the scheduled window"
    roles: [ProviderAgent, PlatformAdmin]
    code: 200
    input: [confirmation_code]
    output: UtilityOrder
    side_effects:
      - "provision_status SCHEDULED -> ACTIVE_SERVICE, writes confirmation_code"
      - "requires credit_status IN {NOT_REQUIRED, CLEARED, DEPOSIT_PAID} and clock >= scheduled_window_start"
      - "recomputes the parent MoveRecord.readiness_score and may bubble SCHEDULING -> IN_SERVICE"
  - method: POST
    path: "/utility-orders/{id}/provision-failure"
    description: "Provider reports that the order cannot be provisioned"
    roles: [ProviderAgent, PlatformAdmin]
    code: 200
    input: [failure_reason]
    output: UtilityOrder
    side_effects:
      - "provision_status DRAFT or SCHEDULED -> PROVISION_FAILED, clearing both window fields so the address window is released"
      - "voids any open CreditCheckHandoff and sets credit_status VOIDED when it was PENDING_CHECK or DEPOSIT_DUE"
      - "parent MoveRecord SCHEDULING -> ATTENTION_REQUIRED with blocked_reason PROVISION_FAILED"
  - method: POST
    path: "/utility-orders/{id}/closure"
    description: "Close a stop order or an ended service after the final read"
    roles: [ProviderAgent, PlatformAdmin, MoveOpsAgent]
    code: 200
    input: ["final_read_note?"]
    output: UtilityOrder
    side_effects: ["provision_status ACTIVE_SERVICE -> CLOSED, releasing the occupancy window, and recomputes the move's readiness utility_component"]
  - method: POST
    path: "/utility-orders/{id}/waiver"
    description: "Mark an order not applicable, for example when the destination rent includes the utility"
    roles: [PlatformAdmin, MoveOpsAgent]
    code: 200
    input: [waiver_reason]
    output: UtilityOrder
    side_effects: ["provision_status DRAFT -> NOT_APPLICABLE, credit_status -> NOT_REQUIRED, and the order counts as done in the readiness utility_component"]

  # ---- USPS change-of-address filings ------------------------------------
  - method: POST
    path: "/moves/{id}/address-change-filings"
    description: "Draft a USPS change-of-address filing for the verified move"
    roles: [PlatformAdmin, MoveOpsAgent, ComplianceOfficer]
    code: 201
    input: [filing_type, forward_start_date]
    output: AddressChangeFiling
    side_effects: ["writes resident_id from the move and forward_end_date = forward_start_date + FORWARD_TERM_DAYS (365) - 1 day", "status DRAFT"]
  - method: GET
    path: "/address-change-filings/{id}"
    description: "Read one filing with its confirmation and rejection fields"
    roles: [PlatformAdmin, MoveOpsAgent, ComplianceOfficer, Resident]
    code: 200
    input: []
    output: AddressChangeFiling
    side_effects: []
  - method: GET
    path: "/address-change-filings"
    description: "List filings, filterable by move, resident and status"
    roles: [PlatformAdmin, MoveOpsAgent, ComplianceOfficer]
    code: 200
    input: ["move_id?", "resident_id?", "status?", "filing_type?", "limit?", "offset?"]
    output: AddressChangeFiling[]
    side_effects: []
  - method: POST
    path: "/address-change-filings/{id}/submission"
    description: "Submit or resubmit the filing to USPS; enforces identity validity, consent, deliverability and the one-active-forwarding-period rule"
    roles: [PlatformAdmin, MoveOpsAgent, ComplianceOfficer]
    code: 200
    input: []
    output: AddressChangeFiling
    side_effects:
      - "status DRAFT -> SUBMITTED, or REJECTED -> SUBMITTED with resubmit_count incremented and reject_reason cleared"
      - "writes submitted_by_user_id = X-User-ID and enforces segregation of duties against the move's manual identity override reviewer"
      - "recomputes the parent MoveRecord.readiness_score filing_component to 60"
  - method: POST
    path: "/address-change-filings/{id}/usps-response"
    description: "USPS returns a confirmation code or a rejection for a submitted filing"
    roles: [ExternalServiceGateway, PlatformAdmin]
    code: 200
    input: [outcome, "usps_confirmation_code?", "reject_reason?"]
    output: AddressChangeFiling
    side_effects:
      - "outcome CONFIRMED requires usps_confirmation_code: status -> CONFIRMED, writes mail_forwarding_confirmed_at = clock, filing_component -> 100, and may bubble the move SCHEDULING -> IN_SERVICE"
      - "outcome REJECTED requires reject_reason: status -> REJECTED and the parent move SCHEDULING -> ATTENTION_REQUIRED with blocked_reason FILING_REJECTED"
  - method: POST
    path: "/address-change-filings/{id}/cancellation"
    description: "Withdraw a filing before or after submission"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: [cancellation_reason]
    output: AddressChangeFiling
    side_effects: ["status -> CANCELLED, clears mail_forwarding_confirmed_at, releases the resident's forwarding-period slot and drops filing_component to 0"]

  # ---- Consent and opt-out ------------------------------------------------
  - method: POST
    path: "/residents/{id}/consent-records"
    description: "Record a data-sharing consent for one scope; supersedes the resident's prior GRANTED record for that scope under OCC on Resident.version"
    roles: [PlatformAdmin, MoveOpsAgent, ComplianceOfficer, Resident]
    code: 201
    input: [scope, source_channel, consent_text_version, expected_resident_version, "move_id?", "expires_at?"]
    output: ConsentRecord
    side_effects:
      - "rejects a stale expected_resident_version with ERR_STALE_RESIDENT_VERSION"
      - "supersedes the prior GRANTED record for the same (resident_id, scope)"
      - "increments Resident.version by 1"
      - "recomputes consent_gate, blocked_reason and readiness_score on every non-terminal move of the resident, and returns SUSPENDED UtilityOrders to DRAFT when the gate flips back to OPEN"
  - method: GET
    path: "/consent-records/{id}"
    description: "Read one consent record"
    roles: [PlatformAdmin, MoveOpsAgent, ComplianceOfficer, Resident]
    code: 200
    input: []
    output: ConsentRecord
    side_effects: []
  - method: GET
    path: "/consent-records"
    description: "List consent records, filterable by resident, move, scope and state"
    roles: [PlatformAdmin, MoveOpsAgent, ComplianceOfficer]
    code: 200
    input: ["resident_id?", "move_id?", "scope?", "state?", "source_channel?", "limit?", "offset?"]
    output: ConsentRecord[]
    side_effects: []
  - method: POST
    path: "/consent-records/{id}/revocation"
    description: "Revoke a granted consent and run the downstream suspension cascade"
    roles: [PlatformAdmin, ComplianceOfficer, Resident]
    code: 200
    input: ["revocation_reason?"]
    output: ConsentRecord
    side_effects:
      - "state GRANTED -> REVOKED with revoked_at = clock"
      - "scopes UTILITY_SETUP and USPS_FILING: linked non-terminal moves get consent_gate BLOCKED, blocked_reason CONSENT_REVOKED, and SCHEDULING or IN_SERVICE -> ATTENTION_REQUIRED"
      - "then their open UtilityOrders -> SUSPENDED with cleared windows, and those orders' open credit checks -> VOIDED"
      - "scope PARTNER_MARKETING: Resident.marketing_opt_out = true, opted_out_at = clock, and open ReferralPlacements -> VOIDED"

  # ---- Referral placements and revenue share ------------------------------
  - method: POST
    path: "/moves/{id}/referral-placements"
    description: "Place a partner referral (internet, insurance or movers) against the move"
    roles: [PlatformAdmin, MoveOpsAgent]
    code: 201
    input: [partner_id, expected_move_version]
    output: ReferralPlacement
    side_effects:
      - "rejects a stale expected_move_version with ERR_STALE_MOVE_VERSION"
      - "writes vertical from the partner and placed_at = clock, enforcing the per-vertical slot and the monthly placement cap"
      - "increments MoveRecord.version by 1"
  - method: GET
    path: "/referral-placements/{id}"
    description: "Read one referral placement with its attribution and share figures"
    roles: [PlatformAdmin, MoveOpsAgent, ComplianceOfficer, PartnerAgent]
    code: 200
    input: []
    output: ReferralPlacement
    side_effects: []
  - method: GET
    path: "/referral-placements"
    description: "List referral placements, filterable by move, partner, vertical and status"
    roles: [PlatformAdmin, MoveOpsAgent, ComplianceOfficer, PartnerAgent]
    code: 200
    input: ["move_id?", "partner_id?", "placement_status?", "vertical?", "limit?", "offset?"]
    output: ReferralPlacement[]
    side_effects: []
  - method: POST
    path: "/referral-placements/{id}/acceptance"
    description: "Partner accepts the referral, setting the PLACEMENT_ACCEPTANCE attribution anchor"
    roles: [PartnerAgent, PlatformAdmin]
    code: 200
    input: []
    output: ReferralPlacement
    side_effects: ["placement_status PLACED -> ACCEPTED, writes accepted_at = clock"]
  - method: POST
    path: "/referral-placements/{id}/decline"
    description: "Partner declines the accepted referral; the branch that posts no ledger entries"
    roles: [PartnerAgent, PlatformAdmin]
    code: 200
    input: [decline_reason]
    output: ReferralPlacement
    side_effects: ["placement_status ACCEPTED -> DECLINED, writes decline_reason, leaves attributed_share_cents 0 and FeedSource.accrued_share_cents unchanged"]
  - method: POST
    path: "/referral-placements/{id}/conversions"
    description: "Partner reports gross revenue inside the attribution window; posts the provisional accrual"
    roles: [PartnerAgent, PlatformAdmin]
    code: 200
    input: [gross_revenue_cents]
    output: ReferralPlacement
    side_effects:
      - "placement_status ACCEPTED -> CONVERTED, writes converted_at = clock and gross_revenue_cents"
      - "computes attributed_share_cents and feed_source_share_cents from the provisional_at_conversion variant"
      - "posts an ACCRUAL entry and a FEED_SOURCE_SHARE entry, and increases FeedSource.accrued_share_cents by the rounded per-placement share"
  - method: POST
    path: "/referral-placements/{id}/settlement"
    description: "Platform settles the converted placement on the final gross, posting the delta"
    roles: [PlatformAdmin]
    code: 200
    input: [settled_gross_revenue_cents]
    output: ReferralPlacement
    side_effects:
      - "placement_status CONVERTED -> SETTLED, overwrites both share fields with the settled_at_settlement variant"
      - "posts an ADJUSTMENT entry and a FEED_SOURCE_SHARE_ADJUSTMENT entry for the deltas only"
      - "recomputes FeedSource.accrued_share_cents"
  - method: POST
    path: "/referral-placements/{id}/reversal"
    description: "Reverse a converted placement (chargeback), returning the placement's ledger net to zero"
    roles: [PlatformAdmin, PartnerAgent]
    code: 200
    input: [reversal_reason]
    output: ReferralPlacement
    side_effects:
      - "placement_status CONVERTED -> REVERSED, writes reversal_reason"
      - "posts a REVERSAL entry and a FEED_SOURCE_SHARE_REVERSAL entry so placement_ledger_net_cents becomes exactly 0"
      - "resets attributed_share_cents and feed_source_share_cents to 0 and decreases FeedSource.accrued_share_cents by the reversed share"
  - method: GET
    path: "/revenue-share-ledger-entries/{id}"
    description: "Read one immutable revenue-share ledger entry"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: RevenueShareLedgerEntry
    side_effects: []
  - method: GET
    path: "/revenue-share-ledger-entries"
    description: "List ledger entries, filterable by placement, move, feed source and entry type; ordered by created_at ASC"
    roles: [PlatformAdmin, ComplianceOfficer, FeedIntegrator, PartnerAgent]
    code: 200
    input: ["placement_id?", "move_id?", "feed_source_id?", "entry_type?", "limit?", "offset?"]
    output: RevenueShareLedgerEntry[]
    side_effects: []

  # ---- Test-driving surface ----------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock to any instant. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z (the mandatory startup default); it never falls back to real wall-clock time. Every deadline, expiry, attribution window and lead-time rule reads this logical clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{current_utc: string}"
    side_effects: ["no entity is mutated; subsequent requests evaluate every temporal rule against the new instant"]

errors:
  # --- authentication and authorization ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the eight declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_OWNERSHIP_VIOLATION
    http: 403
    condition: "an entity_backed role addresses a resource it does not own (FeedIntegrator and a foreign feed_source_id, PartnerAgent and a foreign placement, ProviderAgent and a foreign order, Resident and another resident's record)"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the user submitting a USPS filing is the same user who granted the move's manual identity override"
  # --- existence ---
  - id: ERR_MOVE_NOT_FOUND
    http: 404
    condition: "the move id in the path does not exist"
  - id: ERR_RESIDENT_NOT_FOUND
    http: 404
    condition: "the resident id in the path does not exist"
  - id: ERR_UTILITY_ORDER_NOT_FOUND
    http: 404
    condition: "the utility order id in the path does not exist"
  - id: ERR_HANDOFF_NOT_FOUND
    http: 404
    condition: "the credit-check handoff id in the path does not exist"
  - id: ERR_FILING_NOT_FOUND
    http: 404
    condition: "the address-change filing id in the path does not exist"
  - id: ERR_PLACEMENT_NOT_FOUND
    http: 404
    condition: "the referral placement id in the path does not exist"
  - id: ERR_CONSENT_NOT_FOUND
    http: 404
    condition: "the consent record id in the path does not exist"
  - id: ERR_VERIFICATION_NOT_FOUND
    http: 404
    condition: "the identity verification id in the path does not exist"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "an id supplied in the request body (resident_id, feed_source_id, address ids, provider_id, territory_id, partner_id, survivor_move_id, move_id) does not resolve"
  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "a required field is missing or null, an enum value is unknown, a numeric field is out of its declared range, a date or timestamp is malformed, or a consent expires_at is not strictly after the logical clock"
  # --- state preconditions ---
  - id: ERR_MOVE_NOT_ACTIONABLE
    http: 409
    condition: "the move's lifecycle_status does not permit the requested operation (for example mapping a move still in INTAKE, completing a move that is not IN_SERVICE, or writing to a CANCELLED or DUPLICATE_MERGED move)"
  - id: ERR_ORDER_NOT_SCHEDULABLE
    http: 409
    condition: "the utility order's provision_status or credit_status does not permit the requested operation (scheduling a SCHEDULED order, activating a DRAFT order, closing a SCHEDULED order, waiving an ACTIVE_SERVICE order, paying a deposit that is not DEPOSIT_DUE)"
  - id: ERR_CREDIT_NOT_CLEARED
    http: 409
    condition: "activation is attempted while credit_status is PENDING_CHECK, DEPOSIT_DUE, DECLINED or VOIDED instead of NOT_REQUIRED, CLEARED or DEPOSIT_PAID"
  - id: ERR_FILING_NOT_SUBMITTABLE
    http: 409
    condition: "the filing's status does not permit the requested operation (submitting a SUBMITTED or CONFIRMED filing, posting a USPS response to a DRAFT filing, cancelling a CONFIRMED filing)"
  - id: ERR_PLACEMENT_NOT_CONVERTIBLE
    http: 409
    condition: "the placement's placement_status does not permit the requested operation (converting a PLACED placement, settling a placement that is not CONVERTED, reversing a SETTLED or VOIDED placement)"
  - id: ERR_CONSENT_ALREADY_TERMINAL
    http: 409
    condition: "revocation is attempted on a consent record already SUPERSEDED, REVOKED or EXPIRED"
  - id: ERR_VERIFICATION_ALREADY_DECIDED
    http: 409
    condition: "a KBA result is posted to a verification that is no longer PENDING"
  - id: ERR_HANDOFF_NOT_OPEN
    http: 409
    condition: "a bureau response is posted to a handoff that is RESPONDED or VOIDED"
  # --- optimistic concurrency ---
  - id: ERR_STALE_RESIDENT_VERSION
    http: 412
    condition: "expected_resident_version does not match the resident's current version on consent creation"
  - id: ERR_STALE_MOVE_VERSION
    http: 412
    condition: "expected_move_version does not match the move's current version on referral placement or duplicate resolution"
  # --- business safety ---
  - id: ERR_IDENTITY_NOT_VERIFIED
    http: 422
    condition: "a provisioning or address-change write is attempted before the move has a PASSED identity verification"
  - id: ERR_IDENTITY_VERIFICATION_EXPIRED
    http: 422
    condition: "the move's passed identity verification is older than IDENTITY_VALIDITY_DAYS at the time of the write"
  - id: ERR_VERIFICATION_ATTEMPTS_EXHAUSTED
    http: 409
    condition: "a further verification attempt is opened after MAX_IDENTITY_ATTEMPTS attempts have been recorded"
  # --- business referential ---
  - id: ERR_CONSENT_MISSING
    http: 422
    condition: "no GRANTED ConsentRecord exists for the scope the operation requires"
  - id: ERR_CONSENT_REVOKED
    http: 409
    condition: "the move's consent_gate is BLOCKED because a required consent was revoked or expired"
  - id: ERR_MARKETING_OPT_OUT
    http: 422
    condition: "a referral placement or conversion is attempted for a resident whose marketing_opt_out is true"
  - id: ERR_NO_PROVIDER_COVERAGE
    http: 422
    condition: "no ACTIVE provider has a territory covering the service address postal code and the move date for any requested utility type"
  - id: ERR_MISSING_ACCOUNT_DATA
    http: 422
    condition: "account_data omits a key listed in the provider's required_account_fields or supplies it empty"
  - id: ERR_PROVIDER_INACTIVE
    http: 409
    condition: "the order's provider has provider_status INACTIVE at scheduling or activation time"
  - id: ERR_FEED_SUSPENDED
    http: 409
    condition: "move intake references a FeedSource whose feed_status is SUSPENDED"
  - id: ERR_DUPLICATE_MOVE_UNRESOLVED
    http: 409
    condition: "downstream work is attempted on a move whose duplicate_flag is still SUSPECTED"
  - id: ERR_ADDRESS_NOT_DELIVERABLE
    http: 422
    condition: "the destination address has usps_deliverable false at filing submission"
  # --- business temporal ---
  - id: ERR_MOVE_DATE_OUT_OF_RANGE
    http: 422
    condition: "move_date is more than MOVE_DATE_PAST_GRACE_DAYS before or MOVE_DATE_HORIZON_DAYS after the logical clock date"
  - id: ERR_INVALID_SERVICE_WINDOW
    http: 422
    condition: "scheduled_window_start is not before scheduled_window_end, the window does not fall on requested_service_date, or it spans more than MAX_WINDOW_HOURS"
  - id: ERR_LEAD_TIME_VIOLATION
    http: 422
    condition: "requested_service_date is earlier than clock_date plus the provider's scheduling_lead_days and the same-day stop waiver does not apply"
  - id: ERR_SERVICE_WINDOW_CONFLICT
    http: 409
    condition: "the requested half-open window intersects another SCHEDULED or ACTIVE_SERVICE order's window for the same service address and utility type"
  - id: ERR_TERRITORY_OVERLAP
    http: 409
    condition: "a new default-carrier territory row does not leave TERRITORY_GAP_BUFFER_DAYS of clear space after an existing default row for the same postal code and utility type"
  - id: ERR_FORWARD_DATE_INVALID
    http: 422
    condition: "forward_start_date is before the logical clock date at submission"
  - id: ERR_FORWARDING_PERIOD_CONFLICT
    http: 409
    condition: "the resident already has a SUBMITTED or CONFIRMED filing whose forwarding period intersects the one being submitted"
  - id: ERR_ATTRIBUTION_WINDOW_EXPIRED
    http: 422
    condition: "a conversion is reported after the partner's attribution window has elapsed from the applicable anchor"
  - id: ERR_ACTIVATION_TOO_EARLY
    http: 409
    condition: "activation is attempted before scheduled_window_start"
  - id: ERR_MOVE_DATE_NOT_REACHED
    http: 409
    condition: "completion is attempted before the move_date has arrived on the logical clock"
  # --- business constraint ---
  - id: ERR_TYPE_ALREADY_MAPPED
    http: 409
    condition: "provider mapping would create a second order for a (utility_type, order_kind) pair the move already has in DRAFT, SCHEDULED, ACTIVE_SERVICE or SUSPENDED"
  - id: ERR_HANDOFF_ALREADY_OPEN
    http: 409
    condition: "a second credit check is opened while the order already has a SUBMITTED handoff"
  - id: ERR_DUPLICATE_VERTICAL_PLACEMENT
    http: 409
    condition: "the move already has a live placement in the partner's vertical"
  - id: ERR_RESUBMIT_LIMIT_REACHED
    http: 409
    condition: "a rejected filing is resubmitted after MAX_FILING_RESUBMITS resubmissions"
  - id: ERR_SELF_MERGE_FORBIDDEN
    http: 422
    condition: "survivor_move_id equals the move being resolved"
  - id: ERR_SURVIVOR_MOVE_INVALID
    http: 422
    condition: "the survivor move is terminal or shares neither the resident nor the destination address hash of the merged move"
  - id: ERR_UNRESOLVED_PROVISION_FAILURE
    http: 409
    condition: "attention clearance is attempted while a failed or credit-declined order still has no replacement order"
  # --- business fiscal ---
  - id: ERR_DEPOSIT_CAP_EXCEEDED
    http: 422
    condition: "a FLAT provider is registered with flat_deposit_cents above DEPOSIT_CAP_CENTS"
  - id: ERR_DEPOSIT_AMOUNT_MISMATCH
    http: 422
    condition: "the paid amount_cents differs from the order's deposit_amount_cents"
  - id: ERR_PARTNER_PAUSED
    http: 409
    condition: "a placement is attempted against a partner whose partner_status is PAUSED"
  - id: ERR_PARTNER_CAP_REACHED
    http: 409
    condition: "the partner has already reached monthly_placement_cap placements in the logical clock's calendar month"
  - id: ERR_SETTLEMENT_AMOUNT_INVALID
    http: 422
    condition: "settled_gross_revenue_cents is below 1 or above twice the recorded gross_revenue_cents"

roles:
  - name: PlatformAdmin
    description: "Operator of the concierge platform; configures feeds, providers, territories and partners and settles or reverses referral revenue"
    identity: "opaque"
    exclusive_operations:
      - "POST /feed-sources"
      - "PATCH /feed-sources/{id}/status"
      - "POST /utility-providers"
      - "PATCH /utility-providers/{id}/status"
      - "POST /referral-partners"
      - "PATCH /referral-partners/{id}/status"
      - "POST /referral-placements/{id}/settlement"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "every read endpoint"
      - "POST /residents"
      - "POST /service-addresses"
      - "POST /provider-service-territories"
      - "POST /moves"
      - "POST /moves/{id}/identity-verifications (including MANUAL_OVERRIDE)"
      - "POST /moves/{id}/provider-mapping"
      - "POST /moves/{id}/duplicate-resolution"
      - "POST /moves/{id}/cancellation"
      - "POST /moves/{id}/attention-clearances"
      - "POST /moves/{id}/completion"
      - "POST /moves/{id}/consent-evaluations"
      - "POST /utility-orders/{id}/schedule"
      - "POST /utility-orders/{id}/credit-checks"
      - "POST /utility-orders/{id}/deposit-payments"
      - "POST /utility-orders/{id}/activation"
      - "POST /utility-orders/{id}/provision-failure"
      - "POST /utility-orders/{id}/closure"
      - "POST /utility-orders/{id}/waiver"
      - "POST /moves/{id}/address-change-filings"
      - "POST /address-change-filings/{id}/submission"
      - "POST /address-change-filings/{id}/cancellation"
      - "POST /residents/{id}/consent-records"
      - "POST /consent-records/{id}/revocation"
      - "PATCH /residents/{id}/marketing-preferences"
      - "POST /moves/{id}/referral-placements"
      - "POST /referral-placements/{id}/acceptance"
      - "POST /referral-placements/{id}/decline"
      - "POST /referral-placements/{id}/conversions"
      - "POST /referral-placements/{id}/reversal"
      - "POST /identity-verifications/{id}/kba-result"
      - "POST /credit-check-handoffs/{id}/bureau-response"
      - "POST /address-change-filings/{id}/usps-response"
  - name: FeedIntegrator
    description: "Property-manager or mover system that pushes move records; X-User-ID is the FeedSource id and every move it creates or cancels must carry that feed_source_id"
    identity: "entity_backed:FeedSource"
    exclusive_operations: []
    shared_operations:
      - "POST /residents"
      - "POST /service-addresses"
      - "POST /moves (feed_source_id must equal X-User-ID)"
      - "POST /moves/{id}/cancellation (only for its own moves)"
      - "GET /feed-sources/{id}, GET /moves, GET /moves/{id}, GET /revenue-share-ledger-entries"
  - name: MoveOpsAgent
    description: "Concierge operations agent who drives the move through identity, mapping, scheduling, filing and referral steps"
    identity: "opaque"
    exclusive_operations:
      - "POST /moves/{id}/provider-mapping"
      - "POST /moves/{id}/attention-clearances"
      - "POST /moves/{id}/completion"
      - "POST /utility-orders/{id}/schedule"
      - "POST /utility-orders/{id}/credit-checks"
      - "POST /utility-orders/{id}/waiver"
      - "POST /moves/{id}/referral-placements"
    shared_operations:
      - "POST /residents"
      - "POST /service-addresses"
      - "POST /moves"
      - "POST /moves/{id}/identity-verifications (KBA only)"
      - "POST /moves/{id}/duplicate-resolution"
      - "POST /moves/{id}/cancellation"
      - "POST /moves/{id}/consent-evaluations"
      - "POST /utility-orders/{id}/deposit-payments"
      - "POST /utility-orders/{id}/closure"
      - "POST /moves/{id}/address-change-filings"
      - "POST /address-change-filings/{id}/submission"
      - "POST /residents/{id}/consent-records"
      - "all read endpoints except the ledger single-entry read"
  - name: ComplianceOfficer
    description: "Privacy and identity compliance reviewer; owns manual identity overrides, consent revocation and filing withdrawal, and is barred by segregation of duties from submitting a filing whose override it granted"
    identity: "opaque"
    exclusive_operations:
      - "POST /moves/{id}/identity-verifications with method MANUAL_OVERRIDE"
      - "POST /address-change-filings/{id}/cancellation"
    shared_operations:
      - "POST /moves/{id}/consent-evaluations"
      - "POST /moves/{id}/address-change-filings"
      - "POST /address-change-filings/{id}/submission"
      - "POST /residents/{id}/consent-records"
      - "POST /consent-records/{id}/revocation"
      - "PATCH /residents/{id}/marketing-preferences"
      - "all read endpoints"
  - name: Resident
    description: "The moving resident; X-User-ID is the Resident id. May grant or revoke its own consents, set its marketing preference, pay a deposit and read its own move"
    identity: "entity_backed:Resident"
    exclusive_operations: []
    shared_operations:
      - "POST /residents/{id}/consent-records (own resident id only)"
      - "POST /consent-records/{id}/revocation (own records only)"
      - "PATCH /residents/{id}/marketing-preferences (own resident id only)"
      - "POST /utility-orders/{id}/deposit-payments"
      - "GET /residents/{id}, GET /moves/{id}, GET /consent-records/{id}, GET /address-change-filings/{id}"
  - name: ProviderAgent
    description: "Utility provider back office; X-User-ID is the UtilityProvider id. Declares territories and reports activation, failure and closure for its own orders"
    identity: "entity_backed:UtilityProvider"
    exclusive_operations:
      - "POST /utility-orders/{id}/activation"
      - "POST /utility-orders/{id}/provision-failure"
    shared_operations:
      - "POST /provider-service-territories (provider_id must equal X-User-ID)"
      - "POST /utility-orders/{id}/closure"
      - "GET /utility-providers/{id}, GET /provider-service-territories, GET /provider-service-territories/{id}, GET /utility-orders, GET /utility-orders/{id}"
  - name: PartnerAgent
    description: "Internet, insurance or mover partner; X-User-ID is the ReferralPartner id. Accepts, declines, converts and may reverse only its own placements"
    identity: "entity_backed:ReferralPartner"
    exclusive_operations:
      - "POST /referral-placements/{id}/acceptance"
      - "POST /referral-placements/{id}/decline"
      - "POST /referral-placements/{id}/conversions"
    shared_operations:
      - "POST /referral-placements/{id}/reversal (own placements only)"
      - "GET /referral-partners/{id}, GET /referral-placements, GET /referral-placements/{id}, GET /revenue-share-ledger-entries"
  - name: ExternalServiceGateway
    description: "Inbound gateway for third-party callbacks: KBA vendor results, credit bureau scores and USPS filing responses. Opaque operator identity, never an entity id"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /identity-verifications/{id}/kba-result"
      - "POST /credit-check-handoffs/{id}/bureau-response"
      - "POST /address-change-filings/{id}/usps-response"
