            - { call: "POST /rescue-ops/entry-permits/${per}/suspend", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/incidents", payload: { severity: "SERIOUS", kind: "MEDICAL", description: "Heat stress complaint" }, as: SafetyOfficer, as_user_id: "${so1_id}", captures: { inc: "$.data.id" } }
            - { call: "POST /rescue-ops/incidents/${inc}/triage", payload: {}, as: SafetyOfficer, as_user_id: "${so2_id}" }
