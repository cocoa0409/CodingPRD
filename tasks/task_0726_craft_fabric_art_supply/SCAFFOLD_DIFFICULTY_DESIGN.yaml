scaffold_difficulty_design:
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_pricing_provisional_vs_final_on_order
        grounds:
          - calculations.order_pricing
          - state_machines.Order.SUBMITTED_to_READY_FOR_PICKUP
          - entities.Order.fields.provisional_total_cents
          - entities.Order.fields.final_total_cents
        distinguishing_aspect: "On the Order domain, provisional uses requested_yards (2.5yd) and final uses actual_cut_yards (2.75yd), yielding 875 vs 963 cents — two valid totals from the same order."
        test_recipe:
          setup:
            - "Customer C with loyalty account; product P (BY_YARD, unit_price_cents=350, min_cut_increment_yards=0.25); InventoryLot with on_hand_yards=100."
            - "Order O in BUILDING with one line for P, requested_yards=2.5."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c1@x.com", full_name: "C One", home_store_code: "CA01" }
              as: StoreAssociate
              captures: { c_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "FAB-350", name: "Cotton", sell_mode: "BY_YARD", unit_price_cents: 350, min_cut_increment_yards: 0.25 }
              as: StoreManager
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-lots"
              payload: { on_hand_yards: 100 }
              as: StoreManager
              captures: { lot_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
            - call: "POST /orders/${o_id}/lines"
              payload: { product_id: "${p_id}", requested_yards: 2.5 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { line_id: $.data.id }
            - call: "POST /orders/${o_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /orders/${o_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
            - call: "PATCH /order-lines/${line_id}/record-cut"
              payload: { actual_cut_yards: 2.75 }
              as: StoreAssociate
          trigger:
            - call: "POST /orders/${o_id}/ready"
              payload: {}
              as: StoreAssociate
              captures: { final_total: $.data.final_total_cents, prov_total: $.data.provisional_total_cents }
          assert:
            - "Order.${o_id}.provisional_total_cents == 875"
            - "Order.${o_id}.final_total_cents == 963"

      - name: loyalty_tier_forward_vs_chronological_on_account
        grounds:
          - calculations.loyalty_tier
          - entities.LoyaltyAccount.fields.tier_forward
          - entities.LoyaltyAccount.fields.tier_chronological
        distinguishing_aspect: "On the LoyaltyAccount domain, forward annualizes 30000c YTD over 91 elapsed days (=120329c -> SILVER) while chronological sums the same 30000c trailing spend (-> BASIC): two tiers from identical spend."
        test_recipe:
          setup:
            - "Clock at 2026-04-01T00:00:00Z (day 91 of year)."
            - "Customer C completed one PICKED_UP order with final_total_cents=30000, so spend_ytd_cents=30000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /customers"
              payload: { email: "c2@x.com", full_name: "C Two", home_store_code: "CA01" }
              as: StoreAssociate
              captures: { c_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "KIT-300", name: "Kit", sell_mode: "UNIT", unit_price_cents: 30000 }
              as: StoreManager
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-lots"
              payload: { on_hand_yards: 10 }
              as: StoreManager
              captures: { lot_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
            - call: "POST /orders/${o_id}/lines"
              payload: { product_id: "${p_id}", requested_yards: 1 }
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /orders/${o_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /orders/${o_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /orders/${o_id}/ready"
              payload: {}
              as: StoreAssociate
            - call: "POST /orders/${o_id}/pickup"
              payload: {}
              as: StoreAssociate
          trigger:
            - call: "GET /customers/${c_id}/loyalty-account"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
              captures: { tf: "$.data[0].tier_forward", tc: "$.data[0].tier_chronological" }
          assert:
            - "LoyaltyAccount.tier_forward == SILVER"
            - "LoyaltyAccount.tier_chronological == BASIC"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: order_pricing_round_per_line_then_sum
        grounds:
          - calculations.order_pricing
          - entities.OrderLine.fields.line_subtotal_cents
          - entities.Order.fields.provisional_total_cents
        distinguishing_aspect: "Mode (b) nested rounding: 499.5->500 and 832.5->833 rounded per line sum to 1333, whereas sum-then-round (1332.0->1332) would give 1332; scaffold pins per-line-then-sum."
        test_recipe:
          setup:
            - "Product PR (BY_YARD, unit_price_cents=333, min_cut_increment_yards=0.5); InventoryLot on_hand_yards=100."
            - "Order with two lines: requested_yards=1.5 and requested_yards=2.5."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c3@x.com", full_name: "C Three", home_store_code: "CA01" }
              as: StoreAssociate
              captures: { c_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "FAB-333", name: "Linen", sell_mode: "BY_YARD", unit_price_cents: 333, min_cut_increment_yards: 0.5 }
              as: StoreManager
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-lots"
              payload: { on_hand_yards: 100 }
              as: StoreManager
            - call: "POST /orders"
              payload: { customer_id: "${c_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
            - call: "POST /orders/${o_id}/lines"
              payload: { product_id: "${p_id}", requested_yards: 1.5 }
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /orders/${o_id}/lines"
              payload: { product_id: "${p_id}", requested_yards: 2.5 }
              as: Customer
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /orders/${o_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
              captures: { prov: $.data.provisional_total_cents }
          assert:
            - "Order.${o_id}.provisional_total_cents == 1333"

      - name: framing_quote_tiered_rate_selection
        grounds:
          - calculations.framing_quote
          - entities.FramingOrder.fields.quoted_price_cents
        distinguishing_aspect: "Mode (a) non-linear: quote depends on width, height, tier-selected rate and base; united_inches=40 selects SMALL rate 15 -> 2000 + 15*80 = 3200 cents."
        test_recipe:
          setup:
            - "Customer C; a BUILDING order O (framing links to an order)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c4@x.com", full_name: "C Four", home_store_code: "CA01" }
              as: StoreAssociate
              captures: { c_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /framing-orders"
              payload: { order_id: "${o_id}", customer_id: "${c_id}", width_in: 20, height_in: 20 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { f_id: $.data.id, qp: $.data.quoted_price_cents }
          assert:
            - "FramingOrder.${f_id}.quoted_price_cents == 3200"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_parallel_payment_and_fulfillment_dimensions
        grounds:
          - state_machines.Order.field.fulfillment_status
          - state_machines.Order.field.payment_status
          - state_machines.Order.SUBMITTED_to_READY_FOR_PICKUP
        distinguishing_aspect: "Order carries two independent axes: after submit fulfillment_status=SUBMITTED while payment_status stays UNPAID; paying advances only payment_status to PAID, leaving fulfillment_status=SUBMITTED."
        test_recipe:
          setup:
            - "Order O submitted (fulfillment_status=SUBMITTED, payment_status=UNPAID)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c5@x.com", full_name: "C Five", home_store_code: "CA01" }
              as: StoreAssociate
              captures: { c_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "UNIT-500", name: "Brush", sell_mode: "UNIT", unit_price_cents: 500 }
              as: StoreManager
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-lots"
              payload: { on_hand_yards: 50 }
              as: StoreManager
            - call: "POST /orders"
              payload: { customer_id: "${c_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
            - call: "POST /orders/${o_id}/lines"
              payload: { product_id: "${p_id}", requested_yards: 1 }
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /orders/${o_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /orders/${o_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
              captures: { fs: $.data.fulfillment_status, ps: $.data.payment_status }
          assert:
            - "Order.${o_id}.payment_status == PAID"
            - "Order.${o_id}.fulfillment_status == SUBMITTED"

      - name: workshop_registration_cyclic_waitlist_promotion
        grounds:
          - state_machines.WorkshopRegistration.WAITLISTED_to_REGISTERED
          - state_machines.WorkshopRegistration.REGISTERED_to_CANCELLED
          - calculations.waitlist_promotion
        distinguishing_aspect: "Cyclic machine on WorkshopRegistration: a WAITLISTED registration returns to REGISTERED when a seat frees, a non-linear back-edge distinct from Order's parallel axes."
        test_recipe:
          setup:
            - "Workshop W OPEN with a session capacity=1; registration R1 REGISTERED, R2 WAITLISTED (created after R1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /customers"
              payload: { email: "c6a@x.com", full_name: "C6a", home_store_code: "CA01" }
              as: StoreAssociate
              captures: { c1_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c6b@x.com", full_name: "C6b", home_store_code: "CA01" }
              as: StoreAssociate
              captures: { c2_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "Room A" }
              as: StoreManager
              captures: { r_id: $.data.id }
            - call: "POST /workshops"
              payload: { title: "Knitting 101" }
              as: StoreManager
              captures: { w_id: $.data.id }
            - call: "POST /workshops/${w_id}/sessions"
              payload: { room_id: "${r_id}", instructor_code: "INS1", starts_at: "2026-08-01T10:00:00Z", ends_at: "2026-08-01T12:00:00Z", capacity: 1 }
              as: StoreManager
              captures: { s_id: $.data.id }
            - call: "POST /workshops/${w_id}/open"
              payload: {}
              as: StoreManager
            - call: "POST /workshops/${w_id}/register"
              payload: { session_id: "${s_id}", customer_id: "${c1_id}" }
              as: Customer
              as_user_id: "${c1_id}"
              captures: { reg1_id: $.data.id }
            - call: "POST /workshops/${w_id}/register"
              payload: { session_id: "${s_id}", customer_id: "${c2_id}" }
              as: Customer
              as_user_id: "${c2_id}"
              captures: { reg2_id: $.data.id }
          trigger:
            - call: "POST /workshop-registrations/${reg1_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${c1_id}"
            - call: "GET /workshop-registrations/${reg2_id}"
              payload: {}
              as: Customer
              as_user_id: "${c2_id}"
              captures: { r2status: $.data.status }
          assert:
            - "WorkshopRegistration.${reg2_id}.status == REGISTERED"
            - "WorkshopSession.${s_id}.registered_count == 1"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: workshop_cancel_cascade_to_inventory_release
        grounds:
          - state_machines.Workshop.transitions
          - state_machines.WorkshopRegistration.transitions
          - state_machines.Order.BUILDING_to_SUBMITTED
          - entities.InventoryLot.fields.reserved_yards
        distinguishing_aspect: "Depth-3 cascade from Workshop cancel: Workshop->CANCELLED causes Registration->CANCELLED, which causes its supply-kit OrderLine->CANCELLED, which releases the InventoryLot reservation (reserved_yards back to 0)."
        test_recipe:
          setup:
            - "Workshop W OPEN with kit_product_id=KP (UNIT); session S; customer C registered with order O carrying a submitted supply-kit line reserving 1 unit (reserved_yards=1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /customers"
              payload: { email: "c7@x.com", full_name: "C Seven", home_store_code: "CA01" }
              as: StoreAssociate
              captures: { c_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "KIT-P", name: "Kit Bag", sell_mode: "UNIT", unit_price_cents: 1000 }
              as: StoreManager
              captures: { kp_id: $.data.id }
            - call: "POST /products/${kp_id}/inventory-lots"
              payload: { on_hand_yards: 5 }
              as: StoreManager
              captures: { lot_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "Room B" }
              as: StoreManager
              captures: { r_id: $.data.id }
            - call: "POST /workshops"
              payload: { title: "Painting", kit_product_id: "${kp_id}" }
              as: StoreManager
              captures: { w_id: $.data.id }
            - call: "POST /workshops/${w_id}/sessions"
              payload: { room_id: "${r_id}", instructor_code: "INS2", starts_at: "2026-08-02T10:00:00Z", ends_at: "2026-08-02T12:00:00Z", capacity: 10 }
              as: StoreManager
              captures: { s_id: $.data.id }
            - call: "POST /workshops/${w_id}/open"
              payload: {}
              as: StoreManager
            - call: "POST /orders"
              payload: { customer_id: "${c_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
            - call: "POST /workshops/${w_id}/register"
              payload: { session_id: "${s_id}", customer_id: "${c_id}", order_id: "${o_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /orders/${o_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /workshops/${w_id}/cancel"
              payload: {}
              as: StoreManager
            - call: "GET /inventory-lots/${lot_id}"
              payload: {}
              as: StoreManager
              captures: { res: $.data.reserved_yards }
          assert:
            - "WorkshopRegistration.${reg_id}.status == CANCELLED"
            - "InventoryLot.${lot_id}.reserved_yards == 0"
            - "InventoryLot.${lot_id}.available_yards == 5"

      - name: order_cancel_cascade_to_inventory_release
        grounds:
          - state_machines.Order.transitions
          - entities.OrderLine.fields.status
          - entities.InventoryLot.fields.reserved_yards
        distinguishing_aspect: "Depth-2 cascade from a different trigger (Order cancel): Order->CANCELLED causes OrderLine->CANCELLED, which releases the InventoryLot reservation; distinct origin from the workshop-cancel chain."
        test_recipe:
          setup:
            - "Order O SUBMITTED with one BY_YARD line reserving 3 yards (reserved_yards=3 on a lot with on_hand_yards=10)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c8@x.com", full_name: "C Eight", home_store_code: "CA01" }
              as: StoreAssociate
              captures: { c_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "FAB-200", name: "Wool", sell_mode: "BY_YARD", unit_price_cents: 200, min_cut_increment_yards: 1 }
              as: StoreManager
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-lots"
              payload: { on_hand_yards: 10 }
              as: StoreManager
              captures: { lot_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
            - call: "POST /orders/${o_id}/lines"
              payload: { product_id: "${p_id}", requested_yards: 3 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { line_id: $.data.id }
            - call: "POST /orders/${o_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /orders/${o_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
            - call: "GET /inventory-lots/${lot_id}"
              payload: {}
              as: StoreManager
              captures: { res: $.data.reserved_yards }
          assert:
            - "OrderLine.${line_id}.status == CANCELLED"
            - "InventoryLot.${lot_id}.reserved_yards == 0"
            - "InventoryLot.${lot_id}.available_yards == 10"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: coupon_expired_beats_not_stackable
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_COUPON_EXPIRED]
          - errors[ERR_COUPON_NOT_STACKABLE]
        distinguishing_aspect: "business_temporal (priority 6, ERR_COUPON_EXPIRED) outranks business_constraint (priority 10, ERR_COUPON_NOT_STACKABLE): applying an expired non-stackable second coupon returns ERR_COUPON_EXPIRED."
        test_recipe:
          setup:
            - "Clock at 2026-06-15. Order O in BUILDING with one line. Coupon A (stackable) already applied. Coupon B is non-stackable AND expired (valid_to=2026-06-01)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: StoreManager
            - call: "POST /customers"
              payload: { email: "c9@x.com", full_name: "C Nine", home_store_code: "CA01" }
              as: StoreAssociate
              captures: { c_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "UNIT-1000", name: "Canvas", sell_mode: "UNIT", unit_price_cents: 1000 }
              as: StoreManager
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-lots"
              payload: { on_hand_yards: 50 }
              as: StoreManager
            - call: "POST /coupons"
              payload: { code: "STACKA", discount_type: "PERCENT", value: 0.1, stackable: true, priority: 1, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T00:00:00Z" }
              as: StoreManager
            - call: "POST /coupons"
              payload: { code: "OLDB", discount_type: "FIXED", value: 100, stackable: false, priority: 2, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-06-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /orders"
              payload: { customer_id: "${c_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id, ov0: $.data.version }
            - call: "POST /orders/${o_id}/lines"
              payload: { product_id: "${p_id}", requested_yards: 5 }
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /orders/${o_id}/coupons"
              payload: { code: "STACKA", expected_order_version: "${ov0}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { ov1: $.data.version }
          trigger:
            - call: "POST /orders/${o_id}/coupons"
              payload: { code: "OLDB", expected_order_version: "${ov1}" }
              as: Customer
              as_user_id: "${c_id}"
          assert:
            - "HTTP status == 422"
            - "error_id == ERR_COUPON_EXPIRED"

      - name: order_invalid_state_beats_insufficient_points_on_pay
        grounds:
          - validations[priority=5]
          - validations[priority=12]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_INSUFFICIENT_POINTS]
        distinguishing_aspect: "state (priority 5, ERR_INVALID_STATE) outranks business_fiscal (priority 12, ERR_INSUFFICIENT_POINTS): paying a still-BUILDING order while redeeming more points than owned returns ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Order O still in BUILDING (never submitted). Customer loyalty points_balance=0."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c10@x.com", full_name: "C Ten", home_store_code: "CA01" }
              as: StoreAssociate
              captures: { c_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /orders/${o_id}/pay"
              payload: { points_redeemed_on_order: 100 }
              as: Customer
              as_user_id: "${c_id}"
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: loyalty_silver_threshold_exact_boundary
        grounds:
          - calculations.loyalty_tier
          - entities.LoyaltyAccount.fields.tier_chronological
        distinguishing_aspect: "Numeric threshold on spend: rolling spend exactly 50000 cents (== SILVER_CENTS) qualifies SILVER via >=, reached through GET /customers/{id}/loyalty-account."
        test_recipe:
          setup:
            - "Clock at 2026-06-01. Customer C with exactly one PICKED_UP order of final_total_cents=50000 (rolling spend=50000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /customers"
              payload: { email: "c11@x.com", full_name: "C Eleven", home_store_code: "CA01" }
              as: StoreAssociate
              captures: { c_id: $.data.id }
            - call: "POST /products"
