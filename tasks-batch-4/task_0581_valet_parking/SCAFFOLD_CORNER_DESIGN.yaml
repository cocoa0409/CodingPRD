              as: Attendant
              as_user_id: "${a1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_LOT_VERSION"
            - "response.http_status == 412"

      - name: lot_version_increments_on_checkin
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[checkin-stale-lot-version]", entities.Lot.fields.version]
        distinguishing_aspect: "A successful check-in increments the primary Lot.version from 1 to 2."
        test_recipe:
          setup: ["ACTIVE event; a fresh lot at version 1."]
          setup_api_calls:
            - call: "POST /valet/venues"
              payload: { name: "V1", address: "1 St" }
              as: Supervisor
              captures: { venue_id: $.data.id }
            - call: "POST /valet/events"
              payload: { venue_id: "${venue_id}", name: "E1", window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T23:00:00Z" }
              as: Supervisor
              captures: { event_id: $.data.id }
            - call: "POST /valet/events/${event_id}/activate"
              payload: {}
              as: Supervisor
            - call: "POST /valet/lots"
              payload: { venue_id: "${venue_id}", name: "L1", capacity: 5 }
              as: Supervisor
              captures: { lot_id: $.data.id, lot_v0: $.data.version }
            - call: "POST /valet/attendants"
              payload: { venue_id: "${venue_id}", name: "Ana" }
              as: Supervisor
              captures: { a1_id: $.data.id }
          trigger:
            - call: "POST /valet/tickets"
              payload: { event_id: "${event_id}", lot_id: "${lot_id}", attendant_id: "${a1_id}", license_plate: "X1", key_tag: "K1", checkin_at: "2026-06-01T10:00:00Z", estimated_departure_at: "2026-06-01T12:00:00Z", expected_lot_version: "${lot_v0}" }
              as: Attendant
              as_user_id: "${a1_id}"
          assert:
            - "Lot.${lot_id}.version == 2"
            - "Lot.${lot_id}.occupied_count == 1"

      - name: derived_attendant_liability_reconciled
        claim_type: derived_field_reconciliation
        grounds: [entities.Attendant.fields.total_liability_cents]
        excluded_because:
          difficulty_instance: transitive_cascade / claim_approve_liability_suspends_attendant_closes_shift
          rationale: "Attendant.total_liability_cents derived-field update is asserted end-to-end by the named §1.8 cascade instance."

  # =========================================================================
  - section: consistency_model
    instances:
      - name: checkin_side_effects_visible_same_response
        claim_type: immediate
        grounds: [entities.Ticket.fields.quoted_fee_cents, entities.Lot.fields.occupied_count]
        distinguishing_aspect: "The check-in response already reflects the computed quoted_fee_cents, and an immediate lot GET shows occupied_count incremented — no eventual lag."
        test_recipe:
          setup: ["ACTIVE event, empty lot capacity 5, attendant."]
          setup_api_calls:
            - call: "POST /valet/venues"
              payload: { name: "V1", address: "1 St" }
              as: Supervisor
              captures: { venue_id: $.data.id }
            - call: "POST /valet/events"
              payload: { venue_id: "${venue_id}", name: "E1", window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T23:00:00Z" }
              as: Supervisor
              captures: { event_id: $.data.id }
            - call: "POST /valet/events/${event_id}/activate"
              payload: {}
              as: Supervisor
            - call: "POST /valet/lots"
              payload: { venue_id: "${venue_id}", name: "L1", capacity: 5 }
              as: Supervisor
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /valet/attendants"
              payload: { venue_id: "${venue_id}", name: "Ana" }
              as: Supervisor
              captures: { a1_id: $.data.id }
            - call: "POST /valet/tickets"
              payload: { event_id: "${event_id}", lot_id: "${lot_id}", attendant_id: "${a1_id}", license_plate: "X1", key_tag: "K1", checkin_at: "2026-06-01T10:00:00Z", estimated_departure_at: "2026-06-01T12:00:00Z", expected_lot_version: "${lot_v}" }
              as: Attendant
              as_user_id: "${a1_id}"
              captures: { ticket_id: $.data.id, q: $.data.quoted_fee_cents }
          trigger:
            - call: "GET /valet/lots/${lot_id}"
              payload: {}
              as: Supervisor
          assert:
            - "Ticket.${ticket_id}.quoted_fee_cents == 2100"
            - "Lot.${lot_id}.occupied_count == 1"
