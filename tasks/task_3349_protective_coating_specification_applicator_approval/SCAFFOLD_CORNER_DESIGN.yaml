          - "entities.CoatingSystem.fields.surface_prep_standard"
        distinguishing_aspect: "For a system whose surface_prep_standard is SSPC_SP11_POWER_TOOL, the DFT verdict uses the GAGE_80_20 count-based variant (>=80% of spots within [spec_min, spec_max]) rather than the average-based SPOT_AVERAGE — the variant selection is driven by the prep standard."
