scaffold_corner_design:
  # =================================================================
  # Entities — creation, retrieval, required fields, computed/system fields
  # =================================================================
  - section: entities
    instances:
      - name: create_animal_returns_201_with_initial_axes
        claim_type: Creation
        grounds:
          - entities.Animal.fields.lifecycle_status
          - entities.Animal.fields.medical_status
        distinguishing_aspect: "POST /animals with name/species/age_months -> 201; lifecycle_status=INTAKE_PENDING, medical_status=UNEXAMINED, microchipped=false, version=1."
        test_recipe:
          setup: ["empty DB; shelter bootstrapped"]
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter" }
              as: ShelterAdmin
          trigger:
            - call: "POST /animals"
              payload: { name: "New", species: "DOG", age_months: 12 }
              as: IntakeOfficer
              captures: { animal_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Animal.${animal_id}.lifecycle_status == INTAKE_PENDING"
            - "Animal.${animal_id}.medical_status == UNEXAMINED"
            - "Animal.${animal_id}.microchipped == false"
            - "Animal.${animal_id}.version == 1"

      - name: get_animal_by_id_returns_stored_entity
        claim_type: Retrieval
        grounds:
          - "entities.Animal.fields.name"
        distinguishing_aspect: "GET /animals/{id} returns the same name/species/age_months that were stored at creation."
        test_recipe:
          setup: ["one animal created"]
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter" }
              as: ShelterAdmin
            - call: "POST /animals"
              payload: { name: "Echo", species: "CAT", age_months: 18 }
              as: IntakeOfficer
              captures: { animal_id: $.data.id }
          trigger:
            - call: "GET /animals/${animal_id}"
              payload: {}
              as: AdoptionCounselor
          assert:
            - "HTTP status == 200"
            - "response.data.name == Echo"
            - "response.data.species == CAT"
            - "response.data.age_months == 18"

      - name: get_animal_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /animals/{random-uuid} -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB; shelter bootstrapped"]
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter" }
              as: ShelterAdmin
          trigger:
            - call: "GET /animals/00000000-0000-4000-8000-000000000abc"
              payload: {}
              as: AdoptionCounselor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_animal_missing_species_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /animals omitting required species -> 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["shelter bootstrapped"]
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter" }
              as: ShelterAdmin
          trigger:
            - call: "POST /animals"
              payload: { name: "NoSpecies", age_months: 10 }
              as: IntakeOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_animal_invalid_species_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - "validations[priority=4]"
          - "entities.Animal.fields.species"
        distinguishing_aspect: "POST /animals with species=BIRD (not in {DOG,CAT}) -> 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["shelter bootstrapped"]
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter" }
              as: ShelterAdmin
          trigger:
            - call: "POST /animals"
              payload: { name: "Tweety", species: "BIRD", age_months: 5 }
              as: IntakeOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: shelter_defaults_applied_when_omitted
        claim_type: Defaults
        grounds:
          - entities.Shelter.fields.stray_hold_days
          - entities.Shelter.fields.promo_active
          - entities.Shelter.fields.dog_daily_board_cents
        distinguishing_aspect: "POST /shelters with only name -> stray_hold_days=5, promo_active=false, dog_daily_board_cents=1850, cat_daily_board_cents=1250, collected_fee_cents=0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /shelters"
              payload: { name: "DefaultShelter" }
              as: ShelterAdmin
              captures: { shelter_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Shelter.${shelter_id}.stray_hold_days == 5"
            - "Shelter.${shelter_id}.promo_active == false"
            - "Shelter.${shelter_id}.dog_daily_board_cents == 1850"
            - "Shelter.${shelter_id}.cat_daily_board_cents == 1250"
            - "Shelter.${shelter_id}.collected_fee_cents == 0"

      - name: microchip_create_sets_animal_microchipped_computed
        claim_type: Computed Fields
        grounds:
          - entities.Animal.fields.microchipped
          - state_machines.Animal.UNEXAMINED_to_CLEARED
        distinguishing_aspect: "After POST /microchips for an animal, GET /animals/{id} shows microchipped=true (computed from Microchip existence)."
        test_recipe:
          setup: ["animal SURRENDER intake IN_CUSTODY"]
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter" }
              as: ShelterAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShelterAdmin
            - call: "POST /animals"
              payload: { name: "Chip", species: "DOG", age_months: 24 }
              as: IntakeOfficer
              captures: { animal_id: $.data.id }
            - call: "POST /intake-records"
              payload: { animal_id: "${animal_id}", source: "SURRENDER", surrendering_party: "S" }
              as: IntakeOfficer
          trigger:
            - call: "POST /microchips"
              payload: { animal_id: "${animal_id}", chip_number: "CHIP-9001" }
              as: Veterinarian
          assert:
            - "HTTP status == 201"
            - "Animal.${animal_id}.microchipped == true"

      - name: intake_at_is_system_stamped_from_clock
        claim_type: System Fields
        grounds:
          - entities.IntakeRecord.fields.intake_at
          - calculations.stray_hold_release
        distinguishing_aspect: "POST /intake-records ignores any client intake_at; intake_at is stamped from the logical clock (2026-06-01T00:00:00Z) and stray_hold_release_at is computed for STRAY = +5 days."
        test_recipe:
          setup: ["shelter stray_hold_days=5; animal registered; clock at 2026-06-01"]
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter", stray_hold_days: 5 }
              as: ShelterAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShelterAdmin
            - call: "POST /animals"
              payload: { name: "Sys", species: "DOG", age_months: 30 }
              as: IntakeOfficer
              captures: { animal_id: $.data.id }
          trigger:
            - call: "POST /intake-records"
              payload: { animal_id: "${animal_id}", source: "STRAY" }
              as: IntakeOfficer
              captures: { ir_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "IntakeRecord.${ir_id}.intake_at == 2026-06-01T00:00:00.000Z"
            - "Animal.${animal_id}.stray_hold_release_at == 2026-06-06T00:00:00.000Z"

      - name: microchip_immutable_entity_no_version_field
        claim_type: Immutability
        grounds:
          - "entities.Microchip.fields.chip_number"
        distinguishing_aspect: "Microchip has common_fields:false — its create response carries id and created_at but no version field; no update endpoint exists."
        test_recipe:
          setup: ["animal SURRENDER intake"]
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter" }
              as: ShelterAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShelterAdmin
            - call: "POST /animals"
              payload: { name: "Imm", species: "CAT", age_months: 12 }
              as: IntakeOfficer
              captures: { animal_id: $.data.id }
            - call: "POST /intake-records"
              payload: { animal_id: "${animal_id}", source: "SURRENDER", surrendering_party: "I" }
              as: IntakeOfficer
          trigger:
            - call: "POST /microchips"
              payload: { animal_id: "${animal_id}", chip_number: "CHIP-9002" }
              as: Veterinarian
              captures: { chip_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "response.data.id is present"
            - "response.data has no field named version"

  # =================================================================
  # State machines — invalid-from, terminal lockdown, idempotency
  # =================================================================
  - section: state_machines
    instances:
      - name: reject_then_approve_rejected_application_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.AdoptionApplication.SUBMITTED_to_REJECTED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A REJECTED application approved again -> 409 ERR_INVALID_STATE; status stays REJECTED."
        test_recipe:
          setup: ["animal AVAILABLE; application SUBMITTED then REJECTED"]
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter" }
              as: ShelterAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShelterAdmin
            - call: "POST /animals"
              payload: { name: "Rej", species: "DOG", age_months: 36 }
              as: IntakeOfficer
              captures: { animal_id: $.data.id }
            - call: "POST /intake-records"
              payload: { animal_id: "${animal_id}", source: "SURRENDER", surrendering_party: "J" }
              as: IntakeOfficer
            - call: "POST /medical-records"
              payload: { animal_id: "${animal_id}", record_type: "EXAM", outcome: "CLEAR" }
              as: Veterinarian
            - call: "POST /animals/${animal_id}/make-available"
              payload: {}
              as: AdoptionCounselor
            - call: "POST /adopter-accounts"
              payload: { full_name: "Ree", email: "ree@x.com" }
              as: AdoptionCounselor
              captures: { adopter_id: $.data.id }
            - call: "POST /adoption-applications"
              payload: { animal_id: "${animal_id}", adopter_id: "${adopter_id}" }
              as: AdoptionCounselor
              captures: { app_id: $.data.id }
            - call: "POST /adoption-applications/${app_id}/reject"
              payload: {}
              as: AdoptionCounselor
          trigger:
            - call: "POST /adoption-applications/${app_id}/approve"
              payload: {}
              as: AdoptionCounselor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "AdoptionApplication.${app_id}.status == REJECTED"

      - name: finalize_terminal_adopted_animal_second_finalize_invalid_state
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.Animal.AVAILABLE_to_ADOPTED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Finalizing an already-FINALIZED application -> 409 ERR_INVALID_STATE (FINALIZED is past APPROVED); no double ledger debit."
        test_recipe:
          setup: ["application FINALIZED (animal ADOPTED, ledger debited once)"]
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter" }
              as: ShelterAdmin
              captures: { shelter_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShelterAdmin
            - call: "POST /animals"
              payload: { name: "Twice", species: "DOG", age_months: 40 }
              as: IntakeOfficer
              captures: { animal_id: $.data.id }
            - call: "POST /intake-records"
              payload: { animal_id: "${animal_id}", source: "SURRENDER", surrendering_party: "K" }
              as: IntakeOfficer
            - call: "POST /microchips"
              payload: { animal_id: "${animal_id}", chip_number: "CHIP-9003" }
              as: Veterinarian
            - call: "POST /medical-records"
              payload: { animal_id: "${animal_id}", record_type: "EXAM", outcome: "CLEAR" }
              as: Veterinarian
            - call: "POST /animals/${animal_id}/make-available"
              payload: {}
              as: AdoptionCounselor
            - call: "POST /adopter-accounts"
              payload: { full_name: "Tex", email: "tex@x.com" }
              as: AdoptionCounselor
              captures: { adopter_id: $.data.id }
            - call: "POST /adoption-applications"
              payload: { animal_id: "${animal_id}", adopter_id: "${adopter_id}" }
              as: AdoptionCounselor
              captures: { app_id: $.data.id }
            - call: "POST /adoption-applications/${app_id}/approve"
              payload: {}
              as: AdoptionCounselor
            - call: "POST /adoption-applications/${app_id}/finalize"
              payload: {}
              as: AdoptionCounselor
          trigger:
            - call: "POST /adoption-applications/${app_id}/finalize"
              payload: {}
              as: AdoptionCounselor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Shelter.${shelter_id}.collected_fee_cents == 15000"

      - name: submit_application_when_animal_not_available_invalid_state
        claim_type: guarded_transition
        grounds:
          - "state_machines.AdoptionApplication.none_to_SUBMITTED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Submitting an application for an IN_CUSTODY (not yet AVAILABLE) animal -> 409 ERR_INVALID_STATE; cross-entity guard on Animal.lifecycle_status."
        test_recipe:
          setup: ["animal SURRENDER intake IN_CUSTODY but never made AVAILABLE"]
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter" }
              as: ShelterAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShelterAdmin
            - call: "POST /animals"
              payload: { name: "NotYet", species: "CAT", age_months: 24 }
              as: IntakeOfficer
              captures: { animal_id: $.data.id }
            - call: "POST /intake-records"
              payload: { animal_id: "${animal_id}", source: "SURRENDER", surrendering_party: "G" }
              as: IntakeOfficer
            - call: "POST /adopter-accounts"
              payload: { full_name: "Gus", email: "gus@x.com" }
              as: AdoptionCounselor
              captures: { adopter_id: $.data.id }
          trigger:
            - call: "POST /adoption-applications"
              payload: { animal_id: "${animal_id}", adopter_id: "${adopter_id}" }
              as: AdoptionCounselor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: double_intake_same_animal_invalid_state
        claim_type: idempotency
        grounds:
          - "state_machines.Animal.INTAKE_PENDING_to_IN_CUSTODY"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A second POST /intake-records for an already-IN_CUSTODY animal -> 409 ERR_INVALID_STATE (no prior-intake precondition fails)."
        test_recipe:
          setup: ["animal SURRENDER intake -> IN_CUSTODY"]
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter" }
              as: ShelterAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShelterAdmin
            - call: "POST /animals"
              payload: { name: "Dup", species: "DOG", age_months: 18 }
              as: IntakeOfficer
              captures: { animal_id: $.data.id }
            - call: "POST /intake-records"
              payload: { animal_id: "${animal_id}", source: "SURRENDER", surrendering_party: "H" }
              as: IntakeOfficer
          trigger:
            - call: "POST /intake-records"
              payload: { animal_id: "${animal_id}", source: "SURRENDER", surrendering_party: "H2" }
              as: IntakeOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: euthanasia_execute_before_approval_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.EuthanasiaDecision.APPROVED_to_EXECUTED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Executing a REQUESTED (not yet APPROVED) euthanasia decision -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["animal IN_CUSTODY; euthanasia decision REQUESTED, not approved"]
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter", stray_hold_days: 0 }
              as: ShelterAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShelterAdmin
            - call: "POST /animals"
              payload: { name: "Eu", species: "DOG", age_months: 80 }
              as: IntakeOfficer
              captures: { animal_id: $.data.id }
            - call: "POST /intake-records"
              payload: { animal_id: "${animal_id}", source: "SURRENDER", surrendering_party: "V" }
              as: IntakeOfficer
            - call: "POST /euthanasia-decisions"
              payload: { animal_id: "${animal_id}", reason: "MEDICAL_UNTREATABLE" }
              as: AdoptionCounselor
              as_user_id: "counselor-1"
              captures: { dec_id: $.data.id }
          trigger:
            - call: "POST /euthanasia-decisions/${dec_id}/execute"
              payload: {}
              as: Veterinarian
              as_user_id: "vet-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

  # =================================================================
  # Validations — error triggers not covered by §1.8
  # =================================================================
  - section: validations
    instances:
      - name: euthanasia_approve_by_requester_segregation_of_duties
        claim_type: violation_to_error
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
        distinguishing_aspect: "Veterinarian approving a euthanasia decision they requested (same X-User-ID) -> 409 ERR_SEGREGATION_OF_DUTIES. Requester X-User-ID == approver X-User-ID."
        test_recipe:
          setup: ["animal IN_CUSTODY; vet-1 BOTH opens and tries to approve the decision"]
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter", stray_hold_days: 0 }
              as: ShelterAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShelterAdmin
            - call: "POST /animals"
              payload: { name: "Sod", species: "DOG", age_months: 90 }
              as: IntakeOfficer
              captures: { animal_id: $.data.id }
            - call: "POST /intake-records"
              payload: { animal_id: "${animal_id}", source: "SURRENDER", surrendering_party: "W" }
              as: IntakeOfficer
            - call: "POST /euthanasia-decisions"
              payload: { animal_id: "${animal_id}", reason: "BEHAVIORAL" }
              as: ShelterAdmin
              as_user_id: "vet-1"
              captures: { dec_id: $.data.id }
          trigger:
            - call: "POST /euthanasia-decisions/${dec_id}/approve"
              payload: {}
              as: Veterinarian
              as_user_id: "vet-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_SEGREGATION_OF_DUTIES"

      - name: euthanasia_execute_during_stray_hold_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_STRAY_HOLD_ACTIVE]"
        distinguishing_aspect: "Executing euthanasia on a STRAY animal before clock >= stray_hold_release_at -> 409 ERR_STRAY_HOLD_ACTIVE. Distinct from §1.8 make-available boundary (different endpoint, negative side)."
        test_recipe:
          setup: ["shelter stray_hold_days=5; STRAY animal intake at 2026-06-01 -> release 2026-06-06; decision APPROVED (vet-2 by requester counselor-1); clock still 2026-06-02"]
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter", stray_hold_days: 5 }
              as: ShelterAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShelterAdmin
            - call: "POST /animals"
              payload: { name: "Held", species: "DOG", age_months: 100 }
              as: IntakeOfficer
              captures: { animal_id: $.data.id }
            - call: "POST /intake-records"
              payload: { animal_id: "${animal_id}", source: "STRAY" }
              as: IntakeOfficer
            - call: "POST /euthanasia-decisions"
              payload: { animal_id: "${animal_id}", reason: "MEDICAL_UNTREATABLE" }
              as: AdoptionCounselor
              as_user_id: "counselor-1"
              captures: { dec_id: $.data.id }
            - call: "POST /euthanasia-decisions/${dec_id}/approve"
              payload: {}
              as: Veterinarian
              as_user_id: "vet-2"
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: ShelterAdmin
          trigger:
            - call: "POST /euthanasia-decisions/${dec_id}/execute"
              payload: {}
              as: Veterinarian
              as_user_id: "vet-2"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_STRAY_HOLD_ACTIVE"

      - name: owner_claim_approve_chip_mismatch_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_CHIP_MISMATCH]"
        distinguishing_aspect: "Approving an OwnerClaim whose proof_chip_number does not match any Microchip on the animal -> 409 ERR_CHIP_MISMATCH."
        test_recipe:
          setup: ["STRAY animal IN_CUSTODY chipped CHIP-5005; OwnerClaim PENDING with proof_chip_number=WRONG-9999"]
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter", stray_hold_days: 5 }
              as: ShelterAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShelterAdmin
            - call: "POST /animals"
              payload: { name: "Claimed", species: "CAT", age_months: 40 }
              as: IntakeOfficer
              captures: { animal_id: $.data.id }
            - call: "POST /intake-records"
              payload: { animal_id: "${animal_id}", source: "STRAY" }
              as: IntakeOfficer
            - call: "POST /microchips"
              payload: { animal_id: "${animal_id}", chip_number: "CHIP-5005" }
              as: Veterinarian
            - call: "POST /owner-claims"
              payload: { animal_id: "${animal_id}", claimant_name: "Faker", proof_chip_number: "WRONG-9999" }
              as: ShelterAdmin
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /owner-claims/${claim_id}/approve"
              payload: {}
              as: ShelterAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_CHIP_MISMATCH"
            - "Animal.${animal_id}.lifecycle_status == IN_CUSTODY"

      - name: second_application_approve_conflict_rejected
        claim_type: aggregate_validation
        grounds:
          - "validations[priority=13]"
          - "errors[ERR_APPLICATION_CONFLICT]"
        distinguishing_aspect: "Approving a second application for the same animal while a first is already APPROVED -> 409 ERR_APPLICATION_CONFLICT."
        test_recipe:
          setup: ["animal AVAILABLE & CLEARED; application1 APPROVED; application2 SUBMITTED for same animal"]
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter" }
              as: ShelterAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShelterAdmin
            - call: "POST /animals"
              payload: { name: "Pop", species: "DOG", age_months: 30 }
              as: IntakeOfficer
              captures: { animal_id: $.data.id }
            - call: "POST /intake-records"
              payload: { animal_id: "${animal_id}", source: "SURRENDER", surrendering_party: "C" }
              as: IntakeOfficer
            - call: "POST /medical-records"
              payload: { animal_id: "${animal_id}", record_type: "EXAM", outcome: "CLEAR" }
              as: Veterinarian
            - call: "POST /animals/${animal_id}/make-available"
              payload: {}
              as: AdoptionCounselor
            - call: "POST /adopter-accounts"
              payload: { full_name: "One", email: "one@x.com" }
              as: AdoptionCounselor
              captures: { adopter1: $.data.id }
            - call: "POST /adopter-accounts"
              payload: { full_name: "Two", email: "two@x.com" }
              as: AdoptionCounselor
              captures: { adopter2: $.data.id }
            - call: "POST /adoption-applications"
              payload: { animal_id: "${animal_id}", adopter_id: "${adopter1}" }
              as: AdoptionCounselor
              captures: { app1: $.data.id }
            - call: "POST /adoption-applications"
              payload: { animal_id: "${animal_id}", adopter_id: "${adopter2}" }
              as: AdoptionCounselor
              captures: { app2: $.data.id }
            - call: "POST /adoption-applications/${app1}/approve"
              payload: {}
              as: AdoptionCounselor
          trigger:
            - call: "POST /adoption-applications/${app2}/approve"
              payload: {}
              as: AdoptionCounselor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_APPLICATION_CONFLICT"

      - name: duplicate_microchip_number_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=14]"
          - "errors[ERR_DUPLICATE_CHIP]"
        distinguishing_aspect: "Registering a Microchip with a chip_number already in use -> 409 ERR_DUPLICATE_CHIP."
        test_recipe:
          setup: ["two animals IN_CUSTODY; first chipped CHIP-DUP"]
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter" }
              as: ShelterAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShelterAdmin
            - call: "POST /animals"
              payload: { name: "A1", species: "DOG", age_months: 20 }
              as: IntakeOfficer
              captures: { a1: $.data.id }
            - call: "POST /intake-records"
              payload: { animal_id: "${a1}", source: "SURRENDER", surrendering_party: "D1" }
              as: IntakeOfficer
            - call: "POST /microchips"
              payload: { animal_id: "${a1}", chip_number: "CHIP-DUP" }
              as: Veterinarian
            - call: "POST /animals"
              payload: { name: "A2", species: "DOG", age_months: 22 }
              as: IntakeOfficer
              captures: { a2: $.data.id }
            - call: "POST /intake-records"
              payload: { animal_id: "${a2}", source: "SURRENDER", surrendering_party: "D2" }
              as: IntakeOfficer
          trigger:
            - call: "POST /microchips"
              payload: { animal_id: "${a2}", chip_number: "CHIP-DUP" }
              as: Veterinarian
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_DUPLICATE_CHIP"

      - name: duplicate_adopter_email_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=14]"
          - "errors[ERR_DUPLICATE_EMAIL]"
        distinguishing_aspect: "Registering an AdopterAccount with an email already in use -> 409 ERR_DUPLICATE_EMAIL."
        test_recipe:
          setup: ["one adopter registered with same@x.com"]
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter" }
              as: ShelterAdmin
            - call: "POST /adopter-accounts"
              payload: { full_name: "First", email: "same@x.com" }
              as: AdoptionCounselor
          trigger:
            - call: "POST /adopter-accounts"
              payload: { full_name: "Second", email: "same@x.com" }
              as: AdoptionCounselor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_DUPLICATE_EMAIL"

      - name: pagination_limit_out_of_range_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_VALIDATION_LIMIT]"
        distinguishing_aspect: "GET /animals?limit=500 (> max 100) -> 422 ERR_VALIDATION_LIMIT."
        test_recipe:
          setup: ["shelter bootstrapped"]
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter" }
              as: ShelterAdmin
          trigger:
            - call: "GET /animals?limit=500"
              payload: {}
              as: AdoptionCounselor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_VALIDATION_LIMIT"

  # =================================================================
  # RBAC denials
  # =================================================================
  - section: rbac
    instances:
      - name: intake_officer_cannot_record_medical
        claim_type: forbidden_role
        grounds:
          - "roles.Veterinarian"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "POST /medical-records as IntakeOfficer (not in endpoint roles) -> 403 ERR_FORBIDDEN. Medical records are Veterinarian-exclusive."
        test_recipe:
          setup: ["animal SURRENDER intake IN_CUSTODY"]
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter" }
              as: ShelterAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShelterAdmin
            - call: "POST /animals"
              payload: { name: "Med", species: "DOG", age_months: 20 }
              as: IntakeOfficer
              captures: { animal_id: $.data.id }
            - call: "POST /intake-records"
              payload: { animal_id: "${animal_id}", source: "SURRENDER", surrendering_party: "E" }
              as: IntakeOfficer
          trigger:
            - call: "POST /medical-records"
              payload: { animal_id: "${animal_id}", record_type: "EXAM", outcome: "CLEAR" }
              as: IntakeOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "response.data.error_id == ERR_FORBIDDEN"

      - name: adopter_cannot_finalize_application
        claim_type: forbidden_role
        grounds:
          - "roles.AdoptionCounselor"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "POST /adoption-applications/{id}/finalize as Adopter -> 403 ERR_FORBIDDEN. Finalize is AdoptionCounselor-exclusive."
        test_recipe:
          setup: ["application APPROVED for an AVAILABLE animal"]
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter" }
              as: ShelterAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShelterAdmin
            - call: "POST /animals"
              payload: { name: "Fin", species: "CAT", age_months: 36 }
              as: IntakeOfficer
              captures: { animal_id: $.data.id }
            - call: "POST /intake-records"
              payload: { animal_id: "${animal_id}", source: "SURRENDER", surrendering_party: "F" }
              as: IntakeOfficer
            - call: "POST /medical-records"
              payload: { animal_id: "${animal_id}", record_type: "EXAM", outcome: "CLEAR" }
              as: Veterinarian
            - call: "POST /animals/${animal_id}/make-available"
              payload: {}
              as: AdoptionCounselor
            - call: "POST /adopter-accounts"
              payload: { full_name: "Ada", email: "ada@x.com" }
              as: Adopter
              captures: { adopter_id: $.data.id }
            - call: "POST /adoption-applications"
              payload: { animal_id: "${animal_id}", adopter_id: "${adopter_id}" }
              as: Adopter
              as_user_id: "${adopter_id}"
              captures: { app_id: $.data.id }
            - call: "POST /adoption-applications/${app_id}/approve"
              payload: {}
              as: AdoptionCounselor
          trigger:
            - call: "POST /adoption-applications/${app_id}/finalize"
              payload: {}
              as: Adopter
              as_user_id: "${adopter_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "response.data.error_id == ERR_FORBIDDEN"

      - name: missing_auth_headers_unauthenticated
        claim_type: unauthenticated
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A request to a protected endpoint without X-User-Role/X-User-ID -> 401 ERR_UNAUTHENTICATED. Modeled as as:Anonymous (no headers)."
        test_recipe:
          setup: ["shelter + one animal exist"]
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter" }
              as: ShelterAdmin
            - call: "POST /animals"
              payload: { name: "Anon", species: "DOG", age_months: 12 }
              as: IntakeOfficer
              captures: { animal_id: $.data.id }
          trigger:
            - call: "GET /animals/${animal_id}"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"

  # =================================================================
  # Endpoints — FK integrity, computed reads, listing/pagination
  # =================================================================
  - section: endpoints
    instances:
      - name: create_intake_with_nonexistent_animal_fk_not_found
        claim_type: fk_integrity
        grounds:
          - "entities.IntakeRecord.fields.animal_id"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "POST /intake-records with animal_id pointing at no Animal -> 404 ERR_NOT_FOUND (FK existence check)."
        test_recipe:
          setup: ["shelter bootstrapped, no animals"]
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter" }
              as: ShelterAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShelterAdmin
          trigger:
            - call: "POST /intake-records"
              payload: { animal_id: "11111111-1111-4111-8111-111111111111", source: "STRAY" }
              as: IntakeOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: list_medical_records_filtered_by_animal_reverse_reachability
        claim_type: listing
        grounds:
          - "entities.MedicalRecord.fields.animal_id"
        distinguishing_aspect: "GET /medical-records?animal_id={id} returns only that animal's records as MedicalRecord[] with pagination envelope (total_count, has_more)."
        test_recipe:
          setup: ["animal with two medical records (HOLD then CLEAR)"]
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter" }
              as: ShelterAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShelterAdmin
            - call: "POST /animals"
              payload: { name: "Recs", species: "DOG", age_months: 24 }
              as: IntakeOfficer
              captures: { animal_id: $.data.id }
            - call: "POST /intake-records"
              payload: { animal_id: "${animal_id}", source: "SURRENDER", surrendering_party: "X" }
              as: IntakeOfficer
            - call: "POST /medical-records"
              payload: { animal_id: "${animal_id}", record_type: "EXAM", outcome: "HOLD" }
              as: Veterinarian
            - call: "POST /medical-records"
              payload: { animal_id: "${animal_id}", record_type: "EXAM", outcome: "CLEAR" }
              as: Veterinarian
          trigger:
            - call: "GET /medical-records?animal_id=${animal_id}"
              payload: {}
              as: Veterinarian
          assert:
            - "HTTP status == 200"
            - "response.data is an array of length 2"
            - "response.meta and pagination total_count == 2, has_more == false"

      - name: projected_board_computed_read_matches_formula
        claim_type: computed_read
        grounds:
          - "calculations.actual_board_cost"
          - "entities.KennelAssignment.fields.start_at"
        distinguishing_aspect: "GET /kennel-assignments/{id}/projected-board for a CAT STRAY (stray_hold_days=4) returns projected_board_cents = 1344*4 = 5376 and projected_occupied_days = 4."
        test_recipe:
          setup: ["shelter cat rate 1250, stray_hold_days=4; CAT STRAY intake; kennel-assigned at 2026-06-01"]
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter", stray_hold_days: 4, cat_daily_board_cents: 1250 }
              as: ShelterAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShelterAdmin
            - call: "POST /kennels"
              payload: { label: "P-1", capacity: 1 }
              as: ShelterAdmin
              captures: { kennel_id: $.data.id, kennel_v: $.data.version }
            - call: "POST /animals"
              payload: { name: "Proj", species: "CAT", age_months: 24 }
              as: IntakeOfficer
              captures: { animal_id: $.data.id }
            - call: "POST /intake-records"
              payload: { animal_id: "${animal_id}", source: "STRAY" }
              as: IntakeOfficer
            - call: "POST /kennel-assignments"
              payload: { kennel_id: "${kennel_id}", animal_id: "${animal_id}", expected_kennel_version: "${kennel_v}" }
              as: IntakeOfficer
              captures: { ka_id: $.data.id }
          trigger:
            - call: "GET /kennel-assignments/${ka_id}/projected-board"
              payload: {}
              as: IntakeOfficer
          assert:
            - "HTTP status == 200"
            - "response.data.projected_occupied_days == 4"
            - "response.data.projected_board_cents == 5376"

  # =================================================================
  # Cross-cutting: optimistic concurrency (OCC) and version increment
  # =================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: kennel_assign_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[kennel-assign-stale-version]
          - errors[ERR_STALE_VERSION]
          - entities.Kennel.fields.version
        distinguishing_aspect: "A second kennel-assignment carrying the pre-first-assignment expected_kennel_version (now stale) -> 412 ERR_STALE_VERSION. Kennel had capacity=2 so occupancy alone would not block it."
        test_recipe:
          setup: ["Kennel capacity=2 version=1; animal A assigned (version advances to 2); client B still holds the version-1 view"]
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter" }
              as: ShelterAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShelterAdmin
            - call: "POST /kennels"
              payload: { label: "OCC-1", capacity: 2 }
              as: ShelterAdmin
              captures: { kennel_id: $.data.id, kennel_v1: $.data.version }
            - call: "POST /animals"
              payload: { name: "A", species: "DOG", age_months: 30 }
              as: IntakeOfficer
              captures: { a_id: $.data.id }
            - call: "POST /intake-records"
              payload: { animal_id: "${a_id}", source: "SURRENDER", surrendering_party: "AA" }
              as: IntakeOfficer
            - call: "POST /animals"
              payload: { name: "B", species: "DOG", age_months: 32 }
              as: IntakeOfficer
              captures: { b_id: $.data.id }
            - call: "POST /intake-records"
              payload: { animal_id: "${b_id}", source: "SURRENDER", surrendering_party: "BB" }
              as: IntakeOfficer
            - call: "POST /kennel-assignments"
              payload: { kennel_id: "${kennel_id}", animal_id: "${a_id}", expected_kennel_version: "${kennel_v1}" }
              as: IntakeOfficer
          trigger:
            - call: "POST /kennel-assignments"
              payload: { kennel_id: "${kennel_id}", animal_id: "${b_id}", expected_kennel_version: "${kennel_v1}" }
              as: IntakeOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"

      - name: kennel_assign_increments_version_on_success
        claim_type: optimistic_concurrency
        grounds:
          - "entities.Kennel.fields.version"
          - "state_machines.KennelAssignment.none_to_ACTIVE"
        distinguishing_aspect: "A successful kennel-assignment increments Kennel.version from 1 to 2 and sets occupied_count=1."
        test_recipe:
          setup: ["Kennel capacity=1 version=1; animal IN_CUSTODY"]
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter" }
              as: ShelterAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShelterAdmin
            - call: "POST /kennels"
              payload: { label: "VER-1", capacity: 1 }
              as: ShelterAdmin
              captures: { kennel_id: $.data.id, kennel_v: $.data.version }
            - call: "POST /animals"
              payload: { name: "Inc", species: "CAT", age_months: 18 }
              as: IntakeOfficer
              captures: { animal_id: $.data.id }
            - call: "POST /intake-records"
              payload: { animal_id: "${animal_id}", source: "SURRENDER", surrendering_party: "VV" }
              as: IntakeOfficer
          trigger:
            - call: "POST /kennel-assignments"
              payload: { kennel_id: "${kennel_id}", animal_id: "${animal_id}", expected_kennel_version: "${kennel_v}" }
              as: IntakeOfficer
              captures: { ka_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Kennel.${kennel_id}.version == 2"
            - "Kennel.${kennel_id}.occupied_count == 1"
            - "Kennel.${kennel_id}.status == FULL"

  # =================================================================
  # Consistency model — immediate visibility of cascade
  # =================================================================
  - section: consistency_model
    instances:
      - name: finalize_cascade_visible_in_same_response
        claim_type: immediate
        grounds:
          - "state_machines.AdoptionApplication.APPROVED_to_FINALIZED"
          - "entities.Shelter.fields.collected_fee_cents"
        distinguishing_aspect: "Immediate consistency: a single GET right after finalize shows Animal ADOPTED, kennel released, and ledger debited — no lag."
        excluded_because:
          difficulty_instance: transitive_cascade / finalize_cascade_depth4_app_animal_kennel_occupancy
          rationale: "The depth-4 finalize cascade and its same-request visibility are fully asserted by the named §1.8 instance."

  # =================================================================
  # Stubs — corners already covered by §1.8 difficulty instances
  # =================================================================
  - section: validations
    instances:
      - name: stub_make_available_not_cleared
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_NOT_MEDICALLY_CLEARED]"
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / adoption_approve_requires_animal_medically_cleared
          rationale: "ERR_NOT_MEDICALLY_CLEARED triggered as the failure path of the named §1.8 instance."
      - name: stub_kennel_occupied
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_KENNEL_OCCUPIED]"
        excluded_because:
          difficulty_instance: resource_temporal_overlap / kennel_half_open_single_occupancy_overlap
          rationale: "ERR_KENNEL_OCCUPIED triggered by the named §1.8 overlap instance."
      - name: stub_foster_home_full
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_FOSTER_HOME_FULL]"
        excluded_because:
          difficulty_instance: boundary_precision_check / foster_home_capacity_boundary_rejects_at_equality
          rationale: "ERR_FOSTER_HOME_FULL triggered at the capacity boundary by the named §1.8 instance."
      - name: stub_foster_cooldown
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_FOSTER_COOLDOWN]"
        excluded_because:
          difficulty_instance: resource_temporal_overlap / foster_cooldown_buffer_rejects_within_gap
          rationale: "ERR_FOSTER_COOLDOWN triggered by the named §1.8 cooldown-buffer instance."
      - name: stub_stray_hold_make_available_boundary
        claim_type: boundary_condition
        grounds:
          - "validations[priority=8]"
        excluded_because:
          difficulty_instance: boundary_precision_check / stray_hold_release_exact_instant_allows_make_available
          rationale: "The stray-hold >= boundary on make-available is asserted by the named §1.8 instance."
