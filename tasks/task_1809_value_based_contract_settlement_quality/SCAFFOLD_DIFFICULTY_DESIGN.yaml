  - rule_id: transitive_cascade
    instances:
      - name: claim_void_cascade_depth3
        grounds:
          - state_machines.ClaimRecord.PAID_to_VOIDED
          - entities.PerformanceYear.fields.actual_cost_cents
          - state_machines.InterimReport.PUBLISHED_to_STALE
          - entities.Settlement.fields.needs_recompute
        distinguishing_aspect: |
          Depth-3 chain from trigger POST /vbc/claims/{id}/void: (1) claim
          PAID->VOIDED mutates the claim; (2) that mutation recomputes the
          year's actual_cost_cents (500,000 -> 400,000) and withhold_pool_cents
          (25,000 -> 20,000); (3) the rollup change flips the PUBLISHED interim
          report to STALE; (4) the staleness propagation sets the PROVISIONAL
          settlement's needs_recompute. Each link is caused by the previous one.
        test_recipe:
