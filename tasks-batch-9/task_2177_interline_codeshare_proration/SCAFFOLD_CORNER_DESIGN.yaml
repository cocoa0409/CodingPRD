        distinguishing_aspect: "A SPA_FLAT agreement demands flat_amount_minor; supplying percent_bp instead returns ERR_FACTOR_FIELD_MISMATCH (422) and leaves factor_count at 0."
        test_recipe:
          setup:
            - "Carriers AA and BB ACTIVE; a DRAFT SPA_FLAT agreement AA->BB in USD for 2026-08-01..2026-08-31."
