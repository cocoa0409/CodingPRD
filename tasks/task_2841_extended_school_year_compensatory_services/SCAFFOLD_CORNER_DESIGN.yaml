      - name: invalid_state_transition_error_is_covered_by_the_difficulty_design
        claim_type: violation_to_error
        grounds:
          - validations.priority_9_ERR_INVALID_STATE
          - errors[ERR_INVALID_STATE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / commitment_activation_requires_open_program
          rationale: "ERR_INVALID_STATE is raised there by activating a commitment while its program is still STAFFING_LOCKED, with the accepted control after the program opens."
      - name: frozen_fund_error_is_covered_by_the_difficulty_design
        claim_type: violation_to_error
        grounds:
          - validations.priority_33_ERR_FUND_FROZEN
          - errors[ERR_FUND_FROZEN]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / assignment_invalid_commitment_state_beats_frozen_fund
          rationale: "That instance carries a single-violation control in which only the fund is FROZEN, which is exactly the ERR_FUND_FROZEN trigger."
      - name: expired_credential_error_is_covered_by_the_difficulty_design
        claim_type: violation_to_error
        grounds:
          - validations.priority_12_ERR_PROVIDER_CREDENTIAL_EXPIRED
          - errors[ERR_PROVIDER_CREDENTIAL_EXPIRED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / assignment_expired_credential_beats_role_mismatch
          rationale: "Its credential-only control assigns a provider whose credential lapses before effective_to and expects ERR_PROVIDER_CREDENTIAL_EXPIRED."
      - name: provider_role_mismatch_error_is_covered_by_the_difficulty_design
        claim_type: violation_to_error
        grounds:
          - validations.priority_14_ERR_PROVIDER_ROLE_MISMATCH
          - errors[ERR_PROVIDER_ROLE_MISMATCH]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / assignment_expired_credential_beats_role_mismatch
          rationale: "Its role-only control assigns an SLP to a SPECIALIZED_INSTRUCTION commitment and expects ERR_PROVIDER_ROLE_MISMATCH."
      - name: makeup_outside_window_error_is_covered_by_the_difficulty_design
        claim_type: violation_to_error
        grounds:
          - validations.priority_19_ERR_MAKEUP_OUTSIDE_WINDOW
          - errors[ERR_MAKEUP_OUTSIDE_WINDOW]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / makeup_outside_delivery_window_beats_overbooked_minutes
          rationale: "Its window-only control books a session one day past delivery_deadline_date and expects ERR_MAKEUP_OUTSIDE_WINDOW."
      - name: overbooked_makeup_minutes_error_is_covered_by_the_difficulty_design
        claim_type: violation_to_error
        grounds:
          - validations.priority_27_ERR_OVERBOOKED_MAKEUP_MINUTES
          - errors[ERR_OVERBOOKED_MAKEUP_MINUTES]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / makeup_outside_delivery_window_beats_overbooked_minutes
          rationale: "Its minutes-only control books more minutes than remaining_owed_minutes inside the window and expects ERR_OVERBOOKED_MAKEUP_MINUTES."
      - name: no_compensable_minutes_error_is_covered_by_the_difficulty_design
        claim_type: violation_to_error
        grounds:
          - validations.priority_25_ERR_NO_COMPENSABLE_MINUTES
          - errors[ERR_NO_COMPENSABLE_MINUTES]
        excluded_because:
          difficulty_instance: boundary_precision_check / min_awardable_minutes_boundary_on_award_creation
          rationale: "That instance sits on the 30-minute boundary: 29 raw minutes returns ERR_NO_COMPENSABLE_MINUTES and 30 is accepted."
      - name: stay_put_block_error_is_covered_by_the_difficulty_design
        claim_type: violation_to_error
        grounds:
          - validations.priority_11_ERR_STAY_PUT_BLOCKED
          - errors[ERR_STAY_PUT_BLOCKED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / dispute_arbitration_blocked_by_open_due_process_record
          rationale: "That instance arbitrates a dispute while an OPEN DUE_PROCESS_HEARING exists and expects ERR_STAY_PUT_BLOCKED, then repeats it after the record is RESOLVED."
      - name: provider_time_conflict_error_is_covered_by_the_difficulty_design
        claim_type: violation_to_error
        grounds:
          - validations.priority_16_ERR_PROVIDER_TIME_CONFLICT
          - errors[ERR_PROVIDER_TIME_CONFLICT]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / provider_weekly_slots_use_half_open_intervals_and_date_intersection
          rationale: "That instance overlaps two assignments of one provider on the same weekday with intersecting effective ranges and expects ERR_PROVIDER_TIME_CONFLICT, plus touching and disjoint controls."
      - name: run_window_overlap_error_is_covered_by_the_difficulty_design
        claim_type: violation_to_error
        grounds:
          - validations.priority_17_ERR_RUN_WINDOW_OVERLAP
          - errors[ERR_RUN_WINDOW_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / route_daily_windows_use_closed_intervals_plus_turnaround_buffer
          rationale: "That instance shares a single boundary minute between two runs of one route and expects ERR_RUN_WINDOW_OVERLAP under closed-interval semantics."
      - name: route_turnaround_error_is_covered_by_the_difficulty_design
        claim_type: violation_to_error
        grounds:
          - validations.priority_18_ERR_ROUTE_TURNAROUND_VIOLATION
          - errors[ERR_ROUTE_TURNAROUND_VIOLATION]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / route_daily_windows_use_closed_intervals_plus_turnaround_buffer
          rationale: "The same instance places a non-overlapping run 14 minutes after the previous one and expects ERR_ROUTE_TURNAROUND_VIOLATION, with a 15-minute control."
      - name: fund_indirect_overage_error_is_covered_by_the_difficulty_design
        claim_type: violation_to_error
        grounds:
          - validations.priority_35_ERR_FUND_INDIRECT_OVERAGE
          - errors[ERR_FUND_INDIRECT_OVERAGE]
        excluded_because:
          difficulty_instance: combinatorial_formula / fund_waterfall_selection_pinned_on_base_cost_then_indirect_overage
          rationale: "That instance is built precisely so the selected allocation covers base_cost_cents but not base + indirect, which is the ERR_FUND_INDIRECT_OVERAGE trigger."

      - name: requests_with_missing_x_user_headers_return_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations.priority_1_ERR_UNAUTHENTICATED
          - errors[ERR_UNAUTHENTICATED]
          - roles
        distinguishing_aspect: "Priority 1 outranks every other rule: the same POST /esy/students body that would otherwise fail shape validation returns ERR_UNAUTHENTICATED 401 when X-User-Role or X-User-ID is absent, and reads are refused too."
        test_recipe:
          setup:
            - "Empty database. Trigger 1 omits both headers, trigger 2 sends X-User-Role but an empty X-User-ID, trigger 3 sends an empty X-User-Role with a valid X-User-ID; trigger 1 also omits a required body field to prove the 401 wins."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-01T00:00:00Z" }
              as: CaseManager
          trigger:
            - call: "POST /esy/students"
              payload: { student_number: "S-2841-009", first_name: "Iris" }
              as: NONE
            - call: "POST /esy/students"
              payload: { student_number: "S-2841-009", first_name: "Iris", last_name: "Vega", grade_band: "MS_6_8", primary_disability: "AUTISM", iep_weekly_minutes_total: 250, home_school_code: "MS-014" }
              as: CaseManager
              as_user_id: ""
            - call: "GET /esy/service-logs"
              payload: {}
              as: ""
              as_user_id: "cm-001"
          assert:
            - "All three triggers: HTTP 401 and response.data.error_id == ERR_UNAUTHENTICATED"
            - "Trigger 1: response.data.error_id != ERR_INVALID_REQUEST (authentication precedes shape validation)"
            - "No Student row is created (GET /esy/students?student_number=S-2841-009 as CaseManager returns total_count == 0)"

  - section: rbac
    instances:
      - name: each_role_can_perform_its_own_exclusive_operations
        claim_type: own_role_operations_permitted
        grounds:
          - roles.CaseManager.exclusive_operations
          - roles.ProgramCoordinator.exclusive_operations
          - roles.SpedDirector.exclusive_operations
          - roles.ComplianceOfficer.exclusive_operations
        distinguishing_aspect: "The positive half of the RBAC matrix: five writes, each issued by the single role that owns it, all succeed - proving the role gate is an allow-list per endpoint and not a blanket deny for non-CaseManager roles."
        test_recipe:
          setup:
            - "Empty database; only the logical clock is set."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-01T00:00:00Z" }
              as: SpedDirector
              as_user_id: "dir-001"
          trigger:
            - call: "POST /esy/students"
              payload: { student_number: "S-2841-001", first_name: "Ada", last_name: "Reyes", grade_band: "MS_6_8", primary_disability: "AUTISM", iep_weekly_minutes_total: 250, home_school_code: "MS-014", transportation_required: true }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { s1_id: $.data.id }
            - call: "POST /esy/programs"
              payload: { name: "Summer ESY 2027", school_year: "2026-2027", session_start_date: "2027-06-14", session_end_date: "2027-07-23", instructional_weekdays: ["MON", "TUE", "WED", "THU"], daily_minutes_cap: 90, blackout_dates: ["2027-06-30", "2027-07-05"] }
              as: ProgramCoordinator
              as_user_id: "pc-001"
              captures: { p1_id: $.data.id }
            - call: "POST /esy/providers"
              payload: { full_name: "Nina Torres", role_type: "SPED_TEACHER", credential_expires_on: "2028-06-30", rate_cents_per_minute: 150, max_weekly_minutes: 1200 }
              as: ProgramCoordinator
              as_user_id: "pc-001"
              captures: { pr1_id: $.data.id }
            - call: "POST /esy/fund-allocations"
              payload: { program_id: "${p1_id}", fund_source: "IDEA_611_FEDERAL", budget_code: "611-ESY-01", authorized_amount_cents: 25000000 }
              as: SpedDirector
              as_user_id: "dir-001"
              captures: { f1_id: $.data.id }
            - call: "POST /esy/due-process-records"
              payload: { student_id: "${s1_id}", record_type: "COMPLAINT", filed_on: "2027-06-01", allegation_summary: "Parent alleges ESY services were never offered." }
              as: ComplianceOfficer
              as_user_id: "co-001"
              captures: { dp1_id: $.data.id }
          assert:
            - "All five triggers: HTTP 201"
            - "Student.${s1_id}.esy_eligibility_status == NOT_DETERMINED and version == 1"
            - "EsyProgram.${p1_id}.status == PLANNING and instructional_days_count == 22"
            - "Provider.${pr1_id}.status == ACTIVE and assigned_weekly_minutes == 0"
            - "FundAllocation.${f1_id}.status == OPEN and available_cents == 25000000"
            - "DueProcessRecord.${dp1_id}.status == OPEN and Student.${s1_id}.stay_put_active == true"

      - name: case_manager_cannot_create_a_fund_allocation
        claim_type: other_role_exclusive_operation_denied
        grounds:
          - roles.SpedDirector.exclusive_operations
          - roles.CaseManager.shared_operations
          - endpoints.POST_/esy/fund-allocations
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "Budget authorization is exclusively the SpedDirector's: the identical payload is refused with ERR_ROLE_NOT_PERMITTED 403 for a CaseManager and accepted for a SpedDirector, so the gate is role-based and not payload-based."
        test_recipe:
          setup:
            - "Clock 2027-06-01T00:00:00Z; one PLANNING program P1 and no allocations."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-01T00:00:00Z" }
              as: ProgramCoordinator
            - call: "POST /esy/programs"
              payload: { name: "Summer ESY 2027", school_year: "2026-2027", session_start_date: "2027-06-14", session_end_date: "2027-07-23", instructional_weekdays: ["MON", "TUE", "WED", "THU"], daily_minutes_cap: 90, blackout_dates: ["2027-06-30", "2027-07-05"] }
              as: ProgramCoordinator
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /esy/fund-allocations"
              payload: { program_id: "${p1_id}", fund_source: "IDEA_611_FEDERAL", budget_code: "611-ESY-01", authorized_amount_cents: 25000000 }
              as: CaseManager
              as_user_id: "cm-001"
            - call: "POST /esy/fund-allocations"
              payload: { program_id: "${p1_id}", fund_source: "IDEA_611_FEDERAL", budget_code: "611-ESY-01", authorized_amount_cents: 25000000 }
              as: SpedDirector
              as_user_id: "dir-001"
              captures: { f1_id: $.data.id }
          assert:
            - "Trigger 1: HTTP 403 and response.data.error_id == ERR_ROLE_NOT_PERMITTED"
            - "Trigger 1: GET /esy/programs/${p1_id}/fund-allocations returns total_count == 0"
            - "Trigger 2: HTTP 201 and FundAllocation.${f1_id}.available_cents == 25000000"

      - name: parent_guardian_cannot_respond_for_another_students_determination
        claim_type: identity_scope_enforced
        grounds:
          - roles.ParentGuardian.identity
          - validations.priority_3_ERR_NOT_STUDENT_GUARDIAN
          - errors[ERR_NOT_STUDENT_GUARDIAN]
          - endpoints.POST_/esy/eligibility-determinations/{determination_id}/parent-response
        distinguishing_aspect: "ParentGuardian is entity_backed:Student, so authorization compares X-User-ID with the determination's student_id: S2's guardian is refused on S1's determination with 403 even though the same body from S1's guardian succeeds."
        test_recipe:
          setup:
            - "Clock 2027-06-01T00:00:00Z; Students S1 and S2; determination D1 belongs to S1 and sits in PARENT_REVIEW after analysis."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-01T00:00:00Z" }
              as: CaseManager
            - call: "POST /esy/students"
              payload: { student_number: "S-2841-001", first_name: "Ada", last_name: "Reyes", grade_band: "MS_6_8", primary_disability: "AUTISM", iep_weekly_minutes_total: 250, home_school_code: "MS-014", transportation_required: true }
              as: CaseManager
              captures: { s1_id: $.data.id }
            - call: "POST /esy/students"
              payload: { student_number: "S-2841-002", first_name: "Ben", last_name: "Okafor", grade_band: "MS_6_8", primary_disability: "SPECIFIC_LEARNING_DISABILITY", iep_weekly_minutes_total: 250, home_school_code: "MS-014" }
              as: CaseManager
              captures: { s2_id: $.data.id }
            - call: "POST /esy/eligibility-determinations"
              payload: { student_id: "${s1_id}", school_year: "2026-2027", analysis_variant: "PROBE_BASED", skill_probes: [{ skill_domain: "READING_FLUENCY", pre_break_mastery_pct: 80, post_break_mastery_pct: 60, recoupment_days_observed: 20, trials_count: 4 }, { skill_domain: "MATH_COMPUTATION", pre_break_mastery_pct: 100, post_break_mastery_pct: 74, recoupment_days_observed: 22, trials_count: 4 }] }
              as: CaseManager
              captures: { d1_id: $.data.id }
            - call: "POST /esy/eligibility-determinations/${d1_id}/analyze"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
          trigger:
            - call: "POST /esy/eligibility-determinations/${d1_id}/parent-response"
              payload: { response: "AGREE" }
              as: ParentGuardian
              as_user_id: "${s2_id}"
            - call: "GET /esy/eligibility-determinations/${d1_id}"
              payload: {}
              as: ParentGuardian
              as_user_id: "${s2_id}"
            - call: "POST /esy/eligibility-determinations/${d1_id}/parent-response"
              payload: { response: "AGREE" }
              as: ParentGuardian
              as_user_id: "${s1_id}"
          assert:
            - "Trigger 1: HTTP 403 and response.data.error_id == ERR_NOT_STUDENT_GUARDIAN"
            - "Trigger 2: HTTP 403 and response.data.error_id == ERR_NOT_STUDENT_GUARDIAN (reads are scoped too)"
            - "Trigger 1: EligibilityDetermination.${d1_id}.status == PARENT_REVIEW (unchanged)"
            - "Trigger 3: HTTP 200 and EligibilityDetermination.${d1_id}.status == PARENT_AGREED"
            - "Student.${s1_id}.esy_eligibility_status == NOT_DETERMINED (only finalize flips it)"

