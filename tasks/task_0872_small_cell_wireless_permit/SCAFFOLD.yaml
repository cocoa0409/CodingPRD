    side_effects: ["set submitted_at, shot_clock_base_days, shot_clock_deadline", "create PROVISIONAL FeeInvoice", "each Node PROPOSED->IN_REVIEW; auto-WAIVE aesthetic where not required", "increments PermitApplication.version by 1"]

  - method: POST
    path: "/applications/{id}/completeness-review"
    description: "reviewer issues completeness determination"
    roles: [ROWReviewer]
    code: 200
    input: [complete, "deficiencies?"]
