scaffold_corner_design:
  # ==================================================================
  # Section: entities
  # ==================================================================
  - section: entities
    instances:
      - name: entity_creation_product_computed_ship_method_and_defaults
        claim_type: creation_defaults_computed
        grounds:
          - entities.Product.fields.ship_method
          - entities.Product.fields.oversize
          - entities.Product.fields.is_custom_print
        distinguishing_aspect: "POST /products with oversize omitted computes ship_method PARCEL and defaults oversize=false, is_custom_print=false, lead_time_days=0; an oversize=true product computes ship_method FREIGHT; client-supplied ship_method is not an accepted input."
        test_recipe:
          setup: ["catalog empty"]
          setup_api_calls:
            - call: "POST /packaging-distribution/products"
              payload: { sku: "TP-1", name: "Tape Roll", category: "TAPE", base_price_cents: 350, uom: "EACH", case_qty: 1, pallet_qty: 100, weight_lbs_per_unit: 1, density_pcf: 20 }
              as: CatalogManager
              captures: { p1: $.data.id, sm1: $.data.ship_method, os1: $.data.oversize, cp1: $.data.is_custom_print, lt1: $.data.lead_time_days }
          trigger:
            - call: "POST /packaging-distribution/products"
              payload: { sku: "PL-1", name: "Pallet", category: "BOXES", base_price_cents: 9000, uom: "EACH", case_qty: 1, pallet_qty: 10, weight_lbs_per_unit: 400, density_pcf: 12, oversize: true }
              as: CatalogManager
              captures: { sm2: $.data.ship_method }
          assert:
            - "Product.${p1}: ship_method == PARCEL, oversize == false, is_custom_print == false, lead_time_days == 0 (captured ${sm1}, ${os1}, ${cp1}, ${lt1})"
            - "oversize product: ship_method == FREIGHT (captured ${sm2})"

      - name: entity_list_pagination_envelope
        claim_type: listing
        grounds:
          - response_envelope
          - entities.Product
        distinguishing_aspect: "GET /products with limit 1 over a 2-product catalog returns response_type array, total_count 2, has_more true, exactly 1 item; offset 1 returns the second item with has_more false."
        test_recipe:
          setup: ["two products exist"]
          setup_api_calls:
            - call: "POST /packaging-distribution/products"
              payload: { sku: "A-1", name: "A", category: "TAPE", base_price_cents: 100, uom: "EACH", case_qty: 1, pallet_qty: 10, weight_lbs_per_unit: 1, density_pcf: 20 }
              as: CatalogManager
            - call: "POST /packaging-distribution/products"
              payload: { sku: "A-2", name: "B", category: "TAPE", base_price_cents: 100, uom: "EACH", case_qty: 1, pallet_qty: 10, weight_lbs_per_unit: 1, density_pcf: 20 }
              as: CatalogManager
          trigger:
            - call: "GET /packaging-distribution/products"
              payload: { limit: 1, offset: 0 }
              as: PlatformAdmin
          assert:
            - "page 1: exactly 1 data item; pagination fields present with total_count == 2 and has_more == true"

      - name: entity_get_nonexistent_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - entities.Account
        distinguishing_aspect: "GET /accounts/{random-uuid} -> 404 ERR_NOT_FOUND in the standard error envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /packaging-distribution/accounts/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND (captured ${err}) with HTTP 404"

      - name: entity_product_create_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - entities.Product.fields.base_price_cents
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /products without base_price_cents -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["catalog empty"]
          setup_api_calls: []
          trigger:
            - call: "POST /packaging-distribution/products"
              payload: { sku: "X-1", name: "X", category: "TAPE", uom: "EACH", case_qty: 1, pallet_qty: 10, weight_lbs_per_unit: 1, density_pcf: 20 }
              as: CatalogManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (captured ${err})"

      - name: entity_quantity_break_common_fields_false_immutability
        claim_type: immutability
        grounds:
          - entities.QuantityBreak
        distinguishing_aspect: "QuantityBreak (common_fields: false) carries id and created_at but no version/updated_at, and is deleted via DELETE /quantity-breaks/{id} -> 204."
        test_recipe:
          setup: ["one product with one break"]
          setup_api_calls:
            - call: "POST /packaging-distribution/products"
              payload: { sku: "B-1", name: "B", category: "TAPE", base_price_cents: 100, uom: "EACH", case_qty: 1, pallet_qty: 10, weight_lbs_per_unit: 1, density_pcf: 20 }
              as: CatalogManager
              captures: { prod: $.data.id }
            - call: "POST /packaging-distribution/products/${prod}/quantity-breaks"
              payload: { min_qty: 10, unit_price_cents: 90, sort_seq: 1, effective_from: "2026-08-01T00:00:00Z" }
              as: CatalogManager
              captures: { brk: $.data.id }
          trigger:
            - call: "DELETE /packaging-distribution/quantity-breaks/${brk}"
              payload: {}
              as: CatalogManager
          assert:
            - "DELETE returns 204; subsequent GET /products/${prod}/quantity-breaks returns an empty array"

      - name: entity_inventory_available_qty_computed_not_stored
        claim_type: computed_fields
        grounds:
          - entities.Inventory.fields.available_qty
        distinguishing_aspect: "available_qty is computed as on_hand_qty - reserved_qty on every read: after reserving 6 of 10, GET /inventory/{id} shows available_qty 4 without any inventory write."
        test_recipe:
          setup: ["warehouse ATL; account; product inventory on_hand 10; order qty 6 submitted (reserved 6)"]
          setup_api_calls:
            - call: "POST /packaging-distribution/warehouses"
              payload: { code: "ATL", name: "Atlanta DC", zone: 2, ship_cutoff_time: "15:00", timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { wh_atl: $.data.id }
            - call: "POST /packaging-distribution/accounts"
              payload: { company_name: "Acme Corp", account_type: "CORPORATE", credit_limit_cents: 100000000, default_warehouse_code: "ATL" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /packaging-distribution/products"
              payload: { sku: "C-1", name: "C", category: "TAPE", base_price_cents: 100, uom: "EACH", case_qty: 1, pallet_qty: 10, weight_lbs_per_unit: 1, density_pcf: 20 }
              as: CatalogManager
              captures: { prod: $.data.id }
            - call: "POST /packaging-distribution/inventory"
              payload: { product_id: "${prod}", warehouse_id: "${wh_atl}", on_hand_qty: 10 }
              as: WarehouseOps
              captures: { inv: $.data.id }
            - call: "POST /packaging-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /packaging-distribution/orders"
              payload: { account_id: "${acct}", ship_zone: 5 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
            - call: "POST /packaging-distribution/orders/${ord}/lines"
              payload: { product_id: "${prod}", qty: 6 }
              as: Buyer
              as_user_id: "${acct}"
            - call: "POST /packaging-distribution/orders/${ord}/submit"
              payload: {}
              as: Buyer
              as_user_id: "${acct}"
          trigger:
            - call: "GET /packaging-distribution/inventory/${inv}"
              payload: {}
              as: WarehouseOps
              captures: { onhand: $.data.on_hand_qty, reserved: $.data.reserved_qty, avail: $.data.available_qty }
          assert:
            - "on_hand_qty == 10, reserved_qty == 6, available_qty == 4 (captured ${onhand}, ${reserved}, ${avail})"

      - name: entity_enum_constraint_invalid_value_rejected
        claim_type: type_constraints
        grounds:
          - entities.Product.fields.category
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /products with category FURNITURE (not in BOXES|MAILERS|TAPE|CUSHIONING|LABELS) -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["catalog empty"]
          setup_api_calls: []
          trigger:
            - call: "POST /packaging-distribution/products"
              payload: { sku: "X-9", name: "X", category: "FURNITURE", base_price_cents: 100, uom: "EACH", case_qty: 1, pallet_qty: 10, weight_lbs_per_unit: 1, density_pcf: 20 }
              as: CatalogManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (captured ${err})"

  # ==================================================================
  # Section: state_machines
  # ==================================================================
  - section: state_machines
    instances:
      - name: order_terminal_cancelled_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Order
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "From terminal CANCELLED, ship, cancel, and approve are all rejected with ERR_INVALID_STATE and no side effects fire."
        test_recipe:
          setup: ["warehouse ATL; account; product inventory 100; order qty 1 submitted then cancelled -> CANCELLED"]
          setup_api_calls:
            - call: "POST /packaging-distribution/warehouses"
              payload: { code: "ATL", name: "Atlanta DC", zone: 2, ship_cutoff_time: "15:00", timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { wh_atl: $.data.id }
            - call: "POST /packaging-distribution/accounts"
              payload: { company_name: "Acme Corp", account_type: "CORPORATE", credit_limit_cents: 100000000, default_warehouse_code: "ATL" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /packaging-distribution/products"
              payload: { sku: "D-1", name: "D", category: "TAPE", base_price_cents: 100, uom: "EACH", case_qty: 1, pallet_qty: 10, weight_lbs_per_unit: 1, density_pcf: 20 }
              as: CatalogManager
              captures: { prod: $.data.id }
            - call: "POST /packaging-distribution/inventory"
              payload: { product_id: "${prod}", warehouse_id: "${wh_atl}", on_hand_qty: 100 }
              as: WarehouseOps
            - call: "POST /packaging-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /packaging-distribution/orders"
              payload: { account_id: "${acct}", ship_zone: 5 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
            - call: "POST /packaging-distribution/orders/${ord}/lines"
              payload: { product_id: "${prod}", qty: 1 }
              as: Buyer
              as_user_id: "${acct}"
            - call: "POST /packaging-distribution/orders/${ord}/submit"
              payload: {}
              as: Buyer
              as_user_id: "${acct}"
            - call: "POST /packaging-distribution/orders/${ord}/cancel"
              payload: {}
              as: Buyer
              as_user_id: "${acct}"
          trigger:
            - call: "POST /packaging-distribution/orders/${ord}/ship"
              payload: {}
              as: WarehouseOps
              captures: { err_1: $.data.error_id }
            - call: "POST /packaging-distribution/orders/${ord}/cancel"
              payload: {}
              as: Buyer
              as_user_id: "${acct}"
              captures: { err_2: $.data.error_id }
          assert:
            - "ship from CANCELLED: error_id == ERR_INVALID_STATE (captured ${err_1})"
            - "cancel from CANCELLED: error_id == ERR_INVALID_STATE (captured ${err_2})"

      - name: order_initial_state_draft_and_line_immutability_after_submit
        claim_type: initial_state
        grounds:
          - state_machines.Order
          - state_machines.OrderLine
        distinguishing_aspect: "A new order starts DRAFT with version 1; adding a line to a non-DRAFT (STOCK_RESERVED) order is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["warehouse ATL; account; product inventory 100"]
          setup_api_calls:
            - call: "POST /packaging-distribution/warehouses"
              payload: { code: "ATL", name: "Atlanta DC", zone: 2, ship_cutoff_time: "15:00", timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { wh_atl: $.data.id }
            - call: "POST /packaging-distribution/accounts"
              payload: { company_name: "Acme Corp", account_type: "CORPORATE", credit_limit_cents: 100000000, default_warehouse_code: "ATL" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /packaging-distribution/products"
              payload: { sku: "E-1", name: "E", category: "TAPE", base_price_cents: 100, uom: "EACH", case_qty: 1, pallet_qty: 10, weight_lbs_per_unit: 1, density_pcf: 20 }
              as: CatalogManager
              captures: { prod: $.data.id }
            - call: "POST /packaging-distribution/inventory"
              payload: { product_id: "${prod}", warehouse_id: "${wh_atl}", on_hand_qty: 100 }
              as: WarehouseOps
            - call: "POST /packaging-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /packaging-distribution/orders"
              payload: { account_id: "${acct}", ship_zone: 5 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { ord: $.data.id, st0: $.data.status, v0: $.data.version }
            - call: "POST /packaging-distribution/orders/${ord}/lines"
              payload: { product_id: "${prod}", qty: 1 }
              as: Buyer
              as_user_id: "${acct}"
            - call: "POST /packaging-distribution/orders/${ord}/submit"
              payload: {}
              as: Buyer
              as_user_id: "${acct}"
          trigger:
            - call: "POST /packaging-distribution/orders/${ord}/lines"
              payload: { product_id: "${prod}", qty: 2 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
          assert:
            - "new order: status == DRAFT, version == 1 (captured ${st0}, ${v0})"
            - "line add after submit: error_id == ERR_INVALID_STATE (captured ${err})"

      - name: return_terminal_rejected_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Return
        distinguishing_aspect: "A REJECTED return accepts no further transitions: approve and receive both fail with ERR_INVALID_STATE."
        test_recipe:
          setup: ["shipped order with qty 2; return REQUESTED then REJECTED"]
          setup_api_calls:
            - call: "POST /packaging-distribution/warehouses"
              payload: { code: "ATL", name: "Atlanta DC", zone: 2, ship_cutoff_time: "15:00", timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { wh_atl: $.data.id }
            - call: "POST /packaging-distribution/accounts"
              payload: { company_name: "Acme Corp", account_type: "CORPORATE", credit_limit_cents: 100000000, default_warehouse_code: "ATL" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /packaging-distribution/products"
              payload: { sku: "F-1", name: "F", category: "TAPE", base_price_cents: 100, uom: "EACH", case_qty: 1, pallet_qty: 10, weight_lbs_per_unit: 1, density_pcf: 20 }
              as: CatalogManager
              captures: { prod: $.data.id }
            - call: "POST /packaging-distribution/inventory"
              payload: { product_id: "${prod}", warehouse_id: "${wh_atl}", on_hand_qty: 100 }
              as: WarehouseOps
            - call: "POST /packaging-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /packaging-distribution/orders"
              payload: { account_id: "${acct}", ship_zone: 5 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
            - call: "POST /packaging-distribution/orders/${ord}/lines"
              payload: { product_id: "${prod}", qty: 2 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { line: $.data.id }
            - call: "POST /packaging-distribution/orders/${ord}/submit"
              payload: {}
              as: Buyer
              as_user_id: "${acct}"
            - call: "POST /packaging-distribution/orders/${ord}/ship"
              payload: {}
              as: WarehouseOps
            - call: "POST /packaging-distribution/returns"
              payload: { order_id: "${ord}", return_type: "STOCK", reason_code: "CHANGED_MIND", lines: [ { order_line_id: "${line}", qty: 1 } ] }
              as: Buyer
              as_user_id: "${acct}"
              captures: { ret: $.data.id }
            - call: "POST /packaging-distribution/returns/${ret}/reject"
              payload: { reason: "outside policy" }
              as: CustomerService
          trigger:
            - call: "POST /packaging-distribution/returns/${ret}/approve"
              payload: {}
              as: CustomerService
              captures: { err_1: $.data.error_id }
            - call: "POST /packaging-distribution/returns/${ret}/receive"
              payload: {}
              as: WarehouseOps
              captures: { err_2: $.data.error_id }
          assert:
            - "approve from REJECTED: error_id == ERR_INVALID_STATE (captured ${err_1})"
            - "receive from REJECTED: error_id == ERR_INVALID_STATE (captured ${err_2})"

      - name: custom_job_advance_from_queued_invalid
        claim_type: invalid_transition
        grounds:
          - state_machines.CustomPrintJob
        distinguishing_aspect: "POST /custom-print-jobs/{id}/advance is defined only from PLATING; calling it on a QUEUED job fails with ERR_INVALID_STATE (no skipping PLATING)."
        test_recipe:
          setup: ["custom order submitted -> one QUEUED job"]
          setup_api_calls:
            - call: "POST /packaging-distribution/warehouses"
              payload: { code: "ATL", name: "Atlanta DC", zone: 2, ship_cutoff_time: "15:00", timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { wh_atl: $.data.id }
            - call: "POST /packaging-distribution/accounts"
              payload: { company_name: "Acme Corp", account_type: "CORPORATE", credit_limit_cents: 100000000, default_warehouse_code: "ATL" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /packaging-distribution/products"
              payload: { sku: "G-1", name: "G", category: "LABELS", base_price_cents: 100, uom: "EACH", case_qty: 1, pallet_qty: 10, weight_lbs_per_unit: 1, density_pcf: 20, is_custom_print: true, lead_time_days: 2 }
              as: CatalogManager
              captures: { prod: $.data.id }
            - call: "POST /packaging-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /packaging-distribution/orders"
              payload: { account_id: "${acct}", ship_zone: 5 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
            - call: "POST /packaging-distribution/orders/${ord}/lines"
              payload: { product_id: "${prod}", qty: 5, print_artwork_ref: "art-g", over_under_tolerance_pct: 10 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { line: $.data.id }
            - call: "POST /packaging-distribution/orders/${ord}/submit"
              payload: {}
              as: Buyer
              as_user_id: "${acct}"
            - call: "GET /packaging-distribution/custom-print-jobs"
              payload: { order_line_id: "${line}" }
              as: PlatformAdmin
              captures: { job: "$.data[0].id" }
          trigger:
            - call: "POST /packaging-distribution/custom-print-jobs/${job}/advance"
              payload: {}
              as: WarehouseOps
              captures: { err: $.data.error_id }
          assert:
            - "advance from QUEUED: error_id == ERR_INVALID_STATE (captured ${err})"

      - name: restock_notification_idempotent_single_fire
        claim_type: side_effect_execution
        grounds:
          - state_machines.RestockNotification.ACTIVE_to_NOTIFIED
        distinguishing_aspect: "A NOTIFIED subscription is terminal: a second threshold crossing does not re-fire or change notified_at (single-fire semantics), and cancel of a NOTIFIED subscription fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["product inventory on_hand 10 reorder_point 5; subscription ACTIVE; order qty 6 submitted then cancelled -> notification fired once"]
          setup_api_calls:
            - call: "POST /packaging-distribution/warehouses"
              payload: { code: "ATL", name: "Atlanta DC", zone: 2, ship_cutoff_time: "15:00", timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { wh_atl: $.data.id }
            - call: "POST /packaging-distribution/accounts"
              payload: { company_name: "Acme Corp", account_type: "CORPORATE", credit_limit_cents: 100000000, default_warehouse_code: "ATL" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /packaging-distribution/products"
              payload: { sku: "H-1", name: "H", category: "TAPE", base_price_cents: 100, uom: "EACH", case_qty: 1, pallet_qty: 10, weight_lbs_per_unit: 1, density_pcf: 20 }
              as: CatalogManager
              captures: { prod: $.data.id }
            - call: "POST /packaging-distribution/inventory"
              payload: { product_id: "${prod}", warehouse_id: "${wh_atl}", on_hand_qty: 10, reorder_point_qty: 5 }
              as: WarehouseOps
              captures: { inv: $.data.id }
            - call: "POST /packaging-distribution/restock-notifications"
              payload: { account_id: "${acct}", product_id: "${prod}" }
              as: Buyer
              as_user_id: "${acct}"
              captures: { notif: $.data.id }
            - call: "POST /packaging-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /packaging-distribution/orders"
              payload: { account_id: "${acct}", ship_zone: 5 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
            - call: "POST /packaging-distribution/orders/${ord}/lines"
              payload: { product_id: "${prod}", qty: 6 }
              as: Buyer
              as_user_id: "${acct}"
            - call: "POST /packaging-distribution/orders/${ord}/submit"
              payload: {}
              as: Buyer
              as_user_id: "${acct}"
            - call: "POST /packaging-distribution/orders/${ord}/cancel"
              payload: {}
              as: Buyer
              as_user_id: "${acct}"
            - call: "POST /packaging-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T10:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /packaging-distribution/inventory/${inv}/receive"
              payload: { qty: 5 }
              as: WarehouseOps
            - call: "GET /packaging-distribution/restock-notifications/${notif}"
              payload: {}
              as: PlatformAdmin
              captures: { n_status: $.data.status, n_at: $.data.notified_at }
            - call: "POST /packaging-distribution/restock-notifications/${notif}/cancel"
              payload: {}
              as: Buyer
              as_user_id: "${acct}"
              captures: { err_2: $.data.error_id }
          assert:
            - "notification status == NOTIFIED with notified_at == 2026-08-03T10:00:00Z (captured ${n_status}, ${n_at}) — the second-day receive did NOT overwrite it"
            - "cancel of NOTIFIED subscription: error_id == ERR_INVALID_STATE (captured ${err_2})"

      - name: split_allocation_partially_backordered_when_backorderable
        claim_type: guarded_transition
        grounds:
          - state_machines.Order.PENDING_to_PARTIALLY_BACKORDERED
          - state_machines.OrderLine.OPEN_to_BACKORDERED
        distinguishing_aspect: "A line short at every warehouse whose Inventory row is backorderable converts the order to PARTIALLY_BACKORDERED instead of failing; ship then ships only the ALLOCATED line and leaves the BACKORDERED line untouched."
        test_recipe:
