              payload: { policy_id: "${p1}", coverage_type: "WORKMANSHIP", defect_category: "WORKMANSHIP_DEFECT", damage_description: "Widespread trim and drywall workmanship failure", claimed_amount_cents: 1200000 }
              as: Homeowner
              as_user_id: "${h1}"
              captures: { c1: $.data.id }
            - call: "POST /warranty/claims/${c1}/investigation"
              payload: { substantiation_ratio: 1.00 }
              as: ClaimsAdjuster
              as_user_id: "adjuster-001"
            - call: "POST /warranty/claims/${c1}/obligation-routing"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adjuster-001"
              captures: { net: $.data.net_payable_cents, res: $.data.reserve_cents }
            - call: "POST /warranty/claims/${c1}/adjudication"
              payload: { outcome: "APPROVE" }
              as: ClaimsAdjuster
              as_user_id: "adjuster-001"
          trigger:
            - call: "POST /warranty/claims/${c1}/payments"
              payload: { amount_cents: 600000, memo: "first draw" }
              as: ClaimsAdjuster
              as_user_id: "adjuster-002"
              captures: { paid1: $.data.paid_cents, res1: $.data.reserve_cents, ver1: $.data.version }
            - call: "GET /warranty/coverage-terms/${endt}"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { cons1: $.data.consumed_limit_cents, rem1: $.data.remaining_limit_cents }
            - call: "POST /warranty/claims/${c1}/reserve-entries"
              payload: { entry_type: "ADJUSTMENT", amount_cents: 900000, memo: "reserve raised above the remaining capacity", expected_claim_version: "${ver1}" }
              as: ClaimsAdjuster
              as_user_id: "adjuster-001"
              captures: { bal: $.data.balance_after_reserve_cents }
            - call: "POST /warranty/claims/${c1}/payments"
              payload: { amount_cents: 500000, memo: "second draw beyond the remaining capacity" }
              as: ClaimsAdjuster
              as_user_id: "adjuster-002"
              captures: { e_agg: $.data.error_id }
            - call: "POST /warranty/claims/${c1}/payments"
              payload: { amount_cents: 400000, memo: "second draw sized to the remaining capacity" }
              as: ClaimsAdjuster
              as_user_id: "adjuster-002"
              captures: { paid2: $.data.paid_cents, res2: $.data.reserve_cents, st2: $.data.status }
            - call: "GET /warranty/coverage-terms/${endt}"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { cons2: $.data.consumed_limit_cents, rem2: $.data.remaining_limit_cents, tstat2: $.data.status }
          assert:
            - "${net} == 1000000 and ${res} == 1000000 - the uncapped figure exceeds the endorsement limit under either betterment tier, so step 7 caps the payable at the term limit"
            - "${paid1} == 600000, ${res1} == 400000, ${cons1} == 600000 and ${rem1} == 400000 - the first draw is far inside the limit"
            - "${bal} == 900000 - the ADJUSTMENT is legal because 900000 is not below the 600000 already disbursed, and it takes the reserve above the remaining capacity"
            - "${e_agg} == \"ERR_COVERAGE_LIMIT_EXCEEDED\" at HTTP 422, NOT ERR_PAYMENT_EXCEEDS_RESERVE - 500000 fits inside the 900000 reserve, so only the aggregate coverage capacity can refuse it"
            - "the 400000 draw returns HTTP 200 with ${paid2} == 1000000 and ${res2} == 500000, and ${st2} == \"APPROVED\" - the claim does not close because the reserve is still positive"
            - "${cons2} == 1000000, ${rem2} == 0 and ${tstat2} == \"LIMIT_EXHAUSTED\" - consumed plus remaining equals the limit at every step"

