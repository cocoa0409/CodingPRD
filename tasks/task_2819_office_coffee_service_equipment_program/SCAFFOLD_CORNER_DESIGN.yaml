              as: AccountManager
              captures: { err_par: "$.data.error_id" }
          assert:
            - "the model retry is HTTP 409 with data.error_id == ERR_DUPLICATE_MODEL_CODE, and GET /ocs/equipment-models still has total_count == 1 with cups_per_hour_capacity 30"
            - "the asset retry is HTTP 409 with data.error_id == ERR_DUPLICATE_SERIAL_NUMBER even though asset_role differs, and GET /ocs/equipment-assets still has total_count == 1"
            - "the product retry is HTTP 409 with data.error_id == ERR_DUPLICATE_SKU even though category differs, and GET /ocs/product-items still has total_count == 1"
            - "the par-level create is HTTP 409 with data.error_id == ERR_DUPLICATE_PAR_LEVEL - the pair is unique whatever the source, so a MANUAL row cannot shadow the FORECAST row"
            - "the surviving ParLevel row still reads par_units 65 / reorder_point_units 26 / source FORECAST - the rejected 10/5 values were never written"

