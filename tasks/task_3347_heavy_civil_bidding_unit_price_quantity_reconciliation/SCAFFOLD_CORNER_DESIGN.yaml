- section: excluded_public_surface
  instances:
  - name: stale_bid_item_version_conflict_covered_by_difficulty_index
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[measurement-create-stale-bid-item]
    excluded_because:
      difficulty_instance: open_bid_cascade_awards_items_then_recomputes_reconciliation_then_project
      rationale: The OCC stale-version rejection on the measurement endpoint is already asserted as the negative path of the open-bid cascade instance; duplicating it here would not add a distinct claim.
  - name: open_claim_blocks_closeout_covered_by_priority_pair
    claim_type: violation_to_error
    grounds:
    - errors[ERR_OPEN_CLAIM_BLOCKS_CLOSEOUT]
    excluded_because:
      difficulty_instance: open_claim_blocks_finalize_before_measurement_gap
      rationale: The open-claim rejection is the dual-failure partner asserted inside the named §1.8 instance.
  - name: dbe_goal_gate_covered_by_boundary_instance
    claim_type: violation_to_error
    grounds:
    - errors[ERR_DBE_GOOD_FAITH_MISSING]
    excluded_because:
      difficulty_instance: empty_carried_quote_set_yields_zero_dbe_credit
      rationale: The empty-carried-quote boundary already drives this error through the start-work endpoint.
  - name: capacity_exhaustion_covered_by_compensating_invariant
    claim_type: violation_to_error
    grounds:
    - errors[ERR_AGGREGATE_CAPACITY_EXCEEDED]
    excluded_because:
      difficulty_instance: capacity_issue_then_release_returns_same_available_cents
      rationale: Capacity conservation is asserted end-to-end in the named §1.8 instance, including the consumed/available split.
  - name: rate_below_cost_covered_by_priority_pair
    claim_type: violation_to_error
    grounds:
    - errors[ERR_RATE_BELOW_COST]
    excluded_because:
      difficulty_instance: suspended_surety_beats_insufficient_bond_amount
      rationale: The cost-floor rejection is exercised as the business_referential partner of the named dual-failure instance.
  - name: bond_interval_overlap_covered_by_temporal_instance
    claim_type: violation_to_error
    grounds:
    - errors[ERR_RESERVATION_OVERLAP]
    excluded_because:
      difficulty_instance: same_bond_type_adjacent_coverage_periods_do_not_overlap
      rationale: Half-open interval arithmetic on bond coverage is the substance of the named §1.8 instance.
