  - rule_id: compensating_invariant
    instances:
      - name: revenue_correction_conserves_the_fee_ledger
        grounds:
          - calculations.monthly_fee_assessment
          - endpoints.POST_/agreements/{id}/revenue-reports.side_effects
          - entities.LicenseAgreement.fields.revenue_periods
          - entities.LicenseAgreement.fields.total_fees_assessed
          - entities.LicenseAgreement.fields.reported_period_count
        distinguishing_aspect: |
          Conserved quantity: MONEY. The invariant is that every ledger total always equals the sum
          of the surviving per-period amounts and nothing else — so restating November from
          320000.16 down to 250000.00 must leave total_fees_assessed == 24000.00 + 47000.01 ==
          71000.01 exactly, with the superseded November row still present but excluded from every
          total and from reported_period_count. Double-counting the superseded row gives 118000.02,
          deleting it instead of flagging it loses the audit trail, and re-deriving the totals from
          unrounded products drifts the marketing line.
