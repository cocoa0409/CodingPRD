      - name: finalize_adjustment_cascades_four_hops_to_capacity_exhausted
        grounds:
          - state_machines.Claim.adjustment_status.PROVISIONAL_ADJUSTED_to_FINAL_ADJUSTED
          - calculations.event_loss_waterfall
          - state_machines.CatastropheEvent.status.LOSS_AGGREGATION_to_CAPACITY_EXHAUSTED
          - entities.ReinsuranceLayer.fields.ceded_cents
        distinguishing_aspect: |
          A single finalize-adjustment on a 235,000,000 claim walks Claim -> CatastropheEvent
          aggregate -> the whole reinsurance tower -> event status, so both ReinsuranceLayer rows
          must be rewritten (45000000 each) and the event must land in CAPACITY_EXHAUSTED with
          uncovered_cents 45000000 - a two-hop implementation that stops after aggregating the loss
          leaves the event in LOSS_AGGREGATION with zero cessions.
