      - name: planned_passage_times_include_ceil_allowance
        claim_type: Correct Result
        grounds:
          - calculations.schedule_feasibility
          - entities.SegmentPassage.fields.planned_exit_at
        distinguishing_aspect: "Padded running time uses ceil: seg1 pure 21 x 1.25 = 26.25 pads to exactly 27 minutes, so planned_exit is 08:27 and seg2 entry equals it (dwell 0) — a fractional allowance would silently produce 08:26 or 08:26:15 without the pinned ceil."
        test_recipe:
          setup: ["Published 1-run timetable departing 08:00 on 2026-09-02."]
          setup_api_calls:
            - *k_clock
            - *k_host
            - *k_corr
            - *k_seg1
            - *k_seg2
            - *k_oa
            - *k_oa_act
            - *k_tt1
            - *k_tt1_prop
            - *k_tt1_rev
            - *k_tt1_rat
            - *k_tt1_pub
            - *k_runs1
            - *k_pass1
          trigger:
            - call: "GET /rail/segment-passages/${pass1_id}"
              payload: {}
              as: PassengerOperator
          assert:
            - "SegmentPassage.${pass1_id}.planned_entry_at == 2026-09-02T08:00:00Z"
            - "SegmentPassage.${pass1_id}.planned_exit_at == 2026-09-02T08:27:00Z (ceil(21 x 1.25) = 27)"
            - "SegmentPassage.${pass2_id}.planned_entry_at == 2026-09-02T08:27:00Z"
            - "SegmentPassage.${pass2_id}.planned_exit_at == 2026-09-02T09:17:00Z (27 + 50)"

      - name: otp_percentage_precision_four_decimals
        claim_type: Precision
        grounds:
          - calculations.otp_measurement
        distinguishing_aspect: "OTP is reported to exactly 4 decimal places: one on-time run of two completed yields otp_pct == 50.0000 (a float like 50.0 or 50 fails the assertion)."
        test_recipe:
          setup: ["2-run timetable; run1 completed on time (15 min), run2 completed late (16 min)."]
          setup_api_calls:
            - *k_clock
            - *k_host
            - *k_corr
            - *k_seg1
            - *k_seg2
            - *k_oa
            - *k_oa_act
            - *k_tt2
            - *k_tt2_prop
            - *k_tt2_rev
            - *k_tt2_rat
            - *k_tt2_pub
            - &k_runs2
              call: "GET /rail/train-runs"
              payload: { timetable_id: "${tt2_id}" }
              as: PassengerOperator
              captures: { r1_id: "$.data[0].id", r2_id: "$.data[1].id" }
            - &k_pass_r1
              call: "GET /rail/segment-passages"
              payload: { train_run_id: "${r1_id}" }
              as: HostRailroadRep
              as_user_id: "${host_id}"
              captures: { r1p1: "$.data[0].id", r1p2: "$.data[1].id" }
            - &k_pass_r2
              call: "GET /rail/segment-passages"
