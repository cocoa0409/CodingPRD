  # ===========================================================================
  # SECTION 2 — STATE MACHINES (12 machines; state_machine_shape: cyclic, with a
  # parallel Profile axis pair and a compound DeletionRequest)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: validate_batch_moves_received_to_validated
        claim_type: valid_transition
        grounds:
          - state_machines.IngestBatch.RECEIVED_to_VALIDATED
          - calculations.batch_data_quality_score
          - endpoints[POST /cdp/ingest-batches/{batchId}/validate]
        distinguishing_aspect: "A RECEIVED batch whose computed dq_score (1.00) is at or above the source's pii_completeness_floor (0.70) becomes VALIDATED with validated_at stamped and the quality fields written."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One SourceSystem (default WEIGHTED_COMPONENTS, floor 0.70) and one RECEIVED batch of one fully valid record."
          setup_api_calls:
            - call: "POST /cdp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DataPlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /cdp/source-systems"
              payload:
                code: "SM_VALID"
                display_name: "Validate Feed"
                channel_type: "TRANSACTIONS"
                trust_tier: 3
              as: DataPlatformAdmin
              as_user_id: "u_admin"
              captures: { src_id: "$.data.id" }
            - call: "POST /cdp/ingest-batches"
              payload:
                source_system_id: "${src_id}"
                batch_label: "Validate Single"
                records:
                  - external_id: "V1"
                    email_raw: "v1@example.com"
                    phone_raw: "+1 (555) 250-0001"
                    loyalty_number: "LY00002501"
                    first_name: "Ada"
                    last_name: "Alpha"
                    postal_code: "10001"
                    address_line: null
                    event_timestamp: "2026-07-25T10:00:00Z"
                    consent_signals: []
              as: DataEngineer
              as_user_id: "u_eng"
              captures: { batch_id: "$.data.id" }
          trigger:
            - call: "POST /cdp/ingest-batches/${batch_id}/validate"
              payload: {}
              as: DataEngineer
              as_user_id: "u_eng"
          assert:
            - "the response status is 200"
            - "IngestBatch.${batch_id}.status == VALIDATED"
            - "IngestBatch.${batch_id}.dq_score == 1.00 and valid_record_count == 1 and invalid_record_count == 0"
            - "IngestBatch.${batch_id}.dq_failure_breakdown == {}"
            - "IngestBatch.${batch_id}.validated_at == 2026-08-01T00:00:00Z"
            - "SourceSystem.${src_id}.submitted_record_total == 1 and valid_record_total == 1 and dq_pass_rate == 1.0000"
            - "SourceSystem.${src_id}.status is still REGISTERED — only a promote activates a source"

      - name: promote_before_validate_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.IngestBatch.VALIDATED_to_PROMOTED
          - validations[priority=21]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "The VALIDATED -> PROMOTED transition requires status == VALIDATED, so promoting a still-RECEIVED batch returns 409 ERR_INVALID_STATE and mints no Profile."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One SourceSystem and one RECEIVED batch of one fully valid record; validate has NOT been called."
          setup_api_calls:
            - call: "POST /cdp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DataPlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /cdp/source-systems"
              payload:
                code: "SM_PRECOND"
                display_name: "Precondition Feed"
                channel_type: "TRANSACTIONS"
                trust_tier: 3
              as: DataPlatformAdmin
              as_user_id: "u_admin"
              captures: { src_id: "$.data.id" }
            - call: "POST /cdp/ingest-batches"
