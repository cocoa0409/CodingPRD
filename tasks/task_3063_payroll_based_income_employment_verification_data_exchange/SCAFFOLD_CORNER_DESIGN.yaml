        claim_type: computed_fields
        grounds:
          - entities.Employer.fields.feed_status
          - entities.Employer.fields.version
        distinguishing_aspect: "feed_status is computed from last_feed_received_date rather than accepted from input, and version is server-minted starting at 1."
        test_recipe:
          setup:
            - "empty database with the logical clock pinned"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /work-number/employers"
              payload: { legal_name: "Northwind Logistics", fein: "123456789", employer_type: "PRIVATE", payroll_frequency: "MONTHLY" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id, emp_v: $.data.version }
          assert:
            - "Employer.${emp_id}.feed_status == CURRENT with no last_feed_received_date set, because the staleness clock starts from created_at"
            - "Employer.${emp_id}.freeze_state == NONE and Employer.${emp_id}.review_state == NONE"
            - "Employer.${emp_id}.version == 1, so ${emp_v} is 1 and not supplied by the caller"
