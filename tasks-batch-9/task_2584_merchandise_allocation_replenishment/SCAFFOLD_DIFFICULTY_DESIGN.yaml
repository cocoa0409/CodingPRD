            - "StorePosition.${pr_id} (7 units, 4XL missing): broken_size_count == 1 and assortment_status == SIZE_OUT_RISK, NOT BROKEN - the BROKEN branch starts at 2"
            - "Item.${item_none}.lifecycle_state == ACTIVE with broken_store_count == 0 and size_out_store_count == 0"
