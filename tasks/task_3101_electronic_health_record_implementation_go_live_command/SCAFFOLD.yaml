# =============================================================================
# PRD Benchmark Scaffold — §1.0–§1.7
# Task: task_3101_electronic_health_record_implementation_go_live_command
# EHR Implementation & Go-Live Command Center (Epic Systems)
# =============================================================================

scenario: |
  Electronic Health Record Implementation & Go-Live Command Center (Epic Systems): system build across departmental applications with foundation content adoption versus local customization decisions, provider and staff role-based training with credentialed trainer certification and end-user proficiency gating, integrated testing cycles covering unit, integrated and charge-capture-to-claim scenarios, data conversion of active patients, appointments, orders and balances from legacy systems, interface build for laboratory, imaging, pharmacy and device integration with message validation, cutover plan with downtime procedures, order reconciliation and paper backfill, command center staffing with at-the-elbow support and issue triage by severity, post-live optimization backlog and revenue cycle stabilization metrics

domain_name: ehr-implementation-go-live
# Resources live at the deployment root so the cross-cutting satellite collections
# (staff, defects, orders, tickets, shifts) are top-level segments rather than being
# nested under one aggregate. See scaffold_lint.py check (f).
api_prefix: ""

complexity_profile:
  primary_archetype: "Posture-driven gating"
  secondary_archetype: "Temporal windowing"
  complexity_layers:
    - "Optimistic concurrency"
    - "Cascading side effects"
    - "Dual-variant calculation"
    - "Ops-run checkpoint"
  entity_topology: hierarchical
  # hierarchical spine (EhrImplementation -> Facility -> Department -> SystemBuildItem)
  # carrying cross-cutting satellites (Staff, TestScenario, InterfaceChannel, CutoverTask, ...)
  # and one self-referential edge (Staff.preceptor_staff_id).
  state_machine_shape: posture_driven
  # EhrImplementation.readiness_posture (OPEN | RESTRICTED | ROLLBACK_REQUIRED) gates child
  # operations; SystemBuildItem and TestDefect are cyclic; PatientOrder carries parallel
  # dimensions (clinical_state x billing_state).
  relationship_patterns:
    - one_to_many
    - many_to_many        # Staff <-> Facility via StaffingShift / proficiency coverage
    - self_referential    # Staff.preceptor_staff_id -> Staff.id (mentorship chain)
    - polymorphic         # CommandCenterTicket.target_ref can denote Department | Facility | InterfaceChannel
    - cross_aggregate     # SystemBuildItem.ehr_implementation_id, PatientOrder.facility_id
  role_model: segregation_of_duties
  consistency_model: saga

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: EhrImplementation
    parent: null
    common_fields: true
    fields:
      - { name: program_name, type: string, source: input, description: "Health-system program name" }
      - { name: vendor_release, type: string, source: input, description: "EHR release under implementation, e.g. 2026.2" }
      - { name: go_live_target_utc, type: datetime, source: input, description: "Contracted enterprise go-live instant" }
      - { name: status, type: enum, source: system, description: "PLANNING | BUILD_IN_PROGRESS | VALIDATION_IN_PROGRESS | CUTOVER_READY | GO_LIVE_ACTIVE | COMMAND_CENTER_ACTIVE | STABILIZED | POST_LIVE_OPTIMIZATION | ARCHIVED" }
      - { name: readiness_posture, type: enum, source: computed, description: "OPEN | RESTRICTED | ROLLBACK_REQUIRED — derived aggregate that gates every child operation" }
      - { name: current_epoch_index, type: integer, source: system, default: 0, description: "Ops-run epoch; advanced only by the epoch endpoint" }
      - { name: readiness_score, type: number, source: computed, description: "Weighted readiness score 0-100 from readiness_posture_score" }
      - { name: optimistic_readiness_score, type: number, source: computed, description: "Optimistic variant of readiness_score (in-flight work counted as passing)" }
      - { name: net_trainer_count, type: integer, source: computed, description: "Count of CredentialedTrainer rows currently in status CERTIFIED; a certify/revoke pair returns it to its pre-pair value" }
      - { name: order_reconciliation_balance, type: integer, source: computed, description: "Conserved quantity: reconciled EHR orders minus paper-backfill orders injected at cutover" }
      - { name: command_center_activated_utc, type: datetime, source: computed, description: "Instant command center was activated" }

  - name: Facility
    parent: EhrImplementation
    common_fields: true
    fields:
      - { name: ehr_implementation_id, type: string, source: system, description: "FK -> EhrImplementation.id; owning program" }
      - { name: name, type: string, source: input, description: "Facility name" }
      - { name: facility_type, type: enum, source: input, description: "ACUTE_CARE | CRITICAL_ACCESS | AMBULATORY | SPECIALTY" }
      - { name: bed_count, type: integer, source: input, description: "Licensed beds; 0 for ambulatory sites" }
      - { name: rollout_wave, type: integer, source: input, description: "Sequenced go-live wave number (1-based)" }
      - { name: conversion_scope, type: enum, source: input, description: "FULL_RECORD | DEMOGRAPHICS_ONLY | SCHEDULING_ONLY" }
      - { name: converted_patient_count, type: integer, source: computed, default: 0, description: "Conserved count of active patients loaded and not rolled back" }
      - { name: conversion_variance_index, type: number, source: computed, description: "Max variance_penalty_points over the facility's RECONCILED DataConversionBatch rows" }
      - { name: revenue_cycle_stabilization_index, type: number, source: computed, description: "Aggregate 0-100 stabilization index from PatientOrder billing states" }
      - { name: status, type: enum, source: system, description: "SITE_REGISTERED | BUILD_CONFIGURED | REMEDIATION_REQUIRED | VALIDATED | CUTOVER_READY | LIVE | STABILIZED | STABILIZATION_AT_RISK" }
      - { name: is_live, type: boolean, source: computed, default: false, description: "True once facility go-live completes" }

  - name: Department
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: system, description: "FK -> Facility.id; owning facility" }
      - { name: ehr_implementation_id, type: string, source: system, description: "FK -> EhrImplementation.id; cross-aggregate program backlink" }
      - { name: department_code, type: string, source: input, description: "Department code, unique within a facility" }
      - { name: application_scope, type: array, source: input, description: "Application codes this department staffs" }
      - { name: required_staff_count, type: integer, source: input, description: "Denominator of the proficiency gate" }
      - { name: proficiency_cleared_count, type: integer, source: computed, default: 0, description: "Staff of this department with status IN {PROFICIENCY_VERIFIED, CREDENTIALED}" }
      - { name: proficiency_cleared_ratio, type: number, source: computed, description: "proficiency_cleared_count / required_staff_count" }
      - { name: proficiency_gate_open, type: boolean, source: computed, default: false, description: "True when proficiency_cleared_ratio >= PROFICIENCY_GATE_PCT" }
      - { name: build_blocking_defect_count, type: integer, source: computed, default: 0, description: "Open SEV1/SEV2 build-and-test defects belonging to this department's build items" }
      - { name: status, type: enum, source: system, description: "BUILD_PENDING | BUILD_COMPLETE | TRAINING_IN_PROGRESS | READY_FOR_GO_LIVE | REMEDIATION_REQUIRED | LIVE" }

  - name: SystemBuildItem
    parent: Department
    common_fields: true
    fields:
      - { name: department_id, type: string, source: system, description: "FK -> Department.id; owning department" }
      - { name: ehr_implementation_id, type: string, source: system, description: "FK -> EhrImplementation.id; cross-aggregate program backlink" }
      - { name: application_code, type: string, source: input, description: "Application the build item configures" }
      - { name: build_classification, type: enum, source: input, description: "FOUNDATION_ADOPTED | FOUNDATION_ADAPTED | LOCAL_CUSTOM" }
      - { name: customization_depth, type: integer, source: input, description: "Depth of local modification, 0 for pure foundation adoption" }
      - { name: local_custom_fields, type: array, source: input, description: "Names of locally customized fields/build records" }
      - { name: customization_risk_points, type: integer, source: computed, description: "Risk points from classification and local-custom depth" }
      - { name: test_cycles_passed, type: integer, source: computed, default: 0, description: "Count of PASSED TestScenario rows in the current epoch" }
      - { name: open_defect_count, type: integer, source: computed, default: 0, description: "Open TestDefect rows over this build item's scenarios and their child scenarios" }
      - { name: rejection_count, type: integer, source: computed, default: 0, description: "Times this build item was rejected back into build" }
      - { name: status, type: enum, source: system, description: "DRAFT | IN_BUILD | BUILD_COMPLETE | IN_TESTING | VALIDATION_COMPLETE | BUILD_REJECTED" }

  - name: Staff
    parent: EhrImplementation
    common_fields: true
    fields:
      - { name: ehr_implementation_id, type: string, source: system, description: "FK -> EhrImplementation.id; program the person is credentialed under" }
      - { name: full_name, type: string, source: input, description: "Legal name" }
      - { name: staff_type, type: enum, source: input, description: "PROVIDER | NURSE | ALLIED_HEALTH | REGISTRATION | BILLING | ANALYST" }
      - { name: primary_facility_id, type: string, source: input, description: "FK -> Facility.id; home facility" }
      - { name: department_id, type: string, source: input, description: "FK -> Department.id; home department whose proficiency gate this person feeds" }
      - { name: preceptor_staff_id, type: string, source: input, description: "FK -> Staff.id; self-referential mentorship chain (null for a chain root)" }
      - { name: hired_on, type: datetime, source: input, description: "Hire date" }
      - { name: accumulated_training_hours, type: number, source: computed, default: 0, description: "Sum of completed_hours over non-WAIVED TrainingAssignment rows" }
      - { name: status, type: enum, source: system, description: "REGISTERED | TRAINING_ASSIGNED | TRAINED | PROFICIENCY_VERIFIED | CREDENTIALED | PROFICIENCY_FAILED" }

  - name: TrainingAssignment
    parent: Staff
    common_fields: true
    fields:
      - { name: staff_id, type: string, source: system, description: "FK -> Staff.id; the learner" }
      - { name: ehr_implementation_id, type: string, source: system, description: "FK -> EhrImplementation.id; cross-aggregate program backlink" }
      - { name: curriculum_code, type: string, source: input, description: "Curriculum identifier, e.g. CLN100" }
      - { name: application_code, type: string, source: input, description: "Application the curriculum covers" }
      - { name: required_hours, type: number, source: input, description: "Curriculum hours required for completion" }
      - { name: completed_hours, type: number, source: computed, default: 0, description: "Hours accrued through the curriculum" }
      - { name: completion_pct, type: number, source: computed, description: "min(100, 100 * completed_hours / required_hours)" }
      - { name: due_utc, type: datetime, source: input, description: "Curriculum due instant" }
      - { name: waiver_reason, type: string, source: input, description: "Required only when the assignment is waived" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | IN_PROGRESS | COMPLETED | OVERDUE | WAIVED" }

  - name: CredentialedTrainer
    parent: Staff
    common_fields: true
    fields:
      - { name: staff_id, type: string, source: system, description: "FK -> Staff.id; the person holding trainer status" }
      - { name: ehr_implementation_id, type: string, source: system, description: "FK -> EhrImplementation.id; cross-aggregate program backlink" }
      - { name: application_code, type: string, source: input, description: "Application this trainer is certified for" }
      - { name: certification_level, type: enum, source: input, description: "STANDARD | ADVANCED" }
      - { name: observation_hours, type: number, source: input, description: "Proctored teaching hours observed before certification" }
      - { name: certified_utc, type: datetime, source: computed, description: "Instant certification completed" }
      - { name: expires_utc, type: datetime, source: computed, description: "certified_utc + CERTIFICATION_VALIDITY_DAYS (365 days)" }
      - { name: status, type: enum, source: system, description: "PENDING_OBSERVATION | CERTIFIED | EXPIRED | REVOKED" }

  - name: ProficiencyExam
    parent: Staff
    common_fields: true
    fields:
      - { name: staff_id, type: string, source: system, description: "FK -> Staff.id; the examinee" }
      - { name: ehr_implementation_id, type: string, source: system, description: "FK -> EhrImplementation.id; cross-aggregate program backlink" }
      - { name: application_code, type: string, source: input, description: "Application under assessment" }
      - { name: proctored_by_trainer_id, type: string, source: input, description: "FK -> CredentialedTrainer.id; proctor of record" }
      - { name: exam_score, type: number, source: input, description: "Raw score 0-100" }
      - { name: passing_score, type: number, source: system, default: 80, description: "PASSING_SCORE constant (80)" }
      - { name: attempt_number, type: integer, source: computed, description: "1-based attempt counter for this staff + application pair" }
      - { name: next_attempt_eligible_utc, type: datetime, source: computed, description: "Earliest instant a retake may be recorded" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED_PASS | COMPLETED_FAIL | NO_SHOW" }

  - name: TestScenario
    parent: SystemBuildItem
    common_fields: true
    fields:
      - { name: system_build_item_id, type: string, source: system, description: "FK -> SystemBuildItem.id; build item under test" }
      - { name: ehr_implementation_id, type: string, source: system, description: "FK -> EhrImplementation.id; cross-aggregate program backlink" }
      - { name: scenario_class, type: enum, source: input, description: "UNIT | INTEGRATED | CHARGE_CAPTURE_TO_CLAIM" }
      - { name: step_count, type: integer, source: input, description: "Number of test steps in the script" }
      - { name: executed_epoch, type: integer, source: computed, description: "Epoch in which the last execution ran" }
      - { name: open_defect_count, type: integer, source: computed, default: 0, description: "Defects not RESOLVED or DEFERRED" }
      - { name: status, type: enum, source: system, description: "DEFINED | PASSED | FAILED" }

  - name: TestDefect
    parent: TestScenario
    common_fields: true
    fields:
      - { name: test_scenario_id, type: string, source: system, description: "FK -> TestScenario.id; failing scenario" }
      - { name: ehr_implementation_id, type: string, source: system, description: "FK -> EhrImplementation.id; cross-aggregate program backlink" }
      - { name: defect_code, type: string, source: input, description: "Unique defect code" }
      - { name: severity, type: enum, source: input, description: "SEV1 | SEV2 | SEV3 | SEV4" }
      - { name: blocks_go_live, type: boolean, source: computed, default: false, description: "True while severity in {SEV1,SEV2} and status != RESOLVED" }
      - { name: resolution_epoch, type: integer, source: computed, description: "Epoch in which the defect reached RESOLVED" }
      - { name: attempt_count, type: integer, source: computed, default: 0, description: "Number of reopen attempts recorded for this defect" }
      - { name: aging_hours, type: number, source: computed, description: "Open age in hours measured against the logical clock" }
      - { name: status, type: enum, source: system, description: "OPEN | IN_REMEDIATION | RESOLVED | DEFERRED | REOPENED" }

  - name: DataConversionBatch
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: system, description: "FK -> Facility.id; converted facility" }
      - { name: ehr_implementation_id, type: string, source: system, description: "FK -> EhrImplementation.id; cross-aggregate program backlink" }
      - { name: payload_class, type: enum, source: input, description: "PATIENT_DEMOGRAPHICS | APPOINTMENTS | ORDERS | BALANCES" }
      - { name: attempt_epoch, type: integer, source: input, description: "Epoch this load attempt belongs to" }
      - { name: source_count, type: integer, source: input, description: "Rows read from the legacy system" }
      - { name: reconciled_count, type: integer, source: input, description: "Rows reconciled in the target" }
      - { name: variance_count, type: integer, source: computed, description: "abs(source_count - reconciled_count)" }
      - { name: variance_penalty_points, type: number, source: computed, description: "conversion_reconciliation_variance output" }
      - { name: applied_balance_cents, type: integer, source: computed, default: 0, description: "Balance cents currently applied from this batch" }
      - { name: status, type: enum, source: system, description: "STAGED | VALIDATING | LOADED | RECONCILED | FAILED | ROLLED_BACK" }

  - name: PatientOrder
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: system, description: "FK -> Facility.id; ordering facility" }
      - { name: ehr_implementation_id, type: string, source: system, description: "FK -> EhrImplementation.id; cross-aggregate program backlink" }
      - { name: patient_mrn, type: string, source: input, description: "Medical record number of the converted active patient" }
      - { name: order_type, type: enum, source: input, description: "MEDICATION | LAB | IMAGING | PROCEDURE" }
      - { name: encounter_utc, type: datetime, source: input, description: "Encounter instant in the legacy system" }
      - { name: legacy_charge_cents, type: integer, source: input, description: "Charge captured by the legacy system" }
      - { name: balance_cents, type: integer, source: computed, default: 0, description: "Converted patient balance cents applied from a BALANCES batch" }
      - { name: provisional_charge_cents, type: number, source: computed, description: "Provisional charge-capture variant" }
      - { name: final_charge_cents, type: number, source: computed, description: "Final (reconciled) charge-capture variant" }
      - { name: charge_variance_cents, type: number, source: computed, description: "final_charge_cents - provisional_charge_cents" }
      - { name: paper_backfill_count, type: integer, source: computed, default: 0, description: "Paper order slips backfilled at cutover" }
      - { name: clinical_state, type: enum, source: system, description: "CONVERTED | RECONCILED | PAPER_BACKFILL_REQUIRED (parallel dimension)" }
      - { name: billing_state, type: enum, source: system, description: "UNPOSTED | CHARGE_POSTED | CLAIM_SUBMITTED | CLAIM_ACCEPTED | CLAIM_DENIED | CLAIM_PAID (parallel dimension)" }

  - name: InterfaceChannel
    parent: EhrImplementation
    common_fields: true
    fields:
      - { name: ehr_implementation_id, type: string, source: system, description: "FK -> EhrImplementation.id; owning program" }
      - { name: channel_type, type: enum, source: input, description: "LAB | IMAGING | PHARMACY | DEVICE" }
      - { name: external_system, type: string, source: input, description: "Third-party system name" }
      - { name: message_format, type: enum, source: input, description: "HL7_V2 | FHIR | DICOM | CSV" }
      - { name: throughput_per_hour, type: integer, source: input, description: "Contractual messages per hour" }
      - { name: max_latency_minutes, type: number, source: input, description: "Contractual maximum message latency" }
      - { name: validated_message_count, type: integer, source: computed, default: 0, description: "VALIDATED InterfaceMessage rows in the current epoch" }
      - { name: rejected_message_count, type: integer, source: computed, default: 0, description: "REJECTED InterfaceMessage rows in the current epoch" }
      - { name: interface_message_validation_pass_rate, type: number, source: computed, description: "100*validated/(validated+rejected) for the current epoch; 0.00 when no message is decided" }
      - { name: status, type: enum, source: system, description: "DEFINED | BUILDING | IN_MESSAGE_VALIDATION | VALIDATED | VALIDATION_FAILED" }

  - name: InterfaceMessage
    parent: InterfaceChannel
    common_fields: false
    fields:
      - { name: interface_channel_id, type: string, source: system, description: "FK -> InterfaceChannel.id; owning channel" }
      - { name: ehr_implementation_id, type: string, source: system, description: "FK -> EhrImplementation.id; cross-aggregate program backlink" }
      - { name: message_code, type: enum, source: input, description: "ADT_A01 | ORM_O01 | ORU_R01 | RDE_O11 | DICOM_STOW" }
      - { name: direction, type: enum, source: input, description: "INBOUND | OUTBOUND" }
      - { name: received_utc, type: datetime, source: system, description: "Server-stamped receipt instant" }
      - { name: latency_minutes, type: number, source: computed, description: "Seconds between send and receipt, expressed in minutes, rounded to 2 decimals" }
      - { name: validation_status, type: enum, source: system, description: "RECEIVED | VALIDATED | REJECTED" }
      - { name: validation_error_code, type: string, source: computed, description: "Populated only when validation_status is REJECTED" }

  - name: CutoverTask
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: system, description: "FK -> Facility.id; facility the cutover runs at" }
      - { name: ehr_implementation_id, type: string, source: system, description: "FK -> EhrImplementation.id; cross-aggregate program backlink" }
      - { name: task_class, type: enum, source: input, description: "DOWNTIME_PREP | ORDER_RECONCILIATION | PAPER_BACKFILL | DRESS_REHEARSAL | GO_NO_GO_DECISION" }
      - { name: sequence_index, type: integer, source: input, description: "Ordering index within the facility cutover plan" }
      - { name: planned_start_utc, type: datetime, source: input, description: "Planned start instant (inclusive)" }
      - { name: planned_end_utc, type: datetime, source: input, description: "Planned end instant (exclusive)" }
      - { name: duration_minutes, type: number, source: computed, description: "(planned_end_utc - planned_start_utc) in minutes" }
      - { name: block_reason, type: string, source: input, description: "Required only when the task is blocked" }
      - { name: status, type: enum, source: system, description: "PLANNED | IN_PROGRESS | COMPLETE | SKIPPED | BLOCKED" }

  - name: CommandCenterTicket
    parent: EhrImplementation
    common_fields: true
    fields:
      - { name: ehr_implementation_id, type: string, source: system, description: "FK -> EhrImplementation.id; owning program" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; reporting facility" }
      - { name: department_id, type: string, source: input, description: "FK -> Department.id; reporting department (nullable)" }
      - { name: target_ref, type: string, source: input, description: "Polymorphic reference to a Department, Facility, InterfaceChannel or PatientOrder id" }
      - { name: severity, type: enum, source: input, description: "SEV1 | SEV2 | SEV3 | SEV4" }
      - { name: at_the_elbow_zone, type: string, source: input, description: "Physical support zone the ticket was raised in" }
      - { name: linked_test_defect_id, type: string, source: input, description: "FK -> TestDefect.id; originating defect when the ticket traces to testing" }
      - { name: reported_utc, type: datetime, source: system, description: "Server-stamped report instant" }
      - { name: resolution_sla_minutes, type: integer, source: computed, description: "SLA target from command_center_sla_minutes" }
      - { name: triage_state, type: enum, source: system, description: "REPORTED | TRIAGED | IN_RESOLUTION | RESOLVED | ESCALATED" }

  - name: StaffingShift
    parent: EhrImplementation
    common_fields: true
    fields:
      - { name: ehr_implementation_id, type: string, source: system, description: "FK -> EhrImplementation.id; owning program" }
      - { name: staff_id, type: string, source: input, description: "FK -> Staff.id; assigned command-center staffer" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; facility covered" }
      - { name: support_role, type: enum, source: input, description: "AT_THE_ELBOW | TRIAGE_COMMANDER | APPLICATION_ANALYST | CHARGE_CAPTURE_SPECIALIST" }
      - { name: start_utc, type: datetime, source: input, description: "Shift start instant (inclusive)" }
      - { name: end_utc, type: datetime, source: input, description: "Shift end instant (exclusive)" }
      - { name: handoff_buffer_minutes, type: integer, source: computed, default: 30, description: "HANDOFF_BUFFER_MINUTES constant (30)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ACTIVE | COMPLETED | NO_SHOW | REASSIGNED" }

  - name: OptimizationBacklogItem
    parent: Department
    common_fields: true
    fields:
      - { name: department_id, type: string, source: system, description: "FK -> Department.id; originating department" }
      - { name: ehr_implementation_id, type: string, source: system, description: "FK -> EhrImplementation.id; cross-aggregate program backlink" }
      - { name: title, type: string, source: input, description: "Optimization request title" }
      - { name: effort_points, type: integer, source: input, description: "Estimated effort in points" }
      - { name: requested_epoch, type: integer, source: system, description: "Epoch the item was raised in" }
      - { name: scheduled_epoch, type: integer, source: computed, description: "Epoch the item is scheduled for release" }
      - { name: status, type: enum, source: system, description: "NEW | TRIAGED | SCHEDULED | IN_PROGRESS | RELEASED | REJECTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  - entity: EhrImplementation
    initial_state: PLANNING
    terminal_states: [ARCHIVED]
    shape: posture_driven
    note: |
      readiness_posture is recomputed after every child mutation. While posture is
      ROLLBACK_REQUIRED the only admissible triggers are remediation transitions
      (defect resolve, DECIDE_ROLLBACK, restore-epoch); every forward trigger is
      rejected with ERR_POSTURE_BLOCKS_OPERATION.
    transitions:
      - from: PLANNING
        to: BUILD_IN_PROGRESS
        trigger: "POST /ehr-implementations/{id}/start-build"
        actor: ImplementationDirector
        preconditions:
          - "status == PLANNING"
          - "readiness_posture != ROLLBACK_REQUIRED"
          - "at least one Facility for this program has status SITE_REGISTERED or BUILD_CONFIGURED"
        side_effects:
          - "status -> BUILD_IN_PROGRESS"
          - "recompute readiness_posture"
      - from: BUILD_IN_PROGRESS
        to: VALIDATION_IN_PROGRESS
        trigger: "POST /ehr-implementations/{id}/start-validation"
        actor: ImplementationDirector
        preconditions:
          - "status == BUILD_IN_PROGRESS"
          - "readiness_posture != ROLLBACK_REQUIRED"
          - "every non-ARCHIVED SystemBuildItem for this program has status IN {BUILD_COMPLETE, IN_TESTING, VALIDATION_COMPLETE} (none DRAFT, IN_BUILD or BUILD_REJECTED)"
        side_effects:
          - "status -> VALIDATION_IN_PROGRESS"
          - "recompute readiness_posture"
      - from: VALIDATION_IN_PROGRESS
        to: CUTOVER_READY
        trigger: "POST /ehr-implementations/{id}/finalize-validation"
        actor: ImplementationDirector
        preconditions:
          - "status == VALIDATION_IN_PROGRESS"
          - "readiness_posture == OPEN"
          - "readiness_score >= CUTOVER_READY_SCORE (85.00)"
        side_effects:
          - "status -> CUTOVER_READY"
          - "recompute readiness_posture"
      - from: CUTOVER_READY
        to: GO_LIVE_ACTIVE
        trigger: "POST /ehr-implementations/{id}/execute-go-live"
        actor: ImplementationDirector
        preconditions:
          - "status == CUTOVER_READY"
          - "readiness_posture == OPEN"
          - "the facility's GO_NO_GO_DECISION CutoverTask has status COMPLETE"
        side_effects:
          - "status -> GO_LIVE_ACTIVE"
          - "every Facility with status CUTOVER_READY becomes LIVE and is_live -> true (link 1)"
          - "that Facility mutation in turn triggers each of its Departments with status READY_FOR_GO_LIVE to transition to LIVE (link 2: the Department transition fires because the Facility entered LIVE, not because of the original go-live request — depth-3 transitive cascade EhrImplementation -> Facility -> Department)"
          - "recompute readiness_posture"
      - from: GO_LIVE_ACTIVE
        to: COMMAND_CENTER_ACTIVE
        trigger: "POST /ehr-implementations/{id}/activate-command-center"
        actor: CommandCenterLead
        preconditions:
          - "status == GO_LIVE_ACTIVE"
          - "readiness_posture == OPEN"
          - "at least one StaffingShift for this program has status SCHEDULED and start_utc <= clock"
        side_effects:
          - "status -> COMMAND_CENTER_ACTIVE"
          - "command_center_activated_utc -> clock"
          - "for every Facility of this program with status LIVE or STABILIZATION_AT_RISK: status -> STABILIZED, is_live -> true (the entire department subtree is already LIVE)"
      - from: COMMAND_CENTER_ACTIVE
        to: STABILIZED
        trigger: "system event: every Facility of this program is in a non-pending state (STABILIZED or STABILIZATION_AT_RISK)"
        actor: system
        preconditions:
          - "status == COMMAND_CENTER_ACTIVE"
          - "no Facility of this program has status IN {SITE_REGISTERED, BUILD_CONFIGURED, VALIDATED, CUTOVER_READY, LIVE}"
        side_effects:
          - "status -> STABILIZED"
          - "recompute readiness_posture"
      - from: STABILIZED
        to: POST_LIVE_OPTIMIZATION
        trigger: "POST /ehr-implementations/{id}/begin-optimization"
        actor: ImplementationDirector
        preconditions:
          - "status == STABILIZED"
          - "every Facility of this program has revenue_cycle_stabilization_index >= 80.00"
        side_effects:
          - "status -> POST_LIVE_OPTIMIZATION"
          - "recompute readiness_posture"
      - from: POST_LIVE_OPTIMIZATION
        to: ARCHIVED
        trigger: "POST /ehr-implementations/{id}/archive"
        actor: ImplementationDirector
        preconditions:
          - "status == POST_LIVE_OPTIMIZATION"
        side_effects:
          - "status -> ARCHIVED"

  # ---------------------------------------------------------------------------
  - entity: Facility
    initial_state: SITE_REGISTERED
    terminal_states: [STABILIZED]
    note: "BUILD_CONFIGURED -> REMEDIATION_REQUIRED -> BUILD_CONFIGURED is a cascade terminus; LIVE -> STABILIZATION_AT_RISK is a cyclic revert: a claim denial during command-center monitoring sends the facility backwards for remediation."
    transitions:
      - from: SITE_REGISTERED
        to: BUILD_CONFIGURED
        trigger: "POST /facilities/{id}/configure-build"
        actor: BuildAnalyst
        preconditions:
          - "status == SITE_REGISTERED"
          - "readiness_posture of the owning EhrImplementation == OPEN"
        side_effects:
          - "status -> BUILD_CONFIGURED"
          - "recompute the parent EhrImplementation.readiness_posture"
      - from: BUILD_CONFIGURED
        to: VALIDATED
        trigger: "POST /facilities/{id}/mark-validated"
        actor: ImplementationDirector
        preconditions:
          - "status == BUILD_CONFIGURED"
          - "proficiency_gate_open == true for every Department of this facility"
          - "build_blocking_defect_count == 0 for every Department of this facility"
          - "readiness_posture of the owning EhrImplementation == OPEN"
        side_effects:
          - "status -> VALIDATED"
          - "recompute the parent EhrImplementation.readiness_posture"
      - from: VALIDATED
        to: CUTOVER_READY
        trigger: "POST /facilities/{id}/complete-cutover-dress-rehearsal"
        actor: CutoverLead
        preconditions:
          - "status == VALIDATED"
          - "every CutoverTask of this facility with task_class != GO_NO_GO_DECISION has status IN {COMPLETE, SKIPPED}"
          - "at least one TestScenario with scenario_class CHARGE_CAPTURE_TO_CLAIM for this facility has status PASSED"
        side_effects:
          - "status -> CUTOVER_READY"
          - "recompute the parent EhrImplementation.readiness_posture"
      - from: CUTOVER_READY
        to: LIVE
        trigger: "system event: the owning EhrImplementation enters GO_LIVE_ACTIVE (fired by POST /ehr-implementations/{id}/execute-go-live)"
        actor: system
        preconditions:
          - "status == CUTOVER_READY"
          - "owning EhrImplementation.status == GO_LIVE_ACTIVE"
          - "is_live == false"
        side_effects:
          - "status -> LIVE"
          - "is_live -> true"
      - from: LIVE
        to: STABILIZED
        trigger: "POST /facilities/{id}/stabilize"
        actor: CommandCenterLead
        preconditions:
          - "status == LIVE"
          - "revenue_cycle_stabilization_index >= 80.00"
          - "no PatientOrder of this facility has billing_state CLAIM_DENIED"
        side_effects:
          - "status -> STABILIZED"
          - "recompute the parent EhrImplementation.readiness_posture"
      - from: LIVE
        to: STABILIZATION_AT_RISK
        trigger: "system event: any PatientOrder of this facility enters billing_state CLAIM_DENIED"
        actor: system
        preconditions:
          - "status == LIVE"
          - "at least one PatientOrder of this facility has billing_state CLAIM_DENIED"
        side_effects:
          - "status -> STABILIZATION_AT_RISK"
          - "recompute revenue_cycle_stabilization_index"
          - "recompute the parent EhrImplementation.readiness_posture"
      - from: BUILD_CONFIGURED
        to: REMEDIATION_REQUIRED
        trigger: "system event: any Department of this facility enters status BUILD_REJECTED"
        actor: system
        preconditions:
          - "status == BUILD_CONFIGURED"
          - "at least one Department of this facility has status BUILD_REJECTED"
        side_effects:
          - "status -> REMEDIATION_REQUIRED"
          - "recompute the parent EhrImplementation.readiness_posture"
      - from: REMEDIATION_REQUIRED
        to: BUILD_CONFIGURED
        trigger: "system event: no Department of this facility has status BUILD_REJECTED"
        actor: system
        preconditions:
          - "status == REMEDIATION_REQUIRED"
          - "every Department of this facility has status IN {BUILD_PENDING, BUILD_COMPLETE, TRAINING_IN_PROGRESS, READY_FOR_GO_LIVE, LIVE}"
        side_effects:
          - "status -> BUILD_CONFIGURED"
      - from: STABILIZATION_AT_RISK
        to: LIVE
        trigger: "system event: no PatientOrder of this facility has billing_state CLAIM_DENIED"
        actor: system
        preconditions:
          - "status == STABILIZATION_AT_RISK"
          - "the last PatientOrder of this facility that was in billing_state CLAIM_DENIED is no longer CLAIM_DENIED"
        side_effects:
          - "status -> LIVE"
          - "recompute revenue_cycle_stabilization_index"

  # ---------------------------------------------------------------------------
  - entity: Department
    initial_state: BUILD_PENDING
    terminal_states: [LIVE]
    note: "BUILD_COMPLETE -> BUILD_REJECTED -> BUILD_COMPLETE is a cyclic revision loop driven by test failures."
    transitions:
      - from: BUILD_PENDING
        to: BUILD_COMPLETE
        trigger: "POST /departments/{id}/complete-build"
        actor: BuildAnalyst
        preconditions:
          - "status == BUILD_PENDING"
          - "at least one SystemBuildItem of this department has status IN {BUILD_COMPLETE, IN_TESTING, VALIDATION_COMPLETE}"
        side_effects:
          - "status -> BUILD_COMPLETE"
      - from: BUILD_COMPLETE
        to: TRAINING_IN_PROGRESS
        trigger: "POST /departments/{id}/begin-training"
        actor: TrainingCoordinator
        preconditions:
          - "status == BUILD_COMPLETE"
          - "readiness_posture of the owning EhrImplementation == OPEN"
        side_effects:
          - "status -> TRAINING_IN_PROGRESS"
          - "for every Staff of this department with status IN {REGISTERED, TRAINING_ASSIGNED}: status -> TRAINING_ASSIGNED"
      - from: TRAINING_IN_PROGRESS
        to: READY_FOR_GO_LIVE
        trigger: "POST /departments/{id}/close-proficiency-gate"
        actor: TrainingCoordinator
        preconditions:
          - "status == TRAINING_IN_PROGRESS"
          - "proficiency_gate_open == true"
          - "build_blocking_defect_count == 0"
        side_effects:
          - "status -> READY_FOR_GO_LIVE"
          - "recompute the parent Facility.status via the facility gate clause"
      - from: READY_FOR_GO_LIVE
        to: LIVE
        trigger: "system event: the owning Facility enters status LIVE"
        actor: system
        preconditions:
          - "status == READY_FOR_GO_LIVE"
          - "owning Facility.status == LIVE"
        side_effects:
          - "status -> LIVE"
      - from: TRAINING_IN_PROGRESS
        to: REMEDIATION_REQUIRED
        trigger: "system event: proficiency_cleared_ratio < PROFICIENCY_GATE_PCT after a completed proficiency exam"
        actor: system
        preconditions:
          - "status == TRAINING_IN_PROGRESS"
          - "proficiency_gate_open == false"
        side_effects:
          - "status -> REMEDIATION_REQUIRED"
      - from: BUILD_COMPLETE
        to: BUILD_REJECTED
        trigger: "system event: a SEV1 or SEV2 TestDefect is opened against a SystemBuildItem of this department"
        actor: system
        preconditions:
          - "status == BUILD_COMPLETE"
          - "build_blocking_defect_count > 0"
        side_effects:
          - "status -> BUILD_REJECTED"
          - "the owning Facility, if in BUILD_CONFIGURED, transitions BUILD_CONFIGURED -> REMEDIATION_REQUIRED"
      - from: BUILD_REJECTED
        to: BUILD_COMPLETE
        trigger: "system event: the last blocking TestDefect of this department reaches RESOLVED"
        actor: system
        preconditions:
          - "status == BUILD_REJECTED"
          - "build_blocking_defect_count == 0"
        side_effects:
          - "status -> BUILD_COMPLETE"
          - "recompute the parent Facility.build_blocking_defect_count"

  # ---------------------------------------------------------------------------
  - entity: SystemBuildItem
    initial_state: DRAFT
    terminal_states: [VALIDATION_COMPLETE]
    note: "IN_TESTING -> BUILD_REJECTED -> IN_BUILD -> IN_TESTING is a cyclic revision loop with a distinct side-effect set on each pass."
    transitions:
      - from: DRAFT
        to: IN_BUILD
        trigger: "POST /system-build-items/{id}/start-build"
        actor: BuildAnalyst
        preconditions:
          - "status == DRAFT"
          - "readiness_posture of the owning EhrImplementation == OPEN"
        side_effects:
          - "status -> IN_BUILD"
      - from: IN_BUILD
        to: BUILD_COMPLETE
        trigger: "POST /system-build-items/{id}/complete-build"
        actor: BuildAnalyst
        preconditions:
          - "status == IN_BUILD"
        side_effects:
          - "status -> BUILD_COMPLETE"
          - "customization_risk_points -> build_customization_risk output"
      - from: BUILD_COMPLETE
        to: IN_TESTING
        trigger: "POST /system-build-items/{id}/start-testing"
        actor: TestLead
        preconditions:
          - "status == BUILD_COMPLETE"
        side_effects:
          - "status -> IN_TESTING"
      - from: IN_TESTING
        to: VALIDATION_COMPLETE
        trigger: "POST /system-build-items/{id}/complete-validation"
        actor: TestLead
        preconditions:
          - "status == IN_TESTING"
          - "test_cycles_passed >= 1 (at least one PASSED TestScenario in the current epoch)"
          - "open_defect_count == 0"
        side_effects:
          - "status -> VALIDATION_COMPLETE"
          - "test_cycles_passed -> test_validation_sweep output"
      - from: IN_TESTING
        to: BUILD_REJECTED
        trigger: "system event: any TestScenario of this build item is FAILED"
        actor: system
        preconditions:
          - "status == IN_TESTING"
          - "the last TestScenario of this build item to transition entered status FAILED"
        side_effects:
          - "status -> BUILD_REJECTED"
          - "rejection_count += 1"
          - "recompute Department.build_blocking_defect_count for the owning department"
      - from: BUILD_REJECTED
        to: IN_BUILD
        trigger: "POST /system-build-items/{id}/rework"
        actor: BuildAnalyst
        preconditions:
          - "status == BUILD_REJECTED"
          - "rejection_count <= MAX_REJECTIONS (3)"
        side_effects:
          - "status -> IN_BUILD"
      - from: BUILD_REJECTED
        to: DRAFT
        trigger: "POST /system-build-items/{id}/reset-to-draft"
        actor: BuildAnalyst
        preconditions:
          - "status == BUILD_REJECTED"
          - "rejection_count > MAX_REJECTIONS (3)"
        side_effects:
          - "status -> DRAFT"
          - "rejection_count -> 0"
          - "test_cycles_passed -> 0"

  # ---------------------------------------------------------------------------
  - entity: Staff
    initial_state: REGISTERED
    terminal_states: [CREDENTIALED, PROFICIENCY_FAILED]
    transitions:
      - from: REGISTERED
        to: TRAINING_ASSIGNED
        trigger: "POST /staffs/{id}/training-assignments"
        actor: TrainingCoordinator
        side_effects:
          - "status -> TRAINING_ASSIGNED"
          - "accumulated_training_hours -> staff_certification_readiness output (unchanged until hours accrue)"
      - from: TRAINING_ASSIGNED
        to: TRAINED
        trigger: "system event: every non-WAIVED TrainingAssignment of this staff is COMPLETED"
        actor: system
        side_effects:
          - "status -> TRAINED"
          - "accumulated_training_hours -> staff_certification_readiness output"
      - from: TRAINED
        to: PROFICIENCY_VERIFIED
        trigger: "system event: the staff's ProficiencyExam for the evaluated application reaches COMPLETED_PASS"
        actor: system
        side_effects:
          - "status -> PROFICIENCY_VERIFIED"
          - "recompute the owning Department.proficiency_cleared_ratio"
      - from: PROFICIENCY_VERIFIED
        to: CREDENTIALED
        trigger: "POST /staffs/{id}/issue-credential"
        actor: TrainingCoordinator
        preconditions:
          - "status == PROFICIENCY_VERIFIED"
          - "the staff holds at least one CredentialedTrainer row with status CERTIFIED, OR staff_type == REGISTRATION"
        side_effects:
          - "status -> CREDENTIALED"
      - from: PROFICIENCY_VERIFIED
        to: PROFICIENCY_FAILED
        trigger: "system event: the staff's ProficiencyExam reaches COMPLETED_FAIL while the owning Department is REMEDIATION_REQUIRED"
        actor: system
        side_effects:
          - "status -> PROFICIENCY_FAILED"
          - "recompute the owning Department.proficiency_cleared_ratio"
      - from: PROFICIENCY_FAILED
        to: TRAINING_ASSIGNED
        trigger: "POST /staffs/{id}/reassign-training"
        actor: TrainingCoordinator
        side_effects:
          - "status -> TRAINING_ASSIGNED"
          - "for every TrainingAssignment of this staff with status COMPLETED: status -> IN_PROGRESS"

  # ---------------------------------------------------------------------------
  - entity: TrainingAssignment
    initial_state: ASSIGNED
    terminal_states: [COMPLETED, WAIVED]
    transitions:
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /training-assignments/{id}/log-hours"
        actor: TrainingCoordinator
        preconditions:
          - "status IN {ASSIGNED, IN_PROGRESS}"
          - "hours > 0"
        side_effects:
          - "completed_hours += hours"
          - "completion_pct -> min(100, 100 * completed_hours / required_hours)"
          - "status -> IN_PROGRESS"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /training-assignments/{id}/complete"
        actor: TrainingCoordinator
        preconditions:
          - "status == IN_PROGRESS"
          - "completed_hours >= required_hours"
        side_effects:
          - "status -> COMPLETED"
          - "recompute Staff.accumulated_training_hours via staff_certification_readiness"
      - from: ASSIGNED
        to: OVERDUE
        trigger: "system event: the logical clock passes due_utc while status is ASSIGNED or IN_PROGRESS"
        actor: system
        side_effects:
          - "status -> OVERDUE"
      - from: IN_PROGRESS
        to: OVERDUE
        trigger: "system event: the logical clock passes due_utc while status is ASSIGNED or IN_PROGRESS"
        actor: system
        side_effects:
          - "status -> OVERDUE"
      - from: ASSIGNED
        to: WAIVED
        trigger: "POST /training-assignments/{id}/waive"
        actor: TrainingCoordinator
        preconditions:
          - "status IN {ASSIGNED, IN_PROGRESS, OVERDUE}"
          - "waiver_reason is non-empty"
          - "Staff.accumulated_training_hours >= waiver_reason_min_hours(waiver_reason)"
        side_effects:
          - "status -> WAIVED"
          - "recompute Staff.accumulated_training_hours excluding this row"

  # ---------------------------------------------------------------------------
  - entity: CredentialedTrainer
    initial_state: PENDING_OBSERVATION
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING_OBSERVATION
        to: CERTIFIED
        trigger: "POST /credentialed-trainers/{id}/certify"
        actor: TrainingCoordinator
        preconditions:
          - "status == PENDING_OBSERVATION"
          - "observation_hours >= MIN observation hours for certification_level"
        side_effects:
          - "status -> CERTIFIED"
          - "certified_utc -> clock"
          - "expires_utc -> clock + CERTIFICATION_VALIDITY_DAYS"
      - from: CERTIFIED
        to: EXPIRED
        trigger: "system event: the logical clock reaches expires_utc"
        actor: system
        side_effects:
          - "status -> EXPIRED"
      - from: CERTIFIED
        to: REVOKED
        trigger: "POST /credentialed-trainers/{id}/revoke"
        actor: TrainingCoordinator
        preconditions:
          - "status == CERTIFIED"
        side_effects:
          - "status -> REVOKED"
          - "recompute EhrImplementation.net_trainer_count"
      - from: EXPIRED
        to: CERTIFIED
        trigger: "POST /credentialed-trainers/{id}/recertify"
        actor: TrainingCoordinator
        preconditions:
          - "status == EXPIRED"
          - "observation_hours >= MIN observation hours for certification_level"
        side_effects:
          - "status -> CERTIFIED"
          - "certified_utc -> clock"
          - "expires_utc -> clock + CERTIFICATION_VALIDITY_DAYS"

  # ---------------------------------------------------------------------------
  - entity: ProficiencyExam
    initial_state: SCHEDULED
    terminal_states: [COMPLETED_PASS, COMPLETED_FAIL, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: COMPLETED_PASS
        trigger: "POST /proficiency-exams/{id}/record-result"
        actor: CredentialedTrainer
        preconditions:
          - "status == SCHEDULED"
          - "exam_score >= PASSING_SCORE (80)"
          - "next_attempt_eligible_utc is null or clock >= next_attempt_eligible_utc"
        side_effects:
          - "status -> COMPLETED_PASS"
          - "recompute Staff.status (TRAINED -> PROFICIENCY_VERIFIED)"
          - "recompute the owning Department.proficiency_cleared_ratio"
      - from: SCHEDULED
        to: COMPLETED_FAIL
        trigger: "POST /proficiency-exams/{id}/record-result"
        actor: CredentialedTrainer
        preconditions:
          - "status == SCHEDULED"
          - "exam_score < PASSING_SCORE (80)"
        side_effects:
          - "status -> COMPLETED_FAIL"
          - "next_attempt_eligible_utc -> clock + RETEST_COOLDOWN_HOURS"
          - "recompute the owning Department.proficiency_cleared_ratio"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /proficiency-exams/{id}/mark-no-show"
        actor: CredentialedTrainer
        preconditions:
          - "status == SCHEDULED"
          - "clock > next_attempt_eligible_utc or next_attempt_eligible_utc is null"
          - "Staff.status IN {TRAINED, PROFICIENCY_VERIFIED}"
        side_effects:
          - "status -> NO_SHOW"
          - "next_attempt_eligible_utc -> clock + RETEST_COOLDOWN_HOURS"

  # ---------------------------------------------------------------------------
  - entity: TestScenario
    initial_state: DEFINED
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: DEFINED
        to: PASSED
        trigger: "POST /test-scenarios/{id}/execute"
        actor: TestLead
        preconditions:
          - "status == DEFINED"
          - "outcome == PASS"
          - "executed_epoch == EhrImplementation.current_epoch_index"
        side_effects:
          - "status -> PASSED"
          - "executed_epoch -> supplied epoch"
          - "recompute SystemBuildItem.test_cycles_passed"
      - from: DEFINED
        to: FAILED
        trigger: "POST /test-scenarios/{id}/execute"
        actor: TestLead
        preconditions:
          - "status == DEFINED"
          - "outcome == FAIL"
          - "executed_epoch == EhrImplementation.current_epoch_index"
        side_effects:
          - "status -> FAILED"
          - "executed_epoch -> supplied epoch"
          - "the owning SystemBuildItem transitions IN_TESTING -> BUILD_REJECTED"
      - from: FAILED
        to: DEFINED
        trigger: "POST /test-scenarios/{id}/reset"
        actor: TestLead
        preconditions:
          - "status == FAILED"
        side_effects:
          - "status -> DEFINED"

  # ---------------------------------------------------------------------------
  - entity: TestDefect
    initial_state: OPEN
    terminal_states: [RESOLVED, DEFERRED]
    note: "OPEN -> IN_REMEDIATION -> RESOLVED -> REOPENED -> IN_REMEDIATION is a defect-reopen cycle."
    transitions:
      - from: OPEN
        to: IN_REMEDIATION
        trigger: "POST /test-defects/{id}/begin-remediation"
        actor: BuildAnalyst
        preconditions:
          - "status == OPEN"
        side_effects:
          - "status -> IN_REMEDIATION"
      - from: IN_REMEDIATION
        to: RESOLVED
        trigger: "POST /test-defects/{id}/resolve"
        actor: BuildAnalyst
        preconditions:
          - "status == IN_REMEDIATION"
        side_effects:
          - "status -> RESOLVED"
          - "resolution_epoch -> current_epoch_index"
          - "blocks_go_live -> false"
          - "cascade link 1: TestScenario.open_defect_count -= 1 (the scenario that owns this defect)"
          - "cascade link 2: SystemBuildItem.open_defect_count -= 1 (the build item that owns that scenario)"
          - "cascade link 3: Department.build_blocking_defect_count -= 1 for the owning department when severity IN {SEV1, SEV2}; the department then transitions BUILD_REJECTED -> BUILD_COMPLETE once the count reaches 0"
          - "cascade link 4: the owning Facility, if in REMEDIATION_REQUIRED and no Department of it remains BUILD_REJECTED, transitions REMEDIATION_REQUIRED -> BUILD_CONFIGURED"
      - from: IN_REMEDIATION
        to: DEFERRED
        trigger: "POST /test-defects/{id}/defer"
        actor: TestLead
        preconditions:
          - "status == IN_REMEDIATION"
          - "severity IN {SEV3, SEV4}"
        side_effects:
          - "status -> DEFERRED"
      - from: RESOLVED
        to: REOPENED
        trigger: "POST /test-defects/{id}/reopen"
        actor: TestLead
        preconditions:
          - "status == RESOLVED"
          - "resolution_epoch == current_epoch_index"
          - "attempt_count < MAX_REOPEN_ATTEMPTS (3)"
        side_effects:
          - "status -> REOPENED"
          - "blocks_go_live -> true"
      - from: REOPENED
        to: IN_REMEDIATION
        trigger: "POST /test-defects/{id}/begin-remediation"
        actor: BuildAnalyst
        preconditions:
          - "status == REOPENED"
        side_effects:
          - "status -> IN_REMEDIATION"

  # ---------------------------------------------------------------------------
  - entity: DataConversionBatch
    initial_state: STAGED
    terminal_states: [RECONCILED, FAILED, ROLLED_BACK]
    transitions:
      - from: STAGED
        to: VALIDATING
        trigger: "POST /data-conversion-batches/{id}/begin-validation"
        actor: ConversionAnalyst
        preconditions:
          - "status == STAGED"
          - "attempt_epoch == current_epoch_index"
        side_effects:
          - "status -> VALIDATING"
          - "variance_count -> abs(source_count - reconciled_count)"
      - from: VALIDATING
        to: LOADED
        trigger: "POST /data-conversion-batches/{id}/load"
        actor: ConversionAnalyst
        preconditions:
          - "status == VALIDATING"
          - "conversion_reconciliation_variance(source_count, reconciled_count, payload_class) <= MAX_VARIANCE_PCT (2.00)"
        side_effects:
          - "status -> LOADED"
          - "if payload_class == PATIENT_DEMOGRAPHICS: Facility.converted_patient_count += reconciled_count"
          - "if payload_class == BALANCES: applied_balance_cents -> reconciled_count"
      - from: VALIDATING
        to: FAILED
        trigger: "system event: conversion_reconciliation_variance > MAX_VARIANCE_PCT (2.00)"
        actor: system
        side_effects:
          - "status -> FAILED"
      - from: LOADED
        to: RECONCILED
        trigger: "POST /data-conversion-batches/{id}/reconcile"
        actor: ConversionAnalyst
        preconditions:
          - "status == LOADED"
          - "reconciled_count == source_count"
        side_effects:
          - "status -> RECONCILED"
          - "recompute Facility.conversion_variance_index"
      - from: LOADED
        to: ROLLED_BACK
        trigger: "POST /data-conversion-batches/{id}/rollback"
        actor: ConversionAnalyst
        preconditions:
          - "status IN {LOADED, RECONCILED}"
        side_effects:
          - "status -> ROLLED_BACK"
          - "Facility.converted_patient_count -= reconciled_count (converted_patient_count preserved across a load/rollback pair)"
          - "if payload_class == BALANCES: PatientOrder balance_cents reverted by applied_balance_cents"

  # ---------------------------------------------------------------------------
  - entity: PatientOrder
    initial_state: CONVERTED
    terminal_states: [RECONCILED]
    note: "Parallel dimensions: clinical_state and billing_state advance independently on the same row."
    transitions:
      - from: CONVERTED
        to: RECONCILED
        trigger: "POST /patient-orders/{id}/reconcile"
        actor: CutoverLead
        preconditions:
          - "clinical_state == CONVERTED"
          - "paper_backfill_count == 0"
        side_effects:
          - "clinical_state -> RECONCILED"
          - "final_charge_cents -> charge_capture_reconciliation output"
          - "charge_variance_cents -> final_charge_cents - provisional_charge_cents"
          - "EhrImplementation.order_reconciliation_balance += 1"
      - from: CONVERTED
        to: PAPER_BACKFILL_REQUIRED
        trigger: "system event: the owning Facility enters status LIVE while billing_state == UNPOSTED and the order was placed during the downtime window"
        actor: system
        side_effects:
          - "clinical_state -> PAPER_BACKFILL_REQUIRED"
      - from: PAPER_BACKFILL_REQUIRED
        to: RECONCILED
        trigger: "POST /patient-orders/{id}/backfill-paper-order"
        actor: OrderReconciler
        preconditions:
          - "clinical_state == PAPER_BACKFILL_REQUIRED"
        side_effects:
          - "clinical_state -> RECONCILED"
          - "paper_backfill_count += 1"
          - "EhrImplementation.order_reconciliation_balance -= 1"
      - from: CONVERTED
        to: RECONCILED
        trigger: "POST /patient-orders/{id}/reconcile"
        actor: OrderReconciler
        preconditions:
          - "clinical_state == CONVERTED"
          - "paper_backfill_count >= 1"
        side_effects:
          - "clinical_state -> RECONCILED"
          - "EhrImplementation.order_reconciliation_balance += 1"

  - entity: PatientOrder
    initial_state: UNPOSTED
    dimension: billing_state
    terminal_states: [CLAIM_PAID]
    transitions:
      - from: UNPOSTED
        to: CHARGE_POSTED
        trigger: "POST /patient-orders/{id}/post-charge"
        actor: RevenueCycleAnalyst
        preconditions:
          - "billing_state == UNPOSTED"
          - "clinical_state IN {CONVERTED, RECONCILED}"
        side_effects:
          - "billing_state -> CHARGE_POSTED"
          - "final_charge_cents -> charge_capture_reconciliation output"
      - from: CHARGE_POSTED
        to: CLAIM_SUBMITTED
        trigger: "POST /patient-orders/{id}/submit-claim"
        actor: RevenueCycleAnalyst
        preconditions:
          - "billing_state == CHARGE_POSTED"
          - "clinical_state == RECONCILED"
        side_effects:
          - "billing_state -> CLAIM_SUBMITTED"
          - "recompute the owning Facility.revenue_cycle_stabilization_index"
      - from: CLAIM_SUBMITTED
        to: CLAIM_ACCEPTED
        trigger: "POST /patient-orders/{id}/record-claim-response"
        actor: RevenueCycleAnalyst
        preconditions:
          - "billing_state == CLAIM_SUBMITTED"
          - "claim_response == ACCEPTED"
        side_effects:
          - "billing_state -> CLAIM_ACCEPTED"
      - from: CLAIM_SUBMITTED
        to: CLAIM_DENIED
        trigger: "POST /patient-orders/{id}/record-claim-response"
        actor: RevenueCycleAnalyst
        preconditions:
          - "billing_state == CLAIM_SUBMITTED"
          - "claim_response == DENIED"
        side_effects:
          - "billing_state -> CLAIM_DENIED"
          - "recompute the owning Facility.revenue_cycle_stabilization_index"
          - "the owning Facility transitions LIVE -> STABILIZATION_AT_RISK"
      - from: CLAIM_ACCEPTED
        to: CLAIM_PAID
        trigger: "POST /patient-orders/{id}/record-claim-response"
        actor: RevenueCycleAnalyst
        preconditions:
          - "billing_state == CLAIM_ACCEPTED"
          - "claim_response == PAID"
        side_effects:
          - "billing_state -> CLAIM_PAID"
      - from: CLAIM_DENIED
        to: CHARGE_POSTED
        trigger: "POST /patient-orders/{id}/reopen-claim"
        actor: RevenueCycleAnalyst
        preconditions:
          - "billing_state == CLAIM_DENIED"
        side_effects:
          - "billing_state -> CHARGE_POSTED"

  # ---------------------------------------------------------------------------
  - entity: InterfaceChannel
    initial_state: DEFINED
    terminal_states: [VALIDATED]
    note: "IN_MESSAGE_VALIDATION -> VALIDATION_FAILED -> BUILDING -> IN_MESSAGE_VALIDATION is a validation rework cycle."
    transitions:
      - from: DEFINED
        to: BUILDING
        trigger: "POST /interface-channels/{id}/begin-build"
        actor: InterfaceEngineer
        side_effects:
          - "status -> BUILDING"
      - from: BUILDING
        to: IN_MESSAGE_VALIDATION
        trigger: "POST /interface-channels/{id}/begin-validation"
        actor: InterfaceEngineer
        side_effects:
          - "status -> IN_MESSAGE_VALIDATION"
      - from: IN_MESSAGE_VALIDATION
        to: VALIDATED
        trigger: "POST /interface-channels/{id}/complete-validation"
        actor: InterfaceEngineer
        preconditions:
          - "status == IN_MESSAGE_VALIDATION"
          - "the channel's messages have interface_message_validation_pass_rate >= MIN_PASS_RATE (95.00)"
        side_effects:
          - "status -> VALIDATED"
      - from: IN_MESSAGE_VALIDATION
        to: VALIDATION_FAILED
        trigger: "system event: an InterfaceMessage enters validation_status REJECTED"
        actor: system
        side_effects:
          - "status -> VALIDATION_FAILED"
          - "rejected_message_count += 1"
      - from: VALIDATION_FAILED
        to: BUILDING
        trigger: "POST /interface-channels/{id}/return-to-build"
        actor: InterfaceEngineer
        preconditions:
          - "status == VALIDATION_FAILED"
        side_effects:
          - "status -> BUILDING"
          - "validated_message_count -> 0"
          - "rejected_message_count -> 0"

  # ---------------------------------------------------------------------------
  - entity: InterfaceMessage
    initial_state: RECEIVED
    terminal_states: [VALIDATED, REJECTED]
    transitions:
      - from: RECEIVED
        to: VALIDATED
        trigger: "POST /interface-messages/{id}/validate"
        actor: InterfaceEngineer
        preconditions:
          - "validation_status == RECEIVED"
          - "message_code is a member of VALID_MESSAGE_CODES for the owning channel_type"
          - "latency_minutes <= owning InterfaceChannel.max_latency_minutes"
        side_effects:
          - "validation_status -> VALIDATED"
          - "recompute InterfaceChannel.validated_message_count"
      - from: RECEIVED
        to: REJECTED
        trigger: "system event: message_code invalid for the channel_type, or latency_minutes > max_latency_minutes"
        actor: system
        side_effects:
          - "validation_status -> REJECTED"
          - "validation_error_code -> ERR_INTERFACE_MESSAGE_INVALID or ERR_INTERFACE_LATENCY_EXCEEDED"
          - "recompute InterfaceChannel.rejected_message_count"
          - "if the owning InterfaceChannel is IN_MESSAGE_VALIDATION: channel -> VALIDATION_FAILED (depth-2 link of the message-rejection cascade)"

  # ---------------------------------------------------------------------------
  - entity: CutoverTask
    initial_state: PLANNED
    terminal_states: [COMPLETE, SKIPPED]
    transitions:
      - from: PLANNED
        to: IN_PROGRESS
        trigger: "POST /cutover-tasks/{id}/start"
        actor: CutoverLead
        preconditions:
          - "status == PLANNED"
          - "the cutover plan's preceding step (highest sequence_index < this one) is COMPLETE or SKIPPED"
        side_effects:
          - "status -> IN_PROGRESS"
      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "POST /cutover-tasks/{id}/complete"
        actor: CutoverLead
        preconditions:
          - "status == IN_PROGRESS"
        side_effects:
          - "status -> COMPLETE"
      - from: PLANNED
        to: SKIPPED
        trigger: "POST /cutover-tasks/{id}/skip"
        actor: CutoverLead
        preconditions:
          - "status == PLANNED"
          - "task_class IN {DOWNTIME_PREP, DRESS_REHEARSAL}"
        side_effects:
          - "status -> SKIPPED"
      - from: IN_PROGRESS
        to: BLOCKED
        trigger: "POST /cutover-tasks/{id}/block"
        actor: CutoverLead
        preconditions:
          - "status == IN_PROGRESS"
          - "block_reason is non-empty"
        side_effects:
          - "status -> BLOCKED"
      - from: BLOCKED
        to: IN_PROGRESS
        trigger: "POST /cutover-tasks/{id}/unblock"
        actor: CutoverLead
        preconditions:
          - "status == BLOCKED"
        side_effects:
          - "status -> IN_PROGRESS"

  # ---------------------------------------------------------------------------
  - entity: CommandCenterTicket
    initial_state: REPORTED
    terminal_states: [RESOLVED]
    transitions:
      - from: REPORTED
        to: TRIAGED
        trigger: "POST /command-center-tickets/{id}/triage"
        actor: TriageCommander
        preconditions:
          - "triage_state == REPORTED"
        side_effects:
          - "triage_state -> TRIAGED"
          - "if the linked TestDefect exists and blocks_go_live == true: linked TestDefect -> REOPENED"
      - from: TRIAGED
        to: IN_RESOLUTION
        trigger: "POST /command-center-tickets/{id}/begin-resolution"
        actor: TriageCommander
        preconditions:
          - "triage_state == TRIAGED"
        side_effects:
          - "triage_state -> IN_RESOLUTION"
      - from: TRIAGED
        to: ESCALATED
        trigger: "system event: severity IN {SEV1, SEV2} and the logical clock passes reported_utc + command_center_escalation_minutes"
        actor: system
        side_effects:
          - "triage_state -> ESCALATED"
      - from: IN_RESOLUTION
        to: ESCALATED
        trigger: "system event: the logical clock passes reported_utc + command_center_escalation_minutes"
        actor: system
        side_effects:
          - "triage_state -> ESCALATED"
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /command-center-tickets/{id}/resolve"
        actor: TriageCommander
        preconditions:
          - "triage_state == ESCALATED"
        side_effects:
          - "triage_state -> RESOLVED"
      - from: IN_RESOLUTION
        to: RESOLVED
        trigger: "POST /command-center-tickets/{id}/resolve"
        actor: TriageCommander
        preconditions:
          - "triage_state == IN_RESOLUTION"
        side_effects:
          - "triage_state -> RESOLVED"

  - entity: StaffingShift
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, REASSIGNED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /staffing-shifts/{id}/activate"
        actor: CommandCenterLead
        preconditions:
          - "status == SCHEDULED"
          - "clock >= start_utc"
          - "Staff.status == CREDENTIALED"
        side_effects:
          - "status -> ACTIVE"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /staffing-shifts/{id}/complete"
        actor: CommandCenterLead
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "status -> COMPLETED"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "system event: the logical clock passes start_utc + HANDOFF_BUFFER_MINUTES while status is still SCHEDULED"
        actor: system
        side_effects:
          - "status -> NO_SHOW"
          - "the owning facility's AT_THE_ELBOW coverage gap opens"
      - from: SCHEDULED
        to: REASSIGNED
        trigger: "POST /staffing-shifts/{id}/reassign"
        actor: CommandCenterLead
        preconditions:
          - "status == SCHEDULED"
          - "clock < start_utc"
        side_effects:
          - "status -> REASSIGNED"

  - entity: OptimizationBacklogItem
    initial_state: NEW
    terminal_states: [RELEASED, REJECTED]
    transitions:
      - from: NEW
        to: TRIAGED
        trigger: "POST /optimization-backlog-items/{id}/triage"
        actor: OptimizationLead
        side_effects:
          - "status -> TRIAGED"
      - from: TRIAGED
        to: SCHEDULED
        trigger: "POST /optimization-backlog-items/{id}/schedule"
        actor: OptimizationLead
        preconditions:
          - "status == TRIAGED"
          - "the release_capacity_constraint for the target epoch is not exceeded"
        side_effects:
          - "status -> SCHEDULED"
          - "scheduled_epoch -> optimization_release_allocation output"
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /optimization-backlog-items/{id}/start"
        actor: OptimizationLead
        side_effects:
          - "status -> IN_PROGRESS"
      - from: IN_PROGRESS
        to: RELEASED
        trigger: "POST /optimization-backlog-items/{id}/release"
        actor: OptimizationLead
        preconditions:
          - "status == IN_PROGRESS"
          - "current_epoch_index >= scheduled_epoch"
        side_effects:
          - "status -> RELEASED"
      - from: TRIAGED
        to: REJECTED
        trigger: "POST /optimization-backlog-items/{id}/reject"
        actor: OptimizationLead
        side_effects:
          - "status -> REJECTED"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only — resolved via OCC on parent.version)
# =============================================================================
concurrency_rules:
  - rule_id: conversion-load-stale-facility
    parent_entity: Facility
    write_endpoint: "POST /facilities/{id}/data-conversion-batches"
    occ_field: "expected_facility_version"
    description: |
      Creating a DataConversionBatch against a Facility whose version has advanced
      since the client last observed it is rejected with ERR_STALE_VERSION. This
      captures the legitimate supersede case where a prior batch load has already
      moved Facility.converted_patient_count and the current writer's view of the
      facility is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: shift-create-stale-staff
    parent_entity: Staff
    write_endpoint: "POST /staffs/{id}/credentialed-trainers"
    occ_field: "expected_staff_version"
    description: |
      Creating a CredentialedTrainer row for a Staff member whose version has
      advanced since the client last observed it is rejected with
      ERR_STALE_VERSION. A prior certification or proficiency write legitimately
      changes the staffer's readiness, so the client's carried version is stale and
      the new trainer certification must be re-evaluated against fresh state.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: optimization-schedule-stale-program
    parent_entity: EhrImplementation
    write_endpoint: "POST /optimization-backlog-items"
    occ_field: "expected_ehr_implementation_version"
    description: |
      Creating an OptimizationBacklogItem against an EhrImplementation whose
      version has advanced since the client last observed it is rejected with
      ERR_STALE_VERSION. Epoch advances and department tree mutations legitimately
      change the program between reads, so the stale client view must re-read before
      scheduling optimization work.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: readiness_posture_score
    trigger: "recomputed on every child mutation and on every transition that names it; read on every GET of an EhrImplementation"
    algorithm: weighted_scoring
    formula: |
      # Stage A — filter: defects with status IN {RESOLVED, DEFERRED} are excluded.
      # Stage B — group by the owning SystemBuildItem.department_id; the department's
      #   contribution is the MAX severity in the department, not the sum:
      dept_penalty = MAX over open defects d in dept:
                       SEV1 -> 40 | SEV2 -> 25 | SEV3 -> 10 | SEV4 -> 3          (0 if none)
      # Stage C — when stage B is used (pessimistic base), the department term is
      #   additive; the per-interface term below replaces it entirely when nonzero.
      interchannel_penalty = 15 if (rejected_message_count >= 25) else 0
      readiness_score = clamp(100 - SUM(department_penalties) - interchannel_penalty, 0.00, 100.00)
      # Stage D — the channel term is a replacement, not an addition: when
      #   interchannel_penalty > 0 the per-department stage-B penalties are dropped
      #   and only the single 15-point channel penalty applies.
      readiness_posture = OPEN        if readiness_score >= 60.00
                        | RESTRICTED  if 40.00 <= readiness_score < 60.00
                        | ROLLBACK_REQUIRED if readiness_score < 40.00
    input_set: "All non-ARCHIVED EhrImplementation rows; defects in status IN {OPEN, IN_REMEDIATION, REOPENED} only"
    constants:
      SEV1_PENALTY: 40
      SEV2_PENALTY: 25
      SEV3_PENALTY: 10
      SEV4_PENALTY: 3
      INTERCHANNEL_PENALTY: 15
      INTERCHANNEL_REJECT_THRESHOLD: 25
      OPEN_POSTURE_MIN: 60.00
      RESTRICTED_POSTURE_MIN: 40.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: optimistic
        when: "read on GET /ehr-implementations/{id}?posture_view=OPTIMISTIC, i.e. the optimistic_readiness_score field"
        difference: |
          Identical inputs; a defect whose SystemBuildItem is mid-remediation
          (status BUILD_REJECTED) contributes min(its severity penalty, 5) instead
          of the full severity penalty. Every other status contributes the full
          penalty. This variant therefore yields a strictly higher score than the
          pessimistic base for identical data whenever any build item is in
          BUILD_REJECTED.

  - name: build_customization_risk
    trigger: "computed on the SystemBuildItem.IN_BUILD_to_BUILD_COMPLETE transition"
    algorithm: threshold
    formula: |
      # Step 1 — unit count from locally customized fields:
      unit_count = length(SET(local_custom_fields))          # dedupe by name
      # Step 2 — marginal-tier allocation over the FIRST 12 units only:
      #   units 1..4   -> 2 points each
      #   units 5..8   -> 3 points each
      #   units 9..12  -> 5 points each
      #   units >12 are NOT counted (cap at unit 12).
      billable_units = min(unit_count, 12)
      tier_points = 2*min(billable_units,4) + 3*max(0,min(billable_units,8)-4) + 5*max(0,billable_units-8)
      # Step 3 — classification weight applied AFTER the tier sum:
      class_weight = { FOUNDATION_ADOPTED: 1.0, FOUNDATION_ADAPTED: 1.5, LOCAL_CUSTOM: 2.0 }
      risk_raw = tier_points * class_weight[build_classification]
      # Step 4 — depth multiplier applied AFTER the weight:
      depth_multiplier = 1 + (customization_depth - 1) * 0.15      # 0 if customization_depth <= 1
      risk_raw = risk_raw * depth_multiplier
      # Step 5 — rounding occurs ONCE, at the end, round_half_up to 2 dp:
      customization_risk_points = round_half_up(risk_raw, 2)      # float, 2 dp
    input_set: "One SystemBuildItem at the moment its build is completed"
    constants:
      TIER1_UNITS: 4
      TIER1_POINTS: 2
      TIER2_UNITS: 4
      TIER2_POINTS: 3
      TIER3_POINTS: 5
      UNIT_CAP: 12
      DEPTH_STEP: 0.15
    precision: "2 decimal places, round_half_up; rounding applied once at the end"
    variants:
      - name: summed_then_rounded
        when: "the legacy migration path re-scores a batch of build items in one pass"
        difference: |
          The per-item risk is summed first and the sum is rounded once, rather than
          rounding each item then summing. For a batch of identical items this
          yields a total that can differ by up to 0.01 * (n-1) cents from the
          per-item-rounded rollup.

  - name: charge_capture_reconciliation
    trigger: "computed on PatientOrder clinical_state CONVERTED changes and on billing_state UNPOSTED/CLAIM_DENIED to CHARGE_POSTED"
    algorithm: forward_looking
    formula: |
      # Rounding order is pinned: each line item is rounded to 2 dp FIRST, then
      # summed (the "round-per-line-then-sum" order). Summing first and rounding
      # once would change the cents whenever any line has a half-cent residue.
      lines = [ { amount_cents: legacy_charge_cents, category: "BASE" } ]
      CASE order_type:
        LAB:        lines += [{ amount_cents: legacy_charge_cents * 0.050, category: "PROCESSING" }]
        IMAGING:    lines += [{ amount_cents: legacy_charge_cents * 0.125, category: "TECH"       },
                              { amount_cents: legacy_charge_cents * 0.075, category: "CONTRAST"   }]
        MEDICATION: lines += [{ amount_cents: legacy_charge_cents * 0.030, category: "DISPENSING" }]
        PROCEDURE:  lines += [{ amount_cents: legacy_charge_cents * 0.200, category: "OR"         },
                              { amount_cents: legacy_charge_cents * 0.050, category: "ANESTHESIA" }]
      # per-line rounding FIRST (round-per-line-then-sum order is pinned):
      rounded_lines = [ round_half_up(l.amount_cents, 2) for l in lines ]
      subtotal = SUM(rounded_lines)
      # the charge-capture OR gap is a FINAL-variant-only line, computed from the
      # unrounded subtotal then rounded once:
      if order_type == PROCEDURE and variant == final:
          charge_gap = round_half_up(SUM(lines.amount_cents) * PROCEDURE_GAP_RATE, 2)
      else:
          charge_gap = 0.00
      provisional_charge_cents = round_half_up(subtotal, 2)
      final_charge_cents      = round_half_up(provisional_charge_cents + charge_gap, 2)
    input_set: "One PatientOrder; provisional variant is computed at conversion, final variant is frozen at reconciliation"
    constants:
      LAB_PROCESSING_RATE: 0.050
      IMAGING_TECH_RATE: 0.125
      IMAGING_CONTRAST_RATE: 0.075
      MEDICATION_DISPENSING_RATE: 0.030
      PROCEDURE_OR_RATE: 0.200
      PROCEDURE_ANESTHESIA_RATE: 0.050
      PROCEDURE_GAP_RATE: 0.030
    precision: "2 decimal places, round_half_up; per-line rounding order pinned above"
    variants:
      - name: provisional_vs_final
        when: "provisional is published while clinical_state == CONVERTED; final replaces it at clinical_state == RECONCILED"
        difference: |
          For identical legacy_charge_cents and order_type the two variants differ
          whenever PROCEDURE_MULTIPLIER > 1.00 or the per-line rounding residue is
          nonzero: provisional omits charge_gap, final includes it. charge_variance_cents
          = final_charge_cents - provisional_charge_cents.

  - name: conversion_reconciliation_variance
    trigger: "computed on DataConversionBatch VALIDATING and read on DataConversionBatch load"
    algorithm: aggregation
    formula: |
      variance_count = abs(source_count - reconciled_count)
      variance_penalty_points = round_half_up(100.00 * variance_count / source_count, 2)
      # Guard: source_count == 0 -> variance_penalty_points = 100.00
      #        variance_count == 0   -> variance_penalty_points = 0.00  (empty set is clean)
      classification_max_pct = { PATIENT_DEMOGRAPHICS: 1.00, APPOINTMENTS: 1.50, ORDERS: 2.00, BALANCES: 0.50 }
      variance_exceeds = variance_penalty_points > classification_max_pct[payload_class]   # strict >
    input_set: "One DataConversionBatch; source_count and reconciled_count are both integers"
    constants:
      PATIENT_DEMOGRAPHICS_MAX_PCT: 1.00
      APPOINTMENTS_MAX_PCT: 1.50
      ORDERS_MAX_PCT: 2.00
      BALANCES_MAX_PCT: 0.50
    precision: "2 decimal places, round_half_up"
    variants:
      - name: strict_threshold_vs_inclusive
        when: "the load gate uses strict >; the dashboard 'at limit' badge uses >="
        difference: |
          A batch whose variance_penalty_points exactly equals its classification cap
          loads successfully (strict >) while the dashboard marks it at-limit. The two
          readings agree on every other value.

  - name: command_center_sla_minutes
    trigger: "computed when a CommandCenterTicket is created"
    algorithm: weighted_scoring
    formula: |
      # (a) severity weight:
      sev_weight = { SEV1: 0.25, SEV2: 0.50, SEV3: 1.00, SEV4: 2.00 }[severity]
      # (b) zone modifier by at_the_elbow_zone:
      zone_modifier = { "ED": 0.80, "OR": 0.70, "ICU": 0.75, "MED_SURG": 1.00, "RADIOLOGY": 1.10, "PHARMACY": 1.05 }[at_the_elbow_zone]
      # (c) coverage modifier: number of StaffingShift rows at the ticket's facility with
      #     support_role AT_THE_ELBOW, status IN {SCHEDULED, ACTIVE} and end_utc > clock:
      coverage_modifier = 0.50 if coverage_count == 0 else 1.00
      base_sla_minutes = 60
      resolution_sla_minutes = round_half_up(base_sla_minutes * sev_weight * zone_modifier * coverage_modifier, 0)
    input_set: "One CommandCenterTicket in triage_state REPORTED"
    constants:
      BASE_SLA_MINUTES: 60
      SEV1_WEIGHT: 0.25
      SEV2_WEIGHT: 0.50
      SEV3_WEIGHT: 1.00
      SEV4_WEIGHT: 2.00
      UNCOVERED_MODIFIER: 0.50
      ED_MODIFIER: 0.80
      OR_MODIFIER: 0.70
      ICU_MODIFIER: 0.75
      MED_SURG_MODIFIER: 1.00
      RADIOLOGY_MODIFIER: 1.10
      PHARMACY_MODIFIER: 1.05
    precision: "0 decimal places, round_half_up"

  - name: proficiency_gate_ratio
    trigger: "computed on every ProficiencyExam result and on every Staff status change in a department"
    algorithm: aggregation
    formula: |
      # Input set: Staff rows of the department with status IN {PROFICIENCY_VERIFIED, CREDENTIALED}.
      #   Staff with status IN {REGISTERED, TRAINING_ASSIGNED, TRAINED, PROFICIENCY_FAILED}
      #   contribute 0 to the numerator but still count in the denominator.
      proficiency_cleared_count = COUNT(Staff where department == D and status IN {PROFICIENCY_VERIFIED, CREDENTIALED})
      proficiency_cleared_ratio = round_half_up(100.00 * proficiency_cleared_count / required_staff_count, 2)
      # Guard: required_staff_count == 0 -> ratio = 100.00 and the gate is open.
      proficiency_gate_open = proficiency_cleared_ratio >= PROFICIENCY_GATE_PCT          # inclusive >=
    input_set: "One Department"
    constants:
      PROFICIENCY_GATE_PCT: 80.00
    precision: "2 decimal places, round_half_up"

  - name: staff_certification_readiness
    trigger: "computed on every TrainingAssignment completion, waiver, or reassignment"
    algorithm: aggregation
    formula: |
      # Input set: TrainingAssignment rows of the staff with status IN {IN_PROGRESS, COMPLETED}.
      #   Rows with status IN {ASSIGNED, OVERDUE, WAIVED} are EXCLUDED from the sum.
      accumulated_training_hours = SUM(completed_hours for rows with status IN {IN_PROGRESS, COMPLETED})
      certification_ready = (accumulated_training_hours >= CERT_MIN_HOURS) AND (all non-WAIVED assignments are COMPLETED)
    input_set: "One Staff"
    constants:
      CERT_MIN_HOURS: 40
    precision: "2 decimal places, round_half_up"
    variants:
      - name: remaining_hours_inclusive
        when: "the training dashboard's 'hours remaining' projection"
        difference: |
          The dashboard divides by the count of non-WAIVED assignments including
          OVERDUE rows, whereas accumulated_training_hours excludes OVERDUE rows from
          its sum; the two agree only when no assignment is OVERDUE.

  - name: test_validation_sweep
    trigger: "computed on SystemBuildItem IN_TESTING and refresh-epoch"
    algorithm: aggregation
    formula: |
      # Input set: TestScenario rows in executed_epoch == EhrImplementation.current_epoch_index.
      #   Scenarios still in status DEFINED are excluded from both numerator and denominator.
      passing = COUNT(scenarios where status == PASSED)
      run = COUNT(scenarios where status IN {PASSED, FAILED})
      test_cycles_passed = passing
      # required_cycles_for_classification is a MINIMUM, not an equality:
      required_cycles_for_classification = { UNIT: 3, INTEGRATED: 2, CHARGE_CAPTURE_TO_CLAIM: 1 }[scenario_class]
      cycle_requirement_met = test_cycles_passed >= required_cycles_for_classification
    input_set: "One SystemBuildItem's scenarios for the current epoch"
    constants:
      UNIT_MIN_CYCLES: 3
      INTEGRATED_MIN_CYCLES: 2
      CHARGE_CAPTURE_MIN_CYCLES: 1
    precision: "integer count"

  - name: order_reconciliation_balance
    trigger: "computed on PatientOrder reconcile, backfill-paper-order, and rollback transitions"
    algorithm: aggregation
    formula: |
      # Conserved quantity across the forward reconcile action and its compensating
      # backfill action.
      #   forward (baseline): reconcile an EHR order      -> reconciled_ehr_order_count += 1, balance += 1
      #   compensate:         backfill a paper order slip -> paper_backfill_order_count += 1, balance -= 1
      # A reconcile paired with a matching backfill-paper-order must leave the
      # EhrImplementation's order_reconciliation_balance unchanged: the compensating
      # slip credits back exactly the unit the reconciliation debited.
      order_reconciliation_balance = reconciled_ehr_order_count - paper_backfill_order_count
      invariant_check: order_reconciliation_balance(before) == order_reconciliation_balance(after) after (reconcile + backfill) pair
    input_set: "All PatientOrder rows of the program"
    constants:
      MIN_RECONCILED_ORDER_COUNT: 350
    precision: "integer count"
    variants:
      - name: paper_inclusive_reconcile
        when: "the downtime reconciliation report counts paper slips as reconciled orders"
        difference: |
          The report's reconciled count includes paper_backfill_count rows while the
          ledger's order_reconciliation_balance subtracts them; the two agree only when
          paper_backfill_count == 0 across the program.

  - name: interface_message_validation_pass_rate
    trigger: "computed on InterfaceMessage validation and read on channel validation completion"
    algorithm: aggregation
    formula: |
      # Input set: InterfaceMessage rows of the channel in the current epoch.
      #   Rows with validation_status RECEIVED are excluded.
      decided = validated_message_count + rejected_message_count
      pass_rate = round_half_up(100.00 * validated_message_count / decided, 2)
      # Guard: decided == 0 -> pass_rate = 0.00 (empty set is NOT a pass)
      validation_passes = pass_rate >= MIN_PASS_RATE (95.00)                                # inclusive >=
    input_set: "One InterfaceChannel's messages for the current epoch"
    constants:
      MIN_PASS_RATE: 95.00
    precision: "2 decimal places, round_half_up"

  - name: revenue_cycle_stabilization_index
    trigger: "recomputed on every PatientOrder billing_state change"
    algorithm: weighted_scoring
    formula: |
      # Input set: PatientOrder rows of the facility with clinical_state IN {CONVERTED, RECONCILED}.
      # (a) days-in-AR factor from the logical clock against the order's encounter_utc:
      ar_days = (clock - encounter_utc) in days
      ar_factor = { <=7: 100, 8..14: 80, 15..30: 50, >30: 20 }[ar_days]
      # (b) denial factor:
      denial_factor = 0 if any order has billing_state == CLAIM_DENIED
                    | 100 otherwise
      revenue_cycle_stabilization_index = round_half_up((0.60 * ar_factor) + (0.40 * denial_factor), 2)
    input_set: "One Facility with at least one PatientOrder whose clinical_state IN {CONVERTED, RECONCILED}"
    constants:
      AR_WEIGHT: 0.60
      DENIAL_WEIGHT: 0.40
      STABILIZATION_TARGET: 80.00
    precision: "2 decimal places, round_half_up"

  - name: optimization_release_allocation
    trigger: "computed on OptimizationBacklogItem scheduling"
    algorithm: waterfall_allocation
    formula: |
      # Per epoch release capacity, filled in priority order:
      #   priority order: items with status TRIAGED, sorted by effort_points ASC,
      #   tie-break: requested_epoch ASC, final tie-break: created_at ASC.
      # Allocate the epoch's free capacity to the head of that queue first.
      epoch_capacity_points = 30
      consumed_points = SUM(effort_points of items already SCHEDULED for the target epoch)
      remaining = epoch_capacity_points - consumed_points
      # An item whose effort exceeds a whole epoch's capacity can never be scheduled
      # (ERR_RELEASE_CAPACITY_EXCEEDED at priority 23).
      # Otherwise it is schedulable iff effort_points <= remaining (strictly greater
      # overflows to the NEXT epoch).
      scheduled_epoch = requested_epoch               if effort_points <= remaining
                      | requested_epoch + 1           otherwise
      # Rounding remainder: nothing rounds; points are integers and unallocated capacity
      # is simply carried forward as unfilled.
    input_set: "OptimizationBacklogItem rows targeted at one epoch"
    constants:
      EPOCH_CAPACITY_POINTS: 30
    precision: "integer points; no rounding"
    variants:
      - name: priority_order_vs_fifo
        when: "the manager backlog view orders by requested_epoch only"
        difference: |
          The allocator sorts by effort_points ASC first, so a large early-requested
          item can overflow to the next epoch while a smaller later-requested item
          fits; the FIFO view would allocate in request order and produce a different
          scheduled_epoch for at least one item whenever a small item follows a large one.

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  # --- priority 1: authentication -------------------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and the role is a declared §1.7 role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  # --- priority 2: authorization --------------------------------------------
  - priority: 2
    category: auth
    check: "the acting role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  # --- priority 3: segregation of duties ------------------------------------
  - priority: 3
    category: auth
    check: "the acting X-User-ID has not already performed the paired step of a segregated pair — recording a ProficiencyExam result and certifying the same Staff member; approving a GO_NO_GO_DECISION and resolving its linked TestDefect"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /proficiency-exams/{id}/record-result, POST /credentialed-trainers/{id}/certify, POST /cutover-tasks/{id}/complete, POST /test-defects/{id}/resolve"

  - priority: 4
    category: business_constraint
    check: "the ProficiencyExam proctor holds a CredentialedTrainer row with status CERTIFIED for the exam's application_code"
    error_id: ERR_UNVERIFIED_TRAINER
    http_status: 403
    applies_to: "POST /proficiency-exams/{id}/record-result"

  # --- priority 5: existence (path resources, left-to-right) ----------------
  - priority: 5
    category: existence
    check: "the resource identified by the first path id exists, then the second, then the third, in the order the endpoint declares them"
    error_id: ERR_EHR_IMPLEMENTATION_NOT_FOUND
    http_status: 404
    applies_to: "POST /ehr-implementations/{id}/start-build, POST /ehr-implementations/{id}/start-validation, POST /ehr-implementations/{id}/finalize-validation, POST /ehr-implementations/{id}/execute-go-live, POST /ehr-implementations/{id}/activate-command-center, POST /ehr-implementations/{id}/advance-epoch, POST /ehr-implementations/{id}/begin-optimization"

  - priority: 6
    category: existence
    check: "the facility, department, staff, build-item, scenario, defect, task, ticket, channel, message, order, assignment, trainer, exam, batch, shift or optimization-item referenced by the path exists and belongs to the acting scope"
    error_id: ERR_FACILITY_NOT_FOUND
    http_status: 404
    applies_to: "all /facilities/{id}/* endpoints"

  - priority: 7
    category: existence
    check: "every foreign-key field supplied in the request body exists, validated strictly in the order the endpoint's input list declares them"
    error_id: ERR_STAFF_NOT_FOUND
    http_status: 404
    applies_to: "POST /staffs, POST /command-center-tickets, POST /staffing-shifts, POST /system-build-items, POST /data-conversion-batches"

  - priority: 8
    category: existence
    check: "a path body carrying an unknown polymorphic target_ref must resolve to an existing Department, Facility or InterfaceChannel"
    error_id: ERR_DEPARTMENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /command-center-tickets"

  # --- priority 9: state preconditions --------------------------------------
  - priority: 9
    category: state
    check: "the target resource is in the exact from-state of the transition being triggered; any other state is rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 10
    category: state
    check: "the target resource is not in a terminal state"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "POST /data-conversion-batches/{id}/rollback, POST /system-build-items/{id}/reset-to-draft, POST /training-assignments/{id}/waive"

  - priority: 11
    category: state
    check: "the owning EhrImplementation.readiness_posture is not ROLLBACK_REQUIRED"
    error_id: ERR_POSTURE_BLOCKS_OPERATION
    http_status: 409
    applies_to: "POST /ehr-implementations/{id}/start-build, POST /ehr-implementations/{id}/start-validation, POST /ehr-implementations/{id}/finalize-validation, POST /ehr-implementations/{id}/execute-go-live, POST /ehr-implementations/{id}/activate-command-center, POST /facilities/{id}/configure-build, POST /facilities/{id}/mark-validated, POST /facilities/{id}/complete-cutover-dress-rehearsal, POST /departments/{id}/begin-training, POST /system-build-items/{id}/start-build"

  - priority: 12
    category: state
    check: "the DataConversionBatch.attempt_epoch equals the program's current_epoch_index"
    error_id: ERR_EPOCH_MISMATCH
    http_status: 409
    applies_to: "POST /data-conversion-batches/{id}/begin-validation, POST /data-conversion-batches/{id}/load"

  # --- priority 13: business safety -----------------------------------------
  - priority: 13
    category: business_safety
    check: "a PatientOrder is clinically reconciled before its charge is posted or its claim submitted"
    error_id: ERR_ORDER_NOT_RECONCILED
    http_status: 422
    applies_to: "POST /patient-orders/{id}/submit-claim, POST /patient-orders/{id}/record-claim-response"

  - priority: 14
    category: business_safety
    check: "a converted PatientOrder whose legacy order category is PROCEDURE must be reconciled by an actor holding a credentialed charge-capture role"
    error_id: ERR_PROCEDURE_CREDENTIAL_MISSING
    http_status: 422
    applies_to: "POST /patient-orders/{id}/reconcile"

  - priority: 15
    category: business_safety
    check: "a SystemBuildItem with build_classification LOCAL_CUSTOM whose customization_risk_points exceeds 40.00 is not admissible for validation without a remediation record"
    error_id: ERR_CUSTOMIZATION_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /system-build-items/{id}/complete-validation, POST /system-build-items/{id}/complete-build"

  - priority: 31
    category: business_constraint
    check: "a TrainingAssignment may only be completed once completed_hours >= required_hours"
    error_id: ERR_TRAINING_HOURS_INSUFFICIENT
    http_status: 422
    applies_to: "POST /training-assignments/{id}/complete"

  - priority: 32
    category: business_constraint
    check: "the department's proficiency_gate_open is true before its gate may be closed for go-live"
    error_id: ERR_PROFICIENCY_GATE_CLOSED
    http_status: 422
    applies_to: "POST /departments/{id}/close-proficiency-gate"

  # --- priority 16: business temporal ---------------------------------------
  - priority: 16
    category: business_temporal
    check: "the new CutoverTask's [planned_start_utc, planned_end_utc) keeps a HANDOFF_BUFFER_MINUTES gap after the preceding task and does not overlap the next one"
    error_id: ERR_TEMPORAL_OVERLAP
    http_status: 409
    applies_to: "POST /facilities/{id}/cutover-tasks"

  - priority: 17
    category: business_temporal
    check: "the CutoverTask being started has no earlier-sequence_index task in status IN {PLANNED, IN_PROGRESS, BLOCKED}"
    error_id: ERR_PRECEDING_STEP_INCOMPLETE
    http_status: 409
    applies_to: "POST /cutover-tasks/{id}/start"

  - priority: 18
    category: business_temporal
    check: "the logical clock has reached next_attempt_eligible_utc before a proficiency retake or NO_SHOW is recorded"
    error_id: ERR_RETEST_COOLDOWN_ACTIVE
    http_status: 409
    applies_to: "POST /proficiency-exams/{id}/record-result, POST /proficiency-exams/{id}/mark-no-show"

  - priority: 19
    category: business_temporal
    check: "the go-live decision instant is not later than go_live_target_utc plus the approved extension"
    error_id: ERR_GO_LIVE_AFTER_TARGET
    http_status: 422
    applies_to: "POST /ehr-implementations/{id}/execute-go-live, POST /cutover-tasks/{id}/complete"

  # --- priority 20: business constraint -------------------------------------
  - priority: 20
    category: business_constraint
    check: "no open TestDefect with severity IN {SEV1, SEV2} blocks the go-live decision"
    error_id: ERR_GO_LIVE_BLOCKED
    http_status: 422
    applies_to: "POST /ehr-implementations/{id}/execute-go-live, POST /facilities/{id}/stabilize"

  - priority: 21
    category: business_constraint
    check: "only SEV3 or SEV4 defects may be deferred"
    error_id: ERR_DEFECT_SEVERITY_NOT_DEFERRABLE
    http_status: 422
    applies_to: "POST /test-defects/{id}/defer"

  - priority: 22
    category: business_constraint
    check: "the observation_hours recorded for a trainer meets the MIN observation floor of the requested certification_level"
    error_id: ERR_TRAINER_OBSERVATION_INSUFFICIENT
    http_status: 422
    applies_to: "POST /credentialed-trainers/{id}/certify, POST /credentialed-trainers/{id}/recertify"

  - priority: 23
    category: business_constraint
    check: "the OptimizationBacklogItem.effort_points does not exceed EPOCH_CAPACITY_POINTS (30) — an item larger than a whole epoch can never be scheduled"
    error_id: ERR_RELEASE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /optimization-backlog-items/{id}/schedule"

  - priority: 24
    category: business_constraint
    check: "no two StaffingShift rows of the same staff overlap and no two AT_THE_ELBOW shifts at the same facility overlap; exact adjacency is allowed"
    error_id: ERR_SHIFT_OVERLAP
    http_status: 409
    applies_to: "POST /staffing-shifts"

  # --- priority 25: business referential ------------------------------------
  - priority: 25
    category: business_referential
    check: "the department has no open SEV1/SEV2 build-and-test defect before its facility may be marked validated"
    error_id: ERR_DEFECT_BLOCKS_DEPARTMENT
    http_status: 422
    applies_to: "POST /facilities/{id}/mark-validated, POST /departments/{id}/close-proficiency-gate"

  - priority: 26
    category: business_referential
    check: "every interface channel referenced by the program is VALIDATED before cutover readiness is granted"
    error_id: ERR_CHANNEL_NOT_VALIDATED
    http_status: 422
    applies_to: "POST /facilities/{id}/complete-cutover-dress-rehearsal, POST /ehr-implementations/{id}/finalize-validation, POST /cutover-tasks/{id}/complete"

  - priority: 27
    category: business_referential
    check: "the claim response is one of ACCEPTED, DENIED, PAID and is compatible with the order's current billing_state"
    error_id: ERR_CLAIM_RESPONSE_INVALID
    http_status: 422
    applies_to: "POST /patient-orders/{id}/record-claim-response"

  - priority: 28
    category: business_referential
    check: "the Staff.primary_facility_id equals the Facility referenced by the shift, batch or ticket"
    error_id: ERR_PRIMARY_FACILITY_MISMATCH
    http_status: 422
    applies_to: "POST /staffing-shifts, POST /command-center-tickets"

  # --- priority 29: business fiscal -----------------------------------------
  - priority: 29
    category: business_fiscal
    check: "the DataConversionBatch variance_penalty_points does not exceed the classification cap"
    error_id: ERR_BALANCE_VARIANCE_EXCEEDED
    http_status: 422
    applies_to: "POST /data-conversion-batches/{id}/load"

  - priority: 30
    category: business_fiscal
    check: "the DataConversionBatch page-processing batch size is a non-negative integer"
    error_id: ERR_BATCH_SIZE_INVALID
    http_status: 400
    applies_to: "POST /data-conversion-batches"

  # --- catalog-completeness rows (structural parse gate runs before priorities 1-3) ---
  - priority: 33
    category: auth
    check: "request-shape gate: a required input field is absent, a field type or enum member is invalid, or a client-supplied system field id/created_at/version is rejected — this structural check runs before the priority ladder"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 34
    category: business_constraint
    check: "the OCC guard: the supplied expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /facilities/{id}/data-conversion-batches, POST /staffs/{id}/credentialed-trainers, POST /optimization-backlog-items"

  - priority: 35
    category: existence
    check: "no SystemBuildItem matches the path id"
    error_id: ERR_BUILD_ITEM_NOT_FOUND
    http_status: 404
    applies_to: "all /system-build-items/{id}/* endpoints"

  - priority: 36
    category: existence
    check: "no TestScenario matches the path id"
    error_id: ERR_TEST_SCENARIO_NOT_FOUND
    http_status: 404
    applies_to: "all /test-scenarios/{id}/* endpoints"

  - priority: 37
    category: existence
    check: "no TestDefect matches the path id or linked_test_defect_id"
    error_id: ERR_DEFECT_NOT_FOUND
    http_status: 404
    applies_to: "all /test-defects/{id}/* endpoints, POST /command-center-tickets"

  - priority: 38
    category: existence
    check: "no InterfaceChannel matches the path id"
    error_id: ERR_CHANNEL_NOT_FOUND
    http_status: 404
    applies_to: "all /interface-channels/{id}/* endpoints"

  - priority: 39
    category: existence
    check: "no CommandCenterTicket matches the path id"
    error_id: ERR_TICKET_NOT_FOUND
    http_status: 404
    applies_to: "all /command-center-tickets/{id}/* endpoints"

  - priority: 40
    category: existence
    check: "no DataConversionBatch matches the path id"
    error_id: ERR_CONVERSION_BATCH_NOT_FOUND
    http_status: 404
    applies_to: "all /data-conversion-batches/{id}/* endpoints"

  - priority: 41
    category: existence
    check: "no PatientOrder matches the path id"
    error_id: ERR_PATIENT_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "all /patient-orders/{id}/* endpoints"

  - priority: 42
    category: business_constraint
    check: "an InterfaceMessage whose message_code is invalid for the channel_type is rejected at validation"
    error_id: ERR_INTERFACE_MESSAGE_INVALID
    http_status: 422
    applies_to: "POST /interface-messages/{id}/validate, POST /interface-channels/{id}/messages"

  - priority: 43
    category: business_constraint
    check: "an InterfaceMessage whose latency_minutes exceeds the channel's max_latency_minutes is rejected at validation"
    error_id: ERR_INTERFACE_LATENCY_EXCEEDED
    http_status: 422
    applies_to: "POST /interface-messages/{id}/validate, POST /interface-channels/{id}/messages"

  - priority: 44
    category: business_fiscal
    check: "the DataConversionBatch page-processing batch size is a non-negative integer"
    error_id: ERR_BATCH_SIZE_INVALID
    http_status: 400
    applies_to: "POST /facilities/{id}/data-conversion-batches"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- EhrImplementation (aggregate root) ----------------------------------
  - { method: POST,  path: "/ehr-implementations", description: "Create an implementation program", roles: [ImplementationDirector], code: 201, input: [program_name, vendor_release, go_live_target_utc], output: EhrImplementation, side_effects: ["status -> PLANNING", "current_epoch_index -> 0", "readiness_posture -> OPEN"] }
  - { method: GET,   path: "/ehr-implementations", description: "List implementation programs", roles: [ImplementationDirector, ImplementationAnalyst, BuildAnalyst, CutoverLead, CommandCenterLead], code: 200, input: ["status?"], output: "EhrImplementation[]", side_effects: [] }
  - { method: GET,   path: "/ehr-implementations/{id}", description: "Get one implementation program with readiness posture", roles: [ImplementationDirector, ImplementationAnalyst, BuildAnalyst, CutoverLead, CommandCenterLead], code: 200, input: ["posture_view?"], output: EhrImplementation, side_effects: [] }
