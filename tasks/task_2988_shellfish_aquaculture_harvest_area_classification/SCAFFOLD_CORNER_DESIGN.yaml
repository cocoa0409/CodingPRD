          - state_machines[GrowingArea.harvest_status OPEN -> CLOSED_RAINFALL]
        distinguishing_aspect: |
          The harvest_status gate is enforced at issue time, not only at activation, and an elapsed
          closure window does not self-heal: the clock is already past closure_reopen_eligible_at
