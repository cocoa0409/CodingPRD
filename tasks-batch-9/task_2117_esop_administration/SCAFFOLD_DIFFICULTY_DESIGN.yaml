            - "Valuation.${val_id}.status == APPROVED after the approve call and Valuation.${val_id}.share_price_cents == 7125"
            - "the second finalize returns HTTP 200 with AllocationRun.${run_id}.status == FINALIZED"
            - "AllocationRun.${run_id}.share_price_cents == 7125 and AllocationRun.${run_id}.pool_shares == 500"
            - "Participant.${p1_id}.allocated_shares == 500"
