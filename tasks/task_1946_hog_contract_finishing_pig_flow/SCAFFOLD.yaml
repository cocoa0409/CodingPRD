  - { method: GET, path: "/growers", description: "List growers (paginated)", roles: [IntegratorAdmin, FieldTech], code: 200, input: ["grower_status?", "limit?", "offset?"], output: "Grower[]", side_effects: [] }
  - { method: GET, path: "/growers/{id}", description: "Get grower", roles: [IntegratorAdmin, FieldTech, Grower], code: 200, input: [], output: Grower, side_effects: [] }
  - { method: POST, path: "/growers/{id}/suspend", description: "Suspend grower", roles: [IntegratorAdmin], code: 200, input: [], output: Grower, side_effects: ["grower_status -> SUSPENDED"] }
  - { method: POST, path: "/growers/{id}/reinstate", description: "Reinstate grower", roles: [IntegratorAdmin], code: 200, input: [], output: Grower, side_effects: ["grower_status -> ACTIVE"] }
  - { method: POST, path: "/growers/{id}/terminate", description: "Terminate grower (terminal)", roles: [IntegratorAdmin], code: 200, input: [], output: Grower, side_effects: ["grower_status -> TERMINATED"] }

  # --- Contracts ---
  - { method: POST, path: "/contracts", description: "Create finishing contract", roles: [IntegratorAdmin], code: 201, input: [grower_id, site_id, base_pay_cents_per_head, bonus_cap_cents_per_head, fcr_target, adg_target_lbs, mortality_threshold_pct, feed_budget_lbs_per_head, effective_date, expiry_date, "structural_owner_pct?", "equipment_owner_pct?", "routine_owner_pct?"], output: Contract, side_effects: ["contract_status=DRAFT"] }
  - { method: GET, path: "/contracts", description: "List contracts (paginated, filters)", roles: [IntegratorAdmin, FieldTech, Grower], code: 200, input: ["grower_id?", "site_id?", "contract_status?", "limit?", "offset?"], output: "Contract[]", side_effects: [] }
  - { method: GET, path: "/contracts/{id}", description: "Get contract", roles: [IntegratorAdmin, FieldTech, Grower], code: 200, input: [], output: Contract, side_effects: [] }
  - { method: POST, path: "/contracts/{id}/activate", description: "Activate contract", roles: [IntegratorAdmin], code: 200, input: [], output: Contract, side_effects: ["contract_status -> ACTIVE"] }
  - { method: POST, path: "/contracts/{id}/terminate", description: "Terminate contract (terminal)", roles: [IntegratorAdmin], code: 200, input: [], output: Contract, side_effects: ["contract_status -> TERMINATED"] }
  - { method: POST, path: "/contracts/{id}/expire", description: "Expire contract past expiry_date (terminal)", roles: [IntegratorAdmin], code: 200, input: [], output: Contract, side_effects: ["contract_status -> EXPIRED"] }

  # --- Barns ---
  - { method: POST, path: "/barns", description: "Create barn", roles: [IntegratorAdmin], code: 201, input: [site_id, barn_code, capacity_head, floor_space_sqft], output: Barn, side_effects: ["barn_status=AVAILABLE; Site.total_capacity_head recomputed"] }
  - { method: GET, path: "/barns", description: "List barns (paginated, filters)", roles: [IntegratorAdmin, FieldTech, Grower], code: 200, input: ["site_id?", "barn_status?", "limit?", "offset?"], output: "Barn[]", side_effects: [] }
  - { method: GET, path: "/barns/{id}", description: "Get barn", roles: [IntegratorAdmin, FieldTech, Grower], code: 200, input: [], output: Barn, side_effects: [] }
  - { method: POST, path: "/barns/{id}/release", description: "Release barn from downtime", roles: [IntegratorAdmin], code: 200, input: [], output: Barn, side_effects: ["barn_status DOWNTIME -> AVAILABLE; wash_required=false; downtime_until=null"] }
  - { method: POST, path: "/barns/{id}/mark-out-of-service", description: "Take barn out of service", roles: [IntegratorAdmin], code: 200, input: [], output: Barn, side_effects: ["barn_status -> OUT_OF_SERVICE; Site.total_capacity_head recomputed"] }
  - { method: POST, path: "/barns/{id}/return-to-service", description: "Return barn to service", roles: [IntegratorAdmin], code: 200, input: [], output: Barn, side_effects: ["barn_status -> AVAILABLE (wash_required=false) or WASH_REQUIRED (true); Site.total_capacity_head recomputed"] }

  # --- Pig groups ---
  - { method: POST, path: "/pig-groups", description: "Schedule pig placement (OCC on Barn.version)", roles: [FieldTech, IntegratorAdmin], code: 201, input: [barn_id, contract_id, placement_date, target_market_date, head_placed, avg_start_weight_lbs, expected_barn_version], output: PigGroup, side_effects: ["group_status=SCHEDULED; increments Barn.version by 1"] }
  - { method: GET, path: "/pig-groups", description: "List pig groups (paginated, filters)", roles: [IntegratorAdmin, FieldTech, Grower, TransportCoordinator], code: 200, input: ["barn_id?", "contract_id?", "group_status?", "limit?", "offset?"], output: "PigGroup[]", side_effects: [] }
  - { method: GET, path: "/pig-groups/{id}", description: "Get pig group", roles: [IntegratorAdmin, FieldTech, Grower, TransportCoordinator], code: 200, input: [], output: PigGroup, side_effects: [] }
  - { method: POST, path: "/pig-groups/{id}/confirm-placement", description: "Confirm pigs on the ground", roles: [FieldTech], code: 200, input: ["actual_head_count?", "actual_avg_weight_lbs?"], output: PigGroup, side_effects: ["SCHEDULED -> PLACED; placed_at := clock; barn -> OCCUPIED"] }
  - { method: POST, path: "/pig-groups/{id}/advance-phase", description: "Advance feed phase one step", roles: [FieldTech], code: 200, input: [], output: PigGroup, side_effects: ["current_phase advanced; old-phase REQUESTED/SCHEDULED feed orders -> CANCELLED"] }
  - { method: POST, path: "/pig-groups/{id}/cancel", description: "Cancel scheduled group", roles: [FieldTech], code: 200, input: [], output: PigGroup, side_effects: ["SCHEDULED -> CANCELLED"] }
  - { method: POST, path: "/pig-groups/{id}/close-out", description: "Force close-out with unaccounted head", roles: [FieldTech], code: 200, input: [], output: PigGroup, side_effects: ["-> CLOSED; head_unaccounted := head_current; barn -> WASH_REQUIRED; Settlement created FINALIZED"] }
  - { method: GET, path: "/pig-groups/{id}/settlement-preview", description: "PROVISIONAL settlement projection", roles: [IntegratorAdmin, FieldTech, Grower], code: 200, input: [], output: { variant: string, base_pay_cents: integer, bonus_cents: integer, deductions_cents: integer, adjustment_cents: integer, total_pay_cents: integer, fcr: number, adg_lbs: number, mortality_pct: number, head_projected_marketed: integer }, side_effects: [] }

  # --- Mortality reports (event sub-resource) ---
  - { method: POST, path: "/pig-groups/{id}/mortality-reports", description: "Report mortality/culls (append-only)", roles: [Grower], code: 201, input: [report_date, mortality_count, cull_count, reason_code], output: MortalityReport, side_effects: ["group aggregates recomputed; auto-close cascade when head_current == 0"] }
  - { method: GET, path: "/pig-groups/{id}/mortality-reports", description: "List reports of a group (paginated)", roles: [IntegratorAdmin, FieldTech, Grower], code: 200, input: ["limit?", "offset?"], output: "MortalityReport[]", side_effects: [] }

  # --- Feed orders ---
  - { method: POST, path: "/feed-orders", description: "Create feed order (phase-diet gated)", roles: [FieldTech], code: 201, input: [group_id, phase, diet_code, quantity_lbs, requested_delivery_date], output: FeedOrder, side_effects: ["order_status=REQUESTED; over_phase_plan computed"] }
  - { method: GET, path: "/feed-orders", description: "List feed orders (paginated, filters)", roles: [IntegratorAdmin, FieldTech, FeedMill, Grower], code: 200, input: ["group_id?", "order_status?", "phase?", "limit?", "offset?"], output: "FeedOrder[]", side_effects: [] }
  - { method: GET, path: "/feed-orders/{id}", description: "Get feed order", roles: [IntegratorAdmin, FieldTech, FeedMill, Grower], code: 200, input: [], output: FeedOrder, side_effects: [] }
  - { method: POST, path: "/feed-orders/{id}/schedule", description: "Mill schedules delivery", roles: [FeedMill], code: 200, input: [scheduled_delivery_date], output: FeedOrder, side_effects: ["REQUESTED -> SCHEDULED"] }
  - { method: POST, path: "/feed-orders/{id}/deliver", description: "Mill confirms delivery (variance branch)", roles: [FeedMill], code: 200, input: [delivered_lbs], output: FeedOrder, side_effects: ["-> DELIVERED (>=80% of quantity) or SHORTED (<80%); group.cumulative_feed_lbs += delivered_lbs"] }
  - { method: POST, path: "/feed-orders/{id}/cancel", description: "Cancel feed order", roles: [FieldTech], code: 200, input: [], output: FeedOrder, side_effects: ["REQUESTED/SCHEDULED -> CANCELLED; committed budget released"] }

  # --- Packer slots ---
  - { method: POST, path: "/packer-slots", description: "Create packer delivery slot", roles: [IntegratorAdmin], code: 201, input: [plant_code, slot_date, shift, capacity_head, min_weight_lbs, max_weight_lbs], output: PackerSlot, side_effects: ["slot_status=OPEN"] }
  - { method: GET, path: "/packer-slots", description: "List slots (paginated, filters)", roles: [IntegratorAdmin, FieldTech, TransportCoordinator], code: 200, input: ["plant_code?", "slot_date?", "slot_status?", "limit?", "offset?"], output: "PackerSlot[]", side_effects: [] }
  - { method: GET, path: "/packer-slots/{id}", description: "Get slot", roles: [IntegratorAdmin, FieldTech, TransportCoordinator], code: 200, input: [], output: PackerSlot, side_effects: [] }
  - { method: POST, path: "/packer-slots/{id}/close", description: "Close slot (terminal)", roles: [IntegratorAdmin], code: 200, input: [], output: PackerSlot, side_effects: ["-> CLOSED"] }

  # --- Market loads ---
  - { method: POST, path: "/market-loads", description: "Book load into slot (OCC on PackerSlot.version)", roles: [FieldTech], code: 201, input: [group_id, slot_id, head_count, expected_slot_version], output: MarketLoad, side_effects: ["load_status=SCHEDULED; slot.reserved_head recomputed; increments PackerSlot.version by 1; slot OPEN->FULL at capacity"] }
  - { method: GET, path: "/market-loads", description: "List loads (paginated, filters)", roles: [IntegratorAdmin, FieldTech, TransportCoordinator, Grower], code: 200, input: ["group_id?", "slot_id?", "truck_wash_id?", "load_status?", "limit?", "offset?"], output: "MarketLoad[]", side_effects: [] }
  - { method: GET, path: "/market-loads/{id}", description: "Get load", roles: [IntegratorAdmin, FieldTech, TransportCoordinator, Grower], code: 200, input: [], output: MarketLoad, side_effects: [] }
  - { method: POST, path: "/market-loads/{id}/dispatch", description: "Dispatch with verified truck wash", roles: [TransportCoordinator], code: 200, input: [truck_wash_id], output: MarketLoad, side_effects: ["SCHEDULED -> DISPATCHED; truck_wash_id set"] }
  - { method: POST, path: "/market-loads/{id}/deliver", description: "Record scale weights; weight-window branch", roles: [TransportCoordinator], code: 200, input: [live_weight_lbs_total], output: MarketLoad, side_effects: ["-> DELIVERED (in window) or REJECTED_AT_PLANT (outside); DELIVERED updates group aggregates and may auto-close group + create Settlement; REJECTED adds penalty to group.pending_deductions_cents"] }
  - { method: POST, path: "/market-loads/{id}/cancel", description: "Cancel load; frees slot head and truck wash", roles: [FieldTech], code: 200, input: [], output: MarketLoad, side_effects: ["-> CANCELLED; slot.reserved_head recomputed; FULL->OPEN when below capacity; PackerSlot.version incremented"] }

  # --- Truck washes ---
  - { method: POST, path: "/truck-washes", description: "Record truck wash", roles: [TransportCoordinator], code: 201, input: [truck_code, washed_at, wash_type], output: TruckWash, side_effects: ["wash_status=RECORDED; recorded_by := X-User-ID"] }
  - { method: GET, path: "/truck-washes", description: "List truck washes (paginated)", roles: [IntegratorAdmin, TransportCoordinator, FieldTech], code: 200, input: ["truck_code?", "wash_status?", "limit?", "offset?"], output: "TruckWash[]", side_effects: [] }
  - { method: GET, path: "/truck-washes/{id}", description: "Get truck wash", roles: [IntegratorAdmin, TransportCoordinator, FieldTech], code: 200, input: [], output: TruckWash, side_effects: [] }
  - { method: POST, path: "/truck-washes/{id}/verify", description: "Verify wash (SoD: verifier != recorder)", roles: [IntegratorAdmin], code: 200, input: [], output: TruckWash, side_effects: ["RECORDED -> VERIFIED; verified_by set"] }
  - { method: POST, path: "/truck-washes/{id}/reject", description: "Reject wash (SoD: rejector != recorder)", roles: [IntegratorAdmin], code: 200, input: [], output: TruckWash, side_effects: ["RECORDED -> REJECTED"] }

  # --- Barn washes ---
  - { method: POST, path: "/barn-washes", description: "Record barn wash (grower-owned barn)", roles: [Grower], code: 201, input: [barn_id, wash_type, completed_at], output: BarnWash, side_effects: ["wash_status=RECORDED; barn WASH_REQUIRED -> WASHING"] }
  - { method: GET, path: "/barn-washes", description: "List barn washes (paginated)", roles: [IntegratorAdmin, Grower, FieldTech], code: 200, input: ["barn_id?", "wash_status?", "limit?", "offset?"], output: "BarnWash[]", side_effects: [] }
  - { method: GET, path: "/barn-washes/{id}", description: "Get barn wash", roles: [IntegratorAdmin, Grower, FieldTech], code: 200, input: [], output: BarnWash, side_effects: [] }
