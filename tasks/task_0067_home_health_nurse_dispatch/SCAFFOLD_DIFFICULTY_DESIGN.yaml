  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: visit_complete_requires_episode_active
        grounds:
          - state_machines.Visit.CONFIRMED_to_COMPLETED
          - validations[priority=6]
          - entities.Episode.fields.status
        distinguishing_aspect: |
          Visit -> Episode pair: a CONFIRMED Visit cannot be COMPLETED while its parent Episode is RECERT_PENDING
          (not ACTIVE); the visit transition depends on the episode's state, failing ERR_EPISODE_NOT_ACTIVE.
