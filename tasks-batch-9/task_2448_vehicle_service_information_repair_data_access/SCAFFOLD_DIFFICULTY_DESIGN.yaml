scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: entitlement_charge_provisional_vs_final_subscription_divergence
        grounds:
          - calculations.entitlement_charge
          - entities.ShopEntitlement.fields.charged_cents
          - entities.ShopEntitlement.fields.settled_cents
          - state_machines.ShopEntitlement.ACTIVE_to_CANCELLED
        distinguishing_aspect: |
          The SAME ShopEntitlement row is priced 84999 by variant PROVISIONAL at creation and
          27419 by variant FINAL at cancellation, because FINAL prorates by whole elapsed days
          (10) over whole window days (31) while PROVISIONAL ignores the clock entirely.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; three SystemArea rows exist"
            - "Manufacturer ACME is COMPLIANT (parity_index 1.1500) and has an ACTIVE License covering all three system areas with monthly_fee_cents 100000"
            - "Shop 'Bay Auto' is on tier PRO and has been funded 200000 cents"
            - "A SUBSCRIPTION ShopEntitlement with seats_total 3 and window 2026-08-01 .. 2026-09-01 exists in status ACTIVE"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /system-areas"
              payload: { code: "ADAS", name: "Advanced Driver Assistance", requires_calibration_doc: true, requires_security_credential: true }
              as: PlatformAdmin
              captures: { sa_adas_id: $.data.id }
            - call: "POST /system-areas"
              payload: { code: "POWERTRAIN", name: "Powertrain", requires_calibration_doc: false, requires_security_credential: true }
              as: PlatformAdmin
              captures: { sa_pt_id: $.data.id }
            - call: "POST /system-areas"
              payload: { code: "BODY_ELECTRICAL", name: "Body Electrical", requires_calibration_doc: false, requires_security_credential: false }
              as: PlatformAdmin
              captures: { sa_body_id: $.data.id }
            - call: "POST /manufacturers"
              payload: { name: "Acme Motors", oem_code: "ACME", region: "NA", independent_list_monthly_cents: 115000, independent_covered_system_count: 3, oem_dealer_monthly_cents: 100000, oem_dealer_covered_system_count: 4 }
              as: PlatformAdmin
              captures: { mfr_id: $.data.id }
            - call: "POST /licenses"
              payload: { manufacturer_id: "${mfr_id}", license_model: "EITHER", monthly_fee_cents: 100000, per_vehicle_fee_cents: 2500, seat_cap: 5, covered_system_area_ids: ["${sa_adas_id}", "${sa_pt_id}", "${sa_body_id}"], effective_start: "2026-08-01T00:00:00Z", effective_end: "2027-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { lic_id: $.data.id }
            - call: "POST /licenses/${lic_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /shops"
              payload: { name: "Bay Auto", tier: "PRO" }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/credit-funding"
              payload: { amount_cents: 200000, funding_ref: "FUND-1" }
              as: PlatformAdmin
            - call: "POST /entitlements"
              payload: { shop_id: "${shop_id}", license_id: "${lic_id}", entitlement_model: "SUBSCRIPTION", seats_total: 3, window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }
              as: ShopManager
              as_user_id: "${shop_id}"
              captures: { ent_id: $.data.id, ent_charged: $.data.charged_cents }
            - call: "POST /entitlements/${ent_id}/activate"
              payload: {}
              as: ShopManager
              as_user_id: "${shop_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /entitlements/${ent_id}/cancel"
              payload: { reason: "SHOP_EXIT" }
              as: ShopManager
              as_user_id: "${shop_id}"
          assert:
            - "ShopEntitlement.${ent_id}.charged_cents == 84999"
            - "ShopEntitlement.${ent_id}.settled_cents == 27419"
            - "ShopEntitlement.${ent_id}.settlement_status == SETTLED"
            - "ShopEntitlement.${ent_id}.status == CANCELLED"
            - "Shop.${shop_id}.data_credit_balance_cents == 172581"
            - "Shop.${shop_id}.funded_credit_total_cents == 200000"
            - "ShopEntitlement.${ent_id}.charged_cents - ShopEntitlement.${ent_id}.settled_cents == 57580"

      - name: parity_index_list_basis_vs_effective_basis_divergence
        grounds:
          - calculations.parity_index
          - entities.Manufacturer.fields.parity_index
          - entities.Manufacturer.fields.parity_status
        distinguishing_aspect: |
          The SAME Manufacturer row reads parity_index 1.1500 / COMPLIANT under LIST_BASIS and
          1.5333 / NON_COMPLIANT under EFFECTIVE_BASIS, because EFFECTIVE_BASIS divides each
          offer by its covered system count times DAYS_PER_MONTH while LIST_BASIS does not.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "Manufacturer ACME priced at independent 115000 over 3 covered systems and dealer 100000 over 4 covered systems"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /manufacturers"
              payload: { name: "Acme Motors", oem_code: "ACME", region: "NA", independent_list_monthly_cents: 115000, independent_covered_system_count: 3, oem_dealer_monthly_cents: 100000, oem_dealer_covered_system_count: 4 }
              as: PlatformAdmin
              captures: { mfr_id: $.data.id }
          trigger:
            - call: "GET /manufacturers/${mfr_id}/parity-report"
              payload: { basis: "LIST_BASIS" }
              as: ComplianceOfficer
            - call: "GET /manufacturers/${mfr_id}/parity-report"
              payload: { basis: "EFFECTIVE_BASIS" }
              as: ComplianceOfficer
          assert:
            - "LIST_BASIS report: parity_index == 1.1500 and parity_status == COMPLIANT and threshold == 1.15"
            - "EFFECTIVE_BASIS report: parity_index == 1.5333 and parity_status == NON_COMPLIANT"
            - "EFFECTIVE_BASIS report: independent_effective_cents_per_system_day == 1277.7778"
            - "EFFECTIVE_BASIS report: oem_effective_cents_per_system_day == 833.3333"
            - "Manufacturer.${mfr_id}.parity_index == 1.1500 (the stored value is always the LIST_BASIS verdict)"
            - "Manufacturer.${mfr_id}.parity_status == COMPLIANT"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: entitlement_charge_per_line_rounding_order_is_pinned
        grounds:
          - calculations.entitlement_charge
          - entities.License.fields.covered_system_area_ids
          - entities.Shop.fields.tier
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: rounding each of the 3 charge lines to
          whole cents and then summing yields 84999, while summing the exact line values and
          rounding once yields 85000 — a 1-cent divergence that pins the evaluation order.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; three SystemArea rows exist"
            - "ACTIVE License with monthly_fee_cents 100000 covering exactly 3 system areas"
            - "Shop on tier PRO (TIER_MULT 0.85), funded 200000 cents"
            - "Entitlement requested as SUBSCRIPTION with seats_total 3 (seat_factor exactly 1.00, so only the per-line rounding step can move the total)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /system-areas"
              payload: { code: "ADAS", name: "Advanced Driver Assistance", requires_calibration_doc: true, requires_security_credential: true }
              as: PlatformAdmin
              captures: { sa_adas_id: $.data.id }
            - call: "POST /system-areas"
              payload: { code: "POWERTRAIN", name: "Powertrain", requires_calibration_doc: false, requires_security_credential: true }
              as: PlatformAdmin
              captures: { sa_pt_id: $.data.id }
            - call: "POST /system-areas"
              payload: { code: "BODY_ELECTRICAL", name: "Body Electrical", requires_calibration_doc: false, requires_security_credential: false }
              as: PlatformAdmin
              captures: { sa_body_id: $.data.id }
            - call: "POST /manufacturers"
              payload: { name: "Acme Motors", oem_code: "ACME", region: "NA", independent_list_monthly_cents: 115000, independent_covered_system_count: 3, oem_dealer_monthly_cents: 100000, oem_dealer_covered_system_count: 4 }
              as: PlatformAdmin
              captures: { mfr_id: $.data.id }
            - call: "POST /licenses"
              payload: { manufacturer_id: "${mfr_id}", license_model: "SUBSCRIPTION", monthly_fee_cents: 100000, per_vehicle_fee_cents: 2500, seat_cap: 10, covered_system_area_ids: ["${sa_adas_id}", "${sa_pt_id}", "${sa_body_id}"], effective_start: "2026-08-01T00:00:00Z", effective_end: "2027-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { lic_id: $.data.id }
            - call: "POST /licenses/${lic_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /shops"
              payload: { name: "Bay Auto", tier: "PRO" }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/credit-funding"
              payload: { amount_cents: 200000, funding_ref: "FUND-1" }
              as: PlatformAdmin
          trigger:
            - call: "POST /entitlements"
              payload: { shop_id: "${shop_id}", license_id: "${lic_id}", entitlement_model: "SUBSCRIPTION", seats_total: 3, window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }
              as: ShopManager
              as_user_id: "${shop_id}"
              captures: { ent_id: $.data.id }
          assert:
            - "ShopEntitlement.${ent_id}.charged_cents == 84999"
            - "ShopEntitlement.${ent_id}.charged_cents != 85000 (sum-then-round is the rejected order)"
            - "Shop.${shop_id}.data_credit_balance_cents == 115001"
            - "ShopEntitlement.${ent_id}.seats_available == 3"

      - name: gateway_fee_discount_tier_keyed_on_base_subtotal_not_total
        grounds:
          - calculations.gateway_access_fee
          - entities.GatewaySession.fields.base_subtotal_cents
          - entities.GatewaySession.fields.discount_cents
          - entities.GatewaySession.fields.surcharge_cents
          - entities.GatewaySession.fields.total_access_fee_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with a pinned order: the discount tier is keyed on
          base_subtotal_cents (9800 -> 5%), not on the surcharge-inclusive total (10976, which
          would cross DISCOUNT_TIER_2_CENTS and earn 10%), so the answer is 10486 and not 9996.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "ACTIVE License, ACTIVE entitlement, VERIFIED technician, seat, IDLE tool at Shop 'Bay Auto' (tier PRO)"
            - "A REPAIR_PROCEDURE publication for (AX7, POWERTRAIN) with a VALIDATED + PUBLISHED version"
            - "An ACTIVE GatewaySession on the tool carrying one COMPLETED IMMOBILIZER_KEY job and one COMPLETED MODULE_FLASH job (both billable)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /system-areas"
              payload: { code: "POWERTRAIN", name: "Powertrain", requires_calibration_doc: false, requires_security_credential: true }
              as: PlatformAdmin
              captures: { sa_pt_id: $.data.id }
            - call: "POST /manufacturers"
              payload: { name: "Acme Motors", oem_code: "ACME", region: "NA", independent_list_monthly_cents: 115000, independent_covered_system_count: 3, oem_dealer_monthly_cents: 100000, oem_dealer_covered_system_count: 4 }
              as: PlatformAdmin
              captures: { mfr_id: $.data.id }
            - call: "POST /vehicle-models"
              payload: { manufacturer_id: "${mfr_id}", model_code: "AX7", model_year: 2025 }
              as: PlatformAdmin
              captures: { vm_id: $.data.id }
            - call: "POST /licenses"
              payload: { manufacturer_id: "${mfr_id}", license_model: "SUBSCRIPTION", monthly_fee_cents: 100000, per_vehicle_fee_cents: 2500, seat_cap: 5, covered_system_area_ids: ["${sa_pt_id}"], effective_start: "2026-08-01T00:00:00Z", effective_end: "2027-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { lic_id: $.data.id }
            - call: "POST /licenses/${lic_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /shops"
              payload: { name: "Bay Auto", tier: "PRO" }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/credit-funding"
              payload: { amount_cents: 200000, funding_ref: "FUND-1" }
              as: PlatformAdmin
            - call: "POST /entitlements"
              payload: { shop_id: "${shop_id}", license_id: "${lic_id}", entitlement_model: "SUBSCRIPTION", seats_total: 3, window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }
              as: ShopManager
              as_user_id: "${shop_id}"
              captures: { ent_id: $.data.id }
            - call: "POST /entitlements/${ent_id}/activate"
              payload: {}
              as: ShopManager
              as_user_id: "${shop_id}"
              captures: { ent_v2: $.data.version }
            - call: "POST /technicians"
              payload: { shop_id: "${shop_id}", full_name: "Tina Tech", credential_expires_at: "2026-12-31T00:00:00Z" }
              as: ShopManager
              as_user_id: "${shop_id}"
              captures: { tech_id: $.data.id }
            - call: "POST /technicians/${tech_id}/verify"
              payload: { identity_document_ref: "DL-77123", credential_expires_at: "2026-12-31T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /seat-assignments"
              payload: { entitlement_id: "${ent_id}", technician_id: "${tech_id}", expected_entitlement_version: "${ent_v2}" }
              as: ShopManager
              as_user_id: "${shop_id}"
              captures: { seat_id: $.data.id }
            - call: "POST /diagnostic-tools"
              payload: { shop_id: "${shop_id}", serial_no: "SN-0001", oem_attestation_expires_at: "2026-12-31T00:00:00Z" }
              as: ShopManager
              as_user_id: "${shop_id}"
              captures: { tool_id: $.data.id }
            - call: "POST /publications"
              payload: { vehicle_model_id: "${vm_id}", system_area_id: "${sa_pt_id}", publication_type: "REPAIR_PROCEDURE" }
              as: ContentPublisher
              as_user_id: "cp_1"
              captures: { pub_id: $.data.id, pub_v1: $.data.version }
            - call: "POST /publications/${pub_id}/versions"
              payload: { source_tsb_ref: "TSB-0001", expected_publication_version: "${pub_v1}" }
              as: ContentPublisher
              as_user_id: "cp_1"
              captures: { pv1_id: $.data.id }
            - call: "POST /publication-versions/${pv1_id}/validate"
              payload: { reviewer_notes: "checked against OEM procedure" }
              as: ContentPublisher
              as_user_id: "cp_1"
            - call: "POST /publication-versions/${pv1_id}/publish"
              payload: {}
              as: ContentPublisher
              as_user_id: "cp_2"
            - call: "POST /gateway-sessions"
              payload: { seat_assignment_id: "${seat_id}", diagnostic_tool_id: "${tool_id}", vin: "1HGCM82633A004352", window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T12:00:00Z" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /gateway-sessions/${sess_id}/activate"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /programming-jobs"
              payload: { session_id: "${sess_id}", job_type: "IMMOBILIZER_KEY", pinned_publication_version_id: "${pv1_id}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { job_immo_id: $.data.id }
            - call: "POST /programming-jobs/${job_immo_id}/start"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /programming-jobs/${job_immo_id}/complete"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /programming-jobs"
              payload: { session_id: "${sess_id}", job_type: "MODULE_FLASH", pinned_publication_version_id: "${pv1_id}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { job_flash_id: $.data.id }
            - call: "POST /programming-jobs/${job_flash_id}/start"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /programming-jobs/${job_flash_id}/complete"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /gateway-sessions/${sess_id}/complete"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          assert:
            - "GatewaySession.${sess_id}.status == COMPLETED"
            - "GatewaySession.${sess_id}.base_subtotal_cents == 9800"
            - "GatewaySession.${sess_id}.discount_cents == 490"
            - "GatewaySession.${sess_id}.surcharge_cents == 1176"
            - "GatewaySession.${sess_id}.total_access_fee_cents == 10486"
            - "GatewaySession.${sess_id}.total_access_fee_cents != 9996 (the rejected circular tier reading)"
            - "Shop.${shop_id}.gateway_fee_accrued_cents == 10486"
            - "Shop.${shop_id}.data_credit_balance_cents == 115001 (gateway fees never net against data credit)"
            - "DiagnosticTool.${tool_id}.status == IDLE and DiagnosticTool.${tool_id}.occupied_by_session_id is null"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: publication_version_parallel_axes_move_independently
        grounds:
          - state_machines.PublicationVersion.WITHHELD_to_PUBLISHED
          - state_machines.PublicationVersion.DRAFT_to_VALIDATED
          - entities.PublicationVersion.fields.review_status
          - entities.PublicationVersion.fields.distribution_status
        distinguishing_aspect: |
          Parallel shape: publishing a version whose review_status is DRAFT moves ONLY
          distribution_status to PUBLISHED and leaves review_status at DRAFT, and validating it
          afterwards moves ONLY review_status to VALIDATED and leaves distribution_status
          PUBLISHED — neither axis is a precondition of the other.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "Manufacturer ACME with VehicleModel AX7 and SystemArea POWERTRAIN"
            - "A REPAIR_PROCEDURE Publication with one version at review_status DRAFT and distribution_status WITHHELD"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /system-areas"
              payload: { code: "POWERTRAIN", name: "Powertrain", requires_calibration_doc: false, requires_security_credential: true }
              as: PlatformAdmin
              captures: { sa_pt_id: $.data.id }
            - call: "POST /manufacturers"
              payload: { name: "Acme Motors", oem_code: "ACME", region: "NA", independent_list_monthly_cents: 115000, independent_covered_system_count: 3, oem_dealer_monthly_cents: 100000, oem_dealer_covered_system_count: 4 }
              as: PlatformAdmin
              captures: { mfr_id: $.data.id }
            - call: "POST /vehicle-models"
              payload: { manufacturer_id: "${mfr_id}", model_code: "AX7", model_year: 2025 }
              as: PlatformAdmin
              captures: { vm_id: $.data.id }
            - call: "POST /publications"
              payload: { vehicle_model_id: "${vm_id}", system_area_id: "${sa_pt_id}", publication_type: "REPAIR_PROCEDURE" }
              as: ContentPublisher
              as_user_id: "cp_1"
              captures: { pub_id: $.data.id, pub_v1: $.data.version }
            - call: "POST /publications/${pub_id}/versions"
              payload: { source_tsb_ref: "TSB-0001", expected_publication_version: "${pub_v1}" }
              as: ContentPublisher
              as_user_id: "cp_1"
              captures: { pv1_id: $.data.id }
          trigger:
            - call: "POST /publication-versions/${pv1_id}/publish"
              payload: {}
              as: ContentPublisher
              as_user_id: "cp_2"
            - call: "POST /publication-versions/${pv1_id}/validate"
              payload: { reviewer_notes: "post-hoc editorial review" }
              as: ContentPublisher
              as_user_id: "cp_1"
          assert:
            - "after the publish call: PublicationVersion.${pv1_id}.distribution_status == PUBLISHED and PublicationVersion.${pv1_id}.review_status == DRAFT"
            - "after the publish call: PublicationVersion.${pv1_id}.published_by_user_id == cp_2 and validated_by_user_id is null"
            - "after the publish call: Publication.${pub_id}.published_version_id == ${pv1_id}"
            - "after the validate call: PublicationVersion.${pv1_id}.review_status == VALIDATED and distribution_status is still PUBLISHED"
            - "after the validate call: PublicationVersion.${pv1_id}.validated_by_user_id == cp_1 and published_by_user_id is still cp_2"
            - "PublicationVersion.${pv1_id}.version_no == 1"

      - name: programming_job_revalidation_cycle_returns_to_in_progress_on_repin
        grounds:
          - state_machines.ModuleProgrammingJob.IN_PROGRESS_to_REVALIDATION_REQUIRED
          - state_machines.ModuleProgrammingJob.REVALIDATION_REQUIRED_to_IN_PROGRESS
          - entities.ModuleProgrammingJob.fields.repin_count
          - entities.PublicationVersion.fields.active_pin_count
        distinguishing_aspect: |
          Cyclic shape: the job re-enters IN_PROGRESS, a state it already occupied, via
          IN_PROGRESS -> REVALIDATION_REQUIRED -> IN_PROGRESS, and the loop is observable because
          repin_count increments to 1 while the pin moves from the recalled v1 to the published v2.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "ACTIVE License, ACTIVE entitlement, VERIFIED technician, seat, tool, ACTIVE GatewaySession at Shop 'Bay Auto'"
            - "Publication for (AX7, POWERTRAIN) with version 1 PUBLISHED and a MODULE_FLASH job pinned to it in status IN_PROGRESS"
            - "Version 1 is then RECALLED, pushing the job to REVALIDATION_REQUIRED, and version 2 is minted and PUBLISHED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /system-areas"
              payload: { code: "POWERTRAIN", name: "Powertrain", requires_calibration_doc: false, requires_security_credential: true }
              as: PlatformAdmin
              captures: { sa_pt_id: $.data.id }
            - call: "POST /manufacturers"
              payload: { name: "Acme Motors", oem_code: "ACME", region: "NA", independent_list_monthly_cents: 115000, independent_covered_system_count: 3, oem_dealer_monthly_cents: 100000, oem_dealer_covered_system_count: 4 }
              as: PlatformAdmin
              captures: { mfr_id: $.data.id }
            - call: "POST /vehicle-models"
              payload: { manufacturer_id: "${mfr_id}", model_code: "AX7", model_year: 2025 }
              as: PlatformAdmin
              captures: { vm_id: $.data.id }
            - call: "POST /licenses"
              payload: { manufacturer_id: "${mfr_id}", license_model: "SUBSCRIPTION", monthly_fee_cents: 100000, per_vehicle_fee_cents: 2500, seat_cap: 5, covered_system_area_ids: ["${sa_pt_id}"], effective_start: "2026-08-01T00:00:00Z", effective_end: "2027-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { lic_id: $.data.id }
            - call: "POST /licenses/${lic_id}/activate"
              payload: {}
