      - name: device_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_DEVICE_NOT_FOUND]", "validations[priority=9]"]
        distinguishing_aspect: "A well-formed but unknown Device id returns ERR_DEVICE_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["Clock at 2026-05-01T00:00:00Z, no devices claimed."]
          setup_api_calls:
            - call: "POST /smart-home-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /smart-home-support/devices/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err_id: "$.data.error_id" }
          assert: ["HTTP status == 404", "response data.error_id == ERR_DEVICE_NOT_FOUND"]

      - name: ticket_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_TICKET_NOT_FOUND]", "validations[priority=10]"]
        distinguishing_aspect: "A well-formed but unknown Ticket id returns ERR_TICKET_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["Clock at 2026-05-01T00:00:00Z, no tickets opened."]
          setup_api_calls:
            - call: "POST /smart-home-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /smart-home-support/tickets/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SupportAgent
              as_user_id: "agent-1"
              captures: { err_id: "$.data.error_id" }
          assert: ["HTTP status == 404", "response data.error_id == ERR_TICKET_NOT_FOUND"]

      - name: remote_session_get_with_unknown_id_returns_not_found
        claim_type: Not Found
