        claim_type: violation_to_error
        grounds: ["errors[ERR_PLAN_RETIRED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / winback_requires_plan_active_not_retired
          rationale: "ERR_PLAN_RETIRED is the asserted failure path of the named §1.8 instance."

      - name: error_gift_not_reactivatable_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_GIFT_NOT_REACTIVATABLE]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / winback_constraint_gift_beats_temporal_window
          rationale: "ERR_GIFT_NOT_REACTIVATABLE is the asserted failure path of the named §1.8 instance."

      - name: error_invalid_state_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / allocation_requires_wave_open_not_locked
          rationale: "ERR_INVALID_STATE on a cross-entity precondition is asserted by the named §1.8 instance."

  # ===========================================================================
  - section: rbac
    instances:
      - name: subscriber_cannot_act_on_another_subscribers_subscription
        claim_type: peer_role_isolation
        grounds: [roles, "validations[priority=2]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Subscriber A (entity_backed) calling POST /subscriptions/{B's id}/pause where the subscription is owned by B returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["Subscriber B owns an ACTIVE subscription; Subscriber A is a different account."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CurationAdmin
            - call: "POST /plans"
              payload: { name: "OW", cadence: "MONTHLY", period_price_cents: 6000, box_item_count: 1 }
              as: CurationAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "owb@x.com", full_name: "OW B" }
              as: Subscriber
              captures: { b_acct: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${b_acct}", plan_id: "${plan_id}" }
              as: Subscriber
              as_user_id: "${b_acct}"
              captures: { b_sub: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "owa@x.com", full_name: "OW A" }
              as: Subscriber
              captures: { a_acct: $.data.id }
          trigger:
            - call: "POST /subscriptions/${b_sub}/pause"
              payload: { paused_until: "2026-08-01T00:00:00Z" }
              as: Subscriber
              as_user_id: "${a_acct}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED (403) — A does not own B's subscription"

      - name: subscriber_cannot_retry_charge_billing_operator_only
        claim_type: peer_role_isolation
        grounds: [roles, "validations[priority=2]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Subscriber calling POST /subscriptions/{id}/retry-charge (BillingOperator-exclusive) returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["Subscriber S owns a subscription."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CurationAdmin
            - call: "POST /plans"
              payload: { name: "RC", cadence: "MONTHLY", period_price_cents: 6000, box_item_count: 1 }
              as: CurationAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "rcs@x.com", full_name: "RC S" }
              as: Subscriber
              captures: { acct: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${acct}", plan_id: "${plan_id}" }
              as: Subscriber
              as_user_id: "${acct}"
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /subscriptions/${s_id}/retry-charge"
              payload: { outcome: "PAID" }
              as: Subscriber
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED (403)"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_allocation_happy_path_correct_wave_version_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[allocation-create-stale-wave]", endpoints, entities.ShippingWave.fields.version]
        distinguishing_aspect: "POST /allocations with expected_wave_version equal to the live wave.version succeeds (201) and bumps wave.version by 1."
        test_recipe:
          setup: ["Box [P] curated, P.on_hand sufficient, OPEN wave at version v before cutoff."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CurationAdmin
            - call: "POST /plans"
              payload: { name: "OK", cadence: "MONTHLY", period_price_cents: 6000, box_item_count: 1 }
              as: CurationAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "OKP", name: "OK P", on_hand_qty: 5 }
              as: CurationAdmin
              captures: { p_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "ok@x.com", full_name: "OK S" }
              as: Subscriber
              captures: { acct: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${acct}", plan_id: "${plan_id}" }
              as: Subscriber
              as_user_id: "${acct}"
              captures: { s_id: $.data.id }
            - call: "POST /subscriptions/${s_id}/box-selections"
              payload: { period_index: 2, product_ids: ["${p_id}"] }
              as: Subscriber
              as_user_id: "${acct}"
              captures: { box_id: $.data.id }
            - call: "POST /waves"
              payload: { cadence: "MONTHLY", cutoff_at: "2026-06-15T00:00:00Z", ship_date: "2026-06-16T00:00:00Z", capacity: 5 }
              as: CurationAdmin
              captures: { wave_id: $.data.id, wave_ver: $.data.version }
          trigger:
            - call: "POST /allocations"
              payload: { subscription_id: "${s_id}", wave_id: "${wave_id}", box_selection_id: "${box_id}", expected_wave_version: "${wave_ver}" }
              as: CurationAdmin
              captures: { alloc_id: $.data.id }
          assert:
            - "response code == 201"
            - "Allocation.${alloc_id}.status == RESERVED"
            - "ShippingWave.${wave_id}.reserved_count == 1 and version == ${wave_ver} + 1"

      - name: occ_allocation_stale_wave_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[allocation-create-stale-wave]", "errors[ERR_STALE_WAVE_VERSION]", entities.ShippingWave.fields.version]
        distinguishing_aspect: "A second allocation carrying the pre-first-allocation wave version (now stale) is rejected ERR_STALE_WAVE_VERSION (412); two strictly sequential requests, no parallelism."
        test_recipe:
          setup: ["Two curated boxes for two subscribers; one allocation already reserved against the wave so wave.version advanced past the captured value."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CurationAdmin
            - call: "POST /plans"
              payload: { name: "ST", cadence: "MONTHLY", period_price_cents: 6000, box_item_count: 1 }
              as: CurationAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "STP", name: "ST P", on_hand_qty: 9 }
              as: CurationAdmin
              captures: { p_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "st1@x.com", full_name: "ST One" }
              as: Subscriber
              captures: { a1: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${a1}", plan_id: "${plan_id}" }
              as: Subscriber
              as_user_id: "${a1}"
              captures: { sub1: $.data.id }
            - call: "POST /subscriptions/${sub1}/box-selections"
              payload: { period_index: 2, product_ids: ["${p_id}"] }
              as: Subscriber
              as_user_id: "${a1}"
              captures: { box1: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "st2@x.com", full_name: "ST Two" }
              as: Subscriber
              captures: { a2: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${a2}", plan_id: "${plan_id}" }
              as: Subscriber
              as_user_id: "${a2}"
              captures: { sub2: $.data.id }
            - call: "POST /subscriptions/${sub2}/box-selections"
              payload: { period_index: 2, product_ids: ["${p_id}"] }
              as: Subscriber
              as_user_id: "${a2}"
              captures: { box2: $.data.id }
            - call: "POST /waves"
              payload: { cadence: "MONTHLY", cutoff_at: "2026-06-15T00:00:00Z", ship_date: "2026-06-16T00:00:00Z", capacity: 5 }
              as: CurationAdmin
              captures: { wave_id: $.data.id, wave_ver0: $.data.version }
            - call: "POST /allocations"
              payload: { subscription_id: "${sub1}", wave_id: "${wave_id}", box_selection_id: "${box1}", expected_wave_version: "${wave_ver0}" }
              as: CurationAdmin
              captures: { alloc1: $.data.id }
          trigger:
            - call: "POST /allocations"
              payload: { subscription_id: "${sub2}", wave_id: "${wave_id}", box_selection_id: "${box2}", expected_wave_version: "${wave_ver0}" }
              as: CurationAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_WAVE_VERSION (412) — ${wave_ver0} is stale after the first allocation"
            - "ShippingWave.${wave_id}.reserved_count == 1 (second allocation not applied)"

      - name: occ_prepay_stale_subscription_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[prepay-stale-subscription]", "errors[ERR_STALE_SUBSCRIPTION_VERSION]", entities.Subscription.fields.version]
        distinguishing_aspect: "A prepay carrying a stale expected_subscription_version (one less than live, after an intervening pause bumped version) is rejected ERR_STALE_SUBSCRIPTION_VERSION (412)."
        test_recipe:
          setup: ["Subscriber S ACTIVE/CURRENT; version observed at creation, then a pause/resume cycle advances version beyond the observed value."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CurationAdmin
            - call: "POST /plans"
              payload: { name: "SP", cadence: "MONTHLY", period_price_cents: 6000, box_item_count: 1, prepaid_terms_offered: [6], prepaid_discount_pct: 0.10 }
              as: CurationAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "sp@x.com", full_name: "SP S" }
              as: Subscriber
              captures: { acct: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${acct}", plan_id: "${plan_id}" }
              as: Subscriber
              as_user_id: "${acct}"
              captures: { s_id: $.data.id, s_ver0: $.data.version }
            - call: "POST /subscriptions/${s_id}/pause"
              payload: { paused_until: "2026-08-01T00:00:00Z" }
              as: Subscriber
              as_user_id: "${acct}"
            - call: "POST /subscriptions/${s_id}/resume"
              payload: {}
              as: Subscriber
              as_user_id: "${acct}"
          trigger:
            - call: "POST /subscriptions/${s_id}/prepay"
              payload: { term_periods: 6, expected_subscription_version: "${s_ver0}" }
              as: Subscriber
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_SUBSCRIPTION_VERSION (412) — ${s_ver0} is stale after pause/resume"
            - "Subscription.${s_id}.billing_status == CURRENT (prepay not applied)"

      - name: cascade_partial_then_full_release_derived_field_reconciliation
        claim_type: derived_field_reconciliation
        grounds: [entities.Product.fields.allocated_qty, state_machines.Allocation.RESERVED_to_RELEASED, calculations.allocation_fill]
        distinguishing_aspect: "After two allocations of product P (allocated_qty=2), releasing one allocation reconciles allocated_qty back to 1 (not 0); the derived field tracks RESERVED allocations exactly."
        test_recipe:
          setup: ["Product P on_hand=9; two RESERVED allocations of one P each in an OPEN wave (allocated_qty=2)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CurationAdmin
            - call: "POST /plans"
              payload: { name: "DR", cadence: "MONTHLY", period_price_cents: 6000, box_item_count: 1 }
