  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_precondition_beats_referential_poa_check
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - errors.ERR_INVALID_STATE
          - errors.ERR_POA_REQUIRED
        distinguishing_aspect: |
          Category pair state (priority 6) vs business_referential
          (priority 11): verifying an ALREADY-VERIFIED registration that also
          carries a blank POA returns ERR_INVALID_STATE (the transition is
          undefined from VERIFIED), not ERR_POA_REQUIRED — the state gate
          fires before the referential POA check is ever consulted.
        test_recipe:
          setup:
            - "Clock at default. Jurisdictions FED-941 and NY-NYS45. Client ONBOARDING."
            - "R1: FED registration created WITH a POA and VERIFIED."
            - "R2: NY registration created with a BLANK poa_document_ref and left PENDING."
            - "Dual-failure targets: re-verifying R1 (VERIFIED; transition undefined -> ERR_INVALID_STATE) vs verifying R2 (PENDING but POA blank -> ERR_POA_REQUIRED)."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "FED-941", name: "IRS Form 941", deposit_frequency: "SEMIWEEKLY", penalty_tier1_rate: 0.02, penalty_tier2_rate: 0.05, penalty_tier3_rate: 0.10, underpayment_threshold_cents: 250000 }
              as: BureauCompliance
              captures: { j_fed: $.data.id }
            - call: "POST /jurisdictions"
              payload: { code: "NY-NYS45", name: "NY NYS-45", deposit_frequency: "MONTHLY", penalty_tier1_rate: 0.02, penalty_tier2_rate: 0.05, penalty_tier3_rate: 0.10, underpayment_threshold_cents: 100000 }
              as: BureauCompliance
              captures: { j_ny: $.data.id }
            - call: "POST /clients"
              payload: { legal_name: "Priority One Co", ein: "77-7777777" }
              as: BureauOnboarder
              captures: { cl_p1: $.data.id }
            - call: "POST /clients/${cl_p1}/begin-onboarding"
              payload: {}
              as: BureauOnboarder
            - call: "POST /clients/${cl_p1}/registrations"
              payload: { jurisdiction_id: "${j_fed}", agency_account_number: "EFTPS-P1", poa_document_ref: "POA-P1" }
              as: BureauOnboarder
              captures: { reg_p1a: $.data.id }
            - call: "POST /registrations/${reg_p1a}/verify"
              payload: {}
              as: BureauOnboarder
            - call: "POST /clients/${cl_p1}/registrations"
              payload: { jurisdiction_id: "${j_ny}", agency_account_number: "NY-P1", poa_document_ref: "" }
              as: BureauOnboarder
              captures: { reg_p1b: $.data.id }
          trigger:
            - call: "POST /registrations/${reg_p1a}/verify"
              payload: {}
              as: BureauOnboarder
              captures: { err_a: $.data.error_id }
            - call: "POST /registrations/${reg_p1b}/verify"
              payload: {}
              as: BureauOnboarder
              captures: { err_b: $.data.error_id }
          assert:
            - "first verify attempt on the VERIFIED registration returns 409 and err_a == ERR_INVALID_STATE"
            - "second verify attempt on the PENDING registration with blank POA returns 422 and err_b == ERR_POA_REQUIRED"
            - "err_a != err_b — the state gate (priority 6) categorically precedes the referential POA gate (priority 11)"

      - name: identity_authz_beats_temporal_year_gate
        grounds:
          - validations[priority=3]
          - validations[priority=17]
          - errors.ERR_FORBIDDEN
          - errors.ERR_YEAR_NOT_CLOSED
        distinguishing_aspect: |
          Category pair auth (priority 3, entity-backed identity) vs
          business_temporal (priority 17): a ClientPayrollAdmin of client B
          attempting to issue client A's wage statement BEFORE the year has
          closed gets 403 ERR_FORBIDDEN, never reaching the temporal
          ERR_YEAR_NOT_CLOSED gate — a different category pair than
          state-vs-referential.
        test_recipe:
          setup:
            - "Clock at default 2026-09-01 (tax year 2026 NOT closed — the temporal gate would fail)."
            - "Client A ACTIVE with a DRAFT wage statement for tax_year 2026."
            - "Client B exists (PROSPECT is sufficient — B never activates)."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "FED-941", name: "IRS Form 941", deposit_frequency: "SEMIWEEKLY", penalty_tier1_rate: 0.02, penalty_tier2_rate: 0.05, penalty_tier3_rate: 0.10, underpayment_threshold_cents: 250000 }
              as: BureauCompliance
              captures: { j_fed: $.data.id }
            - call: "POST /clients"
              payload: { legal_name: "Alpha Client", ein: "88-8888888" }
              as: BureauOnboarder
              captures: { cl_alpha: $.data.id }
            - call: "POST /clients/${cl_alpha}/begin-onboarding"
              payload: {}
              as: BureauOnboarder
            - call: "POST /clients/${cl_alpha}/registrations"
              payload: { jurisdiction_id: "${j_fed}", agency_account_number: "EFTPS-AL", poa_document_ref: "POA-AL" }
              as: BureauOnboarder
              captures: { reg_al: $.data.id }
            - call: "POST /registrations/${reg_al}/verify"
              payload: {}
              as: BureauOnboarder
            - call: "POST /clients/${cl_alpha}/activate"
              payload: {}
              as: BureauOnboarder
            - call: "POST /clients"
              payload: { legal_name: "Beta Client", ein: "99-9999999" }
              as: BureauOnboarder
              captures: { cl_beta: $.data.id }
            - call: "POST /wage-statements"
              payload: { client_id: "${cl_alpha}", tax_year: 2026, employee_ref: "E-1", wages_cents: 1000000, withheld_cents: 200000 }
              as: BureauTaxFiler
              captures: { ws_alpha: $.data.id }
          trigger:
            - call: "POST /wage-statements/${ws_alpha}/issue"
              payload: {}
              as: ClientPayrollAdmin
              as_user_id: "${cl_beta}"
              captures: { err_cross: $.data.error_id }
          assert:
            - "the cross-client issue attempt returns 403 and err_cross == ERR_FORBIDDEN"
            - "err_cross != ERR_YEAR_NOT_CLOSED — identity authorization (priority 3) precedes the temporal year gate (priority 17)"
            - "WageStatement.${ws_alpha}.status == DRAFT (unchanged)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: semiweekly_due_date_wednesday_paydate_vs_friday_paydate
        grounds:
          - calculations.deposit_due_date
          - entities.TaxDeposit.fields.due_date
        distinguishing_aspect: |
          Metric: statutory due-date bucket boundary. A Wednesday pay date
          (2026-09-02) belongs to the Wed/Thu/Fri bucket -> due the FOLLOWING
          Wednesday (2026-09-09), NOT this week's Friday; a Tuesday pay date
