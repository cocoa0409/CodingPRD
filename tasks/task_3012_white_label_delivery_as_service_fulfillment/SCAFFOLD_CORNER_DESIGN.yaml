      - name: quote_rejected_when_no_active_policy
        claim_type: Violation -> Error
        grounds:
          - errors.ERR_NO_ACTIVE_PRICING_POLICY
        distinguishing_aspect: "Quote requested while the merchant's only policy is still DRAFT fails 409 ERR_NO_ACTIVE_PRICING_POLICY — a policy existing is not enough, it must be ACTIVE."
        test_recipe:
