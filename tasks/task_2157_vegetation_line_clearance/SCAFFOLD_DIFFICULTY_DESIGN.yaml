            - "HazardTree.${ht_ok}.assessed_by_user_id == arborist-b"

  # ===================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: crew_booking_half_open_interval_with_sixty_minute_travel_buffer
        grounds:
          - validations[priority=50]
          - errors[ERR_CREW_SCHEDULE_CONFLICT]
          - entities.CrewAssignment.fields.start_at
          - entities.CrewAssignment.fields.end_at
        distinguishing_aspect: |
          Interval semantics A on the CREW resource: half-open [start_at, end_at) plus a 60-minute
          travel buffer appended to the earlier booking's end. A booking starting at 16:30 after an
          08:00-16:00 booking collides because 16:30 < 17:00, while a booking starting at exactly
          17:00 is accepted because the buffered comparison is strict (<, not <=).
        test_recipe:
          setup:
            - "Circuit CKT-A, RELEASED plan, one RELEASED span WO-U."
            - "Crew CRW-1 already holds a SCHEDULED booking on WO-U from 2026-08-03T08:00:00Z to 2026-08-03T16:00:00Z."
          setup_api_calls:
            - call: "POST /vm/prescriptions"
              payload: { voltage_class: "DISTRIBUTION_12KV", growth_zone: "RAPID", base_cycle_years: 4, clearance_radius_ft: 10, effective_from: "2026-01-01" }
              as: UtilityForester
              captures: { presc_id: $.data.id }
            - call: "POST /vm/prescriptions/${presc_id}/activate"
              payload: {}
              as: UtilityForester
            - call: "POST /vm/circuits"
              payload: { circuit_code: "CKT-A", voltage_class: "DISTRIBUTION_12KV", growth_zone: "RAPID", customer_count: 1200, last_trim_completed_on: "2024-03-15" }
              as: UtilityForester
              captures: { ckt_id: $.data.id }
            - call: "POST /vm/work-plans"
              payload: { circuit_id: "${ckt_id}", program_year: 2026, planned_span_miles: 10, budget_cents: 5000000 }
              as: UtilityForester
              captures: { wp_id: $.data.id }
            - call: "POST /vm/work-orders"
              payload: { work_plan_id: "${wp_id}", span_miles: 2.5, billing_method: "UNIT_PRICE", planned_unit_count: 200 }
              as: ContractorPlanner
              captures: { wo_id: $.data.id }
            - call: "POST /vm/work-orders/${wo_id}/map"
              payload: { clearance_radius_ft: 12 }
              as: ContractorPlanner
            - call: "POST /vm/work-plans/${wp_id}/release"
              payload: {}
              as: ContractorPlanner
            - call: "POST /vm/work-orders/${wo_id}/release"
              payload: {}
              as: ContractorPlanner
            - call: "POST /vm/crews"
              payload: { crew_code: "CRW-1", crew_type: "BUCKET", headcount: 3, hourly_rate_cents: 8533, home_district: "NORTH" }
              as: ContractorPlanner
              captures: { crew1_id: $.data.id }
            - call: "POST /vm/crew-assignments"
              payload: { work_order_id: "${wo_id}", crew_id: "${crew1_id}", start_at: "2026-08-03T08:00:00Z", end_at: "2026-08-03T16:00:00Z" }
              as: ContractorPlanner
              captures: { ca_1: $.data.id }
          trigger:
            - call: "POST /vm/crew-assignments"
              payload: { work_order_id: "${wo_id}", crew_id: "${crew1_id}", start_at: "2026-08-03T16:30:00Z", end_at: "2026-08-03T20:00:00Z" }
              as: ContractorPlanner
              captures: { err: $.data.error_id }
            - call: "POST /vm/crew-assignments"
              payload: { work_order_id: "${wo_id}", crew_id: "${crew1_id}", start_at: "2026-08-03T17:00:00Z", end_at: "2026-08-03T20:00:00Z" }
              as: ContractorPlanner
              captures: { ca_ok: $.data.id }
          assert:
            - "the 16:30 booking returns HTTP 409 with error_id == ERR_CREW_SCHEDULE_CONFLICT"
            - "the 17:00 booking returns HTTP 201 and CrewAssignment.${ca_ok}.status == SCHEDULED"
            - "CrewAssignment.${ca_1}.status == SCHEDULED"
            - "GET /vm/crew-assignments with crew_id ${crew1_id} returns exactly 2 rows"

      - name: herbicide_permit_closed_interval_capacity_two_per_circuit
        grounds:
          - validations[priority=51]
          - errors[ERR_PERMIT_WINDOW_CONFLICT]
          - entities.HerbicidePermit.fields.window_start
          - entities.HerbicidePermit.fields.window_end
        distinguishing_aspect: |
          Interval semantics B on the CIRCUIT resource, geometrically different from the crew rule:
          CLOSED [window_start, window_end] with no buffer but an aggregate capacity of 2 mutually
          overlapping permits, plus an absolute same-chemical ban. A third overlapping permit is
          rejected, and a GLYPHOSATE window starting exactly on the day the earlier GLYPHOSATE
          window ends is also rejected because both endpoints are inclusive.
        test_recipe:
          setup:
            - "Circuit CKT-A whose ACTIVE prescription has herbicide_allowed true."
            - "Permit P1 GLYPHOSATE [2026-08-05, 2026-08-20] is APPROVED."
            - "Permit P2 TRICLOPYR [2026-08-15, 2026-08-25] is APPROVED, so two permits already overlap on 2026-08-15 through 2026-08-20."
          setup_api_calls:
            - call: "POST /vm/prescriptions"
              payload: { voltage_class: "DISTRIBUTION_12KV", growth_zone: "RAPID", base_cycle_years: 4, clearance_radius_ft: 10, effective_from: "2026-01-01", herbicide_allowed: true }
              as: UtilityForester
              captures: { presc_id: $.data.id }
            - call: "POST /vm/prescriptions/${presc_id}/activate"
              payload: {}
              as: UtilityForester
            - call: "POST /vm/circuits"
              payload: { circuit_code: "CKT-A", voltage_class: "DISTRIBUTION_12KV", growth_zone: "RAPID", customer_count: 1200, last_trim_completed_on: "2024-03-15" }
              as: UtilityForester
              captures: { ckt_id: $.data.id }
            - call: "POST /vm/herbicide-permits"
              payload: { circuit_id: "${ckt_id}", chemical_code: "GLYPHOSATE", applicator_license_no: "LIC-100", buffer_ft: 25, window_start: "2026-08-05", window_end: "2026-08-20" }
              as: CertifiedArborist
              as_user_id: "arborist-a"
              captures: { p1: $.data.id }
            - call: "POST /vm/herbicide-permits/${p1}/decision"
              payload: { outcome: "APPROVE" }
              as: UtilityForester
            - call: "POST /vm/herbicide-permits"
              payload: { circuit_id: "${ckt_id}", chemical_code: "TRICLOPYR", applicator_license_no: "LIC-100", buffer_ft: 25, window_start: "2026-08-15", window_end: "2026-08-25" }
              as: CertifiedArborist
              as_user_id: "arborist-a"
              captures: { p2: $.data.id }
            - call: "POST /vm/herbicide-permits/${p2}/decision"
              payload: { outcome: "APPROVE" }
              as: UtilityForester
            - call: "POST /vm/herbicide-permits"
              payload: { circuit_id: "${ckt_id}", chemical_code: "IMAZAPYR", applicator_license_no: "LIC-100", buffer_ft: 25, window_start: "2026-08-18", window_end: "2026-08-19" }
              as: CertifiedArborist
              as_user_id: "arborist-a"
              captures: { p3: $.data.id }
            - call: "POST /vm/herbicide-permits"
              payload: { circuit_id: "${ckt_id}", chemical_code: "GLYPHOSATE", applicator_license_no: "LIC-100", buffer_ft: 25, window_start: "2026-08-20", window_end: "2026-08-22" }
              as: CertifiedArborist
              as_user_id: "arborist-a"
              captures: { p4: $.data.id }
            - call: "POST /vm/herbicide-permits"
              payload: { circuit_id: "${ckt_id}", chemical_code: "AMINOPYRALID", applicator_license_no: "LIC-100", buffer_ft: 25, window_start: "2026-08-21", window_end: "2026-08-22" }
              as: CertifiedArborist
              as_user_id: "arborist-a"
              captures: { p5: $.data.id }
          trigger:
            - call: "POST /vm/herbicide-permits/${p3}/decision"
              payload: { outcome: "APPROVE" }
              as: UtilityForester
              captures: { err3: $.data.error_id }
            - call: "POST /vm/herbicide-permits/${p4}/decision"
              payload: { outcome: "APPROVE" }
              as: UtilityForester
              captures: { err4: $.data.error_id }
            - call: "POST /vm/herbicide-permits/${p5}/decision"
              payload: { outcome: "APPROVE" }
              as: UtilityForester
          assert:
            - "the P3 decision returns HTTP 409 with error_id == ERR_PERMIT_WINDOW_CONFLICT"
            - "HerbicidePermit.${p3}.status == REQUESTED"
            - "the P4 decision returns HTTP 409 with error_id == ERR_PERMIT_WINDOW_CONFLICT"
            - "HerbicidePermit.${p4}.status == REQUESTED"
            - "the P5 decision returns HTTP 200 and HerbicidePermit.${p5}.status == APPROVED"
            - "HerbicidePermit.${p1}.status == APPROVED and HerbicidePermit.${p2}.status == APPROVED"

