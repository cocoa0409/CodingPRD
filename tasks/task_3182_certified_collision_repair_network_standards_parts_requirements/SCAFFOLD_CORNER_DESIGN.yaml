scaffold_corner_design:
- section: entities
  instances:
  - name: shop_creation_required_fields
    claim_type: required_fields
    grounds:
    - entities.Shop.fields.legal_name
    - endpoints[POST /network/shops]
    distinguishing_aspect: POST /network/shops missing legal_name fails with ERR_INVALID_REQUEST (400); a complete payload returns 201 with certification_status APPLICANT, lifetime_repair_count 0, version
      1.
    test_recipe:
      setup:
      - empty DB; clock at default
      setup_api_calls: []
      trigger:
      - call: POST /network/shops
        payload:
          state_code: CA
          zip_code: '90001'
          latitude: 34.05
          longitude: -118.24
        as: NetworkAdmin
        captures:
          err: $.data.error_id
      - call: POST /network/shops
        payload:
          legal_name: Complete Body
          state_code: CA
          zip_code: '90001'
          latitude: 34.05
          longitude: -118.24
        as: NetworkAdmin
        captures:
          shop_id: $.data.id
      assert:
      - 'First call: error_id == ERR_INVALID_REQUEST, HTTP 400'
      - 'Second call: HTTP 201; Shop.${shop_id}.certification_status == APPLICANT; lifetime_repair_count == 0; version == 1; locator_hidden == false'
  - name: shop_default_structural_capability_false
    claim_type: defaults
    grounds:
    - entities.Shop.fields.structural_capability
    distinguishing_aspect: Omitting structural_capability on shop creation applies the default false.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /network/shops
        payload:
          legal_name: Default Body
          state_code: CA
          zip_code: '90002'
          latitude: 34.0
          longitude: -118.2
        as: NetworkAdmin
        captures:
          shop_id: $.data.id
      assert:
      - Shop.${shop_id}.structural_capability == false
  - name: entity_not_found_returns_404
    claim_type: not_found
    grounds:
    - errors[ERR_NOT_FOUND]
    - endpoints[GET /network/shops/{shop_id}]
    distinguishing_aspect: GET with a random UUID that does not exist returns ERR_NOT_FOUND (404).
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: GET /network/shops/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2
        as: NetworkAdmin
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_NOT_FOUND and HTTP 404
  - name: shop_list_pagination_envelope
    claim_type: listing
    grounds:
    - response_envelope.pagination_fields
    - endpoints[GET /network/shops]
    distinguishing_aspect: List endpoint honors limit/offset and returns total_count and has_more per the fixed envelope.
    test_recipe:
      setup:
      - three shops exist
      setup_api_calls:
      - call: POST /network/shops
        payload:
          legal_name: P1
          state_code: CA
          zip_code: '90003'
          latitude: 34.0
          longitude: -118.2
        as: NetworkAdmin
      - call: POST /network/shops
        payload:
          legal_name: P2
          state_code: CA
          zip_code: '90004'
          latitude: 34.0
          longitude: -118.2
        as: NetworkAdmin
      - call: POST /network/shops
        payload:
          legal_name: P3
          state_code: CA
          zip_code: '90005'
          latitude: 34.0
          longitude: -118.2
        as: NetworkAdmin
      trigger:
      - call: GET /network/shops?limit=2&offset=0
        as: NetworkAdmin
      assert:
      - response contains meta.api_request_id, response_type == array, data length 2
      - total_count == 3 and has_more == true
  - name: computed_field_input_ignored
    claim_type: computed_fields
    grounds:
    - entities.Shop.fields.live_compliance_score
    distinguishing_aspect: Client-supplied values for computed fields (live_compliance_score, locator_hidden) are ignored on create.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /network/shops
        payload:
          legal_name: Sneaky Body
          state_code: CA
          zip_code: '90006'
          latitude: 34.0
          longitude: -118.2
          live_compliance_score: 999.0
          locator_hidden: true
        as: NetworkAdmin
        captures:
          shop_id: $.data.id
      assert:
      - Shop.${shop_id}.locator_hidden == false (computed default, input ignored)
      - HTTP 201
- section: state_machines
  instances:
  - name: requirement_initial_state_draft
    claim_type: initial_state
    grounds:
    - state_machines.Requirement
    distinguishing_aspect: A new Requirement starts in DRAFT and cannot be retired-referenced by audits until PUBLISHED.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls:
      - call: POST /network/requirements
        payload:
          requirement_code: EQ-INIT-01
          category: EQUIPMENT
          description: x
          severity_if_failed: MINOR
          effective_from: '2026-09-02T00:00:00Z'
        as: NetworkAdmin
        captures:
          req_id: $.data.id
      trigger:
      - call: GET /network/requirements/${req_id}
        as: NetworkAdmin
      assert:
      - Requirement.${req_id}.status == DRAFT
      - Requirement.${req_id}.requirement_version == 1
  - name: terminal_state_lockdown_decertified_shop
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.Shop
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: A DECERTIFIED shop accepts no further posture transitions; repair-order creation is rejected.
    test_recipe:
      setup:
      - Shop suspended at least 90 days (suspended 2026-09-16 via overdue CRITICAL corrective action), no open repair orders; decertified at 2026-12-16
      setup_api_calls:
      - call: POST /network/shops
        payload:
          legal_name: Doomed Body
          state_code: AK
          zip_code: '99501'
          latitude: 61.22
          longitude: -149.9
          structural_capability: false
        as: NetworkAdmin
        captures:
          shop_id: $.data.id
          shop_v: $.data.version
      - call: POST /network/requirements
        payload:
          requirement_code: ST-DOOM-01
          category: STRUCTURAL
          description: x
          severity_if_failed: CRITICAL
          effective_from: '2026-08-01T00:00:00Z'
        as: NetworkAdmin
        captures:
          req_id: $.data.id
      - call: POST /network/requirements/${req_id}/publish
        payload: {}
        as: NetworkAdmin
      - call: POST /network/shops/${shop_id}/attestations
        payload:
          requirement_id: ${req_id}
          evidence_uri: s3://ev/d.pdf
          expected_shop_version: ${shop_v}
        as: ShopManager
        as_user_id: ${shop_id}
        captures:
          att_id: $.data.id
      - call: POST /network/shops/${shop_id}/certification-cycles
        payload:
          window_start: '2026-09-01T00:00:00Z'
          window_end: '2027-08-31T23:59:59Z'
        as: NetworkAdmin
        captures:
          cyc1: $.data.id
      - call: POST /network/certification-cycles/${cyc1}/audits
        payload:
          scheduled_start: '2026-09-01T01:00:00Z'
          scheduled_end: '2026-09-01T09:00:00Z'
        as: NetworkAuditor
        as_user_id: aud-1
        captures:
          audit1: $.data.id
      - call: POST /network/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T02:00:00Z'
        as: NetworkAdmin
      - call: POST /network/audits/${audit1}/begin
        payload: {}
        as: NetworkAuditor
        as_user_id: aud-1
      - call: POST /network/audits/${audit1}/issue-findings
        payload:
          findings: []
        as: NetworkAuditor
        as_user_id: aud-1
      - call: POST /network/shops/${shop_id}/certification-cycles
        payload:
          window_start: '2027-09-01T00:00:00Z'
          window_end: '2028-08-31T23:59:59Z'
        as: NetworkAdmin
        captures:
          cyc2: $.data.id
      - call: POST /network/certification-cycles/${cyc2}/audits
        payload:
          scheduled_start: '2026-09-05T09:00:00Z'
          scheduled_end: '2026-09-05T17:00:00Z'
        as: NetworkAuditor
        as_user_id: aud-1
        captures:
          audit2: $.data.id
      - call: POST /network/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-05T10:00:00Z'
        as: NetworkAdmin
      - call: POST /network/audits/${audit2}/begin
        payload: {}
        as: NetworkAuditor
        as_user_id: aud-1
      - call: POST /network/audits/${audit2}/issue-findings
        payload:
          findings:
          - attestation_id: ${att_id}
            severity: CRITICAL
        as: NetworkAuditor
        as_user_id: aud-1
      - call: POST /network/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-16T00:00:00Z'
        as: NetworkAdmin
      - call: POST /network/_clock/set_current_utc
        payload:
          to_iso8601: '2026-12-16T00:00:00Z'
        as: NetworkAdmin
      trigger:
      - call: POST /network/shops/${shop_id}/decertify
        payload: {}
        as: NetworkAdmin
      - call: GET /network/shops/${shop_id}
        as: NetworkAdmin
        captures:
          shop_v9: $.data.version
      - call: POST /network/shops/${shop_id}/repair-orders
        payload:
          expected_shop_version: ${shop_v9}
          vin: 1HGCV1F34LA000015
          vehicle_model_year: 2015
          estimate_total_cents: 1000
          assigned_technician_id: 8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2
        as: ShopManager
        as_user_id: ${shop_id}
        captures:
          err: $.data.error_id
      assert:
      - 'Decertify succeeds: Shop.${shop_id}.certification_status == DECERTIFIED'
      - "Repair order creation on a DECERTIFIED shop is rejected (ERR_NOT_FOUND for the bogus technician or ERR_SHOP_NOT_CERTIFIED \u2014 pinned observable: 4xx, no order created)"
  - name: corrective_action_invalid_from_open_verify
    claim_type: invalid_transition
    grounds:
    - state_machines.CorrectiveAction
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: verify on an OPEN (never submitted) corrective action is rejected with ERR_INVALID_STATE.
    test_recipe:
      setup:
      - Shop with MAJOR finding issued; corrective action OPEN
      setup_api_calls:
      - call: POST /network/shops
        payload:
          legal_name: Early Verify Body
          state_code: HI
          zip_code: '96801'
          latitude: 21.31
          longitude: -157.86
          structural_capability: false
        as: NetworkAdmin
        captures:
          shop_id: $.data.id
          shop_v: $.data.version
      - call: POST /network/requirements
        payload:
          requirement_code: TL-EV-01
          category: TOOLING
          description: x
          severity_if_failed: MAJOR
          effective_from: '2026-08-01T00:00:00Z'
        as: NetworkAdmin
        captures:
          req_id: $.data.id
      - call: POST /network/requirements/${req_id}/publish
        payload: {}
        as: NetworkAdmin
      - call: POST /network/shops/${shop_id}/attestations
        payload:
          requirement_id: ${req_id}
          evidence_uri: s3://ev/e.pdf
          expected_shop_version: ${shop_v}
        as: ShopManager
        as_user_id: ${shop_id}
        captures:
          att_id: $.data.id
      - call: POST /network/shops/${shop_id}/certification-cycles
        payload:
          window_start: '2026-09-01T00:00:00Z'
          window_end: '2027-08-31T23:59:59Z'
        as: NetworkAdmin
        captures:
          cyc: $.data.id
      - call: POST /network/certification-cycles/${cyc}/audits
        payload:
          scheduled_start: '2026-09-02T09:00:00Z'
          scheduled_end: '2026-09-02T17:00:00Z'
        as: NetworkAuditor
        as_user_id: aud-1
        captures:
          aud: $.data.id
      - call: POST /network/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-02T10:00:00Z'
        as: NetworkAdmin
      - call: POST /network/audits/${aud}/begin
        payload: {}
        as: NetworkAuditor
        as_user_id: aud-1
      - call: POST /network/audits/${aud}/issue-findings
        payload:
          findings:
          - attestation_id: ${att_id}
            severity: MAJOR
        as: NetworkAuditor
        as_user_id: aud-1
      - call: GET /network/audits/${aud}/corrective-actions
        as: NetworkAuditor
        captures:
          ca: $.data[0].id
      trigger:
      - call: POST /network/corrective-actions/${ca}/verify
        payload:
          verdict: VERIFIED
        as: NetworkAuditor
        as_user_id: aud-2
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_STATE (cannot verify an OPEN action; SUBMITTED is required)
  - name: technician_deactivate_blocked_by_open_orders
    claim_type: precondition_enforcement
    grounds:
    - state_machines.Technician.CURRENT_to_INACTIVE
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: Deactivating a technician who is the lead on an open (ESTIMATE) repair order is rejected; deactivation succeeds after the order is voided.
    test_recipe:
      setup:
      - CERTIFIED shop; technician T lead on order O1 in ESTIMATE
      setup_api_calls:
      - call: POST /network/shops
        payload:
          legal_name: Deactivate Body
          state_code: WV
          zip_code: '25301'
          latitude: 38.35
          longitude: -81.63
          structural_capability: false
        as: NetworkAdmin
        captures:
          shop_id: $.data.id
          shop_v: $.data.version
      - call: POST /network/shops/${shop_id}/certification-cycles
        payload:
          window_start: '2026-09-01T00:00:00Z'
          window_end: '2027-08-31T23:59:59Z'
        as: NetworkAdmin
        captures:
          cyc: $.data.id
      - call: POST /network/certification-cycles/${cyc}/audits
        payload:
          scheduled_start: '2026-09-01T01:00:00Z'
          scheduled_end: '2026-09-01T09:00:00Z'
        as: NetworkAuditor
        as_user_id: aud-1
        captures:
          aud: $.data.id
      - call: POST /network/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T02:00:00Z'
        as: NetworkAdmin
      - call: POST /network/audits/${aud}/begin
        payload: {}
        as: NetworkAuditor
        as_user_id: aud-1
      - call: POST /network/audits/${aud}/issue-findings
        payload:
          findings: []
        as: NetworkAuditor
        as_user_id: aud-1
      - call: POST /network/shops/${shop_id}/technicians
        payload:
          full_name: De Act
          tech_role: NON_STRUCTURAL
        as: ShopManager
        as_user_id: ${shop_id}
        captures:
          tech_id: $.data.id
      - call: GET /network/shops/${shop_id}
        as: ShopManager
        as_user_id: ${shop_id}
        captures:
          shop_v2: $.data.version
      - call: POST /network/shops/${shop_id}/repair-orders
        payload:
          expected_shop_version: ${shop_v2}
          vin: 1HGCV1F34LA000024
          vehicle_model_year: 2015
          estimate_total_cents: 10000
          assigned_technician_id: ${tech_id}
        as: ShopManager
        as_user_id: ${shop_id}
        captures:
          order_id: $.data.id
      trigger:
      - call: POST /network/technicians/${tech_id}/deactivate
        payload: {}
        as: ShopManager
        as_user_id: ${shop_id}
        captures:
          err: $.data.error_id
      - call: POST /network/repair-orders/${order_id}/void
        payload: {}
        as: ShopManager
        as_user_id: ${shop_id}
      - call: POST /network/technicians/${tech_id}/deactivate
        payload: {}
        as: ShopManager
        as_user_id: ${shop_id}
      assert:
      - First deactivate rejected (open order references the technician; ERR_INVALID_STATE or ERR_DECERTIFY_BLOCKED-class 4xx)
      - After voiding the order, deactivate succeeds and Technician.${tech_id}.status == INACTIVE
- section: calculations
  instances:
  - name: technician_currency_vacuous_full_progress
    claim_type: correct_result
    grounds:
    - calculations.technician_currency
    distinguishing_aspect: A technician whose role has zero required active courses has curriculum_progress_pct == 100.0 (vacuous satisfaction), and flips PROVISIONAL -> CURRENT on recompute.
    test_recipe:
      setup:
      - CERTIFIED shop; no TrainingCourse rows exist for role REFINISH
      setup_api_calls:
      - call: POST /network/shops
        payload:
          legal_name: Vacuous Body
          state_code: ME
          zip_code: '04101'
          latitude: 43.66
          longitude: -70.26
          structural_capability: false
        as: NetworkAdmin
        captures:
          shop_id: $.data.id
      - call: POST /network/shops/${shop_id}/technicians
        payload:
          full_name: Va Cu
          tech_role: REFINISH
        as: ShopManager
        as_user_id: ${shop_id}
        captures:
          tech_id: $.data.id
      trigger:
      - call: GET /network/technicians/${tech_id}
        as: ShopManager
        as_user_id: ${shop_id}
      assert:
      - Technician.${tech_id}.curriculum_progress_pct == 100.0 (required_count == 0 -> vacuous 100)
      - Technician.${tech_id}.status == CURRENT
  - name: certification_grade_with_escalation_penalty
    claim_type: constants_applied
    grounds:
    - calculations.certification_grade_from_findings
    distinguishing_aspect: One MAJOR finding (5 points) plus one ESCALATED warranty claim (+3 penalty) = 8 points -> grade C, proving ESCALATION_PENALTY_EACH (3) is applied on top of severity points.
    test_recipe:
      setup:
      - Shop CERTIFIED with a completed repair in WARRANTY_ACTIVE; a WARRANTY claim escalated; then an audit with one MAJOR finding, corrective action verified, cycle closed
      setup_api_calls:
      - call: POST /network/shops
        payload:
          legal_name: Penalty Body
          state_code: VT
          zip_code: '05401'
          latitude: 44.48
          longitude: -73.21
          structural_capability: false
        as: NetworkAdmin
        captures:
          shop_id: $.data.id
          shop_v: $.data.version
      - call: POST /network/shops/${shop_id}/certification-cycles
