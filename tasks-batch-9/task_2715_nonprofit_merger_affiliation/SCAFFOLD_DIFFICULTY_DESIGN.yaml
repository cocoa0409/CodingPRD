          transferred_charitable_asset_value_cents is exactly AG_PETITION_THRESHOLD_CENTS
          = 500000000. The comparison is >=, so the boundary value itself already
          requires an APPROVAL_PETITION: a NOTICE at exactly the threshold must be
          rejected with ERR_AG_FILING_TYPE_MISMATCH, and the petition that replaces it
