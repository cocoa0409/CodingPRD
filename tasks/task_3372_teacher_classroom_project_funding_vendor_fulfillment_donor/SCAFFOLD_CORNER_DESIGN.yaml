            - "Donation.${dn1}.status == CHOICE_PENDING (the choice can still be retried against a valid fund)"
            - "Donor.${d1}.lifetime_reallocated_cents == 0"

      - name: funding_window_below_minimum_returns_invalid_request
        claim_type: Violation → Error
        grounds:
