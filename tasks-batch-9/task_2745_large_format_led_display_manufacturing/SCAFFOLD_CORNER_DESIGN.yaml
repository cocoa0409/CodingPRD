      - name: the_second_late_response_suspends_the_contract_for_good
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers
          - calculations.case_response_deadline
          - state_machines.ServiceContract
          - errors.ERR_CONTRACT_NOT_ACTIVE
        distinguishing_aspect: |
          sla_breach_count is a cumulative counter with a hard boundary at
          MAX_SLA_BREACHES = 2, and the suspension it triggers is one-way: the
          SUSPENDED -> ACTIVE edge requires sla_breach_count < 2, so restocking
          spares after the second breach can never revive the contract even though
          the spare condition is satisfied. The recipe keeps one spare reserved
          throughout precisely so the OTHER disjunct of the suspension precondition
          (spare_reserved_count < spare_required_count) stays false and the
          threshold under test is unambiguous — an implementation that suspends on
          the first breach, or that lets a later reservation flip the contract back
          to ACTIVE, fails on a different assertion each way.
