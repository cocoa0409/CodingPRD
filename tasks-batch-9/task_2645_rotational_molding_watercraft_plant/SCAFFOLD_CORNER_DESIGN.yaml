              as_user_id: "admin-1"
              captures: { bay: $.data.id }
            - *cvA_wh
            - &cvN_lot
              call: "POST /resin-lots"
              payload: { lot_code: "LOT-CVN", resin_grade: "HDPE_LINEAR", melt_index_g10min: 4.00, color_code: "SEAFOAM", color_delta_e: 0.50, additive_package_code: "UV12", regrind_pct_by_mass: 10.00, cost_cents_per_kg: 200, received_kg: 100.000, expires_on: "2027-12-31" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { lot: $.data.id }
            - &cvN_po
              call: "POST /production-orders"
              payload: { order_code: "PO-CVN", product_model_id: "${pm}", target_warehouse_id: "${wh}", ordered_qty: 2 }
