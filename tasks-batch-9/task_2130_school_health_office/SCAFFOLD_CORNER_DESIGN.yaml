        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / conflict_a_visit_state_outranks_consent_not_granted
          rationale: "That §1.8 instance asserts ERR_VISIT_INVALID_STATE as the winning error when a dose is prepared against an OPEN encounter."

      - name: error_school_coverage_unavailable_trigger
