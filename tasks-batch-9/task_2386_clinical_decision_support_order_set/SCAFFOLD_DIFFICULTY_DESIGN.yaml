            - "${w2_fires_final} == 40, ${w2_rate_final} == 0.9000 (the added firing is accepted, so override_count stays 36), ${w2_index_final} == 72.00 — the index is byte-identical to the rejected run, isolating fire_count as the sole discriminator"
            - "${life_final} == RETIRED and ${retired_at} == 2026-09-01T00:00:00Z (the logical clock has not advanced since activation)"
            - "AlertBurdenWindow.${w1_id}.state == FINALIZED and AlertBurdenWindow.${w2_id}.state == FINALIZED once the alert retires"

      - name: boundary_zero_firing_window_is_no_signal_not_high_value
        boundary_value: "fire_count == 0 versus HIGH_VALUE_INDEX_CEILING = 25.00"
        grounds:
          - calculations.alert_burden_index
          - entities.AlertBurdenWindow.fields.burden_classification
          - endpoints.POST_/cds/alerts/{id}/burden-windows/{window_id}/close
          - entities.Alert.fields.unwindowed_fire_count
        distinguishing_aspect: |
          A different metric on a different endpoint from the retirement-floor boundary:
          here the boundary is the empty-input-set edge of the classification ladder,
          exercised on the burden-window close endpoint. burden_index computes to 0.00,
          which is <= the 25.00 HIGH_VALUE ceiling, so an implementation that evaluates
