      - name: stale_agreement_version_refuses_the_second_draw
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[consumable-draw-stale-agreement]
          - errors[ERR_STALE_AGREEMENT_VERSION]
          - calculations.service_reserve_balance
        distinguishing_aspect: |
          Two draws posted from one read of the agreement is exactly the overdraw the guard exists to
          stop: the first draw of 3 elements accrues 1830000 and advances the agreement version, so the
