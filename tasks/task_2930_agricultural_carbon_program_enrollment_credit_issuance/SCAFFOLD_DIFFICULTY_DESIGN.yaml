      - name: commitment_period_half_open_interval_adjacency
        grounds:
          - validations[priority 17 ERR_COMMITMENT_PERIOD_OVERLAP]
          - entities.Enrollment.fields.start_crop_year
          - entities.Enrollment.fields.commitment_years
          - endpoints[POST /enrollments]
        distinguishing_aspect: |
          The occupied resource here is a half-open crop-year interval on ONE field rather than a
          rectangle: an enrollment starting 2026 for 5 years occupies [2026, 2031), so a new
          enrollment beginning in 2030 intersects and must be refused while one beginning exactly
          in 2031 - the incumbent's exclusive end year - must be admitted. Both attempts name a
          DIFFERENT practice_code from the incumbent, so the per-(field, practice) uniqueness rule
          at priority 22 is out of play and the temporal rule at priority 17 is the only thing
          being measured. An inclusive-end implementation rejects the legal 2031 enrollment.
        test_recipe:
          setup:
            - "Clock starts at 2026-06-01T00:00:00Z, then advances to 2030-06-01T00:00:00Z so the current crop year is 2030 and start_crop_year may be 2030 or 2031."
