            - "HOP 2 boundary: HeaterUnit.${uc_id}.build_status is still SHIPPED, hold_reason_code == null and label_status == APPLIED"
            - "HOP 3: ProductModel.${m1_id}.held_unit_count == 2 and release_status == RESTRICTED"
            - "HOP 3 boundary: ProductModel.${m1_id}.certification_status is still CERTIFIED (the certification dimension is untouched)"
      - name: lining_fail_quarantine_cascades_sibling_lots
        grounds:
          - state_machines.TankLot.LINED_to_LINING_REJECTED
          - state_machines.GlassLiningBatch.FIRED_to_QUARANTINED
          - state_machines.TankLot.LINING_VERIFIED_to_LINING_REJECTED
          - calculations.lot_holiday_density
          - entities.GlassLiningBatch.fields.rejected_lot_count
          - entities.TankLot.fields.cascade_rejected
        distinguishing_aspect: >
          A different trigger and a different chain from the supplier instance: quality data on ONE lot
          reaches a SIBLING lot laterally via their shared furnace batch (TankLot tl2 -> GlassLiningBatch
          rejected_lot_count -> batch QUARANTINED -> sibling TankLot tl3). The cascade only fires because the
          threshold is crossed on this request (count 1 -> 2), so the very same inspection payload applied one
          request earlier changes nothing outside its own lot. The lateral victim is also distinguishable from
          the direct one: tl3 gets cascade_rejected true, rework_count +1 and NO scrap, which is what later
          blocks its rework-reversal, while tl2 gets cascade_rejected false and scrapped_quantity 10.
