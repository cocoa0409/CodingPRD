    instances:
      - name: venue_capacity_vip_double_count_at_boundary
        grounds:
          - calculations.occupancy_projection
          - errors[ERR_VENUE_AT_CAPACITY]
        distinguishing_aspect: |
          Metric = effective_occupancy (with VIP double-count) on
          POST /tickets/{id}/redeem. With venue_capacity=5 and on-site
          {GA,GA,VIP} (effective=4), one more GA admit succeeds (eff=5);
          attempting yet another redeem MUST reject because 5 >= 5. The
          >= (not >) boundary is the falsifiable observable.
