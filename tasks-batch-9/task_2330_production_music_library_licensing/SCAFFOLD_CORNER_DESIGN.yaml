      - name: occ_stale_composition_version_on_license_issuance
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.complexity_layers[optimistic_concurrency]
          - concurrency_rules[license_issuance_guards_composition_rights]
          - errors[ERR_COMPOSITION_VERSION_CONFLICT]
        distinguishing_aspect: |
          The stale-version leg of concurrency rule 1 — an intervening exclusive issuance moves
          Composition.version, and the holder of the earlier read is refused with 412 even though a
          temporal rule is also violated.
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / issuance_occ_conflict_outranks_temporal_quote_expiry"
          rationale: |
            That difficulty instance already drives POST /music-library/licenses with a stale
            expected_composition_version produced by an intervening write and asserts
            ERR_COMPOSITION_VERSION_CONFLICT, plus the fresh-version retry. Repeating it here would only
            re-test priority 8 with different names.

      - name: cascading_side_effects_multi_level_chain_end_to_end
        claim_type: cascade_down
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - state_machines[UsageReport].ACCEPTED
        distinguishing_aspect: |
          A single write must complete an ordered multi-level chain (report → overage → pool → per-composer
          ledger → blanket counters) with every level observable afterwards.
        excluded_because:
          difficulty_instance: "transitive_cascade / usage_report_acceptance_five_step_pool_cascade"
          rationale: |
            The five-step cascade, its ordering sensitivity (overage must fold into the pool before the
            largest-remainder split) and the resulting ledger entries are asserted level by level in that
            difficulty instance; a second end-to-end walk would duplicate it exactly.

      - name: cascade_ordering_on_agreement_termination
        claim_type: cascade_down
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - state_machines[ComposerAgreement].TERMINATED
        distinguishing_aspect: |
          Termination fans out to a different subtree than report acceptance — works withdraw, open sync
          requests decline with CATALOG_WITHDRAWN and licensee reservations release — and only
          non-terminal children may be touched.
        excluded_because:
          difficulty_instance: "transitive_cascade / agreement_termination_withdraw_decline_credit_release_cascade"
          rationale: |
            That instance already terminates an ACTIVE agreement carrying works in several child states and
            asserts which children move, which are left alone because they are already terminal, and the
            exact credit released on the licensee.

      - name: dual_variant_accrual_versus_cash_delta_on_switch
        claim_type: variant_divergence
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations[statement_settlement].variants
        distinguishing_aspect: |
          The two declared variants must produce different gross figures from identical data, and the
          delta must be exactly the ledger amount whose cash_recognized_at is still null.
        excluded_because:
          difficulty_instance: "dual_variant_calc / statement_accrual_vs_cash_basis_diverges_on_uncollected_performance"
          rationale: |
            Both variants are computed over one ledger in that instance, with the per-field delta and the
            follow-up showing the CASH figure rising once cash_recognized_at is stamped; there is nothing
            left for a second variant test to distinguish.

