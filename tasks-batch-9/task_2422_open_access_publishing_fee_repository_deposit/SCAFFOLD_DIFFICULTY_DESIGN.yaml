# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2422 — Open Access Publishing Fee & Repository Deposit
# 9 rule_ids x 2 instances = 18 instances. Every numeric assert below was
# produced by executing the matching §1.3 formula with its declared constants.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_ta_full_vs_final_author_pays_coverage_window
        grounds:
          - calculations.apc_coverage_determination
          - entities.EligibilityDetermination.fields.basis
          - entities.EligibilityDetermination.fields.reference_date
          - entities.AgreementCoverage.fields.covered_until
          - state_machines.Article.ELIGIBILITY_CHECKED_to_SELF_FUNDED
          - endpoints[POST /articles/{id}/publication]
        distinguishing_aspect: |
          The PROVISIONAL variant dates coverage at accepted_on 2026-09-15 (inside the
          coverage line's closed window ending 2026-09-30) and yields route TA_FULL with
          covered_amount_cents 285000, while the FINAL variant dates the identical article
          at publication_date 2026-11-20 (outside that window, still inside the agreement's
          own window) and yields route AUTHOR_PAYS with covered_amount_cents 0 — the
          divergence is caused solely by reference_date selection, not by any data change.
        test_recipe:
          setup:
            - "logical clock at 2026-09-20T00:00:00Z"
            - "publisher MERID, CLEARED (never screened), one HYBRID journal with list_apc_cents 380000 and required_embargo_months 12"
            - "author with ELIGIBLE_FACULTY affiliation, appointment 2024-01-01..2028-12-31, annual cap 500000"
            - "ACTIVE agreement TA-MERID-2027 over [2026-07-01, 2026-12-01), quota 1, discount 0.25, covering HYBRID"
            - "one FULL_APC coverage line on the journal, closed window 2026-07-01..2026-09-30"
            - "article accepted 2026-09-15, no grant, already carrying one PROVISIONAL determination"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: AgreementAdmin
            - call: "POST /publishers"
              payload: { name: "Meridian Academic Press", publisher_code: "MERID", country_code: "NL" }
              as: AgreementAdmin
              captures: { p1_id: $.data.id, p1_v: $.data.version }
            - call: "POST /journals"
              payload: { publisher_id: "${p1_id}", issn: "2041-1723", title: "Meridian Journal of Cell Signalling", oa_model: "HYBRID", list_apc_cents: 380000, required_embargo_months: 12 }
              as: AgreementAdmin
              captures: { j1_id: $.data.id }
            - call: "POST /authors"
              payload: { full_name: "Ines Ravel", email: "ines.ravel@uni.example", orcid: "0000-0002-1825-0097", department_code: "BIO", affiliation_status: "ELIGIBLE_FACULTY", appointment_from: "2024-01-01", appointment_until: "2028-12-31", annual_cap_cents: 500000 }
              as: AgreementAdmin
              captures: { au1_id: $.data.id }
            - call: "POST /transformative-agreements"
              payload: { publisher_id: "${p1_id}", agreement_code: "TA-MERID-2027", effective_from: "2026-07-01", effective_until: "2026-12-01", article_quota: 1, discount_pct: 0.25, covered_oa_models: ["HYBRID"], expected_publisher_version: "${p1_v}" }
              as: AgreementAdmin
              captures: { ta1_id: $.data.id }
            - call: "POST /transformative-agreements/${ta1_id}/coverages"
              payload: { journal_id: "${j1_id}", coverage_type: "FULL_APC", covered_from: "2026-07-01", covered_until: "2026-09-30" }
              as: AgreementAdmin
              captures: { cov1_id: $.data.id }
            - call: "POST /transformative-agreements/${ta1_id}/activation"
              payload: {}
              as: AgreementAdmin
            - call: "POST /articles"
              payload: { journal_id: "${j1_id}", corresponding_author_id: "${au1_id}", manuscript_title: "Calcium gating in hepatic stellate cells", accepted_on: "2026-09-15" }
              as: ScholCommLibrarian
              captures: { a1_id: $.data.id }
            - call: "POST /articles/${a1_id}/eligibility-checks"
              payload: { basis: "PROVISIONAL" }
              as: ScholCommLibrarian
              captures:
                det1_id: $.data.id
                det1_basis: $.data.basis
                det1_ref: $.data.reference_date
                det1_route: $.data.route
                det1_base: $.data.list_base_cents
                det1_covered: $.data.covered_amount_cents
                det1_share: $.data.author_share_cents
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-20T00:00:00Z" }
              as: ScholCommLibrarian
          trigger:
            - call: "POST /articles/${a1_id}/publication"
              payload: { publication_date: "2026-11-20" }
              as: ScholCommLibrarian
              captures: { a1_route_final: $.data.eligibility_route, a1_covered_final: $.data.covered_amount_cents }
          assert:
            - "${det1_basis} == PROVISIONAL"
            - "${det1_ref} == 2026-09-15"
            - "${det1_route} == TA_FULL"
            - "${det1_base} == 380000"
            - "${det1_covered} == 285000"
            - "${det1_share} == 0"
            - "Article.${a1_id}.determination_count == 2"
            - "${a1_route_final} == AUTHOR_PAYS"
            - "${a1_covered_final} == 0"
            - "Article.${a1_id}.author_share_cents == 380000"
            - "Article.${a1_id}.funding_status == SELF_FUNDED"
            - "Article.${a1_id}.publication_date == 2026-11-20"
            - "GET /eligibility-determinations?article_id=${a1_id} returns exactly 2 rows; the row with sequence_no == 2 has basis == FINAL, reference_date == 2026-11-20, route == AUTHOR_PAYS, list_base_cents == 380000, covered_amount_cents == 0, author_share_cents == 380000, determination_reason == NO_COVERAGE_AUTHOR_PAYS, quota_position == null"
            - "the row with sequence_no == 1 still has basis == PROVISIONAL, route == TA_FULL, covered_amount_cents == 285000 (append-only: the PROVISIONAL row is never rewritten)"

      - name: encumbrance_vs_cash_basis_fund_utilisation_divergence
        grounds:
          - calculations.fund_utilisation_by_basis
          - calculations.annual_spend_and_negotiation_analytics
          - entities.FundAllocation.fields.status
          - entities.Author.fields.apc_committed_cents
          - entities.Author.fields.apc_disbursed_cents
          - endpoints[GET /analytics/annual-spend]
        distinguishing_aspect: |
          Against one ENCUMBERED FundAllocation of 300000 and zero DISBURSED lines,
          basis=ENCUMBRANCE reports total_allocated_cents 300000 while basis=CASH reports
          total_allocated_cents 0 — a 300000-cent delta on identical stored rows, driven by
          the status filter {ENCUMBERED, DISBURSED} versus {DISBURSED} alone.
        test_recipe:
          setup:
            - "logical clock at 2026-08-05T00:00:00Z (fiscal year 2027)"
            - "publisher HALDEN with a FULLY_OA journal, list_apc_cents 300000"
            - "author ELIGIBLE_FACULTY, annual cap 500000; GOLD_OA funder with apc_allowable true; ACTIVE grant"
            - "APC fund OA-CENTRAL-2027, FY2027 window 2026-07-01..2027-06-30, budget 1000000, priority 1, per-article cap 300000"
            - "article accepted 2026-08-05, determination route FUND_APC with eligible_request_cents 300000"
            - "fund request for 300000 approved, producing one ENCUMBERED allocation; no invoice raised, so nothing is DISBURSED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: AgreementAdmin
            - call: "POST /publishers"
              payload: { name: "Halden Open Science", publisher_code: "HALDEN", country_code: "NO" }
              as: AgreementAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /journals"
              payload: { publisher_id: "${p2_id}", issn: "2515-0847", title: "Halden Journal of Open Metabolism", oa_model: "FULLY_OA", list_apc_cents: 300000, required_embargo_months: 12 }
              as: AgreementAdmin
              captures: { j2_id: $.data.id }
            - call: "POST /authors"
              payload: { full_name: "Tomas Berg", email: "tomas.berg@uni.example", orcid: "0000-0001-5109-3700", department_code: "MET", affiliation_status: "ELIGIBLE_FACULTY", appointment_from: "2024-01-01", appointment_until: "2028-12-31", annual_cap_cents: 500000 }
              as: AgreementAdmin
              captures: { au2_id: $.data.id }
            - call: "POST /funders"
              payload: { name: "National Research Council", funder_code: "NRC", mandate_type: "GOLD_OA", max_embargo_months: 6, deposit_deadline_days: 90, license_required: "CC_BY", apc_allowable: true }
              as: AgreementAdmin
              captures: { f2_id: $.data.id }
            - call: "POST /grants"
              payload: { funder_id: "${f2_id}", pi_author_id: "${au2_id}", grant_number: "NRC-2026-118", award_from: "2026-01-01", award_until: "2027-12-31", apc_budget_cents: 900000 }
              as: AgreementAdmin
              captures: { g2_id: $.data.id }
            - call: "POST /apc-funds"
              payload: { fund_code: "OA-CENTRAL-2027", fiscal_year: 2027, period_from: "2026-07-01", period_to: "2027-06-30", total_budget_cents: 1000000, priority_rank: 1, eligible_affiliation_statuses: ["ELIGIBLE_FACULTY"], per_article_cap_cents: 300000 }
              as: FundManager
              captures: { fd2_id: $.data.id }
            - call: "POST /articles"
              payload: { journal_id: "${j2_id}", corresponding_author_id: "${au2_id}", grant_id: "${g2_id}", manuscript_title: "Flux balance under nitrogen limitation", accepted_on: "2026-08-05" }
              as: ScholCommLibrarian
              captures: { a2_id: $.data.id }
            - call: "POST /articles/${a2_id}/eligibility-checks"
              payload: { basis: "PROVISIONAL" }
              as: ScholCommLibrarian
              captures: { det2_route: $.data.route, det2_eligible: $.data.eligible_request_cents }
            - call: "POST /fund-requests"
              payload: { article_id: "${a2_id}", requested_cents: 300000, justification: "Gold OA fee, NRC mandate requires immediate CC BY availability." }
              as: CorrespondingAuthor
              as_user_id: "${au2_id}"
              captures: { fr2_id: $.data.id }
            - call: "POST /fund-requests/${fr2_id}/start-review"
              payload: {}
              as: ScholCommLibrarian
            - call: "POST /fund-requests/${fr2_id}/decision"
              payload: { decision: "APPROVE" }
              as: FundManager
              as_user_id: "fm-approver-01"
              captures: { fr2_approved: $.data.approved_cents }
          trigger:
            - call: "GET /analytics/annual-spend"
              payload: { fiscal_year: 2027, basis: "ENCUMBRANCE" }
              as: FundManager
              captures:
                enc_alloc: $.data.total_allocated_cents
                enc_committed: $.data.total_committed_cents
                enc_disbursed: $.data.total_disbursed_cents
            - call: "GET /analytics/annual-spend"
              payload: { fiscal_year: 2027, basis: "CASH" }
              as: FundManager
              captures:
                cash_alloc: $.data.total_allocated_cents
                cash_committed: $.data.total_committed_cents
                cash_disbursed: $.data.total_disbursed_cents
          assert:
            - "${det2_route} == FUND_APC"
            - "${det2_eligible} == 300000"
            - "${fr2_approved} == 300000"
            - "${enc_alloc} == 300000"
            - "${enc_committed} == 300000"
            - "${enc_disbursed} == 0"
            - "${cash_alloc} == 0"
            - "${cash_committed} == 300000"
            - "${cash_disbursed} == 0"
            - "${enc_alloc} - ${cash_alloc} == 300000"
            - "APCFund.${fd2_id}.committed_cents == 300000"
            - "APCFund.${fd2_id}.spent_cents == 0"
            - "APCFund.${fd2_id}.available_cents == 700000"
            - "APCFund.${fd2_id}.status == OPEN"
            - "Author.${au2_id}.apc_committed_cents == 300000"
            - "Author.${au2_id}.apc_disbursed_cents == 0"
            - "GET /fund-requests/${fr2_id}/allocations returns exactly 1 row with amount_cents == 300000, sequence_index == 1, status == ENCUMBERED"

  - rule_id: combinatorial_formula
    instances:
      - name: invoice_round_per_component_then_sum_at_half_cent_net
        grounds:
          - calculations.invoice_expected_amount_validation
          - entities.PublisherInvoice.fields.net_cents
          - entities.PublisherInvoice.fields.vat_cents
          - entities.PublisherInvoice.fields.expected_amount_cents
          - state_machines.PublisherInvoice.RECEIVED_to_VALIDATED
        distinguishing_aspect: |
          base 250500 at entitled discount 0.175 gives net 250500*0.825 = 206662.5, which
          round_half_up pins to 206663 before VAT; the pinned order (round net, then round
          VAT on the rounded net, then sum with no further rounding) yields
          expected_amount_cents 219063, whereas the forbidden sum-then-round order yields
          219062 — a one-cent separation that only the correct composition order produces.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "publisher CORVID with a HYBRID journal, list_apc_cents 250500"
            - "ACTIVE agreement over [2026-07-01, 2027-07-01), quota 5, discount 0.175, covering HYBRID"
            - "FULL_APC coverage on that journal, 2026-07-01..2027-06-30"
            - "article accepted 2026-08-05 with a TA_FULL determination (discount_pct_applied 0.175, list_base_cents 250500)"
            - "invoice CORVID-2026-4417 received for 219063 cents, claimed discount 0.175, VAT 0.06"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: AgreementAdmin
            - call: "POST /publishers"
              payload: { name: "Corvid Scientific", publisher_code: "CORVID", country_code: "GB" }
              as: AgreementAdmin
              captures: { p3_id: $.data.id, p3_v: $.data.version }
            - call: "POST /journals"
              payload: { publisher_id: "${p3_id}", issn: "1748-9326", title: "Corvid Reviews of Applied Optics", oa_model: "HYBRID", list_apc_cents: 250500, required_embargo_months: 12 }
              as: AgreementAdmin
              captures: { j3_id: $.data.id }
            - call: "POST /authors"
              payload: { full_name: "Rhea Calder", email: "rhea.calder@uni.example", orcid: "0000-0003-4444-1212", department_code: "PHY", affiliation_status: "ELIGIBLE_FACULTY", appointment_from: "2024-01-01", appointment_until: "2028-12-31", annual_cap_cents: 500000 }
              as: AgreementAdmin
              captures: { au3_id: $.data.id }
            - call: "POST /transformative-agreements"
              payload: { publisher_id: "${p3_id}", agreement_code: "TA-CORVID-2027", effective_from: "2026-07-01", effective_until: "2027-07-01", article_quota: 5, discount_pct: 0.175, covered_oa_models: ["HYBRID"], expected_publisher_version: "${p3_v}" }
              as: AgreementAdmin
              captures: { ta3_id: $.data.id }
            - call: "POST /transformative-agreements/${ta3_id}/coverages"
              payload: { journal_id: "${j3_id}", coverage_type: "FULL_APC", covered_from: "2026-07-01", covered_until: "2027-06-30" }
              as: AgreementAdmin
            - call: "POST /transformative-agreements/${ta3_id}/activation"
              payload: {}
              as: AgreementAdmin
            - call: "POST /articles"
              payload: { journal_id: "${j3_id}", corresponding_author_id: "${au3_id}", manuscript_title: "Sub-cent metrology of dielectric mirrors", accepted_on: "2026-08-05" }
              as: ScholCommLibrarian
              captures: { a3_id: $.data.id }
            - call: "POST /articles/${a3_id}/eligibility-checks"
              payload: { basis: "PROVISIONAL" }
              as: ScholCommLibrarian
              captures: { det3_route: $.data.route, det3_disc: $.data.discount_pct_applied, det3_base: $.data.list_base_cents, det3_covered: $.data.covered_amount_cents }
            - call: "POST /publisher-invoices"
              payload: { publisher_id: "${p3_id}", article_id: "${a3_id}", invoice_number: "CORVID-2026-4417", invoice_amount_cents: 219063, currency: "USD", claimed_discount_pct: 0.175, vat_pct: 0.06, invoice_date: "2026-08-10" }
              as: ScholCommLibrarian
              captures: { inv3_id: $.data.id }
          trigger:
            - call: "POST /publisher-invoices/${inv3_id}/validation"
              payload: {}
              as: ScholCommLibrarian
              captures:
                inv3_net: $.data.net_cents
                inv3_vat: $.data.vat_cents
                inv3_expected: $.data.expected_amount_cents
                inv3_variance: $.data.variance_cents
                inv3_outcome: $.data.validation_outcome
                inv3_status: $.data.status
          assert:
            - "${det3_route} == TA_FULL"
            - "${det3_disc} == 0.175"
            - "${det3_base} == 250500"
            - "${det3_covered} == 206663"
            - "PublisherInvoice.${inv3_id}.entitled_discount_pct == 0.175"
            - "${inv3_net} == 206663"
            - "${inv3_vat} == 12400"
            - "${inv3_expected} == 219063"
            - "${inv3_expected} != 219062"
            - "${inv3_variance} == 0"
            - "${inv3_outcome} == MATCH"
            - "${inv3_status} == VALIDATED"
            - "PublisherInvoice.${inv3_id}.dispute_reason == null"

      - name: volume_tier_from_paid_invoices_only_at_tier1_boundary
        grounds:
          - calculations.publisher_volume_discount_tier
          - calculations.invoice_expected_amount_validation
          - entities.PublisherInvoice.fields.entitled_discount_pct
          - state_machines.PublisherInvoice.APPROVED_FOR_PAYMENT_to_PAID
          - validations[priority=14]
        distinguishing_aspect: |
          Two PAID invoices contribute net 250000 each, so prior_paid_net_cents for the third
          invoice is exactly TIER1_MIN_CENTS 500000; the inclusive boundary selects tier 0.10
          and expected_amount_cents 238500, whereas an exclusive `>` comparison selects tier
          0.00 and 265000 — and the tier is computed from PAID invoices only, excluding the
          invoice being priced.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "publisher SELKIE with no transformative agreement, one FULLY_OA journal at list_apc_cents 250000"
            - "author ELIGIBLE_FACULTY with no grant, so every article routes AUTHOR_PAYS (eligible_request_cents 0, funding_status SELF_FUNDED)"
            - "invoices SELKIE-1001 and SELKIE-1002 each for 265000 cents driven all the way to PAID (net 250000 each)"
            - "invoice SELKIE-1003 received for 238500 cents with claimed discount 0.10"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: AgreementAdmin
            - call: "POST /publishers"
              payload: { name: "Selkie Press", publisher_code: "SELKIE", country_code: "IE" }
              as: AgreementAdmin
              captures: { p4_id: $.data.id }
            - call: "POST /journals"
              payload: { publisher_id: "${p4_id}", issn: "2050-084X", title: "Selkie Journal of Marine Ecology", oa_model: "FULLY_OA", list_apc_cents: 250000, required_embargo_months: 12 }
              as: AgreementAdmin
              captures: { j4_id: $.data.id }
            - call: "POST /authors"
              payload: { full_name: "Maeve Lynch", email: "maeve.lynch@uni.example", orcid: "0000-0002-7654-3210", department_code: "MAR", affiliation_status: "ELIGIBLE_FACULTY", appointment_from: "2024-01-01", appointment_until: "2028-12-31", annual_cap_cents: 500000 }
              as: AgreementAdmin
              captures: { au4_id: $.data.id }
            - call: "POST /articles"
              payload: { journal_id: "${j4_id}", corresponding_author_id: "${au4_id}", manuscript_title: "Kelp forest recovery after storm disturbance", accepted_on: "2026-08-05" }
              as: ScholCommLibrarian
              captures: { a4a_id: $.data.id }
            - call: "POST /articles/${a4a_id}/eligibility-checks"
              payload: { basis: "PROVISIONAL" }
              as: ScholCommLibrarian
              captures: { det4a_route: $.data.route }
            - call: "POST /articles"
              payload: { journal_id: "${j4_id}", corresponding_author_id: "${au4_id}", manuscript_title: "Grazing pressure on juvenile kelp", accepted_on: "2026-08-05" }
              as: ScholCommLibrarian
              captures: { a4b_id: $.data.id }
            - call: "POST /articles/${a4b_id}/eligibility-checks"
              payload: { basis: "PROVISIONAL" }
              as: ScholCommLibrarian
            - call: "POST /articles"
              payload: { journal_id: "${j4_id}", corresponding_author_id: "${au4_id}", manuscript_title: "Sediment turbidity and holdfast survival", accepted_on: "2026-08-05" }
              as: ScholCommLibrarian
              captures: { a4c_id: $.data.id }
            - call: "POST /articles/${a4c_id}/eligibility-checks"
              payload: { basis: "PROVISIONAL" }
              as: ScholCommLibrarian
            - call: "POST /publisher-invoices"
              payload: { publisher_id: "${p4_id}", article_id: "${a4a_id}", invoice_number: "SELKIE-1001", invoice_amount_cents: 265000, currency: "USD", claimed_discount_pct: 0.0, vat_pct: 0.06, invoice_date: "2026-08-10" }
              as: ScholCommLibrarian
              captures: { inv4a_id: $.data.id, inv4a_net: $.data.net_cents }
            - call: "POST /publisher-invoices/${inv4a_id}/validation"
              payload: {}
              as: ScholCommLibrarian
            - call: "POST /publisher-invoices/${inv4a_id}/payment-approval"
              payload: {}
              as: FundManager
              as_user_id: "fm-approver-01"
            - call: "POST /publisher-invoices/${inv4a_id}/payment"
              payload: { payment_reference: "WIRE-77001" }
              as: FundManager
              as_user_id: "fm-payer-02"
              captures: { inv4a_status: $.data.status }
            - call: "POST /publisher-invoices"
              payload: { publisher_id: "${p4_id}", article_id: "${a4b_id}", invoice_number: "SELKIE-1002", invoice_amount_cents: 265000, currency: "USD", claimed_discount_pct: 0.0, vat_pct: 0.06, invoice_date: "2026-08-10" }
              as: ScholCommLibrarian
              captures: { inv4b_id: $.data.id, inv4b_net: $.data.net_cents }
            - call: "POST /publisher-invoices/${inv4b_id}/validation"
              payload: {}
              as: ScholCommLibrarian
            - call: "POST /publisher-invoices/${inv4b_id}/payment-approval"
              payload: {}
              as: FundManager
              as_user_id: "fm-approver-01"
            - call: "POST /publisher-invoices/${inv4b_id}/payment"
              payload: { payment_reference: "WIRE-77002" }
              as: FundManager
              as_user_id: "fm-payer-02"
              captures: { inv4b_status: $.data.status }
            - call: "POST /publisher-invoices"
              payload: { publisher_id: "${p4_id}", article_id: "${a4c_id}", invoice_number: "SELKIE-1003", invoice_amount_cents: 238500, currency: "USD", claimed_discount_pct: 0.10, vat_pct: 0.06, invoice_date: "2026-08-10" }
              as: ScholCommLibrarian
              captures: { inv4c_id: $.data.id }
          trigger:
            - call: "POST /publisher-invoices/${inv4c_id}/validation"
              payload: {}
              as: ScholCommLibrarian
              captures:
                inv4c_entitled: $.data.entitled_discount_pct
                inv4c_net: $.data.net_cents
                inv4c_vat: $.data.vat_cents
                inv4c_expected: $.data.expected_amount_cents
                inv4c_variance: $.data.variance_cents
                inv4c_outcome: $.data.validation_outcome
                inv4c_status: $.data.status
          assert:
            - "${det4a_route} == AUTHOR_PAYS"
            - "Article.${a4a_id}.funding_status == SELF_FUNDED"
            - "${inv4a_net} == 250000"
            - "${inv4b_net} == 250000"
            - "${inv4a_status} == PAID"
