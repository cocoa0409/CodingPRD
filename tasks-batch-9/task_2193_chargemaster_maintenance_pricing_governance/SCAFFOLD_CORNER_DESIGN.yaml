          setup:
            - "Clock 2026-09-01T00:00:00Z. Facility created with the default 40000 bp limit so the item can be activated at ratio 24000."
            - "Item CDM-1001 driven to ACTIVE: cost 100000, gross 240000 (tier 24000 bp), facility aggregates 240000 / 100000 / 24000 bp."
            - "The limit is then tightened to 19000 bp by PATCH using the live facility version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /chargemaster/facilities"
