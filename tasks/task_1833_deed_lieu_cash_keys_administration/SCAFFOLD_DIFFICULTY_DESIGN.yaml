            - { call: "POST /property-solutions/cases/${case2}/certify-marketing", as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /property-solutions/title-commitments", payload: { case_id: "${case1}" }, as: TitleOfficer, as_user_id: to_1, captures: { tc1: $.data.id } }
