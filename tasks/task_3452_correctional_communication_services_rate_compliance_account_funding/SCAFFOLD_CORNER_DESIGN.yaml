      - name: escheat_remit_before_claim_window_fails_then_remitted_at_boundary
        claim_type: Violation → Error
        grounds:
          - state_machines.Account.escheat_NOTICE_SENT_to_REMITTED
          - errors.ERR_CLAIM_WINDOW_OPEN
          - invariants.closure_balance_partition
        distinguishing_aspect: "The claim window is a >= check against notice + claim_window_days: remit at +44 days is 409 ERR_CLAIM_WINDOW_OPEN; at exactly +45 days it settles the account — ESCHEAT_REMITTANCE -900 plus CLOSURE_FEE -100 zero the frozen 1000-cent closure balance with no drift."
        test_recipe:
          setup:
