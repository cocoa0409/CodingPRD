  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_program_version_blocks_the_second_reservation_until_re_read
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.reservation-create-stale-program
          - errors.ERR_STALE_PROGRAM_VERSION
          - endpoints.POST_/rebate-projects/{id}/reservations
        distinguishing_aspect: |
          The stale-version rejection is the ONLY thing standing between two
          legitimately approved projects: reserving for project B is valid on
          its own terms (open program, approved project, budget available), so
          the 412 must come from expected_program_version alone, and it must
          leave the program's budget untouched so that the retry with the fresh
          version succeeds with the same payload.
        test_recipe:
          setup:
            - "One OPEN program (budget 50000000) with the BASE MEASURE catalog item and one ENROLLED_ACTIVE contractor."
            - "Two verified LOW-tier households, each with an APPROVED assessment and a project reviewed APPROVE (each worth 800000)."
