              as: RehabSpecialist
              as_user_id: "rs-1"
              captures: { sol_id: $.data.id }
            - call: "POST /rehab/bids"
              payload: { solicitation_id: "${sol_id}", contractor_id: "${c1_id}", amount_cents: 3200000, proposed_start_date: "2026-09-05", proposed_end_date: "2026-10-30" }
              as: Contractor
              as_user_id: "${c1_id}"
              captures: { bid1_id: $.data.id }
            - call: "POST /rehab/bid-solicitations/${sol_id}/tabulate"
              payload: {}
              as: RehabSpecialist
              as_user_id: "rs-1"
            - call: "POST /rehab/bid-solicitations/${sol_id}/award"
              payload: { bid_id: "${bid1_id}" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /rehab/loans"
              payload: { application_id: "${app_id}", structure_type: "DEFERRED" }
              as: LoanOfficer
              as_user_id: "lo-1"
              captures: { loan_id: $.data.id }
          trigger:
            - call: "POST /rehab/loans/${loan_id}/record-lien"
              payload: { lien_position: 2, recorded_instrument_number: "INS-2026-0C1" }
              as: LoanOfficer
              as_user_id: "lo-1"
              captures: { err_lead: $.data.error_id }
            - call: "POST /rehab/applications/${app_id}/lead-clearance"
              payload: { risk_assessment_completed: true, hazard_control_method: "ABATEMENT" }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /rehab/loans/${loan_id}/record-lien"
              payload: { lien_position: 2, recorded_instrument_number: "INS-2026-0C1" }
              as: LoanOfficer
              as_user_id: "lo-1"
              captures: { err_historic: $.data.error_id }
            - call: "POST /rehab/applications/${app_id}/historic-clearance"
              payload: { shpo_review_outcome: "NO_ADVERSE_EFFECT" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /rehab/loans/${loan_id}/record-lien"
              payload: { lien_position: 2, recorded_instrument_number: "INS-2026-0C1" }
              as: LoanOfficer
              as_user_id: "lo-1"
          assert:
            - "first attempt: HTTP 409 with error_id ERR_LEAD_CLEARANCE_REQUIRED while compliance_posture == DUAL_HOLD"
            - "first attempt leaves RehabLoan.${loan_id}.status == STRUCTURED, lien_recorded_at == null and ProgramYear.${py_id}.committed_amount_cents == 0"
            - "after the lead clearance: RehabApplication.${app_id}.compliance_posture == HISTORIC_HOLD and lead_hazard_control_method == ABATEMENT"
            - "second attempt: HTTP 409 with error_id ERR_HISTORIC_CLEARANCE_REQUIRED, not ERR_LEAD_CLEARANCE_REQUIRED"
            - "after the historic clearance: RehabApplication.${app_id}.compliance_posture == CLEARED_WITH_PROTOCOL and shpo_review_outcome == NO_ADVERSE_EFFECT"
            - "third attempt: HTTP 200, RehabLoan.${loan_id}.status == LIEN_RECORDED with lien_position 2 and lien_recorded_at set"
            - "third attempt: RehabApplication.${app_id}.workflow_state == UNDER_CONSTRUCTION"
            - "third attempt: ProgramYear.${py_id}.committed_amount_cents == 3200000, disbursed_amount_cents == 25000, uncommitted_amount_cents == 46775000"
            - "RehabLoan.${loan_id}.principal_cents == 3225000 and disbursed_cents == 25000"

      - name: award_is_gated_by_the_winning_contractors_approved_list_status
        grounds:
          - validations.priority_27.ERR_CONTRACTOR_NOT_APPROVED
          - state_machines.Contractor.APPROVED_to_PROBATION
          - state_machines.Contractor.PROBATION_to_APPROVED
          - state_machines.BidSolicitation.TABULATED_to_AWARDED
          - entities.Contractor.fields.approved_list_status
          - entities.Contractor.fields.active_award_count
        distinguishing_aspect: |
          A different dependent entity pair, (BidSolicitation <- Contractor.approved_list_status):
          the solicitation is in TABULATED and the selected bid is RESPONSIVE with rank 1, so nothing
          about the solicitation itself blocks the award; demoting the contractor to PROBATION — which
          deliberately does not withdraw bids — is the only reason the award fails with
          ERR_CONTRACTOR_NOT_APPROVED, and reinstating the contractor makes the identical request
