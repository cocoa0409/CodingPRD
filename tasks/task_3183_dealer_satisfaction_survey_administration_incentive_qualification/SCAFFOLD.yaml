endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/survey/_clock/set_current_utc"
    description: "Advance the logical clock. Server starts at 2026-09-01T00:00:00Z and never falls back to wall-clock."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects:
      - "Logical clock set; lazy OVERDUE re-evaluation for ActionPlan runs on next read of any plan"

  # --- Regions ---
