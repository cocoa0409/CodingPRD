              payload: { site_id: "${site_ce_id}", mrn: "CE-2000", last_name: "Abernathy", first_name: "Roland", dob: "1959-05-19", sex: "M", ssn_last4: "2020", postal_code: "87102", phone: "5055550101", clinical_element_count: 30 }
              as: IdentityAnalyst
              captures: { rec_ceb_id: $.data.id, rec_ceb_eid: $.data.enterprise_id }
            - call: "POST /mpi/candidate-pairs"
              payload: { record_a_id: "${rec_cea_id}", record_b_id: "${rec_ceb_id}", rule_set_id: "${rs_base_id}", score_variant: "STRICT" }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
              captures: { pair_ce_id: $.data.id, pair_ce_qs: $.data.queue_state }
          trigger:
            - call: "POST /mpi/merge-operations"
              payload: { pair_id: "${pair_ce_id}", survivor_record_id: "${rec_cea_id}", subsumed_record_id: "${rec_ceb_id}", rationale: "Same patient, immediate visibility check." }
              as: IdentityStewardApprover
              as_user_id: "steward-1"
              captures: { merge_ce_id: $.data.id }
            - call: "GET /mpi/patient-records/${rec_cea_id}"
              payload: {}
              as: IdentityStewardApprover
              as_user_id: "steward-1"
            - call: "GET /mpi/patient-records/${rec_ceb_id}"
              payload: {}
              as: IdentityStewardApprover
              as_user_id: "steward-1"
            - call: "GET /mpi/candidate-pairs/${pair_ce_id}"
              payload: {}
              as: IdentityStewardApprover
              as_user_id: "steward-1"
            - call: "GET /mpi/contamination-remediations?merge_operation_id=${merge_ce_id}"
              payload: {}
              as: PrivacyOfficer
              as_user_id: "officer-1"
            - call: "GET /mpi/registration-sites/${site_ce_id}"
              payload: {}
              as: MpiAdmin
              as_user_id: "admin-1"
          assert:
            - "${pair_ce_qs} == \"RECOMMENDED_MERGE\" and ${rec_cea_eid} != ${rec_ceb_eid}"
            - "Trigger call 1 response alone already contains: state == COMPLETED, moved_clinical_element_count == 30, subsumed_prior_enterprise_id == ${rec_ceb_eid}, recompressed_record_mrns == [], propagation_task_count == 0, completed_at == \"2026-08-01T00:00:00.000Z\" and reversal_deadline_at == \"2026-10-30T00:00:00Z\""
            - "Trigger call 2: clinical_element_count == 35, subsumed_member_count == 1, integrity_state == REMEDIATION_PENDING (the merge moved more than 25 elements) and identity_state == ACTIVE"
            - "Trigger call 3: identity_state == MERGED_SUBSUMED, clinical_element_count == 0, survivor_record_id == ${rec_cea_id} and enterprise_id == ${rec_cea_eid}"
            - "Trigger call 4: queue_state == RESOLVED_MERGED and approved_by_user_id == \"steward-1\""
            - "Trigger call 5: exactly 1 row with source_type == MERGE, state == OPEN, element_count_subject == 30 and record_id == ${rec_cea_id}"
            - "Trigger call 6: active_record_count == 1 and flagged_record_count == 0 (REMEDIATION_PENDING is not a fraud flag)"
            - "No re-read is ever needed: the first response and every read above agree on the first attempt"
