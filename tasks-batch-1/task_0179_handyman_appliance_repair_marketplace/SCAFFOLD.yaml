    roles: [PlatformAdmin, Customer, Pro, Dispatcher]
    code: 200
    input: ["pro_id?", "service_zip_code?", "booked_job_id?", "limit?", "offset?"]
    output: DispatchWindow[]
    side_effects: []
  - method: POST
    path: "/dispatch-windows/{id}/book"
    description: "book the accepted job into this window (INSTANT_QUOTED/ESTIMATED->SCHEDULED); OCC-guarded"
    roles: [Customer]
    code: 200
    input: [job_id, expected_dispatchwindow_version]
    output: DispatchWindow
    side_effects:
      - "sets hold_state=BOOKED, booked_job_id=job_id; sets Job.pro_id=window.pro_id, Job.status=SCHEDULED"
      - "increments DispatchWindow.version by 1"

  # ---- Invoice ----
  - method: POST
    path: "/jobs/{id}/invoices"
    description: "pro creates a DRAFT invoice for an IN_PROGRESS job"
    roles: [Pro]
    code: 201
    input: []
    output: Invoice
    side_effects: ["creates Invoice(status=DRAFT)"]
  - method: GET
    path: "/jobs/{id}/invoices"
    description: "list invoices for a job (FK reverse-reachability for Invoice.job_id)"
    roles: [PlatformAdmin, Customer, Pro, Dispatcher]
    code: 200
    input: []
    output: Invoice[]
    side_effects: []
  - method: GET
    path: "/invoices/{id}"
    description: "fetch an invoice (subtotals, total, balance_due, status)"
    roles: [PlatformAdmin, Customer, Pro, Dispatcher]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: POST
    path: "/invoices/{id}/issue"
    description: "pro issues the invoice (DRAFT->ISSUED), computing subtotals/total per invoice_total"
    roles: [Pro]
    code: 200
    input: []
    output: Invoice
    side_effects: ["computes labor/parts/trip/total; sets balance_due_cents=total_cents"]
  - method: POST
    path: "/invoices/{id}/pay"
    description: "customer pays the issued invoice in full (ISSUED->PAID)"
    roles: [Customer]
    code: 200
    input: [amount_cents]
    output: Invoice
    side_effects: ["amount_paid_cents += amount_cents; recomputes balance_due_cents"]

  # ---- Dispute ----
  - method: POST
    path: "/disputes"
    description: "customer files a dispute against a paid/refunded invoice"
    roles: [Customer]
    code: 201
    input: ["job_id", "invoice_id", "reason", "requested_refund_cents", "refund_destination?"]
    output: Dispute
    side_effects: ["creates Dispute(status=OPEN)"]
  - method: GET
    path: "/disputes/{id}"
    description: "fetch a dispute"
    roles: [PlatformAdmin, Customer]
    code: 200
    input: []
    output: Dispute
    side_effects: []
  - method: GET
    path: "/disputes"
    description: "list disputes, filterable by job_id / invoice_id"
    roles: [PlatformAdmin, Customer]
    code: 200
    input: ["job_id?", "invoice_id?", "limit?", "offset?"]
    output: Dispute[]
    side_effects: []
  - method: POST
    path: "/disputes/{id}/review"
    description: "admin moves a dispute into review (OPEN->UNDER_REVIEW)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Dispute
    side_effects: []
  - method: POST
    path: "/disputes/{id}/withdraw"
    description: "customer withdraws a dispute (OPEN/UNDER_REVIEW->WITHDRAWN)"
    roles: [Customer]
    code: 200
    input: []
    output: Dispute
    side_effects: []
  - method: POST
    path: "/disputes/{id}/resolve"
    description: "admin approves/denies a dispute (UNDER_REVIEW->APPROVED/DENIED), applying refund cascade"
    roles: [PlatformAdmin]
    code: 200
    input: ["decision", "approved_refund_cents?"]
    output: Dispute
    side_effects:
      - "APPROVE: sets approved_refund_cents; Invoice.refunded_cents += approved_refund_cents; recomputes balance_due"
      - "APPROVE full: Invoice PAID->REFUNDED; WALLET dest credits Customer.wallet_credit_cents"
      - "APPROVE WORK_INCOMPLETE: auto-cancels open warranty callback Job; decrements Pro.callback_job_count; recomputes callback_rate"
      - "DENY: sets approved_refund_cents=0"

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "test-only: set the server's current UTC clock for warranty/window evaluation"
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["pins server now() for subsequent warranty-window and dispatch evaluations"]

# ===========================================================================
# 1.6 Error Code Catalog
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid auth headers on a protected endpoint"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "acting role not permitted for this operation per §1.7"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "entity_backed role acting on a resource it does not own"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a referenced path id or FK does not resolve"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "requested transition not defined from the target resource's current state"
  - id: ERR_PRO_NOT_CLEARED
    http: 422
    condition: "estimating/assigned Pro is not background_check_status=CLEARED"
  - id: ERR_LICENSE_REQUIRED
    http: 422
    condition: "category requires a license but the Pro's license_status != VERIFIED or license expired"
  - id: ERR_SKILL_TAG_MISMATCH
    http: 422
    condition: "Pro does not carry every skill_tag the category requires"
  - id: ERR_INSTANT_QUOTE_INELIGIBLE
    http: 422
    condition: "instant quote requested on a non-eligible category or a warranty-callback job"
  - id: ERR_ZIP_MISMATCH
    http: 422
    condition: "DispatchWindow.service_zip_code != Job.address_zip_code at booking"
  - id: ERR_VISIT_OUTSIDE_WINDOW
    http: 422
    condition: "WorkVisit.arrived_at outside the booked window's half-open interval"
  - id: ERR_WINDOW_OVERLAP
    http: 409
    condition: "new DispatchWindow overlaps an existing non-RELEASED window of the same Pro"
  - id: ERR_TRAVEL_BUFFER_CONFLICT
    http: 409
    condition: "booking violates the travel buffer between two different-ZIP BOOKED windows of the same Pro"
  - id: ERR_CUSTOMER_DOUBLE_BOOKED
    http: 409
    condition: "booking would place the Customer in two SCHEDULED jobs whose closed-interval windows touch or overlap"
  - id: ERR_WARRANTY_EXPIRED
    http: 422
    condition: "callback opened after the category's callback_warranty_days window"
  - id: ERR_PARTIAL_PAYMENT
    http: 422
    condition: "payment amount_cents != invoice.balance_due_cents (full payment required)"
  - id: ERR_REFUND_EXCEEDS_PAID
    http: 422
    condition: "approved_refund_cents <= 0 or exceeds (amount_paid_cents - refunded_cents)"
  - id: ERR_PRICING_MODEL_MISMATCH
    http: 422
    condition: "labor hours recorded on a FLAT category, or none recorded before issuing a HOURLY invoice"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_dispatchwindow_version != live DispatchWindow.version on booking"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, malformed value, bad enum, or constraint violation in body"
  - id: ERR_VALIDATION
    http: 422
    condition: "semantically invalid body that passes shape checks (e.g., flat_task_fee_cents null on a FLAT category, window_end <= window_start)"

# ===========================================================================
# 1.7 RBAC Matrix
# ===========================================================================
roles:
  - name: Customer
    description: "files jobs, accepts quotes, books windows, pays invoices, opens callbacks and disputes"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /jobs"
      - "POST /jobs/{id}/instant-quote"
      - "POST /jobs/{id}/request-estimate"
      - "POST /jobs/{id}/accept-quote"
      - "POST /jobs/{id}/cancel"
      - "POST /jobs/{id}/callbacks"
      - "POST /dispatch-windows/{id}/book"
      - "POST /invoices/{id}/pay"
      - "POST /disputes"
      - "POST /disputes/{id}/withdraw"
    shared_operations:
      - "GET /jobs, GET /jobs/{id}, GET /invoices/{id}, GET /disputes, GET /pros/{id}, GET /service-categories"

  - name: Pro
    description: "submits estimates, publishes windows, logs visits/labor/parts, issues invoices, completes jobs"
    identity: "entity_backed:Pro"
    exclusive_operations:
      - "POST /jobs/{id}/quotes"
      - "POST /jobs/{id}/visits"
      - "POST /jobs/{id}/labor-lines"
      - "POST /jobs/{id}/part-lines"
      - "POST /jobs/{id}/complete"
      - "POST /jobs/{id}/invoices"
      - "POST /dispatch-windows"
      - "POST /invoices/{id}/issue"
    shared_operations:
      - "GET /jobs, GET /jobs/{id}, GET /pros/{id}, GET /dispatch-windows, GET /service-categories"

  - name: PlatformAdmin
    description: "vets pros (background/license), rules on disputes, configures categories"
    identity: "opaque"
    exclusive_operations:
      - "POST /service-categories"
      - "POST /pros/{id}/background-checks"
      - "POST /background-checks/{id}/decide"
      - "POST /disputes/{id}/review"
      - "POST /disputes/{id}/resolve"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET (all read endpoints)"

  - name: Dispatcher
    description: "operational read-only role for monitoring windows/jobs/pros"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET /jobs, GET /dispatch-windows, GET /pros/{id}, GET /service-categories"

  - name: Anonymous
    description: "unauthenticated self-registration only"
    identity: "opaque"
    exclusive_operations:
      - "POST /customers"
      - "POST /pros"
    shared_operations: []
