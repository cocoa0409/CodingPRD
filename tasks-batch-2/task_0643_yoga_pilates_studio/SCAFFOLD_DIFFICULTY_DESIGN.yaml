            - call: "POST /entitlements/${e1_id}/activate"
              payload: {}
              as: StudioManager
            - call: "POST /entitlements"
              payload: { member_id: "${m2_id}", kind: "CLASS_PACK", price_cents: 5000, credits_total: 5, cycle_start_utc: "2026-02-01T00:00:00Z" }
              as: StudioManager
              captures: { e2_id: $.data.id }
            - call: "POST /entitlements/${e2_id}/activate"
