# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task 2682 — Food Manager Certification & Exam Proctoring
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 only; every numeric literal
# below was computed by executing the §1.3 formula with its declared constants.
# Shared literal baseline used by most chains (each chain is self-contained and
# starts from an empty database):
#   Jurisdiction TX-TRAVIS: accepted_accreditation_bodies ["ANAB_CFP"],
#     accepted_languages ["EN","ES"], accepts_remote_proctoring true,
#     requires_local_registration true, posting_deadline_days 30,
#     recert_cycle_months 60, exam_fee_surcharge_pct 0.045
#   ExamForm FM-EN-01: EN / ANAB_CFP / scored_item_count 80 / pretest 10 /
#     national_cut_score 70 / base_minutes 120 / translated_extra_minutes 30
#   Logical clock default before any /_clock/set_current_utc call: 2026-08-01T00:00:00Z
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: proctor_risk_rolling_window_vs_lifetime_cumulative_divergence
        grounds:
          - calculations.proctor_audit_risk_score
          - entities.Proctor.fields.risk_score
          - entities.Proctor.fields.risk_variant_applied
          - entities.Proctor.fields.substantiated_incident_weight_total
          - state_machines.Proctor.REGISTERED_to_UNDER_AUDIT
          - state_machines.Proctor.UNDER_AUDIT_to_SUSPENDED
          - validations[priority=12]
        distinguishing_aspect: |
          The two variants of proctor_audit_risk_score are computed on the SAME proctor with the
          SAME single CRITICAL substantiated incident and MUST differ: ROLLING_WINDOW divides the
          in-window weight (0, because the only incident sits on the third-most-recent sitting,
          outside the 2-sitting window) by 2 and yields 0.00, while LIFETIME_CUMULATIVE divides the
          lifetime weight 5 by the 3 terminal sittings and yields 16.67, which alone crosses
          PROCTOR_RISK_SUSPEND_THRESHOLD and turns an operator PASS into a suspension. This
          instance scores risk on a Proctor; the second dual-variant instance scores a candidate's
          exam result on a ScoreReport, so the two live in different entity domains.
        test_recipe:
          setup:
            - "One jurisdiction, provider (500000 cents prepaid), EN exam form, 2-seat site, one candidate, one REGISTERED proctor holding PROCTOR and INSTRUCTOR."
            - "A 3-unit EXAM_ONLY batch (total_price_cents 11286) whose three codes are assigned to that candidate."
            - "Three back-to-back IN_PERSON sittings on 2026-09-10 with the same proctor (09:00-11:00, 11:15-13:15, 13:30-15:30 — each gap exactly PROCTOR_BUFFER_MINUTES, so none conflicts), all three carried through check-in, start and submission."
            - "One CRITICAL security incident on the OLDEST sitting only, substantiated — Proctor.substantiated_incident_weight_total becomes 5, the proctor is auto-SUSPENDED at 16.67, and is then reinstated so an audit can be opened."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Travis County Health TX", jurisdiction_code: "TX-TRAVIS", accepted_accreditation_bodies: ["ANAB_CFP"], accepted_languages: ["EN", "ES"], accepts_remote_proctoring: true, requires_local_registration: true, posting_deadline_days: 30, recert_cycle_months: 60, exam_fee_surcharge_pct: 0.045 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /training-providers"
              payload: { legal_name: "Lone Star Food Safety", jurisdiction_id: "${jur_id}", contact_email: "ops@lonestar.test" }
              as: PlatformAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /training-providers/${prov_id}/credit-adjustments"
              payload: { amount_cents: 500000, memo: "prepay-2026" }
              as: PlatformAdmin
            - call: "POST /exam-forms"
              payload: { form_code: "FM-EN-01", version_label: "2026.1", language: "EN", accreditation_body: "ANAB_CFP", scored_item_count: 80, national_cut_score: 70, base_minutes: 120, pretest_item_count: 10, translated_extra_minutes: 30 }
              as: PlatformAdmin
              captures: { form_id: $.data.id }
            - call: "POST /testing-sites"
              payload: { name: "Austin Exam Center", jurisdiction_id: "${jur_id}", seat_count: 2, address_line: "100 Congress Ave", languages_supported: ["EN", "ES"] }
              as: PlatformAdmin
              captures: { site_id: $.data.id }
            - call: "POST /candidates"
              payload: { full_name: "Ana Ruiz", email: "ana@x.test", preferred_language: "EN", training_provider_id: "${prov_id}", jurisdiction_id: "${jur_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { cand_id: $.data.id }
            - call: "POST /proctors"
              payload: { full_name: "Ivan Cole", email: "ivan@x.test", training_provider_id: "${prov_id}", roles_held: ["PROCTOR", "INSTRUCTOR"], languages_certified: ["EN", "ES"], remote_certified: true }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { proc_id: $.data.id }
            - call: "POST /proctors/${proc_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /access-code-batches"
              payload: { training_provider_id: "${prov_id}", exam_form_id: "${form_id}", line_items: [{ bundle_type: "EXAM_ONLY", quantity: 3 }], expires_at: "2027-06-30T00:00:00Z" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
