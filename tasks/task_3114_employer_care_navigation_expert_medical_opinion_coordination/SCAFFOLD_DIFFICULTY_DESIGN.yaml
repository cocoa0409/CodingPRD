            - call: "POST /care/claims"
              payload: { member_id: "${m_id}", provider_id: "${prov_id}", service_date: "2026-08-01", billed_amount_cents: 50000, allowed_amount_cents: 50000, lines: [ { line_code: "B", billed_cents: 50000, schedule_rate: 1.0, error_flag: "NONE" } ] }
              as: PlanAdministrator
              captures: { c2: $.data.id }
          trigger:
            - call: "POST /care/claims/${c1}/adjudicate"
              payload: {}
              as: PlanAdministrator
            - call: "POST /care/claims/${c2}/adjudicate"
              payload: {}
