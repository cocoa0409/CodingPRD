scaffold_corner_design:

  # ===========================================================================
  # section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: creation_fuel_card_transaction_returns_all_fields
        claim_type: creation
        grounds:
          - entities.FuelCardTransaction
          - endpoints.POST /car-share/fuel-card-transactions
        distinguishing_aspect: "A posted fuel-card transaction returns 201 with amount_cents, gallons_hundredths and the system-assigned id and version, and the posted row is discoverable through the vehicle-scoped reverse list."
        test_recipe:
          setup: ["One approved member with an ACTIVE membership and an AVAILABLE campus-pod vehicle", "One CONFIRMED reservation for that member on that vehicle"]
          setup_api_calls:
            - call: "POST /car-share/member-registrations"
              payload: { full_name: "Cara Card", email: "cara.card@x.com", kind: "INDIVIDUAL" }
              as: Anonymous
              captures: { m_cara_id: $.data.id }
            - call: "POST /car-share/members/{id}/driving-record-reports"
              payload: { license_state: "CA", license_years_held: 8 }
              as: Member
              as_user_id: "${m_cara_id}"
            - call: "POST /car-share/driving-record-reports/{id}/decision"
              payload: { report_decision: "CLEAR" }
              as: PodOperator
            - call: "POST /car-share/members/{id}/application-decision"
              payload: { decision: "APPROVE" }
              as: PodOperator
            - call: "POST /car-share/pods"
              payload: { name: "Card Lot", site_type: "NEIGHBORHOOD", capacity: 3, fuel_floor_pct: 25 }
              as: FleetAdmin
              captures: { pod_card_id: $.data.id }
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_card_id}", vin: "VIN3160A1", model: "Fiesta", capacity_seats: 5, next_service_miles: 50000 }
              as: FleetAdmin
              captures: { veh_ca1_id: $.data.id, veh_ca1_ver: $.data.version }
            - call: "POST /car-share/reservations"
              payload: { member_id: "${m_cara_id}", pod_id: "${pod_card_id}", vehicle_id: "${veh_ca1_id}", start_at: "2026-09-05T09:00:00Z", end_at: "2026-09-05T13:00:00Z", reserved_hours: 4, expected_vehicle_version: "${veh_ca1_ver}" }
              as: Member
              as_user_id: "${m_cara_id}"
              captures: { res_ca1_id: $.data.id }
          trigger:
            - call: "POST /car-share/fuel-card-transactions"
              payload: { reservation_id: "${res_ca1_id}", vehicle_id: "${veh_ca1_id}", amount_cents: 5200, gallons_hundredths: 1300 }
              as: Member
              as_user_id: "${m_cara_id}"
              captures: { fct_ca1_id: $.data.id, fct_ca1_ver: $.data.version }
          assert:
            - "FuelCardTransaction.${fct_ca1_id}.status == POSTED"
            - "FuelCardTransaction.${fct_ca1_id}.amount_cents == 5200"
            - "FuelCardTransaction.${fct_ca1_id}.gallons_hundredths == 1300"
            - "FuelCardTransaction.${fct_ca1_id}.version >= 1"

      - name: required_field_missing_on_member_registration
        claim_type: required_fields
        grounds:
          - entities.Member.fields.full_name
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting the required full_name field on registration is rejected with ERR_INVALID_REQUEST and no Member row is created."
        test_recipe:
          setup: ["Empty database with the logical clock at its 2026-09-01T00:00:00Z default"]
          setup_api_calls:
            - call: "POST /car-share/member-registrations"
              payload: { full_name: "Seed Only", email: "seed.only@x.com", kind: "INDIVIDUAL" }
              as: Anonymous
              captures: { m_seed_id: $.data.id }
          trigger:
            - call: "POST /car-share/member-registrations"
              payload: { email: "no.name@x.com", kind: "INDIVIDUAL" }
              as: Anonymous
              captures: { err_req1: $.data.error_id }
          assert:
            - "${err_req1} == \"ERR_INVALID_REQUEST\""
            - "GET /car-share/members?application_status=APPLIED returns exactly 1 row"

      - name: enum_outside_declared_set_rejected
        claim_type: type_constraints
        grounds:
          - entities.Member.fields.kind
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "A kind value outside {INDIVIDUAL, STUDENT, EMPLOYEE} is rejected with ERR_INVALID_REQUEST at the registration endpoint."
        test_recipe:
          setup: ["Empty database with the logical clock at its 2026-09-01T00:00:00Z default"]
          setup_api_calls:
            - call: "POST /car-share/member-registrations"
              payload: { full_name: "Enum Seed", email: "enum.seed@x.com", kind: "INDIVIDUAL" }
              as: Anonymous
              captures: { m_eseed_id: $.data.id }
          trigger:
            - call: "POST /car-share/member-registrations"
              payload: { full_name: "Bad Enum", email: "bad.enum@x.com", kind: "CORPORATE" }
              as: Anonymous
              captures: { err_enum1: $.data.error_id }
          assert:
            - "${err_enum1} == \"ERR_INVALID_REQUEST\""
            - "${err_enum1} != \"ERR_MEMBER_EMAIL_TAKEN\""

      - name: entity_not_found_on_pod_read
        claim_type: not_found
        grounds:
          - entities.Pod
          - errors[ERR_POD_NOT_FOUND]
          - endpoints.GET /car-share/pods/{id}
        distinguishing_aspect: "Reading a pod with a syntactically valid but unknown id returns ERR_POD_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["One real pod exists so the not-found path is not confounded by an empty store"]
          setup_api_calls:
            - call: "POST /car-share/pods"
              payload: { name: "Real Pod", site_type: "NEIGHBORHOOD", capacity: 3, fuel_floor_pct: 25 }
              as: FleetAdmin
              captures: { pod_real_id: $.data.id }
          trigger:
            - call: "GET /car-share/pods/4b7d2e19-8c3a-4f60-b5d1-2a9e6c7f50b"
              payload: {}
              as: FleetAdmin
              captures: { err_nf1: $.data.error_id }
          assert:
            - "${err_nf1} == \"ERR_POD_NOT_FOUND\""

      - name: listing_pagination_envelope_has_more
        claim_type: listing
        grounds:
          - response_envelope
          - entities.Pod
          - endpoints.GET /car-share/pods
        distinguishing_aspect: "The pod list applies the declared pagination defaults: limit 10 by default, and total_count and has_more reflect the unpaginated total."
        test_recipe:
          setup: ["Two pods exist"]
          setup_api_calls:
            - call: "POST /car-share/pods"
              payload: { name: "Page Pod One", site_type: "NEIGHBORHOOD", capacity: 2, fuel_floor_pct: 25 }
              as: FleetAdmin
              captures: { pod_pg1_id: $.data.id }
            - call: "POST /car-share/pods"
              payload: { name: "Page Pod Two", site_type: "CAMPUS", capacity: 2, fuel_floor_pct: 20 }
              as: FleetAdmin
              captures: { pod_pg2_id: $.data.id }
          trigger:
            - call: "GET /car-share/pods"
              payload: {}
              as: FleetAdmin
          assert:
            - "the response carries limit, offset, total_count and has_more"

      - name: computed_available_bays_reflects_capacity_and_occupancy
        claim_type: computed_fields
        grounds:
          - entities.Pod.fields.available_bays
          - calculations.pod_utilization
          - endpoints.GET /car-share/pods/{id}
        distinguishing_aspect: "available_bays is computed as capacity minus the non-retired vehicles whose home pod is this pod, so two vehicles in a capacity-4 pod yield 2 rather than the caller-supplied value."
        test_recipe:
          setup: ["One pod with capacity 4 and two AVAILABLE vehicles assigned to it"]
          setup_api_calls:
            - call: "POST /car-share/pods"
              payload: { name: "Bays Pod", site_type: "CAMPUS", capacity: 4, fuel_floor_pct: 20 }
              as: FleetAdmin
              captures: { pod_bayp_id: $.data.id }
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_bayp_id}", vin: "VIN3160B1", model: "Note", capacity_seats: 5, next_service_miles: 32000 }
              as: FleetAdmin
              captures: { veh_cb1_id: $.data.id }
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_bayp_id}", vin: "VIN3160B2", model: "Note", capacity_seats: 5, next_service_miles: 32000 }
              as: FleetAdmin
              captures: { veh_cb2_id: $.data.id }
          trigger:
            - call: "GET /car-share/pods/{id}"
              payload: {}
              as: FleetAdmin
              captures: { bay_count: $.data.available_bays }
          assert:
            - "${bay_count} == 2"
            - "GET /car-share/pods/{id} returns utilization_score consistent with two active vehicles"

      - name: parent_relationship_vehicle_requires_real_pod
        claim_type: parent_relationships
        grounds:
          - entities.Vehicle.fields.pod_id
          - errors[ERR_POD_NOT_FOUND]
          - endpoints.POST /car-share/vehicles
        distinguishing_aspect: "Vehicle creation against an unknown pod id is rejected with ERR_POD_NOT_FOUND before any capacity check runs."
        test_recipe:
          setup: ["Empty database with the logical clock at its 2026-09-01T00:00:00Z default"]
          setup_api_calls:
            - call: "POST /car-share/pods"
              payload: { name: "Parent Seed", site_type: "NEIGHBORHOOD", capacity: 1, fuel_floor_pct: 25 }
              as: FleetAdmin
              captures: { pod_psd_id: $.data.id }
          trigger:
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "9c1f4a77-3b8e-4d02-8f16-5e0a9b2c91", vin: "VIN3160B3", model: "Note", capacity_seats: 5 }
              as: FleetAdmin
              captures: { err_par1: $.data.error_id }
          assert:
            - "${err_par1} == \"ERR_POD_NOT_FOUND\""
            - "${err_par1} != \"ERR_POD_CAPACITY_EXCEEDED\""

  # ===========================================================================
  # section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: application_decision_before_screening_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Member.SCREENING_to_APPROVED
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Deciding an application that is still APPLIED is not a declared transition, so ERR_INVALID_STATE is returned and the member stays APPLIED with no membership created."
        test_recipe:
          setup: ["One member row in APPLIED with no driving-record report"]
          setup_api_calls:
            - call: "POST /car-share/member-registrations"
              payload: { full_name: "Ines Instate", email: "ines.instate@x.com", kind: "INDIVIDUAL" }
              as: Anonymous
              captures: { m_ines_id: $.data.id }
          trigger:
            - call: "POST /car-share/members/{id}/application-decision"
              payload: { decision: "APPROVE" }
              as: PodOperator
              captures: { err_is1: $.data.error_id }
          assert:
            - "${err_is1} == \"ERR_INVALID_STATE\""
            - "GET /car-share/members/{m_ines_id} returns application_status APPLIED"
            - "GET /car-share/members/{m_ines_id}/memberships returns 0 rows"

      - name: return_reservation_from_confirmed_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Reservation.IN_USE_to_RETURNED
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A return attempted from CONFIRMED rather than IN_USE is refused with ERR_INVALID_STATE and the reservation's charge and vehicle posture are untouched."
        test_recipe:
          setup: ["One approved member with an ACTIVE membership and one CONFIRMED reservation in a campus pod"]
          setup_api_calls:
            - call: "POST /car-share/member-registrations"
              payload: { full_name: "Tom Tooearly", email: "tom.tooearly@x.com", kind: "INDIVIDUAL" }
              as: Anonymous
              captures: { m_tom_id: $.data.id }
            - call: "POST /car-share/members/{id}/driving-record-reports"
              payload: { license_state: "CA", license_years_held: 7 }
              as: Member
              as_user_id: "${m_tom_id}"
            - call: "POST /car-share/driving-record-reports/{id}/decision"
              payload: { report_decision: "CLEAR" }
              as: PodOperator
            - call: "POST /car-share/members/{id}/application-decision"
              payload: { decision: "APPROVE" }
              as: PodOperator
            - call: "POST /car-share/pods"
              payload: { name: "Too Early Lot", site_type: "CAMPUS", capacity: 3, fuel_floor_pct: 20 }
              as: FleetAdmin
              captures: { pod_te_id: $.data.id }
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_te_id}", vin: "VIN3160C1", model: "Ka", capacity_seats: 5, next_service_miles: 33000 }
              as: FleetAdmin
              captures: { veh_cc1_id: $.data.id, veh_cc1_ver: $.data.version }
            - call: "POST /car-share/reservations"
              payload: { member_id: "${m_tom_id}", pod_id: "${pod_te_id}", vehicle_id: "${veh_cc1_id}", start_at: "2026-09-05T09:00:00Z", end_at: "2026-09-05T13:00:00Z", reserved_hours: 4, expected_vehicle_version: "${veh_cc1_ver}" }
              as: Member
              as_user_id: "${m_tom_id}"
              captures: { res_cc1_id: $.data.id }
          trigger:
            - call: "POST /car-share/reservations/{id}/return"
              payload: { returned_pod_id: "${pod_te_id}", returned_odometer_miles: 33000, returned_fuel_level_pct: 60, contamination_level: 0 }
              as: Member
              as_user_id: "${m_tom_id}"
              captures: { err_is2: $.data.error_id }
          assert:
            - "${err_is2} == \"ERR_INVALID_STATE\""
            - "Reservation.${res_cc1_id}.status == CONFIRMED"
            - "Reservation.${res_cc1_id}.charge_total_cents is null"
            - "Vehicle.${veh_cc1_id}.use_status == RESERVED"

      - name: double_close_of_reservation_returns_already_terminal
        claim_type: idempotency
        grounds:
          - state_machines.Reservation.RETURNED_to_CLOSED
          - validations[priority=5]
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "A second close after a successful close observes the terminal CLOSED state and returns ERR_ALREADY_TERMINAL rather than re-releasing the wallet hold."
        test_recipe:
          setup: ["One approved member with an ACTIVE membership, one AVAILABLE campus-pod vehicle, one CONFIRMED reservation and a posted fuel-card transaction"]
          setup_api_calls:
            - call: "POST /car-share/member-registrations"
              payload: { full_name: "Dara Double", email: "dara.double@x.com", kind: "INDIVIDUAL" }
              as: Anonymous
              captures: { m_dara_id: $.data.id }
            - call: "POST /car-share/members/{id}/driving-record-reports"
              payload: { license_state: "CA", license_years_held: 6 }
              as: Member
              as_user_id: "${m_dara_id}"
            - call: "POST /car-share/driving-record-reports/{id}/decision"
              payload: { report_decision: "CLEAR" }
              as: PodOperator
            - call: "POST /car-share/members/{id}/application-decision"
              payload: { decision: "APPROVE" }
              as: PodOperator
            - call: "POST /car-share/pods"
              payload: { name: "Double Lot", site_type: "CAMPUS", capacity: 3, fuel_floor_pct: 20 }
              as: FleetAdmin
              captures: { pod_dbl_id: $.data.id }
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_dbl_id}", vin: "VIN3160D1", model: "Aygo", capacity_seats: 4, next_service_miles: 34000 }
              as: FleetAdmin
              captures: { veh_cd1_id: $.data.id, veh_cd1_ver: $.data.version }
            - call: "POST /car-share/reservations"
              payload: { member_id: "${m_dara_id}", pod_id: "${pod_dbl_id}", vehicle_id: "${veh_cd1_id}", start_at: "2026-09-05T09:00:00Z", end_at: "2026-09-05T13:00:00Z", reserved_hours: 4, expected_vehicle_version: "${veh_cd1_ver}" }
              as: Member
              as_user_id: "${m_dara_id}"
              captures: { res_cd1_id: $.data.id }
            - call: "POST /car-share/fuel-card-transactions"
              payload: { reservation_id: "${res_cd1_id}", vehicle_id: "${veh_cd1_id}", amount_cents: 4200, gallons_hundredths: 1050 }
              as: Member
              as_user_id: "${m_dara_id}"
            - call: "POST /car-share/reservations/{id}/return"
              payload: { returned_pod_id: "${pod_dbl_id}", returned_odometer_miles: 34000, returned_fuel_level_pct: 55, contamination_level: 0 }
              as: Member
              as_user_id: "${m_dara_id}"
            - call: "POST /car-share/reservations/{id}/close"
              payload: {}
              as: Member
              as_user_id: "${m_dara_id}"
          trigger:
            - call: "POST /car-share/reservations/{id}/close"
              payload: {}
              as: Member
              as_user_id: "${m_dara_id}"
              captures: { err_at1: $.data.error_id }
          assert:
            - "${err_at1} == \"ERR_ALREADY_TERMINAL\""
            - "Member.${m_dara_id}.wallet_hold_cents == 0"

      - name: hold_confirmation_blocked_by_unavailable_vehicle
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Reservation.HELD_to_CONFIRMED
          - validations[priority=12]
          - errors[ERR_VEHICLE_NOT_AVAILABLE]
        distinguishing_aspect: "Confirming a hold against a vehicle already moved OUT_OF_SERVICE is refused with ERR_VEHICLE_NOT_AVAILABLE and no reservation or vehicle version advances."
        test_recipe:
          setup: ["One approved member with an ACTIVE membership and one campus-pod vehicle moved OUT_OF_SERVICE"]
          setup_api_calls:
            - call: "POST /car-share/member-registrations"
              payload: { full_name: "Uri Unavail", email: "uri.unavail@x.com", kind: "INDIVIDUAL" }
              as: Anonymous
              captures: { m_uri_id: $.data.id }
            - call: "POST /car-share/members/{id}/driving-record-reports"
              payload: { license_state: "CA", license_years_held: 5 }
              as: Member
              as_user_id: "${m_uri_id}"
            - call: "POST /car-share/driving-record-reports/{id}/decision"
              payload: { report_decision: "CLEAR" }
              as: PodOperator
            - call: "POST /car-share/members/{id}/application-decision"
              payload: { decision: "APPROVE" }
              as: PodOperator
            - call: "POST /car-share/pods"
              payload: { name: "Unavail Lot", site_type: "CAMPUS", capacity: 3, fuel_floor_pct: 20 }
              as: FleetAdmin
              captures: { pod_una_id: $.data.id }
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_una_id}", vin: "VIN3160E1", model: "Picanto", capacity_seats: 4, next_service_miles: 35000 }
              as: FleetAdmin
              captures: { veh_ce1_id: $.data.id, veh_ce1_ver: $.data.version }
            - call: "POST /car-share/vehicles/{id}/availability-events"
              payload: { event: "OUT_OF_SERVICE" }
              as: PodOperator
              captures: { veh_ce1_ver2: $.data.version }
          trigger:
            - call: "POST /car-share/reservations"
              payload: { member_id: "${m_uri_id}", pod_id: "${pod_una_id}", vehicle_id: "${veh_ce1_id}", start_at: "2026-09-05T09:00:00Z", end_at: "2026-09-05T13:00:00Z", reserved_hours: 4, expected_vehicle_version: "${veh_ce1_ver2}" }
              as: Member
              as_user_id: "${m_uri_id}"
              captures: { err_va1: $.data.error_id }
          assert:
            - "${err_va1} == \"ERR_VEHICLE_NOT_AVAILABLE\""
            - "GET /car-share/reservations?member_id=${m_uri_id} returns 0 rows"

      - name: cleanliness_reported_dirty_branch_ignores_use_status
        claim_type: valid_transition
        grounds:
          - state_machines.Vehicle.CLEAN_to_REPORTED_DIRTY
          - entities.Vehicle.fields.cleanliness_state
        distinguishing_aspect: "The cleanliness dimension advances independently of use_status: a CLEAN vehicle in MAINTENANCE still moves to REPORTED_DIRTY on a cleanliness signal, proving the two postures are parallel rather than coupled."
        test_recipe:
          setup: ["One campus-pod vehicle whose use_status is MAINTENANCE and whose cleanliness_state is CLEAN"]
          setup_api_calls:
            - call: "POST /car-share/pods"
              payload: { name: "Parallel Lot", site_type: "CAMPUS", capacity: 3, fuel_floor_pct: 20 }
              as: FleetAdmin
              captures: { pod_pll_id: $.data.id }
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_pll_id}", vin: "VIN3160F1", model: "Up", capacity_seats: 4, next_service_miles: 36000 }
              as: FleetAdmin
              captures: { veh_cf1_id: $.data.id }
            - call: "POST /car-share/maintenance-orders"
              payload: { vehicle_id: "${veh_cf1_id}", reason: "BRAKE_SERVICE", blocking: true, scheduled_start: "2026-09-13T09:00:00Z", scheduled_end: "2026-09-13T11:00:00Z" }
              as: PodOperator
          trigger:
            - call: "POST /car-share/community-signals"
              payload: { pod_id: "${pod_pll_id}", signal_type: "CLEANLINESS", message: "crumbs on the rear seat", vehicle_id: "${veh_cf1_id}" }
              as: Member
              captures: { cs_pl1_id: $.data.id }
          assert:
            - "Vehicle.${veh_cf1_id}.cleanliness_state == REPORTED_DIRTY"
            - "Vehicle.${veh_cf1_id}.use_status == MAINTENANCE"
            - "CommunitySignal.${cs_pl1_id}.signal_type == CLEANLINESS"

  # ===========================================================================
  # section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: charge_on_time_reservation_uses_flat_hourly_component
        claim_type: correct_result
        grounds:
          - calculations.charge_with_late_penalty_and_fuel_adjustment
          - entities.Reservation.fields.charge_total_cents
        distinguishing_aspect: "An on-time reservation of four hours with the fuel reading at the pod floor produces time_component 4600 and, after the 20 percent long-reservation discount, charge_total_cents 3680."
        test_recipe:
          setup: ["Logical clock at 2026-09-05T12:00:00Z", "One approved member with an ACTIVE membership and an AVAILABLE campus-pod vehicle with fuel_floor_pct 20", "One CONFIRMED reservation 09:00 to 13:00 with reserved_hours 4"]
          setup_api_calls:
            - call: "POST /car-share/member-registrations"
              payload: { full_name: "Owen Ontime", email: "owen.ontime@x.com", kind: "INDIVIDUAL" }
              as: Anonymous
              captures: { m_owen_id: $.data.id }
            - call: "POST /car-share/members/{id}/driving-record-reports"
              payload: { license_state: "CA", license_years_held: 10 }
              as: Member
              as_user_id: "${m_owen_id}"
            - call: "POST /car-share/driving-record-reports/{id}/decision"
              payload: { report_decision: "CLEAR" }
              as: PodOperator
            - call: "POST /car-share/members/{id}/application-decision"
              payload: { decision: "APPROVE" }
              as: PodOperator
            - call: "POST /car-share/pods"
              payload: { name: "Ontime Lot", site_type: "CAMPUS", capacity: 3, fuel_floor_pct: 20 }
              as: FleetAdmin
              captures: { pod_ont_id: $.data.id }
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_ont_id}", vin: "VIN3160G1", model: "Micra", capacity_seats: 5, next_service_miles: 37000 }
              as: FleetAdmin
              captures: { veh_cg1_id: $.data.id, veh_cg1_ver: $.data.version }
            - call: "POST /car-share/reservations"
              payload: { member_id: "${m_owen_id}", pod_id: "${pod_ont_id}", vehicle_id: "${veh_cg1_id}", start_at: "2026-09-05T09:00:00Z", end_at: "2026-09-05T13:00:00Z", reserved_hours: 4, expected_vehicle_version: "${veh_cg1_ver}" }
              as: Member
              as_user_id: "${m_owen_id}"
              captures: { res_cg1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T12:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /car-share/reservations/{id}/return"
              payload: { returned_pod_id: "${pod_ont_id}", returned_odometer_miles: 37000, returned_fuel_level_pct: 20, contamination_level: 0 }
              as: Member
              as_user_id: "${m_owen_id}"
          assert:
            - "Reservation.${res_cg1_id}.status == RETURNED"
            - "Reservation.${res_cg1_id}.late_minutes == 0"
            - "Reservation.${res_cg1_id}.charge_total_cents == 3680"

      - name: charge_ten_minutes_late_inside_the_grace_band
        claim_type: boundary
        grounds:
          - calculations.charge_with_late_penalty_and_fuel_adjustment
          - calculations.late_return_penalty
        distinguishing_aspect: "At exactly 10 late minutes the lateness_blocks count is 0, so late_fee_cents is 0 and the charge equals the untouched on-time 3680; a 10-minute lateness must never bill a whole 30-minute block."
        test_recipe:
          setup: ["Logical clock at 2026-09-05T13:10:00Z", "One approved member with an ACTIVE membership and an AVAILABLE campus-pod vehicle", "One CONFIRMED reservation 09:00 to 13:00 with reserved_hours 4"]
          setup_api_calls:
            - call: "POST /car-share/member-registrations"
              payload: { full_name: "Grace Ten", email: "grace.ten@x.com", kind: "INDIVIDUAL" }
              as: Anonymous
              captures: { m_gt_id: $.data.id }
            - call: "POST /car-share/members/{id}/driving-record-reports"
              payload: { license_state: "CA", license_years_held: 4 }
              as: Member
              as_user_id: "${m_gt_id}"
            - call: "POST /car-share/driving-record-reports/{id}/decision"
              payload: { report_decision: "CLEAR" }
              as: PodOperator
            - call: "POST /car-share/members/{id}/application-decision"
              payload: { decision: "APPROVE" }
              as: PodOperator
            - call: "POST /car-share/pods"
              payload: { name: "Grace Lot", site_type: "CAMPUS", capacity: 3, fuel_floor_pct: 20 }
              as: FleetAdmin
              captures: { pod_grc_id: $.data.id }
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_grc_id}", vin: "VIN3160H1", model: "Twingo", capacity_seats: 4, next_service_miles: 38000 }
              as: FleetAdmin
              captures: { veh_ch1_id: $.data.id, veh_ch1_ver: $.data.version }
            - call: "POST /car-share/reservations"
              payload: { member_id: "${m_gt_id}", pod_id: "${pod_grc_id}", vehicle_id: "${veh_ch1_id}", start_at: "2026-09-05T09:00:00Z", end_at: "2026-09-05T13:00:00Z", reserved_hours: 4, expected_vehicle_version: "${veh_ch1_ver}" }
              as: Member
              as_user_id: "${m_gt_id}"
              captures: { res_ch1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T13:10:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /car-share/reservations/{id}/return"
              payload: { returned_pod_id: "${pod_grc_id}", returned_odometer_miles: 38000, returned_fuel_level_pct: 20, contamination_level: 0 }
              as: Member
              as_user_id: "${m_gt_id}"
          assert:
            - "Reservation.${res_ch1_id}.late_minutes == 10"
            - "Reservation.${res_ch1_id}.status == RETURNED"
            - "Reservation.${res_ch1_id}.charge_total_cents == 3680"

      - name: charge_eleven_minutes_late_crosses_into_the_first_block
        claim_type: boundary
        grounds:
          - calculations.charge_with_late_penalty_and_fuel_adjustment
          - calculations.late_return_penalty
        distinguishing_aspect: "One minute past the grace boundary (11 late minutes) makes lateness_blocks 1, so time_component becomes 3450 + 1 * 1725 == 5175 and the charge jumps to 5520, exactly 1840 above the 10-minute result."
        test_recipe:
          setup: ["Logical clock at 2026-09-05T13:11:00Z", "One approved member with an ACTIVE membership and an AVAILABLE campus-pod vehicle", "One CONFIRMED reservation 09:00 to 13:00 with reserved_hours 4"]
          setup_api_calls:
            - call: "POST /car-share/member-registrations"
              payload: { full_name: "Eleven Late", email: "eleven.late@x.com", kind: "INDIVIDUAL" }
              as: Anonymous
              captures: { m_el_id: $.data.id }
            - call: "POST /car-share/members/{id}/driving-record-reports"
              payload: { license_state: "CA", license_years_held: 3 }
              as: Member
              as_user_id: "${m_el_id}"
            - call: "POST /car-share/driving-record-reports/{id}/decision"
              payload: { report_decision: "CLEAR" }
              as: PodOperator
            - call: "POST /car-share/members/{id}/application-decision"
              payload: { decision: "APPROVE" }
              as: PodOperator
            - call: "POST /car-share/pods"
              payload: { name: "Eleven Lot", site_type: "CAMPUS", capacity: 3, fuel_floor_pct: 20 }
              as: FleetAdmin
              captures: { pod_elv_id: $.data.id }
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_elv_id}", vin: "VIN3160J1", model: "C1", capacity_seats: 4, next_service_miles: 39000 }
              as: FleetAdmin
              captures: { veh_cj1_id: $.data.id, veh_cj1_ver: $.data.version }
            - call: "POST /car-share/reservations"
              payload: { member_id: "${m_el_id}", pod_id: "${pod_elv_id}", vehicle_id: "${veh_cj1_id}", start_at: "2026-09-05T09:00:00Z", end_at: "2026-09-05T13:00:00Z", reserved_hours: 4, expected_vehicle_version: "${veh_cj1_ver}" }
              as: Member
              as_user_id: "${m_el_id}"
              captures: { res_cj1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T13:11:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /car-share/reservations/{id}/return"
              payload: { returned_pod_id: "${pod_elv_id}", returned_odometer_miles: 39000, returned_fuel_level_pct: 20, contamination_level: 0 }
              as: Member
              as_user_id: "${m_el_id}"
          assert:
            - "Reservation.${res_cj1_id}.late_minutes == 11"
            - "Reservation.${res_cj1_id}.charge_total_cents == 5520"
            - "Reservation.${res_cj1_id}.charge_total_cents != 3680"

      - name: fuel_surcharge_uses_the_measured_deficit_not_the_flat_variant
        claim_type: constants_applied
        grounds:
          - calculations.fuel_cost_adjustment
          - constants.FUEL_SURCHARGE_CEILING
        distinguishing_aspect: "An airport pod with fuel_floor_pct 35 and a 20 percent return reading yields a 15-point deficit, so the measured surcharge is CEILING((15 * 12 / 100) * 450) == 810 rather than the 750 flat reduced variant."
        test_recipe:
          setup: ["Logical clock at 2026-09-05T12:00:00Z", "One approved member with an ACTIVE membership and an AVAILABLE airport-pod vehicle with fuel_floor_pct 35", "One CONFIRMED reservation 09:00 to 13:00 with reserved_hours 4"]
          setup_api_calls:
            - call: "POST /car-share/member-registrations"
              payload: { full_name: "Fuel Deficit", email: "fuel.deficit@x.com", kind: "INDIVIDUAL" }
              as: Anonymous
              captures: { m_fd_id: $.data.id }
            - call: "POST /car-share/members/{id}/driving-record-reports"
              payload: { license_state: "CA", license_years_held: 6 }
              as: Member
              as_user_id: "${m_fd_id}"
            - call: "POST /car-share/driving-record-reports/{id}/decision"
              payload: { report_decision: "CLEAR" }
              as: PodOperator
            - call: "POST /car-share/members/{id}/application-decision"
              payload: { decision: "APPROVE" }
              as: PodOperator
            - call: "POST /car-share/pods"
              payload: { name: "Airport Fuel", site_type: "AIRPORT", capacity: 4, fuel_floor_pct: 35 }
              as: FleetAdmin
              captures: { pod_af_id: $.data.id }
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_af_id}", vin: "VIN3160K1", model: "Astra", capacity_seats: 5, next_service_miles: 40000 }
              as: FleetAdmin
              captures: { veh_ck1_id: $.data.id, veh_ck1_ver: $.data.version }
            - call: "POST /car-share/reservations"
              payload: { member_id: "${m_fd_id}", pod_id: "${pod_af_id}", vehicle_id: "${veh_ck1_id}", start_at: "2026-09-05T09:00:00Z", end_at: "2026-09-05T13:00:00Z", reserved_hours: 4, expected_vehicle_version: "${veh_ck1_ver}" }
              as: Member
              as_user_id: "${m_fd_id}"
              captures: { res_ck1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T12:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /car-share/reservations/{id}/return"
              payload: { returned_pod_id: "${pod_af_id}", returned_odometer_miles: 40000, returned_fuel_level_pct: 20, contamination_level: 0 }
              as: Member
              as_user_id: "${m_fd_id}"
          assert:
            - "Reservation.${res_ck1_id}.charge_total_cents == 6328"
            - "Reservation.${res_ck1_id}.charge_total_cents != 6263"
            - "the measured surcharge is 810 while the reduced variant would be 750"

      - name: pod_utilization_zero_bay_floor_is_never_negative
        claim_type: precision
        grounds:
          - calculations.pod_utilization
          - entities.Pod.fields.available_bays
          - errors[ERR_POD_CAPACITY_EXCEEDED]
        distinguishing_aspect: "available_bays is floored at zero: a pod whose capacity was lowered to 1 while holding two vehicles reports 0 rather than -1, and the placement attempt is refused."
        test_recipe:
          setup: ["One pod with capacity 1 holding one AVAILABLE vehicle"]
          setup_api_calls:
            - call: "POST /car-share/pods"
              payload: { name: "Floor Pod", site_type: "NEIGHBORHOOD", capacity: 1, fuel_floor_pct: 25 }
              as: FleetAdmin
              captures: { pod_flr_id: $.data.id }
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_flr_id}", vin: "VIN3160L1", model: "Agila", capacity_seats: 4, next_service_miles: 41000 }
              as: FleetAdmin
              captures: { veh_cl1_id: $.data.id }
          trigger:
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_flr_id}", vin: "VIN3160L2", model: "Agila", capacity_seats: 4 }
              as: FleetAdmin
              captures: { err_flr1: $.data.error_id }
          assert:
            - "Pod.${pod_flr_id}.available_bays == 0"
            - "${err_flr1} == \"ERR_POD_CAPACITY_EXCEEDED\""

  # ===========================================================================
  # section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: wallet_adjustment_amount_zero_violation_to_error
        claim_type: violation_to_error
        grounds:
          - validations[priority=28]
          - errors[ERR_WALLET_ADJUSTMENT_INVALID]
          - entities.Member.fields.wallet_credit_cents
        distinguishing_aspect: "A zero-amount wallet adjustment returns ERR_WALLET_ADJUSTMENT_INVALID with HTTP 422 and leaves wallet_credit_cents unchanged."
        test_recipe:
          setup: ["One approved member with an ACTIVE membership"]
          setup_api_calls:
            - call: "POST /car-share/member-registrations"
              payload: { full_name: "Walt Wallet", email: "walt.wallet@x.com", kind: "INDIVIDUAL" }
              as: Anonymous
              captures: { m_walt_id: $.data.id }
            - call: "POST /car-share/members/{id}/driving-record-reports"
              payload: { license_state: "CA", license_years_held: 5 }
              as: Member
              as_user_id: "${m_walt_id}"
            - call: "POST /car-share/driving-record-reports/{id}/decision"
              payload: { report_decision: "CLEAR" }
              as: PodOperator
            - call: "POST /car-share/members/{id}/application-decision"
              payload: { decision: "APPROVE" }
              as: PodOperator
          trigger:
            - call: "POST /car-share/members/{id}/wallet-adjustments"
              payload: { amount_cents: 0, reason: "NOOP" }
              as: PodOperator
              captures: { err_wal1: $.data.error_id }
          assert:
            - "${err_wal1} == \"ERR_WALLET_ADJUSTMENT_INVALID\""
            - "Member.${m_walt_id}.wallet_credit_cents == 0"

      - name: wallet_adjustment_positive_credits_satisfaction_passes
        claim_type: satisfaction_passes
        grounds:
          - validations[priority=28]
          - entities.Member.fields.wallet_credit_cents
        distinguishing_aspect: "A positive wallet adjustment succeeds and raises wallet_credit_cents by exactly the supplied amount plus nothing else."
        test_recipe:
          setup: ["One approved member with an ACTIVE membership and a zero wallet"]
          setup_api_calls:
            - call: "POST /car-share/member-registrations"
              payload: { full_name: "Wanda Wallet", email: "wanda.wallet@x.com", kind: "INDIVIDUAL" }
              as: Anonymous
              captures: { m_wanda_id: $.data.id }
            - call: "POST /car-share/members/{id}/driving-record-reports"
              payload: { license_state: "CA", license_years_held: 5 }
              as: Member
              as_user_id: "${m_wanda_id}"
            - call: "POST /car-share/driving-record-reports/{id}/decision"
              payload: { report_decision: "CLEAR" }
              as: PodOperator
            - call: "POST /car-share/members/{id}/application-decision"
              payload: { decision: "APPROVE" }
              as: PodOperator
            - call: "POST /car-share/members/{id}/wallet-adjustments"
              payload: { amount_cents: 1500, reason: "GOODWILL" }
              as: PodOperator
          trigger:
            - call: "POST /car-share/members/{id}/wallet-adjustments"
              payload: { amount_cents: 2500, reason: "APOLOGY" }
              as: PodOperator
          assert:
            - "Member.${m_wanda_id}.wallet_credit_cents == 4000"

      - name: duplicate_email_on_second_registration
        claim_type: violation_to_error
        grounds:
          - validations[priority=15]
          - errors[ERR_MEMBER_EMAIL_TAKEN]
          - entities.Member.fields.email
        distinguishing_aspect: "Registering a second member with an email already present is rejected with ERR_MEMBER_EMAIL_TAKEN and the original member row is unchanged."
        test_recipe:
          setup: ["One member row already registered with email twin.member@x.com"]
          setup_api_calls:
            - call: "POST /car-share/member-registrations"
              payload: { full_name: "Twin One", email: "twin.member@x.com", kind: "INDIVIDUAL" }
              as: Anonymous
              captures: { m_twin1_id: $.data.id }
          trigger:
            - call: "POST /car-share/member-registrations"
              payload: { full_name: "Twin Two", email: "twin.member@x.com", kind: "INDIVIDUAL" }
              as: Anonymous
              captures: { err_dup1: $.data.error_id }
          assert:
            - "${err_dup1} == \"ERR_MEMBER_EMAIL_TAKEN\""
            - "Member.${m_twin1_id}.application_status == APPLIED"

      - name: citation_signature_mismatch_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=21]
          - errors[ERR_CITATION_SIGNATURE_INVALID]
          - endpoints.POST /car-share/citations/{id}/validate-signature
        distinguishing_aspect: "A citation whose supplied signature does not match the recoverable signer address returns ERR_CITATION_SIGNATURE_INVALID with HTTP 422."
        test_recipe:
          setup: ["One citation minted with a distinct recoverable signer address"]
          setup_api_calls:
            - call: "POST /_citations/issue"
              payload: { recoverable_signer_address: "0xAAA1", signer_address: "0xAAA1", expires_at: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /car-share/citations/{id}/validate-signature"
              payload: { signature: "0xDEADBEEF" }
              as: PodOperator
              captures: { err_cit1: $.data.error_id }
          assert:
            - "${err_cit1} == \"ERR_CITATION_SIGNATURE_INVALID\""

      - name: screening_not_clear_blocks_membership_creation
        claim_type: conditional_validation
        grounds:
          - validations[priority=8]
          - errors[ERR_SCREENING_NOT_CLEAR]
          - state_machines.Member.SCREENING_to_APPROVED
        distinguishing_aspect: "A membership created for a member whose screen_result is REFERRED is refused with ERR_SCREENING_NOT_CLEAR because membership creation carries the booking-rights screening gate."
        test_recipe:
          setup: ["One member whose latest driving-record decision is REFERRED"]
          setup_api_calls:
            - call: "POST /car-share/accounts"
              payload: { name: "Referral University", type: "UNIVERSITY", primary_member_id: "00000000-0000-4000-8000-000000000001", billing_email: "billing@refu.edu" }
              as: Anonymous
              captures: { acct_ref_id: $.data.id }
            - call: "POST /car-share/member-registrations"
              payload: { full_name: "Ref Referred", email: "ref.referred@x.com", kind: "STUDENT" }
              as: Anonymous
              captures: { m_ref_id: $.data.id }
            - call: "POST /car-share/members/{id}/driving-record-reports"
              payload: { license_state: "CA", license_years_held: 2 }
              as: Member
              as_user_id: "${m_ref_id}"
            - call: "POST /car-share/driving-record-reports/{id}/decision"
              payload: { report_decision: "REFERRED" }
              as: PodOperator
          trigger:
            - call: "POST /car-share/memberships"
              payload: { account_id: "${acct_ref_id}", member_id: "${m_ref_id}", department_code: "PHYS", tier: "STANDARD", primary_flag: true }
              as: UniversityAccountAdmin
              captures: { err_ref1: $.data.error_id }
          assert:
            - "${err_ref1} == \"ERR_SCREENING_NOT_CLEAR\""
            - "GET /car-share/memberships?member_id=${m_ref_id} returns 0 rows"

      - name: duplicate_primary_membership_second_row_rejected
        claim_type: aggregate_validation
        grounds:
          - validations[priority=14]
          - errors[ERR_DUPLICATE_PRIMARY_MEMBERSHIP]
          - entities.Membership.fields.primary_flag
        distinguishing_aspect: "Each membership row is individually valid, but a second ACTIVE primary membership for the same member is collectively refused with ERR_DUPLICATE_PRIMARY_MEMBERSHIP."
        test_recipe:
          setup: ["One approved individual member already holding an ACTIVE primary membership"]
          setup_api_calls:
            - call: "POST /car-share/member-registrations"
              payload: { full_name: "Prim Primary", email: "prim.primary@x.com", kind: "INDIVIDUAL" }
              as: Anonymous
              captures: { m_prim_id: $.data.id }
            - call: "POST /car-share/members/{id}/driving-record-reports"
              payload: { license_state: "CA", license_years_held: 9 }
              as: Member
              as_user_id: "${m_prim_id}"
            - call: "POST /car-share/driving-record-reports/{id}/decision"
              payload: { report_decision: "CLEAR" }
              as: PodOperator
            - call: "POST /car-share/members/{id}/application-decision"
              payload: { decision: "APPROVE" }
              as: PodOperator
          trigger:
            - call: "POST /car-share/memberships"
              payload: { member_id: "${m_prim_id}", department_code: "OPS", tier: "PLUS", primary_flag: true }
              as: UniversityAccountAdmin
              captures: { err_prim1: $.data.error_id }
          assert:
            - "${err_prim1} == \"ERR_DUPLICATE_PRIMARY_MEMBERSHIP\""
            - "GET /car-share/members/${m_prim_id}/memberships returns exactly 1 row"

  # ===========================================================================
  # section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: availability_event_out_of_service_side_effect_applied
        claim_type: action_endpoint
        grounds:
          - endpoints.POST /car-share/vehicles/{id}/availability-events
          - state_machines.Vehicle.AVAILABLE_to_OUT_OF_SERVICE
          - entities.Vehicle.fields.use_status
        distinguishing_aspect: "The OUT_OF_SERVICE availability event sets use_status and recomputes the pod's bay accounting in the same response."
        test_recipe:
          setup: ["One campus pod with capacity 3 holding one AVAILABLE vehicle"]
          setup_api_calls:
            - call: "POST /car-share/pods"
              payload: { name: "OOS Lot", site_type: "CAMPUS", capacity: 3, fuel_floor_pct: 20 }
              as: FleetAdmin
              captures: { pod_oos_id: $.data.id }
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_oos_id}", vin: "VIN3160M1", model: "Celerio", capacity_seats: 4, next_service_miles: 42000 }
              as: FleetAdmin
              captures: { veh_cm1_id: $.data.id }
          trigger:
            - call: "POST /car-share/vehicles/{id}/availability-events"
              payload: { event: "OUT_OF_SERVICE" }
              as: PodOperator
          assert:
            - "Vehicle.${veh_cm1_id}.use_status == OUT_OF_SERVICE"
            - "Pod.${pod_oos_id}.available_bays == 3"

      - name: forward_repair_action_blocked_while_vehicle_operational
        claim_type: conditional_action
        grounds:
          - endpoints.POST /car-share/vehicles/{id}/availability-events
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Retiring a vehicle that is still AVAILABLE is not a declared precondition state, so ERR_INVALID_STATE is returned and use_status stays AVAILABLE."
        test_recipe:
          setup: ["One AVAILABLE campus-pod vehicle"]
          setup_api_calls:
            - call: "POST /car-share/pods"
              payload: { name: "Retire Lot", site_type: "CAMPUS", capacity: 3, fuel_floor_pct: 20 }
              as: FleetAdmin
              captures: { pod_ret_id: $.data.id }
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_ret_id}", vin: "VIN3160N1", model: "Alto", capacity_seats: 4, next_service_miles: 43000 }
              as: FleetAdmin
              captures: { veh_cn1_id: $.data.id }
          trigger:
            - call: "POST /car-share/vehicles/{id}/availability-events"
              payload: { event: "RETIRE" }
              as: FleetAdmin
              captures: { err_ret1: $.data.error_id }
          assert:
            - "${err_ret1} == \"ERR_INVALID_STATE\""
            - "Vehicle.${veh_cn1_id}.use_status == AVAILABLE"

      - name: maintenance_order_creation_side_effect_marks_vehicle_maintenance
        claim_type: standard_crud
        grounds:
          - endpoints.POST /car-share/maintenance-orders
          - state_machines.MaintenanceOrder.SCHEDULED_to_BLOCKED
          - state_machines.Vehicle.AVAILABLE_to_MAINTENANCE
        distinguishing_aspect: "A blocking maintenance order created against an AVAILABLE vehicle moves the vehicle to MAINTENANCE and leaves the order in BLOCKED."
        test_recipe:
          setup: ["One AVAILABLE campus-pod vehicle"]
          setup_api_calls:
            - call: "POST /car-share/pods"
              payload: { name: "Block Lot", site_type: "CAMPUS", capacity: 3, fuel_floor_pct: 20 }
              as: FleetAdmin
              captures: { pod_blk_id: $.data.id }
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_blk_id}", vin: "VIN3160P1", model: "Wagon R", capacity_seats: 5, next_service_miles: 44000 }
              as: FleetAdmin
              captures: { veh_cp1_id: $.data.id }
          trigger:
            - call: "POST /car-share/maintenance-orders"
              payload: { vehicle_id: "${veh_cp1_id}", reason: "TYRE_ROTATION", blocking: true, scheduled_start: "2026-09-13T09:00:00Z", scheduled_end: "2026-09-13T11:00:00Z" }
              as: PodOperator
              captures: { mo_blk1_id: $.data.id }
          assert:
            - "MaintenanceOrder.${mo_blk1_id}.status == BLOCKED"
            - "Vehicle.${veh_cp1_id}.use_status == MAINTENANCE"

      - name: maintenance_completion_releases_the_vehicle_and_clears_cleaning
        claim_type: standard_crud
        grounds:
          - endpoints.POST /car-share/maintenance-orders/{id}/complete
          - state_machines.MaintenanceOrder.IN_PROGRESS_to_COMPLETED
          - state_machines.Vehicle.CLEANING_to_AVAILABLE
        distinguishing_aspect: "Completing a CLEANING-reason order moves the order to COMPLETED, the vehicle back to AVAILABLE and the cleanliness posture to CLEAN."
        test_recipe:
          setup: ["One campus-pod vehicle in CLEANING with a CLEANING-reason maintenance order already in progress"]
          setup_api_calls:
            - call: "POST /car-share/pods"
              payload: { name: "Clean Lot", site_type: "CAMPUS", capacity: 3, fuel_floor_pct: 20 }
              as: FleetAdmin
              captures: { pod_cln_id: $.data.id }
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_cln_id}", vin: "VIN3160Q1", model: "Kwid", capacity_seats: 5, next_service_miles: 45000 }
              as: FleetAdmin
              captures: { veh_cq1_id: $.data.id, veh_cq1_ver: $.data.version }
            - call: "POST /car-share/member-registrations"
              payload: { full_name: "Clean Member", email: "clean.member@x.com", kind: "INDIVIDUAL" }
              as: Anonymous
              captures: { m_cln_id: $.data.id }
            - call: "POST /car-share/members/{id}/driving-record-reports"
              payload: { license_state: "CA", license_years_held: 4 }
              as: Member
              as_user_id: "${m_cln_id}"
            - call: "POST /car-share/driving-record-reports/{id}/decision"
              payload: { report_decision: "CLEAR" }
              as: PodOperator
            - call: "POST /car-share/members/{id}/application-decision"
              payload: { decision: "APPROVE" }
              as: PodOperator
            - call: "POST /car-share/reservations"
              payload: { member_id: "${m_cln_id}", pod_id: "${pod_cln_id}", vehicle_id: "${veh_cq1_id}", start_at: "2026-09-05T09:00:00Z", end_at: "2026-09-05T13:00:00Z", reserved_hours: 4, expected_vehicle_version: "${veh_cq1_ver}" }
              as: Member
              as_user_id: "${m_cln_id}"
              captures: { res_cq1_id: $.data.id }
            - call: "POST /car-share/access-events"
              payload: { reservation_id: "${res_cq1_id}", member_id: "${m_cln_id}", method: "KEY_CARD" }
              as: Member
              as_user_id: "${m_cln_id}"
            - call: "POST /car-share/reservations/{id}/return"
              payload: { returned_pod_id: "${pod_cln_id}", returned_odometer_miles: 45000, returned_fuel_level_pct: 60, contamination_level: 3 }
              as: Member
              as_user_id: "${m_cln_id}"
            - call: "GET /car-share/vehicles/${veh_cq1_id}/maintenance-orders"
              as: PodOperator
              captures: { mo_cln1_id: "$.data[0].id" }
            - call: "POST /car-share/maintenance-orders/{id}/start"
              payload: {}
              as: PodOperator
          trigger:
            - call: "POST /car-share/maintenance-orders/{id}/complete"
              payload: {}
              as: PodOperator
          assert:
            - "MaintenanceOrder.${mo_cln1_id}.status == COMPLETED"
            - "Vehicle.${veh_cq1_id}.use_status == AVAILABLE"
            - "Vehicle.${veh_cq1_id}.cleanliness_state == CLEAN"

  # ===========================================================================
  # section: errors
  # ===========================================================================
  - section: errors
    instances:
      - name: error_reservation_not_found_on_cancel
        claim_type: error_triggerable
        grounds:
          - errors[ERR_RESERVATION_NOT_FOUND]
          - endpoints.POST /car-share/reservations/{id}/cancel
        distinguishing_aspect: "Cancelling a reservation id that does not exist returns ERR_RESERVATION_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["Empty database with the logical clock at its 2026-09-01T00:00:00Z default"]
          setup_api_calls:
            - call: "POST /car-share/pods"
              payload: { name: "Seed Pod", site_type: "NEIGHBORHOOD", capacity: 1, fuel_floor_pct: 25 }
              as: FleetAdmin
              captures: { pod_seed2_id: $.data.id }
          trigger:
            - call: "POST /car-share/reservations/6f2a8d31-0c47-49be-a3f8-71d0e5b9c84/cancel"
              payload: { reason: "CHANGED_PLANS" }
              as: PodOperator
              captures: { err_rnf1: $.data.error_id }
          assert:
            - "${err_rnf1} == \"ERR_RESERVATION_NOT_FOUND\""

      - name: error_odometer_regression_on_return
        claim_type: error_triggerable
        grounds:
          - errors[ERR_ODOMETER_REGRESSION]
          - validations[priority=17]
          - state_machines.Reservation.IN_USE_to_RETURNED
        distinguishing_aspect: "Reporting an odometer lower than the vehicle's stored odometer_miles is refused with ERR_ODOMETER_REGRESSION and the reservation stays IN_USE."
        test_recipe:
          setup: ["One approved member with an ACTIVE membership, one IN_USE reservation whose vehicle odometer_miles is 42000"]
          setup_api_calls:
            - call: "POST /car-share/member-registrations"
              payload: { full_name: "Odo Regression", email: "odo.regression@x.com", kind: "INDIVIDUAL" }
              as: Anonymous
              captures: { m_odo_id: $.data.id }
            - call: "POST /car-share/members/{id}/driving-record-reports"
              payload: { license_state: "CA", license_years_held: 4 }
              as: Member
              as_user_id: "${m_odo_id}"
            - call: "POST /car-share/driving-record-reports/{id}/decision"
              payload: { report_decision: "CLEAR" }
              as: PodOperator
            - call: "POST /car-share/members/{id}/application-decision"
              payload: { decision: "APPROVE" }
              as: PodOperator
            - call: "POST /car-share/pods"
              payload: { name: "Odo Lot", site_type: "CAMPUS", capacity: 3, fuel_floor_pct: 20 }
              as: FleetAdmin
              captures: { pod_odo_id: $.data.id }
