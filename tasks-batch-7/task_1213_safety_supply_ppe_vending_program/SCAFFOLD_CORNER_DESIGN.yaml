# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# task_1213 Safety Supply & PPE Vending Program
# Enumerative coverage of every §1.1–§1.7 testable claim NOT already covered
# by SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8). claim_type/section values follow
# references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: employee_creation_applies_defaults
        claim_type: defaults
        grounds: [entities.Employee.fields.is_manager, entities.Employee.fields.fit_tests, entities.Employee.fields.status]
        distinguishing_aspect: "Omitting optional is_manager yields false; status defaults to ACTIVE; fit_tests initializes to []; common fields version == 1."
        test_recipe:
          setup: ["Cost center and job role exist"]
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-EN1", name: "Admin" }, as: FinanceAnalyst, captures: { cc_en: $.data.id } }
            - { call: "POST /job-roles", payload: { role_name: "CLERK-EN" }, as: EHSAdministrator, captures: { role_en: $.data.id } }
          trigger:
            - { call: "POST /employees", payload: { employee_code: "E-EN1", full_name: "Clerk One", job_role_id: "${role_en}", home_cost_center_id: "${cc_en}" }, as: EHSAdministrator, captures: { en_mgr: $.data.is_manager, en_status: $.data.status, en_ft: $.data.fit_tests, en_v: $.data.version } }
          assert:
            - "Employee.is_manager == false (default applied)"
            - "Employee.status == ACTIVE"
            - "Employee.fit_tests == []"
            - "Employee.version == 1"

      - name: item_computed_flags_by_category
        claim_type: computed_fields
        grounds: [entities.Item.fields.requires_fit_test, entities.Item.fields.serialized_tracking, entities.Item.fields.inspection_interval_days]
        distinguishing_aspect: "Category drives both computed flags: RESPIRATOR -> requires_fit_test true; FALL_PROTECTION -> serialized_tracking true; GENERAL -> both false; FALL_PROTECTION without inspection_interval_days is rejected."
        test_recipe:
          setup: ["No precondition data"]
          setup_api_calls:
            - { call: "POST /job-roles", payload: { role_name: "VIEWER-EN" }, as: EHSAdministrator }
          trigger:
            - { call: "POST /items", payload: { sku: "EN-GEN", name: "Gloves", category: "GENERAL", base_list_price_cents: 100 }, as: EHSAdministrator, captures: { en_g_ft: $.data.requires_fit_test, en_g_st: $.data.serialized_tracking } }
            - { call: "POST /items", payload: { sku: "EN-RSP", name: "Respirator", category: "RESPIRATOR", base_list_price_cents: 100 }, as: EHSAdministrator, captures: { en_r_ft: $.data.requires_fit_test, en_r_st: $.data.serialized_tracking } }
            - { call: "POST /items", payload: { sku: "EN-FP", name: "Harness", category: "FALL_PROTECTION", base_list_price_cents: 100, inspection_interval_days: 90 }, as: EHSAdministrator, captures: { en_f_ft: $.data.requires_fit_test, en_f_st: $.data.serialized_tracking } }
            - { call: "POST /items", payload: { sku: "EN-FPBAD", name: "Harness NoInterval", category: "FALL_PROTECTION", base_list_price_cents: 100 }, as: EHSAdministrator, captures: { en_bad_err: $.data.error_id } }
          assert:
            - "GENERAL item: requires_fit_test == false, serialized_tracking == false"
            - "RESPIRATOR item: requires_fit_test == true, serialized_tracking == false"
            - "FALL_PROTECTION item: requires_fit_test == false, serialized_tracking == true"
            - "FALL_PROTECTION without inspection_interval_days -> ERR_VALIDATION_FAILED"

      - name: slot_code_unique_per_machine
        claim_type: type_constraints
        grounds: [entities.MachineSlot.fields.slot_code, "errors[ERR_DUPLICATE_SLOT_CODE]"]
        distinguishing_aspect: "(machine_id, slot_code) uniqueness: duplicate code on the SAME machine rejected with ERR_DUPLICATE_SLOT_CODE; identical code on a DIFFERENT machine accepted."
        test_recipe:
          setup: ["Item exists; two machines registered, each at version 1"]
          setup_api_calls:
            - { call: "POST /items", payload: { sku: "EN-SC", name: "Goggles", category: "GENERAL", base_list_price_cents: 100 }, as: EHSAdministrator, captures: { item_sc: $.data.id } }
            - { call: "POST /machines", payload: { location_code: "LOC-EN-S1", site_name: "P1", model: "VM-1" }, as: VendingTechnician, captures: { mach_sc1: $.data.id, mach_sc1_v: $.data.version } }
            - { call: "POST /machines", payload: { location_code: "LOC-EN-S2", site_name: "P2", model: "VM-1" }, as: VendingTechnician, captures: { mach_sc2: $.data.id, mach_sc2_v: $.data.version } }
          trigger:
            - { call: "POST /machines/${mach_sc1}/slots", payload: { slot_code: "A1", item_id: "${item_sc}", capacity: 10, par_level: 2, expected_machine_version: "${mach_sc1_v}" }, as: VendingTechnician, captures: { slot_sc1: $.data.id } }
            - { call: "GET /machines/${mach_sc1}", payload: {}, as: Any, captures: { mach_sc1_v2: $.data.version } }
            - { call: "POST /machines/${mach_sc1}/slots", payload: { slot_code: "A1", item_id: "${item_sc}", capacity: 10, par_level: 2, expected_machine_version: "${mach_sc1_v2}" }, as: VendingTechnician, captures: { sc_dup_err: $.data.error_id } }
            - { call: "POST /machines/${mach_sc2}/slots", payload: { slot_code: "A1", item_id: "${item_sc}", capacity: 10, par_level: 2, expected_machine_version: "${mach_sc2_v}" }, as: VendingTechnician, captures: { slot_sc2: $.data.id } }
          assert:
            - "second A1 on machine 1 -> ERR_DUPLICATE_SLOT_CODE"
            - "A1 on machine 2 ACCEPTED (uniqueness is per-machine)"
            - "GET /machines/${mach_sc2}/slots returns 1 slot with slot_code A1"
      - name: machine_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_MACHINE_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but unknown machine id returns 404 ERR_MACHINE_NOT_FOUND."
        test_recipe:
          setup: ["At least one machine exists so the collection is initialized"]
          setup_api_calls:
            - { call: "POST /machines", payload: { location_code: "LOC-EN-NF", site_name: "P3", model: "VM-1" }, as: VendingTechnician }
          trigger:
            - { call: "GET /machines/11111111-2222-4333-8444-555555555555", payload: {}, as: Any, captures: { nf_err: $.data.error_id } }
          assert:
            - "error_id == ERR_MACHINE_NOT_FOUND and HTTP status 404"

      - name: manager_override_remaining_qty_computed
        claim_type: computed_fields
        grounds: [entities.ManagerOverride.fields.remaining_qty, entities.ManagerOverride.fields.consumed_qty, entities.ManagerOverride.fields.granted_by_user_id]
        distinguishing_aspect: "On create: consumed_qty == 0, remaining_qty == approved_qty, granted_by_user_id stamped from the Manager header, status ACTIVE."
        test_recipe:
          setup: ["Cost center, role, item, employee, and manager exist"]
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-EN2", name: "Ops" }, as: FinanceAnalyst, captures: { cc_mo: $.data.id } }
            - { call: "POST /job-roles", payload: { role_name: "TECH-EN" }, as: EHSAdministrator, captures: { role_mo: $.data.id } }
            - { call: "POST /items", payload: { sku: "EN-MO", name: "Gloves", category: "GENERAL", base_list_price_cents: 100 }, as: EHSAdministrator, captures: { item_mo: $.data.id } }
            - { call: "POST /employees", payload: { employee_code: "E-EN2", full_name: "Tech One", job_role_id: "${role_mo}", home_cost_center_id: "${cc_mo}" }, as: EHSAdministrator, captures: { emp_mo: $.data.id } }
            - { call: "POST /employees", payload: { employee_code: "M-EN2", full_name: "Mgr EN", job_role_id: "${role_mo}", home_cost_center_id: "${cc_mo}", is_manager: true }, as: EHSAdministrator, captures: { mgr_mo: $.data.id } }
          trigger:
            - { call: "POST /manager-overrides", payload: { employee_id: "${emp_mo}", item_id: "${item_mo}", approved_qty: 5, valid_from: "2026-05-01", valid_until: "2026-05-31", reason_code: "NEW_HIRE" }, as: Manager, as_user_id: "${mgr_mo}", captures: { mo_consumed: $.data.consumed_qty, mo_remaining: $.data.remaining_qty, mo_by: $.data.granted_by_user_id, mo_status: $.data.status } }
          assert:
            - "consumed_qty == 0"
            - "remaining_qty == 5 (computed approved - consumed)"
            - "granted_by_user_id == ${mgr_mo} (stamped from header, not from payload)"
            - "status == ACTIVE"

      - name: serialized_unit_registration_bumps_on_hand
        claim_type: side_effect_execution
        grounds: [entities.SerializedUnit.fields.status, entities.MachineSlot.fields.on_hand_qty, "errors[ERR_ITEM_NOT_SERIALIZED_CATEGORY]"]
        distinguishing_aspect: "Registering a FALL_PROTECTION unit sets it IN_STOCK and increments the slot's on_hand_qty by exactly 1; registering a GENERAL item as a unit is rejected."
        test_recipe:
          setup: ["FALL_PROTECTION item (interval 90) and GENERAL item; machine COMMISSIONING with one slot per item"]
          setup_api_calls:
            - { call: "POST /items", payload: { sku: "EN-SU", name: "Lanyard", category: "FALL_PROTECTION", base_list_price_cents: 5000, inspection_interval_days: 90 }, as: EHSAdministrator, captures: { item_su: $.data.id } }
            - { call: "POST /items", payload: { sku: "EN-SUG", name: "Gloves", category: "GENERAL", base_list_price_cents: 100 }, as: EHSAdministrator, captures: { item_sug: $.data.id } }
            - { call: "POST /machines", payload: { location_code: "LOC-EN-SU", site_name: "P4", model: "VM-1" }, as: VendingTechnician, captures: { mach_su: $.data.id, mach_su_v: $.data.version } }
            - { call: "POST /machines/${mach_su}/slots", payload: { slot_code: "H1", item_id: "${item_su}", capacity: 4, par_level: 0, expected_machine_version: "${mach_su_v}" }, as: VendingTechnician, captures: { slot_su: $.data.id } }
            - { call: "GET /machines/${mach_su}", payload: {}, as: Any, captures: { mach_su_v2: $.data.version } }
            - { call: "POST /machines/${mach_su}/slots", payload: { slot_code: "G1", item_id: "${item_sug}", capacity: 10, par_level: 0, expected_machine_version: "${mach_su_v2}" }, as: VendingTechnician, captures: { slot_sug: $.data.id } }
          trigger:
            - { call: "POST /serialized-units", payload: { item_id: "${item_su}", serial_number: "SN-EN-001", slot_id: "${slot_su}" }, as: EHSAdministrator, captures: { su_status: $.data.status } }
            - { call: "GET /slots/${slot_su}", payload: {}, as: Any, captures: { su_onhand: $.data.on_hand_qty } }
            - { call: "POST /serialized-units", payload: { item_id: "${item_sug}", serial_number: "SN-EN-002", slot_id: "${slot_sug}" }, as: EHSAdministrator, captures: { su_bad_err: $.data.error_id } }
          assert:
            - "SerializedUnit.status == IN_STOCK"
            - "MachineSlot.${slot_su}.on_hand_qty == 1 (registration side effect)"
            - "GENERAL item registration -> ERR_ITEM_NOT_SERIALIZED_CATEGORY"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: employee_suspend_reactivate_and_terminal_lockdown
        claim_type: invalid_transition
        grounds: [state_machines.Employee.ACTIVE_to_SUSPENDED, state_machines.Employee.SUSPENDED_to_ACTIVE, state_machines.Employee.SUSPENDED_to_TERMINATED, "errors[ERR_INVALID_STATE]", "errors[ERR_EMPLOYEE_NOT_ACTIVE]"]
        distinguishing_aspect: "Cycle ACTIVE->SUSPENDED->ACTIVE works; TERMINATED is terminal (further PUT -> ERR_INVALID_STATE); vend while SUSPENDED -> ERR_EMPLOYEE_NOT_ACTIVE."
        test_recipe:
          setup: ["Full vend-capable fixture: cc, role, GENERAL item (limit 10/30d), employee, machine ACTIVE stocked 10"]
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-SM1", name: "Ops" }, as: FinanceAnalyst, captures: { cc_sm: $.data.id } }
            - { call: "POST /job-roles", payload: { role_name: "TECH-SM" }, as: EHSAdministrator, captures: { role_sm: $.data.id } }
            - { call: "POST /items", payload: { sku: "SM-E", name: "Gloves", category: "GENERAL", base_list_price_cents: 100 }, as: EHSAdministrator, captures: { item_sm: $.data.id } }
            - { call: "POST /issuance-policies", payload: { job_role_id: "${role_sm}", item_id: "${item_sm}", period_limit_qty: 10, period_window_days: 30 }, as: EHSAdministrator }
            - { call: "POST /employees", payload: { employee_code: "E-SM1", full_name: "Tech SM", job_role_id: "${role_sm}", home_cost_center_id: "${cc_sm}" }, as: EHSAdministrator, captures: { emp_sm: $.data.id } }
            - { call: "POST /machines", payload: { location_code: "LOC-SM1", site_name: "P5", model: "VM-1" }, as: VendingTechnician, captures: { mach_sm: $.data.id, mach_sm_v: $.data.version } }
            - { call: "POST /machines/${mach_sm}/slots", payload: { slot_code: "A1", item_id: "${item_sm}", capacity: 20, par_level: 0, expected_machine_version: "${mach_sm_v}" }, as: VendingTechnician, captures: { slot_sm: $.data.id } }
            - { call: "PUT /machines/${mach_sm}", payload: { status: "ACTIVE" }, as: VendingTechnician }
            - { call: "POST /restock-orders", payload: { machine_id: "${mach_sm}", slot_id: "${slot_sm}", qty: 10 }, as: VendingTechnician, captures: { ro_sm: $.data.id } }
            - { call: "POST /restock-orders/${ro_sm}/pick", payload: {}, as: VendingTechnician }
            - { call: "POST /restock-orders/${ro_sm}/load", payload: {}, as: VendingTechnician }
          trigger:
            - { call: "PUT /employees/${emp_sm}", payload: { status: "SUSPENDED" }, as: EHSAdministrator, captures: { sm_s1: $.data.status } }
            - { call: "POST /issuances", payload: { machine_id: "${mach_sm}", slot_id: "${slot_sm}", qty: 1, idempotency_key: "sm-1" }, as: Employee, as_user_id: "${emp_sm}", captures: { sm_err1: $.data.error_id } }
            - { call: "PUT /employees/${emp_sm}", payload: { status: "ACTIVE" }, as: EHSAdministrator, captures: { sm_s2: $.data.status } }
            - { call: "PUT /employees/${emp_sm}", payload: { status: "TERMINATED" }, as: EHSAdministrator, captures: { sm_s3: $.data.status } }
            - { call: "PUT /employees/${emp_sm}", payload: { status: "ACTIVE" }, as: EHSAdministrator, captures: { sm_err2: $.data.error_id } }
          assert:
            - "SUSPENDED vend -> ERR_EMPLOYEE_NOT_ACTIVE (409)"
            - "reactivate: status ACTIVE (cycle back)"
            - "terminate: status TERMINATED"
            - "TERMINATED -> ACTIVE rejected with ERR_INVALID_STATE (terminal lockdown)"

      - name: item_discontinue_is_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Item.ACTIVE_to_DISCONTINUED, "errors[ERR_ITEM_DISCONTINUED]"]
        distinguishing_aspect: "Discontinue is one-way: second discontinue rejected; vend of a DISCONTINUED item rejected with ERR_ITEM_DISCONTINUED even though stock and entitlement exist."
        test_recipe:
          setup: ["Full vend-capable fixture with GENERAL item (limit 10/30d), stocked 5"]
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-SM2", name: "Ops" }, as: FinanceAnalyst, captures: { cc_di: $.data.id } }
            - { call: "POST /job-roles", payload: { role_name: "TECH-DI" }, as: EHSAdministrator, captures: { role_di: $.data.id } }
            - { call: "POST /items", payload: { sku: "SM-DI", name: "Gloves", category: "GENERAL", base_list_price_cents: 100 }, as: EHSAdministrator, captures: { item_di: $.data.id } }
            - { call: "POST /issuance-policies", payload: { job_role_id: "${role_di}", item_id: "${item_di}", period_limit_qty: 10, period_window_days: 30 }, as: EHSAdministrator }
            - { call: "POST /employees", payload: { employee_code: "E-SM2", full_name: "Tech DI", job_role_id: "${role_di}", home_cost_center_id: "${cc_di}" }, as: EHSAdministrator, captures: { emp_di: $.data.id } }
            - { call: "POST /machines", payload: { location_code: "LOC-SM2", site_name: "P6", model: "VM-1" }, as: VendingTechnician, captures: { mach_di: $.data.id, mach_di_v: $.data.version } }
            - { call: "POST /machines/${mach_di}/slots", payload: { slot_code: "A1", item_id: "${item_di}", capacity: 20, par_level: 0, expected_machine_version: "${mach_di_v}" }, as: VendingTechnician, captures: { slot_di: $.data.id } }
            - { call: "PUT /machines/${mach_di}", payload: { status: "ACTIVE" }, as: VendingTechnician }
            - { call: "POST /restock-orders", payload: { machine_id: "${mach_di}", slot_id: "${slot_di}", qty: 5 }, as: VendingTechnician, captures: { ro_di: $.data.id } }
            - { call: "POST /restock-orders/${ro_di}/pick", payload: {}, as: VendingTechnician }
            - { call: "POST /restock-orders/${ro_di}/load", payload: {}, as: VendingTechnician }
          trigger:
            - { call: "POST /items/${item_di}/discontinue", payload: {}, as: EHSAdministrator, captures: { di_s1: $.data.status } }
            - { call: "POST /items/${item_di}/discontinue", payload: {}, as: EHSAdministrator, captures: { di_err1: $.data.error_id } }
            - { call: "POST /issuances", payload: { machine_id: "${mach_di}", slot_id: "${slot_di}", qty: 1, idempotency_key: "di-1" }, as: Employee, as_user_id: "${emp_di}", captures: { di_err2: $.data.error_id } }
          assert:
            - "first discontinue: status DISCONTINUED"
            - "second discontinue -> ERR_ITEM_DISCONTINUED (already terminal)"
            - "vend of DISCONTINUED item -> ERR_ITEM_DISCONTINUED (409)"

      - name: machine_commission_requires_planogram
        claim_type: precondition_enforcement
        grounds: [state_machines.VendingMachine.COMMISSIONING_to_ACTIVE, "errors[ERR_MACHINE_NO_PLANOGRAM]"]
        distinguishing_aspect: "COMMISSIONING->ACTIVE with zero slots fails ERR_MACHINE_NO_PLANOGRAM; after adding one slot the identical PUT succeeds."
        test_recipe:
          setup: ["Item and machine (COMMISSIONING, no slots)"]
          setup_api_calls:
            - { call: "POST /items", payload: { sku: "SM-CM", name: "Gloves", category: "GENERAL", base_list_price_cents: 100 }, as: EHSAdministrator, captures: { item_cm: $.data.id } }
            - { call: "POST /machines", payload: { location_code: "LOC-SM3", site_name: "P7", model: "VM-1" }, as: VendingTechnician, captures: { mach_cm: $.data.id, mach_cm_v: $.data.version } }
          trigger:
            - { call: "PUT /machines/${mach_cm}", payload: { status: "ACTIVE" }, as: VendingTechnician, captures: { cm_err: $.data.error_id } }
            - { call: "POST /machines/${mach_cm}/slots", payload: { slot_code: "A1", item_id: "${item_cm}", capacity: 10, par_level: 0, expected_machine_version: "${mach_cm_v}" }, as: VendingTechnician }
            - { call: "PUT /machines/${mach_cm}", payload: { status: "ACTIVE" }, as: VendingTechnician, captures: { cm_status: $.data.status } }
          assert:
            - "commission with no slots -> ERR_MACHINE_NO_PLANOGRAM"
            - "after slot create: commission succeeds, status ACTIVE"

      - name: restock_pick_twice_rejected
        claim_type: idempotency
        grounds: [state_machines.RestockOrder.SUGGESTED_to_PICKED, "errors[ERR_RESTOCK_ORDER_INVALID_STATE]"]
        distinguishing_aspect: "Repeating the same transition trigger (pick on a PICKED order) is rejected with ERR_RESTOCK_ORDER_INVALID_STATE — no silent re-application."
        test_recipe:
          setup: ["GENERAL item, machine ACTIVE, slot; manual order SUGGESTED"]
          setup_api_calls:
            - { call: "POST /items", payload: { sku: "SM-RP", name: "Wipes", category: "GENERAL", base_list_price_cents: 100 }, as: EHSAdministrator, captures: { item_rp: $.data.id } }
            - { call: "POST /machines", payload: { location_code: "LOC-SM4", site_name: "P8", model: "VM-1" }, as: VendingTechnician, captures: { mach_rp: $.data.id, mach_rp_v: $.data.version } }
            - { call: "POST /machines/${mach_rp}/slots", payload: { slot_code: "A1", item_id: "${item_rp}", capacity: 30, par_level: 2, expected_machine_version: "${mach_rp_v}" }, as: VendingTechnician, captures: { slot_rp: $.data.id } }
            - { call: "PUT /machines/${mach_rp}", payload: { status: "ACTIVE" }, as: VendingTechnician }
            - { call: "POST /restock-orders", payload: { machine_id: "${mach_rp}", slot_id: "${slot_rp}", qty: 5 }, as: VendingTechnician, captures: { ro_rp: $.data.id } }
          trigger:
            - { call: "POST /restock-orders/${ro_rp}/pick", payload: {}, as: VendingTechnician, captures: { rp_s1: $.data.status } }
            - { call: "POST /restock-orders/${ro_rp}/pick", payload: {}, as: VendingTechnician, captures: { rp_err: $.data.error_id } }
          assert:
            - "first pick: status PICKED"
            - "second pick -> ERR_RESTOCK_ORDER_INVALID_STATE"

      - name: service_ticket_resolve_from_open_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ServiceTicket.IN_PROGRESS_to_RESOLVED, "errors[ERR_SERVICE_TICKET_INVALID_STATE]"]
        distinguishing_aspect: "resolve is only valid from IN_PROGRESS; on an OPEN ticket it fails ERR_SERVICE_TICKET_INVALID_STATE and the ticket stays OPEN."
        test_recipe:
          setup: ["Machine exists; OPEN ticket with a future window"]
          setup_api_calls:
            - { call: "POST /machines", payload: { location_code: "LOC-SM5", site_name: "P9", model: "VM-1" }, as: VendingTechnician, captures: { mach_sr: $.data.id } }
            - { call: "POST /service-tickets", payload: { machine_id: "${mach_sr}", issue_code: "JAM", window_start: "2026-05-10T08:00:00Z", window_end: "2026-05-10T12:00:00Z" }, as: VendingTechnician, captures: { tkt_sr: $.data.id } }
          trigger:
            - { call: "POST /service-tickets/${tkt_sr}/resolve", payload: {}, as: VendingTechnician, captures: { sr_err: $.data.error_id } }
            - { call: "GET /service-tickets/${tkt_sr}", payload: {}, as: Any, captures: { sr_status: $.data.status } }
          assert:
            - "resolve from OPEN -> ERR_SERVICE_TICKET_INVALID_STATE"
            - "ServiceTicket.${tkt_sr}.status == OPEN (unchanged)"

      - name: chargeback_settle_from_open_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ChargebackBatch.CLOSED_to_SETTLED, "errors[ERR_BATCH_INVALID_STATE]"]
        distinguishing_aspect: "settle requires CLOSED or DISPUTED; on OPEN it fails ERR_BATCH_INVALID_STATE."
        test_recipe:
          setup: ["Cost center; OPEN batch"]
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-SM6", name: "Ops" }, as: FinanceAnalyst, captures: { cc_sb: $.data.id } }
            - { call: "POST /chargeback-batches", payload: { cost_center_id: "${cc_sb}", period_start: "2026-05-01", period_end: "2026-06-01" }, as: FinanceAnalyst, captures: { batch_sb: $.data.id } }
          trigger:
            - { call: "POST /chargeback-batches/${batch_sb}/settle", payload: {}, as: FinanceAnalyst, captures: { sb_err: $.data.error_id } }
          assert:
            - "settle from OPEN -> ERR_BATCH_INVALID_STATE"
            - "ChargebackBatch.${batch_sb}.status == OPEN"

      - name: audit_close_from_fieldwork_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ComplianceAudit.FINDINGS_FILED_to_CLOSED, "errors[ERR_AUDIT_INVALID_STATE]"]
