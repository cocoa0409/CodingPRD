            - call: "POST /watch/members"
              payload: { watch_group_id: "${wg}", block_id: "${b1}", full_name: "Frozen M", contact_channel: "SMS" }
              as: ProgramCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_POSTURE_GATED (member create is posture-gated while FROZEN)"

