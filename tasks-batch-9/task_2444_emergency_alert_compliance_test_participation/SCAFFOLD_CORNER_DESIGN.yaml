      - name: outage_breach_flag_variant_selection_for_the_score
        claim_type: variant_selection
        grounds:
          - "§1.3 calculations.outage_downtime_hours variants: OBLIGATION_CLOCK is 'the field station_compliance_score consumes'"
          - "§1.3 calculations.station_compliance_score input_set 'outage_breach_count = count of EquipmentOutage rows ... with obligation_breached == true'"
        excluded_because:
          difficulty_instance: obligation_clock_breach_strict_boundary_at_48_hours_and_compliant_band_at_exactly_90
          rationale: "The named §1.8 instance already pins the case where continuous_clock_breached is true while obligation_breached is false at exactly 48.00 hours and asserts that only the obligation flag moves outage_breach_count and the score band."

