            - "Finding.${f1}.substantiation_status == SUBSTANTIATED (0.50 is NOT < 0.50; the gate passes at the boundary)"

      - name: trend_zero_headcount_zero_cases_yields_zero_rate
        grounds:
          - calculations.trend_case_rate
          - validations[priority=22]
          - errors[ERR_TREND_HEADCOUNT_ZERO]
        distinguishing_aspect: |
          Zero-count boundary on the trend-rate denominator metric via
          POST /er/trend-snapshots (distinct metric and endpoint from the
          sibling): a LOCATION scope with zero employees and zero closed
          cases yields case_rate_per_100 == 0.00 WITHOUT raising
