  # =====================================================================
  # SECTION 5 -- endpoints  (§1.5 surface: CRUD, actions, cross-reference
  # links, computed reads, conditional actions, pagination and soft delete)
  # =====================================================================
  - section: endpoints
    instances:

      - name: endpoint_provider_full_crud_cycle_with_version_increments
        claim_type: standard_crud
        grounds: [endpoints.POST_providers, endpoints.GET_providers_id, endpoints.PATCH_providers_id, endpoints.GET_providers]
        distinguishing_aspect: "Create, read, update and filtered list all work on Provider, and each PATCH increments version by exactly one while unspecified fields are left alone."
        test_recipe:
          setup:
            - "Clock pinned; no providers exist."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /providers", payload: { provider_type: "TELECARE_FITTER", npi: "1000000020", full_name: "Crud Fitter", licensed_state_codes: ["CA", "NV"], daily_capacity_minutes: 480, buffer_minutes: 10 }, as: PlatformAdmin, captures: { prov_e1: "$.data.id" } }
            - { call: "GET /providers/${prov_e1}", payload: {}, as: CareOpsAgent }
            - { call: "PATCH /providers/${prov_e1}", payload: { daily_capacity_minutes: 240 }, as: PlatformAdmin }
            - { call: "GET /providers?licensed_state_code=CA&provider_type=TELECARE_FITTER", payload: {}, as: Patient }
          assert:
            - "POST returns HTTP 201 with data.version == 1, data.status == \"ACTIVE\", data.buffer_minutes == 10"
            - "GET /providers/${prov_e1} returns HTTP 200 with data.npi == \"1000000020\" and data.daily_capacity_minutes == 480"
            - "PATCH returns HTTP 200 with data.daily_capacity_minutes == 240, data.buffer_minutes == 10 (untouched) and data.version == 2"
            - "the filtered list returns HTTP 200, total_count == 1, has_more == false, data[0].id == ${prov_e1}"
            - "GET /providers?licensed_state_code=TX returns total_count == 0 and data == []"

      - name: endpoint_patch_patient_state_policy_redenormalizes_state_code
        claim_type: standard_crud
        grounds: [endpoints.PATCH_patients_id.side_effects, entities.Patient.fields.state_code]
        distinguishing_aspect: "PATCH /patients/{id} with a new state_policy_id must re-denormalize state_code from CA to TX in the same response and bump version, without touching email or full_name."
        test_recipe:
          setup:
            - "A CA policy and a TX policy exist; the patient is registered under CA."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /state-policies", payload: { state_code: "CA", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 45, restocking_fee_mode: "FLAT_PCT", restocking_fee_pct: 0.1, restocking_fee_cap_cents: 0, shipping_refundable: false, referral_validity_days: 180, waiver_required: false, max_loss_damage_claims: 2 }, as: PlatformAdmin, captures: { pol_ca: "$.data.id" } }
            - { call: "POST /state-policies", payload: { state_code: "TX", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 21, trial_period_days: 30, restocking_fee_mode: "FLAT_PCT", restocking_fee_pct: 0.05, restocking_fee_cap_cents: 0, shipping_refundable: true, referral_validity_days: 90, waiver_required: false, max_loss_damage_claims: 1 }, as: PlatformAdmin, captures: { pol_tx: "$.data.id" } }
            - { call: "POST /patients", payload: { state_policy_id: "${pol_ca}", email: "e2@x.test", full_name: "E Two", age_years: 70 }, as: CareOpsAgent, captures: { pat_e2: "$.data.id" } }
          trigger:
            - { call: "PATCH /patients/${pat_e2}", payload: { state_policy_id: "${pol_tx}" }, as: CareOpsAgent }
          assert:
            - "HTTP 200"
            - "data.state_code == \"TX\" and data.state_policy_id == ${pol_tx}"
            - "data.email == \"e2@x.test\" and data.full_name == \"E Two\" and data.age_years == 70"
            - "data.version == 2"
            - "GET /patients?state_policy_id=${pol_ca} returns total_count == 0"

      - name: endpoint_soft_retired_policy_excluded_from_default_list_but_still_referenced
        claim_type: soft_delete
        grounds: [endpoints.DELETE_state_policies_id, endpoints.GET_state_policies.input.is_retired]
        distinguishing_aspect: "After DELETE /state-policies/{id} the policy disappears from the default list yet is still returned by id and still resolves as the existing patient's state_policy_id -- the soft delete never breaks live references."
        test_recipe:
          setup:
            - "A CA policy with one patient attached, plus a second live TX policy; then the CA policy is retired."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /state-policies", payload: { state_code: "CA", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 45, restocking_fee_mode: "FLAT_PCT", restocking_fee_pct: 0.1, restocking_fee_cap_cents: 0, shipping_refundable: false, referral_validity_days: 180, waiver_required: false, max_loss_damage_claims: 2 }, as: PlatformAdmin, captures: { pol_ca: "$.data.id" } }
            - { call: "POST /state-policies", payload: { state_code: "TX", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 21, trial_period_days: 30, restocking_fee_mode: "FLAT_PCT", restocking_fee_pct: 0.05, restocking_fee_cap_cents: 0, shipping_refundable: true, referral_validity_days: 90, waiver_required: false, max_loss_damage_claims: 1 }, as: PlatformAdmin, captures: { pol_tx: "$.data.id" } }
            - { call: "POST /patients", payload: { state_policy_id: "${pol_ca}", email: "e3@x.test", full_name: "E Three", age_years: 70 }, as: CareOpsAgent, captures: { pat_e3: "$.data.id" } }
          trigger:
            - { call: "DELETE /state-policies/${pol_ca}", payload: {}, as: PlatformAdmin }
          assert:
            - "HTTP 200 with data.is_retired == true and data.version == 2"
            - "GET /state-policies returns total_count == 1 and data[0].id == ${pol_tx}"
            - "GET /state-policies?is_retired=true returns total_count == 1 and data[0].id == ${pol_ca}"
            - "GET /state-policies/${pol_ca} still returns HTTP 200 (readable by id)"
            - "GET /patients/${pat_e3} still returns data.state_policy_id == ${pol_ca} and data.state_code == \"CA\""

      - name: endpoint_conditional_action_discontinued_pool_blocks_confirm_fit
        claim_type: conditional_action
        grounds: [endpoints.DELETE_inventory_pools_id, validations.priority_51, errors.ERR_POOL_DISCONTINUED]
        distinguishing_aspect: "A discontinued pool stays fully queryable (is_discontinued filter) but makes the otherwise-valid confirm-fit conditional action fail 409 ERR_POOL_DISCONTINUED even though on_hand_units is 5."
        test_recipe:
          setup:
            - "The NEO/M/OPEN pool is stocked with 5 units and then discontinued. A PASS patient has an AUTHORIZED M/OPEN order."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /state-policies", payload: { state_code: "CA", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 45, restocking_fee_mode: "FLAT_PCT", restocking_fee_pct: 0.1, restocking_fee_cap_cents: 0, shipping_refundable: false, referral_validity_days: 180, waiver_required: false, max_loss_damage_claims: 2 }, as: PlatformAdmin, captures: { pol_ca: "$.data.id" } }
            - { call: "POST /inventory-pools", payload: { sku: "NEO-M-OPEN", model: "NEO", dome_size: "M", tip_type: "OPEN" }, as: PlatformAdmin, captures: { pool_mo: "$.data.id" } }
            - { call: "POST /inventory-pools/${pool_mo}/restock", payload: { units: 5 }, as: PlatformAdmin }
            - { call: "POST /devices", payload: { serial_number: "SN-E004", model: "NEO", firmware_version: "4.0.0" }, as: PlatformAdmin }
            - { call: "POST /patients", payload: { state_policy_id: "${pol_ca}", email: "e4@x.test", full_name: "E Four", age_years: 70 }, as: CareOpsAgent, captures: { pat_e4: "$.data.id" } }
            - { call: "POST /patients/${pat_e4}/screening-sessions", payload: {}, as: Patient, as_user_id: "${pat_e4}", captures: { scr_e4: "$.data.id" } }
            - { call: "PATCH /screening-sessions/${scr_e4}", payload: { pure_tone_avg_db: 40.0, asymmetry_db: 5.0, self_reported_difficulty_score: 20, speech_in_noise_pct: 70.0, symptom_codes: [] }, as: Patient, as_user_id: "${pat_e4}" }
            - { call: "POST /screening-sessions/${scr_e4}/submit", payload: {}, as: Patient, as_user_id: "${pat_e4}" }
            - { call: "POST /patients/${pat_e4}/device-orders", payload: { model: "NEO", dome_size: "M", tip_type: "OPEN", list_price_cents: 200000, discount_cents: 0, accessory_subtotal_cents: 0, shipping_cents: 1495 }, as: Patient, as_user_id: "${pat_e4}", captures: { ord_e4: "$.data.id" } }
            - { call: "POST /_payments/simulate", payload: { device_order_id: "${ord_e4}", outcome: "AUTHORIZED" }, as: PlatformAdmin }
            - { call: "DELETE /inventory-pools/${pool_mo}", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "POST /device-orders/${ord_e4}/confirm-fit", payload: {}, as: CareOpsAgent }
          assert:
            - "HTTP 409"
            - "data.error_id == \"ERR_POOL_DISCONTINUED\""
            - "GET /inventory-pools?is_discontinued=true returns total_count == 1 and data[0].on_hand_units == 5"
            - "GET /inventory-pools returns total_count == 0 (default list hides discontinued pools)"
            - "GET /device-orders/${ord_e4} returns data.fulfillment_status == \"PENDING_FIT_CONFIRM\""

      - name: endpoint_delete_patient_deactivates_and_invalidates_draft_screenings
        claim_type: standard_crud
        grounds: [endpoints.DELETE_patients_id.side_effects, state_machines.Patient.terminal_states]
        distinguishing_aspect: "DELETE /patients/{id} is a deactivation, not a row removal: the patient is still readable with status DEACTIVATED and its DRAFT screening session is invalidated in the same request."
        test_recipe:
