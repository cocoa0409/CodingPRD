      - name: corner_patch_coverage_part_defers_repricing_to_the_next_quote
        claim_type: Standard CRUD
        grounds:
          - endpoints[PATCH /inland-marine/coverage-parts/{id}]
          - calculations.equipment_insured_value
          - entities.CoveragePart.fields.valuation_basis
        distinguishing_aspect: "PATCHing valuation_basis from ACV to REPLACEMENT_COST returns 200 and stores the new basis but leaves rated_premium_cents at the stale 173318; only the following re-quote re-derives insured_value_cents to 13200000 and rated_premium_cents to 322423 (policy written 335320)."
        test_recipe:
          setup:
            - "Empty database, logical clock at its 2026-08-01T00:00:00Z default."
            - "The published rate cell carries replacement_cost_index_bp 11000, which only the REPLACEMENT_COST branch of equipment_insured_value consumes."
          setup_api_calls:
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "EXCAVATOR", territory_code: "T2_URBAN", age_band_min_years: 0, age_band_max_years: 5, base_rate_bp: 180, theft_hazard_grade: "A", replacement_cost_index_bp: 11000 }
              as: Actuary
              captures: { rr: $.data.id }
            - call: "POST /inland-marine/rate-rules/${rr}/publish"
              payload: {}
              as: Actuary
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Endorsement Basis Contractors", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "SCHEDULED_EQUIPMENT", valuation_basis: "ACV", rating_basis: "SCHEDULED", deductible_cents: 100000, per_item_limit_cents: 20000000, aggregate_limit_cents: 200000000 }
              as: Underwriter
              captures: { cp: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v1: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "Excavator E1", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "OWNED", expected_policy_version: "${pol_v1}" }
              as: Underwriter
              captures: { it1: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/quote"
              payload: {}
              as: Underwriter
            - call: "GET /inland-marine/coverage-parts/${cp}"
              payload: {}
              as: Underwriter
              captures: { cp_v1: $.data.version }
          trigger:
            - call: "PATCH /inland-marine/coverage-parts/${cp}"
              payload: { valuation_basis: "REPLACEMENT_COST" }
              as: Underwriter
            - call: "GET /inland-marine/equipment-items/${it1}"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/quote"
              payload: {}
              as: Underwriter
            - call: "GET /inland-marine/equipment-items/${it1}"
              payload: {}
              as: Underwriter
          assert:
            - "trigger[0] HTTP status == 200"
            - "trigger[0] response CoveragePart.${cp}.valuation_basis == REPLACEMENT_COST"
            - "trigger[0] response CoveragePart.${cp}.version == ${cp_v1} + 1 (the PATCH is a write on the part row)"
            - "trigger[0] response CoveragePart.${cp}.rated_premium_cents == 173318 - the PATCH itself does NOT reprice"
            - "trigger[1] response EquipmentItem.${it1}.insured_value_cents == 8160000 and rated_premium_cents == 173318 - still the ACV figures"
            - "after trigger[1]: Policy.${pol}.written_premium_cents == 180251 and total_insured_value_cents == 8160000, unchanged by the endorsement"
            - "trigger[2] HTTP status == 200 (QUOTED -> QUOTED re-quote)"
            - "trigger[3] response EquipmentItem.${it1}.insured_value_cents == 13200000 (12000000 * 11000 bp; the REPLACEMENT_COST branch ignores the 4-year age entirely)"
            - "trigger[3] response EquipmentItem.${it1}.rated_premium_cents == 322423"
            - "after trigger[2]: CoveragePart.${cp}.rated_premium_cents == 322423"
            - "after trigger[2]: Policy.${pol}.written_premium_cents == 335320, sum_of_part_premiums_cents == 322423 and total_insured_value_cents == 13200000"
            - "the item's own valuation_basis stays null throughout, so the part-level basis is what the effective_valuation_basis resolution reads"

      - name: corner_reporting_sweep_no_op_at_the_grace_boundary
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /inland-marine/coverage-parts/{id}/reporting-sweep]
          - calculations.reporting_period_earned_premium.constants.REPORTING_GRACE_DAYS
          - state_machines.Policy[IN_FORCE -> SUSPENDED]
        distinguishing_aspect: "A sweep run at exactly the August period's due date 2026-09-15 returns swept_period_count 0 with an empty delinquent_report_ids and policy_status IN_FORCE, because the sweep condition is due_date < clock; the same sweep one day later returns swept_period_count 1 and SUSPENDED."
        test_recipe:
          setup:
            - "Empty database, logical clock at its 2026-08-01T00:00:00Z default."
            - "One IN_FORCE T2_URBAN policy 2026-08-01..2027-08-01 whose only part is a MONTHLY REPORTING_FORM part; no value report has ever been filed."
          setup_api_calls:
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Grace Boundary Warehousing", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
