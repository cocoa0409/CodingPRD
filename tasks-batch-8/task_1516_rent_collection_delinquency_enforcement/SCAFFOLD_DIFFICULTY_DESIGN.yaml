# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7. Logical clock default 2026-08-01T00:00:00Z.
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: late_fee_provisional_vs_final_on_notice
        grounds:
          - calculations.late_fee_assessment
          - calculations.notice_demand_amount
          - entities.DelinquencyNotice.fields.amount_demanded_cents
        distinguishing_aspect: |
          Same RENT charge, same clock: the provisional variant (as_of = today + cure window, assumes
          non-payment) embeds a 4000-cent late fee in the notice demand, while the final variant at the
          sweep date (days_late = 0) assesses nothing — two valid readings diverge by exactly 4000.
        test_recipe:
          setup:
            - "Property PA (FEES_FIRST, late_fee_cap 5000, cure window 10 days), lease LA (rent 200000, due_day 1, grace 5, FLAT fee 4000, term 2026-08-01..2027-07-31), one RENT charge 200000 due 2026-08-01, lease ACTIVE, clock at default 2026-08-01"
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "Maple Court", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { prop: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { ten: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { lease: $.data.id } }
            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "RENT", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 200000 }, as: LeasingAgent, captures: { rc: $.data.id } }
            - { call: "POST /api/leases/${lease}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "GET /api/leases/${lease}", as: PropertyManager, captures: { lv: $.data.version } }
            - { call: "POST /api/notices", payload: { lease_id: "${lease}", charge_ids: ["${rc}"], expected_lease_version: "${lv}" }, as: PropertyManager, captures: { notice: $.data.id, demand0: $.data.amount_demanded_cents } }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: SystemOps }
            - { call: "POST /api/delinquency-runs", as: SystemOps, captures: { assessed: $.data.late_fees_assessed_count } }
          assert:
            - "captured demand0 == 204000 (outstanding 200000 + provisional FLAT fee 4000 projected to cure deadline 2026-08-11, days_late = 5)"
            - "captured assessed == 0 (final variant on 2026-08-02: days_late = max(0, 1 - 5) = 0, no LATE_FEE charge persisted)"
            - "GET /api/leases/${lease}/charges returns exactly 1 charge (no LATE_FEE row exists)"

      - name: waterfall_fees_first_vs_rent_first
        grounds:
          - calculations.payment_waterfall_allocation
          - entities.Property.fields.posting_priority_policy
        distinguishing_aspect: |
          Identical ledger (RENT 200000 + DAMAGE_FEE 10000, same due dates) and identical 100000-cent
          payment: FEES_FIRST zeroes the damage fee and leaves rent at 110000; RENT_FIRST pays rent
          100000 and leaves the fee fully open — allocation order, not amounts, differs by policy.
        test_recipe:
          setup:
            - "Two properties PA (FEES_FIRST) and PB (RENT_FIRST) with otherwise identical constants; one lease each (rent 200000 due 2026-08-01, FLAT fee config, ACTIVE); each lease carries RENT 200000 due 2026-08-01 and DAMAGE_FEE 10000 due 2026-08-01; clock 2026-08-01"
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "P Fees", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { pa: $.data.id } }
            - { call: "POST /api/properties", payload: { name: "P Rent", state_code: "CA", posting_priority_policy: "RENT_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { pb: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { ten: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${pa}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { la: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${pb}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { lb: $.data.id } }
            - { call: "POST /api/leases/${la}/charges", payload: { kind: "RENT", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 200000 }, as: LeasingAgent, captures: { ra: $.data.id } }
            - { call: "POST /api/leases/${la}/charges", payload: { kind: "DAMAGE_FEE", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 10000 }, as: LeasingAgent, captures: { da: $.data.id } }
            - { call: "POST /api/leases/${lb}/charges", payload: { kind: "RENT", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 200000 }, as: LeasingAgent, captures: { rb: $.data.id } }
            - { call: "POST /api/leases/${lb}/charges", payload: { kind: "DAMAGE_FEE", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 10000 }, as: LeasingAgent, captures: { db: $.data.id } }
            - { call: "POST /api/leases/${la}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "POST /api/leases/${lb}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "POST /api/payments", payload: { lease_id: "${la}", tenant_id: "${ten}", channel: "ACH", amount_cents: 100000, received_date: "2026-08-03" }, as: LeasingAgent, captures: { paya: $.data.id } }
            - { call: "POST /api/payments", payload: { lease_id: "${lb}", tenant_id: "${ten}", channel: "ACH", amount_cents: 100000, received_date: "2026-08-03" }, as: LeasingAgent, captures: { payb: $.data.id } }
          trigger:
            - { call: "POST /api/payments/${paya}/transition", payload: { action: "POST" }, as: LeasingAgent }
            - { call: "POST /api/payments/${payb}/transition", payload: { action: "POST" }, as: LeasingAgent }
            - { call: "GET /api/allocations", payload: { payment_id: "${paya}" }, as: LeasingAgent }
            - { call: "GET /api/allocations", payload: { payment_id: "${payb}" }, as: LeasingAgent }
          assert:
            - "lease A (FEES_FIRST): damage charge ${da} outstanding_cents == 0 and status PAID; rent charge ${ra} outstanding_cents == 110000 and status PARTIALLY_PAID"
            - "lease B (RENT_FIRST): rent charge ${rb} outstanding_cents == 100000 and status PARTIALLY_PAID; damage charge ${db} outstanding_cents == 10000 and status OPEN"
            - "lease A allocations: [DAMAGE_FEE 10000 order 1, RENT 90000 order 2]; lease B allocations: [RENT 100000 order 1] only"

      - name: moveout_forward_vs_chronological_balance
        grounds:
          - calculations.move_out_reconciliation
          - state_machines.Lease.ACTIVE_to_ENDED
          - entities.CollectionsReferral.fields.referred_balance_cents
        distinguishing_aspect: |
          Same ledger at move-out: the forward (acceleration) variant counts the not-yet-due September
          charge at face value (400000 total), while the chronological variant excludes it and prorates
          the straddling August charge to 122581; the referral stores only the chronological figure.
        test_recipe:
          setup:
            - "Property PA (collections threshold 10000), ACTIVE lease (rent 200000, term 2026-08-01..2027-07-31) with RENT charge 200000 period 2026-08-01..2026-08-31 due 2026-08-01 and RENT charge 200000 period 2026-09-01..2026-09-30 due 2026-09-01; nothing paid; clock advanced to 2026-08-20"
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "Maple Court", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { prop: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { ten: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { lease: $.data.id } }
            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "RENT", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 200000 }, as: LeasingAgent }
            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "RENT", period_start_date: "2026-09-01", period_end_date: "2026-09-30", due_date: "2026-09-01", amount_cents: 200000 }, as: LeasingAgent }
            - { call: "POST /api/leases/${lease}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: SystemOps }
            - { call: "POST /api/leases/${lease}/transition", payload: { action: "MOVE_OUT", move_out_date: "2026-08-20" }, as: PropertyManager }
          trigger:
            - { call: "GET /api/leases/${lease}/ledger", as: PropertyManager, captures: { fwd: $.data.forward_balance_cents, chrono: $.data.chronological_balance_cents } }
            - { call: "GET /api/leases/${lease}/collections-referrals", as: PropertyManager, captures: { ref_bal: "$.data[0].referred_balance_cents", ref_status: "$.data[0].status" } }
          assert:
            - "captured fwd == 400000 (both charges at face value)"
            - "captured chrono == 122581 (September charge excluded as due after move-out; August prorated round_half_up(200000 * 19 / 31) = 122581)"
            - "captured ref_bal == 122581 and ref_status == PENDING (referral uses the chronological variant only)"

  - rule_id: combinatorial_formula
    instances:
      - name: late_fee_min_max_branch_formula
        grounds:
          - calculations.late_fee_assessment
          - entities.Lease.fields.late_fee_type
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — the PERCENT_PLUS_DAILY branch computes
          round_half_up(200000 * 500bps / 10000) + 100 * days_late(6) = 10600, and the outer
          min(raw, cap) clamp with cap 5000 yields 5000; the FLAT branch would ignore days_late
          entirely, so the formula's branch selection and nested min/max both change the result.
        test_recipe:
          setup:
            - "Property PC (late_fee_cap 5000), ACTIVE lease LC (rent 200000 due 2026-08-01, grace 3, PERCENT_PLUS_DAILY bps 500 daily 100), RENT charge unpaid, clock advanced to 2026-08-10"
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "Cedar Point", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { prop: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { ten: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 3, late_fee_type: "PERCENT_PLUS_DAILY", late_fee_percent_bps: 500, late_fee_daily_cents: 100, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { lease: $.data.id } }
            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "RENT", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 200000 }, as: LeasingAgent, captures: { rc: $.data.id } }
            - { call: "POST /api/leases/${lease}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: SystemOps }
          trigger:
            - { call: "POST /api/delinquency-runs", as: SystemOps, captures: { assessed: $.data.late_fees_assessed_count } }
            - { call: "GET /api/leases/${lease}/charges", payload: { kind: "LATE_FEE" }, as: PropertyManager, captures: { fee_amt: "$.data[0].amount_cents", fee_due: "$.data[0].due_date", fee_src: "$.data[0].source" } }
          assert:
            - "captured assessed == 1"
            - "captured fee_amt == 5000 (raw 10600 clamped by min() to the 5000 statutory cap; days_late = (10 - 1) - 3 = 6)"
            - "captured fee_due == '2026-08-10' and fee_src == SWEEP"

      - name: installment_split_rounding_order
        grounds:
          - calculations.installment_split
          - entities.PaymentPlan.fields.installments
        distinguishing_aspect: |
          Mode (b): pinned rounding order is floor-per-installment then remainder-to-earliest; for
          total 10000 over 3 installments this yields [3334, 3333, 3333], whereas the rejected
          'sum exact shares then round' order would yield 3333.33-rounded installments and a
          different first installment — the two orders disagree on the very first line.
        test_recipe:
          setup:
            - "Property PA (setup fee threshold 20000), ACTIVE lease with a single DAMAGE_FEE charge 10000 (below threshold, so no setup fee); clock 2026-08-01"
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "Maple Court", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { prop: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { ten: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { lease: $.data.id } }
            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "DAMAGE_FEE", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 10000 }, as: LeasingAgent, captures: { dc: $.data.id } }
            - { call: "POST /api/leases/${lease}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "GET /api/leases/${lease}", as: PropertyManager, captures: { lv: $.data.version } }
          trigger:
            - { call: "POST /api/payment-plans", payload: { lease_id: "${lease}", charge_ids: ["${dc}"], installment_count: 3, first_installment_date: "2026-08-15", expected_lease_version: "${lv}" }, as: LeasingAgent, captures: { plan: $.data.id, total: $.data.scheduled_total_cents } }
            - { call: "GET /api/payment-plans/${plan}", as: PropertyManager }
          assert:
            - "captured total == 10000 and plan setup_fee_cents == 0 (balance 10000 < threshold 20000)"
            - "installments == [{seq 1, due 2026-08-15, amount 3334}, {seq 2, due 2026-09-15, amount 3333}, {seq 3, due 2026-10-15, amount 3333}]"
            - "sum of installment amounts == scheduled_total_cents (3334 + 3333 + 3333 == 10000)"

      - name: setup_fee_preevaluation_order
        grounds:
          - calculations.plan_setup_fee_evaluation
          - entities.Property.fields.plan_setup_fee_threshold_cents
        distinguishing_aspect: |
          Mode (c): the setup fee is fixed by the PRE-FEE balance (pinned step order). A 19000 balance
          stays below the 20000 threshold so no fee applies — even though balance + fee would be
          21500 and cross the threshold; a circular evaluation would charge 2500 on the same input.
          A 20000 balance (== threshold, >=) charges 2500.
        test_recipe:
          setup:
            - "Property PA (setup fee 2500, threshold 20000); two ACTIVE leases (units 101 and 102); lease 1 carries DAMAGE_FEE 19000, lease 2 carries DAMAGE_FEE 20000; clock 2026-08-01"
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "Maple Court", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { prop: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { ten: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { l1: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "102", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { l2: $.data.id } }
            - { call: "POST /api/leases/${l1}/charges", payload: { kind: "DAMAGE_FEE", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 19000 }, as: LeasingAgent, captures: { c1: $.data.id } }
            - { call: "POST /api/leases/${l2}/charges", payload: { kind: "DAMAGE_FEE", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 20000 }, as: LeasingAgent, captures: { c2: $.data.id } }
            - { call: "POST /api/leases/${l1}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "POST /api/leases/${l2}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "GET /api/leases/${l1}", as: PropertyManager, captures: { lv1: $.data.version } }
            - { call: "GET /api/leases/${l2}", as: PropertyManager, captures: { lv2: $.data.version } }
          trigger:
            - { call: "POST /api/payment-plans", payload: { lease_id: "${l1}", charge_ids: ["${c1}"], installment_count: 2, first_installment_date: "2026-08-15", expected_lease_version: "${lv1}" }, as: LeasingAgent, captures: { p1: $.data.id, fee1: $.data.setup_fee_cents, tot1: $.data.scheduled_total_cents } }
            - { call: "POST /api/payment-plans", payload: { lease_id: "${l2}", charge_ids: ["${c2}"], installment_count: 2, first_installment_date: "2026-08-15", expected_lease_version: "${lv2}" }, as: LeasingAgent, captures: { p2: $.data.id, fee2: $.data.setup_fee_cents, tot2: $.data.scheduled_total_cents } }
            - { call: "GET /api/leases/${l2}/charges", payload: { kind: "PLAN_SETUP_FEE" }, as: PropertyManager, captures: { fee_charge: "$.data[0].amount_cents" } }
          assert:
            - "captured fee1 == 0 and tot1 == 19000 (pre-fee balance below threshold; circular evaluation would have charged 2500)"
            - "GET /api/leases/${l1}/charges?kind=PLAN_SETUP_FEE returns an empty list"
            - "captured fee2 == 2500 and tot2 == 22500 (balance == threshold satisfies >=)"
            - "captured fee_charge == 2500 (PLAN_SETUP_FEE charge persisted on lease 2, due 2026-08-15)"

  - rule_id: non_linear_state_machine
    instances:
      - name: payment_posted_returned_posted_cycle
        grounds:
          - state_machines.Payment.POSTED_to_RETURNED
          - state_machines.Payment.RETURNED_to_POSTED
          - calculations.payment_waterfall_allocation
        distinguishing_aspect: |
          Payment is a true cycle (POSTED -> RETURNED -> POSTED via re-presentment): the second
          posting re-runs the waterfall against the live ledger, so the NSF fee created by the
          return is itself paid first under FEES_FIRST, leaving rent at 3000 — a linear machine
          could never produce this allocation set.
        test_recipe:
          setup:
            - "Property PA (FEES_FIRST, nsf cap 3500), ACTIVE lease (FLAT fee config), RENT charge 200000 due 2026-08-01; ACH payment 200000 posted on 2026-08-01 (rent PAID); clock advanced to 2026-08-03"
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "Maple Court", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { prop: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { ten: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { lease: $.data.id } }
            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "RENT", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 200000 }, as: LeasingAgent, captures: { rc: $.data.id } }
            - { call: "POST /api/leases/${lease}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "POST /api/payments", payload: { lease_id: "${lease}", tenant_id: "${ten}", channel: "ACH", amount_cents: 200000, received_date: "2026-08-01" }, as: LeasingAgent, captures: { pay: $.data.id } }
            - { call: "POST /api/payments/${pay}/transition", payload: { action: "POST" }, as: LeasingAgent }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: SystemOps }
            - { call: "POST /api/payments/${pay}/transition", payload: { action: "RETURN", reason_code: "NSF", nsf_fee_cents: 3000 }, as: LeasingAgent, captures: { st1: $.data.status } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: SystemOps }
          trigger:
            - { call: "POST /api/payments/${pay}/transition", payload: { action: "POST" }, as: LeasingAgent, captures: { st2: $.data.status, rc_count: $.data.return_count } }
            - { call: "GET /api/leases/${lease}/charges", as: PropertyManager }
          assert:
            - "captured st1 == RETURNED and captured st2 == POSTED (cycle traversed), rc_count == 1"
            - "rent charge ${rc}: outstanding_cents == 3000 and status PARTIALLY_PAID (re-presentment paid the NSF fee first)"
            - "an NSF_FEE charge of 3000 exists with status PAID (allocation order 1 of the second waterfall run)"
            - "allocations of ${pay}: APPLY 200000 (run 1 order 1), REVERSE 200000, APPLY 3000 (run 2 order 1), APPLY 197000 (run 2 order 2)"

      - name: dispute_upheld_reopened_adjusted_cycle
        grounds:
          - state_machines.Dispute.RESOLVED_UPHELD_to_REOPENED
          - state_machines.Dispute.REOPENED_to_RESOLVED_ADJUSTED
        distinguishing_aspect: |
          Dispute is cyclic with a loop cap: OPEN -> RESOLVED_UPHELD -> REOPENED -> RESOLVED_ADJUSTED
          mutates the disputed charge on the second pass (amount 50000 -> 30000), proving the loop
          body re-executes Cascade C; reopen_count == 1 terminates the cycle.
        test_recipe:
          setup:
            - "Property PA, ACTIVE lease, DAMAGE_FEE charge 50000 due 2026-08-01 created by LeasingAgent; tenant filed a dispute on it; clock 2026-08-01"
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "Maple Court", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { prop: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { ten: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { lease: $.data.id } }
            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "DAMAGE_FEE", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 50000 }, as: LeasingAgent, captures: { dc: $.data.id } }
            - { call: "POST /api/leases/${lease}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "POST /api/disputes", payload: { lease_id: "${lease}", charge_id: "${dc}", tenant_id: "${ten}", reason: "not my damage" }, as: Tenant, as_user_id: "${ten}", captures: { disp: $.data.id } }
            - { call: "POST /api/disputes/${disp}/transition", payload: { action: "RESOLVE", outcome: "UPHELD" }, as: PropertyManager, captures: { s1: $.data.status } }
          trigger:
            - { call: "POST /api/disputes/${disp}/transition", payload: { action: "REOPEN" }, as: Tenant, as_user_id: "${ten}", captures: { s2: $.data.status, rc1: $.data.reopen_count } }
            - { call: "POST /api/disputes/${disp}/transition", payload: { action: "RESOLVE", outcome: "ADJUSTED", adjusted_amount_cents: 30000, resolution_notes: "split the difference" }, as: PropertyManager, captures: { s3: $.data.status } }
            - { call: "GET /api/leases/${lease}/charges", as: PropertyManager, captures: { amt: "$.data[0].amount_cents", out: "$.data[0].outstanding_cents" } }
          assert:
            - "statuses traversed: s1 == RESOLVED_UPHELD, s2 == REOPENED (rc1 == 1), s3 == RESOLVED_ADJUSTED"
            - "captured amt == 30000 and out == 30000 (Cascade C reduced the charge in place)"
            - "a further REOPEN would fail with ERR_DISPUTE_REOPEN_EXHAUSTED (loop cap reached)"

      - name: referral_referred_recalled_referred_cycle
        grounds:
          - state_machines.CollectionsReferral.REFERRED_to_RECALLED
          - state_machines.CollectionsReferral.RECALLED_to_REFERRED
        distinguishing_aspect: |
          CollectionsReferral cycles REFERRED -> RECALLED -> REFERRED (re-referral to a different
          agency): the second REFER re-evaluates the dispute and threshold preconditions against the
          live balance and re-stamps referred_date/agency_name.
        test_recipe:
          setup:
            - "Property PA (collections threshold 10000), lease ENDED via move-out on 2026-08-20 with one unpaid DAMAGE_FEE 150000 due 2026-08-01; a PENDING CollectionsReferral of 150000 exists"
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "Maple Court", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { prop: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { ten: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { lease: $.data.id } }
            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "DAMAGE_FEE", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 150000 }, as: LeasingAgent }
            - { call: "POST /api/leases/${lease}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: SystemOps }
            - { call: "POST /api/leases/${lease}/transition", payload: { action: "MOVE_OUT", move_out_date: "2026-08-20" }, as: PropertyManager }
            - { call: "GET /api/leases/${lease}/collections-referrals", as: PropertyManager, captures: { ref: "$.data[0].id" } }
          trigger:
            - { call: "POST /api/collections-referrals/${ref}/transition", payload: { action: "REFER", agency_name: "Agency One" }, as: PropertyManager, captures: { r1: $.data.status } }
            - { call: "POST /api/collections-referrals/${ref}/transition", payload: { action: "RECALL", recall_reason: "debtor contacted office" }, as: PropertyManager, captures: { r2: $.data.status } }
            - { call: "POST /api/collections-referrals/${ref}/transition", payload: { action: "REFER", agency_name: "Agency Two" }, as: PropertyManager, captures: { r3: $.data.status, agency: $.data.agency_name, rdate: $.data.referred_date } }
          assert:
            - "statuses traversed: r1 == REFERRED, r2 == RECALLED, r3 == REFERRED (cycle completed)"
            - "captured agency == 'Agency Two' and rdate == '2026-08-20' (re-referral re-stamps referral fields)"
            - "referred_balance_cents remains 150000 throughout the cycle"

  - rule_id: transitive_cascade
    instances:
      - name: nsf_return_cascade_depth4
        grounds:
          - state_machines.Payment.POSTED_to_RETURNED
          - state_machines.LedgerCharge.PAID_to_OPEN
          - calculations.notice_demand_amount
        distinguishing_aspect: |
          Depth-4 chain from a single RETURN trigger: payment flips RETURNED (1) -> REVERSE
          allocations are minted (2) -> the rent charge's outstanding/status recompute PAID -> OPEN
          (3) -> the DRAFT notice covering it recomputes its demand 0 -> 204000 (4); each link is
          caused by the previous link, not by the trigger, and the NSF fee creation is a separate
          link-4 branch.
        test_recipe:
          setup:
            - "Property PA, ACTIVE lease, RENT charge 200000 due 2026-08-01; DRAFT notice covering the rent charge created on 2026-08-01 (demand 204000 with provisional fee); payment 200000 posted 2026-08-01 so rent is PAID and the demand has recomputed to 0; clock 2026-08-03"
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "Maple Court", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { prop: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { ten: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { lease: $.data.id } }
            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "RENT", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 200000 }, as: LeasingAgent, captures: { rc: $.data.id } }
            - { call: "POST /api/leases/${lease}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "GET /api/leases/${lease}", as: PropertyManager, captures: { lv: $.data.version } }
            - { call: "POST /api/notices", payload: { lease_id: "${lease}", charge_ids: ["${rc}"], expected_lease_version: "${lv}" }, as: PropertyManager, captures: { notice: $.data.id, demand0: $.data.amount_demanded_cents } }
            - { call: "POST /api/payments", payload: { lease_id: "${lease}", tenant_id: "${ten}", channel: "ACH", amount_cents: 200000, received_date: "2026-08-01" }, as: LeasingAgent, captures: { pay: $.data.id } }
            - { call: "POST /api/payments/${pay}/transition", payload: { action: "POST" }, as: LeasingAgent }
            - { call: "GET /api/leases/${lease}/notices", as: PropertyManager, captures: { demand1: "$.data[0].amount_demanded_cents" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: SystemOps }
          trigger:
            - { call: "POST /api/payments/${pay}/transition", payload: { action: "RETURN", reason_code: "NSF", nsf_fee_cents: 3000 }, as: LeasingAgent, captures: { pst: $.data.status } }
            - { call: "GET /api/leases/${lease}/charges", as: PropertyManager }
            - { call: "GET /api/leases/${lease}/notices", as: PropertyManager, captures: { demand2: "$.data[0].amount_demanded_cents" } }
            - { call: "GET /api/allocations", payload: { payment_id: "${pay}" }, as: PropertyManager }
          assert:
            - "link 1: captured pst == RETURNED"
            - "link 2: allocations of ${pay} contain APPLY 200000 and a REVERSE 200000 mirroring it (note 'nsf-reversal')"
            - "link 3: rent charge ${rc} status == OPEN and outstanding_cents == 200000"
            - "link 4: captured demand0 == 204000, demand1 == 0 (after posting), demand2 == 204000 (restored outstanding plus provisional fee again)"
            - "link 4 (parallel branch): a new NSF_FEE charge of 3000 exists with due_date 2026-08-03 and source RETURN"

      - name: dispute_adjust_cascade_depth3
        grounds:
          - state_machines.Dispute.OPEN_to_RESOLVED_ADJUSTED
          - state_machines.CollectionsReferral.PENDING_to_RECALLED
        distinguishing_aspect: |
          Depth-3 chain from a RESOLVE trigger (different from the NSF trigger): charge amount is
          adjusted 15000 -> 5000 (1) -> outstanding recomputes (2) -> the PENDING referral's balance
          recomputes below the 10000 threshold and the referral auto-transitions to RECALLED with
          reason BALANCE_RESOLVED (3).
        test_recipe:
          setup:
            - "Property PA (collections threshold 10000), lease ENDED via move-out 2026-08-20, DAMAGE_FEE 15000 due 2026-08-01 unpaid, PENDING referral 15000; tenant dispute open on the damage charge"
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "Maple Court", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { prop: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { ten: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { lease: $.data.id } }
            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "DAMAGE_FEE", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 15000 }, as: LeasingAgent, captures: { dc: $.data.id } }
            - { call: "POST /api/leases/${lease}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: SystemOps }
            - { call: "POST /api/leases/${lease}/transition", payload: { action: "MOVE_OUT", move_out_date: "2026-08-20" }, as: PropertyManager }
            - { call: "GET /api/leases/${lease}/collections-referrals", as: PropertyManager, captures: { ref: "$.data[0].id", bal0: "$.data[0].referred_balance_cents" } }
            - { call: "POST /api/disputes", payload: { lease_id: "${lease}", charge_id: "${dc}", tenant_id: "${ten}", reason: "pre-existing damage" }, as: Tenant, as_user_id: "${ten}", captures: { disp: $.data.id } }
          trigger:
            - { call: "POST /api/disputes/${disp}/transition", payload: { action: "RESOLVE", outcome: "ADJUSTED", adjusted_amount_cents: 5000 }, as: PropertyManager }
            - { call: "GET /api/leases/${lease}/charges", as: PropertyManager, captures: { amt: "$.data[0].amount_cents", out: "$.data[0].outstanding_cents" } }
            - { call: "GET /api/leases/${lease}/collections-referrals", as: PropertyManager, captures: { bal1: "$.data[0].referred_balance_cents", rst: "$.data[0].status", rsn: "$.data[0].recall_reason" } }
          assert:
            - "captured bal0 == 15000 (referral existed above threshold)"
            - "link 1+2: captured amt == 5000 and out == 5000"
            - "link 3: captured bal1 == 5000, rst == RECALLED, rsn == 'BALANCE_RESOLVED' (auto-recall below threshold 10000)"

      - name: sweep_late_fee_notice_cascade_depth3
        grounds:
          - calculations.late_fee_assessment
          - calculations.notice_demand_amount
          - endpoints['POST /api/delinquency-runs']
        distinguishing_aspect: |
          Depth-3 chain from the ops-run trigger (different from RETURN and RESOLVE): the sweep
          assesses a LATE_FEE charge for the past-grace rent charge (1->2); the new assessed fee
          removes the provisional component from the DRAFT notice's demand, recomputing it
          204000 -> 200000 (2->3) — the notice mutation is caused by the charge creation, not by
          the sweep directly.
        test_recipe:
          setup:
            - "Property PA, ACTIVE lease (FLAT 4000, grace 5), RENT charge 200000 due 2026-08-01 unpaid; DRAFT notice covering it created 2026-08-01 with demand 204000; clock advanced to 2026-08-07 (days_late = 1)"
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "Maple Court", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { prop: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { ten: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { lease: $.data.id } }
            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "RENT", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 200000 }, as: LeasingAgent, captures: { rc: $.data.id } }
            - { call: "POST /api/leases/${lease}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "GET /api/leases/${lease}", as: PropertyManager, captures: { lv: $.data.version } }
            - { call: "POST /api/notices", payload: { lease_id: "${lease}", charge_ids: ["${rc}"], expected_lease_version: "${lv}" }, as: PropertyManager, captures: { notice: $.data.id, demand0: $.data.amount_demanded_cents } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T00:00:00Z" }, as: SystemOps }
          trigger:
            - { call: "POST /api/delinquency-runs", as: SystemOps, captures: { assessed: $.data.late_fees_assessed_count } }
            - { call: "GET /api/leases/${lease}/charges", payload: { kind: "LATE_FEE" }, as: PropertyManager, captures: { fee_amt: "$.data[0].amount_cents", fee_due: "$.data[0].due_date" } }
            - { call: "GET /api/leases/${lease}/notices", as: PropertyManager, captures: { demand1: "$.data[0].amount_demanded_cents" } }
          assert:
            - "captured assessed == 1; fee_amt == 4000 (FLAT, under cap 5000); fee_due == '2026-08-07'"
            - "captured demand0 == 204000 (provisional fee embedded pre-sweep)"
            - "captured demand1 == 200000 (assessed LATE_FEE now exists, so the provisional component drops out of the DRAFT demand)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: waive_state_beats_fiscal_cap
        grounds:
          - validations[priority=7]
          - validations[priority=16]
          - errors[ERR_CHARGE_NOT_WAIVABLE]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: the waive request targets a PAID charge (state
          failure) AND the property's 20000 monthly waiver cap is already exhausted (fiscal
          failure); state (priority 7) must win over fiscal (priority 16), yielding
          ERR_CHARGE_NOT_WAIVABLE, not ERR_WAIVER_CAP_EXCEEDED.
        test_recipe:
          setup:
            - "Property PA (monthly_waiver_cap 20000), ACTIVE lease; DAMAGE_FEE 20000 created by LeasingAgent and fully waived by PropertyManager (month total == cap); RENT charge 200000 created by LeasingAgent and fully paid (status PAID)"
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "Maple Court", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { prop: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { ten: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { lease: $.data.id } }
            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "DAMAGE_FEE", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 20000 }, as: LeasingAgent, captures: { dc: $.data.id } }
            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "RENT", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 200000 }, as: LeasingAgent, captures: { rc: $.data.id } }
            - { call: "POST /api/leases/${lease}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "POST /api/charges/${dc}/waive", payload: { amount_cents: 20000, reason: "goodwill" }, as: PropertyManager, captures: { wst: $.data.status } }
            - { call: "POST /api/payments", payload: { lease_id: "${lease}", tenant_id: "${ten}", channel: "CARD", amount_cents: 200000, received_date: "2026-08-01" }, as: LeasingAgent, captures: { pay: $.data.id } }
            - { call: "POST /api/payments/${pay}/transition", payload: { action: "POST" }, as: LeasingAgent }
          trigger:
            - { call: "POST /api/charges/${rc}/waive", payload: { amount_cents: 1, reason: "double failure probe" }, as: PropertyManager, captures: { err: $.data.error_id } }
          assert:
            - "captured wst == WAIVED (month waiver total is now exactly 20000 == cap, so the fiscal check would also fail any further waive)"
            - "captured err == ERR_CHARGE_NOT_WAIVABLE (state priority 7 beats business_fiscal priority 16; the PAID charge is not waivable regardless of the exhausted cap)"

      - name: plan_referential_beats_temporal
        grounds:
          - validations[priority=9]
          - validations[priority=12]
          - errors[ERR_CHARGE_NOT_ON_LEASE]
        distinguishing_aspect: |
          Category pair business_referential vs business_temporal: the plan request references a
          charge belonging to a DIFFERENT lease (referential failure) AND sets a past
          first_installment_date (temporal failure); referential (priority 9) must win over
          temporal (priority 12), yielding ERR_CHARGE_NOT_ON_LEASE, not
          ERR_INVALID_INSTALLMENT_SCHEDULE.
        test_recipe:
          setup:
            - "Property PA; two ACTIVE leases (units 101 and 102) for the same tenant; lease 101 holds DAMAGE_FEE 10000, lease 102 holds DAMAGE_FEE 30000; clock 2026-08-01"
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "Maple Court", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { prop: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { ten: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { l1: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "102", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { l2: $.data.id } }
            - { call: "POST /api/leases/${l1}/charges", payload: { kind: "DAMAGE_FEE", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 10000 }, as: LeasingAgent }
            - { call: "POST /api/leases/${l2}/charges", payload: { kind: "DAMAGE_FEE", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 30000 }, as: LeasingAgent, captures: { foreign_charge: $.data.id } }
            - { call: "POST /api/leases/${l1}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "POST /api/leases/${l2}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "GET /api/leases/${l1}", as: PropertyManager, captures: { lv1: $.data.version } }
          trigger:
            - { call: "POST /api/payment-plans", payload: { lease_id: "${l1}", charge_ids: ["${foreign_charge}"], installment_count: 3, first_installment_date: "2026-07-01", expected_lease_version: "${lv1}" }, as: LeasingAgent, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_CHARGE_NOT_ON_LEASE (referential priority 9 beats temporal priority 12 even though first_installment_date 2026-07-01 is also in the past)"

  - rule_id: boundary_precision_check
    instances:
      - name: grace_period_last_day_no_fee
        grounds:
          - calculations.late_fee_assessment
          - entities.Lease.fields.grace_period_days
        distinguishing_aspect: |
          Metric days-late at the inclusive grace edge via POST /api/delinquency-runs: a sweep on
          due_date + grace (2026-08-06) yields days_late == 0 and assesses nothing; one day later
          days_late == 1 assesses 4000. The boundary sits at >= 1, not > 1.
        test_recipe:
          setup:
            - "Property PA, ACTIVE lease (FLAT 4000, grace 5), RENT charge 200000 due 2026-08-01 unpaid; clock advanced to 2026-08-06 (last grace day)"
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "Maple Court", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { prop: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { ten: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { lease: $.data.id } }
            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "RENT", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 200000 }, as: LeasingAgent, captures: { rc: $.data.id } }
            - { call: "POST /api/leases/${lease}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: SystemOps }
          trigger:
            - { call: "POST /api/delinquency-runs", as: SystemOps, captures: { run1: $.data.late_fees_assessed_count } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T00:00:00Z" }, as: SystemOps }
            - { call: "POST /api/delinquency-runs", as: SystemOps, captures: { run2: $.data.late_fees_assessed_count } }
            - { call: "GET /api/leases/${lease}/charges", payload: { kind: "LATE_FEE" }, as: PropertyManager, captures: { fee_amt: "$.data[0].amount_cents" } }
          assert:
            - "captured run1 == 0 (days_late = max(0, 5 - 5) = 0 on the last grace day)"
            - "captured run2 == 1 and fee_amt == 4000 (days_late = 1 on 2026-08-07)"

      - name: late_fee_cap_equality_and_clamp
        grounds:
          - calculations.late_fee_assessment
          - entities.Property.fields.late_fee_cap_cents
        distinguishing_aspect: |
          Metric fee-cents vs cap, observed through POST /api/notices (the provisional demand embeds
          the clamped fee): raw fee exactly == cap (bps 250 -> 5000) is allowed, while raw 5020
          (bps 251) is clamped to 5000 — both notices demand exactly 205000, and 205020 for the
          second would prove the clamp missing.
        test_recipe:
          setup:
            - "Property PD (late_fee_cap 5000, cure window 10); ACTIVE lease D1 unit 101 (PERCENT_PLUS_DAILY bps 250, daily 0, grace 3) and ACTIVE lease D2 unit 102 (bps 251, daily 0, grace 3); each carries unpaid RENT 200000 due 2026-08-01; clock 2026-08-05 (provisional as_of 2026-08-15, days_late = 11)"
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "Dogwood", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { prop: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { ten: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 3, late_fee_type: "PERCENT_PLUS_DAILY", late_fee_percent_bps: 250, late_fee_daily_cents: 0, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { l1: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "102", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 3, late_fee_type: "PERCENT_PLUS_DAILY", late_fee_percent_bps: 251, late_fee_daily_cents: 0, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { l2: $.data.id } }
            - { call: "POST /api/leases/${l1}/charges", payload: { kind: "RENT", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 200000 }, as: LeasingAgent, captures: { rc1: $.data.id } }
            - { call: "POST /api/leases/${l2}/charges", payload: { kind: "RENT", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 200000 }, as: LeasingAgent, captures: { rc2: $.data.id } }
            - { call: "POST /api/leases/${l1}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "POST /api/leases/${l2}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: SystemOps }
            - { call: "GET /api/leases/${l1}", as: PropertyManager, captures: { lv1: $.data.version } }
            - { call: "GET /api/leases/${l2}", as: PropertyManager, captures: { lv2: $.data.version } }
          trigger:
            - { call: "POST /api/notices", payload: { lease_id: "${l1}", charge_ids: ["${rc1}"], expected_lease_version: "${lv1}" }, as: PropertyManager, captures: { d1: $.data.amount_demanded_cents } }
            - { call: "POST /api/notices", payload: { lease_id: "${l2}", charge_ids: ["${rc2}"], expected_lease_version: "${lv2}" }, as: PropertyManager, captures: { d2: $.data.amount_demanded_cents } }
          assert:
            - "captured d1 == 205000 (raw fee 200000 * 250bps == 5000 exactly equals the cap and is allowed in full)"
            - "captured d2 == 205000 (raw fee 5020 clamped by min() to 5000; an unclamped implementation would answer 205020)"

      - name: partial_payment_floor_exact_cent
        grounds:
          - validations[priority=15]
          - entities.Property.fields.min_partial_payment_percent
          - errors[ERR_PARTIAL_BELOW_MINIMUM]
        distinguishing_aspect: |
          Metric amount-cents via POST /api/payments/{id}/transition: with outstanding 200000 and
          min_partial_payment_percent 25 the floor is exactly 50000; a payment of 50000 posts, a
          payment of 49999 is rejected — the acceptance predicate is >= on a ceiled floor.
        test_recipe:
          setup:
            - "Property PA (min partial 25%), ACTIVE lease, RENT charge 200000 due 2026-08-01 unpaid; two PENDING payments of 49999 and 50000 recorded; clock 2026-08-01"
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "Maple Court", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { prop: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { ten: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { lease: $.data.id } }
            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "RENT", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 200000 }, as: LeasingAgent, captures: { rc: $.data.id } }
            - { call: "POST /api/leases/${lease}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "POST /api/payments", payload: { lease_id: "${lease}", tenant_id: "${ten}", channel: "CARD", amount_cents: 49999, received_date: "2026-08-01" }, as: LeasingAgent, captures: { p_low: $.data.id } }
            - { call: "POST /api/payments", payload: { lease_id: "${lease}", tenant_id: "${ten}", channel: "CARD", amount_cents: 50000, received_date: "2026-08-01" }, as: LeasingAgent, captures: { p_eq: $.data.id } }
          trigger:
            - { call: "POST /api/payments/${p_low}/transition", payload: { action: "POST" }, as: LeasingAgent, captures: { err: $.data.error_id } }
            - { call: "POST /api/payments/${p_eq}/transition", payload: { action: "POST" }, as: LeasingAgent, captures: { ok: $.data.status } }
            - { call: "GET /api/leases/${lease}/charges", as: PropertyManager, captures: { rout: "$.data[0].outstanding_cents", rst: "$.data[0].status" } }
          assert:
            - "captured err == ERR_PARTIAL_BELOW_MINIMUM (49999 < floor 50000)"
            - "captured ok == POSTED (50000 == floor satisfies >=)"
            - "captured rout == 150000 and rst == PARTIALLY_PAID"

      - name: referral_threshold_equality
        grounds:
          - validations[priority=17]
          - state_machines.CollectionsReferral.PENDING_to_REFERRED
          - errors[ERR_REFERRAL_THRESHOLD_NOT_MET]
        distinguishing_aspect: |
          Metric referral-balance-cents via POST /api/collections-referrals/{id}/transition: balance
          exactly == collections_threshold_cents (10000) may be REFERRED (>=), while 9999 (one cent
          under) is rejected — the predicate is inclusive at the threshold.
        test_recipe:
          setup:
            - "Property PA (threshold 10000); lease L1 ENDED via move-out 2026-08-20 with DAMAGE_FEE 10000 due 2026-08-01 (referral PENDING 10000); lease L2 ENDED via move-out 2026-08-20 with DAMAGE_FEE 9999 due 2026-08-01 (referral PENDING 9999)"
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "Maple Court", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { prop: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { ten: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { l1: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "102", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { l2: $.data.id } }
            - { call: "POST /api/leases/${l1}/charges", payload: { kind: "DAMAGE_FEE", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 10000 }, as: LeasingAgent }
            - { call: "POST /api/leases/${l2}/charges", payload: { kind: "DAMAGE_FEE", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 9999 }, as: LeasingAgent }
            - { call: "POST /api/leases/${l1}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "POST /api/leases/${l2}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: SystemOps }
            - { call: "POST /api/leases/${l1}/transition", payload: { action: "MOVE_OUT", move_out_date: "2026-08-20" }, as: PropertyManager }
            - { call: "POST /api/leases/${l2}/transition", payload: { action: "MOVE_OUT", move_out_date: "2026-08-20" }, as: PropertyManager }
            - { call: "GET /api/leases/${l1}/collections-referrals", as: PropertyManager, captures: { ref1: "$.data[0].id" } }
            - { call: "GET /api/leases/${l2}/collections-referrals", as: PropertyManager, captures: { ref2: "$.data[0].id" } }
          trigger:
            - { call: "POST /api/collections-referrals/${ref1}/transition", payload: { action: "REFER", agency_name: "Agency One" }, as: PropertyManager, captures: { st1: $.data.status } }
            - { call: "POST /api/collections-referrals/${ref2}/transition", payload: { action: "REFER", agency_name: "Agency One" }, as: PropertyManager, captures: { err2: $.data.error_id } }
          assert:
            - "captured st1 == REFERRED (balance 10000 == threshold satisfies >=)"
            - "captured err2 == ERR_REFERRAL_THRESHOLD_NOT_MET (balance 9999 is one cent below)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: payment_creation_gated_by_lease_state
        grounds:
          - validations[priority=6]
          - state_machines.Payment.PENDING_to_POSTED
          - errors[ERR_LEASE_NOT_ACTIVE]
        distinguishing_aspect: |
          Pair Payment -> Lease: a payment cannot even be created while its lease is DRAFT
          (ERR_LEASE_NOT_ACTIVE), succeeds once the lease is ACTIVE, and fails again once the lease
          is ENDED (ERR_LEASE_ALREADY_ENDED) — the payment lifecycle is gated by the lease machine
          at both ends.
        test_recipe:
          setup:
            - "Property PA, lease in DRAFT (FLAT config) with RENT charge 200000 due 2026-08-01; clock 2026-08-01"
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "Maple Court", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { prop: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { ten: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { lease: $.data.id } }
            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "RENT", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 200000 }, as: LeasingAgent }
          trigger:
            - { call: "POST /api/payments", payload: { lease_id: "${lease}", tenant_id: "${ten}", channel: "CARD", amount_cents: 200000, received_date: "2026-08-01" }, as: LeasingAgent, captures: { err1: $.data.error_id } }
            - { call: "POST /api/leases/${lease}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "POST /api/payments", payload: { lease_id: "${lease}", tenant_id: "${ten}", channel: "CARD", amount_cents: 200000, received_date: "2026-08-01" }, as: LeasingAgent, captures: { pay: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: SystemOps }
            - { call: "POST /api/leases/${lease}/transition", payload: { action: "MOVE_OUT", move_out_date: "2026-08-20" }, as: PropertyManager }
            - { call: "POST /api/payments", payload: { lease_id: "${lease}", tenant_id: "${ten}", channel: "CARD", amount_cents: 100000, received_date: "2026-08-20" }, as: LeasingAgent, captures: { err2: $.data.error_id } }
          assert:
            - "captured err1 == ERR_LEASE_NOT_ACTIVE (payment creation rejected while lease is DRAFT)"
            - "captured pay is a UUID (creation succeeds once ACTIVE)"
            - "captured err2 == ERR_LEASE_ALREADY_ENDED (payment creation rejected after move-out)"

      - name: referral_blocked_by_open_dispute
        grounds:
          - state_machines.CollectionsReferral.PENDING_to_REFERRED
          - validations[priority=14]
          - errors[ERR_BLOCKING_DISPUTE]
        distinguishing_aspect: |
          Pair CollectionsReferral -> Dispute: REFER is rejected while any dispute on the same lease
          is OPEN, and the identical request succeeds after the dispute resolves — the referral
          machine's precondition reads a different entity's state.
        test_recipe:
          setup:
            - "Property PA (threshold 10000), lease ENDED via move-out 2026-08-20 with unpaid DAMAGE_FEE 15000 due 2026-08-01; PENDING referral 15000; tenant dispute OPEN on the damage charge"
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "Maple Court", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { prop: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { ten: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { lease: $.data.id } }
            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "DAMAGE_FEE", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 15000 }, as: LeasingAgent, captures: { dc: $.data.id } }
            - { call: "POST /api/leases/${lease}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: SystemOps }
            - { call: "POST /api/leases/${lease}/transition", payload: { action: "MOVE_OUT", move_out_date: "2026-08-20" }, as: PropertyManager }
            - { call: "GET /api/leases/${lease}/collections-referrals", as: PropertyManager, captures: { ref: "$.data[0].id" } }
            - { call: "POST /api/disputes", payload: { lease_id: "${lease}", charge_id: "${dc}", tenant_id: "${ten}", reason: "charge contested" }, as: Tenant, as_user_id: "${ten}", captures: { disp: $.data.id } }
          trigger:
            - { call: "POST /api/collections-referrals/${ref}/transition", payload: { action: "REFER", agency_name: "Agency One" }, as: PropertyManager, captures: { err: $.data.error_id } }
            - { call: "POST /api/disputes/${disp}/transition", payload: { action: "RESOLVE", outcome: "UPHELD" }, as: PropertyManager }
            - { call: "POST /api/collections-referrals/${ref}/transition", payload: { action: "REFER", agency_name: "Agency One" }, as: PropertyManager, captures: { st: $.data.status } }
          assert:
            - "captured err == ERR_BLOCKING_DISPUTE (OPEN dispute on the lease blocks REFER)"
            - "captured st == REFERRED after the dispute was resolved UPHELD"

      - name: plan_approval_blocked_by_served_notice
        grounds:
          - state_machines.PaymentPlan.DRAFT_to_ACTIVE
          - validations[priority=14]
          - errors[ERR_ACTIVE_NOTICE_BLOCKS_PLAN]
        distinguishing_aspect: |
          Pair PaymentPlan -> DelinquencyNotice: APPROVE is rejected while any notice on the lease
          is SERVED, and succeeds after the notice is CURED by full payment plus a sweep — plan
          approval reads the notice machine's state, not the plan's own fields.
        test_recipe:
          setup:
            - "Property PA, ACTIVE lease (FLAT 4000, grace 5, cure window 10); RENT 200000 due 2026-08-01 and DAMAGE_FEE 10000 due 2026-08-01; notice covering the damage charge ISSUED 2026-08-01 and SERVED 2026-08-02; DRAFT plan covering the rent charge (total 202500 incl. 2500 setup fee) drafted by LeasingAgent; clock 2026-08-02"
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "Maple Court", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { prop: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { ten: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { lease: $.data.id } }
            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "RENT", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 200000 }, as: LeasingAgent, captures: { rc: $.data.id } }
            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "DAMAGE_FEE", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 10000 }, as: LeasingAgent, captures: { dc: $.data.id } }
            - { call: "POST /api/leases/${lease}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "GET /api/leases/${lease}", as: PropertyManager, captures: { lv1: $.data.version } }
            - { call: "POST /api/notices", payload: { lease_id: "${lease}", charge_ids: ["${dc}"], expected_lease_version: "${lv1}" }, as: PropertyManager, captures: { notice: $.data.id } }
            - { call: "POST /api/notices/${notice}/transition", payload: { action: "ISSUE" }, as: PropertyManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: SystemOps }
            - { call: "POST /api/notices/${notice}/transition", payload: { action: "SERVE", service_method: "PERSONAL", served_date: "2026-08-02" }, as: PropertyManager, captures: { nst: $.data.status } }
            - { call: "GET /api/leases/${lease}", as: PropertyManager, captures: { lv2: $.data.version } }
            - { call: "POST /api/payment-plans", payload: { lease_id: "${lease}", charge_ids: ["${rc}"], installment_count: 2, first_installment_date: "2026-08-15", expected_lease_version: "${lv2}" }, as: LeasingAgent, captures: { plan: $.data.id, ptot: $.data.scheduled_total_cents } }
          trigger:
            - { call: "POST /api/payment-plans/${plan}/transition", payload: { action: "APPROVE" }, as: PropertyManager, captures: { err: $.data.error_id } }
            - { call: "POST /api/payments", payload: { lease_id: "${lease}", tenant_id: "${ten}", channel: "CARD", amount_cents: 212500, received_date: "2026-08-02" }, as: LeasingAgent, captures: { pay: $.data.id } }
            - { call: "POST /api/payments/${pay}/transition", payload: { action: "POST" }, as: LeasingAgent }
            - { call: "POST /api/delinquency-runs", as: SystemOps, captures: { cured: $.data.notices_cured_count } }
            - { call: "POST /api/payment-plans/${plan}/transition", payload: { action: "APPROVE" }, as: PropertyManager, captures: { pst: $.data.status } }
          assert:
            - "captured nst == SERVED and captured err == ERR_ACTIVE_NOTICE_BLOCKS_PLAN (approval blocked)"
            - "captured ptot == 202500 (200000 balance + 2500 setup fee, threshold met)"
            - "captured cured == 1 (covered damage charge fully paid before the 2026-08-11 cure deadline)"
            - "captured pst == ACTIVE (identical APPROVE succeeds once no notice is SERVED)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: lease_term_half_open_overlap_on_unit
        grounds:
          - state_machines.Lease.DRAFT_to_ACTIVE
          - errors[ERR_LEASE_TERM_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: half-open [term_start_date, term_end_date) on the (property, unit)
          resource — a successor lease whose start equals the incumbent's end (2027-07-31 ==
          2027-07-31) ACTIVATES cleanly (adjacency is not overlap), while a lease starting one day
          earlier (2027-07-30) is rejected.
        test_recipe:
          setup:
            - "Property PA; lease A unit 101 term 2026-08-01..2027-07-31 ACTIVE; lease B unit 101 term 2027-07-31..2028-07-30 (DRAFT); lease C unit 101 term 2027-07-30..2028-07-29 (DRAFT); clock 2026-08-01"
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "Maple Court", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { prop: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { ten: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { la: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2027-07-31", term_end_date: "2028-07-30" }, as: PropertyManager, captures: { lb: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2027-07-30", term_end_date: "2028-07-29" }, as: PropertyManager, captures: { lc: $.data.id } }
            - { call: "POST /api/leases/${la}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager, captures: { ast: $.data.status } }
          trigger:
            - { call: "POST /api/leases/${lb}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager, captures: { bst: $.data.status } }
            - { call: "POST /api/leases/${lc}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager, captures: { cerr: $.data.error_id } }
          assert:
            - "captured ast == ACTIVE and bst == ACTIVE (adjacent half-open terms do not overlap)"
            - "captured cerr == ERR_LEASE_TERM_OVERLAP (C's term [2027-07-30, 2028-07-29) intersects A's [2026-08-01, 2027-07-31) on the shared unit)"

      - name: notice_coverage_closed_day_overlap
        grounds:
          - state_machines.DelinquencyNotice.DRAFT_to_ISSUED
          - errors[ERR_NOTICE_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Different interval semantics from the lease-term rule: notice coverage windows are
          CLOSED day ranges, so a notice covering a charge period 2026-08-15..2026-09-15 collides
          with an ISSUED notice covering 2026-08-01..2026-08-31 (they share 17 calendar days),
          while a notice covering 2026-09-01..2026-09-30 issues cleanly — resource is the lease's
          charge-period coverage, not the unit's occupancy.
        test_recipe:
          setup:
            - "Property PA, ACTIVE lease with RENT 200000 period 2026-08-01..2026-08-31, RENT 200000 period 2026-09-01..2026-09-30, DAMAGE_FEE 5000 period 2026-08-15..2026-09-15; clock 2026-08-02"
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "Maple Court", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { prop: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { ten: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { lease: $.data.id } }
            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "RENT", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 200000 }, as: LeasingAgent, captures: { r_aug: $.data.id } }
            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "RENT", period_start_date: "2026-09-01", period_end_date: "2026-09-30", due_date: "2026-09-01", amount_cents: 200000 }, as: LeasingAgent, captures: { r_sep: $.data.id } }
            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "DAMAGE_FEE", period_start_date: "2026-08-15", period_end_date: "2026-09-15", due_date: "2026-08-15", amount_cents: 5000 }, as: LeasingAgent, captures: { dmg: $.data.id } }
            - { call: "POST /api/leases/${lease}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: SystemOps }
            - { call: "GET /api/leases/${lease}", as: PropertyManager, captures: { lv1: $.data.version } }
            - { call: "POST /api/notices", payload: { lease_id: "${lease}", charge_ids: ["${r_aug}"], expected_lease_version: "${lv1}" }, as: PropertyManager, captures: { n1: $.data.id } }
            - { call: "POST /api/notices/${n1}/transition", payload: { action: "ISSUE" }, as: PropertyManager, captures: { n1st: $.data.status } }
            - { call: "GET /api/leases/${lease}", as: PropertyManager, captures: { lv2: $.data.version } }
            - { call: "POST /api/notices", payload: { lease_id: "${lease}", charge_ids: ["${r_sep}"], expected_lease_version: "${lv2}" }, as: PropertyManager, captures: { n2: $.data.id } }
          trigger:
            - { call: "POST /api/notices/${n2}/transition", payload: { action: "ISSUE" }, as: PropertyManager, captures: { n2st: $.data.status } }
            - { call: "GET /api/leases/${lease}", as: PropertyManager, captures: { lv3: $.data.version } }
            - { call: "POST /api/notices", payload: { lease_id: "${lease}", charge_ids: ["${dmg}"], expected_lease_version: "${lv3}" }, as: PropertyManager, captures: { n3: $.data.id } }
            - { call: "POST /api/notices/${n3}/transition", payload: { action: "ISSUE" }, as: PropertyManager, captures: { n3err: $.data.error_id } }
          assert:
            - "captured n1st == ISSUED (coverage 2026-08-01..2026-08-31)"
            - "captured n2st == ISSUED (coverage 2026-09-01..2026-09-30 shares no calendar day with n1)"
            - "captured n3err == ERR_NOTICE_PERIOD_OVERLAP (coverage 2026-08-15..2026-09-15 shares days 2026-08-15..2026-08-31 with ISSUED n1)"

  - rule_id: compensating_invariant
    instances:
      - name: ledger_identity_through_nsf_cycle
        grounds:
          - state_machines.Payment.POSTED_to_RETURNED
          - calculations.payment_waterfall_allocation
          - endpoints['GET /api/leases/{id}/ledger']
        distinguishing_aspect: |
          Conserved quantity: the lease ledger identity total_charged == total_waived +
          total_outstanding + total_applied_net. It must hold after a full posting
          (210000 == 0 + 0 + 210000), after the NSF reversal (213000 == 0 + 213000 + 0, the new
          NSF charge included), and after re-presentment (213000 == 0 + 3000 + 210000) — the
          forward/compensating pair never drifts.
        test_recipe:
          setup:
            - "Property PA (FEES_FIRST, nsf cap 3500), ACTIVE lease with RENT 200000 due 2026-08-01 and DAMAGE_FEE 10000 due 2026-08-01; clock 2026-08-01"
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "Maple Court", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { prop: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { ten: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { lease: $.data.id } }
            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "RENT", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 200000 }, as: LeasingAgent }
            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "DAMAGE_FEE", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 10000 }, as: LeasingAgent }
            - { call: "POST /api/leases/${lease}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "POST /api/payments", payload: { lease_id: "${lease}", tenant_id: "${ten}", channel: "ACH", amount_cents: 210000, received_date: "2026-08-01" }, as: LeasingAgent, captures: { pay: $.data.id } }
            - { call: "POST /api/payments/${pay}/transition", payload: { action: "POST" }, as: LeasingAgent }
            - { call: "GET /api/leases/${lease}/ledger", as: PropertyManager, captures: { c1: $.data.total_charged_cents, w1: $.data.total_waived_cents, o1: $.data.total_outstanding_cents, a1: $.data.total_applied_net_cents } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: SystemOps }
            - { call: "POST /api/payments/${pay}/transition", payload: { action: "RETURN", reason_code: "NSF", nsf_fee_cents: 3000 }, as: LeasingAgent }
            - { call: "GET /api/leases/${lease}/ledger", as: PropertyManager, captures: { c2: $.data.total_charged_cents, w2: $.data.total_waived_cents, o2: $.data.total_outstanding_cents, a2: $.data.total_applied_net_cents } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: SystemOps }
          trigger:
            - { call: "POST /api/payments/${pay}/transition", payload: { action: "POST" }, as: LeasingAgent }
            - { call: "GET /api/leases/${lease}/ledger", as: PropertyManager, captures: { c3: $.data.total_charged_cents, w3: $.data.total_waived_cents, o3: $.data.total_outstanding_cents, a3: $.data.total_applied_net_cents } }
          assert:
            - "after posting: c1 == 210000, w1 == 0, o1 == 0, a1 == 210000, and c1 == w1 + o1 + a1"
            - "after NSF return: c2 == 213000 (new NSF_FEE 3000), w2 == 0, o2 == 213000, a2 == 0, and c2 == w2 + o2 + a2"
            - "after re-presentment: c3 == 213000, w3 == 0, o3 == 3000 (rent remainder), a3 == 210000, and c3 == w3 + o3 + a3"

      - name: plan_schedule_total_conservation
        grounds:
          - calculations.installment_split
          - calculations.plan_setup_fee_evaluation
          - entities.PaymentPlan.fields.scheduled_total_cents
        distinguishing_aspect: |
          Conserved quantity: plan scheduled_total_cents == sum(installments.amount_cents) exactly,
          under both remainder distribution (10000 over 3 -> 3334+3333+3333) and fee-inclusive
          splits (22500 over 4 -> 5625 x 4) — a different conserved quantity from the ledger cash
          identity.
        test_recipe:
          setup:
            - "Property PA (setup fee 2500, threshold 20000); ACTIVE lease L1 with DAMAGE_FEE 10000; ACTIVE lease L2 with DAMAGE_FEE 20000; clock 2026-08-01"
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "Maple Court", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { prop: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { ten: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { l1: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "102", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { l2: $.data.id } }
            - { call: "POST /api/leases/${l1}/charges", payload: { kind: "DAMAGE_FEE", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 10000 }, as: LeasingAgent, captures: { c1: $.data.id } }
            - { call: "POST /api/leases/${l2}/charges", payload: { kind: "DAMAGE_FEE", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 20000 }, as: LeasingAgent, captures: { c2: $.data.id } }
            - { call: "POST /api/leases/${l1}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "POST /api/leases/${l2}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "GET /api/leases/${l1}", as: PropertyManager, captures: { lv1: $.data.version } }
            - { call: "GET /api/leases/${l2}", as: PropertyManager, captures: { lv2: $.data.version } }
          trigger:
            - { call: "POST /api/payment-plans", payload: { lease_id: "${l1}", charge_ids: ["${c1}"], installment_count: 3, first_installment_date: "2026-08-15", expected_lease_version: "${lv1}" }, as: LeasingAgent, captures: { p1: $.data.id, t1: $.data.scheduled_total_cents } }
            - { call: "POST /api/payment-plans", payload: { lease_id: "${l2}", charge_ids: ["${c2}"], installment_count: 4, first_installment_date: "2026-08-15", expected_lease_version: "${lv2}" }, as: LeasingAgent, captures: { p2: $.data.id, t2: $.data.scheduled_total_cents } }
            - { call: "GET /api/payment-plans/${p1}", as: PropertyManager }
            - { call: "GET /api/payment-plans/${p2}", as: PropertyManager }
          assert:
            - "plan ${p1}: t1 == 10000 and installments [3334, 3333, 3333] sum exactly to t1"
            - "plan ${p2}: t2 == 22500 (20000 balance + 2500 setup fee) and installments [5625, 5625, 5625, 5625] sum exactly to t2"
            - "no installment amount differs from the pinned floor-plus-remainder distribution by even one cent"

      - name: payment_application_conservation_on_return
        grounds:
          - state_machines.Payment.POSTED_to_RETURNED
          - entities.PaymentAllocation.fields.direction
        distinguishing_aspect: |
          Conserved quantity: per-payment applied total — sum(APPLY) == payment.amount_cents after
          posting (100000 == 10000 + 90000), and after the NSF return sum(REVERSE) == sum(APPLY)
          exactly (net applied zero), a different conserved quantity from both the lease-wide ledger
          identity and the plan schedule total.
        test_recipe:
          setup:
            - "Property PA (FEES_FIRST), ACTIVE lease with RENT 200000 due 2026-08-01 and DAMAGE_FEE 10000 due 2026-08-01; clock 2026-08-01"
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "Maple Court", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { prop: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { ten: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { lease: $.data.id } }
            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "RENT", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 200000 }, as: LeasingAgent }
            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "DAMAGE_FEE", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 10000 }, as: LeasingAgent }
            - { call: "POST /api/leases/${lease}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "POST /api/payments", payload: { lease_id: "${lease}", tenant_id: "${ten}", channel: "ACH", amount_cents: 100000, received_date: "2026-08-01" }, as: LeasingAgent, captures: { pay: $.data.id } }
            - { call: "POST /api/payments/${pay}/transition", payload: { action: "POST" }, as: LeasingAgent }
            - { call: "GET /api/allocations", payload: { payment_id: "${pay}" }, as: PropertyManager }
          trigger:
            - { call: "POST /api/payments/${pay}/transition", payload: { action: "RETURN", reason_code: "NSF", nsf_fee_cents: 3000 }, as: LeasingAgent }
            - { call: "GET /api/allocations", payload: { payment_id: "${pay}" }, as: PropertyManager }
          assert:
            - "after POST: allocations are exactly [APPLY 10000 to the damage charge (order 1), APPLY 90000 to rent (order 2)]; sum(APPLY) == 100000 == payment.amount_cents"
            - "after RETURN: allocations additionally contain [REVERSE 10000, REVERSE 90000]; sum(REVERSE) == sum(APPLY) == 100000 and net applied == 0"
            - "payment ${pay}.return_count == 1 and status == RETURNED"
