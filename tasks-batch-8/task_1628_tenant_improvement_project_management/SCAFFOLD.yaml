scenario: |
  Tenant Improvement Project Management (landlord side): TI allowance negotiation & work letter scope, tenant vs landlord work delineation, plan review & landlord approval of tenant drawings, contractor selection & building rules compliance, construction schedule vs rent commencement date, allowance disbursement with lien waivers & documentation, change order approval & tenant overage billing, punch & occupancy certificate

domain_name: "tenant-improvement-project-management"
api_prefix: "/api"

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Property
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Building display name"
      - name: address
        type: string
        source: input
        description: "Street address of the building"
      - name: max_concurrent_construction_projects
        type: integer
        source: input
        description: "Maximum number of TIProjects that may be in status CONSTRUCTION with overlapping [construction_start_date, construction_end_date] windows on this property"
        default: 2
        constraints: "integer >= 1"

  - name: LeaseSpace
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; owning building"
      - name: suite_number
        type: string
        source: input
        description: "Suite identifier, unique within the property"
      - name: floor
        type: integer
        source: input
        description: "Floor number"
      - name: rentable_sqft
        type: integer
        source: input
        description: "Rentable square footage"
        constraints: "integer > 0"
      - name: status
        type: enum
        source: system
        description: "Leasing lifecycle"
        default: VACANT
        constraints: "one of {VACANT, LEASED, UNDER_CONSTRUCTION}"

  - name: Tenant
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Tenant legal entity name"
      - name: contact_email
        type: string
        source: input
        description: "Primary contact email"
      - name: tax_id
        type: string
        source: input
        description: "Tenant tax identifier"

  - name: Lease
    parent: null
    common_fields: true
    fields:
      - name: space_id
        type: string
        source: input
        description: "FK -> LeaseSpace.id; leased premises"
      - name: tenant_id
        type: string
        source: input
        description: "FK -> Tenant.id; leasing tenant"
      - name: base_rent_annual_cents
        type: integer
        source: input
        description: "Annual base rent in cents"
        constraints: "integer > 0"
      - name: scheduled_rent_commencement_date
        type: datetime
        source: input
        description: "Contractual rent commencement date (UTC midnight)"
      - name: actual_rent_commencement_date
        type: datetime
        source: computed
        description: "Final rent commencement date after TI delay adjustment; null until occupancy certificate issuance"
        default: null
      - name: abatement_basis
        type: enum
        source: input
        description: "Which day-count variant the rent-abatement calculation uses"
        default: CALENDAR
        constraints: "one of {CALENDAR, BUSINESS}"
      - name: delay_responsibility
        type: enum
        source: system
        description: "Party charged with construction delay, declared at occupancy certificate issuance"
        default: NONE
        constraints: "one of {NONE, LANDLORD, TENANT}"
      - name: rent_abatement_credit_cents
        type: integer
        source: computed
        description: "Abatement credit computed by calc rent_abatement at occupancy certificate issuance"
        default: 0
      - name: lease_term_months
        type: integer
        source: input
        description: "Term length in months"
        constraints: "integer > 0"
      - name: status
        type: enum
        source: system
        description: "Lease lifecycle"
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, TERMINATED}"

  - name: TIProject
    parent: Lease
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: input
        description: "FK -> Lease.id; lease this build-out belongs to"
      - name: project_name
        type: string
        source: input
        description: "Project display name"
      - name: base_contract_cents
        type: integer
        source: input
        description: "Agreed base construction contract value in cents"
        constraints: "integer >= 0"
      - name: allowance_total_cents
        type: integer
        source: computed
        description: "TI allowance pool in cents; set from the executed WorkLetter's allowance_offer_cents"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Master project phase"
        default: INITIATED
        constraints: "one of {INITIATED, WORK_LETTER_NEGOTIATION, PLAN_REVIEW, PRE_CONSTRUCTION, CONSTRUCTION, PUNCH, CLOSEOUT, COMPLETED, CANCELLED}"
      - name: posture
        type: enum
        source: computed
        description: "Derived gate: ALLOWANCE_EXHAUSTED when allowance_total_cents > 0 and allowance_consumed_cents >= allowance_total_cents; else ON_HOLD when any draw is ON_HOLD; else OPEN"
        default: OPEN
        constraints: "one of {OPEN, ON_HOLD, ALLOWANCE_EXHAUSTED}"
      - name: construction_start_date
        type: datetime
        source: input
        description: "Planned construction window start (date, inclusive); set by start-construction"
        default: null
      - name: construction_end_date
        type: datetime
        source: input
        description: "Planned construction window end (date, inclusive); set by start-construction"
        default: null
      - name: substantial_completion_date
        type: datetime
        source: computed
        description: "Date of occupancy certificate issuance"
        default: null
      - name: occupancy_certificate_ref
        type: string
        source: input
        description: "Municipal certificate of occupancy reference number; set at issue-occupancy-certificate"
        default: null
      - name: total_cost_cents
        type: integer
        source: computed
        description: "base_contract_cents + sum(ChangeOrder.total_with_markup_cents for status APPROVED)"
        default: 0
      - name: allowance_consumed_cents
        type: integer
        source: computed
        description: "Final variant: sum(DisbursementRequest.approved_amount_cents for status IN {APPROVED, PAID})"
        default: 0
      - name: provisional_allowance_consumed_cents
        type: integer
        source: computed
        description: "Provisional variant: allowance_consumed_cents + sum(requested_amount_cents for draws IN {SUBMITTED, ON_HOLD}); read-side preview only, does not drive posture"
        default: 0
      - name: allowance_remaining_cents
        type: integer
        source: computed
        description: "allowance_total_cents - allowance_consumed_cents"
        default: 0
      - name: overage_cents
        type: integer
        source: computed
        description: "max(0, total_cost_cents - allowance_total_cents)"
        default: 0
      - name: retainage_held_cents
        type: integer
        source: computed
        description: "sum of retainage withheld across non-VOIDED approved draws minus retainage released"
        default: 0
      - name: retainage_released_cents
        type: integer
        source: computed
        description: "cumulative retainage released on final-draw payment"
        default: 0

  - name: WorkLetter
    parent: TIProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> TIProject.id; owning project"
      - name: version_no
        type: integer
        source: system
        description: "Sequential work-letter draft number within the project, starting at 1, assigned in created_at order"
      - name: scope_description
        type: string
        source: input
        description: "Narrative scope of TI work"
      - name: allowance_offer_cents
        type: integer
        source: input
        description: "Allowance amount offered in this draft"
        constraints: "integer >= 0"
      - name: work_delineation
        type: enum
        source: input
        description: "Who performs base building vs suite work"
        constraints: "one of {LANDLORD, TENANT, SPLIT}"
      - name: proposed_by
        type: enum
        source: system
        description: "Party that tabled the current draft, derived from the acting role"
        constraints: "one of {LANDLORD, TENANT}"
      - name: round_number
        type: integer
        source: system
        description: "Negotiation round; increments by 1 on every counter transition"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Negotiation lifecycle"
        default: DRAFT
        constraints: "one of {DRAFT, PROPOSED, COUNTERED, ACCEPTED, EXECUTED, WITHDRAWN}"

  - name: PlanSubmission
    parent: TIProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> TIProject.id; owning project"
      - name: revision_no
        type: integer
        source: system
        description: "Sequential revision number within the project, starting at 1, assigned in created_at order"
      - name: drawing_set_ref
        type: string
        source: input
        description: "External document reference for the drawing set"
      - name: review_round
        type: integer
        source: system
        description: "Number of completed review cycles on this submission"
        default: 0
      - name: submitted_at
        type: datetime
        source: system
        description: "Server timestamp of submission (logical clock)"
      - name: status
        type: enum
        source: system
        description: "Review lifecycle"
        default: SUBMITTED
        constraints: "one of {SUBMITTED, UNDER_REVIEW, APPROVED, REVISION_REQUIRED, REJECTED_FINAL, SUPERSEDED}"

  - name: PlanReviewComment
    parent: PlanSubmission
    common_fields: true
    fields:
      - name: submission_id
        type: string
        source: input
        description: "FK -> PlanSubmission.id; submission under review"
      - name: comment_text
        type: string
        source: input
        description: "Reviewer comment body"
      - name: severity
        type: enum
        source: input
        description: "Blocking power of the comment"
        constraints: "one of {INFO, REQUIRED, BLOCKING}"
      - name: status
        type: enum
        source: system
        description: "Resolution lifecycle"
        default: OPEN
        constraints: "one of {OPEN, RESOLVED}"

  - name: Contractor
    parent: null
    common_fields: true
    fields:
      - name: company_name
        type: string
        source: input
        description: "Contractor company name"
      - name: license_number
        type: string
        source: input
        description: "Contractor license number"
      - name: insurance_expiry_date
        type: datetime
        source: input
        description: "General-liability insurance expiry (UTC midnight)"
      - name: qualification_status
        type: enum
        source: system
        description: "Building qualification lifecycle"
        default: PENDING
        constraints: "one of {PENDING, QUALIFIED, SUSPENDED, REVOKED}"

  - name: ContractorEngagement
    parent: TIProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> TIProject.id; project engaging the contractor"
      - name: contractor_id
        type: string
        source: input
        description: "FK -> Contractor.id; engaged contractor"
      - name: building_rules_acknowledged
        type: boolean
        source: system
        description: "Set true by the ContractorRep via acknowledge-rules"
        default: false
      - name: scope_note
        type: string
        source: input
        description: "Trade / scope note for this engagement"
      - name: status
        type: enum
        source: system
        description: "Engagement lifecycle"
        default: PROPOSED
        constraints: "one of {PROPOSED, APPROVED, ACTIVE, SUSPENDED, TERMINATED, COMPLETED}"

  - name: ScheduleMilestone
    parent: ContractorEngagement
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: "FK -> ContractorEngagement.id; engagement performing the work"
      - name: milestone_name
        type: string
        source: input
        description: "Milestone label"
      - name: window_start
        type: datetime
        source: input
        description: "Work window start (half-open, inclusive)"
      - name: window_end
        type: datetime
        source: input
        description: "Work window end (half-open, exclusive); must be strictly after window_start"
      - name: work_type
        type: enum
        source: input
        description: "Work classification; STANDARD auto-confirms at creation, others require landlord confirm"
        constraints: "one of {STANDARD, NOISY, HOT_WORK, FREIGHT}"
      - name: status
        type: enum
        source: system
        description: "Milestone lifecycle"
        default: PLANNED
        constraints: "one of {PLANNED, CONFIRMED, COMPLETED, CANCELLED}"

  - name: ChangeOrder
    parent: TIProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> TIProject.id; owning project"
      - name: co_number
        type: integer
        source: system
        description: "Sequential CO number within the project, starting at 1, assigned in created_at order"
      - name: description
        type: string
        source: input
        description: "Change description"
      - name: lines
        type: array
        source: input
        description: "Array of {description: string, amount_cents: integer > 0}; at least one line required"
      - name: submitted_by
        type: enum
        source: system
        description: "Party that submitted the CO, derived from acting role"
        constraints: "one of {CONTRACTOR, TENANT}"
      - name: total_cost_cents
        type: integer
        source: computed
        description: "sum(lines[].amount_cents)"
        default: 0
      - name: markup_cents
        type: integer
        source: computed
        description: "per-line round_half_up(amount_cents * MARKUP_PCT) summed across lines (rounding order pinned in calc change_order_markup)"
        default: 0
      - name: total_with_markup_cents
        type: integer
        source: computed
        description: "total_cost_cents + markup_cents"
        default: 0
      - name: tenant_overage_share_cents
        type: integer
        source: computed
        description: "Tenant-funded portion per calc change_order_overage_share at approval"
        default: 0
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the LandlordApprover who approved the CO; stamped at approve; drives segregation-of-duties checks"
        default: null
      - name: approved_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of approval; primary ordering key for the overage-share sweep"
        default: null
      - name: status
        type: enum
        source: system
        description: "CO lifecycle"
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, APPROVED, REJECTED, VOIDED}"

  - name: DisbursementRequest
    parent: TIProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> TIProject.id; project drawing down the allowance"
      - name: draw_number
        type: integer
        source: system
        description: "Sequential draw number within the project, starting at 1, assigned in created_at order"
      - name: period_end_date
        type: datetime
        source: input
        description: "End of the work period this draw covers (must be <= current logical clock)"
      - name: requested_amount_cents
        type: integer
        source: input
        description: "Gross amount requested in cents"
        constraints: "integer > 0"
      - name: is_final_draw
        type: boolean
        source: input
        description: "Marks the closing draw; final draw withholds no retainage and releases held retainage on payment"
        default: false
      - name: approved_amount_cents
        type: integer
        source: computed
        description: "Gross amount approved; set at approve (may be less than requested)"
        default: 0
      - name: retainage_held_cents
        type: integer
        source: computed
        description: "Retainage withheld on this draw per calc disbursement_retainage"
        default: 0
      - name: net_payment_cents
        type: integer
        source: computed
        description: "approved_amount_cents - retainage_held_cents"
        default: 0
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the LandlordApprover who approved the draw; stamped at approve"
        default: null
      - name: status
        type: enum
        source: system
        description: "Draw lifecycle"
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, ON_HOLD, APPROVED, PAID, REJECTED, VOIDED}"

  - name: LienWaiver
    parent: DisbursementRequest
    common_fields: true
    fields:
      - name: disbursement_id
        type: string
        source: input
        description: "FK -> DisbursementRequest.id; draw this waiver supports"
      - name: contractor_id
        type: string
        source: input
        description: "FK -> Contractor.id; waiving contractor"
      - name: waiver_type
        type: enum
        source: input
        description: "Legal waiver form"
        constraints: "one of {CONDITIONAL_PROGRESS, UNCONDITIONAL_PROGRESS, CONDITIONAL_FINAL, UNCONDITIONAL_FINAL}"
      - name: amount_cents
        type: integer
        source: input
        description: "Amount covered by the waiver"
        constraints: "integer > 0"
      - name: status
        type: enum
        source: system
        description: "Waiver verification lifecycle"
        default: PENDING
        constraints: "one of {PENDING, VERIFIED, REJECTED}"

  - name: PunchItem
    parent: TIProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> TIProject.id; owning project"
      - name: assigned_engagement_id
        type: string
        source: input
        description: "FK -> ContractorEngagement.id; engagement responsible for the fix"
      - name: description
        type: string
        source: input
        description: "Deficiency description"
      - name: location
        type: string
        source: input
        description: "Suite location note"
      - name: severity
        type: enum
        source: input
        description: "Severity; LIFE_SAFETY blocks occupancy certification with a distinct error"
        constraints: "one of {COSMETIC, STANDARD, LIFE_SAFETY}"
      - name: status
        type: enum
        source: system
        description: "Punch lifecycle"
        default: OPEN
        constraints: "one of {OPEN, IN_PROGRESS, RESOLVED, VERIFIED}"

  - name: OverageInvoice
    parent: TIProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> TIProject.id; owning project"
      - name: invoice_number
        type: integer
        source: system
        description: "Sequential invoice number within the project, starting at 1, assigned in created_at order"
      - name: line_total_cents
        type: integer
        source: computed
        description: "sum of tenant_overage_share_cents over APPROVED, not-yet-invoiced ChangeOrders with share > 0, snapshotted at creation"
        default: 0
      - name: due_date
        type: datetime
        source: computed
        description: "issue date + INVOICE_DUE_DAYS days"
        default: null
      - name: status
        type: enum
        source: system
        description: "Invoice lifecycle"
        default: DRAFT
        constraints: "one of {DRAFT, ISSUED, PAID, DISPUTED, VOID}"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: LeaseSpace
    initial_state: VACANT
    terminal_states: []
    transitions:
      - from: VACANT
        to: LEASED
        trigger: "POST /api/leases/{id}/activate"
        actor: LandlordPM
        preconditions: ["Lease.status == DRAFT", "LeaseSpace.status == VACANT"]
        side_effects: ["LeaseSpace.version increments by 1"]
      - from: LEASED
        to: UNDER_CONSTRUCTION
        trigger: "POST /api/ti-projects/{id}/start-construction"
        actor: LandlordPM
        preconditions: ["TIProject transition preconditions hold"]
        side_effects: ["LeaseSpace.version increments by 1"]
      - from: UNDER_CONSTRUCTION
        to: LEASED
        trigger: "POST /api/ti-projects/{id}/issue-occupancy-certificate"
        actor: LandlordPM
        preconditions: ["TIProject transition preconditions hold"]
        side_effects: ["LeaseSpace.version increments by 1"]

  - entity: Lease
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/leases/{id}/activate"
        actor: LandlordPM
        preconditions: ["LeaseSpace referenced by space_id has status == VACANT"]
        side_effects:
          - "LeaseSpace(space_id).status VACANT -> LEASED"
          - "Lease.version increments by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /api/ti-projects/{id}/cancel when it is the lease's only non-terminal TIProject and cancellation propagates"
        actor: LandlordPM
        preconditions: ["All TIProjects of this lease are in terminal states {COMPLETED, CANCELLED}"]
        side_effects: ["Lease.version increments by 1"]
        note: "Termination itself is not exposed as a standalone endpoint in this scaffold; ACTIVE leases persist."

  - entity: Contractor
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: QUALIFIED
        trigger: "POST /api/contractors/{id}/qualify"
        actor: LandlordPM
        preconditions: ["Contractor.insurance_expiry_date > current logical clock"]
        side_effects: ["Contractor.version increments by 1"]
      - from: PENDING
        to: REVOKED
        trigger: "POST /api/contractors/{id}/revoke"
        actor: LandlordPM
        preconditions: []
        side_effects: ["Contractor.version increments by 1"]
      - from: QUALIFIED
        to: SUSPENDED
        trigger: "POST /api/contractors/{id}/suspend"
        actor: LandlordPM
        preconditions: []
        side_effects:
          - "Contractor.version increments by 1"
          - "Every ContractorEngagement of this contractor in status ACTIVE -> SUSPENDED"
      - from: SUSPENDED
        to: QUALIFIED
        trigger: "POST /api/contractors/{id}/reinstate"
        actor: LandlordPM
        preconditions: ["Contractor.insurance_expiry_date > current logical clock"]
        side_effects: ["Contractor.version increments by 1"]
        note: "Engagements SUSPENDED by the cascade stay SUSPENDED; each needs its own reinstate."
      - from: QUALIFIED
        to: REVOKED
        trigger: "POST /api/contractors/{id}/revoke"
        actor: LandlordPM
        preconditions: ["No ContractorEngagement of this contractor is in status ACTIVE"]
        side_effects: ["Contractor.version increments by 1"]

  - entity: TIProject
    initial_state: INITIATED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: INITIATED
        to: WORK_LETTER_NEGOTIATION
        trigger: "POST /api/ti-projects/{id}/work-letters (first WorkLetter creation)"
        actor: LandlordPM
        preconditions: ["TIProject.status == INITIATED"]
        side_effects: ["TIProject.version increments by 1"]
      - from: WORK_LETTER_NEGOTIATION
        to: PLAN_REVIEW
        trigger: "POST /api/ti-projects/{id}/begin-plan-review"
        actor: LandlordPM
        preconditions: ["Exactly one WorkLetter of the project has status == EXECUTED"]
        side_effects: ["TIProject.version increments by 1"]
      - from: PLAN_REVIEW
        to: PRE_CONSTRUCTION
        trigger: "POST /api/ti-projects/{id}/begin-pre-construction"
        actor: LandlordPM
        preconditions: ["At least one PlanSubmission of the project has status == APPROVED"]
        side_effects: ["TIProject.version increments by 1"]
      - from: PRE_CONSTRUCTION
        to: CONSTRUCTION
        trigger: "POST /api/ti-projects/{id}/start-construction"
        actor: LandlordPM
        preconditions:
          - "At least one ContractorEngagement of the project has status == ACTIVE"
          - "construction_end_date > construction_start_date"
          - "Property capacity: count of sibling TIProjects (same Property via Lease.space_id) in status CONSTRUCTION whose closed date windows [construction_start_date, construction_end_date] intersect the requested window is < Property.max_concurrent_construction_projects (calc property_construction_capacity)"
        side_effects:
          - "TIProject.construction_start_date / construction_end_date set from payload"
          - "LeaseSpace(Lease.space_id).status LEASED -> UNDER_CONSTRUCTION"
          - "TIProject.version increments by 1"
      - from: CONSTRUCTION
        to: PUNCH
        trigger: "POST /api/ti-projects/{id}/begin-punch"
        actor: LandlordPM
        preconditions:
          - "current logical clock >= TIProject.construction_end_date"
          - "Every ScheduleMilestone on every engagement of the project is in a terminal state {COMPLETED, CANCELLED}"
        side_effects: ["TIProject.version increments by 1"]
      - from: PUNCH
        to: CLOSEOUT
        trigger: "POST /api/ti-projects/{id}/issue-occupancy-certificate"
        actor: LandlordPM
        preconditions:
          - "No PunchItem of the project with severity == LIFE_SAFETY has status != VERIFIED"
          - "No PunchItem of the project has status != VERIFIED"
        side_effects:
          - "TIProject.occupancy_certificate_ref := payload.occupancy_certificate_ref; substantial_completion_date := payload.issued_on"
          - "Lease(lease_id).delay_responsibility := payload.delay_responsibility; calc rent_abatement runs; Lease.actual_rent_commencement_date and rent_abatement_credit_cents set"
          - "LeaseSpace(Lease.space_id).status UNDER_CONSTRUCTION -> LEASED"
          - "Every OverageInvoice of the project in status DRAFT -> ISSUED (invoice_number unchanged; calc invoice_due_date runs with effective date = certificate issued_on)"
          - "TIProject.version increments by 1"
      - from: CLOSEOUT
        to: COMPLETED
        trigger: "POST /api/ti-projects/{id}/complete"
        actor: LandlordPM
        preconditions:
          - "Every DisbursementRequest of the project is in a terminal state {PAID, REJECTED, VOIDED}"
          - "Every OverageInvoice of the project is in a terminal state {PAID, VOID}"
          - "Every ContractorEngagement of the project is in a terminal state {TERMINATED, COMPLETED}"
        side_effects: ["TIProject.version increments by 1"]
      - from: INITIATED
        to: CANCELLED
        trigger: "POST /api/ti-projects/{id}/cancel"
        actor: LandlordPM
        preconditions: []
        side_effects:
          - "Every non-terminal child cascades per the full compensation list below"
          - "TIProject.version increments by 1"
      - from: WORK_LETTER_NEGOTIATION
        to: CANCELLED
        trigger: "POST /api/ti-projects/{id}/cancel"
        actor: LandlordPM
        preconditions: []
        side_effects:
          - "Every WorkLetter in non-terminal {DRAFT, PROPOSED, COUNTERED, ACCEPTED} -> WITHDRAWN"
          - "TIProject.version increments by 1"
      - from: PLAN_REVIEW
        to: CANCELLED
        trigger: "POST /api/ti-projects/{id}/cancel"
        actor: LandlordPM
        preconditions: []
        side_effects:
          - "Every WorkLetter in {DRAFT, PROPOSED, COUNTERED, ACCEPTED} -> WITHDRAWN"
          - "Every PlanSubmission in non-terminal {SUBMITTED, UNDER_REVIEW, REVISION_REQUIRED} -> REJECTED_FINAL"
          - "TIProject.version increments by 1"
      - from: PRE_CONSTRUCTION
        to: CANCELLED
        trigger: "POST /api/ti-projects/{id}/cancel"
        actor: LandlordPM
        preconditions: []
        side_effects:
          - "WorkLetters/PlanSubmissions cascade as above"
          - "Every ContractorEngagement in {PROPOSED, APPROVED} -> TERMINATED"
          - "Every ChangeOrder in {DRAFT, SUBMITTED} -> REJECTED; APPROVED -> VOIDED with total_cost_cents compensation"
          - "TIProject.version increments by 1"
      - from: CONSTRUCTION
        to: CANCELLED
        trigger: "POST /api/ti-projects/{id}/cancel"
        actor: LandlordPM
        preconditions: []
        side_effects:
          - "Every WorkLetter in non-terminal {DRAFT, PROPOSED, COUNTERED, ACCEPTED} -> WITHDRAWN"
          - "Every PlanSubmission in non-terminal {SUBMITTED, UNDER_REVIEW, REVISION_REQUIRED} -> REJECTED_FINAL"
          - "Every ContractorEngagement in non-terminal {PROPOSED, APPROVED, ACTIVE, SUSPENDED} -> TERMINATED"
          - "Every ScheduleMilestone in non-terminal {PLANNED, CONFIRMED} -> CANCELLED"
          - "Every ChangeOrder in non-terminal {DRAFT, SUBMITTED} -> REJECTED; APPROVED -> VOIDED with compensation (total_cost_cents recomputed)"
          - "Every DisbursementRequest in non-terminal {DRAFT, SUBMITTED, ON_HOLD} -> VOIDED; APPROVED -> VOIDED with compensation (allowance_consumed_cents, retainage_held_cents recomputed)"
          - "Every OverageInvoice in non-terminal {DRAFT, ISSUED, DISPUTED} -> VOID"
          - "If LeaseSpace was UNDER_CONSTRUCTION for this project -> LEASED"
          - "TIProject.version increments by 1"
      - from: PUNCH
        to: CANCELLED
        trigger: "POST /api/ti-projects/{id}/cancel"
        actor: LandlordPM
        preconditions: []
        side_effects:
          - "Same compensation cascade as CONSTRUCTION -> CANCELLED; punch items are left as-is (terminal VERIFIED) or dropped from consideration"
          - "If LeaseSpace was UNDER_CONSTRUCTION for this project -> LEASED"
          - "TIProject.version increments by 1"
      - from: CLOSEOUT
        to: CANCELLED
        trigger: "POST /api/ti-projects/{id}/cancel"
        actor: LandlordPM
        preconditions: []
        side_effects:
          - "Same compensation cascade as CONSTRUCTION -> CANCELLED"
          - "TIProject.version increments by 1"

  - entity: WorkLetter
    initial_state: DRAFT
    terminal_states: [EXECUTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /api/work-letters/{id}/propose"
        actor: LandlordPM
        preconditions: ["TIProject.status == WORK_LETTER_NEGOTIATION"]
        side_effects: ["WorkLetter.proposed_by := LANDLORD", "WorkLetter.version increments by 1"]
      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /api/work-letters/{id}/counter"
        actor: TenantRep
        preconditions: ["TIProject.status == WORK_LETTER_NEGOTIATION", "TenantRep owns the lease (Lease.tenant_id == X-User-ID)"]
        side_effects: ["WorkLetter.round_number += 1", "WorkLetter.version increments by 1"]
      - from: COUNTERED
        to: PROPOSED
        trigger: "POST /api/work-letters/{id}/propose"
        actor: LandlordPM
        preconditions: ["TIProject.status == WORK_LETTER_NEGOTIATION"]
        side_effects: ["WorkLetter.proposed_by := LANDLORD", "WorkLetter.version increments by 1"]
        note: "Negotiation cycle PROPOSED -> COUNTERED -> PROPOSED may repeat without bound."
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /api/work-letters/{id}/accept"
        actor: TenantRep
        preconditions: ["TIProject.status == WORK_LETTER_NEGOTIATION", "TenantRep owns the lease"]
        side_effects: ["WorkLetter.version increments by 1"]
      - from: ACCEPTED
        to: EXECUTED
        trigger: "POST /api/work-letters/{id}/execute"
        actor: LandlordPM
        preconditions: ["No other WorkLetter of the same project is in status EXECUTED"]
        side_effects:
          - "TIProject.allowance_total_cents := this WorkLetter.allowance_offer_cents; allowance_remaining_cents recomputed"
          - "WorkLetter.version increments by 1; TIProject.version increments by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /api/work-letters/{id}/withdraw"
        actor: LandlordPM
        preconditions: []
        side_effects: ["WorkLetter.version increments by 1"]
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /api/work-letters/{id}/withdraw"
        actor: LandlordPM
        preconditions: []
        side_effects: ["WorkLetter.version increments by 1"]
      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /api/work-letters/{id}/withdraw"
        actor: LandlordPM
        preconditions: []
        side_effects: ["WorkLetter.version increments by 1"]

  - entity: PlanSubmission
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED_FINAL, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /api/plan-submissions/{id}/start-review"
        actor: LandlordPM
        preconditions: ["TIProject.status == PLAN_REVIEW"]
        side_effects: ["PlanSubmission.version increments by 1"]
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /api/plan-submissions/{id}/approve"
        actor: LandlordPM
        preconditions:
          - "TIProject.status == PLAN_REVIEW"
          - "No PlanReviewComment of this submission has status == OPEN and severity == BLOCKING"
        side_effects: ["PlanSubmission.version increments by 1"]
      - from: UNDER_REVIEW
        to: REVISION_REQUIRED
        trigger: "POST /api/plan-submissions/{id}/request-revision"
        actor: LandlordPM
        preconditions: ["TIProject.status == PLAN_REVIEW"]
        side_effects: ["PlanSubmission.review_round += 1", "PlanSubmission.version increments by 1"]
      - from: UNDER_REVIEW
        to: REJECTED_FINAL
        trigger: "POST /api/plan-submissions/{id}/reject-final"
        actor: LandlordPM
        preconditions: ["TIProject.status == PLAN_REVIEW"]
        side_effects: ["PlanSubmission.version increments by 1"]
      - from: REVISION_REQUIRED
        to: SUPERSEDED
        trigger: "POST /api/ti-projects/{id}/plan-submissions (creating the next revision)"
        actor: TenantRep
        preconditions: ["TIProject.status == PLAN_REVIEW"]
        side_effects:
          - "The prior submission in REVISION_REQUIRED -> SUPERSEDED"
          - "New PlanSubmission created with revision_no = prior revision_no + 1"
        note: "Revision cycle: REVISION_REQUIRED is exited only by filing a new submission, which supersedes the old one."

  - entity: PlanReviewComment
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /api/plan-review-comments/{id}/resolve"
        actor: LandlordPM
        preconditions: ["PlanSubmission(submission_id).status == UNDER_REVIEW"]
        side_effects: ["PlanReviewComment.version increments by 1"]

  - entity: ContractorEngagement
    initial_state: PROPOSED
    terminal_states: [TERMINATED, COMPLETED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /api/contractor-engagements/{id}/approve"
        actor: LandlordPM
        preconditions:
          - "building_rules_acknowledged == true"
          - "Contractor(contractor_id).insurance_expiry_date > current logical clock"
          - "Contractor(contractor_id).qualification_status == QUALIFIED"
        side_effects: ["ContractorEngagement.version increments by 1"]
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /api/contractor-engagements/{id}/activate"
        actor: LandlordPM
        preconditions: ["TIProject.status IN {PRE_CONSTRUCTION, CONSTRUCTION}"]
        side_effects: ["ContractorEngagement.version increments by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/contractor-engagements/{id}/suspend OR cascade from Contractor suspend"
        actor: LandlordPM
        preconditions: []
        side_effects: ["ContractorEngagement.version increments by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/contractor-engagements/{id}/reinstate"
        actor: LandlordPM
        preconditions: ["Contractor(contractor_id).qualification_status == QUALIFIED"]
        side_effects: ["ContractorEngagement.version increments by 1"]
      - from: PROPOSED
        to: TERMINATED
        trigger: "POST /api/contractor-engagements/{id}/terminate"
        actor: LandlordPM
        preconditions: ["No ScheduleMilestone of this engagement is in status CONFIRMED"]
        side_effects: ["ContractorEngagement.version increments by 1"]
      - from: APPROVED
        to: TERMINATED
        trigger: "POST /api/contractor-engagements/{id}/terminate"
        actor: LandlordPM
        preconditions: ["No ScheduleMilestone of this engagement is in status CONFIRMED"]
        side_effects: ["ContractorEngagement.version increments by 1"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /api/contractor-engagements/{id}/terminate"
        actor: LandlordPM
        preconditions: ["No ScheduleMilestone of this engagement is in status CONFIRMED"]
        side_effects:
          - "Every ScheduleMilestone of this engagement in PLANNED -> CANCELLED"
          - "ContractorEngagement.version increments by 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /api/contractor-engagements/{id}/complete"
        actor: LandlordPM
        preconditions:
          - "TIProject.status IN {PUNCH, CLOSEOUT}"
          - "Every ScheduleMilestone of this engagement is in a terminal state {COMPLETED, CANCELLED}"
          - "Every PunchItem assigned to this engagement has status == VERIFIED"
        side_effects: ["ContractorEngagement.version increments by 1"]

  - entity: ScheduleMilestone
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: CONFIRMED
        trigger: "POST /api/schedule-milestones/{id}/confirm (or immediately at creation when work_type == STANDARD)"
        actor: LandlordPM
        preconditions:
          - "ContractorEngagement(engagement_id).status == ACTIVE"
          - "No half-open interval overlap: no other milestone of the same engagement in status IN {PLANNED, CONFIRMED} has [window_start, window_end) intersecting this one (adjacency window_end == window_start is NOT an overlap)"
        side_effects: ["ScheduleMilestone.version increments by 1"]
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /api/schedule-milestones/{id}/complete"
        actor: ContractorRep
        preconditions:
          - "current logical clock >= ScheduleMilestone.window_end"
          - "ContractorRep owns the engagement (ContractorEngagement.contractor_id == X-User-ID)"
        side_effects: ["ScheduleMilestone.version increments by 1"]
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /api/schedule-milestones/{id}/cancel"
        actor: LandlordPM
        preconditions: []
        side_effects: ["ScheduleMilestone.version increments by 1"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /api/schedule-milestones/{id}/cancel"
        actor: LandlordPM
        preconditions: []
        side_effects: ["ScheduleMilestone.version increments by 1"]

  - entity: ChangeOrder
    initial_state: DRAFT
    terminal_states: [REJECTED, VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/change-orders/{id}/submit"
        actor: ContractorRep | TenantRep
        preconditions:
          - "TIProject.status IN {PRE_CONSTRUCTION, CONSTRUCTION, PUNCH}"
          - "TIProject.posture != ALLOWANCE_EXHAUSTED"
          - "ChangeOrder.lines is non-empty"
        side_effects:
          - "ChangeOrder.submitted_by := CONTRACTOR when actor is ContractorRep, TENANT when actor is TenantRep"
          - "ChangeOrder.version increments by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/change-orders/{id}/approve"
        actor: LandlordApprover
        preconditions: ["TIProject.status IN {PRE_CONSTRUCTION, CONSTRUCTION, PUNCH}"]
        side_effects:
          - "calc change_order_markup runs: total_cost_cents, markup_cents, total_with_markup_cents set"
          - "calc change_order_overage_share runs: tenant_overage_share_cents set (chronological headroom sweep)"
          - "TIProject.total_cost_cents recomputed; TIProject.overage_cents recomputed; TIProject.version increments by 1"
          - "ChangeOrder.version increments by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/change-orders/{id}/reject"
        actor: LandlordApprover
        preconditions: []
        side_effects: ["ChangeOrder.version increments by 1"]
      - from: APPROVED
        to: VOIDED
        trigger: "POST /api/change-orders/{id}/void"
        actor: LandlordApprover
        preconditions: ["No OverageInvoice in status ISSUED or PAID of the same project includes this ChangeOrder"]
        side_effects:
          - "TIProject.total_cost_cents -= this.total_with_markup_cents; overage_cents recomputed; TIProject.version increments by 1"
          - "ChangeOrder.version increments by 1"
        note: "Compensation invariant: approve-then-void leaves TIProject.total_cost_cents unchanged."

  - entity: DisbursementRequest
    initial_state: DRAFT
    terminal_states: [PAID, REJECTED, VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/disbursement-requests/{id}/submit"
        actor: ContractorRep
        preconditions:
          - "TIProject.status IN {CONSTRUCTION, PUNCH}"
          - "period_end_date <= current logical clock"
          - "At least one ContractorEngagement of the project has status == ACTIVE"
          - "TIProject.posture == OPEN"
        side_effects: ["DisbursementRequest.version increments by 1"]
      - from: SUBMITTED
        to: ON_HOLD
        trigger: "system cascade: TIProject.posture flips to ALLOWANCE_EXHAUSTED"
        actor: system
        preconditions: []
        side_effects: ["DisbursementRequest.version increments by 1"]
      - from: ON_HOLD
        to: SUBMITTED
        trigger: "system cascade: TIProject.posture flips back to OPEN"
        actor: system
        preconditions: []
        side_effects: ["DisbursementRequest.version increments by 1"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/disbursement-requests/{id}/approve"
        actor: LandlordApprover
        preconditions:
          - "TIProject.posture == OPEN"
          - "Segregation of duties: X-User-ID != any ChangeOrder.approved_by_user_id recorded on APPROVED ChangeOrders of the same project"
          - "At least one LienWaiver of this draw has status == VERIFIED and amount_cents == requested_amount_cents"
          - "payload.approved_amount_cents <= requested_amount_cents"
          - "payload.approved_amount_cents <= TIProject.allowance_remaining_cents"
        side_effects:
          - "calc disbursement_retainage runs: retainage_held_cents and net_payment_cents set on the draw"
          - "TIProject.allowance_consumed_cents += approved_amount_cents; retainage_held_cents += draw.retainage_held_cents; allowance_remaining_cents and provisional_allowance_consumed_cents recomputed; TIProject.version increments by 1"
          - "calc project_posture runs; on flip into ALLOWANCE_EXHAUSTED every other draw of the project in SUBMITTED -> ON_HOLD (cascade link 2)"
          - "DisbursementRequest.approved_by_user_id := X-User-ID; version increments by 1"
      - from: APPROVED
        to: PAID
        trigger: "POST /api/disbursement-requests/{id}/pay"
        actor: LandlordPM
        preconditions: []
        side_effects:
          - "If is_final_draw: TIProject.retainage_released_cents += TIProject.retainage_held_cents; TIProject.retainage_held_cents := 0; paid out amount = net_payment_cents + released retainage"
          - "TIProject.version increments by 1"
          - "DisbursementRequest.version increments by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/disbursement-requests/{id}/reject"
        actor: LandlordApprover
        preconditions: []
        side_effects: ["TIProject.provisional_allowance_consumed_cents recomputed; posture recomputed", "DisbursementRequest.version increments by 1"]
      - from: DRAFT
        to: VOIDED
        trigger: "POST /api/disbursement-requests/{id}/void"
        actor: ContractorRep
        preconditions: []
        side_effects: ["DisbursementRequest.version increments by 1"]
      - from: APPROVED
        to: VOIDED
        trigger: "POST /api/disbursement-requests/{id}/void"
        actor: LandlordApprover
        preconditions: []
        side_effects:
          - "Compensation: TIProject.allowance_consumed_cents -= approved_amount_cents; retainage_held_cents -= retainage_held_cents of this draw; allowance_remaining_cents recomputed; posture recomputed (ON_HOLD draws may return to SUBMITTED)"
          - "TIProject.version increments by 1; DisbursementRequest.version increments by 1"

  - entity: LienWaiver
    initial_state: PENDING
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /api/lien-waivers/{id}/verify"
        actor: LandlordPM
        preconditions: ["DisbursementRequest(disbursement_id).status IN {SUBMITTED, ON_HOLD}"]
        side_effects: ["LienWaiver.version increments by 1"]
      - from: PENDING
        to: REJECTED
        trigger: "POST /api/lien-waivers/{id}/reject"
        actor: LandlordPM
        preconditions: ["DisbursementRequest(disbursement_id).status IN {SUBMITTED, ON_HOLD}"]
        side_effects: ["LienWaiver.version increments by 1"]

  - entity: PunchItem
    initial_state: OPEN
    terminal_states: [VERIFIED]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /api/punch-items/{id}/start"
        actor: ContractorRep
        preconditions: ["ContractorRep owns the assigned engagement", "ContractorEngagement(assigned_engagement_id).status == ACTIVE"]
        side_effects: ["PunchItem.version increments by 1"]
      - from: IN_PROGRESS
        to: RESOLVED
        trigger: "POST /api/punch-items/{id}/resolve"
        actor: ContractorRep
        preconditions: ["ContractorRep owns the assigned engagement"]
        side_effects: ["PunchItem.version increments by 1"]
      - from: RESOLVED
        to: VERIFIED
        trigger: "POST /api/punch-items/{id}/verify"
        actor: BuildingEngineer
        preconditions: ["TIProject.status == PUNCH"]
        side_effects: ["PunchItem.version increments by 1"]
      - from: RESOLVED
        to: OPEN
        trigger: "POST /api/punch-items/{id}/reopen"
        actor: BuildingEngineer
        preconditions: ["TIProject.status == PUNCH"]
        side_effects: ["PunchItem.version increments by 1"]
        note: "Reopen cycle: verification failure returns the item to OPEN; it must traverse IN_PROGRESS -> RESOLVED again."

  - entity: OverageInvoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /api/overage-invoices/{id}/issue OR system cascade from issue-occupancy-certificate"
        actor: LandlordPM
        preconditions: ["TIProject.status IN {CONSTRUCTION, PUNCH, CLOSEOUT}"]
        side_effects: ["calc invoice_due_date runs (manual issue: clock date; cert cascade: certificate issued_on)", "OverageInvoice.version increments by 1"]
      - from: ISSUED
        to: PAID
        trigger: "POST /api/overage-invoices/{id}/pay"
        actor: TenantRep
        preconditions: ["TenantRep owns the lease (Lease.tenant_id == X-User-ID)"]
        side_effects: ["OverageInvoice.version increments by 1"]
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /api/overage-invoices/{id}/dispute"
        actor: TenantRep
        preconditions: ["TenantRep owns the lease"]
        side_effects: ["OverageInvoice.version increments by 1"]
      - from: DISPUTED
        to: ISSUED
        trigger: "POST /api/overage-invoices/{id}/reissue"
        actor: LandlordPM
        preconditions: []
        side_effects: ["OverageInvoice.version increments by 1"]
        note: "Dispute cycle: ISSUED -> DISPUTED -> ISSUED may repeat."
      - from: DRAFT
        to: VOID
        trigger: "POST /api/overage-invoices/{id}/void"
        actor: LandlordPM
        preconditions: []
        side_effects: ["OverageInvoice.version increments by 1"]
      - from: ISSUED
        to: VOID
        trigger: "POST /api/overage-invoices/{id}/void"
        actor: LandlordPM
        preconditions: []
        side_effects: ["OverageInvoice.version increments by 1"]

# =============================================================================
# 1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: work-letter-counter-stale-version
    parent_entity: WorkLetter
    write_endpoint: "POST /api/work-letters/{id}/counter"
    occ_field: "expected_work_letter_version"
    description: |
      Counter-proposing a WorkLetter whose version has advanced since the client
      last observed it is rejected. This captures the case where the landlord has
      just re-proposed (advancing round_number and version) and the tenant's
      counter is therefore drafted against a stale draft of the letter.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: change-order-create-stale-project
    parent_entity: TIProject
    write_endpoint: "POST /api/ti-projects/{id}/change-orders"
    occ_field: "expected_ti_project_version"
    description: |
      Creating a ChangeOrder against a TIProject whose version has advanced since
      the client last observed it is rejected. This captures the case where another
      writer has just mutated the project (e.g., approved a draw which advanced
      allowance_consumed_cents and version) and the new CO's headroom view is
      therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: disbursement-create-stale-project
    parent_entity: TIProject
    write_endpoint: "POST /api/ti-projects/{id}/disbursement-requests"
    occ_field: "expected_ti_project_version"
    description: |
      Creating a DisbursementRequest against a TIProject whose version has advanced
      since the client last observed it is rejected. This captures the case where a
      ChangeOrder approval has just recomputed total_cost_cents and flipped posture,
      leaving the draw writer's view of allowance_remaining_cents stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: disbursement_retainage
    trigger: "POST /api/disbursement-requests/{id}/approve (runs on the draw being approved)"
    algorithm: tiered_pricing
    formula: |
      cum_before = sum(d.approved_amount_cents for d in DisbursementRequest
                       where d.project_id == this.project_id
                       and d.status IN {APPROVED, PAID}
                       and d.id != this.id)
      threshold = RETAINAGE_TIER_THRESHOLD_PCT * TIProject.allowance_total_cents
      if this.is_final_draw:
          retainage_held_this_draw = 0
      else:
          pct = RETAINAGE_PCT_EARLY if cum_before < threshold else RETAINAGE_PCT_LATE
          # boundary pinned: cum_before == threshold -> LATE tier (uses >=)
          retainage_held_this_draw = round_half_up(this.approved_amount_cents * pct)
      this.retainage_held_cents = retainage_held_this_draw
      this.net_payment_cents = this.approved_amount_cents - retainage_held_this_draw
    input_set: "DisbursementRequests of the same project in states {APPROVED, PAID} only; SUBMITTED/ON_HOLD/DRAFT/REJECTED/VOIDED excluded"
    constants:
      RETAINAGE_PCT_EARLY: 0.10
      RETAINAGE_PCT_LATE: 0.05
      RETAINAGE_TIER_THRESHOLD_PCT: 0.50
    precision: "integer cents, round_half_up per draw"
    variants:
      - name: final_draw_release
        when: "is_final_draw == true"
        difference: "withholds 0 retainage on this draw; on pay, TIProject.retainage_held_cents is released in full (paid amount = net_payment_cents + released)"

  - name: allowance_consumption
    trigger: "on any DisbursementRequest transition into/out of {SUBMITTED, ON_HOLD, APPROVED, PAID, VOIDED, REJECTED} and on WorkLetter EXECUTED"
    algorithm: aggregation
    formula: |
      allowance_consumed_cents       = sum(d.approved_amount_cents for d where status IN {APPROVED, PAID})
      provisional_allowance_consumed = allowance_consumed_cents
                                     + sum(d.requested_amount_cents for d where status IN {SUBMITTED, ON_HOLD})
      allowance_remaining_cents      = allowance_total_cents - allowance_consumed_cents
    input_set: "DisbursementRequests of the same project; final variant counts {APPROVED, PAID}, provisional variant additionally counts {SUBMITTED, ON_HOLD} at requested_amount_cents"
    constants: {}
    precision: "integer cents, exact"
    variants:
      - name: provisional
        when: "posture gating and capacity previews"
        difference: "includes SUBMITTED/ON_HOLD draws at requested (unapproved) amounts, so provisional >= final whenever any draw awaits review"
      - name: final
        when: "allowance_remaining_cents enforcement at approve time"
        difference: "counts only APPROVED/PAID draws at approved amounts"

  - name: change_order_markup
    trigger: "POST /api/change-orders/{id}/approve (before overage share)"
    algorithm: aggregation
    formula: |
      # Rounding order PINNED: round each line first, then sum.
      for line in this.lines:
          line.markup_cents = round_half_up(line.amount_cents * MARKUP_PCT)
      this.total_cost_cents        = sum(line.amount_cents for line in this.lines)
      this.markup_cents            = sum(line.markup_cents for line in this.lines)
      this.total_with_markup_cents = this.total_cost_cents + this.markup_cents
      # Note: round_half_up(sum(amounts) * MARKUP_PCT) can differ from the pinned
      # per-line-then-sum order; the scaffold adopts per-line-then-sum.
    input_set: "the ChangeOrder's own lines array"
    constants:
      MARKUP_PCT: 0.10
    precision: "integer cents, round_half_up per line then sum"

  - name: change_order_overage_share
    trigger: "POST /api/change-orders/{id}/approve, immediately after change_order_markup"
    algorithm: chronological
    formula: |
      # Evaluation order PINNED (resolves the circular-looking dependency):
      #   (1) headroom := allowance_total_cents - base_contract_cents
      #   (2) sweep APPROVED COs of the project in approval order
      #       (approved_at ASC, tie-break created_at ASC) excluding this CO
      #   (3) share := max(0, cum_including_this - headroom)
      #                 - max(0, cum_before_this - headroom)
      headroom = TIProject.allowance_total_cents - TIProject.base_contract_cents
      cum_before = sum(co.total_with_markup_cents for co in ChangeOrder
                       where co.project_id == this.project_id and co.status == APPROVED
                       order by approved_at ASC, created_at ASC)
      cum_after = cum_before + this.total_with_markup_cents
      this.tenant_overage_share_cents = max(0, cum_after - headroom) - max(0, cum_before - headroom)
    input_set: "APPROVED ChangeOrders of the same project excluding this one; REJECTED/VOIDED/DRAFT/SUBMITTED excluded"
    constants: {}
    precision: "integer cents, exact"

  - name: rent_abatement
    trigger: "POST /api/ti-projects/{id}/issue-occupancy-certificate"
    algorithm: threshold
    formula: |
      daily_rent_cents = round_half_up(Lease.base_rent_annual_cents / DAYS_PER_YEAR)
      if substantial_completion_date <= scheduled_rent_commencement_date:
          delay_days = 0
      else:
          period = (scheduled_rent_commencement_date, substantial_completion_date]  # exclusive start, inclusive end
          if Lease.abatement_basis == CALENDAR:
              delay_days = count of all dates in period
          else:  # BUSINESS
              delay_days = count of dates in period whose weekday IN {Mon, Tue, Wed, Thu, Fri}
      if Lease.delay_responsibility == LANDLORD:
          Lease.rent_abatement_credit_cents = delay_days * daily_rent_cents
          Lease.actual_rent_commencement_date = substantial_completion_date
      elif Lease.delay_responsibility == TENANT:
          Lease.rent_abatement_credit_cents = 0
          Lease.actual_rent_commencement_date = scheduled_rent_commencement_date
      else:  # NONE — on-time delivery
          Lease.rent_abatement_credit_cents = 0
          Lease.actual_rent_commencement_date = scheduled_rent_commencement_date
    input_set: "the project's Lease plus TIProject.substantial_completion_date"
    constants:
      DAYS_PER_YEAR: 365
    precision: "integer cents; daily rate round_half_up; whole-day counts"
    variants:
      - name: calendar_basis
        when: "Lease.abatement_basis == CALENDAR"
        difference: "counts every date in the delay period"
      - name: business_basis
        when: "Lease.abatement_basis == BUSINESS"
        difference: "excludes Saturday/Sunday dates from the delay period, producing a strictly smaller credit whenever the period spans a weekend"

  - name: property_construction_capacity
    trigger: "POST /api/ti-projects/{id}/start-construction"
    algorithm: interval_merge
    formula: |
      # Closed date-interval intersection on [construction_start_date, construction_end_date]
      # (dates, inclusive both ends — unlike milestone half-open windows).
      siblings = TIProject p where p.id != this.id
                 and LeaseSpace(Lease(p.lease_id).space_id).property_id == this_property_id
                 and p.status == CONSTRUCTION
      conflicts = count of p in siblings where
                  p.construction_start_date <= requested_end_date
                  and requested_start_date <= p.construction_end_date
      allowed if conflicts < Property.max_concurrent_construction_projects
    input_set: "sibling TIProjects on the same Property in status CONSTRUCTION only"
    constants: {}
    precision: "whole days, closed-interval semantics"

  - name: project_posture
    trigger: "after any recompute of allowance_consumed_cents (draw approve/void/pay, cancellation compensation)"
    algorithm: threshold
    formula: |
      if allowance_total_cents > 0 and allowance_consumed_cents >= allowance_total_cents:
          posture = ALLOWANCE_EXHAUSTED
      elif any DisbursementRequest of the project has status == ON_HOLD:
          posture = ON_HOLD
      else:
          posture = OPEN
      # boundary pinned: consumed == allowance_total -> EXHAUSTED (uses >=)
      on transition into ALLOWANCE_EXHAUSTED: every draw in SUBMITTED -> ON_HOLD
      on transition out of ALLOWANCE_EXHAUSTED to OPEN: every draw in ON_HOLD -> SUBMITTED
    input_set: "the project's allowance_consumed_cents (final variant) and its draws' states"
    constants: {}
    precision: "integer cents comparison, exact"

  - name: invoice_due_date
    trigger: "POST /api/overage-invoices/{id}/issue and the DRAFT -> ISSUED cascade at occupancy certificate issuance"
    algorithm: chronological
    formula: |
      # Effective issue date is pinned per path:
      #   manual issue endpoint  -> date(current logical clock)
      #   cert-issuance cascade  -> TIProject.substantial_completion_date (the certificate's issued_on)
      OverageInvoice.due_date = effective_issue_date + INVOICE_DUE_DAYS days
    input_set: "the OverageInvoice being issued"
    constants:
      INVOICE_DUE_DAYS: 30
    precision: "whole days, date arithmetic"

  - name: milestone_window_overlap
    trigger: "POST /api/contractor-engagements/{id}/milestones and POST /api/schedule-milestones/{id}/confirm"
    algorithm: interval_merge
    formula: |
      # Half-open intervals [window_start, window_end) on the same engagement.
      # Overlap iff existing.window_start < new.window_end and new.window_start < existing.window_end.
      # Adjacency (existing.window_end == new.window_start) is NOT an overlap.
      conflicts = count of m in ScheduleMilestone
                  where m.engagement_id == this.engagement_id
                  and m.id != this.id
                  and m.status IN {PLANNED, CONFIRMED}
                  and m.window_start < this.window_end
                  and this.window_start < m.window_end
      allowed if conflicts == 0
    input_set: "ScheduleMilestones of the same engagement in {PLANNED, CONFIRMED}; COMPLETED/CANCELLED ignored"
    constants: {}
    precision: "millisecond timestamps, half-open semantics"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lower number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Entity-backed ownership scope: TenantRep's X-User-ID equals Lease.tenant_id of the targeted project/invoice; ContractorRep's X-User-ID equals the targeted engagement's contractor_id"
    error_id: ERR_FORBIDDEN_SCOPE
    http_status: 403
    applies_to: "all scoped TenantRep/ContractorRep endpoints"
  - priority: 4
    category: existence
    check: "Path resources exist, validated left-to-right (property, space, tenant, lease, project, child)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: existence
    check: "Request body is well-formed: required fields present, types correct, enum members valid, monetary amounts integer cents"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 6
    category: state
    check: "Target entity is in a state from which the requested transition exists (per §1.2); terminal states reject all transitions"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: business_safety
    check: "Building rules acknowledged before engagement approval"
    error_id: ERR_BUILDING_RULES_NOT_ACKNOWLEDGED
    http_status: 422
    applies_to: "POST /api/contractor-engagements/{id}/approve"
  - priority: 8
    category: business_safety
    check: "Contractor insurance not expired at the current logical clock"
    error_id: ERR_INSURANCE_EXPIRED
    http_status: 422
    applies_to: "POST /api/contractors/{id}/qualify, POST /api/contractors/{id}/reinstate, POST /api/contractor-engagements/{id}/approve"
  - priority: 9
    category: business_safety
    check: "Occupancy certificate blocked while any LIFE_SAFETY punch item is not VERIFIED"
    error_id: ERR_LIFE_SAFETY_ITEM_OPEN
    http_status: 422
    applies_to: "POST /api/ti-projects/{id}/issue-occupancy-certificate"
  - priority: 10
    category: business_constraint
    check: "Occupancy certificate blocked while any punch item (any severity) is not VERIFIED"
    error_id: ERR_PUNCH_ITEMS_OPEN
    http_status: 422
    applies_to: "POST /api/ti-projects/{id}/issue-occupancy-certificate"
  - priority: 11
    category: business_constraint
    check: "Plan approval blocked while any BLOCKING review comment is OPEN"
    error_id: ERR_BLOCKING_COMMENTS_OPEN
    http_status: 422
    applies_to: "POST /api/plan-submissions/{id}/approve"
  - priority: 12
    category: business_constraint
    check: "Milestone window overlaps another PLANNED/CONFIRMED milestone on the same engagement (half-open semantics)"
    error_id: ERR_SCHEDULE_OVERLAP
    http_status: 409
    applies_to: "POST /api/contractor-engagements/{id}/milestones, POST /api/schedule-milestones/{id}/confirm"
  - priority: 13
    category: business_constraint
    check: "Property construction capacity exceeded (closed-interval window intersection among CONSTRUCTION siblings >= max_concurrent_construction_projects)"
    error_id: ERR_PROPERTY_CONSTRUCTION_CAPACITY
    http_status: 409
    applies_to: "POST /api/ti-projects/{id}/start-construction"
  - priority: 14
    category: business_constraint
    check: "Only one non-terminal TIProject per lease (status NOT IN {COMPLETED, CANCELLED})"
    error_id: ERR_ACTIVE_PROJECT_EXISTS
    http_status: 409
    applies_to: "POST /api/leases/{id}/ti-projects"
  - priority: 15
    category: business_constraint
    check: "Only one EXECUTED WorkLetter per project"
    error_id: ERR_WORK_LETTER_ALREADY_EXECUTED
    http_status: 409
    applies_to: "POST /api/work-letters/{id}/execute"
  - priority: 16
    category: business_temporal
    check: "window_end strictly after window_start"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /api/contractor-engagements/{id}/milestones"
  - priority: 17
    category: business_temporal
    check: "construction_end_date strictly after construction_start_date"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /api/ti-projects/{id}/start-construction"
  - priority: 18
    category: business_temporal
    check: "Disbursement period_end_date must not be after the current logical clock"
    error_id: ERR_DISBURSEMENT_PERIOD_IN_FUTURE
    http_status: 422
    applies_to: "POST /api/disbursement-requests/{id}/submit"
  - priority: 19
    category: business_temporal
    check: "begin-punch requires current logical clock >= construction_end_date"
    error_id: ERR_CONSTRUCTION_WINDOW_NOT_ENDED
    http_status: 422
    applies_to: "POST /api/ti-projects/{id}/begin-punch"
  - priority: 20
    category: business_temporal
    check: "Milestone completion requires current logical clock >= window_end"
    error_id: ERR_MILESTONE_WINDOW_NOT_ENDED
    http_status: 422
    applies_to: "POST /api/schedule-milestones/{id}/complete"
  - priority: 21
    category: business_referential
    check: "Contractor must be QUALIFIED for engagement approval / reinstatement"
    error_id: ERR_CONTRACTOR_NOT_QUALIFIED
    http_status: 422
    applies_to: "POST /api/contractor-engagements/{id}/approve, POST /api/contractor-engagements/{id}/reinstate"
  - priority: 22
    category: business_referential
    check: "At least one ACTIVE ContractorEngagement on the project before draws may be submitted"
    error_id: ERR_NO_ACTIVE_ENGAGEMENT
    http_status: 422
    applies_to: "POST /api/disbursement-requests/{id}/submit"
  - priority: 23
    category: business_referential
    check: "Exactly one EXECUTED WorkLetter exists before plan review begins; at least one APPROVED PlanSubmission before pre-construction; at least one ACTIVE engagement before construction start"
    error_id: ERR_PREREQUISITE_NOT_MET
    http_status: 422
    applies_to: "POST /api/ti-projects/{id}/begin-plan-review, POST /api/ti-projects/{id}/begin-pre-construction, POST /api/ti-projects/{id}/start-construction"
  - priority: 24
    category: business_referential
    check: "A VERIFIED lien waiver is attached to the draw before approval"
    error_id: ERR_LIEN_WAIVER_MISSING
    http_status: 422
    applies_to: "POST /api/disbursement-requests/{id}/approve"
  - priority: 25
    category: business_referential
    check: "VERIFIED lien waiver amount equals the draw's requested_amount_cents"
    error_id: ERR_LIEN_WAIVER_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /api/disbursement-requests/{id}/approve"
  - priority: 26
    category: business_referential
    check: "Segregation of duties: the disbursement approver's X-User-ID must differ from every approved ChangeOrder's approved_by_user_id on the same project"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /api/disbursement-requests/{id}/approve"
  - priority: 27
    category: business_fiscal
    check: "TIProject.posture must be OPEN for draw submission and approval (not ON_HOLD / ALLOWANCE_EXHAUSTED)"
    error_id: ERR_PROJECT_NOT_OPEN
    http_status: 422
    applies_to: "POST /api/disbursement-requests/{id}/submit, POST /api/disbursement-requests/{id}/approve, POST /api/change-orders/{id}/submit"
  - priority: 28
    category: business_fiscal
    check: "approved_amount_cents <= requested_amount_cents"
    error_id: ERR_APPROVAL_EXCEEDS_REQUEST
    http_status: 422
    applies_to: "POST /api/disbursement-requests/{id}/approve"
  - priority: 29
    category: business_fiscal
    check: "approved_amount_cents <= TIProject.allowance_remaining_cents (boundary: exactly equal is allowed)"
    error_id: ERR_DRAW_EXCEEDS_REMAINING
    http_status: 422
    applies_to: "POST /api/disbursement-requests/{id}/approve"
  - priority: 30
    category: business_fiscal
    check: "Overage invoice creation requires uninvoiced APPROVED change orders with tenant_overage_share_cents > 0"
    error_id: ERR_NO_OVERAGE_OUTSTANDING
    http_status: 422
    applies_to: "POST /api/ti-projects/{id}/overage-invoices"
  - priority: 31
    category: business_fiscal
    check: "ChangeOrder void blocked once an ISSUED or PAID invoice includes it"
    error_id: ERR_INVOICE_ALREADY_ISSUED
    http_status: 422
    applies_to: "POST /api/change-orders/{id}/void"
  - priority: 32
    category: business_fiscal
    check: "OCC: expected_*_version must equal the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/work-letters/{id}/counter, POST /api/ti-projects/{id}/change-orders, POST /api/ti-projects/{id}/disbursement-requests"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Before any call, the clock reads exactly 2026-08-01T00:00:00Z (fixed startup default; never falls back to wall-clock)."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: []

  # --- Property / LeaseSpace ---
  - method: POST
    path: "/api/properties"
    description: "Create a building"
    roles: [LandlordPM]
    code: 201
    input: [name, address, "max_concurrent_construction_projects?"]
    output: Property
    side_effects: []
  - method: GET
    path: "/api/properties/{id}"
    description: "Fetch a property"
    roles: [LandlordPM, LandlordApprover, BuildingEngineer]
    code: 200
    input: []
    output: Property
    side_effects: []
  - method: POST
    path: "/api/properties/{id}/lease-spaces"
    description: "Create a suite in a property"
    roles: [LandlordPM]
    code: 201
    input: [suite_number, floor, rentable_sqft]
    output: LeaseSpace
    side_effects: []
  - method: GET
    path: "/api/properties/{id}/lease-spaces"
    description: "List suites of a property"
    roles: [LandlordPM, LandlordApprover, BuildingEngineer]
    code: 200
    input: []
    output: LeaseSpace[]
    side_effects: []
  - method: GET
    path: "/api/lease-spaces/{id}"
    description: "Fetch a suite"
    roles: [LandlordPM, LandlordApprover, BuildingEngineer]
    code: 200
    input: []
    output: LeaseSpace
    side_effects: []
  - method: GET
    path: "/api/lease-spaces/{id}/leases"
    description: "List leases on a suite"
    roles: [LandlordPM, LandlordApprover]
    code: 200
    input: []
    output: Lease[]
    side_effects: []

  # --- Tenant / Lease ---
  - method: POST
    path: "/api/tenants"
    description: "Register a tenant"
    roles: [LandlordPM]
    code: 201
    input: [legal_name, contact_email, tax_id]
    output: Tenant
    side_effects: []
  - method: GET
    path: "/api/tenants/{id}"
    description: "Fetch a tenant"
    roles: [LandlordPM, LandlordApprover, TenantRep]
    code: 200
    input: []
    output: Tenant
    side_effects: []
  - method: GET
    path: "/api/tenants/{id}/leases"
    description: "List leases of a tenant"
    roles: [LandlordPM, LandlordApprover, TenantRep]
    code: 200
    input: []
    output: Lease[]
    side_effects: []
  - method: POST
    path: "/api/leases"
    description: "Create a lease in DRAFT"
    roles: [LandlordPM]
    code: 201
    input: [space_id, tenant_id, base_rent_annual_cents, scheduled_rent_commencement_date, lease_term_months, "abatement_basis?"]
    output: Lease
    side_effects: []
  - method: GET
    path: "/api/leases/{id}"
    description: "Fetch a lease"
    roles: [LandlordPM, LandlordApprover, TenantRep]
    code: 200
    input: []
    output: Lease
    side_effects: []
  - method: POST
    path: "/api/leases/{id}/activate"
    description: "Activate a DRAFT lease; flips its space VACANT -> LEASED"
    roles: [LandlordPM]
    code: 200
    input: []
    output: Lease
    side_effects: ["LeaseSpace(space_id).status VACANT -> LEASED", "Lease.version increments by 1"]
  - method: GET
    path: "/api/leases/{id}/ti-projects"
    description: "List TI projects of a lease"
    roles: [LandlordPM, LandlordApprover, TenantRep]
    code: 200
    input: []
    output: TIProject[]
    side_effects: []

  # --- Contractor registry ---
  - method: POST
    path: "/api/contractors"
    description: "Register a contractor (PENDING)"
    roles: [LandlordPM]
    code: 201
    input: [company_name, license_number, insurance_expiry_date]
    output: Contractor
    side_effects: []
  - method: GET
    path: "/api/contractors/{id}"
    description: "Fetch a contractor"
    roles: [LandlordPM, LandlordApprover, ContractorRep]
    code: 200
    input: []
    output: Contractor
    side_effects: []
  - method: POST
    path: "/api/contractors/{id}/qualify"
    description: "PENDING -> QUALIFIED (insurance must be unexpired)"
    roles: [LandlordPM]
    code: 200
    input: []
    output: Contractor
    side_effects: ["Contractor.version increments by 1"]
  - method: POST
    path: "/api/contractors/{id}/suspend"
    description: "QUALIFIED -> SUSPENDED; cascades to ACTIVE engagements"
    roles: [LandlordPM]
    code: 200
    input: []
    output: Contractor
    side_effects: ["Every ACTIVE ContractorEngagement of this contractor -> SUSPENDED", "Contractor.version increments by 1"]
  - method: POST
    path: "/api/contractors/{id}/reinstate"
    description: "SUSPENDED -> QUALIFIED"
    roles: [LandlordPM]
    code: 200
    input: []
    output: Contractor
    side_effects: ["Contractor.version increments by 1"]
  - method: POST
    path: "/api/contractors/{id}/revoke"
    description: "PENDING|QUALIFIED -> REVOKED (blocked while any engagement ACTIVE)"
    roles: [LandlordPM]
    code: 200
    input: []
    output: Contractor
    side_effects: ["Contractor.version increments by 1"]
  - method: GET
    path: "/api/contractors/{id}/contractor-engagements"
    description: "List engagements of a contractor"
    roles: [LandlordPM, LandlordApprover, ContractorRep]
    code: 200
    input: []
    output: ContractorEngagement[]
    side_effects: []
  - method: GET
    path: "/api/contractors/{id}/lien-waivers"
    description: "List lien waivers filed by a contractor"
    roles: [LandlordPM, LandlordApprover, ContractorRep]
    code: 200
    input: []
    output: LienWaiver[]
    side_effects: []

  # --- TIProject lifecycle ---
  - method: POST
    path: "/api/leases/{id}/ti-projects"
    description: "Create a TI project (INITIATED) on an ACTIVE lease"
    roles: [LandlordPM]
    code: 201
    input: [project_name, base_contract_cents]
    output: TIProject
    side_effects: []
  - method: GET
    path: "/api/ti-projects/{id}"
    description: "Fetch a project with all computed monetary fields"
    roles: [LandlordPM, LandlordApprover, TenantRep, ContractorRep, BuildingEngineer]
    code: 200
    input: []
    output: TIProject
    side_effects: []
  - method: POST
    path: "/api/ti-projects/{id}/begin-plan-review"
    description: "WORK_LETTER_NEGOTIATION -> PLAN_REVIEW (requires EXECUTED work letter)"
    roles: [LandlordPM]
    code: 200
    input: []
