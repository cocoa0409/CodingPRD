            - { call: "POST /referrals", payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I11", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${pa}", captures: { q2: $.data.id } }
            - { call: "POST /referrals/${q2}/accept", as: ReferralCoordinator }
            - { call: "POST /referrals/${q2}/assign-specialist", payload: { specialist_id: "${s1}" }, as: ReferralCoordinator, captures: { q2_v: $.data.version } }
            - { call: "POST /referrals/${q2}/appointments", payload: { expected_referral_version: "${q2_v}", scheduled_start: "2026-08-01T12:00:00Z", scheduled_end: "2026-08-01T13:00:00Z" }, as: ReferralCoordinator, captures: { a2: $.data.id } }
            - { call: "POST /referrals", payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I20", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${pa}", captures: { q3: $.data.id } }
            - { call: "POST /referrals/${q3}/accept", as: ReferralCoordinator }
            - { call: "POST /referrals/${q3}/assign-specialist", payload: { specialist_id: "${s1}" }, as: ReferralCoordinator, captures: { q3_v: $.data.version } }
            - { call: "POST /referrals/${q3}/appointments", payload: { expected_referral_version: "${q3_v}", scheduled_start: "2026-08-01T14:00:00Z", scheduled_end: "2026-08-01T15:00:00Z" }, as: ReferralCoordinator, captures: { a3: $.data.id } }
            - { call: "POST /referrals", payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I25", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${pa}", captures: { q4: $.data.id } }
            - { call: "POST /referrals/${q4}/accept", as: ReferralCoordinator }
            - { call: "POST /referrals/${q4}/assign-specialist", payload: { specialist_id: "${s1}" }, as: ReferralCoordinator, captures: { q4_v: $.data.version } }
            - { call: "POST /referrals/${q4}/appointments", payload: { expected_referral_version: "${q4_v}", scheduled_start: "2026-08-01T16:00:00Z", scheduled_end: "2026-08-01T17:00:00Z" }, as: ReferralCoordinator, captures: { a4: $.data.id } }
            - { call: "POST /referrals", payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I50", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${pa}", captures: { q5: $.data.id } }
            - { call: "POST /referrals/${q5}/accept", as: ReferralCoordinator }
            - { call: "POST /referrals/${q5}/assign-specialist", payload: { specialist_id: "${s1}" }, as: ReferralCoordinator, captures: { q5_v: $.data.version } }
            - { call: "POST /referrals/${q5}/appointments", payload: { expected_referral_version: "${q5_v}", scheduled_start: "2026-08-01T18:00:00Z", scheduled_end: "2026-08-01T19:00:00Z" }, as: ReferralCoordinator }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T10:15:00Z" }, as: NetworkAdmin }
