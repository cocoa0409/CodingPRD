              payload: { response_summary: "Revenue restated.", correction_offered: true }
              as: VendorRep
              as_user_id: "${ven1_id}"
            - call: "POST /research/vendor-inclusions/${inc_id}/fact-check-decisions"
              payload: { outcome: "ACCEPT" }
              as: ResearchDirector
