          assert:
            - "GET /alert-events/${alert1} echoes station_id, event_code 'TOR', originator_sequence 'KSAXS-7001', fips_codes ['20173', '20177'] and received_at '2026-08-01T00:00:00Z' exactly as supplied"
            - "alert1 also carries the computed pair relay_state == 'UNMATCHED_OPTIONAL' and accessibility_state == 'ACCESSIBILITY_UNVERIFIED' with matched_relay_rule_id null"
            - "the event_code filter returns total_count == 2 (alert1, alert2) and has_more == false"
            - "the relay_state filter with limit 2, offset 0 returns 2 rows with total_count == 3 and has_more == true"
            - "the originator_sequence filter returns total_count == 1 containing ${alert3}"
