          - "calculations.driver_hos_replay"
        distinguishing_aspect: "BREAK_REQUIRED triggers at >= 480 cumulative driving minutes without a qualifying break: driver D1 at exactly 480 is BREAK_REQUIRED, driver D2 at 479 is ELIGIBLE."
        test_recipe:
          setup: ["clock 2026-08-02T09:00; D1 drove 2026-08-02T00:30-08:30 (480 min); D2 drove 00:30-08:29 (479 min); both on duty since 00:00"]
          setup_api_calls:
            - { call: "POST /haul/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: CarrierAdmin }
