  # =====================================================================================
  - rule_id: transitive_cascade
    instances:
      - name: non_return_sweep_depth_five_return_claim_ledger_posture_sibling
        grounds:
          - endpoints.POST_/warranty/parts-returns/non-return-sweep
          - state_machines.PartsReturnRequest.status.REQUESTED_to_NOT_RETURNED
          - state_machines.WarrantyClaim.payment_status.PAID_to_DEBITED
          - state_machines.Dealer.status.ACTIVE_to_SUSPENDED
          - calculations.parts_non_return_debit
          - calculations.dealer_chargeback_balance
          - entities.ClaimEdit.fields.edit_code
        distinguishing_aspect: |
          One clock-driven sweep with an empty body propagates through five distinct entity types
          in a fixed order - PartsReturnRequest REQUESTED -> NOT_RETURNED, then the linked claim's
          payment_status PAID -> DEBITED at the FULL approved total, then a ChargebackLedgerEntry
          append, then the dealer's posture recomputed straight to SUSPENDED (skipping PROBATION
          on a single 275250 debit), then an entirely unrelated SUBMITTED sibling claim of the same
          dealer suspended with a DEALER_POSTURE_HOLD edit. Nothing in the request names the
          sibling claim or the dealer, so the chain must be walked, and the debit basis differs
          from the analysis path (full approved_total_cents, not the parts amount).
        test_recipe:
          setup:
            - "Clock 2026-05-01T00:00:00Z; CA profile with markup_cap_pct 0.30."
            - "Dealer D_PWR at rate 13750 / markup 0.40, vehicles_in_operation 100."
            - "Vehicle VEH_P (basic 36/36000, powertrain 60/60000 from 2024-01-15) and vehicle VEH_S."
            - "Labor op P7788-90 (standard 3.0 h, max 4.0 h, POWERTRAIN, causal group PWRTRN) with part PWR-TRN-4410 at dealer_net_cents 180000, return_required true, retention_days 45."
            - "Labor op D0001-00 (standard 2.0 h, max 2.5 h, BASIC, requires_causal_part false) for the sibling claim."
            - "Claim CLP at 45000 miles -> POWERTRAIN, provisional 293250 which trips HIGH_VALUE (>= 150000) and opens SUSPENDED; approved at 275250 and PAID while its parts return is still inside its 2026-06-15 due date."
            - "Sibling claim CLS on VEH_S left in SUBMITTED, with no parts return of its own."
            - "The clock is then advanced past the parts-return due date."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-01T00:00:00Z" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "POST /warranty/state-law-profiles"
              payload: { state_code: "CA", markup_cap_pct: 0.30, labor_rate_method: "RETAIL_SAMPLE", min_sample_repair_orders: 5, max_labor_rate_cents: 19500, deemed_approved_days: 30, appeal_window_days: 30 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { slp_ca_id: $.data.id }
            - call: "POST /warranty/dealers"
              payload: { dealer_code: "D-PWR", name: "Powertrain Dealer", state_law_profile_id: "${slp_ca_id}", vehicles_in_operation: 100, initial_labor_rate_cents: 13750, initial_parts_markup_pct: 0.40 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { dpwr_id: $.data.id }
            - call: "POST /warranty/vehicles"
              payload: { vin: "VINP0000000000001", model_year: 2024, warranty_start_date: "2024-01-15", in_service_odometer: 0, basic_months: 36, basic_miles: 36000, powertrain_months: 60, powertrain_miles: 60000 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { vehp_id: $.data.id }
            - call: "POST /warranty/vehicles"
              payload: { vin: "VINS0000000000001", model_year: 2024, warranty_start_date: "2024-01-15", in_service_odometer: 0, basic_months: 36, basic_miles: 36000, powertrain_months: 60, powertrain_miles: 60000 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { vehs_id: $.data.id }
            - call: "POST /warranty/labor-operations"
              payload: { op_code: "P7788-90", description: "Transmission assembly replacement", standard_time_hours: 3.0, max_time_hours: 4.0, category: "POWERTRAIN", requires_causal_part: true, causal_failure_group: "PWRTRN", overlap_group: "PWRTRN" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { lo_pwr_id: $.data.id }
            - call: "POST /warranty/labor-operations"
              payload: { op_code: "D0001-00", description: "Diagnostic time only", standard_time_hours: 2.0, max_time_hours: 2.5, category: "BASIC", requires_causal_part: false, overlap_group: "DIAG" }
              as: WarrantyAdmin
