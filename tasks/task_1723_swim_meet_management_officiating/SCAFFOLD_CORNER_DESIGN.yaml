            - { call: "GET /records", payload: { event_id: "${ev1}", challenger_entry_id: "${en_a}" }, as: Any, captures: { rec_new: "$.data[0].id" } }
            - { call: "POST /records/${rec_new}/verify", payload: {}, as: RecordsOfficer, captures: { rec_new_st: "$.data.status" } }
            - { call: "POST /meets/${meet_id}/finalize", payload: {}, as: MeetDirector, captures: { err2: "$.data.error_id" } }
            - { call: "POST /records/${rec_new}/ratify", payload: {}, as: RecordsOfficer, captures: { rec_new_final: "$.data.status" } }
            - { call: "GET /records/${rec_old}", payload: {}, as: Any, captures: { rec_old_st: "$.data.status" } }
            - { call: "POST /meets/${meet_id}/finalize", payload: {}, as: MeetDirector, captures: { meet_st: "$.data.status" } }
            - { call: "POST /teams/${team_id}/withdraw", payload: {}, as: MeetDirector, captures: { err3: "$.data.error_id" } }
          assert:
            - "records after publish: 2 rows — ${rec_old} CURRENT (2450) and a PENDING_VERIFICATION challenge at 2400 with challenger_entry_id == ${en_a}"
            - "${err1} == ERR_RECORDS_PENDING  # PENDING_VERIFICATION blocks finalize"
            - "${rec_new_st} == SUBMITTED"
            - "${err2} == ERR_RECORDS_PENDING  # SUBMITTED still blocks finalize"
            - "${rec_new_final} == CURRENT and ${rec_old_st} == SUPERSEDED  # ratify cascade"
            - "${meet_st} == OFFICIAL"
            - "${err3} == ERR_MEET_ALREADY_COMPLETED"
      - name: record_reject_keeps_standing
        claim_type: compensation
        grounds: [state_machines.MeetRecord.PENDING_VERIFICATION_to_REJECTED]
