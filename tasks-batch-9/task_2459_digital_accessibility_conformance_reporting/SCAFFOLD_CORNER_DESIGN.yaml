      - name: corner_withdraw_published_report_reverses_side_effects
        claim_type: side_effect_execution
        grounds:
          - state_machines.ConformanceReport.PUBLISHED_to_WITHDRAWN
          - state_machines.KnownIssue.PUBLISHED_COMMITTED_to_COMMITTED
          - entities.QuestionnaireResponse.fields.accuracy_status
        distinguishing_aspect: "Withdrawal executes all three declared compensations: the PUBLISHED_COMMITTED issue returns to COMMITTED with public_target_date cleared, the citing questionnaire flips to CORRECTION_REQUIRED with correction_due_at 2026-08-11T00:00:00Z, and the report becomes WITHDRAWN."
        test_recipe:
          setup:
            - "Standard WCAG_2_2 with no criteria, so no criterion-level publication precondition can bite"
            - "One in-scope component with design_review_state REVIEWED_PASS"
            - "One SERIOUS known issue COMMITTED to release train 2026.08 (window 2026-08-05..2026-08-20, freeze_days 2, capacity 10 points, budget 0 cents) with target_remediation_date 2026-08-15 and publish_intent INCLUDED"
            - "One report PUBLISHED at clock 2026-08-01, so the issue is PUBLISHED_COMMITTED with public_target_date 2026-08-15 and the posture is OPEN (the target date is still in the future)"
            - "One questionnaire response citing that report, review_status DRAFT and accuracy_status CURRENT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
            - call: "POST /standards"
              payload: { code: "WCAG_2_2", title: "WCAG 2.2", surface_scope: "WEB", max_target_level: "AAA" }
              as: AccessibilityLead
              captures: { std_id: $.data.id }
            - call: "POST /standards/${std_id}/criteria"
              payload: { criterion_number: "1.1.1", title: "Non-text Content", level: "AAA", disability_categories: ["VISION"], applies_to_surfaces: ["WEB"] }
              as: AccessibilityLead
              captures: { crit_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Insight Portal", version_label: "7.0", standard_id: "${std_id}", target_level: "AA", surface_type: "WEB" }
              as: AccessibilityLead
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/components"
              payload: { name: "Web UI", component_type: "WEB_UI", in_scope: true, assessment_scope: "FULL", applicable_criteria_count: 40, user_reach_pct: 60 }
              as: AccessibilityLead
              captures: { comp_id: $.data.id }
            - call: "POST /components/${comp_id}/design-review"
              payload: { review_decision: "PASS", review_note: "Acceptance criteria include the AT matrix" }
              as: ConformanceReviewer
              as_user_id: "reviewer-1"
            - call: "POST /release-trains"
              payload: { name: "Train 2026.08", window_start: "2026-08-05", window_end: "2026-08-20", freeze_days: 2, effort_capacity_points: 10, remediation_budget_cents: 0 }
              as: AccessibilityLead
              captures: { train_id: $.data.id }
            - call: "POST /known-issues"
              payload: { product_id: "${prod_id}", component_id: "${comp_id}", criterion_id: "${crit_id}", severity: "SERIOUS", summary: "Media library thumbnails expose no accessible name", effort_points: 2, target_remediation_date: "2026-08-15", publish_intent: "INCLUDED" }
              as: AccessibilityTester
              captures: { iss_id: $.data.id }
            - call: "POST /known-issues/${iss_id}/triage"
              payload: { triage_note: "Confirmed on NVDA and JAWS" }
              as: AccessibilityLead
            - call: "POST /known-issues/${iss_id}/commit"
              payload: { release_train_id: "${train_id}" }
              as: AccessibilityLead
            - call: "GET /products/${prod_id}"
              payload: {}
              as: AccessibilityLead
              captures: { prod_v1: $.data.version }
            - call: "POST /conformance-reports"
              payload: { product_id: "${prod_id}", standard_id: "${std_id}", report_title: "ACR Insight Portal 7.0", expected_product_version: "${prod_v1}" }
              as: AccessibilityLead
              captures: { rep_id: $.data.id }
            - call: "POST /questionnaire-responses"
              payload: { product_id: "${prod_id}", report_id: "${rep_id}", customer_name: "Northwind Health", questionnaire_kind: "VPAT_ACR", answers_summary: "Answers cite the ACR for release 7.0" }
              as: CustomerLiaison
              captures: { q_id: $.data.id }
            - call: "POST /conformance-reports/${rep_id}/submit"
              payload: { submission_note: "Ready for reviewer sign-off" }
              as: ProductOwner
              as_user_id: "${prod_id}"
            - call: "POST /conformance-reports/${rep_id}/approve"
              payload: { approval_note: "Approved with no pinned evidence" }
              as: ConformanceReviewer
              as_user_id: "reviewer-1"
            - call: "POST /conformance-reports/${rep_id}/publish"
              payload: { publication_channel: "CUSTOMER_TRUST_PORTAL" }
              as: AccessibilityLead
              captures: { published_count: $.data.published_issue_count }
          trigger:
            - call: "POST /conformance-reports/${rep_id}/withdraw"
              payload: { withdrawal_reason: "Published against the wrong release label" }
              as: AccessibilityLead
              captures: { withdrawn_state: $.data.state }
          assert:
            - "${published_count} == 1"
            - "${withdrawn_state} == WITHDRAWN"
            - "KnownIssue.${iss_id}.state == COMMITTED"
            - "KnownIssue.${iss_id}.public_target_date is null"
            - "KnownIssue.${iss_id}.published_report_id is null"
            - "QuestionnaireResponse.${q_id}.accuracy_status == CORRECTION_REQUIRED"
            - "QuestionnaireResponse.${q_id}.correction_due_at == 2026-08-11T00:00:00Z"
            - "Product.${prod_id}.correction_required_questionnaire_count == 1"
            - "Product.${prod_id}.publication_posture == FROZEN"

      - name: corner_component_completion_transition_covered_by_cascade
        claim_type: valid_transition
        grounds:
          - state_machines.ProductComponent.IN_TESTING_to_COMPLETE
        excluded_because:
          difficulty_instance: transitive_cascade / run_completion_readiness_chain
          rationale: "That instance asserts the IN_TESTING -> COMPLETE transition and each of its declared side effects end to end."

      - name: corner_questionnaire_correction_required_transition_covered
        claim_type: side_effect_execution
        grounds:
          - state_machines.QuestionnaireResponse.CURRENT_to_CORRECTION_REQUIRED
        excluded_because:
          difficulty_instance: transitive_cascade / publish_freezes_customer_disclosures_chain
          rationale: "The FROZEN-posture flip to CORRECTION_REQUIRED with correction_due_at is the terminal hop asserted there."

      - name: corner_report_review_cycle_covered_by_non_linear_instance
        claim_type: valid_transition
        grounds:
          - state_machines.ConformanceReport.CHANGES_REQUESTED_to_IN_REVIEW
        excluded_because:
          difficulty_instance: non_linear_state_machine / report_review_loop_repeats_and_repins_evidence
          rationale: "The revision loop and its pin-clearing side effect are asserted there."

  # ===========================================================================
  - section: calculations
    instances:
      - name: corner_coverage_counts_completed_runs_only
        claim_type: input_set_filtering
        grounds:
          - calculations.component_testing_coverage_pct
          - entities.AssessmentRun.fields.status
        distinguishing_aspect: "A SCHEDULED keyboard run of 40 criteria contributes nothing: with only the SCREEN_READER run COMPLETED the coverage is 45.00, not the 80.00 that counting the scheduled run would give."
        test_recipe:
          setup:
            - "One in-scope component with applicable_criteria_count 40"
            - "Two benches: a SCREEN_READER bench and a KEYBOARD bench, both with buffer 30"
            - "One MANUAL SCREEN_READER run of 40 criteria and one MANUAL KEYBOARD run of 40 criteria, both SCHEDULED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
            - call: "POST /standards"
              payload: { code: "WCAG_2_2", title: "WCAG 2.2", surface_scope: "WEB", max_target_level: "AAA" }
              as: AccessibilityLead
              captures: { std_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Insight Portal", version_label: "7.0", standard_id: "${std_id}", target_level: "AA", surface_type: "WEB" }
              as: AccessibilityLead
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/components"
              payload: { name: "Web UI", component_type: "WEB_UI", in_scope: true, assessment_scope: "FULL", applicable_criteria_count: 40, user_reach_pct: 60 }
              as: AccessibilityLead
              captures: { comp_id: $.data.id }
            - call: "POST /test-environments"
              payload: { name: "NVDA Bench 1", at_profile: "SCREEN_READER", at_product_name: "NVDA 2026.1", os_platform: "WINDOWS", reconfiguration_buffer_minutes: 30 }
              as: AccessibilityLead
              captures: { env_sr: $.data.id }
            - call: "POST /test-environments"
              payload: { name: "Keyboard Bench 1", at_profile: "KEYBOARD", at_product_name: "Keyboard only", os_platform: "WINDOWS", reconfiguration_buffer_minutes: 30 }
              as: AccessibilityLead
              captures: { env_kb: $.data.id }
            - call: "POST /assessment-runs"
              payload: { component_id: "${comp_id}", environment_id: "${env_sr}", method: "MANUAL", at_profile: "SCREEN_READER", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T12:00:00Z", criteria_exercised: 40, disability_categories_validated: ["VISION", "COGNITIVE"] }
              as: AccessibilityTester
              captures: { run_sr: $.data.id }
            - call: "POST /assessment-runs"
              payload: { component_id: "${comp_id}", environment_id: "${env_kb}", method: "MANUAL", at_profile: "KEYBOARD", scheduled_start: "2026-08-04T09:00:00Z", scheduled_end: "2026-08-04T12:00:00Z", criteria_exercised: 40, disability_categories_validated: ["MOTOR"] }
              as: AccessibilityTester
              captures: { run_kb: $.data.id }
          trigger:
            - call: "POST /assessment-runs/${run_sr}/complete"
              payload: { defects_found: 2 }
              as: AccessibilityTester
            - call: "GET /components/${comp_id}"
              payload: {}
              as: AccessibilityLead
