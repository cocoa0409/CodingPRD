            - "trigger call 7: HTTP 200; Investigation.status == \"PUBLISHED\", disclosure_risk_score == 60, applicable_risk_variant == \"AGGREGATE_MAX\", release_dataset_id == ${ds_id}, methodology_doc_ref == \"methodology-v1\", published_at == \"2026-08-03T09:00:00Z\""
            - "trigger call 7: version increments by exactly 1 relative to the value after lock-findings, and the two refused attempts contributed no version bumps of their own"
            - "the 50 / 60 / 70 sequence is produced by suppression alone: record_count, publication_mode and the finding graph never change"

      - name: allocation_residual_follows_creation_order_not_name_order
        claim_type: chronological
        grounds:
          - calculations.analysis_cost_allocation
          - entities.Dataset.fields.allocated_cost_cents
          - entities.Dataset.fields.created_at
        distinguishing_aspect: |
          The allocable set is ordered created_at ASC and only then name ASC, and the residual lands on
          the FIRST element alone. Here the earliest-created dataset is named "zulu-permits" and the later
          one "alpha-permits", so the two orderings disagree: creation order sends the -1 residual to
          zulu (3829 / 7671) while name order sends it to alpha (3830 / 7670). The difficulty instance
          cost_allocation_round_each_share_then_residual_to_earliest creates its datasets in alphabetical
          order, so it cannot separate the two rules; this instance exists purely to separate them, and
          it advances the logical clock between the two creates so created_at is strictly ordered.
        test_recipe:
          setup:
            - "Desk, Agency, one RELEASED RecordsRequest, one Investigation."
            - "Dataset zulu-permits created at 2026-08-03T09:00:00Z, delivered CSV with record_count 333, CLEAN_LOCKED."
            - "Clock advanced to 2026-08-03T10:00:00Z, then Dataset alpha-permits created, delivered CSV with record_count 667, CLEAN_LOCKED."
            - "One AnalysisRun with compute_cost_cents 5000 and labor_hours 1.0, so total_cost_cents == 11500."
