scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: session_quoted_vs_final_metered_charge
        grounds:
          - calculations.session_participant_fee
          - state_machines.RangeSession.CHECKED_IN_to_CLOSED
          - entities.RangeSession.fields.quoted_charge_cents
          - entities.RangeSession.fields.final_charge_cents
        distinguishing_aspect: |
          Dual variant on the RangeSession/SessionParticipant domain: identical session data yields
          quoted_charge_cents == 2160 under the forward-looking QUOTED variant (booked 60 min) but
          final_charge_cents == 1200 under the chronological FINAL variant (metered 20 min, min-charge floor).
        test_recipe:
          setup:
            - "PLUS member with ACTIVE waiver and wallet 10000; lane L1 cap 4"
            - "RESERVATION session 2026-05-01T10:00-11:00Z (off-peak, 60 booked minutes) with the member as sole WALLET participant; quoted 1200*2*0.9 = 2160"
            - "clock advanced to 10:00, session checked in; clock advanced to 10:20 (20 actual minutes)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: Admin }
            - call: "POST /members"
              payload: { email: "plus@x.com", full_name: "Plus Member", date_of_birth: "1990-01-01", tier: "PLUS" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - { call: "POST /members/${m_id}/wallet/adjustments", payload: { amount_cents: 10000 }, as: Admin }
            - { call: "POST /members/${m_id}/waivers", payload: {}, as: Member, as_user_id: "${m_id}" }
            - call: "POST /lanes"
              payload: { name: "L1", lane_type: "INDOOR", max_archers: 4 }
              as: Admin
              captures: { lane_id: $.data.id }
            - call: "POST /range-sessions"
              payload: { lane_id: "${lane_id}", booking_type: "RESERVATION", start_at: "2026-05-01T10:00:00Z", end_at: "2026-05-01T11:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id }
            - { call: "POST /range-sessions/${s_id}/participants", payload: { member_id: "${m_id}", payment_method: "WALLET" }, as: Member, as_user_id: "${m_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T10:00:00Z" }, as: Admin }
            - { call: "POST /range-sessions/${s_id}/check-in", payload: {}, as: RangeOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T10:20:00Z" }, as: Admin }
          trigger:
            - call: "POST /range-sessions/${s_id}/close"
              payload: {}
              as: RangeOfficer
              captures: { final_charge: $.data.final_charge_cents, quoted_charge: $.data.quoted_charge_cents }
            - call: "GET /members/${m_id}"
              payload: {}
              as: Admin
              captures: { wallet_after: $.data.wallet_balance_cents }
          assert:
            - "RangeSession.${s_id}.quoted_charge_cents == 2160"
            - "RangeSession.${s_id}.final_charge_cents == 1200 (20 metered min -> 1 block -> 1080 -> min-charge floor 1200)"
            - "RangeSession.${s_id}.session_status == CLOSED and payment_status == PAID"
            - "Member.${m_id}.wallet_balance_cents == 8800 (10000 - 2160 quoted debit + 960 reconciliation credit)"
      - name: standings_scratch_vs_handicap_divergence
        grounds:
          - calculations.league_standings
          - entities.ScoreCard.fields.total_points
          - endpoints: "GET /leagues/{id}/standings"
        distinguishing_aspect: |
          Dual variant on the League/ScoreCard domain (different entity domain from the session-fee instance):
          identical LOCKED scorecards rank member A first under SCRATCH (285 > 270) but member B first under
          HANDICAP (270 + 36 == 306 > 285 + 18 == 303).
        test_recipe:
          setup:
            - "League fee 5000, two BASIC members A and B each with ACTIVE waiver and wallet 5000, both entered (CONFIRMED), league CLOSED"
            - "A submits 285 points (9 ends of [10,10,10] + one end [5,5,5]); B submits 270 points (10 ends of [9,9,9]); both VERIFIED then LOCKED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: Admin }
            - call: "POST /leagues"
              payload: { name: "Spring League", entry_fee_cents: 5000, max_entries: 10 }
              as: LeagueDirector
              captures: { lg_id: $.data.id }
            - call: "POST /members"
              payload: { email: "a@x.com", full_name: "Archer A", date_of_birth: "1990-01-01", tier: "BASIC" }
              as: Anonymous
              captures: { ma_id: $.data.id }
            - call: "POST /members"
              payload: { email: "b@x.com", full_name: "Archer B", date_of_birth: "1992-02-02", tier: "BASIC" }
              as: Anonymous
              captures: { mb_id: $.data.id }
            - { call: "POST /members/${ma_id}/wallet/adjustments", payload: { amount_cents: 5000 }, as: Admin }
            - { call: "POST /members/${mb_id}/wallet/adjustments", payload: { amount_cents: 5000 }, as: Admin }
            - { call: "POST /members/${ma_id}/waivers", payload: {}, as: Member, as_user_id: "${ma_id}" }
            - { call: "POST /members/${mb_id}/waivers", payload: {}, as: Member, as_user_id: "${mb_id}" }
            - call: "POST /leagues/${lg_id}/entries"
              payload: {}
              as: Member
              as_user_id: "${ma_id}"
              captures: { ea_id: $.data.id }
            - call: "POST /leagues/${lg_id}/entries"
              payload: {}
              as: Member
              as_user_id: "${mb_id}"
              captures: { eb_id: $.data.id }
            - { call: "POST /leagues/${lg_id}/close", payload: {}, as: LeagueDirector }
            - call: "POST /league-entries/${ea_id}/scorecards"
              payload: { ends: [[10,10,10],[10,10,10],[10,10,10],[10,10,10],[10,10,10],[10,10,10],[10,10,10],[10,10,10],[10,10,10],[5,5,5]], x_hits: 27 }
              as: Member
              as_user_id: "${ma_id}"
              captures: { sca_id: $.data.id }
            - call: "POST /league-entries/${eb_id}/scorecards"
              payload: { ends: [[9,9,9],[9,9,9],[9,9,9],[9,9,9],[9,9,9],[9,9,9],[9,9,9],[9,9,9],[9,9,9],[9,9,9]], x_hits: 0 }
              as: Member
              as_user_id: "${mb_id}"
              captures: { scb_id: $.data.id }
            - { call: "POST /scorecards/${sca_id}/verify", payload: {}, as: LeagueDirector }
            - { call: "POST /scorecards/${scb_id}/verify", payload: {}, as: LeagueDirector }
            - { call: "POST /scorecards/${sca_id}/lock", payload: {}, as: LeagueDirector }
            - { call: "POST /scorecards/${scb_id}/lock", payload: {}, as: LeagueDirector }
          trigger:
            - { call: "GET /leagues/${lg_id}/standings", payload: { variant: "SCRATCH" }, as: LeagueDirector }
            - { call: "GET /leagues/${lg_id}/standings", payload: { variant: "HANDICAP" }, as: LeagueDirector }
          assert:
            - "SCRATCH standings rows[0].member_id == ${ma_id} (285 > 270 raw)"
            - "HANDICAP standings rows[0].member_id == ${mb_id} (adjusted 306 > 303)"
            - "HANDICAP row for ${ma_id}: handicap_index == 18, adjusted_points == 303"
            - "HANDICAP row for ${mb_id}: handicap_index == 36, adjusted_points == 306"
            - "League.${lg_id}.status == COMPLETED (auto-transition after all cards LOCKED)"
  - rule_id: combinatorial_formula
    instances:
      - name: session_fee_peak_walkin_tier_interaction
        grounds:
          - calculations.session_participant_fee
        distinguishing_aspect: |
          Mode (a): >= 3 inputs (booked blocks, peak flag, tier discount, booking_type) with non-linear
          interaction — peak multiplier applied before tier discount, walk-in surcharge added AFTER the
          min-charge floor: BASIC walk-in peak 60min -> 3300; ELITE reserved off-peak 90min -> 2880.
        test_recipe:
          setup:
            - "Lane L1; BASIC member (wallet 10000, waiver) books WALK_IN 2026-05-01T18:00-19:00Z (peak); ELITE member (wallet 10000, waiver) books RESERVATION 2026-05-02T10:00-11:30Z (off-peak, 90 min) on a second lane"
            - "clock is 2026-05-01T08:00:00Z (walk-in same-day, reservation lead >= 120min both satisfied)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: Admin }
            - call: "POST /lanes"
              payload: { name: "P1", lane_type: "INDOOR", max_archers: 4 }
              as: Admin
              captures: { lane1: $.data.id }
            - call: "POST /lanes"
              payload: { name: "P2", lane_type: "OUTDOOR", max_archers: 4 }
              as: Admin
              captures: { lane2: $.data.id }
            - call: "POST /members"
              payload: { email: "wb@x.com", full_name: "Walk Basic", date_of_birth: "1990-01-01", tier: "BASIC" }
              as: Anonymous
              captures: { mwb: $.data.id }
            - call: "POST /members"
              payload: { email: "re@x.com", full_name: "Res Elite", date_of_birth: "1988-05-05", tier: "ELITE" }
              as: Anonymous
              captures: { mre: $.data.id }
            - { call: "POST /members/${mwb}/wallet/adjustments", payload: { amount_cents: 10000 }, as: Admin }
            - { call: "POST /members/${mre}/wallet/adjustments", payload: { amount_cents: 10000 }, as: Admin }
            - { call: "POST /members/${mwb}/waivers", payload: {}, as: Member, as_user_id: "${mwb}" }
            - { call: "POST /members/${mre}/waivers", payload: {}, as: Member, as_user_id: "${mre}" }
            - call: "POST /range-sessions"
              payload: { lane_id: "${lane1}", booking_type: "WALK_IN", start_at: "2026-05-01T18:00:00Z", end_at: "2026-05-01T19:00:00Z" }
              as: Member
              as_user_id: "${mwb}"
              captures: { s1: $.data.id }
            - call: "POST /range-sessions"
              payload: { lane_id: "${lane2}", booking_type: "RESERVATION", start_at: "2026-05-02T10:00:00Z", end_at: "2026-05-02T11:30:00Z" }
              as: Member
              as_user_id: "${mre}"
              captures: { s2: $.data.id }
          trigger:
            - call: "POST /range-sessions/${s1}/participants"
              payload: { member_id: "${mwb}", payment_method: "WALLET" }
              as: Member
              as_user_id: "${mwb}"
              captures: { fee1: $.data.quoted_fee_cents }
            - call: "POST /range-sessions/${s2}/participants"
              payload: { member_id: "${mre}", payment_method: "WALLET" }
              as: Member
              as_user_id: "${mre}"
              captures: { fee2: $.data.quoted_fee_cents }
          assert:
            - "session1 participant quoted_fee_cents == 3300 (2400 base x1.25 peak = 3000, no tier discount, +300 walk-in surcharge after floor)"
            - "session2 participant quoted_fee_cents == 2880 (3 blocks x1200 = 3600 x0.8 ELITE = 2880)"
            - "Member.${mwb}.wallet_balance_cents == 6700 and Member.${mre}.wallet_balance_cents == 7120"
      - name: sale_total_per_line_rounding_order
        grounds:
          - calculations.sale_total
        distinguishing_aspect: |
          Mode (b): nested rounding order pinned — per-line round_half_up THEN sum yields subtotal 1054;
          the alternative sum-then-round yields 1055. Single tax rounding on the discounted base pinned as step (5).
        test_recipe:
          setup:
            - "Products A (unit 333, stock 100) and B (unit 777, stock 100) exist"
          setup_api_calls:
            - call: "POST /shop-products"
              payload: { name: "Arrow A", sku: "ARR-A", unit_price_cents: 333, initial_stock: 100 }
              as: ShopClerk
              captures: { pa: $.data.id }
            - call: "POST /shop-products"
              payload: { name: "Broadhead B", sku: "BRD-B", unit_price_cents: 777, initial_stock: 100 }
              as: ShopClerk
              captures: { pb: $.data.id }
          trigger:
            - call: "POST /sales"
              payload: { items: [ { product_id: "${pa}", qty: 1, line_discount_pct: 0.05 }, { product_id: "${pb}", qty: 1, line_discount_pct: 0.05 } ] }
              as: ShopClerk
              captures: { sale_id: $.data.id, total: $.data.total_cents, subtotal: $.data.subtotal_cents, tax: $.data.tax_cents }
          assert:
            - "Sale.${sale_id}.line_gross_cents == [316, 738] (round(316.35)=316, round(738.15)=738)"
            - "Sale.${sale_id}.subtotal_cents == 1054 (per-line-then-sum; sum-then-round would give 1055)"
            - "Sale.${sale_id}.volume_discount_cents == 0 (1054 < 10000)"
            - "Sale.${sale_id}.tax_cents == 87 (round(1054 x 0.0825) = round(86.955))"
            - "Sale.${sale_id}.total_cents == 1141"
            - "ShopProduct.${pa}.stock_quantity == 99 and ShopProduct.${pb}.stock_quantity == 99"
      - name: league_prize_pool_pinned_evaluation_order
        grounds:
          - calculations.league_prize_pool
          - entities.League.fields.range_share_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — range_share is 15% of GROSS (pinned), not of the pool it
          feeds: 4 entries x 5000 -> gross 20000, share 3000, pool 17000; a share-of-pool reading would
          imply pool ~17391, so the pinned order is falsifiable.
        test_recipe:
          setup:
            - "League fee 5000 max 10; four BASIC members with ACTIVE waivers and wallet 5000 each, all entered CONFIRMED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: Admin }
            - call: "POST /leagues"
              payload: { name: "Pool League", entry_fee_cents: 5000, max_entries: 10 }
              as: LeagueDirector
              captures: { lg_id: $.data.id }
            - call: "POST /members"
              payload: { email: "e1@x.com", full_name: "E One", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { e1: $.data.id }
            - call: "POST /members"
              payload: { email: "e2@x.com", full_name: "E Two", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { e2: $.data.id }
            - call: "POST /members"
              payload: { email: "e3@x.com", full_name: "E Three", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { e3: $.data.id }
            - call: "POST /members"
              payload: { email: "e4@x.com", full_name: "E Four", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { e4: $.data.id }
            - { call: "POST /members/${e1}/wallet/adjustments", payload: { amount_cents: 5000 }, as: Admin }
            - { call: "POST /members/${e2}/wallet/adjustments", payload: { amount_cents: 5000 }, as: Admin }
            - { call: "POST /members/${e3}/wallet/adjustments", payload: { amount_cents: 5000 }, as: Admin }
            - { call: "POST /members/${e4}/wallet/adjustments", payload: { amount_cents: 5000 }, as: Admin }
            - { call: "POST /members/${e1}/waivers", payload: {}, as: Member, as_user_id: "${e1}" }
            - { call: "POST /members/${e2}/waivers", payload: {}, as: Member, as_user_id: "${e2}" }
            - { call: "POST /members/${e3}/waivers", payload: {}, as: Member, as_user_id: "${e3}" }
            - { call: "POST /members/${e4}/waivers", payload: {}, as: Member, as_user_id: "${e4}" }
            - { call: "POST /leagues/${lg_id}/entries", payload: {}, as: Member, as_user_id: "${e1}" }
            - { call: "POST /leagues/${lg_id}/entries", payload: {}, as: Member, as_user_id: "${e2}" }
            - { call: "POST /leagues/${lg_id}/entries", payload: {}, as: Member, as_user_id: "${e3}" }
            - { call: "POST /leagues/${lg_id}/entries", payload: {}, as: Member, as_user_id: "${e4}" }
          trigger:
            - call: "GET /leagues/${lg_id}"
              payload: {}
              as: LeagueDirector
              captures: { gross: $.data.gross_entry_fees_cents, share: $.data.range_share_cents, pool: $.data.prize_pool_cents }
          assert:
            - "League.${lg_id}.gross_entry_fees_cents == 20000"
            - "League.${lg_id}.range_share_cents == 3000 (round(20000 x 0.15), computed from gross)"
            - "League.${lg_id}.prize_pool_cents == 17000"
  - rule_id: non_linear_state_machine
    instances:
      - name: lesson_counter_negotiation_cycle
        grounds:
          - state_machines.Lesson.REQUESTED_to_COUNTERED
          - state_machines.Lesson.COUNTERED_to_REQUESTED
          - state_machines.Lesson.REQUESTED_to_CONFIRMED
        distinguishing_aspect: |
          Cyclic machine on Lesson: REQUESTED -> COUNTERED (coach) -> REQUESTED (member re-counter) ->
          CONFIRMED loops the negotiation round; the cycle is on Lesson, distinct from the ScoreCard cycle.
        test_recipe:
          setup:
            - "ACTIVE coach certified RECURVE; BASIC member wallet 10000 with ACTIVE waiver; lesson REQUESTED at 2026-05-02T10:00Z, fee 6000"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: Admin }
            - call: "POST /coaches"
              payload: { full_name: "Coach Kim", disciplines: ["RECURVE"] }
              as: Admin
              captures: { c_id: $.data.id }
            - call: "POST /members"
              payload: { email: "stu@x.com", full_name: "Stu Dent", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - { call: "POST /members/${m_id}/wallet/adjustments", payload: { amount_cents: 10000 }, as: Admin }
            - { call: "POST /members/${m_id}/waivers", payload: {}, as: Member, as_user_id: "${m_id}" }
            - call: "POST /lessons"
              payload: { coach_id: "${c_id}", discipline: "RECURVE", proposed_start_at: "2026-05-02T10:00:00Z", duration_minutes: 60 }
              as: Member
              as_user_id: "${m_id}"
              captures: { l_id: $.data.id }
          trigger:
            - { call: "POST /lessons/${l_id}/counter", payload: { proposed_start_at: "2026-05-02T14:00:00Z" }, as: Coach, as_user_id: "${c_id}" }
            - { call: "POST /lessons/${l_id}/counter", payload: { proposed_start_at: "2026-05-02T16:00:00Z" }, as: Member, as_user_id: "${m_id}" }
            - call: "POST /lessons/${l_id}/confirm"
              payload: {}
              as: Coach
              as_user_id: "${c_id}"
              captures: { st: $.data.status, v: $.data.version }
          assert:
            - "after coach counter: Lesson.status == COUNTERED with proposed_start_at 2026-05-02T14:00:00Z"
            - "after member counter: Lesson.status == REQUESTED (cycle back) with proposed_start_at 2026-05-02T16:00:00Z"
            - "after confirm: Lesson.status == CONFIRMED and version == 4"
            - "Member.${m_id}.wallet_balance_cents == 4000 (single 6000 debit at CONFIRMED entry, none during the cycle)"
      - name: scorecard_dispute_correction_cycle
        grounds:
          - state_machines.ScoreCard.VERIFIED_to_DISPUTED
          - state_machines.ScoreCard.DISPUTED_to_SUBMITTED
          - concurrency_rules[scorecard-correction-stale-version]
        distinguishing_aspect: |
          Cyclic machine on ScoreCard: SUBMITTED -> VERIFIED -> DISPUTED -> SUBMITTED via OCC-guarded PUT
          correction; the cycle entity (ScoreCard) differs from the Lesson cycle entity.
        test_recipe:
          setup:
            - "League CLOSED with one CONFIRMED entry (member wallet 5000 -> 0 after fee); member's card SUBMITTED with total 300 then VERIFIED then DISPUTED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: Admin }
            - call: "POST /leagues"
              payload: { name: "Cycle Cup", entry_fee_cents: 5000, max_entries: 10 }
              as: LeagueDirector
              captures: { lg_id: $.data.id }
            - call: "POST /members"
              payload: { email: "sc@x.com", full_name: "Scorer", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - { call: "POST /members/${m_id}/wallet/adjustments", payload: { amount_cents: 5000 }, as: Admin }
            - { call: "POST /members/${m_id}/waivers", payload: {}, as: Member, as_user_id: "${m_id}" }
            - call: "POST /leagues/${lg_id}/entries"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { e_id: $.data.id }
            - { call: "POST /leagues/${lg_id}/close", payload: {}, as: LeagueDirector }
            - call: "POST /league-entries/${e_id}/scorecards"
              payload: { ends: [[10,10,10],[10,10,10],[10,10,10],[10,10,10],[10,10,10],[10,10,10],[10,10,10],[10,10,10],[10,10,10],[10,10,10]], x_hits: 30 }
              as: Member
              as_user_id: "${m_id}"
              captures: { sc_id: $.data.id }
            - { call: "POST /scorecards/${sc_id}/verify", payload: {}, as: LeagueDirector }
            - call: "POST /scorecards/${sc_id}/dispute"
              payload: {}
              as: LeagueDirector
              captures: { sc_v: $.data.version }
          trigger:
            - call: "PUT /scorecards/${sc_id}"
              payload: { ends: [[9,9,9],[9,9,9],[9,9,9],[9,9,9],[9,9,9],[9,9,9],[9,9,9],[9,9,9],[9,9,9],[9,9,9]], x_hits: 0, expected_scorecard_version: "${sc_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { st: $.data.status, pts: $.data.total_points }
          assert:
            - "ScoreCard.${sc_id}.status == SUBMITTED (VERIFIED -> DISPUTED -> SUBMITTED cycle completed)"
            - "ScoreCard.${sc_id}.total_points == 270 (recomputed from corrected ends)"
            - "ScoreCard.${sc_id}.version == 4 (submit 1, verify 2, dispute 3, correction 4)"
  - rule_id: transitive_cascade
    instances:
      - name: member_suspension_three_hop_cascade
        grounds:
          - state_machines.Member.ACTIVE_to_SUSPENDED
          - state_machines.RangeSession.BOOKED_to_CANCELLED
          - state_machines.RentalAgreement.OPEN_to_VOIDED
          - state_machines.RentalItem.RENTED_to_AVAILABLE
        distinguishing_aspect: |
          Depth-3 chain from the safety-strike trigger: Member SUSPENDED causes RangeSession CANCELLED,
          whose cancellation causes RentalAgreement VOIDED, whose voiding causes RentalItem AVAILABLE —
          each hop caused by the previous link, with full system refunds along the way.
        test_recipe:
          setup:
            - "PLUS member (wallet 10000, waiver) with a future BOOKED session 2026-05-03T10:00-11:00Z, self participant WALLET (quoted 2160 -> wallet 7840)"
            - "an OPEN RentalAgreement linked to that session (item RENTED, due 2026-05-04)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: Admin }
            - call: "POST /members"
              payload: { email: "risky@x.com", full_name: "Risky Archer", date_of_birth: "1990-01-01", tier: "PLUS" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - { call: "POST /members/${m_id}/wallet/adjustments", payload: { amount_cents: 10000 }, as: Admin }
            - { call: "POST /members/${m_id}/waivers", payload: {}, as: Member, as_user_id: "${m_id}" }
            - call: "POST /lanes"
              payload: { name: "CL", lane_type: "INDOOR", max_archers: 4 }
              as: Admin
