              payload: { expected_stay_version: "${stay540_v2}", recalculation_reason: "Second analyst re-price after refreshing the stay." }
              as: RevenueIntegrityAnalyst
              as_user_id: analyst-b
              captures: { det540b_id: $.data.id }
            - call: "GET /ltch/payment-determinations/${det540a_id}"
