scaffold_corner_design:

  # =========================================================================
  # Entities — creation, retrieval, required fields, computed/system fields,
  # type constraints, FK integrity, not-found.
  # =========================================================================
  - section: entities
    instances:
      - name: create_distributor_returns_201_with_system_fields
        claim_type: Creation
        grounds:
          - entities.Distributor.fields.name
          - entities.Distributor.fields.current_utc
          - entities.Distributor.fields.catalog_revision
          - endpoints
        distinguishing_aspect: "POST /distributors with name returns 201; current_utc defaults to epoch, catalog_revision 0, server-minted id present."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "FreshCo" }
              as: DistributorAdmin
              captures: { dist: $.data.id }
          trigger:
            - call: "GET /distributors/${dist}"
              payload: {}
              as: DistributorAdmin
          assert:
            - "response.status == 200"
            - "Distributor.${dist}.catalog_revision == 0"
            - "Distributor.${dist}.current_utc == 1970-01-01T00:00:00.000Z"

      - name: create_product_missing_required_sku_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Product.fields.sku
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /products without sku is rejected ERR_INVALID_REQUEST (422); sku is a required input field."
        test_recipe:
          setup:
            - "A distributor exists."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "FreshCo" }
              as: DistributorAdmin
              captures: { dist: $.data.id }
          trigger:
            - call: "POST /products"
              payload: { distributor_id: "${dist}", name: "Cheddar", category: "DAIRY", splits_per_case: 12, case_cost_cents: 1000 }
              as: DistributorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_order_line_invalid_uom_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.OrderLine.fields.uom
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /orders/{id}/lines with uom='BOX' (not CASE|SPLIT) is rejected ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "Distributor, route, product, customer, draft order exist."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "FreshCo" }
              as: DistributorAdmin
              captures: { dist: $.data.id }
            - call: "POST /warehouses"
              payload: { distributor_id: "${dist}", code: "WH1", name: "Main" }
              as: DistributorAdmin
              captures: { wh: $.data.id }
            - call: "POST /routes"
              payload: { distributor_id: "${dist}", warehouse_id: "${wh}", code: "R1", delivery_dow: 2, cutoff_lead_hours: 24 }
              as: DistributorAdmin
              captures: { route: $.data.id }
            - call: "POST /products"
              payload: { distributor_id: "${dist}", sku: "P-1", name: "Cheddar", category: "DAIRY", splits_per_case: 12, case_cost_cents: 1000 }
              as: DistributorAdmin
              captures: { prod: $.data.id }
            - call: "POST /customers"
              payload: { distributor_id: "${dist}", route_id: "${route}", name: "Diner A", credit_limit_cents: 100000 }
              as: SalesRep
              captures: { cust: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", requested_delivery_date: "2026-06-17T00:00:00Z" }
              as: SalesRep
              captures: { order: $.data.id }
          trigger:
            - call: "POST /orders/${order}/lines"
              payload: { product_id: "${prod}", uom: "BOX", ordered_qty: 1 }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: get_customer_nonexistent_id_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_NOT_FOUND]
          - endpoints
        distinguishing_aspect: "GET /customers/{id} with a well-formed but unknown UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "A distributor exists; no customer with the queried id."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "FreshCo" }
              as: DistributorAdmin
              captures: { dist: $.data.id }
          trigger:
            - call: "GET /customers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: DistributorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_customer_route_in_other_distributor_cross_reference
        claim_type: Parent Relationships
        grounds:
          - entities.Customer.fields.route_id
          - errors[ERR_CROSS_DISTRIBUTOR_REFERENCE]
          - validations[priority=17]
        distinguishing_aspect: "Creating a Customer whose route_id belongs to a different distributor is rejected ERR_CROSS_DISTRIBUTOR_REFERENCE (409)."
        test_recipe:
          setup:
            - "Distributor D1 with route R1; separate distributor D2 (no shared route)."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "D1" }
              as: DistributorAdmin
              captures: { d1: $.data.id }
            - call: "POST /warehouses"
              payload: { distributor_id: "${d1}", code: "WH1", name: "Main" }
              as: DistributorAdmin
              captures: { wh1: $.data.id }
            - call: "POST /routes"
              payload: { distributor_id: "${d1}", warehouse_id: "${wh1}", code: "R1", delivery_dow: 2, cutoff_lead_hours: 24 }
              as: DistributorAdmin
              captures: { route1: $.data.id }
            - call: "POST /distributors"
              payload: { name: "D2" }
              as: DistributorAdmin
              captures: { d2: $.data.id }
          trigger:
            - call: "POST /customers"
              payload: { distributor_id: "${d2}", route_id: "${route1}", name: "Diner A", credit_limit_cents: 100000 }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_CROSS_DISTRIBUTOR_REFERENCE"

      - name: product_status_defaults_active_and_discontinue_sets_discontinued
        claim_type: Defaults
        grounds:
          - entities.Product.fields.status
          - entities.Product.fields.split_allowed
          - endpoints
        distinguishing_aspect: "A newly created Product has status ACTIVE and split_allowed defaulting true; discontinue flips status to DISCONTINUED."
        test_recipe:
          setup:
            - "A distributor exists."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "FreshCo" }
              as: DistributorAdmin
              captures: { dist: $.data.id }
            - call: "POST /products"
              payload: { distributor_id: "${dist}", sku: "P-1", name: "Cheddar", category: "DAIRY", splits_per_case: 12, case_cost_cents: 1000 }
              as: DistributorAdmin
              captures: { prod: $.data.id }
          trigger:
            - call: "POST /products/${prod}/discontinue"
              payload: {}
              as: DistributorAdmin
          assert:
            - "response.status == 200"
            - "Product.${prod}.status == DISCONTINUED"
            - "Product.${prod}.split_allowed == true"

  # =========================================================================
  # State machines — invalid-from, terminal lockdown, valid transition,
  # initial state, idempotency.
  # =========================================================================
  - section: state_machines
    instances:
      - name: order_full_lifecycle_to_delivered_settles
        claim_type: Valid Transition
        grounds:
          - state_machines.Order.SUBMITTED_to_PICKING
          - state_machines.Order.PICKING_to_LOADED
          - state_machines.Order.LOADED_to_DELIVERED
          - entities.Order.fields.settled
          - entities.InventoryLot.fields.on_hand_splits
        distinguishing_aspect: "A start-pick -> load -> pod chain drives Order to DELIVERED, settled=true, and consumes the reserved lot (on_hand 24->0)."
        test_recipe:
          setup:
            - "Approved order O (2 cases, lot 24 splits) ready to pick."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "FreshCo" }
              as: DistributorAdmin
              captures: { dist: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { distributor_id: "${dist}", to_iso8601: "2026-06-15T12:00:00Z" }
              as: DistributorAdmin
            - call: "POST /warehouses"
              payload: { distributor_id: "${dist}", code: "WH1", name: "Main" }
              as: DistributorAdmin
              captures: { wh: $.data.id }
            - call: "POST /routes"
              payload: { distributor_id: "${dist}", warehouse_id: "${wh}", code: "R1", delivery_dow: 2, cutoff_lead_hours: 24 }
              as: DistributorAdmin
              captures: { route: $.data.id }
            - call: "POST /products"
              payload: { distributor_id: "${dist}", sku: "P-1", name: "Cheddar", category: "DAIRY", splits_per_case: 12, case_cost_cents: 1000 }
              as: DistributorAdmin
              captures: { prod: $.data.id }
            - call: "POST /price-tiers"
              payload: { product_id: "${prod}", min_cases: 1, case_price_cents: 2400 }
              as: DistributorAdmin
            - call: "POST /inventory-lots"
              payload: { product_id: "${prod}", warehouse_id: "${wh}", lot_code: "L1", on_hand_splits: 24 }
              as: WarehouseOp
              captures: { lot: $.data.id }
            - call: "POST /customers"
              payload: { distributor_id: "${dist}", route_id: "${route}", name: "Diner A", credit_limit_cents: 100000 }
              as: SalesRep
              captures: { cust: $.data.id, cust_v: $.data.version }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", requested_delivery_date: "2026-06-17T00:00:00Z" }
              as: SalesRep
              captures: { order: $.data.id }
            - call: "POST /orders/${order}/lines"
              payload: { product_id: "${prod}", uom: "CASE", ordered_qty: 2 }
              as: SalesRep
              captures: { line: $.data.id }
            - call: "POST /orders/${order}/submit"
              payload: {}
              as: SalesRep
              captures: { order_v: $.data.version }
            - call: "POST /orders/${order}/approve-credit"
              payload: { expected_customer_version: "${cust_v}" }
              as: CreditManager
            - call: "POST /orders/${order}/start-pick"
              payload: {}
              as: WarehouseOp
            - call: "GET /shipments"
              payload: { order_id: "${order}" }
              as: WarehouseOp
              captures: { ship: $.data.0.id }
            - call: "POST /shipments/${ship}/load"
              payload: {}
              as: WarehouseOp
          trigger:
            - call: "POST /shipments/${ship}/pod"
              payload: { pod_signature: "Sig" }
              as: WarehouseOp
          assert:
            - "Order.${order}.fulfillment_status == DELIVERED"
            - "Order.${order}.settled == true"
            - "InventoryLot.${lot}.on_hand_splits == 0"
            - "InventoryLot.${lot}.reserved_splits == 0"

      - name: start_pick_before_credit_approved_returns_credit_not_approved
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Order.SUBMITTED_to_PICKING
          - errors[ERR_CREDIT_NOT_APPROVED]
        distinguishing_aspect: "start-pick on a SUBMITTED order whose credit_status is still PENDING is rejected ERR_CREDIT_NOT_APPROVED (409)."
        test_recipe:
          setup:
            - "Order O submitted but NOT credit-approved (credit_status PENDING)."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "FreshCo" }
              as: DistributorAdmin
              captures: { dist: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { distributor_id: "${dist}", to_iso8601: "2026-06-15T12:00:00Z" }
              as: DistributorAdmin
            - call: "POST /warehouses"
              payload: { distributor_id: "${dist}", code: "WH1", name: "Main" }
              as: DistributorAdmin
              captures: { wh: $.data.id }
            - call: "POST /routes"
              payload: { distributor_id: "${dist}", warehouse_id: "${wh}", code: "R1", delivery_dow: 2, cutoff_lead_hours: 24 }
              as: DistributorAdmin
              captures: { route: $.data.id }
            - call: "POST /products"
              payload: { distributor_id: "${dist}", sku: "P-1", name: "Cheddar", category: "DAIRY", splits_per_case: 12, case_cost_cents: 1000 }
              as: DistributorAdmin
              captures: { prod: $.data.id }
            - call: "POST /price-tiers"
              payload: { product_id: "${prod}", min_cases: 1, case_price_cents: 2400 }
              as: DistributorAdmin
            - call: "POST /inventory-lots"
              payload: { product_id: "${prod}", warehouse_id: "${wh}", lot_code: "L1", on_hand_splits: 24 }
              as: WarehouseOp
            - call: "POST /customers"
              payload: { distributor_id: "${dist}", route_id: "${route}", name: "Diner A", credit_limit_cents: 100000 }
              as: SalesRep
              captures: { cust: $.data.id, cust_v: $.data.version }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", requested_delivery_date: "2026-06-17T00:00:00Z" }
              as: SalesRep
              captures: { order: $.data.id }
            - call: "POST /orders/${order}/lines"
              payload: { product_id: "${prod}", uom: "CASE", ordered_qty: 2 }
              as: SalesRep
              captures: { line: $.data.id }
            - call: "POST /orders/${order}/submit"
              payload: {}
              as: SalesRep
          trigger:
            - call: "POST /orders/${order}/start-pick"
              payload: {}
              as: WarehouseOp
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_CREDIT_NOT_APPROVED"

      - name: cancel_delivered_order_invalid_from_terminal_rejected
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Order.terminal_states
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancelling a DELIVERED (terminal) order is rejected ERR_INVALID_STATE; cancel is only defined from DRAFT/SUBMITTED."
        test_recipe:
          setup:
            - "Order O fully delivered (terminal)."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "FreshCo" }
              as: DistributorAdmin
              captures: { dist: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { distributor_id: "${dist}", to_iso8601: "2026-06-15T12:00:00Z" }
              as: DistributorAdmin
            - call: "POST /warehouses"
              payload: { distributor_id: "${dist}", code: "WH1", name: "Main" }
              as: DistributorAdmin
              captures: { wh: $.data.id }
            - call: "POST /routes"
              payload: { distributor_id: "${dist}", warehouse_id: "${wh}", code: "R1", delivery_dow: 2, cutoff_lead_hours: 24 }
              as: DistributorAdmin
              captures: { route: $.data.id }
            - call: "POST /products"
              payload: { distributor_id: "${dist}", sku: "P-1", name: "Cheddar", category: "DAIRY", splits_per_case: 12, case_cost_cents: 1000 }
              as: DistributorAdmin
              captures: { prod: $.data.id }
            - call: "POST /price-tiers"
              payload: { product_id: "${prod}", min_cases: 1, case_price_cents: 2400 }
              as: DistributorAdmin
            - call: "POST /inventory-lots"
              payload: { product_id: "${prod}", warehouse_id: "${wh}", lot_code: "L1", on_hand_splits: 24 }
              as: WarehouseOp
            - call: "POST /customers"
              payload: { distributor_id: "${dist}", route_id: "${route}", name: "Diner A", credit_limit_cents: 100000 }
              as: SalesRep
              captures: { cust: $.data.id, cust_v: $.data.version }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", requested_delivery_date: "2026-06-17T00:00:00Z" }
              as: SalesRep
              captures: { order: $.data.id }
            - call: "POST /orders/${order}/lines"
              payload: { product_id: "${prod}", uom: "CASE", ordered_qty: 2 }
              as: SalesRep
              captures: { line: $.data.id }
            - call: "POST /orders/${order}/submit"
              payload: {}
              as: SalesRep
              captures: { order_v: $.data.version }
            - call: "POST /orders/${order}/approve-credit"
              payload: { expected_customer_version: "${cust_v}" }
              as: CreditManager
            - call: "POST /orders/${order}/start-pick"
              payload: {}
              as: WarehouseOp
            - call: "GET /shipments"
              payload: { order_id: "${order}" }
              as: WarehouseOp
              captures: { ship: $.data.0.id }
            - call: "POST /shipments/${ship}/load"
              payload: {}
              as: WarehouseOp
            - call: "POST /shipments/${ship}/pod"
              payload: { pod_signature: "Sig" }
              as: WarehouseOp
          trigger:
            - call: "POST /orders/${order}/cancel"
              payload: {}
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: pod_without_signature_returns_signature_required
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Shipment.LOADED_to_DELIVERED
          - errors[ERR_POD_SIGNATURE_REQUIRED]
          - validations[priority=16]
        distinguishing_aspect: "POD on a LOADED shipment with an empty pod_signature is rejected ERR_POD_SIGNATURE_REQUIRED (422)."
        test_recipe:
          setup:
            - "Shipment S in LOADED state for an approved order."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "FreshCo" }
              as: DistributorAdmin
              captures: { dist: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { distributor_id: "${dist}", to_iso8601: "2026-06-15T12:00:00Z" }
              as: DistributorAdmin
            - call: "POST /warehouses"
              payload: { distributor_id: "${dist}", code: "WH1", name: "Main" }
              as: DistributorAdmin
              captures: { wh: $.data.id }
            - call: "POST /routes"
              payload: { distributor_id: "${dist}", warehouse_id: "${wh}", code: "R1", delivery_dow: 2, cutoff_lead_hours: 24 }
              as: DistributorAdmin
              captures: { route: $.data.id }
            - call: "POST /products"
              payload: { distributor_id: "${dist}", sku: "P-1", name: "Cheddar", category: "DAIRY", splits_per_case: 12, case_cost_cents: 1000 }
              as: DistributorAdmin
              captures: { prod: $.data.id }
            - call: "POST /price-tiers"
              payload: { product_id: "${prod}", min_cases: 1, case_price_cents: 2400 }
              as: DistributorAdmin
            - call: "POST /inventory-lots"
              payload: { product_id: "${prod}", warehouse_id: "${wh}", lot_code: "L1", on_hand_splits: 24 }
              as: WarehouseOp
            - call: "POST /customers"
              payload: { distributor_id: "${dist}", route_id: "${route}", name: "Diner A", credit_limit_cents: 100000 }
              as: SalesRep
              captures: { cust: $.data.id, cust_v: $.data.version }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", requested_delivery_date: "2026-06-17T00:00:00Z" }
              as: SalesRep
              captures: { order: $.data.id }
            - call: "POST /orders/${order}/lines"
              payload: { product_id: "${prod}", uom: "CASE", ordered_qty: 2 }
              as: SalesRep
              captures: { line: $.data.id }
            - call: "POST /orders/${order}/submit"
              payload: {}
              as: SalesRep
              captures: { order_v: $.data.version }
            - call: "POST /orders/${order}/approve-credit"
              payload: { expected_customer_version: "${cust_v}" }
              as: CreditManager
            - call: "POST /orders/${order}/start-pick"
              payload: {}
              as: WarehouseOp
            - call: "GET /shipments"
              payload: { order_id: "${order}" }
              as: WarehouseOp
              captures: { ship: $.data.0.id }
            - call: "POST /shipments/${ship}/load"
              payload: {}
              as: WarehouseOp
          trigger:
            - call: "POST /shipments/${ship}/pod"
              payload: { pod_signature: "" }
              as: WarehouseOp
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "data.error_id == ERR_POD_SIGNATURE_REQUIRED"

      - name: close_customer_with_open_order_returns_has_open_orders
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Customer.ACTIVE_to_CLOSED
          - errors[ERR_CUSTOMER_HAS_OPEN_ORDERS]
        distinguishing_aspect: "Closing a customer with a SUBMITTED (unapproved, ar_balance 0) order is rejected ERR_CUSTOMER_HAS_OPEN_ORDERS (409)."
        test_recipe:
          setup:
            - "Customer C, ar_balance 0, with one SUBMITTED (not approved) order so no AR but an open order exists."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "FreshCo" }
              as: DistributorAdmin
              captures: { dist: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { distributor_id: "${dist}", to_iso8601: "2026-06-15T12:00:00Z" }
              as: DistributorAdmin
            - call: "POST /warehouses"
              payload: { distributor_id: "${dist}", code: "WH1", name: "Main" }
              as: DistributorAdmin
              captures: { wh: $.data.id }
            - call: "POST /routes"
              payload: { distributor_id: "${dist}", warehouse_id: "${wh}", code: "R1", delivery_dow: 2, cutoff_lead_hours: 24 }
              as: DistributorAdmin
              captures: { route: $.data.id }
            - call: "POST /products"
              payload: { distributor_id: "${dist}", sku: "P-1", name: "Cheddar", category: "DAIRY", splits_per_case: 12, case_cost_cents: 1000 }
              as: DistributorAdmin
              captures: { prod: $.data.id }
            - call: "POST /price-tiers"
              payload: { product_id: "${prod}", min_cases: 1, case_price_cents: 2400 }
              as: DistributorAdmin
            - call: "POST /customers"
              payload: { distributor_id: "${dist}", route_id: "${route}", name: "Diner A", credit_limit_cents: 100000 }
              as: SalesRep
              captures: { cust: $.data.id, cust_v: $.data.version }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", requested_delivery_date: "2026-06-17T00:00:00Z" }
              as: SalesRep
              captures: { order: $.data.id }
            - call: "POST /orders/${order}/lines"
              payload: { product_id: "${prod}", uom: "CASE", ordered_qty: 1 }
              as: SalesRep
              captures: { line: $.data.id }
            - call: "POST /orders/${order}/submit"
              payload: {}
              as: SalesRep
          trigger:
            - call: "POST /customers/${cust}/close"
              payload: {}
              as: DistributorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_CUSTOMER_HAS_OPEN_ORDERS"

      - name: close_customer_with_outstanding_ar_returns_not_settled
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Customer.ACTIVE_to_CLOSED
          - errors[ERR_CUSTOMER_NOT_SETTLED]
          - entities.Customer.fields.ar_balance_cents
        distinguishing_aspect: "Closing a customer whose delivered order left ar_balance 4800 (>0, settled order) is rejected ERR_CUSTOMER_NOT_SETTLED (409)."
        test_recipe:
          setup:
            - "Customer C delivered a 2-case order -> ar_balance 4800; order is settled (no open orders) but AR > 0."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "FreshCo" }
              as: DistributorAdmin
              captures: { dist: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { distributor_id: "${dist}", to_iso8601: "2026-06-15T12:00:00Z" }
              as: DistributorAdmin
            - call: "POST /warehouses"
              payload: { distributor_id: "${dist}", code: "WH1", name: "Main" }
              as: DistributorAdmin
              captures: { wh: $.data.id }
            - call: "POST /routes"
              payload: { distributor_id: "${dist}", warehouse_id: "${wh}", code: "R1", delivery_dow: 2, cutoff_lead_hours: 24 }
