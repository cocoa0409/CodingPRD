              as_user_id: "${d1}"
              captures: { q1: $.data.id }
            - call: "POST /blinds/quotes/${q1}/present"
              as: Designer
              as_user_id: "${d1}"
            - call: "POST /blinds/quotes/${q1}/accept"
              as: Designer
              as_user_id: "${d1}"
              captures: { qv1: $.data.version }
            - call: "POST /blinds/vendor-orders"
              payload: { quote_id: "${q1}", opening_ids: ["${o1}"], expected_quote_version: "${qv1}", preferred_vendor_id: "${v1}" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { ord1: $.data.id }
            - call: "POST /blinds/vendor-orders/${ord1}/ship"
              as: VendorRep
              as_user_id: "${v1}"
            - call: "POST /blinds/vendor-orders/${ord1}/receive"
              as: Franchisee
              as_user_id: "${t1}"
            - call: "GET /blinds/territories/${t1}"
              as: Franchisee
              as_user_id: "${t1}"
              captures: { pre_net_sales: $.data.net_sales_cents, pre_royalty: $.data.royalty_accrued_cents }
          trigger:
            - call: "POST /blinds/vendor-orders/${ord1}/remake"
              payload: { credit_scope: "FULL_CREDIT" }
              as: Franchisee
              as_user_id: "${t1}"
          assert:
            - "before the credit the accrual is real: the captured ${pre_net_sales} == 6760 and ${pre_royalty} == 372 (round_half_up(6760 * 0.055) == 372)"
            - "the remake returns 200 with VendorOrder.${ord1}.status == CANCELLED and credit_scope == FULL_CREDIT"
            - "the waterfall ran on the cancelled order exactly as it would on a replacement: remake_cost_cents == 2839, vendor_absorbed_cents == 1419 (floored half), territory_absorbed_cents == 1420 (the remainder), customer_absorbed_cents == 0, and the three buckets sum to 2839"
            - "Opening.${o1}.credited == true while its install_outcome stays PENDING"
            - "Quote.${q1}.credited_net_sales_cents == 6760 and recognized_net_sales_cents == 0"
            - "the compensation is exact on the two money aggregates: Territory.${t1}.net_sales_cents == 0 and royalty_accrued_cents == 0 - back to their pre-acceptance values"
            - "it is NOT exact on the cost of compensating: Territory.${t1}.remake_chargeback_cents == 1420, which nothing restores"
            - "GET /blinds/territories/${t1}/ledger-entries returns total_count 3 in occurred_at then created_at order: NET_SALES_ROYALTY +372 basis 6760 memo quote_accepted, REMAKE_CHARGEBACK +1420 basis 2839 source_entity_type VENDOR_ORDER, ROYALTY_REVERSAL -372 basis 6760 memo remake_full_credit"
            - "restoration is proved by the signed sum, not by deletion: the two rows with entry_type IN {NET_SALES_ROYALTY, ROYALTY_REVERSAL} sum to 0 and both rows are still readable"
            - "GET /blinds/territories/${t1}/ledger-entries?entry_type=ROYALTY_REVERSAL returns total_count 1 with amount_cents == -372 (strictly negative, never stored as an absolute value)"

      - name: a_checkout_and_return_pair_restores_inventory_while_loan_count_ratchets
        grounds:
          - calculations.sample_loan_conservation
          - calculations.sample_late_fee
          - state_machines.SampleKit.ON_LOAN_to_AVAILABLE
          - entities.Territory.fields.on_loan_kit_count
          - entities.SampleKit.fields.loan_count
        distinguishing_aspect: |
          The restored resource is PHYSICAL INVENTORY over a repeated cycle, and the
          conserved identity is a three-way partition (available + on_loan + lost == total
          kits) that must hold at EVERY observable moment, not just at the end. The same
          pair of calls that restores available_kit_count and open_loan_count ratchets
          loan_count upward forever, and an on-time return writes no ledger row at all -
          so the compensation is visible only in counters, unlike the royalty case where
          it is visible as a signed row.
        test_recipe:
          setup:
            - "One ACTIVE territory with exactly two sample kits K1 and K2, one ACTIVE designer and one SCHEDULED consultation."
            - "Two full loan cycles are run on K1 only, both returned before due_at so no fee and no ledger row is ever produced: [2026-08-03T09:00:00.000Z, 2026-08-05T17:00:00.000Z] returned 2026-08-04T10:00:00.000Z, then [2026-08-06T09:00:00.000Z, 2026-08-08T17:00:00.000Z] returned 2026-08-07T10:00:00.000Z."
            - "K2 is never touched, so it pins the denominator of the conservation identity."
          setup_api_calls:
            - call: "POST /blinds/territories"
              payload: { legal_name: "Northgate Blinds LLC", postal_codes: ["30301"], royalty_rate_pct: 0.055, lead_capacity_per_week: 5, credit_limit_cents: 2000000, liability_window: "ROLLING_180D" }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { t1: $.data.id }
            - call: "POST /blinds/designers"
              payload: { territory_id: "${t1}", full_name: "Dana Reed", home_postal_code: "30301" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { d1: $.data.id }
            - call: "POST /blinds/sample-kits"
              payload: { territory_id: "${t1}", kit_code: "SHEERS-A", replacement_value_cents: 50000 }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { k1: $.data.id }
            - call: "POST /blinds/sample-kits"
              payload: { territory_id: "${t1}", kit_code: "WOODS-B", replacement_value_cents: 42000 }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { k2: $.data.id }
            - call: "POST /blinds/leads"
              payload: { customer_name: "Ana Ruiz", postal_code: "30301", source: "REFERRAL", requested_at: "2026-08-01T08:00:00.000Z", child_occupied_dwelling: false }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { l1: $.data.id }
            - call: "POST /blinds/consultations"
              payload: { lead_id: "${l1}", designer_id: "${d1}", scheduled_start_at: "2026-08-09T14:00:00.000Z", scheduled_end_at: "2026-08-09T15:00:00.000Z", service_postal_code: "30301" }
              as: Designer
              as_user_id: "${d1}"
              captures: { c1: $.data.id }
            - call: "GET /blinds/territories/${t1}"
              as: Franchisee
              as_user_id: "${t1}"
              captures: { pre_available: $.data.available_kit_count }
          trigger:
            - call: "POST /blinds/sample-checkouts"
              payload: { sample_kit_id: "${k1}", consultation_id: "${c1}", hold_start_at: "2026-08-03T09:00:00.000Z", hold_end_at: "2026-08-05T17:00:00.000Z" }
              as: Designer
              as_user_id: "${d1}"
              captures: { co1: $.data.id }
            - call: "GET /blinds/territories/${t1}"
              as: Franchisee
              as_user_id: "${t1}"
              captures: { mid_available: $.data.available_kit_count, mid_on_loan: $.data.on_loan_kit_count }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T10:00:00.000Z" }
              as: Franchisor
              as_user_id: "hq-ops"
            - call: "POST /blinds/sample-checkouts/${co1}/return"
              as: Designer
              as_user_id: "${d1}"
            - call: "POST /blinds/sample-checkouts"
              payload: { sample_kit_id: "${k1}", consultation_id: "${c1}", hold_start_at: "2026-08-06T09:00:00.000Z", hold_end_at: "2026-08-08T17:00:00.000Z" }
              as: Designer
              as_user_id: "${d1}"
              captures: { co2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-07T10:00:00.000Z" }
              as: Franchisor
              as_user_id: "hq-ops"
            - call: "POST /blinds/sample-checkouts/${co2}/return"
              as: Designer
              as_user_id: "${d1}"
            - call: "GET /blinds/sample-kits/${k1}"
              as: Franchisee
              as_user_id: "${t1}"
              captures: { final_loan_count: $.data.loan_count }
          assert:
            - "the captured ${pre_available} == 2 and mid-cycle the partition still holds: ${mid_available} == 1 and ${mid_on_loan} == 1"
            - "each return is free: SampleCheckout.${co1} and SampleCheckout.${co2} are both status RETURNED with days_late == 0 and late_fee_cents == 0"
            - "after both cycles the inventory counters are exactly restored: Territory.${t1}.available_kit_count == 2, on_loan_kit_count == 0 and lost_kit_count == 0, so available + on_loan + lost == 2 == the territory's kit rows"
            - "SampleKit.${k1}.status == AVAILABLE with open_loan_count == 0 - the compensating pair emptied the open-loan counter"
            - "the history counter ratchets and is deliberately NOT restored: the captured ${final_loan_count} == 2, while SampleKit.${k2}.loan_count == 0 and its status is still AVAILABLE"
            - "the whole episode wrote no money at all: GET /blinds/territories/${t1}/ledger-entries returns total_count 0, so this restoration is observable only through counters"
            - "GET /blinds/sample-checkouts?sample_kit_id=${k1} returns total_count 2 and GET /blinds/sample-checkouts?sample_kit_id=${k1}&status=OPEN returns total_count 0"
