  - rule_id: compensating_invariant
    instances:

      - name: fleet_conservation_across_dispatch_cancel_and_abort
        grounds:
          - state_machines.WorkOrder.PLANNED_to_SCHEDULED
          - state_machines.WorkOrder.SCHEDULED_to_CANCELLED
          - state_machines.WorkOrder.SCHEDULED_to_ABORTED
          - state_machines.WorkOrder.SCHEDULED_to_COMPLETED_install
          - state_machines.RemovalReconciliation.OPEN_to_FINALIZED
          - entities.FenceProduct.fields.reserved_count
          - entities.FenceProduct.fields.deployed_count
        distinguishing_aspect: |
          available_count + reserved_count + deployed_count + damaged_count +
          lost_count must equal owned_count 400 after every single hop of a
          dispatch -> cancel -> dispatch -> abort -> dispatch -> complete ->
          remove -> finalize sequence, and must return to available 400 with all
          four other counters at 0 at the end. A cancel or an abort that forgets to
          release its 50 reserved panels leaks 50 or 100 units and the closing
          identity fails even though every individual endpoint returned 200. Only
          one MOBILIZATION invoice may exist: the cancelled and aborted attempts
          must not have billed anything.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01, then 2026-08-20, 2026-08-21, 2026-08-22 and 2026-08-25 as the sequence advances."
            - "Municipality HRB-01, rental_tax_rate_bp 890; jobsite SOIL with requires_sidewalk_closure false."
            - "PANEL-CL-10 owned_count 400, panel_length_ft 10; it is the only product in play."
            - "CONSTRUCTION contract 500 ft, NONE screen, term 3, no add-ons -> 50 panels per install attempt."
            - "One crew CRW-A with daily_capacity_hours 12.0; each attempt is scheduled on its own UTC date so no window or capacity gate ever fires."
            - "Account credit_limit_cents 100000000 so credit hold never blocks a dispatch."
