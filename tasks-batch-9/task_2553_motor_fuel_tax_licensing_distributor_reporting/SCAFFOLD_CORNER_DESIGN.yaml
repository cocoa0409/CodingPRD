            - call: "POST /mft/licensees"
              payload: { legal_name: "Applicant One Distribution Inc", fein: "41-6500004", license_type: "DISTRIBUTOR", mailing_state: "MN", parent_licensee_id: "${pending_id}" }
              as: LicensingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; data.error_id == ERR_INVALID_PARENT_LICENSEE (the named parent is PENDING_BOND, not ACTIVE)"
            - "the same creation naming ${mid_id} - an ACTIVE SUPPLIER that itself has a parent - also returns HTTP 422 with ERR_INVALID_PARENT_LICENSEE"
            - "the same creation naming ${head_id} returns HTTP 201 with parent_licensee_id == ${head_id}"
            - "GET /mft/licensees with payload { parent_licensee_id: ${head_id} } then returns total_count == 2 (the mid-level supplier and the new distributor)"

      - name: revoked_purchaser_and_bond_deficiency_violated_together
        claim_type: priority_ordering
        grounds:
          - validations[priority=100]
          - validations[priority=500]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / revoked_and_underbonded_purchaser_prefers_safety_over_fiscal_error
          rationale: "The named Section 1.8 instance stages exactly this pair on one rack removal and asserts the 100-band safety error while proving the 500 violation is real but masked."
      - name: filing_state_and_certificate_validity_violated_together
        claim_type: priority_ordering
        grounds:
          - validations[priority=74]
          - validations[priority=103]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / refile_with_revoked_certificate_prefers_state_over_safety_error
          rationale: "The named Section 1.8 instance revokes a certificate under a FILED return and re-files it, asserting the state error at 74 ahead of the certificate error at 103."
      - name: certificate_windows_touching_at_a_shared_endpoint
        claim_type: temporal_validation
        grounds:
          - validations[priority=301]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / exemption_certificate_closed_interval_shared_endpoint_collides
          rationale: "The named Section 1.8 instance asserts both the shared-endpoint collision and the one-day-gap acceptance for the same (purchaser, exemption_type) pair."
      - name: audit_windows_separated_by_a_single_month
        claim_type: temporal_validation
        grounds:
          - validations[priority=302]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / audit_case_period_buffer_collides_across_one_month_gap
          rationale: "The named Section 1.8 instance walks the AUDIT_PERIOD_BUFFER_MONTHS widening across a one-month gap and a two-month gap on the same subject."

  - section: endpoints
    instances:
      - name: terminal_create_read_list_round_trip_with_a_duplicate_tcn_refusal
        claim_type: standard_crud
        grounds:
          - endpoints[POST /mft/terminals]
          - endpoints[GET /mft/terminals/{id}]
          - endpoints[GET /mft/terminals]
          - validations[priority=401]
        distinguishing_aspect: "The scaffold exposes no update and no delete verb anywhere, so CRUD here is create-read-list: the created terminal is byte-identical on read, appears under a state_code filter, and its terminal_control_number is claimed for good - a second terminal reusing it is refused."
        test_recipe:
          setup:
            - "Empty terminal table; clock at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /mft/terminals"
              payload: { terminal_control_number: "T-WI-6600", name: "Superior Harbor Terminal", state_code: "WI" }
              as: LicensingOfficer
              captures: { wi_term: $.data.id }
          trigger:
            - call: "POST /mft/terminals"
              payload: { terminal_control_number: "T-MN-6600", name: "Rosemount Rack Terminal", state_code: "MN" }
              as: LicensingOfficer
              captures: { mn_term: $.data.id }
          assert:
            - "HTTP 201; data.terminal_control_number == T-MN-6600, data.name == Rosemount Rack Terminal, data.state_code == MN, data.version == 1 and data.created_at is present"
            - "GET /mft/terminals/${mn_term} returns those same field values unchanged"
            - "GET /mft/terminals with payload { state_code: MN } returns total_count == 1 and has_more == false; with payload { state_code: WI } it returns the other terminal only"
            - "GET /mft/terminals with payload { limit: 1, offset: 0 } returns one item with total_count == 2 and has_more == true"
            - "a second POST /mft/terminals reusing terminal_control_number T-MN-6600 returns HTTP 409 with data.error_id == ERR_DUPLICATE_TCN, and the list total stays 2"
            - "no PATCH, PUT or DELETE route for a terminal is declared anywhere in the scaffold"

      - name: bond_release_action_frees_a_pending_licensee_and_is_refused_for_an_active_one
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /mft/bonds/{id}/release]
          - state_machines.BondInstrument.ACTIVE_to_RELEASED
          - validations[priority=501]
        distinguishing_aspect: "The same action endpoint answers differently by licensee status: releasing the bond of a PENDING_BOND licensee is allowed and re-derives posted_bond_cents to 0, while releasing the bond of an ACTIVE licensee that needs it is refused by 501, and the release_reason distinguishes an operator release from the supersession the bond-post path writes."
        test_recipe:
          setup:
            - "One PENDING_BOND DISTRIBUTOR holding a 1500000-cent ACTIVE bond and one ACTIVE SUPPLIER holding a 1500000-cent ACTIVE bond that exactly meets its requirement."
            - "Clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Release Pending Distribution Inc", fein: "41-6700001", license_type: "DISTRIBUTOR", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { pend_id: $.data.id, pend_v0: $.data.version }
            - call: "POST /mft/licensees/${pend_id}/bonds"
              payload: { amount_cents: 1500000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${pend_v0}" }
              as: LicensingOfficer
              captures: { pend_bond: $.data.id }
            - call: "POST /mft/licensees"
              payload: { legal_name: "Release Active Fuel Supply LLC", fein: "41-6700002", license_type: "SUPPLIER", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { act_id: $.data.id, act_v0: $.data.version }
            - call: "POST /mft/licensees/${act_id}/bonds"
              payload: { amount_cents: 1500000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${act_v0}" }
              as: LicensingOfficer
              captures: { act_bond: $.data.id }
            - call: "POST /mft/licensees/${act_id}/activate"
              payload: {}
              as: LicensingOfficer
          trigger:
            - call: "POST /mft/bonds/${pend_bond}/release"
              payload: {}
              as: LicensingOfficer
          assert:
            - "HTTP 200; data.status == RELEASED and data.release_reason == OPERATOR_RELEASE"
            - "GET /mft/licensees/${pend_id} reports posted_bond_cents == 0 and bond_deficiency_cents == 1500000 while status stays PENDING_BOND"
            - "GET /mft/licensees/${pend_id}/bonds with payload { status: ACTIVE } returns total_count == 0"
            - "POST /mft/bonds/${act_bond}/release returns HTTP 422 with data.error_id == ERR_BOND_RELEASE_WOULD_CREATE_DEFICIENCY, and that bond stays ACTIVE with the licensee's posted_bond_cents at 1500000"
            - "a second release of ${pend_bond} returns HTTP 409 with data.error_id == ERR_BOND_NOT_ACTIVE"

      - name: rack_removal_links_terminal_holder_and_purchaser_and_404s_on_a_missing_terminal
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /mft/rack-removals]
          - validations[priority=56]
          - endpoints[GET /mft/rack-removals]
        distinguishing_aspect: "One POST joins four references at once - terminal, position holder, purchaser and (optionally) certificate - so an unused terminal_id in the BODY must yield a 404 ERR_TERMINAL_NOT_FOUND rather than a 422, and the accepted row must be findable through each of the three link filters."
        test_recipe:
          setup:
            - "One ACTIVE SUPPLIER position holder with gross_net_election NET behind a 1500000-cent bond, one MN terminal and one MN FARM-channel RETAILER purchaser."
            - "Clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Link Fuel Supply LLC", fein: "41-6800001", license_type: "SUPPLIER", mailing_state: "MN", gross_net_election: "NET" }
              as: LicensingOfficer
              captures: { sup_id: $.data.id, sup_v0: $.data.version }
            - call: "POST /mft/licensees/${sup_id}/bonds"
              payload: { amount_cents: 1500000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${sup_v0}" }
              as: LicensingOfficer
            - call: "POST /mft/licensees/${sup_id}/activate"
              payload: {}
              as: LicensingOfficer
            - call: "POST /mft/licensees"
              payload: { legal_name: "Link Farm Depot LLC", fein: "41-6800002", license_type: "RETAILER", mailing_state: "MN", retail_channel: "FARM" }
              as: LicensingOfficer
              captures: { ret_id: $.data.id }
            - call: "POST /mft/terminals"
              payload: { terminal_control_number: "T-MN-6800", name: "Link River Terminal", state_code: "MN" }
              as: LicensingOfficer
              captures: { term_id: $.data.id }
          trigger:
            - call: "POST /mft/rack-removals"
              payload: { terminal_id: "${term_id}", position_holder_licensee_id: "${sup_id}", purchaser_licensee_id: "${ret_id}", product_code: "GASOLINE", gross_gallons: 1010.00, net_gallons: 1000.00, removal_date: "2026-07-24", destination_state: "MN", bill_of_lading_number: "BOL-LK-0001" }
              as: ReturnsExaminer
              captures: { rr_id: $.data.id }
          assert:
            - "HTTP 201; data.terminal_id == ${term_id}, data.position_holder_licensee_id == ${sup_id} and data.purchaser_licensee_id == ${ret_id}"
            - "data.basis_used == NET, data.taxable_gallons == 1000.00, data.imposition_point == TERMINAL_RACK, data.tax_imposed == true, data.tax_amount_cents == 28600 and data.deferred_tax_cents == 0 (a RETAILER purchaser cannot take the deferral branch)"
            - "the same row is returned by GET /mft/rack-removals under each of payload { terminal_id: ${term_id} }, payload { position_holder_licensee_id: ${sup_id} } and payload { purchaser_licensee_id: ${ret_id} }, each with total_count == 1"
            - "repeating the POST with an unused UUID for terminal_id returns HTTP 404 with data.error_id == ERR_TERMINAL_NOT_FOUND, and with an unused UUID for purchaser_licensee_id returns HTTP 404 with data.error_id == ERR_LICENSEE_NOT_FOUND"
            - "GET /mft/rack-removals/${rr_id} still returns the single accepted row"

      - name: risk_profile_read_exposes_both_weightings_and_the_gate_constant
        claim_type: computed_read
        grounds:
          - endpoints[GET /mft/licensees/{id}/risk-profile]
          - calculations.licensee_risk_score
        distinguishing_aspect: "A history of one late filing and one dyed violation with no discrepancies scores 8 + 15 == 23 under BOTH weightings, so the read proves the shared behaviour terms are counted once each and publishes audit_selection_threshold 60 alongside them."
        test_recipe:
          setup:
            - "One SUPPLIER counterparty and one DISTRIBUTOR subject that never posted a bond, so it stays PENDING_BOND and no suspension cascade can fire."
            - "The subject filed its 2026-08 return (SCH_2 GASOLINE 1000.00 gallons) at clock 2026-10-05T00:00:00Z, 15 days late, giving late_filing_count 1."
            - "FieldInspector recorded one POSITIVE roadside inspection of 40.00 gallons on the subject, giving dyed_violation_count 1."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Risk Read Fuel Supply LLC", fein: "41-6900001", license_type: "SUPPLIER", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /mft/licensees"
              payload: { legal_name: "Risk Read Distribution Inc", fein: "41-6900002", license_type: "DISTRIBUTOR", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { dist_id: $.data.id }
            - call: "POST /mft/roadside-inspections"
              payload: { inspected_licensee_id: "${dist_id}", inspection_date: "2026-07-30", dye_test_result: "POSITIVE", gallons_in_tank: 40.00, vehicle_identifier: "MN-TRK-6900" }
              as: FieldInspector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T00:00:00Z" }
              as: ReturnsExaminer
            - call: "POST /mft/returns"
              payload: { licensee_id: "${dist_id}", period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { ret_id: $.data.id }
            - call: "POST /mft/returns/${ret_id}/schedules"
              payload: { schedule_code: "SCH_2_RECEIVED_TAX_UNPAID", product_code: "GASOLINE", total_gallons: 1000.00 }
              as: ReturnsExaminer
              captures: { sch_id: $.data.id }
            - call: "POST /mft/schedules/${sch_id}/lines"
              payload: { counterparty_licensee_id: "${sup_id}", transaction_type: "PURCHASE", gallons: 1000.00, document_date: "2026-08-15", bill_of_lading_number: "BOL-RR-0001" }
              as: ReturnsExaminer
            - call: "POST /mft/returns/${ret_id}/file"
              payload: { attest_name: "R. Risk" }
              as: ReturnsExaminer
          trigger:
            - call: "GET /mft/licensees/${dist_id}/risk-profile"
              payload: {}
              as: AuditManager
              as_user_id: "aud-01"
          assert:
            - "HTTP 200; data.risk_score_variance_weighted == 23 and data.risk_score_frequency_weighted == 23 (late_points 8 + dyed_points 15, variance and frequency terms both 0)"
            - "data.unreported_gallons_total == 0.00, data.open_discrepancy_count == 0, data.late_filing_count == 1 and data.dyed_violation_count == 1"
            - "data.audit_selection_threshold == 60"
            - "GET /mft/licensees/${dist_id} reports the identical risk_score_variance_weighted and risk_score_frequency_weighted values, so the read and the entity row cannot disagree"

      - name: risk_score_selection_is_refused_below_the_gate_while_manual_referral_is_not
        claim_type: conditional_action
        grounds:
          - endpoints[POST /mft/audit-cases]
          - validations[priority=408]
          - errors[ERR_RISK_SCORE_BELOW_THRESHOLD]
        distinguishing_aspect: "The gate is conditional on selection_method alone: the same 23-point subject cannot be opened as a RISK_SCORE case under either variant, yet a MANUAL_REFERRAL case on that identical subject opens immediately."
        test_recipe:
          setup:
            - "The same subject as the risk-profile read: one late filing and one dyed violation, both weightings at 23, well under AUDIT_SELECTION_THRESHOLD 60."
            - "Clock at 2026-10-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Gate Fuel Supply LLC", fein: "41-7000001", license_type: "SUPPLIER", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /mft/licensees"
              payload: { legal_name: "Gate Distribution Inc", fein: "41-7000002", license_type: "DISTRIBUTOR", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { dist_id: $.data.id }
            - call: "POST /mft/roadside-inspections"
              payload: { inspected_licensee_id: "${dist_id}", inspection_date: "2026-07-30", dye_test_result: "POSITIVE", gallons_in_tank: 40.00, vehicle_identifier: "MN-TRK-7000" }
              as: FieldInspector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T00:00:00Z" }
              as: ReturnsExaminer
            - call: "POST /mft/returns"
              payload: { licensee_id: "${dist_id}", period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { ret_id: $.data.id }
            - call: "POST /mft/returns/${ret_id}/schedules"
              payload: { schedule_code: "SCH_2_RECEIVED_TAX_UNPAID", product_code: "GASOLINE", total_gallons: 1000.00 }
              as: ReturnsExaminer
              captures: { sch_id: $.data.id }
            - call: "POST /mft/schedules/${sch_id}/lines"
              payload: { counterparty_licensee_id: "${sup_id}", transaction_type: "PURCHASE", gallons: 1000.00, document_date: "2026-08-15", bill_of_lading_number: "BOL-GT-0001" }
              as: ReturnsExaminer
            - call: "POST /mft/returns/${ret_id}/file"
              payload: { attest_name: "G. Gate" }
              as: ReturnsExaminer
          trigger:
            - call: "POST /mft/audit-cases"
              payload: { subject_licensee_id: "${dist_id}", selection_method: "RISK_SCORE", period_start_month: "2026-08", period_end_month: "2026-08", risk_score_variant: "VARIANCE_WEIGHTED" }
              as: AuditManager
              as_user_id: "aud-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; data.error_id == ERR_RISK_SCORE_BELOW_THRESHOLD"
            - "the same call with risk_score_variant FREQUENCY_WEIGHTED is refused identically, since both weightings sit at 23"
            - "GET /mft/audit-cases with payload { subject_licensee_id: ${dist_id} } returns total_count == 0 and GET /mft/licensees/${dist_id} reports open_audit_count == 0"
            - "the same call with selection_method MANUAL_REFERRAL returns HTTP 201 with case_status == OPEN and assessment_status == NONE, and open_audit_count becomes 1"

      - name: closing_a_case_is_refused_while_its_assessment_is_protested
        claim_type: conditional_action
        grounds:
          - state_machines.AuditCase.PRELIM_FINDINGS_to_CLOSED.preconditions
          - validations[priority=81]
          - errors[ERR_ASSESSMENT_PENDING_DISPOSITION]
        distinguishing_aspect: "The two AuditCase dimensions are otherwise independent; this is their single coupling, so a PRELIM_FINDINGS case whose assessment sits at PROTESTED cannot close until the assessment reaches FINAL or ABATED, and finalizing alone unblocks it."
        test_recipe:
          setup:
            - "One DISTRIBUTOR subject with no returns; AuditManager aud-01 opened a MANUAL_REFERRAL case over 2026-08..2026-08 and advanced it to PRELIM_FINDINGS."
            - "TaxSupervisor sup-01 issued a 250000-cent assessment with evasion_indicator false, and the subject's own agent protested it."
            - "Clock at 2026-09-25T00:00:00Z."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Protest Distribution Inc", fein: "41-7100001", license_type: "DISTRIBUTOR", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { dist_id: $.data.id }
            - call: "POST /mft/audit-cases"
              payload: { subject_licensee_id: "${dist_id}", selection_method: "MANUAL_REFERRAL", period_start_month: "2026-08", period_end_month: "2026-08" }
              as: AuditManager
              as_user_id: "aud-01"
              captures: { case_id: $.data.id }
            - call: "POST /mft/audit-cases/${case_id}/advance"
              payload: { to_status: "FIELDWORK" }
              as: AuditManager
              as_user_id: "aud-01"
            - call: "POST /mft/audit-cases/${case_id}/advance"
              payload: { to_status: "PRELIM_FINDINGS" }
              as: AuditManager
              as_user_id: "aud-01"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-25T00:00:00Z" }
              as: TaxSupervisor
              as_user_id: "sup-01"
            - call: "POST /mft/audit-cases/${case_id}/assessments"
              payload: { additional_tax_cents: 250000, evasion_indicator: false }
              as: TaxSupervisor
              as_user_id: "sup-01"
            - call: "POST /mft/audit-cases/${case_id}/protest"
              payload: { protest_grounds: "The gallons were exported and the export certificate was on file" }
              as: LicenseeAgent
              as_user_id: "${dist_id}"
          trigger:
            - call: "POST /mft/audit-cases/${case_id}/advance"
              payload: { to_status: "CLOSED" }
              as: AuditManager
              as_user_id: "aud-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == ERR_ASSESSMENT_PENDING_DISPOSITION"
            - "GET /mft/audit-cases/${case_id} still reports case_status == PRELIM_FINDINGS and assessment_status == PROTESTED, and GET /mft/licensees/${dist_id} still reports open_audit_count == 1"
            - "after POST /mft/audit-cases/${case_id}/finalize (assessment_status becomes FINAL) the identical advance to CLOSED returns HTTP 200 with case_status == CLOSED and open_audit_count back to 0"
            - "the ASSESSMENT ledger entry of 275250 cents (250000 tax + 25000 negligence penalty + 250 interest for the 4 whole days from the 2026-09-20T23:59:59Z due instant) is untouched by both the refusal and the close"

      - name: closing_the_only_audit_case_returns_the_held_claim_to_submitted
        claim_type: action_endpoint
        grounds:
          - state_machines.AuditCase.PRELIM_FINDINGS_to_CLOSED.side_effects
          - state_machines.RefundClaim.HELD_to_SUBMITTED
          - validations[priority=108]
        distinguishing_aspect: "The close endpoint carries a two-hop side effect: open_audit_count falls to 0 and only then does the claim revert to the exact status it held before the hold, with hold_reason and status_before_hold cleared; while the case is open a fresh claim is still refused by 108."
        test_recipe:
          setup:
            - "One SUPPLIER counterparty and one DISTRIBUTOR claimant whose FILED 2026-08 return carries SCH_1 UNDYED_DIESEL 100.00 gallons; clock at 2026-09-05T00:00:00Z."
            - "The claimant holds a SUBMITTED 100.00-gallon OFF_ROAD claim (3090 cents)."
            - "AuditManager aud-01 then opens a MANUAL_REFERRAL case over 2026-08..2026-08 on the claimant, which moves that claim to HELD with hold_reason OPEN_AUDIT, and advances the case to PRELIM_FINDINGS without assessing."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Hold Release Fuel Supply LLC", fein: "41-7200001", license_type: "SUPPLIER", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /mft/licensees"
              payload: { legal_name: "Hold Release Distribution Inc", fein: "41-7200002", license_type: "DISTRIBUTOR", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { dist_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: ReturnsExaminer
            - call: "POST /mft/returns"
              payload: { licensee_id: "${dist_id}", period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { ret_id: $.data.id }
            - call: "POST /mft/returns/${ret_id}/schedules"
              payload: { schedule_code: "SCH_1_RECEIVED_TAX_PAID", product_code: "UNDYED_DIESEL", total_gallons: 100.00 }
              as: ReturnsExaminer
              captures: { sch_id: $.data.id }
            - call: "POST /mft/schedules/${sch_id}/lines"
              payload: { counterparty_licensee_id: "${sup_id}", transaction_type: "PURCHASE", gallons: 100.00, document_date: "2026-08-13", bill_of_lading_number: "BOL-HR-0001" }
              as: ReturnsExaminer
            - call: "POST /mft/returns/${ret_id}/file"
              payload: { attest_name: "H. Hold" }
              as: ReturnsExaminer
            - call: "POST /mft/refund-claims"
              payload: { licensee_id: "${dist_id}", claim_type: "OFF_ROAD", period_month: "2026-08", claimed_gallons: 100.00 }
              as: ReturnsExaminer
              as_user_id: "exam-01"
              captures: { claim_id: $.data.id }
            - call: "POST /mft/audit-cases"
              payload: { subject_licensee_id: "${dist_id}", selection_method: "MANUAL_REFERRAL", period_start_month: "2026-08", period_end_month: "2026-08" }
              as: AuditManager
              as_user_id: "aud-01"
              captures: { case_id: $.data.id }
            - call: "POST /mft/audit-cases/${case_id}/advance"
              payload: { to_status: "FIELDWORK" }
              as: AuditManager
              as_user_id: "aud-01"
            - call: "POST /mft/audit-cases/${case_id}/advance"
              payload: { to_status: "PRELIM_FINDINGS" }
              as: AuditManager
              as_user_id: "aud-01"
          trigger:
            - call: "POST /mft/audit-cases/${case_id}/advance"
              payload: { to_status: "CLOSED" }
              as: AuditManager
              as_user_id: "aud-01"
          assert:
            - "HTTP 200; data.case_status == CLOSED with assessment_status still NONE"
            - "GET /mft/licensees/${dist_id} reports open_audit_count == 0"
            - "GET /mft/refund-claims/${claim_id} reports status == SUBMITTED with hold_reason == null and status_before_hold == null, and refund_amount_cents still 3090"
            - "before the close, GET /mft/refund-claims/${claim_id} reported status == HELD with hold_reason == OPEN_AUDIT and status_before_hold == SUBMITTED, and a second OFF_ROAD claim was refused with HTTP 422 ERR_REFUND_BLOCKED_BY_AUDIT"
            - "GET /mft/licensees/${dist_id}/ledger-entries with payload { entry_type: REFUND } returns total_count == 0 (a released hold pays nothing by itself)"

      - name: dismissing_an_inspection_reverses_its_penalty_without_drift
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /mft/roadside-inspections/{id}/dismiss]
          - state_machines.RoadsideInspection.PENALTY_ASSESSED_to_DISMISSED.side_effects
          - entities.LedgerEntry.fields.entry_type
        distinguishing_aspect: "The dismissal is a compensating action, not a deletion: the PENALTY row stays and a PENALTY_REVERSAL row of the exact negative amount is appended, so the ledger holds two rows summing to 0 while dyed_violation_count returns to 0 and the licensee's status is deliberately left alone."
        test_recipe:
          setup:
            - "One PENDING_BOND RETAILER with retail_channel HIGHWAY and no prior inspections; clock at its startup default 2026-08-01T00:00:00Z."
            - "FieldInspector recorded one POSITIVE inspection of 40.00 gallons, so penalty_cents is 100000 and balance_cents is 100000."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Reversal Retail Stops LLC", fein: "41-7300001", license_type: "RETAILER", mailing_state: "MN", retail_channel: "HIGHWAY" }
              as: LicensingOfficer
              captures: { ret_id: $.data.id }
            - call: "POST /mft/roadside-inspections"
              payload: { inspected_licensee_id: "${ret_id}", inspection_date: "2026-07-25", dye_test_result: "POSITIVE", gallons_in_tank: 40.00, vehicle_identifier: "MN-TRK-7300", location_description: "US-10 westbound pullout" }
              as: FieldInspector
              captures: { insp_id: $.data.id }
          trigger:
            - call: "POST /mft/roadside-inspections/${insp_id}/dismiss"
              payload: { dismissal_reason: "Laboratory retest of the sealed sample came back clear" }
              as: TaxSupervisor
              as_user_id: "sup-01"
          assert:
            - "HTTP 200; data.status == DISMISSED, data.dismissal_reason is recorded and data.penalty_cents is still 100000 (the assessed figure is history, not erased)"
            - "GET /mft/licensees/${ret_id}/ledger-entries returns total_count == 2 - PENALTY +100000 and PENALTY_REVERSAL -100000 - both with source_entity_type RoadsideInspection"
            - "GET /mft/licensees/${ret_id} reports balance_cents == 0, exactly the sum of those rows, and dyed_violation_count == 0"
            - "the licensee's status is unchanged at PENDING_BOND and required_bond_cents is unchanged at 400000"
            - "a second dismiss of the same inspection returns HTTP 409 with data.error_id == ERR_INSPECTION_NOT_DISMISSIBLE and leaves the ledger at two rows"

      - name: bond_status_computed_read_matches_the_requirement_calculation
        claim_type: computed_read
        grounds:
          - endpoints[GET /mft/licensees/{id}/bond-status]
        excluded_because:
          difficulty_instance: boundary_precision_check / bond_requirement_on_empty_basis_set_then_min_bond_clamp
          rationale: "The named Section 1.8 instance reads this endpoint on an empty basis set and again after a filing, asserting the ceil step and the MIN_BOND_CENTS clamp it publishes."
      - name: file_action_endpoint_applies_its_full_side_effect_list
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /mft/returns/{id}/file]
        excluded_because:
          difficulty_instance: combinatorial_formula / late_filing_interest_then_penalty_tier_then_floor
          rationale: "The named Section 1.8 instance drives this endpoint's whole side-effect list - tax, interest, penalty, ledger rows, late_filing_count and the licensee balance - from one late filing."
      - name: cross_match_run_endpoint_creates_discrepancies_and_escalations
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /mft/cross-match-runs]
        excluded_because:
          difficulty_instance: transitive_cascade / discrepancy_escalation_cascades_audit_case_to_open_count_to_refund_hold
          rationale: "The named Section 1.8 instance exercises this endpoint's discrepancy creation together with the escalation cascade it triggers end to end."

  - section: errors
    instances:
      - name: duplicate_fein_and_duplicate_certificate_number_are_refused
        claim_type: triggerability
        grounds:
          - errors[ERR_DUPLICATE_FEIN]
          - errors[ERR_DUPLICATE_CERTIFICATE_NUMBER]
          - validations[priority=400]
          - validations[priority=412]
        distinguishing_aspect: "Both identifiers are globally unique rather than scoped: a FEIN cannot be reused even by a different license_type, and a certificate document_number cannot be reused even by a different purchaser or exemption_type."
        test_recipe:
          setup:
            - "One SUPPLIER holding FEIN 41-7400001 and one FARM-channel RETAILER holding an AGRICULTURE certificate numbered AG-7400-001 for 2026-08-01..2026-08-31."
            - "Clock at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Unique Fuel Supply LLC", fein: "41-7400001", license_type: "SUPPLIER", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /mft/licensees"
              payload: { legal_name: "Unique Farm Depot LLC", fein: "41-7400002", license_type: "RETAILER", mailing_state: "MN", retail_channel: "FARM" }
              as: LicensingOfficer
              captures: { farm_id: $.data.id }
            - call: "POST /mft/exemption-certificates"
              payload: { purchaser_licensee_id: "${farm_id}", exemption_type: "AGRICULTURE", document_number: "AG-7400-001", valid_from: "2026-08-01", valid_to: "2026-08-31" }
              as: LicensingOfficer
              captures: { cert_id: $.data.id }
          trigger:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Copycat Distribution Inc", fein: "41-7400001", license_type: "DISTRIBUTOR", mailing_state: "WI" }
              as: LicensingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == ERR_DUPLICATE_FEIN"
            - "GET /mft/licensees returns total_count == 2 (the copycat was not created)"
            - "POST /mft/exemption-certificates for purchaser ${sup_id} with exemption_type GOVERNMENT, document_number AG-7400-001 and window 2026-09-01..2026-09-30 returns HTTP 409 with data.error_id == ERR_DUPLICATE_CERTIFICATE_NUMBER, even though neither the purchaser, the type nor the window collides"
            - "GET /mft/exemption-certificates returns total_count == 1 and that row's id == ${cert_id}"

      - name: duplicate_return_period_schedule_bol_and_match_run_are_refused
        claim_type: triggerability
        grounds:
          - errors[ERR_DUPLICATE_RETURN_PERIOD]
          - errors[ERR_DUPLICATE_SCHEDULE]
          - errors[ERR_DUPLICATE_BOL]
          - errors[ERR_DUPLICATE_MATCH_RUN]
        distinguishing_aspect: "Four differently-scoped uniqueness rules fire off one fixture: the return key is (licensee, period) among non-SUPERSEDED rows, the schedule key is (return, schedule_code, product_code), the BOL key is (return, counterparty) and the match-run key is period_month among non-FAILED runs."
        test_recipe:
          setup:
            - "One SUPPLIER counterparty and one DISTRIBUTOR filer; clock at 2026-09-05T00:00:00Z."
            - "The filer holds a DRAFT 2026-08 return with one SCH_2 GASOLINE schedule carrying one line from the counterparty under BOL-DUP-0001."
            - "One COMPLETED cross-match run already exists for 2026-08."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Dup Key Fuel Supply LLC", fein: "41-7500001", license_type: "SUPPLIER", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /mft/licensees"
              payload: { legal_name: "Dup Key Distribution Inc", fein: "41-7500002", license_type: "DISTRIBUTOR", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { dist_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: ReturnsExaminer
            - call: "POST /mft/cross-match-runs"
              payload: { period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { run_id: $.data.id }
            - call: "POST /mft/returns"
              payload: { licensee_id: "${dist_id}", period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { ret_id: $.data.id }
            - call: "POST /mft/returns/${ret_id}/schedules"
              payload: { schedule_code: "SCH_2_RECEIVED_TAX_UNPAID", product_code: "GASOLINE", total_gallons: 1000.00 }
              as: ReturnsExaminer
              captures: { sch_id: $.data.id }
            - call: "POST /mft/schedules/${sch_id}/lines"
              payload: { counterparty_licensee_id: "${sup_id}", transaction_type: "PURCHASE", gallons: 600.00, document_date: "2026-08-06", bill_of_lading_number: "BOL-DUP-0001" }
              as: ReturnsExaminer
          trigger:
            - call: "POST /mft/returns"
              payload: { licensee_id: "${dist_id}", period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == ERR_DUPLICATE_RETURN_PERIOD, and GET /mft/returns with payload { licensee_id: ${dist_id} } still returns total_count == 1"
            - "a second POST /mft/returns/${ret_id}/schedules with the same SCH_2_RECEIVED_TAX_UNPAID / GASOLINE pair returns HTTP 409 with ERR_DUPLICATE_SCHEDULE, while the same schedule_code with product_code UNDYED_DIESEL is accepted"
            - "a second line under ${sch_id} reusing bill_of_lading_number BOL-DUP-0001 for counterparty ${sup_id} returns HTTP 409 with ERR_DUPLICATE_BOL, and GET /mft/schedules/${sch_id} still reports line_count == 1"
            - "a second POST /mft/cross-match-runs for period_month 2026-08 returns HTTP 409 with ERR_DUPLICATE_MATCH_RUN, and GET /mft/cross-match-runs with payload { period_month: 2026-08 } still returns total_count == 1 with that row's id == ${run_id}"

      - name: pagination_arguments_outside_the_declared_band_are_refused
        claim_type: triggerability
        grounds:
          - errors[ERR_INVALID_PAGINATION]
          - validations[priority=35]
          - response_envelope.pagination_defaults
        distinguishing_aspect: "The band is [1,100] for limit and >= 0 for offset, so limit 0 and limit 101 are both refused while limit 100 and offset 0 are accepted - the refusal is a 400 on the query arguments, never an empty 200 page."
        test_recipe:
          setup:
            - "Two terminals exist so that a valid page can be observed; clock at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /mft/terminals"
              payload: { terminal_control_number: "T-MN-7600", name: "Pager North Terminal", state_code: "MN" }
              as: LicensingOfficer
            - call: "POST /mft/terminals"
              payload: { terminal_control_number: "T-MN-7601", name: "Pager South Terminal", state_code: "MN" }
              as: LicensingOfficer
          trigger:
            - call: "GET /mft/terminals"
              payload: { limit: 0 }
              as: LicensingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400; data.error_id == ERR_INVALID_PAGINATION"
            - "GET /mft/terminals with payload { limit: 101 } and with payload { offset: -1 } each return HTTP 400 with the same ERR_INVALID_PAGINATION"
            - "GET /mft/terminals with payload { limit: 100, offset: 0 } returns HTTP 200 with total_count == 2, has_more == false and two items"
            - "GET /mft/terminals with no pagination arguments returns HTTP 200 with the default limit of 10 applied"

      - name: every_path_id_404_names_its_own_entity
        claim_type: triggerability
        grounds:
          - validations[priority=40]
          - validations[priority=41]
          - validations[priority=44]
          - validations[priority=45]
          - validations[priority=48]
          - validations[priority=52]
        distinguishing_aspect: "Each addressed entity has its own 404 code, so an unused UUID must name the entity the path addresses - a return id must not answer with ERR_LICENSEE_NOT_FOUND - and the 404 must precede any state or business check on the same request."
        test_recipe:
          setup:
            - "Empty database apart from one LicensingOfficer-visible terminal; every id used below is a well-formed UUID that was never minted."
            - "Clock at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /mft/terminals"
              payload: { terminal_control_number: "T-MN-7700", name: "Notfound Anchor Terminal", state_code: "MN" }
              as: LicensingOfficer
              captures: { term_id: $.data.id }
          trigger:
            - call: "GET /mft/licensees/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: LicensingOfficer
              captures: { err_licensee: $.data.error_id }
            - call: "GET /mft/rack-removals/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: ReturnsExaminer
              captures: { err_rack: $.data.error_id }
            - call: "GET /mft/returns/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: ReturnsExaminer
              captures: { err_return: $.data.error_id }
            - call: "GET /mft/cross-match-runs/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: ReturnsExaminer
              captures: { err_run: $.data.error_id }
            - call: "GET /mft/audit-cases/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: AuditManager
              as_user_id: "aud-01"
              captures: { err_case: $.data.error_id }
            - call: "POST /mft/bonds/00000000-0000-4000-8000-000000000006/release"
              payload: {}
              as: LicensingOfficer
              captures: { err_bond: $.data.error_id }
            - call: "GET /mft/exemption-certificates/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: LicensingOfficer
              captures: { err_cert: $.data.error_id }
            - call: "GET /mft/schedule-lines/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: ReturnsExaminer
              captures: { err_line: $.data.error_id }
            - call: "GET /mft/discrepancies/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: ReturnsExaminer
              captures: { err_disc: $.data.error_id }
            - call: "GET /mft/refund-claims/00000000-0000-4000-8000-00000000000a"
              payload: {}
              as: ReturnsExaminer
              captures: { err_claim: $.data.error_id }
            - call: "GET /mft/roadside-inspections/00000000-0000-4000-8000-00000000000b"
              payload: {}
              as: FieldInspector
              captures: { err_insp: $.data.error_id }
          assert:
            - "each call answers HTTP 404 and never 422"
            - "the error_ids are, in order, ERR_LICENSEE_NOT_FOUND, ERR_RACK_REMOVAL_NOT_FOUND, ERR_RETURN_NOT_FOUND, ERR_CROSS_MATCH_RUN_NOT_FOUND, ERR_AUDIT_CASE_NOT_FOUND, ERR_BOND_NOT_FOUND, ERR_CERTIFICATE_NOT_FOUND, ERR_SCHEDULE_LINE_NOT_FOUND, ERR_DISCREPANCY_NOT_FOUND, ERR_REFUND_CLAIM_NOT_FOUND and ERR_INSPECTION_NOT_FOUND"
            - "the same codes also answer for body-borne references rather than path ids: POST /mft/audit-cases naming source_discrepancy_id 00000000-0000-4000-8000-000000000009 returns ERR_DISCREPANCY_NOT_FOUND, and a schedule line naming exemption_certificate_id 00000000-0000-4000-8000-000000000007 returns ERR_CERTIFICATE_NOT_FOUND"
            - "the bond release 404 arrives even though the same request would also have failed the ACTIVE-status check at priority 72, so existence outranks state"
            - "GET /mft/terminals/${term_id} still returns HTTP 200, proving the fixture itself is reachable"

      - name: discrepancy_source_and_response_return_mismatches_are_refused
        claim_type: triggerability
        grounds:
          - errors[ERR_DISCREPANCY_SOURCE_MISMATCH]
          - errors[ERR_RESPONSE_RETURN_MISMATCH]
          - validations[priority=205]
          - validations[priority=206]
        distinguishing_aspect: "Both rules police the provenance of a reference rather than its existence: a real discrepancy id may not seed a MANUAL_REFERRAL case, and a real return id may not be cited in a response unless it belongs to the discrepancy's own distributor."
        test_recipe:
          setup:
            - "One SUPPLIER and two DISTRIBUTORs; clock at 2026-09-05T00:00:00Z."
            - "The supplier's FILED 2026-08 return reports SCH_5 GASOLINE 3000.00 gallons sold to distributor one, which filed a 2026-08 return reporting SCH_1 GASOLINE 1000.00 gallons, leaving one OPEN discrepancy of 2000.00 gallons in direction UNREPORTED_BY_PURCHASER."
            - "Distributor two also holds its own FILED 2026-08 return (SCH_2 GASOLINE 500.00 gallons) that is unrelated to that discrepancy."
            - "An inquiry has been sent on the discrepancy, so it stands at INQUIRY_SENT and can take a response."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Provenance Fuel Supply LLC", fein: "41-7800001", license_type: "SUPPLIER", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /mft/licensees"
              payload: { legal_name: "Provenance One Distribution Inc", fein: "41-7800002", license_type: "DISTRIBUTOR", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { d1_id: $.data.id }
            - call: "POST /mft/licensees"
              payload: { legal_name: "Provenance Two Distribution Inc", fein: "41-7800003", license_type: "DISTRIBUTOR", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { d2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: ReturnsExaminer
            - call: "POST /mft/returns"
              payload: { licensee_id: "${sup_id}", period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { s_ret: $.data.id }
            - call: "POST /mft/returns/${s_ret}/schedules"
              payload: { schedule_code: "SCH_5_DELIVERED_TAX_COLLECTED", product_code: "GASOLINE", total_gallons: 3000.00 }
              as: ReturnsExaminer
              captures: { s_sch: $.data.id }
            - call: "POST /mft/schedules/${s_sch}/lines"
              payload: { counterparty_licensee_id: "${d1_id}", transaction_type: "SALE", gallons: 3000.00, document_date: "2026-08-08", bill_of_lading_number: "BOL-PV-0001" }
              as: ReturnsExaminer
            - call: "POST /mft/returns/${s_ret}/file"
              payload: { attest_name: "P. Provenance" }
              as: ReturnsExaminer
            - call: "POST /mft/returns"
              payload: { licensee_id: "${d1_id}", period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { d1_ret: $.data.id }
            - call: "POST /mft/returns/${d1_ret}/schedules"
              payload: { schedule_code: "SCH_1_RECEIVED_TAX_PAID", product_code: "GASOLINE", total_gallons: 1000.00 }
              as: ReturnsExaminer
              captures: { d1_sch: $.data.id }
            - call: "POST /mft/schedules/${d1_sch}/lines"
              payload: { counterparty_licensee_id: "${sup_id}", transaction_type: "PURCHASE", gallons: 1000.00, document_date: "2026-08-08", bill_of_lading_number: "BOL-PV-0002" }
              as: ReturnsExaminer
            - call: "POST /mft/returns/${d1_ret}/file"
              payload: { attest_name: "P. One" }
              as: ReturnsExaminer
            - call: "POST /mft/returns"
              payload: { licensee_id: "${d2_id}", period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { d2_ret: $.data.id }
            - call: "POST /mft/returns/${d2_ret}/schedules"
              payload: { schedule_code: "SCH_2_RECEIVED_TAX_UNPAID", product_code: "GASOLINE", total_gallons: 500.00 }
              as: ReturnsExaminer
              captures: { d2_sch: $.data.id }
            - call: "POST /mft/schedules/${d2_sch}/lines"
              payload: { counterparty_licensee_id: "${sup_id}", transaction_type: "PURCHASE", gallons: 500.00, document_date: "2026-08-09", bill_of_lading_number: "BOL-PV-0003" }
              as: ReturnsExaminer
            - call: "POST /mft/returns/${d2_ret}/file"
              payload: { attest_name: "P. Two" }
              as: ReturnsExaminer
            - call: "POST /mft/cross-match-runs"
              payload: { period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { run_id: $.data.id }
            - call: "GET /mft/discrepancies"
              payload: { run_id: "${run_id}", distributor_licensee_id: "${d1_id}" }
              as: ReturnsExaminer
              captures: { disc_id: "$.data[0].id" }
            - call: "POST /mft/discrepancies/${disc_id}/inquiries"
              payload: { question: "Your 2026-08 return shows 1000.00 GASOLINE gallons against the supplier's 3000.00; explain the gap", response_due_date: "2026-09-30" }
              as: ReturnsExaminer
          trigger:
            - call: "POST /mft/audit-cases"
              payload: { subject_licensee_id: "${d1_id}", selection_method: "MANUAL_REFERRAL", period_start_month: "2026-08", period_end_month: "2026-08", source_discrepancy_id: "${disc_id}" }
              as: AuditManager
              as_user_id: "aud-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; data.error_id == ERR_DISCREPANCY_SOURCE_MISMATCH (a source discrepancy demands selection_method CROSS_MATCH_ESCALATION)"
            - "GET /mft/audit-cases with payload { source_discrepancy_id: ${disc_id} } returns total_count == 0"
            - "POST /mft/discrepancies/${disc_id}/responses as LicenseeAgent ${d1_id} with referenced_return_id ${d2_ret} returns HTTP 422 with data.error_id == ERR_RESPONSE_RETURN_MISMATCH, and the discrepancy stays at INQUIRY_SENT"
            - "the same response citing ${d1_ret} instead returns HTTP 200 with status == RESPONSE_RECEIVED and inquiry_round == 1"
            - "a second response on ${disc_id} now that it stands at RESPONSE_RECEIVED returns HTTP 409 ERR_DISCREPANCY_STATE_INVALID (responses are accepted only from INQUIRY_SENT), and after resolving it with resolution ESCALATE_TO_AUDIT a further inquiry on the same ESCALATED_TO_AUDIT row returns the same code"

      - name: third_reopened_fieldwork_round_returns_audit_round_limit
        claim_type: triggerability
        grounds:
          - errors[ERR_AUDIT_ROUND_LIMIT]
          - validations[priority=407]
          - state_machines.AuditCase.TAXPAYER_RESPONSE_to_FIELDWORK
        distinguishing_aspect: "MAX_AUDIT_RESPONSE_ROUNDS is 2 and the counter guards the re-opening leg, so the third attempt to send a TAXPAYER_RESPONSE case back to FIELDWORK is refused while the case remains usable in TAXPAYER_RESPONSE."
        test_recipe:
          setup:
            - "One DISTRIBUTOR subject; AuditManager aud-01 opened a MANUAL_REFERRAL case over 2026-08..2026-08."
            - "The case has already been cycled twice: OPEN -> FIELDWORK -> PRELIM_FINDINGS -> TAXPAYER_RESPONSE -> FIELDWORK (response_rounds 1) -> PRELIM_FINDINGS -> TAXPAYER_RESPONSE -> FIELDWORK (response_rounds 2) -> PRELIM_FINDINGS -> TAXPAYER_RESPONSE."
            - "Clock at its startup default 2026-08-01T00:00:00Z; no assessment has been issued."
