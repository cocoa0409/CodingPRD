            - call: "POST /child-support/modification-reviews/${rev1}/information"
              payload: { participant_id: "${cpv6}", monthly_gross_income_cents: 250000, income_verification_source: "SELF_REPORTED" }
              as: CaseWorker
              captures: { i1_st: "$.data.status" }
            - call: "POST /child-support/modification-reviews/${rev1}/screening"
              payload: {}
              as: CaseWorker
              captures: { s2_cnt: "$.data.info_request_count" }
            - call: "POST /child-support/modification-reviews/${rev1}/information"
              payload: { participant_id: "${cpv6}", monthly_gross_income_cents: 250000, income_verification_source: "SELF_REPORTED" }
              as: CaseWorker
              captures: { i2_st: "$.data.status" }
            - call: "POST /child-support/modification-reviews/${rev1}/screening"
              payload: {}
              as: CaseWorker
              captures: { s3_cnt: "$.data.info_request_count" }
            - call: "POST /child-support/modification-reviews/${rev1}/information"
              payload: { participant_id: "${cpv6}", monthly_gross_income_cents: 250000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { e_infolimit: "$.data.error_id" }
