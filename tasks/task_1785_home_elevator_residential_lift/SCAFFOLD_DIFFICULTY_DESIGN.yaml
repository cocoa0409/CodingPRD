        distinguishing_aspect: |
          Cyclic machine on PermitApplication: UNDER_REVIEW -> CORRECTIONS_REQUIRED ->
          UNDER_REVIEW loops twice (revision_count 2) before APPROVED; a purely linear
          pipeline could not produce revision_count 2.
