# =============================================================================
# Task 1990 — Aerial Lift & Scaffolding Rental
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: customer_create_defaults
        claim_type: creation
        grounds: [entities.CustomerAccount]
        distinguishing_aspect: "A newly created customer starts ACTIVE with outstanding_balance_cents 0 and version 1; server-minted id is a bare UUID."
        test_recipe:
          setup: ["empty database; logical clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /customer-accounts"
              payload: { company_name: "Default Check Co", contact_email: "d@default.example", credit_limit_cents: 250000 }
              as: BranchManager
              captures: { cid: $.data.id, cstat: $.data.status, cbal: $.data.outstanding_balance_cents, cver: $.data.version }
          assert:
            - "response status 201; status == ACTIVE; outstanding_balance_cents == 0; version == 1"
            - "id is present and created_at == 2026-08-01T00:00:00Z (logical clock default)"

      - name: unit_create_system_fields
        claim_type: system_fields
        grounds: [entities.EquipmentUnit.fields.last_annual_inspection_date, entities.EquipmentUnit.fields.next_inspection_due_date]
        distinguishing_aspect: "Unit creation server-stamps the factory pre-delivery inspection from the logical clock: last_annual_inspection_date = clock date and next_inspection_due_date = +365 days; client input for these fields is impossible."
        test_recipe:
          setup: ["one equipment class exists; clock set to 2026-08-01T09:00:00Z"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: BranchManager
            - call: "POST /equipment-classes"
              payload: { class_code: "S19U", category: "AERIAL_LIFT", max_working_height_ft: 25, min_rental_days: 1, daily_rate_cents: 14500, weekly_rate_cents: 43500, monthly_rate_cents: 99000, replacement_value_cents: 2500000 }
              as: BranchManager
              captures: { class_id: $.data.id }
          trigger:
            - call: "POST /equipment-units"
              payload: { class_id: "${class_id}", serial_number: "S19U-001", ansi_standard_ref: "ANSI A92.22" }
              as: BranchManager
              captures: { uid: $.data.id, ustat: $.data.status, last_insp: $.data.last_annual_inspection_date, next_due: $.data.next_inspection_due_date }
          assert:
            - "status == AVAILABLE; last_annual_inspection_date == '2026-08-01'; next_inspection_due_date == '2027-08-01'"

      - name: create_class_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.EquipmentClass"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting required daily_rate_cents from class creation yields ERR_INVALID_REQUEST (400) and creates nothing."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /equipment-classes"
              payload: { class_code: "BAD1", category: "AERIAL_LIFT", max_working_height_ft: 25, min_rental_days: 1, weekly_rate_cents: 43500, monthly_rate_cents: 99000, replacement_value_cents: 2500000 }
              as: BranchManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST; http status 400"

      - name: create_class_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - "entities.EquipmentClass.fields.category"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "category 'CRANE' is not in {AERIAL_LIFT, SCAFFOLD} and is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /equipment-classes"
              payload: { class_code: "BAD2", category: "CRANE", max_working_height_ft: 25, min_rental_days: 1, daily_rate_cents: 14500, weekly_rate_cents: 43500, monthly_rate_cents: 99000, replacement_value_cents: 2500000 }
              as: BranchManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST; http status 400"

      - name: get_contract_not_found_returns_404
        claim_type: not_found
        grounds:
          - "entities.RentalContract"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "Reading a contract with a well-formed but non-existent UUID yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /rental-contracts/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: RentalCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND; http status 404"

      - name: equipment_units_pagination
        claim_type: listing
        grounds: [entities.EquipmentUnit, response_envelope]
        distinguishing_aspect: "GET /equipment-units honors limit/offset and reports total_count and has_more per the fixed envelope defaults."
        test_recipe:
          setup: ["one class with 3 units registered"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: BranchManager
            - call: "POST /equipment-classes"
              payload: { class_code: "S19P", category: "AERIAL_LIFT", max_working_height_ft: 25, min_rental_days: 1, daily_rate_cents: 14500, weekly_rate_cents: 43500, monthly_rate_cents: 99000, replacement_value_cents: 2500000 }
              as: BranchManager
              captures: { class_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { class_id: "${class_id}", serial_number: "S19P-001", ansi_standard_ref: "ANSI A92.22" }
              as: BranchManager
            - call: "POST /equipment-units"
              payload: { class_id: "${class_id}", serial_number: "S19P-002", ansi_standard_ref: "ANSI A92.22" }
              as: BranchManager
            - call: "POST /equipment-units"
              payload: { class_id: "${class_id}", serial_number: "S19P-003", ansi_standard_ref: "ANSI A92.22" }
              as: BranchManager
          trigger:
            - call: "GET /equipment-units?class_id=${class_id}&limit=2&offset=0"
              as: BranchManager
            - call: "GET /equipment-units?class_id=${class_id}&limit=2&offset=2"
              as: BranchManager
          assert:
            - "page 1: 2 items, total_count == 3, has_more == true"
            - "page 2: 1 item, total_count == 3, has_more == false"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: off_rent_reserved_line_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.RentalLine.transitions"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Off-rent on a RESERVED line (never dispatched) is not in the transition list and fails with ERR_INVALID_STATE; the line stays RESERVED."
        test_recipe:
          setup: ["contract DRAFT with one RESERVED line (unit, class S19V, window 2026-08-10..2026-08-15)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: BranchManager
            - call: "POST /customer-accounts"
              payload: { company_name: "Invalid Trans Co", contact_email: "ops@it.example", credit_limit_cents: 100000000 }
              as: BranchManager
              captures: { cust_id: $.data.id }
            - call: "POST /equipment-classes"
              payload: { class_code: "S19V", category: "AERIAL_LIFT", max_working_height_ft: 25, min_rental_days: 1, daily_rate_cents: 14500, weekly_rate_cents: 43500, monthly_rate_cents: 99000, replacement_value_cents: 2500000 }
              as: BranchManager
              captures: { class_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { class_id: "${class_id}", serial_number: "S19V-001", ansi_standard_ref: "ANSI A92.22" }
              as: BranchManager
              captures: { unit_id: $.data.id }
            - call: "POST /rental-contracts"
              payload: { customer_id: "${cust_id}", jobsite_address: "2 State St", damage_waiver_elected: false }
              as: RentalCoordinator
              captures: { contract_id: $.data.id, cv: $.data.version }
            - call: "POST /rental-lines"
              payload: { contract_id: "${contract_id}", unit_id: "${unit_id}", requested_start_date: "2026-08-10", requested_end_date: "2026-08-15", required_working_height_ft: 20, expected_contract_version: "${cv}" }
              as: RentalCoordinator
              captures: { line_id: $.data.id }
          trigger:
            - call: "POST /rental-lines/${line_id}/off-rent"
              as: RentalCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (RESERVED is not a valid from-state for off-rent)"

      - name: returned_line_terminal_lockdown_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.RentalLine"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "RETURNED is terminal: both off-rent and re-rent on a RETURNED line fail with ERR_INVALID_STATE."
        test_recipe:
          setup: ["contract ACTIVE; line fully cycled: delivered 2026-08-10T09:00:00Z, off-rent 2026-08-11T09:00:00Z, picked up -> RETURNED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: BranchManager
            - call: "POST /customer-accounts"
              payload: { company_name: "Terminal Co", contact_email: "ops@terminal.example", credit_limit_cents: 100000000 }
              as: BranchManager
              captures: { cust_id: $.data.id }
            - call: "POST /equipment-classes"
              payload: { class_code: "S19T", category: "AERIAL_LIFT", max_working_height_ft: 25, min_rental_days: 1, daily_rate_cents: 14500, weekly_rate_cents: 43500, monthly_rate_cents: 99000, replacement_value_cents: 2500000 }
              as: BranchManager
              captures: { class_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { class_id: "${class_id}", serial_number: "S19T-001", ansi_standard_ref: "ANSI A92.22" }
              as: BranchManager
              captures: { unit_id: $.data.id }
            - call: "POST /rental-contracts"
              payload: { customer_id: "${cust_id}", jobsite_address: "7 Terminal Way", damage_waiver_elected: false }
              as: RentalCoordinator
              captures: { contract_id: $.data.id, cv: $.data.version }
            - call: "POST /rental-lines"
              payload: { contract_id: "${contract_id}", unit_id: "${unit_id}", requested_start_date: "2026-08-10", requested_end_date: "2026-08-15", required_working_height_ft: 20, expected_contract_version: "${cv}" }
              as: RentalCoordinator
              captures: { line_id: $.data.id }
            - call: "POST /rental-contracts/${contract_id}/activate"
              as: RentalCoordinator
            - call: "POST /delivery-trips"
              payload: { contract_id: "${contract_id}", line_id: "${line_id}", trip_type: "DELIVERY", driver_id: "drv-1", planned_start_utc: "2026-08-10T08:00:00Z", planned_end_utc: "2026-08-10T10:00:00Z" }
              as: RentalCoordinator
              captures: { dtrip: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: BranchManager
            - call: "POST /delivery-trips/${dtrip}/start"
              as: Driver
              as_user_id: "drv-1"
            - call: "POST /delivery-trips/${dtrip}/complete"
              payload: { standby_minutes: 0, crew_labor_hours: 0 }
              as: Driver
              as_user_id: "drv-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T09:00:00Z" }
              as: BranchManager
            - call: "POST /rental-lines/${line_id}/off-rent"
              as: RentalCoordinator
            - call: "POST /delivery-trips"
              payload: { contract_id: "${contract_id}", line_id: "${line_id}", trip_type: "PICKUP", driver_id: "drv-1", planned_start_utc: "2026-08-11T13:00:00Z", planned_end_utc: "2026-08-11T15:00:00Z" }
              as: RentalCoordinator
              captures: { ptrip: $.data.id }
            - call: "POST /delivery-trips/${ptrip}/start"
              as: Driver
              as_user_id: "drv-1"
            - call: "POST /delivery-trips/${ptrip}/complete"
              payload: { standby_minutes: 0, crew_labor_hours: 0 }
              as: Driver
              as_user_id: "drv-1"
          trigger:
            - call: "POST /rental-lines/${line_id}/off-rent"
              as: RentalCoordinator
              captures: { err1: $.data.error_id }
            - call: "POST /rental-lines/${line_id}/re-rent"
              as: RentalCoordinator
              captures: { err2: $.data.error_id }
          assert:
            - "off-rent on RETURNED line: error_id == ERR_INVALID_STATE"
            - "re-rent on RETURNED line: error_id == ERR_INVALID_STATE"

      - name: trip_fail_then_reschedule_cycle
        claim_type: valid_transition
        grounds: [state_machines.DeliveryTrip.EN_ROUTE_to_FAILED, state_machines.DeliveryTrip.FAILED_to_SCHEDULED]
        distinguishing_aspect: "A FAILED trip can be rescheduled to a new window (FAILED -> SCHEDULED) and then started and completed normally; failure does not consume the line."
        test_recipe:
          setup: ["contract ACTIVE; RESERVED line; DELIVERY trip scheduled 2026-08-10T08:00:00Z-10:00:00Z then started"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: BranchManager
            - call: "POST /customer-accounts"
              payload: { company_name: "Reschedule Co", contact_email: "ops@resched.example", credit_limit_cents: 100000000 }
              as: BranchManager
              captures: { cust_id: $.data.id }
            - call: "POST /equipment-classes"
              payload: { class_code: "S19RS", category: "AERIAL_LIFT", max_working_height_ft: 25, min_rental_days: 1, daily_rate_cents: 14500, weekly_rate_cents: 43500, monthly_rate_cents: 99000, replacement_value_cents: 2500000 }
              as: BranchManager
              captures: { class_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { class_id: "${class_id}", serial_number: "S19RS-001", ansi_standard_ref: "ANSI A92.22" }
              as: BranchManager
              captures: { unit_id: $.data.id }
            - call: "POST /rental-contracts"
              payload: { customer_id: "${cust_id}", jobsite_address: "15 Retry Rd", damage_waiver_elected: false }
              as: RentalCoordinator
              captures: { contract_id: $.data.id, cv: $.data.version }
            - call: "POST /rental-lines"
              payload: { contract_id: "${contract_id}", unit_id: "${unit_id}", requested_start_date: "2026-08-10", requested_end_date: "2026-08-15", required_working_height_ft: 20, expected_contract_version: "${cv}" }
              as: RentalCoordinator
              captures: { line_id: $.data.id }
            - call: "POST /rental-contracts/${contract_id}/activate"
              as: RentalCoordinator
            - call: "POST /delivery-trips"
              payload: { contract_id: "${contract_id}", line_id: "${line_id}", trip_type: "DELIVERY", driver_id: "drv-1", planned_start_utc: "2026-08-10T08:00:00Z", planned_end_utc: "2026-08-10T10:00:00Z" }
              as: RentalCoordinator
              captures: { trip_id: $.data.id }
            - call: "POST /delivery-trips/${trip_id}/start"
              as: Driver
              as_user_id: "drv-1"
          trigger:
            - call: "POST /delivery-trips/${trip_id}/fail"
              payload: { failure_reason: "jobsite gate locked" }
              as: Driver
              as_user_id: "drv-1"
              captures: { s1: $.data.status }
            - call: "POST /delivery-trips/${trip_id}/reschedule"
              payload: { planned_start_utc: "2026-08-11T08:00:00Z", planned_end_utc: "2026-08-11T10:00:00Z" }
              as: RentalCoordinator
              captures: { s2: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T09:00:00Z" }
              as: BranchManager
            - call: "POST /delivery-trips/${trip_id}/start"
              as: Driver
              as_user_id: "drv-1"
            - call: "POST /delivery-trips/${trip_id}/complete"
              payload: { standby_minutes: 0, crew_labor_hours: 0 }
              as: Driver
              as_user_id: "drv-1"
              captures: { s3: $.data.status }
            - call: "GET /rental-lines/${line_id}"
              as: RentalCoordinator
              captures: { lstat: $.data.status }
          assert:
            - "after fail: trip status FAILED"
            - "after reschedule: trip status SCHEDULED with new window 2026-08-11T08:00:00Z/10:00:00Z"
            - "after start+complete: trip COMPLETED and line OUT_ON_RENT (failed delivery did not change the line)"

      - name: fail_inspection_cancels_only_reserved_lines
        claim_type: conditional_cascade
        grounds: [state_machines.EquipmentUnit.transitions, state_machines.RentalLine.RESERVED_to_CANCELLED]
        distinguishing_aspect: "The FAIL-certification cascade is conditional on line state: on an ON_RENT unit it cancels only the RESERVED future line and leaves the OUT_ON_RENT line (and the unit's ON_RENT status) untouched."
        test_recipe:
          setup:
            - "Class S19X; unit UX with line1 OUT_ON_RENT (window 2026-08-05..2026-08-15, delivered 2026-08-05T09:00:00Z) and line2 RESERVED (window 2026-08-20..2026-08-25, different contract)"
            - "SUBMITTED FAIL inspection record for UX"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: BranchManager
            - call: "POST /customer-accounts"
              payload: { company_name: "Cascade Cond Co", contact_email: "ops@cc.example", credit_limit_cents: 100000000 }
              as: BranchManager
              captures: { cust_id: $.data.id }
            - call: "POST /equipment-classes"
              payload: { class_code: "S19X", category: "AERIAL_LIFT", max_working_height_ft: 25, min_rental_days: 1, daily_rate_cents: 14500, weekly_rate_cents: 43500, monthly_rate_cents: 99000, replacement_value_cents: 2500000 }
              as: BranchManager
              captures: { class_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { class_id: "${class_id}", serial_number: "S19X-001", ansi_standard_ref: "ANSI A92.22" }
              as: BranchManager
              captures: { unit_id: $.data.id }
            - call: "POST /rental-contracts"
              payload: { customer_id: "${cust_id}", jobsite_address: "1 First St", damage_waiver_elected: false }
              as: RentalCoordinator
              captures: { cA: $.data.id, cvA: $.data.version }
            - call: "POST /rental-lines"
              payload: { contract_id: "${cA}", unit_id: "${unit_id}", requested_start_date: "2026-08-05", requested_end_date: "2026-08-15", required_working_height_ft: 20, expected_contract_version: "${cvA}" }
              as: RentalCoordinator
              captures: { l1: $.data.id }
            - call: "POST /rental-contracts/${cA}/activate"
              as: RentalCoordinator
            - call: "POST /delivery-trips"
              payload: { contract_id: "${cA}", line_id: "${l1}", trip_type: "DELIVERY", driver_id: "drv-1", planned_start_utc: "2026-08-05T08:00:00Z", planned_end_utc: "2026-08-05T10:00:00Z" }
              as: RentalCoordinator
              captures: { t1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: BranchManager
            - call: "POST /delivery-trips/${t1}/start"
              as: Driver
              as_user_id: "drv-1"
            - call: "POST /delivery-trips/${t1}/complete"
              payload: { standby_minutes: 0, crew_labor_hours: 0 }
              as: Driver
              as_user_id: "drv-1"
            - call: "POST /rental-contracts"
              payload: { customer_id: "${cust_id}", jobsite_address: "2 Second St", damage_waiver_elected: false }
              as: RentalCoordinator
              captures: { cB: $.data.id, cvB: $.data.version }
            - call: "POST /rental-lines"
              payload: { contract_id: "${cB}", unit_id: "${unit_id}", requested_start_date: "2026-08-20", requested_end_date: "2026-08-25", required_working_height_ft: 20, expected_contract_version: "${cvB}" }
              as: RentalCoordinator
              captures: { l2: $.data.id }
            - call: "POST /inspection-records"
              payload: { unit_id: "${unit_id}", inspection_date: "2026-08-06", ansi_standard_ref: "ANSI A92.22", result: "FAIL" }
              as: YardTechnician
              as_user_id: "yt-1"
              captures: { rec_id: $.data.id }
          trigger:
            - call: "POST /inspection-records/${rec_id}/certify"
              as: BranchManager
              as_user_id: "bm-1"
            - call: "GET /equipment-units/${unit_id}"
              as: BranchManager
              captures: { u_stat: $.data.status }
            - call: "GET /rental-lines/${l1}"
              as: RentalCoordinator
              captures: { l1_stat: $.data.status }
            - call: "GET /rental-lines/${l2}"
              as: RentalCoordinator
              captures: { l2_stat: $.data.status }
          assert:
            - "unit stays ON_RENT (FAIL while ON_RENT does not quarantine the deployed unit)"
            - "line1 (OUT_ON_RENT) is unaffected: status OUT_ON_RENT"
            - "line2 (RESERVED) is CANCELLED by the conditional cascade"

      - name: claim_waived_terminal_lockdown_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.DamageClaim"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "WAIVED is terminal for DamageClaim: a dispute on a WAIVED claim fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["contract ACTIVE; line OUT_ON_RENT; DAMAGE claim estimate 50000 charged, disputed, resolved WAIVE -> WAIVED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: BranchManager
            - call: "POST /customer-accounts"
              payload: { company_name: "Waive Lock Co", contact_email: "ops@wl.example", credit_limit_cents: 100000000 }
              as: BranchManager
              captures: { cust_id: $.data.id }
            - call: "POST /equipment-classes"
              payload: { class_code: "S19WL", category: "AERIAL_LIFT", max_working_height_ft: 25, min_rental_days: 1, daily_rate_cents: 14500, weekly_rate_cents: 43500, monthly_rate_cents: 99000, replacement_value_cents: 2500000 }
              as: BranchManager
              captures: { class_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { class_id: "${class_id}", serial_number: "S19WL-001", ansi_standard_ref: "ANSI A92.22" }
              as: BranchManager
              captures: { unit_id: $.data.id }
            - call: "POST /rental-contracts"
              payload: { customer_id: "${cust_id}", jobsite_address: "4 Waive Ave", damage_waiver_elected: false }
              as: RentalCoordinator
              captures: { contract_id: $.data.id, cv: $.data.version }
            - call: "POST /rental-lines"
              payload: { contract_id: "${contract_id}", unit_id: "${unit_id}", requested_start_date: "2026-08-10", requested_end_date: "2026-08-15", required_working_height_ft: 20, expected_contract_version: "${cv}" }
              as: RentalCoordinator
