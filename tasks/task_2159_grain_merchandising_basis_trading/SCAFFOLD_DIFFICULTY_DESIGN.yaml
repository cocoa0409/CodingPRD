  - rule_id: non_linear_state_machine
    instances:
      - name: contract_pricing_and_delivery_axes_advance_independently
        grounds:
          - state_machines.PurchaseContract.ACTIVE_to_ACTIVE
          - entities.PurchaseContract.fields.pricing_status
          - entities.PurchaseContract.fields.delivery_status
          - calculations.weighted_average_leg_price
        distinguishing_aspect: |
          Non-linearity here is PARALLEL STATE DIMENSIONS on the PurchaseContract entity:
          applying a ticket moves delivery_status OPEN -> PARTIALLY_DELIVERED while
          pricing_status stays PARTIALLY_PRICED, and the later FUTURES pricing order moves
          pricing_status to FULLY_PRICED while delivery_status stays PARTIALLY_DELIVERED —
