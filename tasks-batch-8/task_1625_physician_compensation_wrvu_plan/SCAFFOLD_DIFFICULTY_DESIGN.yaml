            - { call: "POST /comp/_clock/set_current_utc", payload: { to_iso8601: "2026-01-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /comp/physicians", payload: { npi: "1000000041", full_name: "Dr Sup", specialty: "IM", provider_type: PHYSICIAN, fte: 1.0, hire_date: "2015-01-01" }, as: SystemAdmin, captures: { sup1: $.data.id } }
