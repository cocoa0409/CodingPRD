        claim_type: Violation to Error
        grounds: ['errors[ERR_BRAND_CONFLICT_EXISTS]', 'validations[priority=60]', calculations.brand_priority_ranking]
        distinguishing_aspect: "A filing lodged 2026-08-02 with no prior-use affidavit is outranked by the incumbent recorded 2026-08-01 in the same conflict group under a different owner, so recording returns 409 ERR_BRAND_CONFLICT_EXISTS and no second registration appears."
