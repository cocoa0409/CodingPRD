  - { method: GET, path: "/api/events", description: "List events (paginated)", roles: [StadiumAdmin, PremiumSalesRep, FinanceController, EventServicesManager, AccountHolder], code: 200, input: ["season_id?", "event_type?", "status?", "limit?", "offset?"], output: "Event[]", side_effects: [] }
