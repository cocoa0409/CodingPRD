      - name: corner_cancel_effective_date_must_lie_inside_term
        claim_type: Violation → Error
        grounds:
          - validations[priority=57]
          - errors[ERR_CANCEL_DATE_OUTSIDE_TERM]
          - calculations.policy_cancellation_return
          - endpoints[POST /inland-marine/policies/{id}/cancel]
        distinguishing_aspect: |
          Both ends of the term are rejected from outside and accepted on the boundary:
          2027-09-01 (after expiration) and 2026-07-31 (before inception) both return
          ERR_CANCEL_DATE_OUTSIDE_TERM, while cancelling exactly ON 2026-08-01 is legal
          and refunds the entire 100000 written premium because unearned_days equals
          term_days.
        test_recipe:
          setup:
            - "One IN_FORCE Policy in T2_URBAN, 2026-08-01 to 2027-08-01, minimum_premium_cents 100000, written_premium_cents 100000."
            - "One ACTIVE REPORTING_FORM CoveragePart with no items: valuation_basis ACV, aggregate_limit_cents 200000000, reporting_frequency MONTHLY, reporting_annual_rate_bp 250, reporting_limit_cents 20000000."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Flat Cancel Co", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "REPORTING_FORM", valuation_basis: "ACV", aggregate_limit_cents: 200000000, reporting_frequency: "MONTHLY", reporting_annual_rate_bp: 250, reporting_limit_cents: 20000000 }
              as: Underwriter
              captures: { cp: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/activate"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /inland-marine/policies/${pol}/cancel"
              payload: { cancellation_reason: "UNDERWRITING", cancel_effective_date: "2027-09-01" }
              as: UnderwritingManager
            - call: "POST /inland-marine/policies/${pol}/cancel"
              payload: { cancellation_reason: "UNDERWRITING", cancel_effective_date: "2026-07-31" }
              as: UnderwritingManager
            - call: "POST /inland-marine/policies/${pol}/cancel"
              payload: { cancellation_reason: "UNDERWRITING", cancel_effective_date: "2026-08-01" }
              as: UnderwritingManager
          assert:
            - "after setup: Policy.${pol}.status == IN_FORCE, term_days == 365, written_premium_cents == 100000 and premium_balance_cents == 100000"
            - "trigger[0] HTTP status == 422"
            - "trigger[0] response error_id == ERR_CANCEL_DATE_OUTSIDE_TERM"
            - "after trigger[0]: Policy.${pol}.status == IN_FORCE, cancellation_reason is null and cancel_effective_date is null"
            - "trigger[1] HTTP status == 422"
            - "trigger[1] response error_id == ERR_CANCEL_DATE_OUTSIDE_TERM"
            - "trigger[2] HTTP status == 200"
            - "after trigger[2]: Policy.${pol}.status == CANCELLED, cancel_effective_date == 2026-08-01 and premium_balance_cents == 0"
            - "after trigger[2]: exactly one CANCELLATION_RETURN LedgerEntry exists with amount_cents == -100000"
            - "after trigger[2]: CoveragePart.${cp}.status == VOID"
            - "2027-09-01 is one month past expiration and 2026-07-31 is one day before inception, so a check written as `date <= expiration_date` alone still accepts trigger[1]"

      - name: corner_floater_dates_bounded_by_term_and_own_coverage
        claim_type: Violation → Error
        grounds:
          - validations[priority=55]
          - errors[ERR_FLOATER_OUTSIDE_POLICY_TERM]
          - errors[ERR_TERMINATION_DATE_OUTSIDE_COVERAGE]
          - calculations.installation_floater_premium
