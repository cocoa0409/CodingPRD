            - { call: "POST /lien/parties", payload: { project_id: "${proj_id}", party_role: "OWNER", legal_name: "O", address: "1 Fl Ave" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { p_o: $.data.id } }
            - { call: "POST /lien/parties", payload: { project_id: "${proj_id}", party_role: "GC", legal_name: "G", address: "2 Fl Ave" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { p_g: $.data.id } }
