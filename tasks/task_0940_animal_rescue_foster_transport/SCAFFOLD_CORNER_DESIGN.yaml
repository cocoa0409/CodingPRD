  - section: state_machines
    instances:
      - name: stray_hold_monotone_latch_refuses_later_extension
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.IntakeRecord.HOLD_ACTIVE_to_HOLD_EXPIRED
          - validations[priority=21]
          - errors[ERR_HOLD_ALREADY_EXPIRED]
          - calculations.hold_status_derivation
        distinguishing_aspect: "Once hold_status has latched to HOLD_EXPIRED at exactly hold_expires_at, an identification recorded with extend_stray_hold true is refused with ERR_HOLD_ALREADY_EXPIRED and hold_expires_at is left at 2026-05-04T00:00:00.000Z."
        test_recipe:
          setup:
            - "One unchipped STRAY animal intaken 2026-05-01T00:00:00Z, giving hold_days 3 and hold_expires_at 2026-05-04T00:00:00Z."
            - "The clock stands at exactly 2026-05-04T00:00:00Z and a read has latched hold_status to HOLD_EXPIRED."
          setup_api_calls:
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rescue/organizations"
              payload: { name: "Harbor Rescue", org_type: "SHELTER", state_code: "OR" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /rescue/animals"
              payload: { name: "Wanderer", species: "DOG", size_class: "MEDIUM", weight_lb: 30.0, date_of_birth: "2023-01-01T00:00:00Z", current_organization_id: "${org_id}" }
              as: IntakeOfficer
              captures: { animal_id: $.data.id }
            - call: "POST /rescue/animals/${animal_id}/intake-records"
              payload: { intake_type: "STRAY", intake_datetime: "2026-05-01T00:00:00Z", impound_billing_basis: "CALENDAR_DAY" }
              as: IntakeOfficer
              captures: { intake_id: $.data.id, hold_days: $.data.hold_days, expires: $.data.hold_expires_at }
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /rescue/intake-records/${intake_id}"
              payload: {}
              as: IntakeOfficer
              captures: { latched: $.data.hold_status }
          trigger:
            - call: "POST /rescue/animals/${animal_id}/identification"
              payload: { microchip_id: "985141000999888", extend_stray_hold: true }
              as: IntakeOfficer
              captures: { err: $.data.error_id }
            - call: "GET /rescue/intake-records/${intake_id}"
              payload: {}
              as: IntakeOfficer
              captures: { after_status: $.data.hold_status, after_expires: $.data.hold_expires_at, after_days: $.data.hold_days }
          assert:
            - "hold_days == 3"
            - "expires == 2026-05-04T00:00:00.000Z"
            - "latched == HOLD_EXPIRED"
            - "err == ERR_HOLD_ALREADY_EXPIRED"
            - "the identification returns HTTP 409"
            - "after_status == HOLD_EXPIRED"
            - "after_expires == 2026-05-04T00:00:00.000Z"
            - "after_days == 3"

      - name: stray_hold_extension_while_active_moves_expiry_to_seven_days
        claim_type: Valid Transition
        grounds:
          - state_machines.IntakeRecord.HOLD_ACTIVE_to_HOLD_ACTIVE
          - calculations.stray_hold_expiry
          - entities.IntakeRecord.fields.identifiable_at_intake
        distinguishing_aspect: "Recording a microchip on day 2 of a 3-day unidentifiable stray hold recomputes hold_days to 7 and moves hold_expires_at from 2026-05-04T00:00:00.000Z to 2026-05-08T00:00:00.000Z."
        test_recipe:
          setup:
            - "One unchipped STRAY animal intaken 2026-05-01T00:00:00Z with hold_expires_at 2026-05-04T00:00:00Z."
            - "The clock stands at 2026-05-02T00:00:00Z, so the hold is still HOLD_ACTIVE."
          setup_api_calls:
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rescue/organizations"
              payload: { name: "Harbor Rescue", org_type: "SHELTER", state_code: "OR" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /rescue/animals"
              payload: { name: "Wanderer", species: "DOG", size_class: "MEDIUM", weight_lb: 30.0, date_of_birth: "2023-01-01T00:00:00Z", current_organization_id: "${org_id}" }
              as: IntakeOfficer
              captures: { animal_id: $.data.id }
            - call: "POST /rescue/animals/${animal_id}/intake-records"
              payload: { intake_type: "STRAY", intake_datetime: "2026-05-01T00:00:00Z" }
              as: IntakeOfficer
              captures: { intake_id: $.data.id, before_days: $.data.hold_days, before_expires: $.data.hold_expires_at, before_ident: $.data.identifiable_at_intake }
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /rescue/animals/${animal_id}/identification"
              payload: { microchip_id: "985141000999888", extend_stray_hold: true }
              as: IntakeOfficer
              captures: { ident_after: $.data.identifiable }
            - call: "GET /rescue/intake-records/${intake_id}"
              payload: {}
              as: IntakeOfficer
              captures: { after_days: $.data.hold_days, after_expires: $.data.hold_expires_at, after_status: $.data.hold_status, after_ident: $.data.identifiable_at_intake }
          assert:
            - "before_days == 3"
            - "before_expires == 2026-05-04T00:00:00.000Z"
            - "before_ident == false"
            - "ident_after == true"
            - "after_days == 7"
            - "after_expires == 2026-05-08T00:00:00.000Z"
            - "after_status == HOLD_ACTIVE"
            - "after_ident == true"

      - name: hold_release_twice_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.HoldRecord.ACTIVE_to_RELEASED
          - validations[priority=18]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "The first release moves the HoldRecord ACTIVE -> RELEASED and stamps released_at; the second identical call finds no declared transition from RELEASED and returns ERR_INVALID_STATE with HTTP 409."
