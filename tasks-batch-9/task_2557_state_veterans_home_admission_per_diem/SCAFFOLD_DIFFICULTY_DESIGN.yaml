          On the claim-reimbursement domain (a different entity domain from
          resident_cost_share_monthly), the identical 19 RESIDENT_DAY plus 12 BED_HOLD_DAY census
          rows yield billable_day_count 29 / claim_amount_cents 284573 under AUDITED_BASIS versus
          billable_day_count 31 / claim_amount_cents 367567 under CENSUS_BASIS, a divergence of
          82994 cents driven by the 10-day bed-hold cap and the half-rate.
