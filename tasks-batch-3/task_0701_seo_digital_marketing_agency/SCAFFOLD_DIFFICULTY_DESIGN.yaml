  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: record_spend_at_budget_boundary
        grounds:
          - validations[priority=13]
          - state_machines.AdCampaign.DRAFT_to_LIVE
          - entities.AdCampaign.fields.spent_cents
        distinguishing_aspect: |
          Numeric threshold boundary on the record-spend endpoint: spending exactly up to budget_cents
          (spent_cents == budget_cents) succeeds, but one cent more (budget_cents + 1) is ERR_BUDGET_EXCEEDED.
        test_recipe:
          setup:
            - "Direct ACTIVE client; LIVE campaign budget 500,000c, already spent 499,999c"
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Budget Co", primary_domain: "bud.example" }
              as: AgencyAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /clients/${cl_id}/audits"
              payload: { technical_score: 70, content_score: 70, backlink_score: 70 }
              as: AgencyAdmin
            - call: "POST /retainers"
              payload: { client_id: "${cl_id}", tier: "STARTER", monthly_credits: 10, wholesale_price_cents: 100000 }
              as: AgencyAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /retainers/${ret_id}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /ad-campaigns"
              payload: { client_id: "${cl_id}", retainer_id: "${ret_id}", channel: "BING", budget_cents: 500000 }
              as: AccountManager
              captures: { camp_id: $.data.id }
            - call: "POST /ad-campaigns/${camp_id}/launch"
              payload: {}
              as: AccountManager
            - call: "POST /ad-campaigns/${camp_id}/record-spend"
              payload: { amount_cents: 499999 }
              as: AccountManager
          trigger:
            - call: "POST /ad-campaigns/${camp_id}/record-spend"
              payload: { amount_cents: 1 }
              as: AccountManager
              captures: { spent_ok: $.data.spent_cents }
            - call: "POST /ad-campaigns/${camp_id}/record-spend"
              payload: { amount_cents: 1 }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "First trigger (1c, total 500000 == budget) succeeds: AdCampaign.${camp_id}.spent_cents == 500000"
            - "Second trigger (would make 500001 > budget) returns error_id == ERR_BUDGET_EXCEEDED"

      - name: gbp_optimize_score_threshold_and_empty_status_edge
        grounds:
          - validations[priority=14]
          - state_machines.GbpListing.VERIFIED_to_OPTIMIZED
          - calculations.gbp_optimization_score
        distinguishing_aspect: |
          A DIFFERENT metric/endpoint from the budget boundary: the gbp-optimize endpoint requires
          optimization_score >= 80. A VERIFIED listing whose client is only AUDITED scores 75 (25+25+25+0,
          the client-ACTIVE quarter empty) and is rejected with ERR_OPTIMIZATION_THRESHOLD_NOT_MET;
          once the client reaches ACTIVE the score is 100 and optimize succeeds.
        test_recipe:
          setup:
            - "Client AUDITED (not yet ACTIVE); GbpListing VERIFIED -> score 75 (< 80)"
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Gbp Co", primary_domain: "gbp.example" }
              as: AgencyAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /clients/${cl_id}/audits"
              payload: { technical_score: 70, content_score: 70, backlink_score: 70 }
              as: AgencyAdmin
            - call: "POST /gbp-listings"
              payload: { client_id: "${cl_id}", location_name: "Main St", service_area: "Downtown" }
              as: AccountManager
              captures: { g_id: $.data.id }
            - call: "POST /gbp-listings/${g_id}/verify"
              payload: {}
              as: AccountManager
              captures: { score75: $.data.optimization_score }
          trigger:
            - call: "POST /gbp-listings/${g_id}/optimize"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "GbpListing.${g_id}.optimization_score == 75 after verify (client not ACTIVE -> last quarter empty)"
            - "optimize returns error_id == ERR_OPTIMIZATION_THRESHOLD_NOT_MET (75 < 80 boundary)"
            - "GbpListing.${g_id}.status == VERIFIED (unchanged)"

