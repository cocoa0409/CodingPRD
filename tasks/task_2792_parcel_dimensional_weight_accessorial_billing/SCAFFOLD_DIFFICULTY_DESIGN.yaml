scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: billable_weight_preliminary_vs_final_basis_flip
        grounds:
          - calculations.billable_weight
          - entities.Shipment.fields.preliminary_basis
          - entities.Shipment.fields.final_basis
          - entities.Shipment.fields.billable_weight_lbs
          - state_machines.Shipment.measurement_status.PENDING_SCAN_to_VERIFIED
          - concurrency_rules[scan-capture-stale-shipment]
        distinguishing_aspect: |
          Both variants of calculations.billable_weight live on ONE Shipment's own fields and
          diverge in the basis label itself: the shipper-declared PRELIMINARY variant bills
          30 lb on basis ACTUAL, the scan-driven FINAL variant bills 44 lb on basis
          DIMENSIONAL, and Shipment.billable_weight_lbs switches to 44 the moment a scan
          exists. The other dual_variant instance diverges inside calculations.dispute_credit
          on a different entity (Dispute) and its variants differ in credited money, not in
          weight basis.
        test_recipe:
          setup:
            - "ShipperAccount SH-1001 is ACTIVE and owns one ACTIVE RateContract C1: dim_divisor 139, min_charge_cents 1195, zone-2 rate rows 1-20 @ 380, 21-70 @ 340, 71-9999 @ 305, tier table 50000 -> 550 bps and 250000 -> 1250 bps, RESIDENTIAL override 540."
            - "ServiceLevel GROUND exists: guarantee_hours 120, guaranteed false."
            - "Shipment P is declared 10 x 10 x 20 in at 30.0 lb, zone 2, non-residential, delivery_area_class NONE, so its PRELIMINARY figures are cube 2000 in3, dim weight 15 lb, billable 30 lb, basis ACTUAL."
            - "No scan exists yet: measurement_status == PENDING_SCAN and final_* fields are all null."
            - "The logical clock still reads its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-1001", name: "Northwind Freight", billing_email: "ap@northwind.example" }
              as: CarrierAdmin
              captures: { sh1: $.data.id, sh1_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "GROUND", name: "Ground", guarantee_hours: 120, guaranteed: false }
              as: CarrierAdmin
              captures: { sl_ground: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh1}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}, {min_transportation_subtotal_cents: 250000, discount_bps: 1250}]
                accessorial_rate_overrides: { RESIDENTIAL: 540 }
                residential_waived: false
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh1_v}" }
              as: CarrierAdmin
            - call: "POST /shipments"
              payload: { shipper_id: "${sh1}", service_level_id: "${sl_ground}", tracking_number: "1Z-P-0001", zone: 2, residential_declared: false, declared_length_in: 10, declared_width_in: 10, declared_height_in: 20, declared_weight_lbs: 30.0 }
              as: CarrierOps
              captures: { p: $.data.id, p_v: $.data.version }
          trigger:
            - call: "POST /shipments/${p}/scans"
              payload: { scan_source: "MANUAL_REWEIGH", scanned_length_in: 24, scanned_width_in: 18, scanned_height_in: 14, scanned_weight_lbs: 30.4, expected_shipment_version: "${p_v}" }
              as: CarrierOps
              captures: { scan1: $.data.id }
            - call: "GET /shipments/${p}"
              payload: {}
              as: CarrierOps
            - call: "GET /shipments/${p}/billing-preview"
              payload: {}
              as: RevenueAuditor
          assert:
            - "Shipment.${p}.declared_cube_in3 == 2000"
            - "Shipment.${p}.preliminary_dim_weight_lbs == 15"
            - "Shipment.${p}.preliminary_billable_weight_lbs == 30"
            - "Shipment.${p}.preliminary_basis == ACTUAL"
            - "DimensionScan.${scan1}.scanned_cube_in3 == 6048"
            - "DimensionScan.${scan1}.dim_variance_pct == 202.40"
            - "DimensionScan.${scan1}.tolerance_status == EXCEEDS_TOLERANCE"
            - "Shipment.${p}.scanned_cube_in3 == 6048"
            - "Shipment.${p}.final_dim_weight_lbs == 44"
            - "Shipment.${p}.final_billable_weight_lbs == 44"
            - "Shipment.${p}.final_basis == DIMENSIONAL"
            - "Shipment.${p}.billable_weight_lbs == 44 — the FINAL variant governs the moment one scan exists, and the PRELIMINARY fields are still readable at 30 / ACTUAL"
            - "Shipment.${p}.measurement_status == VERIFIED — a MANUAL_REWEIGH is authoritative even though this scan's own tolerance_status is EXCEEDS_TOLERANCE"
            - "Shipment.${p}.oversize_flag == false and Shipment.${p}.additional_handling_flag == false (longest 24 in, 30.4 lb clears both accessorial thresholds)"
            - "GET /shipments/${p}/billing-preview returns billable_weight_lbs == 44, rate_cents_per_lb == 340 and transportation_base_cents == 14960 — the FINAL variant prices the parcel, not the 30 lb x 340 = 10200 the PRELIMINARY variant would have produced"
      - name: dispute_credit_full_reprice_vs_accessorial_only_divergence
        grounds:
          - calculations.dispute_credit
          - entities.Dispute.fields.claim_type
          - entities.Dispute.fields.granted_credit_cents
          - state_machines.Dispute.UNDER_REVIEW_to_UPHELD
          - entities.BillingAdjustment.fields.reason
        distinguishing_aspect: |
          Two identically priced invoice lines (7760 cents each, RESIDENTIAL 540 assessed on
          both) are upheld under the two variants of calculations.dispute_credit and produce
          different money: ACCESSORIAL_ONLY credits exactly the named RESIDENTIAL charge
          (540) while FULL_REPRICE recomputes the whole line from the still-correct
          declaration and credits max(0, 7760 - 7760) == 0. The divergence is in cents on a
          Dispute, not in the pound count on a Shipment as in the billable_weight instance.
        test_recipe:
          setup:
            - "SH-1001 ACTIVE with ACTIVE contract C1 (divisor 139, min charge 1195, zone-2 rows 380/340/305, RESIDENTIAL override 540) and ServiceLevel EXPRESS (24 h, guaranteed)."
            - "Two shipments PKG-A and PKG-B are declared identically: 18.4 x 12.6 x 10.5 in, 9.2 lb, zone 2, residential, so each rounds to 18 x 13 x 11 = 2574 in3, dim weight 19 lb, billable 19 lb, and each carries one AUTO RESIDENTIAL charge of 540."
            - "Both are DELIVERED and sit on invoice INV with status ISSUED: each line is transportation_base 7220 + surcharge 0 + accessorial 540 = 7760, invoice gross 15520, tier 0 bps, net 15520."
            - "Neither shipment was ever scanned, so a FULL_REPRICE reproduces the billed figure exactly."
            - "Dispute DSP_A (claim_type ACCESSORIAL, disputed_codes [RESIDENTIAL]) and dispute DSP_B (claim_type WEIGHT) are both UNDER_REVIEW with one accepted evidence item each."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-1001", name: "Northwind Freight" }
              as: CarrierAdmin
              captures: { sh1: $.data.id, sh1_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express 24", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl_exp: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh1}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}, {min_transportation_subtotal_cents: 250000, discount_bps: 1250}]
                accessorial_rate_overrides: { RESIDENTIAL: 540 }
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh1_v}" }
              as: CarrierAdmin
            - call: "POST /shipments"
              payload: { shipper_id: "${sh1}", service_level_id: "${sl_exp}", tracking_number: "1Z-PKG-A", zone: 2, residential_declared: true, declared_length_in: 18.4, declared_width_in: 12.6, declared_height_in: 10.5, declared_weight_lbs: 9.2 }
              as: CarrierOps
              captures: { pa: $.data.id }
            - call: "POST /shipments"
              payload: { shipper_id: "${sh1}", service_level_id: "${sl_exp}", tracking_number: "1Z-PKG-B", zone: 2, residential_declared: true, declared_length_in: 18.4, declared_width_in: 12.6, declared_height_in: 10.5, declared_weight_lbs: 9.2 }
              as: CarrierOps
              captures: { pb: $.data.id }
            - call: "POST /shipments/${pa}/deliver"
              payload: {}
              as: CarrierOps
            - call: "POST /shipments/${pb}/deliver"
              payload: {}
              as: CarrierOps
            - call: "POST /invoices"
              payload: { shipper_id: "${sh1}", period_start: "2026-08-01", period_end: "2026-08-31" }
              as: BillingOps
              captures: { inv: $.data.id }
            - call: "POST /invoices/${inv}/issue"
              payload: {}
              as: BillingOps
            - call: "GET /invoice-lines"
              payload: { invoice_id: "${inv}", shipment_id: "${pa}" }
              as: BillingOps
              captures: { line_a: "$.data[0].id" }
            - call: "GET /invoice-lines"
              payload: { invoice_id: "${inv}", shipment_id: "${pb}" }
              as: BillingOps
              captures: { line_b: "$.data[0].id" }
            - call: "POST /disputes"
              payload: { invoice_line_id: "${line_a}", claim_type: "ACCESSORIAL", claimed_reason: "Address is a commercial dock, not a residence", disputed_codes: ["RESIDENTIAL"] }
              as: ShipperUser
              as_user_id: "${sh1}"
              captures: { dsp_a: $.data.id }
            - call: "POST /disputes/${dsp_a}/evidence"
              payload: { item_type: "ADDRESS_PROOF", reference: "doc://lease-agreement-A" }
              as: ShipperUser
              as_user_id: "${sh1}"
            - call: "POST /disputes"
              payload: { invoice_line_id: "${line_b}", claim_type: "WEIGHT", claimed_reason: "We believe the dim weight is overstated" }
              as: ShipperUser
              as_user_id: "${sh1}"
              captures: { dsp_b: $.data.id }
            - call: "POST /disputes/${dsp_b}/evidence"
              payload: { item_type: "SCALE_CERT", reference: "doc://scale-cert-B" }
              as: ShipperUser
              as_user_id: "${sh1}"
          trigger:
            - call: "POST /disputes/${dsp_a}/resolve"
              payload: { outcome: "UPHELD" }
              as: RevenueAuditor
              as_user_id: "auditor.kim"
            - call: "POST /disputes/${dsp_b}/resolve"
              payload: { outcome: "UPHELD" }
              as: RevenueAuditor
              as_user_id: "auditor.kim"
            - call: "GET /invoices/${inv}"
              payload: {}
              as: BillingOps
            - call: "GET /billing-adjustments"
              payload: { dispute_id: "${dsp_b}" }
              as: RevenueAuditor
          assert:
            - "Dispute.${dsp_a}.status == UPHELD and Dispute.${dsp_a}.granted_credit_cents == 540 (ACCESSORIAL_ONLY variant: exactly the named RESIDENTIAL charge)"
            - "Dispute.${dsp_b}.status == UPHELD and Dispute.${dsp_b}.granted_credit_cents == 0 (FULL_REPRICE variant on identical data: 7760 recomputed - 7760 billed, floored at 0)"
            - "GET /billing-adjustments with dispute_id == ${dsp_a} returns exactly 1 row with reason == DISPUTE_CREDIT, delta_cents == -540, status == APPLIED and created_by_user_id == 'system'"
            - "GET /billing-adjustments with dispute_id == ${dsp_b} returns 0 rows — a computed credit of 0 is a legal UPHELD outcome that books no adjustment"
            - "InvoiceLine.${line_a}.adjustment_total_cents == -540 and InvoiceLine.${line_a}.line_total_cents == 7220"
            - "InvoiceLine.${line_b}.adjustment_total_cents == 0 and InvoiceLine.${line_b}.line_total_cents == 7760"
            - "the AccessorialCharge with code RESIDENTIAL on shipment ${pa} has status == WAIVED while the one on shipment ${pb} is still ASSESSED"
            - "Invoice.${inv}.status == ADJUSTED, adjustment_total_cents == -540 and net_amount_cents == 14980"
            - "ShipperAccount.${sh1}.credit_balance_cents == 540 and open_charges_cents == 14980"
  - rule_id: combinatorial_formula
    instances:
      - name: transportation_charge_zone_break_floor_and_window_mode_a
        grounds:
          - calculations.transportation_charge
          - entities.RateContract.fields.min_charge_cents
          - entities.SurchargeWindow.fields.per_package_cents
          - entities.InvoiceLine.fields.transportation_base_cents
          - state_machines.SurchargeWindow.SCHEDULED_to_ACTIVE
        distinguishing_aspect: |
          Mode (a) — many independent factors compose into one number: destination zone (2)
          selects the rate row, the billable pound count (2 lb) selects the weight break
          (380 cents/lb), the contract minimum charge floor (1195) overrides the 760-cent
          uncapped product, and an ACTIVE EXPRESS-scoped DEMAND window adds 150 cents that
          the floor must NOT absorb. This instance's difficulty is factor breadth, unlike the
          mode (b) instance whose difficulty is operation ORDER and the mode (c) instance
          whose difficulty is which intermediate the tier lookup READS.
        test_recipe:
          setup:
            - "SH-1001 ACTIVE, ACTIVE contract C1 with dim_divisor 139, min_charge_cents 1195 and zone-2 rows 1-20 @ 380, 21-70 @ 340, 71-9999 @ 305."
            - "ServiceLevel EXPRESS (24 h, guaranteed); ACTIVE DEMAND SurchargeWindow DEM-AUG scoped to EXPRESS over [2026-08-01, 2026-09-01) with per_package_cents 150 and oversize_add_cents 0."
            - "Shipment P5 declared 6 x 6 x 4 in at 0.4 lb, zone 2, non-residential, delivery_area_class NONE: cube 144, dim weight 2 lb, actual billable 1 lb, billable 2 lb basis DIMENSIONAL, no accessorials."
            - "P5 is DELIVERED; the logical clock is at its 2026-08-01T00:00:00Z default so pickup_date == 2026-08-01."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-1001", name: "Northwind Freight" }
              as: CarrierAdmin
              captures: { sh1: $.data.id, sh1_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express 24", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl_exp: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh1}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}, {min_transportation_subtotal_cents: 250000, discount_bps: 1250}]
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh1_v}" }
              as: CarrierAdmin
            - call: "POST /surcharge-windows"
              payload: { code: "DEM-AUG", kind: "DEMAND", service_level_id: "${sl_exp}", start_date: "2026-08-01", end_date: "2026-09-01", per_package_cents: 150, oversize_add_cents: 0 }
              as: CarrierAdmin
              captures: { win_dem: $.data.id }
            - call: "POST /surcharge-windows/${win_dem}/activate"
              payload: {}
              as: CarrierAdmin
            - call: "POST /shipments"
              payload: { shipper_id: "${sh1}", service_level_id: "${sl_exp}", tracking_number: "1Z-P5-0005", zone: 2, residential_declared: false, declared_length_in: 6, declared_width_in: 6, declared_height_in: 4, declared_weight_lbs: 0.4 }
              as: CarrierOps
              captures: { p5: $.data.id }
            - call: "POST /shipments/${p5}/deliver"
              payload: {}
              as: CarrierOps
          trigger:
            - call: "POST /invoices"
              payload: { shipper_id: "${sh1}", period_start: "2026-08-01", period_end: "2026-08-31" }
              as: BillingOps
              captures: { inv5: $.data.id }
            - call: "GET /invoice-lines"
              payload: { invoice_id: "${inv5}", shipment_id: "${p5}" }
              as: BillingOps
              captures: { line5: "$.data[0].id" }
          assert:
            - "InvoiceLine.${line5}.billable_weight_lbs == 2 and billable_weight_basis == DIMENSIONAL"
            - "InvoiceLine.${line5}.rate_cents_per_lb == 380 (zone 2 x the 1-20 lb break)"
            - "InvoiceLine.${line5}.transportation_base_cents == 1195 — the floor replaced the 2 x 380 = 760 uncapped product"
            - "InvoiceLine.${line5}.surcharge_cents == 150"
            - "InvoiceLine.${line5}.accessorial_total_cents == 0"
            - "InvoiceLine.${line5}.base_line_total_cents == 1345 — the minimum charge floors the transportation charge ALONE, so the surcharge is added on top and the line is not 1195"
            - "Invoice.${inv5}.transportation_subtotal_cents == 1345, accessorial_subtotal_cents == 0, gross_charges_cents == 1345"
            - "Invoice.${inv5}.tier_discount_bps == 0 and tier_discount_cents == 0 (1345 clears no tier row)"
            - "Invoice.${inv5}.net_amount_cents == 1345"
      - name: dim_weight_rounds_each_dimension_before_multiplying_mode_b
        grounds:
          - calculations.billable_weight
          - entities.Shipment.fields.declared_cube_in3
          - entities.Shipment.fields.preliminary_dim_weight_lbs
          - calculations.transportation_charge
        distinguishing_aspect: |
          Mode (b) — the SAME factors in a different ORDER give a different answer: rounding
          each dimension half-up first (18 x 13 x 11 = 2574, ceil(2574/139) = 19 lb) versus
          multiplying the raw decimals first (2434.32, ceil(2434.32/139) = 18 lb) differ by a
          whole pound and 380 cents of transportation charge. No extra factor is introduced
          relative to the mode (a) instance; only the sequence of round and multiply changes.
        test_recipe:
          setup:
            - "SH-1001 ACTIVE, ACTIVE contract C1 with dim_divisor 139, min_charge_cents 1195, zone-2 rows 380/340/305 and RESIDENTIAL override 540."
            - "ServiceLevel EXPRESS (24 h, guaranteed); no SurchargeWindow exists at all."
            - "The logical clock is at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-1001", name: "Northwind Freight" }
              as: CarrierAdmin
              captures: { sh1: $.data.id, sh1_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express 24", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl_exp: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh1}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}, {min_transportation_subtotal_cents: 250000, discount_bps: 1250}]
                accessorial_rate_overrides: { RESIDENTIAL: 540 }
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh1_v}" }
              as: CarrierAdmin
          trigger:
            - call: "POST /shipments"
              payload: { shipper_id: "${sh1}", service_level_id: "${sl_exp}", tracking_number: "1Z-ROUND-1", zone: 2, residential_declared: true, declared_length_in: 18.4, declared_width_in: 12.6, declared_height_in: 10.5, declared_weight_lbs: 9.2 }
              as: CarrierOps
              captures: { p1: $.data.id }
            - call: "GET /shipments/${p1}/billing-preview"
              payload: {}
              as: BillingOps
          assert:
            - "Shipment.${p1}.declared_cube_in3 == 2574 — each dimension rounds half-up first (18, 13, 11), never the product (2434.32 would round to 2434)"
            - "Shipment.${p1}.divisor_used == 139"
            - "Shipment.${p1}.preliminary_dim_weight_lbs == 19, NOT the 18 that multiplying the raw decimals before dividing would produce"
            - "Shipment.${p1}.preliminary_billable_weight_lbs == 19 and preliminary_basis == DIMENSIONAL (actual billable is ceil(9.2) == 10)"
            - "Shipment.${p1}.billable_weight_lbs == 19"
            - "GET /shipments/${p1}/billing-preview returns rate_cents_per_lb == 380 and transportation_base_cents == 7220, NOT the 6840 the 18 lb mis-ordering yields"
            - "GET /shipments/${p1}/billing-preview returns accessorial_total_cents == 540 (contract override, not the 590 carrier default) and line_total_cents == 7760"
      - name: invoice_tier_reads_pre_discount_transportation_subtotal_mode_c
        grounds:
          - calculations.invoice_totals
          - entities.Invoice.fields.tier_discount_bps
          - entities.Invoice.fields.tier_discount_cents
          - entities.Invoice.fields.net_amount_cents
          - state_machines.Invoice.ISSUED_to_ADJUSTED
        distinguishing_aspect: |
          Mode (c) — the difficulty is WHICH intermediate each step may read and when it is
          frozen: the tier row is selected from the pre-discount transportation subtotal
          (129770 -> 550 bps) and never from gross_charges_cents (142810) or from the
          post-adjustment total (272810, which would select 1250 bps), and the discount is
          computed once on the summed subtotal. A +130000 debit therefore moves net_amount
          without moving tier_discount_cents. Neither the mode (a) factor breadth nor the
          mode (b) round-then-multiply ordering is what this instance probes.
        test_recipe:
          setup:
            - "SH-1001 ACTIVE, ACTIVE contract C1 with dim_divisor 139, min_charge_cents 1195, zone-2 rows 380/340/305, zone-5 rows 520/470/425, tier table 50000 -> 550 bps and 250000 -> 1250 bps, RESIDENTIAL override 540."
            - "ServiceLevel EXPRESS (24 h, guaranteed) and GROUND (120 h, not guaranteed); ACTIVE DEMAND window DEM-AUG scoped to EXPRESS over [2026-08-01, 2026-09-01) with per_package_cents 150."
            - "Shipment P1: 18.4 x 12.6 x 10.5 in, 9.2 lb, zone 2, EXPRESS, residential -> transportation 7220 + surcharge 150 + RESIDENTIAL 540 = 7910."
            - "Shipment P2: 100 x 20 x 20 in, 60 lb, zone 5, GROUND, non-residential -> oversize (longest 100 > 96, length+girth 180 > 130), billable 288 lb, transportation 122400 + surcharge 0 + OVERSIZE 12500 = 134900."
            - "Both DELIVERED and billed on invoice INV1, which is ISSUED with transportation_subtotal 129770, accessorial_subtotal 13040, gross 142810, tier 550 bps, discount 7137, net 135673."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-1001", name: "Northwind Freight" }
              as: CarrierAdmin
              captures: { sh1: $.data.id, sh1_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express 24", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl_exp: $.data.id }
            - call: "POST /service-levels"
              payload: { code: "GROUND", name: "Ground", guarantee_hours: 120, guaranteed: false }
              as: CarrierAdmin
              captures: { sl_gnd: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh1}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
