  # =========================================================================
  # 5. Endpoints
  # =========================================================================
  - section: endpoints
    instances:
      - name: patch_string_key_edits_context_and_tm_until_the_lock_freezes_it
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /string-keys/{string_key_id}]
          - state_machines.Title[PLANNING -> STRINGS_LOCKED].preconditions
          - errors[ERR_STRING_KEY_LOCKED]
        distinguishing_aspect: "The only update endpoint in the API is a partial PATCH with three optional fields, and its window closes at the lock: before the lock a LEGAL key with no context_note even blocks lock-strings, and after the lock the same PATCH is a 409. The patched tm_match_pct must then be the one the scope estimate reads (0.20 units, not the 1.50 the original tm 40 would have produced)."
        test_recipe:
          setup:
            - "Title NOVA-68 with a single 100-character LEGAL key at tm_match_pct 40 and no context_note."
          setup_api_calls:
            - call: "POST /titles"
              payload: { title_code: "NOVA-68", name: "Nova Drift 68", source_language: "EN", target_release_utc: "2026-12-01T00:00:00Z", release_mode: "STAGGERED" }
              as: LocalizationProducer
              captures: { title_id: "$.data.id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_id}", key_name: "legal.eula", source_text: "End User Licence Agreement", source_char_count: 100, ui_surface: "LEGAL", display_char_limit: 400, tm_match_pct: 40 }
              as: LocalizationProducer
              captures: { key_id: "$.data.id", note_at_create: "$.data.context_note" }
            - call: "POST /market-plans"
              payload: { title_id: "${title_id}", market_code: "JP", rating_board: "CERO", target_rating: "TEEN_12", scope_tier: "TEXT_ONLY", cultural_adaptation_required: false, budget_cap_cents: 5000000, required_voice_line_count: 0 }
              as: LocalizationProducer
              captures: { mp_jp: "$.data.id" }
          trigger:
            - call: "POST /titles/${title_id}/lock-strings"
              payload: {}
              as: LocalizationProducer
              captures: { early_lock_error: "$.data.error_id" }
            - call: "PATCH /string-keys/${key_id}"
              payload: { context_note: "Statutory licence footer; keep the clause order intact for counsel review." }
              as: LocalizationProducer
              captures: { patched_note: "$.data.context_note", key_v: "$.data.version" }
            - call: "PATCH /string-keys/${key_id}"
              payload: { tm_match_pct: 96 }
              as: LocalizationProducer
              captures: { patched_tm: "$.data.tm_match_pct" }
            - call: "POST /titles/${title_id}/lock-strings"
              payload: {}
              as: LocalizationProducer
              captures: { lock_state: "$.data.localization_state" }
            - call: "PATCH /string-keys/${key_id}"
              payload: { context_note: "late edit after the lock" }
              as: LocalizationProducer
              captures: { locked_error: "$.data.error_id" }
            - call: "POST /market-plans/${mp_jp}/scope"
              payload: {}
              as: LocalizationProducer
              captures: { units: "$.data.text_effort_units", cost: "$.data.localization_cost_cents" }
          assert:
            - "the first lock-strings returns HTTP 409 ERR_PREREQUISITE_STATE_NOT_MET: an EXTRACTED LEGAL key with a null context_note is not lockable"
            - "the first PATCH sets context_note and leaves tm_match_pct at 40; the second PATCH sets tm_match_pct to 96 and leaves the context_note in place - partial semantics, absent keys are untouched"
            - "each successful PATCH increments StringKey.version by 1 and the key stays in status EXTRACTED"
            - "the second lock-strings succeeds: Title.localization_state == STRINGS_LOCKED and StringKey.${key_id}.status == LOCKED"
            - "the post-lock PATCH returns HTTP 409 with error_id == ERR_STRING_KEY_LOCKED and the context_note still holds the pre-lock text"
            - "scope computes text_effort_units == 0.20 (1.00 x TM 0.10 x LEGAL 1.50 = 0.15, rounded half-up per key) and localization_cost_cents == 840 - had the tm PATCH been dropped it would have been 1.50 units and 6300 cents"

