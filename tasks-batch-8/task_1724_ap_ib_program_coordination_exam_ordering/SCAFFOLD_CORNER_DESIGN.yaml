              captures: { co: $.data.id }
            - call: "POST /teachers"
              payload: { full_name: "T One", email: "t1@x.edu" }
              as: ApCoordinator
              captures: { t1: $.data.id }
            - call: "POST /teachers"
              payload: { full_name: "T Two", email: "t2@x.edu" }
              as: ApCoordinator
              captures: { t2: $.data.id }
            - call: "POST /teacher-authorizations"
              payload: { teacher_id: "${t1}", course_id: "${co}" }
              as: ApCoordinator
              captures: { ta1: $.data.id }
          trigger:
            - call: "POST /teacher-authorizations/${ta1}/complete-training"
              as: Teacher
              as_user_id: "${t2}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 and error_id == ERR_FORBIDDEN (record.teacher_id ${t1} != caller ${t2})"
            - "TeacherAuthorization.${ta1}.status remains PENDING_TRAINING"

      - name: teacher_cannot_file_irregularity_without_assignment
        claim_type: rbac_ownership_denial
