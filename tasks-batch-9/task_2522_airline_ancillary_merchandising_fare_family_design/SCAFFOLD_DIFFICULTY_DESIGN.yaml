          assert:
            - "FareFamily.${f_bundle_id}.status == PUBLISHED"
            - "FareFamily.${f_bundle_id}.revision_no == 2, not 1"
            - "FareFamily.${f_bundle_id}.reviewer_user_id == \"pa-001\" and review_note == \"second pass approved\""
            - "FareFamily.${f_bundle_id}.fee_fingerprint == \"ECO_BUNDLE|2|BAG_CHECKED_1:INCLUDED:1:3500;PRIORITY_BOARDING:INCLUDED:1:1250;SEAT_STANDARD:INCLUDED:1:1900;WIFI_FULL_FLIGHT:INCLUDED:1:750\""
            - "the fingerprint captured at the FIRST submit ended in \"ECO_BUNDLE|1|...\" and differs byte-for-byte from the final one, though the attribute set never changed"
            - "FareFamily.${f_bundle_id}.unbundled_value_cents == 7400, a_la_carte_total_cents == 19400, bundle_discount_bp == 2268 and included_attribute_count == 4: the loop left the valuation untouched"

      - name: flight_parallel_phase_and_irops_dimensions
        grounds:
          - state_machines.Flight.sales_phase
          - state_machines.Flight.irops_state
          - entities.Flight.fields.active_waiver_count
          - state_machines.IropsWaiver.waiver_state
        cycle_or_branch: |
          Flight carries TWO independent state dimensions that advance on unrelated triggers.
          The flight walks PRESALE -> CHECKIN_OPEN -> BOARDING on sales_phase while it
          simultaneously walks NORMAL -> IRREGULAR -> RECOVERED on irops_state, ending in the
          combined state BOARDING x RECOVERED - a pair no single linear machine can express.
          The rescission that returns irops_state to RECOVERED must NOT rewind sales_phase, and
          the two phase advances must not clear the ACTIVE waiver.
        test_recipe:
          setup:
            - "clock at 2026-08-10T09:00:00Z; flight AA600 is created in PRESALE x NORMAL"
            - "an OperationsController declares one DELAY waiver of 240 minutes scoped to BOARDING, driving irops_state to IRREGULAR"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: OperationsController
              as_user_id: "oc-001"
            - call: "POST /flights"
              payload: { flight_no: "AA600", origin: "JFK", destination: "LAX", scheduled_departure_utc: "2026-09-15T14:00:00Z", cabin_seat_total: 180 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { fl_id: $.data.id }
            - call: "POST /flights/${fl_id}/irops-waivers"
              payload: { event_type: "DELAY", delay_minutes: 240, waiver_scope: ["BOARDING"] }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { w_id: $.data.id }
            - call: "POST /flights/${fl_id}/phase-advance"
              payload: { target_phase: "CHECKIN_OPEN" }
              as: OperationsController
              as_user_id: "oc-001"
            - call: "POST /flights/${fl_id}/phase-advance"
              payload: { target_phase: "BOARDING" }
              as: OperationsController
              as_user_id: "oc-001"
          trigger:
            - call: "POST /irops-waivers/${w_id}/rescind"
              payload: { rescind_reason: "aircraft swap completed, operation recovered" }
              as: OperationsController
              as_user_id: "oc-001"
          assert:
            - "Flight.${fl_id}.sales_phase == BOARDING: the rescission did not rewind the sales dimension"
            - "Flight.${fl_id}.irops_state == RECOVERED, not NORMAL"
            - "Flight.${fl_id}.active_waiver_count == 0"
            - "IropsWaiver.${w_id}.waiver_state == RESCINDED and rescind_reason == \"aircraft swap completed, operation recovered\""
            - "while sales_phase was CHECKIN_OPEN and then BOARDING the waiver stayed ACTIVE and active_waiver_count stayed 1: the two phase advances never touched the irops dimension"

      - name: booking_change_cycle_confirm_then_abandon
        grounds:
          - state_machines.Booking.booking_status
          - state_machines.Booking.booking_status.TICKETED_to_CHANGE_PENDING
          - state_machines.Booking.booking_status.CHANGE_PENDING_to_TICKETED
          - entities.Booking.fields.change_count
          - entities.Booking.fields.pending_change_fee_cents
          - calculations.channel_settlement_total
        cycle_or_branch: |
          TICKETED -> CHANGE_PENDING -> TICKETED traversed TWICE with two different resolutions
          out of the same from-state. The first settle CONFIRM posts a 7500 CHANGE SALE and
          lifts change_count to 1; the second settle ABANDON returns to the identical
          booking_status while posting nothing and leaving change_count at 1. The state label
