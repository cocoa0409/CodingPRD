            - call: "POST /reconciliation-claims"
              payload: { keg_id: "${k1_id}", misdelivered_to_brewer_id: "${b2_id}", claimed_offset_cents: 1200, evidence_scanned_at: "2026-08-05T00:00:00Z" }
              as: Distributor
              as_user_id: "${d1_id}"
              captures: { rc1_id: "$.data.id", rc1_v1: "$.data.version" }
            - call: "POST /reconciliation-claims/${rc1_id}/respond"
              payload: { response: "COUNTER", expected_claim_version: "${rc1_v1}", counter_offset_cents: 600 }
              as: Brewer
              as_user_id: "${b1_id}"
          trigger:
            - call: "POST /reconciliation-claims/${rc1_id}/respond"
              payload: { response: "AGREE", expected_claim_version: "${rc1_v1}" }
              as: Distributor
              as_user_id: "${d1_id}"
              captures: { e_stale: "$.data.error_id" }
            - call: "GET /reconciliation-claims/${rc1_id}"
              payload: {}
              as: Distributor
              as_user_id: "${d1_id}"
              captures: { rc1_v2: "$.data.version" }
            - call: "POST /reconciliation-claims/${rc1_id}/respond"
              payload: { response: "AGREE", expected_claim_version: "${rc1_v2}" }
              as: Distributor
              as_user_id: "${d1_id}"
          assert:
            - "the first AGREE returns HTTP 412 with error_id == ERR_STALE_CLAIM_VERSION"
            - "it is NOT 409 ERR_RESPONDER_OUT_OF_TURN: last_responder_role is Brewer, so the Distributor really is in turn, and priority 9 is evaluated before priority 19"
            - "after the refusal ReconciliationClaim.${rc1_id}.status == COUNTERED, round_count == 1, counter_offset_cents == 600, agreed_offset_cents == null and version == ${rc1_v2}"
            - "the replayed AGREE returns HTTP 200 with status == AGREED, agreed_offset_cents == 600 (the outstanding counter, not the 1200 originally claimed) and closed_at == 2026-08-10T23:00:00Z"
            - "a RECONCILIATION_OFFSET accrual exists for ${d1_id} with incentive_cents == 600, dwell_days == 0, tier_pct_bp == null and cooperation_multiplier_bp == null"
            - "Distributor.${d1_id}.incentive_accrual_cents == 600 while total_returns_count == 0, on_time_return_pct == 0.00 and cooperation_tier == BRONZE — an agreed claim pays without moving the cooperation history"
            - "Keg.${k1_id}.misdelivery_open == false after the AGREE"

      - name: suspended_distributor_cannot_record_a_return_scan
        claim_type: triggerable
        grounds:
          - errors.ERR_DISTRIBUTOR_SUSPENDED
          - validations[priority=17]
          - endpoints[POST /distributors/{distributor_id}/cooperation-agreement]
        distinguishing_aspect: "The cooperation-agreement write is the only door to Distributor.status, and priority 17 gates the party rather than the keg: the RETURN scan is legal for a keg IN_TRADE (priority 18 passes) and the actor is a known Distributor (priority 3 passes), yet it is refused 409. Re-activating the same distributor and replaying the identical scan then mints the accrual, so nothing about the keg was ever wrong."
