          assert:
            - "${occ_avail} == 500 (AVAILABLE counted)"
            - "${occ_quar} == 500 (QUARANTINED still counted)"
            - "${occ_depl} == 0 (DEPLETED excluded after full load-out); InventoryLot.${lot_id}.status == DEPLETED"

