          One second decides two things at once: at t == 120 the compression is compliant and the
          index is the honest weighted 63.9, while at t == 121 the same weighted 63.9 is replaced by
          the LATE_COMPRESSION_CAP of 50.0. The capped value lands exactly ON the
          SENTINEL_INDEX_FLOOR, and because that floor is a strict `<` comparison, a COACHING_ONLY
          sign-off is still legal at 50.0 — an off-by-one in either comparison flips the result.
