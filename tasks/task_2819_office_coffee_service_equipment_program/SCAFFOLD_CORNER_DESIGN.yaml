      - name: corner_evaluate_service_posture_recomputes_the_score_and_only_bumps_version_on_a_real_flip
        claim_type: computed_read
        grounds:
          - endpoints[POST /ocs/sites/{site_id}/evaluate-service-posture]
          - calculations.site_escalation_score
          - state_machines.Site.service_posture
        distinguishing_aspect: "The recompute endpoint is called three times over the same site with an unchanged input set except the passage of time: at 27.5 it is a no-op, once a descale falls overdue the score becomes 42.5 and the site escalates with a version bump, and an immediately repeated call re-derives the identical 42.5 and must NOT bump version again. The account holds at ACTIVE because one escalated site is below AT_RISK_SITE_THRESHOLD 2."
        test_recipe:
          setup:
            - "clock at 2026-08-03T08:00:00Z; MON route; two products (COFFEE and CREAMER); model URN-30 with descale_interval_days 90; one PLACEMENT asset"
            - "one account with one planned site (headcount 40 / 5 days / DRIP -> COFFEE par 65 reorder 26, CREAMER par 360 reorder 144) and one ACTIVE RENTAL placement created 2026-08-03"
            - "visit A on 2026-08-03T09:00:00Z delivers COFFEE 20 and CREAMER 10 in full, leaving both rows LOW"
            - "visit B on 2026-08-10T09:00:00Z requests COFFEE 20 and CREAMER 10 but delivers only the COFFEE, so the CREAMER row is consumed to zero and becomes STOCKOUT"
