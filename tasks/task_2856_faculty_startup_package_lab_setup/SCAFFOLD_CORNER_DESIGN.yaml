            - "LabSpace.${e5_space}.status is still AVAILABLE and version is now 2 - the room state machine only moves to ASSIGNED on /space-assignments/{id}/activate"
            - "the window contains the clock (effective_from == 2026-08-01T00:00:00Z == clock, and the window is half-open [from, to)), which is why the share counts now rather than later"
