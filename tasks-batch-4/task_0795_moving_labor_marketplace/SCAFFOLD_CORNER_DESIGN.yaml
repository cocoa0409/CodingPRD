      - name: cancellation_free_early_window
        claim_type: correct_result
        grounds: [calculations.cancellation_fee, entities.Job.fields.cancellation_fee_cents]
        distinguishing_aspect: "Cancelling the same BOOKED job while the clock is 2026-03-01 (>= 24h before the 2026-03-10 window) charges cancellation_fee_cents = 0; the >= boundary is inclusive/free."
        test_recipe:
          setup: ["A BOOKED Job with window_start 2026-03-10T09:00Z; the clock remains at the default 2026-03-01T00:00Z (well beyond 24h)."]
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { name: "RC-MOVE", job_type: "MOVE", base_hourly_rate_cents: 6000, min_billable_hours: 2.0, crew_surcharge_pct: 0.10, peak_surge_multiplier: 1.25, truck_fee_cents: 8000 }, as: Admin, captures: { rc: "$.data.id" } }
            - { call: "POST /insurance-policies", payload: { name: "IP-BASIC", tier: "BASIC", coverage_cap_cents: 200000, deductible_cents: 10000, coverage_pct: 1.0 }, as: Admin, captures: { pol: "$.data.id" } }
            - { call: "POST /customers", payload: { display_name: "Cust", email: "c@x.com" }, as: Admin, captures: { cust: "$.data.id" } }
            - { call: "POST /jobs", payload: { rate_card_id: "${rc}", insurance_policy_id: "${pol}", job_type: "MOVE", crew_size: 1, estimated_hours: 3.0, window_start: "2026-03-10T09:00:00Z", window_end: "2026-03-10T12:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { job: "$.data.id" } }
            - { call: "POST /jobs/${job}/quote", payload: {}, as: Customer, as_user_id: "${cust}", captures: { q: "$.data.id" } }
            - { call: "GET /jobs/${job}", payload: {}, as: Customer, as_user_id: "${cust}", captures: { jv: "$.data.version" } }
            - { call: "POST /jobs/${job}/book", payload: { quote_id: "${q}", expected_job_version: "${jv}" }, as: Customer, as_user_id: "${cust}" }
          trigger:
            - { call: "POST /jobs/${job}/cancel", payload: {}, as: Customer, as_user_id: "${cust}" }
          assert:
            - "Job.${job}.status == CANCELLED"
            - "Job.${job}.cancellation_fee_cents == 0"

  - section: errors
    instances:
      - name: quote_expired_on_book
        claim_type: violation_to_error
        grounds: ['validations[priority=7]', 'errors[ERR_QUOTE_EXPIRED]', entities.Quote.fields.expires_at]
        distinguishing_aspect: "Advancing the clock past the quote's expires_at (created 2026-03-01 + 48h) before booking returns ERR_QUOTE_EXPIRED (409)."
        test_recipe:
          setup: ["A Job quoted at the default clock (quote expires 2026-03-03); clock advanced to 2026-03-05 before booking."]
          setup_api_calls:
