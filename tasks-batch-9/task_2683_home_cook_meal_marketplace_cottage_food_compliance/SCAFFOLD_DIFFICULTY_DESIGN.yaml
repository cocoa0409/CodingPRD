  - rule_id: compensating_invariant
    instances:
      - name: capacity_units_conserved_place_then_cancel
        grounds:
          - compensating_invariants.capacity-units-conserved
          - calculations.effective_production_capacity
          - state_machines.Order.PLACED_to_CANCELLED
          - entities.ProductionWindow.fields.committed_meals
        distinguishing_aspect: |
          The conserved quantity is committed_meals, but the spoilage reserve is DERIVED from it,
          so a naive cancel that only decrements committed_meals leaves residue in
          spoilage_reserve_meals and effective_capacity_meals. Placing quantity 4 on a capacity-10
          window moves the triple from (0, 0, 10) to (4, 1, 9); cancelling must restore exactly
          (0, 0, 10), and the proof is that the byte-identical order can be placed again and
          returns 201 rather than a capacity rejection.
        test_recipe:
          setup:
            - "StatePolicy CA exists; Cook Tomas is ACTIVE and CLEAR with weekly_capacity_meals 10."
            - "One APPROVED MenuItem at 1200 cents and one DOOR_DELIVERY zone."
            - "One OPEN ProductionWindow with capacity_meals 10 and no orders: committed_meals 0, spoilage_reserve_meals 0, effective_capacity_meals 10."
