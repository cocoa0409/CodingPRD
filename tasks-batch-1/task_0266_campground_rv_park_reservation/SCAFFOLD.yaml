# =============================================================================
# Campground & RV Park Reservation (private) — seed tables (v1)
# Difficulty band: Expert
# =============================================================================

scenario: "Campground & RV Park Reservation (private): site type (tent/RV/cabin) & hookup, nightly/weekly/monthly rate, reservation & site lock, length-of-stay limits, amenity add-on, seasonal/long-term, deposit/cancellation, check-in/out & quiet hours."

domain_name: campground-rv-park-reservation
api_prefix: "/"

# Structural DNA -------------------------------------------------------------
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities (Park, Site, Guest, Reservation, ...) linked by FK references;
  # URL paths are mostly two-segment collections, not deep nesting.

  state_machine_shape: parallel
  # Reservation carries two independent dimensions (reservation_status x
  # payment_status); Site is cyclic (ACTIVE<->MAINTENANCE) with a RETIRED branch.

  relationship_patterns:
    - one_to_many        # Park -> Site/Season/RatePlan/CancellationPolicy; Site -> Reservation/MaintenanceHold; Reservation -> AddOn/Payment
    - cross_aggregate    # Reservation references both Site and Guest across aggregate boundaries

  role_model: peer_roles
  # Operator owns Park/Site/Rate/Season config; Guest (entity_backed) owns its
  # own reservations, add-ons, and payments.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Park
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Park name" }
      - { name: timezone, type: string, source: input, description: "IANA timezone name, e.g. America/Denver", default: "America/Denver" }
      - { name: check_in_time, type: string, source: input, description: "Local check-in time HH:MM", default: "15:00" }
      - { name: check_out_time, type: string, source: input, description: "Local check-out time HH:MM", default: "11:00" }
      - { name: quiet_hours_start, type: string, source: input, description: "Local quiet-hours start HH:MM", default: "22:00" }
      - { name: quiet_hours_end, type: string, source: input, description: "Local quiet-hours end HH:MM", default: "07:00" }
      - { name: deposit_pct, type: number, source: input, description: "Fraction of total_due collected as deposit at confirm, 0..1", default: 0.30 }
      - { name: tax_rate, type: number, source: input, description: "Lodging tax rate applied to taxable base, 0..1", default: 0.08 }
      - { name: long_stay_nights_threshold, type: integer, source: input, description: "Stays with nights >= this are LONG_TERM (non-refundable deposit, monthly tier eligible)", default: 28 }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 on every mutation" }

  - name: RatePlan
    parent: Park
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: park_id, type: string, source: input, description: "FK -> Park.id" }
      - { name: site_type, type: enum, source: input, description: "Site type this plan prices", constraints: "TENT | RV | CABIN" }
      - { name: nightly_rate_cents, type: integer, source: input, description: "Per-night base rate in cents" }
      - { name: weekly_rate_cents, type: integer, source: input, description: "Flat rate for a 7-night block in cents" }
      - { name: monthly_rate_cents, type: integer, source: input, description: "Flat rate for a 28-night block in cents" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 on every mutation" }

  - name: Season
    parent: Park
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: park_id, type: string, source: input, description: "FK -> Park.id" }
      - { name: name, type: string, source: input, description: "Season label, e.g. PEAK_SUMMER" }
      - { name: start_date, type: string, source: input, description: "Inclusive first date YYYY-MM-DD covered by this season" }
      - { name: end_date, type: string, source: input, description: "Inclusive last date YYYY-MM-DD covered by this season" }
      - { name: surcharge_pct, type: number, source: input, description: "Per-night surcharge percent applied to nightly_rate_cents for dates in [start_date,end_date], e.g. 12.5" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 on every mutation" }

  - name: CancellationPolicy
    parent: Park
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: park_id, type: string, source: input, description: "FK -> Park.id" }
      - { name: full_refund_min_days, type: integer, source: input, description: "Cancel >= this many days before check-in -> 100% deposit refund" }
      - { name: half_refund_min_days, type: integer, source: input, description: "Cancel >= this many days (and < full_refund_min_days) -> 50% deposit refund; below this -> 0%" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 on every mutation" }

  - name: Site
    parent: Park
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: park_id, type: string, source: input, description: "FK -> Park.id" }
      - { name: rate_plan_id, type: string, source: input, description: "FK -> RatePlan.id; RatePlan.site_type MUST equal this Site.site_type" }
      - { name: label, type: string, source: input, description: "Human label, e.g. A-12" }
      - { name: site_type, type: enum, source: input, description: "TENT | RV | CABIN" }
      - { name: hookup_level, type: enum, source: input, description: "NONE | PARTIAL | FULL (water/electric/sewer)", constraints: "NONE | PARTIAL | FULL" }
      - { name: max_length_of_stay_nights, type: integer, source: input, description: "Hard cap on nights for any single reservation on this site" }
      - { name: turnover_buffer_days, type: integer, source: input, description: "Days of cleaning/turnover buffer a MaintenanceHold reserves on each side of its window", default: 1 }
      - { name: status, type: enum, source: system, description: "ACTIVE | MAINTENANCE | RETIRED", constraints: "ACTIVE | MAINTENANCE | RETIRED" }
      - { name: booked_night_count, type: integer, source: computed, description: "Sum of nights across this site's reservations whose reservation_status IN {REQUESTED, CONFIRMED, CHECKED_IN}" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 on every mutation; bumped when a reservation locks/releases this site and on maintenance changes" }

  - name: MaintenanceHold
    parent: Site
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: site_id, type: string, source: input, description: "FK -> Site.id" }
      - { name: start_date, type: string, source: input, description: "Inclusive first blocked date YYYY-MM-DD" }
      - { name: end_date, type: string, source: input, description: "Inclusive last blocked date YYYY-MM-DD" }
      - { name: reason, type: string, source: input, description: "Free-text maintenance reason" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CLEARED", constraints: "ACTIVE | CLEARED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 on every mutation" }

  - name: Guest
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only; equals X-User-ID when acting as Guest" }
      - { name: email, type: string, source: input, description: "Unique guest email" }
      - { name: full_name, type: string, source: input, description: "Guest full name" }
      - { name: completed_stays_count, type: integer, source: computed, description: "Count of this guest's reservations with reservation_status == CHECKED_OUT" }
      - { name: lifetime_spend_cents, type: integer, source: computed, description: "Sum of total_due_cents across this guest's CHECKED_OUT reservations (final, post-reconciliation)" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 on every mutation" }

  - name: Reservation
    parent: Site
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: site_id, type: string, source: input, description: "FK -> Site.id" }
      - { name: guest_id, type: string, source: input, description: "FK -> Guest.id" }
      - { name: check_in_date, type: string, source: input, description: "Arrival date YYYY-MM-DD (interval start, inclusive)" }
      - { name: check_out_date, type: string, source: input, description: "Departure date YYYY-MM-DD (interval end, exclusive); nights = check_out_date - check_in_date" }
      - { name: nights, type: integer, source: computed, description: "Whole nights between check_in_date (incl) and check_out_date (excl)" }
      - { name: actual_check_out_date, type: string, source: system, description: "Set at CHECKED_OUT to the date the guest actually departed; null before checkout" }
      - { name: stay_class, type: enum, source: computed, description: "SHORT_TERM | LONG_TERM (LONG_TERM when nights >= Park.long_stay_nights_threshold)", constraints: "SHORT_TERM | LONG_TERM" }
      - { name: reservation_status, type: enum, source: system, description: "Dimension 1", constraints: "REQUESTED | CONFIRMED | CHECKED_IN | CHECKED_OUT | CANCELLED" }
      - { name: payment_status, type: enum, source: system, description: "Dimension 2 (independent)", constraints: "UNPAID | DEPOSIT_PAID | PAID_IN_FULL | REFUNDED" }
      - { name: stay_charge_cents, type: integer, source: computed, description: "Tiered base charge (min of nightly/weekly/monthly decomposition) for the priced nights" }
      - { name: season_surcharge_cents, type: integer, source: computed, description: "Sum of per-night season surcharges over the priced nights" }
      - { name: addon_total_cents, type: integer, source: computed, description: "Sum of amount_cents across this reservation's AddOns with status == ACTIVE" }
      - { name: discount_cents, type: integer, source: computed, description: "Loyalty discount applied at confirm, computed from the acting guest's lifetime_spend tier" }
      - { name: tax_cents, type: integer, source: computed, description: "Lodging tax on the taxable base after discount" }
      - { name: total_due_cents, type: integer, source: computed, description: "Final amount owed; provisional before CHECKED_OUT, reconciled at CHECKED_OUT" }
      - { name: deposit_due_cents, type: integer, source: computed, description: "round_half_up(total_due_cents * Park.deposit_pct) frozen at confirm time" }
      - { name: amount_paid_cents, type: integer, source: computed, description: "Sum of Payment.amount_cents for types DEPOSIT,BALANCE minus REFUND payments on this reservation" }
      - { name: balance_cents, type: integer, source: computed, description: "total_due_cents - amount_paid_cents" }
      - { name: priced_nights, type: integer, source: system, description: "Nights used by the charge calc; equals nights until checkout, then equals actual nights stayed (floored at 1)" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits; tie-break key for overbooking/cascade ordering" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 on every mutation" }

  - name: AddOn
    parent: Reservation
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id" }
      - { name: kind, type: enum, source: input, description: "FIREWOOD | EXTRA_VEHICLE | PET_FEE | EARLY_CHECKIN", constraints: "FIREWOOD | EXTRA_VEHICLE | PET_FEE | EARLY_CHECKIN" }
      - { name: amount_cents, type: integer, source: input, description: "Charge for this add-on in cents" }
      - { name: taxable, type: boolean, source: input, description: "Whether this add-on is included in the taxable base", default: true }
      - { name: status, type: enum, source: system, description: "ACTIVE | REMOVED", constraints: "ACTIVE | REMOVED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 on every mutation" }

  - name: Payment
    parent: Reservation
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id" }
      - { name: type, type: enum, source: input, description: "DEPOSIT | BALANCE | REFUND (append-only ledger)", constraints: "DEPOSIT | BALANCE | REFUND" }
      - { name: amount_cents, type: integer, source: input, description: "Positive cents; DEPOSIT/BALANCE add to amount paid, REFUND subtracts" }
      - { name: reason, type: string, source: input, description: "Optional free-text reason (e.g. CANCELLATION_REFUND, SITE_RETIRED)", default: null }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits; chronological replay key for the ledger" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ----- Site lifecycle: cyclic ACTIVE<->MAINTENANCE + RETIRED branch ---------
  - entity: Site
    field: status
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: MAINTENANCE
        trigger: "POST /sites/{id}/maintenance"
        actor: Operator
        preconditions:
          - "Site.status == ACTIVE"
        side_effects:
          - "Site.version += 1"
        note: "Blocks new reservation locks and check-ins while MAINTENANCE."

      - from: MAINTENANCE
        to: ACTIVE
        trigger: "POST /sites/{id}/reactivate"
        actor: Operator
        preconditions:
          - "Site.status == MAINTENANCE"
        side_effects:
          - "Site.version += 1"

      - from: [ACTIVE, MAINTENANCE]
        to: RETIRED
        trigger: "POST /sites/{id}/retire"
        actor: Operator
        preconditions:
          - "Site.status IN {ACTIVE, MAINTENANCE}"
        side_effects:
          - "CASCADE L1: every Reservation on this site with reservation_status IN {REQUESTED, CONFIRMED, CHECKED_IN} -> CANCELLED (cascade ordering: Reservation.created_at ASC)"
          - "CASCADE L2: each such cancelled Reservation that had amount_paid_cents > 0 gets a REFUND Payment created for its full amount_paid_cents and its payment_status -> REFUNDED (reason=SITE_RETIRED)"
          - "CASCADE L3: each affected Guest's lifetime_spend_cents and completed_stays_count are recomputed (unchanged here since cancelled stays never counted, but the recompute fires)"
          - "Site.booked_night_count recomputed to 0; Site.version += 1"

  # ----- Reservation dimension 1: reservation_status (branching + revert) -----
  - entity: Reservation
    field: reservation_status
    initial_state: REQUESTED
    terminal_states: [CHECKED_OUT, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /reservations/{id}/confirm"
        actor: Guest
        preconditions:
          - "Reservation.reservation_status == REQUESTED"
          - "Reservation.payment_status IN {DEPOSIT_PAID, PAID_IN_FULL} (deposit already collected)"
          - "Site.status == ACTIVE (cross-entity: Reservation -> Site)"
          - "No date overlap with any other Reservation on the site whose reservation_status IN {REQUESTED, CONFIRMED, CHECKED_IN} (half-open [check_in, check_out))"
          - "No collision with any ACTIVE MaintenanceHold buffered window on the site"
        side_effects:
          - "Freeze Reservation.discount_cents from the acting Guest's lifetime_spend tier; recompute total_due_cents and deposit_due_cents"
          - "Site.version += 1"
          - "Reservation.version += 1"

      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /reservations/{id}/check-in"
        actor: Operator
        preconditions:
          - "Reservation.reservation_status == CONFIRMED"
          - "Reservation.payment_status IN {DEPOSIT_PAID, PAID_IN_FULL}"
          - "Site.status == ACTIVE (cross-entity: Reservation -> Site)"
          - "Current clock date >= check_in_date"
        side_effects:
          - "Reservation.version += 1"

      - from: CHECKED_IN
        to: CHECKED_OUT
        trigger: "POST /reservations/{id}/check-out"
        actor: Operator
        preconditions:
          - "Reservation.reservation_status == CHECKED_IN"
        side_effects:
          - "Set actual_check_out_date = min(check_out_date, current clock date), priced_nights = max(1, actual nights stayed)"
          - "CASCADE L1: reconcile total_due_cents using FINAL variant of stay_charge over priced_nights (early checkout reduces nights, floored at deposit_due_cents)"
          - "CASCADE L2: if balance_cents > 0 auto-record a BALANCE Payment for the remaining balance and set payment_status = PAID_IN_FULL"
          - "CASCADE L3: recompute the Guest's completed_stays_count (+1) and lifetime_spend_cents (+ final total_due_cents)"
          - "Site.booked_night_count recomputed; Site.version += 1; Reservation.version += 1"

      - from: [REQUESTED, CONFIRMED]
        to: CANCELLED
        trigger: "POST /reservations/{id}/cancel, or system (Site retired)"
        actor: "Guest or system"
        preconditions:
          - "Reservation.reservation_status IN {REQUESTED, CONFIRMED}"
        side_effects:
          - "COMPENSATION (booked nights): release locked nights — Site.booked_night_count drops by Reservation.nights; Site.version += 1"
          - "COMPENSATION (money): compute refund_cents via CancellationPolicy tier on days-before-check-in (LONG_TERM deposits are non-refundable); if refund_cents > 0 create a REFUND Payment and set payment_status = REFUNDED"
          - "Reservation.version += 1"

  # ----- Reservation dimension 2: payment_status (parallel, independent) ------
  - entity: Reservation
    field: payment_status
    initial_state: UNPAID
    terminal_states: [REFUNDED]
    transitions:
      - from: UNPAID
        to: DEPOSIT_PAID
        trigger: "POST /reservations/{id}/payments (type=DEPOSIT)"
        actor: Guest
        preconditions:
          - "Reservation.payment_status == UNPAID"
          - "Payment.amount_cents == Reservation.deposit_due_cents"
        side_effects:
          - "amount_paid_cents and balance_cents recomputed; Reservation.version += 1"

      - from: [DEPOSIT_PAID, UNPAID]
        to: PAID_IN_FULL
        trigger: "POST /reservations/{id}/payments (type=BALANCE) or system (checkout balance settle)"
        actor: "Guest or system"
        preconditions:
          - "After applying the payment, amount_paid_cents >= total_due_cents"
        side_effects:
          - "amount_paid_cents and balance_cents recomputed; Reservation.version += 1"

      - from: [DEPOSIT_PAID, PAID_IN_FULL]
        to: REFUNDED
        trigger: "system (reservation cancelled with refund, or site retired)"
        actor: system
        preconditions:
          - "A REFUND Payment was created by the cancellation/retirement compensation"
        side_effects:
          - "amount_paid_cents and balance_cents recomputed; Reservation.version += 1"

  # ----- MaintenanceHold lifecycle -------------------------------------------
  - entity: MaintenanceHold
    field: status
    initial_state: ACTIVE
    terminal_states: [CLEARED]
    transitions:
      - from: ACTIVE
        to: CLEARED
        trigger: "POST /maintenance-holds/{id}/clear"
        actor: Operator
        preconditions:
          - "MaintenanceHold.status == ACTIVE"
        side_effects:
          - "Stops blocking reservations on the site; Site.version += 1"

  # ----- AddOn lifecycle ------------------------------------------------------
  - entity: AddOn
    field: status
    initial_state: ACTIVE
    terminal_states: [REMOVED]
    transitions:
      - from: ACTIVE
        to: REMOVED
        trigger: "POST /add-ons/{id}/remove"
        actor: Guest
        preconditions:
          - "AddOn.status == ACTIVE"
          - "Parent Reservation.reservation_status != CHECKED_OUT"
        side_effects:
          - "Reservation.addon_total_cents, tax_cents, total_due_cents recomputed; Reservation.version += 1"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (true races only; OCC on parent.version)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: reservation-create-stale-site
    parent_entity: Site
    write_endpoint: "POST /sites/{id}/reservations"
    occ_field: "expected_site_version"
    description: |
      Creating a Reservation against a Site whose version has advanced since the
      client last observed it is rejected. A reservation legitimately locks nights
      on the site (bumping Site.version), and a maintenance change also bumps it;
      a creator whose view of the site is therefore stale is rejected on the
      stale-version check rather than silently double-locking the same window.
    error_id: ERR_STALE_SITE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: stay_charge
    trigger: "Reservation create (provisional), confirm (re-freeze), checkout (final reconciliation)"
    algorithm: tiered_pricing
    formula: |
      Inputs: N = priced_nights, R = RatePlan for the Site's site_type.
      cand_nightly = N * R.nightly_rate_cents
      cand_weekly  = (N // 7)  * R.weekly_rate_cents  + (N % 7)  * R.nightly_rate_cents
      cand_monthly = (N // 28) * R.monthly_rate_cents
                     + ((N % 28) // 7) * R.weekly_rate_cents
                     + ((N % 28) %  7) * R.nightly_rate_cents
      stay_charge_cents = min(cand_nightly, cand_weekly, cand_monthly)
    input_set: "priced_nights = nights while not CHECKED_OUT (provisional); = max(1, actual nights stayed) at CHECKED_OUT (final)"
    constants:
      WEEK_NIGHTS: 7
      MONTH_NIGHTS: 28
    precision: "integer cents; floor-division on whole nights; no rounding needed"
    variants:
      - name: provisional
        when: "Reservation not yet CHECKED_OUT — priced over the full requested nights (check_out_date - check_in_date)"
        difference: "Uses the requested night count; recomputed on confirm and on add-on/discount changes."
      - name: final
        when: "At CHECKED_OUT — priced over priced_nights = max(1, actual_check_out_date - check_in_date)"
        difference: "Early checkout lowers the night count and re-selects the cheapest tier; result is then floored at deposit_due_cents (deposit never refunded on early departure)."

  - name: season_surcharge
    trigger: "Reservation create, confirm, checkout (recomputed whenever stay_charge is)"
    algorithm: aggregation
    formula: |
      For each night date d in the priced window [check_in_date, check_in_date + priced_nights):
        if some Season S on the park has S.start_date <= d <= S.end_date:
          night_surcharge_d = round_half_up(R.nightly_rate_cents * (S.surcharge_pct / 100))
        else:
          night_surcharge_d = 0
      season_surcharge_cents = sum over d of night_surcharge_d
    input_set: "Only nights inside an at-most-one covering Season window contribute (Seasons may not overlap, see §1.4)."
    constants: {}
    precision: |
      ROUNDING ORDER IS PINNED: round each night's surcharge to whole cents
      (half-up) FIRST, THEN sum across nights. (Summing the raw products and
      rounding once at the end would yield a different cent total and is WRONG.)

  - name: reservation_total
    trigger: "Reservation create, confirm, checkout, add-on add/remove"
    algorithm: weighted_scoring
    formula: |
      EVALUATION ORDER IS PINNED (circular-looking discount/tax dependency):
      1. stay_charge_cents      (see stay_charge)
      2. season_surcharge_cents (see season_surcharge)
      3. addon_total_cents = sum(AddOn.amount_cents where status == ACTIVE)
      4. pre_discount_subtotal = stay_charge_cents + season_surcharge_cents + addon_total_cents
      5. discount_cents        (see loyalty_discount; keyed on guest tier, NOT on subtotal)
      6. discounted_subtotal = max(0, pre_discount_subtotal - discount_cents)
      7. taxable_base = stay_charge_cents + season_surcharge_cents
                        + sum(AddOn.amount_cents where status == ACTIVE and taxable == true)
                        - discount_cents      (discount reduces the taxable base; floored at 0)
      8. tax_cents = round_half_up(max(0, taxable_base) * Park.tax_rate)
      9. total_due_cents = discounted_subtotal + tax_cents
    input_set: "ACTIVE add-ons only; discount frozen at confirm; tax_rate from Park."
    constants: {}
    precision: "round_half_up to whole cents on the tax line only; all other lines are integer cents."

  - name: loyalty_discount
    trigger: "Reservation confirm (frozen onto Reservation.discount_cents)"
    algorithm: threshold
    formula: |
      Applied (lifetime_tier) variant — keyed on the acting Guest.lifetime_spend_cents:
        lifetime_spend_cents >= 500000 -> discount_pct = 10
        lifetime_spend_cents >= 200000 -> discount_pct = 5
        otherwise                       -> discount_pct = 0
      discount_cents = round_half_up(pre_discount_subtotal * discount_pct / 100)
    input_set: "Guest.lifetime_spend_cents as of confirm time (sum over the guest's CHECKED_OUT reservations)."
    constants:
      TIER_GOLD_CENTS: 500000
      TIER_SILVER_CENTS: 200000
      GOLD_PCT: 10
      SILVER_PCT: 5
    precision: "round_half_up to whole cents"
    variants:
      - name: lifetime_tier
        when: "APPLIED — discount tier from cumulative lifetime_spend_cents over all CHECKED_OUT stays"
        difference: "Uses all-time spend; a guest who spent heavily years ago stays GOLD."
      - name: trailing_12mo
        when: "Alternative interpretation (NOT applied) — tier from spend over CHECKED_OUT reservations with actual_check_out_date within 12 months of the current clock"
        difference: "Excludes old spend; the same guest can drop to a lower tier, producing a different discount_cents for identical data. The system uses lifetime_tier."

  - name: cancellation_refund
    trigger: "Reservation cancel (COMPENSATION money leg)"
    algorithm: threshold
    formula: |
      days_before = (check_in_date - current_clock_date) in whole days
      If Reservation.stay_class == LONG_TERM:
        refund_cents = 0                       # long-term deposits are non-refundable
      else:
        if days_before >= CancellationPolicy.full_refund_min_days:
          refund_cents = amount_paid_cents              # 100%
        elif days_before >= CancellationPolicy.half_refund_min_days:
          refund_cents = round_half_up(amount_paid_cents * 0.50)   # 50%
        else:
          refund_cents = 0                                # 0%
    input_set: "amount_paid_cents = DEPOSIT+BALANCE minus prior REFUND; current_clock_date from the clock."
    constants:
      HALF_PCT: 0.50
    precision: "round_half_up to whole cents; boundary uses >= on days_before"

  - name: site_booked_nights
    trigger: "Reservation create, confirm, cancel, checkout; Site retire/maintenance"
    algorithm: aggregation
    formula: |
      Site.booked_night_count = sum(Reservation.nights for reservations on the site
        whose reservation_status IN {REQUESTED, CONFIRMED, CHECKED_IN})
    input_set: "Excludes CANCELLED and CHECKED_OUT reservations."
    constants: {}
    precision: "integer; never negative"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7; Guest acting on a reservation/add-on/payment must own it (X-User-ID == Reservation.guest_id)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path/body referenced resource exists, validated left-to-right (park, then site/rate_plan, then reservation, then add-on/payment)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, dates parse, check_out_date > check_in_date, amounts non-negative"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all writes

  - priority: 5
    category: state
    check: "OCC: expected_site_version matches Site.version on reservation create"
    error_id: ERR_STALE_SITE_VERSION
    http_status: 412
    applies_to: "POST /sites/{id}/reservations"

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is defined (§1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_referential
    check: "Site.rate_plan_id RatePlan.site_type matches Site.site_type on site create; AddOn/Payment reservation must be non-terminal where required"
    error_id: ERR_RATE_PLAN_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /parks/{id}/sites"

  - priority: 8
    category: business_constraint
    check: "Reservation nights <= Site.max_length_of_stay_nights (boundary: nights == cap allowed, nights == cap+1 rejected)"
    error_id: ERR_MAX_STAY_EXCEEDED
    http_status: 422
    applies_to: "POST /sites/{id}/reservations"

  - priority: 9
    category: business_safety
    check: "Site is not RETIRED and not MAINTENANCE when locking/confirming/checking-in a reservation"
    error_id: ERR_SITE_UNAVAILABLE
    http_status: 409
    applies_to: "POST /sites/{id}/reservations, POST /reservations/{id}/confirm, POST /reservations/{id}/check-in"

  - priority: 10
    category: business_temporal
    check: "Requested [check_in, check_out) does not overlap an ACTIVE MaintenanceHold buffered window [start - buffer, end + buffer] on the site (buffer = Site.turnover_buffer_days; closed-interval geometry with buffer on each side)"
    error_id: ERR_MAINTENANCE_CONFLICT
    http_status: 409
    applies_to: "POST /sites/{id}/reservations, POST /reservations/{id}/confirm"

  - priority: 11
    category: business_temporal
    check: "Requested [check_in, check_out) does not overlap (half-open; back-to-back where check_out == next check_in is allowed) any Reservation on the site whose reservation_status IN {REQUESTED, CONFIRMED, CHECKED_IN}"
    error_id: ERR_DATE_OVERLAP
    http_status: 409
    applies_to: "POST /sites/{id}/reservations, POST /reservations/{id}/confirm"

  - priority: 12
    category: business_temporal
    check: "Season windows on a park may not overlap any existing Season (closed [start_date, end_date]; aggregate cover capacity 1 per date)"
    error_id: ERR_SEASON_OVERLAP
    http_status: 409
    applies_to: "POST /parks/{id}/seasons"

  - priority: 13
    category: business_fiscal
    check: "DEPOSIT payment amount_cents must equal Reservation.deposit_due_cents; payments may not exceed outstanding balance for BALANCE type"
    error_id: ERR_PAYMENT_AMOUNT_INVALID
    http_status: 422
    applies_to: "POST /reservations/{id}/payments"

  - priority: 14
    category: state
    check: "Payment may not be recorded once the reservation is already PAID_IN_FULL or REFUNDED"
    error_id: ERR_PAYMENT_ALREADY_SETTLED
    http_status: 409
    applies_to: "POST /reservations/{id}/payments"

  - priority: 15
    category: state
    check: "Add-on add/remove only while the parent reservation is non-terminal (not CHECKED_OUT, not CANCELLED)"
    error_id: ERR_ADDON_LOCKED
    http_status: 409
    applies_to: "POST /reservations/{id}/add-ons, POST /add-ons/{id}/remove"

  - priority: 16
    category: business_constraint
    check: "Park config ranges: deposit_pct and tax_rate in [0,1]; full_refund_min_days >= half_refund_min_days >= 0; clock current_utc parseable"
    error_id: ERR_VALIDATION_FAILED
    http_status: 422
    applies_to: "POST /parks, PATCH /parks/{id}, POST /parks/{id}/cancellation-policies"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ----- Park -----------------------------------------------------------------
  - method: POST
    path: "/parks"
    description: "Create a park"
    roles: [Operator]
    code: 201
    input: [name, "timezone?", "check_in_time?", "check_out_time?", "quiet_hours_start?", "quiet_hours_end?", "deposit_pct?", "tax_rate?", "long_stay_nights_threshold?"]
    output: Park
    side_effects: ["version=1"]

  - method: GET
    path: "/parks/{id}"
    description: "Get a park"
    roles: [Operator, Guest]
    code: 200
    input: []
    output: Park
    side_effects: []

  - method: PATCH
    path: "/parks/{id}"
    description: "Update park config (quiet hours, times, deposit/tax policy)"
    roles: [Operator]
    code: 200
    input: ["check_in_time?", "check_out_time?", "quiet_hours_start?", "quiet_hours_end?", "deposit_pct?", "tax_rate?", "long_stay_nights_threshold?", "expected_park_version"]
    output: Park
    side_effects: ["Park.version += 1"]

  # ----- RatePlan -------------------------------------------------------------
  - method: POST
    path: "/parks/{id}/rate-plans"
    description: "Create a rate plan for a site type"
    roles: [Operator]
    code: 201
    input: [site_type, nightly_rate_cents, weekly_rate_cents, monthly_rate_cents]
    output: RatePlan
    side_effects: ["version=1"]

  - method: GET
    path: "/parks/{id}/rate-plans"
    description: "List rate plans for a park (reverse-reachability for RatePlan.park_id)"
    roles: [Operator, Guest]
    code: 200
    input: ["site_type?", "limit?", "offset?"]
    output: RatePlan[]
    side_effects: []

  - method: GET
    path: "/rate-plans/{id}"
    description: "Get a rate plan"
    roles: [Operator, Guest]
    code: 200
    input: []
    output: RatePlan
    side_effects: []

  # ----- Season ---------------------------------------------------------------
  - method: POST
    path: "/parks/{id}/seasons"
    description: "Create a non-overlapping season window with a per-night surcharge"
    roles: [Operator]
    code: 201
    input: [name, start_date, end_date, surcharge_pct]
    output: Season
    side_effects: ["version=1", "rejects overlap with existing seasons (ERR_SEASON_OVERLAP)"]

  - method: GET
    path: "/parks/{id}/seasons"
    description: "List seasons for a park (reverse-reachability for Season.park_id)"
    roles: [Operator, Guest]
    code: 200
    input: ["limit?", "offset?"]
    output: Season[]
    side_effects: []

  # ----- CancellationPolicy ---------------------------------------------------
  - method: POST
    path: "/parks/{id}/cancellation-policies"
    description: "Create the cancellation refund tier schedule for a park"
    roles: [Operator]
    code: 201
    input: [full_refund_min_days, half_refund_min_days]
    output: CancellationPolicy
    side_effects: ["version=1"]

  - method: GET
    path: "/parks/{id}/cancellation-policies"
    description: "List cancellation policies for a park (reverse-reachability for CancellationPolicy.park_id)"
    roles: [Operator, Guest]
    code: 200
    input: ["limit?", "offset?"]
    output: CancellationPolicy[]
    side_effects: []

  # ----- Site -----------------------------------------------------------------
  - method: POST
    path: "/parks/{id}/sites"
    description: "Create a site (rate_plan must match site_type)"
    roles: [Operator]
    code: 201
    input: [rate_plan_id, label, site_type, hookup_level, max_length_of_stay_nights, "turnover_buffer_days?"]
    output: Site
    side_effects: ["status=ACTIVE", "booked_night_count=0", "version=1"]

  - method: GET
    path: "/sites/{id}"
    description: "Get a site"
    roles: [Operator, Guest]
    code: 200
    input: []
    output: Site
    side_effects: []

  - method: GET
    path: "/sites"
    description: "List/filter sites (reverse-reachability for Site.rate_plan_id and Site.park_id)"
    roles: [Operator, Guest]
    code: 200
    input: ["park_id?", "rate_plan_id?", "site_type?", "status?", "limit?", "offset?"]
    output: Site[]
    side_effects: []

  - method: GET
    path: "/parks/{id}/sites"
    description: "List sites in a park (sub-resource reverse-reachability for Site.park_id)"
    roles: [Operator, Guest]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Site[]
    side_effects: []

  - method: POST
    path: "/sites/{id}/maintenance"
    description: "Put a site into MAINTENANCE"
    roles: [Operator]
    code: 200
    input: [expected_site_version]
    output: Site
    side_effects: ["status ACTIVE->MAINTENANCE", "Site.version += 1"]

  - method: POST
    path: "/sites/{id}/reactivate"
    description: "Return a MAINTENANCE site to ACTIVE"
    roles: [Operator]
    code: 200
    input: [expected_site_version]
    output: Site
    side_effects: ["status MAINTENANCE->ACTIVE", "Site.version += 1"]

  - method: POST
    path: "/sites/{id}/retire"
    description: "Retire a site; cascades cancel + refund of its live reservations"
    roles: [Operator]
    code: 200
    input: [expected_site_version]
    output: Site
    side_effects:
      - "status -> RETIRED"
      - "CASCADE: live reservations -> CANCELLED -> REFUND payments -> guest recompute"
      - "booked_night_count -> 0; Site.version += 1"

  # ----- MaintenanceHold ------------------------------------------------------
  - method: POST
    path: "/sites/{id}/maintenance-holds"
    description: "Block a date window on a site for maintenance/turnover"
    roles: [Operator]
    code: 201
    input: [start_date, end_date, "reason?", expected_site_version]
    output: MaintenanceHold
    side_effects: ["status=ACTIVE", "version=1", "Site.version += 1"]

  - method: GET
    path: "/sites/{id}/maintenance-holds"
    description: "List maintenance holds on a site (reverse-reachability for MaintenanceHold.site_id)"
    roles: [Operator, Guest]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: MaintenanceHold[]
    side_effects: []

  - method: POST
    path: "/maintenance-holds/{id}/clear"
    description: "Clear a maintenance hold"
    roles: [Operator]
    code: 200
    input: []
    output: MaintenanceHold
    side_effects: ["status ACTIVE->CLEARED", "Site.version += 1"]

  # ----- Guest ----------------------------------------------------------------
  - method: POST
    path: "/guests"
    description: "Register a guest"
    roles: [Operator, Guest]
    code: 201
    input: [email, full_name]
    output: Guest
    side_effects: ["completed_stays_count=0", "lifetime_spend_cents=0", "version=1"]

  - method: GET
    path: "/guests/{id}"
    description: "Get a guest"
    roles: [Operator, Guest]
    code: 200
    input: []
    output: Guest
    side_effects: []

  - method: GET
    path: "/guests/{id}/reservations"
    description: "List a guest's reservations (reverse-reachability for Reservation.guest_id)"
    roles: [Operator, Guest]
    code: 200
    input: ["reservation_status?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []

  # ----- Reservation ----------------------------------------------------------
  - method: POST
    path: "/sites/{id}/reservations"
    description: "Create (lock) a reservation on a site"
    roles: [Guest]
    code: 201
    input: [guest_id, check_in_date, check_out_date, expected_site_version]
    output: Reservation
    side_effects:
      - "reservation_status=REQUESTED, payment_status=UNPAID"
      - "Validates max stay, site availability, maintenance buffer, date overlap, OCC"
      - "Computes provisional stay_charge/season_surcharge/total_due/deposit_due; booked_night_count += nights"
      - "Site.version += 1"

  - method: GET
    path: "/reservations/{id}"
    description: "Get a reservation"
    roles: [Operator, Guest]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  - method: GET
    path: "/sites/{id}/reservations"
    description: "List reservations on a site (reverse-reachability for Reservation.site_id)"
    roles: [Operator, Guest]
    code: 200
    input: ["reservation_status?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []

  - method: POST
    path: "/reservations/{id}/confirm"
    description: "Confirm a reservation (freezes discount/deposit)"
    roles: [Guest]
    code: 200
    input: []
    output: Reservation
    side_effects:
      - "reservation_status REQUESTED->CONFIRMED"
      - "Freezes discount_cents from guest tier; recomputes total_due_cents, deposit_due_cents"
      - "Re-checks site availability, maintenance buffer, date overlap; Site.version += 1; Reservation.version += 1"

  - method: POST
    path: "/reservations/{id}/check-in"
    description: "Operator checks the guest in"
    roles: [Operator]
    code: 200
    input: []
    output: Reservation
    side_effects: ["reservation_status CONFIRMED->CHECKED_IN", "Reservation.version += 1"]

  - method: POST
    path: "/reservations/{id}/check-out"
    description: "Operator checks the guest out; reconciles final charge"
    roles: [Operator]
    code: 200
    input: []
    output: Reservation
    side_effects:
      - "reservation_status CHECKED_IN->CHECKED_OUT"
      - "FINAL stay_charge reconciliation; auto BALANCE payment if owed; payment_status->PAID_IN_FULL"
      - "Guest completed_stays_count += 1, lifetime_spend_cents += total_due_cents"
      - "Site.booked_night_count recomputed; Site.version += 1; Reservation.version += 1"

  - method: POST
    path: "/reservations/{id}/cancel"
    description: "Cancel a reservation; refund per cancellation tier"
    roles: [Guest]
    code: 200
    input: []
    output: Reservation
    side_effects:
      - "reservation_status {REQUESTED,CONFIRMED}->CANCELLED"
      - "Release booked nights (Site.booked_night_count -= nights; Site.version += 1)"
      - "Compute refund per cancellation_refund; if > 0 create REFUND payment and set payment_status=REFUNDED"
      - "Reservation.version += 1"

  # ----- AddOn ----------------------------------------------------------------
  - method: POST
    path: "/reservations/{id}/add-ons"
    description: "Add an amenity add-on to a reservation"
    roles: [Guest]
    code: 201
    input: [kind, amount_cents, "taxable?"]
    output: AddOn
    side_effects: ["status=ACTIVE", "version=1", "Reservation totals recomputed; Reservation.version += 1"]

  - method: GET
    path: "/reservations/{id}/add-ons"
    description: "List add-ons on a reservation (reverse-reachability for AddOn.reservation_id)"
    roles: [Operator, Guest]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AddOn[]
    side_effects: []

  - method: POST
    path: "/add-ons/{id}/remove"
    description: "Remove an add-on (recomputes reservation totals)"
    roles: [Guest]
    code: 200
    input: []
    output: AddOn
    side_effects: ["status ACTIVE->REMOVED", "Reservation totals recomputed; Reservation.version += 1"]

  # ----- Payment --------------------------------------------------------------
  - method: POST
    path: "/reservations/{id}/payments"
    description: "Record a DEPOSIT or BALANCE payment"
    roles: [Guest]
    code: 201
    input: [type, amount_cents, "reason?"]
    output: Payment
    side_effects:
      - "Appends to the ledger; recomputes amount_paid_cents/balance_cents"
      - "payment_status transitions per §1.2; Reservation.version += 1"

  - method: GET
    path: "/reservations/{id}/payments"
    description: "List the payment ledger for a reservation (reverse-reachability for Payment.reservation_id)"
    roles: [Operator, Guest]
    code: 200
    input: ["type?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []

  # ----- Test-driving clock ---------------------------------------------------
  - method: POST
    path: "/_clock/set"
    description: "Set the server's current UTC instant (test-driving; controls date-relative cancellation windows and check-in eligibility)"
    roles: [Operator]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: ["Sets the deterministic clock used by all date-relative logic"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted, or Guest acting on a reservation/add-on/payment it does not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced park/site/rate-plan/season/policy/guest/reservation/add-on/hold does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing required field, bad enum, unparseable date, check_out_date <= check_in_date, or negative amount" }
  - { id: ERR_STALE_SITE_VERSION, http: 412, condition: "expected_site_version does not match the site's current version on a site-guarded write" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not defined from the resource's current state" }
  - { id: ERR_RATE_PLAN_TYPE_MISMATCH, http: 422, condition: "RatePlan.site_type does not equal the Site.site_type on site creation" }
  - { id: ERR_MAX_STAY_EXCEEDED, http: 422, condition: "Reservation nights exceed Site.max_length_of_stay_nights" }
  - { id: ERR_SITE_UNAVAILABLE, http: 409, condition: "Site is MAINTENANCE or RETIRED when locking/confirming/checking-in" }
  - { id: ERR_MAINTENANCE_CONFLICT, http: 409, condition: "Reservation window collides with an ACTIVE maintenance hold buffered window" }
  - { id: ERR_DATE_OVERLAP, http: 409, condition: "Reservation window overlaps another live reservation on the site" }
  - { id: ERR_SEASON_OVERLAP, http: 409, condition: "Season window overlaps an existing season on the park" }
  - { id: ERR_PAYMENT_AMOUNT_INVALID, http: 422, condition: "DEPOSIT amount != deposit_due_cents, or BALANCE exceeds outstanding balance" }
  - { id: ERR_PAYMENT_ALREADY_SETTLED, http: 409, condition: "Payment attempted on a reservation that is already PAID_IN_FULL or REFUNDED" }
  - { id: ERR_ADDON_LOCKED, http: 409, condition: "Add-on add/remove attempted on a CHECKED_OUT or CANCELLED reservation" }
  - { id: ERR_VALIDATION_FAILED, http: 422, condition: "Park config out of range (deposit_pct/tax_rate not in 0..1, full_refund_min_days < half_refund_min_days)" }
  - { id: ERR_CLOCK_INVALID, http: 422, condition: "Clock set with an unparseable current_utc" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Operator
    description: "Park operator/staff. Owns park, rate, season, policy, and site configuration; performs maintenance, retirement, check-in and check-out. Operates the test clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /parks — create park"
      - "PATCH /parks/{id} — update park config"
      - "POST /parks/{id}/rate-plans — create rate plan"
      - "POST /parks/{id}/seasons — create season"
      - "POST /parks/{id}/cancellation-policies — create policy"
      - "POST /parks/{id}/sites — create site"
      - "POST /sites/{id}/maintenance — to MAINTENANCE"
      - "POST /sites/{id}/reactivate — to ACTIVE"
      - "POST /sites/{id}/retire — to RETIRED (cascade)"
      - "POST /sites/{id}/maintenance-holds — block dates"
      - "POST /maintenance-holds/{id}/clear — clear hold"
      - "POST /reservations/{id}/check-in — check in"
      - "POST /reservations/{id}/check-out — check out (reconcile)"
      - "POST /_clock/set — set test clock"
    shared_operations:
      - "GET on all resources (read-only)"
      - "POST /guests — register guest"

  - name: Guest
    description: "A camper/RV owner. Registers, books and pays for reservations they own, adds/removes add-ons, and cancels their own reservations. May read public config."
    identity: "entity_backed:Guest"
    exclusive_operations:
      - "POST /sites/{id}/reservations — lock a reservation (guest_id must equal X-User-ID)"
      - "POST /reservations/{id}/confirm — confirm own reservation"
      - "POST /reservations/{id}/cancel — cancel own reservation"
      - "POST /reservations/{id}/add-ons — add add-on to own reservation"
      - "POST /add-ons/{id}/remove — remove add-on on own reservation"
      - "POST /reservations/{id}/payments — pay own reservation"
    shared_operations:
      - "GET on parks/sites/rate-plans/seasons/policies/reservations/add-ons/payments (read)"
      - "POST /guests — register guest"
