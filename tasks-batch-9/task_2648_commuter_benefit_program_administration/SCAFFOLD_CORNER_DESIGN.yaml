      - name: full_rollover_close_carries_everything_and_appends_no_ledger_row
        claim_type: waterfall_allocation
        grounds:
          - calculations.benefit_account_month_close
          - entities.Employer.fields.rollover_policy
          - endpoints.POST_/benefits/employers/{employer_id}/month-close
        distinguishing_aspect: "The FULL_ROLLOVER branch of the close waterfall makes both destination buckets zero, so the invariant available_balance_cents == rollover_out_cents holds with NOTHING moved: forfeited_cents and refunded_cents stay 0 and - the part an implementation that always writes a close entry gets wrong - ledger_entry_count must remain 1."
        test_recipe:
          setup:
            - "Employer 'Full Rollover Co' is ACTIVE in US-WA-SEA with rollover_policy FULL_ROLLOVER, rollover_cap_cents 0 (irrelevant on this branch) and an ACTIVE TRANSIT_PASS category."
            - "One ACTIVE employee holds a BenefitAccount opened with opening_rollover_cents 12000, so available_balance_cents is 12000 with exactly 1 ledger row (ROLLOVER_IN)."
            - "The 2026-08 window has been opened and locked (no elections), so month-close has a LOCKED window to close."
