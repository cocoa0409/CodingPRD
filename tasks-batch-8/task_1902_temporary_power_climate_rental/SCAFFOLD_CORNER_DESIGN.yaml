      - name: tier2_unit_banned_in_strict_locale
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_EMISSIONS_TIER_NONCOMPLIANT]"]
        distinguishing_aspect: "Adding a TIER_2 unit to a CA-SCAQMD (cap 5.0) contract fails with ERR_EMISSIONS_TIER_NONCOMPLIANT; the same unit is accepted on a TX-TCEQ (cap 8.0) contract."
        test_recipe:
          setup: ["Customer C1; CA site S_CA and TX site S_TX; TIER_2 unit U_T2 (nox 4.0, 200 kW); contracts K_CA and K_TX both DRAFT"]
          setup_api_calls:
            - call: "POST /power-rental/customers"
