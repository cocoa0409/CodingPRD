            - call: "POST /vendor-access/loaner-sets/${ls_fh_b_id}/receive"
              payload: { delivered_at_utc: "2026-11-05T01:00:00Z" }
              as: SterileProcessingTech
              as_user_id: "user_spd_1"
              captures: { ls_fh_b_status: $.data.status }
          trigger:
