      - name: a_second_remedy_on_the_same_order_is_refused
        claim_type: violation_to_error
        grounds:
          - "validations[priority=60]"
          - "errors.ERR_REMEDY_ALREADY_ISSUED"
          - "calculations.customer_remedy_amount"
          - "entities.DeliveryOrder.fields.remedy_kind"
        distinguishing_aspect: >-
          remedy_kind is a one-shot latch: the ROBOT_FAULT policy pays 298 + 5400 + 250 == 5948 on the
          first REFUND, and every later remedy on that order - another REFUND or a cheaper
          GOODWILL_CREDIT - is refused with 409 ERR_REMEDY_ALREADY_ISSUED, so the zone budget can be
          charged at most once per order.
