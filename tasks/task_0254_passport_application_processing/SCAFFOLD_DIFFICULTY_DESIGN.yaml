              payload: { doc_category: "IDENTITY", doc_kind: "DRIVERS_LICENSE", declared_quality: 100 }
              as: Applicant
              as_user_id: "${a1_id}"
            - call: "POST /applications/${app1_id}/documents"
              payload: { doc_category: "CITIZENSHIP", doc_kind: "BIRTH_CERTIFICATE", declared_quality: 100 }
              as: Applicant
              as_user_id: "${a1_id}"
            - call: "POST /applications/${app1_id}/submit"
              payload: { expected_application_version: "${app1_v0}" }
              as: Applicant
              as_user_id: "${a1_id}"
              captures: { app1_v1: "$.data.version" }
            - call: "POST /appointments"
              payload: { application_id: "${app1_id}", resource_kind: "ACCEPTANCE_FACILITY", facility_id: "${fac_id}", start_utc: "2026-06-09T09:00:00Z", end_utc: "2026-06-09T09:30:00Z", expected_application_version: "${app1_v1}" }
              as: Applicant
              as_user_id: "${a1_id}"
            - call: "POST /applicants"
              payload: { full_legal_name: "Second", date_of_birth: "1990-01-01", email: "ff2@x.com" }
              as: Applicant
              captures: { a2_id: "$.data.id" }
            - call: "POST /applications"
              payload: { applicant_id: "${a2_id}", application_type: "NEW", product_type: "BOOK", service_level: "ROUTINE" }
              as: Applicant
              as_user_id: "${a2_id}"
              captures: { app2_id: "$.data.id", app2_v0: "$.data.version" }
            - call: "POST /applications/${app2_id}/photos"
              payload: { width_px: 600, height_px: 600, head_height_fraction: 0.60, background_is_white: true }
              as: Applicant
              as_user_id: "${a2_id}"
            - call: "POST /applications/${app2_id}/documents"
              payload: { doc_category: "IDENTITY", doc_kind: "DRIVERS_LICENSE", declared_quality: 100 }
              as: Applicant
              as_user_id: "${a2_id}"
            - call: "POST /applications/${app2_id}/documents"
              payload: { doc_category: "CITIZENSHIP", doc_kind: "BIRTH_CERTIFICATE", declared_quality: 100 }
              as: Applicant
              as_user_id: "${a2_id}"
            - call: "POST /applications/${app2_id}/submit"
              payload: { expected_application_version: "${app2_v0}" }
              as: Applicant
              as_user_id: "${a2_id}"
              captures: { app2_v1: "$.data.version" }
          trigger:
            - call: "POST /appointments"
              payload: { application_id: "${app2_id}", resource_kind: "ACCEPTANCE_FACILITY", facility_id: "${fac_id}", start_utc: "2026-06-09T09:15:00Z", end_utc: "2026-06-09T09:45:00Z", expected_application_version: "${app2_v1}" }
              as: Applicant
              as_user_id: "${a2_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 409"
            - "data.error_id == \"ERR_FACILITY_SLOT_CONFLICT\" (09:15-09:45 overlaps 09:00-09:30; half-open)"

      - name: counter_buffered_window_rejects_inside_buffer
        grounds:
          - validations[priority=12]
          - entities.UrgentTravelCounter.fields.cleanup_buffer_minutes
          - entities.Appointment.fields.counter_id
        distinguishing_aspect: |
