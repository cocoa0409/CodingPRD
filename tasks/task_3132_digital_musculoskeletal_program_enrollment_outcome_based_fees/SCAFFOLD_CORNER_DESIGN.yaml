              payload: {}
              as: ClinicalOps
            - call: "POST /msk/fee-invoices"
              payload: { client_account_id: "${hw_id}", billing_period: "2026-09" }
              as: BillingOps
              captures: { inv_q: $.data.id }
          trigger:
            - call: "POST /msk/clients/${hw_id}/suspend"
              payload: { reason: "Contract review" }
              as: BillingOps
              captures: { suspended_state: $.data.account_status }
