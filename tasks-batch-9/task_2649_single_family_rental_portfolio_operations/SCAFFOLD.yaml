    category: business_constraint
    message: "The showing window is shorter than this market's minimum showing duration."
    raised_by: [V450]
  - error_id: ERR_SLOT_IN_PAST
    http_status: 422
    category: business_constraint
    message: "The showing window starts before the current time."
    raised_by: [V452]
  - error_id: ERR_VENDOR_INACTIVE
    http_status: 422
    category: business_constraint
    message: "The vendor is suspended and cannot receive dispatches."
    raised_by: [V404]
  - error_id: ERR_VENDOR_INSURANCE_EXPIRED
    http_status: 422
    category: business_constraint
    message: "The vendor's insurance has lapsed as of the current date."
    raised_by: [V406]
  - error_id: ERR_VENDOR_NOT_CERTIFIED
    http_status: 422
    category: business_constraint
    message: "The vendor holds no current certification for this scope template trade."
    raised_by: [V408]
  - error_id: ERR_YIELD_BELOW_FLOOR
    http_status: 422
    category: business_fiscal
    message: "The underwritten yield on cost is below this market's underwriting floor."
    raised_by: [V600]

# =============================================================================
# 1.7 RBAC Table
#   Authentication is by two headers on every request: X-Role selects the role
#   below, X-User-ID identifies the acting principal. Segregation of duties and
#   peer ownership are enforced against X-User-ID, never against X-Role.
# =============================================================================
roles:

  - name: System
    identity: "opaque"
    identity_note: "X-User-ID is ignored; the role exists only to drive the logical clock in tests."
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /_clock"

  - name: PortfolioAdmin
    identity: "opaque"
    identity_note: "An operator-wide administrator. X-User-ID is an opaque admin identifier."
    exclusive_operations:
      - "POST /markets"
      - "POST /scope-templates"
    shared_operations:
      - "POST /homes and PATCH /homes/{homeId}"
      - "every GET in the table except GET /work-orders/{workOrderId}/vendor-ranking restricted reads"

  - name: AcquisitionAnalyst
    identity: "opaque"
    identity_note: "The analyst who underwrites scattered-site homes. X-User-ID is stamped into UnderwritingCase.submitted_by_user_id on submit."
    exclusive_operations:
      - "POST /underwriting-cases"
      - "POST /underwriting-cases/{caseId}/submit"
      - "POST /underwriting-cases/{caseId}/revise"
    shared_operations:
      - "POST /homes, PATCH /homes/{homeId}"
      - "GET /homes, GET /homes/{homeId}, GET /underwriting-cases, GET /renovation-projects, GET /scope-templates, GET /markets"

  - name: InvestmentCommittee
    identity: "opaque"
    identity_note: "The committee member who decides acquisitions and dispositions. X-User-ID is stamped into UnderwritingCase.decided_by_user_id and must differ from submitted_by_user_id."
    exclusive_operations:
      - "POST /underwriting-cases/{caseId}/decision"
      - "POST /homes/{homeId}/disposition-decision"
    shared_operations:
      - "GET /homes, GET /homes/{homeId}, GET /underwriting-cases, GET /underwriting-cases/{caseId}, GET /markets, GET /scope-templates"

  - name: OperationsManager
    identity: "opaque"
    identity_note: "The market operations manager who runs renovation and maintenance. X-User-ID is an opaque staff identifier."
    exclusive_operations:
      - "POST /renovation-projects"
      - "POST /renovation-projects/{projectId}/lock-scope"
      - "POST /work-orders"
      - "POST /work-orders/{workOrderId}/dispatch"
      - "POST /work-orders/{workOrderId}/void"
    shared_operations:
      - "POST /renovation-projects/{projectId}/budget (with RegionalDirector)"
      - "POST /work-orders/{workOrderId}/complete (with Vendor, for the IN_HOUSE channel)"
      - "GET /renovation-projects*, GET /work-orders*, GET /homes*, GET /vendors, GET /vendor-certifications*, GET /compliance-obligations*"

  - name: VendorManager
    identity: "opaque"
    identity_note: "The manager of the vendor network. X-User-ID is an opaque staff identifier."
    exclusive_operations:
      - "POST /vendors"
      - "PATCH /vendors/{vendorId}"
      - "POST /vendors/{vendorId}/status"
      - "POST /vendor-certifications"
      - "POST /vendor-certifications/{certificationId}/revoke"
    shared_operations:
      - "GET /vendors*, GET /vendor-certifications*, GET /work-orders*, GET /scope-templates*, GET /homes*, GET /markets*"

  - name: Vendor
    identity: "entity_backed:Vendor"
    identity_note: "An external vendor crew. X-User-ID is the Vendor.id of the acting vendor, so the vendor can only accept and complete work orders whose vendor_id equals it."
    exclusive_operations:
      - "POST /work-orders/{workOrderId}/accept"
    shared_operations:
      - "POST /work-orders/{workOrderId}/complete (with OperationsManager)"
      - "GET /work-orders, GET /work-orders/{workOrderId}, GET /vendors/{vendorId}, GET /vendor-certifications*, GET /scope-templates*"

  - name: LeasingAgent
    identity: "opaque"
    identity_note: "The leasing agent operating the self-showing and screening funnel. X-User-ID is an opaque staff identifier."
    exclusive_operations:
      - "POST /showing-slots"
      - "POST /rental-applications/{applicationId}/screen"
      - "POST /leases/{leaseId}/deposit-payments"
      - "POST /leases/{leaseId}/execute"
    shared_operations:
      - "POST /prospects (with Anonymous)"
      - "POST /rental-applications (with Prospect)"
      - "POST /showing-slots/{slotId}/cancel (with Prospect)"
      - "POST /leases and POST /leases/{leaseId}/void (with RegionalDirector)"
      - "GET /prospects*, GET /showing-slots*, GET /rental-applications*, GET /leases*, GET /homes*, GET /homes/{homeId}/leasing-posture"

  - name: Prospect
    identity: "entity_backed:Prospect"
    identity_note: "A prospective resident. X-User-ID is the Prospect.id, so booking, cancelling and application reads are scoped to that prospect's own rows."
    exclusive_operations:
      - "POST /showing-slots/{slotId}/book"
    shared_operations:
      - "POST /prospects/{prospectId}/identity-verifications (with Anonymous)"
      - "POST /rental-applications (with LeasingAgent)"
      - "POST /showing-slots/{slotId}/cancel (with LeasingAgent)"
      - "GET /prospects/{prospectId}, GET /showing-slots*, GET /rental-applications*, GET /leases*"

  - name: Anonymous
    identity: "opaque"
    identity_note: "An unauthenticated web visitor. X-User-ID still has to be present and non-empty (a device-scoped opaque token), but it is not matched against any stored row."
    exclusive_operations: []
    shared_operations:
      - "POST /prospects (with LeasingAgent)"
      - "POST /prospects/{prospectId}/identity-verifications (with Prospect)"
      - "GET /_clock"

  - name: ComplianceOfficer
    identity: "opaque"
    identity_note: "The officer running HOA, insurance and property-tax compliance. X-User-ID is stamped into ComplianceObligation.submitted_by_user_id and must differ from the reviewer's."
    exclusive_operations:
      - "POST /compliance-obligations"
      - "POST /compliance-obligations/{obligationId}/plan"
      - "POST /compliance-obligations/{obligationId}/submit-resolution"
    shared_operations:
      - "POST /compliance-obligations/{obligationId}/review-resolution (with RegionalDirector, subject to segregation of duties)"
      - "GET /compliance-obligations*, GET /homes*, GET /homes/{homeId}/leasing-posture, GET /work-orders*, GET /markets*"

  - name: RegionalDirector
    identity: "opaque"
    identity_note: "The regional director with override authority over lease terms, project budgets and compliance reviews. X-User-ID is an opaque staff identifier."
    exclusive_operations: []
    shared_operations:
      - "POST /leases with a term_months other than Market.standard_lease_term_months (the only role that may do so)"
      - "POST /leases/{leaseId}/void (with LeasingAgent)"
      - "POST /renovation-projects/{projectId}/budget (with OperationsManager)"
      - "POST /compliance-obligations/{obligationId}/review-resolution (with ComplianceOfficer)"
      - "every GET in the table"
