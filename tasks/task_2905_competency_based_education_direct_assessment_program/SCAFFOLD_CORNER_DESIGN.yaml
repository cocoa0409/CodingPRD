      - name: overlapping_term_windows_detected_at_creation
        claim_type: temporal_validation
        excluded_because:
          difficulty_instance: term_window_overlap_half_open_adjacent_allowed
          rationale: "The temporal_validation row (an operation that is legal now but creates a future conflict) is that resource_temporal_overlap instance's subject: it accepts the exactly-adjacent window at the half-open boundary and refuses the one-second overlap with ERR_TERM_WINDOW_OVERLAP."

      - name: term_state_checked_before_attempt_cooloff
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: term_state_beats_attempt_cooloff
          rationale: "The priority-conflict row (violate rule P and rule P+N, expect P's error) is precisely that instance: the same request breaks the term-state rule and the cool-off rule, and the lower-priority ERR_TERM_NOT_ACTIVE must be returned."

      - name: blueprint_contiguity_checked_before_notice_period
        claim_type: cascading_validation
        excluded_because:
          difficulty_instance: blueprint_window_contiguous_tiling_with_notice
          rationale: "The cascading_validation row (check A depends on check B running first) is asserted there by pinning ERR_BLUEPRINT_WINDOW_NOT_CONTIGUOUS ahead of ERR_BLUEPRINT_NOTICE_TOO_SHORT on the same repeated effective_from_utc."

  # §1.5 declares no bulk endpoint, so the guide's `bulk_action` row has no
  # applicable claim in this scaffold and is deliberately not emitted.
  - section: endpoints
    instances:
      - name: mentor_crud_triple_round_trips
        claim_type: standard_crud
        grounds:
          - endpoints.POST_mentors
          - endpoints.GET_mentors_id
          - endpoints.GET_mentors
        distinguishing_aspect: "The create / read / list triple on /mentors round-trips one row: POST returns 201 with current_caseload 0 and status ACTIVE, GET /{id} returns the same row at version 1, and the filtered list status=ACTIVE returns exactly it with total_count 1 — there is no update or delete endpoint for mentors beyond POST /mentors/{id}/status, which changes only status."
        test_recipe:
          setup:
            - "empty database with the logical clock at 2026-09-01T00:00:00.000Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /mentors"
