    description: "Get a snapshot including policy_valuations and per-investor shares (calc_investor_share)"
    roles: [PlatformAdmin, Underwriter, CaseManager, ComplianceOfficer, FinanceOfficer, PortfolioManager, Investor]
    code: 200
    input: []
    output: ValuationSnapshot
    side_effects: []
  - method: POST
    path: "/api/valuation-snapshots/{id}/finalize"
    description: "Finalize a DRAFT snapshot; supersedes prior FINALIZED on the portfolio"
    roles: [PortfolioManager]
    code: 200
    input: []
    output: ValuationSnapshot
    side_effects: ["Portfolio.cached_nav_cents = nav_cents; nav_stale = false", "prior FINALIZED -> SUPERSEDED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/malformed, or role not recognized" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role valid but not in the endpoint's roles list" }
  - { id: ERR_NOT_CASE_OWNER, http: 403, condition: "Broker caller is not the owning broker of the case chain (case.broker_id != X-User-ID, or insured not created by caller for policy creation)" }
  - { id: ERR_INVESTOR_NOT_ALLOCATED, http: 403, condition: "Investor caller holds no allocation in the addressed portfolio" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id (left-to-right) or body-supplied FK reference does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, invalid enum member, negative/zero amount where positive required, invalid date, unknown doc_type, RE_OFFER amount out of (old amount, counter] band, disclosure packet missing a required type" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Action targeted at a resource in a terminal state (e.g. counter an EXPIRED offer, pay a PAID payment, approve a CLOSED package)" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Trigger not valid from the resource's current state (incl. screenings outside SCREENING|SCREEN_FAILED, deliver-disclosures outside UNDERWRITING|MARKETED, assign-portfolio outside IN_CLOSING, reunderwrite with live LE or live offers, manual package cancel after funding)" }
  - { id: ERR_CASE_NOT_MARKETED, http: 409, condition: "Offer create/counter/accept/respond while the case is not MARKETED" }
  - { id: ERR_CASE_HAS_ACTIVE_CLOSING, http: 409, condition: "Withdraw attempted while case is IN_CLOSING" }
  - { id: ERR_DUPLICATE_ACTIVE_CASE, http: 409, condition: "Policy already has a PolicyCase in a non-terminal status" }
  - { id: ERR_POLICY_LOCKED_BY_ACTIVE_CASE, http: 409, condition: "PATCH policy while one of its cases is in UNDERWRITING|MARKETED|IN_CLOSING|ACQUIRED" }
  - { id: ERR_DISCLOSURES_INCOMPLETE, http: 422, condition: "Offer acceptance while case.disclosures_delivered is false" }
  - { id: ERR_CASE_ON_COMPLIANCE_HOLD, http: 409, condition: "Market/closing/fund/release action while case.hold_status == COMPLIANCE_HOLD" }
  - { id: ERR_STATE_LICENSE_NOT_ACTIVE, http: 409, condition: "No governing ACTIVE StateLicense covering the insured's state at closing approve or escrow release" }
  - { id: ERR_LICENSE_EXPIRING_SOON, http: 409, condition: "Governing license expiry_date < clock date + 30 days at closing approve" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Escrow release caller equals the closing package's approved_by_user_id" }
  - { id: ERR_RESCISSION_WINDOW_ACTIVE, http: 409, condition: "Release attempted before clock >= releasable_at" }
  - { id: ERR_RESCISSION_WINDOW_EXPIRED, http: 409, condition: "Rescind attempted at or after releasable_at" }
  - { id: ERR_LE_REPORT_REQUIRED, http: 422, condition: "UW APPROVE with no LifeExpectancyReport ever delivered for the case" }
  - { id: ERR_LE_REPORT_EXPIRED, http: 409, condition: "UW APPROVE when every delivered LE report is past valid_through" }
  - { id: ERR_MAX_NEGOTIATION_ROUNDS_REACHED, http: 409, condition: "Counter or RE_OFFER attempted at round_number == 4" }
  - { id: ERR_COUNTER_INCREMENT_TOO_SMALL, http: 422, condition: "counter_amount_cents < round_half_up(amount_cents * 101/100)" }
  - { id: ERR_CLOSING_DOCS_INCOMPLETE, http: 422, condition: "Approve attempted with an unsigned required document" }
  - { id: ERR_ESCROW_NOT_FUNDED, http: 409, condition: "submit-carrier while escrow not FUNDED" }
  - { id: ERR_PORTFOLIO_NOT_ASSIGNED, http: 422, condition: "Escrow fund attempted before the case is assigned to a portfolio" }
  - { id: ERR_ESCROW_FUNDS_MISMATCH, http: 422, condition: "Fund amount_cents != expected_funding_cents" }
  - { id: ERR_COMMISSION_CAP_EXCEEDED, http: 422, condition: "broker_commission_bps > 600 at offer accept" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 422, condition: "Premium pay amount_cents != scheduled amount_cents" }
  - { id: ERR_POLICY_NOT_ACQUIRED, http: 409, condition: "Tracking event, premium schedule, or death claim attempted on a case not in ACQUIRED" }
  - { id: ERR_VERIFICATION_SOURCES_INSUFFICIENT, http: 422, condition: "Claim create without a VERIFIED DEATH_INDICATED event, or claim verify with fewer than 2 distinct-source VERIFIED DEATH_INDICATED events" }
  - { id: ERR_INVALID_PERIOD, http: 422, condition: "Snapshot period_end <= period_start" }
  - { id: ERR_SNAPSHOT_PERIOD_OVERLAP, http: 409, condition: "Snapshot half-open window overlaps an existing FINALIZED snapshot on the same portfolio" }
  - { id: ERR_LICENSE_WINDOW_OVERLAP, http: 409, condition: "New license closed window touches or overlaps an existing same-state license window" }
  - { id: ERR_VALUATION_INPUT_STALE, http: 422, condition: "An ACQUIRED case in the portfolio has no DELIVERED unexpired LE report at snapshot creation" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Provider platform superuser; registers brokers/investors, drives the logical clock, licenses"
    identity: opaque
    exclusive_operations:
      - "POST /api/_clock/set_current_utc"
      - "POST /api/brokers"
      - "POST /api/investors"
    shared_operations: ["All read endpoints", "POST /api/licenses", "POST /api/portfolios"]

  - name: Broker
    description: "Licensed settlement broker representing the seller; owns the cases it creates"
    identity: "entity_backed:Broker"
    exclusive_operations:
      - "POST /api/cases"
      - "POST /api/cases/{id}/submit"
      - "POST /api/cases/{id}/withdraw"
      - "POST /api/offers/{id}/counter"
      - "POST /api/offers/{id}/accept"
      - "POST /api/offers/{id}/reject"
    shared_operations: ["POST /api/insureds", "POST /api/policies", "PATCH /api/policies/{id}", "Read endpoints (non-portfolio)"]

  - name: Underwriter
    description: "Provider underwriting desk; orders/delivers LE reports, pricing decisions, offer negotiation"
    identity: opaque
    exclusive_operations:
      - "POST /api/cases/{id}/le-reports"
      - "POST /api/le-reports/{id}/deliver"
      - "POST /api/cases/{id}/uw-decision"
      - "POST /api/cases/{id}/reunderwrite"
      - "POST /api/cases/{id}/offers"
      - "POST /api/offers/{id}/respond"
      - "POST /api/offers/{id}/withdraw"
    shared_operations: ["Read endpoints"]

  - name: CaseManager
    description: "Provider operations; screening runs, disclosures, closing logistics, carrier confirmation, tracking"
    identity: opaque
    exclusive_operations:
      - "POST /api/cases/{id}/screenings"
      - "POST /api/cases/{id}/deliver-disclosures"
      - "POST /api/closing-packages/{id}/send-for-signature"
      - "POST /api/closing-packages/{id}/record-signature"
      - "POST /api/closing-packages/{id}/submit-carrier"
      - "POST /api/closing-packages/{id}/confirm-ownership"
      - "POST /api/closing-packages/{id}/cancel"
      - "POST /api/cases/{id}/tracking-events"
      - "POST /api/death-claims/{id}/file"
    shared_operations: ["POST /api/insureds", "POST /api/policies", "PATCH /api/policies/{id}", "Read endpoints"]

  - name: ComplianceOfficer
    description: "Compliance; licenses, closing approval, rescission, tracking verification, claim adjudication. Segregated from funding/release duties per case."
    identity: opaque
    exclusive_operations:
      - "POST /api/licenses/{id}/suspend"
      - "POST /api/licenses/{id}/reinstate"
      - "POST /api/closing-packages/{id}/return-deficiency"
      - "POST /api/closing-packages/{id}/approve"
      - "POST /api/escrow-accounts/{id}/rescind"
      - "POST /api/tracking-events/{id}/verify"
      - "POST /api/tracking-events/{id}/reject"
      - "POST /api/cases/{id}/death-claims"
      - "POST /api/death-claims/{id}/verify"
      - "POST /api/death-claims/{id}/settle"
    shared_operations: ["POST /api/licenses", "Read endpoints"]

  - name: FinanceOfficer
    description: "Treasury; escrow funding/release and disbursement/premium cash movements. Segregated from closing approval per case."
    identity: opaque
    exclusive_operations:
      - "POST /api/escrow-accounts/{id}/fund"
      - "POST /api/escrow-accounts/{id}/release"
      - "POST /api/disbursements/{id}/mark-paid"
      - "POST /api/premium-payments/{id}/pay"
    shared_operations: ["Read endpoints"]

  - name: PortfolioManager
    description: "Portfolio desk; portfolio creation, case assignment, premium optimization, valuation snapshots"
    identity: opaque
    exclusive_operations:
      - "POST /api/cases/{id}/assign-portfolio"
      - "POST /api/cases/{id}/premium-schedules"
      - "POST /api/portfolios/{id}/valuation-snapshots"
      - "POST /api/valuation-snapshots/{id}/finalize"
    shared_operations: ["POST /api/portfolios", "Read endpoints"]

  - name: Investor
    description: "External investor; read-only access to portfolios where it holds an allocation and their snapshots"
    identity: "entity_backed:Investor"
    exclusive_operations: []
    shared_operations:
      - "GET /api/portfolios (allocated only)"
      - "GET /api/portfolios/{id} (allocated only)"
      - "GET /api/portfolios/{id}/valuation-snapshots (allocated only)"
      - "GET /api/valuation-snapshots/{id} (allocated only)"
      - "GET /api/investors/{id}"
