          assert:
            - "${q_subtotal} == 68855 and ${q_freight} == 49250 (the bucket targets are 49250 / 13771 / 55084)"
            - "checkpoint 1 (60000 collected): ${funds_1} == 60000, ${permit_1} == 49250, ${surf_1} == 10750, ${struct_1} == 0, ${cont_1} == 0 - the first bucket fills completely before the second receives anything"
            - "checkpoint 1 invariant: ${permit_1} + ${surf_1} + ${struct_1} + ${cont_1} == ${funds_1} == 60000"
            - "checkpoint 2 (118105 collected): ${funds_2} == 118105, ${permit_2} == 49250, ${surf_2} == 13771, ${struct_2} == 55084, ${cont_2} == 0 - every target is exactly met and nothing spills into contingency"
            - "checkpoint 2 invariant: ${permit_2} + ${surf_2} + ${struct_2} + ${cont_2} == 118105"
            - "checkpoint 3 (pledge B refunded): FundraisingPledge.${pledge_b_id}.status == REFUNDED, ${funds_3} == 60000, and (${permit_3}, ${surf_3}, ${struct_3}, ${cont_3}) == (49250, 10750, 0, 0) - byte-identical to checkpoint 1, so the compensation left no drift"
            - "checkpoint 3: FundraisingPledge.${pledge_a_id}.status == COLLECTED (a refund touches only its own pledge)"
            - "checkpoint 4 (both refunded): ${funds_4} == 0 and ${permit_4} == 0, ${surf_4} == 0, ${struct_4} == 0, ${cont_4} == 0 - the first bucket drains too, which an incremental reverse-order patch would leave at 49250"
            - "Quote.${quote_id}.status == ISSUED and total_cents == 118105 throughout (fundraising never mutates the quote)"
            - "DesignProject.${proj_id}.design_status == DESIGN_APPROVED at every checkpoint (collect and refund do not move the design state machine)"

