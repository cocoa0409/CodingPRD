              captures: { err_res: $.data.error_id }
          assert:
            - "the first resolve stamped DisputeCase.${dc}.refund_due_cents 1000, mediation_fee_pct 0.020, mediation_fee_cents 2520, settlement_total_cents 3520"
            - "the first resolve stamped outcome SPLIT, uncapped_marketplace_cents 2112, binding_marketplace_cents 2112, binding_supplier_cents 1408, status RESOLVED"
            - "the second resolve is HTTP 409 with ${err_res} == ERR_DISPUTE_ALREADY_RESOLVED"
            - "DisputeCase.${dc}.outcome is still SPLIT and binding_marketplace_cents is still 2112"

      - name: activate_an_already_active_model_agreement_is_rejected
        claim_type: idempotency
        grounds:
