  - rule_id: transitive_cascade
    instances:
      - name: major_comment_cascade_a_depth_four_invalidates_seal_sheet_and_clearances
        grounds:
          - state_machines.Submittal.UNDER_REVIEW_to_COMMENTS_ISSUED
          - state_machines.HydraulicCalculation.SEALED_to_REOPENED
          - state_machines.ShopDrawing.COORDINATED_to_STALE
          - state_machines.TradeClearance.CLEARED_to_STALE
          - calculations.project_design_posture
          - endpoints.POST_/submittals/{id}/complete-review
        distinguishing_aspect: |
          One request propagates four levels deep - Submittal -> HydraulicCalculation -> ShopDrawing
          -> TradeClearance - and each level is only reachable through the level above it: the sheet
          goes STALE because its calculation reopened, and the clearances go STALE because their sheet
          did. The cascade also has to be selective on the way down (only SEALED calculations named in
          included_calculation_ids, only COORDINATED sheets over those calculations, only CLEARED
          clearances of those sheets) and it must move two derived aggregates in step,
          Project.sealed_calculation_count 1 -> 0 and ShopDrawing.cleared_trade_count 3 -> 0.
