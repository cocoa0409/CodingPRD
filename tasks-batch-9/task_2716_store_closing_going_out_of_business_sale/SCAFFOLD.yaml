# =============================================================================
# PRD Benchmark Seed Tables — task_2716_store_closing_going_out_of_business_sale
# Difficulty band: Expert+ (deliberately above the §0.4 Expert band: the coupling
# between agency economics, jurisdiction compliance, markdown cadence and final
# settlement cannot be expressed with fewer interacting entities)
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2716. Store Closing & Going-Out-of-Business Sale (retail liquidation consultant): agency agreement structure with guaranteed recovery, fee-based or hybrid economics and expense responsibility, inventory valuation with cost-value recovery estimates by category and store, augmentation inventory sourcing to extend the sale with disclosure requirements, discount cadence planning with escalating markdowns tied to sell-through targets, going-out-of-business sale license and advertising regulation compliance by jurisdiction, employee retention bonuses, staffing wind-down and final termination timing, fixture and equipment sale, lease disposition and landlord surrender obligations, final settlement accounting between the retailer and the liquidator

domain_name: store-closing-liquidation
api_prefix: ""          # all collections are top-level: /engagements, /stores, /markdown-stages, ...

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation      # PROVISIONAL vs FINAL settlement; PROJECTED vs REALIZED recovery
    - cascading_side_effects        # store closing and licence loss both drive 5-hop chains
    - rate_threshold_triggers       # markdown escalation bands, fee tiers, augmentation cap, posture strikes
    - optimistic_concurrency        # OCC on Engagement.version and Store.version for supersede-style creates

  entity_topology: hybrid
  # Engagement -> Store -> {InventoryLot, MarkdownStage, GobLicense, AugmentationConsignment,
  # Employee, SalesDay, LeaseDisposition} is a tree; Jurisdiction is a cross-cutting
  # configuration entity referenced by Store; ExpenseItem is polymorphic-scoped
  # (engagement-level when store_id is null, store-level otherwise); InventoryLot
  # additionally references AugmentationConsignment across the tree.

  state_machine_shape: compound
  # Engagement state is gated by the aggregate state of its Stores (wind-down requires
  # every store terminal), Store state is gated by its GobLicense, and three machines
  # are outright cyclic (Engagement revision loop, LeaseDisposition negotiation rounds,
  # Settlement dispute loop). Employee carries two parallel state dimensions.

  relationship_patterns:
    - one_to_many          # Engagement->Store, Store->(lots, stages, licences, employees, sales days)
    - cross_aggregate      # InventoryLot.consignment_id crosses the Store subtree boundary
    - polymorphic          # ExpenseItem scopes to an Engagement, optionally narrowed to one Store

  role_model: segregation_of_duties
  # The ComplianceOfficer who files a GOB licence application may not decide it;
  # money moves only on RetailerController authority; selling-floor facts (sales days,
  # employment actions) can only be reported by the StoreManager of that exact store.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # ---------------------------------------------------------------- Jurisdiction
  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Jurisdiction short code, e.g. NY, CA, TX"
        constraints: "2-8 chars, uppercase; globally unique (ERR_DUPLICATE_JURISDICTION_CODE)"
      - name: name
        type: string
        source: input
        description: "Human-readable jurisdiction name"
      - name: gob_license_required
        type: boolean
        source: input
        description: "When true a store in this jurisdiction may not sell until an APPROVED GobLicense exists"
      - name: max_sale_days
        type: integer
        source: input
        description: "Maximum inclusive day count a single GOB licence period may span"
        constraints: ">= 1"
      - name: license_cooling_off_days
        type: integer
        source: input
        default: 30
        description: "Minimum day gap required between a prior licence period_end_date and a new period_start_date on the same store"
        constraints: ">= 0"
      - name: max_augmentation_ratio
        type: number
        source: input
        description: "Cap on received augmentation cost value divided by store original cost value; 0 means augmentation is prohibited"
        constraints: "0 <= value <= 1, 4 decimal places"
      - name: augmentation_disclosure_required
        type: boolean
        source: input
        description: "When true a consignment must reach DISCLOSURE_FILED before it may be received"
      - name: augmentation_prohibited
        type: boolean
        source: input
        default: false
        description: "When true this jurisdiction forbids augmentation merchandise outright, so no consignment may even be proposed for a store here"
      - name: prohibited_claim_codes
        type: array
        source: input
        default: []
        description: "Advertising claim codes this jurisdiction forbids in GOB advertising"
        constraints: "subset of {LOWEST_PRICES_EVER, EVERYTHING_MUST_GO, LOST_OUR_LEASE, BELOW_COST, FINAL_DAYS, AUGMENTED_MERCHANDISE_DISCLOSURE}"
      - name: advertising_disclosure_required
        type: boolean
        source: input
        description: "When true, a store holding received augmentation may only hold a licence whose advertising_claim_codes include AUGMENTED_MERCHANDISE_DISCLOSURE"
      - name: surrender_notice_days
        type: integer
        source: input
        default: 30
        description: "Notice days a landlord surrender offer must allow between the offer date and surrender_deadline_date"
        constraints: ">= 0"

  # ------------------------------------------------------------------ Engagement
  - name: Engagement
    parent: null
    common_fields: true
    fields:
      - name: retailer_name
        type: string
        source: input
        description: "Retailer that owns the closing stores"
      - name: liquidator_name
        type: string
        source: input
        description: "Liquidation consultant acting as agent"
      - name: economics_model
        type: enum
        source: input
        description: "Agency agreement economics"
        constraints: "one of {GUARANTEED, FEE_BASED, HYBRID}"
      - name: guaranty_pct
        type: number
        source: input
        default: null
        description: "Guaranteed recovery as a fraction of original_cost_value_cents; required for GUARANTEED and HYBRID, must be null for FEE_BASED"
        constraints: "0 <= value <= 1.5, 4 decimal places"
      - name: hybrid_retailer_excess_pct
        type: number
        source: input
        default: null
        description: "Retailer share of recovery above the guaranty floor; strictly positive for HYBRID, exactly 0 for GUARANTEED and FEE_BASED (never null)"
        constraints: "0 <= value <= 1, 4 decimal places"
      - name: expense_responsibility
        type: enum
        source: input
        description: "Who bears sale expenses"
        constraints: "one of {LIQUIDATOR, RETAILER, SHARED}"
      - name: shared_expense_liquidator_pct
        type: number
        source: input
        default: null
        description: "Liquidator fraction of each expense item; strictly positive when expense_responsibility == SHARED, exactly 0 for LIQUIDATOR and RETAILER (never null)"
        constraints: "0 <= value <= 1, 4 decimal places"
      - name: sale_start_date
        type: string
        source: input
        description: "Planned first selling day of the engagement"
        constraints: "ISO 8601 date YYYY-MM-DD"
      - name: target_end_date
        type: string
        source: input
        description: "Planned last selling day of the engagement"
        constraints: "ISO 8601 date YYYY-MM-DD; >= sale_start_date"
      - name: submitted_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the LiquidationConsultant who submitted the agency agreement for retailer approval; re-set on every submit-for-approval"
      - name: approved_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the RetailerController who approved or returned the agency agreement"
      - name: engagement_status
        type: enum
        source: computed
        default: DRAFT
        description: "Lifecycle state; see §1.2"
        constraints: "one of {DRAFT, PENDING_RETAILER_APPROVAL, ACTIVE, WIND_DOWN, CLOSED}"
      - name: compliance_strike_count
        type: integer
        source: computed
        default: 0
        description: "Count of compliance events (licence revoked or licence expired while selling) recorded against this engagement"
      - name: compliance_posture
        type: enum
        source: computed
        default: OPEN
        description: "Derived gate over child operations: OPEN when compliance_strike_count == 0, RESTRICTED when 1 <= count <= 2, FROZEN when count >= 3"
        constraints: "one of {OPEN, RESTRICTED, FROZEN}"
      - name: original_cost_value_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of InventoryLot.cost_value_cents over all lots of all stores of this engagement whose source == ORIGINAL"
      - name: guaranty_amount_cents
        type: integer
        source: computed
        default: 0
        description: "round_half_up(original_cost_value_cents * guaranty_pct) for GUARANTEED and HYBRID; exactly 0 when economics_model == FEE_BASED"
      - name: projected_gross_recovery_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of Store.projected_gross_recovery_cents over all stores of this engagement"
      - name: projected_shortfall_cents
        type: integer
        source: computed
        default: 0
        description: "max(0, guaranty_amount_cents - projected_gross_recovery_cents)"
      - name: original_net_sales_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of SalesDay.original_net_sales_cents over all stores of this engagement whose day_status == POSTED"
      - name: augmentation_net_sales_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of SalesDay.augmentation_net_sales_cents over all stores of this engagement whose day_status == POSTED"
      - name: gross_recovery_cents
        type: integer
        source: computed
        default: 0
        description: "original_net_sales_cents + augmentation_net_sales_cents"
      - name: expense_total_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of ExpenseItem.amount_cents for this engagement whose expense_status IN {APPROVED, SETTLED}"
      - name: expense_liquidator_share_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of ExpenseItem.liquidator_share_cents for this engagement whose expense_status IN {APPROVED, SETTLED}"
      - name: expense_retailer_share_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of ExpenseItem.retailer_share_cents for this engagement whose expense_status IN {APPROVED, SETTLED}"
      - name: retention_accrual_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of Employee.earned_bonus_cents over all employees of all stores of this engagement whose bonus_status IN {EARNED, PRORATED_EARNED, PAID}"

  # ----------------------------------------------------------------------- Store
  - name: Store
    parent: Engagement
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id; owning engagement, taken from the path"
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; jurisdiction whose GOB rules govern this store"
      - name: store_code
        type: string
        source: input
        description: "Retailer store number"
        constraints: "unique within engagement_id (ERR_DUPLICATE_STORE_CODE)"
      - name: address_line
        type: string
        source: input
        description: "Street address of the closing store"
      - name: store_status
        type: enum
        source: computed
        default: PLANNED
        description: "Lifecycle state; see §1.2"
        constraints: "one of {PLANNED, LICENSE_PENDING, SELLING, SUSPENDED, CLOSED, SURRENDERED}"
      - name: suspension_reason
        type: enum
        source: computed
        default: NONE
        description: "Why the store is SUSPENDED"
        constraints: "one of {NONE, LICENSE_REVOKED, LICENSE_EXPIRED, COMPLIANCE_HOLD}"
      - name: selling_start_date
        type: string
        source: computed
        default: null
        description: "First selling day; set when the store enters SELLING"
        constraints: "ISO 8601 date YYYY-MM-DD"
      - name: selling_end_date
        type: string
        source: computed
        default: null
        description: "Final selling day; set to the logical clock date when the store enters CLOSED"
        constraints: "ISO 8601 date YYYY-MM-DD"
      - name: original_cost_value_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of InventoryLot.cost_value_cents for this store where source == ORIGINAL"
      - name: augmentation_cost_value_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of InventoryLot.cost_value_cents for this store where source == AUGMENTATION"
      - name: units_initial_total
        type: integer
        source: computed
        default: 0
        description: "Sum of (InventoryLot.units_initial - InventoryLot.units_returned) over all lots of this store"
      - name: units_sold_total
        type: integer
        source: computed
        default: 0
        description: "Sum of InventoryLot.units_sold over all lots of this store"
      - name: realized_sell_through_pct
        type: number
        source: computed
        default: 0.0
        description: "round_half_up(units_sold_total / units_initial_total, 4); exactly 0.0000 when units_initial_total == 0"
      - name: planned_avg_discount_pct
        type: number
        source: computed
        default: 0.0
        description: "round_half_up(sum(MarkdownStage.discount_pct where stage_status IN {ARMED, ACTIVE}) / count(same set), 4); exactly 0.0000 when that set is empty"
      - name: projected_gross_recovery_cents
        type: integer
        source: computed
        default: 0
        description: "Output of calculations.store_projected_recovery_estimate (PROJECTED variant)"
      - name: projected_recovery_ratio
        type: number
        source: computed
        default: 0.0
        description: "round_half_up(projected_gross_recovery_cents / original_cost_value_cents, 4); exactly 0.0000 when original_cost_value_cents == 0"
      - name: realized_gross_recovery_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of SalesDay.net_sales_cents for this store where day_status == POSTED"
      - name: realized_recovery_ratio
        type: number
        source: computed
        default: 0.0
        description: "round_half_up(sum(SalesDay.original_net_sales_cents where day_status == POSTED) / original_cost_value_cents, 4); exactly 0.0000 when original_cost_value_cents == 0"
      - name: augmentation_units_accounted
        type: integer
        source: computed
        default: 0
        description: "Sum of (units_on_hand + units_sold + units_returned) over lots of this store where source == AUGMENTATION; conserved invariant target of calculations.augmentation_unit_conservation"

  # ---------------------------------------------------------------- InventoryLot
  - name: InventoryLot
    parent: Store
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; store holding the lot, taken from the path"
      - name: consignment_id
        type: string
        source: system
        default: null
        description: "FK -> AugmentationConsignment.id; null for ORIGINAL lots, set by the consignment receive cascade for AUGMENTATION lots"
      - name: category
        type: enum
        source: input
        description: "Merchandise category driving the sell-through constant"
        constraints: "one of {APPAREL, FOOTWEAR, HOME, ELECTRONICS, JEWELRY, SEASONAL}"
      - name: source
        type: enum
        source: input
        default: ORIGINAL
        description: "ORIGINAL = retailer's own goods at engagement start; AUGMENTATION = goods brought in to extend the sale"
        constraints: "one of {ORIGINAL, AUGMENTATION}; AUGMENTATION lots may only be created by the consignment receive cascade"
      - name: units_initial
        type: integer
        source: input
        description: "Units placed on the selling floor when the lot was created"
        constraints: ">= 1"
      - name: units_on_hand
        type: integer
        source: computed
        description: "units_initial - units_sold - units_returned"
      - name: units_sold
        type: integer
        source: computed
        default: 0
        description: "Units consumed by POSTED SalesDay allocations"
      - name: units_returned
        type: integer
        source: computed
        default: 0
        description: "Units sent back to the consignment supplier by the return-unsold compensating action"
      - name: unit_cost_cents
        type: integer
        source: input
        description: "Cost value of one unit"
        constraints: ">= 1"
      - name: unit_retail_cents
        type: integer
        source: input
        description: "Ticketed retail price of one unit before markdown"
        constraints: ">= unit_cost_cents"
      - name: cost_value_cents
        type: integer
        source: computed
        description: "(units_initial - units_returned) * unit_cost_cents"
      - name: retail_value_cents
        type: integer
        source: computed
        description: "(units_initial - units_returned) * unit_retail_cents"
      - name: lot_status
        type: enum
        source: computed
        default: ON_FLOOR
        description: "ON_FLOOR while units_on_hand > 0; SOLD_OUT when units_on_hand reaches 0 through sales; RETURNED_TO_SUPPLIER when the consignment return-unsold action zeroes units_on_hand"
        constraints: "one of {ON_FLOOR, SOLD_OUT, RETURNED_TO_SUPPLIER}"
      - name: projected_recovery_cents
        type: integer
        source: computed
        default: 0
        description: "Per-lot output of calculations.store_projected_recovery_estimate"

  # ------------------------------------------------------ AugmentationConsignment
  - name: AugmentationConsignment
    parent: Store
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; receiving store, taken from the path"
      - name: supplier_name
        type: string
        source: input
        description: "Third-party supplier of the augmentation goods"
      - name: category
        type: enum
        source: input
        description: "Merchandise category of the consigned goods"
        constraints: "one of {APPAREL, FOOTWEAR, HOME, ELECTRONICS, JEWELRY, SEASONAL}"
      - name: units_supplied
        type: integer
        source: input
        description: "Units offered under the consignment"
        constraints: ">= 1"
      - name: unit_cost_cents
        type: integer
        source: input
        description: "Consignment cost per unit"
        constraints: ">= 1"
      - name: unit_retail_cents
        type: integer
        source: input
        description: "Ticketed retail price per consigned unit"
        constraints: ">= unit_cost_cents"
      - name: cost_value_cents
        type: integer
        source: computed
        description: "units_supplied * unit_cost_cents"
      - name: delivery_window_start_date
        type: string
        source: input
        description: "First day of the receiving-dock delivery window (closed interval)"
        constraints: "ISO 8601 date YYYY-MM-DD"
      - name: delivery_window_end_date
        type: string
        source: input
        description: "Last day of the receiving-dock delivery window (closed interval)"
        constraints: "ISO 8601 date YYYY-MM-DD; >= delivery_window_start_date"
      - name: consignment_status
        type: enum
        source: computed
        default: PROPOSED
        description: "Lifecycle state; see §1.2"
        constraints: "one of {PROPOSED, DISCLOSURE_FILED, RECEIVED, RETURNED, SOLD_OUT}"
      - name: disclosure_reference
        type: string
        source: input
        default: null
        description: "Regulator filing reference captured when the augmentation disclosure is filed"
      - name: disclosure_filed_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant at which the disclosure was filed"
      - name: units_returned
        type: integer
        source: computed
        default: 0
        description: "Units returned to the supplier by the return-unsold compensating action"

  # ---------------------------------------------------------------- MarkdownStage
  - name: MarkdownStage
    parent: Store
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; store whose selling calendar this stage occupies, taken from the path"
      - name: stage_index
        type: integer
        source: input
        description: "1-based cadence position; must equal (max existing stage_index of non-VOIDED stages for the store) + 1"
        constraints: ">= 1"
      - name: discount_pct
        type: number
        source: input
        description: "Storewide markdown fraction applied during the stage window; mutated in place by the escalation calculation"
        constraints: "0 <= value <= 0.9, 4 decimal places; must be >= discount_pct of the preceding non-VOIDED stage"
      - name: sell_through_target_pct
        type: number
        source: input
        description: "Cumulative store sell-through the stage is expected to reach by its checkpoint"
        constraints: "0 < value <= 1, 4 decimal places"
      - name: window_start_date
        type: string
        source: input
        description: "Inclusive first day of the stage window (half-open interval start)"
        constraints: "ISO 8601 date YYYY-MM-DD"
      - name: window_end_date
        type: string
        source: input
        description: "Exclusive last day of the stage window (half-open interval end)"
        constraints: "ISO 8601 date YYYY-MM-DD; > window_start_date"
      - name: stage_status
        type: enum
        source: computed
        default: ARMED
        description: "Lifecycle state; see §1.2"
        constraints: "one of {ARMED, ACTIVE, CLOSED, VOIDED}"
      - name: closed_reason
        type: enum
        source: computed
        default: null
        description: "Why the stage left ACTIVE/ARMED"
        constraints: "one of {ON_SCHEDULE, ESCALATED, SUPERSEDED, STORE_CLOSED, LICENSE_LOST}"
      - name: checkpoint_sell_through_pct
        type: number
        source: computed
        default: null
        description: "Store.realized_sell_through_pct observed at the moment the stage checkpoint ran"
      - name: escalation_applied_pct
        type: number
        source: computed
        default: 0.0
        description: "Markdown increment this stage's checkpoint pushed onto the following stage"
      - name: activated_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant at which the stage became ACTIVE"

  # ------------------------------------------------------------------- GobLicense
  - name: GobLicense
    parent: Store
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; licensed store, taken from the path"
      - name: license_number
        type: string
        source: input
        description: "Regulator-issued application/licence number"
      - name: period_start_date
        type: string
        source: input
        description: "Inclusive first licensed selling day (closed interval start)"
        constraints: "ISO 8601 date YYYY-MM-DD"
      - name: period_end_date
        type: string
        source: input
        description: "Inclusive last licensed selling day (closed interval end)"
        constraints: "ISO 8601 date YYYY-MM-DD; >= period_start_date"
      - name: requested_days
        type: integer
        source: computed
        description: "Inclusive day count of the licence period: (period_end_date - period_start_date) + 1"
      - name: advertising_claim_codes
        type: array
        source: input
        default: []
        description: "Advertising claims the licence authorises"
        constraints: "subset of {LOWEST_PRICES_EVER, EVERYTHING_MUST_GO, LOST_OUR_LEASE, BELOW_COST, FINAL_DAYS, AUGMENTED_MERCHANDISE_DISCLOSURE}"
      - name: license_status
        type: enum
        source: computed
        default: APPLIED
        description: "Lifecycle state; see §1.2"
        constraints: "one of {APPLIED, APPROVED, DENIED, EXPIRED, REVOKED}"
      - name: applied_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer who filed the application"
      - name: decided_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the ComplianceOfficer who approved or denied the application; must differ from applied_by_user_id"
      - name: decision_reason
        type: string
        source: input
        default: null
        description: "Free-text reason recorded with the approve/deny decision"
      - name: revoked_reason
        type: string
        source: input
        default: null
        description: "Free-text reason recorded when an APPROVED licence is revoked"

  # --------------------------------------------------------------------- Employee
  - name: Employee
    parent: Store
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; employing store, taken from the path"
      - name: employee_code
        type: string
        source: input
        description: "Payroll identifier"
        constraints: "unique within store_id (ERR_DUPLICATE_EMPLOYEE_CODE)"
      - name: employment_status
        type: enum
        source: computed
        default: ACTIVE
        description: "Employment dimension of the parallel state machine; see §1.2"
        constraints: "one of {ACTIVE, NOTICE_GIVEN, TERMINATED_INVOLUNTARY, TERMINATED_VOLUNTARY}"
      - name: bonus_status
        type: enum
        source: computed
        default: PENDING
        description: "Retention-bonus dimension of the parallel state machine; evolves independently of employment_status"
        constraints: "one of {PENDING, EARNED, PRORATED_EARNED, FORFEITED, PAID}"
      - name: retention_bonus_cents
        type: integer
        source: input
        description: "Bonus offered for staying to the retention target date"
        constraints: ">= 0"
      - name: retention_start_date
        type: string
        source: input
        description: "First day counted toward the retention period"
        constraints: "ISO 8601 date YYYY-MM-DD"
      - name: retention_target_date
        type: string
        source: input
        description: "Last day counted toward the retention period"
        constraints: "ISO 8601 date YYYY-MM-DD; >= retention_start_date"
      - name: attendance_rate
        type: number
        source: input
        description: "Attendance fraction reported by the store manager"
        constraints: "0 <= value <= 1, 4 decimal places"
      - name: served_days
        type: integer
        source: computed
        default: 0
        description: "Inclusive day count from retention_start_date to the settlement day used by calculations.retention_bonus_settlement"
      - name: earned_bonus_cents
        type: integer
        source: computed
        default: 0
        description: "Per-employee rounded bonus entitlement; see calculations.retention_bonus_settlement"
      - name: notice_given_date
        type: string
        source: computed
        default: null
        description: "Logical-clock date on which WARN-style notice was given"
      - name: termination_date
        type: string
        source: computed
        default: null
        description: "Logical-clock date (or store selling_end_date for cascade terminations) on which employment ended"
      - name: bonus_paid_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant at which the earned bonus was paid"

  # --------------------------------------------------------------------- SalesDay
  - name: SalesDay
    parent: Store
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; reporting store, taken from the path"
      - name: business_date
        type: string
        source: input
        description: "Selling day being reported"
        constraints: "ISO 8601 date YYYY-MM-DD; unique within store_id (ERR_DUPLICATE_SALES_DAY)"
      - name: original_net_sales_cents
        type: integer
        source: input
        description: "Net sales of ORIGINAL merchandise on the business date"
        constraints: ">= 0"
      - name: augmentation_net_sales_cents
        type: integer
        source: input
        description: "Net sales of AUGMENTATION merchandise on the business date"
        constraints: ">= 0"
      - name: original_units_sold
        type: integer
        source: input
        description: "Units of ORIGINAL merchandise sold on the business date"
        constraints: ">= 0"
      - name: augmentation_units_sold
        type: integer
        source: input
        description: "Units of AUGMENTATION merchandise sold on the business date"
        constraints: ">= 0"
      - name: net_sales_cents
        type: integer
        source: computed
        description: "original_net_sales_cents + augmentation_net_sales_cents"
      - name: day_status
        type: enum
        source: computed
        default: PENDING_REVIEW
        description: "Lifecycle state; see §1.2"
        constraints: "one of {PENDING_REVIEW, POSTED, REJECTED}"
      - name: posted_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant at which the day was posted to the ledger"
      - name: submitted_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the actor that filed the day for review; segregation of duties bars this same id from reviewing it"
      - name: reviewed_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the RetailerController who posted or rejected the day"
      - name: allocation_note
        type: string
        source: computed
        default: null
        description: "Ordered lot-allocation trace written on POST, e.g. 'ORIGINAL:400@lot1;AUGMENTATION:150@lot3'"

  # ------------------------------------------------------------------ ExpenseItem
  - name: ExpenseItem
    parent: Engagement
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id; owning engagement, taken from the path"
      - name: store_id
        type: string
        source: input
        default: null
        description: "FK -> Store.id; store the expense is charged to, or null for an engagement-level expense"
      - name: expense_category
        type: enum
        source: input
        description: "Expense classification"
        constraints: "one of {OCCUPANCY, ADVERTISING, PAYROLL, SECURITY, SUPPLIES, PROFESSIONAL_FEES}"
      - name: amount_cents
        type: integer
        source: input
        description: "Gross expense amount"
        constraints: ">= 1"
      - name: incurred_date
        type: string
        source: input
        description: "Date the expense was incurred"
        constraints: "ISO 8601 date YYYY-MM-DD"
      - name: expense_status
        type: enum
        source: computed
        default: SUBMITTED
        description: "Lifecycle state; see §1.2"
        constraints: "one of {SUBMITTED, APPROVED, VOIDED, SETTLED}"
      - name: liquidator_share_cents
        type: integer
        source: computed
        default: 0
        description: "Liquidator portion assigned by calculations.expense_responsibility_split at approval; reset to 0 on void"
      - name: retailer_share_cents
        type: integer
        source: computed
        default: 0
        description: "Retailer portion assigned by calculations.expense_responsibility_split at approval; reset to 0 on void"
      - name: auto_generated
        type: boolean
        source: computed
        default: false
        description: "true when created by the store-closing retention-accrual cascade rather than by a client call"
      - name: submitted_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the actor that submitted the expense; segregation of duties bars this same id from deciding it; null for auto_generated items"
      - name: decided_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the RetailerController who approved or voided the item; null for auto_generated items"

  # -------------------------------------------------------------- LeaseDisposition
  - name: LeaseDisposition
    parent: Store
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; store whose lease is being disposed of, taken from the path"
      - name: landlord_name
        type: string
        source: input
        description: "Landlord counterparty"
      - name: surrender_deadline_date
        type: string
        source: input
        description: "Date by which possession must be delivered before holdover charges accrue"
        constraints: "ISO 8601 date YYYY-MM-DD"
      - name: daily_holdover_rate_cents
        type: integer
        source: input
        description: "Contract per-day holdover rate used by calculations.lease_surrender_waterfall"
        constraints: ">= 0"
      - name: rent_arrears_cents
        type: integer
        source: input
        description: "Waterfall bucket 1 — unpaid base rent"
        constraints: ">= 0"
      - name: cam_arrears_cents
        type: integer
        source: input
        description: "Waterfall bucket 2 — unpaid common-area maintenance"
        constraints: ">= 0"
      - name: restoration_cost_cents
        type: integer
        source: input
        description: "Waterfall bucket 3 — landlord restoration/condition obligation"
        constraints: ">= 0"
      - name: fixture_reserve_price_cents
        type: integer
        source: input
        description: "Reserve price below which the store's fixtures and equipment may not be sold"
        constraints: ">= 0"
      - name: surrender_credit_cents
        type: integer
        source: input
        default: 0
        description: "Cash credit the retailer contributes toward the landlord waterfall at surrender"
        constraints: ">= 0"
      - name: disposition_status
        type: enum
        source: computed
        default: DRAFT
        description: "Lifecycle state; see §1.2"
        constraints: "one of {DRAFT, OFFER_SENT, LANDLORD_COUNTERED, AGREED, REJECTED_FINAL, SURRENDERED}"
      - name: negotiation_round
        type: integer
        source: computed
        default: 0
        description: "Incremented by one on every surrender offer; offers beyond MAX_NEGOTIATION_ROUNDS are rejected"
      - name: offered_surrender_payment_cents
        type: integer
        source: computed
        default: null
        description: "Most recent surrender payment the retailer offered the landlord"
      - name: landlord_counter_amount_cents
        type: integer
        source: computed
        default: null
        description: "Most recent counter amount the landlord returned"
      - name: agreed_surrender_payment_cents
        type: integer
        source: computed
        default: null
        description: "offered_surrender_payment_cents frozen at the moment the landlord accepted"
      - name: landlord_agreed_date
        type: string
        source: computed
        default: null
        description: "Logical-clock date on which the landlord accepted the surrender offer; start of the surrender notice period"
      - name: fixture_sale_price_cents
        type: integer
        source: computed
        default: null
        description: "Realised fixture and equipment sale price recorded at surrender"
      - name: holdover_days
        type: integer
        source: computed
        default: 0
        description: "max(0, surrender clock date - surrender_deadline_date) in days"
      - name: holdover_penalty_cents
        type: integer
        source: computed
        default: 0
        description: "Waterfall bucket 4 — round_half_up(daily_holdover_rate_cents * holdover_days * HOLDOVER_MULTIPLIER)"
      - name: allocated_rent_cents
        type: integer
        source: computed
        default: 0
        description: "Waterfall allocation to bucket 1"
      - name: allocated_cam_cents
        type: integer
        source: computed
        default: 0
        description: "Waterfall allocation to bucket 2"
      - name: allocated_restoration_cents
        type: integer
        source: computed
        default: 0
        description: "Waterfall allocation to bucket 3"
      - name: allocated_holdover_cents
        type: integer
        source: computed
        default: 0
        description: "Waterfall allocation to bucket 4"
      - name: unpaid_landlord_balance_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of the four bucket amounts minus the sum of the four allocations"
      - name: residual_to_retailer_cents
        type: integer
        source: computed
        default: 0
        description: "max(0, available_cents - sum of the four bucket amounts)"
      - name: surrendered_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant at which possession was delivered"

  # ------------------------------------------------------------------- Settlement
  - name: Settlement
    parent: Engagement
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id; engagement being settled, taken from the path"
      - name: settlement_basis
        type: enum
        source: input
        description: "PROVISIONAL includes in-review sales days and submitted expenses; FINAL includes only posted days and approved/settled expenses"
        constraints: "one of {PROVISIONAL, FINAL}"
      - name: settlement_status
        type: enum
        source: computed
        default: DRAFT
        description: "Lifecycle state; see §1.2"
        constraints: "one of {DRAFT, PROPOSED, DISPUTED, ACCEPTED, FINALIZED, SUPERSEDED}"
      - name: gross_recovery_cents
        type: integer
        source: computed
        default: 0
        description: "Numerator of the split; see calculations.engagement_settlement_split"
      - name: original_net_sales_cents
        type: integer
        source: computed
        default: 0
        description: "ORIGINAL-merchandise net sales inside the basis inclusion set"
      - name: recovery_ratio
        type: number
        source: computed
        default: 0.0
        description: "round_half_up(original_net_sales_cents / Engagement.original_cost_value_cents, 4); exactly 0.0000 when the denominator is 0"
      - name: fee_rate
        type: number
        source: computed
        default: 0.0
        description: "Tier rate selected from recovery_ratio by FEE_TIER_TABLE"
      - name: liquidator_fee_cents
        type: integer
        source: computed
        default: 0
        description: "round_half_up(gross_recovery_cents * fee_rate)"
      - name: guaranty_amount_cents
        type: integer
        source: computed
        default: 0
        description: "Engagement.guaranty_amount_cents frozen at computation time"
      - name: expense_total_cents
        type: integer
        source: computed
        default: 0
        description: "Expense total inside the basis inclusion set"
      - name: liquidator_expense_cents
        type: integer
        source: computed
        default: 0
        description: "Liquidator portion of expense_total_cents under Engagement.expense_responsibility"
      - name: retailer_expense_cents
        type: integer
        source: computed
        default: 0
        description: "expense_total_cents - liquidator_expense_cents"
      - name: retailer_proceeds_cents
        type: integer
        source: computed
        default: 0
        description: "Retailer's economics under Engagement.economics_model; may be negative"
      - name: liquidator_proceeds_cents
        type: integer
        source: computed
        default: 0
        description: "gross_recovery_cents - expense_total_cents - retailer_proceeds_cents; may be negative"
      - name: retention_accrual_cents
        type: integer
        source: computed
        default: 0
        description: "Engagement.retention_accrual_cents frozen at computation time (disclosure line, not part of the split)"
      - name: dispute_reason
        type: string
        source: input
        default: null
        description: "Reason recorded by the retailer when disputing a proposed settlement"
      - name: dispute_round
        type: integer
        source: computed
        default: 0
        description: "Number of times this settlement has been disputed and re-proposed"
      - name: computed_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant at which the split numbers were last recomputed"
      - name: proposed_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the LiquidationConsultant who proposed the settlement"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ------------------------------------------------------------------ Engagement
  # Cyclic: PENDING_RETAILER_APPROVAL -> DRAFT revision loop.
  # Compound: WIND_DOWN requires every child Store to be terminal.
  - entity: Engagement
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: PENDING_RETAILER_APPROVAL
        trigger: "POST /engagements/{id}/submit-for-approval"
        actor: LiquidationConsultant
        preconditions:
          - "engagement_status == DRAFT"
          - "count(Store where engagement_id == this.id) >= 1"
          - "every Store of this engagement has at least one InventoryLot with source == ORIGINAL"
        side_effects:
          - "recompute Engagement.original_cost_value_cents from ORIGINAL lots of all stores"
          - "recompute Engagement.guaranty_amount_cents = round_half_up(original_cost_value_cents * guaranty_pct) for GUARANTEED/HYBRID, else 0"
          - "recompute Engagement.projected_gross_recovery_cents and Engagement.projected_shortfall_cents"
          - "increments Engagement.version by 1"
      - from: PENDING_RETAILER_APPROVAL
        to: DRAFT
        trigger: "POST /engagements/{id}/approval-decision with decision == RETURN_FOR_REVISION"
        actor: RetailerController
        preconditions:
          - "engagement_status == PENDING_RETAILER_APPROVAL"
        side_effects:
          - "no store transitions occur"
          - "increments Engagement.version by 1"
        note: "Revision loop — the pair (submit-for-approval, RETURN_FOR_REVISION) may repeat without limit."
      - from: PENDING_RETAILER_APPROVAL
        to: ACTIVE
        trigger: "POST /engagements/{id}/approval-decision with decision == APPROVE"
        actor: RetailerController
        preconditions:
          - "engagement_status == PENDING_RETAILER_APPROVAL"
        side_effects:
          - "conditional cascade over every Store with store_status == PLANNED: when its Jurisdiction.gob_license_required == true the store becomes LICENSE_PENDING; otherwise the store becomes SELLING with selling_start_date = Engagement.sale_start_date"
          - "increments Engagement.version by 1 and each affected Store.version by 1"
      - from: ACTIVE
        to: WIND_DOWN
        trigger: "POST /engagements/{id}/wind-down"
        actor: LiquidationConsultant
        preconditions:
          - "engagement_status == ACTIVE"
          - "every Store of this engagement has store_status IN {CLOSED, SURRENDERED} (else ERR_STORES_NOT_CLOSED)"
        side_effects:
          - "recompute Engagement.retention_accrual_cents"
          - "increments Engagement.version by 1"
      - from: WIND_DOWN
        to: CLOSED
        trigger: "system event — Settlement with settlement_basis == FINAL reaches FINALIZED"
        actor: system
        preconditions:
          - "engagement_status == WIND_DOWN"
        side_effects:
          - "every ExpenseItem of this engagement with expense_status == APPROVED becomes SETTLED"
          - "increments Engagement.version by 1"

  # ----------------------------------------------------------------------- Store
  # Cyclic: SELLING <-> SUSPENDED.  Guarded: entry to SELLING depends on GobLicense.
  - entity: Store
    initial_state: PLANNED
    terminal_states: [SURRENDERED]
    transitions:
      - from: PLANNED
        to: LICENSE_PENDING
        trigger: "system event — owning Engagement enters ACTIVE while Jurisdiction.gob_license_required == true"
        actor: system
        preconditions:
          - "store_status == PLANNED"
        side_effects:
          - "increments Store.version by 1"
      - from: PLANNED
        to: SELLING
        trigger: "system event — owning Engagement enters ACTIVE while Jurisdiction.gob_license_required == false"
        actor: system
        preconditions:
          - "store_status == PLANNED"
        side_effects:
          - "sets Store.selling_start_date = Engagement.sale_start_date"
          - "increments Store.version by 1"
      - from: LICENSE_PENDING
        to: SELLING
        trigger: "system event — a GobLicense of this store is APPROVED (POST /gob-licenses/{id}/decision with decision == APPROVE)"
        actor: system
        preconditions:
          - "store_status == LICENSE_PENDING"
        side_effects:
          - "sets Store.selling_start_date = GobLicense.period_start_date"
          - "increments Store.version by 1"
      - from: SELLING
        to: SUSPENDED
        trigger: "system event — the store's APPROVED GobLicense becomes REVOKED (POST /gob-licenses/{id}/revoke) or EXPIRED (POST /engagements/{id}/compliance-sweep)"
        actor: system
        preconditions:
          - "store_status == SELLING"
        side_effects:
          - "sets Store.suspension_reason = LICENSE_REVOKED or LICENSE_EXPIRED to match the causing licence event"
          - "cascade hop 3: every MarkdownStage of this store with stage_status == ACTIVE becomes CLOSED with closed_reason = LICENSE_LOST"
          - "cascade hop 4 (caused by hop 3 leaving the ARMED/ACTIVE stage set): recompute Store.planned_avg_discount_pct, Store.projected_gross_recovery_cents and Store.projected_recovery_ratio"
          - "cascade hop 5 (caused by hop 4): recompute Engagement.projected_gross_recovery_cents and Engagement.projected_shortfall_cents"
          - "increments Store.version by 1"
      - from: SELLING
        to: SUSPENDED
        trigger: "POST /stores/{id}/suspend"
        actor: ComplianceOfficer
        preconditions:
          - "store_status == SELLING"
        side_effects:
          - "sets Store.suspension_reason = COMPLIANCE_HOLD unless the request supplies another reason"
          - "every MarkdownStage of this store with stage_status == ACTIVE becomes CLOSED with closed_reason = LICENSE_LOST"
          - "recompute Store.planned_avg_discount_pct, Store.projected_gross_recovery_cents and Store.projected_recovery_ratio, then the engagement roll-up"
          - "does NOT increment Engagement.compliance_strike_count — only licence loss produces a strike"
          - "increments Store.version by 1"
      - from: SUSPENDED
        to: SELLING
        trigger: "POST /stores/{id}/resume"
        actor: ComplianceOfficer
        preconditions:
          - "store_status == SUSPENDED"
          - "at least one GobLicense of this store has license_status == APPROVED, or Jurisdiction.gob_license_required == false (else ERR_LICENSE_NOT_ACTIVE)"
        side_effects:
          - "sets Store.suspension_reason = NONE"
          - "increments Store.version by 1"
        note: "Cycle — a store may be suspended and resumed any number of times."
      - from: SELLING
        to: CLOSED
        trigger: "POST /stores/{id}/close-selling"
        actor: LiquidationConsultant
        preconditions:
          - "store_status IN {SELLING, SUSPENDED}"
          - "Engagement.compliance_posture != FROZEN is NOT required — closing is always permitted"
        side_effects:
          - "cascade hop 1: sets Store.selling_end_date = logical clock date; recompute Store.realized_sell_through_pct"
          - "cascade hop 2 (caused by hop 1): every MarkdownStage of this store with stage_status IN {ARMED, ACTIVE} becomes CLOSED with closed_reason = STORE_CLOSED"
          - "cascade hop 3 (caused by hop 2 ending the cadence): every Employee of this store with bonus_status == PENDING is settled by calculations.retention_bonus_settlement, and every such Employee with employment_status IN {ACTIVE, NOTICE_GIVEN} becomes TERMINATED_INVOLUNTARY with termination_date = Store.selling_end_date"
          - "cascade hop 4 (caused by hop 3 writing Employee.earned_bonus_cents): recompute Engagement.retention_accrual_cents as the sum of per-employee rounded amounts"
          - "cascade hop 5 (caused by hop 4 being non-zero): create one ExpenseItem with auto_generated = true, expense_category = PAYROLL, store_id = this store, amount_cents = sum of earned_bonus_cents of this store's employees, expense_status = APPROVED, incurred_date = Store.selling_end_date; skipped entirely when that sum is 0"
          - "cascade hop 6 (caused by hop 5): calculations.expense_responsibility_split runs on the new item and Engagement.expense_total_cents / expense_liquidator_share_cents / expense_retailer_share_cents are recomputed"
          - "increments Store.version by 1"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /stores/{id}/close-selling"
        actor: LiquidationConsultant
        preconditions:
          - "store_status IN {SELLING, SUSPENDED}"
        side_effects:
          - "identical cascade hops 1-6 as the SELLING -> CLOSED transition"
          - "increments Store.version by 1"
      - from: CLOSED
        to: SURRENDERED
        trigger: "system event — the store's LeaseDisposition reaches SURRENDERED (POST /lease-dispositions/{id}/surrender)"
        actor: system
        preconditions:
          - "store_status == CLOSED"
        side_effects:
          - "increments Store.version by 1"

  # ------------------------------------------------------------------ GobLicense
  - entity: GobLicense
    initial_state: APPLIED
    terminal_states: [DENIED, EXPIRED, REVOKED]
    transitions:
      - from: APPLIED
        to: APPROVED
        trigger: "POST /gob-licenses/{id}/decision with decision == APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "license_status == APPLIED"
          - "X-User-ID != GobLicense.applied_by_user_id (else ERR_SELF_APPROVAL_FORBIDDEN)"
        side_effects:
          - "sets decided_by_user_id = X-User-ID"
          - "cross-entity: owning Store with store_status == LICENSE_PENDING becomes SELLING with selling_start_date = period_start_date"
          - "increments GobLicense.version by 1"
      - from: APPLIED
        to: DENIED
        trigger: "POST /gob-licenses/{id}/decision with decision == DENY"
        actor: ComplianceOfficer
        preconditions:
          - "license_status == APPLIED"
          - "X-User-ID != GobLicense.applied_by_user_id (else ERR_SELF_APPROVAL_FORBIDDEN)"
        side_effects:
          - "sets decided_by_user_id = X-User-ID; owning Store stays LICENSE_PENDING"
          - "increments GobLicense.version by 1"
      - from: APPROVED
        to: REVOKED
        trigger: "POST /gob-licenses/{id}/revoke"
        actor: ComplianceOfficer
        preconditions:
          - "license_status == APPROVED"
        side_effects:
          - "cascade hop 1: sets revoked_reason"
          - "cascade hop 2 (caused by hop 1): owning Store with store_status == SELLING becomes SUSPENDED with suspension_reason = LICENSE_REVOKED, which itself fires the Store SELLING -> SUSPENDED cascade hops 3-5"
          - "fan-out (not part of the chain): Engagement.compliance_strike_count += 1 and Engagement.compliance_posture recomputed"
          - "increments GobLicense.version by 1 and Store.version by 1"
      - from: APPROVED
        to: EXPIRED
        trigger: "system event — POST /engagements/{id}/compliance-sweep observes period_end_date < logical clock date"
        actor: system
        preconditions:
          - "license_status == APPROVED"
          - "period_end_date < logical clock date"
        side_effects:
          - "owning Store with store_status == SELLING becomes SUSPENDED with suspension_reason = LICENSE_EXPIRED, firing the Store SELLING -> SUSPENDED cascade hops 3-5"
          - "Engagement.compliance_strike_count += 1 and Engagement.compliance_posture recomputed"
          - "increments GobLicense.version by 1"

  # ---------------------------------------------------------------- MarkdownStage
  # Branching: ARMED -> ACTIVE -> CLOSED and ARMED -> VOIDED (supersede branch),
  # with divergent side-effect sets per branch.
  - entity: MarkdownStage
    initial_state: ARMED
    terminal_states: [CLOSED, VOIDED]
    transitions:
      - from: ARMED
        to: ACTIVE
        trigger: "POST /markdown-stages/{id}/activate"
        actor: LiquidationConsultant
        preconditions:
          - "stage_status == ARMED"
          - "Store.store_status == SELLING (else ERR_STORE_NOT_SELLING)"
          - "when Jurisdiction.gob_license_required == true, a GobLicense of the store with license_status == APPROVED must satisfy period_start_date <= window_start_date AND period_end_date >= (window_end_date - 1 day) (else ERR_LICENSE_NOT_ACTIVE)"
          - "no other MarkdownStage of the store has stage_status == ACTIVE (else ERR_STAGE_ALREADY_ACTIVE)"
          - "Engagement.compliance_posture != FROZEN (else ERR_ENGAGEMENT_COMPLIANCE_FROZEN)"
        side_effects:
          - "sets activated_at = logical clock instant"
          - "recompute Store.planned_avg_discount_pct (membership unchanged: ARMED and ACTIVE are both in the set) — value unchanged by this transition"
          - "increments MarkdownStage.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /markdown-stages/{id}/checkpoint"
        actor: LiquidationConsultant
        preconditions:
          - "stage_status == ACTIVE"
          - "Store.store_status == SELLING (else ERR_STORE_NOT_SELLING)"
        side_effects:
          - "runs calculations.markdown_escalation_adjustment"
          - "sets checkpoint_sell_through_pct = Store.realized_sell_through_pct and escalation_applied_pct"
          - "sets closed_reason = ESCALATED when escalation_applied_pct > 0, else ON_SCHEDULE"
          - "when escalation_applied_pct > 0, the successor MarkdownStage (stage_index == this.stage_index + 1, stage_status == ARMED) has its discount_pct raised in place and its version incremented"
          - "recompute Store.planned_avg_discount_pct, Store.projected_gross_recovery_cents, Store.projected_recovery_ratio, then Engagement.projected_gross_recovery_cents and Engagement.projected_shortfall_cents"
          - "increments MarkdownStage.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "system event — POST /engagements/{id}/compliance-sweep observes window_end_date <= logical clock date"
        actor: system
        preconditions:
          - "stage_status == ACTIVE"
        side_effects:
          - "sets closed_reason = ON_SCHEDULE and escalation_applied_pct = 0.0000 — the sweep never escalates"
          - "the successor stage (stage_index == this.stage_index + 1, stage_status == ARMED) becomes ACTIVE when Store.store_status == SELLING"
          - "recompute Store.planned_avg_discount_pct and the projected-recovery chain"
          - "increments MarkdownStage.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "system event — Store enters SUSPENDED because its licence was revoked or expired"
        actor: system
        preconditions:
          - "stage_status == ACTIVE"
        side_effects:
          - "sets closed_reason = LICENSE_LOST, escalation_applied_pct = 0.0000, checkpoint_sell_through_pct = null"
          - "increments MarkdownStage.version by 1"
      - from: ARMED
        to: CLOSED
        trigger: "system event — Store enters CLOSED via POST /stores/{id}/close-selling"
        actor: system
        preconditions:
          - "stage_status IN {ARMED, ACTIVE}"
        side_effects:
          - "sets closed_reason = STORE_CLOSED"
          - "increments MarkdownStage.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "system event — Store enters CLOSED via POST /stores/{id}/close-selling"
        actor: system
        preconditions:
          - "stage_status IN {ARMED, ACTIVE}"
        side_effects:
          - "sets closed_reason = STORE_CLOSED"
          - "increments MarkdownStage.version by 1"
      - from: ARMED
        to: VOIDED
        trigger: "system event — POST /stores/{id}/markdown-stages with supersede_overlapping == true creates a stage whose half-open window overlaps this one"
        actor: system
        preconditions:
          - "stage_status == ARMED"
        side_effects:
          - "sets closed_reason = SUPERSEDED"
          - "recompute Store.planned_avg_discount_pct (this stage leaves the ARMED/ACTIVE set) and the projected-recovery chain"
          - "increments MarkdownStage.version by 1"
        note: "Supersede branch — divergent from the ARMED -> ACTIVE branch: no activated_at, no escalation, and the stage leaves the planned-discount set."

  # ------------------------------------------------------ AugmentationConsignment
  - entity: AugmentationConsignment
    initial_state: PROPOSED
    terminal_states: [RETURNED, SOLD_OUT]
    transitions:
      - from: PROPOSED
        to: DISCLOSURE_FILED
        trigger: "POST /augmentation-consignments/{id}/file-disclosure"
        actor: ComplianceOfficer
        preconditions:
          - "consignment_status == PROPOSED"
        side_effects:
          - "sets disclosure_reference and disclosure_filed_at = logical clock instant"
          - "increments AugmentationConsignment.version by 1"
      - from: DISCLOSURE_FILED
        to: RECEIVED
        trigger: "POST /augmentation-consignments/{id}/receive"
        actor: LiquidationConsultant
        preconditions:
          - "consignment_status IN {PROPOSED, DISCLOSURE_FILED}"
          - "Store.store_status IN {SELLING, SUSPENDED} (else ERR_STORE_NOT_SELLING)"
          - "Engagement.compliance_posture == OPEN (else ERR_ENGAGEMENT_COMPLIANCE_RESTRICTED for RESTRICTED, ERR_ENGAGEMENT_COMPLIANCE_FROZEN for FROZEN)"
          - "Jurisdiction.max_augmentation_ratio > 0 (else ERR_AUGMENTATION_PROHIBITED)"
          - "when Jurisdiction.augmentation_disclosure_required == true, consignment_status must be DISCLOSURE_FILED (else ERR_AUGMENTATION_DISCLOSURE_MISSING)"
          - "when Jurisdiction.advertising_disclosure_required == true, an APPROVED GobLicense of the store must include AUGMENTED_MERCHANDISE_DISCLOSURE in advertising_claim_codes (else ERR_ADVERTISING_DISCLOSURE_REQUIRED)"
          - "post-receipt augmentation ratio <= Jurisdiction.max_augmentation_ratio (else ERR_AUGMENTATION_CAP_EXCEEDED)"
        side_effects:
          - "creates one InventoryLot with source = AUGMENTATION, consignment_id = this.id, category/units_initial/unit_cost_cents/unit_retail_cents copied from the consignment, units_on_hand = units_supplied, lot_status = ON_FLOOR"
          - "recompute Store.augmentation_cost_value_cents, Store.units_initial_total, Store.augmentation_units_accounted, Store.realized_sell_through_pct"
          - "recompute Store.projected_gross_recovery_cents / projected_recovery_ratio, then Engagement.projected_gross_recovery_cents / projected_shortfall_cents"
          - "increments AugmentationConsignment.version by 1 and Store.version by 1"
      - from: PROPOSED
        to: RECEIVED
        trigger: "POST /augmentation-consignments/{id}/receive in a jurisdiction whose augmentation_disclosure_required == false"
        actor: LiquidationConsultant
        preconditions:
          - "consignment_status IN {PROPOSED, DISCLOSURE_FILED}"
          - "Jurisdiction.augmentation_disclosure_required == false"
          - "all other preconditions of the DISCLOSURE_FILED -> RECEIVED transition"
        side_effects:
          - "identical side effects to the DISCLOSURE_FILED -> RECEIVED transition"
      - from: RECEIVED
        to: RETURNED
        trigger: "POST /augmentation-consignments/{id}/return-unsold"
        actor: LiquidationConsultant
        preconditions:
          - "consignment_status == RECEIVED"
          - "the consignment's InventoryLot has units_on_hand >= 1 (else ERR_CONSIGNMENT_STATE_INVALID)"
        side_effects:
          - "compensating action: sets InventoryLot.units_returned += units_on_hand, then units_on_hand = 0 and lot_status = RETURNED_TO_SUPPLIER"
          - "sets AugmentationConsignment.units_returned to the same amount"
          - "recompute InventoryLot.cost_value_cents / retail_value_cents from (units_initial - units_returned)"
          - "recompute Store.augmentation_cost_value_cents, Store.units_initial_total, Store.augmentation_units_accounted, Store.realized_sell_through_pct"
          - "recompute the projected-recovery chain on Store then Engagement"
          - "increments AugmentationConsignment.version by 1, InventoryLot.version by 1 and Store.version by 1"
        note: "Conservation invariant: Store.augmentation_units_accounted is unchanged by this action — units move from units_on_hand into units_returned."
      - from: RECEIVED
        to: SOLD_OUT
        trigger: "system event — a POSTED SalesDay allocation drives the consignment's InventoryLot.units_on_hand to 0"
        actor: system
        preconditions:
          - "consignment_status == RECEIVED"
        side_effects:
          - "sets the InventoryLot.lot_status = SOLD_OUT"
          - "increments AugmentationConsignment.version by 1"

  # ----------------------------------------------------------------- InventoryLot
  - entity: InventoryLot
    initial_state: ON_FLOOR
    terminal_states: [RETURNED_TO_SUPPLIER]
    transitions:
      - from: ON_FLOOR
        to: SOLD_OUT
        trigger: "system event — POST /sales-days/{id}/review with decision == POST allocates the last unit on hand"
        actor: system
        preconditions:
          - "lot_status == ON_FLOOR"
          - "units_on_hand reaches exactly 0 after the allocation"
        side_effects:
          - "increments InventoryLot.version by 1"
      - from: ON_FLOOR
        to: RETURNED_TO_SUPPLIER
        trigger: "system event — POST /augmentation-consignments/{id}/return-unsold"
        actor: system
        preconditions:
          - "lot_status == ON_FLOOR"
          - "source == AUGMENTATION"
        side_effects:
          - "units_returned += units_on_hand; units_on_hand = 0"
          - "increments InventoryLot.version by 1"

  # -------------------------------------------------------------------- Employee
  # PARALLEL STATE DIMENSIONS on one row: employment_status (ACTIVE, NOTICE_GIVEN,
  # TERMINATED_INVOLUNTARY, TERMINATED_VOLUNTARY) evolves independently of
  # bonus_status (PENDING, EARNED, PRORATED_EARNED, FORFEITED, PAID). The state
  # names are disjoint across the two axes, so each transition below names its axis
  # unambiguously. Bonus axis initial state is PENDING.
  - entity: Employee
    initial_state: ACTIVE
    terminal_states: [TERMINATED_INVOLUNTARY, TERMINATED_VOLUNTARY, FORFEITED, PAID]
    transitions:
      - from: ACTIVE
        to: NOTICE_GIVEN
        trigger: "POST /employees/{id}/employment-action with action == GIVE_NOTICE"
        actor: StoreManager
        preconditions:
          - "employment_status == ACTIVE"
          - "X-User-ID == Employee.store_id (else ERR_STORE_SCOPE_VIOLATION)"
        side_effects:
          - "sets notice_given_date = logical clock date"
          - "bonus_status is untouched — the axes are independent"
          - "increments Employee.version by 1"
      - from: NOTICE_GIVEN
        to: TERMINATED_INVOLUNTARY
        trigger: "POST /employees/{id}/employment-action with action == TERMINATE_INVOLUNTARY"
        actor: StoreManager
        preconditions:
          - "employment_status IN {ACTIVE, NOTICE_GIVEN}"
          - "X-User-ID == Employee.store_id (else ERR_STORE_SCOPE_VIOLATION)"
        side_effects:
          - "sets termination_date = logical clock date"
          - "when bonus_status == PENDING, calculations.retention_bonus_settlement runs immediately for this employee using the logical clock date as the settlement day, then Engagement.retention_accrual_cents is recomputed"
          - "increments Employee.version by 1"
      - from: ACTIVE
        to: TERMINATED_INVOLUNTARY
        trigger: "POST /employees/{id}/employment-action with action == TERMINATE_INVOLUNTARY"
        actor: StoreManager
        preconditions:
          - "employment_status IN {ACTIVE, NOTICE_GIVEN}"
        side_effects:
          - "identical to the NOTICE_GIVEN -> TERMINATED_INVOLUNTARY transition"
      - from: ACTIVE
        to: TERMINATED_VOLUNTARY
        trigger: "POST /employees/{id}/employment-action with action == TERMINATE_VOLUNTARY"
        actor: StoreManager
        preconditions:
          - "employment_status IN {ACTIVE, NOTICE_GIVEN}"
          - "X-User-ID == Employee.store_id (else ERR_STORE_SCOPE_VIOLATION)"
        side_effects:
          - "sets termination_date = logical clock date"
          - "bonus axis: bonus_status PENDING -> FORFEITED with earned_bonus_cents = 0 (a voluntary quit always forfeits)"
          - "recompute Engagement.retention_accrual_cents"
          - "increments Employee.version by 1"
      - from: NOTICE_GIVEN
        to: TERMINATED_VOLUNTARY
        trigger: "POST /employees/{id}/employment-action with action == TERMINATE_VOLUNTARY"
        actor: StoreManager
        preconditions:
          - "employment_status IN {ACTIVE, NOTICE_GIVEN}"
        side_effects:
          - "identical to the ACTIVE -> TERMINATED_VOLUNTARY transition"
      - from: PENDING
        to: EARNED
        trigger: "system event — calculations.retention_bonus_settlement yields service ratio >= 1.0 and attendance_rate >= MIN_ATTENDANCE_RATE"
        actor: system
        preconditions:
          - "bonus_status == PENDING"
        side_effects:
          - "sets served_days and earned_bonus_cents = retention_bonus_cents"
          - "recompute Engagement.retention_accrual_cents"
          - "increments Employee.version by 1"
      - from: PENDING
        to: PRORATED_EARNED
        trigger: "system event — calculations.retention_bonus_settlement yields service ratio < 1.0 with attendance_rate >= MIN_ATTENDANCE_RATE and employment_status != TERMINATED_VOLUNTARY"
        actor: system
        preconditions:
          - "bonus_status == PENDING"
        side_effects:
          - "sets served_days and earned_bonus_cents = round_half_up(retention_bonus_cents * served_days / required_days)"
          - "recompute Engagement.retention_accrual_cents"
          - "increments Employee.version by 1"
      - from: PENDING
        to: FORFEITED
        trigger: "system event — calculations.retention_bonus_settlement yields attendance_rate < MIN_ATTENDANCE_RATE, or the employee reached TERMINATED_VOLUNTARY"
        actor: system
        preconditions:
          - "bonus_status == PENDING"
        side_effects:
          - "sets earned_bonus_cents = 0"
          - "increments Employee.version by 1"
      - from: EARNED
        to: PAID
        trigger: "POST /employees/{id}/pay-bonus"
        actor: RetailerController
        preconditions:
          - "bonus_status IN {EARNED, PRORATED_EARNED} (else ERR_BONUS_NOT_EARNED)"
          - "Store.store_status IN {CLOSED, SURRENDERED} (else ERR_STORE_NOT_SELLING)"
        side_effects:
          - "sets bonus_paid_at = logical clock instant"
          - "Engagement.retention_accrual_cents is unchanged — PAID stays inside the accrual inclusion set"
          - "increments Employee.version by 1"
      - from: PRORATED_EARNED
        to: PAID
        trigger: "POST /employees/{id}/pay-bonus"
        actor: RetailerController
        preconditions:
          - "bonus_status IN {EARNED, PRORATED_EARNED} (else ERR_BONUS_NOT_EARNED)"
          - "Store.store_status IN {CLOSED, SURRENDERED}"
        side_effects:
          - "identical to the EARNED -> PAID transition"

  # -------------------------------------------------------------------- SalesDay
  - entity: SalesDay
    initial_state: PENDING_REVIEW
    terminal_states: [POSTED, REJECTED]
    transitions:
      - from: PENDING_REVIEW
        to: POSTED
        trigger: "POST /sales-days/{id}/review with decision == POST"
        actor: RetailerController
        preconditions:
          - "day_status == PENDING_REVIEW (else ERR_SALES_DAY_STATE_INVALID)"
          - "original_units_sold <= sum of units_on_hand over ORIGINAL ON_FLOOR lots of the store AND augmentation_units_sold <= sum of units_on_hand over AUGMENTATION ON_FLOOR lots of the store (else ERR_UNITS_EXCEED_ON_HAND)"
        side_effects:
          - "sets posted_at = logical clock instant and reviewed_by_user_id = X-User-ID"
          - "waterfall allocation per calculations.sales_day_unit_allocation writes InventoryLot.units_sold / units_on_hand and allocation_note"
          - "lots driven to units_on_hand == 0 become SOLD_OUT; an AUGMENTATION lot doing so drives its AugmentationConsignment to SOLD_OUT"
          - "recompute Store.units_sold_total, Store.realized_sell_through_pct, Store.realized_gross_recovery_cents, Store.realized_recovery_ratio"
          - "recompute Engagement.original_net_sales_cents, augmentation_net_sales_cents, gross_recovery_cents"
          - "increments SalesDay.version by 1 and each allocated InventoryLot.version by 1"
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /sales-days/{id}/review with decision == REJECT"
        actor: RetailerController
        preconditions:
          - "day_status == PENDING_REVIEW (else ERR_SALES_DAY_STATE_INVALID)"
        side_effects:
          - "sets reviewed_by_user_id = X-User-ID; no unit allocation and no ledger recomputation occurs"
          - "the day leaves the PROVISIONAL settlement inclusion set as well as the FINAL one"
          - "increments SalesDay.version by 1"

  # ----------------------------------------------------------------- ExpenseItem
  - entity: ExpenseItem
    initial_state: SUBMITTED
    terminal_states: [VOIDED, SETTLED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /expense-items/{id}/decision with action == APPROVE"
        actor: RetailerController
        preconditions:
          - "expense_status == SUBMITTED"
          - "Engagement.engagement_status IN {ACTIVE, WIND_DOWN} (else ERR_ENGAGEMENT_STATE_INVALID)"
        side_effects:
          - "runs calculations.expense_responsibility_split writing liquidator_share_cents and retailer_share_cents"
          - "sets decided_by_user_id = X-User-ID"
          - "recompute Engagement.expense_total_cents, expense_liquidator_share_cents, expense_retailer_share_cents"
          - "increments ExpenseItem.version by 1"
      - from: SUBMITTED
        to: VOIDED
        trigger: "POST /expense-items/{id}/decision with action == VOID"
        actor: RetailerController
        preconditions:
          - "expense_status IN {SUBMITTED, APPROVED} (else ERR_EXPENSE_STATE_INVALID)"
        side_effects:
          - "sets liquidator_share_cents = 0 and retailer_share_cents = 0"
          - "recompute the three Engagement expense aggregates — a SUBMITTED item was never inside them, so they do not move"
          - "increments ExpenseItem.version by 1"
      - from: APPROVED
        to: VOIDED
        trigger: "POST /expense-items/{id}/decision with action == VOID"
        actor: RetailerController
        preconditions:
          - "expense_status IN {SUBMITTED, APPROVED}"
        side_effects:
          - "compensating action: sets liquidator_share_cents = 0 and retailer_share_cents = 0 and removes the item from the three Engagement expense aggregates, restoring them to their exact pre-approval values"
          - "increments ExpenseItem.version by 1"
      - from: APPROVED
        to: SETTLED
        trigger: "system event — a FINAL Settlement of the engagement reaches FINALIZED"
        actor: system
        preconditions:
          - "expense_status == APPROVED"
        side_effects:
          - "the three Engagement expense aggregates are unchanged (APPROVED and SETTLED are both inside the inclusion set)"
          - "increments ExpenseItem.version by 1"

  # ------------------------------------------------------------ LeaseDisposition
  # CYCLIC: OFFER_SENT -> LANDLORD_COUNTERED -> OFFER_SENT, bounded by
  # MAX_NEGOTIATION_ROUNDS.
  - entity: LeaseDisposition
    initial_state: DRAFT
    terminal_states: [REJECTED_FINAL, SURRENDERED]
    transitions:
      - from: DRAFT
        to: OFFER_SENT
        trigger: "POST /lease-dispositions/{id}/offer"
        actor: LiquidationConsultant
        preconditions:
          - "disposition_status IN {DRAFT, LANDLORD_COUNTERED} (else ERR_LEASE_STATE_INVALID)"
          - "negotiation_round + 1 <= MAX_NEGOTIATION_ROUNDS (else ERR_MAX_NEGOTIATION_ROUNDS)"
        side_effects:
          - "negotiation_round += 1; sets offered_surrender_payment_cents"
          - "increments LeaseDisposition.version by 1"
      - from: LANDLORD_COUNTERED
        to: OFFER_SENT
        trigger: "POST /lease-dispositions/{id}/offer"
        actor: LiquidationConsultant
        preconditions:
          - "disposition_status IN {DRAFT, LANDLORD_COUNTERED}"
          - "negotiation_round + 1 <= MAX_NEGOTIATION_ROUNDS (else ERR_MAX_NEGOTIATION_ROUNDS)"
        side_effects:
          - "negotiation_round += 1; sets offered_surrender_payment_cents (revised offer)"
          - "increments LeaseDisposition.version by 1"
        note: "Closes the negotiation cycle — offer and counter may alternate up to MAX_NEGOTIATION_ROUNDS offers."
      - from: OFFER_SENT
        to: LANDLORD_COUNTERED
        trigger: "POST /lease-dispositions/{id}/landlord-response with response == COUNTER"
        actor: LiquidationConsultant
        preconditions:
          - "disposition_status == OFFER_SENT"
        side_effects:
          - "sets landlord_counter_amount_cents; negotiation_round is unchanged"
          - "increments LeaseDisposition.version by 1"
      - from: OFFER_SENT
        to: AGREED
        trigger: "POST /lease-dispositions/{id}/landlord-response with response == ACCEPT"
        actor: LiquidationConsultant
        preconditions:
          - "disposition_status == OFFER_SENT"
        side_effects:
          - "sets agreed_surrender_payment_cents = offered_surrender_payment_cents and landlord_agreed_date = the logical clock date"
          - "increments LeaseDisposition.version by 1"
      - from: OFFER_SENT
        to: REJECTED_FINAL
        trigger: "POST /lease-dispositions/{id}/landlord-response with response == REJECT"
        actor: LiquidationConsultant
        preconditions:
          - "disposition_status == OFFER_SENT"
        side_effects:
          - "the lease is left to expire on its own terms; the store may still be settled because REJECTED_FINAL is a terminal disposition"
          - "increments LeaseDisposition.version by 1"
      - from: AGREED
        to: SURRENDERED
        trigger: "POST /lease-dispositions/{id}/surrender"
        actor: LiquidationConsultant
        preconditions:
          - "disposition_status == AGREED (else ERR_LEASE_STATE_INVALID)"
          - "Store.store_status == CLOSED (else ERR_STORE_NOT_SELLING)"
          - "fixture_sale_price_cents >= fixture_reserve_price_cents unless reserve_waived == true (else ERR_FIXTURE_BELOW_RESERVE)"
        side_effects:
          - "sets fixture_sale_price_cents, holdover_days, holdover_penalty_cents"
          - "runs calculations.lease_surrender_waterfall writing the four allocated_* fields, unpaid_landlord_balance_cents and residual_to_retailer_cents"
          - "sets surrendered_at = logical clock instant"
          - "cross-entity: owning Store transitions CLOSED -> SURRENDERED"
          - "increments LeaseDisposition.version by 1 and Store.version by 1"

  # ------------------------------------------------------------------ Settlement
  # CYCLIC: PROPOSED -> DISPUTED -> PROPOSED dispute loop.
  - entity: Settlement
    initial_state: DRAFT
    terminal_states: [FINALIZED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /settlements/{id}/propose"
        actor: LiquidationConsultant
        preconditions:
          - "settlement_status IN {DRAFT, DISPUTED} (else ERR_SETTLEMENT_STATE_INVALID)"
          - "when settlement_basis == FINAL, Engagement.engagement_status == WIND_DOWN (else ERR_SETTLEMENT_BASIS_INVALID)"
          - "when settlement_basis == FINAL, every Store of the engagement has store_status IN {CLOSED, SURRENDERED} (else ERR_STORES_NOT_CLOSED)"
        side_effects:
          - "runs calculations.engagement_settlement_split under settlement_basis and writes all sixteen computed money fields"
          - "sets computed_at = logical clock instant and proposed_by_user_id = X-User-ID"
          - "increments Settlement.version by 1"
      - from: DISPUTED
        to: PROPOSED
        trigger: "POST /settlements/{id}/propose"
        actor: LiquidationConsultant
        preconditions:
          - "settlement_status IN {DRAFT, DISPUTED}"
        side_effects:
          - "recomputes the split from current data (numbers may move if sales days were posted or expenses approved since the last proposal)"
          - "increments Settlement.version by 1"
        note: "Closes the dispute cycle."
      - from: PROPOSED
        to: DISPUTED
        trigger: "POST /settlements/{id}/response with response == DISPUTE"
        actor: RetailerController
        preconditions:
          - "settlement_status == PROPOSED"
        side_effects:
          - "sets dispute_reason; dispute_round += 1"
          - "increments Settlement.version by 1"
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /settlements/{id}/response with response == ACCEPT"
        actor: RetailerController
        preconditions:
          - "settlement_status == PROPOSED"
        side_effects:
          - "increments Settlement.version by 1"
      - from: ACCEPTED
        to: FINALIZED
        trigger: "POST /settlements/{id}/finalize"
        actor: LiquidationConsultant
        preconditions:
          - "settlement_status == ACCEPTED (else ERR_SETTLEMENT_STATE_INVALID)"
          - "settlement_basis == FINAL (else ERR_SETTLEMENT_BASIS_INVALID)"
          - "every Store of the engagement has store_status IN {CLOSED, SURRENDERED} (else ERR_STORES_NOT_CLOSED)"
          - "every LeaseDisposition of every Store of the engagement has disposition_status IN {SURRENDERED, REJECTED_FINAL} (else ERR_LEASE_NOT_DISPOSED)"
        side_effects:
          - "every ExpenseItem of the engagement with expense_status == APPROVED becomes SETTLED"
          - "owning Engagement transitions WIND_DOWN -> CLOSED"
          - "increments Settlement.version by 1 and Engagement.version by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system event — POST /engagements/{id}/settlements creates a newer Settlement while this one is in {DRAFT, PROPOSED, DISPUTED}"
        actor: system
        preconditions:
          - "settlement_status IN {DRAFT, PROPOSED, DISPUTED}"
        side_effects:
          - "increments Settlement.version by 1"
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "system event — POST /engagements/{id}/settlements creates a newer Settlement"
        actor: system
        preconditions:
          - "settlement_status IN {DRAFT, PROPOSED, DISPUTED}"
        side_effects:
          - "increments Settlement.version by 1"
      - from: DISPUTED
        to: SUPERSEDED
        trigger: "system event — POST /engagements/{id}/settlements creates a newer Settlement"
        actor: system
        preconditions:
          - "settlement_status IN {DRAFT, PROPOSED, DISPUTED}"
        side_effects:
          - "increments Settlement.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: settlement-create-stale-engagement
    parent_entity: Engagement
    write_endpoint: "POST /engagements/{id}/settlements"
    occ_field: "expected_engagement_version"
    description: |
      Creating a Settlement against an Engagement whose version has advanced
      since the client last observed it is rejected. This captures the case
      where a newer Settlement has already been created (which legitimately
      supersedes every prior Settlement still in DRAFT, PROPOSED or DISPUTED),
      so the current writer's view of the engagement ledger is stale.
    error_id: ERR_STALE_ENGAGEMENT_VERSION
    http_status: 412

  - rule_id: markdown-stage-create-stale-store
    parent_entity: Store
    write_endpoint: "POST /stores/{id}/markdown-stages"
    occ_field: "expected_store_version"
    description: |
      Every MarkdownStage create carries expected_store_version, and a create
      against a Store whose version has advanced since the client last observed
      it is rejected. The store's version moves whenever its cadence, inventory,
      licence state or augmentation supply changes, so a stale value means the
      cadence was authored against a view that no longer holds. The rule matters
      most for a supersede_overlapping == true create, which voids every
      overlapping ARMED stage it can see.
    error_id: ERR_STALE_STORE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # ---------------------------------------------------------------------------
  - name: store_projected_recovery_estimate
    trigger: "On InventoryLot creation, on MarkdownStage creation / activation / checkpoint / supersede-void / cascade-close, on AugmentationConsignment receive and return-unsold, and on read of GET /engagements/{id}/recovery-summary"
    algorithm: forward_looking
    formula: |
      # --- shared input: the store's forward-looking planned discount -----------
      planned_set = { MarkdownStage of store where stage_status IN {ARMED, ACTIVE} }
      if planned_set is empty:
          planned_avg_discount_pct = 0.0000            # explicit empty-set rule
      else:
          planned_avg_discount_pct = round_half_up(
              sum(stage.discount_pct for stage in planned_set) / count(planned_set), 4)

      # --- PROJECTED variant (per lot, then summed) -----------------------------
      for lot in { InventoryLot of store where lot_status IN {ON_FLOOR, SOLD_OUT} }:
          projected_units = floor((lot.units_initial - lot.units_returned)
                                  * CATEGORY_SELL_THROUGH_RATE[lot.category])
          lot.projected_recovery_cents = round_half_up(
              projected_units * lot.unit_retail_cents * (1 - planned_avg_discount_pct))
      store.projected_gross_recovery_cents = sum(lot.projected_recovery_cents)   # sum of per-lot rounded values
      store.projected_recovery_ratio = 0.0000 if store.original_cost_value_cents == 0
          else round_half_up(store.projected_gross_recovery_cents / store.original_cost_value_cents, 4)

      # --- REALIZED variant -----------------------------------------------------
      store.realized_gross_recovery_cents = sum(day.net_sales_cents
          for day in SalesDay of store where day_status == POSTED)
      store.realized_recovery_ratio = 0.0000 if store.original_cost_value_cents == 0
          else round_half_up(sum(day.original_net_sales_cents
              for day in SalesDay of store where day_status == POSTED)
              / store.original_cost_value_cents, 4)

      # --- engagement roll-up ---------------------------------------------------
      engagement.projected_gross_recovery_cents = sum(store.projected_gross_recovery_cents
          for store in Store of engagement)
      engagement.projected_shortfall_cents = max(0,
          engagement.guaranty_amount_cents - engagement.projected_gross_recovery_cents)
    input_set: |
      PROJECTED includes InventoryLot rows with lot_status IN {ON_FLOOR, SOLD_OUT} of both
      sources (ORIGINAL and AUGMENTATION) and excludes RETURNED_TO_SUPPLIER lots; it is
      driven by the ARMED/ACTIVE MarkdownStage set only, so a stage that closes or is voided
      leaves the discount average. REALIZED includes only SalesDay rows with
      day_status == POSTED; PENDING_REVIEW and REJECTED days are excluded.
      Denominator of both ratios is Store.original_cost_value_cents (ORIGINAL lots only).
    constants:
      CATEGORY_SELL_THROUGH_RATE:
        APPAREL: 0.85
        FOOTWEAR: 0.80
        HOME: 0.70
        ELECTRONICS: 0.95
        JEWELRY: 0.60
        SEASONAL: 0.90
    precision: "money in integer cents, round_half_up per lot before summation; ratios to 4 decimal places, round_half_up; projected_units uses floor"
    variants:
      - name: PROJECTED
        when: "Reported as Store.projected_gross_recovery_cents / projected_recovery_ratio and in the recovery-summary read; the only variant that feeds Engagement.projected_shortfall_cents"
        difference: "Forward-looking: category sell-through constants applied to units still accounted for, discounted by the average of the ARMED/ACTIVE stage discounts. Ignores every actual sale."
      - name: REALIZED
        when: "Reported as Store.realized_gross_recovery_cents / realized_recovery_ratio and in the recovery-summary read"
        difference: "Chronological: sums POSTED SalesDay money only. For identical stored data the two variants disagree — a store one day into a two-stage cadence shows a projected ratio well above 1.0 and a realized ratio near 0.2."

  # ---------------------------------------------------------------------------
  - name: engagement_settlement_split
    trigger: "POST /settlements/{id}/propose (Settlement DRAFT -> PROPOSED and DISPUTED -> PROPOSED)"
    algorithm: waterfall_allocation
    formula: |
      # ---- STEP 1 (evaluation order is pinned; do not reorder) -----------------
      # The fee rate is keyed on the ORIGINAL-merchandise recovery ratio, while the
      # fee itself is charged on TOTAL gross recovery (original + augmentation), and
      # the expense split is keyed on the fee-independent responsibility model. The
      # dependency therefore only LOOKS circular: ratio -> fee_rate -> fee -> split.
      basis = settlement.settlement_basis
      if basis == FINAL:
          day_set     = { SalesDay of engagement where day_status == POSTED }
          expense_set = { ExpenseItem of engagement where expense_status IN {APPROVED, SETTLED} }
      else:  # PROVISIONAL
          day_set     = { SalesDay of engagement where day_status IN {PENDING_REVIEW, POSTED} }
          expense_set = { ExpenseItem of engagement where expense_status IN {SUBMITTED, APPROVED, SETTLED} }

      original_net_sales_cents = sum(d.original_net_sales_cents for d in day_set)
      gross_recovery_cents     = sum(d.net_sales_cents for d in day_set)
      base                     = engagement.original_cost_value_cents

      # ---- STEP 2: ratio, then tier, then fee ---------------------------------
      recovery_ratio = 0.0000 if base == 0 else round_half_up(original_net_sales_cents / base, 4)
      fee_rate = 0.0200 if recovery_ratio <  0.60 else
                 0.0350 if recovery_ratio <  0.80 else 0.0500      # FEE_TIER_TABLE
      liquidator_fee_cents = round_half_up(gross_recovery_cents * fee_rate)

      # ---- STEP 3: expense responsibility split ------------------------------
      expense_total_cents = sum(e.amount_cents for e in expense_set)
      if engagement.expense_responsibility == LIQUIDATOR:
          liquidator_expense_cents = expense_total_cents
      elif engagement.expense_responsibility == RETAILER:
          liquidator_expense_cents = 0
      else:  # SHARED — round the liquidator side once on the TOTAL, remainder to retailer
          liquidator_expense_cents = round_half_up(
              expense_total_cents * engagement.shared_expense_liquidator_pct)
      retailer_expense_cents = expense_total_cents - liquidator_expense_cents

      # ---- STEP 4: economics model ------------------------------------------
      guaranty_amount_cents = engagement.guaranty_amount_cents      # 0 for FEE_BASED
      if engagement.economics_model == GUARANTEED:
          retailer_proceeds_cents = guaranty_amount_cents - retailer_expense_cents
      elif engagement.economics_model == FEE_BASED:
          retailer_proceeds_cents = gross_recovery_cents - liquidator_fee_cents - retailer_expense_cents
      else:  # HYBRID
          excess = max(0, gross_recovery_cents - liquidator_fee_cents - guaranty_amount_cents)
          retailer_proceeds_cents = (guaranty_amount_cents
              + round_half_up(excess * engagement.hybrid_retailer_excess_pct)
              - retailer_expense_cents)

      # ---- STEP 5: closing identity (conserved quantity) ---------------------
      liquidator_proceeds_cents = gross_recovery_cents - expense_total_cents - retailer_proceeds_cents
      # INVARIANT: retailer_proceeds_cents + liquidator_proceeds_cents + expense_total_cents
      #            == gross_recovery_cents  (exactly, for every model and basis)
      retention_accrual_cents = engagement.retention_accrual_cents  # disclosure line only
    input_set: |
      FINAL basis: POSTED sales days and APPROVED/SETTLED expense items only.
      PROVISIONAL basis: additionally PENDING_REVIEW sales days and SUBMITTED expense items.
      REJECTED sales days and VOIDED expense items are excluded from both bases.
      Engagement.original_cost_value_cents (ORIGINAL lots of all stores) is the ratio
      denominator under both bases.
    constants:
      FEE_TIER_TABLE: "recovery_ratio < 0.60 -> 0.0200; 0.60 <= ratio < 0.80 -> 0.0350; ratio >= 0.80 -> 0.0500"
    precision: "integer cents throughout; round_half_up applied exactly once per money field; recovery_ratio to 4 decimal places"
    variants:
      - name: PROVISIONAL
        when: "settlement_basis == PROVISIONAL; permitted while Engagement.engagement_status == ACTIVE"
        difference: "Wider inclusion set (in-review days + submitted expenses) raises both the ratio and the expense total, so the fee tier, the fee, both expense shares and both proceeds figures differ from FINAL on identical stored data."
      - name: FINAL
        when: "settlement_basis == FINAL; requires Engagement.engagement_status == WIND_DOWN and every store closed"
        difference: "Only ledger-posted facts. This is the only basis a settlement may be finalized under."

  # ---------------------------------------------------------------------------
  - name: markdown_escalation_adjustment
    trigger: "POST /markdown-stages/{id}/checkpoint (MarkdownStage ACTIVE -> CLOSED)"
    algorithm: threshold
    formula: |
      actual   = store.realized_sell_through_pct                    # already 4dp
      shortfall = round_half_up(stage.sell_through_target_pct - actual, 4)
      if shortfall <= 0.0000:
          stage.escalation_applied_pct = 0.0000
          stage.closed_reason = ON_SCHEDULE
          # successor stage discount_pct is left untouched
      else:
          steps = ceil(shortfall / ESCALATION_BAND)                 # integer >= 1
          raise_pct = min(steps * ESCALATION_STEP_PCT, MAX_ESCALATION_PCT)
          stage.escalation_applied_pct = raise_pct
          stage.closed_reason = ESCALATED
          successor = MarkdownStage of store where stage_index == stage.stage_index + 1
                      AND stage_status == ARMED            # at most one such row exists
          if successor exists:
              successor.discount_pct = min(round_half_up(successor.discount_pct + raise_pct, 4),
                                           MAX_DISCOUNT_PCT)
      stage.checkpoint_sell_through_pct = actual
    input_set: "Exactly one successor stage may be adjusted: the store's stage with stage_index == checkpointed index + 1 and stage_status == ARMED. VOIDED and CLOSED stages are never adjusted, and when no such successor exists the escalation is recorded on the checkpointed stage only."
    constants:
      ESCALATION_BAND: 0.05
      ESCALATION_STEP_PCT: 0.05
      MAX_ESCALATION_PCT: 0.20
      MAX_DISCOUNT_PCT: 0.90
    precision: "percentages to 4 decimal places, round_half_up; steps uses ceil"

  # ---------------------------------------------------------------------------
  - name: retention_bonus_settlement
    trigger: "POST /stores/{id}/close-selling cascade hop 3, and POST /employees/{id}/employment-action with action IN {TERMINATE_INVOLUNTARY, TERMINATE_VOLUNTARY} when bonus_status == PENDING"
    algorithm: weighted_scoring
    formula: |
      # settlement_day = Store.selling_end_date for the close-selling cascade,
      #                  logical clock date for an individual termination action.
      required_days = (employee.retention_target_date - employee.retention_start_date).days + 1
      served_days   = (settlement_day - employee.retention_start_date).days + 1
      employee.served_days = max(0, served_days)

      if employee.employment_status == TERMINATED_VOLUNTARY:
          employee.bonus_status = FORFEITED ; employee.earned_bonus_cents = 0
      elif employee.attendance_rate < MIN_ATTENDANCE_RATE:
          employee.bonus_status = FORFEITED ; employee.earned_bonus_cents = 0
      else:
          ratio = min(1.0, employee.served_days / required_days)        # unrounded rational
          employee.earned_bonus_cents = round_half_up(employee.retention_bonus_cents * ratio)
          employee.bonus_status = EARNED if ratio == 1.0 else PRORATED_EARNED

      # ROUNDING ORDER IS PINNED: round per employee first, THEN sum. Summing the
      # unrounded entitlements and rounding once at the end is WRONG and differs by
      # up to (n-1) cents.
      engagement.retention_accrual_cents = sum(e.earned_bonus_cents
          for e in Employee of all stores of engagement
          where e.bonus_status IN {EARNED, PRORATED_EARNED, PAID})
    input_set: "Only employees whose bonus_status == PENDING are settled by a given run; already EARNED, PRORATED_EARNED, FORFEITED and PAID employees are skipped. The accrual sum includes EARNED, PRORATED_EARNED and PAID and excludes FORFEITED and PENDING."
    constants:
      MIN_ATTENDANCE_RATE: 0.90
    precision: "per-employee round_half_up to integer cents, then integer summation (round-then-sum, never sum-then-round)"

  # ---------------------------------------------------------------------------
  - name: augmentation_cap_check
    trigger: "POST /augmentation-consignments/{id}/receive, evaluated before the InventoryLot is created"
    algorithm: threshold
    formula: |
      received_cost = sum(c.cost_value_cents for c in AugmentationConsignment of store
                          where consignment_status IN {RECEIVED, SOLD_OUT})
      returned_cost = sum(c.units_returned * c.unit_cost_cents
                          for c in AugmentationConsignment of store
                          where consignment_status == RETURNED)
      post_receipt_cost = received_cost - returned_cost + this.cost_value_cents
      if store.original_cost_value_cents == 0:
          post_receipt_ratio = 0.0000
      else:
          post_receipt_ratio = round_half_up(post_receipt_cost / store.original_cost_value_cents, 4)
      # cap is inclusive: ratio EQUAL to the cap is accepted, strictly greater is rejected
      if post_receipt_ratio > jurisdiction.max_augmentation_ratio:
          reject with ERR_AUGMENTATION_CAP_EXCEEDED
    input_set: "RECEIVED and SOLD_OUT consignments count at full cost value; RETURNED consignments contribute only their unsold-return offset (i.e. they net out of the cap once returned); PROPOSED and DISCLOSURE_FILED consignments do not count."
    constants:
      CAP_COMPARISON: "post_receipt_ratio > max_augmentation_ratio rejects; == accepts"
    precision: "ratio to 4 decimal places, round_half_up"

  # ---------------------------------------------------------------------------
  - name: sales_day_unit_allocation
    trigger: "POST /sales-days/{id}/review with decision == POST (SalesDay PENDING_REVIEW -> POSTED)"
    algorithm: waterfall_allocation
    formula: |
      # Two independent waterfalls, one per merchandise source. Allocation order is
      # InventoryLot.created_at ASC (never lot id, never category order); when two
      # lots of the same source share created_at to the millisecond, the lot with the
      # lexicographically smaller `category` enum name is filled first.
      for source in [ORIGINAL, AUGMENTATION]:
          remaining = day.original_units_sold if source == ORIGINAL
                      else day.augmentation_units_sold
          candidates = [ lot for lot in InventoryLot of store
                         where lot.source == source AND lot.lot_status == ON_FLOOR ]
                       ordered by (created_at ASC, category ASC)
          if remaining > sum(lot.units_on_hand for lot in candidates):
              reject the whole request with ERR_UNITS_EXCEED_ON_HAND  # no partial posting
          for lot in candidates:
              take = min(remaining, lot.units_on_hand)
              lot.units_sold   += take
              lot.units_on_hand = lot.units_initial - lot.units_sold - lot.units_returned
              if lot.units_on_hand == 0: lot.lot_status = SOLD_OUT
              remaining -= take
              if remaining == 0: break
      day.allocation_note = ordered trace of the takes, e.g. "ORIGINAL:400@<lot>;AUGMENTATION:150@<lot>"
    input_set: "Only lots of the matching source with lot_status == ON_FLOOR are eligible; SOLD_OUT and RETURNED_TO_SUPPLIER lots are skipped. The capacity test is evaluated against the whole candidate set before any lot is mutated, so a rejected posting leaves zero partial writes."
    constants:
      ALLOCATION_ORDER: "created_at ASC, then category enum name ASC"
    precision: "integer units"

  # ---------------------------------------------------------------------------
  - name: expense_responsibility_split
    trigger: "POST /expense-items/{id}/decision with action == APPROVE, and the auto-generated PAYROLL item created by the store close-selling cascade (hop 6)"
    algorithm: aggregation
    formula: |
      if engagement.expense_responsibility == LIQUIDATOR:
          item.liquidator_share_cents = item.amount_cents
      elif engagement.expense_responsibility == RETAILER:
          item.liquidator_share_cents = 0
      else:  # SHARED — PER-ITEM rounding, remainder always to the retailer
          item.liquidator_share_cents = round_half_up(
              item.amount_cents * engagement.shared_expense_liquidator_pct)
      item.retailer_share_cents = item.amount_cents - item.liquidator_share_cents

      # Engagement aggregates over expense_status IN {APPROVED, SETTLED}
      engagement.expense_total_cents            = sum(e.amount_cents)
      engagement.expense_liquidator_share_cents = sum(e.liquidator_share_cents)
      engagement.expense_retailer_share_cents   = sum(e.retailer_share_cents)
      # INVARIANT: expense_total_cents == expense_liquidator_share_cents
      #            + expense_retailer_share_cents, before and after any void
    input_set: "Aggregates include ExpenseItem rows with expense_status IN {APPROVED, SETTLED} and exclude SUBMITTED and VOIDED rows. Note the deliberate asymmetry with engagement_settlement_split's PROVISIONAL basis, which additionally counts SUBMITTED rows but never writes these Engagement fields."
    constants:
      REMAINDER_SIDE: retailer
    precision: "round_half_up once per item on the liquidator side; the retailer side is the exact remainder so no cent is created or destroyed"

  # ---------------------------------------------------------------------------
  - name: lease_surrender_waterfall
    trigger: "POST /lease-dispositions/{id}/surrender (LeaseDisposition AGREED -> SURRENDERED)"
    algorithm: waterfall_allocation
    formula: |
      holdover_days = max(0, (logical_clock_date - lease.surrender_deadline_date).days)
      holdover_penalty_cents = round_half_up(
          lease.daily_holdover_rate_cents * holdover_days * HOLDOVER_MULTIPLIER)
      available_cents = lease.fixture_sale_price_cents + lease.surrender_credit_cents

      buckets = [ (allocated_rent_cents,        lease.rent_arrears_cents),
                  (allocated_cam_cents,         lease.cam_arrears_cents),
                  (allocated_restoration_cents, lease.restoration_cost_cents),
                  (allocated_holdover_cents,    holdover_penalty_cents) ]   # order is fixed
      remaining = available_cents
      for (target, amount) in buckets:
          target    = min(remaining, amount)
          remaining = remaining - target
      claim_total   = rent_arrears_cents + cam_arrears_cents + restoration_cost_cents + holdover_penalty_cents
      allocated_total = allocated_rent_cents + allocated_cam_cents
                        + allocated_restoration_cents + allocated_holdover_cents
      lease.unpaid_landlord_balance_cents = claim_total - allocated_total
      lease.residual_to_retailer_cents    = max(0, available_cents - claim_total)
      # INVARIANTS: allocated_total + residual_to_retailer_cents == available_cents
      #             allocated_total + unpaid_landlord_balance_cents == claim_total
    input_set: "Exactly four buckets in the fixed order rent -> CAM -> restoration -> holdover. available_cents is the realised fixture and equipment sale price plus the retailer's surrender credit; no other source of funds enters the waterfall."
    constants:
      HOLDOVER_MULTIPLIER: 1.5
    precision: "integer cents; round_half_up applied once when computing holdover_penalty_cents, never during allocation"

  # ---------------------------------------------------------------------------
  - name: augmentation_unit_conservation
    trigger: "Recomputed on POST /augmentation-consignments/{id}/receive, on POST /sales-days/{id}/review with decision == POST, and on POST /augmentation-consignments/{id}/return-unsold"
    algorithm: constraint_propagation
    formula: |
      store.augmentation_units_accounted = sum(lot.units_on_hand + lot.units_sold + lot.units_returned
          for lot in InventoryLot of store where lot.source == AUGMENTATION)
      # INVARIANT (must hold after every one of the three triggers above):
      #   store.augmentation_units_accounted
      #     == sum(lot.units_initial for AUGMENTATION lots of the store)
      #     == sum(c.units_supplied for AugmentationConsignment of the store
      #            where consignment_status IN {RECEIVED, RETURNED, SOLD_OUT})
      # and the money mirror:
      #   store.augmentation_cost_value_cents
      #     == sum((lot.units_initial - lot.units_returned) * lot.unit_cost_cents)
    input_set: "AUGMENTATION-source lots of the store in every lot_status, including RETURNED_TO_SUPPLIER — returned units stay accounted for in units_returned, they are not deleted."
    constants:
      CONSERVED_QUANTITY: "sum of units_initial over AUGMENTATION lots of the store"
    precision: "integer units; exact equality, no tolerance"

  # ---------------------------------------------------------------------------
  - name: compliance_posture_derivation
    trigger: "POST /gob-licenses/{id}/revoke, and each licence expiry observed by POST /engagements/{id}/compliance-sweep"
    algorithm: threshold
    formula: |
      engagement.compliance_strike_count += 1        # one strike per licence lost while selling
      engagement.compliance_posture =
          OPEN       if compliance_strike_count == 0
          RESTRICTED if 1 <= compliance_strike_count <= 2
          FROZEN     if compliance_strike_count >= 3
      # Gate semantics:
      #   RESTRICTED blocks POST /augmentation-consignments/{id}/receive and
      #              POST /stores/{id}/markdown-stages (new cadence authoring)
      #   FROZEN     additionally blocks POST /markdown-stages/{id}/activate,
      #              POST /stores/{id}/augmentation-consignments and
      #              POST /engagements/{id}/expense-items
      #   Neither posture ever blocks POST /stores/{id}/close-selling,
      #   POST /sales-days/{id}/review, settlement endpoints or lease endpoints.
    input_set: "Strikes accrue from licence-loss events only (REVOKED via the revoke endpoint, EXPIRED via the sweep). Denials of an APPLIED licence never produce a strike. The counter never decreases; resuming a suspended store does not clear it."
    constants:
      RESTRICTED_AT: 1
      FROZEN_AT: 3
    precision: "integer count; boundary is inclusive at both ends (count == 1 is already RESTRICTED, count == 3 is already FROZEN)"

# =============================================================================
# §1.4 Validation Order Table
# Evaluation is strictly ascending by priority. The first rule whose condition
# holds returns its error and no later rule is evaluated.
# =============================================================================
validations:

  - priority: 10
    category: auth
    rule: "X-User-ID header must be present and non-empty on every endpoint except POST /_clock/set_current_utc"
    error_id: ERR_MISSING_USER_HEADER
    applies_to: all_endpoints

  - priority: 15
    category: auth
    rule: "X-User-ID must resolve to a known actor. Opaque roles use a role prefix followed by a hyphen and a non-empty suffix, so several distinct identities may share one role: lc-* = LiquidationConsultant, rc-* = RetailerController, co-* = ComplianceOfficer, so-* = SystemOperator. The StoreManager role is entity-backed: its X-User-ID is the id of an existing Store. Anything else is an unknown actor"
    error_id: ERR_UNKNOWN_ACTOR
    applies_to: all_endpoints

  - priority: 20
    category: authz
    rule: "The resolved role must be listed in the endpoint's allowed_roles"
    error_id: ERR_UNAUTHORIZED
    applies_to: all_endpoints

  - priority: 25
    category: authz
    rule: "A StoreManager actor may only address a Store it identifies as, or a child row (InventoryLot, MarkdownStage, GobLicense, Employee, SalesDay, AugmentationConsignment, LeaseDisposition, ExpenseItem) whose store_id equals its own store id"
    error_id: ERR_STORE_SCOPE_VIOLATION
    applies_to: "all endpoints whose allowed_roles include StoreManager"

  - priority: 28
    category: authz
    rule: "Segregation of duties: the X-User-ID that submitted a record may not decide it. Applies to POST /engagements/{id}/approval-decision (submitted_by_user_id), POST /sales-days/{id}/review (submitted_by_user_id), POST /expense-items/{id}/decision (submitted_by_user_id), POST /settlements/{id}/response (proposed_by_user_id) and POST /gob-licenses/{id}/decision (applied_by_user_id)"
    error_id: ERR_SELF_APPROVAL_FORBIDDEN
    applies_to: "POST /engagements/{id}/approval-decision, POST /sales-days/{id}/review, POST /expense-items/{id}/decision, POST /settlements/{id}/response, POST /gob-licenses/{id}/decision"
    note: "The check is enforced on all five endpoints, but only the licence decision can actually collide: on the other four the submitting role (LiquidationConsultant or StoreManager) is never the deciding role (RetailerController), whereas both sides of a licence decision are ComplianceOfficer identities."

  - priority: 30
    category: request_shape
    rule: "Body must be a JSON object; every required field present; every field of the declared JSON type; enum fields restricted to the declared enum; percentage fields within their declared range (0 to 1 everywhere except Engagement.guaranty_pct, whose declared range is 0 to 1.5); money and unit fields integers >= 0; dates ISO-8601 (YYYY-MM-DD) and timestamps ISO-8601 UTC with a trailing Z; limit in [1, 200] and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    applies_to: all_endpoints

  - priority: 32
    category: request_shape
    rule: "Date-interval fields must be internally ordered: period_start_date <= period_end_date, window_start_date <= window_end_date, delivery_window_start_date <= delivery_window_end_date, retention_start_date <= retention_target_date"
    error_id: ERR_INVALID_DATE_RANGE
    applies_to: "POST /stores/{id}/gob-licenses, POST /stores/{id}/markdown-stages, POST /stores/{id}/augmentation-consignments, POST /stores/{id}/employees"

  - priority: 35
    category: existence
    rule: "Every path id and every FK in the payload must resolve to an existing row. Path ids are checked before payload FKs; multiple payload FKs are checked in left-to-right declaration order as listed in the endpoint's input"
    error_id: "ERR_ENGAGEMENT_NOT_FOUND | ERR_STORE_NOT_FOUND | ERR_JURISDICTION_NOT_FOUND | ERR_INVENTORY_LOT_NOT_FOUND | ERR_CONSIGNMENT_NOT_FOUND | ERR_MARKDOWN_STAGE_NOT_FOUND | ERR_LICENSE_NOT_FOUND | ERR_EMPLOYEE_NOT_FOUND | ERR_SALES_DAY_NOT_FOUND | ERR_EXPENSE_ITEM_NOT_FOUND | ERR_LEASE_DISPOSITION_NOT_FOUND | ERR_SETTLEMENT_NOT_FOUND"
    applies_to: "all endpoints with a path id or an FK payload field"

  - priority: 37
    category: state
    rule: "Where the endpoint declares an OCC field, the supplied expected_engagement_version / expected_store_version must equal the parent's current version"
    error_id: "ERR_STALE_ENGAGEMENT_VERSION | ERR_STALE_STORE_VERSION"
    applies_to: "POST /engagements/{id}/settlements, POST /stores/{id}/markdown-stages"

  - priority: 40
    category: state
    rule: "The addressed entity must be in a state from which the requested transition is defined (see §1.2). Includes the parent-state gates for child creation: a Store child may only be created while the store is not CLOSED or SURRENDERED, and every engagement child requires engagement_status IN {ACTIVE, WIND_DOWN}"
    error_id: "ERR_ENGAGEMENT_STATE_INVALID | ERR_STORE_NOT_SELLING | ERR_STORE_STATE_INVALID | ERR_LICENSE_STATE_INVALID | ERR_STAGE_STATE_INVALID | ERR_CONSIGNMENT_STATE_INVALID | ERR_EMPLOYEE_STATE_INVALID | ERR_SALES_DAY_STATE_INVALID | ERR_EXPENSE_STATE_INVALID | ERR_LEASE_STATE_INVALID | ERR_SETTLEMENT_STATE_INVALID"
    applies_to: "all state-changing endpoints and all child-creation endpoints"

  - priority: 45
    category: business_safety
    rule: "While Engagement.compliance_posture == FROZEN the engagement is barred from authoring new markdown cadence or new augmentation supply: POST /stores/{id}/markdown-stages, POST /markdown-stages/{id}/activate, POST /stores/{id}/augmentation-consignments, POST /augmentation-consignments/{id}/receive and POST /engagements/{id}/expense-items are all refused"
    error_id: ERR_ENGAGEMENT_COMPLIANCE_FROZEN
    applies_to: "POST /stores/{id}/markdown-stages, POST /markdown-stages/{id}/activate, POST /stores/{id}/augmentation-consignments, POST /augmentation-consignments/{id}/receive, POST /engagements/{id}/expense-items"

  - priority: 46
    category: business_safety
    rule: "While Engagement.compliance_posture == RESTRICTED the narrower gate applies: POST /stores/{id}/markdown-stages and POST /augmentation-consignments/{id}/receive are refused, but activation of an already-authored stage and creation of a proposed consignment remain permitted"
    error_id: ERR_ENGAGEMENT_COMPLIANCE_RESTRICTED
    applies_to: "POST /stores/{id}/markdown-stages, POST /augmentation-consignments/{id}/receive"

  - priority: 52
    category: business_safety
    rule: "A markdown stage may only be activated, a sales day may only be posted, and a suspended store may only be resumed while the store holds a GobLicense with license_status == APPROVED whose period covers that endpoint's effective span. The effective span is endpoint-specific: for POST /markdown-stages/{id}/activate it is the stage's own half-open window, so the licence must satisfy period_start_date <= window_start_date AND period_end_date >= (window_end_date - 1 day); for POST /sales-days/{id}/review it is the single day business_date; for POST /stores/{id}/resume it is the single logical clock date. The rule is conditional: it does not apply in a jurisdiction whose gob_license_required is false"
    error_id: ERR_LICENSE_NOT_ACTIVE
    applies_to: "POST /markdown-stages/{id}/activate, POST /sales-days/{id}/review, POST /stores/{id}/resume"

  - priority: 53
    category: business_safety
    rule: "Augmentation merchandise may not be received until the consignment has cleared disclosure: consignment_status must be DISCLOSURE_FILED when the store's jurisdiction sets augmentation_disclosure_required == true"
    error_id: ERR_AUGMENTATION_DISCLOSURE_MISSING
    applies_to: "POST /augmentation-consignments/{id}/receive"

  - priority: 54
    category: business_safety
    rule: "A licence application's advertising_claim_codes may not intersect the jurisdiction's prohibited_claim_codes"
    error_id: ERR_PROHIBITED_ADVERTISING_CLAIM
    applies_to: "POST /stores/{id}/gob-licenses"

  - priority: 55
    category: business_safety
    rule: "When the store's jurisdiction sets advertising_disclosure_required == true, a licence application that declares an augmentation-bearing claim — exactly the two price-comparison codes BELOW_COST and LOWEST_PRICES_EVER — must also include AUGMENTED_MERCHANDISE_DISCLOSURE in advertising_claim_codes. Applications that declare neither of those two codes are unaffected"
    error_id: ERR_ADVERTISING_DISCLOSURE_REQUIRED
    applies_to: "POST /stores/{id}/gob-licenses"

  - priority: 56
    category: business_safety
    rule: "A consignment may not be proposed at all in a jurisdiction whose augmentation_prohibited flag is true"
    error_id: ERR_AUGMENTATION_PROHIBITED
    applies_to: "POST /stores/{id}/augmentation-consignments"

  - priority: 60
    category: business_temporal
    rule: "A new MarkdownStage window must not overlap an existing ARMED or ACTIVE stage window of the same store. Stage windows are half-open [window_start_date, window_end_date), so back-to-back stages that share a boundary date do not overlap. Overlap is permitted only when supersede_overlapping == true, in which case the overlapped stages are VOIDED"
    error_id: ERR_STAGE_WINDOW_OVERLAP
    applies_to: "POST /stores/{id}/markdown-stages"

  - priority: 61
    category: business_temporal
    rule: "Augmentation delivery windows are closed intervals [delivery_window_start_date, delivery_window_end_date] and a store may have at most MAX_CONCURRENT_DELIVERIES (2) consignments whose windows cover any single calendar day, counting consignments in PROPOSED, DISCLOSURE_FILED and RECEIVED"
    error_id: ERR_DELIVERY_SLOT_CAPACITY
    applies_to: "POST /stores/{id}/augmentation-consignments"

  - priority: 62
    category: business_temporal
    rule: "A new licence application's period_start_date must be at least the jurisdiction's license_cooling_off_days (30) after the period_end_date of the store's most recent non-DENIED licence: (new.period_start_date - prior.period_end_date).days >= license_cooling_off_days"
    error_id: ERR_LICENSE_COOLING_OFF
    applies_to: "POST /stores/{id}/gob-licenses"

  - priority: 63
    category: business_temporal
    rule: "A licence period may not exceed the jurisdiction's max_sale_days, counted inclusively: (period_end_date - period_start_date).days + 1 <= max_sale_days"
    error_id: ERR_LICENSE_PERIOD_TOO_LONG
    applies_to: "POST /stores/{id}/gob-licenses"

  - priority: 64
    category: business_temporal
    rule: "A SalesDay business_date must fall inside the store's selling window: on or after the store's selling_start_date and, when set, on or before its selling_end_date; and it may not be later than the logical clock date"
    error_id: ERR_SALES_DAY_OUT_OF_WINDOW
    applies_to: "POST /stores/{id}/sales-days"

  - priority: 65
    category: business_temporal
    rule: "A store may hold at most one SalesDay per business_date in any status other than REJECTED"
    error_id: ERR_DUPLICATE_SALES_DAY
    applies_to: "POST /stores/{id}/sales-days"

  - priority: 66
    category: business_temporal
    rule: "The notice period must be honoured: (logical clock date - the date the landlord accepted the offer).days >= the jurisdiction's surrender_notice_days"
    error_id: ERR_SURRENDER_NOTICE_SHORT
    applies_to: "POST /lease-dispositions/{id}/surrender"

  - priority: 68
    category: business_constraint
    rule: "MarkdownStage.stage_index must be exactly one greater than the store's highest existing non-VOIDED stage_index (first stage is 1), discount_pct must be strictly greater than that predecessor stage's discount_pct, and discount_pct must not exceed MAX_DISCOUNT_PCT (0.90)"
    error_id: ERR_STAGE_SEQUENCE_INVALID
    applies_to: "POST /stores/{id}/markdown-stages"

  - priority: 69
    category: business_constraint
    rule: "A stage may be activated only if no other stage of the store is ACTIVE"
    error_id: ERR_STAGE_ALREADY_ACTIVE
    applies_to: "POST /markdown-stages/{id}/activate"

  - priority: 70
    category: business_constraint
    rule: "Posting a sales day requires enough eligible inventory: original_units_sold must not exceed the summed units_on_hand of the store's ON_FLOOR ORIGINAL lots and augmentation_units_sold must not exceed the same sum over ON_FLOOR AUGMENTATION lots"
    error_id: ERR_UNITS_EXCEED_ON_HAND
    applies_to: "POST /sales-days/{id}/review"

  - priority: 71
    category: business_constraint
    rule: "units_returned on return-unsold must not exceed the consignment's remaining unsold units (units_supplied - units sold from its lot)"
    error_id: ERR_RETURN_UNITS_EXCEED_UNSOLD
    applies_to: "POST /augmentation-consignments/{id}/return-unsold"

  - priority: 72
    category: business_constraint
    rule: "A fixture and equipment sale below the recorded fixture_reserve_price_cents is refused unless reserve_waived == true"
    error_id: ERR_FIXTURE_BELOW_RESERVE
    applies_to: "POST /lease-dispositions/{id}/surrender"

  - priority: 73
    category: business_constraint
    rule: "A landlord counter may not be answered more than MAX_NEGOTIATION_ROUNDS (3) times: negotiation_round must be < 3 when a further offer is sent"
    error_id: ERR_MAX_NEGOTIATION_ROUNDS
    applies_to: "POST /lease-dispositions/{id}/offer"

  - priority: 74
    category: business_constraint
    rule: "advertising_claim_codes must contain no duplicate codes and at least one code"
    error_id: ERR_DUPLICATE_CLAIM_CODE
    applies_to: "POST /stores/{id}/gob-licenses"

  - priority: 75
    category: business_referential
    rule: "An Engagement may only enter WIND_DOWN when every Store of the engagement has store_status IN {CLOSED, SURRENDERED}"
    error_id: ERR_STORES_NOT_CLOSED
    applies_to: "POST /engagements/{id}/wind-down"

  - priority: 76
    category: business_referential
    rule: "A FINAL settlement may only be finalized when every Store of the engagement has a LeaseDisposition with disposition_status IN {SURRENDERED, REJECTED_FINAL} and no ExpenseItem of the engagement remains SUBMITTED"
    error_id: ERR_LEASE_NOT_DISPOSED
    applies_to: "POST /settlements/{id}/finalize"

  - priority: 77
    category: business_referential
    rule: "Only a FINAL-basis settlement may be finalized; a PROVISIONAL settlement can be proposed and accepted but never finalized. Creating a FINAL settlement requires engagement_status == WIND_DOWN"
    error_id: ERR_SETTLEMENT_BASIS_INVALID
    applies_to: "POST /settlements/{id}/finalize, POST /engagements/{id}/settlements"

  - priority: 78
    category: business_referential
    rule: "At most one Settlement per engagement may be open. Creating a settlement while another is in {DRAFT, PROPOSED, DISPUTED} requires supersede_open == true, which drives the incumbent to SUPERSEDED; without the flag the request is refused, and an incumbent in ACCEPTED is refused even with the flag because ACCEPTED has no SUPERSEDED transition"
    error_id: ERR_SETTLEMENT_ALREADY_OPEN
    applies_to: "POST /engagements/{id}/settlements"

  - priority: 80
    category: business_fiscal
    rule: "Receiving a consignment must not push the store's augmentation cost ratio above the jurisdiction's max_augmentation_ratio (see augmentation_cap_check; equality is accepted)"
    error_id: ERR_AUGMENTATION_CAP_EXCEEDED
    applies_to: "POST /augmentation-consignments/{id}/receive"

  - priority: 82
    category: business_fiscal
    rule: "Engagement economics must be internally consistent: GUARANTEED and HYBRID require guaranty_pct > 0; FEE_BASED requires guaranty_pct == 0; HYBRID requires hybrid_retailer_excess_pct > 0 while GUARANTEED and FEE_BASED require it to be 0; expense_responsibility == SHARED requires shared_expense_liquidator_pct > 0 while LIQUIDATOR and RETAILER require it to be 0"
    error_id: ERR_ECONOMICS_CONFIG_INVALID
    applies_to: "POST /engagements, POST /engagements/{id}/submit-for-approval"

  - priority: 84
    category: business_fiscal
    rule: "A retention bonus may only be paid when bonus_status IN {EARNED, PRORATED_EARNED} and earned_bonus_cents > 0"
    error_id: ERR_BONUS_NOT_EARNED
    applies_to: "POST /employees/{id}/pay-bonus"

  - priority: 86
    category: business_fiscal
    rule: "A sales day's net_sales_cents must equal original_net_sales_cents + augmentation_net_sales_cents, and augmentation_net_sales_cents must be 0 when augmentation_units_sold is 0"
    error_id: ERR_SALES_TOTALS_INCONSISTENT
    applies_to: "POST /stores/{id}/sales-days"

# =============================================================================
# §1.5 API Endpoint Table
# api_prefix is "" — every collection sits at the top level of the path space.
# =============================================================================
endpoints:

  # ------------------------------------------------------------- Jurisdiction
  - method: POST
    path: "/jurisdictions"
    description: "Register a regulatory jurisdiction and its going-out-of-business sale rules"
    roles: [ComplianceOfficer]
    code: 201
    input: [code, name, gob_license_required, max_sale_days, license_cooling_off_days, max_augmentation_ratio, augmentation_disclosure_required, "augmentation_prohibited?", "prohibited_claim_codes?", advertising_disclosure_required, surrender_notice_days]
    output: Jurisdiction
    side_effects: []

  - method: GET
    path: "/jurisdictions/{id}"
    description: "Read one jurisdiction rule set"
    roles: [ComplianceOfficer, LiquidationConsultant, RetailerController]
    code: 200
    input: []
    output: Jurisdiction
    side_effects: []

  # -------------------------------------------------------------- Engagement
  - method: POST
    path: "/engagements"
    description: "Draft an agency agreement between the retailer and the liquidation consultant"
    roles: [LiquidationConsultant]
    code: 201
    input: [retailer_name, liquidator_name, economics_model, guaranty_pct, hybrid_retailer_excess_pct, expense_responsibility, shared_expense_liquidator_pct, sale_start_date, target_end_date]
    output: Engagement
    side_effects:
      - "engagement_status = DRAFT; compliance_strike_count = 0; compliance_posture = OPEN"
      - "validates the economics configuration (§1.4 priority 82)"
      - "all money aggregates initialise to 0"

  - method: GET
    path: "/engagements/{id}"
    description: "Read one engagement including its derived recovery, expense and retention aggregates"
    roles: [LiquidationConsultant, RetailerController, ComplianceOfficer]
    code: 200
    input: []
    output: Engagement
    side_effects: []

  - method: POST
    path: "/engagements/{id}/submit-for-approval"
    description: "Submit the drafted agency agreement to the retailer for approval"
    roles: [LiquidationConsultant]
    code: 200
    input: []
    output: Engagement
    side_effects:
      - "engagement_status DRAFT -> PENDING_RETAILER_APPROVAL"
      - "sets submitted_by_user_id = X-User-ID"
      - "re-validates the economics configuration (§1.4 priority 82)"
      - "increments Engagement.version by 1"

  - method: POST
    path: "/engagements/{id}/approval-decision"
    description: "Retailer approves the agency agreement or returns it for revision; approval starts the sale and cascades store activation"
    roles: [RetailerController]
    code: 200
    input: [decision, "decision_note?"]
    output: Engagement
    side_effects:
      - "decision == APPROVE: engagement_status PENDING_RETAILER_APPROVAL -> ACTIVE"
      - "decision == RETURN_FOR_REVISION: engagement_status PENDING_RETAILER_APPROVAL -> DRAFT"
      - "sets approved_by_user_id = X-User-ID"
      - "on APPROVE, every PLANNED Store moves to LICENSE_PENDING when its jurisdiction requires a licence, else to SELLING with selling_start_date = logical clock date"
      - "refuses when X-User-ID equals submitted_by_user_id (§1.4 priority 28)"
      - "increments Engagement.version by 1"

  - method: POST
    path: "/engagements/{id}/wind-down"
    description: "Move a fully closed engagement into wind-down so a FINAL settlement may be drawn"
    roles: [LiquidationConsultant]
    code: 200
    input: []
    output: Engagement
    side_effects:
      - "engagement_status ACTIVE -> WIND_DOWN"
      - "refuses with ERR_STORES_NOT_CLOSED while any Store is not CLOSED or SURRENDERED"
      - "increments Engagement.version by 1"

  - method: POST
    path: "/engagements/{id}/compliance-sweep"
    description: "Advance the compliance clock: expire licences whose period ended, close markdown stages whose window ended, and re-derive the engagement's compliance posture"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output:
      expired_license_count: integer
      closed_stage_count: integer
      suspended_store_count: integer
      compliance_strike_count: integer
      compliance_posture: string
    side_effects:
      - "every APPROVED GobLicense of the engagement whose period_end_date < logical clock date becomes EXPIRED"
      - "each expiry moves its SELLING Store to SUSPENDED with suspension_reason = LICENSE_EXPIRED and closes that store's ACTIVE stage with closed_reason = LICENSE_LOST"
      - "each expiry increments Engagement.compliance_strike_count by 1 and re-derives compliance_posture (§1.3 compliance_posture_derivation)"
      - "every ACTIVE MarkdownStage whose window_end_date <= logical clock date becomes CLOSED with closed_reason = ON_SCHEDULE and no escalation"
      - "recomputes projected recovery for every affected store and the engagement roll-up"
      - "increments Engagement.version by 1"

  - method: GET
    path: "/engagements/{id}/recovery-summary"
    description: "Computed read of the engagement's projected and realized recovery position side by side"
    roles: [LiquidationConsultant, RetailerController]
    code: 200
    input: []
    output:
      projected_gross_recovery_cents: integer
      projected_recovery_ratio: number
      realized_gross_recovery_cents: integer
      realized_recovery_ratio: number
      planned_avg_discount_pct: number
      projected_shortfall_cents: integer
      guaranty_amount_cents: integer
      original_cost_value_cents: integer
      store_count: integer
    side_effects:
      - "read-only; recomputes both variants of §1.3 store_projected_recovery_estimate at read time"

  - method: POST
    path: "/engagements/{id}/expense-items"
    description: "Record a sale expense against the engagement, optionally charged to one store"
    roles: [LiquidationConsultant, StoreManager]
    code: 201
    input: ["store_id?", expense_category, amount_cents, incurred_date]
    output: ExpenseItem
    side_effects:
      - "expense_status = SUBMITTED; auto_generated = false; sets submitted_by_user_id = X-User-ID"
      - "liquidator_share_cents and retailer_share_cents remain null until the item is approved"
      - "refused while compliance_posture == FROZEN (§1.4 priority 45)"

  - method: GET
    path: "/engagements/{id}/expense-items"
    description: "List the engagement's expense items"
    roles: [LiquidationConsultant, RetailerController]
    code: 200
    input: ["expense_status?", "store_id?", "limit?", "offset?"]
    output: ExpenseItem[]
    side_effects: []

  - method: POST
    path: "/engagements/{id}/settlements"
    description: "Open a settlement worksheet for the engagement; requires the engagement version the client last observed"
    roles: [LiquidationConsultant]
    code: 201
    input: [settlement_basis, expected_engagement_version, "supersede_open?"]
    output: Settlement
    side_effects:
      - "settlement_status = DRAFT; all split figures null until proposed"
      - "refuses with ERR_STALE_ENGAGEMENT_VERSION (412) when expected_engagement_version != Engagement.version"
      - "supersede_open == true drives an incumbent DRAFT/PROPOSED/DISPUTED Settlement to SUPERSEDED; omitted or false with an incumbent open -> ERR_SETTLEMENT_ALREADY_OPEN"
      - "settlement_basis == FINAL requires engagement_status == WIND_DOWN"
      - "increments Engagement.version by 1"

  - method: GET
    path: "/engagements/{id}/settlements"
    description: "List the engagement's settlement worksheets"
    roles: [LiquidationConsultant, RetailerController]
    code: 200
    input: ["settlement_status?", "limit?", "offset?"]
    output: Settlement[]
    side_effects: []

  - method: POST
    path: "/engagements/{id}/stores"
    description: "Add a closing store to the engagement"
    roles: [LiquidationConsultant]
    code: 201
    input: [jurisdiction_id, store_code, address_line]
    output: Store
    side_effects:
      - "store_status = PLANNED; suspension_reason = NONE"
      - "all recovery and unit aggregates initialise to 0 and planned_avg_discount_pct to 0.0000"

  # ------------------------------------------------------------------- Store
  - method: GET
    path: "/stores/{id}"
    description: "Read one closing store with its derived recovery and unit aggregates"
    roles: [LiquidationConsultant, RetailerController, ComplianceOfficer, StoreManager]
    code: 200
    input: []
    output: Store
    side_effects: []

  - method: GET
    path: "/stores"
    description: "List closing stores, filterable by engagement, jurisdiction and status"
    roles: [LiquidationConsultant, RetailerController, ComplianceOfficer]
    code: 200
    input: ["engagement_id?", "jurisdiction_id?", "store_status?", "limit?", "offset?"]
    output: Store[]
    side_effects: []

  - method: POST
    path: "/stores/{id}/inventory-lots"
    description: "Place a merchandise lot on the closing store's selling floor"
    roles: [LiquidationConsultant, StoreManager]
    code: 201
    input: [category, source, units_initial, unit_cost_cents, unit_retail_cents]
    output: InventoryLot
    side_effects:
      - "lot_status = ON_FLOOR; units_sold = 0; units_returned = 0; units_on_hand = units_initial"
      - "cost_value_cents and retail_value_cents computed from units_initial"
      - "source == ORIGINAL updates Store.original_cost_value_cents and Engagement.original_cost_value_cents, and re-derives Engagement.guaranty_amount_cents"
      - "recomputes §1.3 store_projected_recovery_estimate and the engagement roll-up"
      - "source == AUGMENTATION is refused here with ERR_AUGMENTATION_SOURCE_FORBIDDEN — augmentation lots are created only by the consignment receive cascade"

  - method: GET
    path: "/stores/{id}/inventory-lots"
    description: "List the store's merchandise lots"
    roles: [LiquidationConsultant, RetailerController, StoreManager]
    code: 200
    input: ["source?", "lot_status?", "limit?", "offset?"]
    output: InventoryLot[]
    side_effects: []

  - method: POST
    path: "/stores/{id}/gob-licenses"
    description: "File a going-out-of-business sale licence application with the store's jurisdiction"
    roles: [ComplianceOfficer]
    code: 201
    input: [license_number, period_start_date, period_end_date, advertising_claim_codes]
    output: GobLicense
    side_effects:
      - "license_status = APPLIED; sets applied_by_user_id = X-User-ID"
      - "computes requested_days as the inclusive day count of the period"
      - "enforces the jurisdiction's prohibited_claim_codes, advertising disclosure requirement, cooling-off gap and max_sale_days (§1.4 priorities 54, 55, 62, 63)"

  - method: GET
    path: "/stores/{id}/gob-licenses"
    description: "List the store's licence applications and licences"
    roles: [ComplianceOfficer, LiquidationConsultant, RetailerController]
    code: 200
    input: ["license_status?", "limit?", "offset?"]
    output: GobLicense[]
    side_effects: []

  - method: POST
    path: "/stores/{id}/markdown-stages"
    description: "Author the next markdown stage of the store's discount cadence; requires the store version the client last observed"
    roles: [LiquidationConsultant]
    code: 201
    input: [stage_index, discount_pct, sell_through_target_pct, window_start_date, window_end_date, expected_store_version, "supersede_overlapping?"]
    output: MarkdownStage
    side_effects:
      - "stage_status = ARMED; escalation_applied_pct = 0.0000"
      - "refuses with ERR_STALE_STORE_VERSION (412) when expected_store_version != Store.version"
      - "supersede_overlapping == true voids every overlapping ARMED stage of the store with closed_reason = SUPERSEDED; otherwise an overlap is refused (§1.4 priority 60)"
      - "recomputes Store.planned_avg_discount_pct and §1.3 store_projected_recovery_estimate, then the engagement roll-up"
      - "refused while compliance_posture is RESTRICTED or FROZEN (§1.4 priorities 45, 46)"
      - "increments Store.version by 1"

  - method: GET
    path: "/stores/{id}/markdown-stages"
    description: "List the store's markdown cadence"
    roles: [LiquidationConsultant, RetailerController, StoreManager]
    code: 200
    input: ["stage_status?", "limit?", "offset?"]
    output: MarkdownStage[]
    side_effects: []

  - method: POST
    path: "/stores/{id}/augmentation-consignments"
    description: "Propose third-party augmentation merchandise to extend the sale"
    roles: [LiquidationConsultant]
    code: 201
    input: [supplier_name, category, units_supplied, unit_cost_cents, unit_retail_cents, delivery_window_start_date, delivery_window_end_date]
    output: AugmentationConsignment
    side_effects:
      - "consignment_status = PROPOSED; units_returned = 0; cost_value_cents = units_supplied * unit_cost_cents"
      - "refused in a jurisdiction with augmentation_prohibited == true (§1.4 priority 56)"
      - "enforces the closed-interval delivery-window capacity of 2 (§1.4 priority 61)"
      - "refused while compliance_posture == FROZEN (§1.4 priority 45)"

  - method: GET
    path: "/stores/{id}/augmentation-consignments"
    description: "List the store's augmentation consignments"
    roles: [LiquidationConsultant, RetailerController, ComplianceOfficer]
    code: 200
    input: ["consignment_status?", "limit?", "offset?"]
    output: AugmentationConsignment[]
    side_effects: []

  - method: POST
    path: "/stores/{id}/employees"
    description: "Enrol a store employee in the retention-bonus programme"
    roles: [StoreManager, LiquidationConsultant]
    code: 201
    input: [employee_code, retention_bonus_cents, retention_start_date, retention_target_date, attendance_rate]
    output: Employee
    side_effects:
      - "employment_status = ACTIVE; bonus_status = PENDING; earned_bonus_cents = 0; served_days = 0"

  - method: GET
    path: "/stores/{id}/employees"
    description: "List the store's employees with their retention-bonus position"
    roles: [StoreManager, LiquidationConsultant, RetailerController]
    code: 200
    input: ["employment_status?", "bonus_status?", "limit?", "offset?"]
    output: Employee[]
    side_effects: []

  - method: POST
    path: "/stores/{id}/sales-days"
    description: "File one selling day's results for retailer review"
    roles: [StoreManager, LiquidationConsultant]
    code: 201
    input: [business_date, original_net_sales_cents, augmentation_net_sales_cents, original_units_sold, augmentation_units_sold]
    output: SalesDay
    side_effects:
      - "day_status = PENDING_REVIEW; net_sales_cents = original_net_sales_cents + augmentation_net_sales_cents; sets submitted_by_user_id = X-User-ID"
      - "no inventory allocation and no ledger recomputation happen until the day is posted"
      - "enforces the selling-window, duplicate-day and totals-consistency rules (§1.4 priorities 64, 65, 86)"

  - method: GET
    path: "/stores/{id}/sales-days"
    description: "List the store's filed selling days"
    roles: [StoreManager, LiquidationConsultant, RetailerController]
    code: 200
    input: ["day_status?", "limit?", "offset?"]
    output: SalesDay[]
    side_effects: []

  - method: GET
    path: "/stores/{id}/expense-items"
    description: "List the expense items charged to this store"
    roles: [LiquidationConsultant, RetailerController, StoreManager]
    code: 200
    input: ["expense_status?", "limit?", "offset?"]
    output: ExpenseItem[]
    side_effects: []

  - method: POST
    path: "/stores/{id}/lease-dispositions"
    description: "Open a landlord surrender negotiation for the store's lease"
    roles: [LiquidationConsultant]
    code: 201
    input: [landlord_name, surrender_deadline_date, daily_holdover_rate_cents, rent_arrears_cents, cam_arrears_cents, restoration_cost_cents, fixture_reserve_price_cents, surrender_credit_cents]
    output: LeaseDisposition
    side_effects:
      - "disposition_status = DRAFT; negotiation_round = 0; every allocation and penalty field is null"

  - method: GET
    path: "/stores/{id}/lease-dispositions"
    description: "List the store's lease dispositions"
    roles: [LiquidationConsultant, RetailerController]
    code: 200
    input: ["disposition_status?", "limit?", "offset?"]
    output: LeaseDisposition[]
    side_effects: []

  - method: POST
    path: "/stores/{id}/close-selling"
    description: "End the store's going-out-of-business sale; drives the six-hop wind-down cascade"
    roles: [LiquidationConsultant]
    code: 200
    input: []
    output: Store
    side_effects:
      - "hop 1: store_status SELLING|SUSPENDED -> CLOSED; selling_end_date = logical clock date; realized_sell_through_pct frozen"
      - "hop 2: every ARMED or ACTIVE MarkdownStage of the store becomes CLOSED with closed_reason = STORE_CLOSED and no escalation"
      - "hop 3: every Employee of the store with bonus_status == PENDING is settled by §1.3 retention_bonus_settlement against selling_end_date and, when still employed, moves to TERMINATED_INVOLUNTARY with termination_date = selling_end_date"
      - "hop 4: Engagement.retention_accrual_cents re-summed round-then-sum over all stores"
      - "hop 5: when the store's earned bonus sum is greater than 0, one auto_generated ExpenseItem is created (expense_category = PAYROLL, expense_status = APPROVED, amount_cents = that sum, store_id = this store); a zero sum creates no item"
      - "hop 6: that item is split by §1.3 expense_responsibility_split and the three Engagement expense aggregates are updated"
      - "recomputes §1.3 store_projected_recovery_estimate and the engagement roll-up"
      - "increments Store.version by 1 and Engagement.version by 1"

  - method: POST
    path: "/stores/{id}/suspend"
    description: "Suspend selling at the store on a compliance hold"
    roles: [ComplianceOfficer]
    code: 200
    input: ["suspension_reason?"]
    output: Store
    side_effects:
      - "store_status SELLING -> SUSPENDED with suspension_reason = COMPLIANCE_HOLD unless another reason is supplied"
      - "the store's ACTIVE MarkdownStage becomes CLOSED with closed_reason = LICENSE_LOST"
      - "recomputes Store.planned_avg_discount_pct, §1.3 store_projected_recovery_estimate and the engagement roll-up"
      - "does NOT increment Engagement.compliance_strike_count — only licence loss produces a strike"
      - "increments Store.version by 1"

  - method: POST
    path: "/stores/{id}/resume"
    description: "Resume selling at a suspended store"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Store
    side_effects:
      - "store_status SUSPENDED -> SELLING; suspension_reason = NONE"
      - "requires an APPROVED GobLicense covering the logical clock date when the jurisdiction requires a licence (§1.4 priority 52 analogue)"
      - "does not reopen the stages closed by the suspension and does not clear compliance_strike_count"
      - "increments Store.version by 1"

  # -------------------------------------------------------------- InventoryLot
  - method: GET
    path: "/inventory-lots/{id}"
    description: "Read one inventory lot with its unit counts and projected recovery"
    roles: [LiquidationConsultant, RetailerController, StoreManager]
    code: 200
    input: []
    output: InventoryLot
    side_effects: []

  # -------------------------------------------------------------- GobLicense
  - method: GET
    path: "/gob-licenses/{id}"
    description: "Read one going-out-of-business sale licence"
    roles: [ComplianceOfficer, LiquidationConsultant, RetailerController]
    code: 200
    input: []
    output: GobLicense
    side_effects: []

  - method: POST
    path: "/gob-licenses/{id}/decision"
    description: "Record the regulator's approval or denial of a licence application"
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "decision_reason?"]
    output: GobLicense
    side_effects:
      - "decision == APPROVE: license_status APPLIED -> APPROVED; decision == DENY: APPLIED -> DENIED"
      - "sets decided_by_user_id = X-User-ID"
      - "on APPROVE, a LICENSE_PENDING Store moves to SELLING with selling_start_date = logical clock date"
      - "on DENY the store stays LICENSE_PENDING and no compliance strike is recorded"
      - "refuses when X-User-ID equals applied_by_user_id (§1.4 priority 28)"

  - method: POST
    path: "/gob-licenses/{id}/revoke"
    description: "Regulator revokes an approved licence; drives the five-hop compliance cascade"
    roles: [ComplianceOfficer]
    code: 200
    input: [revoked_reason]
    output: GobLicense
    side_effects:
      - "hop 1: license_status APPROVED -> REVOKED and revoked_reason recorded"
      - "hop 2: the licensed Store, if SELLING, moves to SUSPENDED with suspension_reason = LICENSE_REVOKED"
      - "hop 3: because the store left SELLING, its ACTIVE MarkdownStage becomes CLOSED with closed_reason = LICENSE_LOST and escalation_applied_pct = 0.0000"
      - "hop 4: because that stage left the ARMED/ACTIVE set, Store.planned_avg_discount_pct, projected_gross_recovery_cents and projected_recovery_ratio are recomputed"
      - "hop 5: because the store's projection changed, Engagement.projected_gross_recovery_cents and projected_shortfall_cents are recomputed"
      - "separately (fan-out, not part of the chain): Engagement.compliance_strike_count increments by 1 and compliance_posture is re-derived (§1.3 compliance_posture_derivation)"
      - "increments Store.version by 1 and Engagement.version by 1"

  # ------------------------------------------------------------ MarkdownStage
  - method: GET
    path: "/markdown-stages/{id}"
    description: "Read one markdown stage of a store's discount cadence"
    roles: [LiquidationConsultant, RetailerController, StoreManager]
    code: 200
    input: []
    output: MarkdownStage
    side_effects: []

  - method: POST
    path: "/markdown-stages/{id}/activate"
    description: "Put an armed markdown stage into effect on the selling floor"
    roles: [LiquidationConsultant]
    code: 200
    input: []
    output: MarkdownStage
    side_effects:
      - "stage_status ARMED -> ACTIVE; activated_at = logical clock instant"
      - "requires the store to be SELLING and to hold an APPROVED licence covering the logical clock date (§1.4 priorities 40, 52)"
      - "refuses with ERR_STAGE_ALREADY_ACTIVE when another stage of the store is ACTIVE"
      - "refused while compliance_posture == FROZEN, but permitted while RESTRICTED (§1.4 priorities 45, 46)"
      - "leaves Store.planned_avg_discount_pct unchanged, since ARMED and ACTIVE are both in the planned set"

  - method: POST
    path: "/markdown-stages/{id}/checkpoint"
    description: "Close an active stage against its sell-through target and escalate the next stage's markdown when the target was missed"
    roles: [LiquidationConsultant]
    code: 200
    input: []
    output: MarkdownStage
    side_effects:
      - "stage_status ACTIVE -> CLOSED; checkpoint_sell_through_pct = Store.realized_sell_through_pct"
      - "applies §1.3 markdown_escalation_adjustment: escalation_applied_pct and closed_reason (ON_SCHEDULE when the target was met, ESCALATED otherwise)"
      - "when escalated and an ARMED successor stage exists, that successor's discount_pct increases by escalation_applied_pct, capped at MAX_DISCOUNT_PCT"
      - "recomputes Store.planned_avg_discount_pct, §1.3 store_projected_recovery_estimate and the engagement roll-up"
      - "increments Store.version by 1"

  # -------------------------------------------------- AugmentationConsignment
  - method: GET
    path: "/augmentation-consignments/{id}"
    description: "Read one augmentation consignment"
    roles: [LiquidationConsultant, RetailerController, ComplianceOfficer]
    code: 200
    input: []
    output: AugmentationConsignment
    side_effects: []

  - method: GET
    path: "/augmentation-consignments/{id}/inventory-lots"
    description: "List the inventory lots created from this consignment; the only discovery channel for cascade-created augmentation lots"
    roles: [LiquidationConsultant, RetailerController, StoreManager]
    code: 200
    input: ["lot_status?", "limit?", "offset?"]
    output: InventoryLot[]
    side_effects: []

  - method: POST
    path: "/augmentation-consignments/{id}/file-disclosure"
    description: "File the augmented-merchandise disclosure the jurisdiction requires before augmentation goods may be received"
    roles: [ComplianceOfficer]
    code: 200
    input: [disclosure_reference]
    output: AugmentationConsignment
    side_effects:
      - "consignment_status PROPOSED -> DISCLOSURE_FILED; disclosure_filed_at = logical clock instant"
      - "no inventory is created and no cap check runs at disclosure time"

  - method: POST
    path: "/augmentation-consignments/{id}/receive"
    description: "Receive the consigned goods onto the selling floor, subject to the jurisdiction's augmentation cap"
    roles: [LiquidationConsultant]
    code: 200
    input: []
    output: AugmentationConsignment
    side_effects:
      - "evaluates §1.3 augmentation_cap_check BEFORE any write; a breach returns ERR_AUGMENTATION_CAP_EXCEEDED and creates nothing"
      - "consignment_status PROPOSED|DISCLOSURE_FILED -> RECEIVED"
      - "creates exactly one InventoryLot with source = AUGMENTATION, consignment_id = this consignment, units_initial = units_supplied and the consignment's unit prices; discoverable only via GET /augmentation-consignments/{id}/inventory-lots"
      - "updates Store.augmentation_cost_value_cents, units_initial_total and augmentation_units_accounted (§1.3 augmentation_unit_conservation)"
      - "recomputes §1.3 store_projected_recovery_estimate and the engagement roll-up; Store.original_cost_value_cents is NOT changed"
      - "refused when the disclosure is required but not filed (§1.4 priority 53) and while compliance_posture is RESTRICTED or FROZEN (§1.4 priorities 45, 46)"
      - "increments Store.version by 1"

  - method: POST
    path: "/augmentation-consignments/{id}/return-unsold"
    description: "Compensating action: send unsold consigned goods back to the supplier and unwind their contribution to the cap and the projection"
    roles: [LiquidationConsultant]
    code: 200
    input: [units_returned]
    output: AugmentationConsignment
    side_effects:
      - "consignment_status RECEIVED -> RETURNED; units_returned recorded"
      - "the consignment's InventoryLot gains units_returned, loses the same units_on_hand, and becomes RETURNED_TO_SUPPLIER when units_on_hand reaches 0"
      - "the lot's cost_value_cents and retail_value_cents shrink to (units_initial - units_returned) * unit price"
      - "Store.augmentation_cost_value_cents and units_initial_total shrink accordingly while augmentation_units_accounted stays equal to the sum of units_initial (§1.3 augmentation_unit_conservation)"
      - "recomputes §1.3 store_projected_recovery_estimate and the engagement roll-up"
      - "refuses with ERR_RETURN_UNITS_EXCEED_UNSOLD when units_returned exceeds the lot's units_on_hand"
      - "increments Store.version by 1"

  # ---------------------------------------------------------------- Employee
  - method: GET
    path: "/employees/{id}"
    description: "Read one employee's employment and retention-bonus position"
    roles: [StoreManager, LiquidationConsultant, RetailerController]
    code: 200
    input: []
    output: Employee
    side_effects: []

  - method: POST
    path: "/employees/{id}/employment-action"
    description: "Advance the employment dimension of the employee state machine: give notice or terminate"
    roles: [StoreManager, LiquidationConsultant]
    code: 200
    input: [action]
    output: Employee
    side_effects:
      - "action == GIVE_NOTICE: employment_status ACTIVE -> NOTICE_GIVEN; notice_given_date = logical clock date; bonus_status stays PENDING"
      - "action == TERMINATE_INVOLUNTARY: employment_status -> TERMINATED_INVOLUNTARY; termination_date = logical clock date"
      - "action == TERMINATE_VOLUNTARY: employment_status -> TERMINATED_VOLUNTARY; termination_date = logical clock date"
      - "either termination settles a PENDING bonus_status through §1.3 retention_bonus_settlement against the logical clock date and re-sums Engagement.retention_accrual_cents"
      - "TERMINATE_VOLUNTARY always forfeits, whatever the served days or attendance rate"
      - "no auto ExpenseItem is created by an individual termination — only the store close-selling cascade creates one"

  - method: POST
    path: "/employees/{id}/pay-bonus"
    description: "Pay an earned retention bonus"
    roles: [RetailerController]
    code: 200
    input: []
    output: Employee
    side_effects:
      - "bonus_status EARNED|PRORATED_EARNED -> PAID; bonus_paid_at = logical clock instant"
      - "earned_bonus_cents is unchanged, so Engagement.retention_accrual_cents is unchanged (PAID stays inside the accrual set)"
      - "refuses with ERR_BONUS_NOT_EARNED for a PENDING or FORFEITED bonus"

  # ---------------------------------------------------------------- SalesDay
  - method: POST
    path: "/sales-days/{id}/review"
    description: "Retailer posts or rejects a filed selling day; posting allocates units across lots and moves the ledger"
    roles: [RetailerController]
    code: 200
    input: [decision, "reject_reason?"]
    output: SalesDay
    side_effects:
      - "decision == POST: day_status PENDING_REVIEW -> POSTED; posted_at = logical clock instant; reviewed_by_user_id = X-User-ID"
      - "on POST, §1.3 sales_day_unit_allocation consumes units from the store's ON_FLOOR lots per source in created_at ASC order and writes allocation_note; a lot whose units_on_hand reaches 0 becomes SOLD_OUT and, for an augmentation lot, its consignment becomes SOLD_OUT"
      - "on POST, Store.units_sold_total, realized_sell_through_pct, realized_gross_recovery_cents and realized_recovery_ratio are recomputed, then the engagement's sales aggregates"
      - "on POST, requires an APPROVED licence covering business_date (§1.4 priority 52) and enough units on hand (§1.4 priority 70) — a shortfall rejects the whole request with no partial allocation"
      - "decision == REJECT: day_status PENDING_REVIEW -> REJECTED; reviewed_by_user_id = X-User-ID; no allocation and no ledger movement"
      - "refuses when X-User-ID equals submitted_by_user_id (§1.4 priority 28)"
      - "increments Store.version by 1 on POST"

  # ------------------------------------------------------------- ExpenseItem
  - method: GET
    path: "/expense-items/{id}"
    description: "Read one expense item with its liquidator and retailer shares"
    roles: [LiquidationConsultant, RetailerController]
    code: 200
    input: []
    output: ExpenseItem
    side_effects: []

  - method: POST
    path: "/expense-items/{id}/decision"
    description: "Retailer approves or voids an expense item; approval splits it per the agreement's expense responsibility"
    roles: [RetailerController]
    code: 200
    input: [action, "decision_note?"]
    output: ExpenseItem
    side_effects:
      - "action == APPROVE: expense_status SUBMITTED -> APPROVED; §1.3 expense_responsibility_split writes liquidator_share_cents and retailer_share_cents; the three Engagement expense aggregates increase"
      - "action == VOID: expense_status SUBMITTED|APPROVED -> VOIDED; both share fields reset to null; the three Engagement expense aggregates are reduced by exactly the amounts the approval added, restoring expense_total_cents == expense_liquidator_share_cents + expense_retailer_share_cents"
      - "sets decided_by_user_id = X-User-ID"
      - "refuses when X-User-ID equals submitted_by_user_id (§1.4 priority 28)"
      - "increments Engagement.version by 1"

  # -------------------------------------------------------- LeaseDisposition
  - method: GET
    path: "/lease-dispositions/{id}"
    description: "Read one lease disposition with its surrender waterfall allocations"
    roles: [LiquidationConsultant, RetailerController]
    code: 200
    input: []
    output: LeaseDisposition
    side_effects: []

  - method: POST
    path: "/lease-dispositions/{id}/offer"
    description: "Send or re-send a surrender payment offer to the landlord"
    roles: [LiquidationConsultant]
    code: 200
    input: [offered_surrender_payment_cents]
    output: LeaseDisposition
    side_effects:
      - "disposition_status DRAFT|LANDLORD_COUNTERED -> OFFER_SENT"
      - "negotiation_round increments by 1; offered_surrender_payment_cents recorded"
      - "refuses with ERR_MAX_NEGOTIATION_ROUNDS once negotiation_round has reached MAX_NEGOTIATION_ROUNDS (3)"

  - method: POST
    path: "/lease-dispositions/{id}/landlord-response"
    description: "Record the landlord's counter, acceptance or final rejection of the surrender offer"
    roles: [LiquidationConsultant]
    code: 200
    input: [response, "landlord_counter_amount_cents?"]
    output: LeaseDisposition
    side_effects:
      - "response == COUNTER: disposition_status OFFER_SENT -> LANDLORD_COUNTERED; landlord_counter_amount_cents recorded; the cycle may return to OFFER_SENT"
      - "response == ACCEPT: OFFER_SENT -> AGREED; agreed_surrender_payment_cents = offered_surrender_payment_cents; landlord_agreed_date = logical clock date"
      - "response == REJECT: OFFER_SENT -> REJECTED_FINAL, a terminal state that still satisfies the settlement's lease-disposal precondition"

  - method: POST
    path: "/lease-dispositions/{id}/surrender"
    description: "Deliver possession, sell the fixtures and equipment, and run the landlord surrender waterfall"
    roles: [LiquidationConsultant]
    code: 200
    input: [fixture_sale_price_cents, "reserve_waived?"]
    output: LeaseDisposition
    side_effects:
      - "disposition_status AGREED -> SURRENDERED; surrendered_at = logical clock instant"
      - "refuses with ERR_FIXTURE_BELOW_RESERVE when fixture_sale_price_cents < fixture_reserve_price_cents unless reserve_waived == true"
      - "refuses with ERR_SURRENDER_NOTICE_SHORT when fewer than the jurisdiction's surrender_notice_days have passed since landlord_agreed_date"
      - "computes holdover_days and holdover_penalty_cents, then §1.3 lease_surrender_waterfall over the four ordered buckets, writing the four allocations, unpaid_landlord_balance_cents and residual_to_retailer_cents"
      - "the owning Store moves CLOSED -> SURRENDERED"
      - "increments Store.version by 1"

  # ------------------------------------------------------------- Settlement
  - method: GET
    path: "/settlements/{id}"
    description: "Read one settlement worksheet with the full split between retailer and liquidator"
    roles: [LiquidationConsultant, RetailerController]
    code: 200
    input: []
    output: Settlement
    side_effects: []

  - method: POST
    path: "/settlements/{id}/propose"
    description: "Compute the settlement split for the worksheet's basis and put it to the retailer"
    roles: [LiquidationConsultant]
    code: 200
    input: []
    output: Settlement
    side_effects:
      - "settlement_status DRAFT|DISPUTED -> PROPOSED; computed_at = logical clock instant; proposed_by_user_id = X-User-ID"
      - "runs §1.3 engagement_settlement_split for the worksheet's settlement_basis, writing gross_recovery_cents, original_net_sales_cents, recovery_ratio, fee_rate, liquidator_fee_cents, guaranty_amount_cents, expense_total_cents, liquidator_expense_cents, retailer_expense_cents, retailer_proceeds_cents, liquidator_proceeds_cents and retention_accrual_cents"
      - "a re-propose after a dispute recomputes every figure from current data, so intervening postings change the numbers"

  - method: POST
    path: "/settlements/{id}/response"
    description: "Retailer accepts or disputes the proposed settlement"
    roles: [RetailerController]
    code: 200
    input: [response, "dispute_reason?"]
    output: Settlement
    side_effects:
      - "response == ACCEPT: settlement_status PROPOSED -> ACCEPTED"
      - "response == DISPUTE: settlement_status PROPOSED -> DISPUTED; dispute_reason recorded; dispute_round increments by 1"
      - "refuses when X-User-ID equals proposed_by_user_id (§1.4 priority 28)"

  - method: POST
    path: "/settlements/{id}/finalize"
    description: "Finalize the accepted final settlement, settle the approved expenses and close the engagement"
    roles: [LiquidationConsultant]
    code: 200
    input: []
    output: Settlement
    side_effects:
      - "settlement_status ACCEPTED -> FINALIZED"
      - "refuses with ERR_SETTLEMENT_BASIS_INVALID for a PROVISIONAL worksheet"
      - "refuses with ERR_LEASE_NOT_DISPOSED unless every Store has a LeaseDisposition in SURRENDERED or REJECTED_FINAL and no ExpenseItem of the engagement is still SUBMITTED"
      - "every APPROVED ExpenseItem of the engagement becomes SETTLED"
      - "the owning Engagement moves WIND_DOWN -> CLOSED"
      - "increments Engagement.version by 1"

  # --------------------------------------------------- test-driving endpoint
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time, so every licence period, delivery window, stage window, retention period and holdover computation is deterministic."
    roles: [SystemOperator]
    code: 200
    input: [current_utc]
    output:
      current_utc: string
    side_effects:
      - "sets the logical clock; performs no compliance evaluation of its own — expiries are observed by POST /engagements/{id}/compliance-sweep"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # ------------------------------------------------------------ auth / authz
  - id: ERR_MISSING_USER_HEADER
    http: 401
    condition: "X-User-ID header absent or empty on any endpoint other than POST /_clock/set_current_utc"
  - id: ERR_UNKNOWN_ACTOR
    http: 401
    condition: "X-User-ID does not resolve to a declared role identity, or a StoreManager id that matches no existing Store"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not in the endpoint's roles list"
  - id: ERR_STORE_SCOPE_VIOLATION
    http: 403
    condition: "A StoreManager addresses a Store other than its own, or a child row whose store_id is not its own store"
  - id: ERR_SELF_APPROVAL_FORBIDDEN
    http: 403
    condition: "The X-User-ID deciding a record is the same id that submitted, applied for or proposed it (engagement approval, sales-day review, expense decision, licence decision, settlement response)"

  # ---------------------------------------------------------- request shape
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, wrong JSON type, unknown enum value, negative money or unit value, percentage outside [0, 1], malformed date or timestamp, or limit/offset outside the allowed range"
  - id: ERR_INVALID_DATE_RANGE
    http: 400
    condition: "An interval field pair is inverted: period_end_date < period_start_date, window_end_date < window_start_date, delivery_window_end_date < delivery_window_start_date, or retention_target_date < retention_start_date"

  # --------------------------------------------------------------- not found
  - id: ERR_JURISDICTION_NOT_FOUND
    http: 404
    condition: "No Jurisdiction with the supplied id"
  - id: ERR_ENGAGEMENT_NOT_FOUND
    http: 404
    condition: "No Engagement with the supplied id"
  - id: ERR_STORE_NOT_FOUND
    http: 404
    condition: "No Store with the supplied id"
  - id: ERR_INVENTORY_LOT_NOT_FOUND
    http: 404
    condition: "No InventoryLot with the supplied id"
  - id: ERR_CONSIGNMENT_NOT_FOUND
    http: 404
    condition: "No AugmentationConsignment with the supplied id"
  - id: ERR_MARKDOWN_STAGE_NOT_FOUND
    http: 404
    condition: "No MarkdownStage with the supplied id"
  - id: ERR_LICENSE_NOT_FOUND
    http: 404
    condition: "No GobLicense with the supplied id"
  - id: ERR_EMPLOYEE_NOT_FOUND
    http: 404
    condition: "No Employee with the supplied id"
  - id: ERR_SALES_DAY_NOT_FOUND
    http: 404
    condition: "No SalesDay with the supplied id"
  - id: ERR_EXPENSE_ITEM_NOT_FOUND
    http: 404
    condition: "No ExpenseItem with the supplied id"
  - id: ERR_LEASE_DISPOSITION_NOT_FOUND
    http: 404
    condition: "No LeaseDisposition with the supplied id"
  - id: ERR_SETTLEMENT_NOT_FOUND
    http: 404
    condition: "No Settlement with the supplied id"

  # ------------------------------------------------------------- uniqueness
  - id: ERR_DUPLICATE_JURISDICTION_CODE
    http: 409
    condition: "A Jurisdiction already exists with the supplied code"
  - id: ERR_DUPLICATE_STORE_CODE
    http: 409
    condition: "The engagement already has a Store with the supplied store_code"
  - id: ERR_DUPLICATE_EMPLOYEE_CODE
    http: 409
    condition: "The store already has an Employee with the supplied employee_code"
  - id: ERR_DUPLICATE_SALES_DAY
    http: 409
    condition: "The store already has a SalesDay for the supplied business_date in a status other than REJECTED"
  - id: ERR_DUPLICATE_CLAIM_CODE
    http: 400
    condition: "advertising_claim_codes is empty or contains the same claim code twice"

  # ------------------------------------------------------ concurrency (OCC)
  - id: ERR_STALE_ENGAGEMENT_VERSION
    http: 412
    condition: "expected_engagement_version on POST /engagements/{id}/settlements does not equal the engagement's current version"
  - id: ERR_STALE_STORE_VERSION
    http: 412
    condition: "expected_store_version on POST /stores/{id}/markdown-stages does not equal the store's current version"

  # ------------------------------------------------------------ state errors
  - id: ERR_ENGAGEMENT_STATE_INVALID
    http: 409
    condition: "The engagement is not in a state from which the requested transition or child creation is defined (e.g. adding a store to a CLOSED engagement, submitting an ACTIVE engagement for approval)"
  - id: ERR_STORE_NOT_SELLING
    http: 409
    condition: "An operation that requires an actively selling store was addressed to a store that is not SELLING (markdown activation, compliance suspension)"
  - id: ERR_STORE_STATE_INVALID
    http: 409
    condition: "The store is not in a state from which the requested transition or child creation is defined (e.g. resuming a SELLING store, closing a PLANNED store, adding a lot to a SURRENDERED store)"
  - id: ERR_LICENSE_STATE_INVALID
    http: 409
    condition: "The licence is not APPLIED when a decision is recorded, or not APPROVED when a revocation is attempted"
  - id: ERR_STAGE_STATE_INVALID
    http: 409
    condition: "The markdown stage is not ARMED when activation is attempted, or not ACTIVE when a checkpoint is attempted"
  - id: ERR_CONSIGNMENT_STATE_INVALID
    http: 409
    condition: "The consignment is not PROPOSED when a disclosure is filed, not PROPOSED or DISCLOSURE_FILED when receipt is attempted, or not RECEIVED when a return is attempted"
  - id: ERR_EMPLOYEE_STATE_INVALID
    http: 409
    condition: "The requested employment action is not defined from the employee's current employment_status (e.g. GIVE_NOTICE on an already terminated employee)"
  - id: ERR_SALES_DAY_STATE_INVALID
    http: 409
    condition: "The sales day is no longer PENDING_REVIEW when a review decision is submitted"
  - id: ERR_EXPENSE_STATE_INVALID
    http: 409
    condition: "The expense item is already VOIDED or SETTLED when a decision is submitted, or already APPROVED when approval is repeated"
  - id: ERR_LEASE_STATE_INVALID
    http: 409
    condition: "The requested lease action is not defined from the disposition's current status (e.g. surrendering a DRAFT disposition, answering a landlord response before an offer was sent)"
  - id: ERR_SETTLEMENT_STATE_INVALID
    http: 409
    condition: "The requested settlement action is not defined from the worksheet's current status (e.g. responding to a DRAFT worksheet, finalizing a PROPOSED one, proposing a SUPERSEDED one)"

  # -------------------------------------------------- compliance gate errors
  - id: ERR_ENGAGEMENT_COMPLIANCE_FROZEN
    http: 409
    condition: "compliance_posture == FROZEN (three or more licence-loss strikes) blocks new markdown authoring, stage activation, new consignments, consignment receipt and new expense items"
  - id: ERR_ENGAGEMENT_COMPLIANCE_RESTRICTED
    http: 409
    condition: "compliance_posture == RESTRICTED (one or two strikes) blocks new markdown authoring and consignment receipt while still allowing activation of an already-armed stage and creation of a proposed consignment"

  # ------------------------------------------ licence and advertising errors
  - id: ERR_LICENSE_NOT_ACTIVE
    http: 409
    condition: "The store holds no APPROVED GobLicense whose period covers the effective date, in a jurisdiction where gob_license_required is true"
  - id: ERR_LICENSE_COOLING_OFF
    http: 409
    condition: "The new licence period starts fewer than license_cooling_off_days after the period_end_date of the store's most recent non-DENIED licence"
  - id: ERR_LICENSE_PERIOD_TOO_LONG
    http: 400
    condition: "The inclusive day count of the licence period exceeds the jurisdiction's max_sale_days"
  - id: ERR_PROHIBITED_ADVERTISING_CLAIM
    http: 409
    condition: "advertising_claim_codes contains a code listed in the jurisdiction's prohibited_claim_codes"
  - id: ERR_ADVERTISING_DISCLOSURE_REQUIRED
    http: 409
    condition: "advertising_disclosure_required is true for the store's jurisdiction and the application declares BELOW_COST or LOWEST_PRICES_EVER without also declaring AUGMENTED_MERCHANDISE_DISCLOSURE"

  # --------------------------------------------------- augmentation errors
  - id: ERR_AUGMENTATION_PROHIBITED
    http: 409
    condition: "A consignment was proposed for a store in a jurisdiction whose augmentation_prohibited flag is true"
  - id: ERR_AUGMENTATION_DISCLOSURE_MISSING
    http: 409
    condition: "Receipt was attempted on a PROPOSED consignment in a jurisdiction whose augmentation_disclosure_required flag is true"
  - id: ERR_AUGMENTATION_CAP_EXCEEDED
    http: 422
    condition: "Receiving the consignment would push the store's augmentation cost ratio strictly above the jurisdiction's max_augmentation_ratio; a ratio exactly equal to the cap is accepted"
  - id: ERR_AUGMENTATION_SOURCE_FORBIDDEN
    http: 400
    condition: "POST /stores/{id}/inventory-lots was called with source == AUGMENTATION; augmentation lots are created only by the consignment receive cascade"
  - id: ERR_DELIVERY_SLOT_CAPACITY
    http: 409
    condition: "A third consignment's closed delivery-window interval covers a calendar day already covered by two PROPOSED, DISCLOSURE_FILED or RECEIVED consignments of the store"
  - id: ERR_RETURN_UNITS_EXCEED_UNSOLD
    http: 422
    condition: "units_returned exceeds the units still on hand in the consignment's InventoryLot"

  # ------------------------------------------------ markdown cadence errors
  - id: ERR_STAGE_WINDOW_OVERLAP
    http: 409
    condition: "The new stage's half-open window overlaps an ARMED or ACTIVE stage window of the store and supersede_overlapping was not set; windows that merely touch at a boundary date do not overlap"
  - id: ERR_STAGE_SEQUENCE_INVALID
    http: 422
    condition: "stage_index is not exactly one more than the store's highest non-VOIDED stage_index, or discount_pct is not strictly greater than the predecessor's, or discount_pct exceeds MAX_DISCOUNT_PCT"
  - id: ERR_STAGE_ALREADY_ACTIVE
    http: 409
    condition: "Another markdown stage of the same store is already ACTIVE"

  # ------------------------------------------------------- sales day errors
  - id: ERR_SALES_DAY_OUT_OF_WINDOW
    http: 422
    condition: "business_date falls before the store's selling_start_date, after its selling_end_date, or after the logical clock date"
  - id: ERR_SALES_TOTALS_INCONSISTENT
    http: 422
    condition: "net_sales_cents does not equal original_net_sales_cents + augmentation_net_sales_cents, or augmentation money was reported with zero augmentation units"
  - id: ERR_UNITS_EXCEED_ON_HAND
    http: 422
    condition: "Posting the day would consume more units of a source than the store's ON_FLOOR lots of that source hold; the whole posting is refused with no partial allocation"

  # ------------------------------------------------- retention bonus errors
  - id: ERR_BONUS_NOT_EARNED
    http: 409
    condition: "Payment was attempted on a bonus whose bonus_status is PENDING, FORFEITED or already PAID, or whose earned_bonus_cents is 0"

  # ----------------------------------------------- lease disposition errors
  - id: ERR_MAX_NEGOTIATION_ROUNDS
    http: 409
    condition: "A further surrender offer was sent after negotiation_round already reached MAX_NEGOTIATION_ROUNDS (3)"
  - id: ERR_FIXTURE_BELOW_RESERVE
    http: 422
    condition: "fixture_sale_price_cents is below fixture_reserve_price_cents and reserve_waived was not set to true"
  - id: ERR_SURRENDER_NOTICE_SHORT
    http: 409
    condition: "Fewer than the jurisdiction's surrender_notice_days have elapsed between landlord_agreed_date and the logical clock date"

  # ---------------------------------------------------- settlement errors
  - id: ERR_STORES_NOT_CLOSED
    http: 409
    condition: "Wind-down was requested while at least one Store of the engagement is not CLOSED or SURRENDERED"
  - id: ERR_SETTLEMENT_ALREADY_OPEN
    http: 409
    condition: "A Settlement of the engagement is already in DRAFT, PROPOSED or DISPUTED and supersede_open was not set, or the incumbent is ACCEPTED (which cannot be superseded)"
  - id: ERR_SETTLEMENT_BASIS_INVALID
    http: 409
    condition: "Finalization was attempted on a PROVISIONAL worksheet, or a FINAL worksheet was created while the engagement is not in WIND_DOWN"
  - id: ERR_LEASE_NOT_DISPOSED
    http: 409
    condition: "Finalization was attempted while some Store has no LeaseDisposition in SURRENDERED or REJECTED_FINAL, or while some ExpenseItem of the engagement is still SUBMITTED"

  # ----------------------------------------------------- economics config
  - id: ERR_ECONOMICS_CONFIG_INVALID
    http: 422
    condition: "The engagement's economics fields contradict its economics_model or expense_responsibility (guaranty_pct, hybrid_retailer_excess_pct or shared_expense_liquidator_pct set when it must be 0, or 0 when it must be positive)"

# =============================================================================
# §1.7 RBAC Matrix — role_model: segregation_of_duties
# Opaque roles are addressed by a prefixed X-User-ID (lc-*, rc-*, co-*, so-*), so
# one role may have several distinct identities — which is what makes the priority
# 28 segregation-of-duties rule testable within a single role. StoreManager is
# entity-backed: its X-User-ID is the id of the Store it manages.
# =============================================================================
roles:

  - name: LiquidationConsultant
    description: "The retail liquidation consultant acting as the retailer's agent: authors the agency agreement, the store list, the inventory, the markdown cadence, the augmentation supply, the lease negotiation and the settlement worksheet"
    identity: opaque
    exclusive_operations:
      - "POST /engagements — draft the agency agreement"
      - "POST /engagements/{id}/submit-for-approval"
      - "POST /engagements/{id}/wind-down"
      - "POST /engagements/{id}/stores"
      - "POST /engagements/{id}/settlements"
      - "POST /stores/{id}/markdown-stages"
      - "POST /markdown-stages/{id}/activate"
      - "POST /markdown-stages/{id}/checkpoint"
      - "POST /stores/{id}/augmentation-consignments"
      - "POST /augmentation-consignments/{id}/receive"
      - "POST /augmentation-consignments/{id}/return-unsold"
      - "POST /stores/{id}/close-selling"
      - "POST /stores/{id}/lease-dispositions"
      - "POST /lease-dispositions/{id}/offer"
      - "POST /lease-dispositions/{id}/landlord-response"
      - "POST /lease-dispositions/{id}/surrender"
      - "POST /settlements/{id}/propose"
      - "POST /settlements/{id}/finalize"
    shared_operations:
      - "POST /stores/{id}/inventory-lots (with StoreManager)"
      - "POST /stores/{id}/employees (with StoreManager)"
      - "POST /stores/{id}/sales-days (with StoreManager)"
      - "POST /engagements/{id}/expense-items (with StoreManager)"
      - "all GET reads except GET /jurisdictions/{id} being also open to RetailerController"

  - name: RetailerController
    description: "The closing retailer's controller: the approval and money-decision side of the segregation of duties — approves the agreement, posts sales days, decides expenses, pays retention bonuses and answers settlement proposals"
    identity: opaque
    exclusive_operations:
      - "POST /engagements/{id}/approval-decision"
      - "POST /sales-days/{id}/review"
      - "POST /expense-items/{id}/decision"
      - "POST /employees/{id}/pay-bonus"
      - "POST /settlements/{id}/response"
    shared_operations:
      - "GET /engagements/{id}, GET /engagements/{id}/recovery-summary, GET /engagements/{id}/expense-items, GET /engagements/{id}/settlements"
      - "GET /stores, GET /stores/{id} and every store sub-resource list"
      - "GET /jurisdictions/{id}, GET /inventory-lots/{id}, GET /gob-licenses/{id}, GET /markdown-stages/{id}, GET /augmentation-consignments/{id}, GET /employees/{id}, GET /expense-items/{id}, GET /lease-dispositions/{id}, GET /settlements/{id}"

  - name: ComplianceOfficer
    description: "Licensing and advertising regulator liaison: registers jurisdictions, files and decides going-out-of-business licence applications, revokes licences, files augmentation disclosures, suspends and resumes stores, and runs the compliance sweep"
    identity: opaque
    exclusive_operations:
      - "POST /jurisdictions"
      - "POST /stores/{id}/gob-licenses"
      - "POST /gob-licenses/{id}/decision"
      - "POST /gob-licenses/{id}/revoke"
      - "POST /augmentation-consignments/{id}/file-disclosure"
      - "POST /stores/{id}/suspend"
      - "POST /stores/{id}/resume"
      - "POST /engagements/{id}/compliance-sweep"
    shared_operations:
      - "GET /jurisdictions/{id}, GET /engagements/{id}, GET /stores, GET /stores/{id}"
      - "GET /stores/{id}/gob-licenses, GET /stores/{id}/augmentation-consignments, GET /gob-licenses/{id}, GET /augmentation-consignments/{id}"

  - name: StoreManager
    description: "Manager of one closing store: files that store's inventory, employees, selling days and store-level expenses, and reads only that store's data"
    identity: "entity_backed:Store"
    exclusive_operations: []
    shared_operations:
      - "POST /stores/{id}/inventory-lots (with LiquidationConsultant)"
      - "POST /stores/{id}/employees (with LiquidationConsultant)"
      - "POST /stores/{id}/sales-days (with LiquidationConsultant)"
      - "POST /employees/{id}/employment-action (with LiquidationConsultant)"
      - "POST /engagements/{id}/expense-items (with LiquidationConsultant)"
      - "GET /stores/{id} and the store's inventory-lots, markdown-stages, employees, sales-days, expense-items lists, plus GET /inventory-lots/{id}, GET /markdown-stages/{id}, GET /employees/{id} and GET /augmentation-consignments/{id}/inventory-lots — all restricted to its own store by §1.4 priority 25"

  - name: SystemOperator
    description: "Operational identity that drives the logical clock for deterministic licence, window, retention and holdover evaluation"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations: []
