  # ===========================================================================
  # RULE 9 / 9 — compensating_invariant
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: program_cash_conserved_across_transfer_request_and_return
        grounds:
          - state_machines.PortabilityTransfer.REQUESTED_to_RETURNED
          - entities.PortabilityTransfer.fields.in_transit_cents
          - entities.ParticipantAccount.fields.balance_cents
          - entities.ParticipantAccount.fields.contribution_basis_cents
          - calculations.portability_settlement_math
          - calculations.account_posture_derivation
        distinguishing_aspect: |
          The conserved quantity is PROGRAM CASH: account balance_cents plus the sum of
          in_transit_cents over non-terminal transfers stays at exactly 1200000 before, during and
          after the round trip, and the compensating return must also unwind the 6000-cent fee,
          the 50000-cent withholding and the 500000-cent basis debit with no residue. An
          implementation that returns only the net 944000 instead of the full 1000000, or that
          keeps the fee, leaves the invariant short by 56000 cents.
