# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml - Water Heater Manufacturing Plant
# §1.8 Test Targeting Index. Nine §0.5 Difficulty Rules, >= 2 differentiated
# instances each. Every `grounds:` ref resolves into SCAFFOLD.yaml §1.1-§1.7.
# Every literal in `assert:` was computed by executing the §1.3 formula.
# The logical clock starts at its mandatory default 2026-08-01T00:00:00Z.
# =============================================================================

scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: tank_failure_rate_cohort_naive_vs_exposure_weighted
        grounds:
          - calculations.tank_failure_rate_by_period
          - calculations.water_hardness_band_factor
          - calculations.unit_months_in_service
          - entities.HeaterUnit.fields.hardness_factor
          - endpoints[GET /mfg/product-models/{id}/warranty-analysis]
        distinguishing_aspect: >
          The two variants divide the SAME one TANK_LEAK claim by two different denominators over the
          SAME two-unit 2026-08 cohort: cohort_naive divides by the unit head-count (2) while
          exposure_weighted divides by sum(months_in_service * hardness_factor) = 5*1.80 + 3*0.80 = 11.40,
          so the identical rows report 500000.0 ppm and 87719.3 ppm respectively - a 6.4x divergence that
          no shared scale factor can explain.
        test_recipe:
          setup:
            - "Model GX50-T is CERTIFIED and RELEASED; tank lot TL-001 is RELEASED with good_quantity 120."
            - "Unit u1 shipped at 2026-08-05T06:00:00Z into VERY_HARD water (12.0 gpg, factor 1.80)."
            - "Unit u2 shipped at 2026-10-05T06:00:00Z into SOFT water (2.0 gpg, factor 0.80)."
            - "The logical clock is 2027-02-01T00:00:00Z, so u1 has 5 months in service and u2 has 3."
            - "Exactly one TANK_LEAK claim exists, filed against u1 and VALIDATED."
          setup_api_calls:
            - call: "POST /mfg/suppliers"
              payload: { name: "Meridian Controls", component_category: "GAS_VALVE", audit_score: 96, defect_ppm: 1000, open_capa_count: 0 }
              as: SupplierQualityManager
              captures: { s1_id: $.data.id }
            - call: "POST /mfg/suppliers/${s1_id}/qualify"
              payload: { audit_score: 96, defect_ppm: 1000, open_capa_count: 0, qualified_until: "2027-06-30T00:00:00Z" }
              as: SupplierQualityManager

            - call: "POST /mfg/suppliers"
              payload: { name: "Aegis Safety", component_category: "TP_RELIEF_VALVE", audit_score: 92, defect_ppm: 1500, open_capa_count: 1 }
              as: SupplierQualityManager
              captures: { s2_id: $.data.id }
            - call: "POST /mfg/suppliers/${s2_id}/qualify"
              payload: { audit_score: 92, defect_ppm: 1500, open_capa_count: 1, qualified_until: "2027-06-30T00:00:00Z" }
              as: SupplierQualityManager

            - call: "POST /mfg/component-lots"
              payload: { supplier_id: "${s1_id}", part_number: "GV-880", category: "GAS_VALVE", quantity: 50, certificate_of_conformance: true }
              as: SupplierQualityManager
              captures: { cl_gas_id: $.data.id }
            - call: "POST /mfg/component-lots/${cl_gas_id}/release"
              payload: {}
              as: QualityInspector
            - call: "POST /mfg/component-lots"
              payload: { supplier_id: "${s2_id}", part_number: "TP-150", category: "TP_RELIEF_VALVE", quantity: 50, certificate_of_conformance: true }
              as: SupplierQualityManager
              captures: { cl_tp_id: $.data.id }
            - call: "POST /mfg/component-lots/${cl_tp_id}/release"
              payload: {}
              as: QualityInspector

            - call: "POST /mfg/product-models"
              payload: { model_code: "GX50-T", fuel_type: "GAS", nominal_capacity_gallons: 50, channel: "TRADE", insulation_r_value: 20, is_private_label: false }
              as: ComplianceEngineer
              captures: { m1_id: $.data.id }

            - call: "POST /mfg/test-cells"
              payload: { cell_code: "CELL-1", parallel_slots: 2, cooldown_hours: 12 }
              as: PlantAdmin
              captures: { cell1_id: $.data.id }

            - call: "POST /mfg/efficiency-tests"
              payload: { product_model_id: "${m1_id}", test_cell_id: "${cell1_id}", test_type: "UEF", sample_size: 3, window_start: "2026-08-02T06:00:00Z", window_end: "2026-08-02T10:00:00Z" }
              as: ComplianceEngineer
              captures: { t1_id: $.data.id }
            - call: "POST /mfg/efficiency-tests"
              payload: { product_model_id: "${m1_id}", test_cell_id: "${cell1_id}", test_type: "UEF", sample_size: 3, window_start: "2026-08-02T22:00:00Z", window_end: "2026-08-03T02:00:00Z" }
              as: ComplianceEngineer
              captures: { t2_id: $.data.id }
            - call: "POST /mfg/efficiency-tests"
              payload: { product_model_id: "${m1_id}", test_cell_id: "${cell1_id}", test_type: "UEF", sample_size: 3, window_start: "2026-08-03T14:00:00Z", window_end: "2026-08-03T18:00:00Z" }
              as: ComplianceEngineer
              captures: { t3_id: $.data.id }
            - call: "POST /mfg/efficiency-tests"
              payload: { product_model_id: "${m1_id}", test_cell_id: "${cell1_id}", test_type: "FIRST_HOUR_RATING", sample_size: 3, window_start: "2026-08-04T06:00:00Z", window_end: "2026-08-04T10:00:00Z" }
              as: ComplianceEngineer
              captures: { t4_id: $.data.id }
            - call: "POST /mfg/efficiency-tests"
              payload: { product_model_id: "${m1_id}", test_cell_id: "${cell1_id}", test_type: "RECOVERY", sample_size: 3, window_start: "2026-08-04T22:00:00Z", window_end: "2026-08-05T02:00:00Z" }
              as: ComplianceEngineer
              captures: { t5_id: $.data.id }
            - call: "POST /mfg/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T06:00:00Z" }
              as: PlantAdmin
            - call: "POST /mfg/efficiency-tests/${t1_id}/record-result"
              payload: { measured_value: 0.5850 }
              as: QualityInspector
            - call: "POST /mfg/efficiency-tests/${t2_id}/record-result"
              payload: { measured_value: 0.5850 }
              as: QualityInspector
            - call: "POST /mfg/efficiency-tests/${t3_id}/record-result"
              payload: { measured_value: 0.5840 }
              as: QualityInspector
            - call: "POST /mfg/efficiency-tests/${t4_id}/record-result"
              payload: { measured_value: 62.5 }
              as: QualityInspector
            - call: "POST /mfg/efficiency-tests/${t5_id}/record-result"
              payload: { measured_value: 41.25 }
              as: QualityInspector

            - call: "GET /mfg/product-models/${m1_id}"
              payload: {}
              as: ComplianceEngineer
              captures: { m1_v: $.data.version }
            - call: "POST /mfg/rating-certifications"
              payload: { product_model_id: "${m1_id}", expected_product_model_version: "${m1_v}" }
              as: ComplianceEngineer
              captures: { cert1_id: $.data.id }
            - call: "POST /mfg/rating-certifications/${cert1_id}/submit"
              payload: {}
              as: ComplianceEngineer
              as_user_id: "eng-1"
            - call: "POST /mfg/rating-certifications/${cert1_id}/approve"
              payload: { effective_date: "2026-08-05T00:00:00Z" }
              as: CertificationApprover
              as_user_id: "appr-1"

            - call: "POST /mfg/product-models/${m1_id}/release-to-channel"
              payload: {}
              as: ComplianceEngineer

            - call: "POST /mfg/furnaces"
              payload: { furnace_code: "FURN-A", max_firing_temp_c: 900 }
              as: PlantAdmin
              captures: { furn_id: $.data.id }
            - call: "POST /mfg/glass-lining-batches"
              payload: { furnace_id: "${furn_id}", batch_code: "GLB-001", slurry_mix_code: "SLR-7", firing_temp_c: 840, firing_start: "2026-08-02T06:00:00Z", firing_end: "2026-08-02T10:00:00Z" }
              as: PlantOperator
              captures: { glb_id: $.data.id }
            - call: "POST /mfg/glass-lining-batches/${glb_id}/fire"
              payload: {}
              as: PlantOperator

            - call: "POST /mfg/tank-lots"
              payload: { product_model_id: "${m1_id}", lot_code: "TL-001", planned_quantity: 120 }
              as: PlantOperator
              captures: { tl_id: $.data.id }
            - call: "POST /mfg/tank-lots/${tl_id}/weld"
